base_translation:
  language: en
  yaml_path: translation/ot/job/027/010.yaml
  text: Will he delight himself in the Almighty? Will he call on God at all times?[a][b]
translation:
  language: hi
  text: क्या वह सर्वशक्तिमान में आनन्द लेगा? क्या वह हर समय परमेश्वर को पुकारेगा?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “यदि वह सर्वशक्तिमान में आनन्द ले”; यहाँ इब्रानी अव्यय एक आलंकारिक प्रश्न प्रस्तुत करता है।'
    reason: lexical_alternative
  - marker: b
    text: “पुकारेगा” का अनुवाद “आह्वान करेगा” या “प्रार्थना करेगा” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: क्या ... ?
  rationale: यहाँ אִם किसी शर्त का आरम्भ नहीं करता, बल्कि भक्तिहीन व्यक्ति के विषय में आलंकारिक प्रश्न प्रस्तुत करता है; हिन्दी में प्रश्नवाचक रचना इस संवादगत अर्थ को स्वाभाविक रूप से व्यक्त करती है।
- source_word: עַל
  choice: में
  rationale: התענג के साथ यह उस व्यक्ति को सूचित करता है जिसमें आनन्द पाया जाता है; हिन्दी में ‘सर्वशक्तिमान में आनन्द पाना’ अर्थ और काव्यात्मक गरिमा दोनों बनाए रखता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: यह परमेश्वर की उपाधि है; इसे लिप्यंतरित करने के बजाय अर्थानुसार अनूदित किया गया है।
- source_word: יִתְעַנָּג
  choice: आनन्द पाएगा
  rationale: हित्पएल रूप स्वयं आनन्द लेने या सुख पाने का भाव देता है। ‘आनन्द पाएगा’ आधुनिक हिन्दी में स्वाभाविक है और मूल भाव सुरक्षित रखता है।
- source_word: יִקְרָא
  choice: पुकारेगा
  rationale: परमेश्वर को कर्म के रूप में लेकर קרא प्रार्थनापूर्वक पुकारने अथवा आह्वान करने को व्यक्त करता है; ‘पुकारेगा’ इस अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यहाँ एकवचन ईश्वरीय संज्ञा है; किसी अतिरिक्त उपाधि या अर्थ-विस्तार के बिना ‘परमेश्वर’ उपयुक्त है।
- source_word: בְּכָל עֵת
  choice: हर समय
  rationale: यह वाक्यांश निरन्तर अथवा प्रत्येक अवसर पर किए जाने का व्यापक भाव देता है; ‘हर समय’ स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय उपाधि שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दै
  rationale: यह नाम के बजाय ईश्वरीय उपाधि के रूप में प्रयुक्त है, इसलिए अर्थानुसार अनुवाद पाठकों के लिए अधिक सुलभ है और मूल की भूमिका बनाए रखता है।
- issue: אִם की प्रश्नवाचक शक्ति
  choice: दो आलंकारिक प्रश्न
  alternative: यदि वह सर्वशक्तिमान में आनन्द पाए...
  rationale: सन्दर्भ में यह भक्तिहीन व्यक्ति के आचरण पर प्रश्न उठाता है; इसे शर्त मानने से वाक्य अपूर्ण प्रतीत होगा। फिर भी अधिक शाब्दिक सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और काव्यात्मक प्रश्नवाचक शैली रखी गई है। ‘आनन्द पाएगा’ तथा ‘पुकारेगा’ सामान्य पाठक के लिए सुबोध हैं; मूल की सम्भावित शाब्दिक और अर्थगत विविधताएँ पाद-टिप्पणियों में दी गई हैं।
