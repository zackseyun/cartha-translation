lexical_decisions:
- source_word: תַּשִּׂיגֵהוּ
  choice: उसे आ घेरती हैं
  rationale: हिफ़ील रूप यहाँ विपत्तियों के किसी व्यक्ति तक पहुँचकर उसे धर लेने का भाव देता है। ‘आ घेरती हैं’ पीछा करती विपत्ति और उसके अभिभूत कर देने वाले प्रभाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כַמַּיִם
  choice: जलधाराओं के समान
  rationale: इब्रानी बहुवचन ‘जल’ की प्रबल, उमड़ती हुई छवि रखता है। हिंदी में ‘जलधाराओं’ से बहुवचन और बहाकर ले जाने वाली शक्ति दोनों स्पष्ट होते हैं; ‘बाढ़’ अधिक व्याख्यात्मक विकल्प है।
- source_word: בַּלָּהוֹת
  choice: भयावह घटनाएँ
  rationale: यह शब्द आतंक उत्पन्न करने वाली भयानक बातों या आकस्मिक विभीषिकाओं को सूचित करता है। ‘भयावह घटनाएँ’ आधुनिक हिंदी में बोधगम्य है और केवल मन के ‘भय’ तक अर्थ को सीमित नहीं करता।
- source_word: לַיְלָה
  choice: रात में
  rationale: संज्ञा यहाँ क्रियाविशेषणवत् प्रयुक्त है; ‘रात में’ सीधा और स्वाभाविक हिंदी रूप है।
- source_word: גְּנָבַתּוּ
  choice: उसे चुरा ले जाती है
  rationale: גנב का मूल अर्थ ‘चुराना’ है। आँधी के कर्ता होने पर यह अचानक और गुप्त रीति से उठा ले जाने की काव्यात्मक छवि बनाए रखता है।
- source_word: סוּפָה
  choice: आँधी
  rationale: यह शब्द प्रचंड तूफ़ान या बवंडर का द्योतक है। ‘आँधी’ सामान्य आधुनिक हिंदी में हिंसक वायु-तूफ़ान को सहजता से व्यक्त करती है, जबकि ‘बवंडर’ अधिक विशिष्ट है।
