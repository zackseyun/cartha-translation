- source_word: יִשְׂאוּ יָחַד
  choice: भी उसके साथ … रखा जाता
  rationale: मूल में अनिर्दिष्ट बहुवचन कर्ता के साथ ‘उठाना/ले जाना’ और ‘एक साथ’ है। तौलने के प्रसंग में हिन्दी का कर्मवाच्य ‘उसके साथ रखा जाता’ स्वाभाविक रूप से बताता है कि संताप और विपत्ति दोनों को साथ तौला जाए।
