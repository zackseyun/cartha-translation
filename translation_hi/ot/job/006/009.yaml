translation:
  language: hi
  text: काश परमेश्वर मुझे कुचलने को तैयार हो जाए[a], अपना हाथ ढीला छोड़ दे[b], और मेरा अंत कर दे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे कुचलना उसे अच्छा लगे।” इब्रानी क्रिया इच्छा, सहमति या तत्परता व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “अपना हाथ ढीला छोड़ दे”; यह प्रहार करने के लिए रोक हटा लेने का चित्र है।
    reason: cultural_note
  - marker: c
    text: या, “मुझे काट डाले” अथवा “मुझे पूरी तरह समाप्त कर दे।” इब्रानी शब्द निर्णायक रूप से काट देने या अंत कर देने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאֵל
  choice: तैयार हो जाए
  rationale: हिफ़िल रूप इच्छा, सहमति या तत्परता व्यक्त करता है। इच्छा-सूचक प्रसंग में यह स्वाभाविक हिन्दी है और परमेश्वर की इच्छा के भाव को बनाए रखता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में यह परमेश्वर के लिए प्रयुक्त सामान्य एकवचन संज्ञा है; लिप्यंतरण आवश्यक नहीं है।
- source_word: וִידַכְּאֵנִי
  choice: मुझे कुचलने
  rationale: पिएल रूप दबाकर तोड़ने या कुचलने का प्रबल, विनाशकारी भाव देता है; ‘कुचलने’ से विलाप की तीव्रता बनी रहती है।
- source_word: יַתֵּר
  choice: खुला छोड़ दे
  rationale: क्रिया का मूल भाव ढीला करने या बंधन हटाने का है। ‘हाथ’ के साथ यह प्रहार करने से अपना रोक हटा लेने का चित्र प्रस्तुत करती है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: मूल पाठ की मूर्त, मानव-सदृश अभिव्यक्ति को बनाए रखता है और दैवी कार्य को अनावश्यक रूप से अमूर्त नहीं बनाता।
- source_word: וִיבַצְּעֵנִי
  choice: मेरा अंत कर दे
  rationale: क्रिया काट देने या अलग कर देने से निर्णायक समाप्ति का भाव दे सकती है। मृत्यु की कामना के इस प्रसंग में ‘मेरा अंत कर दे’ स्वाभाविक हिन्दी में उसकी अंतिमता व्यक्त करता है, जबकि पादटिप्पणी काटने के मूल बिंब को सुरक्षित रखती है।
theological_decisions:
- issue: परमेश्वर के कार्य के लिए मानव-सदृश ‘हाथ’ का चित्र
  choice: ‘अपना हाथ’ को मुख्य पाठ में बनाए रखा गया है।
  alternative: ‘अपनी शक्ति’ या ‘अपना दंड’
  rationale: इब्रानी पाठ दैवी सक्रियता को मूर्त चित्र द्वारा व्यक्त करता है। इसे बनाए रखने से अय्यूब की विनती की भावनात्मक शक्ति सुरक्षित रहती है, बिना यह मानने के कि परमेश्वर का भौतिक शरीर है।
- issue: अय्यूब की मृत्यु की कामना की तीव्रता
  choice: ‘कुचलने’ और ‘मेरा अंत कर दे’ के स्पष्ट शब्द बनाए रखे गए हैं।
  alternative: पीड़ा से छुड़ा दे
  rationale: मूल पाठ अय्यूब की इच्छा को नरम नहीं करता; वह निर्णायक विनाश की याचना करता है। अनुवाद उस तनाव को किसी अधिक भक्तिपरक या सांत्वनापूर्ण कथन में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘काश’ इच्छा-सूचक वाक्य को स्वाभाविक बनाता है; ‘कुचलने’ विलाप की कठोरता बनाए रखता है। ‘अपना हाथ खुला छोड़ दे’ मूल बिंब को सुरक्षित रखता है, और पादटिप्पणी उसके मुहावरेदार आशय को स्पष्ट करती है।
