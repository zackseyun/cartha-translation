  text: You would even cast lots over the fatherless[b][a], and bargain over your friend.
translation:
  language: hi
  text: 'तुम तो अनाथ के लिए भी चिट्ठी डालते हो,[a]

    और अपने मित्र का सौदा करते हो।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम अनाथ पर भी चिट्ठी डालते हो।” हिब्रू मुहावरा शाब्दिक रूप से ‘अनाथ पर गिराना’ कहता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और अपने मित्र के लिए गड्ढा खोदते हो।” यहाँ प्रयुक्त हिब्रू क्रिया का अर्थ कठिन है; अनेक विद्वान इसे मित्र का सौदा करने या उसका शोषण करने के अर्थ में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף
  choice: तो ... भी
  rationale: यहाँ אַף आरोप को तीखा करते हुए चौंकाने वाली हद व्यक्त करता है; हिंदी में ‘तो ... भी’ स्वाभाविक रूप से यही बल देता है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: יָתוֹם पिता-विहीन अथवा अनाथ व्यक्ति को दर्शाता है। ‘अनाथ’ आधुनिक हिंदी में सहज है और उसकी सामाजिक असुरक्षा को बनाए रखता है।
- source_word: תַּפִּילוּ
  choice: चिट्ठी डालते
  rationale: נפל के हिफ़ील रूप और עַל का यह प्रयोग किसी पर/किसी के लिए चिट्ठी डालने के मुहावरे के रूप में समझा जा सकता है। ‘चिट्ठी डालना’ हिंदी में भाग निर्धारित करने के लिए lot डालने का स्वाभाविक बाइबलीय पद है।
- source_word: תִכְרוּ
  choice: सौदा करते हो
  rationale: यह कठिन क्रिया यहाँ समानांतर पंक्ति में किसी मित्र को लाभ की वस्तु मानकर उससे सौदेबाज़ी करने या उसका शोषण करने का भाव दे सकती है। मूल की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: רֵיעֲכֶם
  choice: अपने मित्र
  rationale: רֵעַ का अर्थ मित्र, साथी या पड़ोसी हो सकता है। अय्यूब द्वारा अपने साथियों को सीधे उलाहना देने के संदर्भ में ‘अपने मित्र’ विश्वासघात की धार बनाए रखता है।
- source_word: עַל ... עַל
  choice: के लिए ... का
  rationale: दोनों स्थानों पर एक ही हिब्रू पूर्वसर्ग है, किंतु स्वाभाविक हिंदी में संबंधित मुहावरों के अनुसार अलग कारक-चिह्न आवश्यक हैं; दोनों पंक्तियाँ फिर भी व्यक्तियों को लाभ या निर्णय की वस्तु बनाने का समान भाव रखती हैं।
