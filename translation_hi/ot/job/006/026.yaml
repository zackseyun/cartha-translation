source:
  edition: WLC
  text: הַ/לְ/הוֹכַ֣ח מִלִּ֣ים תַּחְשֹׁ֑בוּ וּ֝/לְ/ר֗וּחַ אִמְרֵ֥י נֹאָֽשׁ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/026.yaml
  text: Do you think to reprove words[a], when the words of a despairing man are for the wind?
translation:
  language: hi
  text: क्या तुम शब्दों को झिड़कने का विचार करते हो, जबकि निराश व्यक्ति की बातें हवा के समान हैं?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम केवल शब्दों को सुधारने और निराश व्यक्ति की बातों को हवा के समान मानने का इरादा रखते हो?” इब्रानी वाक्य-विन्यास में दूसरा खंड या तो कथन हो सकता है (“निराश व्यक्ति की बातें हवा के समान हैं”), या झिड़कने के विषय का भाग (“निराश व्यक्ति की बातों को हवा के समान मानने”)।
    reason: alternative_reading
lexical_decisions:
- source_word: הַ/לְ/הוֹכַח
  choice: झिड़कने
  rationale: यहाँ יכח का भाव सामने वाले के शब्दों को दोषपूर्ण ठहराने या डाँटकर सुधारने का है। “झिड़कने” में प्रसंग का विरोधात्मक और मूल्यांकनपरक बल बना रहता है।
- source_word: מִלִּים
  choice: शब्दों
  rationale: सीधा और संक्षिप्त अनुवाद; मूल की संक्षिप्तता बनाए रखता है और अनावश्यक रूप से “केवल शब्द” नहीं जोड़ता।
- source_word: תַּחְשֹׁבוּ
  choice: सोचते हो
  rationale: חשב का सामान्य अर्थ सोचना, विचार करना या इरादा करना है। प्रश्नवाचक वाक्य में “सोचते हो” स्वाभाविक है और इरादे का संकेत भी रहने देता है।
- source_word: וּ֝/לְ/ר֗וּחַ
  choice: हवा के लिए
  rationale: לְ के संबंधसूचक बल और רוּחַ की “हवा” वाली क्षणभंगुरता की छवि को यथासंभव औपचारिक रूप से सुरक्षित रखता है।
- source_word: אִמְרֵי
  choice: बातें
  rationale: אמר के रचनात्मक बहुवचन का स्वाभाविक हिन्दी रूप। पहले पद के “शब्दों” के साथ अर्थगत समानांतरता रखते हुए हिन्दी में कृत्रिम पुनरावृत्ति से बचाता है।
- source_word: נֹאָשׁ
  choice: निराश मनुष्य
  rationale: निफ़अल कृदंत उस व्यक्ति को दर्शाता है जो आशा खो चुका है; यह अनुवाद एकवचन और व्यक्तिगत भाव दोनों बनाए रखता है।
theological_decisions:
- issue: दूसरे खंड का वाक्यगत संबंध
  choice: 'इसे कथन के रूप में प्रस्तुत किया गया: “निराश मनुष्य की बातें हवा के लिए हैं।”'
  alternative: 'इसे पहले खंड के साथ जोड़कर अर्थ लिया जा सकता है: “और निराश व्यक्ति की बातों को हवा समझने की?”'
  rationale: इब्रानी वाक्य-विन्यास दोनों संबंधों की अनुमति देता है। मुख्य पाठ पहला संबंध अपनाता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है; इससे कोई विशिष्ट धर्मवैज्ञानिक निष्कर्ष आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधे संबोधन वाला प्रश्न। “हवा के लिए” कुछ असामान्य होते हुए भी मूल इब्रानी रूपक और उसकी अस्पष्टता को सुरक्षित रखता है; पादटिप्पणी अधिक स्वाभाविक वैकल्पिक संरचना स्पष्ट करती है।
