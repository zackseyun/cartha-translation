  yaml_path: translation/ot/job/006/011.yaml
  text: What strength do I have[a], that I should keep hoping? And what is my end, that I should prolong my life?
translation:
  language: hi
  text: मुझमें कितना बल है कि मैं आशा लगाए रहूँ? और मेरा अंत क्या है कि मैं अपना जीवन बढ़ाता रहूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि मैं धीरज धरता रहूँ?” इब्रानी में शाब्दिक भाव है, “कि मैं अपने प्राण को लंबा करूँ,” जिसका अर्थ जीवन को आगे बढ़ाना या सहते रहना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה כֹּחִי
  choice: मुझमें कितना बल है
  rationale: यह आलंकारिक प्रश्न अय्यूब की बची हुई सामर्थ्य पर संदेह व्यक्त करता है। हिंदी में ‘कितना बल’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: כִּי אֲיַחֵל
  choice: कि मैं आशा लगाए रहूँ
  rationale: יחל प्रतीक्षा या आशा रखने का अर्थ दे सकता है। यहाँ निरंतर आशा बनाए रखने का भाव संदर्भ में उपयुक्त है, जबकि मूल की अर्थ-सीमा भी बनी रहती है।
- source_word: וּמַה קִצִּי
  choice: और मेरा अंत क्या है
  rationale: קֵץ का मूल अर्थ अंत या सीमा है। ‘मेरा अंत’ पद की संक्षिप्तता और अस्तित्वगत तनाव को सुरक्षित रखता है।
- source_word: כִּי אַאֲרִיךְ נַפְשִׁי
  choice: कि मैं अपने प्राण को खींचता रहूँ
  rationale: शाब्दिक चित्र ‘अपने प्राण को लंबा करना’ है। ‘प्राण को खींचता रहूँ’ हिंदी में जीवन को कठिनाई से आगे बढ़ाते रहने और सहते रहने—दोनों संभावित भावों को बनाए रखता है।
