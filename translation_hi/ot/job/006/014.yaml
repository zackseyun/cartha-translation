base_translation:
  language: en
  yaml_path: translation/ot/job/006/014.yaml
  text: Kindness from his friend is due to one who is despairing[b][a], even if he forsakes the fear of the Almighty.
translation:
  language: hi
  text: निराश व्यक्ति अपने मित्र से करुणा पाने का अधिकारी है[b][a], भले ही वह सर्वशक्तिमान का भय मानना छोड़ दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो मित्र निराश व्यक्ति से अपनी करुणा रोकता है, वह सर्वशक्तिमान का भय त्याग देता है।” इब्रानी वाक्य-विन्यास संक्षिप्त है और इसे इस प्रकार भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: “करुणा” के लिए इब्रानी शब्द חֶסֶד है, जिसका अर्थ निष्ठावान प्रेम, दया या वाचा-सदृश विश्वस्तता भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּס
  choice: जो निराश हो रहा है
  rationale: मूल शब्द का शाब्दिक भाव ‘पिघलना/गल जाना’ है और यहाँ दुःख में भीतर से टूटते व्यक्ति का रूपक है। यह हिंदी अभिव्यक्ति उस भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מֵרֵעֵהוּ
  choice: अपने मित्र से
  rationale: מִן स्रोत को और प्रत्यय पीड़ित व्यक्ति के मित्र को सूचित करता है; इसलिए ‘अपने मित्र से’ संबंध और स्रोत दोनों को बनाए रखता है।
- source_word: חָסֶד
  choice: करुणामय निष्ठा
  rationale: मानवीय संबंध के इस प्रसंग में חֶסֶד केवल सामान्य दया नहीं, बल्कि संकट में दिखाई जाने वाली निष्ठावान करुणा भी है। संयुक्त पद इसके अर्थ-क्षेत्र को संक्षेप में व्यक्त करता है।
- source_word: וְיִרְאַת שַׁדַּי
  choice: सर्वशक्तिमान का भय
  rationale: यह परमेश्वर के प्रति भय और श्रद्धा का पारंपरिक बाइबलीय मुहावरा है; ‘भय’ मूल की धार्मिक गंभीरता बनाए रखता है।
- source_word: יַעֲזֹב
  choice: मानना छोड़ दे
  rationale: עזב का अर्थ छोड़ना या त्यागना है। ‘भय मानना छोड़ दे’ आधुनिक हिंदी में स्वाभाविक है और धार्मिक संबंध के परित्याग का भाव रखता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त इस ईश्वरीय उपाधि का मानक और स्पष्ट हिंदी अनुवाद है।
theological_decisions:
- issue: अंतिम उपवाक्य का वाक्य-विन्यास संबंध
  choice: निराश व्यक्ति अपने मित्र की करुणामय निष्ठा का अधिकारी है, भले ही वह सर्वशक्तिमान का भय मानना छोड़ दे।
  alternative: जो मित्र निराश व्यक्ति से करुणामय निष्ठा रोकता है, वह सर्वशक्तिमान का भय त्याग देता है।
  rationale: इब्रानी वाक्य-विन्यास अत्यंत संक्षिप्त और एकाधिक अर्थ की संभावना वाला है। मुख्य पाठ तत्काल प्रसंग में अय्यूब द्वारा मित्रों से अपेक्षित निष्ठा पर बल देता है, जबकि महत्वपूर्ण वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘करुणामय निष्ठा’ חֶסֶד के करुणा और संबंधपरक विश्वस्तता—दोनों पक्षों को व्यक्त करती है। पादटिप्पणी-चिह्न अंग्रेज़ी परामर्श पाठ के क्रम [b][a] में मुख्य पाठ में रखे गए हैं।
