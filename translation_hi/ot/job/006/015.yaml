translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘वाडी’ जैसे कम परिचित उधार-शब्द के स्थान पर ‘नाला’ रखा गया है, जबकि पादटिप्पणी मूल शब्द की अर्थ-व्याप्ति बताती है। कविता की समानांतर संरचना दो पंक्तियों में सुरक्षित है।
