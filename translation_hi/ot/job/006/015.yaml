base_translation:
  language: en
  yaml_path: translation/ot/job/006/015.yaml
  text: My brothers have dealt treacherously like a wadi[a], like the channels of wadis that pass away,
translation:
  language: hi
  text: 'मेरे भाइयों ने नाले[a] की तरह धोखा दिया है,

    बरसाती नालों के जलमार्गों की तरह, जो लुप्त हो जाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलधारा।” इब्रानी शब्द धारा, बाढ़ के पानी से भरने वाली घाटी, या मौसमी जलमार्ग को सूचित कर सकता है। यहाँ “नाला” शुष्क प्रदेश के उस जलमार्ग की छवि बनाए रखता है जिसमें पानी स्थायी नहीं रहता।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחַי
  choice: मेरे भाई
  rationale: इब्रानी शब्द का सीधा अर्थ ‘मेरे भाई’ है। प्रसंग में यह निकट साथियों को भी सूचित कर सकता है, पर मुख्य पाठ में पारिवारिक शब्द को बनाए रखा गया है।
- source_word: בָּגְדוּ
  choice: विश्वासघाती निकले हैं
  rationale: क्रिया संबंध में कपटपूर्ण या अविश्वासी सिद्ध होने का नैतिक भाव रखती है। ‘विश्वासघाती निकले हैं’ अय्यूब के अनुभव और शिकायत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְמוֹ
  choice: की तरह
  rationale: यह सामान्य तुलनात्मक अव्यय है; हिन्दी में ‘की तरह’ सहज है।
- source_word: נָחַל
  choice: नाले
  rationale: यह शब्द धारा, घाटी या मौसमी जलमार्ग का अर्थ दे सकता है। ‘नाला’ हिन्दी पाठक के लिए सुबोध है और प्रसंग के ऐसे जलमार्ग को दर्शा सकता है जिसमें पानी स्थायी नहीं रहता।
- source_word: כַאֲפִיק
  choice: धाराओं की तरह
  rationale: אפיק जल के मार्ग, पात्र या धारा को दर्शाता है। यहाँ ‘धाराओं’ से बहते जलमार्ग का चित्र स्वाभाविक रहता है और अनावश्यक तकनीकीपन से बचा जाता है।
- source_word: נְחָלִים
  choice: बरसाती नालों
  rationale: बहुवचन को रखते हुए ‘बरसाती’ प्रसंग में निहित मौसमी, मरुस्थलीय जलमार्ग की छवि स्पष्ट करता है; अगले पदों में उनका सूखना इसी चित्र को खोलता है।
- source_word: יַעֲבֹרוּ
  choice: बहकर लुप्त हो जाती हैं
  rationale: मूल अर्थ ‘गुज़रना/पार होना’ है। मौसमी जलधाराओं के प्रसंग में यह उनके बह जाने और फिर न रहने का संकेत देता है; हिन्दी वाक्यांश उस क्षणभंगुरता को व्यक्त करता है।
