source:
  edition: WLC
  text: ה֭וֹרוּ/נִי וַ/אֲנִ֣י אַחֲרִ֑ישׁ וּ/מַה שָּׁ֝גִ֗יתִי הָבִ֥ינוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/024.yaml
  text: Teach me[a], and I will be silent; make me understand how I have gone astray.
translation:
  language: hi
  text: मुझे सिखाओ, और मैं चुप रहूँगा; मुझे समझाओ[a] कि मैं किस बात में चूका हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे समझाओ कि मैं कैसे चूका हूँ।”
    reason: The Hebrew interrogative may be rendered either “in what respect” or “how,” corresponding to the English POB lexical alternative.
lexical_decisions:
- source_word: הוֹרוּנִי
  choice: मुझे सिखाओ
  rationale: ירה के हिफ़ील आज्ञार्थक का सामान्य अर्थ ‘सिखाना/निर्देश देना’ है। यह अय्यूब की अपनी भूल दिखाए जाने की अपील को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַאֲנִי אַחֲרִישׁ
  choice: तब मैं चुप रहूँगा
  rationale: संयोजक को प्रसंगानुसार परिणामसूचक ‘तब’ से व्यक्त किया गया है; אַחֲרִישׁ का अर्थ गंभीर और स्वाभाविक हिंदी में ‘मैं चुप रहूँगा’ है।
- source_word: וּמַה שָּׁגִיתִי
  choice: कि मुझसे कहाँ भूल हुई है
  rationale: שׁגה का अर्थ भूल करना या सही मार्ग से चूकना है। प्रश्नवाचक מַה के साथ यह वाक्य अपनी भूल का क्षेत्र या बिंदु बताने की माँग करता है; हिंदी में ‘कहाँ भूल हुई’ इस आशय को स्वाभाविक रूप से रखता है।
- source_word: הָבִינוּ לִי
  choice: मुझे समझाओ
  rationale: בין के हिफ़ील आज्ञार्थक में किसी को समझ प्रदान करने का कारक भाव है। ‘मुझे समझाओ’ आधुनिक हिंदी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: क्या अय्यूब यहाँ अपनी भूल स्वीकार करता है?
  choice: 'शर्तात्मक चुनौती का भाव बनाए रखा गया: वह मित्रों से अपनी भूल दिखाने को कहता है।'
  alternative: इसे अय्यूब द्वारा पहले से अपनी गलती मान लेने के रूप में व्यक्त करना।
  rationale: इब्रानी पाठ में भूल की स्पष्ट स्वीकृति नहीं, बल्कि यह माँग है कि मित्र उसे बताएँ कि वह कहाँ चूका है; इसलिए अनावश्यक दोष-स्वीकार नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चुप रहूँगा’ मूल के गंभीर स्वर को बनाए रखता है, जबकि ‘मुझसे कहाँ भूल हुई’ आरोपित त्रुटि के बारे में अय्यूब की खुली चुनौती को स्वाभाविक हिंदी में व्यक्त करता है।
