  source_fidelity: The draft conveys Job’s appeal to be instructed and shown the specific respect in which he has erred. However, rendering וַאֲנִי as “तब मैं” makes the conjunction more explicitly consequential than the Hebrew, which retains the emphatic simple “and I.” The revised wording also makes the object of “what I have erred” more explicit in natural Hindi.
  naturalness: The revised Hindi is modern, clear, and suitably dignified. “किस बात में चूका हूँ” is more idiomatic and precise than “मुझसे कहाँ भूल हुई है,” while preserving Job’s request that his alleged error be identified.
  terminology: “सिखाओ” faithfully represents the instructional force of הוֹרוּנִי; “चुप रहूँगा” naturally conveys אַחֲרִישׁ. “चूका हूँ” expresses שׁגה without suggesting that Job has independently conceded guilt.
  issues:
