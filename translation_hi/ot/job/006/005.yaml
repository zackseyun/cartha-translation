lexical_decisions:
- source_word: הֲיִנְהַק
  choice: क्या ... रेंकता है
  rationale: נהק गधे की विशिष्ट आवाज़ को दर्शाता है; हिंदी में ‘रेंकना’ इसका सटीक और स्वाभाविक समानार्थी है। प्रश्नवाचक הֲ को ‘क्या’ से व्यक्त किया गया है।
- source_word: פֶּרֶא
  choice: जंगली गधा
  rationale: यह शब्द जंगली गधे अथवा ओनेगर के लिए है। ‘जंगली गधा’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: עֲלֵי דֶשֶׁא
  choice: घास के रहते
  rationale: शाब्दिक चित्र ‘घास पर/के पास’ का है, किंतु इस आलंकारिक प्रश्न में आशय उपलब्ध हरी घास की परिस्थिति से है। ‘घास के रहते’ उस अर्थ को स्वाभाविक हिंदी में व्यक्त करता है और कारण का भाव अनावश्यक रूप से नहीं जोड़ता।
- source_word: אִם
  choice: या
  rationale: समानांतर आलंकारिक प्रश्न की दूसरी शाखा में אִם विकल्पसूचक है; इसलिए ‘या’ स्वाभाविक है।
- source_word: יִגְעֶה
  choice: रँभाता है
  rationale: געה गोवंश की आवाज़ के लिए प्रयुक्त है। ‘रँभाना’ हिंदी का सटीक और प्रचलित शब्द है।
- source_word: שׁוֹר
  choice: बैल
  rationale: שׁוֹר एक गोवंशी पशु, विशेषतः बैल, को सूचित कर सकता है। एकवचन समानांतरता में ‘बैल’ स्पष्ट और स्वाभाविक है।
- source_word: עַל בְּלִילוֹ
  choice: अपने मिले-जुले चारे के रहते
  rationale: בְּלִיל मिला-जुला पशु-आहार या सानी है और प्रत्यय का अर्थ ‘उसका/अपना’ है। ‘के रहते’ उपलब्ध आहार की परिस्थिति को पहले पद के समानांतर रखता है।
