  text: or[b][a], ‘Deliver me from the hand of the adversary,’ and ‘Redeem me from the hand of the ruthless’?”
translation:
  language: hi
  text: या, “मुझे शत्रु के हाथ से बचा लो,”[a] और, “मुझे निर्दयी लोगों के हाथ से छुड़ा लो”?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “मुझे विरोधी के हाथ से छुड़ा लो।”'
    reason: lexical_alternative
  - marker: b
    text: 'या: “मुझे निर्दयी लोगों के हाथ से मोल देकर छुड़ा लो।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְּטוּנִי
  choice: मुझे…बचा लो
  rationale: מלט के हिफ़ील आज्ञार्थक रूप में किसी को संकट से बच निकलने देना या छुड़ाना निहित है। सहज आधुनिक हिन्दी में “बचा लो” इस ठोस पुकार को व्यक्त करता है और अगले समानांतर क्रियापद פדה से भेद भी बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: यह किसी की शक्ति या नियंत्रण से छुटकारे का इब्रानी मुहावरा है। “के हाथ से” हिन्दी में भी स्वाभाविक और बोधगम्य है तथा मूल की ठोस छवि बनाए रखता है।
- source_word: צָר
  choice: शत्रु
  rationale: צָר यहाँ विरोधी या शत्रु व्यक्ति को सूचित करता है। “शत्रु” एकवचन और व्यापक वैरभाव—दोनों को बिना अनावश्यक सैन्य विशिष्टता के व्यक्त करता है।
- source_word: עָרִיצִים
  choice: निर्दयी लोग
  rationale: बहुवचन עָרִיצִים हिंसक, क्रूर या अत्याचारी लोगों को दर्शाता है। “निर्दयी लोग” सामान्य पाठक के लिए सहज है और इसे केवल राजनीतिक “तानाशाहों” तक सीमित नहीं करता।
- source_word: תִּפְדּוּנִי
  choice: मुझे…छुड़ा लो
  rationale: פדה का अर्थ छुड़ाना, मुक्त कराना या कभी मूल्य देकर छुड़ाना है। प्रसंग में “छुड़ा लो” ठोस संकट से मुक्ति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी इसके संभावित मूल्य/फिरौती संबंधी भाव को सुरक्षित रखती है।
theological_decisions:
- issue: गैर-अनुष्ठानिक और गैर-मुक्तिशास्त्रीय प्रसंग में פדה का अनुवाद
  choice: छुड़ा लो
  alternative: मोल देकर छुड़ा लो
  rationale: यहाँ अय्यूब अपने मित्रों से मानवीय शत्रुओं के हाथ से मुक्ति की बात कर रहा है; अतः ऐसा धार्मिक पारिभाषिक शब्द नहीं चुना गया जो प्रसंग से अधिक धर्मवैज्ञानिक अर्थ आरोपित करे। फिर भी פדה में संभावित फिरौती या मूल्य देकर छुड़ाने का भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद 22 से चल रहे आलंकारिक प्रश्न को “या” और अंतिम प्रश्नचिह्न से जोड़ा गया है। समानांतर पंक्तियों में “बचा लो” और “छुड़ा लो” रखकर दोनों इब्रानी क्रियाओं का अर्थगत भेद सुरक्षित किया गया है।
