  text: וּ֥/תְהִי ע֨וֹד נֶ֘חָ֤מָתִ֗/י וַ/אֲסַלְּדָ֣ה בְ֭/חִילָה לֹ֣א יַחְמ֑וֹל כִּי לֹ֥א כִ֝חַ֗דְתִּי אִמְרֵ֥י קָדֽוֹשׁ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/010.yaml
  text: This would still be my comfort[a], and I would exult in unrelenting pain; for I have not denied the words of the Holy One.
translation:
  language: hi
  text: तब भी यही मेरी सांत्वना होती, और मैं ऐसी पीड़ा में भी उल्लसित होता जिसमें वह मुझे न बख्शे[a]; क्योंकि मैंने पवित्र परमेश्वर के वचनों से इनकार नहीं किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं उस पीड़ा में उल्लसित होता; वह मुझे न बख्शता।” इस उपवाक्य की इब्रानी भाषा कठिन और अत्यंत संक्षिप्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: נֶחָמָתִי
  choice: मेरी सांत्वना
  rationale: यह संज्ञा ढाढ़स या सांत्वना को व्यक्त करती है। ‘मेरी सांत्वना’ वर्तमान मानक हिन्दी में स्वाभाविक है और अय्यूब के बचे हुए भावनात्मक सहारे को स्पष्ट करती है।
- source_word: וַאֲסַלְּדָה
  choice: और मैं … आनन्दित होता
  rationale: סלד एक दुर्लभ और कठिन क्रिया है। प्रसंग में यह पीड़ा के बीच अय्यूब की प्रबल, लगभग चुनौतीपूर्ण प्रसन्नता व्यक्त करती है; ‘आनन्दित होता’ अनिश्चित शारीरिक बिंब जोड़े बिना उस तीव्रता को रखता है।
- source_word: בְחִילָה
  choice: पीड़ा में
  rationale: חִילָה मरोड़, व्याकुलता या तीव्र पीड़ा का बोध करा सकता है। ‘पीड़ा में’ स्पष्ट और स्वाभाविक है, जबकि उसकी निरंतरता अगले कठिन पदबंध के साथ व्यक्त की गई है।
- source_word: לֹא יַחְמֹל
  choice: न थमने वाली
  rationale: חמל का मूल अर्थ ‘बख्शना’ या ‘दया करना’ है। संक्षिप्त और कठिन इब्रानी रचना को मुख्य पाठ में पीड़ा के न रुकने के रूप में सहज हिन्दी दी गई है; अधिक औपचारिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: כִחַדְתִּי
  choice: मैंने … इनकार नहीं किया है
  rationale: पिएल रूप में כחד का अर्थ नकारना, छिपाना या दबाना हो सकता है। परमेश्वर के वचनों के साथ ‘इनकार नहीं किया’ अय्यूब के उन्हें न ठुकराने के दावे को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि ‘छिपाया नहीं’ भी सम्भव है।
- source_word: אִמְרֵי
  choice: वचनों
  rationale: אמרה का संबंध बोले गए शब्दों या कथनों से है। ‘वचन’ धार्मिक प्रसंग में गरिमापूर्ण और सामान्य हिन्दी है।
- source_word: קָדוֹשׁ
  choice: पवित्र परमेश्वर
  rationale: यहाँ विशेषण संज्ञा के रूप में परमेश्वर की उपाधि है। ‘पवित्र परमेश्वर’ सामान्य पाठक के लिए संदर्भ स्पष्ट करता है और इसे किसी साधारण पवित्र व्यक्ति से अलग रखता है।
theological_decisions:
- issue: ईश्वरीय उपाधि קָדוֹשׁ
  choice: पवित्र परमेश्वर
  alternative: पवित्र जन
  rationale: प्रसंग स्पष्टतः परमेश्वर की ओर संकेत करता है। ‘पवित्र परमेश्वर’ उपाधि की धार्मिक शक्ति और सामान्य हिन्दी में स्पष्टता दोनों बनाए रखता है, बिना कोई अतिरिक्त सांप्रदायिक अर्थ जोड़े।
- issue: कठिन मध्य पदबंध בְחִילָה לֹא יַחְמֹל की व्याख्या
  choice: न थमने वाली पीड़ा में
  alternative: ऐसी पीड़ा में जिसमें वह मुझे न बख्शे
  rationale: इब्रानी पदबंध संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ गंभीर, निरंतर पीड़ा का आशय पठनीय हिन्दी में देता है; पादटिप्पणी अधिक औपचारिक सम्भावना दिखाकर मूल की अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कठिन मध्य उपवाक्य को मुख्य पाठ में सहज बनाया गया है, पर उसकी वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
