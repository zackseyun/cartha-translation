- source_word: בָּאוּ
  choice: वे ... आए
  rationale: בוא की सामान्य और सीधी हिंदी अभिव्यक्ति।
- source_word: עָדֶיהָ
  choice: उसके पास
  rationale: स्त्रीलिंग प्रत्यय पिछले प्रसंग की मौसमी धारा को संदर्भित करता है। ‘उसके पास’ मूल संदर्भसूचकता को ‘वहाँ’ की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: וַיֶּחְפָּרוּ
  choice: निराश हुए
  rationale: इस प्रसंग में अपेक्षित पानी न मिलने से उत्पन्न निराशा, संकोच और अपमान का मिश्रित भाव है। मुख्य पाठ में ‘निराश हुए’ प्रसंगानुकूल और सहज है; लज्जा-संबंधी विकल्प टिप्पणी में सुरक्षित हैं।
