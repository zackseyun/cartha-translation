base_translation:
  language: en
  yaml_path: translation/ot/job/006/008.yaml
  text: Oh[a], that my request would come, and that God would grant my hope.
translation:
  language: hi
  text: काश, मेरी विनती पूरी हो जाती, और परमेश्वर मेरी आशा पूरी कर देता![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “काश, मेरी विनती आ जाती, और परमेश्वर मेरी आशा दे देता!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि तीव्र अभिलाषा व्यक्त करने वाला उद्गार है; ‘काश’ आधुनिक हिन्दी में स्वाभाविक रूप से वही भाव देता है।
- source_word: תָּבוֹא
  choice: पूरी हो जाती
  rationale: शाब्दिक अर्थ ‘आ जाती’ है, पर विनती के आने का आशय उसके फलित या स्वीकार होने से है; हिन्दी में ‘विनती पूरी हो जाती’ अधिक स्वाभाविक है।
- source_word: שֶׁאֱלָתִי
  choice: मेरी विनती
  rationale: यह शब्द निवेदन या याचना को दर्शाता है; ‘विनती’ अय्यूब की करुण पुकार के अनुरूप सहज और गरिमापूर्ण है।
- source_word: וְתִקְוָתִי
  choice: मेरी आशा
  rationale: תִּקְוָה का सीधा अर्थ ‘आशा’ या ‘अपेक्षा’ है; ‘आशा’ प्रसंग की उत्कट चाह को भी समेटती है।
- source_word: יִתֵּן
  choice: पूरी कर देता
  rationale: क्रिया का मूल अर्थ ‘देना’ है, किन्तु ‘आशा देना’ इस प्रसंग में हिन्दी में अस्पष्ट होगा; ‘आशा पूरी करना’ इच्छित वस्तु प्रदान करने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रयुक्त एकवचन सामान्य ईश्वर-संज्ञा है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय शैली में स्पष्ट और गरिमापूर्ण है, और इसमें ‘सर्वशक्तिमान’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
theological_decisions:
- issue: ‘आशा’ प्रदान करने के अर्थ की अस्पष्टता
  choice: मेरी आशा पूरी कर देता
  alternative: मेरी आशा मुझे दे देता
  rationale: यहाँ आशा संभवतः अय्यूब की इच्छित याचना-वस्तु को सूचित करती है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प बचाती है और आशा की वस्तु को स्पष्ट रूप से परिभाषित नहीं करती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘काश’ विलाप की तीव्र इच्छा बनाए रखता है। समानांतर दोनों खंडों में ‘पूरी’ का प्रयोग प्रवाह देता है, जबकि पादटिप्पणी इब्रानी की अधिक शाब्दिक और कुछ असामान्य अभिव्यक्ति सुरक्षित रखती है।
