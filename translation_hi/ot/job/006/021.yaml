lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पदों में सूख जाने वाली धाराओं की उपमा से अय्यूब के मित्रों पर निकाले गए निष्कर्ष को जोड़ता है।
- source_word: עַתָּה
  choice: अब
  rationale: यह वर्तमान परिस्थिति को पहले की आशा के विपरीत रखता है।
- source_word: הֱיִיתֶם לא
  choice: तुम कुछ भी नहीं निकले
  rationale: हिब्रू लेखन शाब्दिक रूप से कठिन, ‘तुम नहीं हो गए,’ जैसा है। संदर्भ में मित्र अविश्वसनीय धाराओं की तरह निष्फल सिद्ध हुए हैं; ‘कुछ भी नहीं निकले’ परिवर्तन और निराशा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּרְאוּ
  choice: देखकर
  rationale: ראה का मूल अर्थ ‘देखना’ है; हिन्दी में कृदन्त अगली भय-प्रतिक्रिया से इसे सहजता से जोड़ता है।
- source_word: חֲתַת
  choice: विपत्ति
  rationale: यह संज्ञा आतंक, टूटन या विनाशकारी विपत्ति का बोध करा सकती है। यहाँ दिखाई देने वाली अय्यूब की दुर्दशा के लिए ‘विपत्ति’ स्वाभाविक है, जबकि अन्य अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַתִּירָאוּ
  choice: डर गए हो
  rationale: यह मित्रों की देखी हुई विपत्ति पर भयभीत प्रतिक्रिया को व्यक्त करता है; पूर्ण वर्तमान हिन्दी में परिणाम की वर्तमान प्रासंगिकता बनाए रखता है।
