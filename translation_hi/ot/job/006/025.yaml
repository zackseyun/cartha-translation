lexical_decisions:
- source_word: מַה נִּמְרְצוּ
  choice: कितनी प्रभावशाली होती हैं
  rationale: מַה यहाँ तीव्रता व्यक्त करने वाला विस्मयबोधक है। נמרצו का मूल भाव बल या प्रभाव है; यह अनुवाद कथन की प्रभावकारी शक्ति व्यक्त करता है, जबकि अन्य अर्थ-छायाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: אִמְרֵי יֹשֶׁר
  choice: खरी बातें
  rationale: יֹשֶׁר में सीधाई, सत्यनिष्ठा और नैतिक खरापन निहित है। ‘खरी बातें’ आधुनिक हिन्दी में स्वाभाविक है और केवल तथ्यात्मक सत्य तक अर्थ को सीमित नहीं करता।
- source_word: וּמַה
  choice: पर ... क्या
  rationale: 'संदर्भ में संयोजक दोनों वाक्यांशों के बीच विरोध दिखाता है: खरी बातों की शक्ति के विपरीत मित्रों की निष्फल फटकार।'
- source_word: יוֹכִיחַ
  choice: क्या सिद्ध करती है
  rationale: יכח के हिफ़ील रूप में सिद्ध करना, विवाद करना या दोष दिखाना जैसे अर्थ संभव हैं। यहाँ आलंकारिक प्रश्न मित्रों की फटकार से वास्तव में क्या प्रमाणित होता है, इस पर चुनौती देता है।
- source_word: הוֹכֵחַ
  choice: फटकार
  rationale: यह रूप दोष दिखाने, उलाहना देने या तर्क-वितर्क करने की क्रिया को सूचित कर सकता है। ‘फटकार’ प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: מִכֶּם
  choice: तुमसे मिलनेवाली
  rationale: מן स्रोत को दर्शाता है। हिन्दी में ‘तुमसे मिलनेवाली’ स्वाभाविक ढंग से बताता है कि फटकार अय्यूब के मित्रों की ओर से आती है।
