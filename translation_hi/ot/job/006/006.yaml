base_translation:
  language: en
  yaml_path: translation/ot/job/006/006.yaml
  text: Can tasteless food be eaten without salt[a], or is there any taste in the slime of mallow?
translation:
  language: hi
  text: क्या बेस्वाद भोजन बिना नमक के खाया जा सकता है, या मैलो के लिसलिसे रस में कोई स्वाद होता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दूसरी पंक्ति के इब्रानी शब्द अनिश्चित हैं। “मैलो के लिसलिसे रस” का अर्थ “मैलो का रस” भी हो सकता है; परंपरागत रूप से कुछ अनुवादों में इसे “अंडे की सफेदी” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ/יֵאָכֵל
  choice: क्या ... खाया जा सकता है
  rationale: प्रश्नवाचक הֲ और אכל के निफ़अल अपूर्ण रूप से बना आलंकारिक प्रश्न हिंदी में इस स्वाभाविक प्रयोग से स्पष्ट रहता है।
- source_word: תָּפֵל
  choice: बेस्वाद भोजन
  rationale: यह विशेषण फीके, बेस्वाद या बिना मसाले के खाद्य पदार्थ को दर्शाता है; संदर्भ में निहित भोजन को स्पष्ट करना स्वाभाविक है।
- source_word: מִ/בְּלִי מֶלַח
  choice: बिना नमक के
  rationale: यह पद सीधे नमक के अभाव को व्यक्त करता है और हिंदी में यही सर्वाधिक सहज रूप है।
- source_word: אִם יֶשׁ
  choice: या ... कोई ... होता है
  rationale: यहाँ אִם पहले प्रश्न के समानांतर दूसरा आलंकारिक प्रश्न आरंभ करता है; 'या' उस समानांतरता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: טַעַם
  choice: स्वाद
  rationale: यह संज्ञा स्वाद या रस को दर्शाती है और पहले खंड के 'बेस्वाद' के साथ शब्दगत संबंध बनाए रखती है।
- source_word: בְּ/רִיר
  choice: के लिसलिसे रस में
  rationale: दुर्बोध संज्ञा संभवतः लार-सदृश लिसलिसे द्रव या रस को दर्शाती है। 'लिसलिसा रस' अप्रिय भाव और 'रस' की संभावित धारणा दोनों को व्यक्त करता है।
- source_word: חַלָּמוּת
  choice: मल्लो
  rationale: यह अनिश्चित वनस्पति-नाम है। प्रचलित विद्वत्तापूर्ण पहचान को लिप्यंतरित किया गया है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
