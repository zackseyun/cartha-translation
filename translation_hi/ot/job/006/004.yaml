  edition: WLC
  text: כִּ֤י חִצֵּ֪י שַׁדַּ֡י עִמָּדִ֗/י אֲשֶׁ֣ר חֲ֭מָתָ/ם שֹׁתָ֣ה רוּחִ֑/י בִּעוּתֵ֖י אֱל֣וֹהַּ יַֽעַרְכֽוּ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/job/006/004.yaml
  text: For the arrows of the Almighty are in me[a]; my spirit drinks their poison[c][b]; the terrors of God array themselves against me.
translation:
  language: hi
  text: क्योंकि सर्वशक्तिमान के तीर मेरे भीतर हैं[a]; मेरी आत्मा उनका विष पी रही है[b]; परमेश्वर की विभीषिकाएँ मेरे विरुद्ध युद्ध के लिए पंक्तिबद्ध हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे साथ हैं।’ इब्रानी पूर्वसर्ग का अधिक शाब्दिक अर्थ ऐसा हो सकता है, पर तीर और विष का प्रसंग ‘मेरे भीतर हैं’ अर्थ की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनका ज़हर’; कुछ विद्वान इस शब्द को अधिक अमूर्त अर्थ में ‘उनका क्रोध’ मानते हैं।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक भाव: ‘मेरे विरुद्ध क्रम से सजती हैं’; यह युद्ध के लिए पंक्तिबद्ध होने की छवि है।'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में अय्यूब की शिकायत का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ इस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חִצֵּי שַׁדַּי
  choice: सर्वशक्तिमान के तीर
  rationale: युद्ध-संबंधी रूपक को अक्षुण्ण रखते हुए שַׁדַּי को प्रचलित अर्थ वाले ईश्वरीय पद ‘सर्वशक्तिमान’ से अनूदित किया गया है।
- source_word: עִמָּדִי
  choice: मेरे भीतर हैं
  rationale: पूर्वसर्ग का अधिक शाब्दिक अर्थ ‘मेरे साथ/पास’ हो सकता है, पर तीरों और उनके विष के प्रसंग में तीरों का अय्यूब के भीतर होना अभिप्रेत परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲמָתָם
  choice: उनका विष
  rationale: तीरों के तत्काल प्रसंग में यह संज्ञा उनके विष को सूचित करती है। ‘विष’ आधुनिक हिन्दी में स्पष्ट है और ‘क्रोध’ की अमूर्त व्याख्या थोपने से बचता है।
- source_word: שֹׁתָה רוּחִי
  choice: मेरी आत्मा ... पी रही है
  rationale: रूपक की सजीवता और जारी पीड़ा को बनाए रखने के लिए वर्तमानकालीन अभिव्यक्ति चुनी गई; רוּחִי यहाँ अय्यूब के भीतरी जीवन को दर्शाता है।
- source_word: בִּעוּתֵי אֱלוֹהַּ
  choice: परमेश्वर के आतंक
  rationale: बहुवचन संज्ञा भय उत्पन्न करने वाले आतंक को व्यक्त करती है; אֱלוֹהַּ का सामान्य और स्वाभाविक हिन्दी अनुवाद ‘परमेश्वर’ है।
- source_word: יַעַרְכוּנִי
  choice: मेरे विरुद्ध युद्ध-पंक्ति बाँधकर खड़े हैं
  rationale: क्रिया का भाव युद्ध के लिए क्रमबद्ध होकर सामने खड़े होने का है; यह हिन्दी अभिव्यक्ति सैन्य रूपक को स्पष्ट और पठनीय रखती है।
theological_decisions:
- issue: समानांतर पंक्तियों में שַׁדַּי और אֱלוֹהַּ का अनुवाद
  choice: שַׁדַּי के लिए ‘सर्वशक्तिमान’ और אֱלוֹהַּ के लिए ‘परमेश्वर’
  alternative: שַׁדַּי को ‘शद्दाय’ लिखना, या दोनों ईश्वरीय पदों को एक ही हिन्दी शब्द से अनूदित करना
  rationale: मूल पद्य दो अलग ईश्वरीय अभिधान प्रयोग करता है। दोनों का अर्थ अनूदित करने पर उनका भेद और काव्यात्मक समानांतरता बनी रहती है।
- issue: חֲמָתָם का प्रसंगानुसार अर्थ
  choice: तीरों का ‘विष’
  alternative: ‘उनका क्रोध’ अथवा ‘उसका क्रोध’
  rationale: तीरों और पीने की संयुक्त छवि ठोस अर्थ ‘विष’ का समर्थन करती है; इससे मूल से अधिक अमूर्त धर्मवैचारिक कथन आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। तीर, विष पीने और युद्ध-पंक्ति की तीनों काव्यात्मक छवियाँ सुरक्षित हैं; जहाँ इब्रानी में वास्तविक अर्थ-संभावनाएँ हैं, उन्हें पादटिप्पणियों में दिया गया है।
