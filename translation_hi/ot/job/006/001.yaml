- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: אמר के क्रमवाचक कथात्मक रूप को अलग क्रिया के रूप में रखा गया है, ताकि मूल इब्रानी का “उत्तर दिया और कहा” सूत्र संक्षिप्त करके केवल एक क्रिया न बना दिया जाए।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव-युक्त कथात्मक क्रिया पिछले भाषण से अगले प्रत्युत्तर की ओर कथा की प्रगति दिखाती है; “तब” इसे स्वाभाविक हिन्दी में व्यक्त करता है।
