- source_word: מֵאֲנָה
  choice: इनकार करती है
  rationale: क्रिया מאן का अर्थ ‘इनकार करना/अनिच्छुक होना’ है। वर्तमान काल अय्यूब की जारी वितृष्णा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לִנְגּוֹעַ
  choice: छूने से
  rationale: נגע का सीधा अर्थ ‘छूना’ है; यहाँ यह पिछली पंक्ति में वर्णित बेस्वाद वस्तुओं के प्रति संपर्क तक से वितृष्णा दिखाता है।
- source_word: נַפְשִׁי
  choice: मेरी जान
  rationale: נפש व्यक्ति, प्राण, गला या भूख का बोध करा सकता है। ‘मेरी जान’ आधुनिक हिंदी में काव्यात्मक और सहज है तथा इसे केवल ‘भूख’ तक सीमित नहीं करती।
- source_word: הֵמָּה
  choice: वे
  rationale: यह सर्वनाम पिछले पद में कही गई अरुचिकर वस्तुओं की ओर संकेत करता है; हिंदी में ‘वे’ उस संदर्भ को बनाए रखता है।
- source_word: כִּדְוֵי
  choice: घिनौने ... जैसे
  rationale: यह कठिन और संक्षिप्त अभिव्यक्ति דוה (‘बीमार/अस्वस्थ होना’) से जुड़ी है। संदर्भ में भोजन से वितृष्णा प्रमुख है; मुख्य पाठ में स्वाभाविक हिंदी दी गई है और अधिक शाब्दिक संभावना पाद-टिप्पणी में रखी गई है।
- source_word: לַחְמִי
  choice: मेरे लिए ... भोजन
  rationale: לחם का मूल अर्थ ‘रोटी’ है, पर इसका व्यापक अर्थ ‘भोजन’ भी है। यहाँ ‘भोजन’ संदर्भानुकूल है; प्रत्यय के संबंध को कठिन वाक्यांश में ‘मेरे लिए’ के रूप में समझना संभव है।
