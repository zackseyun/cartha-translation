  text: उनके मार्गों के पथ बल खाकर मुड़ जाते हैं[a]; वे उजाड़ में चढ़ जाते हैं और लुप्त हो जाते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कारवाँ के रास्ते मुड़ जाते हैं; वे उजाड़ में चढ़ते हैं और लुप्त हो जाते हैं।” इब्रानी बिंब कठिन है; कुछ लोग इस पद को पथों या जलधाराओं के बजाय कारवाँ के विषय में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יִלָּפְתוּ
  choice: घुमाव खाकर दूर निकल जाती हैं
  rationale: निफ़अल रूप मुड़ने, बल खाने या दिशा बदलने का भाव देता है। यह अनुवाद जलधाराओं अथवा उनके मार्गों के घुमाव लेकर अपेक्षित दिशा से दूर निकल जाने की कठिन छवि को बनाए रखता है।
- source_word: אָרְחוֹת
  choice: पगडंडियाँ
  rationale: शब्द का मूल अर्थ मार्ग या पथ है। यहाँ बहुवचन और דַּרְכָּם के साथ उसका संबंध दिखाने के लिए ‘पगडंडियाँ’ रखा गया है; ‘कारवाँ’ वाली लाक्षणिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: דַּרְכָּם
  choice: उनके मार्ग की
  rationale: דֶּרֶךְ का सीधा अर्थ मार्ग/रास्ता है। संबंधसूचक रचना ‘उनके मार्ग की पगडंडियाँ’ इब्रानी की कठिन अभिव्यक्ति को बिना अनावश्यक रूप से सुलझाए सुरक्षित रखती है।
- source_word: יַעֲלוּ
  choice: चढ़ जाती
  rationale: עלה के ठोस अर्थ ‘ऊपर जाना/चढ़ना’ को बनाए रखा गया है; कठिन बिंब के कारण इसे केवल ‘गायब होना’ नहीं बनाया गया।
- source_word: בַתֹּהוּ
  choice: उजाड़ में
  rationale: תֹהוּ यहाँ सूनेपन, वीरानी या निर्जन उजाड़ का बोध देता है। ‘उजाड़’ आधुनिक हिंदी में स्वाभाविक है और मरुस्थलीय संदर्भ के अनुकूल है।
- source_word: וְיֹאבֵדוּ
  choice: और लुप्त हो जाती हैं
  rationale: אבד नष्ट होने, खो जाने या लुप्त हो जाने को व्यक्त करता है। जलधाराओं/पथों की इस छवि में ‘लुप्त हो जाती हैं’ स्वाभाविक है और मूल की परिणति को सुरक्षित रखता है।
