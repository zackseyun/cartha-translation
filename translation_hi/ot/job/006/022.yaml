    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִי אָמַרְתִּי
  choice: क्या मैंने कभी कहा
  rationale: प्रश्नवाचक הֲכִי यहाँ अय्यूब के प्रबल खंडन को व्यक्त करता है। प्रसंगानुसार ‘कभी’ जोड़ने से हिंदी में आलंकारिक प्रश्न स्वाभाविक बनता है, जबकि मूल का प्रश्नात्मक भाव बना रहता है।
- source_word: הָבוּ לִי
  choice: मुझे कुछ दो
  rationale: बहुवचन आज्ञार्थक הָבוּ और לִי का सीधा, स्वाभाविक हिंदी रूप। ‘कुछ’ हिंदी में अकेले ‘मुझे दो’ की अपेक्षा स्पष्ट करता है कि अय्यूब अपने मित्रों से कोई वस्तु या सहायता माँगने की बात नकार रहा है।
- source_word: וּמִכֹּחֲכֶם
  choice: अपनी संपत्ति में से
  rationale: כֹּחַ का मूल अर्थ ‘बल/सामर्थ्य’ है, पर भुगतान के इस संदर्भ में यह आर्थिक साधन या संपत्ति सूचित करता है। मुख्य पाठ में अर्थ-संगत हिंदी रखी गई है और शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: שִׁחֲדוּ
  choice: रिश्वत दो
  rationale: यह क्रिया שֹׁחַד (‘रिश्वत/भेंट’) से संबंधित है। ‘रिश्वत दो’ उसके लेन-देन और अनुचित प्रलोभन के संभावित भाव को सुरक्षित रखता है; अधिक सामान्य ‘भुगतान करो’ वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: בַעֲדִי
  choice: मेरे लिए
  rationale: בַּעַד यहाँ ‘के लिए/की ओर से’ का अर्थ देता है। ‘मेरे लिए’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है तथा अय्यूब की ओर से भुगतान किए जाने का भाव व्यक्त करता है।
