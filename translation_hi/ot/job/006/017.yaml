lexical_decisions:
- source_word: בְּעֵת
  choice: पड़ते ही
  rationale: यह समय-सूचक पद अगले क्रिया-भाव के साथ मिलकर घटना का समय बताता है। हिंदी में ‘पड़ते ही’ मौसमी गरमी आते ही होने वाली प्रतिक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְזֹרְבוּ
  choice: गरमी पड़ते
  rationale: यह दुर्लभ क्रिया गरम या तप्त होने का भाव देती है। जलधाराओं के संदर्भ में ‘गरमी पड़ते’ सहज है और कारण को अनावश्यक रूप से अधिक विशिष्ट नहीं बनाता।
- source_word: נִצְמָתוּ
  choice: वे लुप्त हो जाती हैं
  rationale: निफ़अल रूप समाप्त होने, नष्ट होने या गायब हो जाने का भाव दे सकता है। मौसमी जलधाराओं के चित्र में ‘लुप्त हो जाती हैं’ दिखाई देना बंद होने का अर्थ स्पष्ट रखते हुए मूल की व्यापकता बचाता है।
- source_word: בְּחֻמּוֹ
  choice: ताप पड़ने पर
  rationale: शाब्दिक रूप से वाक्यांश ‘उसकी गरमी में’ है। संदर्भ में यह गरमी की अवस्था को सूचित करता है; ‘ताप पड़ने पर’ हिंदी में स्वाभाविक है, जबकि सर्वनाम-संबंध की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נִדְעֲכוּ
  choice: सूख जाती हैं
  rationale: क्रिया बुझ जाने या समाप्त हो जाने का अर्थ भी दे सकती है। जलधाराओं और ताप के प्रसंग में ‘सूख जाती हैं’ ठोस चित्र को स्पष्ट करता है, बिना रूपक का आशय बदले।
- source_word: מִמְּקוֹמָם
  choice: अपने स्थान से
  rationale: מָקוֹם का सामान्य अर्थ ‘स्थान’ है। ‘अपने स्थान से’ मूल के निकट है; ‘धारा-पथ’ या ‘नाला’ कहना संदर्भ को पाठ से अधिक विशिष्ट कर देता।
