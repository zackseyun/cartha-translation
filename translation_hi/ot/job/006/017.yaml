  text: जब वे गरम होती हैं, तो वे लुप्त हो जाती हैं[a]; गरमी में वे अपने स्थान से सूख जाती हैं[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन दोनों क्रियाओं का अनुवाद ‘बुझ जाती हैं’ या ‘समाप्त हो जाती हैं’ भी किया जा सकता है; इब्रानी चित्र में लुप्त होने और बुझ जाने के भाव आपस में मिले हुए हैं।
