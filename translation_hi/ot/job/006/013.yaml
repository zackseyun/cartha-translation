  text: Is my help not within me[a], and has sound wisdom been driven from me?
translation:
  language: hi
  text: क्या मेरी सहायता मुझमें नहीं है, और क्या सूझ-बूझ[a] मुझसे दूर कर दी गई है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उपाय-कुशलता”; इब्रानी शब्द תושיה व्यावहारिक बुद्धि, योग्यता या कारगर परामर्श का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַאִם אֵין
  choice: क्या ... नहीं है
  rationale: यह संयोजन नकारात्मक प्रश्न प्रस्तुत करता है। हिन्दी में यह रूप उसकी प्रश्नात्मकता और निहित वक्तृता को बनाए रखता है, बिना उत्तर को पाठ में जोड़ने के।
- source_word: עֶזְרָתִי
  choice: मेरी सहायता
  rationale: עזרה का सीधा अर्थ सहायता या मदद है। संबंधसूचक प्रत्यय को ‘मेरी’ से स्पष्ट रूप से रखा गया है।
- source_word: בִי
  choice: मुझमें
  rationale: ב के प्रथम पुरुष एकवचन रूप का सीधा स्थानवाचक अर्थ ‘मुझमें’ है; यह आंतरिक साधन या सहारे की संभावना को भी खुला रखता है।
- source_word: וְתֻשִּׁיָּה
  choice: और ... सूझ-बूझ
  rationale: תושיה व्यावहारिक बुद्धि, कार्यक्षम समझ या उपाय-कुशलता का बोध करा सकता है। ‘सूझ-बूझ’ आधुनिक हिन्दी में स्वाभाविक है और इस व्यावहारिक आयाम को व्यक्त करती है।
- source_word: נִדְּחָה
  choice: दूर कर दी गई है
  rationale: נדח के निफ़अल रूप में दूर किए जाने या खदेड़े जाने का निष्क्रिय भाव है। यह अनुवाद उस निष्क्रियता और वियोग दोनों को बनाए रखता है।
- source_word: מִמֶּנִּי
  choice: मुझसे
  rationale: מן और प्रथम पुरुष प्रत्यय का स्वाभाविक हिन्दी रूप ‘मुझसे’ है; ‘दूर कर दी गई’ के साथ अलगाव का अर्थ स्पष्ट हो जाता है।
theological_decisions:
- issue: पहले प्रश्न का वक्तृता-बल
  choice: नकारात्मक प्रश्न को ‘क्या मेरी सहायता मुझमें नहीं है’ के रूप में बनाए रखा गया है।
  alternative: ‘निश्चय ही मुझमें कोई सहायता नहीं है’ जैसे कथन में बदलना।
  rationale: इब्रानी पाठ प्रश्न के रूप में है और उसके अपेक्षित उत्तर को स्पष्ट रूप से नहीं बताता। कथन में बदलने से वास्तविक भाषिक तनाव अनावश्यक रूप से समाप्त हो जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानांतर दोनों खंडों को ‘और क्या’ से जोड़ा गया है, जिससे हिन्दी में प्रश्न की संरचना स्पष्ट रहती है।
