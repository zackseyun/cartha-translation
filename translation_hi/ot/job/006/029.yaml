base_translation:
  language: en
  yaml_path: translation/ot/job/006/029.yaml
  text: Turn back[a], please; let there be no injustice. Turn back again; my righteousness is still in it.
translation:
  language: hi
  text: कृपया, लौट आओ[a]; अन्याय न होने पाए। फिर लौट आओ; इस मामले में मेरा औचित्य अब भी बना हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘फिर विचार करो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻֽׁבוּ
  choice: लौट आओ
  rationale: बहुवचन आज्ञार्थक रूप मित्रों से अपने निर्णय पर लौटने, अर्थात उसे बदलने, का आग्रह करता है। ‘लौट आओ’ वापसी के मूल रूपक को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: נָא
  choice: कृपया
  rationale: यह विनय-सूचक अव्यय आज्ञा को नम्र आग्रह बनाता है; आधुनिक हिन्दी में ‘कृपया’ इसका सहज समतुल्य है।
- source_word: אַל תְּהִי עַוְלָה
  choice: अन्याय न होने पाए
  rationale: इब्रानी की निर्वैयक्तिक रचना और अमूर्त संज्ञा ‘अन्याय’ को सुरक्षित रखता है तथा कर्ता या अन्याय के सटीक रूप को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: ו/שבי
  choice: फिर लौट आओ
  rationale: पाठ का आशय पहले आज्ञार्थक रूप की पुनरावृत्ति है; ‘फिर’ आग्रह को दोहराता है। WLC में प्रदर्शित रूप पाठगत कठिनाई रखता है, पर मसोराई परंपरा और प्रसंग बहुवचन ‘लौट आओ’ का समर्थन करते हैं।
- source_word: עוֹד
  choice: अब भी
  rationale: यह अय्यूब के पक्ष की निरंतर वैधता बताता है; ‘अब भी’ हिन्दी में still/yet का स्वाभाविक अर्थ देता है।
- source_word: צִדְקִי
  choice: मेरा पक्ष सही है
  rationale: इस विवादात्मक और न्यायिक प्रसंग में צֶדֶק अय्यूब की निर्दोषता या उचित दावे को सूचित करता है। यह अनुवाद ‘मेरी धार्मिकता’ से उत्पन्न पापरहित सिद्धता के संभावित भ्रम से बचते हुए मूल नैतिक-न्यायिक अर्थ देता है।
- source_word: בָהּ
  choice: इस मामले में
  rationale: स्त्रीलिंग प्रत्यय का व्यक्त पूर्वगामी नहीं है; प्रसंगतः यह विचाराधीन विवाद या मामले की ओर संकेत करता है। ‘इस मामले में’ अस्पष्ट संकेत को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: צִדְקִי में अय्यूब के दावे का आशय
  choice: अय्यूब कहता है कि विचाराधीन विवाद में उसका पक्ष अब भी सही है।
  alternative: ‘मेरी धार्मिकता उसमें अब भी है,’ जिसे अय्यूब की धार्मिकता या सत्यनिष्ठा के बने रहने के रूप में पढ़ा जा सकता है।
  rationale: प्रसंग मित्रों द्वारा अय्यूब के आकलन का है। न्यायिक अर्थ को व्यक्त करना उसके दावे को पूर्ण पापरहितता की संप्रदायगत धारणा में बदलने से बचाता है, जबकि उसके नैतिक औचित्य को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, विनम्र पर दृढ़ निवेदन। बहुवचन ‘लौट आओ’ मित्रों के समूह को संबोधित करता है। ‘अन्याय न होने पाए’ मूल की निर्वैयक्तिक अभिव्यक्ति रखता है; ‘इस मामले में मेरा पक्ष सही है’ अंतिम पदबंध को सामान्य पाठक के लिए स्वाभाविक न्यायिक हिन्दी में व्यक्त करता है।
