- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह शब्द नैतिक टेढ़ेपन, गलत काम या अन्याय को व्यक्त करता है; ‘अन्याय’ इसकी नैतिक गंभीरता बनाए रखता है।
- source_word: אִם
