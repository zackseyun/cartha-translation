- source_word: חִכִּי
  choice: मेरा तालू
  rationale: मूलतः स्वाद पहचानने वाले अंग ‘तालू’ का उल्लेख है; इसे बनाए रखने से परखने का ठोस रूपक सुरक्षित रहता है।
- source_word: לֹא יָבִין
  choice: नहीं पहचानता
  rationale: בין यहाँ समझने, भेद करने या परखने का भाव देता है; ‘पहचानता’ तालू और स्वाद के रूपक के साथ सहज है।
- source_word: הַוּוֹת
  choice: अनिष्टकारी बातें
  rationale: बहुवचन शब्द विनाशकारी अनिष्ट, विपत्तियों या नैतिक रूप से विकृत बातों को सूचित कर सकता है। ‘अनिष्टकारी बातें’ वाणी के संदर्भ में स्वाभाविक है और विनाशकारी अर्थ को बनाए रखता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
