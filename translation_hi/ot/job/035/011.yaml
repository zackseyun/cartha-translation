  text: who teaches us more than the beasts of the earth and makes us wiser than the birds of the heavens[a].
translation:
  language: hi
  text: 'जो हमें धरती के पशुओं से अधिक सिखाता है,

    और आकाश के पक्षियों से अधिक बुद्धिमान बनाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो हमें धरती के पशुओं के माध्यम से सिखाता है और आकाश के पक्षियों के माध्यम से हमें बुद्धिमान बनाता है।” इब्रानी पूर्वसर्ग तुलना के बजाय स्रोत या साधन का भाव भी व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְּפֵנוּ
  choice: हमें ... सिखाता है
  rationale: למד के पिएल कृदन्त और प्रथम पुरुष बहुवचन प्रत्यय का स्वाभाविक अर्थ सक्रिय रूप से शिक्षा देना है; आधुनिक हिन्दी में ‘सिखाता है’ स्पष्ट और सहज है।
- source_word: מִבַּהֲמוֹת אָרֶץ
  choice: धरती के पशुओं से अधिक
  rationale: काव्यात्मक समानांतरता में מִן को तुलनात्मक मानते हुए मनुष्यों को पशुओं की अपेक्षा अधिक शिक्षा मिलने का भाव व्यक्त किया गया है। ‘धरती के पशु’ मूल बिंब को बनाए रखता है।
- source_word: וּמֵעוֹף הַשָּׁמַיִם
  choice: और आकाश के पक्षियों से अधिक
  rationale: पहले चरण के समान מֵ को तुलनात्मक रूप में लिया गया है। ‘आकाश के पक्षी’ עוֹף הַשָּׁמַיִם का स्वाभाविक, गरिमापूर्ण हिन्दी रूप है।
- source_word: יְחַכְּמֵנוּ
  choice: हमें ... बुद्धिमान बनाता है
  rationale: חכם के पिएल रूप का कारक भाव है—बुद्धिमान बनाना। तुलना को ‘से अधिक’ पदबंध में स्पष्ट किया गया है, इसलिए क्रिया में अनावश्यक रूप से ‘अधिक बुद्धिमान’ दोहराया नहीं गया।
theological_decisions:
- issue: दोनों काव्य-पंक्तियों में מִן/מֵ का अर्थ
  choice: 'तुलनात्मक: परमेश्वर मनुष्यों को धरती के पशुओं से अधिक सिखाता और आकाश के पक्षियों से अधिक बुद्धिमान बनाता है।'
  alternative: 'स्रोत का बोधक: वह हमें धरती के पशुओं से सिखाता और आकाश के पक्षियों से बुद्धि देता है।'
  rationale: निकटवर्ती काव्यात्मक समानांतरता और प्रसंग तुलनात्मक अर्थ का समर्थन करते हैं, पर इब्रानी पूर्वसर्ग स्रोत का अर्थ भी दे सकता है; इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और काव्यात्मक समानांतरता को बनाए रखने वाला रूप। ‘धरती’ और ‘आकाश’ सामान्य पाठक के लिए स्वाभाविक हैं, जबकि मूल के ठोस बिंब सुरक्षित रहते हैं।
