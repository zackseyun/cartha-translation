  yaml_path: translation/ot/job/035/003.yaml
  text: For you say[a], ‘What advantage is it to you? What profit do I have from my sin?’
translation:
  language: hi
  text: क्योंकि तुम कहते हो[a], “तुम्हें क्या लाभ है? मुझे अपने पाप से क्या फायदा होता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हें क्या लाभ है? पाप करने की अपेक्षा मुझे क्या अधिक फायदा है?” इब्रानी वाक्य संक्षिप्त है और संभवतः धर्मी रहने तथा पाप करने के बीच तुलना का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह एलीहू के पिछले कथन का कारण देते हुए अय्यूब के कथित शब्दों को प्रस्तुत करता है।
- source_word: תֹאמַר
  choice: तुम कहते हो
  rationale: कल रूप द्वितीय पुरुष एकवचन है और अय्यूब को सीधे संबोधित करता है; सामान्य वर्तमान काल आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יִסְכָּן לָךְ
  choice: तुम्हें इससे क्या लाभ है
  rationale: סכן यहाँ लाभ या उपयोग होने का भाव देता है। ‘इससे’ संक्षिप्त इब्रानी में निहित विषय को हिन्दी में सहज बनाता है, पर उसका संदर्भ जानबूझकर स्पष्ट नहीं करता।
- source_word: אֹעִיל
  choice: मुझे क्या फायदा होता है
  rationale: יעל का हिफ़ील रूप लाभ पाने या फायदा होने का अर्थ देता है; प्रथम पुरुष एकवचन को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵחַטָּאתִי
  choice: अपने पाप से
  rationale: מן स्रोत अथवा तुलना दोनों सूचित कर सकता है। मुख्य पाठ स्रोत-संबंधी सीधा अर्थ रखता है और तुलनात्मक संभावना को पादटिप्पणी में सुरक्षित करता है।
theological_decisions:
- issue: एलीहू द्वारा उद्धृत प्रश्न का आशय
  choice: मुख्य पाठ अय्यूब के लिए धार्मिकता के व्यावहारिक लाभ और उसके अपने पाप से होने वाले लाभ के प्रश्न को खुला रखता है।
  alternative: 'दूसरे प्रश्न को स्पष्ट तुलना के रूप में पढ़ा जा सकता है: पाप करने की अपेक्षा धर्मी रहने से मुझे क्या अधिक लाभ है?'
  rationale: इब्रानी अत्यंत संक्षिप्त है, और מִן स्रोत या तुलना बता सकता है। इसलिए पाठ किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक रूप से आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और बोलचाल में बोधगम्य शब्दावली रखी गई है। ‘लाभ’ और ‘फायदा’ समानांतर पदों का भेद बनाए रखते हैं; पादटिप्पणी मूल की तुलनात्मक अस्पष्टता सुरक्षित करती है।
