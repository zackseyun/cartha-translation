base_translation:
  language: en
  yaml_path: translation/ot/job/035/013.yaml
  text: Surely God does not hear emptiness[a], and the Almighty does not regard it.
translation:
  language: hi
  text: निश्चय ही, परमेश्वर व्यर्थ बात[a] नहीं सुनता, और सर्वशक्तिमान उस पर ध्यान नहीं देता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खोखली बात,” “झूठ,” या “निरर्थक बात।” इब्रानी शब्द ऐसी बात या चीज़ का वर्णन कर सकता है जो खाली, निष्फल, मूल्यहीन, या भ्रामक हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह अव्यय एलीहू के निष्कर्ष पर बल देता है; ‘निश्चय ही’ उसके दृढ़ कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׁוְא
  choice: व्यर्थता
  rationale: इस शब्द में खालीपन, निष्फलता, मूल्यहीनता और असत्य का अर्थ-क्षेत्र है। ‘व्यर्थता’ अमूर्त संज्ञा को बनाए रखती है और इसे केवल ‘झूठ’ या विशेष रूप से ‘व्यर्थ पुकार’ तक सीमित नहीं करती।
- source_word: יִשְׁמַע
  choice: नहीं सुनता
  rationale: सन्दर्भ में अपूर्ण क्रिया सामान्य सत्य व्यक्त करती है। ‘नहीं सुनता’ मूल क्रिया का सीधा और सहज रूप है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यह सामान्य ईश्वरीय उपाधि है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ इसका प्रतिष्ठित और स्वाभाविक समतुल्य है।
- source_word: וְשַׁדַּי
  choice: और सर्वशक्तिमान
  rationale: שַׁדַּי एक ईश्वरीय उपाधि है। ‘सर्वशक्तिमान’ अय्यूब में इसके अर्थपूर्ण, परिचित अनुवाद को बनाए रखता है।
- source_word: יְשׁוּרֶנָּה
  choice: उस पर ध्यान नहीं देता
  rationale: שׁוּר का अर्थ देखना, निहारना या ध्यान देना है। यहाँ ‘ध्यान नहीं देता’ पहले खंड के ‘नहीं सुनता’ के समानांतर सावधान विचार या ग्रहण को स्वाभाविक हिन्दी में व्यक्त करता है; स्त्रीलिंग प्रत्यय का संकेत ‘व्यर्थता’ की ओर है।
theological_decisions:
- issue: एलीहू के कथन में שָׁוְא का आशय
  choice: परमेश्वर व्यर्थ, खोखली या निष्फल बात को नहीं सुनता
  alternative: परमेश्वर अमूर्त रूप में ‘झूठ’ नहीं सुनता; अथवा ‘व्यर्थता’ से विशेषतः घमण्ड भरी बात अभिप्रेत है
  rationale: अनुवाद यह स्पष्ट करने के लिए कोई अतिरिक्त संज्ञा, जैसे ‘प्रार्थना’ या ‘पुकार’, नहीं जोड़ता। इस प्रकार मूल की व्यापकता और धर्मवैचारिक तनाव सुरक्षित रहता है तथा कथन को परमेश्वर की जानकारी की सीमा के विषय में दावा नहीं बनाया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और कथनात्मक रूप अपनाया गया है। ‘व्यर्थता’ मूल की अमूर्तता को बचाती है; पाद-टिप्पणी उसके विस्तृत अर्थ-क्षेत्र को सामने रखती है।
