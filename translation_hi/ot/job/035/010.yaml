  yaml_path: translation/ot/job/035/010.yaml
  text: But no one says[a], ‘Where is God my Maker, who gives songs in the night?’
translation:
  language: hi
  text: पर कोई नहीं कहता[a], “मेरा रचनेवाला परमेश्वर कहाँ है, जो रात में गीत देता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘मेरे रचनेवाले’ बहुवचन रूप है, पर यहाँ वह एक परमेश्वर के लिए प्रयुक्त हुआ है; इसलिए मुख्य पाठ में ‘मेरा रचनेवाला’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא אָמַר
  choice: पर कोई नहीं कहता
  rationale: संयोजक और निषेध पिछले संदर्भ से विरोध प्रकट करते हैं। इब्रानी में कर्ता व्यक्त नहीं है; प्रसंग के अनुसार अनिश्चित कर्ता ‘कोई’ जोड़ना स्वाभाविक है। पूर्ण क्रिया यहाँ सामान्य या आदतन वर्तमान भाव रखती है।
- source_word: אַיֵּה
  choice: कहाँ है
  rationale: यह स्थान अथवा उपस्थिति पूछने वाला प्रश्नवाचक है; प्रत्यक्ष कथन में ‘कहाँ है’ स्वाभाविक हिन्दी है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त एकवचन ईश्वरीय पद के लिए यह स्पष्ट और प्रतिष्ठित आधुनिक हिन्दी समतुल्य है।
- source_word: עֹשָׂי
  choice: मेरा रचनेवाला
  rationale: रूप व्याकरण की दृष्टि से बहुवचन है, पर इसका संदर्भ एक परमेश्वर से है। एकवचन अनुवाद हिन्दी पाठक को भ्रामक बहुदेववादी अर्थ से बचाता है; औपचारिक बहुवचन को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נֹתֵן
  choice: जो ... देता है
  rationale: कृदंत परमेश्वर के चरित्रगत कार्य का वर्णन करता है; सम्बन्धवाचक उपवाक्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: זְמִרוֹת
  choice: गीत
  rationale: शब्द का मूल अर्थ गीत है। ‘स्तुतिगीत’ संभव है, पर उससे ऐसा आराधनात्मक अर्थ स्पष्ट हो जाता जिसे यहाँ शब्द स्वयं अनिवार्य नहीं करता।
- source_word: בַּלָּיְלָה
  choice: रात में
  rationale: यह हिन्दी में स्वाभाविक है और मूल की काव्यात्मक छवि को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के लिए עֹשָׂי का वचन
  choice: 'एकवचन अर्थ: ‘मेरा रचनेवाला’'
  alternative: 'औपचारिक बहुवचन: ‘मेरे रचनेवाले’'
  rationale: इब्रानी रूप बहुवचन है, किंतु संदर्भित सत्ता एकवचन परमेश्वर है। मुख्य पाठ में एकवचन अर्थ दिया गया है और स्रोत का असामान्य बहुवचन पादटिप्पणी में बताया गया है, ताकि न तो बहुदेववाद का भ्रामक संकेत मिले और न ही मूल रूप छिपे।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘रचनेवाला’ सामान्य पाठक के लिए बोधगम्य है और सृष्टिकर्ता के व्यक्तिगत संबंध ‘मेरा’ को स्पष्ट रखता है। काव्यात्मक प्रश्न और ‘रात में गीत’ की खुली छवि संरक्षित हैं।
