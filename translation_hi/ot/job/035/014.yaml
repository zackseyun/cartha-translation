source:
  edition: WLC
  text: אַ֣ף כִּֽי תֹ֭אמַר לֹ֣א תְשׁוּרֶ֑/נּוּ דִּ֥ין לְ֝/פָנָ֗י/ו וּ/תְח֥וֹלֵֽל לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/035/014.yaml
  text: How much less when you say[a], ‘You do not see him’; the case is before him, and you must wait for him.
translation:
  language: hi
  text: तो फिर जब तुम कहते हो, “तुम उसे नहीं देखते,” तब वह और भी कम सुनेगा; मुकदमा उसके सामने है, और उसकी प्रतीक्षा करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַף כִּי
  choice: तो और भी कम
  rationale: यह पद 13 से जुड़ा हुआ न्यूनतर-से-न्यूनतर तर्क व्यक्त करता है। हिंदी में यह कुछ खंडित वाक्य-रचना मूल के संक्षिप्त और तनावपूर्ण रूप को बनाए रखती है।
- source_word: תֹאמַר
  choice: तुम कहते हो
  rationale: यह अय्यूब को संबोधित सामान्य द्वितीय पुरुष एकवचन कथन है; अतिरिक्त अर्थ जोड़ने की आवश्यकता नहीं।
- source_word: לֹא תְשׁוּרֶנּוּ
  choice: तुम उसे देख नहीं पाते
  rationale: शׁור का अर्थ देखना या प्रत्यक्ष करना है। संदर्भ में कर्ता 'तुम' और कर्म परमेश्वर है; यह परमेश्वर द्वारा मुकदमा न देखने का कथन नहीं है। 'नहीं पाते' यहाँ अनुभवगत अप्रत्यक्षता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: דִּין
  choice: तुम्हारा मुकदमा
  rationale: דין यहाँ अमूर्त न्याय से अधिक न्यायिक मामला या वाद है। हिंदी में 'मुकदमा' कानूनी बिंब को स्पष्ट और सहज रखता है; संबंध संदर्भ से स्पष्ट किया गया है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह मानक वाक्यांश मामले के परमेश्वर के समक्ष निर्णयार्थ उपस्थित होने का भाव रखता है।
- source_word: וּתְחוֹלֵל לוֹ
  choice: इसलिए उसकी बाट जोहो
  rationale: क्रिया कठिन और विरल है। संदर्भ के आधार पर प्रत्याशापूर्ण प्रतीक्षा मुख्य पाठ में उपयुक्त है। 'बाट जोहो' आधुनिक पाठकों को समझ आने वाला, गरिमापूर्ण आदेशात्मक पदबंध है; अधिक ठोस 'उसके सामने तड़पो' को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: परमेश्वर के न दिखाई देने और न्याय के बीच एलीहू की बात
  choice: अय्यूब परमेश्वर को नहीं देख पाता, फिर भी उसका मामला परमेश्वर के सामने है और उसे परमेश्वर की बाट जोहनी है।
  alternative: परमेश्वर मामले को नहीं देखता; अथवा अंतिम खंड का अर्थ है, 'उसके सामने तड़पो।'
  rationale: व्याकरण और व्यापक प्रसंग शिकायत को अय्यूब की परमेश्वर को न देख पाने की दशा के रूप में पढ़ने का समर्थन करते हैं, न कि परमेश्वर की अनभिज्ञता के रूप में। अंतिम क्रिया की वास्तविक शाब्दिक कठिनाई को पादटिप्पणी में रखा गया है, इसलिए मुख्य पाठ संदर्भसम्मत अर्थ देता है पर अस्पष्टता छिपाता नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, सहज और गरिमापूर्ण रखी गई है। 'मुकदमा' न्यायिक रूपक को स्पष्ट करता है और 'बाट जोहो' अपेक्षापूर्ण प्रतीक्षा को संक्षेप में व्यक्त करता है। मुख्य वाक्य में मूल इब्रानी की संक्षिप्तता कुछ हद तक जानबूझकर बनाए रखी गई है।
