base_translation:
  language: en
  yaml_path: translation/ot/job/035/007.yaml
  text: If you are righteous[b][a], what do you give to him? Or what does he take from your hand?
translation:
  language: hi
  text: यदि तुम धर्मी हो, तो उसे[a] क्या देते हो? या वह तुम्हारे हाथ से क्या लेता[b] है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् परमेश्वर को। संदर्भ में एलीहू का आशय है कि मनुष्य की धार्मिकता से परमेश्वर को कोई लाभ नहीं पहुँचता।
    reason: cross_reference
  - marker: b
    text: या “प्राप्त करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; आधुनिक मानक हिन्दी में ‘यदि’ सीधा और गरिमापूर्ण समतुल्य है।
- source_word: צָדַקְתָּ
  choice: तुम धर्मी हो
  rationale: צדק यहाँ नैतिक रूप से धर्मी या सही होने को व्यक्त करता है; सशर्त कथन में हिन्दी वर्तमान काल स्वाभाविक है।
- source_word: מַה תִּתֶּן לוֹ
  choice: तो उसे क्या देते हो?
  rationale: रूपकात्मक प्रश्न के सामान्य सत्य वाले बल को वर्तमान काल में रखा गया है और ל־ के अप्रत्यक्ष कर्म को ‘उसे’ से व्यक्त किया गया है।
- source_word: מִיָּדְךָ
  choice: तुम्हारे हाथ से
  rationale: मूल का ठोस बिंब सुरक्षित रखा गया है; हिन्दी में यह किसी व्यक्ति से या उसके अधिकार में से कुछ मिलने का अर्थ समझा जा सकता है।
- source_word: יִקָּח
  choice: लेता है
  rationale: לקח का सीधा अर्थ ‘लेना’ है; सामान्य सत्य व्यक्त करने वाले प्रश्न के लिए हिन्दी वर्तमान काल उपयुक्त है। ‘प्राप्त करता है’ सम्भव वैकल्पिक अर्थ है।
theological_decisions:
- issue: לוֹ / יִקָּח में तीसरे पुरुष के सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘उसे/वह’ रखा गया और पादटिप्पणी में परमेश्वर का संदर्भ बताया गया।
  alternative: मुख्य पाठ में सीधे ‘परमेश्वर को/परमेश्वर’ कहना।
  rationale: पद 6–8 के संदर्भ में सर्वनाम परमेश्वर की ओर संकेत करते हैं, पर इब्रानी पाठ स्वयं संज्ञा नहीं दोहराता। इसलिए संदर्भ स्पष्ट करने के साथ मूल की सर्वनामात्मक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘धर्मी’ अय्यूब की नैतिक-धार्मिक शब्दावली बनाए रखता है; ‘तुम्हारे हाथ से’ मूल बिंब को सुरक्षित रखता है।
