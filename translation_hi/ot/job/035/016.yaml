    reason: lexical_alternative
lexical_decisions:
- source_word: הֶבֶל
  choice: व्यर्थ ही
  rationale: यह शब्द साँस, भाप, खालीपन, निरर्थकता या व्यर्थता का भाव दे सकता है। यहाँ यह अय्यूब के बोलने की रीति या उसके कथनों के चरित्र को बताता है; ‘व्यर्थ ही’ आधुनिक हिन्दी में स्वाभाविक है, जबकि पाद-टिप्पणी ‘खोखली बातें’ की सम्भावना सुरक्षित रखती है।
- source_word: יִפְצֶה פִּיהוּ
  choice: अपना मुँह खोलता है
  rationale: यह ‘मुँह खोलने’ अर्थात बोलना आरम्भ करने का सीधा मुहावरा है, जो हिन्दी में भी स्वाभाविक है।
- source_word: בִּבְלִי דַעַת
  choice: बिना ज्ञान के
  rationale: בִּבְלִי अभाव और דַעַת ज्ञान को दर्शाता है; यह स्रोत की संरचना का सीधा और स्पष्ट अनुवाद है।
- source_word: מִלִּין יַכְבִּר
  choice: बहुत-सी बातें करता है
  rationale: शाब्दिक भाव ‘शब्दों को बहुत करता/बढ़ाता है’ है। हिन्दी में ‘बहुत-सी बातें करता है’ सामान्य पाठक के लिए स्वाभाविक रहते हुए शब्दबहुलता का आरोप व्यक्त करता है।
- source_word: וְאִיּוֹב
  choice: इसलिए अय्यूब
  rationale: सन्दर्भ में וְ पिछले निष्कर्ष से इस कथन को जोड़ता है और यहाँ परिणामसूचक/निष्कर्षात्मक ‘इसलिए’ उपयुक्त है।
