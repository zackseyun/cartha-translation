base_translation:
  language: en
  yaml_path: translation/ot/job/035/006.yaml
  text: If you sin[a], what do you accomplish against him? And if your transgressions are many, what do you do to him?
translation:
  language: hi
  text: यदि तू पाप करे, तो उसके विरुद्ध क्या कर लेता है?[a] और यदि तेरे अपराध बहुत बढ़ जाएँ, तो तू उसके प्रति क्या करता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो उस पर क्या प्रभाव डालता है?” इब्रानी क्रिया का अर्थ सामान्य रूप से “करना” या “कुछ प्रभाव उत्पन्न करना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם חָטָאתָ
  choice: यदि तू पाप करे
  rationale: शर्तसूचक אִם और सामान्य, कालातीत तर्क में आए पूर्ण क्रियारूप को हिंदी की स्वाभाविक संभावनार्थक शर्त के रूप में रखा गया है। एकवचन संबोधन के लिए ‘तू’ अय्यूब से सीधे संबोधन को सुरक्षित रखता है।
- source_word: מַה תִּפְעָל בּוֹ
  choice: तो उसके विरुद्ध क्या कर लेता है?
  rationale: פעל का अर्थ करना या कुछ प्रभाव उत्पन्न करना हो सकता है, और בּוֹ यहाँ परमेश्वर के विरुद्ध किए जाने वाले कार्य का भाव देता है। ‘कर लेता है’ प्रश्न के परिणामपरक और आलंकारिक बल को व्यक्त करता है, पर स्पष्ट रूप से ‘हानि’ जोड़कर अर्थ को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: וְרַבּוּ פְשָׁעֶיךָ
  choice: और यदि तेरे अपराध बहुत बढ़ जाएँ
  rationale: दूसरे समानांतर खंड में निहित शर्त को हिंदी में स्पष्ट किया गया है। רבב बहुल होने का भाव देता है; ‘बहुत बढ़ जाएँ’ अपराधों की संख्या बढ़ने को स्वाभाविक हिंदी में व्यक्त करता है। פשע के जानबूझकर उल्लंघन या विद्रोह के गंभीर भाव के लिए ‘अपराध’ चुना गया है।
- source_word: מַה תַּעֲשֶׂה לּוֹ
  choice: तो तू उसका क्या कर देता है?
  rationale: עשה के सामान्य ‘करना’ अर्थ और לּוֹ के ‘उसके साथ/उसके प्रति’ संबंध को निकटता से रखा गया है। यह आलंकारिक प्रश्न को बनाए रखता है और ‘क्या हानि पहुँचाता है’ जैसी अधिक व्याख्यात्मक भाषा नहीं जोड़ता।
theological_decisions:
- issue: क्या प्रश्नों को इस अर्थ में स्पष्ट किया जाए कि मनुष्य का पाप परमेश्वर को कोई हानि नहीं पहुँचा सकता, या हिब्रू की अपेक्षाकृत खुली प्रश्नात्मक भाषा रखी जाए।
  choice: आलंकारिक प्रश्नों को खुला रखा गया है, जबकि ‘उसके विरुद्ध’ पहले खंड की विरोधात्मक दिशा को व्यक्त करता है।
  alternative: ‘तू उसे क्या हानि पहुँचा सकता है?’ जैसे अधिक स्पष्ट व्याख्यात्मक अनुवाद।
  rationale: संदर्भ में एलीहू परमेश्वर की महानता और मनुष्य के पाप से उसके घट या क्षतिग्रस्त न होने पर बल देता है; फिर भी पद यह नहीं कहता कि पाप का परमेश्वर के सामने कोई नैतिक महत्त्व ही नहीं है। चुनी हुई भाषा इस तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। एकवचन ‘तू/तेरे’ मूल इब्रानी के 2 पुल्लिंग एकवचन संबोधन को दर्शाता है। दोनों समानांतर आलंकारिक प्रश्नों तथा उनकी क्रियात्मक भिन्नता को यथासंभव सुरक्षित रखा गया है।
