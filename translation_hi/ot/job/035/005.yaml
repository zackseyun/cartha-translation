  yaml_path: translation/ot/job/035/005.yaml
  text: Look at the heavens and see; gaze at the clouds—they are higher than you.
translation:
  language: hi
  text: आकाश की ओर देख और ध्यान से देख; बादलों को निहार—वे तुझसे ऊँचे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֵּט
  choice: की ओर देख
  rationale: यह क्रिया ध्यानपूर्वक ऊपर देखने का आह्वान करती है; ‘आकाश की ओर देख’ हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: וּרְאֵה
  choice: और ध्यान से देख
  rationale: पहली दृष्टि-क्रिया के साथ समानार्थी बलाघात को बनाए रखने के लिए इसे छोड़ा नहीं गया; ‘ध्यान से’ पुनरुक्ति को अर्थपूर्ण बनाता है।
- source_word: וְשׁוּר
  choice: निहार
  rationale: यह ध्यान से देखने या एकटक दृष्टि लगाने का भाव देता है और पिछली दो दृष्टि-क्रियाओं से शैलीगत भिन्नता बनाए रखता है।
- source_word: שְׁחָקִים
  choice: बादलों
  rationale: इस काव्यात्मक बहुवचन का प्रसंगानुकूल अर्थ ऊँचे आकाश में स्थित बादल है; आधुनिक पाठक के लिए ‘बादल’ सहज है।
- source_word: גָּבְהוּ מִמֶּךָּ
  choice: वे तुझसे कहीं ऊँचे हैं
  rationale: तुलनात्मक अर्थ को स्पष्ट रखा गया है; ‘कहीं’ ऊँचाई के प्रबल अंतर को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: आकाश और बादलों की ऊँचाई का तर्कगत संकेत
  choice: केवल प्रत्यक्ष तुलना को अनूदित किया गया
  alternative: परमेश्वर की महानता या मनुष्य की तुच्छता को पद में व्याख्यात्मक रूप से जोड़ना
  rationale: मूल पद केवल आकाशीय ऊँचाई की ओर ध्यान दिलाता है; उसके धार्मिक निष्कर्ष अगले संदर्भ से उभरते हैं, इसलिए उन्हें यहाँ आयात नहीं किया गया।
translation_notes:
  register: आधुनिक, काव्यात्मक और गरिमापूर्ण हिन्दी। प्रसंग में एक व्यक्ति को संबोधन होने के कारण एकवचन ‘देख’, ‘निहार’ और ‘तुझसे’ रखा गया है। मूल की तीन दृष्टि-क्रियाओं का क्रम सुरक्षित रखा गया है।
