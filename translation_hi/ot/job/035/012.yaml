base_translation:
  language: en
  yaml_path: translation/ot/job/035/012.yaml
  text: There they cry out[a], but he does not answer[b], because of the pride of evil men.
translation:
  language: hi
  text: वहाँ वे पुकारते हैं, पर वह उत्तर नहीं देता[a], दुष्टों के घमंड के कारण।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘वह’ का नाम स्पष्ट नहीं है; संदर्भ से परमेश्वर अभिप्रेत जान पड़ता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שָׁם
  choice: वहाँ
  rationale: यह क्रियाविशेषण मुख्यतः स्थानसूचक है और पिछले पद में बताई गई परिस्थिति की ओर संकेत करता है।
- source_word: יִצְעֲקוּ
  choice: वे पुकारते हैं
  rationale: צעק संकट में सहायता के लिए ऊँचे स्वर से पुकारने को व्यक्त करता है; यह सरल और स्वाभाविक हिन्दी है।
- source_word: וְלֹא יַעֲנֶה
  choice: पर वह उत्तर नहीं देता
  rationale: वाव को यहाँ पुकार और उत्तर न मिलने के विरोध के कारण ‘पर’ किया गया है। एकवचन पुल्लिंग क्रिया के अनुरूप ‘वह’ रखा गया है, पर उसका नाम नहीं जोड़ा गया।
- source_word: מִפְּנֵי
  choice: क्योंकि
  rationale: यहाँ पदबंध कारण बताता है; हिन्दी में उपवाक्य के साथ ‘क्योंकि’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: גְּאוֹן
  choice: घमंड
  rationale: इस नकारात्मक प्रसंग में शब्द का अर्थ गौरव या महिमा नहीं, बल्कि अभिमान अथवा अहंकार है।
- source_word: רָעִים
  choice: दुष्टों
  rationale: पुल्लिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में दुष्ट मनुष्यों को सूचित करता है; ‘दुष्टों’ संक्षिप्त, स्वाभाविक और रूप की पुल्लिंगता के अनुरूप है।
theological_decisions:
- issue: ‘उत्तर नहीं देता’ का अंतर्निहित कर्ता
  choice: ‘वह’ रखा गया है, पर उसे स्पष्ट रूप से ‘परमेश्वर’ नहीं कहा गया।
  alternative: परमेश्वर उन्हें उत्तर नहीं देता
  rationale: संदर्भ परमेश्वर की ओर संकेत करता है, किंतु इस इब्रानी उपवाक्य में कर्ता का नाम नहीं है। अनुवाद मूल पाठ के इस संयम और हल्की अस्पष्टता को बनाए रखता है।
- issue: מִפְּנֵי גְּאוֹן רָעִים का संबंध
  choice: क्योंकि दुष्टों में घमंड है
  alternative: दुष्टों के घमंड के कारण
  rationale: दोनों अभिव्यक्तियाँ कारण बताती हैं। चुनी हुई हिन्दी यह स्पष्ट करती है कि घमंड दुष्टों का गुण है, बिना यह तय किए कि ‘दुष्ट’ पुकारने वाले ही हैं या व्यापक रूप से अत्याचारी लोग।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘पुकारते हैं’ संकटपूर्ण पुकार को सरल भाषा में रखता है; ‘दुष्टों में घमंड’ मूल कारणवाचक पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
