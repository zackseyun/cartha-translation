  yaml_path: translation/ot/job/035/009.yaml
  text: Because of the multitude of oppressions they cry out[b][a]; they call for help because of the arm of the mighty.
translation:
  language: hi
  text: अत्याचारों की बहुतायत के कारण लोग पुकार उठते हैं; शक्तिशाली लोगों की भुजा के कारण वे सहायता के लिए दुहाई देते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे शक्तिशाली लोगों की भुजा से छुटकारे के लिए दुहाई देते हैं।” “भुजा” यहाँ शक्ति या सामर्थ्य का चित्र है।
    reason: lexical_alternative_and_cultural_note
lexical_decisions:
- source_word: מֵרֹב עֲשׁוּקִים
  choice: अत्याचारों की बहुतायत के कारण
  rationale: מִן यहाँ कारण व्यक्त करता है, רֹב बहुतायत को, और עֲשׁוּקִים संदर्भ में अत्याचार के अनेक कृत्यों को दर्शाता है। यह अभिव्यक्ति मूल निर्माण और उसके कारणात्मक भाव को बनाए रखती है।
- source_word: יַזְעִיקוּ
  choice: लोग पुकार उठते हैं
  rationale: हिफ़ईल रूप संकट में ऊँची पुकार उठाने का भाव देता है। हिब्रू में कर्ता अनिर्दिष्ट बहुवचन है, इसलिए हिन्दी में स्वाभाविक रूप से ‘लोग’ जोड़ा गया है।
- source_word: יְשַׁוְּעוּ
  choice: वे सहायता के लिए दुहाई देते हैं
  rationale: यह क्रिया सहायता माँगने की पुकार दर्शाती है। ‘दुहाई देते हैं’ पहली क्रिया से हल्का भेद रखते हुए समानांतरता और संकट का भाव बनाए रखता है।
- source_word: מִזְּרֹעַ
  choice: भुजा के कारण
  rationale: זְרוֹעַ का शाब्दिक अर्थ ‘भुजा’ है और यहाँ वह सामर्थ्य का चित्र है। מִן को मुख्य पाठ में कारणात्मक समझा गया है, पर उसकी स्रोत अथवा छुटकारे की संभावित व्याख्या पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: רַבִּים
  choice: शक्तिशाली लोगों
  rationale: संदर्भ में यह केवल संख्या में ‘बहुतों’ की अपेक्षा सामाजिक रूप से सामर्थी या प्रभुत्वशाली लोगों की ओर संकेत करता है।
theological_decisions:
- issue: מִזְּרֹעַ का संबंध और अर्थ
  choice: शक्तिशाली लोगों की भुजा के कारण वे सहायता के लिए दुहाई देते हैं
  alternative: वे शक्तिशाली लोगों की भुजा से बचने के लिए दुहाई देते हैं
  rationale: מִן कारण अथवा स्रोत/छुटकारे की दिशा दोनों व्यक्त कर सकता है। संदर्भ में अत्याचार के कारण उठी पुकार स्वाभाविक है, किंतु वैकल्पिक अर्थ को दबाया नहीं गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘अत्याचारों की बहुतायत’ मूल की संज्ञात्मक संरचना को सुरक्षित रखती है; ‘दुहाई देते हैं’ सहायता की व्याकुल पुकार को स्वाभाविक हिन्दी में व्यक्त करता है।
