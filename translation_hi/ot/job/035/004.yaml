- source_word: אֲנִי
  choice: मैं
  rationale: प्रथम पुरुष एकवचन सर्वनाम को इब्रानी के बलाघात के अनुरूप स्पष्ट रखा गया है।
- source_word: אֲשִׁיבְךָ
  choice: तुझे ... उत्तर दूँगा
