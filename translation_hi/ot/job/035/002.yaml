base_translation:
  language: en
  yaml_path: translation/ot/job/035/002.yaml
  text: 'Do you think this is just: you say[a], ‘My righteousness is greater than God’s’?'
translation:
  language: hi
  text: क्या तू इसे न्यायसंगत समझता है? तू कहता है[a], “मेरी धार्मिकता परमेश्वर की धार्मिकता से बढ़कर है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी धार्मिकता परमेश्वर के सामने है,” अथवा, “मेरा न्याय परमेश्वर से है।” इब्रानी वाक्यांश संक्षिप्त है, और ‘मेरी धार्मिकता’ का ‘परमेश्वर’ से ठीक क्या संबंध है, इस पर मतभेद है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲזֹאת חָשַׁבְתָּ
  choice: क्या तू इसे ... समझता है?
  rationale: प्रश्नसूचक הֲ, संकेतवाचक זֹאת और חָשַׁבְתָּ मिलकर एक आलंकारिक प्रश्न बनाते हैं। वर्तमानकालीन हिंदी इस प्रत्यक्ष आरोप को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לְמִשְׁפָּט
  choice: न्यायसंगत
  rationale: מִשְׁפָּט यहाँ न्याय, उचितता या वैध अधिकार का भाव रखता है। ‘न्यायसंगत’ एलीहू के मूल्यांकनात्मक प्रश्न को सहज हिंदी में व्यक्त करता है।
- source_word: אָמַרְתָּ
  choice: तू कहता है
  rationale: रूप पूर्णकालिक है, पर भाषण के प्रसंग में यह अय्यूब के वर्तमान महत्त्व वाले कथन को उद्धृत करता है। ‘तू कहता है’ आरोप की तात्कालिकता बनाए रखता है।
- source_word: צִדְקִי
  choice: मेरी धार्मिकता
  rationale: צֶדֶק से बना यह पद नैतिक और न्यायिक सहीपन का अर्थ रखता है। ‘धार्मिकता’ इस शब्द के व्यापक बाइबिलीय संबंध को बनाए रखती है।
- source_word: מֵאֵל
  choice: परमेश्वर की धार्मिकता से बढ़कर
  rationale: מִן को यहाँ तुलनात्मक अर्थ में लिया गया है। हिंदी में तुलना स्पष्ट करने के लिए ‘परमेश्वर की धार्मिकता’ दोहराई गई है; मूल की संक्षिप्तता और अन्य संभावित संबंधों को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: एलीहू द्वारा प्रस्तुत अय्यूब के दावे का अर्थ
  choice: 'तुलनात्मक अर्थ: ‘मेरी धार्मिकता परमेश्वर की धार्मिकता से बढ़कर है’'
  alternative: ‘मेरी धार्मिकता परमेश्वर के सामने है’ अथवा ‘मेरा न्याय परमेश्वर से है’
  rationale: צִדְקִי מֵאֵל अत्यंत संक्षिप्त और विवादित है। संदर्भ में तुलनात्मक अर्थ एलीहू के आरोप से अच्छी तरह मेल खाता है, पर अन्य व्याकरणिक संभावनाओं को दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण पर सरल शैली रखी गई है। एलीहू द्वारा अय्यूब को सीधे संबोधित करने के कारण एकवचन ‘तू’ प्रयुक्त है। मुख्य पाठ में सर्वाधिक संभावित तुलनात्मक अर्थ है, जबकि मूल की वास्तविक अस्पष्टता पादटिप्पणी में बनी हुई है।
