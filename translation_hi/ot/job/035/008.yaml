  yaml_path: translation/ot/job/035/008.yaml
  text: Your wickedness affects a man like yourself[a], and your righteousness a son of man.
translation:
  language: hi
  text: 'तुम्हारी दुष्टता तुम्हारे जैसे मनुष्य को प्रभावित करती है,

    और तुम्हारी धार्मिकता मनुष्य[a] को प्रभावित करती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “मनुष्य के पुत्र।” इब्रानी में यह यहाँ किसी नश्वर मनुष्य के लिए प्रचलित अभिव्यक्ति है, कोई मसीही उपाधि नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאִישׁ
  choice: मनुष्य पर असर डालती है
  rationale: इब्रानी उपवाक्य में क्रिया लुप्त है और לְ उस व्यक्ति को सूचित करता है जिस तक कर्म का प्रभाव पहुँचता है। पिछले पदों के संदर्भ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘असर डालती है’ जोड़ा गया है।
- source_word: כָּמוֹךָ
  choice: तुम्हारे जैसे
  rationale: 'यह स्पष्ट तुलना को बनाए रखता है: अय्यूब का आचरण उसी के समान किसी दूसरे मनुष्य को प्रभावित करता है।'
- source_word: רִשְׁעֶךָ
  choice: तुम्हारी दुष्टता
  rationale: यह शब्द नैतिक बुराई या दुष्ट आचरण को दर्शाता है; ‘दुष्टता’ काव्यात्मक और नैतिक अर्थ दोनों को सीधे रखता है।
- source_word: וּלְבֶן אָדָם
  choice: और ... मनुष्य के पुत्र पर
  rationale: मुख्य पाठ इब्रानी के पुल्लिंग एकवचन और उसकी काव्यात्मक छवि को बनाए रखता है। यहाँ यह सामान्य नश्वर मनुष्य के लिए प्रयुक्त पद है, किसी मसीही उपाधि के रूप में नहीं।
- source_word: צִדְקָתֶךָ
  choice: तुम्हारी धार्मिकता
  rationale: यह ‘दुष्टता’ के समानांतर सही और धर्मसंगत आचरण को दर्शाता है; ‘धार्मिकता’ उसका सीधा और संदर्भानुकूल अनुवाद है।
theological_decisions:
- issue: בֶּן אָדָם का संदर्भगत अर्थ
  choice: सामान्य मनुष्य के अर्थ में, मुख्य पाठ में ‘मनुष्य के पुत्र’
  alternative: ‘मनुष्य’ या ‘नश्वर मनुष्य’
  rationale: अय्यूब में यह सामान्य मानवीय और नश्वर व्यक्ति के लिए काव्यात्मक पद है तथा ‘तुम्हारे जैसे मनुष्य’ के समानांतर है। मूल छवि बनाए रखते हुए पादटिप्पणी मसीही उपाधि के रूप में संभावित गलत समझ को रोकती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। पहले उपवाक्य में संदर्भ से निहित क्रिया ‘असर डालती है’ स्पष्ट की गई है; दूसरे उपवाक्य में अनावश्यक पुनरावृत्ति से बचने के लिए वही क्रिया निहित छोड़ी गई है।
