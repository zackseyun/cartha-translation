- source_word: אַיִן פָּקַד אַפּוֹ
  choice: उसने अपने क्रोध में दण्ड नहीं दिया
  rationale: פקד का अर्थ ‘सुधि लेना,’ ‘भेंट करना’ या दण्डात्मक रूप से ‘दण्ड देना’ हो सकता है। ‘अपने क्रोध में दण्ड नहीं दिया’ इस कठिन वाक्यांश के न्याय-संबंधी भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְלֹא יָדַע
  choice: और वह ... ध्यान नहीं देता
  rationale: ידע यहाँ केवल बौद्धिक ज्ञान के बजाय ध्यान देने या संज्ञान लेने के अर्थ में समझा गया है।
- source_word: בַּפַּשׁ מְאֹד
  choice: बड़े अपराध पर
  rationale: दुर्लभ और अनिश्चित פשׁ को न्यायिक प्रसंग में ‘अपराध’ समझा गया है; מאד को विशेषणात्मक हिंदी ‘बड़े’ से व्यक्त किया गया है। शब्दगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अत्यंत कठिन इब्रानी उपवाक्य का अर्थ
  choice: पद को इस आशय में रखा गया है कि परमेश्वर ने अपने क्रोध में दण्ड नहीं दिया और बड़े अपराध पर ध्यान नहीं देता।
  alternative: यह अर्थ भी संभव है कि परमेश्वर ने क्रोध में सुधि नहीं ली और बड़ी उद्दण्डता को नहीं पहचाना।
  rationale: शब्द-विन्यास और विशेषकर दूसरे खंड का दुर्लभ शब्द अनिश्चित है। अनुवाद एलीहू के कथन की तनावपूर्ण अभिव्यक्ति को बनाए रखता है और इसे परमेश्वर की अज्ञानता या उदासीनता का निर्विवाद धर्मवैज्ञानिक दावा नहीं बनाता।
