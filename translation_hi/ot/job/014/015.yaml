  footnotes:
  - marker: a
    text: 'यहाँ क्रियाएँ पूर्ववर्ती प्रसंग की आशापूर्ण, काल्पनिक स्थिति को व्यक्त करती हैं: “तू पुकारता, तो मैं तुझे उत्तर देता।”'
    reason: grammar
  - marker: b
    text: “तेरे हाथों की कृति” से आशय मनुष्य है, जिसे परमेश्वर ने बनाया है।
    reason: cultural_note
lexical_decisions:
- source_word: תִּקְרָא
  choice: तू पुकारता
  rationale: काल्पनिक और आशापूर्ण प्रसंग में क़ाल अपूर्ण रूप को साधारण भविष्य के बजाय संभावनार्थक अर्थ में प्रस्तुत किया गया है; अगले खंड का ‘उत्तर देता’ इसी अधूरी शर्तात्मक रचना को स्वाभाविक हिंदी में पूरा करता है।
- source_word: וְאָנֹכִי
  choice: और मैं
  rationale: संयोजक और बलयुक्त प्रथम-पुरुष सर्वनाम परमेश्वर की पुकार के प्रत्युत्तर में अय्यूब की प्रतिक्रिया को उभारते हैं।
- source_word: אֶעֱנֶךָּ
  choice: तुझे उत्तर देता
  rationale: ענה का सीधा अर्थ ‘उत्तर देना’ है। ‘देता’ पहले क्रियापद के काल्पनिक भाव से जुड़कर ‘मैं उत्तर देता’ का संभावनार्थक अर्थ व्यक्त करता है।
- source_word: לְמַעֲשֵׂה
  choice: की बनाई हुई रचना के लिए
  rationale: מַעֲשֶׂה यहाँ कार्य, उत्पाद या बनाई हुई वस्तु को दर्शाता है। ‘रचना’ मनुष्य को परमेश्वर द्वारा बनाया हुआ बताने वाली सृष्टि-छवि को स्पष्ट और स्वाभाविक रूप से रखती है।
- source_word: יָדֶיךָ
  choice: अपने हाथों की
  rationale: मूल की शाब्दिक ‘तेरे हाथों’ वाली मानवरूपी सृष्टि-छवि को बनाए रखा गया है; हिंदी में कर्ता की ओर लौटता ‘अपने’ स्वाभाविक है।
- source_word: תִכְסֹף
  choice: तरसता
  rationale: כסף गहरी लालसा या उत्कंठा व्यक्त करता है। ‘तरसता’ आधुनिक हिंदी में इस भाव की तीव्रता बनाए रखता है और मात्र ध्यान देने का अर्थ नहीं देता।
theological_decisions:
- issue: क्या पद मनुष्य के प्रति केवल परमेश्वर के ध्यान को या उसकी गहरी लालसा को व्यक्त करता है
  choice: तू ... तरसता
  alternative: तू ... का ध्यान रखता
  rationale: כסף का सामान्य अर्थ लालसा करना या तरसना है। अधिक हल्का अर्थ चुनने के बजाय अय्यूब की इस आशा का भाव सुरक्षित रखा गया है कि परमेश्वर अपने बनाए हुए प्राणी के लिए फिर लालायित होगा।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, काव्यात्मक किंतु सहज रूप। अय्यूब द्वारा परमेश्वर को एकवचन निकट संबोधन होने के कारण ‘तू/तुझे’ रखा गया है। मुख्य पाठ में शर्तात्मकता को हिंदी की अपूर्ण काल्पनिक रचना से व्यक्त किया गया है।
