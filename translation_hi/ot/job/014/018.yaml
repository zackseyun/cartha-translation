  text: But even a mountain falling wears away[b][a], and a rock is moved from its place.
translation:
  language: hi
  text: परन्तु गिरता हुआ पहाड़ भी नष्ट हो जाता है[a], और चट्टान अपने स्थान से हट जाती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुरझा जाता है।” मूल क्रिया प्रायः मुरझाने या कुम्हलाने के लिए आती है; यहाँ उसका प्रयोग पहाड़ के लिए रूपक के रूप में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने स्थान से हटा दी जाती है।” मूल क्रिया हटने अथवा हटाए जाने—दोनों भावों की गुंजाइश रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु … भी
  rationale: यह पद पिछले विचार के विपरीत एक बलयुक्त संक्रमण लाता है; ‘परन्तु … भी’ उस विरोध और इस बात पर बल—दोनों को व्यक्त करता है कि पहाड़ जैसी स्थायी वस्तु भी नष्ट होती है।
- source_word: הַר נוֹפֵל
  choice: गिरता हुआ पहाड़
  rationale: נוֹפֵל क़ाल कृदन्त है। ‘गिरता हुआ’ उसके सजीव, जारी क्रियात्मक चित्र को बनाए रखता है।
- source_word: יִבּוֹל
  choice: क्षीण हो जाता है
  rationale: इस क्रिया का सामान्य अर्थ मुरझाना या कुम्हलाना है, पर यहाँ पहाड़ के लिए रूपकात्मक प्रयोग है। ‘क्षीण हो जाता है’ धीरे-धीरे घटने और नष्ट होने का भाव रखता है तथा वनस्पति-संबंधी शब्द को पहाड़ पर अस्वाभाविक ढंग से लागू नहीं करता।
- source_word: וְצוּר
  choice: और चट्टान
  rationale: צוּר के अर्थ चट्टान, शैल या कगार हो सकते हैं। यहाँ ‘चट्टान’ सामान्य और स्वाभाविक है तथा पहाड़ के समानान्तर चित्र के अनुकूल है।
- source_word: יֶעְתַּק מִמְּקֹמוֹ
  choice: अपने स्थान से हट जाती है
  rationale: क्रिया किसी वस्तु के खिसकने, हटने या स्थान से दूर किए जाने को व्यक्त कर सकती है। यह अनुवाद परिणाम को स्वाभाविक हिन्दी में कहता है और कर्ता या कारण को अनावश्यक रूप से निश्चित नहीं करता।
