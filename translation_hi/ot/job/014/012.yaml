source:
  edition: WLC
  text: וְ/אִ֥ישׁ שָׁכַ֗ב וְֽ/לֹא יָ֫ק֥וּם עַד בִּלְתִּ֣י שָׁ֭מַיִם לֹ֣א יָקִ֑יצוּ וְ/לֹֽא יֵ֝עֹ֗רוּ מִ/שְּׁנָתָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/012.yaml
  text: So a man lies down and does not rise[a]; until the heavens are no more[b], they will not awake or be roused from their sleep.
translation:
  language: hi
  text: इसी प्रकार मनुष्य लेट जाता है और नहीं उठता; जब तक आकाश नहीं रह जाता,[a] वे न जागेंगे और न अपनी नींद से जगाए जाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति का आशय है, “जब तक आकाश का अस्तित्व समाप्त न हो।” यह वस्तुतः अगम्य समय-सीमा को सूचित करने वाली मुहावरेदार अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: 'इस पद में मृत्यु के लिए नींद की छवि प्रयुक्त हुई है: “न जागेंगे और न अपनी नींद से जगाए जाएँगे।”'
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ
  choice: इसी प्रकार मनुष्य
  rationale: אִישׁ यहाँ प्रतिनिधि अर्थ में एक मनुष्य को दर्शाता है। आरंभिक וְ को पिछले पदों की तुलना और तर्क से जोड़ने के लिए ‘इसी प्रकार’ किया गया है।
- source_word: שָׁכַב
  choice: लेट जाता है
  rationale: क्रिया का सामान्य अर्थ ‘लेटना’ है और यहाँ यह मृत्यु के लिए प्रयुक्त रूपक है; मुख्य पाठ में रूपक को ‘मर जाता है’ कहकर स्पष्ट नहीं किया गया।
- source_word: וְלֹא יָקוּם
  choice: और फिर नहीं उठता
  rationale: यह मृत्यु के बाद न उठने की छवि बनाए रखता है। ‘फिर’ हिंदी में प्रसंगगत परिणति को स्वाभाविक बनाता है, पर पुनरुत्थान संबंधी कोई अतिरिक्त निष्कर्ष नहीं जोड़ता।
- source_word: עַד בִּלְתִּי שָׁמַיִם
  choice: जब तक आकाश न रहे
  rationale: यह असामान्य इब्रानी रचना का स्वाभाविक हिंदी रूप है और अत्यंत दूर, वस्तुतः अगम्य समय-सीमा को व्यक्त करती है।
- source_word: לֹא יָקִיצוּ
  choice: मनुष्य न जागेंगे
  rationale: इब्रानी पाठ प्रतिनिधि एकवचन से बहुवचन क्रिया की ओर जाता है। हिंदी में अस्पष्ट सर्वनाम के बजाय ‘मनुष्य’ दोहराकर यह बहुवचन सामान्यीकरण स्पष्ट रखा गया है।
- source_word: וְלֹא יֵעֹרוּ
  choice: और न ... जगाए जाएँगे
  rationale: निफ़अल रूप का कर्मवाच्य भाव रखा गया है और ‘जागेंगे’ के साथ काव्यात्मक समानांतरता बनी रहती है।
- source_word: מִשְּׁנָתָם
  choice: अपनी नींद से
  rationale: ‘नींद’ मृत्यु के रूपक को सीधे और सामान्य आधुनिक हिंदी में बनाए रखती है; ‘अपनी’ बहुवचन कर्ता की ओर संकेत करता है।
theological_decisions:
- issue: क्या मृत्यु के रूपक को विनाश या पुनरुत्थान के निषेध के रूप में स्पष्ट किया जाए
  choice: लेटने, न उठने और नींद से न जागने की मूल छवियाँ बनाए रखना
  alternative: ‘मर जाता है और फिर जीवित नहीं होगा’ जैसे अधिक व्याख्यात्मक शब्द प्रयोग करना
  rationale: पद अय्यूब के कथन में मानव मृत्यु को काव्यात्मक रूप से प्रस्तुत करता है। अनुवाद इसे अंतिम पुनरुत्थान या विनाश के विषय में व्यवस्थित धर्मसिद्धांत में नहीं बदलता।
- issue: אִישׁ का लिंग और प्रतिनिधि प्रयोग
  choice: मनुष्य
  alternative: आदमी या व्यक्ति
  rationale: ‘मनुष्य’ आधुनिक हिंदी में मानवीय नश्वरता के प्रतिनिधि अर्थ को स्वाभाविक ढंग से व्यक्त करता है और इब्रानी के एकवचन से आगे आने वाले बहुवचन परिवर्तन को भी संभालता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मृत्यु के लिए मूल काव्यात्मक रूपक सुरक्षित है। प्रतिनिधि एकवचन से बहुवचन में इब्रानी बदलाव को हिंदी में ‘मनुष्य’ की पुनरावृत्ति और बहुवचन क्रियाओं से दर्शाया गया है।
