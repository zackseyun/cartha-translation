    text: या, “उसके पुत्र सम्मानित होते हैं।”
    reason: יִכְבְּדוּ का अर्थ ‘सम्मानित होना’ भी हो सकता है; मुख्य पाठ ‘प्रतिष्ठित हो जाते हैं’ में उसके होने/बनने का भाव स्पष्ट किया गया है।
  revision_rationale: 'The text is revised to represent the Hebrew contrast more closely: the sons become honored and then become low or insignificant, while the man remains unaware. The final wording makes the reference of לָמוֹ (‘concerning them’) explicit through ‘उनकी दशा’ while retaining the distinct sense of understanding (בין), rather than merely knowing (ידע).'
