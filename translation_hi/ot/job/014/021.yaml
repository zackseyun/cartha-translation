  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। समानांतर खंडों में ‘पर वह नहीं जानता / पर उसे…समझ नहीं होती’ द्वारा काव्यात्मक संतुलन रखा गया है; मृत्यु के बाद की अवस्था के बारे में पद से अधिक कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
