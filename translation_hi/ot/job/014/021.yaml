base_translation:
  language: en
  yaml_path: translation/ot/job/014/021.yaml
  text: His sons come to honor[a], and he does not know it; they are brought low, and he does not perceive it.
translation:
  language: hi
  text: उसके पुत्र प्रतिष्ठित हो जाते हैं[a], पर वह नहीं जानता; वे तुच्छ हो जाते हैं, पर वह उनकी दशा को नहीं समझता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पुत्र सम्मानित होते हैं।”
    reason: יִכְבְּדוּ का अर्थ ‘सम्मानित होना’ भी हो सकता है; मुख्य पाठ ‘प्रतिष्ठित हो जाते हैं’ में उसके होने/बनने का भाव स्पष्ट किया गया है।
lexical_decisions:
- source_word: יִכְבְּדוּ
  choice: सम्मान पाते हैं
  rationale: כבד के क़ाल रूप का यहाँ अर्थ प्रतिष्ठित या सम्मानित होना है। यह अनुवाद पुत्रों को बहुवचन कर्ता बनाए रखता है और सम्मान बढ़ने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָנָיו
  choice: उसके पुत्र
  rationale: इब्रानी शब्द स्पष्टतः पुल्लिंग बहुवचन है और उसके साथ तृतीय पुरुष एकवचन का संबंधसूचक प्रत्यय है।
- source_word: וְלֹא יֵדָע
  choice: पर वह नहीं जानता
  rationale: ידע का मूल अर्थ जानना है। प्रसंग में विरोध स्पष्ट होने के कारण וְ को स्वाभाविक हिन्दी में ‘पर’ कहा गया है।
- source_word: וְיִצְעֲרוּ
  choice: वे दीन हो जाते हैं
  rationale: צער यहाँ सम्मान पाने के विपरीत घटने, छोटा या निम्न हो जाने का भाव देता है। ‘दीन हो जाते हैं’ उस अवस्था-परिवर्तन को संक्षेप में व्यक्त करता है।
- source_word: וְלֹא יָבִין לָמוֹ
  choice: पर उसे उनके विषय में कुछ समझ नहीं होती
  rationale: בין समझने या भाँपने को और לָמוֹ पुत्रों से संबंधित होने को व्यक्त करता है। हिन्दी वाक्य में ‘कुछ’ स्वाभाविक निषेध रचना है, अर्थ-विस्तार नहीं।
