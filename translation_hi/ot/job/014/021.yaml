review_pass:
  verdict: revise
  source_fidelity: יִכְבְּדוּ carries the sense of becoming honored/important; ‘सम्मान पाते हैं’ is broadly possible but does not clearly convey this development. וְיִצְעֲרוּ denotes becoming low/insignificant in contrast to honor; ‘दीन हो जाते हैं’ can primarily suggest poverty or pitiableness and is less precise. The final clause refers to the sons’ changed condition; ‘उनकी दशा को नहीं समझता’ communicates this naturally without making a doctrinal claim.
  naturalness: The revision retains a concise, dignified Hindi poetic parallelism. ‘प्रतिष्ठित हो जाते हैं’ and ‘तुच्छ हो जाते हैं’ are idiomatic and preserve the contrast. ‘उनकी दशा को नहीं समझता’ is clearer and more natural than ‘उनके विषय में कुछ समझ नहीं होती।’
  terminology: ‘पुत्र’ properly preserves the masculine plural. ‘प्रतिष्ठित’ and ‘तुच्छ’ preserve the honor/lowliness contrast without importing a poverty-specific sense. No theological terminology is involved.
  issues:
  - severity: medium
    issue: ‘दीन हो जाते हैं’ is semantically imprecise for וְיִצְעֲרוּ.
    rationale: In this antithetical context the Hebrew concerns being diminished or made insignificant, rather than specifically becoming poor, needy, or pitiable.
  - severity: low
    issue: The opening phrase does not clearly express the becoming/resultative force of יִכְבְּדוּ.
    rationale: ‘सम्मान पाते हैं’ may describe receiving honor, whereas ‘प्रतिष्ठित हो जाते हैं’ directly represents becoming honored/important.
  - severity: low
    issue: ‘उनके विषय में कुछ समझ नहीं होती’ is awkward and its impersonal construction weakens the parallel subject.
    rationale: The Hebrew has ‘he does not understand concerning them’; a personal construction is clearer in modern Hindi.
  revised_text: उसके पुत्र प्रतिष्ठित हो जाते हैं[a], पर वह नहीं जानता; वे तुच्छ हो जाते हैं, पर वह उनकी दशा को नहीं समझता।
  revised_footnotes:
