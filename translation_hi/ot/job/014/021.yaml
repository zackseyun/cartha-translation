revisions:
- from: उसके पुत्र सम्मान पाते हैं[a], पर वह नहीं जानता; वे दीन हो जाते हैं, पर उसे उनके विषय में कुछ समझ नहीं होती।
  to: उसके पुत्र प्रतिष्ठित हो जाते हैं[a], पर वह नहीं जानता; वे तुच्छ हो जाते हैं, पर वह उनकी दशा को नहीं समझता।
  rationale: 'The text is revised to represent the Hebrew contrast more closely: the sons become honored and then become low or insignificant, while the man remains unaware. The final wording makes the reference of לָמוֹ (‘concerning them’) explicit through ‘उनकी दशा’ while retaining the distinct sense of understanding (בין), rather than merely knowing (ידע).'
