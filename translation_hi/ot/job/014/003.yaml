  yaml_path: translation/ot/job/014/003.yaml
  text: Yet on such a one you open your eyes[a], and you bring me into judgment with you.
translation:
  language: hi
  text: 'फिर भी तू ऐसे मनुष्य पर अपनी आँखें खोलता है,

    और मुझे अपने साथ न्याय के लिए लाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सामने न्याय के लिए लाता है।” इब्रानी में शाब्दिक रूप से “अपने साथ” है; इसका अर्थ परमेश्वर के सामने न्याय के लिए उपस्थित होना या उसके साथ कानूनी विवाद में प्रवेश करना हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַף
  choice: फिर भी
  rationale: यह पद पिछले संदर्भ में मनुष्य की क्षणभंगुरता के बावजूद परमेश्वर द्वारा उसकी जाँच किए जाने पर आश्चर्य और विरोध का भाव व्यक्त करता है।
- source_word: עַל זֶה
  choice: ऐसे मनुष्य पर
  rationale: शाब्दिक अर्थ ‘इस पर’ है, पर संदर्भ में यह पद 1–2 के दुर्बल और क्षणभंगुर मनुष्य की ओर संकेत करता है; ‘ऐसे मनुष्य’ इस संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: פָּקַחְתָּ עֵינֶךָ
  choice: तू अपनी आँखें लगाए रहता है
  rationale: शाब्दिक चित्र ‘अपनी आँखें खोलना’ है, जिसका आशय यहाँ किसी पर ध्यान लगाकर उसकी जाँच करना है। हिंदी मुहावरे में ‘आँखें लगाए रहता है’ उस सतत निगाह और जाँच को व्यक्त करते हुए मूल चित्र को बनाए रखता है।
- source_word: וְאֹתִי
  choice: और मुझे
  rationale: चिह्नित कर्मवाचक सर्वनाम अय्यूब स्वयं पर बल देता है; हिंदी में ‘और मुझे’ उसी व्यक्तिगत बल को सहज रूप में रखता है।
- source_word: תָבִיא
  choice: लाता है
  rationale: בוא के हिफ़ील रूप का मूल अर्थ ‘लाना’ है। न्यायिक संदर्भ में ‘बुलाना’ संभव है, किंतु ‘लाता है’ मूल क्रिया के अधिक निकट है।
- source_word: בְמִשְׁפָּט
  choice: न्याय में
  rationale: מִשְׁפָּט यहाँ न्यायिक कार्यवाही या मुकदमे का बोध देता है। ‘न्याय में’ कानूनी रूपक को बनाए रखता है और उसे आधुनिक अदालत तक सीमित नहीं करता।
- source_word: עִמָּךְ
  choice: अपने साथ
  rationale: עם का सामान्य अर्थ ‘साथ’ है। यहाँ इसका आशय परमेश्वर के सामने न्याय में उपस्थित होना या उसके साथ मुकदमे में पड़ना हो सकता है; मुख्य पाठ में ‘अपने साथ’ मूल अस्पष्टता और तनाव बनाए रखता है।
theological_decisions:
- issue: परमेश्वर को संबोधित करते हुए עִמָּךְ द्वारा व्यक्त न्यायिक संबंध
  choice: अपने साथ
  alternative: अपने सामने / अपने विरुद्ध
  rationale: इब्रानी संबंधसूचक अव्यय का सीधा अर्थ ‘साथ’ है। इससे यह खुला रहता है कि अय्यूब परमेश्वर के सामने न्याय के लिए लाए जाने की बात कह रहा है या परमेश्वर के साथ कानूनी विवाद में प्रवेश करने की। अनुवाद इस तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक और गरिमापूर्ण शैली रखी गई है। अय्यूब की परमेश्वर से सीधी एकवचन संबोधन-शैली के अनुरूप ‘तू’ का प्रयोग किया गया है। प्रश्नवाचक विन्यास संदर्भगत शिकायत को स्वाभाविक हिंदी में व्यक्त करता है।
