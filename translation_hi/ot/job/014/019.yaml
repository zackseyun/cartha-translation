source:
  edition: WLC
  text: אֲבָנִ֤ים שָׁ֥חֲקוּ מַ֗יִם תִּשְׁטֹֽף סְפִיחֶ֥י/הָ עֲפַר אָ֑רֶץ וְ/תִקְוַ֖ת אֱנ֣וֹשׁ הֶאֱבַֽדְתָּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/019.yaml
  text: Water wears away stones[a]; its torrents wash away the soil of the earth; so you destroy the hope of man.
translation:
  language: hi
  text: 'पानी पत्थरों को घिस देता है;

    उसकी बहती धाराएँ[a] धरती की मिट्टी बहा ले जाती हैं;

    इसी तरह तू मनुष्य की आशा नष्ट कर देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका अर्थ निश्चित नहीं है। इसका अर्थ ‘उसके उफान,’ ‘उसके बहाव,’ या संभवतः ‘उससे उगने वाली वस्तुएँ’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָנִים שָׁחֲקוּ מַיִם
  choice: पानी पत्थरों को घिस देता है
  rationale: हिब्रू की संक्षिप्त काव्यात्मक रचना में पानी द्वारा पत्थरों के धीरे-धीरे घिसने का चित्र है। ‘घिस देता है’ अपक्षय की प्रक्रिया को सहज और निकट रूप में व्यक्त करता है।
- source_word: תִּשְׁטֹף
  choice: बहा ले जाती हैं
  rationale: क्रिया का अर्थ धोकर या प्रवाह में बहा ले जाना है। मिट्टी और जलधारा के प्रसंग में यह स्वाभाविक हिन्दी है।
- source_word: סְפִיחֶיהָ
  choice: उसकी बहती धाराएँ
  rationale: यह दुर्लभ और अर्थ की दृष्टि से अनिश्चित पद है। प्रसंग में जल के बहाव या उफान का अर्थ संगत है; अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עֲפַר אָרֶץ
  choice: धरती की मिट्टी
  rationale: शाब्दिक अर्थ ‘धरती की धूल’ है, पर कटाव के इस चित्र में ‘मिट्टी’ आधुनिक हिन्दी में अधिक स्वाभाविक है और आशय को बनाए रखती है।
- source_word: תִקְוַת אֱנוֹשׁ
  choice: मनुष्य की आशा
  rationale: אֱנוֹשׁ नश्वर और दुर्बल मनुष्य पर बल देता है। ‘मनुष्य’ प्रतिनिधिक एकवचन और मानवीय दुर्बलता दोनों के लिए उपयुक्त है।
- source_word: הֶאֱבַדְתָּ
  choice: तू ... नष्ट कर देता है
  rationale: हिफ़ील रूप का अर्थ नष्ट करना या मिटा देना है। एकवचन संबोधन परमेश्वर से अय्यूब की सीधी बात को बनाए रखता है।
theological_decisions:
- issue: अंतिम पंक्ति में परमेश्वर को सीधा संबोधन
  choice: इसी तरह तू मनुष्य की आशा नष्ट कर देता है
  alternative: और मनुष्य की आशा तू नष्ट कर देता है
  rationale: द्वितीय पुरुष एकवचन क्रिया स्पष्ट रूप से परमेश्वर को संबोधित करती है। ‘इसी तरह’ पहले दिए प्राकृतिक अपक्षय के चित्र और मनुष्य की आशा के विनाश के बीच निहित तुलना को स्पष्ट करता है, बिना तनाव को कम किए।
- issue: אֱנוֹשׁ का अनुवाद
  choice: मनुष्य
  alternative: नश्वर मनुष्य
  rationale: ‘मनुष्य’ हिब्रू के प्रतिनिधिक एकवचन को स्वाभाविक हिन्दी में रखता है। ‘नश्वर’ अर्थ में निहित है, पर उसे मुख्य पाठ में जोड़ना आवश्यक नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। काव्यात्मक समानांतरता के लिए तीन पंक्तियाँ हैं; परमेश्वर के लिए निकट एकवचन संबोधन ‘तू’ अय्यूब की सीधी वाणी को दर्शाता है।
