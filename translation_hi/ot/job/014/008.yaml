  yaml_path: translation/ot/job/014/008.yaml
  text: Though its root grows old in the earth[a], and its stump dies in the dust[b],
translation:
  language: hi
  text: चाहे उसकी जड़ धरती में पुरानी हो जाए[a], और उसका ठूँठ धूल में मर जाए[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि उसकी जड़ धरती में पुरानी हो जाए।” इब्रानी कण शर्तसूचक हो सकता है, पर वृक्ष के रूपक के प्रवाह में यहाँ संभवतः रियायती भाव है।
    reason: alternative_reading
  - marker: b
    text: “ठूँठ” के स्थान पर “कटे हुए तने का निचला भाग” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: चाहे
  rationale: यहाँ वृक्ष के रूपक के प्रवाह में यह कण सामान्य शर्त से अधिक रियायती भाव व्यक्त करता है—इतनी निराशाजनक दशा होने पर भी अगले पद में नई बढ़त संभव है।
- source_word: יַזְקִין
  choice: पुरानी पड़ जाए
  rationale: यह क्रिया समय के साथ बूढ़ा या पुराना होने की प्रक्रिया बताती है; जड़ के लिए ‘पुरानी पड़ जाए’ स्वाभाविक हिन्दी है।
- source_word: בָּאָרֶץ
  choice: धरती में
  rationale: वानस्पतिक संदर्भ में אָרֶץ भूमि या धरती को दर्शाता है; ‘धरती’ काव्यात्मक गरिमा बनाए रखता है और ‘धूल’ के समानांतर स्वाभाविक है।
- source_word: שָׁרְשׁוֹ
  choice: उसकी जड़
  rationale: इब्रानी में एकवचन जड़ है और प्रत्यय वृक्ष की ओर संकेत करता है; हिन्दी में सामूहिक अर्थ वाला एकवचन स्वाभाविक है।
- source_word: וּבֶעָפָר
  choice: और धूल में
  rationale: עָפָר धूल या ढीली मिट्टी को दर्शाता है। ‘धूल’ मूल के काव्यात्मक और मृत्यु-संबंधी संकेत को बनाए रखता है।
- source_word: יָמוּת
  choice: मर जाए
  rationale: מות की सीधी अर्थवत्ता ‘मरना’ है; इसे ‘सूख जाना’ कहना मूल में निहित न होने वाली वनस्पतिक छवि जोड़ देता।
- source_word: גִּזְעוֹ
  choice: उसका ठूँठ
  rationale: גֵּזַע कटे हुए वृक्ष के बचे हुए निचले तने या ठूँठ को दर्शाता है; संदर्भ में ‘ठूँठ’ सबसे स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: אִם का शर्तसूचक या रियायती अर्थ
  choice: 'रियायती अर्थ: ‘चाहे’'
  alternative: 'शर्तसूचक अर्थ: ‘यदि’'
  rationale: अगले पद में वृक्ष के फिर अंकुरित होने की आशा के साथ यह पंक्ति ऐसी दशा बताती है जो देखने में अंतिम लगती है; फिर भी इब्रानी कण दोनों अर्थों की गुंजाइश रखता है, इसलिए वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘धरती’ और ‘धूल’ मूल की समानांतर छवि तथा मृत्यु की प्रतिध्वनि को बनाए रखते हैं; ‘मर जाए’ मूल क्रिया की सीधाई को सुरक्षित रखता है।
