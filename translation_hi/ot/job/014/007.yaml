  yaml_path: translation/ot/job/014/007.yaml
  text: 'For there is hope for a tree: if it is cut down[a], it will sprout again[b], and its shoot will not cease.'
translation:
  language: hi
  text: 'क्योंकि पेड़ के लिए आशा है: यदि वह काट दिया जाए, तो वह फिर से अंकुरित होगा[a], और उसकी नई कोंपल बढ़ना बंद नहीं करेगी[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह फिर से नया हो जाएगा” या “वह अपने आपको नया करेगा।” इब्रानी क्रिया में नया होने या नया होने देने का भाव भी हो सकता है; पेड़ के संदर्भ में इसे फिर से अंकुरित होने के रूप में व्यक्त किया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका कोमल अंकुर” अथवा “उसकी फूटती कोंपल।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उस संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: יֵשׁ לָעֵץ תִּקְוָה
  choice: पेड़ के लिए आशा है
  rationale: अस्तित्ववाचक रचना और एक सामान्य, दृष्टांतात्मक पेड़ का भाव सुरक्षित रहता है।
- source_word: אִם יִכָּרֵת
  choice: यदि वह काट दिया जाए
  rationale: אִם की शर्तवाचकता और निफ़अल क्रिया का कर्मवाच्य अर्थ सीधे व्यक्त होता है।
- source_word: וְעוֹד יַחֲלִיף
  choice: तो वह फिर से अंकुरित होगा
  rationale: पेड़ के संदर्भ में חלף का अर्थ नया विकास या पुनः अंकुरण है; यह हिंदी में वनस्पति-चित्र को स्पष्ट और स्वाभाविक रखता है।
- source_word: וְיֹנַקְתּוֹ
  choice: उसकी नई कोंपल
  rationale: יוֹנֶקֶת पेड़ से निकलने वाली कोमल नई शाखा या अंकुर को दर्शाता है; ‘नई कोंपल’ साधारण पाठक के लिए सहज है।
- source_word: לֹא תֶחְדָּל
  choice: निकलना बंद नहीं होगी
  rationale: सिर्फ ‘बंद नहीं होगी’ हिंदी में अपूर्ण लगता है; ‘निकलना’ जोड़ने से नई वृद्धि के जारी रहने का संदर्भगत अर्थ स्पष्ट होता है।
