  yaml_path: translation/ot/job/014/010.yaml
  text: But a man dies and is laid low[a]; a human being expires[c][b], and where is he?
translation:
  language: hi
  text: परंतु पुरुष मर जाता है और निर्बल हो जाता है[a]; मनुष्य प्राण छोड़ देता है[b][c]—और वह कहाँ है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शक्तिहीन हो जाता है।”
    reason: lexical_alternative
  - marker: b
    text: या, “दम तोड़ देता है।”
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी में यहाँ “पुरुष” और “मनुष्य” के लिए दो अलग शब्द समानांतर रूप में आए हैं, जो मानव की नश्वरता पर बल देते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: גֶּבֶר
  choice: पुरुष
  rationale: यह शब्द सामान्यतः वयस्क पुरुष को सूचित करता है और कभी-कभी उसमें सामर्थ्य का भाव होता है; यहाँ ‘पुरुष’ उसके אָדָם के साथ काव्यात्मक समानांतर को बनाए रखता है, बिना ‘वीर’ का अतिरिक्त अर्थ जोड़े।
- source_word: יָמוּת
  choice: मर जाता है
  rationale: यहाँ अपूर्ण क्रिया किसी एक भविष्य की घटना के बजाय मनुष्य की सामान्य नियति व्यक्त करती है; वर्तमानकालिक ‘मर जाता है’ इस सूक्तिपरक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיֶּחֱלָשׁ
  choice: निर्बल हो जाता है
  rationale: חלש का मूल भाव दुर्बल या शक्तिहीन हो जाना है। यह अनुवाद स्रोत के शब्दार्थ को सीधे रखता है और मृत्यु के बाद की दशा को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
- source_word: וַיִּגְוַע
  choice: प्राण छोड़ देता है
  rationale: גוע जीवन समाप्त होने, अर्थात दम तोड़ने या प्राण छोड़ने, का बोध देता है। ‘प्राण छोड़ देता है’ हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा ‘मर जाता है’ की सपाट पुनरावृत्ति से बचता है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ शब्द सामान्य मानव को दर्शाता है और גבר के समानांतर है। ‘मनुष्य’ दोनों इब्रानी पदों के भेद को हिन्दी में बनाए रखता है।
- source_word: וְאַיּוֹ
  choice: फिर वह कहाँ है?
  rationale: प्रश्न मृत्यु के बाद व्यक्ति के दिखाई न देने या उसके ठिकाने के विषय में है। संयोजक וְ को प्रसंगानुकूल ‘फिर’ से व्यक्त किया गया है, जिससे प्रश्न का स्वाभाविक प्रवाह बना रहता है।
theological_decisions:
- issue: मृत्यु के बाद मनुष्य की दशा के प्रश्न का अर्थ
  choice: 'प्रश्न को खुला रखा गया है: ‘फिर वह कहाँ है?’'
  alternative: ‘वह कहीं नहीं रहता’ जैसे कथन के रूप में प्रस्तुत करना
  rationale: इब्रानी पाठ प्रश्न पूछता है और स्वयं इस पद में उत्तर नहीं देता। इसलिए किसी विशिष्ट परलोक-सिद्धांत को इसमें जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और काव्यात्मक गद्य रखा गया है। ‘परन्तु’ पद के विरोधात्मक आरम्भ को और अर्धविराम समानांतर पंक्तियों को दर्शाता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
