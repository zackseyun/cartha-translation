  text: חָתֻ֣ם בִּ/צְר֣וֹר פִּשְׁעִ֑/י וַ֝/תִּטְפֹּ֗ל עַל עֲוֺנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/017.yaml
  text: My transgression is sealed up in a bag[a], and you cover over my iniquity.
translation:
  language: hi
  text: 'मेरा अपराध एक थैली में मुहरबंद है,

    और तू मेरे अधर्म पर लेप लगाता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तू मेरे अधर्म को लीप देता है,” “सिलकर बंद कर देता है,” अथवा “उस पर कुछ कसकर लगा देता है।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है और उसके ठीक बिंब पर मतभेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָתֻם
  choice: मुहरबंद है
  rationale: निष्क्रिय परिणामसूचक रूप किसी वस्तु के मुहर लगाकर सुरक्षित बंद किए जाने का भाव देता है।
- source_word: בִּצְרוֹר
  choice: एक थैली में
  rationale: צְרוֹר बँधी हुई पोटली, थैली या छोटी गठरी को दर्शा सकता है; ‘थैली’ यहाँ ठोस बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: פִּשְׁעִי
  choice: मेरा अपराध
  rationale: פֶּשַׁע अपराध, उल्लंघन या विद्रोह का अर्थ दे सकता है। काव्य-संदर्भ में ‘अपराध’ गंभीर नैतिक अर्थ रखता है, पर अनावश्यक रूप से खुले विद्रोह का अर्थ नहीं थोपता।
- source_word: וַתִּטְפֹּל
  choice: तू ... लेप लगाता है
  rationale: यह क्रिया कठिन और विवादित है; इसका संबंध लगाने, लीपने अथवा जोड़कर बंद करने से हो सकता है। ‘लेप लगाता है’ मूल के ठोस बिंब और עַל के साथ प्रयुक्त दिशा को बचाता है, जबकि विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: עַל
  choice: पर
  rationale: यहाँ किसी चीज़ के ऊपर कुछ लगाने या चढ़ाने का संबंध व्यक्त करता है।
- source_word: עֲוֺנִי
  choice: मेरे अधर्म
  rationale: עָוֹן अधर्म, दोष अथवा दोष के परिणाम को सूचित कर सकता है। ‘अधर्म’ नैतिक गंभीरता बनाए रखता और पहले चरण के פֶּשַׁע से कुछ शब्दगत भेद भी रखता है।
theological_decisions:
- issue: पद के बिंब का आशय
  choice: अय्यूब परमेश्वर को उसके अपराध सुरक्षित रखकर उसके अधर्म पर लेप लगाते हुए चित्रित करता है—अर्थात उन्हें हिसाब के लिए सँभालकर रखने का नकारात्मक बिंब।
  alternative: इसे पाप छिपाने या मिटाने, अर्थात क्षमा करने, का सकारात्मक बिंब माना जा सकता है।
  rationale: आस-पास के विलाप में अय्यूब की शिकायत है कि परमेश्वर उसके पाप पर कड़ी दृष्टि रखता है। इसलिए अनुवाद क्षमा का अर्थ नहीं जोड़ता; फिर भी कठिन क्रिया के कारण बिंब की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। परमेश्वर के लिए एकवचन ‘तू’ मूल इब्रानी संबोधन की निकटता और सीधापन बनाए रखता है। ‘मुहरबंद’, ‘थैली’, और ‘लेप’ मूल के ठोस संचयन तथा बंद करने वाले बिंब को सुरक्षित रखते हैं।
