id: JOB.14.5
reference: Job 14:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִ֥ם חֲרוּצִ֨ים יָמָ֗י/ו מִֽסְפַּר חֳדָשָׁ֥י/ו אִתָּ֑/ךְ חק/ו עָ֝שִׂ֗יתָ וְ/לֹ֣א יַעֲבֽוֹר׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/005.yaml
  text: Since his days are determined[a], the number of his months is with you; you have set his limit[b], and he cannot pass it.
translation:
  language: hi
  text: क्योंकि उसके दिन निर्धारित हैं[a], उसके महीनों की गिनती तेरे पास है; तूने उसकी सीमा ठहरा दी है[b], और वह उसे पार नहीं कर सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि उसके दिन निर्धारित हैं।” इब्रानी शब्द शर्त का परिचय दे सकता है, पर प्रसंग में यह अय्यूब की विनती का आधार भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “सीमा” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “ठहराई हुई हद” या “विधान” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: क्योंकि
  rationale: यहाँ אִם को केवल काल्पनिक शर्त के रूप में नहीं, अय्यूब की आगामी विनती के आधार के रूप में समझना प्रसंगानुकूल है। फिर भी इसकी शर्तसूचक संभावना पादटिप्पणी में रखी गई है।
- source_word: חֲרוּצִים
  choice: निर्धारित
  rationale: निष्क्रिय कृदंत मनुष्य के दिनों के तय या निश्चित किए जाने का भाव देता है; ‘निर्धारित’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: מִסְפַּר חֳדָשָׁיו
  choice: उसके महीनों की गिनती
  rationale: यह मूल संज्ञात्मक रचना को स्वाभाविक हिन्दी में बनाए रखता है और जीवनकाल के निश्चित परिमाण को व्यक्त करता है।
- source_word: אִתָּךְ
  choice: तेरे पास है
  rationale: यह ‘तेरे साथ/पास’ के निकट रहते हुए परमेश्वर के ज्ञान और अधिकार की निहित ध्वनि को बिना अधिक व्याख्या जोड़े सुरक्षित रखता है।
- source_word: חֻקּוֹ
  choice: उसकी सीमा
  rationale: इस प्रसंग में חֹק निर्धारित विधान अथवा बाँध देने वाली हद को दर्शाता है; आगे के ‘पार करना’ के साथ ‘सीमा’ स्वाभाविक बैठता है।
- source_word: עָשִׂיתָ
  choice: ठहरा दी है
  rationale: सामान्य अर्थ ‘करना/बनाना’ है, पर सीमा के साथ इसका आशय उसे स्थापित या नियत करना है; ‘ठहरा दी’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יַעֲבוֹר
  choice: और वह उसे पार नहीं कर सकता
  rationale: एकवचन क्रिया मनुष्य की ओर संकेत करती है और निर्धारित सीमा से आगे न जा सकने का प्रसंगगत अर्थ स्पष्ट करती है।
theological_decisions:
- issue: मनुष्य के जीवनकाल का ईश्वरीय निर्धारण
  choice: पद मनुष्य के दिनों को निर्धारित और उसकी सीमा को परमेश्वर द्वारा ठहराया हुआ बताता है।
  alternative: इसे मुख्यतः परमेश्वर द्वारा जीवनकाल की गिनती जानने पर बल देने वाला कथन माना जा सकता है।
  rationale: ‘निर्धारित’, ‘तेरे पास’ और ‘तूने उसकी सीमा ठहरा दी’ का संयुक्त बल ज्ञान से आगे प्रभुत्व और निर्धारण की ओर संकेत करता है, पर अनुवाद इससे कोई विस्तृत सिद्धान्त निर्मित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर को संबोधित करते समय काव्यात्मक प्रसंग के अनुरूप ‘तू/तेरे’ रखा गया है। वाक्य मूल की समानांतर संरचना और गंभीर स्वर को बनाए रखते हुए सामान्य पाठक के लिए स्वाभाविक रखा गया है।
