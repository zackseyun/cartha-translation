lexical_decisions:
- source_word: מֵ/רֵיחַ
  choice: गंध पाते ही
  rationale: शाब्दिक अर्थ ‘गंध से’ है; यह स्वाभाविक हिन्दी में पानी की निकटता मात्र से होने वाली त्वरित प्रतिक्रिया और काव्यात्मक बल को व्यक्त करता है।
- source_word: מַיִם
  choice: पानी
  rationale: इब्रानी रूप बहुवचनात्मक है, पर यहाँ सामान्य द्रव्यवाचक अर्थ में है; हिन्दी में ‘पानी’ स्वाभाविक है।
- source_word: יַפְרִחַ
  choice: फूट निकलेगा
  rationale: פרח का हिफ़ील रूप कोंपल फूटने, अंकुरित होने या खिलने का भाव दे सकता है। कटे हुए पेड़ के फिर जीवित होने के प्रसंग में ‘फूट निकलेगा’ विकास की अवस्था को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְ/עָשָׂה קָצִיר
  choice: नई डालियाँ निकालेगा
  rationale: עשה व्यापक क्रिया है और קָצִיר सामान्यतः ‘कटनी’ है, किंतु इस वनस्पतिक संदर्भ में उससे निकली नई बढ़त या शाखाएँ अभिप्रेत हो सकती हैं। हिन्दी में यह पदबंध चित्र को स्पष्ट और सहज रखता है।
- source_word: כְּמוֹ
  choice: के समान
  rationale: तुलनात्मक अव्यय का स्वाभाविक, गरिमापूर्ण हिन्दी रूप।
- source_word: נָטַע
  choice: लगाए हुए पौधे
  rationale: यह ‘लगाई हुई वस्तु/पौधा’ दर्शाता है। ‘पौधा’ मूल की सामान्य वनस्पतिक छवि रखता है और अनावश्यक रूप से ‘पेड़’ नहीं जोड़ता।
