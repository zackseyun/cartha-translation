  yaml_path: translation/ot/job/014/004.yaml
  text: Who can bring a clean thing out of an unclean? No one[a].
translation:
  language: hi
  text: कौन अशुद्ध में से शुद्ध वस्तु निकाल सकता है? कोई भी नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: कौन
  rationale: प्रश्नवाचक सर्वनाम की सीधी और स्वाभाविक अभिव्यक्ति; प्रसंग इसे आलंकारिक प्रश्न बनाता है।
- source_word: יִתֵּן
  choice: उत्पन्न कर सकता है
  rationale: נתן का मूल अर्थ ‘देना’ है, पर यहाँ इस प्रयोग में किसी स्रोत से कुछ शुद्ध निकालने या उत्पन्न करने का भाव है। ‘कर सकता है’ निहित असमर्थता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: טָהוֹר
  choice: शुद्ध को
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘शुद्ध को’ संक्षिप्त रहते हुए किसी शुद्ध वस्तु, व्यक्ति या अवस्था के संदर्भ को खुला रखता है।
- source_word: מִטָּמֵא
  choice: अशुद्ध से
  rationale: מִן और संज्ञावत् प्रयुक्त טָמֵא का सीधा समतुल्य; यह नैतिक, अनुष्ठानिक, वंशगत या अस्तित्वगत अशुद्धता में से किसी एक को निश्चित नहीं करता।
- source_word: לֹא אֶחָד
  choice: कोई भी नहीं
  rationale: आलंकारिक प्रश्न का पूर्ण निषेधात्मक उत्तर आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से देता है।
theological_decisions:
- issue: शुद्धता और अशुद्धता के संदर्भ का दायरा
  choice: शुद्ध और अशुद्ध जैसे व्यापक शब्द रखे गए हैं, ताकि कथन मानव दशा पर लागू होते हुए भी अपनी सूक्तिपरक व्यापकता बनाए रखे।
  alternative: इसे विशेष रूप से अशुद्ध माता-पिता से जन्म, नैतिक पाप, या अनुष्ठानिक अशुद्धता के विषय में स्पष्ट करना।
  rationale: इब्रानी पद अत्यंत संक्षिप्त है और अशुद्धता के प्रकार को निर्दिष्ट नहीं करता; इसलिए अनुवाद उस धर्मवैचारिक तनाव को नहीं सुलझाता जिसे मूल पाठ खुला छोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। ‘उत्पन्न करना’ मूल मुहावरे के परिणामकारी भाव को व्यक्त करता है, जबकि ‘शुद्ध/अशुद्ध’ मूल विरोध को बनाए रखते हैं।
