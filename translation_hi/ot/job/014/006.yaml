  text: Look away from him[a], so that he may rest, until he fulfills his day like a hired worker.
translation:
  language: hi
  text: उस पर से अपनी दृष्टि हटा ले[a] और उसे चैन लेने दे, जब तक वह मज़दूर की तरह अपना दिन पूरा न कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर से अपनी दृष्टि हटा ले और उसे विराम लेने दे, जब तक वह मज़दूर की तरह अपने दिन से संतुष्ट न हो जाए।” इब्रानी में विराम पाने और ठहराए हुए दिन को पूरा करने अथवा उससे संतुष्ट होने—दोनों भाव संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁעֵה מֵעָלָיו
  choice: उस पर से अपनी दृष्टि हटा ले
  rationale: क्रिया שׁעה यहाँ दृष्टि या ध्यान हटा लेने का भाव देती है। संदर्भ में अय्यूब परमेश्वर से मनुष्य पर लगी उसकी जाँचती हुई दृष्टि हटाने का निवेदन करता है।
- source_word: וְיֶחְדָּל
  choice: और उसे चैन लेने दे
  rationale: חדל का मूल अर्थ ‘रुकना’ या ‘विरत होना’ है; यहाँ आशय दबाव और कष्ट से कुछ राहत पाने देना है। ‘चैन लेने दे’ इस संदर्भगत भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַד יִרְצֶה
  choice: जब तक ... पूरा न कर ले
  rationale: רצה प्रसन्न होने, संतुष्ट होने या स्वीकार करने का भाव दे सकता है। मज़दूर के दिन के रूपक में यह उसके ठहराए हुए दिन को पूरा करने तक पहुँचने का संकेत देता है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כְּשָׂכִיר
  choice: मज़दूर की तरह
  rationale: שָׂכִיר मजदूरी पर रखे गए कामगार को दर्शाता है। हिन्दी में ‘मज़दूर’ संदर्भ के साथ इस सामाजिक और श्रम-संबंधी चित्र को सहजता से व्यक्त करता है।
- source_word: יוֹמוֹ
  choice: अपना दिन
  rationale: शाब्दिक अर्थ ‘उसका दिन’ है। हिन्दी में कर्ता की ओर लौटते संबंध को ‘अपना दिन’ स्वाभाविक रूप से व्यक्त करता है; मज़दूर का रूपक इसे कार्य-दिवस के रूप में समझने का संदर्भ देता है।
