language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י יִתֵּ֨ן בִּ/שְׁא֬וֹל תַּצְפִּנֵ֗/נִי תַּ֭סְתִּירֵ/נִי עַד שׁ֣וּב אַפֶּ֑/ךָ תָּ֤שִׁ֥ית לִ֖/י חֹ֣ק וְ/תִזְכְּרֵֽ/נִי׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/013.yaml
  text: Oh[a], that you would hide me in Sheol, that you would conceal me until your anger turns away[b], that you would appoint a time for me and remember me!
translation:
  language: hi
  text: काश, आप मुझे अधोलोक[a] में छिपा देते, मुझे तब तक ओट में रखते जब तक आपका क्रोध लौट न जाता; मेरे लिए एक निश्चित अवधि[b] ठहरा देते और फिर मुझे स्मरण करते!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “कब्र में” अथवा “मृतकों के लोक में।” इब्रानी: “शीओल।”'
    reason: lexical_alternative
  - marker: b
    text: या “मेरे लिए एक सीमा ठहरा देते” अथवा “मेरे लिए एक नियत समय ठहरा देते।” इब्रानी संज्ञा किसी निर्धारित, नियत या सीमाबद्ध बात को सूचित कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि तीव्र इच्छा प्रकट करता है; ‘काश’ आधुनिक हिन्दी में स्वाभाविक और भावपूर्ण है।
- source_word: בִּשְׁאוֹל
  choice: अधोलोक
  rationale: यह मृतकों के लोक की इब्रानी धारणा को व्यक्त करता है। ‘कब्र’ अर्थ को केवल दफनाने के स्थान तक सीमित कर सकती है, जबकि ‘नरक’ बाद की धार्मिक धारणाएँ आरोपित कर सकता है।
- source_word: תַּצְפִּנֵנִי / תַּסְתִּירֵנִי
  choice: छिपा देते / ओट में रखते
  rationale: दोनों निकटार्थी क्रियाओं का काव्यात्मक समानांतर और हल्का वैविध्य सुरक्षित रहता है।
- source_word: עַד שׁוּב אַפֶּךָ
  choice: जब तक आपका क्रोध लौट न जाता
  rationale: ‘लौट जाना’ שׁוּב की गति-छवि को बनाए रखता है और सन्दर्भ में क्रोध के हट जाने का अर्थ देता है।
- source_word: תָּשִׁית לִי חֹק
  choice: मेरे लिए एक निश्चित अवधि ठहरा देते
  rationale: חֹק किसी निर्धारित, नियत या सीमाबद्ध वस्तु को सूचित कर सकता है। प्रसंग में समयावधि सम्भावित है, पर ‘निश्चित अवधि’ उसकी सीमाबद्धता को भी बनाए रखती है।
- source_word: וְתִזְכְּרֵנִי
  choice: और फिर मुझे स्मरण करते
  rationale: ‘स्मरण करना’ मूल के सम्बन्धपरक और धर्मवैचारिक भार को बनाए रखता है; ‘फिर’ क्रम को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शीओल
  rationale: ‘अधोलोक’ सामान्य हिन्दी पाठक के लिए बोधगम्य रहते हुए मृतकों के लोक का व्यापक अर्थ रखता है और इसे न तो केवल कब्र तक सीमित करता है, न नरक के समान ठहराता है।
- issue: חֹק का प्रसंगगत अर्थ
  choice: निश्चित अवधि
  alternative: नियत समय; सीमा; विधान
  rationale: अय्यूब किसी निर्धारित अन्तराल या सीमा के बाद परमेश्वर द्वारा स्मरण किए जाने की कामना करता है। यह अनुवाद समयगत अर्थ व्यक्त करता है, पर मूल की नियत और सीमाबद्ध धारणा को पूर्णतः समाप्त नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, काव्यात्मक और सहज रूप। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। अर्धविराम ने पद की लगातार चलती कामना के भीतर दो निकट सम्बद्ध याचना-खंडों को स्पष्ट किया है।
