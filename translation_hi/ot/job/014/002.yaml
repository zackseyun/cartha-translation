    text: या ‘काट डाला जाता है’; इब्रानी क्रिया का अर्थ ‘मुरझाना’ अथवा ‘काट दिया जाना’ समझा जा सकता है, विशेषकर फूल के इस बिंब में।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּצִיץ
  choice: फूल के समान
  rationale: צִיץ का अर्थ फूल या पुष्प है; आधुनिक हिन्दी में ‘फूल’ सहज है और मानवीय जीवन की क्षणभंगुरता का काव्यात्मक बिंब बनाए रखता है।
- source_word: יָצָא
  choice: खिलता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘निकलना’ है, पर फूल के बिंब में हिन्दी का ‘खिलना’ उसके प्रकट होने को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: וַיִּמָּל
  choice: और मुरझा जाता है
  rationale: फूल के निकट संदर्भ में क्रिया को मुरझाने के अर्थ में लेना सबसे स्वाभाविक है; ‘काट दिया जाता है’ की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַיִּבְרַח
  choice: भाग जाता है
  rationale: ברח का सजीव अर्थ ‘भागना’ है; इसे बनाए रखने से जीवन की तीव्र क्षणभंगुरता का काव्यात्मक बल सुरक्षित रहता है।
- source_word: כַּצֵּל
  choice: छाया के समान
  rationale: यह मूल उपमा का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וְלֹא יַעֲמוֹד
  choice: और ठहरता नहीं
  rationale: עמד का मूल भाव ‘खड़ा होना’ है, पर यहाँ टिके रहने का आशय है; ‘ठहरता नहीं’ इस अर्थ को स्पष्ट रखते हुए क्रिया की ठोस छवि भी बचाता है।
