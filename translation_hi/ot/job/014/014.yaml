source:
  edition: WLC
  text: אִם יָמ֥וּת גֶּ֗בֶר הֲ/יִ֫חְיֶ֥ה כָּל יְמֵ֣י צְבָאִ֣/י אֲיַחֵ֑ל עַד בּ֝֗וֹא חֲלִיפָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/014.yaml
  text: If a man dies[a], will he live again? All the days of my hard service I would wait, until my relief comes.
translation:
  language: hi
  text: यदि मनुष्य मर जाए, तो क्या वह फिर जीवित होगा? अपनी कठिन सेवा के सारे दिन मैं प्रतीक्षा करता रहता, जब तक मेरा परिवर्तन न आ जाता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם יָמוּת גֶּבֶר
  choice: यदि कोई मनुष्य मर जाए
  rationale: शर्तसूचक אִם और सामान्य मानवीय प्रश्न को स्वाभाविक हिन्दी में रखता है; גֶּבֶר का एकवचन मानवीय संदर्भ भी बना रहता है।
- source_word: הֲיִחְיֶה
  choice: तो क्या वह फिर जीवित होगा?
  rationale: मृत्यु के बाद जीवन की संभावना पर उठे प्रश्न को व्यक्त करता है। ‘फिर’ मूल क्रिया में अलग शब्द के रूप में नहीं है, पर प्रसंग में निहित है।
- source_word: כָּל יְמֵי צְבָאִי
  choice: अपनी कठिन सेवा के सारे दिन
  rationale: צָבָא यहाँ युद्ध मात्र नहीं, बल्कि निर्धारित और कष्टपूर्ण सेवा-अवधि का बोध करा सकता है; ‘कठिन सेवा’ इस रूपक को सहज हिन्दी में व्यक्त करती है।
- source_word: אֲיַחֵל
  choice: मैं प्रतीक्षा करता रहूँगा
  rationale: יחל में आशा और प्रतीक्षा दोनों के भाव संभव हैं; עַד के साथ यहाँ लगातार प्रतीक्षा का भाव प्रमुख है।
- source_word: עַד בּוֹא חֲלִיפָתִי
  choice: जब तक मेरा बदलाव न आ जाए
  rationale: आगमन-सूचक रचना को स्वाभाविक हिन्दी में रखते हुए חֲלִיפָה की व्यापक और संदर्भतः अनिश्चित अर्थ-सीमा को ‘बदलाव’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: क्या पद को मृतकों के पुनरुत्थान की स्पष्ट घोषणा के रूप में प्रस्तुत किया जाए
  choice: प्रश्नात्मक रूप और ‘बदलाव’ को बनाए रखा गया है
  alternative: ‘पुनरुत्थान’ या ‘नया जीवन’ जैसे अधिक स्पष्ट शब्द प्रयोग करना
  rationale: अय्यूब यहाँ निश्चित धर्मसैद्धान्तिक घोषणा नहीं करता, बल्कि मृत्यु के बाद जीवन की संभावना और आने वाले परिवर्तन के विषय में तनावपूर्ण आशा व्यक्त करता है।
- issue: חֲלִיפָתִי का आशय
  choice: मेरा बदलाव
  alternative: मेरा छुटकारा; मेरा नवीकरण
  rationale: हिब्रू शब्द परिवर्तन, अदला-बदली, राहत या नवीकरण का भाव दे सकता है। ‘बदलाव’ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और काव्यात्मक प्रश्न के अनुरूप है। ‘मर जाए’ और ‘न आ जाए’ स्वाभाविक शर्तात्मक तथा कालिक प्रवाह देते हैं।
