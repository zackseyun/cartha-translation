lexical_decisions:
- source_word: אָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन संज्ञा समस्त मानव दशा का प्रतिनिधित्व करती है। ‘मनुष्य’ आधुनिक हिन्दी में स्वाभाविक है और किसी एक पुरुष तक अर्थ को सीमित नहीं करती।
- source_word: יְלוּד אִשָּׁה
  choice: स्त्री से जन्मा
  rationale: यह पदबंध मूल के ठोस जन्म-संबंधी बिंब को बनाए रखता है और हिन्दी में सहज है।
- source_word: קְצַר יָמִים
  choice: थोड़े दिनों का
  rationale: यह जीवन की अल्पता व्यक्त करते हुए इब्रानी के ‘दिनों में छोटा/कम’ वाले बिंब के निकट रहता है।
- source_word: וּשְׂבַע רֹגֶז
  choice: और अशांति से भरा
  rationale: ‘भरा’ שְׂבַע की परिपूर्णता को और ‘अशांति’ רֹגֶז के भीतर की व्याकुलता तथा बाहरी क्लेश—दोनों की व्यापकता को व्यक्त करती है।
- source_word: רֹגֶז
  choice: अशांति
  rationale: यह शब्द व्याकुलता, हलचल और संकटपूर्ण अनुभव की अर्थ-सीमा को खुला रखता है; ‘कष्ट’ भी संदर्भानुकूल विकल्प है।
