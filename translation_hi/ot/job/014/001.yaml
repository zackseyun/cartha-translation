  rationale: वचन मानव दशा के बारे में प्रतिनिधिक एकवचन में सामान्य कथन करता है। ‘मनुष्य’ उस एकवचन रूप को बनाए रखता है और लिंग-विशेष तक अर्थ सीमित करने से बचता है।
