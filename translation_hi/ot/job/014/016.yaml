source:
  edition: WLC
  text: כִּֽי עַ֭תָּה צְעָדַ֣/י תִּסְפּ֑וֹר לֹֽא תִ֝שְׁמ֗וֹר עַל חַטָּאתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/014/016.yaml
  text: For now you count my steps[b][a]; you do not keep watch over my sin.
translation:
  language: hi
  text: क्योंकि अब आप मेरे कदम गिनते हैं[a]; आप मेरे पाप पर नज़र नहीं रखते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आप मेरे कदमों की गिनती करते हैं।”
    reason: ספר के लिए ‘गिनना’ और ‘गिनती करना’ दोनों सम्भव हिन्दी अभिव्यक्तियाँ हैं।
  - marker: b
    text: या “आप मेरे पाप पर निगरानी नहीं रखते”; अथवा “आप मेरे पाप की ताक में नहीं रहते।”
    reason: שׁמר עַל में ‘निगरानी रखना’ या संदर्भानुसार ‘ताक में रहना’—दोनों अर्थ-छायाएँ सम्भव हैं।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले विचार का कारण या स्पष्टीकरण देता है; इसलिए संयोजक का व्याख्यात्मक बल बनाए रखा गया है।
- source_word: עַתָּה
  choice: अब
  rationale: यह अय्यूब की वर्तमान दशा को उसकी आशा की हुई स्थिति के विपरीत रखता है और इब्रानी कालवाचक क्रियाविशेषण का सीधा, स्वाभाविक अनुवाद है।
- source_word: צְעָדַי
  choice: मेरे कदम
  rationale: यह शब्द कदमों या चालों को दर्शाता है। यह अनुवाद परमेश्वर द्वारा अय्यूब की हर गतिविधि गिने जाने का ठोस बिंब बनाए रखता है।
- source_word: תִּסְפּוֹר
  choice: गिनते हैं
  rationale: ספר के क़ाल रूप का सामान्य अर्थ ‘गिनना’ या ‘संख्या ठहराना’ है। ‘गिनते हैं’ आधुनिक हिन्दी में स्वाभाविक है और मूल बिंब को सुरक्षित रखता है।
- source_word: לֹא
  choice: नहीं
  rationale: इब्रानी निषेध को हिन्दी में सीधे और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: תִשְׁמוֹר עַל
  choice: पर नज़र नहीं रखते
  rationale: שׁמר के साथ עַל में किसी बात पर दृष्टि, निगरानी या चौकसी रखने का भाव हो सकता है। ‘नज़र रखना’ इस अर्थ-क्षेत्र को स्वाभाविक हिन्दी में बनाए रखता है और ‘कदम गिनने’ के समानांतर सतर्क निरीक्षण का भाव देता है।
- source_word: חַטָּאתִי
  choice: मेरे पाप
  rationale: संदर्भ में חַטָּאתִי का अर्थ ‘मेरा पाप’ है, न कि ‘पापबलि’। हिन्दी में परसर्ग के कारण ‘पाप’ का यही रूप आता है और मूल के एकवचन/सामूहिक भाव को बनाए रखता है।
theological_decisions:
- issue: नकारात्मक उपवाक्य לֹא תִשְׁמוֹר עַל חַטָּאתִי का अर्थ
  choice: 'इसे वर्तमान कथन के रूप में रखा गया है: ‘आप मेरे पाप पर नज़र नहीं रखते।’'
  alternative: ‘आप मेरे पाप पर नज़र न रखते’ अथवा ‘आप मेरे पाप की ताक में नहीं रहते।’
  rationale: इब्रानी में निषेध के साथ साधारण अपूर्ण क्रियारूप है, जो अपने आप में वर्तमान कथन के रूप में सबसे स्वाभाविक है। आस-पास के पदों से उत्पन्न तनाव को किसी काल्पनिक या सामंजस्यकारी अर्थ द्वारा मिटाया नहीं गया।
- issue: परमेश्वर को संबोधित करने का हिन्दी रूप
  choice: सम्मानसूचक ‘आप’
  alternative: परंपरागत एकवचन ‘तू’
  rationale: आधुनिक मानक हिन्दी में ‘आप’ सामान्य पाठक के लिए स्वाभाविक और सम्मानपूर्ण सीधा संबोधन है। इससे मूल के द्वितीय पुरुष संबोधन का आशय बना रहता है, यद्यपि हिन्दी में व्याकरणिक सम्मानसूचक बहुवचन प्रयुक्त होता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। अर्धविराम दोनों समानांतर उपवाक्यों को जोड़ता है। परमेश्वर के लिए सम्मानसूचक ‘आप’ का प्रयोग किया गया है; शब्दावली अनावश्यक रूप से संस्कृतनिष्ठ या सांप्रदायिक नहीं है।
