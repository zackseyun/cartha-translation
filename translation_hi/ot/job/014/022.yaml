  yaml_path: translation/ot/job/014/022.yaml
  text: Surely his flesh on him feels pain[b][a], and his soul on him mourns.
translation:
  language: hi
  text: निश्चय ही, उसकी देह में उसे पीड़ा होती है, और उसका प्राण[a] उसके भीतर शोक करता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्राण’ का अनुवाद ‘जीवन’, ‘स्वयं’ या ‘भीतरी व्यक्ति’ भी किया जा सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी अत्यंत संक्षिप्त और कुछ मुहावरेदार है। आरंभिक शब्द का अर्थ ‘केवल’ भी हो सकता है। दोनों अर्धपंक्तियों में प्रयुक्त पद का शाब्दिक अर्थ ‘उस पर’ है; हिन्दी में इसे क्रमशः ‘उसे’ और ‘उसके भीतर’ के रूप में व्यक्त किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यह कण यहाँ कथन पर बल देता है; यद्यपि इसका अर्थ ‘केवल’ भी हो सकता है। मुख्य पाठ में बलवाचक अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: בְּשָׂרוֹ
  choice: उसकी देह
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है, पर यहाँ व्यक्ति की शारीरिक सत्ता अभिप्रेत है। ‘देह’ ठोस शारीरिक चित्र और काव्यात्मक गरिमा दोनों बनाए रखता है।
- source_word: עָלָיו
  choice: अपने ही लिए
  rationale: दोनों अर्धपंक्तियों में दोहराया गया עָלָיו अत्यंत संक्षिप्त मुहावरा है। ‘अपने ही लिए’ आत्म-संबंधी भाव को व्यक्त करता है, बिना इसे निश्चित रूप से ‘भीतर’ मान लेने के।
- source_word: יִכְאָב
  choice: पीड़ा सहती है
  rationale: כאב पीड़ा होने या अनुभव करने को व्यक्त करता है। स्त्रीलिंग क्रिया ‘देह’ को कर्ता बनाए रखती है, जैसा इब्रानी में है।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נֶפֶשׁ जीवन, स्वयं, प्राण या भीतरी व्यक्ति का बोध करा सकता है। ‘प्राण’ देह के साथ काव्यात्मक समानांतरता रखता है और अर्थ को किसी कठोर मानव-तत्त्वमीमांसा में सीमित नहीं करता।
- source_word: תֶּאֱבָל
  choice: शोक करता है
  rationale: אבל का सीधा अर्थ शोक करना या विलाप करना है; ‘शोक करता है’ संक्षिप्त, स्वाभाविक और काव्यात्मक है।
theological_decisions:
- issue: देह के समानांतर נֶפֶשׁ का मानवशास्त्रीय अर्थ
  choice: ‘प्राण’ रखा गया है, ताकि जीवन, स्वयं और भीतरी व्यक्ति के अर्थों की गुंजाइश बनी रहे।
  alternative: ‘आत्मा’, ‘जीवन’ या ‘अंतरात्मा’
  rationale: पद शारीरिक पीड़ा और व्यक्तिगत/आंतरिक शोक को काव्यात्मक रूप से साथ रखता है। ‘प्राण’ इस तनाव को बनाए रखता है, पर मनुष्य की संरचना के विषय में पाठ से अधिक कोई सिद्धान्त स्थापित नहीं करता।
- issue: मृत व्यक्ति के अनुभव के विषय में कथन
  choice: इब्रानी की काव्यात्मक भाषा को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: इसे स्पष्ट रूप से केवल मरने की दशा, शव, या मृत्यु के बाद सचेत अनुभव के रूप में समझाना
  rationale: निकटवर्ती संदर्भ और इस पद की संक्षिप्त भाषा व्याख्यात्मक प्रश्न छोड़ती है; अनुवाद किसी एक धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘देह’ और ‘प्राण’ सामान्य पाठक के लिए बोधगम्य हैं तथा इब्रानी समानांतरता को बनाए रखते हैं। ‘अपने ही लिए’ अपेक्षाकृत स्वाभाविक हिन्दी में दोहराए गए עָלָיו का आत्म-संबंधी बल व्यक्त करता है।
