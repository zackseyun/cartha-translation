  yaml_path: translation/ot/job/014/020.yaml
  text: You overpower him forever[a], and he passes on[b]; you alter his face and send him away.
translation:
  language: hi
  text: तू उस पर सदा के लिए प्रबल होता है, और वह चला जाता है[a]; तू उसका चेहरा[b] बदल देता है और उसे भेज देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वह विदा हो जाता है।” इब्रानी क्रिया का शाब्दिक अर्थ “जाता है” है; यहाँ आशय जीवन या मानव-जगत से चले जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसका रूप-रंग।” इब्रानी शब्द का शाब्दिक अर्थ “चेहरा” है, पर वह बाहरी रूप या मुखाकृति को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְקְפֵהוּ
  choice: तू उस पर ... प्रबल होता है
  rationale: תקף का यहाँ अर्थ किसी के विरुद्ध बलवान होकर उस पर प्रबल होना है। यह चयन परमेश्वर की निर्णायक सामर्थ्य व्यक्त करता है, पर अनावश्यक रूप से हिंसक अर्थ नहीं जोड़ता।
- source_word: לָנֶצַח
  choice: सदा के लिए
  rationale: נֶצַח स्थायी अथवा अंतहीन अवधि और यहाँ परिणाम की अपरिवर्तनीयता को दर्शाता है।
- source_word: וַיַּהֲלֹךְ
  choice: और वह चला जाता है
  rationale: הלך का मूल अर्थ ‘जाना’ है। मृत्यु के प्रसंग में यह जीवन अथवा मानव-जगत से चले जाने की ओर संकेत कर सकता है; मुख्य पाठ में शाब्दिक खुलापन सुरक्षित रखा गया है।
- source_word: מְשַׁנֶּה
  choice: तू ... बदल देता
  rationale: שנה का अर्थ बदलना है। कृदन्तीय रूप कविता में परमेश्वर को संबोधित चलती क्रिया के रूप में स्वाभाविक है।
- source_word: פָנָיו
  choice: उसका चेहरा
  rationale: פנים का ठोस अर्थ ‘चेहरा’ है, यद्यपि यह व्यापक रूप से रूप-रंग या मुखाकृति भी सूचित कर सकता है।
- source_word: וַתְּשַׁלְּחֵהוּ
  choice: और उसे विदा कर देता है
  rationale: שלח के पिएल रूप का अर्थ भेज देना अथवा विदा करना हो सकता है। ‘विदा कर देता है’ मृत्यु-संदर्भ के अनुरूप है और निष्कासन की कठोर छाया अनिवार्य रूप से नहीं जोड़ता।
theological_decisions:
- issue: וַיַּהֲלֹךְ में मृत्यु का संकेत
  choice: वह चला जाता है
  alternative: वह मर जाता है
  rationale: पूरा प्रसंग मृत्यु की ओर संकेत करता है, पर इब्रानी क्रिया स्वयं केवल ‘जाता है’ कहती है। इसलिए संकेत को स्पष्ट मृत्यु-विधान में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में एकवचन निकट संबोधन ‘तू’ रखा गया है, क्योंकि अय्यूब सीधे परमेश्वर से बोल रहा है। शैली काव्यात्मक और गरिमापूर्ण है; ‘चला जाता है’ मूल की अस्पष्टता तथा ‘चेहरा’ उसकी ठोस छवि को सुरक्षित रखते हैं।
