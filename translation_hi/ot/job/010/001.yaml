lexical_decisions:
- source_word: נָקְטָה
  choice: घृणा है
  rationale: यह क्रिया गहरी विरक्ति या अत्यधिक ऊब व्यक्त कर सकती है। ‘घृणा है’ प्रसंग की तीव्र भावनात्मक शक्ति को बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: נַפְשִׁי
  choice: मेरे प्राण / अपने प्राण
  rationale: נֶפֶשׁ यहाँ अय्यूब के भीतरी व्यक्तित्व को दर्शाता है। ‘प्राण’ हिब्रू की पुनरावृत्ति और भावनात्मक गहराई को दोनों स्थानों पर बनाए रखता है।
- source_word: בְּחַיָּי
  choice: अपने जीवन से
  rationale: पूर्वसर्ग सहित यह पद अय्यूब के जीवन को उसकी विरक्ति के विषय के रूप में प्रस्तुत करता है; आधुनिक हिन्दी में ‘अपने जीवन से’ स्वाभाविक है।
- source_word: אֶעֶזְבָה
  choice: खुली छूट दूँगा
  rationale: मूल अर्थ ‘छोड़ना’ है, पर इस मुहावरे में आशय शिकायत को अब न रोकने और निर्बाध व्यक्त करने से है।
- source_word: שִׂיחִי
  choice: अपनी शिकायत
  rationale: अय्यूब के विलाप के संदर्भ में שִׂיחַ शांत मनन नहीं, बल्कि दुःखभरी शिकायत या विलापपूर्ण वाणी है।
- source_word: אֲדַבְּרָה
  choice: मैं ... बोलूँगा
  rationale: कोहोर्टेटिव रूप अय्यूब के दृढ़ निश्चय को व्यक्त करता है; हिन्दी भविष्यत् रूप इसे स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: בְּמַר נַפְשִׁי
  choice: अपने प्राण की कड़वाहट में
  rationale: यह पद अय्यूब की वाणी की भावनात्मक दशा या ढंग को बताता है और कड़वाहट के मूल रूपक को बनाए रखता है।
