  terminology: “मृत्यु की छाया” preserves the traditional, contextually plausible sense of צַלְמָוֶת, while the footnote retains the legitimate broader sense of very deep darkness. “घोर अंधकार” consistently renders אֹפֶל and preserves its repetition.
