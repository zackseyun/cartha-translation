  text: a land of gloom[a], like deep darkness, of the shadow of death and without order, where it shines like deep darkness.
translation:
  language: hi
  text: 'अँधियारी भूमि, घोर अंधकार जैसी,

    मृत्यु की छाया[a] की भूमि, जहाँ कोई व्यवस्था नहीं,

    जहाँ उसकी चमक भी घोर अंधकार जैसी है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मृत्यु की छाया’ (צַלְמָוֶת) का अनुवाद ‘घनी छाया’ भी हो सकता है; इब्रानी शब्द विशेष रूप से मृत्यु की छाया अथवा सामान्यतः अत्यंत गहरे अंधकार—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶרֶץ עֵיפָתָה
  choice: घोर अँधियारे की भूमि
  rationale: यह पदबंध एक ऐसे प्रदेश का वर्णन करता है जो घने अंधकार और उदासी से भरा है। ‘घोर अँधियारा’ आधुनिक हिंदी में काव्यात्मक गरिमा और तीव्रता दोनों बनाए रखता है।
- source_word: כְּמוֹ אֹפֶל
  choice: घोर अँधियारे जैसी / जैसा
  rationale: אֹפֶל साधारण अंधकार से अधिक घने अंधकार को सूचित करता है। दोनों स्थानों पर समान अभिव्यक्ति रखकर इब्रानी की पुनरावृत्ति और चरम विरोधाभास सुरक्षित रखा गया है।
- source_word: צַלְמָוֶת
  choice: मृत्यु की छाया
  rationale: यह पारंपरिक और भाषिक रूप से संभव अर्थ है तथा अय्यूब के प्रसंग में मृत्यु से जुड़ी छवि बनाए रखता है। ‘घनी छाया’ का वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְלֹא סְדָרִים
  choice: जहाँ कोई व्यवस्था नहीं
  rationale: סְדָרִים क्रम, विन्यास या व्यवस्था को दर्शाता है। यह अनुवाद उस प्रदेश की अव्यवस्थित और अराजक प्रकृति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַתֹּפַע
  choice: जहाँ उजाला भी ... जैसा है
  rationale: क्रिया יפע चमकने या प्रकाशमान होने का अर्थ देती है। ‘उजाला भी’ मूल के विरोधाभास को स्पष्ट, पर अनावश्यक रूप से हल किए बिना, सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: צַלְמָוֶת में मृत्यु-संबंधी अर्थ या सामान्य घने अंधकार का अर्थ
  choice: मुख्य पाठ में ‘मृत्यु की छाया’
  alternative: ‘घनी छाया’ अथवा ‘घोर अंधकार’
  rationale: शब्द मृत्यु की छाया और अत्यंत गहरे अंधकार—दोनों अर्थ ग्रहण कर सकता है। मुख्य पाठ मृत्यु-संबंधी छवि रखता है, जबकि वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पंक्ति-विन्यास मूल के क्रमिक अंधकार-बिंब और अंतिम विरोधाभास को उभारता है। ‘अँधियारा’ सामान्य पाठकों के लिए बोधगम्य है और ‘अंधकार’ की अपेक्षा इस काव्यात्मक प्रसंग में अधिक स्वाभाविक लय देता है।
