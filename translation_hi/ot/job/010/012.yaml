  text: חַיִּ֣ים וָ֭/חֶסֶד עָשִׂ֣יתָ עִמָּדִ֑/י וּ֝/פְקֻדָּתְ/ךָ֗ שָֽׁמְרָ֥ה רוּחִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/012.yaml
  text: You have granted me life and steadfast love[b][a], and your care has preserved my spirit.
translation:
  language: hi
  text: 'तूने मुझे जीवन और अटल प्रेम दिया है,


    और तेरी देखभाल[a] ने मेरी आत्मा[b] को सुरक्षित रखा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी निगरानी” अथवा “तेरी सुधि।”
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी साँस” अथवा “मेरे प्राण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חַיִּים
  choice: जीवन
  rationale: यद्यपि इब्रानी रूप बहुवचन है, यहाँ यह समग्र रूप से ‘जीवन’ का बोध कराता है; हिंदी में एकवचन स्वाभाविक है।
- source_word: וָחֶסֶד
  choice: और अटल प्रेम
  rationale: חֶסֶד में दया, भलाई और निष्ठावान प्रेम के भाव समाए हैं। ‘अटल प्रेम’ इसके टिकाऊ और संबंधपरक पक्ष को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: עָשִׂיתָ עִמָּדִי
  choice: तूने मुझे ... दिया है
  rationale: शाब्दिक अर्थ ‘तूने मेरे साथ किया’ है, पर जीवन और प्रेम के संदर्भ में यह उपकार प्रदान करने का मुहावरा है।
- source_word: וּפְקֻדָּתְךָ
  choice: तेरी देखभाल
  rationale: פְקֻדָּה का अर्थ निरीक्षण, निगरानी, ध्यान या देखभाल हो सकता है। अगले क्रियापद ‘रक्षा की’ के साथ सकारात्मक, सतर्क देखभाल का अर्थ सबसे स्वाभाविक है; अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: שָׁמְרָה
  choice: रक्षा की है
  rationale: क्रिया का मूल भाव संभालकर रखना, पहरा देना या सुरक्षित रखना है। ‘रक्षा की है’ स्पष्ट और स्रोत के निकट है।
- source_word: רוּחִי
  choice: मेरी आत्मा
  rationale: רוּחַ का अर्थ आत्मा, साँस या प्राण हो सकता है। मुख्य पाठ में ‘आत्मा’ चुना गया है, जबकि शारीरिक जीवन-श्वास का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के संबंध में חֶסֶד का भाव
  choice: अटल प्रेम
  alternative: दया; कृपा; निष्ठावान प्रेम
  rationale: यह पद परमेश्वर की हितकारी भलाई बताता है, पर किसी संकीर्ण सिद्धान्तगत अर्थ की माँग नहीं करता। ‘अटल प्रेम’ निष्ठा और स्थिरता को बनाए रखता है।
- issue: פְקֻדָּה का अर्थ
  choice: सकारात्मक देखभाल
  alternative: निगरानी; निरीक्षण; सुधि लेना
  rationale: शब्द का अर्थ-क्षेत्र व्यापक है, किंतु ‘मेरी आत्मा की रक्षा की है’ वाला निकट संदर्भ हितकारी और सतर्क देखभाल की ओर संकेत करता है। अस्पष्टता पादटिप्पणी में दिखाई गई है।
- issue: רוּחִי का आशय
  choice: मेरी आत्मा
  alternative: मेरी साँस; मेरे प्राण
  rationale: संदर्भ में भीतरी जीवन या जीवित रखनेवाली श्वास—दोनों अर्थ संभव हैं। मुख्य पाठ में ‘आत्मा’ रखा गया है और भौतिक जीवन-श्वास का विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। परमेश्वर को संबोधित करने के लिए निकट और पारंपरिक एकवचन ‘तू/तेरी’ का प्रयोग किया गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के तुरंत बाद रखे गए हैं।
