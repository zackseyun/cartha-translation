  text: אִם רָשַׁ֡עְתִּי אַלְלַ֬י לִ֗/י וְ֭/צָדַקְתִּי לֹא אֶשָּׂ֣א רֹאשִׁ֑/י שְׂבַ֥ע קָ֝ל֗וֹן וּ/רְאֵ֥ה עָנְיִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/015.yaml
  text: If I am wicked[a], woe to me! Even if I am righteous, I cannot lift up my head, filled with disgrace and looking on my affliction.
translation:
  language: hi
  text: यदि मैंने दुष्टता की है, तो हाय मुझ पर! और यदि मैं धर्मी भी हूँ, तो मैं अपना सिर नहीं उठा सकता—अपमान से भरा हुआ और अपनी विपत्ति को देखता हुआ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मेरी विपत्ति को देख।” यहाँ इब्रानी वाक्य-विन्यास कठिन है; कुछ लोग इसे अय्यूब के आत्म-वर्णन के बजाय परमेश्वर से किया गया सीधा निवेदन मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם רָשַׁעְתִּי
  choice: यदि मैंने दुष्टता की है
  rationale: पूर्ण क्रिया को किए गए दुष्ट आचरण के रूप में व्यक्त किया गया है। यह अगले खंड के धर्मी होने के दावे से स्वाभाविक विरोध बनाता है और केवल न्यायिक ‘दोषी’ अर्थ तक सीमित नहीं करता।
- source_word: אַלְלַי לִי
  choice: मुझ पर हाय!
  rationale: विलाप की तीव्र पुकार को संक्षिप्त, गरिमापूर्ण और प्रचलित हिन्दी में रखा गया है।
- source_word: וְצָדַקְתִּי
  choice: और यदि मैं धर्मी भी हूँ
  rationale: ‘भी’ संयोजक के विरोधात्मक और रियायती भाव को स्पष्ट करता है; ‘धर्मी’ नैतिक और न्यायिक दोनों अर्थछायाएँ बनाए रखता है।
- source_word: לֹא אֶשָּׂא רֹאשִׁי
  choice: मैं अपना सिर नहीं उठा सकता
  rationale: मुहावरा आत्मविश्वास और प्रतिष्ठा के साथ सिर उठाने का है। प्रसंग में ‘नहीं उठा सकता’ अय्यूब की व्यावहारिक असमर्थता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂבַע קָלוֹן
  choice: अपमान से भरा हुआ
  rationale: שְׂבַע के तृप्त अथवा पूर्ण होने के विशेषणात्मक भाव और קָלוֹן के सार्वजनिक लज्जा-अपमान के अर्थ को सुरक्षित रखता है।
- source_word: וּרְאֵה עָנְיִי
  choice: और अपने दुःख को देखता हुआ
  rationale: कठिन इब्रानी रूप को अय्यूब की दशा के निरंतर वर्णन के रूप में रखा गया है, पर वैकल्पिक प्रत्यक्ष निवेदन को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: וּרְאֵה עָנְיִי का वाक्यगत अर्थ
  choice: 'अय्यूब के आत्म-वर्णन की निरंतरता: ‘और अपने दुःख को देखता हुआ’'
  alternative: 'परमेश्वर से सीधा निवेदन: ‘और मेरे दुःख को देख’ अथवा विस्मयात्मक ‘मेरे दुःख को देखो’'
  rationale: निकटवर्ती वाक्य-प्रवाह इसे अय्यूब की अपमान और दुःख से घिरी अवस्था का वर्णन मानने की अनुमति देता है। फिर भी इब्रानी रूप वाक्यगत रूप से कठिन है, इसलिए दूसरे संभव अर्थ को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विलाप-शैली रखी गई है। ‘दुष्टता की है,’ ‘धर्मी,’ और ‘सिर नहीं उठा सकता’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की नैतिक-न्यायिक तनाव और अंतिम पदबंध की वास्तविक अस्पष्टता सुरक्षित है।
