  text: עַֽל דַּ֭עְתְּ/ךָ כִּי לֹ֣א אֶרְשָׁ֑ע וְ/אֵ֖ין מִ/יָּדְ/ךָ֣ מַצִּֽיל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/007.yaml
  text: Though you know that I am not wicked[b][a], there is no one who can deliver from your hand.
translation:
  language: hi
  text: तू जानता है कि मैं दुष्ट नहीं हूँ,[a] फिर भी तेरे हाथ से[b] छुड़ाने वाला कोई नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं अपराधी नहीं हूँ।” इब्रानी में शाब्दिक अर्थ “मैं दुष्ट नहीं हूँ” है; यहाँ अय्यूब अपने पूर्णतः निष्पाप होने का दावा करने के बजाय इस बात से इनकार करता है कि वह दुष्ट मनुष्य है।
    reason: lexical_alternative
  - marker: b
    text: “तेरे हाथ से” इब्रानी भाषा का एक मुहावरा है, जिसका अर्थ किसी के अधिकार या नियंत्रण में होना है।
    reason: cultural_note
lexical_decisions:
- source_word: עַל דַּעְתְּךָ
  choice: तू जानता है
  rationale: यह पदबंध यहाँ परमेश्वर के ज्ञान की ओर सीधा संकेत करता है। अगले खंड के साथ ‘फिर भी’ जोड़ने से प्रसंग का विरोधात्मक भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: כִּי לֹא אֶרְשָׁע
  choice: कि मैं दुष्ट नहीं हूँ
  rationale: כִּי ज्ञात बात का विषय प्रस्तुत करता है, और רשע का अपूर्ण रूप यहाँ अवस्था बताता है। ‘दुष्ट नहीं हूँ’ मूल नैतिक शब्दावली को बनाए रखता है और अय्यूब को पूर्णतः निष्पाप घोषित नहीं करता।
- source_word: וְאֵין
  choice: फिर भी ... कोई नहीं है
  rationale: אֵין का अस्तित्व-सूचक पूर्ण निषेध ‘कोई नहीं है’ से व्यक्त होता है; ‘फिर भी’ दोनों कथनों के बीच निहित विरोध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מִיָּדְךָ
  choice: तेरे हाथ से
  rationale: ‘हाथ’ सामर्थ्य और अधिकार का इब्रानी रूपक है। चित्रात्मक भाषा को अनुवाद में बनाए रखा गया है।
- source_word: מַצִּיל
  choice: छुड़ानेवाला
  rationale: नצל का हिफ़ील कृदंत बचाने या किसी के अधिकार से निकालने वाले व्यक्ति को दर्शाता है; ‘छुड़ानेवाला’ इस संरचना में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के सामने अय्यूब का निर्दोषता-संबंधी दावा
  choice: मैं दुष्ट नहीं हूँ
  alternative: मैं निर्दोष हूँ / मैं अपराधी नहीं हूँ
  rationale: मूल पाठ में רשע (‘दुष्ट’) है। इसलिए अनुवाद अय्यूब के इस दावे को बनाए रखता है कि वह दुष्ट मनुष्य नहीं है, पर इसे पूर्ण निष्पापता के दावे में नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। परमेश्वर को संबोधित करने के लिए एकवचन ‘तू/तेरे’ रखा गया है, जो काव्यात्मक प्रत्यक्ष संबोधन के अनुकूल है। मूल के ‘हाथ’ वाले रूपक और अय्यूब के कथन में निहित धर्मवैचारिक तनाव को सुरक्षित रखा गया है।
