  yaml_path: translation/ot/job/010/017.yaml
  text: You renew your witnesses against me[a], and you increase your anger with me[b]; changes and hard service are with me.
translation:
  language: hi
  text: तू मेरे विरुद्ध अपने गवाहों को फिर-फिर प्रस्तुत करता है[a], और मुझ पर अपना क्रोध बढ़ाता है; बदलाव और युद्ध मेरे साथ हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने प्रमाण’; इब्रानी शब्द का अर्थ न्यायालय में बोलने वाले गवाह या अय्यूब के विरुद्ध प्रस्तुत प्रमाण—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बदलाव और कठिन सेवा मेरे साथ हैं’ अथवा ‘बदलती टुकड़ियाँ और सेना मेरे विरुद्ध हैं।’ इब्रानी पद संक्षिप्त है और इसका अर्थ क्रमिक बदलावों, कठिन सेवा, या सैन्य संघर्ष/सेना से जुड़ा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּחַדֵּשׁ
  choice: फिर से खड़े करता है
  rationale: पिएल रूप में किसी चीज़ को नया करने या फिर उपस्थित करने का भाव है। गवाहों के साथ यह हिंदी प्रयोग बार-बार नए गवाह सामने लाने का आशय स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵדֶיךָ
  choice: अपने गवाह
  rationale: עֵד का बहुवचन सामान्यतः ‘गवाह’ है और נֶגְדִּי के साथ न्यायिक आरोप का बिंब बनाता है; ‘प्रमाण’ की निर्जीव व्याख्या पादटिप्पणी में रखी गई है।
- source_word: נֶגְדִּי
  choice: मेरे विरुद्ध
  rationale: मूल अर्थ ‘मेरे सामने’ है, पर न्यायिक और विरोधी संदर्भ में ‘मेरे विरुद्ध’ हिंदी में उपयुक्त है।
- source_word: וְתֶרֶב
  choice: और ... बढ़ाता है
  rationale: רבה का यह रूप बढ़ाने या अधिक करने का भाव देता है और अगले संज्ञा पद के साथ सीधा, स्वाभाविक हिंदी वाक्य बनाता है।
- source_word: כַּעַשְׂךָ
  choice: अपना क्रोध
  rationale: כעס क्रोध, झुँझलाहट या रोष को सूचित कर सकता है; यहाँ परमेश्वर को सीधे संबोधन में ‘क्रोध’ स्पष्ट और गरिमापूर्ण है।
- source_word: עִמָּדִי
  choice: मुझ पर
  rationale: शाब्दिक अर्थ ‘मेरे साथ’ है, किंतु क्रोध के साथ हिंदी में ‘मुझ पर’ स्वाभाविक संबंध व्यक्त करता है और प्रसंग का विरोधी भाव बनाए रखता है।
- source_word: חֲלִיפוֹת
  choice: बदलती टुकड़ियाँ
  rationale: यह शब्द बदलाव, अदला-बदली या एक के बाद दूसरी आने वाली पाली को सूचित कर सकता है। צבא के साथ ‘बदलती टुकड़ियाँ’ क्रमिक सैनिक हमलों का संक्षिप्त काव्यात्मक बिंब सुरक्षित रखता है।
- source_word: וְצָבָא
  choice: और सेना
  rationale: צבא का अर्थ सेना, युद्ध या कठिन सेवा हो सकता है। חֲלִיפוֹת के साथ सैन्य अर्थ सशक्त है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: עִמִּי
  choice: मेरे विरुद्ध आती हैं
  rationale: मूलतः ‘मेरे साथ’ है, पर शत्रुतापूर्ण प्रसंग में विरोधी संबंध निहित है। ‘आती हैं’ क्रमिक टुकड़ियों के गतिशील चित्र को हिंदी में स्पष्ट करता है।
