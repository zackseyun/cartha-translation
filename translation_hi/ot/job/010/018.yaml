translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे विलाप का स्वर। अय्यूब के परमेश्वर से एकवचन प्रत्यक्ष संबोधन के लिए ‘तू’ रखा गया है। मुख्य पाठ में प्रतिकल्पनात्मक अर्थ स्वाभाविक हिन्दी में व्यक्त है, जबकि पादटिप्पणी अधिक रूपगत विकल्प सुरक्षित रखती है।
