base_translation:
  language: en
  yaml_path: translation/ot/job/010/018.yaml
  text: Why[a], then, did you bring me out from the womb? I should have died, and no eye would have seen me.
translation:
  language: hi
  text: फिर तूने मुझे गर्भ से बाहर क्यों निकाला? मैं मर गया होता, और किसी आँख ने मुझे न देखा होता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शब्दशः: “मैं मर जाता, और कोई आँख मुझे न देखती।” इब्रानी की अपूर्ण क्रियाओं का ऐसा अनुवाद किया जा सकता है, पर प्रसंग अतीत की अवास्तविक संभावना का संकेत देता है।'
    reason: क्रियार्थ का वैकल्पिक अनुवाद
lexical_decisions:
- source_word: וְלָמָּה
  choice: फिर ... क्यों
  rationale: उपसर्ग וְ पिछले विलाप से संबंध जोड़ता है; ‘फिर’ इस प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है, और לָמָּה का प्रश्नार्थक बल ‘क्यों’ से बना रहता है।
- source_word: מֵרֶחֶם
  choice: गर्भ से बाहर
  rationale: यह स्थानिक उद्गम और जन्म की ठोस छवि दोनों को बनाए रखता है।
- source_word: הֹצֵאתָנִי
  choice: तूने मुझे ... निकाला
  rationale: יצא का हिफ़ईल रूप किसी को बाहर लाने या निकलने देने का कारणात्मक अर्थ देता है; एकवचन ‘तू’ परमेश्वर से सीधे संबोधन को सुरक्षित रखता है।
- source_word: אֶגְוַע
  choice: मैं मर गया होता
  rationale: शाब्दिक रूप से अपूर्ण क्रिया है, पर संदर्भ में अतीत की अवास्तविक, वांछित परिणति व्यक्त करती है; यह हिन्दी में सहज प्रतिकल्पनात्मक रूप है।
- source_word: וְעַיִן לֹא תִרְאֵנִי
  choice: और किसी आँख ने मुझे न देखा होता
  rationale: ‘आँख’ को देखने वाले व्यक्ति के लिए प्रयुक्त रूपक के रूप में बनाए रखा गया है; निषेध और प्रतिकल्पनात्मक संबंध हिन्दी क्रियारूप में स्पष्ट हैं।
