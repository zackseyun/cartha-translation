  edition: WLC
  text: כִּֽי תְבַקֵּ֥שׁ לַ/עֲוֺנִ֑/י וּ֭/לְ/חַטָּאתִ֥/י תִדְרֽוֹשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/006.yaml
  text: that you seek out my iniquity and search for my sin?[a]
translation:
  language: hi
  text: 'कि तू मेरे अधर्म को ढूँढ़े

    और मेरे पाप की खोज करे?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तू मेरा दोष ढूँढ़ता और मेरे पाप की खोज करता है।”
    reason: כִּי का कारणसूचक अर्थ, עָוֹן का ‘दोष’ अर्थ, और क्रियाओं के वर्तमानकालीन वाचन—तीनों संभव हैं।
lexical_decisions:
- source_word: כִּי
  choice: कि
  rationale: पिछले पद से चल रहे अय्यूब के आलंकारिक प्रश्न की विषयवस्तु/प्रयोजन को आगे बढ़ाता है; यहाँ सीधा कारणसूचक ‘क्योंकि’ कम उपयुक्त है।
- source_word: תְבַקֵּשׁ
  choice: ढूँढ़े
  rationale: पिएल रूप सक्रिय और छानबीनपूर्ण खोज का भाव देता है; आधुनिक हिन्दी में ‘ढूँढ़े’ स्वाभाविक है।
- source_word: לַעֲוֺנִי
  choice: मेरे अधर्म को
  rationale: עָוֹן में अधर्म, दोष या दोष-दंड के अर्थ संभव हैं। यहाँ नैतिक त्रुटि खोजने का संदर्भ है; ‘अधर्म’ नैतिक अर्थ को रखता है, पर अय्यूब को वास्तव में दोषी घोषित नहीं करता।
- source_word: וּלְחַטָּאתִי
  choice: मेरे पाप की
  rationale: חַטָּאת को समानांतर पद में ‘पाप’ कहना दोनों इब्रानी नैतिक शब्दों का भेद बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: תִדְרֹשׁ
  choice: खोज करे
  rationale: דרש यहाँ खोजने, पूछताछ करने या जाँचने का भाव रखता है। ‘खोज करे’ समानांतरता और गहन छानबीन का संकेत बनाए रखता है।
theological_decisions:
- issue: עָוֹן और חַטָּאת की युगल अभिव्यक्ति
  choice: ‘अधर्म’ और ‘पाप’ के रूप में अनुवाद, बिना यह जताए कि अय्यूब सचमुच दोषी है।
  alternative: ‘दोष’ और ‘पाप’
  rationale: यह अय्यूब की शिकायत है कि परमेश्वर उसमें अपराध खोज रहे हैं। अनुवाद को अय्यूब के वास्तविक दोष के बारे में निर्णय दिए बिना कथन का तनाव बनाए रखना चाहिए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘तू’ आसपास के ईश्वर-संबोधित काव्यात्मक भाषण की सीधी, एकवचन संबोधन-शैली को रखता है। पंक्ति-विभाजन इब्रानी समानांतरता को उभारता है।
