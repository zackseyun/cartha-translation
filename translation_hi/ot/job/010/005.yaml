base_translation:
  language: en
  yaml_path: translation/ot/job/010/005.yaml
  text: Are your days like the days of man[b][a], or your years like the days of a mighty man?
translation:
  language: hi
  text: 'क्या तेरे दिन मनुष्य[a] के दिनों के समान हैं,

    या तेरे वर्ष बलवान पुरुष[b] के दिनों के समान?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी אֱנוֹשׁ का अनुवाद ‘मरणशील मनुष्य’ भी हो सकता है; इस शब्द में मानवीय दुर्बलता और नश्वरता का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी גָבֶר का अनुवाद केवल ‘पुरुष’ भी किया जा सकता है; यहाँ ‘बलवान पुरुष’ पहले खंड के אֱנוֹשׁ (‘मनुष्य’) से शब्दगत भेद बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲכִימֵי
  choice: क्या ... के दिनों के समान
  rationale: प्रश्नवाचक הֲ, तुलनात्मक כ और ‘दिनों’ के रचनात्मक रूप को स्वाभाविक हिन्दी के आलंकारिक प्रश्न में व्यक्त करता है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यहाँ सामान्य मानव का प्रतिनिधिक एकवचन है; शब्द में नश्वरता और दुर्बलता का भाव हो सकता है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: יָמֶיךָ
  choice: तेरे दिन
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अनुवाद; अय्यूब परमेश्वर को प्रत्यक्ष संबोधित कर रहा है।
- source_word: אִם
  choice: या
  rationale: काव्यात्मक समानांतर पंक्ति में यह शर्त नहीं, बल्कि वैकल्पिक तुलना प्रस्तुत करता है।
- source_word: שְׁנוֹתֶיךָ
  choice: तेरे वर्ष
  rationale: ‘तेरे दिन’ के समानांतर मूल बहुवचन और द्वितीय पुरुष एकवचन संबोधन को बनाए रखता है।
- source_word: כִּימֵי
  choice: के दिनों के समान
  rationale: पहली पंक्ति की तुलनात्मक रचना को दूसरी पंक्ति में भी समान रूप से बनाए रखता है।
- source_word: גָבֶר
  choice: बलवान पुरुष
  rationale: גָבֶר में पुरुष के साथ सामर्थ्य या प्रौढ़ बल का भाव हो सकता है; यह अनुवाद אֱנוֹשׁ के ‘मनुष्य’ से मूल का शब्दगत भेद बनाए रखता है, बिना उसे विशेष रूप से ‘योद्धा’ ठहराए।
theological_decisions:
- issue: परमेश्वर के जीवनकाल की मानवीय जीवनकाल से तुलना
  choice: प्रश्न को बिना व्याख्यात्मक विस्तार के आलंकारिक तुलना के रूप में रखा गया है।
  alternative: परमेश्वर के अनन्त होने का स्पष्ट कथन जोड़ना
  rationale: मूल पद प्रत्यक्ष सिद्धान्त-वाक्य नहीं, अय्यूब का आलंकारिक प्रश्न है; उसकी काव्यात्मक और धर्मवैचारिक तनातनी को यथावत रखना उचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। काव्यात्मक समानांतरता बनाए रखने के लिए दोनों पंक्तियों में ‘के दिनों के समान’ दोहराया गया है। ‘तेरे’ मूल के द्वितीय पुरुष एकवचन संबोधन को स्वाभाविक बाइबलीय हिन्दी में व्यक्त करता है।
