base_translation:
  language: en
  yaml_path: translation/ot/job/010/008.yaml
  text: Your hands shaped me and made me[a], together all around[c][b]; yet you swallow me up.
translation:
  language: hi
  text: तेरे हाथों ने मुझे आकार दिया और बनाया[a], पूरी तरह चारों ओर से[b]; फिर भी तू मुझे निगल जाता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गढ़ा’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘एक साथ चारों ओर’; भाव यह है कि परमेश्वर ने अय्यूब को हर ओर से, पूरी तरह बनाया।
    reason: cultural_note
  - marker: c
    text: या ‘परन्तु तू मुझे नष्ट कर देता है’; इब्रानी में शाब्दिक रूप से ‘मुझे निगल जाता है’, जो विनाश का सजीव रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדֶיךָ
  choice: तेरे हाथों ने
  rationale: बहुवचन संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय को बनाए रखते हुए परमेश्वर की व्यक्तिगत सृजनकारी क्रिया का मूर्त चित्र सुरक्षित रखा गया है।
- source_word: עִצְּבוּנִי
  choice: मुझे आकार दिया
  rationale: पिएल रूप यहाँ जान-बूझकर गढ़ने या रूप देने के अर्थ में है। ‘आकार दिया’ कारीगर-सदृश भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעֲשׂוּנִי
  choice: और बनाया
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है; पहले क्रियापद के साथ इसकी समानांतरता और संचयी सृजन-वर्णन सुरक्षित रहता है।
- source_word: יַחַד סָבִיב
  choice: पूरी तरह चारों ओर से
  rationale: शाब्दिक ‘एक साथ चारों ओर’ हिन्दी में अस्वाभाविक है। यह वाक्यांश अय्यूब को संपूर्ण रूप से, हर ओर से गढ़े जाने का भाव देता है; चुना हुआ रूप स्थानिक और समग्र दोनों अर्थ रखता है।
- source_word: וַתְּבַלְּעֵנִי
  choice: फिर भी तू मुझे निगल जाता है
  rationale: בלע के सजीव रूपक ‘निगल जाना’ को ‘नष्ट करना’ बनाकर सपाट नहीं किया गया। ‘फिर भी’ प्रसंग में सृजन और विनाश के बीच विरोध को स्पष्ट करता है, यद्यपि मूल संयोजक सामान्य वाव है।
theological_decisions:
- issue: परमेश्वर के लिए मानव-सदृश सृजनकारी भाषा
  choice: ‘तेरे हाथों’ और दोनों सृजन-क्रियाओं को मूर्त रूप में बनाए रखा गया।
  alternative: ‘तूने मुझे रचा’
  rationale: अय्यूब की पुकार परमेश्वर की निकट और व्यक्तिगत कारीगरी की ओर अपील करती है; सामान्यीकृत अनुवाद इस आलंकारिक बल को घटा देता।
- issue: परमेश्वर के रचने और निगल जाने के बीच तनाव
  choice: ‘फिर भी तू मुझे निगल जाता है’ द्वारा तीखा विरोध सुरक्षित रखा गया।
  alternative: ‘और अब तू मुझे नष्ट कर देता है’
  rationale: पद जान-बूझकर परमेश्वर की सृजनकारी देखभाल और अनुभव किए जा रहे विनाश को आमने-सामने रखता है; अनुवाद इस धर्मवैचारिक तनाव का समाधान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। अय्यूब द्वारा परमेश्वर को सीधे संबोधन के कारण एकवचन निकट संबोधन ‘तेरे/तू’ चुना गया है; यह मूल के 2ms रूपों को दर्शाता है और अनादर सूचित करने के लिए नहीं है। अर्धविराम सृजन और विनाश के तीखे विरोध को औपचारिक ढंग से अलग करता है।
