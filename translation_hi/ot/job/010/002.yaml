source:
  edition: WLC
  text: אֹמַ֣ר אֶל אֱ֭לוֹהַּ אַל תַּרְשִׁיעֵ֑/נִי הֽ֝וֹדִיעֵ֗/נִי עַ֣ל מַה תְּרִיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/002.yaml
  text: I will say to God[a], ‘Do not condemn me[b]; let me know why you contend with me.’
translation:
  language: hi
  text: मैं परमेश्वर से कहूँगा, “मुझे दोषी न ठहराएँ[a]; मुझे बताएँ कि आप किस कारण मुझसे विवाद करते हैं[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे अपराधी घोषित न करें”; इब्रानी क्रिया में न्यायिक अर्थ है।
    reason: lexical_alternative
  - marker: b
    text: या “आप मेरे विरुद्ध मुकदमा क्यों चलाते हैं” अथवा “आप मुझसे क्यों झगड़ते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֹמַר
  choice: मैं ... कहूँगा
  rationale: काल/भाव की दृष्टि से यह रूप भविष्य या संकल्प व्यक्त कर सकता है। अय्यूब यहाँ परमेश्वर को संबोधित करने का अपना इरादा प्रकट करता है, इसलिए “कहूँगा” स्वाभाविक है।
- source_word: אֶל אֱלוֹהַּ
  choice: परमेश्वर से
  rationale: אֱלוֹהַּ अय्यूब में परमेश्वर के लिए प्रयुक्त एकवचन पद है; आधुनिक हिन्दी में “परमेश्वर” स्वाभाविक और गरिमापूर्ण है।
- source_word: אַל תַּרְשִׁיעֵנִי
  choice: मुझे दोषी न ठहराएँ
  rationale: רשע का हिफ़ील रूप न्यायिक अर्थ में किसी को दोषी घोषित करने या ठहराने को दर्शाता है। यह अनुवाद उस न्यायिक भाव को स्पष्ट रखता है।
- source_word: הוֹדִיעֵנִי
  choice: मुझे बताएँ
  rationale: ידע का हिफ़ील आज्ञार्थक रूप ‘जानने देना/अवगत कराना’ है; “मुझे बताएँ” आधुनिक हिन्दी में सहज है।
- source_word: עַל מַה
  choice: किस कारण
  rationale: शाब्दिक रूप से ‘किस बात पर/किसलिए’; यहाँ यह विवाद के आधार या कारण के विषय में प्रश्न करता है।
- source_word: תְּרִיבֵנִי
  choice: आप ... मुझसे विवाद करते हैं
  rationale: ריב में झगड़ने, विवाद करने और न्यायिक वाद चलाने—तीनों की छाया हो सकती है। “विवाद करते हैं” अर्थ को अनावश्यक रूप से केवल औपचारिक मुकदमे तक सीमित नहीं करता।
theological_decisions:
- issue: परमेश्वर से अय्यूब की विनती में न्यायिक भाषा
  choice: “दोषी न ठहराएँ” और “मुझसे विवाद करते हैं”
  alternative: “मुझे अपराधी घोषित न करें” और “मेरे विरुद्ध मुकदमा क्यों चलाते हैं”
  rationale: मूल पद में न्यायिक संघर्ष की छाया है, पर उसे पूरी तरह तकनीकी अदालती भाषा बनाना आवश्यक नहीं। चुना हुआ पाठ अय्यूब और परमेश्वर के बीच न्याय-संबंधी तनाव को बनाए रखता है।
- issue: परमेश्वर के लिए हिन्दी संबोधन
  choice: आदरार्थक “आप”
  alternative: निकट/परंपरागत एकवचन “तू”
  rationale: इब्रानी में संबोधन एकवचन है, पर हिन्दी का “आप” भी संख्या के बजाय आदर सूचित कर सकता है। आधुनिक, सामान्य और गरिमापूर्ण हिन्दी के लिए आदरार्थक रूप चुना गया है; इससे कथन की सीधी विनती बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, सीधा और गरिमापूर्ण संबोधन रखा गया है। परमेश्वर के लिए आदरार्थक “आप” प्रयुक्त है। मुख्य पाठ में न्यायिक अर्थ को “दोषी ठहराना” स्पष्ट करता है, जबकि “विवाद करना” ריב की व्यापक अर्थ-सीमा और मूल की तनावपूर्ण अस्पष्टता को बनाए रखता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से असंगत था; हिन्दी में [a] को תַּרְשִׁיעֵנִי और [b] को תְּרִיבֵנִי के साथ सही स्थान पर रखा गया है।
