  text: זְכָר נָ֭א כִּי כַ/חֹ֣מֶר עֲשִׂיתָ֑/נִי וְֽ/אֶל עָפָ֥ר תְּשִׁיבֵֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/009.yaml
  text: Remember[a], please, that you made me like clay[b], and will you return me to dust?
translation:
  language: hi
  text: कृपया याद कर कि तूने मुझे चिकनी मिट्टी के समान[a] बनाया; और क्या तू मुझे धूल में लौटा देगा?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘चिकनी मिट्टी की तरह।’ इब्रानी अभिव्यक्ति तुलना करती है; वह स्पष्ट रूप से ‘चिकनी मिट्टी से’ नहीं कहती, यद्यपि यहाँ सृष्टि की छवि उभरती है।
    reason: lexical_alternative
  - marker: b
    text: 'यह भी सम्भव है: ‘और तू मुझे धूल में लौटा देगा।’ इब्रानी क्रियारूप को कथन या, प्रसंग के अनुसार, आलंकारिक प्रश्न—दोनों रूपों में समझा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: זְכָר נָא
  choice: कृपया याद कर
  rationale: आज्ञार्थक क्रिया और विनय-सूचक नָא को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है; अय्यूब का परमेश्वर से सीधा निवेदन बना रहता है।
- source_word: כִּי
  choice: कि
  rationale: यह उस बात का परिचय देता है जिसे अय्यूब परमेश्वर से याद करने को कहता है।
- source_word: כַחֹמֶר
  choice: चिकनी मिट्टी के समान
  rationale: उपसर्ग כְּ स्पष्ट रूप से तुलना प्रकट करता है। חֹמֶר के लिए ‘चिकनी मिट्टी’ कुम्हार द्वारा आकार दिए जाने की छवि को स्वाभाविक हिन्दी में सामने लाती है, बिना इसे स्पष्टतः ‘मिट्टी से’ बना देने के।
- source_word: עֲשִׂיתָנִי
  choice: तूने मुझे ... बनाया है
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है। हिन्दी का पूर्ण पक्ष वर्तमान विनती में अतीत के सृजन-कर्म की प्रासंगिकता को स्वाभाविक ढंग से रखता है।
- source_word: עָפָר
  choice: धूल
  rationale: मृत्यु और सृष्टि के प्रसंग में עָפָר का मानक और सुसंगत अनुवाद है।
- source_word: תְּשִׁיבֵנִי
  choice: क्या ... तू मुझे ... लौटा देगा?
  rationale: שוב का हिफ़ील रूप ‘वापस पहुँचाना/लौटाना’ दर्शाता है। प्रसंगगत विलाप को हिन्दी में आलंकारिक प्रश्न के रूप में स्वाभाविक बनाया गया है।
theological_decisions:
- issue: दूसरे उपवाक्य को कथन माना जाए या आलंकारिक प्रश्न
  choice: 'आलंकारिक प्रश्न: ‘और क्या अब तू मुझे धूल में लौटा देगा?’'
  alternative: 'कथन: ‘और तू मुझे धूल में लौटा देगा।’'
  rationale: इब्रानी में स्पष्ट प्रश्नवाचक चिह्न या अव्यय नहीं है, इसलिए दोनों पठन सम्भव हैं। अय्यूब की विनती और विरोधभरे विलाप के संदर्भ में प्रश्न मुख्य पाठ में स्वाभाविक है, जबकि कथन-पठन को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण विलाप। परमेश्वर के लिए एकवचन ‘तू’ मूल इब्रानी के निकट और हिन्दी बाइबलीय-काव्य शैली में स्वाभाविक है। ‘चिकनी मिट्टी’ और ‘धूल’ के भेद से חֹמֶר तथा עָפָר का शब्दगत अंतर सुरक्षित रखा गया है।
