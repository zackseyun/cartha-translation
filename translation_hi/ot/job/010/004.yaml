reference: Job 10:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/עֵינֵ֣י בָשָׂ֣ר לָ֑/ךְ אִם כִּ/רְא֖וֹת אֱנ֣וֹשׁ תִּרְאֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/004.yaml
  text: Do you have eyes of flesh[a], or do you see as a man sees?
translation:
  language: hi
  text: क्या तेरी आँखें मांस की हैं, या तू वैसे देखता है जैसे मनुष्य देखता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मनुष्य’ के लिए प्रयुक्त इब्रानी शब्द אֱנוֹשׁ सामान्य रूप से किसी मानव को दर्शाता है और उसमें प्रायः नश्वरता या दुर्बलता की अर्थछाया होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַעֵינֵי בָשָׂר לָךְ
  choice: क्या तेरी आँखें मांस की हैं
  rationale: प्रश्नवाचक הֲ, ‘आँखें,’ ‘मांस’ और संबंधसूचक לָךְ को स्वाभाविक हिन्दी प्रश्न में व्यक्त किया गया है। ‘मांस की आँखें’ देहधारी मानवीय दृष्टि की ठोस छवि बनाए रखता है।
- source_word: אִם
  choice: या
  rationale: यहाँ אִם शर्त नहीं, बल्कि अलंकारिक प्रश्न के दूसरे विकल्प को प्रस्तुत करता है।
- source_word: כִּרְאוֹת
  choice: वैसे ... जैसे ... देखता है
  rationale: כְּ और ראה के infinitive construct से बनी तुलना को हिन्दी में सहज तुलनात्मक रचना द्वारा खोला गया है।
- source_word: אֱנוֹשׁ
  choice: मनुष्य
  rationale: यह एकवचन सामान्य मानव को सूचित करता है और इसमें नश्वरता अथवा दुर्बलता की छाया हो सकती है; ‘मनुष्य’ हिन्दी में प्रतिनिधिक एकवचन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּרְאֶה
  choice: तू ... देखता है
  rationale: ראה का मूल अर्थ ‘देखना’ रखा गया है, जिससे ‘आँखें’ के साथ शाब्दिक संबंध और प्रश्न की तीक्ष्णता बनी रहती है।
theological_decisions:
- issue: परमेश्वर की दृष्टि के विषय में मानवरूपी भाषा
  choice: ‘मांस की आँखें’ और मनुष्य के समान देखने की ठोस अलंकारिक तुलना को यथावत रखना
  alternative: 'अर्थ खोलकर कहना: ‘क्या तू मनुष्यों की तरह केवल बाहरी रूप देखकर न्याय करता है?’'
  rationale: इब्रानी पाठ मानवीय देहबद्ध दृष्टि और परमेश्वर की दृष्टि के बीच प्रश्नात्मक तनाव को ठोस भाषा में रखता है। व्याख्यात्मक विस्तार उस तनाव को समय से पहले सुलझा देगा।
- issue: אֱנוֹשׁ का सामान्य एकवचन
  choice: मनुष्य
  alternative: नश्वर मनुष्य / मानवजाति
  rationale: ‘मनुष्य’ सामान्य प्रतिनिधिक एकवचन को बनाए रखता है; ‘नश्वर’ मुख्य पाठ में उस अर्थछाया को आवश्यकता से अधिक स्पष्ट कर देगा।
translation_notes:
  register: अय्यूब के परमेश्वर से सीधे संबोधन के अनुरूप एकवचन ‘तू/तेरी’ रखा गया है। भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट है; मानवरूपी बिंब को नरम नहीं किया गया।
