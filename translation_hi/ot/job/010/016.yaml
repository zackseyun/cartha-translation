  text: If I lift myself up[a], you hunt me like a lion[b], and again you show yourself wonderful against me.
translation:
  language: hi
  text: यदि मैं ऊँचा उठूँ[a], तो तू सिंह की तरह मेरा शिकार करता है, और फिर मेरे विरुद्ध अद्भुत रीति से प्रकट होता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्य संक्षिप्त और अस्पष्ट है; आरंभ का अर्थ “और यदि वह ऊँचा उठे,” “यदि मैं ऊँचा उठूँ,” “यदि मेरा सिर ऊँचा उठे,” या “और वह ऊँचा उठता है” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू मेरे विरुद्ध अद्भुत कार्य करता है।” इब्रानी शब्द असाधारण या विस्मयकारी कार्य का बोध दे सकता है; यहाँ प्रसंग विरोधपूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיִגְאֶה
  choice: यदि वह ऊँचा उठे
  rationale: क्रिया रूप तीसरे पुरुष एकवचन में है और वाक्य अंडाकार तथा कठिन है। इसलिए पाठ के व्याकरणिक रूप को रखते हुए स्वाभाविक शर्तसूचक अनुवाद किया गया है; इसका संकेत अय्यूब या उसके सिर के उठने की ओर हो सकता है।
- source_word: כַּשַּׁחַל
  choice: सिंह की तरह
  rationale: שַׁחַל शक्तिशाली या उग्र सिंह को दर्शाता है; सामान्य हिंदी में ‘सिंह’ उपमा को स्पष्ट और गरिमापूर्ण ढंग से रखता है।
- source_word: תְּצוּדֵנִי
  choice: मेरा शिकार करता है
  rationale: צוד शिकार करने या शिकार की तरह पीछा करने का बोध देता है। यह सिंह की उपमा से स्वाभाविक रूप से जुड़ता है।
- source_word: וְתָשֹׁב
  choice: और फिर
  rationale: שׁוב का शाब्दिक अर्थ लौटना है, पर यहाँ यह दोबारा या फिर किए गए कार्य को सूचित करता है।
- source_word: תִּתְפַּלָּא
  choice: अपना अद्भुत सामर्थ्य दिखाता है
  rationale: פלא का हित्पएल रूप स्वयं को अद्भुत दिखाने या असाधारण कार्य करने का भाव रखता है। हिंदी में यह अभिव्यक्ति संदर्भ की असाधारण और भयावह कार्रवाई को सहज रूप से व्यक्त करती है।
- source_word: בִי
  choice: मेरे विरुद्ध
  rationale: בִי के कई संभावित अर्थ हैं, किंतु अय्यूब की शिकायत के इस विरोधी संदर्भ में ‘मेरे विरुद्ध’ उचित है।
theological_decisions:
- issue: दुःख पहुँचाने वाले प्रसंग में פלא का अनुवाद
  choice: मेरे विरुद्ध अपना अद्भुत सामर्थ्य दिखाता है
  alternative: मेरे विरुद्ध अद्भुत कार्य करता है
  rationale: अनुवाद परमेश्वर की असाधारण कार्रवाई और अय्यूब के विरुद्ध अनुभव किए जा रहे उसके भयावह स्वरूप—दोनों के तनाव को बनाए रखता है; इसे न तो कल्याणकारी चमत्कार बनाया गया है, न केवल सामान्य आक्रमण।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, काव्यात्मक किंतु सहज शैली रखी गई है। अय्यूब की परमेश्वर से सीधी बातचीत के अनुरूप एकवचन ‘तू’ प्रयुक्त है। कठिन आरंभिक इब्रानी को मुख्य पाठ और पादटिप्पणी में अस्पष्ट ही रहने दिया गया है।
