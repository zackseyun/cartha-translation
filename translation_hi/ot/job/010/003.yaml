  text: הֲ/ט֤וֹב לְ/ךָ֨ כִּֽי תַעֲשֹׁ֗ק כִּֽי תִ֭מְאַס יְגִ֣יעַ כַּפֶּ֑י/ךָ וְ/עַל עֲצַ֖ת רְשָׁעִ֣ים הוֹפָֽעְתָּ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/010/003.yaml
  text: Is it good for you that you oppress[a], that you despise the work of your hands, and shine upon the counsel of the wicked?
translation:
  language: hi
  text: क्या यह आपके लिए अच्छा है कि आप अत्याचार करें, अपने ही हाथों के काम को तुच्छ जानें, और दुष्टों की योजना पर अपनी ज्योति चमकाएँ[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दुष्टों की योजना पर कृपादृष्टि करें।” इब्रानी क्रिया का शाब्दिक अर्थ “चमकना/तेज प्रकट करना” है; यहाँ इसका भाव संभवतः अनुकूलता दिखाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲטוֹב לְךָ
  choice: क्या यह आपके लिए अच्छा है
  rationale: प्रश्नवाचक הֲ और טוֹב के सीधे अलंकारिक प्रश्न को बनाए रखता है; לְךָ का संबंध-सूचक भाव भी स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: תַעֲשֹׁק
  choice: आप अत्याचार करें
  rationale: עָשַׁק के उत्पीड़न और अन्याय के प्रबल अर्थ को बिना नरम किए व्यक्त करता है।
- source_word: תִמְאַס
  choice: तुच्छ जानें
  rationale: מָאַס में अस्वीकार और तिरस्कार दोनों का भाव है; यहाँ यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: יְגִיעַ כַּפֶּיךָ
  choice: अपने ही हाथों के काम
  rationale: शाब्दिक श्रम अथवा उसके फल को सृष्टिकर्ता के बनाए हुए कार्य के रूप में स्पष्ट करता है; 'ही' विरोध को स्वाभाविक रूप से उभारता है।
- source_word: עֲצַת רְשָׁעִים
  choice: दुष्टों की योजना
  rationale: עֵצָה का अर्थ परामर्श, योजना या उद्देश्य हो सकता है; प्रसंग में 'योजना' सहज है और अर्थ-सीमा को अनुचित रूप से संकीर्ण नहीं करती।
- source_word: הוֹפָעְתָּ
  choice: प्रकाश चमकाएँ
  rationale: हिफ़ील रूप के मूल प्रकाश/तेज प्रकट करने वाले रूपक को मुख्य पाठ में सुरक्षित रखता है; अनुकूल दृष्टि का संभावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के प्रति मानवरूपी आरोप
  choice: अय्यूब की सीधी अलंकारिक चुनौती और उसके कठोर क्रियापदों को बनाए रखा गया है।
  alternative: क्या आपको ऐसा प्रतीत कराना अच्छा लगता है कि आप अत्याचार करते हैं...
  rationale: इब्रानी पाठ अय्यूब की शिकायत को तीखे आरोप के रूप में प्रस्तुत करता है; उसे नरम करना या केवल आभास कहना पाठ की धार्मिक तनातनी को समय से पहले सुलझा देगा।
- issue: הוֹפָעְתָּ का रूपक और आशय
  choice: मुख्य पाठ में प्रकाश का रूपक रखा गया है।
  alternative: दुष्टों की योजना पर कृपादृष्टि करें
  rationale: रूपक मूल पाठ के अधिक निकट है, जबकि प्रसंग में अनुकूलता दिखाने का अर्थ संभव है; इसलिए वह पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए आदरसूचक बहुवचन क्रिया-रूप, किंतु अय्यूब के आरोप की तीक्ष्णता अक्षुण्ण। शब्दावली सहज, गरिमापूर्ण और गैर-सांप्रदायिक रखी गई है।
