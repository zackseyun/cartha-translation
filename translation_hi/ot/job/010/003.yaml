    issue: “प्रकाश चमकाएँ” is an unnatural, tautological Hindi collocation.
    rationale: Hindi normally uses either “प्रकाश फैलाएँ/डालें” or “ज्योति चमकाएँ.” Since “प्रकाश डालें” can suggest merely explaining or revealing something, “अपनी ज्योति चमकाएँ” better preserves the source's shining image and its possible favorable implication.
