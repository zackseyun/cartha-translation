  footnotes:
  - marker: a
    text: या, पारंपरिक रूप से, “अंधकार और मृत्यु की छाया के देश में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּטֶרֶם
  choice: इससे पहले कि
  rationale: यह समयसूचक पद आगामी प्रस्थान से पहले की बात व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: אֵלֵךְ
  choice: मैं वहाँ जाऊँ
  rationale: הלך का सामान्य अर्थ ‘जाना’ है। ‘वहाँ’ हिन्दी में आगे आने वाले गंतव्य से संबंध स्पष्ट करता है, बिना इसे सीधे ‘मरना’ कहकर अर्थ सीमित किए।
- source_word: וְלֹא אָשׁוּב
  choice: जहाँ से मैं लौटकर नहीं आऊँगा
  rationale: शाब्दिक भाव ‘और मैं न लौटूँगा’ है; हिन्दी में संबंधवाचक संरचना गंतव्य की अपरिवर्तनीयता को स्वाभाविक ढंग से व्यक्त करती है, बिना ‘कभी नहीं’ जैसा बलवर्धक जोड़ने के।
- source_word: אֶל אֶרֶץ
  choice: उस देश में
  rationale: אֶל दिशा और אֶרֶץ एक क्षेत्र/लोक का बोध कराते हैं। ‘देश में’ हिन्दी में गंतव्य के लिए सहज है; ‘उस’ आगे दिए वर्णन से उसकी निश्चितता दिखाता है।
- source_word: חֹשֶׁךְ
  choice: अंधकार
  rationale: मूल शब्द का सीधा अर्थ ‘अंधकार’ है और यह काव्यात्मक, गरिमापूर्ण हिन्दी है।
- source_word: צַלְמָוֶת
  choice: घोर छाया
  rationale: यह पद गहन अंधकार अथवा मृत्यु की छाया के अर्थ में समझा जा सकता है। ‘घोर छाया’ काव्यात्मक समानांतरता और कुछ lexical ambiguity बचाती है; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: मृत्यु-संदर्भ में צַלְמָוֶת का अनुवाद
  choice: घोर छाया
  alternative: मृत्यु की छाया; घोर अंधकार
  rationale: शब्द की व्युत्पत्ति और प्रयोग को लेकर ‘मृत्यु की छाया’ तथा ‘गहरा/घोर अंधकार’ दोनों समझें मिलती हैं। मुख्य पाठ में ‘घोर छाया’ काव्यात्मक बिंब को बनाए रखता है और मृत्यु को मूल से अधिक स्पष्ट नहीं करता; पारंपरिक पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; अय्यूब की विलापपूर्ण काव्यात्मकता के अनुरूप गरिमापूर्ण किंतु सामान्य पाठकों के लिए स्पष्ट भाषा। संबंधवाचक वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए अपनाया गया है।
