  yaml_path: translation/ot/job/010/014.yaml
  text: If I sin[a], you watch me[b], and you will not acquit me of my iniquity.
translation:
  language: hi
  text: यदि मैंने पाप किया है[a], तो आप मुझ पर नज़र रखते हैं[b], और मेरे अधर्म के विषय में मुझे निर्दोष नहीं ठहराते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि मैं पाप करता हूँ।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नज़र रखते हैं” का अर्थ रक्षा करना नहीं, बल्कि निकटता से निगरानी करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है। ‘यदि’ अय्यूब की बात को शर्त के रूप में रखता है और उसे निश्चित या सामान्य घटना मानकर अस्पष्टता दूर नहीं करता।
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: यह חטא का काल पूर्ण रूप, प्रथम पुरुष एकवचन है। हिन्दी में ‘मैंने पाप किया है’ शर्त के भीतर पूर्ण क्रिया को स्वाभाविक रूप से व्यक्त करता है; प्रसंग इसे किसी एक निश्चित पुराने अपराध तक सीमित नहीं करता।
- source_word: וּשְׁמַרְתָּנִי
  choice: तो आप मुझ पर नज़र रखते हैं
  rationale: שׁמר का अर्थ रखना, पहरा देना या निगरानी करना हो सकता है। यहाँ प्रसंग सुरक्षात्मक देखभाल का नहीं, पाप पकड़ने के लिए निकट निरीक्षण का है; इसलिए ‘नज़र रखते हैं’ उपयुक्त है।
- source_word: וּמֵעֲוֺנִי
  choice: मेरे अधर्म से
  rationale: עָוֹן अधर्म, दोष या अधर्म के दण्ड को सूचित कर सकता है। נקה के साथ ‘मेरे अधर्म से’ नैतिक और न्यायिक दोनों आयामों को बनाए रखता है, बिना इसे केवल अपराध-बोध या दण्ड तक सीमित किए।
- source_word: לֹא תְנַקֵּנִי
  choice: मुझे निर्दोष नहीं ठहराएँगे
  rationale: נקה का पिएल रूप न्यायिक प्रसंग में निर्दोष घोषित करना या दोषमुक्त करना दर्शाता है। ‘निर्दोष नहीं ठहराएँगे’ सामान्य हिन्दी में न्यायिक अर्थ स्पष्ट करता है और अनुष्ठानिक शुद्धि का अनावश्यक संकेत नहीं देता।
theological_decisions:
- issue: נקה का न्यायिक अर्थ बनाम शुद्धिकरण का अर्थ
  choice: 'न्यायिक: ‘मुझे निर्दोष नहीं ठहराएँगे’'
  alternative: 'शुद्धिकरण: ‘मुझे शुद्ध नहीं करेंगे’; दण्डात्मक परिणाम: ‘मुझे बिना दण्ड के नहीं छोड़ेंगे’'
  rationale: 'आसपास की शिकायत न्यायालय-सदृश है: पाप होने पर परमेश्वर निगरानी करते और अय्यूब को दोषमुक्त नहीं करते। न्यायिक अनुवाद आरोप की तीक्ष्णता बनाए रखता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को पाठ में नहीं डालता।'
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष रूप। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘अधर्म’ नैतिक-न्यायिक अर्थ बनाए रखता है, जबकि ‘निर्दोष ठहराना’ न्यायिक भाव को सामान्य पाठक के लिए स्पष्ट करता है।
