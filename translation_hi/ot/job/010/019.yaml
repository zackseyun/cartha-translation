  text: I would have been as though I had not been[b][a]; from the womb I would have been carried to the grave.
translation:
  language: hi
  text: मैं ऐसा होता, मानो मैं कभी था ही नहीं; गर्भ से कब्र तक मुझे ले जाया गया होता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: मानो
  rationale: यहाँ तुलना एक अवास्तविक, प्रतिकल्पित दशा से है; ‘मानो’ इसे स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: לֹא הָיִיתִי אֶהְיֶה
  choice: मैं ऐसा होता, मानो कभी था ही नहीं
  rationale: היה के रूपों का क्रम संदर्भ में प्रतिकल्पित दशा व्यक्त करता है। ‘कभी था ही नहीं’ अस्तित्व में न होने के भाव को सहज आधुनिक हिंदी में रखता है।
- source_word: מִבֶּטֶן
  choice: गर्भ से ही
  rationale: ‘गर्भ’ मूल बिंब को बनाए रखता है; ‘ही’ सीधे गर्भ से कब्र तक पहुँचाए जाने की तीव्रता को स्वाभाविक हिंदी में उभारता है।
- source_word: לַקֶּבֶר
  choice: कब्र तक
  rationale: קֶבֶר दफनाने की जगह या कब्र को दर्शाता है, अधोलोक को नहीं। ‘तक’ מִן...לְ की आरंभ-बिंदु से गंतव्य तक की रचना को व्यक्त करता है।
- source_word: אוּבָל
  choice: पहुँचा दिया गया होता
  rationale: यबल का होफ़ाल रूप निष्क्रिय कारणवाचक अर्थ ‘ले जाया/पहुँचा दिया जाना’ देता है। ‘पहुँचा दिया गया होता’ हिंदी में गर्भ से सीधे कब्र तक ले जाए जाने का भाव स्पष्ट और गरिमापूर्ण ढंग से रखता है।
