  yaml_path: translation/ot/job/010/013.yaml
  text: Yet these things you hid in your heart[b][a]; I knew that this was with you.
translation:
  language: hi
  text: फिर भी इन बातों को तूने अपने हृदय में छिपा रखा था[a]; मैं जानता था कि यह तेरे पास था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने हृदय में संचित कर रखा था।” इब्रानी क्रिया का अर्थ “छिपाना,” “संचित करना” या “सुरक्षित रख छोड़ना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “तेरे पास था” का अर्थ “तेरे मन में था” या “तेरे छिपे हुए उद्देश्य का भाग था” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: फिर भी इन बातों को
  rationale: वְ का सामान्य अर्थ ‘और’ है, पर पिछले पद में परमेश्वर के उपकारों से अब उसके छिपे हुए अभिप्राय की ओर मुड़ने के कारण यहाँ विरोधसूचक ‘फिर भी’ स्वाभाविक है। אֵלֶּה का बहुवचन भाव ‘इन बातों’ से व्यक्त होता है।
- source_word: צָפַנְתָּ
  choice: तूने ... छिपा रखा था
  rationale: צפן का अर्थ छिपाना, संचित रखना या सुरक्षित रख छोड़ना हो सकता है। यहाँ गुप्त आंतरिक अभिप्राय के संदर्भ में ‘छिपा रखा था’ उपयुक्त है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: בִלְבָבֶךָ
  choice: अपने हृदय में
  rationale: לֵבָב मन, इच्छा और भीतरी व्यक्तित्व को सूचित कर सकता है। ‘हृदय’ मूल इब्रानी रूपक और उसकी व्यापकता को बनाए रखता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता था
  rationale: प्रथम पुरुष एकवचन पूर्ण क्रिया को भूतकाल में सहज और सीधा रूप दिया गया है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात का विषय प्रस्तुत करता है जिसे अय्यूब जानता था; इसलिए ‘कि’ स्वाभाविक है।
- source_word: זֹאת
  choice: यह
  rationale: स्त्रीलिंग एकवचन संकेतवाचक छिपी हुई बात या अभिप्राय की ओर सामूहिक रूप से संकेत कर सकता है। ‘यह’ उसके संदर्भ को मूल पाठ की तरह अनिर्धारित रखता है।
- source_word: עִמָּךְ
  choice: तेरे ही पास था
  rationale: עִם का मूल भाव ‘साथ/पास’ है। ‘तेरे ही पास था’ हिंदी में स्वामित्व या किसी के भीतर सुरक्षित अभिप्राय—दोनों की संभावना खुली रखते हुए इब्रानी मुहावरे के निकट रहता है।
theological_decisions:
- issue: परमेश्वर के छिपे हुए अभिप्राय का स्वरूप
  choice: ‘यह’ किस बात की ओर संकेत करता है, इसे अनिर्धारित रखा गया है और अय्यूब के कथन में छिपे दिव्य उद्देश्य की शिकायत बनी रहती है।
  alternative: इसे विशेष रूप से अय्यूब को दुःख देने की परमेश्वर की गुप्त योजना मानना, अथवा पिछले पद के उपकारों से जोड़ना।
  rationale: इब्रानी पद छिपी हुई बात को स्पष्ट रूप से परिभाषित नहीं करता। किसी एक धर्मवैचारिक निष्कर्ष को जोड़ने के बजाय अनुवाद मूल की अस्पष्टता और तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण काव्यात्मक गद्य रखा गया है। परमेश्वर को संबोधित करने के लिए एकवचन ‘तू/तेरे’ मूल इब्रानी के प्रत्यक्ष, एकवचन संबोधन को दर्शाता है।
