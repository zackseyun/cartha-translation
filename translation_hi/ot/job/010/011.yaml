base_translation:
  language: en
  yaml_path: translation/ot/job/010/011.yaml
  text: You clothed me with skin and flesh[a], and wove me together with bones and sinews.
translation:
  language: hi
  text: तूने मुझे त्वचा और मांस से पहनाया, और हड्डियों और स्नायुओं से मुझे गूँथ दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हड्डियों और स्नायुओं से मुझे ढक दिया।” इब्रानी क्रिया का अर्थ ढकना या चारों ओर से घेरना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: चमड़ा
  rationale: मानव शरीर के संदर्भ में यह बाहरी त्वचा को दर्शाता है; काव्यात्मक समानांतरता में ‘चमड़ा’ ठोस और स्वाभाविक है।
- source_word: בָשָׂר
  choice: मांस
  rationale: यह शरीर के मांसल ऊतक का सीधा अर्थ देता है और ‘चमड़े’ के साथ मूल की ठोस शारीरिक छवि बनाए रखता है।
- source_word: תַּלְבִּישֵׁנִי
  choice: तूने मुझे ... पहनाया
  rationale: हिफ़िल रूप का मूल अर्थ किसी को वस्त्र पहनाना है; यह परमेश्वर द्वारा अय्यूब के शरीर को आवृत करने की उपमा सुरक्षित रखता है।
- source_word: בַּעֲצָמוֹת
  choice: हड्डियों से
  rationale: यहाँ ב को साधन अथवा संघटन के अर्थ में समझना स्वाभाविक है।
- source_word: גִידִים
  choice: नसों
  rationale: גידים स्नायु, कण्डरा अथवा अन्य जोड़ने वाले ऊतकों को दर्शा सकता है; ‘नसों’ सामान्य आधुनिक हिन्दी में सहज और पारंपरिक शारीरिक शब्द है, यद्यपि पूरी तरह चिकित्सकीय विशिष्टता नहीं देता।
- source_word: תְּסֹכְכֵנִי
  choice: मुझे गूँथ दिया
  rationale: סכך में ढकने, घेरने अथवा परस्पर जोड़ने का अर्थ हो सकता है। शरीर-निर्माण के संदर्भ में ‘गूँथ दिया’ निर्माण और संयोजन की काव्यात्मक छवि देता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर द्वारा मानव-शरीर की रचना की काव्यात्मक छवि
  choice: पद को अय्यूब के शरीर के निर्माण का काव्यात्मक वर्णन मानकर अनूदित किया गया है।
  alternative: क्रिया को मुख्यतः ‘ढकना’ या ‘घेरना’ समझना।
  rationale: निकटवर्ती संदर्भ गर्भ में अय्यूब की शारीरिक रचना का वर्णन करता है। अनुवाद इस छवि को रखता है, पर उससे आगे कोई विशिष्ट मानवशास्त्रीय या सृष्टि-संबंधी सिद्धान्त नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘तूने’ अय्यूब द्वारा परमेश्वर को किए गए सीधे संबोधन के एकवचन रूप को बनाए रखता है।
