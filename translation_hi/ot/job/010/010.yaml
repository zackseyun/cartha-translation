lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर हाँ है; यह हिंदी में उसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखता है।
- source_word: כֶחָלָב
  choice: दूध के समान
  rationale: उपसर्ग כ तुलना दर्शाता है; यह रूप मूल उपमा को स्पष्ट और गरिमापूर्ण हिंदी में रखता है।
- source_word: תַּתִּיכֵנִי
  choice: मुझे ... उँडेला
  rationale: נתך के हिफ़ील रूप में किसी द्रव को उँडेलने का बिंब है; यहाँ दूध और गर्भ में आकार लेने के रूपक के साथ यह उपयुक्त है।
- source_word: וְכַגְּבִנָּה
  choice: और पनीर के समान
  rationale: גְּבִנָה का सीधा अर्थ पनीर है; साथ ही पदटिप्पणी में व्यापक अर्थ ‘दही का थक्का’ देकर शाब्दिक अनिश्चितता सुरक्षित रखी गई है।
- source_word: תַּקְפִּיאֵנִי
  choice: मुझे ... जमाया
  rationale: קפא के हिफ़ील रूप का अर्थ गाढ़ा या जमा देना है; ‘जमाया’ हिंदी में दुग्ध-बिंब के संदर्भ में स्वाभाविक है और ‘उँडेला’ के समानांतर सकर्मक रचना रखता है।
