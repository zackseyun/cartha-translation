lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: ענה का यह कथात्मक रूप पिछले वक्तव्य के प्रत्युत्तर में भाषण आरम्भ कराता है। ‘उत्तर दिया’ संवाद-सूत्र को स्वाभाविक और औपचारिक ढंग से सुरक्षित रखता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परम्परा में प्रचलित लिप्यंतरण।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: אמר का यह रूप बोलने के लिए प्रयुक्त सामान्य कथात्मक क्रिया है। ‘और कहा’ मूल इब्रानी सूत्र की दूसरी क्रिया को बनाए रखता है।
- source_word: וַ
  choice: तब
  rationale: आरम्भिक वाव कथात्मक क्रम को दर्शाता है। आधुनिक हिन्दी में ‘तब’ प्रसंगगत प्रगति को स्वाभाविक रूप से व्यक्त करता है; ‘और’ भी सम्भव है।
