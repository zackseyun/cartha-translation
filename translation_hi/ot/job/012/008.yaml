  yaml_path: translation/ot/job/012/008.yaml
  text: Or speak to the earth[a], and it will teach you[b]; and the fish of the sea will tell you.
translation:
  language: hi
  text: या धरती से बात कर[a], और वह तुझे सिखाएगी; समुद्र की मछलियाँ तुझे बताएँगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि से’; इब्रानी אֶרֶץ का अर्थ ‘धरती’ या ‘भूमि’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: א֤וֹ
  choice: या
  rationale: यह विकल्पसूचक अव्यय पिछले पदों में दिए गए आह्वानों की शृंखला को आगे बढ़ाता है; आधुनिक हिन्दी में ‘या’ स्वाभाविक और पर्याप्त रूप से औपचारिक है।
- source_word: שִׂ֣יחַ
  choice: बात कर
  rationale: לָאָרֶץ के साथ इस आज्ञार्थक प्रयोग में अर्थ मनन या शिकायत करना नहीं, बल्कि धरती को संबोधित करना है। ‘बात कर’ सामान्य पाठक के लिए स्वाभाविक है और आसपास के पदों में प्राणियों से पूछने के समानांतर है।
- source_word: לָ/אָ֣רֶץ
  choice: धरती से
  rationale: אֶרֶץ का अर्थ ‘धरती’ या ‘भूमि’ हो सकता है। पशु, पक्षी और समुद्र की मछलियों वाले व्यापक सृष्टिगत संदर्भ में ‘धरती’ अधिक उपयुक्त है। हिन्दी में संबोधन के लिए ‘धरती से बात कर’ स्वाभाविक है।
- source_word: וְ/תֹרֶ֑/ךָּ
  choice: और वह तुझे सिखाएगी
  rationale: हिफ़ील रूप का अर्थ ‘सिखाना’ है। स्त्रीलिंग ‘वह’ और ‘सिखाएगी’ धरती के साथ मूल इब्रानी का व्याकरणिक सामंजस्य तथा मानवीकरण दोनों बनाए रखते हैं।
- source_word: וִֽ/יסַפְּר֥וּ לְ֝/ךָ֗
  choice: तुझे बताएँगी
  rationale: पिएल में ספר का अर्थ बताना, वर्णन करना या सुनाना हो सकता है। यहाँ ‘बताएँगी’ शिक्षात्मक समानांतरता को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְּגֵ֣י הַ/יָּֽם
  choice: समुद्र की मछलियाँ
  rationale: यह संबंधवाचक संरचना मूल बिंब को सरल, स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखती है।
