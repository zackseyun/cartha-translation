  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। एकवचन संबोधन के लिए ‘तुझे’ रखा गया है, जो अय्यूब की काव्यात्मक वाणी में स्वाभाविक है। धरती का स्त्रीलिंग मानवीकरण हिन्दी में बिना अतिरिक्त टिप्पणी के स्पष्ट रहता है।
