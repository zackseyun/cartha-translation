source:
  edition: WLC
  text: מֵסִ֗יר לֵ֭ב רָאשֵׁ֣י עַם הָ/אָ֑רֶץ וַ֝/יַּתְעֵ֗/ם בְּ/תֹ֣הוּ לֹא דָֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/024.yaml
  text: He removes understanding from the heads of the people of the land[c][b][a], and makes them wander in a trackless waste.
translation:
  language: hi
  text: वह देश की प्रजा के प्रधानों की समझ छीन लेता है[a], और उन्हें ऐसे उजाड़ में भटकाता है जहाँ कोई मार्ग नहीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “देश/पृथ्वी की प्रजा के प्रधानों का हृदय छीन लेता है।” यहाँ “हृदय” समझ और निर्णय-शक्ति को दर्शाता है; “देश” का अनुवाद “पृथ्वी” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उजाड़ में—कोई मार्ग नहीं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵסִיר
  choice: छीन लेता है
  rationale: हिफ़ील कृदंत का अर्थ ‘हटा देना/ले लेना’ है। ‘छीन लेता है’ समझ से वंचित कर देने की प्रभावी क्रिया और सामान्य कथन दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֵב
  choice: समझ
  rationale: शाब्दिक अर्थ ‘हृदय’ है, पर यहाँ यह सोचने, विवेक करने और उचित निर्णय लेने की क्षमता को सूचित करता है; आधुनिक हिन्दी में ‘समझ’ प्रसंगानुकूल है।
- source_word: רָאשֵׁי עַם הָאָרֶץ
  choice: देश की प्रजा के प्रधानों
  rationale: רָאשֵׁי शाब्दिक रूप से ‘सिर’ और मुहावरे में प्रधान या अगुआ हैं। הָאָרֶץ का अर्थ ‘देश/भूमि’ या ‘पृथ्वी’ हो सकता है; राजनीतिक-सामाजिक प्रसंग में ‘देश की प्रजा’ स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיַּתְעֵם
  choice: उन्हें ... भटकाता है
  rationale: תעה के कारक रूप में अर्थ है ‘उन्हें भटकने देना/भटका देना।’ यह चयन दैवी कर्तृत्व और दिशाहीनता के बिंब को बनाए रखता है।
- source_word: בְּתֹהוּ
  choice: उजाड़ में
  rationale: תֹהוּ रिक्तता, वीरानी या आकारहीन उजाड़ को दर्शाता है। इस प्रसंग में ‘उजाड़’ भटकाव के स्थान-बिंब को स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: לֹא דָרֶךְ
  choice: जहाँ कोई मार्ग नहीं
  rationale: यह इब्रानी पदबंध का लगभग शाब्दिक और स्वाभाविक रूप है; इससे मार्गविहीन वीराने का चित्र बिना अनावश्यक व्याख्या के बना रहता है।
theological_decisions:
- issue: क्रियाओं का अप्रकट कर्ता
  choice: ‘वह’ से परमेश्वर का संकेत बनाए रखा गया है।
  alternative: हर खंड में ‘परमेश्वर’ स्पष्ट रूप से जोड़ना।
  rationale: आस-पास के प्रसंग में कर्ता परमेश्वर है, पर इस पद में उसका नाम दोहराया नहीं गया। ‘वह’ प्रसंगगत दैवी कर्तृत्व को व्यक्त करता है और मूल से अधिक स्पष्टता नहीं जोड़ता।
- issue: הָאָרֶץ का क्षेत्र
  choice: ‘देश’
  alternative: ‘पृथ्वी’
  rationale: यहाँ शासकीय प्रधानों और प्रजा का उल्लेख स्थानीय राजनीतिक-सामाजिक अर्थ का समर्थन करता है, किंतु ‘पृथ्वी’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली अपनाई गई है। ‘प्रधानों’ से नेतृत्व का भाव और ‘समझ छीन लेता है’ से לֵב का प्रसंगगत बौद्धिक अर्थ व्यक्त हुआ है। मूल की ‘देश/पृथ्वी’ और ‘हृदय/समझ’ संबंधी अस्पष्टताएँ पादटिप्पणी में सुरक्षित हैं।
