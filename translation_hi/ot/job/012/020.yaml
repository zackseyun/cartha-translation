lexical_decisions:
- source_word: מֵסִיר
  choice: छीन लेता है
  rationale: हिफ़ील रूप यहाँ किसी क्षमता को दूर कर देने का भाव देता है। ‘छीन लेता है’ वाणी से वंचित किए जाने को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שָׂפָה
  choice: वाणी
  rationale: शाब्दिक अर्थ ‘होंठ’ है, पर यहाँ यह लाक्षणिक रूप से बोलने की क्षमता या प्रभावपूर्ण वचन को सूचित करता है।
- source_word: לְנֶאֱמָנִים
  choice: भरोसेमंद लोगों की
  rationale: נֶאֱמָנִים का अर्थ विश्वासयोग्य, विश्वसनीय या भरोसे के योग्य लोग हो सकता है। ‘भरोसेमंद लोग’ आधुनिक हिंदी में इस व्यापक अर्थ को बनाए रखता है।
- source_word: טַעַם
  choice: समझ-बूझ
  rationale: इसका मूल अर्थ ‘स्वाद’ है, किंतु यहाँ लाक्षणिक अर्थ विवेक, निर्णय-क्षमता या समझ है। ‘समझ-बूझ’ सामान्य पाठक के लिए सहज है और ज्ञान-साहित्य के संदर्भ में उपयुक्त है।
- source_word: זְקֵנִים
  choice: बुज़ुर्गों
  rationale: यह शब्द आयु में बड़े तथा सामाजिक रूप से सम्मानित अनुभवी लोगों, दोनों को सूचित कर सकता है। ‘बुज़ुर्ग’ इन दोनों पहलुओं को स्वाभाविक हिंदी में समेटता है।
- source_word: יִקָּח
  choice: हर लेता है
  rationale: לקח सामान्यतः ‘लेना’ है; समानांतर पंक्ति में संदर्भ इसका वंचित करने वाला अर्थ स्पष्ट करता है। ‘हर लेता है’ पहली पंक्ति के ‘छीन लेता है’ के साथ अर्थगत समानता और शैलीगत विविधता रखता है।
