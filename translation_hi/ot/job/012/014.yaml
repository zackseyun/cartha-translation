base_translation:
  language: en
  yaml_path: translation/ot/job/012/014.yaml
  text: Look[a], if he tears down, it cannot be rebuilt; if he shuts a man in[b], it cannot be opened.
translation:
  language: hi
  text: देखो[a], यदि वह ढा दे, तो फिर बनाया नहीं जा सकता; यदि वह किसी मनुष्य को बंद कर दे[b], तो खोला नहीं जा सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निश्चय ही” अथवा “देखो तो।”
    reason: lexical_alternative
  - marker: b
    text: या “यदि वह किसी मनुष्य को बंद कर ले” अथवा “उसे कैद कर दे।” अंतिम वाक्य में क्या खोला नहीं जा सकता, यह मूल पाठ में स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह आरंभिक निपात ध्यान आकर्षित करते हुए कथन पर बल देता है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में इसका बल बनाए रखता है।
- source_word: יַהֲרוֹס
  choice: ढा दे
  rationale: הרס किसी निर्मित वस्तु को गिराने या ढाने का बोध देता है। ‘ढा दे’ अगले निष्क्रिय क्रियापद ‘बनाया’ के साथ निर्माण का बिंब बनाए रखता है।
- source_word: וְלֹא יִבָּנֶה
  choice: वह फिर बनाया नहीं जा सकता
  rationale: נפעל रूप निष्क्रिय अर्थ ‘बनाया जाए’ देता है। प्रसंग में परिणाम की अपरिवर्तनीयता व्यक्त करने के लिए ‘नहीं जा सकता’ स्वाभाविक है; ‘फिर’ हिन्दी में पुनर्निर्माण का आशय स्पष्ट करता है।
- source_word: יִסְגֹּר עַל אִישׁ
  choice: वह किसी पुरुष को बंद कर दे
  rationale: סגר और עַל का मेल किसी को बंद करने या सीमित कर देने का ठोस बिंब देता है। ‘पुरुष’ אִישׁ के एकवचन पुल्लिंग रूप को बनाए रखता है, जबकि औपचारिक कारावास का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: וְלֹא יִפָּתֵחַ
  choice: तो द्वार खोला नहीं जा सकता
  rationale: נפעל रूप का मूल अर्थ ‘खोला जाए’ है। हिन्दी में बंद किए गए पुरुष के बजाय बंद प्रवेश का खुलना अभिप्रेत समझा जाता है; स्पष्टता के लिए ‘द्वार’ की पूर्ति की गई है, जिसे पादटिप्पणी में चिह्नित किया गया है।
theological_decisions:
- issue: ईश्वरीय कर्ता का उल्लेख
  choice: वह
  alternative: परमेश्वर / यहोवा
  rationale: इब्रानी पद में कर्ता के लिए केवल तृतीय पुरुष एकवचन क्रियाएँ हैं; कोई ईश्वरीय नाम या उपाधि स्पष्ट रूप से नहीं दी गई। ‘वह’ आसपास के प्रसंग से परमेश्वर की ओर संकेत करते हुए स्रोत की अभिव्यक्ति को सुरक्षित रखता है।
- issue: अपरिवर्तनीय परिणाम और व्याकरणिक भाव
  choice: ‘नहीं जा सकता’
  alternative: ‘नहीं बनाया जाएगा / नहीं खोला जाएगा’
  rationale: इब्रानी अपूर्णकालीन निष्क्रिय रूप साधारण भविष्य अथवा परिणामगत असंभवता दोनों की छाया रख सकते हैं। प्रसंग में परमेश्वर के कार्य की अटलता प्रमुख है, इसलिए हिन्दी में सामर्थ्य-अभाव की अभिव्यक्ति चुनी गई, पर इसे दार्शनिक सर्वशक्तिमत्ता के स्वतंत्र कथन के रूप में नहीं बढ़ाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। समानांतर वाक्यरचना और ढाने-बनाने तथा बंद करने-खोलने के बिंब सुरक्षित रखे गए हैं। ‘पुरुष’ स्रोत के אִישׁ को औपचारिक रूप से दर्शाता है; ‘बंद कर दे’ सामान्य पाठक के लिए सहज है।
