source:
  edition: WLC
  text: שְׂחֹ֤ק לְ/רֵעֵ֨/הוּ אֶֽהְיֶ֗ה קֹרֵ֣א לֶ֭/אֱלוֹהַּ וַֽ/יַּעֲנֵ֑/הוּ שְׂ֝ח֗וֹק צַדִּ֥יק תָּמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/004.yaml
  text: I am a laughingstock to my friend[a], one who called to God and he answered him[b], a laughingstock to the righteous and blameless man.
translation:
  language: hi
  text: मैं अपने मित्र की नज़र में हँसी का पात्र हूँ[a]—मैं ही वह हूँ जिसने परमेश्वर को पुकारा, और परमेश्वर ने उसे उत्तर दिया[b]। धर्मी और खरा मनुष्य हँसी का पात्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसके मित्र की नज़र में’; इब्रानी प्रत्यय को इस प्रकार भी समझा जा सकता है, पर प्रसंग में अय्यूब अपने ही साथियों के विषय में बोल रहा है।
    reason: alternative_reading
  - marker: b
    text: या, ‘और परमेश्वर ने मुझे उत्तर दिया’; इब्रानी रूप में कर्म ‘उसे’ है, जिसका संदर्भ यहाँ स्वयं अय्यूब है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂחֹק
  choice: हँसी का पात्र
  rationale: यह संज्ञा ऐसी हँसी या उपहास को दर्शाती है जिसका निशाना कोई व्यक्ति हो; आधुनिक हिन्दी में ‘हँसी का पात्र’ इस विधेयात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְרֵעֵהוּ
  choice: अपने मित्र के लिए
  rationale: मसोराई रूप में प्रत्यय व्याकरणतः ‘उसके मित्र’ है, पर वक्ता अय्यूब स्वयं है और प्रसंग उसके साथियों द्वारा किए गए उपहास का है। हिन्दी का ‘अपने मित्र’ प्रथम पुरुष कर्ता से संबंध स्वाभाविक बनाता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֶהְיֶה
  choice: मैं ... हूँ
  rationale: रूप अपूर्णकाल का है, पर यहाँ प्रसंग में अय्यूब की वर्तमान दशा बताता है; हिन्दी वर्तमानकाल इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קֹרֵא לֶאֱלוֹהַּ
  choice: जिसने परमेश्वर को पुकारा
  rationale: कृदन्त और उसके बाद आए कथात्मक क्रियारूप को संबंधवाचक उपवाक्य के रूप में प्रस्तुत किया गया है, जिससे पुकारने और उत्तर मिलने का क्रम बना रहता है।
- source_word: וַיַּעֲנֵהוּ
  choice: और उसने उसे उत्तर दिया
  rationale: इब्रानी क्रिया में कर्म तृतीय पुरुष ‘उसे’ है और कर्ता प्रसंगतः परमेश्वर है। हिन्दी में इसी व्याकरणिक रूप को रखा गया है, यद्यपि ‘उसे’ का संदर्भ स्वयं अय्यूब है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यह बुद्धि-साहित्य में नैतिक न्यायशीलता और सही आचरण का सामान्य पद है; ‘धर्मी’ उसका स्थापित और सुबोध हिन्दी रूप है।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: अय्यूब में यह शब्द नैतिक खराई और अखंडता सूचित करता है। ‘निर्दोष’ इस दावे की गंभीरता रखता है, पर अनिवार्य रूप से पूर्ण निष्पापता का दावा नहीं करता।
theological_decisions:
- issue: क्या अय्यूब का आत्मवर्णन पूर्ण निष्पापता का दावा समझा जाए
  choice: ‘निर्दोष’ को नैतिक खराई के अर्थ में रखा गया है
  alternative: ‘सिद्ध’ या ‘पूर्णतः निष्पाप’
  rationale: תָּמִים बुद्धि-साहित्य में संपूर्णता, खराई और निष्कलंक चाल को व्यक्त करता है; यह आवश्यक रूप से निरपेक्ष पापहीनता नहीं बताता।
- issue: अंतिम पदबंध צַדִּיק תָּמִים का वाक्यगत संबंध
  choice: इसे ‘धर्मी और निर्दोष मनुष्य हँसी का पात्र है’ के रूप में स्वतंत्र सार-वाक्य बनाया गया है
  alternative: 'इसे पहले पुरुष वक्ता के साथ समानाधिकरण में जोड़ना: ‘मैं, एक धर्मी और निर्दोष मनुष्य, हँसी का पात्र हूँ’'
  rationale: इब्रानी में अंतिम पदबंध से पहले ‘के लिए’ का संबंधसूचक ל नहीं है। संक्षिप्त नामवाचक वाक्य के रूप में अनुवाद मूल शब्दक्रम और उसकी संभावित व्यापक विडंबना को सुरक्षित रखता है, जबकि अय्यूब पर उसका लागू होना प्रसंग से स्पष्ट रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘हँसी का पात्र’ उपहास का स्वाभाविक हिन्दी मुहावरा है। मूल की व्यक्ति-संबंधी अस्पष्टता और अंतिम पदबंध का संक्षिप्त, तनावपूर्ण स्वर पादटिप्पणी तथा वाक्य-विन्यास द्वारा सुरक्षित रखा गया है।
