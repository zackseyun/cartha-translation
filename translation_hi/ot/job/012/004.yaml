- from: मैं अपने मित्र के लिए हँसी का पात्र हूँ[a]—मैं, जिसने परमेश्वर को पुकारा और उसने उसे उत्तर दिया[b]। धर्मी और निर्दोष मनुष्य हँसी का पात्र है।
  to: मैं अपने मित्र की नज़र में हँसी का पात्र हूँ[a]—मैं ही वह हूँ जिसने परमेश्वर को पुकारा, और परमेश्वर ने उसे उत्तर दिया[b]। धर्मी और खरा मनुष्य हँसी का पात्र है।
  rationale: The revised text repairs the Hindi relative-clause construction, uses an idiomatic expression for being a laughingstock to/in the eyes of a friend, and explicitly names God as the subject of the second verb to avoid an avoidable Hindi pronoun ambiguity. It retains the Hebrew's third-person object (“उसे”) and its documented alternative in the footnote. The final terse statement is retained as a separate clause, preserving the source's compact and potentially broad formulation.
