  naturalness: “सलाहकारों को लुटे हुए ले जाता है” is concise, idiomatic enough in elevated poetic Hindi, and preserves the Hebrew predicative/adverbial force. “न्यायियों को मूर्ख बना देता है” is natural modern standard Hindi.
  terminology: “सलाहकारों” and “न्यायियों” appropriately render the parallel societal leaders. “मूर्ख बना देता है” suitably conveys the causative force of יְהוֹלֵל without overdetermining whether the nuance is foolishness or madness. The footnote should use grammatically natural Hindi for the alternative wording.
