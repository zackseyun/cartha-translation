base_translation:
  language: en
  yaml_path: translation/ot/job/012/017.yaml
  text: He leads counselors away stripped[a], and he makes judges foolish.
translation:
  language: hi
  text: 'वह सलाहकारों को लुटे हुए ले जाता है[a],

    और न्यायियों को मूर्ख बना देता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लूटे हुए” अथवा “सब कुछ छिन जाने की दशा में”; इब्रानी शब्द पराजय में अपमानित और वंचित करके ले जाए जाने पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: बंदी बनाकर ले जाता है
  rationale: हिफ़ील कृदन्त का कारक गति-बोध रखा गया है। प्रसंग पराजित अगुओं को अपमानित दशा में ले जाए जाने का है; इसलिए केवल ‘ले जाता है’ की अपेक्षा ‘बंदी बनाकर ले जाता है’ हिंदी में आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: יוֹעֲצִים
  choice: सलाहकारों
  rationale: यह उन लोगों के लिए प्रयुक्त बहुवचन संज्ञा है जो परामर्श देते हैं। ‘सलाहकार’ आधुनिक मानक हिंदी में सहज है और राजकीय अथवा सामाजिक संदर्भ को खुला रखता है।
- source_word: שׁוֹלָל
  choice: लुटी हुई दशा में
  rationale: शब्द पराजय में लूटे, वंचित या अपमानित किए जाने की दशा सूचित करता है। यह चयन केवल ‘नंगे पाँव’ जैसे अधिक विशिष्ट अर्थ को आरोपित किए बिना संपत्ति और प्रतिष्ठा छिन जाने का भाव रखता है।
- source_word: שֹׁפְטִים
  choice: न्यायियों
  rationale: שפט से बना शब्द सामान्यतः न्याय करने वाले व्यक्तियों को दर्शाता है। ‘न्यायी’ सीधा और गरिमापूर्ण हिंदी पर्याय है तथा इसे व्यापक रूप से शासक मान लेने से बचाता है।
- source_word: יְהוֹלֵל
  choice: मूर्ख बना देता है
  rationale: पिएल रूप का कारक अर्थ है—किसी को मूर्ख अथवा विवेकहीन कर देना। ‘मूर्ख बना देता है’ हिंदी में स्पष्ट है और समानांतर पंक्ति में अगुओं के अपमान को व्यक्त करता है।
theological_decisions:
- issue: पद का अंतर्निहित कर्ता
  choice: ‘वह’, जिसका संदर्भ परमेश्वर से है
  alternative: कर्ता को अनकहा छोड़ना
  rationale: अय्यूब 12 के निकटवर्ती संदर्भ में ये कार्य परमेश्वर के बताए गए हैं। पूर्ण और स्वाभाविक हिंदी वाक्य के लिए ‘वह’ रखा गया है, पर पद में परमेश्वर का नाम अलग से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। दोनों समानांतर पंक्तियों में सामाजिक अगुओं के अपमान का भाव सुरक्षित है और שׁוֹלָל की वास्तविक अर्थगत व्यापकता पादटिप्पणी में रखी गई है।
