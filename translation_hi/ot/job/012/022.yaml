- source_word: וַיֹּצֵא
  choice: ले आता है
  rationale: יצא का हिफ़ील रूप किसी वस्तु को बाहर आने देने या निकाल लाने का कारणवाचक भाव रखता है; ‘प्रकाश में ले आता है’ इस गति को सहज हिन्दी में व्यक्त करता है।
- source_word: לָאוֹר
  choice: प्रकाश में
  rationale: यह प्रकाश की ओर अथवा प्रकाश में लाए जाने की दिशा बताता है; हिन्दी में ‘प्रकाश में ले आता है’ स्वाभाविक है।
- source_word: צַלְמָוֶת
  choice: घोर अन्धकार
  rationale: צַלְמָוֶת प्रायः अत्यन्त गहरे, भयावह अन्धकार को दर्शाता है। ‘घोर अन्धकार’ आधुनिक हिन्दी में स्पष्ट है; पारम्परिक ‘मृत्यु की छाया’ को महत्वपूर्ण वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: צַלְמָוֶת का अर्थ
  choice: घोर अन्धकार
