- source_word: מְגַלֶּה
  choice: प्रकट करता है
  rationale: गלה का कृदन्त छिपी हुई वस्तु को खोलने या ज्ञात कराने का भाव देता है; ‘प्रकट करता है’ आधुनिक हिन्दी में दोनों अर्थों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲמֻקוֹת
  choice: गहरी बातों
  rationale: स्त्रीलिंग बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और गहरी अथवा गुप्त वस्तुओं/बातों की ओर संकेत करता है। ‘गहरी बातों’ बहुवचन और रूपकात्मक अर्थ को बनाए रखता है।
- source_word: מִנִּי חֹשֶׁךְ
  choice: अन्धकार में छिपी
