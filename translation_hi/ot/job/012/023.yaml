base_translation:
  language: en
  yaml_path: translation/ot/job/012/023.yaml
  text: He makes nations great[a], and he destroys them; he enlarges nations, and he leads them away.
translation:
  language: hi
  text: 'वह राष्ट्रों को महान बनाता है[a] और उनका नाश कर देता है;

    वह राष्ट्रों का विस्तार करता है और उन्हें दूर ले जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह राष्ट्रों को बढ़ाता है और उनका मार्गदर्शन करता है।” इब्रानी क्रियाओं का अर्थ विस्तार के बाद मार्गदर्शन भी हो सकता है; मुख्य पाठ संदर्भ में संभावित उलटाव वाली समानांतरता को दर्शाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַשְׂגִּיא
  choice: महान बनाता है
  rationale: हिफ़इल कृदंत का कारक अर्थ ‘महान करना’ या ‘बढ़ाना’ है। ‘महान बनाता है’ इस अर्थ को स्वाभाविक ढंग से बनाए रखता है और समृद्धि का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: לַגּוֹיִם
  choice: राष्ट्रों को
  rationale: यहाँ גּוֹיִם राजनीतिक जनसमुदायों या राष्ट्रों के लिए व्यापक रूप से प्रयुक्त है; इसका आशय विशेष रूप से गैर-इस्राएली लोगों से नहीं है।
- source_word: וַיְאַבְּדֵם
  choice: उनका नाश कर देता है
  rationale: अर्थ है उन्हें नष्ट करना या मिटा देना। यह पहले राष्ट्रों को महान बनाने के विपरीत कार्य को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: שֹׁטֵחַ
  choice: राष्ट्रों का विस्तार करता है
  rationale: मूल क्रिया फैलाने या विस्तृत करने का चित्र प्रस्तुत करती है। राष्ट्रों के संदर्भ में ‘विस्तार करता है’ उनके भूभाग या प्रभाव के बढ़ने का स्वाभाविक संकेत देता है।
- source_word: וַיַּנְחֵם
  choice: उन्हें दूर ले जाता है
  rationale: נחה का सामान्य अर्थ ‘ले चलना’ या ‘मार्गदर्शन करना’ है। यहाँ विनाश और विस्तार के उलटाव वाले समानांतर कथन में ‘दूर ले जाता है’ गति तथा संभावित निष्कासन—दोनों को व्यक्त करता है, फिर भी क्रिया के मूल ‘ले चलने’ के भाव को बनाए रखता है।
theological_decisions:
- issue: दूसरे अर्ध-पद में राष्ट्रों की गति का अर्थ
  choice: परमेश्वर राष्ट्रों का विस्तार करता है और फिर उन्हें दूर ले जाता है।
  alternative: वह राष्ट्रों को बढ़ाता है और उनका मार्गदर्शन करता है।
  rationale: संदर्भ राष्ट्रों के उत्थान और पतन पर परमेश्वर की प्रभुता पर बल देता है। נחה का अर्थ सकारात्मक ‘मार्गदर्शन करना’ भी हो सकता है, पर विनाश के साथ काव्यात्मक समानांतरता उलटाव या हटाए जाने का संकेत दे सकती है। मुख्य पाठ इस संभावित उलटाव को दर्शाता है, जबकि पादटिप्पणी वास्तविक भाषाई अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। दोनों अर्ध-पदों की समानांतर संरचना बनाए रखी गई है। ‘उनका नाश’ हिन्दी में स्वाभाविक है, जबकि ‘दूर ले जाता है’ मूल क्रिया की अस्पष्टता को पूरी तरह समाप्त किए बिना संदर्भगत उलटाव व्यक्त करता है।
