  rationale: यहाँ शब्द विवेकपूर्ण समझ या अंतर्दृष्टि का बोध कराता है। ‘समझ’ साधारण पाठक के लिए सहज है और ‘बुद्धि’ से निकट होते हुए भी अलग अर्थ-छाया रखता है।
