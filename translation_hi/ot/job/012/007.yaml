  yaml_path: translation/ot/job/012/007.yaml
  text: But ask the animals[a], please, and they will teach you, and the birds of the heavens, and they will tell you.
translation:
  language: hi
  text: परन्तु पशुओं से पूछो न, वे तुम्हें सिखाएँगे; और आकाश के पक्षी तुम्हें बताएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह अय्यूब की बात में विरोधसूचक मोड़ लाता है; ‘परन्तु’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: שְׁאַל נָא
  choice: से ही पूछो
  rationale: שְׁאַל आज्ञार्थक ‘पूछो’ है और נָא आग्रह या बल जोड़ता है। हिन्दी में ‘ही’ यहाँ ‘ज़रा/कृपया’ की अपेक्षा चुनौतीपूर्ण संदर्भ का बल अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְהֵמוֹת
  choice: पशुओं
  rationale: यहाँ शब्द केवल पालतू मवेशियों के लिए नहीं, व्यापक रूप से स्थल-जीवों के लिए है; ‘पशु’ काव्यात्मक समानांतरता में सहज है।
- source_word: וְתֹרֶךָּ
  choice: वे तुम्हें सिखाएँगे
  rationale: हिफ़िल रूप का अर्थ ‘सिखाना/शिक्षा देना’ है। इब्रानी में सामूहिक संज्ञा के अनुसार क्रिया स्त्रीलिंग एकवचन है, पर हिन्दी में ‘पशुओं’ के साथ बहुवचन क्रिया स्वाभाविक है।
- source_word: וְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: עוֹף यहाँ उड़ने वाले प्राणियों, विशेषतः पक्षियों, को सूचित करता है; הַשָּׁמַיִם का स्वाभाविक आधुनिक हिन्दी रूप ‘आकाश’ है।
- source_word: וְיַגֶּד לָךְ
  choice: वे तुम्हें बताएँगे
  rationale: हिफ़िल में נגד का अर्थ ‘बताना/प्रकट करना’ है। सामूहिक विषय ‘पक्षियों’ के लिए हिन्दी में बहुवचन ‘वे ... बताएँगे’ सहज है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। दोनों समानांतर खंडों में ‘से पूछो’ दोहराकर हिन्दी वाक्य को स्वाभाविक बनाया गया है; स्रोत में दूसरे खंड की आज्ञा लुप्त होकर पहले खंड से समझी जाती है।
