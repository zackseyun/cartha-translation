  rationale: The revision removes the added second imperative and renders the source's elliptical parallelism directly. It also replaces exclusive-sounding ‘ही’ with Hindi sentence particle ‘न,’ which more suitably reflects the urging nuance of נא while maintaining the verse's poetic, rhetorical register.
