review_pass:
  verdict: revise
  source_fidelity: The draft accurately renders the animals, their teaching, and the birds' telling. However, it introduces a second explicit imperative (‘पक्षियों से पूछो’) where the Hebrew second clause consists only of ‘and the birds of the heavens, and they will tell you’; the asking is understood by parallelism but not repeated. ‘ही’ in ‘से ही पूछो’ conveys exclusivity/emphasis rather than the entreating or urging force of נא.
  naturalness: The revised wording is natural modern Hindi, preserves the compact poetic parallelism, and avoids an unnecessarily repeated verb.
  terminology: ‘पशु,’ ‘सिखाएँगे,’ ‘आकाश के पक्षी,’ and ‘बताएँगे’ are clear and appropriate. ‘आकाश’ is a natural Hindi rendering of Hebrew ‘heavens’ in this poetic expression.
  issues:
  - severity: medium
    issue: The second clause adds ‘पक्षियों से पूछो.’
    rationale: 'The source has no second imperative. Hindi can retain the Hebrew''s ellipsis without loss of clarity: ‘और आकाश के पक्षी तुम्हें बताएँगे।’'
  - severity: low
    issue: ‘से ही पूछो’ does not best represent נא.
    rationale: ‘ही’ normally marks restriction or emphatic focus (‘ask the animals themselves/only’), while נא is a particle of request or urging. ‘पूछो न’ more closely and naturally carries the pragmatic force.
  revised_text: परन्तु पशुओं से पूछो न, वे तुम्हें सिखाएँगे; और आकाश के पक्षी तुम्हें बताएँगे।
  revised_footnotes: []
