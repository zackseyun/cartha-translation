base_translation:
  language: en
  yaml_path: translation/ot/job/012/016.yaml
  text: With him are strength and sound wisdom[a]; the one who goes astray and the one who leads astray belong to him.
translation:
  language: hi
  text: उसके पास सामर्थ्य और खरी बुद्धि है; भटकनेवाला और भटकानेवाला[a] उसी के हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धोखा खानेवाला और धोखा देनेवाला।’ इब्रानी कृदंतों को प्रसंग में इस तरह भी समझा जा सकता है; मुख्य पाठ एक के भटकने और दूसरे के भटकाने के व्याकरणिक अंतर को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עִמּוֹ
  choice: उसके पास
  rationale: यह संबंध और अधिकार का इब्रानी मुहावरा है। ‘उसके पास’ स्वाभाविक हिन्दी में बताता है कि सामर्थ्य और बुद्धि परमेश्वर के हैं और उसके वश में हैं।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति या पराक्रम को दर्शाता है; ‘सामर्थ्य’ यहाँ गरिमापूर्ण और स्वाभाविक है।
- source_word: תּוּשִׁיָּה
  choice: खरी बुद्धि
  rationale: ज्ञान-साहित्य में यह प्रभावी, ठोस और सही विवेकयुक्त बुद्धि को व्यक्त करता है। ‘खरी बुद्धि’ केवल सामान्य ज्ञान से अधिक व्यापक भाव को संक्षेप में रखती है।
- source_word: לוֹ
  choice: उसी के हैं
  rationale: לֹו यहाँ संबंध या स्वामित्व दर्शाता है। यह अनुवाद दोनों व्यक्तियों पर परमेश्वर के अधिकार के प्रबल कथन को बनाए रखता है, पर नैतिक कारणता नहीं जोड़ता।
- source_word: שֹׁגֵג
  choice: भटकनेवाला
  rationale: शगा धातु का Qal कृदंत भूल करने, भटकने या मार्ग से चूकनेवाले को दर्शाता है। यह रूप कर्मवाच्य अर्थ को अनिवार्य नहीं बनाता।
- source_word: מַשְׁגֶּה
  choice: भटकानेवाला
  rationale: उसी धातु-समूह का Hiphil कृदंत किसी दूसरे को भटकाने या गलती करवानेवाले को दर्शाता है। इससे पहले कृदंत के साथ कारणात्मक विरोध स्पष्ट रहता है।
theological_decisions:
- issue: भटकनेवाले और भटकानेवाले से परमेश्वर का संबंध
  choice: ‘उसी के हैं’—दोनों परमेश्वर के अधिकार-क्षेत्र में हैं, पर उनके भटकाव का नैतिक कारण स्पष्ट नहीं किया गया।
  alternative: ‘दोनों उसी के अधीन हैं’ अथवा ‘परमेश्वर दोनों को नियंत्रित करता है।’
  rationale: इब्रानी कथन संबंध या स्वामित्व का प्रबल दावा करता है, किंतु यह साफ़ नहीं कहता कि परमेश्वर छल या भूल का प्रत्यक्ष नैतिक कर्ता है। ‘उसी के हैं’ इस धर्मवैज्ञानिक तनाव और मूल की संक्षिप्त अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण वाक्य रखा गया है। ‘भटकनेवाला/भटकानेवाला’ की समानांतर रचना इब्रानी Qal/Hiphil विरोध को सामान्य पाठक के लिए स्पष्ट करती है।
