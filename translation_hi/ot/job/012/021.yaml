base_translation:
  language: en
  yaml_path: translation/ot/job/012/021.yaml
  text: He pours contempt on nobles[b][a], and loosens the belt of the strong.
translation:
  language: hi
  text: 'वह कुलीनों पर तिरस्कार उंडेलता है,

    और शक्तिशाली लोगों[a] का कमरबंद ढीला कर देता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बलवानों” अथवा “सामर्थी लोगों।”
    reason: lexical_alternative
  - marker: b
    text: कमरबंद ढीला करने का यह बिंब शक्ति, तत्परता या अधिकार छीन लिए जाने का संकेत दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: שׁוֹפֵךְ
  choice: उंडेलता है
  rationale: यह क्रिया मूल के ‘उंडेलने’ के सजीव रूपक को बनाए रखती है और ‘तिरस्कार’ के साथ स्वाभाविक हिंदी प्रयोग बनाती है।
- source_word: בּוּז
  choice: तिरस्कार
  rationale: यह सार्वजनिक अवमानना और हेय दृष्टि के अर्थ को स्पष्ट तथा गरिमापूर्ण आधुनिक हिंदी में व्यक्त करता है।
- source_word: נְדִיבִים
  choice: कुलीनों
  rationale: इस संदर्भ में शब्द ऊँची सामाजिक हैसियत वाले प्रतिष्ठित लोगों या प्रधानों की ओर संकेत करता है। ‘कुलीनों’ से यह भाव बना रहता है, जबकि ‘राजकुमारों’ से राजतंत्र का अनावश्यक विशिष्ट अर्थ जुड़ सकता है।
- source_word: מְזִיחַ
  choice: कमरबंद
  rationale: यह कमर पर बाँधे जाने वाले पट्टे का ठोस बिंब सुरक्षित रखता है; आधुनिक हिंदी में ‘कमरबंद’ स्पष्ट है।
- source_word: אֲפִיקִים
  choice: शक्तिशाली लोगों
  rationale: यहाँ समानांतर पंक्ति में शब्द प्रभावशाली या बलवान व्यक्तियों को सूचित करता है। ‘शक्तिशाली लोगों’ से व्यापक अर्थ बना रहता है।
- source_word: רִפָּה
  choice: ढीला कर देता है
  rationale: मूल क्रिया का अर्थ ढीला करना या शिथिल कर देना है। यह अनुवाद कमरबंद के बिंब को स्वाभाविक हिंदी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर द्वारा मानवीय प्रतिष्ठा और शक्ति उलट दिए जाने का रूपक
  choice: ‘शक्तिशाली लोगों का कमरबंद ढीला कर देता है’ के ठोस बिंब को मुख्य पाठ में रखा गया है।
  alternative: ‘शक्तिशालियों को निःशक्त कर देता है’ या ‘वीरों को निःशस्त्र कर देता है।’
  rationale: मूल पाठ शक्ति, तत्परता या अधिकार छीनने की बात को कमरबंद ढीला करने के बिंब से कहता है। इसे केवल सैन्य निरस्त्रीकरण मानना अर्थ को अनावश्यक रूप से सीमित कर देगा।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘उंडेलता है’ और ‘कमरबंद ढीला कर देता है’ मूल के दोनों ठोस रूपकों को सुरक्षित रखते हैं।
