  text: A torch is despised in the thought of one who is at ease; it is ready for those whose foot slips.
translation:
  language: hi
  text: निश्चिंत व्यक्ति के विचार में मशाल तुच्छ है; वह फिसलते पाँव वालों के लिए तैयार है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַפִּיד
  choice: मशाल
  rationale: यह शब्द सामान्यतः जलती हुई मशाल या आग की लौ को दर्शाता है; यहाँ सुरक्षा में बैठे व्यक्ति और फिसलते पैर वाले व्यक्ति के बीच रूपकात्मक विरोध बनाए रखता है।
- source_word: בּוּז
  choice: तुच्छ होती है
  rationale: इसे संज्ञात्मक ‘तिरस्कार’ के बजाय स्वाभाविक हिन्दी विधेय के रूप में प्रस्तुत किया गया है, बिना अर्थ को केवल मानसिक उपेक्षा तक सीमित किए।
- source_word: לְעַשְׁתּוּת שַׁאֲנָן
  choice: निश्चिंत व्यक्ति के विचार में
  rationale: עַשְׁתּוּת का दुर्लभ अर्थ ‘विचार/सोच’ और שַׁאֲנָן का अर्थ सुरक्षित, बेफिक्र या निश्चिंत व्यक्ति है। हिन्दी में ‘निश्चिंत व्यक्ति’ संदर्भानुकूल और सहज है।
- source_word: נָכוֹן
  choice: तैयार रहती है
  rationale: शब्द का अर्थ तैयार, स्थिर या नियत हो सकता है। ‘तैयार’ मूल वाक्य की विडंबना और अगले खंड से संबंध को सुरक्षित रखता है।
- source_word: לְמוֹעֲדֵי רָגֶל
  choice: उनके लिए ... जिनका पैर फिसलता है
  rationale: मुहावरे का आशय पैर डगमगाने या फिसलने वालों से है। एकवचन ‘पैर’ हिब्रू רָגֶל के रूप और सामूहिक संदर्भ दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: मशाल और फिसलते पैर के बीच संबंध
  choice: सर्वनाम ‘वह’ को मशाल से जोड़ते हुए कथन की रूपकात्मक विडंबना बनाए रखी गई
  alternative: दूसरे खंड को तिरस्कार या विपत्ति के लिए तैयार होने के अर्थ में समझना
  rationale: हिब्रू व्याकरण संक्षिप्त और काव्यात्मक है। निकटतम स्त्रीलिंग संज्ञा के रूप में ‘मशाल’ से संबंध संभव है; किसी विशिष्ट धर्मशास्त्रीय निष्कर्ष को जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। कठिन हिब्रू वाक्य-विन्यास को पूरी तरह समझाकर सपाट नहीं किया गया, ताकि मूल की रूपकात्मकता और हल्की अस्पष्टता बनी रहे।
