    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם לִי לֵבָב
  choice: मेरे पास भी ... समझ है
  rationale: लֵבָב का शाब्दिक अर्थ ‘हृदय’ है, पर यहाँ यह सोचने-समझने की क्षमता को दर्शाता है। आधुनिक हिन्दी में ‘समझ’ प्रसंग का आशय स्वाभाविक रूप से व्यक्त करती है।
- source_word: כְּמוֹכֶם
  choice: तुम्हारे समान
  rationale: यह अय्यूब और उसके वार्ताकारों की बौद्धिक क्षमता की तुलना व्यक्त करता है; ‘तुम्हारे समान’ स्पष्ट और गरिमापूर्ण है।
- source_word: לֹא נֹפֵל אָנֹכִי מִכֶּם
  choice: मैं तुमसे किसी बात में कम नहीं हूँ
  rationale: נפל מן का मुहावरा किसी से नीचे या हीन होने का भाव देता है। यह हिन्दी रूप तुलना को सहजता से व्यक्त करता है।
- source_word: וְאֶת מִי אֵין כְּמוֹ אֵלֶּה
  choice: और इन बातों को कौन नहीं जानता?
  rationale: मूल वाक्यांश संक्षिप्त और मुहावरेदार है। प्रसंग में यह आलंकारिक प्रश्न मित्रों की कही बातों को सामान्य ज्ञान बताता है।
