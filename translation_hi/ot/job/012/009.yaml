  yaml_path: translation/ot/job/012/009.yaml
  text: Who among all these does not know that the hand of Yahweh has done this?[a]
translation:
  language: hi
  text: इन सब में कौन नहीं जानता कि यहोवा के हाथ ने यह किया है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: ‘YHWH’ (יהוה); परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: मूल ईश्वरीय नाम और पारंपरिक वैकल्पिक प्रस्तुति को स्पष्ट करना।
lexical_decisions:
- source_word: מִי לֹא יָדַע בְּ/כָל אֵלֶּה
  choice: इन सब में कौन नहीं जानता
  rationale: इब्रानी प्रश्न आलंकारिक है। בְּכָל אֵלֶּה को प्रसंग में समूह के भीतर ‘इन सब में’ समझना स्वाभाविक है; सामान्य रूप से मान्य पहचान के लिए हिन्दी वर्तमान काल उपयुक्त है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי ज्ञात बात की विषय-वस्तु प्रस्तुत करता है, कारण नहीं।
- source_word: יַד
  choice: हाथ
  rationale: ‘हाथ’ को शाब्दिक रूप से रखा गया है; यह कर्तृत्व और सामर्थ्य का परिचित बाइबलीय रूपक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के चतुराक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, शीर्षक ‘प्रभु’ से नहीं।
- source_word: עָשְׂתָה זֹּאת
  choice: यह ... किया है
  rationale: עשה का व्यापक अर्थ ‘करना/बनाना’ है। एकवचन संकेतवाचक זֹאת के अनुरूप ‘यह’ और पूर्ण क्रिया के स्वाभाविक हिन्दी प्रतिरूप के रूप में ‘किया है’ चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम है। ‘यहोवा’ हिन्दी पाठकों के लिए उसका स्थापित लिप्यंतरण है; पाद-टिप्पणी मूल अक्षरों और पारंपरिक प्रतिस्थापन को स्पष्ट करती है।
- issue: ‘यहोवा के हाथ’ की मानवाकार भाषा
  choice: रूपक को यथावत रखना
  alternative: यहोवा की शक्ति
  rationale: ‘हाथ’ मूल की सजीव भाषा तथा कर्तृत्व और सामर्थ्य—दोनों अर्थों को सुरक्षित रखता है; इसे केवल ‘शक्ति’ कहना अर्थ को संकुचित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक आलंकारिक प्रश्न। मूल की ‘हाथ’ वाली रूपकात्मक भाषा और ‘यह’ का एकवचन बनाए रखा गया है।
