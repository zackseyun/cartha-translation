  text: No doubt you are the people[a], and wisdom will die with you.
translation:
  language: hi
  text: निस्संदेह, तुम ही लोग हो, और तुम्हारे साथ बुद्धि मर जाएगी!
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אָמְנָם כִּי
  choice: निस्संदेह
  rationale: दोनों पद मिलकर कथन को बल देते हैं। संदर्भ में यह अय्यूब की व्यंग्यपूर्ण स्वीकृति है; ‘निस्संदेह’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַתֶּם
  choice: तुम
  rationale: यह पुल्लिंग बहुवचन सर्वनाम है और अय्यूब के मित्रों को सीधे संबोधित करता है। हिन्दी में ‘तुम’ बहुवचन संबोधन के लिए स्वाभाविक है।
- source_word: עָם
  choice: वे लोग
  rationale: शाब्दिक अर्थ ‘लोग/जन’ है। ‘तुम ही वे लोग हो’ उस व्यंग्यपूर्ण भाव को सुरक्षित रखता है कि मानो वे ही गिने जाने योग्य समस्त लोग अथवा ज्ञान के एकमात्र अधिकारी हों।
- source_word: וְעִמָּכֶם
  choice: और तुम्हारे साथ
  rationale: यह साथ या संगति बताने वाला सीधा पूर्वसर्गीय वाक्यांश है; आगे ‘बुद्धि मर जाएगी’ से जुड़कर मित्रों के दावे पर कटाक्ष करता है।
- source_word: תָּמוּת
  choice: मर जाएगी
  rationale: यह מות धातु का स्त्रीलिंग एकवचन रूप है और ‘बुद्धि’ से मेल खाता है। ‘मर जाएगी’ मूल रूपक की तीक्ष्णता को बनाए रखता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: חָכְמָה का सामान्य हिन्दी समतुल्य ‘बुद्धि’ है; यहाँ आशय उस विवेक या ज्ञान से है जिस पर मित्र मानो अपना एकाधिकार समझते हैं।
