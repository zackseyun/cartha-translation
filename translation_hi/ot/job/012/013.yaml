base_translation:
  language: en
  yaml_path: translation/ot/job/012/013.yaml
  text: With him are wisdom and might[a]; to him belong counsel and understanding.
translation:
  language: hi
  text: 'बुद्धि और सामर्थ्य उसके पास[a] हैं;

    परामर्श और समझ उसी के हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसमें बुद्धि और सामर्थ्य हैं।”
    reason: עִמּוֹ मुख्यतः “उसके साथ/उसके पास” का भाव देता है, पर काव्यात्मक संदर्भ में गुणों के उसमें निहित होने का अनुवाद भी संभव है।
lexical_decisions:
- source_word: עִמּוֹ
  choice: उसके पास
  rationale: עִם के साथ सर्वनाम-प्रत्यय यहाँ साथ होने या अधिकार में होने का भाव देता है। आधुनिक हिन्दी में “उसके पास” इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: यह חָכְמָה का सामान्य और प्रसंगानुकूल हिन्दी रूप है, जो विवेकपूर्ण ज्ञान को व्यक्त करता है।
- source_word: וּגְבוּרָה
  choice: और सामर्थ्य
  rationale: גְבוּרָה शक्ति, बल या सामर्थ्य को दर्शाता है। “सामर्थ्य” काव्यात्मक गरिमा बनाए रखते हुए अर्थ को व्यापक रखता है।
- source_word: לוֹ
  choice: उसी के हैं
  rationale: לְ के साथ सर्वनाम यहाँ अधिकार व्यक्त करता है। “उसी के हैं” इस अधिकार पर पड़े हिब्रू बल को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: עֵצָה
  choice: परामर्श
  rationale: עֵצָה यहाँ विवेकपूर्ण योजना या सम्मति का भाव देता है; “परामर्श” अगले शब्द “समझ” के साथ उपयुक्त काव्यात्मक जोड़ी बनाता है।
- source_word: וּתְבוּנָה
  choice: और समझ
  rationale: תְבוּנָה सूझ-बूझ, विवेक या समझ को दर्शाता है। “समझ” साधारण पाठकों के लिए स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: सर्वनामों का अभिप्राय
  choice: मूल पाठ की तरह “उसके/उसी के” रखा गया है; संदर्भ इसका संकेत परमेश्वर की ओर करता है।
  alternative: अनुवाद में सीधे “परमेश्वर के पास” और “परमेश्वर के ही हैं” कहना।
  rationale: पिछला संदर्भ सर्वनाम का अभिप्राय स्पष्ट करता है, पर मूल पद स्वयं नाम नहीं दोहराता। सर्वनाम बनाए रखने से पाठ के निकटता और संदर्भगत पहचान दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो समानांतर पंक्तियाँ हिब्रू काव्य की संतुलित संरचना को प्रतिबिंबित करती हैं।
