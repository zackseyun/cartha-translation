  yaml_path: translation/ot/job/012/018.yaml
  text: He loosens the bonds of kings and binds a belt around their waists[a][b].
translation:
  language: hi
  text: 'वह राजाओं के बन्धन खोल देता है[a]

    और उनकी कमर में कमरबन्द बाँध देता है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह राजाओं का अनुशासन हटा देता है।” इब्रानी संज्ञा का अर्थ “अनुशासन” या “बन्धन” हो सकता है; यहाँ “बन्धन” अगले खंड के “बाँध देता है” के साथ बेहतर समानांतर बनाता है।
    reason: lexical_alternative
  - marker: b
    text: 'यह चित्र अपमान या अधीनता का संकेत दे सकता है: परमेश्वर राजाओं की शक्ति छीनकर उन्हें साधारण मनुष्यों या बन्दियों की तरह बाँध देता है। पर यह उन्हें किसी काम के लिए कमर कसाने का चित्र भी हो सकता है।'
    reason: cultural_note
lexical_decisions:
- source_word: מוּסַר
  choice: बन्धन
  rationale: इस संज्ञा का अर्थ ‘अनुशासन/ताड़ना’ या ‘बन्धन’ हो सकता है। यहाँ פִּתֵּחַ (‘खोलता है’) और अगले खंड के ‘बाँधता है’ के साथ ठोस अर्थ ‘बन्धन’ समानांतरता को सबसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: פִּתֵּחַ
  choice: खोल देता है
  rationale: क्रिया का मूल अर्थ ‘खोलना’ है और बन्धन के साथ इसका अर्थ उन्हें खोलना या ढीला करना है। ‘खोल देता है’ भौतिक रूपक को बनाए रखते हुए सहज हिन्दी है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: इब्रानी शब्द का सामान्य और सीधा अर्थ ‘राजा’ है; इसे व्यापक ‘शासक’ बनाना आवश्यक नहीं।
- source_word: וַיֶּאְסֹר
  choice: बाँध देता है
  rationale: क्रिया का अर्थ ‘बाँधना’ है। यह पहले खंड के ‘खोल देता है’ के साथ जानबूझकर रखे गए विरोध को सुरक्षित रखती है।
- source_word: אֵזוֹר
  choice: पट्टा
  rationale: यह कमर में पहने या बाँधे जाने वाले पट्टे/कमरबन्द को दर्शाता है। ‘पट्टा’ बन्धन और कमर पर बाँधे जाने की छवि दोनों को तटस्थ रूप से बनाए रखता है, बिना यह तय किए कि वह सामान्य पेटी, सेवक का वस्त्र या कैदी का बन्धन है।
- source_word: בְּמָתְנֵיהֶם
  choice: उनकी कमर पर
  rationale: यह वाक्यांश कमर/कटि के क्षेत्र को बताता है। ‘उनकी कमर पर’ आधुनिक, स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: राजाओं की स्थिति उलटने वाली छवि का अर्थ
  choice: मुख्य पाठ में ‘बन्धन खोलने’ और ‘कमर पर पट्टा बाँधने’ की ठोस, विरोधी छवियाँ रखी गई हैं; यह परमेश्वर द्वारा राजाओं की दशा पलटने की ओर संकेत कर सकती है।
  alternative: पहला खंड राजाओं को मुक्त करने और दूसरा उन्हें कार्य के लिए कमर कसाने का चित्र हो सकता है; अथवा परमेश्वर राजकीय अधिकार खोलकर स्वयं राजाओं को अधीन करता है।
  rationale: इब्रानी कथन संक्षिप्त और रूपकात्मक है। खोलने और बाँधने की जोड़ी उलटाव दिखाती है, पर उसका ठीक सामाजिक या धार्मिक आशय स्पष्ट नहीं करती; इसलिए अनुवाद उसे व्याख्यात्मक भावार्थ में सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज काव्यात्मक गद्य। दो पंक्तियों में इब्रानी समानांतरता और ‘खोलना/बाँधना’ का विरोध सुरक्षित रखा गया है। ‘बन्धन’ और ‘पट्टा’ ठोस छवि बनाए रखते हैं; संभावित अर्थों को पादटिप्पणियों में खुला रखा गया है।
