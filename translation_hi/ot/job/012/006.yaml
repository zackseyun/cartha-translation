  edition: WLC
  text: יִשְׁלָ֤יוּ אֹֽהָלִ֨ים לְ/שֹׁ֥דְדִ֗ים וּֽ֭/בַטֻּחוֹת לְ/מַרְגִּ֣יזֵי אֵ֑ל לַ/אֲשֶׁ֤ר הֵבִ֖יא אֱל֣וֹהַּ בְּ/יָדֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/012/006.yaml
  text: The tents of destroyers are at ease[a], and those who provoke God are secure—those whose god brings into their hand.
translation:
  language: hi
  text: 'लुटेरों के तम्बू चैन से रहते हैं,

    और परमेश्वर को क्रोधित करनेवाले सुरक्षित रहते हैं—

    वे जो अपने देवता को अपने हाथ में ले आते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम उपवाक्य का इब्रानी पाठ कठिन है। शाब्दिक रूप से इसका अर्थ है, “जो देवता को अपने हाथ में ले आता है।” इसका अनुवाद यह भी हो सकता है: “जिन्हें परमेश्वर अपने हाथ में लाता है,” या “जिनके हाथ में परमेश्वर [कुछ] देता है।” सम्भव है कि यहाँ सच्चे परमेश्वर के विधान की बात हो; अथवा व्यंग्यपूर्वक ऐसे देवता की, जो दुष्ट मनुष्य के अपने हाथ या वश में है।'
    reason: alternative_reading
lexical_decisions:
- source_word: יִשְׁלָיוּ
  choice: चैन से रहते हैं
  rationale: क्रिया שלה यहाँ शान्त, निश्चिन्त अवस्था बताती है; यह केवल भौतिक समृद्धि तक सीमित नहीं है और पद के नैतिक विरोधाभास को बनाए रखती है।
- source_word: אֹהָלִים
  choice: तम्बू
  rationale: मूल का ठोस बिम्ब रखा गया है; काव्य में यह घराने या निवास का भी संकेत दे सकता है।
- source_word: לְשֹׁדְדִים
  choice: लुटेरों के
  rationale: שׁדד हिंसक लूटने या उजाड़नेवालों को दर्शाता है। हिन्दी में ‘लुटेरे’ इस अर्थ को सहज और स्पष्ट रूप से व्यक्त करता है।
- source_word: וּבַטֻּחוֹת
  choice: सुरक्षित रहते हैं
  rationale: בטח से निकला यह रूप पहले चरण के ‘चैन से’ के समानान्तर सुरक्षा और बेखटके रहने की दशा व्यक्त करता है।
- source_word: לְמַרְגִּיזֵי אֵל
  choice: परमेश्वर को क्रोधित करनेवाले
  rationale: רגז का हिफ़ील कृदन्त यहाँ परमेश्वर को उकसाने अथवा क्रोधित करने का कारण बनने के अर्थ में है। ‘क्रोधित करनेवाले’ सामान्य हिन्दी में स्पष्ट है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל सच्चे परमेश्वर के सामान्य ईश्वरीय नाम के रूप में प्रयुक्त है।
- source_word: לַאֲשֶׁר הֵבִיא אֱלוֹהַּ בְּיָדוֹ
  choice: वे, जो अपने देवता को अपने हाथ में रखते हैं
  rationale: अन्तिम उपवाक्य अत्यन्त कठिन है। यह रूप אֱלוֹהַּ को दुष्ट के वश में या हाथ में रखे ‘देवता’ के रूप में समझता है और הֵבִיא के ‘लाना’ भाव को हिन्दी के स्वाभाविक परिणामी ‘रखते हैं’ से व्यक्त करता है। अन्य सम्भव व्याकरणिक विन्यास पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: अन्तिम उपवाक्य में אֱלוֹהַּ का आशय और वाक्यगत भूमिका
  choice: दुष्ट के हाथ में स्थित ‘देवता’—अर्थात् जिस पर उसका अपना अधिकार है
  alternative: ‘जिन्हें परमेश्वर अपने हाथ में लाता है,’ अथवा ‘जिनके हाथ में परमेश्वर [कुछ] देता है’
  rationale: इब्रानी वाक्य-विन्यास संक्षिप्त और विवादित है। मुख्य पाठ विडम्बनापूर्ण अर्थ रखता है कि दुष्ट ऐसा देवता मानता है जो उसके अपने हाथ या वश में है; पर सच्चे परमेश्वर को कर्ता माननेवाले पाठ भी व्याकरणतः सम्भव हैं, इसलिए उन्हें दबाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण काव्यात्मक गद्य-पद्य मिश्रित रूप अपनाया गया है। समानान्तर पंक्तियाँ अय्यूब की कविता का संतुलन बनाए रखती हैं। ‘तम्बू’, ‘लुटेरे’, ‘चैन’ और ‘सुरक्षित’ सामान्य पाठकों के लिए स्वाभाविक हैं; कठिन अन्तिम उपवाक्य की वास्तविक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
