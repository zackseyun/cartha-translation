  yaml_path: translation/ot/job/012/019.yaml
  text: He leads priests away stripped[b][a], and he overthrows the mighty.
translation:
  language: hi
  text: वह याजकों को लुटी हुई दशा में दूर ले जाता है[a], और शक्तिशालियों को उलट देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह याजकों को लुटे हुए” अथवा “उजाड़े हुए” लोगों के रूप में दूर ले जाता है।
    reason: lexical_alternative
  - marker: b
    text: “शक्तिशालियों” का अर्थ “दृढ़ रहने वाले” या वे लोग भी हो सकता है जिन्हें स्थायी रूप से स्थापित समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹלִיךְ
  choice: ले जाता है
  rationale: הלך के हिफ़ील कृदंत का अर्थ किसी को चलाना या ले जाना है। प्रसंग में निहित कर्ता परमेश्वर है और यहाँ अपमानित करके दूर ले जाने का भाव है; फिर भी मूल में ‘बंदी’ स्पष्ट न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: כֹּהֲנִים
  choice: याजकों
  rationale: यह כהנים का सीधा और प्रचलित हिन्दी अर्थ है तथा धार्मिक-सामाजिक प्रतिष्ठा रखने वाले वर्ग को सूचित करता है।
- source_word: שׁוֹלָל
  choice: लुटे हुए लोगों की तरह
  rationale: שלל से बना यह रूप लूटे जाने, संपत्ति और सम्मान से वंचित होने की दशा बताता है। उपमात्मक हिन्दी वाक्यांश उस व्यक्ति-वाचक एकवचन रूप को स्वाभाविक ढंग से व्यक्त करता है जो बहुवचन ‘याजकों’ की अवस्था बताता है।
- source_word: אֵתָנִים
  choice: सामर्थियों
  rationale: איתן में शक्ति, दृढ़ता और स्थायित्व के अर्थ समाए हैं। प्रतिष्ठित शक्तिशाली लोगों के समानांतर उल्लेख में ‘सामर्थियों’ स्वाभाविक है, जबकि दृढ़ या स्थायी रूप से स्थापित लोगों का अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְסַלֵּף
  choice: उलट देता है
  rationale: סלף के पिएल रूप में मरोड़ने, विकृत करने या व्यवस्था को पलट देने का भाव है। यहाँ दृढ़ समझे जाने वाले लोगों को नीचे लाने के प्रसंग में ‘उलट देता है’ परिणाम और काव्यात्मक बल दोनों व्यक्त करता है।
theological_decisions:
- issue: अय्यूब 12 के प्रसंग में निहित कर्ता
  choice: एकवचन ‘वह’ रखा गया, जो प्रसंग में परमेश्वर की ओर संकेत करता है
  alternative: स्पष्टता के लिए ‘परमेश्वर’ नाम जोड़ना
  rationale: आस-पास की पंक्तियों में एक ही ईश्वरीय कर्ता के कार्य क्रमशः बताए गए हैं। ‘वह’ रखने से इब्रानी काव्य का प्रवाह बना रहता है और पाठ में ऐसा नाम नहीं जोड़ा जाता जो इस पद में प्रत्यक्षतः नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘याजक’ और ‘सामर्थी’ सामान्य बाइबलीय शब्दावली से मेल खाते हैं; दोनों इब्रानी शब्दों की वास्तविक अर्थ-व्याप्ति पादटिप्पणियों में सुरक्षित है।
