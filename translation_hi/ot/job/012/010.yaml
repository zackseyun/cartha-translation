base_translation:
  language: en
  yaml_path: translation/ot/job/012/010.yaml
  text: In whose hand is the life of every living thing[a], and the breath of all mankind.
translation:
  language: hi
  text: जिसके हाथ में हर जीव का जीवन[a] और सभी मनुष्यों की साँस है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर जीव का प्राण और समस्त मानव-देह की आत्मा।”
    reason: नֶפֶשׁ के लिए ‘प्राण’ और רוּחַ के लिए ‘आत्मा’ सम्भव विकल्प हैं; ‘समस्त मानव-देह’ כָּל בְּשַׂר אִישׁ के अधिक शाब्दिक सामूहिक अर्थ को दर्शाता है।
lexical_decisions:
- source_word: אֲשֶׁר בְּיָדוֹ
  choice: जिसके हाथ में
  rationale: सम्बन्धवाचक पद और पूर्वसर्गीय वाक्यांश को साथ रखकर इब्रानी रूपक को स्वाभाविक हिन्दी में सुरक्षित किया गया है; ‘हाथ में’ अधिकार और नियंत्रण का बोध कराता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: यहाँ शब्द जीवधारियों के जीवन या जीवन-तत्त्व को दर्शाता है। ‘प्राण’ काव्यात्मक समान्तरता बनाए रखता है और किसी संकीर्ण शरीर–आत्मा सिद्धान्त को अनावश्यक रूप से नहीं थोपता।
- source_word: כָּל חָי
  choice: हर जीव
  rationale: यह संक्षिप्त, स्वाभाविक और व्यापक हिन्दी अभिव्यक्ति है, जो सभी जीवित प्राणियों को समेटती है।
- source_word: וְרוּחַ
  choice: और … साँस
  rationale: נֶפֶשׁ के समान्तर और मानव-देह के सन्दर्भ में רוּחַ यहाँ जीवनदायी श्वास को सूचित कर सकता है। ‘साँस’ ठोस अर्थ को सामने रखती है, जबकि ‘आत्मा’ का सम्भव अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: כָּל בְּשַׂר אִישׁ
  choice: हर मनुष्य की
  rationale: शाब्दिक रूप से यह ‘मनुष्य का समस्त शरीर/मांस’ है, पर सामूहिक रूप में पूरी मानवजाति को दर्शाता है। ‘हर मनुष्य की’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है तथा सार्वभौमिकता बनाए रखती है।
theological_decisions:
- issue: נֶפֶשׁ और רוּחַ के मानवशास्त्रीय अर्थ
  choice: मुख्य पाठ में ‘प्राण’ और ‘साँस’
  alternative: ‘जीवन/आत्मा’ और ‘आत्मा’
  rationale: पद का मुख्य बल इस बात पर है कि सभी प्राणियों और मनुष्यों का जीवन परमेश्वर के अधिकार में है। ठोस जीवन-संबंधी अर्थ को मुख्य पाठ में रखते हुए सम्भव आध्यात्मिक अर्थ को पाद-टिप्पणी में सुरक्षित किया गया है।
- issue: כָּל בְּשַׂר אִישׁ में मानवता का सामूहिक उल्लेख
  choice: हर मनुष्य की
  alternative: समस्त मानव-देह की
  rationale: इब्रानी पद मनुष्य को उसकी नश्वर देहधारी अवस्था में सामूहिक रूप से दर्शाता है। मुख्य पाठ में अर्थ को सहज रखा गया है और अधिक शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली। ‘प्राण’ और ‘साँस’ सामान्य पाठक के लिए बोधगम्य हैं तथा मूल समान्तरता को बनाए रखते हैं।
