base_translation:
  language: en
  yaml_path: translation/ot/job/012/015.yaml
  text: Look[a], if he holds back the waters, they dry up; if he sends them out, they overturn the earth.
translation:
  language: hi
  text: देखो, यदि वह जल को रोक ले, तो वे सूख जाते हैं; यदि वह उन्हें छोड़ दे, तो वे धरती[a] को उलट-पुलट कर देते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भूमि’। इब्रानी शब्द אֶרֶץ का अर्थ संदर्भ के अनुसार ‘धरती’ या ‘भूमि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए कथन पर बल देता है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसका प्रभाव बनाए रखता है।
- source_word: יַעְצֹר בַּמַּיִם
  choice: वह जल को रोक ले
  rationale: עצר यहाँ जल को रोकने या थामे रखने का भाव देता है। हिन्दी में ‘जल को रोक ले’ स्पष्ट और काव्यात्मक है।
- source_word: וְיִבָשׁוּ
  choice: तो सब सूख जाता है
  rationale: इब्रानी क्रिया बहुवचन है, पर उसका कर्ता व्यक्त नहीं है। ‘सब’ इस निहित व्यापक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है और जल के स्वयं सूखने की असंगति से बचता है।
- source_word: וִישַׁלְּחֵם
  choice: जब वह उसे छोड़ देता है
  rationale: सर्वनाम-प्रत्यय का निकटतम संदर्भ ‘जल’ है। ‘छोड़ देता है’ रोके हुए जल को मुक्त करने का भाव देता है; समानांतर पंक्ति को हिन्दी में ‘जब’ से सहज रूप मिला है।
- source_word: וְיַהַפְכוּ
  choice: वह ... उलट-पुलट देता है
  rationale: הפך यहाँ विनाशकारी उलटाव या उथल-पुथल का चित्र प्रस्तुत करता है। ‘उलट-पुलट देता है’ उसका सजीव बल बनाए रखता है।
- source_word: אָרֶץ
  choice: धरती
  rationale: यह शब्द ‘धरती’ या ‘भूमि’ दोनों अर्थ दे सकता है। ज्ञान-साहित्य के इस व्यापक संदर्भ में ‘धरती’ उपयुक्त है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर द्वारा छोड़े गए जल की क्रिया और אָרֶץ का विस्तार
  choice: जल धरती को उलट-पुलट देता है
  alternative: जल भूमि को उलट-पुलट देता है
  rationale: पद परमेश्वर की जल पर सार्वभौम सत्ता को व्यापक काव्यात्मक रूप में दिखाता है। ‘धरती’ उस व्यापकता को बनाए रखता है, पर किसी विशिष्ट जलप्रलय की पहचान पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली। ‘जल’ पद के ज्ञान-साहित्यिक स्वर के अनुकूल है। पहले खंड के अस्पष्ट बहुवचन कर्ता को ‘सब’ द्वारा व्यापक किंतु अनिर्धारित रखा गया है।
