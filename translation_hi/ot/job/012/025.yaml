  text: They grope in darkness[a], without light; he makes them stagger like a drunkard.
translation:
  language: hi
  text: वे अँधेरे में, जहाँ प्रकाश नहीं, टटोलते फिरते हैं; वह उन्हें मतवाले की तरह डगमगाता फिराता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन्हें मतवाले की तरह भटकाता है।” हिब्रू क्रिया भटकाने, मार्ग से चुकाने, या दिशाहीन करने का भाव व्यक्त कर सकती है; यहाँ मतवाले की उपमा डगमगाने का भाव भी सामने लाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְמַשְׁשׁוּ
  choice: टटोलते फिरते हैं
  rationale: पिएल रूप दृष्टि के अभाव में छूकर मार्ग खोजने का चित्र देता है। यह हिंदी अभिव्यक्ति उस निरंतर और दिशाहीन खोज को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: חֹשֶׁךְ
  choice: अँधेरे
  rationale: यह शब्द यहाँ वास्तविक और रूपकात्मक—दोनों अर्थों की संभावना बनाए रखता है; ‘अँधेरा’ इसका सामान्य और सहज हिंदी प्रतिरूप है।
- source_word: וְלֹא אוֹר
  choice: जहाँ प्रकाश नहीं
  rationale: शाब्दिक ‘और प्रकाश नहीं’ को सहज हिंदी संबंध-वाक्य में व्यक्त किया गया है, जिससे अँधेरे और प्रकाश के अभाव की समानांतरता बनी रहती है।
- source_word: וַיַּתְעֵם
  choice: वह उन्हें ... भटकाता है
  rationale: תעה के हिफ़ील रूप में किसी को भटकाने या दिशाहीन करने का कारक भाव है। ‘भटकाता है’ मूल क्रिया का अर्थ सुरक्षित रखता है, जबकि मतवाले की उपमा शारीरिक डगमगाहट का संदर्भ देती है।
- source_word: ־ם
  choice: उन्हें
  rationale: तीसरे पुरुष बहुवचन कर्म-प्रत्यय को हिंदी में स्पष्ट कर्म-सर्वनाम से व्यक्त किया गया है।
- source_word: כַּשִּׁכּוֹר
  choice: मतवाले की तरह
  rationale: एक नशे में व्यक्ति की उपमा को गरिमापूर्ण और सामान्य आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: וַיַּתְעֵם का निहित कर्ता
  choice: वह उन्हें ... भटकाता है
  alternative: वे ... भटकते हैं
  rationale: हिब्रू क्रिया तीसरे पुरुष एकवचन कर्ता और बहुवचन कर्म को दर्शाती है। इसलिए ‘वह’ को बनाए रखा गया है; व्यापक संदर्भ में यह परमेश्वर की ओर संकेत करता है, पर पद में उसका नाम जोड़कर अस्पष्टता को अनावश्यक रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी रखी गई है। ‘टटोलते फिरते हैं’ और ‘मतवाले की तरह’ पद के दृश्यात्मक काव्य को बनाए रखते हैं। अर्धविराम हिब्रू की दो समानांतर क्रियाओं को स्पष्ट रूप से अलग करता है।
