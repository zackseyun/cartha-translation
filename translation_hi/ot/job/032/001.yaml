  text: וַֽ/יִּשְׁבְּת֡וּ שְׁלֹ֤שֶׁת הָ/אֲנָשִׁ֣ים הָ֭/אֵלֶּה מֵ/עֲנ֣וֹת אֶת אִיּ֑וֹב כִּ֤י ה֖וּא צַדִּ֣יק בְּ/עֵינָֽי/ו־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/032/001.yaml
  text: So these three men stopped answering Job[a], because he was righteous in his own eyes.
translation:
  language: hi
  text: तब इन तीनों पुरुषों ने अय्यूब को उत्तर देना छोड़ दिया, क्योंकि वह अपनी ही दृष्टि में धर्मी था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक अन्य पाठ-परंपरा के अनुसार, “क्योंकि वह उनकी दृष्टि में धर्मी था।”
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּשְׁבְּתוּ
  choice: उत्तर देना छोड़ दिया
  rationale: שבת यहाँ किसी काम को बंद कर देने के अर्थ में है और מֵעֲנוֹת के साथ मिलकर स्वाभाविक आधुनिक हिन्दी में ‘उत्तर देना छोड़ दिया’ बनता है।
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים הָאֵלֶּה
  choice: उन तीनों पुरुषों
  rationale: संदर्भ में संकेतित व्यक्ति अय्यूब के तीन मित्र हैं। ‘तीनों पुरुषों’ संख्या और पुल्लिंग को बनाए रखता है; हिन्दी कथानक में ‘उन’ स्वाभाविक संदर्भसूचक है।
- source_word: מֵעֲנוֹת אֶת אִיּוֹב
  choice: अय्यूब को उत्तर देना
  rationale: ענה का अर्थ यहाँ वाद-विवाद में उत्तर देना है; אֶת हिन्दी में अलग से व्यक्त नहीं होता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके उत्तर देना बंद करने का कारण प्रस्तुत करता है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: צַדִּיק के नैतिक और न्यायिक आशय को बनाए रखने वाला प्रचलित बाइबलीय हिन्दी शब्द है।
- source_word: בְּעֵינָיו
  choice: अपनी ही दृष्टि में
  rationale: प्राप्त WLC पाठ में प्रत्यय एकवचन पुल्लिंग है। ‘अपनी ही दृष्टि में’ हिन्दी में आत्म-मूल्यांकन का भाव स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: क्या अय्यूब वास्तव में धर्मी बताया गया है या केवल अपने आकलन में धर्मी था
  choice: वह अपनी ही दृष्टि में धर्मी था
  alternative: वह उनकी दृष्टि में धर्मी था
  rationale: WLC का एकवचन प्रत्यय ‘उसकी/अपनी दृष्टि में’ का समर्थन करता है। यह अनुवाद अय्यूब के दावे और उसके मित्रों की प्रतिक्रिया के बीच तनाव बनाए रखता है तथा कथावाचक की ओर से उसके धर्मी होने पर अतिरिक्त निर्णय नहीं थोपता। दूसरी पाठ-परंपरा को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। ‘धर्मी’ पारंपरिक बाइबलीय पदावली को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्पष्ट है।
