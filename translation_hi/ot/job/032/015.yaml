  text: חַ֭תּוּ לֹא עָ֣נוּ ע֑וֹד הֶעְתִּ֖יקוּ מֵ/הֶ֣ם מִלִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/015.yaml
  text: They are dismayed[a]; they answer no more[b]; words have departed from them.
translation:
  language: hi
  text: वे हतप्रभ हैं[a]; अब और उत्तर नहीं देते; शब्द उनसे दूर चले गए हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे टूट गए हैं” अथवा “वे घबरा गए हैं”; इब्रानी क्रिया टूट जाने या हतप्रभ होने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “शब्द उनसे दूर चले गए हैं”; अर्थात उनके पास कहने को कुछ नहीं बचा।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַתּוּ
  choice: वे हतप्रभ हैं
  rationale: חתת यहाँ टूट जाने, घबरा जाने या निरुत्तर होकर स्तब्ध रह जाने का भाव देता है। प्रसंग में अय्यूब के मित्रों की वाद-विवाद में हुई निरुत्तरता के लिए ‘हतप्रभ’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לֹא עָנוּ עוֹד
  choice: अब और उत्तर नहीं देते
  rationale: ענה का अर्थ उत्तर देना है, और לֹא के साथ עוֹד उस क्रिया के अब आगे जारी न रहने को व्यक्त करता है।
- source_word: הֶעְתִּיקוּ מֵהֶם מִלִּים
  choice: शब्द उनसे दूर चले गए हैं
  rationale: העתיקו में दूर हटने या चले जाने का बिंब है। ‘शब्द’ को कर्ता मानकर यह अनुवाद इब्रानी मानवीकरण को बनाए रखता है और संकेत करता है कि उनके पास कहने को कुछ नहीं बचा।
