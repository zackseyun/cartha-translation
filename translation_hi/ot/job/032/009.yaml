  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी काव्य की समानांतर संरचना को ‘और न’ से बनाए रखा गया है; कथन को आयु या संख्या के पूर्ण निषेध के बजाय सामान्य सूक्ति के रूप में प्रस्तुत किया गया है।
