base_translation:
  language: en
  yaml_path: translation/ot/job/032/009.yaml
  text: It is not the many who are wise[a], nor the old who understand justice.
translation:
  language: hi
  text: बहुत-से लोग बुद्धिमान नहीं होते, और न वृद्ध लोग न्याय[a] समझते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्णय” अथवा “जो उचित है।” इब्रानी शब्द मिष्पाट का अर्थ न्यायिक निर्णय, न्याय, या उचित व्यवस्था हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: नहीं
  rationale: निषेध को दोनों समानांतर कथनों में स्वाभाविक आधुनिक हिन्दी के अनुसार व्यक्त किया गया है।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यह बहुवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और लोगों के एक बड़े समूह को सूचित करता है; ‘महान लोग’ भी कुछ संदर्भों में संभव है, पर यहाँ संख्या और आयु के बीच समानांतरता के कारण ‘बहुत-से लोग’ अधिक उपयुक्त है।
- source_word: יֶחְכָּמוּ
  choice: बुद्धिमान होते
  rationale: חכם का क़ाल रूप ‘बुद्धिमान होना’ या ‘बुद्धिमान बनना’ व्यक्त कर सकता है; इस सामान्य कथन में ‘बुद्धिमान होते’ स्वाभाविक है और प्रक्रिया का अनावश्यक भाव नहीं जोड़ता।
- source_word: וּזְקֵנִים
  choice: और न वृद्ध लोग
  rationale: זְקֵנִים यहाँ आयु का बोध कराता है। ‘वृद्ध लोग’ पद या धार्मिक कार्यालय का भाव देने वाले ‘प्राचीन/पुरनिए’ जैसे विकल्पों की अपेक्षा आशय को अधिक स्पष्ट रखता है।
- source_word: יָבִינוּ
  choice: समझते हैं
  rationale: בין का सामान्य अर्थ समझना या परखना है; यहाँ कर्म के साथ ‘समझते हैं’ सीधा और सहज है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: מִשְׁפָּט न्याय, न्यायिक निर्णय, या उचित बात को सूचित कर सकता है। ‘न्याय’ इस प्रसंग के नैतिक-न्यायिक अर्थ को संक्षेप में व्यक्त करता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
