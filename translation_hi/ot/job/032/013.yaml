    text: या, “परमेश्वर ही उसे उत्तर देगा, मनुष्य नहीं,” अथवा “परमेश्वर ही उसे वश में करेगा, मनुष्य नहीं।” इब्रानी क्रिया का सामान्य अर्थ “खदेड़ना” या “दूर हटा देना” है, पर यहाँ यह अय्यूब को पराजित करने या उसके तर्क का खंडन करने के व्यापक अर्थ में हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּן
  choice: कहीं … न
  rationale: यह किसी सम्भावित दावे के विरुद्ध चेतावनी व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תֹּאמְרוּ
  choice: तुम … कहो
  rationale: द्वितीय पुरुष बहुवचन के भाव को सीधे और स्वाभाविक रूप में रखता है।
- source_word: מָצָאנוּ חָכְמָה
  choice: हमने बुद्धि पा ली है
  rationale: पूर्ण क्रिया से प्राप्त परिणाम के दावे का भाव आता है; ‘बुद्धि’ חָכְמָה का सामान्य और उपयुक्त अनुवाद है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: इस प्रसंग में यह इस्राएल के परमेश्वर को सूचित करता है और अगले पदांश में मनुष्य से उनका स्पष्ट विरोध है।
- source_word: יִדְּפֶנּוּ
  choice: उसे परास्त करेगा
  rationale: נדף का मूल बिंब खदेड़ने या दूर हटा देने का है, पर यहाँ अय्यूब को तर्क में हरा देने या उसका खंडन करने का व्यापक भाव सम्भव है। ‘परास्त करेगा’ प्रसंग में स्पष्ट है, जबकि अन्य सम्भावनाएँ पाद-टिप्पणी में सुरक्षित हैं।
- source_word: לֹא אִישׁ
  choice: मनुष्य नहीं
  rationale: यह परमेश्वर और किसी मानवीय कर्ता के बीच सामान्य विरोध को व्यक्त करता है; हिन्दी में ‘मनुष्य’ लिंग-समावेशी और स्रोतार्थ के अनुरूप है।
theological_decisions:
- issue: אֵל יִדְּפֶנּוּ לֹא אִישׁ का अर्थ
  choice: परमेश्वर ही उसे परास्त करेगा, मनुष्य नहीं
  alternative: परमेश्वर उसे उत्तर देगा, मनुष्य नहीं; अथवा परमेश्वर उसे वश में करेगा, मनुष्य नहीं
  rationale: इब्रानी क्रिया सामान्यतः खदेड़ने या दूर हटाने का बिंब देती है, लेकिन प्रसंग में अय्यूब को पराजित करने, उसका खंडन करने या उसे उत्तर देने का भाव हो सकता है। मुख्य पाठ प्रसंगगत अर्थ देता है और पाद-टिप्पणी वास्तविक अस्पष्टता बनाए रखती है।
- issue: אִישׁ का सामान्य एकवचन
  choice: मनुष्य
  alternative: कोई मनुष्य
  rationale: यहाँ आशय किसी विशेष पुरुष से नहीं, बल्कि परमेश्वर के विपरीत एक मानवीय कर्ता से है।
