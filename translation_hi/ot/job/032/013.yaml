  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कहीं … न’ चेतावनी के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; ‘परमेश्वर ही’ मूल के परमेश्वर–मनुष्य विरोध पर उचित बल देता है।
