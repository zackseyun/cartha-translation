  yaml_path: translation/ot/job/032/018.yaml
  text: For I am full of words[a]; the spirit within me constrains me.
translation:
  language: hi
  text: क्योंकि मैं शब्दों से भरा हूँ; मेरे भीतर की आत्मा मुझे दबाव में डाल रही है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह एलीहू के बोलने की आवश्यकता का कारण बताता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מָלֵתִי מִלִּים
  choice: मैं शब्दों से भरा हुआ हूँ
  rationale: यह वर्तमान में संचित, उमड़ते हुए वचनों की अवस्था को व्यक्त करता है और मूल रूपक को बनाए रखता है।
- source_word: הֱצִיקַתְנִי
  choice: मुझे दबाए जा रही है
  rationale: क्रिया आंतरिक दबाव, तंगी या विवशता का भाव देती है। यह अनुवाद केवल ‘विवश करना’ कहने के बजाय दबाव की मूल छवि भी सुरक्षित रखता है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ शब्द एलीहू के भीतर की चेतन और प्रेरक शक्ति को दर्शाता है। ‘आत्मा’ मूल की अर्थगत व्यापकता बनाए रखता है; इसे स्पष्ट रूप से परमेश्वर की आत्मा नहीं ठहराया गया है।
- source_word: בִּטְנִי
  choice: मेरे भीतर की
  rationale: शाब्दिक ‘मेरे पेट की’ इब्रानी में अंतरतम या भीतरी अस्तित्व का संकेत देता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक छवि पादटिप्पणी में दी गई है।
theological_decisions:
- issue: רוּחַ का आशय
  choice: आत्मा
  alternative: साँस / आंतरिक प्रेरणा
  rationale: संदर्भ में यह एलीहू के भीतर बोलने का दबाव उत्पन्न करने वाली शक्ति है। पाठ यह निश्चित नहीं करता कि यह पवित्र आत्मा है, इसलिए अनुवाद उस पहचान को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। अर्धविराम पद की दो समानांतर पंक्तियों को जोड़ता है। ‘दबाए जा रही है’ आंतरिक दबाव की काव्यात्मक छवि को बनाए रखता है।
