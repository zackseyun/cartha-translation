  edition: WLC
  text: וַ/יִּ֤חַר אַ֨ף אֱלִיה֣וּא בֶן בַּרַכְאֵ֣ל הַ/בּוּזִי֮ מִ/מִּשְׁפַּ֪חַ֫ת רָ֥ם בְּ֭/אִיּוֹב חָרָ֣ה אַפּ֑/וֹ עַֽל צַדְּק֥/וֹ נַ֝פְשׁ֗/וֹ מֵ/אֱלֹהִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/002.yaml
  text: Then Elihu son of Barakel the Buzite[a], from the family of Ram, burned with anger against Job; his anger burned because he justified himself rather than God.
translation:
  language: hi
  text: तब बूज़ी बरकेल का पुत्र और राम के कुल का एलीहू अय्यूब पर क्रोध से भड़क उठा। उसका क्रोध इसलिए भड़का कि अय्यूब ने परमेश्वर को सही ठहराने के बजाय अपने आपको सही ठहराया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उसने अपने आपको परमेश्वर से अधिक धर्मी समझा था।”
    reason: कठिन इब्रानी वाक्यांश का वैकल्पिक अनुवाद। यह מִן के तुलनात्मक बल को अधिक प्रत्यक्ष रूप से व्यक्त करता है।
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह इब्रानी मुहावरे में क्रोध के जलने या भड़कने का बिंब बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֱלִיהוּא בֶן בַּרַכְאֵל הַבּוּזִי
  choice: बूज़ी बरकेल के पुत्र एलीहू
  rationale: व्यक्तिनामों और वंश-संबंध को सीधे रूप में दिया गया है; הַבּוּזִי को कुल अथवा जातीय पहचान बताने वाले विशेषण के रूप में रखा गया है।
- source_word: מִמִּשְׁפַּחַת רָם
  choice: राम के कुल के
  rationale: מִשְׁפָּחָה यहाँ विस्तृत परिवार या कुल को दर्शाता है; ‘कुल’ प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: בְּאִיּוֹב
  choice: अय्यूब पर
  rationale: क्रोधसूचक क्रिया के साथ ב उस व्यक्ति को सूचित करता है जिसकी ओर क्रोध लक्षित है; हिन्दी में ‘पर’ इसका स्वाभाविक रूप है।
- source_word: חָרָה אַפּוֹ
  choice: उसका क्रोध ... भड़का
  rationale: मूल में क्रोध के मुहावरे की पुनरावृत्ति बल देती है; हिन्दी में भी इसे दोहराकर रखा गया है।
- source_word: עַל
  choice: इसलिए ... कि
  rationale: यहाँ עַל एलीहू के क्रोध का कारण प्रस्तुत करता है।
- source_word: צַדְּקוֹ נַפְשׁוֹ
  choice: अपने आपको धर्मी ठहराया
  rationale: צדק का यह रूप स्वयं को सही अथवा धर्मी घोषित करने का न्यायिक भाव रखता है, और נַפְשׁוֹ यहाँ आत्मवाचक अर्थ में ‘अपने आपको’ है।
- source_word: מֵאֱלֹהִים
  choice: परमेश्वर की अपेक्षा
  rationale: מִן का तुलनात्मक बल सुरक्षित रखा गया है। यह वाक्य को केवल ‘परमेश्वर के सामने’ कहने के बजाय अय्यूब और परमेश्वर के बीच निहित तुलना व्यक्त करता है।
theological_decisions:
- issue: עַל צַדְּקוֹ נַפְשׁוֹ מֵאֱלֹהִים में अय्यूब के दोष का स्वरूप
  choice: कि अय्यूब ने परमेश्वर की अपेक्षा अपने आपको धर्मी ठहराया था
  alternative: कि अय्यूब ने परमेश्वर के बजाय अपने आपको सही ठहराया था
  rationale: मुख्य पाठ में इब्रानी מִן के तुलनात्मक बल और צדק के ‘धर्मी/सही ठहराने’ वाले अर्थ को बनाए रखा गया है। वैकल्पिक रूप उस विरोध को सामने लाता है जिसमें अय्यूब का आत्मसमर्थन परमेश्वर को सही ठहराने की कीमत पर होता है; किसी एक व्याख्या से तनाव को पूरी तरह समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्रोध भड़क उठा’ मूल बिंब और पुनरावृत्ति को बनाए रखता है। व्यक्तिनामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘अय्यूब,’ ‘एलीहू,’ ‘बरकेल’ और ‘राम’ अपनाए गए हैं।
