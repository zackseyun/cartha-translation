lexical_decisions:
- source_word: וְהוֹחַלְתִּי
  choice: और मैं प्रतीक्षा करता रहा
  rationale: हिफ़ील पूर्ण प्रथम पुरुष एकवचन रूप यहाँ एलीहू के बोलने से पहले प्रतीक्षा करने को व्यक्त करता है। मूल में आशा के साथ प्रतीक्षा का भाव भी संभव है, पर संदर्भ में ‘प्रतीक्षा’ प्रमुख है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दोनों बार כִּי को कारणसूचक मानकर ‘क्योंकि’ किया गया है, जिससे मूल की पुनरावृत्त संरचना बनी रहती है।
- source_word: לֹא יְדַבֵּרוּ
  choice: वे कुछ नहीं बोले
  rationale: अपूर्ण क्रिया को प्रसंगानुसार अतीत में लिया गया है; ‘कुछ नहीं बोले’ आधुनिक हिन्दी में स्वाभाविक रूप से उनकी चुप्पी व्यक्त करता है।
- source_word: עָמְדוּ
  choice: वे रुक गए
  rationale: शाब्दिक अर्थ ‘वे खड़े रहे/ठहर गए’ है; वाणी के प्रसंग में इसका भाव बोलना बंद कर देने का है। ‘रुक गए’ इस मुहावरेदार अर्थ को स्पष्ट रखता है।
- source_word: לֹא עָנוּ עוֹד
  choice: फिर कोई उत्तर नहीं दिया
  rationale: ענה के साथ עוֹד यह बताता है कि आगे उत्तर देना समाप्त हो गया था; यह हिन्दी में सहज और अर्थनिष्ठ अभिव्यक्ति है।
