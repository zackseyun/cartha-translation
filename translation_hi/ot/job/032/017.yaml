lexical_decisions:
- source_word: אַעֲנֶה
  choice: उत्तर दूँगा
  rationale: यहाँ क़ाल रूप का अर्थ ‘उत्तर देना’ है; अय्यूब और उसके साथियों के संवाद के प्रसंग में यही स्वाभाविक है।
- source_word: אַף אֲנִי
  choice: मैं भी
  rationale: यह पदबंध एलीहू के अब चर्चा में सम्मिलित होकर बोलने पर बल देता है। दोनों बार इसे दोहराने से इब्रानी समानांतरता बनी रहती है।
- source_word: חֶלְקִי
  choice: अपनी ओर से
  rationale: חלק का शाब्दिक अर्थ ‘भाग/हिस्सा’ है, पर यहाँ आशय चर्चा में एलीहू के अपने योगदान से है। ‘अपनी ओर से’ आधुनिक हिन्दी में इस भाव को सहज रूप से व्यक्त करता है।
- source_word: אֲחַוֶּה
  choice: प्रकट करूँगा
  rationale: पिअेल रूप में इसका अर्थ ‘बतलाना, प्रकट करना, ज्ञात कराना’ हो सकता है। ज्ञान को वाणी द्वारा सामने रखने के लिए ‘प्रकट करूँगा’ उपयुक्त है।
- source_word: דֵעִי
  choice: अपना ज्ञान
  rationale: דעה का मूल अर्थ ‘ज्ञान/समझ’ है। ‘ज्ञान’ पाठ के दावे को ‘राय’ की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
