  text: Please[a], let me not show partiality to any man[b], nor flatter any person.
translation:
  language: hi
  text: कृपया, मैं किसी मनुष्य के प्रति पक्षपात न करूँ और न किसी व्यक्ति को चापलूसी भरी उपाधि देकर संबोधित करूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और न किसी व्यक्ति की चापलूसी करूँ।” हिब्रू क्रिया का अर्थ किसी को चापलूसी भरे नाम या उपाधि से संबोधित करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל נָא
  choice: कृपया, मैं ... न लूँ
  rationale: אַל के साथ נָא विनम्र किंतु गंभीर निषेधात्मक इच्छा व्यक्त करता है; हिंदी में यह रूप एलीहू की विनती और संकल्प, दोनों को स्वाभाविक ढंग से रखता है।
- source_word: אֶשָּׂא פְנֵי אִישׁ
  choice: किसी मनुष्य का पक्ष लूँ
  rationale: '''मुख उठाना'' हिब्रू मुहावरा है, जिसका यहाँ अर्थ किसी के प्रति पक्षपात या विशेष अनुग्रह दिखाना है। ''पक्ष लेना'' आधुनिक हिंदी में अर्थ को स्पष्ट रखता है।'
- source_word: אִישׁ
  choice: किसी मनुष्य
  rationale: इश एकवचन में 'मनुष्य/पुरुष' है; यहाँ अनिश्चित और सामान्य अर्थ होने के कारण 'किसी मनुष्य' उपयुक्त है।
- source_word: וְאֶל אָדָם
  choice: और न किसी व्यक्ति को
  rationale: आदाम यहाँ समानांतर पंक्ति में किसी मानव व्यक्ति को सूचित करता है; 'व्यक्ति' स्वाभाविक हिंदी देते हुए इश के साथ शब्दगत भेद भी बनाए रखता है।
- source_word: לֹא אֲכַנֶּה
  choice: चापलूसी के नामों से पुकारूँ
  rationale: पिएल रूप अֲכַנֶּה का संबंध किसी को उपाधि या विशेष नाम से संबोधित करने से है, और प्रसंग में वह चापलूसीपूर्ण संबोधन है। केवल 'चापलूसी करूँ' की अपेक्षा यह अनिश्चित शाब्दिक तत्व को अधिक सुरक्षित रखता है।
