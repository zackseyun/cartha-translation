  text: और एलीहू अय्यूब से बात करने के लिए प्रतीक्षा करता रहा था[a], क्योंकि वे उससे आयु में बड़े थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एलीहू ने शब्दों में अय्यूब की प्रतीक्षा की”; आशय है कि उसने अय्यूब से बात करने की प्रतीक्षा की।
    reason: lexical_alternative
