lexical_decisions:
- source_word: וֶאֱלִיהוּ
  choice: और एलीहू
  rationale: वाव के संयोजक बल को स्वाभाविक हिन्दी ‘और’ से व्यक्त किया गया है; नाम का प्रचलित हिन्दी रूप ‘एलीहू’ रखा गया है।
- source_word: חִכָּה
  choice: प्रतीक्षा करता रहा था
  rationale: क्रिया का मूल अर्थ ‘प्रतीक्षा करना’ है। अपूर्ण भूतकालीन पृष्ठभूमि और आगे होने वाली कार्रवाई से पहले तक जारी प्रतीक्षा को यह रूप स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת אִיּוֹב בִּדְבָרִים
  choice: अय्यूब से बात करने के लिए
  rationale: शाब्दिक संरचना ‘शब्दों में अय्यूब की प्रतीक्षा की’ हिन्दी में अस्वाभाविक है। प्रसंग में आशय अय्यूब से बोलने की प्रतीक्षा करना है; फुटनोट में शाब्दिक बनावट दी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ पद स्पष्ट रूप से एलीहू की प्रतीक्षा का कारण बताता है।
- source_word: זְקֵנִים הֵמָּה מִמֶּנּוּ
  choice: वे उससे आयु में बड़े थे
  rationale: यहाँ זְקֵנִים किसी पदधारी ‘पुरनियों’ के लिए नहीं, बल्कि तुलनात्मक रूप से अधिक आयु का सूचक है। बहुवचन ‘वे’ को मूल की तरह अनिर्दिष्ट रखा गया है।
- source_word: לְיָמִים
  choice: आयु में
  rationale: ‘दिनों के लिहाज़ से’ वाला इब्रानी मुहावरा आयु को दर्शाता है। सहज हिन्दी के लिए ‘आयु में’ चुना गया है और शाब्दिक रूप फुटनोट में सुरक्षित है।
