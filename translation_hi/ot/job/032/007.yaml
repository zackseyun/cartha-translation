  text: I said[a], ‘Days should speak, and many years should make wisdom known.’
translation:
  language: hi
  text: मैंने कहा[a], “दिन बोलें, और बहुत वर्ष बुद्धि को प्रकट करें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैंने सोचा, ‘वृद्धों को बोलना चाहिए, और बहुत-सी आयु बुद्धि को प्रकट करे।’” इब्रानी में “दिन” और “बहुत वर्ष” अधिक आयु अथवा वृद्ध लोगों के लिए लक्षणा के रूप में प्रयुक्त हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָמַרְתִּי
  choice: मैंने कहा
  rationale: यह אמר का काल पूर्ण, प्रथम पुरुष एकवचन रूप है, जिसका सीधा अर्थ ‘मैंने कहा’ है। प्रसंग में यह एलीहू की पहले की धारणा भी व्यक्त करता है; ‘मैंने सोचा’ संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: יָמִים
  choice: दिनों
  rationale: शाब्दिक ‘दिन’ को काव्यात्मक मानवीकरण और अगली समानांतर पंक्ति से संबंध बनाए रखने के लिए सुरक्षित रखा गया है। यहाँ यह लक्षणा द्वारा अधिक आयु या वृद्ध लोगों का संकेत करता है।
- source_word: יְדַבֵּרוּ
  choice: बोलना चाहिए
  rationale: यह דבר का पिएल अपूर्ण, तृतीय पुरुष बहुवचन रूप है। ‘चाहिए’ एलीहू की अपेक्षा या मान्यता को व्यक्त करता है, न कि केवल भविष्यवाणी को।
- source_word: וְרֹב שָׁנִים
  choice: और बहुत वर्षों
  rationale: मूल पदबंध का अर्थ ‘वर्षों की बहुतायत’ है। ‘बहुत वर्ष’ स्वाभाविक हिन्दी है और ‘दिनों’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: יֹדִיעוּ
  choice: प्रकट करनी चाहिए
  rationale: ידע के हिफ़ील रूप का मूल भाव ‘ज्ञात कराना’ है। हिन्दी में ‘बुद्धि प्रकट करना’ इस कारक अर्थ को बनाए रखता है; ‘सिखाना’ अधिक व्याख्यात्मक होता।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: संज्ञा का सीधा अर्थ ‘बुद्धि’ है और अय्यूब की ज्ञान-संबंधी काव्यात्मक शब्दावली के अनुरूप है।
