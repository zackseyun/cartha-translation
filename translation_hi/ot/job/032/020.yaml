    reason: lexical_alternative
lexical_decisions:
- source_word: אֲדַבְּרָה
  choice: मैं बोलूँगा
  rationale: प्रथम पुरुष एकवचन कोहोर्टेटिव वक्ता के दृढ़ निश्चय या इरादे को व्यक्त करता है। ‘मैं बोलूँगा’ आधुनिक हिन्दी में इस स्वैच्छिक, आगे की ओर उन्मुख भाव को स्वाभाविक रूप से रखता है।
- source_word: וְיִרְוַח לִי
  choice: ताकि मुझे राहत मिले
  rationale: रूअख़ धातु के क़ाल रूप और לִי का मुहावरा वक्ता को मिलने वाली सहजता या राहत दर्शाता है। प्रसंग में संयोजक को प्रयोजनसूचक ‘ताकि’ के रूप में लेना स्वाभाविक है, पर परिणामसूचक अर्थ भी सम्भव है; इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: אֶפְתַּח
  choice: मैं ... खोलकर
  rationale: פתח के क़ाल अपूर्ण प्रथम पुरुष एकवचन का अर्थ ‘मैं खोलूँगा’ है। अगले क्रियापद के साथ हिन्दी में ‘खोलकर ... दूँगा’ अधिक स्वाभाविक है और दोनों क्रियाओं का क्रम सुरक्षित रखता है।
- source_word: שְׂפָתַי
  choice: अपने होंठ
  rationale: इब्रानी में स्पष्ट रूप से ‘मेरे होंठ’ है। हिन्दी वाक्य में कर्ता के साथ स्वाभाविक आत्मवाचक सम्बन्ध के लिए ‘अपने होंठ’ चुना गया है और मूल का ठोस बिम्ब बनाए रखा गया है।
- source_word: וְאֶעֱנֶה
  choice: उत्तर दूँगा
  rationale: ענה यहाँ विवाद-संवाद के प्रसंग में ‘उत्तर देना’ या ‘जवाब देना’ है। ‘उत्तर दूँगा’ संक्षिप्त, गरिमापूर्ण और प्रासंगिक है।
