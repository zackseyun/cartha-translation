base_translation:
  language: en
  yaml_path: translation/ot/job/032/008.yaml
  text: But there is a spirit in man[a], and the breath of the Almighty gives them understanding.
translation:
  language: hi
  text: परन्तु मनुष्य में एक आत्मा है[a], और सर्वशक्तिमान की श्वास उन्हें समझ प्रदान करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही एक मनुष्य में आत्मा है, और सर्वशक्तिमान की श्वास उसे समझ प्रदान करती है।” हिब्रू में पहले एकवचन “मनुष्य” और फिर बहुवचन “उन्हें” आता है; कुछ अनुवाद पूरे वाक्य को एकवचन कर देते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אָכֵן
  choice: परन्तु
  rationale: एलीहू के तर्क में यह पिछले विचार के प्रति सुधारात्मक और बलात्मक विरोध प्रकट करता है।
- source_word: רוּחַ
  choice: आत्मा
  rationale: यहाँ शब्द मनुष्य के भीतर के अभौतिक तत्त्व को सूचित करता है; साथ ही इसे आगे आने वाली 'श्वास' से अलग रखा गया है।
- source_word: הִיא
  choice: है
  rationale: हिब्रू की संज्ञात्मक रचना को स्वाभाविक हिन्दी अस्तित्वसूचक वाक्य 'मनुष्य में एक आत्मा है' के रूप में व्यक्त किया गया है।
- source_word: בֶאֱנוֹשׁ
  choice: मनुष्य में
  rationale: אֱנוֹשׁ नश्वर मानव या मनुष्य को सामान्य रूप से दर्शाता है; एकवचन सामान्य अर्थ हिन्दी में स्वाभाविक रूप से सुरक्षित है।
- source_word: וְנִשְׁמַת
  choice: और ... की श्वास
  rationale: נְשָׁמָה का मूल अर्थ 'श्वास' है। इसे רוּחַ से अलग अनूदित करने पर काव्यात्मक समानांतरता सपाट नहीं होती।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: यह परमेश्वर की उपाधि है; हिन्दी में इसका प्रचलित और अर्थपूर्ण अनुवाद 'सर्वशक्तिमान' है।
- source_word: תְּבִינֵם
  choice: उन्हें समझ देती है
  rationale: हिफ़ील क्रिया समझ या विवेक प्रदान करने का भाव रखती है और प्रत्यय तीसरे पुरुष बहुवचन 'उन्हें' है; अनुवाद इस बहुवचन को बनाए रखता है।
theological_decisions:
- issue: मानव-विषयक भाषा और वचन-परिवर्तन
  choice: पहले सामान्य एकवचन 'मनुष्य' और फिर बहुवचन 'उन्हें' रखा गया है।
  alternative: 'पूरे वाक्य को एकवचन बनाना: ''एक मनुष्य में आत्मा है, और सर्वशक्तिमान की श्वास उसे समझ देती है।'''
  rationale: हिब्रू में אֱנוֹשׁ एकवचन है, जबकि תְּבִינֵם में बहुवचन कर्म-प्रत्यय है। स्रोत की वास्तविक वचन-असंगति को समतल करने के बजाय पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सापेक्ष शैली अपनाई गई है। 'आत्मा' और 'श्वास' का भेद तथा हिब्रू का एकवचन से बहुवचन में परिवर्तन जानबूझकर सुरक्षित रखा गया है।
