id: JOB.32.3
reference: Job 32:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בִ/שְׁלֹ֣שֶׁת רֵעָי/ו֮ חָרָ֪ה אַ֫פּ֥/וֹ עַ֤ל אֲשֶׁ֣ר לֹא מָצְא֣וּ מַעֲנֶ֑ה וַ֝/יַּרְשִׁ֗יעוּ אֶת אִיּֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/032/003.yaml
  text: And his anger burned against his three friends because they had found no answer[a], yet they had condemned Job.
translation:
  language: hi
  text: और उसके तीनों मित्रों पर उसका क्रोध भड़क उठा, क्योंकि वे कोई उत्तर न पा सके, फिर भी उन्होंने अय्यूब को दोषी ठहराया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने अय्यूब को दोषी घोषित किया” अथवा “उन्होंने अय्यूब को दुष्ट ठहराया।”
    reason: וַיַּרְשִׁיעוּ के न्यायिक और नैतिक अर्थ-परास को दर्शाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: וּבִשְׁלֹשֶׁת רֵעָיו
  choice: और उसके तीनों मित्रों पर
  rationale: חָרָה אַף के साथ ב क्रोध के लक्ष्य को सूचित करता है; हिंदी में ‘पर’ स्वाभाविक है। וּ को ‘और’ से व्यक्त किया गया है।
- source_word: חָרָה אַפּוֹ
  choice: उसका क्रोध भड़क उठा
  rationale: यह क्रोध के लिए प्रयुक्त इब्रानी मुहावरा है। यह अनुवाद मूल रूपक को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह एलीहू के क्रोध का कारण प्रस्तुत करता है; ‘क्योंकि’ संक्षिप्त और स्वाभाविक है।
- source_word: לֹא מָצְאוּ מַעֲנֶה
  choice: वे कोई उत्तर न पा सके
  rationale: מַעֲנֶה का अर्थ ‘उत्तर’ है। ‘न पा सके’ विवाद के संदर्भ में उनकी उत्तर देने में विफलता को सहज हिंदी में व्यक्त करता है।
- source_word: וַיַּרְשִׁיעוּ אֶת אִיּוֹב
  choice: फिर भी उन्होंने अय्यूब को दोषी ठहराया
  rationale: רשע के हिफ़ील रूप में न्यायिक या घोषणात्मक अर्थ ‘दोषी ठहराना’ उपयुक्त है। संदर्भगत विरोध को स्पष्ट करने के लिए וַ को ‘फिर भी’ कहा गया है।
theological_decisions:
- issue: मित्रों द्वारा अय्यूब के प्रति की गई कार्रवाई का अर्थ
  choice: उन्होंने अय्यूब को दोषी ठहराया
  alternative: उन्होंने अय्यूब को दुष्ट ठहराया / दुष्ट माना
  rationale: हिफ़ील रूप का घोषणात्मक-न्यायिक भाव ‘दोषी ठहराया’ से सुरक्षित रहता है, जबकि वैकल्पिक नैतिक अर्थ को पादटिप्पणी में रखा गया है ताकि मूल की अर्थ-सीमा बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘क्रोध भड़क उठा’ मूल मुहावरे की रूपकात्मक शक्ति बनाए रखता है; ‘दोषी ठहराया’ विवाद के न्यायिक भाव को व्यक्त करता है।
