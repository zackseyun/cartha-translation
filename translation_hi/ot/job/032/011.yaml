  text: Look[a], I waited for your words; I listened to your insights[c][b], until you searched out words.
translation:
  language: hi
  text: देखो, मैं तुम्हारी बातों की प्रतीक्षा करता रहा[a]; मैं तुम्हारी सूझ-बूझ भरी बातों[b] को ध्यान से सुनता रहा, जब तक तुम शब्दों की खोज करते रहे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारी बातों की आशा लगाए रहा।” इब्रानी क्रिया में अपेक्षा के साथ प्रतीक्षा करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारी समझ” अथवा “तुम्हारे तर्क।”
    reason: lexical_alternative
  - marker: c
    text: या, “जब तक तुम किसी उत्तर को शब्दों में ढूँढ़ते या परखते रहे।” इब्रानी काव्य में यह अंतिम वाक्यांश संक्षिप्त और कुछ हद तक मुहावरेदार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला वार्तालाप-सूचक अव्यय है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक है और मूल का संकेतात्मक बल बनाए रखता है।
- source_word: הוֹחַלְתִּי
  choice: मैं ... प्रतीक्षा करता रहा
  rationale: יחל का अर्थ प्रतीक्षा करना या आशा लगाए रहना हो सकता है। प्रसंग में एलीहू के धैर्यपूर्वक चुप रहकर सुनने पर बल है, इसलिए मुख्य पाठ में ‘प्रतीक्षा करता रहा’ उपयुक्त है; अपेक्षा का भाव पाद-टिप्पणी में रखा गया है।
- source_word: לְדִבְרֵיכֶם
  choice: तुम्हारी बातों की
  rationale: शाब्दिक ‘तुम्हारे शब्दों की’ की अपेक्षा ‘तुम्हारी बातों की प्रतीक्षा’ हिन्दी में अधिक स्वाभाविक है और अर्थ को ठीक रखता है।
- source_word: אָזִין
  choice: ध्यान से सुनता रहा
  rationale: אזן के हिफ़ील रूप में ध्यान लगाकर सुनने का भाव है। यह चयन उस सावधान श्रवण को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: תְּבוּנוֹתֵיכֶם
  choice: तुम्हारी सूझ-बूझ भरी बातें
  rationale: बहुवचन תבונות समझ, विवेक या उनसे निकले विचारों को सूचित कर सकता है। हिन्दी में केवल ‘सूझ-बूझ को सुनना’ अस्वाभाविक होता, इसलिए ‘सूझ-बूझ भरी बातें’ अर्थ और वाक्य-स्वाभाविकता दोनों को रखता है।
- source_word: תַּחְקְרוּן
  choice: खोजते रहे
  rationale: חקר में गहराई से खोजने या जाँचने का भाव है। यहाँ वक्ता उन शब्दों या उत्तर की खोज का उल्लेख करता है जिनसे मित्र अपना पक्ष रख सकें।
- source_word: מִלִּין
  choice: शब्द
  rationale: यह ‘शब्दों’ के लिए काव्यात्मक/अरामी रंग वाला बहुवचन है। ‘शब्द’ मूल के निकट रहता है और इसे निश्चित रूप से ‘तर्क’ या ‘उत्तर’ मानकर अर्थ को संकरा नहीं करता।
