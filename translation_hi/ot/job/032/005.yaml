  yaml_path: translation/ot/job/032/005.yaml
  text: When Elihu saw that there was no answer in the mouth of the three men[a], his anger burned.
translation:
  language: hi
  text: जब एलीहू ने देखा कि उन तीनों पुरुषों के मुँह में कोई उत्तर नहीं था[a], तो उसका क्रोध भड़क उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “उन तीनों पुरुषों के मुँह में कोई उत्तर नहीं था”; यह इब्रानी मुहावरा बताता है कि उनके पास देने के लिए कोई उत्तर नहीं था।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: जब ... ने देखा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘जब’ अगले खंड में एलीहू की प्रतिक्रिया के साथ स्वाभाविक कालगत संबंध व्यक्त करता है।
- source_word: אֱלִיהוּא
  choice: एलीहू
  rationale: व्यक्तिनाम का प्रचलित और स्रोत के निकट देवनागरी लिप्यंतरण।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह एलीहू ने जो देखा उसकी विषय-वस्तु प्रस्तुत करता है, इसलिए ‘कि’ उपयुक्त है।
- source_word: אֵין מַעֲנֶה
  choice: कोई उत्तर नहीं था
  rationale: भूतकालीन कथा-संदर्भ में अस्तित्ववाचक निषेध और संवाद के प्रसंग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּפִי
  choice: के मुँह में
  rationale: मूल इब्रानी बिंब और मुहावरे को बनाए रखता है; उसका आशय है कि उनके पास देने के लिए कोई उत्तर नहीं था।
- source_word: שְׁלֹשֶׁת הָאֲנָשִׁים
  choice: उन तीनों पुरुषों
  rationale: निश्चित पदबंध को प्रसंगानुकूल हिन्दी में व्यक्त करता है; ‘तीनों’ ज्ञात तीन व्यक्तियों को स्पष्ट करता है।
- source_word: וַיִּחַר אַפּוֹ
  choice: उसका क्रोध भड़क उठा
  rationale: इब्रानी के ‘क्रोध जलने’ वाले रूपक की तीव्रता को स्वाभाविक आधुनिक हिन्दी में सुरक्षित रखता है।
