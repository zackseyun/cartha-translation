    reason: lexical_alternative
  - marker: b
    text: या, “मैं तुम्हारी दलीलों से उसे उत्तर नहीं दूँगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרַךְ
  choice: रखीं
  rationale: यह क्रिया मूलतः व्यवस्थित करने या क्रम से लगाने का भाव रखती है। ‘बातें रखना’ हिंदी में किसी के सामने अपना पक्ष या तर्क प्रस्तुत करने का स्वाभाविक ढंग है और विवाद के संदर्भ को भी बनाए रखता है।
- source_word: אֵלַי
  choice: मेरे विरुद्ध
  rationale: पूर्वसर्ग का मूल अर्थ ‘मेरी ओर/मुझसे’ हो सकता है, पर इस वाद-विवाद के संदर्भ में अय्यूब द्वारा एलीहू के विरुद्ध बातें या तर्क रखने का भाव अभिप्रेत है।
- source_word: מִלִּין
  choice: अपनी बातें
  rationale: यह अरामी प्रभाव वाला बहुवचन बोले गए शब्दों या कथनों को दर्शाता है। ‘बातें’ सामान्य हिंदी में स्वाभाविक है; ‘अपनी’ हिंदी में कर्ता से संबंध स्पष्ट करने के लिए जोड़ा गया है।
- source_word: אִמְרֵיכֶם
  choice: तुम्हारी कही बातें
  rationale: यह संबोधित मित्रों के कथनों को दर्शाता है। ‘कही बातें’ पहले पदांश की ‘बातें’ से हल्का भेद रखते हुए स्पष्ट करता है कि एलीहू उनके पहले से कहे हुए कथनों को दोहराकर उत्तर नहीं देगा।
- source_word: אֲשִׁיבֶנּוּ
  choice: उसे उत्तर नहीं दूँगा
  rationale: हिफ़ील रूप यहाँ ‘उत्तर देना’ अर्थ देता है और तृतीय पुरुष एकवचन प्रत्यय अय्यूब को कर्म के रूप में सूचित करता है।
- source_word: וּבְאִמְרֵיכֶם לֹא אֲשִׁיבֶנּוּ
  choice: और मैं तुम्हारी कही बातों से उसे उत्तर नहीं दूँगा
  rationale: 'בְּ को साधनवाचक ‘से’ के रूप में रखा गया है: एलीहू मित्रों के कथनों को साधन बनाकर अय्यूब को उत्तर नहीं देगा।'
