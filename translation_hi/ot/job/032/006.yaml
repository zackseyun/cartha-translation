  text: Then Elihu son of Barakel the Buzite answered and said[a], “I am young in days, and you are aged[b]; therefore I was timid and afraid to declare my knowledge to you.
translation:
  language: hi
  text: तब बूज़ी बरकेल के पुत्र एलीहू ने उत्तर देकर कहा, “मैं आयु में छोटा हूँ[a], और आप लोग बहुत वृद्ध हैं; इसलिए मैं झिझका और आपको अपनी समझ बताने से डर गया।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं दिनों में छोटा हूँ,” अर्थात आयु में अपेक्षाकृत छोटा।
    reason: cultural_note
  - marker: b
    text: या, “इसलिए मैं पीछे हट गया और आपको वह बताने से डर गया जो मैं जानता हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: उत्तर देकर कहा
  rationale: दोनों इब्रानी कथात्मक क्रियाओं का अर्थ बनाए रखते हुए यह हिन्दी में स्वाभाविक वाक्-परिचय है; ‘उत्तर’ किसी सीधे प्रश्न का होना अनिवार्य नहीं बनाता।
- source_word: אֱלִיהוּא בֶן־בַּרַכְאֵל הַבּוּזִי
  choice: बूज़ी एलीहू ने, जो बरकेल का पुत्र था
  rationale: व्यक्तिनामों और जातीय/कुल-सूचक उपाधि का लिप्यंतरण किया गया है; हिन्दी वाक्यक्रम में संबंध स्पष्ट और सहज है।
- source_word: צָעִיר אֲנִי לְיָמִים
  choice: मैं आयु में छोटा हूँ
  rationale: ‘दिनों में छोटा’ के शाब्दिक चित्र को सहज आधुनिक हिन्दी मुहावरे में व्यक्त करता है और वृद्ध श्रोताओं से तुलना बनाए रखता है।
- source_word: יְשִׁישִׁים
  choice: बहुत वृद्ध
  rationale: यह शब्द अधिक आयु को सूचित करता है; चयन आदरपूर्ण है और आयु का प्रबल अंतर स्पष्ट करता है।
- source_word: עַל־כֵּן
  choice: इसलिए
  rationale: आयु के अंतर और बोलने में झिझक के बीच परिणाम-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: זָחַלְתִּי
  choice: मैं संकोच करता रहा
  rationale: क्रिया में डर या झिझक के कारण पीछे रहने का भाव है; यह हिन्दी में प्रसंगानुकूल है, जबकि ‘पीछे हटना’ वैकल्पिक रूप में पादटिप्पणी में सुरक्षित है।
- source_word: וָאִירָא
  choice: और ... डरता रहा
  rationale: पूर्ववर्ती संकोच के साथ जुड़े भय को अलग अभिव्यक्ति के रूप में बनाए रखता है।
- source_word: מֵחַוֺּת דֵּעִי אֶתְכֶם
  choice: आपको अपनी समझ बताने
  rationale: חוה के ‘बताने/प्रकट करने’ और דֵּעִי के ‘मेरी जानकारी/समझ’ भाव को सहज हिन्दी में व्यक्त करता है; ‘समझ’ यहाँ विचार मात्र से अधिक, वक्ता के ज्ञात बोध को दर्शाती है।
