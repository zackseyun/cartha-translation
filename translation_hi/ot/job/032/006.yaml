translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और वाचनयोग्य रखी गई है। एलीहू अपने से बड़े लोगों को संबोधित कर रहा है, इसलिए ‘आप लोग’ का प्रयोग किया गया है। इब्रानी की काव्यात्मक समानता—संकोच और भय—को दो जुड़े हुए भावों के रूप में सुरक्षित रखा गया है।
