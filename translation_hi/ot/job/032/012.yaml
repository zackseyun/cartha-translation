base_translation:
  language: en
  yaml_path: translation/ot/job/032/012.yaml
  text: I paid close attention to you[a], and behold, there was no one among you to refute Job[b], to answer his words.
translation:
  language: hi
  text: मैंने तुम लोगों की बातों पर ध्यान से विचार किया[a], और देखो, तुममें से कोई भी अय्यूब का खंडन करते हुए उसके कथनों का उत्तर देनेवाला नहीं था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तुम लोगों की बातें ध्यान से सुनीं।” इब्रानी क्रिया ध्यानपूर्वक विचार करने या गौर से देखने-सुनने का भाव देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “अय्यूब को दोष दिखानेवाला” अथवा “उसे ताड़ना देनेवाला।” इब्रानी शब्द तर्क में खंडन करने के साथ-साथ दोष दिखाने या ताड़ना देने का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָדֵיכֶם אֶתְבּוֹנָן
  choice: मैंने तुम लोगों की बातों पर ध्यान से विचार किया
  rationale: हित्पोलेल אֶתְבּוֹנָן ध्यानपूर्वक विचार या अवलोकन का भाव देता है। प्रसंग में एलीहू उनकी कही बातों को ध्यान से सुनकर परखने की बात कर रहा है; यह हिंदी रूप सुनने और विचार करने, दोनों को स्वाभाविक ढंग से समेटता है।
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: यह वक्ता के ध्यानपूर्वक सुनने के बाद निकले आश्चर्यजनक निष्कर्ष को उभारता है। हिंदी में ‘पर देखो’ विरोध और आलंकारिक बल दोनों को बनाए रखता है।
- source_word: אֵין לְאִיּוֹב מוֹכִיחַ
  choice: कोई भी अय्यूब का खंडन करनेवाला नहीं था
  rationale: מוֹכִיחַ का अर्थ दोष दिखाने, सुधारने या तर्क में गलत सिद्ध करनेवाला हो सकता है। विवाद के इस प्रसंग में ‘खंडन करनेवाला’ तर्कात्मक अर्थ को प्रमुखता देता है।
- source_word: עוֹנֶה אֲמָרָיו
  choice: कोई उसके कथनों का उत्तर न दे सका
  rationale: ענה और אֲמָרָיו का अर्थ अय्यूब की कही बातों का प्रत्युत्तर देना है। ‘न दे सका’ पूर्ववर्ती अभाव-वाचक रचना को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: מִכֶּם
  choice: तुममें से
  rationale: מִן यहाँ समूह में से किसी व्यक्ति के निकलने या पाए जाने का स्रोत बताता है; ‘तुममें से’ स्वाभाविक और सटीक है।
theological_decisions:
- issue: מוֹכִיחַ का तर्कात्मक और सुधारात्मक अर्थ
  choice: मुख्य पाठ में ‘खंडन करनेवाला’
  alternative: ‘दोष दिखानेवाला’ या ‘सुधारनेवाला’
  rationale: अय्यूब और मित्रों के वाद-विवाद में तर्क का उत्तर देकर गलत सिद्ध करने का अर्थ सबसे उपयुक्त है, किंतु नैतिक सुधार या फटकार की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘तुम लोगों’ से संबोधित समूह स्पष्ट होता है; ‘कथनों’ विवादात्मक प्रसंग के अनुरूप औपचारिकता बनाए रखता है।
