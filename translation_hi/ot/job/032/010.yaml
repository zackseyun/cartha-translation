lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले तर्क से निकले निष्कर्ष को सूचित करता है और आधुनिक हिन्दी में तार्किक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אָמַרְתִּי
  choice: मैं कहता हूँ
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया, ‘मैंने कहा’, है; पर इस भाषण-संदर्भ में इसका वर्तमान कथनात्मक/निश्चयात्मक बल संभव है। मुख्य पाठ में वर्तमान बल रखा गया और भूतकाल का विकल्प पादटिप्पणी में दिया गया है।
- source_word: שִׁמְעָה לִּי
  choice: मेरी सुनो
  rationale: एकवचन आज्ञार्थक रूप ध्यान देकर सुनने की मांग करता है। ‘मेरी सुनो’ आधुनिक हिन्दी में स्वाभाविक और संक्षिप्त है।
- source_word: אֲחַוֶּה
  choice: प्रकट करूँगा
  rationale: क्रिया किसी बात को ज्ञात कराने या व्यक्त करने का अर्थ देती है। ‘प्रकट करूँगा’ औपचारिक वक्तव्य का स्वर बनाए रखता है और ‘समझाऊँगा’ जैसी अतिरिक्त व्याख्यात्मक धारणा नहीं जोड़ता।
- source_word: דֵּעִי
  choice: अपना ज्ञान
  rationale: यह सीधे वक्ता के ज्ञान या समझ को सूचित करता है। ‘ज्ञान’ मूल अर्थ को बनाए रखता है; ‘राय’ उसके ज्ञान-दावे को अनावश्यक रूप से कमजोर कर देता।
- source_word: אַף אֲנִי
  choice: मैं भी
  rationale: यह एलीहू को बोलने वालों में जोर देकर सम्मिलित करता है। ‘मैं भी’ हिन्दी में स्वाभाविक रूप से इस अतिरिक्त बल को व्यक्त करता है।
