translation:
  language: hi
  text: देखो, मेरा पेट दाखमधु के समान है जिसे खोला नहीं गया; वह नई मशकों की तरह फटने को है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह अव्यय श्रोता का ध्यान एलीहू के सजीव उपमान की ओर खींचता है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: בִטְנִי
  choice: मेरा पेट
  rationale: בטן का ठोस अर्थ पेट है, पर यहाँ वह भीतर जमा वाणी और दबाव का भी बोध कराता है; ‘मेरा पेट’ मूल बिंब को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: כְּיַיִן
  choice: उस दाखमधु के समान
  rationale: मूल में केवल ‘दाखमधु के समान’ है; दबाव का प्रसंग स्पष्ट है, पर ‘खमीर उठता हुआ’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: לֹא יִפָּתֵחַ
  choice: जिसे खोला न गया हो
  rationale: निफ़अल रूप का निकट अर्थ ‘न खोला गया’ है। यह हिन्दी अभिव्यक्ति मूल की अस्पष्टता बनाए रखती है कि पात्र अथवा मदिरा को निकास नहीं मिला।
- source_word: כְּאֹבוֹת חֲדָשִׁים
  choice: नई मशकों के समान
  rationale: אֹבוֹת यहाँ तरल, विशेषकर दाखमधु, रखने की चमड़े की मशकों को दर्शाता है; ‘नई मशकें’ सांस्कृतिक वस्तु और विशेषण दोनों को संक्षेप में व्यक्त करता है।
- source_word: יִבָּקֵעַ
  choice: वह फटने को है
  rationale: בקע का अर्थ चिरना या फट जाना है। ‘फटने को है’ संचित दबाव और आसन्न घटना को स्वाभाविक हिन्दी में व्यक्त करता है।
