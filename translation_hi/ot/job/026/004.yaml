  text: To whom have you declared words[a], and whose breath has come out from you?
translation:
  language: hi
  text: तूने किसको बातें बताई हैं? और किसकी साँस तुझमें से निकली है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और किसकी आत्मा तुझमें से निकली है?” इब्रानी शब्द का अर्थ “साँस” हो सकता है और कुछ प्रसंगों में “आत्मा” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶת מִי
  choice: किसको
  rationale: प्रश्नवाचक पद यहाँ उस व्यक्ति को दर्शाता है जिसे बातें बताई गईं; आधुनिक हिन्दी में ‘किसको’ स्वाभाविक है और प्रश्न की व्यंग्यात्मक धार बनाए रखता है।
- source_word: הִגַּדְתָּ מִלִּין
  choice: तूने ... ये बातें बताई हैं
  rationale: हिफ़ील क्रिया का अर्थ ‘बताना/ज्ञात कराना’ है और מִלִּין बोले गए शब्दों या बातों को दर्शाता है। ‘ये बातें बताई हैं’ शाब्दिक अर्थ तथा स्वाभाविक हिन्दी दोनों को सँभालता है।
- source_word: וְנִשְׁמַת מִי
  choice: और किसकी साँस
  rationale: נְשָׁמָה का मूल ठोस अर्थ ‘साँस/जीवन-श्वास’ है, जबकि प्रसंगानुसार ‘आत्मा’ भी संभव है। मुख्य पाठ में ‘साँस’ काव्यात्मक चित्र को सुरक्षित रखती है।
- source_word: יָצְאָה מִמֶּךָּ
  choice: तुझमें से निकली है
  rationale: יָצָא का ठोस अर्थ ‘निकलना’ है। ‘तुझमें से निकली है’ स्रोत की गति और व्यक्ति से निकलने वाली साँस या प्रेरणा के चित्र को बनाए रखता है।
theological_decisions:
- issue: ‘किसकी साँस’ का आशय
  choice: मुख्य पाठ में ‘साँस’
  alternative: ‘किसकी आत्मा तुझमें से निकली है?’
  rationale: इब्रानी נְשָׁמָה दोनों अर्थ-क्षेत्रों से जुड़ सकती है। ‘साँस’ अधिक ठोस और प्राथमिक अर्थ है, पर ‘आत्मा’ की संभावना को पादटिप्पणी में रखा गया है ताकि प्रेरणा या प्रभाव संबंधी संभावित संकेत दब न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक प्रश्न। अय्यूब द्वारा बिलदद को सीधे संबोधन के अनुरूप एकवचन ‘तू/तुझ’ रखा गया है। ‘ये बातें’ हिन्दी में ‘शब्द’ की अपेक्षा अधिक स्वाभाविक है, जबकि आशय बोले गए वचनों का ही है।
