translation:
  language: hi
  text: 'वह अपने सिंहासन का मुख ढक लेता है[a][b],

    और उस पर अपना बादल फैलाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सिंहासन का मुख थामे रहता है।” इब्रानी क्रिया का अधिक शाब्दिक अर्थ “पकड़ना” या “थामना” हो सकता है; इस प्रसंग में बादल द्वारा ढकने या छिपाने का भाव अधिक संभावित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने सिंहासन का मुख”; इससे सिंहासन का दिखाई देने वाला भाग या सामने का भाग अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְאַחֵז
  choice: ढक लेता है
  rationale: मूल क्रिया का सामान्य अर्थ ‘पकड़ना/थामना’ है, पर अगले पद में बादल फैलाने की समानांतर छवि यहाँ सिंहासन को ओझल करने का भाव सुझाती है। ‘ढक लेता है’ स्वाभाविक हिन्दी में यह प्रसंगगत अर्थ व्यक्त करता है।
- source_word: פְּנֵי
  choice: का मुख
  rationale: פָּנִים का शाब्दिक अर्थ ‘मुख’ है और यहाँ सिंहासन का दिखाई देने वाला भाग या सामने का तल अभिप्रेत हो सकता है। ‘मुख’ काव्यात्मक इब्रानी बिंब को बनाए रखता है।
- source_word: כִסֵּה
  choice: अपने सिंहासन
  rationale: כִּסֵּא का अर्थ ‘सिंहासन’ है। पद के निहित कर्ता परमेश्वर और ‘अपना बादल’ के अनुरूप हिन्दी का निजवाचक ‘अपने’ संबंध स्पष्ट करता है।
- source_word: פַּרְשֵׁז
  choice: फैला देता है
  rationale: क्रिया फैलाने या विस्तृत करने का भाव देती है। हिन्दी में यह रूप बादल को सिंहासन पर फैलाने की काव्यात्मक क्रिया को सहज ढंग से व्यक्त करता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: पुल्लिंग प्रत्यय का सबसे स्वाभाविक पूर्वपद ‘सिंहासन’ है; ‘उस पर’ स्थानगत संबंध को स्पष्ट रखते हुए संदर्भगत अस्पष्टता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: עֲנָנוֹ
  choice: अपना बादल
  rationale: एकवचन संज्ञा पर तीसरे पुरुष एकवचन प्रत्यय है। हिन्दी में निहित कर्ता के अपने बादल के लिए ‘अपना बादल’ स्वाभाविक है।
theological_decisions:
- issue: निहित कर्ता और स्वामित्व-संबंध
  choice: परमेश्वर अपने सिंहासन को अपने बादल से ओझल करता है।
  alternative: ‘सिंहासन’ को बिना स्वामित्व-सूचक शब्द के अधिक निर्वैयक्तिक रूप में रखा जा सकता है।
  rationale: आसपास का काव्यात्मक संदर्भ परमेश्वर के विश्वव्यापी कार्यों का वर्णन करता है, और ‘उसका बादल’ निहित दिव्य कर्ता की ओर संकेत करता है। हिन्दी में ‘अपने/अपना’ इसी संबंध को स्वाभाविक रूप से व्यक्त करते हैं, बिना अतिरिक्त सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और काव्यात्मक रूप अपनाया गया है। ‘सिंहासन का मुख’ मूल बिंब को सुरक्षित रखता है, जबकि दो पंक्तियों की रचना इब्रानी समानांतरता और प्रवाह को उभारती है।
