  text: By his power he stilled the sea[a], and by his understanding he shattered Rahab.
translation:
  language: hi
  text: 'उसने अपनी सामर्थ्य से समुद्र को शांत किया,

    और अपनी समझ से राहब को चूर कर दिया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: राहब अराजकता की उस शक्ति या समुद्री दैत्य का काव्यात्मक नाम है जो परमेश्वर का विरोध करता है; इसे अर्थ खोलकर “समुद्री दैत्य” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹחוֹ
  choice: अपनी सामर्थ्य से
  rationale: בְּ का प्रयोग साधन बताता है और כֹּחַ परमेश्वर की ब्रह्मांडीय शक्ति को व्यक्त करता है; इसलिए सहज और गरिमापूर्ण हिंदी में ‘अपनी सामर्थ्य से’ उपयुक्त है।
- source_word: רָגַע
  choice: शांत किया
  rationale: समुद्र के साथ यह क्रिया उसे थामने या शांत करने का भाव देती है। मूल धातु के अन्य संदर्भों में हलचल उत्पन्न करने का अर्थ संभव है, पर यहाँ समानांतर पंक्ति और अराजक शक्तियों पर प्रभुत्व का चित्र ‘शांत किया’ का समर्थन करता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: यह יָם का सीधा अनुवाद है और वास्तविक समुद्र तथा काव्यात्मक अराजक शक्ति—दोनों संकेतों को खुला रखता है।
- source_word: וּבִתְבוּנָתוֹ
  choice: और अपनी समझ से
  rationale: תְּבוּנָה समझ, अंतर्दृष्टि या विवेक को दर्शाता है। ‘समझ’ अय्यूब की ज्ञान-विषयक भाषा को सहज आधुनिक हिंदी में सुरक्षित रखती है।
- source_word: מָחַץ
  choice: चूर कर दिया
  rationale: क्रिया जोर से कुचलने या तोड़ डालने का अर्थ देती है। ‘चूर कर दिया’ निर्णायक पराजय की सशक्त काव्यात्मक छवि व्यक्त करता है।
- source_word: רָהַב
  choice: राहब
  rationale: यहाँ शब्द को अराजक शक्ति अथवा समुद्री दैत्य के मिथकीय-काव्यात्मक नाम के रूप में समझना सर्वोत्तम है। नाम का लिप्यंतरण मूल की बहुअर्थी छवि को बचाता है; फुटनोट उसका आशय स्पष्ट करता है।
theological_decisions:
- issue: क्या רָהַב को व्यक्तिवाचक नाम माना जाए या उसका अर्थ खोलकर अनुवाद किया जाए
  choice: ‘राहब’—परमेश्वर द्वारा परास्त अराजक शक्ति अथवा समुद्री दैत्य का काव्यात्मक नाम
  alternative: ‘समुद्री दैत्य’ अथवा अमूर्त अर्थ में ‘घमंड’
  rationale: अय्यूब के ब्रह्मांडीय काव्य-संदर्भ में רָהַב एक मिथकीय-काव्यात्मक विरोधी शक्ति का नाम प्रतीत होता है। ‘राहब’ रखने से मूल बिंब और उसकी व्याख्यात्मक खुलावट बनी रहती है; फुटनोट पाठक को संभावित आशय बताता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण काव्यात्मक शैली रखी गई है। दोनों पंक्तियों की समानांतर रचना सुरक्षित है। ‘राहब’ को लिप्यंतरित कर मूल की मिथकीय-काव्यात्मक अस्पष्टता बनाए रखी गई है।
