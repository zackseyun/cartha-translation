  text: He binds up the waters in his clouds[b][a], yet the cloud is not split open under them.
translation:
  language: hi
  text: 'वह जल को अपने बादलों[a] में बाँध रखता है,

    फिर भी बादल उनके नीचे नहीं फटता[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने घने बादलों में’; इब्रानी शब्द घने बादल-समूह पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘फूट नहीं पड़ता’; इब्रानी का भाव है, ‘फटता’ या ‘चिरता नहीं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרֵר
  choice: बाँध रखता है
  rationale: यह कृदन्त जल को बाँधने, समेटने या रोककर रखने का चित्र प्रस्तुत करता है। ‘बाँध रखता है’ उस निरंतर क्रिया और नियंत्रण के भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַיִם
  choice: जल
  rationale: हिन्दी में ‘जल’ एकवचन रूप में भी सामूहिक पदार्थ को व्यक्त करता है और काव्यात्मक गरिमा बनाए रखता है।
- source_word: בְּעָבָיו
  choice: अपने बादलों में
  rationale: עָב बादल, विशेषकर घने बादल, को सूचित कर सकता है। प्रत्यय परमेश्वर के स्वामित्व को दर्शाता है; ‘अपने बादलों’ से यह संबंध स्पष्ट और सहज रहता है।
- source_word: וְלֹא
  choice: फिर भी ... नहीं
  rationale: 'संयोजक यहाँ विरोधाभास उभारता है: बादलों में जल बँधा होने पर भी बादल नहीं फटता।'
- source_word: נִבְקַע
  choice: फट नहीं जाता
  rationale: בקע का निफ़अल रूप चिरने या फट जाने का निष्क्रिय भाव रखता है। ‘फट नहीं जाता’ हिन्दी में स्वाभाविक रहते हुए मूल भौतिक बिंब को सुरक्षित रखता है।
- source_word: עָנָן
  choice: बादल
  rationale: मूल में संज्ञा एकवचन है; इसलिए पिछली पंक्ति के बहुवचन के बावजूद यहाँ एकवचन ‘बादल’ रखा गया है।
- source_word: תַּחְתָּם
  choice: उनके नीचे
  rationale: प्रत्यय पुल्लिंग बहुवचन है। ‘उनके नीचे’ मूल की संख्या और उसके संभावित संदर्भ की अस्पष्टता—जल अथवा बादल-समूह—को अनावश्यक रूप से तय नहीं करता।
theological_decisions:
- issue: תַּחְתָּם में बहुवचन सर्वनाम का संदर्भ
  choice: ‘उनके नीचे’ के द्वारा संदर्भ अस्पष्ट रखा गया
  alternative: ‘जल के भार से’ या ‘उसके नीचे’
  rationale: इब्रानी रूप बहुवचन है और उसका सटीक पूर्वपद पूर्णतः स्पष्ट नहीं है। किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की काव्यात्मक अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। ‘जल’ और ‘बाँध रखता है’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि पंक्ति-विन्यास इब्रानी कविता के समानांतर चित्र को बनाए रखता है।
