  yaml_path: translation/ot/job/026/003.yaml
  text: How you have counseled one without wisdom[a], and made sound wisdom known abundantly!
translation:
  language: hi
  text: 'तुमने बुद्धि से रहित व्यक्ति को कैसी सलाह दी है,

    और खरी बुद्धि कितनी बहुतायत से ज्ञात कराई है![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने बुद्धि से रहित व्यक्ति को क्या सलाह दी है, और खरी बुद्धि कितनी बहुतायत से ज्ञात कराई है!” इब्रानी आरम्भिक शब्द का अनुवाद “क्या” या “कैसी/कितनी” किया जा सकता है; मुख्य पाठ में विस्मयात्मक रूप अय्यूब के व्यंग्य को सामने लाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: कैसी / कितनी
  rationale: यहाँ מַה विस्मयात्मक और व्यंग्यात्मक है। दोनों समानांतर उपवाक्यों में स्वाभाविक हिन्दी के अनुसार ‘कैसी’ और ‘कितनी’ रखकर अय्यूब का कटाक्ष व्यक्त किया गया है।
- source_word: יָּעַצְתָּ
  choice: तुमने ... सलाह दी है
  rationale: יעץ का सीधा अर्थ सलाह देना है; यह आधुनिक हिन्दी में सहज रहते हुए ज्ञान-साहित्य के भाव को बनाए रखता है।
- source_word: לְלֹא חָכְמָה
  choice: बुद्धिहीन को
  rationale: לְ के प्राप्तकर्ता-भाव और לֹא חָכְמָה, अर्थात बुद्धि से रहित व्यक्ति, को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है; व्यक्ति की पहचान को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: ज्ञान-साहित्य में חָכְמָה का मानक और प्रसंगानुकूल हिन्दी प्रतिशब्द।
- source_word: וְתוּשִׁיָּה
  choice: खरी बुद्धि
  rationale: תּוּשִׁיָּה यहाँ ठोस, कारगर या सुदृढ़ बुद्धि का बोध कराता है। ‘खरी बुद्धि’ सामान्य पाठक के लिए स्वाभाविक है और केवल सामान्य ‘बुद्धि’ से इसका सूक्ष्म भेद बनाए रखती है।
- source_word: לָרֹב
  choice: कितनी बहुतायत से
  rationale: यह प्रकट की गई बुद्धि की कथित प्रचुरता पर व्यंग्यात्मक बल देता है। विस्मयवाचक ‘कितनी’ מַה की शक्ति को भी सामने लाता है।
- source_word: הוֹדָעְתָּ
  choice: प्रकट की है
  rationale: ידע के हिफ़ील रूप का अर्थ ‘ज्ञात कराया’ है। ‘प्रकट की है’ हिन्दी में सहज और यहाँ बुद्धि को सामने रखने के अर्थ में उपयुक्त है।
