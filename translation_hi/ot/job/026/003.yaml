  verdict: revise
  source_fidelity: The draft accurately preserves the ironic exclamatory force of מַה, the indirect object ('one without wisdom'), and the abundance expressed by לָרֹב. However, 'प्रकट की है' can suggest that wisdom itself was revealed; הוֹדָעְתָּ more directly means 'made known/caused to know.'
  naturalness: The wording is generally clear and suitably elevated. 'बुद्धि से रहित व्यक्ति' is more idiomatic and less potentially stigmatizing than the substantivized 'बुद्धिहीन,' while retaining the source's deliberately ironic characterization. 'ज्ञात कराई है' explicitly and naturally conveys making wisdom known.
  terminology: '''सलाह'' appropriately renders יעץ, and ''खरी बुद्धि'' is an acceptable rendering of תּוּשִׁיָּה in this wisdom-literature context. No theological terminology is at issue.'
  issues:
  - severity: low
    issue: The verb 'प्रकट की है' is slightly less precise for הוֹדָעְתָּ.
    rationale: The Hebrew Hiphil of ידע means 'made known.' Replacing it with 'ज्ञात कराई है' preserves the causative sense without introducing a stronger notion of revelation.
  - severity: low
    issue: '''बुद्धिहीन'' may sound like a fixed, potentially stigmatizing label in modern Hindi.'
    rationale: '''बुद्धि से रहित व्यक्ति'' retains the indefinite personal referent and Job''s irony while reading more naturally in modern standard Hindi.'
