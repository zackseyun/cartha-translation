translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल से ऊपर किंतु सहज रखी गई है। विस्मयवाचक संरचना अय्यूब के कटाक्ष को स्पष्ट करती है, पर ‘व्यंग्य’ जैसा व्याख्यात्मक शब्द मुख्य पाठ में नहीं जोड़ा गया।
