base_translation:
  language: en
  yaml_path: translation/ot/job/026/006.yaml
  text: Sheol lies naked before him[b][a], and Abaddon has no covering.
translation:
  language: hi
  text: 'शिओल[a] उसके सामने नग्न है,

    और अबद्दोन[b] के लिए कोई आवरण नहीं है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शिओल उसके सामने खुला पड़ा है।”
    reason: lexical_alternative
  - marker: b
    text: “अबद्दोन” का अनुवाद “विनाश” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרוֹם
  choice: नग्न पड़ा है
  rationale: विशेषण का मूल अर्थ ‘नग्न, खुला हुआ’ है। ‘नग्न पड़ा है’ हिन्दी में सजीव काव्यात्मक बिंब बनाए रखता है और निष्क्रिय अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: שְׁאוֹל
  choice: अधोलोक
  rationale: यह मृतकों के लोक को सूचित करने वाला विशिष्ट इब्रानी शब्द है। आधुनिक हिन्दी पाठक के लिए ‘अधोलोक’ सहज है और इसे केवल व्यक्तिगत ‘कब्र’ तक सीमित नहीं करता।
- source_word: נֶגְדּוֹ
  choice: उसके सामने
  rationale: यह इब्रानी पदबंध का सीधा और स्वाभाविक अनुवाद है। संदर्भ में ‘उसके’ का संकेत परमेश्वर की ओर है, पर पद में नाम जोड़कर उसे स्पष्ट नहीं किया गया।
- source_word: אֵין
  choice: कोई ... नहीं
  rationale: 'अस्तित्व के निषेध को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है: ‘कोई आवरण नहीं।’'
- source_word: כְּסוּת
  choice: आवरण
  rationale: ‘आवरण’ ढकने वाली वस्तु या परदे का अर्थ देता है और पहले चरण के ‘नग्न’ बिंब के समानांतर बना रहता है।
- source_word: אֲבַדּוֹן
  choice: विनाश-लोक
  rationale: यह शब्द ‘विनाश’ को सूचित कर सकता है, पर अधोलोक के साथ काव्यात्मक समानांतरता में किसी विनाश-स्थान/लोक का भाव भी रखता है। ‘विनाश-लोक’ अर्थ को हिन्दी में सुलभ रखते हुए स्थान-सदृश प्रयोग को सुरक्षित करता है।
theological_decisions:
- issue: נֶגְדּוֹ में तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का संदर्भ
  choice: ‘उसके सामने’—संदर्भतः परमेश्वर
  alternative: तात्कालिक कथन में कोई अनिर्दिष्ट दर्शक
  rationale: आसपास का प्रसंग परमेश्वर के ज्ञान और सामर्थ्य का वर्णन करता है। फिर भी मूल पाठ की तरह केवल सर्वनाम रखा गया है, ताकि पद के भीतर अनावश्यक व्याख्या न जोड़ी जाए।
- issue: אֲבַדּוֹן का अमूर्त या स्थान-सदृश अर्थ
  choice: विनाश-लोक
  alternative: विनाश; अबद्दोन
  rationale: शिओल/अधोलोक के साथ समानांतर प्रयोग स्थान-सदृश अर्थ का समर्थन करता है, जबकि पादटिप्पणी ‘विनाश’ के अमूर्त विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। दो समानांतर चरणों की संरचना तथा ‘नग्न/आवरण’ का बिंब सुरक्षित है। तकनीकी लिप्यंतरण ‘शिओल’ और ‘अबद्दोन’ को मुख्य पाठ में रखने के बजाय सामान्य हिन्दी पाठक के लिए अर्थ-सूचक पद चुने गए हैं; वैकल्पिक रूप पादटिप्पणी में दिया गया है।
