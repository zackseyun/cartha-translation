  rationale: हिब्रू में ‘उत्तर दिया और कहा’ एक प्रचलित कथन-परिचायक सूत्र है। हिन्दी में दोनों क्रियाएँ रखना अनावश्यक पुनरुक्ति और अस्वाभाविकता पैदा करता; द्विबिंदु ‘कहा’ के कथन-परिचायक कार्य को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव-क्रमवाचक कथा/संवाद को आगे बढ़ाता है; ‘तब’ हिन्दी में क्रम और पिछले वक्तव्य से संबंध स्वाभाविक ढंग से दर्शाता है।
