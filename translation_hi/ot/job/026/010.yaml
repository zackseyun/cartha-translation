  text: He inscribed a circle on the surface of the waters[a], at the boundary of light and darkness.
translation:
  language: hi
  text: उसने जल की सतह पर एक वृत्त अंकित किया[a], प्रकाश और अंधकार की सीमा तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने जल की सतह पर एक सीमा ठहराई, जहाँ प्रकाश और अंधकार मिलते हैं।”
    reason: חֹק חָג के अर्थ में ‘वृत्त अंकित करना’ और ‘सीमा ठहराना’—दोनों संभावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: חֹק
  choice: अंकित किया
  rationale: यह शब्द सामान्यतः ठहराई हुई विधि या सीमा को दर्शाता है; חָג के साथ यहाँ किसी निश्चित घेरे को चिह्नित करने की क्रिया व्यक्त होती है। ‘अंकित किया’ इस ठोस बिंब को बनाए रखता है।
- source_word: חָג
  choice: एक वृत्त
  rationale: यह मूल वृत्त या घेरा बनाने का भाव देता है। ‘वृत्त’ मूल बिंब को सीधे रखता है; ‘क्षितिज’ अधिक व्याख्यात्मक होता।
- source_word: עַל פְּנֵי מָיִם
  choice: जल की सतह पर
  rationale: פְּנֵי का शाब्दिक भाव ‘मुख/सतह’ है। यह चयन आधुनिक हिन्दी में स्वाभाविक रहते हुए स्थान-संबंधी बिंब को सुरक्षित रखता है।
- source_word: עַד תַּכְלִית
  choice: सीमा तक
  rationale: עַד विस्तार की अंतिम हद और תַּכְלִית अंत या सीमा को दर्शाता है। ‘सीमा तक’ हिब्रू संरचना और उसके काव्यात्मक संक्षेप को बनाए रखता है।
- source_word: אוֹר עִם חֹשֶׁךְ
  choice: प्रकाश और अंधकार की
  rationale: शाब्दिक संरचना ‘अंधकार के साथ प्रकाश’ है। ‘प्रकाश और अंधकार की सीमा’ दोनों के मिलन या विभाजन की रेखा को स्वाभाविक हिन्दी में व्यक्त करती है, बिना संबंध को आवश्यकता से अधिक स्पष्ट किए।
