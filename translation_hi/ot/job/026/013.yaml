  text: By his breath the heavens are made fair[c][b][a]; his hand pierced the fleeing serpent.
translation:
  language: hi
  text: उसने अपनी साँस से[a] आकाश को सुशोभित किया; उसके हाथ ने भागते हुए सर्प[c] को बेध दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आत्मा से” अथवा “उसकी हवा से।” इब्रानी शब्द का अर्थ साँस, हवा या आत्मा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “को आकार दिया।” इब्रानी क्रिया को अलग तरह से समझा जा सकता है, यद्यपि “बेध दिया” इस पंक्ति के संघर्ष के बिंब से अधिक मेल खाता है।
    reason: alternative_reading
  - marker: c
    text: “भागते हुए सर्प” संभवतः अराजकता से जुड़े किसी ब्रह्मांडीय सर्प का बिंब है; यशायाह 27:1 से तुलना करें।
    reason: cross_reference
lexical_decisions:
- source_word: בְּרוּחוֹ
  choice: उसकी साँस से
  rationale: רוּחַ का अर्थ साँस, वायु या आत्मा हो सकता है। यहाँ בְּ साधन का भाव देता है। मुख्य पाठ में ‘साँस’ काव्यात्मक और सजीव बिंब को बनाए रखता है तथा किसी विशिष्ट धर्मवैज्ञानिक अर्थ को अनिवार्य नहीं बनाता।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: इस काव्यात्मक ब्रह्मांडीय संदर्भ में שָׁמַיִם दृश्य आकाश अथवा आकाशमंडल को सूचित करता है। आधुनिक हिन्दी में ‘आकाश’ स्वाभाविक और गरिमापूर्ण है।
- source_word: שִׁפְרָה
  choice: सुशोभित हो गया
  rationale: שׁפר यहाँ सुन्दर, उज्ज्वल या शोभायमान होने का भाव देता है। ‘सुशोभित हो गया’ परमेश्वर की क्रिया के फलस्वरूप आकाश की शोभा को व्यक्त करता है।
- source_word: חֹלֲלָה
  choice: बेध दिया
  rationale: इस काव्यात्मक रूप के अर्थ में अनिश्चितता है; यह बेधने, उत्पन्न करने या आकार देने से जुड़ा समझा गया है। ‘बेध दिया’ हाथ को कर्ता मानते हुए युद्ध और अराजकता पर विजय के बिंब के साथ सर्वाधिक सहज बैठता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָדוֹ
  choice: उसके हाथ ने
  rationale: मूल का ठोस शारीरिक बिंब सुरक्षित रखा गया है; काव्य में ‘हाथ’ सक्रिय सामर्थ्य को भी व्यक्त करता है।
- source_word: נָחָשׁ בָּרִיחַ
  choice: भागते हुए सर्प
  rationale: בָּרִיחַ का अर्थ भागता हुआ, सरकता हुआ या लम्बा/सीधा समझा जा सकता है। ‘भागते हुए सर्प’ ब्रह्मांडीय संघर्ष के सम्भावित बिंब को बिना उसकी पहचान तय किए सुरक्षित रखता है।
theological_decisions:
- issue: क्या רוּחַ को ‘आत्मा’ कहकर एक स्पष्ट व्यक्तिगत या त्रित्व-संबंधी संकेत माना जाए
  choice: मुख्य पाठ में ‘साँस’
  alternative: ‘आत्मा’ या ‘वायु’
  rationale: इब्रानी शब्द इन तीनों अर्थों की अनुमति देता है, पर इस पद में स्पष्ट रूप से किसी विशिष्ट धर्मवैज्ञानिक अर्थ को अनिवार्य नहीं करता। ‘साँस’ सृजनात्मक सामर्थ्य का काव्यात्मक बिंब रखता है और अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित हैं।
- issue: क्या נָחָשׁ בָּרִיחַ की पहचान शैतान या लिव्यातान के रूप में मुख्य पाठ में की जाए
  choice: ‘भागते हुए सर्प’ के बिंब को ज्यों का त्यों रखा गया
  alternative: लिव्यातान, अराजकता का ब्रह्मांडीय सर्प, या शैतान
  rationale: पद ब्रह्मांडीय संघर्ष का संकेत दे सकता है, पर सर्प की स्पष्ट पहचान नहीं करता। इसलिए अनुवाद मूल की धर्मवैज्ञानिक अनिश्चितता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘सुशोभित’ और ‘सर्प’ काव्य की गरिमा बनाए रखते हैं, जबकि वाक्य-विन्यास साधारण पाठक के लिए स्पष्ट है। पादटिप्पणी-चिह्न सम्बंधित शब्दों के तुरंत बाद दिए गए हैं।
