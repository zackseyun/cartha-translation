  text: He stretches out the north over emptiness[b][a]; he hangs the earth on nothing.
translation:
  language: hi
  text: 'वह उत्तर दिशा[a] को सूनेपन[b] के ऊपर फैलाता है;

    वह पृथ्वी को बिना किसी सहारे लटकाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्तरी आकाश।’ इब्रानी में केवल ‘उत्तर’ है, जो इस काव्यात्मक प्रसंग में उत्तरी आकाश को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘शून्यता’ अथवा ‘उजाड़पन।’ इब्रानी शब्द खालीपन, उजाड़पन या निराकार शून्यता का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹטֶה
  choice: फैलाता है
  rationale: נטה के काल-निरपेक्ष कृदन्तीय रूप का अर्थ फैलाना या तानना है। यहाँ ‘फैलाता है’ आकाशीय विस्तार की काव्यात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צָפוֹן
  choice: उत्तर दिशा
  rationale: शब्द का सामान्य अर्थ ‘उत्तर’ है। इस काव्यात्मक ब्रह्माण्डीय प्रसंग में यह उत्तरी आकाश की ओर संकेत कर सकता है, इसलिए मूल की संक्षिप्तता मुख्य पाठ में रखकर विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: תֹּהוּ
  choice: सूनापन
  rationale: תֹהוּ खालीपन, उजाड़पन या निराकार शून्यता को व्यक्त कर सकता है। ‘सूनापन’ सामान्य आधुनिक हिन्दी में बोधगम्य है और किसी एक दार्शनिक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תֹּלֶה
  choice: लटकाता है
  rationale: תלה का सीधा अर्थ लटकाना या टाँगना है। ‘लटकाता है’ मूल की ब्रह्माण्डीय काव्य-छवि को स्पष्ट रूप से रखता है।
- source_word: אֶרֶץ
  choice: पृथ्वी
  rationale: इस ब्रह्माण्डीय प्रसंग में אֶרֶץ किसी विशेष भूभाग के बजाय पूरी पृथ्वी को दर्शाता है।
- source_word: עַל בְּלִי מָה
  choice: बिना किसी सहारे
  rationale: शाब्दिक भाव ‘किसी वस्तु पर नहीं’ या ‘कुछ भी नहीं पर’ है। हिन्दी में ‘बिना किसी सहारे लटकाता है’ उसी विरोधाभासी काव्य-छवि को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: עַל
  choice: के ऊपर / बिना किसी सहारे
  rationale: पहले खंड में עַל का स्थानवाचक अर्थ ‘के ऊपर’ है। दूसरे खंड में בְּלִי מָה के साथ उसका स्वाभाविक हिन्दी रूप ‘बिना किसी सहारे’ बनाया गया है।
theological_decisions:
- issue: ब्रह्माण्डीय काव्य-चित्रण
  choice: पद को सृष्टि पर परमेश्वर के अधिकार का काव्यात्मक वर्णन रखते हुए अनूदित किया गया है।
  alternative: इसे आधुनिक विज्ञान का सटीक कथन मानना, अथवा ‘उत्तर’ को स्पष्ट पौराणिक संकेत बनाकर विस्तार देना।
  rationale: मूल इब्रानी ज्ञान-साहित्य की काव्यात्मक भाषा में ब्रह्माण्ड की विस्मयकारी व्यवस्था का वर्णन करता है। अनुवाद न तो इस चित्रण को आधुनिक वैज्ञानिक शब्दावली में बदलता है, न ही संदिग्ध पौराणिक पृष्ठभूमि को मुख्य पाठ में जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज काव्यात्मक शैली अपनाई गई है। ‘उत्तर दिशा’ मूल के सीधे अर्थ को रखता है, जबकि ‘बिना किसी सहारे’ हिन्दी में दूसरे खंड की छवि को स्वाभाविक बनाता है।
