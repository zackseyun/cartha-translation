base_translation:
  language: en
  yaml_path: translation/ot/job/026/011.yaml
  text: The pillars of heaven tremble and are astonished at his rebuke[a][b][c].
translation:
  language: hi
  text: 'आकाश के खम्भे थरथराते हैं[a]

    और उसकी डाँट से स्तब्ध रह जाते हैं[b][c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “काँप उठते हैं।”
    reason: lexical_alternative
  - marker: b
    text: या “चकित हो जाते हैं” अथवा “विस्मय से भर जाते हैं।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “उसकी डाँट से”; यहाँ “से” स्रोत अथवा कारण, अर्थात् “उसकी डाँट के कारण,” दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמּוּדֵי שָׁמַיִם
  choice: आकाश के खम्भे
  rationale: यह पदबंध मूल के ‘स्तम्भों/खम्भों’ वाले ब्रह्माण्डीय काव्य-बिम्ब को बनाए रखता है। ‘आकाश की नींवें’ कहना मूल बिम्ब की अनावश्यक व्याख्या होती।
- source_word: יְרוֹפָפוּ
  choice: थरथराते हैं
  rationale: रפף से कम्पन या काँपने का भाव निकलता है। ‘थरथराते’ काव्यात्मक प्रसंग में गति और भय-विस्मय दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיִתְמְהוּ
  choice: और ... स्तब्ध रह जाते हैं
  rationale: תמהּ विस्मित, चकित या स्तब्ध हो जाने का भाव देता है। ‘स्तब्ध रह जाते हैं’ पहले क्रियापद के समानान्तर तीव्र प्रतिक्रिया दर्शाता है, पर नैतिक घृणा का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: מִגַּעֲרָתוֹ
  choice: उसकी डाँट से
  rationale: מִן यहाँ स्रोत अथवा कारण सूचित कर सकता है। ‘से’ हिन्दी में दोनों सम्भावनाओं को संक्षेप में खुला रखता है; ‘डाँट’ גערה की कठोर, धमकाने वाली वाणी को सामान्य आधुनिक हिन्दी में व्यक्त करती है।
theological_decisions:
- issue: ‘आकाश के खम्भे’ का ब्रह्माण्डीय बिम्ब
  choice: काव्यात्मक ब्रह्माण्डीय बिम्ब को ज्यों का त्यों बनाए रखना
  alternative: इसे पहाड़ों के रूपक के रूप में स्पष्ट करना अथवा आधुनिक ब्रह्माण्ड-विज्ञान के अनुरूप ढालना
  rationale: मूल कविता स्वयं इस बिम्ब की व्याख्या नहीं करती। अनुवाद इसे न शाब्दिक वैज्ञानिक कथन बनाए, न समझाकर उसकी वास्तविक काव्यात्मक और धर्मवैचारिक तनाव को मिटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘खम्भे,’ ‘थरथराते’ और ‘डाँट’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि मूल की सजीव ब्रह्माण्डीय छवि और कारण/स्रोत की हल्की अस्पष्टता सुरक्षित रहती है।
