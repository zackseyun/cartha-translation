  text: तुमने निर्बल की कैसी सहायता की है! तुमने शक्तिहीन भुजा को कैसे बचाया है![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “तुमने बिना सामर्थ्य वाले की क्या सहायता की? तुमने क्या बचाया—ऐसी भुजा जिसमें बल नहीं?” इब्रानी में यह तीखा व्यंग्य है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מֶה
  choice: कैसी / कैसा
  rationale: यहाँ प्रश्नवाचक शब्द तीखे व्यंग्यपूर्ण विस्मय के रूप में प्रयुक्त है; हिंदी में ‘कैसी/कैसा’ उस आलंकारिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָזַרְתָּ
  choice: तुमने ... सहायता की है
  rationale: עזר का सीधा अर्थ ‘सहायता करना’ है; पूर्ण क्रिया को वर्तमान पूर्ण काल में रखकर प्रत्यक्ष संबोधन का व्यंग्यपूर्ण बल बनाए रखा गया है।
- source_word: לְלֹא כֹחַ
  choice: निर्बल की
  rationale: इस पदबंध का आशय ऐसे व्यक्ति से है जिसमें सामर्थ्य नहीं; ‘निर्बल’ संक्षिप्त, स्वाभाविक और एकवचन-संगत है।
- source_word: הוֹשַׁעְתָּ
  choice: तुमने ... बचाया है
  rationale: ישׁע का अर्थ बचाना या छुड़ाना है; ‘बचाया’ यहाँ स्पष्ट और सामान्य आधुनिक हिंदी है।
- source_word: זְרוֹעַ
  choice: भुजा
  rationale: मूल का शाब्दिक काव्य-बिंब ‘भुजा’ बनाए रखा गया है, जो सामर्थ्य का भी संकेत देता है।
- source_word: לֹא עֹז
  choice: शक्तिहीन
  rationale: עֹז सामर्थ्य या पराक्रम को दर्शाता है; ‘शक्तिहीन’ भुजा के साथ स्वाभाविक है और पहले अर्धपद के समानांतर भाव को बनाए रखता है।
