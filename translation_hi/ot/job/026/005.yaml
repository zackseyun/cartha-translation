- source_word: וְשֹׁכְנֵיהֶם
  choice: और उनमें रहनेवाले भी
  rationale: बहुवचन प्रत्यय को निकटवर्ती ‘जल’ से जोड़ते हुए मूल की समानांतर रचना और संदर्भ की अस्पष्टता को यथासम्भव सुरक्षित रखा गया है। ‘भी’ हिन्दी में क्रिया के लोप वाले दूसरे पद को स्वाभाविक बनाता है।
