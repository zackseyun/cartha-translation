  to: देखो, ये उसके मार्गों के केवल छोर हैं[a]; और उसके विषय में हमें क्या ही हल्की-सी फुसफुसाहट सुनाई देती है![b] पर उसके सामर्थ्य की गरज को कौन समझ सकता है?
