language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֶן אֵ֤לֶּה קְצ֬וֹת דרכ/ו וּ/מַה שֵּׁ֣מֶץ דָּ֭בָר נִשְׁמַע בּ֑/וֹ וְ/רַ֥עַם גבורת/ו מִ֣י יִתְבּוֹנָֽן־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/job/026/014.yaml
  text: Look[a], these are the fringes of his ways[b], and what a mere whisper we hear of him! But the thunder of his power—who can understand it?
translation:
  language: hi
  text: देखो, ये उसके मार्गों के केवल छोर हैं[a]; और उसके विषय में हमें क्या ही हल्की-सी फुसफुसाहट सुनाई देती है![b] पर उसके सामर्थ्य की गरज को कौन समझ सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मार्गों के बाहरी किनारे।” इब्रानी शब्द संकेत करता है कि यहाँ परमेश्वर जो करता है, उसके केवल सबसे बाहरी सिरे ही दृष्टि में हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके विषय में किसी बात की कितनी मंद भनक हमें सुनाई देती है!” यह दुर्लभ इब्रानी अभिव्यक्ति बताती है कि उसके सामर्थ्य की “गरज” की तुलना में मनुष्य कितना थोड़ा सुन पाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में इसका बल बनाए रखता है।
- source_word: קְצוֹת
  choice: केवल छोर
  rationale: शब्द का अर्थ किनारे या अंतिम सिरे हैं। ‘केवल छोर’ बताता है कि परमेश्वर के कार्यों का अत्यल्प बाहरी भाग ही मनुष्य को दिखाई देता है।
- source_word: דרכיו
  choice: उसके मार्गों
  rationale: ‘मार्ग’ परमेश्वर के काम करने के ढंग का रूपक बनाए रखता है और अर्थ को केवल ‘कामों’ तक सीमित नहीं करता।
- source_word: שֵׁמֶץ דָּבָר
  choice: धीमी-सी फुसफुसाहट
  rationale: दुर्लभ पदबंध बहुत थोड़ी मात्रा अथवा मंद सुनाई देने वाली बात को व्यक्त करता है। ‘फुसफुसाहट’ सुनने की बिंबावली को बनाए रखती है और आगे की ‘गर्जना’ से प्रभावी विरोध रचती है।
- source_word: נִשְׁמַע בּוֹ
  choice: उसके विषय में हमें ... सुनाई देती है
  rationale: संदर्भ में सामूहिक मानवीय अनुभव अभिप्रेत है। ‘उसके विषय में’ यह स्पष्ट करता है कि बात परमेश्वर के संबंध में मनुष्य की सीमित अनुभूति की है, न कि केवल उससे सीधे मिले वचन की।
- source_word: רַעַם גְּבוּרָתוֹ
  choice: उसके सामर्थ्य की गर्जना
  rationale: רַעַם मूलतः मेघ-गर्जन है और גְּבוּרָה शक्ति या सामर्थ्य। यह रूपांतरण फुसफुसाहट और प्रचंड गर्जना का श्रव्य विरोध सुरक्षित रखता है।
- source_word: יִתְבּוֹנָן
  choice: समझ सकता है
  rationale: क्रिया ध्यानपूर्वक समझने या बूझने का भाव देती है। प्रश्नवाचक रूप मानवीय असमर्थता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के मार्गों के विषय में मानवीय ज्ञान की सीमा
  choice: पद कहता है कि मनुष्य परमेश्वर के मार्गों के केवल बाहरी छोर और उसके सामर्थ्य की अत्यंत मंद झलक ही ग्रहण करता है।
  alternative: इसे अधिक संकीर्ण रूप में केवल सृष्टि में दिखाई देने वाले परमेश्वर के कार्यों के बारे में कहा हुआ समझा जा सकता है।
  rationale: निकटवर्ती संदर्भ परमेश्वर के ब्रह्मांडीय कार्यों का वर्णन करता है, जबकि ‘छोर’, ‘फुसफुसाहट’ और ‘गर्जना’ की भाषा मनुष्य की सीमित समझ पर बल देती है। अनुवाद इस तनाव को बनाए रखता है और कविता से परे कोई व्यापक दार्शनिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली। ‘फुसफुसाहट’ तथा ‘गर्जना’ के श्रव्य विरोध को सुरक्षित रखा गया है। सर्वनाम मूल पाठ की तरह परमेश्वर की ओर संकेत करते हैं; पद में अलग से ‘परमेश्वर’ नहीं जोड़ा गया।
