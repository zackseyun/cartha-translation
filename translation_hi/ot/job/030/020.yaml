base_translation:
  language: en
  yaml_path: translation/ot/job/030/020.yaml
  text: I cry out to you[a], but you do not answer me; I stand, and you only look at me.
translation:
  language: hi
  text: 'मैं सहायता के लिए तेरी दुहाई देता हूँ, पर तू मुझे उत्तर नहीं देता;

    मैं खड़ा हूँ, और तू बस मुझे देखता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं खड़ा हुआ, और तूने मुझे ध्यान से देखा।” इब्रानी क्रियाएँ यहाँ भूतकाल का अर्थ दे सकती हैं, और “देखने” में ध्यानपूर्वक देखने या विचार करने का भाव भी हो सकता है।
    reason: काल और शब्दार्थ की वास्तविक वैकल्पिक सम्भावना
lexical_decisions:
- source_word: אֲשַׁוַּע
  choice: मैं सहायता के लिए दुहाई देता हूँ
  rationale: पिएल रूप एक तीव्र पुकार या सहायता की व्याकुल याचना व्यक्त करता है। ‘दुहाई देता हूँ’ उसकी तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֵלֶיךָ
  choice: तेरी
  rationale: אֶל के साथ द्वितीय पुरुष एकवचन प्रत्यय पुकार की दिशा बताता है; हिन्दी में ‘तेरी दुहाई देता हूँ’ इसका स्वाभाविक रूप है।
- source_word: וְלֹא תַעֲנֵנִי
  choice: पर तू मुझे उत्तर नहीं देता
  rationale: ענה का सीधा अर्थ ‘उत्तर देना’ है। ‘पर’ उत्तर न मिलने और पुकारने के बीच का स्पष्ट विरोध व्यक्त करता है।
- source_word: עָמַדְתִּי
  choice: मैं खड़ा रहता हूँ
  rationale: रूप व्याकरणतः पूर्णकालिक है, पर विलाप के वर्तमान प्रवाह में इसे निरंतर वर्तमान के रूप में समझना सम्भव है। ‘खड़ा रहता हूँ’ अय्यूब की जारी प्रतीक्षा को स्वाभाविक हिन्दी में व्यक्त करता है; भूतकाल की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: וַתִּתְבֹּנֶן בִּי
  choice: तू बस मुझे देखता रहता है
  rationale: התבונן ध्यान से देखने या विचारपूर्वक देखने का भाव रख सकता है। संदर्भ में उत्तर देने के बजाय देखते रहने का विरोध निहित है; ‘बस’ उसी विरोध को व्यक्त करता है, जबकि ‘देखता रहता है’ अनावश्यक रूप से ‘उपेक्षा’ नहीं जोड़ता।
theological_decisions:
- issue: परमेश्वर की प्रतिक्रिया-विहीनता को इब्रानी पाठ से अधिक आरोपात्मक बनाना
  choice: अनुत्तरित पुकार और देखते रहने की शिकायत को बनाए रखना
  alternative: ‘तू मुझे बचाता नहीं’ या ‘तू मेरी उपेक्षा करता है’
  rationale: इब्रानी पाठ स्पष्ट रूप से उत्तर न देने और देखने की बात करता है, पर ‘न बचाने’ या ‘उपेक्षा करने’ को सीधे नहीं कहता। इसलिए अनसुलझे धार्मिक तनाव और अय्यूब की शिकायत दोनों सुरक्षित रखे गए हैं।
- issue: क्रियाओं का काल
  choice: विलाप के वर्तमान प्रवाह के अनुसार वर्तमानकालीन प्रस्तुति
  alternative: ‘मैं खड़ा हुआ, और तूने मुझे ध्यान से देखा’
  rationale: עָמַדְתִּי पूर्ण रूप और וַתִּתְבֹּנֶן अनुक्रमिक रूप भूतकाल में लिए जा सकते हैं, किंतु निकट संदर्भ में वर्तमान शिकायत के रूप में पढ़ना भी उचित है। वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक विलाप। परमेश्वर को एकवचन निकट संबोधन ‘तू’ से संबोधित किया गया है, जो इब्रानी के एकवचन रूप और हिन्दी की पारंपरिक प्रार्थना-भाषा के अनुरूप है। ‘दुहाई’ तीव्र सहायता-पुकार को साधारण पाठक के लिए संक्षिप्त और प्रभावी ढंग से व्यक्त करती है।
