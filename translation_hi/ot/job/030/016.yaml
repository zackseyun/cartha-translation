  text: And now my soul is poured out within me[a]; days of affliction seize me.
translation:
  language: hi
  text: और अब मेरा प्राण मेरे भीतर उँडेला जा रहा है[a]; दुःख के दिन मुझे जकड़ लेते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरा प्राण मुझ पर उँडेला जा रहा है।” इब्रानी में पूर्वसर्ग का शाब्दिक अर्थ “मुझ पर” है, पर यह अभिव्यक्ति संभवतः भीतर से टूट जाने या चुक जाने की दशा बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह कालसूचक संयोजक अय्यूब की वर्तमान दशा को पिछली बातों से जोड़ता है; ‘और अब’ संबंध को बनाए रखता है, बिना विरोध का भाव अनावश्यक रूप से प्रबल किए।
- source_word: עָלַי
  choice: मेरे भीतर
  rationale: इब्रानी पूर्वसर्ग का शाब्दिक अर्थ ‘मुझ पर’ है, पर נפשי और ‘उँडेला जाना’ के साथ यह भीतर से टूटने या चुक जाने की दशा व्यक्त करता प्रतीत होता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: תִּשְׁתַּפֵּךְ
  choice: उँडेला जा रहा है
  rationale: यह चयन मूल के उँडेलने के रूपक और जारी अवस्था दोनों को सुरक्षित रखता है; ‘गलता जा रहा है’ अधिक व्याख्यात्मक होता।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נפש यहाँ व्यक्ति के भीतरी जीवित स्व या जीवन को सूचित करता है। ‘प्राण’ हिन्दी में काव्यात्मक गरिमा और आंतरिक व्यथा दोनों रखता है, जबकि ‘आत्मा’ अनावश्यक रूप से विशिष्ट तात्त्विक अर्थ ला सकती है।
- source_word: יֹאחֲזוּנִי
  choice: मुझे जकड़ लेते हैं
  rationale: אחז के पकड़ने या अपने वश में करने के प्रबल भाव को स्वाभाविक और सजीव हिन्दी में व्यक्त करता है।
- source_word: יְמֵי עֹנִי
  choice: दुःख के दिन
  rationale: עֹנִי इस प्रसंग में व्यापक पीड़ा, दीनता और क्लेश को दर्शाता है, केवल आर्थिक गरीबी को नहीं; ‘दुःख’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है।
