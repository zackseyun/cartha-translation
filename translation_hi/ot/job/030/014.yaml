  text: Like a wide breach they come[a]; amid the crash they roll on.
translation:
  language: hi
  text: वे एक चौड़ी सेंध के समान आते हैं[a]; ध्वंस के बीच वे लुढ़कते चले आते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो एक चौड़ी सेंध में से वे आते हैं; ध्वंस के नीचे वे लुढ़कते चले आते हैं।”
    reason: כְפֶרֶץ को तुलना (“सेंध के समान”) या मार्ग (“सेंध में से”) के रूप में समझा जा सकता है। תַּחַת का सामान्य अर्थ “नीचे” है, जबकि इस काव्यात्मक संदर्भ में वह परिस्थिति का भाव भी दे सकता है; इसलिए वैकल्पिक अधिक शाब्दिक रचना दी गई है।
lexical_decisions:
- source_word: כְּ/פֶרֶץ
  choice: दरार के समान
  rationale: פֶרֶץ दीवार में पड़ी दरार या टूटे हुए खुले भाग को दर्शाता है; उपसर्ग כְּ तुलना प्रकट करता है। यह रूप मूल उपमा और विध्वंसकारी दृश्य—दोनों को बनाए रखता है।
- source_word: רָחָב
  choice: चौड़ी
  rationale: यह विशेषण פֶרֶץ के विस्तृत खुले भाग पर बल देता है। ‘चौड़ी’ आधुनिक हिन्दी में सहज और ठोस है।
- source_word: יֶאֱתָיוּ
  choice: वे आते हैं
  rationale: क्रिया यहाँ आने या आगे बढ़ने का भाव देती है। ‘आते हैं’ काव्य की सजीव गति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: תַּחַת
  choice: के बीच
  rationale: תַּחַת का मूल अर्थ ‘नीचे’ है, पर यहाँ विनाशकारी घटना के घटित होने की परिस्थिति भी सम्भव है। मुख्य पाठ में सहज हिन्दी ‘के बीच’ रखी गई है और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: שֹׁאָה
  choice: विनाश की गड़गड़ाहट
  rationale: שֹׁאָה विनाश, उजाड़ अथवा विनाशकारी धमाके/गिरावट का बोध करा सकता है। संयुक्त अभिव्यक्ति परिणाम और आकस्मिक ध्वंस—दोनों पहलुओं को हिन्दी में सजीव रखती है।
- source_word: הִתְגַּלְגָּלוּ
  choice: वे लुढ़कते चले आते हैं
  rationale: גלל का हित्पएल रूप लुढ़कने या उमड़ते हुए आगे आने की गतिशील छवि देता है। यह हिन्दी रूप उस निरन्तर और अनियंत्रित गति को स्वाभाविक ढंग से व्यक्त करता है।
