  register: आधुनिक मानक हिन्दी में काव्यात्मक, सजीव और गरिमापूर्ण शैली रखी गई है। दीवार टूटने और आक्रमणकारियों के अनियंत्रित उमड़ने की मूल छवि सुरक्षित है; स्रोत की स्थानगत/परिस्थितिगत अस्पष्टता पादटिप्पणी में दी गई है।
