  verdict: approve
  source_fidelity: The translation accurately conveys the explanatory כִּי ('क्योंकि'), Job's hopeful expectation of good, and the twofold reversal in which adversity and darkness come instead. ‘विपत्ति’ correctly reflects רָע in this lament context as calamity rather than moral evil. The contrast of ‘उजाले’ and ‘घोर अँधेरे’ preserves the Hebrew imagery, including the force of אֹפֶל.
  naturalness: The Hindi is fluent, dignified, and suitably poetic without being obscure. ‘उजाले की बाट जोही’ is an established and natural literary expression for expectant waiting, and the differing gender- and idiom-appropriate forms ‘आ पड़ी’ and ‘आ गया’ remain faithful to the repeated Hebrew verb.
  terminology: ‘भलाई/विपत्ति’ and ‘उजाला/घोर अँधेरा’ provide clear, contextually apt contrasts. The footnote responsibly identifies ‘बुराई’ and ‘अनिष्ट’ as alternatives and explains that the contextual meaning is adversity, without imposing an interpretive doctrine.
