base_translation:
  language: en
  yaml_path: translation/ot/job/030/026.yaml
  text: For I hoped for good[a], but evil came; I waited for light, but darkness came.
translation:
  language: hi
  text: क्योंकि मैंने भलाई की आशा की, पर विपत्ति[a] आ पड़ी; मैंने उजाले की बाट जोही, पर घोर अँधेरा आ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई” अथवा “अनिष्ट”; यहाँ इब्रानी शब्द का अर्थ नैतिक बुराई के बजाय विपत्ति या दुःख होना अधिक संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद अय्यूब के विलाप का कारण या स्पष्टीकरण प्रस्तुत करता है; ‘क्योंकि’ उसके व्याख्यात्मक बल को स्वाभाविक हिंदी में रखता है।
- source_word: טוֹב
  choice: भलाई
  rationale: यह विशेषण यहाँ संज्ञा की तरह प्रयुक्त है और हितकर अथवा अनुकूल दशा को सूचित करता है। ‘भलाई’ व्यापक अर्थ और विरोध को बनाए रखती है।
- source_word: קִוִּיתִי
  choice: मैंने ... आशा की
  rationale: क्रिया आशापूर्ण अपेक्षा व्यक्त करती है; यह हिंदी में भाव को सीधे और स्वाभाविक ढंग से पहुँचाती है।
- source_word: וַיָּבֹא
  choice: आ पड़ी / आ गया
  rationale: मूल में दोहराई गई ‘आना’ क्रिया को दोनों पंक्तियों में रखा गया है; हिंदी में संज्ञाओं के अनुसार लिंग और मुहावरे के कारण रूप अलग हैं।
- source_word: רָע
  choice: विपत्ति
  rationale: इस विलाप में शब्द का संकेत नैतिक बुराई से अधिक अनिष्ट, दुःख या आपदा की ओर है। ‘विपत्ति’ प्रसंगगत अर्थ स्पष्ट करती है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प बताती है।
- source_word: אֲיַחֲלָה
  choice: मैंने ... बाट जोही
  rationale: क्रिया आशा के साथ प्रतीक्षा करने का भाव रखती है। ‘बाट जोही’ इस अपेक्षापूर्ण प्रतीक्षा को सहज, गरिमापूर्ण हिंदी में व्यक्त करती है और पहली क्रिया से भेद भी बनाए रखती है।
- source_word: לְאוֹר
  choice: उजाले की
  rationale: ‘उजाला’ मूल के प्रकाश-बिंब को बिना रूपक की व्याख्या किए स्वाभाविक हिंदी में बनाए रखता है।
- source_word: אֹפֶל
  choice: घोर अँधेरा
  rationale: यह सामान्य अंधकार से अधिक गहरे अंधकार या तमस का शब्द है; ‘घोर अँधेरा’ उसकी तीव्रता और उजाले के साथ विरोध को व्यक्त करता है।
