  text: उनके हाथों की ताकत भी मेरे किस काम की है? उनका दमखम नष्ट हो चुका है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी चरम अवस्था नष्ट हो चुकी है’ या ‘उनकी पूरी सामर्थ्य नष्ट हो चुकी है।’ दुर्लभ इब्रानी संज्ञा परिपक्व आयु, चरम अवस्था, या पूर्ण शक्ति को सूचित कर सकती है।
