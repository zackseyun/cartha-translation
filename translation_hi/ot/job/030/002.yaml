lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह अय्यूब के तिरस्कारपूर्ण तर्क में एक और बात जोड़ता है; हिंदी में ‘भी’ इसका स्वाभाविक समतुल्य है।
- source_word: כֹּחַ יְדֵיהֶם
  choice: उनके हाथों की ताकत
  rationale: मूल का ठोस बिंब बनाए रखता है, जिसमें ‘हाथ’ काम करने की व्यावहारिक क्षमता को दर्शाते हैं।
- source_word: לָמָה לִּי
  choice: मेरे किस काम की?
  rationale: यह लाभहीनता और उपेक्षा व्यक्त करने वाला स्वाभाविक हिंदी प्रश्न है, साथ ही मूल की आलंकारिक शक्ति बनाए रखता है।
- source_word: עָלֵימוֹ אָבַד
  choice: उनका ... जाता रहा है
  rationale: संदर्भ में संबंधवाचक अर्थ लेकर उनके भीतर की क्षमता के पूर्णतः लुप्त हो जाने को सहज हिंदी में व्यक्त करता है।
- source_word: כָּלַח
  choice: दमखम
  rationale: यह दुर्लभ और कठिन संज्ञा यहाँ प्रौढ़ सामर्थ्य, यौवन की पूर्ण शक्ति या जीवट की ओर संकेत कर सकती है; ‘दमखम’ शारीरिक सामर्थ्य के संदर्भ में स्वाभाविक और व्यापक रूप से बोधगम्य है।
