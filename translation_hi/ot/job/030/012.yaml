  text: עַל יָמִין֮ פִּרְחַ֪ח יָ֫ק֥וּמוּ רַגְלַ֥/י שִׁלֵּ֑חוּ וַ/יָּסֹ֥לּוּ עָ֝לַ֗/י אָרְח֥וֹת אֵידָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/012.yaml
  text: On my right, a brood rises up[a]; they send my feet away[c][b], and they build up against me their paths of disaster.
translation:
  language: hi
  text: मेरी दाहिनी ओर एक उपद्रवी झुंड[a] उठ खड़ा होता है; वे मेरे पाँवों को दूर भेज देते हैं[b] और मेरे विरुद्ध अपने विनाश के मार्ग बना देते हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बदमाशों का झुंड।” इब्रानी शब्द פִּרְחַח दुर्लभ है और किसी तुच्छ समझे जाने वाले या उच्छृंखल समूह के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “वे मेरे पाँवों को दूर भेजते हैं।” आशय यह हो सकता है कि वे मेरे पाँव उखाड़ देते हैं, मुझे राह से हटा देते हैं, या मुझे ठोकर खिलाते हैं।
    reason: lexical_alternative
  - marker: c
    text: या, “वे मेरे विरुद्ध अपनी विपत्ति/बरबादी की राहें ऊँची करते हैं।” इब्रानी में शत्रुतापूर्ण अर्थ के साथ मार्ग को ऊँचा उठाकर बनाने का बिंब बना रहता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל יָמִין
  choice: मेरी दाहिनी ओर
  rationale: वाक्यांश स्थान बताता है। यद्यपि इब्रानी में संबंधसूचक प्रत्यय नहीं है, प्रसंग अय्यूब की दाहिनी ओर शत्रुतापूर्ण स्थिति लेने का है; इसलिए सहज हिन्दी में ‘मेरी दाहिनी ओर’ कहा गया है।
- source_word: פִּרְחַח
  choice: एक उपद्रवी झुंड
  rationale: यह दुर्लभ सामूहिक संज्ञा तिरस्कार की छाया लिए हुए किसी उच्छृंखल या निकृष्ट समूह को सूचित करती है। ‘उपद्रवी झुंड’ सामूहिक अर्थ और वक्ता की अवमानना दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: יָקוּמוּ
  choice: उठ खड़ा होता है
  rationale: קום यहाँ केवल खड़े होने के बजाय विरोध में उठने या मोर्चा लेने का भाव देता है। क्रिया का एकवचन हिन्दी में सामूहिक संज्ञा ‘झुंड’ के अनुरूप है।
- source_word: רַגְלַי שִׁלֵּחוּ
  choice: वे मेरे पाँवों को दूर हटा देते हैं
  rationale: इब्रानी पदबंध कठिन है और शब्दशः ‘मेरे पाँवों को दूर भेजते/छोड़ते हैं’ के निकट है। चुना हुआ रूप असामान्य शारीरिक बिंब को बनाए रखता है, जबकि पाँव उखाड़ने, राह से हटाने या ठोकर दिलाने की संभावित व्याख्याओं को पादटिप्पणी में खुला छोड़ता है।
- source_word: וַיָּסֹלּוּ
  choice: बना देते हैं
  rationale: סלל सड़क या मार्ग को उठाकर बनाने अथवा तैयार करने के लिए प्रयुक्त होता है। ‘बना देते हैं’ आगे आने वाले मार्ग-बिंब को स्पष्ट और स्वाभाविक रखता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: शत्रुतापूर्ण प्रसंग में यह संबंध केवल स्थानसूचक नहीं, बल्कि विरोधसूचक है।
- source_word: אָרְחוֹת אֵידָם
  choice: अपने विनाश के मार्ग
  rationale: אֹרַח का अर्थ मार्ग और אֵיד का अर्थ विपत्ति, विनाश या बरबादी है। प्रत्यय को ‘अपने’ के रूप में रखते हुए वाक्य उन विनाशकारी मार्गों को दर्शाता है जिन्हें वे अय्यूब के विरुद्ध तैयार करते हैं, पर यह निश्चित नहीं करता कि विनाश किस पर आना है।
