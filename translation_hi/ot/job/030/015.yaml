review_pass:
  verdict: revise
  source_fidelity: The draft captures the overall lament and both similes, but “उड़ा ले जाती हैं” adds a resultative ‘carry away’ sense not explicitly expressed by Hebrew תִּרְדֹּף, ‘pursue.’ The revised wording retains the pursuit image.
  naturalness: The revised Hindi is modern, poetic, and clear. “हवा की तरह ... पीछा करते हैं” preserves the Hebrew simile without turning it into an explicit image of being blown away.
  terminology: “प्रतिष्ठा” appropriately conveys the difficult נְדִבָתִי as honorable standing, with alternatives noted. “उद्धार” is retained for יְשֻׁעָתִי, while “छुटकारा” and “कुशलता” prevent a needlessly narrow doctrinal reading.
  issues:
  - severity: medium
    issue: The phrase “हवा की तरह उड़ा ले जाती हैं” overstates the action of the terrors.
    rationale: The Hebrew verb רדף means ‘pursue/chase.’ Although wind may imply swift dispersal poetically, the text does not explicitly say that Job’s standing is carried away.
  - severity: low
    issue: A single footnote marker combines two distinct lexical alternatives and is attached only at the end of the verse.
    rationale: Separate anchors at the relevant terms make the lexical notes clearer and better preserve the source terms’ distinct ambiguities.
