source:
  edition: WLC
  text: הָהְפַּ֥ךְ עָלַ֗/י בַּלָּ֫ה֥וֹת תִּרְדֹּ֣ף כָּ֭/רוּחַ נְדִבָתִ֑/י וּ֝/כְ/עָ֗ב עָבְרָ֥ה יְשֻׁעָתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/015.yaml
  text: Terrors are turned upon me[a]; they pursue my nobility like the wind[b], and my salvation passes away like a cloud.
translation:
  language: hi
  text: भय मुझ पर आ पड़े हैं; वे हवा की तरह मेरी प्रतिष्ठा का पीछा करते हैं,[a] और मेरा उद्धार बादल की तरह ओझल हो गया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रतिष्ठा” के लिए इब्रानी शब्द का अर्थ “कुलीनता,” “गरिमा” या “सम्मानपूर्ण ऊँची स्थिति” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “उद्धार” का अर्थ यहाँ “छुटकारा” या “कुशलता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָהְפַּךְ עָלַי בַּלָּהוֹת
  choice: भयावह बातें मुझ पर टूट पड़ी हैं
  rationale: הָהְפַּךְ का होफ़ाल रूप शाब्दिक रूप से ‘मेरे विरुद्ध/मुझ पर फेर दी गई हैं’ का भाव देता है। हिंदी में ‘मुझ पर टूट पड़ी हैं’ भयावह घटनाओं के अचानक आ पड़ने और परिणामकारी पक्ष को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּרְדֹּף
  choice: वे ... उड़ा ले जाती हैं
  rationale: मूल अर्थ ‘पीछा करना/खदेड़ना’ है, पर כָּרוּחַ के साथ यह हवा द्वारा किसी चीज़ को खदेड़कर दूर ले जाने का चित्र बनाता है। यह स्त्रीलिंग एकवचन क्रिया सामूहिक बहुवचन בַּלָּהוֹת से जुड़ी समझी गई है।
- source_word: נְדִבָתִי
  choice: मेरी प्रतिष्ठा
  rationale: यह कठिन शब्द कुलीनता, सम्मानपूर्ण ऊँची स्थिति या गरिमा को सूचित कर सकता है। अय्यूब की खोई हुई सामाजिक हैसियत के संदर्भ में ‘प्रतिष्ठा’ आधुनिक हिंदी में स्वाभाविक है और अर्थ को अत्यधिक संकीर्ण नहीं करती।
- source_word: כָּרוּחַ
  choice: हवा की तरह
  rationale: רוּחַ को यहाँ समानांतर बादल-चित्र के अनुरूप ‘हवा’ समझा गया है।
- source_word: וּכְעָב עָבְרָה
  choice: बादल की तरह बीत गया है
  rationale: עָב ‘बादल’ है और עבר यहाँ क्षणभंगुर होकर निकल जाने या लुप्त होने का भाव रखता है। पूर्णकालीन हिंदी मूल क्रिया के पूर्ण पक्ष को बनाए रखती है।
- source_word: יְשֻׁעָתִי
  choice: मेरा उद्धार
  rationale: יְשׁוּעָה संकट से बचाव, छुटकारा या कुशल-क्षेम का द्योतक हो सकता है। ‘उद्धार’ मूल शब्द से निकट है; संदर्भगत विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: יְשֻׁעָתִי को बाद की सिद्धांतगत अर्थवत्ता से अधिक भर देने की संभावना
  choice: मेरा उद्धार
  alternative: मेरा छुटकारा; मेरी कुशलता
  rationale: मुख्य पाठ स्रोत की पारंपरिक शाब्दिक धारणा बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ व्यक्तिगत संकट से बचाव या कल्याण भी अभिप्रेत हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गंभीर और सहज शैली। दोनों उपमाएँ—हवा और बादल—सुरक्षित रखी गई हैं। कठिन शब्द נְדִבָתִי तथा יְשֻׁעָתִי की अर्थगत व्यापकता पादटिप्पणी में संरक्षित है।
