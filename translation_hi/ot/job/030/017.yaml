  text: At night my bones are pierced in me[b][a], and my gnawing pains do not lie down.
translation:
  language: hi
  text: रात को मेरी हड्डियाँ मेरे भीतर बेधी जाती हैं[a], और मुझे कुतरने वाली पीड़ाएँ[b] विश्राम नहीं करतीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी हड्डियाँ मेरे ऊपर से आर-पार छेदी जाती हैं।” इब्रानी वाक्यांश कठिन है; क्रिया को अधिक सामान्य अर्थ में “कुतरना” भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी नसें,” “मेरी शिराएँ” अथवा “मेरे स्नायु।” यह इब्रानी शब्द दुर्लभ है और संभव है कि पीड़ाओं के बजाय शरीर की डोरियों या नलिकाओं को सीधे सूचित करता हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַיְלָה
  choice: रात को
  rationale: यह समय बताने वाला क्रियाविशेषणीय प्रयोग है; ‘रात को’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: עֲצָמַי
  choice: मेरी हड्डियाँ
  rationale: ठोस शारीरिक बिंब को बनाए रखने वाला सीधा अर्थ।
- source_word: נִקַּר מֵעָלָי
  choice: मेरे भीतर बिंधती हैं
  rationale: נקר का मूल भाव छेदने या बेधने का है। कठिन पूर्वसर्गीय पदबंध को शारीरिक पीड़ा के प्रसंग में स्वाभाविक हिन्दी में व्यक्त किया गया है, बिना बिंधने के तीखे बिंब को मिटाए।
- source_word: וְעֹרְקַי
  choice: मुझे कुतरने वाली पीड़ाएँ
  rationale: दुर्लभ और विवादित संज्ञा को समानांतर पंक्ति तथा निरंतर यातना के प्रसंग में पीड़ाओं के अर्थ में लिया गया है; शाब्दिक शारीरिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: לֹא יִשְׁכָּבוּן
  choice: विश्राम नहीं करतीं
  rationale: शाब्दिक अर्थ ‘लेटती नहीं’ है; हिन्दी में ‘विश्राम नहीं करतीं’ उसी मानवीकरण और न रुकने वाले कष्ट का भाव स्पष्ट रूप से देता है।
