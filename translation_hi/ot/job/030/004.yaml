translation:
  language: hi
  text: 'जो झाड़ियों के बीच खारी भाजी[a] तोड़ते हैं,


    और रेतमा झाड़ियों की जड़ें उनका भोजन[b] हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मैलो”; इब्रानी पौधे का नाम अनिश्चित है। संभवतः यह खारी भूमि में उगने वाला कोई जंगली पौधा था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “रोटी”; यहाँ “रोटी” का व्यापक अर्थ भोजन या जीवन-निर्वाह का साधन हो सकता है।
    reason: lexical_alternative
