  choice: जो … तोड़ते हैं
  rationale: קטף वनस्पति को तोड़ने या चुनने की ठोस क्रिया बताता है। कृदंत को पिछले पद से जुड़े संबंधवाचक वाक्यांश के रूप में रखा गया है।
- source_word: מַלּוּחַ
  choice: खारी भाजी
  rationale: इस अनिश्चित पौधे के नाम से संभवतः लवणीय भूमि में उगने वाला खाने योग्य जंगली पौधा अभिप्रेत है। यह चयन सामान्य पाठक को उसके संभावित स्वरूप का सहज संकेत देता है, जबकि पादटिप्पणी अनिश्चितता बनाए रखती है।
- source_word: עֲלֵי שִׂיחַ
  choice: झाड़ियों के बीच
  rationale: यहाँ על को झाड़ीदार वनस्पति के बीच या उसके पास भोजन खोजने के स्थान के रूप में समझना प्रसंगानुकूल और स्वाभाविक है।
- source_word: וְשֹׁרֶשׁ רְתָמִים
  choice: और रेतमा झाड़ी की जड़
  rationale: רתמים मरुस्थलीय broom shrub को सूचित करता है। उसके विशिष्ट पौध-नाम को लिप्यंतरित कर 'झाड़ी' जोड़ने से स्रोत की विशिष्टता और पाठक की समझ दोनों बनी रहती हैं।
- source_word: לַחְמָם
  choice: ही उनका भोजन है
  rationale: לֶחֶם का मूल अर्थ 'रोटी' है, पर इसका व्यापक अर्थ भोजन या जीविका भी होता है। इस प्रसंग में जड़ को रोटी की तरह तैयार वस्तु कहने के बजाय जीवन-निर्वाह का भोजन कहना अधिक स्पष्ट है; 'ही' दयनीय अभाव को स्वाभाविक हिंदी में उभारता है।
