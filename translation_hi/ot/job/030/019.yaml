base_translation:
  language: en
  yaml_path: translation/ot/job/030/019.yaml
  text: He has thrown me into the mire[b][a], and I have become like dust and ashes.
translation:
  language: hi
  text: उसने मुझे कीचड़ में फेंक दिया है,[a] और मैं धूल और राख के समान हो गया हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गीली मिट्टी में।” इब्रानी शब्द חֹמֶר मिट्टी, गीली मिट्टी या कीचड़ को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे धूल और राख के समान बना दिया गया है” अथवा “मुझे धूल और राख के समान ठहराया गया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: הֹרָנִי
  choice: उसने मुझे फेंक दिया है
  rationale: हिफ़ील रूप और प्रथम पुरुष एकवचन प्रत्यय यहाँ बलपूर्वक फेंके जाने का भाव देते हैं। संदर्भ में निहित तृतीय पुरुष एकवचन कर्ता परमेश्वर है, पर पद में केवल स्वाभाविक सर्वनाम ‘उसने’ रखा गया है।
- source_word: לַחֹמֶר
  choice: कीचड़ में
  rationale: חֹמֶר का अर्थ मिट्टी, गीली मिट्टी या कीचड़ हो सकता है। विलाप और अपमान के इस संदर्भ में ‘कीचड़’ सहज आधुनिक हिन्दी में मलिनता और गिराए जाने की छवि बनाए रखता है।
- source_word: וָאֶתְמַשֵּׁל
  choice: मैं ... के समान हो गया हूँ
  rationale: इस रूप में प्रतिफलित अथवा कर्मवाच्य-सदृश भाव है—‘समान बनाया गया/हो गया।’ ‘के समान हो गया हूँ’ परिणामी दशा और आगे आने वाली उपमा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֶּעָפָר
  choice: धूल के समान
  rationale: כ उपमा को और עָפָר धूल को सूचित करता है; यह दीनता, नश्वरता और विघटन की मूल छवि सुरक्षित रखता है।
- source_word: וָאֵפֶר
  choice: और राख
  rationale: אֵפֶר का सामान्य अर्थ ‘राख’ है। ‘धूल और राख’ की परिचित युग्म-छवि मूल पाठ की साहित्यिक और अंतरपाठीय प्रतिध्वनि बनाए रखती है।
theological_decisions:
- issue: तृतीय पुरुष एकवचन क्रिया का निहित कर्ता
  choice: ‘उसने’ के रूप में व्यक्त किया गया, जो संदर्भ में परमेश्वर की ओर संकेत करता है
  alternative: कर्ताहीन रूप, जैसे ‘मुझे कीचड़ में फेंक दिया गया है’
  rationale: इब्रानी क्रिया में पुल्लिंग एकवचन कर्ता निहित है और अय्यूब के वर्तमान संबोधन में उसका संदर्भ परमेश्वर है। ‘उसने’ पाठ की व्याकरणिक विशेषता को रखता है, जबकि नाम जोड़कर आवश्यकता से अधिक स्पष्ट नहीं करता।
- issue: וָאֶתְמַשֵּׁל का वाच्य और परिणामी अर्थ
  choice: ‘मैं ... के समान हो गया हूँ’
  alternative: ‘मुझे ... के समान बना दिया गया है’ अथवा ‘मैं ... के समान समझा जाता हूँ’
  rationale: इब्रानी रूप प्रतिफलित और कर्मवाच्य-सदृश अर्थ के बीच कुछ तनाव रखता है। मुख्य पाठ में स्वाभाविक परिणामी अर्थ दिया गया है और पादटिप्पणी में कर्मवाच्य विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘कीचड़’ सामान्य पाठक के लिए स्पष्ट है और अपमान की ठोस छवि देता है; ‘धूल और राख’ पारंपरिक बाइबलीय युग्म को स्वाभाविक हिन्दी में सुरक्षित रखता है।
