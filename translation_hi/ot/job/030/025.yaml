  text: אִם לֹ֣א בָ֭כִיתִי לִ/קְשֵׁה י֑וֹם עָֽגְמָ֥ה נַ֝פְשִׁ֗/י לָ/אֶבְיֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/025.yaml
  text: Did I not weep for the one whose day was hard? Was not my soul grieved for the poor?[a]
translation:
  language: hi
  text: क्या मैं उसके लिए नहीं रोया, जिसका दिन कठिन था? क्या मेरा प्राण दरिद्र के लिए दुखी नहीं हुआ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं संकट में पड़े व्यक्ति के लिए नहीं रोया?” इब्रानी पद का शाब्दिक रूप ‘दिन का कठिन’ है, अर्थात कठिन दिन का सामना करने वाला व्यक्ति।
    reason: ‘कठिन दिन’ वाले इब्रानी मुहावरे का वैकल्पिक अर्थ और उसकी संक्षिप्त पद-रचना स्पष्ट करने के लिए।
lexical_decisions:
- source_word: אִם לֹא
  choice: क्या मैं ... नहीं
  rationale: यहाँ यह सामान्य शर्त नहीं, बल्कि अय्यूब के आत्मपक्ष का आलंकारिक प्रश्न है। हिंदी में ‘क्या मैं ... नहीं’ उसी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָכִיתִי
  choice: रोया
  rationale: क्रिया वास्तविक रोने को दर्शाती है; ‘रोया’ आधुनिक हिंदी में सहज है और काव्यात्मक भाव बनाए रखता है।
- source_word: לִקְשֵׁה יוֹם
  choice: उसके लिए ... जिसका दिन कठिन था
  rationale: इब्रानी की ‘कठिन दिन’ वाली छवि को बनाए रखते हुए संकटग्रस्त व्यक्ति का आशय स्पष्ट और स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: עָגְמָה
  choice: दुखी ... हुआ
  rationale: यह क्रिया पीड़ा, शोक या उदासी का भाव देती है। ‘दुखी हुआ’ समानांतर पंक्ति में रोने के भाव के अनुकूल है और कटुता का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: यह अय्यूब के भीतरी स्व और पूरे व्यक्तित्व की काव्यात्मक अभिव्यक्ति है। ‘मेरा प्राण’ स्रोत की बनावट बचाता है, पर इसे किसी तकनीकी दार्शनिक अर्थ तक सीमित नहीं करता।
- source_word: לָאֶבְיוֹן
  choice: दरिद्र के लिए
  rationale: אֶבְיוֹן निर्धन अथवा जरूरतमंद व्यक्ति को दर्शाता है। ‘दरिद्र’ संक्षिप्त, गरिमापूर्ण और प्रतिनिधिक एकवचन के अनुकूल है।
theological_decisions:
- issue: נַפְשִׁי का मानवशास्त्रीय आशय
  choice: ‘मेरा प्राण’ को अय्यूब के भीतरी स्व की काव्यात्मक अभिव्यक्ति के रूप में रखा गया है।
  alternative: ‘मैं दुखी नहीं हुआ’ अथवा ‘मेरा अंतरमन दुखी नहीं हुआ’
  rationale: इब्रानी कविता में נֶפֶשׁ व्यक्ति के स्वयं या भीतरी अस्तित्व को व्यक्त कर सकता है। शाब्दिक बनावट रखना उचित है, पर इससे आत्मा के विषय में कोई विशिष्ट तकनीकी सिद्धांत नहीं निकाला गया।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। समानांतर प्रश्नों तथा इब्रानी की ‘कठिन दिन’ वाली छवि को यथासंभव बनाए रखा गया है।
