- source_word: קֹדֵר
  choice: शोक में काला पड़ा
  rationale: कדר का कृदन्त शोकग्रस्त होने और रूप-रंग के काला या मलिन पड़ने—दोनों भावों को जगा सकता है। यह प्रयोग उस दोहरे संकेत को यथासंभव बनाए रखता है।
- source_word: הִלַּכְתִּי
