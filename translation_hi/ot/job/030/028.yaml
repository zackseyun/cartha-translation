- source_word: בְּלֹא חַמָּה
  choice: धूप के कारण नहीं
  rationale: शाब्दिक अर्थ ‘सूर्य के बिना/नहीं’ है, पर सन्दर्भ में विरोध यह है कि अय्यूब का काला पड़ा रूप सूर्य या उसकी तपन से उत्पन्न नहीं हुआ।
- source_word: קַמְתִּי
  choice: खड़ा होकर
  rationale: קום सार्वजनिक सभा में उठकर बोलने की क्रिया बताता है; संयुक्त क्रिया हिन्दी में अगले खण्ड से स्वाभाविक रूप से जुड़ती है।
- source_word: בַקָּהָל
  choice: सभा में
  rationale: קהל एकत्र समुदाय को दर्शाता है। ‘सभा’ स्पष्ट है और बाद की किसी विशिष्ट धार्मिक संस्था का अर्थ आरोपित नहीं करता।
- source_word: אֲשַׁוֵּעַ
  choice: सहायता के लिए पुकारता हूँ
  rationale: שוע का पिएल रूप संकट में सहायता पाने की तीव्र पुकार व्यक्त करता है; हिन्दी वाक्यांश उसका आशय स्पष्ट रखता है।
