  text: मैं काला-मलिन होकर फिरता हूँ[a], पर धूप के कारण नहीं[b]; मैं सभा में खड़ा होकर सहायता के लिए पुकारता हूँ।
  philosophy: optimal-equivalence
  footnotes:
