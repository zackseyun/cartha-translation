  yaml_path: translation/ot/job/030/010.yaml
  text: They abhor me; they keep far from me[a], and they do not hold back spitting before my face.
translation:
  language: hi
  text: वे मुझसे घृणा करते हैं, मुझसे दूर रहते हैं, और मेरे सामने थूकने से भी नहीं हिचकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִּעֲבוּנִי
  choice: वे मुझसे घृणा करते हैं
  rationale: תעב तीव्र घृणा और तिरस्कार व्यक्त करता है; ‘घृणा करते हैं’ आधुनिक मानक हिन्दी में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: רָחֲקוּ מֶנִּי
  choice: मुझसे दूर रहते हैं
  rationale: רחק यहाँ शारीरिक दूरी के साथ सामाजिक अलगाव का भाव भी रख सकता है; यह अनुवाद दोनों को खुला रखता है।
- source_word: וּמִפָּנַי
  choice: मेरे मुँह पर
  rationale: शाब्दिक अर्थ ‘मेरे मुख/उपस्थिति से’ है; थूक के प्रसंग में ‘मेरे मुँह पर’ प्रत्यक्ष व्यक्तिगत अपमान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא חָשְׂכוּ
  choice: से भी नहीं हिचकते
  rationale: חשׂך का अर्थ रोकना या संयम करना है; नकार के साथ यह निर्लज्जतापूर्वक उस काम से न रुकने का भाव देता है।
- source_word: רֹק
  choice: थूकने
  rationale: संज्ञा רֹק ‘थूक’ को सूचित करती है; हिन्दी वाक्य-विन्यास में क्रियात्मक रूप ‘थूकने’ से अपमानजनक कृत्य स्पष्ट और सहज बनता है।
