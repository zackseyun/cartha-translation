  yaml_path: translation/ot/job/030/021.yaml
  text: You have turned cruel to me[b][a]; with the might of your hand you oppose me.
translation:
  language: hi
  text: तू मेरे प्रति क्रूर हो गया है[a]; अपने हाथ की पूरी शक्ति से तू मुझ पर आक्रमण करता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मेरे प्रति निर्दयी बन गया है।”
    reason: ‘क्रूर’ के लिए ‘निर्दयी’ और अवस्था-परिवर्तन के लिए ‘बन गया’ भी सम्भव हैं।
  - marker: b
    text: या, “तू मेरा विरोध करता है”; अथवा, “तू मुझे सताता है।”
    reason: שׂטם शत्रुतापूर्ण विरोध, आक्रमण या सताने के विभिन्न निकट अर्थ व्यक्त कर सकता है।
lexical_decisions:
- source_word: תֵּהָפֵךְ
  choice: हो गया है
  rationale: निफ़अल रूप यहाँ अवस्था-परिवर्तन व्यक्त करता है। ‘हो गया है’ स्वाभाविक हिन्दी में ‘बन गया/पलट गया’ का भाव रखता है और अनावश्यक रूप से आत्मवाचक अर्थ नहीं जोड़ता।
- source_word: לְאַכְזָר
  choice: क्रूर
  rationale: אַכְזָר का सीधा अर्थ क्रूर या निर्दयी है। विधेय विशेषण के रूप में ‘क्रूर’ संक्षिप्त, प्रबल और स्वाभाविक है।
- source_word: לִי
  choice: मेरे प्रति
  rationale: लामेद यहाँ सम्बन्ध या दिशा दिखाता है। ‘मेरे प्रति’ हिन्दी में इस प्रतिकूल व्यवहार को स्वाभाविक ढंग से व्यक्त करता है, बिना पहले ही ‘मेरे विरुद्ध’ कहकर अर्थ को अधिक तीखा बनाने के।
- source_word: בְּעֹצֶם
  choice: पूरे बल से
  rationale: עֹצֶם शक्ति, सामर्थ्य या प्रबल बल को दर्शाता है और בְּ साधनात्मक है। ‘पूरे बल से’ हिन्दी में इस प्रबलता को स्पष्ट और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: יָדְךָ
  choice: अपने हाथ के
  rationale: ‘हाथ’ की ठोस मानवरूपी छवि को ‘शक्ति’ में विलीन नहीं किया गया; इससे इब्रानी का सजीव चित्र बना रहता है।
- source_word: תִשְׂטְמֵנִי
  choice: तू मुझ पर आक्रमण करता है
  rationale: שׂטם शत्रुता, विरोध या वैरपूर्ण आक्रमण का अर्थ दे सकता है। हाथ के बल वाले प्रसंग में ‘आक्रमण करता है’ सक्रिय शत्रुता को स्वाभाविक हिन्दी में व्यक्त करता है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: परमेश्वर के कार्य का मानवरूपी और आरोपात्मक वर्णन
  choice: सीधा द्वितीय-पुरुष सम्बोधन और ‘अपने हाथ’ की ठोस छवि बनाए रखी गई है।
  alternative: वाक्य को नरम करके ‘तेरी शक्ति मेरे विरुद्ध है’ कहना।
  rationale: अय्यूब की विलापपूर्ण शिकायत जानबूझकर तीखी और सम्बन्धपरक है। अनुवाद को इस धर्मवैचारिक तनाव को कम या हल नहीं करना चाहिए।
- issue: שׂטם में निहित शत्रुता का प्रकार
  choice: मुख्य पाठ में ‘आक्रमण करता है’ रखा गया है।
  alternative: ‘मेरा विरोध करता है’, ‘मुझसे बैर रखता है’, या ‘मुझे सताता है’।
  rationale: प्रसंग और ‘हाथ के पूरे बल’ की अभिव्यक्ति सक्रिय वैरपूर्ण कार्रवाई की ओर संकेत करते हैं, पर क्रिया स्वयं विरोध, बैर या सताने का भाव भी रख सकती है; इसलिए विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विलाप-शैली अपनाई गई है। परमेश्वर के लिए एकवचन ‘तू’ मूल के सीधे, निकट और तीखे सम्बोधन को बनाए रखता है। समानान्तर दो खंड अर्धविराम से जुड़े हैं।
