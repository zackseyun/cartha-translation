  text: כִּֽי יָ֭דַעְתִּי מָ֣וֶת תְּשִׁיבֵ֑/נִי וּ/בֵ֖ית מוֹעֵ֣ד לְ/כָל חָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/023.yaml
  text: For I know that you will bring me to death[b][a], and to the house appointed for every living one.
translation:
  language: hi
  text: क्योंकि मैं जानता हूँ कि तू मुझे मृत्यु तक पहुँचा देगा[a], और उस घर तक जो हर जीवित व्यक्ति के लिए ठहराया गया है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मुझे मृत्यु की ओर लौटा देगा।” क्रिया में किसी को लौटाने का कारण बनने का भाव भी है।
    reason: lexical_alternative
  - marker: b
    text: या, “सब जीवितों के लिए ठहराया गया घर।” यह संभवतः कब्र या अधोलोक के लिए एक काव्यात्मक संकेत है, जो प्रत्येक मनुष्य का सामान्य गंतव्य है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है और इब्रानी संयोजक का स्वाभाविक हिन्दी रूप है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: पूर्ण रूप यहाँ स्थिर और वर्तमान निश्चय व्यक्त करता है।
- source_word: מָוֶת
  choice: मृत्यु
  rationale: मूल शब्द सीधे मृत्यु को दर्शाता है; पाठ स्वयं अधोलोक का स्पष्ट नाम नहीं लेता।
- source_word: תְּשִׁיבֵנִי
  choice: तू मुझे ... पहुँचा देगा
  rationale: हिफ़ील रूप किसी को लौटाने या किसी गंतव्य तक ले जाने का भाव रखता है। संदर्भ में 'मृत्यु तक पहुँचा देगा' स्वाभाविक हिन्दी है, जबकि 'लौटा देगा' की शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וּבֵית מוֹעֵד
  choice: उस घर तक जो ... ठहराया गया है
  rationale: दूसरा पद पहले गंतव्य की समानांतर व्याख्या करता है। מוֹעֵד में नियत या ठहराए हुए स्थान का भाव है; 'ठहराया गया' इस अस्पष्ट काव्यात्मक रूपक को बनाए रखता है।
- source_word: לְכָל חָי
  choice: हर जीवित जन के लिए
  rationale: एकवचन सामूहिक अभिव्यक्ति की सार्वभौमिकता को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: मृत्यु और ठहराए गए घर का आशय
  choice: मृत्यु को सब मनुष्यों के सार्वभौमिक गंतव्य के रूप में रखा गया है, जिसे काव्यात्मक ढंग से ठहराया हुआ घर कहा गया है।
  alternative: यह घर विशेष रूप से कब्र या अधोलोक का संकेत हो सकता है।
  rationale: इब्रानी पाठ 'मृत्यु' कहता है और किसी ठहराए हुए घर का रूपक देता है, पर अधोलोक का नाम स्पष्ट रूप से नहीं लेता; इसलिए अनुवाद किसी अधिक विकसित परलोक-सिद्धांत को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक गद्य। अय्यूब के परमेश्वर से सीधे संबोधन के अनुरूप एकवचन 'तू' रखा गया है। 'हर जीवित जन' मूल के एकवचन सामूहिक प्रयोग को स्वाभाविक हिन्दी में बनाए रखता है।
