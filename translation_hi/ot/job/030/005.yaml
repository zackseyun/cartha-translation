- source_word: מִן־גֵּו
  choice: घाटी के बीच से
  rationale: מִן स्रोत या अलगाव बताता है और גֵּו यहाँ किसी खोखले भूभाग, घाटी या संकरे दर्रे की ओर संकेत कर सकता है। ‘घाटी के बीच से’ दोनों तत्वों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְגֹרָשׁוּ
  choice: खदेड़ दिया जाता है
