- source_word: יָרִיעוּ
  choice: लोग ... चिल्लाते हैं
  rationale: क्रिया का अर्थ ऊँची आवाज़ या शोर मचाना है। इब्रानी में कर्ता स्पष्ट नहीं है; हिन्दी में अनिश्चित मानवीय कर्ता ‘लोग’ वाक्य को स्वाभाविक बनाता है।
- source_word: עָלֵימוֹ
  choice: उनके पीछे
  rationale: על यहाँ शत्रुतापूर्ण पुकार की दिशा बता सकता है। चोर का पीछा करने वाली तुलना के संदर्भ में ‘उनके पीछे’ उपयुक्त है।
- source_word: כַּגַּנָּב
  choice: जैसे किसी चोर के पीछे
  rationale: तुलनासूचक כְּ का आशय उस प्रकार की पुकार से है जो चोर के पीछे लगाई जाती है; हिन्दी में निहित क्रिया को इस रूप में स्पष्ट करना सहज है।
