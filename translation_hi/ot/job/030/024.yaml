  text: Surely one does not stretch out a hand against a ruin[a], if in his calamity there is a cry for help.
translation:
  language: hi
  text: निश्चय ही कोई खंडहर के विरुद्ध हाथ नहीं बढ़ाता[a], यदि उसकी विपत्ति में सहायता के लिए पुकार हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निश्चय ही कोई उजड़े हुए ढेर के विरुद्ध हाथ नहीं बढ़ाता; यदि उसके विनाश में सहायता के लिए पुकार हो।” इस पद का इब्रानी पाठ कठिन है, विशेषकर “खंडहर” अनूदित वाक्यांश और अंतिम खंड। अंतिम खंड में एक रूप का सामान्य अर्थ “उनके लिए/उनकी ओर” है, पर इस संदर्भ में उसका संबंध अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ इसे कथन पर बल देने वाले निश्चयार्थक अव्यय के रूप में लिया गया है; यह अर्थ को अनावश्यक रूप से विरोधसूचक नहीं बनाता।
- source_word: בְּעִי
  choice: खंडहर पर
  rationale: यह दुर्लभ और कठिन रूप संभवतः उजड़े ढेर या खंडहर को सूचित करता है। בְּ का 'पर' अनुवाद हाथ उठाने की दिशा को व्यक्त करते हुए मूल की संक्षिप्तता बनाए रखता है।
- source_word: יִשְׁלַח יָד
  choice: हाथ उठाता
  rationale: हिंदी में यह स्वाभाविक मुहावरा है, जो हाथ बढ़ाने की मूल छवि और संभावित प्रतिकूल कार्रवाई—दोनों को बनाए रखता है।
- source_word: אִם
  choice: यदि
  rationale: शर्तसूचक अर्थ कठिन वाक्य-संबंध को बिना अधिक स्पष्ट किए सुरक्षित रखता है।
- source_word: בְּפִידוֹ
  choice: उसकी विपत्ति में
  rationale: פיד विपत्ति या विनाशकारी संकट को सूचित करता है; संबंधवाचक प्रत्यय और पूर्वसर्ग दोनों सुरक्षित रखे गए हैं।
- source_word: לָהֶן
  choice: प्रत्यक्ष रूप से अलग अनूदित नहीं
  rationale: संदर्भ में इस रूप का संबंध और आशय अत्यंत अनिश्चित है। इसे मुख्य पाठ में कृत्रिम 'उनसे' बनाकर अस्पष्टता बढ़ाने के बजाय पूरी पंक्ति की कठिनाई पादटिप्पणी में बताई गई है।
- source_word: שׁוּעַ
  choice: सहायता के लिए पुकार
  rationale: यह संकट में सहायता माँगने वाली पुकार को सूचित करता है; आधुनिक हिंदी में इसका आशय स्पष्ट और स्वाभाविक है।
