translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप रखा गया है। ‘गीत’ और ‘कहावत’ मूल के ठोस रूपकों को सुरक्षित रखते हैं; प्रसंगगत उपहास को मुख्य पाठ में अत्यधिक स्पष्ट करने के बजाय पादटिप्पणियों में प्रस्तुत किया गया है।
