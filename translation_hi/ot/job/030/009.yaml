  text: וְ֭/עַתָּה נְגִינָתָ֣/ם הָיִ֑יתִי וָ/אֱהִ֖י לָ/הֶ֣ם לְ/מִלָּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/009.yaml
  text: And now I have become their song[b][a], and I am a byword to them.
translation:
  language: hi
  text: पर अब मैं उनका गीत बन गया हूँ[a], और उनके लिए एक कहावत बन गया हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका उपहास का गीत”—इस प्रसंग में “गीत” संभवतः ताना मारने वाला गीत है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी चर्चा का विषय” अथवा “उनके लिए एक ताना”; इब्रानी शब्द का मूल अर्थ “शब्द” या “कथन” है और यहाँ वह अय्यूब के विषय में तिरस्कार से कही जाने वाली उक्ति को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: यह पद अय्यूब की पिछली प्रतिष्ठा के विपरीत उसकी वर्तमान दुर्दशा की ओर मुड़ता है; इसलिए संयोजक और कालगत भाव दोनों को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: נְגִינָתָם
  choice: उनका गीत
  rationale: नְגִינָה का मूल अर्थ गीत या संगीत-रचना है। प्रसंग में यह उपहासपूर्ण गीत है, पर मुख्य पाठ में मूल की संक्षिप्तता बनाए रखी गई है और व्यंग्यात्मक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הָיִיתִי
  choice: मैं ... बन गया हूँ
  rationale: पूर्ण क्रिया यहाँ अतीत में हुए परिवर्तन के वर्तमान परिणाम को बताती है; हिन्दी का पूर्ण वर्तमान इस भाव को सहज रूप से व्यक्त करता है।
- source_word: וָאֱהִי
  choice: और ... बन गया हूँ
  rationale: दूसरा खंड पहले के समानांतर अय्यूब की वर्तमान अपमानजनक स्थिति का वर्णन करता है; हिन्दी में समान क्रियात्मक रूप से समानांतरता स्पष्ट रहती है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: दातृवाचक संबंध बताता है कि अय्यूब उनकी दृष्टि या व्यवहार में ऐसा बन गया है।
- source_word: לְמִלָּה
  choice: एक कहावत
  rationale: מִלָּה का सामान्य अर्थ ‘शब्द’ या ‘कथन’ है; यहाँ यह किसी व्यक्ति के विषय में प्रचलित तिरस्कारपूर्ण उक्ति का संकेत देता है। ‘कहावत’ मूल रूपक को बनाए रखती है, जबकि अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
