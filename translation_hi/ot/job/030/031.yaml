    issue: “इसलिए” has been added at the beginning.
    rationale: The verse begins with waw-consecutive “and/so,” but in this poetic context an explicit Hindi causal “इसलिए” overstates the connection and is not needed.
  - severity: medium
    issue: “शोक का स्वर” adds “स्वर” to the first colon.
    rationale: לְאֵבֶל is “to/into mourning, lamentation,” not explicitly “the sound of mourning.” The addition weakens the terse parallel between mourning and the sound/voice of weepers.
  - severity: low
    issue: The first footnote's alternative “मेरी सारंगी” is overly specific.
    rationale: כִּנּוֹר denotes an ancient lyre/harp-like stringed instrument; “सारंगी” names a particular later South Asian bowed instrument and may mislead readers.
