  yaml_path: translation/ot/job/030/013.yaml
  text: They tear up my path for my ruin[b][a]; they profit from it—there is no helper for them.
translation:
  language: hi
  text: वे मेरी राह उजाड़ देते हैं; मेरे विनाश को आगे बढ़ाते हैं[a]—उनकी सहायता करने वाला कोई नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उससे लाभ उठाते हैं” अथवा “उसे आगे बढ़ने में सहायता देते हैं”; इब्रानी क्रिया उपयोगी होने या किसी बात को आगे बढ़ाने का अर्थ दे सकती है। यहाँ संकेत सम्भवतः अय्यूब के विनाश की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या, “और कोई उनकी सहायता भी नहीं करता।” अन्तिम इब्रानी उपवाक्य संक्षिप्त है; इसका अर्थ यह हो सकता है कि वे बिना किसी की सहायता के काम करते हैं, या यह कि उनका कोई सहायक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָתְסוּ
  choice: उजाड़ देते हैं
  rationale: क्रिया में ढा देने, तोड़ डालने या नष्ट करने का भाव है। राह के संदर्भ में ‘उजाड़ देते हैं’ हिंसक विनाश की ठोस छवि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נְתִיבָתִי
  choice: मेरी राह
  rationale: נְתִיבָה पगडंडी, मार्ग या राह को दर्शाता है। ‘मेरी राह’ वास्तविक मार्ग और जीवन-मार्ग, दोनों की सम्भावना बनाए रखता है।
- source_word: לְהַוָּתִי
  choice: मेरे विनाश को
  rationale: הַוָּה का अर्थ विपत्ति, बरबादी या विनाश हो सकता है। यहाँ לְ के साथ यह उनकी कार्रवाई के लक्ष्य या परिणाम को दर्शाता है।
- source_word: יֹעִילוּ
  choice: आगे बढ़ाते हैं
  rationale: הפעיל रूप किसी काम में सहायक होने, उसे आगे बढ़ाने या लाभ पहुँचाने का अर्थ दे सकता है। संदर्भ में निहित कर्म अय्यूब का विनाश है; ‘आगे बढ़ाते हैं’ इस संबंध को स्पष्ट करते हुए क्रिया की अर्थ-सीमा के भीतर रहता है।
- source_word: לֹא עֹזֵר לָמוֹ
  choice: उनकी सहायता करने वाला कोई नहीं
  rationale: 'यह संक्षिप्त इब्रानी उपवाक्य शाब्दिक संरचना और उसकी अस्पष्टता को बनाए रखता है: उनके लिए कोई सहायक नहीं है, अथवा वे बिना किसी सहायता के यह करते हैं।'
