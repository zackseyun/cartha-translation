  yaml_path: translation/ot/job/030/011.yaml
  text: Because he has loosened his cord and afflicted me[b][a], they have cast off restraint before me.
translation:
  language: hi
  text: क्योंकि उसने डोरी ढीली कर दी[a] और मुझे पीड़ित किया; वे मेरे सामने लगाम छोड़ देते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “उसकी डोरी” पढ़ा जा सकता है; एक पाठ-परंपरा में “मेरी डोरी” है। शब्द का अर्थ विशेष रूप से “धनुष की डोरी” भी हो सकता है।
    reason: textual_and_lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्होंने मेरे सामने लगाम छोड़ दी”; अर्थात वे मेरी उपस्थिति में किसी संयम के बिना व्यवहार करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में अय्यूब के प्रति उपहास और शत्रुता का कारण बताता है।
- source_word: יִתְרוֹ
  choice: मेरी डोरी
  rationale: हिब्रू रूप और संदर्भ कठिन हैं। प्रत्यय मसोराई पाठ में ‘उसकी’ हो सकता है, पर वक्ता-केंद्रित रूपक के अर्थ में ‘मेरी डोरी’ स्वाभाविक है; ‘धनुष की डोरी’ भी संभव है और पादटिप्पणी में दी गई है।
- source_word: פִּתַּח
  choice: ढीली कर दी
  rationale: डोरी के साथ इस क्रिया का स्वाभाविक अर्थ खोलना, छोड़ना या ढीला करना है।
- source_word: וַיְעַנֵּנִי
  choice: और मुझे दुःख दिया
  rationale: यह ענה II से है, जिसका अर्थ सताना, दीन करना या दुःख देना है; ‘उत्तर देना’ यहाँ संदर्भानुकूल नहीं है।
- source_word: וְרֶסֶן
  choice: संयम
  rationale: शाब्दिक अर्थ ‘लगाम’ है, पर मुहावरे में इसका आशय व्यवहार पर लगे नियंत्रण से है; मूल बिंब पादटिप्पणी में रखा गया है।
- source_word: מִפָּנַי
  choice: मेरे सामने
  rationale: यह अय्यूब की उपस्थिति में निर्लज्ज व्यवहार को सूचित करता है।
- source_word: שִׁלֵּחוּ
  choice: त्याग दिया
  rationale: ‘लगाम/संयम’ के साथ इसका अर्थ उसे छोड़ देना या हटा देना है।
theological_decisions:
- issue: पहली एकवचन क्रिया का कर्ता
  choice: ‘उसने’—संदर्भ में परमेश्वर की ओर संकेत
  alternative: कर्ता को अस्पष्ट मानना या किसी मानवीय समूह से जोड़ना
  rationale: हिब्रू में कर्ता स्पष्ट संज्ञा से व्यक्त नहीं है, किंतु एकवचन क्रिया और अय्यूब की दशा के निकट संदर्भ में परमेश्वर सबसे संभावित संकेत है। अनुवाद में केवल सर्वनाम रखकर मूल की अप्रत्यक्षता बचाई गई है।
- issue: पहली पंक्ति और भीड़ की निरंकुशता के बीच संबंध
  choice: ‘इसलिए’ द्वारा परिणाम का संबंध
  alternative: दोनों खंडों को केवल ‘और’ से जोड़ना
  rationale: संदर्भ में अय्यूब को परमेश्वर द्वारा निर्बल किए जाने के कारण लोग उसके सामने संयम छोड़ते हैं; ‘इसलिए’ निहित तार्किक संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘डोरी’ और ‘लगाम’ के काव्यात्मक बिंबों में से मुख्य पाठ में पहले को रखा गया है, जबकि दूसरे का अर्थ ‘संयम’ के रूप में दिया गया है। कठिन हिब्रू प्रत्यय और संभावित धनुष-बिंब को पादटिप्पणी में स्पष्ट किया गया है।
