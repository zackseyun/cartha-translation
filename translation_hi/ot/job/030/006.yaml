  yaml_path: translation/ot/job/030/006.yaml
  text: In the gullies of the wadis they dwell[b][a], in holes of the dust and among the rocks.
translation:
  language: hi
  text: वे बरसाती नालों की खाइयों में बसते हैं[a], मिट्टी के गड्ढों और चट्टानों के बीच।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे जलधाराओं की खड्डों में बसते हैं।” इब्रानी शब्द नְחָלִים सूखे नालों, बरसाती जलधाराओं या उनसे बनी घाटियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “धरती के छेदों और चट्टानी दरारों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּעֲרוּץ
  choice: खाइयों में
  rationale: עָרוּץ पानी से कटे संकरे गहरे स्थान या खड्ड को सूचित करता है। आधुनिक हिन्दी में ‘खाइयों’ से यह कठोर भू-दृश्य स्वाभाविक और स्पष्ट रहता है।
- source_word: נְחָלִים
  choice: नालों की
  rationale: נחל प्रायः मौसमी जलधारा, उसके सूखे पाट, या उससे बनी घाटी को सूचित करता है। ‘नालों की’ सामान्य पाठक के लिए सहज है, जबकि फुटनोट में ‘बरसाती नदी-घाटियों’ का विकल्प दिया गया है।
- source_word: לִשְׁכֹּן
  choice: वे ... बसते हैं
  rationale: स्थानवाचक पद के बाद यह infinitive construct प्रसंग में निवास का भाव देता है; हिन्दी में finite क्रिया ‘बसते हैं’ स्वाभाविक है और अस्थायी या दयनीय आवास का अर्थ बनाए रखती है।
- source_word: חֹרֵי
  choice: बिलों
  rationale: חוֹר छेद, खोखल या मांद-जैसी जगह को सूचित करता है। ‘बिल’ मिट्टी में बने रहने योग्य छोटे छेद की कठोर छवि देता है; ‘गुफाएँ’ अपेक्षाकृत बड़े और सुरक्षित आश्रय का भ्रामक भाव दे सकती हैं।
- source_word: עָפָר
  choice: मिट्टी के
  rationale: עָפָר यहाँ उस ढीली धरती या धूल को सूचित करता है जिसमें छेद बने हैं। हिन्दी में ‘मिट्टी के बिल’ ‘धूल के बिल’ से अधिक स्वाभाविक है और मूल भौतिक चित्र सुरक्षित रखता है।
- source_word: וְכֵפִים
  choice: और चट्टानों के बीच
  rationale: כֵפִים चट्टानों या शैल-खंडों को सूचित करता है। मूल में पूर्वसर्ग का अर्थ पिछले स्थानवाचक निर्माण से ग्रहण होता है; हिन्दी में ‘के बीच’ जोड़ने से निहित स्थान-संबंध स्पष्ट और स्वाभाविक होता है।
