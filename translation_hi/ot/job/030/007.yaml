    reason: lexical_alternative
  - marker: b
    text: या “एक साथ इकट्ठे किए गए हैं” अथवा “एक साथ जमा हैं।” इब्रानी क्रिया में साथ इकट्ठा या सटकर रहने का भाव है; इस संदर्भ में ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּין שִׂיחִים
  choice: झाड़ियों के बीच
  rationale: בֵּין बहुवचन के साथ यहाँ ‘के बीच’ या ‘के मध्य’ का भाव देता है, और שִׂיחִים नीची जंगली झाड़ियों को सूचित करता है। यह सहज आधुनिक हिन्दी है और उजाड़ परिवेश बनाए रखती है।
- source_word: יִנְהָקוּ
  choice: वे रेंकते हैं
  rationale: נהק मुख्यतः गधों की आवाज़ के लिए प्रयुक्त होता है। ‘रेंकते हैं’ मूल की कठोर, पशु-सदृश छवि को सुरक्षित रखता है; ‘कराहते’ या ‘चिल्लाते’ इसे सामान्य बना देते।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह सीधा स्थान-सूचक अर्थ है और हिन्दी में स्वाभाविक रूप से ‘के नीचे’ व्यक्त होता है।
- source_word: חָרוּל
  choice: बिच्छू-बूटियों
  rationale: यह किसी काँटेदार या कष्टदायक जंगली वनस्पति का नाम है, जिसकी ठीक पहचान अनिश्चित है। ‘बिच्छू-बूटी’ प्रचलित और बोधगम्य समतुल्य है, पर पादटिप्पणी अनिश्चितता बनाए रखती है।
- source_word: יְסֻפָּחוּ
  choice: दुबककर इकट्ठे होते हैं
  rationale: क्रिया का रूप साथ जोड़े जाने, सिमटने या समूह में जमा होने का भाव दे सकता है। संदर्भ में ‘दुबककर इकट्ठे होते हैं’ शरण लेते दीन लोगों की शारीरिक निकटता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अन्य सम्भावनाएँ सुरक्षित रखती है।
