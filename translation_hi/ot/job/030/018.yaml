  - marker: b
    text: 'शाब्दिक अर्थ: “मेरे कुर्ते के मुँह/खुलाव की तरह।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/רָב כֹּחַ
  choice: बड़े बल से
  rationale: בְּ को साधनवाचक मानते हुए यह पद क्रिया की प्रबलता अथवा माध्यम व्यक्त करता है; यह हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: יִתְחַפֵּשׂ
  choice: विकृत हो गया है
  rationale: हित्पएल रूप का अर्थ यहाँ कठिन और विवादित है। प्रसंग में अय्यूब की दशा को वस्त्र के बिगड़ने या रूप बदलने के बिंब से व्यक्त किया गया है; इसलिए निश्चितता बढ़ाए बिना संभावित अर्थ लिया गया है।
- source_word: לְבוּשִׁי
  choice: मेरा वस्त्र
  rationale: לְבוּשׁ सामान्यतः पहनावे या वस्त्र को दर्शाता है; एकवचन और काव्यात्मक समानांतरता सुरक्षित रखी गई है।
- source_word: כְּפִי
  choice: के गले की तरह
  rationale: शाब्दिक अर्थ 'मुख/खुलाव की तरह' है। वस्त्र के संदर्भ में यह गले के खुलाव को दर्शाता है; स्वाभाविक हिंदी के लिए 'गला' चुना गया है।
- source_word: כֻתָּנְתִּי
  choice: मेरे कुरते
  rationale: כֻּתֹּנֶת शरीर पर पहने जाने वाले लंबे अथवा अंगरखे-जैसे वस्त्र को दर्शाता है। 'कुरता' आधुनिक हिंदी में सहज है और वस्त्र की छवि स्पष्ट रखता है।
- source_word: יַאַזְרֵנִי
  choice: वह मुझे कसता है
  rationale: אזר का मूल भाव कमर बाँधना, घेरना या कसना है। यहाँ वस्त्र के संकुचनकारी बिंब को स्वाभाविक हिंदी में व्यक्त किया गया है।
