  text: बड़े बल से मेरा वस्त्र विकृत हो जाता है[a]; मेरे कुर्ते के गले की तरह, वह मुझे जकड़ लेता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा वस्त्र बदल जाता है” या “मेरा वस्त्र बिगड़ जाता है”; संभवतः “वह मेरे वस्त्र को पकड़ लेता है।” इब्रानी क्रिया का अर्थ कठिन और विवादित है। इस पंक्ति को प्रायः अय्यूब की पीड़ा के कारण उसके वस्त्र-जैसे रूपक के विकृत या कसने वाले होने के वर्णन के रूप में समझा जाता है।
