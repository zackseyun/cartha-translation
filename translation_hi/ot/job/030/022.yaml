  text: תִּשָּׂאֵ֣/נִי אֶל ר֭וּחַ תַּרְכִּיבֵ֑/נִי וּ֝/תְמֹגְגֵ֗/נִי תשוה־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/030/022.yaml
  text: You lift me up to the wind[a]; you make me ride on it[b], and you toss me about in the storm.
translation:
  language: hi
  text: तू मुझे हवा पर उठा ले जाता है[a]; तू मुझे उस पर सवार कराता है, और तू मुझे आँधी में तितर-बितर कर देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू मुझे हवा की ओर उठा ले जाता है।” इब्रानी पूर्वसर्ग दिशा सूचित करता है; इसे ‘हवा पर,’ ‘हवा की ओर,’ या ‘हवा में’ समझा जा सकता है।
    reason: अֶל की दिशा-सूचकता और काव्यात्मक छवि के वैकल्पिक हिंदी निरूपण।
  - marker: b
    text: इस अंतिम खंड का अंतिम इब्रानी शब्द कठिन है। अर्थ “तू मुझे आँधी में तितर-बितर कर देता है,” “तू मुझे कोलाहल में डगमगा देता है,” या “तू मुझे गलाकर नष्ट कर देता है” हो सकता है।
    reason: וּתְמֹגְגֵנִי תשוה की व्युत्पत्ति और वाक्य-संबंध अनिश्चित हैं; मुख्य संभावनाओं में विघटन, डगमगाना, आँधी/कोलाहल और विनाश शामिल हैं।
lexical_decisions:
- source_word: תִּשָּׂאֵנִי
  choice: तू मुझे उठाकर ले जाता है
  rationale: נשׂא का मूल अर्थ ‘उठाना, ले जाना, ढोना’ है। संयुक्त हिंदी पदबंध उठाए जाने और हिंसक ढंग से बहा ले जाए जाने—दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: אֶל רוּחַ
  choice: हवा में
  rationale: רוּחַ के संभावित अर्थ ‘हवा, श्वास, आत्मा’ हैं; यहाँ सवारी और विनाशकारी मौसम की छवि के कारण ‘हवा’ उपयुक्त है। אֶל की दिशा-सूचकता को सहज हिंदी में ‘हवा में’ व्यक्त किया गया है।
- source_word: תַּרְכִּיבֵנִי
  choice: तू मुझे उस पर सवार कराता है
  rationale: רכב के हिफ़ील रूप का अर्थ ‘सवार कराना’ है। ‘उस पर’ पिछले पद की हवा की ओर संकेत करता है और हिंदी में आवश्यक स्पष्टता देता है।
- source_word: וּתְמֹגְגֵנִי
  choice: तू मुझे तितर-बितर कर देता है
  rationale: מוג सामान्यतः गलने, घुलने, डगमगाने या विघटित होने का भाव देता है। संदर्भ में ‘तितर-बितर कर देता है’ विनाशकारी विघटन की काव्यात्मक छवि को स्वाभाविक हिंदी में व्यक्त करता है, पर कठिन पाठ के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: תשוה
  choice: आँधी में
  rationale: अंतिम इब्रानी शब्द अत्यंत कठिन है। प्रसंगानुसार इसे आँधी, कोलाहल या विनाश से जोड़ा गया है। ‘आँधी में’ हवा की छवि के साथ सुसंगत है, जबकि अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
theological_decisions:
- issue: कर्ता के रूप में परमेश्वर को सीधे संबोधन
  choice: दूसरे पुरुष एकवचन ‘तू’ को बनाए रखा गया
  alternative: सम्मानसूचक ‘आप’ या कर्ता को अप्रत्यक्ष करना
  rationale: इब्रानी क्रियाएँ दूसरे पुरुष एकवचन में हैं और अय्यूब परमेश्वर को सीधे संबोधित करता है। हिंदी बाइबलीय काव्य में परमेश्वर के लिए ‘तू’ निकटता और सीधे संबोधन को बिना अतिरिक्त सिद्धान्त जोड़े सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण काव्यात्मक भाषा। ‘तू’ मूल के सीधे एकवचन संबोधन को रखता है। कठिन अंतिम पद को मुख्य पाठ में प्रसंगानुकूल ढंग से प्रस्तुत कर वास्तविक पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
