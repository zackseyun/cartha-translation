  yaml_path: translation/ot/job/030/027.yaml
  text: My inward parts boil and do not rest[a]; days of affliction confront me.
translation:
  language: hi
  text: मेरे भीतर की अंतड़ियाँ खौल रही हैं और थमती नहीं[a]; क्लेश के दिन मेरे सामने आ पहुँचे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे भीतर सब कुछ उबल रहा है और शांत नहीं होता; दुःख के दिन मुझ पर आ पड़े हैं।”
    reason: מֵעַי का शाब्दिक अर्थ भीतर के अंग/अंतड़ियाँ है, पर काव्य में यह पूरे भीतरी अस्तित्व का भी बोध करा सकता है। रתח ‘खौलना/उबलना’ और דמם ‘थमना/शांत होना’ के अर्थ देते हैं। कִדְּמֻנִי का अर्थ ‘मेरे सामने आ पहुँचे’ है; प्रसंग में ‘मुझ पर आ पड़े’ भी संभव है।
lexical_decisions:
- source_word: מֵעַי
  choice: मेरे भीतर के अंग
  rationale: यह शब्द मूलतः शरीर के अंदरूनी अंगों को दर्शाता है और काव्य में गहरी भीतरी व्यथा का बोध कराता है। यह चयन मूल की शारीरिक और भावात्मक छवि दोनों को बनाए रखता है।
- source_word: רֻתְּחוּ
  choice: उबल रहे हैं
  rationale: धातु רתח उबलने या खौलने का भाव देती है; यह अय्यूब की तीव्र आंतरिक व्याकुलता की सजीव शारीरिक उपमा को सुरक्षित रखता है।
- source_word: וְלֹא דָמּוּ
  choice: और शांत नहीं होते
  rationale: דמם का अर्थ शांत होना, स्थिर होना या थमना हो सकता है। यहाँ बहुवचन कर्ता 'भीतर के अंग' के साथ यह निरंतर अशांति को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: קִדְּמֻנִי
  choice: मेरा सामना करने आ गए हैं
  rationale: קדם यहाँ सामने आने या मिलने के अर्थ में है। यह वाक्यांश दुःख के दिनों के मानवीकरण और उनके आ पड़ने के प्रतिकूल भाव को बनाए रखता है।
- source_word: יְמֵי עֹנִי
  choice: दुःख के दिन
  rationale: עֹנִי यहाँ गरीबी मात्र नहीं, बल्कि दुःख, क्लेश और पीड़ा की अवस्था को दर्शाता है। 'दुःख के दिन' आधुनिक हिंदी में सहज और प्रसंगानुकूल है।
