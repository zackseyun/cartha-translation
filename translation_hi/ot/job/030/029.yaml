  choice: भाई
  rationale: मूल शब्द का सीधा अर्थ ‘भाई’ है; यहाँ यह उजाड़ में रहने वाले जीवों के साथ गहरी समानता और निकट संबंध का काव्यात्मक रूपक बनाए रखता है।
- source_word: הָיִיתִי
  choice: बन गया हूँ
  rationale: काल और प्रसंग अतीत में आए परिवर्तन से बनी वर्तमान दशा व्यक्त करते हैं; आधुनिक हिन्दी में ‘बन गया हूँ’ इसे स्वाभाविक रूप से प्रकट करता है।
- source_word: לְתַנִּים
  choice: गीदड़ों का
  rationale: इस उजाड़-स्थल संबंधी काव्यात्मक प्रसंग में תַנִּים का सबसे संभावित जीववैज्ञानिक अर्थ ‘गीदड़’ है। संबंधसूचक לְ को हिन्दी में ‘भाई’ के साथ स्वाभाविक संबंधकारक ‘का’ से व्यक्त किया गया है।
- source_word: וְרֵעַ
  choice: और ... साथी
  rationale: רֵעַ का अर्थ मित्र, संगी या साथी हो सकता है। ‘साथी’ समानांतर पंक्ति में निकट संबंध दिखाता है, पर भावनात्मक आत्मीयता को आवश्यकता से अधिक नहीं बढ़ाता।
- source_word: לִבְנוֹת יַעֲנָה
  choice: शुतुरमुर्गों का
  rationale: शाब्दिक रूप ‘शुतुरमुर्ग की बेटियों’ है, जो इन पक्षियों के लिए हिब्रानी अभिव्यक्ति है। सहज हिन्दी में आशय ‘शुतुरमुर्गों’ से स्पष्ट होता है।
