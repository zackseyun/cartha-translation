  yaml_path: translation/ot/job/030/030.yaml
  text: My skin turns black and falls from me[b][a], and my bones burn with heat.
translation:
  language: hi
  text: मेरी त्वचा काली पड़कर मुझ पर से झड़ रही है[a], और मेरी हड्डियाँ तपिश से जल रही हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी त्वचा मेरे ऊपर काली पड़ गई है।” इब्रानी अभिव्यक्ति त्वचा के काली पड़कर झड़ने या शरीर पर काली होकर लटकने का वर्णन कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी हड्डियाँ बुखार से जल रही हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹרִי
  choice: मेरी त्वचा
  rationale: मानव शरीर के संदर्भ में עוֹר का स्वाभाविक और स्पष्ट हिन्दी रूप ‘त्वचा’ है।
- source_word: שָׁחַר
  choice: काली पड़कर
  rationale: यह क्रिया यहाँ त्वचा के काली या गहरी पड़ जाने की अवस्था व्यक्त करती है; ‘काली पड़कर’ परिणाम और अगली क्रिया से संबंध दोनों को सहज हिन्दी में रखता है।
- source_word: מֵעָלָי
  choice: मुझ पर से झड़ रही है
  rationale: शाब्दिक अर्थ ‘मेरे ऊपर से’ है। रोगग्रस्त त्वचा के संदर्भ में ‘मुझ पर से झड़ रही है’ सम्भावित आशय को व्यक्त करता है, जबकि पादटिप्पणी मूल अभिव्यक्ति की अनिश्चितता बनाए रखती है।
- source_word: וְעַצְמִי
  choice: और मेरी हड्डियाँ
  rationale: עֶצֶם एकवचन रूप में होते हुए भी सामूहिक अर्थ दे सकता है; आधुनिक हिन्दी में ‘मेरी हड्डियाँ’ स्वाभाविक है।
- source_word: חָרָה
  choice: जल रही हैं
  rationale: חרה जलने, तपने या भड़कने का सजीव बिंब देता है; ‘जल रही हैं’ उस शारीरिक पीड़ा को बनाए रखता है।
- source_word: מִנִּי חֹרֶב
  choice: तपिश से
  rationale: חֹרֶב गर्मी या सूखेपन की तीखी तपन को सूचित कर सकता है। ‘तपिश से’ व्यापक अर्थ रखता है और ‘बुखार’ जैसी अधिक व्याख्यात्मक विशिष्टता से बचता है।
