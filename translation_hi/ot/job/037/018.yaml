base_translation:
  language: en
  yaml_path: translation/ot/job/037/018.yaml
  text: Can you[a], with him, spread out the skies[c][b], hard as a cast metal mirror?
translation:
  language: hi
  text: क्या तू उसके साथ ढले हुए दर्पण के समान कठोर आकाश को फैला सकता है[a][b][c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आकाश को पीटकर फैला सकता है’ अथवा ‘आकाश को तान सकता है।’ इब्रानी क्रिया किसी वस्तु को फैलाने के साथ-साथ धातु को पीटकर पतला करने की छवि भी जगा सकती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘आकाशमंडल’ अथवा ‘बादलों।’ इब्रानी שׁחקים एक काव्यात्मक शब्द है, जो आकाश या आकाशमंडल और कुछ प्रसंगों में बादलों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘ढले हुए दर्पण के समान।’ प्राचीन दर्पण चमकाई हुई धातु से बनाए जाते थे; यहाँ आकाश को ठोस और चमकदार धातु-कृति के समान चित्रित किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: תַּרְקִיעַ
  choice: फैला सकता है
  rationale: हिफ़ील रूप किसी वस्तु को फैलाने या धातु को पीटकर पतला करने का भाव दे सकता है। मुख्य पाठ में सहज हिंदी के लिए ‘फैला’ रखा गया है, जबकि धातुकर्म की संभावित छवि पादटिप्पणी में सुरक्षित है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: इब्रानी पाठ में सर्वनाम ‘उसके’ है। प्रसंग में इसका संकेत परमेश्वर की ओर है, पर मुख्य पाठ में सर्वनाम को ही बनाए रखा गया है।
- source_word: לִשְׁחָקִים
  choice: आकाश
  rationale: यह काव्यात्मक बहुवचन आकाश, आकाशमंडल या कभी-कभी बादलों को सूचित कर सकता है। हिंदी में सामूहिक अर्थ वाला ‘आकाश’ स्वाभाविक है और धातु के दर्पण वाली उपमा के अनुकूल भी है।
- source_word: חֲזָקִים
  choice: कठोर
  rationale: यहाँ विशेषण आकाश की दृढ़ता या ठोसपन को व्यक्त करता है। ढली हुई धातु की उपमा के साथ ‘कठोर’ आधुनिक हिंदी में सबसे सटीक और स्वाभाविक है।
- source_word: כִּרְאִי
  choice: दर्पण के समान
  rationale: רְאִי का अर्थ दर्पण है और उपसर्ग כְּ तुलना व्यक्त करता है। ‘दर्पण के समान’ काव्यात्मक गरिमा और स्पष्टता दोनों बनाए रखता है।
- source_word: מוּצָק
  choice: ढले हुए धातु के
  rationale: यह रूप उँडेलकर ढाली गई वस्तु, विशेषकर धातु, का संकेत देता है। ‘धातु’ जोड़ने से प्राचीन दर्पण की छवि स्पष्ट होती है, पर किसी विशिष्ट धातु, जैसे काँसे, को अनावश्यक रूप से निश्चित नहीं किया जाता।
theological_decisions:
- issue: עִמּוֹ में सर्वनाम के संदर्भ को स्पष्ट करना
  choice: उसके साथ
  alternative: परमेश्वर के साथ
  rationale: प्रसंग में ‘उसके’ से परमेश्वर अभिप्रेत हैं, फिर भी मूल पाठ सर्वनाम का प्रयोग करता है। इसलिए अनुवाद संदर्भ को बिना अनावश्यक रूप से स्पष्ट किए मूल की अभिव्यक्ति बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तू’ अय्यूब को किए गए सीधे, एकवचन संबोधन को बनाए रखता है। ‘दर्पण’ काव्यात्मक संदर्भ के अनुकूल है, जबकि ‘ढले हुए धातु के’ प्राचीन धातु-दर्पण की छवि स्पष्ट करता है।
