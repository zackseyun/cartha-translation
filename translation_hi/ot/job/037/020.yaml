  text: הַֽ/יְסֻפַּר ל֭/וֹ כִּ֣י אֲדַבֵּ֑ר אִֽם אָ֥מַר אִ֝֗ישׁ כִּ֣י יְבֻלָּֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/020.yaml
  text: Should it be told to him that I would speak? If a man speaks[c][b][a], surely he would be swallowed up.
translation:
  language: hi
  text: क्या उसे बताया जाए कि मैं बोलूँ? यदि कोई मनुष्य बोले,[a] तो वह निश्चय ही निगल लिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद का इब्रानी वाक्य-विन्यास कठिन है। एक और सम्भव अनुवाद है: “क्या उसे बताया जाए कि मैं बोलता हूँ? या क्या कोई मनुष्य कहे कि वह निगल लिया जाएगा?”'
    reason: alternative_reading
lexical_decisions:
- source_word: הֲיְסֻפַּר
  choice: क्या ... बताया जाए
  rationale: ספר के पुअल कर्मवाच्य और प्रश्नवाचक הֲ को एक अवैयक्तिक आलंकारिक प्रश्न के रूप में व्यक्त करता है।
- source_word: לוֹ
  choice: उसे
  rationale: संदर्भ में इसका संकेत परमेश्वर की ओर है; इब्रानी में आदरसूचक बड़े अक्षर का कोई भेद नहीं होता।
- source_word: כִּי אֲדַבֵּר
  choice: कि मैं बोलना चाहता हूँ
  rationale: כִּי कथन की विषयवस्तु आरम्भ करता है और अपूर्ण काल אֲדַבֵּר यहाँ विचाराधीन या अभिप्रेत वाणी का भाव देता है।
- source_word: אִם אָמַר אִישׁ
  choice: यदि कोई मनुष्य बोले
  rationale: अत्यंत संक्षिप्त इब्रानी उपवाक्य और उसकी शर्तात्मकता को बिना अनावश्यक कर्म जोड़कर बनाए रखता है; אישׁ को स्पष्ट रूप से रखा गया है।
- source_word: כִּי יְבֻלָּע
  choice: तो निश्चय ही वह निगल लिया जाएगा
  rationale: यहाँ כִּי को परिणाम की निश्चितता के रूप में और בלע के कर्मवाच्य को उसके सजीव 'निगल लिए जाने' वाले बिंब के साथ व्यक्त करता है।
theological_decisions:
- issue: לוֹ में परमेश्वर का संदर्भ
  choice: मुख्य पाठ में 'उसे'
  alternative: '''उन्हें'' या स्पष्ट रूप से ''परमेश्वर को'''
  rationale: मूल सर्वनाम एकवचन है और संदर्भ से परमेश्वर की ओर संकेत करता है; हिंदी का आदरसूचक बहुवचन मूल में निहित नहीं है, इसलिए स्रोत की व्याकरणिक आकृति रखी गई है।
- issue: אִישׁ का लिंग और सामान्य प्रयोग
  choice: '''कोई मनुष्य'''
  alternative: '''कोई व्यक्ति'' या ''कोई'''
  rationale: यह चयन इब्रानी אישׁ के मानव-संज्ञक रूप को बनाए रखते हुए हिंदी में उसके संभावित सामान्य अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- issue: पद की कठिन और संकुचित वाक्यरचना
  choice: पहले प्रश्न के बाद शर्तात्मक वाक्य रखा गया
  alternative: “क्या उसे बताया जाए कि मैं बोलता हूँ? या क्या कोई मनुष्य कहे कि वह निगल लिया जाएगा?”
  rationale: मुख्य पाठ इब्रानी उपवाक्यों के क्रम और तनाव को बनाए रखता है, पर वैकल्पिक वाक्य-संबंध को पादटिप्पणी में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, संक्षिप्त और आलंकारिक शैली रखी गई है। 'निगल लिया जाएगा' मूल बिंब को सुरक्षित रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उसी कठिन उपवाक्य के बाद रखा गया है जिससे वह संबंधित है।
