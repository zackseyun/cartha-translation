  text: Whether for correction[a], or for his land, or for steadfast love[c][b], he causes it to happen.
translation:
  language: hi
  text: चाहे ताड़ना के लिए[a], चाहे अपनी भूमि के लिए, चाहे अटल प्रेम के लिए[b]—वह उसे घटित करता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘छड़ी के लिए’; अर्थात दंड या अनुशासन के लिए।
    reason: lexical_alternative
  - marker: b
    text: ‘अटल प्रेम’ का अनुवाद ‘दया’, ‘करुणा’ या ‘निष्ठावान प्रेम’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इसे ‘वह उसे होने देता है’ या ‘वह उसे पहुँचा देता है’ भी अनुवादित किया जा सकता है। ‘उसे’ संभवतः प्रसंग में वर्णित बादल, वर्षा या तूफ़ानी घटना की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: चाहे
  rationale: तीन बार आया אִם यहाँ साधारण शर्त नहीं, बल्कि वैकल्पिक उद्देश्यों या परिणामों की शृंखला प्रस्तुत करता है; हिन्दी में ‘चाहे … चाहे … चाहे’ इस संरचना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשֵׁבֶט
  choice: ताड़ना के लिए
  rationale: שֵׁבֶט का मूल अर्थ ‘छड़ी’ है, पर यहाँ वह लाक्षणिक रूप से दंडात्मक सुधार या अनुशासन को दर्शाता है। ‘ताड़ना’ इस अर्थ को बनाए रखती है और इसे केवल प्रतिशोधात्मक दंड तक सीमित नहीं करती।
- source_word: לְאַרְצוֹ
  choice: अपनी भूमि के लिए
  rationale: אֶרֶץ का अर्थ ‘भूमि/पृथ्वी’ हो सकता है। तृतीय पुरुष एकवचन प्रत्यय के साथ ‘अपनी भूमि’ परमेश्वर के अधिकाराधीन भूमि को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְחֶסֶד
  choice: अटल प्रेम के लिए
  rationale: חֶסֶד में प्रेम, कृपा, दया और निष्ठा का समृद्ध भाव है। ‘अटल प्रेम’ इस व्यापक अर्थ को केवल ‘दया’ या ‘कृपा’ तक सीमित किए बिना सुरक्षित रखता है।
- source_word: יַמְצִאֵהוּ
  choice: वह उसे ले आता है
  rationale: 'מצא के हिफ़ील रूप में यहाँ कारणवाचक भाव है: परमेश्वर प्रसंग में वर्णित मौसमी घटना को आने या घटने देता नहीं मात्र, बल्कि उसे ले आता है। ‘उसे’ मूल के वस्तु-प्रत्यय और उसके संदर्भ की कुछ अस्पष्टता को बनाए रखता है।'
theological_decisions:
- issue: तीन אִם-वाक्यांशों में परमेश्वर के उद्देश्य
  choice: 'मौसम की घटना के तीन वैकल्पिक उद्देश्य माने गए हैं: ताड़ना, उसकी भूमि का हित, या अटल प्रेम।'
  alternative: इन्हें उद्देश्यों के बजाय केवल गंतव्यों के रूप में पढ़ा जा सकता है; पहले वाक्यांश को विशेष रूप से दंड भी माना जा सकता है।
  rationale: निकटवर्ती प्रसंग बादलों और मौसम पर परमेश्वर के शासन का वर्णन करता है। לְ के साथ दोहराया गया אִם उद्देश्य या परिणाम की श्रेणियाँ प्रस्तुत करता है। अनुवाद दंड और उपकार—दोनों की धार्मिक तनावपूर्ण व्यापकता को बनाए रखता है।
- issue: יַמְצִאֵהוּ के वस्तु-प्रत्यय का संदर्भ
  choice: ‘उसे’ कहकर मूल प्रत्यय को रखा गया और उसका संदर्भ प्रसंग में वर्णित मौसमी घटना की ओर खुला छोड़ा गया है।
  alternative: वस्तु को स्पष्ट करके ‘वर्षा’, ‘बादल’ या ‘तूफ़ान’ कहा जा सकता है।
  rationale: मूल पद में संज्ञा स्पष्ट रूप से दोहराई नहीं गई है। किसी एक मौसम-संबंधी संज्ञा को जोड़ना वास्तविक संदर्भगत अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ताड़ना’ शाब्दिक ‘छड़ी’ के लाक्षणिक अर्थ को व्यक्त करती है, जबकि ‘अटल प्रेम’ חֶסֶד की अर्थ-समृद्धि को बनाए रखता है। मुख्य वाक्य की त्रिस्तरीय ‘चाहे’ संरचना मूल की पुनरावृत्ति और संतुलन को सुरक्षित रखती है।
