base_translation:
  language: en
  yaml_path: translation/ot/job/037/012.yaml
  text: It turns around and around by his guidance[c][b][a], to accomplish all that he commands them over the face of the inhabited world on the earth.
translation:
  language: hi
  text: वह उसके कुशल निर्देशन में चक्कर लगाता हुआ घूमता है[a][b], ताकि वे धरती पर बसे संसार की सतह पर वह सब करें जिसकी वह उन्हें आज्ञा देता है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इधर-उधर घूमता रहता है”; इब्रानी में चक्करों में घूमने और दिशा बदलने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके संचालन से” अथवा “उसके मार्गदर्शन में”; इब्रानी शब्द कुशल दिशा-निर्देशन और नियंत्रण का संकेत देता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी अभिव्यक्ति का शाब्दिक भाव “बसे हुए संसार के मुख पर, धरती की ओर” है; यह समूचे स्थलीय संसार की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּא
  choice: वह
  rationale: पुल्लिंग एकवचन सर्वनाम को बनाए रखा गया है; संदर्भ में इसका संकेत बादल या व्यापक मौसमी घटना की ओर है, पर हिंदी में उसे अनावश्यक रूप से अधिक विशिष्ट नहीं किया गया।
- source_word: מְסִבּוֹת מִתְהַפֵּךְ
  choice: इधर-उधर घूमता रहता है
  rationale: दोनों पद मिलकर बार-बार घूमने और दिशा बदलने का भाव देते हैं। यह हिंदी प्रयोग गति की पुनरावृत्ति और परिवर्तनशीलता दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּתַחְבֻּלֹתוֹ
  choice: उसके कुशल निर्देशन में
  rationale: शब्द में संचालन, युक्तिपूर्ण मार्गदर्शन और नियंत्रण का भाव है; यह अनुवाद परमेश्वर के निर्देशन को व्यक्त करता है, बिना आधुनिक तकनीकी अर्थ थोपे।
- source_word: לְפָעֳלָם
  choice: ताकि वे ... करें
  rationale: प्रत्यय बहुवचन कर्ताओं की ओर संकेत करता है और उद्देश्य का भाव देता है; हिंदी में इस संख्या-परिवर्तन को स्पष्ट रखा गया है।
- source_word: כֹּל אֲשֶׁר יְצַוֵּם
  choice: वह सब ... जिसकी वह उन्हें आज्ञा देता है
  rationale: व्यापक संबंधवाचक अभिव्यक्ति और क्रिया के बहुवचन कर्म-प्रत्यय दोनों सुरक्षित रखे गए हैं।
- source_word: עַל־פְּנֵי תֵבֵל אָרְצָה
  choice: धरती पर बसे संसार के चारों ओर
  rationale: תֵבֵל के बसे हुए संसार के भाव, עַל־פְּנֵי के विस्तृत स्थानिक भाव और אָרְצָה के धरती/भूमि की ओर संकेत को पठनीय हिंदी में संयोजित किया गया है।
theological_decisions:
- issue: एकवचन सर्वनाम और बहुवचन प्रत्ययों का संदर्भ
  choice: एकवचन ‘वह’ को संदर्भित मौसमी घटना के लिए तथा बहुवचन ‘वे/उन्हें’ को उसके अंतर्गत कार्यरत बादलों या मौसमी साधनों के लिए रखा गया है।
  alternative: पूरे वाक्य को केवल एक बादल, या विशेष रूप से बिजली अथवा तूफ़ानी तंत्र के संदर्भ में समझना।
  rationale: निकटवर्ती प्रसंग बादलों, बिजली और तूफ़ानी गतिविधि का वर्णन करता है। मूल पाठ संख्या में वास्तविक परिवर्तन दिखाता है; अनुवाद उसे समतल करने के बजाय सुरक्षित रखता है और सटीक वैज्ञानिक पहचान निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘इधर-उधर घूमता रहता है’ पुनरावृत्त और बदलती गति को बोलचाल की अतिसाधारणता के बिना व्यक्त करता है। एकवचन से बहुवचन में मूल पाठ का परिवर्तन जानबूझकर बनाए रखा गया है।
