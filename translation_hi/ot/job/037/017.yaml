  text: तुम, जिनके वस्त्र गर्म होते हैं, जब वह दक्षिण से धरती को शांत करता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दक्षिणी हवा से।’ इब्रानी में शाब्दिक रूप से ‘दक्षिण से’ है। यह दक्षिणी दिशा अथवा वहाँ से आने वाली हवा का संकेत हो सकता है। ‘शांत करता है’ इब्रानी के उस क्रियात्मक रूप को दर्शाता है जिसका कर्ता संदर्भ में परमेश्वर समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जब ... तब तुम्हारे
  rationale: इस काव्यात्मक प्रश्न में संबंधवाचक अव्यय को हिंदी में स्वाभाविक कालवाचक उपवाक्य के साथ व्यक्त किया गया है; संबोधन का द्वितीय पुरुष रूप ‘तुम्हारे’ में स्पष्ट है।
- source_word: בְּגָדֶיךָ
  choice: तुम्हारे वस्त्र
  rationale: ‘वस्त्र’ בגד का सीधा और गरिमापूर्ण आधुनिक हिंदी रूप है।
- source_word: חַמִּים
  choice: गरम हो जाते हैं
  rationale: विशेषण का अर्थ ‘गरम’ है; ‘हो जाते हैं’ इस परिस्थिति में अनुभव होने वाली गर्मी को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּהַשְׁקִט אֶרֶץ
  choice: धरती शांत हो जाती है
  rationale: שקט का मूल भाव शांत, स्थिर या निश्चल होना है। ‘शांत’ मूल की व्यापकता बनाए रखता है और मौसम के संदर्भ में सहज है।
- source_word: מִדָּרוֹם
  choice: दक्षिण की ओर से
  rationale: शाब्दिक अर्थ ‘दक्षिण से’ है। मुख्य पाठ में इसी अस्पष्टता को सुरक्षित रखा गया है; संभावित दक्षिणी हवा को पादटिप्पणी में बताया गया है।
