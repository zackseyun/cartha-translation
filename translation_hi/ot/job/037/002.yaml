translation:
  language: hi
  text: उसकी आवाज़ की थरथराहट को ध्यान से सुनो[a], और उस गड़गड़ाहट[b] को, जो उसके मुँह से निकलती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “सुनो, अवश्य सुनो।” इब्रानी रचना आदेश पर बल देती है। “थरथराहट” के लिए प्रयुक्त शब्द का अर्थ व्याकुलता, हलचल या प्रचंडता भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गहरी ध्वनि,” “बुदबुदाहट” अथवा “गूँज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ שָׁמוֹעַ
  choice: ध्यान से सुनो
  rationale: आज्ञार्थक क्रिया के साथ उसी धातु का infinitive absolute आदेश पर विशेष बल देता है। आधुनिक हिन्दी में ‘ध्यान से सुनो’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּרֹגֶז
  choice: के कंपन को
  rationale: רֹגֶז कंपन, व्याकुलता या प्रचंड हलचल का बोध करा सकता है। तूफ़ान और गर्जन के प्रसंग में ‘कंपन’ ध्वनि की थरथराती, विचलित कर देने वाली प्रकृति को व्यक्त करता है, बिना इसे अनिवार्य रूप से क्रोध मानने के।
- source_word: קֹלוֹ
  choice: उसकी आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है। अगले वाक्यांश में ‘उसके मुँह’ के उल्लेख के कारण ‘आवाज़’ मूल की मानवीकरणयुक्त काव्य-छवि को सुरक्षित रखती है।
- source_word: וְהֶגֶה
  choice: और उस गड़गड़ाहट को भी
  rationale: הֶגֶה धीमी या गहरी ध्वनि, बुदबुदाहट अथवा कराह जैसी आवाज़ को सूचित कर सकता है। तूफ़ान के प्रसंग में ‘गड़गड़ाहट’ गर्जन की गहरी ध्वनि को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: מִפִּיו יֵצֵא
  choice: जो उसके मुँह से निकलती है
  rationale: यह चयन יצא के ‘निकलना’ अर्थ और ‘उसके मुँह से’ वाली ठोस काव्यात्मक अभिव्यक्ति—दोनों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: तूफ़ान के चित्रण में परमेश्वर के लिए मानवीकरणयुक्त भाषा
  choice: ‘उसकी आवाज़’ और ‘उसके मुँह’ को यथावत रखना
  alternative: इसे ‘उसकी ध्वनि’, ‘बादल की गर्जना’ या केवल ‘गर्जन’ कहकर अमानवीकृत करना
  rationale: इब्रानी पद तूफ़ान को परमेश्वर के अपने उच्चारण के रूप में काव्यात्मक ढंग से प्रस्तुत करता है। मानवीकरण को बनाए रखना मूल पाठ की साहित्यिक और धर्मवैचारिक शक्ति को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ध्यान से सुनो’ आदेश की इब्रानी तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘कंपन’ और ‘गड़गड़ाहट’ तूफ़ान की श्रव्य तथा थरथराती काव्य-छवि बनाए रखते हैं।
