  text: מִ/נִּשְׁמַת אֵ֥ל יִתֶּן קָ֑רַח וְ/רֹ֖חַב מַ֣יִם בְּ/מוּצָֽק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/010.yaml
  text: From the breath of God ice is given[b][a], and the broad expanse of waters is frozen solid.
translation:
  language: hi
  text: परमेश्वर की साँस से बर्फ़ जमती है[a], और जल का विस्तृत फैलाव ठोस हो जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की साँस के द्वारा बर्फ़ जमती है।” इब्रानी संबंधबोधक उपसर्ग स्रोत (“से”) या साधन (“के द्वारा”)—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जल की चौड़ाई जमकर कठोर हो जाती है।” इब्रानी अभिव्यक्ति काव्यात्मक है और सम्भवतः जल के विस्तृत तल के ठोस हो जाने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנִּשְׁמַת
  choice: की साँस से
  rationale: נִשְׁמָה का ठोस काव्यात्मक बिंब ‘साँस’ से सुरक्षित रहता है। उपसर्ग מִן स्रोत या साधन दोनों व्यक्त कर सकता है; मुख्य पाठ में सहज हिन्दी ‘से’ यही खुलापन रखती है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ ईश्वर के सामान्य नाम के रूप में है; ‘परमेश्वर’ आधुनिक हिन्दी बाइबलीय शैली में स्वाभाविक और गरिमापूर्ण है, जबकि ‘सर्वशक्तिमान’ जोड़ना मूल से अधिक विशिष्ट होता।
- source_word: יִתֶּן קָרַח
  choice: बर्फ़ जमती है
  rationale: शाब्दिक रूप ‘बर्फ़ देता है/दी जाती है’ हिन्दी में अस्वाभाविक है। मौसम-संबंधी सन्दर्भ और अगले समानांतर खंड को देखते हुए ‘बर्फ़ जमती है’ अर्थ को स्पष्ट, प्राकृतिक ढंग से व्यक्त करता है।
- source_word: וְרֹחַב מַיִם
  choice: और जल का विस्तृत फैलाव
  rationale: רֹחַב चौड़ाई या व्यापक फैलाव दर्शाता है। ‘जल का विस्तृत फैलाव’ केवल माप के बजाय पानी के फैले हुए विस्तार का काव्यात्मक चित्र देता है।
- source_word: בְּמוּצָק
  choice: ठोस हो जाता है
  rationale: מוּצָק ढला हुआ, दृढ़ या कठोर किया हुआ होने का भाव रखता है। यहाँ पानी के जमकर ठोस होने का भाव है; ‘ठोस हो जाता है’ मूल रूपक और प्रसंग दोनों के अनुकूल है।
