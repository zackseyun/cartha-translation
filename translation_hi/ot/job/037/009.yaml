  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की काव्यात्मक समानांतरता बनाए रखने के लिए दोनों खंडों में ‘आती है’ रखा गया है। दुर्लभ शब्द מְזָרִים की अनिश्चितता को मुख्य पाठ में संभावित अर्थ और पादटिप्पणी में वैकल्पिक दिशासूचक अर्थ देकर सुरक्षित रखा गया है।
