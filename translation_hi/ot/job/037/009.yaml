  yaml_path: translation/ot/job/037/009.yaml
  text: From its chamber comes the storm[b][a], and from the scattering winds comes cold.
translation:
  language: hi
  text: भीतरी कक्ष से तूफ़ान आता है[a], और बिखेरने वाली हवाओं से ठंड आती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दक्षिण से तूफ़ान आता है।” इब्रानी में शाब्दिक रूप से “कक्ष से” है; यह काव्यात्मक ढंग से दक्षिणी दिशा या किसी छिपे हुए भंडार का संकेत हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “उत्तर से ठंड आती है,” अथवा “बिखेरने वाली हवाओं से ठंड आती है।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַחֶדֶר
  choice: भीतरी कक्ष से
  rationale: חֶדֶר का मूल अर्थ ‘कमरा, कक्ष, भीतरी कक्ष’ है। यहाँ यह काव्यात्मक रूप से आँधी के छिपे हुए उद्गम-स्थान या भंडार का संकेत दे सकता है; इसलिए मुख्य पाठ में दिशासूचक अर्थ थोपे बिना शाब्दिक बिंब रखा गया है।
- source_word: תָּבוֹא
  choice: आती है
  rationale: בוא का सामान्य अर्थ ‘आना, पहुँचना’ है। स्त्रीलिंग संज्ञा ‘आँधी’ के साथ ‘आती है’ स्वाभाविक और सजीव है। दूसरे खंड में सहज हिन्दी के लिए इसी क्रिया को दोहराया गया है, यद्यपि इब्रानी में वह निहित है।
- source_word: סוּפָה
  choice: आँधी
  rationale: סוּפָה प्रचंड तूफ़ान, झंझा या बवंडर का बोध करा सकता है। ‘आँधी’ आधुनिक हिन्दी में स्वाभाविक है और शब्द को केवल चक्रवाती ‘बवंडर’ तक सीमित नहीं करती।
- source_word: וּמִמְּזָרִים
  choice: बिखेरने वाली हवाओं से
  rationale: מְזָרִים दुर्लभ और विवादित शब्द है। इसे बिखेरने या तितर-बितर करने वाली हवाओं से जोड़ना संभावित शब्दार्थ को व्यक्त करता है, जबकि ‘उत्तर दिशा’ जैसे प्रसंगगत अर्थ को पादटिप्पणी में रखा गया है।
- source_word: קָרָה
  choice: ठंड
  rationale: קָרָה ठंड, पाला या जमा देने वाले मौसम का संकेत देता है। ‘ठंड’ संक्षिप्त, व्यापक और इस काव्यात्मक समानांतरता में स्वाभाविक है।
