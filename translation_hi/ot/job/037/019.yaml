  yaml_path: translation/ot/job/037/019.yaml
  text: Teach us what we should say to him[b][a]; we cannot arrange our words because of darkness.
translation:
  language: hi
  text: हमें बता कि हम उससे क्या कहें; अंधकार के कारण हम अपने शब्दों को व्यवस्थित नहीं कर सकते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹדִיעֵנוּ
  choice: हमें बता
  rationale: यह ידע का हिफ़ील आज्ञार्थक रूप है, जिसका अर्थ ‘हमें ज्ञात करा’ है। आधुनिक स्वाभाविक हिन्दी में ‘हमें बता’ इस प्रेरणार्थक आशय को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מַה נֹּאמַר לוֹ
  choice: हम उससे क्या कहें
  rationale: यह विचार-विमर्श सूचक प्रश्न है—वक्ता पूछता है कि परमेश्वर से क्या कहा जाए। ‘क्या कहें’ इस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: לֹא נַעֲרֹךְ
  choice: हम अपने शब्दों को क्रम से नहीं रख सकते
  rationale: ערך का मूल अर्थ ‘क्रम लगाना’ या ‘व्यवस्थित करना’ है। प्रसंग में इसका निहित कर्म वचन अथवा तर्क हो सकता है; ‘अपने शब्दों को क्रम से रखना’ न्यायिक ‘मामला प्रस्तुत करने’ जैसी अधिक विशिष्ट व्याख्या थोपे बिना वक्तृत्व-संबंधी आशय व्यक्त करता है।
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: अंधकार के कारण
  rationale: מִפְּנֵי यहाँ कारण दर्शाता है। ‘अंधकार’ को अपरिभाषित रखने से मूल पाठ की यह अस्पष्टता बनी रहती है कि वह शाब्दिक अंधकार है या मानवीय अज्ञान और असमर्थता का रूपक।
theological_decisions:
- issue: अंतिम खंड में ‘अंधकार’ का आशय
  choice: ‘अंधकार’ शब्द को बिना व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘अज्ञान के कारण’ अथवा ‘अंधेरा होने के कारण’
  rationale: इब्रानी काव्य यह तय नहीं करता कि अंधकार शाब्दिक है या मनुष्य की समझ और अभिव्यक्ति की सीमा का रूपक। अनुवाद में इस अर्थगत तनाव को खुला रखा गया है।
- issue: נַעֲרֹךְ का न्यायिक या सामान्य वक्तृत्व-संबंधी भाव
  choice: ‘अपने शब्दों को क्रम से नहीं रख सकते’
  alternative: ‘अपना मुकदमा प्रस्तुत नहीं कर सकते’
  rationale: आसपास का प्रसंग परमेश्वर के सामने बोलने की बात करता है और न्यायिक छाया संभव है, पर पद में ‘मुकदमा’ स्पष्ट रूप से नहीं आया। इसलिए अधिक मूल-समीप और कम व्याख्यात्मक अभिव्यक्ति चुनी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संबोधन में एकवचन ‘बता’ प्रसंग के अनुसार अय्यूब को संबोधित करने वाले इब्रानी आज्ञार्थक रूप को दर्शाता है। किसी पाद-टिप्पणी की आवश्यकता नहीं रखी गई, क्योंकि मुख्य पाठ स्वयं प्रमुख शाब्दिक और रूपकगत अस्पष्टता को सुरक्षित रखता है।
