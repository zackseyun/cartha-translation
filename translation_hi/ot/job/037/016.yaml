  text: Do you know about the balancing of the clouds[a], the wonders of one perfect in knowledge?
translation:
  language: hi
  text: क्या तू बादलों के फैलाव[a] और पूर्ण ज्ञानवाले के आश्चर्यकर्मों को जानता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बादलों के संतुलन को।” इब्रानी शब्द दुर्लभ है और उसका ठीक अर्थ अनिश्चित है; संभवतः यह बादलों के आकाश में फैलने या टिके रहने की रीति को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתֵדַע
  choice: क्या तू ... जानता है
  rationale: प्रश्नवाचक הֲ और ידע के द्वितीय पुरुष एकवचन रूप को सीधे, आलंकारिक चुनौती के रूप में रखा गया है। अय्यूब को एकवचन संबोधन के कारण सम्मानसूचक बहुवचन के बजाय काव्यात्मक ‘तू’ उपयुक्त है।
- source_word: עַל
  choice: को
  rationale: हिन्दी में ‘जानना’ के साथ विषय को कर्म के रूप में व्यक्त करना ‘के विषय में’ की अपेक्षा अधिक स्वाभाविक है; अर्थ विषय-संबंधी ज्ञान का ही रहता है।
- source_word: מִפְלְשֵׂי עָב
  choice: बादलों के फैलाव
  rationale: दुर्लभ מִפְלְשֵׂי का सटीक आशय अनिश्चित है। मूल धातु और संभावित दृश्य-बिंब को देखते हुए ‘फैलाव’ स्वाभाविक है; बादलों के संतुलित या आकाश में टिके रहने का विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מִפְלְאוֹת
  choice: अद्भुत कामों
  rationale: פלא से बने इस बहुवचन संज्ञा-रूप में असाधारण कार्य या घटनाएँ अभिप्रेत हैं; ‘अद्भुत काम’ सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण है।
- source_word: תְּמִים
  choice: सिद्ध
  rationale: यहाँ शब्द पूर्णता या त्रुटिहीनता का भाव देता है। ‘ज्ञान में सिद्ध’ हिन्दी में स्वाभाविक है और केवल नैतिक निर्दोषता का अर्थ आरोपित नहीं करता।
- source_word: דֵּעִים
  choice: ज्ञान में
  rationale: इब्रानी बहुवचन यहाँ ज्ञान की परिपूर्णता या प्रचुरता व्यक्त कर सकता है; हिन्दी में एकवचन भाववाचक ‘ज्ञान’ स्वाभाविक रूप से वही अर्थ देता है।
theological_decisions:
- issue: ‘ज्ञान में सिद्ध’ का संदर्भित व्यक्ति
  choice: संदर्भ से परमेश्वर की ओर संकेत, पर नाम न जोड़ना
  alternative: किसी सामान्य ज्ञानी व्यक्ति या एलीहू का परोक्ष आत्म-संदर्भ
  rationale: मौसम और सृष्टि पर परमेश्वर के शासन की चर्चा में यह पदबंध स्वाभाविक रूप से परमेश्वर की ओर संकेत करता है। फिर भी इब्रानी में नाम स्पष्टतः नहीं है, इसलिए अनुवाद ‘परमेश्वर’ जोड़कर संदर्भ को निर्णीत नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। अय्यूब को मूल के द्वितीय पुरुष एकवचन के अनुरूप ‘तू’ कहा गया है। डैश दूसरे पदांश को पहले पदांश की व्याख्यात्मक समानता के रूप में पढ़ने देता है, जबकि मूल की संक्षिप्तता और संदर्भगत अस्पष्टता बनी रहती है।
