  text: इससे भी मेरा हृदय काँप उठता है और अपनी जगह से उछल पड़ता है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘थरथरा उठता है’; इब्रानी क्रिया भय, विस्मय या व्याकुलता से काँपने का भाव दे सकती है।
    reason: lexical_alternative
