- source_word: אַף לְזֹאת
  choice: इस पर भी
  rationale: אַף की संयोजक और बलवाचक भूमिका तथा לְזֹאת के निकटवर्ती घटना की ओर संकेत—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יֶחֱרַד
  choice: काँप उठता है
  rationale: यह क्रिया भय, विस्मय या व्याकुलता से काँपने का भाव दे सकती है; ‘काँप उठता है’ तीव्रता बनाए रखता है, पर केवल भय का अर्थ निश्चित नहीं करता।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: मूल रूपक और इब्रानी में भीतरी व्यक्ति तथा भावनाओं के केंद्र का संकेत सुरक्षित रहता है।
- source_word: וְיִתַּר
  choice: उछल पड़ता है
  rationale: कठिन क्रिया को प्रसंगानुसार हृदय की अचानक और तीव्र गति के रूप में व्यक्त करता है तथा सजीव रूपक बनाए रखता है।
- source_word: מִמְּקוֹמוֹ
  choice: अपनी जगह से
  rationale: सर्वनाम का संबंध ‘हृदय’ से स्पष्ट करता है और मूल में स्थान से विस्थापन की छवि सुरक्षित रखता है।
