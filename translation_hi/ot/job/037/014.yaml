  edition: WLC
  text: הַאֲזִ֣ינָ/ה זֹּ֣את אִיּ֑וֹב עֲ֝מֹ֗ד וְ/הִתְבּוֹנֵ֤ן נִפְלְא֬וֹת אֵֽל׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/014.yaml
  text: Listen to this[a], Job[c][b]; stand still and consider the wonders of God.
translation:
  language: hi
  text: अय्यूब, यह सुन; खड़ा हो और परमेश्वर के अद्भुत कामों पर विचार कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: आज्ञार्थक क्रिया ध्यानपूर्वक सुनने का आह्वान करती है। ‘कान लगा’ आधुनिक हिन्दी में स्वाभाविक है और साधारण ‘सुन’ की अपेक्षा अपेक्षित एकाग्रता को स्पष्ट करता है।
- source_word: זֹּאת
  choice: इस बात पर
  rationale: स्त्रीलिंग एकवचन संकेतवाचक सर्वनाम निकटवर्ती कथन की ओर संकेत करता है। हिन्दी में ‘इस बात पर कान लगा’ इस संबंध को सहज ढंग से व्यक्त करता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: עֲמֹד
  choice: ठहर जा
  rationale: आज्ञार्थक ‘खड़ा हो/ठहर’ का प्रसंगगत आशय गतिविधि रोककर स्थिर होने का है। ‘ठहर जा’ हिन्दी में चिंतन के लिए रुकने का भाव स्वाभाविक रूप से देता है, बिना शारीरिक मुद्रा को अनावश्यक रूप से प्रमुख बनाए।
- source_word: וְהִתְבּוֹנֵן
  choice: और ... ध्यान दे
  rationale: हित्पोलेल आज्ञार्थक रूप सावधानी से विचार करने और मन लगाने का भाव रखता है। ‘ध्यान दे’ सरल, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: נִפְלְאוֹת
  choice: अद्भुत कामों
  rationale: बहुवचन संज्ञा परमेश्वर के आश्चर्यजनक कार्यों या चमत्कारों को सूचित करती है। ‘अद्भुत काम’ कार्यात्मक अर्थ बनाए रखता है और केवल अमूर्त ‘अद्भुत बातों’ से अधिक स्पष्ट है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל सामान्य दैवी पदनाम के रूप में प्रयुक्त है। आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है; ‘सर्वशक्तिमान’ जोड़ना मूल से अधिक अर्थ भर देता।
theological_decisions:
- issue: दैवी पदनाम אֵל का अनुवाद
  choice: परमेश्वर
  alternative: सामर्थी परमेश्वर
  rationale: इस पद में शब्द को विशेष रूप से ‘सामर्थी’ बनाकर विस्तारित करने की आवश्यकता नहीं है। ‘परमेश्वर’ मूल के सामान्य दैवी संदर्भ को बिना अतिरिक्त धर्मवैचारिक बल दिए सुरक्षित रखता है।
- issue: נִפְלְאוֹת को वस्तुओं या कार्यों के रूप में समझना
  choice: अद्भुत कामों
  alternative: अद्भुत बातों
  rationale: यह शब्द परमेश्वर के आश्चर्यजनक कार्यों को सूचित कर सकता है। ‘कामों’ प्रसंग में प्राकृतिक जगत में वर्णित दैवी क्रियाओं को उभारता है, जबकि किसी विशिष्ट प्रकार के चमत्कार तक अर्थ को सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘हे अय्यूब’ संबोधन को स्पष्ट करता है; ‘कान लगा’ ध्यानपूर्वक सुनने की आज्ञा व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि स्वाभाविक हिन्दी पाठ में मूल की मुख्य अर्थ-सीमा सुरक्षित है।
