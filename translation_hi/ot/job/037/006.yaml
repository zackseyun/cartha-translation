  text: כִּ֤י לַ/שֶּׁ֨לַג יֹאמַ֗ר הֱוֵ֫א אָ֥רֶץ וְ/גֶ֥שֶׁם מָטָ֑ר וְ֝/גֶ֗שֶׁם מִטְר֥וֹת עֻזּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/006.yaml
  text: For he says to the snow[a], ‘Fall to the earth,’ and to the rain, ‘Become a shower,’ and to the rains[b], ‘Become a downpour of his might.’
translation:
  language: hi
  text: क्योंकि वह हिम से कहता है[a], “पृथ्वी पर हो जा,” और वर्षा की बौछार से तथा उसके सामर्थ्य की प्रचण्ड वर्षाओं से[b] भी [ऐसा ही कहता है]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी पर हो जा”; अर्थात हिम को धरती पर प्रकट होने या पड़े रहने की आज्ञा दी जाती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी पदबंध संक्षिप्त और काव्यात्मक है। इसका अनुवाद “और उसके सामर्थ्य की भारी वर्षाओं से” या “और वर्षा की प्रचण्ड धाराओं से” भी हो सकता है। अंतिम सर्वनाम को परमेश्वर के सामर्थ्य अथवा वर्षा के अपने वेग से संबद्ध समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले प्रसंग में परमेश्वर के मौसम पर नियंत्रण का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: לַשֶּׁלַג
  choice: हिम से
  rationale: ל के साथ אמר वाणी के संबोधित पात्र को सूचित करता है; इससे हिम को दिए गए सजीव आदेश का भाव बना रहता है।
- source_word: יֹאמַר
  choice: कहता है
  rationale: काव्यात्मक वर्णन में अपूर्ण क्रिया वर्तमानकालीन, सजीव क्रिया व्यक्त करती है; आदेश का बल उद्धृत आज्ञार्थक वाक्यों में है।
- source_word: הֱוֵא אָרֶץ
  choice: पृथ्वी पर गिर
  rationale: היה के आज्ञार्थक रूप का प्रसंगगत आशय हिम का धरती पर उपस्थित होना है; हिन्दी में ‘गिर’ स्वाभाविक है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
- source_word: וְגֶשֶׁם מָטָר
  choice: और वर्षा से, ‘बौछार बन जा’
  rationale: वर्षा के दो निकटार्थक शब्दों को अलग रखकर काव्यात्मक पूर्णता और तीव्रता का क्रम व्यक्त किया गया है।
- source_word: וְגֶשֶׁם מִטְרוֹת עֻזּוֹ
  choice: और मूसलाधार वर्षाओं से, ‘उसके सामर्थ्य की झड़ी बन जाओ’
  rationale: מִטְרוֹת का बहुवचन तीव्र या बार-बार होने वाली वर्षा का संकेत देता है। संक्षिप्त इब्रानी को समानांतर आदेश के रूप में रखा गया है।
- source_word: עֻזּוֹ
  choice: उसके सामर्थ्य
  rationale: पुल्लिंग एकवचन प्रत्यय प्रसंग में बोलने और मौसम पर शासन करने वाले परमेश्वर की ओर सबसे स्वाभाविक रूप से संकेत करता है।
theological_decisions:
- issue: עֻזּוֹ में सर्वनाम का संदर्भ
  choice: ‘उसके सामर्थ्य’—सर्वनाम परमेश्वर की ओर संकेत करता है।
  alternative: ‘उसके वेग’—सर्वनाम वर्षा की ओर संकेत कर सकता है।
  rationale: निकटवर्ती प्रसंग में परमेश्वर मौसम को आदेश देता और नियंत्रित करता है; इसलिए सर्वनाम को परमेश्वर से जोड़ना प्रवाह के अधिक अनुकूल है, पर दूसरी व्याकरणिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण काव्यात्मक गद्य अपनाया गया है। ‘हिम’, ‘वर्षा’, ‘बौछार’ और ‘झड़ी’ वर्षा-संबंधी इब्रानी शब्दों की पुनरुक्ति तथा बढ़ती तीव्रता को यथासंभव स्पष्ट रखते हैं।
