  text: הֲ֭/תֵדַע בְּ/שׂוּם אֱל֣וֹהַּ עֲלֵי/הֶ֑ם וְ֝/הוֹפִ֗יעַ א֣וֹר עֲנָנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/015.yaml
  text: Do you know how God lays these upon them[b][a], and causes the light of his cloud to shine?
translation:
  language: hi
  text: क्या तू जानता है कि परमेश्वर इन्हें उन पर कैसे रखता है और अपने बादल का प्रकाश चमकाता है[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब परमेश्वर इन्हें उन पर रखता है,” अथवा “परमेश्वर इन्हें उन पर कैसे नियुक्त करता है।” इब्रानी अभिव्यक्ति संक्षिप्त है; ‘रखने’ का कर्म और ‘उन’ का संदर्भ आसपास के प्रसंग से समझना पड़ता है। ‘प्रकाश चमकाता है’ का अर्थ “अपने बादल की चमक को कौंधाता है” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲתֵדַע
  choice: क्या तू जानता है
  rationale: ידע का यह रूप अय्यूब से किया गया सीधा आलंकारिक प्रश्न है। ‘क्या तू जानता है’ इसके अर्थ और एकवचन संबोधन, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּשׂוּם
  choice: कैसे ठहराता है
  rationale: ב के साथ שום का क्रियार्थक संज्ञा-रूप परिस्थिति (‘जब ठहराता है’) या रीति (‘कैसे ठहराता है’) व्यक्त कर सकता है। प्रश्न के बाद ‘कैसे ठहराता है’ सहज है, पर वैकल्पिक कालगत अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में אֱלוֹהַּ ‘परमेश्वर’ के लिए प्रयुक्त एकवचन काव्यात्मक रूप है; यहाँ किसी विस्तृत उपाधि का आधार नहीं है।
- source_word: עֲלֵיהֶם
  choice: उन पर
  rationale: על के साथ बहुवचन प्रत्यय का सीधा अर्थ ‘उन पर’ है। सर्वनाम का संदर्भ पद में स्पष्ट नहीं किया गया, इसलिए हिन्दी में भी उसे अनिर्दिष्ट रखा गया है।
- source_word: וְהוֹפִיעַ
  choice: और ... चमकाता है
  rationale: יפע का हिफ़ईल रूप प्रकाश को प्रकट करने या चमकाने का कारण बनने का भाव देता है। ‘चमकाता है’ आधुनिक हिन्दी में इस प्रेरणार्थक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: אוֹר का मूल अर्थ ‘प्रकाश’ या ‘चमक’ है। मुख्य पाठ में सामान्य अर्थ ‘प्रकाश’ रखा गया है; कौंध या बिजली का अधिक विशिष्ट बिंब पादटिप्पणी में दिया गया है।
- source_word: עֲנָנוֹ
  choice: अपने बादल का
  rationale: एकवचन संज्ञा पर तृतीय पुरुष एकवचन प्रत्यय का अर्थ ‘उसका बादल’ है। वाक्य का कर्ता परमेश्वर होने के कारण हिन्दी में ‘अपने बादल का’ अधिक स्वाभाविक और स्पष्ट है, जबकि एकवचन रूप सुरक्षित रहता है।
theological_decisions:
- issue: שום का निहित कर्म और ‘उन’ का संदर्भ
  choice: ‘इन्हें उन पर’ कहकर कर्म और सर्वनाम के संदर्भ को अनिर्दिष्ट रखना
  alternative: ‘बादलों को उनके ऊपर ठहराता है’ या ‘उन पर अपनी आज्ञा रखता है’
  rationale: इब्रानी में שום के बाद कर्म स्पष्ट नहीं है और ‘उन’ का संदर्भ आसपास के मौसम-संबंधी प्रसंग पर निर्भर है। किसी खास प्राकृतिक प्रक्रिया या दैवी आज्ञा को स्पष्ट रूप से जोड़ना मूल पाठ की वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: אוֹר עֲנָנוֹ का स्वरूप
  choice: ‘अपने बादल का प्रकाश’
  alternative: ‘अपने बादल की बिजली’ या ‘अपने बादल की चमक’
  rationale: प्रसंग बिजली की ओर संकेत कर सकता है, पर אוֹר का सामान्य अर्थ ‘प्रकाश’ भी संभव है। मुख्य पाठ व्यापक शब्द रखता है और अधिक विशिष्ट अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष है। अय्यूब के लिए एकवचन ‘तू’ मूल के 2ms संबोधन को सुरक्षित रखता है। ‘इन्हें उन पर’ जानबूझकर कुछ खुला रखा गया है ताकि इब्रानी की निहित वस्तु और अस्पष्ट संदर्भ पर अनावश्यक व्याख्या न थोपी जाए।
