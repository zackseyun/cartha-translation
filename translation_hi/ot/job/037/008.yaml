  text: Then the wild animal enters its lair[a], and remains in its dens.
translation:
  language: hi
  text: 'तब जंगली पशु अपनी माँद[a] में चला जाता है,

    और अपने बसेरों में रहता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने छिपने के स्थान में।”
    reason: אָרֶב का अर्थ माँद, छिपने का स्थान, या घात लगाने का स्थान हो सकता है; मुख्य पाठ में पशु-संदर्भानुकूल ‘माँद’ रखा गया है।
lexical_decisions:
- source_word: וַתָּבֹא
  choice: तब ... चला जाता है
  rationale: यह क्रिया काव्यात्मक क्रम को आगे बढ़ाती है। हिन्दी में सामान्य वर्तमान काल प्राकृतिक घटनाओं के सजीव वर्णन के लिए सहज है; ‘तब’ क्रम को स्पष्ट करता है।
- source_word: חַיָּה
  choice: जंगली पशु
  rationale: यहाँ किसी विशेष प्रजाति के बजाय वन्य जीव का सामान्य बोध है। ‘जंगली पशु’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְמוֹ אָרֶב
  choice: अपनी माँद में
  rationale: אָרֶב छिपकर रहने या घात लगाने के स्थान को सूचित कर सकता है। पशु के संदर्भ में ‘माँद’ ठोस आश्रय और गुप्त ठिकाने—दोनों भावों को संक्षेप में व्यक्त करती है।
- source_word: וּבִמְעוֹנֹתֶיהָ
  choice: और अपने बसेरों में
  rationale: מְעוֹנוֹת बहुवचन में निवास-स्थानों को बताता है। ‘बसेरों’ से बहुवचन सुरक्षित रहता है और पहले पद के ‘माँद’ को अनावश्यक रूप से दोहराया नहीं जाता। स्त्रीलिंग एकवचन प्रत्यय का आशय उसी सामूहिक/सामान्य पशु से है, इसलिए हिन्दी में ‘अपने’ स्वाभाविक है।
- source_word: תִשְׁכֹּן
  choice: ही रहता है
  rationale: שכן का मूल अर्थ रहना या निवास करना है। प्रसंग में मौसम के कारण आश्रय में बने रहने का भाव है; ‘ही’ इस निरंतर ठहराव को स्वाभाविक हिन्दी में उभारता है।
