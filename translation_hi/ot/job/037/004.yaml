- source_word: אַחֲרָיו
  choice: उसके पीछे
  rationale: पुल्लिंग एकवचन प्रत्यय को बनाए रखते हुए यह पिछले पद की बिजली की ओर संकेत कर सकता है; साथ ही इब्रानी की संदर्भगत अस्पष्टता बनी रहती है।
- source_word: יִשְׁאַג קוֹל
  choice: उसकी आवाज़ गरजती है
  rationale: שׁאג की सिंह-जैसी गर्जना की सजीव छवि को स्वाभाविक हिन्दी में रखा गया है; हिन्दी में केवल ‘एक आवाज़’ कहने की अपेक्षा प्रसंगगत स्वामी को व्यक्त करना अधिक सहज है।
- source_word: יַרְעֵם
  choice: वह ... गर्जन करता है
  rationale: रעם के हिफ़ील रूप में परमेश्वर द्वारा मेघ-गर्जन उत्पन्न करने का भाव है; ‘गर्जन करता है’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּקוֹל גְּאוֹנוֹ
  choice: अपनी प्रतापी आवाज़ से
  rationale: גָּאוֹן के वैभव, उत्कर्ष और प्रताप के अर्थ को ‘प्रतापी’ संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: וְלֹא יְעַקְּבֵם
  choice: वह उन्हें रोककर नहीं रखता
  rationale: עקב के रोकने, बाधित करने या देर कराने के अर्थक्षेत्र को व्यक्त करता है और बहुवचन कर्म का संदर्भ मूल पाठ की तरह अनिर्दिष्ट रखता है।
- source_word: כִּי יִשָּׁמַע קוֹלוֹ
  choice: जब उसकी आवाज़ सुनाई देती है
  rationale: כִּי को यहाँ तूफ़ान के क्रम में कालवाचक समझा गया है; कारणवाचक अर्थ भी संभव है और पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: गरजने और गर्जन करने वाले का संदर्भ
  choice: कर्ता परमेश्वर है, जिसकी आवाज़ गर्जन में प्रकट होती है।
  alternative: इसे किसी अवैयक्तिक आवाज़ या तूफ़ान का वर्णन माना जा सकता है।
  rationale: निकटवर्ती प्रसंग परमेश्वर के तूफ़ानी कार्य का वर्णन करता है और ‘अपनी प्रतापी आवाज़’ व्यक्तिगत दिव्य कर्ता की ओर संकेत करती है; फिर भी पद में ‘परमेश्वर’ नाम जोड़कर अति-व्याख्या नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रतापी आवाज़’ दिव्य वैभव को व्यक्त करती है; बहुवचन ‘उन्हें’ का अस्पष्ट संदर्भ मूल इब्रानी के अनुरूप सुरक्षित है।
