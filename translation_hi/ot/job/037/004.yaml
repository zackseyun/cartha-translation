base_translation:
  language: en
  yaml_path: translation/ot/job/037/004.yaml
  text: After it[a], a voice roars; he thunders with his majestic voice[c][b], and he does not hold them back when his voice is heard.
translation:
  language: hi
  text: उसके बाद[a] एक आवाज़ गरजती है; वह अपनी महिमामय आवाज़ में गरजता है, और जब उसकी आवाज़ सुनाई देती है[c], तो वह उन्हें रोकता नहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इसके बाद एक आवाज़ गरजती है।” इब्रानी पदबंध क्रियाविशेषण की तरह भी समझा जा सकता है, पर प्रसंग में संभवतः पिछले पद की बिजली की ओर संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उन्हें देर नहीं कराता।” “उन्हें” संभवतः गर्जन के साथ छोड़ी गई बिजली की कौंधों या तूफ़ान के प्रभावों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या, “क्योंकि उसकी आवाज़ सुनाई देती है।” इब्रानी संयोजक का अर्थ कालवाचक या कारणवाचक दोनों हो सकता है।
    reason: lexical_alternative
