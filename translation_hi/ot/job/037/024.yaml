base_translation:
  language: en
  yaml_path: translation/ot/job/037/024.yaml
  text: Therefore men fear him[a]; he does not regard any who are wise of heart.
translation:
  language: hi
  text: इसलिए लोग उसका भय मानते हैं; वह हृदय में बुद्धिमान किसी का आदर नहीं करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “वह हृदय में बुद्धिमान किसी को नहीं देखता।” यहाँ “देखना” का अर्थ किसी पर ध्यान देना या उसका आदर करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले वर्णन से निकला निष्कर्ष व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְרֵאוּהוּ
  choice: उसका भय मानते हैं
  rationale: ירא में भय, श्रद्धा और विस्मय का अर्थ-क्षेत्र है; यह चयन मूल की सीधी और धर्मवैचारिक गंभीरता बनाए रखता है।
- source_word: אֲנָשִׁים
  choice: मनुष्य
  rationale: यहाँ बहुवचन संज्ञा सामान्य रूप से मानवों को सूचित करती है; ‘मनुष्य’ हिन्दी में सामूहिक और समावेशी अर्थ देता है।
- source_word: לֹא יִרְאֶה
  choice: वह ... नहीं देखता
  rationale: ראה का मूल अर्थ ‘देखना’ है। मुख्य पाठ में इसे बनाए रखने से वास्तविक शाब्दिक अस्पष्टता सुरक्षित रहती है; प्रसंग में इसका आशय ‘सम्मान/परवाह करना’ भी हो सकता है।
- source_word: כָּל
  choice: किसी भी
  rationale: नकार के साथ हिन्दी में ‘किसी भी ... को नहीं’ मूल के वितरणात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַכְמֵי לֵב
  choice: मन के बुद्धिमान
  rationale: यह हिब्रू रूपक को सुरक्षित रखता है और ‘अपनी ही दृष्टि में बुद्धिमान’ जैसा अप्रकट अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ‘मन के बुद्धिमानों’ के प्रति परमेश्वर के न देखने का आशय
  choice: मुख्य पाठ में शाब्दिक ‘नहीं देखता’ रखा गया है, और टिप्पणी में ‘मान/परवाह नहीं करता’ का प्रसंगगत अर्थ दिया गया है।
  alternative: वह मन के किसी भी बुद्धिमान का मान नहीं करता।
  rationale: कर्ता प्रसंगानुसार परमेश्वर है, पर ראה के ‘देखना’ और ‘ध्यान/मान देना’ दोनों अर्थ संभव हैं। शाब्दिक रूप मुख्य पाठ में रखने से तनाव बना रहता है और टिप्पणी मुहावरेदार अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भय मानना’ श्रद्धामिश्रित भय की बाइबिलीय गंभीरता बनाए रखता है; ‘मन के बुद्धिमान’ मूल रूपक को बिना अतिरिक्त व्याख्या जोड़े प्रस्तुत करता है।
