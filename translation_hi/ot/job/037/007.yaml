  yaml_path: translation/ot/job/037/007.yaml
  text: He seals the hand of every man[b][a], so that all men may know his work.
translation:
  language: hi
  text: वह हर मनुष्य के हाथ पर मुहर लगाता है[a], ताकि सभी मनुष्य उसके कार्य को जानें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह हर मनुष्य के हाथ को मुहरबंद करता है।” इस इब्रानी अभिव्यक्ति का आशय सम्भवतः यह है कि परमेश्वर मनुष्यों के सामान्य काम को रोक देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: हाथ पर
  rationale: בְּ के स्थानगत भाव को रूपक सहित सुरक्षित रखते हुए स्वाभाविक हिन्दी में ‘हाथ पर’ कहा गया है।
- source_word: כָּל אָדָם
  choice: हर मनुष्य
  rationale: אָדָם यहाँ जातिवाचक एकवचन है; ‘मनुष्य’ आधुनिक हिन्दी में स्त्री-पुरुष सभी को समेटता है।
- source_word: יַחְתּוֹם
  choice: मुहर लगा देता है
  rationale: חתם के मूल अर्थ ‘मुहर लगाना’ को बनाए रखा गया है; प्रसंग में इसका आशय मनुष्य के सामान्य काम को रोकना हो सकता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לָדַעַת
  choice: ताकि … जानें
  rationale: ל के साथ infinitive यहाँ उद्देश्य अथवा परिणाम व्यक्त करता है; ‘ताकि’ हिन्दी में इसे सहज रूप से प्रकट करता है।
- source_word: כָּל אַנְשֵׁי
  choice: सभी मनुष्य
  rationale: यह बहुवचन सामूहिक और समावेशी है; ‘सभी मनुष्य’ पहले पद के साथ समानांतरता भी बनाए रखता है।
- source_word: מַעֲשֵׂהוּ
  choice: उसके काम
  rationale: एकवचन संज्ञा और तीसरे पुरुष पुल्लिंग प्रत्यय का सीधा रूपान्तरण है; प्रसंग में ‘उसके’ का संकेत परमेश्वर की ओर है।
theological_decisions:
- issue: ‘वह’ और ‘उसके’ का संकेत किसकी ओर है
  choice: परमेश्वर
  alternative: तूफ़ान या शीतकाल को कर्ता मानना
  rationale: एलीहू के इस भाषण में मौसम और सृष्टि पर नियंत्रण करने वाला निकटतम तथा प्रसंगानुकूल कर्ता परमेश्वर है।
- issue: हाथ पर मुहर लगाने के रूपक का आशय
  choice: रूपक को मुख्य पाठ में बनाए रखना
  alternative: सीधे कहना कि परमेश्वर मनुष्यों का काम रोक देता है
  rationale: इब्रानी अभिव्यक्ति कठिन और रूपकात्मक है। मुख्य पाठ उसके चित्र को सुरक्षित रखता है, जबकि संभावित व्यावहारिक आशय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। जातिवाचक אָדָם और बहुवचन אַנְשֵׁי दोनों के लिए समावेशी ‘मनुष्य’ चुना गया है; इसलिए अलग लिंग-संबंधी टिप्पणी आवश्यक नहीं है।
