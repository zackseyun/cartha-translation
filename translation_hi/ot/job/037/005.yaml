base_translation:
  language: en
  yaml_path: translation/ot/job/037/005.yaml
  text: God thunders wondrously with his voice[b][a]; he does great things that we do not know.
translation:
  language: hi
  text: परमेश्वर अपनी वाणी से अद्भुत रीति से गरजता है[a]; वह ऐसे महान काम करता है जिन्हें हम नहीं जानते[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर अपनी वाणी से अद्भुत बातें गरजता है।” इब्रानी शब्द का अधिक शाब्दिक अर्थ “अद्भुत बातें” है, पर यहाँ संभवतः उसका अर्थ “अद्भुत रीति से” है।
    reason: lexical_alternative
  - marker: b
    text: या “ऐसे महान काम जो हमारे ज्ञान से परे हैं”; अथवा “ऐसे महान काम जिन्हें हम समझ नहीं सकते।”
    reason: alternative_reading
lexical_decisions:
- source_word: יַרְעֵם
  choice: गरजता है
  rationale: रעם के हिफ़ील रूप का अर्थ यहाँ गरजना या गर्जन उत्पन्न करना है। आँधी के प्रसंग और परमेश्वर की वाणी के उल्लेख में “गरजता है” स्वाभाविक और सटीक है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यह सामान्य ईश्वरीय पद है; यहाँ किसी विस्तारित उपाधि की आवश्यकता नहीं है।
- source_word: בְּקוֹלוֹ
  choice: अपनी वाणी से
  rationale: 'בְּ का साधनवाचक अर्थ है: परमेश्वर की वाणी उसके गरजने का माध्यम है। “वाणी” इस काव्यात्मक प्रसंग में dignified और सहज है।'
- source_word: נִפְלָאוֹת
  choice: अद्भुत रीति से
  rationale: यह रूप व्याकरणतः बहुवचन संज्ञा, “अद्भुत बातें/काम,” है, पर इस वाक्य में संभवतः क्रिया-विशेषण के समान गरजने की रीति बताता है। मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए शाब्दिक संभावना पाद-टिप्पणी में सुरक्षित की गई है।
- source_word: עֹשֶׂה גְדֹלוֹת
  choice: महान काम करता है
  rationale: עֹשֶׂה सामान्यतः “करता है” और संज्ञा के रूप में प्रयुक्त גְדֹלוֹת “महान बातें/काम” व्यक्त करता है। “महान काम” प्रसंगानुकूल और व्यापक है।
- source_word: וְלֹא נֵדָע
  choice: जिन्हें हम नहीं जानते
  rationale: मूल का शाब्दिक ढाँचा “और हम नहीं जानते” है। सम्बन्धवाचक उपवाक्य हिन्दी में इसे पिछले “महान काम” से सहज रूप से जोड़ता है और ידע के मूल अर्थ “जानना” को बनाए रखता है।
theological_decisions:
- issue: अंतिम उपवाक्य में मानवीय अज्ञान की सीमा
  choice: परमेश्वर के महान काम ऐसे हैं जिन्हें हम नहीं जानते
  alternative: परमेश्वर ऐसे महान काम करता है जो हमारी समझ से परे हैं / जिन्हें हम समझ नहीं सकते
  rationale: ידע का स्पष्ट अर्थ “जानना” है। प्रसंग मानवीय सीमा को दिखाता है, पर “समझ नहीं सकते” पूर्ण असमर्थता का अधिक प्रबल दावा होगा। मुख्य अनुवाद मूल की खुली हुई अभिव्यक्ति को बनाए रखता है।
- issue: נִפְלָאוֹת का वाक्यगत कार्य
  choice: 'गरजने की रीति बताने वाला प्रयोग: “अद्भुत रीति से”'
  alternative: 'कर्म के रूप में: “अद्भुत बातें गरजता है”'
  rationale: रूपतः दोनों संबंधों की संभावना पर विचार किया जा सकता है। मुख्य पाठ में क्रिया-विशेषणात्मक अर्थ अधिक स्वाभाविक है, जबकि शाब्दिक संज्ञात्मक संभावना पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। “वाणी,” “गरजता है,” और “महान काम” सामान्य पाठक के लिए बोधगम्य रहते हुए अय्यूब की काव्यात्मक ऊँचाई बनाए रखते हैं।
