source:
  edition: WLC
  text: שַׁדַּ֣י לֹֽא מְ֭צָאנֻ/הוּ שַׂגִּיא כֹ֑חַ וּ/מִשְׁפָּ֥ט וְ/רֹב צְ֝דָקָ֗ה לֹ֣א יְעַנֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/023.yaml
  text: The Almighty—we cannot find him out—great in power[c][b][a]; and justice and abundant righteousness he does not afflict.
translation:
  language: hi
  text: सर्वशक्तिमान—हम उसकी थाह नहीं पा सकते[a]—वह सामर्थ्य में महान है; न्याय और प्रचुर धार्मिकता के साथ वह किसी को पीड़ित नहीं करता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हम उसे पूरी तरह समझ नहीं सकते’ अथवा ‘हम उस तक नहीं पहुँच सकते।’
    reason: lexical_alternative
  - marker: c
    text: अंतिम शब्दों का अनुवाद ‘वह किसी को दुःख नहीं देता’ भी हो सकता है। कुछ लोग क्रिया को ‘वह उत्तर नहीं देता’ समझते हैं, पर प्रसंग में यह अर्थ कम स्वाभाविक है।
    reason: alternative_reading
lexical_decisions:
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त इस ईश्वरीय उपाधि का अर्थ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: לֹא מְצָאנֻהוּ
  choice: हम उसकी थाह नहीं पा सकते
  rationale: शाब्दिक अर्थ ‘हम उसे नहीं पाते’ है; प्रसंग में भाव यह है कि मनुष्य परमेश्वर तक अपनी समझ से पूरी तरह नहीं पहुँच सकता। ‘थाह नहीं पा सकते’ खोज और अगम्यता दोनों को व्यक्त करता है।
- source_word: שַׂגִּיא כֹחַ
  choice: सामर्थ्य में महान
  rationale: यह हिब्रू पदबंध की संरचना और अत्यधिक शक्ति के भाव को सहज हिन्दी में बनाए रखता है।
- source_word: וּמִשְׁפָּט
  choice: न्याय
  rationale: צְדָקָה के साथ ईश्वरीय नैतिक गुण के रूप में ‘न्याय’ यहाँ ‘न्याय-निर्णय’ से अधिक उपयुक्त है।
- source_word: וְרֹב צְדָקָה
  choice: भरपूर धार्मिकता
  rationale: רֹב की प्रचुरता और צְדָקָה की नैतिक धार्मिकता, दोनों को संज्ञात्मक रूप में सुरक्षित रखा गया है।
- source_word: לֹא יְעַנֶּה
  choice: किसी को दुःख नहीं देता
  rationale: पिएल रूप में ענה का सामान्य अर्थ दुःख देना या पीड़ित करना है। हिन्दी वाक्य में कर्म जोड़ना अपेक्षित है; ‘किसी को’ अनिश्चित कर्म के रूप में निहित अर्थ स्पष्ट करता है, बिना अन्याय का अतिरिक्त विचार आरोपित किए।
theological_decisions:
- issue: अंतिम उपवाक्य לֹא יְעַנֶּה को परमेश्वर के न्याय और धार्मिकता से कैसे जोड़ा जाए
  choice: वह किसी को दुःख नहीं देता
  alternative: वह उत्तर नहीं देता
  rationale: पिएल क्रिया और न्याय-धार्मिकता के निकट प्रसंग में ‘दुःख देना/पीड़ित करना’ अधिक संभावित है। फिर भी ‘उत्तर देना’ की वैकल्पिक व्युत्पत्ति को पादटिप्पणी में रखा गया है, ताकि पाठ की वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। ‘थाह नहीं पा सकते’ ईश्वरीय अगम्यता को स्वाभाविक मुहावरे में व्यक्त करता है। वाक्य-विन्यास में हिब्रू की काव्यात्मक रुकावट को दीर्घ विराम-चिह्नों से बनाए रखा गया है।
