base_translation:
  language: en
  yaml_path: translation/ot/job/037/003.yaml
  text: Under all the heavens he sends it out[b][a], and his lightning to the ends of the earth.
translation:
  language: hi
  text: वह उसे समूचे आकाश के नीचे भेजता है, और अपनी बिजली[a] पृथ्वी के छोरों[b] तक पहुँचाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपनी ज्योति’; इस प्रसंग में इससे संभवतः बिजली की चमक अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘पृथ्वी के पंखों’; यह पृथ्वी के दूर-दूर के छोरों के लिए एक इब्रानी काव्यात्मक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: समूचे आकाश के नीचे
  rationale: शाब्दिक स्थानगत बिंब ‘सारे आकाशों के नीचे’ है; आधुनिक हिन्दी में ‘समूचे आकाश के नीचे’ वही व्यापकता स्वाभाविक और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: יִשְׁרֵהוּ
  choice: वह उसे ... भेजता है
  rationale: दुर्लभ काव्यात्मक क्रिया का अर्थ यहाँ भेजना, छोड़ना या फैलाना हो सकता है। ‘भेजता है’ तूफ़ान के प्रसंग के अनुकूल है, जबकि ‘उसे’ रखकर इब्रानी कर्म-सर्वनाम और उसके संदर्भ की कुछ अस्पष्टता सुरक्षित रहती है।
- source_word: וְאוֹרוֹ
  choice: और अपनी बिजली
  rationale: אוֹר का सामान्य अर्थ ‘प्रकाश/ज्योति’ है, पर तूफ़ान के तात्कालिक प्रसंग में यह बिजली की चमक को सूचित करता है। मुख्य पाठ में ‘बिजली’ अर्थ को स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַל כַּנְפוֹת הָאָרֶץ
  choice: पृथ्वी के छोरों तक
  rationale: शाब्दिक अभिव्यक्ति ‘पृथ्वी के पंखों पर’ पृथ्वी की दूरस्थ सीमाओं के लिए काव्यात्मक मुहावरा है। ‘छोरों तक’ आधुनिक हिन्दी में उसका स्वाभाविक अर्थ देता है।
- source_word: וְאוֹרוֹ עַל כַּנְפוֹת הָאָרֶץ
  choice: और अपनी बिजली ... तक पहुँचाता है
  rationale: दूसरे खंड में इब्रानी क्रिया व्यक्त नहीं की गई है। हिन्दी में वाक्य को पूर्ण और सहज बनाने के लिए समानांतर गति का भाव ‘पहुँचाता है’ से स्पष्ट किया गया है, बिना कोई नया कर्ता जोड़े।
theological_decisions: []
