  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘समूचे आकाश’ तथा ‘पृथ्वी के छोरों’ से पद का व्यापक काव्यात्मक दृश्य बना रहता है; ‘उसे’ पूर्ववर्ती संदर्भ से जुड़े इब्रानी सर्वनाम की अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
