base_translation:
  language: en
  yaml_path: translation/ot/job/037/021.yaml
  text: And now they do not see the light[a], bright though it is in the skies[b]; but a wind passes by and clears them.
translation:
  language: hi
  text: और अब वे उस प्रकाश को नहीं देखते[a], यद्यपि वह आकाश में उज्ज्वल है; परन्तु हवा चलती है और उन्हें निर्मल कर देती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उस प्रकाश को नहीं देखा, जो आकाश में उज्ज्वल है।” इब्रानी वाक्य-विन्यास संक्षिप्त है और इसे बिना ‘यद्यपि’ के भी समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: मूल इब्रानी में “उन्हें निर्मल कर देती है” का कर्म बहुवचन है, जो सम्भवतः आकाशमंडल या बादलों की ओर संकेत करता है; कुछ इसे अधिक सामान्य रूप से “आकाश को साफ कर देती है” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: कालसूचक और संयोजक दोनों अर्थों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא רָאוּ
  choice: वे ... नहीं देखते
  rationale: पूर्ण रूप यहाँ वर्तमान परिस्थिति अथवा सामान्य अवलोकन व्यक्त कर सकता है; बहुवचन कर्ता को स्पष्ट रखा गया है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: मूल में व्यापक शब्द है; ‘सूर्य का प्रकाश’ कहकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: בָּהִיר הוּא
  choice: यद्यपि वह ... उज्ज्वल है
  rationale: प्रकाश के विद्यमान और उज्ज्वल होने के बावजूद दिखाई न देने का संभावित व्यतिरेकी संबंध स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בַּשְּׁחָקִים
  choice: आकाश में
  rationale: यह शब्द आकाश अथवा मेघमंडल को सूचित कर सकता है; एकवचन ‘आकाश’ आधुनिक हिन्दी में सबसे सहज है।
- source_word: וְרוּחַ עָבְרָה
  choice: परन्तु हवा चलती है
  rationale: רוּחַ यहाँ मौसम संबंधी हवा है; क्रिया का भाव आकाश से हवा के गुजरने का है।
- source_word: וַתְּטַהֲרֵם
  choice: और उसे निर्मल कर देती है
  rationale: टहर धातु यहाँ साफ़ अथवा निर्मल करने का भाव देती है। हिन्दी में आकाश को एक समष्टि मानकर एकवचन सर्वनाम स्वाभाविक है, जबकि मूल प्रत्यय बहुवचन है; इसे पादटिप्पणी में बताया गया है।
