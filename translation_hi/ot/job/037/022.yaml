  text: מִ֭/צָּפוֹן זָהָ֣ב יֶֽאֱתֶ֑ה עַל אֱ֝ל֗וֹהַּ נ֣וֹרָא הֽוֹד־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/037/022.yaml
  text: From the north comes golden splendor; around God is awesome majesty.
translation:
  language: hi
  text: 'उत्तर से सुनहरी आभा[a] आती है;

    परमेश्वर के चारों ओर[b] विस्मयकारी प्रताप है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “सोना।” यहाँ संभवतः स्वर्णिम चमक या आभा का संकेत है।'
    reason: זָהָב का शाब्दिक अर्थ और प्रसंगगत रूपक दोनों सुरक्षित रखने के लिए।
  - marker: b
    text: 'या: “परमेश्वर पर” अथवा “परमेश्वर के साथ।”'
    reason: עַל की संबंधसूचक अस्पष्टता को बिना चुपचाप समाप्त किए दिखाने के लिए।
lexical_decisions:
- source_word: זָהָב
  choice: सुनहरी आभा
  rationale: मूल अर्थ ‘सोना’ है, पर इस काव्यात्मक और मौसम-संबंधी प्रसंग में यह उत्तर से आती स्वर्णिम चमक या आभा को सूचित करता है। ‘सुनहरी आभा’ हिन्दी में अर्थ को स्वाभाविक रूप से व्यक्त करती है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: נוֹרָא הוֹד
  choice: विस्मयकारी प्रताप
  rationale: נוֹרָא भय, श्रद्धा और विस्मय जगानेवाले गुण को व्यक्त करता है; הוֹד वैभव, गरिमा या प्रताप है। यह संयोजन मूल की गंभीरता और काव्यात्मकता बनाए रखता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त ईश्वर के इस एकवचन पद के लिए आधुनिक मानक हिन्दी का स्वाभाविक और गरिमापूर्ण सामान्य पद चुना गया है।
theological_decisions:
- issue: עַל אֱלוֹהַּ का संबंधसूचक अर्थ
  choice: परमेश्वर के चारों ओर
  alternative: परमेश्वर पर / परमेश्वर के साथ
  rationale: עַל का मूल अर्थ ‘पर/ऊपर’ है, किंतु यहाँ प्रताप को परमेश्वर से संबद्ध या उन्हें घेरे हुए बताना प्रसंग और काव्यगत अर्थ के अनुकूल है। चूँकि संबंधसूचक अभिव्यक्ति में वास्तविक अस्पष्टता है, पादटिप्पणी में अधिक शाब्दिक विकल्प दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘सुनहरी आभा’ सामान्य पाठक के लिए स्वाभाविक है; ‘विस्मयकारी प्रताप’ मूल की श्रद्धामिश्रित भय और महिमा की संयुक्त भावना को बनाए रखता है।
