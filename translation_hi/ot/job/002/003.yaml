  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सुबोध रूप। दिव्य संबोधन में एकवचन ‘तू’ प्राचीन निकट संबोधन और इब्रानी एकवचन को व्यक्त करता है। ‘खरा’, ‘सीधा’, ‘खराई’ जैसे परिचित शब्द मूल में תָּם/תֻמָּה की शब्दगत कड़ी को यथासंभव बनाए रखते हैं।
