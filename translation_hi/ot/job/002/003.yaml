- issue: הַשָּׂטָן की पहचान
  choice: भूमिका-सूचक ‘दोष लगानेवाला’
  alternative: ‘शैतान’
  rationale: निश्चयवाचक उपपद इस दृश्य में पद अथवा भूमिका की ओर संकेत करता है; अनुवाद बाद की पहचान को यहाँ आरोपित नहीं करता।
