base_translation:
  language: en
  yaml_path: translation/ot/job/002/003.yaml
  text: Then Yahweh said to the Accuser[a], “Have you set your heart on my servant Job? For there is no one like him on the earth, a blameless and upright man, one who fears God and turns away from evil. He still holds fast his integrity[d][c][b], though you incited me against him to destroy him for nothing.”
translation:
  language: hi
  text: तब यहोवा ने दोष लगानेवाले[a] से कहा, “क्या तूने मेरे सेवक अय्यूब पर ध्यान दिया है?[b] क्योंकि पृथ्वी पर उसके समान कोई नहीं है। वह खरा और सीधा मनुष्य है, जो परमेश्वर का भय मानता और बुराई से दूर रहता है। वह अब भी अपनी खराई को दृढ़ता से थामे हुए है, यद्यपि तूने मुझे उसके विरुद्ध उकसाया कि मैं उसे अकारण[d] नष्ट कर दूँ[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “दोष लगानेवाला”; परंपरागत अनुवाद: “शैतान।”'
    reason: alternative_reading
  - marker: b
    text: या, “क्या तूने मेरे सेवक अय्यूब पर अपना मन लगाया है?” शाब्दिक रूप से, “क्या तूने मेरे सेवक अय्यूब पर अपना हृदय लगाया है?”
    reason: lexical_alternative
  - marker: c
    text: या, “उसे निगल जाऊँ” अथवा “उसे बरबाद कर दूँ।” इब्रानी में शाब्दिक अर्थ “निगल जाना” है।
    reason: lexical_alternative
  - marker: d
    text: “अकारण” का अर्थ “बिना किसी कारण” भी है। यही इब्रानी शब्द अय्यूब 1:9 में दोष लगानेवाले के इस प्रश्न में आता है कि “क्या अय्यूब बिना लाभ के परमेश्वर का भय मानता है?”
    reason: cross_reference
