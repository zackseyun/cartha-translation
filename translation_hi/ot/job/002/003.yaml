- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय सुरक्षित रखता है।
- source_word: הַשָּׂטָן
  choice: दोष लगानेवाला
  rationale: निश्चयवाचक उपपद सहित यह यहाँ भूमिका-सूचक पद है; यह रूप न्यायिक आरोप लगाने की भावना व्यक्त करता है और इसे तत्काल व्यक्तिवाचक नाम नहीं बनाता।
- source_word: הֲשַׂמְתָּ לִבְּךָ אֶל
  choice: क्या तूने ... पर अपना मन लगाया है?
  rationale: इब्रानी के शाब्दिक हृदय/मन लगाने वाले मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है; अर्थ ‘ध्यान दिया’ भी हो सकता है।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: इस प्रसंग में संबंध और परमेश्वर की सेवा प्रमुख हैं; ‘दास’ से अनावश्यक रूप से सामाजिक दासत्व उभर सकता है।
- source_word: אֵין כָּמֹהוּ בָּאָרֶץ
  choice: पृथ्वी पर उसके समान कोई नहीं है
  rationale: स्वर्गीय सभा के व्यापक प्रसंग में אֶרֶץ का विश्वव्यापी अर्थ उपयुक्त है।
- source_word: אִישׁ תָּם וְיָשָׁר
  choice: खरा और सीधा मनुष्य
  rationale: תָּם नैतिक अखंडता और निष्कपटता बताता है, पापरहित सिद्धता नहीं; יָשָׁר को ‘सीधा’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְרֵא אֱלֹהִים
  choice: परमेश्वर का भय मानता
  rationale: श्रद्धामय भय की क्रियात्मक और धर्मवैज्ञानिक शक्ति सुरक्षित रहती है।
- source_word: וְסָר מֵרָע
  choice: बुराई से दूर रहता है
  rationale: सור में निहित बुराई से हटने के निरंतर आचरण को सहज हिन्दी में व्यक्त करता है।
- source_word: וְעֹדֶנּוּ מַחֲזִיק בְּתֻמָּתוֹ
  choice: वह अब भी अपनी खराई को दृढ़ता से थामे हुए है
  rationale: ‘अब भी’ निरंतरता और ‘दृढ़ता से थामे’ מחזיק की शक्ति को व्यक्त करते हैं; ‘खराई’ תֻמָּה की अखंडता को दर्शाती है।
- source_word: וַתְּסִיתֵנִי בוֹ
  choice: यद्यपि तूने मुझे उसके विरुद्ध उकसाया
  rationale: संदर्भगत विरोध को ‘यद्यपि’ स्पष्ट करता है और इब्रानी में व्यक्त सीधी दिव्य संलग्नता को नरम नहीं करता।
- source_word: לְבַלְּעוֹ
  choice: कि मैं उसे ... नष्ट कर दूँ
  rationale: शाब्दिक अर्थ ‘निगल जाना’ है, पर इस प्रसंग में रूपक का स्वाभाविक हिन्दी आशय विनाश करना है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: חִנָּם
  choice: अकारण
  rationale: यह ‘बिना कारण’ का अर्थ स्पष्ट करता है; अय्यूब 1:9 में इसी शब्द के ‘क्या अय्यूब परमेश्वर का भय बिना लाभ के मानता है?’ वाले दूसरे अर्थ के साथ साहित्यिक प्रतिध्वनि पादटिप्पणी में बताई गई है।
