  source_fidelity: 'The Hindi accurately represents the Hebrew sequence and sense: the title-like הַשָּׂטָן as “विरोधी,” Yahweh as “यहोवा,” the terse proverb “खाल के बदले खाल,” and the general assertion that a man will surrender all he has to preserve his life. “अपने प्राण के बदले” fittingly renders בעד נפשו in this context without importing an immaterial-soul sense.'
