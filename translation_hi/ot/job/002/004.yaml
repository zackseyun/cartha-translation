  terminology: “विरोधी” appropriately preserves the role/title sense of the Hebrew with its article, rather than requiring the later proper-name reading “शैतान.” “प्राण” is contextually apt for נפשׁו, and “यहोवा” is consistent with the stated Hindi rendering of the divine name.
