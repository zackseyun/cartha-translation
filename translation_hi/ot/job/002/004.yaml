source:
  edition: WLC
  text: וַ/יַּ֧עַן הַ/שָּׂטָ֛ן אֶת יְהוָ֖ה וַ/יֹּאמַ֑ר ע֣וֹר בְּעַד ע֗וֹר וְ/כֹל֙ אֲשֶׁ֣ר לָ/אִ֔ישׁ יִתֵּ֖ן בְּעַ֥ד נַפְשֽׁ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/004.yaml
  text: Then the Adversary answered Yahweh and said[a], “Skin for skin! Indeed[c][b], all that a man has he will give for his life.”
translation:
  language: hi
  text: तब विरोधी ने यहोवा को उत्तर दिया, “खाल के बदले खाल![a] मनुष्य अपने प्राण के बदले अपना सब कुछ दे देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खाल के बदले खाल” एक संक्षिप्त लोकोक्ति है। इसका सटीक आशय अनिश्चित है; संभवतः भाव यह है कि मनुष्य अपना जीवन बचाने के लिए दूसरी कोई भी वस्तु छोड़ देगा।
    reason: cultural_note
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: विरोधी
  rationale: निश्चित उपपद के साथ यह शब्द यहाँ व्यक्तिगत नाम से अधिक भूमिका या पदवी को दर्शाता है। ‘विरोधी’ उस भूमिका-सूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עוֹר בְּעַד עוֹר
  choice: खाल के बदले खाल
  rationale: मूल की संक्षिप्त, लोकोक्ति-जैसी अभिव्यक्ति और विनिमय के भाव को बिना अर्थ निश्चित किए सुरक्षित रखता है।
- source_word: בְּעַד
  choice: के बदले
  rationale: दोनों प्रयोगों में विनिमय या किसी वस्तु को बचाने के लिए दूसरी वस्तु देने का भाव है; स्पष्ट आधुनिक हिन्दी में ‘के बदले’ उपयुक्त है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ सामान्य मानव के लिए प्रयुक्त है; ‘मनुष्य’ हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: נַפְשׁוֹ
  choice: अपने प्राण
  rationale: इस संदर्भ में נֶפֶשׁ का अर्थ अमूर्त आत्मा से अधिक जीवित प्राण या जीवन है। ‘प्राण’ जीवन-रक्षा के प्रसंग और मूल के आत्म-संबंधी भाव दोनों को बनाए रखता है।
- source_word: וְכֹל אֲשֶׁר לָאִישׁ
  choice: अपना सब कुछ
  rationale: यह हिन्दी में स्वाभाविक ढंग से मनुष्य के अधिकार में मौजूद सारी वस्तुओं को व्यक्त करता है।
- source_word: יִתֵּן
  choice: दे देगा
  rationale: अपूर्ण क्रिया यहाँ सामान्य या नीतिवचनात्मक भाव में मनुष्य के अपेक्षित व्यवहार को बताती है; ‘दे देगा’ उस दृढ़ सामान्य कथन को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अय्यूब की भूमिका में הַשָּׂטָן का अनुवाद
  choice: विरोधी
  alternative: शैतान
  rationale: निश्चित उपपद और दरबारी प्रसंग भूमिका-सूचक पदवी की ओर संकेत करते हैं। ‘विरोधी’ पदगत अर्थ को सुरक्षित रखता है और बाद की परंपरा के व्यक्तिगत नाम को इस पद में अनिवार्य रूप से आरोपित नहीं करता।
- issue: נֶפֶשׁ का प्रसंगगत अर्थ
  choice: प्राण
  alternative: आत्मा / स्वयं
  rationale: कथन शारीरिक जीवन बचाने के लिए सब कुछ त्यागने के विषय में है। ‘प्राण’ इस प्रसंग को स्पष्ट करता है, जबकि इसे अमूर्त आत्मा तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की लोकोक्तिपरक संक्षिप्तता को मुख्य पाठ में बनाए रखते हुए संभावित अर्थ को पादटिप्पणी में दिया गया है।
