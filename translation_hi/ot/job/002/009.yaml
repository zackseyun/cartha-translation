base_translation:
  language: en
  yaml_path: translation/ot/job/002/009.yaml
  text: Then his wife said to him[a], “Are you still holding fast to your integrity? Bless God and die.”
translation:
  language: hi
  text: तब उसकी पत्नी ने उससे कहा, “क्या तुम अब भी अपनी खराई को थामे हुए हो? परमेश्वर को आशीष दो[a] और मर जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘परमेश्वर को आशीष दो और मर जाओ’ है; यहाँ ‘आशीष दो’ को बहुत-से लोग श्रद्धापरक व्यंजना मानते हैं, जिसका अर्थ ‘शाप दो’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִשְׁתּוֹ
  choice: उसकी पत्नी
  rationale: यह तृतीय पुरुष एकवचन संबंधसूचक रूप के साथ ‘पत्नी’ का सीधा अनुवाद है।
- source_word: עֹדְךָ
  choice: क्या तुम अब भी
  rationale: עֹוד निरंतरता बताता है और द्वितीय पुरुष एकवचन प्रत्यय अय्यूब को संबोधित करता है; प्रश्न के रूप में यह हिन्दी में स्वाभाविक है।
- source_word: מַחֲזִיק
  choice: थामे हुए हो
  rationale: חזק का कृदंत रूप किसी बात को दृढ़ता से पकड़े या बनाए रखने की जारी स्थिति दर्शाता है।
- source_word: בְּתֻמָּתֶךָ
  choice: अपनी खराई को
  rationale: תֻּמָּה यहाँ नैतिक खराई, निष्कपटता या निर्दोषता का बोध देता है। ‘खराई’ पापहीनता का अतिशयोक्त दावा किए बिना अय्यूब की नैतिक अखंडता व्यक्त करती है; हिन्दी वाक्य-विन्यास में इसे ‘थामना’ का कर्म बनाया गया है।
- source_word: בָּרֵךְ
  choice: आशीष दो
  rationale: इब्रानी क्रिया का प्रत्यक्ष अर्थ ‘आशीष देना’ है। संदर्भ में इसे प्रायः श्रद्धापरक व्यंजना मानकर ‘शाप देना’ समझा जाता है; मूल शब्दरूप मुख्य पाठ में रखा गया है और संभावित आशय पाद-टिप्पणी में दिया गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यह אֱלֹהִים का सामान्य हिन्दी धार्मिक पर्याय है और यहाँ वाचा-नाम यहोवा प्रयुक्त नहीं हुआ है।
- source_word: וָמֻת
  choice: और मर जाओ
  rationale: यह पहली आज्ञा के बाद समन्वित दूसरी आज्ञा है; अनुवाद मूल की संक्षिप्त और कठोर अभिव्यक्ति बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के संबंध में ‘आशीष देना’ क्रिया का व्यंजनात्मक प्रयोग
  choice: मुख्य पाठ में प्रत्यक्ष इब्रानी अर्थ ‘परमेश्वर को आशीष दो’ रखा गया है और संभावित विपरीत आशय पाद-टिप्पणी में बताया गया है।
  alternative: ‘परमेश्वर को शाप दो और मर जाओ।’
  rationale: इब्रानी पाठ में ברך (‘आशीष देना’) ही है, किंतु इस प्रसंग में अनेक विद्वान इसे परमेश्वर को शाप देने के लिए प्रयुक्त श्रद्धापरक व्यंजना समझते हैं। मूल रूप और उसकी वास्तविक अर्थगत खींचतान दोनों को सुरक्षित रखने के लिए अस्पष्टता को मुख्य पाठ तथा पाद-टिप्पणी के माध्यम से प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण शैली रखी गई है। पति-पत्नी के सीधे संवाद में ‘तुम’ स्वाभाविक है और कठोर कथन को अनावश्यक रूप से पुरातन नहीं बनाता। ‘खराई’ नैतिक integrity के लिए संक्षिप्त और प्रचलित बाइबिलीय शब्द है; ‘थामे हुए’ मूल के दृढ़ पकड़े रहने वाले बिंब को बनाए रखता है।
