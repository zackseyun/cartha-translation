source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל הַ/שָּׂטָ֔ן אֵ֥י מִ/זֶּ֖ה תָּבֹ֑א וַ/יַּ֨עַן הַ/שָּׂטָ֤ן אֶת יְהוָה֙ וַ/יֹּאמַ֔ר מִ/שֻּׁ֣ט בָּ/אָ֔רֶץ וּ/מֵ/הִתְהַלֵּ֖ךְ בָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/002.yaml
  text: And Yahweh said to the Accuser[a], “From where have you come?” And the Accuser answered Yahweh and said, “From roaming about on the earth and from walking around on it.”
translation:
  language: hi
  text: और यहोवा ने दोष लगानेवाले[a] से कहा, “तू कहाँ से आया है?” दोष लगानेवाले ने यहोवा को उत्तर देकर कहा, “पृथ्वी पर इधर-उधर घूमने और उस पर चलने-फिरने से।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘ह-सातान’ (अर्थात् ‘दोष लगानेवाला/विरोधी’); यहाँ संभवतः यह एक उपाधि है, जिसका अर्थ ‘दोष लगानेवाला’ या ‘विरोधी’ है—यह आवश्यक नहीं कि यहाँ यह व्यक्तिवाचक नाम हो।
    reason: वैकल्पिक अर्थ और उपाधि/व्यक्तिवाचक नाम की वास्तविक अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को व्यक्त करता है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: הַשָּׂטָן
  choice: दोष लगानेवाला
  rationale: संज्ञा के साथ निश्चित उपपद है और अय्यूब 1–2 के स्वर्गीय दरबार में यह भूमिका या उपाधि सूचित करती है। यह रूप अभियोग लगाने के अर्थ को स्वाभाविक हिन्दी में रखता है, बिना इसे अनिवार्यतः व्यक्तिवाचक नाम बनाने के।
- source_word: אֵי מִזֶּה תָּבֹא
  choice: तू कहाँ से आया है?
  rationale: मुहावरे का उद्गम-स्थान संबंधी प्रश्न आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: उत्तर दिया
  rationale: हिब्रू में दोनों कथन-क्रियाएँ क्रम से हैं, पर हिन्दी में दोनों को अलग-अलग रखना अनावश्यक पुनरुक्ति और कृत्रिमता पैदा करता; एक ही स्वाभाविक कथन-रचना आशय को पूरा व्यक्त करती है।
- source_word: מִשֻּׁט בָּאָרֶץ
  choice: पृथ्वी पर इधर-उधर घूमने
  rationale: שׁוט की दिशाहीन अथवा आगे-पीछे विचरण करने की गति को सहज आधुनिक हिन्दी में व्यक्त करता है; אֶרֶץ यहाँ किसी विशिष्ट देश के बजाय पृथ्वी है।
- source_word: וּמֵהִתְהַלֵּךְ בָּהּ
  choice: और उस पर चलते-फिरते रहने से
  rationale: हित्पएल रूप की बार-बार अथवा निरंतर घूमने की छाया को बनाए रखता है और 'गश्त लगाने' जैसी अधिक विशिष्ट धारणा नहीं जोड़ता।
theological_decisions:
- issue: क्या הַשָּׂטָן को व्यक्तिवाचक नाम ‘शैतान’ माना जाए या भूमिका-सूचक उपाधि
  choice: दोष लगानेवाला
  alternative: शैतान; विरोधी
  rationale: निश्चित उपपद और स्वर्गीय दरबार के प्रसंग के कारण भूमिका-सूचक अर्थ को मुख्य पाठ में रखा गया है। पादटिप्पणी स्वीकार करती है कि इसका अर्थ ‘विरोधी’ भी हो सकता है और यह आवश्यक रूप से व्यक्तिवाचक नाम नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तू’ एकवचन संबोधन को सटीक रूप से व्यक्त करता है; यहाँ इसका उद्देश्य अनादर जोड़ना नहीं है। ‘इधर-उधर घूमने’ और ‘चलते-फिरते रहने’ से हिब्रू की समानांतर गति-छवियाँ बनी रहती हैं।
