source:
  edition: WLC
  text: וַ/יֵּצֵא֙ הַ/שָּׂטָ֔ן מֵ/אֵ֖ת פְּנֵ֣י יְהוָ֑ה וַ/יַּ֤ךְ אֶת אִיּוֹב֙ בִּ/שְׁחִ֣ין רָ֔ע מִ/כַּ֥ף רַגְל֖/וֹ עד קָדְקֳדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/007.yaml
  text: So the Adversary went out from the presence of Yahweh and struck Job with painful sores from the sole of his foot to the crown of his head[a][b].
translation:
  language: hi
  text: तब विरोधी[a] यहोवा की उपस्थिति से निकल गया और उसने अय्यूब को पाँव के तलवे से लेकर सिर की चोटी तक दर्दनाक फोड़ों[b] से पीड़ित कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘वह विरोधी’ है; परंपरागत अनुवाद ‘शैतान’ है। यहाँ निश्चित उपपद के कारण यह शब्द एक उपाधि या भूमिका के रूप में प्रयुक्त हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या ‘कष्टदायक फोड़ों’ अथवा ‘भयंकर फोड़ों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשָּׂטָן
  choice: विरोधी
  rationale: इब्रानी में निश्चित उपपद के साथ आया यह पद इस प्रसंग में नाम से अधिक भूमिका या उपाधि सूचित करता है। ‘विरोधी’ उस अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵאֵת פְּנֵי יְהוָה
  choice: यहोवा के सामने से
  rationale: यह वाक्यांश यहोवा की उपस्थिति से निकलने का भाव व्यक्त करता है; ‘सामने से’ मूल के चित्र और सहज हिन्दी दोनों को बनाए रखता है।
- source_word: וַיַּךְ
  choice: उसने ... ग्रस्त कर दिया
  rationale: नכה का मूल अर्थ मारना या आघात करना है; रोग के साधन के साथ इस संदर्भ में ‘ग्रस्त कर दिया’ स्वाभाविक हिन्दी में प्रत्यक्ष प्रहार और उत्पन्न दशा दोनों व्यक्त करता है।
- source_word: בִּשְׁחִין רָע
  choice: पीड़ादायक फोड़ों से
  rationale: שְׁחִין सूजी हुई त्वचा के फोड़े या घाव का द्योतक है और רָע यहाँ उनकी गंभीर तथा कष्टदायक प्रकृति बताता है।
- source_word: מִכַּף רַגְלוֹ
  choice: पाँव के तलवे से
  rationale: पाँव के साथ כַּף का अर्थ तलवा है।
- source_word: עַד קָדְקֳדוֹ
  choice: सिर की चोटी तक
  rationale: קָדְקֹד सिर के सबसे ऊपरी भाग को दर्शाता है और पूरे शरीर में फैली पीड़ा को रेखांकित करता है।
theological_decisions:
- issue: अय्यूब की भूमिका में הַשָּׂטָן का अनुवाद
  choice: विरोधी
  alternative: शैतान
  rationale: निश्चित उपपद इस संदर्भ में पदवी या भूमिका की ओर संकेत करता है। ‘विरोधी’ बाद की धर्मवैज्ञानिक पहचान को बिना आवश्यकता आरोपित नहीं करता; पारंपरिक रूप पादटिप्पणी में दिया गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पाँव के तलवे से लेकर सिर की चोटी तक’ मूल की सर्वांग-व्याप्ति को स्वाभाविक हिन्दी मुहावरे में व्यक्त करता है।
