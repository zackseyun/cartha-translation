  text: וַ/יֹּ֣אמֶר אֵלֶ֗י/הָ כְּ/דַבֵּ֞ר אַחַ֤ת הַ/נְּבָלוֹת֙ תְּדַבֵּ֔רִי גַּ֣ם אֶת הַ/טּ֗וֹב נְקַבֵּל֙ מֵ/אֵ֣ת הָ/אֱלֹהִ֔ים וְ/אֶת הָ/רָ֖ע לֹ֣א נְקַבֵּ֑ל בְּ/כָל זֹ֛את לֹא חָטָ֥א אִיּ֖וֹב בִּ/שְׂפָתָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/002/010.yaml
  text: But he said to her[a], “You speak as one of the foolish women speaks. Shall we receive the good from God, and shall we not receive the bad?” In all this Job did not sin with his lips.
translation:
  language: hi
  text: पर उसने उससे कहा, “तुम ऐसी बात कर रही हो जैसी मूर्ख स्त्रियों में से कोई करती है। क्या हम परमेश्वर से भला ग्रहण करें और बुरा[a] ग्रहण न करें?” इन सब बातों में अय्यूब ने अपने होंठों से पाप नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात “विपत्ति” या “अनिष्ट।” इब्रानी शब्द का पारंपरिक अनुवाद “बुराई” भी है; यहाँ यह “भले” के विपरीत हानिकारक या प्रतिकूल परिस्थितियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּדַבֵּר אַחַת הַנְּבָלוֹת תְּדַבֵּרִי
  choice: तुम ऐसी बात कर रही हो जैसी मूर्ख स्त्रियों में से कोई करती है
  rationale: नְבָלוֹת नैतिक और धार्मिक विवेकहीनता को दर्शाता है, केवल कम बुद्धि को नहीं। “मूर्ख स्त्रियाँ” आधुनिक हिन्दी में स्वाभाविक है और इस नैतिक बल को बनाए रखता है।
- source_word: גַּם אֶת הַטּוֹב נְקַבֵּל מֵאֵת הָאֱלֹהִים
  choice: क्या हम परमेश्वर से भला तो ग्रहण करें
  rationale: प्रश्नवाचक रूप अगले नकारात्मक खंड के साथ मिलकर इब्रानी के आलंकारिक प्रश्न को स्पष्ट करता है। “भला” सलेखित व्यापक श्रेणी הַטּוֹב को बनाए रखता है।
- source_word: וְאֶת הָרָע לֹא נְקַבֵּל
  choice: पर बुरा[a] ग्रहण न करें
  rationale: רָע का अर्थ नैतिक बुराई भी हो सकता है और हानिकारक या प्रतिकूल परिस्थिति भी। “बुरा” ‘भला’ के साथ मूल विरोध को सुरक्षित रखता है; पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है, पर मूल की शब्दार्थगत व्यापकता को पूरी तरह समाप्त नहीं करती।
- source_word: בְּכָל זֹאת
  choice: इन सब बातों में
  rationale: यह कथावाचक के समापन-मूल्यांकन को स्वाभाविक हिन्दी में प्रस्तुत करता है और घटना-समूह की ओर संकेत बनाए रखता है।
- source_word: לֹא חָטָא אִיּוֹב בִּשְׂפָתָיו
  choice: अय्यूब ने अपने होंठों से पाप नहीं किया
  rationale: “अपने होंठों से” मूल के शारीरिक बिंब और इस विशेष कथन का वाणी पर केंद्रित होना दोनों सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर से प्राप्त הָרָע का अर्थ
  choice: मुख्य पाठ में “बुरा” और पादटिप्पणी में प्रसंगगत “विपत्ति/अनिष्ट”
  alternative: मुख्य पाठ में केवल “विपत्ति” या “बुराई”
  rationale: प्रसंग में यह शब्द नैतिक बुराई करने के बजाय दुःखद और प्रतिकूल दशाओं की ओर संकेत करता है। फिर भी “बुरा” मूल के ‘भला/बुरा’ विरोध और कुछ वास्तविक शब्दार्थगत तनाव को बनाए रखता है; पादटिप्पणी यह रोकती है कि पाठक इसे अनिवार्य रूप से परमेश्वर द्वारा नैतिक बुराई किए जाने का कथन समझे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। “ग्रहण करें” आलंकारिक प्रश्न की गंभीरता के अनुकूल है; “अपने होंठों से” जानबूझकर अक्षरशः रखा गया है ताकि कथावाचक का वाणी-विशेष पर बल बना रहे।
