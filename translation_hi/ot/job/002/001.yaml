  text: Again there was a day when the sons of God came to present themselves before Yahweh[b][a], and the Adversary also came among them to present himself before Yahweh.
translation:
  language: hi
  text: फिर एक दिन ऐसा हुआ कि परमेश्वर के पुत्र[a] यहोवा के सामने उपस्थित होने आए, और वह विरोधी[b] भी उनके बीच यहोवा के सामने उपस्थित होने आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में शाब्दिक अर्थ: “परमेश्वर के पुत्र।” इससे स्वर्गीय प्राणी या ईश्वरीय परिषद् के सदस्य अभिप्रेत हो सकते हैं।'
    reason: lexical_alternative
  - marker: b
    text: या “शैतान”; हिब्रू में निश्चित उपपद सहित “वह विरोधी” है, जो यहाँ “विरोधी” या “अभियोग लगानेवाला” अर्थ की उपाधि हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: फिर एक दिन ऐसा हुआ
