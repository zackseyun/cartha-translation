- issue: בְּנֵי הָאֱלֹהִים की पहचान
  choice: परमेश्वर के पुत्र
  alternative: स्वर्गीय प्राणी; ईश्वरीय परिषद् के सदस्य
  rationale: शाब्दिक पद को बनाए रखने से इन प्राणियों की सटीक पहचान संबंधी पाठ की अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रहता है।
