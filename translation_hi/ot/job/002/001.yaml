- source_word: בְּנֵי הָאֱלֹהִים
  choice: परमेश्वर के पुत्र
  rationale: यह हिब्रू पद का पारदर्शी और निकट अनुवाद है; इससे ‘स्वर्गीय प्राणी’ जैसी व्याख्या को मुख्य पाठ में निश्चित नहीं किया जाता।
- source_word: לְהִתְיַצֵּב עַל יְהוָה
  choice: यहोवा के सामने उपस्थित होने
  rationale: इस दरबारी प्रसंग में क्रिया किसी वरिष्ठ के सामने हाज़िर या प्रस्तुत होने का भाव देती है। ‘उपस्थित होने’ आधुनिक हिन्दी में स्वाभाविक है और दोनों occurrences में समान रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को केवल उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַשָּׂטָן
  choice: विरोधी
  rationale: हिब्रू में निश्चित उपपद है, इसलिए यहाँ यह किसी भूमिका या उपाधि के रूप में समझा जा सकता है। ‘विरोधी’ मूल अर्थ और इस व्याकरणिक संकेत को सुरक्षित रखता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह समवेत समूह के भीतर होने का अर्थ स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
