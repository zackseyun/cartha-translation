base_translation:
  language: en
  yaml_path: translation/ot/job/002/012.yaml
  text: And when they lifted up their eyes from a distance[a], they did not recognize him. Then they raised their voices and wept[b], and each man tore his robe and threw dust over his head toward the heavens.
translation:
  language: hi
  text: उन्होंने दूर से आँखें उठाकर देखा[a], पर वे उसे पहचान न सके। तब उन्होंने अपनी आवाज़ें उठाकर रोया। उनमें से हर एक ने अपना चोगा फाड़ा और अपने-अपने सिर पर आकाश की ओर[b] धूल उछाली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने दूर से अपनी आँखें उठाईं।”
    reason: इब्रानी मुहावरे का अधिक शब्दशः रूप।
  - marker: b
    text: अर्थात शोक के संकेत के रूप में उन्होंने धूल ऊपर उछाली, ताकि वह उनके सिरों पर गिरे।
    reason: प्राचीन शोक-प्रथा और ‘आकाश की ओर’ की दिशा को स्पष्ट करने वाला सांस्कृतिक नोट।
lexical_decisions:
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: आँखें उठाकर देखा
  rationale: इब्रानी मुहावरे की छवि को बनाए रखते हुए आधुनिक हिन्दी में देखने की क्रिया स्वाभाविक रूप से व्यक्त होती है।
- source_word: מֵרָחוֹק
  choice: दूर से
  rationale: यह स्थानगत दूरी को सरल और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִכִּירֻהוּ
  choice: उसे पहचान न सके
  rationale: संदर्भ में अय्यूब के बदले हुए रूप के कारण उसे पहचान न पाने की बात है, केवल उसे न जानने की नहीं।
- source_word: וַיִּשְׂאוּ קוֹלָם וַיִּבְכּוּ
  choice: ऊँची आवाज़ में रोने लगे
  rationale: यह शोक में आवाज़ उठाकर रोने के इब्रानी भाव को स्वाभाविक हिन्दी में जोड़कर व्यक्त करता है।
- source_word: וַיִּקְרְעוּ אִישׁ מְעִלוֹ
  choice: उनमें से हर एक ने अपना चोगा फाड़ा
  rationale: אִישׁ का वितरणात्मक अर्थ ‘हर एक’ है और מְעִיל बाहरी लंबे वस्त्र या चोगे को सूचित करता है।
- source_word: וַיִּזְרְקוּ עָפָר עַל רָאשֵׁיהֶם הַשָּׁמָיְמָה
  choice: उन्होंने अपने सिरों के ऊपर आकाश की ओर धूल उछाली
  rationale: यह धूल को ऊपर उछालकर सिरों पर गिराने वाले शोक-संकेत और दिशासूचक הַשָּׁמָיְמָה, दोनों को सुरक्षित रखता है।
