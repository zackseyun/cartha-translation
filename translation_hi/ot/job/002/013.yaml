source:
  edition: WLC
  text: וַ/יֵּשְׁב֤וּ אִתּ/וֹ֙ לָ/אָ֔רֶץ שִׁבְעַ֥ת יָמִ֖ים וְ/שִׁבְעַ֣ת לֵיל֑וֹת וְ/אֵין דֹּבֵ֤ר אֵלָי/ו֙ דָּבָ֔ר כִּ֣י רָא֔וּ כִּֽי גָדַ֥ל הַ/כְּאֵ֖ב מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/013.yaml
  text: And they sat with him on the ground seven days and seven nights[a], and no one spoke a word to him, because they saw that his pain was very great.
translation:
  language: hi
  text: और वे उसके साथ सात दिन और सात रात धरती पर बैठे रहे। किसी ने उससे एक शब्द भी नहीं कहा, क्योंकि उन्होंने देखा कि उसकी पीड़ा[a] बहुत अधिक थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका कष्ट बहुत अधिक था” अथवा “उसका शोक बहुत गहरा था।” हिब्रू शब्द का अर्थ व्यापक है और इसमें शारीरिक दर्द तथा मन की व्यथा—दोनों सम्मिलित हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: बैठे रहे
  rationale: ישׁב का मूल अर्थ ‘बैठना/रहना’ है। शोक के इस प्रसंग में ‘बैठे रहे’ ठोस मुद्रा और उसकी सात दिन की निरंतरता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִתּוֹ
  choice: उसके साथ
  rationale: यह साथ उपस्थित रहने का सीधा अर्थ देता है और अय्यूब के मित्रों की शारीरिक निकटता को बनाए रखता है।
- source_word: לָאָרֶץ
  choice: धरती पर
  rationale: यहाँ אֶרֶץ शोक की मुद्रा के संदर्भ में उस भूमि या ज़मीन को दर्शाता है जिस पर वे बैठे थे; ‘धरती पर’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: שִׁבְעַת יָמִים וְשִׁבְעַת לֵילוֹת
  choice: सात दिन और सात रात
  rationale: मूल पाठ की पूर्ण कालावधि वाली अभिव्यक्ति को सीधे और स्वाभाविक रूप में सुरक्षित रखा गया है।
- source_word: וְאֵין דֹּבֵר אֵלָיו דָּבָר
  choice: किसी ने उससे एक शब्द भी नहीं कहा
  rationale: हिब्रू रचना पूर्ण मौन पर बल देती है। ‘एक शब्द भी नहीं कहा’ इस बल को वर्तमान हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: כִּי רָאוּ
  choice: क्योंकि उन्होंने देखा
  rationale: पहला כִּי यहाँ उनके मौन का कारण बताता है; ‘क्योंकि’ इस संबंध को साफ़ रखता है।
- source_word: כִּי גָדַל הַכְּאֵב מְאֹד
  choice: कि उसकी पीड़ा बहुत अधिक थी
  rationale: दूसरा כִּי कथित तथ्य का परिचय देता है। כְּאֵב शारीरिक दर्द और भावनात्मक संताप दोनों को समेट सकता है; ‘पीड़ा’ इस व्यापकता को ‘दर्द’ की अपेक्षा बेहतर बनाए रखती है। संदर्भगत स्वामी को स्वाभाविक हिन्दी के लिए ‘उसकी’ से स्पष्ट किया गया है।
