  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘बैठे रहे’ से शोक की मुद्रा और उसकी अवधि, तथा ‘पीड़ा’ से मूल शब्द की शारीरिक एवं भावनात्मक व्यापकता सुरक्षित रहती है।
