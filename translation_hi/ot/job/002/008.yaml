  text: तब उसने मिट्टी के टूटे हुए बर्तन का एक टुकड़ा लिया, ताकि उससे अपने को खुरच सके[a]; और वह राख के बीच बैठा हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने को खुजला सके।’ इब्रानी क्रिया खरोंचने या खुजलाने का अर्थ भी दे सकती है, पर मिट्टी के टूटे हुए बर्तन के टुकड़े के प्रयोग के कारण ‘खुरच सके’ प्रसंग के अधिक अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब उसने ... लिया
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में स्वाभाविक क्रमसूचक है।
- source_word: לוֹ
  choice: अपने लिए
  rationale: दातृवाचक सर्वनाम को हिन्दी में सहज रूप से स्पष्ट किया गया है; यह बताता है कि अय्यूब ने वह टुकड़ा अपने उपयोग के लिए लिया।
- source_word: חֶרֶשׂ
  choice: मिट्टी के टूटे बरतन का एक टुकड़ा
  rationale: यह शब्द मिट्टी के बरतन की ठीकर या खंड को दर्शाता है। यह वाक्यांश सामान्य पाठक के लिए ‘ठीकरा’ से अधिक तुरंत स्पष्ट है।
- source_word: לְהִתְגָּרֵד
  choice: अपने शरीर को खुरचे
  rationale: हित्पएल क्रिया स्वयं पर की गई क्रिया व्यक्त करती है। ‘खुरचना’ मिट्टी के बरतन के टुकड़े से की जाने वाली कठोर क्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: בּוֹ
  choice: उससे
  rationale: पूर्वसर्ग और सर्वनाम बरतन के टुकड़े को साधन के रूप में संदर्भित करते हैं।
- source_word: וְהוּא יֹשֵׁב
  choice: और वह ... बैठा हुआ था
  rationale: मूल का समन्वयी और परिस्थितिवाचक ढाँचा बनाए रखते हुए यह उसकी उसी समय की अवस्था बताता है।
- source_word: בְּתוֹךְ הָאֵפֶר
  choice: राख के बीच
  rationale: בְּתוֹךְ का मूल अर्थ ‘बीच में’ है; यह अनिश्चित रखता है कि आशय राख के ढेर, राख से भरी जगह, या राख के बीच बैठने से है।
