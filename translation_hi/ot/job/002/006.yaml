source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל הַ/שָּׂטָ֖ן הִנּ֣/וֹ בְ/יָדֶ֑/ךָ אַ֖ךְ אֶת נַפְשׁ֥/וֹ שְׁמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/002/006.yaml
  text: And the LORD said to the Accuser, “Look, he is in your hand; only spare his life.”
translation:
  language: hi
  text: तब यहोवा ने आरोप लगानेवाले से कहा, “देख, वह तेरे हाथ में है; केवल उसका जीवन बचाए रखना।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: הַשָּׂטָן
  choice: आरोप लगानेवाला
  rationale: संज्ञा के साथ निश्चित उपपद है और अय्यूब 1–2 में इसकी भूमिका अभियोग लगानेवाले की है; इसलिए इसे निजी नाम मानने के बजाय पद/भूमिका के रूप में अनूदित किया गया है।
- source_word: הִנּוֹ
  choice: देख
  rationale: हिब्रू प्रस्तुतिकरण-सूचक का स्वाभाविक और संक्षिप्त हिन्दी प्रतिरूप।
- source_word: בְיָדֶךָ
  choice: तेरे हाथ में
  rationale: मूल रूपक को बनाए रखता है और अधिकार/वश में सौंपे जाने का अर्थ स्वाभाविक हिन्दी में देता है।
- source_word: נַפְשׁוֹ
  choice: उसका जीवन
  rationale: इस प्रसंग में נֶפֶשׁ व्यक्ति के प्राण या जीवन को दर्शाता है, न कि शरीर से पृथक किसी अमूर्त ‘आत्मा’ को।
- source_word: שְׁמֹר
  choice: बचाए रखना
  rationale: 'आज्ञार्थक ‘रक्षा करना/सुरक्षित रखना’ को प्रसंगानुकूल ढंग से व्यक्त करता है: अय्यूब को मारना नहीं है।'
theological_decisions:
- issue: הַשָּׂטָן को निजी नाम या भूमिका के रूप में प्रस्तुत करना
  choice: आरोप लगानेवाला
  alternative: शैतान
  rationale: हिब्रू में निश्चित उपपद सहित यह रूप इस साहित्यिक प्रसंग में एक भूमिका को उभारता है। अनुवाद किसी बाद की व्यवस्थित पहचान को न तो नकारता है, न अनावश्यक रूप से पाठ में आरोपित करता है।
- issue: נֶפֶשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: जीवन
  alternative: प्राण / आत्मा
  rationale: आज्ञा का आशय अय्यूब की जान न लेने की सीमा निर्धारित करना है; ‘आत्मा’ यहाँ अनपेक्षित दार्शनिक अर्थ पैदा कर सकती है।
- issue: अय्यूब पर आरोप लगानेवाले का अधिकार
  choice: वह तेरे हाथ में है
  alternative: वह तेरे वश में है
  rationale: मूल रूपक और उसकी तीव्रता को सुरक्षित रखा गया है, जबकि अगला वाक्य इस अधिकार की स्पष्ट सीमा बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संवाद में एकवचन ‘तेरे’ मूल हिब्रू के प्रत्यक्ष संबोधन को दर्शाता है। वाक्य-संरचना संक्षिप्त रखी गई है और मूल के अधिकार तथा सीमा के तनाव को बनाए रखती है।
