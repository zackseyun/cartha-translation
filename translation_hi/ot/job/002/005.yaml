    reason: lexical_alternative
lexical_decisions:
- source_word: אוּלָם
  choice: लेकिन
  rationale: यह विरोधसूचक अव्यय शैतान की प्रत्युत्तर-चुनौती आरम्भ करता है; आधुनिक हिन्दी में ‘लेकिन’ स्वाभाविक और स्पष्ट है।
- source_word: שְׁלַח נָא יָדְךָ
  choice: ज़रा अपना हाथ बढ़ा
  rationale: शाब्दिक ‘अपना हाथ भेज’ के स्थान पर हिन्दी का स्वाभाविक प्रयोग लिया गया है। ‘ज़रा’ से נָא के आग्रहपूर्ण भाव को बनाए रखा गया है।
- source_word: וְגַע
  choice: और ... छू
  rationale: נגע का मूल अर्थ ‘छूना’ है; प्रसंग में हानि पहुँचाने का भाव निहित है, पर उसे अनावश्यक रूप से ‘मार’ या ‘पीड़ित कर’ बनाकर स्पष्ट नहीं किया गया।
- source_word: אֶל עַצְמוֹ וְאֶל בְּשָׂרוֹ
  choice: उसकी हड्डी और मांस को
  rationale: हिब्रू में ‘हड्डी’ और ‘मांस’ एकवचन सामूहिक अर्थ में हैं। ठोस शारीरिक अभिव्यक्ति को ‘शरीर’ कहकर समतल करने के बजाय यथासंभव सुरक्षित रखा गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह शर्तसूचक वाक्यांश नहीं, बल्कि शपथ-जैसा दृढ़ कथन है; ‘निश्चय ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל פָּנֶיךָ
  choice: तेरे मुँह पर
  rationale: यह प्रत्यक्ष और खुले विरोध का मुहावरा है; हिन्दी में ‘मुँह पर’ उसी टकरावपूर्ण भाव को बनाए रखता है।
- source_word: יְבָרֲכֶךָּ
  choice: तुझे शाप देगा
  rationale: क्रिया का सामान्य शाब्दिक अर्थ ‘आशीष देना’ है, किन्तु इस प्रसंग में यह श्रद्धापरक व्यंजना के रूप में ‘शाप देना’ बताती है। मुख्य पाठ में प्रसंगगत अर्थ दिया गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अय्यूब की परीक्षा के प्रसंग में ברך का व्यंजनापूर्ण प्रयोग
  choice: मुख्य पाठ में ‘शाप देगा’
  alternative: शाब्दिक रूप से ‘आशीष देगा’
  rationale: शैतान का दावा है कि दुःख आने पर अय्यूब परमेश्वर का खुला तिरस्कार करेगा। मुख्य पाठ में ‘आशीष देगा’ आधुनिक पाठक को विपरीत अर्थ दे सकता है; इसलिए प्रसंगगत अर्थ रखा गया है और हिब्रू का शाब्दिक रूप पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधन में निकट एकवचन ‘तेरा/तुझे’ मूल भाषा के एकवचन संबोधन को दर्शाता है। ‘हड्डी और मांस’ की ठोस हिब्रू अभिव्यक्ति तथा ‘छू’ में निहित हानिकारक अस्पष्टता को सुरक्षित रखा गया है।
