base_translation:
  language: en
  yaml_path: translation/ot/job/002/011.yaml
  text: 'When Job’s three friends heard about all this trouble that had come upon him[a], they came each from his own place: Eliphaz the Temanite, Bildad the Shuhite, and Zophar the Naamathite[d][c][b]. They agreed together to come to sympathize with him and to comfort him.'
translation:
  language: hi
  text: जब अय्यूब के तीन मित्रों ने इस सारी विपत्ति के बारे में सुना जो उस पर आ पड़ी थी[a], तो वे अपने-अपने स्थान से आए—तेमानी एलीपज, शूही बिल्दद और नामाती सोपर। उन्होंने आपस में तय किया कि वे साथ जाकर उसके प्रति शोक-संवेदना प्रकट करें[b] और उसे सांत्वना दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस सारी आपदा” अथवा “इस सारे संकट।” यहाँ इब्रानी शब्द רָעָה अय्यूब द्वारा की गई नैतिक बुराई नहीं, बल्कि उस पर आई विपत्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसके साथ शोक मनाएँ” अथवा “उसके प्रति सहानुभूति प्रकट करें।” इब्रानी क्रिया दुःख के समय शोक-संवेदना प्रकट करने और साथ देने का भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: जब ... ने ... सुना
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; हिन्दी में ‘जब...तो’ संबंध प्रसंग का कालगत प्रवाह स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלֹשֶׁת רֵעֵי אִיּוֹב
  choice: अय्यूब के तीन मित्र
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सहज और सीधा हिन्दी रूप।
- source_word: כָּל הָרָעָה הַזֹּאת
  choice: उस सारी विपत्ति
  rationale: यहाँ רָעָה नैतिक बुराई नहीं, अय्यूब पर आई आपदा या दुर्दशा को सूचित करता है; ‘विपत्ति’ गरिमापूर्ण और सामान्यतः बोधगम्य है।
- source_word: הַבָּאָה עָלָיו
  choice: जो उस पर आ पड़ी थी
  rationale: कृदन्तीय वाक्यांश और आपदा के ‘आने’ की मूल छवि दोनों सुरक्षित हैं।
- source_word: וַיָּבֹאוּ אִישׁ מִמְּקֹמוֹ
  choice: वे अपने-अपने स्थान से आए
  rationale: אִישׁ का वितरणात्मक अर्थ ‘प्रत्येक’ है, जिसे हिन्दी का ‘अपने-अपने’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַתֵּימָנִי / הַשּׁוּחִי / הַנַּעֲמָתִי
  choice: तेमानी / शूही / नामाती
  rationale: जाति अथवा स्थान-सूचक विशेषणों का प्रचलित देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיִּוָּעֲדוּ יַחְדָּו
  choice: उन्होंने आपस में तय किया
  rationale: निफ़अल रूप जानबूझकर परस्पर योजना या सहमति बनाने का भाव देता है; केवल ‘मिले’ कहना इस भाव को कम कर देता।
- source_word: לָבוֹא
  choice: साथ जाकर
  rationale: उद्देश्यसूचक infinitive को हिन्दी कथा-दृष्टि से स्वाभाविक रूप दिया गया है; ‘साथ’ יַחְדָּו के समन्वित कार्य को भी प्रवाहपूर्ण ढंग से सामने लाता है।
- source_word: לָנוּד לוֹ
  choice: उसके दुःख में सहभागी हों
  rationale: נוּד यहाँ सहानुभूति, शोक-संवेदना और दुःख में साथ देने का भाव रखता है; यह अगले ‘सांत्वना दें’ से अर्थगत भेद बनाए रखता है।
- source_word: וּלְנַחֲמוֹ
  choice: और उसे सांत्वना दें
  rationale: पिअेल में נחם का सामान्य अर्थ दिलासा या सांत्वना देना है।
