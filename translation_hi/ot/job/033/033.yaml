  yaml_path: translation/ot/job/033/033.yaml
  text: If not[a], then listen to me; be silent[b], and I will teach you wisdom.
translation:
  language: hi
  text: यदि नहीं, तो मेरी सुन; चुप रह, और मैं तुझे बुद्धि सिखाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם אַיִן
  choice: यदि नहीं
  rationale: यह पिछले पद में उत्तर देने के निमंत्रण के विपरीत स्थिति बताता है—यदि अय्यूब के पास कहने को कुछ नहीं है। ‘यदि नहीं’ शर्त के बल को संक्षेप में बनाए रखता है।
- source_word: שְׁמַע לִי
  choice: मेरी सुन
  rationale: שׁמע के साथ ל वक्ता की ओर ध्यान देकर सुनने का आदेश देता है। ‘मेरी सुन’ आधुनिक हिन्दी में स्वाभाविक और प्रत्यक्ष है।
- source_word: הַחֲרֵשׁ
  choice: चुप रह
  rationale: חרש का यह आज्ञार्थक रूप मौन रहने को कहता है। ‘चुप रह’ स्पष्ट, स्वाभाविक और प्रसंग के अनुकूल है।
- source_word: וַאֲאַלֶּפְךָ
  choice: और मैं तुझे ... सिखाऊँगा
  rationale: पिएल रूप में אלף का अर्थ सिखाना या शिक्षा देना है। आज्ञाओं के बाद अपूर्ण क्रिया को यहाँ भावी परिणाम के रूप में प्रस्तुत किया गया है।
- source_word: חָכְמָה
  choice: बुद्धि
  rationale: חָכְמָה ज्ञान-साहित्य का प्रमुख शब्द है। ‘बुद्धि’ हिन्दी बाइबलीय और सामान्य प्रयोग दोनों में इसके आशय को संक्षेप में व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, प्रत्यक्ष और गरिमापूर्ण शैली रखी गई है। वक्ता और अय्यूब के एकवचन निकट संबोधन को ‘मेरी सुन’, ‘चुप रह’ और ‘तुझे’ से सुरक्षित रखा गया है।
