  text: He is also reproved with pain on his bed[a], and with continual strife in his bones,
translation:
  language: hi
  text: 'वह अपनी शय्या पर पीड़ा के द्वारा भी सुधारा जाता है,

    और उसकी हड्डियों का संघर्ष निरंतर बना रहता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी हड्डियों का संघर्ष प्रबल बना रहता है।” इब्रानी विशेषण का अर्थ “स्थायी/निरंतर” या “प्रबल/शक्तिशाली” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוּכַח
  choice: सुधारा जाता है
  rationale: הוכח, יכח का होफ़ाल रूप, किसी के सुधारे या अनुशासित किए जाने का भाव देता है। ‘सुधारा जाता है’ न्यायिक-सुधारात्मक अर्थ बनाए रखता है, पर इसे अनिवार्य रूप से दंड घोषित नहीं करता। आरंभिक וְ को हिंदी में अलग शब्द के रूप में व्यक्त करना संदर्भतः आवश्यक नहीं है।
- source_word: בְּמַכְאוֹב
  choice: पीड़ा के द्वारा
  rationale: מכאוב शारीरिक पीड़ा या कष्ट को दर्शाता है और בְ यहाँ साधन का बोध कराता है।
- source_word: עַל מִשְׁכָּבוֹ
  choice: अपने बिछौने पर
  rationale: यह वाक्यांश पीड़ा की अवस्था और स्थान को सीधे व्यक्त करता है; ‘बिछौना’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: וְרִיב
  choice: और ... संघर्ष
  rationale: ריב का मूल अर्थ विवाद या संघर्ष है। हड्डियों के साथ इसका प्रयोग रूपकात्मक है और शरीर के भीतर चल रही तीव्र पीड़ा को चित्रित करता है।
- source_word: עֲצָמָיו
  choice: उसकी हड्डियों में
  rationale: शाब्दिक शारीरिक बिंब को बनाए रखा गया है। संबंध को स्वाभाविक हिंदी में व्यक्त करने के लिए ‘में’ लगाया गया है।
- source_word: אֵתָן
  choice: निरंतर
  rationale: איתן स्थायी, लगातार या प्रबल होने का अर्थ दे सकता है। मुख्य पाठ में ‘निरंतर’ दीर्घकालिक कष्ट के संभावित अर्थ को व्यक्त करता है; ‘प्रबल’ विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: पीड़ा को परमेश्वर की सुधारात्मक क्रिया के रूप में प्रस्तुत करना
  choice: पीड़ा के द्वारा सुधारा जाता है
  alternative: पीड़ा से दंडित किया जाता है
  rationale: एलीहू के कथन में पीड़ा मनुष्य को संबोधित और सुधारने का साधन है, पर यह पद अपने आप में कठोर प्रतिफलात्मक दंड का पूरा सिद्धांत नहीं बताता। इसलिए ‘दंडित’ की अपेक्षा ‘सुधारा’ तनाव और सीमा दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और निकट-शाब्दिक शैली। ‘संघर्ष’ हड्डियों के भीतर की पीड़ा के रूपक को सुरक्षित रखता है; पादटिप्पणी इब्रानी विशेषण की वास्तविक अर्थगत अस्पष्टता बताती है।
