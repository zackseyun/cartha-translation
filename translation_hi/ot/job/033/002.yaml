  text: देखो तो[a], मैंने अपना मुँह खोला है; मेरी जीभ मेरे तालू में बोल रही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देखो, अब मैंने अपना मुँह खोला है; मेरी जीभ मेरे मुँह में बोल रही है।” अन्तिम उपवाक्य का इब्रानी बहुत सजीव और कुछ असामान्य है।
    reason: ‘नָא’ के संभावित ‘अब’ जैसे बल और ‘तालू’ के अधिक सहज अर्थ ‘मुँह’ को वैकल्पिक रूप में दर्शाना।
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके संवादात्मक बल को बनाए रखता है।
- source_word: נָא
  choice: अब
  rationale: यह कण यहाँ विनम्र अनुरोध से अधिक सामने आने वाली बात पर तत्काल ध्यान देने का भाव देता है; इसलिए ‘अब’ चुना गया है।
- source_word: פָּתַחְתִּי פִי
  choice: मैंने अपना मुँह खोला है
  rationale: बोलना आरम्भ करने के इस इब्रानी मुहावरे को व्याख्यात्मक रूप से सपाट किए बिना उसकी सजीव शारीरिक छवि और पूर्ण क्रिया का भाव सुरक्षित रखा गया है।
- source_word: דִּבְּרָה
  choice: बोल रही है
  rationale: यह असामान्य क्रियारूप ‘मेरी जीभ’ को कर्ता बनाकर वर्तमान भाषण को सजीव करता है। हिन्दी का निरंतर वर्तमान रूप प्रसंग में चल रही वाणी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְשׁוֹנִי
  choice: मेरी जीभ
  rationale: ‘जीभ’ को वाणी के लिए लक्षणा के रूप में अक्षरशः रखा गया है, जिससे ‘मुँह’ के साथ काव्यात्मक समानता बनी रहती है।
- source_word: בְחִכִּי
  choice: मेरे तालू में
  rationale: חֵךְ का ठोस अर्थ मुँह का ‘तालू’ है। ‘मुँह में’ अधिक सहज होता, पर कम सटीक; असामान्य इब्रानी बिंब को सुरक्षित रखने के लिए ‘तालू में’ रखा गया है।
