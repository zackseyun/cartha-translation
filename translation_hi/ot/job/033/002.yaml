    rationale: In “देखो, अब मैंने…,” Hindi readers readily understand “अब” as ‘now,’ while the Hebrew particle נָא primarily adds an urging or appealing discourse force in this setting. “तो” after “देखो” conveys that force more naturally without adding temporal meaning.
