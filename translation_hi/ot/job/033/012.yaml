lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह संबोधन में ध्यान खींचने और बात पर बल देने वाला अव्यय है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका बल बनाए रखता है।
- source_word: זֹאת
  choice: इस बात में
  rationale: संकेतवाचक शब्द यहाँ चर्चा के अधीन विषय की ओर संकेत करता है; ‘इस बात में’ हिन्दी में अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֹא צָדַקְתָּ
  choice: तुम सही नहीं हो
  rationale: यहाँ צדק का आशय तर्क या विवाद में सही पक्ष पर होना है, व्यापक नैतिक धार्मिकता नहीं।
- source_word: אֶעֱנֶךָּ
  choice: मैं तुम्हें उत्तर दूँगा
  rationale: प्रथम पुरुष एकवचन अपूर्ण क्रिया और द्वितीय पुरुष प्रत्यय एलीहू के आगामी उत्तर को व्यक्त करते हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: संयोजक एलीहू के उत्तर का कारण प्रस्तुत करता है; ‘क्योंकि’ हिन्दी में इस कारणात्मक संबंध को सीधे व्यक्त करता है।
- source_word: יִרְבֶּה
  choice: महान है
  rationale: מן के साथ רבה यहाँ तुलनात्मक श्रेष्ठता या महानता बताता है, संख्या की अधिकता नहीं।
- source_word: אֱלוֹהַ
  choice: परमेश्वर
  rationale: एकवचन ईश्वरीय पद का हिन्दी बाइबलीय और सहज समतुल्य ‘परमेश्वर’ है।
- source_word: מֵאֱנוֹשׁ
  choice: मनुष्य से
  rationale: אֱנוֹשׁ सामान्यतः मनुष्य को, प्रायः उसकी नश्वरता और दुर्बलता के भाव सहित, दर्शाता है; ‘मनुष्य’ हिन्दी में सामान्य एकवचन विरोध को बनाए रखता है।
theological_decisions:
- issue: אֱנוֹשׁ में निहित मानव-संदर्भ
  choice: मनुष्य
  alternative: नश्वर मनुष्य
  rationale: पद में परमेश्वर और सामान्य मानव के बीच तुलना है। ‘मनुष्य’ मूल के एकवचन सामान्य रूप को सहज हिन्दी में सुरक्षित रखता है, जबकि उसकी नश्वरता का संभावित भाव पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और प्रत्यक्ष संवादात्मक रूप अपनाया गया है। ‘तुम’ अय्यूब को एकवचन संबोधन के अनुरूप है; वाक्य में मूल पाठ की ताड़ना और कारणात्मक प्रवाह दोनों सुरक्षित हैं।
