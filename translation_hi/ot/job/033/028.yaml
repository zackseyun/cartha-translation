base_translation:
  language: en
  yaml_path: translation/ot/job/033/028.yaml
  text: He has redeemed my soul from passing into the pit[b][a], and my life will look upon the light.
translation:
  language: hi
  text: उसने मेरे प्राण को गड्ढे में जाने से छुड़ा लिया है[a][b], और मेरा जीवन ज्योति को देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मेरे जीवन को गड्ढे में उतरने से छुड़ा लिया है।”
    reason: lexical_alternative
  - marker: b
    text: “गड्ढा” इब्रानी काव्य में मृत्यु या कब्र का एक सामान्य बिंब है।
    reason: cultural_note
lexical_decisions:
- source_word: פָּדָה
  choice: छुड़ा लिया है
  rationale: यह क्रिया संकट या बंधन से छुड़ाने अथवा मुक्त करने का भाव रखती है। ‘छुड़ा लिया है’ पूर्ण हो चुके बचाव और उसके वर्तमान परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, बिना किसी स्पष्ट फिरौती-मूल्य का संकेत जोड़े।
- source_word: נַפְשִׁי
  choice: मेरे प्राण को
  rationale: נֶפֶשׁ यहाँ व्यक्ति के प्राण, जीवन या स्वयं व्यक्ति का बोध करा सकता है। ‘मेरे प्राण’ दूसरे चरण के ‘मेरा जीवन’ से काव्यात्मक भेद बनाए रखता है और आधुनिक हिन्दी में मृत्यु से बचाए जाने के प्रसंग के अनुकूल है।
- source_word: מֵעֲבֹר
  choice: में जाने से
  rationale: पूर्वसर्ग सहित क्रिया का यह रूप किसी सीमा को पार कर भीतर जाने से रोके जाने का भाव देता है। ‘में जाने से’ हिन्दी में सहज है और गड्ढे की ओर गति की छवि बनाए रखता है।
- source_word: בַּשַּׁחַת
  choice: गड्ढे
  rationale: שַׁחַת का मूल चित्र गड्ढे का है, जो काव्य में मृत्यु या कब्र का बिंब बन सकता है। ‘गड्ढा’ उस रूपक को सीधे ‘कब्र’ बनाकर सीमित नहीं करता।
- source_word: וְחַיָּתִי
  choice: और मेरा जीवन
  rationale: यह संज्ञा जीवित अस्तित्व या जीवन को दर्शाती है। ‘मेरा जीवन’ पहले चरण के ‘मेरे प्राण’ के साथ समानांतरता रखते हुए दोनों शब्दों को एक ही हिन्दी शब्द में नहीं मिला देता।
- source_word: בָּאוֹר
  choice: ज्योति को
  rationale: सप्रत्यय संज्ञा का अर्थ ‘उस ज्योति/प्रकाश’ है। ‘ज्योति’ गड्ढे और मृत्यु के विपरीत जीवन के प्रकाश की काव्यात्मक छवि को गरिमापूर्ण और स्पष्ट रूप में रखता है।
- source_word: תִּרְאֶה
  choice: देखेगा
  rationale: अपूर्ण क्रिया को इस प्रसंग में भविष्यसूचक रूप से समझना उचित है। ‘देखेगा’ मूल क्रिया के सीधे अर्थ को रखता है और प्रकाश का अनुभव करने की हिब्रू अभिव्यक्ति को अनावश्यक विस्तार नहीं देता।
theological_decisions:
- issue: आरंभिक पूर्ण क्रिया का कर्ता
  choice: उसने मेरे प्राण को… छुड़ा लिया है
  alternative: परमेश्वर ने मेरे प्राण को… छुड़ा लिया है; उसने मेरे प्राण को… छुड़ाया
  rationale: हिब्रू पंक्ति में क्रिया पुरुषवाचक एकवचन है, पर कर्ता स्पष्ट रूप से नहीं लिखा गया। संदर्भ में संकेत परमेश्वर की ओर है, फिर भी पद में ‘परमेश्वर’ जोड़ने के बजाय ‘उसने’ मूल की निहितता को सुरक्षित रखता है। संयुक्त पूर्ण रूप पूर्ण कार्य और उसके वर्तमान प्रभाव को दर्शाता है।
- issue: שַׁחַת का मृत्यु-संबंधी आशय
  choice: गड्ढा रूपक को मुख्य पाठ में बनाए रखना
  alternative: कब्र; विनाश
  rationale: यह शब्द वास्तविक गड्ढे के साथ मृत्यु, कब्र या विनाश का संकेत दे सकता है। मुख्य पाठ में ‘गड्ढा’ रखने और अर्थ-संकेत को पाद-टिप्पणी में बताने से मूल की काव्यात्मक बहुअर्थता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु काव्यात्मक और गरिमापूर्ण रखी गई है। ‘प्राण’, ‘गड्ढा’ और ‘ज्योति’ मूल पद की समानांतरता तथा मृत्यु से जीवन की ओर जाने वाली छवि को बनाए रखते हैं। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
