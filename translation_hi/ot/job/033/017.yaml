lexical_decisions:
- source_word: לְהָסִיר
  choice: फेर दे
  rationale: हिफ़ील रूप यहाँ किसी को किसी काम से हटाने या विमुख करने का कारण बनने का भाव देता है; ‘काम से फेर दे’ हिंदी में स्वाभाविक है।
- source_word: אָדָם
  choice: मनुष्य
  rationale: यह एक व्यक्ति को सूचित करता है; आधुनिक मानक हिंदी में ‘मनुष्य’ गरिमापूर्ण और सहज है।
- source_word: מַעֲשֶׂה
  choice: उसके काम
  rationale: शब्द का अर्थ काम, कार्य या कर्म हो सकता है। प्रसंग में व्यक्ति के अपने अभिप्रेत कार्य से उसे रोकने का भाव है।
- source_word: וְגֵוָה
  choice: घमंड
  rationale: यहाँ ऊँचा उठने या अहंकार का नकारात्मक भाव है; ‘घमंड’ सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: מִגֶּבֶר
  choice: पुरुष के
  rationale: גֶּבֶר पुरुष को उसकी सामर्थ्य या प्रौढ़ता के पहलू से कह सकता है। ‘पुरुष’ पहले चरण के ‘मनुष्य’ से शब्दगत भेद को कुछ हद तक बनाए रखता है, जबकि ‘बलवान पुरुष’ प्रसंग में अनावश्यक रूप से विशिष्ट होगा।
- source_word: יְכַסֶּה
  choice: छिपा दे
  rationale: मूल क्रिया का ठोस अर्थ ‘ढकना’ है, पर इस संबंध में हिंदी में ‘घमंड को छिपा दे’ अधिक स्वाभाविक है और उसे दबा देने या दूर रखने की रूपकात्मक संभावना खुली रखता है।
theological_decisions:
- issue: परमेश्वर की चेतावनी के उद्देश्य को व्यक्त करने वाली संक्षिप्त इब्रानी रचना
  choice: परमेश्वर मनुष्य को उसके अभिप्रेत काम से फेरता और उसके घमंड को छिपाता है।
  alternative: परमेश्वर मनुष्य का काम उससे हटा देता और पुरुष से घमंड को ढक देता है।
  rationale: इब्रानी वाक्य संक्षिप्त और व्याकरणतः खुला है। संदर्भ (33:14–18) व्यक्ति को हानिकारक मार्ग से रोकने की ओर संकेत करता है, पर अधिक शाब्दिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
