  yaml_path: translation/ot/job/033/003.yaml
  text: The uprightness of my heart is in my words[a], and my lips speak knowledge clearly.
translation:
  language: hi
  text: 'मेरे मन की सच्चाई मेरे शब्दों में है,

    और मेरे होंठ ज्ञान की बातें साफ़-साफ़ कहते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे होंठ शुद्ध ज्ञान बोलते हैं,” अथवा “मेरे होंठ जो जानते हैं, उसे साफ़-साफ़ कहते हैं।” यहाँ अनूदित इब्रानी शब्द “साफ़-साफ़” में शुद्धता या स्पष्टता—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשֶׁר
  choice: सच्चाई
  rationale: यह संज्ञा सीधेपन और नैतिक निष्कपटता का भाव रखती है। यहाँ एलीहू अपने भीतर की ईमानदार मनोवृत्ति का दावा करता है; आधुनिक हिन्दी में ‘सच्चाई’ स्वाभाविक और स्पष्ट है।
- source_word: לִבִּי
  choice: मेरे मन की
  rationale: इब्रानी ‘हृदय’ भीतर के व्यक्ति, विचार और इच्छा को दर्शाता है। इस प्रसंग में हिन्दी का ‘मन’ उसी आशय को सहज रूप से व्यक्त करता है।
- source_word: אֲמָרַי
  choice: मेरे शब्दों में
  rationale: बहुवचन संज्ञा एलीहू के कथनों को सूचित करती है। यह चयन मूल वाक्य-विन्यास और पहली पंक्ति के ठोस भाषिक बिंब को बनाए रखता है।
- source_word: וְדַעַת
  choice: ज्ञान की बातें
  rationale: संज्ञा उसके होंठों से व्यक्त होने वाली ज्ञात और समझी हुई बातों की विषय-वस्तु बताती है। ‘ज्ञान की बातें’ हिन्दी में ‘ज्ञान को कहना’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: שְׂפָתַי
  choice: मेरे होंठ
  rationale: मूल का काव्यात्मक लक्षणालंकार सुरक्षित रखा गया है और इससे ‘मन’ तथा ‘होंठ’ का समानांतर विन्यास बना रहता है।
- source_word: בָּרוּר
  choice: साफ़-साफ़
  rationale: यह रूप स्पष्टता, शुद्धता या बेबाकी का भाव दे सकता है। मुख्य पाठ में बोलने की स्पष्टता चुनी गई है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: מִלֵּלוּ
  choice: कहते हैं
  rationale: क्रिया का अर्थ बोलना या उच्चारित करना है। ‘होंठ ... कहते हैं’ वर्तमान भाषण-प्रसंग में स्वाभाविक हिन्दी है।
