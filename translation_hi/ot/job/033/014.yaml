  text: כִּֽי בְ/אַחַ֥ת יְדַבֶּר אֵ֑ל וּ֝/בִ/שְׁתַּ֗יִם לֹ֣א יְשׁוּרֶֽ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/014.yaml
  text: For God speaks in one way[a], and in two, though one does not perceive it.
translation:
  language: hi
  text: क्योंकि परमेश्वर एक प्रकार से बोलता है,[a] और दो प्रकार से; फिर भी मनुष्य इसे पहचानता नहीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर एक बार बोलता है, और दो बार; फिर भी मनुष्य इसे पहचानता नहीं।” इब्रानी संख्याओं का अर्थ “एक बार…दो बार” अथवा “एक प्रकार से…दो प्रकार से” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह एलीहू की पिछली बात का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: בְאַחַת
  choice: एक प्रकार से
  rationale: स्त्रीलिंग संख्या और בְ का यह प्रयोग ढंग अथवा अवसर—दोनों अर्थ दे सकता है; मुख्य पाठ में ढंग का स्वाभाविक हिन्दी रूप रखा गया है।
- source_word: יְדַבֶּר
  choice: बोलता है
  rationale: पिएल अपूर्ण क्रिया यहाँ सामान्य अथवा अभ्यस्त कार्य व्यक्त करती है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל का संदर्भगत, प्रतिष्ठित और सामान्य हिन्दी प्रतिरूप।
- source_word: וּבִשְׁתַּיִם
  choice: और दो प्रकार से भी
  rationale: मूल की संख्यात्मक समानांतरता बनाए रखते हुए हिन्दी में ढंग का अर्थ स्पष्ट किया गया है।
- source_word: לֹא יְשׁוּרֶנָּה
  choice: पर मनुष्य उसे समझ नहीं पाता
  rationale: שׁור यहाँ ध्यान देने, पहचानने या ग्रहण करने का भाव रखता है; 'समझ नहीं पाता' परमेश्वर के बोलने को न पहचानने का स्वाभाविक हिन्दी संकेत देता है। स्त्रीलिंग प्रत्यय का संदर्भ परमेश्वर की कही बात अथवा उसके बोलने से है।
theological_decisions:
- issue: अंतिम उपवाक्य का अप्रकट कर्ता
  choice: सामान्य मानव कर्ता के रूप में ‘मनुष्य’
  alternative: ‘वह उसे समझ नहीं पाता’
  rationale: इब्रानी क्रिया का कर्ता अप्रकट तृतीय पुरुष एकवचन पुल्लिंग है। ‘मनुष्य’ सामान्य मानवीय संदर्भ को स्पष्ट करता है, बिना किसी विशेष व्यक्ति की पहचान मान लेने के।
- issue: संख्याओं का अर्थ
  choice: ‘एक प्रकार से ... दो प्रकार से’
  alternative: ‘एक बार ... दो बार’
  rationale: इब्रानी वाक्यांश ढंग अथवा आवृत्ति दोनों अर्थों में समझा जा सकता है। मुख्य पाठ संदर्भ में संप्रेषण के विविध ढंग को रखता है और पादटिप्पणी वास्तविक वैकल्पिक अर्थ सुरक्षित करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, काव्यात्मक और गरिमापूर्ण शैली। ‘एक प्रकार से…दो प्रकार से’ मूल की समानांतर संख्यात्मक रचना को बनाए रखता है; पादटिप्पणी आवृत्ति वाले अर्थ को सुरक्षित करती है।
