translation:
  language: hi
  text: तब वह उस पर कृपा करता है और कहता है, “उसे गड्ढे[b] में उतरने से छुड़ा; मैंने छुड़ौती[a] पाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘छुड़ौती’ का अनुवाद ‘प्रायश्चित-मूल्य’ या ‘क्षतिपूर्ति’ भी हो सकता है। इब्रानी כֹּפֶר रिहाई सुनिश्चित करने वाले मूल्य या प्रतिपूर्ति को दर्शाता है और कुछ प्रसंगों में प्रायश्चित-संबंधी अर्थ भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: ‘गड्ढा’ यहाँ केवल भूमि का कोई गड्ढा नहीं, बल्कि कब्र, मृत्यु या विनाश का संकेत भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחֻנֶּנּוּ
  choice: तब वह उस पर अनुग्रह करता है
  rationale: חנן अनुग्रह, कृपा या दया दिखाने को व्यक्त करता है। ‘अनुग्रह करता है’ कृपा के भाव को बनाए रखता है और इसे केवल सहानुभूति तक सीमित नहीं करता।
- source_word: וַיֹּאמֶר
  choice: और कहता है
  rationale: वाव-क्रमिक कथन में अगली क्रिया को दिखाता है; हिन्दी में प्रत्यक्ष वचन के आरम्भ पर वर्तमानकालीन ‘कहता है’ स्वाभाविक और सजीव है।
- source_word: פְּדָעֵהוּ
  choice: उसे ... छुड़ा ले
  rationale: פדה का अर्थ छुड़ाना, मोल देकर मुक्त करना या उद्धार करना हो सकता है। ‘छुड़ा ले’ आज की सहज हिन्दी है और आगे आए כֹפֶר के छुड़ौती-संबंधी अर्थ को पहले ही तकनीकी रूप नहीं देता।
- source_word: מֵרֶדֶת
  choice: उतरने से
  rationale: ירד के क्रियार्थक संज्ञा-रूप के साथ מן किसी कार्य को होने से रोकने का भाव देता है; ‘उतरने से’ हिब्रू संरचना और आशय दोनों को संक्षेप में रखता है।
- source_word: שָׁחַת
  choice: गड्ढे
  rationale: שחת का ठोस बिंब ‘गड्ढा’ है, पर अय्यूब में इससे कब्र, मृत्यु या विनाश का संकेत भी हो सकता है। मुख्य पाठ में बिंब को सुरक्षित रखा गया है।
- source_word: מָצָאתִי
  choice: मुझे ... मिल गई है
  rationale: 'प्रथम पुरुष पूर्ण क्रिया का वर्तमान-परिणाम यहाँ स्वाभाविक हिन्दी में ‘मुझे मिल गई है’ से व्यक्त होता है: छुड़ाने का आधार उपलब्ध हो चुका है।'
- source_word: כֹפֶר
  choice: छुड़ौती
  rationale: כֹפֶר उस मूल्य या प्रतिपूर्ति को दर्शाता है जिसके द्वारा रिहाई सुनिश्चित होती है। ‘छुड़ौती’ तत्काल प्रसंग में स्पष्ट है और प्रायश्चित की किसी अधिक विशिष्ट धर्मवैज्ञानिक व्याख्या को मुख्य पाठ पर आरोपित नहीं करती।
theological_decisions:
- issue: एलीहू के कथन में כֹפֶר का अर्थ
  choice: छुड़ौती
  alternative: प्रायश्चित-मूल्य / क्षतिपूर्ति
  rationale: यह पद उस आधार की बात करता है जिस पर मनुष्य को गड्ढे में उतरने से बचाया जाता है। ‘छुड़ौती’ रिहाई सुनिश्चित करने वाले मूल्य का ठोस अर्थ बनाए रखती है, जबकि प्रायश्चित-संबंधी संभावित अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וַיְחֻנֶּנּוּ और וַיֹּאמֶר का कर्ता
  choice: पूर्ववर्ती प्रसंग के मध्यस्थ-दूत के लिए ‘वह’
  alternative: परमेश्वर
  rationale: निकटतम व्याकरणिक और प्रसंगगत कर्ता पिछले पद का दूत/मध्यस्थ हो सकता है, किंतु व्यापक प्रसंग में परमेश्वर की भूमिका भी समझी जा सकती है। मुख्य पाठ अस्पष्ट सर्वनाम ‘वह’ रखकर इस तनाव का समाधान थोपता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘छुड़ा ले’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘छुड़ौती’ मूल के मूल्य देकर रिहाई के भाव को संजोती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित शब्दों के बाद रखे गए हैं।
