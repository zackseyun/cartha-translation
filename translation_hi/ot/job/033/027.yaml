language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָשֹׁ֤ר עַל אֲנָשִׁ֗ים וַ/יֹּ֗אמֶר חָ֭טָאתִי וְ/יָשָׁ֥ר הֶעֱוֵ֗יתִי וְ/לֹא שָׁ֥וָה לִֽ/י׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/027.yaml
  text: He sings before men and says, ‘I have sinned and twisted what was right, and it was not repaid to me.’
translation:
  language: hi
  text: 'वह लोगों के सामने गाता है[a] और कहता है,


    ‘मैंने पाप किया और जो सीधा था उसे टेढ़ा कर दिया,


    और उसका बदला मुझे नहीं मिला।’[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “वह लोगों की ओर देखकर कहता है।” इब्रानी क्रिया का अर्थ अनिश्चित है।
    reason: יָשֹׁר दुर्लभ और विवादित है; प्राचीन तथा आधुनिक व्याख्याओं में ‘गाता है’ और ‘देखता है’ दोनों पाए जाते हैं।
  - marker: b
    text: 'इसका अर्थ संभवतः है, “मुझे मेरे पाप के योग्य दंड नहीं मिला”; अन्य व्याख्या: “इससे मुझे कोई लाभ नहीं हुआ।”'
    reason: וְלֹא שָׁוָה לִי अत्यंत संक्षिप्त और अर्थ की दृष्टि से विवादित पदबंध है; टिप्पणी वास्तविक शाब्दिक और प्रासंगिक विकल्प सुरक्षित रखती है।
lexical_decisions:
- source_word: יָשֹׁר
  choice: गाता है
  rationale: यह दुर्लभ रूप यहाँ संभवतः ‘गाना’ अर्थ वाले धातु-प्रयोग से है; अंग्रेज़ी परामर्श-पाठ भी इसी अर्थ को अपनाता है। ‘लोगों के सामने’ के साथ यह सार्वजनिक गवाही अथवा अंगीकार का भाव देता है।
- source_word: וְיָשָׁר הֶעֱוֵיתִי
  choice: जो सीधा था उसे टेढ़ा कर दिया
  rationale: मूल में ‘सीधा/सही’ और ‘टेढ़ा करना’ का स्पष्ट विरोध है। इस रूपक को हिन्दी में बनाए रखना ‘गलत किया’ जैसे सामान्य अनुवाद से अधिक स्रोत-संगत है।
- source_word: וְלֹא שָׁוָה לִי
  choice: फिर भी मुझे उसके बराबर प्रतिफल नहीं मिला
  rationale: שׁוה का मूल भाव ‘बराबर होना’ है। वाक्य यह संकेत देता है कि पाप के अनुरूप परिणाम उसे नहीं मिला, पर ‘दंड’ जोड़कर निहित अर्थ को पूर्णतः स्पष्ट नहीं किया गया।
theological_decisions:
- issue: क्या अंतिम पंक्ति में दंड से बचाए जाने का अर्थ स्पष्ट रूप से जोड़ा जाए?
  choice: ‘उसके बराबर प्रतिफल नहीं मिला’ कहकर अपराध और परिणाम की असमानता व्यक्त की गई।
  alternative: ‘मुझे मेरे अपराध के योग्य दंड नहीं मिला’ या ‘इससे मुझे कोई लाभ नहीं हुआ।’
  rationale: संदर्भ में उद्धार और प्राण बचाए जाने का विचार दंड से कम प्रतिफल की ओर संकेत करता है, किंतु अत्यंत संक्षिप्त इब्रानी पदबंध में ‘दंड’ प्रत्यक्ष नहीं है और उसके अर्थ पर मतभेद है। इसलिए अनुवाद मूल की तुलनात्मक अस्पष्टता बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘सीधा’ और ‘टेढ़ा’ की मूल रूपक-संरचना रखी गई है। ‘प्रतिफल’ सामान्य बातचीत से थोड़ा ऊँचा, किंतु व्यापक रूप से समझा जाने वाला शब्द है और यहाँ अच्छे या बुरे परिणाम—दोनों की गुंजाइश बनाए रखता है।
