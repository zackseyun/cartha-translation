base_translation:
  language: en
  yaml_path: translation/ot/job/033/006.yaml
  text: Look[a], I am like your mouthpiece before God[b]; I too was pinched off from clay.
translation:
  language: hi
  text: देखो, परमेश्वर के सामने मैं तुम्हारे मुँह के समान हूँ[a]; मैं भी मिट्टी से गढ़ा गया हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मैं परमेश्वर के लिए/सामने तुम्हारे मुँह के समान हूँ।” इसका अर्थ “मैं परमेश्वर के सामने तुम्हारा प्रवक्ता हूँ,” “मैं परमेश्वर के सामने तुम्हारी इच्छा के अनुसार हूँ,” या सम्भवतः “परमेश्वर के सामने मैं तुम्हारे समान हूँ” हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या “मैं भी मिट्टी से बनाया गया हूँ।” इब्रानी क्रिया मिट्टी से अंश काटकर या चुटकी से अलग करके उसे आकार देने का बिम्ब जगा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान खींचने वाला बलयुक्त संवाद-कण है; ‘देखो’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में उसका संकेतात्मक बल बनाए रखता है।
- source_word: כְפִיךָ לָאֵל
  choice: परमेश्वर के सामने मैं तुम्हारे मुँह के समान हूँ
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है, जिसका शाब्दिक अर्थ लगभग ‘परमेश्वर के लिए/सामने तुम्हारे मुँह के समान’ है। मुख्य पाठ मूल रूपक और उसकी अस्पष्टता को रखता है; सम्भावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מֵחֹמֶר
  choice: मिट्टी से
  rationale: חֹמֶר यहाँ गीली मिट्टी अथवा कुम्हार की मिट्टी जैसी सामग्री को सूचित करता है और साझा मानवीय उत्पत्ति के चित्र के अनुकूल है।
- source_word: קֹרַצְתִּי
  choice: नोचकर गढ़ा गया हूँ
  rationale: क्रिया में मिट्टी से अंश नोचने/चुटकी से अलग करने और आकार देने का स्पर्शात्मक बिम्ब है। संयुक्त हिन्दी अभिव्यक्ति उस ठोस चित्र को रखते हुए अर्थ स्पष्ट करती है।
- source_word: גַם אֲנִי
  choice: मैं भी
  rationale: यह अय्यूब के साथ एलीहू की समान मानवीय उत्पत्ति पर बल देता है।
theological_decisions:
- issue: परमेश्वर और अय्यूब के संबंध में एलीहू के कथन का अर्थ
  choice: मुख्य पाठ में ‘तुम्हारे मुँह के समान’ का मूल रूपक रखा गया है, और प्रवक्ता/प्रतिनिधि होने की सम्भावना पादटिप्पणी में दी गई है।
  alternative: ‘मैं परमेश्वर के सामने तुम्हारा प्रवक्ता हूँ’; ‘परमेश्वर के सामने मैं तुम्हारी इच्छा के अनुसार हूँ’; अथवा ‘परमेश्वर के सामने मैं तुम्हारे समान हूँ।’
  rationale: दूसरा खंड साझा मिट्टी से बने होने पर बल देता है, पर पहला खंड व्याकरणतः संक्षिप्त और विवादित है। इसलिए किसी विशिष्ट मध्यस्थतावादी अर्थ को मुख्य पाठ में निर्णायक रूप से आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप। कठिन इब्रानी पदबंध को सरल व्याख्या से बदलने के बजाय मुख्य पाठ में उसका मुख-रूपक रखा गया है; विकल्प पादटिप्पणी में सुरक्षित हैं।
