  text: यदि उसके लिए कोई स्वर्गदूत[a], एक मध्यस्थ हो—हज़ार में से एक—जो मनुष्य को बताए कि उसके लिए क्या उचित है[b],
  philosophy: optimal-equivalence
  footnotes:
