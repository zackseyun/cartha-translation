lexical_decisions:
- source_word: אִם יֵשׁ עָלָיו
  choice: यदि उसके लिए कोई ... हो
  rationale: यह पद एक शर्त प्रस्तुत करता है; עָלָיו को यहाँ उस मनुष्य के लिए अथवा उसकी ओर से कार्य करने के संबंध में समझा गया है।
- source_word: מַלְאָךְ
  choice: स्वर्गदूत
  rationale: शब्द का अर्थ ‘दूत’ भी हो सकता है, पर प्रसंग में स्वर्गीय मध्यस्थ अधिक संभावित है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: מֵלִיץ
  choice: मध्यस्थ
  rationale: यह शब्द व्याख्या करने वाले, प्रवक्ता अथवा बीच-बचाव करने वाले व्यक्ति को सूचित कर सकता है। ‘मध्यस्थ’ प्रसंगगत भूमिका को संक्षेप में व्यक्त करता है।
- source_word: אֶחָד מִנִּי אָלֶף
  choice: हज़ार में से एक
  rationale: मूल अभिव्यक्ति की दुर्लभता और विशिष्टता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְהַגִּיד לְאָדָם
  choice: जो मनुष्य को ... बताए
  rationale: उद्देश्यसूचक infinitive को सहज हिन्दी उपवाक्य के रूप में व्यक्त किया गया है; אָדָם यहाँ किसी मनुष्य-व्यक्ति को दर्शाता है।
- source_word: יָשְׁרוֹ
  choice: उसका सही मार्ग
  rationale: יֹשֶׁר/ישר की ‘सीधापन, खरापन, उचित बात’ की अर्थ-सीमा और पुरुषवाचक प्रत्यय को बनाए रखते हुए यह हिन्दी में बोधगम्य है। वाक्यांश का अर्थ ‘उसके लिए क्या सही है’ भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: מַלְאָךְ מֵלִיץ की पहचान और भूमिका
  choice: ‘स्वर्गदूत, कोई मध्यस्थ’ के रूप में सामान्य वर्णन
  alternative: मानवीय दूत/व्याख्याकार, या अधिक विशिष्ट अर्थ वाला स्वर्गीय बिचवई
  rationale: मूल पाठ इस व्यक्ति की पहचान इन पदों से आगे स्पष्ट नहीं करता। इसलिए अनुवाद किसी विशिष्ट स्वर्गदूत-विज्ञान या मसीही पहचान को आरोपित नहीं करता।
- issue: יָשְׁרוֹ का संदर्भ
  choice: मनुष्य का सही मार्ग
  alternative: उसकी धार्मिकता; अथवा उसके लिए जो उचित है
  rationale: प्रत्यय मनुष्य की ओर संकेत कर सकता है, पर अभिव्यक्ति उसके मामले में उचित बात या सही आचरण भी बता सकती है। मुख्य पाठ पठनीय अर्थ देता है और पादटिप्पणी वास्तविक अस्पष्टता बचाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘हज़ार’ सामान्य आधुनिक वर्तनी है। डैश विरल मध्यस्थ की पहचान को स्पष्ट करता है, और पद के अगले भाग से जुड़ाव बनाए रखने के लिए अंत में अल्पविराम रखा गया है।
