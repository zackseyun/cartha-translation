  text: उसके प्राण[a] को गर्त[b] से लौटा लाने के लिए, ताकि वह जीवन की ज्योति[d] से प्रकाशित हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके जीवन” अथवा “उसे स्वयं”; इब्रानी शब्द का अर्थ प्राण, जीवन या स्वयं व्यक्ति हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “गड्ढे,” “कब्र,” अथवा “विनाश”।
    reason: lexical_alternative
  - marker: c
    text: या “ताकि वह ज्योति देखे” अथवा “ज्योति में लाया जाए।” इब्रानी पदबंध संक्षिप्त और काव्यात्मक है।
    reason: lexical_alternative
  - marker: d
    text: या “जीवितों की ज्योति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהָשִׁיב
  choice: लौटा लाने के लिए
  rationale: 'שׁוב के हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित रहता है: किसी को वापस लाना। यह ‘बहाल करना’ की अपेक्षा अधिक मूर्त और काव्यात्मक है।'
- source_word: נַפְשׁוֹ
  choice: उसके प्राण
  rationale: נפשׁ यहाँ व्यक्ति के जीवन, प्राण या स्वयं व्यक्ति को सूचित कर सकता है। मृत्यु के गर्त से बचाने के संदर्भ में ‘प्राण’ स्वाभाविक है और मूल की अर्थ-व्याप्ति को काफी हद तक बनाए रखता है।
- source_word: מִנִּי שָׁחַת
  choice: गर्त से
  rationale: שׁחת की ‘गड्ढा/गर्त’ वाली ठोस काव्य-छवि को रखा गया है; प्रसंग में यह कब्र या विनाश का भी बोध करा सकता है।
- source_word: לֵאוֹר
  choice: ताकि वह … प्रकाशित हो
  rationale: संक्षिप्त और कठिन इब्रानी रचना को प्रयोजन/परिणाम के रूप में व्यक्त किया गया है। ‘प्रकाशित हो’ אור धातु और अंधकार से जीवन के प्रकाश की ओर जाने वाली छवि को बनाए रखता है।
- source_word: בְּאוֹר הַחַיִּים
  choice: जीवन की ज्योति से
  rationale: यह चयन इब्रानी के काव्यात्मक पदबंध को स्वाभाविक, गरिमापूर्ण हिन्दी में रखता है। בְּ को साधन/संबंध के अर्थ में ‘से’ अनूदित किया गया है।
theological_decisions:
- issue: נפשׁ का मानव-स्वरूप संबंधी अर्थ
  choice: प्राण
  alternative: आत्मा; जीवन; स्वयं उसे
  rationale: यहाँ किसी विशिष्ट आत्मा-शरीर सिद्धांत को आरोपित नहीं किया गया। ‘प्राण’ मृत्यु से बचाए गए जीवन और व्यक्ति—दोनों की ओर संकेत कर सकता है।
- issue: הַחַיִּים का अर्थ
  choice: जीवन
  alternative: जीवित लोग
  rationale: ‘जीवन की ज्योति’ निकटवर्ती मृत्यु/गर्त के विपरीत काव्यात्मक अर्थ देता है; फिर भी ‘जीवितों की ज्योति’ व्याकरणतः संभव है और पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्य-शैली रखी गई है। ‘गर्त’ सामान्य बोलचाल के ‘गड्ढे’ से कुछ अधिक साहित्यिक है, पर अय्यूब की काव्यात्मक शैली और मृत्यु की गहराई की छवि के अनुकूल है।
