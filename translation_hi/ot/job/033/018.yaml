  text: He spares his soul from the pit[c][b][a], and his life from passing by the weapon.
translation:
  language: hi
  text: वह उसके प्राण को गड्ढे[a] से बचाता है और उसके जीवन को हथियार[b] से मारे जाने से बचाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “विनाश।”
    reason: lexical_alternative
  - marker: b
    text: इस हिब्रू शब्द का अधिक विशिष्ट अर्थ “बाण,” “प्रक्षेप्य” या संभवतः “तलवार” भी हो सकता है; यहाँ यह हथियार से होने वाली हिंसक मृत्यु का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַחְשֹׂךְ
  choice: रोकता है … बचाता है
  rationale: हिफ़ील रूप का अर्थ किसी को किसी संकट में जाने से रोकना, बचाए रखना या छोड़ देना है। दोनों समानांतर पंक्तियों में स्वाभाविक हिन्दी के लिए ‘रोकता है’ और ‘बचाता है’ प्रयुक्त हुए हैं।
- source_word: נַפְשׁוֹ
  choice: उसके प्राण
  rationale: נפש यहाँ व्यक्ति के जीवन अथवा प्राण को दर्शाता है। ‘प्राण’ मृत्यु के संदर्भ और काव्यात्मक शैली दोनों के अनुकूल है।
- source_word: מִנִּי שָׁחַת
  choice: गड्ढे में जाने से
  rationale: שׁחת का मूल चित्र गड्ढे का है, जो यहाँ कब्र, मृत्यु या विनाश का बिंब है। गति का भाव हिन्दी में स्पष्ट करने के लिए ‘में जाने से’ जोड़ा गया है।
- source_word: וְחַיָּתוֹ
  choice: उसके जीवन को
  rationale: यहाँ חיה से बना रूप व्यक्ति के जीवित जीवन को सूचित करता है और पहले खंड के ‘प्राण’ के समानांतर है।
- source_word: מֵעֲבֹר
  choice: मारे जाने से
  rationale: עבר का शाब्दिक अर्थ गुजरना या पार होना है, पर हथियार के साथ इस प्रसंग में इसका आशय हिंसक मृत्यु को प्राप्त होना है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בַּשָּׁלַח
  choice: हथियार से
  rationale: שׁלח किसी प्रक्षेप्य, बाण, तलवार या व्यापक रूप से हथियार को सूचित कर सकता है। अनिश्चितता के कारण मुख्य पाठ में व्यापक शब्द ‘हथियार’ चुना गया है।
theological_decisions:
- issue: נפש और חיה के बीच संबंध
  choice: ‘प्राण’ और ‘जीवन’ के काव्यात्मक समानांतर को बनाए रखा गया है
  alternative: दोनों को केवल ‘जीवन’ कहना
  rationale: मूल पद के दो अलग शब्दों को बनाए रखने से किसी कठोर देह-आत्मा भेद को आरोपित किए बिना हिब्रू काव्य का समानांतर भाव सुरक्षित रहता है।
- issue: עֲבֹר בַּשָּׁלַח का अर्थ
  choice: हथियार से मारे जाने से
  alternative: हथियार के बीच से गुजरने से
  rationale: मुख्य पाठ प्रसंगगत अर्थ—हिंसक मृत्यु से बचाव—को स्वाभाविक हिन्दी में व्यक्त करता है; अधिक शाब्दिक और अस्पष्ट गति-चित्र पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्राण’ और ‘जीवन’ से मूल का काव्यात्मक समानांतर बचता है, जबकि कठिन हिब्रू मुहावरे को मुख्य पाठ में अर्थानुकूल और पादटिप्पणी में अधिक शाब्दिक रूप से प्रस्तुत किया गया है।
