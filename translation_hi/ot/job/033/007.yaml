lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करते हुए आश्वासन पर बल देता है; आधुनिक हिन्दी में “देखो” स्वाभाविक है।
- source_word: אֵמָתִי
  choice: मेरा आतंक
  rationale: यह एलीहू से जुड़ी दहशत या आतंक को व्यक्त करता है। “मेरा आतंक” मूल की वस्तुगत अर्थ-छाया को बनाए रखता है, यद्यपि हिन्दी में इसका अर्थ संदर्भ से ‘मेरे कारण होनेवाला आतंक’ है।
- source_word: תְבַעֲתֶךָ
  choice: तुम्हें भयभीत नहीं करेगा
  rationale: בעת के पिएल रूप का अर्थ बुरी तरह डराना या आतंकित करना है। यह प्रयोग आधुनिक हिन्दी में स्पष्ट और स्वाभाविक आश्वासन देता है।
- source_word: אַכְפִּי
  choice: मेरा दबाव
  rationale: यह दुर्लभ और कठिन संज्ञा है। अगले क्रिया-पद “भारी पड़ेगा” के साथ “दबाव” प्रसंगगत अर्थ को स्पष्ट करता है, जबकि पारंपरिक “हाथ” को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עָלֶיךָ
  choice: तुम पर
  rationale: על और द्वितीय पुरुष एकवचन प्रत्यय का सीधा तथा स्वाभाविक हिन्दी समतुल्य।
- source_word: יִכְבָּד
  choice: भारी नहीं पड़ेगा
  rationale: כבד का मूल अर्थ ‘भारी होना’ है। “भारी पड़ना” हिन्दी में भार या दबाव के किसी पर हावी न होने को स्वाभाविक ढंग से व्यक्त करता है।
