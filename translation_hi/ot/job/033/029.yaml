  text: הֶן כָּל אֵ֭לֶּה יִפְעַל אֵ֑ל פַּעֲמַ֖יִם שָׁל֣וֹשׁ עִם גָּֽבֶר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/029.yaml
  text: Look[a], God does all these things two or three times with a man,
translation:
  language: hi
  text: देखो, परमेश्वर ये सब काम मनुष्य के साथ दो या तीन बार करता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह कथन की ओर ध्यान खींचने वाला अव्यय है; ‘देखो’ आधुनिक, स्वाभाविक और बलयुक्त है।
- source_word: כָּל אֵלֶּה
  choice: ये सब काम
  rationale: यह पिछले प्रसंग में बताए गए परमेश्वर के विभिन्न कार्यों की ओर संकेत करता है; ‘काम’ जोड़ने से हिन्दी स्वाभाविक रहती है।
- source_word: יִפְעַל
  choice: करता है
  rationale: פעל यहाँ कार्य करने या संपन्न करने के अर्थ में है; ‘काम ... करता है’ सहज हिन्दी है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: אֵל यहाँ इस्राएल के परमेश्वर के लिए प्रयुक्त सामान्य पद है; हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित रूप है।
- source_word: פַּעֲמַיִם שָׁלוֹשׁ
  choice: दो बार, बल्कि तीन बार
  rationale: इब्रानी का शाब्दिक क्रम ‘दो बार, तीन बार’ पुनरावृत्ति और बढ़ते बल को व्यक्त करता है; ‘बल्कि’ हिन्दी में इस संबंध को स्वाभाविक बनाता है, बिना इसे केवल ‘बार-बार’ में ढीला किए।
- source_word: עִם
  choice: के साथ
  rationale: यह परमेश्वर के किसी मनुष्य के संबंध में व्यवहार को सीधे व्यक्त करता है और ‘के लिए’ जैसे अधिक व्याख्यात्मक अनुवाद से बचता है।
- source_word: גָּבֶר
  choice: मनुष्य
  rationale: גָּבֶר पुल्लिंग एकवचन में एक प्रतिनिधि मानव व्यक्ति को दर्शाता है। हिन्दी में ‘मनुष्य’ स्रोत की मानव-संज्ञा और सामान्य संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: גָּבֶר में प्रतिनिधि पुल्लिंग भाषा
  choice: मनुष्य
  alternative: पुरुष
  rationale: यहाँ कथन किसी एक पुरुष तक सीमित नहीं, बल्कि एक प्रतिनिधि मानव के बारे में है। ‘मनुष्य’ आधुनिक हिन्दी में इस सामान्य अर्थ को व्यक्त करता है और मूल की एकवचनता बनाए रखता है; ‘पुरुष’ अनावश्यक रूप से केवल पुरुष-लिंग का बोध करा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज। ‘देखो’ ध्यानाकर्षक आरंभ को बनाए रखता है। ‘दो बार, बल्कि तीन बार’ मूल की संख्यात्मक पुनरावृत्ति और बल को सुरक्षित रखता है।
