    reason: lexical_alternative
lexical_decisions:
- source_word: רוּחַ
  choice: आत्मा
  rationale: אֵל के साथ यह परमेश्वर की जीवनदायी शक्ति/आत्मा को सूचित कर सकता है; साथ ही मूल शब्द में ‘साँस’ और ‘वायु’ के अर्थ भी संभव हैं, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ यह שַׁדַּי के समानांतर ईश्वर के लिए प्रयुक्त है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עָשָׂתְנִי
  choice: ने मुझे बनाया है
  rationale: עשה का सामान्य अर्थ ‘बनाना’ है; पूर्ण क्रिया के वर्तमान प्रभाव को हिन्दी का पूर्ण वर्तमान स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִשְׁמַת
  choice: साँस
  rationale: यह जीवन प्रदान करने वाली श्वास को दर्शाता है और पहले चरण के רוּחַ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त इस ईश्वरीय उपाधि का यह प्रचलित और अर्थपूर्ण हिन्दी अनुवाद है।
- source_word: תְּחַיֵּנִי
  choice: मुझे जीवन देती है
  rationale: पिएल रूप का कारक अर्थ ‘जीवित करना/जीवन देना’ है; यह वाक्यांश सृष्टि और जीवनदान के भाव को स्पष्ट और सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: רוּחַ אֵל को ‘परमेश्वर का आत्मा’ समझा जाए या ‘परमेश्वर की साँस’
  choice: परमेश्वर के आत्मा
  alternative: परमेश्वर की साँस
  rationale: दूसरे चरण में נִשְׁמַת ‘साँस’ आने के कारण ‘आत्मा’ दोनों पदों का भेद और काव्यात्मक समानांतरता बनाए रखता है। फिर भी רוּחַ की वास्तविक शाब्दिक बहुअर्थकता पादटिप्पणी में सुरक्षित रखी गई है; इससे पाठ को किसी विस्तृत सांप्रदायिक निष्कर्ष तक नहीं खींचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक गद्य। ‘परमेश्वर के आत्मा’ में ‘के’ का प्रयोग आत्मा को परमेश्वर से संबद्ध व्यक्तिवाचक/चेतन संदर्भ के रूप में स्वाभाविक हिन्दी ढंग से व्यक्त करता है; दूसरे चरण में स्त्रीलिंग ‘देती है’ ‘साँस’ के अनुसार है।
