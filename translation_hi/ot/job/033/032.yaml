  yaml_path: translation/ot/job/033/032.yaml
  text: If you have words[a], answer me; speak, for I desire to justify you.
translation:
  language: hi
  text: यदि तुम्हारे पास कहने को कुछ है, तो मुझे उत्तर दो; बोलो, क्योंकि मैं तुम्हें सही ठहराना चाहता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם יֵשׁ מִלִּין
  choice: यदि तुम्हारे पास कहने को कुछ है
  rationale: शाब्दिक ‘यदि शब्द हैं’ की अपेक्षा यह आधुनिक हिन्दी में स्वाभाविक है और प्रत्युत्तर देने के लिए एलीहू के निमंत्रण का भाव स्पष्ट रखता है।
- source_word: הֲשִׁיבֵנִי
  choice: मुझे उत्तर दो
  rationale: हिफ़ील आज्ञार्थक का प्रसंगानुकूल अर्थ ‘उत्तर देना’ है; यह सीधा और स्वाभाविक अनुवाद है।
- source_word: דַּבֵּר
  choice: बोलो
  rationale: मूल की संक्षिप्त और सीधी आज्ञा को बनाए रखता है।
- source_word: כִּי חָפַצְתִּי
  choice: क्योंकि मैं ... चाहता हूँ
  rationale: כִּי कारण बताता है और חפץ यहाँ इच्छा व्यक्त करता है; यह आधुनिक हिन्दी में सहज है।
- source_word: צַדְּקֶךָ
  choice: तुम्हें सही ठहराना
  rationale: צדק के इस रूप का आशय अय्यूब को सही सिद्ध या घोषित करना है। ‘सही ठहराना’ मूल से निकट रहते हुए प्रसंग में बोधगम्य है।
theological_decisions:
- issue: צַדְּקֶךָ का अर्थ
  choice: तुम्हें सही ठहराना
  alternative: तुम्हें निर्दोष सिद्ध करना; तुम्हें सही घोषित करना
  rationale: यहाँ एलीहू पौलुस-संबंधी धार्मिक अर्थ में परमेश्वर के सामने धर्मी ठहराए जाने की बात नहीं कर रहा, बल्कि यह कहता है कि यदि संभव हो तो वह अय्यूब को सही सिद्ध करना चाहता है। चुना हुआ रूप मूल के शब्द-संबंध और प्रसंग, दोनों को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधा, गरिमापूर्ण और बोलचाल में समझ आने वाला वाक्य। ‘कहने को कुछ’ ने इब्रानी मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया है।
