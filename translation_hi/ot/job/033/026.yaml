base_translation:
  language: en
  yaml_path: translation/ot/job/033/026.yaml
  text: He prays to God[a], and he accepts him; he sees his face with a shout of joy[c][b], and he restores to man his righteousness.
translation:
  language: hi
  text: वह परमेश्वर से प्रार्थना करता है[a], और परमेश्वर उसे स्वीकार करता है; वह जयजयकार के साथ उसका मुख देखता है[b], और परमेश्वर मनुष्य को उसकी धार्मिकता लौटा देता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परमेश्वर से विनती करता है।’ इब्रानी क्रिया गंभीर आग्रह के साथ की गई प्रार्थना पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह परमेश्वर का मुख देखता है; इब्रानी में केवल ‘उसका मुख’ है।
    reason: alternative_reading
  - marker: c
    text: या ‘उसकी उचित स्थिति’ अथवा ‘उसका सही ठहराया जाना।’ यहाँ ‘धार्मिकता’ परमेश्वर के सामने पुनःस्थापित स्थिति को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶעְתַּר
  choice: प्रार्थना करता है
  rationale: यह क्रिया परमेश्वर से की गई गंभीर प्रार्थना या विनती को व्यक्त करती है। ‘प्रार्थना करता है’ सहज आधुनिक हिन्दी है; विनती का भाव पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में यह परमेश्वर के लिए प्रयुक्त एकवचन काव्यात्मक पद है। ‘परमेश्वर’ स्वाभाविक हिन्दी समतुल्य है; ‘सर्वशक्तिमान’ जोड़ना मूल से अधिक कहना होता।
- source_word: וַיִּרְצֵהוּ
  choice: उसे स्वीकार करता है
  rationale: רצה यहाँ प्रार्थना करने वाले को अनुकूल भाव से ग्रहण करने का संकेत देता है। यह अनुवाद संक्षिप्त है और पुनःस्थापित संबंध के प्रसंग में उपयुक्त है।
- source_word: וַיַּרְא פָּנָיו
  choice: वह उसका मुख देखता है
  rationale: सर्वाधिक स्वाभाविक अर्थ है कि पुनःस्थापित मनुष्य परमेश्वर का मुख देखता है। हिन्दी में ‘उसका मुख’ मूल की सर्वनामगत संक्षिप्तता और कुछ अस्पष्टता को बनाए रखता है।
- source_word: בִּתְרוּעָה
  choice: जयजयकार के साथ
  rationale: תְּרוּעָה हर्ष या विजय की ऊँची पुकार को दर्शाता है। ‘जयजयकार’ उसके श्रव्य और आनन्दपूर्ण दोनों पक्षों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיָּשֶׁב
  choice: लौटा देता है
  rationale: שוב का हिफ़ील रूप यहाँ कारणवाचक है—किसी वस्तु को मनुष्य के पास फिर से लौटाना या बहाल करना।
- source_word: לֶאֱנוֹשׁ
  choice: मनुष्य को
  rationale: אֱנוֹשׁ नश्वर मानव के लिए प्रयुक्त होता है। ‘मनुष्य’ काव्यात्मक प्रसंग में स्वाभाविक और व्यापक है।
- source_word: צִדְקָתוֹ
  choice: उसकी धार्मिकता
  rationale: צדקה का सीधा अर्थ ‘धार्मिकता’ है। प्रसंग में इसमें सही ठहराया जाना या परमेश्वर के सामने उचित स्थिति पुनः पाना भी निहित हो सकता है; पादटिप्पणी इस अर्थ-व्याप्ति को सुरक्षित रखती है।
theological_decisions:
- issue: ‘वह उसे स्वीकार करता है; वह उसका मुख देखता है’ में सर्वनामों के संदर्भ
  choice: परमेश्वर प्रार्थना करने वाले मनुष्य को स्वीकार करता है, और वह मनुष्य परमेश्वर का मुख देखता है।
  alternative: व्याकरण की दृष्टि से सर्वनामों को दूसरे ढंग से जोड़ा जा सकता है—जैसे परमेश्वर मनुष्य का मुख देखता है—यद्यपि प्रसंग और ‘मुख देखना’ मुहावरा चुने गए अर्थ के पक्ष में हैं।
  rationale: आस-पास का प्रसंग मनुष्य के परमेश्वर की ओर मुड़ने और फिर अनुग्रह तथा पुनःस्थापना पाने का वर्णन करता है। मुख्य पाठ में सर्वाधिक स्वाभाविक क्रम अपनाया गया है, जबकि पादटिप्पणी मूल के सर्वनाम को स्पष्ट करती है।
- issue: ‘उसकी धार्मिकता’ का आशय
  choice: मनुष्य से संबंधित धार्मिकता अथवा उसकी पुनःस्थापित उचित स्थिति।
  alternative: यह उसके सही ठहराए जाने या निर्दोष सिद्ध होने को सूचित कर सकता है; इसे विशेष रूप से परमेश्वर की आरोपित धार्मिकता मानना भी प्रस्तावित किया जा सकता है, पर मूल पद स्वयं ऐसा स्पष्ट नहीं करता।
  rationale: प्रत्यय का सबसे स्वाभाविक संदर्भ मनुष्य है। ‘उसकी धार्मिकता’ मूल की व्यापकता बनाए रखता है और किसी बाद की विशिष्ट धर्मसैद्धांतिक व्यवस्था को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और हल्का काव्यात्मक रूप रखा गया है। ‘जयजयकार’ मूल की ऊँची आनन्दपूर्ण पुकार को संक्षेप में व्यक्त करता है। मुख्य पाठ में संदर्भ स्पष्ट करने के लिए दो स्थानों पर ‘परमेश्वर’ दोहराया गया है, पर ‘उसका मुख’ में मूल की सर्वनामगत बनावट सुरक्षित है।
