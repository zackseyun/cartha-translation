  yaml_path: translation/ot/job/033/031.yaml
  text: Pay attention[a], Job; listen to me. Be silent[b], and I will speak.
translation:
  language: hi
  text: ध्यान दे, अय्यूब; मेरी सुन। चुप रह, और मैं बोलूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקְשֵׁב
  choice: ध्यान दे
  rationale: קשׁב के हिफ़ील आज्ञार्थक का अर्थ ध्यानपूर्वक सुनना है। ‘ध्यान दे’ आधुनिक और स्वाभाविक हिन्दी में इसकी प्रबल आज्ञा को व्यक्त करता है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: व्यक्तिनाम का रूप मानक हिन्दी बाइबलीय परंपरा के अनुसार रखा गया है।
- source_word: שְׁמַע לִי
  choice: मेरी सुन
  rationale: ל के साथ שׁמע वक्ता की ओर निर्देशित होकर सुनने का भाव देता है। ‘मेरी सुन’ हिन्दी में सीधा, स्वाभाविक और प्रसंगानुकूल है।
- source_word: הַחֲרֵשׁ
  choice: चुप रह
  rationale: यह חרשׁ का आज्ञार्थक है और यहाँ मौन रहने की सीधी आज्ञा देता है। ‘चुप रह’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: וְאָנֹכִי
  choice: और मैं
  rationale: सरल संयोजक के साथ स्वतंत्र प्रथम-पुरुष सर्वनाम वक्ता पर हल्का बल देता है; हिन्दी में ‘और मैं’ उसे सुरक्षित रखता है।
- source_word: אֲדַבֵּר
  choice: बोलूँगा
  rationale: דבר का पिएल अपूर्ण रूप यहाँ अय्यूब के मौन रहने के बाद एलीहू की अभिप्रेत क्रिया व्यक्त करता है। ‘बोलूँगा’ स्वाभाविक भविष्यसूचक हिन्दी है।
