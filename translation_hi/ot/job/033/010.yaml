translation:
  language: hi
  text: देखो[a], वह मेरे विरुद्ध वैर के आधार पाता है; वह मुझे अपना शत्रु मानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह मेरे विरुद्ध वैर पाता है,” “वह मेरे विरुद्ध विरोध के अवसर पाता है,” अथवा संभवतः “वह मेरे विरुद्ध शिकायतें पाता है।” इब्रानी संज्ञा दुर्लभ है और उसका अर्थ प्रसंग पर निर्भर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान आकर्षित करते हुए कथन पर बल देता है। ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में उसका प्रभाव बनाए रखता है।
- source_word: תְּנוּאוֹת
  choice: वैर के आधार
  rationale: यह दुर्लभ और प्रसंग-निर्भर संज्ञा है, जो विरोध, वैर या शिकायत के अवसर अथवा आधार सूचित कर सकती है। ‘वैर के आधार’ खोजे जाने वाले कारणों और शत्रुतापूर्ण भाव—दोनों को व्यक्त करता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: इस प्रसंग में עַל विरोधात्मक अर्थ देता है।
- source_word: יִמְצָא
  choice: ढूँढ़ता है
  rationale: मूल अर्थ ‘पाना/ढूँढ़ना’ है। यह अनुवाद आरोप को ‘गढ़ना’ जैसा अधिक तीखा अर्थ दिए बिना मूल क्रिया का भाव रखता है।
- source_word: יַחְשְׁבֵנִי
  choice: मुझे … मानता है
  rationale: חשב यहाँ किसी को एक निश्चित दर्जे में समझने या गिनने का अर्थ देता है; ‘मानता है’ स्वाभाविक हिन्दी है।
- source_word: לְאוֹיֵב לוֹ
  choice: अपना शत्रु
  rationale: इब्रानी रचना उस भूमिका या स्थिति को बताती है जिसमें अय्यूब को समझा जाता है; हिन्दी में ‘अपना शत्रु’ इसे सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: अय्यूब के प्रति परमेश्वर के व्यवहार पर वक्ता का दृष्टिकोण
  choice: 'अय्यूब की शिकायत को उसके पूरे तनाव के साथ प्रस्तुत किया गया है: ‘वह मेरे विरुद्ध वैर के आधार ढूँढ़ता है; वह मुझे अपना शत्रु मानता है।’'
  alternative: ‘वह मेरे विरुद्ध आरोप गढ़ता है’
  rationale: यह पद अय्यूब की अनुभूत शिकायत को उद्धृत करता है, उसका धर्मवैज्ञानिक समर्थन नहीं करता। ‘ढूँढ़ता है’ आरोप की तीव्रता बनाए रखता है, पर यह अतिरिक्त निष्कर्ष नहीं जोड़ता कि परमेश्वर झूठे आरोप गढ़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘वैर के आधार’ दुर्लभ इब्रानी संज्ञा की अस्पष्टता को पूरी तरह समाप्त किए बिना मुख्य अर्थ स्पष्ट करता है; विकल्प पादटिप्पणी में दिए गए हैं।
