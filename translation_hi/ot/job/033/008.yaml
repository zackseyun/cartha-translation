  yaml_path: translation/ot/job/033/008.yaml
  text: 'Surely you have spoken in my hearing[a], and I have heard the sound of your words:'
translation:
  language: hi
  text: 'निश्चय ही तुमने मेरे सुनते हुए कहा है,

    और मैंने तुम्हारे शब्दों की ध्वनि सुनी है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह शब्द सीमाबोधक ‘केवल’ नहीं, बल्कि अय्यूब की कही बात का उल्लेख आरम्भ करने वाला निश्चयात्मक बल व्यक्त करता है।
- source_word: אָמַרְתָּ
  choice: तुमने ... कहा है
  rationale: पूर्ण क्रिया पहले कही गई बात को सूचित करती है; हिन्दी में पूर्ण पक्ष इस संदर्भ से स्वाभाविक रूप से मेल खाता है।
- source_word: בְאָזְנָי
  choice: मेरे सुनते हुए
  rationale: शाब्दिक अर्थ ‘मेरे कानों में’ है; ‘मेरे सुनते हुए’ उसी श्रवण-बोध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְקוֹל
  choice: और ... आवाज़
  rationale: קוֹל का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है। ‘शब्दों की आवाज़’ मूल की श्रव्य अभिव्यक्ति को बनाए रखती है।
- source_word: מִלִּין
  choice: तुम्हारे शब्दों
  rationale: इस अरामी-प्रभावित बहुवचन का अर्थ ‘शब्द’ है। मूल में संबंधसूचक सर्वनाम नहीं है, पर संदर्भ स्पष्टतः अय्यूब के शब्दों का है; हिन्दी में ‘तुम्हारे’ संबंध को स्वाभाविक बनाता है।
- source_word: אֶשְׁמָע
  choice: मैंने ... सुनी है
  rationale: रूप अपूर्ण क्रिया का है, जिसका अधिक शाब्दिक अनुवाद ‘मैं सुनता हूँ’ हो सकता है; यहाँ पिछली कही हुई बात के श्रवण का संदर्भ होने से पूर्ण पक्ष स्वाभाविक है।
