  text: מַ֭דּוּעַ אֵלָ֣י/ו רִיב֑וֹתָ כִּ֥י כָל דְּ֝בָרָ֗י/ו לֹ֣א יַעֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/033/013.yaml
  text: Why do you contend against him, because he does not answer for all his words?
translation:
  language: hi
  text: तुम उससे क्यों विवाद करते हो—इसलिए कि वह अपनी किसी भी बात का उत्तर नहीं देता?
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רִיבוֹתָ
  choice: विवाद करते हो
  rationale: यह क्रिया झगड़ने, वाद-विवाद करने या किसी के विरुद्ध मुकदमा लड़ने का भाव रखती है; यहाँ परमेश्वर से प्रश्नोत्तर के प्रसंग में ‘विवाद करते हो’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: כִּי
  choice: इसलिए कि
  rationale: इस संदर्भ में कारणसूचक अर्थ सबसे सहज है और प्रश्न की संरचना को स्पष्ट करता है; इब्रानी כִּי कभी विषयसूचक ‘कि’ भी हो सकता है, पर यहाँ कारणसूचक पठन अंग्रेज़ी परामर्श-पाठ और निकट संदर्भ के अनुरूप है।
- source_word: דְּבָרָיו
  choice: अपनी किसी भी बात
  rationale: דָּבָר का अर्थ ‘वचन/बात’ के साथ ‘मामला’ भी हो सकता है। כָל के साथ निषेध को स्वाभाविक हिन्दी में ‘किसी भी’ कहा गया है। प्रत्यय को वाक्य के कर्ता से संबद्ध मानकर ‘अपनी’ चुना गया है।
- source_word: יַעֲנֶה
  choice: उत्तर नहीं देता
  rationale: ענה का सामान्य अर्थ ‘उत्तर देना’ है; ‘लेखा देना’ जैसी अधिक व्याख्यात्मक अभिव्यक्ति से बचा गया है।
theological_decisions:
- issue: क्या परमेश्वर अपने कार्यों का मनुष्य को उत्तर देने के लिए बाध्य है?
  choice: 'पद को एलीहू के प्रश्न के रूप में रखा गया है: मनुष्य परमेश्वर से इसलिए विवाद करता है कि वह अपनी बातों का उत्तर नहीं देता।'
  alternative: इसे स्पष्ट सिद्धांत-वाक्य बनाया जा सकता था कि परमेश्वर अपने किसी काम का लेखा नहीं देता।
  rationale: मूल पाठ प्रश्नात्मक और संक्षिप्त है। ‘लेखा’ या ‘कार्य’ जोड़ने से न्यायिक तथा सिद्धांतगत अर्थ मूल से अधिक निश्चित हो जाता; इसलिए ‘बात’ और ‘उत्तर’ रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरार्थी बहुवचन के बजाय मूल के एकवचन दूसरे पुरुष के अनुरूप ‘तुम’ रखा गया है। डैश कारणसूचक उपवाक्य को प्रश्न से स्वाभाविक रूप से जोड़ता है और मूल की संक्षिप्तता बनाए रखता है।
