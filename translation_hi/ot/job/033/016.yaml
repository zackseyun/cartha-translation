lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण पिछले पदों में स्वप्न और दर्शन के द्वारा परमेश्वर के बोलने के वर्णन को आगे बढ़ाता है।
- source_word: יִגְלֶה אֹזֶן אֲנָשִׁים
  choice: वह मनुष्यों के कान खोलता है
  rationale: गला धातु का मूल भाव खोलना या प्रकट करना है; ‘कान’ के साथ यह सुनने और ग्रहण करने योग्य बनाने का मुहावरा है। सामूहिक एकवचन ‘कान’ को हिन्दी में स्वाभाविक बहुवचन में रखा गया है। אֲנָשִׁים के लिए ‘मनुष्यों’ मूल के मानवीय सामूहिक अर्थ को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וּבְמֹסָרָם
  choice: और उनके लिए दी गई शिक्षा पर
  rationale: מוּסָר में शिक्षा, सुधार, अनुशासन और चेतावनी के परस्पर जुड़े अर्थ संभव हैं। प्रत्यय को स्वाभाविक हिन्दी में ‘उनके लिए दी गई’ से व्यक्त किया गया है; वैकल्पिक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יַחְתֹּם
  choice: मुहर लगाता है
  rationale: חתם का अर्थ मुहर लगाना है। यहाँ रूपक किसी शिक्षा या चेतावनी को मन पर दृढ़ता से अंकित अथवा प्रमाणित करने का भाव रखता है; अनुवाद मूल रूपक को बनाए रखता है।
