translation:
  language: hi
  text: उसका मांस जवानी के दिनों से भी अधिक तरोताज़ा हो जाता है[a]; वह अपनी युवावस्था के दिनों में लौट आता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका मांस बालक के समान फिर से ताज़ा हो जाता है,” अथवा “उसका मांस किसी जवान की अपेक्षा अधिक तरोताज़ा हो जाता है।” इब्रानी क्रिया दुर्लभ है, और जवानी से की गई तुलना को एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह अपनी जवानी के बल वाले दिनों में लौट आता है।” इब्रानी संज्ञा स्वयं युवावस्था या उससे जुड़ी शक्ति का बोध करा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֻטֲפַשׁ
  choice: तरोताज़ा हो जाता है
  rationale: यह दुर्लभ क्रिया फिर से ताज़ा, पुष्ट या हरा-भरा होने का भाव देती है। ‘तरोताज़ा हो जाता है’ शारीरिक नवीकरण के ठोस बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּשָׂרוֹ
  choice: उसका मांस
  rationale: ‘मांस’ इब्रानी शब्द का सीधा समतुल्य है और पद में शारीरिक पुनर्स्थापन के बल को बनाए रखता है; ‘शरीर’ अधिक सहज, पर कुछ कम प्रत्यक्ष विकल्प है।
- source_word: מִנֹּעַר
  choice: जवानी के दिनों से भी अधिक
  rationale: מִן को तुलनात्मक अर्थ में लेकर यह अनुवाद बताता है कि उसका मांस उसकी जवानी की अवस्था से भी अधिक ताज़ा हो जाता है। इब्रानी वाक्यांश के अन्य सम्भव विन्यास को पाद-टिप्पणी में रखा गया है।
- source_word: יָשׁוּב
  choice: वह ... लौट आता है
  rationale: पुल्लिंग एकवचन क्रिया का स्वाभाविक कर्ता वही व्यक्ति है, न कि केवल उसका मांस। ‘लौट आता है’ हिन्दी में पुनः पूर्व दशा प्राप्त करने का भाव सहजता से व्यक्त करता है।
- source_word: לִימֵי
  choice: के दिनों में
  rationale: यह ‘के दिनों की ओर/में’ के इब्रानी मुहावरे को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲלוּמָיו
  choice: अपनी युवावस्था
  rationale: यह संज्ञा युवावस्था और उससे जुड़ी शक्ति—दोनों का संकेत दे सकती है। मुख्य पाठ में ‘युवावस्था’ मूल की व्यापकता बनाए रखता है, जबकि ‘जवानी का बल’ पाद-टिप्पणी में दिया गया है।
