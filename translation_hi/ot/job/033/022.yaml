  yaml_path: translation/ot/job/033/022.yaml
  text: His soul draws near to the pit[b][a], and his life to those who bring death.
translation:
  language: hi
  text: 'उसका प्राण गड्ढे के पास आ पहुँचता है[a],

    और उसका जीवन मृत्यु लाने वालों के पास[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्र” अथवा “विनाश”।
    reason: lexical_alternative
  - marker: b
    text: या “मरे हुओं के पास”; हिब्रू पद कठिन है और उसका संकेत मृत्यु लाने वालों अथवा मृत्यु के क्षेत्र या शक्तियों की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּקְרַב
  choice: निकट पहुँचता है
  rationale: קרב का अर्थ ‘निकट आना/पहुँचना’ है। काव्यात्मक प्रसंग में वर्तमानकाल पीड़ित मनुष्य की सामान्य दशा का स्वाभाविक वर्णन करता है।
- source_word: לַשַּׁחַת
  choice: गड्ढे के निकट
  rationale: שַׁחַת गड्ढे, कब्र या विनाश को सूचित कर सकता है। ‘गड्ढा’ ठोस काव्यात्मक बिंब और मृत्यु-संबंधी निहितार्थ दोनों को बनाए रखता है।
- source_word: נַפְשׁוֹ
  choice: उसका प्राण
  rationale: נֶפֶשׁ का अर्थ प्राण, जीवन, स्वयं या व्यक्ति हो सकता है। ‘प्राण’ अगले चरण के ‘जीवन’ के साथ काव्यात्मक भेद बनाए रखता है, पर किसी कठोर देह-आत्मा सिद्धांत को आरोपित नहीं करता।
- source_word: וְחַיָּתוֹ
  choice: और उसका जीवन
  rationale: यहाँ शब्द जीवित अस्तित्व या जीवन को दर्शाता है। ‘जीवन’ समानांतर पंक्ति में स्वाभाविक और स्पष्ट है।
- source_word: לַמְמִתִים
  choice: मृत्यु लाने वालों के निकट
  rationale: रूप को מות से मृत्यु कराने/लाने वाले सक्रिय बहुवचन कृदंत के रूप में समझा जा सकता है। यह अनुवाद मानवीय हत्यारों तक अर्थ को सीमित किए बिना सक्रिय भाव बचाता है; कठिन वैकल्पिक समझ फुटनोट में दी गई है।
theological_decisions:
- issue: נַפְשׁוֹ और וְחַיָּתוֹ के समानांतर प्रयोग में मानव-स्वरूप का आशय
  choice: दोनों को क्रमशः ‘उसका प्राण’ और ‘उसका जीवन’ अनूदित किया गया है, बिना कठोर देह-आत्मा द्वैत का संकेत दिए।
  alternative: दोनों को अधिक सपाट रूप से ‘उसका जीवन’ और ‘उसका अस्तित्व’ कहना, या ‘प्राण’ को तकनीकी अभौतिक अंग मानना।
  rationale: यह निकटार्थी काव्यात्मक समानांतरता है। शब्दगत भेद सुरक्षित रखा गया है, लेकिन मानव की संरचना के विषय में पद से अधिक निश्चित धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
- issue: לַמְמִתִים की कठिन और अनिश्चित पहचान
  choice: मुख्य पाठ में सक्रिय अर्थ ‘मृत्यु लाने वालों’ रखा गया है।
  alternative: ‘मरे हुओं के निकट’ अथवा मृत्यु के क्षेत्र/शक्तियों के निकट।
  rationale: हिब्रू रूप सक्रिय मृत्युकारक व्यक्तियों या शक्तियों की ओर संकेत कर सकता है, पर पाठ कठिन है; इसलिए अन्य प्रामाणिक संभावनाएँ फुटनोट में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण काव्यात्मक रूप अपनाया गया है। समानांतर पंक्तियों को स्पष्ट रखा गया है। ‘प्राण’ यहाँ तकनीकी दार्शनिक अर्थ में नहीं, जीवन/व्यक्ति के काव्यात्मक संकेत के रूप में प्रयुक्त है।
