  yaml_path: translation/ot/job/033/011.yaml
  text: He puts my feet in the stocks[a]; he watches all my paths.
translation:
  language: hi
  text: 'वह मेरे पाँव काठ की बेड़ी में डाल देता है;

    वह मेरे सभी मार्गों पर नज़र रखता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह मेरे सभी मार्गों की रखवाली करता है।” इब्रानी क्रिया का अर्थ निगरानी करना या रक्षा करना, दोनों हो सकता है; यहाँ प्रसंग सुरक्षा के बजाय कड़ी निगरानी की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֵׂם
  choice: डाल देता है
  rationale: שׂים का मूल अर्थ ‘रखना/डालना’ है। काठ की बेड़ी के साथ ‘डाल देता है’ आधुनिक हिन्दी में स्वाभाविक है और बंधन की ठोस छवि बनाए रखता है।
- source_word: בַּסַּד
  choice: काठ की बेड़ी में
  rationale: סַד पाँवों को रोकने वाले दंडात्मक उपकरण को दर्शाता है। ‘काठ की बेड़ी’ साधारण पाठक के लिए स्पष्ट है और केवल सामान्य लोहे की बेड़ी कहने की अपेक्षा मूल की ठोस छवि को बेहतर सुरक्षित रखता है।
- source_word: רַגְלָי
  choice: मेरे पाँव
  rationale: प्रथम पुरुष एकवचन प्रत्यय वाला रूप दोनों पाँवों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׁמֹר
  choice: नज़र रखता है
  rationale: שׁמר का अर्थ रक्षा करना, पहरा देना या ध्यान से देखना हो सकता है। प्रसंग में ‘नज़र रखता है’ कड़ी निगरानी का भाव देता है, फिर भी मूल क्रिया की कुछ अर्थगत व्यापकता सुरक्षित रखता है।
- source_word: כָּל
  choice: सभी
  rationale: यह समग्रता बताने वाला सामान्य परिमाणवाचक शब्द है और बहुवचन ‘मार्गों’ के साथ स्वाभाविक है।
- source_word: אָרְחֹתָי
  choice: मेरे मार्गों
  rationale: אֹרַח वास्तविक पथ और रूपक रूप में जीवन-चाल, दोनों को व्यक्त कर सकता है। ‘मार्ग’ इस रूपक को बनाए रखता है।
theological_decisions:
- issue: दूसरे चरण में परमेश्वर की सुरक्षात्मक रखवाली या दंडात्मक निगरानी
  choice: दंडात्मक अथवा न्यायिक निगरानी—‘वह मेरे सभी मार्गों पर नज़र रखता है’
  alternative: सुरक्षात्मक रखवाली—‘वह मेरे सभी मार्गों की रखवाली करता है’
  rationale: इस प्रसंग में एलीहू अय्यूब की उस शिकायत को दोहरा रहा है जिसमें परमेश्वर उसे बाँधकर उसके आचरण की कड़ी निगरानी करता है। इसलिए मुख्य पाठ में सुरक्षात्मक अर्थ थोपे बिना निगरानी का भाव रखा गया है; मूल क्रिया का वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘काठ की बेड़ी’ प्राचीन दंड-उपकरण को बिना तकनीकी शब्दावली के स्पष्ट करती है। अर्धविराम इब्रानी काव्य के समानांतर चरणों को दिखाता है। पाद-टिप्पणी-चिह्न उसी पदांश के बाद रखा गया है जिससे अर्थगत विकल्प संबंधित है।
