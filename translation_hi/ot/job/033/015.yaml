  yaml_path: translation/ot/job/033/015.yaml
  text: In a dream[a], a vision of the night, when deep sleep falls on men, in slumbers on the bed,
translation:
  language: hi
  text: 'स्वप्न में, रात के दर्शन में,

    जब मनुष्यों[a] पर गहरी नींद छा जाती है,

    बिस्तर पर ऊँघते समय,'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों पर”; इब्रानी शब्द व्याकरण की दृष्टि से पुल्लिंग है, पर यहाँ सामान्य रूप से मनुष्यों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֲלוֹם
  choice: स्वप्न में
  rationale: בְּ उपसर्ग यहाँ उस अवस्था या माध्यम को सूचित करता है जिसमें दर्शन मिलता है। ‘स्वप्न में’ स्वाभाविक हिंदी है और काव्यात्मक समानांतरता बनाए रखता है।
- source_word: חֶזְיוֹן לַיְלָה
  choice: रात के दर्शन में
  rationale: शाब्दिक अर्थ ‘रात का दर्शन’ है। पूर्ववर्ती ‘स्वप्न में’ के साथ समानांतर रचना स्पष्ट करने के लिए हिंदी में ‘रात के दर्शन में’ चुना गया है।
- source_word: בִּנְפֹל
  choice: जब ... छा जाती है
  rationale: בְּ सहित infinitive construct कालवाचक उपवाक्य बनाता है। नींद के लिए हिंदी में ‘छा जाना’ स्वाभाविक है और मूल के ‘गिरने’ के भाव को मुहावरेदार ढंग से व्यक्त करता है।
- source_word: תַּרְדֵּמָה
  choice: गहरी नींद
  rationale: यह शब्द अत्यंत गहरी नींद को दर्शाता है; ‘गहरी नींद’ सुलभ है और इसे अनावश्यक रूप से समाधि या भावावेश नहीं बनाता।
- source_word: עַל אֲנָשִׁים
  choice: मनुष्यों पर
  rationale: אֲנָשִׁים पुल्लिंग बहुवचन होते हुए यहाँ सामान्य रूप से मानवों के लिए प्रयुक्त है। ‘मनुष्यों’ मूल की मानवीय और सामान्य व्यापकता को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּתְנוּמוֹת
  choice: जब वे ... ऊँघ रहे होते हैं
  rationale: बहुवचन תְּנוּמוֹת उनींदेपन या ऊँघने की अवस्थाओं को व्यक्त करता है। हिंदी में क्रियात्मक रूप अधिक स्वाभाविक है और पद की कालवाचक समानांतरता को स्पष्ट करता है।
- source_word: עֲלֵי מִשְׁכָּב
  choice: बिस्तर पर
  rationale: इसका शाब्दिक भाव ‘शय्या पर’ है। ‘बिस्तर पर’ साधारण आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है; मूल के सामूहिक एकवचन को बनाए रखा गया है।
theological_decisions:
- issue: אֲנָשִׁים का लिंग और सामान्य मानवीय संदर्भ
  choice: मनुष्यों
  alternative: पुरुषों; लोगों
  rationale: संज्ञा व्याकरणतः पुल्लिंग बहुवचन है, पर संदर्भ में उसका अर्थ सामान्य मानव समुदाय है। ‘मनुष्यों’ स्रोत के रूप और समावेशी आशय दोनों को बिना किसी संप्रदायगत व्याख्या के सुरक्षित रखता है; ‘लोगों’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
