    reason: lexical_alternative
lexical_decisions:
- source_word: וְזִהֲמַתּוּ
  choice: घिन करने लगता है
  rationale: זהם यहाँ भोजन के प्रति तीव्र अरुचि या घृणा व्यक्त करता है। हिंदी में ‘घिन करने लगता है’ रोगी की भोजन-विमुखता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַיָּתוֹ
  choice: उसका जी
  rationale: חַיָּה का मूल संबंध जीवन से है, पर इस संदर्भ में व्यक्ति के जीवित स्व या खाने की इच्छा का भाव भी संभव है। ‘जी’ हिंदी में जीवन, मन और खाने की इच्छा के बीच की इस अर्थ-व्याप्ति को कुछ हद तक बनाए रखता है।
- source_word: לָחֶם
  choice: रोटी
  rationale: मूल शब्द का ठोस अर्थ ‘रोटी’ है; इसे बनाए रखने से अगले अर्धपद के व्यापक ‘भोजन’ के साथ काव्यात्मक समानांतरता रहती है।
- source_word: וְנַפְשׁוֹ
  choice: उसका मन
  rationale: נפשׁ व्यक्ति, जीवन, प्राण या इच्छा को सूचित कर सकता है। भोजन से विरक्ति के इस संदर्भ में ‘मन’ सहज हिंदी है और आंतरिक चाह के भाव को व्यक्त करता है, बिना इसे केवल शारीरिक भूख तक सीमित किए।
- source_word: מַאֲכַל
  choice: भोजन
  rationale: यह खाने की वस्तु या भोजन के लिए सामान्य शब्द है; ‘भोजन’ आधुनिक मानक हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: תַּאֲוָה
  choice: लुभावने
  rationale: यह इच्छा या वांछनीयता का भाव देता है। ‘लुभावने भोजन’ उस भोजन को दर्शाता है जो सामान्यतः आकर्षक और मनचाहा हो; ‘उत्तम भोजन’ भी संभव है, पर वह इच्छा के मूल भाव को कम स्पष्ट करता है।
