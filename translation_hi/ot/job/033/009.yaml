base_translation:
  language: en
  yaml_path: translation/ot/job/033/009.yaml
  text: ‘I am pure[a], without transgression; I am clean[b], and there is no iniquity in me.’
translation:
  language: hi
  text: ‘मैं शुद्ध हूँ, अपराध से रहित; मैं निर्दोष[a] हूँ, और मुझमें कोई अधर्म[b] नहीं।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्वच्छ’; इब्रानी शब्द दोष से मुक्त होने के साथ-साथ स्वच्छ होने का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दोष’; इब्रानी शब्द अधर्म, दोष अथवा अपराध-बोध का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זַךְ
  choice: शुद्ध
  rationale: यह नैतिक शुद्धता बताने वाला विधेय विशेषण है। ‘शुद्ध’ आधुनिक हिन्दी में स्वाभाविक है और आगे के חַף से शब्दगत भेद बनाए रखता है।
- source_word: בְּלִי פָשַׁע
  choice: अपराध से रहित
  rationale: בְּלִי अभाव व्यक्त करता है और פֶּשַׁע अपराध, उल्लंघन या विद्रोह का बोध करा सकता है। ‘अपराध से रहित’ इसके नैतिक-कानूनी अर्थ को बिना अनावश्यक संप्रदायगत विस्तार के व्यक्त करता है।
- source_word: חַף
  choice: निर्दोष
  rationale: यह शब्द स्वच्छ अथवा दोष और अपराध-बोध से मुक्त होने का अर्थ दे सकता है। व्यक्ति की आत्मघोषणा के इस संदर्भ में ‘निर्दोष’ स्वाभाविक हिन्दी है; ‘स्वच्छ’ वैकल्पिक बिंब है।
- source_word: עָוֺן
  choice: अधर्म
  rationale: यह शब्द कुटिल कर्म, दोष अथवा उससे उपजे अपराध-बोध को सूचित कर सकता है। ‘अधर्म’ नैतिक भार को सुरक्षित रखता है, जबकि पाद-टिप्पणी ‘दोष’ की वास्तविक अर्थ-संभावना बताती है।
- source_word: לִי
  choice: मुझमें
  rationale: शाब्दिक रूप से ‘मेरे लिए/मुझे’ होने पर भी, यहाँ नैतिक दशा या आरोप के स्वामित्व को हिन्दी में ‘मुझमें कोई अधर्म नहीं’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: एलीहू द्वारा उद्धृत अय्यूब के आत्म-दावे की सीमा
  choice: कथन को नैतिक शुद्धता और निर्दोषता के सीधे, प्रबल दावे के रूप में प्रस्तुत किया गया है।
  alternative: ‘मैं अपने को शुद्ध मानता हूँ’ कहकर दावे को नरम करना, या इसे इब्रानी से आगे बढ़ाकर पूर्ण पापहीनता की धर्मसैद्धांतिक घोषणा बनाना।
  rationale: इब्रानी में बलयुक्त प्रथम-पुरुष विधेय हैं। अनुवाद दावे का तनाव बनाए रखता है, पर यह निर्णय नहीं देता कि एलीहू का उद्धरण कितना सटीक है या अय्यूब का दावा धर्मसैद्धांतिक रूप से सही है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक उद्धरण के अनुरूप शैली। समानार्थी इब्रानी विशेषणों के लिए ‘शुद्ध’ और ‘निर्दोष’ रखकर पुनरुक्ति का प्रभाव बचाया गया है, और अर्थगत अस्पष्टताएँ पाद-टिप्पणियों में सुरक्षित हैं।
