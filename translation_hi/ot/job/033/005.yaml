  text: If you are able[a], answer me; set your case in order before me; take your stand.
translation:
  language: hi
  text: यदि तुम समर्थ हो, तो मुझे उत्तर दो; मेरे सामने अपनी बात क्रम से रखो[a]; अपने को प्रस्तुत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सामने अपने शब्द क्रम से रखो।” इब्रानी क्रिया का अर्थ “क्रम से लगाना” या “व्यवस्थित करना” है; यहाँ इसका संकेत अय्यूब की दलील की ओर या अधिक सामान्य रूप से उसके तैयार उत्तर की ओर हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם תּוּכַל
  choice: यदि तुम कर सको
  rationale: यह शर्त के रूप में दी गई सीधी चुनौती है। यह अनुवाद सामर्थ्य के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֲשִׁיבֵנִי
  choice: मुझे उत्तर दो
  rationale: विवाद-संवाद के प्रसंग में हिफ़ील रूप का अर्थ प्रत्युत्तर देना है; ‘उत्तर दो’ संक्षिप्त और स्वाभाविक है।
- source_word: עֶרְכָה
  choice: अपनी बात क्रम से रखो
  rationale: ערך का मूल भाव व्यवस्थित करना या क्रम से लगाना है। इब्रानी में कर्म व्यक्त नहीं है; ‘अपनी बात’ प्रसंगानुकूल पूर्ति है, जबकि ‘अपने शब्द’ की अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह वक्ता की उपस्थिति में अपना उत्तर प्रस्तुत करने का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הִתְיַצָּבָה
  choice: अपना स्थान लेकर खड़े हो जाओ
  rationale: हित्पएल आज्ञार्थक रूप स्वयं को स्थित करने और सामना करने के लिए खड़े होने का भाव देता है। यह अनुवाद केवल उठ खड़े होने से अधिक, तैयार होकर सामने खड़े होने की छाया बनाए रखता है।
theological_decisions:
- issue: वाद-विवाद या न्यायालय-सदृश भाव को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘अपनी बात’ रखा गया, पर ‘मुकदमा’ या ‘अपना पक्ष सिद्ध करो’ नहीं जोड़ा गया
  alternative: ‘अपना पक्ष क्रम से प्रस्तुत करो’
  rationale: प्रसंग में तर्क या पक्ष प्रस्तुत करने का भाव संभव है, लेकिन इब्रानी क्रिया स्वयं किसी मुकदमे या औपचारिक पक्ष को स्पष्ट रूप से नहीं कहती। इसलिए अनुवाद उस अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘तुम’ मूल पाठ के एकवचन सीधे संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है। अर्धविरामों से पद की तीन क्रमिक चुनौतियाँ स्पष्ट रहती हैं।
