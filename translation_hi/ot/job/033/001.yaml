  text: But now[a], Job, please hear my words, and listen to all my speech.
translation:
  language: hi
  text: पर अब, अय्यूब, कृपया मेरी बातें सुनो, और मेरी सारी बातों पर ध्यान दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: पर अब
  rationale: यह एलीहू के कथन में एक स्पष्ट संक्रमण सूचित करता है; ‘पर अब’ विरोध और नए आग्रह—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁמַע־נָא
  choice: कृपया … सुन
  rationale: आज्ञार्थक क्रिया के साथ נָא विनम्र अनुरोध बनाता है; ‘कृपया’ आधुनिक, सहज और सम्मानपूर्ण है।
- source_word: אִיּוֹב
  choice: अय्यूब
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप।
- source_word: מִלָּי
  choice: मेरी बातें
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित बहुवचन संज्ञा का सीधा और स्वाभाविक रूप।
- source_word: וְכָל־דְּבָרַי
  choice: और मेरी सारी वाणी
  rationale: כָל की समग्रता बनाए रखते हुए דְּבָרַי को सामूहिक अर्थ में ‘वाणी’ कहा गया है, जिससे निकट-समानांतर संज्ञाओं का हल्का अंतर भी बना रहता है।
- source_word: הַאֲזִינָה
  choice: कान लगा
  rationale: हिफ़िल आज्ञार्थक attentive hearing का भाव देता है; ‘कान लगा’ पहले ‘सुन’ की अपेक्षा अधिक ध्यानपूर्वक सुनने का स्वाभाविक हिन्दी संकेत है।
