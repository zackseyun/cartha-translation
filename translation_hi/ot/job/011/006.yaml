source:
  edition: WLC
  text: וְ/יַגֶּד לְ/ךָ֨ תַּֽעֲלֻמ֣וֹת חָכְמָה֮ כִּֽי כִפְלַ֪יִם לְֽ/ת֫וּשִׁיָּ֥ה וְ/דַ֡ע כִּֽי יַשֶּׁ֥ה לְ/ךָ֥ אֱ֝ל֗וֹהַ מֵ/עֲוֺנֶֽ/ךָ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/006.yaml
  text: and would tell you the hidden things of wisdom[a], for sound wisdom has two sides. Know, then[c][b], that God has overlooked some of your iniquity.
translation:
  language: hi
  text: और वह तुम्हें बुद्धि की गुप्त बातें[a] बताए—क्योंकि खरी बुद्धि के दो पहलू हैं। तब जान लो कि परमेश्वर तुम्हारे कुछ अधर्म को अनदेखा कर देता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुद्धि के रहस्य।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी क्रिया का अर्थ अनिश्चित है। अन्य संभव अनुवाद हैं: “परमेश्वर तुम्हारे कुछ अधर्म को भूल गया है,” या “परमेश्वर तुम्हें तुम्हारे दोष के योग्य दंड से कम दंड देता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְיַגֶּד לְךָ
  choice: और वह तुम्हें ... बताए
  rationale: नגד के हिफ़ील रूप का अर्थ ‘बताना/प्रकट करना’ है। पिछले पद की कामनात्मक संरचना के कारण यहाँ साधारण भविष्य नहीं, बल्कि उसी इच्छा की निरंतरता व्यक्त की गई है।
- source_word: תַּעֲלֻמוֹת חָכְמָה
  choice: बुद्धि की गुप्त बातें
  rationale: תעלמות छिपी या गुप्त बातों का बहुवचन है; यह चयन ठोस बहुवचन और ‘बुद्धि’ के साथ संबंध दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: כִפְלַיִם לְתוּשִׁיָּה
  choice: खरी बुद्धि के दो पहलू हैं
  rationale: כפלים में द्वित्व का भाव है और תושיה प्रभावी, ठोस या खरी बुद्धि को दर्शाता है। ‘दो पहलू’ शाब्दिक ‘दुगुनी’ की अपेक्षा इस कठिन मुहावरे की बहुपक्षीयता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְדַע
  choice: तब जान लो
  rationale: ידע का आज्ञार्थक रूप है। ‘तब’ पिछले कथन से निकलने वाले निष्कर्ष को सहज रूप से जोड़ता है।
- source_word: יַשֶּׁה לְךָ ... מֵעֲוֺנֶךָ
  choice: तुम्हारे कुछ अधर्म को अनदेखा कर देता है
  rationale: נשה यहाँ कठिन और संदिग्ध है; उसका मूल भाव ‘भूलना’ हो सकता है, पर संदर्भ में सोफ़र का आशय है कि परमेश्वर अय्यूब के पूरे अपराध का दंड नहीं ले रहा। ‘अनदेखा कर देता है’ इस संदर्भगत अर्थ को व्यक्त करता है, जबकि पादटिप्पणी अन्य संभावनाएँ सुरक्षित रखती है।
- source_word: אֱלוֹהַ
  choice: परमेश्वर
  rationale: यह ‘ईश्वर/परमेश्वर’ के लिए प्रयुक्त एकवचन काव्यात्मक रूप है; इसमें ‘सर्वशक्तिमान’ जोड़ने का आधार नहीं है।
- source_word: עֲוֺנֶךָ
  choice: तुम्हारे ... अधर्म
  rationale: עון अधर्म, दोष या दोष के परिणाम का अर्थ दे सकता है। सोफ़र के नैतिक आरोप के संदर्भ में ‘अधर्म’ उपयुक्त गंभीरता बनाए रखता है।
theological_decisions:
- issue: अय्यूब के साथ परमेश्वर के व्यवहार के विषय में सोफ़र का दावा
  choice: परमेश्वर अय्यूब के कुछ अधर्म को अनदेखा कर रहा है, अर्थात उससे पूरा लेखा नहीं ले रहा
  alternative: परमेश्वर ने तुम्हारे कुछ अधर्म को भुला दिया है; अथवा परमेश्वर तुम्हारे दोष के योग्य दंड से कम दंड लेता है
  rationale: इब्रानी क्रिया कठिन है, पर प्रसंग सोफ़र के इस आरोप का समर्थन करता है कि अय्यूब को उसके योग्य दंड से कम मिला है। अनुवाद इसे सोफ़र के कथन के रूप में प्रस्तुत करता है, उसकी धर्मवैज्ञानिक धारणा का स्वतः अनुमोदन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण काव्यात्मक गद्य रखा गया है। ‘खरी बुद्धि’ תושיה को सामान्य पाठक के लिए बोधगम्य बनाती है और ‘दो पहलू’ कठिन द्वित्व-मुहावरे को बिना अत्यधिक व्याख्या के व्यक्त करता है।
