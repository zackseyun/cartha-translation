  text: If he passes by and shuts someone in[a], and calls an assembly[b], then who can turn him back?
translation:
  language: hi
  text: यदि वह गुज़र जाए और किसी को बन्दी कर दे[a], और सभा बुलाए[b], तो उसे कौन वापस मोड़ सकता है?[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बन्दी कर दे’ का अर्थ ‘बन्द कर दे,’ ‘कैद कर दे,’ या ‘सौंप दे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सभा बुलाए’ का अनुवाद ‘इकट्ठा करे’ या ‘सभा आयोजित करे’ भी हो सकता है; इसमें न्यायिक सभा का भाव सम्भव है।
    reason: lexical_alternative
  - marker: c
    text: ‘उसे कौन वापस मोड़ सकता है?’ का अर्थ ‘उसके किए को कौन पलट सकता है?’ भी समझा जा सकता है। इब्रानी में अंतिम प्रत्यय को व्यक्तिगत या अधिक अमूर्त ढंग से समझने की संभावना है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त या काल्पनिक स्थिति प्रस्तुत करता है; ‘यदि’ इब्रानी की शर्तसूचक शक्ति को बनाए रखता है।
- source_word: יַחֲלֹף
  choice: वह आगे बढ़कर
  rationale: חלף के ‘गुज़रना/आगे बढ़ना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और विनाश का अनावश्यक भाव नहीं जोड़ता।
- source_word: וְיַסְגִּיר
  choice: किसी को बन्द कर दे
  rationale: סגר के हिफ़ील रूप में बन्द करने, सौंप देने या कैद करने का भाव हो सकता है। ‘किसी को बन्द कर दे’ ठोस बिंब रखता है और इब्रानी में निहित कर्म को सहज ढंग से व्यक्त करता है।
- source_word: וְיַקְהִיל
  choice: सभा बुलाए
  rationale: קהל के हिफ़ील रूप का अर्थ इकट्ठा करना या सभा बुलाना है; यह causative और सम्भावित सार्वजनिक अथवा न्यायिक भाव दोनों रखता है।
- source_word: וּמִי
  choice: तो कौन
  rationale: संयोजक और प्रश्नवाचक का परिणामसूचक, आलंकारिक बल स्वाभाविक हिन्दी में प्रकट होता है।
- source_word: יְשִׁיבֶנּוּ
  choice: उसे रोककर लौटा सकता है
  rationale: שוב के हिफ़ील और पुल्लिंग एकवचन प्रत्यय का व्यक्तिगत अर्थ बनाए रखता है। ‘रोककर लौटा’ प्रसंग में किसी के कार्य को निष्फल करने का भाव स्पष्ट करता है, बिना उसे केवल अमूर्त ‘उलटना’ मान लेने के।
theological_decisions:
- issue: पुल्लिंग एकवचन क्रियाओं और अंतिम प्रत्यय का संकेत
  choice: कर्ता परमेश्वर समझा गया है और अंतिम प्रत्यय को व्यक्तिगत रूप में ‘उसे’ रखा गया है।
  alternative: अंतिम प्रत्यय को अधिक अमूर्त रूप में ‘इसे’ समझा जा सकता है—अर्थात उसके किए को कौन पलट सकता है?
  rationale: निकटवर्ती प्रसंग परमेश्वर के ज्ञान और अप्रतिरोध्य कार्य की बात करता है। फिर भी इब्रानी प्रत्यय की सम्भावित अमूर्त व्याख्या को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘बन्द’ का वर्तनी-रूप औपचारिक मानक के अनुरूप है। मुख्य पाठ में व्यक्तिगत प्रत्यय रखा गया है; अंतिम क्रिया का वैकल्पिक अमूर्त अर्थ धर्मवैचारिक निर्णय के अंतर्गत दर्ज है।
