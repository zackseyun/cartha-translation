  text: אִם אַ֭תָּ֗ה הֲכִינ֣וֹתָ לִבֶּ֑/ךָ וּ/פָרַשְׂתָּ֖ אֵלָ֣י/ו כַּפֶּֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/013.yaml
  text: If you prepare your heart and stretch out your hands to him,[a]
translation:
  language: hi
  text: यदि तुम अपने हृदय को तैयार करोगे और उसकी ओर अपने हाथ फैलाओगे,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी हथेली उसकी ओर फैलाओ।” इब्रानी में “हथेली/हाथ” एकवचन है, पर यह अभिव्यक्ति सामान्यतः प्रार्थना में हाथ फैलाने की मुद्रा को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह आगे आने वाले परिणाम से जुड़ी शर्त आरम्भ करता है; ‘यदि’ उस शर्त को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: अय्यूब के लिए प्रयुक्त द्वितीय पुरुष एकवचन को आधुनिक मानक हिन्दी में स्वाभाविक और सम्मानपूर्ण ढंग से व्यक्त करता है।
- source_word: הֲכִינוֹתָ
  choice: तैयार करो
  rationale: हिफ़ील रूप किसी वस्तु को दृढ़, तत्पर या ठीक दिशा में लगाने का भाव रखता है। ‘तैयार करो’ हृदय के साथ इस व्यापक भाव को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: לִבֶּךָ
  choice: अपने हृदय को
  rationale: इब्रानी ‘हृदय’ विचार, इच्छा और समूचे भीतरी मनुष्य को समेट सकता है। ‘हृदय’ मूल रूपक को बनाए रखता है और अर्थ को केवल बुद्धि तक सीमित नहीं करता।
- source_word: וּפָרַשְׂתָּ
  choice: और ... फैलाओ
  rationale: क्रिया फैलाने या आगे बढ़ाने का भाव देती है और प्रार्थना में हाथ फैलाने की मुद्रा के लिए स्वाभाविक है।
- source_word: אֵלָיו
  choice: उसकी ओर
  rationale: पूर्वसर्ग दिशा का बोध कराता है। ‘उसकी ओर’ मूल सर्वनाम को बनाए रखता है और संदर्भ से परमेश्वर की ओर संकेत समझ में आता है।
- source_word: כַּפֶּךָ
  choice: अपने हाथ
  rationale: संज्ञा रूप में एकवचन ‘हथेली/हाथ’ है, पर प्रार्थना की इस मुद्रा के लिए हिन्दी में बहुवचन ‘हाथ फैलाना’ अधिक स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֵלָיו में सर्वनाम का संदर्भ
  choice: मूल सर्वनाम को ‘उसकी ओर’ के रूप में रखा गया है; संदर्भ में इसका संकेत परमेश्वर की ओर है।
  alternative: स्पष्ट करके ‘परमेश्वर की ओर’ कहना।
  rationale: संदर्भ परमेश्वर से प्रार्थना की ओर संकेत करता है, पर मूल पाठ यहाँ संज्ञा नहीं बल्कि सर्वनाम रखता है। सर्वनाम बनाए रखने से अनावश्यक स्पष्टता नहीं जोड़ी जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण संबोधन ‘तुम’ अपनाया गया है। वाक्य को अल्पविराम पर खुला रखा गया है, क्योंकि यह शर्त अगले पद में आगे बढ़ती है।
