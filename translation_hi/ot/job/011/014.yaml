    rationale: Marker a is attached after “दूर कर दे,” though its note concerns the first conditional expression; marker b is attached after “न दे,” though its note concerns “डेरों में.”
  - severity: low
    issue: The cultural footnote changes the addressee from second person to third person.
    rationale: “उसके घर-परिवार” should be “तेरे घर-परिवार” to match the verse’s direct singular address.
