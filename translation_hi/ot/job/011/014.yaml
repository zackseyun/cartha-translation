  naturalness: The sentence is clear and appropriately dignified. Moving each footnote marker to the expression it explains improves readability and anchor accuracy. The cultural note should retain the verse’s second-person address rather than shift to “उसके.”
  terminology: Use “अधर्म” for אָוֶן and “अन्याय” for עַוְלָה. These are related moral terms without imposing a technical distinction, and they preserve the Hebrew poetic parallelism.
  issues:
  - severity: medium
    issue: “अनर्थ” is not the safest primary rendering of אָוֶן here.
    rationale: Although it can refer broadly to harmful evil, in current Hindi it commonly denotes misfortune or disaster. In this exhortation, reinforced by parallel עַוְלָה, the ethical sense of wrongful conduct is primary.
  - severity: low
