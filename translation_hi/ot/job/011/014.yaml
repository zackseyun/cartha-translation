  yaml_path: translation/ot/job/011/014.yaml
  text: If iniquity is in your hand[a], put it far away[b], and do not let injustice dwell in your tents.
translation:
  language: hi
  text: यदि तेरे हाथ में अधर्म[a] है, तो उसे दूर कर दे, और अपने डेरों[b] में अन्याय को बसने न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तेरे हाथ में दुष्टता है, तो उसे हटा दे।”
    reason: lexical_alternative
  - marker: b
    text: “तेरे डेरों में” का आशय तेरे घर-परिवार और घरेलू जीवन के क्षेत्र से भी है।
    reason: cultural_note
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्तसूचक उपवाक्य आरम्भ करता है; आधुनिक गरिमापूर्ण हिन्दी में ‘यदि’ स्वाभाविक है।
- source_word: אָוֶן
  choice: अनर्थ
  rationale: यह शब्द दुष्टता, बुराई, हानिकारक कर्म या विपत्ति का बोध करा सकता है। नैतिक उपदेश के इस संदर्भ में ‘अनर्थ’ नैतिक बुराई और हानि—दोनों की छाया बनाए रखता है।
- source_word: בְּיָדְךָ
  choice: तेरे हाथ में
  rationale: इब्रानी बिंब को सुरक्षित रखते हुए यह किसी के किए, अधिकार या नियंत्रण में होने का संकेत देता है।
- source_word: הַרְחִיקֵהוּ
  choice: उसे दूर कर दे
  rationale: हिफ़ील आज्ञार्थक रूप सक्रिय रूप से दूर हटाने की माँग करता है; यह अनुवाद कारणवाचक बल और दूरी, दोनों को व्यक्त करता है।
- source_word: וְאַל
  choice: और ... न दे
  rationale: संयोजक के साथ निषेधात्मक आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַּשְׁכֵּן
  choice: बसने न दे
  rationale: मूल क्रिया का अर्थ बसना या निवास करना है; प्रसंग में इसका भाव किसी वस्तु को रहने की अनुमति न देना है।
- source_word: בְּאֹהָלֶיךָ
  choice: अपने डेरों में
  rationale: मूल का बहुवचन और प्राचीन घरेलू परिवेश दोनों सुरक्षित रहते हैं; यहाँ यह व्यापक घरेलू जीवन का भी संकेत है।
- source_word: עַוְלָה
  choice: अन्याय
  rationale: यह टेढ़ेपन, अनुचित आचरण या अन्याय का नैतिक अर्थ देता है और पहले पद के ‘अनर्थ’ से संबंधित किंतु अलग शब्दावली बनाए रखता है।
theological_decisions:
- issue: काव्यात्मक समानांतरता में नैतिक शब्दावली
  choice: אָוֶן के लिए ‘अनर्थ’ और עַוְלָה के लिए ‘अन्याय’—दो संबंधित पर अलग शब्द
  alternative: दोनों के लिए एक ही शब्द ‘बुराई’ या ‘दुष्टता’
  rationale: इब्रानी पद में निकटार्थक नैतिक शब्द काव्यात्मक समानांतरता बनाते हैं। अलग किंतु संबंधित हिन्दी शब्द उस शैली को बचाते हैं, बिना दोनों के बीच कोई कठोर तकनीकी धर्मवैज्ञानिक भेद गढ़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; एकवचन संबोधन के लिए काव्यात्मक और प्रसंगानुकूल ‘तेरा’ रखा गया है। भाषा सरल, गरिमापूर्ण और मूल इब्रानी बिंबों के निकट है।
