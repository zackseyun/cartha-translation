  language: hi
  text: 'क्या बहुत-सी बातें अनुत्तरित रहेंगी?


    और क्या बहुत बोलनेवाला मनुष्य सही ठहरेगा?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “होंठों का मनुष्य।” यह हिब्रू मुहावरा ऐसे व्यक्ति को दर्शाता है जिसकी पहचान बोलने से होती है, सम्भवतः बहुत अधिक या खोखली बातें करनेवाले को।
    reason: शाब्दिक मुहावरे तथा उसके सम्भावित निंदात्मक संकेत को सुरक्षित रखना।
