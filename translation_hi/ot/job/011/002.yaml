  choice: बहुत-सी बातें
  rationale: यह रֹב और דְּבָרִים के संयोग में निहित वचनों की बहुतायत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और प्रसंग में अत्यधिक बोलने का संकेत बनाए रखता है।
- source_word: לֹא יֵעָנֶה
  choice: अनुत्तरित रह जाएँगी
  rationale: निफ़अल रूप के निष्क्रिय अर्थ ‘उत्तर न दिया जाना’ को प्रवाहपूर्ण हिन्दी में व्यक्त करता है और आलंकारिक प्रश्न की धार बनाए रखता है।
- source_word: וְאִם
  choice: क्या
  rationale: काव्यात्मक समानांतर आलंकारिक प्रश्न में यह दूसरे प्रश्न का स्वाभाविक हिन्दी आरम्भ है; हिब्रू संयोजक का संबंध पंक्तियों की निकट समानांतरता से प्रकट होता है।
- source_word: אִישׁ שְׂפָתַיִם
  choice: केवल बोलनेवाला मनुष्य
  rationale: शाब्दिक ‘होंठों का मनुष्य’ हिन्दी में अस्पष्ट और अस्वाभाविक होता। यह चयन वाणी से पहचाने जानेवाले व्यक्ति का मुहावरेदार भाव देता है; ‘केवल’ प्रसंगगत निंदात्मक संकेत को सामने लाता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: יִצְדָּק
  choice: सही ठहरेगा
  rationale: क़ाल रूप के मूल्यांकनात्मक/न्यायिक भाव—सही या पक्ष में सिद्ध ठहरना—को स्पष्ट करता है और ‘धर्मी’ अथवा ‘धर्मी ठहराया जाना’ से जुड़ सकनेवाले अनावश्यक पारिभाषिक धर्मवैज्ञानिक अर्थ से बचता है।
