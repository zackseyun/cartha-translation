base_translation:
  language: en
  yaml_path: translation/ot/job/011/016.yaml
  text: For you will forget your misery[a]; you will remember it as waters that have passed by.
translation:
  language: hi
  text: क्योंकि तुम अपना दुःख भूल जाओगे; तुम उसे बीत चुके पानी की तरह याद करोगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उसे केवल उस पानी की तरह याद करोगे जो बहकर निकल गया है।” इब्रानी चित्र में पहले का दुःख ऐसे पानी के समान है जो अब बीत चुका है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन में दी गई आशा का कारण या स्पष्टीकरण प्रस्तुत करता है; इसलिए हिन्दी में कारणसूचक ‘क्योंकि’ स्वाभाविक है।
- source_word: אַתָּה
  choice: तुम
  rationale: स्पष्ट द्वितीय पुरुष एकवचन सर्वनाम को बनाए रखने से मूल का बल सुरक्षित रहता है।
- source_word: עָמָל
  choice: दुःख
  rationale: यहाँ शब्द परिश्रम मात्र नहीं, बल्कि झेले हुए कष्ट और विपत्ति को दर्शाता है; ‘दुःख’ आधुनिक हिन्दी में व्यापक और स्वाभाविक है।
- source_word: תִּשְׁכָּח
  choice: भूल जाओगे
  rationale: संदर्भ में अपूर्ण क्रिया का भावी अर्थ है; संयुक्त क्रिया हिन्दी में पूर्णतः पीछे छूट जाने का भाव सहज रूप से व्यक्त करती है।
- source_word: כְמַיִם
  choice: जैसे ... पानी
  rationale: כְ तुलना को दर्शाता है। ‘पानी’ हिन्दी में सामान्यतः द्रव्यवाचक एकवचन रूप में अधिक स्वाभाविक है, जबकि जल की गतिशील काव्यात्मक छवि बनी रहती है।
- source_word: עָבְרוּ
  choice: बहकर निकल गया
  rationale: עבר का मूल भाव पार हो जाने या निकल जाने का है; पानी के संदर्भ में ‘बहकर’ निहित चित्र को स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘निकल गया’ उसके बीत चुकने को दर्शाता है।
- source_word: תִזְכֹּר
  choice: तुम उसे ... याद करोगे
  rationale: मूल में कर्म व्यक्त नहीं है, पर वह पूर्वोक्त दुःख है। हिन्दी की स्पष्टता के लिए ‘उसे’ जोड़ा गया है, बिना अर्थ को बदलने के।
theological_decisions:
- issue: भूलने और याद करने का प्रत्यक्ष तनाव
  choice: 'दोनों क्रियाओं को बनाए रखते हुए दूसरी पंक्ति को उपमा के रूप में प्रस्तुत किया गया है: दुःख याद तो होगा, पर बीत चुके पानी की तरह।'
  alternative: दूसरी पंक्ति को ‘उसे केवल बह गए पानी की तरह याद करोगे’ कहकर ‘केवल’ के माध्यम से तनाव को स्पष्ट करना।
  rationale: इब्रानी में ‘केवल’ नहीं है। इसलिए काव्यात्मक तनाव और वास्तविक अस्पष्टता को सुरक्षित रखते हुए उसकी व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। ‘दुःख’ सामान्य पाठक के लिए स्पष्ट है, और ‘बहकर निकल गया पानी’ मूल उपमा की गति तथा उसके बीत जाने—दोनों को व्यक्त करता है।
