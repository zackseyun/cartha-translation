  yaml_path: translation/ot/job/011/009.yaml
  text: Its measure is longer than the earth and broader than the sea[a].
translation:
  language: hi
  text: उसकी माप पृथ्वी से भी लंबी और समुद्र से भी चौड़ी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसका विस्तार पृथ्वी से भी लंबा और समुद्र से भी चौड़ा है।’
    reason: מִדָּה का अर्थ ‘माप’ के साथ-साथ ‘विस्तार’ भी हो सकता है।
lexical_decisions:
- source_word: אֲרֻכָּה
  choice: लंबी
  rationale: यह स्त्रीलिंग विशेषण מִדָּהּ (‘उसकी माप’) के अनुरूप है। तुलना का भाव ‘पृथ्वी से भी लंबी’ द्वारा स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵאֶרֶץ
  choice: पृथ्वी से भी
  rationale: यहाँ מִן अलगाव नहीं, तुलना दर्शाता है। ‘समुद्र’ के समानांतर विश्वव्यापी चित्र के कारण אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है।
- source_word: מִדָּהּ
  choice: उसकी माप
  rationale: מִדָּה का ठोस अर्थ ‘माप’ है। ‘उसकी’ मूल के स्त्रीलिंग एकवचन प्रत्यय को बनाए रखता है और उसके संदर्भ को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: וּרְחָבָה
  choice: और ... चौड़ी
  rationale: यह स्त्रीलिंग विशेषण पहले खंड के ‘लंबी’ के समानांतर है; हिन्दी में ‘समुद्र से भी चौड़ी’ तुलनात्मक अर्थ को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: מִנִּי יָם
  choice: समुद्र से भी
  rationale: מִנִּי काव्यात्मक तुलनात्मक रूप है और יָם का सीधा अर्थ ‘समुद्र’ है; इससे मूल बिंब और समानांतरता सुरक्षित रहते हैं।
theological_decisions:
- issue: ‘उसकी’ का पूर्वपद
  choice: सर्वनाम ‘उसकी’ को बिना स्पष्ट संज्ञा जोड़े रखा गया
  alternative: ‘परमेश्वर की बुद्धि की माप’ अथवा ‘उस ज्ञान का विस्तार’
  rationale: मूल पद में 3 स्त्रीलिंग एकवचन प्रत्यय है और उसका पूर्वपद प्रसंग से समझा जाता है। किसी एक व्याख्यात्मक संज्ञा को पाठ में जोड़ना मूल की संदर्भगत खुलावट को अनावश्यक रूप से सीमित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक समानांतरता वाला रूप। ‘से भी’ हिन्दी में तुलना को स्वाभाविक बनाता है; पाठ में कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी गई।
