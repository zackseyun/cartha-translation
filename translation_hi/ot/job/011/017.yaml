  yaml_path: translation/ot/job/011/017.yaml
  text: And your lifetime will rise brighter than noon[a]; though there is darkness[c][b], it will become like the morning.
translation:
  language: hi
  text: और तुम्हारा जीवन दोपहर से भी अधिक उज्ज्वल हो उठेगा[a]; भले ही अँधेरा हो[b], वह सुबह के समान हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा जीवन दोपहर से अधिक उज्ज्वल होगा; अँधेरा सुबह के समान हो जाएगा।” इब्रानी कविता की अभिव्यक्ति संक्षिप्त है। ‘जीवन’ के लिए प्रयुक्त शब्द का अर्थ ‘जीवनकाल’ या व्यापक रूप से ‘सांसारिक अस्तित्व’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: '‘अँधेरा’ के लिए प्रयुक्त इब्रानी शब्द दुर्लभ और अर्थ की दृष्टि से अनिश्चित है; इसके अर्थ ‘घना अँधेरा,’ ‘धुँधलापन’ या ‘विषाद’ भी लिए गए हैं। दूसरी पंक्ति का अनुवाद यह भी हो सकता है: “और अँधेरा सुबह के समान हो जाएगा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִצָּהֳרַיִם
  choice: दोपहर से भी अधिक उज्ज्वल
  rationale: מִן को यहाँ तुलना के अर्थ में लेना प्रसंगानुकूल है। क्रिया में प्रकाश का भाव प्रत्यक्ष नहीं है, पर दोपहर और सुबह की समानांतर प्रकाश-छवियों से वह निहित है।
- source_word: יָקוּם
  choice: होगा
  rationale: शाब्दिक अर्थ ‘उठेगा’ है, किंतु जीवन के दोपहर से अधिक उज्ज्वल होने की हिंदी अभिव्यक्ति में ‘होगा’ स्वाभाविक है; ‘उठेगा’ हिंदी में अस्पष्ट और असहज होता।
- source_word: חָלֶד
  choice: तुम्हारा जीवन
  rationale: यह शब्द जीवनकाल, जीवन या सांसारिक अस्तित्व को सूचित कर सकता है। ‘तुम्हारा जीवन’ आधुनिक हिंदी में स्वाभाविक है और मूल की अर्थ-सीमा को अत्यधिक संकुचित नहीं करता।
- source_word: תָּעֻפָה
  choice: यदि अँधेरा भी हो
  rationale: यह दुर्लभ और अनिश्चित पद है, जिसे अँधेरा, धुँधलापन या विषादपूर्ण अंधकार समझा गया है। शर्तसूचक रूप काव्यगत विरोध को स्वाभाविक हिंदी में व्यक्त करता है, पर अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: כַּבֹּקֶר
  choice: सुबह के समान
  rationale: כ की उपमा और בֹּקֶר के सामान्य अर्थ ‘सुबह’ को सीधे बनाए रखा गया है।
- source_word: תִּהְיֶה
  choice: हो जाएगा
  rationale: היה मूलतः ‘होना’ है; यहाँ अँधेरे से सुबह जैसी दशा में परिवर्तन का भाव होने के कारण ‘हो जाएगा’ सहज है।
