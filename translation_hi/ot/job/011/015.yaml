  text: क्योंकि तब तू निष्कलंक होकर अपना मुख ऊँचा उठाएगा[a]; तू दृढ़ रहेगा[b] और नहीं डरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तू बिना लज्जा के सिर ऊँचा कर सकेगा।’ इब्रानी में शाब्दिक रूप से ‘दोष या दाग के बिना अपना मुख उठाएगा’ है; इसमें आत्मविश्वास और अपमान से मुक्ति का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तू सुरक्षित रहेगा’ अथवा ‘मज़बूती से स्थापित रहेगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי אָז
  choice: क्योंकि तब
  rationale: यह पद पिछले कथन में रखी गई शर्त के परिणाम को बताता है; ‘क्योंकि तब’ कारणात्मक और परिणामसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִּשָּׂא פָנֶיךָ
  choice: अपना मुख ऊँचा उठाएगा
  rationale: इब्रानी मुहावरे के ‘मुख उठाने’ वाले चित्र को सुरक्षित रखते हुए यह पुनः प्राप्त आत्मविश्वास और लज्जा से मुक्ति का भाव देता है।
- source_word: מִמּוּם
  choice: निष्कलंक होकर
  rationale: מוּם का मूल अर्थ दोष या दाग है। यहाँ इसका प्रयोग रूपक रूप में है; ‘निष्कलंक’ मूल शब्द-चित्र को बनाए रखता है, जबकि संदर्भ में अपमान या लज्जा से मुक्त होने का भाव भी संभव है।
- source_word: וְהָיִיתָ מֻצָק
  choice: तू दृढ़ बना रहेगा
  rationale: מֻצָק दृढ़, स्थिर या मजबूती से स्थापित अवस्था को दर्शाता है। ‘दृढ़ बना रहेगा’ परिणामस्वरूप स्थिरता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא תִירָא
  choice: और नहीं डरेगा
  rationale: यह ירא की सीधी भविष्यकालीन निषेधात्मक अभिव्यक्ति है और काव्यात्मक पंक्ति में संक्षिप्त तथा स्वाभाविक है।
