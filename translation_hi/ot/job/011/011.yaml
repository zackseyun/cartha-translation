id: JOB.11.11
reference: Job 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי ה֭וּא יָדַ֣ע מְתֵי שָׁ֑וְא וַ/יַּרְא אָ֝֗וֶן וְ/לֹ֣א יִתְבּוֹנָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/011.yaml
  text: For he knows men of falsehood; when he sees wickedness[a], does he not take notice?
translation:
  language: hi
  text: क्योंकि वह झूठे मनुष्यों को जानता है; जब वह दुष्टता देखता है, तो क्या वह उस पर ध्यान नहीं देता?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह उस पर ध्यान नहीं देता।” इब्रानी का अंतिम वाक्यांश साधारण नकारात्मक कथन के रूप में पढ़ा जा सकता है, पर संदर्भ अलंकारिक प्रश्न—“क्या वह उस पर ध्यान नहीं देता?”—के पक्ष में है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद सोपर के पिछले कथन का आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ तर्क-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: वह
  rationale: संदर्भ में सर्वनाम परमेश्वर के लिए है; इब्रानी में सर्वनाम पर कोई विशेष आदरसूचक चिह्न नहीं है।
- source_word: יָדַע
  choice: जानता है
  rationale: कालरूप यहाँ परमेश्वर के स्थायी और सामान्य ज्ञान को व्यक्त करता है, इसलिए हिन्दी का सामान्य वर्तमान काल उपयुक्त है।
- source_word: מְתֵי שָׁוְא
  choice: झूठे मनुष्यों
  rationale: यह पदबंध ऐसे लोगों को सूचित करता है जिनमें झूठ, छल या खोखलापन है। ‘झूठे मनुष्य’ नैतिक अर्थ को स्पष्ट रखते हुए हिन्दी में सहज है; ‘निकम्मे मनुष्य’ अधिक व्याख्यात्मक और अपमानसूचक होता।
- source_word: וַיַּרְא
  choice: जब वह ... देखता है
  rationale: वाव-युक्त क्रिया को अगले अलंकारिक प्रश्न से जोड़ते हुए कालवाचक उपवाक्य बनाना हिन्दी में स्वाभाविक है और अर्थक्रम सुरक्षित रखता है।
- source_word: אָוֶן
  choice: दुष्टता
  rationale: यहाँ शब्द नैतिक बुराई या अधर्म का बोध कराता है; ‘दुष्टता’ इस संदर्भ के लिए स्पष्ट और सामान्य आधुनिक हिन्दी है।
- source_word: וְלֹא יִתְבּוֹנָן
  choice: तो क्या वह उस पर ध्यान नहीं देता?
  rationale: התבונן का भाव ध्यानपूर्वक देखने, विचार करने या संज्ञान लेने का है। संदर्भ में निषेध को अलंकारिक प्रश्न मानने से सोपर का तर्क स्वाभाविक रहता है, जबकि इब्रानी की वैकल्पिक सपाट नकारात्मक रचना पादटिप्पणी में सुरक्षित की गई है।
theological_decisions:
- issue: अंतिम वाक्यांश וְלֹא יִתְבּוֹנָן का अभिप्राय
  choice: 'अलंकारिक प्रश्न: ‘तो क्या वह उस पर ध्यान नहीं देता?’'
  alternative: 'साधारण नकारात्मक कथन: ‘और वह ध्यान नहीं देता।’'
  rationale: संदर्भ में सोपर परमेश्वर द्वारा मनुष्य की दुष्टता को पूरी तरह जानने पर बल देता है; इसलिए अलंकारिक प्रश्न तर्क के अनुकूल है। फिर भी इब्रानी शब्दरचना साधारण निषेध के रूप में भी पढ़ी जा सकती है, अतः उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘झूठे मनुष्यों’ में मूल पदबंध का नैतिक भाव बना रहता है, और अंतिम खंड की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
