base_translation:
  language: en
  yaml_path: translation/ot/job/011/003.yaml
  text: Will your empty talk make men keep silent[a], and when you mock, will no one shame you?
translation:
  language: hi
  text: क्या तुम्हारी खोखली बातें लोगों को चुप करा देंगी,[a] और जब तुम उपहास करोगे, तो क्या कोई तुम्हें लज्जित न करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी डींगें,” “तुम्हारी बकबक” अथवा “तुम्हारी व्यर्थ बातें।” इब्रानी शब्द खोखली, व्यर्थ, डींगभरी या झूठी बातों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּדֶּיךָ
  choice: तुम्हारी खोखली बातें
  rationale: यह शब्द निरर्थक, व्यर्थ, डींगभरी या झूठी बातों का बोध करा सकता है। प्रसंग में सोपर अय्यूब की बातों को तुच्छ ठहरा रहा है; ‘खोखली बातें’ इस निंदात्मक भाव को बनाए रखती हैं, पर सीधे ‘झूठ’ का आरोप निश्चित नहीं करतीं।
- source_word: מְתִים
  choice: लोगों को
  rationale: बहुवचन संज्ञा मनुष्यों या व्यक्तियों को सूचित करती है। यहाँ सामान्य रूप से सुननेवाले लोगों की बात है; आधुनिक हिन्दी में ‘लोगों’ स्वाभाविक और समावेशी है।
- source_word: יַחֲרִישׁו
  choice: चुप करा देंगी
  rationale: क्रिया का हिफ़ील रूप किसी को मौन कराने का भाव रखता है। यह अनुवाद उस कारक अर्थ और आलंकारिक प्रश्न—क्या तुम्हारी बातें सबको निरुत्तर कर देंगी—दोनों को व्यक्त करता है।
- source_word: וַתִּלְעַג
  choice: और जब तुम उपहास करोगे
  rationale: לעג का अर्थ उपहास करना या ठट्ठा उड़ाना है। ‘जब’ काव्यात्मक प्रश्न में दोनों उपवाक्यों का स्वाभाविक संबंध दिखाता है, जबकि ‘उपहास’ गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: מַכְלִם
  choice: तुम्हें लज्जित न करेगा
  rationale: כלם का हिफ़ील कृदंत किसी को लज्जित या अपमानित करने का अर्थ देता है। ‘लज्जित करेगा’ मूल के परिणामकारी भाव को बनाए रखता है और इसे केवल ‘डाँटने’ तक सीमित नहीं करता।
