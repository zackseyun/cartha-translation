  register: वाक्य को आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य हिन्दी में रखा गया है। दोनों आलंकारिक प्रश्न सुरक्षित हैं। ‘लोगों’ से מְתִים का सामान्य मानवीय संदर्भ व्यक्त होता है; ‘लज्जित’ मूल के अपेक्षाकृत औपचारिक और तीखे भाव को बनाए रखता है।
