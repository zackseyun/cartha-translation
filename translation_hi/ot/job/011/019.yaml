translation:
  language: hi
  text: 'तुम लेटोगे और कोई तुम्हें भयभीत नहीं करेगा;

    बहुत-से लोग तुम्हारी कृपा पाने के लिए विनती करेंगे।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बहुत-से लोग तुम्हारे मुख की विनती करेंगे”; यह किसी की कृपा पाने के लिए उससे विनती करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָבַצְתָּ
  choice: तुम लेटोगे
  rationale: रָבַץ का सीधा अर्थ लेटना या विश्राम के लिए बैठ जाना है। यहाँ यह सुरक्षित होकर लेटने का चित्र प्रस्तुत करता है; अनुवाद में उसी चित्र को बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: וְאֵין מַחֲרִיד
  choice: और कोई तुम्हें भयभीत नहीं करेगा
  rationale: מַחֲרִיד उस व्यक्ति को सूचित करता है जो कंपकंपी या भय उत्पन्न करे। यह हिंदी अभिव्यक्ति इब्रानी निषेधात्मक अस्तित्व-वाक्य का स्वाभाविक अर्थ देती है।
- source_word: וְחִלּוּ פָנֶיךָ
  choice: तुम्हारी कृपा पाने के लिए विनती करेंगे
  rationale: חלה פני एक मुहावरा है जिसका अर्थ किसी से अनुग्रह या कृपा की याचना करना है। शाब्दिक 'मुख' को मुख्य पाठ में रखने से अर्थ अस्पष्ट होता, इसलिए मुहावरे का स्वाभाविक हिंदी अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में बताया गया है।
- source_word: רַבִּים
  choice: बहुत-से लोग
  rationale: यह बहुवचन संज्ञार्थक विशेषण बड़ी संख्या में लोगों को दर्शाता है। 'बहुत-से लोग' आधुनिक हिंदी में स्पष्ट और सहज है।
