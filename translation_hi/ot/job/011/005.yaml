    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह सोपर के पिछले कथन से एक प्रबल विरोधात्मक मोड़ दिखाता है; ‘परन्तु’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: מִי יִתֵּן
  choice: काश
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि प्रबल इच्छा व्यक्त करता है; आधुनिक हिन्दी में ‘काश’ उसी भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: एकवचन ईश्वरीय पदनाम को बिना अनावश्यक विस्तार के सामान्य, प्रतिष्ठित हिन्दी शब्द ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: דַּבֵּר
  choice: बोलता
  rationale: इच्छासूचक ‘काश’ के साथ यह क्रिया हिन्दी में संभावित/वांछित कार्य को स्वाभाविक रूप से व्यक्त करती है।
- source_word: וְיִפְתַּח
  choice: और ... खोलता
  rationale: यह ‘बोलता’ के समानांतर उसी इच्छित कार्य का दूसरा पक्ष है और פתח के सीधे अर्थ ‘खोलना’ को बनाए रखता है।
- source_word: שְׂפָתָיו
  choice: अपने होंठ
  rationale: मूल पाठ विशेष रूप से ‘उसके होंठ’ कहता है। हिन्दी में कर्ता परमेश्वर की ओर लौटते संबंध के लिए ‘अपने होंठ’ स्वाभाविक है और सजीव मानवरूपी अभिव्यक्ति को सुरक्षित रखता है।
- source_word: עִמָּךְ
  choice: तेरे विरुद्ध
  rationale: पूर्वसर्ग का मूल अर्थ ‘तेरे साथ’ हो सकता है, किन्तु प्रसंग में सोपर चाहता है कि परमेश्वर अय्यूब के दावों का सामना करके उत्तर दे; इसलिए मुख्य पाठ में टकराव का भाव रखा गया है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के लिए मानवरूपी भाषा—‘अपने होंठ खोलता’
  choice: मूल मानवरूपी अभिव्यक्ति को सीधे बनाए रखा
  alternative: ‘तुझसे बोलता’ के रूप में भावानुवाद
  rationale: इब्रानी पाठ परमेश्वर के बोलने के लिए देह-संबंधी चित्रात्मक भाषा का प्रयोग करता है। इसे बनाए रखना मूल की काव्यात्मक सजीवता और धर्मवैचारिक तनाव दोनों का सम्मान करता है।
- issue: עִמָּךְ का प्रसंगगत बल
  choice: मुख्य पाठ में ‘तेरे विरुद्ध’
  alternative: ‘तेरे साथ’ अथवा ‘तुझसे’
  rationale: सोपर यहाँ निष्पक्ष वार्तालाप की नहीं, अय्यूब को प्रत्युत्तर देने हेतु परमेश्वर के बोलने की कामना करता है। फिर भी पूर्वसर्ग की वास्तविक भाषिक व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्यात्मक गद्य। अय्यूब के प्रत्यक्ष संबोधन के अनुरूप एकवचन ‘तेरे’ रखा गया है। ‘काश’ इच्छा का स्वाभाविक सूचक है; ‘अपने होंठ खोलता’ मूल की चित्रात्मक भाषा को सुरक्षित रखता है।
