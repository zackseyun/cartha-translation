  edition: WLC
  text: וְ/אִ֣ישׁ נָ֭בוּב יִלָּבֵ֑ב וְ/עַ֥יִר פֶּ֝֗רֶא אָדָ֥ם יִוָּלֵֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/job/011/012.yaml
  text: But an empty-headed man will gain understanding when a wild donkey’s colt is born a man[a][b].
translation:
  language: hi
  text: लेकिन बुद्धिहीन मनुष्य को समझ-बूझ तभी आएगी, जब जंगली गधे का बच्चा मनुष्य के रूप में जन्म लेगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “खोखला मनुष्य हृदय पाएगा।” इब्रानी में “हृदय पाना” समझ-बूझ प्राप्त करने का मुहावरा है।'
    reason: lexical_alternative
  - marker: b
    text: 'यह पंक्ति सम्भवतः व्यंग्यपूर्ण है: मूर्ख तभी बुद्धिमान होगा, जब जंगली गधे का बच्चा मनुष्य के रूप में जन्म लेगा। इब्रानी वाक्य अत्यन्त संक्षिप्त है और इसे दोनों कथनों के सीधे समानांतर रूप में भी पढ़ा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ נָבוּב
  choice: खोखली बुद्धि वाला मनुष्य
  rationale: נָבוּב का मूल बिंब ‘खोखला’ है और यहाँ मूर्ख या समझहीन व्यक्ति के लिए रूपक है। यह अभिव्यक्ति उस बिंब को बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करती है।
- source_word: יִלָּבֵב
  choice: समझ पाएगा
  rationale: לבב का यह निफ़अल रूप शाब्दिक रूप से ‘हृदय पाएगा’ है; यहाँ ‘हृदय’ समझ-बूझ का मुहावरा है। भविष्यात्मक रूप अपूर्ण क्रिया के भाव और असंभव-सी शर्त, दोनों के अनुकूल है।
- source_word: וְ
  choice: लेकिन
  rationale: संदर्भ में संयोजक व्यंग्यपूर्ण विरोध प्रकट करता है, इसलिए साधारण ‘और’ के बजाय ‘लेकिन’ स्वाभाविक है।
- source_word: עַיִר פֶּרֶא
  choice: जंगली गधे का बच्चा
  rationale: यह संबंधवाची पदबंध जंगली गधे के बच्चे को दर्शाता है। ‘बच्चा’ सामान्य पाठक के लिए सहज है और पशु-शावक का अर्थ साफ़ रखता है।
- source_word: אָדָם יִוָּלֵד
  choice: मनुष्य जन्म लेगा
  rationale: אָדָם यहाँ मनुष्य को और יִוָּלֵד ‘जन्म लेना’ को व्यक्त करता है। हिन्दी में यह क्रम स्वाभाविक है और असंभव तुलना को यथावत रखता है।
theological_decisions:
- issue: कहावत का व्यंग्यपूर्ण और असंभवता-सूचक आशय
  choice: मूर्ख मनुष्य के समझ पाने को जंगली गधे के बच्चे के मनुष्य जन्म लेने जैसी असंभव घटना से जोड़ा गया है।
  alternative: 'दोनों खंडों को बिना स्पष्ट शर्त-संबंध के समानांतर कथनों की तरह पढ़ना: ‘खोखला मनुष्य हृदय पाएगा, और जंगली गधे का बच्चा मनुष्य जन्म लेगा।’'
  rationale: इब्रानी पंक्ति संक्षिप्त और कठिन है, पर समानांतरता प्रबलतः व्यंग्यपूर्ण असंभवता का संकेत देती है। ‘जब’ इस संबंध को पठनीय बनाता है, जबकि टिप्पणियाँ शाब्दिकता और व्याख्यात्मक अनिश्चितता सुरक्षित रखती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘खोखली बुद्धि’ मूल के ‘खोखलेपन’ के बिंब को बचाती है, और ‘समझ पाएगा’ मुहावरे का स्वाभाविक अर्थ देता है।
