    reason: lexical_alternative
lexical_decisions:
- source_word: גָּבְהֵי שָׁמַיִם
  choice: आकाश से भी ऊँची
  rationale: शाब्दिक भाव ‘आकाश की ऊँचाइयाँ’ है। पिछले पद से चली आ रही निहित स्त्रीलिंग विषय-वस्तु के साथ तुलनात्मक और काव्यात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מַה
  choice: क्या
  rationale: दोनों अर्ध-पंक्तियों में यह प्रश्नवाचक सर्वनाम आलंकारिक प्रश्न आरम्भ करता है; ‘क्या’ उसके सीधे बल को बनाए रखता है।
- source_word: תִּפְעָל
  choice: तू क्या कर सकता है
  rationale: פעל के क़ाल अपूर्ण 2 पुरुष एकवचन का मूल अर्थ ‘करना/सिद्ध करना’ है। यहाँ अपूर्ण रूप सामर्थ्य व्यक्त करता है, इसलिए ‘कर सकता है’ उपयुक्त है।
- source_word: עֲמֻקָּה
  choice: गहरी
  rationale: स्त्रीलिंग एकवचन विशेषण पिछले पद से चली आ रही निहित विषय-वस्तु से मेल खाता है। ‘गहरी’ पहले अर्ध की ‘ऊँची’ के साथ काव्यात्मक समानांतरता रखता है।
- source_word: מִשְּׁאוֹל
  choice: अधोलोक से भी
  rationale: מִן यहाँ तुलना सूचित करता है। שְׁאוֹל को केवल ‘कब्र’ तक सीमित न करके मृतकों के लोक की व्यापक धारणा बताने के लिए ‘अधोलोक’ चुना गया है; ‘भी’ हिन्दी में तुलनात्मक बल स्पष्ट करता है।
- source_word: תֵּדָע
  choice: तू क्या जान सकता है
  rationale: ידע के क़ाल अपूर्ण 2 पुरुष एकवचन का अर्थ ‘जानना’ है। समानांतर आलंकारिक प्रश्न में यह मानवीय सामर्थ्य की सीमा व्यक्त करता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शीओल
  rationale: यहाँ शब्द गहराई की काव्यात्मक तुलना में आया है। ‘अधोलोक’ आधुनिक हिन्दी में मृतकों के नीचे स्थित लोक की स्रोत-सांस्कृतिक धारणा को संक्षेप में व्यक्त करता है और अर्थ को केवल भौतिक कब्र तक सीमित नहीं करता। पादटिप्पणी मूल इब्रानी पद और विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ज़ोफर एक पुरुष से सीधे बात कर रहा है, इसलिए एकवचन ‘तू’ मूल के निकट है और अय्यूब की काव्य-शैली में स्वाभाविक है। दोनों समानांतर आलंकारिक प्रश्नों तथा निहित स्त्रीलिंग विषय को बनाए रखा गया है।
