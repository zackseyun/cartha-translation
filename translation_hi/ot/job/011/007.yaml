  text: Can you discover the depths of God? Can you find the limit of the Almighty?[a][b]
translation:
  language: hi
  text: 'क्या तुम परमेश्वर की गहराइयों का पता लगा सकते हो?[a]

    क्या तुम सर्वशक्तिमान की सीमा तक पहुँच सकते हो?[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की खोज-परख।” इब्रानी शब्द खोज, छानबीन, या उस बात को सूचित कर सकता है जिसकी खोज की जाती है।
    reason: lexical_alternative
  - marker: b
    text: “सीमा” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “अंत,” “पूरा विस्तार,” या “पूर्णता” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֵקֶר
  choice: गहराइयों
  rationale: חֵקֶר खोज, छानबीन, अथवा खोजे जाने वाले अगम विषय को सूचित कर सकता है। इस आलंकारिक प्रश्न में ‘गहराइयों’ मनुष्य की खोज से परे परमेश्वर के अगाध स्वरूप और बातों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֱלוֹהַ
  choice: परमेश्वर
  rationale: अय्यूब में प्रयुक्त इस एकवचन ईश्वरीय पद का मानक और स्पष्ट हिन्दी रूप।
- source_word: תִּמְצָא
  choice: पता लगा सकते हो
  rationale: מצא का मूल अर्थ ‘पाना/खोजना’ है; חֵקֶר के साथ यहाँ सफल खोज या छानबीन का भाव है, जिसे ‘पता लगाना’ सहज हिन्दी में व्यक्त करता है।
- source_word: אִם
  choice: क्या ... सकते हो
  rationale: यहाँ אִם शर्त नहीं, बल्कि पहले प्रश्न के समानांतर आलंकारिक प्रश्न प्रस्तुत करता है।
- source_word: עַד תַּכְלִית
  choice: सीमा तक
  rationale: עַד के साथ תַּכְלִית अंतिम छोर, पूर्ण विस्तार या सीमा का भाव देता है। ‘सीमा तक’ उस पहुँच से बाहर पूर्ण विस्तार को संक्षिप्त और स्वाभाविक ढंग से रखता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: शַׁדַּי का परंपरागत, अर्थपूर्ण हिन्दी अनुवाद; यह समानांतर पंक्ति में परमेश्वर के लिए ईश्वरीय पद है।
- source_word: תִּמְצָא
  choice: पहुँच सकते हो
  rationale: दूसरी पंक्ति में מצא को ‘सीमा तक’ के साथ शब्दशः ‘पा सकते हो’ कहना असहज होता; ‘पहुँच सकते हो’ किसी अंतिम छोर को पा लेने का भाव स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर को जानने की मानवीय क्षमता
  choice: प्रश्न मनुष्य की परमेश्वर की गहराइयों और पूर्ण विस्तार तक पहुँचने की असमर्थता व्यक्त करता है।
  alternative: इसे इस पूर्ण दावे के रूप में पढ़ना कि मनुष्य परमेश्वर के विषय में कुछ भी नहीं जान सकता।
  rationale: इब्रानी पाठ परमेश्वर की पूरी थाह या अंतिम सीमा पा लेने पर प्रश्न करता है; वह परमेश्वर के किसी भी सच्चे ज्ञान को असंभव घोषित नहीं करता। अनुवाद इसी तनाव को बिना सैद्धांतिक विस्तार के बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण किंतु सहज शैली रखी गई है। दोनों समानांतर पंक्तियों का प्रश्नात्मक रूप सुरक्षित है। ‘तुम’ सामान्य आधुनिक पाठक के लिए स्वाभाविक है; भाषा न अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की।
