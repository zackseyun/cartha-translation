lexical_decisions:
- source_word: וּבָטַחְתָּ
  choice: तुम निश्चिन्त रहोगे
  rationale: בטח यहाँ आशा के कारण उत्पन्न सुरक्षा और भरोसे की अवस्था व्यक्त करता है। ‘निश्चिन्त रहोगे’ आधुनिक हिन्दी में इस परिणामसूचक भाव को स्वाभाविक ढंग से रखता है।
- source_word: כִּי יֵשׁ תִּקְוָה
  choice: क्योंकि आशा है
  rationale: תִּקְוָה का सामान्य अर्थ ‘आशा’ है और כִּי को यहाँ कारणसूचक ‘क्योंकि’ समझना प्रसंगानुकूल है।
- source_word: וְחָפַרְתָּ
  choice: तुम चारों ओर जाँचकर
  rationale: חפר का मूल अर्थ ‘खोदना’ है, पर इस प्रसंग में इसे विश्राम से पहले आसपास देखने, जाँचने या स्थान तैयार करने के अर्थ में समझा जा सकता है। मुख्य पाठ में ‘चारों ओर जाँचकर’ स्वाभाविक है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לָבֶטַח
  choice: सुरक्षित
  rationale: यह क्रियाविशेषणात्मक प्रयोग सुरक्षा या निर्भयता से लेटने का भाव देता है।
- source_word: תִּשְׁכָּב
  choice: लेटोगे
  rationale: שׁכב का ठोस अर्थ ‘लेटना’ है; इसे ‘विश्राम करोगे’ बनाना अनावश्यक व्याख्या होती।
