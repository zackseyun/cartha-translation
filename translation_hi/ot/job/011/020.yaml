  text: וְ/עֵינֵ֥י רְשָׁעִ֗ים תִּ֫כְלֶ֥ינָה וּ֭/מָנוֹס אָבַ֣ד מִנְ/הֶ֑ם וְ֝/תִקְוָתָ֗/ם מַֽפַּח נָֽפֶשׁ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/job/011/020.yaml
  text: But the eyes of the wicked will fail[a], and refuge will perish from them, and their hope will be the breathing out of life.
translation:
  language: hi
  text: 'पर दुष्टों की आँखें राह देखते-देखते थक जाएँगी,

    उनके बच निकलने का कोई मार्ग न रहेगा,

    और उनकी आशा अंतिम साँस होगी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पदबंध कठिन है। इसका अर्थ यह भी हो सकता है: “उनकी आशा प्राण निकलने के साथ समाप्त हो जाएगी।” शाब्दिक छवि प्राण निकलने या जीवन की अंतिम साँस की है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵינֵי רְשָׁעִים תִּכְלֶינָה
  choice: दुष्टों की आँखें राह देखते-देखते थक जाएँगी
  rationale: ‘आँखों के चुक जाने’ की इब्रानी छवि को रखते हुए उसके प्रसंगगत भाव—व्यर्थ प्रतीक्षा में दृष्टि का थक जाना—को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מָנוֹס אָבַד מִנְהֶם
  choice: उनके बच निकलने का कोई मार्ग न रहेगा
  rationale: מָנוֹס यहाँ भाग निकलने के साधन या संभावना को दर्शाता है। ‘कोई मार्ग न रहेगा’ इब्रानी के ‘उनसे नष्ट हो जाएगा’ का स्वाभाविक हिन्दी रूप है और पूर्ण असहायता का भाव रखता है।
- source_word: תִקְוָתָם
  choice: उनकी आशा
  rationale: תִּקְוָה का सीधा और प्रसंगानुकूल हिन्दी अर्थ ‘आशा’ है।
- source_word: מַפַּח נָפֶשׁ
  choice: केवल अंतिम साँस
  rationale: यह कठिन इब्रानी पदबंध जीवन/प्राण के बाहर निकलने या अंतिम साँस की छवि देता है। ‘अंतिम साँस’ मृत्यु की छवि को संक्षिप्त और सहज हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: מַפַּח נָפֶשׁ में आशा के विषय और आशा के स्वयं समाप्त होने के बीच संभावित अर्थ-संबंध
  choice: उनकी आशा केवल अंतिम साँस होगी
  alternative: उनकी आशा प्राण निकलने के साथ समाप्त हो जाएगी
  rationale: मुख्य पाठ इब्रानी पदबंध की संक्षिप्त, कठोर मृत्यु-छवि को बनाए रखता है और यह नहीं बताता कि मृत्यु उनकी चाही हुई वस्तु है या उनकी आशा का अंतिम परिणाम। वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। समानांतर पंक्तियाँ दुष्टों की निष्फल प्रतीक्षा, बच निकलने की असंभवता और अंततः मृत्यु की आशा—इन तीनों को क्रमशः सामने लाती हैं।
