base_translation:
  language: en
  yaml_path: translation/ot/job/011/004.yaml
  text: For you say[a], ‘My teaching is pure, and I am clean in your eyes.’
translation:
  language: hi
  text: 'क्योंकि तू कहता है, “मेरी शिक्षा[a] शुद्ध है,

    और मैं तेरी दृष्टि में निर्मल हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा उपदेश” अथवा “मेरा कथन।” इब्रानी संज्ञा उस बात को सूचित कर सकती है जिसे किसी ने शिक्षा के रूप में ग्रहण किया हो या प्रस्तुत किया हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तू कहता है
  rationale: यह अय्यूब से सोपर का सीधा संबोधन है। इब्रानी रूप भूतकाल में भी समझा जा सकता है, पर वाद-विवाद में वर्तमान आरोप को स्वाभाविक हिंदी में व्यक्त करने के लिए वर्तमान काल चुना गया है।
- source_word: זַךְ
  choice: शुद्ध
  rationale: यह विशेषण पवित्रता या शुद्धता बताता है और यहाँ לִקְחִי के विषय में विधेय है। ‘शुद्ध’ आगे आने वाले בַר के अनुवाद ‘निर्मल’ से अर्थगत निकटता रखते हुए शब्दगत भेद भी बनाए रखता है।
- source_word: לִקְחִי
  choice: मेरी शिक्षा
  rationale: לֶקַח सीखी या सिखाई गई बात, शिक्षा अथवा प्रस्तुत विचार को सूचित कर सकता है। संदर्भ में सोपर अय्यूब की कही हुई बातों की शुद्धता के दावे को संक्षेप में रखता है; इसलिए ‘शिक्षा’ उपयुक्त है, जबकि ‘उपदेश’ और ‘कथन’ भी संभव हैं।
- source_word: וּבַר
  choice: और ... निर्मल
  rationale: בַר का अर्थ स्वच्छ, शुद्ध या निर्मल है। ‘निर्मल’ पहले प्रयुक्त ‘शुद्ध’ की अनावश्यक पुनरावृत्ति से बचते हुए दोनों शब्दों की अर्थगत समानता बनाए रखता है।
- source_word: הָיִיתִי
  choice: मैं ... हूँ
  rationale: रूप की दृष्टि से यह היה का पूर्णकाल प्रथम पुरुष एकवचन है, पर उद्धृत आत्म-दावे में वर्तमान अवस्था व्यक्त होती है; इसलिए स्वाभाविक हिंदी में ‘मैं ... हूँ’ किया गया है।
- source_word: בְעֵינֶיךָ
  choice: तेरी दृष्टि में
  rationale: यह किसी के मूल्यांकन या उसके सामने स्थिति को व्यक्त करने वाला इब्रानी मुहावरा है। ‘तेरी दृष्टि में’ मूल बिंब को बनाए रखता है और आधुनिक हिंदी में स्वाभाविक है।
theological_decisions:
- issue: ‘तेरी दृष्टि में’ के द्वितीय पुरुष एकवचन का संदर्भ
  choice: उद्धृत दावे में परमेश्वर को संबोधन
  alternative: सामान्य रूप से वार्तालाप के दूसरे पक्ष को संबोधन
  rationale: सोपर अय्यूब के कथित दावे को इस रूप में प्रस्तुत करता है कि वह परमेश्वर की दृष्टि में अपने को निर्मल मानता है। अनुवाद में ‘तेरी’ रखकर इस संभावित सीधे संबोधन को सुरक्षित रखा गया है, बिना व्याख्यात्मक रूप से ‘परमेश्वर’ जोड़ने के।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है। अय्यूब के लिए एकवचन निकट संबोधन ‘तू’ और उद्धरण में परमेश्वर के लिए ‘तेरी’ मूल इब्रानी के एकवचन रूपों को बनाए रखते हैं।
