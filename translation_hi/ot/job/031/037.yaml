  yaml_path: translation/ot/job/031/037.yaml
  text: I would declare to him the number of my steps[c][b][a]; like a prince I would approach him.
translation:
  language: hi
  text: मैं अपने कदमों की गिनती उसे बता देता[a][b]; किसी शासक[c] के समान मैं उसके पास आता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे अपने कदमों का लेखा बता देता।”
    reason: lexical_alternative
  - marker: b
    text: “उसे” का संकेत परमेश्वर या निकटवर्ती प्रसंग में अय्यूब पर अभियोग लगाने वाले की ओर हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “अगुवा” अथवा “कुलीन व्यक्ति।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר
  choice: गिनती
  rationale: यह संज्ञा संख्या या गणना को दर्शाती है। ‘कदमों की गिनती’ इब्रानी की ठोस अभिव्यक्ति को बनाए रखती है, जबकि प्रसंग में पूरे जीवन-आचरण का लेखा देने का भाव भी संभव रहता है।
- source_word: צְעָדַי
  choice: मेरे कदमों
  rationale: शब्द का शाब्दिक अर्थ कदम या डग है। ‘मेरे कदम’ स्वाभाविक हिन्दी में जीवन के आचरण और मार्ग का रूपक भी बनाए रखता है।
- source_word: אַגִּידֶנּוּ
  choice: उसे बता देता
  rationale: נגד के हिफ़ील रूप का अर्थ बताना, घोषित करना या प्रकट करना है। हिन्दी में ‘उसे बता देता’ औपचारिक उत्तर देने के प्रसंग के अनुकूल है और पुल्लिंग एकवचन प्रत्यय के व्यक्ति-संदर्भ को खुला रखता है।
- source_word: כְּמוֹ
  choice: के समान
  rationale: यह तुलना सूचित करता है; ‘के समान’ काव्यात्मक और गरिमापूर्ण हिन्दी है।
- source_word: נָגִיד
  choice: प्रधान पुरुष
  rationale: यह शब्द अगुवा, शासक, प्रधान या उच्च पद वाले व्यक्ति को दर्शा सकता है। ‘प्रधान पुरुष’ आत्मविश्वास और प्रतिष्ठा का भाव रखता है, पर आधुनिक वंशगत ‘राजकुमार’ का संकीर्ण अर्थ नहीं थोपता।
- source_word: אֲקָרֲבֶנּוּ
  choice: मैं उसके निकट जाता
  rationale: קרב के पिएल रूप में निकट आने या पास पहुँचने का अर्थ है। यह अनुवाद न्याय के लिए निर्भयतापूर्वक सामने आने के भाव और व्यक्ति-सूचक प्रत्यय दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘उसे’ और ‘उसके’ में पुल्लिंग एकवचन प्रत्ययों का संदर्भ
  choice: पद में संदर्भ को अनिर्दिष्ट रखा गया है।
  alternative: स्पष्ट रूप से ‘परमेश्वर’ या ‘मेरा अभियोग लगाने वाला’ कहना।
  rationale: निकटवर्ती प्रसंग में अय्यूब अपने विरोधी द्वारा लिखे अभियोग और उत्तर देने की अपनी तत्परता—दोनों की बात करता है। इब्रानी इस पद में संदर्भित व्यक्ति का स्पष्ट नाम नहीं देता, इसलिए अनुवाद उस अर्थगत और धर्मवैचारिक तनाव को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर अय्यूब के न्यायिक और काव्यात्मक स्वर के अनुरूप गरिमापूर्ण रखी गई है। ‘प्रधान पुरुष’ सामान्य पाठक के लिए बोधगम्य रहते हुए נָגִיד की व्यापक पद-प्रतिष्ठा को व्यक्त करता है।
