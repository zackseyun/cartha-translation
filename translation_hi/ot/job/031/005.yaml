  rationale: यह अय्यूब की निर्दोषता की शपथ में शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ बिना अतिरिक्त बल जोड़े हिब्रू को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָלַכְתִּי
  choice: मैं चला हूँ
  rationale: הלך का मूल अर्थ ‘चलना’ है और यहाँ यह आचरण के रूपक के रूप में प्रयुक्त है। यह अनुवाद मूल काव्यात्मक बिंब और पूर्ण क्रिया—दोनों को बनाए रखता है।
- source_word: עִם
  choice: के साथ
  rationale: यह झूठ से संगति या सहभागिता का सीधा भाव व्यक्त करता है।
- source_word: שָׁוְא
  choice: झूठ
  rationale: שׁוא के अर्थों में खोखलापन, व्यर्थता और असत्य शामिल हैं। समानांतर पद ‘छल’ के कारण यहाँ नैतिक अर्थ ‘झूठ’ सबसे स्वाभाविक है।
- source_word: וַתַּחַשׁ
  choice: उतावली से बढ़ा हो
  rationale: חושׁ शीघ्रता करने या लपकने का भाव देता है। यह प्रयोग पाँव के सजीव काव्यात्मक चित्र को आधुनिक हिन्दी में स्वाभाविक रखता है।
- source_word: עַל
  choice: की ओर
  rationale: गति-सूचक क्रिया के साथ यह लक्ष्य की दिशा दिखा सकता है। ‘की ओर’ इस अर्थ को स्पष्ट करता है, जबकि वैकल्पिक ‘के पीछे’ को टिप्पणी में रखा गया है।
- source_word: מִרְמָה
  choice: छल
  rationale: यह कपटपूर्ण या धोखेबाज़ आचरण को दर्शाता है। ‘छल’ संक्षिप्त, नैतिक और काव्यात्मक है तथा ‘झूठ’ के समानांतर उपयुक्त बैठता है।
- source_word: רַגְלִי
  choice: मेरा पाँव
  rationale: हिब्रू में शब्द एकवचन है। एकवचन रखने से व्यक्ति के आचरण की दिशा दिखाने वाला मूल मानवीकरण सुरक्षित रहता है।
