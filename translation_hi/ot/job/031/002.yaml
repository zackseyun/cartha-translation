source:
  edition: WLC
  text: וּ/מֶ֤ה חֵ֣לֶק אֱל֣וֹהַּ מִ/מָּ֑עַל וְֽ/נַחֲלַ֥ת שַׁ֝דַּ֗י מִ/מְּרֹמִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/002.yaml
  text: And what is the portion from God above[a], and the inheritance from the Almighty from on high?
translation:
  language: hi
  text: और परमेश्वर की ओर से ऊपर से मिलनेवाला भाग क्या है[a], और सर्वशक्तिमान की ओर से ऊँचाइयों से मिलनेवाली विरासत क्या है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “ऊपर विराजमान परमेश्वर की ओर से मिलनेवाला भाग क्या है?” हिब्रू पदबंधों को क्रियाविशेषण रूप में भी समझा जा सकता है: “ऊपर से ... ऊँचाइयों से”; यह दिए जाने वाले भाग और विरासत के स्वर्गीय स्रोत पर बल देता है।'
    reason: मִמָּעַל के वाक्यगत संबंध और स्थान-सूचक पदबंधों की वास्तविक हिब्रू अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וּמֶה
  choice: और ... कौन-सा
  rationale: संयोजक וְ पिछले तर्क से संबंध बनाए रखता है, और מֶה यहाँ आलंकारिक प्रश्न आरंभ करता है। हिंदी में ‘कौन-सा’ भाग और विरासत—दोनों के साथ स्वाभाविक है।
- source_word: חֵלֶק
  choice: भाग
  rationale: यह किसी को दिए या ठहराए गए हिस्से को दर्शाता है और समानांतर ‘विरासत’ के साथ सहज बैठता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: अय्यूब में यह परमेश्वर के लिए प्रयुक्त एकवचन काव्यात्मक पद है; हिंदी में अर्थ स्पष्ट रखने के लिए इसका अनुवाद किया गया है।
- source_word: מִמָּעַל
  choice: ऊपर से
  rationale: यह स्वर्गीय स्रोत या ऊपरी स्थान का भाव देता है। इसे क्रियाविशेषण रूप में रखा गया है, जबकि वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: וְנַחֲלַת
  choice: और ... विरासत
  rationale: נַחֲלָה विरासत या आवंटित संपत्ति को दर्शाता है और ‘भाग’ के साथ काव्यात्मक समानांतरता बनाए रखता है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: इस ईश्वरीय पदवी का प्रचलित, अर्थपूर्ण हिंदी अनुवाद है; लिप्यंतरण की अपेक्षा सामान्य पाठक के लिए स्पष्ट है।
- source_word: מִמְּרֹמִים
  choice: ऊँचाइयों से
  rationale: बहुवचन रूप और स्रोत-सूचक מִן दोनों को स्पष्ट रखते हुए ‘स्वर्ग’ जैसा अधिक विशिष्ट अर्थ नहीं जोड़ा गया है।
theological_decisions:
- issue: हिब्रू काव्य में ईश्वरीय पदवियाँ
  choice: אֱלוֹהַּ का ‘परमेश्वर’ और שַׁדַּי का ‘सर्वशक्तिमान’
  alternative: ‘एलोह’ और ‘शद्दाई’ के रूप में लिप्यंतरण
  rationale: दोनों पद समानांतर ईश्वरीय संबोधन हैं। उनका अनुवाद आधुनिक हिंदी पाठक तक अर्थ पहुँचाता है, बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के।
- issue: מִמָּעַל का वाक्यगत संबंध
  choice: ‘ऊपर से’ को मिलने वाले भाग के स्वर्गीय स्रोत के रूप में लेना
  alternative: इसे ‘ऊपर रहनेवाले परमेश्वर’ का विशेषण मानना
  rationale: हिब्रू पदबंध दोनों प्रकार से समझा जा सकता है। मुख्य पाठ में समानांतर מִמְּרֹמִים के अनुरूप स्रोत का भाव रखा गया है और दूसरी संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज काव्यात्मक प्रश्न। ‘मिलता है’ अर्थ को बदले बिना हिब्रू के संज्ञात्मक वाक्य को स्वाभाविक हिंदी में पूरा करता है; दोनों अर्धपंक्तियों की समानांतरता बनाए रखी गई है।
