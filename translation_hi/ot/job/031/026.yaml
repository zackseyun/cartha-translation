lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: अय्यूब की निर्दोषता की शपथ में यह एक शर्तसूचक उपवाक्य आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אֶרְאֶה
  choice: मैंने ... देखा हो
  rationale: रूप अपूर्णकालिक है, पर शपथ के इस प्रसंग में अय्यूब द्वारा किए जाने से नकारे जा रहे काल्पनिक पिछले कार्य को हिन्दी का पूर्णतासूचक संभाव्य रूप ठीक व्यक्त करता है।
- source_word: אוֹר
  choice: प्रकाश
  rationale: मूल शब्द का सीधा अर्थ ‘प्रकाश’ है। समानांतर ‘चाँद’ के कारण संकेत सूर्य की ओर हो सकता है, फिर भी मुख्य पाठ में ‘सूर्य’ रखकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: כִּי יָהֵל
  choice: चमकते हुए
  rationale: כִּי यहाँ परिस्थिति बताता है और יָהֵל प्रकाशमान होने का भाव देता है; हिन्दी कृदन्तीय वाक्यांश दोनों को सहजता से व्यक्त करता है।
- source_word: וְיָרֵחַ
  choice: या ... चाँद
  rationale: संयोजक इस शर्तसूचक क्रम में दूसरे वैकल्पिक खगोलीय दृश्य को जोड़ता है; हिन्दी में ‘या’ प्रसंगानुकूल है।
- source_word: יָקָר
  choice: वैभव से
  rationale: चाँद के संदर्भ में यह उसकी बहुमूल्यता से अधिक उसकी भव्य चमक या महिमा बताता है; ‘वैभव से’ उसके क्रियाविशेषणीय बल को बनाए रखता है।
- source_word: הֹלֵךְ
  choice: चलते हुए
  rationale: הלך का कृदन्त चाँद की आकाश में जारी गति को चित्रात्मक और मूल के निकट रूप में व्यक्त करता है।
theological_decisions:
- issue: खगोलीय उपासना की संभावित पृष्ठभूमि
  choice: मुख्य पाठ में खगोलीय बिंब को उसके शाब्दिक रूप में रखा गया और उपासना का आशय स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: אוֹר का अनुवाद ‘सूर्य’ करके मूर्तिपूजा-विरोधी प्रसंग को अधिक प्रत्यक्ष करना।
  rationale: पद 27–28 खगोलीय पिंडों के प्रति उपासना-सदृश आकर्षण को स्पष्ट करते हैं, पर पद 26 स्वयं केवल ‘प्रकाश’ और ‘चाँद’ कहता है। इसलिए निहितार्थ को संदर्भ पर छोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु काव्यात्मक और गरिमापूर्ण रखी गई है। ‘चाँद’ सामान्य पाठक के लिए ‘चन्द्रमा’ से अधिक स्वाभाविक है, जबकि ‘वैभव’ मूल की भव्यता बनाए रखता है।
