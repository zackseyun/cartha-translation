base_translation:
  language: en
  yaml_path: translation/ot/job/031/015.yaml
  text: Did not he who made me in the womb make him[a], and form us in one womb?
translation:
  language: hi
  text: क्या गर्भ में मुझे बनानेवाले ने उसे भी नहीं बनाया, और क्या एक ही ने हम दोनों को गर्भ में रूप नहीं दिया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और क्या एक ने हमें गर्भ में रूप नहीं दिया?” हिब्रू के अंतिम शब्दों को “एक ही गर्भ में” भी समझा जा सकता है। भाव दोनों की समान मानवीय उत्पत्ति पर बल देता है; इसका अर्थ यह आवश्यक नहीं कि दोनों की माता एक ही थी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर ‘हाँ’ है; आधुनिक हिन्दी में ‘क्या ... नहीं’ इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּבֶּטֶן
  choice: गर्भ में
  rationale: यहाँ בטן जन्मपूर्व निर्माण के स्थान को दर्शाता है, इसलिए ‘पेट’ की अपेक्षा ‘गर्भ’ अधिक सटीक और स्वाभाविक है।
- source_word: עֹשֵׂנִי
  choice: जिसने मुझे ... बनाया
  rationale: कृदन्त और प्रथम पुरुष एकवचन प्रत्यय को व्यक्तिगत तथा क्रियात्मक रूप में रखा गया है; ‘मेरा रचयिता’ की अपेक्षा यह मूल वाक्य-संरचना के अधिक निकट है।
- source_word: עָשָׂהוּ
  choice: उसे भी ... बनाया
  rationale: पुल्लिंग एकवचन प्रत्यय पिछले प्रसंग के दास/सेवक की ओर संकेत करता है; ‘भी’ दोनों के एक ही कर्ता द्वारा बनाए जाने का समानांतर बल स्पष्ट करता है।
- source_word: וַיְכֻנֶנּוּ
  choice: हम दोनों को ... आकार दिया
  rationale: प्रसंग में प्रत्यय को प्रथम पुरुष बहुवचन समझना सबसे उपयुक्त है। ‘आकार दिया’ गर्भ में गढ़ने/रचने का भाव व्यक्त करता है, और ‘दोनों’ अय्यूब तथा उसके सेवक को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בָּרֶחֶם אֶחָד
  choice: गर्भ में
  rationale: शाब्दिक ‘एक गर्भ में’ हिन्दी में एक ही जैविक माता का भ्रामक अर्थ दे सकता है। यहाँ काव्यात्मक आशय समान मानवीय उत्पत्ति और एक ही परमेश्वर द्वारा गर्भ में रचे जाने का है; पाठ इसे स्वाभाविक रूप में देता है और वैकल्पिक संरचना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दूसरे व्यक्ति का संदर्भ
  choice: ‘उसे’ को तत्कालीन प्रसंग के पुरुष दास/सेवक के संदर्भ में एकवचन रखा गया है।
  alternative: इसे सामान्य रूप से किसी भी दूसरे मनुष्य पर लागू करके बहुवचन या सार्वभौमिक कथन बनाया जा सकता था।
  rationale: अय्यूब 31:13–14 का निकट प्रसंग अय्यूब के दास और दासी के साथ व्यवहार का है। अनुवाद हिब्रू के एकवचन को बनाए रखता है और व्यापक मानवीय निहितार्थ को स्पष्ट व्याख्या में नहीं बदलता।
- issue: ‘एक गर्भ’ और साझा उत्पत्ति का भाव
  choice: मुख्य पाठ में एक ही परमेश्वर द्वारा दोनों को गर्भ में आकार दिए जाने पर बल रखा गया है।
  alternative: ‘एक गर्भ में’ या ‘उसी गर्भ में’ का अधिक शाब्दिक अनुवाद।
  rationale: शाब्दिक हिन्दी एक ही माता से जन्मे होने का अनचाहा जैविक दावा सुझा सकती है। मूल का काव्यात्मक तनाव और साझा सृष्टिगत गरिमा पादटिप्पणी सहित सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दो अलंकारिक प्रश्न हिब्रू के तर्कात्मक बल को बनाए रखते हैं। ‘हम दोनों’ तत्काल प्रसंग के दो व्यक्तियों को स्पष्ट करता है, जबकि पादटिप्पणी אֶחָד की वास्तविक व्याकरणिक और मुहावरेदार अस्पष्टता सुरक्षित रखती है।
