  text: if I have covered my transgressions like Adam[a], by hiding my iniquity in my bosom—
translation:
  language: hi
  text: यदि मैंने मनुष्य की तरह[a] अपने अपराधों को ढका हो, और अपने अधर्म को अपने सीने में छिपाया हो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आदम की तरह।” इब्रानी शब्द אָדָם का अर्थ सामान्य संज्ञा “मनुष्य” भी हो सकता है और व्यक्तिवाचक नाम “आदम” भी।
    reason: alternative_reading
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: अय्यूब की शपथ-सदृश शर्त-श्रृंखला में यह पूर्वपक्ष आरम्भ करता है; ‘यदि’ उसकी अपूर्ण शर्तात्मकता बनाए रखता है।
- source_word: כִּסִּיתִי
  choice: मैंने ... ढककर
  rationale: כסה का मूल चित्र ‘ढकना’ है; कृदन्तीय हिंदी रचना इसे अगले ‘छिपाया हो’ से स्वाभाविक रूप से जोड़ती है।
- source_word: כְאָדָם
  choice: मनुष्य की तरह
  rationale: אָדָם यहाँ सामान्य संज्ञा ‘मनुष्य’ अथवा व्यक्तिवाचक नाम ‘आदम’ दोनों हो सकता है। मुख्य पाठ में सामान्य अर्थ रखा गया है और दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: פְּשָׁעָי
  choice: अपने अपराधों
  rationale: פֶּשַׁע नियम-उल्लंघन अथवा विद्रोह का नैतिक-कानूनी भाव रखता है; ‘अपराध’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לִטְמוֹן
  choice: छिपाया
  rationale: טמן का अर्थ छिपाना या गुप्त रखना है; यहाँ यह अपराध ढकने के ढंग को व्यक्त करता है।
- source_word: בְּחֻבִּי
  choice: अपने सीने में
  rationale: यह रूप ‘गोद/सीने’ जैसे छिपे हुए निकट स्थान का ठोस बिंब देता है; ‘सीने में’ आधुनिक हिंदी में उस बिंब को स्वाभाविक रूप से बनाए रखता है।
- source_word: עֲוֺנִי
  choice: अपने अधर्म को
  rationale: עָוֹן नैतिक विकृति, पाप या दोष का बोध करा सकता है; ‘अधर्म’ गंभीर नैतिक अर्थ को रखता है और פֶּשַׁע से भेद भी बनाए रखता है।
theological_decisions:
- issue: כְאָדָם में אָדָם का अर्थ
  choice: 'सामान्य संज्ञा: ‘मनुष्य की तरह’'
  alternative: 'व्यक्तिवाचक नाम: ‘आदम की तरह’'
  rationale: इब्रानी रूप दोनों अर्थों की अनुमति देता है। प्रसंग में सामान्य मानवीय व्यवहार का अर्थ सम्भव है, जबकि आदम की ओर संकेत भी पुरानी और महत्वपूर्ण व्याख्या है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। ‘ढकना’, ‘सीने में’ जैसे मूल ठोस बिंब बनाए गए हैं। पद अगली पंक्ति से जुड़ी शर्त होने के कारण अंत में दीर्घ विराम रखा गया है; पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित है।
