  text: Instead of wheat[a], let thorns come up, and instead of barley, stinkweed. The words of Job are ended.
translation:
  language: hi
  text: गेहूँ के बदले काँटे उगें, और जौ के बदले दुर्गंधित खरपतवार उगें। अय्यूब के वचन समाप्त हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תַּחַת
  choice: के बदले
  rationale: इस शापात्मक कृषि-संदर्भ में यह स्थान नहीं, बल्कि उपयोगी फसल के स्थान पर हानिकारक वनस्पति आने का भाव व्यक्त करता है।
- source_word: חִטָּה
  choice: गेहूँ
  rationale: यह सामान्य रूप से गेहूँ की फसल का नाम है।
- source_word: יֵצֵא
  choice: उगें
  rationale: वनस्पति के संदर्भ में क्रिया का स्वाभाविक हिन्दी अर्थ भूमि से निकलना या उगना है।
- source_word: חוֹחַ
  choice: काँटे
  rationale: यह किसी हानिकारक काँटेदार वनस्पति का सामान्य संकेत है; ‘काँटे’ स्पष्ट और स्वाभाविक है।
- source_word: שְׂעֹרָה
  choice: जौ
  rationale: यह इस अनाज का मानक हिन्दी नाम है।
- source_word: בָאְשָׁה
  choice: दुर्गन्धित घास
  rationale: शब्द किसी दुर्गन्धयुक्त या हानिकारक जंगली वनस्पति को सूचित करता है; इसकी सटीक वनस्पति-पहचान अनिश्चित है, इसलिए सामान्य अर्थ रखा गया है।
- source_word: תַּמּוּ
  choice: समाप्त हुए
  rationale: यह अय्यूब के कथनों की समाप्ति बताने वाला संक्षिप्त समापन-वाक्य है।
- source_word: דִּבְרֵי אִיּוֹב
  choice: अय्यूब के वचन
  rationale: यह मूल रचना को औपचारिक और सीधे ढंग से व्यक्त करता है।
