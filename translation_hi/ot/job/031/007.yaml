base_translation:
  language: en
  yaml_path: translation/ot/job/031/007.yaml
  text: if my step has turned aside from the way[a], and my heart has gone after my eyes, and any stain has clung to my hands[b],
translation:
  language: hi
  text: यदि मेरा कदम मार्ग से भटक गया हो, और मेरा हृदय मेरी आँखों के पीछे चला हो, और मेरे हाथों पर कोई दाग लगा हो,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कोई धब्बा’ अथवा ‘कोई दोष’। इब्रानी शब्द दाग, धब्बे, दोष या कलंक को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטֶּה
  choice: भटक गया हो
  rationale: נטה यहाँ शपथात्मक ‘यदि’ वाक्य में सही मार्ग से हटने को व्यक्त करता है। ‘भटक गया हो’ स्वाभाविक हिंदी में नैतिक विचलन का भाव बनाए रखता है।
- source_word: אַשֻּׁרִי
  choice: मेरा कदम
  rationale: यह संज्ञा कदम या चाल को दर्शाती है। एकवचन ‘मेरा कदम’ मूल के रूपक और व्यक्तिगत आचरण, दोनों को बनाए रखता है।
- source_word: מִנִּי הַדָּרֶךְ
  choice: मार्ग से
  rationale: यह उचित जीवन-पथ से हटने का ठोस रूपक है। ‘मार्ग’ गरिमापूर्ण और आधुनिक हिंदी में सहज है।
- source_word: וְאַחַר עֵינַי הָלַךְ לִבִּי
  choice: और मेरा हृदय मेरी आँखों के पीछे चला हो
  rationale: निकट औपचारिक अनुरूपता हृदय के आँखों के पीछे चलने की मूल नैतिक-मनोवैज्ञानिक छवि सुरक्षित रखती है।
- source_word: לִבִּי
  choice: मेरा हृदय
  rationale: ‘हृदय’ इच्छा, संकल्प और भीतरी व्यक्ति के व्यापक इब्रानी भाव को बनाए रखता है; इसे केवल ‘मन’ कहना अर्थ को संकुचित कर सकता है।
- source_word: עֵינַי
  choice: मेरी आँखें
  rationale: शाब्दिक चयन देखने और भीतर की लालसा के संबंध को जीवंत रखता है।
- source_word: וּבְכַפַּי דָּבַק
  choice: और मेरे हाथों पर ... लगा हो
  rationale: דבק का मूल भाव चिपकने या लगे रहने का है। हिंदी में दाग के साथ ‘हाथों पर लगा हो’ स्वाभाविक है और कर्मों से जुड़ी अशुद्धि की छवि रखता है।
- source_word: מֻאוּם
  choice: कोई दाग
  rationale: यह शब्द दाग, दोष या कलंक का अर्थ दे सकता है। इस नैतिक संदर्भ में ‘दाग’ ठोस छवि और नैतिक संकेत दोनों व्यक्त करता है।
theological_decisions:
- issue: ‘मार्ग’ का नैतिक रूपक
  choice: ‘मार्ग से’ के ठोस रूपक को बनाए रखा गया।
  alternative: ‘सही आचरण से’ या ‘सही राह से’
  rationale: मूल पाठ नैतिक खराई को मार्ग की छवि में प्रस्तुत करता है। इसे अमूर्त व्याख्या में बदलना अनावश्यक अर्थ-विस्तार होता।
- issue: हृदय और आँखों की मानवशास्त्रीय भाषा
  choice: ‘हृदय’ और ‘आँखों’ को प्रत्यक्ष रूप से बनाए रखा गया।
  alternative: ‘मेरी इच्छा उस वस्तु के पीछे चली हो जिसे मैंने देखा’
  rationale: मूल में दृष्टि के पीछे चलती आंतरिक इच्छा का तनाव जानबूझकर चित्रात्मक है। प्रत्यक्ष शब्दावली साहित्यिक और धर्मवैचारिक बनावट को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और मूल की शपथात्मक शर्त के अनुरूप वाक्य। ‘मार्ग’, ‘हृदय’ और ‘आँखें’ जैसे ठोस बाइबलीय रूपकों को व्याख्यात्मक रूप से सपाट नहीं किया गया है।
