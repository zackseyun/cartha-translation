  text: then let me sow and another eat[a], and let my offspring be uprooted.
translation:
  language: hi
  text: तब मैं बोऊँ और कोई दूसरा खाए, और मेरी संतान जड़ से उखाड़ दी जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी उपज जड़ से उखाड़ दी जाए,” अथवा “मेरे वंशजों को जड़ से मिटा दिया जाए।” इब्रानी शब्द צֶאֱצָא का अर्थ वह हो सकता है जो निकलता या उगता है—चाहे संतान हो या उपज।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶזְרְעָה
  choice: मैं बोऊँ
  rationale: प्रसंग आत्म-शाप का है; हिंदी में संभावनार्थक/इच्छार्थक रूप ‘मैं बोऊँ’ इस शापसूचक परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאַחֵר
  choice: और कोई दूसरा
  rationale: यह अय्यूब के परिश्रम और उसका लाभ पाने वाले अन्य व्यक्ति के बीच स्पष्ट विरोध बनाए रखता है।
- source_word: יֹאכֵל
  choice: खाए
  rationale: मूल क्रिया का ठोस अर्थ ‘खाना’ है और यहाँ बोई हुई उपज का लाभ उठाने की कृषि-संबंधी छवि सुरक्षित रहती है।
- source_word: וְצֶאֱצָאַי
  choice: मेरी संतान
  rationale: צֶאֱצָא का अर्थ संतान/वंशज अथवा उगने वाली उपज हो सकता है। मुख्य पाठ में मानवीय-पारिवारिक अर्थ लिया गया है, जबकि कृषि-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: יְשֹׁרָשׁוּ
  choice: जड़ से उखाड़ दी जाए
  rationale: यह मूल के जड़-संबंधी बिंब और आत्म-शाप के निष्क्रिय परिणाम, दोनों को सहज आधुनिक हिंदी में व्यक्त करता है।
