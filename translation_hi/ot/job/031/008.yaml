  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और कृषि-बिंब को सुरक्षित रखने वाला अनुवाद। ‘संतान’ सामान्य पाठक के लिए स्वाभाविक है; मूल की वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
