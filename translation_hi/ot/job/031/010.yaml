translation:
  language: hi
  text: तब मेरी पत्नी किसी दूसरे पुरुष के लिए चक्की पर पीसे[a], और दूसरे पुरुष उसके ऊपर घुटने टेकें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “दूसरे पुरुष उसके साथ सोएँ”; इस प्रसंग में “उसके ऊपर घुटने टेकें” शायद यौन संबंध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּטְחַן
  choice: चक्की पीसे
  rationale: क्रिया טחן का ठोस अर्थ अनाज पीसना है। हिंदी में ‘चक्की पीसे’ उस दासवत श्रम की छवि को स्वाभाविक रूप से बनाए रखता है और प्रसंग में निहित यौन अपमान को सीधे स्पष्ट नहीं करता।
- source_word: לְאַחֵר
  choice: किसी दूसरे पुरुष के लिए
  rationale: אַחֵר का अर्थ ‘दूसरा’ है; प्रसंग में पुरुष का आशय स्पष्ट करने के लिए ‘पुरुष’ जोड़ा गया है।
- source_word: אִשְׁתִּי
  choice: मेरी पत्नी
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित אִשָּׁה का प्रसंगानुकूल सामान्य अर्थ ‘मेरी पत्नी’ है।
- source_word: וְעָלֶיהָ
  choice: उसके ऊपर
  rationale: עַל का स्थानवाचक बिंब ‘ऊपर’ से सुरक्षित रहता है; इसे नरम या व्याख्यात्मक नहीं बनाया गया।
- source_word: יִכְרְעוּן
  choice: घुटने टेकें
  rationale: כרע का सामान्य अर्थ घुटने टेकना या झुकना है। यहाँ यह संभवतः यौन संबंध का शिष्टोक्तिपरक संकेत है, जिसे मुख्य पाठ में ठोस बिंब और पादटिप्पणी में संभावित अर्थ के रूप में रखा गया है।
- source_word: אֲחֵרִין
  choice: दूसरे पुरुष
  rationale: पुल्लिंग बहुवचन रूप प्रसंग में अन्य पुरुषों को सूचित करता है; यह हिंदी में अर्थ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: यौन शिष्टोक्ति को मुख्य पाठ में स्पष्ट किया जाए या नहीं
  choice: मुख्य पाठ में ‘चक्की पीसे’ और ‘उसके ऊपर घुटने टेकें’ की इब्रानी छवियाँ बनाए रखना
  alternative: ‘दूसरे पुरुष उसके साथ यौन संबंध रखें’ अथवा ‘उसके साथ सोएँ’
  rationale: इब्रानी पाठ संभोग के लिए स्पष्ट क्रिया नहीं देता, यद्यपि समानांतरता और शाप के प्रसंग में यौन आशय प्रबल है। इसलिए मुख्य पाठ वास्तविक अस्पष्टता और शिष्टोक्ति को सुरक्षित रखता है, जबकि पादटिप्पणी संभावित अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली। ‘चक्की पीसे’ ठोस प्राचीन बिंब को स्वाभाविक हिंदी में रखता है; पादटिप्पणी शिष्टोक्तिपरक यौन आशय को बिना सांप्रदायिक व्याख्या के दर्ज करती है।
