  yaml_path: translation/ot/job/031/011.yaml
  text: For that is a disgraceful act[a], and it is an iniquity for the judges.
translation:
  language: hi
  text: 'क्योंकि यह एक घिनौना कृत्य है,

    और न्यायाधीशों द्वारा दण्डनीय अपराध[a] है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘न्यायाधीशों के समक्ष आने वाला अपराध।’
    reason: פְּלִילִים न्यायाधीशों/न्यायिक विचार अथवा न्यायालय द्वारा दण्डनीयता का संकेत दे सकता है; यह पादटिप्पणी उस निकटवर्ती वैकल्पिक अर्थ को सुरक्षित रखती है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है और अय्यूब की शपथ-सदृश दलील में स्वाभाविक है।
- source_word: הוא
  choice: वह ... है
  rationale: सर्वनाम प्रसंग में उल्लिखित व्यभिचार के कार्य की ओर संकेत करता है।
- source_word: זִמָּה
  choice: एक घिनौना काम
  rationale: यह शब्द विशेषतः यौन क्षेत्र के निंदनीय और जघन्य आचरण को व्यक्त करता है; यह चयन आधुनिक हिन्दी में उसकी तीव्र नैतिक निंदा बनाए रखता है।
- source_word: וְהִיא
  choice: और वह
  rationale: स्त्रीलिंग सर्वनाम זִמָּה से सामंजस्य रखता है और उसी कार्य के विषय में अगला कथन जोड़ता है; हिन्दी में 'वह' स्वाभाविक है।
- source_word: עָוֺן
  choice: अपराध
  rationale: यहाँ शब्द नैतिक दोष से युक्त ऐसे कृत्य को दर्शाता है जो न्यायिक विचार का विषय है; 'अपराध' नैतिक और विधिक दोनों आयामों को सहज हिन्दी में रखता है।
- source_word: פְּלִילִים
  choice: न्यायाधीशों द्वारा दण्डनीय
  rationale: यह बहुवचन न्यायिक अधिकारियों अथवा न्यायिक निर्णय की ओर संकेत करता है। प्रसंग में अर्थ है कि यह अदालत में दण्ड पाने योग्य अपराध है; यह हिन्दी में 'न्यायाधीशों के लिए अपराध' की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: פְּלִילִים का न्यायिक संबंध
  choice: न्यायाधीशों द्वारा दण्डनीय अपराध
  alternative: न्यायाधीशों के सामने ले जाने योग्य अपराध / न्याय का विषय
  rationale: इब्रानी पदबंध संक्षिप्त है और न्यायाधीशों, न्यायिक निर्णय या दण्डनीयता का बोध करा सकता है। मुख्य पाठ में प्रसंगानुकूल न्यायिक दण्डनीयता रखी गई है, बिना किसी संप्रदायगत निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गंभीर और नैतिक बल वाली है। पद की समानांतर रचना को दो पंक्तियों में रखा गया है। कोई पादटिप्पणी नहीं दी गई, क्योंकि मुख्य पाठ में न्यायिक अर्थ स्पष्ट रूप से व्यक्त है।
