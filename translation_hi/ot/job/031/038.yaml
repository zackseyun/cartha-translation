  text: If my land cries out against me[a], and its furrows weep together,
translation:
  language: hi
  text: 'यदि मेरी भूमि मेरे विरुद्ध पुकार उठे,

    और उसकी हल से बनी नालियाँ एक साथ रोएँ,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विलाप करें”; इब्रानी क्रिया रोने या विलाप करने के लिए प्रयुक्त सामान्य शब्द है, जिसका यहाँ हल से बनी नालियों के लिए काव्यात्मक प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: अय्यूब की निर्दोषता की शपथ में यह शर्तसूचक उपवाक्य आरम्भ करता है; आधुनिक मानक हिन्दी में “यदि” गरिमापूर्ण और स्वाभाविक है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: 'זעק के साथ על यहाँ विरोधी/अभियोगात्मक भाव देता है: भूमि मानो अय्यूब के विरुद्ध गवाही दे रही हो।'
- source_word: אַדְמָתִי
  choice: मेरी भूमि
  rationale: אדמה कृषि योग्य धरती या भूमि को सूचित करता है; प्रसंग में “भूमि” सहज है और स्वामित्व का भाव बनाए रखता है।
- source_word: תִזְעָק
  choice: पुकार उठे
  rationale: זעק संकट या अभियोग की प्रबल पुकार को व्यक्त करता है; यह भूमि के मानवीकरण और नैतिक विरोध की तीव्रता बनाए रखता है।
- source_word: וְיַחַד
  choice: और ... मिलकर
  rationale: יחד संयुक्त रूप से होने वाली क्रिया का भाव देता है; हिन्दी में “मिलकर” काव्यात्मक समन्वय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּלָמֶיהָ
  choice: उसकी मेड़ें
  rationale: תלם हल चलाने से बनी क्यारी की उठी हुई रेखा/मेड़ को सूचित करता है; सामान्य हिन्दी पाठक के लिए “मेड़ें” कृषि-चित्र को स्पष्ट और संक्षिप्त रखता है।
- source_word: יִבְכָּיוּן
  choice: रोएँ
  rationale: בכה का सामान्य अर्थ रोना है; यह खेत की मेड़ों के मानवीकरण को बनाए रखते हुए पहले क्रियापद से भिन्न काव्यात्मक समानांतर प्रस्तुत करता है।
