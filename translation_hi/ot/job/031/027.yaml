  text: and my heart was secretly enticed[a], and my hand kissed my mouth—
translation:
  language: hi
  text: 'और मेरा मन गुप्त रूप से बहक गया हो,

    और मेरे हाथ ने मेरे मुँह को चूमा हो—[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'संदर्भ में इसका अधिक मुहावरेदार भाव यह हो सकता है: “मैंने अपने हाथ से उनकी ओर चुम्बन उछाला हो।” सम्भवतः यह आकाशीय पिंडों की उपासना से जुड़ी श्रद्धा की भंगिमा थी।'
    reason: मुख्य पाठ इब्रानी के ठोस, कुछ असामान्य शारीरिक चित्र को बनाए रखता है; टिप्पणी उसके संभावित मुहावरेदार और सांस्कृतिक अर्थ को स्पष्ट करती है।
lexical_decisions:
- source_word: וַיִּפְתְּ
  choice: बहक गया हो
  rationale: פתה यहाँ भीतर से आकर्षित या प्रलोभित होकर भटकने का भाव देता है। ‘बहक गया’ मन के गुप्त रूप से गलत उपासना की ओर खिंचने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना जानबूझकर किए गए धोखे का अतिरिक्त अर्थ जोड़े।
- source_word: בַּסֵּתֶר
  choice: चुपके से
  rationale: סתר का अर्थ गुप्तता या छिपाव है। क्रियाविशेषण रूप में ‘चुपके से’ भीतर और गुप्त रूप से घटने वाली क्रिया को सहज हिन्दी में रखता है।
- source_word: לִבִּי
  choice: मेरा मन
  rationale: לב इब्रानी में भीतरी व्यक्ति, इच्छा और भावनाओं को दर्शाता है। आधुनिक हिन्दी में ‘मन’ इस संदर्भ में ‘हृदय’ से अधिक स्वाभाविक है और केवल शारीरिक अंग का बोध नहीं कराता।
- source_word: וַתִּשַּׁק
  choice: ने ... चूमा हो
  rationale: נשק का सामान्य अर्थ ‘चूमना’ है। मुख्य पाठ में ठोस शारीरिक क्रिया रखी गई है; संभावित सांस्कृतिक संकेत पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יָדִי
  choice: मेरे हाथ
  rationale: शाब्दिक अर्थ ‘मेरा हाथ’ है; परसर्गीय रचना में ‘मेरे हाथ ने’ स्वाभाविक हिन्दी है और हाथ को क्रिया करने वाले अंग के रूप में बनाए रखती है।
- source_word: לְפִי
  choice: मेरे मुँह को
  rationale: शाब्दिक रूप से ‘मेरे मुँह की ओर/को’ है। ‘चूमना’ के साथ ‘मेरे मुँह को’ मूल चित्र को निकटता से सुरक्षित रखता है; संकेतित अभिवादन-भंगिमा को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: सूर्य या चन्द्रमा की मूर्तिपूजात्मक आराधना से जुड़ी संभावित भंगिमा
  choice: मुख्य पाठ में केवल ठोस शारीरिक क्रिया ‘मेरे हाथ ने मेरे मुँह को चूमा’ रखी गई है।
  alternative: ‘मैंने हाथ से उनकी ओर चुम्बन उछाला’ अथवा आराधना/श्रद्धांजलि का संकेत मुख्य पाठ में स्पष्ट करना।
  rationale: पद 26–28 का संदर्भ सूर्य और चन्द्रमा के प्रति उपासना-सदृश सम्मान की ओर संकेत करता है, पर इस पद की भाषा स्वयं भंगिमा का वर्णन करती है और उसके धार्मिक अर्थ को सीधे नाम नहीं देती। इसलिए व्याख्यात्मक विस्तार को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन’ भीतरी इच्छा और आकर्षण को स्वाभाविक रूप से व्यक्त करता है। पद पूर्ववर्ती शर्तों की श्रृंखला का भाग है, इसलिए हिन्दी में ‘हो’ रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
