  text: If I have made gold my confidence[a], and said to fine gold[c][b], ‘You are my security,’
translation:
  language: hi
  text: 'यदि मैंने सोने को अपना भरोसा[a] ठहराया हो,

    और खरे सोने[b] से कहा हो, ‘तू मेरा सहारा[c] है,’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपनी आशा’।
    reason: lexical_alternative
  - marker: b
    text: ‘खरा सोना’ इब्रानी כֶּתֶם का अनुवाद है, जिसका अर्थ परिष्कृत या शुद्ध सोना हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, ‘मेरा भरोसे का आधार’ या ‘मेरी सुरक्षा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: अय्यूब की निर्दोषता की शपथ में यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ अध्याय की शैली के अनुरूप है।
- source_word: שַׂמְתִּי
  choice: मैंने ... बनाया हो
  rationale: שׂים का मूल अर्थ ‘रखना/ठहराना’ है; सोने को भरोसे का स्थान देने के इस मुहावरे में ‘बनाया हो’ स्वाभाविक और अर्थनिष्ठ है।
- source_word: זָהָב
  choice: सोना
  rationale: स्रोत शब्द का सीधा और सामान्य हिन्दी प्रतिशब्द।
- source_word: כִּסְלִי
  choice: अपना भरोसा
  rationale: כֶּסֶל यहाँ भरोसा, विश्वास या आशा का भाव रखता है। ‘भरोसा’ धन पर निर्भरता को सहज हिन्दी में व्यक्त करता है।
- source_word: וְלַכֶּתֶם
  choice: और खरे सोने से
  rationale: כֶּתֶם परिष्कृत या शुद्ध सोने को सूचित करता है; ‘खरा सोना’ पहले आए सामान्य ‘सोना’ से भेद बनाए रखता है, और ל को ‘से’ द्वारा कथन के संबोधित पक्ष के रूप में व्यक्त किया गया है।
- source_word: אָמַרְתִּי
  choice: कहा हो
  rationale: पूर्ववर्ती शर्तसूचक पूर्ण क्रिया के समानान्तर हिन्दी में ‘कहा हो’ उपयुक्त है।
- source_word: מִבְטַחִי
  choice: मेरा सहारा
  rationale: מִבְטָח उस वस्तु या आधार को दर्शाता है जिस पर सुरक्षा के लिए भरोसा किया जाए। ‘सहारा’ पहले प्रयुक्त ‘भरोसा’ को दोहराए बिना स्रोत की शब्दगत विविधता बनाए रखता है।
theological_decisions:
- issue: धन पर भरोसा रखने के अय्यूब के निषेध का निरूपण
  choice: 'निर्दोषता की शपथ के शर्तसूचक कथन के रूप में: ‘यदि मैंने सोने को अपना भरोसा बनाया हो...’'
  alternative: ‘यदि मैंने सोने पर अपनी आशा रखी हो...’
  rationale: पद धन को अंतिम भरोसे का आधार बनाने से अय्यूब के इनकार को व्यक्त करता है। शर्तसूचक रूप और नैतिक-धार्मिक तनाव सुरक्षित रखे गए हैं, बिना बाद की किसी साम्प्रदायिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शपथ-वाक्य। ‘खरा सोना’ सामान्य पाठक के लिए स्वाभाविक है और זָהָב तथा כֶּתֶם का भेद बनाए रखता है। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उचित स्थान पर दिया गया है।
