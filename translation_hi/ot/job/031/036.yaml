  yaml_path: translation/ot/job/031/036.yaml
  text: Surely I would carry it on my shoulder[a]; I would bind it on myself like a crown.
translation:
  language: hi
  text: निश्चय ही मैं उसे अपने कंधे पर उठा लेता; मैं उसे मुकुट[a] के समान अपने ऊपर बाँध लेता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “मुकुट” का रूप बहुवचन (“मुकुटों”) में है; संभव है कि यह बलात्मक बहुवचन हो, इसलिए मुख्य पाठ में “मुकुट” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: शपथ-संदर्भ में यह पदबंध शर्त नहीं, बल्कि दृढ़ निश्चय व्यक्त करने वाला बलात्मक प्रयोग है।
- source_word: עַל שִׁכְמִי
  choice: अपने कंधे पर
  rationale: इब्रानी के एकवचन और अभियोग-पत्र को खुले रूप से धारण करने के चित्र को सुरक्षित रखता है।
- source_word: אֶשָּׂאֶנּוּ
  choice: मैं उसे ... उठा लेता
  rationale: נשׂא यहाँ उठाने अथवा ढोने के अर्थ में है; हिंदी में यह अभिव्यक्ति चित्र और भाव दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: אֶעֶנְדֶנּוּ
  choice: मैं उसे ... अपने ऊपर बाँध लेता
  rationale: क्रिया किसी आभूषण को पहनने या बाँधने का बोध देती है; यह अनुवाद भौतिक बिंब को बनाए रखता है।
- source_word: עֲטָרוֹת
  choice: मुकुट
  rationale: मूल रूप बहुवचन है, पर यहाँ वह गहन अथवा सामूहिक अर्थ वाला बहुवचन हो सकता है; हिंदी उपमा में एकवचन अधिक स्वाभाविक है, जबकि मूल की बहुवचनता पादटिप्पणी में सुरक्षित है।
- source_word: לִי
  choice: अपने ऊपर
  rationale: ענד के साथ यह सर्वनाम अय्यूब द्वारा उसे स्वयं धारण करने का भाव देता है; हिंदी में आत्मवाचक प्रयोग अर्थ स्पष्ट करता है।
