  text: וּ/מָ֣ה אֶֽ֭עֱשֶׂה כִּֽי יָק֣וּם אֵ֑ל וְ/כִֽי יִ֝פְקֹ֗ד מָ֣ה אֲשִׁיבֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/014.yaml
  text: And what would I do when God rises up? And when he calls me to account[a], what would I answer him?
translation:
  language: hi
  text: और जब परमेश्वर उठ खड़ा होगा, तब मैं क्या करूँगा? और जब वह मुझसे लेखा लेगा[a], तब मैं उसे क्या उत्तर दूँगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब वह मेरी जाँच करेगा” अथवा “जब वह मुझसे मिलने आएगा।” इब्रानी क्रिया का अर्थ भेंट करना, निरीक्षण करना या लेखा लेना हो सकता है; यहाँ प्रसंग न्यायिक जवाबदेही का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה אֶעֱשֶׂה
  choice: तब मैं क्या करूँगा?
  rationale: संयोजक וּ और प्रश्नवाचक מָה को स्वाभाविक हिन्दी में ‘तब ... क्या’ से व्यक्त किया गया है; अपूर्ण क्रिया यहाँ भावी, काल्पनिक परिस्थिति में अय्यूब की असहाय प्रतिक्रिया बताती है।
- source_word: כִּי יָקוּם אֵל
  choice: जब परमेश्वर उठ खड़ा होगा
  rationale: כִּי को प्रसंगानुसार कालवाचक ‘जब’ और קום के उठने/खड़े होने के रूपक को ‘उठ खड़ा होगा’ से सुरक्षित रखा गया है; न्याय करने की क्रिया को अनावश्यक रूप से स्पष्ट नहीं जोड़ा गया।
- source_word: וְכִי יִפְקֹד
  choice: और जब वह मेरा लेखा लेगा
  rationale: פקד के विस्तृत अर्थ-क्षेत्र में भेंट करना, निरीक्षण करना और जवाबदेह ठहराना शामिल हैं। उत्तर देने के समानांतर न्यायिक प्रसंग में ‘मेरा लेखा लेगा’ स्वाभाविक हिन्दी में जवाबदेही का भाव देता है, जबकि पाद-टिप्पणी अन्य सम्भावनाएँ सुरक्षित रखती है।
- source_word: מָה אֲשִׁיבֶנּוּ
  choice: तब मैं उसे क्या उत्तर दूँगा?
  rationale: שוב का हिफ़ील रूप यहाँ प्रत्युत्तर देने के मुहावरे में है और 3 पुल्लिंग एकवचन प्रत्यय को ‘उसे’ से व्यक्त किया गया है।
theological_decisions:
- issue: परमेश्वर के न्याय की छवि
  choice: परमेश्वर के उठ खड़े होने और अय्यूब से लेखा लेने की न्यायिक छवि रखी गई है, पर इसे केवल अन्तिम न्याय नहीं कहा गया।
  alternative: פקד को अधिक सामान्य रूप में ‘भेंट करने’, ‘ध्यान देने’ या ‘जाँचने’ के अर्थ में प्रस्तुत करना।
  rationale: उत्तर देने की माँग के समानांतर פקד यहाँ दैवी जाँच और जवाबदेही की ओर संकेत करता है। फिर भी पद किसी विशिष्ट युगान्तकारी न्याय को स्पष्ट नहीं करता, इसलिए उस निष्कर्ष को अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। ‘उठ खड़ा होगा’ मूल रूपक को रखता है और ‘लेखा लेगा’ न्यायिक भाव को स्वाभाविक ढंग से व्यक्त करता है।
