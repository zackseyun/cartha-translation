  text: for from my youth he raised me like a father[b][a], and from my mother’s womb I guided her.
translation:
  language: hi
  text: क्योंकि मेरी जवानी से उसने मुझे पिता के समान पाला-पोसा[a], और अपनी माँ के गर्भ से ही मैं उसका मार्गदर्शन करता रहा हूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मुझे पिता की तरह बड़ा किया,” अथवा “मैंने उसे पिता की तरह पाला।” इस पंक्ति का इब्रानी पाठ कठिन है; कुछ लोग इसे अनाथ के प्रति अय्यूब की देखभाल के विषय में समझते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “उसका” के लिए स्त्रीलिंग कर्म-प्रत्यय है और संभवतः पिछले पद की विधवा की ओर संकेत करता है।
    reason: cross_reference
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में अय्यूब के इनकार का आधार बताता है और तर्क के प्रवाह को स्वाभाविक रूप से जोड़ता है।
- source_word: מִנְּעוּרַי
  choice: मेरी जवानी से
  rationale: מִן के आरंभ-बिंदु वाले कालगत अर्थ को बनाए रखता है।
- source_word: גְּדֵלַנִי
  choice: उसने मुझे ... पाला-पोसा
  rationale: मसोरेटी पाठ में क्रिया के साथ प्रथम पुरुष एकवचन कर्म-प्रत्यय है; इसलिए कठिन और असामान्य होने पर भी 'मुझे पाला-पोसा' उसके प्रत्यक्ष व्याकरण को सुरक्षित रखता है।
- source_word: כְאָב
  choice: पिता के समान
  rationale: כְ की तुलनात्मक शक्ति को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמִבֶּטֶן אִמִּי
  choice: और अपनी माँ के गर्भ से ही
  rationale: अत्यंत आरंभिक जीवन से चले आने का कालगत मुहावरा; 'ही' आरंभ-बिंदु पर बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַנְחֶנָּה
  choice: मैं उसका मार्गदर्शन करता आया हूँ
  rationale: נחה के हिफ़ील रूप और स्त्रीलिंग एकवचन कर्म-प्रत्यय का अर्थ 'मैंने उसका मार्गदर्शन किया' है; 'करता आया हूँ' दीर्घकालीन देखभाल का भाव देता है।
theological_decisions:
- issue: पहले खंड के कर्ता और अर्थ की कठिनता
  choice: मसोरेटी व्याकरण के अनुसार 'उसने मुझे ... पाला-पोसा' रखा गया है।
  alternative: इसे 'मैंने उसे पिता के समान पाला-पोसा' अथवा 'वह मेरे साथ ऐसे बड़ा हुआ मानो मैं उसका पिता था' समझना।
  rationale: גְּדֵלַנִי में प्रथम पुरुष एकवचन कर्म-प्रत्यय है, यद्यपि संदर्भ के कारण कथन असामान्य लगता है। पाठ की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: दोनों खंडों में संदर्भित व्यक्ति का परिवर्तन
  choice: पहले खंड में पुल्लिंग अनाथ और दूसरे में स्त्रीलिंग विधवा की ओर संकेत माना गया है।
  alternative: दोनों खंडों को सामान्य रूप से अय्यूब की आजीवन करुणामय देखभाल का काव्यात्मक वर्णन मानना।
  rationale: पहले खंड का पुल्लिंग रूप और दूसरे का स्त्रीलिंग कर्म-प्रत्यय व्याकरणिक परिवर्तन को दिखाते हैं; अनुवाद इसे एक ही संदर्भ में मिलाकर तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। 'पाला-पोसा' सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी कठिन इब्रानी संरचना और वैकल्पिक अर्थों को स्पष्ट करती है।
