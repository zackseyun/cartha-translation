    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: यह अलंकारिक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; आधुनिक हिन्दी में ‘क्या ... नहीं’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम का बल प्रसंग में ‘वह’ से पर्याप्त रूप से व्यक्त होता है; ‘वही’ अनावश्यक रूप से अधिक बल देता।
- source_word: יִרְאֶה
  choice: देखता
  rationale: ראה का मूल और यहाँ उपयुक्त अर्थ ‘देखना’ है; इससे परमेश्वर की नैतिक निगरानी का ठोस बिंब बिना व्याख्यात्मक विस्तार के बना रहता है।
- source_word: דְרָכָי
  choice: मेरे मार्गों
  rationale: ‘मार्गों’ से बहुवचन और जीवन-चाल का इब्रानी रूपक दोनों सुरक्षित रहते हैं।
- source_word: וְכָל
  choice: और मेरे हर
  rationale: ‘और’ दोनों उपवाक्यों को जोड़ता है तथा ‘हर’ כָל की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צְעָדַי
  choice: कदम
  rationale: ‘कदम’ व्यक्तिगत गतियों या कार्यों के रूपक को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: יִסְפּוֹר
  choice: गिनता
  rationale: ספר का सीधा अर्थ ‘गिनना’ है; यह मूल के ठोस बिंब को ‘लेखा रखना’ जैसे व्याख्यात्मक विस्तार के बिना सुरक्षित रखता है।
theological_decisions:
- issue: मानवीय क्रियाओं के बिंबों द्वारा व्यक्त परमेश्वर का ज्ञान
  choice: पद को ऐसे अलंकारिक प्रश्न के रूप में रखा गया है जो पुष्टि करता है कि परमेश्वर अय्यूब के मार्गों को देखता और उसके हर कदम को गिनता है।
  alternative: क्या वह मेरे आचरण को नहीं देखता और मेरे सभी कामों का लेखा नहीं रखता?
  rationale: इब्रानी पाठ ‘देखने’ और ‘गिनने’ के ठोस बिंब देता है। अनुवाद इन्हें बनाए रखता है और सर्वज्ञता संबंधी किसी अमूर्त धर्मसैद्धान्तिक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज और गरिमापूर्ण है। ‘मार्गों’ का पारंपरिक किन्तु अब भी बोधगम्य रूपक रखा गया है, जबकि ‘हर कदम’ स्वाभाविक वर्तमान हिन्दी देता है।
