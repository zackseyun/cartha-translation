  text: I have made a covenant with my eyes[a]; so how could I gaze at a virgin?
translation:
  language: hi
  text: मैंने अपनी आँखों के विषय में वाचा बाँधी है; तो फिर मैं किसी कुँवारी पर नज़र कैसे गड़ा सकता हूँ?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर मैं किसी कुँवारी पर नज़र क्यों गड़ाता?”
    reason: וּמָה को परिणामसूचक ‘कैसे’ के बजाय प्रश्नवाचक ‘क्यों’ के रूप में भी समझा जा सकता है।
lexical_decisions:
- source_word: בְּרִית
  choice: वाचा
  rationale: यह शब्द एक गंभीर और बाध्यकारी संकल्प को व्यक्त करता है तथा כָּרַת के साथ प्रयुक्त इब्रानी मुहावरे की गरिमा बनाए रखता है।
- source_word: כָּרַתִּי
  choice: बाँधी है
  rationale: इब्रानी में शाब्दिक मुहावरा ‘वाचा काटना’ है; स्वाभाविक हिन्दी में ‘वाचा बाँधना’ उसी पूर्ण किए गए और अब भी प्रभावी संकल्प को व्यक्त करता है।
- source_word: לְעֵינַי
  choice: अपनी आँखों से
  rationale: लामेद के संबंधात्मक अर्थ को सहज हिन्दी में व्यक्त करते हुए आँखों को इस आत्म-अनुशासन की सहभागी अथवा विषयवस्तु बताया गया है।
- source_word: וּמָה
  choice: तो फिर … कैसे
  rationale: संयोजक और प्रश्नवाचक पद पहले कथन से निकलने वाला निष्कर्षसूचक प्रश्न प्रस्तुत करते हैं। ‘क्यों’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: אֶתְבּוֹנֵן
  choice: नज़र गड़ा सकता हूँ
  rationale: यह रूप साधारणतः एक क्षण देखने के बजाय ध्यानपूर्वक या लगातार देखने का भाव देता है। ‘नज़र गड़ाना’ आधुनिक हिन्दी में इस जानबूझकर किए गए दृष्टिपात को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל
  choice: पर
  rationale: देखने से जुड़े प्रयोग में עַל का स्वाभाविक हिन्दी समतुल्य ‘पर’ है।
- source_word: בְּתוּלָה
  choice: किसी कुँवारी
  rationale: यह चयन स्त्री के अविवाहित और अक्षतयोनि होने के सामान्य शाब्दिक अर्थ को बनाए रखता है; ‘युवती’ अपेक्षाकृत व्यापक है।
theological_decisions:
- issue: दृष्टिपात के नैतिक आशय को स्पष्ट करना
  choice: ‘नज़र गड़ाना’ रखा गया, पर ‘वासना से’ नहीं जोड़ा गया
  alternative: ‘वासना की दृष्टि से देखना’
  rationale: संदर्भ यौन नैतिकता की ओर संकेत करता है, पर मूल पद स्वयं ‘वासना’ शब्द नहीं कहता। अनुवाद ने जानबूझकर और टिकाकर देखने का भाव रखा है, बिना निहित प्रेरणा को स्पष्ट कथन बना देने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वाचा बाँधना’ बाइबिलीय गंभीरता बनाए रखता है, जबकि ‘नज़र गड़ाना’ अति-पुरातन शब्दावली के बिना मूल क्रिया की ध्यानपूर्वक देखने वाली शक्ति व्यक्त करता है।
