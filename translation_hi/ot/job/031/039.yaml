translation:
  language: hi
  text: 'यदि मैंने उसकी उपज बिना दाम दिए खाई हो,

    या उसके मालिकों को अत्यंत सताया हो[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उसके मालिकों के प्राण छीन लिए हों” या “उन्हें हाँफने पर मजबूर किया हो।” इब्रानी क्रिया दुर्लभ है; यह घोर उत्पीड़न या मृत्यु का कारण बनने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּחָהּ
  choice: उसकी उपज
  rationale: כֹּחַ का मूल अर्थ ‘शक्ति’ है, पर भूमि के संदर्भ में यह उसकी उत्पादक शक्ति, अर्थात उसकी उपज, को दर्शाता है। स्त्रीलिंग प्रत्यय आसपास के प्रसंग की भूमि की ओर संकेत करता है।
- source_word: אָכַלְתִּי
  choice: मैंने ... खाई हो
  rationale: सामान्य क्रिया ‘खाना’ को अय्यूब की शपथ-सूचक यदि-वाक्य रचना के अनुरूप पूर्ण क्रिया के रूप में रखा गया है।
- source_word: בְלִי כָסֶף
  choice: बिना दाम दिए
  rationale: כֶּסֶף का शाब्दिक अर्थ ‘चाँदी’ है, किंतु यहाँ उसका आशय धन या उचित भुगतान से है। ‘बिना दाम दिए’ अन्यायपूर्वक उपज लेने की बात सहज हिन्दी में स्पष्ट करता है।
- source_word: נֶפֶשׁ בְּעָלֶיהָ
  choice: उसके मालिकों का दम
  rationale: נֶפֶשׁ जीवन, प्राण या साँस को सूचित कर सकता है और בְּעָלֶיהָ भूमि के मालिकों को। हिन्दी मुहावरा ‘दम निकालना’ कठोर उत्पीड़न और प्राण निकलने—दोनों संभावित भावों को कुछ हद तक खुला रखता है।
- source_word: הִפָּחְתִּי
  choice: निकाला हो
  rationale: נפח का यह हिफ़ईल रूप दुर्लभ है और इसका अर्थ हाँफने पर मजबूर करना, अत्यंत सताना या प्राण निकलवा देना हो सकता है। ‘दम निकाला हो’ स्वाभाविक हिन्दी में इस तीव्रता और अर्थगत तनाव को बनाए रखता है; अधिक शाब्दिक संभावनाएँ पादटिप्पणी में दी गई हैं।
