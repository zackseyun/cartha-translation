  rationale: अय्यूब की निर्दोषता की शपथ में यह शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ मूल संरचना को बनाए रखता है।
- source_word: אֶרְאֶה
  choice: मैंने ... देखा हो
  rationale: שर्तसूचक אִם के बाद आया प्रथम पुरुष एकवचन अपूर्ण क्रियारूप इस प्रसंग में अतीत के अपने आचरण की समीक्षा व्यक्त करता है; हिंदी में ‘देखा हो’ स्वाभाविक है।
- source_word: אֹבֵד
  choice: नष्ट होते
  rationale: אבד का कृदन्त किसी ऐसे व्यक्ति की जारी अवस्था बताता है जो नाश या बरबादी की ओर जा रहा है। ‘नष्ट होते’ इस गंभीरता को बनाए रखता है और केवल ‘गरीब’ अर्थ तक सीमित नहीं करता।
- source_word: מִבְּלִי לְבוּשׁ
  choice: वस्त्र के अभाव में
  rationale: यह वाक्यांश वस्त्र से वंचित होने को व्यक्त करता है और संभवतः उस नाश का कारण भी बताता है; यह हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: וְאֵין
  choice: या ... न हो
  rationale: मूल में संयोजक के साथ अस्तित्व का निषेध है। समानांतर शर्तों की हिंदी अभिव्यक्ति में ‘या’ स्वाभाविक है, जबकि ‘न हो’ अभाव का अर्थ सुरक्षित रखता है।
- source_word: כְּסוּת
  choice: तन ढकने को कुछ
  rationale: शब्द का अर्थ ढकने की वस्तु या परिधान है। यह चयन पहली पंक्ति के ‘वस्त्र’ की हूबहू पुनरावृत्ति से बचते हुए व्यावहारिक अभाव स्पष्ट करता है।
- source_word: לָאֶבְיוֹן
  choice: किसी ज़रूरतमंद के पास
  rationale: אֶבְיוֹן भौतिक अभाव से ग्रस्त गरीब या ज़रूरतमंद व्यक्ति को दर्शाता है। ‘ज़रूरतमंद’ आधुनिक और व्यापक रूप से बोधगम्य है।
