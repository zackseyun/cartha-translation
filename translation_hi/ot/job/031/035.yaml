id: JOB.31.35
reference: Job 31:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י יִתֶּן לִ֨/י שֹׁ֘מֵ֤עַֽ לִ֗/י הֶן תָּ֭וִ/י שַׁדַּ֣י יַעֲנֵ֑/נִי וְ/סֵ֥פֶר כָּ֝תַ֗ב אִ֣ישׁ רִיבִֽ/י־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/035.yaml
  text: Oh[a], that I had someone to hear me! Here is my signature; let the Almighty answer me[b], and let my accuser write out the indictment.
translation:
  language: hi
  text: काश, कोई मेरी सुनता! देखो, यह रहा मेरा हस्ताक्षर[a]; सर्वशक्तिमान मुझे उत्तर दे, और मेरा आरोप लगाने वाला आरोप-पत्र लिखे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरा निशान’ अथवा ‘मेरा चिह्न।’ सम्भवतः यह अय्यूब द्वारा अपने कथन को प्रमाणित करने के लिए लगाया गया निशान है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप से: ‘और मेरे विवाद के व्यक्ति द्वारा लिखा हुआ एक दस्तावेज़।’ प्रसंग में यह अय्यूब की इच्छा व्यक्त करता है कि उसका विरोधी उसके विरुद्ध लिखित आरोप प्रस्तुत करे।'
    reason: alternative_reading
lexical_decisions:
- source_word: מִי יִתֶּן
  choice: काश
  rationale: यह इब्रानी मुहावरा किसी इच्छा या तीव्र अभिलाषा को व्यक्त करता है, न कि शाब्दिक प्रश्न ‘कौन देगा?’ को। आधुनिक हिन्दी में ‘काश’ इसका स्वाभाविक समतुल्य है।
- source_word: שֹׁמֵעַ לִי
  choice: कोई मेरी सुनता
  rationale: यहाँ ‘सुनना’ अय्यूब की बात या मुकदमे को सुनने का भाव रखता है। ‘कोई’ इच्छासूचक वाक्य में निहित श्रोता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֶן
  choice: देखो, यह रहा
  rationale: यह ध्यान खींचने और किसी वस्तु को सामने प्रस्तुत करने वाला उद्गार है। यह अनुवाद न्यायिक चुनौती में अय्यूब द्वारा अपने प्रमाणित कथन को प्रस्तुत करने का भाव देता है।
- source_word: תָּוִי
  choice: मेरा हस्ताक्षर
  rationale: תָּו मूलतः निशान या चिह्न है; यहाँ वह अय्यूब की घोषणा को प्रमाणित करने वाले चिह्न का कार्य करता है। ‘हस्ताक्षर’ आधुनिक पाठक को इसका न्यायिक प्रयोजन स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: שַׁדַּי
  choice: सर्वशक्तिमान
  rationale: अय्यूब में प्रयुक्त इस ईश्वरीय उपाधि का यह प्रचलित और अर्थपूर्ण हिन्दी रूप है; इससे कोई अतिरिक्त सांप्रदायिक अर्थ नहीं जोड़ा जाता।
- source_word: יַעֲנֵנִי
  choice: मुझे उत्तर दे
  rationale: न्यायिक संदर्भ में क्रिया अय्यूब के कथन या मुकदमे का उत्तर देने का भाव रखती है।
- source_word: וְסֵפֶר
  choice: आरोप-पत्र
  rationale: סֵפֶר का शाब्दिक अर्थ लिखित दस्तावेज़, पुस्तक या पत्रक है। यहाँ विवाद और लिखने की भाषा के कारण इसका कार्य लिखित आरोप प्रस्तुत करना है।
- source_word: כָּתַב
  choice: लिखे
  rationale: रूप की दृष्टि से यह पूर्ण क्रिया है, पर इच्छासूचक क्रम और प्रसंग में इसे ‘लिखे’ के रूप में समझना स्वाभाविक है। शाब्दिक रचना की अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ רִיבִי
  choice: मेरा अभियोग लगानेवाला
  rationale: शाब्दिक अर्थ ‘मेरे विवाद का व्यक्ति’ है। न्यायालयीन संदर्भ में यह अय्यूब के विरुद्ध आरोप लाने वाले व्यक्ति की भूमिका बताता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: अय्यूब की अपील में न्यायालयीन बिंब
  choice: ‘हस्ताक्षर’, ‘अभियोग लगानेवाला’ और ‘आरोप-पत्र’ द्वारा न्यायिक संदर्भ को स्पष्ट करना
  alternative: ‘मेरा निशान’, ‘मेरे विवाद का व्यक्ति’ और ‘दस्तावेज़/पत्रक’ जैसे अधिक शाब्दिक रूप
  rationale: पद एक औपचारिक चुनौती और उत्तर पाने की माँग के रूप में रचा गया है। न्यायिक शब्दावली प्रसंग का अर्थ स्पष्ट करती है, पर परमेश्वर और अय्यूब के संबंध के विषय में कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष नहीं जोड़ती।
- issue: כָּתַב का काल अथवा विधि
  choice: इच्छासूचक अर्थ में ‘लिखे’
  alternative: ‘जो दस्तावेज़ मेरे विरोधी ने लिखा है’
  rationale: מִי יִתֶּן से आरम्भ इच्छा और समानांतर ‘उत्तर दे’ के संदर्भ में आदेशात्मक/इच्छासूचक अर्थ उपयुक्त है; फिर भी इब्रानी पूर्ण क्रिया के अधिक शाब्दिक पाठ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘काश’ इच्छा की तीव्रता व्यक्त करता है; न्यायिक शब्दावली प्रसंग को स्पष्ट करती है। ‘अभियोग लगानेवाला’ को ‘अभियोक्ता’ की तुलना में अधिक सहज हिन्दी होने के कारण चुना गया है।
