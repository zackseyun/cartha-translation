  text: כִּ֤י אֶֽעֱר֨וֹץ הָ֘מ֤וֹן רַבָּ֗ה וּ/בוּז מִשְׁפָּח֥וֹת יְחִתֵּ֑/נִי וָ֝/אֶדֹּ֗ם לֹא אֵ֥צֵא פָֽתַח׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/034.yaml
  text: because I feared the great multitude[a], and the contempt of clans terrified me[b], so that I kept silent and did not go out the door—
translation:
  language: hi
  text: क्योंकि मैं विशाल जनसमूह से डरता था, और कुलों की ओर से होने वाला तिरस्कार मुझे भयभीत करता था; इसलिए मैं चुप रहा और द्वार से बाहर नहीं निकला—[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: 'यह वाक्य अय्यूब की निर्दोषता की शपथ का भाग है और इब्रानी वाक्य-रचना कुछ संक्षिप्त है। आशय है: यदि जनमत के डर से मैंने अपराध छिपाया होता और मौन रहकर घर से बाहर न निकला होता।'
    reason: cultural_note
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद अय्यूब की निर्दोषता की शपथ के भीतर उस संभावित कारण को बताता है जिसके दबाव में वह अपने अपराध को छिपाता। ‘क्योंकि’ इब्रानी उपवाक्य-संबंध को बनाए रखता है; इसकी शर्तात्मक पृष्ठभूमि टिप्पणी में स्पष्ट की गई है।
- source_word: אֶעֱרוֹץ
  choice: मैं ... डरता था
  rationale: ערץ तीव्र भय या आतंक व्यक्त करता है। सहज आधुनिक हिन्दी में ‘डरता था’ उपयुक्त है, जबकि अगले क्रियापद के अधिक प्रबल प्रभाव से भेद भी बना रहता है।
- source_word: הָמוֹן רַבָּה
  choice: विशाल जनसमूह
  rationale: הָמוֹן भीड़ या बहुसंख्यक जनसमूह है और רַבָּה उसके बड़े आकार तथा सामाजिक दबाव को उभारता है।
- source_word: וּבוּז מִשְׁפָּחוֹת
  choice: और कुलों के तिरस्कार
  rationale: בּוּז का अर्थ तिरस्कार या उपहास है। מִשְׁפָּחוֹת केवल घरेलू परिवार नहीं, बल्कि विस्तृत नातेदारी-समूह भी हो सकते हैं; इसलिए ‘कुलों’ चुना गया है।
- source_word: יְחִתֵּנִי
  choice: ने मुझे भयभीत कर दिया था
  rationale: חתת के हिफ़ील रूप में किसी का साहस तोड़ने या उसे भयभीत करने का भाव है। यह अनुवाद कारणात्मक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וָאֶדֹּם
  choice: इसलिए मैं चुप रहा
  rationale: 'דמם मौन या स्थिर रहने को दर्शाता है। प्रसंग में वाव परिणामसूचक क्रम बताता है: सामाजिक भय के कारण मौन रहना।'
- source_word: לֹא אֵצֵא פָתַח
  choice: और द्वार से बाहर नहीं निकला
  rationale: יָצָא और פֶּתַח का संयोग घर के प्रवेश-द्वार से बाहर न जाने की ठोस छवि देता है।
theological_decisions:
- issue: निर्दोषता की शपथ में कथन का शर्तात्मक स्वर
  choice: मुख्य पाठ में ‘क्योंकि’ रखते हुए पादटिप्पणी में इसे काल्पनिक शपथ-परिस्थिति बताया गया
  alternative: मुख्य पाठ में सीधे ‘यदि मैं ... डरकर’ कहना
  rationale: כִּי सामान्यतः कारणसूचक है, पर पूरा पद अय्यूब की शपथ-शृंखला के भीतर दीर्घ, कुछ लुप्त-संबंध वाली रचना है। मुख्य पाठ स्रोत की वाक्यगत अस्पष्टता बनाए रखता है और टिप्पणी पाठक को इसे अय्यूब की वास्तविक स्वीकारोक्ति समझने से बचाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विशाल जनसमूह’, ‘कुलों’ और ‘द्वार’ प्राचीन सामाजिक तथा घरेलू चित्र को अनावश्यक व्याख्या के बिना बनाए रखते हैं; अंतिम दीर्घ विराम-चिह्न अगले शपथ-वाक्य की प्रतीक्षा और अपूर्णता दर्शाता है।
