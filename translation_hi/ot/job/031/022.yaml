- source_word: וְאֶזְרֹעִי
  choice: और मेरी बाँह
  rationale: זְרוֹעַ का सामान्य और संदर्भानुकूल अर्थ ‘बाँह’ है।
- source_word: מִקָּנָה
  choice: अपनी हड्डी से
  rationale: קָנֶה यहाँ एक दुर्लभ शारीरिक प्रयोग है। समानांतर शाप में इसे बाँह की हड्डी या जोड़ की संरचना समझना उचित है; मुख्य पाठ में ‘हड्डी’ ठोस शारीरिक चित्र को बनाए रखता है और ‘जोड़’ को विकल्प के रूप में दिया गया है।
- source_word: תִשָּׁבֵר
  choice: टूट जाए
  rationale: שׁבר का निफ़अल रूप यहाँ निष्क्रिय अर्थ देता है; ‘टूट जाए’ सीधे और बिना अनावश्यक तीव्रता के उसका अर्थ व्यक्त करता है।
