  text: यह भी न्यायाधीशों द्वारा दंडनीय अपराध होता[a], क्योंकि मैंने ऊपरवाले परमेश्वर का इनकार किया होता[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘न्यायिक अपराध,’ ‘दंड के योग्य अपराध,’ अथवा ‘न्याय के लिए अपराध।’
    reason: lexical_alternative
  - marker: b
    text: या ‘मैं ऊपरवाले परमेश्वर के प्रति विश्वासघाती हुआ होता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם הוּא
  choice: यह भी
  rationale: यह पद पिछले पद में बताए गए काल्पनिक आचरण की ओर संकेत करता है और उसे अय्यूब द्वारा नकारे गए अपराधों की सूची में जोड़ता है।
- source_word: עָוֺן
  choice: अपराध
  rationale: इस संदर्भ में शब्द नैतिक दोष के साथ न्यायिक उत्तरदायित्व का भाव भी रखता है; ‘अपराध’ आधुनिक हिन्दी में दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְּלִילִי
  choice: न्याय-दंड के योग्य
  rationale: यह शब्द न्यायिक निर्णय अथवा न्यायाधीशों के समक्ष दंडनीय होने से संबंधित है। मुख्य पाठ में अर्थ स्पष्ट किया गया है, जबकि अन्य संभावित रूप पादटिप्पणी में सुरक्षित हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बताता है कि ऐसा आचरण न्याय-दंड के योग्य अपराध क्यों होता।
- source_word: כִחַשְׁתִּי
  choice: मैंने ... इनकार किया होता
  rationale: मूर्तिपूजा के इस संदर्भ में क्रिया केवल झूठ बोलने से बढ़कर परमेश्वर को नकारने या उनके प्रति विश्वासघाती होने का भाव रखती है। आसपास के काल्पनिक वाक्यों के कारण हिन्दी में संभाव्य-भूतकाल रखा गया है।
- source_word: לָאֵל
  choice: परमेश्वर का
  rationale: हिब्रू संबंधसूचक पूर्वसर्ग को ‘इनकार करना’ क्रिया के स्वाभाविक हिन्दी प्रयोग के अनुसार कर्म-संबंध में व्यक्त किया गया है।
- source_word: מִמָּעַל
  choice: ऊपर के
  rationale: मूल का संक्षिप्त ऊर्ध्व स्थान-सूचक भाव बनाए रखा गया है; यह पिछले संदर्भ में आकाशीय पिंडों के साथ निहित विरोध को भी सुरक्षित रखता है।
theological_decisions:
- issue: क्या מִמָּעַל को ‘स्वर्ग में विराजमान’ जैसे विस्तृत धार्मिक वाक्यांश से व्यक्त किया जाए
  choice: ऊपर के परमेश्वर
  alternative: ऊँचे पर विराजमान परमेश्वर / ऊपर स्वर्ग में रहने वाले परमेश्वर
  rationale: हिब्रू अभिव्यक्ति संक्षिप्त है। ‘ऊपर के परमेश्वर’ उसके स्थान-सूचक विरोध को बनाए रखता है और मूल से अधिक धर्मवैचारिक विवरण नहीं जोड़ता।
- issue: כִחַשְׁתִּי का अर्थ परमेश्वर का इनकार करना है या उनके प्रति विश्वासघाती होना
  choice: परमेश्वर का इनकार किया होता
  alternative: परमेश्वर के प्रति विश्वासघाती हुआ होता
  rationale: सूर्य और चंद्रमा की ओर आकर्षित होकर उन्हें सम्मान देने के प्रसंग में ‘इनकार’ उपासना द्वारा परमेश्वर को नकारने का बल स्पष्ट करता है। फिर भी क्रिया में बेवफाई का वास्तविक अर्थ-संकेत है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘न्याय-दंड के योग्य’ से दुर्लभ शाब्दिक संरचना के बजाय मूल का न्यायिक भाव सहज हिन्दी में व्यक्त होता है; दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
