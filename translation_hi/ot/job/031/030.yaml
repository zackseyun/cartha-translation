review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly conveys Job''s denial of permitting sinful hostile speech: requesting another''s life by means of a curse. The rendering of חִכִּי as “मुँह,” נַפְשׁוֹ as “प्राण,” and אָלָה as “शाप” fits the context. A small restructuring more directly keeps “mouth” as the agent of the sinful request, as in the Hebrew.'
  naturalness: “मैंने अपने मुँह को यह पाप करने नहीं दिया कि मैं…” is understandable, but its switch to “मैं” in the subordinate clause weakens the Hebrew's personification/metonymy of the mouth and is slightly less smooth. “...माँगने का पाप नहीं करने दिया” is idiomatic modern Hindi.
  terminology: “शाप” is appropriate for אָלָה in this context. “प्राण” naturally communicates life without importing a doctrinal sense of “soul.” The lexical alternative “oath” should be phrased as “शपथ के साथ” rather than “शपथ खाकर,” since the latter can imply an additional verbal action not explicit in the source.
  issues:
  - severity: low
    issue: The subordinate clause changes the grammatical agent from the mouth to the speaker.
    rationale: Hebrew says literally that Job did not permit his palate/mouth to sin by asking for the other's life. Retaining “मुँह” as the one not permitted to commit the speech-act better reflects the source and reads naturally in Hindi.
  - severity: low
    issue: The footnote's “शपथ खाकर” is more interpretive than the lexical alternative.
    rationale: For בְּאָלָה, “शपथ के साथ” preserves the possible noun sense “with an oath” more closely.
  revised_text: मैंने अपने मुँह को शाप देकर उसके प्राण माँगने का पाप नहीं करने दिया।[a]
