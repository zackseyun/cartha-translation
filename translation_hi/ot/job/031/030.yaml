lexical_decisions:
- source_word: נָתַתִּי
  choice: मैंने ... नहीं दिया
  rationale: ‘देना’ और क्रियार्थक संज्ञा का यह प्रयोग अनुमति देने का भाव व्यक्त करता है; हिंदी में ‘करने नहीं दिया’ स्वाभाविक है और अय्यूब के सचेत इनकार को बनाए रखता है।
- source_word: לַחֲטֹא
  choice: यह पाप करने
  rationale: חטא यहाँ नैतिक अर्थ में ‘पाप करना’ है; ‘यह’ आगे आने वाले शापपूर्ण कथन को इस पाप की विषय-वस्तु बताता है।
- source_word: חִכִּי
  choice: अपने मुँह को
  rationale: शाब्दिक अर्थ ‘तालू’ है, पर काव्य में यह वाणी का लक्षणार्थक संकेत है; आधुनिक हिंदी में ‘मुँह’ स्पष्ट और सहज है।
- source_word: לִשְׁאֹל
  choice: माँगूँ
  rationale: यह क्रिया उस पापपूर्ण वाणी की विषय-वस्तु बताती है—शाप के द्वारा किसी के प्राण की माँग करना।
- source_word: בְּאָלָה
  choice: शाप देकर
  rationale: אָלָה का अर्थ ‘शाप/अभिशाप’ अथवा कुछ संदर्भों में ‘शपथ’ हो सकता है। यहाँ शत्रु के अनिष्ट की कामना का प्रसंग ‘शाप’ के पक्ष में है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: נַפְשׁוֹ
  choice: उसके प्राण
  rationale: נפשׁ यहाँ व्यक्ति के जीवन को सूचित करता है। ‘प्राण’ मृत्यु की कामना के संदर्भ में स्वाभाविक हिंदी है और ‘आत्मा’ से जुड़ी अनावश्यक तात्त्विक व्याख्या से बचाता है।
