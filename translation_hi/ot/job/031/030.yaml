- from: मैंने अपने मुँह को यह पाप करने नहीं दिया कि मैं शाप देकर उसके प्राण माँगूँ।[a]
  to: मैंने अपने मुँह को शाप देकर उसके प्राण माँगने का पाप नहीं करने दिया।[a]
