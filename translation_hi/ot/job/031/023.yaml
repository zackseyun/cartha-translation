  text: כִּ֤י פַ֣חַד אֵ֭לַ/י אֵ֣יד אֵ֑ל וּ֝/מִ/שְּׂאֵת֗/וֹ לֹ֣א אוּכָֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/023.yaml
  text: For calamity from God was a terror to me[b][a], and because of his majesty I could not endure.
translation:
  language: hi
  text: क्योंकि परमेश्वर की ओर से आनेवाली विपत्ति मेरे लिए आतंक थी[a], और उसके प्रताप के कारण मैं असमर्थ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि परमेश्वर की विपत्ति मेरे लिए आतंक थी।” हिब्रू में अधिक शब्दशः “परमेश्वर की विपत्ति” है; इसका अर्थ परमेश्वर की ओर से आनेवाली विपत्ति भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और उसके उत्कर्ष के कारण मैं समर्थ न था,” अथवा “मैं उसका सामना नहीं कर सकता था।” मूल शब्द उत्कर्ष या प्रताप का भाव दे सकता है, और क्रिया सामर्थ्य या सामना कर पाने का; हिब्रू में कर्म स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद अय्यूब के पिछले कथन में बताए गए नैतिक संयम का कारण प्रस्तुत करता है।
- source_word: פַחַד
  choice: भय का कारण
  rationale: यह संज्ञा तीव्र भय या आतंक को व्यक्त करती है; सहज आधुनिक हिन्दी में संज्ञात्मक भाव बनाए रखने के लिए यह रूप चुना गया है।
- source_word: אֵלַי
  choice: मेरे लिए
  rationale: पूर्वसर्ग और प्रथम पुरुष एकवचन प्रत्यय अय्यूब से व्यक्तिगत संबंध दिखाते हैं।
- source_word: אֵיד אֵל
  choice: परमेश्वर की ओर से आनेवाली विपत्ति
  rationale: रचना का औपचारिक अर्थ ‘परमेश्वर की विपत्ति’ हो सकता है, पर प्रसंग में परमेश्वर की ओर से आने वाली विनाशकारी विपत्ति का भाव अधिक स्वाभाविक है।
- source_word: וּמִשְּׂאֵתוֹ
  choice: और उसके प्रताप के सामने
  rationale: שְׂאֵת ऊँचाई, उत्कर्ष या प्रताप सूचित कर सकता है। ‘प्रताप’ दिव्य महिमा और उत्कर्ष दोनों का सहज हिन्दी रूप है; מִן को यहाँ सामना या प्रभाव के संबंध में समझा गया है।
- source_word: לֹא אוּכָל
  choice: मैं टिक नहीं सकता था
  rationale: יכל मूलतः सामर्थ्य व्यक्त करता है; प्रसंग में परमेश्वर के प्रताप के सामने ठहर या उसका सामना न कर पाने का भाव है।
theological_decisions:
- issue: אֵל का अनुवाद
  choice: परमेश्वर
  alternative: सामर्थी; एल
  rationale: यहाँ शब्द दिव्य न्याय और प्रताप के संदर्भ में सामान्य रूप से परमेश्वर को सूचित करता है; हिब्रू रूप को नाम की तरह रखना आवश्यक नहीं है।
- issue: अय्यूब के संयम का आधार
  choice: परमेश्वर से आनेवाली विपत्ति का भय और उसके प्रताप के सामने असमर्थता—दोनों
  alternative: केवल दंड का भय; केवल परमेश्वर की अमूर्त महानता के प्रति श्रद्धा
  rationale: पद में दैवी विपत्ति और दैवी उत्कर्ष दोनों साथ हैं; अनुवाद इस तनाव को किसी एक भाव तक सीमित नहीं करता।
- issue: לֹא אוּכָל का कर्म
  choice: कर्म को अनिर्दिष्ट रखते हुए ‘टिक नहीं सकता था’
  alternative: मैं उसका सामना नहीं कर सकता था; मैं उसे सह नहीं सकता था
  rationale: हिब्रू में स्पष्ट कर्म नहीं है, इसलिए अनुवाद परमेश्वर, उसके प्रताप या उससे आनेवाली विपत्ति में से किसी एक को चुपचाप निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘आनेवाली’ कारण-स्रोत संबंध को स्पष्ट करता है, जबकि पादटिप्पणी औपचारिक ‘परमेश्वर की विपत्ति’ को सुरक्षित रखती है। ‘टिक नहीं सकता था’ मूल में कर्म की अस्पष्टता बनाए रखता है।
