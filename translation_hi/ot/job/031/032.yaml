translation:
  language: hi
  text: परदेशी को बाहर रात नहीं बितानी पड़ती थी; मैं मुसाफ़िर के लिए अपने द्वार खोलता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּחוּץ
  choice: बाहर
  rationale: यह स्थानवाचक अर्थ ‘बाहर’ या ‘खुले में’ व्यक्त करता है; ‘बाहर’ आधुनिक हिन्दी में स्वाभाविक और मूल के निकट है।
- source_word: יָלִין
  choice: रात नहीं बितानी पड़ी
  rationale: क्रिया का विशेष अर्थ रात गुज़ारना या रातभर ठहरना है। निषेध के साथ यह हिन्दी प्रयोग अय्यूब की आतिथ्य-संबंधी बात को स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह किसी गैर-स्थानीय और प्रायः सामाजिक रूप से असुरक्षित निवासी या आगन्तुक को सूचित करता है। ‘परदेशी’ सामान्य हिन्दी में अर्थगम्य है और केवल अपरिचित व्यक्ति का भाव नहीं देता।
- source_word: דְּלָתַי
  choice: अपने द्वार
  rationale: इब्रानी रूप बहुवचन और प्रथम पुरुष एकवचन संबंधसूचक है। ‘अपने द्वार’ मूल के बहुवचन को बनाए रखता है और हिन्दी में आतिथ्य की छवि स्वाभाविक ढंग से देता है।
- source_word: לָאֹרַח
  choice: मुसाफ़िर के लिए
  rationale: संदर्भ में אֹרַח मार्ग नहीं, मार्ग पर चलने वाले यात्री को सूचित करता है। ‘मुसाफ़िर’ साधारण आधुनिक हिन्दी में सहज है।
- source_word: אֶפְתָּח
  choice: मैंने ... खोल दिए
  rationale: अपूर्ण क्रिया यहाँ अय्यूब के अतीत के अभ्यस्त या चारित्रिक आचरण को बताती है; हिन्दी में सामान्य भूतकाल इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
