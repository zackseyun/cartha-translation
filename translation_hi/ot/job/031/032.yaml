translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘परदेशी’ और ‘मुसाफ़िर’ के द्वारा גֵּר तथा אֹרַח के बीच का भेद बनाए रखा गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि पद का अर्थ हिन्दी मुख्य पाठ में पर्याप्त स्पष्ट है।
