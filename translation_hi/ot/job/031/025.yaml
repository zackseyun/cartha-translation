  yaml_path: translation/ot/job/031/025.yaml
  text: if I rejoiced because my wealth was abundant[a], and because my hand had gained much—
translation:
  language: hi
  text: 'यदि मैं इसलिए आनन्दित हुआ कि मेरी सम्पत्ति बहुत थी,

    और इसलिए कि मेरे हाथ ने बहुत कुछ पाया था—'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: अय्यूब की निर्दोषता की शपथ-श्रृंखला में यह शर्तसूचक उपवाक्य आरम्भ करता है।
- source_word: אֶשְׂמַח
  choice: मैं आनन्दित हुआ
  rationale: שׂמח धन के कारण प्रसन्न होने या उसमें आनन्द लेने को व्यक्त करता है; औपचारिक और नैतिक बल दोनों बने रहते हैं।
- source_word: כִּי רַב חֵילִי
  choice: इसलिए कि मेरी सम्पत्ति बहुत थी
  rationale: כִּי यहाँ कारण बताता है और חֵילִי भौतिक धन-संपदा को सूचित करता है; सहज हिन्दी में मात्रा को 'बहुत' से व्यक्त किया गया है।
- source_word: וְכִי כַבִּיר
  choice: और इसलिए कि ... बहुत कुछ
  rationale: दूसरे समानांतर कारणसूचक खंड को बनाए रखते हुए כַבִּיר की परिमाणवाचक शक्ति व्यक्त की गई है।
- source_word: מָצְאָה יָדִי
  choice: मेरे हाथ ने बहुत कुछ पाया था
  rationale: शाब्दिक हाथ-रूपक को सुरक्षित रखा गया है; यह अपनी सामर्थ्य या प्रयास से अर्जित करने की ओर संकेत कर सकता है, पर अनुवाद उस निहितार्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: क्या पद धन रखने की निन्दा करता है या प्रचुर धन और निजी उपलब्धि पर आनन्दित होने की?
  choice: अनुवाद में अय्यूब इस बात से इनकार करता है कि उसने अपनी बहुत सम्पत्ति और अपने हाथ से पाए हुए बहुत कुछ के कारण आनन्द किया।
  alternative: इसे इस प्रकार ढीला किया जा सकता था मानो केवल धन का होना ही दोष हो, या 'अपने परिश्रम से कमाया' कहकर आत्मनिर्भरता का भाव स्पष्ट जोड़ दिया जाता।
  rationale: इब्रानी का बल कारणसूचक כִּי-खंडों और 'मेरे हाथ ने पाया' की छवि पर है। यह धन को अपने-आप दोषी नहीं ठहराता और निजी प्रयास का निहितार्थ भी पूरी तरह व्याख्यायित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। पद की अधूरी शर्तसूचक संरचना और अगले पद की ओर जाता दीर्घ विरामचिह्न बनाए रखा गया है। 'मेरे हाथ ने ... पाया' जानबूझकर शाब्दिक छवि को सुरक्षित रखता है।
