  yaml_path: translation/ot/job/031/013.yaml
  text: If I have rejected the case of my male servant or my female servant when they brought a complaint against me[b][a],
translation:
  language: hi
  text: यदि मैंने अपने दास या दासी के मुक़दमे को ठुकराया हो, जब उन्होंने मेरे विरुद्ध शिकायत की,[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने दास या दासी के न्यायोचित अधिकार को।” इब्रानी מִשְׁפָּט का अर्थ न्याय, कानूनी अधिकार या मुक़दमा हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दास या दासी” का अनुवाद परंपरागत रूप से “सेवक या सेविका” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह अय्यूब की निर्दोषता की शपथ में शर्तसूचक उपवाक्य आरम्भ करता है; ‘यदि’ स्वाभाविक और सटीक है।
- source_word: אֶמְאַס
  choice: मैंने ... ठुकराया हो
  rationale: מָאַס का अर्थ अस्वीकार करना, ठुकराना या तुच्छ जानना हो सकता है; न्यायिक प्रसंग में किसी दावे को ‘ठुकराना’ उपयुक्त है।
- source_word: מִשְׁפַּט
  choice: मुक़दमे
  rationale: यहाँ शब्द न्याय, कानूनी अधिकार या मामला सूचित कर सकता है। विवाद के प्रसंग में ‘मुक़दमा’ न्यायिक आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: עַבְדִּי וַאֲמָתִי
  choice: अपने दास या दासी
  rationale: दोनों शब्द आश्रित अथवा स्वामित्वाधीन पुरुष और स्त्री सेवक को सूचित करते हैं। ‘दास या दासी’ लिंग-भेद और सामाजिक स्थिति दोनों को संक्षेप में बनाए रखता है।
- source_word: בְּרִיבָם
  choice: जब उन्होंने ... शिकायत की
  rationale: רִיב विवाद, अभियोग या कानूनी शिकायत का बोध देता है; क्रियात्मक रूप हिन्दी में स्वाभाविक है और न्यायिक संदर्भ बनाए रखता है।
- source_word: עִמָּדִי
  choice: मेरे विरुद्ध
  rationale: शाब्दिक अर्थ ‘मेरे साथ’ है, पर विवाद के संदर्भ में यह विरोधी पक्ष के रूप में ‘मेरे विरुद्ध’ का अर्थ देता है।
