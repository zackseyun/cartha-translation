  text: אִם אֶ֭שְׂמַח בְּ/פִ֣יד מְשַׂנְאִ֑/י וְ֝/הִתְעֹרַ֗רְתִּי כִּֽי מְצָ֥א/וֹ רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/029.yaml
  text: If I rejoiced at the ruin of the one who hates me[d][c][b][a], and exulted when evil found him—
translation:
  language: hi
  text: यदि मैं मुझसे बैर रखनेवाले की विपत्ति[a] पर आनन्दित हुआ, और जब उस पर अनिष्ट आ पड़ा, तो मैं उल्लसित हुआ[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपदा” या “बरबादी।”
    reason: lexical_alternative
  - marker: b
    text: या “अपने को उभारा” या “उत्तेजित हुआ”; इसमें दूसरे की हानि पर अनुचित खुशी का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह अय्यूब की निर्दोषता की शपथ-संबंधी शर्त प्रस्तुत करता है; हिन्दी में ‘यदि’ स्वाभाविक और निकट समतुल्य है।
- source_word: אֶשְׂמַח
  choice: मैं ... आनन्दित हुआ
  rationale: שׂמח हर्ष या आनन्द प्रकट करता है; भूतकालीन रूप अय्यूब के अपने पिछले आचरण की जाँच के अनुकूल है।
- source_word: בְּפִיד
  choice: की विपत्ति पर
  rationale: פִיד विनाशकारी विपत्ति, आपदा या बरबादी को सूचित करता है। ‘विपत्ति’ सहज हिन्दी है और अर्थ को अनावश्यक रूप से पूर्ण विनाश तक सीमित नहीं करती।
- source_word: מְשַׂנְאִי
  choice: अपने से बैर रखनेवाले
  rationale: कृदन्त का शाब्दिक भाव ‘मुझसे बैर रखनेवाला’ है। यह ‘मेरे शत्रु’ की अपेक्षा मूल की क्रियात्मकता को अधिक स्पष्ट रखता है।
- source_word: וְהִתְעֹרַרְתִּי
  choice: खुश होकर उछला
  rationale: עור का आत्मवाचक रूप यहाँ भावनात्मक रूप से उत्तेजित होकर उल्लसित होने का संकेत देता है। यह समानांतर पंक्ति के आनन्द को तीव्र करता है, पर मुख्य पाठ में स्पष्ट दुर्भावनापूर्ण ‘घमंड से खुश होना’ नहीं जोड़ता।
- source_word: כִּי
  choice: जब
  rationale: यह उस परिस्थिति या समय का परिचय देता है जिसमें उल्लास होता; प्रसंग में कालवाचक ‘जब’ स्वाभाविक है।
- source_word: מְצָאוֹ רָע
  choice: उस पर बुराई आ पड़ी
  rationale: מצא यहाँ किसी विपत्ति के किसी व्यक्ति को आ घेरने या उस पर आ पड़ने का भाव रखता है। ‘बुराई’ רָע की व्यापकता बनाए रखती है, जबकि ‘आ पड़ी’ हिन्दी में मूल मुहावरे का स्वाभाविक रूप है।
theological_decisions:
- issue: अपने से बैर रखनेवाले की विपत्ति पर अय्यूब के उल्लास का नैतिक आशय
  choice: मुख्य पाठ में अय्यूब को दूसरे की विपत्ति पर आनन्दित और उल्लसित होने से इनकार करते दिखाया गया है, पर इसे अधिक तीखा करके स्पष्ट ‘दुर्भावनापूर्ण खिल्ली’ नहीं बनाया गया।
  alternative: यदि मैं अपने शत्रु की विपत्ति पर आनन्दित हुआ और उस पर बुराई आने पर मन ही मन खुश हुआ
  rationale: इब्रानी में दूसरे की हानि पर अनुचित आनन्द का नैतिक संकेत है, लेकिन मुख्य क्रिया अपने आप में ‘उपहास’ या ‘द्वेषपूर्ण घमंड’ को अनिवार्य नहीं बनाती। मूल की नैतिक गंभीरता और शब्दगत अनिश्चितता दोनों सुरक्षित रखी गई हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। ‘अपने से बैर रखनेवाले’ मूल कृदन्त को सुरक्षित रखता है; ‘शत्रु’ अधिक संक्षिप्त विकल्प है। पंक्ति के अंत में दीर्घ विराम-चिह्न अगले पद में जारी शपथ-वाक्य को दर्शाता है।
