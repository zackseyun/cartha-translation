base_translation:
  language: en
  yaml_path: translation/ot/job/031/017.yaml
  text: if I ate my morsel by myself[a], and the fatherless did not eat from it—
translation:
  language: hi
  text: यदि मैंने अपना कौर अकेले खाया हो, और अनाथ[a] ने उसमें से न खाया हो—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘पितृहीन।’ इब्रानी शब्द विशेष रूप से ऐसे व्यक्ति को दर्शाता है जिसका पिता न हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֹכַל
  choice: यदि मैंने…खाया हो
  rationale: अध्याय 31 की शपथ-संबंधी सशर्त रचना में waw को स्वाभाविक हिन्दी में ‘यदि’ से व्यक्त किया गया है; पूर्ण क्रिया के साथ ‘खाया हो’ शर्त का भाव बनाए रखता है।
- source_word: פִּתִּי
  choice: अपना कौर
  rationale: פַּת का अर्थ भोजन का टुकड़ा या कौर है। ‘कौर’ ठोस और सहज है तथा अनावश्यक रूप से ‘रोटी’ निर्धारित नहीं करता।
- source_word: לְבַדִּי
  choice: अकेले
  rationale: यह इब्रानी पद अकेले या अपने ही द्वारा खाने को बताता है। ‘अकेले’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יָתוֹם
  choice: अनाथ
  rationale: स्रोत शब्द विशेष रूप से पिता से वंचित व्यक्ति को दर्शाता है। मुख्य पाठ में प्रचलित और सहज ‘अनाथ’ रखा गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מִמֶּנָּה
  choice: उसमें से
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ פִּתִּי (‘कौर’) से है। हिन्दी में ‘उसमें से’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
