  text: אִם נִפְתָּ֣ה לִ֭בִּ/י עַל אִשָּׁ֑ה וְ/עַל פֶּ֖תַח רֵעִ֣/י אָרָֽבְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/009.yaml
  text: If my heart has been enticed by a woman[a], and I have lain in wait at my neighbor's door[b],
translation:
  language: hi
  text: यदि मेरा मन किसी स्त्री के मोह में फँस गया हो[a], और मैं अपने पड़ोसी के द्वार पर घात लगाए रहा होऊँ[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहक गया हो,” “फुसला लिया गया हो,” अथवा “मोहित हुआ हो।” इब्रानी क्रिया बहकाए, फुसलाए या मोहित किए जाने का भाव दे सकती है; यहाँ प्रसंग यौन प्रलोभन का है।
    reason: lexical_alternative
  - marker: b
    text: “पड़ोसी” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “मित्र” या “साथी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִפְתָּה
  choice: मोहित हुआ हो
  rationale: निफ़अल रूप यहाँ बहकाए, लुभाए या मोहित किए जाने का भाव दे सकता है। यौन प्रलोभन के संदर्भ में ‘मोहित हुआ हो’ मन के भीतर आकर्षण उत्पन्न होने को स्वाभाविक हिन्दी में व्यक्त करता है, बिना स्त्री को स्पष्ट रूप से उसका कर्ता ठहराए।
- source_word: לִבִּי
  choice: मेरा मन
  rationale: इब्रानी ‘हृदय’ इच्छा, विचार और संकल्प सहित भीतरी व्यक्ति को दर्शाता है। आधुनिक हिन्दी में इस वाक्य के साथ ‘मेरा मन’ अधिक सहज है और नैतिक अभिप्राय को बनाए रखता है।
- source_word: עַל אִשָּׁה
  choice: किसी स्त्री पर
  rationale: עַל का मूल संबंध ‘पर/की ओर/के विषय में’ है। ‘किसी स्त्री पर मोहित’ हिन्दी का स्वाभाविक प्रयोग है और मूल की संरचना तथा यौन आकर्षण के संदर्भ दोनों को सुरक्षित रखता है।
- source_word: פֶּתַח
  choice: द्वार
  rationale: ‘द्वार’ घर के प्रवेश-स्थान का संक्षिप्त, गरिमापूर्ण और स्वाभाविक अनुवाद है।
- source_word: רֵעִי
  choice: अपने पड़ोसी के
  rationale: רֵעַ का अर्थ पड़ोसी, मित्र या साथी हो सकता है। इस सामाजिक-नैतिक प्रसंग में ‘पड़ोसी’ व्यापक संबंध को व्यक्त करता है, पर वैकल्पिक अर्थ टिप्पणी में रखा गया है।
- source_word: אָרָבְתִּי
  choice: घात लगाए बैठा रहा होऊँ
  rationale: क्रिया छिपकर अवसर की प्रतीक्षा करने को दर्शाती है। ‘घात लगाए बैठा’ जानबूझकर और गुप्त रूप से ताक लगाने का भाव रखता है, जबकि प्रसंग से बाहर कोई हिंसक हमला अनिवार्य नहीं बनाता।
theological_decisions:
- issue: व्यभिचार के विषय में अय्यूब की शपथ का नैतिक क्रम
  choice: भीतर के आकर्षण के बाद पड़ोसी के द्वार पर जानबूझकर गुप्त प्रतीक्षा का क्रम बनाए रखा गया है।
  alternative: इसे केवल प्रेमपूर्ण आकर्षण कहना, या इसे स्पष्ट रूप से व्यभिचार का प्रयास घोषित करना।
  rationale: इब्रानी पाठ मन के मोहित होने और बाहरी गुप्त कार्रवाई—दोनों को रखता है। अनुवाद नैतिक गंभीरता को बनाए रखता है, पर पाठ में न कही गई कार्रवाई को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मन’ सामान्य पाठक के लिए स्वाभाविक है; ‘द्वार’ और ‘घात लगाए’ काव्यात्मक-नैतिक संदर्भ की गंभीरता बनाए रखते हैं। शर्तवाचक वाक्य अगले पद में आने वाले परिणाम से जुड़ा होने के कारण अंत में अल्पविराम रखा गया है।
