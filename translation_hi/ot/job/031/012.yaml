  text: כִּ֤י אֵ֣שׁ הִ֭יא עַד אֲבַדּ֣וֹן תֹּאכֵ֑ל וּֽ/בְ/כָל תְּב֖וּאָתִ֣/י תְשָׁרֵֽשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/031/012.yaml
  text: For it is a fire that consumes to destruction[a], and it would root out all my produce.
translation:
  language: hi
  text: क्योंकि वह एक आग है जो विनाश तक भस्म कर डालती है[a] और मेरी सारी उपज को जड़ से उखाड़ डालती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अबद्दोन तक।” इब्रानी शब्द אֲבַדּוֹן का अर्थ ‘विनाश’ हो सकता है और कुछ संदर्भों में यह विनाश के लोक या विनाश के व्यक्तीकृत रूप को भी सूचित करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में इसके व्याख्यात्मक संबंध को स्पष्ट रखता है।
- source_word: אֵשׁ הִיא
  choice: वह ऐसी आग है
  rationale: मूल रूपक को सीधे और स्वाभाविक हिन्दी में बनाए रखा गया है। ‘ऐसी’ आगे बताए गए आग के विनाशकारी प्रभाव से वाक्य को सहजता से जोड़ता है।
- source_word: עַד אֲבַדּוֹן תֹּאכֵל
  choice: विनाश तक भस्म कर देती है
  rationale: תֹּאכֵל का मूल अर्थ ‘खा जाना’ है, पर आग के संदर्भ में ‘भस्म कर देना’ स्वाभाविक और सजीव है। עַד सीमा या चरम परिणाम व्यक्त करता है।
- source_word: וּבְכָל תְּבוּאָתִי
  choice: और मेरी सारी उपज को
  rationale: תְּבוּאָה उपज, पैदावार या वृद्धि को सूचित कर सकता है। ‘उपज’ कृषि-बिंब बनाए रखते हुए पर्याप्त व्यापक है।
- source_word: תְשָׁרֵשׁ
  choice: जड़ से उखाड़ देती
  rationale: पिएल रूप पूर्ण विनाश के अर्थ में ‘जड़ से उखाड़ना’ व्यक्त करता है। यह कृषि-बिंब और पिछले प्रसंग की संभावित/शपथगत परिणति दोनों को बनाए रखता है।
theological_decisions:
- issue: אֲבַדּוֹן का अर्थ
  choice: सामान्य संज्ञा ‘विनाश’
  alternative: विशेष नाम अथवा विनाश-लोक ‘अबद्दोन’
  rationale: इस ज्ञान-साहित्यिक संदर्भ में पाप के सर्वनाशकारी परिणाम का सामान्य अर्थ अधिक स्वाभाविक है; फिर भी इब्रानी शब्द की दूसरी संभावित अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भस्म’ आग के रूपक को प्रभावी ढंग से व्यक्त करता है, जबकि ‘जड़ से उखाड़ देती’ मूल कृषि-बिंब तथा संपूर्ण विनाश की तीव्रता बनाए रखता है।
