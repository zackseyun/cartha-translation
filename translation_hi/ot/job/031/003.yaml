base_translation:
  language: en
  yaml_path: translation/ot/job/031/003.yaml
  text: Is not disaster for the unrighteous[b][a], and calamity for the workers of iniquity?
translation:
  language: hi
  text: क्या अन्यायी के लिए विनाश[a] और बुराई करनेवालों के लिए विपत्ति[b] नहीं है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘विनाश’ के लिए ‘अनर्थ’ या ‘बरबादी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘विपत्ति’ के लिए ‘अनिष्ट’ या ‘दुर्भाग्य’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या…नहीं
  rationale: यह अलंकारिक प्रश्न है, जिसका अपेक्षित उत्तर ‘हाँ’ है। हिंदी की ‘क्या…नहीं’ रचना इसके प्रश्नात्मक बल को स्वाभाविक रूप से बनाए रखती है।
- source_word: אֵיד
  choice: विनाश
  rationale: यह शब्द विनाशकारी विपदा या बरबादी को दर्शाता है। ‘विनाश’ काव्यात्मक समानांतरता और नैतिक परिणाम के प्रसंग में उपयुक्त है।
- source_word: לְעַוָּל
  choice: अन्यायी के लिए
  rationale: संज्ञा ऐसे व्यक्ति को दर्शाती है जिसकी पहचान अन्याय या गलत काम से होती है। ‘अन्यायी’ आधुनिक हिंदी में स्पष्ट और नैतिक अर्थ वाला शब्द है।
- source_word: וְנֵכֶר
  choice: और विपत्ति
  rationale: यहाँ यह शब्द אֵיד के समानांतर किसी घोर अनिष्ट या विपत्ति का बोध कराता है। ‘विपत्ति’ पहले पद से निकट संबंध रखते हुए भी शब्दगत भिन्नता बनाए रखती है।
- source_word: לְפֹעֲלֵי
  choice: करनेवालों के लिए
  rationale: बहुवचन कृदंत उन लोगों को दर्शाता है जो ऐसा आचरण करते हैं। ‘करनेवालों’ से यह सक्रिय और अभ्यस्त कर्म स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: אָוֶן
  choice: बुराई
  rationale: इस प्रसंग में यह नैतिक रूप से दोषपूर्ण और हानिकारक कर्म को दर्शाता है। ‘बुराई’ सामान्य पाठक के लिए स्पष्ट है और मूल का नैतिक भार बनाए रखती है।
theological_decisions:
- issue: ज्ञान-साहित्य में नैतिक प्रतिफल
  choice: पद को नैतिक व्यवस्था के सामान्य सिद्धांत के रूप में रखा गया है, बिना यह स्पष्ट किए कि विपत्ति किस प्रक्रिया से आती है।
  alternative: इसे प्रत्यक्ष दैवी दंड या केवल कर्मों के स्वाभाविक परिणाम के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ अन्यायी और बुराई करनेवालों के साथ विनाश और विपत्ति का संबंध बताता है, पर इस पद में उनके आने की प्रक्रिया निर्दिष्ट नहीं करता। अनुवाद इस धर्मवैचारिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दो समानांतर प्रश्नखंड इब्रानी काव्य की संरचना को हिंदी में स्पष्ट करते हैं; दूसरे खंड में क्रिया की स्वाभाविक पुनरावृत्ति से अर्थ पूर्ण किया गया है।
