base_translation:
  language: en
  yaml_path: translation/ot/job/031/006.yaml
  text: Let him weigh me in righteous scales[b][a], and let God know my integrity.
translation:
  language: hi
  text: वह मुझे न्याय के तराज़ू पर तौले[a], और परमेश्वर मेरी खराई को जान ले[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “न्याय के पलड़ों में”; या “सच्चे तराज़ू पर।”
    reason: lexical_alternative
  - marker: b
    text: या “मेरी निर्दोषता को”; या “मेरी निष्कलंकता को।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשְׁקְלֵנִי
  choice: वह मुझे ... तौले
  rationale: קל का अपूर्ण रूप यहाँ इच्छासूचक अर्थ रखता है; अय्यूब निष्पक्ष जाँच के लिए स्वयं को प्रस्तुत करता है।
- source_word: בְמֹאזְנֵי צֶדֶק
  choice: न्याय के तराज़ू पर
  rationale: מֹאזְנַיִם तौलने के तराज़ू और צֶדֶק न्याय, उचितता या निष्पक्षता को दर्शाता है। यह रूपक और इब्रानी पदबंध, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְיֵדַע
  choice: और ... जान ले
  rationale: वाव सहित अपूर्ण क्रिया पहली इच्छासूचक क्रिया का बल आगे बढ़ा सकती है; ‘जान ले’ उस समानांतर इच्छासूचक अर्थ को व्यक्त करता है।
- source_word: אֱלוֹהַּ
  choice: परमेश्वर
  rationale: यह अय्यूब में प्रचलित ‘ईश्वर’ के लिए एकवचन काव्यात्मक रूप है; पद में ‘सर्वशक्तिमान’ जोड़ने का आधार नहीं है।
- source_word: תֻּמָּתִי
  choice: मेरी खराई
  rationale: תֻּמָּה संपूर्णता, निर्दोषता या नैतिक अखंडता का बोध कराता है। ‘खराई’ अय्यूब के नैतिक दावे को व्यक्त करती है, पर पूर्ण पापहीनता का अर्थ अनावश्यक रूप से नहीं जोड़ती।
theological_decisions:
- issue: अय्यूब के आत्म-वर्णन का आशय
  choice: मेरी खराई
  alternative: मेरी निर्दोषता / मेरी निष्कलंकता
  rationale: अय्यूब निष्पक्ष ईश्वरीय जाँच की माँग करता है। ‘खराई’ उसके नैतिक दावे को बनाए रखते हुए इसे पूर्ण पापहीनता के दावे के रूप में निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज काव्यात्मक गद्य। ‘तराज़ू’ न्यायपूर्ण जाँच का मूल रूपक बनाए रखता है; ‘खराई’ सामान्य पाठक के लिए बोधगम्य रहते हुए नैतिक अखंडता व्यक्त करती है।
