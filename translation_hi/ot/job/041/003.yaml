source:
  edition: WLC
  text: מִ֣י הִ֭קְדִּימַ/נִי וַ/אֲשַׁלֵּ֑ם תַּ֖חַת כָּל הַ/שָּׁמַ֣יִם לִ/י הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/003.yaml
  text: Who has first given to me[a], that I should repay him? Whatever is under all the heavens is mine.
translation:
  language: hi
  text: किसने पहले मुझे कुछ दिया है कि मैं उसे प्रतिदान दूँ? सारे आकाश के नीचे जो कुछ है, वह मेरा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִי
  choice: किसने
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला प्रश्नवाचक सर्वनाम है; क्रिया के साथ ‘किसने’ आधुनिक हिन्दी में स्वाभाविक और सशक्त है।
- source_word: הִקְדִּימַנִי
  choice: पहले मुझे कुछ दिया है
  rationale: קדם के हिफ़ील रूप का मूल भाव ‘मुझसे पहले होना/मेरे आगे आना’ है, पर וַאֲשַׁלֵּם (‘मैं लौटा दूँ’) के साथ यहाँ आशय पहले कोई लाभ या भेंट देने से है, जिससे प्रत्युपकार का दायित्व उत्पन्न हो। ‘कुछ’ हिन्दी में क्रिया को स्वाभाविक बनाता है, पर वस्तु को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: וַאֲשַׁלֵּם
  choice: कि मैं उसे लौटा दूँ
  rationale: इस आलंकारिक प्रश्न में वाव-सहित क्रिया पहले किए गए उपकार के परिणामस्वरूप प्रतिदान का भाव देती है। ‘उसे’ निहित व्यक्ति को स्पष्ट करता है और ‘लौटा दूँ’ ऋण चुकाने या प्रतिदान करने की धारणा व्यक्त करता है।
- source_word: תַּחַת כָּל הַשָּׁמַיִם
  choice: सारे आकाश के नीचे
  rationale: हिब्रू का शाब्दिक भाव ‘समस्त आकाशों के नीचे’ है। हिन्दी में ‘सारे आकाश के नीचे’ सृष्टि की पूरी सीमा को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לִי הוּא
  choice: वह मेरा है
  rationale: हिब्रू में ‘मेरे लिए/मेरा वह है’ द्वारा स्वामित्व पर बल है। ‘वह मेरा है’ पिछले पदबंध में निहित समस्त वस्तुओं को समेटते हुए इस दावे को स्पष्ट रखता है।
theological_decisions:
- issue: परमेश्वर पर ऋण और उसका सार्वभौम स्वामित्व
  choice: पहले किसी के द्वारा परमेश्वर को कुछ देने की संभावना पर आलंकारिक प्रश्न, जिसके कारण परमेश्वर प्रत्युपकार के लिए बाध्य हो; फिर समस्त सृष्टि पर उसके स्वामित्व की घोषणा।
  alternative: 'पहले खंड को केवल कालगत अर्थ में रखा जा सकता है: ‘कौन मुझसे पहले आया है कि मैं उसे लौटा दूँ?’'
  rationale: ‘लौटा दूँ’ के साथ पहला खंड मात्र पहले आने की नहीं, पहले देने या उपकार करने की ओर संकेत करता है। फिर भी पादटिप्पणी मूल क्रिया की व्यापक अर्थ-सीमा बचाती है और किसी बाद की सिद्धान्तगत व्यवस्था को पद में नहीं जोड़ती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। आलंकारिक प्रश्न की तीक्ष्णता तथा मूल हिब्रू की शब्दार्थगत गुंजाइश दोनों सुरक्षित रखी गई हैं।
