  text: Who has stripped off the front of his garment? Who can come within his double bridle?[a]
translation:
  language: hi
  text: उसके वस्त्र के बाहरी भाग को किसने उघाड़ा है? कौन उसकी दोहरी लगाम के भीतर प्रवेश कर सकता है?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी लगाम की तह में कौन प्रवेश कर सकता है?” इब्रानी अभिव्यक्ति कठिन है; यह रूपक के द्वारा लिव्यातान के मुँह, जबड़ों या दाँतों की दोहरी पंक्ति की ओर संकेत कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִלָּה
  choice: उघाड़ा है
  rationale: क्रिया का मूल अर्थ किसी ढके हुए भाग को खोलना या प्रकट करना है। ‘उघाड़ा’ वस्त्र के रूपक को बनाए रखता है और हिंसक उतारने का अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: פְּנֵי לְבוּשׁוֹ
  choice: उसके वस्त्र का सामने का भाग
  rationale: פְּנֵי को ‘सामने का भाग’ और לְבוּשׁ को ‘वस्त्र’ रूप में रखकर बाहरी आवरण का ठोस रूपक सुरक्षित रहता है; इसे सीधे त्वचा या शल्क नहीं बनाया गया।
- source_word: בְּכֶפֶל
  choice: के दोहरे घेरे के भीतर
  rationale: כפל में दुहरेपन अथवा तह का भाव है। ‘दोहरे घेरे’ कठिन काव्यात्मक छवि को अपेक्षाकृत स्वाभाविक हिन्दी में रखता है, पर उसकी अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: רִסְנוֹ
  choice: उसके लगाम
  rationale: רסן का सामान्य अर्थ लगाम या मुखबंधन है। ‘लगाम’ प्रत्यक्ष शब्द-साम्य और लिव्यातान के मुख से जुड़े रूपक—संभवतः जबड़ों या दाँतों—दोनों को बनाए रखता है।
- source_word: מִי יָבוֹא
  choice: कौन जा सकता है
  rationale: प्रश्नवाचक सर्वनाम और अपूर्ण क्रिया यहाँ सामर्थ्य को चुनौती देते हैं। ‘जा सकता है’ असंभवता के निहित भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
