lexical_decisions:
- source_word: מִפִּיו
  choice: उसके मुँह से
  rationale: מִן के साथ פֶּה और 3 पुल्लिंग एकवचन प्रत्यय का स्वाभाविक अर्थ ‘उसके मुँह से’ है; यह सन्दर्भ में लिव्यातान के सजीव काव्यात्मक चित्रण को बनाए रखता है।
- source_word: לַפִּידִים
  choice: मशालें
  rationale: לַפִּידִים सामान्यतः मशालों या जलते हुए लट्ठों को दर्शाता है। ‘मशालें’ ठोस अग्निमय बिम्ब को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יַהֲלֹכוּ
  choice: निकलती हैं
  rationale: הלך का मूल अर्थ ‘चलना/जाना’ है, पर ‘उसके मुँह से’ के साथ यहाँ आशय बाहर आने का है; ‘निकलती हैं’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּידוֹדֵי אֵשׁ
  choice: आग की चिनगारियाँ
  rationale: כִּידוֹדֵי दुर्लभ और अर्थ की दृष्टि से विवादित है। काव्यात्मक समानांतरता में यह आग के तेजी से निकलते कणों या जलते प्रक्षेप्यों को सूचित करता है; ‘आग की चिनगारियाँ’ सन्दर्भगत बिम्ब को बिना अनावश्यक सैन्य विशिष्टता के व्यक्त करता है।
- source_word: יִתְמַלָּטוּ
  choice: उछलकर बाहर आती हैं
  rationale: מלט का मूल भाव ‘बच निकलना’ है, किन्तु यहाँ अग्निमय वस्तुओं के अचानक और वेग से बाहर आने का चित्र है; यह वाक्यांश उस गतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
