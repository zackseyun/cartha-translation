lexical_decisions:
- source_word: נַפְשׁוֹ
  choice: उसकी साँस
  rationale: נֶפֶשׁ का मूल अर्थ प्राण, जीवन या गला हो सकता है; यहाँ मुँह से निकलती ज्वाला के समानांतर अग्निमय उच्छ्वास का चित्र होने के कारण ‘साँस’ संदर्भानुकूल और स्वाभाविक है।
- source_word: גֶּחָלִים
  choice: अंगारों
  rationale: यह शब्द कोयले या अंगारे को दर्शाता है। हिंदी में अग्नि और धधकने के इस काव्यात्मक चित्र के लिए ‘अंगारे’ सटीक और सहज है।
- source_word: תְּלַהֵט
  choice: धधका देती है
  rationale: पिएल रूप किसी वस्तु को प्रज्वलित या धधकता करने का कारक भाव व्यक्त करता है; ‘धधका देती है’ उस कारकता और तीव्र अग्नि-चित्र दोनों को बनाए रखता है।
- source_word: וְלַהַב
  choice: और ... ज्वाला
  rationale: לַהַב एकवचन में ‘ज्वाला’ है; हिंदी वाक्य में ‘ज्वाला’ स्वाभाविक और काव्यात्मक रूप से उपयुक्त है।
- source_word: מִפִּיו
  choice: उसके मुँह से
  rationale: पूर्वसर्ग, संज्ञा और सर्वनाम-प्रत्यय का सीधा तथा स्वाभाविक हिंदी रूप।
- source_word: יֵצֵא
  choice: निकलती है
  rationale: क्रिया का अर्थ बाहर जाना या निकलना है; ‘मुँह से ... निकलती है’ आधुनिक हिंदी में सर्वाधिक सहज है।
