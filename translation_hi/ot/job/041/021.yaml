lexical_decisions:
- source_word: כְּקַשׁ
  choice: भूसे के समान
  rationale: קַשׁ का अर्थ भूसा या सूखी डंठलें हो सकता है। ‘भूसा’ आधुनिक हिन्दी में हल्की और हानिरहित वस्तु का बिंब स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֶחְשְׁבוּ
  choice: समझी जाती है
  rationale: חשׁב के निष्क्रिय रूप का अर्थ ‘मानी/समझी जाती है’ है; हिन्दी में कर्ता ‘गदा’ के अनुसार स्त्रीलिंग एकवचन रखा गया है।
- source_word: תוֹתָח
  choice: गदा
  rationale: यह दुर्लभ शब्द है और इसका ठीक अर्थ अनिश्चित है। युद्ध के प्रसंग और כידון के समानांतर एक प्रहारक हथियार के रूप में ‘गदा’ सहज है, जबकि विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְיִשְׂחַק
  choice: और वह ... हँसता है
  rationale: क्रिया का मूल अर्थ ‘हँसना’ है; प्रसंग में इसका कर्ता लिव्यातान है, इसलिए हिन्दी में ‘वह’ स्पष्ट किया गया है।
- source_word: לְרַעַשׁ
  choice: खड़खड़ाहट पर
  rationale: רַעַשׁ शोर, कंपन या खड़खड़ाहट को दर्शाता है। हथियार के संदर्भ में ‘खड़खड़ाहट’ उसकी धमकी भरी ध्वनि को बिना अर्थ को अधिक निश्चित किए व्यक्त करती है।
- source_word: כִּידוֹן
  choice: बरछी
  rationale: כידון भाला-जैसे, प्रायः फेंके जाने वाले हथियार को सूचित करता है। ‘बरछी’ साधारण आधुनिक हिन्दी में इस युद्धास्त्र को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
