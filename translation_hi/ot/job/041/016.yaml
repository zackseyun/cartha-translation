translation:
  language: hi
  text: 'उसका हृदय पत्थर के समान कठोर[a] है,

    और चक्की के निचले पाट के समान कठोर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठोस” या “दृढ़”; इब्रानी शब्द का शाब्दिक संबंध ढाली या उँडेली हुई वस्तु से है, इसलिए उसका भाव कठोर या ठोस होने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבּוֹ
  choice: उसका हृदय
  rationale: לֵב यहाँ प्राणी के भीतरी केंद्र को दर्शाता है; काव्यात्मक शारीरिक चित्रण में ‘हृदय’ स्वाभाविक और स्थापित हिन्दी रूप है।
- source_word: יָצוּק
  choice: कठोर
  rationale: יצק का मूल अर्थ ‘उँडेलना/ढालना’ है; यहाँ निष्क्रिय-गुणवाचक प्रयोग ढली हुई वस्तु जैसी कठोरता और ठोसपन व्यक्त करता है।
- source_word: כְּמוֹ אָבֶן
  choice: पत्थर के समान
  rationale: यह सीधे रूप में पत्थर से तुलना है; ‘के समान’ काव्यात्मक और सहज हिन्दी है।
- source_word: וְיָצוּק
  choice: हाँ, ... दृढ़
  rationale: दोहराया गया יָצוּק समानांतर पंक्ति में भाव को प्रबल करता है। ‘दृढ़’ कठोर/ठोस होने की निकटवर्ती छाया रखता है और हिन्दी में अनावश्यक यांत्रिक पुनरावृत्ति से बचता है; וְ को यहाँ पुष्टिकारक ‘हाँ’ से व्यक्त किया गया है।
- source_word: כְּפֶלַח תַּחְתִּית
  choice: चक्की के निचले पाट के समान
  rationale: इस पदबंध का संदर्भ चक्की के नीचे वाले भारी पत्थर से है। ‘चक्की का निचला पाट’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
