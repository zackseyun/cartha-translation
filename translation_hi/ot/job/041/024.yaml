  text: Behind him a path shines[b][a]; one would think the deep to be gray-haired.
translation:
  language: hi
  text: उसके पीछे एक पथ चमकता है[a]; गहरा समुद्र ऐसा लगता है, मानो उसके बाल पक गए हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके बाद एक पथ चमकता है।” इब्रानी पदबंध का अर्थ समय की दृष्टि से “उसके बाद” या स्थान की दृष्टि से “उसके पीछे” हो सकता है; पानी में पीछे छूटती लहर के प्रसंग में “उसके पीछे” अर्थ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “गहरे जल को पके बालोंवाला समझा जाता है।” सफेद झाग के कारण समुद्र ऐसा दिखता है, मानो उसके बाल पक गए हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחֲרָיו
  choice: उसके पीछे
  rationale: यह पदबंध स्थानिक या कालिक अर्थ दे सकता है। समुद्र में लिव्यातान के पीछे छूटती लहर की इस काव्यात्मक तस्वीर में स्थानिक अर्थ अधिक उपयुक्त है।
- source_word: יָאִיר
  choice: चमकता हुआ
  rationale: हिफ़ील रूप का अर्थ ‘प्रकाश देना’ या ‘चमकना’ है; यहाँ झाग से उजली दिखने वाली जलरेखा अभिप्रेत है।
- source_word: נָתִיב
  choice: मार्ग
  rationale: संज्ञा का अर्थ मार्ग या पगडंडी है; यहाँ यह पानी में पीछे छूटी चमकीली लीक का काव्यात्मक चित्र है।
- source_word: יַחְשֹׁב
  choice: मानो ... दिखाई देता है
  rationale: यद्यपि रूप व्याकरणतः तृतीय पुरुष एकवचन है, यहाँ इसे देखने वाले की सामान्य धारणा व्यक्त करने वाले निर्वैयक्तिक प्रयोग के रूप में समझना स्वाभाविक है।
- source_word: תְּהוֹם
  choice: गहरा समुद्र
  rationale: शब्द गहरे जल या अथाह जलराशि को दर्शाता है। ‘गहरा समुद्र’ आधुनिक हिन्दी में स्पष्ट रहते हुए काव्यात्मक आशय बनाए रखता है।
- source_word: לְשֵׂיבָה
  choice: पके बालोंवाला
  rationale: संज्ञा का अर्थ पके या सफेद बाल तथा वृद्धावस्था हो सकता है। यहाँ सफेद झाग के कारण समुद्र के पके बालोंवाला दिखने का मानवीकरण है।
