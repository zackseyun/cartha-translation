lexical_decisions:
- source_word: מַפְּלֵי
  choice: तहें
  rationale: यह शब्द शरीर के लटकते या मुड़े हुए भागों को दर्शाता है। ‘तहें’ देह-संबंधी ठोस बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְשָׂרוֹ
  choice: उसके मांस की
  rationale: בשר का मूल अर्थ ‘मांस’ है; ‘शरीर’ अधिक व्यापक और ‘खाल’ अधिक व्याख्यात्मक होता।
- source_word: דָבֵקוּ
  choice: आपस में चिपकी हुई हैं
  rationale: דבק निकटता से चिपके रहने का भाव देता है। बहुवचन ‘तहें’ के साथ ‘आपस में’ उनके परस्पर जुड़े होने को स्पष्ट करता है।
- source_word: יָצוּק
  choice: ढली हुई-सी दृढ़ता से जमी हैं
  rationale: यहाँ शब्द किसी पदार्थ के उँड़ेलकर या ढालकर स्थिर कर दिए जाने का बिंब देता है। हिन्दी में यह रूप उस रूपक और दृढ़ स्थिरता, दोनों को बनाए रखता है।
- source_word: עָלָיו
  choice: उस पर
  rationale: पूर्वसर्ग और सर्वनाम का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: בַּל
  choice: नहीं
  rationale: काव्यात्मक निषेध को बिना ‘कभी नहीं’ जैसी अतिरिक्त कालगत प्रबलता जोड़े व्यक्त करता है।
- source_word: יִמּוֹט
  choice: हिल सकतीं
  rationale: נפעל रूप का अर्थ हिलाया जाना, डगमगाना या स्थान से हटना हो सकता है। ‘हिल नहीं सकतीं’ इस प्रसंग में अचलता को स्वाभाविक रूप से व्यक्त करता है।
