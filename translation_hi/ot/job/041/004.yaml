  text: לא אַחֲרִ֥ישׁ בַּדָּ֑י/ו וּ/דְבַר גְּ֝בוּר֗וֹת וְ/חִ֣ין עֶרְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/004.yaml
  text: I will not keep silent about his limbs[a], or the account of his mighty strength and the grace of his proportions.
translation:
  language: hi
  text: मैं उसके अंगों, उसके बल के वर्णन और उसके विन्यास की शोभा के विषय में चुप न रहूँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसके अंगों, उसकी शक्तियों की बात और उसकी बनावट की शोभा के विषय में चुप न रहूँगा।”
    reason: मूल इब्रानी में ‘उसके बल के वर्णन’ का अर्थ ‘उसकी शक्तियों की बात’ भी हो सकता है, और ‘विन्यास’ के लिए ‘बनावट’ एक स्वाभाविक वैकल्पिक अर्थ है।
lexical_decisions:
- source_word: אַחֲרִישׁ
  choice: चुप न रहूँगा
  rationale: हिफ़ील रूप यहाँ बोलने से विरत रहने का भाव देता है; यह चयन वक्ता के प्रथम-पुरुष संकल्प को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: בַּדָּיו
  choice: उसके अंगों
  rationale: בַּד शरीर के भागों या अंगों को सूचित कर सकता है; लिव्यातान के शारीरिक वर्णन में ‘अंग’ ठोस और प्रसंगानुकूल है।
- source_word: דְבַר
  choice: के विषय में
  rationale: यहाँ रचना अगले पदों से संबंधित कथन या चर्चा प्रस्तुत करती है; हिन्दी में समानांतर वाक्य-विन्यास के साथ ‘के विषय में’ इसका स्वाभाविक संप्रेषण करता है।
- source_word: גְּבוּרוֹת
  choice: अपार शक्ति
  rationale: बहुवचन शब्द सामर्थ्य के प्रबल प्रदर्शनों या महान शक्ति को व्यक्त कर सकता है; शारीरिक वर्णन के संदर्भ में ‘अपार शक्ति’ उपयुक्त है।
- source_word: חִין
  choice: शोभा
  rationale: חֵן अनुग्रह, आकर्षण या सौंदर्य का बोध देता है; यहाँ प्राणी की देह-रचना के प्रभावशाली सौंदर्य के लिए ‘शोभा’ स्वाभाविक है।
- source_word: עֶרְכּוֹ
  choice: उसकी सुगठित देह
  rationale: ערך का मूल भाव क्रम, विन्यास या व्यवस्था है; शारीरिक प्रसंग में ‘सुगठित देह’ उस व्यवस्थित बनावट को सहज हिन्दी में व्यक्त करता है।
