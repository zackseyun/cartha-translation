translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सहज और गरिमापूर्ण शैली रखी गई है। ‘सुगठित देह की शोभा’ शाब्दिक ‘उसके विन्यास की शोभा’ की अपेक्षा अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल की वैकल्पिक संरचना और शब्दार्थ को सुरक्षित रखती है।
