  text: His sneezings flash forth light[b][a], and his eyes are like the eyelids of dawn.
translation:
  language: hi
  text: उसकी छींकें प्रकाश फैला देती हैं[a], और उसकी आँखें भोर की पलकों जैसी हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी छींकें प्रकाश को चमका देती हैं।” इब्रानी क्रिया कारणात्मक है और यह अभिव्यक्ति अत्यंत काव्यात्मक है।
    reason: lexical_alternative
  - marker: b
    text: “भोर की पलकें” दिन के आरम्भ में खुलते हुए पहले प्रकाश का इब्रानी काव्य-चित्र है।
    reason: cultural_note
lexical_decisions:
- source_word: עֲטִישֹׁתָיו
  choice: उसकी छींकों से
  rationale: यह संज्ञा עטש धातु से है और छींकने को दर्शाती है। बहुवचन तथा तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय को स्वाभाविक आधुनिक हिन्दी में इस रूप में व्यक्त किया गया है।
- source_word: תָּהֶל אוֹר
  choice: प्रकाश चमक उठता है
  rationale: हिफ़ील क्रिया प्रकाश को चमकाने या निकलने देने का भाव रखती है। हिन्दी में ‘छींकों से’ के साथ यह प्रयोग उस कारणात्मक तथा अत्यंत काव्यात्मक चित्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעֵינָיו
  choice: और उसकी आँखें
  rationale: संयोजक, बहुवचन संज्ञा और तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा और स्वाभाविक अनुवाद।
- source_word: כְעַפְעַפֵּי שָׁחַר
  choice: भोर की पलकों के समान
  rationale: עפעפים का शाब्दिक अर्थ ‘पलकें’ है और שחר ‘भोर’ है। असामान्य किंतु प्रभावशाली इब्रानी काव्य-चित्र को व्याख्यात्मक रूप से ‘पहली किरणें’ कहकर बदलने के बजाय सुरक्षित रखा गया है।
