  yaml_path: translation/ot/job/041/002.yaml
  text: No one is so fierce that he dares to stir him up[a]. Who then is he who can stand before me?
translation:
  language: hi
  text: कोई इतना उग्र नहीं कि उसे जगाने का साहस करे[a]। तब कौन है जो मेरे सामने खड़ा हो सके?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे उकसाकर जगाए।” इब्रानी क्रिया का अर्थ “जगाना” या “जगा देना” है; यहाँ आशय लिव्यातान को छेड़कर क्रोधित करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא אַכְזָר
  choice: कोई इतना उग्र नहीं
  rationale: निषेध और विशेषण को स्वाभाविक हिन्दी परिणाम-वाक्य के रूप में व्यक्त किया गया है। אַכְזָר यहाँ नैतिक ‘क्रूर’ से अधिक प्रसंगगत उग्रता और दुस्साहस का बोध कराता है।
- source_word: כִּי יְעוּרֶנּוּ
  choice: कि उसे जगाने का साहस करे
  rationale: 'עור का मूल अर्थ ‘जगाना/उकसाकर उठा देना’ है। ‘साहस करे’ कथन की आलंकारिक शक्ति स्पष्ट करता है: बात केवल नींद से जगाने की नहीं, लिव्यातान को छेड़ने की है।'
- source_word: וּמִי הוּא
  choice: तब कौन है
  rationale: संयोजक और प्रश्नवाचक पद का निष्कर्षात्मक बल ‘तब’ से व्यक्त होता है, जबकि הוּא का जोर हिन्दी प्रश्न-रचना में स्वाभाविक रूप से समाहित है।
- source_word: לְפָנַי יִתְיַצָּב
  choice: जो मेरे सामने खड़ा हो सके
  rationale: शाब्दिक स्थानिक रूप ‘मेरे सामने’ सुरक्षित है; התיצב का स्वयं खड़े होने या डटकर उपस्थित होने का भाव और आलंकारिक सामर्थ्य-प्रश्न ‘खड़ा हो सके’ से व्यक्त होता है।
theological_decisions:
- issue: पहले उपवाक्य में लिव्यातान से दूसरे में परमेश्वर की ओर संकेत-परिवर्तन
  choice: 'दूसरा उपवाक्य परमेश्वर को सूचित करता है: यदि कोई लिव्यातान को छेड़ने का साहस नहीं करता, तो परमेश्वर के सामने कौन खड़ा हो सकता है?'
  alternative: दोनों उपवाक्य केवल लिव्यातान के विषय में माने जाएँ।
  rationale: לְפָנַי में प्रथम पुरुष ‘मेरे सामने’ स्पष्ट रूप से बोलने वाले परमेश्वर की ओर संकेत करता है। इससे प्राणी से सृष्टिकर्ता की ओर ‘कितना अधिक’ वाला तर्क उभरता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली। ‘उग्र’ प्रसंगगत भयावहता को व्यक्त करता है; ‘जगाने का साहस करे’ मूल क्रिया और निहित दुस्साहस दोनों को बनाए रखता है।
