source:
  edition: WLC
  text: לֹֽא יַבְרִיחֶ֥/נּוּ בֶן קָ֑שֶׁת לְ֝/קַ֗שׁ נֶהְפְּכוּ ל֥/וֹ אַבְנֵי קָֽלַע־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/020.yaml
  text: The son of the bow cannot make him flee[a]; slingstones become like stubble to him.
translation:
  language: hi
  text: धनुषधारी उसे भगा नहीं सकता; गोफन के पत्थर उसके लिए भूसे के समान हो जाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַבְרִיחֶנּוּ
  choice: उसे भगा नहीं सकता
  rationale: ברח के हिफ़ईल रूप का अर्थ किसी को भागने पर विवश करना या खदेड़ना है; यह अनुवाद उसके कारणवाचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֶן קָשֶׁת
  choice: धनुषधारी
  rationale: शाब्दिक रूप से ‘धनुष का पुत्र’ एक इब्रानी मुहावरा है, जिसका अर्थ धनुष चलाने वाला व्यक्ति है। ‘धनुषधारी’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण है।
- source_word: לְקַשׁ
  choice: भूसे के समान
  rationale: קַשׁ सूखे डंठल, पुआल या भूसे जैसी हल्की वनस्पति-सामग्री को दर्शाता है। ‘भूसा’ यहाँ हल्के और तुच्छ प्रभाव की उपमा को सहजता से व्यक्त करता है।
- source_word: נֶהְפְּכוּ לוֹ
  choice: उसके लिए ... हो जाते हैं
  rationale: הפך का निफ़अल रूप अवस्था-परिवर्तन व्यक्त करता है; ‘उसके लिए ... हो जाते हैं’ सम्बन्धपरक अर्थ और परिवर्तन दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: אַבְנֵי קָלַע
  choice: गोफन के पत्थर
  rationale: यह समास गोफन से फेंके जाने वाले पत्थरों को दर्शाता है। ‘गोफन के पत्थर’ अर्थ को स्पष्ट और सीधे रूप में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप। इब्रानी मुहावरे בֶן קָשֶׁת का शाब्दिक रूप हिन्दी में अस्पष्ट होता, इसलिए उसके स्वीकृत भावार्थ ‘धनुषधारी’ को मुख्य पाठ में रखा गया है।
