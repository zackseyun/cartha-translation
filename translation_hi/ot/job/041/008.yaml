lexical_decisions:
- source_word: אֶחָד בְּאֶחָד
  choice: एक-दूसरे से
  rationale: यह इब्रानी प्रयोग हर एक के अगले से पारस्परिक रूप से सटे होने का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘एक-दूसरे से’ स्वाभाविक और स्पष्ट है।
- source_word: יִגַּשׁוּ
  choice: सटे रहते हैं
  rationale: सन्दर्भ में यह केवल निकट आने की क्रिया नहीं, बल्कि लिव्यातान के कवच-जैसे भागों के घनिष्ठ संपर्क को दर्शाता है।
- source_word: וְרוּחַ
  choice: हवा
  rationale: यहाँ भौतिक वर्णन में רוּחַ का अर्थ ‘हवा’ है; ‘वायु’ की अपेक्षा ‘हवा’ साधारण पाठक के लिए अधिक सहज है।
- source_word: לֹא יָבוֹא
  choice: नहीं निकल सकती
  rationale: नकार सहित अपूर्ण क्रिया घनिष्ठ जुड़ाव के कारण व्यावहारिक असम्भवता बताती है। हिन्दी में हवा के किसी संकरे अंतराल से जाने के लिए ‘निकल सकती’ स्वाभाविक है।
- source_word: בֵינֵיהֶם
  choice: उनके बीच से
  rationale: בין स्थानगत मध्यावकाश को बताता है; ‘बीच से’ हवा के आर-पार गुजरने के सन्दर्भ को स्पष्ट करता है।
