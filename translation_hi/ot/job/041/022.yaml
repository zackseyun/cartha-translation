  register: आधुनिक, गरिमापूर्ण और चित्रात्मक हिन्दी। ‘दाँवने की पटरी’ कृषि-उपकरण के बिंब को बनाए रखता है। तुलना को ‘मानो ... की तरह’ से व्यक्त किया गया है, जबकि वैकल्पिक वाक्य-विन्यास पादटिप्पणी में सुरक्षित है।
