base_translation:
  language: en
  yaml_path: translation/ot/job/041/022.yaml
  text: Under him are sharp shards of pottery[b][a]; he spreads himself like a threshing sledge over the mud.
translation:
  language: hi
  text: उसके नीचे मिट्टी के बर्तनों के नुकीले टुकड़े हैं; वह कीचड़ पर दाँवने की पटरी की तरह फैल जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कीचड़ को दाँवने की पटरी जैसा बना देता है।”
    reason: हिब्रू वाक्य-विन्यास में यह भी सम्भव है कि ‘कीचड़’ को क्रिया का कर्म और ‘दाँवने की पटरी’ को उसका परिणामी रूप माना जाए।
lexical_decisions:
- source_word: תַּחְתָּיו
  choice: उसके नीचे
  rationale: स्थानवाचक पूर्वसर्ग और तीसरे पुरुष एकवचन प्रत्यय का सीधा, स्वाभाविक हिन्दी रूप; संकेत लिव्यातान के नीचे की ओर है।
- source_word: חַדּוּדֵי חָרֶשׂ
  choice: मिट्टी के बरतन के नुकीले टुकड़े
  rationale: חַדּוּדֵי नुकीलेपन को और חָרֶשׂ मिट्टी के बरतन अथवा उसके टूटे टुकड़ों को सूचित करता है; यह रूप बिंब को स्पष्ट और सामान्य पाठक के लिए बोधगम्य रखता है।
- source_word: יִרְפַּד
  choice: अपने को बिछा देता है
  rationale: क्रिया बिछाने, परत बनाने या बिछौना करने का भाव देती है। यहाँ प्राणी के शरीर को कीचड़ पर बिछाने का अर्थ प्रसंगानुकूल है; हिन्दी में कर्म की पूर्ति के लिए 'अपने को' स्पष्ट किया गया है।
- source_word: חָרוּץ
  choice: दाँवने की पटरी
  rationale: यह नुकीले दाँतों वाली कृषि-वस्तु, अर्थात अनाज दाँवने की पटरी, को सूचित करता है। यह 'हेंगा' जैसे क्षेत्रीय शब्द की अपेक्षा अधिक व्यापक रूप से समझा जा सकता है।
- source_word: עֲלֵי טִיט
  choice: कीचड़ पर
  rationale: पूर्वसर्ग का सामान्य अर्थ 'पर' और טִיט का अर्थ कीचड़ या गारा है; यहाँ जलचर के नीचे की गीली भूमि के लिए 'कीचड़' स्वाभाविक है।
