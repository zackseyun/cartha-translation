  text: He makes the deep boil like a pot[a]; he makes the sea like a pot of ointment.
translation:
  language: hi
  text: 'वह गहरे जल को हाँड़ी की तरह खौला देता है;

    वह समुद्र को सुगंधित मिश्रण-सा बना देता है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इत्र बनाने वाले के मिश्रण-सा” अथवा “मरहम-सा।” इब्रानी शब्द किसी तैयार किए गए मिश्रण को दर्शाता है, जो प्रायः इत्र, सुगंध-द्रव्य या मरहम से जुड़ा होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יַרְתִּיחַ
  choice: खौला देता है
  rationale: हिफ़ील रूप का कारक अर्थ है—किसी वस्तु को उबलने या खौलने लगाना। ‘खौला देता है’ स्वाभाविक हिन्दी में इस कारक बल को बनाए रखता है।
- source_word: כַּסִּיר
  choice: हाँड़ी की तरह
  rationale: סִיר खाना पकाने के पात्र को दर्शाता है। ‘हाँड़ी’ उबलते द्रव की काव्यात्मक छवि को स्पष्ट और सहज रूप में व्यक्त करती है।
- source_word: מְצוּלָה
  choice: गहरे जल
  rationale: מְצוּלָה समुद्र की गहराई अथवा गहरे जल को दर्शाता है। ‘गहरे जल’ आधुनिक हिन्दी में सहज है और अगले चरण के ‘समुद्र’ के साथ समानांतरता रखता है।
- source_word: יָם
  choice: समुद्र
  rationale: יָם का सामान्य और ठोस अर्थ ‘समुद्र’ है; मूल काव्य-चित्र को सीधे बनाए रखा गया है।
- source_word: יָשִׂים
  choice: बना देता है
  rationale: שׂים का मूल अर्थ रखना या स्थापित करना है, पर इस उपमात्मक रचना में किसी वस्तु को वैसा कर देने का भाव है। ‘बना देता है’ इस प्रयोग को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּמֶּרְקָחָה
  choice: सुगंधित मिश्रण-सा
  rationale: מֶרְקָחָה किसी तैयार या मिश्रित पदार्थ को दर्शाता है, जो प्रायः इत्र, सुगंध-द्रव्य या मरहम से जुड़ा होता है। ‘सुगंधित मिश्रण’ व्यापक अर्थ को बनाए रखता है और अनिश्चितता को केवल ‘मरहम’ तक सीमित नहीं करता।
