  yaml_path: translation/ot/job/041/007.yaml
  text: Its proud rows of shields are shut up, sealed tightly.
translation:
  language: hi
  text: उसकी ढालों की पंक्तियाँ उसका गर्व हैं; वे कसकर मुहरबंद हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גַּאֲוָה
  choice: उसका गर्व
  rationale: संज्ञा का मूल अर्थ ‘गर्व/महिमा’ है। इसे ‘गर्वीली’ विशेषण बनाने के बजाय स्वतंत्र विधेय के रूप में रखना इब्रानी शब्द-क्रम और अर्थगत तनाव को सुरक्षित रखता है।
- source_word: אֲפִיקֵי מָגִנִּים
  choice: ढालों की पंक्तियाँ
  rationale: अֲפִיקֵי का अर्थ यहाँ व्यवस्थित कतारें/पंक्तियाँ समझना लेव्यातान के कवच-जैसे शल्कों के चित्र के अनुकूल है; מָגִנִּים का सामान्य अर्थ ‘ढालें’ रखा गया है।
- source_word: סָגוּר
  choice: वे ... मुहरबंद हैं
  rationale: ‘बंद’ का भाव अगली संज्ञा ‘मुहर’ के साथ मिलकर अभेद्य रूप से बंद होने का चित्र देता है।
- source_word: חוֹתָם צָר
  choice: कसकर मुहरबंद
  rationale: शाब्दिक रूप से ‘कसी/तंग मुहर’; स्वाभाविक हिन्दी में ऐसी मुहर का भाव व्यक्त किया गया है जो किसी दरार को खुला नहीं छोड़ती।
