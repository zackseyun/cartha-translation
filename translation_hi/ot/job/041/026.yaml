base_translation:
  language: en
  yaml_path: translation/ot/job/041/026.yaml
  text: He looks on everything that is high[a]; he is king over all the sons of pride.
translation:
  language: hi
  text: वह सब कुछ जो ऊँचा है, देखता है[a]; वह घमंड के सब पुत्रों का राजा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर घमंडी प्राणी को।”
    reason: גָּבֹהַּ का मूल अर्थ ‘ऊँचा’ है, पर यहाँ इसका भाव ‘घमंडी’ भी हो सकता है।
  - marker: b
    text: ‘घमंड के पुत्र’ इब्रानी का एक काव्यात्मक मुहावरा है, जो घमंडी स्वभाव वाले जनों या प्राणियों के वर्ग का संकेत कर सकता है। इसकी सटीक पहचान प्रसंग में खुली रहती है।
    reason: ‘घमंड के पुत्र’ वर्ग या स्वभाव बताने वाला रूपक है, जिसकी सटीक पहचान प्रसंग में खुली रहती है।
lexical_decisions:
- source_word: כָּל גָּבֹהַּ
  choice: जो कुछ ऊँचा है, उस सबको
  rationale: इब्रानी में एकवचन विशेषण के साथ כָּל व्यापक अर्थ देता है। यह अनुवाद ऊँचाई की ठोस छवि को बनाए रखता है और उसके संभावित रूपकात्मक अर्थ—घमंड या बड़प्पन—को खुला छोड़ता है।
- source_word: יִרְאֶה
  choice: देखता है
  rationale: רָאָה का सीधा अर्थ ‘देखना’ है। सरल हिन्दी यहाँ मूल की संक्षिप्त काव्यात्मक अभिव्यक्ति को सुरक्षित रखती है।
- source_word: הוּא מֶלֶךְ
  choice: वह ... राजा है
  rationale: स्वतंत्र सर्वनाम הוּא विषय पर बल देता है, और מֶלֶךְ की राजकीय तथा सर्वोच्चता की छवि ‘राजा’ से यथावत रहती है।
- source_word: עַל
  choice: पर
  rationale: राजत्व या प्रभुत्व के संबंध में ‘पर’ स्वाभाविक हिन्दी है।
- source_word: כָּל בְּנֵי שָׁחַץ
  choice: घमंड के सब पुत्रों
  rationale: यह मूल इब्रानी रूपक ‘घमंड के पुत्र’ को बनाए रखता है। पादटिप्पणी आधुनिक पाठक के लिए इसका भाव स्पष्ट करती है, पर इसे किसी एक वर्ग—पशु, मनुष्य या दैवी शक्ति—तक सीमित नहीं करती।
theological_decisions:
- issue: ‘घमंड के सब पुत्रों’ की पहचान
  choice: मूल के व्यापक काव्यात्मक वर्ग-सूचक रूपक को बनाए रखा गया है।
  alternative: इसे विशेष रूप से हिंसक पशुओं, घमंडी प्राणियों या विश्वव्यापी शक्तियों के रूप में स्पष्ट करना।
  rationale: इब्रानी वाक्यांश किसी एक वर्ग को निश्चित नहीं करता। शाब्दिक रूपक और व्याख्यात्मक पादटिप्पणी मिलकर इस अनिश्चितता तथा लिव्यातान की सर्वोच्चता के दावे को सुरक्षित रखते हैं।
- issue: גָּבֹהַּ का ठोस या नैतिक अर्थ
  choice: मुख्य पाठ में ‘ऊँचा’, पादटिप्पणी में ‘घमंडी’ विकल्प।
  alternative: मुख्य पाठ में केवल ‘घमंडी’ रखना।
  rationale: ‘ऊँचा’ शब्द मूल की ठोस छवि बनाए रखता है, जबकि प्रसंग में संभावित अहंकार का अर्थ पादटिप्पणी द्वारा सामने आता है; इस प्रकार अर्थगत तनाव को समय से पहले हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘घमंड के पुत्रों’ जैसी असामान्य किंतु अर्थपूर्ण काव्यात्मक छवि मूल से सुरक्षित रखी गई है और सहज समझ के लिए पादटिप्पणी दी गई है।
