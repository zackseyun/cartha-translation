  yaml_path: translation/ot/job/041/014.yaml
  text: In his neck strength lodges[a], and before him dismay leaps.
translation:
  language: hi
  text: 'उसकी गर्दन में सामर्थ्य बसा रहता है,

    और उसके आगे निराशा उछलती है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसके आगे आतंक उछलता है।” इब्रानी संज्ञा דְּאָבָה दुर्लभ है; इस काव्यात्मक प्रसंग में इसका अर्थ निराशा, हताशा या आतंक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּצַוָּארוֹ
  choice: उसकी गरदन में
  rationale: בְּ का स्थानवाचक अर्थ और प्रत्यययुक्त צַוָּאר का सीधा बिंब सुरक्षित रहता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: יָלִין
  choice: निवास करती है
  rationale: לין के मूल अर्थ ‘रात बिताना/टिकना’ से यहाँ स्थायी उपस्थिति का मानवीकरण व्यक्त होता है। ‘निवास करती है’ काव्यात्मक और सहज है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह עֹז के बल या शक्ति के अर्थ को गरिमापूर्ण, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּלְפָנָיו
  choice: और उसके आगे
  rationale: פָּנִים के साथ बना मुहावरा यहाँ ‘उसके सामने/आगे’ है; ‘उसके आगे’ उस गति-बिंब से मेल खाता है जिसमें भाव उसके आगे चलता है।
- source_word: תָּדוּץ
  choice: उछलती चलती है
  rationale: दुर्लभ क्रिया דוץ के उछलने या कूदने के सक्रिय काव्य-बिंब को सुरक्षित रखता है; ‘चलती है’ जोड़ने से हिन्दी में आगे बढ़ने का आशय सहज होता है।
- source_word: דְּאָבָה
  choice: निराशा
  rationale: दुर्लभ संज्ञा भयजनित हताशा, निरुत्साह या आतंक का संकेत दे सकती है। ‘निराशा’ इसके व्यापक नकारात्मक भाव को बिना अत्यधिक निश्चित किए व्यक्त करती है।
