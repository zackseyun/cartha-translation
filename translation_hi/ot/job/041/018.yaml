base_translation:
  language: en
  yaml_path: translation/ot/job/041/018.yaml
  text: The sword that reaches him cannot stand[a]; nor can spear, dart[b], or javelin.
translation:
  language: hi
  text: उस तक पहुँचने वाली तलवार भी टिक नहीं सकती[a]; न तो भाला, न प्रक्षेपास्त्र[b], न बरछी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तलवार उसे जा पकड़ती है, वह प्रभावी नहीं होती।” इब्रानी में शाब्दिक रूप से तलवार के “न टिकने” की बात है।
    reason: lexical_alternative
  - marker: b
    text: “प्रक्षेपास्त्र” और “बरछी” के लिए प्रयुक्त इब्रानी शब्द दुर्लभ हैं और उनका ठीक अर्थ अनिश्चित है। पहले का अर्थ “प्रक्षेप्य” या “डंडाकार शलाका,” और दूसरे का अर्थ “कवच” या “बख्तर” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַשִּׂיגֵהוּ
  choice: जो ... उस तक पहुँचती है
  rationale: क्रिया का अर्थ ‘पहुँचना, जा पकड़ना’ है। तलवार के संदर्भ में ‘उस तक पहुँचती है’ स्वाभाविक है और प्रहार या घायल करने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: חֶרֶב
  choice: तलवार
  rationale: यह तलवार के लिए सामान्य इब्रानी संज्ञा है; हिन्दी में बिना निश्चयवाचक चिह्न के इसका सामान्य वर्गगत प्रयोग स्वाभाविक है।
- source_word: בְּלִי תָקוּם
  choice: टिक नहीं सकती
  rationale: शाब्दिक बिंब ‘खड़ी नहीं रह सकती’ है। ‘टिक नहीं सकती’ उस ठोस बिंब और उसके निष्फल होने के भाव, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: חֲנִית
  choice: भाला
  rationale: यह भेदने वाले लंबे हथियार का सामान्य शब्द है; ‘भाला’ आधुनिक हिन्दी में स्पष्ट और सुलभ है।
- source_word: מַסָּע
  choice: प्रक्षेपास्त्र
  rationale: यह दुर्लभ और अनिश्चित संज्ञा प्रसंग में किसी फेंके या छोड़े जाने वाले हथियार को सूचित करती जान पड़ती है। ‘प्रक्षेपास्त्र’ अनिश्चितता को किसी अत्यधिक विशिष्ट हथियार में सीमित नहीं करता।
- source_word: וְשִׁרְיָה
  choice: बरछी
  rationale: हथियारों की इस सूची में नुकीले प्रक्षेप्य हथियार का अर्थ प्रसंगानुकूल है। फिर भी ‘कवच’ का अर्थ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
