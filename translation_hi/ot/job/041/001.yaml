  text: הֵן תֹּחַלְתּ֥/וֹ נִכְזָ֑בָה הֲ/גַ֖ם אֶל מַרְאָ֣י/ו יֻטָֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/001.yaml
  text: Behold[a], his hope proves false[b]; is one not cast down even at the sight of him?
translation:
  language: hi
  text: देखो, उसकी आशा झूठी सिद्ध होती है[a]; क्या उसके दर्शन मात्र से ही कोई धराशायी नहीं हो जाता?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी अपेक्षा निष्फल हो जाती है” अथवा “उसका भरोसा टूट जाता है।” इब्रानी क्रिया इस बात पर बल दे सकती है कि आशा भ्रामक या निराश करने वाली सिद्ध होती है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या उसे देखते ही कोई गिर नहीं पड़ता?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵן
  choice: देखो
  rationale: यह शब्द ध्यान आकर्षित करते हुए कथन पर बल देता है। ‘देखो’ काव्यात्मक गरिमा बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: תֹּחַלְתּוֹ
  choice: उसकी आशा
  rationale: संज्ञा का मूल अर्थ आशा या अपेक्षा है। ‘आशा’ सीधा, स्वाभाविक और प्रसंगानुकूल है।
- source_word: נִכְזָבָה
  choice: झूठी सिद्ध होती है
  rationale: כזב से बना यह रूप किसी आशा के अंततः मिथ्या, भ्रामक या निष्फल निकलने का परिणामसूचक भाव रखता है। ‘झूठी सिद्ध होती है’ इस अर्थ और कर्मवाच्य परिणाम को सुरक्षित रखता है।
- source_word: הֲגַם
  choice: क्या ... ही ... नहीं
  rationale: प्रश्नवाचक और बलवर्धक कणों का मेल आलंकारिक प्रश्न बनाता है। हिन्दी में ‘क्या ... ही ... नहीं’ प्रश्न और ‘यहाँ तक कि’ वाले बल, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל מַרְאָיו
  choice: उसके दर्शन मात्र से
  rationale: यह पदबंध उसके रूप को देखने से उत्पन्न प्रतिक्रिया बताता है। ‘दर्शन मात्र से’ केवल देखने भर पर बल देता है और हिन्दी में संक्षिप्त तथा गरिमापूर्ण है।
- source_word: יֻטָל
  choice: धराशायी हो जाता
  rationale: यह टूल/नटल धातु का होफ़अल रूप है, जिसका अर्थ फेंका जाना, गिरा दिया जाना या परास्त होकर ढह जाना हो सकता है। ‘धराशायी हो जाता’ निष्क्रिय परिणाम और भय से गिर पड़ने की छवि दोनों बनाए रखता है।
