  text: Who has opened the doors of his face? Around his teeth is terror[a][b].
translation:
  language: hi
  text: उसके चेहरे के द्वार किसने खोले हैं? उसके दाँतों के चारों ओर आतंक है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मुँह के द्वार कौन खोल सकता है?” इब्रानी में शाब्दिक रूप से “उसके चेहरे के द्वार” है—यह मुँह या जबड़ों के लिए प्रयुक्त काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके दाँतों के चारों ओर दहशत है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּלְתֵי
  choice: द्वार
  rationale: इब्रानी बहुवचन रूप का शाब्दिक अर्थ ‘द्वार’ है। यह जीव के मुँह या जबड़ों का सजीव काव्यात्मक रूपक बनाए रखता है; ‘जबड़े’ अधिक व्याख्यात्मक होगा।
- source_word: פָנָיו
  choice: उसके चेहरे
  rationale: संज्ञा का सामान्य अर्थ ‘चेहरा’ या ‘सामने का भाग’ है। यहाँ वह मुँह वाले हिस्से की ओर संकेत करती है, पर मुख्य पाठ में इब्रानी बिंब को सुरक्षित रखा गया है।
- source_word: מִי
  choice: किसने
  rationale: यह आलंकारिक प्रश्न आरम्भ करने वाला सामान्य प्रश्नवाचक सर्वनाम है।
- source_word: פִתֵּחַ
  choice: खोले हैं
  rationale: פתח का अर्थ ‘खोलना’ है। पूर्ण क्रिया को हिन्दी में सहज पूर्ण पक्ष ‘खोले हैं’ से व्यक्त किया गया है; ‘कौन खोल सकता है’ सामर्थ्य की प्रसंगगत व्याख्या है।
- source_word: סְבִיבוֹת
  choice: चारों ओर
  rationale: यह आसपास या घेरे हुए होने का बोध देता है; ‘चारों ओर’ हिन्दी में स्वाभाविक और चित्रात्मक है।
- source_word: שִׁנָּיו
  choice: उसके दाँतों
  rationale: मूल शब्द का सामान्य अर्थ ‘दाँत’ है; ‘नुकीले दाँत’ कहना मूल से अधिक अर्थ जोड़ता।
- source_word: אֵימָה
  choice: आतंक
  rationale: यह संज्ञा तीव्र भय या दहशत व्यक्त करती है। ‘आतंक’ संक्षिप्त और प्रभावशाली है तथा इब्रानी नामवाचक कथन की तीव्रता बनाए रखता है।
