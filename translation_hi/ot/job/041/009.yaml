  yaml_path: translation/ot/job/041/009.yaml
  text: Each one sticks to its fellow[a]; they are clasped together and cannot be separated.
translation:
  language: hi
  text: हर एक अपने साथी से चिपका रहता है[a]; वे आपस में ऐसे जकड़े हैं कि अलग नहीं हो सकते।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हर एक अपने भाई से चिपका रहता है”; शल्कों के इस काव्यात्मक वर्णन में “भाई” अधिक शाब्दिक विकल्प है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ אִישׁ मनुष्य का नहीं, लेव्यातान के कवचों/शल्कों में से प्रत्येक का वितरणात्मक बोध कराता है; ‘हर एक’ उसी एक-एक इकाई पर बल रखता है।
- source_word: בְּאָחִיהוּ
  choice: अपने साथी से
  rationale: शाब्दिक अर्थ ‘अपने भाई से/के साथ’ है। निर्जीव शल्कों के काव्यात्मक वर्णन में ‘अपने साथी से’ निकटवर्ती समान इकाई का संबंध स्वाभाविक ढंग से व्यक्त करता है; औपचारिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְדֻבָּקוּ
  choice: चिपका रहता है
  rationale: דבק घनिष्ठ रूप से लगे या सटे रहने का भाव देता है। वितरणात्मक एकवचन ‘हर एक’ के साथ यह हिंदी में सजीव और स्वाभाविक है।
- source_word: יִתְלַכְּדוּ
  choice: आपस में ऐसे जकड़े हैं
  rationale: यह क्रिया पकड़े जाने, परस्पर फँसने या मजबूती से बँधे होने का भाव देती है। ‘जकड़े’ शल्कों की कसकर जुड़ी बनावट को स्पष्ट रखता है।
- source_word: וְלֹא יִתְפָּרָדוּ
  choice: कि अलग नहीं हो सकते
  rationale: निषेध के साथ क्रिया उनके दृढ़ जुड़ाव का परिणाम बताती है। ‘अलग नहीं हो सकते’ व्यावहारिक असंभवता को सहज आधुनिक हिंदी में व्यक्त करता है।
