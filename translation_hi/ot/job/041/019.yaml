  text: वह लोहे को भूसा समझता है और काँसे को सड़ी हुई लकड़ी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַחְשֹׁב
  choice: समझता है
  rationale: यहाँ חשׁב मूल्यांकन या किसी वस्तु को किसी रूप में मानने का भाव देता है; ‘समझता है’ स्वाभाविक हिन्दी में वही अर्थ रखता है।
- source_word: לְתֶבֶן
  choice: भूसा
  rationale: תבן सामान्यतः भूसे या चारे के सूखे तिनकों को दर्शाता है; तुलना के इस प्रसंग में ‘भूसा’ लोहे को तुच्छ और निर्बल मानने का चित्र स्पष्ट करता है।
- source_word: בַּרְזֶל
  choice: लोहा
  rationale: यह इस धातु के लिए मानक और प्रसंगानुकूल हिन्दी शब्द है।
- source_word: לְעֵץ רִקָּבוֹן
  choice: सड़ी हुई लकड़ी
  rationale: यह वाक्यांश शाब्दिक रूप से ‘सड़न की लकड़ी’ है; ‘सड़ी हुई लकड़ी’ आधुनिक हिन्दी में स्वाभाविक है और निर्बलता का बिंब बनाए रखती है।
- source_word: נְחוּשָׁה
  choice: काँसा
  rationale: נְחוּשָׁה ताँबे अथवा काँसे को सूचित कर सकता है। शस्त्र और मजबूत धातुओं के प्रसंग में ‘काँसा’ पारंपरिक तथा संभावित अर्थ है।
