translation_notes:
  register: आधुनिक, गरिमापूर्ण और चित्रात्मक हिन्दी। ‘धौंककर सुलगाई गई’ मूल के נָפוּחַ में निहित फूँकने/धौंकने के भाव को रखता है। यद्यपि संयुक्त उपमा हिन्दी में कुछ असामान्य है, उसे मूल की वास्तविक संरचनात्मक अस्पष्टता बचाने के लिए अनावश्यक रूप से स्पष्ट नहीं किया गया।
