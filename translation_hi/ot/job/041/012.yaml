  text: Smoke goes out from his nostrils[b][a], like a boiling pot and burning rushes.
translation:
  language: hi
  text: 'उसके नथुनों से धुआँ निकलता है,

    मानो धौंककर तपाई हुई देग और जलते सरकंडों से उठ रहा हो।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देग’ के स्थान पर ‘हाँड़ी’ भी सम्भव है; इब्रानी शब्द पकाने के बर्तन या बड़ी केतली-जैसी देग को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ सरकंडों का उल्लेख सम्भवतः आग में ईंधन के रूप में काम आने वाले सरकंडों की ओर है, जिनसे घना धुआँ उठता है।
    reason: cultural_note
lexical_decisions:
- source_word: מִנְּחִירָיו
  choice: उसके नथुनों से
  rationale: नְחִירַיִם का ठोस शारीरिक बिंब ‘नथुनों’ से स्वाभाविक और स्पष्ट रूप में बना रहता है।
- source_word: יֵצֵא עָשָׁן
  choice: धुआँ निकलता है
  rationale: अपूर्ण क्रिया यहाँ काव्यात्मक वर्णन में स्वभावगत क्रिया बताती है; वर्तमानकालीन ‘निकलता है’ सहज हिन्दी है।
- source_word: כְּדוּד
  choice: मानो ... हाँड़ी
  rationale: דּוּד पकाने के बर्तन या बड़ी देग को सूचित कर सकता है; ‘हाँड़ी’ सामान्य पाठक के लिए सुलभ है और बर्तन का बिंब बनाए रखती है।
- source_word: נָפוּחַ
  choice: धौंककर सुलगाई गई
  rationale: यह रूप फूँके या धौंके जाने का भाव रखता है। केवल ‘उबलती’ कहने के बजाय यह मूल की धौंककर प्रज्वलित करने वाली छवि को बचाता है।
- source_word: וְאַגְמֹן
  choice: और सरकंडे
  rationale: אַגְמוֹן नरकट या सरकंडे जैसे दलदली पौधे को दर्शाता है; प्रसंग में इनके ईंधन की तरह सुलगने की संभावना है, जिसे टिप्पणी में स्पष्ट किया गया है।
