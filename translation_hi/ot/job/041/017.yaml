  text: מִ֭/שֵּׂת/וֹ יָג֣וּרוּ אֵלִ֑ים מִ֝/שְּׁבָרִ֗ים יִתְחַטָּֽאוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/job/041/017.yaml
  text: At his rising the mighty are afraid; at the crashing they are beside themselves.
translation:
  language: hi
  text: उसके उठ खड़े होने पर शक्तिशाली भी डर जाते हैं; धमाकों से वे अपनी सुध-बुध खो बैठते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשֵּׂתוֹ
  choice: उसके उठ खड़े होने पर
  rationale: שֵׂת यहाँ उस प्राणी के उठने या स्वयं को ऊँचा करने को दर्शाता है; यह सहज हिन्दी में दृश्य और भय का कारण दोनों स्पष्ट करता है।
- source_word: אֵלִים
  choice: शक्तिशाली भी
  rationale: אֵלִים का रूप ‘देवताओं’ या ‘बलवानों/शक्तिशालियों’ के रूप में समझा जा सकता है। प्रसंग में बड़े सामर्थ्यवान प्राणियों या योद्धाओं का भय अधिक स्वाभाविक है; ‘भी’ विरोधाभास को हिन्दी में व्यक्त करता है।
- source_word: מִשְּׁבָרִים
  choice: धमाकों से
  rationale: बहुवचन שְׁבָרִים टूटने, प्रचंड टकराहट या उससे उठने वाली गड़गड़ाहट/धमाकों की ओर संकेत कर सकता है। ‘धमाकों’ से मूल का बहुवचन और भयावह श्रव्य प्रभाव बना रहता है।
- source_word: יִתְחַטָּאוּ
  choice: वे अपनी सुध-बुध खो बैठते हैं
  rationale: इस दुर्लभ प्रसंगगत प्रयोग का अर्थ घबराहट में दिशाहीन या अपने ऊपर काबू न रहना है; यह हिन्दी प्रयोग उस तीव्र आतंक को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: אֵלִים को ‘देवता’ या ‘शक्तिशाली’ समझना
  choice: शक्तिशाली
  alternative: देवता
  rationale: अय्यूब 41 के प्रसंग में लेवीयातान के सामने सबसे बलवानों का भी भयभीत होना मुख्य भाव है। ‘देवता’ सम्भव व्युत्पत्तिगत अर्थ है, पर यहाँ अनावश्यक रूप से किसी विशिष्ट देवसमूह का दावा कर सकता है।
- issue: יִתְחַטָּאוּ का अर्थ
  choice: अपनी सुध-बुध खो बैठते हैं
  alternative: अपने को शुद्ध करते हैं / पीछे हट जाते हैं
  rationale: क्रिया सामान्यतः חטא से जुड़ी है, पर इस पद में उसका रूप और संदर्भ कठिन है। भय से बदहवास होने का अर्थ पद की समानांतरता और प्राचीन अनुवाद-परंपरा के एक प्रमुख पाठ से मेल खाता है, बिना कोई धर्मसिद्धान्त जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक पाठ के अनुकूल शैली। ‘शक्तिशाली भी’ और ‘सुध-बुध खो बैठते हैं’ सामान्य पाठक के लिए सहज हैं, जबकि मूल की तीव्रता और काव्यात्मक समानांतरता बनाए रखते हैं।
