lexical_decisions:
- source_word: וַתֵּכַהּ
  choice: धुँधली हो गई है
  rationale: כהה का अर्थ धुँधला, मंद या क्षीण होना है। यह रूप आँख की घटती ज्योति और परिणामी अवस्था—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִכַּעַשׂ
  choice: शोक के कारण
  rationale: כַּעַשׂ भावनात्मक व्याकुलता, खीझ, क्रोध या शोक को सूचित कर सकता है। अय्यूब के विलाप और दुःख के प्रसंग में ‘शोक’ सर्वाधिक स्वाभाविक है; अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: עֵינִי
  choice: मेरी आँख
  rationale: इब्रानी में संज्ञा एकवचन है और यहाँ दृष्टि का प्रतिनिधित्व करती है; हिन्दी में भी एकवचन काव्यात्मक तथा सहज है।
- source_word: וִיצֻרַי
  choice: मेरे सारे अंग
  rationale: इस दुर्लभ रूप का आशय सम्भवतः शरीर के अंगों, आकृति या समूची देह-रचना से है। ‘अंग’ आँख के साथ समानांतरता बनाए रखता है और सामान्य पाठक के लिए स्पष्ट है, जबकि अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: כַּצֵּל
  choice: छाया के समान
  rationale: यह मूल उपमा को बनाए रखता है और क्षीणता तथा सारहीनता का काव्यात्मक बिंब व्यक्त करता है।
- source_word: כֻּלָּם
  choice: सारे
  rationale: यह अय्यूब के अंगों की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
