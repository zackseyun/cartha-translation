  yaml_path: translation/ot/job/017/012.yaml
  text: They make night into day; they say, ‘Light is near,’ in the face of darkness.
translation:
  language: hi
  text: वे रात को दिन बना देते हैं; अँधेरे के सामने वे कहते हैं, “उजाला निकट है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में “वे कहते हैं” शब्द नहीं हैं; शाब्दिक रूप से: “अँधेरे के सामने उजाला निकट है।”'
    reason: अनुवाद में स्पष्टता के लिए जोड़े गए कथन-सूचक शब्द की जानकारी देना और मूल की वाक्यगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: לַיְלָה לְיוֹם יָשִׂימוּ
  choice: वे रात को दिन बना देते हैं
  rationale: मुहावरे की उलटबाँसी को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; יָשִׂימוּ का मूल अर्थ ‘रखना/बनाना’ है।
- source_word: אוֹר קָרוֹב
  choice: उजाला निकट है
  rationale: אוֹר के लिए ‘उजाला’ साधारण आधुनिक हिन्दी में स्वाभाविक है और यहाँ अँधेरे के साथ उसका विरोध भी स्पष्ट रखता है।
- source_word: מִפְּנֵי חֹשֶׁךְ
  choice: अँधेरे के सामने
  rationale: इस पदबंध की स्थानिक छवि को संरक्षित किया गया है; इसे केवल ‘अँधेरे के कारण’ या ‘अँधेरे के बीच’ बनाकर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: ‘उजाला निकट है’ को कथन के रूप में प्रस्तुत करना
  choice: वे कहते हैं, “उजाला निकट है।”
  alternative: अँधेरे के सामने उजाला निकट है
  rationale: इब्रानी में ‘कहते हैं’ व्यक्त नहीं है, पर दूसरी पंक्ति को पहली पंक्ति के कर्ता का दावा मानना प्रसंगानुकूल और हिन्दी में स्पष्ट है। इस पूर्ति को पादटिप्पणी में पारदर्शी बनाया गया है, बिना यह तय किए कि ‘वे’ कौन हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘अँधेरे के सामने’ मूल रूपक को बनाए रखता है, जबकि उद्धरण-विन्यास पद की विडंबना को सामान्य पाठक के लिए स्पष्ट करता है।
