translation:
  language: hi
  text: मैं गड्ढे को पुकारता हूँ, ‘तू मेरा पिता है,’ और कीड़े को, ‘तू मेरी माँ और मेरी बहन है।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁחַת
  choice: कब्र
  rationale: यह शब्द गड्ढे, कब्र या विनाश की अवस्था का संकेत दे सकता है। प्रसंग में अय्यूब कब्र को अपना निकट संबंधी कहता है, इसलिए आधुनिक हिंदी में ‘कब्र’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: קָרָאתִי
  choice: पुकारकर कहता हूँ
  rationale: קרא का अर्थ पुकारना अथवा संबोधित करना है। हिंदी में ‘पुकारकर कहता हूँ’ संबोधन और कथन—दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: רִמָּה
  choice: कीड़ा
  rationale: यह शव को खाने वाले कीड़े या कृमि के लिए प्रयुक्त एकवचन सामूहिक संज्ञा है; ‘कीड़ा’ सरल, स्वाभाविक और मूल के एकवचन रूप के अनुरूप है।
theological_decisions:
- issue: कब्र और कीड़े को पारिवारिक संबोधन
  choice: 'रूपक को सीधे बनाए रखा गया: ‘तू मेरा पिता है… तू मेरी माँ और मेरी बहन है।’'
  alternative: इसे व्याख्यात्मक रूप से ‘मृत्यु ही मेरा परिवार है’ कहना
  rationale: मूल की तीखी काव्यात्मक मानवीकरण-छवि और अय्यूब की निराशा को बिना धर्मवैज्ञानिक विस्तार या समाधान के सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और काव्यात्मक है। ‘तू’ निर्जीव कब्र और कीड़े के प्रत्यक्ष एकवचन संबोधन के अनुरूप है; इसमें अनादर का अतिरिक्त भाव आरोपित नहीं किया गया।
