  yaml_path: translation/ot/job/017/004.yaml
  text: For you have hidden their heart from understanding[b][a]; therefore you will not exalt them.
translation:
  language: hi
  text: क्योंकि तूने उनके हृदय को समझ-बूझ से छिपा रखा है[a]; इसलिए तू उन्हें ऊँचा न उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हृदय’ का अर्थ ‘मन’ या ‘अंतरतम’ भी हो सकता है; हिब्रू में ‘हृदय’ प्रायः सोच और विवेक के केंद्र को दर्शाता है, केवल भावनाओं को नहीं।
    reason: lexical_alternative
  - marker: b
    text: या ‘तू उन्हें प्रतिष्ठित न करेगा’ अथवा ‘तू उन्हें विजयी न होने देगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह अगले कथन का आधार बताता है और हिन्दी में काव्यात्मक तर्क का स्वाभाविक संबंध बनाए रखता है।
- source_word: לִבָּם
  choice: उनके हृदय
  rationale: हिब्रू में ‘हृदय’ विचार, इच्छा और विवेक के भीतरी केंद्र को भी दर्शाता है; मूल रूपक सुरक्षित रखा गया है।
- source_word: צָפַנְתָּ
  choice: तूने ... छिपा रखा है
  rationale: क्रिया में छिपाने या अलग रख देने का भाव है; यह पूर्ण किए गए कार्य की वर्तमान परिणति भी स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשָּׂכֶל
  choice: समझ से दूर
  rationale: מִן अलगाव का भाव देता है और שׂכל यहाँ समझ या विवेक है; ‘से दूर’ हिन्दी में इस असामान्य किंतु अर्थपूर्ण चित्र को स्पष्ट रखता है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह पहले उपवाक्य से निकलने वाला परिणाम सूचित करने वाला सामान्य संबंधसूचक पद है।
- source_word: לֹא תְרֹמֵם
  choice: तू उन्हें ऊँचा न उठाएगा
  rationale: רום का मूल चित्र ऊपर उठाने या प्रतिष्ठित करने का है। यह रूप विजय दिलाने का संभावित संदर्भ भी खुला रखता है।
theological_decisions:
- issue: बहुवचन प्रत्ययों ‘उनके/उन्हें’ का संदर्भ
  choice: समूह की पहचान स्पष्ट किए बिना सर्वनामों को बनाए रखा गया है।
  alternative: उन्हें अय्यूब के विरोधियों या उनके साथियों के रूप में स्पष्ट करना।
  rationale: द्वितीय पुरुष की क्रियाएँ परमेश्वर को संबोधित हैं, जबकि तृतीय पुरुष बहुवचन किसी दूसरे समूह की ओर संकेत करता है; पद स्वयं उस समूह की स्पष्ट पहचान नहीं करता।
- issue: समझ से वंचित होने में परमेश्वर की भूमिका
  choice: ‘तूने ... छिपा रखा है’ द्वारा प्रत्यक्ष दिव्य कर्तृत्व सुरक्षित रखा गया है।
  alternative: इसे केवल इस अर्थ में नरम करना कि परमेश्वर ने उन्हें समझने नहीं दिया।
  rationale: हिब्रू वाक्य प्रत्यक्ष रूप से परमेश्वर को क्रिया का कर्ता बताता है; उसके धर्मवैज्ञानिक तनाव को अनुवाद में कम नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण हिन्दी; अय्यूब की परमेश्वर से सीधी एकवचन संबोधन-शैली बनाए रखने के लिए ‘तू’ का प्रयोग किया गया है। ‘हृदय’ और ‘ऊँचा उठाना’ मूल हिब्रू के काव्यात्मक रूपकों को सुरक्षित रखते हैं; पादटिप्पणियाँ उनके संभावित अर्थ स्पष्ट करती हैं।
