- source_word: בַּדֵּי
  choice: सलाखों
  rationale: अधोलोक के संदर्भ में यह शब्द उसके फाटकों की रोकने या बंदी बनाने वाली सलाखों का काव्यात्मक बिंब देता है; ‘भागों’ की तुलना में यह प्रसंग के अधिक अनुकूल है।
- source_word: שְׁאֹל
  choice: अधोलोक
  rationale: यहाँ केवल व्यक्तिगत कब्र नहीं, मृतकों के लोक का व्यापक इब्रानी विचार है। ‘अधोलोक’ आधुनिक हिन्दी में उस अर्थ-सीमा को स्वाभाविक ढंग से बनाए रखता है।
- source_word: תֵּרַדְנָה
  choice: क्या वे ... उतर जाएँगी
  rationale: स्त्रीलिंग बहुवचन रूप संदर्भ में अय्यूब की आशाओं की ओर लौटता है। पूर्ववर्ती अलंकारिक प्रश्नों के कारण इसे प्रश्न के रूप में रखा गया है।
- source_word: אִם
  choice: क्या
  rationale: यहाँ אִם दूसरे अलंकारिक प्रश्न को आरंभ करता है; हिन्दी में ‘क्या’ उसका प्रश्नार्थक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַחַד
  choice: साथ-साथ
  rationale: यह आशाओं और अय्यूब के मृत्यु में एक साथ जाने के भाव को स्पष्ट तथा काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: עַל עָפָר
  choice: धूल में
  rationale: शाब्दिक ‘धूल पर’ संभव है, पर उतरने और मृत्यु के संदर्भ में हिन्दी का ‘धूल में उतरना’ अधिक स्वाभाविक है।
- source_word: נָחַת
  choice: उतरेंगे
  rationale: इसे ‘उतरना/अवरोह’ मानने से पहली पंक्ति के ירד के साथ काव्यात्मक समानांतरता बनी रहती है; ‘विश्राम करेंगे’ को वास्तविक वैकल्पिक समझ के रूप में पादटिप्पणी में रखा गया है।
