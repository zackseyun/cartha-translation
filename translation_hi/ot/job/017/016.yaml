  text: क्या वे अधोलोक की सलाखों तक उतर जाएँगी, जब धूल पर साथ-साथ विश्राम होगा?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधोलोक के भागों तक’ अथवा ‘अधोलोक के अर्गलों/सलाखों तक।’ इब्रानी बिंब संभवतः मृतकों के लोक के बंद करने वाले फाटकों या बंधनों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जब हम साथ-साथ धूल पर उतरेंगे।’ अंतिम इब्रानी शब्द को कुछ लोग ‘उतरना’ या ‘अवरोह’ समझते हैं; पर इसे ‘विश्राम’ समझना भी संभव है।
    reason: alternative_reading
