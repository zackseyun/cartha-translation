lexical_decisions:
- source_word: וְאַיֵּה
  choice: तो ... कहाँ
  rationale: אַיֵּה स्थानवाचक प्रश्नवाचक है, ‘कहाँ?’; आरंभिक וְ पिछले विलाप से संबंध जोड़ता है, जिसे स्वाभाविक हिन्दी में ‘तो’ व्यक्त करता है।
- source_word: אֵפוֹ
  choice: अब
  rationale: אֵפוֹ प्रश्न में बल अथवा निष्कर्षात्मक भाव जोड़ता है। ‘तो अब’ आधुनिक हिन्दी में इस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תִקְוָתִי
  choice: मेरी आशा
  rationale: תִּקְוָה का सामान्य अर्थ ‘आशा’ या ‘अपेक्षा’ है; इस विलाप में ‘आशा’ सबसे स्वाभाविक है।
- source_word: וְתִקְוָתִי
  choice: और मेरी आशा
  rationale: इब्रानी की पुनरुक्ति को उसके काव्यात्मक बल के लिए बनाए रखा गया है।
- source_word: מִי
  choice: कौन
  rationale: यह दूसरे प्रश्न को आरंभ करने वाला सामान्य व्यक्तिवाचक प्रश्नवाचक सर्वनाम है।
- source_word: יְשׁוּרֶנָּה
  choice: उसे कौन देख सकता है
  rationale: שׁור का अर्थ ‘देखना/निहारना’ है। संदर्भ में अपूर्ण क्रिया को सामर्थ्यसूचक रूप में लिया गया है; स्त्रीलिंग प्रत्यय का संकेत תִּקְוָה, ‘आशा’, की ओर है।
