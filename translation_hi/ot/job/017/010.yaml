source:
  edition: WLC
  text: וְֽ/אוּלָ֗ם כֻּלָּ֣/ם תָּ֭שֻׁבוּ וּ/בֹ֣אוּ נָ֑א וְ/לֹֽא אֶמְצָ֖א בָ/כֶ֣ם חָכָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/job/017/010.yaml
  text: But all of you[a], come back now, and come; I will not find a wise man among you.
translation:
  language: hi
  text: परन्तु तुम सब लौटो और अब आओ; मैं तुममें एक भी बुद्धिमान नहीं पाऊँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह प्रबल विरोधसूचक संक्रमण को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כֻּלָּם
  choice: तुम सब
  rationale: आगे के द्वितीय पुरुष बहुवचन क्रियारूपों के अनुसार अय्यूब अपने सभी साथियों को सीधे सम्बोधित कर रहा है।
- source_word: תָּשֻׁבוּ וּבֹאוּ נָא
  choice: फिर लौटकर आओ
  rationale: שוב और בוא की संयुक्त, आग्रहपूर्ण चुनौती को हिन्दी में अनावश्यक पुनरुक्ति के बिना व्यक्त करता है; 'फिर' उनके दोबारा अपना तर्क प्रस्तुत करने के प्रसंग को भी संप्रेषित करता है।
- source_word: וְלֹא אֶמְצָא
  choice: मैं ... नहीं पाऊँगा
  rationale: अपूर्ण क्रिया यहाँ आह्वान के बाद भावी अथवा परिणामी अर्थ देती है; यह असमर्थता का अतिरिक्त अर्थ जोड़े बिना उसे बनाए रखता है।
- source_word: בָכֶם
  choice: तुममें
  rationale: सम्बोधित समूह के भीतर किसी व्यक्ति के मिलने का स्थानसूचक अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: חָכָם
  choice: एक भी बुद्धिमान
  rationale: पुल्लिंग एकवचन गुणवाचक शब्द यहाँ संज्ञा के समान प्रयुक्त है; 'एक भी' नकार के दायरे को स्वाभाविक हिन्दी में स्पष्ट करता है और पुरुष साथियों के प्रसंग में 'बुद्धिमान' का रूप उपयुक्त है।
theological_decisions:
- issue: חָכָם का लिंगयुक्त और संज्ञात्मक अनुवाद
  choice: एक भी बुद्धिमान
  alternative: कोई बुद्धिमान व्यक्ति
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है और तत्काल प्रसंग अय्यूब के पुरुष साथियों का है। हिन्दी में 'बुद्धिमान' यहाँ पुरुषवाचक संज्ञा-सदृश रूप में स्वाभाविक है; 'व्यक्ति' जोड़ना स्रोत में निहित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का संक्षिप्त, दृढ़ और गरिमापूर्ण स्वर रखा गया है। पद की चुनौतीपूर्ण वाणी को 'फिर लौटकर आओ' से व्यक्त किया गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
