  text: My days have passed by; my plans are broken off[a], the desires of my heart.
translation:
  language: hi
  text: मेरे दिन बीत गए; मेरी योजनाएँ टूट गईं—मेरे हृदय की अभिलाषाएँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे हृदय की संपत्तियाँ,’ ‘मेरे हृदय की संजोई हुई वस्तुएँ,’ अथवा ‘मेरे हृदय की विरासतें।’ यहाँ प्रयुक्त इब्रानी अभिव्यक्ति दुर्लभ और कठिन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָמַי
  choice: मेरे दिन
  rationale: संज्ञा के साथ प्रथम पुरुष एकवचन प्रत्यय का सीधा और स्वाभाविक अनुवाद; यह जीवन के बीतते समय की इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: עָבְרוּ
  choice: बीत गए
  rationale: काल के विषय में עבר का स्वाभाविक हिन्दी प्रयोग; पूर्ण हो चुकी क्रिया और समय के निकल जाने का भाव व्यक्त करता है।
- source_word: זִמֹּתַי
  choice: मेरी योजनाएँ
  rationale: זִמָּה यहाँ उद्देश्य, विचार या योजना को सूचित कर सकता है। संदर्भ में ‘योजनाएँ’ स्वाभाविक है और अनावश्यक नकारात्मक नैतिक अर्थ से बचता है।
- source_word: נִתְּקוּ
  choice: टूट गईं
  rationale: נתק के निफ़अल रूप में अलग कर दिए जाने, तोड़े जाने या काट दिए जाने का भाव है। योजनाओं के संदर्भ में ‘टूट गईं’ सहज हिन्दी है और उनके विफल तथा समाप्त हो जाने की तीव्रता रखता है।
- source_word: מוֹרָשֵׁי
  choice: अभिलाषाएँ
  rationale: यह दुर्लभ और कठिन रूप है। प्रसंग और ‘हृदय’ के साथ इसका संबंध उन बातों की ओर संकेत कर सकता है जिन्हें मन संजोए या पाने की इच्छा रखे; इसलिए मुख्य पाठ में ‘अभिलाषाएँ’ चुना गया, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: לְבָבִי
  choice: मेरे हृदय की
  rationale: यह לבב के प्रथम पुरुष एकवचन रूप का मानक अनुवाद है और विचार, इच्छा तथा भीतरी जीवन के इब्रानी बिंब को बनाए रखता है।
theological_decisions:
- issue: מוֹרָשֵׁי לְבָבִי का दुर्लभ और अनिश्चित अर्थ
  choice: मेरे हृदय की अभिलाषाएँ
  alternative: मेरे हृदय की संपत्तियाँ; मेरे हृदय की संजोई हुई वस्तुएँ; मेरे हृदय की विरासतें
  rationale: मुख्य पाठ संदर्भगत समानांतरता के आधार पर इच्छाओं का भाव व्यक्त करता है, पर कठिन इब्रानी पद का अर्थ निश्चित न होने के कारण वैकल्पिक अर्थों को पादटिप्पणी में स्पष्ट रखा गया है; किसी विशेष धर्मवैज्ञानिक निष्कर्ष को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण विलाप। डैश अंतिम पदबंध को ‘मेरी योजनाएँ’ के समानाधिकरण के रूप में रखता है और मूल की सघन काव्यात्मक संरचना को अनावश्यक रूप से स्पष्ट नहीं करता।
