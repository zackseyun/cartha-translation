  yaml_path: translation/ot/job/017/008.yaml
  text: The upright are appalled at this[a], and the innocent stirs himself up against the godless.
translation:
  language: hi
  text: सच्चरित्र लोग इस पर स्तब्ध रह जाते हैं, और निर्दोष व्यक्ति अधर्मी के विरुद्ध जाग उठता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָשֹׁמּוּ
  choice: स्तब्ध रह जाते हैं
  rationale: शׁמם के काल रूप में यहाँ भय-मिश्रित विस्मय या गहरे आघात का भाव है। यह प्रयोग उस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְשָׁרִים
  choice: सीधे-सच्चे लोग
  rationale: बहुवचन विशेषण यहाँ संज्ञा के रूप में नैतिक रूप से खरे लोगों को दर्शाता है। ‘सीधे-सच्चे लोग’ सामान्य पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: עַל זֹאת
  choice: यह देखकर
  rationale: यह पद उस बात को प्रतिक्रिया का कारण या अवसर बताता है। ‘यह देखकर’ हिन्दी में भावात्मक प्रतिक्रिया को सहज ढंग से व्यक्त करता है, जबकि ‘इस पर’ भी संभव है।
- source_word: נָקִי
  choice: निर्दोष व्यक्ति
  rationale: यह शब्द दोष या अपराध से मुक्त व्यक्ति को दर्शाता है। एकवचन को स्पष्ट रखने के लिए ‘व्यक्ति’ जोड़ा गया है।
- source_word: חָנֵף
  choice: भक्तिहीन
  rationale: यहाँ शब्द ईश्वर के प्रति श्रद्धाहीन, अपवित्र या अधर्मी व्यक्ति का बोध कराता है। ‘भक्तिहीन’ धार्मिक-नैतिक विरोध को बनाए रखता है और अर्थ को केवल दिखावे या कपट तक सीमित नहीं करता।
- source_word: יִתְעֹרָר
  choice: उठ खड़ा होता है
  rationale: हित्पोलेल रूप स्वयं को सक्रिय करने या कार्रवाई के लिए उठने का भाव देता है। ‘उठ खड़ा होता है’ हिन्दी में आत्म-प्रेरित सक्रिय विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל חָנֵף
  choice: भक्तिहीन के विरुद्ध
  rationale: जाग उठने या सक्रिय होने की क्रिया के साथ עַל यहाँ विरोध का संबंध व्यक्त करता है।
theological_decisions:
- issue: חָנֵף का अनुवाद
  choice: भक्तिहीन
  alternative: कपटी
  rationale: पद में सीधे-सच्चे और निर्दोष लोगों का विरोध श्रद्धाहीन या अधर्मी व्यक्ति से है। ‘कपटी’ पारंपरिक अनुवाद है, पर वह अर्थ को केवल दोहरे आचरण तक सीमित कर सकता है; इसलिए व्यापक धार्मिक-नैतिक अर्थ मुख्य पाठ में रखा गया है और विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर पंक्तियों में बहुवचन ‘सीधे-सच्चे लोग’ और एकवचन ‘निर्दोष व्यक्ति’ का स्रोत-पाठीय अंतर सुरक्षित है।
