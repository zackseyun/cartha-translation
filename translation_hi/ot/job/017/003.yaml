base_translation:
  language: en
  yaml_path: translation/ot/job/017/003.yaml
  text: Lay down[a], please, a pledge for me with yourself[b]; who else is there who would strike hands with me?
translation:
  language: hi
  text: कृपा करके, मेरे लिए अपने ही पास ज़मानत रख[a]; मेरे साथ हाथ मिलाकर ज़मानत का करार करने वाला और कौन है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “स्वयं मेरे ज़मानतदार बन।” इब्रानी में ज़मानत या गारंटी देने की कानूनी भाषा है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “कौन है जो मेरे हाथ पर हाथ मारेगा?” हाथ पर हाथ मारना ज़मानत या प्रतिज्ञा के करार को पक्का करने की क्रिया थी।'
    reason: cultural_note
lexical_decisions:
- source_word: שִׂימָה נָּא
  choice: कृपा करके ... रख
  rationale: आज्ञार्थक שׂים के साथ विनयकारी נָּא को आधुनिक, स्वाभाविक हिन्दी में विनम्र निवेदन के रूप में व्यक्त करता है।
- source_word: עָרְבֵנִי
  choice: मेरे लिए ... ज़मानत
  rationale: ערב यहाँ कानूनी अर्थ में किसी के पक्ष में प्रतिभूति अथवा गारंटी देने को सूचित करता है। ‘ज़मानत’ सामान्य हिन्दी में समझ आने वाला कानूनी शब्द है।
- source_word: עִמָּךְ
  choice: अपने ही पास
  rationale: यह असामान्य तनाव बनाए रखता है कि अय्यूब परमेश्वर से ऐसी ज़मानत माँगता है जो उसी के पास रहे; ‘ही’ किसी दूसरे ज़मानतदार के अभाव को उभारता है।
- source_word: מִי הוּא
  choice: और कौन है
  rationale: इब्रानी आलंकारिक प्रश्न को सहज हिन्दी में रखता है और किसी अन्य उपलब्ध ज़मानतदार के न होने का भाव प्रकट करता है।
- source_word: לְיָדִי יִתָּקֵעַ
  choice: मेरे साथ हाथ मिलाकर वचन देगा
  rationale: शाब्दिक हाथ मारने/मिलाने की कानूनी क्रिया को बनाए रखते हुए उसके आशय—प्रतिज्ञा या ज़मानत का समझौता पक्का करना—को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर को संबोधित कानूनी रूपक
  choice: अय्यूब परमेश्वर से अपने लिए ज़मानत रखने को कहता है, और वह ज़मानत परमेश्वर के ही पास होगी।
  alternative: अय्यूब किसी सामान्य तीसरे पक्ष के ज़मानतदार की माँग करता है।
  rationale: עָרְבֵנִי עִמָּךְ सीधे परमेश्वर को संबोधित करके ‘मेरे लिए ज़मानत...अपने पास’ कहता है। अनुवाद इस विलक्षण तनाव को बनाए रखता है, पर यह विस्तार से तय नहीं करता कि परमेश्वर कानूनी रूपक में दोनों भूमिकाएँ कैसे निभाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ज़मानत’ कानूनी रूपक को सुरक्षित रखता है; दूसरे खंड में ‘हाथ मिलाकर वचन देगा’ सांस्कृतिक संकेत और उसका आशय दोनों संप्रेषित करता है।
