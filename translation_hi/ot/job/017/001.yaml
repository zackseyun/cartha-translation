- source_word: חֻבָּלָה
  choice: टूट चुकी है
  rationale: निष्क्रिय रूप क्षति, विनाश या बरबादी की दशा बताता है। ‘टूट चुकी है’ हिन्दी में स्वाभाविक है और मूल के पूर्ण हुई दशा के भाव को व्यक्त करता है।
- source_word: יָמַי
  choice: मेरे दिन
  rationale: यह अय्यूब के शेष जीवनकाल के दिनों के लिए सीधा संबंधसूचक बहुवचन है।
- source_word: נִזְעָכוּ
  choice: बुझ गए हैं
  rationale: क्रिया बुझाए जाने या समाप्त हो जाने का बिंब रखती है। ‘बुझ गए हैं’ जीवन के दीप के बुझने की सम्भावित छवि को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קְבָרִים
  choice: कब्रें
  rationale: मूल का बहुवचन सुरक्षित रखा गया है; इसे सामूहिक एकवचन ‘कब्र’ में नहीं बदला गया।
- source_word: לִי
  choice: मेरे लिए तैयार हैं
  rationale: לִי का शाब्दिक अर्थ ‘मेरे लिए’ है। प्रसंग में इसका भाव है कि अब अय्यूब के सामने दफन होने के स्थान ही हैं; ‘तैयार हैं’ यह अर्थ स्वाभाविक हिन्दी में देता है, यद्यपि क्रिया मूल में स्पष्ट रूप से उपस्थित नहीं है।
