translation:
  language: hi
  text: उसने मुझे अनेक जातियों में तिरस्कार की कहावत बना दिया है[a], और मैं ऐसा हो गया हूँ जिस पर लोग खुलेआम थूकते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने मुझे अनेक जातियों में एक लोकोक्ति बना दिया है।” यहाँ आशय तिरस्कार की प्रसिद्ध मिसाल बन जाने से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक भाव है, “मैं चेहरों के सामने थूक बन गया हूँ,” अर्थात खुले तिरस्कार का पात्र।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִצִּגַנִי
  choice: उसने मुझे ... बना दिया है
  rationale: हिफ़ील रूप और प्रथम पुरुष एकवचन प्रत्यय किसी के द्वारा अय्यूब को सार्वजनिक रूप से ऐसी दशा में रखे जाने का भाव देते हैं। हिंदी में ‘बना दिया है’ परिणामी अवस्था को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִמְשֹׁל
  choice: कहावत
  rationale: यहाँ शब्द का आशय ऐसी लोकोक्ति या मिसाल से है जिसमें अय्यूब सार्वजनिक उपहास और तिरस्कार का प्रतीक बन गया है। ‘कहावत’ सामान्य आधुनिक हिंदी में बोधगम्य है; तिरस्कार का भाव प्रसंग और पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עַמִּים
  choice: जाति-जाति के लोगों के बीच
  rationale: इब्रानी बहुवचन ‘लोगों/जातियों’ को समतल किए बिना यह पद विभिन्न समुदायों के बीच व्यापक सार्वजनिक अपमान का भाव देता है।
- source_word: וְתֹפֶת
  choice: जिसके मुँह पर लोग थूकते हैं
  rationale: दुर्लभ संज्ञा थूकने अथवा थूक का पात्र बनने की छवि रखती है। शाब्दिक ‘थूक’ हिंदी में अस्पष्ट होता; चुना हुआ वाक्य खुले तिरस्कार की ठोस छवि बनाए रखता है।
- source_word: לְפָנִים
  choice: मुँह पर
  rationale: शाब्दिक रूप से ‘चेहरों के सामने’ है। ‘मुँह पर’ आमने-सामने किए गए खुले अपमान को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶהְיֶה
  choice: मैं ऐसा हो गया हूँ
  rationale: यद्यपि रूप अपूर्ण काल का है, काव्यात्मक संदर्भ में यह पूर्व क्रिया से उत्पन्न वर्तमान अवस्था बता सकता है। ‘हो गया हूँ’ उसी परिणामी दशा को व्यक्त करता है।
theological_decisions:
- issue: कर्ता की पहचान
  choice: सर्वनाम ‘उसने’ बनाए रखा गया है
  alternative: स्पष्ट रूप से ‘परमेश्वर ने’ कहना
  rationale: इस पद के इब्रानी पाठ में कर्ता सर्वनाम द्वारा निहित है; संदर्भ परमेश्वर की ओर संकेत कर सकता है, पर अनुवाद में नाम जोड़कर निहित संबंध को आवश्यकता से अधिक स्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘जाति-जाति के लोगों’ से इब्रानी बहुवचन עַמִּים सुरक्षित है; ‘मुँह पर थूकते हैं’ मूल की अपमानजनक और सार्वजनिक छवि को स्पष्ट करता है।
