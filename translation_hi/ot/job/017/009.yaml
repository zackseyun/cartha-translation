  text: Yet the righteous holds fast to his way[a], and the one with clean hands grows stronger.
translation:
  language: hi
  text: फिर भी धर्मी अपने मार्ग पर दृढ़ता से बना रहेगा, और जिसके हाथ शुद्ध हैं, वह और बलवान होता जाएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “बल बढ़ाएगा”; इसका अर्थ “बल में बढ़ेगा” या अधिक सीमित अर्थ में “साहस पाएगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֹאחֵז
  choice: फिर भी ... दृढ़ बना रहेगा
  rationale: וְ का सामान्य अर्थ ‘और’ है, पर पिछले निराशाजनक वर्णन के बाद यहाँ हल्का विरोध सूचित होता है। אחז का मूल भाव पकड़ना या थामे रहना है; इस संदर्भ में ‘दृढ़ बना रहेगा’ धीरज से अपने मार्ग पर टिके रहने का स्वाभाविक हिन्दी रूप है।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: एकवचन विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। ‘धर्मी’ प्रतिनिधिक एकवचन और नैतिक अर्थ दोनों को बनाए रखता है।
- source_word: דַּרְכּוֹ
  choice: अपने मार्ग पर
  rationale: דֶּרֶךְ मार्ग, पथ या जीवन-चाल को दर्शा सकता है। ‘अपने मार्ग पर’ उसके शाब्दिक बिंब और रूपकात्मक विस्तार दोनों को सुरक्षित रखता है।
- source_word: וּטֳהָר יָדַיִם
  choice: जिसके हाथ शुद्ध हैं
  rationale: यह निर्दोषता अथवा नैतिक शुद्धता का मुहावरा है। यह चयन हिब्रू के ठोस ‘हाथ’ वाले बिंब को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: יֹסִיף אֹמֶץ
  choice: और बलवान होता जाएगा
  rationale: יֹסִיף का मूल अर्थ ‘बढ़ाना/जोड़ना’ और אֹמֶץ का अर्थ बल, दृढ़ता या साहस हो सकता है। संयुक्त पद का यह रूप निरंतर बढ़ती शक्ति या दृढ़ता को सहज हिन्दी में व्यक्त करता है, जबकि टिप्पणी में शाब्दिक और संकीर्ण विकल्प दिए गए हैं।
