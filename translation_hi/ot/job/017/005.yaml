  text: He denounces friends for a share[a], and the eyes of his children will fail.
translation:
  language: hi
  text: 'जो हिस्से के लिए मित्रों के विरुद्ध बोलता है,

    उसके बच्चों की आँखें क्षीण हो जाएँगी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵלֶק
  choice: हिस्सा पाने के लिए
  rationale: חֵלֶק का मूल अर्थ ‘हिस्सा’ या ‘भाग’ है। यहाँ לְ उपसर्ग के साथ यह निजी लाभ की मंशा सूचित कर सकता है; ‘पाने के लिए’ हिंदी में उस संबंध को स्वाभाविक बनाता है, जबकि कठिन और अनिश्चित पदबंध के अन्य अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: יַגִּיד
  choice: निंदा करता है
  rationale: נגד के हिफ़ील रूप का मूल अर्थ ‘बताता/घोषित करता है’ है, पर मित्रों और निजी हिस्से के इस संदर्भ में कथन विश्वासघाती आरोप या भंडाफोड़ का भाव लेता है। ‘निंदा करता है’ इस प्रतिकूल बल को व्यक्त करता है, यद्यपि मूल क्रिया अपने आप में इससे व्यापक है।
- source_word: רֵעִים
  choice: मित्रों
  rationale: רֵעִים का सामान्य अर्थ ‘मित्र’ या ‘साथी’ है। ‘मित्रों’ से पद में निहित संबंधगत विश्वासघात स्पष्ट और स्वाभाविक रहता है।
- source_word: וְעֵינֵי בָנָיו
  choice: उसके बच्चों की आँखें
  rationale: בנים का अर्थ ‘पुत्र’ या व्यापक रूप से ‘बच्चे’ हो सकता है। यहाँ ‘बच्चों’ से लिंग के विषय में अनावश्यक संकीर्णता नहीं आती और संबंधवाचक संरचना सीधे बनी रहती है।
- source_word: תִּכְלֶנָה
  choice: दुर्बल पड़ जाएँगी
  rationale: כלה समाप्त होने, चुकने या क्षीण होने का अर्थ दे सकता है। आँखों के साथ ‘दुर्बल पड़ जाएँगी’ उनकी शक्ति चुकने की छवि रखता है, बिना इसे केवल अंधापन, धुँधलापन या मृत्यु के रूप में निश्चित किए।
theological_decisions:
- issue: कर्म और उसके बच्चों पर परिणाम के बीच संबंध
  choice: इसे मूल पाठ की भावी घोषणा के रूप में रखा गया है
  alternative: इसे स्पष्ट दैवी दंड या सामान्य कहावत के रूप में समझाना
  rationale: इब्रानी वाक्य परिणाम बताता है, पर यह स्पष्ट नहीं करता कि वह प्रत्यक्ष दैवी दंड है, शाप है, या कहावत-सदृश परिणाम। अनुवाद इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी अपनाई गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पद को दो पंक्तियों में रखा गया है। कठिन इब्रानी को अत्यधिक स्पष्ट किए बिना मुख्य पाठ स्वाभाविक बनाया गया और प्रमुख विकल्प पादटिप्पणी में सुरक्षित रखे गए हैं।
