- source_word: תָּלַן
  choice: टिकी रात बिताती है
  rationale: क्रिया का मूल अर्थ ठहरना या रात बिताना है। यह अनुवाद आँख के लगातार लगे रहने के भाव के साथ इब्रानी का सजीव रात्रि-निवास रूपक भी बनाए रखता है।
