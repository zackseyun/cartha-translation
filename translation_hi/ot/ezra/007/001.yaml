  text: וְ/אַחַר֙ הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה בְּ/מַלְכ֖וּת אַרְתַּחְשַׁ֣סְתְּא מֶֽלֶךְ פָּרָ֑ס עֶזְרָא֙ בֶּן שְׂרָיָ֔ה בֶּן עֲזַרְיָ֖ה בֶּן חִלְקִיָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/001.yaml
  text: After these things[a], in the reign of Artaxerxes king of Persia, Ezra son of Seraiah, son of Azariah, son of Hilkiah—
translation:
  language: hi
  text: इन बातों के बाद, फ़ारस के राजा अर्तक्षत्र के शासनकाल में, एज्रा, सरायाह का पुत्र[a], अजर्याह का पुत्र, हिल्कियाह का पुत्र—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावलियों में इब्रानी शब्द “पुत्र” किसी अधिक दूर के वंशज को भी सूचित कर सकता है; इसका अर्थ केवल प्रत्यक्ष पिता-पुत्र का संबंध होना आवश्यक नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אַחַר
  choice: के बाद
  rationale: वाक्यांश पूर्ववर्ती वृत्तांत से संबंध रखते हुए बाद के समय की ओर बढ़ता है। हिंदी में “इन बातों के बाद” संयोजक अर्थ को स्वाभाविक रूप से व्यक्त करता है; अलग से आरंभिक “और” आवश्यक नहीं है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों
  rationale: यह पूर्ववर्ती घटनाओं या विषयों को समेटने वाला व्यापक इब्रानी मुहावरा है। “इन बातों” मूल अभिव्यक्ति की व्यापकता बनाए रखता है।
- source_word: בְּ/מַלְכוּת
  choice: के शासनकाल में
  rationale: यहाँ संज्ञा राजा के राज्य-क्षेत्र की नहीं, उसके शासन की अवधि की ओर संकेत करती है।
- source_word: אַרְתַּחְשַׁסְתְּא
  choice: अर्तक्षत्र
  rationale: फ़ारसी राजकीय नाम का हिंदी बाइबलीय परंपरा में प्रचलित रूप अपनाया गया है।
- source_word: מֶלֶךְ פָּרָס
  choice: फ़ारस के राजा
  rationale: सम्बन्धवाचक इब्रानी पदबंध का स्वाभाविक और सटीक हिंदी रूप।
- source_word: עֶזְרָא
  choice: एज्रा
  rationale: नाम का आधुनिक हिंदी में स्थापित लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली की मूल पदावली को सुरक्षित रखा गया है। इब्रानी में यह शब्द कभी-कभी निकटतम जैविक पुत्र के बजाय अधिक दूर के वंशज को भी सूचित कर सकता है; इसलिए अर्थ को मुख्य पाठ में संकुचित नहीं किया गया।
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: इब्रानी नाम का ध्वन्यात्मक हिंदी लिप्यंतरण।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: इब्रानी नाम का ध्वन्यात्मक हिंदी लिप्यंतरण।
- source_word: חִלְקִיָּה
  choice: हिल्कियाह
  rationale: इब्रानी नाम का ध्वन्यात्मक हिंदी लिप्यंतरण।
