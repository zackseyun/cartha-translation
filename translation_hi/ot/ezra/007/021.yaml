  - severity: low
    issue: The phrase “मुझ राजा अर्तक्षत्र की ओर से” is awkward Hindi.
    rationale: The construction is grammatically and stylistically less natural than an explicit first-person clause while attempting to preserve the source emphasis.
  - severity: low
    issue: Footnote anchors occur only at the end of the sentence.
    rationale: The lexical note belongs with “पूरी सावधानी से,” and the cultural note belongs with “महानद के पार,” so local placement makes their referents unambiguous.
