  text: וּ֠/מִנִּ/י אֲנָ֞ה אַרְתַּחְשַׁ֤סְתְּא מַלְכָּ/א֙ שִׂ֣ים טְעֵ֔ם לְ/כֹל֙ גִּזַּֽבְרַיָּ֔/א דִּ֖י בַּ/עֲבַ֣ר נַהֲרָ֑/ה דִּ֣י כָל דִּ֣י יִ֠שְׁאֲלֶנְ/כוֹן עֶזְרָ֨א כָהֲנָ֜/ה סָפַ֤ר דָּתָ/א֙ דִּֽי אֱלָ֣הּ שְׁמַיָּ֔/א אָסְפַּ֖רְנָא יִתְעֲבִֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/021.yaml
  text: 'And from me, I, King Artaxerxes, issue a decree to all the treasurers in Beyond the River: whatever Ezra the priest, the scribe of the law of the God of heaven, asks of you, let it be done diligently.'
translation:
  language: hi
  text: 'और मेरी ओर से, मैं राजा अर्तक्षत्र यह आदेश देता हूँ कि महानद के पार[b] के सभी कोषाध्यक्षों के लिए: याजक एज्रा, जो स्वर्ग के परमेश्वर की व्यवस्था का शास्त्री है, तुमसे जो कुछ माँगे, वह पूरी सावधानी से[a] किया जाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठीक-ठीक” अथवा “तुरंत”; अरामी शब्द सावधानी और पूर्ण रूप से आदेश मानने पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: “महानद के पार” फारसी शासन में फरात नदी के पश्चिम के क्षेत्र का प्रशासनिक नाम था।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנִּי אֲנָה
  choice: और मुझसे—मुझ ... की ओर से
  rationale: राजा के व्यक्तिगत अधिकार पर दिए गए अरामी बल को हिन्दी में स्वाभाविक, किंतु स्पष्ट रूप से बनाए रखता है।
- source_word: אַרְתַּחְשַׁסְתְּא מַלְכָּא
  choice: राजा अर्तक्षत्र
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम और स्वाभाविक पद-नाम क्रम।
- source_word: שִׂים טְעֵם
  choice: यह आदेश जारी किया जाता है
  rationale: राजकीय प्रशासनिक आदेश स्थापित करने के अरामी मुहावरे का औपचारिक और सहज हिन्दी रूप।
- source_word: לְכֹל גִּזַּבְרַיָּא
  choice: सभी कोषाध्यक्षों
  rationale: राजकोष से जुड़े अधिकारियों के लिए संक्षिप्त और संदर्भानुकूल पद।
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: महानद के पार
  rationale: फारसी प्रशासनिक क्षेत्रनाम को हिन्दी में पहचानने योग्य रूप देता है; ‘महानद’ से यहाँ फरात का संकेत है।
- source_word: יִשְׁאֲלֶנְכוֹן
  choice: तुमसे जो कुछ माँगें
  rationale: क्रिया के माँगने/अनुरोध करने के अर्थ को रखता है और स्वयं क्रिया में अनावश्यक बाध्यता नहीं जोड़ता।
- source_word: עֶזְרָא כָהֲנָה
  choice: एज्रा याजक
  rationale: नाम और धार्मिक पद की सीधी पदान्वयी पहचान।
- source_word: סָפַר דָּתָא
  choice: व्यवस्था के शास्त्री
  rationale: סָפַר के विद्वत्तापूर्ण और आधिकारिक दोनों आयामों को प्रचलित हिन्दी बाइबलीय पद ‘शास्त्री’ से व्यक्त करता है।
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर की
  rationale: इम्पीरियल काल की उपाधि का स्वाभाविक और प्रतिष्ठित हिन्दी रूप।
- source_word: אָסְפַּרְנָא
  choice: पूरी सावधानी से
  rationale: दुर्लभ अरामी क्रियाविशेषण में निहित सावधानी, शुद्धता और पूर्ण अनुपालन को बिना केवल गति पर बल दिए व्यक्त करता है।
