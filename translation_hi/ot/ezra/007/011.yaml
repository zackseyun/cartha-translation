  text: וְ/זֶ֣ה פַּרְשֶׁ֣גֶן הַֽ/נִּשְׁתְּוָ֗ן אֲשֶׁ֤ר נָתַן֙ הַ/מֶּ֣לֶךְ אַרְתַּחְשַׁ֔סְתְּא לְ/עֶזְרָ֥א הַ/כֹּהֵ֖ן הַ/סֹּפֵ֑ר סֹפֵ֞ר דִּבְרֵ֧י מִצְוֺת יְהוָ֛ה וְ/חֻקָּ֖י/ו עַל יִשְׂרָאֵֽל׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/011.yaml
  text: 'This is the copy of the document that King Artaxerxes gave to Ezra the priest[a], the scribe[b], a scribe of the words of the commandments of Yahweh and of his statutes for Israel:'
translation:
  language: hi
  text: 'यह उस दस्तावेज़ की प्रतिलिपि[a] है, जो राजा अर्तक्षत्र ने याजक एज्रा को दिया था—जो शास्त्री था, अर्थात् याहवे की आज्ञाओं के वचनों और इस्राएल के लिए[b] उसकी विधियों का शास्त्री:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पत्र का पाठ’ अथवा ‘दस्तावेज़ की लिखित प्रतिलिपि’।
    reason: lexical_alternative
  - marker: b
    text: या ‘इस्राएल के विषय में’ अथवा ‘इस्राएल पर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּרְשֶׁגֶן הַנִּשְׁתְּוָן
  choice: राजकीय दस्तावेज़ की प्रतिलिपि
  rationale: पहला शब्द किसी आधिकारिक लेख की प्रतिलिपि या नकल को और दूसरा आधिकारिक लिखित पत्र या दस्तावेज़ को सूचित करता है। संयुक्त पद का यह अनुवाद राजकीय संदर्भ स्पष्ट रखते हुए मूल अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָתַן
  choice: दिया था
  rationale: मूल क्रिया का सामान्य अर्थ ‘देना’ है; राजकीय संदर्भ के कारण इसे ‘जारी किया’ बनाकर अधिक व्याख्यात्मक नहीं किया गया।
- source_word: הַמֶּלֶךְ אַרְתַּחְשַׁסְתְּא
  choice: राजा अर्तक्षत्र
  rationale: उपाधि का अनुवाद किया गया और नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया।
- source_word: הַכֹּהֵן הַסֹּפֵר
  choice: याजक और शास्त्री
  rationale: दोनों पद एज्रा की भूमिकाएँ बताते हैं। ‘शास्त्री’ प्राचीन प्रशासनिक और धर्मशास्त्रीय लेखन से जुड़े अर्थ को बनाए रखता है।
- source_word: סֹפֵר דִּבְרֵי מִצְוֺת יְהוָה וְחֻקָּיו
  choice: याहवे की आज्ञाओं के वचनों और उसकी विधियों का शास्त्री
  rationale: पुनरुक्त ‘शास्त्री’ और ‘आज्ञाओं के वचन’ को बनाए रखा गया है, क्योंकि वे मूल में एज्रा की भूमिका को विशेष रूप से परिभाषित करते हैं; ‘विशेषज्ञ’ कहना अधिक व्याख्यात्मक होता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया।
- source_word: חֻקָּיו
  choice: उसकी विधियों
  rationale: कानूनी और शिक्षापरक संदर्भ में ‘विधियाँ’ חֻקִּים का स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: यह पद आज्ञाओं और विधियों के इस्राएल पर लागू होने या उससे संबंधित होने का भाव दे सकता है; मुख्य पाठ में स्वाभाविक ‘के लिए’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम का लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: עַל יִשְׂרָאֵל का संबंध और अर्थ
  choice: इस्राएल के लिए
  alternative: इस्राएल के विषय में; इस्राएल पर
  rationale: यह पद आज्ञाओं और विधियों के संदर्भ, प्रयोजन या अधिकार-क्षेत्र को व्यक्त कर सकता है। मुख्य पाठ में सबसे स्वाभाविक अर्थ चुना गया है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। मूल की परिचयात्मक संरचना को हिन्दी में दो वाक्यों में बाँटा गया है ताकि लंबी पद-संरचना स्पष्ट रहे; अंतिम विसर्ग अगले राजकीय दस्तावेज़ का परिचय देता है। पादटिप्पणी-चिह्न उन्हीं शब्दों के साथ रखे गए हैं जिनकी वैकल्पिक व्याख्या वे बताते हैं।
