  text: And he came to Jerusalem in the fifth month[a], which was the seventh year of the king.
translation:
  language: hi
  text: और वह पाँचवें महीने में यरूशलेम पहुँचा; यह राजा के शासन का सातवाँ वर्ष था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: और वह पहुँचा
  rationale: वाव-क्रमिक रूप कथा की अगली घटना बताता है। यहाँ בוא गंतव्य के साथ प्रयुक्त है, इसलिए स्वाभाविक हिन्दी में “पहुँचा” आगमन का सरल और सटीक बोध कराता है।
- source_word: יְרוּשָׁלִַם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिन्दी लिप्यंतरण।
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: पाँचवें महीने में
  rationale: ב का प्रयोग यहाँ काल-सूचक है; यह अनूदित रूप महीने की क्रम-संख्या को स्पष्ट रूप से बनाए रखता है।
- source_word: הִיא
  choice: यह … था
  rationale: स्त्रीलिंग सर्वनाम पूर्ववर्ती काल-सूचना की ओर संकेत करके उसे राजकीय वर्ष से जोड़ता है। हिन्दी में अलग उपवाक्य “यह … था” इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁנַת הַשְּׁבִיעִית
  choice: सातवाँ वर्ष
  rationale: सम्बन्धसूचक रचना और क्रमवाचक विशेषण राजकीय शासन का सातवाँ वर्ष बताते हैं।
- source_word: לַמֶּלֶךְ
  choice: राजा का
  rationale: राजकीय तिथि-निर्धारण में ל संबंध प्रकट करता है, जिसे हिन्दी में “का” से सहज रूप में व्यक्त किया जाता है। संदर्भ से नाम जोड़ना इस पद के प्रत्यक्ष शब्दों से आगे जाना होता।
