base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/010.yaml
  text: For Ezra had set his heart to seek the Law of Yahweh[a], and to do it[d][c][b], and to teach statutes and judgments in Israel.
translation:
  language: hi
  text: क्योंकि एज्रा ने यहोवा[a] की व्यवस्था का अध्ययन करने, उसका पालन करने और इस्राएल में विधि और न्याय सिखाने के लिए अपना मन लगाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोवा’ मूल इब्रानी में परमेश्वर का विशिष्ट नाम YHWH है; इसे ‘याहवे’ भी लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ में एज्रा पर हुई कृपा और उसकी सफलता का कारण बताता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵכִין לְבָבוֹ
  choice: अपना मन ... में लगाया था
  rationale: इस इब्रानी मुहावरे में सोच-समझकर किया गया दृढ़ आंतरिक संकल्प निहित है। यह हिन्दी प्रयोग शाब्दिक ‘मन तैयार किया’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: לִדְרוֹשׁ
  choice: जानने
  rationale: דרש में खोजने, पूछताछ करने और अध्ययन करने का अर्थ-क्षेत्र है। ‘जानने’ में यहाँ व्यवस्था को समझने की गंभीर चेष्टा व्यक्त होती है, यद्यपि ‘अध्ययन करने’ भी संभव है।
- source_word: תּוֹרַת יְהוָה
  choice: यहोवा की व्यवस्था
  rationale: निर्वासन-पश्चात के याजकीय और शास्त्रीय संदर्भ में תּוֹרָה सामान्य शिक्षा से अधिक वाचा की व्यवस्था की ओर संकेत करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम YHWH को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְלַעֲשֹׂת
  choice: उसका पालन करने
  rationale: इब्रानी में शाब्दिक अर्थ ‘उसे करने’ है और इसका निहित कर्म अभी उल्लिखित व्यवस्था है। हिन्दी में ‘पालन करने’ वास्तविक आज्ञाकारिता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּלְלַמֵּד
  choice: सिखाने
  rationale: Piel रूप का सीधा अर्थ ‘सिखाना’ या ‘शिक्षा देना’ है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: यह एज्रा की शिक्षण-सेवा का क्षेत्र बताता है और मूल संबंधबोधक प्रयोग के निकट है।
- source_word: חֹק וּמִשְׁפָּט
  choice: विधि और न्याय-विधान
  rationale: दोनों एकवचन रूप सामूहिक अर्थ में कानूनी प्रावधानों को बताते हैं। यह चयन उनकी भिन्न किंतु संबंधित विधिक बारीकियों को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में टेट्राग्राम YHWH सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों के लिए पहचाना जाने वाला व्यक्तिवाचक रूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: इस संदर्भ में תּוֹרָה का दायरा
  choice: व्यवस्था
  alternative: शिक्षा / तोराह
  rationale: एज्रा के याजकीय-शास्त्रीय कार्य के संदर्भ में यह इस्राएल की वाचा-संबंधी व्यवस्था को सूचित करता है; फिर भी मूल शब्द के व्यापक ‘शिक्षा’ अर्थ को पूरी तरह नकारा नहीं जाता।
- issue: חֹק וּמִשְׁפָּט की वचन-संख्या
  choice: विधि और न्याय-विधान
  alternative: विधियाँ और न्याय-विधान
  rationale: मूल के एकवचन रूप बनाए गए हैं, जबकि हिन्दी में ये सामूहिक अर्थ ग्रहण कर सकते हैं; इस प्रकार पाठ को अनावश्यक रूप से बहुवचन नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। त्रिक क्रम—व्यवस्था को जानना, उसका पालन करना और उसे सिखाना—स्पष्ट रखा गया है।
