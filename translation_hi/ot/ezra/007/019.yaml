base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/019.yaml
  text: And the vessels that are given to you for the service of the house of your God[b][a], deliver in full before the God of Jerusalem.
translation:
  language: hi
  text: और जो पात्र तुम्हें तुम्हारे परमेश्वर के भवन की सेवा[a] के लिए दिए जा रहे हैं, उन्हें यरूशलेम के परमेश्वर के समक्ष पूरी तरह सौंप देना।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारे परमेश्वर के भवन की उपासना के लिए।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘उन्हें यरूशलेम के परमेश्वर के समक्ष पूरी तरह प्रस्तुत कर देना।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָאנַיָּא
  choice: और जो पात्र
  rationale: अरामी शब्द भवन, विशेषकर मन्दिर, में प्रयुक्त पात्रों या उपकरणों को दर्शाता है। ‘पात्र’ हिन्दी बाइबलीय सन्दर्भ में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: מִתְיַהֲבִין לָךְ
  choice: तुम्हें ... दिए जा रहे हैं
  rationale: निष्क्रिय कृदन्त का वर्तमान/प्रगतिशील भाव बनाए रखता है और राजकीय आदेश के प्रसंग में स्वाभाविक है।
- source_word: לְפָלְחָן בֵּית אֱלָהָךְ
  choice: तुम्हारे परमेश्वर के भवन की सेवा के लिए
  rationale: ‘सेवा’ उपासना सहित मन्दिर के कार्यों का व्यापक भाव रखती है; ‘भवन’ मूल के ‘घर’ को गरिमापूर्ण और प्रसंगानुकूल ढंग से व्यक्त करता है।
- source_word: הַשְׁלֵם
  choice: पूरा-पूरा सौंप देना
  rationale: आज्ञार्थक क्रिया का अर्थ वस्तुओं को पूर्ण रूप से सुपुर्द करना है। यह अनुवाद पूर्णता और हस्तांतरण दोनों भावों को स्पष्ट करता है।
- source_word: קֳדָם
  choice: के सामने
  rationale: अरामी पूर्वसर्ग का सामान्य अर्थ ‘सामने’ या ‘उपस्थिति में’ है।
- source_word: אֱלָהּ יְרוּשְׁלֶם
  choice: यरूशलेम के परमेश्वर
  rationale: फ़ारसी-कालीन प्रशासनिक शैली में परमेश्वर को यरूशलेम से सम्बद्ध करने वाली मूल अभिव्यक्ति को सीधे बनाए रखता है।
theological_decisions:
- issue: मन्दिर-सम्बन्धी सेवा का स्वरूप
  choice: परमेश्वर के भवन की सेवा
  alternative: परमेश्वर के भवन की उपासना
  rationale: मूल अरामी संज्ञा धार्मिक सेवा को दर्शाती है, पर उसका अर्थ केवल उपासना तक सीमित नहीं है। ‘सेवा’ मूल की व्यापकता और धार्मिक प्रसंग दोनों को सुरक्षित रखती है।
- issue: यरूशलेम से परमेश्वर का सम्बन्ध
  choice: यरूशलेम के परमेश्वर
  alternative: यरूशलेम में परमेश्वर
  rationale: मूल पदबंध सम्बन्धसूचक है और प्रशासनिक पहचान की भाषा को प्रतिबिम्बित करता है। प्रत्यक्ष अनुवाद किसी अतिरिक्त स्थानिक या धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट राजकीय-आदेश शैली रखी गई है। ‘तुम्हें’ और ‘सौंप देना’ एकवचन सम्बोधन तथा आज्ञार्थक बल को स्वाभाविक रूप से व्यक्त करते हैं।
