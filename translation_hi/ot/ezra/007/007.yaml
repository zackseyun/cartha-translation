  text: And some of the sons of Israel[a], and some of the priests, and the Levites, and the singers, and the gatekeepers[b], and the temple servants went up to Jerusalem in the seventh year of King Artaxerxes.
translation:
  language: hi
  text: इस्राएलियों[a] में से कुछ, और याजकों में से कुछ, और लेवीय, और गायक, और द्वारपाल, और मंदिर के सेवक[b] राजा अर्तक्षत्र के शासन के सातवें वर्ष में यरूशलेम की ओर चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों में से कुछ।’ इब्रानी में इसका अर्थ पूरे समूह में से कुछ लोग है।
    reason: lexical_alternative
  - marker: b
    text: या ‘नतीनीम’; यह मंदिर के सेवकों के एक विशेष वर्ग का तकनीकी नाम है।
    reason: lexical_alternative
