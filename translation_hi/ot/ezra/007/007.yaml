- source_word: בִּשְׁנַת שֶׁבַע
  choice: सातवें वर्ष में
  rationale: काल-सूचक इब्रानी पदबंध का सहज हिन्दी रूप।
- source_word: לְאַרְתַּחְשַׁסְתְּא הַמֶּלֶךְ
