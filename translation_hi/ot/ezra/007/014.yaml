base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/014.yaml
  text: because you are sent from before the king and his seven counselors to inquire concerning Judah and Jerusalem according to the law of your God that is in your hand[a][b].
translation:
  language: hi
  text: क्योंकि तुम्हें राजा और उसके सात सलाहकारों की ओर से यहूदा और यरूशलेम के विषय में जाँच करने के लिए भेजा गया है—तुम्हारे परमेश्वर की उस व्यवस्था के अनुसार जो तुम्हारे हाथ में है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा के सम्मुख से।” यह अरामी राजदरबारी मुहावरा बताता है कि एज्रा का प्रेषण राजा की राजकीय उपस्थिति से हुआ था।
    reason: lexical_alternative
  - marker: b
    text: इसका अर्थ “जो तुम्हारे अधिकार में है” या “जो तुम्हें सौंपी गई है” भी हो सकता है। शाब्दिक रूप से, “जो तुम्हारे हाथ में है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל־קֳבֵל דִּי
  choice: क्योंकि
  rationale: यह अरामी पदबंध आज्ञापत्र में कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिंदी में इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: מִן קֳדָם מַלְכָּא
  choice: राजा ... की ओर से
  rationale: शाब्दिक अर्थ ‘राजा के सम्मुख से’ है और यह राजकीय उपस्थिति से मिले अधिकार या प्रेषण का दरबारी मुहावरा है; मुख्य पाठ में ‘की ओर से’ उसका आशय सहज हिंदी में देता है, जबकि शाब्दिक छवि पादटिप्पणी में सुरक्षित है।
- source_word: וְשִׁבְעַת יָעֲטֹהִי
  choice: और उसके सात मंत्रियों
  rationale: יָעֵט राजकीय सलाहकारों को सूचित करता है। ‘मंत्री’ भारतीय हिंदी पाठक के लिए राजदरबार के आधिकारिक सलाहकार का स्वाभाविक पद है।
- source_word: שְׁלִיחַ
  choice: तुम्हें ... भेजा गया है
  rationale: यह प्रेषित किए जाने की आधिकारिक स्थिति व्यक्त करने वाला कर्मवाच्य रूप है; हिंदी में यह सरल और पर्याप्त रूप से औपचारिक है।
- source_word: לְבַקָּרָא
  choice: जाँच करने के लिए
  rationale: क्रिया खोजबीन, निरीक्षण या जाँच-पड़ताल का भाव रखती है; प्रशासनिक संदर्भ में ‘जाँच करना’ स्पष्ट और स्वाभाविक है।
- source_word: עַל יְהוּד וְלִירוּשְׁלֶם
  choice: यहूदिया और यरूशलेम के विषय में
  rationale: यहाँ पूर्वसर्ग जाँच के विषय को दर्शाता है; ‘के विषय में’ क्षेत्र पर शासन करने के अनावश्यक अर्थ से बचता है।
- source_word: בְּדָת אֱלָהָךְ
  choice: तुम्हारे परमेश्वर की ... व्यवस्था के अनुसार
  rationale: בְּ यहाँ जाँच के मानदंड या आधार को दर्शाता है। ‘के अनुसार’ यही संबंध स्पष्ट करता है; דָּת के लिए बाइबिलीय संदर्भ में ‘व्यवस्था’ उपयुक्त है।
- source_word: דִּי בִידָךְ
  choice: जो तुम्हारे हाथ में है
  rationale: मूल का शाब्दिक मुहावरा अधिकार, अभिरक्षा या वास्तविक अधिकारगत प्रति—इन संभावनाओं को खुला रखता है; इसलिए इसे मुख्य पाठ में सुरक्षित रखा गया है।
