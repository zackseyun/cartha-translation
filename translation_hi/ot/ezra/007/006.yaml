  text: ה֤וּא עֶזְרָא֙ עָלָ֣ה מִ/בָּבֶ֔ל וְ/הֽוּא סֹפֵ֤ר מָהִיר֙ בְּ/תוֹרַ֣ת מֹשֶׁ֔ה אֲשֶׁר נָתַ֥ן יְהוָ֖ה אֱלֹהֵ֣י יִשְׂרָאֵ֑ל וַ/יִּתֶּן ל֣/וֹ הַ/מֶּ֗לֶךְ כְּ/יַד יְהוָ֤ה אֱלֹהָי/ו֙ עָלָ֔י/ו כֹּ֖ל בַּקָּשָׁתֽ/וֹ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/006.yaml
  text: This Ezra went up from Babylon[a], and he was a skilled scribe in the Law of Moses, which Yahweh, the God of Israel, had given. And the king granted him all his request, according to the hand of Yahweh his God upon him.
translation:
  language: hi
  text: यह एज्रा बाबेल से चढ़कर आया। वह मूसा की व्यवस्था में निपुण शास्त्री था; इस व्यवस्था को इस्राएल के परमेश्वर यहवे ने दिया था। उसके परमेश्वर यहवे का हाथ उस पर था; उसके अनुरूप राजा ने उसकी हर माँग पूरी की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָלָה מִבָּבֶל
  choice: बाबेल से ऊपर आया
  rationale: ‘ऊपर आया’ मूल क्रिया की दिशा और यरूशलेम की ओर चढ़ने की पारंपरिक भौगोलिक-दृष्टि को बनाए रखता है।
- source_word: סֹפֵר מָהִיר
  choice: निपुण शास्त्री
  rationale: संदर्भ में מָהִיר शारीरिक तेजी नहीं, बल्कि दक्षता या प्रवीणता व्यक्त करता है; ‘शास्त्री’ पाठ और व्यवस्था के विशेषज्ञ की भूमिका को समेटता है।
- source_word: בְּתוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था में
  rationale: निर्गमन-पश्चात इस संदर्भ में תּוֹרָה के विधिक-वाचा संबंधी अर्थ के लिए ‘व्यवस्था’ सामान्य हिन्दी पाठक के लिए स्पष्ट है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיִּתֶּן לוֹ הַמֶּלֶךְ כֹּל בַּקָּשָׁתוֹ
  choice: राजा ने उसकी हर माँग पूरी की
  rationale: हिन्दी में यह अभिव्यक्ति स्वाभाविक रूप से बताती है कि राजा ने एज्रा की माँगी हुई सभी बातें स्वीकार कर दीं।
- source_word: כְּיַד יְהוָה אֱלֹהָיו עָלָיו
  choice: उसके परमेश्वर यहवे का हाथ उस पर होने के अनुसार
  rationale: ‘हाथ’ का ठोस रूपक और כְּ का संबंध सुरक्षित रखा गया है; इसे केवल कृपा, शक्ति या सहायता में सीमित नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; उसका लिप्यंतरण वाचा-नाम को उपाधि से प्रतिस्थापित किए बिना बनाए रखता है।
- issue: ‘परमेश्वर का हाथ उस पर’ मुहावरे का अर्थ
  choice: रूपक को मुख्य पाठ में बनाए रखना
  alternative: क्योंकि परमेश्वर उस पर अनुग्रह करता था; परमेश्वर की सामर्थ्य से
  rationale: मुहावरा अनुग्रह, सामर्थ्य और विधाता-संबंधी सहायता के मिले-जुले भाव दे सकता है; किसी एक अर्थ में सीमित करने के बजाय मूल तनाव सुरक्षित रखा गया है।
- issue: व्यवस्था किसने दी
  choice: संबंधवाचक उपवाक्य को ‘व्यवस्था’ से जोड़ना
  alternative: मूसा को इसका प्रत्यक्ष कर्ता मानकर विस्तार करना
  rationale: व्याकरण के अनुसार אֲשֶׁר का निकट और स्वाभाविक पूर्वपद ‘मूसा की व्यवस्था’ है; पाठ यह कहता है कि इस्राएल के परमेश्वर यहवे ने इसे दिया था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘व्यवस्था’, ‘शास्त्री’ और ‘यहवे’ जैसे शब्द बाइबलीय संदर्भ की औपचारिकता बनाए रखते हैं; ‘हर माँग पूरी की’ स्वाभाविक आधुनिक हिन्दी है।
