  text: וְ/אַ֣נְתְּ עֶזְרָ֗א כְּ/חָכְמַ֨ת אֱלָהָ֤/ךְ דִּֽי בִ/ידָ/ךְ֙ מֶ֣נִּי שָׁפְטִ֞ין וְ/דַיָּנִ֗ין דִּי לֶהֱוֺ֤ן דאנין לְ/כָל עַמָּ/ה֙ דִּ֚י בַּ/עֲבַ֣ר נַהֲרָ֔/ה לְ/כָל יָדְעֵ֖י דָּתֵ֣י אֱלָהָ֑/ךְ וְ/דִ֧י לָ֦א יָדַ֖ע תְּהוֹדְעֽוּן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/025.yaml
  text: And you[a], Ezra, according to the wisdom of your God that is in your hand, appoint magistrates and judges who may judge all the people who are beyond the River—all who know the laws of your God; and those who do not know them[b], you shall teach.
translation:
  language: hi
  text: और हे एज्रा, तुम अपने परमेश्वर की उस बुद्धि के अनुसार, जो तुम्हारे हाथ में है[a], न्यायिक अधिकारियों और न्यायाधीशों को नियुक्त करो, ताकि वे नदी के उस पार[b] के उन सब लोगों का न्याय करें जो तुम्हारे परमेश्वर के नियमों को जानते हैं; और जो उन्हें नहीं जानते, उन्हें तुम लोग सिखाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जो तुम्हारे अधिकार में है’ अथवा ‘जो तुम्हें सौंपी गई है’; अरामी मुहावरा किसी वस्तु के पास होने या सौंपे गए अधिकार को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नदी के उस पार’ फ़ारसी प्रशासन में फ़रात नदी के पश्चिम के भूभाग का नाम था।
    reason: cultural_note
lexical_decisions:
- source_word: כְּחָכְמַת אֱלָהָךְ
  choice: अपने परमेश्वर की उस बुद्धि के अनुसार
  rationale: כְּ अनुरूपता या मानक को व्यक्त करता है; ‘के अनुसार’ इस संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: דִּי בִידָךְ
  choice: जो तुम्हारे हाथ में है
  rationale: मूल अरामी रूपक को सुरक्षित रखा गया है; इसका आशय अधिकार में होना, प्राप्त होना या सौंपा जाना हो सकता है, इसलिए अर्थ को केवल ‘ज्ञान’ या ‘अधिकार’ तक सीमित नहीं किया गया।
- source_word: מֶנִּי
  choice: नियुक्त करो
  rationale: प्रशासनिक संदर्भ में यह अधिकारियों को पद पर ठहराने की आज्ञा है।
- source_word: שָׁפְטִין וְדַיָּנִין
  choice: हाकिमों और न्यायियों
  rationale: दो अलग प्रशासनिक-न्यायिक पदनामों को एक में मिलाने के बजाय हिंदी में अलग-अलग रखा गया है।
- source_word: דִּי לֶהֱוֺן דאנין
  choice: ताकि वे ... न्याय करें
  rationale: यह नियुक्त अधिकारियों के उद्देश्य और कार्य को व्यक्त करता है।
- source_word: לְכָל עַמָּה
  choice: सभी लोगों का
  rationale: सामूहिक एकवचन को स्वाभाविक हिंदी में बहुवचन सामूहिक रूप दिया गया है।
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: महानद के पार
  rationale: यह फ़ारसी प्रशासनिक दृष्टि से फ़रात के पश्चिमी भूभाग का प्रचलित भौगोलिक पदनाम है; ‘महानद’ शीर्षक-सदृश अभिव्यक्ति को बनाए रखता है।
- source_word: לְכָל יָדְעֵי דָּתֵי אֱלָהָךְ
  choice: उन सभी का जो तुम्हारे परमेश्वर के नियमों को जानते हैं
  rationale: דָּתֵי बहुवचन है, इसलिए ‘नियमों’ रखा गया; उपवाक्य को पिछले समूह के स्पष्टीकरण के रूप में प्रस्तुत किया गया है।
- source_word: וְדִי לָא יָדַע
  choice: और जो उन्हें नहीं जानते
  rationale: ‘उन्हें’ जोड़कर स्पष्ट किया गया है कि संकेत अभी उल्लिखित परमेश्वर के नियमों की ओर है।
- source_word: תְּהוֹדְעוּן
  choice: उन्हें तुम सब सिखाओ
  rationale: यह ידע का कारक बहुवचन रूप है, जिसका शाब्दिक भाव ‘ज्ञात कराना’ है। नियमों के संदर्भ में ‘सिखाओ’ स्वाभाविक है; ‘तुम सब’ द्वारा एकवचन संबोधन से बहुवचन क्रिया में हुए स्रोत-पाठ के बदलाव को भी सुरक्षित रखा गया है।
theological_decisions:
- issue: अंतिम क्रिया में एकवचन से बहुवचन संबोधन का बदलाव
  choice: ‘तुम सब सिखाओ’ के द्वारा बहुवचन को प्रत्यक्ष रखा गया
  alternative: ‘तुम सिखाओ’, जिसे केवल एज्रा के लिए एकवचन संबोधन समझा जा सकता है
  rationale: अरामी תְּהוֹדְעוּן स्पष्ट रूप से बहुवचन है। यह संभवतः एज्रा के साथ नियुक्त अधिकारियों को भी शिक्षा देने के कार्य में सम्मिलित करता है, पर पाठ इसे स्पष्ट नहीं करता; इसलिए अनुवाद बहुवचन बचाता है, बिना उसके आशय को निर्णायक रूप से व्याख्यायित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधे, गरिमापूर्ण राजकीय निर्देश की शैली रखी गई है। एज्रा के लिए ‘तुम’ सम्मानजनक और सहज है; अंतिम ‘तुम सब’ मूल अरामी के बहुवचन को अलग दिखाता है।
