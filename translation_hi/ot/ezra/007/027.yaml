  text: בָּר֥וּךְ יְהוָ֖ה אֱלֹהֵ֣י אֲבוֹתֵ֑י/נוּ אֲשֶׁ֨ר נָתַ֤ן כָּ/זֹאת֙ בְּ/לֵ֣ב הַ/מֶּ֔לֶךְ לְ/פָאֵ֕ר אֶת בֵּ֥ית יְהוָ֖ה אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/027.yaml
  text: Blessed be Yahweh[a], the God of our fathers, who put this into the king’s heart, to beautify the house of Yahweh that is in Jerusalem,
translation:
  language: hi
  text: हमारे पुरखों के परमेश्वर याहवे धन्य हो, जिसने राजा के मन में यह बात डाली कि वह यरूशलेम में स्थित याहवे के भवन को सुशोभित करे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सजाए” अथवा “महिमामय बनाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: यह आराधनापरक आशीर्वाद और स्तुति का सूत्र है। हिंदी में “धन्य है” इसका स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: हमारे पुरखों का परमेश्वर
  rationale: “पुरखों” से इब्रानी covenantal अभिव्यक्ति का पुरुषवाचक और परंपरागत भाव बना रहता है तथा यह आधुनिक हिंदी में सहज है।
- source_word: אֲשֶׁר נָתַן כָּזֹאת בְּלֵב הַמֶּלֶךְ
  choice: जिसने राजा के मन में यह बात डाली
  rationale: “मन में डालना” हिंदी का स्वाभाविक मुहावरा है और נתן के द्वारा अभिप्राय या इच्छा उत्पन्न किए जाने का भाव व्यक्त करता है; כָּזֹאת को प्रसंगानुसार “यह बात” कहा गया है।
- source_word: לְפָאֵר
  choice: सुशोभित करे
  rationale: पिएल रूप यहाँ भवन को सुंदर, भव्य या गौरवपूर्ण बनाने का ठोस भाव देता है। “सुशोभित करे” इस अर्थ को गरिमापूर्ण और स्वाभाविक हिंदी में रखता है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: “भवन” मूल “घर” की छवि को बनाए रखते हुए मंदिर के लिए हिंदी में उपयुक्त और प्रतिष्ठित शब्द है।
- source_word: אֲשֶׁר בִּירוּשָׁלִָם
  choice: यरूशलेम में स्थित
  rationale: यह संबंधवाचक उपवाक्य भवन का स्थान बताता है; संक्षिप्त हिंदी रूप अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। “याहवे” उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: לְפָאֵר में सौंदर्य और महिमा का अर्थक्षेत्र
  choice: सुशोभित करे
  alternative: सजाए; महिमा प्रदान करे
  rationale: संदर्भ में मंदिर को भव्य बनाने का ठोस अर्थ प्रमुख है, पर क्रिया में गौरव या महिमा का भाव भी संभव है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण आराधनापरक शैली अपनाई गई है। वाक्य के अंत का अल्पविराम अगले पद से इसके व्याकरणिक संबंध को बनाए रखता है।
