base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/026.yaml
  text: And anyone who will not obey the law of your God and the law of the king[a], let judgment be executed on him promptly, whether for death, or for banishment, or for confiscation of goods, or for imprisonment.
translation:
  language: hi
  text: और जो कोई तुम्हारे परमेश्वर की व्यवस्था और राजा की व्यवस्था का पालन न करे, उसके विरुद्ध तुरन्त दण्डादेश लागू किया जाए—चाहे मृत्युदण्ड हो, चाहे देश-निकाला[a], चाहे सम्पत्ति की जब्ती हो, या कारावास हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निष्कासन”; अधिक शाब्दिक रूप में, “जड़ से उखाड़ना।” यह अरामी शब्द दुर्लभ है और सम्भवतः किसी व्यक्ति को उसके स्थान या समुदाय से निकाल देने को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל דִּי
  choice: और जो कोई
  rationale: यह अनिश्चित सम्बन्धवाचक पद किसी भी ऐसे व्यक्ति को सूचित करता है जो आगे कही शर्त के अन्तर्गत आता है; कानूनी सन्दर्भ में यह स्वाभाविक और वितरणात्मक है।
- source_word: לָא לֶהֱוֵא עָבֵד
  choice: पालन न करे
  rationale: शाब्दिक अर्थ ‘न करे’ है, पर דָּתָא के साथ आशय कानून का अनुपालन करना है।
- source_word: דָּתָא
  choice: व्यवस्था
  rationale: यहाँ शब्द ईश्वरीय और राजकीय—दोनों कानूनी मानकों के लिए समानान्तर रूप से आया है; ‘व्यवस्था’ इस औपचारिक कानूनी अर्थ को व्यक्त करती है।
- source_word: אֱלָהָךְ
  choice: तुम्हारे परमेश्वर
  rationale: राजकीय आदेश में एज्रा को सम्बोधित एकवचन सम्बन्धसूचक रूप का सीधा अनुवाद।
- source_word: וְדָתָא דִּי מַלְכָּא
  choice: और राजा की व्यवस्था
  rationale: ‘तुम्हारे परमेश्वर की व्यवस्था’ के साथ मूल पाठ की समानान्तर संरचना बनाए रखता है।
- source_word: אָסְפַּרְנָא
  choice: तुरन्त
  rationale: क्रियाविशेषण शीघ्रता अथवा तत्परता का बोध कराता है; न्यायिक सन्दर्भ में ‘तुरन्त’ स्पष्ट और स्वाभाविक है।
- source_word: דִּינָה לֶהֱוֵא מִתְעֲבֵד מִנֵּהּ
  choice: उस पर दण्ड लागू किया जाए
  rationale: वाक्यांश अपराधी के विरुद्ध न्यायिक निर्णय कार्यान्वित किए जाने को दर्शाता है; आगे दिए दण्डों की सूची के कारण ‘दण्ड’ हिन्दी में अधिक स्पष्ट है।
- source_word: הֵן ... הֵן ... הֵן ... וְ
  choice: चाहे ... चाहे ... चाहे ... या
  rationale: यह रचना सम्भावित वैकल्पिक दण्डों की सूची देती है; हिन्दी में यह क्रम स्वाभाविक ढंग से विकल्प व्यक्त करता है।
- source_word: לְמוֹת
  choice: मृत्युदण्ड
  rationale: न्यायिक दण्डों की सूची में मृत्यु दिए जाने का संक्षिप्त और स्पष्ट कानूनी रूप।
- source_word: לשרשו
  choice: देश-निकाला
  rationale: दुर्लभ अरामी पद का मूल भाव ‘जड़ से उखाड़ना’ है और कानूनी सन्दर्भ में सम्भवतः स्थान या समुदाय से निष्कासन सूचित करता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לַעֲנָשׁ נִכְסִין
  choice: सम्पत्ति की जब्ती
  rationale: पद सम्पत्ति से सम्बन्धित दण्ड को सूचित करता है; राजकीय कानूनी सूची में जब्ती सम्भावित आशय को स्पष्ट करती है।
- source_word: וְלֶאֱסוּרִין
  choice: या कारावास
  rationale: मूल संज्ञा बन्धन अथवा कैद को दर्शाती है; न्यायिक प्रसंग में ‘कारावास’ लक्षित दण्ड को स्पष्ट करता है।
theological_decisions:
- issue: राजकीय आदेश में परमेश्वर की व्यवस्था और राजा की व्यवस्था का सम्बन्ध
  choice: दोनों को समानान्तर रूप से ‘तुम्हारे परमेश्वर की व्यवस्था और राजा की व्यवस्था’ कहा गया है।
  alternative: राजा की व्यवस्था को परमेश्वर की व्यवस्था के अधीन या केवल उसे लागू करने वाली व्यवस्था के रूप में प्रस्तुत करना।
  rationale: मूल पद दो कानूनी प्राधिकारों को समन्वयात्मक ढंग से रखता है; अनुवाद उनके बीच ऐसी श्रेणी या सम्बन्ध नहीं जोड़ता जिसे पद स्वयं स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘पालन’, ‘दण्ड लागू’, ‘सम्पत्ति की जब्ती’ और ‘कारावास’ साधारण पाठक के लिए स्पष्ट हैं; दुर्लभ לשרשו की वास्तविक अनिश्चितता पादटिप्पणी में दी गई है।
