  text: עַד כְּסַף֮ כַּכְּרִ֣ין מְאָה֒ וְ/עַד חִנְטִין֙ כֹּרִ֣ין מְאָ֔ה וְ/עַד חֲמַר֙ בַּתִּ֣ין מְאָ֔ה וְ/עַד בַּתִּ֥ין מְשַׁ֖ח מְאָ֑ה וּ/מְלַ֖ח דִּי לָ֥א כְתָֽב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/022.yaml
  text: up to one hundred talents of silver[a], and up to one hundred cors of wheat, and up to one hundred baths of wine, and up to one hundred baths of oil, and salt without limit.
translation:
  language: hi
  text: चाँदी के सौ किक्कार तक, गेहूँ के सौ कोर तक, दाखमधु के सौ बत तक, तेल के सौ बत तक, और नमक बिना किसी निर्धारित मात्रा के।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नमक, जिसके लिए कोई मात्रा लिखी नहीं गई,” अर्थात् नमक की कोई निश्चित मात्रा निर्धारित नहीं थी।
    reason: मूल अरामी मुहावरे के अधिक शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: עַד
  choice: तक
  rationale: प्रशासनिक सूची में यह प्रत्येक वस्तु की अधिकतम स्वीकृत मात्रा बताता है; हिंदी में संख्या और माप के बाद ‘तक’ स्वाभाविक और सटीक है।
- source_word: כְּסַף
  choice: चाँदी
  rationale: शब्द मूलतः धातु चाँदी को दर्शाता है और यहाँ उसे किक्कार में तौला गया है; इसलिए सामान्य ‘धन’ की अपेक्षा ‘चाँदी’ अधिक सटीक है।
- source_word: כַּכְּרִין
  choice: किक्कार
  rationale: यह भार की प्राचीन इकाई ‘किक्कार’ का बहुवचन है। अनुमानित आधुनिक रूपांतरण देने के बजाय मूल इकाई सुरक्षित रखी गई है।
- source_word: חִנְטִין
  choice: गेहूँ
  rationale: यह शब्द सामान्य अनाज नहीं, विशेष रूप से गेहूँ को दर्शाता है।
- source_word: כֹּרִין
  choice: कोर
  rationale: यह सूखी वस्तुओं की प्राचीन माप-इकाई है; अनिश्चित आधुनिक रूपांतरण के बजाय उसका पारंपरिक लिप्यंतरण रखा गया है।
- source_word: חֲמַר
  choice: दाखमधु
  rationale: यहाँ मंदिर के प्रबंध की वस्तुओं की सूची में दाख से बने मद्य का उल्लेख है; ‘दाखमधु’ वर्तमान हिंदी बाइबलीय गद्य में स्पष्ट और गरिमापूर्ण है।
- source_word: בַּתִּין
  choice: बत
  rationale: यह तरल पदार्थों की प्राचीन माप-इकाई ‘बत’ का बहुवचन है; हिंदी में संख्या के बाद इकाई का एकवचन रूप स्वाभाविक है।
- source_word: מְשַׁח
  choice: तेल
  rationale: मूल शब्द तेल को दर्शाता है। संभवतः जैतून का तेल अभिप्रेत है, पर मूल पाठ प्रकार स्पष्ट नहीं करता, इसलिए केवल ‘तेल’ रखा गया है।
- source_word: מְלַח
  choice: नमक
  rationale: सूची की अंतिम वस्तु के लिए सीधा और स्पष्ट हिंदी समतुल्य।
- source_word: דִּי לָא כְתָב
  choice: बिना किसी निर्धारित मात्रा के
  rationale: शाब्दिक रूप ‘जो लिखा नहीं गया’ है; प्रशासनिक संदर्भ में इसका अर्थ है कि नमक की कोई निश्चित मात्रा दर्ज या निर्धारित नहीं की गई थी। यह अनुवाद उस भाव को स्पष्ट करता है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
