  register: भाषा आधुनिक, संक्षिप्त और राजकीय आदेश की सूची-जैसी शैली के अनुरूप रखी गई है। प्राचीन माप-इकाइयों—किक्कार, कोर और बत—को अनुमानित आधुनिक मात्राओं में बदलने के बजाय सुरक्षित रखा गया है।
