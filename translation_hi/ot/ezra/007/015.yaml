  text: and to bring the silver and gold that the king and his counselors have freely offered to the God of Israel[a], whose dwelling is in Jerusalem,
translation:
  language: hi
  text: और उस चाँदी और सोने को ले जाने के लिए, जिसे राजा और उसके सलाहकारों ने इस्राएल के परमेश्वर को स्वेच्छा से अर्पित किया है[a], जिसका निवास यरूशलेम में है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो यरूशलेम में निवास करता है।” अरामी में अधिक शाब्दिक अर्थ है, “जिसका निवास यरूशलेम में है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְהֵיבָלָה
  choice: और ... ले जाने के लिए
  rationale: अरामी क्रियार्थक रूप राजकीय आदेश के उद्देश्य को व्यक्त करता है। संदर्भ में धन यरूशलेम पहुँचाया जा रहा है; इसलिए आधुनिक हिन्दी में ‘ले जाने के लिए’ स्वाभाविक है।
- source_word: כְּסַף וּדְהַב
  choice: उस चाँदी और सोने को
  rationale: आगे आने वाला संबंधवाचक उपवाक्य विशेष चाँदी और सोने की पहचान करता है, इसलिए हिन्दी में ‘उस’ जोड़ा गया है।
- source_word: מַלְכָּא וְיָעֲטוֹהִי
  choice: राजा और उसके मंत्रियों
  rationale: यह पद राजा और उसके राजकीय परामर्शदाताओं को दर्शाता है। ‘मंत्री’ सामान्य आधुनिक हिन्दी में दरबारी/राजकीय सलाहकार के अर्थ को सहजता से व्यक्त करता है।
- source_word: הִתְנַדַּבוּ
  choice: स्वेच्छा से अर्पित किया है
  rationale: क्रिया योगदान की स्वैच्छिकता और पूर्ण हो चुकी क्रिया—दोनों को व्यक्त करती है।
- source_word: לֶאֱלָהּ יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर को
  rationale: यह दिव्य उपाधि का सीधा और प्रचलित हिन्दी रूप है; ‘को’ अर्पण के प्राप्तकर्ता को दर्शाता है।
- source_word: דִּי בִירוּשְׁלֶם מִשְׁכְּנֵהּ
  choice: जिसका निवास यरूशलेम में है
  rationale: मूल अरामी में क्रिया ‘रहना’ के बजाय संज्ञात्मक ‘उसका निवास’ है। यह अनुवाद उसी संरचना और मन्दिर-केंद्रित भाव को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर और यरूशलेम के संबंध में מִשְׁכְּנֵהּ का अनुवाद
  choice: जिसका निवास यरूशलेम में है
  alternative: जो यरूशलेम में निवास करता है
  rationale: मूल पाठ संज्ञा ‘निवास’ का प्रयोग करता है। चुना गया रूप मन्दिर-केंद्रित कथन को सुरक्षित रखता है और परमेश्वर को स्थान-विशेष तक सीमित बताने वाली व्याख्या भी अनावश्यक रूप से नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और राजकीय आदेश के अनुकूल रूप। पद वाक्य के बीच का अंश है, इसलिए अंत में अल्पविराम रखा गया है।
