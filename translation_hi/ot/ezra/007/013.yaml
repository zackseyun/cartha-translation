  text: מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל מִתְנַדַּ֣ב בְּ/מַלְכוּתִ/י֩ מִן עַמָּ֨/ה יִשְׂרָאֵ֜ל וְ/כָהֲנ֣וֹ/הִי וְ/לֵוָיֵ֗/א לִ/מְהָ֧ךְ לִֽ/ירוּשְׁלֶ֛ם עִמָּ֖/ךְ יְהָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/013.yaml
  text: A decree is issued by me that anyone in my kingdom from the people of Israel[a], and their priests and Levites, who freely offers himself to go to Jerusalem with you[b], may go.
translation:
  language: hi
  text: मेरी ओर से यह आज्ञा दी जाती है कि मेरे राज्य में इस्राएल की प्रजा, उसके याजकों और लेवियों में से जो कोई अपनी इच्छा से तुम्हारे साथ यरूशलेम जाना चाहे, वह जा सकता है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנִּי שִׂים טְעֵם
  choice: मेरी ओर से यह आज्ञा दी जाती है
  rationale: राजकीय आदेश जारी करने के अरामी प्रशासनिक सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: כָל מִתְנַדַּב
  choice: जो कोई अपनी इच्छा से ... जाना चाहे
  rationale: हित्पएल कृदन्त में निहित स्वैच्छिक तत्परता को स्पष्ट करता है, बिना बाध्यता का भाव जोड़े।
- source_word: בְּמַלְכוּתִי
  choice: मेरे राज्य में
  rationale: राजा के अधीन क्षेत्र के लिए सीधा और सामान्य हिन्दी पदबंध।
- source_word: מִן עַמָּה יִשְׂרָאֵל וְכָהֲנוֹהִי וְלֵוָיֵא
  choice: इस्राएल की प्रजा, उसके याजकों और लेवियों में से
  rationale: सूची के तीन संबद्ध वर्गों को स्पष्ट करता है; एकवचन प्रत्यय का निकटतम संदर्भ इस्राएल/उसकी प्रजा माना गया है।
- source_word: לִמְהָךְ לִירוּשְׁלֶם עִמָּךְ
  choice: तुम्हारे साथ यरूशलेम जाना
  rationale: गंतव्य और एज्रा के साथ जाने—दोनों संबंधों को स्वाभाविक हिन्दी क्रम में रखता है।
- source_word: יְהָךְ
  choice: वह जा सकता है
  rationale: राजाज्ञा के प्रसंग में यह रूप अनुमति प्रदान करता है; हिन्दी में ‘जा सकता है’ उस अधिकृत अनुमति को सहजता से व्यक्त करता है।
