translation_notes:
  register: आधुनिक मानक हिन्दी; राजकीय घोषणा के अनुरूप औपचारिक किंतु सहज शैली। ‘अपनी इच्छा से’ स्वैच्छिकता को सुरक्षित रखता है। पाठ में कोई पादटिप्पणी आवश्यक नहीं समझी गई, क्योंकि प्रत्यय-संबंध का संदर्भानुकूल अर्थ मुख्य अनुवाद में स्पष्ट है।
