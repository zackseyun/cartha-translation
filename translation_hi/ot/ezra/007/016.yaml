translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली रखी गई है। पद पिछले वाक्य से ‘और’ द्वारा जुड़ता है, इसलिए मूल की संयोजक संरचना सुरक्षित है। ‘बाबेल’ बाइबलीय स्थान-नाम के रूप में और ‘याजक’ धार्मिक पदनाम के रूप में प्रयुक्त हैं।
