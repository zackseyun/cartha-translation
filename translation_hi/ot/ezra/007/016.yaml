id: EZR.7.16
reference: Ezra 7:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֹל֙ כְּסַ֣ף וּ/דְהַ֔ב דִּ֣י תְהַשְׁכַּ֔ח בְּ/כֹ֖ל מְדִינַ֣ת בָּבֶ֑ל עִם֩ הִתְנַדָּב֨וּת עַמָּ֤/א וְ/כָֽהֲנַיָּ/א֙ מִֽתְנַדְּבִ֔ין לְ/בֵ֥ית אֱלָהֲ/הֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/016.yaml
  text: and all the silver and gold that you find in all the province of Babylon[a], together with the freewill offering of the people and the priests[b], who are freely offering for the house of their God that is in Jerusalem.
translation:
  language: hi
  text: और बाबेल के पूरे प्रान्त में तुम्हें जो भी चाँदी और सोना मिले, साथ ही लोगों और याजकों की वह स्वेच्छा-भेंट[a], जो वे यरूशलेम में स्थित अपने परमेश्वर के भवन[b] के लिए अपनी इच्छा से दे रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्वैच्छिक भेंट।” अरामी शब्द ऐसी भेंट को दर्शाता है जो अपनी इच्छा से दी जाए, विशेषकर उपासना-स्थल के सन्दर्भ में।
    reason: lexical_alternative
  - marker: b
    text: “अपने परमेश्वर का भवन” यरूशलेम के मन्दिर को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְכֹל כְּסַף וּדְהַב
  choice: और…जो भी चाँदी और सोना
  rationale: וְ से पिछले कथन के साथ समन्वय बना रहता है, और כֹל की व्यापकता को हिन्दी में ‘जो भी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: דִּי תְהַשְׁכַּח
  choice: तुम्हें…मिले
  rationale: अरामी क्रिया का सीधा अर्थ ‘पाना/मिलना’ है; यह एज्रा को किए गए एकवचन सम्बोधन को भी बनाए रखता है।
- source_word: בְּכֹל מְדִינַת בָּבֶל
  choice: बाबेल के पूरे प्रान्त में
  rationale: מְדִינָה साम्राज्य के प्रशासनिक प्रान्त को दर्शाता है; ‘पूरे’ כֹל की व्यापकता व्यक्त करता है।
- source_word: הִתְנַדָּבוּת
  choice: स्वेच्छा-भेंट
  rationale: यह शब्द अपनी इच्छा से दी गई भेंट को दर्शाता है और यहाँ उपासना-सम्बन्धी दान का भाव भी रखता है।
- source_word: עַמָּא וְכָהֲנַיָּא
  choice: लोगों और याजकों की
  rationale: दोनों समूहों को समान रूप से भेंट के स्रोत के रूप में प्रस्तुत करता है और अरामी सम्बन्ध-रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתְנַדְּבִין
  choice: अपनी इच्छा से दे रहे हैं
  rationale: कृदन्त जारी स्वैच्छिक क्रिया व्यक्त करता है; यह הִתְנַדָּבוּת के साथ मूल शब्दगत सम्बन्ध को अर्थ के स्तर पर बनाए रखता है।
- source_word: לְבֵית אֱלָהֲהֹם
  choice: अपने परमेश्वर के भवन के लिए
  rationale: ‘भवन’ मूल के शाब्दिक ‘घर’ को गरिमापूर्ण हिन्दी में सुरक्षित रखता है, जबकि ‘के लिए’ भेंट के उद्देश्य को स्पष्ट करता है।
- source_word: דִּי בִירוּשְׁלֶם
  choice: जो…यरूशलेम में स्थित
  rationale: सम्बन्धवाचक उपवाक्य परमेश्वर के भवन का स्थान बताता है; ‘स्थित’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
