- source_word: בֵּית אֱלָהָךְ
  choice: तुम्हारे परमेश्वर का भवन
  rationale: ‘भवन’ अरामी ‘घर’ की उपासना-स्थल संबंधी अभिव्यक्ति को बनाए रखता है और ‘मन्दिर’ की अपेक्षा स्रोत के रूप के अधिक निकट है।
- source_word: יִפֶּל לָךְ לְמִנְתַּן
  choice: पूरा करना तुम्हारे जिम्मे आए
  rationale: शाब्दिक रूप से ‘देना तुम पर आ पड़े’; चुनी हुई अभिव्यक्ति दायित्व का भाव और प्रसंगानुसार आपूर्ति करने का अर्थ स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: תִּנְתֵּן
  choice: उसे तुम ... पूरा करना
  rationale: क्रिया में आदेश का बल है और उसका निहित कर्म पिछली ‘आवश्यकता’ है; ‘पूरा करना’ हिन्दी में पुनरुक्ति को अर्थपूर्ण ढंग से बनाए रखता है।
- source_word: מִן בֵּית גִּנְזֵי מַלְכָּא
  choice: राजा के खजाने से
  rationale: अरामी का अधिक शाब्दिक रूप ‘राजा के खजानों के भवन से’ है; यहाँ वह राजकीय कोषागार को दर्शाता है, इसलिए संक्षिप्त हिन्दी रूप स्पष्ट और स्वाभाविक है।
