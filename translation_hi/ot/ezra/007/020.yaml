  yaml_path: translation/ot/ezra/007/020.yaml
  text: And whatever other need of the house of your God falls to you to provide[a], you shall provide it from the house of the king’s treasuries.
translation:
  language: hi
  text: और तुम्हारे परमेश्वर के भवन की कोई अन्य आवश्यकता, जिसकी पूर्ति करना तुम्हारे जिम्मे पड़े, उसकी पूर्ति तुम राजा के खजाने से[a] करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अरामी में अधिक शाब्दिक रूप से, ‘राजा के खजानों के भवन से।’ अर्थात् राजा के कोषागार से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁאָר חַשְׁחוּת
  choice: जो भी दूसरी आवश्यकता
