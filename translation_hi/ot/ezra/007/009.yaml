base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/009.yaml
  text: For on the first day of the first month he began the journey up from Babylon, and on the first day of the fifth month he came to Jerusalem, according to the good hand of his God upon him.
translation:
  language: hi
  text: क्योंकि पहले महीने के पहले दिन उसने बाबुल से यात्रा आरम्भ की[a], और पाँचवें महीने के पहले दिन वह यरूशलेम पहुँचा, क्योंकि उसके परमेश्वर का भला हाथ उस पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल में एक दुर्लभ अभिव्यक्ति है, जिसका शब्दशः भाव है, “उसने चढ़ाई की नींव रखी।” इसका आशय बाबुल से ऊपर, अर्थात् यरूशलेम की ओर, यात्रा आरम्भ करने से है।
    reason: יְסֻד הַמַּעֲלָה के ‘नींव रखने’ और ‘चढ़ाई/ऊपर जाने’ के रूपक को सुरक्षित रखते हुए मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है।
lexical_decisions:
- source_word: יְסֻד הַמַּעֲלָה
  choice: चढ़ने की यात्रा आरम्भ की
  rationale: शब्दशः भाव ‘चढ़ाई/प्रस्थान की नींव रखना’ है; प्रसंग में इसका आशय बाबुल से यरूशलेम की यात्रा आरम्भ करना है। ‘चढ़ने’ से यरूशलेम की ओर जाने के लिए प्रयुक्त मूल रूपक भी बना रहता है।
- source_word: כְּיַד אֱלֹהָיו הַטּוֹבָה עָלָיו
  choice: उसके परमेश्वर का भला हाथ उस पर था
  rationale: ‘हाथ’ के मूल बिंब को सुरक्षित रखते हुए यह परमेश्वर की अनुकूल सहायता और संरक्षण व्यक्त करता है; इसे केवल ‘कृपा’ कहने से स्रोत का सजीव रूपक मिट जाता।
- source_word: בָּבֶל
  choice: बाबुल
  rationale: यह आधुनिक हिन्दी बाइबलीय प्रयोग में नगर/साम्राज्य के नाम का स्वाभाविक और प्रचलित रूप है।
theological_decisions:
- issue: परमेश्वर के ‘भले हाथ’ का अर्थ
  choice: रूपक को मुख्य पाठ में बनाए रखा गया
  alternative: ‘परमेश्वर की कृपा के कारण’ या ‘परमेश्वर की सहायता से’
  rationale: मूल पाठ यात्रा की सफलता को परमेश्वर की अनुकूल सक्रिय उपस्थिति से जोड़ता है। ‘भला हाथ’ उस दावे को बिना किसी संप्रदायगत व्याख्या के सुरक्षित रखता है।
- issue: כְּיַד के संबंध का अनुवाद
  choice: विराम-चिह्न के द्वारा यात्रा की सफलता का कारण/आधार बताया गया
  alternative: ‘उसके परमेश्वर के भले हाथ के अनुसार’
  rationale: शब्दशः ‘के अनुसार’ हिन्दी में अस्वाभाविक और अस्पष्ट होता; मूल आशय यह है कि वह परमेश्वर की अनुकूल सहायता के कारण पहुँचा।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज और गरिमापूर्ण रखी गई है। ‘चढ़ने की यात्रा’ और ‘भला हाथ’ जैसे मूल इब्रानी बिंबों को समझने योग्य रूप में सुरक्षित रखा गया है।
