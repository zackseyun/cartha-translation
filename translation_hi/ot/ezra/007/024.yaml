base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/024.yaml
  text: And we make known to you that it is not permitted to impose tribute[a], tax, or toll on any of the priests, Levites, singers, gatekeepers, temple servants[b], or servants of this house of God.
translation:
  language: hi
  text: और हम तुम्हें सूचित करते हैं कि याजकों, लेवियों, गायकों, द्वारपालों, मंदिर के सेवकों[a] या परमेश्वर के इस भवन में सेवा करने वालों में से किसी पर भी खिराज, कर या चुंगी[b] लगाने की अनुमति नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नतीनीम,” अरामी נְתִינַיָּא का पारंपरिक लिप्यंतरण।
    reason: lexical_alternative
  - marker: b
    text: ये तीन वित्तीय शब्द संभवतः अलग-अलग प्रकार के राजकीय शुल्कों को बताते हैं। “खिराज, कर या चुंगी” का अनुवाद “खिराज, उपकर या मार्ग-शुल्क” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְהוֹדְעִין
  choice: हम तुम्हें सूचित करते हैं
  rationale: यह राजकीय सूचना देने का औपचारिक अरामी प्रयोग है; यह हिन्दी में प्रशासनिक स्वर को स्वाभाविक रूप से बनाए रखता है।
- source_word: כָל
  choice: में से किसी पर भी
  rationale: निषेधात्मक कानूनी वाक्य में यह सूचीबद्ध वर्गों के प्रत्येक सदस्य को कर-मुक्त बताता है।
- source_word: כָּהֲנַיָּא
  choice: याजकों
  rationale: पुरोहित वर्ग के लिए प्रचलित और स्पष्ट बाइबलीय हिन्दी शब्द।
- source_word: לֵוָיֵא
  choice: लेवियों
  rationale: लेवीवंशी धार्मिक वर्ग का मानक हिन्दी रूप।
- source_word: זַמָּרַיָּא
  choice: गायकों
  rationale: मन्दिर की स्तुति-सेवा में गानेवालों का सीधा अर्थ व्यक्त करता है।
- source_word: תָרָעַיָּא
  choice: द्वारपालों
  rationale: द्वारों की देखरेख और रक्षा करनेवाले पद का स्वाभाविक हिन्दी नाम।
- source_word: נְתִינַיָּא
  choice: मन्दिर के सेवकों
  rationale: पारंपरिक लिप्यंतरण की अपेक्षा इस वर्ग के कार्य को सामान्य पाठक के लिए स्पष्ट करता है; वैकल्पिक नाम पादटिप्पणी में रखा गया है।
- source_word: פָלְחֵי בֵּית אֱלָהָא דְנָה
  choice: परमेश्वर के इस भवन में सेवा करनेवालों
  rationale: פָלְחֵי के व्यापक सेवा-संबंधी अर्थ को बनाए रखता है और मूल में अनुपस्थित 'अन्य' शब्द नहीं जोड़ता।
- source_word: מִנְדָּה
  choice: लगान
  rationale: राजकीय रूप से लगाए गए अंश या अधिभार का संकेत देता है और तीन वित्तीय पदों का भेद बनाए रखता है।
- source_word: בְלוֹ
  choice: कर
  rationale: सामान्य कर के अर्थ में उपयुक्त है और वित्तीय त्रयी का मध्य पद स्पष्ट रखता है।
- source_word: וַהֲלָךְ
  choice: चुंगी
  rationale: मार्ग, आवागमन या सीमा पर लिए जानेवाले शुल्क को संक्षेप में व्यक्त करता है।
- source_word: לָא שַׁלִּיט
  choice: लगाना उचित नहीं है
  rationale: यहाँ कानूनी अधिकार या अनुमति के अभाव को सहज औपचारिक हिन्दी में व्यक्त करता है, न कि केवल नैतिक अनुचितता को।
