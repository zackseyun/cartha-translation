  text: וּ/מָ֣ה דִי֩ עלי/ך וְ/עַל אחי/ך יֵיטַ֗ב בִּ/שְׁאָ֛ר כַּסְפָּ֥/א וְ/דַהֲבָ֖/ה לְ/מֶעְבַּ֑ד כִּ/רְע֥וּת אֱלָהֲ/כֹ֖ם תַּעַבְדֽוּן־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/018.yaml
  text: And whatever seems good to you and your brothers to do with the rest of the silver and the gold[b][a], do according to the will of your God.
translation:
  language: hi
  text: और बची हुई चाँदी और सोने के साथ जो कुछ करना तुम्हें और तुम्हारे भाइयों को अच्छा लगे[a], वह अपने परमेश्वर की इच्छा[b] के अनुसार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें और तुम्हारे भाइयों के लिए अच्छा हो।” अरामी मुहावरे का अधिक शाब्दिक अनुवाद “अच्छा हो” और भावानुसार अनुवाद “अच्छा लगे” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने परमेश्वर की अभिलाषा के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה דִי
  choice: और ... जो कुछ
  rationale: यह अरामी पदबंध अनिश्चित संबंधवाचक वाक्यांश आरम्भ करता है; हिंदी में ‘जो कुछ’ उसके खुले अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲלָיִךְ וְעַל אַחַיִךְ יֵיטַב
  choice: तुम्हें और तुम्हारे भाइयों को अच्छा लगे
  rationale: यטב के साथ עַל का मुहावरा किसी व्यक्ति को कोई बात अच्छी या उचित लगने का भाव देता है। यह अनुवाद राजकीय अनुमति के विचार-विमर्श वाले स्वर को बनाए रखता है।
- source_word: אַחַיִךְ
  choice: तुम्हारे भाइयों
  rationale: मूल शब्द का सीधा अर्थ ‘भाई’ है। संदर्भ में ये एज्रा के साथी यहूदी या सहयोगी हो सकते हैं, पर अनुवाद मूल के संबंधसूचक शब्द को बनाए रखता है।
- source_word: בִּשְׁאָר כַּסְפָּא וְדַהֲבָה
  choice: बची हुई चाँदी और सोने से
  rationale: שְׁאָר उस धन को दर्शाता है जो पहले बताए गए व्यय के बाद बचा हो; ‘बची हुई’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לְמֶעְבַּד
  choice: करना
  rationale: यहाँ עבד का अर्थ व्यापक रूप से धन के साथ कुछ करने या उसका उपयोग करने से है; ‘करना’ मूल की व्यापकता बनाए रखता है।
- source_word: כִּרְעוּת
  choice: इच्छा के अनुसार
  rationale: רְעוּת का अर्थ इच्छा, अभिलाषा या प्रसन्नता हो सकता है। ‘इच्छा के अनुसार’ राजकीय आदेश के औपचारिक स्वर और परमेश्वर की मंशा—दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֱלָהֲכֹם
  choice: अपने परमेश्वर
  rationale: बहुवचन संबोधन के संदर्भ में यह एज्रा और उसके साथियों के परमेश्वर को निर्दिष्ट करता है। ‘अपने’ हिंदी में संबंध को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: תַּעַבְדוּן
  choice: तुम लोग ... करो
  rationale: क्रिया बहुवचन है और आदेश अथवा अधिकृत निर्देश का भाव रखती है। ‘तुम लोग ... करो’ इस बहुवचन निर्देश को स्पष्ट करता है।
theological_decisions:
- issue: אֱלָהֲכֹם में परमेश्वर का विशिष्ट संदर्भ
  choice: अपने परमेश्वर
  alternative: अपने देवता
  rationale: यह पद एज्रा और उसके साथियों द्वारा उपासित इस्राएल के परमेश्वर को निर्दिष्ट करता है, किसी अनिश्चित देवता को नहीं। ‘परमेश्वर’ हिंदी बाइबिलीय शैली में इस विशिष्ट संदर्भ को बिना अतिरिक्त सांप्रदायिक अर्थ जोड़े व्यक्त करता है।
- issue: כִּרְעוּת में दिव्य इच्छा और अभिलाषा के बीच अर्थ-व्याप्ति
  choice: इच्छा
  alternative: अभिलाषा
  rationale: मूल संज्ञा ‘इच्छा’, ‘अभिलाषा’ या ‘प्रसन्नता’ का भाव दे सकती है। मुख्य पाठ में ‘इच्छा’ व्यापक और स्वाभाविक है, जबकि पाद-टिप्पणी वास्तविक शाब्दिक विकल्प को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में है, पर राजकीय आदेश के अनुरूप गरिमापूर्ण रखी गई है। ‘चाँदी और सोना’, ‘भाइयों’ और ‘परमेश्वर की इच्छा’ जैसे स्रोत-समीप पद बनाए गए हैं; बहुवचन क्रिया को ‘तुम लोग ... करो’ से स्पष्ट किया गया है।
