source:
  edition: WLC
  text: כָּל דִּ֗י מִן טַ֨עַם֙ אֱלָ֣הּ שְׁמַיָּ֔/א יִתְעֲבֵד֙ אַדְרַזְדָּ֔א לְ/בֵ֖ית אֱלָ֣הּ שְׁמַיָּ֑/א דִּֽי לְ/מָ֤ה לֶֽהֱוֵא֙ קְצַ֔ף עַל מַלְכ֥וּת מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/023.yaml
  text: Whatever is commanded by the God of heaven[a], let it be done diligently for the house of the God of heaven[b], lest wrath come upon the kingdom of the king and his sons.
translation:
  language: hi
  text: स्वर्ग के परमेश्वर की ओर से जो कुछ आज्ञा दी गई है, वह स्वर्ग के परमेश्वर के भवन[a] के लिए पूरी तत्परता से किया जाए, ऐसा न हो कि राजा के राज्य और उसके पुत्रों पर कोप आए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “स्वर्ग के परमेश्वर का भवन” मंदिर को सूचित करता है।
    reason: cultural_note
  - marker: b
    text: 'अधिक शब्दशः: “राजा के राज्य और उसके पुत्रों पर कोप क्यों हो?”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דִּי
  choice: जो कुछ
  rationale: यह अनिश्चित किन्तु सर्वसमावेशी सम्बन्धवाचक पद है; ‘जो कुछ’ आधुनिक हिन्दी में स्वाभाविक है और सम्पूर्णता का भाव बनाए रखता है।
- source_word: מִן טַעַם אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर की ओर से ... आज्ञा दी गई है
  rationale: טַעַם यहाँ राजकीय-प्रशासनिक सन्दर्भ में आज्ञा या आदेश को सूचित करता है, और מִן उसके स्रोत को व्यक्त करता है।
- source_word: יִתְעֲבֵד
  choice: किया जाए
  rationale: निष्क्रिय अपूर्ण क्रिया यहाँ निर्देशात्मक भाव रखती है; ‘किया जाए’ हिन्दी में इस आदेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַדְרַזְדָּא
  choice: पूरी तत्परता से
  rationale: यह दुर्लभ क्रियाविशेषण सावधानी, ठीक रीति और शीघ्र तत्परता से कार्य करने का प्रशासनिक बल रखता है; यह चयन उसके आग्रहपूर्ण भाव को संक्षेप में व्यक्त करता है।
- source_word: לְבֵית אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर के भवन के लिए
  rationale: בֵית का मूल अर्थ ‘भवन/घर’ है और प्रसंग में यह मन्दिर को सूचित करता है। मुख्य पाठ में स्रोत-रूपक रखा गया है।
- source_word: דִּי לְמָה לֶהֱוֵא קְצַף
  choice: जिससे ... कोप न आए
  rationale: अरामी पद का शब्दशः रूप नकारात्मक आलंकारिक प्रश्न है—‘क्यों कोप हो?’—पर प्रसंग में वह चेतावनी और बचाव का प्रयोजन व्यक्त करता है। हिन्दी मुख्य पाठ में वही व्यावहारिक बल रखा गया है और शब्दशः सम्भावना पादटिप्पणी में दी गई है।
- source_word: עַל מַלְכוּת מַלְכָּא
  choice: राजा के राज्य ... पर
  rationale: מַלְכוּת राजा के शासन-क्षेत्र या राज्य को दर्शाता है, केवल राजा के व्यक्ति को नहीं।
- source_word: וּבְנוֹהִי
  choice: और उसके पुत्रों
  rationale: शब्द का सीधा अर्थ ‘उसके पुत्र’ है; सम्भावित वंशगत संकेत को मुख्य पाठ में ‘वंशज’ बनाकर विस्तृत नहीं किया गया।
theological_decisions:
- issue: בֵית אֱלָהּ שְׁמַיָּא में मन्दिर का उल्लेख
  choice: स्वर्ग के परमेश्वर के भवन
  alternative: स्वर्ग के परमेश्वर के मन्दिर
  rationale: मूल पाठ का ‘भवन/घर’ रूपक सुरक्षित रखा गया है; पाठक की स्पष्टता के लिए मन्दिर का आशय पादटिप्पणी में बताया गया है।
- issue: चेतावनी-वाक्य דִּי לְמָה का रूप
  choice: जिससे ... कोप न आए
  alternative: राजा के राज्य और उसके पुत्रों पर कोप क्यों हो?
  rationale: मुख्य पाठ में निषेधात्मक प्रयोजन और चेतावनी का स्वाभाविक हिन्दी रूप दिया गया है, जबकि मूल के आलंकारिक प्रश्न को पादटिप्पणी में सुरक्षित रखा गया है। कोप को स्पष्ट रूप से ‘परमेश्वर का’ नहीं कहा गया, क्योंकि मूल वाक्य में उसका कर्ता व्यक्त नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भवन’ स्रोत के रूपक को बचाता है; ‘पूरी तत्परता से’ प्रशासनिक आदेश की सावधानी और शीघ्रता दोनों का भाव देता है।
