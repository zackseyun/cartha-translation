  text: אַ֨רְתַּחְשַׁ֔סְתְּא מֶ֖לֶךְ מַלְכַיָּ֑/א לְ/עֶזְרָ֣א כָ֠הֲנָ/א סָפַ֨ר דָּתָ֜/א דִּֽי אֱלָ֧הּ שְׁמַיָּ֛/א גְּמִ֖יר וּ/כְעֶֽנֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/012.yaml
  text: 'Artaxerxes[a], king of kings, to Ezra the priest, the scribe of the law of the God of heaven: complete peace[b]. And now—'
translation:
  language: hi
  text: '“अर्तक्षत्र, राजाओं का राजा, याजक और स्वर्ग के परमेश्वर की व्यवस्था[a] के शास्त्री एज्रा के नाम: पूर्ण शांति[b]। अब—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “स्वर्ग के परमेश्वर के आदेश के शास्त्री।” अरामी शब्द का अर्थ “व्यवस्था,” “विधान” या “आदेश” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यह अरामी पत्राचार का सूत्रात्मक अभिवादन है। इसका अनुवाद “संपूर्ण शांति,” “उत्तम शांति” या अधिक मुहावरेदार ढंग से “नमस्कार” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַ֨רְתַּחְשַׁ֔סְתְּא
  choice: अर्तक्षत्र
  rationale: फारसी राजा के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; नाम का अनुवाद नहीं किया गया है।
- source_word: מֶ֖לֶךְ מַלְכַיָּ֑א
  choice: राजाओं का राजा
  rationale: राजकीय उपाधि की अरामी संरचना और अतिशयोक्तिपूर्ण भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לְעֶזְרָ֣א כָ֠הֲנָא
  choice: याजक ... एज्रा के नाम
  rationale: לְ पत्र के संबोधित व्यक्ति को चिह्नित करता है; हिन्दी पत्र-शैली में ‘के नाम’ स्वाभाविक है, और כָהֲנָא को पदनाम ‘याजक’ के रूप में रखा गया है।
- source_word: סָפַר דָּתָא
  choice: व्यवस्था के शास्त्री
  rationale: סָפַר का मूल अर्थ ‘शास्त्री/लेखक’ और דָּתָא का यहाँ धार्मिक-कानूनी अर्थ ‘व्यवस्था’ है; ‘शास्त्री’ एज्रा की ज्ञात भूमिका को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: דִּי אֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर की
  rationale: अरामी संबंधवाचक संरचना और स्थापित ईश्वरीय उपाधि का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: גְּמִיר
  choice: पूर्ण शांति
  rationale: גְּמִיר का अर्थ ‘पूर्ण/संपूर्ण’ है; पत्र-संबंधी अभिवादन में निहित ‘शांति’ को स्पष्ट करके सूत्रात्मक अभिवादन को सुरक्षित रखा गया है।
- source_word: וּכְעֶנֶת
  choice: अब—
  rationale: राजकीय पत्र में अभिवादन से मुख्य विषय की ओर संक्रमण कराता है; दीर्घ विराम-चिह्न बताता है कि कथन अगले पद में जारी है।
theological_decisions:
- issue: דָּתָא का अर्थ एज्रा और स्वर्ग के परमेश्वर के संदर्भ में
  choice: व्यवस्था
  alternative: आदेश
  rationale: शब्द राजकीय आदेश या विधान भी दर्शा सकता है, पर यहाँ परमेश्वर और एज्रा की शास्त्रीय भूमिका के साथ इसका धार्मिक-कानूनी अर्थ अधिक उपयुक्त है। वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- issue: גְּמִיר וּכְעֶנֶת की संक्षिप्त पत्राचार-सूत्र शैली
  choice: पूर्ण शांति। अब—
  alternative: नमस्कार। अब—
  rationale: चुना हुआ रूप ‘पूर्ण’ के शाब्दिक बल और अभिवादन के शांति-भाव, दोनों को बनाए रखता है; अधिक मुहावरेदार ‘नमस्कार’ मूल की विशिष्टता को कम कर देता।
- issue: מֶלֶךְ מַלְכַיָּא की राजकीय उपाधि
  choice: राजाओं का राजा
  alternative: राजा, राजाओं का राजा
  rationale: यह फारसी सम्राट की औपचारिक उपाधि है। संक्षिप्त हिन्दी रूप स्रोत का अर्थ रखता है और अनावश्यक पुनरुक्ति से बचता है; इससे कोई अतिरिक्त धर्मशास्त्रीय दावा नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में राजकीय पत्र की गरिमा और संक्षिप्तता रखी गई है। ‘के नाम’ संबोधन को स्वाभाविक बनाता है; ‘अब—’ अगले पद में जारी वाक्य का संकेत देता है। सभी पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद दिए गए हैं।
