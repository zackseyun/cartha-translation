  text: בֶּן אֲבִישׁ֗וּעַ בֶּן פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן הָ/רֹֽאשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/005.yaml
  text: son of Abishua[a], son of Phinehas, son of Eleazar[b], son of Aaron the chief priest.
translation:
  language: hi
  text: अबीशू का पुत्र[a], पीनहास का पुत्र, एलीआज़र का पुत्र, प्रधान याजक[b] हारून का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावली के संदर्भ में “पुत्र” का अर्थ व्यापक रूप से “वंशज” भी हो सकता है; इब्रानी वंशावलियों में कभी-कभी बीच की पीढ़ियाँ छोड़ दी जाती हैं।
    reason: lexical_alternative
  - marker: b
    text: परंपरागत अनुवाद “महायाजक” है। इब्रानी में यहाँ शाब्दिक रूप से “याजक, प्रधान/मुखिया” लिखा है, न कि “महायाजक” के लिए अधिक सामान्य पद।
    reason: alternative_reading
lexical_decisions:
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली में यह संबंध बताने वाला बार-बार दोहराया गया शब्द है। मुख्य पाठ में इसका सीधा अर्थ रखा गया है, जबकि ऐसी वंशावलियों में इसके व्यापक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: אֲבִישׁוּעַ
  choice: अबीशू
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और सहज हिन्दी लिप्यंतरण।
- source_word: פִּינְחָס
  choice: पीनहास
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֶלְעָזָר
  choice: एलीआज़र
  rationale: इब्रानी व्यक्तिगत नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: नाम का हिन्दी में व्यापक रूप से परिचित बाइबलीय रूप।
- source_word: הַכֹּהֵן הָרֹאשׁ
  choice: प्रधान याजक
  rationale: शाब्दिक संरचना ‘याजक, प्रधान/मुखिया’ है। ‘प्रधान याजक’ स्वाभाविक हिन्दी में רֹאשׁ की प्रधानता का अर्थ सुरक्षित रखता है और इसे अधिक प्रचलित तकनीकी पद ‘महायाजक’ के साथ बिना सूचना के एक नहीं करता।
theological_decisions:
- issue: हारून की याजकीय उपाधि
  choice: प्रधान याजक
  alternative: महायाजक
  rationale: इब्रानी में यहाँ הַכֹּהֵן הָרֹאשׁ है, अर्थात ‘याजक, प्रधान/मुखिया’; सामान्य तकनीकी पद הַכֹּהֵן הַגָּדוֹל नहीं है। इसलिए ‘प्रधान याजक’ मूल अभिव्यक्ति के भेद और संभावित तनाव को बनाए रखता है।
- issue: वंशावली में בֶּן का दायरा
  choice: पुत्र
  alternative: वंशज
  rationale: मुख्य पाठ में बार-बार आए संबंधसूचक शब्द का सीधा रूप रखा गया है; किंतु इब्रानी वंशावलियाँ बीच की पीढ़ियाँ छोड़ सकती हैं, इसलिए व्यापक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली की संक्षिप्त शैली के अनुरूप रखी गई है। स्रोत में क्रिया न होने के कारण हिन्दी पाठ में भी कोई अतिरिक्त क्रिया नहीं जोड़ी गई। नाम परिचित हिन्दी बाइबलीय रूपों में दिए गए हैं।
