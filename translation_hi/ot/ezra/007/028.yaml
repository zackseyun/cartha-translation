base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/028.yaml
  text: and who extended steadfast love to me before the king and his counselors and all the king’s mighty officials[a]. And I took courage, because the hand of Yahweh my God was upon me[c][b], and I gathered leading men from Israel to go up with me.
translation:
  language: hi
  text: और जिसने राजा, उसके सलाहकारों और राजा के सभी शक्तिशाली अधिकारियों के सामने मुझ पर अटल प्रेम दिखाया।[a] तब मैंने साहस बाँधा, क्योंकि मेरे परमेश्वर यहोवा का हाथ मुझ पर था;[b] और मैंने इस्राएल में से प्रमुख पुरुषों[c] को अपने साथ ऊपर जाने के लिए इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझ पर कृपा की।”
    reason: חֶסֶד का इस राजकीय संदर्भ में ‘कृपा’ अथवा ‘अनुग्रह’ अर्थ भी संभव है।
  - marker: b
    text: 'अधिक शाब्दिक रूप में: “मेरे परमेश्वर यहोवा का हाथ मुझ पर होने के अनुसार मैंने अपने को दृढ़ किया।”'
    reason: הִתְחַזַּקְתִּי और כְּיַד की मूल संरचना तथा उसकी संभावित औपचारिक व्याख्या सुरक्षित रखने के लिए।
  - marker: c
    text: शाब्दिक रूप में “सिरों,” अर्थात इस्राएल के अगुओं या प्रधानों को।
    reason: רָאשִׁים के शाब्दिक रूपक और अभिप्रेत सामाजिक भूमिका को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: הִטָּה חֶסֶד
  choice: मुझ पर अटल प्रेम दिखाया
  rationale: यह पदबंध शाब्दिक रूप से חסד को किसी की ओर बढ़ाने या झुकाने का भाव रखता है। ‘अटल प्रेम दिखाया’ स्वाभाविक हिन्दी में उस स्थायी, निष्ठावान कृपा का भार बनाए रखता है।
- source_word: יֹעֲצָיו
  choice: उसके सलाहकारों
  rationale: राजदरबार के संदर्भ में आधुनिक और सहज हिन्दी।
- source_word: שָׂרֵי הַמֶּלֶךְ הַגִּבֹּרִים
  choice: राजा के सभी शक्तिशाली अधिकारियों
  rationale: שׂרים उच्च पदाधिकारियों को और גברים यहाँ उनके सामर्थ्य या प्रभाव को सूचित करता है; यह रूप फ़ारसी प्रशासनिक संदर्भ के अनुकूल है।
- source_word: הִתְחַזַּקְתִּי
  choice: मैंने साहस बाँधा
  rationale: हित्पएल रूप के स्वयं को दृढ़ करने अथवा उत्साहित होने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि अगले वाक्यांश में सामर्थ्य का ईश्वरीय आधार स्पष्ट रहता है।
- source_word: כְּיַד יְהוָה אֱלֹהַי עָלַי
  choice: क्योंकि मेरे परमेश्वर यहोवा का हाथ मुझ पर था
  rationale: ‘हाथ’ का मूल रूपक सुरक्षित है और כ־ को प्रसंगानुसार साहस का आधार बताने वाले कारणात्मक अर्थ में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: רָאשִׁים
  choice: प्रधान पुरुषों
  rationale: शाब्दिक ‘सिरों’ का आशय समुदाय के मान्य अगुओं से है; ‘प्रधान पुरुष’ मूल के पुरुषवाचक और सामाजिक नेतृत्व, दोनों को स्पष्ट करता है।
- source_word: לַעֲלוֹת עִמִּי
  choice: कि वे मेरे साथ ऊपर चलें
  rationale: यरूशलेम की यात्रा के लिए प्रयुक्त ‘ऊपर जाने’ की बाइबलीय दिशात्मक भाषा को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश-नाम का प्रयोग करता है। हिन्दी पाठकों में सुविदित ‘यहोवा’ नामात्मक स्वरूप को बनाए रखता है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: עז्रा के साहस और परमेश्वर के हाथ का संबंध
  choice: ‘क्योंकि’ द्वारा कारणात्मक संबंध
  alternative: ‘मेरे परमेश्वर यहोवा का हाथ मुझ पर होने के अनुसार मैंने अपने को दृढ़ किया’
  rationale: כְּיַד की औपचारिक संरचना ‘के अनुसार’ हो सकती है, पर प्रसंग में परमेश्वर का हाथ एज्रा के साहस का आधार है। मुख्य पाठ स्वाभाविक कारणात्मक अर्थ देता है और पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘अटल प्रेम,’ ‘साहस बाँधा,’ और ‘ऊपर चलें’ मूल की धर्मवैचारिक तथा दिशात्मक भाषा को स्वाभाविक हिन्दी में सुरक्षित रखते हैं।
