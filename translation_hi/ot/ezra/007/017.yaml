  register: आधुनिक मानक हिन्दी में राजकीय आदेश की संक्षिप्त, गरिमापूर्ण शैली रखी गई है। ‘चाँदी’, ‘भवन’ और बलिदानी पदावली मूल अरामी की ठोस अभिव्यक्तियों को सुरक्षित रखते हैं; साथ ही ‘उनके साथ चढ़ाए जानेवाले’ संबंधवाचक प्रत्ययों का आशय स्पष्ट करता है।
