  text: כָּ/ל קֳבֵ֣ל דְּנָה֩ אָסְפַּ֨רְנָא תִקְנֵ֜א בְּ/כַסְפָּ֣/א דְנָ֗ה תּוֹרִ֤ין דִּכְרִין֙ אִמְּרִ֔ין וּ/מִנְחָתְ/ה֖וֹן וְ/נִסְכֵּי/ה֑וֹן וּ/תְקָרֵ֣ב הִמּ֔וֹ עַֽל מַדְבְּחָ֔/ה דִּ֛י בֵּ֥ית אֱלָהֲ/כֹ֖ם דִּ֥י בִ/ירוּשְׁלֶֽם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/007/017.yaml
  text: Therefore you shall diligently buy with this silver bulls[a], rams, lambs, along with their grain offerings and their drink offerings[c][b], and you shall offer them on the altar of the house of your God that is in Jerusalem.
translation:
  language: hi
  text: इसलिए इस चाँदी से सावधानीपूर्वक बैल, मेढ़े और मेमने, और उनकी अन्न-भेंटें और पेय-भेंटें खरीदना, और उन्हें यरूशलेम में स्थित तुम्हारे परमेश्वर के भवन की वेदी पर चढ़ाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל־קֳבֵל דְּנָה
  choice: इसलिए
  rationale: यह अरामी मुहावरा पूर्ववर्ती आदेश से निष्कर्ष या परिणाम व्यक्त करता है; ‘इसलिए’ सहज और संक्षिप्त है।
- source_word: אָסְפַּרְנָא
  choice: ठीक-ठीक
  rationale: क्रिया-विशेषण आदेश को सावधानी और यथार्थता से पूरा करने पर बल देता है; ‘ठीक-ठीक’ उसका प्रशासनिक भाव स्पष्ट करता है।
- source_word: תִקְנֵא
  choice: मोल लेना
  rationale: मूल अर्थ ‘खरीदना’ है; आदेश-पत्र की शैली के अनुरूप अनन्त क्रिया का प्रयोग अगले आदेश ‘चढ़ाना’ के साथ स्वाभाविक है।
- source_word: בְּכַסְפָּא דְנָה
  choice: इस चाँदी से
  rationale: כַּסְפָּא का शाब्दिक अर्थ ‘चाँदी’ है और यहाँ उससे उपलब्ध धनराशि अभिप्रेत है; स्रोत की मूर्त अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: תּוֹרִין דִּכְרִין אִמְּרִין
  choice: बैल, मेढ़े और मेमने
  rationale: ये बलिदान के पशुओं के स्पष्ट, प्रचलित और संदर्भानुकूल हिन्दी नाम हैं।
- source_word: מִנְחָתְהוֹן
  choice: उनके साथ चढ़ाए जानेवाले अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה अनाज से संबंधित भेंट है; प्रत्यय पशुबलियों के साथ उसके संबंध को दर्शाता है।
- source_word: נִסְכֵּיהוֹן
  choice: अर्घ्य
  rationale: यह उँडेली जानेवाली पेय-भेंट का पारंपरिक किन्तु समझने योग्य हिन्दी पद है; प्रत्यय इसके संबंधित पशुबलियों के साथ होने का संकेत देता है।
- source_word: וּתְקָרֵב הִמּוֹ
  choice: और उन्हें ... चढ़ाना
  rationale: संदर्भ वेदी पर बलिदान का है, इसलिए ‘चढ़ाना’ ‘निकट लाना/प्रस्तुत करना’ से अधिक स्वाभाविक और सटीक है।
- source_word: בֵּית אֱלָהֲכֹם
  choice: तुम्हारे परमेश्वर का भवन
  rationale: ‘भवन’ मूल के ‘घर’ रूपक को बनाए रखता है और मंदिर का स्पष्ट संकेत भी देता है।
