base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/003.yaml
  text: 'In the first year of King Cyrus[a], Cyrus the king issued a decree: Concerning the house of God in Jerusalem, let the house be rebuilt, the place where they offer sacrifices, and let its foundations be laid. Its height shall be sixty cubits, and its width sixty cubits,'
translation:
  language: hi
  text: 'राजा कुस्रू के पहले वर्ष में राजा कुस्रू ने यह राजाज्ञा दी: “यरूशलेम में परमेश्वर के भवन के विषय में: वह भवन फिर बनाया जाए—वह स्थान जहाँ बलिदान चढ़ाए जाते हैं—और उसकी नींवें डाली जाएँ[a]। उसकी ऊँचाई साठ हाथ और उसकी चौड़ाई साठ हाथ हों।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “और उसकी नींवें बनी रहें/ऊँची उठाई जाएँ।” अरामी वाक्यांश कठिन है और इसके अनुवाद अलग-अलग हैं; निर्माण के सन्दर्भ में “उसकी नींवें डाली जाएँ” सबसे उपयुक्त जान पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂם טְעֵם
  choice: यह राजाज्ञा दी
  rationale: यह अरामी प्रशासनिक मुहावरा किसी आधिकारिक आदेश को जारी करने का बोध देता है। ‘राजाज्ञा दी’ कुस्रू के राजकीय आदेश के लिए स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: בֵּית אֱלָהָא
  choice: परमेश्वर का भवन
  rationale: मूल का शाब्दिक अर्थ ‘परमेश्वर का भवन’ है। ‘मन्दिर’ आशय को स्पष्ट करता, पर ‘भवन’ रखने से मूल की पुनरावृत्ति और निर्माण-सन्दर्भ सुरक्षित रहते हैं।
- source_word: יִתְבְּנֵא
  choice: वह भवन फिर बनाया जाए
  rationale: आज्ञापत्र के सन्दर्भ में यह रूप आदेशात्मक भाव रखता है। क्रिया अपने आप में ‘बनाया जाए’ है, जबकि ऐतिहासिक सन्दर्भ उसके पुनर्निर्माण को सूचित करता है; इसलिए ‘फिर बनाया जाए’ दोनों बातों को सहज रूप से व्यक्त करता है।
- source_word: אֲתַר דִּי דָבְחִין דִּבְחִין
  choice: वह स्थान जहाँ बलिदान चढ़ाए जाते हैं
  rationale: अरामी में एक ही धातु के क्रिया और संज्ञा रूप साथ आए हैं। हिन्दी में ‘बलिदान चढ़ाए जाते हैं’ अर्थ को बिना अस्वाभाविक पुनरुक्ति के व्यक्त करता है।
- source_word: וְאֻשּׁוֹהִי מְסוֹבְלִין
  choice: और उसकी नींवें डाली जाएँ
  rationale: यह अरामी वाक्यांश कठिन और विवादित है। निर्माण-सन्दर्भ में ‘नींवें डाली जाएँ’ सर्वाधिक संगत है, पर अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: רוּמֵהּ ... פְּתָיֵהּ
  choice: उसकी ऊँचाई ... और उसकी चौड़ाई
  rationale: ये सीधे वास्तुशिल्पीय शब्द हैं; ‘ऊँचाई’ और ‘चौड़ाई’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक हैं।
- source_word: אַמִּין שִׁתִּין
  choice: साठ हाथ
  rationale: ‘हाथ’ प्राचीन ‘क्यूबिट’ के लिए प्रचलित हिन्दी बाइबलीय माप है और आधुनिक इकाई में अनिश्चित रूपान्तरण करने से बचाता है।
