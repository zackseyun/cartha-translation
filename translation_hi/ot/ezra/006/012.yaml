  text: וֵֽ/אלָהָ֞/א דִּ֣י שַׁכִּ֧ן שְׁמֵ֣/הּ תַּמָּ֗ה יְמַגַּ֞ר כָּל מֶ֤לֶךְ וְ/עַם֙ דִּ֣י יִשְׁלַ֣ח יְדֵ֗/הּ לְ/הַשְׁנָיָ֛ה לְ/חַבָּלָ֛ה בֵּית אֱלָהָ֥/א דֵ֖ךְ דִּ֣י בִ/ירוּשְׁלֶ֑ם אֲנָ֤ה דָרְיָ֨וֶשׁ֙ שָׂ֣מֶת טְעֵ֔ם אָסְפַּ֖רְנָא יִתְעֲבִֽד־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/012.yaml
  text: And may the God who has caused his name to dwell there overthrow any king or people who stretches out his hand to alter this[a], to destroy this house of God that is in Jerusalem. I, Darius, have issued a decree[b]; let it be done with all diligence.
translation:
  language: hi
  text: और वह परमेश्वर, जिसने अपने नाम को वहाँ वास कराया है,[a] हर उस राजा या जाति को गिरा दे जो इस आदेश को बदलने या यरूशलेम में स्थित परमेश्वर के इस भवन को नष्ट करने के लिए हाथ बढ़ाए। मैं, दारा ने यह आज्ञा जारी की है; इसे पूरी तत्परता से पूरा किया जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जिसने अपना नाम वहाँ स्थापित किया है।’ अरामी मुहावरा मंदिर के साथ परमेश्वर के नाम की वाचागत पहचान को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘शीघ्रता से।’ अरामी शब्द आदेश को तुरंत और पूरी लगन से लागू करने पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁכִּן שְׁמֵהּ תַּמָּה
  choice: अपने नाम को वहाँ वास कराया है
  rationale: कारक क्रिया और मंदिर से जुड़ी ‘नाम’ की मूल अरामी अभिव्यक्ति दोनों को बनाए रखता है।
- source_word: יְמַגַּר
  choice: गिरा दे
  rationale: राजकीय शाप के संदर्भ में किसी राजा या जाति को नीचे गिराने अथवा मिटा देने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל מֶלֶךְ וְעַם
  choice: हर उस राजा या जाति को
  rationale: सामान्य निषेध को हिन्दी में वितरणात्मक और सहज ढंग से व्यक्त करता है।
- source_word: יִשְׁלַח יְדֵהּ
  choice: अपना हाथ बढ़ाए
  rationale: विरोध में कार्रवाई करने की सामी रूपकात्मक अभिव्यक्ति सुरक्षित रहती है।
- source_word: לְהַשְׁנָיָה לְחַבָּלָה
  choice: इसे बदलने के लिए—अर्थात ... भवन को नष्ट करने के लिए
  rationale: दोनों उद्देश्यार्थक पदों को बनाए रखता है; विराम-चिह्न उनके निकट संबंध को स्पष्ट करता है, पर संभावित वाक्यगत तनाव को पूरी तरह समाप्त नहीं करता।
- source_word: שָׂמֶת טְעֵם
  choice: यह आज्ञा जारी की है
  rationale: फारसी शाही प्रशासन के आधिकारिक आदेश का आधुनिक और स्पष्ट हिन्दी रूप है।
- source_word: אָסְפַּרְנָא יִתְעֲבִד
  choice: इसे पूरी तत्परता से पूरा किया जाए
  rationale: क्रियाविशेषण की शीघ्रता/लगन और निष्क्रिय आज्ञार्थक समापन दोनों व्यक्त होते हैं।
theological_decisions:
- issue: मंदिर में परमेश्वर के नाम के वास की अभिव्यक्ति
  choice: ‘अपने नाम को वहाँ वास कराया है’ के मूल मुहावरे को बनाए रखा
  alternative: ‘जिसने अपना नाम वहाँ रखा है’ अथवा ‘जो वहाँ वास करता है’
  rationale: यह मंदिर के साथ परमेश्वर की वाचागत पहचान व्यक्त करता है, बिना यह कहे कि परमेश्वर स्वयं उसी स्थान तक सीमित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण राजकीय शैली रखी गई है। ‘परमेश्वर का भवन’ मूल पदबंध को दर्शाता है; ‘मंदिर’ कहकर उसका अर्थ संकीर्ण नहीं किया गया। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
