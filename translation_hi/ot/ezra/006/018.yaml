  text: וַ/הֲקִ֨ימוּ כָהֲנַיָּ֜/א בִּ/פְלֻגָּתְ/ה֗וֹן וְ/לֵוָיֵ/א֙ בְּ/מַחְלְקָ֣תְ/ה֔וֹן עַל עֲבִידַ֥ת אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם כִּ/כְתָ֖ב סְפַ֥ר מֹשֶֽׁה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/018.yaml
  text: And they set up the priests in their divisions and the Levites in their divisions for the service of God that is in Jerusalem[b][a], as it is written in the Book of Moses.
translation:
  language: hi
  text: और उन्होंने याजकों को उनके दलों में और लेवियों को उनके विभागों में[a] यरूशलेम में परमेश्वर की सेवा के लिए नियुक्त किया, जैसा मूसा की पुस्तक में लिखा है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दलों’ और ‘विभागों’ के लिए आए दोनों अरामी शब्द संगठनात्मक विभाजनों के निकटार्थी शब्द हैं; दोनों का अनुवाद ‘दल’ या ‘विभाग’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मूसा की पुस्तक में लिखे हुए के अनुसार।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲקִימוּ
  choice: नियुक्त किया
  rationale: קום के कारक रूप का अर्थ किसी को खड़ा करना, उसके स्थान पर लगाना या नियुक्त करना है। यहाँ याजकों और लेवियों को मंदिर की निर्धारित सेवा में लगाने के संदर्भ में ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: כָהֲנַיָּא
  choice: याजकों
  rationale: यह अरामी में याजकों के लिए प्रचलित शब्द है; संदर्भ में ज्ञात याजक समुदाय अभिप्रेत है।
- source_word: בִּפְלֻגָּתְהוֹן
  choice: उनके दलों में
  rationale: यह संज्ञा सेवा के लिए व्यवस्थित किए गए दलों या श्रेणियों को दर्शाती है। ‘दल’ आधुनिक हिन्दी में स्पष्ट है और संगठनात्मक अर्थ बनाए रखता है।
- source_word: וְלֵוָיֵא
  choice: और लेवियों को
  rationale: यह मंदिर की सेवा से जुड़े लेवीवंशियों के लिए सीधा और प्रचलित अनुवाद है।
- source_word: בְּמַחְלְקָתְהוֹן
  choice: उनके विभागों में
  rationale: यह शब्द व्यवस्थित विभाजनों या निर्धारित सेवा-समूहों को दर्शाता है। पहले प्रयुक्त निकटार्थी अरामी शब्द से हल्का शाब्दिक भेद दिखाने के लिए ‘विभागों’ चुना गया है, पर दोनों का संगठनात्मक आशय निकट है।
- source_word: עַל עֲבִידַת אֱלָהָא דִּי בִירוּשְׁלֶם
  choice: यरूशलेम में परमेश्वर की सेवा के लिए
  rationale: पूर्वसर्ग और संज्ञा मिलकर किसी सेवा के लिए अथवा उस पर नियुक्त किए जाने का भाव देते हैं। हिन्दी शब्दक्रम में यह रूप स्वाभाविक है और सेवा को यरूशलेम के मंदिर-संदर्भ से जोड़ता है।
- source_word: כִּכְתָב
  choice: जैसा ... लिखा है
  rationale: यह लिखित निर्देश के अनुरूप होने का भाव व्यक्त करता है। यह हिन्दी मुहावरा अरामी आशय को स्वाभाविक ढंग से रखता है।
- source_word: סְפַר מֹשֶׁה
  choice: मूसा की पुस्तक
  rationale: סְפַר पुस्तक, लिखित दस्तावेज़ या पुस्तकाकार ग्रंथ को दर्शा सकता है। इस संदर्भ में ‘मूसा की पुस्तक’ स्पष्ट और स्थापित अभिव्यक्ति है।
theological_decisions:
- issue: मंदिर की सेवा-व्यवस्था और मूसा के लिखित निर्देश का संबंध
  choice: याजकों और लेवियों की नियुक्ति को मूसा की पुस्तक में लिखे निर्देश के अनुरूप बताया गया है।
  alternative: वाक्य को केवल प्रचलित संगठनात्मक व्यवस्था के उल्लेख के रूप में समझना।
  rationale: समापन पदबंध स्पष्ट रूप से इस व्यवस्था को मूसा की पुस्तक में लिखी बात से जोड़ता है। अनुवाद इस नियामक संबंध को बनाए रखता है, पर ग्रंथ-सूची या लेखकत्व के विषय में पाठ से आगे कोई दावा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘नियुक्त किया’ प्रशासनिक और उपासना-संबंधी संदर्भ दोनों में स्वाभाविक है। ‘दल’ और ‘विभाग’ स्रोत के दो निकटार्थी संगठनात्मक शब्दों के हल्के अंतर को दिखाते हैं; पादटिप्पणी उनकी अर्थ-समानता स्पष्ट करती है।
