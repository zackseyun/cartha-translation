review_pass:
  verdict: revise
  source_fidelity: The draft correctly represents the priests and Levites, their collective purification, ritual cleanliness, and the three beneficiary groups. However, “मेमना” narrows פֶּסַח beyond the Hebrew, which denotes the Passover sacrificial animal/Passover sacrifice; the permitted animal was not necessarily a lamb. “निर्वासन से लौटे” is contextually plausible but adds “returned,” which is not stated in this verse.
  naturalness: The draft is generally clear, but “अपने आप को” is less natural here than “अपने को/स्वयं को,” and “फसह का मेमना बलि किया” is grammatically awkward in modern Hindi. “फसह के बलि-पशु का वध किया” is idiomatic and accurately reflects the slaughtering verb.
  terminology: “याजक,” “लेवी,” “शुद्ध,” and “फसह” are appropriate established biblical terms. “निर्वासित समुदाय” preserves the referent of “sons of the exile” without the overly literal and unnatural “निर्वासन के पुत्र.”
  issues:
  - severity: medium
    issue: “फसह का मेमना” is overly specific.
    rationale: The Hebrew פֶּסַח in this construction refers to the Passover sacrificial animal/offer­ing. Rendering it “मेमना” excludes the possibility of a goat and thus introduces a detail not entailed by the source.
  - severity: low
    issue: “निर्वासन से लौटे” adds an unstated qualification.
    rationale: The wider Ezra narrative concerns returnees, but this verse literally identifies the group as the people/sons of the exile. “निर्वासित समुदाय” retains that designation without explicitly adding “returned.”
  - severity: low
    issue: The Hindi wording for self-purification and slaughter needs smoothing.
    rationale: “अपने आप को शुद्ध किया” and “मेमना बलि किया” are understandable but less idiomatic than “अपने को शुद्ध कर लिया” and “बलि-पशु का वध किया.”
  revised_text: क्योंकि याजकों और लेवियों ने एक होकर अपने को शुद्ध कर लिया था; वे सब शुद्ध थे। तब उन्होंने निर्वासित समुदाय के सभी लोगों, अपने भाई याजकों और अपने लिए फसह के बलि-पशु का वध किया।
  revised_footnotes: []
  revision_rationale: The revision retains the source’s collective force in כְאֶחָד (“एक होकर”), its ritual sense of purification and cleanliness, and the threefold list of those for whom the Passover animal was slaughtered. It removes the unsupported specification “lamb,” avoids adding “returned,” and uses natural modern Hindi for the sacrificial action.
