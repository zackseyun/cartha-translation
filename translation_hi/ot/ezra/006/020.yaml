base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/020.yaml
  text: For the priests and the Levites had purified themselves as one; all of them were clean. And they slaughtered the Passover lamb for all the sons of the exile, and for their brothers the priests, and for themselves.
translation:
  language: hi
  text: क्योंकि याजकों और लेवियों ने एक होकर अपने को शुद्ध कर लिया था; वे सब शुद्ध थे। तब उन्होंने निर्वासित समुदाय के सभी लोगों, अपने भाई याजकों और अपने लिए फसह के बलि-पशु का वध किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְאֶחָד
  choice: एक साथ
  rationale: इस प्रसंग में इसका अर्थ याजकों और लेवियों का सामूहिक रूप से शुद्ध होना है; यह आधुनिक हिन्दी में स्वाभाविक है और स्रोत के ‘एक के समान/एक होकर’ भाव को बनाए रखता है।
- source_word: בְּנֵי הַגּוֹלָה
  choice: निर्वासन से लौटे सभी लोग
  rationale: शाब्दिक रूप ‘निर्वासन के पुत्र’ हिन्दी में अस्वाभाविक है। प्रसंग में निर्वासित समुदाय से लौटे लोगों का उल्लेख है।
- source_word: וַיִּשְׁחֲטוּ הַפֶּסַח
  choice: फसह का मेमना बलि किया
  rationale: यहाँ פֶּסַח से आशय फसह के बलि-पशु से है; ‘मेमना’ सामान्य पाठक को आशय स्पष्ट करता है और ‘बलि किया’ धार्मिक प्रसंग को व्यक्त करता है।
- source_word: טְהוֹרִים
  choice: शुद्ध
  rationale: अनुष्ठानिक शुद्धता के लिए प्रचलित और उपयुक्त हिन्दी शब्द।
theological_decisions:
- issue: כְאֶחָד का बल—एकता या समष्टि
  choice: एक साथ
  alternative: एक होकर
  rationale: पद मुख्यतः इस बात पर बल देता है कि दोनों समूहों के सभी सदस्य शुद्ध हुए थे। ‘एक साथ’ इस सामूहिकता को व्यक्त करता है, बिना किसी अतिरिक्त आध्यात्मिक एकता का अर्थ आरोपित किए।
- issue: फसह को पर्व या बलि-पशु मानना
  choice: फसह का मेमना
  alternative: फसह की बलि
  rationale: क्रिया ‘वध करना’ के साथ यहाँ शब्द फसह के बलि-पशु को सूचित करता है। ‘मेमना’ सामान्य पाठक के लिए स्पष्ट है, यद्यपि व्यवस्था में बकरी का बच्चा भी अनुमत था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘याजक’, ‘लेवी’ और ‘फसह’ जैसे स्थापित बाइबलीय शब्द बनाए गए हैं।
