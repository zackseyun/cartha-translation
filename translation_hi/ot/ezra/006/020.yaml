revisions:
- from: क्योंकि याजकों और लेवियों ने एक साथ अपने आप को शुद्ध किया था; वे सभी शुद्ध थे। उन्होंने निर्वासन से लौटे सभी लोगों के लिए, अपने भाई याजकों के लिए और अपने लिए फसह का मेमना बलि किया।
  to: क्योंकि याजकों और लेवियों ने एक होकर अपने को शुद्ध कर लिया था; वे सब शुद्ध थे। तब उन्होंने निर्वासित समुदाय के सभी लोगों, अपने भाई याजकों और अपने लिए फसह के बलि-पशु का वध किया।
  rationale: The revision retains the source’s collective force in כְאֶחָד (“एक होकर”), its ritual sense of purification and cleanliness, and the threefold list of those for whom the Passover animal was slaughtered. It removes the unsupported specification “lamb,” avoids adding “returned,” and uses natural modern Hindi for the sacrificial action.
