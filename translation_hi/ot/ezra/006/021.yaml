  text: וַ/יֹּאכְל֣וּ בְנֵֽי יִשְׂרָאֵ֗ל הַ/שָּׁבִים֙ מֵֽ/הַ/גּוֹלָ֔ה וְ/כֹ֗ל הַ/נִּבְדָּ֛ל מִ/טֻּמְאַ֥ת גּוֹיֵֽ הָ/אָ֖רֶץ אֲלֵ/הֶ֑ם לִ/דְרֹ֕שׁ לַֽ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/021.yaml
  text: The sons of Israel who had returned from the exile ate, together with everyone who had separated himself from the uncleanness of the peoples of the land to join them, to seek Yahweh, the God of Israel.
translation:
  language: hi
  text: निर्वासन से लौटे इस्राएलियों[a] ने और उन सभी लोगों ने भी भोजन किया, जिन्होंने देश की जातियों की अशुद्धता[b] से अपने आप को अलग कर लिया था और उनसे जुड़ गए थे[c], ताकि वे इस्राएल के परमेश्वर यहोवा की खोज करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल की सन्तान’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘देश की जातियों की अपवित्रता से’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘उनकी ओर’ या ‘उनके पास’; अर्थात वे निर्वासन से लौटे समुदाय से जुड़ गए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאכְלוּ
  choice: भोजन किया
  rationale: इब्रानी क्रिया का मूल अर्थ ‘खाया’ है। हिन्दी में बिना व्यक्त कर्म के ‘भोजन किया’ अधिक स्वाभाविक है और पिछले पद में उल्लिखित फसह के भोजन को अनावश्यक रूप से मुख्य पाठ में नहीं जोड़ता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह आधुनिक हिन्दी में स्वाभाविक और सामूहिक रूप से समावेशी है; शाब्दिक अभिव्यक्ति ‘इस्राएल की सन्तान’ को पादटिप्पणी में रखा गया है।
- source_word: הַשָּׁבִים מֵהַגּוֹלָה
  choice: निर्वासन से लौटे
  rationale: यह निर्वासन से वापस आए समुदाय को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: וְכֹל הַנִּבְדָּל
  choice: और उन सभी लोगों ने भी ... जिन्होंने ... अपने आप को अलग करके
  rationale: निफ़अल कृदन्त का आत्मवाचक भाव रखते हुए सामूहिक एकवचन को हिन्दी के स्वाभाविक बहुवचन में व्यक्त किया गया है।
- source_word: מִטֻּמְאַת גּוֹיֵי הָאָרֶץ
  choice: देश की जातियों की अशुद्धता से
  rationale: ‘अशुद्धता’ अनुष्ठानिक और नैतिक दोनों अर्थ-छायाएँ बनाए रखती है; ‘जातियों’ मूल के बहुवचन को सुरक्षित रखता है।
- source_word: אֲלֵהֶם
  choice: उनका साथ दिया था
  rationale: मूलतः ‘उनकी ओर/उनसे’ है। प्रसंग में लौटे हुए समुदाय के साथ जुड़ने का सम्बन्ध प्रकट होता है; पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: לִדְרֹשׁ
  choice: खोज करें
  rationale: यह परमेश्वर की ओर भक्ति और निष्ठा से मुड़ने के व्यापक वाचाई भाव को बनाए रखता है, उसे केवल ‘आराधना’ या ‘पूछताछ’ तक सीमित नहीं करता।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धकारक रचना और वाचाई पहचान दोनों को सीधे सुरक्षित रखता है।
theological_decisions:
- issue: फसह में भाग लेने वाले अतिरिक्त लोगों की पहचान
  choice: उनका वर्णन ऐसे सभी लोगों के रूप में रखा गया है जिन्होंने देश की जातियों की अशुद्धता से अपने को अलग कर लौटे समुदाय का साथ दिया।
  alternative: उन्हें स्पष्ट रूप से अन्यजातीय मतान्तरित अथवा देश में रह गए जातीय इस्राएली कहना।
  rationale: इब्रानी पाठ उनकी जातीय पहचान निश्चित नहीं करता। इसलिए अनुवाद वर्णनात्मक भाषा रखता है और किसी एक संकीर्ण पहचान को आरोपित नहीं करता।
- issue: אֲלֵהֶם का सम्बन्ध
  choice: इसे लौटे हुए समुदाय का साथ देने के अर्थ में व्यक्त किया गया है।
  alternative: केवल शाब्दिक ‘उनकी ओर/उनसे’ रखना, अथवा इस पदांश को अनुवाद में छोड़ देना।
  rationale: मूल पदांश उपस्थित है और सहभागिता/सम्बद्धता बताता है; हिन्दी में उसका सम्बन्ध स्पष्ट करना आवश्यक है, जबकि पादटिप्पणी शाब्दिक संरचना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘भोजन किया’ स्वाभाविक हिन्दी देते हुए पिछले पद के फसह-सन्दर्भ को खुला रखता है। जातीय पहचान और अशुद्धता के अनुष्ठानिक/नैतिक आयामों को आवश्यकता से अधिक निश्चित नहीं किया गया है।
