  edition: WLC
  text: דִּֽי לֶהֱוֺ֧ן מְהַקְרְבִ֛ין נִיחוֹחִ֖ין לֶ/אֱלָ֣הּ שְׁמַיָּ֑/א וּ/מְצַלַּ֕יִן לְ/חַיֵּ֥י מַלְכָּ֖/א וּ/בְנֽוֹ/הִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/010.yaml
  text: so that they may offer pleasing aromas to the God of heaven and pray for the life of the king and his sons[a][b].
translation:
  language: hi
  text: ताकि वे स्वर्ग के परमेश्वर को सुखद सुगंध अर्पित करें[a] और राजा तथा उसके पुत्रों के जीवन के लिए प्रार्थना करें[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मीठी सुगंध” अथवा “शांतिदायक सुगंध।” अरामी शब्द स्वीकार्य बलिदानों से उठने वाली मनभावनी सुगंध को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “राजा और उसके पुत्रों के कुशल-मंगल के लिए।” शाब्दिक अर्थ है, “राजा और उसके पुत्रों के जीवन के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּי לֶהֱוֺן
  choice: ताकि वे … चढ़ाएँ … और … प्रार्थना करें
  rationale: अरामी रचना यहाँ उद्देश्य व्यक्त करती है; हिंदी में ‘ताकि’ और संभावनार्थक क्रियाएँ इस भाव को स्वाभाविक रूप से व्यक्त करती हैं।
- source_word: מְהַקְרְבִין
  choice: चढ़ाएँ
  rationale: बलिदान-संबंधी प्रसंग में यह क्रिया भेंट या बलिदान प्रस्तुत करने को दर्शाती है; ‘चढ़ाएँ’ वर्तमान हिंदी धार्मिक भाषा में स्पष्ट और स्वाभाविक है।
- source_word: נִיחוֹחִין
  choice: सुखदायक सुगंध वाले बलिदान
  rationale: शब्द का सीधा संकेत सुखदायक या प्रसन्न करने वाली सुगंध की ओर है, पर प्रसंग में सुगंध बलिदानों से उठती है। इस रूप में मूल बिंब और उसका बलिदान-संबंधी आशय दोनों स्पष्ट रहते हैं।
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर को
  rationale: यह एज्रा में प्रयुक्त ईश्वरीय उपाधि को बनाए रखता है और चढ़ाने के लक्ष्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּמְצַלַּיִן
  choice: और … प्रार्थना करें
  rationale: समन्वित उद्देश्य-वाक्य में साधारण हिंदी क्रिया मूल के प्रार्थना करने के अर्थ को ठीक से व्यक्त करती है।
- source_word: לְחַיֵּי מַלְכָּא
  choice: राजा … के जीवन के लिए
  rationale: यह मूल के ‘जीवन’ को बनाए रखता है; प्रसंग में इसका भाव जीवन की रक्षा या कुशल-मंगल भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: וּבְנוֹהִי
  choice: तथा उसके पुत्रों
  rationale: मूल शब्द विशेष रूप से पुल्लिंग बहुवचन ‘पुत्रों’ को दर्शाता है, इसलिए इसे सामान्य ‘संतानों’ से नहीं बदला गया।
theological_decisions:
- issue: נִיחוֹחִין का बलिदान-संबंधी बिंब
  choice: ‘सुखदायक सुगंध वाले बलिदान’ के रूप में प्रस्तुत किया
  alternative: ‘सुखदायक सुगंध’ अथवा केवल ‘स्वीकार्य बलिदान’
  rationale: केवल ‘बलिदान’ कहने से सुगंध का मूल बिंब मिट जाता, जबकि केवल ‘सुगंध’ हिंदी में यह अस्पष्ट कर सकती थी कि याजक वास्तव में बलिदान चढ़ा रहे हैं। चयनित रूप दोनों तत्व सुरक्षित रखता है।
- issue: राजा और उसके पुत्रों के लिए प्रार्थना का आशय
  choice: मूल के निकट ‘जीवन के लिए’
  alternative: ‘कुशल-मंगल के लिए’
  rationale: ‘जीवन’ मूल शब्दावली को बनाए रखता है और दीर्घायु, रक्षा तथा कल्याण की संभावित व्यापकता को किसी एक अर्थ तक सीमित नहीं करता।
- issue: राजा की संतान के लिए लिंग-विशिष्ट शब्द
  choice: ‘पुत्रों’
  alternative: ‘संतानों’
  rationale: अरामी पाठ स्पष्ट रूप से पुत्रों का उल्लेख करता है; अतः लिंग-विशिष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध रूप। ‘स्वर्ग के परमेश्वर’ उपाधि को यथावत रखा गया है। बलिदान-संबंधी तकनीकी अर्थ स्पष्ट करने के लिए मुख्य पाठ में सीमित व्याख्यात्मक विस्तार किया गया है, जबकि वैकल्पिक शाब्दिक रूप पादटिप्पणी में सुरक्षित हैं।
