  text: וְ/שָׂבֵ֤י יְהוּדָיֵ/א֙ בָּנַ֣יִן וּ/מַצְלְחִ֔ין בִּ/נְבוּאַת֙ חַגַּ֣י נביא/ה וּ/זְכַרְיָ֖ה בַּר עִדּ֑וֹא וּ/בְנ֣וֹ וְ/שַׁכְלִ֗לוּ מִן טַ֨עַם֙ אֱלָ֣הּ יִשְׂרָאֵ֔ל וּ/מִ/טְּעֵם֙ כּ֣וֹרֶשׁ וְ/דָרְיָ֔וֶשׁ וְ/אַרְתַּחְשַׁ֖שְׂתְּא מֶ֥לֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/014.yaml
  text: And the elders of the Jews were building and prospering through the prophecy of Haggai the prophet and Zechariah son of Iddo[c][b][a]. They finished building by the decree of the God of Israel and by the decree of Cyrus and Darius and Artaxerxes king of Persia.
translation:
  language: hi
  text: यहूदियों के बुज़ुर्ग निर्माण करते रहे और हाग्गै नबी तथा इद्दो के पुत्र जकर्याह की भविष्यवाणी के द्वारा सफल होते रहे[a]। उन्होंने इस्राएल के परमेश्वर के आदेश[b] और कुस्रू, दारा और फारस के राजा अर्तक्षत्र के आदेश के अनुसार निर्माण पूरा किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्नति करते रहे’ अथवा ‘उनका काम आगे बढ़ता रहा।’
    reason: lexical_alternative
  - marker: b
    text: ‘आदेश’ का अनुवाद ‘आज्ञा’ या ‘फरमान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस पद में निर्माण की पूर्णता का संबंध परमेश्वर के आदेश और फारसी राजाओं के आदेश—दोनों से जोड़ा गया है; परमेश्वर का आदेश पहले आता है।
    reason: theological_tension
lexical_decisions:
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: यहूदियों के पुरनिये
  rationale: यह पद समुदाय के वरिष्ठ अगुओं को सूचित करता है। ‘पुरनिये’ सामाजिक भूमिका और यहूदी पहचान दोनों को बनाए रखता है।
- source_word: בָּנַיִן
  choice: निर्माण करते रहे
  rationale: अरामी कृदंत जारी क्रिया को व्यक्त करता है; ‘करते रहे’ उस अपूर्ण, प्रगतिशील पक्ष को स्वाभाविक हिन्दी में रखता है।
- source_word: וּמַצְלְחִין
  choice: सफल होते रहे
  rationale: मूल क्रिया सफलता, उन्नति या काम के सुचारु रूप से आगे बढ़ने का भाव रखती है। ‘सफल होते रहे’ इस अर्थ को बिना अतिरिक्त कारण जोड़े व्यक्त करता है।
- source_word: בִּנְבוּאַת
  choice: भविष्यवाणी के द्वारा
  rationale: पूर्वसर्ग यहाँ साधन का भाव देता है; नबियों की भविष्यवाणी वह माध्यम थी जिसके द्वारा अगुओं का काम सफल हुआ।
- source_word: חַגַּי נביאה
  choice: हाग्गै नबी
  rationale: नाम और उपाधि का सीधा तथा प्रचलित हिन्दी रूप।
- source_word: וּזְכַרְיָה בַּר עִדּוֹא
  choice: तथा इद्दो के पुत्र जकर्याह
  rationale: ‘बर’ पुत्र-संबंध का सामान्य अरामी चिह्न है।
- source_word: וּבְנוֹ וְשַׁכְלִלוּ
  choice: निर्माण पूरा किया
  rationale: दोनों समन्वित क्रियाएँ निर्माण और उसे पूर्ण करने को बताती हैं; हिन्दी में यह संयुक्त अभिव्यक्ति अर्थ को स्पष्ट और स्वाभाविक रखती है।
- source_word: מִן טַעַם
  choice: के आदेश के अनुसार
  rationale: राजकीय अरामी में यह पद आधिकारिक आदेश, आज्ञा या फरमान को सूचित करता है। यही अभिव्यक्ति ईश्वरीय और राजकीय दोनों आदेशों पर समान रूप से लागू की गई है।
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: मूल के संबंधवाचक ईश्वरीय नाम का सीधा अनुवाद।
- source_word: מֶלֶךְ פָּרָס
  choice: फारस के राजा
  rationale: मूल में एकवचन उपाधि नामों की सूची के बाद आती है। हिन्दी में इसे सूची के पहले रखने से सहजता रहती है और फारसी राजसत्ता का संदर्भ स्पष्ट होता है।
theological_decisions:
- issue: मन्दिर की पूर्णता में परमेश्वर और साम्राज्य के आदेशों का संबंध
  choice: पूर्णता का श्रेय इस्राएल के परमेश्वर के आदेश और फारसी राजाओं के आदेश—दोनों को दिया गया है, और परमेश्वर का आदेश पहले रखा गया है।
  alternative: राजकीय आदेशों को केवल परमेश्वर के आदेश की अधीनस्थ अभिव्यक्तियाँ मानकर अनुवाद करना।
  rationale: मूल पाठ ईश्वरीय और मानवीय आदेशों को साथ रखता है, पर उनके संबंध की आगे व्याख्या नहीं करता। अनुवाद उसी तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण बाइबलीय गद्य रखा गया है। ‘पुरनिये’ समुदाय के वरिष्ठ अगुओं के लिए परिचित धार्मिक शब्द है; शेष वाक्य-संरचना वर्तमान पाठक के लिए सहज रखी गई है।
