  text: נִדְבָּכִ֞ין דִּי אֶ֤בֶן גְּלָל֙ תְּלָתָ֔א וְ/נִדְבָּ֖ךְ דִּי אָ֣ע חֲדַ֑ת וְ/נִ֨פְקְתָ֔/א מִן בֵּ֥ית מַלְכָּ֖/א תִּתְיְהִֽב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/004.yaml
  text: with three layers of dressed stone and one layer of new timber[b][a], and let the cost be given from the king’s house.
translation:
  language: hi
  text: तराशे हुए पत्थरों की तीन परतें[a] और नई लकड़ी की एक परत हो, और उसका खर्च राजा के भवन[b] से दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तराशे हुए पत्थरों की तीन कतारें।”
    reason: lexical_alternative
  - marker: b
    text: “राजा के भवन” से सम्भवतः राजकोष या शाही धन का आशय है।
    reason: cultural_note
lexical_decisions:
- source_word: נִדְבָּכִין / נִדְבָּךְ
  choice: परतें / परत
  rationale: निर्माण के संदर्भ में यह शब्द चिनाई की संरचनात्मक परतों या कतारों को सूचित करता है। ‘परत’ सामान्य आधुनिक हिन्दी में सहज है; स्थापत्य-संदर्भ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֶבֶן גְּלָל
  choice: तराशे हुए पत्थर
  rationale: निर्माण-संदर्भ में यह पद तैयार या आकार दिए हुए चिनाई के पत्थरों की ओर संकेत करता है। शब्दशः ‘लुढ़काया हुआ पत्थर’ हिन्दी में भ्रामक होगा।
- source_word: תְּלָתָא
  choice: तीन
  rationale: यह पूर्ववर्ती निर्माण-इकाई की संख्या बताने वाला मूल संख्या-शब्द है।
- source_word: אָע חֲדַת
  choice: नई लकड़ी
  rationale: אָע का अर्थ लकड़ी या इमारती लकड़ी है और חֲדַת का अर्थ ‘नई’ है। ‘नई लकड़ी’ साधारण हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: נִפְקְתָא
  choice: खर्च
  rationale: यह प्रशासनिक संदर्भ में व्यय या लागत को सूचित करता है; ‘खर्च’ आधुनिक हिन्दी में संक्षिप्त और सहज है।
- source_word: מִן בֵּית מַלְכָּא
  choice: राजा के भवन से
  rationale: मूल अभिव्यक्ति का अर्थ शब्दशः ‘राजा के घर/भवन से’ है। सम्भावित राजकोषीय आशय को मुख्य पाठ में निश्चित न करके पादटिप्पणी में स्पष्ट किया गया है।
- source_word: תִּתְיְהִב
  choice: दिया जाए
  rationale: कर्मवाच्य रूप राजकीय आदेश में व्यय उपलब्ध कराने की आज्ञार्थक-प्रशासनिक शक्ति व्यक्त करता है।
