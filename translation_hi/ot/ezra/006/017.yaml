base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/017.yaml
  text: And they offered for the dedication of this house of God one hundred bulls[a], two hundred rams, four hundred lambs, and twelve male goats as a sin offering for all Israel[b], according to the number of the tribes of Israel.
translation:
  language: hi
  text: उन्होंने परमेश्वर के इस भवन के समर्पण के लिए सौ बैल, दो सौ मेढ़े, चार सौ मेमने और समस्त इस्राएल के लिए[a] पापबलि के रूप में बारह बकरे[b] चढ़ाए—इस्राएल के गोत्रों की गिनती के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त इस्राएल की ओर से।”
    reason: lexical_alternative
  - marker: b
    text: ये बारह बकरे इस्राएल के बारह गोत्रों की संख्या के अनुरूप थे और इस बलि का प्रतिनिधिक दायरा प्रकट करते थे।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַקְרִבוּ
  choice: चढ़ाए
  rationale: हिफ़इल रूप का अर्थ बलिदान के प्रसंग में पशुओं को अर्पित करना है; ‘चढ़ाए’ आधुनिक हिन्दी में स्वाभाविक बलिदानी अभिव्यक्ति है।
- source_word: לַחֲנֻכַּת
  choice: समर्पण के लिए
  rationale: यह शब्द भवन के औपचारिक समर्पण या उद्घाटन को दर्शाता है; ‘समर्पण’ धार्मिक समारोह के प्रसंग में स्पष्ट और गरिमापूर्ण है।
- source_word: בֵּית אֱלָהָא דְנָה
  choice: परमेश्वर के इस भवन
  rationale: ‘भवन’ स्रोत के ‘घर’ संबंधी रूपक को बनाए रखता है, जबकि प्रसंग से स्पष्ट है कि यह मन्दिर है।
- source_word: תּוֹרִין
  choice: बैल
  rationale: बलिदानी सूची में यह गोवंश के नर पशुओं को सूचित करता है; ‘बैल’ सहज हिन्दी समतुल्य है।
- source_word: דִּכְרִין
  choice: मेढ़े
  rationale: अरामी शब्द नर भेड़ों को सूचित करता है; बलिदानी प्रसंग में ‘मेढ़े’ सटीक है।
- source_word: אִמְּרִין
  choice: मेमने
  rationale: यह शब्द मेमनों या छोटी भेड़ों के लिए है; ‘मेमने’ सामान्य और स्वाभाविक हिन्दी है।
- source_word: וּצְפִירֵי עִזִּין
  choice: बकरे
  rationale: संयुक्त पद विशेष रूप से नर बकरों को सूचित करता है; हिन्दी में ‘बकरे’ से नर होना स्पष्ट है।
- source_word: לחטיא
  choice: पापबलि के रूप में
  rationale: यह पाप अथवा शुद्धिकरण से संबंधित तकनीकी बलिदानी पद है; ‘पापबलि’ परिचित और संक्षिप्त हिन्दी रूप है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल के लिए
  rationale: पूर्वसर्ग यहाँ हित या प्रतिनिधित्व का भाव दे सकता है; मुख्य पाठ में ‘के लिए’ इस अर्थ-क्षेत्र को स्वाभाविक ढंग से बनाए रखता है।
- source_word: לְמִנְיָן שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों की गिनती के अनुसार
  rationale: यह वाक्यांश बारह बकरों की संख्या स्पष्ट करता है और अरामी की व्याख्यात्मक शक्ति को बनाए रखता है।
theological_decisions:
- issue: निर्वासन के बाद के प्रसंग में ‘समस्त इस्राएल’ का सामूहिक विस्तार
  choice: समस्त इस्राएल के लिए
  alternative: केवल लौटे हुए निर्वासितों के लिए
  rationale: मूल पाठ स्पष्ट रूप से ‘समस्त इस्राएल’ कहता है और बारह की संख्या को इस्राएल के गोत्रों से जोड़ता है। अनुवाद इस व्यापक सामूहिक दायरे को किसी संकुचित ऐतिहासिक व्याख्या से सीमित नहीं करता।
- issue: עַל में हित और प्रतिनिधित्व का संबंध
  choice: के लिए
  alternative: की ओर से
  rationale: दोनों अर्थ प्रसंग में संभव हैं। मुख्य पाठ में सहज ‘के लिए’ रखा गया है और प्रतिनिधित्व का अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है, जिससे वास्तविक अर्थगत संभावना बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘भवन’ स्रोत के औपचारिक शब्द को बनाए रखता है; ‘पापबलि’ धार्मिक तकनीकी पद के रूप में संक्षिप्त है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के लिए व्यवस्थित किया गया है, जबकि संख्याएँ, बलिदानी श्रेणियाँ और ‘समस्त इस्राएल’ का व्यापक दायरा सुरक्षित हैं।
