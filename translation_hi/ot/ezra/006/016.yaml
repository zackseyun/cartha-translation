  text: And the sons of Israel[a], the priests, the Levites, and the rest of the sons of the exile celebrated the dedication of this house of God with joy.
translation:
  language: hi
  text: तब इस्राएलियों, याजकों, लेवियों और बँधुआई के शेष लोगों ने परमेश्वर के इस भवन के समर्पण का उत्सव आनन्द के साथ मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבַדוּ
  choice: उत्सव मनाया
  rationale: इस अरामी प्रसंग में क्रिया किसी धार्मिक अनुष्ठान को सम्पन्न करने या मनाने का बोध देती है; ‘समर्पण का उत्सव मनाया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल की सन्तान’ है, पर यहाँ समुदाय के नाम के रूप में ‘इस्राएलियों’ अधिक सहज और स्पष्ट है।
- source_word: כָּהֲנַיָּא
  choice: याजकों
  rationale: याजकीय वर्ग के लिए मानक और परिचित हिन्दी पद।
- source_word: וְלֵוָיֵא
  choice: लेवियों
  rationale: मन्दिर-सेवा से जुड़े लेवी वंश के सदस्यों के लिए मानक हिन्दी रूप।
- source_word: וּשְׁאָר בְּנֵי גָלוּתָא
  choice: और बँधुआई से लौटे शेष लोगों
  rationale: मूलतः ‘बँधुआई की सन्तान के शेष जन’; प्रसंग में लौटे हुए निर्वासित समुदाय का आशय है। चयनित रूप अर्थ को स्पष्ट रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: חֲנֻכַּת
  choice: समर्पण
  rationale: भवन को विधिवत परमेश्वर के लिए अर्पित किए जाने का सीधा और प्रचलित हिन्दी पद।
- source_word: בֵּית אֱלָהָא דְנָה
  choice: परमेश्वर के इस भवन
  rationale: ‘परमेश्वर का यह भवन’ के स्रोत-रूपक को बनाए रखता है; ‘मन्दिर’ की व्याख्यात्मक विशिष्टता नहीं जोड़ता।
- source_word: בְּחֶדְוָה
  choice: आनन्द के साथ
  rationale: पूर्वसर्ग और संज्ञा का निकट तथा स्वाभाविक हिन्दी रूप।
