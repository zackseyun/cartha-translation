reference: Ezra 6:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ דִּ֣י כָל אֱנָ֗שׁ דִּ֤י יְהַשְׁנֵא֙ פִּתְגָמָ֣/א דְנָ֔ה יִתְנְסַ֥ח אָע֙ מִן בַּיְתֵ֔/הּ וּ/זְקִ֖יף יִתְמְחֵ֣א עֲלֹ֑/הִי וּ/בַיְתֵ֛/הּ נְוָל֥וּ יִתְעֲבֵ֖ד עַל דְּנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/011.yaml
  text: 'And from me a decree is issued: if any man alters this edict[a], a beam shall be pulled out from his house, and he shall be impaled on it[c][b]; and his house shall be made a refuse heap because of this.'
translation:
  language: hi
  text: 'और मेरी ओर से यह आदेश जारी किया जाता है: जो कोई इस राजाज्ञा में फेरबदल करे, उसके घर से एक शहतीर उखाड़ लिया जाए[a], और उसे उसी पर बेध दिया जाए[b]; और इस अपराध के कारण उसका घर कूड़े का ढेर बना दिया जाए[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके घर से एक लकड़ी/शहतीर उखाड़ लिया जाए।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसे उसी पर लटका दिया जाए।”
    reason: alternative_reading
  - marker: c
    text: पारंपरिक अनुवाद, “गोबर का ढेर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂים טְעֵם
  choice: यह आदेश जारी किया जाता है
  rationale: अरामी मुहावरे का शाब्दिक भाव ‘आदेश ठहराना’ है; यह रूप राजकीय-प्रशासनिक घोषणा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהַשְׁנֵא
  choice: फेरबदल करे
  rationale: यहाँ आशय राजाज्ञा के शब्दों को बदलने या उससे छेड़छाड़ करने का है, केवल उसकी अवज्ञा करने का नहीं।
- source_word: פִּתְגָמָא
  choice: राजाज्ञा
  rationale: यह प्रशासनिक पद किसी शासक के आधिकारिक वचन या आदेश को सूचित करता है; ‘राजाज्ञा’ फ़ारसी साम्राज्य के प्रसंग में उपयुक्त है।
- source_word: יִתְנְסַח אָע מִן בַּיְתֵהּ
  choice: उसके घर से एक शहतीर उखाड़ लिया जाए
  rationale: वाक्य में अपराधी के घर से दंड के साधन के रूप में लकड़ी या शहतीर निकालने का ठोस चित्र है।
- source_word: וּזְקִיף יִתְמְחֵא עֲלֹהִי
  choice: उसे उसी पर बेध दिया जाए
  rationale: अरामी अभिव्यक्ति लकड़ी पर ऊपर उठाकर जड़ने या बेधने जैसे प्राचीन दंड को दर्शाती है। ‘बेध दिया जाए’ आधुनिक फाँसी के फंदे का अनैतिहासिक चित्र उत्पन्न नहीं करता, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: נְוָלוּ
  choice: कूड़े का ढेर
  rationale: यह शब्द अपमानजनक गंदगी या उजाड़ ढेर का बोध देता है। यह चयन स्पष्ट आधुनिक हिन्दी है और पारंपरिक अधिक विशिष्ट अर्थ को पादटिप्पणी में सुरक्षित रखता है।
- source_word: יִתְעֲבֵד
  choice: बना दिया जाए
  rationale: 'निष्क्रिय कानूनी दंड-वाक्य को बनाए रखता है: अपराध के परिणामस्वरूप घर को ऐसी दशा में कर दिया जाएगा।'
- source_word: כָל אֱנָשׁ
  choice: जो कोई
  rationale: यह स्वाभाविक हिन्दी में अरामी के सार्वत्रिक अर्थ को व्यक्त करता है और अनावश्यक रूप से केवल पुरुषों तक अर्थ सीमित नहीं करता।
theological_decisions:
- issue: साम्राज्यकालीन दंड-वाक्य में मृत्युदंड की प्रकृति
  choice: मुख्य पाठ में ‘उसे उसी पर बेध दिया जाए’
  alternative: ‘उसे उसी पर लटका दिया जाए’
  rationale: प्रसंग घर से निकाली गई लकड़ी पर अपराधी को ऊपर उठाकर जड़ने या बेधने के प्राचीन दंड की ओर संकेत करता है। आधुनिक फंदे वाली फाँसी का भ्रम टालने के लिए ‘बेध’ मुख्य पाठ में है, पर मूल अभिव्यक्ति की संभावित व्यापकता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और राजकीय आदेश के अनुरूप औपचारिक रखी गई है। ‘फेरबदल’, ‘शहतीर’ और ‘बेध’ जैसे ठोस शब्द मूल के कठोर कानूनी तथा दंडात्मक स्वर को बिना नरम किए व्यक्त करते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उनके संबंधित पदों के तुरंत बाद रखे गए हैं।
