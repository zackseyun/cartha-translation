base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/006.yaml
  text: Now Tattenai[a], governor of the province Beyond the River, Shethar-bozenai, and your associates, the officials of Persia who are in Beyond the River[c][b], keep far away from there.
translation:
  language: hi
  text: अब, नदी-पार के राज्यपाल तत्तनै, शेतर-बोजनै, और उनके सहकर्मियो, जो नदी-पार के अफ़ारसकाई हो, वहाँ से दूर रहो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘नदी-पार’ फ़ारसी प्रशासनिक नाम था, जो फरात नदी के पश्चिम के क्षेत्र के लिए प्रयुक्त होता था। ‘अफ़ारसकाई’ (अरामी: अफ़ारसखाये) की सटीक पहचान अनिश्चित है; यह किसी प्रशासनिक वर्ग या समूह का नाम हो सकता है।'
    reason: cultural_note_and_lexical_uncertainty
lexical_decisions:
