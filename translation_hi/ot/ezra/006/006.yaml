- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: महानद-पार के राज्यपाल
  rationale: פַּחַת प्रांतीय राज्यपाल को सूचित करता है और עֲבַר נַהֲרָה फ़ारसी साम्राज्य का प्रशासनिक क्षेत्रनाम है; ‘महानद’ यहाँ फरात को दर्शाता है।
- source_word: שְׁתַר בּוֹזְנַי
  choice: शतर्बोजनै
  rationale: व्यक्तिनाम का देवनागरी में निकट लिप्यंतरण।
- source_word: וּכְנָוָתְהוֹן
  choice: और ... तुम्हारे सहकर्मी
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय के कारण सीधे संबोधन ‘तुम्हारे’ को रखा गया है; संज्ञा का अर्थ साथी या सहकर्मी है।
- source_word: אֲפַרְסְכָיֵא
  choice: अफ़रसकी लोग
  rationale: इस दुर्लभ प्रशासनिक या जातिसूचक पद का सटीक अर्थ अनिश्चित है; ‘फ़ारसी अधिकारी’ कहकर अर्थ को निश्चित करने के बजाय लिप्यंतरण-सदृश रूप ambiguity बचाता है।
- source_word: דִּי בַּעֲבַר נַהֲרָה
  choice: महानद-पार में रहनेवाले
  rationale: सम्बन्धवाचक खंड इन सहकर्मियों या अफ़रसकी लोगों का स्थान बताता है।
- source_word: רַחִיקִין הֲוֹו מִן תַּמָּה
  choice: तुम वहाँ से दूर रहो
  rationale: शाब्दिक अर्थ ‘वहाँ से दूर रहो’ है और राजकीय निषेध का आदेशात्मक बल भी बना रहता है।
