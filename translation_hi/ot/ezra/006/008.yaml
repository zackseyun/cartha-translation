  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ לְ/מָ֣א דִֽי תַֽעַבְד֗וּן עִם שָׂבֵ֤י יְהוּדָיֵ/א֙ אִלֵּ֔ךְ לְ/מִבְנֵ֖א בֵּית אֱלָהָ֣/א דֵ֑ךְ וּ/מִ/נִּכְסֵ֣י מַלְכָּ֗/א דִּ֚י מִדַּת֙ עֲבַ֣ר נַהֲרָ֔/ה אָסְפַּ֗רְנָא נִפְקְתָ֛/א תֶּהֱוֵ֧א מִֽתְיַהֲבָ֛א לְ/גֻבְרַיָּ֥/א אִלֵּ֖ךְ דִּי לָ֥א לְ/בַטָּלָֽא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/008.yaml
  text: 'Moreover, I issue a decree concerning what you are to do for these Jewish elders as they rebuild this house of God: Their expenses are to be paid promptly from the royal revenues—the tribute collected in Beyond the River[a]—so that the work is not interrupted.'
translation:
  language: hi
  text: 'इसके अतिरिक्त, मैं यह आदेश देता हूँ कि परमेश्वर के इस भवन को बनाने के लिए इन यहूदी बुज़ुर्गों के लिए तुम्हें क्या करना है: इन लोगों को उनका खर्च राजकीय आय में से—अर्थात महानद के पार से वसूले गए कर में से—तुरंत दिया जाए, ताकि काम में रुकावट न आए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: इसके अतिरिक्त, मैं यह आदेश देता हूँ
  rationale: अरामी राजकीय मुहावरा किसी आधिकारिक निर्णय या आदेश को स्थापित करने का भाव देता है। सक्रिय वाक्य राजकीय वक्ता और प्रशासनिक बल दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: שָׂבֵי יְהוּדָיֵא אִלֵּךְ
  choice: ये यहूदी पुरनिये
  rationale: यह पद यहूदी समुदाय के मान्य अगुओं को दर्शाता है। ‘पुरनिये’ बाइबलीय संदर्भ में पदसूचक और सामान्य हिन्दी पाठकों के लिए परिचित है।
- source_word: לְמִבְנֵא בֵּית אֱלָהָא דֵךְ
  choice: परमेश्वर के इस भवन का पुनर्निर्माण कर रहे हैं
  rationale: דֵךְ का अर्थ ‘इस’ है, ‘तुम्हारे’ नहीं। ‘पुनर्निर्माण’ प्रसंगानुसार पहले नष्ट हुए भवन को फिर से बनाने का भाव स्पष्ट करता है।
- source_word: מִנִּכְסֵי מַלְכָּא דִּי מִדַּת עֲבַר נַהֲרָה
  choice: राजकीय राजस्व से—अर्थात महानद के पार से वसूले गए कर में से
  rationale: מִדַּת यहाँ कर अथवा राजस्व है, प्रांत नहीं। वाक्यांश राजकीय धन के उस विशिष्ट स्रोत को बताता है जो महानद के पश्चिमी क्षेत्रों से वसूला जाता था।
- source_word: אָסְפַּרְנָא
  choice: तुरंत
  rationale: प्रशासनिक शब्द शीघ्र और सावधानीपूर्वक कार्यान्वयन पर बल देता है; भुगतान के संदर्भ में ‘तुरंत’ स्पष्ट और संयत समतुल्य है।
- source_word: נִפְקְתָא תֶּהֱוֵא מִתְיַהֲבָא לְגֻבְרַיָּא אִלֵּךְ
  choice: इनका खर्च ... दिया जाए
  rationale: निष्क्रिय रचना इन लोगों को निर्माण-व्यय उपलब्ध कराने का आदेश देती है। हिन्दी में यह रूप संक्षिप्त और प्रशासनिक शैली के अनुकूल है।
- source_word: דִּי לָא לְבַטָּלָא
  choice: ताकि काम में रुकावट न आए
  rationale: उद्देश्यवाचक उपवाक्य काम रुकने से रोकता है। संदर्भ से निहित ‘काम’ को व्यक्त करने पर हिन्दी अर्थ स्पष्ट होता है, बिना किसी अनिश्चित कर्ता को थोपे।
