  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘भवन’ मंदिर-संदर्भ को समझने योग्य बनाता है, फिर भी स्रोत के ‘घर’ वाले शब्द-चित्र को पूरी तरह विशिष्ट धार्मिक पद में नहीं बदलता।
