source:
  edition: WLC
  text: וְ/שֵׁיצִיא֙ בַּיְתָ֣/ה דְנָ֔ה עַ֛ד י֥וֹם תְּלָתָ֖ה לִ/ירַ֣ח אֲדָ֑ר דִּי הִ֣יא שְׁנַת שֵׁ֔ת לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מַלְכָּֽ/א־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/015.yaml
  text: And this house was finished by the third day of the month Adar[b][a], which was the sixth year of the reign of King Darius.
translation:
  language: hi
  text: और यह भवन[a] अदार महीने के तीसरे दिन तक[b] पूरा हो गया। यह राजा दारा के शासन का छठा वर्ष था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह मंदिर।” अरामी में शाब्दिक रूप से “यह घर” है; एज्रा में यह मंदिर के लिए प्रचलित पद है।
    reason: lexical_alternative
  - marker: b
    text: या, “अदार महीने के तीसरे दिन।” इस पदबंध को उस निश्चित दिन की तिथि के रूप में भी समझा जा सकता है जिस दिन काम पूरा हुआ।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשֵׁיצִיא
  choice: पूरा हो गया
  rationale: अरामी क्रिया इस निर्माण-कार्य के पूर्ण होने को व्यक्त करती है। हिंदी में यह अकर्मक-भाव वाला प्रयोग भवन पर केंद्रित रहता है और किसी अनकहे कर्ता को नहीं जोड़ता।
- source_word: בַּיְתָה דְנָה
  choice: यह भवन
  rationale: शाब्दिक अर्थ ‘यह घर’ है, पर एज्रा के संदर्भ में यह मंदिर के भवन को सूचित करता है। ‘भवन’ स्रोत के रूपक को बनाए रखते हुए आधुनिक हिंदी में अधिक स्वाभाविक और गरिमापूर्ण है; ‘मंदिर’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: עַד יוֹם תְּלָתָה
  choice: तीसरे दिन तक
  rationale: עַד की सीमा-सूचक शक्ति को ‘तक’ से सुरक्षित रखा गया है। यह बताता है कि उस समय तक काम पूरा हो चुका था, जबकि ‘तीसरे दिन’ को वैकल्पिक तिथि-पाठ के रूप में पादटिप्पणी में दिया गया है।
- source_word: לִירַח אֲדָר
  choice: अदार महीने के
  rationale: यह महीने के नाम के साथ प्रयुक्त संबंध-सूचक अरामी पदबंध का सहज हिंदी रूप है।
- source_word: דִּי הִיא שְׁנַת שֵׁת
  choice: यह ... छठा वर्ष था
  rationale: अरामी संबंधवाचक उपवाक्य को स्पष्ट, स्वाभाविक हिंदी वाक्य में व्यक्त किया गया है, बिना कालक्रम संबंधी अर्थ बदले।
- source_word: לְמַלְכוּת
  choice: के शासन का
  rationale: राजकीय कालगणना के इस सूत्र में शब्द राजा के शासनकाल को दर्शाता है; ‘शासन का’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: राजा दारा
  rationale: राजकीय उपाधि स्पष्ट रखी गई है और Darius के लिए हिंदी में प्रचलित बाइबलीय नाम ‘दारा’ अपनाया गया है।
