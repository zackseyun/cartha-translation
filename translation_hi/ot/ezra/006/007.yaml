    text: या, ‘यहूदिया के निवासी।’ अरामी शब्द यहूदा से जुड़े लोगों को जातीय अथवा क्षेत्रीय अर्थ में सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁבֻקוּ לַעֲבִידַת
  choice: काम में दखल न दो
  rationale: बहुवचन आज्ञार्थक रूप यहाँ काम में हस्तक्षेप बंद करने का आदेश देता है। यह हिंदी अभिव्यक्ति निषेधात्मक आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करती है।
- source_word: בֵּית אֱלָהָא דֵךְ
