- source_word: יִבְנוֹן
  choice: फिर से बनाएँ
  rationale: राजकीय आदेश की शैली में यह अपूर्ण रूप अनुज्ञार्थक/आदेशात्मक बल रखता है। पुनर्निर्माण के प्रसंग को ‘फिर से’ स्पष्ट करता है।
- source_word: עַל אַתְרֵהּ
  choice: उसी के स्थान पर
  rationale: वाक्यांश भवन को उसके अपने मूल स्थान पर बनाने का स्थानिक अर्थ देता है; यह हिंदी में स्वाभाविक है।
