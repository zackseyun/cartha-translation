  yaml_path: translation/ot/ezra/006/007.yaml
  text: Leave the work on this house of God alone[a]; let the governor of the Jews and the elders of the Jews rebuild this house of God on its site.
translation:
  language: hi
  text: परमेश्वर के इस भवन के काम में दखल न दो। यहूदियों[a] का राज्यपाल और यहूदियों के बुज़ुर्ग परमेश्वर के इस भवन को उसी के स्थान पर फिर से बनाएँ।
  philosophy: optimal-equivalence
  footnotes:
