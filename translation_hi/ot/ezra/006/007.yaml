- source_word: פַּחַת
  choice: राज्यपाल
  rationale: यह प्रांतीय शासकीय अधिकारी का पद है। ‘राज्यपाल’ आधुनिक हिंदी में स्पष्ट और प्रचलित समतुल्य है।
- source_word: יְהוּדָיֵא
  choice: यहूदियों
  rationale: यह जातीय अथवा क्षेत्रीय रूप से यहूदा से जुड़े लोगों को सूचित कर सकता है। मुख्य पाठ में प्रचलित और सहज ‘यहूदियों’ रखा गया है तथा विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּלְשָׂבֵי יְהוּדָיֵא
  choice: और यहूदियों के पुरनिये
