base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/009.yaml
  text: And whatever is needed—young bulls[a], rams, and lambs for burnt offerings to the God of heaven, wheat, salt, wine, and oil, according to the word of the priests who are in Jerusalem—let it be given to them day by day without fail[b],
translation:
  language: hi
  text: और जो कुछ आवश्यक हो—स्वर्ग के परमेश्वर के लिए होमबलियाँ चढ़ाने को युवा बैल, मेढ़े और मेमने, और गेहूँ, नमक, दाखमधु और तेल—वह यरूशलेम में रहने वाले याजकों के निर्देश के अनुसार उन्हें प्रतिदिन बिना चूके दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָה חַשְׁחָן
  choice: और जो कुछ आवश्यक हो
  rationale: अरामी पदबंध आवश्यक वस्तुओं की खुली सूची प्रस्तुत करता है; यह हिंदी में प्रशासनिक आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְנֵי תוֹרִין
  choice: बछड़े
  rationale: शाब्दिक अर्थ ‘बैलों के बच्चे’ है और बलिदान योग्य युवा नर पशुओं को सूचित करता है; ‘बछड़े’ सहज हिंदी है।
- source_word: דִכְרִין
  choice: मेढ़े
  rationale: यह नर भेड़ों के लिए सटीक और प्रचलित हिंदी शब्द है।
- source_word: אִמְּרִין
  choice: मेमने
  rationale: यह बलिदानी सूची में मेमनों को सूचित करता है।
- source_word: לַעֲלָוָן
  choice: होमबलियाँ चढ़ाने को
  rationale: यह पूर्णतः जलाई जानेवाली बलियों का पारंपरिक और संदर्भानुकूल नाम है; ‘चढ़ाने को’ उद्देश्य स्पष्ट करता है।
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर के लिए
  rationale: एज्रा के अरामी भाग में प्रयुक्त ईश्वरीय उपाधि को सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: חִנְטִין מְלַח חֲמַר וּמְשַׁח
  choice: गेहूँ, नमक, दाखमधु और तेल
  rationale: सूची की विशिष्ट वस्तुओं को अलग-अलग और स्रोत के क्रम में प्रस्तुत किया गया है।
- source_word: כְּמֵאמַר
  choice: के निर्देश के अनुसार
  rationale: शाब्दिक रूप ‘वचन/कथन के अनुसार’ है, पर राजकीय प्रबंध के संदर्भ में इसका अर्थ याजकों के प्रामाणिक निर्देश से है; यह आधुनिक हिंदी में अधिक स्पष्ट है।
- source_word: י֥וֹם בְּי֖וֹם
  choice: प्रतिदिन
  rationale: शाब्दिक ‘दिन-प्रतिदिन’ का संक्षिप्त और स्वाभाविक हिंदी समतुल्य।
- source_word: דִּי לָא שָׁלוּ
  choice: बिना चूके
  rationale: अंतिम पदबंध आपूर्ति में कोई रुकावट, चूक या कमी न होने पर बल देता है।
