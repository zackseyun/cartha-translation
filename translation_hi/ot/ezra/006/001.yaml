  yaml_path: translation/ot/ezra/006/001.yaml
  text: Then King Darius issued a decree[a], and they searched in the house of the archives, where the treasures were stored[c][b], there in Babylon.
translation:
  language: hi
  text: तब राजा दारा ने एक राजाज्ञा जारी की,[a] और उन्होंने बाबेल में वहाँ के अभिलेखागार[b] में खोज की, जहाँ खज़ाने[c] जमा थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दारा राजा ने आज्ञा ठहराई, और अभिलेखागार में खोज की गई।” अरामी में अधिक शाब्दिक रूप से “आज्ञा रखी” है और “उन्होंने खोज की” के लिए तृतीय पुरुष बहुवचन क्रिया है, जिसका प्रयोग यहाँ अनिर्दिष्ट कर्ता के लिए हो सकता है।
    reason: alternative_reading
  - marker: b
    text: “अभिलेखागार” का शाब्दिक अर्थ “पुस्तकों/दस्तावेज़ों का घर” है; यहाँ आशय सरकारी अभिलेखों के भंडार से है।
    reason: lexical_alternative
  - marker: c
    text: “खज़ाने” का अर्थ अधिक व्यापक रूप से अभिलेखागार-परिसर में रखी बहुमूल्य वस्तुएँ या अन्य जमा सामग्री भी हो सकता है।
    reason: lexical_alternative
