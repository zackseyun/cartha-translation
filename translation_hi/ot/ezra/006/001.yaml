- source_word: תַּמָּה בְּבָבֶל
  choice: बाबेल में वहीं
  rationale: स्थानवाचक ‘वहीं’ को बनाए रखते हुए ‘बाबेल में’ मूल स्थाननाम और उसके बलाघात को व्यक्त करता है।
