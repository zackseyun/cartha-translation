  text: निर्वासित लोगों ने पहले महीने के चौदहवें दिन फसह मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: मनाया
  rationale: פֶּסַח के साथ यह क्रिया किसी पर्व या विधि को सम्पन्न करने के अर्थ में आती है; आधुनिक हिन्दी में ‘फसह मनाया’ स्वाभाविक और अर्थ-सटीक है।
- source_word: בְנֵי הַגּוֹלָה
  choice: निर्वासन से लौटे लोग
  rationale: शाब्दिक रूप ‘निर्वासन के पुत्र’ हिन्दी में अस्वाभाविक और भ्रामक होगा। सन्दर्भ में यह निर्वासित समुदाय के उन लोगों को सूचित करता है जो लौट आए थे; चुना हुआ रूप सामूहिक अर्थ स्पष्ट करता है।
- source_word: הַפָּסַח
  choice: फसह
  rationale: यह इब्रानी पर्व और उससे जुड़ी विधि का प्रचलित हिन्दी बाइबलीय नाम है; यहाँ केवल बलिदान या केवल भोज तक अर्थ को सीमित नहीं किया गया।
- source_word: בְּאַרְבָּעָה עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के चौदहवें दिन
  rationale: इब्रानी तिथि-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; ‘दिन’ मूल में निहित है और स्पष्टता के लिए जोड़ा गया है।
