base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/005.yaml
  text: And also let the gold and silver vessels of the house of God[a], which Nebuchadnezzar took out of the temple that was in Jerusalem and brought to Babylon, be returned and brought to the temple that is in Jerusalem, each to its place; and you shall put them in the house of God.
translation:
  language: hi
  text: और परमेश्वर के भवन के सोने और चाँदी के वे पात्र भी, जिन्हें नबूकदनेस्सर यरूशलेम के मंदिर से निकालकर बाबेल ले गया था, लौटा दिए जाएँ और यरूशलेम के मंदिर में अपने-अपने स्थान पर पहुँचाए जाएँ[a]; और तुम उन्हें परमेश्वर के भवन में रख देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें फिर से स्थापित किया जाए, और वे यरूशलेम के मंदिर में अपने-अपने स्थान पर जाएँ।” यहाँ “और पहुँचाए जाएँ/जाएँ” के आसपास की अरामी भाषा कुछ कठिन है, पर आशय मंदिर के पात्रों को यरूशलेम में उनके उचित स्थानों पर वापस रखने का है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאַף
  choice: और ... भी
  rationale: संयोजक और योगसूचक बल को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: מָאנֵי
  choice: पात्र
  rationale: मंदिर में प्रयुक्त सोने-चाँदी की वस्तुओं के लिए व्यापक और परंपरागत हिन्दी शब्द है।
- source_word: בֵית אֱלָהָא
  choice: परमेश्वर का भवन
  rationale: मूल के शाब्दिक अर्थ को सुरक्षित रखता है और इसी पद में הֵיכְלָא के लिए प्रयुक्त ‘मंदिर’ से शब्दगत भेद बनाए रखता है।
- source_word: דִּי דַהֲבָה וְכַסְפָּא
  choice: सोने और चाँदी के
  rationale: पात्रों की सामग्री बताने वाला स्वाभाविक हिन्दी प्रयोग है।
- source_word: הַנְפֵּק
  choice: निकालकर
  rationale: मंदिर से वस्तुओं को बाहर ले जाने की कारक क्रिया और अगली क्रिया के साथ उसके क्रम को संक्षेप में व्यक्त करता है।
- source_word: הֵיכְלָא
  choice: मंदिर
  rationale: यरूशलेम के पवित्र भवन के लिए प्रसंगानुकूल और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: וְהֵיבֵל
  choice: ले गया था
  rationale: पात्रों को बाबेल पहुँचाने की भूतकालीन क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַהֲתִיבוּן
  choice: लौटा दिए जाएँ
  rationale: राजकीय आदेश में पात्रों को वापस करने अथवा पुनःस्थापित करने का निष्क्रिय आदेशात्मक भाव सुरक्षित रहता है।
- source_word: וִיהָךְ
  choice: पहुँचाए जाएँ
  rationale: कठिन अरामी रूप को प्रसंगानुसार यरूशलेम के मंदिर तक वापस ले जाने के रूप में व्यक्त करता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לְאַתְרֵהּ
  choice: अपने-अपने स्थान पर
  rationale: एकवचन वितरणात्मक भाव को पात्रों के समूह के संदर्भ में स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: וְתַחֵת
  choice: और तुम उन्हें ... रख देना
  rationale: द्वितीय पुरुष एकवचन निर्देश का सीधा, आदेशात्मक और आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: मंदिर की वस्तुओं की वापसी से जुड़ी कठिन अरामी अभिव्यक्ति
  choice: लौटा दिए जाएँ और ... अपने-अपने स्थान पर पहुँचाए जाएँ
  alternative: उन्हें पुनःस्थापित किया जाए, और वे ... अपने-अपने स्थान को जाएँ
  rationale: मुख्य पाठ में पुनर्स्थापन का स्पष्ट प्रसंगगत अर्थ दिया गया है, जबकि अरामी क्रियारूप की वास्तविक कठिनाई और अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं थोपा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर का भवन’ और ‘मंदिर’ का भेद मूल अरामी की अलग-अलग संज्ञाओं के अनुरूप सुरक्षित है। राजकीय आदेश का स्वर ‘लौटा दिए जाएँ’ और ‘रख देना’ से व्यक्त किया गया है।
