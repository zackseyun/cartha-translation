translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रशासनिक पद और क्षेत्रीय नाम को स्पष्ट रखते हुए अनावश्यक पुरातन शब्दावली से बचा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी विषयवस्तु से उलटा था; हिन्दी में भौगोलिक टिप्पणी [a] को ‘महानद-पार’ और क्रियाविशेषण संबंधी टिप्पणी [b] को संबंधित वाक्यांश पर रखा गया है।
