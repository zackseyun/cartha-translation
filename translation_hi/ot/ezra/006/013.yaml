source:
  edition: WLC
  text: אֱ֠דַיִן תַּתְּנַ֞י פַּחַ֧ת עֲבַֽר נַהֲרָ֛/ה שְׁתַ֥ר בּוֹזְנַ֖י וּ/כְנָוָתְ/ה֑וֹן לָ/קֳבֵ֗ל דִּֽי שְׁלַ֞ח דָּרְיָ֧וֶשׁ מַלְכָּ֛/א כְּנֵ֖מָא אָסְפַּ֥רְנָא עֲבַֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/013.yaml
  text: Then Tattenai[a], the governor of Beyond the River, Shethar-bozenai, and their associates did exactly so[b], in accordance with what King Darius had sent.
translation:
  language: hi
  text: तब नदी-पार प्रदेश[a] के राज्यपाल तत्तनै, शेतर-बोजनै और उनके सहयोगियों ने राजा दारा ने जो भेजा था, उसके अनुसार पूरी सटीकता और सावधानी से[b] वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नदी-पार’ फ़ारसी प्रशासन में फ़रात नदी के पश्चिम के क्षेत्र का पदवी-जैसा नाम था।
    reason: cultural_note
  - marker: b
    text: अरामी अभिव्यक्ति का अनुवाद ‘ठीक-ठीक’, ‘सावधानी से’ या ‘पूरे परिश्रम से’ भी किया जा सकता है। यह राजा के भेजे हुए संदेश के सटीक अनुपालन पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम को आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: महानद-पार के राज्यपाल
  rationale: פַּחַת प्रांतीय राज्यपाल को और עֲבַר נַהֲרָה फ़ारसी साम्राज्य के प्रशासनिक क्षेत्र ‘नदी के पार’ को सूचित करता है। प्रसंग में नदी फ़रात है; ‘महानद-पार’ पदवी-जैसे भौगोलिक नाम को बनाए रखता है।
- source_word: שְׁתַר בּוֹזְנַי
  choice: शतर-बोजनै
  rationale: व्यक्तिनाम को उसके अरामी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּכְנָוָתְהוֹן
  choice: और उनके सहकर्मियों
  rationale: यह उन लोगों को दर्शाता है जो उनके साथ आधिकारिक कार्य में जुड़े थे; प्रशासनिक प्रसंग में ‘सहकर्मी’ स्वाभाविक है।
- source_word: לָקֳבֵל דִּי שְׁלַח
  choice: के भेजे हुए निर्देश के अनुसार
  rationale: मुहावरा अनुपालन का भाव देता है। שְׁלַח का शाब्दिक अर्थ ‘भेजा’ है; संदर्भ से भेजी गई राजाज्ञा या हिदायत निहित होने के कारण ‘निर्देश’ स्पष्ट और सहज है।
- source_word: כְּנֵמָא אָסְפַּרְנָא
  choice: पूरी तत्परता से ठीक वैसा ही
  rationale: संयुक्त क्रियाविशेषण राजा के निर्देश का तत्पर और सटीक पालन उभारता है। हिन्दी वाक्यांश दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲבַדוּ
  choice: किया
  rationale: व्यापक अरामी क्रिया का अर्थ ‘करना’ है; ‘ठीक वैसा ही किया’ निहित निर्देश से जुड़ते हुए मूल की सामान्यता को बनाए रखता है।
