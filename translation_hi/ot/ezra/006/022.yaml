  text: וַ/יַּֽעֲשׂ֧וּ חַג מַצּ֛וֹת שִׁבְעַ֥ת יָמִ֖ים בְּ/שִׂמְחָ֑ה כִּ֣י שִׂמְּחָ֣/ם יְהוָ֗ה וְֽ/הֵסֵ֞ב לֵ֤ב מֶֽלֶךְ אַשּׁוּר֙ עֲלֵי/הֶ֔ם לְ/חַזֵּ֣ק יְדֵי/הֶ֔ם בִּ/מְלֶ֥אכֶת בֵּית הָ/אֱלֹהִ֖ים אֱלֹהֵ֥י יִשְׂרָאֵֽל־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/006/022.yaml
  text: And they kept the Feast of Unleavened Bread for seven days with joy[a], because Yahweh had made them joyful and had turned the heart of the king of Assyria toward them, to strengthen their hands in the work of the house of God[c][b], the God of Israel.
translation:
  language: hi
  text: उन्होंने सात दिन तक आनन्द के साथ अख़मीरी रोटी का पर्व मनाया, क्योंकि यहोवा ने उन्हें आनन्दित किया था और अश्शूर के राजा का मन उनकी ओर फेर दिया था,[a] ताकि राजा इस्राएल के परमेश्वर के भवन के काम में उनके हाथ मज़बूत करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “अश्शूर का राजा” है। एज्रा के समय शासक फ़ारसी था; यहाँ सम्भवतः पुराने साम्राज्य का वह पदनाम उस राज्य-क्षेत्र के लिए प्रयुक्त हुआ है जिसमें पहले अश्शूर का इलाका भी शामिल था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: मनाया
  rationale: पर्व के साथ עשה का अर्थ मुहावरे के अनुसार पर्व मनाना या उसका पालन करना है; आधुनिक हिन्दी में “मनाया” स्वाभाविक है।
- source_word: חַג מַצּוֹת
  choice: अख़मीरी रोटी का पर्व
  rationale: यह इस्राएल के निश्चित पर्व का नाम है। “अख़मीरी” ऐसी रोटी को स्पष्ट करता है जिसमें ख़मीर न हो।
- source_word: בְּשִׂמְחָה ... שִׂמְּחָם
  choice: आनन्द के साथ ... उन्हें आनन्दित किया था
  rationale: दोनों समान-मूल शब्दों का सम्बन्ध बनाए रखते हुए पहले संज्ञा और फिर कारक क्रिया का भाव सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण “यहोवा” से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְהֵסֵב לֵב
  choice: मन ... फेर दिया था
  rationale: हिब्रू में मन या अभिवृत्ति को किसी ओर मोड़ने का चित्र है; “मन फेर दिया” उस चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर के राजा
  rationale: ऐतिहासिक कठिनाई को समतल किए बिना मूल पदनाम को यथावत रखा गया है।
- source_word: לְחַזֵּק יְדֵיהֶם
  choice: उनके हाथ मज़बूत करे
  rationale: सहायता और सामर्थ्य देने वाला हिब्रू मुहावरा अपने मूल चित्र सहित हिन्दी में बोधगम्य है।
- source_word: בִּמְלֶאכֶת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के काम में
  rationale: निर्माण या सेवा से जुड़े कार्य का अर्थ और संबंध-शृंखला स्पष्ट तथा संक्षिप्त हिन्दी में व्यक्त होती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को “प्रभु” जैसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में रखा गया है; “यहोवा” आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: फ़ारसी काल में “अश्शूर का राजा” पदनाम
  choice: मुख्य पाठ में “अश्शूर के राजा” बनाए रखना
  alternative: फ़ारस के राजा
  rationale: हिब्रू स्पष्ट रूप से “अश्शूर का राजा” कहता है। ऐतिहासिक सामंजस्य के लिए इसे बदलना मूल से परे व्याख्या जोड़ता; सम्भावित संदर्भ पादटिप्पणी में दिया गया है।
- issue: राजा के मन को फेरने का कर्ता और उद्देश्य
  choice: यहोवा ने मन फेर दिया ताकि राजा उनके हाथ मज़बूत करे
  alternative: यहोवा ने राजा को उनके पक्ष में कर दिया और इस प्रकार उन्हें सामर्थ्य दी
  rationale: मूल की कारणात्मक क्रिया और उद्देश्यवाचक रचना को सुरक्षित रखा गया है, बिना ईश्वरीय क्रिया और राजकीय सहायता को एक ही क्रिया बना देने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “अख़मीरी रोटी,” “मन फेर दिया,” और “हाथ मज़बूत करे” मूल के सांस्कृतिक तथा रूपकात्मक रंग को बचाते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उसी विवादित ऐतिहासिक पदनाम के बाद रखा गया है।
