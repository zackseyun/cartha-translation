  text: וְ/הַ/מֶּ֣לֶךְ כּ֔וֹרֶשׁ הוֹצִ֖יא אֶת כְּלֵ֣י בֵית יְהוָ֑ה אֲשֶׁ֨ר הוֹצִ֤יא נְבֽוּכַדְנֶצַּר֙ מִ/יר֣וּשָׁלִַ֔ם וַֽ/יִּתְּנֵ֖/ם בְּ/בֵ֥ית אֱלֹהָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/007.yaml
  text: And King Cyrus brought out the vessels of the house of Yahweh[b][a], which Nebuchadnezzar had brought out from Jerusalem and had put in the house of his god.
translation:
  language: hi
  text: और राजा कुस्रू ने याहवे के भवन[a] के वे पात्र निकाले, जिन्हें नबूकदनेस्सर यरूशलेम से निकालकर अपने देवता के भवन में रख चुका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “याहवे का घर”; इसका अनुवाद “याहवे का मन्दिर” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ כּוֹרֶשׁ
  choice: राजा कुस्रू
  rationale: हिन्दी में राजकीय उपाधि को नाम से पहले रखना स्वाभाविक है; ‘कुस्रू’ एज्रा में प्रचलित हिन्दी बाइबलीय नाम-रूप है।
- source_word: הוֹצִיא
  choice: निकलवाए
  rationale: 'हिफ़ील रूप का कारणवाचक भाव व्यक्त करता है: राजा ने पात्र स्वयं आवश्यक रूप से नहीं निकाले, बल्कि उन्हें बाहर निकलवाया।'
- source_word: כְּלֵי
  choice: पात्र
  rationale: मन्दिर-सन्दर्भ में यह पूजा में प्रयुक्त वस्तुओं के लिए स्वाभाविक और पर्याप्त व्यापक हिन्दी शब्द है; यह उनके सटीक प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בֵית יְהוָה
  choice: याहवे का भवन
  rationale: इब्रानी के शाब्दिक रूप ‘याहवे का घर/भवन’ और आगे ‘अपने देवता के भवन’ के साथ उसके शब्दगत समानान्तर को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिवाचक दिव्य नाम को उपाधि से प्रतिस्थापित करने के बजाय देवनागरी में लिप्यन्तरित किया गया है।
- source_word: הוֹצִיא ... מִירוּשָׁלִַם
  choice: यरूशलेम से निकालकर
  rationale: उसी इब्रानी क्रिया की पुनरावृत्ति को हिन्दी में ‘निकाल-’ से बनाए रखता है और कुस्रू के कार्य से पहले हुई घटना को संयुक्त क्रिया-रचना में स्वाभाविक ढंग से रखता है।
- source_word: וַיִּתְּנֵם
  choice: रख चुका था
  rationale: यहाँ נתן का सन्दर्भगत अर्थ किसी स्थान में रखना है। ‘चुका था’ नबूकदनेस्सर के पहले पूर्ण हो चुके कार्य को स्पष्ट करता है।
- source_word: בְּבֵית אֱלֹהָיו
  choice: अपने देवता के भवन में
  rationale: एकवचन और तृतीय पुरुष पुल्लिंग सम्बन्धसूचक प्रत्यय को बनाए रखता है तथा ‘याहवे के भवन’ के साथ मूल पाठ का विरोधात्मक समानान्तर सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिवाचक दिव्य नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; किसी उपाधि द्वारा प्रतिस्थापन नहीं करता।
- issue: नबूकदनेस्सर के देवता की संख्या
  choice: अपने देवता
  alternative: अपने देवताओं
  rationale: אֱלֹהָיו यहाँ व्याकरण और सन्दर्भ में एकवचन है; बहुवचन करने से मूल पाठ से परे बाबुल के व्यापक देवसमूह का विचार आ जाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भवन’ मूल के בֵית को निकटता से व्यक्त करता है और पद के दोनों धार्मिक स्थलों के बीच शब्दगत समानान्तर बनाए रखता है। कारणवाचक ‘निकलवाए’ राजकीय आदेश या प्रबन्ध के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
