base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/008.yaml
  text: King Cyrus of Persia brought them out by the hand of Mithredath the treasurer[a], and counted them out to Sheshbazzar[b], the prince of Judah.
translation:
  language: hi
  text: फ़ारस के राजा कुस्रू ने उन्हें कोषाध्यक्ष मिथ्रदात के द्वारा निकलवाया[a] और उनकी गिनती करके यहूदा के प्रधान[b] शेशबस्सर को सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोषाध्यक्ष मिथ्रदात के माध्यम से निकलवाया।” इब्रानी मुहावरे का शाब्दिक अर्थ “मिथ्रदात के हाथ से” है।
    reason: lexical_alternative
  - marker: b
    text: या “यहूदा के अगुए।” इब्रानी शब्द का अर्थ सामान्य रूप से मुखिया या शासक भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאֵם
  choice: उन्हें ... निकलवाया
  rationale: 'हिफ़ील रूप का कारक अर्थ सुरक्षित रखा गया है: कुस्रू ने पिछले पद में बताए गए पात्रों को भंडार से बाहर निकलवाया।'
- source_word: עַל יַד
  choice: के हाथों
  rationale: यह इब्रानी मुहावरा माध्यम या कर्तृत्व बताता है। हिंदी का ‘के हाथों’ मूल बिंब को बनाए रखते हुए स्वाभाविक है।
- source_word: מִתְרְדָת
  choice: मिथ्रदात
  rationale: फ़ारसी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: הַגִּזְבָּר
  choice: कोषाध्यक्ष
  rationale: यह राजकोष या भंडार से संबंधित अधिकारी का पद है; ‘कोषाध्यक्ष’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: וַיִּסְפְּרֵם
  choice: गिनकर ... सौंप दिया
  rationale: ספר यहाँ वस्तुओं को गिनने या उनकी संख्या निर्धारित करने के अर्थ में है। לְ के साथ प्रसंग में गिनकर किसी को देने का भाव है; हिंदी में यह प्रयोग स्वाभाविक है।
- source_word: לְשֵׁשְׁבַּצַּר
  choice: शेशबस्सर को
  rationale: व्यक्ति-नाम का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: הַנָּשִׂיא
  choice: प्रधान
  rationale: נָשִׂיא सामान्य रूप से मुखिया, प्रधान या शासक को सूचित करता है। ‘प्रधान’ पद को अनावश्यक रूप से राजकुमार या फ़ारसी प्रांतपाल के विशिष्ट अर्थ तक सीमित नहीं करता।
- source_word: לִיהוּדָה
  choice: यहूदा के
  rationale: यह शेशबस्सर का यहूदा से संबंध बताता है और ‘प्रधान’ के साथ स्वाभाविक हिंदी संबंध बनाता है।
- source_word: כּוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: फ़ारस के राजा कुस्रू
  rationale: राजकीय उपाधि और राज्य की पूरी पहचान को स्वाभाविक हिंदी क्रम में रखा गया है।
