  text: כֹּ֣ה אָמַ֗ר כֹּ֚רֶשׁ מֶ֣לֶךְ פָּרַ֔ס כֹּ֚ל מַמְלְכ֣וֹת הָ/אָ֔רֶץ נָ֣תַן לִ֔/י יְהוָ֖ה אֱלֹהֵ֣י הַ/שָּׁמָ֑יִם וְ/הֽוּא פָקַ֤ד עָלַ/י֙ לִ/בְנֽוֹת ל֣/וֹ בַ֔יִת בִּ/ירוּשָׁלִַ֖ם אֲשֶׁ֥ר בִּֽ/יהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/002.yaml
  text: 'Thus says Cyrus king of Persia: Yahweh[a], the God of heaven, has given me all the kingdoms of the earth, and he has appointed me to build a house for him in Jerusalem[b], which is in Judah.'
translation:
  language: hi
  text: 'फ़ारस का राजा कुस्रू यों कहता है: “स्वर्ग के परमेश्वर याहवे ने पृथ्वी के सभी राज्य मुझे दे दिए हैं, और उसी ने मुझे अपने लिए यरूशलेम में, जो यहूदा में है, एक भवन[b] बनाने का दायित्व सौंपा है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे आदेश दिया है।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् यरूशलेम का मन्दिर।
    reason: cultural_note
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: राजकीय घोषणा के सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और कथन की औपचारिकता बनाए रखता है।
- source_word: כֹּרֶשׁ
  choice: कुस्रू
  rationale: इस फ़ारसी राजा के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: מֶלֶךְ פָּרַס
  choice: फ़ारस का राजा
  rationale: सम्बन्धसूचक इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: כֹּל מַמְלְכוֹת הָאָרֶץ
  choice: पृथ्वी के सभी राज्य
  rationale: מַמְלְכוֹת के बहुवचन को बनाए रखता है; यहाँ הָאָרֶץ का व्यापक साम्राज्यिक आशय ‘पृथ्वी’ उपयुक्त है।
- source_word: נָתַן לִי
  choice: मुझे दे दिए हैं
  rationale: भूतकालीन कार्य के वर्तमान परिणाम—कुस्रू का मौजूदा शासनाधिकार—को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित करता है।
- source_word: אֱלֹהֵי הַשָּׁמַיִם
  choice: स्वर्ग के परमेश्वर
  rationale: एज्रा में प्रयुक्त इस उपाधि का प्रचलित और सहज हिन्दी रूप।
- source_word: וְהוּא
  choice: और उसी ने
  rationale: इब्रानी के स्पष्ट और बलसूचक सर्वनाम को हिन्दी में ‘उसी’ द्वारा बनाए रखता है।
- source_word: פָקַד עָלַי
  choice: मुझे … दायित्व सौंपा है
  rationale: इस सन्दर्भ में क्रिया किसी कार्य की जिम्मेदारी देने या नियुक्त करने का भाव रखती है; हिन्दी में यह रूप सहज है। ‘आदेश दिया है’ सम्भव वैकल्पिक अर्थ है।
- source_word: לִבְנוֹת לוֹ בַיִת
  choice: अपने लिए एक भवन बनाने
  rationale: בַיִת के मूल अर्थ ‘घर/भवन’ को मुख्य पाठ में बनाए रखता है; सन्दर्भगत अर्थ ‘मन्दिर’ को टिप्पणी में स्पष्ट किया गया है।
- source_word: בִּירוּשָׁלִַם אֲשֶׁר בִּיהוּדָה
  choice: यहूदा के यरूशलेम में
  rationale: भौगोलिक सूचना को पूर्णतः रखता है; हिन्दी में सम्बन्धसूचक रचना मूल के सापेक्ष उपवाक्य से अधिक स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בַיִת को शाब्दिक ‘भवन’ अथवा व्याख्यात्मक ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: मुख्य पाठ मूल शब्द का सामान्य अर्थ बनाए रखता है, जबकि ऐतिहासिक सन्दर्भ में उसके मन्दिर होने की जानकारी पादटिप्पणी में दी जाती है।
- issue: פָקַד עָלַי में नियुक्ति और आदेश के बीच अर्थ-छाया
  choice: दायित्व सौंपा है
  alternative: आदेश दिया है
  rationale: यह क्रिया यहाँ कार्य सौंपने, नियुक्त करने या आदेश देने का भाव रख सकती है। मुख्य पाठ जिम्मेदारी सौंपने का व्यापक भाव रखता है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। राजकीय उद्घोषणा का औपचारिक स्वर बना हुआ है। ‘उसी ने’ मूल के बलसूचक सर्वनाम को व्यक्त करता है, और ‘भवन’ मूल की शाब्दिकता को सुरक्षित रखता है।
