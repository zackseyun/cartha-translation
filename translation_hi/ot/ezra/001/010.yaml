  text: כְּפוֹרֵ֤י זָהָב֙ שְׁלֹשִׁ֔ים כְּפ֤וֹרֵי כֶ֨סֶף֙ מִשְׁנִ֔ים אַרְבַּ֥ע מֵא֖וֹת וַ/עֲשָׂרָ֑ה כֵּלִ֥ים אֲחֵרִ֖ים אָֽלֶף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/010.yaml
  text: 30 gold bowls[a], 410 silver bowls of a second kind, and 1,000 other vessels.
translation:
  language: hi
  text: सोने के 30 कटोरे, दूसरी किस्म के चाँदी के 410 कटोरे[a], और 1,000 अन्य पात्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “चाँदी के कटोरे, दुगुने: 410।” यहाँ “दूसरी किस्म के” अनूदित इब्रानी शब्द का इस सूची में अर्थ अनिश्चित है; यह दूसरी श्रेणी, प्रतिरूपों या दुगुने रूप का संकेत दे सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפוֹרֵי
  choice: कटोरे
  rationale: यह शब्द एक प्रकार के पात्र को दर्शाता है। सूची के इस संदर्भ में “कटोरे” सहज और स्पष्ट है, जबकि “हौद” आकार को आवश्यकता से अधिक निश्चित कर सकता है।
- source_word: זָהָב
  choice: सोने के
  rationale: पात्र की सामग्री बताने वाला सामान्य शब्द; हिन्दी में संबंधसूचक रूप स्वाभाविक है।
- source_word: שְׁלֹשִׁים
  choice: '30'
  rationale: वस्तुओं की सूची में स्पष्टता और संक्षिप्तता के लिए अंक का प्रयोग किया गया है।
- source_word: כְּפוֹרֵי כֶסֶף
  choice: चाँदी के कटोरे
  rationale: पहले आए पात्र-शब्द का अनुवाद एकरूप रखा गया है और כֶסֶף से उसकी सामग्री व्यक्त की गई है।
- source_word: מִשְׁנִים
  choice: दूसरी किस्म के
  rationale: सूची के इस संदर्भ में शब्द का अर्थ अनिश्चित है। यह अनुवाद किसी दूसरी श्रेणी का संकेत देता है, पर “दुगुने” या “प्रतिरूप” जैसे अधिक निश्चित अर्थ को आरोपित नहीं करता।
- source_word: אַרְבַּע מֵאוֹת וַעֲשָׂרָה
  choice: '410'
  rationale: गिनती की सूची में पठनीयता के लिए संख्या अंकों में दी गई है।
- source_word: כֵּלִים
  choice: पात्र
  rationale: मन्दिर से संबंधित वस्तुओं के लिए यह व्यापक और गरिमापूर्ण हिन्दी शब्द है।
- source_word: אֲחֵרִים
  choice: अन्य
  rationale: पहले गिनाए गए पात्रों से सीधे भेद को व्यक्त करता है।
- source_word: אָלֶף
  choice: 1,000
  rationale: सूची में अन्य संख्याओं के अनुरूप अंक का प्रयोग किया गया है।
