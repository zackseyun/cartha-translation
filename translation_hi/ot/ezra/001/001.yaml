base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/001.yaml
  text: 'In the first year of Cyrus king of Persia[a], so that the word of Yahweh from the mouth of Jeremiah might be fulfilled, Yahweh stirred up the spirit of Cyrus king of Persia, and he sent a proclamation throughout all his kingdom, and also in writing[c][b], saying:'
translation:
  language: hi
  text: 'फारस के राजा कोरेश के शासन के पहले वर्ष में, ताकि यिर्मयाह के द्वारा कहा गया यहवे का वचन पूरा हो[a][b], यहवे ने फारस के राजा कोरेश की आत्मा को जगाया। तब कोरेश ने अपने पूरे राज्य में एक घोषणा करवाई[c] और उसे लिखित रूप में भी जारी किया। यह कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यिर्मयाह के मुँह से।” यह हिब्रू मुहावरा बताता है कि यिर्मयाह वह मानवीय प्रवक्ता था जिसके द्वारा यहवे का वचन आया।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक शाब्दिक रूप से, “यहवे के वचन को पूर्णता तक पहुँचाने के लिए।” यहाँ आशय यिर्मयाह के भविष्यसूचक वचन के साकार होने से है।
    reason: lexical_alternative
  - marker: c
    text: या, “एक घोषणा फैलवाई” या “एक घोषणा कराई।” हिब्रू मुहावरा किसी आधिकारिक घोषणा को सार्वजनिक रूप से पूरे राज्य में प्रसारित कराने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִשְׁנַת אַחַת לְכוֹרֶשׁ מֶלֶךְ פָּרַס
  choice: फारस के राजा कोरेश के शासन के पहले वर्ष में
  rationale: हिब्रू काल-सूत्र को स्वाभाविक हिन्दी में व्यक्त किया गया है। ‘शासन के’ निहित राजकीय वर्ष को स्पष्ट करता है, और आरम्भिक ו को अलग ‘और’ से अनावश्यक रूप से नहीं दर्शाया गया।
- source_word: לִכְלוֹת דְּבַר יְהוָה
  choice: यहवे के वचन को पूरा करने के लिए
  rationale: לִכְלוֹת का मूल भाव किसी बात को उसकी पूर्णता तक पहुँचाना है। यह अनुवाद भविष्यवाणी के ऐतिहासिक साकार होने का भाव रखता है और स्रोत की प्रयोजनवाचक रचना को भी बनाए रखता है।
- source_word: מִפִּי יִרְמְיָה
  choice: यिर्मयाह के मुँह से निकले
  rationale: यह हिब्रू मुहावरे की ठोस छवि को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है; इससे यिर्मयाह के मानवीय प्रवक्ता होने का भाव प्रकट होता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הֵעִיר יְהוָה אֶת רוּחַ כֹּרֶשׁ
  choice: यहवे ने ... कोरेश की आत्मा को उभारा
  rationale: ‘आत्मा’ רוּחַ की व्यापकता और धार्मिक अनुगूँज को सुरक्षित रखती है; ‘उभारा’ भीतर से कार्य करने को प्रवृत्त करने का भाव देता है, पर उसकी सटीक मनोवैज्ञानिक प्रक्रिया तय नहीं करता।
- source_word: וַיַּעֲבֶר קוֹל בְּכָל מַלְכוּתוֹ
  choice: कोरेश ने अपने पूरे राज्य में एक घोषणा करवाई
  rationale: शाब्दिक रूप से ‘आवाज़/घोषणा को चलवाया’ राजकीय संदेश को सार्वजनिक रूप से प्रसारित कराने का मुहावरा है। ‘घोषणा करवाई’ उसका स्वाभाविक हिन्दी रूप है।
- source_word: וְגַם בְּמִכְתָּב
  choice: और उसे लिखित रूप में भी जारी किया
  rationale: मौखिक सार्वजनिक घोषणा के साथ उसके लिखित रूप में जारी किए जाने को स्पष्ट और संक्षिप्त हिन्दी में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: 'उसमें कहा गया:'
  rationale: आगे आने वाले प्रत्यक्ष कथन का स्वाभाविक हिन्दी परिचय है; लिखित आदेश से संबंध भी स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: स्रोत में निजी वाचा-नाम सीधे आया है। ‘यहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: לִכְלוֹת को भविष्यवाणी की पूर्ति के रूप में समझना
  choice: वचन को पूरा करने के लिए
  alternative: वचन के पूरा हो जाने पर; वचन को समाप्त करने के लिए
  rationale: प्रसंग में यह यिर्मयाह के भविष्यद्वाणी-वचन के इतिहास में साकार होने की बात है। प्रयोजनवाचक ‘के लिए’ हिब्रू infinitive की रचना को बनाए रखता है, जबकि ‘पूरा’ उसके पूर्ण होने का भाव देता है।
- issue: कोरेश के רוּחַ पर यहवे की क्रिया
  choice: आत्मा को उभारा
  alternative: मन को प्रेरित किया; आत्मा को जगाया
  rationale: ‘आत्मा’ स्रोत की अर्थ-व्याप्ति को संकुचित नहीं करती। ‘उभारा’ ईश्वरीय पहल को व्यक्त करता है, पर मानवीय इच्छा और ईश्वरीय प्रेरणा के संबंध को पाठ से अधिक परिभाषित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘कोरेश’ हिब्रू כּוֹרֶשׁ का निकट देवनागरी लिप्यंतरण है। वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि कारण-परिणाम और अगले पद की ओर ले जाने वाला उपनिवेश सुरक्षित है।
