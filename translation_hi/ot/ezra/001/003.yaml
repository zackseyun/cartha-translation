  text: מִֽי בָ/כֶ֣ם מִ/כָּל עַמּ֗/וֹ יְהִ֤י אֱלֹהָי/ו֙ עִמּ֔/וֹ וְ/יַ֕עַל לִ/ירוּשָׁלִַ֖ם אֲשֶׁ֣ר בִּ/יהוּדָ֑ה וְ/יִ֗בֶן אֶת בֵּ֤ית יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל ה֥וּא הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/003.yaml
  text: Whoever among all his people is among you[a], may his God be with him, and let him go up to Jerusalem, which is in Judah, and rebuild the house of Yahweh[b], the God of Israel—he is the God who is in Jerusalem.
translation:
  language: hi
  text: तुम्हारे बीच उसकी सारी प्रजा में से जो कोई हो, उसका परमेश्वर उसके साथ रहे। वह यरूशलेम को, जो यहूदा में है, जाए और इस्राएल के परमेश्वर याहवे का भवन फिर से बनाए[a]—वही परमेश्वर है जो यरूशलेम में है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बनाए।” हिब्रू क्रिया का सामान्य अर्थ “बनाना” है; “फिर से बनाए” बहाली के प्रसंग को स्पष्ट करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह परमेश्वर है जो यरूशलेम में है।” हिब्रू सर्वनाम और निश्चित संज्ञा के बल को मुख्य पाठ में “वही परमेश्वर” से व्यक्त किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: מִי בָכֶם מִכָּל עַמּוֹ
  choice: तुममें से जो कोई उसकी समस्त प्रजा में से है
  rationale: מִי को इस राजकीय आमंत्रण में अनिश्चित अर्थ वाले ‘जो कोई’ के रूप में लिया गया है। ‘उसकी समस्त प्रजा में से’ तीसरे पुरुष के प्रत्यय और מִכָּל दोनों को सुरक्षित रखता है, बिना यह स्पष्ट रूप से जोड़ने के कि ‘उसकी’ किसकी ओर संकेत करता है।
- source_word: יְהִי אֱלֹהָיו עִמּוֹ
  choice: उसका परमेश्वर उसके साथ रहे
  rationale: जुसिव יְהִי को आशीर्वचन या कामना के रूप में व्यक्त करने के लिए ‘रहे’ स्वाभाविक और सटीक है।
- source_word: וְיַעַל
  choice: वह ... जाए
  rationale: עלה में यरूशलेम की ओर ‘ऊपर जाने’ का भौगोलिक और धार्मिक मुहावरा है; किंतु हिन्दी में ‘चढ़ जाए’ यहाँ अस्वाभाविक और संभावित रूप से भ्रामक होता। ‘जाए’ प्रसंगगत गति को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
- source_word: לִירוּשָׁלַם אֲשֶׁר בִּיהוּדָה
  choice: यहूदा के यरूशलेम को
  rationale: 'सम्बन्धवाचक उपवाक्य का भौगोलिक आशय संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है: यहूदा में स्थित यरूशलेम।'
- source_word: וְיִבֶן
  choice: फिर से बनाए
  rationale: בנה का मूल अर्थ ‘बनाना’ है, पर निर्वासन के बाद मन्दिर की बहाली के प्रसंग में ‘फिर से बनाए’ निहित पुनर्निर्माण को स्पष्ट करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: ‘भवन’ हिब्रू בֵּית की छवि को बनाए रखता है और प्रसंग में मन्दिर के रूप में समझ में आता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह हिब्रू सम्बन्धसूचक संरचना का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הוּא הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלָם
  choice: वही परमेश्वर है जो यरूशलेम में है
  rationale: הוּא और निश्चित पद הָאֱלֹהִים के बल को ‘वही परमेश्वर’ व्यक्त करता है। स्थानसूचक उपवाक्य को ऐतिहासिक उद्घोषणा के अनुसार जस का तस रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदलने के बजाय वाचा-नाम के रूप में सुरक्षित रखता है।
- issue: परमेश्वर को यरूशलेम में स्थित बताने वाला उपवाक्य
  choice: वही परमेश्वर है जो यरूशलेम में है
  alternative: वही परमेश्वर है, जिसकी उपासना यरूशलेम में होती है
  rationale: वैकल्पिक व्याख्यात्मक रूप स्थानसूचक कथन को नरम कर देता। मुख्य पाठ कुस्रू की घोषणा के प्राचीन मन्दिर-केंद्रित कथन को बिना बाद की धर्मवैज्ञानिक व्याख्या जोड़े बनाए रखता है।
- issue: בנה में पुनर्निर्माण का प्रसंगगत अर्थ
  choice: फिर से बनाए
  alternative: बनाए
  rationale: मन्दिर के विनाश और बहाली के ऐतिहासिक प्रसंग में पुनर्निर्माण अभिप्रेत है, फिर भी मूल क्रिया की व्यापकता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘समस्त प्रजा’ राजकीय घोषणा का औपचारिक स्वर बनाए रखता है। ‘याहवे का भवन’ हिब्रू रूपक को सुरक्षित रखता है, जबकि ‘फिर से बनाए’ बहाली के प्रसंग को सहज रूप से स्पष्ट करता है।
