  text: 'And this was their number: 30 gold basins[a], 1,000 silver basins, and 29 knives.'
translation:
  language: hi
  text: 'और उनकी गिनती यह थी: सोने के 30 कटोरे, चाँदी के 1,000 कटोरे, और 29 छुरियाँ।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “29 अन्य पात्र,” “29 समान पात्र,” अथवा “29 बदले में रखे गए पात्र”; यहाँ प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה מִסְפָּרָם
  choice: और उनकी गिनती यह थी
  rationale: सूची का स्वाभाविक हिंदी परिचय; मूल के ‘और ये उनकी गिनती’ का अर्थ सुरक्षित रखते हुए पूर्ण और सहज वाक्य बनाया गया है।
- source_word: אֲגַרְטְלֵי
  choice: कटोरे
  rationale: मंदिर के पात्र के लिए सरल, आधुनिक और संदर्भानुकूल शब्द; ‘प्याले’ या ‘बर्तन’ भी संभव हैं, पर कटोरे वस्तु के आकार का अपेक्षाकृत स्पष्ट संकेत देते हैं।
- source_word: זָהָב / כֶסֶף
  choice: सोने के / चाँदी के
  rationale: सामग्री बताने वाले इन शब्दों का स्वाभाविक हिंदी विशेषणात्मक रूप।
- source_word: שְׁלֹשִׁים / אָלֶף / תִּשְׁעָה וְעֶשְׂרִים
  choice: 30 / 1,000 / 29
  rationale: सूची में संख्याओं को अंकों में देना स्पष्ट और आसानी से पढ़ने योग्य है।
- source_word: מַחֲלָפִים
  choice: छुरियाँ
  rationale: यह दुर्लभ और अनिश्चित शब्द है। ‘छुरियाँ’ एक प्राचीन तथा संभव अर्थ है, पर अन्य व्याख्याएँ पादटिप्पणी में रखी गई हैं।
