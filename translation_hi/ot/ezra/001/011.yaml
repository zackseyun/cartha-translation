base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/011.yaml
  text: All the articles of gold and silver were five thousand four hundred in all[c][b][a]. Sheshbazzar brought them up with the exiles when they were brought up from Babylon to Jerusalem.
translation:
  language: hi
  text: सोने और चाँदी की सभी वस्तुएँ[a] कुल पाँच हज़ार चार सौ थीं। शेशबस्सर उन सबको निर्वासितों[c] के साथ ऊपर ले आया, जब निर्वासितों को बाबेल से यरूशलेम की ओर ऊपर लाया गया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पात्र’। इब्रानी शब्द का अर्थ बर्तन, पात्र, उपकरण या अन्य वस्तुएँ हो सकता है, विशेषकर मन्दिर की वस्तुएँ।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में इस पद में ‘ऊपर लाना’ दो बार आया है; यह यरूशलेम जाने के लिए प्रचलित ‘ऊपर जाने’ की अभिव्यक्ति को दर्शाता है।
    reason: cultural_note
  - marker: c
    text: या ‘निर्वासित समुदाय’; इब्रानी शब्द निर्वासित लोगों के समूह को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל כֵּלִים
  choice: सभी वस्तुएँ
  rationale: כֵּלִים एक व्यापक शब्द है, जो पात्रों, उपकरणों या अन्य वस्तुओं को सूचित कर सकता है। मन्दिर के सामान के इस संदर्भ में ‘वस्तुएँ’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: לַזָּהָב וְלַכֶּסֶף
  choice: सोने और चाँदी की
  rationale: यहाँ उपसर्ग ל वस्तुओं का वर्गीकरण उनकी सामग्री के अनुसार करता है; हिन्दी में ‘सोने और चाँदी की’ इसका स्वाभाविक रूप है।
- source_word: חֲמֵשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: पाँच हज़ार चार सौ
  rationale: इब्रानी संख्या को प्रवाहपूर्ण गद्य में शब्दों द्वारा ठीक-ठीक व्यक्त किया गया है।
- source_word: הַכֹּל
  choice: कुल
  rationale: यह शब्द यहाँ समस्त वस्तुओं की कुल संख्या बताता है; ‘कुल’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: הֶעֱלָה
  choice: ऊपर ले आया
  rationale: עלה के हिफ़ील रूप में ‘ऊपर ले आना’ का भाव है। इससे यरूशलेम की ओर चढ़ने की मूल अभिव्यक्ति बनी रहती है।
- source_word: שֵׁשְׁבַּצַּר
  choice: शेशबस्सर
  rationale: व्यक्तिनाम को हिन्दी ध्वन्यात्मक परंपरा के अनुसार लिप्यंतरित किया गया है।
- source_word: עִם
  choice: के साथ
  rationale: 'यह साधारण साथ या संगति प्रकट करता है: वस्तुएँ लौटने वाले निर्वासितों के साथ लाई गईं।'
- source_word: הֵעָלוֹת הַגּוֹלָה
  choice: जब उन्हें ... ऊपर लाया गया
  rationale: क्रियारूप निर्वासित समुदाय को ऊपर लाए जाने की परिस्थिति या समय प्रकट करता है। कालवाचक उपवाक्य हिन्दी में स्पष्ट है और मूल का कर्मवाच्य भाव बनाए रखता है।
- source_word: הַגּוֹלָה
  choice: निर्वासितों
  rationale: यह संज्ञा निर्वासन की दशा या निर्वासित समुदाय दोनों को सूचित कर सकती है। यहाँ बाबेल से लौटते लोगों का संदर्भ होने के कारण ‘निर्वासितों’ उपयुक्त है।
- source_word: מִבָּבֶל לִירוּשָׁלִָם
  choice: बाबेल से यरूशलेम
  rationale: स्थाननामों और गति की दिशा का सीधा अनुवाद है।
theological_decisions:
- issue: עלה में यरूशलेम की ओर आरोहण की भाषा
  choice: दोनों स्थानों पर ‘ऊपर’ बनाए रखा गया
  alternative: सिर्फ ‘ले आया/लाया गया’
  rationale: इब्रानी पद में עלה की आरोहण-संबंधी भाषा दो बार आती है। ‘ऊपर’ रखने से भौगोलिक और साहित्यिक सूक्ष्मता सुरक्षित रहती है, बिना कोई अतिरिक्त धर्मसैद्धान्तिक निष्कर्ष जोड़े।
- issue: הַגּוֹלָה का संदर्भ
  choice: इसे लोगों के अर्थ में ‘निर्वासितों’ कहा गया
  alternative: ‘निर्वासन’ या ‘बँधुआई’
  rationale: इस प्रसंग में बाबेल से यरूशलेम लौटते समुदाय का उल्लेख है, केवल निर्वासन की अमूर्त अवस्था का नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप अपनाया गया है। ‘वस्तुएँ’ व्यापक अर्थ बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है। ‘ऊपर’ की कुछ असामान्य किन्तु अर्थपूर्ण पुनरावृत्ति मूल इब्रानी की आरोहण-भाषा को जानबूझकर सुरक्षित रखती है।
