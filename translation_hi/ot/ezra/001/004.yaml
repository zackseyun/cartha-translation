  text: וְ/כָל הַ/נִּשְׁאָ֗ר מִֽ/כָּל הַ/מְּקֹמוֹת֮ אֲשֶׁ֣ר ה֣וּא גָֽר שָׁם֒ יְנַשְּׂא֨וּ/הוּ֙ אַנְשֵׁ֣י מְקֹמ֔/וֹ בְּ/כֶ֥סֶף וּ/בְ/זָהָ֖ב וּ/בִ/רְכ֣וּשׁ וּ/בִ/בְהֵמָ֑ה עִם הַ֨/נְּדָבָ֔ה לְ/בֵ֥ית הָ/אֱלֹהִ֖ים אֲשֶׁ֥ר בִּ/ירוּשָׁלִָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/004.yaml
  text: And everyone who remains[a], in any place where he is living, let the men of his place support him with silver and gold, with goods and with livestock[c][b], together with the freewill offering for the house of God that is in Jerusalem.
translation:
  language: hi
  text: और जो कोई, जहाँ कहीं वह रह रहा हो[a], शेष रह गया हो, उस स्थान के पुरुष[b] उसे चाँदी, सोना, सामान और पशु देकर सहायता करें[c], और यरूशलेम में स्थित परमेश्वर के भवन के लिए स्वेच्छा-भेंट भी दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जहाँ कहीं वह निवास करता हो” अथवा “जहाँ कहीं वह परदेशी होकर रहता हो।”
    reason: גָר में सामान्य निवास और परदेशी के रूप में अस्थायी निवास—दोनों भाव सम्भव हैं।
  - marker: b
    text: शाब्दिक रूप से “उसके स्थान के पुरुष”; इसका आशय अधिक व्यापक रूप से वहाँ के निवासी या पड़ोसी भी हो सकता है।
    reason: मूल पुल्लिंग पद को रखते हुए उसके सम्भावित सामाजिक विस्तार को बताना आवश्यक है।
  - marker: c
    text: या “उसे सहारा दें”; इब्रानी क्रिया का शाब्दिक अर्थ “उठाना/ढोना” है और यहाँ इसका अर्थ साधन देकर व्यावहारिक सहायता करना है।
    reason: मुहावरेदार प्रसंगगत अर्थ और क्रिया के मूल चित्र—दोनों को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: הַנִּשְׁאָר
  choice: शेष रह गया हो
  rationale: निफ़अल कृदन्त का अर्थ किसी स्थान पर पीछे या शेष रह जाना है। यह रूप उन लोगों को सूचित करता है जो अपने प्रवासी निवास-स्थान में हैं, और यह अनावश्यक रूप से तय नहीं करता कि वे स्वयं यात्रा करेंगे या नहीं।
- source_word: מִכָּל הַמְּקֹמוֹת אֲשֶׁר הוּא גָר שָׁם
  choice: जहाँ कहीं रह रहा हो
  rationale: यह हिन्दी में स्वाभाविक रीति से विभिन्न प्रवासी निवास-स्थानों में से प्रत्येक की ओर संकेत करता है। גּוּר में अस्थायी या परदेशी निवास का भाव भी हो सकता है, जिसे पाद-टिप्पणी में रखा गया है।
- source_word: יְנַשְּׂאֻהוּ
  choice: उसकी सहायता करें
  rationale: נשׂא का मूल अर्थ ‘उठाना/ढोना’ है, पर यहाँ चाँदी, सोना और अन्य साधन देने के साथ इसका प्रसंगगत अर्थ व्यावहारिक सहायता देना है।
- source_word: אַנְשֵׁי מְקֹמוֹ
  choice: उस स्थान के पुरुष
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग बहुवचन ‘उसके स्थान के पुरुष’ है। हिन्दी में ‘उस स्थान के पुरुष’ अर्थ को बनाए रखते हुए अधिक सहज है; व्यापक सामुदायिक अर्थ की सम्भावना पाद-टिप्पणी में दी गई है।
- source_word: בְּכֶסֶף וּבְזָהָב
  choice: चाँदी, सोना ... देकर
  rationale: बहुमूल्य धातुओं के मूल शब्द यथावत रखे गए हैं; ‘देकर’ हिन्दी में साधन-सूचक उपसर्ग בְּ का स्वाभाविक प्रसंगगत रूप है।
- source_word: וּבִרְכוּשׁ
  choice: सामान
  rationale: רְכוּשׁ चल सम्पत्ति और वस्तुओं को सूचित करता है; सूची के इस प्रसंग में ‘सामान’ सरल और स्वाभाविक है।
- source_word: וּבִבְהֵמָה
  choice: पशु
  rationale: בְּהֵמָה यहाँ घरेलू पशुओं के लिए सामूहिक अर्थ में है। ‘पशु’ सामान्य पाठक के लिए स्पष्ट है और इसे केवल मवेशियों तक सीमित नहीं करता।
- source_word: עִם הַנְּדָבָה
  choice: साथ ही ... स्वेच्छा-भेंट भी
  rationale: נְדָבָה स्वेच्छा से दी गई भेंट है। अलग वाक्य में ‘साथ ही’ भौतिक सहायता और परमेश्वर के भवन के लिए भेंट के सहवर्ती सम्बन्ध को स्पष्ट और स्वाभाविक रखता है।
- source_word: לְבֵית הָאֱלֹהִים אֲשֶׁר בִּירוּשָׁלָם
  choice: यरूशलेम में परमेश्वर के भवन के लिए
  rationale: ‘परमेश्वर का भवन’ इब्रानी अभिव्यक्ति को सुरक्षित रखता है; ‘मन्दिर’ कहकर व्याख्यात्मक विशेषीकरण नहीं किया गया।
theological_decisions:
- issue: אַנְשֵׁי מְקֹמוֹ में लिंग-सूचक भाषा
  choice: उस स्थान के पुरुष
  alternative: उस स्थान के लोग / उसके पड़ोसी
  rationale: मूल पाठ के पुल्लिंग बहुवचन को मुख्य पाठ में बनाए रखा गया है, जबकि यह सम्भावना पाद-टिप्पणी में स्वीकार की गई है कि सामाजिक सन्दर्भ में इससे स्थानीय निवासी या पड़ोसी व्यापक रूप से अभिप्रेत हों।
- issue: יְנַשְּׂאֻהוּ का प्रसंगगत अर्थ
  choice: उसकी सहायता करें
  alternative: उसे उठाएँ / उसे सहारा दें
  rationale: सामग्री प्रदान करने की सूची के कारण शाब्दिक ‘उठाएँ’ हिन्दी में भ्रामक होगा। ‘सहायता करें’ क्रिया के व्यावहारिक आशय को व्यक्त करता है, जबकि मूल रूपक पाद-टिप्पणी में सुरक्षित है।
- issue: निवासी की स्थिति और गमन का आशय
  choice: जहाँ कहीं रह रहा हो और वहीं शेष रह गया हो
  alternative: जहाँ कहीं वह परदेशी हो / जो कोई पीछे रह गया हो
  rationale: मुख्य पाठ व्यक्ति की प्रवासी स्थानीयता और उसके वहाँ शेष होने को व्यक्त करता है, पर यह निश्चित नहीं करता कि वह लौटने वाला व्यक्ति है या समुदाय में रहने वाला कोई अन्य व्यक्ति। इस प्रकार उद्घोषणा का वास्तविक व्याकरणिक तनाव बना रहता है।
