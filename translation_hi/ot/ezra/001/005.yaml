base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/005.yaml
  text: Then the heads of the fathers’ houses of Judah and Benjamin[a], and the priests and the Levites[b], arose—everyone whose spirit God had stirred—to go up to build the house of Yahweh that is in Jerusalem.
translation:
  language: hi
  text: तब यहूदा और बिन्यामीन के पितृकुलों के मुखिया, याजक और लेवी—वे सब, जिनकी आत्मा को परमेश्वर ने जागृत किया था—उठ खड़े हुए, ताकि वे यरूशलेम जाएँ[a] और वहाँ स्थित यहोवा का भवन[b] बनाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “ऊपर जाएँ”; यरूशलेम की यात्रा के लिए यह प्रचलित अभिव्यक्ति थी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “यहोवा का घर/भवन”; अर्थात मन्दिर।
    reason: clarification
lexical_decisions:
- source_word: וַיָּק֜וּמוּ
  choice: उठ खड़े हुए
  rationale: यह क़ूम के क्रियात्मक और कथात्मक अर्थ को रखता है तथा इसे समय से पहले प्रस्थान के अर्थ में नहीं बदलता।
- source_word: רָאשֵׁ֣י הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पैतृक वंश पर आधारित सामाजिक इकाइयों और उनके नेतृत्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִיהוּדָה֙ וּבִנְיָמִ֔ן
  choice: यहूदा और बिन्यामीन के
  rationale: यहाँ ל दिशा नहीं, बल्कि गोत्रीय सम्बद्धता बताता है।
- source_word: וְהַכֹּהֲנִ֖ים וְהַלְוִיִּ֑ם
  choice: याजक और लेवी
  rationale: दोनों धार्मिक और वंशगत समूहों के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित पद हैं।
- source_word: לְכֹ֨ל הֵעִ֤יר הָאֱלֹהִים֙ אֶת רוּח֔וֹ
  choice: अर्थात वे सभी जिनकी आत्मा को परमेश्वर ने प्रेरित किया था
  rationale: वितरणात्मक वाक्य-विन्यास और परमेश्वर द्वारा भीतर से सक्रिय किए जाने का भाव सुरक्षित रहता है; 'प्रेरित' यहाँ उकसाने या जागृत करने के अर्थ में है, न कि किसी विशिष्ट पारिभाषिक सिद्धान्त के अर्थ में।
- source_word: לַעֲל֣וֹת
  choice: यरूशलेम जाकर
  rationale: हिन्दी में गन्तव्य के साथ यह स्वाभाविक है; फुटनोट मूल के शाब्दिक 'ऊपर जाने' को सुरक्षित रखता है।
- source_word: לִבְנ֔וֹת
  choice: बनाएँ
  rationale: मूल में सामान्य क्रिया 'बनाना' है; प्रसंगगत रूप से सही होने पर भी 'फिर से बनाएँ' को मुख्य पाठ में नहीं जोड़ा गया।
- source_word: בֵּ֥ית יְהוָ֖ה
  choice: यहोवा के भवन
  rationale: यह 'घर/भवन' की मूल उपमा और परमेश्वर के निजी नाम दोनों को बनाए रखता है; यहाँ भवन से आशय मन्दिर है।
- source_word: אֲשֶׁ֥ר בִּירוּשָׁלִָֽם
  choice: वहाँ स्थित
  rationale: सापेक्ष उपवाक्य भवन का स्थान बताता है; यह खण्ड यरूशलेम को पहले स्पष्ट किए गए गन्तव्य से स्वाभाविक रूप से जोड़ता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार-अक्षरीय निजी नाम सीधे आया है। हिन्दी पाठकों के लिए स्थापित रूप 'यहोवा' उस नाम को सामान्य उपाधि 'प्रभु' से अलग रखता है।
- issue: הֵעִיר הָאֱלֹהִים אֶת רוּחוֹ में परमेश्वर की प्रेरक क्रिया
  choice: जिनकी आत्मा को परमेश्वर ने प्रेरित किया था
  alternative: जिन्हें परमेश्वर ने मन में उभारा था; जिनकी आत्मा को परमेश्वर ने जागृत किया था
  rationale: यह अनुवाद आन्तरिक मानवीय प्रत्युत्तर और उसके परमेश्वर-जनित कारण दोनों को रखता है, पर क्रिया की किसी विशेष धार्मिक या मनोवैज्ञानिक प्रक्रिया को निर्धारित नहीं करता।
- issue: לִבְנוֹת में पुनर्निर्माण को स्पष्ट करना
  choice: बनाएँ
  alternative: फिर से बनाएँ
  rationale: ऐतिहासिक प्रसंग पुनर्निर्माण का है, किन्तु इस पद की हिब्रू क्रिया में 'फिर से' स्पष्ट नहीं है; इसलिए मुख्य पाठ मूल की संक्षिप्तता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य-पाठक-सुलभ शैली अपनाई गई है। 'पितृकुल', 'याजक' और 'लेवी' स्रोत की सामाजिक-धार्मिक संरचना को बनाए रखते हैं। वाक्य के मध्य का स्पष्टीकरण डैशों में रखा गया है ताकि मूल का वितरणात्मक बल स्पष्ट रहे।
