base_translation:
  language: en
  yaml_path: translation/ot/ezra/001/006.yaml
  text: And all those around them strengthened their hands with vessels of silver[a], with gold, with goods, with livestock, and with precious things[b], besides all that was freely offered.
translation:
  language: hi
  text: और उनके आस-पास के सभी लोगों ने चाँदी के पात्र, सोना, सामान, पशुधन और बहुमूल्य वस्तुएँ देकर उनके हाथ मज़बूत किए[a]; और यह उस सब के अतिरिक्त था जो स्वेच्छा से अर्पित किया गया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी मुहावरे का अर्थ है, “उन्होंने उनकी सहायता की।”
    reason: lexical_alternative
  - marker: b
    text: या “हर स्वेच्छा-भेंट के अतिरिक्त।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סְבִיבֹתֵיהֶם
  choice: उनके आस-पास के सभी लोग
  rationale: यह आसपास रहने वालों को दर्शाता है, पर उन्हें अनिवार्य रूप से औपचारिक अर्थ में ‘पड़ोसी’ नहीं ठहराता।
- source_word: חִזְּקוּ בִידֵיהֶם
  choice: उनके हाथ मज़बूत किए
  rationale: इब्रानी मुहावरे को सुरक्षित रखा गया है; संदर्भ में इसका अर्थ वस्तुएँ देकर व्यावहारिक सहायता करना है।
- source_word: בִּכְלֵי כֶסֶף
  choice: चाँदी के पात्र
  rationale: כְּלִי का अर्थ पात्र, वस्तु या उपकरण हो सकता है; दान की बहुमूल्य वस्तुओं की सूची में ‘पात्र’ उपयुक्त है।
- source_word: בַּזָּהָב
  choice: सोना
  rationale: मूल पाठ में स्वतंत्र रूप से धातु का उल्लेख है, इसलिए ‘सोने की वस्तुएँ’ जोड़ना आवश्यक नहीं है।
- source_word: בָּרְכוּשׁ
  choice: सामान
  rationale: यह चल संपत्ति या माल को सूचित करता है; ‘सामान’ सहज है और भूमि-संपत्ति का संकेत नहीं देता।
- source_word: וּבַבְּהֵמָה
  choice: पशु
  rationale: यह सामूहिक रूप से पालतू पशुधन को दर्शाता है; सामान्य हिंदी में ‘पशु’ स्पष्ट और स्वाभाविक है।
- source_word: וּבַמִּגְדָּנוֹת
  choice: बहुमूल्य वस्तुएँ
  rationale: यह शब्द मूल्यवान या उत्तम उपहारों, और कभी-कभी स्वादिष्ट पदार्थों, को दर्शा सकता है; व्यापक अर्थ को बनाए रखने के लिए यह चयन किया गया है।
- source_word: לְבַד
  choice: के अतिरिक्त
  rationale: यह पहले गिनाई गई सहायता के अलावा और भी दिए जाने का भाव व्यक्त करता है।
- source_word: עַל כָּל הִתְנַדֵּב
  choice: स्वेच्छा से दी गई भेंटों
  rationale: נדב का आत्मवाचक रूप स्वेच्छापूर्वक देने का भाव रखता है; संक्षिप्त इब्रानी को हिंदी में स्पष्ट करने के लिए कर्मवाच्य रूप लिया गया है।
