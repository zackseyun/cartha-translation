base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/008.yaml
  text: Let it be known to the king that we went to the province of Judah[a], to the house of the great God. It is being built with great stones, and timber is being laid in the walls[b]. This work is being done diligently and is prospering in their hands.
translation:
  language: hi
  text: राजा को यह मालूम हो कि हम यहूदा प्रान्त में महान परमेश्वर के भवन में गए। वह बड़े-बड़े पत्थरों से बनाया जा रहा है, और दीवारों में लकड़ी लगाई जा रही है। यह काम बड़ी तत्परता से किया जा रहा है[a] और उनके हाथों सफल हो रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सावधानी से,” अथवा सम्भवतः “तेज़ी से।” अरामी क्रियाविशेषण का ठीक भाव विवादित है, पर इससे स्पष्ट है कि काम प्रभावी ढंग से आगे बढ़ रहा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא
  choice: यह मालूम हो
  rationale: यह राजकीय प्रशासनिक सूचना का औपचारिक सूत्र है; हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: לִיהוּד מְדִינְתָּא
  choice: यहूदा प्रान्त में
  rationale: מְדִינְתָּא फ़ारसी साम्राज्य के प्रशासनिक प्रान्त को दर्शाता है।
- source_word: לְבֵית אֱלָהָא רַבָּא
  choice: महान परमेश्वर के भवन में
  rationale: शाब्दिक 'भवन/घर' को बनाए रखता है; प्रसंग में यह मन्दिर है, पर अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: אֶבֶן גְּלָל
  choice: बड़े-बड़े पत्थरों से
  rationale: वाक्यांश विशाल निर्माण-पत्थरों की ओर संकेत करता है; 'बड़े-बड़े' आधुनिक हिन्दी में आकार का भाव स्पष्ट करता है।
- source_word: וְאָע מִתְּשָׂם בְּכֻתְלַיָּא
  choice: और दीवारों में लकड़ी लगाई जा रही है
  rationale: निर्माण-सन्दर्भ में लकड़ी को दीवारों के भीतर रखने/जोड़ने की जारी क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: אָסְפַּרְנָא
  choice: बड़ी तत्परता से
  rationale: इस विवादित क्रियाविशेषण का भाव सावधानी, लगन अथवा शीघ्रता हो सकता है; 'तत्परता' प्रभावी और सक्रिय प्रगति को बिना केवल गति तक सीमित किए व्यक्त करती है।
- source_word: וּמַצְלַח בְּיֶדְהֹם
  choice: उनके हाथों सफलतापूर्वक आगे बढ़ रहा है
  rationale: मूल के 'उनके हाथ में/द्वारा सफल हो रहा है' मुहावरे को बनाए रखते हुए स्वाभाविक हिन्दी में जारी सफलता व्यक्त की गई है।
