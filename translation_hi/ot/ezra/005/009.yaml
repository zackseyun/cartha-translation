base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/009.yaml
  text: 'Then we asked those elders and said to them as follows: “Who gave you a decree to build this house and to complete this structure?”[a][b]'
translation:
  language: hi
  text: तब हमने उन बुज़ुर्गों से पूछा और उनसे इस प्रकार कहा, “किसने तुम्हें यह भवन बनाने और इस संरचना को पूरा करने का आदेश दिया?”[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह घर और यह संरचना”; यहाँ “घर” से मन्दिर अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: “संरचना” के लिए प्रयुक्त अरामी शब्द भवन के निर्मित भाग, उसकी संरचना या उससे जुड़े निर्माण को अधिक विशेष रूप से दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी क्रियाविशेषण वृत्तांत में घटनाक्रम की अगली कड़ी बताता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: שְׁאֵלְנָא
  choice: हमने ... पूछा
  rationale: यह पूछताछ को व्यक्त करने वाला सामान्य क्रियापद है; ‘पूछा’ प्रशासनिक संदर्भ में भी स्पष्ट है।
- source_word: לְשָׂבַיָּא אִלֵּךְ
  choice: उन पुरनियों से
  rationale: यह पहले उल्लिखित यहूदी अगुओं की ओर संकेत करता है। ‘पुरनिये’ बाइबलीय संदर्भ में समुदाय के मान्य वरिष्ठ अगुओं को व्यक्त करता है।
- source_word: כְּנֵמָא אֲמַרְנָא לְּהֹם
  choice: उनसे इस प्रकार कहा
  rationale: यह आगे आने वाले प्रत्यक्ष कथन का परिचय देता है और मूल की दोहरी अभिव्यक्ति—पूछना और कहना—को बनाए रखता है।
- source_word: מַן
  choice: किसने
  rationale: यह अधिकार देने वाले व्यक्ति या पक्ष के विषय में प्रश्न करने वाला सर्वनाम है।
- source_word: שָׂם לְכֹם טְעֵם
  choice: तुम्हें ... राजाज्ञा दी
  rationale: टְעֵם शाही-प्रशासनिक संदर्भ में आदेश या राजकीय निर्णय को दर्शाता है; यहाँ ‘राजाज्ञा’ उस आधिकारिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: בַּיְתָא דְנָה
  choice: यह भवन
  rationale: शाब्दिक अर्थ ‘यह घर’ है और संदर्भ में मन्दिर अभिप्रेत है। ‘भवन’ मूल के व्यापक रूप को रखते हुए हिन्दी में मन्दिर-निर्माण के संदर्भ में स्वाभाविक है।
- source_word: לְמִבְנְיָה
  choice: बनाने
  rationale: मूल क्रिया सामान्यतः निर्माण करना बताती है; संदर्भ पुनर्निर्माण का है, पर इस पद में ‘फिर से’ स्पष्ट नहीं है।
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: इस ढाँचे
  rationale: दुर्लभ अरामी संज्ञा भवन की संरचना, निर्मित भाग या ढाँचे की ओर संकेत कर सकती है; ‘ढाँचा’ इस शब्दगत अनिश्चितता को पर्याप्त रूप से बनाए रखता है।
- source_word: לְשַׁכְלָלָה
  choice: पूरा करने
  rationale: यह निर्माण-कार्य को पूर्णता तक पहुँचाने का अर्थ देता है; ‘पूरा करने’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
