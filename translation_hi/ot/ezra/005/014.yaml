base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/014.yaml
  text: Also[a], the gold and silver vessels of the house of God, which Nebuchadnezzar had taken out from the temple that was in Jerusalem and brought them to the temple of Babylon—Cyrus the king took them out from the temple of Babylon and gave them to one named Sheshbazzar, whom he had appointed governor.
translation:
  language: hi
  text: और परमेश्वर के भवन के सोने और चाँदी के पात्र भी, जिन्हें नबूकदनेस्सर यरूशलेम के मंदिर से निकालकर बाबेल के मंदिर में ले आया था—उन्हें राजा कुस्र ने बाबेल के मंदिर से निकालकर शेशबस्सर[a] नामक व्यक्ति को दे दिया, जिसे उसने राज्यपाल नियुक्त किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “और उन्हें शेशबस्सर को—यही उसका नाम था—दे दिया, जिसे उसने राज्यपाल बनाया था।”'
    reason: अरामी नामकरण-सूत्र שְׁמֵהּ और שָׂמֵהּ के अधिक रूपनिष्ठ अनुवाद को सुरक्षित रखना।
