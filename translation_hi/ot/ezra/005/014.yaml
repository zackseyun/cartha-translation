- source_word: וְהֵיבֵל הִמּוֹ
  choice: ले आया था
  rationale: क्रिया और बहुवचन कर्मवाचक सर्वनाम का अर्थ समेटता है; ‘पात्र’ कर्म हिन्दी में सापेक्ष उपवाक्य से स्पष्ट रहता है।
- source_word: כּוֹרֶשׁ מַלְכָּא
  choice: राजा कुस्र
  rationale: मानक हिन्दी नाम-क्रम और प्रचलित बाइबलीय नाम-रूप।
- source_word: וִיהִיבוּ לְשֵׁשְׁבַּצַּר שְׁמֵהּ
  choice: शेशबस्सर नामक व्यक्ति को दे दिया
  rationale: ‘उसका नाम शेशबस्सर’ वाली अरामी पहचान-सूत्र को अर्थहानि के बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פֶחָה
  choice: राज्यपाल
  rationale: फ़ारसी प्रशासनिक पद का स्पष्ट और आधुनिक हिन्दी प्रतिशब्द।
- source_word: שָׂמֵהּ
  choice: नियुक्त किया था
  rationale: पद पर स्थापित करने का आधिकारिक भाव और मुख्य क्रिया से पहले की कार्रवाई दोनों व्यक्त होते हैं।
