base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/003.yaml
  text: 'At that time Tattenai[a], the governor of Beyond the River[c][b], and Shethar-bozenai and their associates came to them and spoke thus to them: “Who gave you a decree to build this house and to complete this structure?”'
translation:
  language: hi
  text: उसी समय नदी के उस पार के प्रदेश[a] का राज्यपाल तत्तनै, शेतर-बोज्नै और उनके साथी उनके पास आए और उनसे इस प्रकार कहा, “तुम्हें यह भवन बनाने और इस ढाँचे[b] को पूरा करने का आदेश किसने दिया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नदी के उस पार का प्रदेश” फ़ारसी साम्राज्य में फरात नदी के पश्चिम के क्षेत्र का प्रशासनिक नाम था।
    reason: cultural_note
  - marker: b
    text: यहाँ प्रयुक्त अरामी शब्द का ठीक अर्थ अनिश्चित है; इसका अर्थ निर्माण-कार्य, दीवार या ढाँचा भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּהּ זִמְנָא
  choice: उसी समय
  rationale: यह अरामी कालवाचक अभिव्यक्ति कथा के उसी समय चल रहे प्रसंग को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֲתָא עֲלֵיהוֹן
  choice: उनके पास आए
  rationale: क्रिया और पूर्वसर्ग मिलकर कारीगरों के निकट आने का भाव देते हैं; यह हिन्दी में सहज कथात्मक प्रयोग है।
- source_word: תַּתְּנַי
  choice: तत्तनै
  rationale: व्यक्तिनाम का अरामी रूप से देवनागरी लिप्यंतरण किया गया है।
- source_word: פַּחַת עֲבַר נַהֲרָה
  choice: महानद के पार के प्रदेश का राज्यपाल
  rationale: פַּחַת प्रांतीय राज्यपाल को दर्शाता है और עֲבַר נַהֲרָה फ़ारसी प्रशासन में फरात के पश्चिमी क्षेत्र का नाम था; 'महानद' बाइबलीय संदर्भ में फरात के लिए स्वाभाविक है और पादटिप्पणी भौगोलिक अर्थ स्पष्ट करती है।
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: शतर्बोजनै
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: וּכְנָוָתְהוֹן
  choice: और उनके साथी
  rationale: यह उन लोगों के साथ जुड़े सहयोगियों या सहकर्मियों के लिए व्यापक और सहज हिन्दी पद है।
- source_word: וְכֵן אָמְרִין לְהֹם
  choice: और उनसे इस प्रकार कहा
  rationale: प्रत्यक्ष कथन का औपचारिक परिचय सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַן שָׂם לְכֹם טְעֵם
  choice: तुम्हें ... आज्ञा किसने दी
  rationale: Imperial Aramaic में טְעֵם आधिकारिक आदेश या राजाज्ञा का बोध करा सकता है; प्रश्नात्मक हिन्दी वाक्य में 'आज्ञा दी' स्रोत के भाव को सहजता से व्यक्त करता है।
- source_word: בַּיְתָא דְנָה לִבְנֵא
  choice: यह भवन बनाने
  rationale: '''भवन'' स्रोत के ''घर'' को बनाए रखता है, जबकि संदर्भ में मंदिर का संकेत स्पष्ट है; क्रिया में अनावश्यक रूप से ''फिर से'' नहीं जोड़ा गया।'
- source_word: וְאֻשַּׁרְנָא דְנָה
  choice: इस ढाँचे
  rationale: अरामी संज्ञा का ठीक आशय अनिश्चित है और वह निर्माण, दीवार या संरचनात्मक ढाँचे को सूचित कर सकती है; 'ढाँचा' इस अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: לְשַׁכְלָלָה
  choice: पूरा करने
  rationale: क्रिया निर्माण-कार्य को समाप्त या पूर्ण करने का अर्थ देती है; 'पूरा करना' सामान्य और स्पष्ट हिन्दी है।
