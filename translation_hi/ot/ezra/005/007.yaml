base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/007.yaml
  text: 'They sent a report to him[b][a], and this was what was written in it: “To Darius the king: all peace.”'
translation:
  language: hi
  text: 'उन्होंने उसे एक आधिकारिक संदेश[a] भेजा, जिसमें यह लिखा था: “राजा दारा के नाम: पूर्ण कुशल-मंगल हो।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक प्रतिवेदन,” “एक पत्र” या “एक दस्तावेज़।” अरामी शब्द किसी आधिकारिक संदेश या लिखित सूचना को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “सारी शांति।” यह पूर्ण शांति, कुशलता और मंगल की कामना करने वाला औपचारिक पत्रीय अभिवादन है।
    reason: cultural_note
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: आधिकारिक संदेश
  rationale: यह राजकीय प्रशासन के संदर्भ में भेजे गए लिखित संदेश, प्रतिवेदन या दस्तावेज़ को सूचित कर सकता है। ‘आधिकारिक संदेश’ अर्थ की व्यापकता और प्रशासनिक स्वर दोनों बनाए रखता है।
- source_word: שְׁלַחוּ
  choice: उन्होंने ... भेजा
  rationale: पएल पूर्णकाल, तृतीय पुरुष बहुवचन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: עֲלוֹהִי
  choice: उसे
  rationale: שׁלח के साथ यहाँ על तथा प्रत्यय प्राप्तकर्ता की ओर दिशा व्यक्त करते हैं।
- source_word: וְכִדְנָה כְּתִיב בְּגַוֵּהּ
  choice: जिसमें यह लिखा था
  rationale: मूल के ‘और इस प्रकार उसके भीतर लिखा था’ का सहज हिन्दी रूप, जो दस्तावेज़ की विषयवस्तु का परिचय देता है।
- source_word: לְדָרְיָוֶשׁ מַלְכָּא
  choice: राजा दारा के नाम
  rationale: पत्र के संबोधन में לְ प्राप्तकर्ता को चिह्नित करता है; यह हिन्दी पत्र-शैली में स्वाभाविक है।
- source_word: שְׁלָמָא כֹלָּא
  choice: पूर्ण कुशल-मंगल हो
  rationale: यह औपचारिक पत्रीय अभिवादन संपूर्ण शांति और कुशलता की कामना व्यक्त करता है। ‘पूर्ण’ כֹלָּא की तीव्रतासूचक शक्ति को और ‘कुशल-मंगल’ अभिवादन के आशय को स्पष्ट करता है।
