base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/017.yaml
  text: And now[a], if it seems good to the king, let a search be made in the royal treasury there in Babylon, whether it is so that a decree was issued by King Cyrus to rebuild this house of God in Jerusalem[b]; and let the king send to us his pleasure concerning this matter.
translation:
  language: hi
  text: और अब, यदि राजा को अच्छा लगे, तो बाबेल में स्थित राजकीय भंडार-गृह में खोज की जाए कि क्या राजा कुस्रू ने यरूशलेम में परमेश्वर के इस भवन के निर्माण की आज्ञा दी थी[a]। फिर राजा इस विषय में अपना निर्णय हमें भेजे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से बनाने।” अरामी क्रिया का सीधा अनुवाद “बनाने” है; “फिर से बनाने” में पुनर्स्थापना का ऐतिहासिक संदर्भ व्यक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी इच्छा” अथवा “अपनी अभिलाषा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְעַן
  choice: और अब
  rationale: यह अरामी वाक्य-संयोजक पिछले निवेदन से निष्कर्षात्मक अनुरोध की ओर ले जाता है; ‘और अब’ इसके संयोजक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הֵן עַל מַלְכָּא טָב
  choice: यदि राजा को अच्छा लगे
  rationale: यह विनम्र राजकीय शैली का मुहावरा है; चुना हुआ रूप सम्मानपूर्ण और आधुनिक हिन्दी में सहज है।
- source_word: יִתְבַּקַּר
  choice: खोज की जाए
  rationale: रूप का निष्क्रिय, अनुरोधात्मक भाव अभिलेखीय खोज के संदर्भ में स्पष्ट रूप से व्यक्त होता है।
- source_word: בְּבֵית גִּנְזַיָּא דִּי מַלְכָּא
  choice: राजकीय भंडार-गृह में
  rationale: शाब्दिक अर्थ ‘राजा का भंडारों का घर’ है; यह स्थान धन-संपदा के साथ राजकीय दस्तावेज रखने का स्थल भी हो सकता था। ‘भंडार-गृह’ मूल बिंब को बचाता है।
- source_word: תַמָּה דִּי בְּבָבֶל
  choice: बाबेल में वहाँ के
  rationale: यह राजकीय भंडार-गृह का स्थान निर्दिष्ट करता है और अरामी के स्थानवाचक बल को बनाए रखता है।
- source_word: הֵן אִיתַי דִּי
  choice: कि क्या
  rationale: खोज का विषय यह सत्यापित करना है कि ऐसी राजाज्ञा वास्तव में दी गई थी या नहीं; हिन्दी में ‘कि क्या’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן כּוֹרֶשׁ מַלְכָּא שִׂים טְעֵם
  choice: राजा कुस्रू ने ... आज्ञा दी थी
  rationale: שִׂים טְעֵם आधिकारिक आदेश या निर्णय जारी करने को दर्शाता है। सक्रिय हिन्दी वाक्य मूल कर्ता को स्पष्ट रखते हुए सहज है।
- source_word: לְמִבְנֵא
  choice: बनाने
  rationale: क्रिया का सीधा अर्थ ‘बनाना’ है। पुनर्स्थापना का प्रसंग ‘फिर से बनाने’ का अर्थ संभव बनाता है, जिसे पादटिप्पणी में दिया गया है।
- source_word: בֵּית אֱלָהָא דֵךְ
  choice: परमेश्वर के इस भवन को
  rationale: ‘भवन’ मूल ‘घर’ की मंदिर-संदर्भित गरिमा और अर्थ को स्वाभाविक हिन्दी में रखता है; संकेतवाचक ‘इस’ भी सुरक्षित है।
- source_word: וּרְעוּת מַלְכָּא
  choice: राजा ... अपना निर्णय
  rationale: רְעוּת का अर्थ इच्छा, अभिलाषा या राजकीय निर्णय हो सकता है। यहाँ खोज के परिणाम पर अपेक्षित आधिकारिक उत्तर के कारण ‘निर्णय’ संदर्भ में स्पष्ट है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: עַל דְּנָה יִשְׁלַח עֲלֵינָא
  choice: इस विषय में ... हमें भेजे
  rationale: यह राजकीय उत्तर भेजने के विनम्र अनुरोध को व्यक्त करता है; ‘इस विषय में’ प्रशासनिक संदर्भ को स्पष्ट करता है।
