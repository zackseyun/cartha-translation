source:
  edition: WLC
  text: אֱדַ֨יִן֙ שֵׁשְׁבַּצַּ֣ר דֵּ֔ךְ אֲתָ֗א יְהַ֧ב אֻשַּׁיָּ֛/א דִּי בֵ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירוּשְׁלֶ֑ם וּ/מִן אֱדַ֧יִן וְ/עַד כְּעַ֛ן מִתְבְּנֵ֖א וְ/לָ֥א שְׁלִֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/016.yaml
  text: Then this Sheshbazzar came and laid the foundations of the house of God that is in Jerusalem[a]; and from then until now it has been being built[b], but it is not finished.
translation:
  language: hi
  text: तब यह शेशबज्जर आया और उसने यरूशलेम में परमेश्वर के भवन की नींव रखी[a]। तब से अब तक उसका निर्माण होता आ रहा है[b], पर वह अभी पूरा नहीं हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “नींवें स्थापित कीं।” अरामी मुहावरे का अक्षरशः अर्थ “नींवें दीं” है।
    reason: lexical_alternative
  - marker: b
    text: या “वह बनाया जा रहा है।” अरामी क्रिया चल रही कर्मवाच्य प्रक्रिया को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी क्रियाविशेषण कथा में घटनाओं का क्रम बताता है; ‘तब’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: שֵׁשְׁבַּצַּר דֵּךְ
  choice: यह शेशबस्सर
  rationale: नाम का लिप्यंतरण किया गया है और דֵּךְ की संकेतवाचक शक्ति को ‘यह’ से सुरक्षित रखा गया है, क्योंकि संदर्भ में उसी पहले उल्लिखित व्यक्ति की ओर संकेत है।
- source_word: אֲתָא
  choice: आया
  rationale: सरल कथात्मक क्रिया का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: יְהַב אֻשַּׁיָּא
  choice: नींव रखी
  rationale: अरामी मुहावरे का शाब्दिक अर्थ ‘नींवें दीं’ है, पर निर्माण के संदर्भ में ‘नींव रखी’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: בֵית אֱלָהָא
  choice: परमेश्वर का भवन
  rationale: स्रोत के ‘परमेश्वर के घर/भवन’ को बनाए रखता है; ‘मन्दिर’ कहना संदर्भतः सही होते हुए भी अधिक व्याख्यात्मक होता।
- source_word: דִּי בִירוּשְׁלֶם
  choice: यरूशलेम में
  rationale: स्थानसूचक सम्बन्धवाक्य को हिन्दी में संक्षिप्त और स्वाभाविक ढंग से भवन के साथ जोड़ा गया है।
- source_word: וּמִן אֱדַיִן וְעַד כְּעַן
  choice: तब से अब तक
  rationale: नींव रखे जाने के समय से वक्ता के वर्तमान तक की अवधि को स्पष्ट रूप से व्यक्त करता है।
- source_word: מִתְבְּנֵא
  choice: उसका निर्माण होता आ रहा है
  rationale: अरामी रूप की कर्मवाच्य और जारी प्रक्रिया को व्यक्त करता है तथा अतीत से वर्तमान तक की निरन्तरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְלָא שְׁלִם
  choice: पर वह अभी पूरा नहीं हुआ है
  rationale: वक्ता के वर्तमान समय तक भवन के अपूर्ण रहने को स्पष्ट करता है; ‘पर’ पूर्ववर्ती निर्माण-प्रक्रिया के साथ निहित विरोध को सहज बनाता है।
