base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/012.yaml
  text: Therefore[a], because our fathers provoked the God of heaven to wrath, he gave them into the hand of Nebuchadnezzar king of Babylon, the Chaldean[c][b], and he destroyed this house and carried the people away to Babylon.
translation:
  language: hi
  text: इसलिए[a] कि हमारे पूर्वजों ने स्वर्ग के परमेश्वर को क्रोधित किया, उसने उन्हें बाबेल के राजा, कसदी नबूकदनेस्सर के हाथ में सौंप दिया; और उसने इस भवन[b] को ढा दिया और लोगों को बाबेल निर्वासित कर दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस कारण’।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् मन्दिर। अरामी में शाब्दिक रूप से ‘यह घर’ है।
    reason: cultural_note
  - marker: c
    text: या, ‘लोगों को बंदी बनाकर बाबेल ले गया’। क्रिया लोगों को देश से निकालकर निर्वासन में ले जाने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָהֵן מִן דִּי
  choice: परन्तु क्योंकि
  rationale: लָהֵן यहाँ पिछले कथन के विपरीत मोड़ लाता है और מִן דִּי कारण बताता है। इसलिए संयुक्त पदबंध को स्वाभाविक हिन्दी में ‘परन्तु क्योंकि’ किया गया है; लָהֵן का परिणामसूचक अर्थ भी सम्भव है।
- source_word: הַרְגִּזוּ
  choice: क्रोधित किया
  rationale: רגז का कारक रूप परमेश्वर को क्रोध दिलाने या भड़काने का भाव देता है। ‘क्रोधित किया’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: אֲבָהֳתַנָא
  choice: हमारे पूर्वजों
  rationale: शाब्दिक अर्थ ‘हमारे पिता’ है, पर यहाँ सामूहिक पुरखों का उल्लेख है; आधुनिक हिन्दी में ‘पूर्वज’ अधिक स्पष्ट है।
- source_word: לֶאֱלָהּ שְׁמַיָּא
  choice: स्वर्ग के परमेश्वर
  rationale: यह निर्वासनोत्तर काल में परमेश्वर की प्रचलित उपाधि है और अरामी संरचना का सीधा हिन्दी रूप है।
- source_word: יְהַב הִמּוֹ בְּיַד
  choice: उसने उन्हें ... के हाथ में कर दिया
  rationale: यह किसी को दूसरे की सत्ता में सौंपने का बाइबलीय मुहावरा है। हिन्दी रूप मूल के प्रत्यक्ष कर्तृत्व और ‘हाथ’ की छवि दोनों को बनाए रखता है।
- source_word: נְבוּכַדְנֶצַּר מֶלֶךְ בָּבֶל כסדיא
  choice: बाबेल के राजा नबूकदनेस्सर कसदी
  rationale: כסדיא एकवचन में नबूकदनेस्सर के लिए समानाधिकरण जातिवाचक पद है; इसलिए ‘कसदी’ रखा गया, न कि व्याख्यात्मक ‘बेबीलोनी’।
- source_word: וּבַיְתָה דְנָה
  choice: इस भवन
  rationale: मूल शब्द का अर्थ ‘घर/भवन’ है और प्रसंग में यह मन्दिर को सूचित करता है। ‘भवन’ हिन्दी में स्वाभाविक रहते हुए मूल की शब्दावली को ‘मन्दिर’ में स्पष्ट करके नहीं बदलता।
- source_word: סַתְרֵהּ
  choice: ढा दिया
  rationale: क्रिया किसी इमारत को गिराने या ध्वस्त करने का बोध देती है; ‘ढा दिया’ संरचना के विनाश को सजीव और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְעַמָּה הַגְלִי לְבָבֶל
  choice: लोगों को निर्वासित करके बाबेल ले गया
  rationale: कारक क्रिया גלה लोगों को देश से निकालकर निर्वासन में ले जाने का अर्थ देती है। यह रूप निर्वासन और गन्तव्य दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय न्याय में प्रत्यक्ष कर्तृत्व
  choice: उसने उन्हें ... के हाथ में कर दिया
  alternative: उसने उन्हें ... के हाथ में पड़ने दिया
  rationale: मूल पाठ परमेश्वर को सौंपने की क्रिया का प्रत्यक्ष कर्ता बताता है। केवल अनुमति का भाव जोड़ना न्याय-वचन को नरम कर देता।
- issue: परमेश्वर के भवन की शब्दावली
  choice: इस भवन
  alternative: इस मन्दिर
  rationale: सन्दर्भ निस्सन्देह मन्दिर का है, फिर भी मूल में ‘घर/भवन’ है। मुख्य पाठ में उसी व्यापक रूपक को रखा और पादटिप्पणी में आशय स्पष्ट किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘पूर्वज’, ‘क्रोधित किया’ और ‘निर्वासित करके’ जैसे प्रचलित शब्द रखे गए हैं; साथ ही ‘स्वर्ग के परमेश्वर’ तथा ‘हाथ में कर दिया’ से मूल की बाइबलीय अभिव्यक्ति सुरक्षित रहती है।
