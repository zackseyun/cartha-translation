  text: וְ/עֵ֣ין אֱלָהֲ/הֹ֗ם הֲוָת֙ עַל שָׂבֵ֣י יְהוּדָיֵ֔/א וְ/לָא בַטִּ֣לוּ הִמּ֔וֹ עַד טַעְמָ֖/א לְ/דָרְיָ֣וֶשׁ יְהָ֑ךְ וֶ/אֱדַ֛יִן יְתִיב֥וּן נִשְׁתְּוָנָ֖/א עַל דְּנָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/005.yaml
  text: But the eye of their God was on the elders of the Jews[a], and they did not make them stop until a decree should go to Darius[c][b]; then they would send back a letter concerning this matter.
translation:
  language: hi
  text: परन्तु उनके परमेश्वर की आँख यहूदियों के बुज़ुर्गों पर थी[a], और अधिकारियों ने उन्हें तब तक नहीं रुकवाया, जब तक कोई आदेश दारा के पास न पहुँचे[b]; फिर वे इस विषय में एक पत्र भेजें[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके परमेश्वर की दृष्टि यहूदियों के बुज़ुर्गों पर थी” या “उन पर निगाह रखे हुए थी।”
    reason: ‘आँख ... पर थी’ मूल का मानवरूपी रूपक है; वैकल्पिक अनुवाद उसके निगरानी के भाव को व्यक्त करता है।
  - marker: b
    text: या, “जब तक कोई निर्णय दारा के पास न पहुँचे” या “जब तक कोई आदेश दारा के पास न जाए।”
    reason: अरामी טַעְמָא प्रशासनिक संदर्भ में निर्णय, आदेश, या राजकीय फरमान सूचित कर सकता है।
  - marker: c
    text: या, “फिर वे इस विषय में लिखित उत्तर भेजें” या “फिर वे इस विषय के बारे में एक पत्र लौटाकर भेजें।”
    reason: यְתִיבוּן का अर्थ लौटाना/भेजना या उत्तर देना हो सकता है; נִשְׁתְּוָנָא एक आधिकारिक पत्र अथवा लिखित संप्रेषण है।
lexical_decisions:
- source_word: וְעֵין אֱלָהֲהֹם הֲוָת עַל
  choice: परन्तु उनके परमेश्वर की आँख ... पर लगी हुई थी
  rationale: विपरीत परिस्थिति को दिखाने के लिए וְ को प्रसंगानुसार ‘परन्तु’ किया गया है। ‘आँख’ के ठोस रूपक और ‘उनके’ प्रत्यय को बनाए रखा गया है; ‘लगी हुई थी’ आधुनिक हिन्दी में निगरानी/संरक्षण का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂבֵי יְהוּדָיֵא
  choice: यहूदी बुज़ुर्गों
  rationale: שָׂבֵי समुदाय के मान्य बुज़ुर्गों को दर्शाता है। ‘बुज़ुर्ग’ आधुनिक पाठक के लिए ‘पुरनिए’ से अधिक सहज है और केवल सामान्य ‘अगुए’ कहने की अपेक्षा मूल अर्थ के निकट रहता है।
- source_word: וְלָא בַטִּלוּ הִמּוֹ
  choice: इसलिए अधिकारियों ने उन्हें काम बंद करने के लिए मजबूर नहीं किया
  rationale: पाएल रूप का कारक भाव—उनसे काम रुकवाना—स्पष्ट किया गया है। कर्ता प्रसंग से पूर्ववर्ती अधिकारी हैं; हिन्दी में अस्पष्ट दोहरे ‘वे/उन्हें’ से बचने के लिए ‘अधिकारियों’ को स्पष्ट किया गया है। ‘इसलिए’ परमेश्वर की निगरानी और अधिकारियों के न रोकने के बीच प्रसंगगत परिणाम को स्वाभाविक बनाता है।
- source_word: עַד טַעְמָא לְדָרְיָוֶשׁ יְהָךְ
  choice: जब तक कि यह मामला दारा के पास न पहुँच जाए
  rationale: טַעְמָא प्रशासनिक प्रसंग में मामला, निर्णय या आदेश सूचित कर सकता है। ‘मामला ... पहुँच जाए’ दारा को किए जाने वाले लंबित संदर्भ को सहज हिन्दी में रखता है और किसी एक प्रशासनिक अर्थ को अनावश्यक रूप से अंतिम नहीं बनाता।
- source_word: וֶאֱדַיִן יְתִיבוּן נִשְׁתְּוָנָא עַל דְּנָה
  choice: और फिर इस विषय में लिखित उत्तर न आ जाए
  rationale: נִשְׁתְּוָנָא आधिकारिक लिखित पत्र है और יְתִיבוּן लौटाने/उत्तर देने का भाव रखता है। हिन्दी में ‘लिखित उत्तर आ जाए’ उस प्रशासनिक आदान-प्रदान को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर की निगरानी का मानवरूपी वर्णन
  choice: मुख्य पाठ में ‘उनके परमेश्वर की आँख ... पर लगी हुई थी’ रूपक बनाए रखा गया है।
  alternative: ‘उनका परमेश्वर यहूदी बुज़ुर्गों की देखभाल कर रहा था।’
  rationale: मूल पाठ परमेश्वर की संरक्षणकारी निगरानी को ठोस ‘आँख’ के रूपक से व्यक्त करता है। इसे ‘देखभाल’ में बदलना अर्थ स्पष्ट करता, पर साहित्यिक छवि और उसकी खुली अर्थ-व्याप्ति घटा देता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरनिए’ के स्थान पर ‘बुज़ुर्ग’ चुना गया है। मुख्य पाठ में मूल का ‘आँख’ रूपक रखा गया है, जबकि कठिन प्रशासनिक वाक्यांशों की वास्तविक अनिश्चितता पादटिप्पणियों में दी गई है।
