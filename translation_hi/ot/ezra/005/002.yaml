id: EZR.5.2
reference: Ezra 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: בֵּ/אדַ֡יִן קָ֠מוּ זְרֻבָּבֶ֤ל בַּר שְׁאַלְתִּיאֵל֙ וְ/יֵשׁ֣וּעַ בַּר יֽוֹצָדָ֔ק וְ/שָׁרִ֣יו לְ/מִבְנֵ֔א בֵּ֥ית אֱלָהָ֖/א דִּ֣י בִ/ירֽוּשְׁלֶ֑ם וְ/עִמְּ/ה֛וֹן נביאי/א דִֽי אֱלָהָ֖/א מְסָעֲדִ֥ין לְ/הֽוֹן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/002.yaml
  text: Then Zerubbabel son of Shealtiel and Jeshua son of Jozadak arose and began to build the house of God that is in Jerusalem[a], and with them were the prophets of God[c][b], supporting them.
translation:
  language: hi
  text: तब शालतीएल के पुत्र जरुब्बाबेल और योसादाक के पुत्र येशू[a] उठे और यरूशलेम में परमेश्वर का भवन[b] बनाने लगे। परमेश्वर के भविष्यद्वक्ता उनके साथ थे और उनकी सहायता कर रहे थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ नाम का रूप ‘येशू’ है; अन्य स्थानों पर इससे संबंधित विस्तृत रूप ‘यहोशू’ मिलता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘परमेश्वर का मंदिर।’ अरामी में शाब्दिक रूप से ‘परमेश्वर का घर’ है।
    reason: lexical_alternative
  - marker: c
    text: या ‘उनका साथ दे रहे थे।’ मूल कृदन्त सक्रिय सहायता या सहयोग का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक संकेत अगले घटनाक्रम का आरम्भ करता है; ‘तब’ स्वाभाविक रूप से क्रमिक प्रगति व्यक्त करता है।
- source_word: קָמוּ
  choice: उठे
  rationale: मूल क्रिया का अर्थ ‘उठना/खड़ा होना’ है और यहाँ किसी कार्य को दृढ़ता से आरम्भ करने का भाव भी है।
- source_word: זְרֻבָּבֶל בַּר שְׁאַלְתִּיאֵל
  choice: शालतीएल के पुत्र जरुब्बाबेल
  rationale: अरामी בַּר को सीधे ‘के पुत्र’ से व्यक्त किया गया और नामों का देवनागरी लिप्यंतरण किया गया।
- source_word: יֵשׁוּעַ בַּר יוֹצָדָק
  choice: योसादाक के पुत्र येशू
  rationale: स्रोत में नाम का संक्षिप्त रूप יֵשׁוּעַ है; इसे संबंधित विस्तृत रूप ‘यहोशू’ में बदलने के बजाय ‘येशू’ रखा गया है।
- source_word: וְשָׁרִיו לְמִבְנֵא
  choice: और ... बनाने लगे
  rationale: שׁרי आरम्भ करने और לְמִבְנֵא बनाने का बोध देता है; संयुक्त हिंदी मुहावरा ‘बनाने लगे’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֵּית אֱלָהָא
  choice: परमेश्वर का भवन
  rationale: शाब्दिक अर्थ ‘परमेश्वर का घर/भवन’ है। गरिमापूर्ण हिंदी में ‘भवन’ मूल रूपक को बनाए रखता है और संदर्भ में मंदिर को सूचित करता है।
- source_word: דִּי בִירוּשְׁלֶם
  choice: यरूशलेम में
  rationale: संबंधवाचक पदबंध भवन का स्थान बताता है; हिंदी में इसे संक्षेप और स्वाभाविक रूप से स्थानवाचक पदबंध में रखा गया है।
- source_word: נביאיא די אלהא
  choice: परमेश्वर के भविष्यद्वक्ता
  rationale: यह स्रोत के संबंधसूचक पदबंध का सीधा और प्रचलित हिंदी रूप है।
- source_word: מְסָעֲדִין לְהוֹן
  choice: उनकी सहायता कर रहे थे
  rationale: कृदन्त निरंतर सक्रिय सहयोग का भाव देता है; ‘सहायता कर रहे थे’ उस सक्रिय और जारी समर्थन को स्पष्ट रखता है।
theological_decisions:
- issue: בֵּית אֱלָהָא का अभिप्राय
  choice: मुख्य पाठ में ‘परमेश्वर का भवन’
  alternative: ‘परमेश्वर का मंदिर’
  rationale: स्रोत का शाब्दिक पद ‘परमेश्वर का घर/भवन’ है। ‘मंदिर’ संदर्भानुकूल व्याख्या है, पर मुख्य पाठ में मूल बिंब को बनाए रखा गया है।
- issue: יֵשׁוּעַ नाम का रूप
  choice: येशू
  alternative: यहोशू
  rationale: स्रोत में संक्षिप्त नाम-रूप יֵשׁוּעַ है। उसे विस्तृत संबंधित रूप में बदलने के बजाय पाठगत रूप सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। वाक्य को दो भागों में बाँटकर पठनीयता बढ़ाई गई है, जबकि घटनाक्रम, सहभागी भविष्यद्वक्ताओं और उनके सक्रिय सहयोग का मूल संबंध सुरक्षित रखा गया है।
