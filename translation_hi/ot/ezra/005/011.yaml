source:
  edition: WLC
  text: וּ/כְנֵ֥מָא פִתְגָמָ֖/א הֲתִיב֣וּ/נָא לְ/מֵמַ֑ר אֲנַ֣חְנָא הִמּ֡וֹ עַבְדוֹ/הִי֩ דִֽי אֱלָ֨הּ שְׁמַיָּ֜/א וְ/אַרְעָ֗/א וּ/בָנַ֤יִן בַּיְתָ/א֙ דִּֽי הֲוָ֨א בְנֵ֜ה מִ/קַּדְמַ֤ת דְּנָה֙ שְׁנִ֣ין שַׂגִּיאָ֔ן וּ/מֶ֤לֶךְ לְ/יִשְׂרָאֵל֙ רַ֔ב בְּנָ֖/הִי וְ/שַׁכְלְלֵֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/011.yaml
  text: 'And this is the answer they returned to us[a], saying: We are the servants of the God of heaven and earth, and we are rebuilding the house that was built many years ago[b], which a great king of Israel built and completed.'
translation:
  language: hi
  text: 'और उन्होंने हमें यह उत्तर दिया[a]: “हम आकाश और पृथ्वी के परमेश्वर के सेवक हैं, और उस भवन को फिर से बना रहे हैं[b], जो बहुत वर्ष पहले बनाया गया था और जिसे इस्राएल के एक महान राजा ने बनाकर पूरा किया था।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो संदेश उन्होंने हमें लौटाया, वह यह था।”
    reason: פִתְגָם का अर्थ ‘संदेश’ भी हो सकता है और הֲתִיבוּנָא में ‘हमें लौटाया’ की शाब्दिक छवि है।
  - marker: b
    text: या, “बना रहे हैं”; अरामी कृदन्त जारी क्रिया बताता है। “फिर से बना रहे हैं” प्रसंग से स्पष्ट करता है कि यह भवन पहले भी अस्तित्व में था।
    reason: मुख्य पाठ में प्रसंगानुकूल पुनर्निर्माण स्पष्ट किया गया है, पर मूल की अपेक्षाकृत व्यापक अभिव्यक्ति भी सम्भव है।
lexical_decisions:
- source_word: וּכְנֵמָא פִתְגָמָא הֲתִיבוּנָא
  choice: और उन्होंने हमें यह उत्तर दिया
  rationale: पूरा अरामी वाक्यांश उत्तर की विषयवस्तु का परिचय देता है। यह हिन्दी में स्वाभाविक है और פִתְגָם के ‘वचन/संदेश/उत्तर’ अर्थों में प्रसंगानुकूल ‘उत्तर’ को व्यक्त करता है।
- source_word: לְמֵמַר
  choice: इसके बाद प्रत्यक्ष कथन
  rationale: अरामी में यह उद्धरण आरम्भ करने वाला मानक पद है। हिन्दी में अलग से ‘कहते हुए’ जोड़ने पर वाक्य बोझिल होता, इसलिए कोलन और प्रत्यक्ष कथन से इसका कार्य व्यक्त किया गया है।
- source_word: עַבְדוֹהִי
  choice: सेवक
  rationale: यहाँ शब्द परमेश्वर के प्रति सेवा और अधीनता का परिचय देता है; ‘दास’ सम्भव है, पर आधुनिक हिन्दी में वह अनावश्यक रूप से बंधुआ दासता पर बल दे सकता है।
- source_word: אֱלָהּ שְׁמַיָּא וְאַרְעָא
  choice: आकाश और पृथ्वी के परमेश्वर
  rationale: यह उपाधि परमेश्वर की सार्वभौम प्रभुता व्यक्त करती है। ‘आकाश’ आधुनिक हिन्दी में सहज है और अरामी बहुवचन रूप का अर्थ स्वाभाविक ढंग से देता है।
- source_word: וּבָנַיִן
  choice: और ... फिर से बना रहे हैं
  rationale: कृदन्त चल रही निर्माण-क्रिया बताता है। ‘फिर से’ प्रसंग में नष्ट हो चुके पुराने भवन के पुनर्निर्माण को स्पष्ट करता है, जबकि मूल रूप अपने आप में केवल ‘बना रहे हैं’ भी हो सकता है।
- source_word: בַּיְתָא
  choice: भवन
  rationale: मूल अर्थ ‘घर/भवन’ है और प्रसंग में मन्दिर अभिप्रेत है। ‘भवन’ स्रोत की अभिव्यक्ति को बनाए रखते हुए आधुनिक पाठक के लिए उपयुक्त है।
- source_word: מִקַּדְמַת דְּנָה שְׁנִין שַׂגִּיאָן
  choice: बहुत वर्ष पहले
  rationale: शाब्दिक अर्थ ‘इससे पहले, बहुत वर्ष’ है; हिन्दी में यह काल-सूचना सहज और स्पष्ट रूप में व्यक्त होती है।
- source_word: וּמֶלֶךְ לְיִשְׂרָאֵל רַב
  choice: इस्राएल के एक महान राजा
  rationale: यह सुलैमान का नाम लिए बिना उसकी महानता या प्रतिष्ठा बताता है। ‘महान’ רַב का प्रसंगानुकूल अर्थ है।
- source_word: בְּנָהִי וְשַׁכְלְלֵהּ
  choice: बनाकर पूरा किया था
  rationale: दोनों क्रियाएँ निर्माण करने और उसे पूर्णता तक पहुँचाने को अलग-अलग व्यक्त करती हैं; संयुक्त हिन्दी क्रियारूप इस क्रम को स्वाभाविक रखता है।
theological_decisions:
- issue: साम्राज्यिक पत्राचार में परमेश्वर की उपाधि
  choice: आकाश और पृथ्वी के परमेश्वर
  alternative: आकाशों और पृथ्वी के परमेश्वर
  rationale: उपाधि को सीधे और सार्वभौम दावे के रूप में रखा गया है; इसे किसी स्थानीय देवता के अर्थ तक सीमित नहीं किया गया।
- issue: निर्माण बनाम पुनर्निर्माण
  choice: फिर से बना रहे हैं
  alternative: बना रहे हैं
  rationale: ऐतिहासिक और निकटवर्ती प्रसंग पुनर्निर्माण का है, इसलिए मुख्य पाठ में यह स्पष्ट किया गया है; फिर भी अरामी कृदन्त में ‘फिर से’ प्रत्यक्षतः नहीं है, अतः विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज शैली। ‘परमेश्वर’, ‘सेवक’ और ‘भवन’ सामान्य बाइबलीय हिन्दी से परिचित हैं, पर अत्यधिक संस्कृतनिष्ठ नहीं। प्रत्यक्ष कथन को स्पष्ट करने के लिए उद्धरण-चिह्न और कोलन का प्रयोग किया गया है।
