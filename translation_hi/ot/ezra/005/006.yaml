  text: This is a copy of the letter that Tattenai[a], the governor of Beyond the River, and Shethar-bozenai and his associates, the officials who were in Beyond the River, sent to King Darius.
translation:
  language: hi
  text: यह उस पत्र की प्रतिलिपि है जिसे नदी-पार प्रदेश के राज्यपाल तत्तनै, शेतर-बोजनै और उसके सहयोगियों—अर्थात् वे अधिकारी[a] जो नदी-पार प्रदेश में थे—ने राजा दारा को भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अफरसकी”; यदि इस शब्द को अधिकारियों की पदवी के बजाय किसी जाति अथवा प्रशासनिक समूह का नाम माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: פַּרְשֶׁגֶן
  choice: प्रतिलिपि
  rationale: यह शब्द किसी लिखित दस्तावेज़ की नकल या प्रति को दर्शाता है; आधिकारिक पत्र के संदर्भ में ‘प्रतिलिपि’ सटीक और स्वाभाविक है।
- source_word: אִגַּרְתָּא
  choice: पत्र
  rationale: यह आधिकारिक लिखित संदेश है; आधुनिक हिन्दी में ‘पत्र’ स्पष्ट और गरिमापूर्ण है।
- source_word: שְׁלַח
  choice: भेजा था
  rationale: क्रिया पत्र भेजने की सामान्य क्रिया व्यक्त करती है; हिन्दी वाक्य-क्रम और वर्णनात्मक संदर्भ में पूर्ण भूतकाल स्वाभाविक है।
- source_word: תַּתְּנַי
  choice: तत्तनै
  rationale: व्यक्तिवाचक नाम का अरामी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: פַּחַת
  choice: राज्यपाल
  rationale: फ़ारसी प्रशासनिक संदर्भ में यह प्रांतीय शासक या गवर्नर का पद है; ‘राज्यपाल’ सामान्य हिन्दी पाठक के लिए सुबोध है।
- source_word: עֲבַר נַהֲרָה
  choice: महानद-पार
  rationale: यह फ़ारसी साम्राज्य में फ़रात के पश्चिम के प्रशासनिक क्षेत्र का पदनाम है। ‘महानद-पार’ नाम-सदृश रूप बनाए रखता है और केवल साधारण भौगोलिक वर्णन नहीं लगता।
- source_word: וּשְׁתַר בּוֹזְנַי
  choice: शतर्बोजनै
  rationale: व्यक्तिवाचक नाम का स्रोत के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּכְנָוָתֵהּ
  choice: और उसके सहकर्मियों
  rationale: संज्ञा संबद्ध साथियों को दर्शाती है और एकवचन प्रत्यय ‘उसके’ के रूप में सुरक्षित है; प्रशासनिक प्रसंग में ‘सहकर्मी’ उपयुक्त है।
- source_word: אֲפַרְסְכָיֵא
  choice: अधिकारियों
  rationale: दुर्बोध पद को प्रसंगानुसार कार्यात्मक अर्थ में दिया गया है, पर वैकल्पिक जातीय या प्रशासनिक पहचान को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל
  choice: के पास
  rationale: ‘भेजना’ क्रिया के साथ पत्र के प्राप्तकर्ता को आधुनिक हिन्दी में ‘के पास’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּרְיָוֶשׁ מַלְכָּא
  choice: राजा दारा
  rationale: राजकीय उपाधि और नाम को स्वाभाविक आधुनिक हिन्दी क्रम में रखा गया है।
