- source_word: וּבֵית אֱלָהָא
  choice: और परमेश्वर का भवन
  rationale: मूल की ‘परमेश्वर का घर/भवन’ वाली उपमा को बनाए रखते हुए ‘भवन’ मंदिर के निर्माण के संदर्भ में स्वाभाविक है।
- source_word: יִתְבְּנֵא
  choice: फिर से बनाया जाए
  rationale: क्रिया का मूल अर्थ ‘बनाया जाए’ है; विनाश के बाद बहाली के ऐतिहासिक संदर्भ में ‘फिर से’ पुनर्निर्माण का आशय स्पष्ट करता है।
- source_word: עַל אַתְרֵהּ
  choice: अपने स्थान पर
  rationale: अरामी पद का अर्थ उस भवन के अपने मूल अथवा उचित स्थान पर निर्माण होना है; हिन्दी में ‘अपने स्थान पर’ इस संबंध को सहज रूप से व्यक्त करता है।
