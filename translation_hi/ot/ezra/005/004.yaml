  text: 'Then we told them this: “What are the names of the men who are building this building?”[a]'
translation:
  language: hi
  text: तब हमने उनसे इस प्रकार कहा, “उन पुरुषों के नाम क्या हैं जो इस भवन को बना रहे हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह काल-सूचक क्रियाविशेषण कथा में अगली घटना को प्रस्तुत करता है; ‘तब’ स्वाभाविक और सटीक है।
- source_word: כְּנֵמָא
  choice: इस प्रकार
  rationale: इसका अर्थ ‘इस रीति से/इस प्रकार’ है और यह आगे आने वाले प्रत्यक्ष कथन की औपचारिक किंतु सहज भूमिका बनाता है।
- source_word: אֲמַרְנָא לְּהֹם
  choice: हमने उनसे ... कहा
  rationale: मूल क्रिया का अर्थ ‘कहना’ है। प्रश्न होने के बावजूद ‘पूछा’ के बजाय ‘कहा’ रखने से स्रोत की शब्दावली सुरक्षित रहती है।
- source_word: מַן אִנּוּן שְׁמָהָת
  choice: नाम क्या हैं
  rationale: प्रश्न व्यक्तियों की पहचान के बारे में है, पर उसका व्याकरणिक केंद्र ‘नाम’ है; आधुनिक हिन्दी में ‘नाम क्या हैं’ स्वाभाविक है।
- source_word: גֻּבְרַיָּא
  choice: पुरुषों
  rationale: अरामी शब्द स्पष्ट रूप से पुरुषवाचक है; इसलिए लिंग-निरपेक्ष ‘लोगों’ के बजाय ‘पुरुषों’ चुना गया है।
- source_word: דִּי
  choice: जो
  rationale: यह सम्बन्धवाचक अव्यय ‘पुरुषों’ को जारी निर्माण-कार्य से जोड़ता है।
- source_word: דְנָה בִנְיָנָא
  choice: इस भवन
  rationale: प्रदर्शनवाचक और संज्ञा का सहज हिन्दी रूप; ‘भवन’ निर्माणाधीन संरचना को स्पष्ट करता है।
- source_word: בָּנַיִן
  choice: बना रहे हैं
  rationale: कृदन्त जारी क्रिया व्यक्त करता है; हिन्दी का अपूर्ण वर्तमान रूप इस पक्ष को ठीक से दर्शाता है।
