lexical_decisions:
- source_word: בְּרַם
  choice: परन्तु
  rationale: यह अरामी विरोधसूचक शब्द पिछले कथन के विपरीत स्थिति की ओर मोड़ता है; ‘परन्तु’ इस संबंध को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בִּשְׁנַת חֲדָה
  choice: राज्य के पहले वर्ष में
  rationale: यह राजकीय कालगणना का पदबंध है। हिन्दी में ‘राज्य के पहले वर्ष में’ आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְכוֹרֶשׁ מַלְכָּא דִּי בָבֶל
  choice: बाबेल के राजा कुस्रू के राज्य के
  rationale: काल-निर्धारण में नाम से पहले लगा לְ उस राजा के शासन-वर्ष को सूचित करता है; अनुवाद इस संबंध को स्पष्ट करता है और ‘बाबेल’ को स्रोत के अनुरूप रखता है।
- source_word: שָׂם טְעֵם
  choice: राजाज्ञा जारी की
  rationale: शाब्दिक अर्थ ‘आदेश ठहराया/रखा’ है, पर साम्राज्यीय प्रशासनिक प्रसंग में यह आधिकारिक आदेश जारी करने का मुहावरा है। ‘राजाज्ञा’ आदेश के राजकीय स्वरूप को स्पष्ट करती है।
- source_word: בֵּית אֱלָהָא דְנָה
  choice: परमेश्वर के इस भवन
  rationale: स्रोत का शाब्दिक पदबंध ‘परमेश्वर का यह भवन’ है। सन्दर्भ में यह मन्दिर है, फिर भी ‘भवन’ मूल रूपक और शब्दावली को बनाए रखता है।
- source_word: לִבְנֵא
  choice: फिर से बनाने
  rationale: अरामी क्रिया का मूल अर्थ ‘बनाना’ है; नष्ट हुए भवन की बहाली के प्रसंग में ‘फिर से बनाने’ से स्थितिगत आशय स्पष्ट होता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
