  text: וְ/הִתְנַבִּ֞י חַגַּ֣י נביא/ה וּ/זְכַרְיָ֤ה בַר עִדּוֹא֙ נביאי/א עַל יְה֣וּדָיֵ֔/א דִּ֥י בִ/יה֖וּד וּ/בִ/ירוּשְׁלֶ֑ם בְּ/שֻׁ֛ם אֱלָ֥הּ יִשְׂרָאֵ֖ל עֲלֵי/הֽוֹן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/005/001.yaml
  text: Haggai the prophet and Zechariah son of Iddo[a], the prophets, prophesied to the Jews who were in Judah and in Jerusalem[b], in the name of the God of Israel who was over them.
translation:
  language: hi
  text: हाग्गै नबी और इद्दो के पुत्र जकर्याह—ये दोनों नबी—यहूदा और यरूशलेम में रहने वाले यहूदियों को संबोधित करके इस्राएल के परमेश्वर के नाम से भविष्यवाणी की, जो उनके ऊपर था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: शाब्दिक रूप से ‘उन पर’। यह वाक्यांश संभवतः परमेश्वर के उनके ऊपर होने को बताता है; इसे भविष्यवाणी के उन पर आने से जोड़ना भी संभव है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְהִתְנַבִּי
  choice: भविष्यवाणी की
  rationale: अरामी क्रिया कथा की अगली घटना बताती है। संयुक्त कर्ता के साथ हिन्दी में एकवचन क्रिया स्वाभाविक है, क्योंकि दोनों व्यक्तियों को ‘इन नबियों’ के रूप में एक समूह माना गया है। आरम्भिक वाव के लिए अनावश्यक ‘अब’ नहीं जोड़ा गया।
- source_word: חַגַּי נביאה
  choice: हाग्गै नबी
  rationale: नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया और निर्धारित/बलयुक्त रूप को पदनामसूचक ‘नबी’ से व्यक्त किया गया।
- source_word: וּזְכַרְיָה בַר עִדּוֹא
  choice: और इद्दो के पुत्र जकर्याह
  rationale: בַר का सीधा अर्थ ‘पुत्र’ है; नामों के प्रचलित हिन्दी रूप अपनाए गए।
- source_word: נביאיא
  choice: इन नबियों ने
  rationale: दोनों व्यक्तियों का सार बताने वाले बहुवचन समानाधिकरण को छोड़ा नहीं गया; हिन्दी में डैश के बीच रखकर दोहराव को स्पष्ट और स्वाभाविक बनाया गया।
- source_word: עַל יְהוּדָיֵא
  choice: यहूदियों से
  rationale: נבא के साथ עַל यहाँ भविष्यवाणी के श्रोताओं को सूचित करता है, न कि अनिवार्य रूप से उनके विरुद्ध कही गई बात को। ‘यहूदियों’ सामान्य पाठक के लिए परिचित है; भौगोलिक विकल्प फुटनोट में रखा गया।
- source_word: דִּי בִיהוּד וּבִירוּשְׁלֶם
  choice: जो यहूदा और यरूशलेम में रहते थे
  rationale: सम्बन्धवाचक उपवाक्य और दोनों स्थानों को स्पष्ट रखा गया; पुराने नियम के संदर्भ में ‘यहूदा’ उपयुक्त भौगोलिक नाम है।
- source_word: בְּשֻׁם
  choice: के नाम से
  rationale: हिन्दी में यह स्वाभाविक मुहावरा है और किसी की ओर से तथा उसके अधिकार के अधीन बोलने का भाव रखता है; अधिकार वाला अर्थ फुटनोट में स्पष्ट किया गया।
- source_word: אֱלָהּ יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: संबंधसूचक पदसमूह का सीधा और प्रचलित हिन्दी रूप।
- source_word: עֲלֵיהוֹן
  choice: जो उनके ऊपर था
  rationale: शाब्दिक स्थानिक/अधिकारसूचक रूप को बनाए रखा गया और इसे परमेश्वर से जोड़ने के लिए सम्बन्धवाचक उपवाक्य प्रयुक्त हुआ; अधिक व्याख्यात्मक ‘प्रभुता रखता था’ नहीं जोड़ा गया।
theological_decisions:
- issue: अंतिम पद עֲלֵיהוֹן का सम्बन्ध और आशय
  choice: इसे ‘इस्राएल के परमेश्वर’ से जोड़कर ‘जो उनके ऊपर था’ अनूदित किया गया।
  alternative: इसे अधिक संक्षिप्त ‘उन पर’ रखा जा सकता है, या भविष्यवाणी के उन पर आने से जोड़ा जा सकता है।
  rationale: वाक्य-विन्यास में परमेश्वर निकटतम और सर्वाधिक सम्भावित सम्बन्ध है। फिर भी ‘ऊपर’ को ‘शासन करता था’ या ‘रक्षा करता था’ बनाकर धर्मवैचारिक अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया; सम्भव वैकल्पिक सम्बन्ध फुटनोट में सुरक्षित है।
- issue: בְּשֻׁם में नाम और अधिकार का सम्बन्ध
  choice: मुख्य पाठ में ‘परमेश्वर के नाम से’ रखा गया।
  alternative: ‘परमेश्वर के अधिकार से’ सम्भव अर्थानुवाद है।
  rationale: ‘नाम से’ मूल मुहावरे की प्रतिमा और प्रतिनिधिक अधिकार दोनों को बनाए रखता है, जबकि विकल्प उसका आशय स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमामय शैली रखी गई है। ‘नबी’, ‘भविष्यवाणी’, ‘इस्राएल’ और ‘परमेश्वर’ जैसे परिचित बाइबलीय शब्द सामान्य पाठक के लिए स्पष्ट हैं। समानाधिकरण ‘इन नबियों ने’ को डैश से अलग किया गया है ताकि मूल की पुनरुक्त संरचना बनी रहे और हिन्दी वाक्य बोझिल न हो।
