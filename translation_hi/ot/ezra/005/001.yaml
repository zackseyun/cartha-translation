  to: हाग्गै नबी और इद्दो के पुत्र जकर्याह—ये दोनों नबी—यहूदा और यरूशलेम में रहने वाले यहूदियों को संबोधित करके इस्राएल के परमेश्वर के नाम से भविष्यवाणी की, जो उनके ऊपर था।[c]
