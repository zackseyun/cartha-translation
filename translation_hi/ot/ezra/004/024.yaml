  text: בֵּ/אדַ֗יִן בְּטֵלַת֙ עֲבִידַ֣ת בֵּית אֱלָהָ֔/א דִּ֖י בִּ/ירוּשְׁלֶ֑ם וַ/הֲוָת֙ בָּֽטְלָ֔א עַ֚ד שְׁנַ֣ת תַּרְתֵּ֔ין לְ/מַלְכ֖וּת דָּרְיָ֥וֶשׁ מֶֽלֶךְ פָּרָֽס־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/024.yaml
  text: Then the work on the house of God that is in Jerusalem stopped[c][b][a], and it remained stopped until the second year of the reign of Darius king of Persia.
translation:
  language: hi
  text: तब यरूशलेम में परमेश्वर के भवन का काम रुक गया[a][b], और वह रुका रहा[c]—फारस के राजा दारा के शासन के दूसरे वर्ष तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बंद हो गया’ अथवा ‘रोक दिया गया’; अरामी मूल בטל रुकने या बंद होने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘परमेश्वर के मंदिर का।’ मूलतः ‘परमेश्वर का भवन।’
    reason: lexical_alternative
  - marker: c
    text: ‘वह रुका रहा’ लगातार बनी हुई अवस्था को व्यक्त करता है, केवल काम रुकने की बात को दोहराता नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֵּאדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक क्रियाविशेषण पिछले प्रसंग के बाद की घटना को सूचित करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: בְּטֵלַת
  choice: रुक गया
  rationale: अरामी मूल בטל काम के रुकने या बंद हो जाने को व्यक्त करता है। अकर्मक रूप हिन्दी में स्वाभाविक है और कर्तृवाच्य-कर्मवाच्य की स्रोतगत अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: עֲבִידַת
  choice: काम
  rationale: निर्माण का संदर्भ स्पष्ट है, पर मूल में सामान्य संज्ञा ‘काम’ है; इसलिए ‘निर्माण-कार्य’ जोड़ना आवश्यक नहीं।
- source_word: בֵּית אֱלָהָא
  choice: परमेश्वर का भवन
  rationale: यह मूल पदबंध का पारदर्शी अनुवाद है; संदर्भ में इसका अर्थ मंदिर है।
- source_word: דִּי בִּירוּשְׁלֶם
  choice: यरूशलेम में
  rationale: सम्बन्धवाचक स्थान-पदबंध को हिन्दी की स्वाभाविक संज्ञा-रचना में रखा गया है।
- source_word: וַהֲוָת בָּטְלָא
  choice: और वह रुका रहा
  rationale: ‘होना’ तथा בטל के रूप का संयोग लगातार बनी हुई अवस्था बताता है; ‘रुका रहा’ इस कालावधि को स्पष्ट करता है।
- source_word: עַד שְׁנַת תַּרְתֵּין
  choice: दूसरे वर्ष तक
  rationale: यह राजकीय कालगणना के लिए स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: לְמַלְכוּת דָּרְיָוֶשׁ
  choice: दारा के शासन के
  rationale: ‘शासन’ यहाँ राजत्व/राजकाल का स्वाभाविक हिन्दी समतुल्य है।
- source_word: מֶלֶךְ פָּרָס
  choice: फारस के राजा
  rationale: उपाधि को मूल अर्थ और प्रचलित हिन्दी बाइबलीय नाम-रूप के अनुरूप रखा गया है।
