  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘परमेश्वर का भवन’ स्रोत की ठोस अभिव्यक्ति बचाता है, जबकि पादटिप्पणी में संदर्भगत ‘मंदिर’ दिया गया है। विराम-चिह्न द्वारा अंतिम काल-सीमा को स्पष्ट किया गया है।
