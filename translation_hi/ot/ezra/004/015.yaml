base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/015.yaml
  text: so that a search may be made in the book of records of your fathers[a], and you may find in the book of records and know that this city is a rebellious city, harmful to kings and provinces, and that sedition has been made within it from ancient days[b]; for this reason this city was laid waste.
translation:
  language: hi
  text: ताकि आपके पूर्वजों[a] के अभिलेखों की पुस्तक में खोज की जाए, और आप अभिलेखों की पुस्तक में पाएँ और जान लें कि यह नगर एक विद्रोही नगर है, जो राजाओं और प्रान्तों को हानि पहुँचाने वाला है, और इसके भीतर प्राचीन काल से राजद्रोह किया जाता रहा है[b]। इसी कारण यह नगर उजाड़ दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘आपके पिताओं’ है; यहाँ इससे आपके पूर्वज या पूर्ववर्ती शासक भी अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: यह कठिन अरामी पदबंध नगर के भीतर राजद्रोह या विद्रोह किए जाने, अथवा उसे उकसाए जाने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְבַקַּר
  choice: खोज की जाए
  rationale: गहन धातुरूप यहाँ पत्र की विनयात्मक-प्रशासनिक शैली में अवैयक्तिक अनुरोध व्यक्त करता है; हिन्दी कर्मवाच्य उसी औपचारिकता को स्वाभाविक रूप से रखता है।
- source_word: סְפַר דָּכְרָנַיָּא
  choice: अभिलेखों की पुस्तक
  rationale: यह राजकीय लिखित रिकॉर्ड या संग्रह को सूचित करता है; यह अनुवाद पुस्तक की ठोस छवि और अभिलेखीय अर्थ दोनों बनाए रखता है।
- source_word: אֲבָהָתָךְ
  choice: आपके पुरखों
  rationale: शाब्दिक अर्थ ‘आपके पिता’ है, पर प्रसंग में राजा के पूर्वज अथवा पूर्ववर्ती शासक अभिप्रेत हैं; ‘पुरखों’ मूल रूपक को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וּתְהַשְׁכַּח וְתִנְדַּע
  choice: आप ... पाएँगे और जान लेंगे
  rationale: दोनों क्रियाएँ खोज के परिणाम को क्रमशः पाने और निश्चित रूप से जानने के रूप में व्यक्त करती हैं।
- source_word: קִרְיָא מָרָדָא
  choice: विद्रोही नगर
  rationale: यह साम्राज्यिक सत्ता के प्रति नगर की अवज्ञाकारी प्रकृति का आरोप व्यक्त करता है।
- source_word: מְהַנְזְקַת מַלְכִין וּמְדִנָן
  choice: जो राजाओं और प्रान्तों को हानि पहुँचाता रहा है
  rationale: कृदन्त निरन्तर या अभिलाक्षणिक हानि का भाव देता है; ‘प्रान्त’ साम्राज्यिक प्रशासनिक क्षेत्रों के लिए स्पष्ट पद है।
- source_word: אֶשְׁתַּדּוּר עָבְדִין
  choice: राजद्रोह भड़काया जाता रहा है
  rationale: दुर्बोध अरामी पदबंध नगर के भीतर विद्रोह या राजद्रोह को उकसाने/खड़ा करने की गतिविधि बताता है; यह हिन्दी में उस प्रशासनिक आरोप को स्पष्ट रखते हुए उसकी क्रियात्मकता बचाता है।
- source_word: מִן יוֹמָת עָלְמָא
  choice: प्राचीन काल से
  rationale: यह ऐतिहासिक प्राचीनता का मुहावरा है, दार्शनिक अर्थ में अनन्तता का नहीं।
- source_word: הָחָרְבַת
  choice: उजाड़ दिया गया था
  rationale: हाफ़ेल कर्मवाच्य नगर के विनष्ट अथवा उजाड़े जाने को बताता है; पूर्ण भूतकाल पूर्व घटना को स्पष्ट करता है।
