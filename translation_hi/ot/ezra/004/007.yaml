base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/007.yaml
  text: And in the days of Artaxerxes[a], Bishlam, Mithredath, Tabeel, and the rest of his associates wrote to Artaxerxes king of Persia[b]. The text of the letter was written in Aramaic and translated from Aramaic.
translation:
  language: hi
  text: अर्तक्षत्र के दिनों में बिशलाम, मिथ्रदात, ताबेल और उसके बाकी साथियों[a] ने फ़ारस के राजा अर्तक्षत्र को पत्र लिखा। पत्र का पाठ अरामी में लिखा गया था और अरामी में अनुवादित था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके बाकी साथियों।” मूल में प्रत्यय एकवचन रूप में है, लेकिन वह पूरे समूह को सामूहिक रूप से भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पत्र का पाठ अरामी लिपि में लिखा गया था और अरामी भाषा में प्रस्तुत किया गया था।” मूल शब्द कठिन हैं। कुछ विद्वान यहाँ अरामी लिपि और अरामी भाषा के बीच भेद देखते हैं, जबकि दूसरे इसे लेखन और अनुवाद या व्याख्या के रूप में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִימֵי
  choice: के दिनों में
  rationale: यह समय-सूचक इब्रानी मुहावरे का निकट और स्वाभाविक हिन्दी रूप है; इसे तकनीकी रूप से ‘के शासनकाल में’ कहकर अधिक स्पष्ट नहीं किया गया।
- source_word: אַרְתַּחְשַׁשְׂתָּא
  choice: अर्तक्षत्र
  rationale: राजा Artaxerxes के लिए हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: כָּתַב ... עַל
  choice: को पत्र लिखा
  rationale: मूल क्रिया का अर्थ ‘लिखा’ है और प्रशासनिक प्रसंग में עַל लेख के संबोधित व्यक्ति को दर्शाता है। अगले वाक्य में पत्र का स्पष्ट उल्लेख होने के कारण हिन्दी में ‘पत्र लिखा’ स्वाभाविक है; ‘आरोप लिखा’ जैसी प्रसंगगत बात नहीं जोड़ी गई।
- source_word: בִּשְׁלָם מִתְרְדָת טָבְאֵל
  choice: बिशलाम, मिथ्रदात, ताबेल
  rationale: व्यक्तिगत नामों का देवनागरी लिप्यंतरण।
- source_word: וּשְׁאָר כנותו
  choice: और उसके बाकी साथियों
  rationale: שְׁאָר का अर्थ ‘बाकी/शेष’ और कठिन संज्ञा का अर्थ ‘साथी/सहयोगी’ लिया गया है। प्रत्यय के एकवचन रूप को मुख्य पाठ में ‘उसके’ से बनाए रखा गया है, जबकि सामूहिक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: מֶלֶךְ פָּרָס
  choice: फ़ारस के राजा
  rationale: राजकीय उपाधि का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: וּכְתָב הַנִּשְׁתְּוָן
  choice: वह पत्र
  rationale: यह पद लिखित दस्तावेज़ या पत्र को सूचित करता है। हिन्दी में ‘वह पत्र’ संदर्भ को स्पष्ट रखते हुए अनावश्यक पुनरुक्ति से बचाता है।
- source_word: כָּתוּב אֲרָמִית וּמְתֻרְגָּם אֲרָמִית
  choice: अरामी लिपि में लिखा गया और अरामी भाषा में प्रस्तुत किया गया था
  rationale: दो बार आए ‘अरामी’ और כתב तथा מתרגם के भेद को लिपि और भाषा के रूप में व्यक्त किया गया है। कठिन मूल वाक्यांश की वैकल्पिक, अधिक शाब्दिक समझ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: अंतिम वाक्यांश में लिपि, भाषा और अनुवाद का संबंध
  choice: मुख्य पाठ में ‘अरामी लिपि’ और ‘अरामी भाषा में प्रस्तुत’
  alternative: ‘अरामी में लिखा गया और अरामी में अनुवाद किया गया’
  rationale: मूल शब्दावली कठिन है और दोनों बार ‘अरामी’ कहती है। मुख्य रूप संभावित लिपि-भाषा भेद को पठनीय बनाता है, पर वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है ताकि वास्तविक अस्पष्टता दबे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। प्रचलित बाइबलीय नाम-रूप अपनाए गए हैं; प्रशासनिक वाक्य को सहज बनाने के लिए ‘पत्र लिखा’ कहा गया है। कठिन अंतिम पद की अस्पष्टता मुख्य पाठ और पादटिप्पणी दोनों के माध्यम से सुरक्षित रखी गई है।
