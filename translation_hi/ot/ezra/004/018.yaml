  text: The document that you sent to us has been read plainly before me[a].
translation:
  language: hi
  text: जो दस्तावेज़[क] तुमने हमें भेजा था, वह मेरे सामने स्पष्ट रूप से पढ़कर सुनाया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “जो पत्र तुमने हमें भेजा था।”
    reason: नִשְׁתְּוָנָא का अर्थ ‘पत्र’ भी हो सकता है, पर ‘दस्तावेज़’ आधिकारिक लिखित संचार के व्यापक अर्थ को बनाए रखता है।
lexical_decisions:
- source_word: נִשְׁתְּוָנָא
  choice: सरकारी पत्र
  rationale: यह साम्राज्यकालीन अरामी शब्द आधिकारिक लिखित संचार को सूचित करता है। प्रसंग में ‘सरकारी पत्र’ स्वाभाविक है और उसके प्रशासनिक स्वरूप को स्पष्ट करता है।
- source_word: דִּי
  choice: जो
  rationale: यह संबंधवाचक अव्यय है; हिन्दी में ‘जो’ से आश्रित उपवाक्य स्वाभाविक रूप से जुड़ता है।
- source_word: שְׁלַחְתּוּן
  choice: तुमने ... भेजा था
  rationale: द्वितीय पुरुष बहुवचन सिद्ध क्रिया है। उत्तर दिए जाने से पहले भेजे जा चुके पत्र के लिए हिन्दी में पूर्ण भूतकाल स्वाभाविक है।
- source_word: עֲלֶינָא
  choice: हमें
  rationale: पत्राचार के इस प्रसंग में इसका अर्थ ‘हमारे पास/हमें’ है, न कि ‘हमारे विरुद्ध’।
- source_word: מְפָרַשׁ
  choice: साफ़-साफ़
  rationale: यह स्पष्ट या भली-भाँति किए गए वाचन का भाव देता है। ‘साफ़-साफ़’ साधारण आधुनिक हिन्दी में स्पष्टता का अर्थ बनाए रखता है, बिना यह तय किए कि अनुवाद या व्याख्या भी की गई थी।
- source_word: קֱרִי
  choice: पढ़कर सुनाया गया है
  rationale: प्रसंग में कर्मवाच्य अर्थ है और राजदरबार में लिखित पत्र का मौखिक वाचन अभिप्रेत है। ‘पढ़कर सुनाया’ हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קָדָמָי
  choice: मेरे सामने
  rationale: यह राजा की उपस्थिति में किए गए कार्य के लिए प्रचलित दरबारी अभिव्यक्ति है।
