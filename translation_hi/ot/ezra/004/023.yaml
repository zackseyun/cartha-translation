base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/023.yaml
  text: Then[a], as soon as the copy of the letter of King Artaxerxes was read before Rehum and Shimshai the scribe and their associates, they went in haste to Jerusalem, to the Jews[b], and made them stop by force and power.
translation:
  language: hi
  text: तब जैसे ही राजा अर्तक्षत्र के पत्र की प्रतिलिपि रहूम, लिपिक शिमशै और उनके साथियों के सामने पढ़ी गई, वे शीघ्रता से यरूशलेम में यहूदियों के पास[a] गए और बल और शक्ति से उन्हें काम रोकने पर विवश कर दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदियों के विरुद्ध”; अरामी संबंधबोधक शत्रुतापूर्ण दिशा का अर्थ भी दे सकता है, जिसकी पुष्टि आगे की कार्रवाई से होती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्हें बाँह और शक्ति से रोक दिया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी कथात्मक क्रियाविशेषण घटनाक्रम में अगली घटना को चिह्नित करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: פַּרְשֶׁגֶן נִשְׁתְּוָנָא
  choice: चिट्ठी की प्रतिलिपि
  rationale: פַּרְשֶׁגֶן प्रतिलिपि या नकल और נִשְׁתְּוָנָא आधिकारिक पत्र को दर्शाता है; यह पदबंध दोनों अर्थों को स्पष्ट रखता है।
- source_word: קֱרִי קֳדָם
  choice: के सामने पढ़ी गई
  rationale: संदर्भ में रूप का भाव कर्मवाच्य है और קֳדָם संबंधित अधिकारियों की उपस्थिति बताता है।
- source_word: רְחוּם וְשִׁמְשַׁי סָפְרָא וּכְנָוָתְהוֹן
  choice: रहूम, शिमशै लेखक और उनके साथी
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है; סָפְרָא के लिए पारदर्शी पद ‘लेखक’ और כְנָוָתְהוֹן के लिए स्वाभाविक ‘साथी’ चुना गया है।
- source_word: אֲזַלוּ בִבְהִילוּ
  choice: शीघ्रता से ... गए
  rationale: यह रचना गति और तत्परता दोनों व्यक्त करती है; हिंदी में यह रूप स्वाभाविक ढंग से दोनों को बनाए रखता है।
- source_word: עַל יְהוּדָיֵא
  choice: यहूदियों के पास
  rationale: עַל यहाँ गमन के लक्ष्य को बता सकता है, किंतु इसका विरोधी भाव भी संभव है; मुख्य पाठ स्वाभाविक स्थानगत अर्थ रखता है और वैकल्पिक शत्रुतापूर्ण अर्थ टिप्पणी में दिया गया है।
- source_word: וּבַטִּלוּ הִמּוֹ
  choice: उन्हें काम रोकने पर विवश कर दिया
  rationale: क्रिया का कारक भाव सुरक्षित है। संदर्भ से निहित ‘काम’ जोड़ने पर आधुनिक हिंदी में आशय स्पष्ट होता है।
- source_word: בְּאֶדְרָע וְחָיִל
  choice: बलपूर्वक
  rationale: शाब्दिक द्विपद ‘बाँह और शक्ति से’ जबरन रोकने का मुहावरा है; ‘बलपूर्वक’ आधुनिक हिंदी में उसी coercive अर्थ को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
