  yaml_path: translation/ot/ezra/004/021.yaml
  text: Now issue a decree to make these men stop[b][a], and this city shall not be rebuilt until a decree is issued by me.
translation:
  language: hi
  text: अब आज्ञा जारी करो कि इन पुरुषों को[a] रोक दिया जाए, और यह नगर तब तक न बनाया जाए जब तक मेरी ओर से आज्ञा जारी न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इन पुरुषों को काम बंद करने के लिए कहा जाए।” अरामी में ‘रोकने/बंद कराने’ का कर्म सीधे “इन पुरुषों” है; यह स्पष्ट नहीं करता कि उन्हें स्वयं रोकना है या उनका काम बंद कराना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: अब
  rationale: यह अरामी क्रियाविशेषण राजा की तत्काल आज्ञा का परिचय देता है; ‘अब’ स्वाभाविक और सीधा है।
- source_word: שִׂימוּ טְּעֵם
  choice: आज्ञा जारी करो
  rationale: शाब्दिक मुहावरा ‘आज्ञा/निर्णय ठहराओ’ है; राजकीय प्रशासनिक संदर्भ में ‘आज्ञा जारी करो’ स्पष्ट और स्वाभाविक है।
- source_word: לְבַטָּלָא גֻּבְרַיָּא אִלֵּךְ
  choice: इन पुरुषों का काम रुकवा दिया जाए
  rationale: क्रिया में रुकवाने का भाव है। संदर्भ के अनुसार आशय पुरुषों के निर्माण-कार्य को रोकना है; ‘काम’ जोड़ने से हिन्दी में यह भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: וְקִרְיְתָא דָךְ לָא תִתְבְּנֵא
  choice: और ... यह नगर फिर से न बनाया जाए
  rationale: मूल के संयोजक और कर्मवाच्य निषेध को बनाए रखा गया है। संदर्भ में पहले उजड़े नगर के निर्माण की बात होने के कारण ‘फिर से’ पुनर्निर्माण का भाव स्पष्ट करता है।
- source_word: עַד מִנִּי טַעְמָא יִתְּשָׂם
  choice: जब तक मेरी ओर से आज्ञा जारी न हो
  rationale: शाब्दिक अर्थ ‘जब तक मेरी ओर से आज्ञा न ठहराई जाए’ है। यह चयन मूल की कर्मवाच्य रचना और आज्ञा के राजा से आने—दोनों को सुरक्षित रखता है।
