base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/006.yaml
  text: And in the reign of Ahasuerus[a], at the beginning of his reign, they wrote an accusation against the inhabitants of Judah and Jerusalem.
translation:
  language: hi
  text: और अहश्वेरोश के राज्यकाल में, उसके शासन के आरम्भ में, उन्होंने यहूदा और यरूशलेम के निवासियों के विरुद्ध एक आरोप[a] लिखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शिकायत” अथवा “विरोधपूर्ण औपचारिक आरोप।” इब्रानी शब्द में औपचारिक आरोप के रूप में व्यक्त विरोध का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְ/מַלְכוּת
  choice: और ... के राज्यकाल में
  rationale: संयोजक और पूर्वसर्ग सहित यह पद राजा के शासन की समयावधि बताता है। ‘राज्यकाल में’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: אֲחַשְׁוֵרוֹשׁ
  choice: अहश्वेरोश
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण रखा गया है; ऐतिहासिक पहचान के आधार पर इसे ‘क्षयर्ष’ या ‘ज़र्क्सीस’ से नहीं बदला गया।
- source_word: בִּ/תְחִלַּת מַלְכוּת/וֹ
  choice: उसके शासन के आरम्भ में
  rationale: यह रचना उसके शासन की प्रारम्भिक अवधि को दर्शाती है। पुनरुक्ति को बोझिल होने से बचाने के लिए दूसरी बार ‘राज्यकाल’ के स्थान पर अर्थ-समान ‘शासन’ रखा गया है।
- source_word: כָּתְבוּ
  choice: उन्होंने ... लिखा
  rationale: क्रिया का सीधा अर्थ ‘लिखा’ है। इब्रानी में कर्ता स्पष्ट नाम से नहीं दिया गया, इसलिए हिन्दी में भी ‘उन्होंने’ द्वारा उसकी अनिश्चितता बनाए रखी गई है।
- source_word: שִׂטְנָה
  choice: अभियोग
  rationale: यह शब्द विरोध की भावना से किए गए लिखित आरोप या शिकायत का बोध देता है। ‘अभियोग’ प्रशासनिक संदर्भ और औपचारिक आरोप दोनों को व्यक्त करता है, जबकि उसकी संभावित अर्थ-सीमा पादटिप्पणी में दी गई है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: अभियोग के लक्ष्य को दर्शाने के कारण यहाँ ‘के विरुद्ध’ संदर्भानुकूल है।
- source_word: יֹשְׁבֵי יְהוּדָה וִ/ירוּשָׁלִָם
  choice: यहूदा और यरूशलेम के निवासी
  rationale: कृदन्त का संज्ञात्मक प्रयोग वहाँ रहने वाले लोगों को दर्शाता है; ‘निवासी’ इसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
