  yaml_path: translation/ot/ezra/004/005.yaml
  text: And they hired counselors against them to frustrate their plan all the days of Cyrus king of Persia[a], even until the reign of Darius king of Persia.
translation:
  language: hi
  text: और वे उनकी योजना[a] को निष्फल करने के लिए उनके विरुद्ध सलाहकारों को पैसे देकर नियुक्त करते रहे—फ़ारस के राजा कुस्रू के पूरे शासनकाल में और फ़ारस के राजा दारा के शासनकाल तक।
  philosophy: optimal-equivalence
  footnotes:
