- source_word: דָּרְיָוֶשׁ מֶלֶךְ פָּרָס
  choice: फ़ारस के राजा दारा
  rationale: नाम का प्रचलित हिन्दी रूप और उपाधि का स्वाभाविक हिन्दी क्रम रखा गया है।
