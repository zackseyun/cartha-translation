base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/016.yaml
  text: We make known to the king that if this city is rebuilt and its walls are completed[b][a], then because of this you will have no possession in the province Beyond the River.
translation:
  language: hi
  text: हम राजा को सूचित करते हैं कि यदि इस नगर को बनाया जाए और इसकी दीवारें पूरी की जाएँ, तो इसके कारण नदी-पार के प्रदेश में आपका कोई हिस्सा नहीं रहेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हिस्सा” का अर्थ भाग, अंश या अधिकार हो सकता है; इस प्रशासनिक प्रसंग में यह राजस्व में हिस्से का भी संकेत कर सकता है। “नदी-पार” फ़ारसी साम्राज्य में फरात नदी के पश्चिम स्थित प्रशासनिक प्रदेश का नाम था।
    reason: lexical_alternative_and_cultural_note
