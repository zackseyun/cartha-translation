  text: וַ/יֹּאמֶר֩ לָ/הֶ֨ם זְרֻבָּבֶ֜ל וְ/יֵשׁ֗וּעַ וּ/שְׁאָ֨ר רָאשֵׁ֤י הָֽ/אָבוֹת֙ לְ/יִשְׂרָאֵ֔ל לֹֽא לָ֣/כֶם וָ/לָ֔/נוּ לִ/בְנ֥וֹת בַּ֖יִת לֵ/אלֹהֵ֑י/נוּ כִּי֩ אֲנַ֨חְנוּ יַ֜חַד נִבְנֶ֗ה לַֽ/יהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל כַּ/אֲשֶׁ֣ר צִוָּ֔/נוּ הַ/מֶּ֖לֶךְ כּ֥וֹרֶשׁ מֶֽלֶךְ פָּרָֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/003.yaml
  text: But Zerubbabel[a], Jeshua, and the rest of the heads of the fathers’ houses of Israel said to them, “You have no part with us in building a house for our God, for we alone will build it for Yahweh, the God of Israel, just as King Cyrus, the king of Persia[b], commanded us.”
translation:
  language: hi
  text: परन्तु जरुब्बाबेल, येशूअ और इस्राएल के पितृकुलों के बाकी प्रधानों ने उनसे कहा, “हमारे परमेश्वर के लिए भवन[b] बनाने में तुम्हारा हमारे साथ कोई भाग नहीं है, क्योंकि हम ही मिलकर[a] इस्राएल के परमेश्वर याहवे के लिए उसे बनाएँगे, जैसा फारस के राजा कुस्रू ने हमें आज्ञा दी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हम एक साथ बनाएँगे।” प्रसंग में इसका अर्थ है कि वे स्वयं, प्रस्ताव रखनेवालों को साथ लिए बिना, निर्माण करेंगे।
    reason: शब्दगत विकल्प और प्रसंगगत निहितार्थ को स्पष्ट करना।
  - marker: b
    text: यहाँ “भवन” से परमेश्वर का मंदिर अभिप्रेत है।
    reason: प्राचीन संदर्भ में ‘भवन/घर’ के विशेष अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: זְרֻבָּבֶל וְיֵשׁוּעַ
  choice: जरुब्बाबेल, येशूअ
  rationale: व्यक्तिनामों को इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है; יֵשׁוּעַ को अधिक प्रचलित पर भिन्न रूप ‘यहोशू’ में नहीं बदला गया।
- source_word: וּשְׁאָר רָאשֵׁי הָאָבוֹת לְיִשְׂרָאֵל
  choice: इस्राएल के बाकी पितृकुलों के प्रधान
  rationale: यह वाक्यांश कुल अथवा पूर्वज-आधारित परिवारों के नेतृत्व को दर्शाता है; ‘पितृकुलों के प्रधान’ सामाजिक संरचना को संक्षिप्त और स्पष्ट रूप से बनाए रखता है।
- source_word: לֹא לָכֶם וָלָנוּ
  choice: तुम्हारा हमारे साथ कोई भाग नहीं है
  rationale: शाब्दिक रूप अस्पष्ट हो सकता है, जबकि प्रसंग में यह संयुक्त अधिकार अथवा सहभागिता का निषेध है। चुना हुआ हिंदी मुहावरा इस बहिष्करणात्मक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִבְנוֹת בַּיִת לֵאלֹהֵינוּ
  choice: हमारे परमेश्वर के लिए भवन बनाने में
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ मंदिर अभिप्रेत है। मुख्य पाठ में ‘भवन’ स्रोत की रूपकात्मक भाषा बचाता है; संदर्भगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כִּי אֲנַחְנוּ יַחַד נִבְנֶה
  choice: हम ही मिलकर ... बनाएँगे
  rationale: יַחַד का प्रत्यक्ष अर्थ ‘मिलकर/एक साथ’ है। ‘हम ही’ विरोधात्मक प्रसंग में बाहरी प्रस्तावकों को अलग रखता है, जबकि ‘मिलकर’ वास्तविक शब्दार्थ और यहूदी अगुवों की सामूहिक कार्रवाई दोनों को सुरक्षित रखता है।
- source_word: לַיהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर यहवे के लिए
  rationale: יהוה को व्यक्तिगत ईश्वरीय नाम के रूप में ‘यहवे’ दिया गया है; संबंधवाचक हिंदी क्रम स्वाभाविकता के लिए बदला गया है।
- source_word: כַּאֲשֶׁר צִוָּנוּ הַמֶּלֶךְ כּוֹרֶשׁ מֶלֶךְ פָּרָס
  choice: जैसा फारस के राजा कुस्रू ने हमें आज्ञा दी है
  rationale: राजकीय आदेश का बल ‘आज्ञा’ से रखा गया है। इब्रानी में ‘राजा’ की पुनरावृत्ति हिंदी में अप्राकृतिक होने के कारण एक ही राजकीय पदबंध में समाहित की गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। उसे सामान्य उपाधि में बदलने के बजाय आधुनिक हिंदी में निकट लिप्यंतरण दिया गया है।
- issue: יַחַד का विरोधात्मक अर्थ
  choice: हम ही मिलकर
  alternative: केवल हम ही
  rationale: प्रसंग बाहरी समूह को निर्माण से अलग करता है, पर יַחַד का सामान्य अर्थ ‘एक साथ’ है। चुना हुआ रूप बहिष्करण और शब्दगत अर्थ दोनों को रखता है, बजाय इसके कि निहितार्थ को ही पूर्ण अनुवाद बना दिया जाए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक-पाठ योग्य शैली रखी गई है। ‘पितृकुल’, ‘प्रधान’ और ‘आज्ञा’ जैसे शब्द ऐतिहासिक-प्रशासनिक संदर्भ को बनाए रखते हैं, पर वाक्यरचना साधारण पाठक के लिए सहज रखी गई है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
