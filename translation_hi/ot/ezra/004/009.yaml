base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/009.yaml
  text: Then Rehum the commander[a], Shimshai the scribe, and the rest of their associates—the judges, the officials, the Tarpelites, the Persians, the Erechites, the Babylonians, the men of Susa (that is[b], the Elamites)—
translation:
  language: hi
  text: तब रहूम मुख्य अधिकारी, शिमशै लिपिक, और उनके अन्य सहयोगी—दीनाई[a], अफ़रसत्की[b], तर्पेली, फ़ारसी, एरेखी, बेबीलोनी, और शूशन के लोग (अर्थात एलामी)—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “न्यायाधीश।” अरामी शब्द דִּינָיֵא को किसी जातीय समूह का नाम अथवा प्रशासनिक पद समझा जा सकता है। यहाँ इसे लिप्यंतरित किया गया है ताकि अनिश्चितता बनी रहे।
    reason: alternative_reading
  - marker: b
    text: अरामी शब्द אֲפַרְסַתְכָיֵא की पहचान अनिश्चित है। इसे परंपरागत रूप से एक समूह-नाम माना गया है; कुछ इसे अधिकारियों की किसी पदवी के रूप में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: אֱדַיִן
  choice: तब
  rationale: यह अरामी वृत्तांत-सूचक क्रियाविशेषण घटनाक्रम में अगला चरण आरम्भ करता है; ‘तब’ स्वाभाविक और संक्षिप्त है।
- source_word: רְחוּם בְּעֵל טְעֵם
  choice: रहूम मुख्य अधिकारी
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है। विवादित प्रशासनिक पदवी בְּעֵל טְעֵם के लिए ‘मुख्य अधिकारी’ अधिकारपूर्ण सरकारी भूमिका बताता है, पर किसी अत्यधिक विशिष्ट आधुनिक पद को आरोपित नहीं करता।
- source_word: שִׁמְשַׁי סָפְרָא
  choice: शिमशै लिपिक
  rationale: שִׁמְשַׁי व्यक्तिनाम है; סָפְרָא सरकारी लेखन-संबंधी पद है। ‘लिपिक’ आधुनिक हिंदी में समझने योग्य है और ‘शास्त्री’ से उत्पन्न धार्मिक अर्थ को टालता है।
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: उनके बाकी सहयोगियों
  rationale: यह शेष संबद्ध साथियों या सहकर्मियों को सूचित करता है; ‘सहयोगी’ औपचारिक प्रसंग में स्वाभाविक है।
- source_word: דִּינָיֵא
  choice: दीनियों
  rationale: आसपास की सूची मुख्यतः जातीय अथवा स्थान-आधारित समूहों की है, इसलिए अनिश्चित शब्द को समूह-नाम के रूप में लिप्यंतरित किया गया है; ‘न्यायियों’ वाला संभावित प्रशासनिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲפַרְסַתְכָיֵא
  choice: अफ़रसत्कियों
  rationale: शब्द की पहचान अनिश्चित है और जातीय समूहों की सूची में आता है; इसलिए अनुमानित सरकारी पद देने के बजाय पारदर्शी लिप्यंतरण किया गया है।
- source_word: טַרְפְּלָיֵא
  choice: तर्पेलियों
  rationale: अनिश्चित पहचान वाला समूह-नाम है; लिप्यंतरण सबसे सावधान विकल्प है।
- source_word: אֲפָרְסָיֵא
  choice: फ़ारसियों
  rationale: यह स्पष्ट रूप से फ़ारसी लोगों का जातिनाम है।
- source_word: ארכוי
  choice: एरेखियों
  rationale: यह एरेख/ऊरूक से जुड़े लोगों का नाम है; स्थान-आधारित हिंदी रूप रखा गया है।
- source_word: בָבְלָיֵא
  choice: बेबीलोनियों
  rationale: यह बेबीलोन के लोगों का स्पष्ट नाम है।
- source_word: שׁוּשַׁנְכָיֵא דהוא עֵלְמָיֵא
  choice: शूशनियों ने (जो एलामी थे)
  rationale: मूल पाठ शूशन के लोगों की पहचान एलामियों के रूप में करता है। कोष्ठक हिंदी में इस व्याख्यात्मक संबंध को स्पष्ट रखते हैं।
