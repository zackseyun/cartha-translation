base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/012.yaml
  text: Let it be known to the king that the Jews who came up from you to us have come to Jerusalem[a]. They are rebuilding the rebellious and wicked city[b], finishing the walls and repairing the foundations.
translation:
  language: hi
  text: राजा को मालूम हो कि जो यहूदी[a] आपके यहाँ से हमारे यहाँ आए हैं, वे यरूशलेम पहुँच गए हैं। वे उस विद्रोही और दुष्ट नगर को फिर से बना रहे हैं, उसकी शहरपनाह पूरी कर रहे हैं और उसकी नींवों की मरम्मत कर रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया के लोग।” अरामी शब्द यहूदा/यहूदिया के निवासियों के साथ-साथ व्यापक अर्थ में यहूदियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “नींव डाल रहे हैं” अथवा “नींवों को स्थापित कर रहे हैं।” अरामी पद कुछ कठिन है और उसका अर्थ मौजूदा नींवों की मरम्मत करना या उन्हें स्थापित करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: राजा को मालूम हो
  rationale: यह राजकीय पत्राचार में सूचना देने का औपचारिक अरामी सूत्र है; यह हिंदी में संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: יְהוּדָיֵא
  choice: यहूदी
  rationale: यह शब्द यहूदा/यहूदिया के लोगों अथवा व्यापक अर्थ में यहूदियों को सूचित कर सकता है; सामान्य हिंदी में ‘यहूदी’ सबसे परिचित रूप है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: סְלִקוּ מִן לְוָתָךְ עֲלֶינָא אֲתוֹ לִירוּשְׁלֶם
  choice: जो आपके यहाँ से हमारे यहाँ आए हैं, वे यरूशलेम पहुँच गए हैं
  rationale: ‘ऊपर आना’ मूल क्रिया की गति को दर्शाता है, किंतु हिंदी में इस संदर्भ में ‘आए’ अधिक स्वाभाविक है; दूसरी आगमन-क्रिया को ‘पहुँच गए हैं’ से अलग और स्पष्ट रखा गया है।
- source_word: קִרְיְתָא מָרָדְתָּא וּבִאישְׁתָּא
  choice: उस विद्रोही और दुष्ट नगर
  rationale: ये आरोप लगाने वालों के शत्रुतापूर्ण राजनीतिक और नैतिक विशेषण हैं; ‘विद्रोही और दुष्ट’ दोनों का बल बनाए रखता है।
- source_word: בָּנַיִן
  choice: फिर से बना रहे हैं
  rationale: मूल क्रिया सामान्यतः ‘बनाना’ है, पर पहले से विद्यमान यरूशलेम की पुनर्स्थापना के प्रसंग में ‘फिर से बनाना’ आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְשׁוּרַיָּא אֶשְׁכְּלָלוּ
  choice: उसकी शहरपनाह पूरी कर रहे हैं
  rationale: שׁוּרַיָּא नगर की रक्षात्मक दीवारों को और क्रिया उन्हें पूर्ण करने को सूचित करती है; ‘शहरपनाह’ आधुनिक बाइबलीय हिंदी में नगर की किलेबंद दीवार के लिए सटीक है।
- source_word: וְאֻשַּׁיָּא יַחִיטוּ
  choice: उसकी नींवों की मरम्मत कर रहे हैं
  rationale: यह कठिन अरामी पद संरचनात्मक आधार पर किए जा रहे काम को दर्शाता है; पुनर्निर्माण के प्रसंग में ‘मरम्मत’ उपयुक्त है, पर ‘नींव डालना/स्थापित करना’ की संभावना पाद-टिप्पणी में दी गई है।
