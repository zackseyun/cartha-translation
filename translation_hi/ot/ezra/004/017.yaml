base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/017.yaml
  text: 'The king sent a reply to Rehum the commander[a], Shimshai the scribe, and the rest of their associates who live in Samaria, and the rest beyond the River: Peace[c][b]. And now—'
translation:
  language: hi
  text: 'राजा ने प्रशासक रहूम[a], लिपिक शिमशै, सामरिया में रहनेवाले उनके बाकी साथियों और नदी के पार के बाकी लोगों[b] को यह उत्तर भेजा: “शांति![c] और अब—”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुख्य सलाहकार।” अरामी पदवी का ठीक आशय अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: “नदी के पार” फ़ारसी साम्राज्य के उस प्रशासनिक क्षेत्र का नाम था जो फ़रात नदी के पश्चिम में था।
    reason: cultural_note
  - marker: c
    text: या, “कुशल हो!” यह पत्र में प्रयुक्त अभिवादन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פִּתְגָמָא
  choice: उत्तर
  rationale: यह राजकीय लिखित संदेश पिछले पत्र के प्रत्युत्तर में भेजा गया है; इसलिए ‘उत्तर’ प्रसंगानुकूल है और इसे अनावश्यक रूप से ‘राजाज्ञा’ नहीं बनाता।
- source_word: בְּעֵל טְעֵם
  choice: प्रशासक
  rationale: यह एक प्रशासनिक पदवी है जिसका ठीक आधुनिक समकक्ष अनिश्चित है। ‘प्रशासक’ भूमिका को सामान्य और स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में रखा गया है।
- source_word: סָפְרָא
  choice: लिपिक
  rationale: यह आधिकारिक लेखन-संबंधी पद है। ‘लिपिक’ आधुनिक पाठक के लिए स्पष्ट है और पद के प्रशासनिक स्वरूप को बनाए रखता है।
- source_word: שְׁאָר כְּנָוָתְהוֹן
  choice: उनके बाकी सहकर्मियों
  rationale: यह नामित अधिकारियों से जुड़े अन्य लोगों को दर्शाता है; ‘सहकर्मी’ आधुनिक और पर्याप्त रूप से व्यापक है।
- source_word: דִּי יָתְבִין בְּשָׁמְרָיִן
  choice: सामरिया में रहनेवाले
  rationale: कृदन्तीय पदबंध स्थायी निवास या बसे होने का भाव देता है; यह रूप सहज आधुनिक हिन्दी है।
- source_word: וּשְׁאָר עֲבַר נַהֲרָה
  choice: तथा नदी के पार रहनेवाले बाकी लोगों
  rationale: मूल में ‘प्रदेश’ के लिए अलग शब्द नहीं है। यह अनुवाद ‘नदी के पार’ को बनाए रखते हुए वाक्य को स्वाभाविक हिन्दी देता है; ऐतिहासिक संकेत पादटिप्पणी में स्पष्ट किया गया है।
- source_word: שְׁלָם
  choice: शांति हो!
  rationale: यह पत्रारंभिक अभिवादन है। ‘शांति हो’ मूल के शाब्दिक अर्थ को बनाए रखता है, जबकि अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּכְעֶת
  choice: और अब—
  rationale: यह राजकीय उत्तर के मुख्य भाग का सूत्रवत् आरंभ है; दीर्घ विराम-चिह्न दिखाता है कि वाक्य अगले पद में जारी है।
