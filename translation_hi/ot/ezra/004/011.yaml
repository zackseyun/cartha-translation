base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/011.yaml
  text: 'This is a copy of the letter that they sent to King Artaxerxes: “Your servants[a], the men of Beyond the River[b], and now—”'
translation:
  language: hi
  text: 'यह उस पत्र की प्रतिलिपि है जो उन्होंने राजा अर्तक्षत्र को भेजा था: “आपके सेवक, नदी के उस पार के लोग[a], और अब—”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नदी के उस पार से।” यह फ़ारसी साम्राज्य का प्रांतीय पदनाम था, जिसे कभी-कभी “फरात-पार प्रदेश” कहा जाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ की अरामी अभिव्यक्ति पत्र आरम्भ करने का एक औपचारिक सूत्र है। इसका अनुवाद परम्परागत रूप से “और ऐसे समय पर” किया गया है; इसे “इत्यादि” के अर्थ में भी समझा जाता है। पत्र अगले पद में जारी रहता है।
    reason: lexical_alternative
