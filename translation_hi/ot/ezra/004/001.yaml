source:
  edition: WLC
  text: וַֽ/יִּשְׁמְע֔וּ צָרֵ֥י יְהוּדָ֖ה וּ/בִנְיָמִ֑ן כִּֽי בְנֵ֤י הַ/גּוֹלָה֙ בּוֹנִ֣ים הֵיכָ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/001.yaml
  text: The adversaries of Judah and Benjamin heard that the sons of the exile were building a temple for Yahweh[a], the God of Israel.
translation:
  language: hi
  text: यहूदा और बिन्यामीन के विरोधियों ने सुना कि निर्वासन की सन्तान[a] याहवे, इस्राएल के परमेश्वर, के लिए एक मंदिर बना रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “निर्वासन के पुत्र”; अर्थात निर्वासित समुदाय से संबंधित लोग।'
    reason: मूल इब्रानी पदबंध का शाब्दिक रूप तथा उसके समुदाय-सूचक आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: ने सुना
  rationale: क्रिया भूतकाल की साधारण कथात्मक घटना बताती है; स्रोत में अलग से ‘अब’ जैसा कोई काल-सूचक शब्द नहीं है।
- source_word: צָרֵי
  choice: विरोधियों
  rationale: यह शब्द शत्रुतापूर्ण विरोध करने वालों को दर्शाता है, पर अनिवार्य रूप से सैनिक शत्रुओं को नहीं।
- source_word: יְהוּדָה וּבִנְיָמִן
  choice: यहूदा और बिन्यामीन
  rationale: ये गोत्रीय और क्षेत्रीय नाम हैं; हिन्दी में प्रचलित बाइबलीय लिप्यंतरण रखा गया है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי सुनी गई बात की विषयवस्तु आरम्भ करता है, कारण नहीं बताता।
- source_word: בְנֵי הַגּוֹלָה
  choice: निर्वासन की सन्तान
  rationale: यह चयन मूल इब्रानी अभिव्यक्ति ‘निर्वासन के पुत्र/सन्तान’ को दिखाई देता रहने देता है। इसका सामुदायिक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: בּוֹנִים
  choice: बना रही है
  rationale: कृदन्त भूतकालीन प्रसंग में चल रही निर्माण-क्रिया व्यक्त करता है। कर्ता एक समुदाय के रूप में लिया गया है, इसलिए स्वाभाविक हिन्दी में एकवचन स्त्रीलिंग क्रिया ‘बना रही है’ प्रयुक्त हुई है।
- source_word: הֵיכָל
  choice: मन्दिर
  rationale: यद्यपि यह शब्द अन्य प्रसंगों में राजमहल भी हो सकता है, यहाँ याहवे के लिए बनाए जा रहे भवन के अर्थ में ‘मन्दिर’ स्पष्ट है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ का यहाँ उद्देश्य/लाभार्थ अर्थ है; परमेश्वर के निजी नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह सीधी संबंधवाचक पद-रचना है, जो याहवे की पहचान इस्राएल के परमेश्वर के रूप में कराती है।
theological_decisions:
- issue: परमेश्वर के निजी नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निजी नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और निजी वाचा-नाम को सामान्य उपाधि में नहीं बदलता।
- issue: בְנֵי הַגּוֹלָה की सामुदायिक पहचान
  choice: निर्वासन की सन्तान
  alternative: निर्वासित लोग; निर्वासन से लौटे लोग
  rationale: मूल की रूपकात्मक वंश/समुदाय-सूचक भाषा सुरक्षित रखी गई है। ‘लौटे लोग’ प्रसंगानुकूल है, पर लौटने की बात इस पदबंध में प्रत्यक्ष नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘निर्वासन की सन्तान’ जानबूझकर कुछ औपचारिक है ताकि मूल इब्रानी रूपक बना रहे; पाद-टिप्पणी उसका अर्थ स्पष्ट करती है।
