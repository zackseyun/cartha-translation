  yaml_path: translation/ot/ezra/004/020.yaml
  text: And mighty kings were over Jerusalem, ruling over all the region Beyond the River, and tribute, tax, and toll were paid to them.
translation:
  language: hi
  text: यरूशलेम पर शक्तिशाली राजाओं का शासन था, और वे नदी-पार[a] के सारे प्रदेश पर प्रभुत्व रखते थे; उन्हें कर, शुल्क और राहदारी[b] दिया जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पूरे नदी-पार पर।” “नदी-पार” फ़रात नदी के पश्चिम के साम्राज्यीय प्रदेश का आधिकारिक नाम था।
    reason: cultural_note
  - marker: b
    text: “कर, शुल्क और राहदारी” साम्राज्यीय आय की तीन अलग श्रेणियाँ थीं; इनके सटीक भेद निश्चित नहीं हैं। इन्हें “लगान, कर और राहदारी” या “कर, चुंगी और महसूल” भी अनूदित किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְכִין תַּקִּיפִין
  choice: शक्तिशाली राजा
  rationale: बहुवचन संज्ञा और शक्ति-सूचक विशेषण का सीधा, स्वाभाविक और राजकीय संदर्भ के अनुकूल अनुवाद।
- source_word: עַל יְרוּשְׁלֶם
  choice: यरूशलेम पर
  rationale: यहाँ עַל स्थान मात्र नहीं, बल्कि यरूशलेम पर अधिकार को सूचित करता है।
- source_word: שַׁלִּיטִין
  choice: शासन करते थे
  rationale: कृदन्त-सदृश रूप को आधुनिक हिन्दी में स्वाभाविक क्रियात्मक रूप दिया गया है, जिससे प्रभुत्व का भाव स्पष्ट रहता है।
- source_word: בְּכֹל עֲבַר נַהֲרָה
  choice: नदी-पार के पूरे प्रदेश पर
  rationale: यह फ़रात के पश्चिम स्थित साम्राज्यीय भूभाग का आधिकारिक भौगोलिक नाम है। 'प्रदेश' निहित प्रशासनिक अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: מִדָּה בְלוֹ וַהֲלָךְ
  choice: कर, चुंगी और महसूल
  rationale: तीन अलग साम्राज्यीय राजस्व-श्रेणियों को प्रचलित हिन्दी प्रशासनिक शब्दावली में अलग-अलग रखा गया है; इनके सटीक परस्पर भेद अनिश्चित हैं।
- source_word: מִתְיְהֵב לְהוֹן
  choice: उन्हें ... दिया जाता था
  rationale: अरामी कर्मवाच्य का स्वाभाविक हिन्दी रूप; संयुक्त राजस्व-सूची के लिए हिन्दी में एकवचन सामूहिक क्रिया सहज है।
