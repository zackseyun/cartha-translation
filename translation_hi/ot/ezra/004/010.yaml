  text: और शेष लोगों को, जिन्हें महान और प्रतिष्ठित ओस्नप्पर[a] ने निर्वासित करके सामरिया नगर में और नदी-पार प्रदेश[b] के शेष भाग में बसाया था—अब:[c]
