source:
  edition: WLC
  text: כְּעַ֗ן כָּ/ל קֳבֵל֙ דִּֽי מְלַ֤ח הֵֽיכְלָ/א֙ מְלַ֔חְנָא וְ/עַרְוַ֣ת מַלְכָּ֔/א לָ֥א אֲֽרִֽיךְ לַ֖/נָא לְ/מֶֽחֱזֵ֑א עַ֨ל דְּנָ֔ה שְׁלַ֖חְנָא וְ/הוֹדַ֥עְנָא לְ/מַלְכָּֽ/א־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/014.yaml
  text: Because we eat the salt of the palace, and it is not fitting for us to see the king’s dishonor, therefore we have sent and informed the king,
translation:
  language: hi
  text: अब, चूँकि हम राजमहल का नमक खाते हैं[a] और राजा का अपमान होते देखना हमारे लिए उचित नहीं है, इसलिए हमने संदेश भेजकर राजा को यह बात बता दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “राजमहल का नमक खाते हैं” का अर्थ है कि वे राजमहल से अपना निर्वाह पाते थे और इसलिए अपने को राजा के प्रति निष्ठाबद्ध मानते थे।
    reason: प्राचीन राजकीय मुहावरा आधुनिक पाठक के लिए अस्पष्ट हो सकता है; मुख्य पाठ में मूल चित्र सुरक्षित रखते हुए अर्थ फुटनोट में स्पष्ट किया गया है।
lexical_decisions:
- source_word: כְּעַן
  choice: अब
  rationale: यह अरामी काल/विमर्श-सूचक शब्द है; पत्र के तर्क में अगले आधार को प्रस्तुत करता है।
- source_word: מְלַח הֵיכְלָא מְלַחְנָא
  choice: हम राजमहल का नमक खाते हैं
  rationale: मूल के ‘राजमहल का नमक’ मुहावरे को बनाए रखते हुए स्वाभाविक हिन्दी दी गई है; इसका आशय राजकीय आश्रय या वेतन से लाभ पाना और उसके प्रति निष्ठाबद्ध होना है।
- source_word: עַרְוַת מַלְכָּא
  choice: राजा का अपमान
  rationale: शाब्दिक रूप से ‘राजा की नग्नता/लज्जा’ का भाव है; प्रसंग में राजा की बेइज्जती, हानि या प्रतिष्ठा पर आँच का संकेत है। ‘अपमान’ हिन्दी में इस भाव को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: לְמֶחֱזֵא
  choice: होते देखना
  rationale: मूल क्रिया ‘देखना’ को सुरक्षित रखा गया है; हिन्दी में ‘अपमान होते देखना’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: שְׁלַחְנָא וְהוֹדַעְנָא לְמַלְכָּא
  choice: हमने संदेश भेजकर राजा को यह बात बता दी है
  rationale: मूल के दोनों कार्य—भेजना और अवगत कराना—स्पष्ट रखे गए हैं। ‘संदेश’ और ‘यह बात’ हिन्दी में आवश्यक निहित पूरक हैं।
