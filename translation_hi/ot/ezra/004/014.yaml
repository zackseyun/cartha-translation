translation_notes:
  register: आधुनिक मानक हिन्दी में पत्रात्मक, सम्मानपूर्ण और सामान्य पाठक के लिए सहज शैली रखी गई है। मूल अरामी का आरंभिक ‘अब’, ‘नमक’ का मुहावरा, और ‘देखना’ की क्रिया सुरक्षित हैं; अत्यधिक शाब्दिक ‘राजा की नग्नता’ के स्थान पर प्रसंगगत ‘राजा का अपमान’ चुना गया है।
