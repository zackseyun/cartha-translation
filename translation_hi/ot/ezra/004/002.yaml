base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/002.yaml
  text: Then they approached Zerubbabel and the heads of the fathers’ houses and said to them[a], “Let us build with you, for like you we seek your God, and we have been sacrificing to him since the days of Esar-haddon king of Assyria[b], who brought us up here.”
translation:
  language: hi
  text: तब वे जरुब्बाबेल और पितृकुलों के मुखियाओं के पास आए और उनसे कहा, “आओ, हम तुम्हारे साथ मिलकर निर्माण करें, क्योंकि हम भी तुम्हारी तरह तुम्हारे परमेश्वर की खोज करते हैं[b], और अश्शूर के राजा एसर-हद्दोन के दिनों से—जो हमें यहाँ ले आया था—हम उसी को बलि चढ़ाते आए हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी के लिखित पाठ में है, “और हम बलि नहीं चढ़ाते”; पारंपरिक पठन में है, “और हम उसी को बलि चढ़ाते हैं।” प्रसंग के कारण इसे सामान्यतः सकारात्मक अर्थ में समझा जाता है।
    reason: textual_variant
  - marker: b
    text: “खोज करते हैं” का अर्थ यहाँ “आराधना करते हैं” या “उससे पूछते हैं” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ
  choice: वे ... के पास आए
  rationale: נגשׁ के निकट जाने के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पद पैतृक वंश पर आधारित सामाजिक इकाइयों के प्रधानों को दर्शाता है; ‘पितृकुल’ मूल मुहावरे की वंशगत संरचना बचाता है।
- source_word: נִבְנֶה עִמָּכֶם
  choice: हमें भी अपने साथ निर्माण करने दो
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया के प्रस्तावात्मक भाव को सहज हिन्दी में रखता है; ‘भी’ साथ मिलकर करने के आशय को स्पष्ट करता है।
- source_word: כִּי כָכֶם
  choice: क्योंकि तुम्हारी तरह हम भी
  rationale: सहयोग के लिए वक्ताओं द्वारा दिए गए तुलनात्मक आधार को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: נִדְרֹשׁ לֵאלֹהֵיכֶם
  choice: हम भी तुम्हारे परमेश्वर की खोज करते हैं
  rationale: דרשׁ के ‘खोजना’, ‘पूछना’ और धार्मिक रूप से ‘आराधना करना’ जैसे अर्थों की व्यापकता को ‘खोज करते हैं’ सुरक्षित रखता है।
- source_word: וְלֹא אֲנַחְנוּ זֹבְחִים
  choice: हम उसी को बलि चढ़ाते आए हैं
  rationale: संदर्भ और पारंपरिक पठन לו के अनुसार सकारात्मक दावे को मुख्य पाठ में रखा गया है, जबकि लिखित לא की कठिनाई पादटिप्पणी में स्पष्ट की गई है।
- source_word: מִימֵי אֵסַר חַדֹּן
  choice: एसर्हद्दोन के दिनों से
  rationale: מִן के आरंभ-बिंदु से वर्तमान तक के कालगत भाव को हिन्दी में ‘के दिनों से’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּעֲלֶה אֹתָנוּ פֹּה
  choice: जो हमें यहाँ ले आया था
  rationale: हिफ़ील कृदंत के कारणवाचक आगमन को पठनीय हिन्दी में व्यक्त करता है; हिन्दी में ‘ऊपर’ जोड़ना यहाँ अनावश्यक और भ्रामक हो सकता है।
theological_decisions:
- issue: बसाए गए लोगों का धार्मिक दावा
  choice: उनका दावा तटस्थ रूप से ‘तुम्हारे परमेश्वर की खोज करते हैं’ और ‘उसी को बलि चढ़ाते आए हैं’ कहा गया है।
  alternative: ‘तुम्हारे परमेश्वर की आराधना करते हैं’ अथवा ‘तुम्हारे परमेश्वर से पूछते हैं।’
  rationale: वचन वक्ताओं के दावे की सूचना देता है, उसकी सच्चाई या धार्मिक शुद्धता को प्रमाणित नहीं करता। ‘खोज’ मूल की धार्मिक अर्थ-व्याप्ति और कथात्मक तनाव दोनों बचाती है।
- issue: לא और לו की पाठगत कठिनाई
  choice: मुख्य पाठ में संदर्भानुकूल सकारात्मक अर्थ ‘उसी को’ रखा गया है और लिखित रूप पादटिप्पणी में बताया गया है।
  alternative: शाब्दिक लिखित पाठ के अनुसार ‘और हम बलि नहीं चढ़ाते’ पढ़ना।
  rationale: लिखित לא (‘नहीं’) प्रसंग में वक्ताओं के तर्क के विपरीत जान पड़ता है; पारंपरिक पठन לו (‘उसी को’) और अनेक व्याख्याएँ सकारात्मक अर्थ का समर्थन करती हैं, पर वास्तविक पाठगत तनाव छिपाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। ‘पितृकुल’ एज्रा की वंशगत-सामाजिक शब्दावली को बनाए रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
