- source_word: עַם יְהוּדָה
  choice: यहूदा के लोग
  rationale: यह समास-पद का सीधा अर्थ है और पुनर्निर्माण में लगे यहूदी समुदाय को दर्शाता है।
- source_word: וּמְבַלְהִים
  choice: और ... डराते रहे
  rationale: בהל का कारक रूप भय या घबराहट उत्पन्न करने को व्यक्त करता है; ‘डराते रहे’ स्वाभाविक हिन्दी में इसकी निरंतर क्रिया बताता है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह प्रत्यक्ष कर्म सर्वनाम ‘यहूदा के लोगों’ की ओर संकेत करता है।
- source_word: לִבְנוֹת
  choice: निर्माण करने से
  rationale: प्रसंग में ל सहित क्रियार्थक संज्ञा उस कार्य को बताती है जिससे विरोधी उन्हें भय दिखाकर रोक रहे थे; ‘निर्माण’ भवन/मन्दिर के पुनर्निर्माण का आशय खुला रखता है।
