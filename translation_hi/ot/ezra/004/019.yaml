  text: וּ/מִנִּ/י֮ שִׂ֣ים טְעֵם֒ וּ/בַקַּ֣רוּ וְ/הַשְׁכַּ֔חוּ דִּ֚י קִרְיְתָ֣/א דָ֔ךְ מִן יוֹמָת֙ עָֽלְמָ֔/א עַל מַלְכִ֖ין מִֽתְנַשְּׂאָ֑ה וּ/מְרַ֥ד וְ/אֶשְׁתַּדּ֖וּר מִתְעֲבֶד בַּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/019.yaml
  text: And a decree was issued by me[a], and they searched and found that this city has from ancient days risen up against kings[b], and rebellion and sedition have been carried out in it.
translation:
  language: hi
  text: और मेरी ओर से आज्ञा दी गई[a], और जाँच की गई और यह पाया गया कि यह नगर प्राचीन काल से राजाओं के विरुद्ध सिर उठाता रहा है, और इसमें विद्रोह और राजद्रोह होते रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी ओर से आदेश जारी किया गया।”
    reason: ‘त्एम रखना’ राजकीय आज्ञा देने या आदेश जारी करने का अरामी प्रशासनिक मुहावरा है।
lexical_decisions:
- source_word: וּמִנִּי שִׂים טְעֵם
  choice: मेरी ओर से आज्ञा दी गई
  rationale: अरामी मुहावरे का शाब्दिक अर्थ ‘आज्ञा ठहराना’ है। यह हिंदी रूप राजकीय आदेश और उसके राजा की ओर से जारी होने—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּבַקַּרוּ וְהַשְׁכַּחוּ
  choice: खोजबीन की गई और यह पाया गया
  rationale: संदर्भ राजकीय अभिलेखों की जाँच का है। हिंदी में कर्मवाच्य उस अनिर्दिष्ट प्रशासनिक जाँच-दल को स्वाभाविक रूप से दर्शाता है।
- source_word: קִרְיְתָא דָךְ
  choice: यह नगर
  rationale: निर्देशक सर्वनाम चर्चा में आए नगर की ओर संकेत करता है; ‘यह नगर’ उसकी निकट संकेतात्मक शक्ति को बनाए रखता है।
- source_word: מִן יוֹמָת עָלְמָא
  choice: प्राचीन काल से
  rationale: यह प्राचीनता बताने वाला अरामी मुहावरा है; चुना हुआ रूप आधुनिक, सहज और गरिमापूर्ण हिंदी है।
- source_word: עַל מַלְכִין מִתְנַשְּׂאָה
  choice: राजाओं के विरुद्ध उठता रहा है
  rationale: आत्मवाचक रूप में स्वयं को ऊँचा करने अथवा विरोध में उठ खड़े होने की छाया है। राजनीतिक संदर्भ में यह अनुवाद विरोध का भाव रखता है, पर इसे अगले स्पष्ट शब्द ‘विद्रोह’ में विलीन नहीं करता।
- source_word: וּמְרַד
  choice: विद्रोह
  rationale: राजकीय सत्ता के विरुद्ध बगावत के लिए यह सीधा और प्रचलित राजनीतिक शब्द है।
- source_word: וְאֶשְׁתַּדּוּר
  choice: राजद्रोह
  rationale: शब्द विद्रोह से संबद्ध किंतु अलग प्रकार की सत्ता-विरोधी अथवा राज-विरोधी गतिविधि बताता है। ‘राजद्रोह’ हिंदी में उसका राजनीतिक-कानूनी भेद बनाए रखता है।
- source_word: מִתְעֲבֶד בַּהּ
  choice: इसमें ... होते रहे हैं
  rationale: अरामी रूप नगर में ऐसे कार्य बार-बार किए जाने या घटित होने को व्यक्त करता है। यह हिंदी प्रयोग उसके निरंतर/पुनरावृत्त ऐतिहासिक भाव को सहजता से देता है।
