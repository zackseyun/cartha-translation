base_translation:
  language: en
  yaml_path: translation/ot/ezra/004/013.yaml
  text: Now let it be known to the king that if this city is rebuilt and its walls are completed, they will not pay tribute, tax, or toll, and in the end it will damage the revenue of the kings.
translation:
  language: hi
  text: अब राजा को मालूम हो कि यदि यह नगर फिर से बनाया जाए और इसकी दीवारें पूरी की जाएँ, तो वे कर, महसूल और चुंगी नहीं देंगे, और अंततः इससे राजाओं के राजस्व को हानि पहुँचेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और अंततः इससे राजाओं को हानि पहुँचेगी।” अरामी अभिव्यक्ति संक्षिप्त है; राजस्व की हानि का भाव कर, महसूल और चुंगी न दिए जाने के प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּעַן
  choice: अब
  rationale: यह अरामी संवाद-सूचक क्रियाविशेषण चेतावनी अथवा निष्कर्ष की ओर संक्रमण कराता है; ‘अब’ बिना अनावश्यक व्याख्या के इसका स्वाभाविक हिन्दी रूप है।
- source_word: יְדִיעַ לֶהֱוֵא לְמַלְכָּא
  choice: राजा को मालूम हो
  rationale: यह राजकीय पत्राचार का औपचारिक सूत्र है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट रहते हुए औपचारिकता बनाए रखता है।
- source_word: דִּי הֵן
  choice: कि यदि
  rationale: यह सूचना की विषय-वस्तु को एक शर्त के रूप में प्रस्तुत करता है।
- source_word: קִרְיְתָא דָךְ
  choice: यह नगर
  rationale: प्रदर्शक सर्वनाम लेखकों के सामने विचाराधीन यरूशलेम की ओर संकेत करता है।
- source_word: תִּתְבְּנֵא
  choice: फिर से बनाया गया
  rationale: शर्तवाचक प्रसंग में अपूर्ण क्रिया नगर के पुनर्निर्माण की सम्भावना व्यक्त करती है।
- source_word: וְשׁוּרַיָּה יִשְׁתַּכְלְלוּן
  choice: और इसकी शहरपनाह पूरी कर दी गई
  rationale: שׁוּרַיָּה नगर की किलेबन्द दीवारों को और क्रिया उनके पूर्ण किए जाने को दर्शाती है; ‘शहरपनाह’ इस ऐतिहासिक प्रशासनिक प्रसंग में सटीक और संक्षिप्त है।
- source_word: מִנְדָּה בְלוֹ וַהֲלָךְ
  choice: कर, महसूल और चुंगी
  rationale: तीनों शब्द फ़ारसी प्रशासन की अलग-अलग राजस्व-वसूलियों का एक पारिभाषिक त्रिक हैं। हिन्दी में ‘कर, महसूल और चुंगी’ उनका भेद यथासम्भव बनाए रखता है, यद्यपि प्रत्येक की ठीक तकनीकी सीमा अनिश्चित है।
- source_word: לָא יִנְתְּנוּן
  choice: वे ... नहीं देंगे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘देना’ है और बहुवचन कर्ता नगरवासियों की ओर संकेत करता है; कर-सूची के साथ यह हिन्दी में भी सहज है।
- source_word: וְאַפְּתֹם מַלְכִים תְּהַנְזִק
  choice: और अन्ततः इससे राजाओं के राजस्व को हानि पहुँचेगी
  rationale: संक्षिप्त और कुछ कठिन अरामी वाक्यांश का आशय पूर्वोक्त करों के न मिलने से राजकीय आय की हानि है; ‘राजस्व’ प्रसंगगत पूर्ति है, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
