  text: שִׁקְד֣וּ וְ/שִׁמְר֗וּ עַֽד תִּשְׁקְל֡וּ לִ/פְנֵי֩ שָׂרֵ֨י הַ/כֹּהֲנִ֧ים וְ/הַ/לְוִיִּ֛ם וְ/שָׂרֵֽי הָ/אָב֥וֹת לְ/יִשְׂרָאֵ֖ל בִּ/ירוּשָׁלִָ֑ם הַ/לִּשְׁכ֖וֹת בֵּ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/029.yaml
  text: Be watchful and guard them until you weigh them out before the chief priests and the Levites and the heads of the fathers’ houses of Israel in Jerusalem[c][b][a], in the chambers of the house of Yahweh.
translation:
  language: hi
  text: “सावधान रहो[a] और उनकी रक्षा करो, जब तक कि तुम उन्हें यरूशलेम में यहोवा के भवन[c] के कक्षों में याजकों के प्रमुखों, लेवियों और इस्राएल के पितृकुलों के प्रमुखों[b] के सामने तौल न लो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चौकस रहो और उन्हें संभालकर रखो।” दोनों इब्रानी आज्ञाएँ सौंपी गई वस्तुओं पर सतर्क निगरानी और उनकी सुरक्षा पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: “पितृकुलों के प्रमुख” से आशय वंश या पूर्वज के आधार पर बने कुलों के अगुओं से है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “यहोवा का भवन”; अर्थात् मन्दिर।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁקְדוּ
  choice: सावधान रहो
  rationale: बहुवचन आज्ञार्थक क्रिया जागरूक और सतर्क बने रहने का भाव देती है; सौंपी गई बहुमूल्य वस्तुओं की निगरानी के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: וְשִׁמְרוּ
  choice: और उनकी रक्षा करो
  rationale: שׁמר का अर्थ रखना, चौकसी करना या रक्षा करना हो सकता है। यहाँ चाँदी-सोने जैसी सौंपी गई वस्तुओं की सुरक्षा अभिप्रेत है; ‘उनकी’ पूर्ववर्ती संदर्भ से जोड़ा गया है।
- source_word: עַד תִּשְׁקְלוּ
  choice: जब तक कि तुम उन्हें ... तौलकर न सौंप दो
  rationale: שׁקל का मूल भाव तौलना है। प्रसंग में अधिकारियों के सामने हिसाब देकर वस्तुओं को तौलने और सौंपने की प्रक्रिया है; ‘सौंप दो’ प्रसंगगत निहितार्थ स्पष्ट करता है, जबकि ‘तौलकर’ मूल क्रिया को बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: औपचारिक जवाबदेही के प्रसंग में ‘के सामने’ उपस्थित अधिकारियों की मौजूदगी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: याजकों के प्रधानों
  rationale: यह पद याजकों के नेताओं या अधिकारियों को दर्शाता है। ‘याजकों के प्रधान’ पदानुक्रम को व्यक्त करता है और बाद के किसी तकनीकी पदनाम को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: וְהַלְוִיִּם
  choice: लेवियों
  rationale: इस जातीय-धार्मिक समूह का मानक हिन्दी रूप।
- source_word: וְשָׂרֵי הָאָבוֹת לְיִשְׂרָאֵל
  choice: और इस्राएल के पितृकुलों के प्रधानों
  rationale: इब्रानी मुहावरा पूर्वज-आधारित कुलों या घरानों के अगुओं को दर्शाता है। ‘पितृकुल’ वंशगत-सामुदायिक अर्थ को ‘परिवार’ से अधिक ठीक रखता है।
- source_word: בִּירוּשָׁלָם
  choice: यरूशलेम में
  rationale: स्थान-नाम का प्रचलित हिन्दी रूप।
- source_word: הַלִּשְׁכוֹת
  choice: कक्षों में
  rationale: मन्दिर-परिसर के कमरों के लिए सामान्य वास्तु-संबंधी शब्द; ‘भंडारों’ की अपेक्षा कम विशिष्ट और मूल शब्द की व्यापकता के अनुरूप।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בית का औपचारिक अर्थ ‘भवन/घर’ रखा गया है और יהוה को हिन्दी बाइबलीय परंपरा में परिचित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे उपस्थित है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों में परिचित नाम-रूप है और इसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में सुरक्षित रखता है; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण है।
- issue: तौलने की क्रिया में सुपुर्दगी का निहितार्थ
  choice: तौलकर न सौंप दो
  alternative: तौल न लो
  rationale: पिछले पदों में वस्तुएँ इन व्यक्तियों को सौंपी गई हैं और यहाँ गंतव्य पर अधिकारियों के सामने उनका लेखा होना है। ‘सौंप दो’ संदर्भगत प्रक्रिया को स्पष्ट करता है, पर मूल क्रिया ‘तौलकर’ स्पष्ट रूप से बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य में मूल आदेश की औपचारिकता और जवाबदेही का भाव बना है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं और संबंधित पदबंध के बाद लगाए गए हैं।
