  yaml_path: translation/ot/ezra/008/023.yaml
  text: So we fasted and sought our God concerning this[a], and he answered our plea.
translation:
  language: hi
  text: इसलिए हमने उपवास किया और इस विषय में अपने परमेश्वर से विनती की, और उसने हमारी विनती सुन ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּצוּמָה
  choice: हमने उपवास किया
  rationale: צום का सीधा अर्थ ‘उपवास करना’ है। प्रथम पुरुष बहुवचन रूप समूह के किए हुए कार्य को बताता है; यहाँ ‘उपवास की घोषणा की’ कहना मूल से अधिक जोड़ना होगा।
- source_word: וַנְּבַקְשָׁה מֵאֱלֹהֵינוּ
  choice: अपने परमेश्वर से विनती की
  rationale: בקשׁ का अर्थ ‘ढूँढ़ना’ या ‘माँगना’ हो सकता है। מן के साथ और प्रार्थना के प्रसंग में ‘से विनती की’ स्वाभाविक हिंदी है और परमेश्वर से अनुरोध किए जाने का भाव स्पष्ट रखती है।
- source_word: עַל זֹאת
  choice: इस विषय में
  rationale: शाब्दिक रूप से ‘इस पर/इस विषय के लिए’; यह पिछले प्रसंग में कही गई यात्रा-सुरक्षा की बात की ओर संकेत करता है। ‘इस विषय में’ संदर्भ-संबंध को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: וַיֵּעָתֵר לָנוּ
  choice: उसने हमारी विनती सुन ली
  rationale: Niphal रूप यहाँ विनती से अनुकूल रूप से प्रभावित होकर उसका उत्तर देने का भाव रखता है। हिंदी में ‘विनती सुन ली’ इस अनुकूल प्रत्युत्तर को सहज और गरिमापूर्ण ढंग से व्यक्त करता है।
theological_decisions:
- issue: וַיֵּעָתֵר में परमेश्वर के प्रत्युत्तर का स्वरूप
  choice: उसने हमारी विनती सुन ली
  alternative: वह हमारी विनती से मान गया / उसने हमारी प्रार्थना का उत्तर दिया
  rationale: ‘विनती सुन ली’ अनुकूल दैवी प्रत्युत्तर को व्यक्त करता है, पर यह उत्तर किस विशेष रीति से मिला, इसका दावा नहीं करता। ‘मान गया’ आधुनिक हिंदी में अनुचित मानवीकरण या अनिच्छा से सहमत होने का भाव दे सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामूहिक कथन के अनुरूप। ‘परमेश्वर’ के लिए आदरसूचक बहुवचन क्रिया के बजाय बाइबिलीय हिंदी की प्रचलित एकवचन क्रिया ‘उसने…सुन ली’ रखी गई है।
