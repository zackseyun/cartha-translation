base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/020.yaml
  text: And from the temple servants whom David and the officials had assigned to the service of the Levites[a], there were 220 temple servants[b]; all of them were designated by name.
translation:
  language: hi
  text: और मंदिर-सेवकों में से, जिन्हें दाऊद और अधिकारियों ने लेवियों की सेवा के लिए नियुक्त किया था, 220 मंदिर-सेवक थे;[a] उन सबके नाम दर्ज थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मंदिर-सेवक’ के लिए इब्रानी में नतीनीम है, जो मंदिर की सेवा से जुड़े सेवकों के एक विशिष्ट वर्ग का पारिभाषिक नाम था।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उन सबको नाम लेकर निर्दिष्ट किया गया था।’
    reason: alternative_reading
lexical_decisions:
- source_word: הַנְּתִינִים / נְתִינִים
  choice: मन्दिर के सेवक / मन्दिर-सेवक
  rationale: यह एक विशिष्ट वर्ग के लिए प्रयुक्त पारिभाषिक शब्द है, केवल सामान्य सेवकों के लिए नहीं। कार्य-सूचक हिन्दी अभिव्यक्ति आधुनिक पाठक के लिए स्पष्ट है।
- source_word: שֶׁנָּתַן
  choice: नियुक्त किया था
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दिया’ है, पर इस प्रशासनिक-सांस्थानिक प्रसंग में व्यक्तियों को सेवा के लिए सौंपने या नियुक्त करने का भाव है।
- source_word: וְהַשָּׂרִים
  choice: अधिकारियों
  rationale: यह पद शासन अथवा नेतृत्व के उच्च पदाधिकारियों को सूचित करता है; ‘अधिकारी’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त व्यापक है।
- source_word: לַעֲבֹדַת הַלְוִיִּם
  choice: लेवियों की सेवा के लिए
  rationale: यह अभिव्यक्ति लेवियों से संबंधित धार्मिक कार्य में सहायक नियुक्ति का भाव रखती है, पर सेवा-संबंध की सटीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: מָאתַיִם וְעֶשְׂרִים
  choice: '220'
  rationale: अंक आधुनिक पाठ में सहज पठनीय है और मूल संख्या को ठीक-ठीक रखता है।
- source_word: נִקְּבוּ בְשֵׁמוֹת
  choice: नाम दर्ज थे
  rationale: मूल निष्क्रिय अभिव्यक्ति प्रत्येक व्यक्ति की नाम द्वारा स्पष्ट पहचान बताती है। ‘दर्ज थे’ प्रशासनिक सूचीकरण को स्वाभाविक हिन्दी में व्यक्त करता है; ‘नामित किए गए थे’ भी संभव है।
