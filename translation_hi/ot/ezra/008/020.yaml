  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आरंभिक ‘और’ मूल के संयोजक को बनाए रखता है। ‘आए’ प्रसंग से निहित है और हिन्दी में संख्या-वाक्य को स्वाभाविक बनाता है; इसे अलग पाठगत सूचना के रूप में नहीं लिया गया है।
