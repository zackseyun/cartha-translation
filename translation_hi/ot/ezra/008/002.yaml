lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: के वंशजों में से
  rationale: מִן के साथ בְּנֵי यहाँ सूची में किसी वंश या कुल से आए प्रतिनिधि को दर्शाता है। शाब्दिक ‘पुत्रों में से’ की अपेक्षा ‘वंशजों में से’ आधुनिक हिन्दी में अभिप्रेत वंश-संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है, जबकि तीनों खंडों की समान संरचना बनी रहती है।
- source_word: פִינְחָס
  choice: पीनहास
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: גֵּרְשֹׁם
  choice: गेर्शोम
  rationale: इब्रानी व्यक्तिवाचक नाम का निकट लिप्यंतरण।
- source_word: אִיתָמָר
  choice: ईतामार
  rationale: इब्रानी व्यक्तिवाचक नाम का निकट और हिन्दी में प्रचलित लिप्यंतरण।
- source_word: דָּנִיֵּאל
  choice: दानिय्येल
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: דָוִיד
  choice: दाऊद
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला रूप; यहाँ यह वंश-सूचक है।
- source_word: חַטּוּשׁ
  choice: हत्तूश
  rationale: व्यंजन के द्वित्व को संकेतित करते हुए इब्रानी व्यक्तिवाचक नाम का निकट हिन्दी लिप्यंतरण।
