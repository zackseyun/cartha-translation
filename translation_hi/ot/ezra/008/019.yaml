translation_notes:
  register: आधुनिक, गरिमापूर्ण और सूची-संदर्भ के अनुकूल हिंदी। पद पिछले वाक्य की निरंतरता है, इसलिए अंत में अर्धविराम रखा गया है। मूल पाठ के संबंधों को बिना अनावश्यक व्याख्या के रखा गया है, और संभावित व्यापक कुल-संबंध को पादटिप्पणी में स्पष्ट किया गया है।
