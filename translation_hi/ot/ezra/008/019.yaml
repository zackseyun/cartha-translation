  yaml_path: translation/ot/ezra/008/019.yaml
  text: and Hashabiah[a], and with him Jeshaiah, from the sons of Merari, his brothers and their sons, twenty[b];
translation:
  language: hi
  text: और हशब्याह को, और उसके साथ मरारी के वंशजों में से[a] यशायाह को, तथा उसके भाइयों[b] और उनके बेटों को—कुल बीस जन;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मरारी के पुत्रों में से”; अर्थात मरारी के वंशजों में से।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से एक ही वंश के पुरुष संबंधी अभिप्रेत हो सकते हैं; केवल सगे भाई होना आवश्यक नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וְאֶת חֲשַׁבְיָה
  choice: और हशब्याह को
  rationale: संयोजक और कर्म-सूचक चिह्न पिछले पद से चली आ रही सूची को आगे बढ़ाते हैं। नाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: וְאִתּוֹ יְשַׁעְיָה
  choice: और उसके साथ ... यशायाह को
  rationale: इत्तो साथ होने का संबंध व्यक्त करता है। यशायाह नाम का प्रचलित हिंदी रूप रखा गया है; यहाँ यह इसी नाम वाले एक अन्य व्यक्ति के लिए है।
- source_word: מִבְּנֵי מְרָרִי
  choice: मरारी के वंशजों में से
  rationale: शाब्दिक रूप 'मरारी के पुत्रों में से' है, पर वंशावली के इस प्रसंग में 'वंशजों में से' आधुनिक हिंदी में आशय अधिक स्वाभाविक और स्पष्ट रूप से देता है। मसोराई उच्चारण-चिह्न इस वाक्यांश को यशायाह के साथ निकटता से जोड़ते हैं।
- source_word: אֶחָיו
  choice: उसके भाइयों
  rationale: मूल शब्द का सीधा अर्थ 'उसके भाई' है। संदर्भ में इसका दायरा सगे भाइयों से व्यापक हो सकता है, इसलिए मुख्य पाठ में सीधा अर्थ और पादटिप्पणी में सांस्कृतिक विस्तार दिया गया है।
- source_word: וּבְנֵיהֶם
  choice: और उनके बेटों को
  rationale: पुल्लिंग बहुवचन और वंशावली-सूची के कारण 'बेटे' उपयुक्त है; 'उनके' मूल के बहुवचन प्रत्यय को सुरक्षित रखता है।
- source_word: עֶשְׂרִים
  choice: कुल बीस जन
  rationale: संख्या उल्लिखित समूह की कुल गिनती बताती है। हिंदी में स्पष्टता और स्वाभाविकता के लिए 'कुल' और मनुष्यों के लिए गणक 'जन' जोड़े गए हैं।
