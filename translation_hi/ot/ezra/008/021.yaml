base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/021.yaml
  text: Then I proclaimed a fast there[a], at the Ahava River, that we might humble ourselves before our God, to seek from him a straight path for us, for our little ones[b], and for all our possessions.
translation:
  language: hi
  text: तब मैंने वहाँ अहवा नदी के पास उपवास की घोषणा की, ताकि हम अपने परमेश्वर के सामने विनम्र हों[a] और उससे अपने लिए, अपने बाल-बच्चों के लिए और अपनी सारी सम्पत्ति के लिए सीधा मार्ग[b] माँगें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को कष्ट दें।” इब्रानी मुहावरा आत्म-संयम अथवा परमेश्वर के सामने स्वयं को विनम्र करने को दर्शाता है, विशेषकर उपवास के प्रसंग में।
    reason: lexical_alternative
  - marker: b
    text: या, “सही मार्ग” अथवा “सुरक्षित यात्रा।” इब्रानी में शाब्दिक रूप से “सीधा मार्ग” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וָאֶקְרָא
  choice: तब मैंने ... घोषणा की
  rationale: यहाँ קרא का अर्थ सार्वजनिक रूप से घोषित करना है; आरम्भिक वाव को स्वाभाविक हिन्दी कथानुक्रम में ‘तब’ से व्यक्त किया गया है।
- source_word: צוֹם
  choice: उपवास
  rationale: संज्ञा यहाँ उपवास के विधिवत आयोजन को सूचित करती है; ‘उपवास की घोषणा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עַל הַנָּהָר אַהֲוָא
  choice: अहवा नदी के पास
  rationale: नदी के साथ עַל स्थान-सूचक ‘के पास/किनारे’ का अर्थ दे सकता है; ‘अहवा’ को स्थाननाम के रूप में लिप्यंतरित किया गया है।
- source_word: לְהִתְעַנּוֹת
  choice: अपने आप को दीन करें
  rationale: उपवास के प्रसंग में התענה आत्म-दमन अथवा परमेश्वर के सामने स्वयं को नम्र-दीन करने को दर्शाता है; यह चयन शारीरिक आत्मपीड़ा का भ्रामक संकेत दिए बिना इब्रानी मुहावरे का भाव रखता है।
- source_word: לִפְנֵי אֱלֹהֵינוּ
  choice: अपने परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में मनुष्य की विनीत स्थिति को व्यक्त करने वाला सामान्य सम्बन्धसूचक वाक्यांश है।
- source_word: לְבַקֵּשׁ מִמֶּנּוּ
  choice: उससे ... माँगें
  rationale: בקש यहाँ प्रार्थनापूर्वक अनुरोध करने के अर्थ में है; हिन्दी में ‘उससे ... माँगें’ अपेक्षित वस्तु और परमेश्वर पर निर्भरता दोनों को स्पष्ट करता है।
- source_word: דֶּרֶךְ יְשָׁרָה
  choice: सीधा मार्ग
  rationale: यह इब्रानी का निकट और सुबोध रूप है, जो सही मार्गदर्शन और सुरक्षित यात्रा—दोनों सम्भावित आशयों को एक ही चित्र में रहने देता है।
- source_word: לָנוּ וּלְטַפֵּנוּ וּלְכָל רְכוּשֵׁנוּ
  choice: अपने लिए, अपने बाल-बच्चों के लिए और अपनी सारी सम्पत्ति के लिए
  rationale: טף यात्रा-दल के छोटे बच्चों अथवा आश्रित बालकों को सूचित करता है; ‘बाल-बच्चे’ साधारण हिन्दी में स्वाभाविक है। רכוש को स्पष्टतः ‘सम्पत्ति’ कहा गया है।
theological_decisions:
- issue: उपवास-संबंधी मुहावरे לְהִתְעַנּוֹת का अनुवाद
  choice: अपने परमेश्वर के सामने अपने आप को दीन करें
  alternative: अपने परमेश्वर के सामने अपने आप को दुःख दें
  rationale: शाब्दिक विकल्प आत्मपीड़ा का अनुचित बोध करा सकता है। चुना हुआ पाठ उपवास से जुड़ी आत्म-विनय और आत्म-संयम की मुद्रा व्यक्त करता है, जबकि टिप्पणी मूल मुहावरे की व्यापकता सुरक्षित रखती है।
- issue: דֶּרֶךְ יְשָׁרָה का आशय
  choice: सीधा मार्ग
  alternative: सही मार्ग; सुरक्षित यात्रा
  rationale: प्रसंग यात्रा का है, पर इब्रानी पद केवल सुरक्षा तक सीमित नहीं है। ‘सीधा मार्ग’ मूल रूपक और सही मार्गदर्शन/सुरक्षित यात्रा के बीच का तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। ‘बाल-बच्चों’ से טף का सामूहिक और असुरक्षित छोटे आश्रितों वाला भाव स्वाभाविक हिन्दी में आता है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में अपने सम्बन्धित पदों के तुरंत बाद दिए गए हैं।
