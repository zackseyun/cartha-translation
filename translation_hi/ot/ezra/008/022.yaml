  text: כִּ֣י בֹ֗שְׁתִּי לִ/שְׁא֤וֹל מִן הַ/מֶּ֨לֶךְ֙ חַ֣יִל וּ/פָרָשִׁ֔ים לְ/עָזְרֵ֥/נוּ מֵ/אוֹיֵ֖ב בַּ/דָּ֑רֶךְ כִּֽי אָמַ֨רְנוּ לַ/מֶּ֜לֶךְ לֵ/אמֹ֗ר יַד אֱלֹהֵ֤י/נוּ עַל כָּל מְבַקְשָׁי/ו֙ לְ/טוֹבָ֔ה וְ/עֻזּ֣/וֹ וְ/אַפּ֔/וֹ עַ֖ל כָּל עֹזְבָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/022.yaml
  text: For I was ashamed to ask the king for troops and horsemen to help us against the enemy on the way[a], because we had said to the king, “The hand of our God is for good on all who seek him[b], but his strength and his anger are against all who forsake him.”
translation:
  language: hi
  text: क्योंकि राजा से सैनिक और घुड़सवार माँगने में मुझे लज्जा आई कि वे मार्ग में शत्रु के विरुद्ध हमारी सहायता करें,[a] क्योंकि हमने राजा से कहा था, “हमारे परमेश्वर का हाथ उसे खोजनेवाले सभी लोगों पर उनकी भलाई के लिए है,[b] पर उसका सामर्थ्य और उसका क्रोध उन सभी के विरुद्ध हैं जो उसे त्यागते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मार्ग में शत्रु से हमारी सहायता करें।” इब्रानी में “से” का अर्थ अधिक शाब्दिक है, पर यहाँ माँगी जाने वाली सैन्य सुरक्षा के कारण “शत्रु के विरुद्ध” प्रसंग के अनुकूल है।
    reason: lexical_alternative
  - marker: b
    text: “हमारे परमेश्वर का हाथ” इब्रानी अभिव्यक्ति है, जो उसकी सक्रिय कृपा या सामर्थ्य को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: בֹשְׁתִּי
  choice: मुझे ... लज्जा आई
  rationale: यह सामाजिक झेंप से अधिक गहरी लज्जा का भाव व्यक्त करता है और प्रसंग में स्वाभाविक हिन्दी है।
- source_word: חַיִל וּפָרָשִׁים
  choice: सैनिक और घुड़सवार
  rationale: חַיִל यहाँ राजा द्वारा उपलब्ध कराई जाने वाली सैन्य टुकड़ी को दर्शाता है; פָרָשִׁים का ठोस अर्थ घुड़सवार है।
- source_word: לְעָזְרֵנוּ מֵאוֹיֵב בַּדָּרֶךְ
  choice: वे मार्ग में शत्रु के विरुद्ध हमारी सहायता करें
  rationale: उद्देश्यसूचक रूप और यात्रा के दौरान सैन्य सुरक्षा का आशय स्पष्ट रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है।
- source_word: יַד אֱלֹהֵינוּ
  choice: हमारे परमेश्वर का हाथ
  rationale: ईश्वरीय सक्रिय सामर्थ्य और कृपा की इब्रानी मूर्त उपमा को सुरक्षित रखा गया है।
- source_word: עַל כָּל מְבַקְשָׁיו לְטוֹבָה
  choice: उन सभी की भलाई के लिए उनके साथ रहता है जो उसे खोजते हैं
  rationale: לְטוֹבָה का हितकारी अर्थ और עַל का संरक्षणकारी संबंध सहज आधुनिक हिन्दी में व्यक्त होता है।
- source_word: וְעֻזּוֹ וְאַפּוֹ
  choice: उसका सामर्थ्य और उसका क्रोध
  rationale: दोनों समन्वित संज्ञाओं को अलग रखा गया है; उन्हें मिलाकर एक ही धारणा नहीं बनाया गया।
- source_word: עַל כָּל עֹזְבָיו
  choice: उन सभी के विरुद्ध हैं जो उसे छोड़ देते हैं
  rationale: עזב का संबंधपरक अर्थ स्पष्ट है; 'छोड़ देते हैं' आधुनिक पाठकों के लिए 'त्याग देते हैं' से अधिक सहज है।
theological_decisions:
- issue: יַד אֱלֹהֵינוּ में परमेश्वर के लिए मानवरूपी अभिव्यक्ति
  choice: “हमारे परमेश्वर का हाथ” उपमा को बनाए रखना
  alternative: “हमारे परमेश्वर की शक्ति” या “हमारे परमेश्वर की कृपा”
  rationale: मूल पाठ ईश्वरीय सक्रियता की मूर्त उपमा देता है। इसे केवल शक्ति या कृपा कहने से अर्थ अनावश्यक रूप से सीमित हो जाता।
- issue: וְעֻזּוֹ וְאַפּוֹ में ईश्वरीय विरोध
  choice: “उसका सामर्थ्य और उसका क्रोध” को दो अलग तत्वों के रूप में रखना
  alternative: “उसका प्रचण्ड क्रोध”
  rationale: इब्रानी में दो समन्वित संज्ञाएँ हैं—सामर्थ्य और क्रोध। दोनों को बनाए रखने से भावात्मक विरोध और उसे कार्यान्वित करने वाली शक्ति, दोनों व्यक्त होते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। “लज्जा आई,” “सैनिक,” “घुड़सवार,” और “सामर्थ्य” जैसे शब्द सामान्य बोधगम्यता तथा मूल पाठ की गंभीरता के बीच संतुलन रखते हैं।
