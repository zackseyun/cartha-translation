base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/035.yaml
  text: 'Those who had come from the captivity[a], the sons of the exile, offered burnt offerings to the God of Israel: twelve bulls for all Israel, ninety-six rams, seventy-seven lambs, and twelve male goats as a sin offering[c][b]. All of it was a burnt offering to Yahweh.'
translation:
  language: hi
  text: 'जो लोग बँधुआई से आए थे—अर्थात् निर्वासन से लौटे लोग[a]—उन्होंने इस्राएल के परमेश्वर को होमबलियाँ चढ़ाईं: समस्त इस्राएल की ओर से[b] बारह बैल, छियानवे मेढ़े, सतहत्तर मेमने और पापबलि के लिए बारह नर बकरे। यह सब यहोवा के लिए होमबलि था[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “निर्वासन के पुत्र”; यह लौटे हुए निर्वासितों के लिए इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या “समस्त इस्राएल के लिए।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी पाठ में, “यह सब यहोवा के लिए होमबलि था।” ठीक पहले पापबलि के नर बकरों का उल्लेख होने पर भी मूल का यह कथन बिना सामंजस्य बैठाए रखा गया है।
    reason: textual_tension
lexical_decisions:
- source_word: הַבָּאִים מֵהַשְּׁבִי
  choice: जो लोग बँधुआई से आए थे
  rationale: निश्चितवाचक कृदन्त को कथानक के पूर्ण भूतकालीन संदर्भ में स्वाभाविक हिन्दी में व्यक्त किया गया है; שְׁבִי का बंदी अवस्था वाला ठोस भाव ‘बँधुआई’ से सुरक्षित रहता है।
- source_word: בְנֵי הַגּוֹלָה
  choice: निर्वासन से लौटे लोग
  rationale: शाब्दिक ‘निर्वासन के पुत्र’ आधुनिक हिन्दी में अस्वाभाविक और भ्रामक हो सकता है। प्रसंगानुकूल अर्थ मुख्य पाठ में दिया गया है और इब्रानी मुहावरा पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הִקְרִיבוּ עֹלוֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: बलिदान-संदर्भ में הקריב के लिए ‘चढ़ाना’ और עֹלָה के लिए प्रचलित ‘होमबलि’ सटीक तथा सहज धार्मिक शब्दावली है।
- source_word: לֵאלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर को
  rationale: לְ यहाँ बलि के प्राप्तकर्ता को सूचित करता है; ‘को’ स्वाभाविक हिन्दी रूप है।
- source_word: פָּרִים שְׁנֵים עָשָׂר עַל כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल की ओर से बारह बैल
  rationale: बलिदान-संदर्भ में עַל का प्रतिनिधिक भाव ‘की ओर से’ स्पष्ट करता है; इसे केवल स्थानवाचक अर्थ नहीं दिया गया।
- source_word: אֵילִים תִּשְׁעִים וְשִׁשָּׁה
  choice: छियानवे मेढ़े
  rationale: संख्या और पशु-नाम का सीधा आधुनिक हिन्दी अनुवाद।
- source_word: כְבָשִׂים שִׁבְעִים וְשִׁבְעָה
  choice: सतहत्तर मेमने
  rationale: बलिदानी सूची में כְּבָשִׂים के लिए ‘मेमने’ प्रचलित और प्रसंगानुकूल है।
- source_word: צְפִירֵי חַטָּאת
  choice: पापबलि के लिए बारह बकरे
  rationale: צְפִירֵי नर बकरों को और חַטָּאת यहाँ बलिदान की श्रेणी को दर्शाता है; हिन्दी में ‘पापबलि के लिए’ संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: הַכֹּל עוֹלָה לַיהוָה
  choice: यह सब यहोवा के लिए होमबलि था
  rationale: इब्रानी के समाहार-वाक्य को ज्यों का त्यों रखा गया है, यद्यपि ठीक पहले पापबलि का उल्लेख है; पाठगत तनाव को समतल नहीं किया गया।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी के स्थापित रूप ‘यहोवा’ से व्यक्त किया गया है, न कि सामान्य उपाधि से।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी पाठक के लिए स्थापित रूप है और नाम तथा उपाधि का भेद बनाए रखता है।
- issue: पापबलि के बकरों के बाद ‘यह सब ... होमबलि था’ का कथन
  choice: मूल पाठ के तनाव सहित समाहार-वाक्य को सुरक्षित रखना
  alternative: अंतिम कथन को केवल बैलों, मेढ़ों और मेमनों तक सीमित करके स्पष्ट करना
  rationale: मसोरेटिक पाठ दोनों बातें साथ रखता है। अनुवाद ने व्याख्यात्मक सामंजस्य बैठाकर इस वास्तविक अस्पष्टता अथवा तनाव को नहीं हटाया।
- issue: עַל כָּל יִשְׂרָאֵל का प्रतिनिधिक अर्थ
  choice: समस्त इस्राएल की ओर से
  alternative: समस्त इस्राएल के लिए
  rationale: बलिदान के प्रसंग में עַל प्रतिनिधित्व अथवा किसी की ओर से अर्पण का भाव दे सकता है। चुना हुआ रूप उस भाव को स्पष्ट रखता है, जबकि विकल्प अधिक व्यापक और कुछ अस्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज रजिस्टर अपनाया गया है। ‘होमबलि’ और ‘पापबलि’ जैसी परिचित बाइबलीय शब्दावली रखी गई है; कठिन इब्रानी पहचान-सूचक मुहावरे को अर्थानुसार मुख्य पाठ में और शाब्दिक रूप को पादटिप्पणी में दिया गया है।
