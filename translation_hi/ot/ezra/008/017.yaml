base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/017.yaml
  text: And I sent them to Iddo[a], the chief at the place Casiphia, and I put in their mouths words to speak to Iddo and his brothers, the temple servants at the place Casiphia[b], to bring us ministers for the house of our God.
translation:
  language: hi
  text: मैंने उन्हें कासिफ्या नामक स्थान के प्रधान इद्दो के पास भेजा, और उन्हें वे बातें बताईं जो उन्हें इद्दो और उसके भाइयों—कासिफ्या नामक स्थान के मंदिर-सेवकों[a]—से कहनी थीं, कि वे हमारे लिए हमारे परमेश्वर के भवन की सेवा करनेवाले लोग[b] ले आएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मंदिर-सेवक” के लिए परंपरागत पाठन “नतीन” है, जो मंदिर-सेवा से जुड़े एक मान्य वर्ग का नाम है। लिखित इब्रानी पाठ में הַנְּתוּנִים (“दिए हुए”) है, जबकि परंपरागत पाठन हַנְּתִינִים (“नतीन”) है। वाक्य को “इद्दो, उसके भाइयों और मंदिर-सेवकों” के रूप में अलग-अलग व्यक्तियों या समूहों के लिए भी समझा जा सकता है।
    reason: textual_and_lexical_note
  - marker: b
    text: यहाँ “सेवा करनेवाले लोग” परमेश्वर के भवन में सेवा करनेवालों को दर्शाता है; इससे किसी बाद के औपचारिक धार्मिक पद का अर्थ लेना आवश्यक नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וָאֹוצִיאָה אֹותָם עַל
  choice: मैंने उन्हें … के पास भेजा
  rationale: हिफ़ील रूप यहाँ प्रतिनिधियों को किसी व्यक्ति के पास भेजने के अर्थ में है; यह हिन्दी में स्वाभाविक रूप से उद्देश्य और दिशा दोनों व्यक्त करता है।
- source_word: אִדּוֹ הָרֹאשׁ
  choice: प्रधान इद्दो
  rationale: הָרֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ यह अधिकार या नेतृत्व के पद को दर्शाता है; ‘प्रधान’ संक्षिप्त और गरिमापूर्ण है।
- source_word: בְּכָסִפְיָא הַמָּקוֹם
  choice: कासिफ्या नामक स्थान
  rationale: इसमें स्थानवाचक नाम के साथ מָקוֹם को भी स्पष्ट रखा गया है, पर हिन्दी वाक्य-विन्यास स्वाभाविक बनाया गया है।
- source_word: וָאָשִׂימָה בְּפִיהֶם דְּבָרִים
  choice: मैंने उन्हें बताया कि वे … क्या कहें
  rationale: शाब्दिक मुहावरा ‘उनके मुँह में शब्द रखे’ का अर्थ संदेश देकर भेजना है। अर्थ को स्पष्ट आधुनिक हिन्दी में व्यक्त किया गया है, बिना संदेश की अधिकृत प्रकृति बदले।
- source_word: אֶל אִדּוֹ אָחִיו
  choice: इद्दो और उसके भाइयों … से
  rationale: अगला बहुवचन रूप पूरे समूह की ओर संकेत करता है। इसलिए אָחִיו को बहुवचन ‘उसके भाइयों’ समझना प्रसंग और वाक्य-संगति के अनुकूल है।
- source_word: הנתונים / הַנְּתִינִים
  choice: मन्दिर-सेवकों
  rationale: मसोरेटी पाठ में लिखित रूप और पढ़े जानेवाले रूप का अंतर है, पर यहाँ मान्य वर्ग ‘नतीन’ अभिप्रेत है। उसका कार्यात्मक अनुवाद सामान्य पाठक के लिए अधिक स्पष्ट है; पारंपरिक नाम पादटिप्पणी में दिया गया है।
- source_word: מְשָׁרְתִים
  choice: सेवा करनेवाले लोगों
  rationale: यह सेवा करनेवालों के लिए व्यापक कृदन्त है। इसे ‘मन्दिर-सेवक’ से अलग ढंग से प्रस्तुत किया गया है, ताकि הַנְּתִינִים नामक विशिष्ट वर्ग और माँगे गए सेवाकर्मियों के बीच शब्दगत भेद बना रहे।
- source_word: לְבֵית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन के लिए
  rationale: ‘परमेश्वर का भवन’ मूल इब्रानी रूपक और उसके धार्मिक आशय को बनाए रखता है; प्रसंग से मन्दिर स्पष्ट है।
theological_decisions:
- issue: הַנְּתִינִים को विशिष्ट मन्दिर-सेवक वर्ग के रूप में प्रस्तुत करना
  choice: मन्दिर-सेवक
  alternative: नतीन
  rationale: कार्य बतानेवाला अनुवाद आधुनिक पाठक के लिए स्पष्ट है, जबकि पारंपरिक वर्गनाम को पादटिप्पणी में सुरक्षित रखा गया है। इससे किसी बाद की धार्मिक पद-व्यवस्था को पाठ पर आरोपित नहीं किया जाता।
- issue: מְשָׁרְתִים को बाद के औपचारिक धर्माधिकारी पद से न जोड़ना
  choice: सेवा करनेवाले लोग
  alternative: सेवक / धर्मसेवक
  rationale: मूल शब्द यहाँ परमेश्वर के भवन में सेवा करनेवालों को दर्शाता है; यह आवश्यक नहीं कि वह किसी बाद के औपचारिक धार्मिक पद का नाम हो।
- issue: אִדּוֹ אָחִיו הַנְּתִינִים की वाक्यगत सम्बद्धता
  choice: इद्दो और उसके भाइयों—… मन्दिर-सेवकों—से
  alternative: इद्दो, उसके भाई और मन्दिर-सेवकों से
  rationale: संयोजक के बिना आया बहुवचन पद पहले बताए समूह की व्याख्या करता हुआ समझा गया है। डैश इस सम्बन्ध को दिखाता है, पर पादटिप्पणी वैकल्पिक वाक्य-विभाजन की संभावना खुली रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘बताया कि … क्या कहें’ इब्रानी मुहावरे का स्वाभाविक अर्थ देता है। ‘मन्दिर-सेवक’ और ‘सेवा करनेवाले लोग’ अलग रखे गए हैं, ताकि मूल के दो भिन्न पदों का अंतर दिखाई दे।
