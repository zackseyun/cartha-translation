  text: וַ/נָּב֖וֹא יְרוּשָׁלִָ֑ם וַ/נֵּ֥שֶׁב שָׁ֖ם יָמִ֥ים שְׁלֹשָֽׁה׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/032.yaml
  text: So we came to Jerusalem and stayed there three days.
translation:
  language: hi
  text: इस प्रकार हम यरूशलेम पहुँचे और वहाँ तीन दिन ठहरे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַנָּבוֹא
  choice: इस प्रकार हम... पहुँचे
  rationale: בוא का मूल अर्थ ‘आना’ है, पर यात्रा के गंतव्य यरूशलेम के साथ हिन्दी में ‘पहुँचे’ अधिक स्वाभाविक और प्रसंगानुकूल है। आरम्भिक וַ narrative sequence को आगे बढ़ाता है; ‘इस प्रकार’ पिछले वृत्तांत के परिणाम और क्रम दोनों को सहज रूप से जोड़ता है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: इस स्थान-नाम का प्रचलित मानक हिन्दी रूप।
- source_word: וַנֵּשֶׁב
  choice: और... ठहरे
  rationale: ישב का अर्थ बैठना, बसना, रहना या ठहरना हो सकता है। यात्रा के बाद केवल तीन दिन रुकने के प्रसंग में ‘ठहरे’ अस्थायी निवास को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: यह स्थानवाचक क्रियाविशेषण यरूशलेम की ओर संकेत करता है; ‘वहाँ’ इसका सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: יָמִים שְׁלֹשָׁה
  choice: तीन दिन
  rationale: यह अवधि बताने वाली इब्रानी अभिव्यक्ति है। हिन्दी में ‘तीन दिन ठहरे’ स्वाभाविक रूप से पूरी अवधि व्यक्त करता है; ‘तक’ या ‘के लिए’ जोड़ना आवश्यक नहीं।
