- source_word: יוֹסִפְיָה
  choice: योसिप्याह
  rationale: इब्रानी स्वरूप का निकट देवनागरी लिप्यंतरण।
- source_word: וְ/עִמּוֹ
  choice: उसके साथ
  rationale: नामित अगुवे के साथ आए समूह का सीधा और स्वाभाविक हिंदी संकेत।
- source_word: מֵאָה וְ/שִׁשִּׁים
  choice: '160'
  rationale: आधुनिक सूचीगत शैली में संख्या को अंकों में देना स्पष्ट है और अर्थ को नहीं बदलता।
- source_word: הַ/זְּכָרִים
  choice: पुरुष
  rationale: इब्रानी शब्द समूह के पुरुष सदस्यों को निर्दिष्ट करता है; हिंदी में ‘पुरुष’ सहज है, जबकि ‘नर’ मनुष्यों की ऐसी सूची में अस्वाभाविक लगेगा।
theological_decisions:
- issue: शलोमीत और ‘योसिप्याह का पुत्र’ के बीच संबंध
  choice: ‘वह योसिप्याह का पुत्र था’ को शलोमीत का परिचय माना गया
  alternative: मूल पाठ में किसी अनाम अगुवे को ‘योसिप्याह का पुत्र’ मानना, या पाठ में लुप्त नाम/वंश-सूचक पद मानना
  rationale: व्यंजनयुक्त मसोराई पाठ में ‘शलोमीत के पुत्रों में से, योसिप्याह का पुत्र’ संरचनात्मक रूप से कठिन है। उपलब्ध शब्दक्रम के निकट रहते हुए संबंध को पठनीय बनाया गया, पर कठिनाई को पादटिप्पणी में खुला रखा गया है और कोई अतिरिक्त नाम नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूचीगत है। ‘पुत्रों’ को मुख्य पाठ में औपचारिक निकटता के लिए रखा गया है, जबकि ‘वंशजों’ का स्वाभाविक अर्थ पादटिप्पणी में दिया गया है। मूल की कठिन संरचना को चुपचाप ठीक करने के बजाय पाठक के सामने स्पष्ट किया गया है।
