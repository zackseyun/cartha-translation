  text: और शलोमीत[a] के पुत्रों में से—वह योसिप्याह का पुत्र था—उसके साथ 160 पुरुष थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शलोमीत के वंशजों”; इब्रानी में शाब्दिक रूप से “शलोमीत के पुत्रों।”
    reason: lexical_alternative
  - marker: b
    text: इस पद का इब्रानी वाक्य-विन्यास कठिन है; उसमें शाब्दिक रूप से “शलोमीत के पुत्रों में से, योसिप्याह का पुत्र, और उसके साथ...” आता है। संभव है कि पाठ में अगुवे का कोई नाम या कुल-सूचक शब्द लुप्त हो गया हो।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के पुत्रों में से
  rationale: संयोजक, संबंधबोधक और ‘पुत्र’ के बहुवचन को बनाए रखता है तथा सूची में से किसी दल के प्रस्तुत किए जाने का भाव व्यक्त करता है। वंशावली-सूचियों में यह वंशजों या कुल के सदस्यों का भी सूचक हो सकता है।
- source_word: שְׁלוֹמִית
  choice: शलोमीत
  rationale: इब्रानी नाम का देवनागरी में निकट और उच्चारण-सुगम लिप्यंतरण।
