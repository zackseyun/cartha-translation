  choice: राजा के आदेश
  rationale: फ़ारसी प्रशासनिक संदर्भ में דָּתֵי राजकीय निर्देशों या फरमानों को दर्शाता है; ‘आदेश’ सरल, वर्तमान और उपयुक्त है।
