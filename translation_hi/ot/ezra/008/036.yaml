- source_word: פַחֲוֹת
  choice: राज्यपालों
  rationale: यह क्षेत्रीय शासकों अथवा प्रशासकों के लिए प्रयुक्त पद को स्पष्ट रूप से व्यक्त करता है।
- source_word: עֵבֶר הַנָּהָר
  choice: महानद के पार
  rationale: यह फ़रात के पश्चिमी क्षेत्र का फ़ारसी प्रशासनिक नाम है। ‘महानद’ संदर्भित नदी को स्पष्ट करता है, जबकि मूल के भौगोलिक पदनाम की संरचना बनाए रखता है।
- source_word: וְנִשְּׂאוּ
  choice: सहायता की
  rationale: נשא का मूल अर्थ ‘उठाना/वहन करना’ है, पर यहाँ इसका प्रसंगगत अर्थ व्यावहारिक सहयोग या समर्थन देना है।
- source_word: הָעָם
  choice: प्रजा
  rationale: राजकीय-प्रशासनिक संदर्भ में ‘प्रजा’ स्वाभाविक है और मूल के सामान्य ‘लोगों’ को किसी संकीर्ण पहचान तक सीमित नहीं करता।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: यह मूल अभिव्यक्ति ‘परमेश्वर का घर/भवन’ को बनाए रखता है; संदर्भ में इसका आशय मंदिर है।
