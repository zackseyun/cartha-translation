base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/036.yaml
  text: And they delivered the king’s decrees to the king’s satraps and the governors Beyond the River[c][b][a], and they supported the people and the house of God.
translation:
  language: hi
  text: उन्होंने राजा के आदेश उसके क्षत्रपों और नदी के उस पार[b] के राज्यपालों को सौंप दिए; तब इन अधिकारियों ने लोगों और परमेश्वर के भवन[c] को सहायता दी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सहारा दिया” या “मदद की।” हिब्रू क्रिया का शाब्दिक अर्थ “उठाना” या “वहन करना” है; यहाँ इसका अर्थ सहायता या समर्थन देना है।
    reason: lexical_alternative
  - marker: b
    text: “नदी के उस पार” फ़ारसी प्रशासन का पदनाम है, जो फ़रात नदी के पश्चिम के क्षेत्र के लिए प्रयुक्त होता था।
    reason: cultural_note
  - marker: c
    text: या, “परमेश्वर का मंदिर।”
    reason: lexical_alternative
