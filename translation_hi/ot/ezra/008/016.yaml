  text: וָ/אֶשְׁלְחָ֡/ה לֶ/אֱלִיעֶ֡זֶר לַ/אֲרִיאֵ֡ל לִֽ֠/שְׁמַעְיָה וּ/לְ/אֶלְנָתָ֨ן וּ/לְ/יָרִ֜יב וּ/לְ/אֶלְנָתָ֧ן וּ/לְ/נָתָ֛ן וְ/לִ/זְכַרְיָ֥ה וְ/לִ/מְשֻׁלָּ֖ם רָאשִׁ֑ים וּ/לְ/יוֹיָרִ֥יב וּ/לְ/אֶלְנָתָ֖ן מְבִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/016.yaml
  text: Then I sent for Eliezer[a], Ariel, Shemaiah, Elnathan, Jarib, Elnathan, Nathan, Zechariah, and Meshullam, heads, and for Joiarib and Elnathan[b], men of understanding.
translation:
  language: hi
  text: तब मैंने एलीएजेर, अरीएल, शमायाह, एलनातान, यारीब, एलनातान, नातान, जकर्याह और मशुल्लाम—जो मुखिया[a] थे—और योयारीब तथा एलनातान—जो समझ-बूझ रखनेवाले पुरुष[b] थे—को बुलावा भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘सिर’; अर्थात् प्रमुख या अगुए।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘विवेकी पुरुष’ या ‘विद्वान पुरुष’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁלְחָה
  choice: तब मैंने ... को बुलावा भेजा
  rationale: वाव-क्रमिक क्रिया कथा की अगली कार्रवाई बताती है। प्रसंग में एज्रा इन व्यक्तियों को अपने पास बुलाता है, इसलिए केवल ‘भेजा’ के बजाय ‘बुलावा भेजा’ स्वाभाविक और संदर्भानुकूल है।
- source_word: לֶאֱלִיעֶזֶר ... וּלְאֶלְנָתָן
  choice: एलीएजेर ... एलनातान ... को
  rationale: बार-बार आया ל उन व्यक्तियों को चिह्नित करता है जिनके पास बुलावा भेजा गया; हिन्दी में ‘को’ के प्रयोग से यह संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: רָאשִׁים
  choice: मुखिया
  rationale: शब्द का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ यह प्रमुख अथवा नेतृत्वकारी व्यक्तियों के लिए प्रयुक्त है। ‘मुखिया’ मूल बिंब से जुड़ा रहते हुए आधुनिक हिन्दी में स्पष्ट है।
- source_word: מְבִינִים
  choice: समझ-बूझ रखनेवाले पुरुष
  rationale: בין का यह कृदन्त समझने, परखने या विवेक रखने की क्षमता बताता है। यह अनुवाद किसी निश्चित पद, जैसे ‘शिक्षक’, को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: וּלְיוֹיָרִיב וּלְאֶלְנָתָן מְבִינִים
  choice: योयारीब तथा एलनातान नामक समझ-बूझ रखनेवाले पुरुषों को
  rationale: अंतिम विशेषणात्मक पद सबसे स्वाभाविक रूप से अंतिम दो नामों का वर्णन करता है और उन्हें पहले बताए गए मुखियाओं से अलग पहचान देता है।
- source_word: יוֹיָרִיב
  choice: योयारीब
  rationale: यह हिब्रू नाम का निकट देवनागरी लिप्यंतरण है; संभव विस्तृत रूप ‘यहोयारीब’ को पाठ में आरोपित नहीं किया गया।
- source_word: אֶלְנָתָן
  choice: एलनातान
  rationale: यह नाम पद में तीन बार आता है; स्रोत-पाठ के अनुसार तीनों बार इसे बनाए रखा गया है, क्योंकि संभवतः ये एक ही नाम वाले अलग-अलग व्यक्ति हैं।
