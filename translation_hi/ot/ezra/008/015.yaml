base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/015.yaml
  text: I gathered them to the river that comes to Ahava[a], and we camped there three days. Then I examined the people and the priests[b], but I found none of the sons of Levi there.
translation:
  language: hi
  text: मैंने उन्हें उस नदी तक इकट्ठा किया जो अहवा की ओर बहती है[a], और हमने वहाँ तीन दिन डेरा डाला। तब मैंने लोगों और याजकों को ध्यान से देखा, पर वहाँ मुझे लेवी के वंशजों में से कोई नहीं मिला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस नहर तक जो अहवा की ओर जाती है।” यहाँ प्रयुक्त हिब्रू शब्द नदी या मनुष्य द्वारा बनाई गई जलधारा, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “लेवी के पुत्रों में से,” अर्थात लेवीवंशी।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקְבְּצֵם
  choice: मैंने उन्हें ... इकट्ठा किया
  rationale: קבץ का सामान्य अर्थ इकट्ठा या एकत्र करना है; यह चयन एज्रा की सक्रिय भूमिका को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַנָּהָר הַבָּא אֶל אַהֲוָא
  choice: उस नदी ... जो अहवा की ओर बहती है
  rationale: נָהָר सामान्यतः नदी है, पर इस ऐतिहासिक परिवेश में नहर या जलधारा भी हो सकती है। בוא के कृदंत को प्रसंगानुसार दिशा सूचक ‘की ओर बहती है’ कहा गया है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וַנַּחֲנֶה
  choice: हमने ... डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना या शिविर लगाना है; ‘डेरा डाला’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יָמִים שְׁלֹשָׁה
  choice: तीन दिन
  rationale: हिब्रू संख्या-विन्यास का स्वाभाविक हिन्दी रूप।
- source_word: וָאָבִינָה
  choice: मैंने ... जाँच की
  rationale: यहाँ בין का रूप सावधानी से देखने-परखने का भाव देता है; समूह की संरचना की समीक्षा के प्रसंग में ‘जाँच की’ उपयुक्त है।
- source_word: בָעָם וּבַכֹּהֲנִים
  choice: लोगों और याजकों की
  rationale: עָם और כֹּהֲנִים के सीधे, प्रचलित हिन्दी समतुल्य; दोनों समूहों के बीच पाठ का भेद बना रहता है।
- source_word: וּמִבְּנֵי לֵוִי
  choice: लेवी के वंशजों में से
  rationale: शाब्दिक भाव ‘लेवी के पुत्रों में से’ है। हिन्दी में ‘वंशजों’ से वंशावली का आशय स्पष्ट रहता है और यह ‘लेवियों’ की अपेक्षा मूल अभिव्यक्ति के निकट है।
- source_word: לֹא מָצָאתִי שָׁם
  choice: वहाँ मुझे ... कोई नहीं मिला
  rationale: नकारात्मक हिब्रू वाक्य का स्वाभाविक हिन्दी रूप, जो पूर्ण अनुपस्थिति को स्पष्ट करता है।
