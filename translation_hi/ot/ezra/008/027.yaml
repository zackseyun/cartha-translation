  text: and twenty bowls of gold worth a thousand darics[a], and two vessels of fine gleaming bronze[b], precious as gold.
translation:
  language: hi
  text: और सोने के बीस कटोरे, जिनका मूल्य एक हज़ार दारिक[a] था, और उत्तम चमकदार काँसे के दो पात्र[b], जो सोने के समान बहुमूल्य थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सोने के बीस कटोरे, जिनका कुल मूल्य एक हज़ार दारिक था।” इब्रानी पाठ में यह संख्या कटोरों के कुल मूल्य को बता सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “उत्तम माँजे हुए काँसे के दो पात्र।” काँसे का वर्णन करने वाली दुर्लभ इब्रानी अभिव्यक्ति संभवतः विशेष रूप से उत्तम और चमकदार कारीगरी को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְפֹרֵי
  choice: कटोरे
  rationale: यह शब्द कटोरे के आकार के पात्रों को दर्शाता है; भंडार-सूची के प्रसंग में ‘कटोरे’ सहज और सुस्पष्ट है।
- source_word: לַאֲדַרְכֹנִים אָלֶף
  choice: जिनका मूल्य एक हज़ार दारिक था
  rationale: ל को यहाँ मूल्यांकन-सूचक समझना प्रसंगानुकूल है। ऐतिहासिक फ़ारसी मुद्रा/भार-इकाई को सामान्य ‘सिक्कों’ में बदलने के बजाय ‘दारिक’ रखा गया है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: यह शब्द ताँबे या काँसे को सूचित कर सकता है; निर्मित पात्रों के इस प्राचीन संदर्भ में ‘काँसा’ अधिक संभावित और स्वाभाविक है।
- source_word: מֻצְהָב טוֹבָה
  choice: उत्तम चमकदार
  rationale: दुर्लभ अभिव्यक्ति संभवतः धातु की उच्च गुणवत्ता और चमकदार परिष्करण बताती है। ‘चमकदार’ सोने की परत चढ़ी होने का अनावश्यक दावा नहीं करता।
- source_word: חֲמוּדֹת כַּזָּהָב
  choice: जो सोने के समान बहुमूल्य थे
  rationale: חֲמוּדֹת मूल्यवान या मनोहर होने का भाव देता है, और כַּזָּהָב स्पष्ट तुलना करता है; हिन्दी में यह पूरा वाक्यांश स्वाभाविक है।
