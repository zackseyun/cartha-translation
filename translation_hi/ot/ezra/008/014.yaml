  text: 'And from the sons of Bigvai: Uthai and Zabbud[b][a], and with them seventy males.'
translation:
  language: hi
  text: 'और बिगवै के वंशजों में से: ऊतै और जब्बूद[a], और उसके[b] साथ सत्तर पुरुष।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पाठ-परंपराओं और प्राचीन अनुवादों में यहाँ दूसरा नाम भिन्न मिलता है; मसोरेटिक पाठ में ‘जब्बूद’ है।
    reason: textual_variant
  - marker: b
    text: इब्रानी पाठ में ‘उसके साथ’ एकवचन है, हालाँकि दो नामों के कारण कुछ अनुवाद इसे ‘उनके साथ’ कर देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: सूची के इस वंश-संबंधी संदर्भ में בְּנֵי का अर्थ केवल प्रत्यक्ष पुत्र नहीं, बल्कि व्यापक रूप से वंशज अथवा कुल के सदस्य भी हो सकता है; इसलिए स्वाभाविक और अर्थ-सटीक हिंदी में ‘वंशजों’ चुना गया।
- source_word: בִגְוַי
  choice: बिगवै
  rationale: इब्रानी व्यक्तिवाचक/कुलनाम का देवनागरी लिप्यंतरण।
- source_word: עוּתַי
  choice: ऊतै
  rationale: इब्रानी व्यक्तिवाचक नाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
- source_word: ו/זבוד
  choice: और जब्बूद
  rationale: मसोरेटिक पाठ זבוד को आधार बनाकर नाम का लिप्यंतरण किया गया और आरंभिक संयोजक ו को ‘और’ से व्यक्त किया गया।
- source_word: וְ/עִמּ/וֹ
  choice: और उसके साथ
  rationale: इब्रानी प्रत्यय तृतीय पुरुष एकवचन पुल्लिंग है; दो नामों के उल्लेख के बावजूद पाठ की वास्तविक एकवचन अभिव्यक्ति सुरक्षित रखी गई।
- source_word: שִׁבְעִים
  choice: सत्तर
  rationale: मूल संख्या का सीधा और स्पष्ट हिंदी रूप।
- source_word: הַ/זְּכָרִים
  choice: पुरुष
  rationale: זְכָרִים इस गणना-सूची में पुरुष लिंग के व्यक्तियों को निर्दिष्ट करता है; आधुनिक हिंदी में ‘पुरुष’ स्वाभाविक और गरिमापूर्ण है।
