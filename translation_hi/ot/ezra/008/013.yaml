base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/013.yaml
  text: 'And from the sons of Adonikam[a], the last ones, and these were their names: Eliphelet, Jeiel, and Shemaiah, and with them sixty males.'
translation:
  language: hi
  text: 'और अदोनीकाम के वंशजों में से जो अन्तिम लोग थे[a], उनके नाम ये थे: एलीपेलेत, यीएल और शमायाह; और उनके साथ साठ पुरुष थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाद वाले लोग” अथवा “अन्तिम दल।” इब्रानी सम्भवतः अदोनीकाम के वंश से आए इस दल को अन्तिम दल बताता है, शायद पहले कहीं उल्लिखित दल से अलग करने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: और ... के वंशजों में से
  rationale: सूची और वंशावली के इस प्रसंग में בְּנֵי केवल प्रत्यक्ष पुत्रों के बजाय वंशजों या कुल के सदस्यों को भी दर्शा सकता है; इसलिए स्वाभाविक और सन्दर्भानुकूल हिन्दी में ‘वंशजों’ चुना गया।
- source_word: אֲדֹנִיקָם
  choice: अदोनीकाम
  rationale: व्यक्तिवाचक नाम का मूल उच्चारण के निकट देवनागरी लिप्यन्तरण।
- source_word: אַחֲרֹנִים
  choice: जो अन्तिम लोग थे
  rationale: शब्द का अर्थ ‘अन्तिम’, ‘बाद वाले’ या ‘पिछले’ हो सकता है। मुख्य पाठ में सम्भावित अन्तिम दल का भाव रखा गया है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: उनके नाम ये थे
  rationale: इब्रानी का मानक सूची-परिचायक वाक्यांश हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त किया गया।
- source_word: אֱלִיפֶלֶט
  choice: एलीपेलेत
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट लिप्यन्तरण।
- source_word: יְעִיאֵל
  choice: यीएल
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट लिप्यन्तरण।
- source_word: וּשְׁמַעְיָה
  choice: और शमायाह
  rationale: व्यक्तिवाचक नाम का लिप्यन्तरण और सूची का संयोजक बनाए रखा गया।
- source_word: וְעִמָּהֶם
  choice: और उनके साथ
  rationale: साथ होने का अर्थ तथा इब्रानी संयोजन दोनों सुरक्षित रखे गए।
- source_word: שִׁשִּׁים
  choice: साठ
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: הַזְּכָרִים
  choice: पुरुष
  rationale: यहाँ शब्द पुरुष-लिंग के व्यक्तियों को निर्दिष्ट करता है। हिन्दी में ‘नर’ मनुष्यों की ऐसी सूची में अस्वाभाविक है; ‘पुरुष’ अर्थ को सम्मानजनक और सहज ढंग से व्यक्त करता है।
