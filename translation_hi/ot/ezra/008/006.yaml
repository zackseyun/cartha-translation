lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: सूची में अगले कुल-समूह का परिचय देता है। यहाँ בני का आशय केवल प्रत्यक्ष पुत्रों से नहीं, वंशजों से है; इसलिए आधुनिक हिन्दी में यह अधिक स्पष्ट और स्वाभाविक है।
- source_word: עָדִין
  choice: आदीन
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: עֶבֶד
  choice: एबेद
  rationale: यहाँ यह ‘दास’ अर्थ वाला सामान्य संज्ञा नहीं, व्यक्तिनाम है; इसलिए इसका लिप्यंतरण किया गया है।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली-सूचक पद का संक्षिप्त और सटीक हिन्दी रूप।
- source_word: יוֹנָתָן
  choice: योनातान
  rationale: इब्रानी व्यक्तिनाम का प्रचलित, स्रोत-समीप देवनागरी रूप।
- source_word: וְ/עִמּוֹ
  choice: और उसके साथ
  rationale: नामित अगुए के साथ आए लोगों की संख्या को जोड़ने वाली इब्रानी सूची-संरचना सुरक्षित रखता है।
- source_word: חֲמִשִּׁים
  choice: पचास
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: הַזְּכָרִים
  choice: पुरुष
  rationale: इब्रानी शब्द पुरुष-लिंग को विशेष रूप से बताता है। मनुष्यों के लिए हिन्दी में ‘पुरुष’ सटीक और स्वाभाविक है; ‘नर’ अत्यधिक जैविक और अप्राकृतिक लगेगा।
