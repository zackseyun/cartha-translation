- source_word: וּכְלֵי כֶסֶף
  choice: चाँदी के पात्र
  rationale: मन्दिर के भंडार की सूची में כְּלִי के लिए 'पात्र' स्वाभाविक और गरिमापूर्ण व्यापक शब्द है।
- source_word: מֵאָה לְכִכָּרִים
  choice: सौ किक्कार के मूल्य के
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ अस्पष्ट है; सन्दर्भगत मूल्यांकन का अर्थ व्यक्त करते हुए हिन्दी में आवश्यक संबंध स्पष्ट किया गया है।
- source_word: זָהָב מֵאָה כִכָּר
  choice: सौ किक्कार सोना
  rationale: संख्या, भार-इकाई और धातु को हिन्दी की स्वाभाविक सूची-रचना में प्रस्तुत किया गया है।
