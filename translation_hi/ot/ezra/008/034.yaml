translation:
  language: hi
  text: हर वस्तु की गिनती और तौल की गई, और उसी समय कुल भार दर्ज किया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּמִסְפָּר
  choice: गिनती
  rationale: מִסְפָּר का अर्थ संख्या या गिनती है। भेंट की गई वस्तुओं की जाँच के प्रसंग में ‘गिनती’ सहज और सटीक प्रशासनिक अर्थ देता है।
- source_word: בְּמִשְׁקָל
  choice: तौल
  rationale: מִשְׁקָל ‘भार/तौल’ को दर्शाता है। ‘गिनती और तौल’ मूल के समानांतर पदों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לַכֹּל
  choice: हर वस्तु की
  rationale: यह पद समूची सौंपी गई सामग्री पर गिनती और तौल लागू होने का भाव व्यक्त करता है। ‘हर वस्तु की’ उस व्यापकता को स्पष्ट, सहज हिन्दी में सामने लाता है।
- source_word: וַיִּכָּתֵב
  choice: लिख लिया गया
  rationale: כתב के निफ़अल रूप का अर्थ ‘लिखा गया’ है। प्रशासनिक अभिलेख के इस प्रसंग में ‘लिख लिया गया’ औपचारिक रूप से दर्ज किए जाने का स्वाभाविक हिन्दी बोध देता है।
- source_word: כָּל הַמִּשְׁקָל
  choice: कुल तौल
  rationale: शाब्दिक भाव ‘सारा तौल/समस्त भार’ है। यहाँ ‘कुल तौल’ सभी वस्तुओं के संयुक्त तौल को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּעֵת הַהִיא
  choice: उसी समय
  rationale: यह कालवाचक पद जाँच और अभिलेखन के उस निश्चित अवसर की ओर संकेत करता है; ‘उसी समय’ उसके संकेतात्मक बल को बनाए रखता है।
