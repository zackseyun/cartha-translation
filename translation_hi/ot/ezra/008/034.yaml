translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पहले खंड में इब्रानी की निहित क्रिया को हिन्दी में ‘की गई’ से स्पष्ट किया गया है; ‘कुल तौल’ प्रशासनिक सूची के प्रसंग के अनुकूल है।
