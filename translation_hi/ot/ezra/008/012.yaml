  text: 'And from the sons of Azgad: Johanan son of Hakkatan[b][a], and with him 110 males.'
translation:
  language: hi
  text: और अजगाद के वंशजों[a] में से हक्कातान[b] के पुत्र योहानान, और उसके साथ 110 पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अजगाद के पुत्रों में से’; इब्रानी में ‘पुत्र’ व्यापक वंश या कुल के सदस्यों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘हक्कातान’ का अर्थ ‘छोटा’ या ‘कम उम्र वाला’ भी लिया जा सकता है; तब अनुवाद होगा, ‘छोटे के पुत्र योहानान।’
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי עַזְגָּד
  choice: और अजगाद के वंशजों में से
  rationale: בְּנֵי यहाँ केवल प्रत्यक्ष पुत्रों के बजाय व्यापक वंश या कुल को दर्शाता है; सूची के संदर्भ में ‘वंशजों’ स्वाभाविक और अर्थ-सटीक है।
- source_word: יוֹחָנָן
  choice: योहानान
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן הַ/קָּטָן
  choice: हक्कातान के पुत्र
  rationale: वंशावली-सूची में הַקָּטָן को व्यक्तिनाम मानना सबसे संभावित है; वर्णनात्मक अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְ/עִמּוֹ
  choice: और उसके साथ
  rationale: सूची में नामित अगुवे के साथ आए दल की संख्या बताने वाला इब्रानी सूत्र; संयोजक ‘और’ भी सुरक्षित है।
- source_word: מֵאָה וַ/עֲשָׂרָה
  choice: '110'
  rationale: अर्थ ‘एक सौ दस’ है; अंक आधुनिक सूची-शैली में स्पष्ट और सहज हैं।
- source_word: הַ/זְּכָרִים
  choice: पुरुष
  rationale: זְכָרִים पुरुष लिंग के लोगों को स्पष्ट करता है; हिंदी में व्यक्तियों की ऐसी गणना के लिए ‘पुरुष’ स्वाभाविक है, जबकि ‘नर’ असहज होता।
