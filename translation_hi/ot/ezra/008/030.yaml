base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/030.yaml
  text: So the priests and the Levites received the weighed amount of the silver[a], the gold, and the vessels, to bring them to Jerusalem[b], to the house of our God.
translation:
  language: hi
  text: इसलिए याजकों और लेवियों ने चाँदी, सोने और पात्रों का तौला गया परिमाण[a] ग्रहण किया, ताकि वे उन्हें यरूशलेम को हमारे परमेश्वर के भवन में ले जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी, सोने और पात्रों का भार।” इब्रानी शब्द तौले गए परिमाण या भार—दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקִבְּלוּ
  choice: ग्रहण किया
  rationale: यहाँ क्रिया का अर्थ एज्रा और उसके साथियों से मूल्यवान वस्तुएँ अपनी अभिरक्षा में लेना है। ‘ग्रहण किया’ दायित्व के हस्तांतरण को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों और लेवियों ने
  rationale: दोनों निश्चित बहुवचन समूहों का मानक हिन्दी रूप; कर्ता के कारक को ‘ने’ से स्पष्ट किया गया है।
- source_word: מִשְׁקַל
  choice: तौला हुआ परिमाण
  rationale: शब्द तौल से निर्धारित भार अथवा मात्रा को सूचित कर सकता है। संदर्भ में सौंपी गई बहुमूल्य वस्तुओं का लेखाबद्ध, तौला हुआ परिमाण अभिप्रेत है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: चाँदी, सोने और पात्रों का
  rationale: כסף और זהב के सीधे अर्थ रखे गए हैं। כלים व्यापक रूप से वस्तुओं या उपकरणों के लिए आता है, पर मन्दिर-संबंधी संदर्भ में ‘पात्र’ उपयुक्त और परिचित है।
- source_word: לְהָבִיא
  choice: ताकि वे उन्हें ... ले जाएँ
  rationale: लामेद सहित infinitive उद्देश्य व्यक्त करता है। हिन्दी में उद्देश्य और पूर्वोक्त वस्तुओं को स्वाभाविक रूप से स्पष्ट करने के लिए यह रचना अपनाई गई है।
- source_word: לִירוּשָׁלִַם לְבֵית אֱלֹהֵינוּ
  choice: यरूशलेम में हमारे परमेश्वर के भवन तक
  rationale: 'दोनों गंतव्यों का संबंध हिन्दी में स्पष्ट किया गया है: व्यापक गंतव्य यरूशलेम और उसके भीतर विशिष्ट गंतव्य परमेश्वर का भवन। ‘भवन’ मूल בית को बनाए रखता है, जबकि संदर्भगत ‘मन्दिर’ पादटिप्पणी में दिया गया है।'
