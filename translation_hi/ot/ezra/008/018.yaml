base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/018.yaml
  text: And by the good hand of our God upon us[a], they brought to us a man of insight from the sons of Mahli son of Levi, son of Israel—namely Sherebiah, and his sons and his brothers, eighteen.
translation:
  language: hi
  text: हम पर हमारे परमेश्वर का भला हाथ होने के कारण[a] वे हमारे पास महली के वंशजों में से—महली, जो लेवी का पुत्र था और लेवी इस्राएल का पुत्र था—एक समझदार पुरुष को ले आए, अर्थात् शेरेब्याह[b], उसके पुत्रों और भाइयों समेत; कुल अठारह जन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसा हमारे परमेश्वर का भला हाथ हम पर था।” इब्रानी मुहावरा परमेश्वर की अनुग्रहपूर्ण सहायता और देखभाल को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “और शेरेब्याह।” यहाँ इसे पहले बताए गए समझदार पुरुष की पहचान माना गया है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: वे हमारे पास ... ले आए
  rationale: בוא के हिफ़ील रूप का सामान्य अर्थ ‘लाना’ है; ‘ले आए’ हिंदी कथा-शैली में गंतव्य ‘हमारे पास’ के साथ स्वाभाविक है।
- source_word: כְּיַד אֱלֹהֵינוּ הַטּוֹבָה עָלֵינוּ
  choice: हमारे परमेश्वर का भला हाथ हम पर था, इसलिए
  rationale: यह वाक्य-विन्यास परमेश्वर के अनुग्रहपूर्ण मार्गदर्शन और सहायता को व्यक्त करने वाली इब्रानी ‘हाथ’ की सजीव उपमा बनाए रखता है, साथ ही आधुनिक हिंदी में सहज है।
- source_word: אִישׁ שֶׂכֶל
  choice: एक समझदार पुरुष
  rationale: שֶׂכֶל यहाँ समझ-बूझ और विवेक का भाव देता है; ‘समझदार’ साधारण पाठक के लिए स्वाभाविक है और ‘पुरुष’ मूल के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: מִבְּנֵי מַחְלִי
  choice: महली के वंशजों में से
  rationale: वंशावली के प्रसंग में בָּנִים प्रत्यक्ष पुत्रों से अधिक व्यापक रूप से वंशजों को सूचित कर सकता है; ‘वंशजों’ से हिंदी में आशय स्पष्ट होता है।
- source_word: בֶּן לֵוִי בֶּן יִשְׂרָאֵל
  choice: महली लेवी का पुत्र और लेवी इस्राएल का पुत्र था
  rationale: दोहराए गए בֶּן की वंशावली-श्रृंखला को स्पष्ट हिंदी वाक्य में रखा गया है, बिना नामों के संबंध को अस्पष्ट किए।
- source_word: וְשֵׁרֵבְיָה
  choice: अर्थात् शेरेब्याह
  rationale: संदर्भ में नाम पहले बताए गए ‘समझदार पुरुष’ की पहचान करता प्रतीत होता है। इब्रानी में आरंभिक וְ (‘और’) होने के कारण शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּבָנָיו וְאֶחָיו
  choice: उसके पुत्रों और भाइयों समेत
  rationale: यह शेरेब्याह से जुड़े पारिवारिक समूह को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁמֹנָה עָשָׂר
  choice: वे अठारह जन थे
  rationale: इब्रानी केवल संख्या देता है; हिंदी में गणना का आशय स्पष्ट करने के लिए ‘जन’ जोड़ा गया है, जो समूह के व्यक्तियों को दर्शाता है।
theological_decisions:
- issue: परमेश्वर के ‘भले हाथ’ वाली ईश्वरीय प्रबंध की उपमा
  choice: हमारे परमेश्वर का भला हाथ हम पर था, इसलिए
  alternative: हमारे परमेश्वर के भले हाथ के हम पर होने के अनुसार
  rationale: चुना हुआ पाठ परमेश्वर के अनुग्रहपूर्ण और प्रभावी प्रबंध का संकेत देता है, पर उसे किसी विस्तृत धार्मिक व्याख्या में नहीं बदलता; साथ ही मूल ‘हाथ’ की उपमा को बनाए रखता है।
- issue: ‘समझदार पुरुष’ और शेरेब्याह के बीच संबंध
  choice: अर्थात् शेरेब्याह
  alternative: और शेरेब्याह
  rationale: प्रसंग और अठारह की समूह-संख्या शेरेब्याह को उसी समझदार पुरुष की पहचान मानने का समर्थन करते हैं, पर इब्रानी संयोजक के कारण शाब्दिक वैकल्पिक पाठ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की सहज, गरिमापूर्ण कथा-शैली में रखी गई है। ‘भला हाथ’ मूल इब्रानी बिंब को सुरक्षित रखता है; ‘वंशज’ वंशावली के आशय को स्पष्ट करता है। लंबे वंशावली-वाक्य को डैश और पुनरुक्त नामों द्वारा पठनीय बनाया गया है।
