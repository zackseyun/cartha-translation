base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/024.yaml
  text: 'Then I set apart twelve of the leading priests: Sherebiah[a], Hashabiah[b], and with them ten of their brothers.'
translation:
  language: hi
  text: 'तब मैंने याजकों के प्रधानों में से बारह को अलग किया: शेरेब्याह, हशब्याह और उनके साथ उनके भाइयों[b] में से दस को।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य-विन्यास का अर्थ यह भी हो सकता है: “तब मैंने याजकों के प्रधानों में से बारह को, और शेरेब्याह, हशब्याह तथा उनके साथ उनके भाइयों में से दस को अलग किया।” इस अर्थ में शेरेब्याह, हशब्याह और उनके साथ के दस भाई पहले बताए गए बारह के अतिरिक्त होंगे।'
    reason: textual_or_syntactic_ambiguity
  - marker: b
    text: “भाइयों” से व्यापक अर्थ में उनके संबंधी या साथी भी अभिप्रेत हो सकते हैं; इब्रानी में पुरुषवाचक पारिवारिक शब्द प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאַבְדִּילָה
  choice: तब मैंने ... अलग किया
  rationale: בדל के हिफ़ील रूप का मूल अर्थ ‘अलग करना’ या ‘अलग ठहराना’ है। यहाँ लोगों को विशेष दायित्व के लिए चुना जा रहा है; ‘अलग किया’ अर्थ और कथा-क्रम दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשָּׂרֵי הַכֹּהֲנִים
  choice: याजकों के प्रधानों में से
  rationale: שַׂר पदाधिकारी, प्रधान या अगुआ को सूचित करता है, और מִן यहाँ समूह में से चयन का भाव देता है। ‘प्रधानों में से’ इस संरचना को स्पष्ट रूप से बनाए रखता है।
- source_word: שְׁנֵים עָשָׂר
  choice: बारह
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: לְשֵׁרֵבְיָה חֲשַׁבְיָה
  choice: शेरेब्याह, हशब्याह
  rationale: व्यक्तिवाचक नामों का देवनागरी में लिप्यंतरण किया गया है। לְ से उत्पन्न वाक्य-संबंध की अनिश्चितता को मुख्य पाठ में सहज विराम और पादटिप्पणी [a] द्वारा सुरक्षित रखा गया है।
- source_word: וְעִמָּהֶם
  choice: और उनके साथ
  rationale: संयोजक और संबंधसूचक पदबंध दोनों को रखा गया है, जिससे इब्रानी की योगात्मक रचना बनी रहती है।
- source_word: מֵאֲחֵיהֶם
  choice: उनके भाइयों में से
  rationale: אָח का सीधा अर्थ ‘भाई’ है; מִן का समूह में से चयन वाला भाव ‘में से’ द्वारा व्यक्त किया गया है। व्यापक संभावित अर्थ पादटिप्पणी [b] में दिया गया है।
- source_word: עֲשָׂרָה
  choice: दस
  rationale: मूल संख्या का सीधा अनुवाद।
theological_decisions:
- issue: क्या शेरेब्याह, हशब्याह और दस भाई पहले बताए गए बारह में सम्मिलित हैं
  choice: मुख्य पाठ में उन्हें बारह की पहचान/गणना के रूप में प्रस्तुत किया गया है
  alternative: बारह प्रधान याजकों के अतिरिक्त शेरेब्याह, हशब्याह और उनके दस भाइयों को अलग किया गया
  rationale: इब्रानी में नामों से पहले לְ और फिर योगात्मक पदबंध के कारण वाक्य-संबंध असामान्य तथा विवाद्य है। प्रचलित सन्दर्भगत समझ मुख्य पाठ में रखी गई है, पर वैकल्पिक गणना को पादटिप्पणी [a] में स्पष्ट किया गया है ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट रखी गई है। ‘याजक’, ‘प्रधान’ और ‘अलग किया’ जैसे परिचित बाइबिलीय शब्दों का प्रयोग किया गया है, जबकि कठिन इब्रानी वाक्यरचना की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
