  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבְּנֵי יוֹאָב
  choice: योआब के वंशजों में से
  rationale: सूची में यह पदबंध योआब के वंश-समूह में से आए लोगों का परिचय देता है। ‘वंशजों’ से आधुनिक हिन्दी में आशय स्वाभाविक और स्पष्ट रहता है, जबकि इसे केवल प्रत्यक्ष पुत्रों तक सीमित नहीं किया जाता।
- source_word: עֹבַדְיָה
  choice: ओबद्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן יְחִיאֵל
  choice: यहीएल का पुत्र
  rationale: בֶּן प्रत्यक्ष वंश-संबंध का सामान्य सूचक है; नाम יְחִיאֵל को ‘यहीएल’ रूप में लिप्यंतरित किया गया है।
- source_word: וְעִמּוֹ
  choice: और उसके साथ
  rationale: इब्रानी संयोजक और संबंधबोधक पद दोनों को रखते हुए सूची की समन्वित शैली सुरक्षित रखी गई है।
- source_word: מָאתַיִם וּשְׁמֹנָה עָשָׂר
  choice: '218'
  rationale: इब्रानी संख्या का अर्थ ‘दो सौ अठारह’ है; सूची में सुगमता के लिए अंकों का प्रयोग किया गया है।
- source_word: הַזְּכָרִים
  choice: पुरुष सदस्य
  rationale: यह शब्द पुरुष-लिंग के व्यक्तियों को निर्दिष्ट करता है, केवल वयस्क पुरुषों को आवश्यक रूप से नहीं। ‘पुरुष सदस्य’ हिन्दी में ‘नर’ से अधिक स्वाभाविक है और समूह-सूची के संदर्भ में लिंग-विशिष्ट अर्थ बनाए रखता है।
