base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/028.yaml
  text: And I said to them, “You are holy to Yahweh, and the vessels are holy; and the silver and the gold are a freewill offering to Yahweh, the God of your fathers.”
translation:
  language: hi
  text: तब मैंने उनसे कहा, “तुम यहोवा के लिए पवित्र हो, और पात्र भी पवित्र हैं। चाँदी और सोना यहोवा, तुम्हारे पूर्वजों के परमेश्वर, के लिए स्वेच्छा से दी गई भेंट हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וָאֹמְרָה
  choice: तब मैंने कहा
  rationale: वय्यिक्तोल कथानक के अगले क्रम को व्यक्त करता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से दर्शाता है।
- source_word: קֹדֶשׁ לַיהוָה
  choice: यहोवा के लिए पवित्र
  rationale: यह पदबंध समर्पित और पवित्र ठहराए जाने की स्थिति व्यक्त करता है; ‘के लिए पवित्र’ इस उपासना-संबंधी अर्थ को सहज हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: הַכֵּלִים
  choice: ये पात्र
  rationale: मन्दिर के प्रसंग में शब्द पवित्र सेवाओं में प्रयुक्त वस्तुओं या पात्रों को सूचित करता है; निकटवर्ती संदर्भ के कारण ‘ये पात्र’ स्वाभाविक है।
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: यह चाँदी और सोना
  rationale: दोनों निश्चित संज्ञाओं को हिन्दी में सामूहिक संकेतवाचक ‘यह’ के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: נְדָבָה
  choice: स्वेच्छा से दी गई भेंट
  rationale: यह शब्द बिना बाध्यता के इच्छापूर्वक चढ़ाई गई भेंट को दर्शाता है; यह वाक्यांश सामान्य पाठक के लिए पारदर्शी है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पूर्वजों के परमेश्वर
  rationale: यह वाचागत पूर्वजों से जुड़े संबंध को बनाए रखता है और आधुनिक हिन्दी में ‘पितरों’ की अपेक्षा अधिक स्पष्ट है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ चुना गया; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: קֹדֶשׁ का समर्पण-संबंधी आशय
  choice: के लिए पवित्र
  alternative: के लिए अलग किए गए
  rationale: ‘पवित्र’ मूल की धार्मिक और नैतिक-अनुष्ठानिक गूँज बनाए रखता है, जबकि वैकल्पिक पाठ इसके समर्पित होने के अर्थ को अधिक स्पष्ट करता है।
- issue: אֲבֹתֵיכֶם में पूर्वज-संबंध
  choice: तुम्हारे पूर्वजों
  alternative: तुम्हारे पितरों
  rationale: मूल बहुवचन पुरुष पूर्वजों की वाचागत पंक्ति को सूचित करता है। ‘पूर्वजों’ आधुनिक हिन्दी में सहज है और आशय को अनावश्यक रूप से विस्तृत या संकीर्ण नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। संबोधन का बहुवचन ‘तुम’ संदर्भानुकूल है। समानान्तर इब्रानी संरचना को दो हिन्दी वाक्यों में बाँटकर स्पष्टता बढ़ाई गई है, पर अर्थ-संबंध सुरक्षित रखा गया है।
