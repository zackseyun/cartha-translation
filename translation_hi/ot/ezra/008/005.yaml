  text: From the sons of Shecaniah[a], the son of Jahaziel, and with him three hundred males.
translation:
  language: hi
  text: 'शकन्याह के वंशजों में से: यहजीएल का पुत्र; और उसके साथ तीन सौ पुरुष[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “नर।” इब्रानी शब्द आयु या सामाजिक स्थिति के बजाय विशेष रूप से जैविक लिंग को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: के वंशजों में से
  rationale: सूची के वंशावली-संबंधी संदर्भ में यह पदबंध किसी कुल के एक समूह को प्रस्तुत करता है। हिन्दी में ‘पुत्रों में से’ संभव है, पर ‘वंशजों में से’ यहाँ अभिप्रेत व्यापक कुल-संबंध को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁכַנְיָה
  choice: शकन्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और हिन्दी-पाठक के लिए सुगम लिप्यंतरण।
- source_word: בֶּן יַחֲזִיאֵל
  choice: यहजीएल का पुत्र
  rationale: मसोरेटिक पाठ में ‘पुत्र’ से पहले किसी व्यक्ति का नाम नहीं है। इसलिए वाक्यांश को शकन्याह का विशेषण बनाकर अस्पष्टता मिटाने के बजाय, सूची में नेता को उसके पिता के संबंध से प्रस्तुत करने वाली मूल संरचना सुरक्षित रखी गई है।
- source_word: וְעִמּוֹ
  choice: और उसके साथ
  rationale: संयोजक और संबंधसूचक पद को सीधे रखा गया है; यह उल्लिखित नेता के साथ आए दल को प्रस्तुत करता है।
- source_word: שְׁלֹשׁ מֵאוֹת
  choice: तीन सौ
  rationale: संख्या का सीधा और स्वाभाविक अनुवाद।
- source_word: הַזְּכָרִים
  choice: पुरुष
  rationale: इब्रानी शब्द विशेष रूप से पुरुष-लिंग के लोगों को दर्शाता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘पुरुष’ रखकर अधिक शाब्दिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: ‘यहजीएल का पुत्र’ का शकन्याह से संबंध
  choice: 'इसे स्वतंत्र वंश-सूचक पहचान के रूप में रखा गया है: ‘शकन्याह के वंशजों में से यहजीएल का पुत्र’'
  alternative: ‘शकन्याह, जो यहजीएल का पुत्र था’
  rationale: मसोरेटिक इब्रानी में संरचना संक्षिप्त और कुछ असामान्य है तथा ‘यहजीएल का पुत्र’ से पहले अलग व्यक्तिगत नाम नहीं मिलता। वैकल्पिक रूप शकन्याह को यहजीएल का पुत्र मानकर संबंध को निश्चित कर देता है; चुना हुआ रूप मूल पाठ की व्याकरणिक अनिश्चितता को अनावश्यक रूप से नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूची-जैसी रखी गई है। ‘वंशजों’ से वंशावली-सूत्र स्वाभाविक हिन्दी में व्यक्त होता है, जबकि ‘यहजीएल का पुत्र’ की असामान्य संक्षिप्तता मूल पाठ की वास्तविक अस्पष्टता को सुरक्षित रखती है।
