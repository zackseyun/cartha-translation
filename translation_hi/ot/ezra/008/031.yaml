source:
  edition: WLC
  text: וַֽ/נִּסְעָ֞/ה מִ/נְּהַ֣ר אַֽהֲוָ֗א בִּ/שְׁנֵ֤ים עָשָׂר֙ לַ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן לָ/לֶ֖כֶת יְרוּשָׁלִָ֑ם וְ/יַד אֱלֹהֵ֨י/נוּ֙ הָיְתָ֣ה עָלֵ֔י/נוּ וַ/יַּ֨צִּילֵ֔/נוּ מִ/כַּ֥ף אוֹיֵ֛ב וְ/אוֹרֵ֖ב עַל הַ/דָּֽרֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/031.yaml
  text: Then we set out from the river Ahava on the twelfth day of the first month to go to Jerusalem[a], and the hand of our God was upon us, and he delivered us from the hand of the enemy and the ambushes along the way.
translation:
  language: hi
  text: फिर पहले महीने के बारहवें दिन हम अहवा नदी से यरूशलेम जाने के लिए निकल पड़े। हमारे परमेश्वर का हाथ हमारे ऊपर था, और उसने शत्रु के हाथ से और मार्ग में घात लगानेवाले[a] से हमें बचाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घात से।” इब्रानी शब्द का अर्थ घात लगाकर बैठा व्यक्ति या उससे उत्पन्न घात का खतरा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּסְעָה
  choice: फिर ... हम ... निकल पड़े
  rationale: נסע यात्रा के प्रसंग में पड़ाव उठाकर प्रस्थान करने को दर्शाता है। ‘निकल पड़े’ आधुनिक हिन्दी में स्वाभाविक है और וַ द्वारा व्यक्त कथात्मक क्रम को ‘फिर’ बनाए रखता है।
- source_word: מִנְּהַר אֲהֲוָא
  choice: अहवा नदी से
  rationale: נָהָר का अर्थ ‘नदी’ है; हिन्दी की स्वाभाविक शब्दावली के अनुसार स्थान-नाम से पहले नहीं, बाद में ‘नदी’ रखा गया है।
- source_word: בִּשְׁנֵים עָשָׂר לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के बारहवें दिन
  rationale: इब्रानी में ‘दिन’ अध्याहृत है; स्पष्ट और स्वाभाविक हिन्दी के लिए इसे व्यक्त किया गया है।
- source_word: לָלֶכֶת יְרוּשָׁלִָם
  choice: यरूशलेम जाने के लिए
  rationale: הלך का infinitive उद्देश्य व्यक्त करता है; यह सीधा और स्वाभाविक अनुवाद है।
- source_word: וְיַד אֱלֹהֵינוּ הָיְתָה עָלֵינוּ
  choice: हमारे परमेश्वर का हाथ हमारे ऊपर था
  rationale: परमेश्वर की सक्रिय कृपा और सुरक्षा बतानेवाले मूल रूपक को बनाए रखा गया है, क्योंकि यह एज्रा में महत्त्वपूर्ण और हिन्दी में बोधगम्य है।
- source_word: וַיַּצִּילֵנוּ
  choice: उसने ... हमें बचाया
  rationale: נצל संकट या अधिकार से छुड़ाने अथवा बचाने को दर्शाता है। प्रसंग में ‘बचाया’ सहज और सटीक है।
- source_word: מִכַּף אוֹיֵב
  choice: शत्रु के हाथ से
  rationale: כַּף शाब्दिक रूप से हथेली/हाथ और मुहावरे में अधिकार या पकड़ को दर्शाता है। ‘हाथ’ रखने से इसी पद में परमेश्वर के हाथ के साथ साहित्यिक विरोध भी सुरक्षित रहता है।
- source_word: וְאוֹרֵב
  choice: और ... घात लगानेवाले से
  rationale: ארב का participle मूलतः घात लगाकर बैठनेवाले व्यक्ति को सूचित कर सकता है। मुख्य पाठ में इस व्यक्तिगत अर्थ को रखा गया है और ‘घात’ को पादटिप्पणी में विकल्प दिया गया है।
- source_word: עַל הַדָּרֶךְ
  choice: मार्ग में
  rationale: शाब्दिक अर्थ ‘मार्ग पर’ है; यात्रा के दौरान उपस्थित खतरे के लिए ‘मार्ग में’ अधिक स्वाभाविक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय सुरक्षा के लिए मानव-सदृश ‘हाथ’ का रूपक
  choice: ‘हमारे परमेश्वर का हाथ हमारे ऊपर था’ रूपक को मुख्य पाठ में बनाए रखना
  alternative: ‘हमारे परमेश्वर ने हमारी रक्षा की’
  rationale: मूल पाठ स्पष्टतः ‘हाथ’ का रूपक इस्तेमाल करता है, जो एज्रा-नहेमायाह में परमेश्वर की कृपा और सक्रिय सुरक्षा का आवर्ती विषय है। इसे बनाए रखने से साहित्यिक और धर्मवैचारिक संबंध सुरक्षित रहता है।
- issue: אוֹרֵב में व्यक्ति और घात की संभावित अर्थ-सीमा
  choice: मुख्य पाठ में ‘घात लगानेवाले’
  alternative: ‘घात’
  rationale: इब्रानी participle सबसे सीधे तौर पर घात लगाकर बैठे व्यक्ति को दर्शाता है; फिर भी प्रसंग में उससे उत्पन्न ‘घात’ का खतरा भी अभिप्रेत हो सकता है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथात्मक क्रम स्पष्ट है; इब्रानी के ‘हाथ’ रूपक और אוֹרֵב की वास्तविक अर्थगत संभावना को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
