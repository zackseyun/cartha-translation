  rationale: शाब्दिक रूप ‘पुत्रों में से’ है, पर वंशावली-सूची में בְּנֵי किसी कुल के वंशजों या सदस्यों को सूचित कर सकता है। आधुनिक हिन्दी में ‘वंशजों में से’ आशय को स्वाभाविक और स्पष्ट रखता है।
- source_word: בֵבַי
  choice: बेबै
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण, जिसमें अंतिम יָה को ‘याह’ के रूप में सुरक्षित रखा गया है।
- source_word: בֶּן
  choice: पुत्र
  rationale: तत्काल पितृनाम-संबंध में ‘पुत्र’ सबसे सीधा और स्वाभाविक अर्थ है।
- source_word: וְעִמּוֹ
  choice: और उसके साथ
  rationale: संयोजक तथा साथ होने का संबंध दोनों सुरक्षित रखे गए हैं।
- source_word: עֶשְׂרִים וּשְׁמֹנָה
  choice: अट्ठाईस
  rationale: संख्या का मानक और स्वाभाविक हिन्दी रूप।
- source_word: הַזְּכָרִים
  choice: पुरुष
  rationale: इब्रानी शब्द पुरुष-लिंग के व्यक्तियों को निर्दिष्ट करता है। हिन्दी में सूची के संदर्भ में ‘पुरुष’ स्वाभाविक है, यद्यपि मूल शब्द वयस्कता को अनिवार्य रूप से व्यक्त नहीं करता।
