  text: וּ/בַ/יּ֣וֹם הָ/רְבִיעִ֡י נִשְׁקַ֣ל הַ/כֶּסֶף֩ וְ/הַ/זָּהָ֨ב וְ/הַ/כֵּלִ֜ים בְּ/בֵ֣ית אֱלֹהֵ֗י/נוּ עַ֠ל יַד מְרֵמ֤וֹת בֶּן אֽוּרִיָּה֙ הַ/כֹּהֵ֔ן וְ/עִמּ֖/וֹ אֶלְעָזָ֣ר בֶּן פִּֽינְחָ֑ס וְ/עִמָּ/הֶ֞ם יוֹזָבָ֧ד בֶּן יֵשׁ֛וּעַ וְ/נֽוֹעַדְיָ֥ה בֶן בִּנּ֖וּי הַ/לְוִיִּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/033.yaml
  text: And on the fourth day[a], the silver and the gold and the vessels were weighed out in the house of our God into the hand of Meremoth son of Uriah the priest, and with him was Eleazar son of Phinehas, and with them were Jozabad son of Jeshua and Noadiah son of Binnui[b], the Levites.
translation:
  language: hi
  text: चौथे दिन हमारे परमेश्वर के भवन में चाँदी, सोना और पात्र[a] तौलकर ऊरिय्याह के पुत्र, याजक मरेमोत, के हाथों में दिए गए। उसके साथ पीनहास का पुत्र एलीआज़र था, और उनके साथ येशूअ का पुत्र योजाबाद और बिन्नूई का पुत्र नोअद्याह थे; ये दोनों लेवी थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मंदिर में काम आनेवाले पात्र या अन्य वस्तुएँ।
    reason: cultural_note
  - marker: b
    text: इब्रानी में ‘लेवी’ बहुवचन है और इसका संबंध योजाबाद और नोअद्याह से है।
    reason: clarity
lexical_decisions:
- source_word: וּבַיּוֹם הָרְבִיעִי
  choice: चौथे दिन
  rationale: यह कथा के क्रम को स्वाभाविक रूप से आगे बढ़ाता है; हिन्दी में आरम्भिक וּ का अलग से ‘और’ करना आवश्यक नहीं है।
- source_word: נִשְׁקַל
  choice: तौलकर ... सौंपे गए
  rationale: निफ़अल रूप औपचारिक रूप से तौले जाने की क्रिया बताता है। עַל יַד के साथ मिलकर प्रसंग में वस्तुओं को तौलकर उत्तरदायी व्यक्तियों के सुपुर्द करने का भाव आता है।
- source_word: הַכֶּסֶף וְהַזָּהָב וְהַכֵּלִים
  choice: चाँदी, सोना और पात्र
  rationale: ‘पात्र’ כֵּלִים का ठोस और मंदिर-संदर्भ के अनुकूल अनुवाद है, जबकि टिप्पणी इसके व्यापक अर्थ को स्पष्ट करती है।
- source_word: בְּבֵית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन में
  rationale: यह इब्रानी के ‘हमारे परमेश्वर के घर/भवन में’ को निकटता से रखता है और मंदिर का संकेत बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: עַל יַד
  choice: के हाथ सौंपे गए
  rationale: यह हिन्दी में जिम्मेदार अभिरक्षा में दिए जाने का स्वाभाविक मुहावरा है और मूल के ‘हाथ’ वाले बिंब को भी सुरक्षित रखता है।
- source_word: הַלְוִיִּם
  choice: ये दोनों लेवी थे
  rationale: अंत का बहुवचन पद निकटतम दो व्यक्तियों, योजाबाद और नोअद्याह, को सामूहिक रूप से लेवी ठहराता है; स्पष्ट हिन्दी के लिए ‘दोनों’ जोड़ा गया है।
theological_decisions:
- issue: ‘याजक’ पद किस व्यक्ति को विशेषित करता है
  choice: मरेमोत याजक
  alternative: ऊरिय्याह याजक का पुत्र मरेमोत
  rationale: इब्रानी पदक्रम और प्रसंग में הַכֹּהֵן का स्वाभाविक संबंध मरेमोत से है, यद्यपि संज्ञा-श्रृंखला के कारण दूसरी व्याकरणिक समझ संभव लग सकती है।
- issue: ‘लेवी’ की पहचान किन पर लागू होती है
  choice: योजाबाद और नोअद्याह—दोनों
  alternative: सभी नामित सहायक
  rationale: הַלְוִיִּם निकटतम दो नामों के बाद बहुवचन में आता है और उन्हें सामूहिक रूप से पहचानता है; मरेमोत को पहले ही याजक कहा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों का देवनागरी लिप्यंतरण मूल इब्रानी उच्चारण के निकट है। लंबे इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, पर व्यक्तियों और उनकी भूमिकाओं का क्रम सुरक्षित रखा गया है।
