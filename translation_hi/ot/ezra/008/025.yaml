base_translation:
  language: en
  yaml_path: translation/ot/ezra/008/025.yaml
  text: And I weighed out to them the silver[a], the gold, and the vessels—the contribution for the house of our God that the king, his counselors, his officials, and all Israel who were present had offered.
translation:
  language: hi
  text: फिर मैंने उनके लिए चाँदी, सोना और पात्र तौले—हमारे परमेश्वर के भवन के लिए वह भेंट[a], जिसे राजा, उसके सलाहकारों, उसके अधिकारियों और वहाँ उपस्थित समस्त इस्राएल ने अर्पित किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंशदान।” इब्रानी शब्द पवित्र उपयोग के लिए अलग करके दी गई वस्तु को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶשְׁקֳלָה לָהֶם
  choice: मैंने उनके लिए ... तौले
  rationale: שקל का मूल अर्थ ‘तौलना’ है और לָהֶם प्राप्तकर्ताओं की ओर संकेत करता है। हिंदी में यह वाक्यांश वस्तुओं को तौलकर उनके सुपुर्द करने की प्रसंगगत भावना रखता है, पर स्रोत से अधिक स्पष्ट रूप से ‘दे दिया’ नहीं जोड़ता।
- source_word: הַכֶּסֶף וְאֶת הַזָּהָב
  choice: चाँदी, सोना
  rationale: यहाँ כסף धनराशि के बजाय सोने और पात्रों के साथ रखी गई बहुमूल्य धातु है, इसलिए ‘चाँदी’ उपयुक्त है।
- source_word: הַכֵּלִים
  choice: पात्र
  rationale: मंदिर के संदर्भ में כֵּלִים के लिए ‘पात्र’ स्वाभाविक और प्रतिष्ठित हिंदी शब्द है; यह अनावश्यक रूप से किसी खास प्रकार के बर्तन को निर्धारित नहीं करता।
- source_word: תְּרוּמַת
  choice: भेंट
  rationale: यह शब्द पवित्र उपयोग के लिए अलग करके दिए गए अंशदान को सूचित करता है। ‘भेंट’ आधुनिक हिंदी में सहज है और इसे किसी विशिष्ट बलिदान-विधि तक सीमित नहीं करता।
- source_word: בֵּית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर का भवन
  rationale: यह स्रोत के ‘हमारे परमेश्वर का घर/भवन’ रूपक को बनाए रखता है और सीधे ‘मंदिर’ कहकर व्याख्या को पाठ में नहीं मिलाता।
- source_word: הֵרִימוּ
  choice: अर्पित किया था
  rationale: Hiphil रूप का शाब्दिक भाव ‘ऊपर उठाना’ है, किंतु यहाँ इसका मुहावरेदार अर्थ पवित्र प्रयोजन के लिए भेंट प्रस्तुत करना है। पूर्वकालिक कार्य को हिंदी में ‘किया था’ से व्यक्त किया गया है।
- source_word: יֹעֲצָיו וְשָׂרָיו
  choice: उसके सलाहकारों, उसके अधिकारियों
  rationale: יֹעֲצִים परामर्श देने वालों को और שָׂרִים फ़ारसी प्रशासनिक संदर्भ में उच्च अधिकारियों को दर्शाता है; यह अनुवाद राजवंशीय ‘राजकुमारों’ का अनावश्यक अर्थ नहीं लाता।
- source_word: כָל יִשְׂרָאֵל הַנִּמְצָאִים
  choice: वहाँ उपस्थित समस्त इस्राएल
  rationale: ‘समस्त इस्राएल’ सामूहिक जन-नाम को सुरक्षित रखता है और הַנִּמְצָאִים को प्रसंगानुकूल ‘वहाँ उपस्थित’ के रूप में व्यक्त करता है।
theological_decisions:
- issue: मंदिर-दान के संदर्भ में תְּרוּמָה
  choice: भेंट
  alternative: अंशदान; उठाई हुई भेंट
  rationale: ‘भेंट’ पवित्र उपयोग के लिए दी गई वस्तुओं का भाव संप्रेषित करता है, पर किसी विशिष्ट बलिदान अथवा तकनीकी ‘उठाई हुई भेंट’ की विधि नहीं थोपता।
- issue: בֵּית אֱלֹהֵינוּ का रूपक
  choice: हमारे परमेश्वर का भवन
  alternative: हमारे परमेश्वर का मंदिर
  rationale: ‘भवन’ मूल के ‘घर’ संबंधी रूपक के निकट है; संदर्भ से मंदिर स्पष्ट है, इसलिए उसे पाठ में व्याख्यात्मक रूप से प्रतिस्थापित करना आवश्यक नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परमेश्वर का भवन,’ ‘समस्त इस्राएल’ और ‘अर्पित’ जैसे पद स्रोत की धार्मिक तथा सामूहिक भाषा को बनाए रखते हैं, जबकि अत्यधिक तकनीकी शब्दावली से बचते हैं।
