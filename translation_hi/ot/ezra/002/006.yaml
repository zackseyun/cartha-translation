  text: the sons of Pahath-moab, of the sons of Jeshua and Joab, 2,812.
translation:
  language: hi
  text: पहत-मोआब के वंशज—येशूआ और योआब के वंशज—2,812।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: वंशज
  rationale: वापस लौटने वालों की इस वंशावली-सूची में यह शब्द किसी परिवार या कुल के सदस्यों को दर्शाता है; आधुनिक हिन्दी में ‘वंशज’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: פַחַת מוֹאָב
  choice: पहत-मोआब
  rationale: यह एक व्यक्तिवाचक नाम है, इसलिए इसका अनुवाद करने के बजाय हिन्दी में लिप्यंतरण किया गया है; संयुक्त नाम को योजक-चिह्न के साथ रखा गया है।
- source_word: לִבְנֵי
  choice: में से, अर्थात ... के वंशज
  rationale: उपसर्ग ל मुख्य कुल और उसके अंतर्गत बताए गए वंशों के संबंध को व्यक्त करता है। ‘में से, अर्थात’ इस संक्षिप्त सूची में संबंध को स्पष्ट करता है, यद्यपि इब्रानी की संरचना कुछ अस्पष्ट है।
- source_word: יֵשׁוּעַ
  choice: येशू
  rationale: निर्वासनोत्तर नाम יֵשׁוּעַ का स्रोत-निकट हिन्दी लिप्यंतरण है और इसे विस्तृत रूप ‘यहोशू’ से अलग रखता है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिवाचक नाम का प्रचलित और स्रोत-निकट हिन्दी लिप्यंतरण।
- source_word: אַלְפַּיִם שְׁמֹנֶה מֵאוֹת וּשְׁנֵים עָשָׂר
  choice: 2,812
  rationale: इब्रानी संख्या स्पष्टतः दो हजार आठ सौ बारह है; सूची में अंकों का प्रयोग पठनीयता बढ़ाता है।
theological_decisions: []
