  register: भाषा आधुनिक, संक्षिप्त और सूची के अनुरूप रखी गई है। ‘पुत्र’ की शाब्दिक वंशावलीगत शैली के बजाय ‘वंशज’ चुना गया है, क्योंकि यहाँ परिवार या कुल के व्यापक समूह की गणना है।
