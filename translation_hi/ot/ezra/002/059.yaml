  text: וְ/אֵ֗לֶּה הָֽ/עֹלִים֙ מִ/תֵּ֥ל מֶ֨לַח֙ תֵּ֣ל חַרְשָׁ֔א כְּר֥וּב אַדָּ֖ן אִמֵּ֑ר וְ/לֹ֣א יָֽכְל֗וּ לְ/הַגִּ֤יד בֵּית אֲבוֹתָ/ם֙ וְ/זַרְעָ֔/ם אִ֥ם מִ/יִּשְׂרָאֵ֖ל הֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/059.yaml
  text: And these were the ones who came up from Tel-melah[a], Tel-harsha, Kerub, Addan, and Immer, but they were not able to declare their fathers’ house and their offspring, whether they were from Israel.
translation:
  language: hi
  text: और ये वे लोग थे जो तेल-मेलह, तेल-हर्शा, करूब, अद्दान और इम्मेर से आए थे, पर वे अपना पितृकुल और अपना वंश नहीं बता सके—कि वे इस्राएल के थे या नहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֹלִים
  choice: जो ... से आए थे
  rationale: निर्वासनोत्तर सूची में यह क्रिया देश की ओर चढ़कर आने/लौटने को सूचित करती है। हिन्दी में स्थानों के साथ ‘से आए थे’ स्वाभाविक है और अनावश्यक रूप से ‘लौटनेवाले’ नहीं जोड़ता।
- source_word: מִתֵּל מֶלַח תֵּל חַרְשָׁא כְּרוּב אַדָּן אִמֵּר
  choice: तेल-मेलह, तेल-हर्शा, करूब, अद्दान और इम्मेर से
  rationale: ये स्थान अथवा कुलनाम हैं, इसलिए इनका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: לֹא יָכְלוּ לְהַגִּיד
  choice: नहीं बता सके
  rationale: प्रशासनिक-वंशावली प्रसंग में इसका अर्थ अपनी वंश-संबंधी जानकारी प्रमाणित रूप से बताना है; ‘नहीं बता सके’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: בֵּית אֲבוֹתָם
  choice: उनका पितृकुल
  rationale: यह पैतृक घराने अथवा वंश-समूह का तकनीकी पद है। ‘पितृकुल’ स्रोत की पैतृक संरचना को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: וְזַרְעָם
  choice: और उनका वंश
  rationale: यहाँ זרע जैविक बीज नहीं, वंश अथवा वंशावली को दर्शाता है; ‘वंश’ प्रसंगानुकूल और सामान्य हिन्दी है।
- source_word: אִם מִיִּשְׂרָאֵל הֵם
  choice: इस्राएल से था या नहीं
  rationale: यह उपवाक्य उनके इस्राएली वंश का होना अनिश्चित बताता है। एकवचन ‘था’ संयुक्त पद ‘पितृकुल और वंश’ को वंशगत पहचान के रूप में ग्रहण करता है।
