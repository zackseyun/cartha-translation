  text: בְּנֵ֣י הַ/שֹּֽׁעֲרִ֗ים בְּנֵי שַׁלּ֤וּם בְּנֵֽי אָטֵר֙ בְּנֵי טַלְמ֣וֹן בְּנֵי עַקּ֔וּב בְּנֵ֥י חֲטִיטָ֖א בְּנֵ֣י שֹׁבָ֑י הַ/כֹּ֕ל מֵאָ֖ה שְׁלֹשִׁ֥ים וְ/תִשְׁעָֽה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/042.yaml
  text: 'The sons of the gatekeepers: the sons of Shallum, the sons of Ater, the sons of Talmon, the sons of Akkub, the sons of Hatita, the sons of Shobai, all together one hundred thirty-nine.'
translation:
  language: hi
  text: 'द्वारपालों के वंशज: शल्लूम के वंशज, आतेर के वंशज, तल्मोन के वंशज, अक्कूब के वंशज, हतीता के वंशज और शोबाई के वंशज—कुल 139।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली और सूची के इस संदर्भ में यह पद किसी व्यक्ति से जुड़े वंश या कुल के लोगों को सूचित करता है। आधुनिक हिन्दी में ‘के वंशज’ स्वाभाविक और स्पष्ट है; शाब्दिक ‘के पुत्र’ यहाँ केवल प्रत्यक्ष पुत्रों का भ्रामक अर्थ दे सकता है।
- source_word: הַשֹּׁעֲרִים
  choice: द्वारपालों
  rationale: यह शब्द विशेष रूप से मन्दिर के द्वारों की रखवाली और देखरेख के लिए नियुक्त सेवकों को दर्शाता है। ‘द्वारपाल’ आधुनिक हिन्दी में स्पष्ट, संक्षिप्त और गरिमापूर्ण है।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: मसोरा-स्वरांकन के अनुरूप व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: אָטֵר
  choice: आतेर
  rationale: मसोरा-स्वरांकन के अनुरूप व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: טַלְמוֹן
  choice: तल्मोन
  rationale: मसोरा-स्वरांकन के अनुरूप व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: עַקּוּב
  choice: अक्कूब
  rationale: दोगुने क़ोफ़ और दीर्घ ऊ-स्वर को दर्शाने वाला सुबोध देवनागरी लिप्यंतरण।
- source_word: חֲטִיטָא
  choice: हतीता
  rationale: नाम के मसोरा-स्वरांकन का सरल देवनागरी लिप्यंतरण; प्रारम्भिक ח को सामान्य हिन्दी पाठक के लिए ‘ह’ से व्यक्त किया गया है।
- source_word: שֹׁבָי
  choice: शोबाई
  rationale: मसोरा पाठ में इंगित स्वर-रूप को सुरक्षित रखने वाला देवनागरी लिप्यंतरण।
- source_word: הַכֹּל
  choice: कुल
  rationale: जनगणना-सदृश सूची के योग को आधुनिक हिन्दी में ‘कुल’ सर्वाधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מֵאָה שְׁלֹשִׁים וְתִשְׁעָה
  choice: '139'
  rationale: मूल संख्या ‘एक सौ उनतालीस’ को सूची की पठनीयता के लिए प्रचलित हिन्दी-अरबी अंकों में प्रस्तुत किया गया है।
