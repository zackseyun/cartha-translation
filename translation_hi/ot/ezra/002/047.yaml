lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: निर्वासितों की इस कुल-सूची में रचनात्मक बहुवचन का आशय प्रत्येक नाम से जुड़े परिवार या कुल के लोगों से है; इसलिए शाब्दिक ‘पुत्र’ की अपेक्षा ‘वंशज’ आधुनिक हिन्दी में अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: גִדֵּל
  choice: गिद्देल
  rationale: व्यक्तिनाम को हिब्रू व्यंजन और दागेश द्वारा सूचित द्वित्व के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: גַחַר
  choice: गहर
  rationale: व्यक्तिनाम का हिब्रू उच्चारणानुसार सरल देवनागरी लिप्यंतरण किया गया है।
- source_word: רְאָיָה
  choice: रआयाह
  rationale: व्यक्तिनाम में रेश के बाद के स्पष्ट अलेफ़ को बनाए रखने के लिए ‘रआ’ और अंतिम याह-तत्व के लिए ‘याह’ रखा गया है।
