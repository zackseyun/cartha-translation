lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली और लौटनेवालों की सूची के संदर्भ में यह पद किसी व्यक्ति के प्रत्यक्ष पुत्रों से अधिक व्यापक पारिवारिक या कुल-समूह को सूचित कर सकता है; इसलिए आधुनिक हिन्दी में “के वंशज” स्वाभाविक और अर्थ-सटीक है।
- source_word: בִגְוָי
  choice: बिगवै
  rationale: यह व्यक्ति अथवा कुल का नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
- source_word: אַלְפַּיִם
  choice: दो हज़ार
  rationale: इब्रानी संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: חֲמִשִּׁים
  choice: पचास
  rationale: यह अगली संख्या के साथ योगात्मक संख्या-विन्यास का भाग है और कुल संख्या में “छप्पन” के भीतर व्यक्त है।
- source_word: וְשִׁשָּׁה
  choice: और छह
  rationale: इब्रानी में “और छह” है; आधुनिक हिन्दी की संख्या-प्रणाली में पूरे योग को स्वाभाविक रूप से “दो हज़ार छप्पन” कहा गया है।
