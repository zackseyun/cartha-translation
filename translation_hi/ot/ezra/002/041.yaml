lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: गायक
  rationale: שׁיר से बना यह कृदंत गाने वालों को दर्शाता है। सूची के इस संदर्भ में “गायक” सीधा और स्वाभाविक है; “संगीतकार” अर्थ को अनावश्यक रूप से व्यापक कर देता है।
- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली और कुल-सूचियों में בְּנֵי किसी व्यक्ति से निकले कुल या समूह को सूचित कर सकता है। आधुनिक हिन्दी में “के वंशज” यहाँ “के पुत्र” की अपेक्षा अभिप्रेत सामूहिक अर्थ अधिक स्पष्ट करता है।
- source_word: אָסָף
  choice: आसाप
  rationale: इब्रानी नाम का देवनागरी में प्रचलित बाइबलीय लिप्यंतरण रखा गया है।
- source_word: מֵאָה עֶשְׂרִים וּשְׁמֹנָה
  choice: एक सौ अट्ठाईस
  rationale: इब्रानी संख्या-क्रम 100 + 20 + 8 को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत किया गया है।
