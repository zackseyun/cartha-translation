  register: संक्षिप्त जनगणना-सूची की शैली बनाए रखते हुए आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी का प्रयोग किया गया है। “वंशज” कुलगत अर्थ को सामान्य पाठक के लिए स्पष्ट करता है।
