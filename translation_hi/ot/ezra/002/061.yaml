source:
  edition: WLC
  text: וּ/מִ/בְּנֵי֙ הַ/כֹּ֣הֲנִ֔ים בְּנֵ֥י חֳבַיָּ֖ה בְּנֵ֣י הַקּ֑וֹץ בְּנֵ֣י בַרְזִלַּ֗י אֲשֶׁ֣ר לָ֠קַח מִ/בְּנ֞וֹת בַּרְזִלַּ֤י הַ/גִּלְעָדִי֙ אִשָּׁ֔ה וַ/יִּקָּרֵ֖א עַל שְׁמָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/061.yaml
  text: 'And from among the sons of the priests: the sons of Hobaiah[a], the sons of Hakkoz, the sons of Barzillai, who had taken a wife from the daughters of Barzillai the Gileadite and was called by their name.'
translation:
  language: hi
  text: 'और याजकों के पुत्रों में से: होबायाह के पुत्र, हक्कोस के पुत्र, और बर्जिल्लै के पुत्र—उस बर्जिल्लै के, जिसने गिलादी बर्जिल्लै की बेटियों में से एक को पत्नी के रूप में लिया था और जो उनके नाम से पुकारा गया था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक सहज रूप में, “और उसने उनका नाम अपना लिया।” इब्रानी में शाब्दिक अर्थ है, “और वह उनके नाम से पुकारा गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי הַכֹּהֲנִים
  choice: और याजकों के पुत्रों में से
  rationale: מִן का अंशसूचक भाव ‘में से’ द्वारा व्यक्त किया गया है। ‘पुत्रों’ से वंशावली-सूची की मूल शब्दावली और शैली बनी रहती है।
- source_word: בְּנֵי חֳבַיָּה ... בְּנֵי הַקּוֹץ ... בְּנֵי בַרְזִלַּי
  choice: होबायाह के पुत्र, हक्कोस के पुत्र और बर्जिल्लै के पुत्र
  rationale: बार-बार आए בְּנֵי को ‘के पुत्र’ के रूप में रखा गया है, और व्यक्तिनामों का देवनागरी लिप्यंतरण इब्रानी उच्चारण के निकट किया गया है।
- source_word: אֲשֶׁר לָקַח
  choice: इस बर्जिल्लै ने ... बनाया था
  rationale: पूर्ण क्रिया उस विवाह को बाद में नाम से पुकारे जाने से पहले की घटना बताती है। ‘इस बर्जिल्लै’ कथन में आए वंश-पूर्वज को स्पष्ट करता है, बिना उसकी पहचान गिलादी बर्जिल्लै से मिलाए।
- source_word: מִבְּנוֹת ... אִשָּׁה
  choice: बेटियों में से एक को पत्नी बनाया
  rationale: यह स्वाभाविक हिन्दी में ‘बेटियों में से किसी एक स्त्री से विवाह करने’ का अर्थ देता है और מִן के अंशसूचक भाव को भी बनाए रखता है।
- source_word: בַּרְזִלַּי הַגִּלְעָדִי
  choice: गिलादी बर्जिल्लै
  rationale: הַגִּלְעָדִי स्थान/समुदाय-सूचक विशेषण है; ‘गिलादी’ उसका संक्षिप्त और प्रचलित बाइबलीय रूप है।
- source_word: וַיִּקָּרֵא עַל שְׁמָם
  choice: वह उनके नाम से पुकारा गया था
  rationale: निफ़अल क्रिया के कर्मवाच्य रूप और बहुवचन प्रत्यय ‘उनके’ को निकटता से सुरक्षित रखा गया है। वाक्य यह निर्धारित नहीं करता कि नाम ग्रहण करने की सामाजिक प्रक्रिया ठीक कैसी थी।
