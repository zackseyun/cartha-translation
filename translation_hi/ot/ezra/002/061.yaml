translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। वंशावली की औपचारिक शैली बनाए रखने के लिए ‘पुत्र’ का प्रयोग किया गया है; दूसरे बर्जिल्लै का उल्लेख स्पष्ट करने के लिए वाक्य विभाजित किया गया है।
