  text: 'The sons of Azmaveth: forty-two[a].'
translation:
  language: hi
  text: 'अजमावेत के वंशज: बयालीस।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: वंशज
  rationale: वंशावली और जनगणना-सदृश सूची में בְּנֵי किसी पूर्वज के व्यापक वंश या कुल के सदस्यों को दर्शा सकता है; आधुनिक हिन्दी में ‘वंशज’ इसी आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: עַזְמָוֶת
  choice: अजमावेत
  rationale: व्यक्तिवाचक नाम का अर्थानुवाद न करके हिब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है। संदर्भ में यह किसी पूर्वज अथवा स्थान से संबद्ध समूह की पहचान हो सकता है।
- source_word: אַרְבָּעִים וּשְׁנָיִם
  choice: बयालीस
  rationale: हिब्रानी संख्या ‘चालीस और दो’ को सहज आधुनिक हिन्दी में ‘बयालीस’ कहा जाता है।
theological_decisions:
- issue: अजमावेत व्यक्ति का नाम है या स्थान का
  choice: पद में केवल ‘अजमावेत के वंशज’ रखा गया है, जिससे सूची के प्रमुख वंशगत अर्थ का संप्रेषण होता है।
  alternative: ‘अजमावेत के लोग’ या ‘अजमावेत नगर के लोग’
  rationale: मूल पाठ स्वयं स्पष्ट नहीं करता कि यहाँ अजमावेत केवल पूर्वज है या उस नाम का स्थान; ‘नगर’ जोड़ना पाठ से अधिक निश्चितता प्रकट करता।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। सूची की शैली बनाए रखने के लिए क्रिया नहीं जोड़ी गई। ‘पुत्र’ की अपेक्षा ‘वंशज’ चुना गया है, क्योंकि यहाँ तत्काल जैविक पुत्रों के बजाय कुल के सदस्यों की संख्या दी जा रही है।
