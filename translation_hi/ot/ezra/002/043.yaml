- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली-सूची में यह रूप केवल प्रत्यक्ष पुत्रों को नहीं, बल्कि किसी कुल या वंश के सदस्यों को भी सूचित कर सकता है। ‘वंशज’ इस प्रसंग में अभिप्रेत सामूहिक अर्थ स्पष्ट करता है और हर नाम के साथ दोहराए गए सूत्र को बनाए रखता है।
- source_word: צִיחָא
  choice: सीहा
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी में ध्वन्यात्मक लिप्यन्तरण।
- source_word: חֲשׂוּפָא
  choice: हसूपा
  rationale: मसोरेटी स्वरांकन के आधार पर नाम का देवनागरी लिप्यन्तरण; आरम्भिक ח को हिन्दी में निकटतम सहज ध्वनि ‘ह’ से दर्शाया गया है।
- source_word: טַבָּעוֹת
  choice: तब्बाओत
  rationale: सूची में यह कुल अथवा पूर्वज के नाम के रूप में प्रयुक्त है, इसलिए इसका अर्थानुवाद न करके लिप्यन्तरण किया गया है; व्यंजन के द्वित्व को ‘ब्ब’ से दर्शाया गया है।
