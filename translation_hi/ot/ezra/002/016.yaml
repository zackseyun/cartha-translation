- source_word: בְּנֵי
  choice: वंशज
  rationale: वंशावली और जनगणना-सूची के इस संदर्भ में यह शब्द किसी व्यक्ति के प्रत्यक्ष पुत्रों के बजाय उसके वंश या कुल के सदस्यों को दर्शाता है; इसलिए आधुनिक हिन्दी में ‘वंशज’ अधिक स्वाभाविक और अर्थ-सटीक है।
- source_word: אָטֵר
  choice: आटेर
  rationale: यह व्यक्ति अथवा परिवार का नाम है, इसलिए इसका देवनागरी में लिप्यंतरण किया गया है।
- source_word: לִיחִזְקִיָּה
  choice: जो हिजकिय्याह के कुल के थे
  rationale: उपसर्ग ל यहाँ संबंध अथवा उपशाखा का संकेत देता है। यह रूप आटेर के वंशजों को हिजकिय्याह से संबद्ध शाखा के रूप में स्पष्ट करता है, पर संबंध की ठीक प्रकृति को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: תִּשְׁעִים וּשְׁמֹנָה
  choice: अट्ठानवे
  rationale: हिब्रू संख्या-पद का मानक और स्वाभाविक हिन्दी रूप।
