  text: אֲשֶׁר בָּ֣אוּ עִם זְרֻבָּבֶ֗ל יֵשׁ֡וּעַ נְ֠חֶמְיָה שְׂרָיָ֨ה רְֽעֵלָיָ֜ה מָרְדֳּכַ֥י בִּלְשָׁ֛ן מִסְפָּ֥ר בִּגְוַ֖י רְח֣וּם בַּעֲנָ֑ה מִסְפַּ֕ר אַנְשֵׁ֖י עַ֥ם יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/002.yaml
  text: 'who came with Zerubbabel: Jeshua[a], Nehemiah, Seraiah, Reelaiah, Mordecai, Bilshan, Mispar, Bigvai, Rehum, and Baanah[d][c][b]. The number of the men of the people of Israel:'
translation:
  language: hi
  text: 'जो जरुब्बाबेल के साथ आए थे: येशू, नहेम्याह, सरायाह, रेलायाह[a], मोर्दकै, बिलशान, मिस्पार[b], बिगवै, रहूम[c] और बाना। इस्राएली प्रजा के पुरुषों की संख्या यह थी:[d]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नहेमायाह 7:7 की समानांतर सूची में ‘रेलायाह’ का नाम ‘रामायाह’ है।
    reason: alternative_reading
  - marker: b
    text: नहेमायाह 7:7 की समानांतर सूची में ‘मिस्पार’ का नाम ‘मिसपेरेत’ है।
    reason: alternative_reading
  - marker: c
    text: नहेमायाह 7:7 की समानांतर सूची में ‘रहूम’ का नाम ‘नहूम’ है।
    reason: alternative_reading
  - marker: d
    text: यह वाक्यांश उस जनगणना-सूची का परिचय देता है जो अगले पद से आरम्भ होती है।
    reason: cross_reference
lexical_decisions:
- source_word: אֲשֶׁר בָּאוּ
  choice: जो ... आए थे
  rationale: सापेक्ष उपवाक्य पिछले पद से आगे चलता है। בוא का मूल अर्थ ‘आना’ रखा गया है; निर्वासन से ‘लौटने’ का संदर्भ क्रिया में नहीं जोड़ा गया।
- source_word: עִם
  choice: के साथ
  rationale: संगति या साथ आने को व्यक्त करने वाला सीधा और स्वाभाविक हिन्दी रूप।
- source_word: זְרֻבָּבֶל
  choice: जरुब्बाबेल
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: יֵשׁוּעַ
  choice: येशू
  rationale: निर्वासनोत्तर हिब्रू नाम के स्वरूप को सीधे दर्शाता है और इसे ‘यहोशू’ में सामान्यीकृत नहीं करता।
- source_word: נְחֶמְיָה
  choice: नहेमायाह
  rationale: हिब्रू व्यक्तिगत नाम का स्पष्ट देवनागरी लिप्यंतरण।
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: मुख्य पाठ के मसोरेटिक रूप को अपनाया गया है; भिन्न समानांतर परंपरा को मुख्य पाठ में नहीं मिलाया गया।
- source_word: רְעֵלָיָה
  choice: रेलायाह
  rationale: WLC/मसोरेटिक पाठ के नामरूप का लिप्यंतरण; नहेमायाह 7:7 का भिन्न रूप पादटिप्पणी में सुरक्षित है।
- source_word: מָרְדֳּכַי
  choice: मोर्दकै
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: בִּלְשָׁן
  choice: बिलशान
  rationale: हिब्रू नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: מִסְפָּר
  choice: मिसपार
  rationale: इस स्थान पर यह सामान्य संज्ञा ‘संख्या’ नहीं, बल्कि व्यक्तिगत नाम है; समानांतर सूची का भिन्न रूप पादटिप्पणी में दिया गया है।
- source_word: בִּגְוַי
  choice: बिगवै
  rationale: हिब्रू व्यक्तिगत नाम का सीधा लिप्यंतरण।
- source_word: רְחוּם
  choice: रहूम
  rationale: मसोरेटिक पाठ के नामरूप को मुख्य पाठ में रखा गया; समानांतर सूची का ‘नहूम’ पादटिप्पणी में है।
- source_word: בַּעֲנָה
  choice: बाना
  rationale: हिब्रू व्यक्तिगत नाम का स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: מִסְפַּר אַנְשֵׁי עַם יִשְׂרָאֵל
  choice: इस्राएली प्रजा के पुरुषों की संख्या यह थी
  rationale: गणना-सूची का परिचय देने वाले खंड को सहज आधुनिक हिन्दी में व्यक्त किया गया है; ‘पुरुषों’ से אַנְשֵׁי और ‘प्रजा’ से עַם का अर्थ बना रहता है।
