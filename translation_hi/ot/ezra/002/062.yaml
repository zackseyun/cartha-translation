base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/062.yaml
  text: These sought their record among those enrolled by genealogy[a], but they were not found, and they were excluded from the priesthood.
translation:
  language: hi
  text: इन्होंने वंशावली-पंजी में अपना अभिलेख खोजा, पर वे उसमें नहीं मिले; इसलिए उन्हें याजकपद से वंचित कर दिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें याजकपद के संबंध में अशुद्ध ठहराया गया,” अथवा “उन्हें याजकपद के लिए अयोग्य माना गया।” इब्रानी क्रिया में वंशावली सत्यापित न हो पाने के कारण याजकीय स्थिति के लिए अनुपयुक्त या अपवित्र ठहराए जाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: इन लोगों ने
  rationale: यह बहुवचन संकेतवाचक शब्द पिछले संदर्भ में आए याजकपद के दावेदारों की ओर संकेत करता है। हिंदी में ‘इन लोगों’ से संदर्भ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: בִּקְשׁוּ
  choice: खोज की
  rationale: בקשׁ का मूल अर्थ ‘ढूँढ़ना/खोजना’ है; यहाँ किसी आधिकारिक प्रमाण को अभिलेखों में तलाशने का भाव है।
- source_word: כְתָבָם
  choice: अपने लिखित प्रमाण
  rationale: כְּתָב लिखित दस्तावेज़ या अभिलेख को दर्शाता है। इस प्रशासनिक संदर्भ में ‘लिखित प्रमाण’ वंशगत दावे को सिद्ध करने वाले दस्तावेज़ का भाव देता है, बिना उसके निश्चित स्वरूप को अनावश्यक रूप से तय किए।
- source_word: הַמִּתְיַחְשִׂים
  choice: वंशावली में नाम लिखे हुए लोगों के अभिलेखों में
  rationale: हित्पाएल रूप वंश के अनुसार पंजीकृत या गिने जाने का भाव देता है। हिंदी वाक्य में यह अभिलेखीय स्थान और वंशावली-पंजीकरण दोनों को स्पष्ट करता है।
- source_word: וְלֹא נִמְצָאוּ
  choice: पर वे उसमें नहीं मिले
  rationale: 'इब्रानी क्रिया बहुवचन है और स्वाभाविक रूप से उन व्यक्तियों को कर्ता मानती है: वे अभिलेख में पाए नहीं गए। ‘उसमें’ जोड़ने से हिंदी में निहित संदर्भ स्पष्ट होता है।'
- source_word: וַיְגֹאֲלוּ
  choice: उन्हें ... अयोग्य ठहराया गया
  rationale: यह दुर्लभ रूप यहाँ अपवित्र या अनुपयुक्त माने जाने और फलतः पद से वंचित किए जाने का भाव रखता है। ‘अयोग्य ठहराया गया’ निर्णय और उसके व्यावहारिक परिणाम दोनों को व्यक्त करता है।
- source_word: מִן הַכְּהֻנָּה
  choice: याजकपद के लिए
  rationale: כְּהֻנָּה याजकीय पद या सेवा को दर्शाता है। וַיְגֹאֲלוּ के साथ हिंदी में ‘याजकपद के लिए अयोग्य’ स्वाभाविक और अर्थानुकूल है।
theological_decisions:
- issue: וַיְגֹאֲלוּ द्वारा याजकीय स्थिति पर दिए गए निर्णय का स्वरूप
  choice: उन्हें याजकपद के लिए अयोग्य ठहराया गया
  alternative: उन्हें याजकपद से अशुद्ध माना गया / याजकपद से निकाल दिया गया
  rationale: इब्रानी क्रिया में अपवित्र माने जाने तथा अयोग्य घोषित होने, दोनों की छाया है। मुख्य पाठ में ‘अयोग्य ठहराया गया’ वंशावली सत्यापित न होने के कारण हुए आधिकारिक निर्णय को स्पष्ट करता है; पादटिप्पणी मूल क्रिया के ‘अशुद्ध’ संबंधी भाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, किंतु सामान्य पाठक के लिए स्पष्ट रूप अपनाया गया है। ‘याजकपद’ प्रशासनिक और धार्मिक दोनों संदर्भों को संक्षेप में व्यक्त करता है; ‘अभिलेख’ और ‘लिखित प्रमाण’ मूल के दस्तावेज़ी भाव को बनाए रखते हैं।
