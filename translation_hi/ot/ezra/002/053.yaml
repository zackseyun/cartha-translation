- source_word: תָמַח
  choice: तेमह
  rationale: हिन्दी बाइबल-परंपरा में पहचाने जाने योग्य प्रचलित रूप रखा गया है; हिब्रू स्वरांकन के अधिक निकट ‘तामह’ को पादटिप्पणी में सुरक्षित किया गया है।
