  choice: के वंशज
  rationale: लौटने वालों की इस वंशावली-सूची में यह पद किसी व्यक्ति के प्रत्यक्ष पुत्रों तक सीमित न होकर उसके परिवार या वंश के लोगों को सूचित करता है; इसलिए आधुनिक हिन्दी में ‘के वंशज’ अधिक स्वाभाविक और प्रसंगानुकूल है।
