  yaml_path: translation/ot/ezra/002/040.yaml
  text: 'The Levites: the sons of Jeshua and Kadmiel[a], of the sons of Hodaviah, seventy-four.'
translation:
  language: hi
  text: 'लेवीय लोग: येशू और कदमीएल के वंशज, होदव्याह[a] के वंशज—चौहत्तर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ ‘होदव्याह’ है; नहेमायाह 7:43 के समानांतर वर्णन में ‘होदेवा’ है।
    reason: textual_variant
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: निश्चित समूह-संज्ञा यहाँ जनगणना की अगली श्रेणी का शीर्षक प्रस्तुत करती है; संक्षिप्त ‘लेवी’ हिंदी में इस सूचीगत कार्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי
  choice: वंशज
  rationale: वंशावली और जनगणना के संदर्भ में यह शब्द केवल प्रत्यक्ष पुत्रों के बजाय परिवार या कुल के सदस्यों को भी सूचित कर सकता है; ‘वंशज’ आधुनिक हिंदी में यही व्यापक अर्थ स्पष्ट करता है।
- source_word: יֵשׁוּעַ
  choice: येशू
  rationale: निर्वासन के बाद के इस इब्रानी व्यक्तिगत नाम का ध्वन्यात्मक लिप्यंतरण किया गया है और इसे ‘यीशु’ के रूप में धर्मवैज्ञानिक रूप से समान नहीं ठहराया गया।
- source_word: וְקַדְמִיאֵל
  choice: और कदमीएल
  rationale: सरल संयोजक के साथ व्यक्तिगत नाम का निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: לִבְנֵי
  choice: के वंश में से
  rationale: उपसर्ग ל यहाँ येशू और कदमीएल के परिवारों को होदव्याह के व्यापक कुल से जोड़ता है; यह रूप संबंध को स्वाभाविक हिंदी में व्यक्त करता है, बिना उसे प्रत्यक्ष पितृत्व तक सीमित किए।
- source_word: הוֹדַוְיָה
  choice: होदव्याह
  rationale: मुख्य पाठ में WLC/मसोरेटिक पाठ के नामरूप का ध्वन्यात्मक लिप्यंतरण रखा गया है; नहेमायाह के समानांतर पाठ का भिन्न रूप पादटिप्पणी में दिया गया है।
- source_word: שִׁבְעִים וְאַרְבָּעָה
  choice: चौहत्तर
  rationale: संख्या का स्वाभाविक आधुनिक हिंदी रूप।
