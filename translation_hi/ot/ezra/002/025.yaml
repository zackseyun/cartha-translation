  terminology: Revise “कपीरा” to “कफीरा” (כְּפִירָה) and “बेरोत” to “बेएरोत” (בְאֵרוֹת). The existing footnote is attached to the wrong name relative to the English audit trail and discusses a cross-passage name-form issue rather than the stated transliteration alternative for כְּפִירָה.
