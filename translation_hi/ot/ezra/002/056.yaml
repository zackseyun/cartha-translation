  text: בְּנֵי יַעְלָ֥ה בְנֵי דַרְק֖וֹן בְּנֵ֥י גִדֵּֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/056.yaml
  text: the sons of Jaalah, the sons of Darkon, the sons of Giddel.
translation:
  language: hi
  text: याला के वंशज, दर्कोन के वंशज और गिद्देल के वंशज।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: निर्वासितों की वापसी से जुड़ी इस वंशावली-सूची में בְּנֵי किसी पूर्वज से संबद्ध परिवार या कुल के लोगों को दर्शाता है। शाब्दिक ‘पुत्र’ की तुलना में ‘वंशज’ आधुनिक हिन्दी में इस सामूहिक अर्थ को अधिक स्वाभाविक और ठीक ढंग से व्यक्त करता है।
- source_word: יַעְלָה
  choice: याला
  rationale: हिब्रू व्यक्तिनाम का देवनागरी लिप्यंतरण; आरंभिक י को ‘य’, दीर्घ ā को ‘ा’ और अंतिम ה को नाम के स्वरांत रूप में दर्शाया गया है।
- source_word: דַרְקוֹן
  choice: दर्कोन
  rationale: हिब्रू व्यक्तिनाम का देवनागरी लिप्यंतरण; इसे अर्थानुवाद करने के बजाय नाम के रूप में रखा गया है।
- source_word: גִדֵּל
  choice: गिद्देल
  rationale: हिब्रू व्यक्तिनाम का देवनागरी लिप्यंतरण; दागेश से सूचित द्वित्व को ‘द्द’ द्वारा रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली। तीनों समानांतर पदों में ‘के वंशज’ दोहराकर हिब्रू संरचना और कुल-सूची का भाव सुरक्षित रखा गया है; अंतिम इकाई से पहले स्वाभाविक हिन्दी संयोजक ‘और’ जोड़ा गया है।
