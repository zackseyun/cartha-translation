    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: वंशावली-सूची में यह पद किसी परिवार या कुल से संबंधित लोगों को दर्शाता है। आधुनिक हिन्दी में ‘के वंशज’ इसका आशय ‘के पुत्रों’ की अपेक्षा अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है, जबकि पद में इसकी पुनरावृत्ति सूची की लय को बनाए रखती है।
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: עֶבֶד का अर्थ ‘दास’ या ‘सेवक’ हो सकता है। यहाँ यह लौटने वालों की सूची में एक स्थापित वर्ग-नाम है; प्रसंग बंधुआ अवस्था पर बल नहीं देता, इसलिए ‘सेवकों’ उपयुक्त है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और पाठकों के लिए सहज हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: סֹטַי
  choice: सोतै
  rationale: इब्रानी नाम का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: הַסֹּפֶרֶת
  choice: हस्सोफेरेत
  rationale: इब्रानी रूप में जुड़ा हुआ निश्चित उपपद הַ नाम के साथ ही लिप्यंतरित किया गया है; इसे सामान्य संज्ञा मानकर अनुवाद नहीं किया गया।
- source_word: פְרוּדָא
  choice: परूदा
  rationale: एज्रा के दिए हुए मसोरेटिक पाठ में यही रूप है। नहेमायाह की समानांतर सूची का भिन्न रूप पादटिप्पणी में सुरक्षित रखा गया है।
