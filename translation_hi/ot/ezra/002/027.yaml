- source_word: אַנְשֵׁי
  choice: के पुरुष
  rationale: यह אִישׁ का संबंधसूचक बहुवचन रूप है। इस जनगणना-सदृश सूची में यह अगले स्थान से जुड़े पुरुषों अथवा पुरुष घराना-प्रतिनिधियों को दर्शाता है; इसलिए व्यापक ‘लोग’ के बजाय ‘पुरुष’ स्रोत के अधिक निकट है।
- source_word: מִכְמָס
  choice: मिकमास
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵאָה עֶשְׂרִים וּשְׁנָיִם
  choice: एक सौ बाईस
  rationale: हिब्रू संख्या का योग स्पष्टतः 100 + 20 + 2 है; इसे स्वाभाविक आधुनिक हिन्दी में प्रस्तुत किया गया है।
