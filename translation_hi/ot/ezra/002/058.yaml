  choice: सभी … कुल
  rationale: כָּל दोनों समूहों की सम्मिलित पूरी संख्या बताता है। हिन्दी में आरम्भ का ‘सभी’ और संख्या से पहले ‘कुल’ वाक्य को स्पष्ट और स्वाभाविक बनाते हैं।
- source_word: הַנְּתִינִים
  choice: मन्दिर के सेवक
  rationale: नतीनीम निर्वासनोत्तर काल में मन्दिर की सेवा के लिए नियुक्त एक विशिष्ट वर्ग का तकनीकी नाम है। कार्यपरक हिन्दी अनुवाद सामान्य पाठक के लिए अर्थ स्पष्ट करता है; तकनीकी शब्द पाद-टिप्पणी में रखा गया है।
- source_word: וּבְנֵי
  choice: और … के वंशज
  rationale: בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह एक वंशगत समूह का नाम प्रस्तुत करता है; ‘वंशज’ आधुनिक हिन्दी में आशय अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: עֶבֶד के अर्थ-क्षेत्र में सेवक और दास दोनों आते हैं। इस प्रशासनिक वंश-सूची में पारंपरिक समूह ‘सुलैमान के सेवक’ अभिप्रेत है; पाठ उनकी कानूनी स्थिति स्पष्ट नहीं करता, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: यह इस नाम का प्रचलित मानक हिन्दी बाइबलीय रूप है।
- source_word: שְׁלֹשׁ מֵאוֹת תִּשְׁעִים וּשְׁנָיִם
  choice: तीन सौ बानवे
  rationale: हिब्रू संख्या का सीधा और स्वाभाविक आधुनिक हिन्दी रूप।
