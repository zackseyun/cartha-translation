  rationale: पद की सूची-परंपरा में इसे निकटता से जुड़े संयुक्त कुलनाम के रूप में लिप्यंतरित किया गया है। हाइफ़न दोनों तत्वों का घनिष्ठ संबंध दिखाता है, जबकि पाठ की वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אָמִי
