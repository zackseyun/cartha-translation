  text: 'The sons of Lod[a], Hadid[b], and Ono: seven hundred twenty-five.'
translation:
  language: hi
  text: लोद[b], हादीद और ओनो के पुत्र[a]—सात सौ पच्चीस।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोद, हादीद और ओनो के वंशज।” लौटनेवालों की इस सूची में “पुत्र” व्यापक रूप से किसी वंश, कुल, समुदाय या स्थान से जुड़े लोगों को भी दर्शा सकता है, केवल सीधे पुरुष-संतानों को नहीं।
    reason: lexical_alternative
  - marker: b
    text: लोद को बाद में लुद्दा नाम से जाना गया।
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: इब्रानी बहुवचन का औपचारिक रूप सुरक्षित रखा गया है। इस लौटनेवालों की सूची में यह केवल सगे पुत्रों तक सीमित न होकर वंशजों, कुल के लोगों या संबंधित बस्ती के निवासियों को भी सूचित कर सकता है; इस व्यापक अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לֹד
  choice: लोद
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण; बाद का नाम ‘लुद्दा’ पादटिप्पणी में दिया गया है।
- source_word: חָדִיד
  choice: हादीद
  rationale: इब्रानी स्थान-नाम का स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: וְאוֹנוֹ
  choice: और ओनो
  rationale: संयोजक वाव को ‘और’ तथा स्थान-नाम को ‘ओनो’ के रूप में प्रस्तुत किया गया है।
- source_word: שְׁבַע מֵאוֹת עֶשְׂרִים וַחֲמִשָּׁה
  choice: सात सौ पच्चीस
  rationale: इब्रानी संख्या-क्रम का सटीक मान 725 है, जिसे मानक आधुनिक हिन्दी में व्यक्त किया गया है।
