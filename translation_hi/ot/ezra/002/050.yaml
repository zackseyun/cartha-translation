lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: लौटने वालों की इस वंशावली-सूची में यह शब्द किसी पूर्वज अथवा कुलनाम से पहचाने जाने वाले समूह को सूचित करता है। ‘वंशज’ स्वाभाविक हिन्दी में सामूहिक अर्थ स्पष्ट करता है और इसे केवल प्रत्यक्ष पुत्रों तक सीमित नहीं करता।
- source_word: אַסְנָה
  choice: अस्ना
  rationale: व्यक्तिवाचक अथवा कुलनाम का हिब्रू रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: מעינים
  choice: मऊनीम
  rationale: यह वंशावली-सूची में एक समूह का नाम है। मुख्य पाठ में प्रचलित मसोरेटी पठन के निकट रूप रखा गया है; लिप्यंतरण की वैकल्पिक परंपरा पादटिप्पणी में दी गई है।
- source_word: נפיסים
  choice: नफीसीम
  rationale: समूह के नाम को उपलब्ध हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है; वैकल्पिक स्वरांकन से मिलने वाला रूप पादटिप्पणी में सुरक्षित रखा गया है।
