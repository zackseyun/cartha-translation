base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/069.yaml
  text: 'According to their ability they gave to the treasury for the work: 61,000 gold darics[a], 5,000 minas of silver[b], and 100 priests’ tunics.'
translation:
  language: hi
  text: 'उन्होंने अपनी सामर्थ्य के अनुसार कार्य के कोष में दिया: सोने के 61,000 दारिक[a], चाँदी के 5,000 माने[b], और याजकों के 100 अंगवस्त्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने के सिक्के”; यहाँ प्रयुक्त इब्रानी शब्द विशेष रूप से फ़ारसी दारिक मुद्राओं को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: माना प्राचीन काल में भार और मुद्रा की एक इकाई था।
    reason: cultural_note
lexical_decisions:
- source_word: כְּכֹחָם
  choice: अपनी सामर्थ्य के अनुसार
  rationale: כְּ के साथ כֹּחַ यहाँ देने की मात्रा को उनकी क्षमता या साधनों के अनुपात में व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए मूल अर्थ बनाए रखता है।
- source_word: נָתְנוּ
  choice: उन्होंने ... दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है; संदर्भ से दान का भाव स्पष्ट है, इसलिए अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: לְאוֹצַר הַמְּלָאכָה
  choice: निर्माण-कार्य के कोष में
  rationale: אוֹצָר को ‘कोष’ और מְלָאכָה को इस संदर्भ में मंदिर के निर्माण/पुनर्निर्माण के कार्य के रूप में व्यक्त किया गया है। ‘निर्माण-कार्य’ हिंदी पाठक के लिए अभिप्राय स्पष्ट करता है।
- source_word: דַּרְכְּמוֹנִים
  choice: दारिक
  rationale: यह फ़ारसी स्वर्ण-मुद्रा का विशिष्ट नाम है; सामान्य ‘सोने के सिक्के’ की अपेक्षा ऐतिहासिक विशिष्टता सुरक्षित रहती है।
- source_word: שֵׁשׁ רִבֹּאות וָאֶלֶף
  choice: 61,000
  rationale: शाब्दिक संख्या ‘छह दस-हज़ार और एक हज़ार’ का सुबोध संख्यात्मक रूप।
- source_word: מָנִים
  choice: माने
  rationale: מָנֶה प्राचीन भार और मुद्रा की इकाई है। इसे किसी अनुमानित आधुनिक इकाई में बदलने के बजाय ऐतिहासिक नाम रखा गया है।
- source_word: חֲמֵשֶׁת אֲלָפִים
  choice: 5,000
  rationale: सूची में स्पष्टता और संख्यात्मक शैली की संगति के लिए अंक प्रयुक्त किए गए हैं।
- source_word: כָתְנֹת כֹּהֲנִים
  choice: याजकों के ... अंगरखे
  rationale: כֻּתֹּנֶת विशिष्ट रूप से अंगरखे या लंबे अधोवस्त्र/परिधान को दर्शाता है; ‘वस्त्र’ की अपेक्षा ‘अंगरखे’ अधिक सटीक है, जबकि संबंध की संभावित व्यापकता हिंदी संबंधकारक में बनी रहती है।
- source_word: מֵאָה
  choice: '100'
  rationale: अन्य मात्राओं के साथ शैलीगत संगति के लिए अंक में प्रस्तुत किया गया है।
