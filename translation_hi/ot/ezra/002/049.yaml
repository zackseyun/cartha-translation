lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: निर्वासितों की इस वंश-सूची में यह रचना केवल सगे पुत्रों तक सीमित न होकर किसी पूर्वज से निकले परिवार या वंश को सूचित कर सकती है। ‘के वंशज’ आधुनिक हिन्दी में यही अभिप्राय स्वाभाविक और स्पष्ट रूप से व्यक्त करता है, जबकि तीनों पदों में इब्रानी की पुनरावृत्ति भी बनाए रखता है।
- source_word: עֻזָּא
  choice: उज्जा
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; दागेश से सूचित द्वित्व को ‘ज्ज’ द्वारा दर्शाया गया है।
- source_word: פָסֵחַ
  choice: पासेह
  rationale: इब्रानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण; अंतिम ח को हिन्दी पाठक के लिए सहज ‘ह’ से व्यक्त किया गया है।
- source_word: בֵסָי
  choice: बेसै
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; अंतिम -ַי की ध्वनि को ‘-ै’ से व्यक्त किया गया है।
