  rationale: इस स्थान-नाम का प्रचलित हिंदी बाइबलीय रूप ‘यरीहो’ रखा गया है।
- source_word: שְׁלֹשׁ מֵאוֹת אַרְבָּעִים וַחֲמִשָּׁה
  choice: तीन सौ पैंतालीस
  rationale: हिब्रू संख्या-क्रम का सीधा योग 345 है। शब्दों में लिखना सूची की गरिमापूर्ण शैली और हिंदी की स्वाभाविक पठनीयता के अनुरूप है।
