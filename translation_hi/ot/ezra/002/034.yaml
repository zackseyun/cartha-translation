- source_word: בְּנֵי
  choice: के लोग
  rationale: वंशावली और जनगणना-सदृश सूचियों में בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर किसी स्थान के नाम के साथ यह प्रायः उस स्थान से जुड़े लोगों को दर्शाता है। हिंदी में ‘यरीहो के पुत्र’ अस्वाभाविक और भ्रामक हो सकता है; ‘के लोग’ आशय को सहज रूप में व्यक्त करता है।
- source_word: יְרֵחוֹ
