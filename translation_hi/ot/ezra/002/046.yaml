lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: निर्वासितों से लौटे कुलों की इस सूची में यह पद किसी व्यक्ति से निकले परिवार या कुल-समूह को दर्शाता है। हिंदी में ‘के वंशज’ इस आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है; शाब्दिक ‘के पुत्र’ यहाँ केवल प्रत्यक्ष पुत्रों का भ्रामक संकेत दे सकता है।
- source_word: חָגָב
  choice: हागाब
  rationale: यह व्यक्ति अथवा कुल का नाम है, इसलिए इसका अर्थानुवाद न करके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: שמלי
  choice: शमलै
  rationale: यह व्यक्ति अथवा कुल का नाम है। व्यंजनात्मक पाठ שמלי के आधार पर ‘शमलै’ निकट लिप्यंतरण है; संबंधित नाम-परंपराओं में ‘शलमै’ भी मिलता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: חָנָן
  choice: हानान
  rationale: यह व्यक्ति अथवा कुल का नाम है, इसलिए हिब्रू के निकट देवनागरी लिप्यंतरण किया गया है।
