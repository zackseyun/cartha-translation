base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/063.yaml
  text: And the governor said to them that they should not eat from the most holy things until a priest should arise with Urim and Thummim[a][b][c].
translation:
  language: hi
  text: तब राज्यपाल[a] ने उनसे कहा कि वे परमपवित्र वस्तुओं[b] में से तब तक न खाएँ, जब तक ऊरीम और तुम्मीम[c] के साथ कोई याजक प्रकट न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तिर्शाता”; यह फ़ारसी प्रशासनिक पदवी थी।
    reason: lexical_alternative
  - marker: b
    text: अर्थात विशेष रूप से पवित्र मानी जाने वाली भेंटों में से याजकों के खाने के अंश; यहाँ “परमपवित्र स्थान” का उल्लेख नहीं है।
    reason: cultural_note
  - marker: c
    text: ऊरीम और तुम्मीम याजक के द्वारा परमेश्वर से पूछने के पवित्र साधन थे; उनका ठीक रूप और उनके प्रयोग की विधि निश्चित रूप से ज्ञात नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: הַתִּרְשָׁתָא
  choice: राज्यपाल
  rationale: यह फ़ारसी प्रशासनिक पदवी है। आधुनिक हिन्दी में अर्थ स्पष्ट करने के लिए पद का अनुवाद किया गया है; पारंपरिक नाम ‘तिर्शाता’ को पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר לֹא יֹאכְלוּ
  choice: कि वे ... न खाएँ
  rationale: यह राज्यपाल के कथन में निहित अप्रत्यक्ष निषेधाज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र वस्तुओं में से
  rationale: इब्रानी की अतिशयोक्तिपरक पवित्रता को बनाए रखते हुए यह उन अति-पवित्र चढ़ावों में से याजकीय खाद्य-अंशों की ओर संकेत करता है, न कि परमपवित्र स्थान की ओर।
- source_word: עַד עֲמֹד כֹּהֵן
  choice: जब तक ... कोई याजक उपस्थित न हो
  rationale: עַד के साथ यह उस भावी समय-बिंदु को बताता है जब योग्य याजक सामने आए या उपलब्ध हो। ‘उपस्थित न हो’ आधुनिक हिन्दी में प्रशासनिक निर्णय के संदर्भ में स्वाभाविक है।
- source_word: לְאוּרִים וּלְתֻמִּים
  choice: ऊरीम और तुम्मीम के साथ
  rationale: इन विशिष्ट पवित्र शब्दों का लिप्यंतरण उनकी ऐतिहासिक और धार्मिक विशिष्टता बनाए रखता है। לְ का ‘के साथ’ अनुवाद ऐसे याजक का भाव देता है जो इनके द्वारा पूछताछ कर सके।
theological_decisions:
- issue: इस प्रसंग में קֹדֶשׁ הַקֳּדָשִׁים का आशय
  choice: परमपवित्र चढ़ावों के वे अंश जिन्हें याजक खाते थे
  alternative: स्थान के रूप में परमपवित्र स्थान
  rationale: संदर्भ विवादित याजकीय वंशावली और पवित्र भोजन खाने की पात्रता का है। इसलिए यह वाक्यांश खाने योग्य पवित्र अंशों को दर्शाता है, भवन के भीतरी पवित्र स्थान को नहीं।
- issue: ऊरीम और तुम्मीम का निरूपण
  choice: तकनीकी पदों को लिप्यंतरित रखना
  alternative: इनका अर्थानुवाद करना, जैसे ‘ज्योतियाँ और सिद्धताएँ’
  rationale: इनका सटीक रूप और इनके प्रयोग की विधि अनिश्चित है। लिप्यंतरण इस धार्मिक विशिष्टता और ऐतिहासिक अनिश्चितता दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘परमपवित्र वस्तुओं’ से मूल की व्यापक अभिव्यक्ति सुरक्षित है, जबकि पादटिप्पणी संदर्भगत अर्थ स्पष्ट करती है। तकनीकी नामों के लिए प्रचलित हिन्दी बाइबलीय लिप्यंतरण ‘ऊरीम और तुम्मीम’ अपनाया गया है।
