- source_word: בְּנֵי
  choice: के वंशज
  rationale: इस लौटनेवालों की सूची में בְּנֵי किसी व्यक्ति के केवल प्रत्यक्ष पुत्रों के बजाय उसके कुल या वंश के सदस्यों को सूचित करता है। इसलिए स्वाभाविक और संदर्भानुकूल हिन्दी में ‘के वंशज’ रखा गया है; तीनों बार इसकी पुनरावृत्ति मूल की सूचीबद्ध संरचना भी बनाए रखती है।
- source_word: לְבָנָה
  choice: लबाना
  rationale: इब्रानी स्वरांकन के अनुसार व्यक्तिनाम/कुलनाम का देवनागरी लिप्यंतरण।
- source_word: חֲגָבָה
  choice: हगाबा
  rationale: इब्रानी नाम का सरल, आधुनिक हिन्दी में उच्चारणयोग्य लिप्यंतरण; आरंभिक ח को यहाँ प्रचलित हिन्दी बाइबलीय शैली के अनुरूप ‘ह’ से दर्शाया गया है।
- source_word: עַקּוּב
  choice: अक्कूब
  rationale: द्वित्वयुक्त קּ को ‘क्क’ और ū स्वर को ‘ऊ’ से दर्शाते हुए इब्रानी नाम का निकट लिप्यंतरण।
