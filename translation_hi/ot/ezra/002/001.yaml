  rationale: शाब्दिक रूप ‘प्रदेश के पुत्र’ इब्रानी मुहावरा है, जिसका आशय उस प्रशासनिक प्रदेश के सदस्य या निवासी हैं। मुख्य पाठ में स्वाभाविक आधुनिक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
