  text: These are the sons of the province who came up from the captivity of the exiles[a], whom Nebuchadnezzar king of Babylon had carried away to Babylon, and they returned to Jerusalem and Judah[c][b], each to his own city.
translation:
  language: hi
  text: ये उस प्रदेश के लोग[a] हैं, जो निर्वासितों की कैद से चढ़ आए थे[b]। इन्हें बाबेल का राजा नबूकदनेस्सर निर्वासित करके बाबेल ले गया था; और वे यरूशलेम और यहूदा लौट आए—हर एक अपने नगर को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “प्रदेश के पुत्र”; यह उस प्रदेश के लोगों या सदस्यों के लिए इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “निर्वासन से” अथवा “कैद से।” इब्रानी अभिव्यक्ति अधिक पूर्ण है; शाब्दिक रूप से, “निर्वासितों की बंदी-अवस्था से।”
    reason: lexical_alternative
