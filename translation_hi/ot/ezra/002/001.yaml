- source_word: מִשְּׁבִי הַגּוֹלָה
  choice: निर्वासितों की बंधुआई से
  rationale: इस संयुक्त अभिव्यक्ति में ‘बंधुआई/बंदी अवस्था’ और ‘निर्वासित लोग’ दोनों तत्व हैं। हिन्दी में कुछ असामान्य होते हुए भी यह चयन मूल की पूर्ण और दोहरी अभिव्यक्ति को बनाए रखता है।
- source_word: הֶגְלָה
  choice: निर्वासित करके ... ले गया था
  rationale: हिफ़ील रूप बलपूर्वक देश से निकालने और निर्वासन में भेजने को व्यक्त करता है। यह हिन्दी प्रयोग घटना को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: הַמְּדִינָה
  choice: प्रदेश
  rationale: फ़ारसी काल के संदर्भ में यह शब्द सामान्यतः प्रशासनिक प्रान्त या प्रदेश को दर्शाता है। ‘प्रदेश’ आधुनिक हिन्दी में सहज है।
- source_word: נבוכדנצור
  choice: नबूकदनेस्सर
  rationale: यह नाम का हिन्दी बाइबलीय परंपरा में प्रचलित और पहचाना जाने वाला लिप्यंतरण है।
- source_word: וַיָּשׁוּבוּ
  choice: फिर वे ... लौट आए
  rationale: यह क्रिया स्पष्ट रूप से वापसी बताती है। ‘फिर’ कथन के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि लौटने का अर्थ सीधे सुरक्षित रहता है।
- source_word: אִישׁ לְעִירוֹ
  choice: हर एक अपने नगर में
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘हर एक’ है। यह हिन्दी में सहज है और प्रत्येक व्यक्ति के अपने नगर में लौटने का भाव बनाए रखता है।
