source:
  edition: WLC
  text: וַ/יֵּשְׁב֣וּ הַ/כֹּהֲנִ֣ים וְ֠/הַ/לְוִיִּם וּֽ/מִן הָ/עָ֞ם וְ/הַ/מְשֹׁרְרִ֧ים וְ/הַ/שּׁוֹעֲרִ֛ים וְ/הַ/נְּתִינִ֖ים בְּ/עָרֵי/הֶ֑ם וְ/כָל יִשְׂרָאֵ֖ל בְּ/עָרֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/070.yaml
  text: So the priests[a], the Levites, some of the people, the singers, the gatekeepers, and the temple servants lived in their cities, and all Israel lived in their cities.
translation:
  language: hi
  text: इस प्रकार याजक, लेवीय, प्रजा में से कुछ लोग, गायक, द्वारपाल और मंदिर के सेवक[a] अपने-अपने नगरों में बस गए; और समस्त इस्राएल भी अपने-अपने नगरों में बस गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “नतीनीम”; मंदिर की सेवा के लिए नियुक्त एक विशिष्ट वर्ग। इस नाम का शाब्दिक भाव “दिए हुए लोग” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: बस गए
  rationale: वापसी और पुनर्वास के इस कथात्मक संदर्भ में ישׁב निवास ग्रहण करने का भाव देता है। ‘बस गए’ स्वाभाविक हिन्दी में इस परिणामसूचक अर्थ को व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: निर्वासनोत्तर उपासना-संदर्भ में כהנים के लिए प्रचलित और स्पष्ट हिन्दी पद।
- source_word: הַלְוִיִּם
  choice: लेवीय
  rationale: यह याजकों से अलग लेवीवंशी धार्मिक समूह का मानक नाम है।
- source_word: וּמִן הָעָם
  choice: प्रजा में से कुछ लोग
  rationale: यहाँ מן अंशवाचक है और नामित मंदिर-सेवकों से अलग सामान्य प्रजा के एक भाग को सूचित करता है।
- source_word: הַמְשֹׁרְרִים
  choice: गायक
  rationale: यह पद मंदिर में गायन की सेवा के लिए नियुक्त लोगों को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשּׁוֹעֲרִים
  choice: द्वारपाल
  rationale: मंदिर के द्वारों की देखरेख और रक्षा करने वालों के लिए स्पष्ट आधुनिक हिन्दी पद।
- source_word: הַנְּתִינִים
  choice: मंदिर के सेवक
  rationale: यह मंदिर-सेवा के लिए नियुक्त एक विशिष्ट वर्ग का पारिभाषिक नाम है। अर्थपूर्ण अनुवाद सामान्य पाठक को उनका कार्य बताता है; मूल नाम पादटिप्पणी में सुरक्षित है।
- source_word: בְּעָרֵיהֶם
  choice: अपने-अपने नगरों में
  rationale: बहुवचन संबंधसूचक रूप प्रत्येक समूह के अपने नगरों में निवास का भाव देता है; ‘अपने-अपने’ हिन्दी में वितरणात्मक अर्थ को स्वाभाविक बनाता है।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और समस्त इस्राएल
  rationale: सामूहिक पद को उसकी व्यापकता सहित रखा गया है; यह लौटे हुए इस्राएली समुदाय को संबोधित करता है।
theological_decisions:
- issue: הַנְּתִינִים पारिभाषिक पद का अनुवाद
  choice: मंदिर के सेवक
  alternative: नतीनीम
  rationale: कार्यसूचक अनुवाद आधुनिक पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी पारंपरिक तकनीकी नाम और मूल की शाब्दिक धारणा को सुरक्षित रखती है। इससे किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। सूची की मूल संरचना और अंतिम सामूहिक वाक्यांश का संतुलन सुरक्षित है। हिब्रू की दूसरी क्रिया-लोपित उपवाक्य-रचना को हिन्दी में स्पष्टता के लिए ‘बस गया’ दोहराकर व्यक्त किया गया है।
