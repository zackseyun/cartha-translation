- source_word: אַנְשֵׁי
  choice: के पुरुष
  rationale: אִישׁ का रचनात्मक बहुवचन इस जनगणना-सूची में इन स्थानों से जुड़े पुरुषों को दर्शाता है; ‘के पुरुष’ मूल के पुल्लिंग रूप को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֵית אֵל
  choice: बेतेल
  rationale: स्थानवाचक नाम का अर्थानुवाद न करके हिन्दी में प्रचलित बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: וְהָעָי
  choice: और ऐ
  rationale: यह स्थानवाचक नाम है। हिब्रू का निश्चित उपपद हिन्दी में नाम के साथ आवश्यक नहीं है; इसलिए स्वाभाविक रूप ‘ऐ’ रखा गया है।
- source_word: מָאתַיִם עֶשְׂרִים וּשְׁלֹשָׁה
  choice: दो सौ तेईस
  rationale: मूल संख्या 223 का सीधा, स्पष्ट और आधुनिक हिन्दी रूप।
