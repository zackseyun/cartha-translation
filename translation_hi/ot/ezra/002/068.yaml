id: EZR.2.68
reference: Ezra 2:68
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֵ/רָאשֵׁי֙ הָֽ/אָב֔וֹת בְּ/בוֹאָ֕/ם לְ/בֵ֥ית יְהוָ֖ה אֲשֶׁ֣ר בִּ/ירוּשָׁלִָ֑ם הִֽתְנַדְּבוּ֙ לְ/בֵ֣ית הָֽ/אֱלֹהִ֔ים לְ/הַעֲמִיד֖/וֹ עַל מְכוֹנֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/002/068.yaml
  text: And some of the heads of the fathers’ houses[a], when they came to the house of Yahweh that is in Jerusalem, gave freewill offerings for the house of God[c][b], to set it up on its foundation.
translation:
  language: hi
  text: और पितृकुलों के मुखियाओं में से कुछ ने, जब वे यरूशलेम में स्थित यहोवा के भवन में पहुँचे, परमेश्वर के भवन को उसके नियत स्थान पर खड़ा करने के लिए स्वेच्छा से भेंट दीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी नींव पर।” इब्रानी शब्द का अर्थ भवन का नियत स्थान, स्थल या आधार हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵרָאשֵׁי הָאָבוֹת
  choice: और पितृकुलों के मुखियाओं में से कुछ
  rationale: מִן का अंशवाचक अर्थ ‘में से कुछ’ है। ‘पितृकुल’ इस्राएली वंश-आधारित सामाजिक इकाई को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּבוֹאָם
  choice: जब वे ... पहुँचे
  rationale: בְּ के साथ क्रियार्थक संज्ञा यहाँ समयसूचक है; हिंदी में ‘जब वे पहुँचे’ इसका स्वाभाविक रूप है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: בַּיִת का मूल अर्थ ‘भवन/घर’ है और यहाँ मंदिर का संकेत करता है; ‘भवन’ स्रोत की समानांतर शब्दावली बनाए रखता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר בִּירוּשָׁלָם
  choice: यरूशलेम में स्थित
  rationale: यह संबंधवाचक उपवाक्य भवन का स्थान बताता है; ‘स्थित’ हिंदी में स्पष्ट और सहज है।
- source_word: הִתְנַדְּבוּ
  choice: स्वेच्छा से भेंट दीं
  rationale: נדב के हित्पाएल रूप में स्वैच्छिक और इच्छापूर्वक योगदान देने पर बल है; संदर्भ में दान का भाव स्पष्ट करने के लिए ‘भेंट दीं’ उचित है।
- source_word: לְבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन को
  rationale: לְ यहाँ भेंट के लाभार्थी/उद्देश्य को दर्शाता है। ‘भवन’ पहले आए בַּיִת के साथ शब्दगत समानता सुरक्षित रखता है।
- source_word: לְהַעֲמִידוֹ
  choice: उसे ... खड़ा करने के लिए
  rationale: עמד का हिफ़ील रूप ‘खड़ा करना/स्थापित करना’ है। मंदिर-निर्माण के संदर्भ में ‘खड़ा करना’ ठोस है और पुनर्निर्माण से अधिक कुछ आरोपित नहीं करता।
- source_word: עַל מְכוֹנוֹ
  choice: उसके नियत स्थान पर
  rationale: מָכוֹן का अर्थ स्थिर या नियत स्थान, स्थल अथवा आधार हो सकता है। ‘नियत स्थान’ मूल की स्थानगत व्यापकता को बनाए रखता है और केवल भौतिक नींव का अर्थ निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिंदी में प्रचलित रूप ‘यहोवा’ नाम और אֱלֹהִים के लिए प्रयुक्त ‘परमेश्वर’ के बीच भेद बनाए रखता है।
- issue: הָאָבוֹת की सामाजिक-संरचनात्मक अभिव्यक्ति
  choice: पितृकुलों
  alternative: परिवारों / पूर्वजों के घरानों
  rationale: यह पद पुरुष पूर्वज से पहचानी जाने वाली इस्राएली कुल-इकाइयों को सूचित करता है। ‘पितृकुल’ स्रोत-संस्कृति को बनाए रखते हुए आधुनिक हिंदी में समझने योग्य है।
- issue: מְכוֹנוֹ का अर्थ
  choice: उसके नियत स्थान पर
  alternative: उसकी नींव पर
  rationale: शब्द में स्थिर स्थान और आधार दोनों अर्थ संभव हैं। मुख्य पाठ में व्यापक स्थानगत अर्थ रखा गया है, ताकि अस्पष्टता को अनावश्यक रूप से केवल ‘नींव’ तक सीमित न किया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’ स्रोत की सामाजिक संरचना को सुरक्षित रखता है; ‘नियत स्थान’ מָכוֹן की वास्तविक अर्थगत व्यापकता बनाए रखता है।
