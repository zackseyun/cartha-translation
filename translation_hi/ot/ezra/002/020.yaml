lexical_decisions:
- source_word: בְּנֵי
  choice: वंशज
  rationale: लौटकर आए लोगों की इस सूची में בְּנֵי किसी व्यक्ति के प्रत्यक्ष पुत्रों तक सीमित न होकर उसके कुल या परिवार के सदस्यों को सूचित करता है। आधुनिक हिन्दी में “वंशज” इस आशय को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: גִבָּר
  choice: गिब्बार
  rationale: यह एक व्यक्तिवाचक नाम है। हिब्रू के व्यंजन और स्वरांकन को ध्यान में रखते हुए इसका लिप्यंतरण “गिब्बार” किया गया है।
- source_word: תִּשְׁעִים וַחֲמִשָּׁה
  choice: पचानवे
  rationale: हिब्रू में शाब्दिक रूप से “नब्बे और पाँच” है; मानक आधुनिक हिन्दी में इसकी स्वाभाविक संख्या-अभिव्यक्ति “पचानवे” है।
