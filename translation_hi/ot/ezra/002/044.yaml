  text: the sons of Keros[a], the sons of Siaha, the sons of Padon.
translation:
  language: hi
  text: केरोस के वंशज[a], सियाहा के वंशज, पादोन के वंशज।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावली-सूचियों में “वंशज” किसी कुल या वंश-परंपरा के सदस्यों को दर्शा सकता है; इसका अर्थ केवल प्रत्यक्ष पुत्र नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: के वंशज
  rationale: इस लौटने वालों की वंशावली-सूची में यह पद किसी नामित कुल या वंश के सदस्यों को दर्शाता है, केवल प्रत्यक्ष पुत्रों को नहीं। हिंदी में ‘के वंशज’ इस संदर्भगत अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: קֵרֹס
  choice: केरोस
  rationale: यह व्यक्ति अथवा कुल का नाम है; इसका अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है। ‘केरोस’ इब्रानी स्वरांकन को निकटता से दर्शाता है।
- source_word: סִיעֲהָא
  choice: सियाहा
  rationale: यह मंदिर के सेवकों के एक कुल का नाम है। मसोराई पाठ के पूर्ण रूप को बनाए रखते हुए ‘सियाहा’ लिप्यंतरित किया गया है।
- source_word: פָדוֹן
  choice: पादोन
  rationale: यह एक कुलनाम है। ‘पादोन’ इब्रानी स्वरांकन का निकट देवनागरी लिप्यंतरण है।
theological_decisions: []
translation_notes:
  register: संक्षिप्त सूची-शैली और मूल पाठ की तीन समानांतर इकाइयाँ सुरक्षित रखी गई हैं। आधुनिक मानक हिंदी में ‘वंशज’ चुना गया है, क्योंकि शाब्दिक ‘पुत्र’ यहाँ तत्काल जैविक पुत्रों का भ्रामक संकेत दे सकता है।
