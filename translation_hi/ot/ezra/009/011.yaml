source:
  edition: WLC
  text: אֲשֶׁ֣ר צִוִּ֗יתָ בְּ/יַ֨ד עֲבָדֶ֣י/ךָ הַ/נְּבִיאִים֮ לֵ/אמֹר֒ הָ/אָ֗רֶץ אֲשֶׁ֨ר אַתֶּ֤ם בָּאִים֙ לְ/רִשְׁתָּ֔/הּ אֶ֤רֶץ נִדָּה֙ הִ֔יא בְּ/נִדַּ֖ת עַמֵּ֣י הָ/אֲרָצ֑וֹת בְּ/תוֹעֲבֹֽתֵי/הֶ֗ם אֲשֶׁ֥ר מִלְא֛וּ/הָ מִ/פֶּ֥ה אֶל פֶּ֖ה בְּ/טֻמְאָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/011.yaml
  text: which you commanded by the hand of your servants the prophets[a], saying, ‘The land that you are entering to possess is a land of impurity because of the impurity of the peoples of the lands[b], because of their abominations with which they have filled it from end to end with their uncleanness.’
translation:
  language: hi
  text: 'जिसकी आज्ञा तूने अपने सेवक नबियों के द्वारा दी थी: “जिस देश में तुम अधिकार करने के लिए प्रवेश कर रहे हो, वह अशुद्ध देश[b] है—देशों के लोगों की अशुद्धता और उनके घृणित कामों के कारण, जिनसे उन्होंने उसे अपनी अशुद्धता से एक छोर से दूसरे छोर तक भर दिया है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “एक छोर से दूसरे छोर तक” का इब्रानी में शाब्दिक रूप “मुँह से मुँह तक” है; यहाँ इसका अर्थ है कि देश पूरी तरह भर गया है।
    reason: lexical_alternative
  - marker: b
    text: “अशुद्ध देश” का अनुवाद “अशुद्धता का देश” भी हो सकता है। मूल शब्द में धार्मिक और नैतिक, दोनों प्रकार की अपवित्रता के भाव हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּיַד
  choice: के द्वारा
  rationale: यहाँ इब्रानी मुहावरा माध्यम अथवा प्रतिनिधित्व व्यक्त करता है; हिंदी में ‘के द्वारा’ स्वाभाविक है और नबियों के माध्यम से दी गई आज्ञा का भाव बनाए रखता है।
- source_word: עֲבָדֶיךָ הַנְּבִיאִים
  choice: अपने सेवकों, नबियों
  rationale: ‘सेवक’ इस संदर्भ में परमेश्वर के आदरणीय प्रतिनिधियों के लिए उपयुक्त है; ‘नबियों’ को समानाधिकरण में रखने से मूल संबंध स्पष्ट रहता है।
- source_word: לְרִשְׁתָּהּ
  choice: अधिकार करने के लिए
  rationale: ירשׁ भूमि को अपने अधिकार में लेने का भाव देता है; यह चयन वाचा-संबंधी भूमि के संकेत को बिना ‘विरासत’ का अर्थ अनिवार्य किए व्यक्त करता है।
- source_word: אֶרֶץ נִדָּה
  choice: अशुद्धता का देश
  rationale: נִדָּה में अशुद्धता और अपवित्रता के धार्मिक तथा नैतिक दोनों संकेत हो सकते हैं; अमूर्त संज्ञा वाला मूल रूप सुरक्षित रखा गया है।
- source_word: בְּנִדַּת עַמֵּי הָאֲרָצוֹת
  choice: देश-देश के लोगों की अशुद्धता के कारण
  rationale: ב को यहाँ कारणसूचक समझा गया है। बहुवचन ‘देशों’ का सामूहिक और स्वाभाविक हिंदी रूप ‘देश-देश के’ रखा गया है।
- source_word: בְּתוֹעֲבֹתֵיהֶם
  choice: उनके घृणित कामों के कारण
  rationale: תועבה केवल मनोभाव नहीं, घृणित प्रथाओं या कर्मों को सूचित कर सकता है; ‘घृणित काम’ आधुनिक पाठक के लिए स्पष्ट और गंभीर है।
- source_word: מִפֶּה אֶל־פֶּה
  choice: एक छोर से दूसरे छोर तक
  rationale: शाब्दिक रूप ‘मुँह से मुँह तक’ यहाँ संपूर्ण भौगोलिक विस्तार का मुहावरा है; अर्थ को स्वाभाविक हिंदी में व्यक्त किया गया है।
- source_word: בְּטֻמְאָתָם
  choice: अपनी अशुद्धता से
  rationale: करणसूचक अर्थ रखा गया है और आरंभ की अशुद्धता-संबंधी शब्दावली से संबंध स्पष्ट किया गया है।
theological_decisions:
- issue: देश की अशुद्धता का स्वरूप
  choice: अशुद्धता की भाषा को धार्मिक और नैतिक दोनों संभावित अर्थों सहित रखा गया है।
  alternative: इसे केवल अनुष्ठानिक अपवित्रता या केवल नैतिक भ्रष्टता के रूप में अनूदित करना।
  rationale: נִדָּה, טֻמְאָה और תּוֹעֵבָה एक साथ ऐसे अपवित्रण को व्यक्त करते हैं जिसे मूल पाठ केवल एक आधुनिक श्रेणी तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। परमेश्वर को संबोधन में एकवचन ‘तू’ रखा गया है, क्योंकि प्रार्थना का निकट और पारंपरिक बाइबलीय संबोधन यही है। उद्धरण और कारणसूचक वाक्य-विन्यास को हिंदी में स्पष्ट बनाने के लिए वाक्य विभाजित किया गया है।
