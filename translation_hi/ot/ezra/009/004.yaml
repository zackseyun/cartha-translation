source:
  edition: WLC
  text: וְ/אֵלַ֣/י יֵאָסְפ֗וּ כֹּ֤ל חָרֵד֙ בְּ/דִבְרֵ֣י אֱלֹהֵֽי יִשְׂרָאֵ֔ל עַ֖ל מַ֣עַל הַ/גּוֹלָ֑ה וַ/אֲנִי֙ יֹשֵׁ֣ב מְשׁוֹמֵ֔ם עַ֖ד לְ/מִנְחַ֥ת הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/004.yaml
  text: Then everyone who trembled at the words of the God of Israel because of the unfaithfulness of the exiles gathered to me[b][a], while I sat appalled until the evening offering.
translation:
  language: hi
  text: तब वे सब लोग, जो निर्वासित समुदाय के विश्वासघात के कारण इस्राएल के परमेश्वर के वचनों से काँपते थे, मेरे पास इकट्ठे हुए; और मैं साँझ की भेंट[a] के समय तक स्तब्ध बैठा रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘साँझ की भेंट’ में ‘भेंट’ इब्रानी मिन्हा का अनुवाद है, जो प्रायः अन्नबलि को दर्शाता है; यहाँ नियमित साँझ की मंदिर-भेंट के आधार पर समय बताया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: יֵאָסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ लोगों के एज्रा के पास एकत्र होने को व्यक्त करता है। ‘इकट्ठे हुए’ स्वाभाविक हिंदी है और क्रिया को अनावश्यक रूप से कर्मवाच्य नहीं बनाता।
- source_word: כֹּל חָרֵד
  choice: वे सब लोग, जो … काँपते थे
  rationale: כֹּל के साथ एकवचन विशेषण सामूहिक अर्थ देता है। यह हिंदी रूप उस सामूहिकता और परमेश्वर के वचनों के प्रति भययुक्त श्रद्धा दोनों को बनाए रखता है।
- source_word: בְּדִבְרֵי אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर के वचनों से
  rationale: חרד के साथ ב भय के विषय अथवा कारण को दर्शा सकता है। ‘वचनों से काँपते थे’ हिंदी में स्वाभाविक है और मूल के बहुवचन דִבְרֵי को सुरक्षित रखता है।
- source_word: עַל מַעַל הַגּוֹלָה
  choice: निर्वासित समुदाय के विश्वासघात के कारण
  rationale: מַעַל परमेश्वर के प्रति निष्ठा भंग करने वाला अपराध बताता है; ‘विश्वासघात’ इसकी गंभीरता और संबंधपरक आयाम व्यक्त करता है। הַגּוֹלָה यहाँ निर्वासन से जुड़े लौटे हुए समुदाय को सामूहिक रूप से दर्शाता है।
- source_word: יֹשֵׁב מְשׁוֹמֵם
  choice: स्तब्ध बैठा रहा
  rationale: यह पद एज्रा की लगातार बैठी हुई मुद्रा और आघात से जड़ हो जाने की दशा दोनों बताता है। ‘स्तब्ध बैठा रहा’ आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: עַד לְמִנְחַת הָעָרֶב
  choice: साँझ की भेंट के समय तक
  rationale: מִנְחָה प्रायः अन्नबलि को दर्शाता है, पर यहाँ नियमित साँझ की मंदिर-भेंट के द्वारा समय बताया गया है। ‘भेंट’ मूल शब्द की व्यापकता को बनाए रखती है।
theological_decisions:
- issue: वाचा-संबंधी पाप के प्रसंग में מַעַל का अनुवाद
  choice: विश्वासघात
  alternative: अविश्वासयोग्यता; अपराध
  rationale: यह शब्द केवल सामान्य भूल नहीं, बल्कि परमेश्वर के प्रति निष्ठा के उल्लंघन को व्यक्त करता है। ‘विश्वासघात’ इस संबंधपरक और धार्मिक गंभीरता को स्पष्ट रखता है।
- issue: הַגּוֹלָה का आशय
  choice: निर्वासित समुदाय
  alternative: निर्वासित लोग; लौटे हुए निर्वासित; निर्वासन
  rationale: यह संज्ञा यहाँ निर्वासन का अमूर्त अनुभव नहीं, बल्कि निर्वासन से संबद्ध लोगों के समुदाय को दर्शाती है। ‘निर्वासित समुदाय’ इस सामूहिक आशय को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सहज किंतु गरिमापूर्ण बाइबलीय शैली। ‘परमेश्वर के वचनों से काँपते थे’ मूल की भययुक्त श्रद्धा बनाए रखता है। वाक्यक्रम को हिंदी की स्वाभाविकता के लिए समायोजित किया गया है।
