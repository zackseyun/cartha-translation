    rationale: Hindi -कर makes the first action the means or attendant circumstance of the second. The Hebrew coordinates ‘to break your commandments’ and ‘to intermarry’; it should be rendered with ‘और.’
  - severity: low
    issue: ‘हमारा पूरी तरह अंत’ is unnatural Hindi.
