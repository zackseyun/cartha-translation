  naturalness: The respectful prayer register is appropriate. Coordinating the Hindi verbs directly and replacing the awkward ‘हमारा पूरी तरह अंत’ with ‘हमारा सर्वनाश’ produces more natural modern Hindi while retaining the source’s force.
  terminology: ‘आज्ञाएँ,’ ‘विवाह-संबंध,’ ‘घृणित काम,’ and ‘शेष जन’ are suitable. ‘बच निकला हुआ व्यक्ति’ preserves the concrete survivor sense of פְלֵיטָה. The rendering of the peoples as those who do such practices is a defensible contextual clarification, and the note retains the compressed Hebrew construction.
  issues:
