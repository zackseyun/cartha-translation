reference: Ezra 9:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/נָשׁוּב֙ לְ/הָפֵ֣ר מִצְוֺתֶ֔י/ךָ וּ֨/לְ/הִתְחַתֵּ֔ן בְּ/עַמֵּ֥י הַ/תֹּעֵב֖וֹת הָ/אֵ֑לֶּה הֲ/ל֤וֹא תֶֽאֱנַף בָּ֨/נוּ֙ עַד כַּלֵּ֔ה לְ/אֵ֥ין שְׁאֵרִ֖ית וּ/פְלֵיטָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/014.yaml
  text: Shall we again break your commandments and intermarry with the peoples of these abominations? Would you not be angry with us until you had consumed us[b][a], leaving no remnant or survivor?
translation:
  language: hi
  text: क्या हम फिर से आपकी आज्ञाएँ तोड़ें और उन लोगों के साथ विवाह-संबंध करें जो ये घृणित काम करते हैं?[a] क्या आप हम पर क्रोधित होकर हमारा ऐसा सर्वनाश न कर देंगे कि कोई शेष जन या बच निकला हुआ व्यक्ति न बचे?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “इन घृणित कामों के लोगों के साथ।” इब्रानी पदबंध संभवतः ऐसे कामों से पहचाने जाने वाले लोगों की ओर संकेत करता है।'
    reason: lexical_alternative
  - marker: b
    text: या, “यहाँ तक कि कोई अवशेष या बचा हुआ व्यक्ति न रहे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲנָשׁוּב
  choice: क्या हम फिर से
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है, पर यहाँ अगले दो क्रियार्थक रूपों के साथ इसका आशय पहले की अवज्ञा को फिर से करना है।
- source_word: לְהָפֵר מִצְוֺתֶיךָ
  choice: आपकी आज्ञाओं को तोड़कर
  rationale: הפר का वाचा और विधि-संबंधी अर्थ आज्ञा का उल्लंघन करना है; ‘तोड़ना’ सहज हिंदी में उसका बल बनाए रखता है।
- source_word: וּלְהִתְחַתֵּן
  choice: वैवाहिक संबंध जोड़ें
  rationale: חתן का हित्पएल रूप किसी दूसरे समुदाय के साथ विवाह-संबंध स्थापित करने को दर्शाता है; यह समूहगत और पारस्परिक भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּעַמֵּי הַתֹּעֵבוֹת הָאֵלֶּה
  choice: उन लोगों के साथ ... जो ये घृणित काम करते हैं
  rationale: शाब्दिक रचना ‘इन घृणित कामों के लोग’ संक्षिप्त और संदिग्ध है। चुना हुआ रूप लोगों को उनकी प्रथाओं से चिह्नित करता है, उनकी जातीय पहचान को अपने-आप घृणित नहीं ठहराता।
- source_word: הֲלוֹא תֶאֱנַף בָּנוּ
  choice: क्या आप हम पर क्रोधित होकर ... न कर देंगे
  rationale: אנף तीव्र क्रोध को व्यक्त करता है और הֲלוֹא अपेक्षित सकारात्मक उत्तर वाला आलंकारिक प्रश्न बनाता है।
- source_word: עַד כַּלֵּה
  choice: हमारा पूरी तरह अंत
  rationale: כלה यहाँ पूर्णतः समाप्त कर देने या नष्ट कर देने का भाव रखता है; यह हिंदी रूप परिणाम और संपूर्णता दोनों को स्पष्ट करता है।
- source_word: שְׁאֵרִית וּפְלֵיטָה
  choice: कोई शेष जन या बच निकला हुआ व्यक्ति
  rationale: 'दोनों समानांतर पदों का भेद रखा गया है: שארית जो शेष रहे, और פליטה जो विनाश से बच निकले।'
theological_decisions:
- issue: आसपास के लोगों और ‘घृणित कामों’ का संबंध
  choice: लोगों को घृणित प्रथाएँ करने वाले लोगों के रूप में व्यक्त किया गया है।
  alternative: ‘इन घृणित कामों के लोगों के साथ’
  rationale: इब्रानी संबंधवाचक रचना संक्षिप्त है। मुख्य पाठ संभावित आशय स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप और वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: शेष बचे लोगों की दोहरी अभिव्यक्ति
  choice: ‘शेष जन’ और ‘बच निकला हुआ व्यक्ति’ दोनों रखे गए हैं।
  alternative: केवल ‘कोई जीवित न बचे’
  rationale: इससे न्याय के बाद बचे अवशेष और बच निकलने वाले व्यक्ति के बीच इब्रानी समानांतरता तथा व्यापक बाइबिलीय ‘शेष’ प्रतिध्वनि बनी रहती है।
- issue: ईश्वरीय क्रोध और पूर्ण विनाश की आलंकारिक आशंका
  choice: प्रश्न को अपेक्षित ‘हाँ’ वाले आलंकारिक प्रश्न के रूप में रखा गया है।
  alternative: ‘तब आप क्रोधित होकर हमारा अंत कर देंगे’
  rationale: הֲלוֹא की प्रश्नात्मक शक्ति और प्रार्थना में व्यक्त धर्मवैज्ञानिक तनाव को कथन बनाकर समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का आदरपूर्ण प्रार्थना-स्वर रखा गया है। परमेश्वर के लिए ‘आप’ प्रयुक्त है। ‘वैवाहिक संबंध जोड़ना’ सामुदायिक अंतर्विवाह का भाव देता है, और ‘घृणित काम’ साधारण पाठक के लिए स्पष्ट रहते हुए תועבות की नैतिक-धार्मिक तीव्रता बनाए रखता है।
