source:
  edition: WLC
  text: וָ/אֹמְרָ֗/ה אֱלֹהַ/י֙ בֹּ֣שְׁתִּי וְ/נִכְלַ֔מְתִּי לְ/הָרִ֧ים אֱלֹהַ֛/י פָּנַ֖/י אֵלֶ֑י/ךָ כִּ֣י עֲוֺנֹתֵ֤י/נוּ רָבוּ֙ לְ/מַ֣עְלָ/ה רֹּ֔אשׁ וְ/אַשְׁמָתֵ֥/נוּ גָדְלָ֖ה עַ֥ד לַ/שָּׁמָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/006.yaml
  text: And I said[a], “My God, I am ashamed and humiliated to lift up my face to you, my God, because our iniquities have multiplied above our heads, and our guilt has grown as high as the heavens.”
translation:
  language: hi
  text: और मैंने कहा, “हे मेरे परमेश्वर, मैं अपना मुख तेरी ओर उठाने में लज्जित और अपमानित हूँ, हे मेरे परमेश्वर, क्योंकि हमारे अधर्म हमारे सिर के ऊपर बढ़ गए हैं[a], और हमारा दोष बढ़कर आकाश तक पहुँच गया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘हमारे सिर के ऊपर।’ इब्रानी में ‘सिर’ एकवचन है, पर यहाँ उसका अर्थ सामूहिक है।
    reason: मूल इब्रानी मुहावरे के एकवचन रूप और हिन्दी के सामूहिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: בֹּשְׁתִּי וְנִכְלַמְתִּי
  choice: लज्जित और शर्मसार हूँ
  rationale: दोनों निकटार्थक क्रियाओं को रखकर एज्रा की गहरी लज्जा और अपमान-बोध की तीव्रता व्यक्त की गई है; वर्तमान काल प्रसंग की स्थितिमूलक भावना को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: לְהָרִים ... פָּנַי אֵלֶיךָ
  choice: अपना मुख तेरी ओर उठाने में
  rationale: मूल पाठ के ‘मुख उठाने’ वाले बिंब को सुरक्षित रखता है और उसे ‘आँखें उठाने’ में नहीं बदलता।
- source_word: עֲוֺנֹתֵינוּ
  choice: हमारे अधर्म
  rationale: नैतिक बुराई और अपराध की गंभीरता व्यक्त करता है तथा आगे आने वाले אַשְׁמָה के लिए ‘दोष’ शब्द अलग रखता है।
- source_word: רָבוּ
  choice: इतने बढ़ गए हैं
  rationale: क्रिया के बढ़ने अथवा बहुत हो जाने के भाव को व्यक्त करता है और अगले ऊर्ध्वगामी बिंब से स्वाभाविक रूप से जुड़ता है।
- source_word: לְמַעְלָה רֹאשׁ
  choice: हमारे सिर से भी ऊपर
  rationale: अधर्मों के नियंत्रण से परे बढ़ जाने का मूल इब्रानी बिंब बनाए रखता है; हिन्दी में सामूहिक एकवचन ‘सिर’ स्वाभाविक है।
- source_word: אַשְׁמָתֵנוּ
  choice: हमारा दोष
  rationale: यहाँ शब्द बलिदान नहीं, अपराध से उत्पन्न दोष अथवा उत्तरदायित्व दर्शाता है; ‘दोष’ इसे पहले आए ‘अधर्म’ से अलग रखता है।
- source_word: גָדְלָה עַד לַשָּׁמָיִם
  choice: बढ़कर आकाश तक पहुँच गया है
  rationale: अत्यधिक बढ़े हुए दोष के ऊर्ध्वगामी अतिशयोक्तिपूर्ण बिंब को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: प्रत्यक्ष संबोधन स्पष्ट करता है और मूल में दो बार आए संबोधन को बलाघात सहित बनाए रखता है।
- source_word: וָאֹמְרָה
  choice: और मैंने कहा
  rationale: वाव-क्रम के साधारण कथात्मक प्रवाह को बिना अतिरिक्त व्याख्या के दर्शाता है।
