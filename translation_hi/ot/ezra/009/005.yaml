  yaml_path: translation/ot/ezra/009/005.yaml
  text: At the evening offering I rose from my fasting[a], with my garment and my robe torn, and I fell on my knees and spread out my hands to Yahweh my God.
translation:
  language: hi
  text: साँझ की भेंट[a] के समय मैं अपने उपवास से उठा। मेरे वस्त्र और मेरा चोगा फटे हुए थे। तब मैं घुटनों के बल झुककर अपने परमेश्वर याहवे की ओर हाथ फैलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “साँझ की भेंट” का अधिक विशिष्ट अनुवाद “साँझ की अन्नबलि” हो सकता है। इब्रानी शब्द प्रायः अन्नबलि के लिए आता है, पर यहाँ यह सामान्य रूप से साँझ के बलिदान के समय को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְמִנְחַת הָעֶרֶב
  choice: साँझ की भेंट के समय
  rationale: מִנְחָה का अर्थ भेंट, अन्नबलि या नियमित बलिदान का समय हो सकता है। यहाँ व्यापक और स्वाभाविक ‘साँझ की भेंट’ चुना गया है; अधिक विशिष्ट अर्थ पादटिप्पणी में रखा गया है।
- source_word: קַמְתִּי מִתַּעֲנִיתִי
  choice: मैं अपने उपवास से उठा
  rationale: קום का सीधा अर्थ ‘उठना’ है और תַּעֲנִיתִי यहाँ शोक के साथ किए गए उपवास को सूचित करता है। यह अभिव्यक्ति मूल की संक्षिप्तता बनाए रखती है।
- source_word: וּבְקָרְעִי בִגְדִי וּמְעִילִי
  choice: मेरे वस्त्र और मेरा चोगा फटे हुए थे
  rationale: בֶּגֶד और מְעִיל के बीच भेद बनाए रखने के लिए ‘वस्त्र’ और ‘चोगा’ लिया गया है। इब्रानी रचना साथ चल रही परिस्थिति बताती है।
- source_word: וָאֶכְרְעָה עַל בִּרְכַּי
  choice: तब मैं घुटनों के बल झुक गया
  rationale: כרע झुकने या घुटने टेकने की क्रिया है। ‘घुटनों के बल झुक गया’ स्वाभाविक हिन्दी में प्रार्थना की मुद्रा को स्पष्ट रखता है।
- source_word: וָאֶפְרְשָׂה כַפַּי
  choice: अपने हाथ फैलाए
  rationale: פרשׂ के साथ כף खुली हथेलियों या हाथों को प्रार्थना में फैलाने का संकेत देता है; हिन्दी में ‘हाथ फैलाए’ सहज और चित्रात्मक है।
- source_word: אֶל יְהוָה אֱלֹהָי
  choice: अपने परमेश्वर यहोवा की ओर
  rationale: אֶל की दिशात्मकता ‘की ओर’ से व्यक्त होती है। व्यक्तिगत संबंध אֱלֹהָי में ‘अपने परमेश्वर’ से और יהוה का नाम ‘यहोवा’ से दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना प्रस्तुत करता है; ‘याहवे’ संभावित उच्चारण है, पर सामान्य पाठक के लिए कम परिचित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। शोक की स्थिति और प्रार्थना की शारीरिक मुद्राओं को स्पष्ट रखा गया है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित कथन के अंत में रखा गया है।
