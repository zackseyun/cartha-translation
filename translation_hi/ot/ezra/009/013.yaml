  text: וְ/אַֽחֲרֵי֙ כָּל הַ/בָּ֣א עָלֵ֔י/נוּ בְּ/מַעֲשֵׂ֨י/נוּ֙ הָ/רָעִ֔ים וּ/בְ/אַשְׁמָתֵ֖/נוּ הַ/גְּדֹלָ֑ה כִּ֣י אַתָּ֣ה אֱלֹהֵ֗י/נוּ חָשַׂ֤כְתָּֽ לְ/מַ֨טָּה֙ מֵֽ/עֲוֺנֵ֔/נוּ וְ/נָתַ֥תָּה לָּ֛/נוּ פְּלֵיטָ֖ה כָּ/זֹֽאת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/013.yaml
  text: And after all that has come upon us because of our evil deeds and our great guilt—though you, our God, have punished us less than our iniquities deserve and have given us such a remnant as this—
translation:
  language: hi
  text: और हमारे बुरे कामों और हमारे बड़े दोष के कारण जो कुछ हम पर आ पड़ा है, उस सबके बाद भी, हे हमारे परमेश्वर, तूने हमें हमारे अधर्म के योग्य दण्ड से कम दण्ड दिया है[a] और ऐसा बचा हुआ समुदाय हमें दिया है[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने हमें हमारे अधर्म के योग्य दण्ड से अधिक बख्शा है।” इब्रानी मुहावरे में परमेश्वर द्वारा उनके अधर्म के योग्य पूरी मात्रा से कम न्याय करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “ऐसा बचाव” अथवा “ऐसे बचे हुए लोग।” यह शब्द न्याय के बीच बच निकलने और बचे हुए लोगों—दोनों का संकेत दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחֲרֵי
  choice: और ... उस सबके बाद भी
  rationale: प्रार्थना के पिछले वाक्य से संबंध बनाए रखता है; ‘भी’ आगे आने वाले कृपालु विरोधाभास को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַבָּא עָלֵינוּ
  choice: जो कुछ हम पर आ पड़ा है, उस सब
  rationale: ‘हम पर आना’ वाली इब्रानी अभिव्यक्ति और विपत्ति के समग्र भाव, दोनों को बनाए रखता है।
- source_word: בְּמַעֲשֵׂינוּ הָרָעִים וּבְאַשְׁמָתֵנוּ הַגְּדֹלָה
  choice: हमारे बुरे कामों और हमारे बड़े दोष के कारण
  rationale: בְּ का कारणसूचक अर्थ स्पष्ट करता है; אַשְׁמָה को केवल अपराध-बोध की भावना नहीं, बल्कि वस्तुगत दोष के रूप में प्रस्तुत करता है।
- source_word: כִּי
  choice: भी—हे हमारे परमेश्वर
  rationale: 'यहाँ कथन में रियायत अथवा विरोध का भाव है: इतनी विपत्ति और दोष के बावजूद परमेश्वर ने दया की। हिन्दी वाक्य-विन्यास में यह भाव ‘बाद भी’ से स्वाभाविक रूप से आता है।'
- source_word: חָשַׂכְתָּ לְמַטָּה מֵעֲוֺנֵנוּ
  choice: तूने हमारे अधर्म के योग्य दण्ड से हमें कम दण्ड दिया
  rationale: शाब्दिक मुहावरा ‘हमारे अधर्म से नीचे रोक रखा’ अस्पष्ट होगा। चुना हुआ रूप यह स्पष्ट करता है कि मिला हुआ न्याय उनके अधर्म के योग्य पूर्ण दण्ड से कम था, जबकि पादटिप्पणी मूल ‘रोकने/बख्शने’ की छवि सुरक्षित रखती है।
- source_word: עָוֺן
  choice: अधर्म
  rationale: यह शब्द दोषपूर्ण दुष्कर्म और उससे जुड़ी दण्ड-योग्यता की गंभीरता को व्यक्त करता है।
- source_word: פְּלֵיטָה כָּזֹאת
  choice: ऐसा बचा हुआ समुदाय
  rationale: פְּלֵיטָה के बचे हुए लोगों के सामूहिक अर्थ को स्पष्ट करता है और निर्वासन के बाद संरक्षित समुदाय का संदर्भ बनाए रखता है।
theological_decisions:
- issue: लोगों के योग्य दण्ड की तुलना में परमेश्वर की दया
  choice: तूने हमारे अधर्म के योग्य दण्ड से हमें कम दण्ड दिया
  alternative: तूने हमारे अधर्म के अनुपात से नीचे ही रोक लिया / तूने हमें हमारे अधर्म से बढ़कर बख्शा
  rationale: इब्रानी मुहावरे का आशय है कि परमेश्वर ने दोष के पूरे योग्य परिणाम तक न्याय नहीं पहुँचाया। मुख्य पाठ अर्थ को स्पष्ट रखता है और पादटिप्पणी मूल क्रिया की वैकल्पिक छाया बताती है।
- issue: פְּלֵיטָה का सामूहिक और उत्तर-निर्वासनकालीन अर्थ
  choice: बचा हुआ समुदाय
  alternative: बचाव / बचे हुए लोग / शेष जन
  rationale: संज्ञा बच निकलने की अवस्था अथवा बचे हुए लोगों को सूचित कर सकती है। यहाँ परमेश्वर द्वारा सुरक्षित लौटे हुए समूह का आशय प्रमुख है; फिर भी पादटिप्पणी शब्द की वास्तविक व्यापकता बनाए रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली; परमेश्वर के लिए निकट किंतु सम्मानपूर्ण एकवचन ‘तू’। पद मूल वाक्य की निरंतरता के कारण दीर्घ डैश पर खुला छोड़ा गया है।
