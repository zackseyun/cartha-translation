id: EZR.9.10
reference: Ezra 9:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֛ה מַה נֹּאמַ֥ר אֱלֹהֵ֖י/נוּ אַֽחֲרֵי זֹ֑את כִּ֥י עָזַ֖בְנוּ מִצְוֺתֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/010.yaml
  text: And now[a], what shall we say, our God, after this? For we have forsaken your commandments.
translation:
  language: hi
  text: और अब, हे हमारे परमेश्वर, इसके बाद हम क्या कहें? क्योंकि हमने आपकी आज्ञाओं को छोड़ दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालसूचक עתה दोनों को स्वाभाविक हिंदी में बनाए रखते हुए प्रार्थना के अगले विचार की ओर संक्रमण व्यक्त करता है।
- source_word: מַה נֹּאמַר
  choice: हम क्या कहें
  rationale: प्रथम पुरुष बहुवचन अपूर्ण रूप यहाँ विचारात्मक और अलंकारिक भाव रखता है; हिंदी संभाव्य रूप अपराध-बोध से उपजी निरुत्तरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֱלֹהֵינוּ
  choice: हे हमारे परमेश्वर
  rationale: यह प्रार्थना में प्रत्यक्ष संबोधन है; 'हे' हिंदी में संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: אַחֲרֵי זֹאת
  choice: इसके बाद
  rationale: पिछले वर्णित पाप और संकट की ओर संकेत करने वाली संक्षिप्त, स्वाभाविक कालसूचक अभिव्यक्ति।
- source_word: כִּי
  choice: क्योंकि
  rationale: एज्रा के निरुत्तर होने का कारण प्रस्तुत करने वाले व्याख्यात्मक संबंध को स्पष्ट करता है।
- source_word: עָזַבְנוּ
  choice: हमने ... छोड़ दिया है
  rationale: עזב के परित्याग संबंधी अर्थ और वर्तमान तक प्रासंगिक पूर्ण कृत्य को सामान्य आधुनिक हिंदी में व्यक्त करता है; संदर्भ इसे साधारणतः पीछे छोड़ने के बजाय परमेश्वर की आज्ञाओं के त्याग के रूप में गंभीर बनाता है।
- source_word: מִצְוֺתֶיךָ
  choice: आपकी आज्ञाओं
  rationale: מצוות के वाचा-संबंधी और नैतिक भार के लिए 'आज्ञाएँ' मानक, स्पष्ट और गरिमापूर्ण हिंदी है।
theological_decisions:
- issue: एज्रा की अंगीकार-प्रार्थना का स्वर
  choice: परमेश्वर के सामने अपराध-बोध और निरुत्तरता व्यक्त करने वाला अलंकारिक प्रश्न
  alternative: आगे क्या कहना है, इस विषय में मार्गदर्शन माँगने वाला साधारण प्रश्न
  rationale: '''हम क्या कहें ... क्योंकि हमने आपकी आज्ञाओं को छोड़ दिया है'' पश्चात्तापपूर्ण निरुत्तरता व्यक्त करता है; अनुवाद इस भाव को बिना व्याख्यात्मक विस्तार के बनाए रखता है।'
- issue: עזב की वाचागत गंभीरता
  choice: आज्ञाओं को छोड़ देना
  alternative: आज्ञाओं का उल्लंघन करना / आज्ञाओं को त्याग देना
  rationale: मूल क्रिया का परित्याग-बोध बनाए रखा गया है, पर हिंदी में ऐसा संप्रदायगत या अतिरिक्त धर्मवैज्ञानिक शब्द नहीं जोड़ा गया जो मूल में स्पष्ट नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रार्थनापूर्ण, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल के विचारात्मक प्रश्न को 'हम क्या कहें?' से सुरक्षित रखा गया है। 'हे' संबोधन को स्पष्ट करता है, और आदरसूचक 'आपकी' प्रार्थना के स्वाभाविक हिंदी प्रयोग के अनुरूप है।
