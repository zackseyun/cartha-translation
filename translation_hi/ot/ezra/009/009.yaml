  text: כִּֽי עֲבָדִ֣ים אֲנַ֔חְנוּ וּ/בְ/עַבְדֻ֔תֵ/נוּ לֹ֥א עֲזָבָ֖/נוּ אֱלֹהֵ֑י/נוּ וַֽ/יַּט עָלֵ֣י/נוּ חֶ֡סֶד לִ/פְנֵי֩ מַלְכֵ֨י פָרַ֜ס לָֽ/תֶת לָ֣/נוּ מִֽחְיָ֗ה לְ/רוֹמֵ֞ם אֶת בֵּ֤ית אֱלֹהֵ֨י/נוּ֙ וּ/לְ/הַעֲמִ֣יד אֶת חָרְבֹתָ֔י/ו וְ/לָֽ/תֶת לָ֣/נוּ גָדֵ֔ר בִּֽ/יהוּדָ֖ה וּ/בִ/ירוּשָׁלִָֽם־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/009.yaml
  text: For we are servants[a]; yet in our slavery our God has not forsaken us, but has extended covenant faithfulness to us before the kings of Persia, to give us reviving, to raise up the house of our God, to set up its ruins[b], and to give us a wall in Judah and in Jerusalem.
translation:
  language: hi
  text: क्योंकि हम दास हैं; फिर भी हमारी दासता में हमारे परमेश्वर ने हमें नहीं छोड़ा, बल्कि फ़ारस के राजाओं के सामने हम पर अपना अटल प्रेम[a] दिखाया, ताकि हमें नवजीवन मिले, हमारे परमेश्वर के भवन को फिर से खड़ा किया जाए, उसके उजड़े हुए स्थानों को बहाल किया जाए, और हमें यहूदा तथा यरूशलेम में एक बाड़[b] मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम’ का अनुवाद ‘वाचा की निष्ठा,’ ‘अटल करुणा,’ या ‘कृपा’ भी किया जा सकता है। इब्रानी חֶסֶד में निष्ठावान और कृपामय प्रेम का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दीवार’ अथवा ‘सुरक्षा का घेरा।’ यह छवि केवल शाब्दिक दीवार की नहीं, बल्कि यहूदा और यरूशलेम में मिली सुरक्षा की भी हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבָדִים / וּבְעַבְדֻתֵנוּ
  choice: दास / हमारी दासता में
  rationale: दोनों सजातीय इब्रानी शब्दों का संबंध बनाए रखता है और फ़ारसी शासन के अधीन समुदाय की पराधीन स्थिति को बिना नरम किए व्यक्त करता है।
- source_word: עֲזָבָנוּ
  choice: हमें नहीं छोड़ा
  rationale: עזב का स्वाभाविक आधुनिक हिन्दी रूप है; प्रार्थना और वाचा-संबंधी संदर्भ में त्याग न देने का भाव स्पष्ट रखता है।
- source_word: וַיַּט עָלֵינוּ חֶסֶד
  choice: हम पर अपना अटल प्रेम दिखाया
  rationale: חֶסֶד के निष्ठावान, कृपामय प्रेम को सहज हिन्दी में व्यक्त करता है; ‘अपना’ परमेश्वर के सक्रिय अनुग्रह को स्पष्ट करता है, जबकि पादटिप्पणी अर्थ-विस्तार सुरक्षित रखती है।
- source_word: לִפְנֵי מַלְכֵי פָרַס
  choice: फ़ारस के राजाओं के सामने
  rationale: לִפְנֵי के संबंधात्मक और उपस्थिति-सूचक अर्थ को निकटता से बनाए रखता है।
- source_word: מִחְיָה
  choice: नवजीवन
  rationale: निर्वासनोत्तर समुदाय के जीवन-संरक्षण और पुनरुत्थान, दोनों भावों को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: לְרוֹמֵם אֶת בֵּית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन को फिर से खड़ा करे
  rationale: रूम धातु के ‘ऊँचा उठाने/खड़ा करने’ के चित्र को मंदिर के पुनर्निर्माण के संदर्भ में स्वाभाविक हिन्दी देता है; ‘भवन’ मूल ‘घर’ की धार्मिक अभिव्यक्ति को बनाए रखता है।
- source_word: וּלְהַעֲמִיד אֶת חָרְבֹתָיו
  choice: उसके खंडहरों को पुनः खड़ा करे
  rationale: हिफ़ील रूप के ‘खड़ा करना’ भाव और उजड़े हुए अवशेषों की ठोस छवि दोनों को बनाए रखता है, यद्यपि हिन्दी में जानबूझकर कुछ असामान्य तनाव रहता है।
- source_word: גָדֵר
  choice: एक बाड़
  rationale: शब्द की ठोस घेराबंदी की छवि को रखता है और ‘दीवार’ कहकर उसे केवल नगर की शाब्दिक प्राचीर तक सीमित नहीं करता।
- source_word: בִּיהוּדָה וּבִירוּשָׁלִָם
  choice: यहूदा तथा यरूशलेम में
  rationale: दोनों בְ उपसर्गों के स्थानवाचक अर्थ का सीधा अनुवाद है और ‘चारों ओर’ जैसा अनकहा अर्थ नहीं जोड़ता।
theological_decisions:
- issue: חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: वाचा की निष्ठा; अटल करुणा; कृपा
  rationale: मुख्य पाठ में सहज और गरिमापूर्ण हिन्दी रखते हुए परमेश्वर के स्थायी, निष्ठावान और कृपामय संबंध का भाव व्यक्त किया गया है। पादटिप्पणी इस बहुअर्थी वाचा-संबंधी शब्द की गहराई को सुरक्षित रखती है।
- issue: גָדֵר का ठोस अथवा रूपक अर्थ
  choice: एक बाड़
  alternative: एक दीवार; सुरक्षा का घेरा
  rationale: मूल की ठोस छवि बनाए रखी गई है, पर पादटिप्पणी स्पष्ट करती है कि यह फ़ारसी राजकीय अनुग्रह से मिली व्यापक सुरक्षा का रूपक भी हो सकता है।
- issue: חָרְבֹתָיו के साथ עמד का कारणवाचक प्रयोग
  choice: उसके खंडहरों को पुनः खड़ा करे
  alternative: उसके उजड़े स्थानों को बहाल करे
  rationale: मूल के ‘खड़ा करने’ के रूपक को तुरंत ‘बहाल करने’ में समतल नहीं किया गया; इस प्रकार पुनर्निर्माण की ठोस छवि और वाक्य का तनाव बने रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रार्थनामय किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। ‘दास/दासता’ की पुनरावृत्ति मूल की शब्द-संगति बनाए रखती है। ‘अटल प्रेम,’ ‘नवजीवन’ और ‘बाड़’ जैसे पद सरल हैं, जबकि पादटिप्पणियाँ मूल के वाचा-संबंधी और रूपकात्मक अर्थ-विस्तार को सुरक्षित रखती हैं।
