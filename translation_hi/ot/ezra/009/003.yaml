source:
  edition: WLC
  text: וּ/כְ/שָׁמְעִ/י֙ אֶת הַ/דָּבָ֣ר הַ/זֶּ֔ה קָרַ֥עְתִּי אֶת בִּגְדִ֖/י וּ/מְעִילִ֑/י וָ/אֶמְרְטָ֞/ה מִ/שְּׂעַ֤ר רֹאשִׁ/י֙ וּ/זְקָנִ֔/י וָ/אֵשְׁבָ֖/ה מְשׁוֹמֵֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/003.yaml
  text: As soon as I heard this matter[a], I tore my garment and my robe, pulled out some of the hair of my head and my beard[b], and sat appalled.
translation:
  language: hi
  text: जैसे ही मैंने यह बात सुनी[a], मैंने अपना वस्त्र और अपना चोगा फाड़ डाला, अपने सिर और दाढ़ी के कुछ बाल नोच लिए[b], और स्तब्ध होकर बैठ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब मैंने यह समाचार सुना।”
    reason: lexical_alternative
  - marker: b
    text: वस्त्र फाड़ना और बाल नोचना शोक, गहरे दुःख या भयावह स्थिति पर प्रतिक्रिया प्रकट करने के प्रचलित तरीके थे।
    reason: cultural_note
lexical_decisions:
- source_word: וּכְשָׁמְעִי
  choice: जैसे ही मैंने ... सुनी
  rationale: वाव, कालवाचक כְּ और क्रियारूप मिलकर सुनने के तत्काल बाद हुई प्रतिक्रिया बताते हैं; यह हिंदी में स्वाभाविक रूप से तात्कालिकता व्यक्त करता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דָּבָר का अर्थ बात, विषय, घटना या समाचार हो सकता है। संदर्भ में 'यह बात' सहज है और इसे केवल मौखिक समाचार तक सीमित नहीं करता।
- source_word: קָרַעְתִּי
  choice: फाड़ डाला
  rationale: क्रिया वस्त्र फाड़ने की तीव्र और पूर्ण कार्रवाई बताती है; 'फाड़ डाला' आधुनिक हिंदी में भाव की प्रबलता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּגְדִי
  choice: अपना वस्त्र
  rationale: בֶּגֶד कपड़े या वस्त्र के लिए सामान्य शब्द है। एकवचन 'वस्त्र' मूल रूप और अगले विशिष्ट बाहरी परिधान से भेद बनाए रखता है।
- source_word: וּמְעִילִי
  choice: अपना चोगा
  rationale: מְעִיל बाहरी लबादा या चोगा है। 'चोगा' सामान्य वस्त्र से इसका भेद स्पष्ट करता है और हिंदी पाठक के लिए समझने योग्य है।
- source_word: וָאֶמְרְטָה
  choice: नोच लिए
  rationale: यह क्रिया बालों को बलपूर्वक उखाड़ने का बोध देती है। 'नोच लिए' संक्षिप्त, स्वाभाविक और क्रिया की तीव्रता के अनुरूप है।
- source_word: מִשְּׂעַר רֹאשִׁי וּזְקָנִי
  choice: अपने सिर और दाढ़ी के कुछ बाल
  rationale: बाल से पहले מִן अंशवाचक अर्थ दे सकता है; 'कुछ बाल' यह स्पष्ट करता है कि सारे बाल उखाड़ने की बात आवश्यक नहीं है।
- source_word: וָאֵשְׁבָה
  choice: बैठ गया
  rationale: יָשַׁב का सामान्य अर्थ बैठना है; घटनाक्रम में 'बैठ गया' हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: מְשׁוֹמֵם
  choice: स्तब्ध होकर
  rationale: यह रूप उजड़ जाने, भयभीत रह जाने या सदमे से जड़ हो जाने की दशा व्यक्त करता है। 'स्तब्ध होकर' भावनात्मक आघात और निष्क्रिय बैठने की अवस्था दोनों को सहज हिंदी में रखता है।
