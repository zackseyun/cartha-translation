source:
  edition: WLC
  text: וְ֠/עַתָּה בְּֽנוֹתֵי/כֶ֞ם אַל תִּתְּנ֣וּ לִ/בְנֵי/הֶ֗ם וּ/בְנֹֽתֵי/הֶם֙ אַל תִּשְׂא֣וּ לִ/בְנֵי/כֶ֔ם וְ/לֹֽא תִדְרְשׁ֧וּ שְׁלֹמָ֛/ם וְ/טוֹבָתָ֖/ם עַד עוֹלָ֑ם לְמַ֣עַן תֶּחֶזְק֗וּ וַ/אֲכַלְתֶּם֙ אֶת ט֣וּב הָ/אָ֔רֶץ וְ/הוֹרַשְׁתֶּ֥ם לִ/בְנֵי/כֶ֖ם עַד עוֹלָֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/012.yaml
  text: So now[a], do not give your daughters to their sons, and do not take their daughters for your sons. Never seek their peace or their prosperity[b], so that you may be strong and eat the good of the land and leave it as an inheritance to your sons forever.
translation:
  language: hi
  text: और अब अपनी बेटियाँ उनके बेटों को न देना, और उनकी बेटियाँ अपने बेटों के लिए न लेना। सदा तक न उनकी शांति की खोज करना, न उनकी भलाई की, ताकि तुम बलवन्त हो जाओ, भूमि की अच्छी उपज खाओ और इस भूमि को अपने बेटों के लिए सदा तक विरासत में छोड़ जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנוֹתֵיכֶם ... לִבְנֵיהֶם
  choice: अपनी बेटियाँ उनके बेटों को न देना
  rationale: इब्रानी की समानान्तर संरचना और विवाह-संबंधी मुहावरे को सीधे बनाए रखता है; अगले खंड से वैवाहिक अर्थ स्पष्ट है।
- source_word: וּבְנֹתֵיהֶם אַל תִּשְׂאוּ לִבְנֵיכֶם
  choice: उनकी बेटियाँ अपने बेटों के लिए न लेना
  rationale: נשא का यहाँ विवाह के लिए ‘लेना’ अर्थ है। हिंदी में ‘अपने बेटों के लिए लेना’ स्रोत के לִבְנֵיכֶם को सुरक्षित रखते हुए विवाह का संकेत देता है।
- source_word: תִדְרְשׁוּ
  choice: खोज करना
  rationale: דרש का सीधा अर्थ ‘खोजना’ है और यहाँ किसी की शान्ति तथा भलाई के लिए सक्रिय प्रयास को व्यक्त करता है।
- source_word: שְׁלֹמָם
  choice: उनकी शान्ति
  rationale: שָׁלוֹם में शान्ति, कुशल और कल्याण का व्यापक भाव है; ‘शान्ति’ निकटतम औपचारिक समतुल्य है और अगले शब्द ‘भलाई’ से व्यापक अर्थ उभरता है।
- source_word: וְטוֹבָתָם
  choice: उनकी भलाई
  rationale: טוֹבָה हित, भलाई या समृद्धि को सूचित करता है। ‘भलाई’ मूल के ‘अच्छे/हित’ भाव को अनावश्यक रूप से केवल आर्थिक समृद्धि तक सीमित नहीं करती।
- source_word: עַד עוֹלָם
  choice: सदा तक
  rationale: निषेध में इस पदबंध की स्थायी और पूर्ण अवधि को औपचारिक रूप से सुरक्षित रखता है।
- source_word: לְמַעַן תֶּחֶזְקוּ
  choice: ताकि तुम बलवन्त हो जाओ
  rationale: לְמַעַן उद्देश्य अथवा परिणाम बताता है और חזק का अर्थ बलवान होना या होते जाना है।
- source_word: וַאֲכַלְתֶּם אֶת טוּב הָאָרֶץ
  choice: देश की उत्तम उपज खाओ
  rationale: शाब्दिक ‘देश की अच्छाई खाओ’ का ठोस खाद्य-बिम्ब रखते हुए हिंदी में अभिप्रेत भूमि की अच्छी उपज को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהוֹרַשְׁתֶּם
  choice: उसे ... विरासत बनाकर छोड़ जाओ
  rationale: ירש का हिफ़ील रूप उत्तराधिकार में दिलाने या छोड़ने का कारणवाचक भाव रखता है। ‘उसे’ निकट संदर्भ में देश को इंगित करता है।
- source_word: לִבְנֵיכֶם
  choice: अपने बेटों के लिए
  rationale: मूल में स्पष्ट पुल्लिंग बहुवचन ‘बेटे’ है; इसे सामान्यीकृत करके ‘सन्तान’ नहीं किया गया।
- source_word: עַד עוֹלָם
  choice: सदा की
  rationale: अन्तिम प्रयोग पीढ़ियों तक बनी रहने वाली विरासत की अवधि व्यक्त करता है; ‘सदा की विरासत’ हिंदी में स्वाभाविक है।
theological_decisions:
- issue: निर्वासनोत्तर वाचा-संदर्भ में जातीय और धार्मिक पृथक्करण की भाषा
  choice: विवाह-संबंध और उन लोगों की शान्ति तथा भलाई खोजने पर लगे निषेध को उसके विशिष्ट वाचा-ऐतिहासिक संदर्भ में स्पष्ट रूप से प्रस्तुत किया गया है।
  alternative: इसे केवल आत्मिक रूप से हानिकारक गठजोड़ों की सामान्य चेतावनी बनाना, या सभी बाहरी लोगों से व्यवहार के लिए सार्वकालिक आदेश के रूप में विस्तार देना।
  rationale: पद एज्रा के निर्वासनोत्तर संदर्भ में वाचा की निष्ठा और मिश्रित उपासना से बचाव की बात करता है। अनुवाद को न आदेश की कठोरता घटानी चाहिए, न पाठ में अनुपस्थित सार्वभौमिक अनुप्रयोग जोड़ना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘बलवन्त’ और ‘विरासत’ बाइबलीय गरिमा रखते हुए सामान्य पाठक के लिए समझने योग्य हैं। निषेध की कठोरता और मूल की समानान्तरता को बिना व्याख्यात्मक नरमी के सुरक्षित रखा गया है।
