  text: מִ/ימֵ֣י אֲבֹתֵ֗י/נוּ אֲנַ֨חְנוּ֙ בְּ/אַשְׁמָ֣ה גְדֹלָ֔ה עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וּ/בַ/עֲוֺנֹתֵ֡י/נוּ נִתַּ֡נּוּ אֲנַחְנוּ֩ מְלָכֵ֨י/נוּ כֹהֲנֵ֜י/נוּ בְּ/יַ֣ד מַלְכֵ֣י הָ/אֲרָצ֗וֹת בַּ/חֶ֜רֶב בַּ/שְּׁבִ֧י וּ/בַ/בִּזָּ֛ה וּ/בְ/בֹ֥שֶׁת פָּנִ֖ים כְּ/הַ/יּ֥וֹם הַ/זֶּֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/007.yaml
  text: From the days of our fathers until this day[a], we have been in great guilt. Because of our iniquities, we, our kings, and our priests have been given into the hand of the kings of the lands, to the sword, to captivity, to plunder, and to shame of face, as it is this day.
translation:
  language: hi
  text: हम अपने पुरखाओं के दिनों से लेकर आज तक भारी दोषी रहे हैं। हमारे अधर्मों के कारण हम, हमारे राजा और हमारे याजक देशों के राजाओं के हाथ में सौंप दिए गए—तलवार, बंधुआई, लूट और सार्वजनिक अपमान[a] के लिए—और आज भी हमारी यही दशा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मुँह की लज्जा”; अर्थात खुला अपमान या सार्वजनिक लज्जा।
    reason: मूल इब्रानी बिंब और उसके मुहावरेदार अर्थ दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: מִימֵי אֲבֹתֵינוּ
  choice: अपने पुरखाओं के दिनों से
  rationale: מִן के साथ यह पद समय के आरंभ-बिंदु को दर्शाता है। ‘पुरखाओं’ से ऐतिहासिक और सामुदायिक निरंतरता स्वाभाविक हिन्दी में बनी रहती है।
- source_word: אֲנַחְנוּ בְּאַשְׁמָה גְדֹלָה
  choice: हम बड़े दोष के भागी रहे हैं
  rationale: אַשְׁמָה यहाँ केवल लज्जा की भावना नहीं, बल्कि वास्तविक दोष या दोषी अवस्था को व्यक्त करता है। ‘रहे हैं’ आरंभ से आज तक जारी दशा को दिखाता है।
- source_word: וּבַעֲוֹנֹתֵינוּ
  choice: हमारे अधर्मों के कारण
  rationale: עָוֹן नैतिक विकृति, अपराध और उसके दोष का बोध करा सकता है; प्रसंग में בְּ कारणसूचक है। ‘अधर्मों’ इसे אַשְׁמָה से अलग रखते हुए बहुवचन भी सुरक्षित रखता है।
- source_word: נִתַּנּוּ ... בְּיַד
  choice: हाथ में सौंप दिए गए
  rationale: נָתַן का निफ़अल कर्मवाच्य है और בְּיַד किसी के अधिकार में दिए जाने का इब्रानी मुहावरा है। हिन्दी में यह रूप अर्थ और मूल बिंब दोनों बनाए रखता है।
- source_word: מַלְכֵי הָאֲרָצוֹת
  choice: देशों के राजाओं
  rationale: אֲרָצוֹת यहाँ पृथ्वी भर के बजाय विभिन्न देशों या राज्यों की ओर संकेत करता है।
- source_word: בַּחֶרֶב בַּשְּׁבִי וּבַבִּזָּה
  choice: तलवार, बंधुआई, लूट ... के लिए
  rationale: ये शत्रुओं के हाथ सौंपे जाने के परिणामों की क्रमिक सूची हैं। ‘बंधुआई’ बंदी दशा को व्यक्त करती है और ‘लूट’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: וּבְבֹשֶׁת פָּנִים
  choice: सार्वजनिक अपमान
  rationale: शाब्दिक ‘मुँह की लज्जा’ खुले और दिखाई देने वाले अपमान का मुहावरा है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूल बिंब पादटिप्पणी में दिया गया है।
- source_word: כְּהַיּוֹם הַזֶּה
  choice: और आज भी हमारी यही दशा है
  rationale: यह मुहावरा बताता है कि वर्णित न्याय की दशा वर्तमान दिन में भी प्रत्यक्ष है। हिन्दी रूप तुलना और वर्तमान निरंतरता दोनों स्पष्ट करता है।
theological_decisions:
- issue: אַשְׁמָה और עָוֹן जैसे स्वीकारोक्ति-संबंधी शब्दों का भेद
  choice: אַשְׁמָה के लिए ‘दोष’ और עָוֹן के लिए ‘अधर्म’
  alternative: दोनों को सामान्य रूप से ‘पाप’ कहना
  rationale: अलग शब्द रखने से सामूहिक दोषी अवस्था और उन अधर्मों के बीच का पाठगत भेद बना रहता है जिनके कारण न्याय आया।
- issue: स्वीकारोक्ति में सामूहिक एकजुटता
  choice: ‘हम, हमारे राजा और हमारे याजक’ को एक ही सामूहिक कर्ता के रूप में रखना
  alternative: केवल नेताओं को अलग से न्याय के अधीन दिखाना
  rationale: इब्रानी पाठ समुदाय, राजाओं और याजकों को साथ रखता है; अनुवाद इस साझा ऐतिहासिक उत्तरदायित्व को कम नहीं करता।
- issue: न्याय की वर्तमान निरंतरता
  choice: अंतिम वाक्यांश को ‘आज भी हमारी यही दशा है’ कहना
  alternative: केवल ‘जैसा आज है’ जैसा अधिक शाब्दिक रूप
  rationale: स्वाभाविक हिन्दी में यह मूल मुहावरे का आशय स्पष्ट करता है, बिना यह तय किए कि सूची का प्रत्येक परिणाम ठीक उसी रूप में उस क्षण जारी था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक प्रार्थना/स्वीकारोक्ति के अनुकूल रखी गई है। ‘पुरखाओं’, ‘याजक’, ‘अधर्म’ और ‘बंधुआई’ जैसे परिचित बाइबलीय शब्दों का उपयोग किया गया है, पर अत्यधिक पुरातन वाक्य-विन्यास से बचा गया है।
