id: EZR.9.15
reference: Ezra 9:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ צַדִּ֣יק אַ֔תָּה כִּֽי נִשְׁאַ֥רְנוּ פְלֵיטָ֖ה כְּ/הַ/יּ֣וֹם הַ/זֶּ֑ה הִנְ/נ֤וּ לְ/פָנֶ֨י/ךָ֙ בְּ/אַשְׁמָתֵ֔י/נוּ כִּ֣י אֵ֥ין לַ/עֲמ֛וֹד לְ/פָנֶ֖י/ךָ עַל זֹֽאת־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/015.yaml
  text: O Yahweh[a], God of Israel, you are righteous, for we have been left as a remnant, as it is this day. Here we are before you in our guilt[c][b], for no one can stand before you because of this.
translation:
  language: hi
  text: हे यहवे, इस्राएल के परमेश्वर, आप धर्मी हैं, क्योंकि हम आज भी बचे हुए लोगों के रूप में शेष हैं। हम अपने दोष सहित आपके सामने हैं, क्योंकि इस कारण आपके सामने कोई ठहर नहीं सकता।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में निकट ध्वन्यात्मक रूप से प्रस्तुत करता है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: צַדִּיק
  choice: धर्मी
  rationale: यहाँ परमेश्वर की नैतिक और न्यायिक धार्मिकता, दोनों के व्यापक भाव को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: परमेश्वर के धर्मी होने के कथन का आधार बताने वाली कारणवाचक शक्ति को स्पष्ट करता है।
- source_word: נִשְׁאַרְנוּ פְלֵיטָה
  choice: हम बचे हुओं के रूप में शेष रह गए हैं
  rationale: निफ़अल की ‘शेष छोड़े जाने/बचे रहने’ की छाया और פְלֵיטָה के बच निकले शेष जन—दोनों को व्यक्त करता है।
- source_word: כְּהַיּוֹם הַזֶּה
  choice: आज के दिन तक
  rationale: वर्तमान समय में दिखाई देने वाली बची हुई दशा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִנְנוּ לְפָנֶיךָ
  choice: देखिए, हम ... आपके सामने हैं
  rationale: הִנְנוּ की प्रस्तुतिकारी और तात्कालिक शक्ति को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: בְּאַשְׁמָתֵינוּ
  choice: अपने दोष के साथ
  rationale: लोगों की दोषयुक्त अवस्था को व्यक्त करता है; ‘दोष’ अपराध और उससे उत्पन्न उत्तरदायित्व दोनों को समेटता है।
- source_word: כִּי אֵין לַעֲמוֹד לְפָנֶיךָ
  choice: क्योंकि ... आपके सामने कोई खड़ा नहीं रह सकता
  rationale: अव्यक्त अस्तित्ववाचक रचना को ‘कोई’ के द्वारा रखते हुए परमेश्वर की उपस्थिति में टिक न सकने का न्यायिक मुहावरा सुरक्षित करता है।
- source_word: עַל זֹאת
  choice: इसके कारण
  rationale: पहले स्वीकार किए गए दोष की ओर संकेत करने वाली कारणवाचक शक्ति को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखा गया है।
- issue: צַדִּיק में परमेश्वर की धार्मिकता का भाव
  choice: आप धर्मी हैं
  alternative: आप न्यायी हैं
  rationale: ‘धर्मी’ नैतिक सहीपन और न्यायपूर्ण व्यवहार की व्यापकता को बनाए रखता है और इसे केवल दंडात्मक न्याय तक सीमित नहीं करता।
- issue: अंतिम כִּי का सम्बन्ध
  choice: क्योंकि
  alternative: फिर भी
  rationale: 'मूल का सामान्य कारणवाचक प्रवाह रखा गया है: अपने दोष में उपस्थित होने के कारण वे परमेश्वर के सामने टिक नहीं सकते।'
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक ‘आप’ और गरिमापूर्ण प्रार्थनात्मक संबोधन। ‘खड़ा नहीं रह सकता’ मूल न्यायिक/उपस्थितिगत मुहावरे को स्वाभाविक हिन्दी में बनाए रखता है।
