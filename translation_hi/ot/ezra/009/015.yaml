revisions:
- from: हे यहवे, इस्राएल के परमेश्वर, आप धर्मी हैं, क्योंकि आज के दिन तक हम बचे हुओं के रूप में शेष रह गए हैं। देखिए, हम अपने दोष के साथ आपके सामने हैं, क्योंकि इसके कारण आपके सामने कोई खड़ा नहीं रह सकता।
  to: हे यहवे, इस्राएल के परमेश्वर, आप धर्मी हैं, क्योंकि हम आज भी बचे हुए लोगों के रूप में शेष हैं। हम अपने दोष सहित आपके सामने हैं, क्योंकि इस कारण आपके सामने कोई ठहर नहीं सकता।
  rationale: The revision corrects the temporal sense, improves idiomatic modern Hindi, and renders the final judicial-presence idiom more naturally, while retaining the Hebrew's causal flow and its impersonal “no one.” No footnotes are necessary for this concise Hindi rendering.
