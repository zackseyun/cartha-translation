review_pass:
  verdict: revise
  source_fidelity: The draft correctly preserves the divine name, direct address, God's righteousness, the remnant/survivor idea, guilt, and the final causal statement. However, “आज के दिन तक” means ‘until this day’ and can imply a span ending today, whereas כְּהַיּוֹם הַזֶּה means ‘as is the case today/at this day.’ “खड़ा नहीं रह सकता” is overly physical in Hindi for the Hebrew judicial-presence idiom.
  naturalness: “देखिए” is somewhat unnatural as a prayerful presentative addressed to God, and “अपने दोष के साथ” is less idiomatic than “अपने दोष सहित.” “आपके सामने कोई ठहर नहीं सकता” naturally conveys inability to endure in God's presence.
  terminology: “यहवे,” “परमेश्वर,” and “धर्मी” are appropriate modern standard Hindi renderings in this register. “बचे हुए लोगों के रूप में शेष हैं” retains the remnant sense without the awkward duplication of “बचे हुओं ... शेष रह गए हैं.”
  issues:
  - severity: medium
    issue: Temporal expression rendered as “आज के दिन तक.”
    rationale: כְּהַיּוֹם הַזֶּה denotes the present state (‘as it is this day’), not primarily duration up to the present.
  - severity: low
    issue: Presentative and guilt phrase are awkward.
    rationale: “देखिए” and “अपने दोष के साथ” are understandable but less natural in a reverent Hindi prayer than a direct clause with “अपने दोष सहित.”
  - severity: medium
    issue: Final idiom rendered too physically as “खड़ा नहीं रह सकता.”
    rationale: The Hebrew idiom refers to being unable to remain or endure before God because of guilt; “ठहर नहीं सकता” better carries this sense in Hindi.
  revised_text: हे यहवे, इस्राएल के परमेश्वर, आप धर्मी हैं, क्योंकि हम आज भी बचे हुए लोगों के रूप में शेष हैं। हम अपने दोष सहित आपके सामने हैं, क्योंकि इस कारण आपके सामने कोई ठहर नहीं सकता।
  revised_footnotes: []
  revision_rationale: The revision corrects the temporal sense, improves idiomatic modern Hindi, and renders the final judicial-presence idiom more naturally, while retaining the Hebrew's causal flow and its impersonal “no one.” No footnotes are necessary for this concise Hindi rendering.
