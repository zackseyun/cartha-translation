  terminology: ‘पवित्र वंश’ appropriately retains the source’s covenantal lineage language without importing racial categories. ‘विश्वासघात’ suitably conveys מעל. ‘अधिकारी और उपशासक’ gives a clearer administrative distinction for שָׂרִים and סְגָנִים than ‘हाकिमों और अधिकारियों.’
