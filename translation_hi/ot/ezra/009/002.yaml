base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/002.yaml
  text: For they have taken some of their daughters for themselves and for their sons[a], and the holy seed has mixed itself with the peoples of the lands[c][b]. And the hand of the officials and the deputies has been foremost in this unfaithfulness.
translation:
  language: hi
  text: क्योंकि उन्होंने उनकी कुछ बेटियों को अपने लिए और अपने बेटों के लिए विवाह में ले लिया है[a], और पवित्र वंश[b] देशों के लोगों के साथ घुल-मिल गया है। अधिकारी और उपशासक इस विश्वासघात में अगुवाई करते रहे हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी बेटियों में से कुछ को अपने लिए और अपने बेटों के लिए ले लिया है।” यहाँ “लेना” विवाह करने के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पवित्र बीज”; इसका अनुवाद “पवित्र संतान” भी किया जा सकता है। यह वाचा से जुड़ी वंशावली की भाषा है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “इस विश्वासघात में अधिकारियों और उपशासकों का हाथ प्रथम था।” यह मुहावरा उनकी प्रमुख भागीदारी और जवाबदेही बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשְׂאוּ מִבְּנֹתֵיהֶם
  choice: उनकी बेटियों में से कुछ को ... ब्याह लिया है
  rationale: नָשְׂאוּ का मूल भाव ‘लेना’ है, पर बेटियों और अपने तथा अपने पुत्रों के लिए लेने के इस प्रसंग में विवाह स्पष्ट अभिप्रेत है। ‘ब्याह लिया’ आधुनिक हिन्दी में स्वाभाविक रूप से वैवाहिक अर्थ देता है, जबकि ‘में से कुछ’ מִן की अंशवाचक शक्ति को व्यक्त करता है।
- source_word: לָהֶם וְלִבְנֵיהֶם
  choice: अपने और अपने बेटों के लिए
  rationale: लामेद यहाँ लाभार्थी अथवा प्राप्तकर्ता को सूचित करता है; अनुवाद बताता है कि ये विवाह स्वयं पुरुषों और उनके पुत्रों, दोनों के लिए किए गए।
- source_word: וְהִתְעָרְבוּ
  choice: घुल-मिल गया है
  rationale: हित्पएल रूप परस्पर मिश्रण का भाव देता है। हिन्दी में एकवचन कर्ता ‘वंश’ के साथ ‘घुल-मिल गया है’ स्वाभाविक और अर्थ-सटीक है।
- source_word: זֶרַע הַקֹּדֶשׁ
  choice: पवित्र वंश
  rationale: זֶרַע का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ वह सामूहिक वंश अथवा संतान का बोध कराता है। ‘पवित्र वंश’ वंशावली और वाचा-संबंधी भाषा को बनाए रखते हुए हिन्दी में अनावश्यक जैविक या नस्लीय अर्थ से बचता है।
- source_word: בְּעַמֵּי הָאֲרָצוֹת
  choice: देश-देश के लोगों के साथ
  rationale: यह बहुवचन ‘देशों/प्रदेशों के लोगों’ को दर्शाता है। ‘देश-देश के लोग’ आधुनिक हिन्दी में आसपास के विविध जनसमूहों का स्वाभाविक बोध देता है और बहुवचन को बनाए रखता है।
- source_word: וְיַד הַשָּׂרִים וְהַסְּגָנִים
  choice: हाकिमों और अधिकारियों का हाथ
  rationale: ‘हाथ’ सक्रिय भागीदारी अथवा एजेंसी का इब्रानी मुहावरा है। उसे बनाए रखने से मूल रूपक सुरक्षित रहता है; दोनों पद प्रशासनिक नेतृत्व को सूचित करते हैं।
- source_word: מַּעַל
  choice: विश्वासघात
  rationale: מעל सामान्य अपराध से अधिक, निष्ठा अथवा वाचा के उल्लंघन को व्यक्त करता है। ‘विश्वासघात’ इस गंभीर संबंधपरक और वाचा-संबंधी आयाम को स्पष्ट करता है।
- source_word: רִאשׁוֹנָה
  choice: सबसे आगे
  rationale: यहाँ शब्द केवल कालक्रम में ‘पहले’ नहीं, बल्कि प्रमुख भागीदारी और दोष को दर्शाता है। ‘हाथ सबसे आगे रहा’ मूल मुहावरे और नेतृत्व की प्रधान जवाबदेही दोनों को व्यक्त करता है।
theological_decisions:
- issue: अन्तर्विवाह के प्रसंग में זֶרַע הַקֹּדֶשׁ का अर्थ
  choice: ‘पवित्र वंश’ के रूप में वाचा-समुदाय और वंशावली की अभिव्यक्ति को बनाए रखना
  alternative: ‘पवित्र संतान’ अथवा शाब्दिक ‘पवित्र बीज’; या इसे जातीय शुद्धता का स्पष्ट कथन बनाना
  rationale: मूल पद समुदाय की पवित्र, वाचा-संबंधी पहचान को प्रबल वंशावली भाषा में व्यक्त करता है। अनुवाद को न तो इस तनाव को मिटाना चाहिए और न बाद की नस्लीय अवधारणाएँ उसमें जोड़नी चाहिए।
- issue: नेताओं की दोषिता
  choice: ‘हाकिमों और अधिकारियों का हाथ सबसे आगे रहा है’
  alternative: ‘हाकिम और अधिकारी इस विश्वासघात में पहले थे’ अथवा ‘उन्होंने इस विश्वासघात में अगुवाई की’
  rationale: ‘हाथ’ और ‘सबसे आगे’ का संयोजन मूल के एजेंसी-वाले रूपक को बनाए रखते हुए यह बताता है कि नेतृत्व ने इस कृत्य में प्रमुख भूमिका निभाई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमामय किंतु सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘ब्याह लिया’ वैवाहिक आशय को स्वाभाविक बनाता है; ‘पवित्र वंश’ मूल की वाचा-संबंधी वंशावली को सुरक्षित रखता है; और ‘हाथ सबसे आगे’ इब्रानी मुहावरे को हिन्दी में समझने योग्य रूप में बनाए रखता है।
