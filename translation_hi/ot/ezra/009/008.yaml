base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/008.yaml
  text: But now[a], for a brief moment, favor has come from Yahweh our God, to leave us a remnant that has escaped and to give us a peg in his holy place[c][b], so that our God may brighten our eyes and give us a little reviving in our slavery.
translation:
  language: hi
  text: परन्तु अब थोड़े समय के लिए हमारे परमेश्वर याहवे की ओर से हम पर कृपा हुई है कि वह हमारे लिए बचे हुए लोगों को बचाए रखे और अपने पवित्र स्थान में हमें एक खूँटी[a] दे, ताकि हमारा परमेश्वर हमारी आँखों को प्रकाश[b] दे और हमारी दासता[c] में हमें थोड़ा-सा नवजीवन दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, एक स्थिर और सुरक्षित आधार; मूल में दृढ़ता से गड़ी हुई खूँटी का चित्र है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमारी आँखों को प्रकाश दे”; यह मुहावरा नयी स्फूर्ति और आशा को व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: या “हमारी अधीनता में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְחִנָּה
  choice: कृपा
  rationale: מֵאֵת יְהוָה के साथ यह संज्ञा यहाँ प्रार्थना करने की क्रिया के बजाय यहोवा की ओर से दिखाई गई अनुकम्पा को व्यक्त करती है।
- source_word: כִּמְעַט רֶגַע
  choice: थोड़े समय के लिए
  rationale: यह वाक्यांश मिली हुई राहत की अल्प अवधि पर बल देता है और आधुनिक हिन्दी में स्वाभाविक रहता है।
- source_word: פְּלֵיטָה
  choice: बचे हुए
  rationale: शब्द निर्वासन से बच निकले या जीवित रखे गए समुदाय को सूचित करता है; यह चयन उत्तरजीविता और शेष समुदाय—दोनों भाव रखता है।
- source_word: יָתֵד
  choice: खूँटी
  rationale: 'मूल का ठोस रूपक बनाए रखा गया है: दृढ़ता से गड़ी हुई वस्तु, जो स्थिर स्थान या सुरक्षित आधार का बोध कराती है।'
- source_word: בִּמְקוֹם קָדְשׁוֹ
  choice: अपने पवित्र स्थान में
  rationale: सीधा और पर्याप्त व्यापक अनुवाद, जो मन्दिर-संबंधी संकेत को रखता है पर मूल से अधिक विशिष्ट नहीं बनाता।
- source_word: לְהָאִיר עֵינֵינוּ
  choice: हमारी आँखों में ज्योति दे
  rationale: हिब्रू मुहावरे का प्रकाश-वाला चित्र सुरक्षित रहता है और नयी स्फूर्ति तथा आशा का अर्थ व्यक्त होता है।
- source_word: מִחְיָה
  choice: नवजीवन
  rationale: यह जीवन के संरक्षण अथवा पुनर्जीवन को सूचित करता है; निर्वासन और अधीनता के प्रसंग में 'नवजीवन' सहज और अर्थपूर्ण है।
- source_word: בְּעַבְדֻתֵנוּ
  choice: हमारी दासता में
  rationale: यह राजनीतिक अधीनता और बन्धुआ दशा की तीव्रता को 'सेवा' जैसे नरम शब्द से अधिक स्पष्टता से रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप द्वारा मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
theological_decisions:
- issue: פְּלֵיטָה का सामूहिक अर्थ
  choice: बचे हुए
  alternative: बचा हुआ शेष समुदाय
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए उन लोगों का सामूहिक अर्थ सुरक्षित किया गया है जो विपत्ति और निर्वासन से बचे हैं।
- issue: יָתֵד का रूपक
  choice: खूँटी
  alternative: सुरक्षित आधार
  rationale: पाठ की ठोस और कुछ हद तक खुली उपमा को व्याख्यात्मक अमूर्त अर्थ से प्रतिस्थापित नहीं किया गया।
- issue: עַבְדֻתֵנוּ की दशा
  choice: दासता
  alternative: अधीनता
  rationale: फारसी शासन के अन्तर्गत समुदाय की वास्तविक पराधीनता को दृढ़ शब्द में रखा गया है, बिना आधुनिक दास-व्यवस्था का कोई अतिरिक्त विवरण जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। 'परन्तु', 'कृपा', 'पवित्र स्थान', 'खूँटी', 'ज्योति', 'नवजीवन' और 'दासता' मूल की काव्यात्मक प्रार्थना-शैली तथा ठोस रूपकों को बनाए रखते हैं।
