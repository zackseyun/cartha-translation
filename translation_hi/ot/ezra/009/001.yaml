  text: וּ/כְ/כַלּ֣וֹת אֵ֗לֶּה נִגְּשׁ֨וּ אֵלַ֤/י הַ/שָּׂרִים֙ לֵ/אמֹ֔ר לֹֽא נִבְדְּל֞וּ הָ/עָ֤ם יִשְׂרָאֵל֙ וְ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת כְּ֠/תוֹעֲבֹֽתֵי/הֶם לַ/כְּנַעֲנִ֨י הַ/חִתִּ֜י הַ/פְּרִזִּ֣י הַ/יְבוּסִ֗י הָֽ/עַמֹּנִי֙ הַ/מֹּ֣אָבִ֔י הַ/מִּצְרִ֖י וְ/הָ/אֱמֹרִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/009/001.yaml
  text: When these things were finished[a], the officials approached me, saying, “The people of Israel, and the priests and the Levites, have not separated themselves from the peoples of the lands, according to their abominations—the Canaanites, the Hittites, the Perizzites, the Jebusites, the Ammonites, the Moabites, the Egyptians, and the Amorites.”
translation:
  language: hi
  text: जब ये बातें पूरी हो चुकीं, तब अधिकारी मेरे पास आकर कहने लगे, “इस्राएल के लोग, याजक और लेवी इन देशों के लोगों से उनके घृणित आचरणों के अनुसार अलग नहीं हुए हैं—अर्थात कनानियों, हित्तियों, परिज्जियों, यबूसियों, अम्मोनियों, मोआबियों, मिस्रियों और एमोरियों से।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְכַלּוֹת אֵלֶּה
  choice: जब ये काम पूरे हो चुके
  rationale: वाव, כְּ और כלה के infinitive construct से बना समयवाचक उपवाक्य है। ‘ये काम’ प्रसंग में पहले बताए गए कार्यों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पूरे हो चुके’ पूर्णता के परिणाम को बनाए रखता है।
- source_word: נִגְּשׁוּ אֵלַי הַשָּׂרִים
  choice: अधिकारियों ने मेरे पास आकर
  rationale: נגשׁ का निफ़अल रूप निकट आने को और שׂרים प्रशासनिक अगुओं या अधिकारियों को दर्शाता है। यह फारसी-कालीन संदर्भ में स्वाभाविक है और ‘राजकुमारों’ जैसी अनावश्यक वंशगत धारणा से बचता है।
- source_word: לֹא נִבְדְּלוּ
  choice: अपने आपको अलग नहीं रखा है
  rationale: בדל के निफ़अल में यहाँ आत्मवाचक-अलगाव का भाव है। हिन्दी में यह अभिव्यक्ति कर्ताओं की भागीदारी स्पष्ट करती है, पर उनके उद्देश्य के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ती।
- source_word: הָעָם יִשְׂרָאֵל וְהַכֹּהֲנִים וְהַלְוִיִּם
  choice: इस्राएल के लोगों ने, और याजकों और लेवियों ने भी
  rationale: तीनों समूह एक ही आरोप के अधीन समन्वित हैं। ‘भी’ हिन्दी में समन्वय और आरोप की व्यापकता स्वाभाविक रूप से स्पष्ट करता है।
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: देश-देश के लोगों से
  rationale: यह עמים और ארצות, दोनों के बहुवचन को संक्षिप्त और सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: כְּתוֹעֲבֹתֵיהֶם
  choice: बल्कि उनके घिनौने कामों के अनुसार चलते हैं
  rationale: כְּ अनुरूपता का भाव देता है और תועבות धार्मिक-नैतिक रूप से अत्यंत आपत्तिजनक आचरण का प्रबल शब्द है। स्रोत की खंडित संरचना को समझने योग्य हिन्दी में व्यक्त करने के लिए ‘चलते हैं’ निहित व्यवहारगत संबंध को स्पष्ट करता है; वैकल्पिक अधिक संक्षिप्त संरचना पादटिप्पणी में दी गई है।
- source_word: לַכְּנַעֲנִי ... וְהָאֱמֹרִי
  choice: कनानियों, हित्तियों, परिज्जियों, यबूसियों, अम्मोनियों, मोआबियों, मिस्रियों और एमोरियों
  rationale: इब्रानी के एकवचन जातिवाचक रूप समूहों को सूचित करते हैं; आधुनिक हिन्दी में इनके बहुवचन रूप सूची का आशय स्पष्ट और स्वाभाविक बनाते हैं।
theological_decisions:
- issue: תועבות की वाचिक और धार्मिक तीव्रता
  choice: घिनौने काम
  alternative: घृणित रीति-रिवाज
  rationale: ‘घिनौने’ मूल शब्द की प्रबल नैतिक-धार्मिक निंदा को बनाए रखता है, जबकि ‘काम’ केवल मत या जातीय पहचान के बजाय व्यवहार पर ध्यान रखता है।
- issue: आरोप के अंतर्गत आने वाले इस्राएली समूह
  choice: लोगों, याजकों और लेवियों—तीनों को समान क्रिया के अधीन रखना
  alternative: केवल सामान्य लोगों को मुख्य कर्ता मानना और याजकों व लेवियों को गौण जोड़ समझना
  rationale: इब्रानी वाक्य-विन्यास तीनों समूहों को समन्वित करता है; अनुवाद आरोप का दायरा संकीर्ण नहीं करता।
- issue: विदेशी लोगों और उनके आचरण के बीच संबंध
  choice: लोगों से अलग न रहने और उनके घिनौने कामों के अनुसार चलने—दोनों पक्ष स्पष्ट करना
  alternative: इसे केवल जातीय अलगाव का कथन बनाना
  rationale: מֵעַמֵּי הָאֲרָצוֹת के साथ כְּתוֹעֲבֹתֵיהֶם भी उपस्थित है। इसलिए पाठ में लोगों से संबंध और उनके निंदित आचरण का अनुकरण दोनों बने रहने चाहिए; इसे केवल जातीयता तक सीमित करना मूल के नैतिक-धार्मिक तनाव को घटा देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। जातिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। मुख्य वाक्य में स्रोत की अर्थगत कड़ियों को स्पष्ट किया गया है, पर आरोप को केवल अंतर्जातीय विवाह या किसी विशिष्ट संप्रदायगत व्याख्या तक सीमित नहीं किया गया।
