base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/002.yaml
  text: Then Jeshua son of Jozadak arose with his brothers the priests[a], and Zerubbabel son of Shealtiel with his brothers, and they built the altar of the God of Israel to offer burnt offerings on it, as it is written in the Law of Moses[b], the man of God.
translation:
  language: hi
  text: तब योसादाक का पुत्र येशूअ और उसके भाई, जो याजक थे,[a] तथा शालतीएल का पुत्र जरुब्बाबेल और उसके भाई उठ खड़े हुए। उन्होंने इस्राएल के परमेश्वर की वेदी बनाई, ताकि उस पर होमबलियाँ चढ़ाएँ, जैसा परमेश्वर के जन मूसा की व्यवस्था[b] में लिखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके संबंधी” अथवा “उसके साथी”; इब्रानी में शाब्दिक अर्थ “उसके भाई” है, और आगे के शब्द येशूअ के इस समूह को याजकों के रूप में पहचानते हैं।
    reason: lexical_alternative
  - marker: b
    text: “व्यवस्था” के लिए इब्रानी शब्द ‘तोराह’ है, जिसका अर्थ “शिक्षा” या “निर्देश” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठ खड़े हुए
  rationale: קום का यह रूप निर्णायक कार्य आरम्भ करने को व्यक्त करता है। संयुक्त कर्ताओं के कारण हिन्दी में बहुवचन रखा गया है।
- source_word: יֵשׁוּעַ
  choice: येशूअ
  rationale: इब्रानी उत्तर-निर्वासनकालीन नाम का लिप्यंतरण किया गया है, इसे यहोशू नाम में नहीं बदला गया।
- source_word: וְאֶחָיו
  choice: उसके भाई
  rationale: मूल शब्द का प्राथमिक अर्थ ‘भाई’ है, यद्यपि प्रसंग में इसका विस्तार संबंधियों या साथियों तक हो सकता है; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: הַכֹּהֲנִים
  choice: जो याजक थे
  rationale: यह पद येशूअ के भाइयों के समूह की पहचान याजकों के रूप में करता है; हिन्दी में संबंधवाचक उपवाक्य स्वाभाविक और स्पष्ट है।
- source_word: זְרֻבָּבֶל
  choice: जरुब्बाबेल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: שְׁאַלְתִּיאֵל
  choice: शालतीएल
  rationale: इब्रानी व्यक्तिनाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיִּבְנוּ
  choice: उन्होंने ... बनाई
  rationale: בנה का सीधा अर्थ ‘बनाना’ है; ऐतिहासिक रूप से पुनर्निर्माण संभव होने पर भी मूल क्रिया स्वयं ‘फिर से’ नहीं कहती।
- source_word: מִזְבַּח אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर की वेदी
  rationale: सम्बन्धसूचक इब्रानी रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לְהַעֲלוֹת עָלָיו עֹלוֹת
  choice: ताकि उस पर होमबलियाँ चढ़ाएँ
  rationale: यह बलिदान-संबंधी मुहावरा वेदी पर पूर्णतः जलने वाली बलियाँ अर्पित करने को दर्शाता है; ‘होमबलि चढ़ाना’ हिन्दी में स्थापित पदावली है।
- source_word: כַּכָּתוּב
  choice: जैसा ... लिखा है
  rationale: लिखित धर्मादेश के अनुरूप कार्य करने की सूत्रात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है।
- source_word: תּוֹרַת מֹשֶׁה
  choice: मूसा की व्यवस्था
  rationale: इस प्रसंग में लिखित बलिदान-विधि अभिप्रेत है; ‘व्यवस्था’ उसका स्वाभाविक हिन्दी समतुल्य है, जबकि व्यापक अर्थ ‘शिक्षा/निर्देश’ पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह मूसा की प्रतिष्ठित उपाधि है; ‘परमेश्वर का जन’ का संबंधकारक रूप हिन्दी वाक्य में स्वाभाविक बैठता है।
theological_decisions:
- issue: אחים का प्रतिनिधि समूह में अर्थ
  choice: उसके भाई
  alternative: उसके संबंधी / उसके साथी
  rationale: शाब्दिक संबंध और पुल्लिंग संदर्भ सुरक्षित रखा गया है, जबकि शब्द की विस्तृत अर्थ-सीमा पादटिप्पणी में बताई गई है।
- issue: תּוֹרָה का बलिदान-विधि वाले प्रसंग में अनुवाद
  choice: मूसा की व्यवस्था
  alternative: मूसा की शिक्षा / मूसा का निर्देश / मूसा की तोराह
  rationale: यहाँ लिखित बलिदान-विधान के पालन पर बल है। ‘व्यवस्था’ उस कानूनी-विधिक बल को स्पष्ट करती है, पर शब्द की व्यापक शिक्षात्मक अर्थ-सीमा पादटिप्पणी में दी गई है।
- issue: אִישׁ הָאֱלֹהִים का संबंध
  choice: परमेश्वर के जन मूसा की व्यवस्था
  alternative: मूसा की व्यवस्था में लिखा है—वह परमेश्वर का जन था
  rationale: इब्रानी में ‘परमेश्वर का जन’ मूसा के साथ समानाधिकरण में है। हिन्दी क्रम इसे मूसा की उपाधि के रूप में बनाए रखता है और इसे व्यवस्था का विशेषण नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक’, ‘वेदी’, ‘होमबलि’ और ‘परमेश्वर का जन’ जैसी स्थापित बाइबलीय शब्दावली को बनाए रखते हुए वाक्यरचना स्वाभाविक हिन्दी में की गई है।
