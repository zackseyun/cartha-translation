source:
  edition: WLC
  text: וַ/יָּכִ֤ינוּ הַ/מִּזְבֵּ֨חַ֙ עַל מְכ֣וֹנֹתָ֔י/ו כִּ֚י בְּ/אֵימָ֣ה עֲלֵי/הֶ֔ם מֵ/עַמֵּ֖י הָ/אֲרָצ֑וֹת ו/יעל עָלָ֤י/ו עֹלוֹת֙ לַֽ/יהוָ֔ה עֹל֖וֹת לַ/בֹּ֥קֶר וְ/לָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/003.yaml
  text: They set up the altar on its foundations[a], for fear was upon them because of the peoples of the lands, and they offered up burnt offerings on it to Yahweh[b], burnt offerings morning and evening.
translation:
  language: hi
  text: उन्होंने वेदी को उसके आधारों पर स्थापित किया[a], क्योंकि देशों के लोगों के कारण उन पर भय छाया हुआ था[b]। और उन्होंने उस पर याहवे को होमबलियाँ चढ़ाईं—सुबह और शाम की होमबलियाँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके आधार पर’ अथवा ‘उसके नियत स्थान पर।’
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘देशों के लोगों से उन पर भय था’; अर्थात देशों के लोगों के कारण वे भयभीत थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּכִינוּ
  choice: स्थापित किया
  rationale: כון के हिफ़ील रूप का अर्थ यहाँ वेदी को उसके नियत आधार पर खड़ा करके उपयोग के लिए तैयार करना है। ‘स्थापित किया’ इस क्रिया और स्थायित्व, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान के संदर्भ में מִזְבֵּחַ का मानक और सहज हिन्दी रूप ‘वेदी’ है।
- source_word: עַל מְכוֹנֹתָיו
  choice: उसकी नींवों पर
  rationale: מְכוֹנוֹתָיו आधारों, नींवों या नियत स्थापन-स्थान को सूचित कर सकता है। बहुवचन को बनाए रखते हुए ‘उसकी नींवों पर’ ठोस बिंब को सुरक्षित रखता है।
- source_word: כִּי בְּאֵימָה עֲלֵיהֶם
  choice: क्योंकि ... उन पर भय छाया हुआ था
  rationale: इब्रानी का क्रियारहित वाक्यांश शाब्दिक रूप से भय के ‘उन पर’ होने का बिंब देता है। ‘भय छाया हुआ था’ उस बिंब को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מֵעַמֵּי הָאֲרָצוֹת
  choice: आस-पास के देशों के लोगों के कारण
  rationale: भय-सूचक अभिव्यक्ति के बाद מִן भय के स्रोत या कारण को दर्शाता है। ‘के कारण’ अर्थ स्पष्ट करता है; ‘देशों’ और ‘लोगों’ में मूल के बहुवचन सुरक्षित हैं। संदर्भ के अनुसार ‘आस-पास के’ भौगोलिक संबंध स्पष्ट करता है।
- source_word: וַיַּעַל עָלָיו עֹלוֹת
  choice: फिर उन्होंने उस पर ... होमबलियाँ चढ़ाईं
  rationale: עלה का हिफ़ील रूप עֹלוֹת के साथ होमबलि अर्पित करने की प्रचलित अभिव्यक्ति है। ‘चढ़ाईं’ हिन्दी में बलि अर्पित करने और ऊपर उठने के भाव को सहज रूप से व्यक्त करता है। प्रसंगगत कर्ता बहुवचन है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल पाठ में परमेश्वर का व्यक्तिवाचक वाचा-नाम יהוה है; ‘याहवे’ उसका सीधा देवनागरी लिप्यंतरण है।
- source_word: עֹלוֹת לַבֹּקֶר וְלָעָרֶב
  choice: सुबह और शाम की होमबलियाँ
  rationale: यह नियमित दैनिक बलियों के दोनों समय बताता है। ‘होमबलियाँ’ की पुनरावृत्ति मूल पाठ में संज्ञा की पुनरावृत्ति को बनाए रखती है और हिन्दी में स्पष्ट रहती है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: यह पद चार अक्षरों वाले व्यक्तिवाचक वाचा-नाम का सीधे प्रयोग करता है। ‘याहवे’ नाम को उपाधि में बदलने के बजाय उसकी पहचान बनाए रखता है और स्रोत-पाठ के निकट है।
- issue: भय और वेदी स्थापित करने के बीच संबंध
  choice: ‘क्योंकि’ द्वारा कारणात्मक संबंध बनाए रखा
  alternative: ‘यद्यपि वे डरते थे’ जैसा विरोधात्मक संबंध
  rationale: כִּי सामान्यतः यहाँ कारण प्रस्तुत करता है। पाठ यह पूरी तरह स्पष्ट नहीं करता कि भय ने उन्हें वेदी बनाने को प्रेरित किया या केवल उस परिस्थिति का वर्णन करता है; इसलिए अनुवाद उस तनाव को नहीं सुलझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वेदी’, ‘होमबलियाँ’ और ‘याहवे’ जैसे बाइबलीय शब्द स्रोत-पाठ की धार्मिक विशिष्टता बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में [b] चिह्न ‘Yahweh’ के बाद था, पर उसकी टिप्पणी भय-वाक्यांश से संबंधित है; इसलिए हिन्दी मुख्य पाठ में [b] उसी संबंधित वाक्यांश के बाद रखा गया है।
