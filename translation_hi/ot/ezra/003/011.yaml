base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/011.yaml
  text: 'And they sang responsively praising and giving thanks to Yahweh: “For he is good[c][b][a], for his steadfast love toward Israel is forever.” And all the people shouted a great shout in praise to Yahweh because the house of Yahweh had been founded.'
translation:
  language: hi
  text: 'उन्होंने याहवे की स्तुति और धन्यवाद करते हुए उत्तर दिया[a]: “क्योंकि वह भला है, क्योंकि इस्राएल के प्रति उसका अटल प्रेम सदा बना रहता है।”[b] और सब लोगों ने याहवे की स्तुति में बड़ी जयजयकार की, क्योंकि याहवे के भवन की स्थापना हो चुकी थी।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने प्रतिगान करते हुए गाया।” इब्रानी क्रिया का मूल अर्थ “उत्तर देना” है और यहाँ संभवतः एक-दूसरे के उत्तर में गाई गई स्तुति का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: 'इसे इस प्रकार भी समझा जा सकता है: “क्योंकि इस्राएल के प्रति उसका अटल प्रेम सदा का है।”'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “क्योंकि याहवे का भवन स्थापित किया गया था।” संदर्भ में इसका आशय मंदिर की नींव रखे जाने से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: उन्होंने उत्तर देते हुए
  rationale: क्रिया ענה का मूल अर्थ ‘उत्तर देना’ है; इस उपासना-संदर्भ में यह संभवतः एक-दूसरे के उत्तर में सामूहिक या प्रतिगानात्मक गायन को सूचित करती है। हिंदी में ‘उत्तर देते हुए’ मूल की अस्पष्टता को बनाए रखता है।
- source_word: בְּהַלֵּל וּבְהוֹדֹת
  choice: स्तुति और उसका धन्यवाद किया
  rationale: दोनों उपासना-क्रियाओं—स्तुति और धन्यवाद—को अलग रखते हुए हिंदी में स्वाभाविक क्रियात्मक अभिव्यक्ति दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: כִּי טוֹב
  choice: क्योंकि वह भला है
  rationale: यह प्रचलित स्तुति-वाक्य है; हिंदी में निहित कर्ता और संयोजक को स्पष्ट किया गया है।
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: क्योंकि ... उसका अटल प्रेम सदा बना रहता है
  rationale: חסד की स्थायी निष्ठा और प्रेम, दोनों को ‘अटल प्रेम’ व्यक्त करता है; ‘बना रहता है’ स्थायित्व के भाव को स्वाभाविक हिंदी देता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के प्रति
  rationale: עַל यहाँ प्रेम की दिशा या संबंध बताता है; ‘के प्रति’ आधुनिक हिंदी में सटीक और सहज है।
- source_word: הֵרִיעוּ תְרוּעָה גְדוֹלָה
  choice: बहुत ऊँची जयजयकार की
  rationale: इब्रानी की सजातीय क्रिया-संज्ञा जोरदार सामूहिक उद्घोष को बल देती है; हिंदी में ‘बहुत ऊँची जयजयकार’ उसका प्रभाव स्वाभाविक रूप से व्यक्त करती है।
- source_word: בְּהַלֵּל לַיהוָה
  choice: याहवे की स्तुति में
  rationale: यह वाक्यांश बताता है कि लोगों की जयजयकार याहवे की स्तुति के रूप में थी।
- source_word: עַל הוּסַד בֵּית יְהוָה
  choice: क्योंकि याहवे के भवन की नींव रखी जा चुकी थी
  rationale: הוּסַד का अर्थ ‘स्थापित किया गया’ है; एज्रा 3 के निर्माण-संदर्भ में हिंदी का यह रूप स्पष्ट करता है कि यहाँ मंदिर की नींव रखे जाने की बात है, न कि पूरे भवन के बन जाने की।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पाठ में उपाधि नहीं बल्कि वाचा का विशिष्ट नाम है; ‘याहवे’ उस भेद को सुरक्षित रखता है।
- issue: חסד का अर्थ
  choice: अटल प्रेम
  alternative: करुणा / वाचा का प्रेम
  rationale: ‘अटल प्रेम’ प्रेम, कृपा और स्थायी निष्ठा के अर्थक्षेत्र को बिना किसी एक संप्रदायगत व्याख्या तक सीमित किए व्यक्त करता है।
- issue: ענה की उपासना-संदर्भ वाली क्रिया
  choice: उत्तर देते हुए
  alternative: प्रतिगान करते हुए
  rationale: संभवतः प्रतिगान अभिप्रेत है, पर इब्रानी क्रिया केवल ‘उत्तर देना’ भी कह सकती है; मुख्य पाठ व्यापक अर्थ को बनाए रखता है और टिप्पणी संभावित सांगीतिक रूप बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज उपासना-संबंधी रजिस्टर रखा गया है। ‘जयजयकार’ सामूहिक ऊँचे उद्घोष को स्वाभाविक रूप से व्यक्त करता है। मुख्य पाठ में स्रोत की अर्थगत अस्पष्टता जहाँ संभव है सुरक्षित रखी गई है और आवश्यक संदर्भ फुटनोट में दिया गया है।
