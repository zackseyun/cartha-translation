source:
  edition: WLC
  text: וְ/יִסְּד֥וּ הַ/בֹּנִ֖ים אֶת הֵיכַ֣ל יְהוָ֑ה וַ/יַּעֲמִידוּ֩ הַ/כֹּהֲנִ֨ים מְלֻבָּשִׁ֜ים בַּ/חֲצֹֽצְר֗וֹת וְ/הַ/לְוִיִּ֤ם בְּנֵֽי אָסָף֙ בַּֽ/מְצִלְתַּ֔יִם לְ/הַלֵּל֙ אֶת יְהוָ֔ה עַל יְדֵ֖י דָּוִ֥יד מֶֽלֶךְ יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/010.yaml
  text: When the builders laid the foundation of the temple of Yahweh[a], they stationed the priests, clothed in their vestments, with trumpets, and the Levites, the sons of Asaph, with cymbals, to praise Yahweh according to the directions of David king of Israel.
translation:
  language: hi
  text: जब निर्माण करने वालों ने याहवे के मंदिर की नींव डाली, तब उन्होंने वस्त्र पहने हुए याजकों को तुरहियों के साथ और आसाप के वंशज लेवियों को झाँझों के साथ अपने स्थान पर खड़ा किया, ताकि वे इस्राएल के राजा दाऊद के निर्देश के अनुसार[a] याहवे की स्तुति करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “इस्राएल के राजा दाऊद के हाथ से”; यहाँ इसका अर्थ दाऊद के निर्देश या उसके द्वारा निर्धारित व्यवस्था के अनुसार है।
    reason: शाब्दिक मुहावरे और उसके संदर्भगत अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְיִסְּדוּ הַבֹּנִים
  choice: जब कारीगरों ने ... नींव डाली
  rationale: יסד भवन के संदर्भ में नींव डालने को व्यक्त करता है; הַבֹּנִים निर्माण करने वालों के लिए है। ‘कारीगर’ और ‘नींव डाली’ स्वाभाविक आधुनिक हिन्दी हैं।
- source_word: הֵיכַל יְהוָה
  choice: याहवे का मंदिर
  rationale: הֵיכָל यहाँ उपासना के मंदिर को सूचित करता है, और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ के रूप में रखा गया है।
- source_word: וַיַּעֲמִידוּ
  choice: उन्होंने ... खड़ा किया
  rationale: עמד का हिफ़ील रूप यहाँ लोगों को विधिवत अपने स्थान पर खड़ा करने का अर्थ देता है। हिन्दी में ‘खड़ा किया’ मूल क्रिया-चित्र को बनाए रखता है।
- source_word: הַכֹּהֲנִים מְלֻבָּשִׁים בַּחֲצֹצְרוֹת
  choice: वस्त्र पहने हुए याजकों को तुरहियों के साथ
  rationale: מְלֻבָּשִׁים का सीधा अर्थ ‘वस्त्र पहने हुए’ है; मूल में वस्त्रों के प्रकार का स्पष्ट उल्लेख न होने के कारण ‘याजकीय वस्त्र’ नहीं जोड़ा गया। חֲצֹצְרוֹת उपासना में प्रयुक्त तुरहियाँ हैं।
- source_word: וְהַלְוִיִּם בְּנֵי אָסָף בַּמְצִלְתַּיִם
  choice: आसाप के वंशज लेवियों को झाँझों के साथ
  rationale: בְּנֵי אָסָף वंश या कुल से जुड़े सदस्यों को दर्शाता है; ‘वंशज’ आधुनिक पाठक के लिए स्पष्ट है। מְצִלְתַּיִם के लिए प्रचलित हिन्दी वाद्य-शब्द ‘झाँझ’ लिया गया है।
- source_word: לְהַלֵּל אֶת יְהוָה
  choice: ताकि वे ... याहवे की स्तुति करें
  rationale: לְ के साथ infinitive यहाँ उद्देश्य बताता है; ‘ताकि’ हिन्दी में इस प्रयोजन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עַל יְדֵי דָּוִיד מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल के राजा दाऊद के निर्देश के अनुसार
  rationale: शाब्दिक मुहावरा ‘दाऊद के हाथ से’ इस संदर्भ में दाऊद द्वारा दिए गए निर्देश या निर्धारित व्यवस्था को सूचित करता है। चुना हुआ रूप आशय स्पष्ट करता है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में वाचा का व्यक्तिगत नाम दो बार आता है। लिप्यंतरण ‘याहवे’ नाम और उपाधि के भेद को बनाए रखता है।
- issue: עַל יְדֵי דָּוִיד का उपासना-संबंधी अर्थ
  choice: दाऊद के निर्देश के अनुसार
  alternative: दाऊद के हाथ से
  rationale: शाब्दिक अभिव्यक्ति एजेंसी या माध्यम का मुहावरा है और यहाँ दाऊद द्वारा निर्धारित उपासना-व्यवस्था की ओर संकेत करती है। मुख्य पाठ में अर्थ दिया गया है, जबकि वास्तविक शाब्दिकता पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। वाक्य की इब्रानी क्रमबद्धता को यथासंभव बनाए रखते हुए हिन्दी में उद्देश्य के लिए ‘ताकि’ का प्रयोग किया गया है। ‘विशेष’ या ‘याजकीय’ वस्त्र जैसे ऐसे विवरण नहीं जोड़े गए जो मूल में स्पष्ट नहीं हैं।
