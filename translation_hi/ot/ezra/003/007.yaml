base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/007.yaml
  text: So they gave money to the stonecutters and to the craftsmen[a], and food and drink and oil to the Sidonians and the Tyrians, to bring cedar timber from Lebanon to the sea at Joppa[c][b], according to the authorization of Cyrus king of Persia upon them.
translation:
  language: hi
  text: तब उन्होंने पत्थर काटने वालों और कारीगरों को धन[a], और सीदोनियों और सोरियों को भोजन, पेय और तेल दिया, ताकि वे लबानोन से याफा के समुद्र तक देवदार की लकड़ी लाएँ[b], उस अनुमति के अनुसार जो फारस के राजा कुस्रू ने उन्हें दी थी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी।” इब्रानी शब्द धातु चाँदी अथवा भुगतान के प्रसंग में धन—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “याफा के समुद्र तक।” इसका आशय याफा का समुद्री तट या बंदरगाह हो सकता है।'
    reason: lexical_alternative
  - marker: c
    text: या “फारस के राजा कुस्रू द्वारा उन्हें दिए गए अधिकार के अनुसार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: तब उन्होंने ... दिया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिक कथाप्रवाह को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כֶסֶף
  choice: पैसा
  rationale: शब्द का मूल अर्थ ‘चाँदी’ है, पर भुगतान के इस प्रसंग में यह धन या पैसे को सूचित करता है।
- source_word: לַחֹצְבִים
  choice: पत्थर काटने वालों
  rationale: חצב से बना यह रूप पत्थर काटने या खदान से निकालने वाले कामगारों को दर्शाता है; यह हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וְלֶחָרָשִׁים
  choice: और कारीगरों
  rationale: חָרָשׁ किसी कुशल शिल्पी को सूचित कर सकता है; ‘कारीगर’ सामग्री या विशेष पेशा अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וּמַאֲכָל וּמִשְׁתֶּה וָשֶׁמֶן
  choice: भोजन, पेय और तेल
  rationale: वस्तुओं की सूची को सीधे और स्वाभाविक ढंग से प्रस्तुत करता है; ‘तेल’ को जैतून का तेल कहकर अधिक विशिष्ट नहीं बनाया गया।
- source_word: לַצִּדֹנִים וְלַצֹּרִים
  choice: सीदोनियों और सोरियों
  rationale: ये सीदोन और सोर के निवासियों के जातिवाचक नाम हैं।
- source_word: לְהָבִיא
  choice: ताकि वे ... लाएँ
  rationale: उद्देश्यवाचक धातुरूप को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲצֵי אֲרָזִים
  choice: देवदार की लकड़ी
  rationale: निर्माण के प्रसंग में यह अभिव्यक्ति देवदार की निर्माण-सामग्री को सहज हिन्दी में बताती है, बिना उसे अनिवार्यतः ‘लट्ठे’ मानने के।
- source_word: אֶל יָם יָפוֹא
  choice: समुद्र के रास्ते याफा के बंदरगाह तक
  rationale: शाब्दिक वाक्यांश ‘याफा के समुद्र तक’ तट अथवा बंदरगाह को सूचित करता है; हिन्दी में यह रूप परिवहन और गंतव्य दोनों को स्पष्ट करता है।
- source_word: כְּרִשְׁיוֹן כּוֹרֶשׁ מֶלֶךְ פָּרַס עֲלֵיהֶם
  choice: जैसा फारस के राजा कुस्रू ने उन्हें अनुमति दी थी
  rationale: रִשְׁיוֹן राजकीय अनुमति या अनुदान को दर्शाता है; עֲלֵיהֶם को हिन्दी की स्वाभाविक राजकीय-अनुमति की अभिव्यक्ति में ‘उन्हें’ से व्यक्त किया गया है।
