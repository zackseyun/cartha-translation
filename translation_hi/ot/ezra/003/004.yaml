  text: וַֽ/יַּעֲשׂ֛וּ אֶת חַ֥ג הַ/סֻּכּ֖וֹת כַּ/כָּת֑וּב וְ/עֹלַ֨ת י֤וֹם בְּ/יוֹם֙ בְּ/מִסְפָּ֔ר כְּ/מִשְׁפַּ֖ט דְּבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/004.yaml
  text: They kept the Festival of Booths as it is written, and offered the daily burnt offerings by number according to the ordinance, as each day required.
translation:
  language: hi
  text: उन्होंने झोपड़ियों का पर्व जैसा लिखा है वैसा ही मनाया, और प्रतिदिन की होमबलियाँ गिनती के अनुसार, विधि के मुताबिक़, हर दिन के लिए जो निर्धारित था उसके अनुसार चढ़ाईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַג הַסֻּכּוֹת
  choice: झोपड़ियों का पर्व
  rationale: पर्व के नाम का अर्थ सीधे और सामान्य आधुनिक हिन्दी में व्यक्त करता है; סֻכּוֹת की अस्थायी निवास-झोपड़ियों की छवि बनाए रखता है।
- source_word: כַּכָּתוּב
  choice: लिखे हुए विधान के अनुसार
  rationale: शाब्दिक अर्थ ‘जैसा लिखा है’ है; यहाँ व्यवस्था में लिखे निर्देश का संदर्भ स्पष्ट करने के लिए ‘विधान’ जोड़ा गया है, बिना किसी विशिष्ट ग्रंथ-पद की पहचान थोपे।
- source_word: וְעֹלַת יוֹם בְּיוֹם
  choice: प्रतिदिन होमबलियाँ चढ़ाईं
  rationale: עֹלָה का पारंपरिक और अर्थपूर्ण हिन्दी समतुल्य ‘होमबलि’ है; יוֹם בְּיוֹם की आवृत्ति ‘प्रतिदिन’ से स्वाभाविक ढंग से व्यक्त होती है।
- source_word: בְּמִסְפָּר
  choice: ठहराई गई संख्या के अनुसार
  rationale: निर्धारित गिनती का भाव देता है और वाक्य के अंतिम अंश से इसका संबंध स्पष्ट रखता है।
- source_word: כְּמִשְׁפָּט
  choice: विधि के मुताबिक़
  rationale: निर्धारित नियम या विधान के अनुसार किए जाने का भाव; आधुनिक पाठक के लिए सहज।
- source_word: דְּבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन के लिए ठहराई गई
  rationale: मुहावरे का आशय प्रत्येक दिन की नियत आवश्यकता या मात्रा है; इसे बलियों की संख्या से जोड़कर स्वाभाविक हिन्दी दी गई है।
theological_decisions:
- issue: ‘जैसा लिखा है’ में निहित अधिकारपूर्ण लिखित निर्देश
  choice: ‘लिखे हुए विधान के अनुसार’
  alternative: ‘जैसा लिखा है’
  rationale: संदर्भ व्यवस्था के पर्व-विधान का है। अनुवाद उस अधिकार को बनाए रखता है, पर किसी संप्रदायगत व्याख्या या अनिर्दिष्ट ग्रंथ-संदर्भ को नहीं जोड़ता।
- issue: होमबलियों की दैनिक संख्या
  choice: हर दिन के लिए अलग से ठहराई गई संख्या का भाव
  alternative: सिर्फ़ ‘दैनिक होमबलियाँ’
  rationale: गिनती 29 में प्रत्येक दिन के लिए घटती हुई निर्धारित संख्या है; मूल के בְּמִסְפָּר और דְּבַר יוֹם בְּיוֹמוֹ दोनों को व्यक्त करना आवश्यक है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘होमबलि’ बाइबलीय-सांस्कृतिक पद के रूप में रखा गया है। ‘मुताबिक़’ प्रचलित हिन्दी है; वाक्य-विन्यास मूल के घटकों को सुरक्षित रखते हुए हिन्दी की स्वाभाविकता के लिए पुनर्गठित किया गया है।
