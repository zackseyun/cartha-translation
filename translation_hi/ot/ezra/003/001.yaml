source:
  edition: WLC
  text: וַ/יִּגַּע֙ הַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י וּ/בְנֵ֥י יִשְׂרָאֵ֖ל בֶּ/עָרִ֑ים וַ/יֵּאָסְפ֥וּ הָ/עָ֛ם כְּ/אִ֥ישׁ אֶחָ֖ד אֶל יְרוּשָׁלִָֽםס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/001.yaml
  text: When the seventh month arrived[a], and the sons of Israel were in the cities[b], the people gathered as one man to Jerusalem.
translation:
  language: hi
  text: जब सातवाँ महीना आया और इस्राएल के पुत्र[a] नगरों में थे, तब लोग एक मनुष्य के समान[b] यरूशलेम में इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘इस्राएली।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र।’
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी मुहावरा: ‘एक मनुष्य के समान,’ अर्थात पूरी एकता के साथ या एक मन होकर।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגַּע
  choice: आया
  rationale: समयवाचक पद के साथ נגע का भाव किसी महीने के आ पहुँचने का है; हिन्दी में ‘महीना आया’ स्वाभाविक और स्पष्ट है।
- source_word: הַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवाँ महीना
  rationale: मूल पाठ की क्रमसूचक अभिव्यक्ति को सीधे रखा गया है; बाद का कोई मास-नाम नहीं जोड़ा गया।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: בְּנֵי का पुल्लिंग बहुवचन रूप पारदर्शी ढंग से रखा गया है; यह सामूहिक रूप से इस्राएली समुदाय को सूचित करता है।
- source_word: בֶּעָרִים
  choice: नगरों में थे
  rationale: इब्रानी में निहित अस्तित्वसूचक क्रिया को हिन्दी में ‘थे’ से स्पष्ट किया गया है; ‘अपने’ मूल में नहीं है, इसलिए नहीं जोड़ा गया।
- source_word: וַיֵּאָסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़ाल रूप यहाँ समुदाय के एकत्र होने को व्यक्त करता है; यह सहज आधुनिक हिन्दी है।
- source_word: הָעָם
  choice: लोग
  rationale: यह लौटे हुए समुदाय के सामूहिक समूह को दर्शाता है; हिन्दी में ‘लोग’ स्वाभाविक है।
- source_word: כְּאִישׁ אֶחָד
  choice: एक मनुष्य के समान
  rationale: मूल इब्रानी उपमा को बनाए रखा गया है; इसका आशय एकजुट होकर कार्य करना है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: אֶל יְרוּשָׁלִָם
  choice: यरूशलेम में
  rationale: אֶל दिशा और गंतव्य बताता है। हिन्दी में ‘यरूशलेम में इकट्ठे हुए’ गंतव्य पर पहुँचकर एकत्र होने का स्वाभाविक प्रयोग है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל और כְּאִישׁ אֶחָד में लिंगसूचक सामूहिक भाषा
  choice: मुख्य पाठ में ‘इस्राएल के पुत्र’ और ‘एक मनुष्य के समान’ रखा गया
  alternative: ‘इस्राएली’ और ‘एक होकर/एक मन से’
  rationale: मूल की पुल्लिंग अभिव्यक्तियों और प्रतिनिधिक सामूहिक अर्थ, दोनों को सुरक्षित रखा गया है। पादटिप्पणियाँ इनके व्यापक सामुदायिक और मुहावरेदार भाव को स्पष्ट करती हैं, बिना मुख्य पाठ को संप्रदायगत व्याख्या से बदलने के।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। वाक्य की इब्रानी संरचना को पठनीय बनाने के लिए ‘जब…तब’ का प्रयोग किया गया है। ‘पुत्र’ और ‘एक मनुष्य के समान’ मूल की लिंगसूचक तथा मुहावरेदार भाषा को सुरक्षित रखते हैं; उनका आशय पादटिप्पणियों में स्पष्ट किया गया है।
