source:
  edition: WLC
  text: וְ/אֵ֣ין הָ/עָ֗ם מַכִּירִים֙ ק֚וֹל תְּרוּעַ֣ת הַ/שִּׂמְחָ֔ה לְ/ק֖וֹל בְּכִ֣י הָ/עָ֑ם כִּ֣י הָ/עָ֗ם מְרִיעִים֙ תְּרוּעָ֣ה גְדוֹלָ֔ה וְ/הַ/קּ֥וֹל נִשְׁמַ֖ע עַד לְ/מֵ/רָחֽוֹק־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/013.yaml
  text: And the people could not distinguish the sound of the shout of joy from the sound of the people’s weeping[a], for the people were shouting with a great shout[b], and the sound was heard far away.
translation:
  language: hi
  text: और लोग आनन्द के जयघोष की आवाज़ और लोगों के रोने की आवाज़ में भेद नहीं कर पा रहे थे, क्योंकि लोग बहुत ऊँचे स्वर में जयघोष कर रहे थे[a], और वह आवाज़ दूर तक सुनाई दे रही थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “लोग एक बड़ा जयघोष कर रहे थे।”'
    reason: मूल इब्रानी में सजातीय क्रिया और संज्ञा की बलात्मक रचना है; मुख्य पाठ में उसका बल स्वाभाविक हिन्दी में व्यक्त किया गया है।
lexical_decisions:
- source_word: מַכִּירִים
  choice: अलग नहीं पहचान पा रहे थे
  rationale: हिफ़ील रूप यहाँ दो प्रकार की आवाज़ों में भेद कर पाने की क्षमता व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: קוֹל
  choice: आवाज़
  rationale: सन्दर्भ में बोली हुई बात नहीं, बल्कि सुनाई देने वाली ध्वनि अभिप्रेत है; हिन्दी में ‘आवाज़’ सर्वाधिक स्वाभाविक है।
- source_word: תְּרוּעַת הַשִּׂמְחָה
  choice: आनन्द के जयघोष की आवाज़
  rationale: ‘जयघोष’ ऊँची और उल्लासपूर्ण पुकार को व्यक्त करता है, जबकि ‘आनन्द के’ मूल रचनात्मक सम्बन्ध को बनाए रखता है।
- source_word: לְקוֹל בְּכִי הָעָם
  choice: लोगों के रोने की आवाज़ से
  rationale: यह दूसरे श्रव्य स्वर से तुलना को स्पष्ट रखता है और בְּכִי की भावनात्मक तीव्रता को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक संयोजक है।
- source_word: מְרִיעִים תְּרוּעָה גְדוֹלָה
  choice: बड़े ज़ोर से जयघोष कर रहे थे
  rationale: मूल की सजातीय क्रिया-संज्ञा रचना को शब्दशः दोहराने के बजाय उसका बल और निरन्तर क्रिया स्वाभाविक हिन्दी में व्यक्त की गई है।
- source_word: נִשְׁמַע
  choice: सुनाई दे रही थी
  rationale: निफ़ाल का निष्क्रिय अर्थ सुरक्षित है और इसका लिंग ‘आवाज़’ के अनुरूप रखा गया है।
- source_word: עַד לְמֵרָחוֹק
  choice: दूर तक
  rationale: यह बताता है कि आवाज़ काफी दूरी तक पहुँच रही थी; आधुनिक हिन्दी में यह संक्षिप्त और सहज है।
