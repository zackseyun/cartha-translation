base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/009.yaml
  text: Then Jeshua[a], his sons and his brothers, and Kadmiel and his sons, the sons of Judah, stood together as one to oversee those doing the work in the house of God, along with the sons of Henadad, their sons and their brothers, the Levites.
translation:
  language: hi
  text: तब येशू, उसके बेटे और भाई, कदमीएल और उसके बेटे—यहूदा के वंशज[a]—और हनादाद के वंशज, उनके बेटे और उनके भाई, लेवीय, एक होकर परमेश्वर के भवन में काम करने वालों की देखरेख करने के लिए खड़े हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘यहूदा के वंशज’ है। कुछ प्राचीन संस्करणों और आधुनिक अनुवादों में ‘होदव्याह के वंशज’ मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: खड़े हुए
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है। संयुक्त कर्ता के कारण हिन्दी में बहुवचन रखा गया है; प्रसंग में यह काम की देखरेख का दायित्व सँभालने को व्यक्त करता है।
- source_word: יֵשׁוּעַ
  choice: येशू
  rationale: व्यक्तिनाम को उसके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בָּנָיו וְאֶחָיו
  choice: उसके बेटे और भाई
  rationale: मूल पाठ के स्पष्ट पुरुषवाचक पारिवारिक शब्दों और उनके संबंध को बनाए रखा गया है।
- source_word: קַדְמִיאֵל וּבָנָיו
  choice: कदमीएल और उसके बेटे
  rationale: यह येशू के परिवार के समानांतर दूसरा पारिवारिक समूह है; सरल समन्वय इब्रानी क्रम को सुरक्षित रखता है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशज
  rationale: WLC के मसोराई पाठ में ‘यहूदा’ है। בני वंश अथवा कुल के सदस्यों को दर्शा सकता है, इसलिए यहाँ स्वाभाविक हिन्दी ‘वंशज’ चुना गया है। पाठांतर पादटिप्पणी में सुरक्षित है।
- source_word: כְּאֶחָד
  choice: एकजुट होकर
  rationale: यह अभिव्यक्ति उनके एक होकर मिलकर कार्य करने पर बल देती है; चुना हुआ रूप आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לְנַצֵּחַ
  choice: देखरेख करने के लिए
  rationale: इस प्रसंग में पिएल रूप काम करनेवालों पर निर्देशन अथवा पर्यवेक्षण को दर्शाता है, संगीत-संबंधी नेतृत्व को नहीं।
- source_word: עַל עֹשֵׂה הַמְּלָאכָה
  choice: काम करनेवालों की
  rationale: एकवचन कृदंत सामूहिक अर्थ में प्रयुक्त है। हिन्दी में बहुवचन रूप उसी सामूहिक अर्थ को सहजता से व्यक्त करता है।
- source_word: בְּבֵית הָאֱלֹהִים
  choice: परमेश्वर के भवन में
  rationale: यह मंदिर के लिए प्रयुक्त मानक बाइबलीय अभिव्यक्ति है; ‘भवन’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: בְּנֵי חֵנָדָד בְּנֵיהֶם וַאֲחֵיהֶם הַלְוִיִּם
  choice: उनके साथ हनादाद के वंशज, उनके बेटे और उनके भाई, अर्थात् लेवी भी थे
  rationale: अंतिम पदांश को उसी पर्यवेक्षक समूह में सम्मिलित एक अतिरिक्त लेवीय दल के रूप में प्रस्तुत किया गया है। ‘अर्थात् लेवी’ अंतिम समानाधिकरण को स्पष्ट करता है, जबकि पारिवारिक सूची सुरक्षित रहती है।
theological_decisions:
- issue: בְּנֵי יְהוּדָה में पाठगत अनिश्चितता
  choice: मसोराई पाठ के अनुसार ‘यहूदा के वंशज’
  alternative: ‘होदव्याह के वंशज’
  rationale: प्रदत्त WLC पाठ में स्पष्ट रूप से ‘यहूदा’ है, इसलिए मूल-पाठ की प्राथमिकता के अनुसार वही मुख्य पाठ में रखा गया है। कुछ प्राचीन संस्करणों में प्रतिबिंबित वैकल्पिक नाम को छिपाने के बजाय पादटिप्पणी में बताया गया है।
- issue: अंतिम लेवीय पदांश का वाक्यगत संबंध
  choice: हनादाद के वंशजों को पूर्ववर्ती समूह के साथ काम करनेवाले अतिरिक्त पर्यवेक्षकों के रूप में व्यक्त करना
  alternative: इब्रानी सूची को बिना किसी संयोजक स्पष्टीकरण के ज्यों का त्यों रखना
  rationale: इब्रानी में संबंध सूचीबद्ध और कुछ हद तक संक्षिप्त है। ‘उनके साथ’ संदर्भगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, पर उनकी विशिष्ट भूमिका या पद को मूल पाठ से आगे बढ़कर निर्धारित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पठन के योग्य रूप अपनाया गया है। नामों का देवनागरी लिप्यंतरण किया गया है; ‘एकजुट होकर’ और ‘देखरेख’ सामान्य पाठक के लिए स्पष्ट हैं। लंबे इब्रानी समन्वय को दो वाक्यों में बाँटा गया है, किंतु सभी समूह और उनके संबंध सुरक्षित रखे गए हैं।
