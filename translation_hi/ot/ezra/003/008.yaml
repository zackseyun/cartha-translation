  text: וּ/בַ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/בוֹאָ֞/ם אֶל בֵּ֤ית הָֽ/אֱלֹהִים֙ לִ/יר֣וּשָׁלִַ֔ם בַּ/חֹ֖דֶשׁ הַ/שֵּׁנִ֑י הֵחֵ֡לּוּ זְרֻבָּבֶ֣ל בֶּן שְׁ֠אַלְתִּיאֵל וְ/יֵשׁ֨וּעַ בֶּן יֽוֹצָדָ֜ק וּ/שְׁאָ֥ר אֲחֵי/הֶ֣ם הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֗ם וְ/כָל הַ/בָּאִים֙ מֵ/הַ/שְּׁבִ֣י יְרֽוּשָׁלִַ֔ם וַ/יַּעֲמִ֣ידוּ אֶת הַ/לְוִיִּ֗ם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה לְ/נַצֵּ֖חַ עַל מְלֶ֥אכֶת בֵּית יְהוָֽה־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/008.yaml
  text: And in the second year after their coming to the house of God at Jerusalem[a], in the second month, Zerubbabel son of Shealtiel and Jeshua son of Jozadak, and the rest of their brothers the priests and the Levites, and all who had come from the captivity to Jerusalem, began and appointed the Levites from twenty years old and upward to oversee the work of the house of Yahweh.
translation:
  language: hi
  text: परमेश्वर के भवन में, जो यरूशलेम में था, उनके आने के दूसरे वर्ष के दूसरे महीने में जरुब्बाबेल पुत्र शालतीएल, येशू पुत्र योसादाक, उनके शेष भाई—याजक और लेवी—और वे सभी लोग जो बंधुआई से यरूशलेम आए थे, काम में लग गए। उन्होंने बीस वर्ष या उससे अधिक आयु के लेवियों को यहोवा के भवन के काम की देखरेख करने के लिए नियुक्त किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבוֹאָם
  choice: उनके आने के
  rationale: לְ के साथ infinitive construct और 3mp प्रत्यय यहाँ कालवाचक है; यह हिंदी में स्वाभाविक रूप से समय-संबंध व्यक्त करता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: मूल के ‘परमेश्वर का भवन’ को बनाए रखता है और ‘मंदिर’ जैसी संदर्भगत व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- source_word: הֵחֵלּוּ
  choice: काम में लग गए
  rationale: हिब्रू क्रिया का कर्म स्पष्ट नहीं है। हिंदी में अकेला ‘आरंभ किया’ अधूरा लगता है; यह अनुवाद अगले वाक्य में वर्णित निर्माण-व्यवस्था से स्वाभाविक रूप से जुड़ता है, बिना किसी विशिष्ट अनकहे कर्म को जोड़ने के।
- source_word: וַיַּעֲמִידוּ
  choice: नियुक्त किया
  rationale: עמד के Hiphil का यहाँ अर्थ किसी दायित्व के पद पर ठहराना या नियुक्त करना है।
- source_word: אֶת הַלְוִיִּם
  choice: लेवियों को
  rationale: जातीय और उपासना-संबंधी पद का सीधा तथा प्रचलित हिंदी रूप।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: आयु-सीमा के हिब्रू सूत्र का स्पष्ट और आधुनिक हिंदी रूप।
- source_word: לְנַצֵּחַ
  choice: देखरेख करने
  rationale: यहाँ शब्द श्रम अथवा निर्माण की निगरानी का द्योतक है, संगीत-निर्देशन का नहीं।
- source_word: מְלֶאכֶת בֵּית יְהוָה
  choice: यहोवा के भवन के काम
  rationale: מְלָאכָה को ‘काम’ और संबंधवाचक संरचना को यथासंभव सुरक्षित रखा गया है; संदर्भ में भवन-निर्माण का काम निहित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को सामान्य हिंदी बाइबलीय व्यक्तिनाम ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: אֲחֵיהֶם
  choice: उनके शेष भाई
  rationale: मूल का स्पष्ट पुल्लिंग बहुवचन बनाए रखा गया है; आगे का apposition बताता है कि ये भाई याजक और लेवी थे।
- source_word: מֵהַשְּׁבִי
  choice: बंधुआई से
  rationale: שְׁבִי की निर्वासन/बंदी अवस्था को हिंदी बाइबलीय संदर्भ में सुबोध रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिनाम सीधे आया है। हिंदी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया है; ‘प्रभु’ करने से व्यक्तिनाम उपाधि में बदल जाता।
- issue: בֵּית הָאֱלֹהִים की अभिव्यक्ति
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मंदिर
  rationale: ‘भवन’ मूल की रूपक और वाचिक संरचना बनाए रखता है; ‘मंदिर’ संदर्भतः सही होते हुए भी अधिक व्याख्यात्मक है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए प्रचलित बाइबलीय नाम और पद रखे गए हैं। लंबे हिब्रू वाक्य को स्पष्टता के लिए दो हिंदी वाक्यों में बाँटा गया है; सहभागियों की सूची और घटनाक्रम सुरक्षित हैं।
