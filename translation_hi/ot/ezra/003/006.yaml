  text: מִ/יּ֤וֹם אֶחָד֙ לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֔י הֵחֵ֕לּוּ לְ/הַעֲל֥וֹת עֹל֖וֹת לַ/יהוָ֑ה וְ/הֵיכַ֥ל יְהוָ֖ה לֹ֥א יֻסָּֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/006.yaml
  text: From the first day of the seventh month they began to offer burnt offerings to Yahweh[a], though the foundation of the temple of Yahweh had not been laid.
translation:
  language: hi
  text: सातवें महीने के पहले दिन से वे याहवे के लिए होमबलियाँ चढ़ाने लगे, हालाँकि[a] याहवे के मन्दिर की नींव अभी तक नहीं डाली गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “और याहवे के मन्दिर की नींव अभी तक नहीं डाली गई थी।” हिब्रू संयोजक का अनुवाद “और” या विरोधात्मक अर्थ में “परन्तु/हालाँकि” किया जा सकता है। बलियाँ मन्दिर की नींव डाले जाने से पहले आरम्भ हो गई थीं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיּוֹם אֶחָד לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के पहले दिन से
  rationale: מִן आरम्भ-बिन्दु बताता है; ‘से’ उस दिन से बलियाँ चढ़ाना आरम्भ होने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵחֵלּוּ
  choice: वे ... लगे
  rationale: हिफ़ील रूप का अर्थ ‘आरम्भ करना’ है; ‘चढ़ाने लगे’ आधुनिक हिन्दी में सहज और सटीक है।
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: होमबलियाँ चढ़ाने
  rationale: यह बलिदान-संबंधी प्रचलित पदबंध है। ‘होमबलि’ उस बलि को दर्शाता है जो पूरी तरह वेदी पर जलाई जाती थी, और ‘चढ़ाना’ העלה की चढ़ाने/अर्पित करने की धारणा रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ प्राप्तकर्ता को सूचित करता है; परमेश्वर के निज नाम יהוה को लिप्यंतरित रूप ‘याहवे’ में रखा गया है।
- source_word: הֵיכַל יְהוָה
  choice: याहवे का मन्दिर
  rationale: हֵיכָל का अर्थ महल या पवित्र भवन हो सकता है; एज्रा के प्रसंग में ‘मन्दिर’ स्पष्ट और उपयुक्त है।
- source_word: לֹא יֻסָּד
  choice: नींव ... नहीं डाली गई थी
  rationale: יסד का निष्क्रिय रूप नींव डाले जाने को व्यक्त करता है। हिन्दी में संज्ञा ‘नींव’ जोड़ना मूल में निहित अर्थ को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וְ
  choice: हालाँकि
  rationale: प्रसंग में संयोजक बलियों के आरम्भ और मन्दिर की नींव न डाले जाने के बीच विरोधात्मक/रियायती संबंध व्यक्त कर सकता है; मूल की दूसरी सम्भावना फुटनोट में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय निज नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: बलियाँ मन्दिर की नींव डाले जाने से पहले आरम्भ होने का संबंध
  choice: हालाँकि
  alternative: और; परन्तु
  rationale: प्रसंग रियायती/विरोधात्मक अर्थ का समर्थन करता है, पर हिब्रू וְ अपने आप में सामान्य संयोजक भी हो सकता है; इसलिए वैकल्पिक संबंध फुटनोट में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होमबलि’ बाइबलीय बलिदान की विशिष्टता बनाए रखता है; अस्पष्ट हिब्रू संयोजक की वैकल्पिक समझ फुटनोट में दी गई है।
