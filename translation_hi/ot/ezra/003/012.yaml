translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘भवन’ द्वारा मूल के ‘घर/भवन’ शब्द-संबंध को बनाए रखा गया है, जबकि फुटनोट मन्दिर-सन्दर्भ स्पष्ट करता है। समान समय में उठे शोक और आनन्द के तनाव को ‘जबकि’ से बिना व्याख्यात्मक समाधान के सुरक्षित रखा गया है।
