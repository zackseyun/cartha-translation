  text: וְ/רַבִּ֡ים מֵ/הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּם֩ וְ/רָאשֵׁ֨י הָ/אָב֜וֹת הַ/זְּקֵנִ֗ים אֲשֶׁ֨ר רָא֜וּ אֶת הַ/בַּ֤יִת הָֽ/רִאשׁוֹן֙ בְּ/יָסְד֔/וֹ זֶ֤ה הַ/בַּ֨יִת֙ בְּ/עֵ֣ינֵי/הֶ֔ם בֹּכִ֖ים בְּ/ק֣וֹל גָּד֑וֹל וְ/רַבִּ֛ים בִּ/תְרוּעָ֥ה בְ/שִׂמְחָ֖ה לְ/הָרִ֥ים קֽוֹל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/012.yaml
  text: But many of the priests and the Levites and the heads of the fathers’ houses[a], the old men who had seen the first house, were weeping with a loud voice when this house was founded before their eyes[c][b], while many were raising their voice with a shout of joy.
translation:
  language: hi
  text: परन्तु याजकों, लेवियों और पितृकुलों के मुखियाओं[a] में से बहुत-से वृद्ध जन, जिन्होंने पहले भवन[b] को देखा था, जब उनकी आँखों के सामने इस भवन की नींव रखी गई[c], तो ऊँचे स्वर से रो रहे थे; जबकि बहुत-से लोग आनन्द से ऊँचे स्वर में जयघोष कर रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पितृकुलों के मुखिया’ से अभिप्राय पूर्वजों पर आधारित विस्तृत परिवारों या कुलों के अगुवों से है।
    reason: cultural_note
  - marker: b
    text: या ‘पहले वाला भवन’; इब्रानी में शाब्दिक रूप से ‘पहला भवन’ है, जिसका संकेत पहले के मन्दिर की ओर है।
    reason: lexical_alternative
  - marker: c
    text: या ‘जब यह भवन स्थापित किया गया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרַבִּים מֵהַכֹּהֲנִים וְהַלְוִיִּם וְרָאשֵׁי הָאָבוֹת
  choice: परन्तु याजकों, लेवियों और पितृकुलों के मुखियाओं में से बहुत-से
  rationale: מִן का अंशसूचक अर्थ ‘में से’ द्वारा व्यक्त किया गया है। आरम्भिक ו को पिछले पद के आनन्दपूर्ण जयघोष के साथ विरोध दिखाने के लिए ‘परन्तु’ कहा गया है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पद पूर्वज के आधार पर संगठित विस्तृत परिवारों अथवा कुलों के अगुवों को दर्शाता है; ‘पितृकुल’ उस सामाजिक संरचना को संक्षेप और स्वाभाविक हिन्दी में रखता है।
- source_word: הַזְּקֵנִים
  choice: वृद्ध लोग
  rationale: सन्दर्भ में पदाधिकारी होने की अपेक्षा उनकी आयु प्रमुख है, क्योंकि वे पहले भवन को देख चुके थे।
- source_word: הַבַּיִת הָרִאשׁוֹן
  choice: पहला भवन
  rationale: शाब्दिक ‘पहला भवन’ रखा गया है और בַּיִת को सीधे ‘मन्दिर’ बनाकर स्रोत की शब्दावली को नहीं बदला गया; सन्दर्भ में यह पहले मन्दिर को सूचित करता है।
- source_word: בְּיָסְדוֹ זֶה הַבַּיִת
  choice: जब इस भवन की नींव रखी गई
  rationale: יסד यहाँ भवन की नींव डालने अथवा उसे स्थापित करने की क्रिया बताता है। चुना गया रूप प्रसंगानुकूल और स्वाभाविक हिन्दी है।
- source_word: בְּעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: प्रत्यक्ष रूप से देखने की इब्रानी अभिव्यक्ति का सजीव और स्वाभाविक हिन्दी रूप।
- source_word: בֹּכִים בְּקוֹל גָּדוֹל
  choice: ऊँचे स्वर से रोने लगे
  rationale: प्रतिभागी रूप की चल रही क्रिया और קוֹל גָּדוֹל की तीव्र श्रव्यता दोनों को स्पष्ट करता है।
- source_word: בִּתְרוּעָה בְשִׂמְחָה לְהָרִים קוֹל
  choice: आनन्द से जयघोष करते हुए अपनी आवाज़ ऊँची कर रहे थे
  rationale: תְּרוּעָה को उल्लासपूर्ण सामूहिक पुकार ‘जयघोष’ और לְהָרִים קוֹל को ‘अपनी आवाज़ ऊँची करना’ कहकर दोनों बिम्ब सुरक्षित रखे गए हैं।
