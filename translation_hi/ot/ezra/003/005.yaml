source:
  edition: WLC
  text: וְ/אַחֲרֵי כֵ֞ן עֹלַ֤ת תָּמִיד֙ וְ/לֶ֣/חֳדָשִׁ֔ים וּ/לְ/כָל מוֹעֲדֵ֥י יְהוָ֖ה הַ/מְקֻדָּשִׁ֑ים וּ/לְ/כֹ֛ל מִתְנַדֵּ֥ב נְדָבָ֖ה לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/003/005.yaml
  text: And after that came the regular burnt offering[a], and the offerings for the new moons and for all the appointed feasts of Yahweh that were consecrated[c][b], and for everyone who willingly offered a freewill offering to Yahweh.
translation:
  language: hi
  text: इसके बाद नियमित होमबलि, नए चाँदों और यहोवा के सभी पवित्र किए हुए नियत पर्वों के लिए बलियाँ, तथा हर उस व्यक्ति की स्वेच्छा-भेंट भी चढ़ाई गई जो यहोवा को स्वेच्छा से भेंट चढ़ाता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पद को पिछली बलिदान-संबंधी गतिविधि से जोड़ने वाला स्वाभाविक काल-संक्रमण है।
- source_word: עֹלַת תָּמִיד
  choice: नियमित होमबलि
  rationale: עֹלָה के लिए प्रचलित ‘होमबलि’ और תָּמִיד के नियमित अथवा निरंतर दोहराव का अर्थ सुरक्षित रहता है; ‘प्रतिदिन’ को मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: וְלֶחֳדָשִׁים
  choice: नवचाँदों के लिए
  rationale: यह केवल महीनों का नहीं, प्रत्येक महीने के आरंभ में मनाए जाने वाले नवचाँद के पवित्र अनुष्ठानों का उल्लेख है।
- source_word: וּלְכָל מוֹעֲדֵי יְהוָה
  choice: यहोवा के सभी नियत पर्वों के लिए
  rationale: מוֹעֵד निश्चित किए गए पवित्र समय अथवा पर्व को दर्शाता है; संदर्भ में ‘नियत पर्व’ दोनों भावों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמְקֻדָּשִׁים
  choice: पवित्र ठहराए हुए
  rationale: निष्क्रिय कृदंत इन पर्वों को पवित्र उपयोग के लिए अलग ठहराया गया बताता है।
- source_word: וּלְכֹל מִתְנַדֵּב נְדָבָה
  choice: हर उस व्यक्ति की ओर से भी, जिसने स्वेच्छा से ... स्वेच्छा-बलि चढ़ाई
  rationale: हिब्रू की स्वैच्छिक तत्परता और उसी मूल से बने बलिदान-संज्ञा, दोनों को स्पष्ट रखा गया है; ‘की ओर से’ बलियों के पूर्ववर्ती संदर्भ में निहित संबंध को सहज बनाता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ में आए वाचा-नाम को हिन्दी के प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय स्पष्ट नाम के रूप में रखा गया है।
- issue: बलियों की क्रिया का अध्याहार
  choice: बलियाँ चढ़ाई गईं
  alternative: क्रिया को अधूरा छोड़ते हुए संज्ञा-सूची
  rationale: हिब्रू पद पूर्ववर्ती संदर्भ पर निर्भर संक्षिप्त सूची है। हिन्दी में पूरा और स्पष्ट वाक्य बनाने के लिए बलिदान-संदर्भ से निहित क्रिया जोड़ी गई है, बिना किसी नई धार्मिक धारणा के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। ‘होमबलि’, ‘नवचाँद’, ‘नियत पर्व’ और ‘स्वेच्छा-बलि’ जैसे स्थापित धार्मिक पद संदर्भगत स्पष्टता के साथ रखे गए हैं।
