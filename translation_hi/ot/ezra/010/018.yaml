  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण वाक्य-विन्यास अपनाया गया है। वंशावली की पुनरावृत्ति और ‘भाइयों’ की संभावित व्यापकता को अनावश्यक रूप से सिद्धान्तगत ढंग से नहीं सुलझाया गया।
