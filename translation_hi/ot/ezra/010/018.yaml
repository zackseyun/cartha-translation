source:
  edition: WLC
  text: וַ/יִּמָּצֵא֙ מִ/בְּנֵ֣י הַ/כֹּהֲנִ֔ים אֲשֶׁ֥ר הֹשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת מִ/בְּנֵ֨י יֵשׁ֤וּעַ בֶּן יֽוֹצָדָק֙ וְ/אֶחָ֔י/ו מַֽעֲשֵׂיָה֙ וֶֽ/אֱלִיעֶ֔זֶר וְ/יָרִ֖יב וּ/גְדַלְיָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/018.yaml
  text: 'And among the sons of the priests who had taken foreign wives[a], there were found from the sons of Jeshua son of Jozadak and his brothers: Maaseiah, Eliezer, Jarib, and Gedaliah.'
translation:
  language: hi
  text: 'याजकों के वंशजों में, जिन्होंने विदेशी स्त्रियों को पत्नी के रूप में लिया था[a], ये पाए गए: योसादाक के पुत्र येशूआ और उसके भाइयों के वंशजों में से मासेयाह, एलीएजेर, यारीब और गदल्याह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्होंने विदेशी स्त्रियों से विवाह किया था।”
    reason: इब्रानी वैवाहिक मुहावरे का स्पष्ट वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיִּמָּצֵא
  choice: इनमें ये पाए गए
  rationale: क्रिया इब्रानी में एकवचन है, पर आगे अनेक पुरुषों की सूची है; हिन्दी में बहुवचन सूची के अनुरूप स्वाभाविक प्रयोग किया गया है।
- source_word: מִבְּנֵי הַכֹּהֲנִים
  choice: याजकों के वंशजों में से
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ याजकीय वंश या कुल की सदस्यता अभिप्रेत है; ‘वंशज’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: אֲשֶׁר הֹשִׁיבוּ נָשִׁים נָכְרִיּוֹת
  choice: जिन लोगों ने परदेशी स्त्रियों को पत्नी बनाया था
  rationale: यह पद वैवाहिक संबंध स्थापित करने का संकेत देता है। यह अनुवाद ‘स्त्रियों’ और वैवाहिक अर्थ दोनों को बनाए रखता है।
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: परदेशी स्त्रियों
  rationale: ‘परदेशी’ नָכְרִיּוֹת के बाहरी/विदेशी होने के अर्थ को सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: מִבְּנֵי יֵשׁוּעַ בֶּן יוֹצָדָק
  choice: योसादाक के पुत्र येशू के वंशजों में से
  rationale: वंशावली-संबंध को स्पष्ट रखते हुए नामों का देवनागरी लिप्यंतरण किया गया है; पहला בֶּן प्रत्यक्ष पितृ-संबंध बताता है, जबकि बहुवचन בְּנֵי समूहगत वंशजों को।
- source_word: וְאֶחָיו
  choice: और उसके भाइयों
  rationale: प्रत्यक्ष अर्थ ‘उसके भाई’ सुरक्षित रखा गया है; इसे व्यापक ‘कुटुम्बियों’ के रूप में नहीं खोला गया।
- source_word: מַעֲשֵׂיָה וֶאֱלִיעֶזֶר וְיָרִיב וּגְדַלְיָה
  choice: मासेयाह, एलीएज़ेर, यारीब और गदल्याह
  rationale: व्यक्तिनामों का स्रोत-आधारित देवनागरी लिप्यंतरण किया गया है।
