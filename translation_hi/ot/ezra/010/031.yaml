base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/031.yaml
  text: 'And from the sons of Harim: Eliezer[a], Isshijah, Malkijah, Shemaiah[c][b], and Shimeon.'
translation:
  language: hi
  text: 'और हारीम के वंशजों में से: एलीएजेर, यिश्शियाह[a], मल्कियाह, शमायाह और शिमोन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम को “यिशियाह” या “यिशायाह” भी लिखा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के वंशजों में से
  rationale: संयोजक וּ पिछले पद की सूची से संबंध जोड़ता है। בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर वंश-सूची के इस प्रसंग में ‘वंशज’ अधिक स्वाभाविक है; ‘में से’ बताता है कि ये नाम हारीम के कुल से चुने गए व्यक्तियों के हैं।
- source_word: חָרִם
  choice: हारीम
  rationale: इब्रानी व्यक्ति अथवा कुलनाम का देवनागरी लिप्यंतरण।
- source_word: אֱלִיעֶזֶר
  choice: एलीएजेर
  rationale: इब्रानी नाम का ध्वन्यात्मक और हिन्दी-पठनीय लिप्यंतरण।
- source_word: יִשִּׁיָּה
  choice: यिश्शियाह
  rationale: मसोरेटी स्वरांकन और व्यंजन-रूप को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण; नाम के अन्य प्रचलित रूप पादटिप्पणी में दिए गए हैं।
- source_word: מַלְכִּיָּה
  choice: मल्कियाह
  rationale: इब्रानी नाम का सीधा, हिन्दी में सहज लिप्यंतरण।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: इब्रानी नाम का ध्वन्यात्मक लिप्यंतरण।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: आरंभिक שׁ की ‘श’ ध्वनि और इब्रानी स्वर-रूप को स्पष्ट रूप से दर्शाता है।
