  register: आधुनिक मानक हिन्दी में संक्षिप्त वंश-सूची की शैली रखी गई है। ‘पुत्रों’ के स्थान पर प्रसंगानुकूल ‘वंशजों’ का प्रयोग किया गया है। व्यक्तिनामों को मूल इब्रानी उच्चारण के निकट रखते हुए देवनागरी में पठनीय बनाया गया है।
