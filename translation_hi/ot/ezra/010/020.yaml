  text: 'And from the sons of Immer: Hanani and Zebadiah.'
translation:
  language: hi
  text: 'और इम्मेर के वंशजों में से: हनानी और जबद्याह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: यह पदबंध सूची में एक और कुल-समूह का परिचय देता है। यहाँ בְּנֵי किसी पूर्वज के बाद की पीढ़ियों के कुल-सदस्यों को सूचित करता है, इसलिए आधुनिक हिन्दी में ‘वंशजों’ स्वाभाविक और सटीक है।
- source_word: אִמֵּר
  choice: इम्मेर
  rationale: याजकीय कुल के नाम का मूल उच्चारण ध्यान में रखते हुए देवनागरी लिप्यंतरण किया गया है।
- source_word: חֲנָנִי
  choice: हनानी
  rationale: व्यक्तिवाचक नाम का प्रचलित और मूल के निकट देवनागरी लिप्यंतरण।
- source_word: וּ/זְבַדְיָה
  choice: और जबद्याह
  rationale: आरंभिक संयोजक וּ को ‘और’ से व्यक्त किया गया है; नाम का ऐसा लिप्यंतरण चुना गया है जो हिब्रू रूप को स्पष्ट रखता है।
