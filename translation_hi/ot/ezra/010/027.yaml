base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/027.yaml
  text: 'And from the sons of Zattu: Elioenai, Eliashib, Mattaniah, Jeremoth, Zabad, and Aziza.'
translation:
  language: hi
  text: 'और ज़त्तू के वंशजों में से: एल्योएनै, एल्याशीब, मत्तन्याह, यरेमोत, ज़ाबाद और अज़ीज़ा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: सूची को आगे बढ़ाने वाले वाव को ‘और’ से रखा गया है। वंशावली और कुल-सूची के इस संदर्भ में בְּנֵי का अर्थ केवल प्रत्यक्ष ‘पुत्र’ नहीं, बल्कि व्यापक रूप से वंशज या कुल के सदस्य भी हो सकता है; इसलिए स्वाभाविक आधुनिक हिन्दी में ‘वंशजों’ चुना गया।
- source_word: זַתּוּא
  choice: ज़त्तू
  rationale: इब्रानी व्यक्तिनाम/कुलनाम का देवनागरी लिप्यंतरण।
- source_word: אֶלְיוֹעֵנַי
  choice: एल्योएनै
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אֶלְיָשִׁיב
  choice: एल्याशीब
  rationale: इब्रानी व्यक्तिनाम का उच्चारण-सन्निकट लिप्यंतरण।
- source_word: מַתַּנְיָה
  choice: मत्तन्याह
  rationale: द्वित्व व्यंजन और अंतिम याहू-संबंधी नामांश को पहचानने योग्य रूप में रखा गया।
- source_word: וִֽ/ירֵמוֹת
  choice: यरेमोत
  rationale: मसोराई स्वरांकन יְרֵמוֹת के निकट लिप्यंतरण; आरंभिक वाव को हिन्दी सूची-शैली में अलग से दोहराया नहीं गया।
- source_word: וְ/זָבָד
  choice: ज़ाबाद
  rationale: नाम का देवनागरी लिप्यंतरण; संयोजक वाव को हिन्दी सूची-विन्यास में समाहित किया गया।
- source_word: וַ/עֲזִיזָא
  choice: अज़ीज़ा
  rationale: नाम का उच्चारण-सन्निकट लिप्यंतरण; इसके पहले के वाव को अंतिम ‘और’ से व्यक्त किया गया।
