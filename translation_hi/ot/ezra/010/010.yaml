  text: וַ/יָּ֨קָם עֶזְרָ֤א הַ/כֹּהֵן֙ וַ/יֹּ֣אמֶר אֲלֵ/הֶ֔ם אַתֶּ֣ם מְעַלְתֶּ֔ם וַ/תֹּשִׁ֖יבוּ נָשִׁ֣ים נָכְרִיּ֑וֹת לְ/הוֹסִ֖יף עַל אַשְׁמַ֥ת יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/010.yaml
  text: Then Ezra the priest stood up and said to them[a], “You have acted unfaithfully and have taken foreign women as wives, adding to the guilt of Israel.”
translation:
  language: hi
  text: तब एज्रा याजक उठ खड़ा हुआ और उनसे कहा, “तुमने विश्वासघात किया है और विदेशी स्त्रियों को अपनी पत्नियाँ बनाया है[a]; इस प्रकार इस्राएल के दोष में और वृद्धि की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “विदेशी पत्नियाँ।” इब्रानी में शाब्दिक रूप से “विदेशी स्त्रियाँ” है, पर इस प्रसंग में वे स्त्रियाँ अभिप्रेत हैं जिन्हें विवाह में ग्रहण किया गया था।
    reason: נָשִׁים का अर्थ ‘स्त्रियाँ’ या प्रसंगानुसार ‘पत्नियाँ’ हो सकता है; पादटिप्पणी शाब्दिक शब्द और प्रसंगगत वैवाहिक अर्थ दोनों को सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: यह सभा के सामने एज्रा के उठकर सार्वजनिक रूप से बोलने की क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: यह एज्रा की पदवी का सीधा और प्रचलित बाइबिलीय हिन्दी रूप है।
- source_word: מְעַלְתֶּם
  choice: तुमने विश्वासघात किया है
  rationale: מעל नैतिक अपराध के साथ वाचा के प्रति अविश्वासयोग्यता का भाव भी रखता है; ‘विश्वासघात’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: וַתֹּשִׁיבוּ
  choice: पत्नी बनाकर रखा है
  rationale: ישב के हिफ़ील का मूल भाव ‘बसाना/रखना’ है; प्रसंग में यह स्त्रियों को वैवाहिक संबंध में घराने में रखने की ओर संकेत करता है। यह रूप केवल ‘विवाह किया’ कहने की अपेक्षा क्रिया के मूल भाव को अधिक सुरक्षित रखता है।
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: विदेशी स्त्रियों
  rationale: ‘स्त्रियाँ’ इब्रानी की शाब्दिक अस्पष्टता को बनाए रखता है, जबकि प्रसंग और ‘पत्नी बनाकर’ वैवाहिक संबंध स्पष्ट करते हैं। ‘विदेशी’ נָכְרִיּוֹת का सीधा आधुनिक हिन्दी रूप है।
- source_word: לְהוֹסִיף
  choice: और बढ़ाया है
  rationale: यह पहले से विद्यमान सामूहिक दोष में वृद्धि के परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַשְׁמַת
  choice: दोष
  rationale: यहाँ शब्द दोष अथवा दोषी ठहरने की अवस्था बताता है, दोषबलि नहीं; ‘दोष’ सरल और सटीक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह नाम यहाँ वाचा-समुदाय को सामूहिक रूप से सूचित करता है।
theological_decisions:
- issue: इस्राएल का सामूहिक वाचागत दोष
  choice: इस्राएल का दोष और बढ़ाया है
  alternative: इस्राएल के अपराध में और वृद्धि की है
  rationale: यह अपराध को केवल व्यक्तिगत आचरण न बताकर पूरे समुदाय के दोष में वृद्धि के रूप में प्रस्तुत करता है, जैसा इब्रानी पाठ में है, और कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: נָשִׁים का ‘स्त्रियाँ’ अथवा ‘पत्नियाँ’ अर्थ
  choice: विदेशी स्त्रियों को पत्नी बनाकर रखा है
  alternative: विदेशी पत्नियों को रखा है
  rationale: मुख्य पाठ इब्रानी के ‘स्त्रियाँ’ शब्द को बनाए रखते हुए प्रसंगगत वैवाहिक संबंध स्पष्ट करता है; पादटिप्पणी संक्षिप्त वैकल्पिक अभिव्यक्ति देती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उठ खड़ा हुआ’, ‘विश्वासघात’ और ‘दोष और बढ़ाया’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि वाचा-संबंधी और सामूहिक उत्तरदायित्व का भाव बना रहता है।
