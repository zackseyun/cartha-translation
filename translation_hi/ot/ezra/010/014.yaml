  text: יַֽעֲמְדוּ נָ֣א שָׂ֠רֵי/נוּ לְֽ/כָל הַ/קָּהָ֞ל וְ/כֹ֣ל אֲשֶׁ֣ר בֶּ/עָרֵ֗י/נוּ הַ/הֹשִׁ֞יב נָשִׁ֤ים נָכְרִיּוֹת֙ יָבֹא֙ לְ/עִתִּ֣ים מְזֻמָּנִ֔ים וְ/עִמָּ/הֶ֛ם זִקְנֵי עִ֥יר וָ/עִ֖יר וְ/שֹׁפְטֶ֑י/הָ עַ֠ד לְ/הָשִׁ֞יב חֲר֤וֹן אַף אֱלֹהֵ֨י/נוּ֙ מִמֶּ֔/נּוּ עַ֖ד לַ/דָּבָ֥ר הַ/זֶּֽה־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/014.yaml
  text: Please let our leaders stand for the whole assembly[a], and let everyone in our cities who has taken foreign wives come at appointed times, with them the elders of each city and its judges[b], until the burning anger of our God is turned back from us in this matter.
translation:
  language: hi
  text: हमारे अगुए पूरी सभा की ओर से यह जिम्मेदारी सँभालें। हमारे नगरों में जितने लोगों ने परदेशी स्त्रियों को पत्नी बनाया है[a], वे निर्धारित समयों पर आएँ, और उनके साथ हर नगर के बुज़ुर्ग और उसके न्यायाधीश भी आएँ, जब तक इस मामले के संबंध में हमारे परमेश्वर का धधकता क्रोध हमसे टल न जाए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “परदेशी स्त्रियों को बसा लिया है”; यहाँ आशय उन्हें पत्नी बनाकर अपने घर में रखने से है।
    reason: lexical_alternative
  - marker: b
    text: मसोरी पाठ की अंतिम अभिव्यक्ति शाब्दिक रूप से “इस मामले तक” है और उसका संबंध अस्पष्ट है। इसे “इस मामले के कारण” भी समझा जा सकता है; कुछ अनुवाद भाव देते हैं, “और जब तक इस मामले का निपटारा न हो जाए।”
    reason: textual_ambiguity
lexical_decisions:
- source_word: יַעֲמְדוּ נָא
  choice: यह काम सँभालें
  rationale: यह विनम्र प्रस्ताव है। यहाँ ‘खड़े हों’ का शाब्दिक अनुवाद हिन्दी में अस्पष्ट होता; प्रसंग में अगुओं के प्रतिनिधि रूप से जिम्मेदारी लेने का भाव है।
- source_word: שָׂרֵינוּ
  choice: हमारे अगुए
  rationale: שָׂרִים प्रशासनिक अगुओं या अधिकारियों को दर्शाता है; ‘अगुए’ सहज और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: לְכָל הַקָּהָל
  choice: पूरी सभा की ओर से
  rationale: לְ यहाँ सभा के संबंध में प्रतिनिधि भूमिका व्यक्त करता है; ‘की ओर से’ इस कार्यगत अर्थ को स्पष्ट करता है।
- source_word: הַהֹשִׁיב נָשִׁים נָכְרִיּוֹת
  choice: परदेशी स्त्रियों को पत्नी बनाया है
  rationale: शाब्दिक मुहावरा ‘परदेशी स्त्रियों को बसाया है’ है, पर वैवाहिक और घरेलू प्रसंग में पत्नी के रूप में ग्रहण करने का अर्थ है।
- source_word: לְעִתִּים מְזֻמָּנִים
  choice: निर्धारित समयों पर
  rationale: यह आधिकारिक रूप से तय किए गए अलग-अलग अवसरों को दर्शाता है।
- source_word: זִקְנֵי עִיר וָעִיר וְשֹׁפְטֶיהָ
  choice: हर नगर के पुरनिए और उसके न्यायी
  rationale: עִיר וָעִיר वितरणात्मक है, अर्थात ‘हर नगर’; प्रत्यय ‘उसके’ उसी नगर की ओर संकेत करता है।
- source_word: חֲרוֹן אַף אֱלֹהֵינוּ
  choice: हमारे परमेश्वर का धधकता क्रोध
  rationale: यह अभिव्यक्ति क्रोध की जलती हुई तीव्रता बताती है; अनुवाद रूपक और धर्मवैचारिक तनाव दोनों बनाए रखता है।
- source_word: מִמֶּנּוּ
  choice: हमसे
  rationale: प्रत्यय सामूहिक समुदाय की ओर संकेत करता है।
- source_word: עַד לַדָּבָר הַזֶּה
  choice: इस मामले के कारण
  rationale: मसोरी पाठ का अंतिम वाक्यांश संक्षिप्त और व्याकरणतः कठिन है। प्रसंगानुसार इसे परमेश्वर के क्रोध से संबंधित इस मामले के रूप में लिया गया है; अस्पष्टता फुटनोट में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के क्रोध की भाषा
  choice: हमारे परमेश्वर का धधकता क्रोध
  alternative: हमारे परमेश्वर का प्रचण्ड कोप
  rationale: मूल पाठ परमेश्वर के तीव्र क्रोध को स्पष्ट रूप से कहता है। ‘धधकता क्रोध’ मूल रूपक को बिना नरम किए या अतिरिक्त धर्मसिद्धान्त जोड़े बनाए रखता है।
- issue: क्रोध के टलने की कर्तृवाच्यता
  choice: हमसे टल न जाए
  alternative: हमसे हटा न दिया जाए
  rationale: हिब्रू परिणाम—क्रोध का फिर जाना—बताता है, पर कर्ता को स्पष्ट नहीं करता। हिन्दी में यह रूप उसी अनिर्दिष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सामुदायिक-प्रशासनिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘पुरनिए’ को संस्थागत बुजुर्ग अगुओं के अर्थ में और ‘न्यायी’ को स्थानीय न्यायाधिकारियों के अर्थ में चुना गया है।
