base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/025.yaml
  text: 'And from Israel[a], from the sons of Parosh: Ramiah, Izziah, Malkijah, Mijamin, Eleazar, Malkijah, and Benaiah.'
translation:
  language: hi
  text: 'और इस्राएलियों में से[a], परोश के वंशजों में से: रम्याह, यिज्जियाह, मल्कियाह, मिय्यामीन, एलाज़ार, मल्कियाह और बनायाह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में इस सूची में “मल्कियाह” नाम दो बार आया है; सम्भवतः ये एक ही नाम वाले दो अलग-अलग पुरुष हैं।
    reason: पाठ में नाम की वास्तविक पुनरावृत्ति को बनाए रखते हुए पाठक को संभावित आशय बताना।
lexical_decisions:
- source_word: וּמִֽיִּשְׂרָאֵל
  choice: और इस्राएलियों में से
  rationale: וּ־ पिछले पद की सूची से संबंध बनाए रखता है; מִן चयन या समूह में से व्यक्तियों को सूचित करता है। यहाँ सामूहिक 'इस्राएल' को स्वाभाविक आधुनिक हिन्दी में 'इस्राएलियों' के रूप में व्यक्त किया गया है।
- source_word: מִבְּנֵי פַרְעֹשׁ
  choice: परोश के वंशजों में से
  rationale: सूची और कुल-संबंध के इस प्रसंग में בְּנֵי जैविक पुत्रों तक सीमित नहीं, बल्कि वंशजों अथवा कुल-सदस्यों को दर्शाता है; इसलिए 'वंशजों' अधिक स्पष्ट और स्वाभाविक है।
- source_word: פַרְעֹשׁ
  choice: परोश
  rationale: इब्रानी व्यक्तिनाम का हिन्दी ध्वन्यंतरण।
- source_word: רַמְיָה
  choice: रम्याह
  rationale: इब्रानी नाम के व्यंजन और अंतिम יָה घटक को निकटता से दर्शाने वाला ध्वन्यंतरण।
- source_word: יִזִּיָּה
  choice: यिज्जियाह
  rationale: आरंभिक י, प्रबल זּ और अंतिम יָה को सुरक्षित रखने वाला हिन्दी ध्वन्यंतरण।
- source_word: מַלְכִּיָּה
  choice: मल्कियाह
  rationale: नाम के दोनों समान पाठीय रूपों के लिए एक ही ध्वन्यंतरण रखा गया है।
- source_word: מִיָּמִן
  choice: मिय्यामीन
  rationale: द्वित्वित יּ और दीर्घ अंतिम स्वर को संकेतित करने वाला स्रोत-सन्निकट ध्वन्यंतरण।
- source_word: אֶלְעָזָר
  choice: एलआज़ार
  rationale: इब्रानी नाम के घटकों को स्पष्ट रखते हुए आधुनिक हिन्दी में पठनीय ध्वन्यंतरण।
- source_word: בְנָיָה
  choice: बनायाह
  rationale: इब्रानी व्यक्तिनाम का स्रोत-सन्निकट हिन्दी ध्वन्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली अपनाई गई है। इब्रानी के प्रत्येक संयोजक को यांत्रिक रूप से दोहराने के बजाय हिन्दी सूची-विराम का प्रयोग किया गया है, पर अंतिम नाम से पहले 'और' रखा गया है।
