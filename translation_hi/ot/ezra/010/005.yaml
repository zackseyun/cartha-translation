base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/005.yaml
  text: So Ezra arose and made the chief priests[a], the Levites, and all Israel swear to do according to this word, and they swore.
translation:
  language: hi
  text: तब एज्रा उठा और उसने याजकों के प्रधानों, लेवियों और समस्त इस्राएल को शपथ दिलाई कि वे इस बात[a] के अनुसार करेंगे; और उन्होंने शपथ खाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस वचन के अनुसार” अथवा “इस प्रस्ताव के अनुसार।” इब्रानी शब्द का अर्थ कही हुई बात भी हो सकता है और विचाराधीन मामला भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום के कथात्मक रूप का स्वाभाविक और निकट हिंदी अनुवाद; यह एज्रा के निर्णायक रूप से कार्य आरम्भ करने को व्यक्त करता है।
- source_word: וַיַּשְׁבַּע
  choice: शपथ दिलाई
  rationale: 'שׁבע के हिफ़ील रूप की कारकता को स्पष्ट रखता है: एज्रा ने दूसरों से शपथ कराई।'
- source_word: שָׂרֵי הַכֹּהֲנִים
  choice: याजकों के प्रधानों
  rationale: रचना का औपचारिक अर्थ बनाए रखता है और שָׂרֵי को याजकों के अगुवों या प्रमुख व्यक्तियों के रूप में व्यक्त करता है, बिना किसी बाद के तकनीकी पदनाम को आरोपित किए।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: לְוִיִּם के लिए प्रचलित और स्पष्ट हिंदी रूप।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और समस्त इस्राएल
  rationale: मूल के सामूहिक वाचा-संबंधी पद को बनाए रखता है; 'समस्त' गरिमापूर्ण किंतु सुबोध है।
- source_word: לַעֲשׂוֹת
  choice: करेंगे
  rationale: עשה के सामान्य अर्थ 'करना' को बनाए रखते हुए हिंदी में शपथ के आशय को स्वाभाविक परोक्ष कथन के रूप में प्रस्तुत करता है।
- source_word: כַּדָּבָר הַזֶּה
  choice: इस बात के अनुसार
  rationale: דָּבָר यहाँ कही हुई बात और विचाराधीन मामले दोनों की ओर संकेत कर सकता है। 'बात' संदर्भ में स्वाभाविक है, जबकि पादटिप्पणी इसकी अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: וַיִּשָּׁבֵעוּ
  choice: और उन्होंने शपथ खाई
  rationale: निफ़ाल रूप के परिणाम को सीधे व्यक्त करता है और मूल में शपथ संबंधी क्रिया की पुनरावृत्ति तथा गंभीरता बनाए रखता है।
