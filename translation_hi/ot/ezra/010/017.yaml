  yaml_path: translation/ot/ezra/010/017.yaml
  text: And they finished with all the men who had taken foreign wives by the first day of the first month[a].
translation:
  language: hi
  text: और उन्होंने उन सभी पुरुषों के मामलों की जाँच पूरी कर ली, जिन्होंने परदेशी स्त्रियों को पत्नी बनाकर रखा था—पहले महीने के पहले दिन तक।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְכַלּוּ בַכֹּל
  choice: सभी ... के मामलों की जाँच पूरी कर ली
  rationale: क्रिया כלה प्रक्रिया की समाप्ति बताती है, और בַכֹּל उसका पूरा दायरा। पिछले प्रसंग में अधिकारियों द्वारा मामलों की जाँच हो रही है; इसलिए हिंदी में केवल अस्पष्ट ‘सबके साथ पूरा किया’ के बजाय प्रक्रियात्मक अर्थ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֲנָשִׁים
  choice: पुरुषों
  rationale: संज्ञा पुल्लिंग बहुवचन है और प्रसंग में जाँच के अधीन पुरुषों को सूचित करती है।
- source_word: הַהֹשִׁיבוּ
  choice: पत्नी बनाया था
  rationale: हिफ़ील रूप का शाब्दिक अर्थ ‘बसाया था’ या ‘रहने दिया था’ है, पर एज्रा 10 के प्रसंग में स्त्रियों को घर में पत्नी के रूप में रखने का वैवाहिक आशय है। यह चयन ‘विवाह किया था’ की अपेक्षा हिब्रू मुहावरे के कुछ निकट रहते हुए हिंदी में अर्थ स्पष्ट करता है।
- source_word: נָשִׁים נָכְרִיּוֹת
  choice: परदेशी स्त्रियों
  rationale: נָכְרִיּוֹת समुदाय के बाहर की स्त्रियों को दर्शाता है। ‘परदेशी’ आधुनिक, गरिमापूर्ण और प्रसंगानुकूल है; ‘विदेशी’ आधुनिक राष्ट्र-राज्य का अनचाहा भाव ला सकता है।
- source_word: עַד יוֹם אֶחָד לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के पहले दिन तक
  rationale: עַד समय-सीमा या अंतिम बिंदु बताता है। हिंदी में ‘तक’ मूल की संरचना और संभावित समयगत अस्पष्टता को स्वाभाविक रूप से बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखा गया है। ‘मामलों की जाँच’ निकटवर्ती प्रसंग से प्राप्त प्रक्रियात्मक आशय को व्यक्त करता है, जबकि तिथि के लिए मूल का ‘तक’ बनाए रखा गया है।
