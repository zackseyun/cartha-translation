  text: 'और हारीम के वंशजों में से: मासेयाह, एलिय्याह, शमायाह, यहीएल और उज्जियाह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: ו संयोजक है और מִן यहाँ समूह में से चुने गए सदस्यों का भाव देता है। आधुनिक हिन्दी में ‘वंशजों में से’ सूची के पारिवारिक उपसमूह को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: חָרִם
  choice: हारीम
  rationale: यह व्यक्ति अथवा कुल का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: מַעֲשֵׂיָה
  choice: मासेयाह
  rationale: हिब्रू नाम का आधुनिक हिन्दी में उच्चारण-सुलभ लिप्यंतरण।
- source_word: וְ/אֵלִיָּה
  choice: एलियाह
  rationale: नाम को हिब्रू रूप के निकट रखा गया है; पूर्वसर्गीय संयोजक का भाव हिन्दी सूची-विन्यास में निहित है।
- source_word: וּֽ/שְׁמַֽעְיָה
  choice: शमायाह
  rationale: हिब्रू नाम का देवनागरी में निकट और पठनीय लिप्यंतरण।
- source_word: וִ/יחִיאֵל
  choice: यहीएल
  rationale: हिब्रू आरंभिक व्यंजन और स्वरक्रम को दर्शाने वाला हिन्दी लिप्यंतरण।
- source_word: וְ/עֻזִיָּה
  choice: उज्जियाह
  rationale: हिब्रू नाम का प्रचलित, स्पष्ट हिन्दी रूप; अंतिम संयोजक को ‘और’ से व्यक्त किया गया है।
