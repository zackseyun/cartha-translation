  language: hi
  text: 'बानी के वंशजों में से: मादै, अम्राम और ऊएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִ/בְּנֵי
  choice: के वंशजों में से
  rationale: מִן के साथ בְּנֵי यहाँ बड़े कुल के भीतर एक उपसमूह का परिचय देता है। आधुनिक हिन्दी में ‘वंशजों में से’ इसका अंशवाचक अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָנִי
  choice: बानी
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מַעֲדַי
  choice: मादै
  rationale: व्यक्तिवाचक इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: עַמְרָם
  choice: अम्राम
  rationale: व्यक्तिवाचक इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: וְ/אוּאֵל
  choice: और ऊएल
  rationale: וְ को ‘और’ से व्यक्त किया गया है और אוּאֵל को इब्रानी स्वर-रूप के निकट ‘ऊएल’ लिप्यंतरित किया गया है।
