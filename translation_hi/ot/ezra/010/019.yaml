source:
  edition: WLC
  text: וַ/יִּתְּנ֥וּ יָדָ֖/ם לְ/הוֹצִ֣יא נְשֵׁי/הֶ֑ם וַ/אֲשֵׁמִ֥ים אֵֽיל צֹ֖אן עַל אַשְׁמָתָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/019.yaml
  text: They pledged themselves to send away their wives[a], and being guilty[b], they offered a ram from the flock for their guilt.
translation:
  language: hi
  text: उन्होंने अपनी पत्नियों को विदा कर देने की प्रतिज्ञा की[a]; और दोषी होने के कारण, उन्होंने अपने दोष के लिए झुंड में से एक मेढ़ा चढ़ाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उन्होंने अपना हाथ दिया”; यह इब्रानी मुहावरा प्रतिज्ञा करने या बाध्यकारी वचन देने के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: 'इसे अधिक स्पष्ट रूप से इस प्रकार भी समझा जा सकता है: “उन्होंने अपने दोष के लिए दोषबलि के रूप में झुंड का एक मेढ़ा चढ़ाया।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּתְּנוּ יָדָם
  choice: उन्होंने … प्रतिज्ञा की
  rationale: शाब्दिक अर्थ ‘उन्होंने अपना हाथ दिया’ है, पर यह इब्रानी मुहावरा किसी बात के लिए solemn और बाध्यकारी वचन देने को व्यक्त करता है। ‘प्रतिज्ञा की’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ पहुँचाता है।
- source_word: לְהוֹצִיא
  choice: विदा कर देने
  rationale: यह יצא का हिफ़ील रूप है, जिसका अर्थ यहाँ ‘बाहर जाने देना/भेज देना’ है। वैवाहिक संदर्भ में ‘विदा कर देना’ अलग करने की कार्रवाई को स्पष्ट रखता है, बिना मूल से अधिक कानूनी शब्दावली जोड़े।
- source_word: נְשֵׁיהֶם
  choice: अपनी पत्नियों को
  rationale: इस वैवाहिक संदर्भ में נָשִׁים का आशय सामान्यतः ‘स्त्रियाँ’ नहीं, बल्कि ‘पत्नियाँ’ है।
- source_word: וַאֲשֵׁמִים
  choice: और दोषी होने के कारण
  rationale: यह रूप उनकी दोषी अवस्था को व्यक्त करता है। हिन्दी वाक्य में यह अगले बलिदानी कार्य से स्वाभाविक रूप से जुड़ता है।
- source_word: אֵיל צֹאן
  choice: झुंड में से एक मेढ़ा
  rationale: यह बलिदान के पशु के रूप में एक मेढ़े का ठोस उल्लेख है। ‘झुंड में से’ स्वाभाविक आधुनिक हिन्दी है और स्रोत की संज्ञाओं को बनाए रखता है।
- source_word: עַל אַשְׁמָתָם
  choice: अपने दोष के लिए
  rationale: पूर्वसर्ग और संज्ञा मिलकर बताते हैं कि मेढ़ा उनके दोष के कारण चढ़ाया गया। यह अनुवाद संक्षिप्त है और אַשְׁמָה के साथ जुड़े दोष तथा बलिदानी संदर्भ दोनों को खुला रखता है।
theological_decisions:
- issue: क्या मुख्य पाठ में तकनीकी बलिदानी पद ‘दोषबलि’ स्पष्ट रूप से जोड़ा जाए
  choice: मुख्य पाठ में ‘अपने दोष के लिए … एक मेढ़ा चढ़ाया’ रखा गया
  alternative: ‘अपने दोष के लिए दोषबलि के रूप में झुंड का एक मेढ़ा चढ़ाया’
  rationale: इब्रानी में मेढ़े और उनके दोष का स्पष्ट उल्लेख है, किंतु इस उपवाक्य में ‘बलि’ के लिए अलग संज्ञा नहीं है। हिन्दी में बलिदानी क्रिया स्पष्ट करने के लिए ‘चढ़ाया’ आवश्यक रूप से पूरित की गई है; पूरा तकनीकी नाम मुख्य पाठ में जोड़ना स्रोत से कुछ अधिक स्पष्ट करना होता। वैकल्पिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘प्रतिज्ञा’ मुहावरे का अर्थ देती है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है। ‘दोष’ और ‘दोषबलि’ के बीच मूल पाठ में मौजूद बलिदानी संकेत को मुख्य पाठ और पादटिप्पणी के स्तरों पर अलग रखा गया है।
