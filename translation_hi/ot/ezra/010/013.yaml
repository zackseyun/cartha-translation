reference: Ezra 10:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲבָ֞ל הָ/עָ֥ם רָב֙ וְ/הָ/עֵ֣ת גְּשָׁמִ֔ים וְ/אֵ֥ין כֹּ֖חַ לַ/עֲמ֣וֹד בַּ/ח֑וּץ וְ/הַ/מְּלָאכָ֗ה לֹֽא לְ/י֤וֹם אֶחָד֙ וְ/לֹ֣א לִ/שְׁנַ֔יִם כִּֽי הִרְבִּ֥ינוּ לִ/פְשֹׁ֖עַ בַּ/דָּבָ֥ר הַ/זֶּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/013.yaml
  text: But the people are many[a], and it is the rainy season, and there is no strength to stand outside. And the work is not for one day or for two[c][b], for we have greatly transgressed in this matter.
translation:
  language: hi
  text: परन्तु लोग बड़ी संख्या में हैं, और यह वर्षा का समय है[a]; बाहर खड़े रहने की शक्ति नहीं है। यह काम न तो एक दिन का है, न दो दिन का[b], क्योंकि हमने इस मामले में बहुत बड़ा अपराध किया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह वर्षाओं का समय है।”
    reason: lexical_alternative
  - marker: b
    text: या, “यह काम एक-दो दिन में पूरा नहीं हो सकता।”
    reason: lexical_alternative
  - marker: c
    text: या, “हमने इस मामले में बहुत पाप किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲבָל
  choice: परन्तु
  rationale: पिछले पद के प्रस्ताव के साथ स्पष्ट विरोध दिखाता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָעָם רָב
  choice: लोग बड़ी संख्या में हैं
  rationale: सामूहिक संज्ञा के साथ רָב के ‘बहुत/असंख्य’ भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהָעֵת גְּשָׁמִים
  choice: और यह वर्षा का समय है
  rationale: इब्रानी के शाब्दिक भाव ‘वर्षाओं का समय’ को स्वाभाविक हिन्दी में रखता है, बिना वर्षा की तीव्रता बढ़ाए।
- source_word: וְאֵין כֹּחַ לַעֲמֹד בַּחוּץ
  choice: बाहर खड़े रहने की शक्ति नहीं है
  rationale: मूल की निरपेक्ष रचना और वर्षा में बाहर टिके रहने के आशय, दोनों को सुरक्षित रखता है।
- source_word: וְהַמְּלָאכָה
  choice: यह काम
  rationale: यहाँ व्यावहारिक कार्यवाही के लिए व्यापक और सहज शब्द है; केवल शारीरिक श्रम का संकेत नहीं देता।
- source_word: לֹא לְיוֹם אֶחָד וְלֹא לִשְׁנַיִם
  choice: न तो एक दिन का है, न दो दिन का
  rationale: मूल की संरचना और काम में लगने वाली अवधि के भाव को निकटता से बनाए रखता है।
- source_word: כִּי הִרְבִּינוּ לִפְשֹׁעַ
  choice: क्योंकि हमने ... बहुत बड़ा अपराध किया है
  rationale: רבה की तीव्रता और פשע की गंभीर अपराध/उल्लंघन की धारणा को स्वाभाविक हिन्दी में जोड़ता है; इसे ‘हममें से बहुतों ने’ मानकर संख्या में नहीं बदलता।
- source_word: בַּדָּבָר הַזֶּה
  choice: इस मामले में
  rationale: विचाराधीन विषय की ओर संकेत करने वाला स्वाभाविक प्रसंगानुकूल अनुवाद है।
theological_decisions:
- issue: לִפְשֹׁעַ द्वारा बताए गए अपराध का स्वरूप
  choice: बहुत बड़ा अपराध किया है
  alternative: बहुत पाप किया है; बहुत विद्रोह किया है
  rationale: פשע की गंभीरता को बनाए रखते हुए पद में स्पष्ट न की गई किसी संकीर्ण धर्मवैज्ञानिक श्रेणी या राजनीतिक विद्रोह का अर्थ नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। वाक्य-रचना मूल के क्रम के निकट है, पर हिन्दी की स्वाभाविकता के लिए उचित विराम और ‘लोग बड़ी संख्या में हैं’ जैसे प्रयोग अपनाए गए हैं।
