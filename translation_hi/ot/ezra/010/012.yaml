  text: וַ/יַּֽעְנ֧וּ כָֽל הַ/קָּהָ֛ל וַ/יֹּאמְר֖וּ ק֣וֹל גָּד֑וֹל כֵּ֛ן כ/דברי/ך עָלֵ֖י/נוּ לַ/עֲשֽׂוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/012.yaml
  text: Then all the assembly answered and said with a loud voice[a], “Yes, according to your words, so it is upon us to do.”
translation:
  language: hi
  text: तब पूरी सभा ने उत्तर देते हुए ऊँचे स्वर में कहा, “हाँ, आपके कहे अनुसार ऐसा करना हमारा दायित्व है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप में: “हाँ, आपके वचनों के अनुसार ऐसा करना हम पर है।”'
    reason: शाब्दिक विकल्प मूल हिब्रू की ‘हम पर’ वाली दायित्व-सूचक अभिव्यक्ति और ‘आपके वचनों’ के बहुवचन को दिखाता है।
lexical_decisions:
- source_word: וַיַּעֲנוּ ... וַיֹּאמְרוּ
  choice: उत्तर देते हुए ... कहा
  rationale: हिब्रू में उत्तर देने और कहने—दोनों क्रियाएँ हैं। हिंदी में ‘उत्तर देते हुए ... कहा’ दोनों को स्वाभाविक रूप से व्यक्त करता है और अनावश्यक दोहराव से बचता है।
- source_word: כָל הַקָּהָל
  choice: पूरी सभा
  rationale: קָהָל यहाँ एकत्र समुदाय को दर्शाता है। ‘पूरी सभा’ सामूहिकता और כָל के व्यापक अर्थ—दोनों को स्पष्ट रखता है।
- source_word: קוֹל גָּדוֹל
  choice: ऊँचे स्वर में
  rationale: शाब्दिक अर्थ ‘बड़ी आवाज़’ है; आधुनिक हिंदी में ‘ऊँचे स्वर में’ सार्वजनिक और जोरदार उत्तर को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֵּן
  choice: हाँ
  rationale: यहाँ यह एज्रा की बात के प्रति स्पष्ट सहमति प्रकट करता है।
- source_word: כִדְבָרֶיךָ
  choice: आपके कहे अनुसार
  rationale: शाब्दिक ‘आपके वचनों के अनुसार’ का यह वर्तमान हिंदी में स्वाभाविक रूप है और कथन के अनुरूप कार्य करने का भाव बनाए रखता है।
- source_word: עָלֵינוּ לַעֲשׂוֹת
  choice: ऐसा करना हमारा दायित्व है
  rationale: शाब्दिक रूप में कार्य ‘हम पर’ है; संदर्भ में यह स्वीकार किया गया दायित्व व्यक्त करता है। ‘हमारा दायित्व है’ उसी भाव को स्पष्ट, गरिमापूर्ण आधुनिक हिंदी में देता है।
