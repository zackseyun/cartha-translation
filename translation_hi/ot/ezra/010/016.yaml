base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/016.yaml
  text: So the sons of the exile did so. And Ezra the priest set apart men, heads of fathers’ houses according to their fathers’ houses, all of them by name; and they sat down on the first day of the tenth month to investigate the matter.
translation:
  language: hi
  text: तब निर्वासित समुदाय के लोगों ने वैसा ही किया। एज्रा याजक ने पुरुषों को—जो अपने-अपने पितृकुलों के मुखिया थे—अलग नियुक्त किया, और वे सब नाम से दर्ज किए गए थे[a]। वे दसवें महीने के पहले दिन उस मामले की जाँच करने के लिए बैठे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ क्रिया बहुवचन निफ़अल रूप में है और वाक्य-विन्यास कठिन है। इसका अधिक शाब्दिक अर्थ यह भी समझा जा सकता है: “एज्रा याजक और पुरुष अलग हुए/अलग किए गए।” ‘वे सब नाम से’ का अर्थ है कि प्रत्येक व्यक्ति की पहचान नाम से की गई थी।'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי הַגּוֹלָה
  choice: निर्वासन के लोग
  rationale: शाब्दिक रूप से ‘निर्वासन के पुत्र’; यह लौटे हुए निर्वासित समुदाय का सामूहिक पदनाम है। आधुनिक हिन्दी में ‘निर्वासन के लोग’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּבָּדְלוּ
  choice: अलग किया
  rationale: בדל के निफ़अल रूप में अलग होने या अलग किए जाने का भाव है। वाक्य-विन्यास कुछ असामान्य है, पर प्रसंग में एज्रा द्वारा जाँच के लिए प्रतिनिधियों को अलग किए जाने का अर्थ उपयुक्त है; चयन का भाव अगले पदबंध में स्पष्ट किया गया है।
- source_word: אֲנָשִׁים רָאשֵׁי הָאָבוֹת לְבֵית אֲבֹתָם
  choice: पितृकुलों के मुखियाओं में से पुरुषों को उनके पितृकुलों के अनुसार
  rationale: אֲנָשִׁים पुरुषों को स्पष्ट रखता है और ‘पितृकुल’ प्राचीन पैतृक कुल/घराने की सामाजिक इकाई को केवल ‘परिवार’ कहने से अधिक ठीक व्यक्त करता है।
- source_word: וְכֻלָּם בְּשֵׁמוֹת
  choice: उन सबको नाम से चुना गया
  rationale: यह प्रत्येक प्रतिनिधि की व्यक्तिगत पहचान या नामांकन दर्शाता है। हिन्दी में केवल ‘सब नामों से’ अस्पष्ट होता, इसलिए निहित चयन/नामांकन को स्वाभाविक रूप दिया गया है।
- source_word: וַיֵּשְׁבוּ
  choice: वे ... बैठे
  rationale: ישב का मूल अर्थ ‘बैठना’ है; यहाँ अधिकारी जाँच आरम्भ करने के लिए विधिवत बैठे।
- source_word: לְדַרְיוֹשׁ הַדָּבָר
  choice: उस मामले की जाँच करने के लिए
  rationale: דרש यहाँ किसी विषय की खोजबीन या जाँच-पड़ताल करने का प्रशासनिक अर्थ देता है।
theological_decisions:
- issue: וַיִּבָּדְלוּ का कर्ता और वाच्य
  choice: एज्रा ने ... पुरुषों को ... अलग किया
  alternative: एज्रा याजक और पुरुष ... अलग हो गए
  rationale: मसोरेटिक स्वरांकन का बहुवचन निफ़अल रूप अधिक शाब्दिक रूप से ‘अलग हो गए/अलग किए गए’ हो सकता है, जबकि עֶזְרָא एकवचन के कारण वाक्य-विन्यास कठिन है। प्रसंग और प्राचीन अनुवाद-परंपरा प्रतिनिधियों को अलग नियुक्त करने की दिशा दिखाती है, पर वास्तविक भाषिक अनिश्चितता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘पितृकुल’ को प्राचीन पैतृक घराने/कुल की सामाजिक इकाई बनाए रखने के लिए चुना गया है।
