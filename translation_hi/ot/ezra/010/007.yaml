- source_word: לְכֹל בְּנֵי הַגּוֹלָה
  choice: निर्वासन से लौटे सभी लोगों
  rationale: शाब्दिक रूप ‘निर्वासन के पुत्र’ है, पर एज्रा के संदर्भ में यह निर्वासन से लौटे समुदाय का प्रचलित पद है। ‘लोगों’ में पूरे समुदाय का समावेश स्वाभाविक रूप से होता है और हिन्दी में कृत्रिम लैंगिक संकीर्णता से बचता है।
- source_word: לְהִקָּבֵץ
  choice: कि वे ... इकट्ठे हों
  rationale: ל सहित निफ़अल infinitive घोषणा की विषय-वस्तु अथवा उद्देश्य बताता है; यह रचना हिन्दी में बुलावे का भाव स्पष्ट करती है।
- source_word: יְרוּשָׁלָם
  choice: यरूशलेम में
  rationale: इकट्ठा होने के स्थान के रूप में नगर को व्यक्त करने के लिए हिन्दी में ‘यरूशलेम में’ स्वाभाविक है।
