- source_word: וַיַּעֲבִירוּ קוֹל
  choice: उन्होंने ... घोषणा करवाई
  rationale: העביר קול एक मुहावरा है जिसका अर्थ किसी सूचना को सार्वजनिक रूप से प्रसारित कराना है। ‘घोषणा करवाई’ उसके कारणवाचक भाव और प्रशासनिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּיהוּדָה וִירוּשָׁלַם
  choice: यहूदा और यरूशलेम में
