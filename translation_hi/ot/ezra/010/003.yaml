id: EZR.10.3
reference: Ezra 10:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה נִֽכְרָת בְּרִ֣ית לֵ֠/אלֹהֵי/נוּ לְ/הוֹצִ֨יא כָל נָשִׁ֜ים וְ/הַ/נּוֹלָ֤ד מֵ/הֶם֙ בַּ/עֲצַ֣ת אֲדֹנָ֔/י וְ/הַ/חֲרֵדִ֖ים בְּ/מִצְוַ֣ת אֱלֹהֵ֑י/נוּ וְ/כַ/תּוֹרָ֖ה יֵעָשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/003.yaml
  text: So now let us make a covenant with our God to send away all the women and what has been born from them, according to the counsel of my lord and of those who tremble at the commandment of our God; and let it be done according to the law.
translation:
  language: hi
  text: इसलिए अब हम अपने परमेश्वर के साथ वाचा बाँधें कि हम उन सभी स्त्रियों और उनसे जन्मे बच्चों को मेरे स्वामी और हमारे परमेश्वर की आज्ञा से थरथराने वालों की सलाह के अनुसार विदा कर दें; और यह व्यवस्था के अनुसार किया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נִכְרָת בְּרִית
  choice: वाचा बाँधें
  rationale: इब्रानी मुहावरे का अर्थ वाचा स्थापित करना है; हिन्दी में ‘वाचा बाँधना’ गरिमापूर्ण और अपेक्षाकृत निकट अभिव्यक्ति है।
- source_word: לְהוֹצִיא
  choice: विदा कर दें
  rationale: मूल क्रिया का अर्थ बाहर निकालना अथवा भेज देना है। संदर्भ में पत्नियों को अलग करके भेजना अभिप्रेत है; ‘विदा कर दें’ इसे स्पष्ट रखता है, बिना अनावश्यक कठोरता जोड़े।
- source_word: כָל נָשִׁים
  choice: उन सभी स्त्रियों
  rationale: शाब्दिक रूप से ‘सभी स्त्रियाँ’; प्रसंग से निर्दिष्ट विदेशी स्त्रियाँ अभिप्रेत हैं। ‘उन’ संदर्भसूचक है, जबकि मूल पद में न आया ‘पत्नियाँ’ पाठ में नहीं जोड़ा गया।
- source_word: וְהַנּוֹלָד מֵהֶם
  choice: और उनसे जन्मे बच्चों
  rationale: मूल में एकवचन सामूहिक ‘जो जन्मा है’ है; स्वाभाविक हिन्दी में सामूहिक आशय ‘जन्मे बच्चों’ से व्यक्त होता है।
- source_word: בַּעֲצַת אֲדֹנָי
  choice: अपने स्वामी ... की सलाह के अनुसार
  rationale: मसोरेटिक स्वरांकन אֲדֹנָי सामान्यतः ‘प्रभु’ दर्शाता है, पर प्रत्यययुक्त वाक्यगत अर्थ ‘मेरे स्वामी’ भी संभव और अंग्रेज़ी परामर्श-पाठ में स्वीकृत है। हिन्दी वाक्य में वक्ता-समुदाय के दृष्टिकोण से ‘अपने स्वामी’ स्वाभाविक है और परमेश्वर के लिए प्रयुक्त अगले पद से इसे अलग रखता है।
- source_word: הַחֲרֵדִים בְּמִצְוַת
  choice: जो ... आज्ञा से थरथराते हैं
  rationale: ‘थरथराना’ मूल חרד की तीव्र श्रद्धामिश्रित भय-प्रतिक्रिया को ‘मानने वाले’ की अपेक्षा अधिक प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: וְכַתּוֹרָה יֵעָשֶׂה
  choice: और यह व्यवस्था के अनुसार किया जाए
  rationale: נिपעל/निष्क्रिय भाव और תורה के नियामक अर्थ दोनों सुरक्षित हैं।
theological_decisions:
- issue: ‘मेरे स्वामी’ की पहचान
  choice: अपने स्वामी
  alternative: प्रभु
  rationale: मूल रूप संदर्भगत तनाव रखता है और संभवतः एज्रा जैसे मानवीय अगुवे को संबोधित करता है। इसे सीधे परमेश्वर का पदनाम बनाना अगले ‘हमारे परमेश्वर’ के साथ पहचान को अनावश्यक रूप से निश्चित कर देगा।
- issue: स्त्रियों और बच्चों को भेजने की प्रस्तावित कार्रवाई
  choice: वक्ता के प्रस्ताव के रूप में सीधा अनुवाद
  alternative: नैतिक अनुमोदन अथवा निंदा जोड़ना
  rationale: पद प्रस्ताव का वर्णन करता है; अनुवाद न तो उसे स्वतः परमेश्वर की सार्वकालिक आज्ञा घोषित करता है, न पाठ में अनुपस्थित नैतिक टिप्पणी जोड़ता है।
- issue: ‘व्यवस्था’ का आशय
  choice: व्यवस्था
  alternative: रीति/निर्देश
  rationale: תּוֹרָה यहाँ विधि अथवा धार्मिक व्यवस्था का संकेत देती है। ‘व्यवस्था’ पारंपरिक और सामान्यतः समझने योग्य है, पर यह पद स्वयं किसी विशिष्ट तोराही अनुच्छेद की पहचान नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। वाक्य की प्रस्तावात्मक और विधिक गंभीरता बनाए रखी गई है। कोई फुटनोट आवश्यक नहीं समझा गया।
