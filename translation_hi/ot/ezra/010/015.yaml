source:
  edition: WLC
  text: אַ֣ךְ יוֹנָתָ֧ן בֶּן עֲשָׂהאֵ֛ל וְ/יַחְזְיָ֥ה בֶן תִּקְוָ֖ה עָמְד֣וּ עַל זֹ֑את וּ/מְשֻׁלָּ֛ם וְ/שַׁבְּתַ֥י הַ/לֵּוִ֖י עֲזָרֻֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/015.yaml
  text: Only Jonathan son of Asahel and Jahzeiah son of Tikvah stood against this[b][a], and Meshullam and Shabbethai the Levite supported them.
translation:
  language: hi
  text: केवल असाहेल के पुत्र योनातान और तिकवा के पुत्र यहज्याह[a] ने इसका विरोध किया, और मशुल्लाम तथा लेवीय शब्बतै ने उनका साथ दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहज़ियाह’।
    reason: नाम के वैकल्पिक लिप्यंतरण को सुरक्षित रखना।
  - marker: b
    text: या ‘उनकी सहायता की’ अथवा ‘उनकी मदद की’।
    reason: עֲזָרֻם के अधिक शाब्दिक अनुवाद देना।
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ यह शब्द पिछले पद में व्यक्त व्यापक सहमति के अपवाद को सीमित करता है; इसलिए ‘केवल’ इसका स्वाभाविक और स्पष्ट अनुवाद है।
- source_word: יוֹנָתָן בֶּן עֲשָׂהאֵל
  choice: असाहेल के पुत्र योनातान
  rationale: नामों को स्रोत के अनुसार देवनागरी में लिप्यंतरित किया गया है और בֶּן को स्वाभाविक हिन्दी वंश-सूचक रचना ‘के पुत्र’ से व्यक्त किया गया है।
- source_word: יַחְזְיָה בֶן תִּקְוָה
  choice: तिकवा के पुत्र यहज्याह
  rationale: व्यंजनात्मक इब्रानी रूप के निकट हिन्दी लिप्यंतरण अपनाया गया है; वैकल्पिक प्रचलित लिप्यंतरण को पादटिप्पणी में रखा गया है।
- source_word: עָמְדוּ עַל זֹאת
  choice: इसका विरोध किया
  rationale: संदर्भ में यह मुहावरा पिछले पद के प्रस्ताव के विरुद्ध खड़े होने का भाव देता है। हिन्दी में ‘इसका विरोध किया’ वही अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, यद्यपि मूल अभिव्यक्ति में ‘इस विषय पर डटे रहने’ का अधिक शाब्दिक बिंब भी संभव है।
- source_word: וּמְשֻׁלָּם וְשַׁבְּתַי הַלֵּוִי
  choice: और मशुल्लाम तथा लेवी शब्बतै
  rationale: इब्रानी क्रम और निश्चित पद הַלֵּוִי के निकटतम संबंध के अनुसार ‘लेवी’ केवल शब्बतै का परिचय देता है, दोनों व्यक्तियों का नहीं।
- source_word: עֲזָרֻם
  choice: उनका साथ दिया
  rationale: עזר का मूल अर्थ सहायता करना है। यहाँ उन दो व्यक्तियों के रुख का समर्थन करने के प्रक्रियात्मक संदर्भ में ‘उनका साथ दिया’ स्वाभाविक हिन्दी है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: עָמְדוּ עַל זֹאת से व्यक्त रुख
  choice: इसका विरोध किया
  alternative: इस मामले के संबंध में डटे रहे
  rationale: पिछले पद में सभा द्वारा स्वीकार की गई कार्यवाही के संदर्भ में विरोध का अर्थ सबसे संभावित है; फिर भी यह निर्णय किसी धार्मिक पक्ष को आरोपित करने के बजाय प्रसंग और इब्रानी मुहावरे पर आधारित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य में अपवाद, विरोध और समर्थन का संबंध स्पष्ट है; नाम स्रोत-पाठ के निकट देवनागरी में दिए गए हैं।
