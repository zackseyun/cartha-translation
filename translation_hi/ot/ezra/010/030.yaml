  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। ‘पुत्रों’ के बजाय ‘वंशजों’ का प्रयोग किया गया है, क्योंकि यहाँ בְּנֵי एक कुल/परिवार समूह के सदस्यों को सूचित करता है। व्यक्तिनाम और कुलनाम अनूदित नहीं, देवनागरी में लिप्यंतरित हैं।
