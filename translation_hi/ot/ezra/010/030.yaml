base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/030.yaml
  text: 'And from the sons of Pahath-moab: Adna, Chelal, Benaiah, Maaseiah, Mattaniah, Bezalel, Binnui, and Manasseh.'
translation:
  language: hi
  text: 'और पहत-मोआब के पुत्रों में से: अदना, केलाल, बनायाह, मासेयाह, मत्तन्याह, बसलेल, बिन्नूई और मनश्शे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: सूची की पिछली कड़ी से संबंध के लिए וּ को ‘और’, מִן को ‘में से’, और בְּנֵי को इस कुल-सूची के संदर्भ में स्वाभाविक आधुनिक हिन्दी ‘वंशजों’ से व्यक्त किया गया है।
- source_word: פַּחַת מוֹאָב
  choice: पहत-मोआब
  rationale: यह कुल का संयुक्त नाम है; इसका अनुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है और दोनों घटकों का संबंध दिखाने के लिए योजक-चिह्न रखा गया है।
- source_word: עַדְנָא
  choice: अदना
  rationale: हिब्रू नाम का देवनागरी में निकट लिप्यंतरण।
- source_word: וּ/כְלָל
  choice: कलाल
  rationale: आरंभिक כ को ‘क’ से और स्वर-क्रम को हिब्रू पाठ के निकट रखा गया है; उपसर्ग וּ सूची में संयोजक है, पर हिन्दी में प्रत्येक नाम से पहले ‘और’ देना अस्वाभाविक होने के कारण उसे विराम-चिह्नों द्वारा व्यक्त किया गया है।
- source_word: בְּנָיָה
  choice: बनायाह
  rationale: हिब्रू स्वरांकन और अंतिम याहू-तत्व के संक्षिप्त रूप को ध्यान में रखकर देवनागरी लिप्यंतरण।
- source_word: מַעֲשֵׂיָה
  choice: मासेयाह
  rationale: नाम को हिब्रू ध्वनि-रूप के निकट और हिन्दी पाठकों के लिए पठनीय ढंग से लिप्यंतरित किया गया है।
- source_word: מַתַּנְיָה
  choice: मत्तन्याह
  rationale: द्वित्वित תּ को ‘त्त’ और अंतिम יָה को ‘याह’ से दर्शाया गया है।
- source_word: בְצַלְאֵל
  choice: बसलेल
  rationale: हिब्रू בְּצַלְאֵל का हिन्दी में प्रचलित और सुबोध बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: וּ/בִנּוּי
  choice: बिन्नूई
  rationale: द्वित्वित נּ को ‘न्न’ तथा अंतिम וּי को ‘ूई’ से दर्शाकर हिब्रू स्वरांकन के निकट लिप्यंतरण किया गया है।
- source_word: וּ/מְנַשֶּׁה
  choice: और मनश्शे
  rationale: अंतिम नाम से पहले संयोजक וּ को स्पष्ट ‘और’ से व्यक्त किया गया है; שּׁ का द्वित्व ‘श्श’ में सुरक्षित रखा गया है।
