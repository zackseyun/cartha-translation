base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/001.yaml
  text: While Ezra was praying and making confession[a], weeping and falling down before the house of God, a very large assembly from Israel gathered to him—men, women, and children—for the people wept bitterly.
translation:
  language: hi
  text: जब एज्रा प्रार्थना और अंगीकार कर रहा था, रो रहा था और परमेश्वर के भवन के सामने अपने को गिरा रहा था, तब इस्राएल में से पुरुषों, स्त्रियों और बच्चों की एक बहुत बड़ी सभा उसके पास इकट्ठी हो गई, क्योंकि लोग बहुत रो रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְהִתְפַּלֵּל עֶזְרָא וּכְהִתְוַדֹּתוֹ
  choice: जब एज्रा प्रार्थना और पापों को स्वीकार कर रहा था
  rationale: כְּ के साथ दोनों क्रियात्मक रूप समकालीन पृष्ठभूमि की क्रिया बताते हैं। हिन्दी का ‘जब ... कर रहा था’ इसे स्वाभाविक ढंग से व्यक्त करता है। התודה यहाँ पश्चात्तापपूर्वक पाप स्वीकार करने का भाव रखता है; ‘पापों को’ संदर्भगत पूरक है।
- source_word: בֹּכֶה וּמִתְנַפֵּל
  choice: रोते हुए मुँह के बल पड़ा था
  rationale: दोनों रूप एज्रा की जारी अवस्था बताते हैं। מתנפל का भाव अपने को भूमि पर गिरा देने का है; ‘मुँह के बल पड़ा’ उपासना और विनती की शारीरिक मुद्रा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵי בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के सामने
  rationale: ‘परमेश्वर का भवन’ मूल अभिव्यक्ति को बनाए रखता है और प्रसंग में मन्दिर को सूचित करता है, बिना उसे सीधे प्रतिस्थापित किए।
- source_word: נִקְבְּצוּ אֵלָיו מִיִּשְׂרָאֵל
  choice: इस्राएल में से ... उसके पास इकट्ठी हो गई
  rationale: מִן समुदाय में से आए लोगों को दर्शाता है और אֶל दिशा को; हिन्दी में ‘इस्राएल में से’ तथा ‘उसके पास’ दोनों संबंध सुरक्षित रखते हैं।
- source_word: קָהָל רַב מְאֹד
  choice: एक बहुत बड़ी सभा
  rationale: קהל एकत्र जनसमूह है और רַב מְאֹד उसके बड़े आकार पर बल देता है। ‘सभा’ स्पष्ट और गैर-सांप्रदायिक है।
- source_word: אֲנָשִׁים וְנָשִׁים וִילָדִים
  choice: पुरुषों, स्त्रियों और बच्चों की
  rationale: मूल में उपस्थित तीनों वर्गों को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: כִּי בָכוּ הָעָם הַרְבֵּה בֶכֶה
  choice: क्योंकि लोग फूट-फूटकर रो रहे थे
  rationale: כִּי कारण बताता है। הַרְבֵּה בֶכֶה तीव्र और बहुत रोने की जोरदार इब्रानी अभिव्यक्ति है; ‘फूट-फूटकर’ हिन्दी में उसी तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: एज्रा के अंगीकार का विषय
  choice: पापों को स्वीकार कर रहा था
  alternative: अंगीकार कर रहा था
  rationale: क्रिया पश्चात्तापपूर्ण confession को दर्शाती है। हिन्दी में अकेला ‘अंगीकार’ अस्पष्ट हो सकता है; संदर्भानुसार ‘पापों को स्वीकार’ अर्थ स्पष्ट करता है, पर यह तय नहीं करता कि वे केवल एज्रा के निजी पाप थे या समुदाय के पाप।
- issue: מתנפל में शारीरिक मुद्रा की तीव्रता
  choice: मुँह के बल पड़ा था
  alternative: गिरा हुआ था
  rationale: रूप स्वयं को नीचे डालने की विनतीपूर्ण मुद्रा सूचित करता है। चुना हुआ वाक्यांश इसे स्पष्ट करता है, यद्यपि मूल में ‘मुँह’ शब्द प्रत्यक्षतः नहीं है; इसलिए पूर्ण दण्डवत जैसी अधिक विशिष्ट धार्मिक मुद्रा नहीं कही गई।
translation_notes:
  register: आधुनिक मानक हिन्दी; गम्भीर किंतु साधारण पाठक के लिए सहज। वाक्य की समकालीन क्रियाएँ और कारणसूचक संबंध बनाए गए हैं। ‘परमेश्वर का भवन’ मूल की धार्मिक छवि को सुरक्षित रखता है।
