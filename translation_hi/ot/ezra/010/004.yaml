  text: Rise up[a], for this matter is on you, and we are with you. Be strong and do it.
translation:
  language: hi
  text: उठो[a], क्योंकि इस मामले की ज़िम्मेदारी तुम पर है, और हम तुम्हारे साथ हैं। हिम्मत रखो और इसे करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उठ खड़े हो”; यहाँ आशय तुरंत आगे बढ़कर ज़िम्मेदारी सँभालने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קוּם
  choice: उठो
  rationale: एकवचन आज्ञार्थक क्रिया तत्काल आगे बढ़कर कार्य करने का आह्वान करती है; ‘उठो’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले आदेश का कारण प्रस्तुत करता है; हिंदी में ‘क्योंकि’ इस संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָלֶיךָ הַדָּבָר
  choice: इस मामले की ज़िम्मेदारी तुम पर है
  rationale: על + व्यक्ति वाला इब्रानी मुहावरा किसी पर दायित्व होने का भाव देता है। यह अनुवाद उस रूपक और आशय दोनों को सहज हिंदी में बनाए रखता है।
- source_word: וַאֲנַחְנוּ עִמָּךְ
  choice: और हम तुम्हारे साथ हैं
  rationale: यह एकजुटता और सहयोग का सीधा आश्वासन है; ‘तुम्हारे साथ’ इसका स्वाभाविक हिंदी रूप है।
- source_word: חֲזַק
  choice: हिम्मत बाँधो
  rationale: इस प्रोत्साहनात्मक संदर्भ में आज्ञार्थक חזק दृढ़ और साहसी होने का आह्वान करता है। ‘हिम्मत बाँधो’ आधुनिक हिंदी में कार्य के लिए साहस जुटाने का स्वाभाविक निर्देश है।
- source_word: וַעֲשֵׂה
  choice: और इसे पूरा करो
  rationale: עשה ठोस कार्रवाई का आदेश देता है। ‘इसे’ का संकेत पहले आए मामले की ओर है, और ‘पूरा करो’ केवल आरंभ करने के बजाय सौंपे गए काम को अंजाम देने का भाव व्यक्त करता है।
