  text: 'And from the sons of Pashhur: Elioenai, Maaseiah, Ishmael, Nethanel, Jozabad, and Elasah.'
translation:
  language: hi
  text: 'और पशहूर के वंशजों में से: एलियोएनै, मासेयाह, इश्माएल, नतनएल, योजाबाद और एलासाह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के वंशजों में से
  rationale: संयोजक वाव, संबंधसूचक מִן और בְּנֵי मिलकर सूची में एक और वंश-समूह के कुछ सदस्यों का परिचय देते हैं। हिंदी में यह रूप संयोजक और अंशवाचक दोनों अर्थ स्वाभाविक ढंग से रखता है।
- source_word: פַּשְׁחוּר
  choice: पशहूर
  rationale: व्यक्तिगत अथवा कुलनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶלְיוֹעֵינַי
  choice: एल्योएनै
  rationale: व्यक्तिनाम का हिब्रू-आधारित, हिंदी में उच्चारण-सुलभ लिप्यंतरण।
- source_word: מַעֲשֵׂיָה
  choice: मासेयाह
  rationale: व्यक्तिनाम को उसके हिब्रू स्वरूप के निकट लिप्यंतरित किया गया है; अंतिम יה को 'याह' से दर्शाया गया है।
- source_word: יִשְׁמָעֵאל
  choice: इश्माएल
  rationale: व्यक्तिनाम का हिब्रू-आधारित देवनागरी लिप्यंतरण, जो हिंदी पाठकों के लिए भी सुगम है।
- source_word: נְתַנְאֵל
  choice: नतनेल
  rationale: व्यक्तिनाम का हिब्रू ध्वनियों के निकट संक्षिप्त और पठनीय लिप्यंतरण।
- source_word: יוֹזָבָד
  choice: योजाबाद
  rationale: आरंभिक हिब्रू yod को 'य' से और नाम के शेष भाग को ध्वन्यात्मक रूप से लिप्यंतरित किया गया है।
- source_word: וְ/אֶלְעָשָׂה
  choice: और एलासा
  rationale: उपसर्ग וְ का अर्थ 'और' स्पष्ट रखा गया है तथा नाम को हिब्रू उच्चारण के निकट लिप्यंतरित किया गया है।
