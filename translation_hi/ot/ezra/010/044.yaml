lexical_decisions:
- source_word: נשא/י נָשִׁים נָכְרִיּוֹת
  choice: विदेशी स्त्रियों से विवाह किया था
  rationale: स्त्रियों को ‘लेने’ का इब्रानी मुहावरा इस संदर्भ में विवाह करने का अर्थ देता है। ‘विदेशी स्त्रियाँ’ जातीय और वाचा-समुदाय से बाहर होने का भाव रखता है, बिना अनावश्यक रूप से अपमानजनक शब्दावली अपनाए।
- source_word: וְיֵשׁ מֵהֶם
  choice: और उनमें से कुछ
  rationale: अस्तित्वसूचक יֵשׁ और מֵהֶם का स्वाभाविक हिन्दी रूप ‘उनमें से कुछ’ है।
- source_word: נָשִׁים
  choice: पत्नियों
  rationale: यहाँ वैवाहिक संबंध और उनसे उत्पन्न संतान की बात होने के कारण ‘स्त्रियों’ के बजाय ‘पत्नियों’ अधिक स्पष्ट और स्वाभाविक है।
- source_word: וַיָּשִׂימוּ בָּנִים
  choice: से बच्चे भी हुए थे
  rationale: इब्रानी पदबंध संक्षिप्त और कठिन है; उसका शब्दशः रूप हिन्दी में अस्पष्ट होगा। संदर्भ में आशय यह है कि कुछ विवाहों से संतान हुई थी।
- source_word: בָּנִים
  choice: बच्चे
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर संदर्भ में यह संतान के व्यापक अर्थ में प्रयुक्त हो सकता है। शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
