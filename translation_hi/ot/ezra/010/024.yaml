lexical_decisions:
- source_word: וּמִן
  choice: और ... में से
  rationale: संयोजक वाव और מִן सूची में एक और वर्ग जोड़ते हैं; हिन्दी में ‘और ... में से’ इस योगात्मक तथा चयनसूचक संरचना को स्वाभाविक रूप से बनाए रखता है।
- source_word: הַמְשֹׁרְרִים
  choice: गायकों
  rationale: שׁיר से बना यह रूप मन्दिर-उपासना में गाने की सेवा करने वालों को सूचित करता है; ‘गायक’ स्पष्ट और प्रचलित पद है।
- source_word: אֶלְיָשִׁיב
  choice: एल्याशीब
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הַשֹּׁעֲרִים
  choice: द्वारपालों
  rationale: मन्दिर के द्वारों की देखरेख और पहरे की जिम्मेदारी निभाने वालों के लिए ‘द्वारपाल’ सटीक, संक्षिप्त और स्वाभाविक हिन्दी शब्द है।
- source_word: שַׁלֻּם
  choice: शल्लूम
  rationale: इब्रानी व्यंजन-द्वित्व और दीर्घ स्वर को यथासंभव दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: טֶלֶם
  choice: तेलेम
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אוּרִי
  choice: ऊरी
  rationale: इब्रानी दीर्घ ऊ स्वर को दर्शाने वाला देवनागरी लिप्यंतरण।
