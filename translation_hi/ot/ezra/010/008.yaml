  text: וְ/כֹל֩ אֲשֶׁ֨ר לֹֽא יָב֜וֹא לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים כַּ/עֲצַ֤ת הַ/שָּׂרִים֙ וְ/הַ/זְּקֵנִ֔ים יָחֳרַ֖ם כָּל רְכוּשׁ֑/וֹ וְ/ה֥וּא יִבָּדֵ֖ל מִ/קְּהַ֥ל הַ/גּוֹלָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/008.yaml
  text: And everyone who does not come within three days[a], according to the counsel of the officials and the elders, all his property shall be forfeited, and he himself shall be separated from the assembly of the exiles.
translation:
  language: hi
  text: और जो कोई तीन दिनों के भीतर नहीं आएगा, अधिकारियों और बुज़ुर्गों की सलाह के अनुसार उसकी सारी संपत्ति विनाश के लिए समर्पित कर दी जाएगी[a], और वह स्वयं निर्वासितों की सभा से अलग कर दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब्त कर ली जाएगी” अथवा “प्रतिबंध के अधीन कर दी जाएगी।” इब्रानी क्रिया חרם किसी वस्तु को हेरम, अर्थात प्रतिबंध के अधीन समर्पित करने, को दर्शाती है; इसमें विनाश या जब्ती का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר לֹא יָבוֹא
  choice: और जो कोई ... नहीं आएगा
  rationale: यह सामान्य शर्त व्यक्त करता है; ‘जो कोई’ वितरणात्मक अर्थ को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: तीन दिनों के भीतर
  rationale: वाक्यांश बुलावे का पालन करने की समय-सीमा बताता है।
- source_word: כַּעֲצַת הַשָּׂרִים וְהַזְּקֵנִים
  choice: अधिकारियों और पुरनियों के निर्णय के अनुसार
  rationale: עֵצָה का अर्थ परामर्श या निर्णय हो सकता है; इस प्रशासनिक प्रसंग में ‘निर्णय’ उसके प्राधिकारिक स्वरूप को स्पष्ट करता है। שׂרים के लिए ‘अधिकारी’ और זקנים के लिए प्रचलित बाइबलीय पद ‘पुरनिए’ रखा गया है।
- source_word: יָחֳרַם כָּל רְכוּשׁוֹ
  choice: उसकी सारी संपत्ति ... विनाश के लिए अर्पित कर दी जाएगी
  rationale: חרם के तकनीकी अर्थ—प्रतिबंध के अधीन अपरिवर्तनीय रूप से समर्पित करना, प्रायः विनाश के लिए—को बनाए रखता है; संपत्ति के प्रसंग में इसका व्यावहारिक अर्थ जब्ती भी हो सकता है।
- source_word: וְהוּא יִבָּדֵל
  choice: और वह स्वयं ... अलग कर दिया जाएगा
  rationale: स्पष्ट सर्वनाम का बल बनाए रखते हुए בדל के निफ़अल रूप का सीधा अर्थ देता है और बाद की संस्थागत शब्दावली नहीं थोपता।
- source_word: מִקְּהַל הַגּוֹלָה
  choice: निर्वासितों की सभा से
  rationale: קהל को गैर-सांप्रदायिक ‘सभा’ और הגולה को सीधे ‘निर्वासितों’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: संपत्ति पर חרם दंड का अर्थ
  choice: मुख्य पाठ में ‘विनाश के लिए अर्पित कर दी जाएगी’
  alternative: ‘जब्त कर ली जाएगी’ या ‘प्रतिबंध के अधीन कर दी जाएगी’
  rationale: मूल क्रिया केवल आधुनिक कानूनी जब्ती नहीं, बल्कि प्रतिबंध/समर्पण का गंभीर तकनीकी भाव रखती है। मुख्य पाठ उस भार को बचाता है और पादटिप्पणी प्रसंगगत जब्ती की संभावना बताती है।
- issue: समुदाय से अलग किए जाने का स्वरूप
  choice: ‘सभा से अलग कर दिया जाएगा’
  alternative: ‘सभा से निकाल दिया जाएगा’ या ‘बहिष्कृत किया जाएगा’
  rationale: मूल पाठ अलगाव बताता है, पर बाद की कलीसियाई या संस्थागत श्रेणी निर्दिष्ट नहीं करता; इसलिए अधिक व्याख्यात्मक ‘बहिष्कृत’ से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कानूनी-ऐतिहासिक शैली। ‘पुरनियों’ बाइबलीय संदर्भ में परिचित है; वाक्यक्रम को हिन्दी में स्वाभाविक बनाने के लिए निर्णय-संबंधी पदबंध को दंड-विधान के साथ रखा गया है।
