base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/023.yaml
  text: 'And from the Levites: Jozabad[a], Shimei, Keliah (that is, Kelita), Pethahiah, Judah, and Eliezer.'
translation:
  language: hi
  text: 'और लेवियों में से: योजाबाद, शिमी, केलाया (अर्थात् केलीता)[a], पतह्याह, यहूदा और एलीएजेर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “केलाया, वही केलीता”; केलीता उसी व्यक्ति के नाम का दूसरा रूप या वैकल्पिक नाम है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: और लेवियों में से
  rationale: यह पद बड़ी सूची के भीतर लेवियों के एक समूह को प्रस्तुत करता है; ‘में से’ מִן के अंशसूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יוֹזָבָד
  choice: योजाबाद
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְשִׁמְעִי
  choice: शिमी
  rationale: इब्रानी व्यक्तिगत नाम का निकट और सुबोध हिन्दी लिप्यंतरण।
- source_word: וְקֵלָיָה הוּא קְלִיטָא
  choice: केलाया (अर्थात् कलीता)[a]
  rationale: הוּא यहाँ दोनों नामरूपों को एक ही व्यक्ति से जोड़ता है; ‘अर्थात्’ इस व्याख्यात्मक संबंध को स्पष्ट करता है, पर यह तय नहीं करता कि दूसरा रूप उपनाम था या वैकल्पिक नाम।
- source_word: פְּתַחְיָה
  choice: पतह्याह
  rationale: नाम के इब्रानी व्यंजनों और याह-तत्त्व को यथासंभव सुरक्षित रखने वाला हिन्दी लिप्यंतरण।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: संदर्भ में यह किसी व्यक्ति का नाम है; मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: וֶאֱלִיעֶזֶר
  choice: और एलीएजेर
  rationale: इब्रानी स्वरांकन אֱלִיעֶזֶר के अनुरूप नाम को एलीएजेर लिखा गया है और अंतिम संयोजक וְ को ‘और’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और सूची के अनुरूप गरिमापूर्ण रखी गई है। नामों को मूल इब्रानी के निकट देवनागरी में लिप्यंतरित किया गया है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘Jozabad’ के बाद था, किंतु उसकी टिप्पणी स्पष्टतः ‘Keliah/Kelita’ से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न संबंधित पदबंध के बाद रखा गया है।
