  text: וַ/יַּעַן֩ שְׁכַנְיָ֨ה בֶן יְחִיאֵ֜ל מִ/בְּנֵ֤י עולם וַ/יֹּ֣אמֶר לְ/עֶזְרָ֔א אֲנַ֨חְנוּ֙ מָעַ֣לְנוּ בֵ/אלֹהֵ֔י/נוּ וַ/נֹּ֛שֶׁב נָשִׁ֥ים נָכְרִיּ֖וֹת מֵ/עַמֵּ֣י הָ/אָ֑רֶץ וְ/עַתָּ֛ה יֵשׁ מִקְוֶ֥ה לְ/יִשְׂרָאֵ֖ל עַל זֹֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/002.yaml
  text: Then Shecaniah son of Jehiel[a], from the sons of Elam, answered and said to Ezra, “We have acted unfaithfully against our God and have married foreign women from the peoples of the land[c][b]. Yet now there is hope for Israel concerning this.
translation:
  language: hi
  text: तब एलाम के वंशजों में से यहीएल के पुत्र शकन्याह ने एज्रा से कहा, “हम अपने परमेश्वर के प्रति विश्वासघाती हुए हैं और हमने इस देश के लोगों में से परदेशी स्त्रियों को पत्नी बना लिया है। फिर भी इस मामले में इस्राएल के लिए अब आशा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: ने ... कहा
  rationale: हिब्रू का दोहरा वाक्-सूत्र शाब्दिक रूप से ‘उत्तर दिया और कहा’ है, पर इस प्रसंग में आधुनिक हिन्दी में केवल ‘कहा’ स्वाभाविक और अर्थपूर्ण है।
- source_word: שְׁכַנְיָה בֶן יְחִיאֵל
  choice: यहीएल के पुत्र शकन्याह
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण करते हुए पुत्र-संबंध को स्पष्ट रखा गया है।
- source_word: מִבְּנֵי עוֹלָם
  choice: एलाम के वंशजों में से
  rationale: यहाँ עוֹלָם संदर्भानुसार कुलनाम ‘एलाम’ है; בְּנֵי का सामूहिक वंशगत अर्थ ‘वंशजों’ से व्यक्त होता है।
- source_word: מָעַלְנוּ בֵאלֹהֵינוּ
  choice: हम अपने परमेश्वर के प्रति विश्वासघाती हुए हैं
  rationale: מעל साधारण पाप से अधिक निष्ठा-भंग का भाव रखता है; ‘के प्रति विश्वासघाती’ इसे स्पष्ट किन्तु असांप्रदायिक ढंग से व्यक्त करता है।
- source_word: וַנֹּשֶׁב נָשִׁים נָכְרִיּוֹת
  choice: हमने ... परदेशी स्त्रियों को पत्नियों के रूप में रख लिया है
  rationale: क्रिया का प्रसंग विवाह/पत्नी बना लेने का है, जबकि संज्ञा स्वयं ‘स्त्रियाँ’ कहती है; यह रूप दोनों बातों को सुरक्षित रखता है।
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: इस देश के लोगों में से
  rationale: עַמֵּי बहुवचन विविध जनसमुदायों की ओर संकेत करता है; हिन्दी में सामूहिक ‘लोगों’ स्वाभाविक है और הָאָרֶץ को प्रसंगगत ‘इस देश’ कहा गया है।
- source_word: וְעַתָּה יֵשׁ מִקְוֶה לְיִשְׂרָאֵל עַל זֹאת
  choice: फिर भी इस मामले में इस्राएल के लिए अब भी आशा है
  rationale: וְעַתָּה कथन में मोड़ लाता है; עַל זֹאת का जानबूझकर व्यापक अर्थ ‘इस मामले में’ रखा गया है, न कि ‘इसके बावजूद’ जैसा अधिक व्याख्यात्मक रूप।
theological_decisions:
- issue: מעל में निष्ठा-भंग का धार्मिक अर्थ
  choice: अपने परमेश्वर के प्रति विश्वासघाती हुए हैं
  alternative: हमने अपने परमेश्वर के विरुद्ध पाप किया है
  rationale: चुना हुआ रूप परमेश्वर के साथ निष्ठा तोड़ने की विशिष्ट धारणा बचाता है और इसे सामान्य ‘पाप’ में समतल नहीं करता।
- issue: נָשִׁים נָכְרִיּוֹת का सामाजिक/जातीय संकेत
  choice: परदेशी स्त्रियाँ
  alternative: अन्यजाति पत्नियाँ
  rationale: ‘परदेशी’ मूल के विदेशी/बाहरी अर्थ के निकट है; ‘अन्यजाति’ बाद की धार्मिक श्रेणी का अनावश्यक आभास दे सकता है।
- issue: עַל זֹאת की अस्पष्टता
  choice: इस मामले में
  alternative: इसके बावजूद
  rationale: हिब्रू संबंध, विषय या परिस्थिति का संकेत दे सकता है। ‘इस मामले में’ आशा के ठीक आधार या विरोध को निर्धारित किए बिना मूल तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण। वंशावली और स्वीकारोक्ति का औपचारिक स्वर रखा गया है; अनावश्यक धर्मशास्त्रीय शब्दावली से बचा गया है।
