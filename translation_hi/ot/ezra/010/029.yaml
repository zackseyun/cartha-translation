base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/029.yaml
  text: 'And from the sons of Bani: Meshullam[a], Malluk, Adaiah, Jashub, Sheal[b], and Jeremoth.'
translation:
  language: hi
  text: 'और बानी के पुत्रों में से: मशुल्लाम, मल्लूक, अदायाह, याशूब, शेआल और यरेमोत।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי בָּנִי
  choice: और बानी के वंशजों में से
  rationale: सूची के प्रसंग में यह पदबंध बानी के कुल के भीतर से आए व्यक्तियों का परिचय देता है। आधुनिक हिन्दी में ‘वंशजों’ से आशय स्वाभाविक और स्पष्ट रहता है।
- source_word: מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: מַלּוּךְ
  choice: मल्लूक
  rationale: मसोरेटिक स्वरांकन के अनुरूप व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: וַ/עֲדָיָה
  choice: अदायाह
  rationale: संयोजक सहित व्यक्तिनाम; हिन्दी सूची में संयोजक को विरामचिह्नों द्वारा समाहित किया गया है।
- source_word: יָשׁוּב
  choice: याशूब
  rationale: मसोरेटिक पाठ के उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וּ/שְׁאָל
  choice: शाल
  rationale: मसोरेटिक स्वरांकन के अनुसार व्यक्तिनाम का संक्षिप्त देवनागरी लिप्यंतरण; संयोजक को सूची-रचना में समाहित किया गया है।
- source_word: ירמות
  choice: यरेमोत
  rationale: इस वंशावली-सूची में प्रचलित नाम-पाठ के अनुरूप लिप्यंतरण; अस्वरांकित व्यंजन-पाठ संभावित भिन्न पठन की गुंजाइश रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची के अनुरूप संक्षिप्त रखी गई है। इब्रानी ‘पुत्रों’ का आशय यहाँ कुल-सदस्यों से है, इसलिए सहज हिन्दी में ‘वंशजों’ चुना गया। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणियाँ अपने चिह्नों से मेल नहीं खातीं और हिन्दी पाठ के लिए आवश्यक जानकारी नहीं देतीं, इसलिए उन्हें शामिल नहीं किया गया।
