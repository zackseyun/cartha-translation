language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקָּבְצ֣וּ כָל אַנְשֵֽׁי יְהוּדָה֩ וּ/בִנְיָמִ֨ן יְרוּשָׁלִַ֜ם לִ/שְׁלֹ֣שֶׁת הַ/יָּמִ֗ים ה֛וּא חֹ֥דֶשׁ הַ/תְּשִׁיעִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ וַ/יֵּשְׁב֣וּ כָל הָ/עָ֗ם בִּ/רְחוֹב֙ בֵּ֣ית הָ/אֱלֹהִ֔ים מַרְעִידִ֥ים עַל הַ/דָּבָ֖ר וּ/מֵ/הַ/גְּשָׁמִֽים־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/009.yaml
  text: So all the men of Judah and Benjamin gathered in Jerusalem within the three days[a]. It was the ninth month, on the twentieth day of the month. And all the people sat in the open square of the house of God[c][b], trembling because of this matter and because of the heavy rain.
translation:
  language: hi
  text: तब यहूदा और बिन्यामीन के सभी पुरुष[b] तीन दिन के भीतर यरूशलेम में इकट्ठे हो गए[a]। यह नौवाँ महीना था, और महीने का बीसवाँ दिन था। सब लोग परमेश्वर के भवन के खुले चौक[c] में बैठे थे। वे इस मामले के कारण और बारिश के कारण काँप रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभा के लिए जमा हो गए।”
    reason: इब्रानी क्रिया सामूहिक रूप से इकट्ठा होने के साथ सभा में एकत्र होने का भाव भी रख सकती है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “यहूदा और बिन्यामीन के सभी पुरुष।” इसका संकेत संभवतः सभा के लिए बुलाए गए पुरुष सदस्यों या प्रतिनिधियों की ओर है।
    reason: पुल्लिंग शब्दावली और उसके संभावित प्रतिनिधिक प्रसंग को स्पष्ट करना।
  - marker: c
    text: या, “परमेश्वर के भवन के सामने के चौक में।” इब्रानी शब्द एक चौड़े खुले स्थान को बताता है, अनिवार्यतः मंदिर के भीतरी आँगन को नहीं।
    reason: स्थान-संबंधी वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: इकट्ठे हो गए
  rationale: निफ़अल रूप सामूहिक रूप से इकट्ठा होने या सभा के लिए जमा होने को व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: כָל אַנְשֵׁי יְהוּדָה וּבִנְיָמִן
  choice: यहूदा और बिन्यामीन के सभी पुरुष
  rationale: אַנְשֵׁי व्याकरण की दृष्टि से पुल्लिंग ‘पुरुष’ है। प्रसंग में बुलाए गए पुरुष सदस्यों या घरानों के प्रतिनिधियों का संकेत संभव है, इसलिए इसे सामान्य ‘लोग’ बनाकर लिंग-सूचना मिटाई नहीं गई।
- source_word: לִשְׁלֹשֶׁת הַיָּמִים
  choice: तीन दिन के भीतर
  rationale: यह पहले घोषित तीन दिन की समय-सीमा के अंदर पहुँचने का अर्थ देता है।
- source_word: הוּא חֹדֶשׁ הַתְּשִׁיעִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: यह नौवाँ महीना था, और महीने का बीसवाँ दिन था
  rationale: इब्रानी तिथि-सूत्र को स्पष्ट और सहज आधुनिक हिन्दी में रखा गया है।
- source_word: וַיֵּשְׁבוּ
  choice: बैठे थे
  rationale: יָשַׁב का यहाँ सीधा अर्थ बैठना या बैठे रहना है; हिन्दी कथा-प्रवाह में ‘बैठे थे’ स्वाभाविक है।
- source_word: בִּרְחוֹב בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के खुले चौक में
  rationale: רְחוֹב किसी चौड़े खुले स्थान या चौक को दर्शाता है, अनिवार्यतः भीतरी आँगन को नहीं। ‘परमेश्वर का भवन’ मंदिर के लिए स्रोत का निकट अनुवाद है।
- source_word: מַרְעִידִים
  choice: काँप रहे थे
  rationale: रूप शारीरिक रूप से काँपने को व्यक्त करता है और आगे बताए दोनों कारणों—मामले तथा बारिश—के साथ ठीक बैठता है।
- source_word: עַל הַדָּבָר
  choice: इस मामले के कारण
  rationale: הַדָּבָר प्रसंग में चल रहे संकटपूर्ण विषय की ओर संकेत करता है। ‘इस मामले’ से उसकी प्रसंगगत निश्चितता बनी रहती है।
- source_word: וּמֵהַגְּשָׁמִים
  choice: और बारिश के कारण
  rationale: מִן यहाँ कारण बताता है। बहुवचन גְּשָׁמִים वर्षा या वर्षाकालीन बारिश को सूचित कर सकता है; केवल ‘बारिश’ कहना स्रोत में स्पष्ट रूप से न दिए गए ‘मूसलाधार’ जैसे बल को जोड़ने से बचाता है।
