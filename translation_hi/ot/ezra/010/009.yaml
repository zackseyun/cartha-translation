  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण रखी गई है। ‘परमेश्वर का भवन’ स्रोत की अभिव्यक्ति बनाए रखता है। अंतिम वाक्य में दोनों कारणों को अलग-अलग दोहराकर इब्रानी की समानांतर रचना और अर्थ-स्पष्टता सुरक्षित रखी गई है।
