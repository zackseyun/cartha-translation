  text: וַ/יָּ֣קָם עֶזְרָ֗א מִ/לִּ/פְנֵי֙ בֵּ֣ית הָֽ/אֱלֹהִ֔ים וַ/יֵּ֕לֶךְ אֶל לִשְׁכַּ֖ת יְהוֹחָנָ֣ן בֶּן אֶלְיָשִׁ֑יב וַ/יֵּ֣לֶךְ שָׁ֗ם לֶ֤חֶם לֹֽא אָכַל֙ וּ/מַ֣יִם לֹֽא שָׁתָ֔ה כִּ֥י מִתְאַבֵּ֖ל עַל מַ֥עַל הַ/גּוֹלָֽה־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/006.yaml
  text: Then Ezra rose from before the house of God and went to the chamber of Jehohanan son of Eliashib[a]. He went there and ate no bread and drank no water[c][b], because he was mourning over the unfaithfulness of the exiles.
translation:
  language: hi
  text: तब एज्रा परमेश्वर के भवन के सामने से उठा और एल्याशीब के पुत्र यहोहानान[a] के कक्ष में गया। वहाँ जाकर उसने न रोटी खाई, न पानी पिया, क्योंकि वह निर्वासितों के समुदाय[b] के निष्ठाभंग[c] के कारण शोक मना रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘योहानान’।
    reason: नाम के प्रचलित वैकल्पिक लिप्यंतरण को दर्ज करना।
  - marker: b
    text: शाब्दिक रूप से ‘निर्वासन/निर्वासितों का समुदाय’; इस संदर्भ में आशय निर्वासन से लौटे लोगों के समुदाय से है।
    reason: हिब्रू शब्द के सामुदायिक अर्थ को रखते हुए ऐतिहासिक संदर्भ स्पष्ट करना।
  - marker: c
    text: ‘निष्ठाभंग’ का अनुवाद ‘विश्वासघात’ या ‘विश्वासहीनता’ भी किया जा सकता है।
    reason: हिब्रू מַעַל की अर्थ-व्याप्ति और वाचा-संबंधी गंभीरता सुरक्षित रखना।
lexical_decisions:
- source_word: מִלִּפְנֵי בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन के सामने से
  rationale: यह हिब्रू के स्थानवाचक मुहावरे और ‘परमेश्वर के भवन’ की मूल अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִשְׁכַּת
  choice: कोठरी
  rationale: यह शब्द भवन-परिसर के एक अलग कक्ष को दर्शाता है; ‘कोठरी’ इस स्थापत्य संदर्भ में संक्षिप्त और सहज है।
- source_word: יְהוֹחָנָן בֶּן אֶלְיָשִׁיב
  choice: एल्याशीब के पुत्र यहोहानान
  rationale: नामों का लिप्यंतरण हिब्रू रूपों के निकट रखा गया है; यहोहानान के प्रचलित संक्षिप्त रूप का उल्लेख पादटिप्पणी में है।
- source_word: וַיֵּלֶךְ שָׁם
  choice: वह वहाँ गया
  rationale: मूल पाठ में ‘गया’ की पुनरावृत्ति और वाक्य की आकस्मिकता को बिना ‘ठहरा’ या ‘भीतर गया’ अर्थ जोड़ने के सुरक्षित रखा गया है।
- source_word: לֶחֶם לֹא אָכַל וּמַיִם לֹא שָׁתָה
  choice: उसने न रोटी खाई, न पानी पिया
  rationale: रोटी और पानी की ठोस समानांतर अभिव्यक्ति को रखते हुए हिन्दी में उपवास का अर्थ स्पष्ट किया गया है।
- source_word: מִתְאַבֵּל
  choice: शोक मना रहा था
  rationale: यह रूप निरंतर शोक और उससे जुड़ी उपवास की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעַל
  choice: विश्वासघात
  rationale: यह covenantal breach और निष्ठा-भंग की गंभीरता व्यक्त करता है; ‘अविश्वासयोग्यता’ की अपेक्षा अधिक स्वाभाविक हिन्दी है, पर संभावित ‘विश्वासहीनता’ पादटिप्पणी में सुरक्षित है।
- source_word: הַגּוֹלָה
  choice: निर्वासन से लौटे समुदाय
  rationale: शाब्दिक रूप ‘निर्वासित समुदाय’ है, पर एज्रा के ऐतिहासिक संदर्भ में यह लौटे हुए निर्वासितों के समुदाय को सूचित करता है; स्पष्टता के लिए इसे पाठ में व्यक्त किया गया है।
theological_decisions:
- issue: מַעַל का वाचा-संबंधी अपराध के संदर्भ में अनुवाद
  choice: विश्वासघात
  alternative: विश्वासहीनता; निष्ठाभंग
  rationale: ‘विश्वासघात’ समुदाय द्वारा निष्ठा तोड़ने की नैतिक और वाचा-संबंधी गंभीरता को बनाए रखता है, बिना इसे केवल कानूनी दोष तक सीमित किए।
- issue: בֵּית הָאֱלֹהִים को शाब्दिक अथवा व्याख्यात्मक रूप देना
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मन्दिर
  rationale: मूल की ‘परमेश्वर का भवन’ अभिव्यक्ति हिन्दी में समझने योग्य है और ‘मन्दिर’ की व्याख्यात्मक स्पष्टता जोड़े बिना स्रोत की छवि सुरक्षित रखती है।
- issue: הַגּוֹלָה की सामुदायिक पहचान
  choice: निर्वासन से लौटे समुदाय
  alternative: निर्वासित लोग; निर्वासित समुदाय
  rationale: शब्द निर्वासन से पहचाने जाने वाले समुदाय को दर्शाता है; एज्रा के कथा-संदर्भ में वे लौट चुके हैं। अनुवाद संदर्भ स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की ‘गया’ वाली पुनरावृत्ति और रोटी-पानी के समानांतर उपवास-वाक्य को जानबूझकर सुरक्षित रखा गया है।
