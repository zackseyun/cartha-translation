    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי
  choice: और ... के पुत्रों में से
  rationale: संयोजक, संबंधसूचक उपसर्ग और בְּנֵי के रचनात्मक बहुवचन को निकटता से व्यक्त करता है। इस वंश-सूची में ‘पुत्र’ किसी परिवार के पुरुष सदस्यों या वंशजों के लिए व्यापक रूप से प्रयुक्त हो सकता है; इस व्यापकता को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בֵּבָי
  choice: बेबै
  rationale: इब्रानी व्यक्तिनाम/कुलनाम का देवनागरी लिप्यंतरण।
- source_word: יְהוֹחָנָן
  choice: यहोहानान
  rationale: इब्रानी नाम के पूर्ण रूप का निकट देवनागरी लिप्यंतरण, जिसमें आरंभिक ईश्वरीय नामांश सुरक्षित रहता है।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: इब्रानी व्यक्तिनाम का स्वाभाविक और स्रोत-सन्निकट देवनागरी रूप।
- source_word: זַבַּי
  choice: ज़ब्बै
  rationale: ज़ायिन की /z/ ध्वनि और द्वित्व व्यंजन को दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: עַתְלָי
  choice: अतलै
  rationale: इब्रानी व्यक्तिनाम का पठनीय देवनागरी लिप्यंतरण; हिंदी में अयिन के लिए कोई सीधा समकक्ष नहीं है।
