  text: 'And from the sons of Bebai: Jehohanan[a], Hananiah, Zabbai[b], Athlai.'
translation:
  language: hi
  text: 'और बेबै के पुत्रों[a] में से: यहोहानान, हनन्याह, ज़ब्बै और अतलै।'
