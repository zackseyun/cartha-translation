  text: וּ/מִ/בְּנֵ֖י עֵילָ֑ם מַתַּנְיָ֤ה זְכַרְיָה֙ וִ/יחִיאֵ֣ל וְ/עַבְדִּ֔י וִ/ירֵמ֖וֹת וְ/אֵלִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/026.yaml
  text: 'And from the sons of Elam: Mattaniah, Zechariah, Jehiel, Abdi, Jeremoth, and Elijah.'
translation:
  language: hi
  text: 'और एलाम के पुत्रों में से: मत्तन्याह, जकर्याह, यहीएल, अब्दी, यरेमोत और एलिय्याह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מִ/בְּנֵי
  choice: और ... के पुत्रों में से
  rationale: संयोजक, पूर्वसर्ग और בֵּן के बहुवचन संयुक्त रूप को सूची-सूत्र के अनुरूप रखा गया है। यहाँ ‘पुत्रों’ का अर्थ व्यापक वंश या कुल के सदस्य भी हो सकता है, पर मूल इब्रानी मुहावरा बनाए रखा गया है।
- source_word: עֵילָם
  choice: एलाम
  rationale: यह इस प्रसंग में कुल अथवा पूर्वज का व्यक्तिवाचक नाम है, इसलिए इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: מַתַּנְיָה
  choice: मत्तन्याह
  rationale: इब्रानी व्यक्तिगत नाम का निकट और हिंदी बाइबलीय परंपरा से संगत लिप्यंतरण।
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: इब्रानी व्यक्तिगत नाम का सहज देवनागरी लिप्यंतरण।
- source_word: וִ/יחִיאֵל
  choice: यहीएल
  rationale: नाम के आरंभिक इब्रानी व्यंजन और स्वर-रचना को हिंदी में यथासंभव स्पष्ट रखा गया है; उपसर्गित संयोजक सूची की संरचना में व्यक्त है।
- source_word: וְ/עַבְדִּי
  choice: अब्दी
  rationale: सूची की रचना इसे व्यक्तिगत नाम सिद्ध करती है; इसलिए इसे ‘मेरा सेवक’ जैसे सामान्य पद के रूप में अनूदित नहीं किया गया।
- source_word: וִ/ירֵמוֹת
  choice: यरेमोत
  rationale: इब्रानी व्यक्तिगत नाम का स्रोत-निकट देवनागरी लिप्यंतरण।
- source_word: וְ/אֵלִיָּה
  choice: एलिय्याह
  rationale: इब्रानी नाम के व्यंजनात्मक स्वरूप को पहचानने योग्य हिंदी बाइबलीय रूप में प्रस्तुत किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंश-सूची शैली रखी गई है। व्यक्तिवाचक नामों में स्रोत-निकटता और हिंदी पाठक के लिए पठनीयता का संतुलन अपनाया गया है।
