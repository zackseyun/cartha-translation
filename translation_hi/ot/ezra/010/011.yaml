source:
  edition: WLC
  text: וְ/עַתָּ֗ה תְּנ֥וּ תוֹדָ֛ה לַ/יהוָ֥ה אֱלֹהֵֽי אֲבֹתֵי/כֶ֖ם וַ/עֲשׂ֣וּ רְצוֹנ֑/וֹ וְ/הִבָּֽדְלוּ֙ מֵ/עַמֵּ֣י הָ/אָ֔רֶץ וּ/מִן הַ/נָּשִׁ֖ים הַ/נָּכְרִיּֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/ezra/010/011.yaml
  text: So now give praise to Yahweh[a], the God of your fathers, and do his will[b]. Separate yourselves from the peoples of the land and from the foreign women.
translation:
  language: hi
  text: अब अपने पूर्वजों के परमेश्वर यहोवा की स्तुति करो[a] और उसकी इच्छा पूरी करो। देश के लोगों से और परदेशी स्त्रियों[b] से अपने आपको अलग कर लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के सामने स्वीकारोक्ति करो।” इब्रानी मुहावरे का अर्थ इस प्रसंग में स्तुति करना अथवा स्वीकारोक्ति करना हो सकता है।
    reason: alternative_reading
  - marker: b
    text: या, “परदेशी पत्नियों।” व्यापक प्रसंग विवाहों से सम्बन्धित है, हालाँकि यहाँ इब्रानी पाठ में शाब्दिक रूप से “परदेशी स्त्रियाँ” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּנוּ תוֹדָה
  choice: स्तुति करो
  rationale: यह इब्रानी मुहावरा धन्यवाद या स्तुति देने का अर्थ रखता है और प्रसंग में पाप-स्वीकार का भाव भी ग्रहण कर सकता है। मुख्य पाठ में स्वाभाविक ‘स्तुति करो’ रखा गया है और दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: לַיהוָה
  choice: यहोवा की
  rationale: व्यक्तिवाचक वाचा-नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי אֲבֹתֵיכֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: ‘पूर्वजों’ आधुनिक हिन्दी में स्वाभाविक है और पैतृक/वंशगत सम्बन्ध को अनावश्यक रूप से केवल पुरुष अभिभावकों तक सीमित किए बिना व्यक्त करता है।
- source_word: וַעֲשׂוּ רְצוֹנוֹ
  choice: उसकी इच्छा पूरी करो
  rationale: रצון का अर्थ इच्छा, प्रसन्नता या अभिलाषा हो सकता है; यह वाक्यांश आज्ञा के सक्रिय पालन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִבָּדְלוּ
  choice: अपने आपको अलग कर लो
  rationale: निफ़अल आज्ञार्थक का आत्मवाचक भाव समुदाय द्वारा स्वयं अलग होने की माँग करता है।
- source_word: מֵעַמֵּי הָאָרֶץ
  choice: देश के लोगों से
  rationale: ‘लोगों’ से मूल के बहुवचन עַמֵּי का भाव बना रहता है, जबकि ‘देश’ הָאָרֶץ को बिना भौगोलिक विस्तार जोड़े व्यक्त करता है।
- source_word: וּמִן הַנָּשִׁים הַנָּכְרִיּוֹת
  choice: और परदेशी स्त्रियों से
  rationale: इस पद में मूल पाठ स्पष्टतः ‘स्त्रियाँ’ कहता है, ‘पत्नियाँ’ नहीं; विवाह का प्रसंग पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: תודה को स्तुति/धन्यवाद या पाप-स्वीकार के रूप में समझना
  choice: स्तुति करो
  alternative: अपने पाप स्वीकार करो
  rationale: शब्द और मुहावरा स्तुति या धन्यवाद का सीधा अर्थ दे सकते हैं, जबकि पाप से अलग होने का तत्काल प्रसंग ‘स्वीकार’ के अर्थ का समर्थन करता है। मुख्य पाठ और पादटिप्पणी दोनों सम्भावनाएँ सुरक्षित रखते हैं।
- issue: הַנָּשִׁים הַנָּכְרִיּוֹת में स्त्रियाँ या पत्नियाँ
  choice: परदेशी स्त्रियों
  alternative: परदेशी पत्नियों
  rationale: मूल पद में सामान्य शब्द ‘स्त्रियाँ’ है, यद्यपि व्यापक प्रसंग विवाहों का है; इसलिए प्रसंगजन्य अर्थ को मुख्य पाठ में आरोपित न करके पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आज्ञार्थक रूप अपनाया गया है। ‘अपने आपको अलग कर लो’ सामुदायिक आदेश के आत्मवाचक बल को सहज भाषा में रखता है; अस्पष्टताओं को पादटिप्पणियों में संरक्षित किया गया है।
