source:
  edition: WLC
  text: וַ/יְהִ֥י דָוִ֛יד וְ/זִקְנֵ֥י יִשְׂרָאֵ֖ל וְ/שָׂרֵ֣י הָ/אֲלָפִ֑ים הַ/הֹֽלְכִ֗ים לְֽ/הַעֲל֞וֹת אֶת אֲר֧וֹן בְּרִית יְהוָ֛ה מִן בֵּ֥ית עֹבֵֽד אֱדֹ֖ם בְּ/שִׂמְחָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/025.yaml
  text: So David, and the elders of Israel, and the commanders of the thousands went to bring up the ark of the covenant of Yahweh from the house of Obed-edom with joy.
translation:
  language: hi
  text: तब दाऊद, इस्राएल के बुज़ुर्ग और हज़ारों के अधिकारी, याहवे की वाचा का सन्दूक ओबेद-एदोम के घर से आनन्द के साथ ऊपर ले जाने के लिए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: इसलिए ... गए
  rationale: यहाँ यह क्रिया कथा को आगे बढ़ाती है; अलग से ‘और ऐसा हुआ’ कहने के बजाय मुख्य क्रिया ‘गए’ के साथ ‘इसलिए’ स्वाभाविक हिन्दी में उसके कथात्मक कार्य को व्यक्त करता है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनिए
  rationale: यह इस्राएल के मान्य वरिष्ठ नेतृत्व-समूह के लिए हिन्दी बाइबलीय परम्परा में परिचित और अर्थ-सटीक पद है।
- source_word: שָׂרֵי הָאֲלָפִים
  choice: हज़ारों के प्रधान
  rationale: शाब्दिक संरचना को बनाए रखते हुए यह सैन्य अथवा प्रशासनिक ‘हज़ार’ की इकाइयों के अधिकारियों को दर्शाता है; केवल ‘सेनापति’ कहना सम्भावित प्रशासनिक अर्थ को सीमित कर देता।
- source_word: הַהֹלְכִים
  choice: गए
  rationale: इब्रानी कृदन्त इस समूह की गति को बताता है; आधुनिक हिन्दी की कथात्मक शैली में सीमित क्रिया ‘गए’ अधिक स्वाभाविक है।
- source_word: לְהַעֲלוֹת
  choice: ऊपर ले आने के लिए
  rationale: עלה का कारक रूप यहाँ सन्दूक को एक स्थान से ऊपर/निर्धारित केन्द्र की ओर ले जाने का भाव रखता है; ‘ऊपर ले आना’ दिशा और परिवहन दोनों को व्यक्त करता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का सन्दूक
  rationale: यह हिन्दी में स्वाभाविक सम्बन्ध-रचना के साथ इब्रानी पदबंध का अर्थ सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: מִן בֵּית עֹבֵד אֱדֹם
  choice: ओबेद-एदोम के घर से
  rationale: पूर्वसर्ग और सम्बन्ध-संरचना का सीधा, स्वाभाविक हिन्दी रूप है तथा व्यक्ति के नाम को लिप्यन्तरित करता है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द के साथ
  rationale: यह रीति/परिस्थिति सूचक בְּ का सहज हिन्दी रूप है और उत्सवपूर्ण भाव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ से बदले बिना प्रस्तुत करता है; ‘याहवे’ निकटतर वैकल्पिक लिप्यन्तरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पुरनिए’ और ‘वाचा का सन्दूक’ जैसे परिचित बाइबलीय पद अर्थ-सटीकता तथा पाठ-परम्परा की पहचान बनाए रखते हैं।
