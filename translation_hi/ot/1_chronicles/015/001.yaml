base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/001.yaml
  text: And he made houses for himself in the city of David[a], and he prepared a place for the ark of God and pitched a tent for it.
translation:
  language: hi
  text: दाऊद ने दाऊद के नगर में अपने लिए भवन बनाए। उसने परमेश्वर के सन्दूक के लिए एक स्थान तैयार किया और उसके लिए एक तम्बू ताना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लिए एक तम्बू ताना।” इब्रानी प्रत्यय सन्दूक या दाऊद, दोनों की ओर संकेत कर सकता है, यद्यपि निकटवर्ती प्रसंग सन्दूक के अर्थ का समर्थन करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ לוֹ בָתִּים
  choice: उसने अपने लिए भवन बनवाए
  rationale: עָשָׂה का मूल अर्थ ‘करना/बनाना’ है; भवनों के प्रसंग में कारक ‘बनवाए’ राजकीय निर्माण की स्वाभाविक हिन्दी अभिव्यक्ति है। בָּתִּים बहुवचन है और किसी विशेष प्रकार के महल का उल्लेख नहीं करता, इसलिए व्यापक ‘भवन’ चुना गया।
- source_word: בְּעִיר דָּוִיד
  choice: दाऊदपुर में
  rationale: यह ‘दाऊद का नगर’ नामक स्थापित स्थान-संज्ञा को सहज और संक्षिप्त हिन्दी रूप में व्यक्त करता है।
- source_word: וַיָּכֶן מָקוֹם
  choice: एक स्थान तैयार किया
  rationale: हिफ़ील रूप וַיָּכֶן यहाँ ‘तैयार करना’ और מָקוֹם ‘स्थान’ के सामान्य अर्थ में है।
- source_word: לַאֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर के सन्दूक के लिए
  rationale: אֲרוֹן का अर्थ ‘सन्दूक’ है और इस प्रसंग में यह पवित्र वाचा-सन्दूक को सूचित करता है; मूल पाठ केवल ‘परमेश्वर का सन्दूक’ कहता है, इसलिए अतिरिक्त विशेषण नहीं जोड़ा गया।
- source_word: וַיֶּט ... אֹהֶל
  choice: एक तम्बू खड़ा किया
  rationale: אֹהֶל के साथ נטה का अर्थ तम्बू तानना या खड़ा करना है। संज्ञा अनिश्चित है, इसलिए ‘एक तम्बू’ रखा गया।
- source_word: לוֹ
  choice: उसके लिए
  rationale: निकटतम उपयुक्त पूर्वपद ‘परमेश्वर का सन्दूक’ है और प्रसंग भी उसी की तैयारी पर केंद्रित है। सर्वनाम की वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: וַיֶּט לוֹ אֹהֶל में לוֹ का संदर्भ
  choice: सर्वनाम को परमेश्वर के सन्दूक से जोड़कर ‘उसके लिए एक तम्बू खड़ा किया’
  alternative: 'सर्वनाम दाऊद के लिए हो सकता है: ‘अपने लिए एक तम्बू खड़ा किया’'
  rationale: तत्काल पूर्ववर्ती वाक्यांश सन्दूक के लिए स्थान तैयार करने की बात करता है, इसलिए सन्दूक को संदर्भ मानने पर विचार-क्रम अधिक सुसंगत है; फिर भी इब्रानी पुल्लिंग एकवचन प्रत्यय व्याकरणतः दाऊद को भी सूचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप रखा गया है। ‘दाऊदपुर’ स्थापित बाइबलीय स्थान-नाम के रूप में और ‘सन्दूक’ धार्मिक वस्तु के लिए प्रचलित हिन्दी शब्द के रूप में प्रयुक्त है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित कथन के अंत में दिया गया है।
