  text: And Chenaniah[a], chief of the Levites, directed the carrying[b], because he was skillful at it.
translation:
  language: hi
  text: और लेवियों का प्रधान कनन्याह[a] ढुलाई[b] का निर्देशन करता था, क्योंकि वह ढुलाई में निपुण था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लेवियों का प्रधान कनन्याह गायन का निर्देशन करता था, क्योंकि वह उसमें निपुण था।” हिब्रू शब्द מַשָּׂא का सामान्य अर्थ “भार” या “ढुलाई” है, पर आसपास गायकों और वादकों के उल्लेख के कारण कुछ लोग यहाँ इसका संगीत-संबंधी अर्थ लेते हैं।
    reason: alternative_reading
  - marker: b
    text: 'हिब्रू में यही संज्ञा दो बार आती है: “ढुलाई में ... ढुलाई में।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְנַנְיָהוּ
  choice: कनन्याह
  rationale: व्यक्तिनाम का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: שַׂר הַלְוִיִּם
  choice: लेवियों का प्रधान
  rationale: उपासना-संबंधी प्रशासनिक संदर्भ में שַׂר नेतृत्व अथवा निरीक्षण करने वाले प्रधान अधिकारी को दर्शाता है।
- source_word: בְּמַשָּׂא
  choice: सामान ढोने के काम का
  rationale: מַשָּׂא का सामान्य अर्थ बोझ, भार या ढुलाई है। वाचा के सन्दूक को ले जाने के निकटवर्ती संदर्भ में यह मुख्य पाठ के लिए सबसे सीधा अर्थ है; सम्भावित संगीत-संबंधी अर्थ पादटिप्पणी में रखा गया है।
- source_word: יָסֹר
  choice: निर्देशन करता था
  rationale: यह क्रिया यहाँ किसी कार्य में निर्देश देने या देखरेख करने का भाव व्यक्त करती है।
- source_word: מֵבִין הוּא
  choice: वह इस काम में निपुण था
  rationale: בין का कृदन्त यहाँ केवल बौद्धिक समझ नहीं, बल्कि व्यावहारिक योग्यता और दक्षता बताता है।
theological_decisions:
- issue: מַשָּׂא का कार्य-संबंधी या संगीत-संबंधी अर्थ
  choice: मुख्य पाठ में सामान ढोने का काम
  alternative: गाने का निर्देशन
  rationale: शब्द का सामान्य अर्थ भार अथवा ढुलाई है और अध्याय में सन्दूक ले जाने का संदर्भ इसे समर्थन देता है; फिर भी गवैयों और वादकों के आसपास के संदर्भ के कारण संगीत-संबंधी व्याख्या वास्तविक सम्भावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। मूल में בְּמַשָּׂא संज्ञा दो बार आती है; हिन्दी में अस्वाभाविक पुनरावृत्ति से बचते हुए दूसरी बार उसे “इस काम में” कहा गया है।
