source:
  edition: WLC
  text: וְ/עִמָּ/הֶ֖ם אֲחֵי/הֶ֣ם הַ/מִּשְׁנִ֑ים זְכַרְיָ֡הוּ בֵּ֡ן וְ/יַֽעֲזִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִ/יחִיאֵ֣ל וְ/עֻנִּ֡י אֱלִיאָ֡ב וּ/בְנָיָ֡הוּ וּ/מַֽעֲשֵׂיָ֡הוּ וּ/מַתִּתְיָהוּ֩ וֶ/אֱלִ֨יפְלֵ֜הוּ וּ/מִקְנֵיָ֨הוּ וְ/עֹבֵ֥ד אֱדֹ֛ם וִֽ/יעִיאֵ֖ל הַ/שֹּׁעֲרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/018.yaml
  text: 'And with them were their brothers of the second rank: Zechariah[a], Ben-Jaaziel, and Shemiramoth, and Jehiel, and Unni, Eliab, and Benaiah, and Maaseiah, and Mattithiah, and Eliphelehu, and Mikneiah, and Obed-edom, and Jeiel, the gatekeepers.'
translation:
  language: hi
  text: 'और उनके साथ उनके दूसरे दर्जे के भाई भी थे: जकर्याह, बेन[a], याजीएल, शमीरामोत, यहीएल, उन्नी, एलीआब, बनायाह, मासेयाह, मत्तित्याह, एलीपलेहू, मिकनेयाह, ओबेद-एदोम और यीएल—ये द्वारपाल थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘बेन’ के बाद ‘और याजीएल’ है; इसलिए ‘बेन’ को अलग नाम माना गया है। कुछ अनुवाद इसे ‘बेन-याजीएल’ संयुक्त नाम के रूप में लेते हैं।
    reason: textual_or_lexical_ambiguity
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: और उनके साथ ... भी थे
  rationale: इब्रानी का पूर्वसर्गीय वाक्यांश साथ के एक अतिरिक्त समूह को प्रस्तुत करता है; स्वाभाविक हिन्दी के लिए ‘थे’ और प्रसंगानुकूल ‘भी’ जोड़े गए हैं।
- source_word: אֲחֵיהֶם
  choice: उनके ... भाई
  rationale: शब्द का सीधा अर्थ ‘उनके भाई’ है; यहाँ यह सम्भवतः साथी लेवियों को सूचित करता है, पर अनुवाद मूल पारिवारिक शब्दावली को बनाए रखता है।
- source_word: הַמִּשְׁנִים
  choice: दूसरे दर्जे के
  rationale: यह पद किसी दूसरे क्रम, वर्ग या अधीनस्थ दर्जे को सूचित करता है; ‘दूसरे दर्जे के’ अर्थ को स्पष्ट रखते हुए उसकी सम्भावित संस्थागत अस्पष्टता भी बनाए रखता है।
- source_word: זְכַרְיָהוּ
  choice: जकर्याह
  rationale: हिन्दी बाइबल-परम्परा के अनुरूप व्यक्तिनाम का सहज लिप्यंतरण।
- source_word: בֵּן
  choice: बेन
  rationale: संयोजित नाम-सूची में इसे एक स्वतंत्र व्यक्तिनाम के रूप में लिया गया है; अगले नाम से पहले וְ (‘और’) होने के कारण सामान्य संज्ञा ‘पुत्र’ समझना व्याकरणतः कठिन है।
- source_word: יַעֲזִיאֵל
  choice: याजीएल
  rationale: इब्रानी व्यक्तिनाम का हिन्दी में पठनीय लिप्यंतरण।
- source_word: הַשֹּׁעֲרִים
  choice: द्वारपाल
  rationale: संज्ञा उन लोगों को दर्शाती है जिन्हें द्वारों की रखवाली का दायित्व था; ‘द्वारपाल’ संक्षिप्त और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: הַמִּשְׁנִים द्वारा सूचित पदानुक्रम या समूह-विभाजन
  choice: दूसरे दर्जे के
  alternative: दूसरे दल के / दूसरे क्रम के
  rationale: मूल पद से दर्जा, क्रम या दूसरा समूह—इनमें से एक से अधिक अर्थ सम्भव हैं। मुख्य पाठ में सर्वाधिक सहज अर्थ रखा गया है और पादटिप्पणी में विकल्प दिए गए हैं।
- issue: בֵּן की पहचान
  choice: बेन को स्वतंत्र नाम मानना
  alternative: ‘बेन-याजीएल’ संयुक्त नाम; अथवा ‘... का पुत्र’
  rationale: मसोराई पाठ में יַעֲזִיאֵל से पहले ‘और’ है, जो ‘बेन’ और ‘याजीएल’ को अलग सूची-सदस्य मानने का समर्थन करता है। फिर भी पाठ-परम्परा और पद की असामान्यता के कारण वैकल्पिक समझ पादटिप्पणी में दर्ज है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। नामों को देवनागरी में स्रोत-निकट किंतु पठनीय रूप दिया गया है। लम्बी सूची में बार-बार ‘और’ दोहराने के बजाय हिन्दी की स्वाभाविक सूची-रचना अपनाई गई है। अंतिम पदबंध को ‘ये द्वारपाल थे’ बनाकर उसका सम्बन्ध ओबेद-एदोम और यीएल—दोनों से स्पष्ट किया गया है।
