    reason: इब्रानी प्रयोजनवाचक हिफ़ईल क्रिया ध्वनि को सुनाई देने योग्य बनाने का भाव देती है; संगीत के प्रसंग में यह स्पष्ट या ऊँचे स्वर से बजाने का अर्थ भी दे सकती है।
lexical_decisions:
- source_word: וְהַמְשֹׁרְרִים
  choice: और गायक
  rationale: संज्ञा-सदृश कृदंत यहाँ विशेष रूप से गानेवालों को दर्शाता है; आरंभिक וְ को प्रसंग की सूचीबद्ध रचना के अनुरूप ‘और’ से रखा गया है।
- source_word: הֵימָן אָסָף וְאֵיתָן
  choice: हेमान, आसाप और एतान
  rationale: व्यक्तिनामों का आधुनिक मानक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण किया गया है और अंतिम संयोजक को स्वाभाविक सूची-रचना में रखा गया है।
- source_word: בִּמְצִלְתַּיִם
  choice: झाँझें ... बजाते थे
  rationale: בְּ यहाँ साधन का बोध कराता है। हिन्दी में वाद्य के साथ ‘बजाना’ अधिक स्वाभाविक है, इसलिए संबंध को क्रियात्मक रूप में व्यक्त किया गया है।
- source_word: נְחֹשֶׁת
  choice: काँसे की
  rationale: प्राचीन धातु-वाद्यों के संदर्भ में ‘काँसा’ उपयुक्त और प्रचलित है; ‘पीतल’ ऐतिहासिक रूप से कम सटीक हो सकता है।
- source_word: לְהַשְׁמִיעַ
  choice: इस तरह ... कि उनकी ध्वनि सुनाई दे
  rationale: שׁמע के हिफ़ईल क्रिया-रूप का मूल भाव ‘सुनाई देना कराना’ है। यह रूप हिन्दी में उस प्रयोजन को स्वाभाविक ढंग से व्यक्त करता है, बिना ‘बहुत ऊँचा’ जैसा निश्चित तीव्रता-बोध स्रोत में जोड़ने के।
