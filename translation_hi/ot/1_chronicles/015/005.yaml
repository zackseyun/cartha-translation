  text: 'For the sons of Kohath: Uriel the chief[a], and 120 of his brothers.'
translation:
  language: hi
  text: 'कहात के वंशजों में से: प्रधान ऊरीएल और उसके 120 भाई[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
