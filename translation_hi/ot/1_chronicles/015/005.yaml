    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי קְהָת
  choice: कहात के वंशजों में से
  rationale: सूची के इस प्रसंग में לִבְנֵי किसी पूर्वज से निकले लेवीय कुल-समूह का परिचय देता है। स्वाभाविक आधुनिक हिन्दी में ‘वंशजों में से’ कुलगत अर्थ और सूची की संरचना दोनों स्पष्ट करता है।
- source_word: אוּרִיאֵל
  choice: ऊरीएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַשָּׂר
  choice: प्रधान
  rationale: שַׂר यहाँ कुल-दल के मान्य मुखिया या अधिकारी को दर्शाता है; ‘प्रधान’ नेतृत्व का भाव देता है, पर राजकीय ‘राजकुमार’ का अनावश्यक संकेत नहीं देता।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: अर्थ की व्यापकता बनाए रखते हुए इब्रानी के निकट शब्दावली रखी गई है। प्रसंग में ‘भाई’ संभवतः उसी कुल के पुरुष सदस्यों को दर्शाता है, केवल सगे भाइयों को नहीं।
- source_word: מֵאָה וְעֶשְׂרִים
  choice: '120'
  rationale: गणना-सूची में आधुनिक पठनीयता के लिए संख्या अंकों में दी गई है; अर्थ ‘एक सौ बीस’ है।
