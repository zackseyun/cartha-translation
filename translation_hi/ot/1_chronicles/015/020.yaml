base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/020.yaml
  text: and Zechariah[a], Aziel, Shemiramoth, Jehiel, Unni, Eliab, Maaseiah, and Benaiah, with harps according to Alamoth.
translation:
  language: hi
  text: और जकर्याह, अज़ीएल, शमीरामोत, यहीएल, उन्नी, एलीआब, मासेयाह और बनायाह वीणाओं के साथ, अलामोत[a] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊँचे स्वर में”; हिब्रू शब्द “अलामोत” संभवतः युवतियों या ऊँची स्वर-पट्टी से जुड़ा एक संगीत-निर्देश है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּנְבָלִים
  choice: वीणाएँ बजाएँ
  rationale: נְבָלִים तार वाले वाद्यों को दर्शाता है, जिन्हें वीणा या सारंगी-सदृश वाद्य कहा जा सकता है। हिन्दी में संगीतकारों की सूची के संदर्भ में ‘वीणाएँ बजाएँ’ स्वाभाविक है और उपसर्ग ב के वाद्य-साधन संबंधी अर्थ को व्यक्त करता है।
- source_word: עַל
  choice: के अनुसार
  rationale: यहाँ עַל संभवतः किसी संगीत-पद्धति, स्वर-विन्यास या निर्देश को प्रस्तुत करता है; ‘के अनुसार’ उसके लचीले अर्थ को बनाए रखता है।
- source_word: עֲלָמוֹת
  choice: अलामोत
  rationale: यह संभवतः एक तकनीकी संगीत-निर्देश है, पर इसका ठीक अर्थ अनिश्चित है। लिप्यंतरण इस अनिश्चितता को सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: וּזְכַרְיָה וַעֲזִיאֵל וּשְׁמִירָמוֹת וִיחִיאֵל וְעֻנִּי וֶאֱלִיאָב וּמַעֲשֵׂיָהוּ וּבְנָיָהוּ
  choice: और जकर्याह, अजीएल, शमीरामोत, यहीएल, उन्नी, एलीआब, मासेयाह और बनायाह
  rationale: व्यक्तिनामों को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है और आरंभिक संयोजक को ‘और’ से व्यक्त किया गया है।
