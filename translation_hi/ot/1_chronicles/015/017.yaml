  text: וַ/יַּעֲמִ֣ידוּ הַ/לְוִיִּ֗ם אֵ֚ת הֵימָ֣ן בֶּן יוֹאֵ֔ל וּ/מִ֨ן אֶחָ֔י/ו אָסָ֖ף בֶּן בֶּֽרֶכְיָ֑הוּ וּ/מִן בְּנֵ֤י מְרָרִי֙ אֲחֵי/הֶ֔ם אֵיתָ֖ן בֶּן קֽוּשָׁיָֽהוּ־־־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/017.yaml
  text: So the Levites appointed Heman son of Joel[a], and from his brothers Asaph son of Berechiah, and from the sons of Merari, their brothers[b], Ethan son of Kushaiah.
translation:
  language: hi
  text: तब लेवियों ने योएल के पुत्र हेमान को नियुक्त किया[a], और उसके भाइयों में से बेरेक्याह के पुत्र आसाप को, और मरारी के वंशजों में से उनके भाई कूशायाह के पुत्र एतान को।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवा के लिए खड़ा किया”; इब्रानी क्रिया किसी व्यक्ति को निर्धारित भूमिका में खड़ा करने या ठहराने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “मरारी के पुत्रों में से”; अर्थात् मरारी के कुल में से।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּעֲמִידוּ
  choice: नियुक्त किया
  rationale: עמד के हिफ़ील रूप का आशय किसी को निर्धारित भूमिका में खड़ा करना या ठहराना है; संगीत-सेवा की व्यवस्था के संदर्भ में ‘नियुक्त किया’ स्वाभाविक और औपचारिक अर्थ देता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: निश्चित सामुदायिक नाम को प्रचलित हिन्दी रूप में रखा गया है।
- source_word: הֵימָן בֶּן יוֹאֵל
  choice: योएल के पुत्र हेमान
  rationale: हिन्दी की स्वाभाविक संबंध-संरचना में स्पष्ट वंश-संबंध सुरक्षित रखा गया है।
- source_word: וּמִן אֶחָיו
  choice: और उसके भाइयों में से
  rationale: מִן द्वारा व्यक्त समूह में से चयन का भाव ‘में से’ से स्पष्ट होता है; एकवचन प्रत्यय को ‘उसके’ के रूप में सुरक्षित रखा गया है।
- source_word: אָסָף בֶּן בֶּרֶכְיָהוּ
  choice: बेरेक्याह के पुत्र आसाप
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण और स्पष्ट वंश-संबंध रखा गया है।
- source_word: וּמִן בְּנֵי מְרָרִי
  choice: और मरारी के वंशजों में से
  rationale: शाब्दिक ‘मरारी के पुत्रों में से’ यहाँ कुल या वंश को सूचित करता है; आधुनिक हिन्दी में ‘वंशजों में से’ अर्थ को अधिक सहजता से व्यक्त करता है।
- source_word: אֲחֵיהֶם
  choice: उनके भाई
  rationale: बहुवचन प्रत्यय और पारिवारिक शब्द को यथासंभव औपचारिक रूप से सुरक्षित रखा गया है, यद्यपि संदर्भ में इसका आशय सहवंशी लेवियों से है।
- source_word: אֵיתָן בֶּן קוּשָׁיָהוּ
  choice: कूशायाह के पुत्र एतान
  rationale: व्यक्तिनामों का हिन्दी लिप्यंतरण करते हुए वंश-संबंध स्पष्ट रखा गया है।
