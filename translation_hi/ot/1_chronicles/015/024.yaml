base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/024.yaml
  text: And Shebaniah[a], Jehoshaphat, Nethanel, Amasai, Zechariah, Benaiah, and Eliezer the priests were blowing the trumpets before the ark of God[c][b], and Obed-edom and Jehiah were gatekeepers for the ark.
translation:
  language: hi
  text: और शबन्याहू, यहोशापात, नतनेल, अमासै, जकर्याह, बनायाह और एलीएजेर—ये याजक—परमेश्वर के संदूक के आगे तुरहियाँ[b] फूँक रहे थे[a]; और ओबेद-एदोम और यहीया संदूक के द्वारपाल[c] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुरहियाँ बजा रहे थे।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी शब्द प्रायः उपासना में याजकों द्वारा बजाई जाने वाली सीधी तुरहियों के लिए आता है।
    reason: cultural_note
  - marker: c
    text: या, “संदूक के द्वाररक्षक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֲנִים
  choice: ये याजक
  rationale: निश्चित उपपद सूचीबद्ध पुरुषों को याजकों के रूप में चिह्नित करता है; डैशों के बीच रखा गया वाक्यांश हिंदी में स्वाभाविक समानाधिकरण देता है।
- source_word: מחצצרים
  choice: फूँक रहे थे
  rationale: कृदंत जुलूस के दौरान जारी और समकालीन क्रिया व्यक्त करता है; अपूर्ण भूतकालीन हिंदी रूप इस पक्ष को स्वाभाविक ढंग से रखता है।
- source_word: בַּחֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: यह शब्द विशेषतः याजकीय उपासना में प्रयुक्त सीधी तुरहियों के लिए आता है। पद में चाँदी का उल्लेख नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לִפְנֵי
  choice: के आगे
  rationale: 'यहाँ स्थान-संबंधी अर्थ है: जुलूस में याजक संदूक के आगे थे।'
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: समास का सीधा अर्थ यही है; ‘वाचा’ जोड़ना इस पद में स्पष्ट न किए गए विवरण को आयात करेगा।
- source_word: שֹׁעֲרִים
  choice: द्वारपाल
  rationale: यह शब्द पवित्र स्थान या मंदिर-सेवा से जुड़े द्वारपालों के लिए सामान्यतः प्रयुक्त होता है; ‘द्वारपाल’ उसके संस्थागत और धार्मिक भाव को बनाए रखता है।
- source_word: לָאָרוֹן
  choice: संदूक के
  rationale: लामेद यहाँ संदूक से संबंधित नियुक्ति या जिम्मेदारी दर्शाता है। हिंदी में ‘संदूक के द्वारपाल’ संक्षिप्त है और संबंध को खुला रखता है।
- source_word: וְעֹבֵד אֱדֹם
  choice: ओबेद-एदोम
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וִיחִיָּה
  choice: यहीया
  rationale: इब्रानी יְחִיָּה का स्रोत-समीप देवनागरी लिप्यंतरण।
