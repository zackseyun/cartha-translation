  language: hi
  text: दाऊद ने हारून के पुत्रों और लेवियों को इकट्ठा किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: क्रिया אסף यहाँ लोगों को एक स्थान पर एकत्र करने का भाव देती है। ‘इकट्ठा किया’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी कथात्मक रूप के अनुकूल है।
- source_word: דָּוִיד
  choice: दाऊद
  rationale: इस बाइबिलीय व्यक्तिगत नाम का प्रचलित हिन्दी रूप।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्रों
  rationale: शाब्दिक अर्थ ‘हारून के पुत्र’ है। प्रसंग में हारून के वंशज अभिप्रेत हो सकते हैं, पर स्रोत की वंशसूचक और पुरुषवाचक अभिव्यक्ति को बनाए रखा गया है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवी से सम्बद्ध धार्मिक-वंशीय समुदाय के लिए स्थापित और स्वाभाविक हिन्दी शब्द।
- source_word: אֵת ... וְאֵת
  choice: अलग से अनूदित नहीं; ‘और’ द्वारा दोनों कर्म जोड़े गए
  rationale: אֵת निश्चित प्रत्यक्ष कर्म को चिह्नित करता है और इसका पृथक हिन्दी समतुल्य नहीं है। इसकी पुनरावृत्ति को सामान्य हिन्दी समन्वय से व्यक्त किया गया है।
