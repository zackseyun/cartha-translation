source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר לָ/הֶ֔ם אַתֶּ֛ם רָאשֵׁ֥י הָ/אָב֖וֹת לַ/לְוִיִּ֑ם הִֽתְקַדְּשׁוּ֙ אַתֶּ֣ם וַ/אֲחֵי/כֶ֔ם וְ/הַֽעֲלִיתֶ֗ם אֵ֣ת אֲר֤וֹן יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֶל הֲכִינ֖וֹתִי לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/012.yaml
  text: And he said to them[a], “You are the heads of the fathers’ houses of the Levites. Sanctify yourselves, you and your brothers, and bring up the ark of Yahweh, the God of Israel, to the place I have prepared for it.”
translation:
  language: hi
  text: और उसने उनसे कहा, “तुम लेवियों के पितृकुलों के मुखिया हो। तुम और तुम्हारे भाई अपने आप को पवित्र करो[a] और इस्राएल के परमेश्वर याहवे के सन्दूक को उस स्थान पर ले आओ जिसे मैंने उसके लिए तैयार किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को धार्मिक विधि के अनुसार पवित्र करो।” इब्रानी क्रिया यहाँ अनुष्ठान के लिए स्वयं को शुद्ध और समर्पित करने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי הָאָבוֹת לַלְוִיִּם
  choice: लेवियों के पितृकुलों के मुखिया
  rationale: यह पदबंध लेवियों के उन कुल-प्रमुखों को सूचित करता है जिनकी वंशावली पिताओं के आधार पर मानी जाती थी। ‘पितृकुलों’ से इब्रानी सामाजिक संरचना भी बनी रहती है और हिन्दी स्वाभाविक रहती है।
- source_word: הִתְקַדְּשׁוּ
  choice: अपने आप को पवित्र करो
  rationale: हित्पएल रूप यहाँ धार्मिक अनुष्ठान के लिए स्वयं को शुद्ध और समर्पित करने का भाव देता है। मुख्य पाठ में सरल हिन्दी रखी गई है और अनुष्ठानिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַאֲחֵיכֶם
  choice: तुम्हारे भाई
  rationale: मूल शब्द का सीधा अर्थ ‘भाई’ है; प्रसंग में इससे उनके साथी लेवी और निकट कुलजन अभिप्रेत हैं।
- source_word: וְהַעֲלִיתֶם
  choice: ले आओ
  rationale: हिफ़ील रूप का अर्थ ‘ऊपर ले आना’ है। हिन्दी में इस प्रसंग में ‘ले आओ’ अधिक स्वाभाविक है; स्थान की ओर गति अगले पदबंध से स्पष्ट है।
- source_word: אֲרוֹן יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर यहोवा का सन्दूक
  rationale: सम्बन्ध और समानाधिकरण को स्वाभाविक हिन्दी क्रम में रखा गया है तथा परमेश्वर का व्यक्तिगत नाम सुरक्षित रखा गया है।
- source_word: אֶל הֲכִינוֹתִי לוֹ
  choice: उस स्थान पर जिसे मैंने उसके लिए तैयार किया है
  rationale: אֶל किसी गन्तव्य की ओर संकेत करता है, जबकि ‘स्थान’ मूल में व्यक्त नहीं है। निकटवर्ती कथानक के आधार पर उसे स्पष्ट करना हिन्दी में आवश्यक और सन्दर्भसंगत है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी के सामान्य बाइबलीय प्रयोग में पहचाने जाने योग्य ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ से बदलकर व्यक्तिगत नाम को छिपाया नहीं गया।
- issue: הִתְקַדְּשׁוּ का धार्मिक अर्थ
  choice: अपने आप को पवित्र करो
  alternative: अपने आप को संस्कारित/समर्पित करो
  rationale: आज्ञा केवल सामान्य नैतिक सुधार की नहीं, सन्दूक उठाने से पहले अपेक्षित धार्मिक तैयारी की है। मुख्य पाठ सहज रखा गया है और पादटिप्पणी इस अनुष्ठानिक आयाम को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पितृकुल’ ऐतिहासिक सामाजिक संरचना को सुरक्षित रखता है; ‘सन्दूक’ स्थापित बाइबलीय पद है।
