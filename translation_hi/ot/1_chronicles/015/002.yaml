id: 1CH.15.2
reference: 1 Chronicles 15:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֚ז אָמַ֣ר דָּוִ֔יד לֹ֤א לָ/שֵׂאת֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כִּ֖י אִם הַ/לְוִיִּ֑ם כִּי בָ֣/ם בָּחַ֣ר יְהוָ֗ה לָ/שֵׂ֞את אֶת אֲר֧וֹן יְהוָ֛ה וּֽ/לְ/שָׁרְת֖/וֹ עַד עוֹלָֽם־־־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/002.yaml
  text: Then David said[a], “No one is to carry the ark of God except the Levites[b], for Yahweh has chosen them to carry the ark of Yahweh and to minister to him forever.”
translation:
  language: hi
  text: तब दाऊद ने कहा[a], “परमेश्वर के सन्दूक को लेवीय लोगों के सिवा कोई और न उठाए, क्योंकि यहोवा ने उन्हीं को यहोवा का सन्दूक उठाने और सदा उसकी सेवा करने के लिए चुना है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “परमेश्वर का सन्दूक लेवीय लोगों के सिवा किसी और के द्वारा न उठाया जाए।” इब्रानी वाक्य संक्षिप्त है और उसमें निहित कर्ता स्पष्ट रूप से नहीं कहा गया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז אָמַר דָּוִיד
  choice: तब दाऊद ने कहा
  rationale: कथा में समय और घटनाक्रम का स्वाभाविक संकेत देता है; אָמַר का सामान्य, अनचिह्नित अर्थ ‘कहा’ है।
- source_word: לֹא לָשֵׂאת אֶת אֲרוֹן הָאֱלֹהִים כִּי אִם הַלְוִיִּם
  choice: परमेश्वर के सन्दूक को लेवीय लोगों के सिवा कोई और न उठाए
  rationale: इब्रानी वाक्य में कर्ता अध्याहृत है। यह हिन्दी रचना निषेध और केवल लेवियों को मिले अधिकार—दोनों को स्पष्ट तथा सहज रूप में व्यक्त करती है।
- source_word: אֲרוֹן הָאֱלֹהִים / אֲרוֹן יְהוָה
  choice: परमेश्वर का सन्दूक / यहोवा का सन्दूक
  rationale: पवित्र उपासना-वस्तु के लिए ‘सन्दूक’ प्रचलित और सटीक हिन्दी शब्द है तथा मूल में प्रयुक्त दोनों ईश्वरीय पदों का भेद बनाए रखता है।
- source_word: הַלְוִיִּם
  choice: लेवीय लोग
  rationale: यह पद लेवी के वंश और समूह के सदस्यों को सूचित करता है; आधुनिक सामान्य पाठक के लिए ‘लेवीय लोग’ स्पष्ट है।
- source_word: כִּי בָם בָּחַר יְהוָה
  choice: क्योंकि यहोवा ने उन्हीं को ... चुना है
  rationale: כִּי कारण बताता है; בָם का बल ‘उन्हीं को’ से सुरक्षित रहता है, और ‘चुना है’ पूर्व चयन के वर्तमान प्रभाव को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में स्थापित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לָשֵׂאת
  choice: उठाने
  rationale: सन्दूक को कंधों पर वहन करने के प्रसंग में ‘उठाना’ स्वाभाविक हिन्दी है और भौतिक रूप से ढोने का भाव रखता है।
- source_word: וּלְשָׁרְתוֹ
  choice: और ... उसकी सेवा करने
  rationale: שרת यहाँ लेवीयों की पवित्र सेवा को दर्शाता है। ‘सेवा करना’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक सेवाकार्य का अर्थ भी ग्रहण कर सकता है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: स्थायी और निरन्तर नियुक्ति का भाव संक्षिप्त, स्वाभाविक और गरिमापूर्ण ढंग से देता है।
theological_decisions:
- issue: וּלְשָׁרְתוֹ में एकवचन प्रत्यय का सन्दर्भ
  choice: ‘उसकी सेवा’ में ‘उसकी’ का सन्दर्भ यहोवा है।
  alternative: इसे सन्दूक के सामने या उसके पास सेवा करने के रूप में समझना।
  rationale: निकटवर्ती व्यक्तिगत पूर्वपद यहोवा है और लेवीय सेवा का सामान्य धर्मवैधानिक आशय यहोवा की सेवा है। फिर भी अनुवाद मूल के सर्वनाम को बनाए रखता है और व्याख्यात्मक विस्तार नहीं जोड़ता।
- issue: लेवियों के विशेष चयन का स्वरूप
  choice: पद के अनुसार सन्दूक उठाने और यहोवा की सेवा के लिए लेवियों के विशिष्ट चयन को स्पष्ट रखा गया है।
  alternative: कथन को केवल तत्कालीन व्यावहारिक व्यवस्था मानकर सामान्यीकृत करना।
  rationale: בָם और בָּחַר चयन पर स्पष्ट बल देते हैं; अनुवाद को इस विशेषाधिकार और दायित्व को कम नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘लेवीय लोग’ सामान्य पाठक के लिए स्पष्ट है; ‘यहोवा’ ईश्वरीय नाम को सुरक्षित रखता है। मुख्य पाठ में केवल आवश्यक अस्पष्टता के लिए पाद-टिप्पणी दी गई है।
