lexical_decisions:
- source_word: לִ/בְנֵי
  choice: के वंशजों में से
  rationale: यहाँ ל अगली लेवीय कुल-शाखा को सूची में प्रस्तुत करता है। בני का शाब्दिक अर्थ ‘पुत्र’ है, पर इस वंशावली-संबंधी संदर्भ में स्वाभाविक हिन्दी ‘वंशज’ है।
- source_word: עֻזִּיאֵל
  choice: उज्जीएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: עַמִּינָדָב
  choice: अम्मीनादाब
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: הַ/שָּׂר
  choice: प्रधान
  rationale: שַׂר इस कुल-सूची में मुखिया या अगुवा को दर्शाता है; ‘प्रधान’ संक्षिप्त, गरिमापूर्ण और प्रसंगानुकूल है। वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְ/אֶחָי/ו
  choice: और उसके ... भाई
  rationale: אָח का अर्थ सगा भाई या व्यापक पुरुष कुल-सदस्य हो सकता है। ‘भाई’ मूल का पारिवारिक रूप बनाए रखता है, जबकि संख्या को स्वाभाविक हिन्दी क्रम में विशेषण के रूप में रखा गया है।
- source_word: מֵאָה וּ/שְׁנֵים עָשָׂר
  choice: एक सौ बारह
  rationale: मूल संख्या का सीधा और मानक हिन्दी रूप।
