base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/028.yaml
  text: And all Israel was bringing up the ark of the covenant of Yahweh with shouting[a], with the sound of a horn, with trumpets, and with cymbals[b], making music with harps and lyres.
translation:
  language: hi
  text: और समस्त इस्राएल यहवे की वाचा का संदूक जयजयकार[a], सींग की ध्वनि[b], तुरहियों और झाँझों के साथ ऊपर ले जा रहा था, और वीणाओं तथा सारंगियों के साथ संगीत कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक ऊँची पुकार के साथ’; इब्रानी शब्द उत्सव या अभिनंदन की ऊँची पुकार को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी, ‘शोफ़ार’; परंपरागत रूप से यह एक सींग है और आगे उल्लिखित ‘तुरहियों’ से अलग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַעֲלִים
  choice: ऊपर ले जा रहा था
  rationale: हिफ़ील बहुवचन कृदंत चल रही प्रक्रिया को व्यक्त करता है; ‘समस्त इस्राएल’ को हिन्दी में सामूहिक एकवचन मानकर क्रिया एकवचन रखी गई है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहवे की वाचा का संदूक
  rationale: रचना-संबंध को स्वाभाविक हिन्दी में रखते हुए संदूक की पहचान वाचा और परमेश्वर के व्यक्तिगत नाम से की गई है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: תְרוּעָה
  choice: जयजयकार
  rationale: उत्सवी और उपासना-संबंधी संदर्भ में यह शब्द ऊँची सामूहिक पुकार अथवा अभिनंदन का संकेत देता है।
- source_word: קוֹל שׁוֹפָר
  choice: नरसिंगे की ध्वनि
  rationale: קוֹל को ‘ध्वनि’ और שׁוֹפָר को अगले शब्द חֲצֹצְרוֹת से अलग रखने के लिए ‘नरसिंगा’ कहा गया है।
- source_word: חֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: यह सीधे औपचारिक वाद्य को सूचित करता है और नरसिंगे से उसका भेद बनाए रखता है।
- source_word: מְצִלְתַּיִם
  choice: झाँझ
  rationale: इस तालवाद्य का प्रचलित और सहज हिन्दी नाम।
- source_word: מַשְׁמִעִים
  choice: संगीत बजा रहे थे
  rationale: शाब्दिक अर्थ ‘सुनाई दे रहा बनाना’ है; वाद्यों के संदर्भ में यह स्वाभाविक हिन्दी में उन्हें बजाकर संगीत उत्पन्न करने को व्यक्त करता है।
- source_word: נְבָלִים
  choice: सारंगियाँ
  rationale: प्राचीन तंत्री वाद्य का आधुनिक समतुल्य सटीक नहीं है; दूसरे तंत्री वाद्य से भेद रखने के लिए परिचित हिन्दी पद चुना गया है।
- source_word: כִנֹּרוֹת
  choice: वीणाएँ
  rationale: प्राचीन तंत्री वाद्य के लिए प्रचलित हिन्दी बाइबलीय शब्द, जो נְבָלִים से शब्दगत भेद बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सार्वजनिक पाठ के योग्य और गरिमापूर्ण रखी गई है। ‘नरसिंगा’ और ‘तुरही’ से मूल के दो अलग वाद्यों का भेद स्पष्ट किया गया है; प्राचीन तंत्री वाद्यों के हिन्दी नाम अनुमानित आधुनिक समतुल्य हैं।
