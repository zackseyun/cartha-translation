source:
  edition: WLC
  text: וַֽ/יְהִי֙ בֶּ/עְזֹ֣ר הָֽ/אֱלֹהִ֔ים אֶ֨ת הַ/לְוִיִּ֔ם נֹשְׂאֵ֖י אֲר֣וֹן בְּרִית יְהוָ֑ה וַ/יִּזְבְּח֥וּ שִׁבְעָֽה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/026.yaml
  text: And when God helped the Levites who were carrying the ark of the covenant of Yahweh[a], they sacrificed seven bulls and seven rams.
translation:
  language: hi
  text: और जब परमेश्वर ने उन लेवियों की सहायता की जो यहोवा की वाचा का संदूक[a] उठा रहे थे, तब उन्होंने सात बैलों और सात मेढ़ों की बलि चढ़ाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रभु की वाचा का संदूक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּעְזֹר
  choice: जब ... सहायता की
  rationale: ב prefixed infinitive construct with ויהי introduces a temporal circumstance; modern Hindi naturally expresses it as “जब ... तब।”
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: The expression refers to Israel’s God; “परमेश्वर” is natural, dignified standard Hindi.
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: Standard Hindi biblical designation for the Levites, with the postposition supplied by the clause.
- source_word: נֹשְׂאֵי
  choice: जो ... उठा रहे थे
  rationale: The participle describes the Levites’ ongoing action; this relative construction is clear and natural in Hindi.
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का संदूक
  rationale: This preserves the construct relationship and the personal divine name while remaining idiomatic in Hindi.
- source_word: וַיִּזְבְּחוּ
  choice: उन्होंने ... बलि किए
  rationale: The verb is masculine plural and denotes sacrificial action; “बलि किए” preserves both plurality and cultic sense.
- source_word: שִׁבְעָה פָרִים
  choice: सात बैल
  rationale: Direct and standard rendering for sacrificial bulls.
- source_word: וְשִׁבְעָה אֵילִים
  choice: और सात मेढ़े
  rationale: אֵילִים denotes rams; the repeated numeral is retained.
theological_decisions:
- issue: बलि चढ़ाने की क्रिया का कर्ता
  choice: उन्होंने
  alternative: उसने / दाऊद ने
  rationale: וַיִּזְבְּחוּ तीसरे पुरुष बहुवचन में है। अनुवाद इस व्याकरणिक बहुवचन को बनाए रखता है और इब्रानी से आगे बढ़कर किसी विशिष्ट समूह को कर्ता नहीं ठहराता।
- issue: दिव्य नाम יְהוָה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; “यहोवा” उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है। पादटिप्पणी पारंपरिक उपाधि-आधारित विकल्प देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली। “जब ... तब” से इब्रानी काल-संबंध स्पष्ट किया गया है; कर्ता के बहुवचन को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
