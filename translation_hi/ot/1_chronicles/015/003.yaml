  text: וַ/יַּקְהֵ֥ל דָּוִ֛יד אֶת כָּל יִשְׂרָאֵ֖ל אֶל יְרֽוּשָׁלִָ֑ם לְ/הַעֲלוֹת֙ אֶת אֲר֣וֹן יְהוָ֔ה אֶל מְקוֹמ֖/וֹ אֲשֶׁר הֵכִ֥ין לֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/003.yaml
  text: And David assembled all Israel at Jerusalem to bring up the ark of Yahweh to its place[b][a], which he had prepared for it.
translation:
  language: hi
  text: दाऊद ने पूरे इस्राएल को यरूशलेम में[a] इकट्ठा किया, ताकि वह याहवे के सन्दूक को ऊपर उसके स्थान तक ले जाए, जिसे उसने उसके लिए[b] तैयार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘यरूशलेम की ओर’; यहाँ भाव है कि लोग यरूशलेम में इकट्ठा हुए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उसके लिए’; सन्दर्भ में इसका सबसे स्वाभाविक संकेत सन्दूक की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप का अर्थ लोगों को एकत्र करना है। ‘इकट्ठा किया’ सहज आधुनिक हिन्दी है और औपचारिक राष्ट्रीय सभा के प्रसंग में उपयुक्त है।
- source_word: כָּל יִשְׂרָאֵל
  choice: पूरे इस्राएल
  rationale: यह राष्ट्र अथवा उसके प्रतिनिधियों के लिए प्रयुक्त सामूहिक अभिव्यक्ति है; ‘पूरे इस्राएल’ मूल के व्यापक भाव को बनाए रखता है।
- source_word: אֶל יְרוּשָׁלִָם
  choice: यरूशलेम में
  rationale: אֶל सामान्यतः दिशा (‘को/की ओर’) बताता है, पर इकट्ठा करने की क्रिया के साथ हिन्दी में सभा के परिणामी स्थान के लिए ‘में’ अधिक स्वाभाविक है।
- source_word: לְהַעֲלוֹת
  choice: ऊपर ले जाकर ... रखा जाए
  rationale: עלה के causative रूप में ऊपर ले जाने का भाव है। हिन्दी वाक्य में गंतव्य तक पहुँचाने का आशय स्पष्ट करने के लिए ‘ऊपर ले जाकर ... रखा जाए’ स्वाभाविक रूप से इसे व्यक्त करता है।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का सन्दूक
  rationale: यह सम्बन्धसूचक रचना है। ‘सन्दूक’ पवित्र वाचा-सन्दूक के लिए प्रचलित और समझने योग्य हिन्दी शब्द है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֶל מְקוֹמוֹ
  choice: उसके स्थान पर
  rationale: प्रत्यय का सबसे स्वाभाविक संकेत सन्दूक की ओर है। ‘उसके स्थान पर’ संक्षिप्त है और ‘उचित’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: אֲשֶׁר הֵכִין לוֹ
  choice: जिसे उसने उसके लिए तैयार किया था
  rationale: पूर्वकालिक तैयारी को ‘तैयार किया था’ व्यक्त करता है। ‘उसके लिए’ मूल के पुल्लिंग एकवचन सर्वनाम की संदर्भगत अस्पष्टता को हिन्दी में भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: לוֹ सर्वनाम का संदर्भ
  choice: मुख्य पाठ में अस्पष्ट ‘उसके लिए’
  alternative: सन्दूक के लिए; याहवे के लिए
  rationale: निकट प्रसंग में इसका संकेत सबसे स्वाभाविक रूप से सन्दूक की ओर है, किंतु व्याकरणतः याहवे की ओर संकेत भी संभव है। हिन्दी का सर्वनाम मूल अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ऊपर ले जाकर’ भौगोलिक तथा धार्मिक जुलूस—दोनों संभावित रंगों को बिना अधिक व्याख्या के बनाए रखता है।
