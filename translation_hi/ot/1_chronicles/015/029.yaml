  text: וַ/יְהִ֗י אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה בָּ֖א עַד עִ֣יר דָּוִ֑יד וּ/מִיכַ֨ל בַּת שָׁא֜וּל נִשְׁקְפָ֣ה בְּעַ֣ד הַ/חַלּ֗וֹן וַ/תֵּ֨רֶא אֶת הַ/מֶּ֤לֶךְ דָּוִיד֙ מְרַקֵּ֣ד וּ/מְשַׂחֵ֔ק וַ/תִּ֥בֶז ל֖/וֹ בְּ/לִבָּֽ/הּ־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/029.yaml
  text: And as the ark of the covenant of Yahweh came to the city of David[a], Michal the daughter of Saul looked out through the window and saw King David dancing and playing, and she despised him in her heart.
translation:
  language: hi
  text: जब यहोवा की वाचा का संदूक दाऊद के नगर तक पहुँचा, तब शाऊल की बेटी मीकल ने खिड़की से बाहर देखा। उसने राजा दाऊद को नाचते और आनंद मनाते[a] देखा, और अपने मन में उसे तुच्छ समझा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “खेलते” या “हर्षोल्लास करते।”
    reason: וּמְשַׂחֵק के संदर्भानुकूल शब्दगत विकल्प; एंकर को सीधे संबंधित क्रिया के साथ रखा गया है।
lexical_decisions:
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का संदूक
  rationale: इब्रानी संबंध-शृंखला को स्वाभाविक हिन्दी में रखा गया है; ‘यहोवा’ व्यक्तिगत दिव्य नाम को सुरक्षित रखता है।
- source_word: בָּא עַד עִיר דָּוִיד
  choice: दाऊद के नगर तक पहुँचा
  rationale: בוא के साथ עַד गंतव्य तक पहुँचने का भाव देता है; यह अनुवाद नगर में प्रवेश को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִיכַל בַּת שָׁאוּל
  choice: शाऊल की बेटी मीकल
  rationale: मूल में मीकल की शाऊलवंशी पहचान पर दिए गए कथात्मक बल को बनाए रखता है।
- source_word: נִשְׁקְפָה בְּעַד הַחַלּוֹן
  choice: खिड़की से बाहर देखा
  rationale: क्रिया का बाहर या नीचे की ओर देखने का भाव है; हिन्दी में यह स्वाभाविक है और दिशा को आवश्यकता से अधिक विशिष्ट नहीं बनाता।
- source_word: מְרַקֵּד
  choice: नाचते
  rationale: यह ऊर्जावान नृत्यगत गतिविधि को दर्शाता है और जुलूस के उत्सवी संदर्भ में सहज है।
- source_word: וּמְשַׂחֵק
  choice: आनंद मनाते
  rationale: इस संदर्भ में क्रिया खेलपूर्ण, उल्लासपूर्ण उत्सवी व्यवहार बताती है; ‘आनंद मनाते’ आधुनिक हिन्दी में अर्थ को बिना तुच्छता के व्यक्त करता है।
- source_word: וַתִּבֶז לוֹ בְּלִבָּהּ
  choice: अपने मन में उसे तुच्छ समझा
  rationale: בזה की अवमानना और בְּלִבָּהּ की आंतरिकता दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नाम को नाम के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है; किसी साम्प्रदायिक व्याख्या को नहीं जोड़ा गया।
