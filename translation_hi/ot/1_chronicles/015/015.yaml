  text: וַ/יִּשְׂא֣וּ בְנֵֽי הַ/לְוִיִּ֗ם אֵ֚ת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים כַּ/אֲשֶׁ֛ר צִוָּ֥ה מֹשֶׁ֖ה כִּ/דְבַ֣ר יְהוָ֑ה בִּ/כְתֵפָ֥/ם בַּ/מֹּט֖וֹת עֲלֵי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/015.yaml
  text: And the sons of the Levites carried the ark of God on their shoulders with the poles upon them[a], just as Moses had commanded according to the word of Yahweh.
translation:
  language: hi
  text: लेवियों के पुत्र परमेश्वर के संदूक को अपने कंधों पर रखे डंडों के सहारे उठाकर ले गए[a], ठीक वैसे ही जैसे मूसा ने याहवे के वचन के अनुसार आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “डंडों को उन पर रखकर।” इब्रानी पदबंध बताता है कि संदूक उठाते समय डंडे उनके कंधों पर टिके हुए थे।
    reason: मूल इब्रानी पदबंध की बनावट और “उन पर” के संकेत को दिखाने के लिए।
lexical_decisions:
- source_word: וַיִּשְׂאוּ
  choice: उठाकर ले गए
  rationale: यहाँ נשׂא संदूक को केवल क्षणभर उठाने नहीं, बल्कि उठाकर ले जाने का अर्थ देता है; यह हिंदी में स्वाभाविक रूप से परिवहन की क्रिया व्यक्त करता है।
- source_word: בְנֵי הַלְוִיִּם
  choice: लेवियों के पुत्र
  rationale: इब्रानी का स्पष्ट पारिवारिक/वंशगत पदबंध सुरक्षित रखा गया है; इसे केवल ‘लेवी’ कहकर संक्षिप्त नहीं किया गया।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: मूल पाठ में केवल ‘परमेश्वर का संदूक’ है; ‘वाचा का’ जोड़ना इस पद से बाहर की सूचना लाना होता।
- source_word: כַּאֲשֶׁר צִוָּה מֹשֶׁה
  choice: ठीक वैसे ही जैसे मूसा ने ... आज्ञा दी थी
  rationale: כַּאֲשֶׁר कार्य और पूर्व आज्ञा के बीच सटीक अनुरूपता बताता है; ‘दी थी’ आज्ञा के पहले दिए जाने को स्वाभाविक हिंदी में दर्शाता है।
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: דבר के ‘वचन’ अर्थ को बनाए रखते हुए यह स्पष्ट किया गया है कि मूसा की आज्ञा यहोवा के निर्देश के अनुरूप थी।
- source_word: בִּכְתֵפָם בַּמֹּטוֹת עֲלֵיהֶם
  choice: अपने कंधों पर रखे डंडों के सहारे
  rationale: 'यह संदूक ढोने की रीति बताता है: डंडे उनके कंधों पर थे। हिंदी वाक्यांश साधन और स्थिति दोनों को स्पष्ट तथा स्वाभाविक ढंग से व्यक्त करता है।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदला गया।
- issue: בְנֵי הַלְוִיִּם में लिंगयुक्त वंशगत पदबंध
  choice: लेवियों के पुत्र
  alternative: लेवी
  rationale: मूल का पुल्लिंग बहुवचन और पुत्रत्व-संबंध सुरक्षित रखा गया है, यद्यपि सामूहिक ‘लेवी’ अधिक संक्षिप्त होता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘उठाकर ले गए’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘लेवियों के पुत्र’ और ‘वचन के अनुसार’ मूल की औपचारिक बनावट को बनाए रखते हैं।
