  text: וְ/דָוִ֞יד מְכֻרְבָּ֣ל בִּ/מְעִ֣יל בּ֗וּץ וְ/כָל הַ/לְוִיִּם֙ הַ/נֹּשְׂאִ֣ים אֶת הָ/אָר֔וֹן וְ/הַ/מְשֹׁ֣רְרִ֔ים וּ/כְנַנְיָ֛ה הַ/שַּׂ֥ר הַ/מַּשָּׂ֖א הַ/מְשֹֽׁרְרִ֑ים וְ/עַל דָּוִ֖יד אֵפ֥וֹד בָּֽד׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/027.yaml
  text: David was clothed with a robe of fine linen[a], as were all the Levites who were carrying the ark, and the singers, and Chenaniah, the leader of the singing of the singers; and on David was a linen ephod.
translation:
  language: hi
  text: दाऊद महीन लिनन का चोगा पहने हुए था; और संदूक उठानेवाले सभी लेवी, गायक, और कनन्याह—जो भार ढोने के काम का प्रधान था[a]—भी ऐसे ही वस्त्र पहने हुए थे। दाऊद ने लिनन का एपोद भी पहना हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “कनन्याह, गायन का प्रधान,” “गायकों का प्रधान,” अथवा “संगीत का प्रधान।” इब्रानी वाक्यांश कठिन है।
    reason: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים की वाक्यरचना और הַמַּשָּׂא के अर्थ अनिश्चित हैं; पादटिप्पणी पाठक के सामने प्रमुख वैकल्पिक समझ रखती है।
lexical_decisions:
- source_word: מְכֻרְבָּל
  choice: पहने हुए था / पहने हुए थे
  rationale: निष्क्रिय कृदन्त किसी वस्त्र में लिपटे या वस्त्र पहने होने को दर्शाता है। आधुनिक हिन्दी में यह स्वाभाविक है और पहले दाऊद, फिर अन्य लोगों के वस्त्रधारण को स्पष्ट करता है।
- source_word: מְעִיל בּוּץ
  choice: बढ़िया मलमल का चोगा
  rationale: מְעִיל एक विशिष्ट बाहरी वस्त्र है और בּוּץ उत्तम कोटि के महीन सन-वस्त्र को दर्शाता है। ‘चोगा’ और ‘बढ़िया मलमल’ इस औपचारिक परिधान को सहज हिन्दी में व्यक्त करते हैं।
- source_word: הַלְוִיִּם הַנֹּשְׂאִים אֶת הָאָרוֹן
  choice: सन्दूक उठानेवाले सभी लेवी
  rationale: कृदन्त जुलूस में जारी कार्य को दिखाता है। ‘सन्दूक’ वाचा के सन्दूक के लिए संक्षिप्त और प्रसंगानुकूल है; मूल में इस पद पर केवल ‘सन्दूक’ है।
- source_word: הַמְשֹׁרְרִים
  choice: गायक
  rationale: मूल धातु विशेष रूप से गानेवालों को सूचित करती है, इसलिए व्यापक ‘संगीतकार’ की अपेक्षा ‘गायक’ अधिक सटीक है।
- source_word: כְנַנְיָה
  choice: कनन्याह
  rationale: इब्रानी नाम का निकट और हिन्दी में उच्चारणयोग्य लिप्यन्तरण।
- source_word: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים
  choice: गायकों के गायन का प्रधान
  rationale: मसोरेटी वाक्यांश कठिन है। मुख्य पाठ में प्रसंगानुकूल और पठनीय अर्थ दिया गया है, जबकि ‘भार/ढोने’ से जुड़े अधिक शाब्दिक सम्भव अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֵפוֹד בָּד
  choice: सन का एपोद
  rationale: ‘एपोद’ विशिष्ट उपासना-संबंधी परिधान का नाम है, इसलिए उसका लिप्यन्तरण रखा गया है। בָּד की सामग्री को ‘सन’ से व्यक्त किया गया है।
- source_word: וְעַל דָּוִיד
  choice: दाऊद के ऊपर ... था
  rationale: मूल की ‘दाऊद पर/के ऊपर’ संरचना बनाए रखने से चोगे और अतिरिक्त एपोद के बीच भेद बना रहता है।
theological_decisions:
- issue: उपासना के प्रसंग में दाऊद के एपोद पहनने का आशय
  choice: ‘एपोद’ को विशिष्ट परिधान के रूप में रखा गया, पर दाऊद के याजक होने का कोई निष्कर्ष अनुवाद में नहीं जोड़ा गया।
  alternative: ‘याजकीय वस्त्र’ कहकर व्याख्या करना या दाऊद को यहाँ याजक घोषित करना।
  rationale: पद उसके वस्त्र का उल्लेख करता है, उसके पद या धर्मशास्त्रीय दर्जे का स्पष्ट दावा नहीं करता।
- issue: הַשַּׂר הַמַּשָּׂא הַמְשֹׁרְרִים की कठिन वाक्यरचना
  choice: मुख्य पाठ में ‘गायकों के गायन का प्रधान’ और पादटिप्पणी में अन्य सम्भावनाएँ।
  alternative: ‘ढोने के काम का प्रधान’, ‘गायकों के भार का प्रधान’ या ‘संगीत का प्रधान’।
  rationale: הַמַּשָּׂא सामान्यतः भार या ढोने के कार्य से जुड़ सकता है, पर यहाँ गायकों के साथ इसकी रचना कठिन है और गायन/संगीत संबंधी अर्थ भी प्राचीन प्रसंग में सम्भव माना गया है। पादटिप्पणी अनिश्चितता को छिपने नहीं देती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप रखा गया है। ‘दाऊद’, ‘लेवी’ और ‘एपोद’ जैसे स्थापित बाइबलीय पद बनाए गए हैं। कठिन इब्रानी वाक्यांश को मुख्य पाठ में पठनीय रखा गया है, पर उसकी वास्तविक अनिश्चितता पादटिप्पणी में दी गई है।
