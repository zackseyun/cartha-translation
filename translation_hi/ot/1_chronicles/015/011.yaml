translation:
  language: hi
  text: 'तब दाऊद ने सादोक और एब्यातार याजकों को तथा लेवियों को बुलाया: ऊरीएल, असायाह, योएल, शमायाह, एलीएल और अम्मीनादाब।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: यहाँ קרא का अर्थ नाम लेकर संबोधित करना मात्र नहीं, बल्कि निर्दिष्ट व्यक्तियों को अपने पास बुलाना है। हिन्दी में ‘को बुलाया’ इस अर्थ को स्वाभाविक और निकट रूप से व्यक्त करता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित उपपद इन दोनों व्यक्तियों को उनकी याजकीय भूमिका में पहचानता है। हिन्दी वाक्य-विन्यास में ‘सादोक और एब्यातार याजकों को’ वही संबंध स्पष्ट करता है।
- source_word: וְלַלְוִיִּם
  choice: तथा इन लेवियों को
  rationale: לְ की पुनरावृत्ति बताती है कि लेवी भी बुलाए गए व्यक्तियों में हैं। ‘इन’ आगे दिए छह नामों को ‘लेवियों’ की पहचान के रूप में स्पष्ट करता है, जबकि ‘तथा’ समानांतर संरचना बनाए रखता है।
- source_word: לְאוּרִיאֵל עֲשָׂיָה וְיוֹאֵל שְׁמַעְיָה וֶאֱלִיאֵל וְעַמִּינָדָב
  choice: ऊरीएल, असायाह, योएल, शमायाह, एलीएल और अम्मीनादाब
  rationale: व्यक्तिनामों का स्रोतानुकूल देवनागरी लिप्यंतरण किया गया है। ‘लेवियों’ के बाद विसर्ग-चिह्न दर्शाता है कि ये छह नाम उन्हीं लेवियों की सूची हैं।
- source_word: דָוִיד
  choice: दाऊद
  rationale: हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला मानक नामरूप चुना गया है।
