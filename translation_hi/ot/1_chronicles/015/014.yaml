source:
  edition: WLC
  text: וַ/יִּֽתְקַדְּשׁ֔וּ הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּ֑ם לְ/הַעֲל֕וֹת אֶת אֲר֥וֹן יְהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/014.yaml
  text: So the priests and the Levites consecrated themselves to bring up the ark of Yahweh[a], the God of Israel.
translation:
  language: hi
  text: तब याजकों और लेवियों ने इस्राएल के परमेश्वर याहवे के सन्दूक को ऊपर ले जाने के लिए अपने आपको पवित्र किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आपको पवित्र सेवा के लिए तैयार किया।”
    reason: मूल इब्रानी आत्मवाचक क्रिया में स्वयं को पवित्र करने और पवित्र कार्य के लिए तैयार होने—दोनों का भाव हो सकता है।
lexical_decisions:
- source_word: וַיִּתְקַדְּשׁוּ
  choice: अपने आपको पवित्र किया
  rationale: हित्पएल रूप यहाँ पवित्र सेवा के लिए स्वयं को विधिपूर्वक तैयार करने का भाव देता है। यह अनुवाद आत्मवाचकता और पवित्रता—दोनों को बनाए रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: उपासना और पवित्र सेवा के प्रसंग में כֹּהֵן का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: וְהַלְוִיִּם
  choice: और लेवियों
  rationale: लेवी वंश के पवित्र-सेवकों के लिए मानक हिन्दी नाम; निश्चितता प्रसंग और बहुवचन रूप से स्पष्ट है।
- source_word: לְהַעֲלוֹת
  choice: ऊपर ले जाने के लिए
  rationale: हिफ़ील रूप का ‘ऊपर चढ़ाना/ले जाना’ अर्थ सुरक्षित रहता है, जबकि सन्दूक को किस रीति से ले जाया गया, यह अनावश्यक रूप से निर्धारित नहीं किया जाता।
- source_word: אֶת אֲרוֹן
  choice: सन्दूक
  rationale: इस्राएल के पवित्र वाचा-सन्दूक के लिए स्थापित हिन्दी पद, जो सामान्य पेटी की अपेक्षा प्रसंग को ठीक व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप; यह याहवे की पहचान इस्राएल के परमेश्वर के रूप में कराता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है; इसलिए उसे किसी उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
- issue: וַיִּתְקַדְּשׁוּ में पवित्रता और तैयारी का सम्बन्ध
  choice: अपने आपको पवित्र किया
  alternative: अपने आपको शुद्ध किया
  rationale: मूल क्रिया का मुख्य भाव पवित्र ठहरने अथवा पवित्र सेवा के लिए स्वयं को तैयार करने का है। ‘शुद्ध किया’ सम्भव अनुष्ठानिक प्रक्रिया की ओर संकेत कर सकता है, पर मूल के व्यापक पवित्रता-भाव को संकुचित कर देगा।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सन्दूक’, ‘याजक’ और ‘लेवी’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं; वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है।
