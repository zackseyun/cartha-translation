  yaml_path: translation/ot/1_chronicles/015/007.yaml
  text: 'For the sons of Gershom: Joel the chief[b][a], and 130 of his brothers.'
translation:
  language: hi
  text: गेर्शोम के वंशजों में से प्रधान योएल और उसके 130 भाई[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “भाई” से आशय उसी लेवीय कुल-समूह के पुरुष सदस्यों से है; वे सभी योएल के सगे भाई हों, यह आवश्यक नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִ/בְנֵי
  choice: के वंशजों में से
  rationale: सूची में ל अगली लेवीय कुल-शाखा का परिचय देता है। हिन्दी में ‘के वंशजों में से’ इस सूचीगत कार्य को स्वाभाविक रूप से व्यक्त करता है और בְנֵי को जैविक पुत्रों तक सीमित नहीं करता।
- source_word: גֵּרְשׁוֹם
  choice: गेर्शोम
  rationale: यहाँ इब्रानी पाठ स्पष्ट रूप से गेर्शोम पढ़ता है; इसलिए इसी रूप का देवनागरी लिप्यंतरण किया गया है।
- source_word: יוֹאֵל
  choice: योएल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और स्रोत-संगत हिन्दी लिप्यंतरण।
- source_word: הַ/שָּׂר
  choice: प्रधान
  rationale: इस कुल-सूची के संदर्भ में שַׂר समूह के मुखिया या अगुवे को सूचित करता है; ‘प्रधान’ नेतृत्व का पद बताता है, बिना राजकीय अर्थ थोपे।
- source_word: וְ/אֶחָי/ו
  choice: और उसके 130 भाई
  rationale: मूल शब्द ‘भाइयों’ का आधारभूत अर्थ बनाए रखा गया है। यहाँ यह योएल के सगे भाइयों तक सीमित न होकर उसी लेवीय कुल-समूह के पुरुष सदस्यों को दर्शा सकता है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מֵאָה וּ/שְׁלֹשִׁים
  choice: '130'
  rationale: इब्रानी संख्या ‘एक सौ तीस’ है; सूची में सुगम पठनीयता के लिए अंकों का प्रयोग किया गया है।
