  yaml_path: translation/ot/1_chronicles/015/021.yaml
  text: and Mattithiah[a], Eliphelehu, Mikneiah, Obed-edom, Jeiel, and Azaziah were to lead with lyres according to the Sheminith.
translation:
  language: hi
  text: और मत्तित्याहू, एलीपलेहू, मिक्नेयाहू, ओबेद-एदोम, येईएल और अज़ज़्याहू को शमीनीत[a] के अनुसार वीणाओं के साथ अगुवाई करनी थी।
  philosophy: optimal-equivalence
  footnotes:
