source:
  edition: WLC
  text: כִּ֛י לְ/מַ בָּ/רִ֥אשׁוֹנָ֖ה לֹ֣א אַתֶּ֑ם פָּרַ֨ץ יְהוָ֤ה אֱלֹהֵ֨י/נוּ֙ בָּ֔/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ כַּ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/013.yaml
  text: Because you were not there the first time[a], Yahweh our God broke out against us[b], because we did not seek him according to the ordinance.
translation:
  language: hi
  text: क्योंकि पहली बार आप लोग नहीं थे[a], इसलिए यहोवा, हमारे परमेश्वर, हम पर टूट पड़े, क्योंकि हमने उसकी खोज निर्धारित विधि के अनुसार नहीं की थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि पहले हमारे परमेश्वर यहोवा ने हम पर प्रहार किया।” इब्रानी आरम्भ संक्षिप्त है और यह भी संकेत कर सकता है कि सन्दूक लाने के पहले प्रयास में लेवी सम्मिलित नहीं थे।
    reason: alternative_reading
  - marker: b
    text: या, “हमने निर्धारित विधि के अनुसार उससे पूछा नहीं था” या “उससे परामर्श नहीं लिया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַ בָּרִאשׁוֹנָה לֹא אַתֶּם
  choice: क्योंकि पहली बार आप लोग नहीं थे
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक लुप्तार्थक है। प्रसंग में दाऊद लेवियों से कह रहा है कि सन्दूक लाने के पहले प्रयास में वे सम्मिलित नहीं थे; हिन्दी में पूरक अर्थ को सीमित रूप से स्पष्ट किया गया है, पर ‘उठाने’ जैसी अतिरिक्त क्रिया मुख्य पाठ में नहीं जोड़ी गई।
- source_word: פָּרַץ
  choice: प्रकोप ... फूट पड़ा
  rationale: यह क्रिया अचानक और प्रबल दैवी प्रहार को व्यक्त करती है तथा उज्जा की घटना और ‘पेरेस-उज्जा’ नाम की ओर संकेत बनाए रखती है। ‘फूट पड़ा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि केवल किसी उपाधि से।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: प्रथम पुरुष बहुवचन प्रत्यय सहित शब्द का सीधा और स्वाभाविक अनुवाद।
- source_word: בָּנוּ
  choice: हम पर
  rationale: प्रकोप के साथ ‘हम पर’ हिन्दी में दैवी प्रहार के लक्ष्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דְרַשְׁנֻהוּ
  choice: हमने उसकी खोज ... नहीं की थी
  rationale: דרשׁ में खोजने, पूछने और परामर्श लेने के अर्थ हैं। ‘खोज’ व्यापक धार्मिक अर्थ को बनाए रखती है; वैकल्पिक प्रक्रियात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: כַּמִּשְׁפָּט
  choice: निर्धारित विधि के अनुसार
  rationale: यहाँ מִשְׁפָּט सन्दूक ले जाने के लिए ठहराई गई वैधानिक प्रक्रिया को सूचित करता है। यह पदबंध मानक और प्रक्रियात्मक दोनों भावों को सहज हिन्दी में रखता है।
theological_decisions:
- issue: आरम्भिक खंड का लुप्तार्थ
  choice: इसे पहले प्रयास में लेवियों की अनुपस्थिति का संकेत मानकर ‘पहली बार आप लोग नहीं थे’ किया गया है।
  alternative: ‘क्योंकि पहले हमारे परमेश्वर यहोवा ने हम पर प्रहार किया’ अथवा ‘क्योंकि पहली बार आप उसे उठा नहीं रहे थे।’
  rationale: इब्रानी रचना संकुचित है। पद 2, 12–15 लेवियों की पूर्व अनुपस्थिति और अब उनके द्वारा सन्दूक उठाए जाने को सामने रखते हैं। मुख्य पाठ प्रसंगगत अर्थ स्पष्ट करता है, पर ‘उठा नहीं रहे थे’ जोड़कर आवश्यकता से अधिक निश्चित नहीं बनता।
- issue: פָּרַץ में दैवी कार्य की प्रकृति
  choice: अचानक दैवी न्याय को ‘प्रकोप ... फूट पड़ा’ से व्यक्त किया गया है।
  alternative: ‘यहोवा ने हमारे बीच दरार डाली’ या ‘हम पर टूट पड़ा।’
  rationale: अनुवाद परमेश्वर की पवित्रता और न्याय की गंभीरता को बनाए रखता है तथा मूल क्रिया के ‘फूट पड़ने’ वाले चित्र को भी हिन्दी में सुनाई देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘निर्धारित विधि’ धार्मिक-विधिक अर्थ रखता है, पर अत्यधिक तकनीकी नहीं है। वाक्य में कारण-संबंध स्पष्ट करने के लिए ‘इसलिए’ जोड़ा गया है।
