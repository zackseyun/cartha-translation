base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/015/016.yaml
  text: Then David told the leaders of the Levites to appoint their brothers, the singers, with musical instruments—harps, lyres, and cymbals—sounding aloud, to raise songs of joy.
translation:
  language: hi
  text: तब दाऊद ने लेवियों के प्रधानों से कहा कि वे अपने भाइयों[a], अर्थात् गायकों को संगीत के वाद्यों—वीणाओं, लायरों और झाँझों—के साथ नियुक्त करें, जो ऊँचे स्वर में आनन्द मनाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अपने भाइयों’ से आशय उनके साथी लेवियों से है।
    reason: cultural_note
  - marker: b
    text: या, ‘आनन्द के लिए स्वर ऊँचा करें।’ इब्रानी में शाब्दिक रूप से ‘ध्वनि/स्वर के साथ उठाना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִיד
  choice: तब दाऊद ने ... कहा
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है। आदेश के आशय को अगले ‘कि वे ... नियुक्त करें’ वाक्यांश में स्पष्ट किया गया है।
- source_word: לְשָׂרֵי הַלְוִיִּם
  choice: लेवियों के प्रधानों से
  rationale: שָׂרֵי यहाँ समुदाय के अगुओं या अधिकारियों को सूचित करता है; ‘प्रधान’ वर्तमान हिन्दी में गरिमापूर्ण और सन्दर्भानुकूल है।
- source_word: לְהַעֲמִיד
  choice: नियुक्त करें
  rationale: עמד के हिफ़ील रूप का अर्थ खड़ा करना, ठहराना या पद पर नियुक्त करना हो सकता है। उपासना-संगीत की संगठित सेवा के इस सन्दर्भ में ‘नियुक्त करना’ उपयुक्त है।
- source_word: אֶת אֲחֵיהֶם
  choice: अपने भाइयों
  rationale: मूल पाठ का सीधा संबंधसूचक शब्द सुरक्षित रखा गया है; यहाँ उसका आशय उन्हीं के साथी लेवियों से है।
- source_word: הַמְשֹׁרְרִים
  choice: गायकों
  rationale: यह שׁיר से बना कृदन्त है और सामान्य संगीतकारों के बजाय विशेष रूप से गानेवालों को दर्शाता है।
- source_word: בִּכְלֵי שִׁיר
  choice: संगीत के वाद्यों ... के साथ
  rationale: शाब्दिक ‘गीत के उपकरण’ की अपेक्षा यह सहज हिन्दी है और संगीत में प्रयुक्त साधनों का अर्थ बनाए रखती है।
- source_word: נְבָלִים
  choice: वीणाओं
  rationale: प्राचीन נֶבֶל की ठीक बनावट अनिश्चित है; ‘वीणा’ हिन्दी पाठक के लिए तार वाले प्राचीन वाद्य का सहज, व्यापक समतुल्य है।
- source_word: כִנֹּרוֹת
  choice: लायरों
  rationale: כִּנּוֹר को सामान्यतः lyre माना जाता है। ‘लायर’ कहने से इसे נֶבֶל के लिए प्रयुक्त ‘वीणा’ से अलग रखा गया है और किसी आधुनिक भारतीय वाद्य से गलत समानता नहीं जोड़ी गई।
- source_word: מְצִלְתָּיִם
  choice: झाँझों
  rationale: यह झाँझ जैसे परस्पर टकराकर बजाए जानेवाले वाद्य का सामान्य और स्पष्ट हिन्दी नाम है।
- source_word: מַשְׁמִיעִים
  choice: ऊँची ध्वनि करते हुए
  rationale: שׁמע का हिफ़ील कृदन्त ‘सुनाई देना/सुनाना’ या ध्वनि उत्पन्न करना व्यक्त करता है। यह अनुवाद सार्वजनिक रूप से सुनाई देनेवाली ध्वनि को रखता है, पर बजाने की किसी अनुल्लिखित रीति को नहीं जोड़ता।
- source_word: לְהָרִים בְּקוֹל לְשִׂמְחָה
  choice: आनन्द से स्वर उठाएँ
  rationale: ‘स्वर उठाना’ मूल के ‘आवाज़/ध्वनि के साथ ऊपर उठाना’ को निकटता से व्यक्त करता है। ‘आनन्द से’ לְשִׂמְחָה का स्वाभाविक हिन्दी रूप है और ‘गीत’ जैसा कोई स्पष्टतः अनुपस्थित कर्म नहीं जोड़ता।
