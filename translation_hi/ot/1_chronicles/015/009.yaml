lexical_decisions:
- source_word: לִבְנֵי
  choice: के वंशजों में से
  rationale: वंश-सूची के इस संदर्भ में לִבְנֵי किसी कुल के सदस्यों का परिचय देता है। शाब्दिक ‘पुत्रों’ की अपेक्षा ‘वंशजों’ से आधुनिक हिन्दी में अभिप्राय अधिक स्वाभाविक और स्पष्ट होता है।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: व्यक्ति अथवा कुल का नाम; प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֱלִיאֵל
  choice: एलीएल
  rationale: व्यक्तिनाम को हिन्दी में ध्वन्यात्मक रूप से लिप्यंतरित किया गया है।
- source_word: הַשָּׂר
  choice: प्रधान
  rationale: שַׂר यहाँ कुल-समूह के अगुए या अधिकारी को दर्शाता है। ‘प्रधान’ पद और नेतृत्व का भाव देता है, पर राजकीय या सैनिक अर्थ अनावश्यक रूप से नहीं जोड़ता।
- source_word: וְאֶחָיו
  choice: और उसके ... भाई
  rationale: मूल का शाब्दिक अर्थ ‘और उसके भाई’ है। कुल-सूची में इसका आशय पुरुष कुल-संबंधियों से भी हो सकता है; यह संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: שְׁמוֹנִים
  choice: अस्सी
  rationale: एलीएल के साथ गिने गए पुरुषों की संख्या बताने वाला मूल अंक है।
