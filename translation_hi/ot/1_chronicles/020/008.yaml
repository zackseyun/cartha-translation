source:
  edition: WLC
  text: אֵ֛ל נוּלְּד֥וּ לְ/הָ/רָפָ֖א בְּ/גַ֑ת וַ/יִּפְּל֥וּ בְ/יַד דָּוִ֖יד וּ/בְ/יַד עֲבָדָֽי/ו־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/008.yaml
  text: These were born to Rapha in Gath[a], and they fell by the hand of David and by the hand of his servants.
translation:
  language: hi
  text: ये गत में राफा[a] से उत्पन्न हुए थे, और वे दाऊद और उसके सेवकों के हाथों मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उस राफा’। संभवतः यह रपाइयों नामक वंश, अर्थात् गत के दैत्याकार लोगों के कुल, की ओर संकेत करता है।
    reason: ‘राफा’ किसी व्यक्तिगत पूर्वज या किसी वंश-समूह का नाम हो सकता है; मूल पाठ इस पहचान को पूरी तरह स्पष्ट नहीं करता।
lexical_decisions:
- source_word: אֵל
  choice: ये
  rationale: यह संकेतवाचक शब्द पिछले पदों में बताए गए योद्धाओं की ओर लौटता है; ‘ये’ बिना अनावश्यक रूप से ‘पुरुष’ जोड़े अर्थ स्पष्ट करता है।
- source_word: נוּלְּדוּ
  choice: उत्पन्न हुए थे
  rationale: निफ़ाल रूप का मूल अर्थ ‘जन्म लेना’ है। ‘उत्पन्न हुए थे’ हिंदी में जन्म और वंश—दोनों संभावनाओं को खुला रखता है।
- source_word: לְהָרָפָא
  choice: रापा से
  rationale: यह रूप किसी रापा नामक पूर्वज अथवा रापा कहलाने वाले वंश का संकेत हो सकता है। ‘रापा से’ इस संबंध को व्यक्त करता है, पर इसे सीधे ‘दैत्य’ या बहुवचन ‘रपाई’ नहीं बनाता।
- source_word: בְּגַת
  choice: गत में
  rationale: स्थानसूचक בְּ का सीधा और स्वाभाविक हिंदी रूप।
- source_word: וַיִּפְּלוּ
  choice: मारे गए
  rationale: נפל का शाब्दिक अर्थ ‘गिरना’ है, किंतु युद्ध-वर्णन में यहाँ इसका आशय मृत्यु से है; हिंदी में ‘मारे गए’ प्रसंग को स्वाभाविक और स्पष्ट बनाता है।
- source_word: בְיַד
  choice: के हाथों
  rationale: यह इब्रानी मुहावरा कर्तृत्व या माध्यम बताता है; ‘के हाथों’ हिंदी में उसी युद्ध-संबंधी भाव को बनाए रखता है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: עבד का मूल अर्थ ‘सेवक’ है। राजकीय-सैनिक संदर्भ में ये दाऊद की सेवा में रहने वाले योद्धा हो सकते हैं, पर ‘सेवक’ मूल शब्द के व्यापक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: הָרָפָא की पहचान
  choice: इसे ‘रापा’ के रूप में रखा गया है, जिससे किसी पूर्वज या वंश का संकेत संभव बना रहता है।
  alternative: ‘दैत्य’, ‘रपाई’ अथवा ‘रपाइयों का वंश’
  rationale: इब्रानी रूप एकवचन और निश्चित उपपद सहित है; वह बहुवचन जातिनाम ‘रपाई’ को स्पष्ट रूप से नहीं लिखता। इसलिए मुख्य पाठ में अधिक निश्चित पहचान थोपे बिना संभावित दैत्याकार वंश-संबंध को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का संक्षिप्त, गरिमापूर्ण और सहज रूप अपनाया गया है। ‘रापा’ की अस्पष्ट पहचान को मुख्य पाठ में सुरक्षित रखा गया है और आवश्यक ऐतिहासिक-सांस्कृतिक संकेत पादटिप्पणी में दिया गया है।
