base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/004.yaml
  text: After this[a], war arose at Gezer with the Philistines. Then Sibbecai the Hushathite struck down Sippai, one of the descendants of the Rephaim[b], and they were subdued.
translation:
  language: hi
  text: 'इसके बाद गेजेर में पलिश्तियों के साथ युद्ध छिड़ गया। तब हूशावासी सिब्बकै ने रपाईम[b] के वंशजों में से सिप्पै[a] को मार गिराया, और वे अधीन किए गए।


    [a] इब्रानी नाम का एक अन्य रूप “सप्पै” भी मिलता है।

    [b] इब्रानी में “रपाईम”; इसका पारंपरिक अनुवाद “दैत्य” भी किया जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी नाम का एक अन्य रूप “सप्पै” भी मिलता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “रपाईम”; इसका पारंपरिक अनुवाद “दैत्य” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह कथात्मक समय-संक्रमण को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है; ‘और ऐसा हुआ’ को अलग से रखना आवश्यक नहीं है।
- source_word: וַתַּעֲמֹד מִלְחָמָה
  choice: युद्ध छिड़ गया
  rationale: עמד और מלחמה का यह संयोग युद्ध के आरम्भ होने को व्यक्त करता है; ‘युद्ध छिड़ गया’ सहज हिन्दी है।
- source_word: בְּגֶזֶר
  choice: गेजेर में
  rationale: युद्ध के स्थान के लिए हिन्दी में ‘में’ स्वाभाविक है; स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: עִם פְּלִשְׁתִּים
  choice: पलिश्तियों के साथ
  rationale: עם का मूल अर्थ ‘के साथ’ सुरक्षित रखा गया है; युद्ध का प्रसंग विरोध का भाव स्पष्ट करता है।
- source_word: הִכָּה
  choice: मार गिराया
  rationale: युद्ध के प्रसंग में נכה प्रहार करके गिराने अथवा मार डालने का भाव रखता है; यह चयन उसके सैन्य बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סִבְּכַי הַחֻשָׁתִי
  choice: हूशावासी सिब्बकै
  rationale: व्यक्तिनाम और स्थान/समुदाय-सूचक विशेषण का लिप्यंतरण किया गया है; ‘हूशावासी’ हिन्दी में संबंध को स्पष्ट करता है।
- source_word: סִפַּי
  choice: सिप्पै
  rationale: मसोरेटी स्वरांकन के निकट लिप्यंतरण चुना गया है; वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִילִדֵי הָרְפָאִים
  choice: रपाइयों के वंशजों में से
  rationale: ילידי वंश से उत्पन्न लोगों को दर्शाता है। הָרְפָאִים को व्याख्यात्मक ‘दैत्य’ बनाने के बजाय समुदाय/वंश के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וַיִּכָּנֵעוּ
  choice: वे दबा दिए गए
  rationale: כנע के निफ़अल रूप का सैन्य प्रसंग में अर्थ पराजित करके अधीन या दबा देना है; बहुवचन ‘वे’ की अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: הָרְפָאִים का अनुवाद
  choice: रपाइयों
  alternative: दैत्यों
  rationale: यह शब्द किसी जाति या वंश का नाम हो सकता है; लिप्यंतरण मूल की अनिश्चितता बनाए रखता है और शरीराकार संबंधी अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- issue: וַיִּכָּנֵעוּ में बहुवचन कर्ता
  choice: वे दबा दिए गए
  alternative: पलिश्ती दबा दिए गए
  rationale: इब्रानी में कर्ता केवल बहुवचन सर्वनाम से निहित है। सम्भावित संदर्भ पलिश्तियों की ओर है, पर मुख्य पाठ में उसे स्पष्ट करके मूल की संदर्भगत अस्पष्टता मिटाई नहीं गई।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘गेजेर’, ‘सिब्बकै’, ‘सिप्पै’ और ‘रपाई’ मूल इब्रानी के निकट लिप्यंतरण हैं। मुख्य पाठ में केवल उसी पादटिप्पणी का चिह्न रखा गया है जो वास्तविक नाम-रूप विकल्प समझाती है; ‘रपाई’ के अर्थ-संबंधी निर्णय को शब्दावली और धर्मवैचारिक टिप्पणियों में दर्ज किया गया है।
