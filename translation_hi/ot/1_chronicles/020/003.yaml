base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/003.yaml
  text: He brought out the people who were in it and put them to work with saws[a], iron tools, and axes. Thus David did to all the cities of the Ammonites[b]. Then David and all the people returned to Jerusalem.
translation:
  language: hi
  text: उसने उसमें रहने वाले लोगों को बाहर निकाला और उन्हें आरों, लोहे के औज़ारों और कुल्हाड़ियों से काम पर लगाया।[a][b] दाऊद ने अम्मोनियों के सभी नगरों के साथ ऐसा ही किया। फिर दाऊद और उसके साथ के सभी लोग यरूशलेम लौट आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “उन्हें आरों, दाँवने के लोहे के तख्तों और काटने के औज़ारों के नीचे रखा।” कुछ लोग, 2 शमूएल 12:31 के समानान्तर वर्णन के आधार पर, इसका अर्थ यह लेते हैं कि दाऊद ने इन औज़ारों से उनकी हत्या की।
    reason: alternative_reading
  - marker: b
    text: इन औज़ारों के लिए प्रयुक्त कुछ इब्रानी शब्दों का सटीक अर्थ अनिश्चित है; वे सामान्य रूप से लोहे के धारदार या काटने वाले उपकरणों को सूचित कर सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹצִיא
  choice: बाहर निकाला
  rationale: הוֹצִיא, יצא का हिफ़ील रूप, सामान्यतः किसी को बाहर निकालने या ले आने का अर्थ देता है; यहाँ नगर के निवासियों को बाहर निकाले जाने की ठोस क्रिया व्यक्त होती है।
- source_word: וַיָּשַׂר
  choice: काम पर लगाया
  rationale: यह क्रिया कठिन और विवादित है। इतिहासवृत्त की अपनी शब्दावली में इसे सूचीबद्ध औज़ारों से श्रम कराने के अर्थ में समझा जा सकता है; इसलिए मुख्य पाठ में यही सहज अर्थ रखा गया है, जबकि हिंसक वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- source_word: בַּמְּגֵרָה
  choice: आरों से
  rationale: מְגֵרָה का अर्थ ‘आरा’ है। औज़ारों की सूची के अनुरूप हिन्दी में बहुवचन स्वाभाविक है।
- source_word: בַּחֲרִיצֵי הַבַּרְזֶל
  choice: लोहे के औज़ारों से
  rationale: यह पद धारदार लोहे के उपकरणों या सम्भवतः दाँवने के पाटों का संकेत दे सकता है। सटीक उपकरण अनिश्चित होने के कारण सामान्य पद ‘लोहे के औज़ार’ चुना गया है।
- source_word: וּבַמְּגֵרוֹת
  choice: और कुल्हाड़ियों से
  rationale: इस रूप का सटीक अर्थ कठिन है और यह पहले आए ‘आरे’ के समान भी दिखता है; सन्दर्भ में एक अन्य काटने के औज़ार के रूप में ‘कुल्हाड़ियाँ’ पठनीय विकल्प है, और अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
- source_word: וְכֵן יַעֲשֶׂה
  choice: ऐसा ही किया
  rationale: यह वाक्यांश अम्मोनी नगरों के प्रति दाऊद की समान कार्रवाई का सार देता है। हिन्दी कथा-शैली में ‘ऐसा ही किया’ संक्षिप्त और स्वाभाविक है।
- source_word: לְכֹל עָרֵי בְנֵי עַמּוֹן
  choice: अम्मोनियों के सभी नगरों के साथ
  rationale: בְנֵי עַמּוֹן के लिए प्रचलित हिन्दी जातिनाम ‘अम्मोनी’ है; לְ को यहाँ व्यवहार के लक्ष्य के अर्थ में ‘के साथ’ से व्यक्त किया गया है।
- source_word: וַיָּשָׁב ... יְרוּשָׁלִָם
  choice: यरूशलेम लौट आए
  rationale: गन्तव्य के साथ שוב का सामान्य कथात्मक अर्थ ‘लौटना’ है। संयुक्त कर्ता के अनुरूप हिन्दी में बहुवचन क्रिया रखी गई है।
theological_decisions:
- issue: क्या पद अम्मोनियों से बेगार कराने या उन्हें औज़ारों से मार डालने का वर्णन करता है
  choice: मुख्य पाठ में बन्दी बनाए गए लोगों को इन औज़ारों से काम पर लगाए जाने का अर्थ रखा गया है।
  alternative: विशेषतः 2 शमूएल 12:31 के समानान्तर वर्णन के प्रभाव में इसे आरों और लोहे के औज़ारों से उनकी हत्या किए जाने के अर्थ में भी समझा जाता है।
  rationale: 1 इतिहास की इब्रानी शब्दावली 2 शमूएल के समानान्तर पाठ से भिन्न है और श्रम कराने का अर्थ स्वीकार करती है। इसलिए दूसरे पाठ की अधिक हिंसक शब्दावली यहाँ आरोपित नहीं की गई; फिर भी वास्तविक और धर्मवैचारिक रूप से महत्त्वपूर्ण अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण कथात्मक शैली में रखी गई है। ‘काम पर लगाया’ सामान्य पाठक के लिए स्पष्ट है, जबकि विवादित हिंसक अर्थ और औज़ारों की शब्दगत अनिश्चितता पादटिप्पणियों में सुरक्षित हैं।
