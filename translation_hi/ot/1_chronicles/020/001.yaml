source:
  edition: WLC
  text: וַ/יְהִ֡י לְ/עֵת֩ תְּשׁוּבַ֨ת הַ/שָּׁנָ֜ה לְ/עֵ֣ת צֵ֣את הַ/מְּלָכִ֗ים וַ/יִּנְהַ֣ג יוֹאָב֩ אֶת חֵ֨יל הַ/צָּבָ֜א וַ/יַּשְׁחֵ֣ת אֶת אֶ֣רֶץ בְּנֵֽי עַמּ֗וֹן וַ/יָּבֹא֙ וַ/יָּ֣צַר אֶת רַבָּ֔ה וְ/דָוִ֖יד יֹשֵׁ֣ב בִּ/ירֽוּשָׁלִָ֑ם וַ/יַּ֥ךְ יוֹאָ֛ב אֶת רַבָּ֖ה וַ/יֶּֽהֶרְסֶֽ/הָ׀־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/001.yaml
  text: And it happened at the time of the turning of the year[a], at the time when kings go out, that Joab led out the army and devastated the land of the Ammonites, and he came and besieged Rabbah. But David stayed in Jerusalem. And Joab struck Rabbah and tore it down.
translation:
  language: hi
  text: वर्ष के लौटने के समय[a], जब राजा निकलते हैं, योआब सेना को लेकर निकला और अम्मोनियों के देश को उजाड़ दिया। वह आया और रब्बा को घेर लिया। पर दाऊद यरूशलेम में ही रहा। योआब ने रब्बा पर आक्रमण किया और उसे ढहा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, “वसंत ऋतु में, जब राजा युद्ध करने निकलते हैं।” इब्रानी का अधिक शाब्दिक अर्थ है, “वर्ष के लौटने के समय, उस समय जब राजा निकलते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּשׁוּבַת הַשָּׁנָה
  choice: वर्ष के लौटने के समय
  rationale: इब्रानी मुहावरे में वर्ष के लौटने या फिरने का भाव है। यह अनुवाद मुख्य पाठ में 'वसंत' जोड़कर समय को आवश्यकता से अधिक निश्चित नहीं करता; व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְעֵת צֵאת הַמְּלָכִים
  choice: उस समय जब राजा निकलते हैं
  rationale: मूल में निकलने का उद्देश्य व्यक्त नहीं है। सैन्य प्रसंग स्पष्ट है, फिर भी 'युद्ध करने' को मुख्य पाठ में न जोड़कर मूल की संक्षिप्तता और निहितार्थ सुरक्षित रखा गया है।
- source_word: וַיִּנְהַג ... אֶת חֵיל הַצָּבָא
  choice: योआब सेना को लेकर निकला
  rationale: क्रिया सेना को आगे ले जाने का बोध कराती है। आधुनिक हिन्दी में यह प्रयोग स्वाभाविक ढंग से योआब के नेतृत्व और सैन्य प्रस्थान दोनों को व्यक्त करता है।
- source_word: וַיַּשְׁחֵת אֶת אֶרֶץ בְּנֵי עַמּוֹן
  choice: अम्मोनियों के देश को उजाड़ दिया
  rationale: क्रिया नष्ट या बरबाद करने को दर्शाती है; सैन्य अभियान द्वारा भूभाग की तबाही के लिए 'उजाड़ दिया' स्पष्ट और स्वाभाविक है। 'अम्मोनी' हिन्दी में प्रचलित जातिनाम है।
- source_word: וַיָּצַר
  choice: घेर लिया
  rationale: सैन्य संदर्भ में नगर की घेराबंदी अर्थ है। 'घेर लिया' सामान्य आधुनिक हिन्दी में सहज है और घेराबंदी का भाव देता है।
- source_word: וְדָוִיד יֹשֵׁב בִּירוּשָׁלִָם
  choice: पर दाऊद यरूशलेम में ही रहा
  rationale: कृदन्त यहाँ जारी स्थिति दर्शाता है। 'ही रहा' दाऊद के पीछे ठहरे रहने और योआब की सक्रियता के साथ निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּךְ
  choice: आक्रमण किया
  rationale: व्यापक क्रिया का अर्थ मारना, प्रहार करना या परास्त करना हो सकता है। नगर के संदर्भ में 'आक्रमण किया' स्वाभाविक है और अगले वाक्यांश से पहले पूर्ण विजय को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיֶּהֶרְסֶהָ
  choice: उसे ढहा दिया
  rationale: क्रिया किसी संरचना या नगर को गिराने या ध्वस्त करने का भाव देती है। 'ढहा दिया' पहले प्रयुक्त 'उजाड़ दिया' से अलग शब्दावली रखते हुए परिणाम को सजीव ढंग से बताता है।
- source_word: רַבָּה
  choice: रब्बा
  rationale: नगर के नाम का प्रचलित देवनागरी लिप्यंतरण रखा गया है।
