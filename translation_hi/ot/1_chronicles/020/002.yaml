source:
  edition: WLC
  text: וַ/יִּקַּ֣ח דָּוִ֣יד אֶת עֲטֶֽרֶת מַלְכָּ/ם֩ מֵ/עַ֨ל רֹאשׁ֜/וֹ וַֽ/יִּמְצָאָ֣/הּ מִשְׁקַ֣ל כִּכַּר זָהָ֗ב וּ/בָ/הּ֙ אֶ֣בֶן יְקָרָ֔ה וַ/תְּהִ֖י עַל רֹ֣אשׁ דָּוִ֑יד וּ/שְׁלַ֥ל הָ/עִ֛יר הוֹצִ֖יא הַרְבֵּ֥ה מְאֹֽד־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/002.yaml
  text: And David took the crown of their king from his head and found that it weighed a talent of gold, and in it was a precious stone; and it was placed on David’s head. And he carried off very much plunder from the city.
translation:
  language: hi
  text: दाऊद ने उनके राजा के सिर से उसका मुकुट उतार लिया[a]। उसने पाया कि उसका वज़न सोने का एक किक्कार था[b], और उसमें एक बहुमूल्य रत्न था। वह मुकुट दाऊद के सिर पर था। दाऊद नगर से बहुत बड़ी मात्रा में लूट का माल ले गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिल्कोम” (या “मल्काम”) का मुकुट। इब्रानी शब्द को अम्मोनियों के देवता के नाम के रूप में भी पढ़ा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: किक्कार प्राचीन काल में भार की एक बड़ी इकाई थी। इसे प्रायः लगभग 34 किलोग्राम माना जाता है, हालाँकि इसका ठीक भार अलग-अलग हो सकता था।
    reason: cultural_note
lexical_decisions:
- source_word: עֲטֶרֶת
  choice: मुकुट
  rationale: राजकीय सिरोभूषण के लिए आधुनिक मानक हिन्दी का सहज और स्पष्ट शब्द।
- source_word: מַלְכָּם
  choice: उनके राजा
  rationale: रूपरचना इसे ‘उनका राजा’ समझने का स्वाभाविक आधार देती है और ‘उसके सिर से’ निकटवर्ती मानवीय संदर्भ के अनुकूल है; देवता के नाम वाली सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וַיִּמְצָאָהּ מִשְׁקַל כִּכַּר זָהָב
  choice: उसने पाया कि उसका वज़न एक किक्कार सोना था
  rationale: ‘पाया’ में खोजे गए भार का भाव रखते हुए प्राचीन माप को आधुनिक इकाई में बदलने के बजाय मूल नाम सुरक्षित रखा गया है।
- source_word: אֶבֶן יְקָרָה
  choice: एक बहुमूल्य रत्न
  rationale: पत्थर के मूल्यवान होने का अर्थ स्पष्ट करता है, पर रत्न का प्रकार अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַתְּהִי עַל רֹאשׁ דָּוִיד
  choice: वह मुकुट दाऊद के सिर पर रखा गया
  rationale: संदर्भ में मुकुट के दाऊद के सिर पर आने का परिणाम स्वाभाविक हिन्दी में व्यक्त होता है; संज्ञा दोहराने से सर्वनाम का संदर्भ स्पष्ट रहता है।
- source_word: וּשְׁלַל הָעִיר הוֹצִיא הַרְבֵּה מְאֹד
  choice: दाऊद नगर से बहुत बड़ी मात्रा में लूट का माल भी ले गया
  rationale: युद्ध-संदर्भ में שָׁלָל के लिए ‘लूट का माल’ और הוֹצִיא के लिए ‘ले गया’ सहज आधुनिक हिन्दी हैं; तीव्र मात्रा भी सुरक्षित है।
theological_decisions:
- issue: מַלְכָּם का अर्थ ‘उनका राजा’ है या अम्मोनियों के देवता मिल्कोम/मल्काम का नाम
  choice: उनके राजा
  alternative: मिल्कोम (या मल्काम)
  rationale: ‘उसके सिर से’ वाला वाक्य-विन्यास राजकीय व्यक्ति की ओर सहज संकेत करता है, पर व्यंजन-पाठ देवता के नाम के रूप में भी समझा जा सकता है; इसलिए वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: וַתְּהִי עַל רֹאשׁ דָּוִיד में क्रिया की स्पष्टता
  choice: दाऊद के सिर पर रखा गया
  alternative: दाऊद के सिर पर था
  rationale: मुख्य पाठ में प्रसंगानुकूल परिणामी क्रिया स्वाभाविक हिन्दी में दी गई है, यद्यपि इब्रानी का अधिक शाब्दिक अर्थ ‘दाऊद के सिर पर था’ है; कोई अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘किक्कार’ को प्राचीन इकाई के रूप में रखा गया और पादटिप्पणी में अनुमानित आधुनिक भार दिया गया। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
