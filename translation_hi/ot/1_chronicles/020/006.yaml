base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/006.yaml
  text: And there was war again at Gath[a], and there was a man of great size whose fingers and toes were six each, twenty-four in all; he also was born to Rapha.
translation:
  language: hi
  text: फिर गत में युद्ध हुआ। वहाँ एक बहुत बड़े डील-डौल का मनुष्य था, जिसके हाथों और पैरों में छह-छह उँगलियाँ थीं—कुल चौबीस। वह भी राफा से जन्मा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह भी उस दैत्य का वंशज था,” अथवा “वह भी रफाइयों में से था।” हिब्रू का शाब्दिक अर्थ है, “वह भी राफा से जन्मा था।”
    reason: הָרָפָא किसी नामित पूर्वज, कुल-संज्ञा अथवा रफाई दैत्यों के संकेत के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: עוֹד
  choice: फिर
  rationale: कथानक में युद्ध की पुनरावृत्ति दिखाता है; आधुनिक हिन्दी में ‘फिर’ स्वाभाविक है।
- source_word: מִלְחָמָה
  choice: युद्ध
  rationale: यह व्यापक सशस्त्र संघर्ष का सामान्य शब्द है; प्रसंग के सार-वर्णन के अनुकूल है।
- source_word: בְּגַת
  choice: गत में
  rationale: בְּ स्थान सूचित करता है; हिन्दी में नगर के साथ ‘में’ सहज है।
- source_word: אִישׁ מִדָּה
  choice: एक बहुत बड़े डील-डौल का मनुष्य
  rationale: शाब्दिक अर्थ ‘नाप/कद-काठी वाला मनुष्य’ है और प्रसंग असाधारण शारीरिक आकार बताता है; यह अनुवाद अर्थ स्पष्ट करता है, पर सीधे ‘दैत्य’ नहीं कहता।
- source_word: אֶצְבְּעֹתָיו
  choice: उसके हाथों और पैरों में ... उँगलियाँ
  rationale: शब्द सामान्यतः उँगलियाँ कहता है, पर चौबीस की कुल संख्या और समानांतर वर्णन से हाथ और पैर दोनों अभिप्रेत हैं; हिन्दी में दोनों को स्पष्ट करना आवश्यक है।
- source_word: שֵׁשׁ וָשֵׁשׁ
  choice: छह-छह
  rationale: हिब्रू की वितरणात्मक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: עֶשְׂרִים וְאַרְבַּע
  choice: कुल चौबीस
  rationale: यह पहले दिए वितरण का योग है; ‘कुल’ संबंध स्पष्ट करता है।
- source_word: וְגַם הוּא
  choice: वह भी
  rationale: प्रसंग के अन्य योद्धाओं के समान उसके संबंध/वंश को चिह्नित करता है।
- source_word: נוֹלַד לְהָרָפָא
  choice: राफा का वंशज था
  rationale: शाब्दिक रूप ‘राफा के लिए/से जन्मा’ वंश-संबंध व्यक्त करता है। मुख्य पाठ में राफा का लिप्यंतरण मूल की अस्पष्ट पहचान को बनाए रखता है।
theological_decisions:
- issue: הָרָפָא की पहचान
  choice: ‘राफा’ को पूर्वज अथवा कुल-संज्ञा के रूप में लिप्यंतरित करना
  alternative: ‘दैत्य का वंशज’ अथवा ‘रफाइयों में से एक’
  rationale: हिब्रू रूप एकवचन और निश्चित लेख सहित है, पर यह स्पष्ट नहीं कि वह किसी पूर्वज, कुल अथवा दैत्य-समूह का संकेत है। लिप्यंतरण इस वास्तविक अस्पष्टता को बचाता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘डील-डौल’ असाधारण आकार को स्वाभाविक हिन्दी में व्यक्त करता है। हाथ-पैर की उँगलियों को अलग-अलग स्पष्ट किया गया है, क्योंकि हिन्दी में केवल ‘उँगलियाँ’ कहने से पैर अभिप्रेत होना स्पष्ट नहीं होगा।
