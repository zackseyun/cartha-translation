  text: And when he taunted Israel[a], Jonathan son of Shimea, David’s brother, struck him down.
translation:
  language: hi
  text: जब उसने इस्राएल को ललकारा[a], तब दाऊद के भाई शिमा के पुत्र योनातान ने उसे मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल का अपमान किया।” इब्रानी क्रिया तिरस्कारपूर्ण निंदा या खुली चुनौती, दोनों का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְחָרֵף
  choice: ललकारा
  rationale: यहाँ חרף तिरस्कारपूर्ण निंदा या खुली चुनौती, दोनों का भाव दे सकता है। युद्ध-संदर्भ में “ललकारा” स्वाभाविक आधुनिक हिन्दी है और शत्रुतापूर्ण वाणी तथा चुनौती के भाव को समेटता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: इब्रानी में सीधा कर्म राष्ट्रीय इकाई “इस्राएल” है, जो सामूहिक रूप से इस्राएली लोगों को सूचित करता है; इसलिए मूल अभिव्यक्ति बनाए रखी गई है।
- source_word: וַיַּכֵּהוּ
  choice: उसे मार गिराया
  rationale: נכה का यह रूप प्रहार करने को बताता है और प्रसंग में परिणाम घातक है। “मार गिराया” आधुनिक हिन्दी में क्रिया और उसके परिणाम दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: בֶּן שִׁמְעָא
  choice: शिमा के पुत्र
  rationale: वंश-संबंध को निकटता से रखते हुए व्यक्तिनाम का सहज हिन्दी लिप्यंतरण किया गया है।
- source_word: אֲחִי דָוִיד
  choice: दाऊद के भाई
  rationale: सम्बन्धवाचक संरचना का स्वाभाविक हिन्दी रूप, जो शिमा को दाऊद का भाई बताता है।
