base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/020/005.yaml
  text: And there was war with the Philistines again[a], and Elhanan son of Jair struck down Lahmi, the brother of Goliath the Gittite, whose spear shaft was like a weaver’s beam.
translation:
  language: hi
  text: फिर पलिश्तियों के साथ युद्ध हुआ[a], और याईर के पुत्र एल्हानान ने गतवासी गोलियत के भाई लहमी को मार गिराया। लहमी के भाले का डंडा जुलाहे के करघे की बीम के समान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 शमूएल 21:19 के समानांतर वर्णन का हिब्रू पाठ कठिन है और इस पद के संबंध में प्रायः उसकी चर्चा की जाती है; 1 इतिहास यहाँ स्पष्ट रूप से कहता है कि एल्हानान ने गोलियत के भाई लहमी को मारा।
    reason: textual_variant
lexical_decisions:
- source_word: וַתְּהִי עוֹד מִלְחָמָה
  choice: फिर ... युद्ध हुआ
  rationale: עוֹד इस क्रम में एक और युद्ध की घटना बताता है; ‘फिर’ आधुनिक हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת פְּלִשְׁתִּים
  choice: पलिश्तियों के साथ
  rationale: संघर्ष के प्रसंग में אֶת विरोधी पक्ष को सूचित करता है; ‘के साथ युद्ध’ हिन्दी में स्वाभाविक है।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: נכה के प्रहार करने के बिंब और इस युद्ध-प्रसंग में मृत्यु के परिणाम—दोनों को व्यक्त करता है।
- source_word: אֶלְחָנָן בֶּן יעור
  choice: याईर के पुत्र एल्हानान
  rationale: हिब्रू वंश-सूचक संरचना और पारंपरिक व्यक्तिनामों को स्पष्ट हिन्दी क्रम में रखा गया है।
- source_word: אֶת לַחְמִי
  choice: लहमी को
  rationale: मसोरेटिक स्वरांकन के अनुसार לַחְמִי को व्यक्तिनाम माना गया है; אֶת कर्म-चिह्न को हिन्दी के ‘को’ से व्यक्त किया गया है।
- source_word: אֲחִי גָּלְיָת הַגִּתִּי
  choice: गती गोलियत के भाई
  rationale: अर्थ है ‘गती निवासी गोलियत का भाई’; ‘गती’ भौगोलिक/जातिवाचक पहचान को संक्षेप में सुरक्षित रखता है।
- source_word: וְעֵץ חֲנִיתוֹ
  choice: लहमी के भाले का डंडा
  rationale: शाब्दिक ‘उसके भाले की लकड़ी’ का स्वाभाविक हिन्दी रूप है; संज्ञा दोहराने से सर्वनाम-संदर्भ स्पष्ट रहता है।
- source_word: כִּמְנוֹר אֹרְגִים
  choice: जुलाहे की धरन के समान
  rationale: מְנוֹר करघे की भारी धरन/बीम है; यह तुलना भाले के असाधारण मोटे डंडे का ठोस बिंब बनाए रखती है।
theological_decisions:
- issue: 2 शमूएल 21:19 के कठिन समानांतर पाठ से इस पद का संबंध
  choice: इतिहास की स्पष्ट शब्दावली के अनुसार एल्हानान ने गोलियत के भाई लहमी को मारा।
  alternative: शमूएल के कठिन पाठ के आधार पर इस पद में संशोधन करना या लहमी को ‘बेतलेहेमी’ के अंश के रूप में पढ़ना।
  rationale: यहाँ का हिब्रू पाठ लहमी को स्पष्ट रूप से गोलियत का भाई कहता है। अनुवाद उसी अर्थ को रखता है और समानांतर पाठ की कठिनाई को पादटिप्पणी में बताता है, बिना उसे चुपचाप सुलझाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मार गिराया’ युद्ध का बिंब बनाए रखता है; ‘धरन’ अपेक्षाकृत विशिष्ट करघा-शब्द है, पर संदर्भ में ‘जुलाहे की’ से उसका अर्थ समझने योग्य रहता है।
