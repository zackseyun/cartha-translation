  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। व्यक्तिनाम और स्थाननाम प्रचलित हिन्दी बाइबलीय रूपों के निकट रखे गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाया गया है।
