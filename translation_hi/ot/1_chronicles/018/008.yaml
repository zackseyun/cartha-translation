base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/008.yaml
  text: And from Tibhath and from Cun, cities of Hadadezer, David took a very great amount of bronze; with it Solomon made the bronze sea, the pillars, and the bronze articles.
translation:
  language: hi
  text: और हददेजेर के नगरों तिभहत और कून से दाऊद ने बहुत अधिक काँसा ले लिया। उसी से सुलैमान ने काँसे का समुद्र[क], खम्भे और काँसे की वस्तुएँ बनाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: “काँसे का समुद्र” मंदिर का एक विशाल काँसे का जलपात्र था।
    reason: शाब्दिक स्रोत-पदनाम को बनाए रखते हुए आधुनिक पाठक के लिए उसके संदर्भ को स्पष्ट करता है।
lexical_decisions:
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: इस प्रसंग में मंदिर के उपकरणों के लिए प्रयुक्त धातु को प्रचलित हिन्दी बाइबलीय शब्द ‘काँसा’ से व्यक्त किया गया है।
- source_word: יָם הַנְּחֹשֶׁת
  choice: काँसे का हौद
  rationale: शाब्दिक ‘काँसे का समुद्र’ आधुनिक पाठक के लिए अस्पष्ट हो सकता है; यहाँ मंदिर का विशाल जलपात्र अभिप्रेत है, इसलिए उसके कार्य और रूप को सहज रूप से बताने वाला ‘हौद’ चुना गया।
- source_word: עַמּוּדִים
  choice: खम्भे
  rationale: मंदिर के स्थापत्य-संदर्भ में यह स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: כְּלֵי הַנְּחֹשֶׁת
  choice: काँसे की वस्तुएँ
  rationale: כְּלִי का अर्थ संदर्भानुसार पात्र, उपकरण या वस्तु हो सकता है; व्यापक अर्थ बनाए रखने के लिए ‘वस्तुएँ’ चुना गया।
- source_word: בָּהּ
  choice: उसी से
  rationale: स्त्रीलिंग एकवचन सर्वनाम का पूर्वपद נְחֹשֶׁת है; हिन्दी में यह प्राप्त काँसे को स्वाभाविक ढंग से संदर्भित करता है।
