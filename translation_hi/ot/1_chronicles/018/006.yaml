source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם דָּוִיד֙ בַּ/אֲרַ֣ם דַּרְמֶ֔שֶׂק וַ/יְהִ֤י אֲרָם֙ לְ/דָוִ֔יד עֲבָדִ֖ים נֹשְׂאֵ֣י מִנְחָ֑ה וַ/יּ֤וֹשַׁע יְהוָה֙ לְ/דָוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/006.yaml
  text: And David placed garrisons in Aram of Damascus[a], and the Arameans became David’s servants, bringing tribute[c][b]. And Yahweh gave victory to David wherever he went.
translation:
  language: hi
  text: दाऊद ने दमिश्क के अराम-प्रदेश में सैनिक चौकियाँ स्थापित कीं[a]। अरामी लोग दाऊद के सेवक हो गए और उसके लिए कर लाने वाले बने[b]। दाऊद जहाँ कहीं गया, याहवे ने उसे विजय दी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैनिक टुकड़ियाँ तैनात कीं”; अधिक शाब्दिक रूप से केवल “रखा।” इब्रानी में क्या रखा गया, यह नहीं कहा गया है; सैन्य प्रसंग से सैनिक चौकियाँ समझी जाती हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अराम”; परंपरागत अनुवादों में “सीरिया” या “सीरियाई।” “कर लाने वाले” का शाब्दिक भाव “भेंट लाने वाले” है।
    reason: alternative_reading
  - marker: c
    text: या “दाऊद को बचाया” अथवा “छुड़ाया”; इस युद्ध-संबंधी प्रसंग में “विजय दी” उसी भाव को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: सैनिक चौकियाँ स्थापित कीं
  rationale: क्रिया का शाब्दिक अर्थ ‘रखा’ है और इब्रानी पाठ में उसका कर्म व्यक्त नहीं किया गया है। सैन्य प्रसंग तथा समानांतर विवरण के आधार पर ‘सैनिक चौकियाँ’ निहित है; पादटिप्पणी मूल की संक्षिप्तता और अस्पष्टता बताती है।
- source_word: בַּאֲרָם דַּרְמֶשֶׂק
  choice: दमिश्क के अराम में
  rationale: यह अभिव्यक्ति अराम को दमिश्क से संबद्ध करती है। यह अनुवाद केवल ‘दमिश्क में’ कहने की अपेक्षा मूल भौगोलिक नाम को सुरक्षित रखता है और हिन्दी में स्वाभाविक है।
- source_word: אֲרָם
  choice: अरामी
  rationale: यहाँ ‘अराम’ उस क्षेत्र के लोगों को सूचित करता है जो दाऊद के अधीन हुए। ‘अरामी’ मूल जातिनाम को परंपरागत ‘सीरियाई’ की अपेक्षा अधिक सीधे रूप में दर्शाता है।
- source_word: עֲבָדִים
  choice: सेवक
  rationale: राजनीतिक अधीनता और कर चुकाने के प्रसंग में यह शब्द मातहत या जागीरदार-सदृश स्थिति दर्शाता है। ‘दास’ कहने से संपत्ति-रूप दासता का अनावश्यक रूप से अधिक निश्चित अर्थ निकल सकता है।
- source_word: נֹשְׂאֵי מִנְחָה
  choice: कर चुकाने लगे
  rationale: शाब्दिक भाव ‘भेंट लाने वाले’ है, पर विजित लोगों और अधिपति के राजनीतिक संबंध में מִנְחָה नियमित कर या नज़राना है। ‘कर चुकाने लगे’ आधुनिक हिन्दी में प्रसंग का आशय स्पष्ट करता है।
- source_word: וַיּוֹשַׁע
  choice: विजय दी
  rationale: यָשַׁע के हिफ़ील रूप का मूल भाव ‘बचाना/छुड़ाना’ है। युद्ध-वृत्तांत में यह दाऊद को सैन्य सफलता प्रदान करने का भाव व्यक्त करता है; विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: בְּכֹל אֲשֶׁר הָלָךְ
  choice: जहाँ कहीं गया
  rationale: यह इब्रानी मुहावरा दाऊद के सभी अभियानों या आवागमन के व्यापक क्षेत्र को दर्शाता है। ‘जहाँ कहीं गया’ इसे केवल युद्ध के लिए कूच करने तक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण सुरक्षित रखता है, जबकि ‘प्रभु’ नाम को उपाधि से बदल देता और ‘यहोवा’ बाद की मिश्रित ध्वन्यात्मक परंपरा को दर्शाता है।
- issue: וַיּוֹשַׁע में उद्धार और विजय का संबंध
  choice: विजय दी
  alternative: बचाया; छुड़ाया
  rationale: तत्काल प्रसंग राष्ट्रों पर दाऊद की सैन्य सफलता का है, इसलिए ‘विजय दी’ प्रसंगगत अर्थ व्यक्त करता है। फिर भी क्रिया के व्यापक उद्धारात्मक अर्थ को पादटिप्पणी में रखा गया है ताकि धार्मिक तनाव को मिटाया न जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘सैनिक चौकियाँ’, ‘सेवक’ और ‘कर चुकाने लगे’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की वास्तविक अस्पष्टताओं को मुख्य पाठ में बोझिल बनाए बिना पादटिप्पणियों में सुरक्षित रखा गया है।
