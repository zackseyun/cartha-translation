base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/009.yaml
  text: When Tou king of Hamath heard that David had struck down all the army of Hadadezer king of Zobah,[a]
translation:
  language: hi
  text: जब हमात के राजा तोऊ[a] ने सुना कि दाऊद ने सोबा के राजा हददेजेर की सारी सेना को मार गिराया था,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘तोऊ’; 2 शमूएल 8:9 के समानांतर वृत्तांत में ‘तोई’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: जब ... ने सुना
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, और यह उपवाक्य अगले पद की कार्रवाई की समयसूचक भूमिका तैयार करता है; इसलिए हिंदी में ‘जब ... ने सुना’ स्वाभाविक है।
- source_word: תֹּעוּ
  choice: तोऊ
  rationale: यह व्यक्ति का नाम है; इतिहास की पुस्तक में पाए गए इब्रानी रूप का देवनागरी लिप्यंतरण किया गया है।
- source_word: מֶלֶךְ חֲמָת
  choice: हमात के राजा
  rationale: यह संबंधसूचक पदबंध तोऊ के राजपद और राज्य को स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי सुनी गई बात की विषयवस्तु प्रस्तुत करता है।
- source_word: הִכָּה
  choice: मार गिराया है
  rationale: नכה का सैन्य संदर्भ में अर्थ प्रहार करके गिराना अथवा परास्त करना हो सकता है; ‘मार गिराया’ इब्रानी की प्रबलता बनाए रखता है।
- source_word: כָּל
  choice: सारी
  rationale: मूल पाठ में पूर्णता का स्पष्ट बोध है, जिसे बनाए रखा गया है।
- source_word: חֵיל
  choice: सेना
  rationale: इस सैन्य संदर्भ में חֵיל का अर्थ सशस्त्र सेना है, न कि धन या अमूर्त सामर्थ्य।
- source_word: הֲדַדְעֶזֶר
  choice: हददेजेर
  rationale: इतिहास की पुस्तक में पाए गए व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: מֶלֶךְ צוֹבָה
  choice: सोबा के राजा
  rationale: राजकीय पद और स्थान-नाम को स्वाभाविक हिंदी संबंधसूचक रचना में रखा गया है।
