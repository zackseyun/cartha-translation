base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/003.yaml
  text: David struck Hadadezer king of Zobah[b][a], as he went to establish his power at the Euphrates River.
translation:
  language: hi
  text: दाऊद ने हमात की ओर सोबा के राजा हददेजेर पर प्रहार किया, जब वह फरात नदी पर अपना अधिकार स्थापित करने जा रहा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना नियंत्रण फिर से स्थापित करने”; अधिक शाब्दिक रूप में, “अपना हाथ स्थापित करने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּךְ
  choice: आक्रमण किया
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है, पर युद्ध-वृत्तांत में ‘मारा’ से हददेजेर के मारे जाने का भ्रामक संकेत मिल सकता है। ‘आक्रमण किया’ सैन्य कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है और पूर्ण पराजय का अतिरिक्त दावा नहीं करता।
- source_word: הֲדַדְעֶזֶר
  choice: हददेजेर
  rationale: इतिहास की पुस्तक में दिए गए हिब्रू रूप का देवनागरी लिप्यंतरण; समानांतर पाठ के भिन्न रूप को पादटिप्पणी में रखा गया है।
- source_word: מֶלֶךְ צוֹבָה
  choice: सोबा के राजा
  rationale: हिब्रू संबंधसूचक पदबंध को सहज और सीधी हिन्दी में व्यक्त करता है।
- source_word: חֲמָתָה
  choice: हमात की ओर
  rationale: स्थान-नाम के अंत में लगा दिशासूचक ה किसी स्थान की ओर गति दर्शाता है; इसलिए इस पाठगत तत्व को मुख्य अनुवाद में बनाए रखा गया है।
- source_word: בְּלֶכְתּוֹ
  choice: जब वह ... जा रहा था
  rationale: ב के साथ infinitive construct समयगत परिस्थिति बताता है। ‘वह’ के पूर्वपद को स्पष्ट न करके हिब्रू की संभावित संदर्भ-अस्पष्टता सुरक्षित रखी गई है।
- source_word: לְהַצִּיב יָדוֹ
  choice: अपना अधिकार स्थापित करने
  rationale: शाब्दिक ‘अपना हाथ स्थापित करना’ यहाँ सैन्य-राजनीतिक प्रभुत्व या नियंत्रण स्थापित करने का मुहावरा है। स्वाभाविक हिन्दी में अर्थ दिया गया है, जबकि अन्य संभावनाएँ पादटिप्पणी में हैं।
- source_word: בִּנְהַר פְּרָת
  choice: फरात नदी पर
  rationale: נְהַר פְּרָת का स्पष्ट भौगोलिक नाम ‘फरात नदी’ है; ב को यहाँ प्रभुत्व स्थापित करने के क्षेत्र के लिए ‘पर’ से व्यक्त किया गया है।
theological_decisions:
- issue: בְּלֶכְתּוֹ और יָדוֹ में सर्वनाम का संदर्भ
  choice: ‘जब वह ... अपना अधिकार ... जा रहा था’ कहकर संदर्भ को खुला रखा गया
  alternative: स्पष्ट रूप से ‘जब हददेजेर अपना अधिकार...’ या ‘जब दाऊद अपना अधिकार...’ कहना
  rationale: हिब्रू के पुल्लिंग एकवचन प्रत्यय स्वयं व्यक्ति का नाम दोहराकर संदर्भ निश्चित नहीं करते। अनुवाद में किसी एक व्यक्ति को स्पष्ट कर देना स्रोत की वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्रचलित हिन्दी बाइबलीय नाम-रूप ‘दाऊद’, ‘सोबा’, ‘हमात’ और ‘फरात’ अपनाए गए हैं। मुख्य वाक्य में दिशासूचक ‘हमात की ओर’ सुरक्षित है तथा सर्वनाम की स्रोतगत अस्पष्टता को नहीं मिटाया गया।
