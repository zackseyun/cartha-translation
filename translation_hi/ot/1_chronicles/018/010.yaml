base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/010.yaml
  text: So he sent Hadoram his son to King David to ask about his welfare and to bless him because he had fought against Hadadezer and struck him down[a], for Hadadezer had been at war with Tou[d][c][b]; and he sent all kinds of articles of gold and silver and bronze.
translation:
  language: hi
  text: तब तोऊ ने अपने पुत्र हदोराम को राजा दाऊद के पास उनका कुशल-क्षेम पूछने[a] और उन्हें आशीर्वाद देने[b] के लिए भेजा, क्योंकि दाऊद ने हददेजेर से युद्ध करके उसे पराजित किया था। हददेजेर तोऊ से युद्धरत था[c]। तोऊ ने सोने, चाँदी और काँसे की सभी प्रकार की वस्तुएँ भी भेजीं[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “उनसे शांति के विषय में पूछने।” यहाँ “शांति” का अर्थ उनकी भलाई या कुशलता है।
    reason: lexical_alternative
  - marker: b
    text: इस राजनयिक प्रसंग में इसका अर्थ “उन्हें बधाई देने” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “क्योंकि हददेजेर तोऊ के साथ युद्धों का पुरुष था”; अर्थात हददेजेर तोऊ से युद्धरत था।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी पाठ के अंतिम खंड में क्रिया नहीं है; शाब्दिक रूप से वहाँ केवल “और सोने, चाँदी और काँसे की सभी वस्तुएँ” है। “तोऊ ने ... भेजीं” प्रसंग के आधार पर जोड़ा गया है।
    reason: supplied_words
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब उसने ... भेजा
  rationale: वाव-युक्त कथात्मक क्रिया पिछले प्रसंग के बाद अगली घटना बताती है। ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֲדוֹרָם בְּנוֹ
  choice: अपने पुत्र हदोराम
  rationale: व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण किया गया है और पुत्र का संबंध स्पष्ट रूप से बनाए रखा गया है।
- source_word: לִשְׁאוֹל לוֹ לְשָׁלוֹם
  choice: उनका कुशल-क्षेम पूछने
  rationale: शाब्दिक रूप से ‘उससे शालोम के विषय में पूछना’ एक इब्रानी मुहावरा है, जिसका आशय किसी की भलाई और सकुशलता पूछना है।
- source_word: וּלְבָרֲכוֹ
  choice: और उन्हें आशीर्वाद देने
  rationale: ברך का मूल अर्थ ‘आशीर्वाद देना’ है। राजनयिक प्रसंग में इसमें विजय पर बधाई देने का भाव भी हो सकता है, पर मूल अर्थ को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: עַל אֲשֶׁר נִלְחַם בַּהֲדַדְעֶזֶר וַיַּכֵּהוּ
  choice: क्योंकि दाऊद ने हददेजेर से युद्ध करके उसे पराजित किया था
  rationale: सर्वनाम का संदर्भ हिन्दी में स्पष्ट करने के लिए ‘दाऊद’ दोहराया गया है। נכה को यहाँ सैन्य विजय के अर्थ में ‘पराजित किया’ कहा गया है, जिससे हददेजेर की मृत्यु अनावश्यक रूप से अभिप्रेत नहीं होती।
- source_word: כִּי אִישׁ מִלְחֲמוֹת תֹּעוּ הָיָה הֲדַדְעָזֶר
  choice: हददेजेर तोऊ से युद्ध करता रहा था
  rationale: शाब्दिक ‘तोऊ के साथ युद्धों का पुरुष’ हिन्दी में अस्वाभाविक है। चुना गया रूप दोनों राजाओं के बीच जारी शत्रुतापूर्ण युद्ध-संबंध को व्यक्त करता है।
- source_word: וְכֹל כְּלֵי זָהָב וָכֶסֶף וּנְחֹשֶׁת
  choice: उसने सोने, चाँदी और काँसे की सब प्रकार की वस्तुएँ भी भेजीं
  rationale: כְּלֵי को व्यापक अर्थ में ‘वस्तुएँ’ कहा गया है; נְחֹשֶׁת के प्राचीन धातु-संदर्भ में ‘काँसा’ उपयुक्त है। इब्रानी में इस अंतिम खंड की क्रिया निहित है, जिसे प्रसंग से हिन्दी में पूरा किया गया है।
