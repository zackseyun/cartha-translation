base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/002.yaml
  text: And he struck Moab[a], and the Moabites became servants to David, bringing tribute.
translation:
  language: hi
  text: उसने मोआब को मारा, और मोआबी दाऊद के दास बन गए और कर देने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּךְ
  choice: मारा
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है। सैन्य संदर्भ में ‘मारा’ इब्रानी की ठोस अभिव्यक्ति को बनाए रखता है; ‘हरा दिया’ परिणाम को कुछ अधिक स्पष्ट कर देता।
- source_word: מוֹאָב
  choice: मोआब / मोआबी
  rationale: पहली बार यह देश या राष्ट्रीय इकाई के रूप में कर्म है, इसलिए ‘मोआब’; दूसरी बार लोगों के लिए प्रयुक्त है, इसलिए स्वाभाविक हिन्दी में ‘मोआबी’।
- source_word: וַיִּהְיוּ
  choice: बन गए
  rationale: कथात्मक क्रम में היה और विधेय का प्रयोग नई अवस्था में प्रवेश का भाव देता है, इसलिए केवल ‘थे’ के बजाय ‘बन गए’।
- source_word: עֲבָדִים לְדָוִיד
  choice: दाऊद के अधीन सेवक
  rationale: עֲבָדִים में दास, सेवक या अधीनस्थ का अर्थ हो सकता है। विजित राष्ट्र और कर के संदर्भ में ‘अधीन सेवक’ थोपी गई राजनीतिक अधीनता को व्यक्त करता है, बिना आधुनिक व्यक्तिगत संपत्ति-रूप दासत्व को अनिवार्य रूप से आरोपित किए।
- source_word: נֹשְׂאֵי מִנְחָה
  choice: कर चुकाने लगे
  rationale: नשׂא का शाब्दिक भाव ‘लाना/उठाकर लाना’ और מִנְחָה का सामान्य अर्थ ‘भेंट’ है; किंतु सैन्य अधीनता के इस संदर्भ में यह आश्रित राष्ट्र द्वारा दिया जाने वाला कर है। हिन्दी में ‘कर चुकाने लगे’ उसी राजनीतिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: עֲבָדִים की अधीनता का स्वरूप
  choice: अधीन सेवक
  alternative: दास
  rationale: पद राजनीतिक वशवर्ती स्थिति बताता है, पर यह अकेले उस अधीनता के सटीक सामाजिक-कानूनी स्वरूप को निर्धारित नहीं करता। ‘अधीन सेवक’ कठोर अधीनता को बनाए रखते हुए अनावश्यक संप्रदायगत या आधुनिक कानूनी विशिष्टता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त ऐतिहासिक-कथात्मक शैली। ‘कर चुकाने लगे’ वशवर्ती राष्ट्र के नियमित राजकीय भुगतान को सामान्य पाठक के लिए स्पष्ट करता है।
