    text: शाब्दिक रूप से, “उसकी बेटियाँ”; यह गत पर निर्भर छोटे नगरों या बस्तियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह इब्रानी कथात्मक संक्रमण-सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और घटनाओं का कालक्रम बनाए रखता है।
- source_word: וַיַּךְ
  choice: प्रहार किया
  rationale: सैन्य प्रसंग में נכה के ठोस अर्थ ‘मारना/प्रहार करना’ को बनाए रखता है; अगली क्रिया उसके परिणाम को स्पष्ट करती है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस प्राचीन जनसमूह के लिए हिन्दी में प्रचलित नाम।
- source_word: וַיַּכְנִיעֵם
  choice: उन्हें अपने अधीन कर लिया
  rationale: हिफ़ील रूप यहाँ किसी को झुकाकर अधीनता में लाने का सैन्य-राजनीतिक भाव देता है; यह हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַיִּקַּח
  choice: छीन लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; ‘पलिश्तियों के हाथ से’ के साथ क्षेत्र पर बलपूर्वक अधिकार करने का भाव हिन्दी में ‘छीन लिया’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: גַּת
  choice: गत
  rationale: पलिश्ती नगर के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וּבְנֹתֶיהָ
  choice: उसके अधीन नगरों
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, जो प्रधान नगर पर निर्भर छोटी बस्तियों या नगरों के लिए इब्रानी मुहावरा है। ‘अधीन नगर’ संबंध को स्पष्ट रखता है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल इब्रानी रूपक को बनाए रखता है; हिन्दी में यह अधिकार या नियंत्रण से छुड़ाने का सुबोध मुहावरा है।
