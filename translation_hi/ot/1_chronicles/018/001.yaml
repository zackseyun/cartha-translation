  yaml_path: translation/ot/1_chronicles/018/001.yaml
  text: After this[a], David struck the Philistines and subdued them, and he took Gath and its surrounding towns from the hand of the Philistines.
translation:
  language: hi
  text: इसके बाद दाऊद ने पलिश्तियों पर प्रहार किया और उन्हें अपने अधीन कर लिया। उसने गत और उसके अधीन नगरों[a] को पलिश्तियों के हाथ से छीन लिया।
  philosophy: optimal-equivalence
  footnotes:
