  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सरल कथात्मक रूप अपनाया गया है। ‘के पास थीं’ मूल के עַל को शब्दशः ‘पर थीं’ कहने से उत्पन्न अस्वाभाविकता से बचाता है, फिर भी यह तय नहीं करता कि ढालें पहनी गई थीं या हाथ में उठाई गई थीं। सभी पाठगत और सांस्कृतिक भेद पादटिप्पणियों में स्पष्ट किए गए हैं।
