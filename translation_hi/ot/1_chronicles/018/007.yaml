  text: וַ/יִּקַּ֣ח דָּוִ֗יד אֵ֚ת שִׁלְטֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֣ר הָי֔וּ עַ֖ל עַבְדֵ֣י הֲדַדְעָ֑זֶר וַ/יְבִיאֵ֖/ם יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/007.yaml
  text: And David took the shields of gold that were on the servants of Hadadezer and brought them to Jerusalem[a][b][c].
translation:
  language: hi
  text: दाऊद ने सोने की वे ढालें ले लीं, जो हददएजेर के सेवकों के पास थीं, और उन्हें यरूशलेम ले आया।[a][b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने से मढ़ी हुई ढालें”; इब्रानी पदबंध का आशय सोने की परत चढ़ी ढालों से भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सेवक” से संभवतः हददएजेर के राजकीय अनुचर या सैनिक सहायक अभिप्रेत हैं, अनिवार्यतः केवल घरेलू दास नहीं।
    reason: cultural_note
  - marker: c
    text: कुछ पाठ-परंपराओं और 2 शमूएल के समानांतर वृत्तांत में यह नाम “हदरएजेर” लिखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले लीं
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है। युद्ध के संदर्भ में अधिकार में लेने का भाव निहित है, पर ‘ले लीं’ मूल क्रिया की व्यापकता बनाए रखता है।
- source_word: שִׁלְטֵי הַזָּהָב
  choice: सोने की वे ढालें
  rationale: שִׁלְטֵי ढालों को सूचित करता है और הַזָּהָב के साथ रचना शाब्दिक रूप से ‘सोने की ढालें’ है। यह स्वाभाविक हिन्दी है और इस संभावना को खुला रखती है कि ढालें सोने से मढ़ी हुई थीं।
- source_word: אֲשֶׁר הָיוּ עַל
  choice: जो ... के पास थीं
  rationale: शाब्दिक अर्थ ‘जो ... पर थीं’ है, पर हिन्दी में वस्तुओं के व्यक्तियों पर होने से यहाँ धारण या नियंत्रण में होने का भाव है। ‘के पास थीं’ स्वाभाविक है और ‘पहनी’ अथवा ‘उठाए हुए’ जैसी अनिश्चित विशिष्टता नहीं जोड़ता।
- source_word: עַבְדֵי הֲדַדְעָזֶר
  choice: हददएजेर के सेवकों
  rationale: עֲבָדִים का मूल अर्थ ‘सेवक’ है। राजकीय-सैनिक संदर्भ में यह अनुचर, अधिकारी या सैनिक सहायक भी हो सकते हैं; मुख्य पाठ में ‘सेवक’ मूल की व्यापकता बनाए रखता है।
- source_word: הֲדַדְעָזֶר
  choice: हददएजेर
  rationale: WLC के मासोरेटिक पाठ में नाम हददएजेर है। ‘हदरएजेर’ पाठ-परंपरा और समानांतर वृत्तांत में मिलने वाला वैकल्पिक रूप है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וַיְבִיאֵם יְרוּשָׁלִָם
  choice: और उन्हें यरूशलेम ले आया
  rationale: हिफ़ील रूप וַיְבִיאֵם का अर्थ ‘उन्हें ले आया/पहुँचाया’ है। हिन्दी कथन में ‘यरूशलेम ले आया’ सटीक और स्वाभाविक है।
