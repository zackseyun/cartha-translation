base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/015.yaml
  text: And Joab son of Zeruiah was over the army[a], and Jehoshaphat son of Ahilud was recorder.
translation:
  language: hi
  text: और सरूयाह का पुत्र योआब सेना का प्रधान था, और अहीलूद का पुत्र यहोशापात अभिलेखाधिकारी[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सचिव” अथवा “वृत्तांत-लेखक”; हिब्रू शब्द उस राजकीय अधिकारी को सूचित करता है जो अभिलेख रखता और विषयों की सूचना राजा को देता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹאָב
  choice: और ... योआब
  rationale: וְ को अधिकारियों की सूची का संयोजक प्रवाह बनाए रखने के लिए ‘और’ से व्यक्त किया गया है; יוֹאָב का प्रचलित हिंदी लिप्यंतरण ‘योआब’ है।
- source_word: בֶּן צְרוּיָה
  choice: सरूयाह का पुत्र
  rationale: हिब्रू संबंधसूचक रचना को स्वाभाविक और स्पष्ट हिंदी में रखा गया है।
- source_word: עַל הַ/צָּבָא
  choice: सेना का प्रधान था
  rationale: עַל यहाँ अधिकार और दायित्व का पद सूचित करता है। शाब्दिक ‘सेना के ऊपर था’ की अपेक्षा ‘सेना का प्रधान था’ आधुनिक हिंदी में अधिक स्वाभाविक है और पद की व्यापकता को बनाए रखता है।
- source_word: וִ/יהוֹשָׁפָט
  choice: और ... यहोशापात
  rationale: संयोजक וְ को सूची की समानांतर संरचना के लिए ‘और’ से व्यक्त किया गया है; नाम का प्रचलित हिंदी रूप ‘यहोशापात’ रखा गया है।
- source_word: בֶּן אֲחִילוּד
  choice: अहीलूद का पुत्र
  rationale: पितृपरक पहचान को मूल के अनुरूप और स्वाभाविक हिंदी क्रम में अनूदित किया गया है।
- source_word: מַזְכִּיר
  choice: अभिलेखाधिकारी
  rationale: राजकीय प्रशासन के संदर्भ में यह शब्द अभिलेख रखने और विषयों को राजा के ध्यान में लाने वाले अधिकारी को दर्शाता है। ‘अभिलेखाधिकारी’ केवल लेखक की अपेक्षा पद का आशय अधिक स्पष्ट करता है, जबकि संभावित अन्य अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions: []
