  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पदों की सूची जैसी संक्षिप्त समानांतर संरचना सुरक्षित है; व्यक्तिनाम प्रचलित हिंदी बाइबलीय रूपों में दिए गए हैं।
