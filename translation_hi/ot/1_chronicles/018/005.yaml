  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अराम’ और ‘सोबा’ जैसे प्राचीन नाम सुरक्षित रखे गए हैं। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
