  yaml_path: translation/ot/1_chronicles/018/005.yaml
  text: And Aram of Damascus came to help Hadadezer king of Zobah[b][a], and David struck down twenty-two thousand men of Aram.
translation:
  language: hi
  text: तब दमिश्क का अराम[a] सोबा के राजा हददेज़ेर[b] की सहायता करने आया, और दाऊद ने अराम के बाईस हज़ार पुरुषों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दमिश्क के अरामी”; पारंपरिक अनुवादों में, “दमिश्क के सीरियाई।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ नाम का रूप “हददेज़ेर” है; कुछ समानांतर पदों में “हदरेज़ेर” पाठ-रूप मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרַם דַּרְמֶשֶׂק
  choice: दमिश्क का अराम
  rationale: אֲרַם क्षेत्र अथवा अरामी लोगों को सूचित कर सकता है। यहाँ ‘दमिश्क का अराम’ इब्रानी की जातीय-भौगोलिक अभिव्यक्ति को बनाए रखता है और बाद के भू-राजनीतिक नाम ‘सीरिया’ को आरोपित नहीं करता।
- source_word: לַעְזוֹר
  choice: सहायता करने
  rationale: עזר का सीधा अर्थ सहायता करना है; सैन्य प्रसंग में भी यह स्वाभाविक और स्पष्ट है।
- source_word: הֲדַדְעֶזֶר
  choice: हददएजेर
  rationale: इस पद के मसोराई रूप הֲדַדְעֶזֶר का निकट देवनागरी लिप्यंतरण है; समानांतर पदों में मिलने वाला ‘हदरएजेर’ अलग पाठ-रूप है।
- source_word: מֶלֶךְ צוֹבָה
  choice: सोबा के राजा
  rationale: राजकीय उपाधि और स्थान-नाम को बिना अनावश्यक विस्तार के सीधे रूप में प्रस्तुत करता है।
- source_word: וַיַּךְ
  choice: मार गिराया
  rationale: युद्ध के प्रसंग में נכה प्रहार करने, पराजित करने या मार डालने का भाव दे सकता है। इसके बाद दी गई जनहानि की संख्या के कारण ‘मार गिराया’ हिंसक परिणाम को व्यक्त करते हुए क्रिया की युद्ध-संबंधी शक्ति बनाए रखता है।
- source_word: בַּאֲרָם
  choice: अराम के
  rationale: संख्या और אִישׁ के साथ यह अराम से संबंधित पुरुषों को दर्शाता है; हिंदी में ‘अराम के ... पुरुषों’ से जातीय-भौगोलिक संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף אִישׁ
  choice: बाईस हज़ार पुरुषों
  rationale: इब्रानी संख्या और אִישׁ का सीधा समतुल्य है; ‘सैनिक’ जोड़ना मूल पाठ से अधिक विशिष्ट होता।
