  text: גַּם אֹתָ֗/ם הִקְדִּ֞ישׁ הַ/מֶּ֤לֶךְ דָּוִיד֙ לַ/יהוָ֔ה עִם הַ/כֶּ֨סֶף֙ וְ/הַ/זָּהָ֔ב אֲשֶׁ֥ר נָשָׂ֖א מִ/כָּל הַ/גּוֹיִ֑ם מֵֽ/אֱד֤וֹם וּ/מִ/מּוֹאָב֙ וּ/מִ/בְּנֵ֣י עַמּ֔וֹן וּ/מִ/פְּלִשְׁתִּ֖ים וּ/מֵֽ/עֲמָלֵֽק־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/011.yaml
  text: 'King David also dedicated these to Yahweh[a], along with the silver and the gold that he had taken from all the nations: from Edom, Moab, the Ammonites, the Philistines[c][b], and Amalek.'
translation:
  language: hi
  text: राजा दाऊद ने इन वस्तुओं[a] को भी उस चाँदी और सोने के साथ याहवे के लिए समर्पित कर दिया, जो उसने सब राष्ट्रों से लिया था[b]—एदोम, मोआब, अम्मोनियों[c], पलिश्तियों और अमालेक से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन्हें”; यह सर्वनाम पिछली आयत में बताई गई काँसे की वस्तुओं की ओर संकेत करता है।
    reason: cross_reference
  - marker: b
    text: या, “ले गया था” अथवा “उठा ले गया था”; हिब्रू क्रिया का अर्थ उठाना/ले जाना भी हो सकता है और यहाँ विजित राष्ट्रों से धन लेने के अर्थ में है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में, “अम्मोन के पुत्र”; अर्थात् अम्मोनी।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם אֹתָם
  choice: इन वस्तुओं को भी
  rationale: सर्वनाम पिछली आयत में बताई गई काँसे की वस्तुओं की ओर संकेत करता है; ‘इन वस्तुओं’ से हिन्दी में संदर्भ स्पष्ट रहता है और גַּם का सातत्य ‘भी’ से व्यक्त होता है।
- source_word: הִקְדִּישׁ ... לַיהוָה
  choice: याहवे के लिए समर्पित कर दिया
  rationale: הקדיש का अर्थ किसी वस्तु को पवित्र प्रयोजन के लिए अलग करना या अर्पित करना है; ‘समर्पित’ उपासना-संबंधी प्रसंग में स्वाभाविक है।
- source_word: הַכֶּסֶף וְהַזָּהָב
  choice: उस चाँदी और सोने
  rationale: हिब्रू के निश्चित उपपदों को हिन्दी में प्रसंगसूचक ‘उस’ द्वारा स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: אֲשֶׁר נָשָׂא
  choice: जिसे वह ... ले आया था
  rationale: נשא मूलतः उठाने या ले जाने को दर्शाता है और यहाँ विजित जातियों से प्राप्त धन को लाने के अर्थ में है; अनावश्यक रूप से ‘लूट’ जोड़ने से बचते हुए अर्थ की व्यापकता रखी गई है।
- source_word: מִכָּל הַגּוֹיִם
  choice: सब जातियों से
  rationale: सैन्य-राजनीतिक प्रसंग में גוים आसपास के जनसमूहों/राष्ट्रों को सूचित करता है; ‘जातियाँ’ बाइबलीय हिन्दी में परिचित और यहाँ सुबोध है।
- source_word: מִבְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक ‘अम्मोन के पुत्रों’ के बजाय उसी जनसमुदाय का स्वाभाविक हिन्दी नाम दिया गया है।
- source_word: מֵאֱדוֹם ... וּמֵעֲמָלֵק
  choice: एदोम, मोआब, अम्मोनियों, पलिश्तियों और अमालेक से
  rationale: भौगोलिक और जातीय नामों के प्रचलित हिन्दी रूप अपनाए गए हैं तथा प्रत्येक पर लागू होने वाले מִן (‘से’) को सूची के अंत में स्वाभाविक हिन्दी ढंग से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है; उसका लिप्यंतरण नाम को सामान्य पदवी में बदलने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज ऐतिहासिक-वर्णन शैली। वाक्यक्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि पिछली आयत से संबंध, समर्पण की क्रिया और स्रोत-जातियों की पूरी सूची सुरक्षित है।
