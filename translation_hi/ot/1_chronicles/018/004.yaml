base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/004.yaml
  text: David captured from him 1,000 chariots, 7,000 horsemen, and 20,000 foot soldiers. Then David hamstrung all the chariot horses, but left from them enough for 100 chariots.
translation:
  language: hi
  text: दाऊद ने उससे 1,000 रथ, 7,000 घुड़सवार[b] और 20,000 पैदल सैनिक पकड़ लिए। फिर दाऊद ने रथों के सभी घोड़ों की पिछली टाँगों की नसें काट दीं[a], पर उनमें से 100 रथों के लिए पर्याप्त घोड़े छोड़ दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “सारे रथ/सारा रथ-दल” है। चूँकि क्रिया का अर्थ पिछली टाँगों की नसें काटना है, इसलिए यहाँ यह पद रथ-दल के घोड़ों के लिए लाक्षणिक रूप से प्रयुक्त समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: 2 शमूएल 8:4 में “7,000 घुड़सवारों” के बजाय “1,700 घुड़सवार” हैं। समानांतर अंशों की पाठ-परंपरा में संख्याओं का यह अंतर पाया जाता है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיִּלְכֹּד
  choice: पकड़ लिए
  rationale: לכד युद्ध के संदर्भ में किसी व्यक्ति या युद्ध-सामग्री को पकड़ने अथवा अधिकार में लेने को दर्शाता है; यहाँ ‘पकड़ लिए’ सहज और स्पष्ट है।
- source_word: מִמֶּנּוּ
  choice: उससे
  rationale: एकवचन प्रत्यय पिछले संदर्भ के हददेजेर की ओर संकेत करता है; ‘उससे’ इस एकवचन संबंध को बनाए रखता है।
- source_word: אֶלֶף רֶכֶב
  choice: 1,000 रथ
  rationale: רכב सामूहिक रूप से रथ-सेना का अर्थ दे सकता है, पर संख्या के साथ यहाँ ‘रथ’ स्वाभाविक और स्रोत के निकट है।
- source_word: פָּרָשִׁים
  choice: घुड़सवार
  rationale: यह शब्द घोड़ों पर सवार योद्धाओं को दर्शाता है; ‘घुड़सवार’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: אִישׁ רַגְלִי
  choice: पैदल सैनिक
  rationale: शाब्दिक अर्थ ‘पाँव के पुरुष’ है; सैन्य संदर्भ में ‘पैदल सैनिक’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְעַקֵּר
  choice: पिछली टाँगों की नसें काट दीं
  rationale: इस सैन्य संदर्भ में עקר घोड़ों को अक्षम करने के लिए उनकी पिछली टाँगों की नसें काटने को दर्शाता है; हिन्दी में यह वर्णन ‘हैमस्ट्रिंग’ का स्पष्ट अर्थ देता है।
- source_word: אֶת כָּל הָרֶכֶב
  choice: रथों के सभी घोड़ों
  rationale: मूल में शाब्दिक रूप से ‘सारे रथ/रथ-दल’ है, पर नस काटने की क्रिया वाहनों पर नहीं बल्कि उनसे जुड़े घोड़ों पर लागू होती है; इसलिए निहित अर्थ को मुख्य पाठ में स्पष्ट किया गया है।
- source_word: וַיּוֹתֵר מִמֶּנּוּ מֵאָה רָכֶב
  choice: पर उनमें से 100 रथों के लिए पर्याप्त घोड़े छोड़ दिए
  rationale: वाक्य बताता है कि दाऊद ने पूरी पकड़ी गई रथ-सेना के घोड़ों को अक्षम नहीं किया, बल्कि 100 रथों के उपयोग हेतु पर्याप्त घोड़े बचाए; यह हिन्दी में प्रसंगगत लक्षणा को स्पष्ट करता है।
