base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/017.yaml
  text: And Benaiah son of Jehoiada was over the Kerethites and the Pelethites[c][b][a], and David’s sons were the chief officials at the king’s side.
translation:
  language: hi
  text: यहोयादा का पुत्र बनायाह करेतियों और पेलेतियों[a] का प्रभारी था, और दाऊद के पुत्र राजा के निकट प्रमुख अधिकारी[b][c] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन समूहों के नामों के वैकल्पिक लिप्यंतरण ‘केरेती’ और ‘पेलेती’ भी मिलते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ ‘पहले जन’ या ‘अग्रणी जन’ है; यहाँ सम्भवतः राजदरबार के उच्च पदाधिकारियों के लिए प्रयुक्त उपाधि है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘राजा के हाथ के पास’; यह निकट उपस्थित रहने या सेवा करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל
  choice: का अधिकारी था
  rationale: यहाँ עַל प्रशासनिक या सैनिक अधिकार और देखरेख को व्यक्त करता है; ‘का अधिकारी था’ आधुनिक हिन्दी में स्वाभाविक है और पदानुक्रम का भाव बनाए रखता है।
- source_word: הַכְּרֵתִי וְהַפְּלֵתִי
  choice: करेतियों और पेलेतियों
  rationale: दोनों शब्द समुदायों अथवा सैनिक दलों के नाम हैं; इसलिए उनका अर्थानुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּבְנֵי דָוִיד
  choice: दाऊद के पुत्र
  rationale: यह संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: הָרִאשֹׁנִים
  choice: प्रमुख अधिकारी
  rationale: शाब्दिक अर्थ ‘पहले’ या ‘अग्रणी’ है। राजदरबार के प्रसंग में यह पद अथवा प्रतिष्ठा में अग्रणी व्यक्तियों की ओर संकेत करता है; ‘प्रमुख अधिकारी’ उस आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: לְיַד הַמֶּלֶךְ
  choice: राजा के निकट
  rationale: शाब्दिक रूप से ‘राजा के हाथ के पास’ का यह मुहावरा निकट उपस्थिति अथवा राजकीय सेवा को सूचित करता है। ‘राजा के निकट’ स्थान और सेवा—दोनों संभावित भावों को अनावश्यक रूप से सीमित नहीं करता।
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: यहोयादा का पुत्र बनायाह
  rationale: व्यक्तिनामों को इब्रानी के निकट लिप्यंतरित किया गया है और पुत्र-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
