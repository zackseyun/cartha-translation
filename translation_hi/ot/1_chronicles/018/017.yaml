  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समूहों और व्यक्तियों के नाम अर्थानुवाद के बजाय लिप्यंतरित हैं। राजदरबारी पद और निकट सेवा के मुहावरे को मुख्य पाठ में स्वाभाविक बनाया गया है, जबकि मूल की शाब्दिक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
