  rationale: इतिहास की हिब्रू पाठ-परंपरा में दिए नाम को ज्यों का त्यों लिप्यंतरित किया गया है; 2 शमूएल 8:17 का भिन्न पाठ पादटिप्पणी में बताया गया है।
- source_word: אֶבְיָתָר
