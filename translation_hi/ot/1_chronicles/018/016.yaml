  rationale: राज-दरबार के प्रशासनिक संदर्भ में यह सरकारी लेखन और अभिलेख-संबंधी अधिकारी का पद है; ‘राजकीय सचिव’ आधुनिक पाठक को भूमिका स्पष्ट करता है।
