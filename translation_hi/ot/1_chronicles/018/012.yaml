  alternative: एदोम का भूभाग
  rationale: सैन्य क्रिया के साथ अठारह हज़ार की संख्या स्पष्ट रूप से व्यक्तियों की ओर संकेत करती है; फिर भी मूल के शाब्दिक रूप ‘एदोम’ की सूचना पादटिप्पणी में दी गई है।
