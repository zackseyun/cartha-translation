source:
  edition: WLC
  text: וַ/יָּ֤שֶׂם בֶּֽ/אֱדוֹם֙ נְצִיבִ֔ים וַ/יִּהְי֥וּ כָל אֱד֖וֹם עֲבָדִ֣ים לְ/דָוִ֑יד וַ/יּ֤וֹשַׁע יְהוָה֙ אֶת דָּוִ֔יד בְּ/כֹ֖ל אֲשֶׁ֥ר הָלָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/013.yaml
  text: He placed garrisons in Edom, and all Edom became servants to David. And the LORD gave David victory wherever he went.
translation:
  language: hi
  text: दाऊद ने एदोम में छावनियाँ स्थापित कीं[a], और सारा एदोम दाऊद के अधीन हो गया और उसकी सेवा करने लगा। जहाँ कहीं दाऊद गया, वहाँ यहोवा ने उसे विजय दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: एदोम में अधिकारी नियुक्त किए।'
    reason: נְצִיבִים का अर्थ इस प्रसंग में सैन्य छावनियाँ हो सकता है; शब्द का अर्थ तैनात अधिकारी या प्रतिनिधि भी हो सकता है।
lexical_decisions:
- source_word: נְצִיבִים
  choice: सैनिक चौकियाँ
  rationale: इस राजनीतिक-सैन्य प्रसंग में बहुवचन शब्द एदोम पर नियंत्रण बनाए रखने के लिए तैनात सैन्य ठिकानों या टुकड़ियों को सूचित करता है; समानांतर विवरण भी इसी अर्थ का समर्थन करता है।
- source_word: עֲבָדִים לְדָוִיד
  choice: दाऊद के अधीन होकर उसकी सेवा करने लगा
  rationale: यहाँ עבד विजित राष्ट्र की राजनीतिक अधीनता और बाध्य सेवा को व्यक्त करता है। यह अनुवाद कठोर अधीनता को बनाए रखता है, पर आधुनिक हिन्दी में निजी दासत्व का अनावश्यक रूप से संकीर्ण अर्थ नहीं थोपता।
- source_word: וַיּוֹשַׁע
  choice: विजय देता रहा
  rationale: युद्ध-वर्णन में क्रिया का अर्थ यहोवा द्वारा दाऊद को बचाना और सफल करना है; हिन्दी में 'विजय देता रहा' प्रसंगानुकूल और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि 'प्रभु' में बदलने के बजाय हिन्दी में प्रचलित नामरूप से व्यक्त किया गया है।
theological_decisions:
- issue: दाऊद की विजय में यहोवा की भूमिका
  choice: यहोवा उसे विजय देता रहा
  alternative: दाऊद विजयी होता रहा
  rationale: मूल पाठ स्पष्ट रूप से यहोवा को कर्ता बनाता है; इसलिए दाऊद की सैन्य सफलता को केवल उसकी अपनी उपलब्धि के रूप में प्रस्तुत नहीं किया गया।
- issue: एदोम की अधीनता का स्वरूप
  choice: अधीन होकर उसकी सेवा करने लगा
  alternative: दाऊद के दास बन गए
  rationale: सामूहिक राजनीतिक संदर्भ में राष्ट्र की पराधीन सेवा अभिप्रेत है। चुनी हुई अभिव्यक्ति इस कठोर संबंध को स्पष्ट रखती है, किंतु हर एदोमी की व्यक्तिगत संपत्ति-सदृश दासता का दावा नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। 'समूचा एदोम' राष्ट्र को सामूहिक इकाई के रूप में व्यक्त करता है, और 'जहाँ कहीं गया, वहाँ' मूल की व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
