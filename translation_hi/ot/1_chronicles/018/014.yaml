base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/018/014.yaml
  text: So David reigned over all Israel[a], and he administered justice and righteousness to all his people.
translation:
  language: hi
  text: दाऊद सारे इस्राएल पर राज्य करता था, और अपनी सारी प्रजा के लिए न्याय और धार्मिकता को लागू करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְלֹךְ
  choice: राजा होकर राज्य करता रहा
  rationale: क्रिया מלך यहाँ दाऊद के स्थापित राजकीय शासन को बताती है। यह हिंदी अभिव्यक्ति राजत्व और शासन दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल पर
  rationale: עַל राजकीय अधिकार के क्षेत्र को और כָּל उसकी संपूर्ण व्यापकता को दर्शाता है।
- source_word: וַיְהִי עֹשֶׂה
  choice: करता रहा
  rationale: היה के साथ कृदंत निरंतर अथवा नियमित कार्य का भाव देता है; 'करता रहा' इस पक्ष को सहज हिंदी में सुरक्षित रखता है।
- source_word: מִשְׁפָּט
  choice: न्याय
  rationale: राजकीय संदर्भ में यह विधिसम्मत न्याय और न्यायपूर्ण व्यवस्था के संचालन को सूचित करता है।
- source_word: וּצְדָקָה
  choice: धार्मिकता
  rationale: צְדָקָה नैतिक सहीपन और उचित आचरण को व्यक्त करता है। 'न्याय' के साथ इसे अलग पद के रूप में रखना इब्रानी युग्म का अर्थगत तनाव सुरक्षित रखता है।
- source_word: לְכָל עַמּוֹ
  choice: अपनी सारी प्रजा के लिए
  rationale: ל लाभार्थी संबंध व्यक्त करता है, प्रत्यय दाऊद की अपनी प्रजा को सूचित करता है, और राजकीय प्रसंग में 'प्रजा' עַם का स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: राजकीय नैतिक युग्म מִשְׁפָּט וּצְדָקָה का अनुवाद
  choice: न्याय और धार्मिकता
  alternative: न्याय और सही काम; न्याय और धर्मपरायणता
  rationale: दो अलग संकल्पनाओं—विधिक न्याय और नैतिक सहीपन—को बनाए रखने से आदर्श राजत्व का स्रोतगत अर्थ सुरक्षित रहता है और दोनों को एक ही धारणा में नहीं मिलाया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण ऐतिहासिक-वर्णनात्मक रूप। निरंतर शासन और नियमित न्यायपूर्ण आचरण के लिए 'करता रहा' का समानांतर प्रयोग किया गया है।
