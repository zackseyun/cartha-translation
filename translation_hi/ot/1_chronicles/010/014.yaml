source:
  edition: WLC
  text: וְ/לֹֽא דָרַ֥שׁ בַּֽ/יהוָ֖ה וַ/יְמִיתֵ֑/הוּ וַ/יַּסֵּב֙ אֶת הַ/מְּלוּכָ֔ה לְ/דָוִ֖יד בֶּן יִשָֽׁי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/014.yaml
  text: He did not seek Yahweh[b][a], so he put him to death and turned the kingdom over to David son of Jesse.
translation:
  language: hi
  text: उसने याहवे की खोज नहीं की[a]; इसलिए याहवे ने उसे मार डाला और राज्य[b] यिशै के पुत्र दाऊद को सौंप दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे से पूछा नहीं” अथवा “याहवे से परामर्श नहीं लिया।”
    reason: lexical_alternative
  - marker: b
    text: या “राजत्व” अथवा “राजकीय शासन।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דָרַשׁ בַּיהוָה
  choice: याहवे की खोज नहीं की
  rationale: דָרַשׁ के साथ ב और ईश्वरीय कर्म का अर्थ खोजने के साथ-साथ उससे पूछना या परामर्श लेना भी हो सकता है। मुख्य पाठ में व्यापक संबंधपरक अर्थ रखा गया है और विशेष परामर्श-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके निकट लिप्यंतरण से व्यक्त किया गया है।
- source_word: וַיְמִיתֵהוּ
  choice: याहवे ने उसे मृत्यु के हवाले कर दिया
  rationale: מות के हिफ़ील रूप की कारकता और याहवे की अंतिम एजेंसी को स्पष्ट तथा स्वाभाविक हिन्दी में रखा गया है; इसे केवल मृत्यु की अनुमति देने के अर्थ में नरम नहीं किया गया।
- source_word: וַיַּסֵּב
  choice: सौंप दिया
  rationale: हिफ़ील क्रिया यहाँ राजकीय अधिकार को एक व्यक्ति से दूसरे को हस्तांतरित करने का भाव देती है। ‘सौंप दिया’ आधुनिक हिन्दी में इस परिवर्तन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמְּלוּכָה
  choice: राज्य
  rationale: מְלוּכָה राज्य, राजत्व या राजकीय शासन को सूचित कर सकता है। ‘राज्य’ सहज और व्यापक है, जबकि ‘राजत्व’ को पादटिप्पणी में विकल्प के रूप में सुरक्षित रखा गया है।
- source_word: לְדָוִיד בֶּן־יִשַׁי
  choice: यिशै के पुत्र दाऊद को
  rationale: इब्रानी संरक्षक-नाम को स्वाभाविक आधुनिक हिन्दी संबंधवाचक क्रम में व्यक्त किया गया है।
theological_decisions:
- issue: शाऊल की मृत्यु में याहवे की भूमिका
  choice: याहवे को शाऊल की मृत्यु का स्पष्ट कर्ता बताया गया है।
  alternative: याहवे ने केवल शाऊल को मरने दिया।
  rationale: संदर्भ में וַיְמִיתֵהוּ का कर्ता याहवे है और हिफ़ील रूप कारकता व्यक्त करता है। अनुवाद इस तनाव को नरम करके केवल अनुमति में नहीं बदलता, फिर भी गौण मानवीय कारणों के विषय में पाठ से आगे नहीं जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कर्ता के अचानक बदलने से हिन्दी में पैदा होने वाली अस्पष्टता से बचने के लिए दूसरे खंड में ‘याहवे’ स्पष्ट रूप से दोहराया गया है।
