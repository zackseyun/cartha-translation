base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/008.yaml
  text: It happened on the next day that the Philistines came to strip the slain[b][a], and they found Saul and his sons fallen on Mount Gilboa.
translation:
  language: hi
  text: अगले दिन[a] पलिश्ती युद्ध में मारे गए लोगों के कपड़े-कवच उतारने[b] आए। उन्हें शाऊल और उसके बेटे गिलबोआ पर्वत पर गिरे हुए मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके अगले दिन”।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उतारने” का अर्थ युद्ध में मारे गए लोगों से लूट लेना है, जैसे उनके कपड़े या कवच।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह वाक्यांश पिछली घटनाओं के अगले दिन का संकेत देता है। हिन्दी कथा में अलग से ‘और ऐसा हुआ’ कहना आवश्यक नहीं है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जाति के लिए प्रचलित और सहज हिन्दी रूप।
- source_word: לְפַשֵּׁט
  choice: कपड़े और हथियार उतारने
  rationale: युद्धभूमि के संदर्भ में क्रिया मारे गए लोगों से वस्त्र, कवच या अन्य लूट उतार लेने को दर्शाती है; हिन्दी में केवल ‘उतारने’ कहना अस्पष्ट होता।
- source_word: הַחֲלָלִים
  choice: युद्ध में मारे गए लोगों
  rationale: यह शब्द विशेष रूप से हिंसा या युद्ध में मारे गए लोगों को सूचित करता है और सामान्य ‘मरे हुओं’ से अधिक सटीक है।
- source_word: נֹפְלִים
  choice: गिरे हुए
  rationale: मूल का ‘गिरे हुए’ वाला युद्ध-संबंधी बिंब सुरक्षित रखा गया है; संदर्भ से उनकी मृत्यु स्पष्ट है।
- source_word: בְּהַר גִּלְבֹּעַ
  choice: गिलबोआ पर्वत पर
  rationale: स्थाननाम और पर्वतीय स्थल का सीधा, स्वाभाविक हिन्दी रूप।
