    text: इब्रानी में शाब्दिक रूप से ‘इस्राएल का पुरुष भाग गया’ है; यहाँ एकवचन ‘पुरुष’ सामूहिक अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: पलिश्तियों ने
  rationale: ו कथानक को जोड़ता है; हिंदी में नए अनुच्छेद के आरंभ पर अलग से ‘और’ आवश्यक नहीं। ‘पलिश्ती’ इस जाति-नाम का प्रचलित हिंदी रूप है।
- source_word: נִלְחֲמוּ בְיִשְׂרָאֵל
  choice: इस्राएल से युद्ध किया
  rationale: לחם का निफ़अल रूप ב के साथ यहाँ शत्रुतापूर्ण युद्ध को व्यक्त करता है। ‘से युद्ध किया’ स्वाभाविक और स्पष्ट हिंदी है।
- source_word: וַיָּנָס אִישׁ יִשְׂרָאֵל
  choice: इस्राएली पुरुष ... भाग गए
  rationale: एकवचन אִישׁ यहाँ सामूहिक अर्थ में प्रयुक्त है। बहुवचन ‘इस्राएली पुरुष’ उसके सामूहिक और पुरुषवाचक आशय को बनाए रखता है।
- source_word: מִפְּנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सामने से
  rationale: מִפְּנֵי का शाब्दिक भाव ‘के सामने से/उपस्थिति से’ है; यह युद्धभूमि से पीछे हटने का दृश्य सुरक्षित रखता है।
- source_word: וַיִּפְּלוּ חֲלָלִים
  choice: मारे गए
  rationale: נפל और חֲלָלִים का मेल युद्ध में धराशायी होकर मारे जाने का रूढ़ भाव देता है। हिंदी में ‘मारे गए’ स्वाभाविक है और केवल गिरने की भ्रामक धारणा से बचाता है।
- source_word: בְּהַר גִּלְבֹּעַ
  choice: गिलबोआ पर्वत पर
  rationale: הַר के साथ स्थान-नाम को हिंदी में स्वाभाविक रूप से ‘गिलबोआ पर्वत’ और स्थलसूचक ב को ‘पर’ कहा गया है।
