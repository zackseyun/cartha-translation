base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/007.yaml
  text: When all the men of Israel who were in the valley saw that they had fled and that Saul and his sons were dead[a], they abandoned their cities and fled[c][b]; then the Philistines came and lived in them.
translation:
  language: hi
  text: जब इस्राएल के सब पुरुषों ने, जो घाटी में थे, देखा कि वे भाग गए थे और शाऊल तथा उसके पुत्र मर चुके थे, तब वे अपने नगरों को छोड़कर भाग गए। फिर पलिश्ती आए और उनमें बस गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: देखा
  rationale: ראה का मूल अर्थ दृश्य रूप से देखना है; इससे युद्ध के परिणाम को प्रत्यक्ष देखने की कथात्मक ठोसता बनी रहती है।
- source_word: כָּל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सब पुरुषों
  rationale: כָּל के बाद एकवचन אִישׁ का भाव समष्टिगत/वितरणात्मक है और मूल पाठ स्पष्ट रूप से पुरुषवाचक भाषा प्रयोग करता है।
- source_word: אֲשֶׁר בָּעֵמֶק
  choice: घाटी में रहनेवाले
  rationale: עֵמֶק का सामान्य स्थलाकृतिक अर्थ ‘घाटी’ है; ‘मैदान’ भी संदर्भानुसार संभव है।
- source_word: כִּי נָסוּ
  choice: कि वे भाग गए हैं
  rationale: कर्ता हिब्रू में अव्यक्त है; ‘वे’ उस अस्पष्टता को बनाए रखता है। पूर्ण हो चुकी भगदड़ को देखकर जानने के कारण हिंदी का पूर्ण पक्ष स्वाभाविक है।
- source_word: וְכִי מֵתוּ שָׁאוּל וּבָנָיו
  choice: और शाऊल तथा उसके पुत्र मर चुके हैं
  rationale: यह उस समय दिखाई देनेवाली परिणामी अवस्था को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַיַּעַזְבוּ עָרֵיהֶם
  choice: वे अपने नगरों को छोड़कर
  rationale: עזב का अर्थ पीछे छोड़ देना है; ‘छोड़कर’ विस्थापन को स्पष्ट करता है और हिंदी में सहज है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוס भागने या पलायन करने का सामान्य क्रियापद है।
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: फिर पलिश्ती आए
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘फिर’ घटनाक्रम स्पष्ट करता है।
- source_word: וַיֵּשְׁבוּ בָּהֶם
  choice: और उनमें बस गए
  rationale: ישב यहाँ छोड़े गए नगरों में निवास स्थापित करने या बसने का भाव देता है।
