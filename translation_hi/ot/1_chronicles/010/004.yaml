  text: וַ/יֹּ֣אמֶר שָׁאוּל֩ אֶל נֹשֵׂ֨א כֵלָ֜י/ו שְׁלֹ֥ף חַרְבְּ/ךָ֣ וְ/דָקְרֵ֣/נִי בָ֗/הּ פֶּן יָבֹ֜אוּ הָ/עֲרֵלִ֤ים הָ/אֵ֨לֶּה֙ וְ/הִתְעַלְּלוּ בִ֔/י וְ/לֹ֤א אָבָה֙ נֹשֵׂ֣א כֵלָ֔י/ו כִּ֥י יָרֵ֖א מְאֹ֑ד וַ/יִּקַּ֤ח שָׁאוּל֙ אֶת הַ/חֶ֔רֶב וַ/יִּפֹּ֖ל עָלֶֽי/הָ־׀־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and mistreat me.” But his armor-bearer was not willing, because he was very afraid[c][b]. So Saul took the sword and fell on it.
translation:
  language: hi
  text: तब शाऊल ने अपने हथियार उठाने वाले से कहा, “अपनी तलवार खींच और उससे मुझे आर-पार कर दे, कहीं ऐसा न हो कि ये खतनारहित लोग आकर मेरे साथ दुर्व्यवहार करें।”[a] पर उसके हथियार उठाने वाले ने ऐसा करना नहीं चाहा, क्योंकि वह बहुत भयभीत था। तब शाऊल ने तलवार ली और उस पर गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “मेरा अपमान करें,” “मेरे साथ खिलवाड़ करें” या “मेरे साथ क्रूरता करें” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: उसके हथियार उठानेवाले
  rationale: इब्रानी पद का शाब्दिक अर्थ उसके साज-सामान या हथियार उठानेवाला है। यह सहज हिन्दी है और सैन्य भूमिका को ‘अंगरक्षक’ जैसे अधिक विशिष्ट पद में नहीं बदलती।
- source_word: שְׁלֹף חַרְבְּךָ
  choice: अपनी तलवार खींच
  rationale: तलवार के संदर्भ में क्रिया का अर्थ म्यान से तलवार खींचना है; संक्षिप्त हिन्दी मूल आज्ञा की तीव्रता बनाए रखती है।
- source_word: וְדָקְרֵנִי בָהּ
  choice: उससे मुझे आर-पार कर दे
  rationale: דקר हथियार से भेदने को दर्शाता है। यह प्रयोग घातक आशय को स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त विवरण जोड़े।
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: ये खतनारहित लोग
  rationale: मूल के जातीय-धार्मिक और तिरस्कारसूचक वर्णन को बनाए रखा गया है; प्रसंग से पलिश्ती समझे जाते हैं, पर उनका नाम यहाँ मूल पाठ में नहीं है।
- source_word: וְהִתְעַלְּלוּ בִי
  choice: मेरे साथ दुर्व्यवहार करें
  rationale: यह व्यापक अभिव्यक्ति अपमानजनक और संभवतः हिंसक व्यवहार का भाव रखती है, लेकिन उसके सटीक रूप को निश्चित नहीं करती।
- source_word: וְלֹא אָבָה
  choice: ऐसा करना नहीं चाहा
  rationale: यह ‘सहमत या इच्छुक न होना’ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: כִּי יָרֵא מְאֹד
  choice: क्योंकि वह बहुत डर गया था
  rationale: कारण और भय की तीव्रता दोनों को स्पष्ट रूप से बनाए रखता है।
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: उस पर गिर पड़ा
  rationale: मूल का सीधा अर्थ रखा गया है; ‘अपने आपको उस पर फेंक दिया’ कहने से बचा गया है क्योंकि वह अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: शाऊल को जिस व्यवहार का भय था उसका स्वरूप
  choice: मेरे साथ दुर्व्यवहार करें
  alternative: मेरा अपमान करें; मेरे साथ खिलवाड़ करें; मेरे साथ क्रूरता करें
  rationale: इब्रानी क्रिया अपमानजनक, क्रूर या उपहासपूर्ण व्यवहार को समेट सकती है, पर यहाँ उसके स्वरूप को स्पष्ट नहीं करती। व्यापक अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सहज, गंभीर और कथात्मक रखी गई है। ‘हथियार उठानेवाला’ सामान्य पाठक के लिए समझने योग्य है, जबकि ‘खतनारहित’ मूल पाठ की तीखी सांस्कृतिक अभिव्यक्ति को नरम किए बिना सुरक्षित रखता है।
