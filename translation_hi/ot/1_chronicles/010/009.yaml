source:
  edition: WLC
  text: וַ/יַּ֨פְשִׁיטֻ֔/הוּ וַ/יִּשְׂא֥וּ אֶת רֹאשׁ֖/וֹ וְ/אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר אֶת עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/009.yaml
  text: They stripped him[a], took his head and his weapons, and sent word throughout the land of the Philistines to proclaim the news to their idols and to the people.
translation:
  language: hi
  text: उन्होंने उसके कपड़े उतार लिए[a], उसका सिर और उसके हथियार ले लिए, और उनकी देव-मूर्तियों और लोगों को समाचार सुनाने के लिए पलिश्तियों के सारे देश में संदेश भिजवाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसका युद्ध-साज उतार लिया।’
    reason: इब्रानी क्रिया वस्त्र अथवा युद्ध-साज उतारने के लिए प्रयुक्त हो सकती है; इस पद में वस्तु अलग से नहीं बताई गई।
lexical_decisions:
- source_word: וַיַּפְשִׁיטֻהוּ
  choice: उन्होंने उसके कपड़े उतार लिए
  rationale: पיעל रूप का अर्थ किसी व्यक्ति के वस्त्र या युद्ध-साज उतारना है। मूल में कवच स्पष्ट नहीं है, इसलिए उसे जोड़ने के बजाय सामान्य पर स्वाभाविक हिंदी रखी गई है।
- source_word: וַיִּשְׂאוּ אֶת רֹאשׁוֹ
  choice: उसका सिर ... ले लिए
  rationale: נשא यहाँ युद्ध की लूट अथवा विजय-चिह्न के रूप में उठा ले जाने का भाव देता है; ‘ले लिए’ संक्षिप्त है और सिर काटने की क्रिया को अलग से नहीं जोड़ता।
- source_word: כֵּלָיו
  choice: उसके हथियार
  rationale: כְּלִי व्यापक शब्द है, पर युद्धभूमि के संदर्भ में हथियार सबसे संभावित और सहज अर्थ है।
- source_word: וַיְשַׁלְּחוּ
  choice: यह समाचार भिजवाया
  rationale: मूल क्रिया केवल ‘भेजना’ कहती है और आगे उद्देश्यसूचक לְבַשֵּׂר है। हिंदी में ‘समाचार भिजवाया’ निहित संदेश को स्वाभाविक ढंग से व्यक्त करता है, बिना दूतों को स्पष्ट रूप से जोड़ने के।
- source_word: בְאֶרֶץ פְלִשְׁתִּים סָבִיב
  choice: पलिश्तियों के पूरे देश में
  rationale: סָבִיב यहाँ चारों ओर फैलाव का भाव देता है; ‘पूरे देश में’ आधुनिक हिंदी में उसी व्यापकता को सहज रूप से व्यक्त करता है।
- source_word: לְבַשֵּׂר
  choice: घोषणा की जाए
  rationale: בשר समाचार सुनाने या विजय का समाचार घोषित करने को दर्शाता है। यहाँ सार्वजनिक विजय-घोषणा अभिप्रेत है।
- source_word: עֲצַבֵּיהֶם
  choice: उनकी देव-मूर्तियों
  rationale: עֶצֶב देवता का प्रतिनिधित्व करने वाली उपासना-मूर्ति को सूचित कर सकता है। ‘देव-मूर्ति’ संदर्भ को स्पष्ट रखते हुए वस्तुगत ‘प्रतिमा’ और मूल्यांकनात्मक ‘मूरत’ के बीच संतुलन रखता है।
- source_word: הָעָם
  choice: लोगों
  rationale: एकवचन सामूहिक संज्ञा यहाँ पलिश्ती जनसमुदाय को दर्शाती है; हिंदी में ‘लोगों’ स्वाभाविक है।
theological_decisions:
- issue: עֲצַבֵּיהֶם का उपासना-संदर्भ में अनुवाद
  choice: उनकी देव-मूर्तियों
  alternative: उनकी मूर्तियों / उनके देवताओं
  rationale: यह शब्द उपासना की प्रतिमाओं को सूचित करता है और संभवतः प्रतिमाओं के माध्यम से देवताओं का उल्लेख करता है। ‘देव-मूर्तियों’ से यह संबंध बना रहता है, पर पाठ को केवल अमूर्त ‘देवताओं’ तक सीमित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘समाचार भिजवाया’ मूल के अस्पष्ट भेजे गए माध्यम को बनाए रखता है; ‘दूत भेजे’ जैसा अनुल्लिखित विवरण नहीं जोड़ा गया।
