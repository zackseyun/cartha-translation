base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/011.yaml
  text: When all Jabesh-gilead heard all that the Philistines had done to Saul[b][a],
translation:
  language: hi
  text: जब याबेश-गिलाद के सभी लोगों ने सुना कि पलिश्तियों ने शाऊल के साथ जो कुछ किया था[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाऊल के विरुद्ध जो कुछ किया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: जब ... ने सुना
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है, और अगली आयत में आने वाली प्रतिक्रिया की समयगत भूमिका को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘जब’ उपयुक्त है।
- source_word: כֹּל יָבֵישׁ גִּלְעָד
  choice: याबेश-गिलाद के सभी लोगों
  rationale: इब्रानी में शाब्दिक रूप से ‘सारा याबेश-गिलाद’ है, पर प्रसंग में नगर के निवासी अभिप्रेत हैं। आधुनिक हिन्दी में स्थान-नाम के साथ ‘के सभी लोगों’ अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: क्या-क्या
  rationale: यह अभिव्यक्ति किए गए समस्त कार्यों को समेटती है। ‘क्या-क्या’ हिन्दी में स्वाभाविक रूप से उस समग्रता को व्यक्त करता है।
- source_word: עָשׂוּ
  choice: किया था
  rationale: कार्य सुनने से पहले हो चुका था; हिन्दी का पूर्ण भूतकाल कथा के कालक्रम को स्पष्ट करता है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस जनसमूह के नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: לְשָׁאוּל
  choice: शाऊल के साथ
  rationale: עשה के साथ ל उस व्यक्ति को चिह्नित करता है जो कार्य से प्रभावित हुआ। ‘के साथ’ मूल की व्यापकता बनाए रखता है और ‘के विरुद्ध’ जैसी अधिक प्रबल व्याख्या को मुख्य पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: לְשָׁאוּל में संबंध की दिशा
  choice: शाऊल के साथ
  alternative: शाऊल के विरुद्ध
  rationale: मूल पूर्वसर्ग प्रभावित व्यक्ति का संकेत दे सकता है, लेकिन स्वयं शत्रुता की तीव्रता को स्पष्ट नहीं करता। प्रसंग शत्रुतापूर्ण है, फिर भी अनुवाद में पूर्वसर्ग से अधिक अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मुख्य वाक्य अगली आयत से जुड़ने के कारण अल्पविराम पर समाप्त रखा गया है। ‘याबेश-गिलाद के सभी लोगों’ शाब्दिक स्थानवाचक अभिव्यक्ति का स्पष्ट जनवाचक अर्थ देता है।
