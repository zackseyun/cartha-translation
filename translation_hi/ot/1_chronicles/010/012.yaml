base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/012.yaml
  text: Then all the valiant men arose and carried away the body of Saul and the bodies of his sons[a], and brought them to Jabesh[b]. They buried their bones under the oak in Jabesh and fasted seven days.
translation:
  language: hi
  text: तब सभी वीर पुरुष उठे और शाऊल के शव तथा उसके पुत्रों के शवों को उठाकर याबेश तक ले आए। उन्होंने उनकी हड्डियाँ याबेश में उस बड़े पेड़[a] के नीचे दफनाईं और सात दिन तक उपवास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘बलूत’ अथवा ‘तारपीन-वृक्ष’। इब्रानी शब्द אֵלָה बलूत या तारपीन के समान किसी बड़े वृक्ष को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: सभी वीर पुरुष
  rationale: यह प्रचलित इब्रानी पदबंध साहस, सामर्थ्य और सैनिक पराक्रम वाले पुरुषों को दर्शाता है; ‘वीर पुरुष’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: גּוּפַת ... גּוּפֹת
  choice: शाऊल का शव और उसके पुत्रों के शव
  rationale: גּוּפָה मृत देह को दर्शाता है। ‘शव’ प्रसंग को स्पष्ट रखते हुए संक्षिप्त और स्वाभाविक हिन्दी देता है।
- source_word: וַיִּשְׂאוּ
  choice: उठाकर
  rationale: यहाँ נשׂא शवों को उठाकर वहाँ से ले जाने का बोध देता है; अगले क्रियापद ‘ले आए’ के साथ यह अर्थ सहज रूप से व्यक्त होता है।
- source_word: וַיְבִיאוּם יָבֵישָׁה
  choice: याबेश ले आए
  rationale: मसोरेटिक पाठ में स्थान का संक्षिप्त नाम ‘याबेश’ ही है; इसलिए मुख्य पाठ में ‘याबेश-गिलाद’ नहीं जोड़ा गया।
- source_word: עַצְמוֹתֵיהֶם
  choice: उनकी हड्डियाँ
  rationale: עֶצֶם का ठोस, शाब्दिक अर्थ ‘हड्डी’ है। ‘अवशेष’ कहकर पाठ की विशिष्टता को समतल नहीं किया गया।
- source_word: תַּחַת הָאֵלָה
  choice: बड़े पेड़ के नीचे
  rationale: אֵלָה किसी बड़े ओक/बांज या तारपीन-वृक्ष जैसे पेड़ को सूचित कर सकता है। प्रजाति की अनिश्चितता बनाए रखने के लिए सुलभ सामान्य पद चुना गया और विकल्प पादटिप्पणी में दिए गए।
- source_word: וַיָּצֻמוּ שִׁבְעַת יָמִים
  choice: सात दिन तक उपवास किया
  rationale: यह शोक से जुड़े सात दिन के उपवास का सीधा और स्वाभाविक हिन्दी रूप है।
