source:
  edition: WLC
  text: וַ/יַּדְבְּק֣וּ פְלִשְׁתִּ֔ים אַחֲרֵ֥י שָׁא֖וּל וְ/אַחֲרֵ֣י בָנָ֑י/ו וַ/יַּכּ֣וּ פְלִשְׁתִּ֗ים אֶת יוֹנָתָ֧ן וְ/אֶת אֲבִינָדָ֛ב וְ/אֶת מַלְכִּי שׁ֖וּעַ בְּנֵ֥י שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/002.yaml
  text: And the Philistines pursued Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua, the sons of Saul.
translation:
  language: hi
  text: और पलिश्ती शाऊल और उसके बेटों का लगातार पीछा करते रहे[a]। पलिश्तियों ने शाऊल के बेटों योनातान, अबीनादाब और मल्कीशू को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके बिलकुल पीछे लगे रहे।” इब्रानी क्रिया का मूल भाव “चिपके रहने” का है और यहाँ युद्ध में निकट तथा अथक पीछा करने को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵי
  choice: लगातार पीछा करते रहे
  rationale: דבק का मूल अर्थ ‘चिपके रहना’ है; אַחֲרֵי के साथ युद्ध-वृत्तांत में यह निकट और अथक पीछा करने का भाव देता है। यह हिंदी प्रयोग उस तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָנָיו / בְּנֵי שָׁאוּל
  choice: उसके बेटे / शाऊल के बेटे
  rationale: संज्ञा यहाँ पुरुष संतानों को सूचित करती है, और आगे दिए गए नाम इसकी पुष्टि करते हैं।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: נכה का अर्थ प्रहार करना या मार गिराना हो सकता है। युद्ध के इस प्रसंग में ‘मार गिराया’ मृत्यु के परिणाम को स्पष्ट करते हुए मूल क्रिया की सैन्य प्रकृति बनाए रखता है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के लिए प्रचलित हिंदी बाइबलीय नाम; इब्रानी की तरह दोनों वाक्यों में इसे दोहराया गया है।
- source_word: יוֹנָתָן
  choice: योनातान
  rationale: व्यक्तिनाम का स्रोत-संगत और हिंदी में प्रचलित लिप्यंतरण।
- source_word: אֲבִינָדָב
  choice: अबीनादाब
  rationale: व्यक्तिनाम का स्रोत-संगत हिंदी लिप्यंतरण।
- source_word: מַלְכִּי שׁוּעַ
  choice: मल्कीशू
  rationale: व्यक्तिनाम का हिंदी बाइबल परंपरा में परिचित रूप, जो इब्रानी नाम के उच्चारण को सुगम ढंग से प्रस्तुत करता है।
