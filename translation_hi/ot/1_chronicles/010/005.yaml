  yaml_path: translation/ot/1_chronicles/010/005.yaml
  text: When his armor-bearer saw that Saul was dead[b][a], he too fell on the sword and died.
translation:
  language: hi
  text: जब उसके हथियार उठानेवाले[a] ने देखा कि शाऊल मर चुका था, तो वह भी तलवार पर[b] गिर पड़ा और मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: और अधिक शाब्दिक रूप में, “उसके हथियारों को उठानेवाला।”
    reason: lexical_alternative
  - marker: b
    text: “तलवार पर गिर पड़ा” का अर्थ है कि उसने तलवार से अपने प्राण ले लिए।
    reason: cultural_note
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: उसके हथियार उठानेवाले
  rationale: यह पद उस सैनिक सहायक की भूमिका बताता है जो शाऊल के हथियार उठाता था। यह हिन्दी में सहज है और मूल के बहुवचन ‘हथियारों/साज-सामान’ के भाव को बनाए रखता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात का परिचय देता है जिसे हथियार उठानेवाले ने देखा—कि शाऊल मर चुका था।
- source_word: מֵת
  choice: मर चुका था
  rationale: यह शाऊल की उस समय दिखाई दी मृत अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּפֹּל
  choice: गिर पड़ा
  rationale: मूल क्रिया का सामान्य अर्थ ‘गिरना’ है; तलवार के साथ इसका मुहावरेदार आत्मघाती आशय संदर्भ और पादटिप्पणी से स्पष्ट होता है।
- source_word: גַּם הוּא
  choice: वह भी
  rationale: यह बल देता है कि हथियार उठानेवाले ने भी शाऊल की तरह अपने प्राण दे दिए।
- source_word: עַל הַחֶרֶב
  choice: तलवार पर
  rationale: मूल में निश्चित तलवार का उल्लेख है, पर ‘उसकी तलवार’ नहीं कहा गया; इसलिए स्वामित्व जोड़े बिना अभिव्यक्ति रखी गई है।
- source_word: וַיָּמֹת
  choice: और मर गया
  rationale: यह संक्षिप्त कथात्मक क्रम और उस कार्य के परिणाम को सीधे व्यक्त करता है।
