  text: The battle grew heavy against Saul, and the archers found him, and he was badly wounded by the archers.
translation:
  language: hi
  text: युद्ध शाऊल पर भारी पड़ने लगा। धनुर्धारी उसके पास आ पहुँचे, और वह उनसे घायल हो गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धनुर्धारियों के कारण वह बहुत व्याकुल हो गया।” इब्रानी क्रिया का अर्थ शारीरिक रूप से घायल होने के बजाय तीव्र पीड़ा या व्याकुलता में होना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה עַל שָׁאוּל
  choice: युद्ध शाऊल पर भारी पड़ने लगा
  rationale: यह अनुवाद כבד के ‘भारी होने’ वाले इब्रानी बिंब को बनाए रखते हुए युद्ध के शाऊल के विरुद्ध तीव्र हो जाने का स्वाभाविक हिन्दी भाव देता है।
- source_word: וַיִּמְצָאֻהוּ
  choice: उसके पास आ पहुँचे
  rationale: מצא का मूल अर्थ ‘पाना’ है; सैनिक प्रसंग में धनुर्धारियों के शाऊल तक पहुँच जाने का भाव है। ‘आ पहुँचे’ हिन्दी में स्वाभाविक है और अनावश्यक रूप से खोजने का भाव नहीं जोड़ता।
- source_word: הַמּוֹרִים בַּקָּשֶׁת
  choice: धनुर्धारी
  rationale: शाब्दिक अर्थ ‘धनुष से चलानेवाले’ है; ‘धनुर्धारी’ इसका संक्षिप्त, प्रचलित और गरिमापूर्ण हिन्दी रूप है।
- source_word: וַיָּחֶל
  choice: बुरी तरह घायल हो गया
  rationale: इस कठिन क्रिया को प्रसंगानुसार शारीरिक चोट के रूप में लिया गया है। ‘बुरी तरह’ उसकी गंभीर दशा व्यक्त करता है, जबकि वैकल्पिक ‘बहुत व्याकुल होना’ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִן הַיּוֹרִים
  choice: उनसे
  rationale: מן यहाँ स्रोत अथवा कारण बताता है। निकटवर्ती ‘धनुर्धारी’ की पुनरावृत्ति से बचते हुए ‘उनसे’ उसी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וַיָּחֶל में शारीरिक घाव और तीव्र व्याकुलता के बीच अस्पष्टता
  choice: मुख्य पाठ में शारीरिक रूप से घायल होना
  alternative: धनुर्धारियों के कारण बहुत व्याकुल होना
  rationale: युद्ध-प्रसंग में घायल होना कथानक के अनुकूल है, पर इब्रानी क्रिया तीव्र पीड़ा या व्याकुलता भी व्यक्त कर सकती है; इसलिए वैकल्पिक अर्थ को पादटिप्पणी में स्पष्ट रखा गया है।
translation_notes:
