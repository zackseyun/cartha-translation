  yaml_path: translation/ot/1_chronicles/010/006.yaml
  text: So Saul died[a], and his three sons, and all his house died together.
translation:
  language: hi
  text: इस प्रकार शाऊल मर गया, और उसके तीन बेटे तथा उसका सारा घराना भी एक साथ मर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: इस प्रकार ... मर गया
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती और पिछले घटनाक्रम का परिणाम बताती है। ‘इस प्रकार’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक ढंग से व्यक्त करता है; क्रिया का मूल अर्थ ‘मर गया’ है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इस इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय रूप।
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: और उसके तीनों बेटे
  rationale: संख्या, संज्ञा और तृतीय पुरुष एकवचन प्रत्यय से ‘उसके तीन बेटे’ का अर्थ निकलता है। प्रसंग में ये तीनों बेटे पहले से दृष्टि में हैं, इसलिए ‘तीनों’ स्वाभाविक और सटीक है।
- source_word: וְכָל בֵּיתוֹ
  choice: तथा उसका पूरा घराना
  rationale: בַּיִת यहाँ भौतिक भवन नहीं, बल्कि परिवार, गृहस्थी या वंशगत घराने को सूचित करता है। ‘घराना’ मूल रूपक और उसके व्यापक अर्थ को बनाए रखता है, जबकि ‘पूरा’ כָל को व्यक्त करता है।
- source_word: יַחְדָּו
  choice: सब एक साथ
  rationale: यह क्रियाविशेषण सामूहिक रूप से हुई मृत्यु को बताता है। ‘सब एक साथ’ हिन्दी में उसके सामूहिक बल को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵתוּ
  choice: मर गए
  rationale: मूल में बहुवचन पूर्ण क्रिया है। आरंभ के एकवचन ‘मर गया’ के बाद इसकी पुनरावृत्ति इब्रानी वाक्य की संरचना और जोर को बनाए रखती है।
theological_decisions:
- issue: ‘उसका पूरा घराना’ का दायरा
  choice: मुख्य पाठ में ‘उसका पूरा घराना’ रखा गया है और उसके आशय की व्यापकता पादटिप्पणी में बताई गई है।
  alternative: उसका पूरा घर-परिवार; उसका पूरा परिवार; उसका सारा वंश
  rationale: इब्रानी ‘उसका सारा घर’ परिवार, गृहस्थी या वंशगत घराने को सूचित कर सकता है। इसे शाऊल के प्रत्येक दूरस्थ रिश्तेदार के बारे में सार्वभौमिक दावा बनाना उचित नहीं; निकट प्रसंग उन लोगों की सामूहिक मृत्यु पर केंद्रित है जो उसके साथ इस घटना में सम्मिलित थे।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘बेटे’ सामान्य पाठक के लिए स्वाभाविक है; ‘घराना’ मूल इब्रानी रूपक और उसके परिवार/वंश संबंधी अर्थ-विस्तार को सुरक्षित रखता है। डैश सामूहिक ‘सब एक साथ’ पर मूल पाठ के जोर को स्पष्ट करता है।
