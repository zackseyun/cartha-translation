  rationale: שׂים का सामान्य अर्थ ‘रखना/स्थापित करना’ है; यहाँ ‘रख दिया’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: כֵּלָיו
  choice: उसके युद्ध के साज-सामान
  rationale: כְּלִי का अर्थ वस्तु, उपकरण, हथियार या युद्ध-सामग्री हो सकता है। युद्ध के प्रसंग में यह व्यापक अनुवाद हथियार और कवच दोनों की संभावना बनाए रखता है।
- source_word: בֵּית אֱלֹהֵיהֶם
  choice: अपने देवताओं के भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और उपासना के प्रसंग में यह मन्दिर को सूचित करता है। ‘भवन’ मूल रूपक को बनाए रखता है।
- source_word: גֻּלְגָּלְתּוֹ
  choice: उसकी खोपड़ी
  rationale: גֻּלְגֹּלֶת विशेष रूप से खोपड़ी को दर्शाता है, यद्यपि प्रसंग में इसका आशय सिर भी हो सकता है।
- source_word: תָקְעוּ
  choice: लगा दिया
  rationale: תקע में गाड़ने, ठोकने या दृढ़ता से लगाने का भाव हो सकता है। ‘लगा दिया’ प्रदर्शन हेतु बाँधे या जड़े जाने की क्रिया बताता है, पर अनिश्चित ढंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בֵּית דָּגוֹן
  choice: दागोन के भवन
  rationale: בֵּית का शाब्दिक अर्थ ‘भवन/घर’ है और यहाँ देवता दागोन का मन्दिर अभिप्रेत है; दागोन नाम का लिप्यंतरण किया गया है।
