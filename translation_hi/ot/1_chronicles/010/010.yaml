translation:
  language: hi
  text: उन्होंने उसके युद्ध के साज-सामान को अपने देवताओं के मन्दिर[a] में रख दिया और उसकी खोपड़ी[b] को दागोन के मन्दिर में जड़ दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘अपने देवताओं का घर।’ इब्रानी में ‘घर’ शब्द किसी देवता के मन्दिर के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसका सिर।’ इब्रानी शब्द ‘खोपड़ी’ अथवा ‘सिर’ को सूचित कर सकता है; यहाँ ‘खोपड़ी’ अधिक सटीक है।
    reason: lexical_alternative
