  text: וַ/יָּ֣מָת שָׁא֗וּל בְּ/מַֽעֲל/וֹ֙ אֲשֶׁ֣ר מָעַ֣ל בַּֽ/יהוָ֔ה עַל דְּבַ֥ר יְהוָ֖ה אֲשֶׁ֣ר לֹא שָׁמָ֑ר וְ/גַם לִ/שְׁא֥וֹל בָּ/א֖וֹב לִ/דְרֽוֹשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/010/013.yaml
  text: So Saul died for his unfaithfulness by which he was unfaithful to Yahweh[a], because of the word of Yahweh, which he did not keep, and also because he asked counsel of a medium[b], to inquire.
translation:
  language: hi
  text: इस प्रकार शाऊल अपने उस विश्वासघात के कारण मर गया, जो उसने यहवे के विरुद्ध किया था[a]। उसने यहवे के वचन का पालन नहीं किया, और जानकारी लेने के लिए एक माध्यम[b] से भी परामर्श लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने उस निष्ठाभंग के कारण, जो उसने यहवे के प्रति किया था।”
    reason: lexical_alternative
  - marker: b
    text: “माध्यम” ऐसे व्यक्ति को कहा गया है जिससे मृतकों या आत्माओं के विषय में जानकारी ली जाती थी; 1 शमूएल 28:7 से तुलना करें।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: इस प्रकार ... मर गया
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है और पिछले प्रसंग के परिणाम से इस मृत्यु को जोड़ता है।
- source_word: בְּמַעֲלוֹ אֲשֶׁר מָעַל
  choice: अपने उस विश्वासघात के कारण ... जो उसने ... किया था
  rationale: संज्ञा और उसी धातु से बने क्रिया-रूप का बल यथासंभव बनाए रखते हुए यह वाचा-संबंधी निष्ठाभंग को व्यक्त करता है। हिंदी में हूबहू पुनरुक्ति अस्वाभाविक होती, इसलिए आशय को स्वाभाविक ढंग से रखा गया है।
- source_word: בַּיהוָה
  choice: यहवे के विरुद्ध
  rationale: מעל के साथ ב उस व्यक्ति को सूचित करता है जिसके विरुद्ध विश्वासघात हुआ। परमेश्वर के व्यक्तिगत वाचा-नाम को 'यहवे' लिखा गया है।
- source_word: עַל דְּבַר יְהוָה אֲשֶׁר לֹא שָׁמָר
  choice: उसने यहवे के वचन का पालन नहीं किया
  rationale: शाब्दिक संबंध को स्पष्ट, आधुनिक हिंदी में कारण के विवरण के रूप में व्यक्त करता है; שׁמר यहाँ वचन को मानने या पालन करने के अर्थ में है।
- source_word: לִשְׁאוֹל בָּאוֹב
  choice: एक प्रेत-साधिका से ... परामर्श लिया
  rationale: אוֹב यहाँ मृतात्मा या आत्माओं से जानकारी पाने वाली व्यक्ति को सूचित करता है; 1 शमूएल 28 के प्रसंग के अनुसार वह स्त्री है। 'परामर्श लिया' क्रिया के पूछने/मार्गदर्शन चाहने के भाव को व्यक्त करता है।
- source_word: לִדְרֹשׁ
  choice: पूछताछ करने के लिए
  rationale: यह परामर्श लेने का उद्देश्य बताने वाले अंतिम infinitive को अलग रखते हुए मूल की संरचना और अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का वाचा-नाम स्पष्ट रूप से आया है; उसका नामगत स्वरूप बनाए रखने के लिए 'यहवे' चुना गया है।
- issue: शाऊल के अपराध का स्वरूप
  choice: विश्वासघात
  alternative: अविश्वासयोग्यता; अपराध
  rationale: מעל सामान्य पाप से अधिक, परमेश्वर के प्रति निष्ठा तोड़ने का भाव रखता है। 'विश्वासघात' इस वाचा-संबंधी गंभीरता को सुबोध हिंदी में व्यक्त करता है।
- issue: אוֹב का आशय
  choice: प्रेत-साधिका
  alternative: माध्यम; ओझा
  rationale: शब्द के मृतात्माओं/आत्माओं से पूछताछ के सांस्कृतिक आशय को स्पष्ट करता है और संदर्भ में स्त्रीलिंग पहचान बनाए रखता है, बिना इस प्रथा को वैध ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कारणात्मक प्रवाह को दो वाक्यों में बाँटा गया है ताकि लंबी इब्रानी संरचना हिंदी में स्पष्ट रहे। 'प्रेत-साधिका' सांस्कृतिक अर्थ को 'माध्यम' से अधिक साफ बताता है।
