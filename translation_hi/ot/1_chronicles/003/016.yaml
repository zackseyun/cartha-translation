base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/016.yaml
  text: 'And the sons of Jehoiakim: Jeconiah his son[a], Zedekiah his son.'
translation:
  language: hi
  text: 'और यहोयाकीम के पुत्र: यकन्याह उसका पुत्र[a], सिदकियाह उसका पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ संक्षिप्त है: “यकन्याह उसका पुत्र, सिदकियाह उसका पुत्र।” इसे एक क्रमिक वंशावली के रूप में पढ़ा जा सकता है; फिर भी यह स्पष्ट नहीं है कि दोनों नाम यहोयाकीम के पुत्र बताए गए हैं या सिदकियाह को यकन्याह का पुत्र कहा गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: सम्बन्धवाचक बहुवचन בְנֵי वंशावली की सूची आरम्भ करता है; उपसर्ग ו को पिछली वंशावली से निरन्तरता दिखाने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय परम्परा में प्रचलित लिप्यन्तरण।
- source_word: יְכָנְיָה
  choice: यकन्याह
  rationale: यह रूप यहाँ के इब्रानी नाम יְכָנְיָה को निकटता से लिप्यन्तरित करता है और उसके वैकल्पिक रूपों को इसमें नहीं मिलाता।
- source_word: בְנ֖/וֹ
  choice: उसका पुत्र
  rationale: पुल्लिंग एकवचन प्रत्यय सहित בְּנוֹ का सीधा अर्थ ‘उसका पुत्र’ है; सर्वनाम की वास्तविक संदर्भगत अस्पष्टता बनाए रखी गई है।
- source_word: צִדְקִיָּה
  choice: सिदकियाह
  rationale: इब्रानी व्यक्तिगत नाम צִדְקִיָּה का हिन्दी में परिचित और स्रोत-संगत लिप्यन्तरण।
- source_word: בְנֽ/וֹ
  choice: उसका पुत्र
  rationale: इब्रानी में दोहराया गया वंशावली-सूचक पद स्पष्ट रूप से रखा गया है; इसे हटाकर सम्बन्ध का निर्णय नहीं किया गया।
theological_decisions:
- issue: संक्षिप्त वंशावली-वाक्य में पारिवारिक सम्बन्ध
  choice: मुख्य पाठ इब्रानी क्रम और दो बार आए ‘उसका पुत्र’ को बनाए रखता है।
  alternative: दोनों नामों को यहोयाकीम के पुत्र मानकर अनुवाद किया जा सकता है; अथवा सिदकियाह को यकन्याह का पुत्र समझा जा सकता है।
  rationale: इब्रानी कथन अत्यन्त संक्षिप्त है और सर्वनाम का पूर्वपद स्पष्ट नहीं करता। अन्य ऐतिहासिक विवरणों के आधार पर सामंजस्य बैठाने के बजाय अनुवाद मूल पाठ की अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। नामों के स्रोत-संगत हिन्दी लिप्यन्तरण और ‘उसका पुत्र’ की पुनरावृत्ति से मूल की संरचना तथा अस्पष्टता दोनों सुरक्षित हैं।
