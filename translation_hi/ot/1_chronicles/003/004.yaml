  text: Six were born to him in Hebron, and he reigned there seven years and six months; and in Jerusalem he reigned thirty-three years.
translation:
  language: hi
  text: हेब्रोन में उसके छह पुत्र जन्मे। वहाँ उसने सात वर्ष और छह महीने राज्य किया, और यरूशलेम में उसने तैंतीस वर्ष राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁשָּׁה
  choice: छः पुत्र
  rationale: यह संख्या पिछले पदों में गिनाए गए दाऊद के पुत्रों का सार प्रस्तुत करती है। हिंदी में केवल ‘छः’ से वाक्य अस्वाभाविक और अस्पष्ट होता, इसलिए संदर्भ से निहित ‘पुत्र’ स्पष्ट किया गया है।
- source_word: נוֹלַד לוֹ
  choice: उसके यहाँ जन्मे
  rationale: निफ़ाल रूप और לֹו की निष्क्रिय अभिव्यक्ति को बनाए रखते हुए यह स्वाभाविक आधुनिक हिंदी है; ‘उसने उत्पन्न किए’ मूल की अपेक्षा अधिक सक्रिय होता।
- source_word: בְחֶבְרוֹן
  choice: हेब्रोन में
  rationale: स्थानसूचक בְּ और नगर के नाम का सीधा अनुवाद।
- source_word: וַיִּמְלָךְ שָׁם
  choice: वहाँ उसने ... राज्य किया
  rationale: מָלַךְ यहाँ राजकीय शासन की अवधि बताता है; ‘राजा बना’ केवल राज्यारोहण का अर्थ दे सकता है।
- source_word: שֶׁבַע שָׁנִים וְשִׁשָּׁה חֳדָשִׁים
  choice: सात वर्ष और छः महीने
  rationale: अवधि का स्वाभाविक और सटीक हिंदी रूप।
- source_word: וּשְׁלֹשִׁים וְשָׁלוֹשׁ שָׁנָה
  choice: तैंतीस वर्ष
  rationale: इब्रानी के संयुक्त अंक को आधुनिक हिंदी की स्वाभाविक संख्या-रचना में व्यक्त किया गया है।
- source_word: מָלַךְ בִּירוּשָׁלִָם
  choice: यरूशलेम में उसने ... राज्य किया
  rationale: मूल में नए स्थान पर दिए गए बल को वाक्य के आरंभ में ‘यरूशलेम में’ रखकर बनाए रखा गया है।
