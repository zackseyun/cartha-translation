  choice: और हशूबा
  rationale: व्यक्तिवाचक नाम को अनुवादित करने के बजाय हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक ו को ‘और’ से व्यक्त किया गया है।
- source_word: וָ/אֹהֶל
  choice: ओहेल
  rationale: यहाँ यह सामान्य संज्ञा ‘तंबू’ नहीं, बल्कि व्यक्ति का नाम है; इसलिए इसे लिप्यंतरित किया गया है। सूची को स्वाभाविक हिंदी में रखने के लिए प्रत्येक नाम से पहले संयोजक नहीं दोहराया गया।
- source_word: וּ/בֶרֶכְיָה
  choice: बेरेक्याह
  rationale: हिब्रू नाम בֶּרֶכְיָה का उच्चारण-सन्निकट हिंदी लिप्यंतरण; अंतिम יה को ‘याह’ से दर्शाया गया है।
- source_word: וַֽ/חֲסַדְיָה
  choice: हसद्याह
  rationale: हिब्रू स्वर-विन्यास के निकट लिप्यंतरण किया गया है और अंतिम יה को ‘याह’ से दर्शाया गया है।
- source_word: י֥וּשַׁב חֶ֖סֶד
  choice: यूशब-हेसेद
  rationale: हिब्रू में दो पदों के रूप में लिखे होने पर भी यह एक संयुक्त व्यक्तिवाचक नाम है; योजक-चिह्न हिंदी पाठक को इसकी एक-नाम वाली संरचना पहचानने में सहायता देता है।
- source_word: חָמֵשׁ
  choice: पाँच
  rationale: यह संख्या ठीक पहले दिए गए नामों का संक्षिप्त सार है। हिब्रू की वंशावली-संबंधी संक्षिप्त, अध्याहृत शैली बनाए रखी गई है।
