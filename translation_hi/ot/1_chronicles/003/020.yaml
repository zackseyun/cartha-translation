  yaml_path: translation/ot/1_chronicles/003/020.yaml
  text: and Hashubah[a], Ohel, Berekiah, Hasadiah[b], and Jushab-hesed—five.
translation:
  language: hi
  text: और हशूबा, ओहेल, बेरेक्याह, हसद्याह और यूशब-हेसेद[a]—पाँच।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में अंतिम नाम दो अलग शब्दों, “यूशब हेसेद,” के रूप में लिखा है, पर इन्हें एक संयुक्त व्यक्तिवाचक नाम समझना उचित है; इसलिए यहाँ “यूशब-हेसेद” लिखा गया है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में केवल “पाँच” है, जो अभी दिए गए पाँच नामों का सार बताता है। सहज हिंदी में “कुल पाँच थे” कहा जा सकता है, पर मूल पाठ की शैली संक्षिप्त है।
    reason: lexical_alternative
lexical_decisions:
