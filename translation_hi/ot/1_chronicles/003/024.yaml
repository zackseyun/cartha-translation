base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/024.yaml
  text: 'And the sons of Elyoenai: Hodaviah[a], Eliashib, Pelaiah, Akkub, Johanan, Delaiah, and Anani—seven.'
translation:
  language: hi
  text: 'और एल्योएनै के पुत्र ये थे: होदव्याह[a], एल्याशीब, पलायाह, अक्कूब, योहानान, दलायाह और अनानी—कुल सात।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहले नाम की इब्रानी वर्तनी असामान्य है। यहाँ उसकी सबसे संभावित पारंपरिक पहचान के अनुसार “होदव्याह” लिखा गया है; “होदियाह” या अधिक अक्षरानुरूप “होदेवाहू” भी संभव हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: वंशावली की पिछली कड़ी से संयोजन बनाए रखने के लिए וּ को ‘और’ तथा בְנֵי को मानक वंशावली पद ‘पुत्र’ से व्यक्त किया गया है; ‘ये थे’ हिंदी में सूची का स्वाभाविक परिचय देता है।
- source_word: אֶלְיוֹעֵינַי
  choice: एल्योएनै
  rationale: इब्रानी स्वरांकन के निकट देवनागरी लिप्यंतरण।
- source_word: הדיוהו
  choice: होदव्याह
  rationale: वर्तनी असामान्य है; मुख्य पाठ में इस नाम की सर्वाधिक संभावित पारंपरिक पहचान अपनाई गई है और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וְאֶלְיָשִׁיב
  choice: एल्याशीब
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וּפְלָיָה
  choice: पलायाह
  rationale: इब्रानी नाम और उसके -याह अंत को दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: וְעַקּוּב
  choice: अक्कूब
  rationale: दुगुने क़ोफ़ के व्यंजन-बल को ‘क्क’ से दर्शाया गया है।
- source_word: וְיוֹחָנָן
  choice: योहानान
  rationale: दिए गए संक्षिप्त इब्रानी नाम का लिप्यंतरण; इसे लंबे ईश्वर-सूचक रूप में विस्तृत नहीं किया गया।
- source_word: וּדְלָיָה
  choice: दलायाह
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וַעֲנָנִי
  choice: और अनानी
  rationale: अंतिम नाम के साथ संयोजक को हिंदी सूची की स्वाभाविक रीति से रखा गया है।
- source_word: שִׁבְעָה
  choice: कुल सात
  rationale: मूल पाठ की स्पष्ट वंशावली-गणना को बनाए रखते हुए ‘कुल’ से हिंदी में उसके सारात्मक कार्य को स्पष्ट किया गया है।
