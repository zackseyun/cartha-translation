- source_word: יֹאשִׁיָּ֥הוּ
  choice: योशिय्याह
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी बाइबल परंपरा में प्रचलित और पहचाने जाने योग्य लिप्यंतरण अपनाया गया है।
- source_word: בְנֽוֹ
  choice: उसका पुत्र
  rationale: दोहराए गए वंशावली-सूत्र को समान रूप से प्रस्तुत किया गया है, जिससे उत्तराधिकार का क्रम स्पष्ट रहता है।
