id: 1CH.3.12
reference: 1 Chronicles 3:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲמַצְיָ֧הוּ בְנ֛/וֹ עֲזַרְיָ֥ה בְנ֖/וֹ יוֹתָ֥ם בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/012.yaml
  text: Amaziah his son[a], Azariah his son, Jotham his son.
translation:
  language: hi
  text: अमस्याह उसका पुत्र, अजर्याह उसका पुत्र[a], और योताम उसका पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अजर्याह”; यह राजा अन्य स्थानों पर “उज्जियाह” नाम से भी जाना जाता है।
    reason: इसी राजा के वैकल्पिक नाम की जानकारी देते हुए इस पद के इब्रानी नाम-रूप को स्पष्ट करना।
lexical_decisions:
- source_word: אֲמַצְיָהוּ
  choice: अमस्याह
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: בֵּן पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसका पुत्र’ है। वंशावलियाँ कभी-कभी पीढ़ियाँ छोड़ सकती हैं, फिर भी यहाँ मूल पाठ की एकवचन पुत्र-संबंधी भाषा को बनाए रखा गया है।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: मूल पाठ में नाम עֲזַרְיָה है, इसलिए उसे सीधे लिप्यंतरित किया गया है; ‘उज्जियाह’ को मुख्य पाठ में रखने से अन्य स्थलों के नाम के आधार पर अनावश्यक सामंजस्य बैठता।
- source_word: יוֹתָם
  choice: योताम
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: राजवंशावली में पुत्र-संबंधी भाषा
  choice: तीनों स्थानों पर ‘उसका पुत्र’ रखा गया है।
  alternative: ‘उसका वंशज’
  rationale: इब्रानी पाठ हर बार בְנוֹ (‘उसका पुत्र’) कहता है। वंशावलियों में कभी पीढ़ियाँ संक्षिप्त हो सकती हैं, पर यहाँ अधिक सामान्य ‘वंशज’ कहने की कोई पाठगत आवश्यकता नहीं है।
- issue: अजर्याह और उज्जियाह नामों का संबंध
  choice: मुख्य पाठ में ‘अजर्याह’ और टिप्पणी में ‘उज्जियाह’ रखा गया है।
  alternative: मुख्य पाठ में ‘उज्जियाह’
  rationale: यह पद स्पष्टतः עֲזַרְיָה पढ़ता है। दूसरे स्थलों पर इसी राजा के लिए प्रयुक्त नाम को मुख्य पाठ में लाना मूल रूप को बदल देता।
translation_notes:
  register: संक्षिप्त वंशावली की लय बनाए रखते हुए आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। अंतिम सदस्य से पहले ‘और’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है। टिप्पणी-चिह्न ‘अजर्याह’ के साथ रखा गया है, क्योंकि टिप्पणी उसी नाम से संबंधित है।
