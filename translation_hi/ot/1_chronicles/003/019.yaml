source:
  edition: WLC
  text: וּ/בְנֵ֣י פְדָיָ֔ה זְרֻבָּבֶ֖ל וְ/שִׁמְעִ֑י וּ/בֶן זְרֻבָּבֶל֙ מְשֻׁלָּ֣ם וַ/חֲנַנְיָ֔ה וּ/שְׁלֹמִ֖ית אֲחוֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/019.yaml
  text: 'The sons of Pedaiah: Zerubbabel and Shimei[a]. And the sons of Zerubbabel: Meshullam and Hananiah; and Shelomith was their sister.'
translation:
  language: hi
  text: 'पदायाह के पुत्र: जरुब्बाबेल और शिमी। और जरुब्बाबेल के पुत्र[a]: मशुल्लाम और हनन्याह; और शलोमीत उनकी बहन थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ एकवचन, “जरुब्बाबेल का पुत्र,” है। आगे मशुल्लाम और हनन्याह—दो नाम—आने के कारण बहुत-से लोग इसे पाठगत अनियमितता या सामूहिक अर्थ में प्रयुक्त वंशावली-भाषा समझते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי פְדָיָה
  choice: पदायाह के पुत्र
  rationale: वंशावली के इस प्रसंग में בְּנֵי का स्वाभाविक अर्थ वास्तविक ‘पुत्र’ है। आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: זְרֻבָּבֶל וְשִׁמְעִי
  choice: जरुब्बाबेल और शिमी
  rationale: व्यक्तिनामों का आधुनिक हिन्दी में सहज देवनागरी लिप्यंतरण किया गया है और संयोजक को बनाए रखा गया है।
- source_word: וּבֶן זְרֻבָּבֶל
  choice: और जरुब्बाबेल के पुत्र[a]
  rationale: इब्रानी पाठ में ‘पुत्र’ एकवचन है, पर आगे दो पुरुषों के नाम और उनकी बहन का उल्लेख है। मुख्य पाठ में प्रसंगानुकूल बहुवचन रखा गया है, जबकि मूल का एकवचन पाद-टिप्पणी में सुरक्षित है।
- source_word: מְשֻׁלָּם וַחֲנַנְיָה
  choice: मशुल्लाम और हनन्याह
  rationale: दोनों व्यक्तिनामों का स्रोत-रूप के निकट, हिन्दी-पाठक के लिए उच्चारणयोग्य लिप्यंतरण किया गया है।
- source_word: וּשְׁלֹמִית אֲחוֹתָם
  choice: और शलोमीत उनकी बहन थी
  rationale: बहुवचन प्रत्यय का अर्थ ‘उनकी’ है, जिसका निकटतम संकेत मशुल्लाम और हनन्याह की ओर है। क्रियारहित इब्रानी उपवाक्य को स्वाभाविक हिन्दी के लिए ‘थी’ के साथ व्यक्त किया गया है।
theological_decisions:
- issue: וּבֶן का एकवचन और आगे दिए गए अनेक नाम
  choice: मुख्य पाठ में ‘पुत्र’ का बहुवचनार्थक हिन्दी रूप
  alternative: ‘और जरुब्बाबेल का पुत्र’
  rationale: यह मुख्यतः पाठगत/वंशावली-संबंधी कठिनाई है, न कि किसी धर्मसैद्धांतिक मत का आधार। प्रसंग का स्पष्ट आशय मुख्य पाठ में रखा गया है और वास्तविक इब्रानी एकवचन को पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वंशावली की संक्षिप्त सूची-शैली बनाए रखते हुए हिन्दी में आवश्यक क्रिया जोड़ी गई है। व्यक्तिनाम स्रोत-रूप के निकट देवनागरी में लिप्यंतरित हैं।
