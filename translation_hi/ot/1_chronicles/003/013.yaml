lexical_decisions:
- source_word: אָחָז
  choice: आहाज
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: בֵּן पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसका पुत्र’ है। वंशावलियों में इसका अर्थ कभी व्यापक रूप से ‘वंशज’ हो सकता है, पर यहाँ मानक सूत्र को यथावत रखा गया है।
- source_word: חִזְקִיָּהוּ
  choice: हिजकिय्याह
  rationale: नाम के इब्रानी रूप को दर्शाने वाला और हिन्दी पाठकों में पहचाना जाने वाला प्रचलित रूप चुना गया है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
