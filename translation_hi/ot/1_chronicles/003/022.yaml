base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/022.yaml
  text: 'And the sons of Shecaniah: Shemaiah. And the sons of Shemaiah: Hattush[a], Igal, Bariah, Neariah, and Shaphat—six.'
translation:
  language: hi
  text: 'और शकन्याह के पुत्र: शमायाह। और शमायाह के पुत्र: हत्तूश, यिगाल, बारियह, नेआर्याह और शापात—छह[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ “छह” लिखा है, यद्यपि वर्तमान मसोरेटी पाठ में केवल पाँच नाम दिए गए हैं। यह किसी पाठगत समस्या या पाठ-संचरण में किसी नाम के छूट जाने को सूचित कर सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי שְׁכַנְיָה
  choice: और शकन्याह के पुत्रों में
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है। यहाँ वंशावली की संरचना में अगले नाम को प्रस्तुत करने के लिए स्वाभाविक हिन्दी ‘पुत्रों में’ रखी गई है, बिना इसे व्यापक ‘वंशज’ बनाने के।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; नाम का अनुवाद नहीं किया गया।
- source_word: וּבְנֵי שְׁמַעְיָה
  choice: और शमायाह के पुत्र
  rationale: इब्रानी वंशावली-सूत्र को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חַטּוּשׁ
  choice: हत्तूश
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण, जिसमें मध्य व्यंजन का द्वित्व सुरक्षित है।
- source_word: יִגְאָל
  choice: यिगाल
  rationale: आरम्भिक इब्रानी योध को ‘य’ से दर्शाते हुए नाम का स्रोत-सन्निकट लिप्यंतरण किया गया है।
- source_word: בָרִיחַ
  choice: बारीअह
  rationale: मसोरेटी पाठ בָרִיחַ का लिप्यंतरण किया गया है; अधिक परिचित किन्तु भिन्न नाम ‘बेरियाह’ को पाठ में नहीं थोपा गया। अन्तिम ח को हिन्दी पाठक के लिए ‘अह’ से संकेतित किया गया है।
- source_word: נְעַרְיָה
  choice: नार्याह
  rationale: नाम के इब्रानी उच्चारण को सुगम आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: שָׁפָט
  choice: शापात
  rationale: इब्रानी व्यक्तिगत नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: שִׁשָּׁה
  choice: कुल छः
  rationale: स्रोत-पाठ की संख्या ‘छः’ को यथावत रखा गया है, यद्यपि वर्तमान मसोरेटी पाठ में केवल पाँच नाम दिखाई देते हैं; ‘कुल’ हिन्दी में सूची के समापन को स्पष्ट करता है।
