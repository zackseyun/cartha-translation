lexical_decisions:
- source_word: יוֹרָם
  choice: योराम
  rationale: हिब्रू नाम का प्रचलित और निकट देवनागरी लिप्यंतरण; इसका विस्तृत रूप ‘यहोयोराम’ नहीं, बल्कि प्रचलित वैकल्पिक रूप ‘यहोऱाम/योराम’ परंपराओं में मिलता है, इसलिए मुख्य पाठ में संक्षिप्त हिब्रू रूप रखा गया है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: בֵּן पर तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा अर्थ ‘उसका पुत्र’ है। वंशावलियों में यह कभी दूर के वंशज को भी सूचित कर सकता है, पर यहाँ संक्षिप्त राजकीय उत्तराधिकार-सूची में प्रत्यक्ष अर्थ उपयुक्त है।
- source_word: אֲחַזְיָהוּ
  choice: अहज्याह
  rationale: हिब्रू नाम का अर्थ-संगत और हिन्दी बाइबलीय प्रयोग के अनुकूल लिप्यंतरण।
- source_word: יוֹאָשׁ
  choice: योआश
  rationale: हिब्रू नाम का निकट देवनागरी लिप्यंतरण; ‘यहोआश’ इसी नाम का विस्तृत वैकल्पिक रूप है।
