- source_word: נֹגַהּ
  choice: नोगाह
  rationale: वंशावली में यह व्यक्ति का नाम है, इसलिए अर्थानुवाद के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है। अंतिम הּ को दर्शाने के लिए ‘ह’ रखा गया है; हिन्दी में ‘नोगा’ भी संभव रूप है।
- source_word: נֶפֶג
  choice: नेपेग
  rationale: यह व्यक्ति का नाम है; हिब्रू व्यंजन और स्वर-चिह्नों के आधार पर इसे देवनागरी में ‘नेपेग’ लिप्यंतरित किया गया है।
- source_word: יָפִיעַ
  choice: यापीआ
  rationale: यह व्यक्ति का नाम है; आरंभिक י को ‘य’ और अंतिम ע को अलग स्वर-संधि के संकेत सहित दर्शाते हुए हिब्रू उच्चारण के निकट ‘यापीआ’ रखा गया है।
- source_word: וְ
  choice: और
  rationale: नामों की सरल सूची में उपसर्गीय समुच्चयबोधक को स्वाभाविक हिन्दी शैली के अनुसार अंतिम नाम से पहले ‘और’ के रूप में रखा गया है।
