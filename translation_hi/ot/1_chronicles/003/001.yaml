  text: וְ/אֵ֤לֶּה הָיוּ֙ בְּנֵ֣י דָויִ֔ד אֲשֶׁ֥ר נֽוֹלַד ל֖/וֹ בְּ/חֶבְר֑וֹן הַ/בְּכ֣וֹר אַמְנֹ֗ן לַ/אֲחִינֹ֨עַם֙ הַ/יִּזְרְעֵאלִ֔ית שֵׁנִי֙ דָּנִיֵּ֔אל לַ/אֲבִיגַ֖יִל הַֽ/כַּרְמְלִֽית־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/001.yaml
  text: 'These were David’s sons who were born to him in Hebron: the firstborn[a], Amnon, by Ahinoam the Jezreelite; the second, Daniel, by Abigail the Carmelite.'
translation:
  language: hi
  text: 'दाऊद के ये पुत्र थे, जो हेब्रोन में उसके यहाँ जन्मे थे: पहलौठा अम्नोन, यिज्रेल की निवासी अहीनोअम से; दूसरा दानिय्येल[a], कर्मेल की निवासी अबीगैल से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 शमूएल 3:3 की समानांतर सूची में इस पुत्र का नाम दानिय्येल के बजाय किलआब है।
    reason: समानांतर पाठ में इसी पुत्र के नाम का भिन्न रूप पाठक के लिए उल्लेखनीय है; मुख्य पाठ में इतिहासकार का ‘दानिय्येल’ रखा गया है।
lexical_decisions:
- source_word: וְאֵלֶּה הָיוּ
  choice: ये ... थे
  rationale: यह पद वंशावली के एक नए खंड का परिचय देता है। हिंदी में ‘ये ... थे’ संकेतवाचक बल और भूतकाल दोनों को स्वाभाविक रूप से बनाए रखता है; आरंभिक וְ को अलग से ‘और’ कहना आवश्यक नहीं है।
- source_word: בְּנֵי דָוִיד
  choice: दाऊद के ... पुत्र
  rationale: रचना संबंधसूचक है और वंशावली में पुरुष संतानों को निर्दिष्ट करती है; ‘पुत्र’ इस विशिष्टता को बनाए रखता है।
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: जो ... उसके यहाँ जन्मे थे
  rationale: मूल के निष्क्रिय ‘जन्मे’ और दाऊद से संबंध सूचित करने वाले לוֹ दोनों को बनाए रखते हुए यह आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: नगर के साथ स्थानवाचक בְ का सीधा और स्वाभाविक हिंदी रूप।
- source_word: הַבְּכוֹר
  choice: पहलौठा
  rationale: यह केवल आयुक्रम नहीं, बल्कि ज्येष्ठ जन्म की वंशावली-संबंधी स्थिति भी व्यक्त करता है।
- source_word: לַאֲחִינֹעַם הַיִּזְרְעֵאלִית
  choice: यिज्रेली अहीनोअम से
  rationale: माता के नाम से पहले לְ यहाँ मातृत्व बताता है। ‘से’ संक्षिप्त और स्वाभाविक है; स्त्रीलिंग निवासी-सूचक विशेषण को ‘यिज्रेली’ से व्यक्त किया गया है।
- source_word: שֵׁנִי דָּנִיֵּאל
  choice: दूसरा दानिय्येल
  rationale: क्रमसूचक संख्या और इतिहासकार के पाठ में दिए गए नाम दोनों को सीधे सुरक्षित रखा गया है।
- source_word: לַאֲבִיגַיִל הַכַּרְמְלִית
  choice: कर्मेली अबीगैल से
  rationale: माता और उसके स्थान-संबंध को पहली मातृसूचना के समानांतर, संक्षिप्त हिंदी में व्यक्त करता है।
