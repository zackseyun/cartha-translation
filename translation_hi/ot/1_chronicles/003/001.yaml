translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली के लिए उपयुक्त रूप से संक्षिप्त रखी गई है। नामों के रूप प्रचलित हिंदी बाइबलीय लिप्यंतरण के अनुरूप हैं। पाद-टिप्पणी का चिह्न ‘दानिय्येल’ पर रखा गया है, क्योंकि भिन्न नाम उसी पुत्र से संबंधित है।
