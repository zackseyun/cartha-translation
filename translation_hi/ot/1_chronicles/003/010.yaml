- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: यहाँ इतिहासकार ने अֲבִיָּה रूप प्रयुक्त किया है; इसलिए इसी नाम-रूप को दर्शाया गया है, न कि राजाओं की पुस्तक में मिलने वाले वैकल्पिक रूप अबिय्याम को।
- source_word: בְנ/וֹ
  choice: उसका पुत्र
  rationale: संज्ञा पर तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय पुत्र-संबंध और राजवंशीय उत्तराधिकार व्यक्त करता है; पुनरावृत्ति मूल वंशावली की लय बनाए रखती है।
- source_word: אָסָא
  choice: आसा
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: יְהוֹשָׁפָט
  choice: यहोशापात
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
