base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/015.yaml
  text: 'And the sons of Josiah: the firstborn[a], Johanan; the second, Jehoiakim; the third, Zedekiah; the fourth, Shallum.'
translation:
  language: hi
  text: 'और योशियाह के पुत्र ये थे: पहलौठा[a] योहानान, दूसरा यहोयाकीम, तीसरा सिदकिय्याह और चौथा शल्लूम।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शल्लूम की पहचान सामान्यतः 2 राजा 23:30–34 और यिर्मयाह 22:11 के यहोआहाज से की जाती है; यहाँ इतिहासकार योशियाह की वंशावली में “शल्लूम” नाम को सुरक्षित रखता है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: संयोजक ו को “और” से रखकर वंशावली का प्रवाह बनाए रखा गया है; בְנֵי का अर्थ यहाँ तत्काल पुत्रों की सूची होने के कारण “पुत्र” है। हिंदी में सूची का स्वाभाविक परिचय देने के लिए “ये थे” जोड़ा गया है।
- source_word: יֹאשִׁיָּהוּ
  choice: योशियाह
  rationale: हिंदी बाइबल परंपरा में प्रचलित नाम-रूप।
- source_word: הַבְּכוֹר
  choice: पहलौठा
  rationale: यह जन्मक्रम और ज्येष्ठ पुत्र की स्थिति, दोनों को सीधे व्यक्त करता है।
- source_word: יוֹחָנָן
  choice: योहानान
  rationale: इब्रानी नाम का स्पष्ट और हिंदी में प्रचलित लिप्यंतरण।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: सूची के क्रमसूचक विशेषण का सीधा अनुवाद।
- source_word: יְהוֹיָקִים
  choice: यहोयाकीम
  rationale: पाठ में उपस्थित नाम का हिंदी बाइबल परंपरा में प्रचलित रूप; इसे एल्याकीम से नहीं बदला गया।
- source_word: הַשְּׁלִשִׁי
  choice: तीसरा
  rationale: क्रमसूचक विशेषण का सीधा और संगत अनुवाद।
- source_word: צִדְקִיָּהוּ
  choice: सिदकिय्याह
  rationale: राजकीय नाम का हिंदी बाइबल परंपरा में परिचित रूप।
- source_word: הָרְבִיעִי
  choice: चौथा
  rationale: क्रमसूचक विशेषण का सीधा और संगत अनुवाद।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: इब्रानी पाठ में दिए गए व्यक्तिगत नाम का लिप्यंतरण।
theological_decisions:
- issue: वंशावली के जन्मक्रम और राजकीय उत्तराधिकार के क्रम के बीच तनाव
  choice: नामों को पाठ में दिए गए क्रमसूचक पदों के साथ ज्यों का त्यों प्रस्तुत करना
  alternative: राजाओं के शासन-क्रम के अनुसार नामों को पुनः व्यवस्थित करना या मुख्य पाठ में सामंजस्य बैठाना
  rationale: इब्रानी पद योशियाह के पुत्रों को क्रमसूचक पदों के साथ वंशावली के रूप में प्रस्तुत करता है। अनुवाद को इसी प्रस्तुति को सुरक्षित रखना चाहिए; अन्य ऐतिहासिक विवरणों के साथ संबंध पादटिप्पणी में बताया जा सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। नामों के लिए हिंदी बाइबल पाठकों में परिचित रूप रखे गए हैं और मूल पाठ का जन्मक्रम बिना ऐतिहासिक सामंजस्य के सुरक्षित रखा गया है।
