lexical_decisions:
- source_word: אֱלִישָׁמָע
  choice: एलीशामा
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: אֶלְיָדָע
  choice: एल्यादा
  rationale: व्यक्तिवाचक नाम को हिब्रू रूप के निकट और स्वाभाविक हिन्दी वर्तनी में लिप्यंतरित किया गया है।
- source_word: אֱלִיפֶלֶט
  choice: एलीपेलेत
  rationale: इस पद के पूर्ण हिब्रू रूप का लिप्यंतरण किया गया है; संबंधित संक्षिप्त वर्तनी को यहाँ नहीं अपनाया गया।
- source_word: וְ / וֶ
  choice: और
  rationale: हर नाम से पहले आए संयोजक को हिन्दी सूची-शैली में सहज रूप से व्यक्त किया गया है; पद के आरम्भ और अंतिम नाम से पहले ‘और’ रखा गया है।
- source_word: תִּשְׁעָה
  choice: कुल नौ
  rationale: मूल अर्थ ‘नौ’ है; प्रसंग में यह पद 5–8 में दिए पुत्रों की समापन-गणना है, इसलिए हिन्दी में सारसूचक ‘कुल’ जोड़ा गया है।
