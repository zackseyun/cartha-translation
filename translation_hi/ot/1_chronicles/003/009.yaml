  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। विराम-चिह्नों से बीच के अपवादसूचक पदबंध को स्पष्ट किया गया है, जबकि मूल की अर्थगत सम्भावना पाद-टिप्पणी में बनी रहती है।
