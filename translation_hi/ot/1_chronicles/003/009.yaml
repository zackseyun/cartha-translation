  yaml_path: translation/ot/1_chronicles/003/009.yaml
  text: All these were David’s sons[a], besides the sons of the concubines; and Tamar was their sister.
translation:
  language: hi
  text: ये सब दाऊद के पुत्र थे—रखैलों के पुत्रों को छोड़कर[a]—और तामार उनकी बहन थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रखैलों के पुत्रों के अतिरिक्त।” इब्रानी पदबंध का अर्थ यह हो सकता है कि उन पुत्रों को ऊपर दी गई गिनती से बाहर रखा गया है, या यह कि वे मुख्य सूची के अतिरिक्त थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל בְּנֵי דָוִיד
  choice: ये सब दाऊद के पुत्र थे
  rationale: כֹּל पिछले पदों में गिनाए गए पुत्रों का समाहार करता है; हिन्दी में “ये सब” इस सारांशकारी कार्य को स्वाभाविक रूप से व्यक्त करता है। בְּנֵי पुल्लिंग बहुवचन है, इसलिए “पुत्र” रखा गया है।
- source_word: מִלְּבַד
  choice: को छोड़कर
  rationale: यह पदबंध मुख्यतः अपवाद या अलग रखे जाने का भाव दे सकता है। “को छोड़कर” आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है; जोड़ के रूप में समझे जाने की सम्भावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּנֵי פִילַגְשִׁים
  choice: रखैलों के पुत्रों
  rationale: “पुत्रों” स्रोत के पुल्लिंग बहुवचन को सुरक्षित रखता है। “रखैल” राजकीय गृहस्थी में פִילֶגֶשׁ द्वारा सूचित गौण वैवाहिक-सामाजिक श्रेणी के लिए सामान्य, समझने योग्य हिन्दी शब्द है।
- source_word: וְתָמָר אֲחוֹתָם
  choice: और तामार उनकी बहन थी
  rationale: इब्रानी वाक्यांश क्रियारहित है; स्वाभाविक हिन्दी के लिए “थी” जोड़ा गया है। “उनकी” तामार का संबंध संदर्भ में उल्लिखित दाऊद के पुत्रों से जोड़ता है।
