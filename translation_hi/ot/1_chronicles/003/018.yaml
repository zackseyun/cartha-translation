- source_word: נְדַבְיָה
  choice: नदब्याह
  rationale: इब्रानी व्यक्तिनाम का स्रोत-आधारित लिप्यंतरण; अंतिम יָה को ‘याह’ के निकट रखा गया है।
- source_word: וּ / וְ
  choice: और
  rationale: इब्रानी सूची में प्रत्येक नाम को जोड़ने वाले संयोजक को स्वाभाविक हिन्दी शैली में अल्पविरामों और अंतिम नाम से पहले ‘और’ द्वारा व्यक्त किया गया है।
