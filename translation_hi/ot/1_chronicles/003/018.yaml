  rationale: आरंभिक י को ‘य’ और अंतिम יָה को ‘याह’ के निकट रखा गया है; बीच के संयुक्त उच्चारण को सहज देवनागरी रूप दिया गया है।
- source_word: הוֹשָׁמָע
