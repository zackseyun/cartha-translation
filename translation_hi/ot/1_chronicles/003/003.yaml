lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: पाँचवाँ
  rationale: निश्चित पदक्रमवाचक विशेषण है और दाऊद के पुत्रों की क्रमांकित सूची को आगे बढ़ाता है।
- source_word: שְׁפַטְיָה
  choice: शपत्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; इसके अर्थ का अनुवाद नहीं किया गया।
- source_word: לַאֲבִיטָל
  choice: जिसकी माता अबीतल थी
  rationale: इस वंशावली-सूत्र में ל मातृत्व अथवा जन्म-संबंध बताता है; आधुनिक हिन्दी में यह अभिव्यक्ति स्पष्ट और स्वाभाविक है।
- source_word: הַשִּׁשִּׁי
  choice: छठा
  rationale: निश्चित पदक्रमवाचक विशेषण है, जो समानांतर सूची-संरचना बनाए रखता है।
- source_word: יִתְרְעָם
  choice: यित्राम
  rationale: इब्रानी व्यक्तिगत नाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: לְעֶגְלָה
  choice: जिसकी माता ... एग्लाह थी
  rationale: वंशावली के प्रसंग में ל मातृत्व का संबंध व्यक्त करता है।
- source_word: אִשְׁתּוֹ
  choice: दाऊद की पत्नी
  rationale: אִשָּׁה के तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का वैवाहिक अर्थ है। प्रसंग में 'उसकी' का संकेत दाऊद की ओर है; नाम स्पष्ट करने से हिन्दी में संदर्भ-अस्पष्टता दूर होती है।
theological_decisions:
- issue: '''उसकी पत्नी'' का संदर्भ और एग्लाह की पहचान'
  choice: एग्लाह को दाऊद की पत्नी कहा गया है, पर उसके विशेष दर्जे या किसी दूसरी स्त्री से उसकी समानता का दावा नहीं किया गया।
  alternative: एग्लाह को मीकल मानना अथवा 'पत्नी' शब्द से उसके विशेष दर्जे का निष्कर्ष निकालना।
  rationale: इब्रानी पाठ केवल עֶגְלָה אִשְׁתּוֹ, अर्थात एग्लाह को उसकी पत्नी, कहता है। वह न तो इस उल्लेख का कारण बताता है, न एग्लाह को मीकल के साथ अभिन्न ठहराता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी ל को शाब्दिक 'को/के लिए' कहने के बजाय वंशावली-संदर्भ के अनुसार 'जिसकी माता ... थी' से व्यक्त किया गया है। नामों का देवनागरी लिप्यंतरण स्रोत के निकट रखा गया है।
