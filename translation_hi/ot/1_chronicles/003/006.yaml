lexical_decisions:
- source_word: יִבְחָר
  choice: यिभार
  rationale: वंशावली में आया व्यक्तिवाचक नाम; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है। आरंभिक י को ‘यि’ और ח को हिंदी पाठकों के लिए सुगम रूप में ‘ह’ से दर्शाया गया है।
- source_word: אֱלִישָׁמָע
  choice: एलीशामा
  rationale: व्यक्तिवाचक नाम को उसके हिब्रू स्वरूप के निकट देवनागरी में लिप्यंतरित किया गया है; अंतिम ע का अलग कठोर संकेत न देकर स्वाभाविक हिंदी रूप रखा गया है।
- source_word: אֱלִיפָלֶט
  choice: एलीपेलेत
  rationale: व्यक्तिवाचक नाम का हिब्रू-आधारित देवनागरी लिप्यंतरण; פ को यहाँ ‘प’ और अंतिम ת को ‘त’ से व्यक्त किया गया है।
- source_word: וְ / וֶ
  choice: और
  rationale: उपसर्गीय संयोजक सूची में नामों को जोड़ता है। पद की आरंभिक स्थिति और पूर्ववर्ती वंशावली से उसके संबंध को बनाए रखने के लिए पहला ‘और’ भी रखा गया है, जबकि हिंदी में अनावश्यक पुनरावृत्ति से बचने हेतु बीच के हर उपसर्ग को अलग से नहीं दोहराया गया।
