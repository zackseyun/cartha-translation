base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/005.yaml
  text: 'These were born to him in Jerusalem: Shimea[a], Shobab, Nathan[b], and Solomon—four by Bath-shua daughter of Ammiel.'
translation:
  language: hi
  text: 'और ये उसके यरूशलेम में जन्मे: शिमआ[a], शोबाब, नातान और सुलैमान—अम्मीएल की बेटी बतशूआ[b] से ये चारों हुए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 शमूएल 5:14 के समानांतर विवरण में यह नाम शमूअ है।
    reason: textual_variant
  - marker: b
    text: 2 शमूएल 11:3 में वह एलीआम की बेटी बतशेबा कहलाती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये
  rationale: वंशावली के अगले समूह को पिछले संदर्भ से जोड़ते हुए संकेतवाचक बल को बनाए रखता है।
- source_word: נוּלְּדוּ לוֹ
  choice: उससे उत्पन्न हुए
  rationale: निफ़अल के निष्क्रिय भाव और दाऊद की ओर संकेत करने वाले सर्वनाम—दोनों को बिना मुख्य पाठ में नाम जोड़कर स्पष्ट किए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּירוּשָׁלָיִם
  choice: यरूशलेम में
  rationale: जन्मस्थान बताने वाला सीधा स्थानवाचक पदबंध।
- source_word: שִׁמְעָא
  choice: शिमआ
  rationale: इतिहास की पुस्तक के मसोराई पाठ में उपस्थित नामरूप को दर्शाता है; शमूअ नामक समानांतर पाठ से इसका मौन सामंजस्य नहीं किया गया।
- source_word: שׁוֹבָב
  choice: शोबाब
  rationale: इब्रानी नाम का स्पष्ट देवनागरी लिप्यंतरण।
- source_word: נָתָן
  choice: नातान
  rationale: इब्रानी नाम का प्रचलित और स्पष्ट हिन्दी रूप।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इस प्रसिद्ध राजा के लिए हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला नाम।
- source_word: אַרְבָּעָה
  choice: ये चारों
  rationale: अभी बताए गए चार पुत्रों का सार प्रस्तुत करता है और हिन्दी वाक्य में संदर्भ को स्पष्ट रखता है।
- source_word: לְבַת שׁוּעַ
  choice: बतशूआ से हुए
  rationale: वंशावली के प्रसंग में मातृत्व अथवा जन्म-स्रोत को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּת עַמִּיאֵל
  choice: अम्मीएल की बेटी
  rationale: पिता के आधार पर परिचय देने वाली इब्रानी संरचना का सीधा हिन्दी रूप।
theological_decisions:
- issue: इतिहास और शमूएल में दाऊद की पत्नी के नाम तथा उसके पिता के नाम का भिन्न रूप
  choice: अम्मीएल की बेटी बतशूआ
  alternative: एलीआम की बेटी बतशेबा
  rationale: मुख्य पाठ WLC में दिए गए ‘बतशूआ, अम्मीएल की बेटी’ को ही रखता है और शमूएल के समानांतर रूप से सामंजस्य नहीं करता; परिचित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उससे उत्पन्न हुए’ मूल की निष्क्रिय रचना और संदर्भगत सर्वनाम को बचाता है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न विषय से असंगत स्थानों पर थे; हिन्दी मसौदे में पाठ-भेद की टिप्पणी ‘शिमआ’ पर और पत्नी के वैकल्पिक नाम की टिप्पणी ‘बतशूआ’ पर लगाई गई है।
