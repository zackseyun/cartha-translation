  text: 'The sons of Neariah: Elioenai[a], Hezekiah, and Azrikam—three.'
translation:
  language: hi
  text: 'नार्याह के पुत्र[a]: एल्योएनै, हिजकिय्याह और अज्रीकाम—कुल तीन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘नार्याह का पुत्र’ है, पर यहाँ आगे तीन नाम दिए गए हैं और अंत में उनकी संख्या ‘तीन’ बताई गई है; इसलिए इसे बहुवचन में अनूदित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: के पुत्र
  rationale: रूप व्याकरणतः एकवचन ‘और पुत्र’ है, पर इसके बाद तीन नाम और अंत में ‘तीन’ आने के कारण वंशावली में यह अनेक संतानों की सूची का शीर्षक है। इसलिए स्वाभाविक हिन्दी में बहुवचन किया गया है; मूल रूप की सूचना पाद-टिप्पणी में रखी गई है।
- source_word: נְעַרְיָה
  choice: नार्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: אֶלְיוֹעֵינַי
  choice: एल्योएनै
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जिसमें नाम के मूल स्वर-क्रम को यथासंभव सुरक्षित रखा गया है।
- source_word: וְחִזְקִיָּה
  choice: हिजकियाह
  rationale: संयोजक सहित इब्रानी व्यक्तिगत नाम का प्रचलित बाइबलीय हिन्दी रूप।
- source_word: וְעַזְרִיקָם
  choice: और अज्रीकाम
  rationale: इब्रानी संयोजक וְ को ‘और’ तथा व्यक्तिगत नाम को देवनागरी में लिप्यंतरित किया गया है।
- source_word: שְׁלֹשָׁה
  choice: कुल तीन
  rationale: सूची में दिए पुत्रों की स्पष्ट कुल संख्या है; ‘कुल’ हिन्दी में वंशावली के इस सारांश को स्वाभाविक बनाता है।
