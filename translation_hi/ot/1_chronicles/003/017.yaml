  text: 'और यकोन्याह के पुत्र: अस्सीर[a], शालतीएल उसका पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “और बंदी यकोन्याह के पुत्र: उसका पुत्र शालतीएल।” इब्रानी शब्द אַסִּר को व्यक्तिगत नाम “अस्सीर” या सामान्य संज्ञा “बंदी/कैदी”—दोनों रूपों में पढ़ा जा सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: संयोजक ו को वंशावली के क्रम को बनाए रखने के लिए ‘और’ से व्यक्त किया गया है; בְנֵי का सामान्य वंशावली अर्थ ‘पुत्र’ है।
- source_word: יְכָנְיָה
  choice: यकोन्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אַסִּר
  choice: अस्सीर
  rationale: मसोरेटिक पाठ और वंशावली की सूची-संरचना के अनुसार मुख्य पाठ में इसे व्यक्तिगत नाम माना गया है; ‘बंदी’ अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: שְׁאַלְתִּיאֵל
  choice: शालतीएल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּנֽוֹ
  choice: उसका पुत्र
  rationale: प्रत्यययुक्त संज्ञा का सीधा अर्थ ‘उसका पुत्र’ है। सर्वनाम को बनाए रखने से मूल पाठ की संक्षिप्त वंशावली-शैली बनी रहती है।
theological_decisions:
- issue: क्या אַסִּר को व्यक्तिगत नाम माना जाए या ‘बंदी’ अर्थ वाला जातिवाचक शब्द
  choice: मुख्य पाठ में व्यक्तिगत नाम ‘अस्सीर’
  alternative: '‘और बंदी यकोन्याह के पुत्र: उसका पुत्र शालतीएल।’'
  rationale: इब्रानी रूप दोनों अर्थों की अनुमति देता है। वंशावली की सूची और मसोरेटिक स्वरांकन नाम वाले पाठ का समर्थन करते हैं, पर ‘बंदी’ वाला पाठ ऐतिहासिक रूप से सार्थक है; इसलिए अस्पष्टता को पादटिप्पणी में स्पष्ट रूप से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं, और मूल वंशावली की सूची-जैसी संरचना को यथासंभव बनाए रखा गया है।
