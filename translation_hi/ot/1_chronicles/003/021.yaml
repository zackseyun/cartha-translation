base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/003/021.yaml
  text: 'And the sons of Hananiah: Pelatiah and Jeshaiah; the sons of Rephaiah[a], the sons of Arnan, the sons of Obadiah, the sons of Shecaniah.'
translation:
  language: hi
  text: 'और हनन्याह का पुत्र: पलत्याह और यशायाह; रपायाह के पुत्र[a], अर्नान के पुत्र, ओबद्याह के पुत्र और शकन्याह के पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य-विन्यास संक्षिप्त और कुछ कठिन है। इसका शाब्दिक पाठ है, “और हनन्याह का पुत्र: पलत्याह और यशायाह; रपायाह के पुत्र, अर्नान के पुत्र, ओबद्याह के पुत्र, शकन्याह के पुत्र।” कुछ व्याख्याकार इस क्रम के एक भाग को सीधे पुत्रों की सूची के बजाय व्यापक वंश-परंपरा के रूप में समझते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: וּבֶן
  choice: और ... का पुत्र
  rationale: इब्रानी पाठ में בֶן एकवचन है। इसके बाद दो नाम आने से वाक्य-विन्यास कठिन है, इसलिए इस तनाव को बहुवचन करके चुपचाप सरल नहीं किया गया।
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: व्यक्तिवाचक नाम का आधुनिक हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: פְּלַטְיָה
  choice: पलत्याह
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וִישַׁעְיָה
  choice: और यशायाह
  rationale: संयोजक וִ को ‘और’ से व्यक्त किया गया; नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया।
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: वंशावली में इसका सीधा अर्थ ‘के पुत्र’ है; यद्यपि यह कभी-कभी व्यापक अर्थ में वंशजों को भी सूचित कर सकता है।
- source_word: רְפָיָה
  choice: रपायाह
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; इब्रानी פ की यहाँ घर्षी ध्वनि को ‘फ’ के बजाय प्रचलित बाइबलीय नाम-रूप के अनुरूप ‘प’ से रखा गया।
- source_word: אַרְנָן
  choice: अर्नान
  rationale: व्यक्तिवाचक नाम का सीधा देवनागरी लिप्यंतरण।
- source_word: עֹבַדְיָה
  choice: ओबद्याह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: שְׁכַנְיָה
  choice: शकन्याह
  rationale: व्यक्तिवाचक नाम का इब्रानी के निकट और हिन्दी-पठनीय लिप्यंतरण।
theological_decisions:
- issue: वंशावली में संबंध की सटीक प्रकृति
  choice: दोहराए गए בְּנֵי को ‘के पुत्र’ रखा गया
  alternative: ‘के वंशज’
  rationale: मूल की औपचारिक संरचना को बनाए रखा गया, जबकि पादटिप्पणी यह स्पष्ट करती है कि कुछ व्याख्याकार इसे व्यापक वंश-क्रम मानते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली की संक्षिप्त शैली के अनुरूप रखी गई है। मूल इब्रानी के एकवचन ‘पुत्र’ और उसके बाद आए दो नामों से उत्पन्न कठिनाई को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
