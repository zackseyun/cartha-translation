base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/030.yaml
  text: 'And the sons of Mushi: Mahli[a], Eder, and Jeremoth. These were the sons of the Levites according to their fathers'' houses.'
translation:
  language: hi
  text: 'और मूशी के पुत्र: महली, एदेर और यिरिमोत[a]। ये लेवियों के वंशज थे, अपने-अपने पितृकुलों के अनुसार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का लिप्यंतरण “यरीमोत” भी किया जाता है।
    reason: नाम के लिप्यंतरण की वैकल्पिक प्रचलित वर्तनी बताने के लिए।
lexical_decisions:
- source_word: וּבְנֵי מוּשִׁי
  choice: और मूशी के पुत्र
  rationale: संयोजक וּ को ‘और’ से तथा वंशावली के सूत्र בְנֵי को स्वाभाविक हिंदी में ‘पुत्र’ से व्यक्त किया गया है। मूशी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण है।
- source_word: מַחְלִי וְעֵדֶר וִירִימוֹת
  choice: महली, एदेर और यिरिमोत[a]
  rationale: तीनों व्यक्तिवाचक नामों का मसोराई स्वरांकन के आधार पर देवनागरी लिप्यंतरण किया गया है; हिंदी सूची-शैली में अंतिम नाम से पहले ‘और’ रखा गया है।
- source_word: אֵלֶּה בְּנֵי הַלְוִיִּם
  choice: ये लेवियों के वंशज थे
  rationale: शाब्दिक ‘लेवियों के पुत्र’ यहाँ व्यापक वंशावली अर्थ रखता है; ‘वंशज’ आधुनिक हिंदी में आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है। कथात्मक वंशावली के अनुरूप ‘थे’ की पूर्ति की गई है।
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: अपने-अपने पितृकुलों के अनुसार
  rationale: यह प्रशासनिक-वंशावली पदबंध पैतृक घरानों या कुलों के आधार पर वर्गीकरण बताता है। ‘पितृकुल’ अर्थ को संक्षिप्त, गरिमापूर्ण और स्पष्ट रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी की सहज किंतु गरिमापूर्ण वंशावली-शैली अपनाई गई है। व्यक्तिनाम स्रोत के स्वरांकन के निकट रखे गए हैं और ‘पितृकुल’ से प्राचीन पैतृक घराने की संकल्पना व्यक्त की गई है।
