  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִדְלָיָהוּ
  choice: दलायाह के लिए
  rationale: उपसर्ग ל इस याजकीय दलों की सूची में चिट्ठी अथवा क्रम के आवंटन को दर्शाता है। ‘के लिए’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है, और नाम का लिप्यंतरण किया गया है।
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים
  choice: तेईसवाँ
  rationale: इब्रानी रूप शाब्दिकतः ‘तीन और बीस’ है, पर सूची के संदर्भ में यह क्रमसूचक संख्या का कार्य करता है; इसलिए ‘तेईसवाँ’ उपयुक्त है।
- source_word: לְמַעַזְיָהוּ
  choice: माज्याह के लिए
  rationale: यहाँ भी ל आवंटित क्रम को सूचित करता है। ‘के लिए’ स्पष्ट और स्वाभाविक है; व्यक्ति के नाम को हिन्दी ध्वन्यात्मक रूप में रखा गया है।
- source_word: אַרְבָּעָה וְעֶשְׂרִים
  choice: चौबीसवाँ
  rationale: रूपतः यह गणनावाचक ‘चार और बीस’ है, किन्तु क्रमबद्ध सूची में इसका अर्थ चौबीसवाँ क्रम है।
