  text: 'And the sons of Jeriah: Amariah the second[a], Jahaziel the third, Jekameam the fourth.'
translation:
  language: hi
  text: 'और यरियाह के पुत्र: अमर्याह दूसरा, यहजीएल तीसरा और यकमाम चौथा थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנָי
  choice: और ... के पुत्र
  rationale: वाव पिछले वंशावली-सूची से इस पद को जोड़ता है; בְנֵי का अर्थ यहाँ पुरुष वंशज या पुत्र है।
- source_word: יְרִיָּהוּ
  choice: यरियाह
  rationale: व्यक्तिनाम का मसोरेटी स्वरांकन के निकट, हिंदी में स्वाभाविक लिप्यंतरण।
- source_word: אֲמַרְיָהוּ
  choice: अमर्याह
  rationale: व्यक्तिनाम का प्रचलित और स्रोत-संगत हिंदी लिप्यंतरण।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: क्रमसूचक शब्द सूची में अमर्याह का स्थान बताता है; इब्रानी की संक्षिप्त शैली बनाए रखी गई है।
- source_word: יַחֲזִיאֵל
  choice: यहजीएल
  rationale: व्यक्तिनाम का इब्रानी व्यंजनों और स्वरांकन पर आधारित हिंदी लिप्यंतरण।
- source_word: הַשְּׁלִישִׁי
  choice: तीसरा
  rationale: सूची का क्रमसूचक अर्थ सीधे रखा गया है।
- source_word: יְקַמְעָם
  choice: यकमाम
  rationale: मसोरेटी יְקַמְעָם का स्रोत-संगत हिंदी लिप्यंतरण।
- source_word: הָרְבִיעִי
  choice: चौथा
  rationale: क्रमसूचक अर्थ रखा गया है; हिंदी वाक्य की स्वाभाविकता के लिए अंत में निहित क्रिया 'था' दी गई है।
