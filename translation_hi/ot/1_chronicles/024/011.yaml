  text: to Jeshua the ninth, to Shecaniah the tenth.
translation:
  language: hi
  text: नौवाँ येशू को, दसवाँ शकन्याह को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְיֵשׁוּעַ
  choice: येशू को
  rationale: לְ यहाँ चिट्ठी द्वारा याजकीय दल का क्रम किसी व्यक्ति को मिलने का भाव देता है; हिंदी में ‘को’ इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है। नाम יֵשׁוּעַ का लिप्यंतरण ‘येशू’ किया गया है।
- source_word: הַתְּשִׁעִי
  choice: नौवाँ
  rationale: निश्चित उपपद सहित क्रमवाचक शब्द यहाँ स्वतंत्र रूप से प्रयुक्त होकर नौवीं चिट्ठी अथवा क्रम को सूचित करता है; सूची की संक्षिप्त शैली बनाए रखी गई है।
- source_word: לִשְׁכַנְיָהוּ
  choice: शकन्याह को
  rationale: לְ पहले खंड की तरह आवंटन पाने वाले व्यक्ति को चिह्नित करता है। שְׁכַנְיָהוּ का स्रोत-सापेक्ष हिंदी लिप्यंतरण ‘शकन्याह’ रखा गया है।
- source_word: הָעֲשִׂרִי
  choice: दसवाँ
  rationale: यह क्रमवाचक शब्द दसवीं चिट्ठी अथवा दसवें क्रम को सूचित करता है; हिंदी में संज्ञा के लोप के साथ पुल्लिंग एकवचन रूप प्रसंगानुसार स्पष्ट है।
