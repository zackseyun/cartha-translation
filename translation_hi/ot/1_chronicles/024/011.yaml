translation_notes:
  register: याजकीय दलों की क्रमबद्ध सूची के अनुरूप भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिंदी में रखी गई है। ‘चिट्ठा’ या ‘दल’ जैसे प्रसंगगत शब्द पद में नहीं जोड़े गए, क्योंकि इब्रानी पाठ की संक्षिप्तता पर्याप्त स्पष्ट है।
