translation:
  language: hi
  text: सातवाँ हक्कोस के लिए, आठवाँ अबिय्याह के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַקּוֹץ
  choice: हक्कोस के लिए
  rationale: उपसर्ग ל इस चिट्ठी द्वारा ठहराए गए क्रम में आवंटन दर्शाता है। ‘के लिए’ आधुनिक हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है; हक्कोस नाम का स्रोतानुरूप लिप्यंतरण है।
- source_word: הַשְּׁבִעִי
  choice: सातवाँ
  rationale: निश्चित क्रमवाचक विशेषण याजकीय दल के सातवें क्रम को सूचित करता है। हिन्दी में संदर्भ के कारण अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: לַאֲבִיָּה
  choice: अबिय्याह के लिए
  rationale: यहाँ भी उपसर्ग ל क्रम में आवंटन दर्शाता है। अबिय्याह स्रोत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण है।
- source_word: הַשְּׁמִינִי
  choice: आठवाँ
  rationale: यह समानांतर क्रमवाचक रूप आठवें याजकीय दल अथवा क्रम को बताता है।
