  register: संक्षिप्त सूची-शैली को बनाए रखते हुए आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी प्रयुक्त हुई है। ‘के लिए’ ने ל के आवंटन-संबंधी अर्थ को स्वाभाविक ढंग से व्यक्त किया है; यहाँ वैकल्पिक हिन्दी ‘को’ भी संभव है, पर अर्थ में उल्लेखनीय अंतर न होने से पादटिप्पणी आवश्यक नहीं समझी गई।
