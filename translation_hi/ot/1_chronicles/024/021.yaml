  yaml_path: translation/ot/1_chronicles/024/021.yaml
  text: For Rehabiah[a], from the sons of Rehabiah, the chief was Isshiah.
translation:
  language: hi
  text: 'रहब्याह के विषय में: रहब्याह के पुत्रों में प्रधान यिश्शियाह था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/רְחַבְיָהוּ
  choice: रहब्याह के विषय में
  rationale: आरंभिक לְ इस वंश-सूची में अगले कुल का विषय प्रस्तुत करता है। ‘के विषय में’ इस शीर्षकीय संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לִ/בְנֵי רְחַבְיָהוּ
  choice: रहब्याह के पुत्रों में
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है और वंशावली में यह वंशजों को भी सूचित कर सकता है। यहाँ לְ को समूह के भीतर संबंध बताने वाले ‘में’ से व्यक्त किया गया है।
- source_word: הָ/רֹאשׁ
  choice: प्रधान
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर इस प्रशासनिक वंश-सूची में यह कुल के मुख्य प्रतिनिधि को दर्शाता है; ‘प्रधान’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
- source_word: יִשִּׁיָּה
  choice: यिश्शियाह
  rationale: व्यक्तिनाम को हिब्रू व्यंजनरूप के निकट देवनागरी में लिप्यंतरित किया गया है; दोगुना שׁ ‘श्श’ से और अंतिम יָה ‘याह’ से व्यक्त है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, सूची-संगत और गरिमापूर्ण शैली रखी गई है। द्विबिंदु पहले पदबंध को वंशीय शीर्षक के रूप में स्पष्ट करता है, बिना मूल के आशय को विस्तार देने के।
