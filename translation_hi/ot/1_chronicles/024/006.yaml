  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पितृकुल’ वंशाधारित इकाई को व्यक्त करता है, और नामों का देवनागरी रूप इब्रानी उच्चारण के निकट रखा गया है। पादटिप्पणी-चिह्न को उसी संकुचित अंतिम उपवाक्य पर रखा गया है जिसकी वह व्याख्या करता है।
