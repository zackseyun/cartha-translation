base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/006.yaml
  text: Shemaiah son of Nethanel[a], the scribe from among the Levites, recorded them in the presence of the king, the officials, Zadok the priest, Ahimelech son of Abiathar, and the heads of the fathers’ houses of the priests and of the Levites—one father’s house being taken for Eleazar, and one being taken for Ithamar.
translation:
  language: hi
  text: लेवियों में से नतनेल के पुत्र शमायाह नामक लिपिक ने राजा, अधिकारियों, सादोक याजक, एब्यातार के पुत्र अहीमेलेक, और याजकों तथा लेवियों के पितृकुलों के मुखियाओं की उपस्थिति में उन्हें दर्ज किया—एलआज़ार के लिए एक पितृकुल लिया गया और ईतामार के लिए भी एक पितृकुल लिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य बहुत संक्षिप्त है: “एलआज़ार के लिए एक पितृकुल लिया गया, और ईतामार के लिए लिया गया, लिया गया।” संभवतः आशय यह है कि एलआज़ार और ईतामार के वंशों में से पितृकुल बारी-बारी से चुने गए।'
    reason: इब्रानी की असामान्य पुनरुक्ति और संभावित वितरणात्मक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּכְתְּבֵם
  choice: उनका लेखा दर्ज किया
  rationale: क्रिया כתב और उसके बहुवचन कर्म-प्रत्यय का संबंध पिछले प्रसंग में निर्धारित दलों/नामों से है। यह अभिव्यक्ति लिखित आधिकारिक अभिलेखन का भाव स्वाभाविक हिन्दी में देती है।
- source_word: הַסּוֹפֵר
  choice: लेखक
  rationale: यहाँ סֹפֵר लिखने और अभिलेख तैयार करने वाले अधिकारी को दर्शाता है। ‘लेखक’ सामान्य पाठक के लिए सुबोध है और भूमिका को अनावश्यक रूप से धार्मिक विद्वान तक सीमित नहीं करता।
- source_word: מִן הַלֵּוִי
  choice: लेवियों में से
  rationale: מן के समूहगत/अंशवाचक भाव को बनाए रखते हुए शमायाह का लेवी समुदाय से संबंध स्पष्ट किया गया है।
- source_word: לִפְנֵי
  choice: की उपस्थिति में
  rationale: यह सार्वजनिक प्रक्रिया और उपस्थित साक्षियों के सामने अभिलेखन किए जाने का भाव व्यक्त करता है।
- source_word: הַשָּׂרִים
  choice: अधिकारियों
  rationale: राजकीय-प्रशासनिक प्रसंग में שׂרים पदाधिकारियों को दर्शाता है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और राजकुमारों का भ्रामक अर्थ नहीं देता।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखियाओं
  rationale: इतिहास-वृत्तांत में यह वंशाधारित सामाजिक-प्रशासनिक इकाइयों के प्रमुखों के लिए प्रयुक्त पारिभाषिक पद है।
- source_word: בֵּית אָב אֶחָד
  choice: एक पितृकुल
  rationale: בית אב का आशय एक पूर्वज से जुड़ी कुल-इकाई है। ‘पितृकुल’ संक्षिप्त, प्रतिष्ठित और आधुनिक हिन्दी में बोधगम्य है।
- source_word: אָחֻז
  choice: लिया गया
  rationale: אחז का निष्क्रिय रूप मूलतः ‘पकड़ा/लिया गया’ है। चिट्ठी द्वारा चयन के संदर्भ में ‘लिया गया’ मूल रूपक और वाक्य की संक्षिप्तता बनाए रखता है।
- source_word: לְאֶלְעָזָר ... לְאִיתָמָר
  choice: एलआज़ार के लिए ... ईतामार के लिए
  rationale: ל दोनों याजकीय वंशों के संबंध में आवंटन या चयन को सूचित करता है; ‘के लिए’ इस संबंध को बिना अतिरिक्त व्याख्या के रखता है।
- source_word: וְאָחֻז אָחֻז לְאִיתָמָר
  choice: और ईतामार के लिए भी एक पितृकुल लिया गया
  rationale: दोहरे אָחֻז की संकुचित और संभवतः वितरणात्मक रचना को पठनीय बनाया गया है, जबकि उसकी असामान्यता और बारी-बारी चयन की संभावित छाया को पादटिप्पणी में सुरक्षित रखा गया है।
