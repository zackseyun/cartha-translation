  register: आधुनिक मानक हिन्दी का संक्षिप्त, गरिमापूर्ण सूची-वाक्य। ‘पर्ची निकली’ निकटवर्ती संदर्भ में चिट्ठी डालकर हुए क्रमिक आवंटन को सहज रूप से व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि לְ के ‘को/के लिए’ विकल्प से हिन्दी में अर्थगत महत्वपूर्ण भेद उत्पन्न नहीं होता।
