  text: for Huppah[a], the thirteenth; for Jeshebeab, the fourteenth.
translation:
  language: hi
  text: हुप्पा के लिए तेरहवीं पर्ची निकली, और येशेबाब के लिए चौदहवीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/חֻפָּה
  choice: हुप्पा के लिए
  rationale: इस पुरोहित-दल आवंटन सूची में उपसर्ग לְ नामित घराने के लिए नियुक्ति दर्शाता है; आधुनिक हिन्दी में ‘के लिए’ स्वाभाविक है।
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: तेरहवीं पर्ची
  rationale: मूल में संख्या व्याकरणतः गणनावाचक है, पर चिट्ठियों के क्रम में क्रमवाचक अर्थ देती है। पिछले संदर्भ से निहित ‘पर्ची’ जोड़ने पर हिन्दी में आशय स्पष्ट और स्वाभाविक होता है।
- source_word: לְ/יֶשֶׁבְאָב
  choice: यशेबाब के लिए
  rationale: उपसर्ग לְ यहाँ आवंटन का संबंध बताता है; नाम का लिप्यंतरण ‘यशेबाब’ हिब्रू उच्चारण के निकट और हिन्दी-पाठक के लिए सुगम है।
- source_word: אַרְבָּעָה עָשָׂר
  choice: चौदहवीं
  rationale: गणनावाचक रूप सूची के संदर्भ में क्रमवाचक कार्य करता है; हिन्दी में ‘चौदहवीं’ पहले उल्लिखित ‘पर्ची’ से स्वाभाविक रूप से जुड़ता है।
