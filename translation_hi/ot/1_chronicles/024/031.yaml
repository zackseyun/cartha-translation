  text: וַ/יַּפִּילוּ֩ גַם הֵ֨ם גּוֹרָל֜וֹת לְ/עֻמַּ֣ת אֲחֵי/הֶ֣ם בְּנֵֽי אַהֲרֹ֗ן לִ/פְנֵ֨י דָוִ֤יד הַ/מֶּ֨לֶךְ֙ וְ/צָד֣וֹק וַ/אֲחִימֶ֔לֶךְ וְ/רָאשֵׁי֙ הָֽ/אָב֔וֹת לַ/כֹּהֲנִ֖ים וְ/לַ/לְוִיִּ֑ם אָב֣וֹת הָ/רֹ֔אשׁ לְ/עֻמַּ֖ת אָחִ֥י/ו הַ/קָּטָֽן־׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/031.yaml
  text: These also cast lots alongside their brothers[a], the sons of Aaron, before King David, Zadok, Ahimelech[b], and the heads of the fathers’ houses of the priests and of the Levites—the chief fathers’ houses as well as those of their younger brothers.
translation:
  language: hi
  text: उन्होंने भी अपने भाइयों, अर्थात हारून के पुत्रों, के समान[a] राजा दाऊद, सादोक, अहीमेलेक, और याजकों तथा लेवियों के पितृकुलों के मुखियाओं के सामने चिट्ठियाँ डालीं—मुख्य पितृकुलों और उनके छोटे भाइयों के पितृकुलों, दोनों के लिए समान रूप से।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने भाइयों, अर्थात हारून के पुत्रों, के अनुरूप” या “उनके साथ-साथ।” इब्रानी पद का अर्थ “के सामने,” “के अनुरूप,” या “के साथ-साथ” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से इब्रानी में, “मुख्य पितृकुल [अपने] छोटे भाई के अनुरूप।” एकवचन रूप सम्भवतः वितरणात्मक हैं; आशय यह हो सकता है कि प्रमुख और कनिष्ठ पारिवारिक शाखाओं के साथ चिट्ठियाँ डालते समय समान व्यवहार हुआ।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפִּילוּ ... גּוֹרָלוֹת
  choice: चिट्ठियाँ डालीं
  rationale: यह हिन्दी में चिट्ठी डालकर निर्णय अथवा क्रम निर्धारित करने की बाइबलीय प्रक्रिया का स्वाभाविक और प्रचलित रूप है।
- source_word: גַם הֵם
  choice: उन्होंने भी
  rationale: यह पिछले संदर्भ में उल्लिखित लेवीय समूहों की ओर संकेत करता और बताता है कि उन्होंने भी इस प्रक्रिया में भाग लिया।
- source_word: לְעֻמַּת אֲחֵיהֶם בְּנֵי אַהֲרֹן
  choice: अपने भाइयों अर्थात हारून के पुत्रों के समान
  rationale: לְעֻמַּת के अनुरूपता या समानांतर व्यवस्था के भाव को व्यक्त करता है; 'अर्थात' स्पष्ट करता है कि 'भाइयों' से हारून के पुत्र अभिप्रेत हैं।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: सार्वजनिक और आधिकारिक उपस्थिति में चिट्ठियाँ डाले जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דָוִיד הַמֶּלֶךְ
  choice: राजा दाऊद
  rationale: उपाधि और नाम का यह क्रम आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखियाओं
  rationale: पैतृक वंश पर आधारित सामाजिक इकाइयों और उनके अगुओं, दोनों को बनाए रखता है।
- source_word: לַכֹּהֲנִים וְלַלְוִיִּם
  choice: याजकों तथा लेवियों के
  rationale: यह उन समुदायों को पितृकुलों से संबंधसूचक रूप में जोड़ता है।
- source_word: אָבוֹת הָרֹאשׁ לְעֻמַּת אָחִיו הַקָּטָן
  choice: मुख्य पितृकुलों ने अपने छोटे भाइयों के पितृकुलों के समान ही ऐसा किया
  rationale: संक्षिप्त और कठिन इब्रानी को वितरणात्मक अर्थ में ग्रहण कर प्रमुख और कनिष्ठ शाखाओं के समान व्यवहार को स्पष्ट करता है, जबकि वैकल्पिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
