  text: וַ/יַּחְלְק֥וּ/ם בְּ/גוֹרָל֖וֹת אֵ֣לֶּה עִם אֵ֑לֶּה כִּי הָי֤וּ שָֽׂרֵי קֹ֨דֶשׁ֙ וְ/שָׂרֵ֣י הָ/אֱלֹהִ֔ים מִ/בְּנֵ֥י אֶלְעָזָ֖ר וּ/בִ/בְנֵ֥י אִיתָמָֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/005.yaml
  text: So they divided them by lots[a], these with those[b], because there were officers of the sanctuary and officers of God from the sons of Eleazar and from the sons of Ithamar.
translation:
  language: hi
  text: तब उन्होंने इन्हें चिट्ठियाँ डालकर, एक दल को दूसरे दल के साथ[a], बाँट दिया; क्योंकि एलीआज़ार के पुत्रों और ईतामार के पुत्रों में पवित्रस्थान के अधिकारी और परमेश्वर के अधिकारी[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ये इनके साथ।” इब्रानी में शाब्दिक रूप से यही संक्षिप्त वाक्यांश है; इसका अर्थ “एक दल को दूसरे दल के साथ” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “अधिकारी” का अनुवाद “प्रधान” या “अगुवे” भी हो सकता है। “पवित्रस्थान के अधिकारी” का अर्थ “पवित्र वस्तुओं के अधिकारी” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְלְקוּם
  choice: उन्होंने ... उन्हें बाँट दिया
  rationale: חלק का पिएल रूप यहाँ याजकीय कुलों को बाँटने अथवा उनका भाग निर्धारित करने की क्रिया बताता है। ‘बाँट दिया’ सीधा, स्वाभाविक और ठोस अर्थ को बनाए रखता है।
- source_word: בְּגוֹרָלוֹת
  choice: चिट्ठियाँ डालकर
  rationale: גוֹרָל निर्णय अथवा नियुक्ति के लिए डाली जाने वाली चिट्ठी को दर्शाता है। आधुनिक हिन्दी में ‘चिट्ठियाँ डालकर’ साधन और क्रिया दोनों को स्पष्ट करता है।
- source_word: אֵלֶּה עִם אֵלֶּה
  choice: इनको उनके साथ
  rationale: यह चयन इब्रानी के संक्षिप्त ‘ये उनके साथ’ को निकटता से रखता है और यह स्पष्ट करने से बचता है कि इसका आशय ठीक किस प्रकार की पारस्परिक व्यवस्था से है। अधिक स्वाभाविक व्याख्या फुटनोट में दी गई है।
- source_word: שָׂרֵי קֹדֶשׁ
  choice: पवित्रस्थान के प्रधान
  rationale: שָׂרֵי का अर्थ प्रधान, अगुवे या अधिकारी हो सकता है। इस उपासना-संबंधी संदर्भ में קֹדֶשׁ को पवित्रस्थान मानना स्वाभाविक है, जबकि ‘प्रधान’ पद और नेतृत्व दोनों की व्यापकता बनाए रखता है।
- source_word: וְשָׂרֵי הָאֱלֹהִים
  choice: और परमेश्वर के प्रधान
  rationale: इब्रानी में शाब्दिक रूप से ‘परमेश्वर के प्रधान’ है; उसमें ‘भवन’, ‘सेवा’ या ‘काम’ नहीं जोड़ा गया है। असामान्य समानांतर अभिव्यक्ति को जानबूझकर सुरक्षित रखा गया है।
- source_word: מִבְּנֵי אֶלְעָזָר וּבִבְנֵי אִיתָמָר
  choice: एलीआज़ार के पुत्रों और ईतामार के पुत्रों—दोनों में
  rationale: בְּנֵי याजकीय वंशों के लिए ‘पुत्रों’ का वंशावली-सूचक प्रयोग है। ‘दोनों में’ हिन्दी में इस बात को स्वाभाविक ढंग से व्यक्त करता है कि बताए गए प्रधान दोनों वंशों में पाए जाते थे।
theological_decisions:
- issue: שָׂרֵי קֹדֶשׁ וְשָׂרֵי הָאֱלֹהִים का आशय
  choice: दो समानांतर पदनामों को ‘पवित्रस्थान के प्रधान और परमेश्वर के प्रधान’ के रूप में अलग-अलग सुरक्षित रखा गया है।
  alternative: ‘पवित्र वस्तुओं के अधिकारी और परमेश्वर के अधिकारी’, अथवा दूसरे पद को विस्तार देकर ‘परमेश्वर के भवन/सेवा के अधिकारी’ कहना।
  rationale: 'पद बताता है कि चिट्ठियाँ क्यों डाली गईं: एलीआज़ार और ईतामार, दोनों वंशों में पवित्र दायित्व वाले प्रधान थे। अनुवाद इब्रानी में अनुपस्थित संस्थागत शब्द जोड़कर दोनों पदनामों का सामंजस्य नहीं करता।'
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘इनको उनके साथ’ जानबूझकर कुछ असामान्य है, ताकि मूल इब्रानी की संक्षिप्त और अस्पष्ट अभिव्यक्ति न मिटे; फुटनोट उसका स्वाभाविक वैकल्पिक अर्थ देता है।
