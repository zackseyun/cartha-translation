  text: for Jakin, the twenty-first; for Gamul, the twenty-second.
translation:
  language: hi
  text: याकीन के लिए इक्कीसवाँ, गामूल के लिए बाईसवाँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָכִין
  choice: याकीन के लिए
  rationale: इस याजकीय दलों की क्रम-सूची में לְ नियुक्ति अथवा चिट्ठी से मिले क्रम को दर्शाता है; इसलिए स्वाभाविक हिन्दी में ‘के लिए’ रखा गया है। व्यक्ति-नाम का लिप्यंतरण किया गया है।
- source_word: אֶחָד וְ/עֶשְׂרִים
  choice: इक्कीसवाँ
  rationale: इब्रानी में शाब्दिक रूप से ‘एक और बीस’ है, पर सूची के संदर्भ में यह क्रमवाचक संख्या के रूप में प्रयुक्त हुआ है।
- source_word: לְ/גָמוּל
  choice: गामूल के लिए
  rationale: पहले खंड की तरह यहाँ भी לְ याजकीय दल को दिए गए क्रम को दर्शाता है। व्यक्ति-नाम का लिप्यंतरण किया गया है।
- source_word: שְׁנַיִם וְ/עֶשְׂרִים
  choice: बाईसवाँ
  rationale: रूप की दृष्टि से यह ‘दो और बीस’ है, किंतु इस क्रमबद्ध सूची में इसका आशय बाईसवाँ स्थान है।
