  text: These were their appointed duties for their service[a], to enter the house of Yahweh according to their ordinance, under the hand of Aaron their father, as Yahweh, the God of Israel[b], had commanded him.
translation:
  language: hi
  text: याहवे के भवन में प्रवेश करके सेवा करने के लिए ये उनके नियुक्त दायित्व थे, उनकी निर्धारित व्यवस्था के अनुसार, उनके पूर्वज हारून के अधीन, जैसा इस्राएल के परमेश्वर याहवे ने उसे आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְקֻדָּתָם
  choice: उनकी नियुक्त सेवा-व्यवस्थाएँ
  rationale: यह संज्ञा यहाँ याजकीय दलों को सौंपे गए औपचारिक दायित्वों और उनकी व्यवस्थित नियुक्ति, दोनों को व्यक्त करती है।
- source_word: לַעֲבֹדָתָם
  choice: सेवा करनी थी
  rationale: मन्दिर के प्रसंग में עֲבֹדָה उपासना-संबंधी याजकीय सेवा को दर्शाता है; ‘सेवा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לָבוֹא לְבֵית יְהוָה
  choice: यहोवा के भवन में आकर
  rationale: בוא के मूल अर्थ ‘आना’ को बनाए रखते हुए प्रसंगानुसार भवन में प्रवेश करके सेवा करने का भाव व्यक्त होता है।
- source_word: כְּמִשְׁפָּטָם
  choice: अपने निर्धारित क्रम से
  rationale: यहाँ מִשְׁפָּט न्यायिक निर्णय नहीं, बल्कि निर्धारित नियम, प्रक्रिया या क्रम को सूचित करता है।
- source_word: בְּיַד אַהֲרֹן
  choice: हारून के निर्देशन में
  rationale: शाब्दिक ‘हारून के हाथ से/अधीन’ इस प्रसंग में प्रशासन, अधिकार और निर्देशन का मुहावरा है; स्वाभाविक हिन्दी में उसका आशय दिया गया है।
- source_word: אֲבִיהֶם
  choice: उनके पूर्वज
  rationale: हारून इन बाद की याजकीय पीढ़ियों का वंशीय पिता है; ‘पूर्वज’ आधुनिक हिन्दी में आशय को अस्पष्टता के बिना व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוָּהוּ
  choice: ठीक वैसे ही जैसे ... ने उसे आज्ञा दी थी
  rationale: एकवचन कर्म-प्रत्यय हारून की ओर संकेत करता है और व्यवस्था का पहले दी गई ईश्वरीय आज्ञा के अनुरूप होना बताता है।
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर यहोवा
  rationale: इब्रानी में दिए वाचा-नाम और ‘इस्राएल के परमेश्वर’ पदवी, दोनों को स्पष्ट एवं स्वाभाविक हिन्दी क्रम में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘यहोवा’ हिन्दी बाइबलीय परम्परा में व्यापक रूप से पहचाना जाने वाला रूप है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: בְּיַד אַהֲרֹן में याजकीय प्रशासन का भाव
  choice: हारून के निर्देशन में
  alternative: हारून के हाथ से; हारून के अधिकार के अधीन
  rationale: मुहावरा माध्यम या अधिकार दोनों का भाव दे सकता है। इस प्रशासनिक प्रसंग में ‘निर्देशन में’ दोनों के बीच स्वाभाविक संतुलन रखता है, बिना किसी विशिष्ट सम्प्रदायगत पदानुक्रम को आरोपित किए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। लम्बी इब्रानी वाक्य-रचना को दो वाक्यों में बाँटा गया है, पर उसके तार्किक संबंध सुरक्षित हैं। ‘भवन’ से בית की मूल छवि और ‘निर्धारित क्रम’ से मन्दिर-सेवा की औपचारिक व्यवस्था बनाए रखी गई है।
