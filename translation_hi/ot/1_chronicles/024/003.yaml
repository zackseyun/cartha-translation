  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वंश-संबंधों के लिए ‘के वंशज’ और याजकीय עבודה के लिए सहज ‘सेवा’ का प्रयोग किया गया है।
