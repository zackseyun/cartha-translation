base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/003.yaml
  text: David[a], with Zadok from the sons of Eleazar and Ahimelech from the sons of Ithamar, divided them according to their appointment in their service.
translation:
  language: hi
  text: दाऊद ने एलीआज़ार के वंशज सादोक और ईतामार के वंशज अहीमेलेक के साथ मिलकर उन्हें उनकी सेवा में उनकी नियुक्त ज़िम्मेदारियों के अनुसार बाँटा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “उन्हें उनकी सेवा के लिए सौंपे गए कामों के अनुसार बाँटा।” यहाँ प्रयुक्त इब्रानी पद में नियुक्ति, देखरेख और व्यवस्थित कार्य-विभाजन—इन सभी का भाव हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: उन्हें ... बाँटा
  rationale: חלק का सीधा अर्थ ‘बाँटना’ है। प्रसंग याजकीय दलों के संगठन का है, पर मूल में ‘दलों’ के लिए अलग शब्द न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְצָדוֹק מִן בְּנֵי אֶלְעָזָר
  choice: एलीआज़ार के वंशज सादोक ... के साथ मिलकर
  rationale: מן בני वंश-संबंध बताता है। संयोजक ו को स्वाभाविक हिन्दी में सहभागिता दर्शाने वाले ‘के साथ मिलकर’ से व्यक्त किया गया है।
- source_word: וַאֲחִימֶלֶךְ מִן בְּנֵי אִיתָמָר
  choice: ईतामार के वंशज अहीमेलेक
  rationale: यह समानांतर पद अहीमेलेक को ईतामार के याजकीय वंश से जोड़ता है।
- source_word: לִפְקֻדָּתָם
  choice: उनकी नियुक्त ज़िम्मेदारियों के अनुसार
  rationale: פְּקֻדָּה में नियुक्ति, दायित्व, देखरेख और व्यवस्थित कार्य-विभाजन के अर्थ समाहित हो सकते हैं। ‘नियुक्त ज़िम्मेदारियाँ’ प्रशासनिक और सेवागत भाव को स्पष्ट रखते हुए किसी एक संकीर्ण संस्थागत अर्थ को नहीं थोपता।
- source_word: בַּעֲבֹדָתָם
  choice: उनकी सेवा में
  rationale: עֲבֹדָה का मूल अर्थ काम या सेवा है; यहाँ यह याजकीय सेवा को दर्शाता है। ‘सेवा’ आधुनिक हिन्दी में स्वाभाविक है और ‘सेवकाई’ जैसे अधिक सांप्रदायिक शब्द से बचता है।
