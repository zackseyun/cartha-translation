  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘चिट्ठी ... के नाम निकली’ हिन्दी में चिट्ठी डालकर चयन या क्रम निर्धारित करने की प्रक्रिया का स्वाभाविक मुहावरा है। दोनों नामों का लिप्यंतरण इब्रानी रूपों יְהוֹיָרִיב और יְדַעְיָה के निकट रखा गया है।
