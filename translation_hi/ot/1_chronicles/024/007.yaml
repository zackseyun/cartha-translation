  text: The first lot came out for Jehoiarib[a], the second for Jedaiah.
translation:
  language: hi
  text: पहली चिट्ठी यहोयारीब के नाम निकली और दूसरी यदायाह के नाम।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकली
  rationale: יצא का मूल अर्थ ‘निकलना’ है; चिट्ठी डालकर निर्णय करने के प्रसंग में ‘चिट्ठी ... निकली’ स्वाभाविक हिन्दी है और इब्रानी क्रिया के निकट भी रहती है।
- source_word: הַגּוֹרָל
  choice: चिट्ठी
  rationale: גּוֹרָל यहाँ चयन अथवा बँटवारे के लिए डाली गई चिट्ठी को दर्शाता है। ‘चिट्ठी’ सामान्य आधुनिक हिन्दी में इस प्रक्रिया को संक्षेप और स्पष्ट रूप से व्यक्त करती है।
- source_word: הָרִאשׁוֹן
  choice: पहली
  rationale: क्रमसूचक विशेषण को ‘चिट्ठी’ के स्त्रीलिंग के अनुसार ‘पहली’ किया गया है।
- source_word: לִיהוֹיָרִיב
  choice: यहोयारीब के नाम
  rationale: उपसर्ग ל यहाँ आवंटन पाने वाले व्यक्ति को सूचित करता है; हिन्दी में ‘के नाम’ चिट्ठी द्वारा हुए आवंटन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִידַעְיָה
  choice: यदायाह के नाम
  rationale: यहाँ भी ל प्राप्तकर्ता को दर्शाता है; समानांतर वाक्यांश ‘के नाम’ प्रशासनिक आवंटन का भाव स्पष्ट रखता है।
- source_word: הַשֵּׁנִי
  choice: दूसरी
  rationale: इब्रानी में संज्ञा दूसरे खंड में अध्याहृत है; हिन्दी में ‘दूसरी’ से ‘दूसरी चिट्ठी’ स्वाभाविक रूप से समझी जाती है।
