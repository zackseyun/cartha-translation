  yaml_path: translation/ot/1_chronicles/024/020.yaml
  text: 'And for the remaining sons of Levi: for the sons of Amram[a], Shubael; for the sons of Shubael[b], Jehdeiah.'
translation:
  language: hi
  text: 'लेवी के बचे हुए वंशजों में: अम्राम के वंशजों में[a] शूबाएल; शूबाएल के वंशजों में यहद्याहू।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस वंश-सूची की हिब्रू भाषा संक्षिप्त है; यहाँ दिए गए व्यक्तिगत नाम संभवतः प्रत्येक कुल-शाखा के मुखिया या प्रतिनिधि को सूचित करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי הַ/נּוֹתָרִים
  choice: लेवी के शेष वंशजों में से
  rationale: यह पद पिछले नामों की सूची को आगे बढ़ाता है। ‘वंशज’ इस वंशावली-संबंधी प्रसंग में ‘पुत्रों’ की तुलना में अधिक स्वाभाविक है, क्योंकि यहाँ व्यापक कुल-शाखाएँ अभिप्रेत हैं; ‘शेष’ हिब्रू participle הַנּוֹתָרִים का सीधा भाव रखता है।
- source_word: לִ/בְנֵי עַמְרָם
  choice: अम्राम के वंशजों में
  rationale: बार-बार आने वाला לִבְנֵי प्रशासनिक वंश-सूची में कुल-शाखा का परिचय देता है। हिंदी में ‘के वंशजों में’ सूची की संक्षिप्त शैली को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שׁוּבָאֵל
  choice: शूबाएल
  rationale: हिब्रू नाम का निकट देवनागरी लिप्यंतरण; सूची के संक्षिप्त वाक्य-विन्यास में यह संभवतः कुल-शाखा के मुखिया या प्रतिनिधि का नाम है।
- source_word: לִ/בְנֵי שׁוּבָאֵל
  choice: शूबाएल के वंशजों में
  rationale: मूल पाठ की दोहराई गई सूची-संरचना को बनाए रखते हुए अगली उपशाखा का परिचय दिया गया है।
- source_word: יֶחְדְּיָהוּ
  choice: यहदयाह
  rationale: हिब्रू नाम का प्रचलित और उच्चारण-सुलभ हिंदी लिप्यंतरण, जिसमें नाम के अंतिम -याहू तत्व को हिंदी बाइबलीय नाम-परंपरा के अनुसार ‘-याह’ रूप दिया गया है।
