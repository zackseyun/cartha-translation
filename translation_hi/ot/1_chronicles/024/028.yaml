  text: 'For Mahli: Eleazar[a], and he had no sons.'
translation:
  language: hi
  text: 'महली के विषय में: एलीआज़ार[a]; और उसके कोई पुत्र नहीं थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “महली के लिए: एलीआज़ार; और उसके कोई पुत्र नहीं थे।” आरंभिक संबंधबोधक उपसर्ग संभवतः सूची के शीर्षक अथवा विषय-सूचक का काम करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלִי
  choice: महली के लिए
  rationale: उपसर्ग לְ यहाँ वंशावली की सूची में शीर्षक अथवा विषय-सूचक के रूप में प्रयुक्त जान पड़ता है। ‘महली के लिए’ सूची की संरचना को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֶלְעָזָר
  choice: एलीआज़ार
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित ध्वन्यंतरण।
- source_word: וְלֹא הָיָה לוֹ
  choice: और उसके कोई ... नहीं थे
  rationale: इब्रानी का शाब्दिक मुहावरा ‘उसके लिए नहीं था’ हिन्दी में स्वाभाविक रूप से ‘उसके कोई ... नहीं थे’ होता है। וְ को साधारण ‘और’ रखा गया है, ताकि मूल में निहित न होने वाला विरोध न जोड़ा जाए।
- source_word: בָּנִים
  choice: पुत्र
  rationale: בָּנִים यहाँ वंशावली के संदर्भ में विशेष रूप से पुरुष संतानों को दर्शाता है; इसलिए सामान्य ‘संतान’ के बजाय ‘पुत्र’ रखा गया है।
