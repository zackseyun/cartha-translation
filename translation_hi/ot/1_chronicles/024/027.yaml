  register: आधुनिक, गरिमापूर्ण हिंदी में वंशावली-सूची की संक्षिप्त शैली रखी गई है। ‘वंश से’ हिंदी में संबंध स्पष्ट करता है, पर कठिन इब्रानी בְנוֹ को न तो सुधारा गया है, न चुपचाप बहुवचन बनाया गया है; उसकी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
