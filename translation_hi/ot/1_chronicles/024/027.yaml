  text: 'मरारी के पुत्र: याज़ियाहू के—उसका पुत्र, शोहम, जक्कूर और इब्री।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: मरारी के पुत्र
  rationale: वंशावली की सूची में रचनात्मक बहुवचन בְּנֵי का सीधा और प्रचलित अनुवाद ‘पुत्र’ है; यह निकट वंशजों के साथ व्यापक कुल-संबंध को भी समेट सकता है।
- source_word: לְיַעֲזִיָּהוּ
  choice: याजिय्याह के वंश से
  rationale: उपसर्ग לְ यहाँ याजिय्याह से संबद्ध शाखा को सूचित करता है। हिंदी में केवल ‘याजिय्याह के’ अधूरा और अस्पष्ट लगता, इसलिए सूचीगत वंश-संबंध को स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: मसोरेटिक स्वरांकन के अनुसार इसका सीधा अर्थ एकवचन ‘उसका पुत्र’ है। कठिन वाक्य-विन्यास के बावजूद इसे मुख्य पाठ में बनाए रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְשֹׁהַם וְזַכּוּר וְעִבְרִי
  choice: शोहम, जक्कूर और इब्री
  rationale: व्यक्तिवाचक नामों का स्रोत-पाठ के उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; संयोजक וְ को हिंदी सूची की स्वाभाविक शैली में व्यक्त किया गया है।
theological_decisions: []
