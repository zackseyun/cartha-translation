lexical_decisions:
- source_word: לְמַלְכִּיָּה
  choice: मल्कियाह के नाम
  rationale: इस चिट्ठी-वितरण सूची में לְ प्राप्तकर्ता को सूचित करता है। सहज हिन्दी में ‘के नाम’ चिट्ठी द्वारा कार्य-क्रम मिलने का भाव व्यक्त करता है; नाम का लिप्यंतरण इब्रानी रूप के निकट रखा गया है।
- source_word: הַחֲמִישִׁי
  choice: पाँचवीं चिट्ठी
  rationale: निश्चित पद के साथ क्रमवाचक यहाँ संज्ञा के रूप में प्रयुक्त है और संदर्भ में चिट्ठी के क्रम को दर्शाता है; स्पष्ट हिन्दी के लिए ‘चिट्ठी’ जोड़ा गया है।
- source_word: לְמִיָּמִן
  choice: मिय्यामीन के नाम
  rationale: यहाँ भी לְ आवंटन पाने वाले व्यक्ति को सूचित करता है। ‘के नाम’ स्वाभाविक हिन्दी है और मिय्यामीन इब्रानी नाम का निकट लिप्यंतरण है।
- source_word: הַשִּׁשִּׁי
  choice: छठी
  rationale: यह क्रमवाचक पहले पद से आए ‘चिट्ठी’ को समझित रूप में आगे बढ़ाता है और संक्षिप्त मूल संरचना को बनाए रखता है।
