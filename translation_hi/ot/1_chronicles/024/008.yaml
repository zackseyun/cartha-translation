  text: तीसरा हारीम के लिए, चौथा सोरीम के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחָרִם
  choice: हारीम के लिए
  rationale: उपसर्ग לְ इस चिट्ठी द्वारा किए गए क्रम-विभाजन में आवंटन प्रकट करता है; हिंदी में ‘के लिए’ स्वाभाविक है। हारीम व्यक्तिनाम का लिप्यंतरण है।
- source_word: הַשְּׁלִישִׁי
  choice: तीसरा
  rationale: निश्चित ordinal पद इस सूची में निहित ‘भाग/दल’ अथवा ‘चिट्ठी’ के तीसरे क्रम को बताता है; हिब्रू की संक्षिप्त सूची-शैली रखी गई है।
- source_word: לִשְׂעֹרִים
  choice: सोरीम के लिए
  rationale: यहाँ भी לִ आवंटन दर्शाता है। שְׂעֹרִים का नाम-रूप ‘सोरीम’ के रूप में लिप्यंतरित किया गया है।
- source_word: הָרְבִעִי
  choice: चौथा
  rationale: यह निश्चित ordinal पद समानांतर रूप से चौथे क्रम को सूचित करता है; मूल की लघु सूची-रचना सुरक्षित रखी गई है।
