  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְחֵזִיר
  choice: हेज़ीर के लिए
  rationale: उपसर्ग לְ इस चिट्ठी-क्रम में याजकीय दल के नाम पर नियत होने का भाव देता है। हेज़ीर व्यक्ति का नाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: שִׁבְעָה עָשָׂר
  choice: सत्रहवाँ
  rationale: यद्यपि रूप गणनावाचक है, क्रमबद्ध चिट्ठियों के संदर्भ में इसका कार्य क्रमवाचक है।
- source_word: לְהַפִּצֵּץ
  choice: हप्पिस्सेस के लिए
  rationale: यहाँ भी לְ नियतन का भाव देता है। इब्रानी नाम का अर्थानुवाद करने के बजाय उसका लिप्यंतरण किया गया है; व्यंजन-संरचना को दिखाने के लिए 'हप्पिस्सेस' चुना गया है।
- source_word: שְׁמוֹנָה עָשָׂר
  choice: अठारहवाँ
  rationale: क्रमबद्ध सूची में यह संख्या अठारहवीं चिट्ठी या बारी को सूचित करती है, इसलिए क्रमवाचक रूप स्वाभाविक है।
