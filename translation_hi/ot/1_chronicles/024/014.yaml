  text: for Bilgah[a], the fifteenth; for Immer, the sixteenth.
translation:
  language: hi
  text: बिल्गा के लिए पंद्रहवीं पर्ची निकली, और इम्मेर के लिए सोलहवीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/בִלְגָּה
  choice: बिल्गा के लिए
  rationale: उपसर्ग לְ इस याजकीय दल को पर्ची द्वारा हुए आवंटन को सूचित करता है; हिंदी में ‘के लिए’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲמִשָּׁה עָשָׂר
  choice: पंद्रहवीं पर्ची निकली
  rationale: मूल में शाब्दिक रूप से ‘पंद्रह’ है, पर अध्याय के पर्चियों के क्रम में इसका अर्थ क्रमवाचक है। संदर्भ से निहित ‘पर्ची निकली’ जोड़ने पर हिंदी में आशय स्पष्ट और स्वाभाविक होता है।
- source_word: לְ/אִמֵּר
  choice: इम्मेर के लिए
  rationale: यहाँ भी לְ पर्ची द्वारा हुए आवंटन का संकेत देता है; व्यक्तिवाचक नाम को ध्वन्यंतरित किया गया है।
- source_word: שִׁשָּׁה עָשָׂר
  choice: सोलहवीं
  rationale: रूप गणनावाचक ‘सोलह’ है, किंतु क्रमबद्ध पर्चियों की सूची में क्रमवाचक अर्थ अभिप्रेत है; पहले खंड से ‘पर्ची निकली’ यहाँ स्वाभाविक रूप से अध्याहृत है।
