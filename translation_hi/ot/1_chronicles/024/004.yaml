  text: וַ/יִּמָּצְא֣וּ בְֽנֵי אֶלְעָזָ֡ר רַבִּ֞ים לְ/רָאשֵׁ֧י הַ/גְּבָרִ֛ים מִן בְּנֵ֥י אִיתָמָ֖ר וַֽ/יַּחְלְק֑וּ/ם לִ/בְנֵ֨י אֶלְעָזָ֜ר רָאשִׁ֤ים לְ/בֵית אָבוֹת֙ שִׁשָּׁ֣ה עָשָׂ֔ר וְ/לִ/בְנֵ֧י אִיתָמָ֛ר לְ/בֵ֥ית אֲבוֹתָ֖/ם שְׁמוֹנָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/004.yaml
  text: 'The sons of Eleazar were found to be more numerous[a], as heads of the men, than the sons of Ithamar, and they divided them thus: for the sons of Eleazar, sixteen heads of fathers’ houses, and for the sons of Ithamar, according to their fathers’ houses[b], eight.'
translation:
  language: hi
  text: 'एलीआज़ार के पुत्रों में ईतामार के पुत्रों की अपेक्षा प्रधान पुरुषों[a] की संख्या अधिक पाई गई। इसलिए उन्होंने उनका विभाजन इस प्रकार किया: एलीआज़ार के पुत्रों के लिए पितृकुलों[b] के सोलह मुखिया, और ईतामार के पुत्रों के लिए उनके पितृकुलों के अनुसार आठ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘पुरुष’, ‘समर्थ पुरुष’ या ‘वीर पुरुष’ भी हो सकता है; यहाँ प्रसंग पितृकुलों के प्रधान पुरुषों का है।
    reason: lexical_alternative
  - marker: b
    text: ‘पितृकुल’ से आशय पूर्वज के वंश पर आधारित परिवार या कुल से है, जो इस्राएल में एक पारिवारिक और प्रशासनिक इकाई था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּמָּצְאוּ
  choice: पाई गई
  rationale: निफ़अल रूप यहाँ किसी वस्तु को ढूँढ़ लेने के बजाय गणना या जाँच से प्रकट हुई स्थिति को व्यक्त करता है।
- source_word: רַבִּים ... מִן
  choice: की अपेक्षा ... संख्या अधिक
  rationale: संदर्भ में רַבִּים तुलनात्मक है; हिन्दी में तुलना और संख्यात्मक अर्थ को स्वाभाविक रूप से स्पष्ट किया गया है।
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: प्रधान पुरुषों
  rationale: רֹאשׁ नेतृत्व या मुखियापन और גְּבָרִים पुरुषों, समर्थ पुरुषों अथवा वीर पुरुषों को सूचित कर सकता है। याजकीय कुलों के इस प्रसंग में ‘प्रधान पुरुष’ युद्ध-संबंधी अर्थ थोपे बिना नेतृत्व का भाव रखता है।
- source_word: וַיַּחְלְקוּם
  choice: उन्होंने उनका विभाजन किया
  rationale: यह क्रिया याजकीय कुलों को निर्धारित दलों या वर्गों में बाँटने की प्रशासनिक कार्रवाई दर्शाती है।
- source_word: רָאשִׁים
  choice: मुखिया
  rationale: यहाँ शब्द पितृकुलों के प्रमुख व्यक्तियों के लिए है; ‘मुखिया’ आधुनिक हिन्दी में स्वाभाविक और संरचनात्मक अर्थ के अनुकूल है।
- source_word: לְבֵית אָבוֹת / לְבֵית אֲבוֹתָם
  choice: पितृकुलों / उनके पितृकुलों
  rationale: בֵּית אָבוֹת इस्राएल की वंश-आधारित पारिवारिक और प्रशासनिक इकाई है। ‘पितृकुल’ इसे संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: שִׁשָּׁה עָשָׂר ... שְׁמוֹנָה
  choice: सोलह ... आठ
  rationale: ये क्रमशः एलीआज़ार और ईतामार के वंशों में मुखियाओं अथवा विभागों की संख्याएँ हैं।
