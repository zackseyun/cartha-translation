base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/024/002.yaml
  text: But Nadab and Abihu died before their father[a], and they had no sons; so Eleazar and Ithamar served as priests.
translation:
  language: hi
  text: पर नादाब और अबीहू अपने पिता से पहले[a] मर गए, और उनके कोई पुत्र नहीं थे; इसलिए एलिआज़ार और ईतामार ने याजक के रूप में सेवा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पिता की उपस्थिति में।” इब्रानी पदबंध का अर्थ स्थान की दृष्टि से “अपने पिता के सामने” अथवा “अपने पिता की उपस्थिति में,” या समय की दृष्टि से “अपने पिता से पहले,” यानी उनके पिता के जीवनकाल में, हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गए
  rationale: मूल क्रिया מוּת का यह कथात्मक भूतकालीन रूप है; बहुवचन संयुक्त कर्ता नादाब और अबीहू के अनुसार हिन्दी में ‘मर गए’ स्वाभाविक है।
- source_word: לִפְנֵי
  choice: से पहले
  rationale: यहाँ पदबंध का स्वाभाविक अर्थ पिता की मृत्यु से पहले, अर्थात उनके जीवनकाल में, है; स्थानवाचक अर्थ ‘की उपस्थिति में’ भी संभव है, इसलिए उसे पाद-टिप्पणी में रखा गया है।
- source_word: אֲבִיהֶם
  choice: अपने पिता
  rationale: तीसरे पुरुष बहुवचन प्रत्यय नादाब और अबीहू के पिता को दर्शाता है; हिन्दी में कर्ता से संबंध के कारण ‘अपने पिता’ स्वाभाविक और सटीक है।
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: उनके कोई पुत्र नहीं थे
  rationale: בָּנִים विशेष रूप से पुत्रों को सूचित करता है, सामान्यतः बच्चों को नहीं।
- source_word: וַיְכַהֲנוּ
  choice: याजक के रूप में सेवा करने लगे
  rationale: כָּהַן का पिएल रूप याजकीय सेवा करने को व्यक्त करता है; कथानक का क्रम हिन्दी में ‘करने लगे’ से स्पष्ट होता है, बिना इसे केवल स्थिर पद ‘याजक थे’ बनाने के।
- source_word: אֶלְעָזָר וְאִיתָמָר
  choice: एलिआज़ार और ईतामार
  rationale: व्यक्तिनामों का आधुनिक हिन्दी बाइबलीय प्रयोग के अनुरूप देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: לִפְנֵי की कालवाचक अथवा स्थानवाचक व्याख्या
  choice: मुख्य पाठ में ‘अपने पिता से पहले’
  alternative: ‘अपने पिता की उपस्थिति में’
  rationale: इब्रानी पदबंध दोनों अर्थ ग्रहण कर सकता है। मुख्य पाठ संक्षिप्त कालवाचक अर्थ रखता है, जबकि वास्तविक स्थानवाचक संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘याजक के रूप में सेवा’ मूल क्रिया के सक्रिय अर्थ को बनाए रखता है, और पाद-टिप्पणी इब्रानी पदबंध की वास्तविक अस्पष्टता को सुरक्षित रखती है।
