  yaml_path: translation/ot/1_chronicles/024/001.yaml
  text: 'These were the divisions of the sons of Aaron: the sons of Aaron were Nadab and Abihu[a], Eleazar and Ithamar.'
translation:
  language: hi
  text: 'हारून के पुत्रों के दल[a] ये थे: हारून के पुत्र नादाब और अबीहू, एलीआज़ार और ईतामार थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विभाग”; इब्रानी शब्द व्यवस्थित याजकीय समूहों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: हारून के पुत्रों के ... ये थे
  rationale: इब्रानी संयोजक और संबंधसूचक उपसर्ग यहाँ नए खंड का शीर्षक आरंभ करते हैं। हिंदी में इस संरचना से उनका प्रवचनगत कार्य स्वाभाविक रूप में व्यक्त होता है, बिना ऐसा कालसूचक शब्द जोड़े जो मूल में नहीं है।
- source_word: מַחְלְקוֹתָם
  choice: दल
  rationale: यह शब्द व्यवस्थित किए गए समूहों या विभागों को दर्शाता है; आगे के संदर्भ में ये याजकीय सेवा के संगठित दल हैं। ‘दल’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है, जबकि ‘विभाग’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्र
  rationale: रचनात्मक संबंध और मूल के पुरुषवाचक ‘पुत्र’ दोनों को सीधे तथा स्वाभाविक हिंदी में रखा गया है।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिनाम का स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: וַ/אֲבִיהוּא
  choice: और अबीहू
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण करते हुए मूल का संयोजक सुरक्षित रखा गया है।
- source_word: אֶלְעָזָר
  choice: एलीआज़ार
  rationale: व्यक्तिनाम का स्रोत-संगत और हिंदी में पठनीय देवनागरी लिप्यंतरण।
- source_word: וְ/אִיתָמָר
  choice: और ईतामार
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण करते हुए मूल का संयोजक सुरक्षित रखा गया है।
