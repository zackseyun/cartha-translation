  text: And they helped David against the raiding band[a], for all of them were mighty men of valor[c][b], and they became commanders in the army.
translation:
  language: hi
  text: और उन्होंने लुटेरे दल के विरुद्ध दाऊद की सहायता की[a], क्योंकि वे सभी वीर योद्धा थे[b], और वे सेना में सेनानायक बन गए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दल के विरुद्ध” अथवा “सैनिक टुकड़ी के विरुद्ध”; इब्रानी शब्द גְּדוּד किसी सैनिक दल या छापा मारने वाले दल को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “पराक्रमी वीर”; इब्रानी पदबंध גִבּוֹרֵי חַיִל वीर और युद्ध में सक्षम पुरुषों के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: c
    text: या “प्रधान” अथवा “अधिकारी”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמָּה
  choice: और उन्होंने
  rationale: स्वतंत्र सर्वनाम का बल स्पष्ट कर्ता ‘उन्होंने’ से व्यक्त होता है, जबकि וְ को ‘और’ के रूप में रखा गया है।
- source_word: עָזְרוּ עִם דָּוִיד
  choice: दाऊद की सहायता की
  rationale: यद्यपि עִם का सामान्य अर्थ ‘साथ’ है, עזר के साथ आधुनिक हिन्दी में लाभार्थी को ‘की सहायता की’ कहना स्वाभाविक है।
- source_word: עַל הַגְּדוּד
  choice: लुटेरे दल के विरुद्ध
  rationale: גְּדוּד सैनिक दल या छापा मारने वाले दल को सूचित कर सकता है; प्रसंग में ‘लुटेरे दल’ और עַל के लिए ‘के विरुद्ध’ उपयुक्त हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके सामर्थ्य और भूमिका का कारण प्रस्तुत करता है।
- source_word: גִבּוֹרֵי חַיִל
  choice: वीर योद्धा
  rationale: यह प्रचलित इब्रानी सैनिक पदबंध शूरवीर, समर्थ लड़ाकों को दर्शाता है; ‘वीर योद्धा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כֻּלָּם
  choice: वे सभी
  rationale: प्रत्यययुक्त रूप पूरे समूह पर बल देता है, जिसे ‘वे सभी’ स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיִּהְיוּ
  choice: वे ... बन गए
  rationale: कथात्मक क्रम में היה यहाँ परिणामी स्थिति व्यक्त करता है, इसलिए केवल ‘थे’ के बजाय ‘बन गए’ चुना गया है।
- source_word: שָׂרִים
  choice: सेनापति
  rationale: सैनिक संदर्भ में שָׂרִים अधिकारियों या कमांडरों को दर्शाता है; ‘सेनापति’ स्पष्ट और गरिमापूर्ण है।
- source_word: בַּצָּבָא
  choice: सेना में
  rationale: צָבָא यहाँ संगठित सैन्य बल का बोध कराता है, जिसके लिए ‘सेना’ सामान्य आधुनिक हिन्दी शब्द है।
