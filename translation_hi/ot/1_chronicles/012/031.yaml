  text: וּ/מִן בְּנֵ֣י אֶפְרַ֔יִם עֶשְׂרִ֥ים אֶ֖לֶף וּ/שְׁמוֹנֶ֣ה מֵא֑וֹת גִּבּ֣וֹרֵי חַ֔יִל אַנְשֵׁ֥י שֵׁמ֖וֹת לְ/בֵ֥ית אֲבוֹתָֽ/ם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/031.yaml
  text: And from the sons of Ephraim[a], twenty thousand eight hundred mighty men of valor, men of renown according to their fathers’ houses.
translation:
  language: hi
  text: और एप्रैम के वंशजों में से 20,800 पराक्रमी योद्धा थे, जो अपने-अपने पितृकुलों में प्रतिष्ठित पुरुष[क] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: अथवा, ‘नामी’ या ‘जाने-माने पुरुष’; शाब्दिक रूप से, ‘नामों के पुरुष,’ अर्थात् ऐसे पुरुष जो प्रसिद्ध या विशिष्ट थे।
    reason: ‘אַנְשֵׁי שֵׁמוֹת’ के मुहावरेदार अर्थ और उसके शाब्दिक आधार को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וּמִן
  choice: और ... में से
  rationale: संयोजक और संबंधबोधक पद पूर्ववर्ती जनजातीय सूची को आगे बढ़ाते हैं; हिन्दी में यह सूचीगत संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: בְּנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों
  rationale: शाब्दिक अर्थ ‘एप्रैम के पुत्र’ है, पर इस सैन्य और जनजातीय संदर्भ में आशय एप्रैम गोत्र के वंशजों से है; ‘वंशज’ आधुनिक हिन्दी में अर्थ स्पष्ट रखता है।
- source_word: עֶשְׂרִים אֶלֶף וּשְׁמוֹנֶה מֵאוֹת
  choice: 20,800
  rationale: मूल की सटीक संख्या को हिन्दी पाठ में संक्षिप्त और सहज अंक-रूप में रखा गया है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: पराक्रमी योद्धा
  rationale: यह पद शक्ति, वीरता और सैनिक सामर्थ्य को व्यक्त करता है; सैन्य जमावड़े के प्रसंग में ‘पराक्रमी योद्धा’ स्वाभाविक और अर्थपूर्ण है।
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: प्रतिष्ठित पुरुष
  rationale: शाब्दिक रूप ‘नाम वाले पुरुष’ एक मुहावरा है, जिसका आशय जाने-माने या विशिष्ट व्यक्तियों से है; ‘प्रतिष्ठित पुरुष’ सम्मानसूचक भाव व्यक्त करता है।
- source_word: לְבֵית אֲבוֹתָם
  choice: अपने पितृकुलों में
  rationale: यह वाक्यांश पैतृक घरानों या कुलों के आधार पर पहचान को दर्शाता है; ‘पितृकुल’ संक्षिप्त रूप से उसी सामाजिक-वंशीय संरचना को सुरक्षित रखता है।
