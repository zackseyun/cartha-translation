base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/028.yaml
  text: and Jehoiada[a], the leader of Aaron, and with him three thousand seven hundred.
translation:
  language: hi
  text: और यहोयादा, हारून का प्रधान, और उसके साथ तीन हजार सात सौ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהוֹיָדָע
  choice: और यहोयादा
  rationale: आरम्भिक ו को सूची की निरन्तरता दिखाने के लिए ‘और’ से व्यक्त किया गया है; יהוידע नाम का प्रचलित हिन्दी लिप्यंतरण ‘यहोयादा’ रखा गया है।
- source_word: הַ/נָּגִיד
  choice: प्रधान
  rationale: נָגִיד का अर्थ अगुवा, शासक या प्रधान हो सकता है। इस वंशीय-सैनिक सूची में ‘प्रधान’ स्वाभाविक है और राजकुमार होने का अनावश्यक संकेत नहीं देता।
- source_word: לְ/אַהֲרֹן
  choice: हारून के घराने का
  rationale: यहाँ ל affiliation या सम्बन्ध बताता है। केवल ‘हारून का’ हिन्दी में अस्पष्ट लग सकता है, इसलिए प्रसंगानुसार हारूनी याजकीय घराने से सम्बन्ध स्पष्ट किया गया है, जबकि वैकल्पिक शाब्दिक सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וְ/עִמּ/וֹ
  choice: और उसके साथ
  rationale: इब्रानी समन्वय और यहोयादा के साथ आए दल का परिचय दोनों बनाए रखे गए हैं।
- source_word: שְׁלֹשֶׁת אֲלָפִים וּ/שְׁבַע מֵאוֹת
  choice: 3,700 पुरुष
  rationale: संख्या को ठीक रूप में रखा गया है। इस जनगणना-सदृश सूची में गिने गए लोगों का संकेत स्वाभाविक हिन्दी के लिए ‘पुरुष’ से स्पष्ट किया गया है।
theological_decisions:
- issue: לְאַהֲרֹן में सम्बन्ध की प्रकृति
  choice: हारून के घराने का प्रधान
  alternative: हारून के लिए प्रधान / हारून का प्रधान
  rationale: इब्रानी ל सम्बन्ध, प्रतिनिधित्व या हितार्थ अर्थ दे सकता है। निकटवर्ती वंशीय सूची के कारण हारूनी याजकीय घराने से सम्बद्ध प्रधान समझना सर्वाधिक स्वाभाविक है; फिर भी ‘के लिए’ वाली सम्भावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सूची-संगत शैली अपनाई गई है। ‘प्रधान’ सामान्य पाठक के लिए स्पष्ट है; ‘घराने’ से वंशीय-याजकीय सम्बन्ध सहज रूप में व्यक्त होता है।
