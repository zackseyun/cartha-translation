base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/018.yaml
  text: David went out before them and answered and said to them[a], “If you have come to me in peace to help me, my heart will be united with you; but if you have come to betray me to my enemies, though there is no violence in my hands[b], may the God of our fathers see and judge.”
translation:
  language: hi
  text: दाऊद निकलकर उनके सामने आया और उत्तर में उनसे कहा, “यदि तुम शान्ति से मेरी सहायता करने के लिए मेरे पास आए हो, तो मेरा मन तुम्हारे साथ एक हो जाएगा; परन्तु यदि तुम मुझे मेरे शत्रुओं के हवाले करने के लिए मेरे साथ विश्वासघात करने आए हो[a]—यद्यपि मेरे हाथों में हिंसा नहीं है—तो हमारे पूर्वजों का परमेश्वर देखे और न्याय करे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुझे छलने आए हो।” हिब्रू क्रिया कपटपूर्ण छल या विश्वासघात, दोनों को व्यक्त कर सकती है; यहाँ शत्रुओं के हवाले किए जाने का प्रसंग है।
    reason: lexical_alternative
  - marker: b
    text: या “देखे और डाँटे” अथवा “देखे और निर्णय करे।” अन्तिम हिब्रू क्रिया में दोष दिखाने, विवाद का निर्णय करने या न्याय करने का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא ... לִפְנֵיהֶם
  choice: निकलकर उनके सामने गया
  rationale: यह दाऊद के बाहर निकलकर उस दल के सामने जाने की स्थानिक गति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उनसे मिलने’ की अपेक्षा मूल के अधिक निकट है।
- source_word: וַיַּעַן וַיֹּאמֶר
  choice: उनसे कहा
  rationale: हिब्रू का युग्मित कथात्मक सूत्र हिन्दी में शब्दशः ‘उत्तर दिया और कहा’ करने पर अस्वाभाविक लगता है; प्रसंग में ‘कहा’ उसका कार्य स्वाभाविक रूप से पूरा करता है।
- source_word: לְשָׁלוֹם
  choice: शान्ति से
  rationale: यह उनके आने के शान्तिपूर्ण और निष्कपट उद्देश्य को संक्षेप में व्यक्त करता है।
- source_word: לְעָזְרֵנִי
  choice: मेरी सहायता करने के लिए
  rationale: उद्देश्यसूचक क्रियारूप का सीधा और स्पष्ट हिन्दी अनुवाद।
- source_word: יִהְיֶה לִּי עֲלֵיכֶם לֵבָב לְיָחַד
  choice: मेरा मन तुम्हारे साथ एक रहेगा
  rationale: हिब्रू मुहावरा एकचित्त निष्ठा और एकता व्यक्त करता है। ‘मन ... एक रहेगा’ साधारण हिन्दी में अर्थ को स्पष्ट रखते हुए ‘हृदय’ के केवल शारीरिक बोध से बचता है।
- source_word: לְרַמּוֹתַנִי לְצָרַי
  choice: मुझे मेरे शत्रुओं के हाथ सौंपने के लिए मेरे साथ विश्वासघात करने
  rationale: רמה छल या विश्वासघात को सूचित कर सकता है। शत्रुओं की ओर किए जाने वाले इस कपट को ‘विश्वासघात’ व्यक्त करता है; ‘हाथ सौंपने’ से हिन्दी में संबंध स्पष्ट होता है, यद्यपि ‘हाथ’ मूल में प्रत्यक्ष नहीं है।
- source_word: בְּלֹא חָמָס בְּכַפַּי
  choice: जबकि मेरे हाथों ने कोई हिंसा नहीं की है
  rationale: यह दाऊद के निर्दोष होने के दावे को व्यक्त करता और ‘हाथ’ तथा ‘हिंसा’ की मूल छवि बनाए रखता है।
- source_word: אֱלֹהֵי אֲבוֹתֵינוּ
  choice: हमारे पूर्वजों का परमेश्वर
  rationale: ‘पूर्वज’ आधुनिक हिन्दी में स्वाभाविक है और सामूहिक वंशगत-संधीय अभिव्यक्ति को दर्शाता है।
- source_word: יֵרֶא ... וְיוֹכַח
  choice: इसे देखे और न्याय करे
  rationale: शर्त के बाद ये क्रियाएँ दैवी निर्णय की गंभीर अपील के रूप में समझी गई हैं। ‘न्याय करे’ יכח के निर्णयात्मक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी इसकी अर्थ-सीमा सुरक्षित रखती है।
theological_decisions:
- issue: अन्तिम अपील में परमेश्वर की कार्रवाई
  choice: हमारे पूर्वजों का परमेश्वर इसे देखे और न्याय करे
  alternative: हमारे पूर्वजों का परमेश्वर इसे देखे और डाँटे / निर्णय करे; अथवा ‘देखेगा और न्याय करेगा’
  rationale: हिब्रू अपूर्ण क्रियारूप यहाँ भविष्यवाणी की अपेक्षा दैवी न्याय की इच्छा अथवा अपील के रूप में स्वाभाविक हैं। ‘न्याय करे’ न्यायिक प्रसंग के अनुकूल है, पर वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- issue: दाऊद के निर्दोष होने का दावा
  choice: जबकि मेरे हाथों ने कोई हिंसा नहीं की है
  alternative: मेरे हाथों में कोई अन्याय नहीं है
  rationale: मुख्य पाठ חמס का मूल अर्थ ‘हिंसा’ और हाथों की बिंबात्मक भाषा बनाए रखता है; इसे दाऊद की सर्वांगीण पापहीनता का दावा न बनाकर इस सम्भावित विश्वासघात के प्रसंग में निर्दोषता का दावा रहने दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मेरा मन तुम्हारे साथ एक रहेगा’ मूल के एकचित्त जुड़ाव को सहज हिन्दी में व्यक्त करता है। ‘शान्ति’, ‘विश्वासघात’, ‘हिंसा’ और ‘न्याय’ जैसे परिचित शब्द मूल की नैतिक तथा न्यायिक गंभीरता बनाए रखते हैं। सभी पादटिप्पणी चिह्न सम्बद्ध शब्दों के तुरन्त बाद मुख्य पाठ में दिए गए हैं।
