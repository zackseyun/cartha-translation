  text: אֵ֣לֶּה הֵ֗ם אֲשֶׁ֨ר עָבְר֤וּ אֶת הַ/יַּרְדֵּן֙ בַּ/חֹ֣דֶשׁ הָ/רִאשׁ֔וֹן וְ/ה֥וּא מְמַלֵּ֖א עַל כָּל גדיתי/ו וַ/יַּבְרִ֨יחוּ֙ אֶת כָּל הָ֣/עֲמָקִ֔ים לַ/מִּזְרָ֖ח וְ/לַֽ/מַּעֲרָֽב־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/016.yaml
  text: These are the men who crossed the Jordan in the first month[a], when it was overflowing all its banks, and they put to flight all those in the valleys, to the east and to the west.
translation:
  language: hi
  text: ये वे लोग हैं जिन्होंने पहले महीने में यरदन पार किया था, जब यरदन अपने सारे किनारों के ऊपर बह रहा था। उन्होंने पूर्व और पश्चिम, दोनों ओर की घाटियों में रहने वाले सभी लोगों[a] को भगा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘सभी घाटियों’ है; आशय घाटियों में रहने वाले लोगों से है, क्योंकि क्रिया का अर्थ ‘भगा देना’ या ‘भागने पर मजबूर करना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה הֵם
  choice: ये वही लोग हैं
  rationale: यह बलपूर्ण पहचान-सूत्र है। प्रसंग में योद्धाओं का उल्लेख होने के कारण ‘लोग’ स्वाभाविक है, जबकि ‘वही’ इब्रानी के बल को व्यक्त करता है।
- source_word: אֲשֶׁר עָבְרוּ אֶת הַיַּרְדֵּן
  choice: जिन्होंने ... यरदन पार किया था
  rationale: עָבַר का सामान्य अर्थ ‘पार करना’ है; नदी के साथ यही आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने
  rationale: मूल के सामान्य काल-सूचक पद को बिना किसी कैलेंडर-सम्बन्धी अतिरिक्त व्याख्या के सीधे रखा गया है।
- source_word: וְהוּא מְמַלֵּא עַל כָּל גְּדִיתָיו
  choice: जब उसका पानी अपने सभी किनारों के ऊपर बह रहा था
  rationale: वाक्य यरदन की बाढ़ की अवस्था बताता है। ‘उसका पानी’ हिन्दी में कर्ता स्पष्ट करता है और किनारों के ऊपर बहना अतिप्रवाह का स्वाभाविक वर्णन है।
- source_word: וַיַּבְרִיחוּ
  choice: उन्होंने ... भगा दिया
  rationale: ברח के हिफ़ील रूप का कारक अर्थ ‘भागने पर मजबूर करना’ है। ‘भगा दिया’ इसे सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶת כָּל הָעֲמָקִים
  choice: सभी घाटियों के लोगों
  rationale: शाब्दिक पद ‘सभी घाटियों’ है, पर ‘भगा दिया’ का लक्ष्य व्यक्ति होते हैं; इसलिए घाटियों को वहाँ रहने वाले लोगों के लिए प्रयुक्त लक्षणा माना गया है। इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לַמִּזְרָח וְלַמַּעֲרָב
  choice: पूर्व और पश्चिम की ओर की
  rationale: दोनों दिशाओं को घाटियों/उनके निवासियों के विस्तार से जोड़कर रखा गया है। मूल में सम्बन्ध कुछ संक्षिप्त है; हिन्दी पाठ अनावश्यक सैन्य विवरण नहीं जोड़ता।
