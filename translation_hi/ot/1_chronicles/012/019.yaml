base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/019.yaml
  text: And the Spirit clothed Amasai, chief of the Thirty, and he said, “Yours are we, David, and with you, son of Jesse! Peace, peace to you, and peace to your helpers, for your God helps you.” Then David received them and made them chiefs of the troops.
translation:
  language: hi
  text: 'तब आत्मा[a] ने तीस के प्रधान अमासै को वस्त्र की तरह धारण किया, और उसने कहा,


    “हे दाऊद, हम आपके हैं!

    हे यिशै के पुत्र, हम आपके साथ हैं!

    आपको शान्ति मिले, शान्ति मिले,

    और आपके सहायकों को भी शान्ति मिले,[b]

    क्योंकि आपका परमेश्वर आपकी सहायता करता है।”[c]


    तब दाऊद ने उन्हें स्वीकार किया और उन्हें दल के प्रधानों में नियुक्त किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक आत्मा ने अमासै को वस्त्र की तरह धारण किया,” अथवा “आत्मा अमासै पर छा गया।” इब्रानी में शाब्दिक रूप से कहा गया है, “आत्मा ने अमासै को पहन लिया।”
    reason: alternative_reading
  - marker: b
    text: या “और आपकी सहायता करनेवाले को भी शान्ति मिले।” इब्रानी में ‘सहायक’ एकवचन है, पर उसका अर्थ सामूहिक भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “क्योंकि आपके परमेश्वर ने आपकी सहायता की है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ לָבְשָׁה
  choice: आत्मा ने ... को धारण कर लिया
  rationale: लָבַשׁ के वस्त्र पहनने वाले रूपक को बनाए रखते हुए हिन्दी में यह व्यक्त करता है कि आत्मा ने अमासै को मानो वस्त्र की तरह धारण किया। רוּחַ में निश्चित उपपद नहीं है, इसलिए ‘एक आत्मा’ की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: רֹאשׁ הַשְּׁלֹשִׁים
  choice: तीस वीरों के प्रधान
  rationale: रֹאשׁ का अर्थ ‘प्रधान’ है और ‘तीस’ यहाँ एक पहचाने हुए सैनिक समूह का संकेत देता है; ‘वीरों’ से प्रसंग हिन्दी पाठक के लिए स्पष्ट होता है।
- source_word: לְךָ דָוִיד
  choice: हे दाऊद, हम आपके हैं
  rationale: संक्षिप्त, क्रियारहित इब्रानी निष्ठा-वाक्य को स्वाभाविक हिन्दी में व्यक्त करता है और לְךָ पर दिए बल को ‘आपके हैं’ में बनाए रखता है।
- source_word: וְעִמְּךָ בֶן יִשַׁי
  choice: हे यिशै के पुत्र, हम आपके साथ हैं
  rationale: इब्रानी में वाक्य क्रियारहित है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘हम ... हैं’ जोड़ा गया है और पिछले वाक्य के समानान्तर रखा गया है।
- source_word: שָׁלוֹם שָׁלוֹם לְךָ
  choice: आपको शान्ति मिले, शान्ति मिले
  rationale: שָׁלוֹם की emphatic पुनरावृत्ति को हटाने के बजाय हिन्दी में भी दोहराया गया है।
- source_word: וְשָׁלוֹם לְעֹזְרֶךָ
  choice: और आपके सहायकों को भी शान्ति मिले
  rationale: एकवचन कृदन्त को प्रसंगानुसार सामूहिक अर्थ में लिया गया है; शाब्दिक एकवचन सम्भावना पादटिप्पणी में दी गई है।
- source_word: כִּי עֲזָרְךָ אֱלֹהֶיךָ
  choice: क्योंकि आपका परमेश्वर आपकी सहायता करता है
  rationale: पूर्ण क्रिया को प्रसंग में परमेश्वर की निरन्तर सहायता बताने वाले वर्तमान अर्थ में लिया गया है; भूत/पूर्ण अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיְקַבְּלֵם
  choice: उन्हें स्वीकार किया
  rationale: קבל यहाँ आए हुए लोगों को अपने दल में ग्रहण करने या स्वीकार करने का भाव रखता है।
- source_word: וַיִּתְּנֵם בְּרָאשֵׁי הַגְּדוּד
  choice: उन्हें सैनिक दलों का प्रधान नियुक्त कर दिया
  rationale: शाब्दिक ‘उन्हें दल के प्रधानों में रखा’ नियुक्ति का मुहावरा है; हिन्दी में नेतृत्व-पद दिए जाने का भाव स्पष्ट किया गया है।
theological_decisions:
- issue: क्या רוּחַ परमेश्वर के आत्मा को बताता है या किसी आत्मिक प्रेरणा को
  choice: आत्मा
  alternative: एक आत्मा; आत्मा अमासै पर छा गया
  rationale: इतिहासवृत्त में अगुवों को बोलने के लिए मिलने वाली दिव्य सामर्थ्य का प्रसंग परमेश्वर के आत्मा की ओर संकेत करता है, पर इब्रानी में निश्चित उपपद न होने के कारण वैकल्पिक समझ पादटिप्पणी में सुरक्षित रखी गई है।
- issue: लָבַשׁ के वस्त्र-रूपक को बनाए रखना या सामान्य ‘उस पर आया’ कहना
  choice: आत्मा ने अमासै को धारण कर लिया
  alternative: आत्मा अमासै पर उतर आया; आत्मा अमासै पर छा गया
  rationale: मूल पाठ में आत्मा कर्ता है और अमासै को मानो वस्त्र की तरह पहनता है। ‘धारण कर लिया’ इस असामान्य किन्तु सार्थक रूपक को बनाए रखता है, बिना उसे केवल भावनात्मक प्रेरणा में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थक ‘आप’ का प्रयोग किया गया है। काव्यात्मक घोषणा को पंक्तियों में रखा गया है ताकि मूल समानान्तरता और ‘शान्ति’ की पुनरावृत्ति स्पष्ट रहे। ‘धारण कर लिया’ जानबूझकर थोड़ा असामान्य है, क्योंकि वह इब्रानी के वस्त्र-रूपक और उसकी धार्मिक गहनता को बचाता है।
