lexical_decisions:
- source_word: אֶלְעוּזַי
  choice: एलूज़ै
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וִירִימוֹת
  choice: यरीमोत
  rationale: आरंभिक वाव को समुच्चयबोधक मानकर सूची की हिंदी संरचना में समाहित किया गया; नाम को यरीमोत लिप्यंतरित किया गया।
- source_word: וּבְעַלְיָה
  choice: बाल्याह
  rationale: व्यक्तिवाचक नाम का स्रोत-रूप के निकट और हिंदी में सुबोध लिप्यंतरण।
- source_word: וּשְׁמַרְיָהוּ
  choice: शमर्याहू
  rationale: हिब्रू के पूर्ण प्रत्यय -याहू को सुरक्षित रखते हुए नाम का लिप्यंतरण।
- source_word: וּשְׁפַטְיָהוּ
  choice: शपत्याह
  rationale: नाम का स्वाभाविक हिंदी लिप्यंतरण; अंतिम हिब्रू रूप को प्रचलित संक्षिप्त -याह रूप में प्रस्तुत किया गया।
- source_word: הַחֲרִיפִי
  choice: हरीपी
  rationale: निश्चित उपपद सहित कुल अथवा वंश-संबंधी विशेषण; हिंदी में समुदाय-सूचक रूप के रूप में प्रस्तुत।
