lexical_decisions:
- source_word: אֶלְקָנָה
  choice: एलकाना
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: יִשִּׁיָּהוּ
  choice: यिश्शियाह
  rationale: इस पद में प्राप्त हिब्रू नाम-रूप का देवनागरी लिप्यंतरण; आरंभिक व्यंजन और द्वित्व को यथासंभव सुरक्षित रखा गया है।
- source_word: עֲזַרְאֵל
  choice: अजरएल
  rationale: हिब्रू नाम का निकट लिप्यंतरण; अंतिम ईश्वरीय नामांश ‘एल’ को अलग सुनाई देने योग्य रखा गया है।
- source_word: יוֹעֶזֶר
  choice: योएजेर
  rationale: हिब्रू יוֹעֶזֶר का ध्वन्यात्मक देवनागरी रूप; अंग्रेज़ी परंपरा के ‘जो-’ के बजाय मूल के आरंभिक ‘यो-’ को रखा गया है।
- source_word: יָשָׁבְעָם
  choice: याशोबाम
  rationale: इसी पद में प्रमाणित हिब्रू रूप का लिप्यंतरण; अन्य पदों से किसी भिन्न नाम-रूप को नहीं मिलाया गया।
- source_word: הַקָּרְחִים
  choice: कोरहवंशी
  rationale: निश्चित बहुवचन कुल-सूचक रूप का स्वाभाविक हिंदी अनुवाद, जो कोरह से संबंधित वंश या कुल के सदस्यों को दर्शाता है।
