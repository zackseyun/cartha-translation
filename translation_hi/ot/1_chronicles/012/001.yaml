  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֗לֶּה הַ/בָּאִ֤ים אֶל דָּוִיד֙ לְ/צִ֣יקְלַ֔ג ע֣וֹד עָצ֔וּר מִ/פְּנֵ֖י שָׁא֣וּל בֶּן קִ֑ישׁ וְ/הֵ֨מָּה֙ בַּ/גִּבּוֹרִ֔ים עֹזְרֵ֖י הַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/001.yaml
  text: These are the men who came to David at Ziklag while he was still kept back because of Saul son of Kish[a]; and they were among the mighty warriors[b], helpers in war.
translation:
  language: hi
  text: ये वे लोग हैं जो दाऊद के पास सिकलग आए, जब वह कीश के पुत्र शाऊल के कारण अब भी रोका हुआ था[a]; और वे पराक्रमी योद्धाओं[b] में से थे, जो युद्ध में सहायक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रुका हुआ” अथवा “सीमित अवस्था में था।”
    reason: इब्रानी עָצוּר बाधित, रोके गए या सीमित अवस्था में होने का अर्थ दे सकता है; यह आवश्यक रूप से कारावास नहीं बताता।
  - marker: b
    text: या “वीर पुरुषों”; इब्रानी शब्द גִּבּוֹרִים पराक्रमी योद्धाओं या वीरों को दर्शाता है।
    reason: मूल शब्द के पारम्परिक और व्यापक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये वे लोग हैं
  rationale: यह पद एक नई सूची का परिचय देता है। हिन्दी में यह स्वाभाविक है और आरम्भ में ऐसा कालसूचक शब्द नहीं जोड़ता जो इब्रानी में स्पष्ट रूप से नहीं है।
- source_word: הַבָּאִים אֶל דָּוִיד לְצִיקְלַג
  choice: जो दाऊद के पास सिकलग आए
  rationale: कृदन्त को सूची के परिचय में स्वाभाविक सम्बन्धवाचक उपवाक्य बनाया गया है। सिकलग को उस स्थान के रूप में समझा गया है जहाँ वे दाऊद के पास आए।
- source_word: עוֹד עָצוּר
  choice: अब भी रोका हुआ था
  rationale: עוֹד जारी अवस्था को और עָצוּר बाधित या सीमित किए जाने को व्यक्त करता है। यह अनुवाद कैद का अनावश्यक रूप से निश्चित अर्थ लगाए बिना उस अस्पष्टता को बनाए रखता है।
- source_word: מִפְּנֵי שָׁאוּל בֶּן קִישׁ
  choice: कीश के पुत्र शाऊल के कारण
  rationale: מִפְּנֵי यहाँ शाऊल से उत्पन्न बाधा या परिस्थिति का कारण बताता है।
- source_word: בַּגִּבּוֹרִים
  choice: पराक्रमी योद्धाओं में से
  rationale: גִּבּוֹרִים का यहाँ स्पष्ट सैनिक सन्दर्भ है; ‘पराक्रमी योद्धा’ वीरता और युद्ध-कौशल दोनों व्यक्त करता है।
- source_word: עֹזְרֵי הַמִּלְחָמָה
  choice: जो युद्ध में उसके सहायक थे
  rationale: शाब्दिक ‘युद्ध के सहायक’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है। प्रसंग से सहायता पाने वाला दाऊद है, इसलिए ‘उसके’ जोड़ा गया है।
