base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/009.yaml
  text: Some of the Gadites separated themselves to David at the stronghold in the wilderness[a], mighty warriors, men of the army for battle, able to handle shield and spear, whose faces were like the faces of lions[c][b], and who were as swift as gazelles on the mountains.
translation:
  language: hi
  text: गाद के लोगों में से कुछ अपने को अलग करके दाऊद के पास, जंगल के गढ़ में, आ मिले[a]। वे पराक्रमी योद्धा, युद्ध के लिए तैयार सैनिक, और ढाल तथा भाला सँभालने में निपुण थे[b]। उनके मुख सिंहों के मुख जैसे थे, और वे पहाड़ों पर हिरनों जैसे तेज़ थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद के पास, जंगल के गढ़ की ओर, आ मिले।” हिब्रू पूर्वसर्गों के क्रम को गढ़ की ओर गति या गढ़ में पहुँचने—दोनों प्रकार से समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “ढाल और भाला सजानेवाले।” यह अभिव्यक्ति युद्ध के लिए तैयार और हथियार चलाने में कुशल पुरुषों को सूचित करती है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “पहाड़ों पर हिरनों के समान, तेज़ी से चलनेवाले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַגָּדִי
  choice: गादियों में से कुछ लोग
  rationale: מִן और जातिवाचक संज्ञा गाद के गोत्र में से एक समूह को सूचित करते हैं; हिन्दी में यह स्वाभाविक रूप से व्यक्त होता है।
- source_word: נִבְדְּלוּ
  choice: अपने को अलग करके
  rationale: בדל के निफ़अल रूप में अलग होने या अपने को अलग करने का भाव है; यह अनुवाद उस भाव को बिना उद्देश्य जोड़े बनाए रखता है।
- source_word: אֶל דָּוִיד
  choice: दाऊद के पास आ मिले
  rationale: אֶל का मूल अर्थ ‘की ओर/के पास’ है। प्रसंग में दाऊद से जा मिलने का भाव है, इसलिए ‘आ मिले’ स्वाभाविक हिन्दी देता है, पर किसी विशेष राजनीतिक या धार्मिक मंशा को नहीं जोड़ता।
- source_word: לַמְצַד מִדְבָּרָה
  choice: जंगल के गढ़ में
  rationale: מְצַד सुरक्षित गढ़ या दुर्ग है और מִדְבָּרָה जंगल/निर्जन प्रदेश की दिशा या स्थान को सूचित करता है। मुख्य पाठ में आगमन का स्थान दिया गया है; दिशात्मक संभावना पादटिप्पणी में रखी गई है।
- source_word: גִּבֹּרֵי הַחַיִל
  choice: पराक्रमी योद्धा
  rationale: यह प्रचलित सैनिक पदबंध सामर्थ्यवान और शूर लड़ाकों को बताता है; ‘पराक्रमी योद्धा’ आधुनिक, गरिमामय और संक्षिप्त है।
- source_word: אַנְשֵׁי צָבָא לַמִּלְחָמָה
  choice: युद्ध के लिए तैयार सैनिक
  rationale: पदबंध उनकी सैनिक पहचान और युद्ध-तत्परता पर बल देता है। हिन्दी में शाब्दिक ‘युद्ध के लिए सेना के पुरुष’ की अपेक्षा यह अधिक स्वाभाविक है।
- source_word: עֹרְכֵי צִנָּה וָרֹמַח
  choice: ढाल तथा भाला सँभालने में निपुण
  rationale: ערך का शाब्दिक भाव व्यवस्थित करने या युद्ध के लिए प्रस्तुत करने का है; सैनिक प्रसंग में यह हथियारों के कुशल प्रयोग और तत्परता को व्यक्त करता है। शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: וּפְנֵי אַרְיֵה פְּנֵיהֶם
  choice: उनके मुख सिंहों के मुख जैसे थे
  rationale: हिब्रू में ‘मुख’ की पुनरावृत्ति और उपमा दोनों हैं; हिन्दी रूप दोनों को बनाए रखता है और उनके भयप्रद, साहसी रूप को बिना अतिरिक्त व्याख्या के प्रस्तुत करता है।
- source_word: וְכִצְבָאִים עַל הֶהָרִים לְמַהֵר
  choice: वे पहाड़ों पर चिकारे जैसे तेज़ थे
  rationale: צְבָאִים चिकारे/गज़ेलों को और לְמַהֵר तेज़ी को व्यक्त करता है। हिन्दी में तुलना और गति दोनों स्पष्ट तथा स्वाभाविक रूप से रखे गए हैं।
