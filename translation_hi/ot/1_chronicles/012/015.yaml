source:
  edition: WLC
  text: אֵ֥לֶּה מִ/בְּנֵי גָ֖ד רָאשֵׁ֣י הַ/צָּבָ֑א אֶחָ֤ד לְ/מֵאָה֙ הַ/קָּטָ֔ן וְ/הַ/גָּד֖וֹל לְ/אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/015.yaml
  text: These were from the sons of Gad[a], heads of the army; the least was for a hundred, and the greatest for a thousand.
translation:
  language: hi
  text: ये गाद के वंशजों में से थे और सेना के प्रधान थे। उनमें सबसे छोटा भी सौ का सामना कर सकता था, और सबसे बड़ा हज़ार का।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी का अधिक शाब्दिक रूप है, “सबसे छोटा एक सौ के लिए, और सबसे बड़ा एक हज़ार के लिए।” यह संक्षिप्त कथन सम्भवतः उनकी युद्ध-क्षमता बताता है; इसे क्रमशः सौ और हज़ार सैनिकों का नेतृत्व करने के अर्थ में भी समझा गया है।
    reason: मूल वाक्यांश संक्षिप्त है और ‘सौ’ तथा ‘हज़ार’ के साथ सम्बन्ध को स्पष्ट नहीं करता; पादटिप्पणी शाब्दिक रूप और प्रमुख वैकल्पिक समझ सुरक्षित रखती है।
lexical_decisions:
- source_word: אֵלֶּה מִבְּנֵי גָד
  choice: ये गाद के वंशज थे
  rationale: इब्रानी का शाब्दिक अर्थ ‘ये गाद के पुत्रों में से थे’ है। आधुनिक हिन्दी में ‘गाद के वंशज’ वही गोत्रीय आशय स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: רָאשֵׁי הַצָּבָא
  choice: सेना के प्रधान
  rationale: רָאשֵׁי का मूल बिंब ‘सिर’ है, पर यहाँ इसका अर्थ मुखिया या प्रमुख है। ‘प्रधान’ सैन्य नेतृत्व सूचित करता है और अनावश्यक रूप से कोई विशिष्ट पद नहीं जोड़ता।
- source_word: הַקָּטָן
  choice: सबसे छोटा
  rationale: यह आकार के बजाय तुलनात्मक पद, सामर्थ्य या महत्त्व में सबसे कम व्यक्ति को सूचित कर सकता है। ‘सबसे छोटा’ मूल शब्द के निकट है और सन्दर्भ में स्वाभाविक है।
- source_word: אֶחָד לְמֵאָה ... וְהַגָּדוֹל לְאָלֶף
  choice: सबसे छोटा भी सौ योद्धाओं का सामना कर सकता था, और सबसे बड़ा हज़ार का
  rationale: इब्रानी कथन अत्यन्त संक्षिप्त है—शाब्दिक रूप से ‘छोटा एक सौ के लिए और बड़ा एक हज़ार के लिए।’ प्रसंग इसे युद्ध-सामर्थ्य का मुहावरा समझने का समर्थन करता है; ‘सामना कर सकता था’ साधारण हिन्दी में आशय खोलता है, जबकि पादटिप्पणी शाब्दिक रूप और दूसरी सम्भावना सुरक्षित रखती है।
theological_decisions:
- issue: एक सौ और एक हज़ार से सम्बन्धित संक्षिप्त इब्रानी अनुपात का अर्थ
  choice: इसे व्यक्तिगत युद्ध-सामर्थ्य के रूप में मुख्य पाठ में व्यक्त किया गया है
  alternative: यह उनके क्रमशः सौ और हज़ार सैनिकों पर अधिकारी होने का संकेत भी समझा जा सकता है
  rationale: निकटवर्ती वर्णन इन गादी योद्धाओं की असाधारण वीरता पर बल देता है, इसलिए युद्ध-सामर्थ्य मुख्य पाठ के लिए उपयुक्त है। फिर भी इब्रानी व्याकरण स्वयं सम्बन्ध को स्पष्ट नहीं करता; अतः नेतृत्व-संरचना की सम्भावना को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वंशज’ गोत्रीय सम्बन्ध को स्पष्ट करता है, ‘सेना के प्रधान’ मूल सैन्य उपाधि के निकट रहता है, और ‘योद्धाओं’ शब्द संख्या के निहित सैन्य सन्दर्भ को स्पष्ट करता है।
