source:
  edition: WLC
  text: בְּ/לֶכְתּ֣/וֹ אֶל צִֽיקְלַ֗ג נָפְל֣וּ עָלָ֣י/ו מִֽ/מְּנַשֶּׁ֡ה עַ֠דְנַח וְ/יוֹזָבָ֤ד וִ/ידִֽיעֲאֵל֙ וּ/מִיכָאֵ֣ל וְ/יוֹזָבָ֔ד וֶ/אֱלִיה֖וּא וְ/צִלְּתָ֑י רָאשֵׁ֥י הָ/אֲלָפִ֖ים אֲשֶׁ֥ר לִ/מְנַשֶּֽׁה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/021.yaml
  text: 'As he went to Ziklag[a], some from Manasseh defected to him: Adnah, Jozabad, Jediael, Michael, another Jozabad, Elihu, and Zillethai[c][b], chiefs of the thousands that belonged to Manasseh.'
translation:
  language: hi
  text: 'जब वह सिकलग जा रहा था, तब मनश्शे के कुछ लोग उसका पक्ष लेने उसके पास आ गए[a]: अदनह, योजाबाद, यदीएल, मीकाएल, एक और योजाबाद[b], एलीहू और सिल्लतै। वे मनश्शे के हजारों के प्रधान थे[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उस पर आ गिरे’; यह मुहावरा दाऊद के पक्ष में चले आने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: मूल इब्रानी सूची में ‘योजाबाद’ नाम दो बार आया है; ये एक ही नाम वाले दो अलग व्यक्ति हैं।
    reason: cultural_note
  - marker: c
    text: ‘हजारों के प्रधान’ से सैन्य टुकड़ियों के अधिकारी या मनश्शे की वंशीय इकाइयों के मुखिया अभिप्रेत हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתּוֹ
  choice: जब वह ... जा रहा था
  rationale: בְּ + infinitive construct यहाँ समय-सूचक है। यह रूप स्वाभाविक हिन्दी में चलते हुए घटित घटना को व्यक्त करता है।
- source_word: אֶל צִיקְלַג
  choice: सिकलग जा रहा था
  rationale: אֶל गंतव्य की ओर गति दर्शाता है; हिन्दी में ‘सिकलग जा रहा था’ सहज और पर्याप्त है।
- source_word: נָפְלוּ עָלָיו
  choice: उसका पक्ष लेने उसके पास आ गए
  rationale: शाब्दिक अर्थ ‘उस पर/उसके पास गिर पड़े’ है, पर सैन्य-राजनीतिक संदर्भ में यह किसी के पक्ष में चले आने का मुहावरा है। चुना हुआ रूप निष्ठा-परिवर्तन और उसके पास आने, दोनों भावों को स्पष्ट करता है।
- source_word: מִמְּנַשֶּׁה
  choice: मनश्शे के कुछ लोग
  rationale: यह मनश्शे से जनजातीय संबंध बताता है। हिन्दी में संदर्भानुसार ‘के कुछ लोग’ स्वाभाविक है; ‘कुछ’ बहुवचन व्यक्तियों की अनिश्चित संख्या को स्पष्ट करता है।
- source_word: עַדְנַח וְיוֹזָבָד וִידִיעֲאֵל וּמִיכָאֵל וְיוֹזָבָד וֶאֱלִיהוּא וְצִלְּתָי
  choice: अदनह, योजाबाद, यदीएल, मीकाएल, एक और योजाबाद, एलीहू और सिल्लतै
  rationale: नामों का हिन्दी लिप्यंतरण किया गया है। मूल पाठ में योजाबाद दो बार है; ‘एक और’ दोनों अलग व्यक्तियों को पाठक के लिए स्पष्ट करता है, बिना पाठ में संशोधन किए।
- source_word: רָאשֵׁי הָאֲלָפִים
  choice: हजारों के प्रधान
  rationale: यह मूल अभिव्यक्ति को निकटता से सुरक्षित रखता है। אֲלָפִים का आशय हजार-सदस्यीय सैन्य टुकड़ियाँ अथवा वंशीय इकाइयाँ हो सकता है, इसलिए मुख्य पाठ में इसे अनिर्णीत रखा गया है।
- source_word: אֲשֶׁר לִמְנַשֶּׁה
  choice: वे मनश्शे के ... थे
  rationale: संबंधवाचक वाक्यांश इन प्रधानों का मनश्शे से संगठनात्मक या जनजातीय संबंध बताता है। हिन्दी में अलग वाक्य के रूप में यह अधिक स्वाभाविक है।
