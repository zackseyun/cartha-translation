- source_word: יִרְמְיָהוּ
  choice: यिर्मयाह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबल-परंपरा और मूल उच्चारण के अनुरूप लिप्यंतरण।
- source_word: הָעֲשִׂירִי
  choice: दसवाँ
  rationale: निश्चित पदक्रमवाचक विशेषण; नामों की सूची में व्यक्ति का क्रम बताता है। हिन्दी में पृथक निश्चित उपपद की आवश्यकता नहीं है।
- source_word: מַכְבַּנַּי
  choice: मकबन्नै
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट लिप्यंतरण।
- source_word: עַשְׁתֵּי עָשָׂר
  choice: ग्यारहवाँ
  rationale: शाब्दिक रूप से यह संख्या ‘ग्यारह’ है, पर समानांतर सूची-संरचना में इसका कार्य क्रमसूचक है; स्वाभाविक हिन्दी में ‘ग्यारहवाँ’ अभिप्रेत अर्थ स्पष्ट करता है।
