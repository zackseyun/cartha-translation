  text: And from the half-tribe of Manasseh[a], eighteen thousand, who were designated by name, came to make David king.
translation:
  language: hi
  text: और मनश्शे के आधे गोत्र में से अठारह हज़ार लोग आए, जिन्हें नाम से चिन्हित किया गया था, ताकि वे दाऊद को राजा बनाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מֵ/חֲצִי מַטֵּה מְנַשֶּׁה
  choice: और मनश्शे के आधे गोत्र में से
  rationale: संयोजक और संबंधसूचक उपसर्गों को स्पष्ट रखा गया है। इस जनजातीय और सैनिक प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है, और חֲצִי के साथ पूरा पद ‘आधा गोत्र’ बनता है।
- source_word: שְׁמוֹנָה עָשָׂר אָלֶף
  choice: अठारह हज़ार पुरुष
  rationale: संख्या का सीधा अनुवाद है; हिन्दी में गिने जा रहे लोगों को स्पष्ट करने के लिए ‘पुरुष’ जोड़ा गया है, जो प्रसंग से निहित है।
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: जिन्हें नाम लेकर ठहराया गया था
  rationale: נקב के निफ़अल रूप की कर्मवाच्य शक्ति और בְּשֵׁמוֹת की व्यक्तिगत नामांकन की भावना दोनों सुरक्षित हैं। ‘ठहराया गया’ किसी विशिष्ट प्रशासनिक प्रक्रिया को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לָבוֹא לְהַמְלִיךְ אֶת דָּוִיד
  choice: कि वे आकर दाऊद को राजा बनाएँ
  rationale: दोनों उद्देश्यसूचक क्रियारूपों का संबंध बनाए रखते हुए स्वाभाविक हिन्दी दी गई है। הַמְלִיךְ के हिफ़इल अर्थ को ‘राजा बनाएँ’ कहा गया है, न कि अधिक संकीर्ण रस्मी अर्थ वाले ‘राज्याभिषेक करें’ से।
