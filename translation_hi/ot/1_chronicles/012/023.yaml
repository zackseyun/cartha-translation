base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/023.yaml
  text: For day by day they came to David to help him[a], until there was a great camp, like the camp of God.
translation:
  language: hi
  text: क्योंकि वे दिन-प्रतिदिन दाऊद के पास उसकी सहायता करने आते रहे, यहाँ तक कि एक बड़ी छावनी बन गई—परमेश्वर की छावनी के समान[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की छावनी जैसी,” अथवा “किसी दिव्य या स्वर्गीय छावनी के समान।” इब्रानी अभिव्यक्ति संक्षिप्त और प्रभावपूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के वर्णन से जुड़ा हुआ व्याख्यात्मक कथन प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעֶת יוֹם בְּיוֹם
  choice: दिन-प्रतिदिन
  rationale: यह पदबंध लगातार कई दिनों तक दोहराई जाती क्रिया को व्यक्त करता है।
- source_word: יָבֹאוּ
  choice: आते रहे
  rationale: कथात्मक संदर्भ में अपूर्ण क्रिया बार-बार होने वाली भूतकालीन क्रिया बताती है; ‘आते रहे’ उस पुनरावृत्ति को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: עַל דָּוִיד
  choice: दाऊद के पास
  rationale: आने की क्रिया और सहायता के उद्देश्य के साथ עַל यहाँ दाऊद की ओर गति बताता है, विरोध नहीं।
- source_word: לְעָזְרוֹ
  choice: उसकी सहायता करने
  rationale: सर्वनाम-प्रत्यय सहित infinitive construct उद्देश्य व्यक्त करता है।
- source_word: עַד לְמַחֲנֶה גָדוֹל
  choice: यहाँ तक कि एक बड़ी छावनी बन गई
  rationale: עַד जारी आगमन के परिणाम की सीमा बताता है। ‘बन गई’ मूल में निहित परिणाम को हिन्दी में पूर्ण वाक्य के रूप में व्यक्त करता है; מַחֲנֶה की सैन्य छवि ‘छावनी’ में बनी रहती है।
- source_word: כְּמַחֲנֵה אֱלֹהִים
  choice: परमेश्वर की छावनी के समान
  rationale: यह अनुवाद इब्रानी संबंध-वाचक संरचना और प्रभावशाली उपमा को बिना उसका आशय सीमित किए सुरक्षित रखता है।
theological_decisions:
- issue: כְּמַחֲנֵה אֱלֹהִים में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: दिव्य / स्वर्गीय
  rationale: सबसे सीधा अर्थ ‘परमेश्वर की छावनी’ है। इसे संज्ञा के रूप में रखना इब्रानी अभिव्यक्ति और उसकी धर्मवैचारिक गूँज को बचाता है, जबकि ‘दिव्य’ या ‘स्वर्गीय’ अर्थ को अधिक निर्धारित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘आते रहे’ पुनरावृत्त क्रिया को और ‘छावनी’ सैन्य संदर्भ को स्पष्ट करता है। मुख्य पाठ में इब्रानी उपमा की अस्पष्टता बनाए रखी गई है।
