  yaml_path: translation/ot/1_chronicles/012/017.yaml
  text: And some of the sons of Benjamin and Judah came to the stronghold[b][a], to David.
translation:
  language: hi
  text: तब बिन्यामीन और यहूदा के वंशजों में से कुछ लोग गढ़ में दाऊद के पास आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא का कथात्मक रूप दाऊद के स्थान की ओर आने को व्यक्त करता है; हिन्दी में ‘आए’ स्वाभाविक है।
- source_word: מִן
  choice: में से कुछ लोग
  rationale: מִן यहाँ अंशवाचक है और बताता है कि दोनों समूहों के केवल कुछ सदस्य आए थे।
- source_word: בְּנֵי בִנְיָמִן וִיהוּדָה
  choice: बिन्यामीन और यहूदा के वंशजों
  rationale: यह रूप जनजातीय सदस्यों को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘यहूदा’ के साथ निहित ‘वंशज’ को भी सामने लाता है।
- source_word: עַד לַמְצָד
  choice: गढ़ में
  rationale: गति के संदर्भ में עַד destination बताता है; हिन्दी में ‘गढ़ में आए’ स्वाभाविक है।
- source_word: הַמְצָד
  choice: गढ़
  rationale: מְצָד किसी सुरक्षित, किलेबंद शरण-स्थान को दर्शाता है; ‘गढ़’ संक्षिप्त, dignified और प्रसंगानुकूल है।
- source_word: לְדָוִיד
  choice: दाऊद के पास
  rationale: לְ यहाँ दाऊद को आगमन का संबंधित लक्ष्य बताता है; ‘दाऊद के पास’ हिन्दी में स्पष्ट है और यह अनावश्यक रूप से नहीं कहता कि गढ़ दाऊद का स्वामित्व था।
