  text: וּ/מִֽ/מְּנַשֶּׁ֞ה נָפְל֣וּ עַל דָּוִ֗יד בְּ/בֹא֨/וֹ עִם פְּלִשְׁתִּ֧ים עַל שָׁא֛וּל לַ/מִּלְחָמָ֖ה וְ/לֹ֣א עֲזָרֻ֑/ם כִּ֣י בְ/עֵצָ֗ה שִׁלְּחֻ֜/הוּ סַרְנֵ֤י פְלִשְׁתִּים֙ לֵ/אמֹ֔ר בְּ/רָאשֵׁ֕י/נוּ יִפּ֖וֹל אֶל אֲדֹנָ֥י/ו שָׁאֽוּל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/020.yaml
  text: Some from Manasseh also defected to David when he came with the Philistines against Saul for battle[a], though they did not help them, because the lords of the Philistines, after taking counsel, sent him away, saying[b], “He may defect to his master Saul at the cost of our heads.”
translation:
  language: hi
  text: मनश्शे के कुछ लोग भी दाऊद से जा मिले[a], जब वह पलिश्तियों के साथ शाऊल से युद्ध करने आया। फिर भी उन्होंने पलिश्तियों की सहायता नहीं की, क्योंकि पलिश्ती सरदारों ने सलाह करके दाऊद को यह कहते हुए वापस भेज दिया, “वह हमारे सिरों की कीमत पर[b] अपने स्वामी शाऊल से जा मिल सकता है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “दाऊद पर आ गिरे”; यह इब्रानी मुहावरा किसी के पक्ष में चले जाने या उससे जा मिलने के अर्थ में है।
    reason: lexical_alternative
  - marker: b
    text: “हमारे सिरों की कीमत पर” का अर्थ है हमारे प्राणों की कीमत पर या हमारे विनाश का कारण बनकर।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמְּנַשֶּׁה
  choice: मनश्शे के कुछ लोग भी
  rationale: मिन उपसर्ग का अंशवाचक भाव संदर्भ में निहित है और अगले पद में व्यक्तियों के नाम आते हैं; ‘भी’ संयोजक वृद्धि को व्यक्त करता है।
- source_word: נָפְלוּ עַל דָּוִיד
  choice: दाऊद के पक्ष में आ गए
  rationale: यह सैन्य-राजनीतिक मुहावरा शाब्दिक रूप से गिरने का नहीं, किसी के पक्ष में चले जाने का अर्थ देता है। ‘पक्ष में आ गए’ स्वाभाविक हिंदी है और आवश्यक अर्थ बनाए रखता है।
- source_word: בְּבֹאוֹ עִם פְּלִשְׁתִּים עַל שָׁאוּל לַמִּלְחָמָה
  choice: जब वह पलिश्तियों के साथ शाऊल से युद्ध करने आया था
  rationale: बे + क्रियारूप समयसूचक है; עִם साथ होने, עַל विरोधी दिशा और לַמִּלְחָמָה युद्ध के उद्देश्य को व्यक्त करता है।
- source_word: וְלֹא עֲזָרֻם
  choice: फिर भी उन्होंने पलिश्तियों की सहायता नहीं की
  rationale: सर्वनाम का निकटतम बहुवचन पूर्वपद पलिश्ती हैं। हिंदी में अस्पष्ट ‘उनकी’ के स्थान पर संज्ञा दोहराने से संदर्भ स्पष्ट रहता है, जबकि मूल आशय नहीं बदलता।
- source_word: כִּי בְעֵצָה
  choice: क्योंकि ... आपस में सलाह करके
  rationale: यह पद विचार-विमर्श या परामर्श के बाद किए गए निर्णय को दर्शाता है।
- source_word: שִׁלְּחֻהוּ
  choice: दाऊद को ... लौटा दिया था
  rationale: पिएल रूप यहाँ साथ जाने से रोककर वापस भेजने या विदा करने का अर्थ देता है; प्रसंग में ‘लौटा दिया’ स्वाभाविक है।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्ती सरदारों
  rationale: सֶרֶן पलिश्ती शासकों की विशिष्ट पदवी है। ‘सरदार’ पदवी और राजनीतिक-सैन्य भूमिका दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: בְּרָאשֵׁינוּ
  choice: हमारे सिरों की कीमत पर
  rationale: शाब्दिक सिर की सजीव छवि को रखते हुए यह मुहावरा उनके प्राणों की कीमत या विनाश के जोखिम को व्यक्त करता है।
- source_word: יִפּוֹל אֶל אֲדֹנָיו שָׁאוּל
  choice: वह ... अपने स्वामी शाऊल के पक्ष में जा मिल सकता है
  rationale: नפל यहाँ पक्ष बदलकर जा मिलने का अर्थ रखता है। अपूर्ण क्रिया आशंका या संभावना व्यक्त कर सकती है; ‘सकता है’ इस भाव को सुरक्षित रखता है। אֲדֹנָיו को राजनीतिक निष्ठा के संदर्भ में ‘अपने स्वामी’ किया गया है।
theological_decisions:
- issue: יִפּוֹל के अपूर्ण रूप का भाव
  choice: जा मिल सकता है
  alternative: जा मिलेगा
  rationale: सीधे कथन में यह रूप आशंकित संभावना या दृढ़ भविष्य दोनों ग्रहण कर सकता है। प्रसंग पलिश्ती सरदारों की आशंका है, इसलिए संभावनार्थक अनुवाद चुना गया, बिना घटना को निश्चित दावा बनाए।
- issue: וְלֹא עֲזָרֻם में कर्म-सर्वनाम का संदर्भ
  choice: पलिश्तियों की सहायता नहीं की
  alternative: उनकी सहायता नहीं की
  rationale: निकटतम और प्रसंगानुकूल बहुवचन संदर्भ पलिश्ती हैं। स्पष्ट संज्ञा हिंदी पाठक के लिए अनावश्यक सर्वनाम-अस्पष्टता दूर करती है; इसका कोई सांप्रदायिक निहितार्थ नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘मनश्शे’, ‘दाऊद’, ‘पलिश्ती’ और ‘शाऊल’ प्रचलित हिंदी बाइबलीय नामरूप हैं। लंबे इब्रानी वाक्य को दो वाक्यों में बाँटा गया है ताकि कारण-संबंध और घटनाक्रम स्पष्ट रहें।
