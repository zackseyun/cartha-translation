  edition: WLC
  text: וַ/יִּהְיוּ שָׁ֤ם עִם דָּוִיד֙ יָמִ֣ים שְׁלוֹשָׁ֔ה אֹכְלִ֖ים וְ/שׁוֹתִ֑ים כִּֽי הֵכִ֥ינוּ לָ/הֶ֖ם אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/040.yaml
  text: They were there with David for three days[a], eating and drinking, because their brothers had prepared for them.
translation:
  language: hi
  text: वे वहाँ दाऊद के साथ तीन दिन रहे और खाते-पीते रहे, क्योंकि उनके भाइयों[a] ने उनके लिए तैयारी कर रखी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कुटुम्बियों” अथवा “उनके संबंधियों।” इब्रानी में शाब्दिक अर्थ “उनके भाई” है, पर इस प्रसंग में यह उनके कुल या गोत्र के दूसरे सदस्यों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ שָׁם
  choice: वे वहाँ ... रहे
  rationale: היה का कथात्मक रूप यहाँ किसी स्थान पर बने रहने या उपस्थित रहने को बताता है; अवधि के साथ हिंदी में “वहाँ ... रहे” स्वाभाविक है।
- source_word: עִם דָּוִיד
  choice: दाऊद के साथ
  rationale: עִם साथ या संगति का सीधा बोध कराता है।
- source_word: יָמִים שְׁלוֹשָׁה
  choice: तीन दिन
  rationale: यह अवधि-सूचक पद है; हिंदी में “रहे” के साथ बिना अतिरिक्त परसर्ग के “तीन दिन” स्वाभाविक है।
- source_word: אֹכְלִים וְשׁוֹתִים
  choice: खाते-पीते रहे
  rationale: दोनों कृदंत तीन दिनों के दौरान जारी गतिविधि बताते हैं; मूल के स्पष्ट “खाना” और “पीना” को “भोज करते रहे” जैसे अधिक व्याख्यात्मक रूप में नहीं बदला गया।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके खाने-पीने का कारण प्रस्तुत करता है।
- source_word: הֵכִינוּ לָהֶם
  choice: उनके लिए तैयारी की थी
  rationale: כון का हिफ़ील रूप तैयार करने का अर्थ देता है; पूर्णभूत रूप यह दिखाता है कि आवश्यक तैयारी पहले ही की जा चुकी थी, जबकि वस्तुओं का स्पष्ट उल्लेख मूल में नहीं है।
- source_word: אֲחֵיהֶם
  choice: उनके भाइयों
  rationale: मूल का शाब्दिक पुल्लिंग संबंधवाचक शब्द सुरक्षित रखा गया है; प्रसंग में इसका अर्थ व्यापक कुल या गोत्र के लोगों से भी हो सकता है।
theological_decisions:
- issue: אֲחֵיהֶם के व्यापक संबंध-सूचक अर्थ की संभावना
  choice: उनके भाइयों
  alternative: उनके कुटुम्बियों / उनके संबंधियों
  rationale: मुख्य पाठ में मूल का प्रत्यक्ष संबंधवाचक शब्द रखा गया है, पर पादटिप्पणी में कुल या गोत्र के साथी सदस्यों को सूचित करने वाला व्यापक अर्थ सुरक्षित किया गया है; इससे पाठ की वास्तविक अर्थ-सीमा अनावश्यक रूप से तय नहीं होती।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। “खाते-पीते रहे” निरंतर क्रिया को स्वाभाविक ढंग से व्यक्त करता है। पादटिप्पणी का चिह्न उसी शब्द के बाद रखा गया है जिससे वह संबंधित है।
