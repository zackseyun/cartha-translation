    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מֵ/אָשֵׁר
  choice: और आशेर में से
  rationale: संयोजक और संबंधसूचक उपसर्गों को स्वाभाविक हिन्दी में व्यक्त किया गया है; आशेर गोत्र का नाम है, इसलिए पाठ में अलग से ‘गोत्र’ जोड़ना आवश्यक नहीं।
- source_word: יוֹצְאֵי צָבָא
  choice: जो सेना में सेवा करने ... निकलते थे
  rationale: यह पदबंध सैन्य अभियान या संगठित सैनिक सेवा के लिए निकलने वालों को दर्शाता है। ‘सेना में सेवा’ צָבָא के कार्यगत अर्थ को स्पष्ट रखता है।
- source_word: לַ/עֲרֹךְ מִלְחָמָה
  choice: युद्ध के लिए पाँत बाँधने
  rationale: ערך का सैन्य अर्थ सैनिकों को युद्ध-विन्यास में व्यवस्थित करना है। ‘पाँत बाँधना’ इस अर्थ को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: אַרְבָּעִים אָלֶף
  choice: चालीस हज़ार
  rationale: मूल संख्या-पद का सीधा और स्वाभाविक अनुवाद।
