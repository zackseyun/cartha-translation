source:
  edition: WLC
  text: כָּל אֵ֜לֶּה אַנְשֵׁ֣י מִלְחָמָה֮ עֹדְרֵ֣י מַעֲרָכָה֒ בְּ/לֵבָ֤ב שָׁלֵם֙ בָּ֣אוּ חֶבְר֔וֹנָ/ה לְ/הַמְלִ֥יךְ אֶת דָּוִ֖יד עַל כָּל יִשְׂרָאֵ֑ל וְ֠/גַם כָּל שֵׁרִ֧ית יִשְׂרָאֵ֛ל לֵ֥ב אֶחָ֖ד לְ/הַמְלִ֥יךְ אֶת דָּוִֽיד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/039.yaml
  text: All these were men of war[a], arrayed for battle, who came to Hebron with a whole heart to make David king over all Israel; and also all the rest of Israel were of one heart to make David king.
translation:
  language: hi
  text: युद्ध के लिए पंक्तिबद्ध ये सभी योद्धा पूरे मन से हेब्रोन आए, ताकि दाऊद को समस्त इस्राएल का राजा बनाएँ। और इस्राएल के बाकी सभी लोग भी दाऊद को राजा बनाने के लिए एक मन थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַנְשֵׁי מִלְחָמָה
  choice: युद्धवीर
  rationale: यह पदबंध शाब्दिक रूप से ‘युद्ध के पुरुष’ है। आधुनिक हिन्दी में ‘युद्धवीर’ सैन्य अर्थ और पुरुष-संदर्भ को स्वाभाविक तथा संक्षिप्त रूप से व्यक्त करता है।
- source_word: עֹדְרֵי מַעֲרָכָה
  choice: युद्ध-पंक्ति बाँधने में निपुण
  rationale: क्रियाविशेषणात्मक कृदन्त युद्ध की पंक्ति या मोर्चा व्यवस्थित करने वालों को दर्शाता है। यह अनुवाद केवल ‘युद्ध के लिए तैयार’ कहने की अपेक्षा गठन और व्यवस्था की बारीकी बचाता है।
- source_word: בְּלֵבָב שָׁלֵם
  choice: पूरे मन से
  rationale: इब्रानी रूपक सम्पूर्ण और अविभाजित अभिप्राय व्यक्त करता है। ‘पूरे मन से’ हिन्दी में स्वाभाविक है और हृदय/मन की छवि को बनाए रखता है।
- source_word: בָּאוּ חֶבְרוֹנָה
  choice: हेब्रोन आए
  rationale: स्थान-नाम पर दिशासूचक प्रत्यय हेब्रोन की ओर गति बताता है; कथा-संदर्भ में ‘हेब्रोन आए’ इसका सहज हिन्दी रूप है।
- source_word: לְהַמְלִיךְ אֶת דָּוִיד
  choice: दाऊद को राजा बनाएँ
  rationale: מלך का हिफ़ील रूप किसी को शासन करने वाला बनाना या राजपद पर स्थापित करना बताता है। ‘राजा बनाएँ’ स्पष्ट है और पाठ में न कही गई राज्याभिषेक-विधि नहीं जोड़ता।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल का
  rationale: राजा बनाए जाने के साथ हिन्दी में ‘सारे इस्राएल का राजा’ राजकीय अधिकार के क्षेत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל שֵׁרִית יִשְׂרָאֵל
  choice: इस्राएल के बाकी सभी लोग
  rationale: שֵׁרִית का मूल अर्थ बचा हुआ भाग भी हो सकता है, पर इस ऐतिहासिक सूची के संदर्भ में आशय पहले उल्लिखित लोगों के अतिरिक्त शेष इस्राएल से है। ‘बाकी सभी लोग’ हिन्दी में स्पष्ट है और अनावश्यक पारिभाषिक धर्मवैज्ञानिक अर्थ से बचता है।
- source_word: לֵב אֶחָד
  choice: एक मन थे
  rationale: शाब्दिक ‘एक हृदय’ एकीकृत इच्छा और उद्देश्य का रूपक है। ‘एक मन थे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसी सामूहिक एकता को व्यक्त करता है।
theological_decisions:
- issue: שֵׁרִית के सम्भावित ‘बचे हुए समुदाय’ संबंधी धर्मवैज्ञानिक अर्थ
  choice: इस्राएल के बाकी सभी लोग
  alternative: इस्राएल का समस्त बचा हुआ समुदाय
  rationale: भविष्यद्वाणी साहित्य में यह शब्द धर्मवैज्ञानिक ‘बचे हुओं’ को सूचित कर सकता है, किन्तु यहाँ राष्ट्रीय समर्थन का ऐतिहासिक सार दिया गया है। इसलिए प्रसंगानुसार ‘बाकी’ उपयुक्त है और कोई तकनीकी धर्मवैज्ञानिक धारणा आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। सैन्य गठन की बारीकी बनाए रखने के लिए ‘युद्ध-पंक्ति बाँधने में निपुण’ कहा गया है; एकनिष्ठता और राष्ट्रीय एकता के लिए क्रमशः ‘पूरे मन से’ और ‘एक मन थे’ रखा गया है।
