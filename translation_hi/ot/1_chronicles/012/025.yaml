  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पुरुष’ को स्पष्टता के लिए जोड़ा गया है, क्योंकि संख्या यहूदा के सैन्य दल के सदस्यों की है। पादटिप्पणी-चिह्न को उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
