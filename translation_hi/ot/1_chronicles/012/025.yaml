  text: From the sons of Judah[a], carrying shield and spear, there were 6,800 equipped for battle.
translation:
  language: hi
  text: यहूदा के वंशजों में से ढाल और भाला धारण किए हुए 6,800 पुरुष युद्ध के लिए सुसज्जित थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध के लिए हथियारबंद।” इब्रानी पदबंध का अर्थ सैन्य युद्ध के लिए सुसज्जित या तैयार पुरुष है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों में से
  rationale: यह पदबंध यहूदा के गोत्र के सदस्यों को सूचित करता है। ‘वंशजों में से’ इब्रानी की वंशगत अभिव्यक्ति और प्रसंग की गोत्रवार सूची—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נֹשְׂאֵי
  choice: उठानेवाले
  rationale: यह कृदन्त सैन्य उपकरण धारण करने या लेकर चलनेवालों का वर्णन करता है; ‘उठानेवाले’ सामान्य और स्पष्ट हिन्दी है।
- source_word: צִנָּה
  choice: ढाल
  rationale: शब्द प्रायः बड़ी ढाल का बोध करा सकता है, पर यहाँ सामान्य ‘ढाल’ पर्याप्त और सहज है।
- source_word: וָרֹמַח
  choice: और भाला
  rationale: רמח भाले अथवा बरछे जैसे शस्त्र को दर्शाता है; ‘भाला’ आधुनिक हिन्दी का सर्वाधिक सहज समतुल्य है।
- source_word: שֵׁשֶׁת אֲלָפִים וּשְׁמוֹנֶה מֵאוֹת
  choice: 6,800
  rationale: इब्रानी संख्या सीधे छह हजार आठ सौ है; अंकों का प्रयोग सैन्य-सूची में स्पष्ट और पठनीय है।
- source_word: חֲלוּצֵי צָבָא
  choice: युद्ध के लिए सुसज्जित
  rationale: सैन्य प्रसंग में यह पद युद्ध के लिए हथियारबंद, तैयार या पंक्तिबद्ध पुरुषों को दर्शाता है। ‘सुसज्जित’ उनकी तैयारी और सैन्य उपकरण, दोनों का स्वाभाविक संकेत देता है।
