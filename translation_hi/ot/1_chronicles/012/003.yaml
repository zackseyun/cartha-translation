base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/003.yaml
  text: The chief was Ahiezer[a], then Joash, the sons of Shemaah the Gibeathite; and Jeziel and Pelet, the sons of Azmaveth[b]; and Beracah and Jehu the Anathothite.
translation:
  language: hi
  text: मुखिया अहीएजेर था, और योआश; ये गिबावासी शमाआ के पुत्र थे। यजीएल[a] और पेलेत अजमावेत के पुत्र थे; और बराखा[b] तथा अनातोतवासी येहू।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यजीएल’ का लिप्यंतरण ‘इजीएल’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बराखा’ का लिप्यंतरण ‘बराका’ भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: मुखिया था
  rationale: इस नामावली में רֹאשׁ का अर्थ शाब्दिक ‘सिर’ नहीं, बल्कि दल का प्रमुख व्यक्ति है। इब्रानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘था’ जोड़ा गया है।
- source_word: אֲחִיעֶזֶר
  choice: अहीएजेर
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וְיוֹאָשׁ
  choice: फिर योआश
  rationale: वाव का मूल अर्थ ‘और’ है; यहाँ प्रमुख के बाद अगले नाम का क्रम स्पष्ट करने के लिए स्वाभाविक हिन्दी ‘फिर’ चुना गया है।
- source_word: בְּנֵי הַשְּׁמָעָה
  choice: शमाआ के पुत्र
  rationale: בְּנֵי मानक वंशावली-संबंध ‘के पुत्र’ व्यक्त करता है; הַשְּׁמָעָה को यहाँ व्यक्तिवाचक नाम माना गया है।
- source_word: הַגִּבְעָתִי
  choice: गिबावासी
  rationale: यह संबंधवाचक विशेषण गिबा नगर से मूल या निवास बताता है; ‘गिबावासी’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: ויזואל
  choice: यजीएल
  rationale: नाम का प्रचलित रूप रखा गया है; आरम्भिक ध्वनि के कारण ‘इजीएल’ लिप्यंतरण भी संभव है, जिसे पादटिप्पणी में दिया गया है।
- source_word: וָפֶלֶט
  choice: और पेलेत
  rationale: व्यक्तिवाचक नाम का सीधा लिप्यंतरण; संयोजक को हिन्दी वाक्य-संरचना में सुरक्षित रखा गया है।
- source_word: בְּנֵי עַזְמָוֶת
  choice: अजमावेत के पुत्र
  rationale: मानक वंशावली-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וּבְרָכָה
  choice: और बराका
  rationale: नाम का हिन्दी बाइबलीय शैली के अनुकूल लिप्यंतरण; ‘बराखा’ अधिक ध्वन्यात्मक विकल्प है।
- source_word: וְיֵהוּא
  choice: तथा येहू
  rationale: व्यक्तिवाचक नाम का स्रोत-निकट लिप्यंतरण; ‘तथा’ नामावली के अंतिम संयोजन को स्पष्ट करता है।
- source_word: הָעֲנְּתֹתִי
  choice: अनातोतवासी
  rationale: संबंधवाचक रूप येहू का अनातोत से संबंध बताता है; इसे केवल निकटवर्ती नाम येहू के साथ रखा गया है।
