  yaml_path: translation/ot/1_chronicles/012/029.yaml
  text: And Zadok[a], a young man mighty in valor[b], and from his father’s house twenty-two commanders.
translation:
  language: hi
  text: और सादोक, एक युवा वीर योद्धा, और उसके पितृकुल के बाईस अधिकारी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צָדוֹק
  choice: सादोक
  rationale: व्यक्तिवाचक नाम को हिन्दी में प्रचलित बाइबलीय रूप के अनुसार लिप्यंतरित किया गया है।
- source_word: נַעַר
  choice: जवान
  rationale: इस सैनिक प्रसंग में यह शब्द युवा पुरुष को सूचित करता है; ‘जवान’ आयु और सैनिक संदर्भ दोनों में स्वाभाविक है।
- source_word: גִּבּוֹר חָיִל
  choice: वीर योद्धा
  rationale: यह पदबंध सामर्थ्य, शौर्य और युद्ध-कौशल को व्यक्त करता है। ‘वीर योद्धा’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: בֵית אָבִיו
  choice: उसका पितृकुल
  rationale: शाब्दिक ‘उसके पिता का घराना’ से आशय पैतृक परिवार या वंश-समूह है; ‘पितृकुल’ स्रोत की सामाजिक धारणा को स्पष्ट रूप में रखता है।
- source_word: שָׂרִים
  choice: प्रधान
  rationale: शब्द नेतृत्व या अधिकार रखने वालों को सूचित करता है। सैनिक संदर्भ में ‘सेनापति’ संभव है, पर ‘प्रधान’ स्रोत की व्यापकता को अधिक सुरक्षित रखता है।
- source_word: עֶשְׂרִים וּשְׁנָיִם
  choice: बाईस
  rationale: मूल संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְ
  choice: और
  rationale: संयोजक इस नामावली को पिछले विवरण से जोड़ता है; पद की सूचीबद्ध संरचना बनाए रखने के लिए ‘और’ रखा गया है।
