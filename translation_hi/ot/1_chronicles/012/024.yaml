source:
  edition: WLC
  text: וְ֠/אֵלֶּה מִסְפְּרֵ֞י רָאשֵׁ֤י הֶֽ/חָלוּץ֙ לַ/צָּבָ֔א בָּ֥אוּ עַל דָּוִ֖יד חֶבְר֑וֹנָ/ה לְ/הָסֵ֞ב מַלְכ֥וּת שָׁא֛וּל אֵלָ֖י/ו כְּ/פִ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/024.yaml
  text: And these are the numbers of the heads of the armed troops for war[a], who came to David at Hebron to turn Saul’s kingdom over to him, according to the word of Yahweh.
translation:
  language: hi
  text: और ये युद्ध के लिए सुसज्जित सैनिकों के प्रधानों की गिनतियाँ हैं, जो हेब्रोन में दाऊद के पास शाऊल की राजसत्ता उसे सौंपने के लिए आए थे, याहवे के वचन के अनुसार।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “याहवे के मुँह के अनुसार”; यह एक इब्रानी मुहावरा है, जिसका अर्थ है “याहवे के वचन के अनुसार” या “जैसा याहवे ने कहा था।”'
    reason: मूल इब्रानी मुहावरे और उसके अर्थ को दिखाना।
lexical_decisions:
- source_word: מִסְפְּרֵי רָאשֵׁי הֶחָלוּץ לַצָּבָא
  choice: युद्ध के लिए तैयार हथियारबंद सैनिकों की संख्या
  rationale: इब्रानी में शाब्दिक रूप से ‘युद्ध के लिए सुसज्जित लोगों के सिरों की गिनतियाँ’ है; यहाँ ‘सिर’ व्यक्तियों की गणना का मुहावरा है। आगे आने वाली सूची अलग-अलग गोत्रों के सैनिकों की संख्या देती है, इसलिए सहज हिन्दी में सामूहिक अर्थ व्यक्त किया गया है।
- source_word: בָּאוּ עַל דָּוִיד חֶבְרוֹנָה
  choice: वे हेब्रोन में दाऊद के पास आए थे
  rationale: यहाँ עַל शत्रुतापूर्वक ‘विरुद्ध’ आने का नहीं, दाऊद के पास आकर उससे जुड़ने का भाव देता है। חֶבְרוֹנָה का दिशासूचक रूप हेब्रोन की ओर आने को बताता है, जिसे हिन्दी में स्थानसूचक ढंग से स्वाभाविक बनाया गया है।
- source_word: לְהָסֵב
  choice: सौंप दें
  rationale: हिफ़ील रूप किसी वस्तु को किसी की ओर फेरने या हस्तांतरित करने का भाव रखता है। ‘सौंप दें’ सत्ता के हस्तांतरण को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: מַלְכוּת שָׁאוּל
  choice: शाऊल की राजसत्ता
  rationale: מַלְכוּת यहाँ केवल भूभाग नहीं, शाऊल का राजकीय शासन या राजत्व भी सूचित कर सकता है। ‘राजसत्ता’ हस्तांतरित किए जाने वाले शासनाधिकार को व्यक्त करती है और ‘राज्य’ की केवल भौगोलिक समझ से बचाती है।
- source_word: כְּפִי יְהוָה
  choice: जैसा यहोवा ने कहा था
  rationale: शाब्दिक अर्थ ‘यहोवा के मुँह के अनुसार’ है। यह दिव्य वचन के अनुरूप होने का इब्रानी मुहावरा है; हिन्दी में ‘जैसा ... ने कहा था’ उसका स्वाभाविक अर्थ देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; उसे सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
theological_decisions:
- issue: מַלְכוּת का अर्थ राज्य या राजसत्ता
  choice: राजसत्ता
  alternative: राज्य
  rationale: प्रसंग दाऊद को शासनाधिकार दिए जाने का है। ‘राजसत्ता’ इस भाव को अधिक ठीक से व्यक्त करती है, यद्यपि ‘राज्य’ भी संभव अनुवाद है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: दोनों रूप मूल चार अक्षरों वाले नाम को प्रस्तुत करने के प्रयास हैं। साधारण आधुनिक हिन्दी पाठकों के लिए अधिक परिचित और प्रतिष्ठित रूप ‘यहोवा’ चुना गया है; इससे किसी संप्रदाय-विशेष का सिद्धांत अभिप्रेत नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। लंबी इब्रानी संरचना को दो हिन्दी वाक्यों में बाँटा गया है। ‘हथियारबंद सैनिक’ सैन्य सामूहिकता को और ‘राजसत्ता’ शासनाधिकार के हस्तांतरण को स्पष्ट करता है।
