  text: They were archers[a], able to use both the right hand and the left in hurling stones and shooting arrows with the bow; they were from Saul’s brothers, from Benjamin.
translation:
  language: hi
  text: वे धनुर्धर थे, जो पत्थर फेंकने और धनुष से तीर चलाने में दाएँ और बाएँ—दोनों हाथों का उपयोग कर सकते थे। वे शाऊल के भाइयों[a] में से, बिन्यामीन के थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “भाइयों”; इब्रानी शब्द सगे भाइयों के अतिरिक्त सम्बन्धियों, कुल के लोगों या एक ही गोत्र के लोगों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
