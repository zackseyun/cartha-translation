  language: hi
  text: और योएला और जबद्याह, यरूहाम के पुत्र, जो गदोर से थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיוֹעֵאלָה
  choice: और योएला
  rationale: संयोजक וְ को ‘और’ तथा व्यक्ति के नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וּזְבַדְיָה
  choice: और जबद्याह
  rationale: संयोजक וּ को ‘और’ के रूप में रखा गया है; זְבַדְיָה का लिप्यंतरण प्रचलित हिन्दी बाइबलीय नाम-रूप ‘जबद्याह’ में किया गया है।
- source_word: בְּנֵי יְרֹחָם
  choice: यरोहाम के पुत्र
  rationale: בְּנֵי का यहाँ सीधा पारिवारिक अर्थ ‘पुत्र’ स्वाभाविक है; יְרֹחָם को ‘यरोहाम’ लिप्यंतरित किया गया है।
- source_word: מִן הַגְּדוֹר
  choice: गदोर के
  rationale: מִן मूल अथवा स्थान-संबंध बताता है। स्वाभाविक हिन्दी वाक्य-विन्यास में ‘गदोर के यरोहाम’ से यरोहाम का गदोर से संबंध व्यक्त होता है, जबकि व्यक्ति स्वयं यरोहाम के पुत्र हैं।
