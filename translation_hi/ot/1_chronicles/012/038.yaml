  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘सैन्य-साज-सामान’ युद्धोपकरण के व्यापक अर्थ को रखता है; संख्या भारतीय अंक-पद्धति के प्रचलित शब्दरूप में दी गई है।
