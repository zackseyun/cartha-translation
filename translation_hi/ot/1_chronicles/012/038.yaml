base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/038.yaml
  text: And from beyond the Jordan[a], from the Reubenites, the Gadites, and the half-tribe of Manasseh, with every kind of military equipment for war, there were one hundred twenty thousand.
translation:
  language: hi
  text: और यरदन के पार से[a], रूबेनियों, गादियों और मनश्शे के आधे गोत्र में से, युद्ध के सभी सैन्य उपकरणों से सुसज्जित एक लाख बीस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरदन के उस पार से।” इब्रानी अभिव्यक्ति भौगोलिक दृष्टिकोण के अनुसार “यरदन की दूसरी ओर से” भी कही जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמֵעֵבֶר לַיַּרְדֵּן
  choice: और यरदन के पार से
  rationale: यह इब्रानी भौगोलिक अभिव्यक्ति यरदन के उस पार के क्षेत्र को सूचित करती है। ‘यरदन के पार से’ आधुनिक हिन्दी में स्वाभाविक है और दृष्टिकोण को अनावश्यक रूप से निश्चित नहीं करती।
- source_word: מִן הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: रूबेनियों, गादियों और मनश्शे के आधे गोत्र में से
  rationale: इब्रानी के एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ रखते हैं; हिन्दी में बहुवचन ‘रूबेनियों’ और ‘गादियों’ से जनसमूह स्पष्ट होता है। ‘मनश्शे के आधे गोत्र’ मूल संरचना को सहज रूप में रखता है।
- source_word: בְּכֹל כְּלֵי צְבָא מִלְחָמָה
  choice: युद्ध के लिए हर प्रकार के सैन्य-साज-सामान से लैस
  rationale: כְּלֵי व्यापक रूप से उपकरण या हथियार दर्शाता है। ‘सैन्य-साज-सामान’ इस व्यापकता को बनाए रखता है, और ‘से लैस’ हिन्दी वाक्य में साथ लाए गए युद्धोपकरण का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵאָה וְעֶשְׂרִים אָלֶף
  choice: एक लाख बीस हज़ार
  rationale: यह 120,000 का आधुनिक मानक हिन्दी संख्यात्मक रूप है।
- source_word: implicit subject with numeral
  choice: पुरुष आए
  rationale: इब्रानी खंड सूचीबद्ध योद्धाओं की संख्या देता है और हिन्दी में पूर्ण, स्वाभाविक वाक्य के लिए कर्ता तथा क्रिया स्पष्ट करना आवश्यक है; प्रसंगानुसार ‘पुरुष आए’ न्यूनतम पूर्ति है।
