base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/033.yaml
  text: 'From the sons of Issachar[a], men who understood the times, to know what Israel should do: their chiefs were two hundred[b], and all their brothers were under their command.'
translation:
  language: hi
  text: इस्साकार के वंशजों में से ऐसे समझदार पुरुष थे, जो समय को पहचानते और जानते थे कि इस्राएल को क्या करना चाहिए। उनके प्रधान दो सौ थे, और उनके सभी भाई उनके निर्देश के अधीन थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह वाक्यांश शाब्दिक रूप से है, “और उनके सभी भाई उनके मुँह के अनुसार थे”; इसका अर्थ है कि वे उनके निर्देश या अधिकार के अधीन थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבְּנֵי יִשָּׂשכָר
  choice: इस्साकार के वंशजों में से
  rationale: מִן और בני यहाँ बड़ी सूची के भीतर इस्साकार गोत्र से आए दल को सूचित करते हैं। ‘वंशजों’ से इब्रानी संबंध स्वाभाविक आधुनिक हिन्दी में बना रहता है।
- source_word: יוֹדְעֵי בִינָה לָעִתִּים
  choice: ऐसे समझदार पुरुष थे, जो समय को पहचानते
  rationale: יוֹדְעֵי בִינָה विवेकपूर्ण समझ रखने वालों को और לָעִתִּים उस ऐतिहासिक अवसर/परिस्थिति को सूचित करता है। यह रूप केवल कालज्ञान नहीं, समय की माँग पहचानने का भाव व्यक्त करता है।
- source_word: לָדַעַת מַה יַעֲשֶׂה יִשְׂרָאֵל
  choice: जानते थे कि इस्राएल को क्या करना चाहिए
  rationale: לָדַעַת उद्देश्य अथवा व्यावहारिक परिणाम बताता है और यַעֲשֶׂה प्रसंग में उचित कार्य की ओर संकेत करता है; ‘क्या करना चाहिए’ भविष्यवाणी के बजाय व्यावहारिक विवेक को बनाए रखता है।
- source_word: רָאשֵׁיהֶם מָאתַיִם
  choice: उनके प्रधान दो सौ थे
  rationale: רָאשֵׁיהֶם का अर्थ यहाँ शाब्दिक ‘सिर’ नहीं, नेतृत्व करने वाले प्रधान हैं। हिन्दी में ‘प्रधान’ सूची के औपचारिक और सामरिक संदर्भ के अनुकूल है।
- source_word: וְכָל אֲחֵיהֶם
  choice: और उनके सभी भाई
  rationale: אֲחֵיהֶם का शाब्दिक अर्थ ‘उनके भाई’ है और यहाँ इससे उसी गोत्र के पुरुष भी अभिप्रेत हो सकते हैं। मुख्य पाठ में निकट शाब्दिक रूप रखा गया है।
- source_word: עַל־פִּיהֶם
  choice: उनके निर्देश के अधीन थे
  rationale: शाब्दिक रूप ‘उनके मुँह के अनुसार’ अधिकारपूर्ण वचन या निर्देशन के अधीन होने का मुहावरा है। ‘निर्देश के अधीन’ अर्थ को स्पष्ट करता है, पर अनावश्यक रूप से कठोर सैन्य ‘आदेश’ नहीं थोपता।
