base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/034.yaml
  text: From Zebulun[a], fifty thousand men fit for military service, prepared for battle with every kind of weapon of war[b], to help without a divided heart.
translation:
  language: hi
  text: जबूलून से पचास हज़ार पुरुष थे, जो सैन्य सेवा के योग्य थे, युद्ध के सभी हथियारों के साथ युद्ध-पंक्ति सजाने वाले थे, और अविभाजित मन से सहायता करने के लिए तैयार थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अविभाजित मन से” का शाब्दिक रूप है, “हृदय और हृदय के बिना”; यह बिना बँटी हुई निष्ठा या दोहरे मन के होने का इब्रानी मुहावरा है। “सहायता करने” के लिए प्रयुक्त इब्रानी क्रिया यहाँ असामान्य है; इसका अर्थ “पंक्ति में सम्मिलित होना” या “समर्थन देना” भी हो सकता है।
    reason: lexical_alternative
