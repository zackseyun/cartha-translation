- source_word: בְּ/כָל כְּלֵי מִלְחָמָה
  choice: युद्ध के सब प्रकार के हथियारों से सुसज्जित
  rationale: כְּלֵי מִלְחָמָה युद्ध के हथियारों या सैन्य उपकरणों को दर्शाता है; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: חֲמִשִּׁים אָלֶף
  choice: पचास हज़ार
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: וְ/לַ/עֲדֹר
  choice: सहायता देने आए
  rationale: यहाँ दुर्लभ क्रिया का आशय साथ जुड़ने, समर्थन देने या सहायता करने से है; संदर्भानुसार सरल अर्थ चुना गया है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: בְּ/לֹא לֵב וָ/לֵב
  choice: एकचित्त होकर
  rationale: शाब्दिक मुहावरा ‘हृदय और हृदय के बिना’ विभाजित निष्ठा के अभाव को व्यक्त करता है; ‘एकचित्त होकर’ आधुनिक हिंदी में यही भाव स्वाभाविक रूप से देता है।
