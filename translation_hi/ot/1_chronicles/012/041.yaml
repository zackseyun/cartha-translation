  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। जनजातीय और स्थान-संबंधी नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। असामान्य ‘मवेशियों पर’ को मूल पाठ के प्रति निष्ठा के कारण बनाए रखा गया है; इसे ‘बैलगाड़ियों पर’ करके स्पष्ट नहीं किया गया, क्योंकि मूल में गाड़ियों का उल्लेख नहीं है।
