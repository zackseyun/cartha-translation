  text: וְ/גַ֣ם הַ/קְּרֽוֹבִים אֲ֠לֵי/הֶם עַד יִשָׂשכָ֨ר וּ/זְבֻל֜וּן וְ/נַפְתָּלִ֗י מְבִיאִ֣ים לֶ֡חֶם בַּ/חֲמוֹרִ֣ים וּ/בַ/גְּמַלִּ֣ים וּ/בַ/פְּרָדִ֣ים וּֽ/בַ/בָּקָ֡ר מַאֲכָ֡ל קֶ֠מַח דְּבֵלִ֨ים וְ/צִמּוּקִ֧ים וְ/יַֽיִן וְ/שֶׁ֛מֶן וּ/בָקָ֥ר וְ/צֹ֖אן לָ/רֹ֑ב כִּ֥י שִׂמְחָ֖ה בְּ/יִשְׂרָאֵֽל־־׀־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/012/041.yaml
  text: 'Also those near them[a], as far as Issachar and Zebulun and Naphtali, were bringing food on donkeys, camels, mules, and cattle: provisions of flour, fig cakes, raisin cakes, wine, oil, cattle, and sheep in abundance[c][b], for there was joy in Israel.'
translation:
  language: hi
  text: 'और उनके निकटवर्ती लोग भी—इस्साकार, जबूलून और नप्ताली तक[a]—गधों, ऊँटों, खच्चरों और मवेशियों पर भोजन लाते रहे: खाद्य-सामग्री अर्थात आटा, अंजीर की टिकियाँ, किशमिश की टिकियाँ[b], दाखरस, तेल, और बड़ी मात्रा में मवेशी और भेड़-बकरियाँ; क्योंकि इस्राएल में आनंद था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहाँ तक कि इस्साकार, जबूलून और नप्ताली तक।” यह वाक्यांश सामान लाने वालों के भौगोलिक विस्तार को बताता है।
    reason: alternative_reading
  - marker: b
    text: या, “किशमिश” अथवा “सूखे अंगूर।” इस प्रसंग में दबाकर बनाई गई किशमिश की टिकियाँ संभावित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: यह पिछले वचन से निरन्तरता और जोड़ का भाव बनाए रखता है तथा हिन्दी में स्वाभाविक है।
- source_word: הַקְּרֹבִים אֲלֵיהֶם
  choice: उनके आस-पास के लोग
  rationale: शाब्दिक अर्थ ‘उनके निकट के लोग’ है; ‘आस-पास’ भौगोलिक निकटता को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल पड़ोसियों तक सीमित किए।
- source_word: עַד יִשָׂשכָר וּזְבֻלוּן וְנַפְתָּלִי
  choice: इस्साकार, जबूलून और नप्ताली तक के लोग
  rationale: עַד भौगोलिक विस्तार की सीमा बताता है। हिन्दी वाक्य-विन्यास में ‘तक के लोग’ आपूर्ति लाने वालों के विस्तार को स्पष्ट करता है।
- source_word: מְבִיאִים
  choice: लाते रहे
  rationale: कृदन्त रूप जारी या बार-बार होने वाली क्रिया का संकेत देता है; ‘लाते रहे’ उस पक्ष को सहज हिन्दी में दर्शाता है।
- source_word: לֶחֶם
  choice: भोजन-सामग्री
  rationale: यद्यपि मूल अर्थ ‘रोटी’ है, आगे विविध खाद्य पदार्थों की सूची है; इसलिए यहाँ इसका व्यापक सामूहिक अर्थ उपयुक्त है।
- source_word: בַּחֲמוֹרִים וּבַגְּמַלִּים וּבַפְּרָדִים וּבַבָּקָר
  choice: गधों, ऊँटों, खच्चरों और मवेशियों पर
  rationale: ב साधन या ढुलाई का माध्यम दर्शाता है। בָּקָר का सामान्य अर्थ मवेशी है, गाड़ियाँ नहीं; इसलिए पाठ की असामान्य परन्तु वास्तविक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: מַאֲכָל
  choice: भोजन-सामग्री
  rationale: यह खाने योग्य आपूर्ति की विस्तृत सूची का परिचय देता है; हिन्दी में यही सैन्य-सामुदायिक रसद के प्रसंग में सहज है।
- source_word: קֶמַח
  choice: मैदा
  rationale: यह बारीक पिसे आटे के लिए प्रयुक्त शब्द है; ‘मैदा’ आधुनिक हिन्दी में उसके भेद को संक्षेप में व्यक्त करता है।
- source_word: דְּבֵלִים
  choice: अंजीर की टिकियाँ
  rationale: यह भंडारण और ढुलाई के लिए दबाकर बनाए गए अंजीर के पिंडों को दर्शाता है; ‘टिकियाँ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: צִמּוּקִים
  choice: किशमिश की टिकियाँ
  rationale: सन्दर्भ में दबाए हुए सूखे अंगूरों की तैयार खाद्य वस्तु सम्भावित है; वैकल्पिक अर्थ ‘किशमिश’ पादटिप्पणी में दिया गया है।
- source_word: יַיִן
  choice: दाखमधु
  rationale: यह יַיִן का प्रतिष्ठित और स्पष्ट हिन्दी बाइबलीय रूप है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: मूल पाठ केवल ‘तेल’ कहता है; जैतून का तेल सम्भावित है, पर उसे स्पष्ट रूप से निर्दिष्ट नहीं किया गया।
- source_word: וּבָקָר וְצֹאן לָרֹב
  choice: बहुत-से गाय-बैल और भेड़-बकरियाँ
  rationale: सामूहिक पशु-वर्गों को साधारण हिन्दी में स्वाभाविक जोड़ों द्वारा व्यक्त किया गया है और לָרֹב की प्रचुरता बनाए रखी गई है।
- source_word: כִּי שִׂמְחָה בְּיִשְׂרָאֵל
  choice: क्योंकि इस्राएल में आनन्द था
  rationale: कारणसूचक כִּי और संक्षिप्त नामवाची वाक्य दोनों को सीधे तथा गरिमापूर्ण ढंग से रखा गया है।
