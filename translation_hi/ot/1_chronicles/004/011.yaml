- source_word: אֲחִֽי שׁוּחָ֖ה
  choice: शूहा के भाई
  rationale: इब्रानी संबंध-संरचना को स्वाभाविक और स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הוֹלִ֣יד
  choice: जन्म दिया
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने का भाव देता है; ‘जन्म दिया’ यहाँ पुरुष कर्ता के साथ प्रचलित बाइबलीय वंशावली अभिव्यक्ति है और पुराने ‘उत्पन्न किया’ से अधिक सहज है।
- source_word: מְחִ֑יר
  choice: महीर
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
- source_word: ה֖וּא
