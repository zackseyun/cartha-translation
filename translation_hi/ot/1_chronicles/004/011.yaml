  rationale: स्वतंत्र सर्वनाम को स्पष्ट रखा गया है; इसका निकटतम पूर्वपद महीर है, इसलिए दूसरी उपवाक्य का कर्ता महीर समझा जाता है।
- source_word: אֲבִ֥י
  choice: पिता
  rationale: मूल अर्थ के सबसे निकट सामान्य पद; वंशावली में संभव व्यापक अर्थ—पूर्वज अथवा संस्थापक—को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶשְׁתּֽוֹן
  choice: एश्तोन
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
