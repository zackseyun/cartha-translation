  rationale: संशोधन केवल हिन्दी की स्वाभाविकता और सामूहिक ‘कुल’ के स्पष्ट निरूपण के लिए है। मूल के संख्यात्मक विवरण, विरोध, और यहूदा के वंशजों के साथ तुलनात्मक सीमा यथावत रखे गए हैं।
