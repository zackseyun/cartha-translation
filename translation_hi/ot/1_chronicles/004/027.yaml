  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/שִׁמְעִ֞י בָּנִ֨ים שִׁשָּׁ֤ה עָשָׂר֙ וּ/בָנ֣וֹת שֵׁ֔שׁ וּ/לְ/אֶחָ֕י/ו אֵ֖ין בָּנִ֣ים רַבִּ֑ים וְ/כֹל֙ מִשְׁפַּחְתָּ֔/ם לֹ֥א הִרְבּ֖וּ עַד בְּנֵ֥י יְהוּדָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/027.yaml
  text: Shimei had sixteen sons and six daughters[a], but his brothers did not have many sons, and all their clans did not multiply as much as the sons of Judah.
translation:
  language: hi
  text: शिमी के सोलह बेटे और छह बेटियाँ थीं, पर उसके भाइयों के बहुत-से बेटे नहीं थे; और उनके पूरे कुल की संख्या यहूदा के वंशजों जितनी नहीं बढ़ी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनका पूरा कुल यहूदा के वंशजों जितना नहीं बढ़ा।”
    reason: עַד और רבה की संयुक्त अभिव्यक्ति को ‘उस स्तर तक न बढ़ना’ अथवा संख्या में उतना न बढ़ना—दोनों निकट अर्थों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וּלְשִׁמְעִי
  choice: शिमी के ... थे
  rationale: वंशावली में לְ के साथ यह रचना अधिकार अथवा संबंध बताती है—‘शिमी के [बेटे-बेटियाँ] थे’; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בָּנִים שִׁשָּׁה עָשָׂר וּבָנוֹת שֵׁשׁ
  choice: सोलह बेटे और छह बेटियाँ
  rationale: संख्याओं और संबंधवाचक संज्ञाओं को हिन्दी के स्वाभाविक क्रम में रखते हुए मूल संख्या और लिंग सुरक्षित रखे गए हैं।
- source_word: וּלְאֶחָיו
  choice: पर उसके भाइयों के
  rationale: וְ का मूल अर्थ ‘और’ है, किंतु यहाँ शिमी की संतानों की संख्या और उसके भाइयों की स्थिति में विरोध है; इसलिए ‘पर’ कथन-संबंध को स्पष्ट करता है।
- source_word: אֵין בָּנִים רַבִּים
  choice: बहुत बेटे नहीं थे
  rationale: निषेधात्मक अस्तित्ववाचक אֵין को स्वाभाविक हिन्दी में अभाव के रूप में व्यक्त किया गया है; ‘बहुत’ רַבִּים की मात्रा को बिना बढ़ाए दर्शाता है।
- source_word: וְכֹל מִשְׁפַּחְתָּם
  choice: उनके सभी कुल भी
  rationale: वंशावली के प्रसंग में מִשְׁפָּחָה आधुनिक एकल ‘परिवार’ से व्यापक नातेदारी-समूह है, इसलिए ‘कुल’ चुना गया है। ‘भी’ वाक्यों के समन्वय को स्वाभाविक बनाता है।
- source_word: לֹא הִרְבּוּ
  choice: जितने नहीं बढ़े
  rationale: רבה के हिफ़ील रूप का यहाँ आशय संख्या में बढ़ने अथवा बहुसंख्य होने से है; ‘बढ़े’ जनसंख्या-संबंधी अर्थ को संक्षेप और सहज रूप में देता है।
- source_word: עַד בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों जितने
  rationale: עַד यहाँ सीमा अथवा परिमाण बताता है—वे यहूदा के वंशजों के संख्यात्मक स्तर तक नहीं पहुँचे। בְּנֵי को वंशावली-संदर्भ में ‘वंशज’ कहना आधुनिक पाठक के लिए स्पष्ट है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। ‘कुल’ व्यापक नातेदारी-समूह को और ‘वंशज’ वंशावली में ‘पुत्रों’ के विस्तृत अर्थ को दर्शाता है।
