  yaml_path: translation/ot/1_chronicles/004/015.yaml
  text: 'And the sons of Caleb son of Jephunneh: Iru[a], Elah, and Naam; and the sons of Elah: Kenaz.'
translation:
  language: hi
  text: 'और यपुन्ने के पुत्र कालेब के पुत्र ये थे: ईरू[a], एला और नाम; और एला के पुत्र: कनज।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक व्यापक अर्थ में, “यपुन्ने के पुत्र कालेब के वंशज।” वंशावलियों में “पुत्र” कभी-कभी परिवार की बाद की पीढ़ियों के लिए भी प्रयुक्त हो सकता है, यद्यपि यहाँ दी गई सीधी सूची “पुत्र” अर्थ का समर्थन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי כָּלֵב
  choice: और ... कालेब के पुत्र ये थे
  rationale: वंशावली के इस प्रसंग में בְּנֵי का सबसे सीधा अर्थ ‘पुत्र’ है। हिंदी में नामों की सूची स्वाभाविक रूप से आरंभ करने के लिए ‘ये थे’ जोड़ा गया है।
- source_word: בֶּן יְפֻנֶּה
  choice: यपुन्ने के पुत्र
  rationale: यह वंशसूचक पद बताता है कि यहाँ किस कालेब का उल्लेख है; हिंदी में इसे नाम से पहले रखना स्वाभाविक है।
- source_word: עִירוּ
  choice: ईरू
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: אֵלָה
  choice: एला
  rationale: प्रसंग और व्याकरण के अनुसार यह व्यक्तिनाम है; इसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וָנָעַם
  choice: और नाम
  rationale: मसोरेटिक स्वरांकन נָעַם को पुल्लिंग व्यक्तिनाम ‘नाम’ के रूप में समर्थन देता है, न कि ‘नामा’।
- source_word: וּבְנֵי אֵלָה
  choice: और एला के पुत्र
  rationale: इब्रानी की दोहराई गई वंशावली-संरचना बनाए रखी गई है; यह एला की उपशाखा का परिचय देती है।
- source_word: וּקְנַז
  choice: कनज
  rationale: इब्रानी व्यक्तिनाम का स्रोत-निकट देवनागरी लिप्यंतरण। आरंभिक וּ संयोजक है, किंतु हिंदी में द्विबिंदु के बाद उसे अलग से व्यक्त करना आवश्यक नहीं।
