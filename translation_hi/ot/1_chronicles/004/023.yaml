  yaml_path: translation/ot/1_chronicles/004/023.yaml
  text: These were the potters and the inhabitants of Netaim and Gederah[a]; they lived there with the king for his work.
translation:
  language: hi
  text: ये कुम्हार और नताईम तथा गदेरा के निवासी थे[a]। वे उसके काम के लिए राजा के साथ वहीं रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “ये कुम्हार और रोपणों तथा बाड़े/घेरे के बीच रहनेवाले लोग थे।” इब्रानी शब्द नताईम और गदेरा को स्थान-नाम या सामान्य संज्ञाओं—दोनों रूपों में पढ़ा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵמָּה
  choice: ये ... थे
  rationale: यह सर्वनाम पिछली वंशावली में बताए गए लोगों की ओर संकेत करता है; हिन्दी में पहचानसूचक निर्वचन के लिए ‘ये ... थे’ स्वाभाविक है।
- source_word: הַיּוֹצְרִים
  choice: कुम्हार
  rationale: יצר से बना यह रूप यहाँ मिट्टी को आकार देने वाले कारीगरों के लिए प्रचलित अर्थ रखता है।
- source_word: וְיֹשְׁבֵי
  choice: और ... के निवासी
  rationale: ישב का कर्तृवाचक रचना-रूप स्थायी निवासियों को सूचित करता है; ‘निवासी’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: נְטָעִים
  choice: नताईम
  rationale: वंशावली और भौगोलिक संदर्भ में इसे स्थान-नाम समझना अधिक संभावित है, यद्यपि इसका सामान्य संज्ञा-अर्थ ‘रोपण/बाग़’ भी हो सकता है।
- source_word: וּגְדֵרָה
  choice: तथा गदेरा
  rationale: नताईम के साथ इसे भी स्थान-नाम माना गया है; सामान्य संज्ञा के रूप में इसका अर्थ ‘दीवार/बाड़ा’ हो सकता है।
- source_word: עִם הַמֶּלֶךְ
  choice: राजा ... के साथ
  rationale: עִם का मूल अर्थ ‘के साथ’ है। संदर्भ राजकीय सेवा का संकेत देता है, पर अनुवाद मूल की व्यापकता बनाए रखता है।
- source_word: בִּמְלַאכְתּוֹ
  choice: उसका काम करने के लिए
  rationale: מְלָאכָה काम, व्यवसाय या सेवा को सूचित कर सकता है; प्रत्यय का निकटतम संदर्भ राजा है। यह हिन्दी वाक्यांश उद्देश्य/राजकीय कार्य का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָשְׁבוּ שָׁם
  choice: वहीं रहते थे
  rationale: ישב और שָׁם मिलकर उस स्थान पर निवास करने का भाव देते हैं; ‘वहीं रहते थे’ आधुनिक हिन्दी में सहज है।
