translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। पद के सूची-सदृश इब्रानी विन्यास को ‘और’ की पुनरावृत्ति द्वारा बनाए रखा गया है; नामों में अंग्रेज़ी की J-परंपरा के बजाय मूल इब्रानी योद के लिए हिन्दी ‘य’ अपनाया गया है।
