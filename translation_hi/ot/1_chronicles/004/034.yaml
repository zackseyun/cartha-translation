  text: and Meshobab[a], and Jamlech, and Joshah son of Amaziah.
translation:
  language: hi
  text: और मशोबाब, और यम्लेक, और अमस्याह का पुत्र योशा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְשׁוֹבָב
  choice: मशोबाब
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: יַמְלֵךְ
  choice: यम्लेक
  rationale: इब्रानी योद को हिन्दी में स्वाभाविक रूप से ‘य’ द्वारा दर्शाते हुए नाम का लिप्यंतरण किया गया है।
- source_word: יוֹשָׁה
  choice: योशा
  rationale: व्यक्तिवाचक नाम का इब्रानी ध्वनि-रूप के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली में संबंध बताने वाला सामान्य पद; हिन्दी में ‘अमस्याह का पुत्र’ स्वाभाविक और स्पष्ट है।
- source_word: אֲמַצְיָה
  choice: अमस्याह
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट और हिन्दी बाइबलीय नाम-शैली के अनुरूप लिप्यंतरण किया गया है।
- source_word: וְ
  choice: और
  rationale: इब्रानी में प्रत्येक नाम से पहले दोहराए गए संयोजक को सूची की संरचना बनाए रखने के लिए सुरक्षित रखा गया है।
