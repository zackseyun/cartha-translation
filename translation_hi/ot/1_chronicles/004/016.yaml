  text: 'And the sons of Jehallelel: Ziph[a], Ziphah, Tiria, and Asarel.'
translation:
  language: hi
  text: 'और यहल्लेलेल के पुत्र: ज़ीफ़, ज़ीफ़ा, तीर्या और असरेल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: वंशावली की पिछली कड़ी से संबंध बनाए रखने के लिए וּ को ‘और’ तथा בְנֵי को संबंधवाचक रचना ‘के पुत्र’ से व्यक्त किया गया है।
- source_word: יְהַלֶּלְאֵל
  choice: यहल्लेलेल
  rationale: इब्रानी व्यक्तिनाम को देवनागरी में ध्वन्यात्मक रूप से लिप्यंतरित किया गया है।
- source_word: זִיף
  choice: जीप
  rationale: इब्रानी זִיף का ध्वन्यात्मक देवनागरी लिप्यंतरण; अंतिम פ यहाँ ‘प’ ध्वनि देता है।
- source_word: וְזִיפָה
  choice: जीपा
  rationale: नाम זִיפָה को उसके दीर्घ अंतिम स्वर सहित देवनागरी में लिप्यंतरित किया गया है; आरंभिक संयोजक को सूची की हिंदी संरचना में व्यक्त किया गया है।
- source_word: תִּירְיָא
  choice: तीरया
  rationale: मसोरेटिक स्वरांकन और व्यंजन-क्रम को ध्यान में रखते हुए नाम का स्वाभाविक देवनागरी लिप्यंतरण किया गया है।
- source_word: וַאֲשַׂרְאֵל
  choice: और असरेल
  rationale: अंतिम नाम से जुड़ा संयोजक ‘और’ रखा गया है तथा אֲשַׂרְאֵל को असरेल लिप्यंतरित किया गया है।
