  text: 'तकोआ के पिता अशहूर की दो पत्नियाँ थीं: हेलाह और नाअराह।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तकोआ के संस्थापक” अथवा “तकोआ के पूर्वज”; वंशावलियों में “पिता” केवल सगा पिता ही नहीं, बल्कि किसी कुल या बस्ती का मूल पुरुष अथवा संस्थापक भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאַשְׁחוּר
  choice: अशहूर की
  rationale: आरंभिक संयोजक और संबंधसूचक उपसर्ग वंशावली की पिछली बात से संबंध जोड़ते हैं; स्वाभाविक हिन्दी वाक्य में संबंध को ‘अशहूर की’ से व्यक्त किया गया है।
- source_word: אֲבִי תְקוֹעַ
  choice: तकोआ के पिता
  rationale: ‘पिता’ मूल शब्द का सीधा और पारदर्शी अनुवाद है; वंशावली में इसका अर्थ पूर्वज या किसी बस्ती/कुल का संस्थापक भी हो सकता है, इसलिए व्यापक संभावना पादटिप्पणी में रखी गई है।
- source_word: הָיוּ שְׁתֵּי נָשִׁים
  choice: दो पत्नियाँ थीं
  rationale: इब्रानी में शाब्दिक रूप से ‘दो स्त्रियाँ थीं’ है, पर इस संबंधसूचक वंशावली प्रसंग में ‘पत्नियाँ’ अर्थ की दृष्टि से स्पष्ट और स्वाभाविक है।
- source_word: חֶלְאָה
  choice: हेलआ
  rationale: व्यक्तिनाम को इब्रानी व्यंजन और स्वररूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְנַעֲרָה
  choice: और नाअरा
  rationale: संयोजक को ‘और’ के रूप में रखा गया है तथा नाम में अलग-अलग सुनाई देने वाले दोनों स्वरों को ‘नाअरा’ से दर्शाया गया है।
