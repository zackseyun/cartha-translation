language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵי֙ אֵ֣שֶׁת הֽוֹדִיָּ֔ה אֲח֣וֹת נַ֔חַם אֲבִ֥י קְעִילָ֖ה הַ/גַּרְמִ֑י וְ/אֶשְׁתְּמֹ֖עַ הַ/מַּעֲכָתִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/019.yaml
  text: And the sons of the wife of Hodiah[a], the sister of Naham[b], were the father of Keilah the Garmite and Eshtemoa the Maacathite.
translation:
  language: hi
  text: 'और होदियाह की पत्नी—जो नहम की बहन थी—के पुत्र थे: कीला गार्मी और एश्तमोआ माकाती के पिता[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावलियों में ‘पिता’ का अर्थ केवल सगा जनक ही नहीं, बल्कि पूर्वज, संस्थापक या कुल-प्रधान भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘पुत्र’ बहुवचन है, पर आगे ‘पिता’ एकवचन आता है। यह संक्षिप्त वंशावली-वाक्य सम्भवतः किसी सीधे पिता-पुत्र क्रम के बजाय कुलगत सम्बन्ध का सार प्रस्तुत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र थे
  rationale: वंशावली में בנים का सामान्य अर्थ ‘पुत्र’ है, यद्यपि कभी-कभी यह व्यापक रूप से वंशजों को भी दर्शा सकता है। यहाँ मूल का बहुवचन सुरक्षित रखा गया है।
- source_word: אֵשֶׁת הוֹדִיָּה
  choice: होदियाह की पत्नी
  rationale: सम्बन्धवाचक रचना को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: אֲחוֹת נַחַם
  choice: जो नहम की बहन थी
  rationale: यह पद होदियाह की पत्नी की पहचान स्पष्ट करता है; डैश के भीतर उपवाक्य हिन्दी में सम्बन्ध को अस्पष्ट होने से बचाता है।
- source_word: אֲבִי
  choice: का पिता
  rationale: मूल के ‘पिता’ को बनाए रखा गया है। वंशावली में यह शब्द जनक के अतिरिक्त पूर्वज, संस्थापक या कुल-प्रधान का अर्थ भी दे सकता है; इस व्यापकता को पादटिप्पणी में बताया गया है।
- source_word: קְעִילָה הַגַּרְמִי
  choice: गार्मी कीला
  rationale: दोनों पदों का लिप्यंतरण किया गया है और हिब्रू विशेषण/कुल-सूचक रूप को हिन्दी में नाम से पहले रखा गया है, बिना यह तय किए कि कीला व्यक्ति, कुल या स्थान-संबद्ध नाम है।
- source_word: וְאֶשְׁתְּמֹעַ הַמַּעֲכָתִי
  choice: और माकाती एश्तमोआ
  rationale: संयोजक और दोनों नाम-सूचक पद सुरक्षित रखे गए हैं; माकाती को कुल अथवा जातीय सम्बद्धता बताने वाला विशेषण माना गया है।
theological_decisions:
- issue: बहुवचन ‘पुत्र’ के बाद एकवचन ‘पिता’
  choice: मूल की व्याकरणिक असमानता को पाठ में बनाए रखा गया
  alternative: ‘वंशज’ अथवा ‘कुल-प्रधान’ कहकर वाक्य को समतल करना
  rationale: हिब्रू वंशावली-वाक्य संक्षिप्त और कुछ असामान्य है। इसे चुपचाप सरल बनाने से सम्भावित कुलगत सम्बन्ध की वास्तविक अस्पष्टता मिट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। नामों का देवनागरी लिप्यंतरण किया गया है। डैश से ‘नहम की बहन’ का सम्बन्ध होदियाह की पत्नी से स्पष्ट किया गया है, जबकि मूल की वंशावली-संबंधी असमानता और अर्थगत तनाव सुरक्षित हैं।
