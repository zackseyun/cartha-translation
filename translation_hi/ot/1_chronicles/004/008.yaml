- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली संबंध बताने वाला सामान्य शब्द।
- source_word: הָרֽוּם
  choice: हारूम
  rationale: मसोराई स्वरांकन के अनुसार व्यक्तिनाम का लिप्यंतरण; ‘हाराम’ के बजाय पाठ के u-स्वर को सुरक्षित रखा गया है।
