base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/003.yaml
  text: 'These were the sons of the father of Etam: Jezreel[a], Ishma, and Idbash[b]; and the name of their sister was Hazzelelponi.'
translation:
  language: hi
  text: 'एताम के पिता[a] से संबंधित ये थे: यिज्रेल, यिश्मा और यिदबाश; और उनकी बहन का नाम हत्सलेलपोनी था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “ये एताम के पिता…” है। वंशावली के इस संदर्भ में संबंध का सटीक स्वरूप स्पष्ट नहीं किया गया है। “पिता” का अर्थ पूर्वज अथवा एताम नामक बस्ती या कुल का संस्थापक भी हो सकता है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये थे
  rationale: यह पद वंशावली की एक नई सूचना प्रस्तुत करता है। आरम्भिक וְ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: אֲבִי עֵיטָם
  choice: एताम के पिता
  rationale: इब्रानी construct पदबंध का सीधा अनुवाद है। इतिहास-वृत्तान्तों की वंशावलियों में ‘पिता’ का अर्थ पूर्वज या किसी बस्ती अथवा कुल का संस्थापक भी हो सकता है; इस व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में निकट लिप्यंतरण।
- source_word: וְיִשְׁמָא
  choice: यिश्मा
  rationale: इब्रानी व्यक्तिगत नाम का निकट लिप्यंतरण; आरम्भिक yod को ‘यि’ से दर्शाया गया है।
- source_word: וְיִדְבָּשׁ
  choice: और यिदबाश
  rationale: व्यक्तिगत नाम का लिप्यंतरण और सूची के अंतिम संयोजक को स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְשֵׁם אֲחוֹתָם
  choice: और उनकी बहन का नाम ... था
  rationale: बहुवचन प्रत्यय ‘उनकी’ पहले बताए गए पुरुषों की ओर संकेत करता है; हिन्दी वाक्य-विन्यास स्वाभाविक रखते हुए इब्रानी नामवाचक अभिव्यक्ति का अर्थ सुरक्षित है।
- source_word: הַצְלֶלְפּוֹנִי
  choice: हस्सलेलपोनी
  rationale: स्त्री के इब्रानी नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण; आरम्भिक assimilated article/consonant doubling को ‘स्स’ से दर्शाया गया है।
theological_decisions:
- issue: ‘पुत्र’ शब्द का पाठ में न होना और संबंध की अस्पष्टता
  choice: मुख्य पाठ में ‘पुत्र’ जोड़कर वाक्य का निहित वंशावली-संबंध स्पष्ट किया गया और पादटिप्पणी में मूल की संक्षिप्तता बताई गई।
  alternative: शाब्दिक रूप से ‘ये एताम के पिता थे’ या नामों को बिना किसी व्यक्त संबंध के रखना।
  rationale: אֲבִי एकवचन है, जबकि उसके बाद तीन पुरुषों और ‘उनकी बहन’ का उल्लेख आता है। इसलिए ‘ये एताम के पिता थे’ व्याकरण और प्रसंग दोनों में कठिन है। ‘पुत्र’ निहित मानना वंशावली-सूची को सुबोध बनाता है, पर मूल की वास्तविक अस्पष्टता पादटिप्पणी में खुली रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। नामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है। वंशावली की कठिन इब्रानी रचना को मुख्य पाठ में पठनीय बनाया गया है, जबकि उसकी अनिश्चितता पादटिप्पणी में स्पष्ट रूप से सुरक्षित है।
