  terminology: ‘बाल’ appropriately transliterates the place name. ‘गाँव’ is suitable for חַצְרֵיהֶם in this geographical context, while ‘निवास-स्थान’ adequately represents מוֹשְׁבֹתָם. ‘वंशावली के अनुसार पंजीकरण’ accurately conveys the genealogical sense of the Hitpael of יחס without imposing a specific interpretation of the compressed Hebrew wording.
