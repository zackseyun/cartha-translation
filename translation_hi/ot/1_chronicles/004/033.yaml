    rationale: In ‘उनका वंशावली में पंजीकरण हुआ था,’ the placement of ‘वंशावली में’ is unnatural. Reordering it as ‘वंशावली के अनुसार पंजीकरण’ produces idiomatic Hindi and retains the source’s genealogical-registration sense.
