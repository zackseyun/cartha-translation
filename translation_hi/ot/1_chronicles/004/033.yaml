  source_fidelity: 'The draft preserves all major Hebrew elements: the dependent villages, their location around the listed cities extending to Baal, the resumptive statement about their places of settlement, and genealogical registration. The final clause is more faithfully and idiomatically expressed in Hindi by placing the genealogical qualifier before ‘पंजीकरण’ and using a construction that does not imply an unsupported agent.'
