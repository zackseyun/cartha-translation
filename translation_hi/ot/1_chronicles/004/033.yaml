  text: And all their villages that were around these cities, as far as Baal—these were their settlements, and they had their genealogy recorded.
translation:
  language: hi
  text: और उनके सब गाँव[a], जो इन नगरों के चारों ओर बाल तक थे—ये उनके निवास-स्थान थे, और उनका वंशावली के अनुसार पंजीकरण किया गया था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी छोटी बस्तियाँ’ अथवा ‘उनकी बस्तियाँ।’
    reason: lexical_alternative
  - marker: b
    text: या ‘और उन्होंने वंशावली के अनुसार अपना नाम दर्ज कराया था’; इब्रानी अभिव्यक्ति वंशावली-संबंधी पंजीकरण को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַצְרֵיהֶם
  choice: उनके सब गाँव
  rationale: חָצֵר का अर्थ घेरा या आँगन भी हो सकता है, पर यहाँ नगरों के आसपास बसे आश्रित स्थानों की भौगोलिक सूची में ‘गाँव’ सबसे स्वाभाविक है।
- source_word: אֲשֶׁר סְבִיבוֹת הֶעָרִים הָאֵלֶּה
  choice: जो इन नगरों के चारों ओर ... थे
  rationale: यह संबंधवाचक उपवाक्य पहले बताए गए गाँवों की स्थिति इन नगरों के संबंध में बताता है।
- source_word: עַד בָּעַל
  choice: बाल तक
  rationale: עַד सीमा या विस्तार व्यक्त करता है और בָּעַל यहाँ स्थान-नाम है।
- source_word: זֹאת מוֹשְׁבֹתָם
  choice: ये उनके निवास-स्थान थे
  rationale: यद्यपि זֹאת व्याकरणतः स्त्रीलिंग एकवचन है, यहाँ यह पिछली सूची का सार प्रस्तुत करता है; हिंदी में बहुवचन ‘ये’ स्वाभाविक है। מוֹשָׁב के लिए ‘निवास-स्थान’ उसके रहने या बसने के स्थान के अर्थ को बनाए रखता है।
- source_word: וְהִתְיַחְשָׂם לָהֶם
  choice: और उनका वंशावली में पंजीकरण हुआ था
  rationale: יחש का हित्पएल रूप वंश के अनुसार दर्ज या पंजीकृत किए जाने को सूचित करता है। निष्क्रिय हिंदी रचना संक्षिप्त इब्रानी अभिव्यक्ति को बिना अनावश्यक कर्ता जोड़े व्यक्त करती है।
