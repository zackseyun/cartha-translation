  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शांत’ और ‘सुख-चैन वाली’ इब्रानी के दो निकटार्थक, पर अलग शब्दों को अलग-अलग व्यक्त करते हैं।
