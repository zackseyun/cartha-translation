base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/040.yaml
  text: And they found rich and good pasture[a], and the land was broad, quiet, and peaceful, for those from Ham who had lived there formerly were there before.
translation:
  language: hi
  text: उन्हें हरी-भरी और अच्छी चरागाह मिली। वह भूमि बहुत विस्तृत, शांत और सुख-चैन वाली थी, क्योंकि पहले वहाँ के निवासी हाम के वंशज थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्योंकि पहले वहाँ रहनेवाले हाम में से थे।”
    reason: इब्रानी में ‘वंशज’ के लिए अलग शब्द नहीं है; ‘हाम में से’ वंश अथवा जातीय उद्गम को दर्शाता है।
lexical_decisions:
- source_word: מִרְעֶה
  choice: चरागाह
  rationale: यह संज्ञा पशुओं के चरने की जगह को दर्शाती है; ‘चरागाह’ आधुनिक हिन्दी में स्वाभाविक और संदर्भानुकूल है।
- source_word: שָׁמֵן
  choice: हरी-भरी
  rationale: शाब्दिक अर्थ ‘मोटी’ है, पर चरागाह के संदर्भ में यह उसकी भरपूरी और उर्वरता बताता है; ‘हरी-भरी’ हिन्दी में इसी भाव को सहजता से व्यक्त करता है।
- source_word: טוֹב
  choice: अच्छी
  rationale: यह सामान्य सकारात्मक मूल्यांकन है; ‘अच्छी’ उसके सरल अर्थ को बनाए रखता है।
- source_word: רַחֲבַת יָדַיִם
  choice: बहुत विस्तृत
  rationale: इस इब्रानी मुहावरे का अर्थ पर्याप्त खुली और फैली हुई भूमि है; ‘बहुत विस्तृत’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: שֹׁקֶטֶת
  choice: शांत
  rationale: यह भूमि की उपद्रवरहित और स्थिर दशा को व्यक्त करता है।
- source_word: שְׁלֵוָה
  choice: सुख-चैन वाली
  rationale: यह शब्द निश्चिंतता, सुरक्षा और आराम की दशा बता सकता है; ‘शांत’ के साथ ‘सुख-चैन वाली’ उसके विशिष्ट भाव को बनाए रखता है।
- source_word: כִּי מִן חָם הַיֹּשְׁבִים שָׁם לְפָנִים
  choice: क्योंकि पहले वहाँ के निवासी हाम के वंशज थे
  rationale: वाक्यांश पूर्वकालीन निवासियों को हाम से उत्पन्न लोगों के रूप में पहचानता है। हिन्दी में ‘वंशज’ निहित जातीय वंश-संबंध को स्वाभाविक ढंग से स्पष्ट करता है, जबकि पाद-टिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है।
- source_word: חָם
  choice: हाम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions: []
