    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: वंशावली में בְּנֵי का सीधा और पारंपरिक अर्थ ‘के पुत्र’ है, यद्यपि यह व्यापक अर्थ में वंशजों को भी सूचित कर सकता है; इस लचीलेपन को पादटिप्पणी में रखा गया है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: पूर्वज और गोत्र का व्यक्तिवाचक नाम; प्रचलित मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: פֶּרֶץ
  choice: पेरेस
  rationale: हिब्रू नाम का आधुनिक हिन्दी लिप्यंतरण।
- source_word: חֶצְרוֹן
  choice: हेस्रोन
  rationale: हिब्रू नाम का आधुनिक हिन्दी लिप्यंतरण।
- source_word: כַרְמִי
  choice: कर्मी
  rationale: हिब्रू नाम का आधुनिक हिन्दी लिप्यंतरण; पद में नाम को बिना वंशावली-संबंधी अतिरिक्त व्याख्या के रखा गया है।
- source_word: חוּר
  choice: हूर
  rationale: हिब्रू नाम का आधुनिक हिन्दी लिप्यंतरण।
- source_word: שׁוֹבָל
  choice: शोबाल
  rationale: हिब्रू नाम का आधुनिक हिन्दी लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: हिब्रू में दोहराया गया संयोजक नामों की साधारण सूची बनाता है; स्वाभाविक हिन्दी में अल्पविरामों के साथ अंतिम नाम से पहले ‘और’ रखा गया है।
