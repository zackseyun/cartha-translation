  choice: कोज़ेबा के पुरुष
  rationale: אַנְשֵׁי का शाब्दिक अर्थ ‘के पुरुष’ है और כֹזֵבָא स्थान-नाम प्रतीत होता है।
- source_word: יוֹאָשׁ
  choice: योआश
  rationale: व्यक्ति के नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: שָׂרָף
  choice: साराफ़
  rationale: वंशावली में इसे व्यक्ति का नाम समझना उचित है; सामान्य संज्ञा के रूप में इसका अनुवाद नहीं किया गया।
- source_word: אֲשֶׁר בָּעֲלוּ לְמוֹאָב
  choice: जिन्होंने मोआब में अधिकार रखा
  rationale: בעל यहाँ अधिकार, स्वामित्व या प्रभुता का भाव दे सकता है। ‘अधिकार रखा’ मूल की संक्षिप्तता और अर्थगत व्यापकता को ‘राज किया’ की अपेक्षा अधिक सुरक्षित रखता है।
- source_word: יָשֻׁבִי לָחֶם
  choice: याशूबी-लेहेम
  rationale: दुर्बोध हिब्रू रूप को मुख्य पाठ में संयुक्त व्यक्तिवाचक नाम के रूप में रखा गया है, क्योंकि ‘लौटे’ मानने पर रूप और वाक्य-संरचना दोनों अनिश्चित रहते हैं; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַדְּבָרִים עַתִּיקִים
  choice: ये बातें प्राचीन काल की हैं
  rationale: דְּבָרִים का सामान्य अर्थ ‘बातें/विषय’ है और עַתִּיקִים प्राचीनता बताता है। ‘अभिलेख’ जोड़ने के बजाय मूल की व्यापकता बनाए रखी गई है।
theological_decisions:
- issue: मोआब से संबंधित בעל क्रिया का आशय
  choice: अधिकार रखा
  alternative: राज किया; मोआब के स्वामी बने; मोआब में विवाह किया
  rationale: वाक्यांश अत्यंत संक्षिप्त और अर्थ की दृष्टि से अनिश्चित है। मुख्य पाठ में ऐसा सामान्य पद चुना गया है जो प्रभुता/अधिकार का भाव रखता है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वंशावली-शैली वाला गद्य। दुर्बोध हिब्रू को अत्यधिक स्पष्ट बनाने से बचते हुए मुख्य पाठ पठनीय रखा गया है और वास्तविक पाठगत/शब्दार्थगत अनिश्चितताएँ पादटिप्पणियों में दी गई हैं।
