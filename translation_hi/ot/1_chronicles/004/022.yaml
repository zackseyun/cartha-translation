base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/022.yaml
  text: and Jokim[a], and the men of Cozeba, and Joash, and Saraph, who ruled in Moab and returned to Lehem[c][b]. These records are ancient.
translation:
  language: hi
  text: और योकीम, कोज़ेबा के पुरुष, योआश और साराफ़, जिन्होंने मोआब में प्रभुत्व किया[a], तथा याशूबी-लेहेम[b] थे। ये बातें प्राचीन काल की हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अर्थ “मोआब पर अधिकार किया,” “मोआब के स्वामी बने,” या सम्भवतः “मोआब में विवाह किया” भी हो सकता है। हिब्रू वाक्यांश संक्षिप्त और अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू पाठ अनिश्चित है। इसे “और वे लेहेम लौटे” भी समझा गया है; “याशूब-लेहेम” भी नाम का सम्भावित रूप है। कुछ लोग लेहेम को बैतलहम से जोड़ते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “ये बातें प्राचीन हैं” या “ये बातें प्राचीन समय से हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹקִים
  choice: योकीम
  rationale: वंशावली के संदर्भ में यह व्यक्ति का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
