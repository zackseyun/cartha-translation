base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/012.yaml
  text: Eshton fathered Beth-rapha[a], Paseah, and Tehinnah, the father of Ir-nahash[b]. These were the men of Rekah.
translation:
  language: hi
  text: एश्तोन ने बेत-राफा, पासेह और तहीन्ना को जन्म दिया। तहीन्ना ईर-नाहाश[a] का पिता[b] था। ये रेखा के लोग थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ईर-नाहाश’ का अर्थ ‘नाहाश का नगर’ हो सकता है, पर यहाँ संभवतः यह एक स्थान-नाम है।
    reason: lexical_alternative
  - marker: b
    text: अथवा, ‘ईर-नाहाश का संस्थापक’। वंशावलियों में ‘पिता’ किसी पूर्वज या संस्थापक को भी सूचित कर सकता है, केवल तत्काल जैविक पिता को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुए
  rationale: वंशावली में हिफ़ील रूप संतान उत्पन्न करने या वंश चलाने को व्यक्त करता है। हिंदी में यह प्रयोग स्वाभाविक है और यह अनावश्यक रूप से तत्काल जैविक पितृत्व तक अर्थ को सीमित नहीं करता।
- source_word: בֵּית רָפָא
  choice: बेत-रापा
  rationale: आस-पास के नामों के समानांतर यह यहाँ व्यक्तिवाचक नाम है; इसलिए ‘रापा का घर’ जैसा अर्थानुवाद करने के बजाय लिप्यंतरण किया गया है।
- source_word: פָּסֵחַ
  choice: पासेह
  rationale: यह व्यक्तिवाचक नाम है, इसलिए अर्थानुवाद के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: תְּחִנָּה
  choice: तहिन्ना
  rationale: यहाँ यह व्यक्तिवाचक नाम है; अन्य संदर्भों में इसके सामान्य संज्ञा वाले अर्थ के बावजूद इसका अनुवाद नहीं किया गया।
- source_word: אֲבִי עִיר נָחָשׁ
  choice: ईर-नाहाश का पिता
  rationale: ‘पिता’ हिब्रू मुहावरे को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि वंशावली में इसका अर्थ पूर्वज या संस्थापक भी हो सकता है। ‘ईर-नाहाश’ को नाम-सूची के संदर्भ में स्थान-नाम माना गया है।
- source_word: אֵלֶּה אַנְשֵׁי רֵכָה
  choice: ये रेका के लोग थे
  rationale: शाब्दिक ‘रेका के पुरुष’ के बजाय ‘लोग’ आधुनिक हिंदी में किसी स्थान या कुल से जुड़े समुदाय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רֵכָה
  choice: रेका
  rationale: यह व्यक्तिवाचक अथवा स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
theological_decisions:
- issue: אֲבִי में पितृत्व की सीमा
  choice: मुख्य पाठ में ‘पिता’ रखकर अर्थ की व्यापकता पादटिप्पणी में बताई गई है।
  alternative: ‘संस्थापक’ या ‘पूर्वज’ सीधे मुख्य पाठ में लिखना।
  rationale: स्रोत में प्रयुक्त पारिवारिक पद को बनाए रखना वास्तविक अस्पष्टता की रक्षा करता है; वंशावली में यह पद तत्काल जैविक पिता, पूर्वज या किसी बस्ती/कुल के संस्थापक को सूचित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण वंशावली-शैली वाला गद्य रखा गया है। नामों का अर्थानुवाद नहीं किया गया; उन्हें देवनागरी में स्रोत-निकट रूप से लिप्यंतरित किया गया है।
