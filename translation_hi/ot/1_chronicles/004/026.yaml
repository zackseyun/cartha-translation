  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। मूल में बार-बार आए ‘उसका पुत्र’ को बनाए रखकर वंशक्रम स्पष्ट रखा गया है; अंतिम पद से पहले ‘और’ हिन्दी प्रवाह के लिए जोड़ा गया है।
