  yaml_path: translation/ot/1_chronicles/004/026.yaml
  text: 'The sons of Mishma: Hammuel his son, Zaccur his son, Shimei his son.'
translation:
  language: hi
  text: 'और मिश्मा के पुत्र ये थे: उसका पुत्र हम्मूएल, उसका पुत्र जक्कूर और उसका पुत्र शिमी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और मिश्मा के पुत्र ये थे
  rationale: וּ का संबंधसूचक अर्थ ‘और’ रखा गया है। בְנֵי रचनात्मक बहुवचन है; वंशावली की सूची को स्वाभाविक हिन्दी में आरम्भ करने के लिए ‘के पुत्र ये थे’ चुना गया।
- source_word: מִשְׁמָע
  choice: मिश्मा
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: חַמּוּאֵל
  choice: हम्मूएल
  rationale: मसोरेटिक व्यंजन और स्वर-रूप को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: एकवचन संज्ञा पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसका पुत्र’ है; इससे क्रमिक पिता-पुत्र संबंध सुरक्षित रहता है।
- source_word: זַכּוּר
  choice: जक्कूर
  rationale: इब्रानी ז को प्रचलित हिन्दी बाइबलीय नाम-परंपरा के अनुसार ‘ज’ और दोगुने כּ को ‘क्क’ से दर्शाया गया है।
- source_word: שִׁמְעִי
  choice: शिमी
  rationale: इब्रानी नाम का स्वरांकन-सम्मत और हिन्दी में सहज देवनागरी लिप्यंतरण।
theological_decisions: []
