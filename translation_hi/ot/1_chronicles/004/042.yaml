  yaml_path: translation/ot/1_chronicles/004/042.yaml
  text: And some of them[a], from the sons of Simeon, went to Mount Seir—five hundred men—with Pelatiah, Neariah, Rephaiah, and Uzziel, sons of Ishi, at their head.
translation:
  language: hi
  text: और उनमें से, शिमोन के वंशजों में से, पाँच सौ पुरुष सेईर पर्वत पर गए, और यिशई के पुत्र पलत्याह, नेआर्याह, रपायाह और उज्जीएल उनके अगुवे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵהֶם מִן בְּנֵי שִׁמְעוֹן
  choice: और उनमें से, अर्थात शिमोन के वंशजों में से
  rationale: מֵהֶם का अंशवाचक भाव और מִן־בְּנֵי שִׁמְעוֹן की वंशावली-संबंधी पहचान दोनों सुरक्षित रखे गए हैं; आधुनिक हिन्दी में स्पष्टता के लिए ‘अर्थात’ जोड़ा गया है।
- source_word: הָלְכוּ לְהַר שֵׂעִיר
  choice: सेईर पर्वत पर गए
  rationale: सरल गति-सूचक क्रिया और प्रचलित स्थाननाम को बिना सैन्य अर्थ जोड़े सीधे रूप में व्यक्त करता है।
- source_word: אֲנָשִׁים חֲמֵשׁ מֵאוֹת
  choice: पाँच सौ पुरुष
  rationale: समूह की संख्या बताने वाला सीधा समानाधिकरण है; मूल में स्पष्ट न होने के कारण ‘सेना’ जैसा भाव नहीं जोड़ा गया।
- source_word: וּפְלַטְיָה וּנְעַרְיָה וּרְפָיָה וְעֻזִּיאֵל
  choice: पलत्याह, नार्याह, रपायाह और उज्जीएल
  rationale: नामों को हिब्रू स्वरूप के निकट रहते हुए स्वाभाविक देवनागरी लिप्यंतरण में दिया गया है।
- source_word: בְּנֵי יִשְׁעִי
  choice: यिशई के पुत्र
  rationale: चारों व्यक्तियों की वंशगत पहचान को स्पष्ट और औपचारिक हिन्दी में सुरक्षित रखता है।
- source_word: בְּרֹאשָׁם
  choice: उनके अगुवे थे
  rationale: शाब्दिक ‘उनके सिर पर’ के नेतृत्व-सूचक मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है; निकटवर्ती चार नामित पुरुष पाँच सौ लोगों के नेता समझे जाते हैं।
