  choice: यहूदा के पुत्र शेला के बेटे
  rationale: वंशावली की स्पष्ट कड़ी और इब्रानी के ‘पुत्र/बेटे’ संबंध को बनाए रखा गया है; यहाँ ‘बेटे’ व्यापक अर्थ में वंशजों को भी सूचित कर सकता है।
- source_word: אֲבִי
  choice: पिता
  rationale: मूल का निकटतम और पारदर्शी अर्थ रखा गया है, जबकि इस प्रकार की वंशावली में ‘पूर्वज’ या किसी बस्ती/कुल का ‘संस्थापक’ अर्थ भी संभव है।
- source_word: מִשְׁפְּחוֹת
  choice: कुल
  rationale: आधुनिक एकल परिवारों के बजाय विस्तृत वंश-समूहों के लिए ‘कुल’ स्वाभाविक और संदर्भानुकूल है।
- source_word: עֲבֹדַת הַבֻּץ
  choice: महीन मलमल का काम करनेवाले
  rationale: בּוּץ उच्च कोटि के महीन सन-वस्त्र को दर्शाता है; यह अनुवाद वस्त्र और व्यावसायिक कार्य दोनों को स्पष्ट करता है।
- source_word: לְבֵית אַשְׁבֵּעַ
  choice: अश्बेआ के घराने के
  rationale: לְ और בֵּית की संक्षिप्त रचना को पारिवारिक अथवा संस्थागत संबंध के रूप में रखा गया है, बिना इसे निश्चित रूप से स्थानवाचक बनाने के।
