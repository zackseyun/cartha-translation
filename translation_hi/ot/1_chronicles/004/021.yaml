base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/021.yaml
  text: 'The sons of Shelah son of Judah: Er the father of Lecah[a], and Laadah the father of Mareshah, and the clans of the house of linen workers of the house of Ashbea.'
translation:
  language: hi
  text: 'यहूदा के पुत्र शेला के बेटे ये थे: लेका का पिता[a] एर, मारेशा का पिता लादा, और अश्बेआ के घराने से जुड़े महीन सन-वस्त्र का काम करनेवालों के कुल।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “पिता” का अर्थ “पूर्वज” अथवा किसी कुल या बस्ती का “संस्थापक” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस पद का अंतिम इब्रानी पदबंध बहुत संक्षिप्त है। शाब्दिक रूप में इसमें “महीन सन-वस्त्र के काम का घराना” और “अश्बेआ का घराना” आते हैं। इसका अनुवाद “अश्बेआ के घराने के वे कुल जो महीन सन-वस्त्र का काम करते थे” या “बेत-अश्बेआ में महीन सन-वस्त्र का काम करनेवालों के कुल” भी किया जा सकता है।
    reason: textual_ambiguity
