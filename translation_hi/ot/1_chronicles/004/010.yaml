source:
  edition: WLC
  text: וַ/יִּקְרָ֣א יַ֠עְבֵּץ לֵ/אלֹהֵ֨י יִשְׂרָאֵ֜ל לֵ/אמֹ֗ר אִם בָּרֵ֨ךְ תְּבָרֲכֵ֜/נִי וְ/הִרְבִּ֤יתָ אֶת גְּבוּלִ/י֙ וְ/הָיְתָ֤ה יָדְ/ךָ֙ עִמִּ֔/י וְ/עָשִׂ֥יתָ מֵּ/רָעָ֖ה לְ/בִלְתִּ֣י עָצְבִּ֑/י וַ/יָּבֵ֥א אֱלֹהִ֖ים אֵ֥ת אֲשֶׁר שָׁאָֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/010.yaml
  text: And Jabez called on the God of Israel[a], saying, “If you would indeed bless me and enlarge my territory, and let your hand be with me[b], and keep me from harm so that I may not suffer pain!” And God granted what he asked.
translation:
  language: hi
  text: और याबेस ने इस्राएल के परमेश्वर को पुकारकर कहा, “काश, तू सचमुच मुझे आशीष दे, मेरा क्षेत्र बढ़ा दे, और तेरा हाथ मेरे साथ रहे! तू मुझे विपत्ति[a] से बचाए, ताकि मुझे पीड़ा न हो[b]!” तब परमेश्वर ने उसकी माँग पूरी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई।” इब्रानी शब्द רָעָה नैतिक बुराई या हानि पहुँचाने वाली विपत्ति—दोनों का अर्थ दे सकता है; यहाँ पीड़ा से बचने का प्रसंग “विपत्ति” के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: “मुझे पीड़ा न हो” पिछले पद में याबेस के नाम की व्याख्या की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारकर कहा
  rationale: प्रार्थना के प्रसंग में क्रिया परमेश्वर से विनती करने या उसे पुकारने का भाव व्यक्त करती है; यह हिन्दी में स्वाभाविक है।
- source_word: אִם בָּרֵךְ תְּבָרֲכֵנִי
  choice: काश, तू सचमुच मुझे आशीष देता
  rationale: אִם यहाँ अधूरी शर्त से अधिक उत्कट कामना व्यक्त करता है, और infinitive absolute के साथ finite verb आशीष देने की विनती पर बल देता है।
- source_word: וְהִרְבִּיתָ אֶת גְּבוּלִי
  choice: मेरा क्षेत्र बढ़ाता
  rationale: גְּבוּל सीमा अथवा उस सीमा के भीतर के भू-क्षेत्र को दर्शा सकता है; प्रसंग में भूमि या अधिकार-क्षेत्र का बढ़ना सबसे स्वाभाविक है।
- source_word: וְהָיְתָה יָדְךָ עִמִּי
  choice: तेरा हाथ मेरे साथ रहता
  rationale: परमेश्वर के हाथ का मूल बिंब बनाए रखा गया है; यह उसकी सामर्थ्य और सहायता का संकेत है।
- source_word: וְעָשִׂיתָ מֵּרָעָה
  choice: तू मुझे विपत्ति से बचाता
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ कठिन है। अगले पीड़ा-संबंधी उपवाक्य के कारण רָעָה यहाँ हानिकारक विपत्ति का बोध कराता है, जबकि नैतिक 'बुराई' की संभावना पादटिप्पणी में रखी गई है।
- source_word: לְבִלְתִּי עָצְבִּי
  choice: ताकि मुझे पीड़ा न हो
  rationale: עצב पीड़ा, दुःख या कष्ट को दर्शाता है और पिछले पद में याबेस के नाम की व्याख्या की प्रतिध्वनि करता है। प्रथम पुरुष प्रत्यय के कारण पीड़ा सहने का अर्थ संदर्भानुकूल है।
- source_word: וַיָּבֵא אֱלֹהִים אֵת אֲשֶׁר שָׁאָל
  choice: तब परमेश्वर ने उसकी माँग पूरी की
  rationale: यहाँ בוא का causative-सदृश प्रयोग माँगी हुई बात को घटित करने, अर्थात विनती पूरी करने, का भाव देता है।
theological_decisions:
- issue: याबेस द्वारा גְּבוּל बढ़ाने की विनती का स्वरूप
  choice: क्षेत्र को सामान्य भू-क्षेत्र या अधिकार-क्षेत्र के अर्थ में रखा गया है।
  alternative: प्रभाव-क्षेत्र
  rationale: इब्रानी शब्द का प्राथमिक अर्थ सीमा या क्षेत्र है। अनुवाद न तो इसे अनावश्यक रूप से रूपक बनाता है, न आधुनिक समृद्धि-सिद्धांत का आशय जोड़ता है।
- issue: प्रार्थना में רָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: पीड़ा से बचने की अगली विनती के साथ इसका संभावित अर्थ हानिकारक घटना या संकट है; फिर भी नैतिक बुराई का वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: प्रार्थना के आरम्भ में אִם की शक्ति
  choice: काश के रूप में उत्कट कामना
  alternative: यदि तू सचमुच मुझे आशीष दे
  rationale: यह वाक्य औपचारिक शर्त का परिणाम नहीं देता और प्रार्थना की कामनात्मक संरचना में है; इसलिए हिन्दी में 'काश' अर्थ स्पष्ट करता है, जबकि बलवाचक क्रिया-रचना को 'सचमुच' से रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण प्रार्थना-रजिस्टर अपनाया गया है। परमेश्वर को संबोधन में एकवचन निकटवर्ती रूप “तू/तेरा” रखा गया है, जो बाइबिलीय प्रार्थना में स्वाभाविक है और इब्रानी के एकवचन संबोधन को दर्शाता है। विस्मयादिबोधक चिह्न उत्कट विनती को स्पष्ट करता है।
