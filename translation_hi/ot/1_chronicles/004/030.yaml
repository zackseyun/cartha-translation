lexical_decisions:
- source_word: וּ/בִ/בְתוּאֵל
  choice: और बेतूएल में
  rationale: וּ सूची की पिछली कड़ी से जोड़ता है, इसलिए इसे “और” कहा गया है। स्थान-सूची में ב का स्वाभाविक हिन्दी रूप “में” है। בְתוּאֵל यहाँ स्थान-नाम है, इसलिए उसका लिप्यंतरण “बेतूएल” किया गया है।
- source_word: וּ/בְ/חָרְמָה
  choice: और होर्मा में
  rationale: दोहराई गई हिब्रू सूची-संरचना को बनाए रखने के लिए וּ और ב को “और ... में” कहा गया है। חָרְמָה स्थान-नाम है, इसलिए “होर्मा” लिप्यंतरित किया गया है।
- source_word: וּ/בְ/צִֽיקְלָג
  choice: और सिकलग में
  rationale: सूची की समान संरचना को बनाए रखते हुए וּ और ב का अनुवाद “और ... में” किया गया है। צִיקְלָג स्थान-नाम है, इसलिए हिन्दी में प्रचलित बाइबलीय रूप “सिकलग” रखा गया है।
