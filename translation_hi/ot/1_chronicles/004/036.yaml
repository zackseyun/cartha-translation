  text: और एल्योएनै, और याकोबाह, और यशोहायाह, और असायाह, और अदीएल, और यसीमीएल, और बनायाह।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶלְיוֹעֵינַי
  choice: एल्योएनै
  rationale: व्यक्तिवाचक नाम को अर्थानुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: יַעֲקֹבָה
  choice: याकूबा
  rationale: हिब्रू नाम के व्यंजन और स्वरों को स्वाभाविक हिन्दी रूप में सुरक्षित रखने वाला लिप्यंतरण।
- source_word: יְשׁוֹחָיָה
  choice: यशोहायाह
  rationale: आरम्भिक योध को 'य' और नाम के अंतिम ईश्वरीय तत्त्व को 'याह' द्वारा दर्शाते हुए स्रोत-सन्निकट लिप्यंतरण।
- source_word: עֲשָׂיָה
  choice: असायाह
  rationale: नाम को हिब्रू रूप के निकट रखते हुए हिन्दी पाठकों के लिए सुबोध देवनागरी लिप्यंतरण दिया गया है।
- source_word: עֲדִיאֵל
  choice: अदीएल
  rationale: नाम के अंतिम אֵל तत्त्व को 'एल' के रूप में सुरक्षित रखा गया है।
- source_word: יְשִׂימִיאֵל
  choice: यसीमीएल
  rationale: हिब्रू व्यंजन-क्रम और अंतिम 'एल' तत्त्व को दर्शाने वाला स्रोत-सन्निकट लिप्यंतरण।
- source_word: בְּנָיָה
  choice: बनायाह
  rationale: हिब्रू नाम के अंतिम 'याह' तत्त्व सहित देवनागरी लिप्यंतरण; अंग्रेज़ी परंपरागत रूप पर निर्भर नहीं किया गया।
- source_word: וְ / וַ / וִ / וּ
  choice: और
  rationale: हर नाम से पहले लगे हिब्रू वाव को 'और' से व्यक्त कर मूल की बहु-संयोजकीय सूची-शैली सुरक्षित रखी गई है।
