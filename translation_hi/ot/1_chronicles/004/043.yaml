  yaml_path: translation/ot/1_chronicles/004/043.yaml
  text: And they struck down the remnant of the survivors of Amalek[b][a], and they lived there to this day.
translation:
  language: hi
  text: और उन्होंने अमालेकियों के बच निकलनेवालों में से जो शेष थे[a], उन्हें मार गिराया, और वे आज तक वहीं बसे रहे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अमालेकियों के बचे हुए बचे-खुचे लोगों को।” इब्रानी में विनाश के बाद बचे लोगों के लिए दो निकटार्थक शब्द साथ आए हैं।
    reason: lexical_alternative
  - marker: b
    text: या “वे आज तक वहीं रहते रहे।” संबंधित क्रिया किसी स्थान पर रहने या बसने—दोनों का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: नכה का यह कथात्मक रूप सैन्य प्रहार और प्रसंग में उसके घातक परिणाम को व्यक्त करता है; ‘मार गिराया’ क्रिया के अर्थ को अनावश्यक रूप से बढ़ाए बिना स्वाभाविक हिन्दी देता है।
- source_word: שְׁאֵרִית הַפְּלֵטָה
  choice: बचे हुओं के शेष लोगों
  rationale: दो निकटार्थक संज्ञाओं को बनाए रखकर पूर्व विनाश के बाद बची हुई अत्यल्प जनसंख्या पर इब्रानी बल को सुरक्षित रखा गया है।
- source_word: לַעֲמָלֵק
  choice: अमालेक के
  rationale: व्यक्तिवाचक नाम यहाँ अमालेक से पहचाने जाने वाले जनसमूह का द्योतक है; यह चयन इब्रानी संरचना के निकट है।
- source_word: וַיֵּשְׁבוּ
  choice: बसे रहे
  rationale: ישב का अर्थ बैठना, रहना या बसना हो सकता है। स्थान पर अधिकार करके वहाँ बने रहने के प्रसंग में ‘बसे रहे’ स्वाभाविक है और निरंतर निवास का भाव देता है।
- source_word: שָׁם
  choice: वहीं
  rationale: यह स्थानवाचक क्रियाविशेषण पहले उल्लिखित स्थान की ओर संकेत करता है; हिन्दी में ‘वहीं’ उस संदर्भ को स्पष्ट और सहज बनाता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी कथात्मक काल-वाक्यांश का प्रचलित और स्वाभाविक हिन्दी रूप है।
