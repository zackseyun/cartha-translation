lexical_decisions:
- source_word: וַיֵּשְׁבוּ
  choice: वे … में रहते थे
  rationale: ישׁב का यह बहुवचन रूप इन स्थानों में निवास करने का अर्थ देता है। “रहते थे” आधुनिक हिन्दी में स्वाभाविक है और “बस गए” की तरह आरम्भिक बसावट का अतिरिक्त भाव नहीं जोड़ता।
- source_word: בִּבְאֵר שֶׁבַע
  choice: बेर्शेबा
  rationale: स्थान-नाम को उसके प्रचलित हिन्दी लिप्यंतरण में रखा गया है; उसका अर्थानुवाद नहीं किया गया।
- source_word: וּמוֹלָדָה
  choice: मोलादा
  rationale: इब्रानी स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: וַחֲצַר שׁוּעָל
  choice: हसर-शूआल
  rationale: दो अवयवों वाले स्थान-नाम का स्रोत-पाठ के उच्चारण के निकट देवनागरी लिप्यंतरण; योजक-चिह्न नाम की संरचना स्पष्ट करता है।
