  text: Penuel[a], the father of Gedor, and Ezer, the father of Hushah—these were the sons of Hur, the firstborn of Ephrathah[b], the father of Bethlehem.
translation:
  language: hi
  text: पनूएल[a], गदोर का पिता, और एज़ेर, हूशा का पिता—ये हूर के पुत्र थे; हूर एप्राता का पहलौठा और बेतलेहेम का पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वंशावली के इस संदर्भ में “का पिता” का अर्थ “पूर्वज,” “संस्थापक,” या किसी नगर अथवा कुल से जुड़ा प्रमुख भी हो सकता है। पनूएल नाम अन्य कुछ स्थानों पर “पनीएल” रूप में मिलता है।
    reason: lexical_alternative
