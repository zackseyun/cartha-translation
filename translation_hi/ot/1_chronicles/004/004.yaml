theological_decisions:
- issue: अंतिम אֲבִי का कर्ता
  choice: 'इसे हूर से संबंधित माना गया: “जो बेतलेहेम का पिता था”'
  alternative: 'इसे एप्राता से संबंधित मानना: “एप्राता ... बेतलेहेम की माता/पूर्वजा”'
  rationale: इब्रानी में אֲבִי पुल्लिंग एकवचन है और निकटवर्ती पुल्लिंग संज्ञा हूर से व्याकरणिक मेल रखता है; इसलिए संबंध हूर से जोड़ा गया, बिना ‘पिता’ के व्यापक वंशीय/संस्थापक अर्थ को सीमित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज वंशावली-शैली रखी गई है। नामों के लिए हिंदी बाइबल-पाठकों को परिचित या इब्रानी-निकट लिप्यंतरण अपनाया गया है। डैश से दो नामों की सूची और उसके बाद आने वाले वंश-संबंध को स्पष्ट किया गया है।
