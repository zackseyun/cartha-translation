base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/014.yaml
  text: Meonothai fathered Ophrah[a], and Seraiah fathered Joab, the father of Ge-harashim[b], for they were craftsmen.
translation:
  language: hi
  text: मओनोतै ओफ्रा का पिता था, और सरायाह योआब का पिता था। योआब गे-हराशीम[a] का पिता[b] था, क्योंकि वहाँ के लोग कारीगर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गे-हराशीम” का संभावित अर्थ “कारीगरों की घाटी” है। हिब्रू पाठ इसे स्थान-नाम के रूप में रखता है, और अगला वाक्यांश इस नाम की व्याख्या करता है।
    reason: lexical_alternative
  - marker: b
    text: या “गे-हराशीम का संस्थापक।” वंशावली के प्रसंग में “पिता” किसी स्थान या कुल के संस्थापक अथवा पूर्वज को भी सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מְעוֹנֹתַי
  choice: मओनोतै
  rationale: यह एक व्यक्ति का नाम है; इसे हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली के प्रसंग में हिफ़ील रूप संतान उत्पन्न होने का भाव देता है। यह प्रयोग आधुनिक और स्वाभाविक हिन्दी में वंश-संबंध को व्यक्त करता है।
- source_word: עָפְרָה
  choice: ओप्रा
  rationale: नाम को हिब्रू रूप के निकट लिप्यंतरित किया गया है; इस संदर्भ में इसे वंशज के नाम के रूप में रखा गया है।
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: व्यक्तिवाचक नाम का हिब्रू के निकट लिप्यंतरण।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֲבִי
  choice: का पिता
  rationale: मूल पाठ के ‘पिता’ संबंधी रूपक को बनाए रखा गया है; वंशावली में इसका अर्थ संस्थापक या कुल-मुखिया भी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: גֵּיא חֲרָשִׁים
  choice: गे-हराशीम
  rationale: यहाँ पदबंध स्थान-नाम की तरह प्रयुक्त है। इसलिए मुख्य पाठ में लिप्यंतरण रखा गया है और इसके संभावित अर्थ को पादटिप्पणी में दिया गया है।
- source_word: חֲרָשִׁים
  choice: कारीगर
  rationale: यह शब्द व्यापक रूप से कुशल शिल्पकारों को सूचित कर सकता है; ‘कारीगर’ किसी एक विशेष धंधे तक अर्थ को सीमित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह स्थान-नाम अथवा उससे जुड़े लोगों के विषय में कारणात्मक व्याख्या प्रस्तुत करता है।
- source_word: הָיוּ
  choice: वे ... थे
  rationale: बहुवचन कर्ता को स्वाभाविक हिन्दी में व्यक्त करता है और गे-हराशीम से जुड़े लोगों की ओर संकेत बनाए रखता है।
theological_decisions:
- issue: योआब को गे-हराशीम का ‘पिता’ कहना
  choice: मुख्य पाठ में ‘पिता’ रखा गया
  alternative: ‘संस्थापक’ या ‘कुल-मुखिया’
  rationale: हिब्रू אָב वंशावली-सूचनाओं में प्रत्यक्ष पिता के अतिरिक्त संस्थापक या पूर्वज को भी सूचित कर सकता है। मुख्य पाठ मूल रूपक को सुरक्षित रखता है और पादटिप्पणी संभावित प्रसंगगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। व्यक्तियों तथा स्थान के नामों को देवनागरी में लिप्यंतरित किया गया है। ‘से ... उत्पन्न हुआ’ वंशावली की शैली को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘पिता’ मूल हिब्रू की अर्थगत व्यापकता बनाए रखता है।
