  yaml_path: translation/ot/1_chronicles/004/009.yaml
  text: Jabez was more honored than his brothers[a], and his mother called his name Jabez, saying[b], “Because I bore him in pain.”
translation:
  language: hi
  text: याबेस[a] अपने भाइयों से अधिक सम्मानित था। उसकी माँ ने यह कहते हुए उसका नाम याबेस रखा, “क्योंकि मैंने उसे पीड़ा[b] में जन्म दिया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याबेस’ नाम की ध्वनि इब्रानी में पीड़ा या दुःख से जुड़े शब्द से मिलती-जुलती है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि मैंने उसे दुःख के साथ जन्म दिया।” इब्रानी शब्द עֹצֶב का अर्थ पीड़ा, दुःख या कष्ट हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: היה का यह कथात्मक रूप यहाँ याबेस की स्थिति बताता है। आधुनिक हिन्दी में अलग आरंभिक संयोजक जोड़े बिना ‘था’ स्वाभाविक है।
- source_word: יַעְבֵּץ
  choice: याबेस
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है; नाम की पुनरावृत्ति माता द्वारा दिए गए कारण से जुड़े इब्रानी शब्दालंकार को बनाए रखती है।
- source_word: נִכְבָּד מֵאֶחָיו
  choice: अपने भाइयों से अधिक सम्मानित
  rationale: נכבד सम्मानित अथवा आदरणीय होने का भाव देता है और מן तुलना व्यक्त करता है। ‘अपने भाइयों से अधिक सम्मानित’ दोनों बातों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: וְאִמּוֹ קָרְאָה שְׁמוֹ
  choice: उसकी माँ ने ... उसका नाम ... रखा
  rationale: ‘उसका नाम पुकारा’ का शाब्दिक मुहावरा हिन्दी में नामकरण के अर्थ में अस्वाभाविक होगा; ‘नाम रखा’ वही अर्थ सहज रूप से देता है।
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: यह रूप माता के कथन को प्रस्तुत करता है और हिन्दी वाक्य में नामकरण के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ नाम रखने का कारण प्रस्तुत किया गया है; ‘क्योंकि’ उसके कारणात्मक बल को स्पष्ट रखता है।
- source_word: יָלַדְתִּי
  choice: मैंने इसे ... जन्म दिया
  rationale: क्रिया का अर्थ जन्म देना है। प्रसंग में निहित बालक को हिन्दी में ‘इसे’ से स्पष्ट किया गया है।
- source_word: בְּעֹצֶב
  choice: पीड़ा में
  rationale: עֹצֶב शारीरिक पीड़ा, दुःख या कष्ट का बोध करा सकता है। प्रसव के संदर्भ में ‘पीड़ा’ प्रमुख अर्थ को स्वाभाविक ढंग से व्यक्त करती है, जबकि वैकल्पिक भाव पादटिप्पणी में सुरक्षित है।
