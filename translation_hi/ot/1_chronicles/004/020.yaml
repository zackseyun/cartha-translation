base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/020.yaml
  text: 'The sons of Shimon: Amnon and Rinnah[a], Ben-Hanan and Tilon[b]. And the sons of Ishi: Zoheth and Ben-Zoheth.'
translation:
  language: hi
  text: 'शिमोन के पुत्र: अम्नोन, रिन्ना, बेन-हानान[a] और तीलोन। यिशै के पुत्र: ज़ोहेत और बेन-ज़ोहेत[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हानान का पुत्र”; किन्तु इस वंशावली-सूची में “बेन-हानान” सम्भवतः एक व्यक्तिनाम है।
    reason: lexical_alternative
  - marker: b
    text: या, “ज़ोहेत का पुत्र”; किन्तु इस वंशावली-सूची में “बेन-ज़ोहेत” सम्भवतः एक व्यक्तिनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי שִׁימוֹן
  choice: शिमोन के पुत्र
  rationale: वंशावली में בְנֵי का सीधा अर्थ ‘पुत्र’ है। पद के आरम्भ में וּ को अलग से ‘और’ कहना स्वाभाविक हिन्दी के लिए आवश्यक नहीं है। שִׁימוֹן को उसके इब्रानी रूप के निकट ‘शिमोन’ लिखा गया है।
- source_word: אַמְנוֹן וְרִנָּה
  choice: अम्नोन, रिन्ना
  rationale: दोनों व्यक्तिनाम इब्रानी उच्चारण के निकट लिप्यंतरित हैं; सूची में हिन्दी विराम-चिह्नों से संबंध स्पष्ट है।
- source_word: בֶּן חָנָן
  choice: बेन-हानान[a]
  rationale: इस नाम-सूची में इसे संयुक्त व्यक्तिनाम मानना अधिक संभावित है। हाइफ़न उसके नामरूप को स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक ‘हानान का पुत्र’ की सम्भावना सुरक्षित रखती है।
- source_word: וְתולון
  choice: और तीलोन
  rationale: इसे व्यक्तिनाम के रूप में इब्रानी स्वरांकन के निकट लिप्यंतरित किया गया है।
- source_word: וּבְנֵי יִשְׁעִי
  choice: यिशई के पुत्र
  rationale: दोहराया गया वंशावली-सूत्र सीधे ‘के पुत्र’ के रूप में दिया गया है। יִשְׁעִי का लिप्यंतरण ‘यिशई’ मूल व्यंजनों को बनाए रखता है।
- source_word: זוֹחֵת
  choice: सोहेत
  rationale: व्यक्तिनाम का देवनागरी में सहज, मूल के निकट लिप्यंतरण।
- source_word: וּבֶן זוֹחֵת
  choice: और बेन-सोहेत[b]
  rationale: इसके बाद कोई अलग व्यक्तिनाम नहीं आता, इसलिए पूरी अभिव्यक्ति को नाम मानना सूची की रचना में अधिक स्वाभाविक है; पादटिप्पणी वैकल्पिक संबंधवाचक अर्थ को सुरक्षित रखती है।
