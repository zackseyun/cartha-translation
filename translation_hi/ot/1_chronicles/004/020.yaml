  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। मूल की नाम-सूची वाली संरचना रखी गई है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न नामों से असंगत स्थानों पर दिखते हैं; हिन्दी में [a] को बेन-हानान और [b] को बेन-सोहेत पर लगाया गया है, क्योंकि पादटिप्पणियाँ इन्हीं अभिव्यक्तियों की वैकल्पिक व्याख्या देती हैं।
