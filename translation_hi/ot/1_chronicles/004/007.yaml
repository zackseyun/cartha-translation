lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के बेटे
  rationale: ו को वंशावली की पिछली बात से जोड़ने वाले सहज ‘और’ से व्यक्त किया गया है। בְנֵי का मूल अर्थ ‘बेटे’ है; व्यापक वंशावलीगत अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: חֶלְאָה
  choice: हेला
  rationale: यह स्त्री का व्यक्तिवाचक नाम है, इसलिए इसका अनुवाद नहीं बल्कि आधुनिक हिन्दी के अनुरूप लिप्यंतरण किया गया है।
- source_word: צֶרֶת
  choice: सेरेत
  rationale: हिब्रू צ को यहाँ ‘स’ के निकट और ת को ‘त’ से दर्शाते हुए नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: יצחר
  choice: यिसहार
  rationale: प्रस्तुत हिब्रू व्यंजन-रूप के आधार पर नाम को हिन्दी में ध्वन्यात्मक रूप से लिप्यंतरित किया गया है; अंग्रेज़ी परामर्श-पाठ के ‘Izhar’ को सीधे आधार नहीं बनाया गया।
- source_word: וְ/אֶתְנָן
  choice: और एत्नान
  rationale: आरम्भिक וְ को सूची के अंतिम सदस्य को जोड़ने वाले ‘और’ से व्यक्त किया गया है और नाम का लिप्यंतरण ‘एत्नान’ किया गया है।
