  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वंशावली-शैली रखी गई है। अनाम स्त्री कर्ता और ‘पिता/संस्थापक’ की अर्थगत अस्पष्टता को स्पष्ट किए बिना मिटाया नहीं गया है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में जोड़े गए हैं।
