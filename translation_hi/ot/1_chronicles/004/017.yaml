base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/017.yaml
  text: 'The sons of Ezrah: Jether[a], Mered, Epher, and Jalon; and she conceived Miriam, Shammai, and Ishbah[c][b], the father of Eshtemoa.'
translation:
  language: hi
  text: एज्रह के पुत्र येतेर[a], मेरेद, एफ़ेर और यालोन थे। और उसने[b] मिरयम, शम्मै और यिशबह को गर्भ में धारण किया; यिशबह एश्तमोआ का पिता[c] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और एज्रह का पुत्र।” इसके बाद कई नाम आने के कारण इसे सामान्यतः सामूहिक अर्थ में “एज्रह के पुत्र” समझा जाता है।
    reason: textual_variant
  - marker: b
    text: इब्रानी में केवल “और उसने गर्भ में धारण किया” है; इस वाक्यांश में उस स्त्री की पहचान नहीं बताई गई है।
    reason: lexical_alternative
  - marker: c
    text: यदि एश्तमोआ किसी व्यक्ति के बजाय कुल या बस्ती का नाम है, तो अर्थ “एश्तमोआ का संस्थापक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן עֶזְרָה
  choice: एज्रा के पुत्र
  rationale: इब्रानी में ‘पुत्र’ एकवचन है, पर उसके बाद कई नाम आते हैं; इसलिए वंशावली के शीर्षक के रूप में बहुवचन स्वाभाविक है। एकवचन का शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יֶתֶר וּמֶרֶד וְעֵפֶר וְיָלוֹן
  choice: येतेर, मेरेद, एफ़ेर और यालोन
  rationale: व्यक्तिनामों का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַתַּהַר
  choice: और उसने गर्भ में धारण किया
  rationale: हरा क्रिया का मूल अर्थ गर्भधारण करना है। स्त्रीलिंग कर्ता पाठ में अनाम है, इसलिए उसका नाम नहीं जोड़ा गया।
- source_word: מִרְיָם וְשַׁמַּי וְיִשְׁבָּח
  choice: मिरयम, शम्मै और यिशबह
  rationale: नामों को पाठ में जैसे हैं वैसे ही व्यक्तिनाम मानकर लिप्यंतरित किया गया है।
- source_word: אֲבִי אֶשְׁתְּמֹעַ
  choice: एश्तमोआ का पिता
  rationale: वंशावली में אָב का पारदर्शी अर्थ ‘पिता’ है; कुल या बस्ती के संदर्भ में ‘संस्थापक’ की सम्भावना पादटिप्पणी में दी गई है।
