base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/041.yaml
  text: These[a], who were recorded by name, came in the days of Hezekiah king of Judah, and they struck down their tents and the Meunites who were found there, and devoted them to destruction to this day. Then they settled in their place, because there was pasture there for their flocks.
translation:
  language: hi
  text: जिन लोगों के नाम दर्ज किए गए थे, वे यहूदा के राजा हिजकिय्याह के दिनों में आए। उन्होंने उनके तंबुओं को ढा दिया और वहाँ पाए गए मऊनी लोगों[a] को मार गिराया; और उन्हें विनाश के लिए समर्पित कर दिया, जैसा कि आज तक है। फिर वे उनके स्थान पर बस गए, क्योंकि वहाँ उनकी भेड़-बकरियों के लिए चरागाह था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द הַמְּעִינִים कठिन है। परंपरागत रूप से इसे एक जाति का नाम, “मऊनी,” माना गया है; कुछ विद्वान इसका अर्थ “निवास-स्थान” या “बस्तियाँ” समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הַכְּתוּבִים בְּשֵׁמוֹת
  choice: जिन लोगों के नाम लिखे गए थे
  rationale: यह पदबंध वंशावली या सूची में नाम दर्ज किए जाने को दर्शाता है; यह हिंदी में स्वाभाविक रहते हुए प्रशासनिक भाव बनाए रखता है।
- source_word: וַיָּבֹאוּ
  choice: वहाँ आए
  rationale: בוא का सामान्य अर्थ ‘आना/पहुँचना’ है; संदर्भ से लक्ष्य-स्थान स्पष्ट करने के लिए ‘वहाँ’ जोड़ा गया है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: सैन्य प्रसंग में נכה प्रहार करके पराजित करने या मार डालने का बोध देता है; ‘मार गिराया’ हिंसक बल को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: אָהֳלֵיהֶם
  choice: उनके तंबुओं
  rationale: אֹהֶל का सीधा और प्रसंगानुकूल अर्थ ‘तंबू’ है, जो अर्ध-घुमंतू परिवेश से मेल खाता है।
- source_word: המעינים
  choice: मऊनियों
  rationale: कठिन व्यंजनात्मक रूप को परंपरागत रूप से एक जाति-सूचक नाम माना जाता है; संदर्भ में तंबुओं के साथ वहाँ मिले लोगों पर आक्रमण का उल्लेख इस अर्थ के अनुकूल है। वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר נִמְצְאוּ שָׁמָּה
  choice: वहाँ मिले
  rationale: ‘मऊनी’ को जनसमूह मानने पर संबंधवाचक खंड व्यक्तियों के लिए है; संक्षिप्त हिंदी रूप मूल अर्थ रखता है।
- source_word: וַיַּחֲרִימֻם
  choice: उनका ऐसा पूर्ण विनाश किया
  rationale: हिफ़ील חרם विनाश के लिए समर्पित करके पूरी तरह नष्ट करने का तकनीकी भाव रखता है। हिंदी वाक्य में अगले काल-वाक्यांश के साथ इसका परिणाम स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: कि वे आज तक फिर दिखाई नहीं दिए
  rationale: शाब्दिक ‘आज के दिन तक’ का संबंध यहाँ विनाश के स्थायी परिणाम से है; हिंदी में अर्थ स्पष्ट करने के लिए परिणामसूचक वाक्यांश अपनाया गया है।
- source_word: וַיֵּשְׁבוּ תַּחְתֵּיהֶם
  choice: वे उनके स्थान पर बस गए
  rationale: व्यक्तियों के साथ תַּחַת का अर्थ ‘उनके बदले/उनके स्थान पर’ है; यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: מִרְעֶה לְצֹאנָם
  choice: उनकी भेड़-बकरियों के लिए चरागाह
  rationale: מִרְעֶה चराई की भूमि है और צֹאן में भेड़ तथा बकरियाँ दोनों सम्मिलित हो सकती हैं; इसलिए यह रूप मूल की व्यापकता बनाए रखता है।
theological_decisions:
- issue: חרם का विशेष अर्थ
  choice: पूर्ण विनाश किया
  alternative: विनाश के लिए अर्पित किया / प्रतिबंध के अधीन किया
  rationale: मूल का धार्मिक-सैन्य तकनीकी भाव महत्वपूर्ण है, पर सामान्य हिंदी पाठक के लिए ‘पूर्ण विनाश’ अधिक बोधगम्य है। इसे केवल साधारण ‘हराया’ नहीं किया गया, ताकि मूल की तीव्रता बनी रहे।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथा-शैली। ‘भेड़-बकरियाँ’ से צֹאן की व्यापकता और ‘चरागाह’ से ग्रामीण प्रसंग स्पष्ट रखा गया है।
