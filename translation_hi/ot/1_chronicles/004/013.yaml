  register: संक्षिप्त वंशावली शैली को बनाए रखते हुए आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। मूल पाठ के बहुवचन ‘पुत्र’ को सुरक्षित रखा गया है, यद्यपि ओत्नीएल के अंतर्गत यहाँ केवल एक नाम दिया गया है।
