  text: 'The sons of Kenaz: Othniel and Seraiah[a]. And the sons of Othniel: Hathath.'
translation:
  language: hi
  text: 'कनज़ के पुत्र: ओत्नीएल और सरायाह। ओत्नीएल के पुत्र: हतत।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי קְנַז
  choice: कनज़ के पुत्र
  rationale: वंशावली के सूत्र में בְנֵי का सीधा और स्वाभाविक हिन्दी रूप ‘पुत्र’ है। आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में अनावश्यक और असहज होता।
- source_word: עָתְנִיאֵל
  choice: ओत्नीएल
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וּשְׂרָיָה
  choice: और सरायाह
  rationale: उपसर्ग וּ को ‘और’ से व्यक्त किया गया है; שְׂרָיָה का लिप्यंतरण इब्रानी उच्चारण और हिन्दी बाइबलीय नाम-परंपरा के अनुरूप है।
- source_word: וּבְנֵי עָתְנִיאֵל
  choice: ओत्नीएल के पुत्र
  rationale: दूसरी वंशावली इकाई को हिन्दी में नए वाक्य के रूप में रखना स्पष्ट और स्वाभाविक है; इसलिए आरम्भिक וּ का पृथक अनुवाद आवश्यक नहीं।
- source_word: חֲתַת
  choice: हतत
  rationale: इब्रानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
