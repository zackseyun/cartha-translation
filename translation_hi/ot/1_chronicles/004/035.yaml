    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
  choice: और
  rationale: संयोजक उपसर्ग इस नाम और आगे की वंशावली को पिछली सूची से जोड़ता है; हिन्दी में इसे सीधे ‘और’ कहा गया है।
- source_word: יוֹאֵל
  choice: योएल
  rationale: व्यक्तिवाचक नाम को हिन्दी बाइबलीय लिप्यंतरण के अनुरूप रखा गया है।
- source_word: יֵהוּא
  choice: येहू
  rationale: हिब्रू नाम का निकट और हिन्दी पाठकों में प्रचलित लिप्यंतरण।
- source_word: בֶּן יֹשִׁבְיָה
  choice: योशिब्याह का पुत्र
  rationale: पहला בֶּן स्वाभाविक रूप से प्रत्यक्ष पुत्र-संबंध बताता है।
- source_word: בֶּן שְׂרָיָה
  choice: सरायाह का पौत्र
  rationale: क्रमिक वंशावली-सूत्र को स्वाभाविक हिन्दी में व्यक्त करने के लिए दूसरी पीढ़ी का संबंध ‘पौत्र’ कहा गया है, जबकि मूल में फिर בֶּן है।
- source_word: בֶּן עֲשִׂיאֵל
  choice: असीएल का परपौत्र
  rationale: तीसरी पीढ़ी के संबंध को स्पष्ट और स्वाभाविक हिन्दी में ‘परपौत्र’ कहा गया है; यह मूल की क्रमिक בֶּן-श्रृंखला का अर्थ व्यक्त करता है।
