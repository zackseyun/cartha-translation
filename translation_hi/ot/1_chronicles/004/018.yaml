source:
  edition: WLC
  text: וְ/אִשְׁתּ֣/וֹ הַ/יְהֻדִיָּ֗ה יָלְדָ֞ה אֶת יֶ֨רֶד אֲבִ֤י גְדוֹר֙ וְ/אֶת חֶ֨בֶר֙ אֲבִ֣י שׂוֹכ֔וֹ וְ/אֶת יְקֽוּתִיאֵ֖ל אֲבִ֣י זָנ֑וֹחַ וְ/אֵ֗לֶּה בְּנֵי֙ בִּתְיָ֣ה בַת פַּרְעֹ֔ה אֲשֶׁ֥ר לָקַ֖ח מָֽרֶד־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/004/018.yaml
  text: And his wife the Jewess bore Jered the father of Gedor[a], Heber the father of Soco, and Jekuthiel the father of Zanoah. These are the sons of Bithiah daughter of Pharaoh[c][b], whom Mered took as wife.
translation:
  language: hi
  text: और उसकी यहूदी पत्नी[a] ने गदोर के पिता[b] येरेद को, सोको के पिता हेबेर को, और ज़ानोह के पिता यकूतीएल को जन्म दिया। ये फ़िरौन की बेटी बित्या[c] के पुत्र हैं, जिसे मेरेद ने पत्नी के रूप में लिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहूदिया की स्त्री।”
    reason: lexical_alternative
  - marker: b
    text: इतिहास-वृत्तान्त में “पिता” का अर्थ किसी स्थान का संस्थापक, पूर्वज या उससे जुड़े कुल का प्रधान भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू वाक्य कठिन है। यह निश्चित नहीं कि “यहूदी पत्नी” और फ़िरौन की बेटी बित्या एक ही स्त्री थीं या मेरेद की अलग-अलग पत्नियाँ।
    reason: alternative_reading
lexical_decisions:
- source_word: הַיְהֻדִיָּה
  choice: यहूदी पत्नी
  rationale: स्त्रीलिंग जातिवाचक संज्ञा का स्वाभाविक आधुनिक हिन्दी रूप; 'पत्नी' पूर्ववर्ती אשתו से आता है। 'यहूदिया की स्त्री' भी सम्भव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: वंशावली में ילד का सामान्य और स्वाभाविक हिन्दी अर्थ।
- source_word: אֲבִי
  choice: पिता
  rationale: हिब्रू मुहावरे को औपचारिक रूप से बनाए रखता है; इतिहास-वृत्तान्त में इसका आशय किसी स्थान का संस्थापक, पूर्वज या कुल-प्रधान भी हो सकता है।
- source_word: שׂוֹכוֹ
  choice: सोको
  rationale: हिब्रू स्थान-नाम का सरल देवनागरी लिप्यंतरण।
- source_word: יְקוּתִיאֵל
  choice: यकूतीएल
  rationale: हिब्रू व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: זָנוֹחַ
  choice: ज़ानोह
  rationale: हिब्रू स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: मूल पाठ स्पष्ट रूप से 'पुत्र' कहता है; व्यापक 'सन्तान' अर्थ को अनावश्यक रूप से नहीं अपनाया गया।
- source_word: בִּתְיָה בַת פַּרְעֹה
  choice: फ़िरौन की बेटी बित्या
  rationale: हिन्दी में स्वाभाविक सम्बन्ध-सूचक क्रम रखते हुए मूल पदबंध का अर्थ स्पष्ट किया गया।
- source_word: לָקַח
  choice: पत्नी बनाया था
  rationale: विवाह-सन्दर्भ में לקח का अर्थ पत्नी के रूप में ग्रहण करना है; यह हिन्दी में केवल 'लिया' से अधिक स्पष्ट और स्वाभाविक है।
- source_word: וְאֵלֶּה
  choice: ये ... थे
  rationale: सारांश देने वाले हिब्रू पदबंध को स्वाभाविक हिन्दी वाक्य में व्यक्त करता है।
theological_decisions:
- issue: '''उसकी यहूदी पत्नी'' और ''फ़िरौन की बेटी बित्या'' के परस्पर सम्बन्ध की अस्पष्टता'
  choice: मूल हिब्रू क्रम और तनाव को बनाए रखा गया; बित्या को मेरेद द्वारा पत्नी बनाए जाने की बात कही गई, पर दोनों स्त्रियों की पहचान एक मानकर मुख्य पाठ में स्पष्ट नहीं की गई।
  alternative: ‘यहूदी पत्नी’ को स्वयं बित्या मानना, अथवा पाठ का पुनर्विराम/संशोधन करके मेरेद की दो पत्नियाँ स्पष्ट करना।
  rationale: हिब्रू वाक्यरचना कठिन है और दोनों पहचानों पर मतभेद है। अनुवाद को इस अस्पष्टता का कृत्रिम समाधान नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और वंशावली के लिए संक्षिप्त शैली। नामों को हिब्रू के निकट देवनागरी में लिप्यंतरित किया गया है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न [a], [b], [c] उपस्थित हैं।
