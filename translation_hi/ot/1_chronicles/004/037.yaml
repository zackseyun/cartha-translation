  text: और ज़ीज़ा, शिफी का पुत्र, अल्लोन का पुत्र, यदायाह का पुत्र, शिम्री का पुत्र, शमायाह का पुत्र।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/זִיזָא
  choice: और जीजा
  rationale: וְ वंशावली की पिछली कड़ी से जोड़ता है, इसलिए ‘और’ रखा गया। זִיזָא को हिब्रू उच्चारण के निकट देवनागरी में ‘जीजा’ लिखा गया है; अंतिम א अलग व्यंजन-ध्वनि नहीं जोड़ता।
- source_word: בֶן
  choice: पुत्र / पोता / परपोता / वंश में … वंशज
  rationale: हिब्रू में हर पीढ़ी के साथ בֶן दोहराया गया है। स्वाभाविक आधुनिक हिन्दी में क्रमशः ‘पुत्र, पोता, परपोता’ और अधिक दूर के संबंध के लिए ‘वंश में … वंशज’ से वही वंशक्रम स्पष्ट किया गया है।
- source_word: שִׁפְעִי
  choice: शिपई
  rationale: व्यक्तिगत नाम का अनुवाद न करके उसके हिब्रू व्यंजनों और स्वरों के निकट लिप्यंतरण किया गया है।
- source_word: אַלּוֹן
  choice: अल्लोन
  rationale: यहाँ शब्द व्यक्तिगत नाम है, इसलिए इसके संभावित सामान्य अर्थ ‘बांज/बलूत का पेड़’ का अनुवाद नहीं किया गया; व्यंजन-द्वित्व को ‘ल्ल’ से दिखाया गया है।
- source_word: יְדָיָה
  choice: यदायाह
  rationale: नाम को हिब्रू रूप के निकट और हिन्दी में पठनीय ढंग से लिप्यंतरित किया गया है।
- source_word: שִׁמְרִי
  choice: शिम्री
  rationale: שׁ की ‘श’ ध्वनि और नाम के अंतिम दीर्घ स्वर को हिन्दी में स्वाभाविक रूप से दर्शाया गया है।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: हिब्रू नाम का पठनीय देवनागरी लिप्यंतरण चुना गया है।
