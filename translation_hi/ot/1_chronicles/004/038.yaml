  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वंशावली-शैली रखी गई है। ‘कुल’, ‘प्रधान’ और ‘पैतृक घराने’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि पादटिप्पणियाँ इब्रानी की शाब्दिक अनिश्चितता और रूपक को सुरक्षित रखती हैं।
