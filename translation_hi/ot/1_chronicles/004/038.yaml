  yaml_path: translation/ot/1_chronicles/004/038.yaml
  text: These[a], who were mentioned by name, were leaders in their clans[b], and their ancestral houses increased greatly.
translation:
  language: hi
  text: ये वे लोग थे जिनका नाम लेकर उल्लेख किया गया था। वे अपने-अपने कुलों के प्रधान थे, और उनके पैतृक घराने बहुत बढ़ गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये वे लोग
  rationale: बहुवचन संकेतवाचक शब्द पहले दी गई वंशावली के नामित व्यक्तियों की ओर संकेत करता है; हिन्दी में ‘ये वे लोग’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הַבָּאִים בְּשֵׁמוֹת
  choice: जिनके नाम दर्ज हैं
  rationale: בוא का कृदन्त शाब्दिक रूप से ‘आनेवाले’ है, पर ‘नामों के साथ/नामों से’ के इस वंशावली-संदर्भ में अभिलेख या सूची में नामित किए जाने का भाव अधिक संभावित है। पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: נְשִׂיאִים
  choice: प्रधान
  rationale: यह शब्द कुल या गोत्र के अगुओं को सूचित करता है। ‘प्रधान’ आधुनिक हिन्दी में सामाजिक नेतृत्व व्यक्त करता है और अनावश्यक राजकीय अर्थ से बचता है।
- source_word: בְּמִשְׁפְּחוֹתָם
  choice: अपने-अपने कुलों के
  rationale: वंशावली में מִשְׁפָּחָה केवल निकट परिवार नहीं, बल्कि व्यापक कुल-समूह है; ‘अपने-अपने कुलों के’ बहुवचन संबंध को स्पष्ट और सहज रखता है।
- source_word: וּבֵית אֲבוֹתֵיהֶם
  choice: उनके पैतृक घराने
  rationale: ‘पिताओं का घर’ पितृवंशीय घराने या वंश-समूह का पारिभाषिक भाव रखता है। ‘पैतृक घराने’ आधुनिक हिन्दी में उसी सामाजिक इकाई को अपेक्षाकृत स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פָּרְצוּ לָרֹב
  choice: बहुत अधिक बढ़ गए
  rationale: פָּרַץ में फूटकर फैलने या तेजी से बढ़ने का चित्र है और לָרֹב बहुतायत का भाव देता है। संदर्भ में जनसंख्या या वंश-विस्तार अभिप्रेत है; इसलिए परिणाम को स्पष्ट करने वाला यह अनुवाद चुना गया है।
