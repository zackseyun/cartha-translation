  yaml_path: translation/ot/1_chronicles/004/039.yaml
  text: They went to the entrance of Gedor[a], as far as the east side of the valley[b], to seek pasture for their flocks.
translation:
  language: hi
  text: वे अपने झुंडों के लिए चरागाह ढूँढ़ने को गदोर के प्रवेश-स्थान[a] की ओर, घाटी के पूर्वी भाग[b] तक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गदोर की ओर जानेवाले मार्ग तक’; इब्रानी शब्द प्रवेश, पहुँचने का मार्ग या प्रवेश-स्थल बता सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘घाटी के पूर्व में’ अथवा ‘घाटी के पूर्व की ओर’; इब्रानी में यह एक संक्षिप्त स्थलाकृतिक पदबंध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: वे ... गए
  rationale: הלך के वय्यिक्तोल रूप से कथा में अगली क्रमिक क्रिया व्यक्त होती है; सामान्य हिंदी में ‘गए’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: לִמְבוֹא
  choice: के प्रवेश-स्थान तक
  rationale: מָבוֹא प्रवेश, पहुँचने का मार्ग या प्रवेश-स्थल सूचित कर सकता है। ‘प्रवेश-स्थान’ स्थानिक अर्थ बनाए रखता है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: גְדֹר
  choice: गदोर
  rationale: यह स्थान का नाम है; इसे अनूदित करने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: עַד
  choice: तक
  rationale: यहाँ यह समय नहीं, स्थानिक सीमा बताता है; हिंदी में ‘तक’ संक्षिप्त और स्वाभाविक है।
- source_word: לְמִזְרַח הַגָּיְא
  choice: घाटी के पूर्वी भाग
  rationale: यह संक्षिप्त स्थलाकृतिक पदबंध घाटी की पूर्व दिशा, उसके पूर्वी भाग या उसकी ओर संकेत कर सकता है। मुख्य पाठ में सहज स्थानिक अर्थ चुना गया है और अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְבַקֵּשׁ
  choice: ताकि ... ढूँढ़ें
  rationale: בקש का धातुरूप यहाँ उद्देश्य व्यक्त करता है। ‘ताकि ... ढूँढ़ें’ आधुनिक हिंदी में उद्देश्य स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: מִרְעֶה
  choice: चरागाह
  rationale: यह पशुओं के चरने की जगह या चारेवाली भूमि को दर्शाता है; ‘चरागाह’ सटीक और प्रचलित हिंदी शब्द है।
- source_word: לְצֹאנָם
  choice: अपने झुंडों के लिए
  rationale: צֹאן भेड़ों और बकरियों जैसे छोटे पालतू पशुओं को सामूहिक रूप से सूचित कर सकता है। ‘झुंडों’ से किसी एक पशु-जाति को अनावश्यक रूप से निश्चित नहीं किया जाता।
