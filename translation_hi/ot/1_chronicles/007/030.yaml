  yaml_path: translation/ot/1_chronicles/007/030.yaml
  text: 'The sons of Asher: Imnah[a], Ishvah, Ishvi, and Beriah, and Serah their sister.'
translation:
  language: hi
  text: 'आशेर के पुत्र: यिम्ना[a], यिश्वा, यिश्वी और बेरियाह; और उनकी बहन सेरह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन इब्रानी नामों के लिप्यंतरण अलग-अलग परंपराओं में भिन्न मिलते हैं; जैसे ‘यिम्ना’ को ‘इम्ना’, ‘यिश्वा’ को ‘इशुआ’, और ‘यिश्वी’ को ‘इशूई’ भी लिखा जाता है।
    reason: नामों के प्रचलित वैकल्पिक लिप्यंतरण स्पष्ट करना।
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह ‘पुत्रों’ का संबंधवाचक बहुवचन रूप है। यहाँ तत्काल संतानों की नाम-सूची है, इसलिए व्यापक अर्थ ‘वंशज’ के बजाय ‘पुत्र’ अधिक सटीक है।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: इब्रानी व्यक्ति और गोत्र के नाम का देवनागरी लिप्यंतरण।
- source_word: יִמְנָה
  choice: यिम्ना
  rationale: आरंभिक इब्रानी योद और मसोरेटिक स्वरांकन को दर्शाने वाला सीधा देवनागरी लिप्यंतरण।
- source_word: יִשְׁוָה
  choice: यिश्वा
  rationale: इस पद के इब्रानी व्यंजन और स्वरांकन का निकट देवनागरी लिप्यंतरण।
- source_word: יִשְׁוִי
  choice: यिश्वी
  rationale: मसोरेटिक रूप के अनुसार नाम का लिप्यंतरण।
- source_word: בְרִיעָה
  choice: बरीआ
  rationale: नाम के इब्रानी उच्चारण को सहज आधुनिक हिन्दी रूप में प्रस्तुत करता है और अंतिम स्वर-खंड को बनाए रखता है।
- source_word: שֶׂרַח
  choice: सेरह
  rationale: इस विशिष्ट इब्रानी स्त्री-नाम का लिप्यंतरण; इसे अलग नाम ‘सारा’ से नहीं मिलाया गया है।
- source_word: אֲחוֹתָם
  choice: उनकी बहन
  rationale: प्रत्यय तीसरे पुरुष पुल्लिंग बहुवचन का है; इसलिए सेरह को सूचीबद्ध भाइयों की सामूहिक बहन बताया गया है।
