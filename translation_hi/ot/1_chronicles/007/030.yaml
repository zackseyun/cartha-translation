translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। नामों को अंग्रेज़ी वर्तनी के माध्यम से नहीं, इब्रानी रूपों के आधार पर देवनागरी में लिप्यंतरित किया गया है। अर्धविराम से पुत्रों की सूची और बहन के उल्लेख के बीच स्वाभाविक विभाजन किया गया है।
