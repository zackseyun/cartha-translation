  text: וַ/תֵּ֨לֶד מַעֲכָ֤ה אֵֽשֶׁת מָכִיר֙ בֵּ֔ן וַ/תִּקְרָ֤א שְׁמ/וֹ֙ פֶּ֔רֶשׁ וְ/שֵׁ֥ם אָחִ֖י/ו שָׁ֑רֶשׁ וּ/בָנָ֖י/ו אוּלָ֥ם וָ/רָֽקֶם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/016.yaml
  text: Maacah the wife of Machir bore a son[a], and she called his name Peresh; and the name of his brother was Sheresh[b], and his sons were Ulam and Rakem.
translation:
  language: hi
  text: माकीर की पत्नी माका ने एक पुत्र को जन्म दिया और उसका नाम पेरेश रखा। उसके भाई का नाम शेरेश था, और उसके पुत्र उलाम और राकेम थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: वंशावली के प्रसंग में ילד के इस रूप का स्वाभाविक और स्पष्ट हिन्दी अनुवाद।
- source_word: אֵשֶׁת מָכִיר
  choice: माकीर की पत्नी
  rationale: सम्बन्धसूचक इब्रानी पदबंध को आधुनिक हिन्दी की स्वाभाविक रचना में व्यक्त करता है।
- source_word: בֵּן
  choice: एक पुत्र
  rationale: यहाँ एक पुरुष संतान का परिचय दिया गया है; ‘एक पुत्र’ हिन्दी में अनिश्चित अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַתִּקְרָא שְׁמוֹ
  choice: उसका नाम … रखा
  rationale: शाब्दिक अर्थ ‘उसका नाम पुकारा’ है, पर नामकरण के प्रसंग में ‘नाम रखा’ अधिक स्वाभाविक आधुनिक हिन्दी है।
- source_word: פֶּרֶשׁ
  choice: पेरेश
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: וְשֵׁם אָחִיו
  choice: उसके भाई का नाम … था
  rationale: इब्रानी नामवाचक वाक्य को स्पष्ट और स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: שָׁרֶשׁ
  choice: शेरेश
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: וּבָנָיו
  choice: और उसके पुत्र
  rationale: בנים यहाँ वंशावली में पुरुष वंशजों को सूचित करता है; ‘पुत्र’ उस विशिष्टता को बनाए रखता है। सर्वनाम का संदर्भ मूल पाठ की तरह स्पष्ट रूप से नहीं खोला गया है।
- source_word: אוּלָם
  choice: ऊलाम
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: וָרָקֶם
  choice: और रेकेम
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण; आरम्भिक संयोजक को ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: וּבָנָיו में एकवचन पुरुषवाचक प्रत्यय का पूर्वपद
  choice: ‘उसके पुत्र’ कहकर सर्वनामगत अस्पष्टता बनाए रखी गई
  alternative: ‘शेरेश के पुत्र’ कहकर शेरेश को स्पष्ट पूर्वपद बनाना
  rationale: निकटतम पुरुषवाचक नाम शेरेश है, पर इब्रानी प्रत्यय स्वयं केवल ‘उसके’ कहता है। अनुवाद ने सम्भावित वंशावली-संबंध को व्याख्यात्मक रूप से निश्चित नहीं किया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वंशावली की संक्षिप्त शैली बनी रहती है, जबकि ‘नाम रखा’ जैसे स्वाभाविक हिन्दी मुहावरे से अनावश्यक शाब्दिक कठोरता टाली गई है।
