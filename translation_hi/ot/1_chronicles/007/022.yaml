base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/022.yaml
  text: And Ephraim their father mourned for many days[a], and his brothers came to comfort him.
translation:
  language: hi
  text: और उनके पिता एप्रैम बहुत दिनों तक शोक मनाते रहे, और उनके भाई उन्हें सांत्वना देने आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְאַבֵּל
  choice: शोक मनाते रहे
  rationale: हित्पएल रूप यहाँ मृत्यु के कारण शोक करने को व्यक्त करता है। हिन्दी में निरंतरता सहित यह प्रयोग प्रसंग और ‘बहुत दिनों तक’ के साथ स्वाभाविक है।
- source_word: אֶפְרַיִם
  choice: एप्रैम
  rationale: व्यक्तिवाचक नाम का आधुनिक हिन्दी में प्रचलित बाइबिलीय लिप्यंतरण।
- source_word: אֲבִיהֶם
  choice: उनके पिता
  rationale: पुल्लिंग बहुवचन प्रत्यय का सीधा अर्थ ‘उनके पिता’ है और यह पिछले पद में उल्लिखित पुत्रों की ओर संकेत करता है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह इब्रानी पदबंध अवधि व्यक्त करता है; ‘तक’ हिन्दी में उस अवधि को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: कथात्मक प्रसंग में בוא का सामान्य अर्थ यहाँ एप्रैम के पास ‘आना’ है।
- source_word: אֶחָיו
  choice: उनके भाई
  rationale: אָח का मूल और सहज अर्थ ‘भाई’ है; व्यापक ‘संबंधी’ अर्थ अपनाने के लिए प्रसंग में पर्याप्त कारण नहीं है। सम्मानसूचक हिन्दी-संगति के कारण ‘उनके’ रखा गया है।
- source_word: לְנַחֲמוֹ
  choice: उन्हें सांत्वना देने
  rationale: पिएल में נחם शोकग्रस्त व्यक्ति को सांत्वना देने का अर्थ रखता है; यह आधुनिक, गरिमापूर्ण और व्यापक रूप से समझी जाने वाली हिन्दी है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। एप्रैम के लिए सम्मानसूचक बहुवचन सर्वनाम और क्रिया-संगति अपनाई गई है। किसी वास्तविक अर्थगत विकल्प को फुटनोट की आवश्यकता नहीं मानी गई; अंग्रेज़ी परत का ‘to console him’ मुख्य पाठ के समानार्थी विकल्प है, न कि अलग अर्थ।
