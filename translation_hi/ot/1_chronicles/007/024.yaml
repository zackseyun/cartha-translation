  text: His daughter was Sheerah[a], and she built Lower Beth-horon and Upper Beth-horon[b], and Uzzen-sheerah.
translation:
  language: hi
  text: उसकी बेटी शेएरा थी[a]। उसने निचला बेथ-होरोन, ऊपरी बेथ-होरोन[b] और उज्जेन-शेएरा का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अधिक शाब्दिक अनुवाद “और उसकी बेटी, शेएरा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ केवल “और ऊपरी” है; पिछले वाक्यांश से “बेथ-होरोन” समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִתּוֹ שֶׁאֱרָה
  choice: उसकी बेटी शेरा थी
  rationale: इब्रानी में शाब्दिक क्रम ‘और उसकी बेटी शेरा’ है। हिन्दी वंशावली-शैली में ‘उसकी बेटी शेरा थी’ संबंध और नाम, दोनों को स्वाभाविक तथा स्पष्ट रखता है; आरम्भिक संयोजक का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַתִּבֶן
  choice: उसने ... का निर्माण किया
  rationale: בנה का मूल अर्थ ‘बनाना/निर्माण करना’ है। नगरों के विषय में यह उन्हें बसाने या सुदृढ़ करने को भी समेट सकता है, पर अनावश्यक विशिष्टता जोड़े बिना ‘निर्माण किया’ स्रोत के सबसे निकट है।
- source_word: בֵּית חוֹרוֹן הַתַּחְתּוֹן
  choice: निचले बेथ-होरोन
  rationale: स्थान-नाम का लिप्यंतरण किया गया है और הַתַּחְתּוֹן को हिन्दी में स्वाभाविक विशेषण-क्रम के अनुसार ‘निचले’ रखा गया है।
- source_word: הָעֶלְיוֹן
  choice: ऊपरी बेथ-होरोन
  rationale: इब्रानी में केवल ‘ऊपरी’ है, पर समानांतर रचना में ‘बेथ-होरोन’ स्पष्टतः अध्याहृत है। हिन्दी में संदर्भ स्पष्ट रखने के लिए स्थान-नाम दोहराया गया है।
- source_word: אֻזֵּן שֶׁאֱרָה
  choice: उज्जेन-शेरा
  rationale: इसे एक संयुक्त स्थान-नाम मानकर लिप्यंतरित किया गया है; योजक-चिह्न पाठक को इसे सूची की दो अलग इकाइयाँ समझने से रोकता है।
