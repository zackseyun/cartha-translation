base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/040.yaml
  text: All these were sons of Asher[a], heads of fathers’ houses, select men, mighty warriors, chief leaders; and they were enrolled for service in the army for war. Their number in men was twenty-six thousand.
translation:
  language: hi
  text: ये सभी आशेर के वंशज थे—पितृकुलों के मुखिया, चुने हुए पुरुष, वीर योद्धा और प्रधानों में प्रमुख। वे युद्ध के लिए सेना में वंशावली के अनुसार पंजीकृत थे[a]। उनकी गिनती छब्बीस हज़ार पुरुषों की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध के लिए सेना में उनका नाम दर्ज था।” इतिहास-वृत्तांतों में यह इब्रानी क्रिया प्रायः वंशावली के आधार पर पंजीकरण को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי אָשֵׁר
  choice: आशेर के वंशज
  rationale: वंशावली के प्रसंग में בְּנֵי केवल सीधे पुत्रों तक सीमित नहीं, बल्कि आशेर से उत्पन्न वंशजों को सूचित करता है।
- source_word: רָאשֵׁי בֵית הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह इतिहास-वृत्तांतों में कुल या पूर्वज-आधारित परिवार-समूह के प्रधानों के लिए प्रयुक्त पद है; ‘पितृकुल’ इब्रानी सामाजिक संरचना को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּרוּרִים
  choice: चुने हुए पुरुष
  rationale: निष्क्रिय कृदंत का अर्थ चयनित अथवा विशिष्ट व्यक्ति है; सैन्य संदर्भ में ‘चुने हुए पुरुष’ स्वाभाविक और सटीक है।
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: वीर योद्धा
  rationale: यह सामर्थ्य और युद्ध-कौशल का संयुक्त भाव देता है; ‘वीर योद्धा’ आधुनिक हिन्दी में सहज है और अनावश्यक पुरातनता से बचता है।
- source_word: רָאשֵׁי הַנְּשִׂיאִים
  choice: प्रधानों के मुखिया
  rationale: इब्रानी के दोनों पदों और उसकी संक्षिप्त, कुछ असामान्य संरचना को बनाए रखा गया है। נְשִׂיאִים को यहाँ राजकीय ‘राजकुमार’ न बनाकर समुदाय के ‘प्रधान’ कहा गया है।
- source_word: וְהִתְיַחְשָׂם
  choice: उनका नाम वंशावली के अनुसार दर्ज था
  rationale: इतिहास-वृत्तांतों में יחס का हित्पाएल रूप वंशावली के आधार पर पंजीकरण को दर्शाता है। हिन्दी में यह अभिव्यक्ति प्रशासनिक और वंशावली—दोनों पक्ष स्पष्ट करती है।
- source_word: בַּצָּבָא בַּמִּלְחָמָה
  choice: युद्ध के लिए सेना में
  rationale: दोनों पूर्वसर्गीय पदों का संयुक्त अर्थ सैन्य दल में युद्ध-सेवा के उद्देश्य से पंजीकरण है।
- source_word: מִסְפָּרָם אֲנָשִׁים עֶשְׂרִים וְשִׁשָּׁה אָלֶף
  choice: पुरुषों की उनकी कुल संख्या छब्बीस हज़ार थी
  rationale: अֲנָשִׁים को स्पष्ट रखते हुए हिन्दी वाक्य को स्वाभाविक बनाया गया है और संख्या मानक आधुनिक रूप में दी गई है।
