source:
  edition: WLC
  text: וְ/שֻׁפִּ֤ם וְ/חֻפִּם֙ בְּנֵ֣י עִ֔יר חֻשִׁ֖ם בְּנֵ֥י אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/012.yaml
  text: And Shuppim and Huppim were the sons of Ir[b][a]; Hushim was the son of Aher.
translation:
  language: hi
  text: और शुप्पीम और हुप्पीम ईर के पुत्र थे[b]; हुशीम अहेर के पुत्र थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “अहेर के पुत्र” है। वाक्य-विन्यास कठिन है, क्योंकि बहुवचन “पुत्र” के साथ “हुशीम” एक व्यक्ति के नाम के रूप में आता है। कुछ विद्वान “अहेर” को व्यक्तिवाचक नाम मानते हैं, जबकि दूसरे इसका अर्थ “कोई दूसरा” समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: संबंधित वंशावलियों की तुलना के आधार पर कुछ परंपराओं में इन नामों के रूप “शेफूफाम” और “हूफाम” मिलते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/שֻׁפִּם
  choice: और शुप्पीम
  rationale: व्यक्तिवाचक नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक संयोजक भी रखा गया है।
- source_word: וְ/חֻפִּם
  choice: और हुप्पीम
  rationale: नाम को अनूदित करने के बजाय लिप्यंतरित किया गया है और संयोजक सुरक्षित रखा गया है।
- source_word: בְּנֵי עִיר
  choice: ईर के पुत्र थे
  rationale: वंशावली के संदर्भ में בְּנֵי का सामान्य अर्थ ‘पुत्र’ लिया गया है; इब्रानी के क्रियारहित वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘थे’ जोड़ा गया है। עִיר को मासोरेटिक पाठ के अनुसार ‘ईर’ लिप्यंतरित किया गया है।
- source_word: חֻשִׁם
  choice: हुशीम
  rationale: व्यक्तिवाचक नाम का इब्रानी से सीधा लिप्यंतरण किया गया है।
- source_word: בְּנֵי אַחֵר
  choice: अहेर के पुत्र थे
  rationale: בְּנֵי रूप की व्याकरणिक बहुवचनता को छिपाया नहीं गया है, यद्यपि ‘हुशीम’ एकवचन नाम जैसा दिखाई देता है। אַחֵר को वंशावली के संदर्भ और स्वरांकन के आधार पर व्यक्तिवाचक नाम ‘अहेर’ माना गया है।
theological_decisions:
- issue: हुशीम के साथ बहुवचन בְּנֵי का कठिन मेल
  choice: ‘हुशीम अहेर के पुत्र थे’—बहुवचन ‘पुत्र थे’ को मुख्य पाठ में बनाए रखा गया
  alternative: ‘हुशीम अहेर का पुत्र था’ या ‘हुशीम किसी दूसरे के पुत्र थे’
  rationale: मासोरेटिक पाठ में בְּנֵי स्पष्टतः बहुवचन है। सहज हिन्दी के लिए उसे एकवचन करना पाठ की वास्तविक वाक्यगत कठिनाई को मौन रूप से सुलझा देता; इसलिए कठिनता को रखते हुए पादटिप्पणी में विकल्प बताए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। नामों को इब्रानी के निकट लिप्यंतरित किया गया है। दूसरी उपवाक्य की वास्तविक व्याकरणिक कठिनाई को सहज एकवचन बनाकर मिटाया नहीं गया; उसे मुख्य पाठ और पादटिप्पणी दोनों में पारदर्शी रखा गया है।
