lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: וּ उपसर्ग के संयोजक अर्थ को बनाए रखा गया है, और בְנֵי का वंशावली-संदर्भ में सीधा तथा स्वाभाविक अनुवाद ‘के पुत्र’ है।
- source_word: עֻלָּא
  choice: उल्ला
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण; व्यंजन के द्वित्व को ‘ल्ल’ से दर्शाया गया है।
- source_word: אָרַח
  choice: आरह
  rationale: हिब्रू व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण। अंतिम ח को प्रचलित बाइबलीय हिंदी शैली में ‘ह’ से दर्शाया गया है।
- source_word: חַנִּיאֵל
  choice: हन्नीएल
  rationale: हिब्रू नाम का निकट लिप्यंतरण; दोगुने नून को ‘न्न’ और ईश्वर-सूचक नामांश אֵל को ‘एल’ से दर्शाया गया है।
- source_word: רִצְיָא
  choice: रिस्या
  rationale: हिब्रू ध्वनिरूप के निकट लिप्यंतरण; צ को सामान्य हिंदी पाठक के लिए ‘स’ और व्यंजन-समूह צְי को ‘स्य’ से दर्शाया गया है।
