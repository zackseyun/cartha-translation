lexical_decisions:
- source_word: וּבְנֵי בְרִיעָה
  choice: और बरीआ के पुत्र
  rationale: आरंभिक וּ को ‘और’ से व्यक्त किया गया है; בְנֵי का संबंधवाचक बहुवचन ‘के पुत्र’ वंशावली की संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חֶבֶר
  choice: हेबेर
  rationale: व्यक्तिनाम का प्रचलित बाइबलीय हिन्दी लिप्यंतरण।
- source_word: וּמַלְכִּיאֵל
  choice: और मल्कीएल
  rationale: संयोजक सहित व्यक्तिनाम का निकट लिप्यंतरण।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम पिछले निकटतम एकवचन पुल्लिंग नाम मल्कीएल पर बलपूर्वक लौटता है; ‘वही’ इस पुनरुल्लेख को स्पष्ट रखता है।
- source_word: אֲבִי
  choice: का पिता
  rationale: मूल वंशावली-संज्ञा का औपचारिक अर्थ रखा गया है; इसका अर्थ तत्काल जनक, पूर्वज या किसी कुल/स्थान का संस्थापक भी हो सकता है।
- source_word: ברזות
  choice: बिरज़ोत
  rationale: केतिव में स्वरचिह्नरहित दुर्लभ नाम का सावधान लिप्यंतरण; इसकी ध्वनि और पहचान अनिश्चित हैं।
theological_decisions:
- issue: ‘पिता’ के संबंध का स्वरूप
  choice: मुख्य पाठ में ‘पिता’
  alternative: ‘पूर्वज’ या ‘संस्थापक’
  rationale: אֲבִי को संकीर्ण जैविक अर्थ तक सीमित किए बिना उसका सीधा वंशावलीगत रूप सुरक्षित रखा गया है; संभावित व्यापक अर्थ पाद-टिप्पणी में दिए गए हैं।
