  text: Bezer[a], Hod, Shamma, Shilshah, Ithran[c][b], and Beera.
translation:
  language: hi
  text: बेसेर, होद, शम्मा, शिलशा, यित्रान और बेरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּצֶר
  choice: बेसेर
  rationale: वंशावली में आया व्यक्तिनाम; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: הוֹד
  choice: होद
  rationale: यहाँ सामान्य संज्ञा ‘वैभव’ नहीं, बल्कि व्यक्तिनाम है; इसलिए लिप्यंतरण किया गया है।
- source_word: שַׁמָּא
  choice: शम्मा
  rationale: मसोरेटिक स्वरांकन अंतिम व्यंजनरहित ‘आ’ का समर्थन करता है; इसलिए ‘शम्माह’ के बजाय ‘शम्मा’।
- source_word: שִׁלְשָׁה
  choice: शिलशा
  rationale: हिब्रू रूप का स्वाभाविक हिन्दी लिप्यंतरण; अंतिम ה यहाँ ‘आ’ स्वर को सूचित करता है, अलग ‘ह’ ध्वनि को नहीं।
- source_word: יִתְרָן
  choice: यित्रान
  rationale: आरंभिक י को ‘य’ और ת को ‘त’ से दर्शाते हुए हिब्रू के निकट हिन्दी लिप्यंतरण।
- source_word: בְאֵרָא
  choice: बेरा
  rationale: हिब्रू व्यक्तिनाम का पठनीय हिन्दी रूप; मध्य א से उत्पन्न स्वर-विच्छेद को हिन्दी मुख्य पाठ में अलग चिह्नित नहीं किया गया।
