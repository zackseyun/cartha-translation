  yaml_path: translation/ot/1_chronicles/007/034.yaml
  text: 'And the sons of Shemer: Ahi[a], Rohgah, Jehubbah[b], and Aram.'
translation:
  language: hi
  text: 'और शामेर के पुत्र[a] ये थे: अही, रोहगा, यहुब्बा[b] और अराम।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वंशावलियों में “पुत्र” शब्द केवल सगे बेटों के लिए ही नहीं, बल्कि पुरुष वंशजों या कुल के सदस्यों के लिए भी प्रयुक्त हो सकता है।
    reason: cultural_note
  - marker: b
    text: इस नाम का लिप्यंतरण “यहुब्बा” या “हुब्बा” भी मिलता है; यहाँ इब्रानी के आरम्भिक अक्षर को दर्शाने वाला रूप अपनाया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: संयोजक וּ और סמיכות रूप בְנֵי को स्वाभाविक हिन्दी वंशावली शैली में व्यक्त किया गया है। ‘पुत्र’ मूल के पुल्लिंग बहुवचन को बनाए रखता है, जबकि टिप्पणी इसके व्यापक वंश-संबंधी प्रयोग को स्पष्ट करती है।
- source_word: שָׁמֶר
  choice: शेमेर
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; स्वर-विन्यास को यथासंभव सुरक्षित रखा गया है।
- source_word: אֲחִי
  choice: अही
  rationale: वंशावली में यह व्यक्तिनाम है; इसे अर्थानुवाद न करके इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: וְרוהגה
  choice: रोगहा
  rationale: नाम का देवनागरी लिप्यंतरण किया गया है और आरम्भिक संयोजक को हिन्दी सूची-संरचना में अलग से व्यक्त किया गया है।
- source_word: יחבה
  choice: यहुब्बा
  rationale: आरम्भिक י को ‘य’ और मध्य के द्वित्व-संकेत को ‘ब्ब’ से दर्शाते हुए इब्रानी रूप के निकट लिप्यंतरण चुना गया है।
- source_word: וַאֲרָם
  choice: और अराम
  rationale: संयोजक को ‘और’ तथा אֲרָם को उसके प्रत्यक्ष इब्रानी रूप के अनुसार ‘अराम’ लिखा गया है।
