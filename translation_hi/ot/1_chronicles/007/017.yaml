base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/017.yaml
  text: 'And the sons of Ulam: Bedan. These were the sons of Gilead son of Machir[a], son of Manasseh.'
translation:
  language: hi
  text: 'और ऊलाम के पुत्र: बेदान। ये गिलाद के पुत्र थे—गिलाद, माकीर का पुत्र, मनश्शे का पुत्र।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “ये गिलाद के पुत्र हैं/थे—गिलाद, माकीर का पुत्र, मनश्शे का पुत्र।” यह खंड ऊलाम की वंशरेखा को गिलाद, माकीर और मनश्शे से जोड़ने वाला वंशावली-सार भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: संयोजक ו को वंशावली की सरल कड़ी के रूप में ‘और’ से व्यक्त किया गया है; בְנֵי के लिए प्रचलित वंशावली पद ‘के पुत्र’ रखा गया है।
- source_word: אוּלָם
  choice: ऊलाम
  rationale: व्यक्तिनाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּדָן
  choice: बेदान
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण।
- source_word: אֵלֶּה
  choice: ये ... थे
  rationale: इब्रानी में केवल संकेतवाचक ‘ये’ है; हिंदी में पूर्ण और स्वाभाविक वंशावली वाक्य के लिए भूतकालीन संयोजक ‘थे’ जोड़ा गया है।
- source_word: בְּנֵי גִלְעָד
  choice: गिलाद के पुत्र
  rationale: ‘वंशज’ संभव है, पर ‘पुत्र’ इब्रानी वंशावली की शब्दावली और उसकी संभावित अस्पष्टता को अधिक सीधे सुरक्षित रखता है।
- source_word: בֶּן מָכִיר
  choice: माकीर का पुत्र
  rationale: वंशावली की सीधी कड़ी को औपचारिक रूप से बनाए रखा गया है।
- source_word: בֶּן מְנַשֶּׁה
  choice: मनश्शे का पुत्र
  rationale: वंशावली की सीधी कड़ी को बनाए रखते हुए व्यक्तिनाम का प्रचलित हिंदी बाइबलीय रूप अपनाया गया है।
theological_decisions:
- issue: אֵלֶּה בְּנֵי גִלְעָד खंड का वंशावली संबंध
  choice: मुख्य पाठ में इसे ‘ये गिलाद के पुत्र थे’ के रूप में रखा और अगली कड़ियों को स्पष्ट हिंदी में प्रस्तुत किया गया।
  alternative: इसे ऊलाम की वंशरेखा को गिलाद, माकीर और मनश्शे से जोड़ने वाला वंशावली-सार समझना।
  rationale: इब्रानी वाक्य संबंध को पूरी तरह स्पष्ट नहीं करता। मुख्य पाठ उसके औपचारिक अर्थ को रखता है और पादटिप्पणी सारांशात्मक अर्थ की संभावना बताती है, ताकि अस्पष्टता जबरन समाप्त न हो।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सरल हिंदी रखी गई है। नामों को इब्रानी के निकट लिप्यंतरित किया गया है और संक्षिप्त वंशावली शैली को सुरक्षित रखते हुए आवश्यक हिंदी व्याकरण जोड़ा गया है।
