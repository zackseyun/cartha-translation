base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/015.yaml
  text: Machir took a wife for Huppim and for Shuppim. The name of his sister was Maacah[a], and the name of the second was Zelophehad; and Zelophehad had daughters.
translation:
  language: hi
  text: माकीर ने हुप्पीम और शुप्पीम के लिए एक पत्नी ली। उसकी बहन का नाम माका था, और दूसरे का नाम सलोफाद था[a]; और सलोफाद की बेटियाँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दूसरे पुत्र का नाम सलोफाद था।” इब्रानी में केवल “दूसरे” कहा गया है; वह किसके लिए प्रयुक्त है, यह स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: לָקַח אִשָּׁה
  choice: एक पत्नी ली
  rationale: यह इब्रानी मुहावरा सामान्यतः विवाह करने या पत्नी लेने को व्यक्त करता है। यहाँ आगे आए ‘के लिए’ के कारण असामान्य वाक्य-संरचना को बनाए रखा गया है।
- source_word: לְחֻפִּים וּלְשֻׁפִּים
  choice: हुप्पीम और शुप्पीम के लिए
  rationale: दोनों नामों के साथ प्रयुक्त לְ का आशय ‘के लिए’ है। हिन्दी में अनावश्यक पुनरावृत्ति से बचते हुए दोनों पर उसका संबंध स्पष्ट रखा गया है।
- source_word: וְשֵׁם אֲחֹתוֹ מַעֲכָה
  choice: उसकी बहन का नाम माका था
  rationale: यह नाम बताने वाले सूत्र का स्वाभाविक हिन्दी रूप है। ‘उसकी’ का निकटतम संभव पूर्वपद माकीर है, यद्यपि वंशावली का संदर्भ संक्षिप्त है।
- source_word: וְשֵׁם הַשֵּׁנִי צְלָפְחָד
  choice: और दूसरे का नाम सलोफाद था
  rationale: मूल पाठ में केवल ‘दूसरा’ है; उसका संबंध किससे है, यह स्पष्ट नहीं किया गया। इसलिए ‘पुत्र’ जोड़कर अस्पष्टता को समाप्त नहीं किया गया।
- source_word: וַתִּהְיֶנָה לִצְלָפְחָד בָּנוֹת
  choice: और सलोफाद की बेटियाँ थीं
  rationale: अस्तित्व और अधिकार व्यक्त करने वाली इब्रानी रचना का यह सहज हिन्दी रूप है और बेटियों संबंधी वंशावली-सूचना को ठीक रखता है।
theological_decisions:
- issue: ‘दूसरे’ का वंशावली-संबंध अस्पष्ट है
  choice: मुख्य पाठ में ‘दूसरे’ रखकर निहित संज्ञा नहीं जोड़ी गई
  alternative: ‘दूसरे पुत्र का नाम सलोफाद था’
  rationale: इब्रानी में ‘पुत्र’ स्पष्ट रूप से नहीं है। पाठ की वास्तविक संक्षिप्तता और वंशावलीगत अस्पष्टता को बचाना किसी एक व्याख्या को चुपचाप स्वीकार करने से अधिक उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। व्यक्तिनामों के लिए प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। मूल की असामान्य और संक्षिप्त वंशावलीगत रचना को अत्यधिक स्पष्ट बनाकर उसका अर्थ निर्धारित नहीं किया गया।
