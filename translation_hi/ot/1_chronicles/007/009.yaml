- source_word: עֶשְׂרִים אֶלֶף וּמָאתָיִם
  choice: बीस हज़ार दो सौ
  rationale: मूल संख्या को साहित्यिक शैली के अनुरूप शब्दों में ठीक-ठीक प्रस्तुत किया गया है।
