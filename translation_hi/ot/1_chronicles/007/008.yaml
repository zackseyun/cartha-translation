source:
  edition: WLC
  text: וּ/בְנֵ֣י בֶ֗כֶר זְמִירָ֡ה וְ/יוֹעָ֡שׁ וֶ֠/אֱלִיעֶזֶר וְ/אֶלְיוֹעֵינַ֤י וְ/עָמְרִי֙ וִ/ירֵמ֣וֹת וַ/אֲבִיָּ֔ה וַ/עֲנָת֖וֹת וְ/עָלָ֑מֶת כָּל אֵ֖לֶּה בְּנֵי בָֽכֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/008.yaml
  text: 'And the sons of Becher: Zemirah[a], Joash, Eliezer, Elioenai, Omri, Jeremoth, Abijah, Anathoth, and Alemeth. All these were the sons of Becher.'
translation:
  language: hi
  text: 'और बेकेर के पुत्र ये थे: ज़मीराह, योआश, एलीएजेर, एल्योएनै, ओम्री, यरेमोत[a], अबियाह, अनातोत और आलेमेत। ये सभी बेकेर के पुत्र थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस नाम का लिप्यंतरण “यरीमोत” भी किया जाता है।
    reason: नाम की वैकल्पिक लिप्यंतरण-परंपरा को सुरक्षित रखना।
lexical_decisions:
- source_word: וּבְנֵי בֶכֶר
  choice: और बेकेर के पुत्र ये थे
  rationale: वंशावली के संदर्भ में בְנֵי का स्वाभाविक और सटीक अनुवाद ‘पुत्र’ है; आरंभिक וּ को सूची की निरंतरता दिखाने के लिए ‘और’ से व्यक्त किया गया है। हिंदी में नामों की सूची आरंभ करने हेतु ‘ये थे’ जोड़ा गया है।
- source_word: זְמִירָה
  choice: जमीरा
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण।
- source_word: יוֹעָשׁ
  choice: योआश
  rationale: इब्रानी नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אֱלִיעֶזֶר
  choice: एलीएजेर
  rationale: इब्रानी नाम के स्वर और व्यंजन-क्रम को स्पष्ट रखते हुए देवनागरी लिप्यंतरण।
- source_word: אֶלְיוֹעֵינַי
  choice: एल्योएनै
  rationale: इब्रानी नाम का निकट ध्वन्यात्मक देवनागरी रूप।
- source_word: עָמְרִי
  choice: ओम्री
  rationale: नाम का परिचित हिंदी बाइबलीय रूप।
- source_word: יְרֵמוֹת
  choice: यरेमोत
  rationale: मासोरेटिक स्वरांकन के अनुरूप नाम का लिप्यंतरण; वैकल्पिक हिंदी वर्तनी पाद-टिप्पणी में दी गई है।
- source_word: אֲבִיָּה
  choice: अबियाह
  rationale: अंतिम ה को नाम के पारंपरिक ‘याह’ घटक के रूप में व्यक्त करने वाला प्रचलित लिप्यंतरण।
- source_word: עֲנָתוֹת
  choice: अनातोत
  rationale: यहाँ वंशावली में व्यक्तिवाचक नाम है; इसका अर्थानुवाद न करके लिप्यंतरण किया गया है।
- source_word: עָלָמֶת
  choice: आलेमेत
  rationale: मासोरेटिक स्वरांकन के निकट देवनागरी लिप्यंतरण।
- source_word: כָּל אֵלֶּה בְּנֵי בָכֶר
  choice: ये सभी बेकेर के पुत्र थे
  rationale: इब्रानी सार-वाक्य को सहज आधुनिक हिंदी में प्रस्तुत किया गया है और वंशावली का संबंध स्पष्ट रखा गया है।
