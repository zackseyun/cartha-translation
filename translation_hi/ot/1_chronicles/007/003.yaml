  yaml_path: translation/ot/1_chronicles/007/003.yaml
  text: 'And the sons of Uzzi: Izrahiah. And the sons of Izrahiah: Michael[a], Obadiah, Joel, and Isshiah—five, all of them heads.'
translation:
  language: hi
  text: 'और उज्जी के पुत्र: यिज्रह्याह। और यिज्रह्याह के पुत्र: मीकाएल, ओबद्याह, योएल और यिश्शियाह—कुल पाँच थे, और वे सभी प्रधान थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: वंशावली के मानक संबंध-सूचक पदबंध को रखते हुए आरम्भिक וּ का अनुवाद ‘और’ किया गया है, ताकि सूची की निरंतरता बनी रहे।
- source_word: עֻזִּי
  choice: उज्जी
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: יִזְרַחְיָה
  choice: यिज्रह्याह
  rationale: इब्रानी नाम के व्यंजन और अन्तिम יה को पहचानने योग्य ढंग से दर्शाने वाला देवनागरी लिप्यंतरण; दोनों स्थानों पर एक ही रूप रखा गया है।
- source_word: מִיכָאֵל
  choice: मीकाएल
  rationale: इब्रानी व्यक्तिगत नाम का स्रोत-समीप और हिन्दी में पठनीय लिप्यंतरण।
- source_word: וְעֹבַדְיָה
  choice: ओबद्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; सूची में समुच्चय को हिन्दी विराम-चिह्नों और ‘और’ से व्यक्त किया गया है।
- source_word: וְיוֹאֵל
  choice: योएल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित, स्रोत-समीप देवनागरी रूप।
- source_word: יִשִּׁיָּה
  choice: यिश्शियाह
  rationale: नाम में आए प्रबल שׁ व्यंजन को ‘श्श’ से और अन्तिम יה को ‘याह’ से दर्शाया गया है।
- source_word: חֲמִשָּׁה
  choice: पाँच
  rationale: मूल संख्या का सीधा अनुवाद।
- source_word: רָאשִׁים
  choice: प्रधान
  rationale: रֹאשׁ का मूल अर्थ ‘सिर’ है, पर वंशावली के इस प्रसंग में बहुवचन नेतृत्व या कुल-प्रमुखों को सूचित करता है। ‘प्रधान’ हिन्दी में स्वाभाविक है और पद की व्यापकता बनाए रखता है।
- source_word: כֻּלָּם
  choice: वे सभी
  rationale: समूह पर दिए गए इब्रानी बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
