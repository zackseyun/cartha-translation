  text: His sister Hammoleketh bore Ishhod[a], Abiezer, and Mahlah.
translation:
  language: hi
  text: उसकी बहन हम्मोलेकेत[a] ने इशहोद, अबीएजेर और महला को जन्म दिया।
  philosophy: optimal-equivalence
