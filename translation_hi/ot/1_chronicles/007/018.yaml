  - marker: a
    text: 'हिब्रू: हम्मोलेकेत; संभवतः ‘मोलेकेत’। इस नाम का रूप ‘रानी’ या ‘शासन करने वाली’ अर्थ वाले शब्द से संबंधित है, पर यहाँ इसे व्यक्तिगत नाम समझना सबसे उपयुक्त है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֹתוֹ
  choice: उसकी बहन
  rationale: וַ से वंशावली की पिछली बात से संबंध जुड़ता है; हिन्दी में अलग वाक्य के आरम्भ पर इसे व्यक्त किए बिना भी संबंध स्पष्ट और शैली स्वाभाविक रहती है। אֲחֹתוֹ का अर्थ ‘उसकी बहन’ है।
- source_word: הַמֹּלֶכֶת
  choice: हम्मोलेकेत
  rationale: वंशावली के संदर्भ में यह स्त्री का व्यक्तिगत नाम है, इसलिए अर्थानुवाद ‘रानी’ करने के बजाय लिप्यंतरण किया गया है। हिब्रू रूप के आरम्भिक लेख-सदृश तत्व को नाम के पारंपरिक रूप में रखा गया है।
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: स्त्रीलिंग क्रिया मातृत्व को स्पष्ट करती है; हिन्दी वंशावली में ‘को जन्म दिया’ सहज और सटीक है।
- source_word: אִישְׁהוֹד
  choice: ईशहोद
  rationale: व्यक्तिगत नाम का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण।
- source_word: אֲבִיעֶזֶר
  choice: अबीएजेर
  rationale: व्यक्तिगत नाम का देवनागरी लिप्यंतरण; हिब्रू व्यंजन ע को हिन्दी में पृथक रूप से व्यक्त नहीं किया गया।
- source_word: מַחְלָה
  choice: महला
  rationale: व्यक्तिगत नाम का सीधा देवनागरी लिप्यंतरण।
theological_decisions: []
