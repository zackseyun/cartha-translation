  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। नामों को अनूदित करने के बजाय देवनागरी में लिप्यंतरित किया गया है; पाठ में प्रत्येक पाद-टिप्पणी संकेत स्पष्ट रूप से दिया गया है।
