base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/035.yaml
  text: 'The son of Helem his brother: Zophah[a], Imna, Shelesh, and Amal.'
translation:
  language: hi
  text: 'और उसके भाई हेलेम का पुत्र: सोपह[a], यिम्ना, शेलेश और आमाल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नाम צוֹפַח का लिप्यंतरण ‘सोपख’ भी किया जा सकता है, क्योंकि अंतिम हिब्रू अक्षर ח को अलग-अलग परंपराओं में ‘ह’ या ‘ख’ से दर्शाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבֶן
  choice: और ... के पुत्र
  rationale: בֶן का रूप एकवचन है, पर इसके बाद चार नामों की सूची है; वंशावली के स्वाभाविक हिन्दी रूप में संबंध को स्पष्ट करने के लिए बहुवचन ‘पुत्र’ रखा गया है, जबकि आरम्भिक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: הֵלֶם
  choice: हेलेम
  rationale: व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אָחִיו
  choice: उसके भाई
  rationale: तीसरे पुरुष एकवचन प्रत्यय को ‘उसके’ से व्यक्त किया गया है। इसका पूर्वपद पिछले पद के व्यक्ति की ओर संकेत करता है, पर पाठ स्वयं उसका नाम यहाँ नहीं दोहराता; इसलिए अस्पष्टता सुरक्षित रखी गई है।
- source_word: צוֹפַח
  choice: सोपह
  rationale: हिब्रू नाम צוֹפַח का हिन्दी में सुबोध लिप्यंतरण; आरम्भिक צ को ‘स’ और अंतिम ח को ‘ह’ से दर्शाया गया है।
- source_word: וְיִמְנָע
  choice: यिम्ना
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण; सूची के संयोजक वाव को हिन्दी विराम-चिह्न और अंतिम ‘और’ के द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וְשֵׁלֶשׁ
  choice: शेलेश
  rationale: व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וְעָמָל
  choice: और आमाल
  rationale: अंतिम नाम से पहले हिब्रू संयोजक को हिन्दी ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: एकवचन ‘पुत्र’ और चार नामों की सूची के बीच व्याकरणिक तनाव
  choice: मुख्य पाठ में ‘पुत्र’ बहुवचन
  alternative: शाब्दिक रूप से ‘पुत्र’ एकवचन
  rationale: मसोरेटी पाठ में וּבֶן एकवचन है, किंतु उसके बाद चार समन्वित नाम आते हैं। हिन्दी में एकवचन रखने से वाक्य अस्वाभाविक और भ्रामक होगा; वंशावली का आशय स्पष्ट करते हुए बहुवचन चुना गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त वंशावली-शैली और सम्मानपूर्ण बाइबलीय लहजा। नामों को मूल हिब्रू के निकट रखते हुए देवनागरी में सुगम बनाया गया है।
