base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/028.yaml
  text: Their holdings and settlements were Bethel and its daughter towns[a], and to the east Naaran, and to the west Gezer and its daughter towns, and Shechem and its daughter towns[c][b], as far as Ayyah and its daughter towns.
translation:
  language: hi
  text: 'उनकी भूमि-संपत्ति और बस्तियाँ ये थीं: बेतेल और उसके आश्रित नगर[b]; पूर्व में नारान[a]; और पश्चिम में गेजेर और उसके आश्रित नगर[b], शकेम और उसके आश्रित नगर[b], अय्या[c] और उसके आश्रित नगरों[b] तक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ लोग अन्यत्र मिलने वाली संबंधित स्थान-नाम परंपरा के आधार पर इसे ‘नाराह’ पढ़ते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उसकी बेटियाँ’ है। यह मुख्य नगर के अधीन छोटे नगरों या गाँवों के लिए प्रयुक्त मुहावरा है।
    reason: cultural_note
  - marker: c
    text: इब्रानी पाठ में ‘अय्या’ है; कुछ प्राचीन पाठ-साक्ष्य और अनुवाद इसके स्थान पर ‘गाज़ा’ दर्शाते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: אֲחֻזָּתָם
  choice: उनके अधिकार की भूमि
  rationale: यह शब्द यहाँ क्षेत्रीय भू-संपत्ति या अधिकार में आए भूभाग को दर्शाता है। यह अभिव्यक्ति भौगोलिक सूची के संदर्भ में स्वाभाविक है और ‘विरासत’ जैसा अतिरिक्त धर्मवैचारिक अर्थ नहीं जोड़ती।
- source_word: מֹשְׁבוֹתָם
  choice: बस्तियाँ
  rationale: क्षेत्रीय संदर्भ में यह निवास के स्थानों को दर्शाता है; आधुनिक हिन्दी में ‘बस्तियाँ’ सहज और स्पष्ट है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: इस प्रसिद्ध स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְנֹתֶיהָ
  choice: उसके अधीन नगर
  rationale: शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर यह मुख्य नगर से जुड़े छोटे आश्रित नगरों या गाँवों के लिए इब्रानी मुहावरा है। ‘अधीन नगर’ अर्थ को स्पष्ट रूप से व्यक्त करता है; मूल रूपक को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: לַמִּזְרָח
  choice: पूर्व में
  rationale: यह क्षेत्र की पूर्वी दिशा या सीमा का संकेत देता है; हिन्दी में संक्षिप्त और स्वाभाविक।
- source_word: נַעֲרָן
  choice: नारान
  rationale: मसोरेटी पाठ के व्यंजन और स्वरांकन इसी स्थान-नाम का समर्थन करते हैं; वैकल्पिक नाम-परंपरा पाद-टिप्पणी में दी गई है।
- source_word: לַמַּעֲרָב
  choice: पश्चिम में
  rationale: पूर्व दिशा के समानांतर पश्चिमी दिशा या विस्तार को स्पष्ट करता है।
- source_word: גֶּזֶר
  choice: गेजेर
  rationale: इब्रानी स्थान-नाम का निकट हिन्दी लिप्यंतरण।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: इब्रानी स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עַד
  choice: तक
  rationale: यह भौगोलिक विस्तार की अंतिम सीमा बताता है; हिन्दी वाक्य में ‘तक’ सबसे स्वाभाविक है।
- source_word: עַיָּה
  choice: अय्या
  rationale: मसोरेटी पाठ עַיָּה को लिप्यंतरित किया गया है। कुछ प्राचीन साक्ष्यों में मिलने वाले ‘गाज़ा’ को मुख्य पाठ में अपनाने के बजाय पाद-टिप्पणी में रखा गया है।
