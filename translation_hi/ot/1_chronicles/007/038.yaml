    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: और … के पुत्र ये थे
  rationale: בְּנֵי वंशावली में प्रयुक्त ‘पुत्र’ का संबंधवाचक बहुवचन रूप है। हिन्दी में सूची का स्वाभाविक परिचय देने के लिए ‘के पुत्र ये थे’ रखा गया है; आरंभिक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: יֶתֶר
  choice: येतेर
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: יְפֻנֶּה
  choice: यपुन्ने
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; इसका अनुवाद नहीं किया गया।
- source_word: וּפִסְפָּה
  choice: पिस्पा
  rationale: आरंभिक संयोजक सूची की हिन्दी संरचना में समाहित है। नाम के अंत का ה संभवतः उच्चरित नहीं होता, इसलिए मुख्य पाठ में ‘पिस्पा’ रखा गया है।
- source_word: וַאְרָא
  choice: और अरा
  rationale: वंशावली के अंतिम व्यक्तिनाम के साथ लगे संयोजक וַ को स्वाभाविक हिन्दी सूची में ‘और’ से व्यक्त किया गया है।
