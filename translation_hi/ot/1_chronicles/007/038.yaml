  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वंशावली की संक्षिप्त सूची-शैली को बनाए रखते हुए हिन्दी में स्पष्टता के लिए ‘ये थे’ जोड़ा गया है। स्रोत और दिए गए अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी-चिह्न का स्थान मेल नहीं खाता था; चूँकि पाद-टिप्पणी पिस्पा नाम के रूपांतर से संबंधित है, चिह्न उसी नाम के बाद रखा गया है।
