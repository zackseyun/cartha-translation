- source_word: סוּחַ
  choice: सूअह
  rationale: हिब्रू व्यक्तिनाम में ऊ स्वर और अंतिम कंठ्य व्यंजन को हिन्दी में निकट रूप से दर्शाता है।
- source_word: חַרְנֶפֶר
  choice: हरनेपेर
  rationale: हिब्रू व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण; פ को यहाँ विस्फोटक ‘प’ के रूप में रखा गया है।
- source_word: שׁוּעָל
  choice: शूआल
  rationale: इस वंशावली में यह व्यक्तिनाम है; इसलिए सामान्य संज्ञा के अर्थ में अनुवाद न करके लिप्यंतरण किया गया है।
- source_word: בֵרִי
  choice: बेरी
  rationale: मसोरेटी स्वरांकन के अनुसार व्यक्तिनाम का स्वाभाविक हिन्दी लिप्यंतरण।
- source_word: יִמְרָה
  choice: यिम्रा
  rationale: आरंभिक हिब्रू योध को ‘यि’ और संयुक्त व्यंजन को स्वाभाविक हिन्दी रूप ‘म्र’ से दर्शाया गया है।
