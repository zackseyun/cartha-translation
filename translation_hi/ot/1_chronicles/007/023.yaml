base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/023.yaml
  text: Then he went in to his wife[a], and she conceived and bore a son, and he called his name Beriah[c][b], because disaster had been in his house.
translation:
  language: hi
  text: फिर वह अपनी पत्नी के पास गया, और उसकी पत्नी गर्भवती हुई और उसने एक पुत्र को जन्म दिया। उसने उसका नाम बरीआ[a] रखा, क्योंकि उसके घर में विपत्ति थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बरीआ’ नाम इब्रानी शब्द ‘विपत्ति’ के साथ शब्द-खेल करता है।
    reason: wordplay
lexical_decisions:
- source_word: וַיָּבֹא אֶל אִשְׁתּוֹ
  choice: वह अपनी पत्नी के पास गया
  rationale: यह इब्रानी में दाम्पत्य संबंध का शिष्ट संकेत है। हिन्दी में यह अभिव्यक्ति मूल की संकेतात्मकता बनाए रखते हुए प्रसंग में स्वाभाविक और समझने योग्य है।
- source_word: וַתַּהַר
  choice: वह गर्भवती हुई
  rationale: गर्भधारण के लिए आधुनिक मानक हिन्दी की स्पष्ट और स्वाभाविक अभिव्यक्ति।
- source_word: וַתֵּלֶד בֵּן
  choice: उसने एक पुत्र को जन्म दिया
  rationale: इब्रानी जन्म-वर्णन का स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: וַיִּקְרָא אֶת שְׁמוֹ בְּרִיעָה
  choice: उसने उसका नाम बरीआ रखा
  rationale: शाब्दिक नामकरण-सूत्र का हिन्दी में स्वाभाविक समतुल्य; कर्ता पुल्लिंग एकवचन है, इसलिए नाम पिता ने रखा।
- source_word: בְּרִיעָה
  choice: बरीआ
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण; नाम और רָעָה के बीच निहित शब्द-संबंध को टिप्पणी में स्पष्ट किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: नाम रखने का कारण प्रस्तुत करने वाले इब्रानी संबंधबोधक का स्पष्ट हिन्दी समतुल्य।
- source_word: בְרָעָה
  choice: विपत्ति
  rationale: यहाँ नैतिक बुराई नहीं, बल्कि परिवार पर आई दुःखद घटना या अनिष्ट अभिप्रेत है; ‘विपत्ति’ उस अर्थ को संक्षेप और गरिमा से व्यक्त करती है।
- source_word: הָיְתָה בְּבֵיתוֹ
  choice: उसके घर में विपत्ति आई थी
  rationale: मूल का शाब्दिक भाव ‘उसके घर में विपत्ति थी’ है। हिन्दी में ‘आई थी’ उस परिवार पर घट चुकी विपत्ति को स्वाभाविक ढंग से व्यक्त करता है, जबकि ‘घर’ मूल בית की पारिवारिक व्यापकता बनाए रखता है।
theological_decisions:
- issue: בְרָעָה का अर्थ
  choice: विपत्ति
  alternative: बुराई
  rationale: निकटवर्ती प्रसंग में एप्रैम के पुत्रों की मृत्यु के कारण उसके परिवार पर आए दुःख का उल्लेख है; इसलिए यहाँ नैतिक बुराई नहीं, विपत्ति या अनिष्ट अभिप्रेत है।
- issue: בְּרִיעָה और בְרָעָה के बीच शब्द-संबंध
  choice: मुख्य पाठ में नाम का लिप्यंतरण, पादटिप्पणी में शब्द-संबंध
  alternative: नाम का अर्थ सीधे मुख्य पाठ में अनूदित करना
  rationale: व्यक्ति-नाम को नाम के रूप में रखना आवश्यक है, पर लेखक द्वारा दिए गए नामकरण-कारण को छिपाना भी उचित नहीं; पादटिप्पणी दोनों बातों को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण ऐतिहासिक-वर्णन शैली अपनाई गई है। मूल के दाम्पत्य-संबंधी शिष्ट संकेत को स्पष्ट किए बिना सुरक्षित रखा गया है। ‘घर’ यहाँ भवन के साथ-साथ परिवार या घराने को भी सूचित करता है।
