  text: Rephah his son[a], Resheph, Telah his son, Tahan his son.
translation:
  language: hi
  text: और उसका पुत्र रेपह[a], और रेशेफ, और उसका पुत्र तेलह, और उसका पुत्र तहन।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू वंशावलियों में प्रायः क्रिया स्पष्ट रूप से नहीं लिखी जाती। यहाँ वंशजों की एक संक्षिप्त सूची है: “उसका पुत्र रेपह, और रेशेफ, और उसका पुत्र तेलह, और उसका पुत्र तहन।”'
    reason: cultural_note
lexical_decisions:
- source_word: רֶפַח
  choice: रेपाह
  rationale: वंशावली में यह व्यक्तिवाचक नाम है; हिब्रू उच्चारण के निकट और हिन्दी में पठनीय रूप रखा गया है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: पुल्लिंग एकवचन संबंधसूचक प्रत्यय सहित संज्ञा का स्वाभाविक हिन्दी रूप; दोहराई गई वंशावली-संरचना को बनाए रखा गया है।
- source_word: רֶשֶׁף
  choice: रेशेप
  rationale: यहाँ वंशावली के संदर्भ में व्यक्तिवाचक नाम है; इसके अन्य शाब्दिक अर्थ इस प्रसंग में लागू नहीं किए गए। अंतिम व्यंजन פ का ध्वन्यात्मक रूप ‘प’ रखा गया है।
- source_word: תֶלַח
  choice: तेलह
  rationale: व्यक्तिवाचक नाम का हिब्रू के निकट, सामान्य पाठकों के लिए सरल लिप्यंतरण।
- source_word: תַחַן
  choice: तहन
  rationale: व्यक्तिवाचक नाम का हिब्रू के निकट और हिन्दी में पठनीय लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: उपसर्गीय समुच्चयबोधक को सूची की संरचना स्पष्ट रखने के लिए ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: वंशावली में निहित क्रिया और नामों के संबंध की अस्पष्टता
  choice: हिन्दी वाक्य की पूर्णता के लिए अंत में ‘था’ जोड़ा और सूची-सदृश क्रम बनाए रखा गया।
  alternative: हर नाम के साथ ‘उसका पुत्र था’ स्पष्ट रूप से दोहराना।
  rationale: हिब्रू पाठ में स्पष्ट क्रिया नहीं है और संबंध-सूत्र संक्षिप्त है। विस्तृत क्रियाएँ जोड़ने से पाठ में निहित से अधिक निश्चित संबंध स्थापित हो सकता था; इसलिए मूल की संक्षिप्तता और संभावित अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वंशावली-रजिस्टर। नामों को अनूदित नहीं, हिब्रू से लिप्यंतरित किया गया है। मूल की संक्षिप्त सूची-रचना और अस्पष्ट संबंधों को अनावश्यक रूप से स्पष्ट नहीं किया गया।
