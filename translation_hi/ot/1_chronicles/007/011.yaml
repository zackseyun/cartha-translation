source:
  edition: WLC
  text: כָּל אֵ֜לֶּה בְּנֵ֤י יְדִֽיעֲאֵל֙ לְ/רָאשֵׁ֣י הָ/אָב֔וֹת גִּבּוֹרֵ֖י חֲיָלִ֑ים שִׁבְעָֽה עָשָׂ֥ר אֶ֨לֶף֙ וּ/מָאתַ֔יִם יֹצְאֵ֥י צָבָ֖א לַ/מִּלְחָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/011.yaml
  text: All these were sons of Jediael[a], according to the heads of the fathers’ houses, mighty men of valor, seventeen thousand two hundred[d][c][b], able to go out in the army for war.
translation:
  language: hi
  text: ये सभी यदीएल के पुत्र[a] थे; पितृकुलों के मुखियाओं[b] की गणना के अनुसार वे वीर योद्धा[c] थे। इनकी संख्या सत्रह हज़ार दो सौ थी, जो युद्ध के लिए सेना में जाने योग्य थे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदीएल के वंशज।” वंशावलियों में “पुत्र” के लिए प्रयुक्त इब्रानी शब्द का अर्थ व्यापक होकर वंशज भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात कुलों या विस्तृत परिवारों के मुखिया।
    reason: cultural_note
  - marker: c
    text: 'शाब्दिक रूप के अधिक निकट: “पराक्रमी वीर पुरुष।”'
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से “युद्ध के लिए सेना में निकलनेवाले”; यह सैन्य सेवा के लिए उपलब्ध या योग्य पुरुषों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: इब्रानी के संक्षिप्त समाहार-वाक्यांश को बिना कोई अनावश्यक संज्ञा जोड़े स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּנֵי יְדִיעֲאֵל
  choice: यदीएल के पुत्र
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है; वंशावली में इसका व्यापक अर्थ ‘वंशज’ भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לְרָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखियाओं के अनुसार
  rationale: यह पद वंश या कुल की पैतृक इकाइयों के प्रधानों को दर्शाता है। ‘पितृकुल’ आधुनिक हिन्दी में उस सामाजिक संरचना को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: वीर योद्धा
  rationale: यह अभिव्यक्ति युद्ध में समर्थ और पराक्रमी पुरुषों को सूचित करती है; ‘वीर योद्धा’ गरिमापूर्ण और सहज आधुनिक हिन्दी है।
- source_word: שִׁבְעָה עָשָׂר אֶלֶף וּמָאתַיִם
  choice: सत्रह हज़ार दो सौ
  rationale: इब्रानी में दी गई निश्चित गणना को शब्दों में पूर्ण रूप से रखा गया है।
- source_word: יֹצְאֵי צָבָא לַמִּלְחָמָה
  choice: जो युद्ध के लिए सेना में जाने योग्य थे
  rationale: शाब्दिक रूप से ‘युद्ध के लिए सेना में निकलनेवाले’ है; प्रसंग में यह सैन्य सेवा के लिए उपलब्ध अथवा योग्य पुरुषों का मुहावरा है। हिन्दी रूप मूल सैन्य बिंब और उसका आशय दोनों बनाए रखता है।
