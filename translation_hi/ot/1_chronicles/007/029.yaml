  rationale: यह भौगोलिक सूची में क्षेत्रीय निकटता या सीमा से लगे होने का संकेत देता है; शाब्दिक ‘हाथों के पास’ आधुनिक हिन्दी में अर्थ स्पष्ट नहीं करता।
- source_word: בְנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों
  rationale: यहाँ ‘पुत्र’ व्यक्तिगत बेटों के बजाय मनश्शे के गोत्रीय वंशजों को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में अभिप्राय स्पष्ट करता है।
- source_word: בֵּית שְׁאָן
  choice: बेत-शान
  rationale: मसोरेटिक स्वरांकन के अनुरूप स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: וּבְנֹתֶיהָ / וּבְנוֹתֶיהָ
  choice: और उसके अधीन नगर
  rationale: इब्रानी का शाब्दिक अर्थ ‘उसकी बेटियाँ’ है, पर नगर-सूचियों में यह मुख्य नगर पर निर्भर आसपास की बस्तियों या नगरों के लिए प्रचलित रूपक है।
- source_word: תַּעְנַךְ
  choice: तानाक
  rationale: स्थान-नाम का सरल हिन्दी लिप्यंतरण।
- source_word: מְגִדּוֹ
  choice: मगिद्दो
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: דּוֹר
  choice: दोर
  rationale: स्थान-नाम का सीधा हिन्दी लिप्यंतरण।
- source_word: בְאֵלֶּה
  choice: इन्हीं स्थानों में
  rationale: यह पद पहले गिनाए गए नगरों और उनकी अधीन बस्तियों की ओर संकेत करता है; ‘स्थानों’ जोड़ने से हिन्दी में संदर्भ स्पष्ट होता है।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: सन्दर्भ में क्रिया लगातार निवास करने का बोध देती है; यह आधुनिक हिन्दी का स्वाभाविक रूप है।
- source_word: בְּנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: इस्राएल के पुत्र यूसुफ के वंशज
  rationale: यूसुफ का इस्राएल से पुत्र-संबंध बनाए रखते हुए, ‘यूसुफ के पुत्र’ को गोत्रीय वंशजों के अर्थ में स्पष्ट किया गया है।
