base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/029.yaml
  text: And along the borders of the sons of Manasseh were Beth-shean and its daughter towns[a], Taanach and its daughter towns, Megiddo and its daughter towns, Dor and its daughter towns[b]. In these lived the sons of Joseph son of Israel.
translation:
  language: hi
  text: मनश्शे के वंशजों के क्षेत्र की सीमा पर[a] बेत-शेआन और उसके अधीन नगर[b], तानाक और उसके अधीन नगर, मगिद्दो और उसके अधीन नगर, तथा दोर और उसके अधीन नगर थे। इन्हीं स्थानों में इस्राएल के पुत्र यूसुफ के वंशज रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अधिक शाब्दिक अनुवाद ‘मनश्शे के वंशजों के पास’ भी हो सकता है; यहाँ इब्रानी मुहावरा क्षेत्रीय निकटता या सीमा से लगे होने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसकी बेटियाँ’; यह मुख्य नगर पर निर्भर आसपास की बस्तियों या छोटे नगरों के लिए प्रचलित इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
