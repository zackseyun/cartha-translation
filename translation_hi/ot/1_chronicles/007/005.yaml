base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/005.yaml
  text: And their brothers[a], throughout all the families of Issachar, were mighty men of valor, eighty-seven thousand in all[b], enrolled by genealogy.
translation:
  language: hi
  text: और उनके भाई-बन्धु[a], इस्साकार के सभी कुलों में, वीर योद्धा थे; वंशावली में दर्ज[b] वे कुल मिलाकर सत्तासी हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘भाई’; वंशावली और कुल के संदर्भ में इसका अर्थ ‘कुल-सम्बन्धी’ या ‘रिश्तेदार’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वंशावली में पंजीकृत।” हिब्रू क्रिया का अर्थ वंशावली के अभिलेखों में दर्ज या पंजीकृत होना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई-बन्धु
  rationale: आख्यान का संबंध बनाए रखने के लिए आरम्भिक וַ को ‘और’ से व्यक्त किया गया है। वंशावली के संदर्भ में אָח सगे भाइयों से आगे व्यापक कुल-संबंधियों को भी सूचित कर सकता है; ‘भाई-बन्धु’ इस विस्तार को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְכֹל מִשְׁפְּחוֹת יִשָׂשכָר
  choice: इस्साकार के सभी कुलों में
  rationale: यहाँ לְכֹל संबंध अथवा दायरे को सूचित करता है। ‘सभी कुलों में’ इस्साकार की समस्त कुल-शाखाओं में फैले हुए समूह का भाव देता है।
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: वीर योद्धा
  rationale: यह रूढ़ हिब्रू पद शक्तिशाली और युद्ध-कुशल पुरुषों को दर्शाता है। ‘वीर योद्धा’ आधुनिक हिन्दी में संक्षिप्त, गरिमामय और स्पष्ट है।
- source_word: שְׁמוֹנִים וְשִׁבְעָה אֶלֶף
  choice: सत्तासी हज़ार
  rationale: मूल पाठ की संख्या को सामान्य हिन्दी बाइबिलीय गद्य में शब्दों द्वारा सीधे व्यक्त किया गया है।
- source_word: הִתְיַחְשָׂם
  choice: वंशावली में दर्ज
  rationale: יחשׂ के हित्पएल रूप का आशय वंश-संबंधी अभिलेख में गिने या पंजीकृत किए जाने से है। ‘वंशावली में दर्ज’ प्रशासनिक और वंशावलीगत दोनों अर्थों को सहज हिन्दी में व्यक्त करता है।
- source_word: לַכֹּל
  choice: कुल संख्या
  rationale: यह पद पूरे समूह के योग को दर्शाता है। वाक्य-विन्यास में ‘उनकी कुल संख्या’ हिन्दी में स्पष्ट रूप से यही समाहारक अर्थ देता है।
