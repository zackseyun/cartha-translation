base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/007.yaml
  text: 'And the sons of Bela: Ezbon[a], Uzzi, Uzziel, Jerimoth, and Iri—five heads of fathers’ houses, mighty men of valor; and their genealogical enrollment was twenty-two thousand and thirty-four.'
translation:
  language: hi
  text: 'बेला के पुत्र ये थे: एत्सबोन, उज्जी, उज्जीएल, यरीमोत और ईरी। ये पाँचों पैतृक कुलों के मुखिया और वीर योद्धा थे। वंशावली में उनकी पंजीकृत संख्या[a] बाईस हज़ार चौंतीस थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी वंशावली”; अथवा, “वंशावली के आधार पर उनका पंजीकरण।” इब्रानी शब्द का संबंध वंशावली के अभिलेखों में दर्ज किए जाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי בֶלַע
  choice: बेला के पुत्र ये थे
  rationale: בְנֵי का मूल अर्थ ‘पुत्र’ है और इसके बाद पाँच पुरुषों के नाम आते हैं। आरंभिक ו को हिंदी में स्वाभाविक कथात्मक प्रवाह के लिए अलग से ‘और’ नहीं बनाया गया।
- source_word: אֶצְבּוֹן וְעֻזִּי וְעֻזִּיאֵל וִירִימוֹת וְעִירִי
  choice: एसबोन, उज्जी, उज्जीएल, यरीमोत और ईरी
  rationale: व्यक्तिनामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: חֲמִשָּׁה רָאשֵׁי בֵּית אָבוֹת
  choice: ये पाँचों अपने-अपने पितृकुल के मुखिया
  rationale: בֵּית אָבוֹת इतिहास की कुल-आधारित सामाजिक इकाई है; ‘पितृकुल’ इसे संक्षिप्त और स्पष्ट रूप में व्यक्त करता है। बहुवचन संरचना को स्वाभाविक हिंदी में ‘अपने-अपने पितृकुल’ से प्रकट किया गया है।
- source_word: גִּבּוֹרֵי חֲיָלִים
  choice: वीर योद्धा
  rationale: यह पद सामर्थ्यवान और युद्ध में सक्षम पुरुषों का संकेत देता है। ‘वीर योद्धा’ आधुनिक हिंदी में स्वाभाविक रहते हुए सैन्य आशय बनाए रखता है।
- source_word: וְהִתְיַחְשָׂם
  choice: वंशावली में उनकी पंजीकृत संख्या
  rationale: יחש का हित्पएल रूप इतिहास की पुस्तकों में वंशावली-अभिलेख में दर्ज किए जाने को बताता है। अगली संख्या के साथ हिंदी में यह पदबंध अर्थ को स्पष्ट करता है, जबकि वैकल्पिक व्याकरणिक समझ पादटिप्पणी में सुरक्षित है।
- source_word: עֶשְׂרִים וּשְׁנַיִם אֶלֶף וּשְׁלֹשִׁים וְאַרְבָּעָה
  choice: बाईस हज़ार चौंतीस
  rationale: इब्रानी संख्या-रचना ठीक 22,034 दर्शाती है; साहित्यिक पाठ के अनुरूप इसे शब्दों में दिया गया है।
