  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। व्यक्तिनामों का अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘Tola’ के बाद था, पर उसकी पादटिप्पणी ‘Puah’ से संबंधित है; इसलिए स्रोत-संगति हेतु हिन्दी मुख्य पाठ में [a] ‘पूआ’ के बाद रखा गया है।
