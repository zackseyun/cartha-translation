base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/001.yaml
  text: 'The sons of Issachar: Tola[a], Puah, Jashub[b], and Shimron—four.'
translation:
  language: hi
  text: 'इस्साकार के पुत्र: तोला, पूआ[a], याशूब[b] और शिम्रोन—कुल चार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘पूआ’; अन्य वंशावलियों में पाए जाने वाले समानांतर रूप के आधार पर कुछ अनुवादों में ‘पूवा’ है।
    reason: alternative_reading
  - marker: b
    text: यहाँ इब्रानी पाठ में ‘याशूब’; उत्पत्ति 46:13 में समानांतर नामरूप ‘यिश्वी’ है।
    reason: cross_reference
lexical_decisions:
- source_word: וְ/לִ/בְנֵי
  choice: के पुत्र
  rationale: यह पदबंध नई वंशावली का परिचय देता है। हिन्दी में संबंधसूचक ‘के पुत्र’ स्वाभाविक है; आरम्भिक संयोजक को अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: इब्रानी व्यक्तिनाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: תּוֹלָע
  choice: तोला
  rationale: वंशावली में आए व्यक्तिनाम का निकट हिन्दी लिप्यंतरण।
- source_word: וּ/פוּאָה
  choice: पूआ
  rationale: मसोरेटी स्वरांकन pūʾāh के अनुरूप लिप्यंतरण; समानांतर सूचियों से जुड़ा वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: ישיב
  choice: याशूब
  rationale: इतिहास की इस पुस्तक में उपस्थित नामरूप का अनुसरण किया गया है; उत्पत्ति 46:13 का भिन्न समानांतर रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְ/שִׁמְרוֹן
  choice: और शिम्रोन
  rationale: सूची के अंतिम नाम के साथ संयोजक को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: אַרְבָּעָה
  choice: कुल चार
  rationale: यह शब्द सूची में गिनाए गए पुत्रों की संख्या का सार देता है; ‘कुल’ हिन्दी में इस संक्षिप्त गणनात्मक निष्कर्ष को स्पष्ट और स्वाभाविक बनाता है।
