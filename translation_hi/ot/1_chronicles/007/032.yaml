  rationale: व्यक्तिवाचक नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुए
  rationale: वंशावली के संदर्भ में हिफ़ील रूप संतान उत्पन्न करने का भाव देता है; हिंदी में यह विन्यास स्वाभाविक, संक्षिप्त और गरिमापूर्ण है।
- source_word: יַפְלֵט
  choice: यफलेत
  rationale: मसोरा-पाठ के व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण।
- source_word: שׁוֹמֵר
  choice: शोमेर
  rationale: मसोरा-पाठ में दिए व्यंजनों और स्वरों का सीधा लिप्यंतरण; वैकल्पिक नाम-रूप पादटिप्पणी में रखा गया है।
- source_word: חוֹתָם
  choice: होताम
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: שׁוּעָא
  choice: शूआ
  rationale: यहाँ के इब्रानी नाम-रूप का निकट लिप्यंतरण; प्रचलित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: אֲחוֹתָם
  choice: उनकी बहन
  rationale: तीसरे पुरुष बहुवचन प्रत्यय का अर्थ ‘उनकी’ है और स्वाभाविक रूप से पहले बताए गए भाइयों को सामूहिक रूप से संदर्भित करता है।
