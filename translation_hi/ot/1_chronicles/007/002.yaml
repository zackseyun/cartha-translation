base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/002.yaml
  text: 'The sons of Tola: Uzzi[a], Rephaiah, Jeriel, Jahmai, Ibsam, and Samuel, heads of their fathers’ houses belonging to Tola, mighty men of valor according to their generations[c][b]. Their number in the days of David was twenty-two thousand six hundred.'
translation:
  language: hi
  text: 'तोला के पुत्र ये थे: उज्जी, रपायाह, यरीएल, यहमै, यिबसाम और शमूएल। वे तोला के पितृकुलों के मुखिया[a] और अपनी वंशावलियों के अनुसार पराक्रमी पुरुष[b] थे। दाऊद के दिनों में उनकी गिनती बाईस हज़ार छह सौ थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रधान” अथवा “अगुए”।
    reason: רָאשִׁים के पदसूचक अर्थ के वैकल्पिक हिन्दी रूप।
  - marker: b
    text: या “वीर योद्धा” अथवा “वीर पुरुष”।
    reason: גִּבּוֹרֵי חַיִל सैनिक वीरता, सामर्थ्य या प्रतिष्ठा का बोध करा सकता है।
lexical_decisions:
- source_word: וּבְנֵי תוֹלָע
  choice: तोला के पुत्र ये थे
  rationale: वंशावली के इस संदर्भ में בנים का सीधा अर्थ ‘पुत्र’ है; आरंभिक ו को हिन्दी में अलग से ‘और’ कहने की आवश्यकता नहीं।
- source_word: עֻזִּי וּרְפָיָה וִירִיאֵל וְיַחְמַי וְיִבְשָׂם וּשְׁמוּאֵל
  choice: उज्जी, रपायाह, यरीएल, यहमै, यिबसाम और शमूएल
  rationale: व्यक्तिनामों को हिब्रू उच्चारण के निकट और हिन्दी में सहज देवनागरी रूपों में लिप्यंतरित किया गया है।
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: अपने-अपने पितृकुलों के मुखिया
  rationale: רָאשִׁים पदाधिकार अथवा नेतृत्व बताता है और בית אבות पैतृक वंश से गठित सामाजिक-परिवार इकाई है; ‘पितृकुल’ हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: לְתוֹלָע
  choice: तोला के
  rationale: यह संबंधसूचक पद इन पितृकुलों के तोला की वंश-शाखा से संबद्ध होने को व्यक्त करता है; हिन्दी में ‘तोला के’ स्वाभाविक है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: वीर योद्धा
  rationale: यह स्थिर पद सामर्थ्य और विशेषतः सैनिक पराक्रम का बोध करा सकता है; इस गणना-संदर्भ में ‘वीर योद्धा’ उसका संभावित सैन्य भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְתֹלְדוֹתָם
  choice: अपनी वंशावलियों के अनुसार
  rationale: תולדות यहाँ पीढ़ियों अथवा वंशगत अभिलेखों/वर्गीकरण को सूचित करता है; ‘वंशावलियों के अनुसार’ गणना और कुल-सूची के संदर्भ को स्पष्ट रखता है।
- source_word: מִסְפָּרָם בִּימֵי דָוִיד עֶשְׂרִים וּשְׁנַיִם אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: दाऊद के दिनों में उनकी गिनती बाईस हज़ार छह सौ थी
  rationale: हिब्रू संख्या और काल-सूचक वाक्यांश का सीधा, आधुनिक हिन्दी रूप।
