base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/014.yaml
  text: 'The sons of Manasseh: Asriel[a], whom his Aramean concubine bore[c][b]; she bore Machir the father of Gilead.'
translation:
  language: hi
  text: 'मनश्शे के पुत्र[a]: अस्रीएल, जिसे उसकी अरामी उपपत्नी[b] ने जन्म दिया; उसने माकीर को जन्म दिया, जो गिलाद का पिता[c] था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मनश्शे के वंशज।” वंशावलियों में “पुत्र” शब्द कभी-कभी अधिक व्यापक अर्थ में वंशजों के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “अरामी स्त्री”; पारंपरिक अनुवादों में कभी-कभी “सीरियाई” कहा गया है।
    reason: lexical_alternative
  - marker: c
    text: वंशावली के प्रयोग में “पिता” का अर्थ “पूर्वज” या “कुल-स्थापक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: मनश्शे के पुत्र
  rationale: रचना का सीधा अर्थ ‘मनश्शे के पुत्र’ है। वंशावलियों में ‘पुत्र’ का अर्थ व्यापक रूप से वंशज भी हो सकता है, इसलिए उस संभावना को पादटिप्पणी में रखा गया है।
- source_word: אַשְׂרִיאֵל
  choice: अस्रीएल
  rationale: व्यक्तिनाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר יָלָדָה
  choice: जिसे ... ने जन्म दिया
  rationale: स्त्रीलिंग कर्ता वाले इस संबंधवाचक उपवाक्य का स्वाभाविक हिन्दी रूप यही है और इससे मूल वाक्य की संरचना बनी रहती है।
- source_word: פִּילַגְשׁוֹ
  choice: उसकी ... उपपत्नी
  rationale: ‘उपपत्नी’ मूल शब्द के उस अर्थ को व्यक्त करता है जिसमें वह प्रधान पत्नी से भिन्न, निम्न वैवाहिक दर्जे वाली स्त्री है; यह ‘रखैल’ की अपेक्षा अधिक तटस्थ और गरिमापूर्ण है। सर्वनाम ‘उसकी’ मूल के संबंधसूचक प्रत्यय को बनाए रखता है।
- source_word: הָאֲרַמִּיָּה
  choice: अरामी
  rationale: यह स्त्री की अरामी जातीय पहचान बताता है। ‘अरामी’ ऐतिहासिक रूप से ‘सीरियाई’ से अधिक सटीक है।
- source_word: יָלְדָה אֶת מָכִיר
  choice: उसी ने माकीर को जन्म दिया
  rationale: दूसरी स्त्रीलिंग क्रिया उसी स्त्री कर्ता को फिर सामने लाती है। ‘उसी ने’ हिन्दी में उस पुनरुक्ति को स्पष्ट करता है, जबकि मूल में न होने के कारण ‘भी’ नहीं जोड़ा गया।
- source_word: אֲבִי גִלְעָד
  choice: गिलाद का पिता
  rationale: यह मूल का सबसे सीधा रूप है। वंशावली के प्रसंग में ‘पिता’ पूर्वज या कुल-स्थापक भी सूचित कर सकता है; इस व्यापक अर्थ को पादटिप्पणी में बताया गया है।
