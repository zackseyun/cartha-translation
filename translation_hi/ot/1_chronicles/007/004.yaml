  choice: बहुत-सी ... थे
  rationale: רבה के हिफ़ील रूप का आशय यहाँ संख्या में बहुत होना या बढ़ाना है। पत्नियों और पुत्रों के साथ हिन्दी में स्वाभाविक अभिव्यक्ति ‘बहुत-सी पत्नियाँ और पुत्र थे’ है।
