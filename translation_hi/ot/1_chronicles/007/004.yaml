  yaml_path: translation/ot/1_chronicles/007/004.yaml
  text: And with them, by their generations, according to their fathers' houses, were 36,000 troops for the army of war, for they had many wives and sons.
translation:
  language: hi
  text: उनके साथ, उनकी वंश-शाखाओं और उनके पितृकुलों के अनुसार, युद्ध के लिए सेना की टुकड़ियों के 36,000 सैनिक[b] थे, क्योंकि उनकी बहुत-सी पत्नियाँ[a] और पुत्र थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘स्त्रियाँ’। इब्रानी נָשִׁים के दोनों अर्थ हो सकते हैं, पर यहाँ वंशावली और परिवार के संदर्भ में ‘पत्नियाँ’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: ‘युद्ध के लिए सेना की टुकड़ियाँ’ इब्रानी की एक संक्षिप्त सैन्य अभिव्यक्ति है; इसका अनुवाद ‘युद्ध की सैन्य टुकड़ियाँ’ भी किया जा सकता है।
    reason: lexical_alternative
