  yaml_path: translation/ot/1_chronicles/007/013.yaml
  text: 'The sons of Naphtali: Jahziel[a], Guni, Jezer, and Shallum—the sons of Bilhah.'
translation:
  language: hi
  text: 'नप्ताली के पुत्र: यहसीएल[a], गूनी, येसेर और शल्लूम—बिल्हा के पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 46:24 में इस नाम का रूप “यहसेएल” है; यहाँ इतिहास की पुस्तक में “यहसीएल” है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: नप्ताली के पुत्र
  rationale: वंशावली में בְּנֵי का सीधा अर्थ ‘पुत्र’ है, और यहाँ चार पुरुषों के नाम दिए गए हैं। नप्ताली नाम का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: יַחֲצִיאֵל
  choice: यहसीएल
  rationale: इब्रानी नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: גוּנִי
  choice: गूनी
  rationale: इब्रानी दीर्घ ऊ ध्वनि को दर्शाने वाला स्वाभाविक हिंदी लिप्यंतरण।
- source_word: יֵצֶר
  choice: येसेर
  rationale: इब्रानी नाम का स्रोत-आधारित लिप्यंतरण; צ को हिंदी पाठक के लिए ‘स’ से दर्शाया गया है।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: इतिहास की इब्रानी पाठ-परंपरा में दिए שַׁלּוּם का लिप्यंतरण; उत्पत्ति के समानांतर रूप को मुख्य पाठ में नहीं मिलाया गया।
- source_word: בְּנֵי בִלְהָה
  choice: ये बिल्हा के पुत्र थे
  rationale: अंतिम पदबंध को हिंदी में स्पष्ट और स्वाभाविक विधेय के रूप में रखा गया है; यह इन चारों को बिल्हा की वंश-रेखा से जोड़ता है।
