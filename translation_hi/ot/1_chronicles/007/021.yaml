base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/007/021.yaml
  text: Zabad his son[a], and Shuthelah his son, and Ezer and Elead; the men of Gath who were born in the land killed them[b], because they had gone down to take their livestock.
translation:
  language: hi
  text: और उसका पुत्र ज़ाबाद, और उसका पुत्र शूतेलह, और एज़ेर और एलाद; उस देश में जन्मे[a] गत के पुरुषों ने उन्हें मार डाला, क्योंकि वे[b] उनका पशुधन लेने नीचे गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस देश के मूल निवासी।” हिब्रू का शाब्दिक अर्थ है, “गत के पुरुष, जो उस देश में जन्मे थे।”
    reason: lexical_alternative
  - marker: b
    text: संदर्भतः “वे” से एजेर और एलाद अभिप्रेत प्रतीत होते हैं, क्योंकि वे नामों की सूची में निकटतम बहुवचन पूर्वपद हैं।
    reason: referent_ambiguity
lexical_decisions:
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: यह בֵּן के साथ तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय है। वंशावली की कड़ी स्पष्ट रखने के लिए दोनों बार यही अभिव्यक्ति रखी गई है।
- source_word: וְעֵזֶר וְאֶלְעָד
  choice: और एजेर और एलाद
  rationale: दोनों व्यक्तिगत नामों का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है और सूची की संरचना बनाए रखने के लिए संयोजक रखा गया है।
- source_word: וַהֲרָגוּם
  choice: उन्हें मार डाला
  rationale: הרג का सामान्य अर्थ यहाँ हत्या करना है; कर्म-प्रत्यय बहुवचन 'उन्हें' के रूप में व्यक्त किया गया है।
- source_word: אַנְשֵׁי גַת
  choice: गत के पुरुषों
  rationale: अभिव्यक्ति का सीधा अर्थ 'गत के पुरुष' है; इसे सामान्य जनसमुदाय बनाकर अर्थ को अनावश्यक रूप से व्यापक नहीं किया गया।
- source_word: הַנּוֹלָדִים בָּאָרֶץ
  choice: उस देश में जन्मे
  rationale: हिब्रू के शाब्दिक वर्णन को बनाए रखा गया है। प्रसंग में इसका आशय देशज या मूल निवासी हो सकता है, जिसे पादटिप्पणी में बताया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह हत्या का कारण प्रस्तुत करता है; आधुनिक हिन्दी में 'क्योंकि' स्पष्ट और स्वाभाविक है।
- source_word: יָרְדוּ
  choice: नीचे गए थे
  rationale: हिब्रू की दिशासूचक क्रिया 'नीचे जाना' सुरक्षित रखी गई है, और 'गए थे' हत्या से पहले हुई क्रिया को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: לָקַחַת
  choice: लेने
  rationale: לקח का व्यापक, सीधा अर्थ 'लेना' है। 'लूटने' या 'छीनने' से आक्रमण का भाव अधिक निश्चित हो जाता, जबकि मूल क्रिया स्वयं उतनी विशिष्ट नहीं है।
- source_word: מִקְנֵיהֶם
  choice: उनका पशुधन
  rationale: מִקְנֶה पाले हुए पशुओं या पशु-सम्पदा को दर्शाता है; 'पशुधन' आधुनिक हिन्दी में सटीक और पर्याप्त व्यापक है।
theological_decisions:
- issue: יָרְדוּ ('वे नीचे गए थे') के कर्ता की पहचान
  choice: मुख्य पाठ में बहुवचन सर्वनाम 'वे' रखा गया और पादटिप्पणी में एजेर तथा एलाद को सम्भावित निकटतम पूर्वपद बताया गया।
  alternative: सर्वनाम के स्थान पर सीधे 'एजेर और एलाद' लिखना।
  rationale: मूल हिब्रू में कर्ता केवल क्रिया के बहुवचन रूप से व्यक्त है। निकटतम बहुवचन पूर्वपद एजेर और एलाद हैं, पर मुख्य पाठ में नाम जोड़ देने से मूल की व्याकरणिक अस्पष्टता समाप्त हो जाती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वंशावली-शैली अपनाई गई है। नामों का देवनागरी लिप्यंतरण किया गया है। अर्धविराम वंशावली की सूची और उसके बाद की घटना के बीच सीमा स्पष्ट करता है; सर्वनाम-संबंधी वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
