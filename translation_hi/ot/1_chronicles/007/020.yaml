  text: 'The sons of Ephraim: Shuthelah[a], and Bered his son, and Tahath his son, and Eleadah his son, and Tahath his son.'
translation:
  language: hi
  text: 'एप्रैम के पुत्र: शूतेलह[a], उसका पुत्र बेरेद, उसका पुत्र तहत, उसका पुत्र एलादा, और उसका पुत्र तहत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वंशावलियों में “पुत्र” कभी-कभी किसी बाद के वंशज को भी दर्शा सकता है; फिर भी आगे हर चरण में मूल पाठ का शाब्दिक अर्थ “उसका पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशज
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है, पर वंशावलियों में यह व्यापक रूप से वंशजों को भी सूचित कर सकता है। आगे प्रत्येक पीढ़ी के लिए एकवचन ‘उसका पुत्र’ आने के कारण शीर्षक में ‘वंशज’ स्वाभाविक और स्पष्ट है।
- source_word: שׁוּתָלַח
  choice: शूतेलह
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: וּבֶרֶד
  choice: बेरेद
  rationale: इब्रानी व्यक्ति-नाम בֶּרֶד का निकट देवनागरी लिप्यंतरण।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: בֵּן पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसका पुत्र’ है; वंशावली में दूर का वंशज संभव होने पर भी मुख्य पाठ में शाब्दिक संबंध बनाए रखा गया है।
- source_word: וְתַחַת
  choice: तहत
  rationale: यहाँ תַּחַת सामान्य शब्द ‘नीचे’ नहीं, बल्कि व्यक्ति-नाम है; इसलिए इसका लिप्यंतरण किया गया है।
- source_word: וְאֶלְעָדָה
  choice: एलादा
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण; ע को अलग हिंदी ध्वनि से व्यक्त नहीं किया गया।
- source_word: וְתַחַת בְּנוֹ
  choice: और उसका पुत्र तहत
  rationale: मूल की दोहराई गई वंशावली-संरचना सुरक्षित रखी गई है, जबकि हिंदी में स्वाभाविक क्रम ‘उसका पुत्र तहत’ अपनाया गया है।
