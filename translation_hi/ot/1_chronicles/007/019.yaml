translation:
  language: hi
  text: शमीदा के पुत्र[a] अहयान, शेकेम, लिक्ही और अनीआम थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वंशज।” वंशावलियों में “पुत्र” कभी-कभी व्यापक रूप से पुरुष वंशजों के लिए भी प्रयुक्त होता है, यद्यपि यहाँ का निकट संदर्भ “पुत्र” का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: वंशावली की सूची में היה का यह रूप नामित व्यक्तियों का परिचय देता है; हिंदी में ‘थे’ इसका स्वाभाविक और सटीक रूप है।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यह शब्द वंशावली में कभी व्यापक अर्थ में ‘वंशज’ भी हो सकता है, पर निकट संदर्भ में पुरुष नामों की सीधी सूची के कारण ‘पुत्र’ उपयुक्त है।
- source_word: שְׁמִידָע
  choice: शमीदा
  rationale: हिब्रू व्यक्तिगत नाम का देवनागरी में निकट और पठनीय लिप्यंतरण।
- source_word: אַחְיָן
  choice: अहयान
  rationale: हिब्रू व्यंजन और स्वर-रूप को ध्यान में रखते हुए आधुनिक हिंदी में पठनीय लिप्यंतरण।
- source_word: שֶׁכֶם
  choice: शेकेम
  rationale: यहाँ वाक्यरचना इसे स्थान नहीं, व्यक्ति का नाम ठहराती है; इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: לִקְחִי
  choice: लिकही
  rationale: हिब्रू नाम का पठनीय देवनागरी लिप्यंतरण; ‘ख’ से ח की ध्वनि का निकट संकेत मिलता है।
- source_word: אֲנִיעָם
  choice: अनीआम
  rationale: नाम का अनुवाद करने के बजाय हिब्रू स्वरूप के निकट देवनागरी लिप्यंतरण किया गया है।
