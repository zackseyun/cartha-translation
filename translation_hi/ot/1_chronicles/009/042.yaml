  yaml_path: translation/ot/1_chronicles/009/042.yaml
  text: Ahaz fathered Jarah[a], and Jarah fathered Alemeth, Azmaveth, and Zimri; and Zimri fathered Moza.
translation:
  language: hi
  text: आहाज से यारा[a] उत्पन्न हुआ, और यारा से आलेमेत, अजमावेत और जिम्री उत्पन्न हुए; और जिम्री से मोजा उत्पन्न हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 1 इतिहास 8:36 की समानांतर वंशावली में यहाँ ‘यहोअद्दा’ नाम है, जबकि इस पद में इतिहास की पांडुलिपियाँ ‘यारा’ पढ़ती हैं; इसलिए मुख्य पाठ में ‘यारा’ रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ/हुए
  rationale: वंशावली में हिफ़ील रूप पुरुष द्वारा संतान उत्पन्न करने का भाव देता है। हिंदी में ‘से … उत्पन्न हुआ’ स्वाभाविक, गरिमापूर्ण और वंश-संबंध के लिए स्पष्ट है।
- source_word: יַעְרָה
  choice: यारा
  rationale: व्यक्तिवाचक नाम को हिब्रू पाठ के व्यंजनात्मक रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: עָלֶמֶת
  choice: आलेमेत
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: עַזְמָוֶת
  choice: अजमावेत
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; ז को हिंदी में प्रचलित ‘ज’ से दर्शाया गया है।
- source_word: זִמְרִי
  choice: जिम्री
  rationale: व्यक्तिवाचक नाम का हिब्रू के निकट देवनागरी लिप्यंतरण।
- source_word: מוֹצָא
  choice: मोजा
  rationale: व्यक्तिवाचक नाम का हिब्रू के निकट देवनागरी लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: संयोजक उपसर्ग वंशावली की क्रमिक कड़ियों और नामों को जोड़ता है; ‘और’ इसका स्वाभाविक हिंदी समतुल्य है।
- source_word: אֶת
  choice: अनूदित नहीं
  rationale: प्रत्यक्ष कर्म-सूचक चिह्न का हिंदी में अलग शब्दगत समतुल्य नहीं है; उसका व्याकरणिक कार्य वाक्य-संरचना से व्यक्त होता है।
