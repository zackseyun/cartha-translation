base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/014.yaml
  text: 'And from the Levites: Shemaiah son of Hasshub[a], son of Azrikam, son of Hashabiah, from the sons of Merari.'
translation:
  language: hi
  text: 'और लेवियों में से: शमायाह, हश्शूब का पुत्र, अज्रीकाम का पुत्र, हशब्याह का पुत्र, मरारी के पुत्रों में से था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן הַלְוִיִּם
  choice: और लेवियों में से
  rationale: आरंभिक וּ सूची की पिछली कड़ी से जोड़ता है, और מִן किसी समूह में से होने का बोध देता है। ‘लेवियों’ प्रचलित और स्वाभाविक जातीय-पदनाम है।
- source_word: שְׁמַעְיָה
  choice: शमायाह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶן חַשּׁוּב בֶן עַזְרִיקָם בֶן חֲשַׁבְיָה
  choice: जो हश्शूब का पुत्र, अज्रीकाम का पोता और हशब्याह का परपोता था
  rationale: वंशावली की लगातार तीन בֶן-कड़ियों को आधुनिक हिंदी में उनके पारिवारिक संबंध स्पष्ट करते हुए व्यक्त किया गया है; इससे मूल क्रम और पीढ़ियाँ सुरक्षित रहती हैं।
- source_word: מִן בְּנֵי מְרָרִי
  choice: वह मरारी के वंशजों में से था
  rationale: यहाँ בְּנֵי व्यापक कुलगत संबंध बताता है, इसलिए हिंदी में ‘वंशजों’ स्वाभाविक और संदर्भानुकूल है; מִן का ‘में से’ भाव भी बनाए रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण वंशावली-रजिस्टर अपनाया गया है। संक्षिप्त इब्रानी नाम-शृंखला को हिंदी में पुत्र, पोता और परपोता कहकर स्पष्ट किया गया है, जबकि कुलगत संबंध के लिए ‘वंशजों’ रखा गया है।
