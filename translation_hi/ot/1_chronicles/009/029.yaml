source:
  edition: WLC
  text: וּ/מֵ/הֶ֗ם מְמֻנִּים֙ עַל הַ/כֵּלִ֔ים וְ/עַ֖ל כָּל כְּלֵ֣י הַ/קֹּ֑דֶשׁ וְ/עַל הַ/סֹּ֨לֶת֙ וְ/הַ/יַּ֣יִן וְ/הַ/שֶּׁ֔מֶן וְ/הַ/לְּבוֹנָ֖ה וְ/הַ/בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/029.yaml
  text: And some of them were appointed over the vessels[a], over all the holy vessels, and over the fine flour, the wine, the oil, the frankincense, and the spices.
translation:
  language: hi
  text: और उनमें से कुछ उपकरणों, पवित्र के सभी पात्रों[a], महीन आटे, दाखरस, तेल, लोबान और सुगंधित पदार्थों की देखरेख करने के लिए नियुक्त थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पवित्रस्थान के सभी पात्रों’।
    reason: शब्द-समूह כְּלֵי הַקֹּדֶשׁ का स्थानवाचक वैकल्पिक अर्थ।
lexical_decisions:
- source_word: וּמֵהֶם
  choice: और उनमें से कुछ लोग
  rationale: מִן का अंशवाचक भाव है; यह बड़े समूह में से कुछ व्यक्तियों को दर्शाता है।
- source_word: מְמֻנִּים עַל
  choice: की देखरेख के लिए नियुक्त थे
  rationale: निष्क्रिय कृदंत सौंपे गए उत्तरदायित्व को व्यक्त करता है, और עַל जिम्मेदारी के क्षेत्र को सूचित करता है।
- source_word: הַכֵּלִים
  choice: सामान
  rationale: כְּלִי का अर्थ संदर्भ के अनुसार पात्र, उपकरण या अन्य वस्तु हो सकता है। पहले सामान्य उल्लेख के लिए ‘सामान’ स्वाभाविक है और अगले अधिक विशिष्ट पदबंध से अनावश्यक शब्दशः पुनरावृत्ति घटाता है।
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: सभी पवित्र पात्रों
  rationale: यह संक्षिप्त रूप से पात्रों के पवित्र उपयोग या दर्जे को बनाए रखता है; ‘पवित्रस्थान के सभी पात्र’ भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
- source_word: הַסֹּלֶת
  choice: मैदे
  rationale: סֹלֶת बलि-संबंधी उपयोग का महीन, उत्तम आटा है; आधुनिक हिंदी में ‘मैदा’ सहज और विशिष्ट समतुल्य है।
- source_word: הַיַּיִן
  choice: दाखमधु
  rationale: यह मंदिर के भंडार और अर्पण के संदर्भ में יַיִן का स्पष्ट तथा गरिमापूर्ण हिंदी रूप है।
- source_word: הַשֶּׁמֶן
  choice: तेल
  rationale: मूल पाठ केवल तेल कहता है; जैतून का तेल संभावित होने पर भी उसे स्पष्ट रूप से जोड़ना उचित नहीं।
- source_word: הַלְּבוֹנָה
  choice: लोबान
  rationale: לְבוֹנָה सामान्य धूप नहीं, विशेष रूप से frankincense है; ‘लोबान’ उसका प्रचलित हिंदी नाम है।
- source_word: הַבְּשָׂמִים
  choice: सुगंध-द्रव्यों
  rationale: यह पवित्र तैयारी में प्रयुक्त सुगंधित पदार्थों का व्यापक अर्थ रखता है और आधुनिक हिंदी में ‘मसालों’ से अधिक संदर्भानुकूल है।
theological_decisions:
- issue: כְּלֵי הַקֹּדֶשׁ में הַקֹּדֶשׁ का संबंध
  choice: पवित्र पात्र
  alternative: पवित्रस्थान के सभी पात्र
  rationale: समास का अर्थ पात्रों की पवित्रता अथवा पवित्रस्थान से उनके संबंध—दोनों रूपों में समझा जा सकता है। मुख्य पाठ में संक्षिप्त औपचारिक अर्थ रखा गया है और स्थानवाचक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण धार्मिक गद्य। सूची को स्वाभाविक बनाने के लिए दोहराए गए עַל को एक बार ‘देखरेख’ के अधीन रखा गया है; मूल की जिम्मेदारी का भाव बना रहता है।
