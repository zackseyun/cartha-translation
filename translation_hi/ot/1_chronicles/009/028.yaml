translation:
  language: hi
  text: उनमें से कुछ सेवा में प्रयुक्त पात्रों की देखरेख पर नियुक्त थे, क्योंकि वे उन्हें गिनती करके भीतर लाते और गिनती करके बाहर ले जाते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמֵהֶם
  choice: उनमें से कुछ
  rationale: מִן का प्रत्यययुक्त रूप पहले बताए गए समूह में से एक भाग को दर्शाता है; हिंदी में यह स्वाभाविक और सटीक है।
- source_word: עַל
  choice: के अधिकारी थे
  rationale: यहाँ עַל निगरानी और उत्तरदायित्व का भाव देता है; 'के अधिकारी थे' प्रशासनिक जिम्मेदारी को स्पष्ट करता है।
- source_word: כְּלֵי הָעֲבוֹדָה
  choice: सेवा में काम आनेवाले पात्रों
  rationale: כְּלִי पात्र, बरतन, उपकरण या अन्य वस्तु के लिए व्यापक शब्द है, और הָעֲבוֹדָה मंदिर की सेवा को सूचित करता है। यह अनुवाद संदर्भ स्पष्ट रखते हुए शब्द की व्यापकता को पाद-टिप्पणी में सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके उत्तरदायित्व का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: בְמִסְפָּר
  choice: गिनकर
  rationale: यह निश्चित संख्या के अनुसार लेखा रखने का भाव सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יְבִיאוּם
  choice: वे उन्हें ... भीतर लाते
  rationale: בוא का हिफ़ील रूप 'भीतर लाना' है; अपूर्ण क्रिया यहाँ नियमित प्रथा बताती है, इसलिए हिंदी में अभ्यस्त भूतकाल प्रयुक्त है।
- source_word: יוֹצִיאוּם
  choice: बाहर ले जाते थे
  rationale: יצא का हिफ़ील रूप 'बाहर ले जाना' है; यह 'भीतर लाते' के साथ मूल की समानांतर संरचना बनाए रखता है।
