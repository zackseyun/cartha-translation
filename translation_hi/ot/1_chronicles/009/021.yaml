  yaml_path: translation/ot/1_chronicles/009/021.yaml
  text: Zechariah son of Meshelemiah was gatekeeper at the entrance to the tent of meeting[a].
translation:
  language: hi
  text: मशेलेम्याह का पुत्र जकर्याह मिलापवाले तंबू के प्रवेश-द्वार का द्वारपाल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זְכַרְיָה
  choice: जकर्याह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण; नाम का अर्थानुवाद नहीं किया गया।
- source_word: בֶּן
  choice: का पुत्र
  rationale: निकट वंशावली-संदर्भ में सामान्य प्रत्यक्ष पुत्र-संबंध सबसे उपयुक्त है।
- source_word: מְשֶׁלֶמְיָה
  choice: मशेलेम्याह
  rationale: इब्रानी व्यक्तिनाम का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: שֹׁעֵר
  choice: द्वारपाल
  rationale: यह प्रवेश की रखवाली करनेवाले व्यक्ति को दर्शाता है; ‘द्वारपाल’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: शब्द किसी प्रवेश-स्थान या द्वार-मुख को दर्शाता है; यहाँ ‘प्रवेश-द्वार’ सहज और सटीक है।
- source_word: לְאֹהֶל
  choice: तंबू के
  rationale: 'ל को यहाँ פתח के साथ संबंधसूचक रूप में समझा गया है: तंबू का/तंबू में जाने का प्रवेश-द्वार।'
- source_word: מוֹעֵד
  choice: मिलापवाले
  rationale: स्थिर पवित्रस्थान-संज्ञा אֹהֶל מוֹעֵד में यह परमेश्वर और उसके लोगों के नियत मिलने का भाव रखता है; हिन्दी में परिचित पदावली अपनाई गई है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह इब्रानी पद का पारदर्शी और हिन्दी बाइबल-पाठकों के लिए परिचित रूप है; केवल ‘निवासस्थान’ जैसे अधिक व्याख्यात्मक विकल्प से बचा गया है।
