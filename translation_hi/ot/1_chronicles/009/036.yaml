base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/036.yaml
  text: And his firstborn son was Abdon[a], then Zur, Kish, Baal, Ner, and Nadab.
translation:
  language: hi
  text: और उसका पहलौठा पुत्र अब्दोन था; फिर सूर, कीश, बाल, नेर और नादाब।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “और उसका पुत्र, पहलौठा: अब्दोन, और सूर, और कीश, और बाल, और नेर, और नादाब।” इब्रानी में प्रत्येक नाम से पहले आया संयोजक हिन्दी में स्वाभाविक सूची के रूप में व्यक्त किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנוֹ הַבְּכוֹר
  choice: और उसका पहलौठा पुत्र
  rationale: वाव वंशावली को आगे बढ़ाता है; בְנוֹ का पुरुषवाचक एकवचन संबंधसूचक प्रत्यय ‘उसका’ से व्यक्त किया गया है, और הַבְּכוֹר के लिए औपचारिक वंशावली-शब्द ‘पहलौठा’ रखा गया है।
- source_word: עַבְדּוֹן
  choice: अब्दोन
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וְצוּר
  choice: फिर सूर
  rationale: नामों की सूची में बार-बार आए वाव को स्वाभाविक हिन्दी में ‘फिर’ और सूची-विरामों द्वारा व्यक्त किया गया है; इसका आशय कालक्रम स्थापित करना नहीं, सूची को आगे बढ़ाना है।
- source_word: וְקִישׁ
  choice: कीश
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; संयोजक सूची की हिन्दी संरचना में समाहित है।
- source_word: וּבַעַל
  choice: बाल
  rationale: यहाँ בַעַל व्यक्ति का नाम है; पाठ में दिए रूप को धार्मिक संकोच के कारण बदला नहीं गया है।
- source_word: וְנֵר
  choice: नेर
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וְנָדָב
  choice: और नादाब
  rationale: अंतिम नाम से पहले इब्रानी संयोजक को स्वाभाविक हिन्दी सूची के अनुसार ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: इस्राएली वंशावली में בַּעַל नाम का अनुवाद
  choice: व्यक्तिगत नाम के रूप में ‘बाल’
  alternative: नाम को किसी समानांतर या शिष्टोक्तिपरक रूप से बदलना
  rationale: इब्रानी पाठ स्पष्टतः בַּעַל देता है। इसे उसी रूप में रखना मूल पाठ के प्रति निष्ठावान है और मूर्तिपूजा का अनुमोदन नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘पहलौठा’ वंशावली की औपचारिकता बनाए रखता है। नामों के प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाए गए हैं।
