  text: וַ/עֲדָיָה֙ בֶּן יְרֹחָ֔ם בֶּן פַּשְׁח֖וּר בֶּן מַלְכִּיָּ֑ה וּ/מַעְשַׂ֨י בֶּן עֲדִיאֵ֧ל בֶּן יַחְזֵ֛רָה בֶּן מְשֻׁלָּ֥ם בֶּן מְשִׁלֵּמִ֖ית בֶּן אִמֵּֽר־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/012.yaml
  text: and Adaiah son of Jeroham[a], son of Pashhur, son of Malchijah, and Maasai son of Adiel, son of Jahzerah, son of Meshullam, son of Meshillemith, son of Immer.
translation:
  language: hi
  text: और यरोहाम का पुत्र अदायाह, पशहूर का पुत्र, मल्कियाह का पुत्र; और अदिएल का पुत्र मासै, यहजेरा का पुत्र, मशुल्लाम का पुत्र, मशिल्लेमीत[a] का पुत्र, इम्मेर का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ नाम का रूप “मशिल्लेमीत” है; अन्यत्र इससे मिलता-जुलता रूप “मशिल्लेमोत” पाया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲדָיָה
  choice: और ... अदायाह
  rationale: वाव सूची की पिछली कड़ी को आगे बढ़ाता है; नाम को आधुनिक हिन्दी बाइबलीय लिप्यंतरण में रखा गया है।
- source_word: בֶּן
  choice: पुत्र / पोता / वंश में ... वंशज
  rationale: वंशावली की लगातार कड़ियों को स्वाभाविक हिन्दी में व्यक्त किया गया है। निकट कड़ी के लिए ‘पुत्र’, अगली के लिए ‘पोता’, और लंबी शृंखला में ‘वंश’/‘वंशज’ प्रयोग करने से संबंधों का क्रम बना रहता है और बोझिल पुनरावृत्ति घटती है।
- source_word: יְרֹחָם
  choice: यरोहाम
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: פַּשְׁחוּר
  choice: पशहूर
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण; ח को ‘ह’ से दर्शाया गया है।
- source_word: מַלְכִּיָּה
  choice: मल्कियाह
  rationale: हिब्रू नाम का निकट ध्वन्यात्मक लिप्यंतरण, जिसमें अंतिम याह तत्व सुरक्षित है।
- source_word: וּ/מַעְשַׂי
  choice: और ... मासै
  rationale: संयोजक को ‘और’ तथा इस पद के संक्षिप्त नामरूप को ‘मासै’ किया गया है; इसे लंबे ‘मासेयाह’ नाम से अलग रखा गया है।
- source_word: עֲדִיאֵל
  choice: अदिएल
  rationale: नाम का निकट हिन्दी लिप्यंतरण, जिसमें ‘एल’ तत्व स्पष्ट है।
- source_word: יַחְזֵרָה
  choice: यहजेरा
  rationale: मसोरेटी पाठ के नामरूप का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: מְשִׁלֵּמִית
  choice: मशिल्लेमीत
  rationale: वर्तमान मसोरेटी पाठ के מְשִׁלֵּמִית को सीधे प्रतिबिंबित करने वाला लिप्यंतरण चुना गया है।
- source_word: אִמֵּר
  choice: इम्मेर
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
theological_decisions:
- issue: वंशावली में בֶּן की सीमा
  choice: रिश्तों का क्रम ‘पुत्र’, ‘पोता’ और ‘वंशज’ द्वारा स्पष्ट किया गया
  alternative: हर स्थान पर शाब्दिक रूप से ‘का पुत्र’ दोहराना
  rationale: בֶּן वंशावली में प्रत्यक्ष पुत्र या व्यापक वंशज-संबंध बता सकता है। हिन्दी में क्रम स्पष्ट करते हुए ‘वंशज’ का प्रयोग दूर की कड़ी को अनावश्यक रूप से प्रत्यक्ष पुत्र घोषित करने से बचाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। नाम मूल हिब्रू के निकट देवनागरी में लिप्यंतरित हैं। लंबी वंशावली को पठनीय बनाने के लिए संबंधसूचक शब्दों में नियंत्रित विविधता रखी गई है, जबकि सभी कड़ियों का क्रम सुरक्षित है।
