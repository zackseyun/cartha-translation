  rationale: नाम-सूची को पिछले पद से जोड़ने और इब्रानी की क्रमिक संरचना बनाए रखने के लिए संयोजक को दोहराया गया है।
- source_word: יִבְנְיָה
  choice: यिब्नयाह
  rationale: व्यक्तिवाचक नाम को मासोरेटिक इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: पुत्र / पोता / परपोता
  rationale: वंशावली की लगातार ‘बेन’ शृंखला को स्वाभाविक हिंदी में संबंध की पीढ़ियाँ स्पष्ट करते हुए व्यक्त किया गया है; पहला संबंध ‘पुत्र’, अगला ‘पोता’ और तीसरा ‘परपोता’ है।
- source_word: יְרֹחָם
  choice: यरोहाम
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: אֵלָה
  choice: एला
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: עֻזִּי
  choice: उज्जी
  rationale: इब्रानी में व्यंजन के द्वित्व को दर्शाते हुए नाम का स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: מִכְרִי
  choice: मिक्री
  rationale: इब्रानी כ को इस नाम में ‘क’ से दर्शाकर मूल रूप के निकट लिप्यंतरण किया गया है।
- source_word: מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित और मूलोन्मुख देवनागरी लिप्यंतरण।
- source_word: שְׁפַטְיָה
  choice: शपत्याह
  rationale: नाम के अंतिम ईश-सूचक तत्व יָהּ को ‘याह’ से सुरक्षित रखते हुए लिप्यंतरित किया गया है।
- source_word: רְעוּאֵל
  choice: रऊएल
  rationale: मासोरेटिक इब्रानी स्वररूप को सीधे दर्शाया गया है; दूसरे परंपरागत रूप को मुख्य पाठ में नहीं अपनाया गया।
- source_word: יִבְנִיָּה
  choice: यिब्नियाह
  rationale: पहले समान नाम से भिन्न मासोरेटिक स्वररूप को बनाए रखते हुए अंतिम יָהּ को ‘याह’ से दर्शाया गया है।
