  text: and Ibneiah son of Jeroham[a], and Elah son of Uzzi, son of Michri, and Meshullam son of Shephatiah, son of Reuel, son of Ibnijah.
translation:
  language: hi
  text: और यिब्नयाह, जो यरोहाम का पुत्र था; और एला, जो उज्जी का पुत्र था, और उज्जी मिक्री का पुत्र था; और मशुल्लाम, जो शपत्याह का पुत्र था, और शपत्याह रऊएल का पुत्र था, जो यिब्नियाह का पुत्र था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी व्यक्तिवाचक नामों का अर्थानुवाद नहीं, बल्कि देवनागरी में लिप्यंतरण किया गया है। अन्य अनुवादों में इन नामों की वर्तनी कुछ भिन्न हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ
