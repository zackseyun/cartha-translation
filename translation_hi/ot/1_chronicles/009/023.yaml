  text: וְ/הֵ֨ם וּ/בְנֵי/הֶ֜ם עַל הַ/שְּׁעָרִ֧ים לְ/בֵית יְהוָ֛ה לְ/בֵ֥ית הָ/אֹ֖הֶל לְ/מִשְׁמָרֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/023.yaml
  text: They and their sons were over the gates of the house of Yahweh[a], that is, the house of the tent, as guards.
translation:
  language: hi
  text: वे और उनके पुत्र यहोवा के भवन, अर्थात् तम्बू के भवन, के फाटकों की देखरेख और पहरेदारी करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵם
  choice: वे
  rationale: आरम्भिक वाव यहाँ पिछले कथन से जुड़ते हुए कर्ता को फिर से सामने लाता है; हिन्दी में केवल ‘वे’ स्वाभाविक है।
- source_word: וּבְנֵיהֶם
  choice: और उनके पुत्र
  rationale: वंशानुगत द्वारपाल-सेवा के प्रसंग में בנים पुरुष वंशजों को सूचित करता है, इसलिए ‘पुत्र’ सटीक है।
- source_word: עַל הַשְּׁעָרִים
  choice: फाटकों की देखरेख करते थे
  rationale: प्रशासनिक प्रसंग में עַל केवल स्थान नहीं, बल्कि उत्तरदायित्व और निगरानी व्यक्त करता है।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन के
  rationale: यह वाक्यांश फाटकों का सम्बन्ध यहोवा के पवित्र भवन से बताता है; יְהוָה को व्यक्तिगत ईश्वरीय नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְבֵית הָאֹהֶל
  choice: तम्बू के भवन
  rationale: इब्रानी पद का औपचारिक अर्थ ‘तम्बू का भवन’ है; इसे बनाए रखने से तम्बू-पवित्रस्थान और बाद के भवन के बीच का संबंध बिना अनावश्यक व्याख्या के सुरक्षित रहता है।
- source_word: לְמִשְׁמָרוֹת
  choice: पहरेदार के रूप में सेवा करते थे
  rationale: यह पद पहरे और रखवाली की जिम्मेदारी सूचित करता है; चुना हुआ रूप आधुनिक हिन्दी में भूमिका को स्पष्ट करता है।
theological_decisions:
- issue: ‘यहोवा के भवन’ और ‘तम्बू के भवन’ का परस्पर संबंध
  choice: दूसरे पद को पहले का स्पष्टीकरण मानते हुए दोनों अभिव्यक्तियाँ रखी गई हैं।
  alternative: दोनों को अलग-अलग स्थान मानना, या दूसरे पद को केवल ‘निवास-स्थान’ कहकर पहले में मिला देना।
  rationale: मूल पाठ मंदिर-संबंधी सेवा और पुराने तम्बू-पवित्रस्थान के बीच संबंध बनाए रखता है। ‘अर्थात्’ संभावित समानाधिकरण को स्पष्ट करता है, जबकि दोनों मूल अभिव्यक्तियों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘फाटकों की देखरेख’ उत्तरदायित्व का भाव देता है, और ‘अर्थात्’ दोनों भवन-संबंधी पदों के समानाधिकरण को स्पष्ट करता है।
