reference: 1 Chronicles 9:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כֻּלָּ֤/ם הַ/בְּרוּרִים֙ לְ/שֹׁעֲרִ֣ים בַּ/סִּפִּ֔ים מָאתַ֖יִם וּ/שְׁנֵ֣ים עָשָׂ֑ר הֵ֤מָּה בְ/חַצְרֵי/הֶם֙ הִתְיַחְשָׂ֔/ם הֵ֣מָּה יִסַּ֥ד דָּוִ֛יד וּ/שְׁמוּאֵ֥ל הָ/רֹאֶ֖ה בֶּ/אֱמוּנָתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/022.yaml
  text: All these who were chosen as gatekeepers at the thresholds were two hundred and twelve[a]. They were enrolled by genealogy in their villages. David and Samuel the seer established them in their office of trust.
translation:
  language: hi
  text: वे सभी, जिन्हें प्रवेश-द्वारों की देहलियों पर द्वारपाल होने के लिए चुना गया था, कुल दो सौ बारह थे। उनकी वंशावली का पंजीकरण उनकी बस्तियों में किया गया था। दाऊद और दर्शी शमूएल ने उन्हें उनके विश्वस्त दायित्व में स्थापित किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद और दर्शी शमूएल ने उनकी विश्वासयोग्यता के कारण उन्हें स्थापित किया,” अथवा, “उन्हें उनकी विश्वासयोग्यता में स्थापित किया।”
    reason: בֶּאֱמוּנָתָם के प्रशासनिक और नैतिक अर्थों के बीच वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הַבְּרוּרִים
  choice: जिन्हें ... चुना गया था
  rationale: निष्क्रिय कृदन्त चुने या छाँटे गए व्यक्तियों को सूचित करता है; यह पद नियुक्ति की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְשֹׁעֲרִים
  choice: द्वारपाल होने के लिए
  rationale: मन्दिर के प्रवेश-द्वारों की रखवाली करने वाले सेवकों के लिए स्वाभाविक और स्पष्ट हिन्दी पद।
- source_word: בַּסִּפִּים
  choice: प्रवेश-द्वारों की देहलियों पर
  rationale: סַף का मूल अर्थ देहली या चौखट है; 'प्रवेश-द्वारों' से प्रसंग स्पष्ट होता है और 'देहलियों' से स्रोत की सटीक छवि बनी रहती है।
- source_word: מָאתַיִם וּשְׁנֵים עָשָׂר
  choice: दो सौ बारह
  rationale: संख्या का सीधा अनुवाद।
- source_word: בְחַצְרֵיהֶם
  choice: उनकी बस्तियों में
  rationale: वंशावली और निवास के इस प्रसंग में חָצֵר मन्दिर के आँगनों के बजाय गाँवों अथवा छोटी बस्तियों को सूचित करता है।
- source_word: הִתְיַחְשָׂם
  choice: उनकी वंशावली का पंजीकरण किया गया था
  rationale: यह रूप वंश-सूची में औपचारिक रूप से दर्ज किए जाने का भाव व्यक्त करता है।
- source_word: יִסַּד
  choice: स्थापित किया था
  rationale: व्यवस्था या दायित्व को स्थिर रूप देने का अर्थ रखता है और बाद की कलीसियाई शब्दावली आरोपित नहीं करता।
- source_word: הָרֹאֶה
  choice: दर्शी
  rationale: यह इब्रानी का विशिष्ट पुराना पद है; इसे सामान्य 'भविष्यद्वक्ता' में समतल नहीं किया गया।
- source_word: בֶּאֱמוּנָתָם
  choice: भरोसे के इस दायित्व में
  rationale: प्रसंग में यह विश्वसनीयता से जुड़े सौंपे गए पद या दायित्व को सूचित कर सकता है; हिन्दी वाक्यांश प्रशासनिक और नैतिक दोनों छायाएँ बनाए रखता है।
theological_decisions:
- issue: पद के अन्त में בֶּאֱמוּנָתָם का अर्थ
  choice: दाऊद और शमूएल ने उन्हें भरोसे के दायित्व में स्थापित किया
  alternative: दाऊद और दर्शी शमूएल ने उनकी विश्वासयोग्यता के कारण उन्हें स्थापित किया; अथवा उन्हें उनकी विश्वासयोग्यता में स्थापित किया
  rationale: वाक्यांश संक्षिप्त और अर्थ की दृष्टि से लचीला है। द्वारपालों और उनके पंजीकरण के प्रशासनिक प्रसंग में सौंपे गए विश्वसनीय दायित्व का अर्थ उपयुक्त है, पर विश्वासयोग्यता को कारण या गुण मानने की सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। 'दर्शी' जैसे स्रोत-विशिष्ट पद को बनाए रखा गया है; कठिन प्रशासनिक भाव को 'भरोसे का दायित्व' कहकर स्वाभाविक बनाया गया है।
