  text: And the gatekeepers were Shallum[a], Akkub, Talmon, Ahiman, and their brothers; Shallum was the chief.
translation:
  language: hi
  text: 'द्वारपाल ये थे: शल्लूम, अक्कूब, तल्मोन, अहीमान और उनके भाई[a]; शल्लूम प्रधान था।'
  philosophy: optimal-equivalence
  footnotes:
