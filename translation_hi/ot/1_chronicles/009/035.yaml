  text: וּ/בְ/גִבְע֛וֹן יָשְׁב֥וּ אֲבִֽי גִבְע֖וֹן יעואל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ מַעֲכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/035.yaml
  text: In Gibeon lived Jeiel the father of Gibeon[b][a], and his wife's name was Maacah.
translation:
  language: hi
  text: और गिबोन में गिबोन का पिता[a] यीएल[b] रहता था, और उसकी पत्नी का नाम माका था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गिबोन का संस्थापक” अथवा “गिबोन का प्रधान”; इब्रानी में शाब्दिक रूप से “गिबोन का पिता।”
    reason: lexical_alternative
  - marker: b
    text: इस नाम को “यऊएल” भी लिखा जा सकता है; 1 इतिहास 8:29 के समानांतर पाठ से तुलना करें।
    reason: textual_variant
lexical_decisions:
- source_word: וּ/בְ/גִבְע֛וֹן
  choice: और गिबोन में
  rationale: संयोजक וּ और स्थानवाचक בְ दोनों को दर्शाते हुए वंशावली के पिछले प्रसंग से संबंध बनाए रखा गया है।
- source_word: יָשְׁב֥וּ
  choice: रहता था
  rationale: ישב यहाँ निवास करने के अर्थ में है। यद्यपि मसोरी स्वरूप बहुवचन है, इसके बाद एक नामित व्यक्ति आता है और समानांतर वंशावली-सूत्र एकवचन अर्थ का समर्थन करता है; स्वाभाविक हिन्दी में एकवचन रखा गया है।
- source_word: אֲבִֽי גִבְע֖וֹן
  choice: गिबोन का पिता
  rationale: इब्रानी का शाब्दिक और जानबूझकर अस्पष्ट संबंध सुरक्षित रखा गया है; नगर अथवा कुल के संदर्भ में इसका अर्थ संस्थापक, पूर्वज या प्रधान भी हो सकता है।
- source_word: יעואל
  choice: यीएल
  rationale: पारंपरिक पठन और 1 इतिहास 8:29 के समानांतर के आधार पर यीएल अपनाया गया है; लिखित व्यंजनरूप से संभव वैकल्पिक नामरूप पादटिप्पणी में दिया गया है।
- source_word: וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ
  choice: और उसकी पत्नी का नाम ... था
  rationale: मूल नामवाचक वाक्य और संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַעֲכָֽה
  choice: माका
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ‘गिबोन का पिता’ पद का सामाजिक अर्थ
  choice: मुख्य पाठ में शाब्दिक ‘गिबोन का पिता’
  alternative: ‘गिबोन का संस्थापक’ अथवा ‘गिबोन का प्रधान’
  rationale: मूल पद स्वयं यह निश्चित नहीं करता कि आशय जैविक पूर्वज, संस्थापक या प्रमुख व्यक्ति है; इसलिए अस्पष्टता मुख्य पाठ और पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निवास करता था’ की अपेक्षा सामान्य पाठक के लिए स्वाभाविक ‘रहता था’ चुना गया है। सभी नाम देवनागरी में प्रचलित बाइबलीय रूपों के निकट रखे गए हैं।
