- source_word: וּ/מִן
  choice: और ... में से
  rationale: उपसर्ग ו पिछले पद की सूची से संबंध जोड़ता है, और מִן समूह में से चयन का भाव देता है।
- source_word: בְּנֵי זֶרַח
  choice: जेरह के वंशजों
  rationale: वंशावली और कुल-सूची के संदर्भ में בְּנֵי केवल प्रत्यक्ष पुत्रों के बजाय व्यापक वंश-सदस्यता बता सकता है; इसलिए स्वाभाविक हिन्दी में ‘वंशजों’ उपयुक्त है।
- source_word: יְעוּאֵל
  choice: यऊएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וַ/אֲחֵי/הֶם
  choice: और उनके भाई-बन्धु
  rationale: प्रत्यय व्याकरणतः बहुवचन ‘उनके’ है। ‘भाई-बन्धु’ यहाँ कुल से जुड़े पुरुष संबंधियों/सदस्यों का व्यापक भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת וְ/תִשְׁעִים
  choice: कुल छः सौ नब्बे
  rationale: संख्या शब्दों में दी गई है; ‘कुल’ सूची में उल्लिखित व्यक्तियों की सम्मिलित संख्या स्पष्ट करता है।
