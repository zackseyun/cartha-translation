  edition: WLC
  text: וַ/אֲחֵי/הֶ֗ם רָאשִׁים֙ לְ/בֵ֣ית אֲבוֹתָ֔/ם אֶ֕לֶף וּ/שְׁבַ֥ע מֵא֖וֹת וְ/שִׁשִּׁ֑ים גִּבּ֣וֹרֵי חֵ֔יל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/013.yaml
  text: And their brothers[a], heads of their fathers’ houses[c][b], were 1,760 mighty men of valor for the work of the service of the house of God.
translation:
  language: hi
  text: और उनके भाई[a], जो अपने पितृकुलों के मुखिया थे, कुल 1,760 पराक्रमी पुरुष थे, जो परमेश्वर के भवन[c] की सेवा का काम करते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कुल-संबंधी।” इब्रानी शब्द “भाई” सगे भाइयों के साथ-साथ एक ही कुल के पुरुष संबंधियों के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “सामर्थी पुरुष” अथवा “योग्य पुरुष।” मूल पदबंध सामर्थ्य, वीरता या सिद्ध योग्यता को व्यक्त कर सकता है; इस प्रसंग में इसका अर्थ आवश्यक रूप से युद्ध-कौशल नहीं है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात् मन्दिर। मूल में शाब्दिक रूप से “परमेश्वर का भवन” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई-बन्धु
  rationale: ‘भाई-बन्धु’ इब्रानी אָח के पारिवारिक अर्थ को बनाए रखते हुए यहाँ उसके व्यापक कुल-संबंधी आशय को स्वाभाविक हिन्दी में व्यक्त करता है; इसका अर्थ केवल सगे भाई होना आवश्यक नहीं।
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: अपने-अपने पितृकुलों के मुखिया
  rationale: यह वंशावली और प्रशासन से जुड़ी मानक अभिव्यक्ति है। ‘पितृकुल’ בית אבות के पैतृक घराने के भाव को संक्षिप्त और स्पष्ट हिन्दी में रखता है।
- source_word: אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 1,760
  rationale: इब्रानी संख्या का सीधा योग 1,760 है; आधुनिक हिन्दी में अंकों का प्रयोग स्पष्ट और सहज है।
- source_word: גִּבּוֹרֵי חֵיל
  choice: सामर्थी और योग्य पुरुष
  rationale: यह पदबंध शक्ति, योग्यता और सिद्ध क्षमता का सम्मानसूचक वर्णन कर सकता है। मन्दिर-सेवा के प्रसंग में यह अनुवाद अनावश्यक सैनिक अर्थ से बचते हुए उसके गौरवपूर्ण बल को बनाए रखता है।
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: सेवा का काम
  rationale: इससे מְלָאכָה के ‘काम’ और עֲבוֹדָה के ‘सेवा’—दोनों घटक हिन्दी में दिखाई देते हैं और वाक्य स्वाभाविक भी रहता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह मूल अभिव्यक्ति ‘परमेश्वर का घर/भवन’ को सुरक्षित रखता है; प्रसंग में इससे मन्दिर अभिप्रेत है। ‘भवन’ आधुनिक सम्मानपूर्ण हिन्दी में अधिक स्वाभाविक है।
theological_decisions:
- issue: कुल-संबंध बताने वाली पुल्लिंग बहुवचन भाषा
  choice: भाई-बन्धु
  alternative: कुल के लोग
  rationale: पाठ में पुरुष कुल-प्रमुखों और सेवा करने वाले पुरुषों का उल्लेख है। ‘भाई-बन्धु’ मूल के पुरुषवाचक पारिवारिक शब्द और उसके व्यापक कुलगत अर्थ दोनों को बनाए रखता है।
- issue: मन्दिर के लिए प्रयुक्त पद
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मन्दिर
  rationale: मूल पाठ ‘परमेश्वर का भवन/घर’ कहता है। चुना गया रूप उसी रूपक और धार्मिक अनुगूँज को सुरक्षित रखता है, जबकि पादटिप्पणी उसके प्रसंगगत अर्थ को स्पष्ट करती है।
- issue: גִּבּוֹרֵי חֵיל का सैनिक अथवा गैर-सैनिक आशय
  choice: सामर्थी और योग्य पुरुष
  alternative: वीर योद्धा
  rationale: पदबंध में वीरता या पराक्रम का भाव सम्भव है, पर यहाँ निकट प्रसंग परमेश्वर के भवन की सेवा है। इसलिए अनुवाद सिद्ध सामर्थ्य और योग्यता को व्यक्त करता है, बिना युद्ध-संबंधी अर्थ को निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’, ‘मुखिया’ और ‘सेवा का काम’ वंशावली तथा मन्दिर-प्रशासन के प्रसंग को स्पष्ट रखते हैं। वाक्य को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है, पर मूल के सभी अर्थ-घटक सुरक्षित हैं।
