translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। व्यक्तिनाम स्रोत के अनुसार लिप्यंतरित हैं। मुख्य पाठ की सहजता के लिए एक ही व्यक्ति के नाम की वर्तनी नियमित की गई है, जबकि स्रोत की वास्तविक भिन्नता पादटिप्पणी में सुरक्षित है।
