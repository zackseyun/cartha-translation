  text: וּ/בֶן יְהוֹנָתָ֖ן מְרִ֣יב בָּ֑עַל וּ/מְרִי בַ֖עַל הוֹלִ֥יד אֶת מִיכָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/040.yaml
  text: And the son of Jehonathan was Merib-baal[b][a], and Merib-baal fathered Micah.
translation:
  language: hi
  text: और यहोनातान का पुत्र मरीब-बाल[b][a] था, और मरीब-बाल मीका का पिता बना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस पद में इब्रानी पाठ पिता के नाम को दो थोड़े भिन्न रूपों में लिखता है: पहले ‘मरीब-बाल’ और फिर संक्षिप्त रूप ‘मरी-बाल’। स्पष्टता के लिए अनुवाद में दोनों जगह ‘मरीब-बाल’ रखा गया है।'
    reason: textual_variant
  - marker: b
    text: समानांतर वंशावली में 1 शमूएल 14:49 शाऊल के पुत्र का नाम ‘योनातान’ देती है; यहाँ इतिहासकार के इब्रानी पाठ में ‘यहोनातान’ रूप है।
    reason: cross_reference
lexical_decisions:
- source_word: וּ/בֶן
  choice: और ... का पुत्र
  rationale: בֶן का अर्थ ‘पुत्र’ है; आरम्भिक ו को ‘और’ के रूप में रखा गया है ताकि पिछली वंशावली-कड़ी से संबंध बना रहे।
- source_word: יְהוֹנָתָן
  choice: यहोनातान
  rationale: इब्रानी पाठ में यְהוֹנָתָן रूप है; इसे अधिक परिचित ‘योनातान’ में सामान्यीकृत न करके स्रोत-पाठ के विशिष्ट रूप के अनुसार लिप्यंतरित किया गया है।
- source_word: מְרִיב בָּעַל
  choice: मरीब-बाल
  rationale: दो अवयवों वाले इस व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है; योजक-चिह्न नाम की संरचना स्पष्ट करता है।
- source_word: וּ/מְרִי בַעַל
  choice: और मरीब-बाल
  rationale: यहाँ नाम की वर्तनी संक्षिप्त ‘मरी-बाल’ रूप में है, पर उसी व्यक्ति के लिए स्पष्टता हेतु मुख्य पाठ में पूरे नाम ‘मरीब-बाल’ को नियमित किया गया है और भिन्नता पादटिप्पणी में दी गई है।
- source_word: הוֹלִיד
  choice: पिता बना
  rationale: वंशावली के संदर्भ में ילד का हिफ़ील रूप ‘संतान का पिता होना/जन्म देना’ दर्शाता है। ‘पिता बना’ आधुनिक, स्वाभाविक और पुरुष-वंश संबंध को स्पष्ट रखने वाला प्रयोग है।
- source_word: אֶת מִיכָה
  choice: मीका
  rationale: אֶת प्रत्यक्ष कर्म का चिह्न है और अलग से अनूदित नहीं होता; מִיכָה का प्रचलित हिन्दी लिप्यंतरण ‘मीका’ है।
