source:
  edition: WLC
  text: וַ/עֲזַרְיָ֨ה בֶן חִלְקִיָּ֜ה בֶּן מְשֻׁלָּ֣ם בֶּן צָד֗וֹק בֶּן מְרָיוֹת֙ בֶּן אֲחִיט֔וּב נְגִ֖יד בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/011.yaml
  text: and Azariah son of Hilkiah[a], son of Meshullam, son of Zadok, son of Meraioth, son of Ahitub, chief officer of the house of God.
translation:
  language: hi
  text: और अजर्याह—हिल्किय्याह का पुत्र, हिल्किय्याह मशुल्लाम का पुत्र, मशुल्लाम सादोक का पुत्र, सादोक मरायोत का पुत्र और मरायोत अहीतूब का पुत्र—परमेश्वर के भवन का प्रधान अधिकारी[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अगुवा,” “प्रधान,” अथवा “शासक”।
    reason: נְגִיד के अर्थ-क्षेत्र में नेतृत्व, प्रधानता और शासन सम्मिलित हैं; सटीक पदवी संदर्भ से पूरी तरह निश्चित नहीं होती।
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: और अजर्याह
  rationale: उपसर्ग ו को पिछली सूची की निरंतरता दिखाने के लिए ‘और’ से व्यक्त किया गया है; עֲזַרְיָה का मानक हिन्दी लिप्यंतरण ‘अजर्याह’ है।
- source_word: בֶן
  choice: का पुत्र
  rationale: वंशावली में बार-बार आए בֶן का मूल संबंध ‘पुत्र’ से व्यक्त किया गया है। स्पष्ट और स्वाभाविक हिन्दी के लिए प्रत्येक पीढ़ी के नाम को दोहराकर संबंध बताया गया है; वंशावलियों में संभावित पीढ़ी-संक्षेप को पाठ से अधिक निश्चित नहीं किया गया।
- source_word: חִלְקִיָּה / מְשֻׁלָּם / צָדוֹק / מְרָיוֹת / אֲחִיטוּב
  choice: हिल्किय्याह / मशुल्लाम / सादोक / मरायोत / अहीतूब
  rationale: व्यक्तिगत नामों को उनके हिब्रू रूपों के आधार पर प्रचलित हिन्दी बाइबलीय शैली में लिप्यंतरित किया गया है।
- source_word: נְגִיד
  choice: प्रधान अधिकारी
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जिसे नेतृत्व या देखरेख का दायित्व सौंपा गया हो। मंदिर-प्रशासन के संदर्भ में ‘प्रधान अधिकारी’ आधुनिक हिन्दी में जिम्मेदारी और वरिष्ठता दोनों स्पष्ट करता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह चयन हिब्रू के ‘घर/भवन’ रूपक को सुरक्षित रखता है; संदर्भ में इससे परमेश्वर का मंदिर अभिप्रेत है।
theological_decisions:
- issue: मंदिर-संज्ञा में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: देवता
  rationale: इस्राएल के पवित्रस्थान के इस संदर्भ में אֱלֹהִים इस्राएल के परमेश्वर को सूचित करता है; बहुवचन अर्थ यहाँ संदर्भानुकूल नहीं है।
- issue: נְגִיד की पदवी का दायरा
  choice: प्रधान अधिकारी
  alternative: अगुवा / प्रधान / शासक
  rationale: पाठ यह निश्चित नहीं करता कि यह आधुनिक अर्थ में कोई विशिष्ट पदनाम था। ‘प्रधान अधिकारी’ प्रशासनिक देखरेख व्यक्त करता है, जबकि पादरीय या राजकीय पद को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। लम्बी हिब्रू वंशावली-श्रृंखला को हिन्दी में अस्पष्ट सर्वनामों से बचाने के लिए नाम दोहराकर प्रस्तुत किया गया है। पदवी से संबंधित पादटिप्पणी का चिह्न उसी पदवी के बाद रखा गया है।
