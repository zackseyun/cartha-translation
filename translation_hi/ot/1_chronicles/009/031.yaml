  text: וּ/מַתִּתְיָה֙ מִן הַ/לְוִיִּ֔ם ה֥וּא הַ/בְּכ֖וֹר לְ/שַׁלֻּ֣ם הַ/קָּרְחִ֑י בֶּ/אֱמוּנָ֕ה עַ֖ל מַעֲשֵׂ֥ה הַ/חֲבִתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/031.yaml
  text: And Mattithiah[a], from the Levites, the firstborn of Shallum the Korahite[b], was entrusted with the work of the flat cakes.
translation:
  language: hi
  text: और लेवियों में से मत्तित्याह, जो कोरहवंशी शल्लूम का पहला पुत्र था, को चपटी रोटियाँ[b] बनाने के काम की जिम्मेदारी सौंपी गई थी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विश्वासयोग्यता से”; इब्रानी पदबंध मत्तित्याह के विश्वासयोग्य ढंग से काम करने या उसे भरोसे की जिम्मेदारी सौंपे जाने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द एक प्रकार की सेंकी हुई रोटी या टिकिया के लिए है, जो संभवतः तवे पर बनाई जाती थी।
    reason: cultural_note
lexical_decisions:
- source_word: וּמַתִּתְיָה
  choice: और ... मत्तित्याह
  rationale: संयोजक वाव को ‘और’ से व्यक्त किया गया है; व्यक्ति के नाम का मानक देवनागरी लिप्यंतरण ‘मत्तित्याह’ रखा गया है।
- source_word: מִן הַלְוִיִּם
  choice: लेवियों में से
  rationale: מִן यहाँ समूह की सदस्यता बताता है; यह हिंदी में स्वाभाविक और स्रोत के निकट है।
- source_word: הוּא הַבְּכוֹר לְשַׁלֻּם
  choice: शल्लूम का पहलौठा
  rationale: בְּכוֹר का मूल अर्थ ‘पहलौठा’ सुरक्षित रखा गया है; संदर्भ से पुत्र का संबंध स्पष्ट है, इसलिए ‘बड़ा पुत्र’ जैसा व्याख्यात्मक रूप नहीं अपनाया गया।
- source_word: הַקָּרְחִי
  choice: कोरहवंशी
  rationale: यह कोरह से वंश या कुल-संबंध दर्शाने वाला विशेषण है; ‘कोरहवंशी’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: בֶּאֱמוּנָה
  choice: विश्वासयोग्यता से
  rationale: אֱמוּנָה विश्वसनीयता/निष्ठा का भाव व्यक्त करता है। क्रियाविशेषणात्मक अनुवाद स्रोत की संरचना को बचाता है, जबकि नियुक्त दायित्व का भाव अगले पदबंध से आता है।
- source_word: עַל מַעֲשֵׂה
  choice: बनाने के काम पर नियुक्त था
  rationale: עַל निरीक्षण या दायित्व का संकेत देता है और מַעֲשֵׂה यहाँ खाद्य-वस्तु बनाने के काम को दर्शाता है; संयुक्त हिंदी वाक्यांश प्रशासनिक जिम्मेदारी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַחֲבִתִּים
  choice: चपटी रोटियाँ
  rationale: यह किसी प्रकार की तवे या पतीली पर बनी रोटीनुमा टिकिया को सूचित करता है। ‘चपटी रोटियाँ’ ठोस पाक-संबंधी अर्थ रखता है और अनावश्यक बलिदानी अर्थ नहीं जोड़ता।
theological_decisions:
- issue: בֶּאֱמוּנָה का संबंध
  choice: मुख्य पाठ में इसे मत्तित्याह के विश्वासयोग्य ढंग से सेवा करने के रूप में रखा गया है।
  alternative: इसे ‘भरोसे के पद पर’ या ‘जिसे जिम्मेदारी सौंपी गई थी’ समझना।
  rationale: इब्रानी पदबंध दोनों अर्थों की गुंजाइश रखता है। मुख्य पाठ निकटतर क्रियाविशेषणात्मक अर्थ देता है और पादटिप्पणी प्रशासनिक अर्थ को सुरक्षित रखती है; किसी धार्मिक सिद्धांत को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘पहलौठा’ और ‘कोरहवंशी’ बाइबलीय वंश-संदर्भ को स्पष्ट रखते हैं; दुर्लभ खाद्य शब्द को मुख्य पाठ में समझने योग्य रूप देकर उसकी अनिश्चितता पादटिप्पणी में बताई गई है।
