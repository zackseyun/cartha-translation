translation:
  language: hi
  text: और याजकों के पुत्रों में से कुछ सुगंधित द्रव्यों का लेप तैयार करने वाले थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: और ... में से कुछ
  rationale: संयोजक और संबंधसूचक उपसर्ग के अंशवाचक अर्थ को सूची के संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי הַכֹּהֲנִים
  choice: याजकों के पुत्रों
  rationale: इब्रानी पारिवारिक अभिव्यक्ति और इतिहास-वृत्तांत की वंशावलीगत शैली को बनाए रखता है; संदर्भ में यह याजकीय परिवारों के सदस्यों को सूचित कर सकता है।
- source_word: רֹקְחֵי
  choice: तैयार करते थे
  rationale: कृदन्त का अर्थ कुशलतापूर्वक विभिन्न पदार्थ मिलाकर मिश्रण बनाने वालों से है; हिन्दी वाक्य में यह सहज और स्पष्ट है।
- source_word: הַמִּרְקַחַת
  choice: मिश्रण
  rationale: शब्द किसी विधिपूर्वक तैयार किए गए मिश्रित पदार्थ को दर्शाता है; केवल 'मरहम' कहना यहाँ अनावश्यक रूप से अर्थ को सीमित कर सकता है।
- source_word: לַבְּשָׂמִים
  choice: सुगंधित द्रव्यों का
  rationale: בְּשָׂמִים सुगंध देने वाले मसालों अथवा अन्य सुगंधित पदार्थों को दर्शाता है। हिन्दी में संबंधसूचक रचना पूरे पद का स्वाभाविक अर्थ देती है।
