  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’ वंशगत संरचना को सटीक रूप से व्यक्त करता है। दुर्लभ פטירים की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है; मुख्य पाठ में प्रसंगानुकूल अर्थ दिया गया है।
