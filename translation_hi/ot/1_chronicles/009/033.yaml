  text: וְ/אֵ֣לֶּה הַ֠/מְשֹׁרְרִים רָאשֵׁ֨י אָב֧וֹת לַ/לְוִיִּ֛ם בַּ/לְּשָׁכֹ֖ת פטירים כִּֽי יוֹמָ֥ם וָ/לַ֛יְלָה עֲלֵי/הֶ֖ם בַּ/מְּלָאכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/033.yaml
  text: These were the singers[a], heads of fathers’ houses of the Levites, in the chambers, free from other duties, for they were occupied in the work day and night.
translation:
  language: hi
  text: ये गायक, लेवियों के पितृकुलों के मुखिया, कोठरियों में रहते थे और अन्य कामों से मुक्त[a] थे, क्योंकि दिन-रात इस काम का दायित्व उन पर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और इसका अर्थ ‘छूट पाए हुए’ या ‘कार्य से मुक्त’ भी हो सकता है। सम्भवतः उन्हें दूसरे कामों से इसलिए मुक्त रखा गया था कि गायन-सेवा का दायित्व उन पर लगातार था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְשֹׁרְרִים
  choice: गायक
  rationale: שׁיר से बना यह कृदंत गाने का कार्य करनेवालों को दर्शाता है; ‘गायक’ सीधा और ‘संगीतकार’ से अधिक सटीक है।
- source_word: רָאשֵׁי אָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह वंश और कुल की औपचारिक सामाजिक संरचना को बनाए रखता है तथा आधुनिक हिन्दी में समझने योग्य है।
- source_word: לַלְוִיִּם
  choice: लेवियों के
  rationale: यह इन मुखियाओं का लेवी समुदाय से संबंध स्पष्ट करता है।
- source_word: בַּלְּשָׁכֹת
  choice: कोठरियों में
  rationale: לשכה संस्थागत अथवा पवित्रस्थान-परिसर के कमरों को दर्शाता है; ‘कोठरियाँ’ सन्दर्भ को बनाए रखता है, पर मूल में निहित न होने के कारण ‘मन्दिर’ नहीं जोड़ता।
- source_word: פטירים
  choice: अन्य कामों से मुक्त
  rationale: यह दुर्लभ रूप सम्भवतः छूटे हुए या दायित्व से मुक्त होने का अर्थ देता है। प्रसंग बताता है कि मुक्ति सभी कामों से नहीं, दूसरे लेवीय कामों से थी।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनकी छूट का कारण प्रस्तुत करता है।
- source_word: יוֹמָם וָלַיְלָה
  choice: दिन-रात
  rationale: मूल के कालसूचक युग्म को स्वाभाविक हिन्दी मुहावरे में सुरक्षित रखता है।
- source_word: עֲלֵיהֶם
  choice: ज़िम्मेदारी उन्हीं पर थी
  rationale: शाब्दिक अर्थ ‘उन पर’ है; यहाँ यह सौंपे गए निरन्तर दायित्व को व्यक्त करता है। ‘उन्हीं’ उस दायित्व के उनके ऊपर होने को स्वाभाविक हिन्दी में उभारता है।
- source_word: בַּמְּלָאכָה
  choice: इस काम
  rationale: מלאכה सामान्यतः काम या कार्य है। ‘इस काम’ मूल की व्यापकता बनाए रखता है और उसका विशेष स्वरूप प्रसंग पर छोड़ता है।
