  rationale: אֹצָר में भंडारगृह और कोषागार दोनों अर्थ संभव हैं। ‘भंडार’ व्यापक मुख्य-पाठ विकल्प है, जबकि आर्थिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
