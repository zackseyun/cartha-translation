base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/043.yaml
  text: And Moza fathered Binea[a], and his son was Rephaiah, his son Eleasah, his son Azel.
translation:
  language: hi
  text: और मोसा बिनआ का पिता था; मोसा का पुत्र रपायाह था, रपायाह का पुत्र एलआसा था, और एलआसा का पुत्र आसेल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹצָא
  choice: मोसा
  rationale: व्यक्तिवाचक नाम को मसोराई उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली में हिफ़ील रूप जनक-संतान संबंध बताता है। आधुनिक हिंदी में यह अभिव्यक्ति स्वाभाविक और गरिमापूर्ण है तथा अत्यधिक शाब्दिक ‘जन्म दिया’ से बचती है।
- source_word: בִּנְעָא
  choice: बिनआ
  rationale: मसोराई स्वरांकन में सुनाई देने वाले अंतिम आ को बनाए रखते हुए नाम का लिप्यंतरण किया गया है।
- source_word: וּרְפָיָה בְנוֹ
  choice: बिनआ का पुत्र रपायाह
  rationale: इब्रानी का शाब्दिक क्रम ‘और रपायाह उसका पुत्र’ है। स्पष्टता के लिए पूर्वज का नाम दोहराया गया है, बिना वंशक्रम बदले।
- source_word: אֶלְעָשָׂה בְנוֹ
  choice: उसका पुत्र एलआसा
  rationale: बार-बार आए בְנוֹ को ‘उसका पुत्र’ के रूप में सुरक्षित रखा गया है और नाम को इब्रानी के निकट लिप्यंतरित किया गया है।
- source_word: אָצֵל בְּנוֹ
  choice: उसका पुत्र आसेल
  rationale: वंशावली की अंतिम कड़ी और पुत्र-संबंध दोनों स्पष्ट रखे गए हैं।
