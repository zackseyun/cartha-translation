  text: 'And from the priests: Jedaiah, Jehoiarib, and Jakin.'
translation:
  language: hi
  text: 'और याजकों में से: यदायाह, यहोयारीब और याकीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִן
  choice: और ... में से
  rationale: वाव और מִן अगले समूह को सूची में जोड़ते हैं; हिंदी में विभक्त वाक्य-विन्यास के कारण ‘और याजकों में से’ स्वाभाविक है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: כֹּהֲנִים के लिए प्रचलित और अर्थ-सटीक हिंदी शब्द; परसर्ग ‘में से’ के कारण तिर्यक बहुवचन रूप प्रयुक्त है।
- source_word: יְדַעְיָה
  choice: यदायाह
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण, जिसमें अंतिम יה को ‘याह’ से दर्शाया गया है।
- source_word: וִיהוֹיָרִיב
  choice: यहोयारीब
  rationale: इब्रानी व्यक्तिगत नाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण; उपसर्गित संयोजक को हिंदी सूची-संरचना में समाहित किया गया है।
- source_word: וְיָכִין
  choice: और याकीन
  rationale: अंतिम सूची-पद के संयोजक וְ को ‘और’ रखा गया है तथा नाम का स्रोत-सन्निकट लिप्यंतरण किया गया है।
