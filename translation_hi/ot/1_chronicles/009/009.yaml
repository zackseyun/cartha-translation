  yaml_path: translation/ot/1_chronicles/009/009.yaml
  text: And their brothers[a], according to their generations, were nine hundred and fifty-six[b]. All these men were heads of fathers’ houses in their fathers’ households.
translation:
  language: hi
  text: और उनके भाई-बन्धु[a], अपनी वंशावलियों[b] के अनुसार, नौ सौ छप्पन थे। ये सभी पुरुष अपने पितरों के घरानों में पितृकुलों[c] के मुखिया थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भाई”; इस प्रसंग में इब्रानी शब्द कुल के अन्य पुरुष संबंधियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपनी पीढ़ियों के अनुसार”; इब्रानी शब्द वंश-क्रम अथवा वंशावली-अभिलेखों का बोध करा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से इब्रानी में “पिताओं के घरानों के मुखिया”; यह पितृवंश पर आधारित कुल या घराने के लिए प्रयुक्त पद है।
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई-बन्धु
  rationale: אָח का मूल अर्थ ‘भाई’ है, पर वंशावली और गोत्र-संबंधी प्रसंग में यह निकट संबंधियों या कुल-बंधुओं को भी समेट सकता है। ‘भाई-बन्धु’ इस विस्तृत कुलगत अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְתֹלְדוֹתָם
  choice: अपनी वंशावलियों के अनुसार
  rationale: תּוֹלְדוֹת यहाँ पीढ़ियों, वंश-क्रम या वंशावली-अभिलेखों का बोध कराता है। ‘वंशावलियों के अनुसार’ इतिहास-वृत्तान्त के पंजीकरण-संबंधी भाव को स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: תְּשַׁע מֵאוֹת וַחֲמִשִּׁים וְשִׁשָּׁה
  choice: नौ सौ छप्पन
  rationale: इब्रानी संख्या का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כָּל אֵלֶּה אֲנָשִׁים
  choice: ये सभी पुरुष
  rationale: אֲנָשִׁים पुल्लिंग बहुवचन है और यहाँ वंशावली में गिने गए पुरुष कुल-मुखियों की ओर संकेत करता है।
- source_word: רָאשֵׁי אָבוֹת לְבֵית אֲבֹתֵיהֶם
  choice: अपने-अपने पितृकुलों के मुखिया
  rationale: यह इतिहास-वृत्तान्त में पितृवंश पर आधारित सामाजिक और वंशावली इकाइयों के अगुओं के लिए प्रयुक्त पारिभाषिक अभिव्यक्ति है। हिन्दी में अनावश्यक और अस्पष्ट पुनरुक्ति से बचते हुए ‘पितृकुलों के मुखिया’ दोनों इब्रानी पदबंधों का संयुक्त आशय देता है।
