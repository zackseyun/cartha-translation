- source_word: וָמֶלֶךְ
  choice: मेलेक
  rationale: यहाँ מֶלֶךְ व्यक्तिवाचक नाम है; सूची को स्वाभाविक हिन्दी में रखते हुए उससे जुड़ा संयोजक अंतिम नाम से पहले व्यक्त किया गया है।
- source_word: וְתַחְרֵעַ
  choice: और तहरेआ
  rationale: व्यक्तिवाचक नाम का मूल के निकट लिप्यंतरण किया गया है और उपसर्ग וְ को हिन्दी सूची के अंतिम पद से पहले ‘और’ द्वारा व्यक्त किया गया है।
