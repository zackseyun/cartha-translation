base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/007.yaml
  text: 'And from the sons of Benjamin: Sallu son of Meshullam[a], son of Hodaviah[c][b], son of Hassenuah.'
translation:
  language: hi
  text: 'और बिन्यामीन के वंशजों में से: सल्लू, मशुल्लाम का पुत्र, होदव्याह का पुत्र, हस्सनूआ का पुत्र।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में वंशावली की पूरी श्रृंखला में हर नाम के साथ शाब्दिक रूप से “का पुत्र” है। वंशावलियों में यह अभिव्यक्ति कभी-कभी सीधे पुत्र के बजाय किसी बाद के वंशज को भी सूचित कर सकती है।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/מִן
  choice: और ... में से
  rationale: उपसर्ग וּ पिछले विवरण से संबंध जोड़ता है, और מִן चयन अथवा समूह में से होने का भाव देता है।
- source_word: בְּנֵי בִּנְיָמִן
  choice: बिन्यामीन के वंशजों
  rationale: शाब्दिक अर्थ ‘बिन्यामीन के पुत्र’ है, पर इस वंशावली-सूची में इसका आशय बिन्यामीन के गोत्र के सदस्यों अथवा वंशजों से है; ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: סַלּוּא
  choice: सल्लू
  rationale: इब्रानी नाम का देवनागरी में ध्वन्यात्मक लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र / पोता / परपोता
  rationale: इब्रानी में प्रत्येक पीढ़ी पर בֶּן दोहराया गया है। हिन्दी में संबंधों को क्रमशः पुत्र, पोता और परपोता कहना वंशक्रम को स्वाभाविक रूप से व्यक्त करता है; साथ की टिप्पणी इस संभावना को सुरक्षित रखती है कि वंशावली में कोई पीढ़ी लुप्त हो सकती है।
- source_word: מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: इब्रानी नाम का निकट ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: הוֹדַוְיָה
  choice: होदव्याह
  rationale: मसोरेटी पाठ की स्वर-रचना के अनुरूप नाम का लिप्यंतरण किया गया है।
- source_word: הַ/סְּנֻאָה
  choice: हस्सनूआ
  rationale: वंशावली के प्रसंग में इसे व्यक्तिवाचक नाम माना गया है; आरंभिक उपपद के समीकृत उच्चारण को ‘हस्स-’ से दर्शाया गया है।
