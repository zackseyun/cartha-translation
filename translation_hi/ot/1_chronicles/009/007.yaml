translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सूची की संरचना बचाने के लिए बृहद्विराम का प्रयोग किया गया है। मूल पाठ से सीधे प्रमाणित न होने के कारण संबंधित परंपराओं में होदव्याह की भिन्न वर्तनी पर अलग पाठ-टिप्पणी नहीं जोड़ी गई।
