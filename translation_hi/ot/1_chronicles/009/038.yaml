  text: Mikloth fathered Shimeam[a]. They also lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: hi
  text: और मिक्लोत शिमआम का पिता था[a]। वे भी यरूशलेम में अपने भाइयों के सामने[b], अपने भाइयों के साथ रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में नाम ‘शिमआम’ है; कुछ अनुवाद समानांतर वंशावलियों के रूपों से सामंजस्य बैठाते हुए ‘शिमा’ पढ़ते हैं।
    reason: alternative_reading
  - marker: b
    text: या “अपने भाइयों के समक्ष” अथवा “अपने भाइयों के निकट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: और मिक्लोत
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और आरंभिक संयोजक וּ को ‘और’ से रखा गया है, क्योंकि पद वंशावली के प्रवाह को आगे बढ़ाता है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: हिफ़ील वंशावली-सूत्र में पिता बनने या संतान उत्पन्न होने का बोध देता है। हिंदी में ‘मिक्लोत से … उत्पन्न हुआ’ स्वाभाविक, संक्षिप्त और पुरुष-वंश संबंध को स्पष्ट रखता है।
- source_word: אֶת שִׁמְאָם
  choice: शिमआम
  rationale: प्रत्यक्ष कर्मचिह्न का अलग अनुवाद नहीं किया गया। नाम को यहाँ के व्यंजनात्मक पाठ के अनुसार ‘शिमआम’ रखा गया है; समानांतर रूपों से सामंजस्य बैठाकर ‘शिमा’ नहीं किया गया।
- source_word: וְאַף הֵם
  choice: वे भी
  rationale: וְאַף का योगात्मक बल ‘भी’ से व्यक्त होता है; हिंदी वाक्य-प्रवाह में अलग ‘और’ आवश्यक नहीं है।
- source_word: נֶגֶד
  choice: सामने
  rationale: शब्द स्थानिक रूप से ‘सामने/आमने-सामने’ का अर्थ दे सकता है। ‘सामने’ निकट या समक्ष होने की वास्तविक अस्पष्टता को पूरी तरह एक ही दिशा में नहीं बाँधता।
- source_word: אֲחֵיהֶם
  choice: अपने भाइयों
  rationale: मूल पाठ का शाब्दिक संबंध ‘उनके भाई’ है। हिंदी में कर्ता से संबंध स्पष्ट करने के लिए ‘अपने भाइयों’ स्वाभाविक है; व्यापक ‘कुटुंबियों’ का अर्थ बिना आवश्यकता नहीं जोड़ा गया।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: यहाँ ישב निवास का द्योतक है। ‘रहते थे’ आधुनिक सामान्य हिंदी है और ‘बस गए’ जैसी आरंभिक बसावट की अतिरिक्त धारणा नहीं जोड़ता।
- source_word: בִירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थाननाम का प्रचलित हिंदी रूप और मूल पूर्वसर्ग दोनों सुरक्षित हैं।
- source_word: עִם אֲחֵיהֶם
  choice: अपने भाइयों के साथ
  rationale: עִם का सहवर्ती अर्थ ‘के साथ’ से व्यक्त किया गया है। मूल में ‘भाइयों’ की पुनरावृत्ति है, इसलिए उसे हटाया नहीं गया।
