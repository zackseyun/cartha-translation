- source_word: הַשֹּׁעֲרִים
  choice: द्वारपाल
  rationale: यह संज्ञा फाटकों की देखरेख और पहरेदारी करने वालों को दर्शाती है; मन्दिर के प्रसंग में ‘द्वारपाल’ मानक और स्वाभाविक हिन्दी शब्द है।
- source_word: מִזְרָח יָמָּה צָפוֹנָה וָנֶגְבָּה
  choice: पूर्व, पश्चिम, उत्तर और दक्षिण में
  rationale: ये चारों दिशासूचक रूप हैं। יָמָּה का शाब्दिक संबंध ‘समुद्र की ओर’ से और נֶגְבָּה का ‘नेगेव/दक्षिण की ओर’ से है, पर चारों दिशाओं की सूची में इनके स्पष्ट समतुल्य ‘पश्चिम’ और ‘दक्षिण’ हैं। अंतिम ‘में’ हिन्दी वाक्य में चारों दिशाओं पर लागू होता है।
