  text: וְ/הַ/יּוֹשְׁבִים֙ הָ/רִ֣אשֹׁנִ֔ים אֲשֶׁ֥ר בַּ/אֲחֻזָּתָ֖/ם בְּ/עָרֵי/הֶ֑ם יִשְׂרָאֵל֙ הַ/כֹּ֣הֲנִ֔ים הַ/לְוִיִּ֖ם וְ/הַ/נְּתִינִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/002.yaml
  text: The first inhabitants who lived in their possessions in their cities were Israel[a], the priests, the Levites, and the temple servants.
translation:
  language: hi
  text: जो पहले अपने अधिकार के भाग में, अर्थात अपने नगरों में, बसे थे, वे इस्राएली, याजक, लेवी और मंदिर के सेवक[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नतीनीम,” मंदिर की सेवा के लिए नियुक्त एक वर्ग का पारंपरिक लिप्यंतरण।
    reason: नְתִינִים के पारंपरिक नाम को वैकल्पिक रूप में सुरक्षित रखते हुए उसके कार्य का संक्षिप्त अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: וְהַיּוֹשְׁבִים הָרִאשֹׁנִים
  choice: पहले निवासी
  rationale: ישׁב का कृदंत रहने वालों अथवा निवासियों को और הָרִאשֹׁנִים उन्हें ‘पहले’ समूह के रूप में दर्शाता है। संक्षिप्त ‘पहले निवासी’ आधुनिक हिंदी में स्वाभाविक है। आरंभिक וְ को अलग से ‘और’ कहना हिंदी में आवश्यक नहीं है।
- source_word: אֲשֶׁר בַּאֲחֻזָּתָם בְּעָרֵיהֶם
  choice: अपनी-अपनी संपत्ति के नगरों में रहने वाले
  rationale: אֲחֻזָּה अधिकार में मिली या पैतृक संपत्ति/भूभाग का बोध करा सकता है। बहुवचन स्वामियों के साथ ‘अपनी-अपनी’ वितरणात्मक भाव स्पष्ट करता है; ‘संपत्ति के नगरों’ से भूमि-अधिकार और नगरों के बीच का संबंध स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएली
  rationale: सूची में यह लोगों के व्यापक समुदाय को सूचित करता है। ‘इस्राएली’ हिंदी में व्यक्ति-समूह के लिए ‘इस्राएल’ से अधिक सहज है और आगे दिए याजक तथा लेवी वर्गों के साथ ठीक बैठता है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: कुलीन अथवा मंदिर-संबंधी पुरोहित वर्ग के लिए प्रचलित और स्पष्ट बाइबलीय हिंदी शब्द।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: लैव्य गोत्र/वर्ग के सदस्यों के लिए हिंदी बाइबल परंपरा में प्रचलित रूप; संदर्भ में यह याजकों से अलग वर्ग है।
- source_word: וְהַנְּתִינִים
  choice: और मंदिर के सेवक[a]
  rationale: נְתִינִים मंदिर की सेवा के लिए नियुक्त एक पहचाना हुआ वर्ग था। कार्यपरक अनुवाद सामान्य पाठक को अर्थ बताता है, जबकि पारंपरिक नाम पाद-टिप्पणी में सुरक्षित है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। वंशावली-सदृश सूची की संरचना सुरक्षित है। पाद-टिप्पणी का चिह्न ‘मंदिर के सेवक’ पर रखा गया है, क्योंकि वही נְתִינִים का अनुवाद है।
