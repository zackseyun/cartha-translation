    text: या ‘सात दिनों के लिए’; इब्रानी वाक्यांश संभवतः सेवा की सात-दिवसीय पारी को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: शाब्दिक अर्थ ‘उनके भाई’ है; प्रसंग में यह साथी लेवियों या कुल-बंधुओं को भी सूचित कर सकता है, पर ‘भाई’ मूल की सामाजिक और पारिवारिक भाषा बनाए रखता है।
- source_word: בְּחַצְרֵיהֶם
  choice: जो अपने गाँवों में रहते थे
  rationale: חָצֵר का अर्थ आँगन, बस्ती या गाँव हो सकता है। यहाँ मन्दिर-परिसर से बाहर निवास करने वालों का उल्लेख है, इसलिए ‘गाँवों’ उपयुक्त है; ‘रहते थे’ हिन्दी में संबंध को स्वाभाविक बनाता है।
- source_word: לָבוֹא
  choice: आते थे
  rationale: לְ सहित क्रियार्थक संज्ञा प्रसंग में नियत आगमन और दायित्व को दर्शाती है। हिन्दी का अपूर्ण भूतकाल नियमित रूप से निर्धारित आने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְשִׁבְעַת הַיָּמִים
  choice: हर सात दिन में
  rationale: वाक्यांश सात दिनों के आवर्ती क्रम या अंतराल को सूचित करता जान पड़ता है। ‘हर सात दिन में’ सेवा की नियमित पारी का संकेत देता है, पर उसकी अवधि को निर्णायक रूप से निश्चित नहीं करता।
- source_word: מֵעֵת אֶל עֵת
  choice: समय-समय पर
  rationale: यह मुहावरा बार-बार आने वाले अवसरों या नियत अंतरालों को दर्शाता है; ‘समय-समय पर’ इसका सहज हिन्दी रूप है।
- source_word: עִם אֵלֶּה
  choice: इनके साथ सेवा करने
  rationale: शाब्दिक अर्थ ‘इनके साथ’ है और संकेतवाचक सर्वनाम पहले उल्लिखित द्वारपालों की ओर संकेत करता है। ‘सेवा करने’ निकटवर्ती प्रशासनिक प्रसंग में निहित कार्य को स्पष्ट करता है, जबकि ‘इनके साथ’ मूल संकेत को सुरक्षित रखता है।
