translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण प्रशासनिक वर्णन रखा गया है। मूल के आवर्ती सेवा-क्रम को स्पष्ट किया गया है, किंतु सात दिनों के अंतराल और सात दिनों की अवधि के बीच की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
