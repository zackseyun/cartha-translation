  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/039.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: hi
  text: नेर से कीश उत्पन्न हुआ, कीश से शाऊल उत्पन्न हुआ, और शाऊल से योनातान, मल्की-शूअ, अबीनादाब और एशबाल[a] उत्पन्न हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एशबाल को 2 शमूएल 2:8 और उससे संबंधित पदों में ईशबोशेत कहा गया है।
    reason: शमूएल की पुस्तक में इसी व्यक्ति के लिए प्रयुक्त वैकल्पिक नाम से पाठक को अवगत कराना, जबकि मुख्य पाठ में इतिहास-वृत्तान्त के इब्रानी नाम को बनाए रखना।
lexical_decisions:
- source_word: הוֹלִיד
  choice: जन्म दिया
  rationale: वंशावली में हिफ़ील रूप का अर्थ संतान उत्पन्न करना है। ‘जन्म दिया’ आधुनिक हिन्दी में संक्षिप्त और परिचित वंशावली-प्रयोग है तथा मूल की बार-बार आने वाली क्रिया को बनाए रखता है।
- source_word: נֵר
  choice: नेर
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: קִישׁ
  choice: कीश
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित और पहचाना जाने वाला हिन्दी रूप।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: מַלְכִּי שׁוּעַ
  choice: मल्कीशूअ
  rationale: इब्रानी में दो घटकों से बना एक व्यक्तिवाचक नाम; हिन्दी में इसे एक संयुक्त नाम के रूप में लिखा गया है।
- source_word: אֲבִינָדָב
  choice: अबीनादाब
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी रूप।
- source_word: אֶשְׁבָּעַל
  choice: एशबाल
  rationale: इतिहास-वृत्तान्त के मूल इब्रानी पाठ में यही नाम है; इसलिए शमूएल के वैकल्पिक नाम से सामंजस्य बैठाने के बजाय स्रोत-पाठ का नाम रखा गया है।
- source_word: וְ
  choice: और
  rationale: दोहराए गए संयोजक वाव को स्वाभाविक हिन्दी समन्वय में व्यक्त किया गया है; वंशक्रम की कड़ियाँ वाक्य-विन्यास से भी स्पष्ट हैं।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: इब्रानी का निश्चित कर्म-सूचक चिह्न है, जिसका हिन्दी में स्वतंत्र शाब्दिक समतुल्य नहीं; उसका कार्य ‘को’ वाले वाक्य-विन्यास में व्यक्त है।
