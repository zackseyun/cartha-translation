translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की वंशावली-संबंधी पुनरावृत्ति को स्पष्टता और लय के लिए सुरक्षित रखा गया है। पाद-टिप्पणी का चिह्न उसी नाम के बाद रखा गया है जिससे टिप्पणी संबंधित है।
