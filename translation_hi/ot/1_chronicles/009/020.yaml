  text: And Phinehas son of Eleazar had formerly been chief over them[a]; Yahweh was with him.
translation:
  language: hi
  text: और एलीआज़ार का पुत्र पीनहास पहले उनका प्रधान था[a]; याहवे उसके साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और एलीआज़ार का पुत्र पीनहास उनका प्रधान था—यह पहले की बात है।” इब्रानी शब्द-क्रम में ‘पहले’ को ‘प्रधान था’ के साथ निकटता से या पूरे कथन के साथ जोड़ा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפִינְחָס
  choice: और पीनहास
  rationale: नाम को प्रचलित हिन्दी बाइबलीय रूप में रखा गया है और आरम्भिक וּ को पिछले कथन से जोड़ने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: בֶּן אֶלְעָזָר
  choice: एलीआज़ार का पुत्र
  rationale: इब्रानी वंश-संबंधी रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: נָגִיד
  choice: प्रधान
  rationale: यह शब्द नेतृत्व और अधिकार के पद को दर्शाता है। इस उपासना-संबंधी प्रशासनिक प्रसंग में ‘प्रधान’ उपयुक्त है और राजकीय अर्थ को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: הָיָה עֲלֵיהֶם
  choice: उन पर प्रधान था
  rationale: עַל के सर्वनाम-प्रत्यय में पहले उल्लिखित लोगों पर अधिकार या देखरेख का भाव है; हिन्दी में ‘उन पर प्रधान था’ मूल संरचना और अर्थ दोनों को बनाए रखता है।
- source_word: לְפָנִים
  choice: पहले
  rationale: यह क्रियाविशेषण बीते समय को सूचित करता है। ‘पहले’ वर्तमान हिन्दी में सहज है, जबकि इसकी वाक्यगत संबद्धता की सम्भावित अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: עִמּוֹ
  choice: उसके साथ था
  rationale: सरल अनुवाद दिव्य उपस्थिति और अनुग्रह के निहित भाव को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: ‘याहवे उसके साथ था’ में दिव्य उपस्थिति का अर्थ
  choice: वाक्य को सीधे और अव्याख्यायित रूप में रखना
  alternative: याहवे उसकी सहायता करता था
  rationale: ‘साथ था’ उपस्थिति, समर्थन या अनुग्रह का भाव धारण कर सकता है। किसी एक अर्थ को स्पष्ट करके मूल की धर्मवैचारिक गहराई और सम्भावित अर्थ-विस्तार को सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’ नेतृत्व के पद को संक्षेप में व्यक्त करता है; नामों के लिए प्रचलित हिन्दी बाइबलीय रूप और परमेश्वर के नाम के लिए ‘याहवे’ लिप्यंतरण अपनाया गया है।
