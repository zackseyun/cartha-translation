translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी अपनाई गई है। नामों का देवनागरी लिप्यंतरण किया गया है। लगातार दो वंशावलियों को अर्धविराम से अलग किया गया है, और संदिग्ध जातिवाचक/स्थानवाचक निरूपण को पाठ में तय कर देने के बजाय पादटिप्पणी में सुरक्षित रखा गया है।
