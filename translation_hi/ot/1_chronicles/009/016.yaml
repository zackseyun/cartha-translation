base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/016.yaml
  text: and Obadiah son of Shemaiah[a], son of Galal, son of Jeduthun, and Berechiah son of Asa, son of Elkanah, who lived in the villages of the Netophathites.
translation:
  language: hi
  text: और ओबद्याह, शमायाह का पुत्र, गालाल का पुत्र और यदूतून का पुत्र; और बेरेक्याह, आसा का पुत्र, एलकाना का पुत्र, जो नतोपातियों की बस्तियों में रहता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नतोपा की बस्तियों में रहता था”—हिब्रू के जातिवाचक रूप को लोगों के नाम (“नतोपाती”) या स्थान के नाम (“नतोपा”) से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עֹבַדְיָה
  choice: और ओबद्याह
  rationale: उपसर्ग וְ इस नाम को पिछली सूची से जोड़ता है; इसलिए ‘और’ रखा गया है। नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן
  choice: पुत्र / पोता / परपोता
  rationale: वंशावली की क्रमिक ‘בן ... בן ...’ संरचना को स्वाभाविक हिन्दी में संबंध की पीढ़ियाँ स्पष्ट करके व्यक्त किया गया है; इससे स्रोत का वंशानुक्रम बना रहता है।
- source_word: הַ/יּוֹשֵׁב
  choice: रहता था
  rationale: संज्ञार्थक कृदंत बेरेक्याह के निवास का वर्णन करता है। ‘रहता था’ आधुनिक हिन्दी में उसके आवासीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּ/חַצְרֵי
  choice: की बस्तियों में
  rationale: חָצֵר यहाँ भौगोलिक संदर्भ में घेरे या आँगन के बजाय छोटी ग्रामीण बस्तियों को सूचित करता है।
- source_word: נְטוֹפָתִי
  choice: नतोपातियों
  rationale: यह जातिवाचक रूप नतोपा से जुड़े निवासियों को दर्शाता है। ‘नतोपातियों की बस्तियाँ’ हिब्रू संरचना का सीधा और सुबोध निरूपण है।
