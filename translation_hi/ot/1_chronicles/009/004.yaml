base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/004.yaml
  text: Uthai son of Ammihud[a], son of Omri, son of Imri, son of Bani, from the sons of Perez son of Judah.
translation:
  language: hi
  text: ऊतै अम्मीहूद का पुत्र, ओम्री का पुत्र, इम्री का पुत्र और बानी का पुत्र था; वह यहूदा के पुत्र पेरेस के वंशजों में से था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'यहाँ इब्रानी पाठ-परंपरा कठिन है। जिस पाठ को “बानी” पढ़ा गया है, उसे “से” भी पढ़ा जा सकता है। तब पाठ होगा: “ऊतै अम्मीहूद का पुत्र, ओम्री का पुत्र और इम्री का पुत्र था; वह यहूदा के पुत्र पेरेस के वंशजों में से था।” मुख्य पाठ में व्यक्तिनाम “बानी” रखा गया है, क्योंकि यह नामों की वंशावली-शृंखला के अधिक अनुकूल है।'
    reason: textual_variant
