  text: אֵלֶּה֩ רָאשֵׁ֨י הָ/אָב֧וֹת לַ/לְוִיִּ֛ם לְ/תֹלְדוֹתָ֖/ם רָאשִׁ֑ים אֵ֖לֶּה יָשְׁב֥וּ בִ/ירוּשָׁלִָֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/034.yaml
  text: These were the heads of the fathers’ houses of the Levites[a], according to their generations, heads[b]. These lived in Jerusalem.
translation:
  language: hi
  text: ये लेवियों के पितृकुलों[a] के मुखिया थे—अपनी-अपनी वंशावली के अनुसार प्रधान पुरुष[b]। ये यरूशलेम में रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पितृकुल” से आशय किसी एक छोटे घर-परिवार से नहीं, बल्कि एक पूर्वज से जुड़ी कुल या वंशगत पारिवारिक इकाई से है।
    reason: cultural_note
  - marker: b
    text: मूल इब्रानी में “मुखिया” के लिए प्रयुक्त शब्द को यहाँ फिर दोहराकर इन पुरुषों की प्रधानता पर बल दिया गया है। इसका अनुवाद “मुखिया” या “प्रधान” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאשֵׁי ... רָאשִׁים
  choice: मुखिया ... प्रधान पुरुष
  rationale: दोनों शब्द एक ही इब्रानी मूल से हैं। हिंदी में स्वाभाविकता बनाए रखते हुए ‘मुखिया ... प्रधान पुरुष’ उनकी नेतृत्व-स्थिति और मूल पाठ के बलाघात, दोनों को व्यक्त करता है।
- source_word: הָאָבוֹת
  choice: पितृकुलों
  rationale: यहाँ आशय केवल अलग-अलग पिताओं या छोटे घर-परिवारों से नहीं, बल्कि पूर्वज के आधार पर पहचानी जाने वाली कुल-इकाइयों से है।
- source_word: לַלְוִיִּם
  choice: लेवियों के
  rationale: उपसर्ग ל यहाँ संबंध या वर्ग को सूचित करता है; ये पितृकुल लेवियों के थे।
- source_word: לְתֹלְדוֹתָם
  choice: अपनी-अपनी वंशावली के अनुसार
  rationale: वंशगत क्रम और पहचान का भाव व्यक्त होता है; ‘अपनी-अपनी’ बहुवचन कुलों के वितरण को स्वाभाविक हिंदी में स्पष्ट करता है, बिना इसे अनिवार्यतः लिखित अभिलेख मानने के।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: यहाँ क्रिया निवास को सूचित करती है; आधुनिक हिंदी में ‘रहते थे’ सहज और स्पष्ट है।
- source_word: בִירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग का मानक हिंदी रूप।
