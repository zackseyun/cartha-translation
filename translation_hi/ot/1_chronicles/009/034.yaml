  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’ इतिहास-वर्णन और वंशावली के संदर्भ में आवश्यक सामाजिक अर्थ को संक्षेप में व्यक्त करता है। इब्रानी की पुनरुक्ति को हूबहू असहज रूप में दोहराने के बजाय ‘मुखिया ... प्रधान पुरुष’ द्वारा अर्थ और बलाघात सुरक्षित रखा गया है।
