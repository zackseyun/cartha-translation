source:
  edition: WLC
  text: וְ/שַׁלּ֣וּם בֶּן ק֠וֹרֵא בֶּן אֶבְיָסָ֨ף בֶּן קֹ֜רַח וְֽ/אֶחָ֧י/ו לְ/בֵית אָבִ֣י/ו הַ/קָּרְחִ֗ים עַ֚ל מְלֶ֣אכֶת הָ/עֲבוֹדָ֔ה שֹׁמְרֵ֥י הַ/סִּפִּ֖ים לָ/אֹ֑הֶל וַ/אֲבֹֽתֵי/הֶם֙ עַל מַחֲנֵ֣ה יְהוָ֔ה שֹׁמְרֵ֖י הַ/מָּבֽוֹא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/019.yaml
  text: And Shallum son of Kore[a], son of Ebiasaph, son of Korah, and his brothers from his father’s house, the Korahites, were over the work of the service, keepers of the thresholds of the tent; and their fathers had been over the camp of Yahweh[b], keepers of the entrance.
translation:
  language: hi
  text: और शल्लूम, कोरे का पुत्र, एब्यासाप का पुत्र, कोरह का पुत्र, और उसके पितृकुल के उसके भाई, अर्थात् कोरही, सेवा-कार्य की देखरेख करते थे; वे तंबू की दहलीज़ों[a] के रखवाले थे। और उनके पूर्वज याहवे[b] की छावनी की देखरेख करते और प्रवेश के रखवाले थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तंबू के फाटकों के रखवाले।” इब्रानी में शाब्दिक रूप से “तंबू की दहलीज़ों के रखवाले” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है, जिसे यहाँ “याहवे” लिखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשַׁלּוּם
  choice: और ... शल्लूम
  rationale: आरंभिक वाव पद को पिछली सूची से जोड़ता है; ‘और’ इस साधारण संयोजन को बनाए रखता है।
- source_word: בֶּן ... בֶּן ... בֶּן
  choice: कोरे का पुत्र ... एब्यासाप का पुत्र ... कोरह का पुत्र
  rationale: वंशावली की तीनों ‘पुत्र’ कड़ियाँ स्पष्ट रूप से रखी गई हैं; उन्हें केवल ‘वंशज’ कहकर संक्षिप्त नहीं किया गया।
- source_word: וְאֶחָיו לְבֵית אָבִיו
  choice: तथा उसके पितृकुल के उसके भाई
  rationale: ‘भाई’ मूल के पुरुषवाचक बहुवचन को और ‘पितृकुल’ पारिवारिक-वंशीय संबद्धता को व्यक्त करता है।
- source_word: הַקָּרְחִים
  choice: कोरही
  rationale: यह बहुवचन कुलनाम कोरह के वंश या कुल के पुरुषों को सूचित करता है; हिंदी बाइबलीय प्रयोग में ‘कोरही’ स्वाभाविक है।
- source_word: עַל מְלֶאכֶת הָעֲבוֹדָה
  choice: सेवा के काम का दायित्व सँभालते थे
  rationale: עַל यहाँ अधिकार या उत्तरदायित्व दर्शाता है। यह हिंदी में स्वाभाविक है और ‘सेवा’ को बाद की कलीसियाई ‘मिनिस्ट्री’ की संकल्पना नहीं बनाता।
- source_word: שֹׁמְרֵי הַסִּפִּים לָאֹהֶל
  choice: तंबू की दहलीज़ों के पहरेदार
  rationale: סִפִּים का ठोस अर्थ ‘दहलीज़ें’ है और אֹהֶל केवल ‘तंबू’ कहता है; मुख्य पाठ में दोनों को अपेक्षाकृत औपचारिक रूप से रखा गया है।
- source_word: וַאֲבֹתֵיהֶם
  choice: और उनके पूर्वज
  rationale: संदर्भ पहले के युग की ओर लौटता है; हिंदी में ‘पूर्वज’ बहुवचन אָבוֹת की वंशगत भावना को ‘पिता’ की अपेक्षा अधिक स्पष्ट करता है।
- source_word: עַל מַחֲנֵה יְהוָה
  choice: याहवे की छावनी के अधिकारी
  rationale: עַל उत्तरदायित्व दर्शाता है, מַחֲנֶה छावनी को, और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: שֹׁמְרֵי הַמָּבוֹא
  choice: प्रवेश-द्वार के पहरेदार
  rationale: מָבוֹא प्रवेश या आने के स्थान को दर्शाता है; ‘प्रवेश-द्वार’ पहरेदारी के संदर्भ में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में रखता है; पाठक-सहायता के लिए पादटिप्पणी दी गई है।
- issue: पवित्रस्थान के लिए אֹהֶל की अभिव्यक्ति
  choice: तंबू
  alternative: मिलापवाला तंबू; निवासस्थान
  rationale: मूल शब्द सामान्यतः ‘तंबू’ है। संदर्भ पवित्रस्थान का है, पर मुख्य पाठ अधिक तकनीकी धार्मिक पद जोड़कर संकेत को आवश्यकता से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वंशावली की पुनरावृत्ति को बचाते हुए डैश से वाक्य-संरचना स्पष्ट की गई है। ‘दहलीज़’ की ठोस मूल छवि मुख्य पाठ में है और संदर्भगत ‘फाटक’ पादटिप्पणी में।
