    text: परंपरागत रूप से इसे “भेंट की रोटी,” “दर्शन की रोटी,” या “उपस्थिति की रोटी” कहा जाता है। इब्रानी में इसका शाब्दिक संकेत उस रोटी की ओर है जिसे व्यवस्थित या क्रम से रखा जाता था।
