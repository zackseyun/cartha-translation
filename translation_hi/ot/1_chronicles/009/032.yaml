- source_word: לֶחֶם הַמַּעֲרָכֶת
  choice: पंक्तियों में रखी जानेवाली रोटी
  rationale: מַעֲרָכֶת में व्यवस्थित करके रखने का भाव है। यह अनुवाद पारंपरिक किंतु आज अस्पष्ट पद के बजाय ठोस क्रिया को सामने लाता है।
- source_word: לְהָכִין
