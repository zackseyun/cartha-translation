  rationale: उद्देश्यसूचक क्रियारूप का आशय रोटी तैयार करना है; ‘उसे’ प्रसंग में निहित कर्म को स्पष्ट करता है।
- source_word: שַׁבַּת שַׁבָּת
  choice: हर सब्त को
  rationale: संज्ञा की पुनरावृत्ति का वितरणात्मक अर्थ प्रत्येक सब्त है; आधुनिक हिन्दी में ‘हर सब्त को’ स्पष्ट और सहज है।
