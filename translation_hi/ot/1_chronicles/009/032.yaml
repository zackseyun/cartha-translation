  text: और कहाती वंशजों में से कुछ अपने भाइयों में से व्यवस्थित रखी जानेवाली रोटी[a] की देखरेख करते थे और उसे हर सब्त को तैयार करते थे।
  philosophy: optimal-equivalence
  footnotes:
