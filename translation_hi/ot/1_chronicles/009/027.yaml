- source_word: וְהֵם עַל הַמַּפְתֵּחַ
  choice: चाबी का दायित्व उन्हीं पर था
  rationale: मूल के ‘वे चाबी पर थे’ को स्वाभाविक हिन्दी में रखते हुए चाबी की अभिरक्षा अथवा खोलने की जिम्मेदारी के बीच की वास्तविक अस्पष्टता को पूरी तरह समाप्त नहीं करता।
- source_word: וְלַבֹּקֶר לַבֹּקֶר
  choice: हर सुबह
  rationale: दोहराव से व्यक्त नियमित दैनिक क्रिया को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत करता है।
