base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/027.yaml
  text: They spent the night around the house of God[a], because the duty of guarding it was upon them, and they were in charge of opening it morning by morning.
translation:
  language: hi
  text: वे परमेश्वर के भवन के चारों ओर रात बिताते थे, क्योंकि उसकी रखवाली का दायित्व उन पर था; चाबी की देखरेख भी उन्हीं के जिम्मे थी[a], और वे हर सुबह भवन खोलते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में अधिक शाब्दिक रूप से, “वे चाबी पर थे।” यह पदबंध चाबी की अभिरक्षा या परमेश्वर के भवन को खोलने की जिम्मेदारी, दोनों में से किसी का संकेत कर सकता है।
    reason: lexical_alternative
