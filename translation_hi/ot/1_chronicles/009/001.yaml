  text: וְ/כָל יִשְׂרָאֵל֙ הִתְיַחְשׂ֔וּ וְ/הִנָּ֣/ם כְּתוּבִ֔ים עַל סֵ֖פֶר מַלְכֵ֣י יִשְׂרָאֵ֑ל וִ/יהוּדָ֛ה הָגְל֥וּ לְ/בָבֶ֖ל בְּ/מַעֲלָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/001.yaml
  text: So all Israel was enrolled by genealogy[a], and behold, they are written in the Book of the Kings of Israel[b]; and Judah was taken into exile to Babylon because of their unfaithfulness.
translation:
  language: hi
  text: इस प्रकार समस्त इस्राएल का वंशावली के आधार पर पंजीकरण किया गया[a], और देखो, वे “इस्राएल के राजाओं की पुस्तक” में लिखे हुए हैं; और यहूदा को अपने विश्वासघात के कारण बाबेल में निर्वासित कर दिया गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वंशावलियों के अनुसार उनकी गणना की गई” अथवा “उन्हें वंशावली के अनुसार दर्ज किया गया।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपने अपराध के कारण” अथवा “अपनी विश्वासहीनता के कारण।” इब्रानी शब्द में निष्ठा भंग करने या विश्वास तोड़ने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְיַחְשׂוּ
  choice: वंशावली के अनुसार नामावली तैयार की गई
  rationale: हित्पएल रूप वंश या कुल-संबंध को प्रमाणित करके वंशावली में दर्ज किए जाने का बोध देता है; यह अनुवाद केवल गिनती नहीं, बल्कि वंशावलीगत पंजीकरण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנָּם
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला प्रस्तुतिपरक संकेत है। ‘और देखो’ उसके बल को बनाए रखता है, जबकि आधुनिक पाठक के लिए समझने योग्य है।
- source_word: כְּתוּבִים
  choice: लिखे हुए हैं
  rationale: निष्क्रिय कृदन्त यहाँ वर्तमान स्थितिवाचक अर्थ देता है—वे अभिलेख में लिखित हैं।
- source_word: עַל סֵפֶר
  choice: पुस्तक में
  rationale: यद्यपि עַל का मूल अर्थ ‘पर’ है, लिखित अभिलेख के संदर्भ में हिन्दी मुहावरे के अनुसार ‘पुस्तक में’ स्वाभाविक है।
- source_word: מַלְכֵי יִשְׂרָאֵל
  choice: इस्राएल के राजाओं की पुस्तक
  rationale: यह एक पहचाने जाने योग्य राजकीय अभिलेख या ग्रंथ के शीर्षक का संकेत देता है।
- source_word: וִיהוּדָה
  choice: और यहूदा
  rationale: संयोजक अगली उपवाक्यात्मक इकाई आरम्भ करता है; ‘यहूदा’ यहाँ दक्षिणी राज्य अथवा उसके लोगों के लिए सामूहिक संज्ञा है।
- source_word: הָגְלוּ
  choice: निर्वासित कर दिया गया
  rationale: होफल रूप कारणवाचक निष्क्रिय है और बताता है कि यहूदा स्वयं नहीं गया, बल्कि उसे देश से निकालकर ले जाया गया।
- source_word: לְבָבֶל
  choice: बाबेल में
  rationale: गंतव्य के रूप में बाबेल को दर्शाने वाला स्वाभाविक हिन्दी प्रयोग है; ‘निर्वासित कर दिया गया’ के साथ ‘में’ निर्वासन के स्थान को स्पष्ट करता है।
- source_word: בְּמַעֲלָם
  choice: अपने विश्वासघात के कारण
  rationale: מַעַל केवल सामान्य अपराध नहीं, बल्कि निष्ठा भंग करने या विश्वास तोड़ने का अर्थ भी रखता है; ‘विश्वासघात’ इस गंभीर संबंधपरक और वाचागत आयाम को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: בְּמַעֲלָם में यहूदा के अपराध का स्वरूप
  choice: अपने विश्वासघात के कारण
  alternative: अपने अपराध के कारण / अपनी विश्वासहीनता के कारण
  rationale: मूल शब्द प्रायः परमेश्वर के प्रति निष्ठा भंग करने का अर्थ रखता है। ‘विश्वासघात’ उस आयाम को बनाए रखता है, पर पाठ में ‘वाचा’ जोड़कर निहित अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
- issue: הָגְלוּ का वाच्य
  choice: निर्वासित कर दिया गया
  alternative: निर्वासन में चला गया
  rationale: होफल रूप दिखाता है कि यहूदा पर निर्वासन थोपा गया; निष्क्रिय अनुवाद न्याय और निर्वासन के संदर्भ को नरम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘और देखो’ मूल के ध्यानाकर्षक बल को सुरक्षित रखता है। पुस्तक के नाम को उद्धरण-चिह्नों में रखा गया है ताकि उसे राजकीय अभिलेख के शीर्षक के रूप में पहचाना जा सके।
