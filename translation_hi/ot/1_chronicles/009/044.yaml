base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/044.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan[b]. These were the sons of Azel.'
translation:
  language: hi
  text: 'आसेल के छह पुत्र थे। उनके नाम ये थे: अज़रीकाम, बोखेरू[a], यिश्माएल, शअर्याह, ओबद्याह और हानान। ये आसेल के पुत्र थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी रूप को एक व्यक्तिगत नाम, “बोखेरू,” समझा गया है। इसे “अज़रीकाम उसका पहलौठा” भी पढ़ा जा सकता है; उस समझ में पद में पाँच नाम सूचीबद्ध होते हैं, यद्यपि आरंभ में छह पुत्र कहे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְאָצֵל שִׁשָּׁה בָנִים
  choice: आसेल के छः पुत्र थे
  rationale: वंशावली में לְ के साथ प्रयुक्त यह सूत्र संबंध या संतान को दर्शाता है। हिंदी में यह स्वाभाविक रूप मूल अर्थ को स्पष्ट रखता है। בָנִים का लिंग-विशिष्ट अर्थ ‘पुत्र’ है।
- source_word: וְאֵלֶּה שְׁמוֹתָם
  choice: उनके नाम ये थे
  rationale: बहुवचन प्रत्यय पुत्रों की ओर संकेत करता है; हिंदी में यह वंशावली का स्वाभाविक परिचय है।
- source_word: עַזְרִיקָם
  choice: अज़रीकाम
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֹּכְרוּ
  choice: बोखरू
  rationale: WLC की स्वरांकन-परंपरा और छः पुत्रों की संख्या के अनुरूप इसे व्यक्तिगत नाम माना गया है। निकटवर्ती वैकल्पिक समझ ‘उसका पहलौठा’ पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: יִשְׁמָעֵאל
  choice: यिश्माएल
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: שְׁעַרְיָה
  choice: शअर्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जिसमें मध्य का कंठ्य व्यंजन यथासंभव सुरक्षित है।
- source_word: עֹבַדְיָה
  choice: ओबद्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और स्रोत-संगत देवनागरी रूप।
- source_word: חָנָן
  choice: हानान
  rationale: इब्रानी व्यक्तिगत नाम का सरल देवनागरी लिप्यंतरण।
- source_word: אֵלֶּה בְּנֵי אָצַל
  choice: ये आसेल के पुत्र थे
  rationale: समापन का वंशावली-सूत्र स्पष्टता के लिए आसेल का नाम दोहराता है और मूल संरचना को बनाए रखता है।
theological_decisions:
- issue: בֹּכְרוּ को व्यक्तिगत नाम मानना या ‘उसका पहलौठा’ समझना
  choice: मुख्य पाठ में ‘बोखरू’ व्यक्तिगत नाम
  alternative: ‘अज़रीकाम उसका पहलौठा’
  rationale: WLC का स्वरांकन इसे नाम के रूप में पढ़ने का समर्थन करता है और इस प्रकार बताए गए छः पुत्रों के साथ छः नाम मिलते हैं। फिर भी रूप की निकटता के कारण प्राचीन/अनुवादीय वैकल्पिक समझ को दबाया नहीं गया, बल्कि पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वंशावली की पुनरुक्त संरचना सुरक्षित है। नामों को स्रोत के निकट देवनागरी में लिखा गया है, और पाठ में छः पुत्रों की संख्या तथा בֹּכְרוּ की संभावित वैकल्पिक व्याख्या के बीच तनाव को पादटिप्पणी में स्पष्ट रखा गया है।
