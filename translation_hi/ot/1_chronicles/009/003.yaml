source:
  edition: WLC
  text: וּ/בִ/ירוּשָׁלִַ֨ם֙ יָשְׁב֔וּ מִן בְּנֵ֥י יְהוּדָ֖ה וּ/מִן בְּנֵ֣י בִנְיָמִ֑ן וּ/מִן בְּנֵ֥י אֶפְרַ֖יִם וּ/מְנַשֶּֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/009/003.yaml
  text: And in Jerusalem some from the sons of Judah, and some from the sons of Benjamin, and some from the sons of Ephraim and Manasseh, lived there.
translation:
  language: hi
  text: और यरूशलेम में यहूदा के वंशजों में से, बिन्यामीन के वंशजों में से, और एप्रैम तथा मनश्शे के वंशजों में से कुछ लोग रहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִירוּשָׁלִַם
  choice: और यरूशलेम में
  rationale: वाव को पूर्ववर्ती प्रसंग से जोड़ने के लिए ‘और’ तथा בְּ को स्थानवाचक ‘में’ से व्यक्त किया गया है।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: ישׁב यहाँ निवास करने के अर्थ में है; ‘रहते थे’ स्वाभाविक आधुनिक हिन्दी है और यरूशलेम का स्थान पहले ही स्पष्ट है।
- source_word: מִן
  choice: में से कुछ लोग
  rationale: बार-बार आया מִן इन वंश-समूहों में से कुछ सदस्यों को सूचित करता है। हिन्दी में कर्ता स्पष्ट और स्वाभाविक बनाने के लिए अंतिम खंड में ‘कुछ लोग’ रखा गया है, जिसका संबंध तीनों समूहों से है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: वंशावली और गोत्रीय संदर्भ में בני का अर्थ ‘वंशज’ है; यह हिन्दी में ‘पुत्रों’ से अधिक स्वाभाविक है और सामूहिक वंश-संबंध बनाए रखता है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों
  rationale: समानांतर गोत्रीय पदावली को ‘वंशजों’ से एकरूप रखा गया है।
- source_word: בְּנֵי אֶפְרַיִם וּמְנַשֶּׁה
  choice: एप्रैम तथा मनश्शे के वंशजों
  rationale: इब्रानी में ‘बने’ एप्रैम के पहले है और उसका अर्थ समन्वित ‘मनश्शे’ पर भी लागू होता है; हिन्दी में साझा ‘वंशजों’ अंत में रखकर यही संरचना स्वाभाविक रूप से व्यक्त होती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की आवृत्तिमूलक गोत्रीय संरचना को ‘के वंशजों में से’ द्वारा बनाए रखा गया है, जबकि ‘कुछ लोग’ को अंत में रखकर हिन्दी वाक्य को अनावश्यक रूप से बोझिल होने से बचाया गया है।
