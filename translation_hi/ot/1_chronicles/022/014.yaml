  text: וְ/הִנֵּ֨ה בְ/עָנְיִ֜/י הֲכִינ֣וֹתִי לְ/בֵית יְהוָ֗ה זָהָ֞ב כִּכָּרִ֤ים מֵֽאָה אֶ֨לֶף֙ וְ/כֶ֗סֶף אֶ֤לֶף אֲלָפִים֙ כִּכָּרִ֔ים וְ/לַ/נְּחֹ֤שֶׁת וְ/לַ/בַּרְזֶל֙ אֵ֣ין מִשְׁקָ֔ל כִּ֥י לָ/רֹ֖ב הָיָ֑ה וְ/עֵצִ֤ים וַ/אֲבָנִים֙ הֲכִינ֔וֹתִי וַ/עֲלֵי/הֶ֖ם תּוֹסִֽיף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/014.yaml
  text: Behold[a], in my affliction I have prepared for the house of Yahweh one hundred thousand talents of gold, and one million talents of silver; and for the bronze and the iron there is no weighing, for it was in abundance. I have prepared timber and stones[c][b], and you may add to them.
translation:
  language: hi
  text: देखो[a], मैंने अपने कष्ट में[b] याहवे के भवन के लिए एक लाख किक्कार सोना और दस लाख[c] किक्कार चाँदी जुटाकर रखी है। काँसे और लोहे की तौल का कोई लेखा नहीं है, क्योंकि वे बहुतायत में थे। मैंने लकड़ी और पत्थर भी तैयार किए हैं; और तुम उनमें और जोड़ सकते हो[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “देखो” ध्यान दिलाने वाला शब्द है; मूल पाठ में कालसूचक “अब” नहीं है।
    reason: discourse_marker
  - marker: b
    text: या, “अपनी गरीबी में।” इब्रानी शब्द कष्ट, कठिन परिस्थिति या गरीबी का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: एक किक्कार प्राचीन भार-माप था। इब्रानी में चाँदी की संख्या शाब्दिक रूप से “एक हज़ार हज़ार” है।
    reason: measurement_and_lexical_alternative
  - marker: d
    text: या, “और तुम उनमें और जोड़ो।” यह कथन अनुमति के साथ-साथ निर्देश भी व्यक्त कर सकता है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: וְהִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला संकेतक है। आधुनिक हिन्दी में “देखो” स्वाभाविक है और मूल में न पाए जाने वाले किसी कालसूचक “अब” को नहीं जोड़ता।
- source_word: בְעָנְיִי
  choice: अपने कष्ट के बीच
  rationale: עֳנִי कष्ट, विपत्ति, कठिन परिस्थिति या गरीबी का बोध करा सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और “अपनी गरीबी में” को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: הֲכִינוֹתִי
  choice: मैंने ... तैयार की है / किए हैं
  rationale: हिफ़ील रूप का अर्थ तैयार करना या जुटाकर रखना है। हिन्दी का पूर्ण वर्तमान कार्य की पूर्णता और उसकी वर्तमान प्रासंगिकता दोनों व्यक्त करता है।
- source_word: לְבֵית יְהוָה
  choice: याहवे के भवन के लिए
  rationale: בַּיִת का शाब्दिक अर्थ “भवन/घर” है और यहाँ मंदिर को सूचित करता है। “भवन” हिन्दी में गरिमापूर्ण और स्पष्ट है; יְהוָה को उसके व्यक्तिगत नाम “याहवे” से व्यक्त किया गया है।
- source_word: כִּכָּרִים
  choice: किक्कार
  rationale: यह प्राचीन भार-माप है। उसका नाम लिप्यंतरित करने से आधुनिक वजन का भ्रामक सटीक रूपांतरण नहीं होता; पहली occurrence पर पादटिप्पणी इसका अर्थ स्पष्ट करती है।
- source_word: אֶלֶף אֲלָפִים
  choice: दस लाख
  rationale: इब्रानी का शाब्दिक रूप “एक हज़ार हज़ार” है, जिसकी आधुनिक हिन्दी संख्या दस लाख है। शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: וְלַנְּחֹשֶׁת וְלַבַּרְזֶל אֵין מִשְׁקָל
  choice: काँसे और लोहे की तौल का कोई हिसाब नहीं है
  rationale: מִשְׁקָל तौल या वजन को दर्शाता है। वाक्य का आशय यह नहीं कि धातुएँ भारहीन थीं, बल्कि उनकी प्रचुरता के कारण उनकी तौल दर्ज या गिनी नहीं जा सकती थी।
- source_word: כִּי לָרֹב הָיָה
  choice: क्योंकि वे बहुत अधिक मात्रा में हैं
  rationale: यह पिछली बात का कारण देता है। हिन्दी में बहुवचन काँसे और लोहे की सामूहिक प्रचुरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְעֵצִים וַאֲבָנִים
  choice: लकड़ी और पत्थर भी
  rationale: निर्माण-संदर्भ में עֵצִים के लिए “लकड़ी” सहज है; वाक्य-संबंध के अनुसार “भी” तैयार की गई अन्य सामग्रियों से इन्हें जोड़ता है।
- source_word: וַעֲלֵיהֶם תּוֹסִיף
  choice: और तुम उनमें और जोड़ सकते हो
  rationale: द्वितीय पुरुष हिफ़ील अपूर्ण रूप को प्रसंग में अनुमति या अपेक्षा के रूप में समझा जा सकता है। मुख्य पाठ में अनुमतिसूचक अर्थ रखा गया और अधिक आदेशात्मक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। “याहवे” उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וַעֲלֵיהֶם תּוֹסִיף की शक्ति
  choice: तुम उनमें और जोड़ सकते हो
  alternative: तुम उनमें और जोड़ना
  rationale: इब्रानी अपूर्ण रूप यहाँ अनुमति, भविष्य की अपेक्षा या निर्देश के बीच कुछ तनाव रखता है। मुख्य पाठ अनुमति को व्यक्त करता है, जबकि निर्देशात्मक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दाऊद से सुलैमान के संबोधन में “तुम” अपनाया गया है, क्योंकि यह आज की मानक हिन्दी में निकटता और निर्देश दोनों व्यक्त करता है, जबकि “तू” कई पाठकों को अनावश्यक रूप से कठोर लग सकता है। प्राचीन भार-माप को “किक्कार” के रूप में सुरक्षित रखकर पादटिप्पणी में समझाया गया है।
