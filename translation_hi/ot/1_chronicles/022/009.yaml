  text: הִנֵּה בֵ֞ן נוֹלָ֣ד לָ֗/ךְ ה֤וּא יִהְיֶה֙ אִ֣ישׁ מְנוּחָ֔ה וַ/הֲנִח֥וֹתִי ל֛/וֹ מִ/כָּל אוֹיְבָ֖י/ו מִ/סָּבִ֑יב כִּ֤י שְׁלֹמֹה֙ יִהְיֶ֣ה שְׁמ֔/וֹ וְ/שָׁל֥וֹם וָ/שֶׁ֛קֶט אֶתֵּ֥ן עַל יִשְׂרָאֵ֖ל בְּ/יָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/009.yaml
  text: Behold[a], a son will be born to you. He will be a man of rest, and I will give him rest from all his enemies all around; for Solomon will be his name[b], and I will give peace and quiet to Israel in his days.
translation:
  language: hi
  text: देख, तेरे यहाँ एक पुत्र जन्म लेगा। वह विश्राम का पुरुष होगा, और मैं उसे उसके चारों ओर के सभी शत्रुओं से विश्राम दूँगा; क्योंकि उसका नाम सुलैमान होगा[a], और उसके दिनों में मैं इस्राएल को शांति और चैन दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘सुलैमान’ नाम का संबंध ‘शांति’ (शालोम) से सुनाई देता है; इसी पद में उसे विश्राम का पुरुष भी कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह संबोधित व्यक्ति का ध्यान आने वाली गंभीर घोषणा की ओर खींचता है और आधुनिक हिंदी में स्वाभाविक रहते हुए मूल का संकेतात्मक बल बनाए रखता है।
- source_word: נוֹלָד לָךְ
  choice: तेरे यहाँ ... जन्म लेगा
  rationale: संदर्भ में भावी जन्म का वादा है। यह हिंदी में स्वाभाविक ढंग से बताता है कि पुत्र दाऊद के यहाँ जन्म लेगा।
- source_word: אִישׁ מְנוּחָה
  choice: विश्राम पाने वाला पुरुष
  rationale: यह מְנוּחָה को ‘शांति’ में विलीन नहीं करता और अगले वाक्य में उसी धातु से आए ‘विश्राम दूँगा’ के साथ मूल की विषयगत पुनरावृत्ति बनाए रखता है।
- source_word: וַהֲנִחוֹתִי לוֹ
  choice: मैं उसे ... विश्राम दूँगा
  rationale: हिफ़िल क्रिया का कारणात्मक भाव—परमेश्वर द्वारा सुरक्षित विश्राम प्रदान करना—स्पष्ट करता है और पिछले पदबंध से शब्द-संबंध बनाए रखता है।
- source_word: מִכָּל אוֹיְבָיו מִסָּבִיב
  choice: चारों ओर के उसके सभी शत्रुओं से
  rationale: यह शत्रुओं की समग्रता और चारों दिशाओं से घिरे होने, दोनों भावों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׁלֹמֹה יִהְיֶה שְׁמוֹ
  choice: उसका नाम सुलैमान होगा
  rationale: हिंदी की स्वाभाविक शब्द-व्यवस्था अपनाते हुए नाम को स्पष्ट रखता है; मूल में नाम और ‘शांति’ का संबंध पादटिप्पणी में बताया गया है।
- source_word: שָׁלוֹם וָשֶׁקֶט
  choice: शांति और चैन
  rationale: दो अलग इब्रानी संज्ञाओं को अलग रखते हुए समृद्धि-सुरक्षा और शांत स्थिरता का संयुक्त भाव सरल आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: विश्राम, सुलैमान और शांति के बीच नामगत तथा विषयगत संबंध
  choice: מְנוּחָה को ‘विश्राम’, שָׁלוֹם को ‘शांति’ और नाम को ‘सुलैमान’ रखा गया है।
  alternative: אִישׁ מְנוּחָה का अनुवाद ‘शांतिप्रिय पुरुष’ या ‘शांति का पुरुष’ करना।
  rationale: वैकल्पिक अनुवाद अलग इब्रानी शब्दों को मिला देता या व्यक्ति के स्वभाव के बारे में ऐसा अर्थ जोड़ देता जो मूल में स्पष्ट नहीं है। चुना गया रूप परमेश्वर से मिलने वाले विश्राम और राज्यकाल की शांति के बीच तनाव तथा संबंध दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तेरे’ मूल के एकवचन निकट संबोधन को दर्शाता है। ‘पुरुष’ गंभीर घोषणात्मक शैली बनाए रखता है, जबकि ‘शांति और चैन’ सहज हिंदी में दो भिन्न इब्रानी शब्दों का भेद सुरक्षित रखता है।
