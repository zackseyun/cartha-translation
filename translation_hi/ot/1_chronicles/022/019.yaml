review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the two imperatives, the heart-and-soul pair, the divine name, the sanctuary/house distinction, the ark, and the holy objects. However, the Hebrew divine designation in the second command is "Yahweh God" (יְהוָה הָאֱלֹהִים), whereas "परमेश्वर यहोवा" reverses that order. The purpose clause is retained appropriately through a passive Hindi construction, since the Hebrew infinitive states the intended result without explicitly naming the human agent who brings the objects.
  naturalness: The Hindi is generally clear and suitably elevated. "यहोवा, अपने परमेश्वर" and "यहोवा परमेश्वर" are more natural and better reflect the source order. Spelling "संदूक" is standard modern Hindi orthography. The passive "लाए जाएँ" is idiomatic in the purpose clause.
  terminology: '"हृदय और प्राण," "वाचा," "पवित्र स्थान," and "पवित्र पात्र" are appropriate, non-sectarian biblical terminology. "पवित्र स्थान" is written as two words for modern readability while retaining the distinction from "भवन."'
  issues:
