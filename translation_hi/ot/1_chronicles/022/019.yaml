    issue: The designation "परमेश्वर यहोवा" reverses the Hebrew order in יְהוָה הָאֱלֹהִים.
    rationale: The source reads "Yahweh God." Rendering it as "यहोवा परमेश्वर" preserves both the source order and the conventional Hindi form of this compound designation.
  - severity: low
    issue: The first occurrence "अपने परमेश्वर यहोवा" is less natural than a rendering that foregrounds the name.
    rationale: '"यहोवा, अपने परमेश्वर" naturally renders "Yahweh your God" and keeps the personal divine name prominent, as in the Hebrew.'
