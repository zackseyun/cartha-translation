base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/019.yaml
  text: Now set your heart and your soul to seek Yahweh your God[a]. Rise up and build the sanctuary of Yahweh God[b], to bring the ark of the covenant of Yahweh and the holy vessels of God into the house that is to be built for the name of Yahweh.
translation:
  language: hi
  text: अब अपने हृदय और प्राण को यहोवा, अपने परमेश्वर, की खोज में लगा दो[a]। उठो और यहोवा परमेश्वर का पवित्र स्थान बनाओ, ताकि यहोवा की वाचा का संदूक और परमेश्वर के पवित्र पात्र उस भवन में लाए जाएँ, जो यहोवा के नाम के लिए बनाया जाना है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'और अधिक शाब्दिक रूप से: “अपने हृदय और अपने प्राण को अपने परमेश्वर यहोवा की खोज करने के लिए दे दो।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भवन” से आशय उस मंदिर की इमारत से है, जो यहोवा के नाम के लिए बनाई जानी थी।
    reason: cultural_note
lexical_decisions:
- source_word: תְּנוּ לְבַבְכֶם וְנַפְשְׁכֶם
  choice: अपने हृदय और प्राण को ... खोज में लगा दो
  rationale: शाब्दिक अर्थ ‘अपना हृदय और अपना प्राण दो’ है। हिंदी में ‘खोज में लगा दो’ संकल्प और पूर्ण समर्पण को स्वाभाविक ढंग से व्यक्त करता है, जबकि दोनों इब्रानी पदों को अलग बनाए रखता है।
- source_word: לִדְרוֹשׁ
  choice: खोज
  rationale: इस संदर्भ में परमेश्वर को निष्ठा और निर्भरता के साथ खोजने का भाव है; ‘खोज करना’ इसे स्पष्ट और संप्रदाय-निरपेक्ष रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक वाचा-नाम को सामान्य हिंदी बाइबलीय लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: מִקְדַּשׁ
  choice: पवित्रस्थान
  rationale: यह शब्द पवित्र उपासना-स्थान को सूचित करता है। ‘पवित्रस्थान’ अगले वाक्यांश के ‘भवन’ से इसका शब्दगत भेद भी बनाए रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का सन्दूक
  rationale: इब्रानी संबंध-श्रृंखला को स्पष्ट और स्वाभाविक हिंदी में सुरक्षित रखा गया है।
- source_word: כְלֵי קֹדֶשׁ הָאֱלֹהִים
  choice: परमेश्वर के पवित्र पात्र
  rationale: כְלֵי का अर्थ व्यापक रूप से पात्र, उपकरण या साज-सामान हो सकता है; मंदिर-संदर्भ में प्रचलित ‘पवित्र पात्र’ उपयुक्त है, जबकि इसकी व्यापकता पर पादटिप्पणी आवश्यक नहीं लगी।
- source_word: לַבַּיִת הַנִּבְנֶה לְשֵׁם יְהוָה
  choice: उस भवन में ... जो यहोवा के नाम के लिए बनाया जाना है
  rationale: ‘भवन’ मंदिर-इमारत को दर्शाता है और ‘नाम के लिए’ इब्रानी धार्मिक अभिव्यक्ति को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक ईश्वरीय नाम है। हिंदी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; इसे केवल ‘प्रभु’ करने से मूल का नाम उपाधि में बदल जाता।
- issue: ‘हृदय और प्राण’ की मानवशास्त्रीय जोड़ी
  choice: दोनों शब्द स्पष्ट रूप से सुरक्षित रखे गए
  alternative: अपने सम्पूर्ण अस्तित्व को
  rationale: मूल की द्विपदी अभिव्यक्ति समग्र निष्ठा पर बल देती है, पर कोई व्यवस्थित द्विभागी मानवशास्त्र परिभाषित नहीं करती। दोनों शब्द रखना इस तनाव और अलंकारिक बल को बचाता है।
- issue: ‘यहोवा परमेश्वर’ में संबंध
  choice: परमेश्वर यहोवा
  alternative: यहोवा परमेश्वर / यहोवा, जो परमेश्वर है
  rationale: מִקְדַּשׁ יְהוָה הָאֱלֹהִים में पदबंध कुछ सघन है। ‘परमेश्वर यहोवा का पवित्रस्थान’ हिंदी में स्वाभाविक स्वामित्व-संबंध देता है और किसी अतिरिक्त व्याख्यात्मक विराम को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय किंतु सहज शैली रखी गई है। बहुवचन समुदाय को संबोधित आज्ञाओं के लिए ‘लगा दो’ और ‘उठो’ प्रयुक्त हैं। ‘सन्दूक’, ‘वाचा’, ‘पवित्रस्थान’ और ‘पात्र’ बाइबलीय संदर्भ में परिचित शब्द हैं; वाक्य-विन्यास को मूल के आदेश और उद्देश्य-क्रम के निकट रखा गया है।
