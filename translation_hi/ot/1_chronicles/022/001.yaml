id: 1CH.22.1
reference: 1 Chronicles 22:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔יד זֶ֣ה ה֔וּא בֵּ֖ית יְהוָ֣ה הָ/אֱלֹהִ֑ים וְ/זֶה מִּזְבֵּ֥חַ לְ/עֹלָ֖ה לְ/יִשְׂרָאֵֽל־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/001.yaml
  text: Then David said[a], “This is the house of Yahweh God[b], and this is the altar for burnt offering for Israel.”
translation:
  language: hi
  text: तब दाऊद ने कहा, “यही याहवे परमेश्वर का भवन है, और यही इस्राएल के लिए होमबलि की वेदी है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דָּוִיד
  choice: दाऊद
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सहज नाम-रूप।
- source_word: זֶה הוּא
  choice: यही ... है
  rationale: संकेतवाचक और सर्वनाम का मेल emphatic identification देता है; ‘यही’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בֵּית
  choice: भवन
  rationale: इब्रानी का मूल अर्थ ‘घर/भवन’ है। प्रसंग में पवित्र भवन अभिप्रेत है; ‘भवन’ स्रोत की उपमा को बनाए रखते हुए ‘मन्दिर’ की अपेक्षा कम व्याख्यात्मक और अधिक गरिमापूर्ण है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: दिव्य नाम के साथ समानाधिकरण में आया है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और प्रतिष्ठित रूप है।
- source_word: מִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान चढ़ाने की संरचना के लिए मानक हिन्दी धार्मिक शब्द।
- source_word: לְעֹלָה
  choice: होमबलि की
  rationale: עֹלָה उस बलि को दर्शाता है जो वेदी पर पूरी तरह जलाई जाती थी। एकवचन यहाँ सामान्य/जातिवाचक है; हिन्दी में ‘होमबलि की वेदी’ यही सामान्य अर्थ सहज रूप से देता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: सम्बन्ध अथवा प्रयोजन बताने वाले לְ को संक्षिप्त और प्रत्यक्ष ढंग से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: בֵּית को भवन या मन्दिर कहना
  choice: भवन
  alternative: मन्दिर
  rationale: यद्यपि प्रसंग भावी मन्दिर-स्थल का है, इब्रानी में सामान्य शब्द ‘घर/भवन’ है। ‘भवन’ स्रोत की शब्द-छवि को बनाए रखता और भावी निर्माण के प्रसंग में स्वाभाविक रहता है।
- issue: עֹלָה के एकवचन का अर्थ
  choice: सामान्य/जातिवाचक एकवचन—‘होमबलि की वेदी’
  alternative: बहुवचन—‘होमबलियों की वेदी’
  rationale: इब्रानी एकवचन किसी बलि-प्रकार को सामान्य रूप से सूचित कर सकता है। हिन्दी एकवचन भी उस सामूहिक/सामान्य अर्थ को बिना अनावश्यक संख्या-निर्धारण के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। ‘यही’ मूल के संकेतात्मक बल को प्रकट करता है; ‘भवन’ मूल की ‘घर’ वाली छवि और पवित्र स्थापत्य—दोनों के अनुकूल है।
