language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָ֣ז תַּצְלִ֔יחַ אִם תִּשְׁמ֗וֹר לַ/עֲשׂוֹת֙ אֶת הַֽ/חֻקִּ֣ים וְ/אֶת הַ/מִּשְׁפָּטִ֔ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה עַל יִשְׂרָאֵ֑ל חֲזַ֣ק וֶ/אֱמָ֔ץ אַל תִּירָ֖א וְ/אַל תֵּחָֽת־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/013.yaml
  text: Then you will prosper[a], if you are careful to do the statutes and the judgments that Yahweh commanded Moses for Israel. Be strong and courageous. Do not fear[b], and do not be dismayed.
translation:
  language: hi
  text: तब तुम सफल होगे[a], यदि तुम उन विधियों और न्याय-विधानों[b] का पालन करने में सावधानी रखोगे, जिनका पालन करने की आज्ञा याहवे ने मूसा को इस्राएल के लिए दी थी। दृढ़ और साहसी बनो। मत डरो और निराश न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी उन्नति होगी।” इब्रानी क्रिया सफलता पाने या उन्नति करने, दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “नियमों और न्याय-संबंधी आदेशों।” यहाँ दो अलग-अलग इब्रानी कानूनी शब्द आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह पिछले संदर्भ से निकलने वाले परिणाम को स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: תַּצְלִיחַ
  choice: तुम सफल होगे
  rationale: हिफ़ील रूप सफलता या उन्नति, दोनों का भाव दे सकता है। हिंदी में ‘सफल होगे’ व्यापक और स्वाभाविक है तथा इसे केवल आर्थिक समृद्धि तक सीमित नहीं करता।
- source_word: אִם תִּשְׁמוֹר לַעֲשׂוֹת
  choice: यदि तुम ... का पालन करने में सावधानी रखोगे
  rationale: ‘रखना/चौकसी करना’ और ‘करना’ के संयुक्त इब्रानी मुहावरे में सतर्कता तथा आज्ञापालन दोनों निहित हैं।
- source_word: הַחֻקִּים
  choice: विधियाँ
  rationale: तोरा के कानूनी संदर्भ में यह निर्धारित विधियों का बोध कराता है और अगले कानूनी पद से अलग रखा गया है।
- source_word: הַמִּשְׁפָּטִים
  choice: न्याय-विधान
  rationale: यह कानूनी और न्यायिक अर्थ को बनाए रखता है तथा חֻקִּים से भेद स्पष्ट करता है।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה עַל יִשְׂרָאֵל
  choice: जिनके विषय में याहवे ने मूसा को इस्राएल के लिए आज्ञा दी थी
  rationale: मूसा को आज्ञा पाने वाला और इस्राएल को इन आज्ञाओं का अभिप्रेत समुदाय बनाए रखता है; עַל की संदर्भगत व्यापकता को सहज हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को पदवी से बदलने के बजाय देवनागरी लिप्यंतरण में सुरक्षित रखता है।
- source_word: חֲזַק וֶאֱמָץ
  choice: दृढ़ और साहसी बनो
  rationale: स्थिर सामर्थ्य और हिम्मत का संयुक्त आह्वान आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त होता है।
- source_word: אַל תִּירָא
  choice: मत डरो
  rationale: इब्रानी निषेध का सीधा, संक्षिप्त और स्वाभाविक हिंदी रूप।
- source_word: וְאַל תֵּחָת
  choice: और निराश न हो
  rationale: חתת के टूट जाने, हतोत्साहित या भय से व्याकुल होने के भाव को प्रसंगानुकूल हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में विशिष्ट चतुरक्षरी वाचा-नाम है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे सामान्य पदवी में नहीं बदलता।
- issue: सफलता और आज्ञापालन का संबंध
  choice: शर्तसूचक ‘यदि...तो’ संरचना बनाए रखी गई
  alternative: आज्ञापालन को सफलता की बिना शर्त गारंटी के रूप में प्रस्तुत करना
  rationale: मूल אִם स्पष्ट शर्त व्यक्त करता है। अनुवाद उसी कथन को रखता है, पर ‘सफलता’ का अर्थ आर्थिक समृद्धि तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। एकवचन संबोधन को हिंदी के स्वाभाविक ‘तुम’ से व्यक्त किया गया है। कानूनी शब्दों का अंतर बनाए रखने के लिए ‘विधियाँ’ और ‘न्याय-विधान’ अलग-अलग रखे गए हैं।
