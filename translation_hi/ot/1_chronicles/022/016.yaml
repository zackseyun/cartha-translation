  text: לַ/זָּהָ֥ב לַ/כֶּ֛סֶף וְ/לַ/נְּחֹ֥שֶׁת וְ/לַ/בַּרְזֶ֖ל אֵ֣ין מִסְפָּ֑ר ק֣וּם וַ/עֲשֵׂ֔ה וִ/יהִ֥י יְהוָ֖ה עִמָּֽ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/016.yaml
  text: For the gold[a], the silver, the bronze, and the iron, there is no number. Rise up and work[c][b], and may Yahweh be with you.
translation:
  language: hi
  text: सोना, चाँदी, काँसा और लोहा बेहिसाब हैं। उठो और काम करो, और यहोवा तुम्हारे साथ रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַזָּהָב לַכֶּסֶף וְלַנְּחֹשֶׁת וְלַבַּרְזֶל
  choice: सोना, चाँदी, काँसा और लोहा
  rationale: प्रत्येक संज्ञा से जुड़ा ל यहाँ सामग्री के विषय में सूची को आगे बढ़ाता है। हिन्दी में बिना अतिरिक्त संबंधबोधक पद के यह सूची स्वाभाविक है और पिछले प्रसंग से सहजता से जुड़ती है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: प्राचीन निर्माण-सामग्री की सूची में यह शब्द सामान्यतः काँसे को सूचित करता है; कुछ संदर्भों में ताँबा भी संभव है।
- source_word: אֵין מִסְפָּר
  choice: बेहिसाब हैं
  rationale: यह मुहावरा इतनी अधिक मात्रा बताता है कि उसकी गिनती नहीं की जा सकती। 'बेहिसाब हैं' आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: קוּם
  choice: उठो
  rationale: आज्ञार्थक रूप कार्य आरम्भ करने का उत्साहपूर्ण आह्वान है।
- source_word: וַעֲשֵׂה
  choice: और काम करो
  rationale: मन्दिर-निर्माण के प्रसंग में עשה का आशय सक्रिय होकर काम करने से है।
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: और यहोवा तुम्हारे साथ रहे
  rationale: यह रूप साधारण भविष्यवाणी से अधिक इच्छा या आशीर्वाद व्यक्त करता है; हिन्दी विध्यर्थक 'रहे' उस भाव को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला 'यहोवा' नाम को उपाधि 'प्रभु' से बदलने के बजाय उसका नामगत स्वरूप बनाए रखता है।
- issue: וִיהִי का भाव
  choice: तुम्हारे साथ रहे
  alternative: तुम्हारे साथ होगा
  rationale: हिब्रू रूप यहाँ इच्छा अथवा आशीर्वचन के रूप में समझा जा सकता है। निश्चित भविष्यवाणी चुनने के बजाय हिन्दी विध्यर्थक मूल की भावगत खुलावट बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'बेहिसाब' मुहावरे की संक्षिप्त शक्ति बनाए रखता है; 'उठो और काम करो' सीधे exhortation का स्वर देता है।
