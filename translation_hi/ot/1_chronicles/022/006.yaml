base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/006.yaml
  text: Then he called for Solomon his son and commanded him to build a house for Yahweh[a], the God of Israel.
translation:
  language: hi
  text: तब उसने अपने पुत्र सुलैमान को बुलाया और उसे इस्राएल के परमेश्वर याहवे के लिए एक भवन[a] बनाने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के लिए एक मंदिर।” इब्रानी में शाब्दिक रूप से “याहवे के लिए एक घर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא לִשְׁלֹמֹה בְנוֹ
  choice: तब उसने अपने पुत्र सुलैमान को बुलाया
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक क्रम व्यक्त करता है। קרא ל किसी व्यक्ति को बुलाने के अर्थ में है; ‘अपने पुत्र’ हिन्दी में संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְצַוֵּהוּ לִבְנוֹת
  choice: और उसे ... बनाने की आज्ञा दी
  rationale: צוה का अधिकारपूर्ण भाव ‘आज्ञा दी’ से सुरक्षित रहता है, और इसके बाद का infinitive construct आज्ञा की विषय-वस्तु, ‘बनाने’, को व्यक्त करता है।
- source_word: בַּיִת
  choice: एक भवन
  rationale: בית का मूल अर्थ ‘घर/भवन’ है। यहाँ संदर्भ मन्दिर का है, पर ‘भवन’ मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में गरिमापूर्ण और बोधगम्य है; ‘मन्दिर’ को पादटिप्पणी में व्याख्यात्मक विकल्प के रूप में रखा गया है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण अथवा उद्देश्य बताता है, इसलिए ‘के लिए’ स्वाभाविक है। יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाचक रचना का सीधा और प्रचलित हिन्दी रूप, जो याहवे की पहचान इस्राएल के परमेश्वर के रूप में करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे उपस्थित है। ‘याहवे’ उस नाम को उपाधि में बदले बिना प्रस्तुत करता है; ‘यहोवा’ पारम्परिक रूप है और ‘प्रभु’ नाम के स्थान पर पढ़ी जाने वाली उपाधि।
- issue: בית का उपासना-स्थल संबंधी अर्थ
  choice: भवन
  alternative: मन्दिर
  rationale: मूल में सामान्य संज्ञा ‘घर/भवन’ है, यद्यपि संदर्भ से भाव मन्दिर का है। मुख्य पाठ में मूल शब्द-चित्र रखा गया है और स्पष्ट संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘आज्ञा दी’ आदेश की अधिकारपूर्ण शक्ति बनाए रखता है और ‘भवन’ मूल के ‘घर’ तथा संदर्भगत ‘मन्दिर’ के बीच उपयुक्त संतुलन देता है।
