  text: וְ/עִמְּ/ךָ֤ לָ/רֹב֙ עֹשֵׂ֣י מְלָאכָ֔ה חֹצְבִ֕ים וְ/חָרָשֵׁ֥י אֶ֖בֶן וָ/עֵ֑ץ וְ/כָל חָכָ֖ם בְּ/כָל מְלָאכָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/015.yaml
  text: 'And with you in abundance are workers for the task: stonecutters[a], and craftsmen of stone and wood, and every skilled man for every kind of work.'
translation:
  language: hi
  text: और तुम्हारे पास बहुत-से काम करनेवाले हैं—पत्थर काटनेवाले, पत्थर और लकड़ी के कारीगर, और हर प्रकार के काम में कुशल कारीगर[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से पुल्लिंग एकवचन, “हर कुशल पुरुष” है; यहाँ यह कुशल कामगारों का प्रतिनिधिक उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמְּךָ
  choice: और तुम्हारे पास
  rationale: यह संबोधन और संयोजक ‘और’ दोनों को बनाए रखता है; आधुनिक मानक हिन्दी में ‘तुम्हारे पास’ स्वाभाविक है।
- source_word: לָרֹב
  choice: बहुत-से
  rationale: यह उपलब्ध कामगारों की बड़ी संख्या को सहज और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: עֹשֵׂי מְלָאכָה
  choice: काम करनेवाले
  rationale: सहभागी रूप का सीधा और स्वाभाविक अनुवाद है, जो निर्माण-कार्य में लगे लोगों को दर्शाता है।
- source_word: חֹצְבִים
  choice: पत्थर काटनेवाले
  rationale: निर्माण के संदर्भ में क्रिया का निहित कर्म पत्थर है; इसे स्पष्ट करने से हिन्दी पाठक के लिए अर्थ सहज होता है।
- source_word: וְחָרָשֵׁי אֶבֶן וָעֵץ
  choice: पत्थर और लकड़ी के कारीगर
  rationale: ‘कारीगर’ व्यावहारिक शिल्प-कौशल का भाव रखता है और पत्थर तथा लकड़ी दोनों से संबंध स्पष्ट करता है।
- source_word: וְכָל חָכָם בְּכָל מְלָאכָה
  choice: और हर प्रकार के काम में कुशल कारीगर
  rationale: यहाँ חָכָם बौद्धिक बुद्धिमत्ता नहीं, व्यावहारिक दक्षता बताता है; हिन्दी में ‘कारीगर’ प्रतिनिधिक एकवचन और व्यावसायिक संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: חָכָם का व्यावहारिक कौशल और व्याकरणिक पुल्लिंग एकवचन
  choice: हर प्रकार के काम में कुशल कारीगर
  alternative: हर प्रकार के काम में कुशल पुरुष
  rationale: संदर्भ कार्य-कौशल का है। ‘कारीगर’ हिन्दी में स्वाभाविक पुल्लिंग एकवचन प्रतिनिधिक संज्ञा है और अनावश्यक रूप से केवल पुरुष-लिंग पर बल दिए बिना मूल व्याकरणिक रूप को पर्याप्त रूप से दर्शाती है; वैकल्पिक शाब्दिकता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। ‘तुम्हारे’ से मूल के एकवचन प्रत्यक्ष संबोधन को सहज ढंग से रखा गया है; सूची की संरचना डैश और अल्पविरामों द्वारा स्पष्ट की गई है।
