  yaml_path: translation/ot/1_chronicles/022/003.yaml
  text: And David prepared iron in abundance for the nails for the doors of the gates and for the fastenings[b][a], and bronze in abundance without weight.
translation:
  language: hi
  text: और दाऊद ने फाटकों के किवाड़ों की कीलों और जोड़ने वाले पुर्ज़ों[a] के लिए बहुतायत से लोहा तैयार किया, और इतना अधिक कांसा कि उसे तौला नहीं जा सकता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कब्ज़ों”; इब्रानी शब्द अधिक व्यापक है और सामान्यतः जोड़ने या मिलाने वाले पुर्ज़ों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “जिसका कोई तौल नहीं था।”'
    reason: literal_rendering
lexical_decisions:
- source_word: בַרְזֶל
  choice: लोहा
  rationale: निर्माण-सामग्री की इस सूची में यह शब्द सीधे लोहे को दर्शाता है।
- source_word: לָרֹב
  choice: बहुतायत से / इतना अधिक
  rationale: यह बड़ी मात्रा का बोध कराता है; वाक्य के दोनों स्थानों पर स्वाभाविक हिन्दी के अनुसार अलग अभिव्यक्ति रखी गई है।
- source_word: מִּסְמְרִים
  choice: कीलें
  rationale: फाटकों के किवाड़ों के निर्माण-संदर्भ में यह व्यापक और स्वाभाविक हिन्दी समतुल्य है।
- source_word: דַלְתוֹת הַשְּׁעָרִים
  choice: फाटकों के किवाड़
  rationale: यह संबंधवाचक इब्रानी पदबंध को स्पष्ट रूप से व्यक्त करता है और द्वार-पटों का अर्थ देता है।
- source_word: מְחַבְּרוֹת
  choice: जोड़ने वाले पुर्ज़े
  rationale: मूल शब्द जोड़ने या मिलाने वाली वस्तुओं के लिए व्यापक है; यह अनुवाद उसे केवल कब्ज़ों तक सीमित नहीं करता।
- source_word: הֵכִין
  choice: तैयार किया
  rationale: यह सामग्री जुटाकर निर्माण के लिए तैयार रखने के अर्थ को निकटता से व्यक्त करता है।
- source_word: נְחֹשֶׁת
  choice: कांसा
  rationale: प्राचीन निर्माण-सामग्री की सूचियों में यह तांबे अथवा तांबा-मिश्रित धातु के लिए प्रयुक्त होता है; संदर्भ में 'कांसा' मानक और स्वाभाविक चयन है।
- source_word: אֵין מִשְׁקָל
  choice: इतना अधिक कि उसे तौला नहीं जा सकता था
  rationale: शाब्दिक 'कोई तौल नहीं' का आशय मात्रा का तौल से परे होना है; हिन्दी में यह अतिशयोक्तिपूर्ण भाव स्पष्ट और स्वाभाविक ढंग से आता है।
