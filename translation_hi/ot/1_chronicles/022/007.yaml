base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/007.yaml
  text: And David said to Solomon his son[a], “As for me[b], it was in my heart to build a house for the name of Yahweh my God.”
translation:
  language: hi
  text: तब दाऊद ने अपने पुत्र सुलैमान से कहा, “जहाँ तक मेरी बात है, मेरे मन में यह था[a] कि मैं अपने परमेश्वर याहवे के नाम के लिए एक घर[b] बनाऊँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने मन में ठान रखा था।” इब्रानी मुहावरा दाऊद की भीतरी इच्छा या संकल्प व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मन्दिर।” शाब्दिक रूप से, “घर”; यहाँ यह याहवे के नाम के लिए बनाए जाने वाले भवन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस कथात्मक प्रगति को सहज रूप से व्यक्त करता है।
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: अपने पुत्र सुलैमान से
  rationale: यह स्वाभाविक हिन्दी शब्दक्रम है और सुलैमान के दाऊद का पुत्र होने का संबंध स्पष्ट रखता है।
- source_word: אֲנִי
  choice: जहाँ तक मेरी बात है
  rationale: इब्रानी में व्यक्त सर्वनाम पर हल्का बल है; यह अभिव्यक्ति उस बल को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: הָיָה עִם לְבָבִי
  choice: मेरे मन में यह था
  rationale: यह इब्रानी मुहावरा दाऊद की भीतरी इच्छा या संकल्प व्यक्त करता है; अनुवाद हृदय/मन की मूल छवि को बनाए रखते हुए हिन्दी में सहज है।
- source_word: לִבְנוֹת בַּיִת
  choice: एक भवन बनाऊँ
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है। यहाँ सन्दर्भ मन्दिर का है, फिर भी ‘भवन’ मूल रूपक को बनाए रखता है और हिन्दी में परमेश्वर के नाम के लिए बनाए जाने वाले पवित्र भवन के रूप में समझा जा सकता है।
- source_word: לְשֵׁם
  choice: नाम के लिए
  rationale: यह समर्पण और याहवे की प्रकट उपस्थिति से जुड़ी धर्मवैचारिक भाषा को सुरक्षित रखता है; इसे केवल ‘के लिए’ कहकर सपाट नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है, उसके स्थान पर कोई उपाधि नहीं रखी गई।
- source_word: אֱלֹהָי
  choice: अपने परमेश्वर
  rationale: प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को प्रत्यक्ष कथन के हिन्दी परिप्रेक्ष्य में ‘अपने परमेश्वर’ से स्वाभाविक और स्पष्ट रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उस वाचा-नाम को उपाधि से बदले बिना प्रस्तुत करता है।
- issue: בַּיִת को ‘भवन’ या ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: इब्रानी में सामान्य शब्द ‘घर’ है, यद्यपि यहाँ उसका आशय मन्दिर है। ‘भवन’ मूल शब्दावली को बनाए रखता है; स्पष्ट अर्थ फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रूप अपनाया गया है। ‘जहाँ तक मेरी बात है’ मूल के बलाघात को, और ‘मेरे मन में’ उसके भीतरी संकल्प की छवि को सुरक्षित रखता है।
