base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/004.yaml
  text: and cedar timbers without number[a], for the Sidonians and Tyrians had brought cedar timbers in abundance to David.
translation:
  language: hi
  text: और देवदार की लकड़ी इतनी थी कि उसकी गिनती नहीं हो सकती थी[a], क्योंकि सीदोन और सोर के लोग दाऊद के लिए बहुतायत में देवदार की लकड़ी लाए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “देवदार की शहतीरें।” इब्रानी शब्द देवदार की सामग्री के लिए व्यापक रूप से प्रयुक्त हो सकता है, यद्यपि भवन-निर्माण के इस संदर्भ में आशय निर्माण की लकड़ी या शहतीरों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַ/עֲצֵי אֲרָזִים
  choice: और देवदार की लकड़ी
  rationale: עֲצֵי אֲרָזִים निर्माण-सामग्री के संदर्भ में देवदार की लकड़ी को दर्शाता है। हिंदी में ‘लकड़ी’ स्वाभाविक है और खड़े पेड़ों का भ्रामक अर्थ नहीं देता।
- source_word: לְ/אֵין מִסְפָּר
  choice: इतनी थी कि उसकी गिनती नहीं हो सकती थी
  rationale: यह इब्रानी मुहावरा असंख्य मात्रा व्यक्त करता है; यह हिंदी रूप उसका अर्थ स्पष्ट और सहज ढंग से देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पहले कथन का कारण प्रस्तुत करता है।
- source_word: הֵבִיאוּ
  choice: लाए थे
  rationale: हिफ़ील पूर्ण क्रिया का अर्थ ‘वे लाए’ है; ‘लाए थे’ इस आपूर्ति को वर्णित स्थिति से पहले की कारणात्मक घटना के रूप में रखता है।
- source_word: הַ/צִּידֹנִים וְ/הַ/צֹּרִים
  choice: सीदोन और सोर के लोग
  rationale: नगर-निवासी सूचक बहुवचन शब्दों का यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक रूप है।
- source_word: לָ/רֹב
  choice: बहुतायत में
  rationale: यह पद बड़ी मात्रा व्यक्त करता है; ‘बहुतायत में’ गरिमापूर्ण और सटीक है।
- source_word: לְ/דָוִד
  choice: दाऊद के लिए
  rationale: לְ प्राप्तकर्ता अथवा लाभार्थी को सूचित कर सकता है। प्रसंग में सामग्री दाऊद के निर्माण-प्रबंध के लिए लाई गई थी; ‘के लिए’ स्वाभाविक हिंदी है, जबकि ‘के पास’ भी संभव है।
