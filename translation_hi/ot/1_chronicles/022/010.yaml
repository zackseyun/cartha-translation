base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/010.yaml
  text: He will build a house for my name[a], and he will be a son to me, and I will be a father to him, and I will establish the throne of his kingdom over Israel forever.
translation:
  language: hi
  text: वही मेरे नाम के लिए एक भवन[a] बनाएगा। वह मेरा पुत्र होगा और मैं उसका पिता होऊँगा। मैं इस्राएल पर उसके राज्य का सिंहासन सदा के लिए स्थापित करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे नाम के लिए एक मंदिर।’ इब्रानी में शाब्दिक रूप से ‘मेरे नाम के लिए एक घर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיִת
  choice: भवन
  rationale: मूल अर्थ ‘घर/भवन’ है और संदर्भ में यह मंदिर को दर्शाता है। ‘भवन’ हिन्दी में गरिमापूर्ण और स्वाभाविक है तथा मुख्य पाठ में ‘मंदिर’ कहकर अर्थ को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: לִשְׁמִי
  choice: मेरे नाम के लिए
  rationale: यह इब्रानी अभिव्यक्ति को सीधे सुरक्षित रखता है और परमेश्वर के नाम को समर्पित भवन का भाव व्यक्त करता है।
- source_word: לְבֵן
  choice: मेरा पुत्र
  rationale: सम्बन्धसूचक वाचा-वाक्य को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है; इसे ‘पुत्र के समान’ कहकर दुर्बल नहीं किया गया।
- source_word: לְאָב
  choice: उसका पिता
  rationale: पुत्र-पिता के समानांतर सम्बन्धसूचक कथन को स्पष्ट तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַהֲכִינוֹתִי
  choice: मैं ... स्थापित करूँगा
  rationale: हिफ़ील रूप का भाव दृढ़ करने या स्थायी रूप से कायम करने का है; ‘स्थापित करूँगा’ राजवंशीय प्रतिज्ञा के संदर्भ में उपयुक्त है।
- source_word: כִּסֵּא מַלְכוּתוֹ
  choice: उसके राज्य का सिंहासन
  rationale: यह ‘सिंहासन’ और ‘राज्य’ दोनों राजकीय आयामों को मूल के अनुरूप सुरक्षित रखता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: राजकीय शासन के साथ עַל प्रभुत्व अथवा शासन का अर्थ देता है, जिसे ‘पर’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी निरंतरता की प्रतिज्ञा को आधुनिक और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: सुलैमान पर लागू पिता-पुत्र वाचा-सूत्र और दाऊदी मसीही प्रतिज्ञा में उसका व्यापक महत्व
  choice: ‘वह मेरा पुत्र होगा और मैं उसका पिता होऊँगा’ सम्बन्धसूचक भाषा को सीधे बनाए रखा गया।
  alternative: ‘मैं उसे पुत्र के समान मानूँगा’ जैसी व्याख्यात्मक अभिव्यक्ति।
  rationale: इब्रानी पाठ सम्बन्ध को प्रत्यक्ष रूप से कहता है। सीधा अनुवाद सुलैमान के तात्कालिक संदर्भ और व्यापक धर्मवैज्ञानिक तनाव दोनों को सुरक्षित रखता है, बिना बाद के निष्कर्षों को पाठ में जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य रूप। ‘भवन’ से संदर्भगत मंदिर का संकेत मिलता है, जबकि पादटिप्पणी शाब्दिक ‘घर’ और स्पष्ट ‘मंदिर’—दोनों को दर्ज करती है।
