base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/011.yaml
  text: Now[a], my son, may Yahweh be with you, and may you prosper and build the house of Yahweh your God[c][b], as he has spoken concerning you.
translation:
  language: hi
  text: अब, मेरे बेटे, याहवे तुम्हारे साथ रहे, और तुम सफल हो[a] और अपने परमेश्वर याहवे का भवन[b] बनाओ, जैसा उसने तुम्हारे विषय में कहा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम समृद्ध हो”; इब्रानी क्रिया का अर्थ “सफल होना” या “समृद्ध होना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने परमेश्वर याहवे का मन्दिर।” शाब्दिक रूप से, “अपने परमेश्वर याहवे का भवन।”
    reason: lexical_alternative
  - marker: c
    text: या, “जैसा उसने तुम्हारे बारे में प्रतिज्ञा की है।” इब्रानी में अधिक शाब्दिक रूप से, “जैसा उसने तुम्हारे विषय में कहा है।”
    reason: alternative_reading
lexical_decisions:
- source_word: עַתָּה
  choice: अब
  rationale: यह समयसूचक संवाद-चिह्न दाऊद की आशीष और प्रोत्साहन का आरम्भ करता है; ‘अब’ इसका सहज और सीधा हिन्दी रूप है।
- source_word: בְנִי
  choice: मेरे बेटे
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित प्रत्यक्ष सम्बोधन है; यह दाऊद के पितृस्नेह को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהִי יְהוָה עִמָּךְ
  choice: याहवे तुम्हारे साथ रहे
  rationale: יְהִי का आज्ञार्थक-इच्छासूचक बल यहाँ भविष्यवाणी से अधिक आशीष या कामना व्यक्त करता है।
- source_word: וְהִצְלַחְתָּ
  choice: और तुम्हें सफलता मिले
  rationale: הצלח का अर्थ ‘सफल होना’ या ‘समृद्ध होना’ हो सकता है। प्रसंग मन्दिर-निर्माण के कार्य की सफलता का है; यह रूप केवल आर्थिक समृद्धि का संकेत दिए बिना आशीष की धारा बनाए रखता है।
- source_word: וּבָנִיתָ
  choice: और तुम ... बनाओ
  rationale: संयोजक सहित पूर्ण क्रिया आरम्भिक इच्छासूचक वाक्य के प्रभाव में अपेक्षित कार्य को व्यक्त करती है। हिन्दी में ‘बनाओ’ आशीष से जुड़ा प्रोत्साहन और दायित्व दोनों स्वाभाविक रूप से रखता है।
- source_word: בֵּית יְהוָה אֱלֹהֶיךָ
  choice: अपने परमेश्वर याहवे का भवन
  rationale: ‘भवन’ मूल के ‘घर/भवन’ रूपक और धार्मिक अर्थ को बनाए रखता है; ‘मन्दिर’ अधिक स्पष्ट किन्तु कुछ अधिक व्याख्यात्मक विकल्प है। हिन्दी में सम्बन्धों का स्वाभाविक क्रम अपनाया गया है।
- source_word: כַּאֲשֶׁר דִּבֶּר עָלֶיךָ
  choice: जैसा उसने तुम्हारे विषय में कहा है
  rationale: דבר על का सीधा अर्थ किसी के विषय में बोलना है। ‘कहा है’ पूर्व कथन की वर्तमान प्रासंगिकता रखता है और इसे अनावश्यक रूप से ‘प्रतिज्ञा’ नहीं बनाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: दाऊद के कथन में क्रियाओं का बल
  choice: 'आशीष/कामना के साथ अपेक्षित कार्य: ‘साथ रहे ... सफलता मिले ... बनाओ’'
  alternative: 'सरल भविष्यवाणी: ‘साथ होगा ... सफल होगे और बनाओगे’'
  rationale: आरम्भिक יְהִי स्पष्टतः इच्छासूचक है। आगे की क्रियाएँ उसी आशीष और प्रोत्साहन की धारा में पढ़ी गई हैं, यद्यपि उनमें अपेक्षित पूर्ति का भाव भी बना रहता है।
- issue: דִּבֶּר का आशय
  choice: कहा है
  alternative: प्रतिज्ञा की है
  rationale: प्रसंग में परमेश्वर का पूर्व कथन प्रतिज्ञात्मक माना जा सकता है, पर मूल क्रिया केवल ‘बोलना/कहना’ कहती है; इसलिए मुख्य पाठ व्यापक अर्थ सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरे बेटे’ पितृसुलभ सम्बोधन को, ‘भवन’ मूल धार्मिक रूपक को, और ‘याहवे’ व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है। क्रिया-क्रम को कठोर भविष्यवाणी बनाने के बजाय आशीष और प्रोत्साहन के रूप में व्यक्त किया गया है।
