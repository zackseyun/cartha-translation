  text: הֲ/לֹ֨א יְהוָ֤ה אֱלֹֽהֵי/כֶם֙ עִמָּ/כֶ֔ם וְ/הֵנִ֥יחַ לָ/כֶ֖ם מִ/סָּבִ֑יב כִּ֣י נָתַ֣ן בְּ/יָדִ֗/י אֵ֚ת יֹשְׁבֵ֣י הָ/אָ֔רֶץ וְ/נִכְבְּשָׁ֥ה הָ/אָ֛רֶץ לִ/פְנֵ֥י יְהוָ֖ה וְ/לִ/פְנֵ֥י עַמּֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/018.yaml
  text: Is not Yahweh your God with you? And has he not given you rest on every side? For he has given the inhabitants of the land into my hand[a], and the land has been subdued before Yahweh and before his people.
translation:
  language: hi
  text: क्या याहवे, तुम्हारा परमेश्वर, तुम्हारे साथ नहीं है? क्या उसने तुम्हें चारों ओर से विश्राम नहीं दिया? क्योंकि उसने देश के निवासियों को मेरे हाथ में सौंप दिया है, और देश याहवे और उसकी प्रजा[a] के सामने वश में हो गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसकी’ का संबंध सबसे स्वाभाविक रूप से याहवे से है; इसे दाऊद से संबंधित भी समझा जा सकता है।
    reason: सर्वनाम के संभावित संदर्भ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הֲלֹא
  choice: क्या ... नहीं है? / क्या ... नहीं दिया?
  rationale: यह रचना ऐसे आलंकारिक प्रश्न आरम्भ करती है जिसका अपेक्षित उत्तर हाँ है; हिन्दी में ‘क्या ... नहीं’ उसका प्रश्नात्मक बल बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: याहवे के साथ यह बहुवचन-रूप इस प्रसंग में एकवचन अर्थ रखने वाली उपाधि है।
- source_word: עִמָּכֶם
  choice: तुम्हारे साथ
  rationale: यहाँ पूर्वसर्ग परमेश्वर की उपस्थिति और सहायता व्यक्त करता है।
- source_word: וְהֵנִיחַ לָכֶם מִסָּבִיב
  choice: उसने तुम्हें चारों ओर से विश्राम ... दिया
  rationale: हिफ़िल क्रिया आसपास के शत्रुओं से राहत अथवा विश्राम दिए जाने को व्यक्त करती है; ‘चारों ओर से’ מִסָּבִיב का स्वाभाविक हिन्दी रूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का आधार प्रस्तुत करता है।
- source_word: נָתַן בְּיָדִי
  choice: मेरे हाथ में सौंप दिया
  rationale: यह किसी को दूसरे के अधिकार में कर देने का मुहावरा है; अनुवाद इब्रानी के ‘हाथ’ वाले बिंब को भी सुरक्षित रखता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: देश के निवासी
  rationale: यह देश में रहने वाले लोगों के लिए प्रयुक्त कृदन्तीय पद का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: देश ... अधीन हो गया है
  rationale: כבש का निफ़अल रूप देश के वश में किए जाने और उसकी परिणामी अवस्था को व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה וְלִפְנֵי עַמּוֹ
  choice: याहवे और उसकी प्रजा के सामने
  rationale: दोनों बार आए לִפְנֵי की समानान्तरता रखी गई है; ‘उसकी’ का सबसे निकट और स्वाभाविक संदर्भ याहवे है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का स्पष्ट प्रयोग करता है; ‘याहवे’ उसका सीधा हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: וְלִפְנֵי עַמּוֹ में ‘उसकी प्रजा’ का संदर्भ
  choice: ‘उसकी’ याहवे की ओर संकेत करता है
  alternative: ‘उसकी’ दाऊद की ओर संकेत करता है
  rationale: निकटतम प्रमुख पूर्वपद याहवे है, और ‘याहवे और उसकी प्रजा’ स्वाभाविक युग्म है; फिर भी सर्वनाम की व्याकरणिक सम्भावना के कारण दाऊद-संबंधी समझ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। आलंकारिक प्रश्नों की पुनरावृत्ति, ‘हाथ’ का मूल बिंब और ‘के सामने’ की समानान्तर रचना सुरक्षित हैं।
