  yaml_path: translation/ot/1_chronicles/022/017.yaml
  text: Then David commanded all the leaders of Israel to help Solomon his son.
translation:
  language: hi
  text: तब दाऊद ने इस्राएल के सभी अगुओं को आज्ञा दी कि वे उसके पुत्र सुलैमान की सहायता करें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: तब ... आज्ञा दी
  rationale: צוה के वय्यिक्तोल रूप में अधिकारपूर्वक निर्देश देने और कथा को आगे बढ़ाने का भाव है; ‘तब’ क्रमिक वाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׂרֵי
  choice: अगुओं
  rationale: שָׂרִים यहाँ इस्राएल के शासकीय या राष्ट्रीय नेतृत्व को दर्शाता है। ‘अगुए’ आधुनिक बाइबलीय हिन्दी में स्पष्ट है और किसी विशिष्ट पद को अनावश्यक रूप से निर्धारित नहीं करता।
- source_word: לְכָל שָׂרֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी अगुओं को
  rationale: यह इस्राएल के समस्त नेतृत्व को समावेशी रूप से संबोधित करता है और मूल के संबंधसूचक विन्यास को सहज हिन्दी में रखता है।
- source_word: לַעְזֹר
  choice: सहायता करें
  rationale: עזר का सामान्य अर्थ सहायता करना है; प्रसंग में यह सुलैमान के काम में सहयोग देने का उद्देश्य व्यक्त करता है।
- source_word: לִשְׁלֹמֹה בְנוֹ
  choice: उसके पुत्र सुलैमान की
  rationale: यह सुलैमान को सहायता का प्राप्तकर्ता बताते हुए दाऊद के साथ उसके पुत्र-संबंध को सुरक्षित रखता है; हिन्दी में ‘उसके पुत्र सुलैमान’ स्वाभाविक क्रम है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अगुओं’ से व्यापक नेतृत्व का अर्थ सुरक्षित रहता है, जबकि ‘आज्ञा दी’ दाऊद के अधिकारपूर्ण निर्देश को स्पष्ट करता है।
