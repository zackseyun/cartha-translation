source:
  edition: WLC
  text: אַ֣ךְ יִֽתֶּן לְּ/ךָ֤ יְהוָה֙ שֵׂ֣כֶל וּ/בִינָ֔ה וִֽ/יצַוְּ/ךָ֖ עַל יִשְׂרָאֵ֑ל וְ/לִ/שְׁמ֕וֹר אֶת תּוֹרַ֖ת יְהוָ֥ה אֱלֹהֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/012.yaml
  text: Only[a], may Yahweh give you insight and understanding, and command you concerning Israel[b], that you may keep the law of Yahweh your God.
translation:
  language: hi
  text: केवल, याहवे तुम्हें सूझ-बूझ और समझ दे, और इस्राएल के विषय में तुम्हें आज्ञा दे[a], ताकि तुम अपने परमेश्वर याहवे की व्यवस्था[b] का पालन करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हें इस्राएल पर नियुक्त करे” अथवा “इस्राएल का दायित्व सौंपे।” इब्रानी क्रिया का सामान्य अर्थ “आज्ञा देना” है, पर इस राजकीय प्रसंग में अधिकार या दायित्व सौंपने का अर्थ भी संभव है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने परमेश्वर याहवे की शिक्षा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: बस
  rationale: यह सीमित या केंद्रित करने वाला अव्यय दाऊद की मुख्य अभिलाषा पर बल देता है। आधुनिक हिन्दी में ‘बस’ इस प्रार्थनापूर्ण भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִתֶּן
  choice: दे
  rationale: रूप अपूर्णकालिक है, पर प्रसंग में यह अभिलाषा या आशीर्वचन व्यक्त करता है; हिन्दी का संभावनार्थक ‘दे’ यही भाव रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: שֵׂכֶל וּבִינָה
  choice: सूझ-बूझ और समझ
  rationale: पहला शब्द व्यावहारिक विवेक या कुशल बुद्धि और दूसरा समझ या परख को सूचित करता है; यह जोड़ी दोनों निकटवर्ती अर्थों को अलग रखते हुए सहज हिन्दी देती है।
- source_word: וִיצַוְּךָ עַל יִשְׂרָאֵל
  choice: तुम्हें इस्राएल पर नियुक्त करे
  rationale: צוה सामान्यतः ‘आज्ञा देना’ है, किन्तु עַל और प्रजा के साथ राजकीय प्रसंग में किसी को अधिकार या दायित्व सौंपने का अर्थ संभव है। मुख्य पाठ में प्रसंगानुकूल नियुक्ति का भाव रखा गया है और अधिक शाब्दिक विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: וְלִשְׁמוֹר
  choice: ताकि ... पालन करो
  rationale: वाव सहित धात्वर्थक रूप पूर्ववर्ती कामना/नियुक्ति से जुड़ा उद्देश्य व्यक्त करता है।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: वाचा-संबंधी प्रसंग में תורה के लिए ‘व्यवस्था’ परिचित और उपयुक्त है; उसके ‘शिक्षा’ वाले व्यापक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को स्वाभाविक हिन्दी में ‘अपने परमेश्वर’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण करता है और उसे केवल उपाधि में नहीं बदलता।
- issue: וִיצַוְּךָ עַל יִשְׂרָאֵל का राजकीय अर्थ
  choice: तुम्हें इस्राएल पर नियुक्त करे
  alternative: तुम्हें इस्राएल के विषय में आज्ञा दे
  rationale: व्यापक प्रसंग सुलैमान के शासन और दायित्व से जुड़ा है, इसलिए नियुक्ति/अधिकार सौंपने का अर्थ संगत है; फिर भी क्रिया का सामान्य अर्थ ‘आज्ञा देना’ है, अतः वास्तविक भाषिक अस्पष्टता पाद-टिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रार्थनापूर्ण है। ‘सूझ-बूझ और समझ’ इब्रानी पर्याय-युग्म का भेद बनाए रखता है। सभी पाद-टिप्पणी चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
