  text: וַ/יֹּ֣אמֶר דָּוִ֗יד שְׁלֹמֹ֣ה בְנִ/י֮ נַ֣עַר וָ/רָךְ֒ וְ/הַ/בַּ֜יִת לִ/בְנ֣וֹת לַ/יהוָ֗ה לְ/הַגְדִּ֨יל לְ/מַ֜עְלָ/ה לְ/שֵׁ֤ם וּ/לְ/תִפְאֶ֨רֶת֙ לְ/כָל הָ֣/אֲרָצ֔וֹת אָכִ֥ינָה נָּ֖א ל֑/וֹ וַ/יָּ֧כֶן דָּוִ֛יד לָ/רֹ֖ב לִ/פְנֵ֥י מוֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/005.yaml
  text: And David said[a], “My son Solomon is young and inexperienced, and the house to be built for Yahweh must be made exceedingly great in fame and splendor in all lands[c][b]. I will now make preparation for it.” So David made abundant preparations before his death.
translation:
  language: hi
  text: तब दाऊद ने कहा, “मेरा पुत्र सुलैमान युवा और अनुभवहीन[a] है। याहवे के लिए जो भवन[b] बनाया जाना है, वह अत्यन्त महान होना चाहिए, ताकि सभी देशों में उसकी ख्याति और शोभा[c] हो। अब मैं उसके लिए तैयारी करूँगा।” इस प्रकार दाऊद ने अपनी मृत्यु से पहले भरपूर तैयारी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युवा और कोमल।” इब्रानी विशेषण का मूल अर्थ कोमल या नाज़ुक है; यहाँ सम्भवतः सुलैमान की अपरिपक्वता या अनुभव की कमी अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “घर”; यहाँ याहवे के लिए बनाए जाने वाले उपासना-भवन का उल्लेख है।
    reason: lexical_alternative
  - marker: c
    text: या “नाम और शोभा”; अर्थात ख्याति और वैभव।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר וָרָךְ
  choice: जवान और अनुभवहीन
  rationale: נַעַר सुलैमान की तुलनात्मक युवावस्था बताता है और רַךְ का मूल अर्थ ‘कोमल’ है; यहाँ दाऊद द्वारा पहले से तैयारी करने के कारण के रूप में यह उसकी अपरिपक्वता या अनुभव की कमी की ओर संकेत करता है।
- source_word: הַבַּיִת
  choice: भवन
  rationale: इब्रानी में शाब्दिक रूप से ‘घर’ है, पर याहवे के उपासना-स्थान के लिए हिन्दी में ‘भवन’ स्वाभाविक है और ‘मन्दिर’ की अपेक्षा स्रोत की रूपकात्मक भाषा को अधिक सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: לְהַגְדִּיל לְמַעְלָה
  choice: अत्यन्त भव्य होना चाहिए
  rationale: यह तीव्रतासूचक अभिव्यक्ति भवन की असाधारण महानता बताती है; ‘भव्य’ हिन्दी में उसके विशाल और गौरवपूर्ण स्वरूप दोनों को सहज रूप से व्यक्त करता है।
- source_word: לְשֵׁם וּלְתִפְאֶרֶת
  choice: उसका नाम और वैभव हो
  rationale: ‘नाम’ सार्वजनिक ख्याति और תִּפְאֶרֶת शोभा, गौरव या वैभव को व्यक्त करता है। यह अनुवाद दोनों पक्षों को बनाए रखता है।
- source_word: לְכָל הָאֲרָצוֹת
  choice: सभी देशों में
  rationale: बहुवचन אֲרָצוֹת यहाँ विभिन्न देशों या भूभागों की ओर संकेत करता है।
- source_word: אָכִינָה נָּא לוֹ
  choice: अब मैं उसके लिए तैयारी करूँगा
  rationale: संकल्पसूचक रूप दाऊद का निश्चय व्यक्त करता है। हिन्दी का ‘उसके लिए’ इब्रानी सर्वनाम की उस स्वाभाविक अस्पष्टता को भी बनाए रखता है जिसमें निकटतम संदर्भ भवन है, पर सुलैमान भी सम्भव संदर्भ हो सकता है।
- source_word: לָרֹב
  choice: बहुतायत में तैयारी की
  rationale: यह दाऊद द्वारा की गई तैयारी की बड़ी मात्रा पर बल देता है।
- source_word: לִפְנֵי מוֹתוֹ
  choice: अपनी मृत्यु से पहले
  rationale: यह मूल की सीधी कालवाचक अभिव्यक्ति है और हिन्दी कथात्मक शैली में स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: הַבַּיִת को भवन या मन्दिर कहना
  choice: भवन
  alternative: मन्दिर / घर
  rationale: ‘भवन’ मूल के ‘घर’ को अपेक्षाकृत निकट रखता है और हिन्दी में इस भावी पवित्र निर्माण के लिए स्पष्ट तथा गरिमापूर्ण है।
- issue: לוֹ का संदर्भ
  choice: उसके लिए
  alternative: इसके लिए, अर्थात भवन के लिए / सुलैमान के लिए
  rationale: व्याकरणतः पुल्लिंग सर्वनाम भवन और सुलैमान दोनों से जुड़ सकता है। प्रसंग भवन की तैयारी को प्रमुख बनाता है, फिर भी हिन्दी में सर्वनाम को खुला रखकर वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। वाक्य-विन्यास को बोलचाल योग्य रखा गया है, जबकि ‘नाम और वैभव’ जैसी स्रोत-सन्निकट अभिव्यक्ति द्वारा मूल की धार्मिक और साहित्यिक प्रतिध्वनि सुरक्षित रखी गई है।
