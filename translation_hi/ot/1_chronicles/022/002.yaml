  text: וַ/יֹּ֣אמֶר דָּוִ֔יד לִ/כְנוֹס֙ אֶת הַ/גֵּרִ֔ים אֲשֶׁ֖ר בְּ/אֶ֣רֶץ יִשְׂרָאֵ֑ל וַ/יַּעֲמֵ֣ד חֹֽצְבִ֗ים לַ/חְצוֹב֙ אַבְנֵ֣י גָזִ֔ית לִ/בְנ֖וֹת בֵּ֥ית הָ/אֱלֹהִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/002.yaml
  text: And David ordered the foreigners who were in the land of Israel to be gathered[c][b][a], and he appointed stonecutters to cut dressed stones for building the house of God.
translation:
  language: hi
  text: तब दाऊद ने इस्राएल की भूमि में रहनेवाले परदेशियों[a] को इकट्ठा करने की आज्ञा दी, और परमेश्वर का भवन[c] बनाने के लिए तराशे हुए पत्थर[b] तैयार करने को पत्थर काटनेवालों को नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रवासियों’ अथवा ‘निवासी विदेशियों’। इब्रानी शब्द से आशय देश में रहनेवाले गैर-इस्राएली निवासियों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कटे हुए पत्थर’ अथवा ‘तराशे हुए पत्थर’।
    reason: lexical_alternative
  - marker: c
    text: अर्थात मंदिर।
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: आज्ञा दी
  rationale: क्रिया का मूल अर्थ ‘कहा’ है, पर לִכְנוֹס के साथ यह किसी कार्य का निर्देश देती है; इसलिए प्रसंगानुसार ‘आज्ञा दी’ स्वाभाविक और सटीक है।
- source_word: לִכְנוֹס
  choice: इकट्ठा करने
  rationale: यह दाऊद के निर्देश की विषयवस्तु बताता है। हिंदी में ‘परदेशियों को इकट्ठा करने की आज्ञा दी’ स्पष्ट करता है कि दाऊद ने यह कार्य करवाने का आदेश दिया।
- source_word: הַגֵּרִים
  choice: रहनेवाले परदेशियों
  rationale: גֵּרִים से आशय देश में बसे गैर-इस्राएली निवासियों से है। ‘रहनेवाले परदेशी’ इस निवासी भाव को सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: בְּאֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल देश में
  rationale: अֶרֶץ को स्पष्ट रखते हुए यह वाक्यांश इतिहासकार के भू-क्षेत्र संबंधी भाव को सुरक्षित रखता है।
- source_word: וַיַּעֲמֵד
  choice: नियुक्त किए
  rationale: यहाँ क्रिया कामगारों को एक निश्चित कार्य पर लगाने या ठहराने का प्रशासनिक भाव रखती है।
- source_word: חֹצְבִים
  choice: पत्थर तराशनेवाले कारीगर
  rationale: संज्ञात्मक कृदंत पत्थर काटने या तराशने का काम करनेवालों को दर्शाता है; ‘कारीगर’ जोड़ने से हिंदी में आशय सहज और स्पष्ट होता है।
- source_word: לַחְצוֹב
  choice: तराशने
  rationale: निर्माण के लिए पत्थर काटकर आकार देने की क्रिया को ‘तराशना’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַבְנֵי גָזִית
  choice: गढ़े हुए पत्थर
  rationale: यह पद निर्माण के लिए काटकर आकार दिए गए पत्थरों को दर्शाता है। ‘गढ़े हुए पत्थर’ तैयार और आकार दिए जाने का भाव रखता है।
- source_word: לִבְנוֹת
  choice: बनाने के लिए
  rationale: यह उद्देश्यसूचक infinitive है; हिंदी में ‘बनाने के लिए’ उसका अर्थ सहज रूप से व्यक्त करता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: यह स्रोत के ‘परमेश्वर का घर/भवन’ रूप को बनाए रखता है और मुख्य पाठ में व्याख्यात्मक ‘मंदिर’ को प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: בֵּית הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर का भवन
  alternative: परमेश्वर का मंदिर
  rationale: प्रसंग में भावी मंदिर अभिप्रेत है, किंतु इब्रानी पद का शाब्दिक रूप ‘परमेश्वर का घर/भवन’ है। इसलिए मुख्य पाठ स्रोत की अभिव्यक्ति रखता है और पादटिप्पणी संदर्भ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘परमेश्वर का भवन’ स्रोत की अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘रहनेवाले परदेशी’ גֵּרִים के निवासी-विदेशी भाव को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न संबद्ध पदों के तुरंत बाद रखे गए हैं।
