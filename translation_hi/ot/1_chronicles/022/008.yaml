  text: וַ/יְהִ֨י עָלַ֤/י דְּבַר יְהוָה֙ לֵ/אמֹ֔ר דָּ֤ם לָ/רֹב֙ שָׁפַ֔כְתָּ וּ/מִלְחָמ֥וֹת גְּדֹל֖וֹת עָשִׂ֑יתָ לֹֽא תִבְנֶ֥ה בַ֨יִת֙ לִ/שְׁמִ֔/י כִּ֚י דָּמִ֣ים רַבִּ֔ים שָׁפַ֥כְתָּ אַ֖רְצָ/ה לְ/פָנָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/022/008.yaml
  text: But the word of Yahweh came to me[a], saying, ‘You have shed much blood and fought great wars. You shall not build a house for my name[d][c][b], because you have shed much blood on the earth before me.’
translation:
  language: hi
  text: 'परन्तु याहवे का वचन मेरे पास आया: “तूने बहुत रक्त[a] बहाया है और बड़े-बड़े युद्ध लड़े हैं[b]। तू मेरे नाम के लिए भवन[c] नहीं बनाएगा, क्योंकि तूने मेरे सामने धरती पर[d] बहुत रक्त बहाया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुतायत से रक्त।”
    reason: lexical_alternative
  - marker: b
    text: या, “बड़े-बड़े युद्ध किए हैं।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात् मन्दिर; इब्रानी में, “मेरे नाम के लिए एक घर।”
    reason: cultural_note
  - marker: d
    text: या, “ज़मीन पर।” इब्रानी रूप में धरती या ज़मीन की ओर गति का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דְּבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह प्रचलित भविष्यद्वाणी-सूत्र है। ‘वचन’ דְּבַר का ठोस रूप बनाए रखता है और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: וַיְהִי עָלַי
  choice: मेरे पास आया
  rationale: शाब्दिक ‘मुझ पर हुआ’ की अपेक्षा यह आधुनिक हिन्दी में ईश्वरीय संबोधन के आने का स्वाभाविक और स्पष्ट रूप है।
- source_word: דָּם לָרֹב
  choice: बहुत लहू
  rationale: यह बड़ी मात्रा में किए गए रक्तपात को व्यक्त करता है; ‘लहू’ मूल की ठोस छवि को बनाए रखता है।
- source_word: וּמִלְחָמוֹת גְּדֹלוֹת עָשִׂיתָ
  choice: बड़े-बड़े युद्ध किए हैं
  rationale: मूलतः ‘बड़े युद्ध किए’ है। हिन्दी में यह स्वाभाविक है और दाऊद की व्यापक युद्ध-संबंधी गतिविधि को व्यक्त करता है; ‘लड़े हैं’ भी संभव है।
- source_word: לֹא תִבְנֶה בַיִת לִשְׁמִי
  choice: तू मेरे नाम के लिए भवन नहीं बनाएगा
  rationale: ‘भवन’ בַיִת के घर/भवन रूपक को बचाता है, जबकि प्रसंग में मन्दिर अभिप्रेत है। ‘मेरे नाम के लिए’ वाचा-संबंधी मूल अभिव्यक्ति को व्याख्यात्मक रूप से केवल ‘मेरे लिए’ नहीं बनाता।
- source_word: דָּמִים רַבִּים
  choice: बहुत लहू
  rationale: बहुवचन रूप रक्तपात या रक्त-दोष का संकेत दे सकता है। यहाँ ‘बहुत लहू’ पहले वाक्यांश की ठोस छवि और जानबूझकर की गई पुनरावृत्ति बनाए रखता है।
- source_word: אַרְצָה
  choice: धरती पर
  rationale: दिशासूचक रूप का अर्थ धरती/ज़मीन की ओर या उस पर हो सकता है। रक्त बहाने के साथ ‘धरती पर’ स्वाभाविक है, जबकि वैकल्पिक सूक्ष्मता पादटिप्पणी में रखी गई है।
- source_word: לְפָנַי
  choice: मेरे सामने
  rationale: यह इस धार्मिक बल को बनाए रखता है कि रक्तपात परमेश्वर की दृष्टि और उपस्थिति में हुआ।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिवाचक वाचा-नाम सीधे आया है; ‘यहोवा’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: בַיִת को ‘भवन’ कहना या स्पष्टतः ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: प्रसंग में मन्दिर अभिप्रेत है, पर मूल संज्ञा ‘घर/भवन’ है। ‘भवन’ रखने से मन्दिर-भवन की बाइबलीय छवि बनी रहती है; आशय पादटिप्पणी में स्पष्ट किया गया है।
- issue: לֹא תִבְנֶה को निषेध या भविष्यवाणी के रूप में व्यक्त करना
  choice: नहीं बनाएगा
  alternative: मत बनाना
  rationale: इब्रानी अपूर्ण क्रिया यहाँ निषेधात्मक आदेश और घोषित भविष्य—दोनों की छाया रख सकती है। ‘नहीं बनाएगा’ दाऊद के लिए परमेश्वर के निर्णय को व्यक्त करता है और इसे केवल साधारण आज्ञा तक सीमित नहीं करता।
