  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। दाऊद द्वारा उद्धृत सीधे ईश्वरीय संबोधन में ‘तू’ मूल के एकवचन निकट संबोधन के अनुरूप है और यहाँ असम्मानसूचक नहीं है। ‘लहू’, ‘वचन’ और ‘मेरे नाम के लिए भवन’ मूल की प्रमुख ठोस तथा वाचा-संबंधी छवियों को बनाए रखते हैं।
