  text: וּ/בְנֵ֨י רְאוּבֵ֥ן בְּכֽוֹר יִשְׂרָאֵל֮ כִּ֣י ה֣וּא הַ/בְּכוֹר֒ וּֽ/בְ/חַלְּל/וֹ֙ יְצוּעֵ֣י אָבִ֔י/ו נִתְּנָה֙ בְּכֹ֣רָת֔/וֹ לִ/בְנֵ֥י יוֹסֵ֖ף בֶּן יִשְׂרָאֵ֑ל וְ/לֹ֥א לְ/הִתְיַחֵ֖שׂ לַ/בְּכֹרָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/001.yaml
  text: The sons of Reuben[a], the firstborn of Israel—for he was the firstborn, but because he defiled his father’s bed, his birthright was given to the sons of Joseph son of Israel[b], though not to be enrolled by birthright—
translation:
  language: hi
  text: इस्राएल के पहलौठे रूबेन के पुत्र—क्योंकि वह पहलौठा था, पर अपने पिता की शय्या[a] को अपवित्र करने के कारण उसका पहलौठे का अधिकार इस्राएल के पुत्र यूसुफ के पुत्रों को दे दिया गया; पर वंशावली में गणना पहलौठे के अधिकार के आधार पर नहीं की गई[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘शय्याओं’; हिब्रू का बहुवचन यहाँ पिता की वैवाहिक शय्या के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पर पहलौठे के रूप में वंशावली में दर्ज नहीं किया गया।’ हिब्रू वाक्यांश वंशावली में दर्ज या गिने जाने को दर्शाता है; इसका कर्ता स्पष्ट रूप से नहीं बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי רְאוּבֵן
  choice: रूबेन के पुत्र
  rationale: וּבְנֵי का मूल अर्थ ‘और ... के पुत्र’ है; यहाँ वंशावली की अगली इकाई आरम्भ होती है। हिन्दी में आरम्भिक ‘और’ के बिना पद अधिक स्वाभाविक है, जबकि संबंध प्रसंग से स्पष्ट रहता है।
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: इस्राएल के पहलौठे
  rationale: בכור जन्मक्रम और उससे जुड़ी पारिवारिक स्थिति दोनों को व्यक्त करता है। ‘पहलौठा’ आधुनिक हिन्दी में सटीक और बाइबिलीय संदर्भ में सुबोध है।
- source_word: כִּי הוּא הַבְּכוֹר
  choice: क्योंकि वही पहलौठा था
  rationale: כִּי व्याख्यात्मक कारण देता है और הוּא में निहित बल को ‘वही’ से व्यक्त किया गया है। स्रोत की पुनरुक्ति को हटाया नहीं गया।
- source_word: וּבְחַלְּלוֹ יְצוּעֵי אָבִיו
  choice: पर अपने पिता की शय्या को अपवित्र करने के कारण
  rationale: חלל यहाँ यौन अपराध द्वारा पिता की वैवाहिक शय्या को दूषित करने का भाव रखता है। יְצוּעֵי रूप में बहुवचन है, पर मुहावरे में वैवाहिक शय्या को सूचित करता है; इसलिए मुख्य पाठ में स्वाभाविक एकवचन रखा गया है।
- source_word: נִתְּנָה בְּכֹרָתוֹ
  choice: उसका पहलौठे का अधिकार ... दे दिया गया
  rationale: בכֹרה केवल जन्मक्रम नहीं, पहलौठे के विशेषाधिकार को दर्शाता है। ‘पहलौठे का अधिकार’ सामान्य पाठक के लिए ‘ज्येष्ठाधिकार’ से अधिक पारदर्शी है।
- source_word: לִבְנֵי יוֹסֵף בֶּן יִשְׂרָאֵל
  choice: इस्राएल के पुत्र यूसुफ के पुत्रों को
  rationale: 'वंशसूचक दोनों संबंध स्पष्ट रखे गए हैं: यूसुफ इस्राएल का पुत्र है और अधिकार यूसुफ के पुत्रों को मिला।'
- source_word: וְלֹא לְהִתְיַחֵשׂ לַבְּכֹרָה
  choice: फिर भी पहलौठे के अधिकार के अनुसार वंशावली में नाम दर्ज नहीं किया गया
  rationale: התיחשׂ वंशावली में पंजीकरण अथवा वंश के अनुसार गिने जाने का तकनीकी शब्द है। निष्क्रिय, अव्यक्त कर्ता वाली रचना मूल कथन की संक्षिप्तता और कुछ अस्पष्टता बनाए रखती है।
theological_decisions:
- issue: रूबेन की जन्मगत स्थिति और उसके पहलौठे के अधिकार में भेद
  choice: रूबेन को वास्तविक पहलौठा कहा गया है, जबकि उसका पहलौठे का अधिकार यूसुफ के पुत्रों को दिया गया; अंतिम उपवाक्य वंशावली में दर्ज किए जाने को इस हस्तांतरण से अलग रखता है।
  alternative: यूसुफ या उसके पुत्रों को हर अर्थ में वंशावली का पहलौठा बना देना।
  rationale: मूल पाठ जैविक जन्मक्रम, अधिकार के हस्तांतरण और वंशावली की गणना को एक ही बात नहीं मानता। अनुवाद इस तनाव को बिना किसी संप्रदायगत निष्कर्ष के बनाए रखता है।
- issue: अंतिम उपवाक्य का अव्यक्त कर्ता
  choice: ‘नाम दर्ज नहीं किया गया’ कहकर कर्ता को स्पष्ट रूप से निर्धारित नहीं किया गया।
  alternative: स्पष्ट रूप से कहना कि ‘यूसुफ के पुत्र पहलौठे के रूप में दर्ज नहीं किए गए’ या ‘रूबेन दर्ज नहीं किया गया।’
  rationale: हिब्रू infinitive construction में कर्ता स्पष्ट रूप से व्यक्त नहीं है। संदर्भ यूसुफ के पुत्रों की ओर संकेत करता है, पर मुख्य पाठ में अनावश्यक रूप से अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘पहलौठा’ और ‘पहलौठे का अधिकार’ को स्पष्टता के लिए चुना गया है; ‘शय्या’ प्रसंग की गरिमा और यौन-संबंधी मुहावरे दोनों को संभालती है। पद अगले पद में जारी रहने वाली व्याकरणिक रचना है, इसलिए अंत में दीर्घ विराम-चिह्न रखा गया है।
