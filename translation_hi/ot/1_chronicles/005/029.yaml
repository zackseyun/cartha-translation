base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/029.yaml
  text: 'The sons of Amram: Aaron[a], Moses, and Miriam; and the sons of Aaron: Nadab and Abihu, Eleazar and Ithamar.'
translation:
  language: hi
  text: 'अम्राम की संतानें[a]: हारून, मूसा और मरियम; और हारून के पुत्र: नादाब और अबीहू, एलीआज़र और ईतामार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘अम्राम के पुत्र’ है; पर यहाँ हारून और मूसा के साथ मरियम भी सूचीबद्ध है, इसलिए संदर्भ में यह शब्द अम्राम की संतानों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמְרָם
  choice: अम्राम की संतानें
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर इस सूची में हारून और मूसा के साथ मरियम भी सम्मिलित है। इसलिए वंशावली के आशय को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करने के लिए लिंग-समावेशी ‘संतानें’ चुना गया है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: אַהֲרֹן וּמֹשֶׁה וּמִרְיָם
  choice: हारून, मूसा और मरियम
  rationale: व्यक्तिनामों के प्रचलित हिंदी रूप अपनाए गए हैं और बार-बार आने वाले इब्रानी संयोजक को स्वाभाविक हिंदी सूची के अनुसार अंतिम नाम से पहले ‘और’ के रूप में रखा गया है।
- source_word: וּבְנֵי אַהֲרֹן
  choice: और हारून के पुत्र
  rationale: यहाँ सूची में केवल हारून के पुरुष वंशज दिए गए हैं, इसलिए בְּנֵי का सीधा और स्वाभाविक अनुवाद ‘पुत्र’ है। आरंभिक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: נָדָב וַאֲבִיהוּא אֶלְעָזָר וְאִיתָמָר
  choice: नादाब और अबीहू, एलीआज़र और ईतामार
  rationale: नामों के मानक हिंदी लिप्यंतरण रखे गए हैं और इब्रानी सूची की दो युग्मों वाली संरचना को बनाए रखा गया है।
