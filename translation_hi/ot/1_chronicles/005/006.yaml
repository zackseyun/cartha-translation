base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/006.yaml
  text: Beerah his son[a], whom Tilgath-pilneser king of Assyria carried away into exile—he was a chief of the Reubenites.
translation:
  language: hi
  text: उसका पुत्र बेएरा[a], जिसे अश्शूर का राजा तिलगत-पिलनेसेर निर्वासन में ले गया था—वह रूबेनियों का प्रधान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में अश्शूर के राजा के नाम का हिब्रू रूप “तिलगत-पिलनेसेर” है; अनेक अनुवाद अधिक परिचित ऐतिहासिक रूप “तिगलत-पिलेसेर” का प्रयोग करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵרָה
  choice: बएरा
  rationale: व्यक्तिवाचक नाम का हिब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय पिछले पद में उल्लिखित वंश-पूर्वज की ओर संकेत करता है; हिन्दी वंशावली में यह स्वाभाविक रूप है।
- source_word: הֶגְלָה
  choice: बँधुआई में ले गया
  rationale: हिफ़ील रूप किसी को निर्वासन में भेजने या ले जाने का कारणवाचक अर्थ देता है; यह पदबंध ऐतिहासिक बलपूर्वक निष्कासन को सहज हिन्दी में व्यक्त करता है।
- source_word: תִּלְגַת פִּלְנְאֶסֶר
  choice: तिलगत-पिलनेसेर
  rationale: इस पद में उपलब्ध हिब्रानी नाम-रूप का प्रत्यक्ष देवनागरी लिप्यंतरण, परिचित वैकल्पिक ऐतिहासिक रूप से सामंजस्य किए बिना।
- source_word: מֶלֶךְ אַשּׁוּר
  choice: अश्शूर का राजा
  rationale: संबंधवाचक संयोग का स्वाभाविक हिन्दी रूप; אַשּׁוּר को यहाँ साम्राज्य/देश के नाम ‘अश्शूर’ के रूप में रखा गया है।
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम संबंधवाचक उपवाक्य के बाद फिर बएरा पर ध्यान लौटाता और हिब्रानी के पुनरुक्त बल को बनाए रखता है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: गोत्रीय संदर्भ में मान्य अगुआ या मुखिया; ‘प्रधान’ राजवंशीय अर्थ थोपे बिना पद की प्रतिष्ठा व्यक्त करता है।
- source_word: לָרֽאוּבֵנִי
  choice: रूबेनियों का
  rationale: लामेद यहाँ नेतृत्व से संबंधित समुदाय को सूचित करता है; बहुवचन समुदायवाचक हिन्दी रूप सबसे स्वाभाविक है।
