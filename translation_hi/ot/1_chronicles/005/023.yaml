  text: וּ/בְנֵ֗י חֲצִי֙ שֵׁ֣בֶט מְנַשֶּׁ֔ה יָשְׁב֖וּ בָּ/אָ֑רֶץ מִ/בָּשָׁ֞ן עַד בַּ֧עַל חֶרְמ֛וֹן וּ/שְׂנִ֥יר וְ/הַר חֶרְמ֖וֹן הֵ֥מָּה רָבֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/023.yaml
  text: And the sons of the half-tribe of Manasseh lived in the land from Bashan as far as Baal-hermon[a], Senir, and Mount Hermon[b]; they became numerous.
translation:
  language: hi
  text: मनश्शे के आधे गोत्र के वंशज देश में बाशान से लेकर बाल-हेर्मोन, सनीर और हेर्मोन पर्वत[a] तक रहते थे। वे संख्या में बहुत बढ़ गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बाल-हेर्मोन, सनीर और हेर्मोन पर्वत इस भूभाग की उत्तरी सीमा बताने वाले स्थानों के नाम हैं।
    reason: cultural_note
  - marker: b
    text: या, “वे बहुत हो गए” अथवा “वे बहुत बढ़े।” इब्रानी क्रिया संख्या में वृद्धि पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र के वंशज
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर गोत्रीय संदर्भ में यह उस समूह के वंशजों या सदस्यों को दर्शाता है। ‘वंशज’ आधुनिक हिन्दी में स्वाभाविक है और वंशावली का भाव भी बनाए रखता है।
- source_word: יָשְׁבוּ בָּאָרֶץ
  choice: उस देश में ... बसे हुए थे
  rationale: ישב यहाँ किसी क्षेत्र में स्थायी निवास को व्यक्त करता है। ‘बसे हुए थे’ ongoing habitation को स्पष्ट और स्वाभाविक हिन्दी में दर्शाता है; ‘उस देश’ पूर्वोक्त गोत्रीय भूभाग का संकेत देता है।
- source_word: מִבָּשָׁן עַד
  choice: बाशान से लेकर ... तक
  rationale: מן ... עד भौगोलिक विस्तार की सीमा बताता है; हिन्दी में ‘से लेकर ... तक’ इसका स्वाभाविक समतुल्य है।
- source_word: בַּעַל חֶרְמוֹן וּשְׂנִיר וְהַר חֶרְמוֹן
  choice: बाल-हेर्मोन, सनीर और हेर्मोन पर्वत
  rationale: तीनों भौगोलिक नामों का मानक हिन्दी लिप्यंतरण किया गया है; הר को स्पष्ट रूप से ‘पर्वत’ अनूदित किया गया है।
- source_word: הֵמָּה רָבוּ
  choice: वे संख्या में बहुत बढ़ गए
  rationale: Qal क्रिया רבה यहाँ संख्या में बढ़ने या बहुत हो जाने का भाव देती है। स्पष्ट सर्वनाम הֵמָּה का बल ‘वे’ से रखा गया है, और ‘संख्या में’ जोड़ने से आशय आधुनिक पाठक के लिए स्पष्ट होता है।
