  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। गोत्रीय संदर्भ के कारण ‘पुत्रों’ के बजाय ‘वंशज’ चुना गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी विषयवस्तु से मेल नहीं खाता था; हिन्दी मसौदे में भौगोलिक टिप्पणी को स्थान-नामों के बाद और शब्दार्थ-संबंधी टिप्पणी को संख्या-वृद्धि वाले वाक्य के बाद रखा गया है।
