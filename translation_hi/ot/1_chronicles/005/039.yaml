  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ
  choice: और
  rationale: यह संयोजक वंशावली की इस कड़ी को पिछली पंक्ति से जोड़ता है; ‘और’ उसके सरल संबंधसूचक बल को बनाए रखता है।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट और प्रचलित बाइबलीय लिप्यंतरण।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: हिफ़ईल रूप वंशावली में संतान उत्पन्न करने का भाव देता है। हिंदी में ‘से ... उत्पन्न हुआ’ स्वाभाविक और गरिमापूर्ण है तथा पुरुष वंशक्रम स्पष्ट रखता है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिंदी में इसका अलग शब्द आवश्यक नहीं है।
- source_word: חִלְקִיָּה
  choice: हिल्किय्याह
  rationale: इब्रानी नाम का ऐसा देवनागरी लिप्यंतरण जो अंतिम ईश्वरीय नामांश को भी दर्शाता है।
- source_word: וְ
  choice: और
  rationale: दूसरी वंशावली कड़ी को बिना अतिरिक्त कालक्रमिक अर्थ जोड़े समन्वित करता है।
- source_word: חִלְקִיָּה
  choice: हिल्किय्याह
  rationale: पुनरावृत्त नाम का अनुवाद पूरे पद में एकसमान रखा गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: पहले प्रयोग के समान यही वंशावलीगत अर्थ और हिंदी संरचना रखी गई है।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: इब्रानी व्यक्तिगत नाम का निकट, पठनीय देवनागरी लिप्यंतरण।
