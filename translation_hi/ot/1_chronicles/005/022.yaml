base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/022.yaml
  text: For many slain fell[a], because the battle was from God; and they lived in their place until the exile.
translation:
  language: hi
  text: क्योंकि बहुत-से लोग मार गिराए गए, क्योंकि युद्ध परमेश्वर की ओर से था[a]; और वे निर्वासन तक उनकी जगह बसे रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि युद्ध परमेश्वर का था।” इब्रानी पदबंध इस बात पर बल देता है कि युद्ध का परिणाम परमेश्वर की ओर से आया।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: पहला כִּי पिछली विजय का कारण बताता है; हिन्दी में ‘क्योंकि’ कारण-संबंध को स्वाभाविक और स्पष्ट रखता है।
- source_word: חֲלָלִים רַבִּים
  choice: बहुत-से मारे गए लोग
  rationale: חֲלָלִים युद्ध में मारे गए लोगों को दर्शाता है; यह अनुवाद केवल सामान्य मृतकों के बजाय युद्ध-संदर्भ को बनाए रखता है।
- source_word: נָפָלוּ
  choice: गिर पड़े
  rationale: युद्ध के प्रसंग में נפל मारे जाकर गिरने के लिए प्रयुक्त होता है; ‘मारे गए लोग’ के साथ यह मूल की नामिक रचना और क्रिया दोनों को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दूसरा כִּי भारी जनहानि का कारण प्रस्तुत करता है।
- source_word: מֵהָאֱלֹהִים
  choice: परमेश्वर की ओर से
  rationale: מִן स्रोत या उद्गम को सूचित करता है; ‘की ओर से’ दैवी स्रोत को व्यक्त करता है, पर प्रत्यक्ष कर्तृत्व को मूल से अधिक नहीं बढ़ाता।
- source_word: הַמִּלְחָמָה
  choice: युद्ध
  rationale: यह निकटवर्ती सैन्य संघर्ष को दर्शाता है; आधुनिक हिन्दी में ‘युद्ध’ स्पष्ट और गरिमापूर्ण है।
- source_word: וַיֵּשְׁבוּ
  choice: वे ... बसे रहे
  rationale: ישב में बसने और निवास करने दोनों का भाव है; जीते हुए भूभाग में स्थायी निवास के प्रसंग में ‘बसे रहे’ उपयुक्त है।
- source_word: תַחְתֵּיהֶם
  choice: उनकी जगह
  rationale: यह मुहावरा पराजित निवासियों का स्थान लेने को दर्शाता है, न कि उनके नीचे होने को।
- source_word: עַד הַגֹּלָה
  choice: बँधुआई तक
  rationale: גּוֹלָה निर्वासन अथवा देश से ले जाए जाने की ऐतिहासिक घटना को दर्शाता है; ‘बँधुआई’ परिचित बाइबलीय हिन्दी में उस भाव को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: युद्ध में परमेश्वर की भूमिका
  choice: क्योंकि युद्ध परमेश्वर की ओर से था
  alternative: क्योंकि युद्ध परमेश्वर का था
  rationale: मूल इब्रानी युद्ध के निर्णायक स्रोत को परमेश्वर से जोड़ता है। मुख्य पाठ स्रोत का भाव बनाए रखता है, जबकि पादटिप्पणी स्वामित्व-सदृश वैकल्पिक अभिव्यक्ति देकर वास्तविक अर्थ-तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठकों के लिए सुबोध शैली। दोहरे ‘क्योंकि’ को मूल के दोनों כִּי और उनके क्रमिक कारण-संबंध को सुरक्षित रखने के लिए रखा गया है।
