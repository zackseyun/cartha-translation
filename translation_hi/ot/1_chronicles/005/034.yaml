lexical_decisions:
- source_word: אֲחִיטוּב
  choice: अहीतूब
  rationale: व्यक्तिवाचक नाम का मूल उच्चारण ध्यान में रखते हुए देवनागरी लिप्यंतरण किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में हिफ़ील क्रिया संतान उत्पन्न करने या पिता बनने का भाव देती है। हिंदी में ‘से ... उत्पन्न हुआ’ स्वाभाविक, गरिमापूर्ण और वंश-संबंध को स्पष्ट करने वाला प्रयोग है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म-सूचक चिह्न है; हिंदी वाक्य-विन्यास में इसका स्वतंत्र शाब्दिक समकक्ष आवश्यक नहीं है।
- source_word: צָדוֹק
  choice: सादोक
  rationale: व्यक्तिवाचक नाम का प्रचलित और स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: दो समानांतर वंशावली कथनों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: אֲחִימָעַץ
  choice: अहीमास
  rationale: व्यक्तिवाचक नाम का स्रोत उच्चारण के निकट देवनागरी लिप्यंतरण।
