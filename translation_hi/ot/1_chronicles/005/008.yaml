base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/008.yaml
  text: and Bela son of Azaz[a], son of Shema, son of Joel; he lived in Aroer, as far as Nebo and Baal-meon.
translation:
  language: hi
  text: और बेला, अज़ाज़ का पुत्र, शेमा का पुत्र, योएल का पुत्र, अरोएर में नबो और बाल-मओन तक के क्षेत्र में रहता था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बसा हुआ था।” इब्रानी कृदंत किसी स्थान में निवास करने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶלַע
  choice: और बेला
  rationale: आरम्भिक ו को वंशावली की पिछली कड़ी से संबंध बनाए रखने के लिए “और” कहा गया है; בלע व्यक्तिवाचक नाम है, इसलिए इसका लिप्यंतरण “बेला” किया गया है।
- source_word: בֶּן עָזָז בֶּן שֶׁמַע בֶּן יוֹאֵל
  choice: अज़ाज़ का पुत्र, शेमा का पोता और योएल का परपोता
  rationale: इब्रानी में बार-बार आए בֶּן की वंशावली-संरचना को स्वाभाविक हिन्दी में पीढ़ियों के स्पष्ट संबंध—पुत्र, पोता, परपोता—के रूप में व्यक्त किया गया है।
- source_word: הוּא יוֹשֵׁב
  choice: रहता था
  rationale: ישׁב का क़ाल कृदंत किसी स्थान में लगातार निवास करने का भाव देता है। “रहता था” आधुनिक हिन्दी में सहज और अर्थानुकूल है।
- source_word: בַּ/עֲרֹעֵר
  choice: अरोएर में
  rationale: בְּ स्थान-सूचक है और עֲרֹעֵר स्थान का नाम है; इसलिए “अरोएर में”।
- source_word: וְ/עַד נְבוֹ וּ/בַעַל מְעוֹן
  choice: नबो और बाल-मोन तक
  rationale: עַד भौगोलिक विस्तार की सीमा बताता है। दोनों स्थान-नामों को हिन्दी लिपि में रखा गया और उनके समन्वय को “और” से व्यक्त किया गया है।
