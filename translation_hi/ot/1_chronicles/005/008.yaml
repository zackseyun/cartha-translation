  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वंशावली की क्रमिक पीढ़ियों को हिन्दी के स्वाभाविक संबंध-सूचक शब्दों से स्पष्ट किया गया है। अंतिम खंड में निहित भौगोलिक विस्तार को “उसका निवास … तक फैला था” कहकर व्यक्त किया गया है, ताकि हिन्दी में वाक्य स्पष्ट रहे और मूल का क्षेत्रीय भाव बना रहे।
