id: 1CH.5.2
reference: 1 Chronicles 5:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י יְהוּדָה֙ גָּבַ֣ר בְּ/אֶחָ֔י/ו וּ/לְ/נָגִ֖יד מִמֶּ֑/נּוּ וְ/הַ/בְּכֹרָ֖ה לְ/יוֹסֵֽף׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/002.yaml
  text: For Judah prevailed over his brothers[a], and from him came the ruler, though the birthright belonged to Joseph.
translation:
  language: hi
  text: क्योंकि यहूदा अपने भाइयों पर प्रबल हुआ, और उससे एक शासक[a] निकला; फिर भी पहलौठे का अधिकार यूसुफ़ का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अगुआ” या “प्रधान।”
    reason: नָגִיד के वैकल्पिक अर्थ; ‘शासक’ को किसी विशिष्ट राजवंशीय या धार्मिक व्याख्या तक सीमित किए बिना रखा गया है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में रूबेन की वंशावली और पहलौठे का अधिकार खोने की बात का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: इस व्यक्ति और गोत्र के नाम का प्रचलित हिन्दी रूप।
- source_word: גָּבַר בְּאֶחָיו
  choice: अपने भाइयों में सबसे अधिक शक्तिशाली हुआ
  rationale: गबर शक्ति और प्रबलता दर्शाता है; बְּאֶחָיו यहाँ भाइयों के बीच यहूदा की श्रेष्ठता बताता है। यह रूप हिन्दी में स्वाभाविक है और 'विजय पाया' जैसा संघर्ष का अनावश्यक भाव नहीं जोड़ता।
- source_word: וּלְנָגִיד מִמֶּנּוּ
  choice: और उसी में से अगुआ निकला
  rationale: नागीद का अर्थ अगुआ, शासक या प्रधान हो सकता है। 'अगुआ' मूल की व्यापकता को बनाए रखता है, और 'उसी में से ... निकला' यहूदा से नेतृत्व के उद्भव को व्यक्त करता है।
- source_word: וְהַבְּכֹרָה לְיוֹסֵף
  choice: फिर भी पहलौठे का अधिकार यूसुफ़ का था
  rationale: बखोरा पहलौठे की विशेष स्थिति और अधिकार को दर्शाता है। संदर्भ में वाव यहूदा की प्रधानता और यूसुफ़ के अधिकार के बीच विरोध व्यक्त करता है, इसलिए 'फिर भी' स्वाभाविक है।
theological_decisions:
- issue: यहूदा की प्रधानता और यूसुफ़ के पहलौठे के अधिकार का संबंध
  choice: यहूदा से नेतृत्व निकलने और यूसुफ़ के पास पहलौठे का अधिकार होने को अलग-अलग विशेषाधिकारों के रूप में रखा गया है।
  alternative: यह कथन अधिक सामान्य अर्थ में लिया जा सकता है कि यहूदा सबसे शक्तिशाली हुआ, जबकि यूसुफ़ को विरासत के विशेष लाभ मिले।
  rationale: इब्रानी पाठ दोनों बातों को साथ रखकर उनके बीच का तनाव बनाए रखता है; अनुवाद उन्हें एक ही पद या अधिकार में नहीं मिलाता।
- issue: נָגִיד का आशय
  choice: अगुआ
  alternative: शासक या प्रधान
  rationale: शब्द राजकीय या सामुदायिक नेतृत्व दोनों को व्यक्त कर सकता है। 'अगुआ' किसी विशिष्ट राजवंशीय या मसीही पहचान को अनुवाद में अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'पहलौठे का अधिकार' बाइबलीय-कानूनी धारणा को स्पष्ट करता है; 'अगुआ' נָגִיד की अर्थगत व्यापकता सुरक्षित रखता है।
