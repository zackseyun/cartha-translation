  text: In the days of Saul they made war with the Hagrites[a], and they fell into their hand[b]; and they lived in their tents throughout all the region east of Gilead.
translation:
  language: hi
  text: शाऊल के दिनों में उन्होंने हग्रियों[a] से युद्ध किया। हग्री उनके हाथ में पड़ गए[b], और इस्राएली लोग गिलाद के पूर्व की ओर के पूरे प्रदेश में हग्रियों के तंबुओं में रहने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हाजिरा से जुड़े लोग।” यह इब्रानी जातिनाम संभवतः हाजिरा से संबंधित एक समुदाय को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे उनके हाथ में पड़ गए,” अर्थात उनके वश में आ गए। संदर्भ से यहाँ पड़ने वाले हग्री हैं।
    reason: lexical_alternative
