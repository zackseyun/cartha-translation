base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/020.yaml
  text: They were helped against them[a], and the Hagrites and all who were with them were given into their hand, because they cried out to God in the battle[c][b], and he answered them because they trusted in him.
translation:
  language: hi
  text: उन्हें उनके विरुद्ध सहायता मिली, और हग्रियों[a] तथा उनके साथ के सभी लोगों को उनके हाथ में सौंप दिए गए[b], क्योंकि युद्ध में उन्होंने परमेश्वर की दुहाई दी। परमेश्वर ने उनकी विनती स्वीकार की[c], क्योंकि उन्होंने उस पर भरोसा रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हागारियों’।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से ‘उनके हाथ में दे दिए गए’; अर्थात वे पराजित होकर उनके अधिकार में आ गए।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसने अपने से विनती किए जाने पर उनकी सुन ली’; इब्रानी क्रिया परमेश्वर के अनुकूल उत्तर देने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָזְרוּ עֲלֵיהֶם
  choice: उन्हें उनके विरुद्ध सहायता मिली
  rationale: निफ़अल रूप का कर्मवाच्य भाव सुरक्षित रखा गया है; सहायता देने वाला इस उपवाक्य में अप्रकट रहता है, जबकि आगे का संदर्भ परमेश्वर की भूमिका स्पष्ट करता है।
- source_word: וַיִּנָּתְנוּ בְיָדָם
  choice: उनके हाथ में कर दिया गया
  rationale: यह सैन्य पराजय और शत्रु पर अधिकार मिलने का इब्रानी मुहावरा है; हिंदी में मूल बिंब को बनाए रखते हुए स्वाभाविक रूप दिया गया है।
- source_word: הַהַגְרִיאִים
  choice: हग्रियों
  rationale: जाति-नाम का स्रोतानुकूल लिप्यंतरण है; वैकल्पिक प्रचलित रूप ‘हागारियों’ को पादटिप्पणी में रखा गया है।
- source_word: וְכֹל שֶׁעִמָּהֶם
  choice: उनके साथ के सभी लोगों
  rationale: इससे हग्रियों के साथ उपस्थित सहयोगी दलों या लोगों का व्यक्तिगत और सैन्य संदर्भ स्पष्ट होता है।
- source_word: כִּי לֵאלֹהִים זָעֲקוּ
  choice: क्योंकि ... उन्होंने परमेश्वर की दुहाई दी थी
  rationale: זעק संकट में सहायता के लिए की गई तीव्र पुकार दर्शाता है; ‘दुहाई दी’ आधुनिक हिंदी में उस आग्रह और दिशा दोनों को व्यक्त करता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: निर्दिष्ट युद्ध का संदर्भ संक्षिप्त और स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: וְנַעְתּוֹר לָהֶם
  choice: परमेश्वर ने उनकी विनती स्वीकार की
  rationale: עתר का निफ़अल यहाँ प्रार्थना से अनुकूल रूप से प्रभावित होकर उत्तर देने का अर्थ रखता है; स्पष्ट कर्ता पिछले उल्लेख ‘परमेश्वर’ से लिया गया है। पादटिप्पणी अधिक रूपनिष्ठ विकल्प देती है।
- source_word: כִּי בָטְחוּ בוֹ
  choice: क्योंकि उन्होंने उस पर भरोसा रखा था
  rationale: בטח ב निर्भरता और विश्वास व्यक्त करता है; कारणसूचक संबंध और परमेश्वर पर आश्रय दोनों सुरक्षित हैं।
theological_decisions:
- issue: युद्ध में मिली सहायता का कर्ता
  choice: कर्मवाच्य ‘उन्हें ... सहायता मिली’ द्वारा तत्काल कर्ता को अप्रकट रखना
  alternative: ‘परमेश्वर ने उनके शत्रुओं के विरुद्ध उनकी सहायता की’
  rationale: इब्रानी क्रिया कर्मवाच्य है। आगे प्रार्थना और भरोसे के उल्लेख से परमेश्वर को अंतिम सहायक समझा जाता है, पर पहले उपवाक्य की अस्पष्टता को अनावश्यक रूप से नहीं मिटाया गया।
- issue: प्रार्थना के प्रति परमेश्वर की अनुकूल प्रतिक्रिया
  choice: ‘परमेश्वर ने उनकी विनती स्वीकार की’
  alternative: ‘उसने अपने से विनती किए जाने दी’ अथवा ‘उसने उन्हें उत्तर दिया’
  rationale: मूल क्रिया अनुकूल प्रत्युत्तर का संकेत देती है। चुना हुआ रूप सहज हिंदी में प्रार्थना, भरोसे और परमेश्वर की प्रतिक्रिया का संबंध बताता है; अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य मुहावरे में मूल ‘हाथ’ का बिंब सुरक्षित है, जबकि पादटिप्पणी उसका अर्थ स्पष्ट करती है।
