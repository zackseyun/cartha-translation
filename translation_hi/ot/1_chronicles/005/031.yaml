  text: अबीशूआ बुक्की का पिता बना, और बुक्की उज्जी का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: अबीशूआ
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है; आरंभिक וַ को वाक्य के आरंभ में अलग से व्यक्त करना स्वाभाविक हिंदी में आवश्यक नहीं है।
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: वंशावली के प्रसंग में ילד का हिफ़ील रूप संतान उत्पन्न करने अथवा पिता बनने का अर्थ देता है। ‘का पिता हुआ’ आधुनिक हिंदी में स्पष्ट है और पुरुष के लिए अस्वाभाविक लग सकने वाले ‘जन्म दिया’ से बचता है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित कर्म का इब्रानी चिह्न है; हिंदी में इसका स्वतंत्र समतुल्य आवश्यक नहीं है।
- source_word: בֻּקִּי
  choice: बुक्की
  rationale: इब्रानी व्यक्तिवाचक नाम का निकट ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: וּ/בֻקִּי
  choice: और बुक्की
  rationale: उपसर्ग וּ को ‘और’ के रूप में रखा गया है, जिससे वंशावली की क्रमिक कड़ी स्पष्ट रहती है।
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: दोहराए गए वंशावली-क्रियापद का समान अनुवाद पारदर्शिता और शैलीगत संगति बनाए रखता है।
- source_word: עֻזִּי
  choice: उज्जी
  rationale: द्वित्वयुक्त ज़ायिन की ध्वनि को ‘ज्ज’ से दर्शाते हुए इब्रानी नाम का देवनागरी लिप्यंतरण किया गया है।
