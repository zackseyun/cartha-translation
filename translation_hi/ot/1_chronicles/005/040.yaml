  source_fidelity: 'The draft accurately preserves the two genealogical Hiphil clauses and their coordination: Azariah is the father of Seraiah, and Seraiah is the father of Jehozadak. However, the first personal name is inaccurately transliterated: עֲזַרְיָה is Azariah/अज़र्याह, not अजर्याह.'
  naturalness: “का पिता हुआ” is understandable and suitably concise in a genealogy, though “का पिता बना” is slightly more idiomatic in modern Hindi. Retaining the parallel construction is appropriate.
  terminology: The name सरायाह represents שְׂרָיָה well. “यहोसादाक” is a defensible close transliteration of יְהוֹצָדָק. The correction needed is अज़र्याह, including ज़ for the Hebrew zayin sound.
