  text: अज़र्याह सरायाह का पिता हुआ, और सरायाह यहोसादाक का पिता हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/עֲזַרְיָה
  choice: अजर्याह
  rationale: व्यक्तिवाचक नाम का उसके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; आरंभिक וַ को वाक्य के आरंभ में अलग से व्यक्त करना हिंदी में आवश्यक नहीं है।
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: वंशावली में ילד के हिफ़ील रूप का अर्थ संतान उत्पन्न करने वाला पिता होना है। ‘का पिता हुआ’ आधुनिक हिंदी में स्वाभाविक है और ‘जन्म दिया’ से उत्पन्न हो सकने वाले मातृ-संबंधी संकेत से बचता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है; हिंदी में इसका स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: שְׂרָיָה
  choice: सरायाह
  rationale: हिब्रू व्यक्तिवाचक नाम का उसके स्रोत-रूप के निकट देवनागरी लिप्यंतरण।
- source_word: וּ/שְׂרָיָה
  choice: और सरायाह
  rationale: उपसर्ग וּ को दोनों वंशावली कथनों को जोड़ने वाले स्वाभाविक हिंदी समुच्चयबोधक ‘और’ से व्यक्त किया गया है।
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: दोहराए गए वंशावली क्रिया-रूप को स्पष्टता और संगति के लिए पहले प्रयोग के समान अनूदित किया गया है।
- source_word: יְהוֹצָדָק
  choice: यहोसादाक
  rationale: हिब्रू नाम का देवनागरी लिप्यंतरण; इसमें आरंभिक יהו और अंतिम צדק, दोनों को पहचानने योग्य रूप में रखा गया है।
