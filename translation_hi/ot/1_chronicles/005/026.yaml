source:
  edition: WLC
  text: וַ/יָּעַר֩ אֱלֹהֵ֨י יִשְׂרָאֵ֜ל אֶת ר֣וּחַ פּ֣וּל מֶֽלֶךְ אַשּׁ֗וּר וְ/אֶת ר֨וּחַ֙ תִּלְּגַ֤ת פִּלְנֶ֨סֶר֙ מֶ֣לֶךְ אַשּׁ֔וּר וַ/יַּגְלֵ/ם֙ לָ/ראוּבֵנִ֣י וְ/לַ/גָּדִ֔י וְ/לַ/חֲצִ֖י שֵׁ֣בֶט מְנַשֶּׁ֑ה וַ֠/יְבִיאֵ/ם לַ/חְלַ֨ח וְ/חָב֤וֹר וְ/הָרָא֙ וּ/נְהַ֣ר גּוֹזָ֔ן עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/026.yaml
  text: So the God of Israel stirred up the spirit of Pul king of Assyria[a], even the spirit of Tilgath-pilneser king of Assyria, and he took the Reubenites, the Gadites, and the half-tribe of Manasseh into exile, and brought them to Halah, Habor, Hara, and the river Gozan[b], to this day.
translation:
  language: hi
  text: तब इस्राएल के परमेश्वर ने अश्शूर के राजा पूल की आत्मा को और अश्शूर के राजा तिलगत-पिलनेसेर की आत्मा को उभारा[a]; और उसने रूबेनियों, गादियों और मनश्शे के आधे गोत्र को निर्वासित कर दिया और उन्हें हलह, हाबोर, हारा और गोजान नदी तक ले गया, जहाँ वे आज तक हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, दोनों नाम एक ही राजा के दो नाम हो सकते हैं: “अश्शूर के राजा पूल की आत्मा को, अर्थात् अश्शूर के राजा तिलगत-पिलनेसेर की आत्मा को।”'
    reason: इब्रानी वाक्यरचना दोनों नामों को दो अलग शासकों के नाम या एक ही शासक के दो नाम मानने की गुंजाइश देती है।
lexical_decisions:
- source_word: וַיָּעַר
  choice: उभारा
  rationale: यह क्रिया किसी को कार्य के लिए प्रेरित या उद्यत करने का भाव देती है। ‘उभारा’ ईश्वरीय कारणता को बनाए रखता है, पर अनावश्यक नकारात्मक नैतिक अर्थ नहीं जोड़ता।
- source_word: ר֣וּחַ ... ר֨וּחַ
  choice: आत्मा ... आत्मा
  rationale: यहाँ רוּחַ शासक की भीतरी प्रेरणा या प्रवृत्ति को दर्शाता है। ‘आत्मा’ मूल रूपक और धर्मवैचारिक स्वर को सुरक्षित रखता है।
- source_word: פּוּל
  choice: पूल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: תִּלְּגַת פִּלְנֶסֶר
  choice: तिलगत-पिलनेसेर
  rationale: यह रूप इतिहास की पुस्तक में आए इब्रानी नाम की ध्वनि और वर्तनी के निकट है।
- source_word: וַיַּגְלֵם
  choice: बंदी बनाकर निर्वासन में भेज दिया
  rationale: हिफ़ील रूप का आशय लोगों को उनके देश से निकालकर निर्वासन में ले जाना है। यह हिंदी अभिव्यक्ति जबरन विस्थापन को स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: לָראוּבֵנִי וְלַגָּדִי
  choice: रूबेनियों, गादियों
  rationale: इब्रानी जातिवाचक रूपों के लिए प्रचलित और सहज हिंदी बहुवचन।
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र
  rationale: यह यरदन-पार बसे मनश्शे के आधे गोत्र का स्पष्ट और सीधा अनुवाद है।
- source_word: וַיְבִיאֵם
  choice: उन्हें ... ले आया
  rationale: בוא के हिफ़ील का सीधा अर्थ ‘लाना’ है; निर्वासन के गंतव्यों के साथ ‘ले आया’ स्वाभाविक हिंदी है।
- source_word: לַחְלַח וְחָבוֹר וְהָרָא וּנְהַר גּוֹזָן
  choice: हलह, हाबोर, हारा और गोजान नदी के पास
  rationale: स्थान-नामों का लिप्यंतरण किया गया है। ‘गोजान नदी के पास’ हिंदी में गंतव्य और भौगोलिक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: वे आज तक वहीं हैं
  rationale: इब्रानी मुहावरे का अर्थ पाठकों के वर्तमान तक उनके वहाँ बने रहने से है; पूर्ण हिंदी वाक्य संदर्भित लोगों और स्थान को स्पष्ट करता है।
theological_decisions:
- issue: पूल और तिलगत-पिलनेसेर का परस्पर संबंध
  choice: मुख्य पाठ में ‘अर्थात्’ द्वारा दोनों को एक ही अश्शूरी राजा के दो नामों के रूप में प्रस्तुत किया गया।
  alternative: 'दो अलग शासकों के रूप में पढ़ना: ‘पूल ... की आत्मा और तिलगत-पिलनेसेर ... की आत्मा।’'
  rationale: ऐतिहासिक रूप से पूल की पहचान प्रायः तिलगत-पिलनेसेर तृतीय से की जाती है, पर इब्रानी में ‘आत्मा’ और राजकीय उपाधि की पुनरावृत्ति समन्वयी पाठ की भी अनुमति देती है। इसलिए मुख्य पाठ में संभावित समानता दी गई और वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। पारंपरिक बाइबलीय नाम-रूपों के निकट देवनागरी लिप्यंतरण रखा गया है।
