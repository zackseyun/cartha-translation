  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹלֶד / הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: हिफ़ील वंशावली-सूत्र संतानोत्पत्ति अथवा वंश-संबंध व्यक्त करता है। हिंदी में ‘से … उत्पन्न हुआ’ स्वाभाविक और गरिमापूर्ण है तथा दोनों क्रियाओं का एकरूप अनुवाद करता है।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אֵת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है; हिंदी वाक्य-विन्यास में इसका स्वतंत्र समतुल्य आवश्यक नहीं।
- source_word: אֲמַרְיָה
  choice: अमर्याह
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट और दोनों स्थानों पर एकरूप लिप्यंतरण।
- source_word: אֲחִיטוּב
  choice: अहीतूब
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
theological_decisions:
