  choice: ‘से … उत्पन्न हुआ’ द्वारा वंश-संबंध व्यक्त किया गया
  alternative: ‘का पिता बना’ या ‘को जन्म दिया’
  rationale: हिब्रू वंशावली-सूत्र पुरुष पूर्वज और वंशज का संबंध बताता है। चुना हुआ हिंदी रूप जैविक मातृत्व का भ्रम उत्पन्न किए बिना स्रोत का वंशगत आशय सुरक्षित रखता है।
