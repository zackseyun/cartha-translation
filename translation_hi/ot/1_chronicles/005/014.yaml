  text: אֵ֣לֶּה בְּנֵ֣י אֲבִיחַ֗יִל בֶּן חוּרִ֡י בֶּן יָ֠רוֹחַ בֶּן גִּלְעָ֧ד בֶּן מִיכָאֵ֛ל בֶּן יְשִׁישַׁ֥י בֶּן יַחְדּ֖וֹ בֶּן בּֽוּז׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/014.yaml
  text: These were the sons of Abihail son of Huri[a], son of Jaroah, son of Gilead, son of Michael, son of Jeshishai, son of Jahdo, son of Buz.
translation:
  language: hi
  text: ये अबीहैल के पुत्र थे—अबीहैल, हूरी का पुत्र; हूरी, यारोह का पुत्र; यारोह, गिलाद का पुत्र; गिलाद, मीकाएल का पुत्र; मीकाएल, यशीशै का पुत्र; यशीशै, यहदो का पुत्र; और यहदो, बूज़ का पुत्र था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘पुत्र’ और बार-बार ‘का पुत्र’ वंशावली की पारिवारिक पंक्ति को सूचित कर सकते हैं; हर पीढ़ी का स्पष्ट रूप से सूचीबद्ध होना आवश्यक नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... थे
  rationale: बहुवचन संकेतवाचक शब्द वंशावली की सूची प्रस्तुत करता है; हिन्दी कथात्मक संदर्भ में भूतकाल स्वाभाविक है।
- source_word: בְּנֵי
  choice: वंशज
  rationale: शाब्दिक अर्थ ‘पुत्र’ है, पर इसके बाद केवल एक वंश-श्रृंखला दी गई है; वंशावली के सामूहिक अर्थ को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करने के लिए ‘वंशज’ चुना गया।
- source_word: בֶּן
  choice: का पुत्र था
  rationale: वंशावली की प्रत्येक कड़ी में एकवचन संबंधसूचक सूत्र को स्पष्ट रूप से रखा गया है; इससे इब्रानी की दोहराई गई संरचना बनी रहती है।
- source_word: אֲבִיחַיִל
  choice: अबीहैल
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: חוּרִי
  choice: हूरी
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: יָרוֹחַ
  choice: यारोह
  rationale: अंतिम ח को पठनीय हिन्दी रूप में ‘ह’ से दर्शाते हुए इब्रानी स्वर-रूप के निकट लिप्यंतरण।
- source_word: גִּלְעָד
  choice: गिलाद
  rationale: इब्रानी व्यक्तिनाम का प्रचलित और स्रोत-सन्निकट हिन्दी रूप।
- source_word: מִיכָאֵל
  choice: मीकाएल
  rationale: नाम के इब्रानी ध्वन्यात्मक रूप को बनाए रखने वाला लिप्यंतरण।
- source_word: יְשִׁישַׁי
  choice: यशीशै
  rationale: इब्रानी व्यंजन और अंतिम द्विस्वर के निकट देवनागरी लिप्यंतरण।
- source_word: יַחְדּוֹ
  choice: यहदो
  rationale: नाम के व्यंजन-क्रम और स्वरों को पठनीय आधुनिक हिन्दी में दर्शाया गया है।
- source_word: בּוּז
  choice: बूज़
  rationale: दीर्घ ऊ और अंतिम ז की ध्वनि को स्पष्ट रखने वाला लिप्यंतरण।
theological_decisions:
- issue: בְּנֵי का वंशावलीगत विस्तार
  choice: मुख्य पाठ में ‘वंशज’
  alternative: ‘पुत्र’
  rationale: इब्रानी बहुवचन शब्द का मूल अर्थ ‘पुत्र’ है, किंतु यहाँ आगे एक ही नाम से आरंभ वंश-श्रृंखला दी जाती है। ‘वंशज’ पाठ के वंशावलीगत कार्य को व्यक्त करता है, बिना यह मानने के कि हर पीढ़ी अनिवार्यतः सूचीबद्ध है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। नाम स्रोत-इब्रानी के निकट लिप्यंतरित हैं। लंबी ‘का पुत्र’ शृंखला को अलग-अलग उपवाक्यों में खोलकर अर्थ स्पष्ट किया गया है, जबकि वंशक्रम यथावत रखा गया है।
