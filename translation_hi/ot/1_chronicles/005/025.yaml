  text: וַ/יִּֽמְעֲל֔וּ בֵּ/אלֹהֵ֖י אֲבוֹתֵי/הֶ֑ם וַ/יִּזְנ֗וּ אַחֲרֵי֙ אֱלֹהֵ֣י עַמֵּי הָ/אָ֔רֶץ אֲשֶׁר הִשְׁמִ֥יד אֱלֹהִ֖ים מִ/פְּנֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/025.yaml
  text: But they acted unfaithfully against the God of their fathers and prostituted themselves after the gods of the peoples of the land[b][a], whom God had destroyed before them.
translation:
  language: hi
  text: पर वे अपने पूर्वजों के परमेश्वर के प्रति विश्वासघाती हुए और उस देश के जिन लोगों को परमेश्वर ने उनके सामने से नष्ट कर दिया था, उनके देवताओं के पीछे व्यभिचार करने लगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְעֲלוּ
  choice: विश्वासघाती हुए
  rationale: मूल क्रिया धार्मिक और वाचा-संबंधी निष्ठा भंग करने को व्यक्त करती है; यह चुनाव केवल सामान्य अवज्ञा नहीं, बल्कि संबंध में किए गए विश्वासघात को सामने लाता है।
- source_word: בֵּאלֹהֵי אֲבוֹתֵיהֶם
  choice: अपने पुरखाओं के परमेश्वर के प्रति
  rationale: מעל के साथ ב उस पक्ष को चिह्नित करता है जिसके प्रति विश्वासघात किया गया। ‘के प्रति’ आधुनिक हिन्दी में स्वाभाविक है और संबंधगत अर्थ स्पष्ट करता है।
- source_word: וַיִּזְנוּ אַחֲרֵי
  choice: के पीछे व्यभिचार करने लगे
  rationale: זנה मूर्तिपूजा के लिए जानबूझकर प्रयुक्त यौन रूपक है और אַחֲרֵי किसी के पीछे जाने का भाव रखता है। यह वाक्यांश रूपक और पीछा करने—दोनों को बनाए रखता है।
- source_word: אֱלֹהֵי עַמֵּי הָאָרֶץ
  choice: उस देश के लोगों के देवताओं
  rationale: रचना में ‘देश के लोग’ स्थानीय जनसमुदायों को और बहुवचन ‘देवताओं’ उनके पूज्य देवों को सीधे व्यक्त करता है।
- source_word: אֲשֶׁר הִשְׁמִיד אֱלֹהִים מִפְּנֵיהֶם
  choice: उन लोगों के पीछे, जिन्हें परमेश्वर ने उनके सामने से नष्ट कर दिया था
  rationale: संदर्भ में संबंधवाचक उपवाक्य देवताओं के बजाय देश के लोगों को सूचित करता है। एकवचन क्रिया के कारण אֱלֹהִים यहाँ एक परमेश्वर है; ‘सामने से’ מִפְּנֵיהֶם का स्थानगत भाव बनाए रखता है। पुनरुक्ति हिन्दी में दूरस्थ पूर्वपद को स्पष्ट करती है।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन रूपक बनाए रखना
  choice: देवताओं के पीछे व्यभिचार करने लगे
  alternative: देवताओं के पीछे चलकर परमेश्वर से विश्वासघात किया
  rationale: मूल पाठ זנה के तीखे यौन और वाचा-संबंधी रूपक को जानबूझकर इस्तेमाल करता है। इसे सामान्य ‘भटकने’ या ‘अविश्वासयोग्य होने’ में बदलना मूल की धार्मिक तीव्रता को घटा देता।
- issue: संबंधवाचक उपवाक्य का पूर्वपद
  choice: परमेश्वर ने देश के लोगों को नष्ट किया
  alternative: परमेश्वर ने उनके देवताओं को नष्ट किया
  rationale: व्याकरणतः संबंधवाचक אֲשֶׁר संख्या स्पष्ट नहीं करता, पर निकट व्यापक संदर्भ और ‘उनके सामने से’ देश के लोगों को पूर्वपद मानने का समर्थन करते हैं। हिन्दी में ‘उन लोगों’ की पुनरावृत्ति इस संदर्भगत अर्थ को स्पष्ट करती है।
- issue: अंतिम אֱלֹהִים की संख्या
  choice: परमेश्वर
  alternative: देवताओं
  rationale: इसके साथ एकवचन क्रिया הִשְׁמִיד है, इसलिए यहाँ इस्राएल के एक परमेश्वर का उल्लेख है, न कि अनेक देवताओं का।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘पुरखाओं’ पारिवारिक-ऐतिहासिक संबंध को सहज हिन्दी में व्यक्त करता है। ‘व्यभिचार’ तीखा है, पर मूल पाठ की जानबूझकर प्रयुक्त वाचा-संबंधी यौन छवि के कारण इसे नरम नहीं किया गया।
