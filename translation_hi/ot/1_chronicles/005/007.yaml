base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/007.yaml
  text: 'And his brothers by their clans[a], in the genealogy of their generations: the chief was Jeiel, and Zechariah.'
translation:
  language: hi
  text: और उसके भाई, अपने-अपने कुलों के अनुसार, जब वे अपनी पीढ़ियों के अनुसार वंशावली में दर्ज किए गए[a]—तब प्रधान यीएल और जकर्याह थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब उनका वंशावली-पंजीकरण उनकी पीढ़ियों के अनुसार किया गया।”
    reason: इब्रानी पदबंध को ‘वंशावली में दर्ज किए गए’ या अधिक संज्ञात्मक रूप से ‘वंशावली-पंजीकरण किया गया’ समझा जा सकता है।
lexical_decisions:
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: אָח का सीधा अर्थ ‘भाई’ है; वंशावली के संदर्भ में इसमें निकट पुरुष संबंधी भी सम्मिलित हो सकते हैं, पर पाठ की अस्पष्टता बनाए रखने के लिए ‘भाई’ रखा गया है।
- source_word: לְמִשְׁפְּחֹתָיו
  choice: अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ घरेलू परिवार नहीं, बल्कि गोत्र के भीतर का कुल है। एकवचन प्रत्यय के बावजूद सामूहिक-वितरणात्मक अर्थ को स्वाभाविक हिन्दी में ‘अपने-अपने’ से व्यक्त किया गया है।
- source_word: בְּהִתְיַחֵשׂ
  choice: जब ... वंशावली में ... नाम दर्ज किया गया था
  rationale: इतिहास-वृत्तांत में יחס का हित्पएल रूप वंश के आधार पर पंजीकरण या नाम दर्ज किए जाने को दर्शाता है। कालवाचक उपवाक्य हिन्दी में इसका स्वाभाविक अर्थ देता है।
- source_word: לְתֹלְדוֹתָם
  choice: अपनी पीढ़ियों के अनुसार
  rationale: תּוֹלְדוֹת वंश की पीढ़ियों अथवा वंशक्रम के अभिलेख को सूचित करता है; ‘पीढ़ियों के अनुसार’ मूल अभिव्यक्ति को निकटता से रखता है।
- source_word: הָרֹאשׁ
  choice: प्रधान
  rationale: רֹאשׁ यहाँ शारीरिक ‘सिर’ नहीं, समूह के मुखिया या प्रमुख व्यक्ति का पद बताता है; ‘प्रधान’ संक्षिप्त और गरिमापूर्ण है।
- source_word: יְעִיאֵל
  choice: यीएल
  rationale: इब्रानी नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וּזְכַרְיָהוּ
  choice: और जकर्याह
  rationale: नाम के इब्रानी रूप זְכַרְיָהוּ का प्रचलित हिन्दी बाइबलीय रूप ‘जकर्याह’ रखा गया है।
