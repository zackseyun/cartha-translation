  text: अही, अब्दीएल का पुत्र, गूनी का पुत्र, उनके पितृकुल का मुखिया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִי
  choice: अही
  rationale: व्यक्तिवाचक नाम को आधुनिक हिन्दी में स्रोत के उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: בֶּן עַבְדִּיאֵל בֶּן גּוּנִי
  choice: अब्दीएल का पुत्र और गूनी का पोता
  rationale: 'लगातार आए वंशावली-सूचक בֶּן को स्वाभाविक हिन्दी में स्पष्ट किया गया है: अही अब्दीएल का पुत्र और गूनी का पोता था। यद्यपि בֶּן कभी व्यापक अर्थ में ‘वंशज’ भी हो सकता है, यहाँ सीधी वंशावली सबसे स्वाभाविक है।'
- source_word: רֹאשׁ
  choice: मुखिया
  rationale: यहाँ शब्द का अर्थ किसी समूह का प्रधान या अगुआ है; ‘मुखिया’ स्रोत के ‘सिर/प्रधान’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְבֵית אֲבוֹתָם
  choice: उनके पितृकुलों का
  rationale: בית אבות वंशाधारित पैतृक कुल अथवा घराने की तकनीकी अभिव्यक्ति है। ‘पितृकुलों’ बहुवचन सामुदायिक संरचना और पैतृक संबंध दोनों को संक्षेप में बनाए रखता है।
