base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/024.yaml
  text: 'These were the heads of their fathers’ houses: Epher[a], Ishi, Eliel, Azriel, Jeremiah, Hodaviah, and Jahdiel, mighty men of valor, men of renown[b], heads of their fathers’ houses.'
translation:
  language: hi
  text: ये उनके पितृकुलों के मुखिया थे:[a] एपेर, यिशी, एलीएल, अज़्रीएल, यिर्मयाह, होदव्याह और यहदीएल। वे पराक्रमी योद्धा और प्रतिष्ठित पुरुष[b] थे और अपने पितृकुलों के मुखिया थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति का अर्थ ऐसे कुल-आधारित पारिवारिक समूह हैं जो एक साझे पुरुष पूर्वज से जुड़े होते थे।
    reason: cultural_note
  - marker: b
    text: शाब्दिक अर्थ ‘नाम वाले पुरुष’ है, अर्थात प्रसिद्ध या विशिष्ट प्रतिष्ठा वाले पुरुष।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये ... थे
  rationale: वंशावली की सूची का स्वाभाविक हिन्दी परिचय; आरम्भिक संयोजक וְ को अलग से ‘और’ कहने के बजाय हिन्दी वाक्य-रचना में समाहित किया गया है।
- source_word: רָאשֵׁי בֵית אֲבוֹתָם
  choice: उनके पितृकुलों के मुखिया
  rationale: ‘पितृकुल’ एक साझे पुरुष पूर्वज से जुड़े कुल-आधारित पारिवारिक समूह को संक्षेप और स्पष्ट रूप से व्यक्त करता है; ‘मुखिया’ नेतृत्व की भूमिका बताता है।
- source_word: עֵפֶר
  choice: एपेर
  rationale: इब्रानी व्यंजन और उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: יִשְׁעִי
  choice: यिशई
  rationale: नाम का इब्रानी रूप देवनागरी में यथासंभव सुरक्षित रखा गया है।
- source_word: אֱלִיאֵל
  choice: एलीएल
  rationale: इब्रानी व्यक्तिगत नाम का सुबोध देवनागरी लिप्यंतरण।
- source_word: עַזְרִיאֵל
  choice: अज़्रीएल
  rationale: इब्रानी नाम की ध्वनि और उसके घटकों को निकटता से दर्शाने वाला रूप।
- source_word: יִרְמְיָה
  choice: यिर्मयाह
  rationale: नाम के इस संक्षिप्त इब्रानी रूप को प्रचलित और स्रोत-सन्निकट हिन्दी वर्तनी में प्रस्तुत किया गया है।
- source_word: הוֹדַוְיָה
  choice: होदव्याह
  rationale: पाठ में प्राप्त नाम के व्यंजनों और स्वर-संरचना का निकट लिप्यंतरण।
- source_word: יַחְדִּיאֵל
  choice: यहदीएल
  rationale: इब्रानी नाम का स्रोत-सन्निकट और हिन्दी में पठनीय लिप्यंतरण।
- source_word: אֲנָשִׁים גִּבּוֹרֵי חַיִל
  choice: पराक्रमी योद्धा
  rationale: यह पद शक्ति, साहस और युद्ध-कुशलता वाले पुरुषों को सूचित करता है; ‘पराक्रमी योद्धा’ आधुनिक हिन्दी में इसका स्वाभाविक और सशक्त रूप है।
- source_word: אַנְשֵׁי שֵׁמוֹת
  choice: प्रतिष्ठित पुरुष
  rationale: शाब्दिक ‘नाम वाले पुरुष’ एक मुहावरा है, जिसका आशय प्रसिद्ध अथवा विशिष्ट प्रतिष्ठा रखने वाले पुरुषों से है।
- source_word: רָאשִׁים לְבֵית אֲבוֹתָם
  choice: अपने पितृकुलों के मुखिया
  rationale: मूल पाठ अन्त में उनकी कुलगत नेतृत्व-स्थिति दोहराता है; अनुवाद में इस पुनरुक्ति को बनाए रखा गया है।
