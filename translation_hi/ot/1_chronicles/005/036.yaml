base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/036.yaml
  text: And Johanan fathered Azariah[a]; he was the one who served as priest in the house that Solomon built in Jerusalem.
translation:
  language: hi
  text: और योहानान से अजर्याह उत्पन्न हुआ; वही उस भवन[a] में याजक के रूप में सेवा करता था, जिसे सुलैमान ने यरूशलेम में बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंदिर में”; इब्रानी में “भवन में” है, जो मंदिर के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יוֹחָנָן
  choice: और योहानान
  rationale: आरंभिक ו को वंशावली की क्रमबद्ध कड़ी दिखाने के लिए ‘और’ से व्यक्त किया गया है; नाम का प्रचलित हिन्दी लिप्यंतरण ‘योहानान’ रखा गया है।
- source_word: הוֹלִיד אֶת עֲזַרְיָה
  choice: से अजर्याह उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने का अर्थ देता है। हिन्दी की स्वाभाविक वंशावली-शैली में ‘से ... उत्पन्न हुआ’ पुरुष वंश-संबंध को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הוּא אֲשֶׁר
  choice: वही
  rationale: सर्वनाम की बलाघाती पहचान को संक्षिप्त और स्वाभाविक हिन्दी में ‘वही’ सुरक्षित रखता है।
- source_word: כִּהֵן
  choice: याजक के रूप में सेवा करता था
  rationale: क्रिया केवल पद धारण करना नहीं, याजकीय कार्य करना बताती है; इसलिए ‘सेवा करता था’ उसके क्रियात्मक बल को बनाए रखता है।
- source_word: בַּ/בַּיִת
  choice: उस भवन में
  rationale: मूल शब्द का शाब्दिक अर्थ ‘घर/भवन’ है। संदर्भ में यह मन्दिर है, पर मुख्य पाठ में स्रोत की शब्दावली बनाए रखने के लिए ‘भवन’ चुना गया है और अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: אֲשֶׁר בָּנָה שְׁלֹמֹה
  choice: जिसे सुलैमान ने ... बनवाया था
  rationale: राजकीय निर्माण के लिए स्वाभाविक हिन्दी में ‘बनवाया’ प्रयुक्त है; यह सुलैमान को निर्माण का उत्तरदायी बताता है, बिना यह संकेत दिए कि उसने स्वयं शारीरिक रूप से भवन बनाया।
- source_word: בִּ/ירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक पूर्वसर्ग और स्थान-नाम का मानक हिन्दी रूप सुरक्षित रखा गया है।
