lexical_decisions:
- source_word: מְרָיוֹת
  choice: मरायोत
  rationale: व्यक्तिवाचक नाम का अनुवाद करने के बजाय उसके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में यह हिफ़ील रूप पितृवंशीय उत्पत्ति को व्यक्त करता है। हिंदी में ‘से … उत्पन्न हुआ’ स्वाभाविक और गरिमापूर्ण है तथा पुराने या असहज ‘जन्माया’ से बचता है।
- source_word: אֵת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म का सूचक है; हिंदी में इसका कोई स्वतंत्र शाब्दिक समकक्ष आवश्यक नहीं है।
- source_word: אֲמַרְיָה
  choice: अमर्याह
  rationale: इब्रानी नाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण। अंतिम ‘याह’ नाम में उपस्थित दिव्य-नाम संबंधी तत्व को बनाए रखता है।
- source_word: וַ/אֲמַרְיָה
  choice: और अमर्याह
  rationale: वाव संयोजक को सरल ‘और’ से व्यक्त किया गया है; नाम का लिप्यंतरण यथावत रखा गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: दोहराए गए वंशावली-क्रियापद को पहले प्रयोग के समान रखा गया है, जिससे लय और अर्थ की संगति बनी रहती है।
- source_word: אֲחִיטוּב
  choice: अहीतूब
  rationale: इब्रानी व्यक्तिवाचक नाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
