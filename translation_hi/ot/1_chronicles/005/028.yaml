  text: וּ/בְנֵ֖י קְהָ֑ת עַמְרָ֣ם יִצְהָ֔ר וְ/חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/028.yaml
  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: hi
  text: 'और कहात के पुत्र ये थे: अम्राम, यिसहार, हेब्रोन और उज्जीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र ये थे
  rationale: ו genealogical sequence को ‘और’ से आगे बढ़ाता है। Construct בְנֵי को इस प्रत्यक्ष वंशावली में ‘के पुत्र’ कहा गया है; सहज हिन्दी वाक्य के लिए ‘ये थे’ जोड़ा गया है।
- source_word: קְהָת
  choice: कहात
  rationale: इब्रानी नाम का हिन्दी बाइबल-परंपरा में प्रचलित और स्रोत के निकट लिप्यंतरण।
- source_word: עַמְרָם
  choice: अम्राम
  rationale: व्यक्तिनाम का स्रोत-संगत देवनागरी लिप्यंतरण।
- source_word: יִצְהָר
  choice: यिसहार
  rationale: व्यक्तिनाम में आरंभिक yod और मध्य ṣade को क्रमशः ‘य’ और ‘स’ द्वारा दर्शाने वाला पठनीय हिन्दी लिप्यंतरण।
- source_word: וְ/חֶבְרוֹן
  choice: हेब्रोन
  rationale: यहाँ वंशावली के कारण स्थान नहीं, व्यक्तिनाम है। उपसर्गित conjunction को हिन्दी सूची के अंतिम ‘और’ में स्वाभाविक रूप से समाहित किया गया है।
- source_word: וְ/עֻזִּיאֵל
  choice: और उज्जीएल
  rationale: अंतिम सूची-पद का conjunction स्पष्ट रूप से ‘और’ है; doubled zayin को ‘ज्ज’ और ईश्वरीय नाम-तत्व को ‘एल’ के रूप में रखा गया है।
