translation:
  language: hi
  text: अहीतूब सादोक का पिता हुआ, और सादोक शल्लूम का पिता हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִיטוּב
  choice: अहीतूब
  rationale: व्यक्तिवाचक नाम को आधुनिक मानक हिन्दी में प्रचलित बाइबलीय ध्वन्यंतरण के अनुसार रखा गया है। आरम्भिक संयोजक वाव को अलग से व्यक्त नहीं किया गया, क्योंकि हिन्दी में वंशावली की इस कड़ी का आरम्भ बिना ‘और’ के अधिक स्वाभाविक है।
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: यलद के हिफ़ील रूप का वंशावली-संदर्भ में अर्थ ‘पिता होना/उत्पन्न करना’ है। ‘का पिता हुआ’ आधुनिक हिन्दी में स्वाभाविक है और जैविक वंश-संबंध को स्पष्ट रखता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसका कोई स्वतंत्र शब्द-समानार्थी नहीं है और इसका व्याकरणिक कार्य वाक्य-विन्यास से व्यक्त होता है।
- source_word: צָדוֹק
  choice: सादोक
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी ध्वन्यंतरण।
- source_word: וְ/צָדוֹק
  choice: और सादोक
  rationale: संयोजक वाव को ‘और’ से व्यक्त किया गया है, जिससे वंशावली की अगली कड़ी जुड़ती है।
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: दोहराए गए वंशावली-क्रिया रूप का एकरूप और स्वाभाविक हिन्दी अनुवाद।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: हिब्रू व्यंजन-द्वित्व और दीर्घ स्वर को ध्यान में रखते हुए व्यक्तिवाचक नाम का हिन्दी ध्वन्यंतरण।
