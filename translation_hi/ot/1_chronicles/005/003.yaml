base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/003.yaml
  text: 'The sons of Reuben, the firstborn of Israel: Hanoch, Pallu, Hezron, and Carmi.'
translation:
  language: hi
  text: 'इस्राएल के पहलौठे रूबेन के पुत्र ये थे: हनोक, पल्लू, हेस्रोन और कर्मी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: वंशावली की इस सूची में בְּנֵי सीधे रूबेन के पुरुष पुत्रों को सूचित करता है; इसलिए ‘पुत्र’ व्यापक ‘वंशज’ से अधिक सटीक है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: इब्रानी व्यक्ति-नाम का हिन्दी बाइबल परंपरा के अनुरूप लिप्यंतरण।
- source_word: בְּכוֹר יִשְׂרָאֵל
  choice: इस्राएल के पहलौठे
  rationale: यह संबंधवाचक पद रूबेन को इस्राएल का पहलौठा बताता है। ‘पहलौठा’ ज्येष्ठ पुत्र होने की मूल धारणा को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: חֲנוֹךְ
  choice: हनोक
  rationale: इब्रानी व्यक्ति-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: פַלּוּא
  choice: पल्लू
  rationale: इब्रानी व्यक्ति-नाम פַלּוּא का ध्वन्यात्मक और प्रचलित हिन्दी लिप्यंतरण।
- source_word: חֶצְרוֹן
  choice: हेस्रोन
  rationale: इब्रानी व्यक्ति-नाम का लिप्यंतरण; צ को यहाँ प्रचलित हिन्दी बाइबलीय रूप के अनुसार ‘स’ से दर्शाया गया है।
- source_word: כַרְמִי
  choice: कर्मी
  rationale: इब्रानी व्यक्ति-नाम का हिन्दी लिप्यंतरण; इसका अर्थानुवाद नहीं किया गया है।
