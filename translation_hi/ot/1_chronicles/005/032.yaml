  text: उज्जी का पुत्र जरहयाह था, और जरहयाह का पुत्र मरायोत था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עֻזִּי
  choice: उज्जी
  rationale: व्यक्तिनाम को अनुवादित करने के बजाय हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया; आरंभिक וְ वंशावली की पूर्व कड़ी से इसे जोड़ता है, पर स्वतंत्र पद के सहज हिन्दी आरंभ में अलग से व्यक्त नहीं किया गया।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: हिफ़ील रूप ילד वंशावली में जन्म देने अथवा वंश उत्पन्न करने का बोध देता है। हिन्दी की वंशावली-शैली में यह प्रयोग स्वाभाविक, संक्षिप्त और गरिमापूर्ण है तथा अनावश्यक रूप से प्रत्यक्ष पिता-पुत्र संबंध को कठोर नहीं बनाता।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है; हिन्दी में इसका पृथक समानार्थी नहीं है और अर्थ सामान्य वाक्य-विन्यास से व्यक्त होता है।
- source_word: זְרַחְיָה
  choice: जरहयाह
  rationale: हिब्रू व्यक्तिनाम זְרַחְיָה को उसके व्यंजन और याह-प्रत्यय के निकट देवनागरी में लिप्यंतरित किया गया।
- source_word: וּֽ/זְרַֽחְיָה
  choice: और जरहयाह
  rationale: संयोजक וּ को ‘और’ से व्यक्त करके वंशावली की श्रृंखला और दोहराए गए नाम को सुरक्षित रखा गया।
- source_word: מְרָיֽוֹת
  choice: मरायोत
  rationale: हिब्रू व्यक्तिनाम को उसके मासोरेटिक स्वरांकन के निकट देवनागरी में लिप्यंतरित किया गया।
