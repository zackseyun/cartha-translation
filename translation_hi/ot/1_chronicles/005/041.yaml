source:
  edition: WLC
  text: וִ/יהוֹצָדָ֣ק הָלַ֔ךְ בְּ/הַגְל֣וֹת יְהוָ֔ה אֶת יְהוּדָ֖ה וִ/ירוּשָׁלִָ֑ם בְּ/יַ֖ד נְבֻכַדְנֶאצַּֽר־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/041.yaml
  text: And Jehozadak went away when Yahweh sent Judah and Jerusalem into exile by the hand of Nebuchadnezzar[a].
translation:
  language: hi
  text: और यहोसादाक उस समय चला गया, जब याहवे ने यहूदा और यरूशलेम को नबूकदनेस्सर के हाथ से निर्वासन में भेजा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दानुसार: “और यहोसादाक तब गया, जब याहवे ने यहूदा और यरूशलेम को नबूकदनेस्सर के हाथ से निर्वासित किया।”'
    reason: शब्दार्थ का अधिक औपचारिक विकल्प
lexical_decisions:
- source_word: וִ/יהוֹצָדָק
  choice: और यहोसादाक
  rationale: नाम के पूर्ण इब्रानी रूप को हिन्दी में स्वाभाविक लिप्यंतरण से रखा गया है और आरम्भिक संयोजक וִ को ‘और’ से व्यक्त किया गया है।
- source_word: הָלַךְ
  choice: चला गया
  rationale: הלך का मूल अर्थ ‘जाना’ है। निर्वासन के प्रसंग में ‘चला गया’ स्थान से दूर जाने का भाव स्वाभाविक ढंग से देता है, पर यह नहीं जोड़ता कि उसने घटना की पहल की।
- source_word: בְּ/הַגְלוֹת
  choice: उस समय ... निर्वासन में भेजा
  rationale: בְ के साथ infinitive construct यहाँ समयसूचक है। हिन्दी में सीमित क्रिया वाला यह रूप अर्थ को स्पष्ट और सहज रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֶת יְהוּדָה וִ/ירוּשָׁלָם
  choice: यहूदा और यरूशलेम को
  rationale: मूल पाठ सीधे राज्य/प्रदेश और नगर के नाम लेता है; ‘लोगों’ जैसा व्याख्यात्मक शब्द नहीं जोड़ा गया।
- source_word: בְּ/יַד
  choice: के हाथ से
  rationale: यह इब्रानी मुहावरा साधन अथवा माध्यम को दर्शाता है। हिन्दी में ‘के हाथ से’ वही बाइबलीय मुहावरा बनाए रखते हुए नबूकदनेस्सर की माध्यमिक भूमिका बताता है।
- source_word: נְבֻכַדְנֶאצַּר
  choice: नबूकदनेस्सर
  rationale: बाबुल के राजा के नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण अपनाया गया है।
theological_decisions:
- issue: निर्वासन में परमेश्वर और मनुष्य की भूमिका
  choice: याहवे निर्वासन कराने वाला कर्ता है और नबूकदनेस्सर उसका मानवीय माध्यम है।
  alternative: नबूकदनेस्सर को ही निर्वासन का एकमात्र प्रभावी कर्ता समझना।
  rationale: वाक्य-विन्यास में याहवे निर्वासन की क्रिया का कर्ता है, जबकि ‘नबूकदनेस्सर के हाथ से’ माध्यम को चिह्नित करता है। अनुवाद इस तनाव को बिना घटाए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण शैली रखी गई है। ‘निर्वासन’ सामान्य आधुनिक पाठक के लिए ‘बँधुआई’ से अधिक स्पष्ट है; फिर भी ‘के हाथ से’ मूल का अर्थपूर्ण बाइबलीय मुहावरा सुरक्षित रखता है।
