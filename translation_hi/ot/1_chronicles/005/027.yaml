lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन रूप है। वंशावलियों में इसका अर्थ कभी-कभी व्यापक रूप से ‘वंशज’ हो सकता है, पर यहाँ लेवी के तीन प्रत्यक्ष पुत्रों के नाम दिए गए हैं; इसलिए ‘पुत्र’ सबसे स्वाभाविक और पारदर्शी है।
- source_word: לֵוִי
  choice: लेवी
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: גֵּרְשׁוֹן
  choice: गेर्शोन
  rationale: इब्रानी रूप גֵּרְשׁוֹן का लिप्यंतरण; इसे अन्यत्र मिलने वाले संबंधित पर भिन्न नाम ‘गेर्शोम’ से अलग रखा गया है।
- source_word: קְהָת
  choice: कहात
  rationale: इब्रानी व्यक्तिवाचक नाम קְהָת का हिन्दी में प्रचलित और सुबोध लिप्यंतरण।
- source_word: מְרָרִי
  choice: मरारी
  rationale: इब्रानी व्यक्तिवाचक नाम מְרָרִי का हिन्दी लिप्यंतरण।
- source_word: וּ
  choice: और
  rationale: सूची के अंतिम नाम को जोड़ने वाला साधारण समुच्चयबोधक।
