base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/013.yaml
  text: 'And their brothers[a], according to their fathers’ houses: Michael, Meshullam, Sheba, Jorai, Jachan, Zia[d][c][b], and Eber—seven.'
translation:
  language: hi
  text: 'और उनके भाई[a], अपने-अपने पितृकुलों[b] के अनुसार, ये थे: मीकाएल, मशुल्लाम, शेबा, योरै, याकान, ज़ीआ और एबेर—कुल सात।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कुल-संबंधी”; वंशावली के प्रसंग में इब्रानी शब्द का अर्थ निकट संबंधी या एक ही कुल के सदस्य भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पैतृक घरानों या कुलों के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: अर्थ की निकटतम अभिव्यक्ति ‘उनके भाई’ है; वंशावली के प्रसंग में यह शब्द व्यापक कुल-संबंधियों को भी सूचित कर सकता है, इसलिए उस संभावना को टिप्पणी में रखा गया है।
- source_word: לְבֵית אֲבוֹתֵיהֶם
  choice: अपने-अपने पितृकुलों के अनुसार
  rationale: यह पदबंध पैतृक घराने या कुल के आधार पर वंश-विभाजन बताता है। ‘पितृकुल’ मूल सामाजिक संरचना को संक्षेप और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: מִיכָאֵל וּמְשֻׁלָּם וְשֶׁבַע וְיוֹרַי וְיַעְכָּן וְזִיעַ וָעֵבֶר
  choice: मीकाएल, मशुल्लाम, शेबा, योरै, याकान, ज़ीआ और एबेर
  rationale: व्यक्तिनामों का मसोरेटिक स्वरांकन के निकट, हिंदी-पठनीय देवनागरी लिप्यंतरण किया गया है।
- source_word: שִׁבְעָה
  choice: कुल सात
  rationale: यह संख्या सूचीबद्ध व्यक्तियों की कुल संख्या का सार देती है; ‘कुल’ हिंदी में उसके सारात्मक बल को स्पष्ट करता है।
