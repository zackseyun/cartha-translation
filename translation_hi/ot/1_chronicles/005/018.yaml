source:
  edition: WLC
  text: בְּנֵֽי רְאוּבֵ֨ן וְ/גָדִ֜י וַ/חֲצִ֥י שֵֽׁבֶט מְנַשֶּׁה֮ מִן בְּנֵי חַיִל֒ אֲ֠נָשִׁים נֹשְׂאֵ֨י מָגֵ֤ן וְ/חֶ֨רֶב֙ וְ/דֹ֣רְכֵי קֶ֔שֶׁת וּ/לְמוּדֵ֖י מִלְחָמָ֑ה אַרְבָּעִ֨ים וְ/אַרְבָּעָ֥ה אֶ֛לֶף וּ/שְׁבַע מֵא֥וֹת וְ/שִׁשִּׁ֖ים יֹצְאֵ֥י צָבָֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/018.yaml
  text: The sons of Reuben and the Gadites and the half-tribe of Manasseh[a], valiant men, men who carried shield and sword, who drew the bow, and who were trained for war, were forty-four thousand seven hundred sixty[c][b], able to go out to war.
translation:
  language: hi
  text: रूबेन के वंशज, गाद के लोग और मनश्शे के आधे गोत्र के लोग—वीर पुरुष, जो ढाल और तलवार धारण करते, धनुष खींचते[a] और युद्ध के लिए प्रशिक्षित थे—44,760 थे, जो सैन्य अभियान पर जाने के योग्य[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘धनुष को रौंदते/मोड़ते’ है—यह धनुष खींचकर चलाने के लिए तैयार करने का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: या ‘सैन्य सेवा के योग्य’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי רְאוּבֵן
  choice: रूबेन के वंशजों
  rationale: शाब्दिक रूप ‘रूबेन के पुत्र’ है, पर वंशावली और गोत्रीय संदर्भ में ‘वंशजों’ आधुनिक हिन्दी में आशय अधिक स्वाभाविक और स्पष्ट करता है।
- source_word: וְגָדִי
  choice: गादियों
  rationale: यह व्यक्तिवाचक ‘गाद’ नहीं, बल्कि गाद गोत्र के सदस्यों का जातिवाचक रूप है।
- source_word: וַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र
  rationale: इब्रानी संरचना और गोत्रीय पदनाम को स्पष्ट एवं स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִן בְּנֵי חַיִל
  choice: वीर योद्धा
  rationale: यहाँ חַיִל सैन्य सामर्थ्य और वीरता व्यक्त करता है; संदर्भ के अनुसार यह युद्ध में समर्थ पुरुषों का वर्णन है।
- source_word: נֹשְׂאֵי מָגֵן וְחֶרֶב
  choice: ढाल और तलवार धारण करते
  rationale: नֹשְׂאֵי के ठोस ‘उठाने/धारण करने’ के बिंब को सहज हिन्दी में बनाए रखता है।
- source_word: וְדֹרְכֵי קֶשֶׁת
  choice: धनुष चढ़ाते
  rationale: शाब्दिक बिंब धनुष को पैर से दबाकर मोड़ने/चढ़ाने का है; ‘धनुष चढ़ाना’ हिन्दी में युद्ध के लिए धनुष तैयार करने की स्वाभाविक अभिव्यक्ति है।
- source_word: וּלְמוּדֵי מִלְחָמָה
  choice: युद्ध में प्रशिक्षित
  rationale: निष्पन्न/कर्मवाच्य अर्थ को स्पष्ट करता है और प्रशिक्षण के क्षेत्र के रूप में युद्ध को दर्शाता है।
- source_word: אַרְבָּעִים וְאַרְבָּעָה אֶלֶף וּשְׁבַע מֵאוֹת וְשִׁשִּׁים
  choice: 44,760
  rationale: मूल संख्या को ठीक रखते हुए आधुनिक हिन्दी में अंकों का प्रयोग त्वरित पठनीयता देता है।
- source_word: יֹצְאֵי צָבָא
  choice: सैन्य अभियान पर जाने के योग्य
  rationale: शाब्दिक ‘सेना के लिए बाहर जाने वाले’ एक सैन्य मुहावरा है, जो अभियान/सेवा के योग्य और उपलब्ध पुरुषों को दर्शाता है।
