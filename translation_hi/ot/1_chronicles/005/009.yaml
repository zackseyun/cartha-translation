base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/005/009.yaml
  text: To the east he settled as far as the entrance to the wilderness from the river Euphrates[a], because their livestock had multiplied in the land of Gilead.
translation:
  language: hi
  text: पूर्व की ओर वह फरात नदी से लगे निर्जन प्रदेश के प्रवेश तक बस गया[a], क्योंकि गिलाद की भूमि में उनका पशुधन बहुत बढ़ गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह फरात नदी से लेकर निर्जन प्रदेश तक बस गया।” इब्रानी में सीमा का यह वर्णन संक्षिप्त है और इसे एक से अधिक प्रकार से समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְלַמִּזְרָח
  choice: पूर्व की ओर
  rationale: दिशासूचक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक וְ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: יָשַׁב
  choice: वह ... बस गया
  rationale: यहाँ क्रिया प्रादेशिक बसावट को दर्शाती है और एकवचन कर्ता वंश अथवा गोत्र का सामूहिक प्रतिनिधित्व करता है।
- source_word: עַד לְבוֹא מִדְבָּרָה
  choice: निर्जन प्रदेश के प्रवेश तक
  rationale: सीमा के विस्तार को दर्शाने वाली ठोस ‘प्रवेश/पहुँच’ की छवि सुरक्षित रखी गई है; מִדְבָּר को केवल रेतीला मरुस्थल समझने से बचाने के लिए ‘निर्जन प्रदेश’ चुना गया है।
- source_word: לְמִן הַנָּהָר פְּרָת
  choice: फरात नदी से लगे
  rationale: इब्रानी वाक्यांश अत्यन्त संक्षिप्त और वाक्य-विन्यास की दृष्टि से अस्पष्ट है। यह चयन फरात की ओर/उससे संबद्ध निर्जन क्षेत्र का भौगोलिक संबंध सहज हिन्दी में देता है, जबकि वैकल्पिक समझ पादटिप्पणी में रखी गई है।
- source_word: מִקְנֵיהֶם
  choice: उनके पशुधन
  rationale: यह शब्द गाय-बैल तक सीमित नहीं, बल्कि पाले जाने वाले पशुओं का सामूहिक बोध देता है।
- source_word: רָבוּ
  choice: बहुत बढ़ गए थे
  rationale: संख्यात्मक वृद्धि तथा पूर्व की ओर फैलने के कारण—दोनों को स्पष्ट करता है।
- source_word: בְּאֶרֶץ גִּלְעָד
  choice: गिलाद देश में
  rationale: אֶרֶץ के प्रादेशिक अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
