  text: They made war against the Hagrites[a], Jetur, Naphish, and Nodab.
translation:
  language: hi
  text: उन्होंने हग्रियों[a], यतूर, नापीश और नोदाब के विरुद्ध युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “हागारियों” भी कहा जा सकता है। इब्रानी जातिनाम के संबंध में दोनों रूप प्रचलित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ מִלְחָמָה
  choice: उन्होंने ... युद्ध किया
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘युद्ध करना/बनाना’ है; आधुनिक हिन्दी में ‘युद्ध किया’ स्वाभाविक है और व्यापक सैन्य संघर्ष का भाव बनाए रखता है।
- source_word: עִם
  choice: के विरुद्ध
  rationale: यद्यपि इस संबंधबोधक का सामान्य अर्थ ‘के साथ’ है, युद्ध के प्रसंग में इसका भाव विरोधात्मक है।
- source_word: הַגְרִיאִים
  choice: हग्रियों
  rationale: इब्रानी जातिनाम הַגְרִיאִים का निकट देवनागरी लिप्यंतरण; हिन्दी विभक्ति के अनुरूप ‘हग्री’ का बहुवचन परसर्गीय रूप ‘हग्रियों’ रखा गया है।
- source_word: וִיטוּר
  choice: यतूर
  rationale: व्यक्तिवाचक/समूहवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וְנָפִישׁ
  choice: नापीश
  rationale: नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וְנוֹדָב
  choice: और नोदाब
  rationale: नाम का लिप्यंतरण किया गया और सूची की अंतिम संयोजक रचना बनाए रखने के लिए ‘और’ रखा गया।
