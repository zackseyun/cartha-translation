    text: इस स्थान के नाम को कुछ अनुवादों में “साल्का” भी लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנֵי גָד
  choice: और गाद के वंशज
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ गोत्रीय-क्षेत्रीय संदर्भ में यह गाद के वंशजों को दर्शाता है; आधुनिक हिन्दी में ‘वंशज’ आशय को स्वाभाविक और स्पष्ट रखता है।
- source_word: לְ/נֶגְדָּ/ם
  choice: उनके सामने
  rationale: נגד सापेक्ष स्थान को दर्शाता है—सामने, आमने-सामने या दूसरी ओर। ‘उनके सामने’ मूल की स्थान-संबंधी अस्पष्टता को पर्याप्त रूप से बनाए रखता है।
- source_word: יָשְׁבוּ
  choice: बसे हुए थे
  rationale: ישב यहाँ किसी क्षेत्र में निवास करने का अर्थ देता है। ‘बसे हुए थे’ क्षेत्रीय निवास को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना बसने की आरंभिक क्रिया पर अनावश्यक बल दिए।
- source_word: בְּ/אֶרֶץ הַ/בָּשָׁן
  choice: बाशान देश में
  rationale: אֶרֶץ यहाँ नामित भूभाग है; ‘बाशान देश’ हिन्दी बाइबलीय भूगोल में स्पष्ट और स्वाभाविक है।
- source_word: עַד סַלְכָה
  choice: सलका तक
  rationale: עַד भौगोलिक विस्तार की सीमा बताता है। हिब्रू סַלְכָה का निकट देवनागरी लिप्यंतरण ‘सलका’ है।
