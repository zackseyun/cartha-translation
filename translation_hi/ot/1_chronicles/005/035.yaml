translation:
  language: hi
  text: अहीमास अजर्याह का पिता हुआ, और अजर्याह योहानान का पिता हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/אֲחִימַעַץ
  choice: अहीमास
  rationale: व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है। आरंभिक वाव को हिन्दी वाक्य के आरंभ में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली में हिफ़इल रूप का अर्थ संतान उत्पन्न करना या पिता होना है। हिन्दी में ‘से … उत्पन्न हुआ’ स्वाभाविक, संक्षिप्त और गरिमापूर्ण वंशावली-प्रयोग है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का व्याकरणिक चिह्न है; हिन्दी में इसका स्वतंत्र शाब्दिक समकक्ष आवश्यक नहीं है।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: हिब्रू व्यक्तिवाचक नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: וַ/עֲזַרְיָה
  choice: और अजर्याह
  rationale: उपसर्ग वाव दोनों वंशावली खंडों को जोड़ता है, इसलिए इसे स्वाभाविक रूप से ‘और’ कहा गया है।
- source_word: יוֹחָנָן
  choice: योहानान
  rationale: हिब्रू व्यक्तिवाचक नाम का ध्वन्यात्मक रूप से स्पष्ट देवनागरी लिप्यंतरण।
