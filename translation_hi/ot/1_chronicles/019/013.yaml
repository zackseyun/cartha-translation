source:
  edition: WLC
  text: חֲזַ֤ק וְ/נִֽתְחַזְּקָה֙ בְּעַד עַמֵּ֔/נוּ וּ/בְעַ֖ד עָרֵ֣י אֱלֹהֵ֑י/נוּ וַֽ/יהוָ֔ה הַ/טּ֥וֹב בְּ/עֵינָ֖י/ו יַעֲשֶֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/013.yaml
  text: Be strong[a], and let us be strong for our people and for the cities of our God[b], and may Yahweh do what is good in his eyes.
translation:
  language: hi
  text: हिम्मत बाँधो, और आओ, हम अपने लोगों और अपने परमेश्वर के नगरों के लिए दृढ़ बनें[a]। याहवे वही करे जो उसकी दृष्टि में अच्छा है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम अपने आपको दृढ़ करें।” इब्रानी क्रिया में आत्मवाचक अथवा तीव्रतासूचक भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, “और याहवे वही करेगा जो उसकी दृष्टि में अच्छा है।” इस संदर्भ में इब्रानी क्रियारूप इच्छार्थक या भविष्यवाचक—दोनों अर्थ दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲזַק
  choice: हिम्मत बाँधो
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक रूप है, जो युद्ध की स्थिति में शक्ति और साहस के लिए प्रोत्साहित करता है। ‘हिम्मत बाँधो’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְנִתְחַזְּקָה
  choice: और हम ... दृढ़ हों
  rationale: हित्पएल प्रथम पुरुष बहुवचन इच्छार्थक रूप सामूहिक संकल्प और स्वयं को दृढ़ करने का भाव रखता है। हिन्दी में ‘हम दृढ़ हों’ इस आग्रह को सहज रूप से व्यक्त करता है; वैकल्पिक आत्मवाचक बारीकी पादटिप्पणी में दी गई है।
- source_word: בְּעַד
  choice: की खातिर
  rationale: यहाँ यह पद लोगों और नगरों के हित अथवा उनकी रक्षा के लिए कार्य करने का भाव देता है। ‘की खातिर’ संक्षिप्त है और दोनों के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: עַמֵּנוּ
  choice: अपने लोगों
  rationale: עַם का सामान्य अर्थ ‘लोग’ या ‘प्रजा’ है; युद्ध-प्रसंग के बावजूद इसे केवल सेना तक सीमित नहीं किया गया है।
- source_word: עָרֵי אֱלֹהֵינוּ
  choice: अपने परमेश्वर के नगरों
  rationale: यह रचना नगरों को परमेश्वर से संबद्ध करती है। शाब्दिक संबंध बनाए रखते हुए हिन्दी में स्वाभाविक पदक्रम अपनाया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: הַטּוֹב בְּעֵינָיו
  choice: जो उसकी दृष्टि में अच्छा है
  rationale: यह इब्रानी मुहावरे की दृष्टि-संबंधी छवि को बनाए रखता है और हिन्दी में स्पष्ट रहता है।
- source_word: יַעֲשֶׂה
  choice: करे
  rationale: प्रोत्साहन के बाद आया अपूर्ण क्रियारूप यहाँ इच्छार्थक समर्पण के रूप में समझा जा सकता है। ‘करे’ परिणाम को परमेश्वर पर छोड़ने का भाव रखता है, जबकि भविष्यवाचक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना हिन्दी में लिप्यंतरित करता है।
- issue: अंतिम उपवाक्य का इच्छार्थक अथवा भविष्यवाचक अर्थ
  choice: याहवे वही करे जो उसकी दृष्टि में अच्छा है
  alternative: याहवे वही करेगा जो उसकी दृष्टि में अच्छा है
  rationale: संदर्भ में योआब का कथन मानवीय दृढ़ता के साथ परिणाम को परमेश्वर पर छोड़ता है। इच्छार्थक अनुवाद इस भाव को सामने रखता है, और व्याकरणतः संभव भविष्यवाचक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘हिम्मत बाँधो’ युद्धकालीन प्रोत्साहन को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘दृढ़ हों’ सामूहिक संकल्प को बनाए रखता है। दो वास्तविक व्याकरणिक विकल्प पादटिप्पणियों में सुरक्षित किए गए हैं।
