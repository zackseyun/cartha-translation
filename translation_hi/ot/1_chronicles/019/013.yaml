  verdict: revise
  source_fidelity: The draft accurately represents the imperative, the first-person plural Hitpael cohortative, the beneficiaries ('our people' and 'the cities of our God'), the divine name, and the final volitional reading. A small adjustment better expresses the cohortative as a shared exhortation and retains the reflexive/intensive nuance without overtranslation.
  naturalness: ‘हम ... दृढ़ हों’ is grammatically possible but sounds like a detached wish in modern Hindi. ‘आओ, हम ... दृढ़ बनें’ is a natural, direct way to express the Hebrew cohortative. ‘के लिए’ is also more neutral and idiomatic here than ‘की खातिर’.
  terminology: ‘याहवे’ consistently preserves יהוה as a personal name. ‘परमेश्वर’ is suitable in this elevated biblical register. The revised wording retains the Hebrew repetition of the strength motif in an idiomatic Hindi form.
