    rationale: וְנִתְחַזְּקָה calls the speaker and hearers to a shared resolute action. Adding ‘आओ’ and using ‘बनें’ communicates this naturally, while the footnote preserves the stronger reflexive/intensive alternative.
  - severity: low
    issue: ‘अपने’ and ‘की खातिर’ are less clear/natural than ‘हमारे’ and ‘के लिए’ in this construction.
    rationale: The Hebrew suffixes explicitly mean ‘our’; ‘हमारे’ avoids any possible shifting antecedent. ‘के लिए’ expresses בעד plainly and naturally without adding a stronger sense than the source.
