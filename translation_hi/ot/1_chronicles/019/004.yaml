    text: या “पीछे के भाग तक।” इब्रानी शब्द नितंबों के क्षेत्र को सूचित करता है; इस प्रकार वस्त्र काटना सार्वजनिक अपमान था।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: यह संज्ञा दासों या सेवकों, दोनों को सूचित कर सकती है। यहाँ दाऊद की सेवा में राजकीय दूत अभिप्रेत हैं; उनकी बंधुआ स्थिति पर बल नहीं है, इसलिए ‘सेवकों’ संदर्भानुकूल और स्वाभाविक है।
- source_word: וַיְגַלְּחֵם
  choice: उनकी हजामत की
  rationale: इब्रानी क्रिया का अर्थ हजामत करना या मूँड़ना है और इतिहास की पुस्तक यहाँ शरीर का अंग नहीं बताती। यह रूप उसी अनिर्दिष्टता को बनाए रखता है; समानांतर पाठ की अतिरिक्त सूचना मुख्य पाठ में नहीं जोड़ी गई।
- source_word: מַדְוֵיהֶם
  choice: उनके वस्त्रों
  rationale: शब्द पहनावे या वस्त्रों को सूचित करता है, संभवतः दूतों का औपचारिक पहनावा। ‘वस्त्र’ गरिमापूर्ण और व्यापक हिंदी शब्द है।
- source_word: בַּחֵצִי
  choice: आधा काट दिया
  rationale: वाक्यांश वस्त्रों को बीच तक या आधा काट देने का भाव देता है। हिंदी में ‘आधा काट दिया’ स्पष्ट और सहज है।
- source_word: עַד הַמִּפְשָׂעָה
  choice: नितंबों तक
  rationale: दुर्लभ संज्ञा पीछे के भाग अथवा नितंबों के क्षेत्र को सूचित करती है। ‘नितंबों तक’ शारीरिक स्थान और सार्वजनिक अपमान, दोनों को अपेक्षाकृत ठीक ढंग से व्यक्त करता है।
- source_word: וַיְשַׁלְּחֵם
  choice: उन्हें भेज दिया
  rationale: क्रिया का मूल अर्थ ‘भेजना’ है। अपमान के बाद विदा कर देने का भाव संदर्भ से स्पष्ट है; ‘भेज दिया’ संक्षिप्त और स्वाभाविक है।
