  text: तब हानून ने दाऊद के सेवकों[a] को लिया, उनकी हजामत की, उनके वस्त्रों को बीच से नितंबों तक काट दिया[b], और उन्हें भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
