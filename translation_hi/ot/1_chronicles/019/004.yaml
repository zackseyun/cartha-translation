    text: 2 शमूएल 10:4 के समानांतर वर्णन में कहा गया है कि हानून ने उनकी दाढ़ियों का आधा भाग मूँड दिया था। इतिहास की पुस्तक यहाँ केवल इतना कहती है कि उसने “उनकी हजामत की।”
    reason: cross_reference
