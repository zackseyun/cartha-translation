base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/009.yaml
  text: And the sons of Ammon came out and drew up for battle at the entrance of the city[d][c][b][a], while the kings who had come were by themselves in the field.
translation:
  language: hi
  text: और अम्मोन के पुत्र[a] बाहर निकले और नगर के प्रवेश-स्थान पर[c] युद्ध के लिए पंक्तिबद्ध हुए[b], जबकि जो राजा आए थे, वे उनसे अलग मैदान में थे[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अम्मोनी लोग।’ इब्रानी में शाब्दिक रूप से ‘अम्मोन के पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘युद्ध के लिए मोर्चा बाँधा।’ इब्रानी मुहावरा सैनिकों को युद्ध-विन्यास में लगाने का भाव देता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘नगर के फाटक पर’; परन्तु इब्रानी में यहाँ सामान्यतः ‘फाटक’ के लिए प्रयुक्त शब्द नहीं, बल्कि ‘प्रवेश’ या ‘खुलने के स्थान’ का अधिक व्यापक शब्द है।
    reason: lexical_alternative
  - marker: d
    text: अर्थात् जो राजा आए थे, वे अम्मोनियों से अलग मैदान में तैनात थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: बाहर निकले
  rationale: יצא का सामान्य कथात्मक अर्थ ‘बाहर निकलना’ है; सैन्य प्रसंग में यह नगर से बाहर आने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोन के पुत्र
  rationale: इब्रानी जातिनाम की शाब्दिक संरचना को सुरक्षित रखा गया है; इसका अर्थ अम्मोनी लोग है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: युद्ध के लिए पंक्तिबद्ध हुए
  rationale: ערך और מלחמה का संयुक्त प्रयोग सैनिकों के युद्ध-विन्यास में खड़े होने का संकेत देता है, केवल युद्ध करने का नहीं।
- source_word: פֶּתַח הָעִיר
  choice: नगर के प्रवेश पर
  rationale: פתח का अर्थ सामान्यतः ‘खुला स्थान/प्रवेश’ है; यहाँ सामान्य इब्रानी शब्द ‘फाटक’ प्रयुक्त नहीं हुआ है।
- source_word: וְהַמְּלָכִים אֲשֶׁר בָּאוּ
  choice: जबकि जो राजा आए थे
  rationale: वाव यहाँ दोनों सैन्य दलों की अलग-अलग स्थिति दिखाने वाला परिस्थितिजन्य विरोध व्यक्त करता है; ‘जबकि’ इसे सहज हिन्दी में सामने लाता है।
- source_word: לְבַדָּם
  choice: उनसे अलग
  rationale: शब्द का आशय राजाओं की सेनाओं का अम्मोनी सेना से अलग तैनात होना है, न कि प्रत्येक राजा का नितांत अकेला होना।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה यहाँ नगर से बाहर का क्षेत्र या मैदान दर्शाता है; ‘मैदान’ मूल की संक्षिप्तता और सैन्य प्रसंग दोनों को बनाए रखता है।
