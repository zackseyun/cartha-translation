base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/017.yaml
  text: When it was reported to David[a], he gathered all Israel, crossed the Jordan, came against them, and drew up in battle formation against them. Then David drew up for battle to meet Aram, and they fought with him.
translation:
  language: hi
  text: जब दाऊद को यह समाचार दिया गया, तब उसने समूचे इस्राएल को इकट्ठा किया, यरदन पार किया, उनके विरुद्ध आया और उनके सामने युद्ध-पंक्ति सजाई। फिर दाऊद ने अराम का सामना करने के लिए युद्ध-पंक्ति सजाई, और वे उससे लड़े[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वे उसके साथ लड़े।” पर यहाँ प्रसंग में अर्थ है, “वे उसके विरुद्ध लड़े।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֻּגַּד לְדָוִיד
  choice: जब दाऊद को यह समाचार दिया गया
  rationale: इब्रानी के कर्मवाच्य कथन को बनाए रखता है, किसी अनकहे कर्ता को नहीं जोड़ता, और प्रसंग में इसके कालगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֶּאֱסֹף אֶת כָּל יִשְׂרָאֵל
  choice: उसने समूचे इस्राएल को इकट्ठा किया
  rationale: אָסַף के इकट्ठा करने के सामान्य अर्थ को रखता है; सैन्य जुटान प्रसंग से स्पष्ट है, इसलिए उसे अनावश्यक रूप से पाठ में नहीं जोड़ा गया।
- source_word: וַיַּעֲבֹר הַיַּרְדֵּן
  choice: यरदन पार किया
  rationale: עבר और उसके प्रत्यक्ष कर्म का संक्षिप्त, स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיָּבֹא אֲלֵיהֶם
  choice: उनके विरुद्ध आया
  rationale: בוא אל का मूलतः दिशात्मक भाव है, पर युद्ध के प्रसंग में गति शत्रुतापूर्ण है; ‘विरुद्ध आया’ इस अर्थ को बिना अतिरिक्त विवरण के व्यक्त करता है।
- source_word: וַיַּעֲרֹךְ אֲלֵיהֶם
  choice: उनके सामने युद्ध-पंक्ति सजाई
  rationale: सैन्य प्रसंग में ערך सेना को युद्ध के लिए क्रमबद्ध करने का बोध देता है। ‘युद्ध-पंक्ति सजाई’ हिन्दी में इस क्रिया को स्पष्ट करता है और אֲלֵיהֶם की आमने-सामने की दिशा भी रखता है।
- source_word: וַיַּעֲרֹךְ דָּוִיד לִקְרַאת אֲרָם מִלְחָמָה
  choice: दाऊद ने अराम का सामना करने के लिए युद्ध-पंक्ति सजाई
  rationale: दोहराई गई ערך के लिए वही अभिव्यक्ति रखी गई है; לִקְרַאת को ‘सामना करने के लिए’ और מִלְחָמָה को सैन्य पद ‘युद्ध-पंक्ति’ में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֲרָם
  choice: अराम
  rationale: इब्रानी स्थान/जन-नाम को उसके ऐतिहासिक रूप में रखता है; बाद के भू-राजनीतिक नाम ‘सीरिया’ अथवा व्याख्यात्मक ‘अरामी लोग’ को नहीं अपनाता।
- source_word: וַיִּלָּחֲמוּ עִמּוֹ
  choice: वे उसके साथ लड़े
  rationale: עִם का शाब्दिक संबंध ‘साथ’ से व्यक्त होता है, जबकि युद्ध-प्रसंग में इसका अर्थ दाऊद के विरुद्ध लड़ना है। मुख्य पाठ स्रोत की अभिव्यक्ति को निकटता से रखता है और पाद-टिप्पणी प्रसंगगत विकल्प स्पष्ट करती है।
