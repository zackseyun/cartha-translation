  yaml_path: translation/ot/1_chronicles/019/001.yaml
  text: After this, Nahash king of the Ammonites died, and his son reigned in his place.
translation:
  language: hi
  text: इसके बाद अम्मोनियों का राजा नाहाश मर गया, और उसका पुत्र उसके स्थान पर राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह इब्रानी कथात्मक सूत्र समय के अगले चरण को दर्शाता है। ‘इसके बाद’ उसका स्वाभाविक और स्पष्ट आधुनिक हिन्दी रूप है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות का सीधा अर्थ ‘मरना’ है। यह चयन मूल की स्पष्टता बनाए रखता है और अनावश्यक शिष्टोक्ति से बचता है।
- source_word: נָחָשׁ
  choice: नाहाश
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: מֶלֶךְ בְּנֵי עַמּוֹן
  choice: अम्मोनियों का राजा
  rationale: शाब्दिक ‘अम्मोन के पुत्रों का राजा’ के स्थान पर यह उसी जातीय समुदाय को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: इस प्रसंग में מלך राजसत्ता ग्रहण करने को दर्शाता है। ‘राजा बना’ उत्तराधिकार की घटना को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: सर्वनाम का संकेत नाहाश की ओर है; यह रूप सम्बन्ध को सीधे व्यक्त करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: यह पद राजकीय पद और शासन में उत्तराधिकार दर्शाता है; चुना हुआ रूप मूल अर्थ के निकट और हिन्दी में स्वाभाविक है।
