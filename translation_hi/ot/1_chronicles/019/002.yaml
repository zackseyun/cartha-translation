  text: וַ/יֹּ֨אמֶר דָּוִ֜יד אֶֽעֱשֶׂה חֶ֣סֶד עִם חָנ֣וּן בֶּן נָחָ֗שׁ כִּֽי עָשָׂ֨ה אָבִ֤י/ו עִמִּ/י֙ חֶ֔סֶד וַ/יִּשְׁלַ֥ח דָּוִ֛יד מַלְאָכִ֖ים לְ/נַחֲמ֣/וֹ עַל אָבִ֑י/ו וַ/יָּבֹאוּ֩ עַבְדֵ֨י דָוִ֜יד אֶל אֶ֧רֶץ בְּנֵי עַמּ֛וֹן אֶל חָנ֖וּן לְ/נַחֲמֽ/וֹ־׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/002.yaml
  text: And David said[a], “I will show kindness to Hanun son of Nahash, because his father showed kindness to me.” So David sent messengers to comfort him concerning his father. And David’s servants came to the land of the Ammonites, to Hanun, to comfort him.
translation:
  language: hi
  text: दाऊद ने कहा, “मैं नाहाश के पुत्र हानून के प्रति दयालुता दिखाऊँगा, क्योंकि उसके पिता ने मेरे प्रति दयालुता दिखाई थी।” इसलिए दाऊद ने उसके पिता के विषय में[a] उसे सांत्वना देने के लिए दूत भेजे। दाऊद के सेवक हानून को सांत्वना देने के लिए अम्मोनियों के देश में उसके पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पिता के कारण” या “उसके पिता के लिए।” इब्रानी अभिव्यक्ति बताती है कि सांत्वना उसके पिता से संबंधित थी; संदर्भ में यह उनके निधन के शोक से जुड़ी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶסֶד
  choice: कृपा
  rationale: इस राजनीतिक और व्यक्तिगत प्रसंग में यह शब्द परोपकारी निष्ठा अथवा सद्भावपूर्ण व्यवहार को व्यक्त करता है। ‘कृपा दिखाना’ दोनों occurrences में स्वाभाविक है और यहाँ अनावश्यक रूप से वाचा-संबंधी अर्थ नहीं जोड़ता।
- source_word: עָשָׂה חֶסֶד עִם
  choice: के प्रति कृपा दिखाना
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप; शाब्दिक ‘के साथ कृपा करना’ की असहजता से बचता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यहाँ मानवीय संदेशवाहक अथवा प्रतिनिधि अभिप्रेत हैं; ‘दूत’ स्पष्ट है और उनके आधिकारिक पद को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: לְנַחֲמוֹ
  choice: उसे सांत्वना देने के लिए
  rationale: शोक के प्रसंग में נחם का अर्थ ढाढ़स देना अथवा सांत्वना देना है; चुना हुआ रूप आधुनिक मानक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: עַל אָבִיו
  choice: उसके पिता के निधन पर
  rationale: नחם के साथ यह पदबंध पिता की मृत्यु से उत्पन्न शोक के अवसर को दर्शाता है। मुख्य पाठ में निहित प्रसंग स्पष्ट किया गया है, जबकि पादटिप्पणी अधिक शाब्दिक रूप बताती है।
- source_word: אֶרֶץ בְּנֵי עַמּוֹן
  choice: अम्मोनियों का देश
  rationale: जातिनाम का प्रचलित हिन्दी रूप अपनाते हुए אֶרֶץ का भौगोलिक अर्थ बनाए रखता है।
- source_word: עַבְדֵי דָוִיד
  choice: दाऊद के सेवक
  rationale: עבדים यहाँ दाऊद की सेवा में नियुक्त व्यक्तियों को दर्शाता है; प्रसंग उन्हें अधिकारी मानने की माँग नहीं करता।
- source_word: בֶּן נָחָשׁ
  choice: नाहाश का पुत्र
  rationale: वंश-संबंध को सीधे व्यक्त किया गया है और व्यक्तिनाम का मानक लिप्यंतरण रखा गया है।
