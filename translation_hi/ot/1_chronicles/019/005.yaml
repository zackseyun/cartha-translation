base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/005.yaml
  text: They went and told David about the men[a], and he sent to meet them, because the men were greatly humiliated. And the king said, “Stay in Jericho until your beards have grown back[b], then return.”
translation:
  language: hi
  text: वे गए और उन्होंने दाऊद को उन पुरुषों के बारे में बताया। तब उसने उनसे मिलने के लिए भेजा[a], क्योंकि वे पुरुष बहुत अपमानित थे। राजा ने कहा, “जब तक तुम्हारी दाढ़ियाँ फिर से न बढ़ जाएँ, तब तक यरीहो में रहो; उसके बाद लौट आना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने उनसे मिलने के लिए भेजा।” इब्रानी पाठ यह स्पष्ट नहीं करता कि किसे भेजा गया था; सम्भवतः कुछ लोग या दूत अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיַּגִּידוּ לְדָוִיד עַל הָאֲנָשִׁים
  choice: वे गए और उन्होंने दाऊद को उन पुरुषों के बारे में बताया
  rationale: इब्रानी कथात्मक क्रियाक्रम और עַל द्वारा व्यक्त रिपोर्ट के विषय को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: וַיִּשְׁלַח לִקְרָאתָם
  choice: उसने उनसे मिलने के लिए लोगों को भेजा
  rationale: इब्रानी में भेजे गए व्यक्तियों का कर्म स्पष्ट नहीं है; हिन्दी में वाक्य को स्वाभाविक बनाने के लिए सामान्य शब्द ‘लोगों’ का प्रयोग किया गया है, बिना उन्हें विशिष्ट रूप से ‘दूत’ ठहराए।
- source_word: נִכְלָמִים מְאֹד
  choice: बहुत अपमानित थे
  rationale: כלם का निफ़अल रूप लज्जित या अपमानित अवस्था बताता है; पिछले पद में हुए सार्वजनिक अपमान के संदर्भ में ‘बहुत अपमानित’ सामाजिक तिरस्कार को स्पष्ट करता है।
- source_word: שְׁבוּ בִירֵחוֹ
  choice: यरीहो में रहो
  rationale: ישׁב का आदेशात्मक रूप यहाँ बैठने के बजाय किसी स्थान पर ठहरे रहने के अर्थ में है।
- source_word: עַד אֲשֶׁר יְצַמַּח זְקַנְכֶם
  choice: जब तक तुम्हारी दाढ़ियाँ फिर से न बढ़ जाएँ
  rationale: צמח का मूल अर्थ ‘उगना/बढ़ना’ है; पूर्व पद में दाढ़ियाँ काटे जाने के कारण ‘फिर से’ संदर्भगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְשַׁבְתֶּם
  choice: उसके बाद लौट आना
  rationale: संयोजित पूर्ण क्रिया यहाँ समय-सीमा पूरी होने के बाद होने वाली अगली कार्रवाई बताती है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ दाऊद का नाम दोहराने के बजाय उसकी राजकीय उपाधि का प्रयोग करता है, जिसे सुरक्षित रखा गया है।
