source:
  edition: WLC
  text: וְ/אֵת֙ יֶ֣תֶר הָ/עָ֔ם נָתַ֕ן בְּ/יַ֖ד אַבְשַׁ֣י אָחִ֑י/ו וַ/יַּ֣עַרְכ֔וּ לִ/קְרַ֖את בְּנֵ֥י עַמּֽוֹן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/011.yaml
  text: He put the rest of the troops under the command of Abishai his brother[a], and they drew up in battle formation to meet the Ammonites.
translation:
  language: hi
  text: उसने बाकी सैनिकों को अपने भाई अबीशै की कमान में सौंप दिया[a], और वे अम्मोनियों का सामना करने के लिए युद्ध-पंक्ति में खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपने भाई अबीशै के हाथ में दे दिया”; यह किसी के अधिकार या कमान में सौंपने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר הָעָם
  choice: बाकी सैनिकों
  rationale: יֶתֶר का अर्थ ‘बाकी’ है; सैन्य प्रसंग में הָעָם लड़नेवाले दल को सूचित करता है, इसलिए ‘सैनिकों’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: נָתַן בְּיַד
  choice: की कमान में सौंप दिया
  rationale: शाब्दिक अर्थ ‘के हाथ में दिया’ है; यहाँ मुहावरे का भाव किसी के अधिकार और नेतृत्व में सौंपना है।
- source_word: אַבְשַׁי אָחִיו
  choice: अपने भाई अबीशै
  rationale: אָחִיו का संबंध कर्ता से है; ‘अपने भाई’ हिंदी में यह संबंध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है। नाम का रूप ‘अबीशै’ इब्रानी उच्चारण के निकट है।
- source_word: וַיַּעַרְכוּ
  choice: वे ... युद्ध-पंक्ति में खड़े हो गए
  rationale: ערך सैन्य प्रसंग में युद्ध के लिए दल को पंक्तिबद्ध या व्यवस्थित करने को दर्शाता है।
- source_word: לִקְרַאת
  choice: का सामना करने के लिए
  rationale: לִקְרַאת का मूल भाव ‘सामने जाने/मिलने’ का है; युद्ध के प्रसंग में ‘सामना करने’ से शत्रुतापूर्ण मुठभेड़ स्वाभाविक रूप से व्यक्त होती है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक ‘अम्मोन के पुत्र’ के स्थान पर जातिवाचक ‘अम्मोनी’ आधुनिक हिंदी में स्वाभाविक है।
