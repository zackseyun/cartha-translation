  text: וַ/יִּרְאוּ֙ בְּנֵ֣י עַמּ֔וֹן כִּ֥י הִֽתְבָּאֲשׁ֖וּ עִם דָּוִ֑יד וַ/יִּשְׁלַ֣ח חָ֠נוּן וּ/בְנֵ֨י עַמּ֜וֹן אֶ֣לֶף כִּכַּר כֶּ֗סֶף לִ/שְׂכֹּ֣ר לָ֠/הֶם מִן אֲרַ֨ם נַהֲרַ֜יִם וּ/מִן אֲרַ֤ם מַעֲכָה֙ וּ/מִ/צּוֹבָ֔ה רֶ֖כֶב וּ/פָרָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/006.yaml
  text: When the Ammonites saw that they had become odious to David[a], Hanun and the Ammonites sent a thousand talents of silver to hire for themselves chariots and horsemen from Aram-naharaim, from Aram-maacah[b], and from Zobah.
translation:
  language: hi
  text: जब अम्मोनियों ने देखा कि वे दाऊद की दृष्टि में घृणित हो गए हैं,[a] तब हानून और अम्मोनियों ने अराम-नहरैम,[b] अराम-माका और सोबा से अपने लिए रथों और घुड़सवारों को किराए पर लेने के लिए एक हज़ार किक्कार चाँदी भेजी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक भाव है, “उन्होंने अपने आपको दाऊद के लिए बदबूदार बना लिया था”; यह अत्यंत अप्रिय या घृणित हो जाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अराम-नहरैम का पारंपरिक अर्थ “दो नदियों का अराम” है, अर्थात मेसोपोटामिया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: देखा
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ है; यहाँ इससे परिस्थिति को समझ लेने का भाव भी निकलता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: ‘अम्मोन के पुत्रों’ की अपेक्षा यह जातिवाचक रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הִתְבָּאֲשׁוּ עִם דָּוִיד
  choice: दाऊद के लिए घृणित हो गए
  rationale: यह हिब्रू मुहावरा दाऊद की दृष्टि में अत्यंत अप्रिय या घृणित हो जाने को व्यक्त करता है; शाब्दिक दुर्गंध-रूपक पादटिप्पणी में रखा गया है।
- source_word: אֶלֶף כִּכַּר כֶּסֶף
  choice: एक हज़ार किक्कार चाँदी
  rationale: किक्कार प्राचीन भार-माप है; आधुनिक भार में अनुमानित परिवर्तन करने के बजाय मूल इकाई सुरक्षित रखी गई है।
- source_word: לִשְׂכֹּר לָהֶם
  choice: अपने लिए ... किराए पर लेने के लिए
  rationale: इससे किराए पर लेने की क्रिया और לָהֶם का हितार्थक/आत्मसंबंधी भाव दोनों व्यक्त होते हैं।
- source_word: אֲרַם נַהֲרַיִם
  choice: अराम-नहरैम
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; उसका पारंपरिक भौगोलिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲרַם מַעֲכָה
  choice: अराम-माका
  rationale: संयुक्त क्षेत्रीय नाम के रूप में इसका लिप्यंतरण किया गया है।
- source_word: מִצּוֹבָה
  choice: सोबा को
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है; מן के कारण स्रोत-प्रदेशों का भाव है, जबकि ‘भेजी’ के साथ हिन्दी में ‘को’ स्वाभाविक है।
- source_word: רֶכֶב וּפָרָשִׁים
  choice: रथ और घुड़सवार
  rationale: दोनों सैन्य बलों के ठोस और सहज हिन्दी रूप हैं; רֶכֶב सामूहिक अर्थ में प्रयुक्त है।
