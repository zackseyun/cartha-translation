translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल स्रोत में स्थानों के साथ ‘से’ है, पर चाँदी भेजने की हिन्दी संरचना में गंतव्य के लिए ‘को’ रखा गया; किराए पर लिए जाने वाले रथ और घुड़सवार उन्हीं क्षेत्रों से आने हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का क्रम विषय-वस्तु से उलटा था; हिन्दी में संबंधित पदों पर सही चिह्न लगाए गए हैं।
