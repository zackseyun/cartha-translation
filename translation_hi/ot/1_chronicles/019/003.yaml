  text: וַ/יֹּאמְרוּ֩ שָׂרֵ֨י בְנֵי עַמּ֜וֹן לְ/חָנ֗וּן הַֽ/מְכַבֵּ֨ד דָּוִ֤יד אֶת אָבִ֨י/ךָ֙ בְּ/עֵינֶ֔י/ךָ כִּֽי שָׁלַ֥ח לְ/ךָ֖ מְנַחֲמִ֑ים הֲ/לֹ֡א בַּ֠/עֲבוּר לַ/חְקֹ֨ר וְ/לַ/הֲפֹ֤ךְ וּ/לְ/רַגֵּל֙ הָ/אָ֔רֶץ בָּ֥אוּ עֲבָדָ֖י/ו אֵלֶֽי/ךָ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/003.yaml
  text: But the princes of the Ammonites said to Hanun[a], “Is David honoring your father in your sight because he has sent comforters to you? Have not his servants come to you in order to search out, to overthrow[b], and to spy out the land?”
translation:
  language: hi
  text: परन्तु अम्मोनियों के हाकिमों ने हानून से कहा, “क्या तेरी दृष्टि में[a] दाऊद तेरे पिता का आदर कर रहा है, क्योंकि उसने तुझे सांत्वना देनेवाले भेजे हैं? क्या उसके सेवक इस देश की छानबीन करने, उसे उलट देने[b] और उसकी जासूसी करने के लिए तेरे पास नहीं आए हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “तेरी आँखों में”; यह मुहावरा हानून की धारणा या निर्णय को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उलट-पुलट करने।” इब्रानी क्रिया का अर्थ पलटना या उलट देना हो सकता है; यहाँ शत्रुतापूर्ण ढंग से देश की व्यवस्था उलटने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי
  choice: हाकिमों
  rationale: यह शब्द शासकीय पद और ऊँचे अधिकारियों को दर्शाता है; राजदरबार के प्रसंग में ‘हाकिम’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הַמְכַבֵּד
  choice: आदर कर रहा है
  rationale: כבד यहाँ सम्मान देने या आदर करने के अर्थ में है; वर्तमान कृदन्त का भाव भी बना रहता है।
- source_word: בְּעֵינֶיךָ
  choice: तेरी दृष्टि में
  rationale: यह इब्रानी मुहावरे ‘तेरी आँखों में’ का स्वाभाविक हिन्दी रूप है और हानून की धारणा अथवा निर्णय को सूचित करता है।
- source_word: מְנַחֲמִים
  choice: सांत्वना देनेवाले
  rationale: यह शोक के समय ढाढ़स बँधाने के लिए भेजे गए व्यक्तियों को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: לַחְקֹר
  choice: छानबीन करने
  rationale: חקר का अर्थ खोजबीन या जाँच करना हो सकता है; जासूसी के प्रसंग में ‘छानबीन’ उपयुक्त है।
- source_word: וְלַהֲפֹךְ
  choice: उसे उलट देने
  rationale: הפך का मूल भाव पलटना या उलट देना है। यह अनुवाद उस चित्र को बनाए रखते हुए यहाँ निहित शत्रुतापूर्ण उलटफेर की संभावना खुली रखता है।
- source_word: וּלְרַגֵּל
  choice: उसकी जासूसी करने
  rationale: पिएल रूप में רגל सामान्यतः जासूसी या गुप्त रूप से जानकारी लेने को दर्शाता है।
- source_word: הָאָרֶץ
  choice: इस देश
  rationale: यहाँ אֶרֶץ अम्मोन के भूभाग या देश को दर्शाता है; ‘इस देश’ वक्ताओं के अपने क्षेत्र की ओर संकेत को स्वाभाविक बनाता है।
- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: राजकीय प्रसंग में עבד राजा के सेवकों या दूतों के लिए प्रयुक्त हो सकता है; ‘सेवक’ पद को अनावश्यक रूप से विशिष्ट नहीं करता।
