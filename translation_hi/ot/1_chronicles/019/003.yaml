translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक रूप रखा गया है। संबोधन में ‘तेरी/तुझे’ का प्रयोग प्राचीन राजकीय संवाद के सीधेपन को बनाए रखता है। प्रश्नों की व्यंग्यात्मक और संदेहपूर्ण प्रकृति को बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
