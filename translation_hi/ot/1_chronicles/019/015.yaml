translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक गद्य। जातिनामों और व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। मुख्य पाठ में अराम के सामूहिक सैन्य संदर्भ को स्पष्ट किया गया है; भाई की पहचान भी संदर्भानुसार सीधे व्यक्त की गई है।
