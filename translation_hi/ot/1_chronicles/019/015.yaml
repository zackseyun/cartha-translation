  text: וּ/בְנֵ֨י עַמּ֤וֹן רָאוּ֙ כִּי נָ֣ס אֲרָ֔ם וַ/יָּנ֣וּסוּ גַם הֵ֗ם מִ/פְּנֵי֙ אַבְשַׁ֣י אָחִ֔י/ו וַ/יָּבֹ֖אוּ הָ/עִ֑ירָ/ה וַ/יָּבֹ֥א יוֹאָ֖ב יְרוּשָׁלִָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/015.yaml
  text: When the Ammonites saw that Aram had fled[a], they also fled before Abishai his brother and entered the city[b]. Then Joab came to Jerusalem.
translation:
  language: hi
  text: जब अम्मोनियों ने देखा कि अराम भाग गया था[a], तो वे भी योआब के भाई अबीशै के सामने से भागकर नगर में चले गए। तब योआब यरूशलेम आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘अराम’ है; यहाँ आशय अरामी सेना से है, जिसे परंपरागत रूप से ‘सीरियाई सेना’ भी कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्र’ यहाँ जाति के लोगों को सूचित करता है; आधुनिक हिन्दी में प्रचलित जातिवाचक रूप स्वाभाविक और सटीक है।
- source_word: כִּי נָס אֲרָם
  choice: कि अराम की सेना भाग गई है
  rationale: כִּי देखी गई बात का विषय प्रस्तुत करता है। אֲרָם एकवचन नाम होते हुए यहाँ अरामी सैन्यबल को सामूहिक रूप से सूचित करता है, इसलिए ‘की सेना’ अर्थ स्पष्ट करता है। हिन्दी की परोक्ष दृष्टि में ‘भाग गई है’ पहले घट चुकी और देखी गई घटना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּנוּסוּ גַם הֵם מִפְּנֵי
  choice: तो वे भी ... के सामने से भागकर
  rationale: גַם הֵם अराम की सेना के समान अम्मोनियों के भी भागने पर बल देता है; מִפְּנֵי का युद्ध-संदर्भ में अर्थ विरोधी के सामने से पीछे हटना है।
- source_word: אַבְשַׁי אָחִיו
  choice: योआब के भाई अबीशै
  rationale: संदर्भ में ‘उसका भाई’ योआब के भाई को सूचित करता है। हिन्दी में संबंध को स्पष्ट करके रखना अस्पष्ट सर्वनाम से अधिक स्वाभाविक है और नई जानकारी नहीं जोड़ता।
- source_word: וַיָּבֹאוּ הָעִירָה
  choice: नगर में चले गए
  rationale: दिशासूचक הָ־ नगर के भीतर जाने को व्यक्त करता है। यह हिन्दी में पीछे हटकर नगर की शरण लेने की गति को सहज ढंग से बताता है।
- source_word: וַיָּבֹא יוֹאָב יְרוּשָׁלִָם
  choice: तब योआब यरूशलेम लौट आया
  rationale: वर्णन के संदर्भ में योआब का यरूशलेम जाना युद्धस्थल से अपने स्थान पर लौटना है। ‘तब’ घटनाक्रम की अगली कड़ी व्यक्त करता है; ‘लौट आया’ हिन्दी में प्रसंगानुकूल है।
