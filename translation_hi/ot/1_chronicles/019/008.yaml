  register: भाषा आधुनिक मानक हिन्दी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘यह बात सुनी’ सामान्य पाठक के लिए स्वाभाविक है, जबकि पादटिप्पणी समाचार मिलने का संदर्भगत अर्थ स्पष्ट करती है।
