base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/008.yaml
  text: When David heard, he sent Joab and all the army of the mighty men.
translation:
  language: hi
  text: जब दाऊद ने यह बात सुनी,[a] तो उसने योआब और वीर योद्धाओं की पूरी सेना[b] को भेजा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब दाऊद को इसका समाचार मिला।”
    reason: lexical_alternative
  - marker: b
    text: “वीर योद्धा” से दाऊद के पराक्रमी सैनिकों या उसके विशिष्ट लड़ाकू दल का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: यह बात सुनी
  rationale: שׁמע का मूल अर्थ ‘सुनना’ है; कथा-संदर्भ में इसका आशय समाचार मिलने से है। ‘यह बात सुनी’ स्वाभाविक हिन्दी में दोनों पहलुओं को बनाए रखता है।
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: सैन्य कथा में שלח के लिए ‘भेजा’ सीधा, स्पष्ट और पर्याप्त रूप से गरिमापूर्ण रूप है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: כָּל
  choice: पूरी
  rationale: यहाँ כָּל अगले समूह की समग्रता व्यक्त करता है; स्त्रीलिंग ‘सेना’ के साथ ‘पूरी’ स्वाभाविक है।
- source_word: צָבָא
  choice: सेना
  rationale: इस सैन्य संदर्भ में צָבָא संगठित लड़ाकू दल को दर्शाता है; आधुनिक हिन्दी में ‘सेना’ सबसे स्पष्ट समतुल्य है।
- source_word: הַגִּבּוֹרִים
  choice: वीर योद्धाओं
  rationale: גִּבּוֹרִים सामर्थी अथवा पराक्रमी लड़ाकों को सूचित करता है। ‘वीर योद्धा’ अर्थ को स्पष्ट रखता है और इसे सामान्यतः केवल ‘पुरुषों’ तक सीमित नहीं करता।
- source_word: וְאֵת כָּל צָבָא הַגִּבּוֹרִים
  choice: और वीर योद्धाओं की पूरी सेना को
  rationale: इस रूप में योआब और सेना, दोनों अलग प्रत्यक्ष कर्म बने रहते हैं और צְבָא הַגִּבּוֹרִים का संबंध ‘वीर योद्धाओं की सेना’ के रूप में सुरक्षित रहता है।
theological_decisions: []
