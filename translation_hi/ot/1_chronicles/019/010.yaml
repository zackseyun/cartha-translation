base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/010.yaml
  text: When Joab saw that the battle line was set against him in front and in the rear[b][a], he chose some of the best men from all Israel and arranged them to meet Aram.
translation:
  language: hi
  text: जब योआब ने देखा कि युद्ध की पंक्ति उसके विरुद्ध आगे और पीछे दोनों ओर लगी हुई थी, तब उसने इस्राएल के सभी श्रेष्ठ योद्धाओं में से कुछ को चुना[a] और उन्हें अराम[b] का सामना करने के लिए युद्ध-पंक्ति में खड़ा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के सभी जवानों में से कुछ को।” इब्रानी शब्द का अर्थ जवान पुरुष भी हो सकता है; सैन्य संदर्भ में यह चुने हुए या श्रेष्ठ योद्धाओं को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अराम”; यहाँ आशय अरामी सेना से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: कथात्मक संदर्भ में ראה का मूल अर्थ ‘देखना’ है; यहाँ इससे सामरिक स्थिति को पहचानना भी स्वाभाविक रूप से व्यक्त होता है।
- source_word: פְנֵי הַמִּלְחָמָה
  choice: युद्ध की पंक्ति
  rationale: शाब्दिक अर्थ ‘युद्ध का मुख/अग्रभाग’ है; सैनिक संदर्भ में यह विरोधी सैन्य गठन या युद्ध-पंक्ति को दर्शाता है।
- source_word: אֵלָיו פָּנִים וְאָחוֹר
  choice: उसके सामने और पीछे, दोनों ओर से ... उसके विरुद्ध
  rationale: यह वाक्यांश आगे और पीछे दोनों दिशाओं से विरोधी मोर्चा होने की सामरिक स्थिति व्यक्त करता है; अनुवाद दिशात्मक विरोध को बनाए रखता है, बिना पूर्ण घेराबंदी को अनिवार्य मान लिए।
- source_word: וַיִּבְחַר
  choice: चुन लिया
  rationale: בחר का सामान्य और स्वाभाविक हिन्दी अर्थ ‘चुनना’ है।
- source_word: מִכָּל בָּחוּר בְּיִשְׂרָאֵל
  choice: इस्राएल के सभी चुने हुए योद्धाओं में से कुछ
  rationale: सैनिक संदर्भ में בָּחוּר चुने हुए या योग्य योद्धाओं का बोध करा सकता है; מִן को अंशवाचक मानते हुए ‘में से कुछ’ रखा गया है। ‘जवानों’ का संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיַּעֲרֹךְ
  choice: युद्ध-पंक्ति में खड़ा किया
  rationale: युद्ध-संदर्भ में ערך सैनिकों को क्रमबद्ध करके मोर्चे पर तैनात करने का अर्थ देता है।
- source_word: לִקְרַאת אֲרָם
  choice: अराम का सामना करने के लिए
  rationale: לִקְרַאת यहाँ शत्रुतापूर्ण भेंट या सामना करने का अर्थ रखता है; यह हिन्दी में सैनिक संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: אֲרָם
  choice: अराम
  rationale: इब्रानी स्थान/जन-नाम को बाद के भौगोलिक नाम से बदलने के बजाय उसके मूल रूप के निकट रखा गया है।
