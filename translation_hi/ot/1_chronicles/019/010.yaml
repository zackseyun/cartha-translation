  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण सैनिक भाषा रखी गई है। ‘युद्ध की पंक्ति’ और ‘युद्ध-पंक्ति में खड़ा किया’ सामान्य पाठक के लिए स्पष्ट हैं। आगे-पीछे से विरोध की बात संरक्षित है, पर पाठ से अधिक स्पष्ट ‘चारों ओर घिरा हुआ’ नहीं जोड़ा गया।
