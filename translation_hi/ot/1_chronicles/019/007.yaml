base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/007.yaml
  text: So they hired for themselves thirty-two thousand chariots[a], and the king of Maacah with his people. They came and camped before Medeba[b], and the sons of Ammon gathered from their cities and came to battle.
translation:
  language: hi
  text: तब उन्होंने अपने लिए बत्तीस हज़ार रथ और माका के राजा को उसकी प्रजा सहित भाड़े पर लिया। वे आए और मेदबा के सामने डेरा डाला। अम्मोनी अपने नगरों से इकट्ठे हुए और युद्ध के लिए आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׂכְּרוּ לָהֶם
  choice: उन्होंने अपने लिए ... भाड़े पर लिया
  rationale: שׂכר का अर्थ भुगतान करके किसी सेवा या सैन्य सहायता को लेना है; हिन्दी में ‘भाड़े पर लिया’ इस भाव को स्वाभाविक रूप से व्यक्त करता है। לָהֶם के लाभार्थक भाव को ‘अपने लिए’ से रखा गया है।
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: बत्तीस हज़ार रथों
  rationale: संख्या को आधुनिक हिन्दी क्रम में रखा गया है। רֶכֶב का सीधा अर्थ ‘रथ’ है, पर यहाँ यह सामूहिक रूप से रथ-सेना भी सूचित कर सकता है; यह संभावना पाद-टिप्पणी में सुरक्षित है।
- source_word: מֶלֶךְ מַעֲכָה
  choice: माका के राजा
  rationale: इब्रानी संबंध-रचना किसी माका नामक स्थान/राज्य के राजा को सूचित करती है। नाम का हिन्दी लिप्यंतरण ‘माका’ रखा गया है।
- source_word: עַמּוֹ
  choice: उसकी प्रजा
  rationale: עַם का मूल अर्थ ‘लोग/प्रजा’ है। सैन्य संदर्भ में इससे राजा के सैनिक अभिप्रेत हो सकते हैं, पर ‘सेना’ कहने से पाठ आवश्यकता से अधिक संकीर्ण हो जाता।
- source_word: לִפְנֵי מֵידְבָא
  choice: मेदबा के सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ यहाँ ‘सामने’ है, जो नगर के निकट या उसके सम्मुख पड़ाव का भाव बिना अतिरिक्त व्याख्या के देता है।
- source_word: בְנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक रूप ‘अम्मोन के पुत्र’ एक प्रचलित जातीय पद है। आधुनिक हिन्दी में पूरे जातीय समुदाय के लिए ‘अम्मोनी’ अधिक स्वाभाविक और लिंग की दृष्टि से अनावश्यक रूप से सीमित नहीं है।
- source_word: נֶאֶסְפוּ מֵעָרֵיהֶם
  choice: अपने नगरों से इकट्ठे होकर
  rationale: निफ़अल रूप सैन्य जमाव को व्यक्त करता है। ‘अपने नगरों से इकट्ठे होकर’ स्रोत के स्थानवाचक संबंध और घटनाक्रम दोनों को सहज हिन्दी में रखता है।
- source_word: וַיָּבֹאוּ לַמִּלְחָמָה
  choice: युद्ध के लिए कूच किया
  rationale: शाब्दिक अर्थ ‘युद्ध के लिए आए’ है। सैन्य संदर्भ में ‘कूच किया’ लक्ष्य की ओर निकलने/आने का स्वाभाविक हिन्दी रूप है, जबकि לַמִּלְחָמָה का प्रयोजन ‘युद्ध के लिए’ से स्पष्ट रहता है।
