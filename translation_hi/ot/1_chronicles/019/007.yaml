  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। ‘भाड़े पर लिया’, ‘डेरा डाला’ और ‘कूच किया’ सामान्य पाठक के लिए स्पष्ट हैं। स्रोत की सामूहिक ‘रथ’ संज्ञा और בְנֵי עַמּוֹן की शाब्दिक जातीय अभिव्यक्ति को पाद-टिप्पणियों में सुरक्षित रखा गया है।
