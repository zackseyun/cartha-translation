translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथात्मक रूप अपनाया गया है। व्यक्तिनाम और जाति/स्थाननाम इब्रानी रूपों के निकट लिप्यंतरित हैं। मुख्य पाठ मूल इतिहास-वृत्तान्त के आँकड़े और सैनिक वर्ग सुरक्षित रखता है; समानांतर शमूएल-पाठ के भेद पादटिप्पणियों में दर्ज हैं।
