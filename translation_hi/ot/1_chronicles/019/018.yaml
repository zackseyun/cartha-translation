  text: וַ/יָּ֣נָס אֲרָם֮ מִ/לִּ/פְנֵ֣י יִשְׂרָאֵל֒ וַ/יַּהֲרֹ֨ג דָּוִ֜יד מֵ/אֲרָ֗ם שִׁבְעַ֤ת אֲלָפִים֙ רֶ֔כֶב וְ/אַרְבָּעִ֥ים אֶ֖לֶף אִ֣ישׁ רַגְלִ֑י וְ/אֵ֛ת שׁוֹפַ֥ךְ שַֽׂר הַ/צָּבָ֖א הֵמִֽית־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/018.yaml
  text: And Aram fled before Israel[a], and David killed seven thousand chariot warriors from Aram and forty thousand foot soldiers[b], and he put Shophach the commander of the army to death.
translation:
  language: hi
  text: और अराम इस्राएल के सामने से भाग गया।[a] दाऊद ने अराम के सात हज़ार रथ-योद्धाओं और चालीस हज़ार पैदल सैनिकों को मार डाला, और सेनापति शोफक को मृत्यु के घाट उतार दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 शमूएल 10:18 के समानांतर विवरण में “सात सौ रथों और चालीस हज़ार घुड़सवारों” का उल्लेख है। यहाँ इतिहास-वृत्तान्त के पाठ में “सात हज़ार रथ-योद्धा और चालीस हज़ार पैदल सैनिक” हैं।
    reason: textual_variant
  - marker: b
    text: 2 शमूएल 10:16, 18 के समानांतर विवरण में शोफक का नाम “शोबक” है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֲרָם
  choice: अराम
  rationale: स्थान/जनसमूह के इब्रानी नाम का लिप्यंतरण रखा गया है; प्रसंग में इससे अरामी सेना अभिप्रेत है, पर ‘सीरिया’ कहना बाद की भौगोलिक संज्ञा आरोपित करता।
- source_word: וַיָּנָס ... מִלִּפְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सामने से भाग गया
  rationale: נוּס का सीधा अर्थ ‘भागना’ है और מִלִּפְנֵי युद्ध में किसी के सामने से पराजित होकर भागने को व्यक्त करता है।
- source_word: וַיַּהֲרֹג דָּוִיד
  choice: दाऊद ने ... मार डाला
  rationale: הרג के लिए यह स्पष्ट, स्वाभाविक और आधुनिक हिन्दी प्रयोग है।
- source_word: שִׁבְעַת אֲלָפִים רֶכֶב
  choice: सात हज़ार रथ-योद्धाओं
  rationale: רֶכֶב मूलतः रथ अथवा रथ-सेना को सूचित करता है। यहाँ संख्या युद्धरत रथ-दल के लोगों के लिए लक्षणा के रूप में समझी गई है; ‘रथ-योद्धा’ केवल सारथियों तक अर्थ सीमित नहीं करता।
- source_word: וְאַרְבָּעִים אֶלֶף אִישׁ רַגְלִי
  choice: चालीस हज़ार पैदल सैनिकों
  rationale: אִישׁ רַגְלִי का शाब्दिक भाव ‘पैदल मनुष्य’ है और सैन्य प्रसंग में यह पैदल सैनिकों को दर्शाता है।
- source_word: שׁוֹפַךְ
  choice: शोफक
  rationale: इतिहास-वृत्तान्त में प्राप्त नाम-रूप का देवनागरी लिप्यंतरण है; समानांतर शमूएल-पाठ का ‘शोबक’ पादटिप्पणी में दिया गया है।
- source_word: שַׂר הַצָּבָא
  choice: सेनापति
  rationale: शाब्दिक ‘सेना का प्रधान’ के लिए संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी पद।
- source_word: הֵמִית
  choice: मृत्यु के घाट उतार दिया
  rationale: מות के हिफ़ईल रूप का अर्थ ‘मरवा देना/मृत्यु देना’ है। यह पहले आए הרג से शैलीगत भेद भी बनाए रखता है।
