  edition: WLC
  text: וַ/יֹּ֗אמֶר אִם תֶּחֱזַ֤ק מִמֶּ֨/נִּי֙ אֲרָ֔ם וְ/הָיִ֥יתָ לִּ֖/י לִ/תְשׁוּעָ֑ה וְ/אִם בְּנֵ֥י עַמּ֛וֹן יֶֽחֶזְק֥וּ מִמְּ/ךָ֖ וְ/הוֹשַׁעְתִּֽי/ךָ־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/012.yaml
  text: And he said[a], “If Aram is too strong for me, then you shall be my salvation; but if the Ammonites are too strong for you[b], then I will save you.”
translation:
  language: hi
  text: उसने कहा, “यदि अराम मुझ पर भारी पड़े, तो तुम मेरे बचाव के लिए आना; और यदि अम्मोनी तुम पर भारी पड़ें, तो मैं तुम्हें बचाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֶּחֱזַק / יֶחֶזְקוּ (חזק + מן)
  choice: मुझ पर / तुम पर भारी पड़े / पड़ें
  rationale: युद्ध के संदर्भ में חזק מן तुलनात्मक रूप से अधिक शक्तिशाली होने या किसी पर प्रबल पड़ने को व्यक्त करता है। ‘भारी पड़ना’ आधुनिक हिन्दी में इसी सैन्य भाव को स्वाभाविक ढंग से संप्रेषित करता है।
- source_word: אֲרָם
  choice: अराम
  rationale: मूल पाठ में देश अथवा जाति का नाम ‘अराम’ है; इसे बाद के भौगोलिक नाम ‘सीरिया’ से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: וְהָיִיתָ לִּי לִתְשׁוּעָה
  choice: तुम मेरी सहायता के लिए आना
  rationale: शाब्दिक अर्थ ‘तुम मेरे लिए उद्धार ठहरना’ है, पर युद्ध की स्थिति में यह साथी सेना द्वारा बचाव के लिए आने का मुहावरा है। चुना गया रूप स्वाभाविक हिन्दी में व्यावहारिक सैन्य सहायता का भाव रखता है।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनी
  rationale: ‘अम्मोन के पुत्र’ यहाँ जातिवाचक पद है। ‘अम्मोनी’ उसका स्वाभाविक और प्रचलित हिन्दी रूप है।
- source_word: וְהוֹשַׁעְתִּיךָ (ישע, Hiphil)
  choice: मैं तुम्हारी सहायता के लिए आऊँगा
  rationale: क्रिया का अर्थ बचाना या छुड़ाना है। समानांतर सैन्य व्यवस्था को स्पष्ट और सहज रखने के लिए इसे सहायता के लिए आने के रूप में व्यक्त किया गया है; इसमें वास्तविक बचाव का आशय निहित है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: हिब्रू कथात्मक क्रम को हिन्दी में अनावश्यक ‘और’ जोड़े बिना स्वाभाविक कथन के रूप में प्रस्तुत किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी है। ‘भारी पड़ना’ युद्ध में अधिक शक्तिशाली सिद्ध होने का स्वाभाविक मुहावरा है। दोनों खंडों की समानांतर संरचना बनाए रखी गई है और ‘उद्धार’ जैसे संभावित रूप से व्यापक धार्मिक अर्थ वाले शब्द के बजाय तत्काल सैन्य सहायता का संदर्भ स्पष्ट किया गया है।
