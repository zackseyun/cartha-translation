  text: וַ/יִּרְא֞וּ עַבְדֵ֣י הֲדַדְעֶ֗זֶר כִּ֤י נִגְּפוּ֙ לִ/פְנֵ֣י יִשְׂרָאֵ֔ל וַ/יַּשְׁלִ֥ימוּ עִם דָּוִ֖יד וַ/יַּֽעַבְדֻ֑/הוּ וְ/לֹא אָבָ֣ה אֲרָ֔ם לְ/הוֹשִׁ֥יעַ אֶת בְּנֵי עַמּ֖וֹן עֽוֹד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/019.yaml
  text: When the servants of Hadadezer saw that they had been defeated before Israel[a], they made peace with David and served him. And Aram was no longer willing to help the sons of Ammon.
translation:
  language: hi
  text: जब हदद-एजेर के सेवकों ने देखा कि वे इस्राएल के सामने पराजित हो गए थे, तो उन्होंने दाऊद से संधि कर ली और उसकी सेवा की। और अराम अम्मोनियों[a] की सहायता करने को अब और तैयार नहीं हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अम्मोन के पुत्र’; यह अम्मोनियों के लिए प्रयुक्त जातिवाचक अभिव्यक्ति है।
    reason: स्रोत की शाब्दिक अभिव्यक्ति और उसके जातिवाचक प्रयोग दोनों को दर्ज करना।
lexical_decisions:
- source_word: עַבְדֵי הֲדַדְעֶזֶר
  choice: हदद-एजेर के सेवकों
  rationale: राजकीय और सैनिक संदर्भ में עַבְדֵי अधीनस्थ अधिकारियों या अनुचरों को सूचित करता है; ‘सेवकों’ से अधीनता बनी रहती है, पर दासत्व का अनावश्यक अर्थ नहीं आता।
- source_word: נִגְּפוּ לִפְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सामने पराजित हो गए
  rationale: निफ़अल रूप सैनिक पराजय व्यक्त करता है। ‘के सामने’ לִפְנֵי की स्रोत-छवि को सुरक्षित रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: וַיַּשְׁלִימוּ עִם דָּוִיד
  choice: दाऊद से संधि कर ली
  rationale: हिफ़इल שלם עם का अर्थ शांति या समझौता स्थापित करना है; इस राजनैतिक संदर्भ में ‘संधि कर ली’ सहज और सटीक है।
- source_word: וַיַּעַבְדֻהוּ
  choice: उसके अधीन होकर उसकी सेवा करने लगे
  rationale: यहाँ עבד राजनैतिक अधीनता और सेवा दोनों व्यक्त करता है। विस्तृत हिन्दी रूप उस आशय को स्पष्ट करता है और प्रत्यय का संकेत दाऊद की ओर रखता है।
- source_word: אֲרָם
  choice: अराम
  rationale: यह इब्रानी भौगोलिक-जातीय नाम है; ‘सीरिया’ जैसे बाद के नाम के स्थान पर स्रोत का नाम रखा गया है। एकवचन क्रिया के अनुरूप इसे सामूहिक सत्ता के रूप में प्रस्तुत किया गया है।
- source_word: לְהוֹשִׁיעַ
  choice: सहायता करने
  rationale: सैनिक गठबंधन के संदर्भ में क्रिया का आशय किसी की मदद को आना है; ‘सहायता’ स्वाभाविक है और यहाँ अनपेक्षित धार्मिक अर्थ नहीं जोड़ती।
- source_word: בְּנֵי עַמּוֹן
  choice: अम्मोनियों
  rationale: शाब्दिक अर्थ ‘अम्मोन के पुत्र’ है, पर यह एक प्रचलित जातिवाचक पद है। आधुनिक हिन्दी में ‘अम्मोनियों’ उसका स्वाभाविक और समावेशी जातीय रूप है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְלֹא אָבָה ... עוֹד
  choice: फिर तैयार नहीं हुआ
  rationale: אָבָה इच्छा या तत्परता और निषेध के साथ עוֹד ‘फिर/अब और’ का भाव देता है; यह हिन्दी वाक्य निरंतर सहायता से इनकार को स्पष्ट करता है।
