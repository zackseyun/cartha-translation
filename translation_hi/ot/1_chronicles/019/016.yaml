base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/019/016.yaml
  text: When Aram saw that they had been defeated before Israel[a], they sent messengers and brought out the Arameans who were from beyond the River[b], with Shophach the commander of Hadadezer’s army before them.
translation:
  language: hi
  text: जब अराम[a] ने देखा कि वे इस्राएल के सामने पराजित हो चुके थे, तो उन्होंने दूत भेजे और नदी के पार के अरामियों को बुला लिया। हददेजेर की सेना का सेनापति शोफक उनके आगे था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवादों में ‘सीरिया’; इब्रानी में ‘अराम’।
    reason: lexical_alternative
  - marker: b
    text: ‘नदी’ से सम्भवतः फ़रात नदी अभिप्रेत है; इब्रानी में केवल ‘नदी के पार’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרָם
  choice: अराम / अरामी
  rationale: इब्रानी में यही नाम राज्य अथवा समूह और उसके लोगों—दोनों के लिए आया है। मुख्य पाठ में ‘अराम’ और ‘अरामी’ मूल नाम को सुरक्षित रखते हैं; पारंपरिक ‘सीरिया/सीरियाई’ को पादटिप्पणी में दिया गया है।
- source_word: נִגְּפוּ
  choice: पराजित हो गए
  rationale: निफ़अल रूप यहाँ युद्ध में हारने का अर्थ देता है; यह सहज आधुनिक हिन्दी है और पूर्ण विनाश का भाव नहीं जोड़ता।
- source_word: לִפְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सामने
  rationale: यह मूल मुहावरे ‘इस्राएल के मुख के सामने’ के निकट है और प्रसंग में इस्राएल के हाथों हुई पराजय का बोध कराता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजनीतिक और सैनिक प्रसंग में इससे मानव संदेशवाहक अभिप्रेत हैं, स्वर्गदूत नहीं।
- source_word: וַיּוֹצִיאוּ אֶת אֲרָם
  choice: अरामियों को बुलवा लिया
  rationale: हिफ़ईल क्रिया का मूल भाव ‘बाहर निकलवाना/ले आना’ है; यहाँ अतिरिक्त अरामी सेना को युद्ध के लिए जुटाने का आशय स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵעֵבֶר הַנָּהָר
  choice: नदी पार के
  rationale: इब्रानी पाठ केवल ‘नदी के पार’ कहता है और नदी का नाम नहीं देता; सम्भावित फ़रात नदी की पहचान पादटिप्पणी में रखी गई है।
- source_word: שַׂר צְבָא הֲדַדְעֶזֶר
  choice: हददएजेर की सेना का प्रधान
  rationale: यह सैनिक पदवी को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִפְנֵיהֶם
  choice: उनके आगे था
  rationale: शाब्दिक स्थान-सूचक अभिव्यक्ति को सुरक्षित रखा गया है; प्रसंग में इससे शोफक के सेना के अग्रभाग में होने अथवा उसका नेतृत्व करने का भाव निकलता है।
