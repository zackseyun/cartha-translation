source:
  edition: WLC
  text: וּ/לְ/עֵ֥בֶר יֻלַּ֖ד שְׁנֵ֣י בָנִ֑ים שֵׁ֣ם הָ/אֶחָ֞ד פֶּ֗לֶג כִּ֤י בְ/יָמָי/ו֙ נִפְלְגָ֣ה הָ/אָ֔רֶץ וְ/שֵׁ֥ם אָחִ֖י/ו יָקְטָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/019.yaml
  text: 'And to Eber were born two sons: the name of the one was Peleg[a], because in his days the earth was divided; and his brother’s name was Joktan.'
translation:
  language: hi
  text: एबेर के यहाँ दो पुत्र जन्मे। एक का नाम पेलेग था, क्योंकि उसके दिनों में पृथ्वी[a] बँट गई थी; और उसके भाई का नाम योक्तान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि बँट गई थी।” इब्रानी शब्द का अर्थ पूरी पृथ्वी या कोई भूमि/देश हो सकता है; पाठ यह नहीं बताता कि यह विभाजन किस प्रकार का था।
    reason: הָאָרֶץ की शाब्दिक अर्थ-सीमा और विभाजन के अनिर्दिष्ट स्वरूप को सुरक्षित रखना।
lexical_decisions:
- source_word: וּלְעֵבֶר
  choice: एबेर के यहाँ
  rationale: यह वंशावली के प्रवाह और इब्रानी के अप्रत्यक्ष संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। आरम्भिक וּ का संबंध पिछले वंशावली-वाक्य से है; हिन्दी में अलग पद के आरम्भ पर उसे अनिवार्य रूप से ‘और’ कहना अस्वाभाविक होता।
- source_word: יֻלַּד שְׁנֵי בָנִים
  choice: दो पुत्र जन्मे
  rationale: ‘जन्मे’ मूल की निष्क्रिय जन्म-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है, और ‘पुत्र’ בָנִים के पुरुष-सूचक अर्थ को वंशावली के संदर्भ में सुरक्षित रखता है।
- source_word: שֵׁם הָאֶחָד
  choice: एक का नाम
  rationale: यह ‘एक’ और दूसरे भाई के बीच मूल पाठ के भेद को बनाए रखता है, पर उसे ‘पहला’ कहकर अनावश्यक क्रम निर्धारित नहीं करता।
- source_word: פֶּלֶג
  choice: पेलेग
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כִּי בְיָמָיו
  choice: क्योंकि उसके दिनों में
  rationale: ‘क्योंकि’ नाम के स्पष्टीकरण का कारण-संबंध स्पष्ट करता है; ‘उसके दिनों में’ मूल मुहावरे को गरिमापूर्ण और बोधगम्य हिन्दी में रखता है।
- source_word: נִפְלְגָה הָאָרֶץ
  choice: पृथ्वी बँट गई थी
  rationale: נִפְלְגָה का विभाजित होने का भाव ‘बँट गई’ से स्वाभाविक ढंग से आता है। הָאָרֶץ के व्यापक अर्थ को मुख्य पाठ में ‘पृथ्वी’ से रखा गया है, जबकि ‘देश/भूमि’ की वास्तविक शाब्दिक संभावना पादटिप्पणी में दी गई है।
- source_word: וְשֵׁם אָחִיו
  choice: और उसके भाई का नाम
  rationale: मूल के संयोजक और संबंधवाचक संरचना को सहज हिन्दी क्रम में सुरक्षित रखता है।
- source_word: יָקְטָן
  choice: योक्तान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions:
- issue: पेलेग के नामकरण में ‘पृथ्वी बँट गई’ का आशय
  choice: मुख्य पाठ में व्यापक और अनिर्दिष्ट कथन ‘पृथ्वी बँट गई थी’ रखा गया।
  alternative: ‘भूमि/देश बँट गया था’; बाबेल के बाद लोगों या भाषाओं का बँटवारा; अथवा कोई भौगोलिक विभाजन।
  rationale: इब्रानी पाठ विभाजन के स्वरूप को स्पष्ट नहीं करता। इसलिए अनुवाद किसी खास ऐतिहासिक या धर्मवैज्ञानिक व्याख्या को मुख्य पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण वंशावली-शैली। ‘एबेर के यहाँ’ और ‘दो पुत्र जन्मे’ सामान्य पाठक के लिए स्वाभाविक हैं। ‘बँट गई थी’ औपचारिक ‘विभाजित हुई’ की अपेक्षा अधिक सहज है, पर मूल अर्थ और उसकी अस्पष्टता बनाए रखता है।
