  text: और योक्तान से अल्मोदाद, शेलेफ़, हत्सर्मावेत और येरह उत्पन्न हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָקְטָן
  choice: योक्तान
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण; व्यक्ति का नाम होने के कारण अनुवाद नहीं किया गया।
- source_word: יָלַד
  choice: से ... उत्पन्न हुए
  rationale: वंशावली के संदर्भ में पुरुष पूर्वज से संतान होने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; इससे क्रिया का आशय बना रहता है और अनावश्यक रूप से प्रत्यक्ष पितृत्व की सीमा भी नहीं जोड़ी जाती।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है और हिन्दी में इसका स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: אַלְמוֹדָד
  choice: अल्मोदाद
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: שָׁלֶף
  choice: शेलेप
  rationale: इब्रानी שָׁלֶף के स्वरांकन के निकट देवनागरी लिप्यंतरण; अंतिम פ का उच्चारण यहाँ 'प' है।
- source_word: חֲצַרְמָוֶת
  choice: हसर्मावेत
  rationale: इब्रानी व्यक्ति-नाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण; ח और צ के लिए सामान्य हिन्दी में सुबोध रूप अपनाया गया है।
- source_word: יָרַח
  choice: येरह
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण; आरंभिक י को 'य' रखा गया है।
