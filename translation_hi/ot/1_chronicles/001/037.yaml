  text: 'The sons of Reuel: Nahath, Zerah, Shammah, and Mizzah.'
translation:
  language: hi
  text: 'रऊएल के पुत्र: नहत, जेरह, शम्मा और मिज्जा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन रूप है और वंशावली में रऊएल की तत्काल संतान का परिचय देता है; इसलिए ‘पुत्र’ सीधा और स्वाभाविक है।
- source_word: רְעוּאֵל
  choice: रऊएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; स्वरक्रम को यथासंभव सुरक्षित रखा गया है।
- source_word: נַחַת
  choice: नहत
  rationale: व्यक्तिगत नाम का अनुवाद न करके इब्रानी से लिप्यंतरण किया गया है।
- source_word: זֶרַח
  choice: जेरह
  rationale: यहाँ शब्द व्यक्तिगत नाम है, इसलिए उसके शाब्दिक अर्थ के बजाय लिप्यंतरण किया गया है; आरंभिक इब्रानी ז को प्रचलित हिन्दी बाइबलीय रूप के अनुसार ‘ज’ से दर्शाया गया है।
- source_word: שַׁמָּה
  choice: शम्मा
  rationale: व्यक्तिगत नाम का लिप्यंतरण; दागेश से सूचित व्यंजन-द्वित्व को ‘म्म’ द्वारा दर्शाया गया है।
- source_word: וּ/מִזָּה
  choice: और मिज्जा
  rationale: וּ को ‘और’ तथा व्यक्तिगत नाम מִזָּה को ‘मिज्जा’ किया गया है; दागेश के कारण व्यंजन-द्वित्व ‘ज्ज’ में सुरक्षित है।
