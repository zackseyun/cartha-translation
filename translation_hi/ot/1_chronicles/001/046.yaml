translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, कथात्मक और गरिमापूर्ण रखी गई है। लंबी हिब्रू समन्वयी संरचना को तीन वाक्यों में बाँटा गया है ताकि सामान्य पाठक संबंधों को सहजता से समझ सके; अर्थगत क्रम और हदद पर दिया गया बल सुरक्षित है।
