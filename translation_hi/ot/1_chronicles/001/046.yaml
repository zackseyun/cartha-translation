  text: וַ/יָּ֖מָת חוּשָׁ֑ם וַ/יִּמְלֹ֨ךְ תַּחְתָּ֜י/ו הֲדַ֣ד בֶּן בְּדַ֗ד הַ/מַּכֶּ֤ה אֶת מִדְיָן֙ בִּ/שְׂדֵ֣ה מוֹאָ֔ב וְ/שֵׁ֥ם עִיר֖/וֹ עיות־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/046.yaml
  text: And Husham died[a], and Hadad son of Bedad reigned in his place, who struck Midian in the field of Moab; and the name of his city was Avith.
translation:
  language: hi
  text: हूशाम मर गया, और उसके स्थान पर बदद का पुत्र हदद राजा हुआ। उसी ने मोआब के मैदान में मिद्यान पर प्रहार किया था। उसके नगर का नाम अवीत[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नगर के नाम का एक अन्य लिप्यंतरण ‘अय्योत’ है।
    reason: मूल नाम की वर्तनी और पाठ-परंपरा के कारण लिप्यंतरण में भिन्नता मिलती है।
lexical_decisions:
- source_word: וַיָּמָת חוּשָׁם
  choice: हूशाम मर गया
  rationale: מות का सीधा और सामान्य अर्थ ‘मरना’ है; ‘स्वर्ग सिधार गया’ जैसे व्यंजक मूल पाठ में निहित नहीं हैं। हूशाम नाम का निकट देवनागरी लिप्यंतरण है।
- source_word: וַיִּמְלֹךְ תַּחְתָּיו
  choice: उसके स्थान पर … राजा हुआ
  rationale: यहाँ מלך राजपद ग्रहण करने को और תחתיו पूर्ववर्ती राजा का स्थान लेने को व्यक्त करता है। यह हिंदी में स्वाभाविक रहते हुए दोनों भाव सुरक्षित रखता है।
- source_word: הֲדַד בֶּן־בְּדַד
  choice: बदद का पुत्र हदद
  rationale: בן के वंश-संबंध को स्पष्ट रूप से रखा गया है और दोनों व्यक्तिनामों का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: הַמַּכֶּה אֶת־מִדְיָן
  choice: उसी ने … मिद्यान को पराजित किया था
  rationale: नכה का मूल भाव ‘मारना/प्रहार करना’ है, पर राजकीय युद्ध के इस संदर्भ में हिंदी का ‘पराजित करना’ अभिप्रेत सैन्य विजय को स्वाभाविक और अस्पष्टतारहित ढंग से व्यक्त करता है। ‘उसी ने’ कृदंत द्वारा हदद की पहचान कराने वाले बल को बनाए रखता है।
- source_word: בִּשְׂדֵה מוֹאָב
  choice: मोआब के मैदान में
  rationale: שׂדה का शाब्दिक अर्थ ‘मैदान/खुला क्षेत्र’ है। ‘मोआब के मैदान’ रूप मूल की संबंधवाचक संरचना और संभावित भौगोलिक अर्थ दोनों को सुरक्षित रखता है।
- source_word: וְשֵׁם עִירוֹ
  choice: उसके नगर का नाम … था
  rationale: हिब्रू की प्रचलित नामकरण-संरचना को स्पष्ट, गरिमापूर्ण आधुनिक हिंदी में प्रस्तुत किया गया है।
- source_word: עיות
  choice: अवीत
  rationale: समानांतर वंशावली और प्रचलित पाठ-परंपरा के आधार पर नगर का नाम ‘अवीत’ लिप्यंतरित किया गया है; उपलब्ध व्यंजनात्मक रूप के कारण वैकल्पिक लिप्यंतरण फुटनोट में दिया गया है।
