  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְֽ/אֶת פַּתְרֻסִ֞ים וְ/אֶת כַּסְלֻחִ֗ים אֲשֶׁ֨ר יָצְא֥וּ מִ/שָּׁ֛ם פְּלִשְׁתִּ֖ים וְ/אֶת כַּפְתֹּרִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/012.yaml
  text: and the Pathrusites[a], and the Casluhites (from whom the Philistines came), and the Caphtorites.
translation:
  language: hi
  text: और पत्रूसी, कस्लूही—जिनसे पलिश्ती निकले[a]—और कप्तोरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वहाँ से पलिश्ती निकले।” यहाँ इतिहास-वृत्तांत के हिब्रू पाठ में यह वाक्य सबसे स्वाभाविक रूप से कस्लूहियों से जुड़ता है। उत्पत्ति 10:14 में भी यही शब्दावली है, जबकि व्यापक बाइबलीय परंपरा पलिश्तियों को कप्तोर से भी जोड़ती है (देखें आमोस 9:7; यिर्मयाह 47:4)।
    reason: cross_reference
lexical_decisions:
- source_word: פַּתְרֻסִים
  choice: पत्रूसी
  rationale: पत्रोस से जुड़े इस जाति-नाम का अर्थ अनिश्चित है; इसलिए हिब्रू रूप के निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: כַּסְלֻחִים
  choice: कस्लूही
  rationale: इस जाति की पहचान अनिश्चित है; अनावश्यक व्याख्या से बचते हुए नाम का लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר יָצְאוּ מִשָּׁם
  choice: जिनसे ... निकले
  rationale: शाब्दिक अर्थ ‘वहाँ से निकले’ है। वंशावली के संदर्भ में ‘जिनसे ... निकले’ स्वाभाविक हिन्दी है और निकटतम पूर्ववर्ती जाति कस्लूहियों को संभावित पूर्वपद मानता है; शाब्दिक रूप और परंपरागत तनाव पादटिप्पणी में सुरक्षित हैं।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस प्रसिद्ध जाति के लिए प्रचलित हिन्दी बाइबलीय नाम रखा गया है।
- source_word: כַּפְתֹּרִים
  choice: कप्तोरी
  rationale: कप्तोर से जुड़े जाति-नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: וְאֶת
  choice: और
  rationale: वंशावली की सूची में हिब्रू कर्मसूचक चिह्न का अलग अनुवाद आवश्यक नहीं; संयोजन को स्वाभाविक हिन्दी में ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: पलिश्तियों के उद्गमवाले संबंधवाचक उपवाक्य का पूर्वपद
  choice: मुख्य पाठ में इसे निकटतम जाति कस्लूहियों से जोड़ा गया है।
  alternative: ‘वहाँ से पलिश्ती निकले’ कहकर स्थानवाचक अस्पष्टता बनाए रखना, या इसे कप्तोरियों से जोड़ना।
  rationale: हिब्रू वाक्यक्रम में संबंधवाचक उपवाक्य कस्लूहियों के तुरंत बाद आता है, इसलिए यही सबसे स्वाभाविक व्याकरणिक संबंध है। फिर भी अन्य बाइबलीय पाठ पलिश्तियों को कप्तोर से जोड़ते हैं; इस तनाव को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। जाति-नामों के लिए हिन्दी बाइबलीय परंपरा के अनुरूप देवनागरी लिप्यंतरण और जातिवाचक रूप अपनाए गए हैं; डैश वंशावली की सूची में स्पष्टीकरणात्मक उपवाक्य को साफ़ दिखाते हैं।
