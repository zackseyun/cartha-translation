base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/044.yaml
  text: Bela died[a], and Jobab son of Zerah from Bozrah reigned in his place.
translation:
  language: hi
  text: बेला मर गया, और उसके स्थान पर ज़ेरह का पुत्र योबाब राजा हुआ, जो बोस्रा से था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो बोस्रा का था।” इब्रानी संबंधबोधक उपसर्ग नगर से उद्गम या उसके साथ संबंध—दोनों में से किसी को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूּת के वय्यिक्तोल रूप से कथा में अगली घटना व्यक्त होती है; हिंदी में ‘मर गया’ स्वाभाविक और सीधा है।
- source_word: בָּלַע
  choice: बेला
  rationale: व्यक्तिवाचक नाम का स्रोतानुकूल देवनागरी लिप्यंतरण।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: यहाँ קל रूप राजपद ग्रहण करने को सूचित करता है; ‘राजा हुआ’ उत्तराधिकार के प्रसंग में संक्षिप्त और स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के सूत्र में इसका अर्थ पूर्ववर्ती का स्थान लेना है।
- source_word: יוֹבָב
  choice: योबाब
  rationale: व्यक्तिवाचक नाम का स्रोतानुकूल देवनागरी लिप्यंतरण।
- source_word: בֶּן זֶרַח
  choice: ज़ेरह का पुत्र
  rationale: इब्रानी पितृनाम-संबंध को हिंदी में स्पष्ट और औपचारिक ढंग से व्यक्त करता है।
- source_word: מִבָּצְרָה
  choice: जो बोस्रा से था
  rationale: उपसर्ग מִן सामान्यतः उद्गम या किसी स्थान से संबंध बताता है; यह रूप योबाब के साथ संबंध स्पष्ट रखते हुए हिंदी में स्वाभाविक है।
