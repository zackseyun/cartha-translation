  text: मिस्राइम ने लूदीम, अनामीम, लहाबीम और नप्तूहीम को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִצְרַיִם
  choice: मिस्राइम
  rationale: वंशावली में यह व्यक्ति का नाम है; इसलिए स्थानवाचक ‘मिस्र’ के बजाय नाम का लिप्यंतरण किया गया है।
- source_word: יָלַד
  choice: से … उत्पन्न हुए
  rationale: हिब्रू वंशावली में यह क्रिया जनन के साथ वंशगत उद्भव भी व्यक्त कर सकती है। समूहों की सूची के संदर्भ में यह स्वाभाविक हिन्दी है और अनावश्यक रूप से निकट पिता-पुत्र संबंध तय नहीं करती।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्मसूचक चिह्न है; हिन्दी वाक्य-विन्यास में इसका अलग शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: לודיים
  choice: लूदी
  rationale: इसे जनसमूह के नाम के रूप में हिन्दी में स्वाभाविक जातिवाचक रूप दिया गया है; अधिक सीधा लिप्यंतरण पादटिप्पणी में रखा गया है।
- source_word: עֲנָמִים
  choice: अनामी
  rationale: आसपास के जनसमूहों के नामों के समान हिन्दी जातिवाचक रूप अपनाया गया है।
- source_word: לְהָבִים
  choice: लहाबी
  rationale: नाम को पठनीय हिन्दी जनसमूह-सूचक रूप में प्रस्तुत किया गया है।
- source_word: נַפְתֻּחִים
  choice: नप्तूही
  rationale: हिब्रू नाम का निकट और हिन्दी में उच्चारणयोग्य जनसमूह-सूचक रूप चुना गया है।
