source:
  edition: WLC
  text: וּ/בְנֵ֨י קְטוּרָ֜ה פִּילֶ֣גֶשׁ אַבְרָהָ֗ם יָלְדָ֞ה אֶת זִמְרָ֧ן וְ/יָקְשָׁ֛ן וּ/מְדָ֥ן וּ/מִדְיָ֖ן וְ/יִשְׁבָּ֣ק וְ/שׁ֑וּחַ וּ/בְנֵ֥י יָקְשָׁ֖ן שְׁבָ֥א וּ/דְדָֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/032.yaml
  text: 'And the sons of Keturah[a], Abraham’s concubine: she bore Zimran, Jokshan, Medan, Midian, Ishbak, and Shuah. And the sons of Jokshan: Sheba and Dedan.'
translation:
  language: hi
  text: 'अब्राहम की उपपत्नी कतूरा[a] के पुत्र ये थे: उसने जिम्रान, योक्षान, मदान, मिद्यान, यिशबाक और शूह को जन्म दिया। योक्षान के पुत्र शबा और ददान थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 25:1 में कतूरा को अब्राहम की पत्नी कहा गया है; यहाँ इतिहासकार उसे विशेष रूप से अब्राहम की उपपत्नी कहता है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: के पुत्र ये थे
  rationale: रचनात्मक बहुवचन का अर्थ स्पष्ट रखते हुए हिन्दी वंशावली की स्वाभाविक सूची-शैली अपनाई गई है; आरम्भिक וּ को पिछले पद से जुड़े क्रम में निहित माना गया है।
- source_word: קְטוּרָה
  choice: कतूरा
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: פִּילֶגֶשׁ
  choice: उपपत्नी
  rationale: यह शब्द मान्य वैवाहिक संबंध में मुख्य पत्नी से निम्न सामाजिक दर्जे वाली स्त्री को सूचित करता है। ‘उपपत्नी’ आधुनिक हिन्दी में ‘रखैल’ से अधिक गरिमापूर्ण और मूल के दर्जागत भेद के निकट है।
- source_word: יָלְדָה
  choice: उसने ... को जन्म दिया
  rationale: स्त्रीलिंग एकवचन क्रिया का कर्ता कतूरा है; हिन्दी में यह अभिव्यक्ति स्वाभाविक और स्पष्ट है।
- source_word: זִמְרָן וְיַקְשָׁן וּמְדָן וּמִדְיָן וְיִשְׁבָּק וְשׁוּחַ
  choice: जिम्रान, योक्षान, मदान, मिद्यान, यिशबाक और शूह
  rationale: नामों को हिन्दी की प्रचलित बाइबलीय वर्तनी और हिब्रू उच्चारण के निकट रूपों में लिप्यंतरित किया गया है।
- source_word: שְׁבָא וּדְדָן
  choice: शबा और ददान
  rationale: दोनों व्यक्तिवाचक नामों के प्रचलित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: अब्राहम के संबंध में कतूरा की स्थिति
  choice: उपपत्नी
  alternative: पत्नी
  rationale: इस पद में स्पष्ट रूप से פִּילֶגֶשׁ प्रयुक्त है। उत्पत्ति 25:1 में आए ‘पत्नी’ के साथ सामंजस्य बैठाने के लिए इतिहासकार की शब्दावली को बदला नहीं गया; दोनों वर्णनों के बीच का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वंशावली के अनुरूप संक्षिप्त रखी गई है। ‘उपपत्नी’ मूल के सामाजिक-दर्जागत अर्थ को बिना अपमानजनक रंग दिए व्यक्त करता है।
