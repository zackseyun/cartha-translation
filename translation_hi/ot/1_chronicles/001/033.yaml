base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/033.yaml
  text: 'The sons of Midian: Ephah[a], Epher, Hanoch, Abida, and Eldaah. All these were the sons of Keturah.'
translation:
  language: hi
  text: 'मिद्यान के पुत्र: एपा, एपेर, हनोक, अबीदा और एल्दाआ। ये सभी कतूरा के पुत्र थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי מִדְיָן
  choice: मिद्यान के पुत्र
  rationale: आरंभिक וּ को वंशावली की स्वाभाविक हिन्दी शैली में अलग से ‘और’ कहे बिना प्रस्तुत किया गया है; בְנֵי का संबंधवाचक बहुवचन ‘के पुत्र’ है।
- source_word: עֵיפָה
  choice: एपा
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित और सरल हिन्दी लिप्यंतरण।
- source_word: וָעֵפֶר
  choice: एपेर
  rationale: नाम को इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है; उपसर्गीय संयोजक को हिन्दी सूची-विन्यास से व्यक्त किया गया है।
- source_word: וַחֲנוֹךְ
  choice: हनोक
  rationale: חֲנוֹךְ का सीधा हिन्दी लिप्यंतरण; यह नाम अनूदित नहीं किया गया है।
- source_word: וַאֲבִידָע
  choice: अबीदा
  rationale: इब्रानी नाम का स्वाभाविक हिन्दी लिप्यंतरण।
- source_word: וְאֶלְדָּעָה
  choice: और एल्दा
  rationale: सूची की अंतिम इकाई होने के कारण संयोजक וְ को ‘और’ से स्पष्ट किया गया है; नाम को हिन्दी में संक्षिप्त, उच्चारण-सुलभ रूप दिया गया है।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: पूर्वोक्त सभी नामों को समेटने वाला स्वाभाविक हिन्दी संकेतवाचक पदबंध।
- source_word: בְּנֵי קְטוּרָה
  choice: कतूरा के पुत्र थे
  rationale: इब्रानी संबंधवाचक पदबंध को स्पष्ट हिन्दी वाक्य बनाने के लिए ‘थे’ जोड़ा गया है; इससे वंश-संबंध यथावत रहता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण वंशावली शैली अपनाई गई है। मूल पाठ में कोई व्याख्यात्मक विस्तार नहीं जोड़ा गया। परामर्शार्थ अंग्रेज़ी पाठ में [a] का स्थान ‘Ephah’ के बाद है, जबकि उसकी टिप्पणी ‘Hanoch’ से संबंधित है; इस असंगति को स्रोत-पाठ का भाग न मानते हुए हिन्दी मुख्य पाठ में वह त्रुटिपूर्ण टिप्पणी नहीं रखी गई।
