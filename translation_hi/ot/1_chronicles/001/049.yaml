  yaml_path: translation/ot/1_chronicles/001/049.yaml
  text: And Shaul died[a], and Baal-hanan son of Akbor reigned in his place.
translation:
  language: hi
  text: और शाऊल मर गया, और उसके स्थान पर अकबोर का पुत्र बाल-हानान राजा बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूल क्रिया מות का साधारण, स्पष्ट और गैर-व्यंजनापूर्ण कथात्मक अनुवाद; आरंभिक וַ का क्रमसूचक भाव ‘और’ से रखा गया है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण; परिचित हिन्दी रूप ‘शाऊल’ स्रोत के शָׁאוּל को पर्याप्त रूप से दर्शाता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा बना
  rationale: राजकीय उत्तराधिकार के इस सूत्र में क्रिया מלך केवल शासन की अवधि नहीं, सिंहासन ग्रहण करने की घटना भी व्यक्त करती है; ‘राजा बना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: תחת तथा तृतीय पुरुष प्रत्यय प्रतिस्थापन और राजकीय उत्तराधिकार बताते हैं; हिन्दी में यह सीधा और स्वाभाविक रूप है।
- source_word: בַּעַל חָנָן
  choice: बाल-हानान
  rationale: संयुक्त इब्रानी व्यक्तिगत नाम का स्रोत-निकट लिप्यंतरण; योजक-चिह्न दोनों घटकों को स्पष्ट रखता है।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंश-सूचना में בן यहाँ प्रत्यक्ष पुत्र-संबंध का सामान्य संकेत है।
- source_word: עַכְבּוֹר
  choice: अकबोर
  rationale: इब्रानी नाम का सरल देवनागरी लिप्यंतरण; כְּ के घर्षी उच्चारण को अत्यधिक तकनीकी रूप दिए बिना पठनीयता रखी गई है।
