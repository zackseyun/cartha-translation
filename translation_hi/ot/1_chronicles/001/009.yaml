    reason: lexical_alternative
  - marker: b
    text: इस वंशावली के नाम को “रामाह” भी लिखा जाता है; यह बाइबल में आए एक अन्य स्थान-नाम से भिन्न है।
    reason: lexical_alternative
  - marker: c
    text: इस नाम को परम्परागत रूप से “सबतेकाह” भी लिखा जाता है।
