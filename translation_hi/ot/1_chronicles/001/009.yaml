  text: 'The sons of Cush: Seba[a], Havilah, Sabta, Raama, and Sabteca[c][b]. And the sons of Raama: Sheba and Dedan.'
translation:
  language: hi
  text: 'और कूश के पुत्र: सबा, हवीला, सबता[a], रामा[b] और सबतेका[c]। और रामा के पुत्र: शबा और ददान।'
