base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/036.yaml
  text: 'The sons of Eliphaz: Teman[a], Omar, Zephi, Gatam, Kenaz, Timna[b], and Amalek.'
translation:
  language: hi
  text: 'एलीपज के पुत्र: तेमान, ओमार, सेपी[a], गाताम, कनज, तिम्ना[b] और अमालेक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘सेपी’ है; उत्पत्ति 36:11 में नाम का भिन्न रूप ‘सपो’ मिलता है।
    reason: textual_variant
  - marker: b
    text: उत्पत्ति 36:12 में तिम्ना को एलीपज की उपपत्नी और अमालेक को उसका पुत्र बताया गया है। यहाँ इतिहासवृत्त में दोनों नाम एलीपज के पुत्रों की सूची में आते हैं।
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का बहुवचन संबंधसूचक रूप है और वंशावली की सूची आरम्भ करता है; इसलिए ‘के पुत्र’ सीधा और स्वाभाविक अनुवाद है।
- source_word: אֱלִיפָז
  choice: एलीपज
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप के निकट लिप्यंतरित किया गया है।
- source_word: תֵּימָן
  choice: तेमान
  rationale: वंशावली में आए व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: אוֹמָר
  choice: ओमार
  rationale: व्यक्तिवाचक नाम का सीधा हिन्दी लिप्यंतरण।
- source_word: צְפִי
  choice: सपी
  rationale: मुख्य पाठ में इतिहासवृत्त के मसोराई रूप צְפִי को दर्शाया गया है; उत्पत्ति 36:11 का צְפוֹ एक भिन्न रूप है, जिसे पादटिप्पणी में रखा गया है।
- source_word: גַעְתָּם
  choice: गाताम
  rationale: व्यक्तिवाचक नाम का स्रोत-रूप के निकट हिन्दी लिप्यंतरण।
- source_word: קְנַז
  choice: कनज
  rationale: व्यक्तिवाचक नाम का सरल और पठनीय हिन्दी लिप्यंतरण।
- source_word: תִמְנָע
  choice: तिम्ना
  rationale: इस पद में स्वरांकित व्यक्तिवाचक नाम का लिप्यंतरण; इसे सूची के सदस्य के रूप में ही रखा गया है।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: व्यक्ति अथवा जातीय पूर्वज के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְ / וַ
  choice: अल्पविरामों वाली सूची और अंतिम नाम से पहले ‘और’
  rationale: इब्रानी में बार-बार आए संयोजकों को आधुनिक, स्वाभाविक हिन्दी सूची-शैली में व्यक्त किया गया है।
theological_decisions:
- issue: इस पद में तिम्ना और अमालेक का एलीपज से वंशावली-संबंध, उत्पत्ति 36:12 की तुलना में
  choice: इतिहासवृत्त के प्रत्यक्ष व्याकरण के अनुसार तिम्ना और अमालेक—दोनों को ‘एलीपज के पुत्र’ के अंतर्गत सूची में रखा गया है।
  alternative: उत्पत्ति 36:12 से सामंजस्य बैठाते हुए तिम्ना को एलीपज की उपपत्नी और अमालेक को उसके पुत्र के रूप में मुख्य पाठ में प्रस्तुत करना।
  rationale: मूल पद एक सरल सूची देता है। अनुवाद में उत्पत्ति के समानांतर विवरण को आरोपित करके इस तनाव को मिटाया नहीं गया; आवश्यक स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। नामों का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी विषयवस्तु का स्थान परस्पर उलटा दिखाई देता था; हिन्दी प्रारूप में पाठ-संबंध के अनुसार ‘सपी’ पर पाठांतर की और ‘तिम्ना’ पर वंशावली-संबंध की पादटिप्पणी लगाई गई है।
