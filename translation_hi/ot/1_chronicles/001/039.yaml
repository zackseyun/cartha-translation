  text: 'The sons of Lotan: Hori and Homam[a]; and Lotan’s sister was Timna.'
translation:
  language: hi
  text: लोतान के पुत्र होरी और होमाम[a] थे; और लोतान की बहन तिम्ना थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 36:22 की समानांतर वंशावली में यह नाम ‘हेमाम’ मिलता है, न कि ‘होमाम’।
    reason: textual_variant
lexical_decisions:
- source_word: וּבְנֵי
  choice: के पुत्र
  rationale: בְּנֵי रचनात्मक बहुवचन है और वंशावली के संदर्भ में इसका स्वाभाविक तथा सटीक हिन्दी रूप ‘के पुत्र’ है। आरंभिक וּ को अलग से ‘और’ कहना हिन्दी वाक्य में आवश्यक नहीं है।
- source_word: לוֹטָן
  choice: लोतान
  rationale: व्यक्तिवाचक नाम का स्रोत-पाठ के अनुरूप देवनागरी लिप्यंतरण।
- source_word: חֹרִי
  choice: होरी
  rationale: यहाँ वंशावली और रूपविज्ञान इसे जातिनाम नहीं, व्यक्तिवाचक नाम बताते हैं; इसलिए ‘होरी’ लिप्यंतरित किया गया है।
- source_word: וְהוֹמָם
  choice: और होमाम
  rationale: इतिहास-वृत्तांत के पाठ में नाम הוֹמָם है, इसलिए ‘होमाम’ रखा गया है। उत्पत्ति 36:22 में मिले भिन्न रूप को पादटिप्पणी में बताया गया है।
- source_word: וַאֲחוֹת לוֹטָן
  choice: और लोतान की बहन
  rationale: אֲחוֹת का अर्थ ‘बहन’ है। रचनात्मक संबंध को हिन्दी में ‘लोतान की बहन’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: תִּמְנָע
  choice: तिम्ना
  rationale: इस पद के व्यंजनात्मक रूप को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण।
