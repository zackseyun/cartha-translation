lexical_decisions:
- source_word: מִשְׁמָע
  choice: मिश्मा
  rationale: वंशावली में आया व्यक्तिवाचक नाम; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וְ/דוּמָה
  choice: दूमा
  rationale: דוּמָה व्यक्तिवाचक नाम है, इसलिए इसका लिप्यंतरण किया गया; सूची को स्वाभाविक हिन्दी में रखने के लिए यहाँ וְ को अलग से व्यक्त नहीं किया गया।
- source_word: מַשָּׂא
  choice: मस्सा
  rationale: इस वंशावली-संदर्भ में यह सामान्य संज्ञा नहीं, व्यक्तिवाचक नाम है; इसलिए अर्थानुवाद के बजाय लिप्यंतरण किया गया है।
- source_word: חֲדַד
  choice: हदद
  rationale: इतिहास की पुस्तक के हिब्रू पाठ में यही नाम है; समानांतर सूची के वैकल्पिक रूप को मुख्य पाठ में नहीं मिलाया गया।
- source_word: וְ/תֵימָא
  choice: और तेमा
  rationale: अंतिम नाम תֵימָא का लिप्यंतरण किया गया और וְ को हिन्दी सूची की स्वाभाविक अंतिम संयोजक रचना ‘और’ से व्यक्त किया गया।
