  yaml_path: translation/ot/1_chronicles/001/023.yaml
  text: and Ophir[a], Havilah, and Jobab. All these were the sons of Joktan.
translation:
  language: hi
  text: और ओपीर, हवीला और योबाब। ये सभी योक्तान के पुत्र[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वंशज।” इब्रानी में “योक्तान के पुत्र” है, पर वंशावलियों में “पुत्र” कभी-कभी व्यापक अर्थ में किसी वंश के लोगों को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶת
  choice: और
  rationale: אֵת प्रत्यक्ष कर्म का चिह्न है, जिसका हिन्दी में अलग अनुवाद आवश्यक नहीं; उपसर्ग ו सूची को जोड़ता है, इसलिए स्वाभाविक हिन्दी में ‘और’ रखा गया है।
- source_word: אוֹפִיר
  choice: ओपीर
  rationale: वंशावली में आया व्यक्तिनाम; मूल उच्चारण के निकट और हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरण।
- source_word: חֲוִילָה
  choice: हवीला
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: יוֹבָב
  choice: योबाब
  rationale: व्यक्तिनाम को मूल रूप के निकट हिन्दी में लिप्यंतरित किया गया है।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: यह पद पहले गिनाए गए सभी नामों का सार देता है; ‘ये सभी’ स्वाभाविक हिन्दी में संकेत और समग्रता दोनों बनाए रखता है।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: इब्रानी शब्द का सीधा अर्थ यहाँ पुल्लिंग बहुवचन ‘पुत्र’ है। वंशावली में इसका अर्थ कभी व्यापक ‘वंशज’ भी हो सकता है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: יָקְטָן
  choice: योक्तान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: בְּנֵי का वंशावली-संबंधी अर्थ
  choice: मुख्य पाठ में ‘पुत्र’
  alternative: ‘वंशज’
  rationale: मुख्य पाठ इब्रानी के स्पष्ट संबंध-सूचक शब्द को बनाए रखता है, जबकि वंशावली में संभव व्यापक अर्थ को पाद-टिप्पणी में दिया गया है; इससे वास्तविक अर्थ-परास बिना अनावश्यक निर्णय के सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पूर्ववर्ती वंशावली-सूची की निरंतरता है, इसलिए आरम्भिक ‘और’ सुरक्षित रखा गया है। नामों के बीच हिन्दी की स्वाभाविक सूची-रचना अपनाई गई है।
