  rationale: पहचानसूचक नामरहित वाक्य को वंशावली के भूतकालीन संदर्भ में स्वाभाविक आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यहाँ सूची में इश्माएल की पुरुष संतानों के नाम हैं, इसलिए शाब्दिक और संदर्भानुकूल ‘पुत्र’ चुना गया है।
- source_word: יִשְׁמָעֵאל
  choice: इश्माएल
  rationale: इब्रानी व्यक्तिवाचक नाम का स्रोत के निकट तथा हिंदी में सुबोध लिप्यंतरण।
