- source_word: יְטוּר
  choice: यतूर
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; आरंभिक व्यंजन और दीर्घ स्वर को स्रोत के निकट रखा गया है।
- source_word: נָפִישׁ
  choice: नापीश
  rationale: इब्रानी नाम का स्रोत-आधारित लिप्यंतरण; שׁ को हिंदी में स्वाभाविक रूप से ‘श’ लिखा गया है।
- source_word: וָ/קֵדְמָה
  choice: और केदेमा
  rationale: ו को ‘और’ तथा קֵדְמָה को ‘केदेमा’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֵלֶּה הֵם
