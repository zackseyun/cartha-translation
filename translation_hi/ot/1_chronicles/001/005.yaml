base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/005.yaml
  text: 'The sons of Japheth: Gomer[a], Magog, Madai, Javan, Tubal, Meshech, and Tiras.'
translation:
  language: hi
  text: 'यापेत के पुत्र: गोमेर[a], मागोग, मादै, यावान, तूबल, मेशेक और तीरास।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘के पुत्र’ वंशावली के प्रसंग में सीधे पुत्रों या व्यापक अर्थ में वंशजों को सूचित कर सकता है; यहाँ इससे यापेत की वंश-परंपरा की सूची आरम्भ होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन रूप है और वंशावली की सूची आरम्भ करता है। यहाँ ‘पुत्र’ औपचारिक अर्थ को बनाए रखता है, यद्यपि वंशावली के प्रसंग में यह कभी-कभी व्यापक वंशजों को भी सूचित कर सकता है।
- source_word: יֶפֶת
  choice: यापेत
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: גֹּמֶר
  choice: गोमेर
  rationale: वंशावली में आया व्यक्तिवाचक नाम; अर्थानुवाद के बजाय लिप्यंतरण किया गया है।
- source_word: מָגוֹג
  choice: मागोग
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: מָדַי
  choice: मादै
  rationale: यहाँ इसे किसी जातीय पहचान के रूप में व्याख्यायित करने के बजाय वंशावली के नाम के रूप में लिप्यंतरित किया गया है।
- source_word: יָוָן
  choice: यावान
  rationale: यूनान/आयोनिया से संभावित संबंध की व्याख्या मुख्य पाठ में आरोपित किए बिना नाम को लिप्यंतरित किया गया है।
- source_word: תֻבָל
  choice: तूबल
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण।
- source_word: מֶשֶׁךְ
  choice: मेशेक
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण।
- source_word: תִירָס
  choice: तीरास
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण।
- source_word: וְ / וּ
  choice: अल्पविरामों वाली सूची और अंतिम नाम से पहले ‘और’
  rationale: इब्रानी में अधिकांश नामों के पहले संयोजक है; आधुनिक स्वाभाविक हिन्दी में सूची का वही कार्य अल्पविरामों और अंतिम ‘और’ से स्पष्ट होता है।
