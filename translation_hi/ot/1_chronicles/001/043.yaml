source:
  edition: WLC
  text: וְ/אֵ֣לֶּה הַ/מְּלָכִ֗ים אֲשֶׁ֤ר מָלְכוּ֙ בְּ/אֶ֣רֶץ אֱד֔וֹם לִ/פְנֵ֥י מְלָךְ מֶ֖לֶךְ לִ/בְנֵ֣י יִשְׂרָאֵ֑ל בֶּ֚לַע בֶּן בְּע֔וֹר וְ/שֵׁ֥ם עִיר֖/וֹ דִּנְהָֽבָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/043.yaml
  text: 'And these are the kings who reigned in the land of Edom before any king reigned over the sons of Israel: Bela son of Beor, and the name of his city was Dinhabah.'
translation:
  language: hi
  text: 'और ये वे राजा हैं जिन्होंने एदोम देश में इस्राएलियों पर किसी राजा के राज्य करने से पहले[a] राज्य किया था: बओर का पुत्र बेला; और उसके नगर का नाम दिन्हाबा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों पर एक राजा के राज्य करने से पहले।” इब्रानी में शाब्दिक रूप से, “इस्राएल के पुत्रों के लिए राजा के राज्य करने से पहले” है; यहाँ ‘के लिए’ का अर्थ प्रसंगानुसार ‘उन पर’ भी हो सकता है।
    reason: इब्रानी में ‘राजा’ एकवचन और अनिश्चित है, और לְ संबंध को शाब्दिक रूप से ‘के लिए’ अथवा प्रसंगानुसार ‘पर’ व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וְאֵלֶּה הַמְּלָכִים
  choice: और ये वे राजा हैं
  rationale: संयोजक और संकेतवाचक पद इतिहास-सूची की निरंतरता बनाए रखते हुए राजाओं की सूची प्रस्तुत करते हैं।
- source_word: אֲשֶׁר מָלְכוּ בְּאֶרֶץ אֱדוֹם
  choice: जिन्होंने एदोम देश में ... राज्य किया था
  rationale: मָלְכוּ राजकीय शासन को व्यक्त करता है; ‘राज्य किया’ स्वाभाविक और गरिमापूर्ण हिन्दी है, और ‘देश’ मूल אֶרֶץ को बनाए रखता है।
- source_word: לִפְנֵי מְלָךְ מֶלֶךְ
  choice: किसी राजा के राज्य करने से पहले
  rationale: क्रिया के infinitive construct और उसी मूल के संज्ञापद से राजत्व आरम्भ होने का समय व्यक्त होता है। ‘किसी राजा’ सहज हिन्दी में अनिश्चित भाव देता है, जबकि पाठ की शाब्दिक अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों पर
  rationale: यहाँ לְ शासित लोगों से संबंध बताता है। ‘इस्राएलियों’ आधुनिक हिन्दी में ‘इस्राएल के पुत्रों’ का स्वाभाविक सामुदायिक रूप है और ‘पर’ राज्य करने का आशय स्पष्ट करता है।
- source_word: בֶּלַע בֶּן בְּעוֹר
  choice: बओर का पुत्र बेला
  rationale: व्यक्तिनामों का ध्वन्यात्मक लिप्यंतरण किया गया है और वंश-संबंध को स्पष्ट, पारंपरिक हिन्दी में रखा गया है।
- source_word: וְשֵׁם עִירוֹ דִּנְהָבָה
  choice: और उसके नगर का नाम दिन्हाबा था
  rationale: मूल नामवाचक वाक्य को स्वाभाविक हिन्दी भूतकाल में प्रस्तुत किया गया है; स्थाननाम का लिप्यंतरण किया गया है।
theological_decisions:
- issue: इस्राएल पर राजत्व से पहले का कथन
  choice: किसी राजा के राज्य करने से पहले
  alternative: एक राजा के राज्य करने से पहले
  rationale: इब्रानी מֶלֶךְ एकवचन और अनिश्चित है। प्रसंग सामान्यतः इस्राएल में राजतंत्र के आरम्भ की ओर संकेत करता है, पर ‘किसी’ और ‘एक’ दोनों व्याकरणतः संभव बारीकियाँ हैं; इसलिए मुख्य पाठ में सहज सामान्य अर्थ और पादटिप्पणी में निकटतर विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण ऐतिहासिक-सूची वाला लहजा रखा गया है। ‘इस्राएलियों’ सामान्य पाठक के लिए स्वाभाविक है; मूल की शाब्दिक अभिव्यक्ति ‘इस्राएल के पुत्रों’ को पादटिप्पणी में सुरक्षित रखा गया है।
