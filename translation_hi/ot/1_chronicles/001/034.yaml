  text: וַ/יּ֥וֹלֶד אַבְרָהָ֖ם אֶת יִצְחָ֑ק בְּנֵ֣י יִצְחָ֔ק עֵשָׂ֖ו וְ/יִשְׂרָאֵֽל־ס׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/034.yaml
  text: 'Abraham fathered Isaac[a]. The sons of Isaac: Esau and Israel.'
translation:
  language: hi
  text: 'अब्राहम से इसहाक उत्पन्न हुआ। इसहाक के पुत्र: एसाव और इस्राएल[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् याकूब।
    reason: पाठ में दिए नाम ‘इस्राएल’ की पहचान स्पष्ट करना।
lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: से ... उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने का भाव देता है। हिंदी में ‘अब्राहम से इसहाक उत्पन्न हुआ’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण वंशावली-शैली है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिंदी में इसका अलग शब्द नहीं, और इसका व्याकरणिक कार्य वाक्य-रचना में व्यक्त है।
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: בן का रचनात्मक बहुवचन अगली वंशावली शाखा का परिचय देता है; ‘इसहाक के पुत्र’ हिंदी में स्वाभाविक शीर्षक-सदृश सूत्र है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: וְיִשְׂרָאֵל
  choice: और इस्राएल
  rationale: इब्रानी पाठ में याकूब के लिए उसका नाम ‘इस्राएल’ ही है; अनुवाद उसे ‘याकूब’ से बदलकर पाठ का सामंजस्य नहीं करता।
theological_decisions:
- issue: उस वंशावली में יִשְׂרָאֵל का अनुवाद जहाँ आशय याकूब से है
  choice: इस्राएल
  alternative: याकूब
  rationale: पद स्पष्ट रूप से इसहाक के पुत्रों को ‘एसाव और इस्राएल’ कहता है। व्यक्ति याकूब ही है, फिर भी मूल पाठ के नाम को सुरक्षित रखा गया है; यह किसी विशिष्ट धर्मसिद्धान्त की अपेक्षा पाठनिष्ठा का विषय है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त और गरिमापूर्ण वंशावली-शैली। ‘जन्म दिया’ से बचा गया है क्योंकि हिंदी में वह सामान्यतः माता के लिए प्रयुक्त होता है। पाद-टिप्पणी का चिह्न ‘इस्राएल’ के बाद रखा गया है, क्योंकि टिप्पणी उसी नाम की पहचान बताती है।
