source:
  edition: WLC
  text: בְּנֵ֣י שֵׁ֔ם עֵילָ֣ם וְ/אַשּׁ֔וּר וְ/אַרְפַּכְשַׁ֖ד וְ/ל֣וּד וַ/אֲרָ֑ם וְ/ע֥וּץ וְ/ח֖וּל וְ/גֶ֥תֶר וָ/מֶֽשֶׁךְ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/017.yaml
  text: 'The sons of Shem: Elam[a], Asshur, Arpachshad, Lud, and Aram; Uz, Hul, Gether, and Meshech.'
translation:
  language: hi
  text: 'शेम के पुत्र: एलाम, अश्शूर, अर्पक्षद, लूद और अराम; ऊज़, हूल, गेतेर और मेशेक[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 10:23 की समानांतर वंशावली में “मेशेक” के स्थान पर “माश” है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का बहुवचन संबंध-रूप है और वंशावली का परिचय देता है। ‘पुत्र’ मूल इब्रानी के निकट रहते हुए हिन्दी में स्वाभाविक है; यहाँ व्यापक अर्थ ‘वंशज’ मानना आवश्यक नहीं।
- source_word: שֵׁם
  choice: शेम
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: עֵילָם
  choice: एलाम
  rationale: वंशावली में आए व्यक्तिवाचक नाम का प्रचलित और स्रोत-संगत लिप्यंतरण।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: यहाँ वंशावली के व्यक्ति का नाम है; इसलिए भौगोलिक नाम ‘असीरिया’ के बजाय इब्रानी नाम का लिप्यंतरण रखा गया।
- source_word: אַרְפַּכְשַׁד
  choice: अर्पक्षद
  rationale: इब्रानी व्यंजन-रूप के निकट, हिन्दी में पठनीय लिप्यंतरण।
- source_word: לוּד
  choice: लूद
  rationale: मूल में एकवचन व्यक्तिवाचक नाम है, इसलिए इसे किसी बहुवचन जातिनाम के रूप में नहीं दिया गया।
- source_word: אֲרָם
  choice: अराम
  rationale: वंशावली के व्यक्ति का नाम होने के कारण ‘सीरिया’ जैसे बाद के भौगोलिक नाम के बजाय लिप्यंतरण रखा गया।
- source_word: עוּץ
  choice: ऊज़
  rationale: इब्रानी नाम का उच्चारण-संगत देवनागरी लिप्यंतरण।
- source_word: חוּל
  choice: हूल
  rationale: इब्रानी नाम का सरल, पठनीय देवनागरी लिप्यंतरण।
- source_word: גֶתֶר
  choice: गेतेर
  rationale: इब्रानी स्वर-व्यंजन रूप के निकट देवनागरी लिप्यंतरण।
- source_word: מֶשֶׁךְ
  choice: मेशेक
  rationale: WLC के मासोरेटिक पाठ में यहाँ ‘मेशेक’ है; समानांतर वंशावली के भिन्न पाठ को पादटिप्पणी में सुरक्षित रखा गया।
theological_decisions:
- issue: ऊज़, हूल, गेतेर और मेशेक का वंशावली-संबंध
  choice: मूल पद की तरह सभी नामों को ‘शेम के पुत्र’ से जुड़ी एक ही सूची में रखा गया।
  alternative: उत्पत्ति 10:23 के आधार पर अंतिम चार नामों से पहले ‘अराम के पुत्र’ जोड़ना।
  rationale: WLC के इस पद में अंतिम चार नामों से पहले ‘अराम के पुत्र’ शब्द नहीं हैं। समानांतर पद के आधार पर उन्हें मुख्य पाठ में जोड़ना स्रोत की वास्तविक संरचना और उसके तनाव को चुपचाप सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। नामों को अनुवादित करने के बजाय इब्रानी के निकट देवनागरी में लिप्यंतरित किया गया है। अर्धविराम मूल सूची में अराम के बाद दिखने वाले विभाजन को संकेत करता है, पर अनुपस्थित शब्दों की पूर्ति नहीं करता। पादटिप्पणी-चिह्न संबंधित नाम ‘मेशेक’ के बाद रखा गया है।
