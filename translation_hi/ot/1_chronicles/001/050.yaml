base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/050.yaml
  text: Baal-hanan died[a], and Hadad reigned in his place. The name of his city was Pai, and the name of his wife was Mehetabel daughter of Matred[b], daughter of Mezahab.
translation:
  language: hi
  text: बाल-हानान मर गया, और उसके स्थान पर हदद राजा हुआ। उसके नगर का नाम पाई[a] था, और उसकी पत्नी का नाम महेतबेल था, जो मत्रेद की बेटी थी; मत्रेद मेजाहाब की बेटी थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 36:39 में नगर का नाम “पाऊ” है, जबकि इतिहास के इस पाठ में “पाई” है।
    reason: textual_variant
  - marker: b
    text: 'इब्रानी में वंशावली का क्रम है: “मत्रेद की बेटी, मेजाहाब की बेटी।” इस प्रकार महेतबेल को मत्रेद की बेटी और मत्रेद को मेजाहाब की बेटी कहा गया है; वंशावली में “बेटी” कभी व्यापक वंशज-संबंध भी सूचित कर सकता है।'
    reason: lexical_alternative
