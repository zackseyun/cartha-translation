  text: And Cush fathered Nimrod[a]; he began to be a mighty one in the land.
translation:
  language: hi
  text: और कूश ने निम्रोद को जन्म दिया; वह देश[a] में पराक्रमी होने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी पर।” इब्रानी אֶרֶץ का अर्थ “देश/भूमि” या “पृथ्वी” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כ֖וּשׁ
  choice: और कूश
  rationale: וְ वंशावली की अगली सूचना को जोड़ता है; ‘और’ इसका स्वाभाविक हिन्दी रूप है। כּוּשׁ व्यक्तिवाचक नाम है, इसलिए ‘कूश’ लिप्यंतरित किया गया है।
- source_word: יָלַ֣ד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली में ילד जनक-संबंध बताता है। हिन्दी में ‘कूश से निम्रोद उत्पन्न हुआ’ स्वाभाविक और गरिमापूर्ण है तथा पुराने ‘उत्पन्न किया’ की अपेक्षा स्पष्ट है।
- source_word: נִמְר֑וֹד
  choice: निम्रोद
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: ה֣וּא
  choice: उसी ने
  rationale: स्वतंत्र सर्वनाम का बल और विषय की पुनरुक्ति हिन्दी में ‘उसी ने’ से व्यक्त होती है।
- source_word: הֵחֵ֔ל לִ/הְי֥וֹת
  choice: होना आरम्भ किया
  rationale: הֵחֵל के मूल अर्थ ‘आरम्भ करना’ और לִהְיוֹת ‘होना’ को निकटता से रखते हुए स्वाभाविक हिन्दी रचना।
- source_word: גִּבּ֖וֹר
  choice: पराक्रमी
  rationale: גִּבּוֹר का अर्थ सामर्थ्यवान, वीर या योद्धा हो सकता है। यहाँ कोई स्पष्ट युद्ध-संदर्भ नहीं है, इसलिए व्यापक अर्थ वाला ‘पराक्रमी’ चुना गया है।
- source_word: בָּ/אָֽרֶץ
  choice: देश में
  rationale: אֶרֶץ का अर्थ ‘देश/भूमि’ अथवा ‘पृथ्वी’ हो सकता है। मुख्य पाठ में कम व्यापक ‘देश में’ रखा गया है और दूसरा संभव अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: נिम्रोद के पराक्रम के क्षेत्र के रूप में בָּאָרֶץ का विस्तार
  choice: देश में
  alternative: पृथ्वी पर
  rationale: אֶרֶץ अर्थ की दृष्टि से अस्पष्ट है और पद स्वयं निम्रोद के प्रभाव को अनिवार्यतः विश्वव्यापी नहीं ठहराता। इसलिए मुख्य पाठ में ‘देश में’ रखा गया है, जबकि व्यापक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त वंशावली शैली, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘पराक्रमी’ जानबूझकर व्यापक रखा गया है ताकि पाठ में अनावश्यक सैन्य अर्थ न जोड़ा जाए।
