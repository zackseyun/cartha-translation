  text: 'The sons of Esau: Eliphaz[a], Reuel, Jeush, Jalam, and Korah.'
translation:
  language: hi
  text: 'एसाव के पुत्र: एलीपज, रूएल, यऊश, यालाम और कोरह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन रूप है और यहाँ तत्काल वंशावली-सूची प्रस्तुत करता है; इसलिए ‘पुत्र’ सबसे सीधा और विशिष्ट अर्थ है।
- source_word: עֵשָׂו
  choice: एसाव
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी बाइबलों में प्रचलित और स्रोत के निकट लिप्यंतरण।
- source_word: אֱלִיפַז
  choice: एलीपज
  rationale: हिब्रू नाम का स्वाभाविक देवनागरी लिप्यंतरण; अंतिम व्यंजन ז को ‘ज’ से दर्शाया गया है।
- source_word: רְעוּאֵל
  choice: रूएल
  rationale: हिब्रू ध्वनियों के निकट हिन्दी लिप्यंतरण; यह किसी वैकल्पिक यूनानी-लातीनी परंपरा पर निर्भर नहीं है।
- source_word: וִיעוּשׁ
  choice: यऊश
  rationale: आरंभिक ו संयोजक है; नाम יעוש का स्रोत-सन्निकट हिन्दी रूप ‘यऊश’ रखा गया है।
- source_word: וְיַעְלָם
  choice: यालाम
  rationale: संयोजक ו को अलग समझते हुए नाम יעלם का पठनीय और स्रोत-सन्निकट देवनागरी रूप।
- source_word: וְקֹרַח
  choice: और कोरह
  rationale: अंतिम नाम से पहले हिब्रू संयोजक को ‘और’ से व्यक्त किया गया है; קֹרַח का प्रचलित हिन्दी रूप ‘कोरह’ है।
