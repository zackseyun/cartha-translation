base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/001/042.yaml
  text: 'The sons of Ezer: Bilhan[a], Zaavan, and Jaakan[b]. The sons of Dishon: Uz and Aran.'
translation:
  language: hi
  text: 'एसेर के पुत्र: बिल्हान, ज़ावान और याकान[a]। दीशोन के पुत्र: ऊस और अरान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: उत्पत्ति 36:27 की समानांतर वंशावली में इस नाम का रूप आकान है।
    reason: cross_reference
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधसूचक बहुवचन रूप है और वंशावली में प्रत्यक्ष पुत्रों की सूची प्रस्तुत करता है; इसलिए ‘के पुत्र’ स्वाभाविक और सटीक है।
- source_word: אֵצֶר
  choice: एसेर
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; צ को यहाँ ‘स’ से व्यक्त किया गया है, जो हिन्दी बाइबलीय नामों में सहज है।
- source_word: בִּלְהָן
  choice: बिल्हान
  rationale: इब्रानी व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: זַעֲוָן
  choice: ज़ावान
  rationale: इब्रानी उच्चारण के निकट लिप्यंतरण; बीच के अयिन को अलग हिन्दी ध्वनि न देकर स्वाभाविक नाम-रूप रखा गया है।
- source_word: יַעֲקָן
  choice: याकान
  rationale: इतिहास की पुस्तक में पाए जाने वाले इब्रानी रूप का लिप्यंतरण; उत्पत्ति 36:27 के समानांतर पाठ में आरंभिक व्यंजन भिन्न है, जिसे पादटिप्पणी में बताया गया है।
- source_word: דִישׁוֹן
  choice: दीशोन
  rationale: व्यक्तिनाम का लिप्यंतरण; इसे इसी वंशावली के मिलते-जुलते नाम दीशान से अलग रखा गया है।
- source_word: עוּץ
  choice: ऊस
  rationale: इब्रानी व्यक्तिनाम का हिन्दी में प्रचलित और सहज रूप।
- source_word: אֲרָן
  choice: अरान
  rationale: इब्रानी व्यक्तिनाम का सीधा देवनागरी लिप्यंतरण।
