lexical_decisions:
- source_word: הַיְבוּסִי
  choice: यबूसी
  rationale: इब्रानी में यह जातिवाचक रूप व्याकरण की दृष्टि से एकवचन है, पर वंशावली में सामूहिक रूप से यबूसी जाति को सूचित करता है। हिन्दी में जाति के नाम के रूप में ‘यबूसी’ स्वाभाविक है।
- source_word: הָאֱמֹרִי
  choice: एमोरी
  rationale: आस-पास के जातिवाचक नामों की तरह यह भी रूपतः एकवचन होते हुए सामूहिक अर्थ में एमोरी जाति के लिए प्रयुक्त है।
- source_word: הַגִּרְגָּשִׁי
  choice: गिर्गाशी
  rationale: वंशावली की सूची में यह नाम सामूहिक रूप से गिर्गाशी जाति को सूचित करता है; हिन्दी में प्रचलित जातिनाम रखा गया है।
- source_word: וְאֶת / וְאֵת
  choice: और
  rationale: אֵת प्रत्यक्ष कर्म का चिह्न है, जिसका हिन्दी में अलग अनुवाद आवश्यक नहीं। दोहराए गए וְ को सूची के आरम्भ और अंतिम संयोजन में ‘और’ से व्यक्त किया गया है।
