  language: en
  yaml_path: translation/ot/1_chronicles/001/051.yaml
  text: 'Hadad died[a], and the chiefs of Edom were: Chief Timna, Chief Aliah[c][b], Chief Jetheth.'
translation:
  language: hi
  text: 'हदद मर गया। तब एदोम के प्रधान ये थे: प्रधान तिम्ना, प्रधान अलियाह[a] और प्रधान यतेत।[b]'
  philosophy: optimal-equivalence
