  language: hi
  text: 'हाम के पुत्र[a]: कूश, मिस्रैम[b], पूत और कनान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वंशज।” वंशावलियों में हिब्रू अभिव्यक्ति “के पुत्र” सीधे पुत्रों के साथ-साथ आगे की पीढ़ियों के वंशजों को भी सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: “मिस्रैम”; यह नाम परंपरागत रूप से मिस्र से जुड़ा है। यहाँ वंशावली में व्यक्तिवाचक नाम होने के कारण इसका लिप्यंतरण रखा गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यह בֵּן का संबंधकारक बहुवचन है। वंशावली में इसका अर्थ सीधे पुत्र या व्यापक वंशज हो सकता है; मुख्य पाठ में पारंपरिक और स्वाभाविक ‘पुत्र’ रखा गया है और व्यापक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: חָם
  choice: हाम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כּוּשׁ
  choice: कूश
  rationale: वंशावली में व्यक्तिवाचक अथवा मूल-पूर्वज-सूचक नाम; हिब्रू ध्वनि के निकट प्रचलित हिन्दी रूप।
- source_word: מִצְרַיִם
  choice: मिस्रैम
  rationale: यहाँ भौगोलिक नाम ‘मिस्र’ के बजाय वंशावली के अन्य नामों के साथ मूल-पूर्वज-सूचक व्यक्तिवाचक नाम है, इसलिए हिब्रू रूप का लिप्यंतरण रखा गया है।
- source_word: פּוּט
  choice: पूत
  rationale: व्यक्तिवाचक नाम का हिब्रू ध्वनि के निकट देवनागरी लिप्यंतरण।
- source_word: כְנָעַן
  choice: कनान
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी बाइबलीय रूप; इस वंशावली में यह मूल-पूर्वज-सूचक नाम के रूप में प्रयुक्त है।
