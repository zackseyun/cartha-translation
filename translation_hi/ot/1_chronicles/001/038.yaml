  text: 'And the sons of Seir: Lotan[a], Shobal, Zibeon, Anah, Dishon, Ezer, and Dishan.'
translation:
  language: hi
  text: 'और सेईर के पुत्र[a] ये थे: लोतान, शोबाल, सिबोन, अना, दीशोन, एसेर और दीशान।'
