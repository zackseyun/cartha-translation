    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: मूल क्रिया מוּת सीधे मृत्यु को व्यक्त करती है; ‘मर गया’ सरल, स्वाभाविक और अनावश्यक शिष्टोक्ति से रहित है।
- source_word: הֲדָד
  choice: हदद
  rationale: व्यक्तिवाचक नाम का मूल उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וַיִּמְלֹךְ
  choice: राज्य किया
  rationale: राजकीय उत्तराधिकार की सूची में מָלַךְ का अर्थ राजा के रूप में शासन करना है; ‘राज्य किया’ इतिहास-वृत्तांत की गरिमामय शैली बनाए रखता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: תַּחַת के साथ सर्वनाम-प्रत्यय यहाँ राजकीय उत्तराधिकार और पद-प्रतिस्थापन दर्शाता है; यह हिंदी में उस अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שַׂמְלָה
  choice: समला
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: מִמַּשְׂרֵקָה
  choice: मसरेका के
  rationale: उपसर्ग מִן यहाँ स्थान से उत्पत्ति या संबद्धता बताता है; ‘मसरेका के समला’ संक्षिप्त और स्वाभाविक हिंदी में उस स्थानीय संबद्धता को बनाए रखता है।
