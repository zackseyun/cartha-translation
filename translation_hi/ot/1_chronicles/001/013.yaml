translation:
  language: hi
  text: और कनान ने अपने पहलौठे सीदोन और हेत को जन्म दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/כְנַעַן
  choice: और कनान
  rationale: वंशावली की क्रमबद्ध कड़ी बनाए रखने के लिए उपसर्ग וּ को ‘और’ से व्यक्त किया गया है; कनान नाम का प्रचलित हिन्दी रूप है।
- source_word: יָלַד
  choice: से … उत्पन्न हुए
  rationale: पुरुष कर्ता वाली वंशावली में यह क्रिया संतान उत्पन्न करने का बोध देती है। हिन्दी में ‘से … उत्पन्न हुए’ स्वाभाविक है और पैतृक वंश-संबंध बनाए रखता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसका अलग शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: צִידוֹן
  choice: सीदोन
  rationale: हिब्रू व्यक्ति-नाम צִידוֹן का ध्वन्यात्मक और हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: בְּכֹר/וֹ
  choice: उसका पहलौठा
  rationale: संज्ञा ‘पहिलौठे’ और प्रत्यय ‘उसका’ का अर्थ रखती है; यह जन्मक्रम पर दिए गए मूल बल को सुरक्षित रखता है।
- source_word: וְ/אֶת
  choice: और
  rationale: संयोजक दूसरे वंशज को जोड़ता है; कर्म-चिह्न का पृथक अनुवाद नहीं किया गया।
- source_word: חֵת
  choice: हेत
  rationale: यहाँ हिब्रू पाठ में व्यक्तिगत पूर्वज का नाम חֵת है, बहुवचन जातिनाम ‘हित्ती’ नहीं; इसलिए नाम का लिप्यंतरण किया गया है।
