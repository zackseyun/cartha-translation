  text: 'These are their generations: the firstborn of Ishmael[a], Nebaioth, Kedar, Adbeel, and Mibsam.'
translation:
  language: hi
  text: 'उनकी वंशावली यह है: इश्माएल का पहलौठा नबायोत; केदार, अदबेल और मिबसाम।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה תֹּלְדוֹתָם
  choice: उनकी वंशावली यह है
  rationale: यह पद एक वंश-सूची का परिचय देता है। ‘वंशावली’ आधुनिक हिन्दी में स्वाभाविक है और תּוֹלְדוֹת के वंश अथवा पीढ़ियों के अभिलेख वाले अर्थ को संक्षेप में व्यक्त करता है।
- source_word: בְּכוֹר יִשְׁמָעֵאל
  choice: इश्माएल का पहलौठा
  rationale: בְּכוֹר जन्मक्रम में प्रथम पुत्र को दर्शाता है। ‘पहलौठा’ हिन्दी बाइबलीय शैली में परिचित और संक्षिप्त है; ‘पुत्र’ जोड़ना आवश्यक नहीं।
- source_word: נְבָיוֹת
  choice: नबायोत
  rationale: हिब्रू नाम का हिन्दी लिप्यंतरण।
- source_word: קֵדָר
  choice: केदार
  rationale: हिब्रू नाम का प्रचलित और सीधा हिन्दी लिप्यंतरण।
- source_word: אַדְבְּאֵל
  choice: अदबेल
  rationale: हिब्रू नाम का हिन्दी लिप्यंतरण।
- source_word: מִבְשָׂם
  choice: मिबसाम
  rationale: हिब्रू नाम का हिन्दी लिप्यंतरण।
