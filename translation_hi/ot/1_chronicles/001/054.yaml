  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; उसके संभावित अर्थ का अनुवाद नहीं किया गया।
- source_word: עִירָם
  choice: ईराम
  rationale: व्यक्तिवाचक नाम को हिब्रू दीर्घ स्वर के अनुरूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֵלֶּה
  choice: ये ... थे
  rationale: हिब्रू का संकेतवाचक पद क्रियारहित सारांश-वाक्य में है; हिंदी में भूतकालीन ‘थे’ जोड़ने से पूर्ववर्ती सूची का स्वाभाविक सारांश बनता है।
- source_word: אַלּוּפֵי אֱדֹם
  choice: एदोम के प्रधान
  rationale: यह संबंधसूचक पद पिछली सूची के व्यक्तियों को एदोम के गोत्रीय या कुलीय अगुओं के रूप में समेटता है; समान हिब्रू शब्द के लिए पूरे पद में ‘प्रधान’ बनाए रखा गया है।
