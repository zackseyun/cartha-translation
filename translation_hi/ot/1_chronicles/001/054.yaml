lexical_decisions:
- source_word: אַלּוּף
  choice: प्रधान
  rationale: एदोमी वंशावली और राजनीतिक सूची में यह शब्द किसी गोत्र या कुल के मुखिया को सूचित करता है। ‘प्रधान’ आधुनिक, संक्षिप्त और गरिमापूर्ण है तथा सूची की शैली में स्वाभाविक बैठता है।
- source_word: מַגְדִּיאֵל
