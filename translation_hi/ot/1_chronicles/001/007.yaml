- source_word: תַּרְשִׁישָׁה
  choice: तर्शीश
  rationale: नाम का प्रचलित और स्रोत-संगत हिन्दी लिप्यंतरण; अंतिम ה के लिए अलग रूप आवश्यक नहीं।
- source_word: כִּתִּים
