- source_word: וְרוֹדָנִים
  choice: और रोदानी
  rationale: इतिहास की मसोराई पांडुलिपि के רוֹדָנִים को मुख्य पाठ में रखा गया है; समानांतर पाठ का भिन्न नाम पादटिप्पणी में दिया गया है।
