- source_word: אֶשְׁבָּן
  choice: एशबान
  rationale: हिब्रू व्यक्तिवाचक नाम का सहज देवनागरी लिप्यंतरण।
- source_word: יִתְרָן
  choice: यित्रान
  rationale: आरम्भिक हिब्रू योध और व्यंजन-क्रम को दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: כְרָן
  choice: केरान
  rationale: हिब्रू व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; उससे पहले लगे संयोजक ו को हिन्दी सूची में ‘और’ से व्यक्त किया गया है।
