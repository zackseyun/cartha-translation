  rationale: वंशावली की इस सूची में בן का रचनावस्था बहुवचन सीधे पुरुष संतानों को दर्शाता है; इसलिए आधुनिक हिन्दी में ‘के पुत्र’ स्वाभाविक और स्रोत के निकट है।
- source_word: עֲנָה
