  yaml_path: translation/ot/1_chronicles/001/040.yaml
  text: 'The sons of Shobal: Alian[a], Manahath, Ebal, Shephi, and Onam[b]. And the sons of Zibeon: Aiah and Anah.'
translation:
  language: hi
  text: 'शोबाल के पुत्र: अल्यान[a], मानहत, एबाल, शफी और ओनाम[b]। और सिबोन के पुत्र: अय्या और अना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘अल्यान’ है; उत्पत्ति 36:23 की समानांतर वंशावली में ‘अलवान’ है।
    reason: alternative_reading
  - marker: b
    text: इतिहास की पुस्तक में ‘शफी’ है; उत्पत्ति 36:23 की समानांतर वंशावली में ‘शपो’ है।
    reason: alternative_reading
