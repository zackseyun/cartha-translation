- source_word: עֲנָה
  choice: अना
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וְ / וּ / וַ
  choice: और
  rationale: ये उपसर्ग सूची के नामों और दोनों वाक्यांशों को समन्वित करते हैं; हिन्दी में ‘और’ स्वाभाविक समतुल्य है।
