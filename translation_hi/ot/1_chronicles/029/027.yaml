  yaml_path: translation/ot/1_chronicles/029/027.yaml
  text: The days that he reigned over Israel were forty years. In Hebron he reigned seven years, and in Jerusalem he reigned thirty-three years.
translation:
  language: hi
  text: उसने इस्राएल पर चालीस वर्ष राज्य किया। हेब्रोन में उसने सात वर्ष राज्य किया, और यरूशलेम में उसने तैंतीस वर्ष राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַיָּמִים אֲשֶׁר מָלַךְ
  choice: उसने ... कुल ... वर्ष राज्य किया
  rationale: शाब्दिक रूप से ‘वे दिन जिनमें उसने राज्य किया’ अवधि बताने वाला इब्रानी मुहावरा है। आधुनिक हिन्दी में अवधि को सीधे व्यक्त करना अधिक स्वाभाविक है; ‘कुल’ दोनों स्थानों में बताए गए वर्षों के योग को स्पष्ट करता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: מָלַךְ के साथ עַל किसी प्रजा पर शासन करने का सामान्य अर्थ देता है। मूल में ‘समस्त’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष
  rationale: इब्रानी संख्या और सामूहिक एकवचन संज्ञा का स्वाभाविक हिन्दी रूप।
- source_word: בְּחֶבְרוֹן מָלַךְ שֶׁבַע שָׁנִים
  choice: हेब्रोन में उसने सात वर्ष
  rationale: स्थान, क्रिया और अवधि को स्पष्ट रखते हुए हिन्दी वाक्य में समानांतर रचना बनाए रखी गई है।
- source_word: וּבִירוּשָׁלִַם מָלַךְ שְׁלֹשִׁים וְשָׁלוֹשׁ
  choice: और यरूशलेम में तैंतीस वर्ष राज्य किया
  rationale: संयोजक, स्थान और अवधि को सीधे व्यक्त किया गया है; इब्रानी ‘तीस और तीन’ का आधुनिक हिन्दी संख्यात्मक रूप ‘तैंतीस’ है।
