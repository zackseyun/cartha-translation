  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पहले वाक्य में इब्रानी कालावधि-मुहावरे को स्वाभाविक हिन्दी में व्यक्त किया गया है और दूसरे वाक्य में हेब्रोन तथा यरूशलेम का संतुलित समानांतर क्रम सुरक्षित रखा गया है।
