  text: וַ/יִּשְׂמְח֤וּ הָ/עָם֙ עַל הִֽתְנַדְּבָ֔/ם כִּ֚י בְּ/לֵ֣ב שָׁלֵ֔ם הִֽתְנַדְּב֖וּ לַ/יהוָ֑ה וְ/גַם֙ דָּוִ֣יד הַ/מֶּ֔לֶךְ שָׂמַ֖ח שִׂמְחָ֥ה גְדוֹלָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/009.yaml
  text: Then the people rejoiced because they had offered willingly[a], for with a whole heart they had offered willingly to Yahweh[b]; and David the king also rejoiced with great joy.
translation:
  language: hi
  text: तब लोग अपनी स्वेच्छा से भेंट देने के कारण आनंदित हुए[a], क्योंकि उन्होंने पूरे मन से[b] याहवे को अपनी स्वेच्छा से भेंट दी थी; और राजा दाऊद भी अत्यन्त आनंदित हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी स्वेच्छा की भेंट के कारण’; इब्रानी क्रिया स्वेच्छापूर्वक और तत्परता से देने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘सम्पूर्ण मन से’; इसका भाव अविभाजित निष्ठा, निष्कपटता या खराई हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׂמְחוּ הָעָם
  choice: तब लोग ... आनन्दित हुए
  rationale: वाव-क्रमिक कथात्मक रूप को स्वाभाविक हिन्दी कथा-शैली में ‘तब’ के साथ व्यक्त किया गया है; שׂמח के लिए गरिमापूर्ण और सामान्य ‘आनन्दित हुए’ चुना गया।
- source_word: עַל הִתְנַדְּבָם
  choice: अपनी स्वेच्छा से भेंट देने के कारण
  rationale: עַל यहाँ आनन्द का कारण बताता है, और נדב का हित्पएल रूप स्वेच्छापूर्वक योगदान देने पर बल देता है; मन्दिर के लिए भेंटों के तात्कालिक प्रसंग को भी स्पष्ट रखा गया है।
- source_word: בְּלֵב שָׁלֵם
  choice: सम्पूर्ण मन से
  rationale: इब्रानी मुहावरे की ठोस छवि को बनाए रखते हुए अविभाजित निष्ठा, निष्कपटता और पूर्ण समर्पण का भाव व्यक्त किया गया है।
- source_word: הִתְנַדְּבוּ
  choice: अपनी स्वेच्छा से भेंट दी थी
  rationale: उसी נדב मूल की पुनरावृत्ति को अर्थगत रूप से बनाए रखा गया है और पूर्वकालिक क्रिया को हिन्दी में ‘दी थी’ से स्पष्ट किया गया है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ में उपस्थित परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְגַם דָּוִיד הַמֶּלֶךְ
  choice: और राजा दाऊद भी
  rationale: וְגַם के योगात्मक बल को ‘और ... भी’ से तथा उपाधि-सहित नाम को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: שָׂמַח שִׂמְחָה גְדוֹלָה
  choice: अत्यन्त आनन्दित हुआ
  rationale: सजातीय कर्म द्वारा व्यक्त तीव्रता को स्वाभाविक आधुनिक हिन्दी में ‘अत्यन्त’ से व्यक्त किया गया है, बिना असहज शब्द-पुनरावृत्ति के।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में टेट्राग्रामटन स्पष्ट रूप से है। नाम को उपाधि ‘प्रभु’ में बदलने के बजाय उसका हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यन्तरण रखा गया है; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है, पर सामान्य हिन्दी पाठक के लिए ‘यहोवा’ अधिक परिचित है।
- issue: בְּלֵב שָׁלֵם में नैतिक और भक्तिपरक आशय
  choice: सम्पूर्ण मन से
  alternative: निष्कपट मन से / पूरे मन से
  rationale: ‘सम्पूर्ण मन’ मूल अभिव्यक्ति की जानबूझकर रखी गई व्यापकता को सुरक्षित रखता है—यह निष्कपटता, अखंड निष्ठा और पूर्ण तत्परता को समेट सकता है, पर किसी एक अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘भेंट’ प्रसंगगत दान को स्पष्ट करती है, जबकि ‘स्वेच्छा से’ मूल क्रिया के मुख्य बल को सुरक्षित रखता है। मुख्य पाठ के दोनों पाद-टिप्पणी चिह्न सम्बद्ध वाक्यांशों के तुरन्त बाद दिए गए हैं।
