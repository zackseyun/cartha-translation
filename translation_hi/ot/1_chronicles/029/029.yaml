base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/029.yaml
  text: The acts of David the king[a], the former and the latter, are written in the records of Samuel the seer, and in the records of Nathan the prophet[c][b], and in the records of Gad the seer.
translation:
  language: hi
  text: राजा दाऊद के कार्य, आरम्भ से अन्त तक, शमूएल द्रष्टा के अभिलेखों में, नातान भविष्यद्वक्ता के अभिलेखों में और गाद दर्शी के अभिलेखों में लिखे हुए हैं।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा दाऊद की बातें/विषय, पहले और बाद के”; यहाँ यह उसके जीवन और शासन के कार्यों तथा घटनाओं को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “शमूएल ... नातान ... और गाद के वचनों/वृत्तान्तों पर लिखे हैं”; “अभिलेखों में” इन लिखित स्रोतों का भाव व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּבְרֵי דָוִיד הַמֶּלֶךְ
  choice: राजा दाऊद के ... कार्य
  rationale: דִּבְרֵי का मूल अर्थ ‘बातें/विषय’ है, पर राजकीय जीवन के इस सारांश में यह दाऊद के कार्यों और उसके शासन की घटनाओं को सूचित करता है।
- source_word: הָרִאשֹׁנִים וְהָאֲחֲרֹנִים
  choice: आरम्भ से अन्त तक के
  rationale: शाब्दिक ‘पहले और बाद के’ पूरे जीवन या शासनकाल के विस्तार को व्यक्त करने वाला युग्म है; हिन्दी में ‘आरम्भ से अन्त तक’ उसका स्वाभाविक अर्थ देता है।
- source_word: הִנָּם כְּתוּבִים
  choice: लिखे हुए हैं
  rationale: हिब्रू कथन का आशय सुरक्षित है; הִנָּם की संकेतात्मक या बलात्मक छाया को अलग से ‘देखो’ कहने पर हिन्दी में अनावश्यक कृत्रिमता आती।
- source_word: עַל דִּבְרֵי
  choice: अभिलेखों में
  rationale: शाब्दिक रूप ‘वचनों/वृत्तान्तों पर’ है, किंतु प्रसंग लिखित स्रोतों का है; ‘अभिलेखों में’ हिन्दी में दस्तावेज़ी अर्थ स्पष्ट करता है, बिना उनकी विधा को ‘इतिहास-ग्रन्थ’ के रूप में अनावश्यक रूप से निश्चित किए।
- source_word: הָרֹאֶה
  choice: द्रष्टा
  rationale: רֹאֶה एक भविष्यसूचक पदवी है। ‘द्रष्टा’ मानक, संक्षिप्त हिन्दी समतुल्य है।
- source_word: הַנָּבִיא
  choice: भविष्यद्वक्ता
  rationale: נָבִיא के लिए प्रचलित हिन्दी पद, जो नातान की अलग उपाधि बनाए रखता है।
- source_word: הַחֹזֶה
  choice: दर्शी
  rationale: חֹזֶה को ‘दर्शी’ कहने से हिब्रू में शमूएल के רֹאֶה और गाद के חֹזֶה के बीच मौजूद शब्दगत भेद हिन्दी में भी यथासम्भव बना रहता है।
theological_decisions:
- issue: रֹאֶה और חֹזֶה नामक भविष्यसूचक पदवियों का अनुवाद
  choice: क्रमशः ‘द्रष्टा’ और ‘दर्शी’
  alternative: दोनों को ‘द्रष्टा’ कहना
  rationale: मूल पाठ दो अलग हिब्रू पदों का प्रयोग करता है। अर्थ में निकटता होने पर भी ‘द्रष्टा’ और ‘दर्शी’ स्वाभाविक हिन्दी में उस शब्दगत भेद को बनाए रखते हैं; इससे कोई अतिरिक्त पदानुक्रम या doctrinal भेद आरोपित नहीं होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘आरम्भ से अन्त तक’ हिब्रू युग्म का स्वाभाविक हिन्दी रूप है। ‘द्रष्टा’ और ‘दर्शी’ से निकटार्थी किंतु अलग मूल पदों का भेद सुरक्षित रखा गया है।
