  text: And all the officials[a], the mighty men, and also all the sons of King David pledged allegiance to King Solomon.
translation:
  language: hi
  text: और सभी अधिकारियों, वीर पुरुषों और राजा दाऊद के सभी पुत्रों ने भी राजा सुलैमान के प्रति निष्ठा की प्रतिज्ञा की[a]।
  philosophy: optimal-equivalence
  footnotes:
