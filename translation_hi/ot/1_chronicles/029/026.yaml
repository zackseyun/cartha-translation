source:
  edition: WLC
  text: וְ/דָוִיד֙ בֶּן יִשָׁ֔י מָלַ֖ךְ עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/026.yaml
  text: And David son of Jesse reigned over all Israel.
translation:
  language: hi
  text: और यिशै के पुत्र दाऊद ने समस्त इस्राएल पर राज्य किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/דָוִיד
  choice: और ... दाऊद
  rationale: वाव को प्रसंग की निरंतरता दिखाने वाले सरल संयोजक ‘और’ से व्यक्त किया गया है; דָוִיד का प्रचलित हिन्दी रूप ‘दाऊद’ रखा गया है।
- source_word: בֶּן יִשָׁי
  choice: यिशै के पुत्र
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप है; יִשָׁי के लिए स्रोत-निकट प्रचलित रूप ‘यिशै’ चुना गया है।
- source_word: מָלַךְ
  choice: राज्य किया
  rationale: यहाँ काल क्रिया राजसत्ता का प्रयोग करने और शासन करने को दर्शाती है, केवल राजा बनने की घटना को नहीं।
- source_word: עַל
  choice: पर
  rationale: מָלַךְ के साथ यह उस प्रजा अथवा क्षेत्र को सूचित करता है जिस पर शासन किया गया; हिन्दी में ‘पर राज्य किया’ स्वाभाविक है।
- source_word: כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल
  rationale: כָּל राष्ट्र की संपूर्णता पर बल देता है; ‘समस्त इस्राएल’ इस व्यापकता को स्पष्ट और गरिमापूर्ण हिन्दी में बनाए रखता है।
