  text: וַ/יֵּ֣שֶׁב שְׁ֠לֹמֹה עַל כִּסֵּ֨א יְהוָ֧ה לְ/מֶ֛לֶךְ תַּֽחַת דָּוִ֥יד אָבִ֖י/ו וַ/יַּצְלַ֑ח וַ/יִּשְׁמְע֥וּ אֵלָ֖י/ו כָּל יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/023.yaml
  text: Then Solomon sat on the throne of Yahweh as king in place of David his father[a], and he prospered, and all Israel listened to him.
translation:
  language: hi
  text: तब सुलैमान अपने पिता दाऊद के स्थान पर राजा के रूप में याहवे के सिंहासन पर बैठा। वह सफल हुआ, और सारे इस्राएल ने उसकी बात मानी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी बात सुनी।” इब्रानी अभिव्यक्ति का अर्थ ध्यान से सुनना हो सकता है, पर इस राजकीय प्रसंग में उसमें उसकी बात या आज्ञा मानने का भाव भी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: बैठा
  rationale: मूल क्रिया का ठोस अर्थ ‘बैठना’ है; ‘सिंहासन पर’ के साथ यह राजसिंहासन ग्रहण करने का भाव भी स्वाभाविक रूप से व्यक्त करती है।
- source_word: כִּסֵּא יְהוָה
  choice: याहवे का सिंहासन
  rationale: सम्बन्धवाचक इब्रानी पदबंध को सीधे रखा गया है, जिससे दाऊदी राजत्व पर याहवे के अधिकार और प्रतिनिधिक शासन का आशय बिना व्याख्यात्मक विस्तार के सुरक्षित रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का आधुनिक हिन्दी में निकट लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לְמֶלֶךְ
  choice: राजा होकर
  rationale: यहाँ לְ पद या भूमिका को सूचित करता है; ‘राजा होकर’ हिन्दी में सहज रूप से सुलैमान की राजकीय हैसियत बताता है।
- source_word: תַּחַת דָּוִיד אָבִיו
  choice: अपने पिता दाऊद के स्थान पर
  rationale: उत्तराधिकार के इस प्रसंग में תַּחַת का अर्थ केवल कालगत ‘बाद’ नहीं, बल्कि किसी के स्थान को ग्रहण करना है।
- source_word: וַיַּצְלַח
  choice: वह सफल हुआ
  rationale: צלח यहाँ उन्नति या सफलता प्राप्त करने का अर्थ देता है; ‘सफल हुआ’ संक्षिप्त और आधुनिक हिन्दी है तथा कारण को अनावश्यक रूप से नहीं जोड़ता।
- source_word: וַיִּשְׁמְעוּ אֵלָיו
  choice: उसकी बात मानी
  rationale: שׁמע אל का शाब्दिक क्षेत्र ध्यान से सुनने से लेकर आज्ञा मानने तक है। राजा के प्रति प्रजा की प्रतिक्रिया के प्रसंग में ‘बात मानी’ दोनों भावों को स्वाभाविक हिन्दी में निकटता से समेटता है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: राष्ट्र को एक सामूहिक इकाई के रूप में व्यक्त करने वाला मानक पदबंध है।
theological_decisions:
- issue: ‘याहवे के सिंहासन’ और सुलैमान के राजत्व का सम्बन्ध
  choice: मूल पदबंध ‘याहवे के सिंहासन’ को ज्यों का त्यों अर्थानुसार बनाए रखा गया है।
  alternative: इसे केवल ‘सुलैमान का सिंहासन’ कहना या ‘वह सिंहासन जो याहवे का था’ जैसी व्याख्यात्मक भाषा जोड़ना।
  rationale: इतिहासकार दाऊदी राजा के शासन को याहवे के अधीन और उसकी ओर से किए जाने वाले शासन के रूप में प्रस्तुत करता है। अनुवाद इस धर्मवैचारिक दावे को बनाए रखता है, पर उसकी प्रकृति को किसी बाद की सिद्धान्त-व्यवस्था से परिभाषित नहीं करता।
- issue: इस्राएल की प्रतिक्रिया में सुनने और आज्ञापालन का सम्बन्ध
  choice: मुख्य पाठ में ‘उसकी बात मानी’ रखा गया है और पादटिप्पणी में ‘उसकी सुनी’ का विकल्प दिया गया है।
  alternative: सिर्फ ‘उसकी आज्ञा मानी’ या सिर्फ ‘उसकी सुनी’ कहना।
  rationale: इब्रानी अभिव्यक्ति में ध्यानपूर्वक सुनना और अधिकार के प्रति मानना दोनों सम्भव हैं। राजकीय प्रसंग आज्ञापालन की ओर संकेत करता है, जबकि पादटिप्पणी मूल की वास्तविक शाब्दिक व्यापकता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘याहवे’ व्यक्तिगत दिव्य नाम का लिप्यंतरण है; वाक्य-विन्यास को हिन्दी की स्वाभाविकता के अनुसार दो वाक्यों में रखा गया है।
