base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/022.yaml
  text: And they ate and drank before Yahweh on that day with great joy[a], and they made Solomon son of David king a second time, and they anointed him for Yahweh as ruler[d][c][b], and Zadok as priest.
translation:
  language: hi
  text: उस दिन उन्होंने यहोवा के सामने बड़े आनंद के साथ खाया-पिया। फिर उन्होंने दाऊद के पुत्र सुलैमान को दूसरी बार[a] राजा बनाया और यहोवा के लिए[b] प्रधान[c] के रूप में उसका अभिषेक किया, और सादोक को याजक के रूप में अभिषेक किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फिर से।”
    reason: lexical_alternative
  - marker: b
    text: या, “यहोवा के सामने।” इब्रानी पदबंध यहोवा के लिए समर्पण अथवा उसकी उपस्थिति में किए गए अभिषेक—दोनों भाव दे सकता है।
    reason: alternative_reading
  - marker: c
    text: “प्रधान” के लिए प्रयुक्त इब्रानी शब्द नָגִיד का अनुवाद “शासक,” “अगुवा” या कुछ प्रसंगों में “राजकुमार” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह पदबंध यहोवा की उपस्थिति में होने को व्यक्त करता है; ‘के सामने’ स्वाभाविक हिन्दी में स्थानीय और उपासना-संबंधी दोनों भाव बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: בְּשִׂמְחָה גְדוֹלָה
  choice: बड़े आनन्द के साथ
  rationale: यह रीति या भाव को सूचित करता है और उत्सव की तीव्र प्रसन्नता को सहज, गरिमामय हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאכְלוּ וַיִּשְׁתּוּ
  choice: उन्होंने ... खाया-पिया
  rationale: दोनों समन्वित क्रियाओं को हिन्दी के स्वाभाविक संयुक्त प्रयोग में रखा गया है।
- source_word: וַיַּמְלִיכוּ
  choice: राजा बनाया
  rationale: מלך के हिफ़ील रूप का अर्थ किसी को राज्य करने वाला बनाना है; ‘राजा बनाया’ मूल क्रिया के अधिक निकट है और अनुल्लिखित मुकुट-समारोह नहीं जोड़ता।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह क्रियाविशेषण पुनरावृत्ति को विशिष्ट रूप से दूसरी बार बताता है; इसे केवल ‘फिर’ कहकर ढीला नहीं किया गया।
- source_word: בֶן דָּוִיד
  choice: दाऊद के पुत्र
  rationale: वंशगत पहचान को सीधे और औपचारिक रूप में सुरक्षित रखा गया है।
- source_word: וַיִּמְשְׁחוּ
  choice: अभिषेक किया
  rationale: राजकीय और याजकीय नियुक्ति के प्रसंग में משׁח के अनुष्ठानिक अर्थ का मानक हिन्दी समतुल्य है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद यहाँ यहोवा से संबंध, समर्पण या उसके अधिकाराधीन नियुक्ति का भाव दे सकता है; मुख्य पाठ इस संबंधपरक अर्थ को रखता है और पादटिप्पणी उपस्थिति-संबंधी सम्भावना बताती है।
- source_word: לְנָגִיד
  choice: प्रधान के रूप में
  rationale: נָגִיד नियुक्त नेतृत्व और शासनाधिकार को दर्शाता है। ‘प्रधान’ इसे ‘राजा’ से अनावश्यक रूप से दोहराए बिना व्यक्त करता है; अन्य सम्भव अनुवाद पादटिप्पणी में दिए गए हैं।
- source_word: לְכֹהֵן
  choice: याजक के रूप में
  rationale: यह याजकीय पद को सीधे व्यक्त करता है और सुलैमान की नियुक्ति के समानांतर रचना बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: अभिषेक-वाक्य में לַיהוָה का अर्थ
  choice: यहोवा के लिए
  alternative: यहोवा के सामने
  rationale: इब्रानी में यहोवा के प्रति समर्पण अथवा उसके अधिकार के लिए नियुक्ति और उसकी उपस्थिति में की गई क्रिया—दोनों निकट अर्थ सम्भव हैं। मुख्य पाठ संबंध/समर्पण का भाव रखता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
- issue: सुलैमान और सादोक पर וַיִּמְשְׁחוּ की व्याप्ति
  choice: दोनों के लिए अभिषेक को स्पष्ट रूप से व्यक्त किया
  alternative: दूसरे खंड में क्रिया को लुप्त रखते हुए ‘और सादोक को याजक’
  rationale: इब्रानी की एक बहुवचन क्रिया समानांतर रूप से सुलैमान और सादोक की नियुक्तियों को नियंत्रित करती है। हिन्दी में दूसरी बार ‘अभिषेक किया’ कहना अर्थ स्पष्ट करता है, कोई नई क्रिया नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमामय शैली अपनाई गई है। ‘खाया-पिया’ स्वाभाविक बोलचाल का है, जबकि ‘अभिषेक,’ ‘प्रधान’ और ‘याजक’ ऐतिहासिक-धार्मिक प्रसंग की औपचारिकता बनाए रखते हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
