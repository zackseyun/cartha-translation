id: 1CH.29.16
reference: 1 Chronicles 29:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֣ה אֱלֹהֵ֔י/נוּ כֹ֣ל הֶ/הָמ֤וֹן הַ/זֶּה֙ אֲשֶׁ֣ר הֲכִינֹ֔נוּ לִ/בְנֽוֹת לְ/ךָ֥ בַ֖יִת לְ/שֵׁ֣ם קָדְשֶׁ֑/ךָ מִ/יָּדְ/ךָ֥ היא וּ/לְ/ךָ֥ הַ/כֹּֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/016.yaml
  text: O Yahweh our God[a], all this abundance that we have prepared to build you a house for your holy name is from your hand[c][b], and all things are yours.
translation:
  language: hi
  text: हे यहोवा, हमारे परमेश्वर, यह सारी सामग्री[a], जिसे हमने तेरे पवित्र नाम के लिए भवन बनाने को तैयार किया है, तेरे ही हाथ से मिली है, और यह सब तेरा ही है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह सारा भंडार” अथवा “यह सारी संपत्ति”; इब्रानी शब्द यहाँ भवन के लिए बड़ी मात्रा में जुटाई गई वस्तुओं को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵינוּ
  choice: हे यहोवा, हमारे परमेश्वर
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से स्पष्ट किया गया है; वाचा के नाम को ‘यहोवा’ और אֱלֹהֵינוּ को स्वाभाविक हिन्दी में ‘हमारे परमेश्वर’ रखा गया है।
- source_word: כֹל הֶהָמוֹן הַזֶּה
  choice: यह सारी सामग्री
  rationale: הָמוֹן बड़ी मात्रा या संचित भंडार का बोध कराता है; प्रसंग में मंदिर के लिए जुटाई गई वस्तुएँ हैं, इसलिए ‘सारी सामग्री’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֲשֶׁר הֲכִינֹנוּ
  choice: जिसे हमने ... तैयार किया है
  rationale: क्रिया का पूर्ण हो चुका किन्तु वर्तमान रूप से प्रासंगिक कार्य हिन्दी के पूर्ण वर्तमान से व्यक्त होता है।
- source_word: לִבְנוֹת לְךָ בַיִת
  choice: तेरे ... लिए भवन बनाने को
  rationale: בַיִת का मूल अर्थ ‘घर/भवन’ है; ‘भवन’ यहाँ परमेश्वर के लिए निर्मित पवित्र गृह को स्वाभाविक ढंग से व्यक्त करता है, बिना सीधे ‘मंदिर’ जोड़ने के।
- source_word: לְשֵׁם קָדְשֶׁךָ
  choice: तेरे पवित्र नाम के लिए
  rationale: हिब्रू की समर्पण-संबंधी अभिव्यक्ति और ‘नाम’ के धार्मिक महत्व को सीधे सुरक्षित रखा गया है।
- source_word: מִיָּדְךָ הִיא
  choice: तेरे ही हाथ से मिली है
  rationale: शाब्दिक ‘तेरे हाथ से है’ का स्रोत-सूचक भाव और ‘हाथ’ का बिंब रखते हुए हिन्दी में स्वाभाविक वाक्य बनाया गया है।
- source_word: וּלְךָ הַכֹּל
  choice: और यह सब तेरा ही है
  rationale: परमेश्वर के पूर्ण स्वामित्व पर बल देने के लिए לְךָ और הַכֹּל को संक्षिप्त, सहज हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिब्रू पाठ में व्यक्तिगत ईश्वरीय नाम है; हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को अपनाकर इसे किसी सामान्य उपाधि से नहीं बदला गया।
- issue: לְשֵׁם קָדְשֶׁךָ में ‘नाम’ का संरक्षण
  choice: तेरे पवित्र नाम के लिए
  alternative: तेरे लिए
  rationale: सिर्फ ‘तेरे लिए’ कहना मूल में उपस्थित ‘पवित्र नाम’ की धार्मिक धारणा को मिटा देता; इसलिए उसे स्पष्ट रूप से रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और प्रार्थनात्मक हिन्दी। परमेश्वर के प्रति एकवचन निकट संबोधन ‘तेरे’ रखा गया है। ‘भवन’ मूल בַיִת को बनाए रखता है, जबकि संदर्भ से मंदिर अभिप्रेत है।
