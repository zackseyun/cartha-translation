id: 1CH.29.25
reference: 1 Chronicles 29:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְגַדֵּ֨ל יְהוָ֤ה אֶת שְׁלֹמֹה֙ לְ/מַ֔עְלָ/ה לְ/עֵינֵ֖י כָּל יִשְׂרָאֵ֑ל וַ/יִּתֵּ֤ן עָלָי/ו֙ ה֣וֹד מַלְכ֔וּת אֲ֠שֶׁר לֹֽא הָיָ֧ה עַל כָּל מֶ֛לֶךְ לְ/פָנָ֖י/ו עַל יִשְׂרָאֵֽל־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/025.yaml
  text: And Yahweh made Solomon exceedingly great in the sight of all Israel[a], and gave him royal majesty such as had not been on any king before him over Israel.
translation:
  language: hi
  text: याहवे ने सारे इस्राएल के सामने सुलैमान को अत्यन्त महान बनाया और उसे ऐसा राजकीय वैभव[a] प्रदान किया, जैसा उससे पहले इस्राएल के किसी भी राजा को प्राप्त नहीं हुआ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘राजसी प्रताप’ अथवा ‘राजत्व की महिमा’।
    reason: הוֹד מַלְכוּת के अर्थक्षेत्र में वैभव, प्रताप और राजत्व की महिमा सम्मिलित हैं; कोई एक हिन्दी पद इसकी सभी छटाएँ पूरी तरह नहीं समेटता।
lexical_decisions:
- source_word: וַיְגַדֵּל ... לְמַעְלָה
  choice: अत्यन्त महान बनाया
  rationale: हिफ़ील क्रिया וַיְגַדֵּל का कारक अर्थ ‘महान बनाया’ है और לְמַעְלָה यहाँ उसकी तीव्रता बढ़ाता है; यह वाक्यांश दोनों तत्वों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לְעֵינֵי כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल के सामने
  rationale: शाब्दिक ‘सारे इस्राएल की आँखों में’ सार्वजनिक दृश्यता और मान्यता का मुहावरा है; ‘के सामने’ आधुनिक हिन्दी में उसी भाव को स्पष्ट रूप से देता है।
- source_word: וַיִּתֵּן עָלָיו
  choice: उसे ... प्रदान किया
  rationale: शाब्दिक ‘उस पर दिया’ प्रदान करने का इब्रानी मुहावरा है; ‘प्रदान किया’ सम्मानपूर्ण और स्वाभाविक समतुल्य है।
- source_word: הוֹד מַלְכוּת
  choice: राजकीय वैभव
  rationale: הוֹד में वैभव, महिमा और प्रताप का अर्थक्षेत्र है, जबकि מַלְכוּת इसे राजत्व से जोड़ता है। ‘राजकीय वैभव’ दोनों को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: אֲשֶׁר לֹא הָיָה עַל כָּל מֶלֶךְ לְפָנָיו עַל יִשְׂרָאֵל
  choice: जैसा उससे पहले इस्राएल के किसी भी राजा को प्राप्त नहीं हुआ था
  rationale: सापेक्ष उपवाक्य वैभव की अभूतपूर्वता बताता है। עַל के शाब्दिक दोहराव को हिन्दी में ‘प्राप्त’ द्वारा स्वाभाविक बनाया गया है, जबकि ‘उससे पहले’ और ‘इस्राएल के किसी भी राजा’ मूल के समय तथा शासन-संबंध को बनाए रखते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना व्यक्त करता है; ‘प्रभु’ नाम के स्थान पर उपाधि रख देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरांकन है।
- issue: सुलैमान की महानता का कर्ता
  choice: याहवे ने ... महान बनाया और ... प्रदान किया
  alternative: सुलैमान अत्यन्त महान हुआ
  rationale: दोनों इब्रानी क्रियाएँ याहवे की सक्रिय और कारणकारी भूमिका स्पष्ट करती हैं; अनुवाद उसी कर्तृत्व को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘सारे इस्राएल के सामने’ और ‘प्राप्त नहीं हुआ था’ जैसे स्वाभाविक प्रयोगों से इब्रानी मुहावरों की कठोर नकल से बचते हुए मूल अर्थ सुरक्षित रखा गया है।
