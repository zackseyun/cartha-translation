source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֤יד הַ/מֶּ֨לֶךְ֙ לְ/כָל הַ/קָּהָ֔ל שְׁלֹמֹ֨ה בְנִ֥/י אֶחָ֛ד בָּֽחַר בּ֥/וֹ אֱלֹהִ֖ים נַ֣עַר וָ/רָ֑ךְ וְ/הַ/מְּלָאכָ֣ה גְדוֹלָ֔ה כִּ֣י לֹ֤א לְ/אָדָם֙ הַ/בִּירָ֔ה כִּ֖י לַ/יהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/001.yaml
  text: Then King David said to all the assembly, “Solomon my son, the one God has chosen, is young and inexperienced, and the work is great; for the palace is not for man, but for the LORD God.”
translation:
  language: hi
  text: तब राजा दाऊद ने सारी सभा से कहा, “मेरा पुत्र सुलैमान—वही एक है जिसे परमेश्वर ने चुना है[a]—अभी कम उम्र का और अनुभवहीन है, और यह काम बहुत बड़ा है; क्योंकि यह भवन[b] मनुष्य के लिए नहीं, बल्कि यहोवा परमेश्वर के लिए है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में शाब्दिक क्रम है: “मेरा पुत्र सुलैमान, एक—परमेश्वर ने उसे चुना है।” यहाँ ‘एक’ की वाक्यगत भूमिका असामान्य है; इसे “वह है जिसे परमेश्वर ने चुना है” या सुलैमान की विशिष्टता पर बल देने वाले शब्द के रूप में समझा जा सकता है।'
    reason: असामान्य हिब्रू वाक्य-विन्यास और אֶחָד के अर्थगत तनाव को सुरक्षित रखना, बिना यह भ्रामक संकेत दिए कि परमेश्वर ने चुनाव अकेले किया।
  - marker: b
    text: यहाँ प्रयुक्त हिब्रू शब्द בִּירָה सामान्यतः किसी दुर्ग या महलनुमा बड़े भवन के लिए आता है; इस प्रसंग में यह बनने वाले मन्दिर को दर्शाता है।
    reason: ‘भवन’ के पीछे मूल शब्द की व्यापक अर्थ-सीमा बताना और इसे राजमहल समझने से रोकना।
lexical_decisions:
- source_word: הַקָּהָל
  choice: सभा
  rationale: यह संगठित रूप से एकत्र पूरे समुदाय को दर्शाता है; ‘सारी सभा’ स्वाभाविक और स्रोत के כָּל के अनुरूप है।
- source_word: אֶחָד בָּחַר בּוֹ אֱלֹהִים
  choice: वही एक है जिसे परमेश्वर ने चुना है
  rationale: אֶחָד (‘एक’) को हटाए बिना उसे सुलैमान की पहचान पर बल देने वाले वाक्यांश के रूप में रखा गया है।
- source_word: נַעַר וָרָךְ
  choice: कम उम्र का और अनुभवहीन
  rationale: शाब्दिक अर्थ ‘युवा और कोमल’ है; इस प्रसंग में רַךְ कार्य की जिम्मेदारी के लिए अनुभव और परिपक्वता की कमी बताता है।
- source_word: הַמְּלָאכָה גְדוֹלָה
  choice: यह काम बहुत बड़ा है
  rationale: निर्माण-कार्य के विशाल परिमाण और महत्त्व, दोनों को साधारण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַבִּירָה
  choice: यह भवन
  rationale: मन्दिर के प्रसंग में ‘महल’ भ्रमित कर सकता है; ‘भवन’ लक्ष्य-निर्माण को स्पष्ट रखता है, जबकि शब्द की असामान्य lexical range को पाद-टिप्पणी में बताया गया है।
- source_word: לַיהוָה אֱלֹהִים
  choice: यहोवा परमेश्वर के लिए
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ और אֱלֹהִים को ‘परमेश्वर’ के रूप में अलग-अलग सुरक्षित रखा गया है।
theological_decisions:
- issue: אֶחָד का आशय
  choice: ‘वही एक’ के द्वारा एकत्व/विशिष्टता को मुख्य पाठ में बनाए रखा
  alternative: केवल ‘जिसे परमेश्वर ने चुना है’ अथवा अधिक निर्णायक ‘केवल उसी को परमेश्वर ने चुना है’
  rationale: हिब्रू में אֶחָד स्पष्ट है, पर उसकी वाक्यगत भूमिका कुछ असामान्य है। चुना गया रूप शब्द को बनाए रखता है, पर यह दावा नहीं करता कि परमेश्वर ने किसी अन्य को कभी नहीं चुना।
- issue: भवन का मानवीय नहीं, परमेश्वर के लिए होना
  choice: उद्देश्य/समर्पण के रूप में ‘मनुष्य के लिए नहीं, बल्कि यहोवा परमेश्वर के लिए’
  alternative: यह अर्थ लेना कि भवन में मनुष्य का कोई स्थान या सहभागिता नहीं
  rationale: לְ यहाँ भवन के अभिप्रेत स्वामी अथवा प्राप्तकर्ता को दर्शाता है; कथन मन्दिर के समर्पण पर बल देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सामान्य पाठक के लिए सहज। दाऊद के सार्वजनिक संबोधन की औपचारिकता बनाए रखी गई है। ‘कम उम्र का और अनुभवहीन’ प्रसंगानुकूल है; ‘यहोवा परमेश्वर’ मूल पाठ के व्यक्तिगत नाम और उपाधि दोनों को व्यक्त करता है।
