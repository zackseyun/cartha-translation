id: 1CH.29.3
reference: 1 Chronicles 29:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/ע֗וֹד בִּ/רְצוֹתִ/י֙ בְּ/בֵ֣ית אֱלֹהַ֔/י יֶשׁ לִ֥/י סְגֻלָּ֖ה זָהָ֣ב וָ/כָ֑סֶף נָתַ֤תִּי לְ/בֵית אֱלֹהַ/י֙ לְ/מַ֔עְלָ/ה מִ/כָּל הֲכִינ֖וֹתִי לְ/בֵ֥ית הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/003.yaml
  text: Moreover[a], because of my delight in the house of my God, I have a personal treasure of gold and silver, and I have given it to the house of my God[c][b], over and above all that I have prepared for the holy house.
translation:
  language: hi
  text: और, अपने परमेश्वर के भवन से मेरे विशेष लगाव के कारण, मेरे पास सोने और चाँदी का एक निजी खज़ाना है; उसे भी मैंने अपने परमेश्वर के भवन के लिए दे दिया है—उस सबके अतिरिक्त जो मैंने पवित्र भवन के लिए तैयार किया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעוֹד
  choice: फिर … भी
  rationale: यह पिछले कथन में एक और, विशेष योगदान जोड़ता है; हिन्दी में विभाजित प्रयोग वाक्य के योगात्मक और बलात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּרְצוֹתִי בְּבֵית אֱלֹהַי
  choice: अपने परमेश्वर के भवन से मेरा लगाव होने के कारण
  rationale: רצון यहाँ भवन के प्रति प्रसन्न अनुराग अथवा लगाव और ב कारण/संबंध का भाव देता है। 'लगाव' आधुनिक हिन्दी में प्रेरक भाव को स्पष्ट रखता है, बिना इसे केवल इच्छा मानने के।
- source_word: יֶשׁ לִי סְגֻלָּה
  choice: मेरे निजी खज़ाने से
  rationale: स्रोत का आशय दाऊद की मूल्यवान निजी संपत्ति से है। हिन्दी वाक्य में 'मेरे निजी खज़ाने से' अगले क्रियापद के साथ स्वाभाविक है और सार्वजनिक रूप से पहले जुटाई सामग्री से इसका भेद स्पष्ट करता है।
- source_word: זָהָב וָכָסֶף
  choice: सोना और चाँदी
  rationale: दोनों धातुओं का सीधा और प्रचलित हिन्दी रूप।
- source_word: נָתַתִּי
  choice: देता हूँ
  rationale: हिब्रू पूर्ण क्रिया भाषण के संदर्भ में दान की घोषित/संपन्न कार्रवाई बताती है। हिन्दी का वर्तमान रूप सार्वजनिक समर्पण की घोषणा में स्वाभाविक है; इसे भावी प्रतिज्ञा नहीं बनाया गया।
- source_word: לְבֵית אֱלֹהַי
  choice: अपने परमेश्वर के भवन के लिए
  rationale: נתן के साथ ל लक्ष्य अथवा प्रयोजन सूचित करता है। हिन्दी में निर्जीव भवन के संदर्भ में 'के लिए' 'को' से अधिक स्वाभाविक है।
- source_word: לְמַעְלָה מִכָּל הֲכִינוֹתִי
  choice: उस सबके अतिरिक्त जो मैंने … तैयार किया है
  rationale: यह पहले की सारी तैयारी से बढ़कर एक अतिरिक्त निजी योगदान दर्शाता है। यह रूप तुलना/अतिरिक्तता को स्पष्ट और सहज रखता है।
- source_word: לְבֵית הַקֹּדֶשׁ
  choice: पवित्र भवन के लिए
  rationale: शाब्दिक 'पवित्रता का भवन' का स्वाभाविक हिन्दी रूप; בית की पुनरावृत्ति और समर्पित भवन का भाव सुरक्षित रहता है।
theological_decisions:
- issue: दाऊद के भाषण में मंदिर-संबंधी शब्दावली
  choice: भवन / पवित्र भवन
  alternative: मन्दिर / पवित्रस्थान
  rationale: मूल में בית बार-बार आया है। 'भवन' उसके शाब्दिक और निवास-संबंधी भाव को बनाए रखता है तथा सुलैमान द्वारा अभी बनाए जाने वाले ढाँचे को अनावश्यक रूप से पहले से 'मन्दिर' नाम नहीं देता।
- issue: निजी संपत्ति और पूर्व तैयारी का संबंध
  choice: निजी खज़ाने से अतिरिक्त योगदान
  alternative: विशेष खज़ाना अथवा राजकीय कोष
  rationale: סְגֻלָּה मूल्यवान निजी संपत्ति का संकेत देता है, और प्रसंग इसे पहले तैयार की गई सामग्री के ऊपर दाऊद के व्यक्तिगत दान के रूप में प्रस्तुत करता है; इसे राजकीय कोष कहना स्रोत से अधिक निश्चित होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। 'खज़ाना', 'लगाव' और 'भवन' प्रचलित शब्द हैं। वाक्य की संरचना हिब्रू के कारण, संपत्ति, दान और पूर्व तैयारी से अतिरिक्तता—इन चारों तत्वों को स्पष्ट रखती है।
