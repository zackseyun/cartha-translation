revisions:
- from: फिर, अपने परमेश्वर के भवन से मेरा लगाव होने के कारण, मैं अपने निजी खज़ाने से सोना और चाँदी भी अपने परमेश्वर के भवन के लिए देता हूँ—उस सबके अतिरिक्त जो मैंने पवित्र भवन के लिए तैयार किया है।
  to: और, अपने परमेश्वर के भवन से मेरे विशेष लगाव के कारण, मेरे पास सोने और चाँदी का एक निजी खज़ाना है; उसे भी मैंने अपने परमेश्वर के भवन के लिए दे दिया है—उस सबके अतिरिक्त जो मैंने पवित्र भवन के लिए तैयार किया है।
