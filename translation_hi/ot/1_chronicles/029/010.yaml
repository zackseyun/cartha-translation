language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְבָ֤רֶךְ דָּוִיד֙ אֶת יְהוָ֔ה לְ/עֵינֵ֖י כָּל הַ/קָּהָ֑ל וַ/יֹּ֣אמֶר דָּוִ֗יד בָּר֨וּךְ אַתָּ֤ה יְהוָה֙ אֱלֹהֵי֙ יִשְׂרָאֵ֣ל אָבִ֔י/נוּ מֵ/עוֹלָ֖ם וְ/עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/010.yaml
  text: Then David blessed Yahweh in the sight of all the assembly[a], and David said, “Blessed are you, Yahweh, the God of Israel our father, from everlasting to everlasting.”
translation:
  language: hi
  text: तब दाऊद ने सारी सभा के सामने याहवे को धन्य कहा। दाऊद ने कहा, “हे याहवे, हमारे पिता इस्राएल के परमेश्वर,[a] तू अनादि से अनन्तकाल तक धन्य है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे याहवे, इस्राएल के परमेश्वर, हमारे पिता”; यदि “हमारे पिता” को इस्राएल/याकूब के बजाय परमेश्वर के लिए प्रत्यक्ष संबोधन माना जाए।
    reason: वैकल्पिक वाक्य-संबंध और संदर्भ
lexical_decisions:
- source_word: וַיְבָרֶךְ
  choice: धन्य कहा
  rationale: यहाँ पिएल क्रिया का कर्म यहोवा है और अर्थ परमेश्वर को आशीषमय/धन्य घोषित करना तथा उसकी स्तुति करना है। ‘धन्य कहा’ अगले בָּרוּךְ के साथ शब्दगत संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: לְעֵינֵי כָּל הַקָּהָל
  choice: सारी सभा के सामने
  rationale: शाब्दिक दृश्यात्मक मुहावरे ‘आँखों के सामने’ का स्वाभाविक हिन्दी रूप, जो सार्वजनिक उपस्थिति का भाव बनाए रखता है।
- source_word: בָּרוּךְ אַתָּה
  choice: तू … धन्य है
  rationale: प्रत्यक्ष संबोधन और स्तुतिपरक घोषणा को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל אָבִינוּ
  choice: हमारे पिता इस्राएल के परमेश्वर
  rationale: मुख्य पाठ में אָבִינוּ को इस्राएल अर्थात याकूब का विशेषण माना गया है; हिन्दी क्रम इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מֵעוֹלָם וְעַד עוֹלָם
  choice: अनादि से अनन्तकाल तक
  rationale: यह अनबँधी कालावधि को दोनों दिशाओं में व्यक्त करता है और स्तुतिपरक गरिमा बनाए रखता है।
theological_decisions:
- issue: אָבִינוּ (‘हमारे पिता’) का संदर्भ
  choice: 'इसे इस्राएल/याकूब के लिए माना गया: ‘हमारे पिता इस्राएल के परमेश्वर’'
  alternative: 'इसे परमेश्वर के लिए प्रत्यक्ष संबोधन माना जा सकता है: ‘इस्राएल के परमेश्वर, हमारे पिता’'
  rationale: इब्रानी पदक्रम में אָבִינוּ का ‘इस्राएल’ के साथ समानाधिकरण स्वाभाविक है, पर विराम-चिह्न मूल व्यंजन-पाठ का हिस्सा नहीं हैं; इसलिए दूसरी सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक प्रार्थना के अनुकूल हिन्दी। ‘तू’ यहाँ अनादर का नहीं, परमेश्वर से पारंपरिक निकट प्रत्यक्ष संबोधन का रूप है।
