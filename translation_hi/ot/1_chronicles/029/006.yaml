source:
  edition: WLC
  text: וַ/יִּֽתְנַדְּבוּ֩ שָׂרֵ֨י הָ/אָב֜וֹת וְ/שָׂרֵ֣י שִׁבְטֵ֣י יִשְׂרָאֵ֗ל וְ/שָׂרֵ֤י הָ/אֲלָפִים֙ וְ/הַ/מֵּא֔וֹת וּ/לְ/שָׂרֵ֖י מְלֶ֥אכֶת הַ/מֶּֽלֶךְ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/006.yaml
  text: Then the leaders of the fathers’ houses[a], and the leaders of the tribes of Israel, and the commanders of the thousands and of the hundreds, and the overseers of the king’s work[c][b], gave willingly.
translation:
  language: hi
  text: तब पितृकुलों[b] के प्रधानों, इस्राएल के गोत्रों के प्रधानों, हज़ारों और सैकड़ों के अधिकारियों[c], और राजा के कामकाज के अधिकारियों ने स्वेच्छा से दान दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “स्वेच्छा से भेंट चढ़ाई” या “अपनी इच्छा से आगे आए” भी हो सकता है। इब्रानी क्रिया स्वेच्छापूर्ण प्रत्युत्तर पर बल देती है; यहाँ प्रसंग के अनुसार इसका अर्थ स्वेच्छा से दान देना है।
    reason: lexical_alternative
  - marker: b
    text: “पितृकुल” पैतृक वंश पर आधारित कुलगत पारिवारिक इकाइयाँ थीं।
    reason: cultural_note
  - marker: c
    text: “हज़ारों और सैकड़ों” सैनिक या प्रशासनिक इकाइयों को सूचित करते हैं; इसलिए यहाँ उनके अधिकारियों की बात हो रही है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְנַדְּבוּ
  choice: स्वेच्छा से दान दिया
  rationale: हित्पएल रूप स्वतंत्र इच्छा से उदार योगदान देने को व्यक्त करता है। आसपास के प्रसंग में भौतिक सामग्री का दान हो रहा है, इसलिए केवल ‘स्वेच्छा से आगे आए’ की अपेक्षा यह अधिक स्पष्ट और स्वाभाविक है।
- source_word: שָׂרֵי
  choice: प्रधानों / अधिकारियों
  rationale: यह शब्द अधिकार रखने वाले व्यक्तियों के लिए है। पितृकुलों और गोत्रों के संदर्भ में ‘प्रधान’, तथा संगठित टुकड़ियों और राजकीय कामकाज के संदर्भ में ‘अधिकारी’ स्वाभाविक हिंदी है।
- source_word: הָאָבוֹת
  choice: पितृकुलों
  rationale: यह पैतृक वंश पर आधारित कुलगत पारिवारिक इकाइयों को सूचित करता है; ‘पितृकुल’ इस सामाजिक संरचना को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों
  rationale: इस्राएल की पारंपरिक जनजातीय इकाइयों का सीधा और प्रचलित बाइबिलीय हिंदी रूप।
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: हज़ार और सौ की टुकड़ियों
  rationale: ये संख्याएँ यहाँ सैनिक या प्रशासनिक इकाइयों को सूचित करती हैं। ‘टुकड़ियों’ जोड़ने से हिंदी में आशय स्पष्ट होता है, जबकि दोनों संख्यात्मक श्रेणियाँ बनी रहती हैं।
- source_word: וּלְשָׂרֵי מְלֶאכֶת הַמֶּלֶךְ
  choice: और राजा के कामकाज के अधिकारियों
  rationale: यह वाक्यांश राजकीय कार्य की ज़िम्मेदारी रखने वाले अधिकारियों की ओर संकेत करता है। ‘कामकाज’ מְלָאכָה के व्यापक अर्थ को बनाए रखता है और इसे केवल एक विशेष परियोजना तक सीमित नहीं करता।
