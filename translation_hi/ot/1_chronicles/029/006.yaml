  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पद की सूचीबद्ध संरचना सुरक्षित है। ‘पितृकुल’ सांस्कृतिक विशिष्टता बनाए रखता है, जबकि ‘टुकड़ियों’ और ‘कामकाज’ सामान्य पाठक के लिए आशय स्पष्ट करते हैं।
