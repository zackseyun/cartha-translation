base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/020.yaml
  text: Then David said to all the assembly, “Now bless Yahweh your God.” And all the assembly blessed Yahweh, the God of their fathers, and bowed their heads and prostrated themselves before Yahweh and before the king.
translation:
  language: hi
  text: तब दाऊद ने सारी सभा से कहा, “अब अपने परमेश्वर यहोवा की स्तुति करो।”[a] तब सारी सभा ने अपने पूर्वजों के परमेश्वर यहोवा की स्तुति की। वे झुके और यहोवा और राजा के सामने दण्डवत् किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कृपया अपने परमेश्वर यहोवा की स्तुति करो।” इब्रानी कण נָא आग्रह या तत्परता व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यही दण्डवत् करने की शारीरिक क्रिया “यहोवा और राजा” दोनों के सामने कही गई है। कुछ अनुवाद राजा के संबंध में इसे “सम्मान प्रकट किया” कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בָּרְכוּ נָא
  choice: अब ... स्तुति करो
  rationale: ברך का परमेश्वर की ओर निर्देशित प्रयोग यहाँ उसकी प्रशंसा या स्तुति करने का भाव रखता है। נא आग्रह या तत्परता जोड़ता है; ‘अब’ आज्ञार्थक आग्रह को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הַקָּהָל
  choice: सभा
  rationale: קהל एकत्रित समुदाय को दर्शाता है; इस सार्वजनिक धार्मिक प्रसंग में ‘सभा’ स्वाभाविक और स्पष्ट है।
- source_word: אֱלֹהֵי אֲבֹתֵיהֶם
  choice: अपने पूर्वजों के परमेश्वर
  rationale: אבותיהם का आशय उनकी पिछली पीढ़ियों से है। ‘पूर्वजों’ आधुनिक हिन्दी में समावेशी और स्वाभाविक है तथा वंशगत-वाचा संबंधी भाव बनाए रखता है।
- source_word: וַיִּקְּדוּ
  choice: झुककर
  rationale: קדד शारीरिक रूप से झुकने का संकेत देता है। ‘झुककर’ अगले पूर्ण दण्डवत् से जुड़े क्रम को संक्षेप और स्वाभाविक ढंग से रखता है, बिना ‘सिर’ जैसा स्रोत में अनुपस्थित अंग जोड़े।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत् किया
  rationale: हितपलेल रूप यहाँ भूमि की ओर झुककर प्रणाम करने की ठोस शारीरिक क्रिया बताता है। ‘दण्डवत् किया’ हिन्दी में उस क्रिया को बनाए रखता है और इसे केवल ‘आराधना की’ कहकर धर्मवैचारिक अर्थ में सीमित नहीं करता।
- source_word: לַיהוָה וְלַמֶּלֶךְ
  choice: यहोवा और राजा के सामने
  rationale: השתחוה के साथ ל दोनों के प्रति/सामने की गई दण्डवत् मुद्रा को दर्शाता है। साझा क्रिया और दोनों कर्मों को बनाए रखा गया है, बिना सम्मान के प्रकार को समान घोषित किए।
theological_decisions:
- issue: यहोवा और राजा—दोनों के संबंध में लोगों की दण्डवत् क्रिया
  choice: ठोस शारीरिक भाषा रखते हुए ‘यहोवा और राजा के सामने दण्डवत् किया’
  alternative: ‘यहोवा की आराधना की और राजा को प्रणाम किया’
  rationale: इब्रानी में एक ही क्रिया दोनों के साथ आती है। उसका विभाजन करने से अनुवाद स्वयं सम्मान के दो प्रकार निर्धारित कर देता। शारीरिक क्रिया को ज्यों का त्यों रखने से मूल का धर्मवैचारिक तनाव और वास्तविक अस्पष्टता बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण सार्वजनिक-धार्मिक रजिस्टर। छोटे वाक्यों से पठनीयता रखी गई है। ‘दण्डवत्’ कुछ औपचारिक होते हुए भी सामान्य बाइबिलीय हिन्दी में समझा जाने वाला शब्द है और यहाँ आवश्यक शारीरिक मुद्रा को सटीक रूप से व्यक्त करता है।
