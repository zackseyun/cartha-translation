source:
  edition: WLC
  text: וְ/כִ֨י מִ֤י אֲנִי֙ וּ/מִ֣י עַמִּ֔/י כִּֽי נַעְצֹ֣ר כֹּ֔חַ לְ/הִתְנַדֵּ֖ב כָּ/זֹ֑את כִּֽי מִמְּ/ךָ֣ הַ/כֹּ֔ל וּ/מִ/יָּדְ/ךָ֖ נָתַ֥נּוּ לָֽ/ךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/014.yaml
  text: But who am I[a], and who are my people, that we should be able to offer willingly like this? For everything comes from you, and from your hand we have given to you.
translation:
  language: hi
  text: पर मैं कौन हूँ, और मेरी प्रजा कौन है कि हम इस प्रकार स्वेच्छा से भेंट देने में समर्थ हों?[a] क्योंकि सब कुछ तुझ से है, और तेरे हाथ से हमने तुझे दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, ‘कि हम इस प्रकार स्वेच्छा से भेंट देने की सामर्थ्य रख सकें।’
    reason: इब्रानी मुहावरे נַעְצֹר כֹּחַ का अधिक औपचारिक विकल्प।
lexical_decisions:
- source_word: וְכִי
  choice: पर
  rationale: यह संयोजक दाऊद की प्रार्थना में विनम्रतापूर्ण विस्मय और विरोध का भाव लाता है; आधुनिक हिन्दी में ‘पर’ इस वाक्य-मोड़ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִי אֲנִי וּמִי עַמִּי
  choice: मैं कौन हूँ, और मेरी प्रजा कौन है
  rationale: रूपकात्मक प्रश्न वक्ता और प्रजा की हैसियत तथा अयोग्यता प्रकट करता है; ‘कौन’ मूल प्रश्नवाचक का सीधा और स्वाभाविक प्रतिरूप है।
- source_word: נַעְצֹר כֹּחַ
  choice: हम ... समर्थ हों
  rationale: इस इब्रानी मुहावरे का आशय किसी कार्य के लिए सामर्थ्य या साधन रखने से है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְהִתְנַדֵּב
  choice: स्वेच्छा से भेंट देने
  rationale: हित्पएल रूप अपनी इच्छा से उदारतापूर्वक अर्पण करने का भाव देता है। ‘भेंट देने’ तत्काल प्रसंग के अंशदान को स्पष्ट करता है, जबकि ‘स्वेच्छा से’ उसकी ऐच्छिकता बनाए रखता है।
- source_word: כָזֹאת
  choice: इस प्रकार
  rationale: यह पहले वर्णित असाधारण उदारता की ओर संकेत करता है; ‘इस प्रकार’ आधुनिक, गरिमापूर्ण और संक्षिप्त है।
- source_word: מִמְּךָ הַכֹּל
  choice: सब कुछ तुझी से है
  rationale: यह मूल के संक्षिप्त स्रोत-वाचक कथन को बनाए रखता है और ‘तुझी’ द्वारा परमेश्वर पर बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמִיָּדְךָ
  choice: तेरे ही हाथ से
  rationale: हाथ का बिंब परमेश्वर को प्रावधान का स्रोत दिखाता है और हिन्दी में सहज समझ आता है, इसलिए इसे सुरक्षित रखा गया है।
- source_word: נָתַנּוּ לָךְ
  choice: हमने तुझे दिया है
  rationale: पूर्ण क्रिया प्रार्थना के प्रसंग में संपन्न दान को समेटती है; पूर्ण वर्तमान हिन्दी में इसका स्वाभाविक प्रतिरूप है।
theological_decisions:
- issue: परमेश्वर का स्वामित्व और मनुष्य का दान
  choice: यह स्पष्ट रखा गया है कि सब कुछ परमेश्वर से है और मनुष्य उसी के हाथ से प्राप्त वस्तु उसे देता है।
  alternative: ‘हम केवल वही लौटा रहे हैं जो पहले से तेरा है’ जैसी व्याख्यात्मक शब्दावली जोड़ी जा सकती थी।
  rationale: मूल पाठ परमेश्वर को सबका स्रोत बताता है, पर ‘लौटाना’ शब्द प्रत्यक्षतः नहीं कहता। इसलिए मूल धर्मवैचारिक दावे को सुरक्षित रखते हुए अतिरिक्त सिद्धान्तात्मक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू/तेरा’ रूप का प्रयोग हुआ है। ‘भेंट’ तत्काल मंदिर-निर्माण संबंधी अंशदान का संकेत देता है, पर इसे किसी तकनीकी बलिदान-श्रेणी तक सीमित नहीं करता।
