  text: וְ/לִ/שְׁלֹמֹ֣ה בְנִ֗/י תֵּ֚ן לֵבָ֣ב שָׁלֵ֔ם לִ/שְׁמוֹר֙ מִצְוֺתֶ֔י/ךָ עֵדְוֺתֶ֖י/ךָ וְ/חֻקֶּ֑י/ךָ וְ/לַ/עֲשׂ֣וֹת הַ/כֹּ֔ל וְ/לִ/בְנ֖וֹת הַ/בִּירָ֥ה אֲשֶׁר הֲכִינֽוֹתִי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/019.yaml
  text: And give to Solomon my son a whole heart to keep your commandments[a], your testimonies, and your statutes, and to do all of them, and to build the fortress that I have prepared.
translation:
  language: hi
  text: और मेरे पुत्र सुलैमान को संपूर्ण मन दे कि वह तेरी आज्ञाओं, तेरे साक्ष्य-वचनों और तेरी विधियों का पालन करे, उन सबको पूरा करे, और उस दुर्ग[a] को बनाए जिसकी तैयारी मैंने की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “महल,” अथवा संदर्भ के अनुसार केवल “मंदिर।” यहाँ प्रयुक्त इब्रानी शब्द किसी भव्य या किलेबंद भवन के लिए एक असामान्य शब्द है; इस प्रसंग में इसका संकेत उस पवित्रस्थान की ओर है जिसके निर्माण की तैयारी दाऊद ने सुलैमान के लिए की थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִשְׁלֹמֹה בְנִי תֵּן
  choice: और मेरे पुत्र सुलैमान को ... दे
  rationale: प्रार्थना में अप्रत्यक्ष कर्म और आज्ञार्थक क्रिया को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: לֵבָב שָׁלֵם
  choice: खरा मन
  rationale: यह पद मन की संपूर्णता, निष्ठा और अखंड समर्पण का बोध कराता है। ‘खरा मन’ हिन्दी में सहज है और ‘सिद्ध मन’ जैसी संभावित पूर्णतावादी व्याख्या से बचता है।
- source_word: לִשְׁמוֹר
  choice: पालन करे
  rationale: आज्ञाओं के संदर्भ में שׁמר का अर्थ उन्हें मानना और उनके अनुसार चलना है; ‘पालन करना’ आधुनिक हिन्दी का स्वाभाविक समतुल्य है।
- source_word: מִצְוֺתֶיךָ
  choice: तेरी आज्ञाओं
  rationale: מצוה के आदेशात्मक और वाचा-संबंधी अर्थ को स्पष्ट रखता है।
- source_word: עֵדְוֺתֶיךָ
  choice: तेरी चितौनियों
  rationale: עדות के साक्ष्य अथवा स्मारक निर्देश के भाव को रखते हुए इसे निकटवर्ती ‘आज्ञाओं’ और ‘विधियों’ से अलग दर्शाया गया है।
- source_word: וְחֻקֶּיךָ
  choice: और तेरी विधियों
  rationale: חקים निर्धारित नियमों या विधान को सूचित करता है; ‘विधियाँ’ उसका प्रतिष्ठित और सुबोध हिन्दी रूप है।
- source_word: וְלַעֲשׂוֹת הַכֹּל
  choice: उन सबको पूरा करे
  rationale: ‘सब’ का संदर्भ पूर्ववर्ती आज्ञाओं, चितौनियों और विधियों से है; ‘पूरा करे’ उन्हें व्यवहार में लाने का भाव व्यक्त करता है।
- source_word: וְלִבְנוֹת הַבִּירָה
  choice: और उस गढ़ को बनाए
  rationale: בירה किसी विशाल, राजसी या किलेबंद भवन के लिए प्रयुक्त असामान्य शब्द है। ‘गढ़’ उसके दृढ़ अथवा दुर्ग-सदृश स्वरूप को बनाए रखता है; संदर्भ में यह मंदिर-परिसर है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: אֲשֶׁר הֲכִינוֹתִי
  choice: जिसकी तैयारी मैंने की है
  rationale: हिफ़ील रूप का अर्थ तैयार करना है। यह हिन्दी वाक्य स्पष्ट करता है कि दाऊद ने निर्माण नहीं, उसकी तैयारी की थी।
theological_decisions:
- issue: לֵבָב שָׁלֵם में मन की संपूर्णता
  choice: खरा मन
  alternative: संपूर्ण मन / अविभाजित मन / सिद्ध मन
  rationale: मूल पद निष्ठा, अखंडता और संपूर्ण समर्पण को समेटता है। ‘खरा’ इस नैतिक-आंतरिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह दावा किए कि सुलैमान निष्पाप या पूर्ण हो।
- issue: यरूशलेम के पवित्रस्थान के लिए בִּירָה
  choice: गढ़
  alternative: महल / मंदिर / मंदिर-दुर्ग
  rationale: मूल शब्द की असामान्य, दुर्ग अथवा भव्य भवन-संबंधी छटा को मुख्य पाठ में रखा गया है। केवल ‘महल’ राजनिवास का भ्रम दे सकता है और केवल ‘मंदिर’ विशिष्ट शब्द-चयन खो देता है; पादटिप्पणी संदर्भगत पहचान बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज प्रार्थना-शैली रखी गई है। परमेश्वर के लिए एकवचन निकटतासूचक ‘तेरी’ का प्रयोग पूरे पद में मूल के अनुरूप है। कानूनी पदों के बीच भेद बनाए रखा गया है, और दुर्लभ स्थापत्य शब्द की अस्पष्टता पादटिप्पणी में सुरक्षित है।
