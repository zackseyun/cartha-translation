base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/008.yaml
  text: Whoever had precious stones gave them to the treasury of the house of Yahweh, into the care of Jehiel the Gershonite.
translation:
  language: hi
  text: और जिनके पास पत्थर थे, उन्होंने उन्हें याहवे के भवन के भंडार में गेर्शोनी यहीएल की देखरेख में सौंप दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यहीएल के हाथ द्वारा”; यह मुहावरा उसकी देखरेख या अभिरक्षा में होने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנִּמְצָא אִתּוֹ
  choice: और जिनके पास ... थे
  rationale: निफ़अल कृदंत और אִתּוֹ का यह प्रयोग किसी वस्तु के किसी व्यक्ति के पास पाए जाने, अर्थात उसके अधिकार में होने, को व्यक्त करता है। बहुवचन क्रिया के अनुरूप हिन्दी में स्वाभाविक वितरणात्मक रूप रखा गया है।
- source_word: אֲבָנִים
  choice: बहुमूल्य पत्थर
  rationale: शब्द का मूल अर्थ ‘पत्थर’ है, पर मंदिर के लिए दान और भंडार के प्रसंग में आभूषण या सजावट के काम आने वाले मूल्यवान पत्थर अभिप्रेत हैं।
- source_word: נָתְנוּ
  choice: दे दिया
  rationale: נתן का सीधा अर्थ ‘देना’ है; यहाँ यह वस्तुओं को अर्पण के रूप में सौंपने को दर्शाता है।
- source_word: לְאוֹצַר
  choice: भंडार में
  rationale: אוֹצָר खजाने, भंडार या भंडारगृह का सूचक हो सकता है। यहाँ मंदिर की दान-सामग्री रखने के स्थान के लिए ‘भंडार’ सहज और पर्याप्त व्यापक है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: ‘यहोवा का भवन’ मूल इब्रानी अभिव्यक्ति को बनाए रखता है और प्रसंग में मंदिर के रूप में स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עַל יַד
  choice: की देखरेख में
  rationale: शाब्दिक ‘के हाथ पर/द्वारा’ यहाँ जिम्मेदारी या अभिरक्षा का मुहावरा है; ‘देखरेख में’ आधुनिक हिन्दी में उसका कार्य स्पष्ट करता है।
- source_word: יְחִיאֵל
  choice: यहीएल
  rationale: नाम का इब्रानी उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: הַגֵּרְשֻׁנִּי
  choice: गेर्शोनी
  rationale: यह कुल-सूचक शब्द यहीएल को गेर्शोन के वंश या कुल से संबंधित बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठक-वर्ग में स्थापित रूप ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; ‘याहवे’ संभावित अधिक समीपी लिप्यंतरण है।
- issue: אֲבָנִים में मूल्य का निहितार्थ
  choice: बहुमूल्य पत्थर
  alternative: पत्थर
  rationale: मूल संज्ञा अकेले ‘पत्थर’ कहती है, इसलिए मूल्य का भाव स्पष्ट रूप से शब्द में नहीं है; फिर भी मंदिर-दान और भंडार के संदर्भ में सामान्य पत्थरों के बजाय मूल्यवान सजावटी पत्थर अभिप्रेत होना अधिक स्वाभाविक है। इस संदर्भगत स्पष्टीकरण को पाठ में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण वाक्य-विन्यास रखा गया है। ‘भवन’ मूल के औपचारिक साम्य को और ‘देखरेख में’ इब्रानी मुहावरे के स्वाभाविक हिन्दी अर्थ को व्यक्त करता है।
