id: 1CH.29.18
reference: 1 Chronicles 29:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֗ה אֱ֠לֹהֵי אַבְרָהָ֞ם יִצְחָ֤ק וְ/יִשְׂרָאֵל֙ אֲבֹתֵ֔י/נוּ שֳׁמְרָ/ה זֹּ֣את לְ/עוֹלָ֔ם לְ/יֵ֥צֶר מַחְשְׁב֖וֹת לְבַ֣ב עַמֶּ֑/ךָ וְ/הָכֵ֥ן לְבָבָ֖/ם אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/018.yaml
  text: O Yahweh[a], God of Abraham, Isaac, and Israel, our fathers, keep this forever in the intentions of the thoughts of the heart of your people[d][c][b], and direct their heart toward you.
translation:
  language: hi
  text: हे यहोवा, हमारे पूर्वज अब्राहम, इसहाक और इस्राएल के परमेश्वर, अपनी प्रजा के हृदय के विचारों की इस प्रवृत्ति को सदा बनाए रख, और उनके हृदय को अपनी ओर स्थिर कर।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵי אַבְרָהָם יִצְחָק וְיִשְׂרָאֵל אֲבֹתֵינוּ
  choice: हमारे पूर्वज अब्राहम, इसहाक और इस्राएल के परमेश्वर
  rationale: मूल पाठ के ‘इस्राएल’ को ‘याकूब’ में नहीं बदला गया। ‘पूर्वज’ तीन कुलपिताओं को स्वाभाविक और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שֳׁמְרָה זֹּאת לְעוֹלָם
  choice: इस ... को सदा बनाए रख
  rationale: सन्दर्भ में प्रार्थना यह है कि लोगों की वर्तमान भीतरी मनोवृत्ति बनी रहे; इसलिए ‘बनाए रख’ केवल पहरा देने की अपेक्षा आशय को अधिक स्पष्ट करता है।
- source_word: לְיֵצֶר מַחְשְׁבוֹת לְבַב עַמֶּךָ
  choice: अपनी प्रजा के हृदय के विचारों की इस प्रवृत्ति को
  rationale: יֵצֶר को ‘प्रवृत्ति’ और מַחְשְׁבוֹת को ‘विचार’ दिया गया है। ‘इस’ को इस पूरी भीतरी प्रवृत्ति से जोड़ने पर हिन्दी स्वाभाविक रहती है और जटिल इब्रानी सम्बन्ध सुरक्षित रहता है।
- source_word: וְהָכֵן לְבָבָם אֵלֶיךָ
  choice: और उनके हृदय को अपनी ओर स्थिर कर
  rationale: הכין में स्थापित, दृढ़ अथवा उन्मुख करने का भाव है। ‘अपनी ओर स्थिर कर’ दिशा और दृढ़ता दोनों को व्यक्त करता है; सामूहिक एकवचन ‘हृदय’ भी बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को स्पष्ट रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: יִשְׂרָאֵל की कुलपितृ-संज्ञा
  choice: इस्राएल
  alternative: याकूब
  rationale: इस स्थान पर इब्रानी पाठ स्पष्टतः ‘इस्राएल’ पढ़ता है; परिचित सूत्र के कारण उसे ‘याकूब’ बनाकर सामंजस्य स्थापित नहीं किया गया।
- issue: וְהָכֵן में हृदय की दिशा या दृढ़ता
  choice: अपनी ओर स्थिर कर
  alternative: अपनी ओर लगा दे; अपनी ओर उन्मुख कर
  rationale: क्रिया में स्थापित या दृढ़ करने का मूल भाव है, जबकि אֵלֶיךָ दिशा बताता है। चुना हुआ रूप दोनों तत्वों को बनाए रखता है और किसी विशिष्ट धर्मशास्त्रीय सिद्धान्त को नहीं जोड़ता।
translation_notes:
  register: प्रार्थनामय, गरिमापूर्ण और आधुनिक मानक हिन्दी। ‘हे’ सम्बोधन तथा एकवचन आज्ञार्थक रूप मूल प्रार्थना की सीधाई बनाए रखते हैं। अनावश्यक फ़ारसीकृत या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए ‘हृदय’, ‘प्रवृत्ति’ और ‘स्थिर’ जैसे परिचित बाइबलीय शब्द चुने गए हैं।
