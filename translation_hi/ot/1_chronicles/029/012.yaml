base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/012.yaml
  text: Both riches and honor come from before you[a], and you rule over all. In your hand are power and might[c][b], and in your hand it is to make great and to strengthen all.
translation:
  language: hi
  text: धन और सम्मान[b] तेरे सम्मुख से आते हैं[a], और तू सब पर शासन करता है। शक्ति और पराक्रम तेरे हाथ में हैं; और सबको महान बनाने[c] और सुदृढ़ करने का सामर्थ्य तेरे हाथ में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुझसे आते हैं’ अथवा ‘तेरी उपस्थिति से आते हैं’; इब्रानी में शाब्दिक अर्थ ‘तेरे सम्मुख से’ है।
    reason: lexical_alternative
  - marker: b
    text: ‘सम्मान’ का अनुवाद ‘महिमा’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘महान बनाने’ का अर्थ ‘ऊँचा उठाने’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֹשֶׁר
  choice: धन
  rationale: यह संज्ञा भौतिक संपन्नता या वैभव को दर्शाती है; ‘धन’ आधुनिक हिन्दी में सहज है और ‘सम्मान’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: הַכָּבוֹד
  choice: सम्मान
  rationale: यहाँ राजकीय प्रतिष्ठा और परमेश्वर से मिलने वाले गौरव का भाव है। ‘सम्मान’ मुख्य अर्थ को स्पष्ट रखता है, जबकि ‘महिमा’ भी संभव है।
- source_word: מִלְּפָנֶיךָ
  choice: तेरे सम्मुख से आते हैं
  rationale: इब्रानी का शाब्दिक चित्र ‘तेरे मुख/उपस्थिति के सामने से’ है। यह अनुवाद स्रोत और परमेश्वर की उपस्थिति—दोनों भावों को बिना समतल किए बनाए रखता है।
- source_word: מוֹשֵׁל בַּכֹּל
  choice: तू सब पर शासन करता है
  rationale: कृदंत निरंतर सार्वभौम शासन व्यक्त करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְיָדְךָ
  choice: तेरे हाथ में
  rationale: यह अधिकार और नियंत्रण का इब्रानी रूपक है; मूर्त चित्र को बनाए रखने के लिए इसे यथावत रखा गया है।
- source_word: כֹּחַ
  choice: शक्ति
  rationale: यह सामर्थ्य या कार्य करने की क्षमता दर्शाता है और अगले शब्द ‘पराक्रम’ से अलग रहते हुए उसका पूरक बनता है।
- source_word: גְבוּרָה
  choice: पराक्रम
  rationale: यह प्रबल सामर्थ्य और वीरतापूर्ण शक्ति का भाव देता है; ‘शक्ति और पराक्रम’ एक स्वाभाविक हिन्दी युग्म है।
- source_word: לְגַדֵּל
  choice: महान बनाने
  rationale: हिफ़ील रूप किसी को बड़ा या महान बनाने, अर्थात ऊँचा उठाने, का भाव देता है।
- source_word: לְחַזֵּק
  choice: सुदृढ़ करने
  rationale: क्रिया का अर्थ बल देना या मजबूत करना है; ‘सुदृढ़ करने’ से कारणवाचक भाव स्पष्ट रहता है।
- source_word: לַכֹּל
  choice: सबको
  rationale: इब्रानी अभिव्यक्ति व्यापक है और सभी को समेटती है; ‘सबको’ हिन्दी में संक्षिप्त रहते हुए उस विस्तार को बनाए रखता है।
theological_decisions:
- issue: מִלְּפָנֶיךָ को परमेश्वर की सार्वभौमता और वरदानों के स्रोत के संबंध में कैसे प्रस्तुत किया जाए
  choice: तेरे सम्मुख से आते हैं
  alternative: तुझसे आते हैं; तेरी उपस्थिति से आते हैं
  rationale: मूल पाठ स्पष्ट रूप से ‘तेरे मुख/उपस्थिति के सामने से’ कहता है। ‘तेरे सम्मुख से’ उस चित्र को सुरक्षित रखता है और धन तथा सम्मान को परमेश्वर से निकलने वाला बताता है, पर उससे आगे कोई सिद्धान्तगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापरक, गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए एकवचन निकट संबोधन ‘तू/तेरे’ मूल इब्रानी के द्वितीय पुरुष एकवचन और पद के प्रत्यक्ष स्तुतिपरक स्वर को दर्शाता है। ‘हाथ में’ रूपक जानबूझकर सुरक्षित रखा गया है।
