  yaml_path: translation/ot/1_chronicles/029/030.yaml
  text: along with all his reign and his might[b][a], and the times that passed over him and over Israel and over all the kingdoms of the lands.
translation:
  language: hi
  text: उसके समूचे राज्यकाल और उसके पराक्रम सहित, और वे समय भी जो उस पर, इस्राएल पर, और सभी देशों के राज्यों पर बीते।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִם
  choice: सहित
  rationale: यह पूर्ववर्ती पद में बताए गए अभिलेखों के साथ इन बातों को जोड़ता है और साहचर्य का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְכוּתוֹ
  choice: उसके पूरे राज्यकाल
  rationale: यहाँ दाऊद के शासन की अवधि और स्वरूप का सार है; इसलिए भूभागसूचक ‘राज्य’ की अपेक्षा ‘राज्यकाल’ अधिक उपयुक्त है। כָּל को ‘पूरे’ से व्यक्त किया गया है।
- source_word: גְבוּרָתוֹ
  choice: उसके पराक्रम
  rationale: यह शब्द सामर्थ्य, वीरता या पराक्रमी कार्यों का बोध करा सकता है। ‘पराक्रम’ इस अर्थ-विस्तार को बिना केवल कार्यों तक सीमित किए बनाए रखता है।
- source_word: הָעִתִּים
  choice: वे समय
  rationale: मूल के बहुवचन को सीधे रखते हुए यह दाऊद और संबंधित राज्यों पर आए कालों तथा परिस्थितियों को खुला छोड़ता है।
- source_word: אֲשֶׁר עָבְרוּ עָלָיו
  choice: जो उस पर ... बीते
  rationale: इब्रानी मुहावरे में समयों के किसी पर ‘बीतने’ की छवि है। हिन्दी में यह बोधगम्य है और मूल रूपक को सुरक्षित रखता है।
- source_word: וְעַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: ‘उस पर, इस्राएल पर ...’ की समानांतर संरचना और दोहराए गए संबंधसूचक को बनाए रखा गया है।
- source_word: כָּל מַמְלְכוֹת הָאֲרָצוֹת
  choice: सभी देशों के राज्यों
  rationale: הָאֲרָצוֹת के बहुवचन को ‘देशों’ से स्पष्ट किया गया है; इससे आसपास के भूभागों या राष्ट्रों का आशय बना रहता है और इसे अनावश्यक रूप से ‘सारी पृथ्वी’ नहीं बनाया जाता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पूर्ववर्ती वाक्य की सूची को आगे बढ़ाता है, इसलिए ‘सहित’ और ‘भी’ से उसके संयोजक स्वरूप को सुरक्षित किया गया है।
