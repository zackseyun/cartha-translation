  text: וַ/יִּזְבְּח֣וּ לַ/יהוָ֣ה זְ֠בָחִים וַ/יַּעֲל֨וּ עֹל֜וֹת לַ/יהוָ֗ה לְֽ/מָחֳרַת֮ הַ/יּ֣וֹם הַ/הוּא֒ פָּרִ֨ים אֶ֜לֶף אֵילִ֥ים אֶ֛לֶף כְּבָשִׂ֥ים אֶ֖לֶף וְ/נִסְכֵּי/הֶ֑ם וּ/זְבָחִ֥ים לָ/רֹ֖ב לְ/כָל יִשְׂרָאֵֽל׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/021.yaml
  text: 'They sacrificed sacrifices to Yahweh and offered up burnt offerings to Yahweh on the next day after that day: one thousand bulls[a], one thousand rams, one thousand lambs, and their drink offerings[c][b], and sacrifices in abundance for all Israel.'
translation:
  language: hi
  text: उन्होंने उस दिन के अगले दिन[a] यहोवा के लिए बलियाँ चढ़ाईं और यहोवा के लिए होमबलियाँ अर्पित कीं—एक हज़ार बैल, एक हज़ार मेढ़े, एक हज़ार मेमने और उनकी पेय-बलियाँ[b]—तथा समस्त इस्राएल के लिए बहुतायत में बलिदान चढ़ाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे अधिक सहज रूप में “अगले दिन” भी कहा जा सकता है। इब्रानी में अक्षरशः “उस दिन के अगले दिन” है।
    reason: lexical_alternative
  - marker: b
    text: “पेय-बलियाँ” पशुबलियों के साथ उंडेली जाने वाली तरल भेंटें थीं; इन्हें “अर्घ” या “उंडेली जाने वाली भेंटें” भी कहा जा सकता है।
    reason: cultural_note
  - marker: c
    text: “समस्त इस्राएल के लिए” का अर्थ “समस्त इस्राएल की ओर से” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּזְבְּחוּ ... זְבָחִים
  choice: बलियाँ चढ़ाईं
  rationale: इब्रानी की सजातीय क्रिया और संज्ञा बलि चढ़ाने के कार्य पर बल देती हैं। हिंदी में दोनों को अक्षरशः दोहराना अस्वाभाविक होता, इसलिए प्रचलित और स्पष्ट अभिव्यक्ति चुनी गई है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद समर्पण या उद्देश्य दर्शाता है। परियोजना की नीति के अनुसार परमेश्वर का व्यक्तिगत वाचा-नाम ‘यहोवा’ रखा गया है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह ऐसी बलियों का विशिष्ट उपासना-संबंधी पद है जो वेदी पर पूरी तरह जलाई जाती थीं; इसे सामान्य ‘बलियों’ से अलग रखा गया है।
- source_word: לְמָחֳרַת הַיּוֹם הַהוּא
  choice: उस दिन के अगले दिन
  rationale: यह इब्रानी की कुछ बलाघाती काल-संरचना को सुरक्षित रखते हुए हिंदी में सहज और स्पष्ट है।
- source_word: פָּרִים אֶלֶף
  choice: एक हज़ार बैल
  rationale: פָּרִים बलि के योग्य नर गोवंश को दर्शाता है; ‘बैल’ स्वाभाविक हिंदी समतुल्य है।
- source_word: אֵילִים אֶלֶף
  choice: एक हज़ार मेढ़े
  rationale: אֵילִים विशेष रूप से नर भेड़ों को दर्शाता है, इसलिए सामान्य ‘भेड़ें’ के बजाय ‘मेढ़े’ चुना गया है।
- source_word: כְּבָשִׂים אֶלֶף
  choice: एक हज़ार मेमने
  rationale: बलि-संबंधी प्रसंग में כְּבָשִׂים सामान्यतः मेमनों या कम आयु की भेड़ों के लिए प्रयुक्त होता है।
- source_word: וְנִסְכֵּיהֶם
  choice: साथ ही उनके अर्घ
  rationale: נְסָכִים पशुबलियों के साथ उंडेली जाने वाली तरल भेंटें थीं। ‘अर्घ’ संक्षिप्त धार्मिक पद है; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
- source_word: וּזְבָחִים לָרֹב
  choice: बहुतायत में बलिदान चढ़ाए
  rationale: לָרֹב बड़ी मात्रा या प्रचुरता दर्शाता है। यह वाक्यांश गिनाई गई होमबलियों के अतिरिक्त व्यापक बलिदानों का उल्लेख करता है, पर मुख्य पाठ में ‘अन्य’ जोड़कर इसे आवश्यकता से अधिक स्पष्ट नहीं किया गया।
- source_word: לְכָל יִשְׂרָאֵל
  choice: समस्त इस्राएल के लिए
  rationale: לְ यहाँ लाभ, उद्देश्य या प्रतिनिधिक संबंध व्यक्त कर सकता है। व्यापक ‘के लिए’ इस अस्पष्टता को सुरक्षित रखता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी के सामान्य पाठकों में परिचित रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: לְכָל יִשְׂרָאֵל का प्रतिनिधिक या लाभार्थक अर्थ
  choice: समस्त इस्राएल के लिए
  alternative: समस्त इस्राएल की ओर से
  rationale: ‘की ओर से’ प्रतिनिधिक बलिदान का अर्थ अधिक निश्चित कर देता। सामान्य ‘के लिए’ इब्रानी पूर्वसर्ग के लाभार्थक और प्रतिनिधिक दोनों संभावित भावों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘होमबलि’ और ‘अर्घ’ जैसे स्थापित धार्मिक शब्दों को संदर्भगत सटीकता के लिए रखा गया है; कम परिचित ‘अर्घ’ को पादटिप्पणी में समझाया गया है। संख्याओं और बलि-पशुओं की क्रमबद्धता मूल पाठ के अनुसार सुरक्षित है।
