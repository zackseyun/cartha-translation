language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יָדַ֣עְתִּי אֱלֹהַ֔/י כִּ֤י אַתָּה֙ בֹּחֵ֣ן לֵבָ֔ב וּ/מֵישָׁרִ֖ים תִּרְצֶ֑ה אֲנִ֗י בְּ/יֹ֤שֶׁר לְבָבִ/י֙ הִתְנַדַּ֣בְתִּי כָל אֵ֔לֶּה וְ/עַתָּ֗ה עַמְּ/ךָ֙ הַ/נִּמְצְאוּ פֹ֔ה רָאִ֥יתִי בְ/שִׂמְחָ֖ה לְ/הִֽתְנַדֶּב לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/017.yaml
  text: And I know[a], my God, that you test the heart and take pleasure in uprightness. I, in the uprightness of my heart, have willingly offered all these things[b], and now I have seen your people who are present here willingly offer to you with joy.
translation:
  language: hi
  text: और हे मेरे परमेश्वर, मैं जानता हूँ कि तू हृदय को परखता है और खराई को पसन्द करता है। मैंने अपने हृदय की खराई से ये सब वस्तुएँ स्वेच्छा से अर्पित की हैं; और अब मैंने आनन्द के साथ यहाँ उपस्थित[a] तेरी प्रजा को तुझे स्वेच्छा से अर्पित करते देखा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो यहाँ पाए गए हैं”; अर्थात् “जो यहाँ उपस्थित हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בֹּחֵן לֵבָב
  choice: हृदय को परखता है
  rationale: בֹּחֵן जाँचने और परखने का मूल्यांकनात्मक भाव रखता है; ‘परखता है’ आधुनिक हिन्दी में स्वाभाविक है। לֵבָב को ‘हृदय’ रखना भीतरी व्यक्ति, विचार और इच्छा की इब्रानी अवधारणा को संकुचित नहीं करता।
- source_word: וּמֵישָׁרִים תִּרְצֶה
  choice: खराई से प्रसन्न होता है
  rationale: מֵישָׁרִים नैतिक सीधाई या खराई को और תִּרְצֶה प्रसन्न होने अथवा स्वीकार करने को व्यक्त करता है। ‘खराई से प्रसन्न’ दोनों भावों को सहज रूप से रखता है।
- source_word: בְּיֹשֶׁר לְבָבִי
  choice: अपने हृदय की खराई से
  rationale: यह वाक्यांश दाऊद के अर्पण की भीतरी नैतिक दशा और रीति बताता है। ‘खराई’ पहले प्रयुक्त מֵישָׁרִים के साथ मूल पाठ की अर्थगत पुनरावृत्ति भी बनाए रखती है।
- source_word: הִתְנַדַּבְתִּי
  choice: स्वेच्छा से अर्पित की हैं
  rationale: हित्पएल रूप स्वेच्छापूर्वक देने का भाव रखता है; भेंटों के प्रसंग में ‘अर्पित’ सामान्य ‘दिया’ से अधिक उपयुक्त है।
- source_word: כָל אֵלֶּה
  choice: ये सब वस्तुएँ
  rationale: संकेतवाचक पद पूर्ववर्ती भेंटों की ओर लौटता है। ‘वस्तुएँ’ जोड़ने से हिन्दी स्पष्ट होती है, बिना भेंटों का स्वरूप अनावश्यक रूप से निश्चित किए।
- source_word: עַמְּךָ הַנִּמְצְאוּ פֹה
  choice: यहाँ उपस्थित तेरी प्रजा
  rationale: निफ़अल נמצא का शाब्दिक अर्थ ‘पाए गए’ हो सकता है, पर यहाँ उसका मुहावरेदार अर्थ ‘उपस्थित’ है। हिन्दी में ‘यहाँ उपस्थित’ स्पष्ट और स्वाभाविक है।
- source_word: רָאִיתִי בְשִׂמְחָה
  choice: मैंने आनन्द के साथ ... देखा है
  rationale: पूर्वसर्गीय पद को दाऊद के देखने से जोड़ा गया है, जैसा इब्रानी वाक्य-विन्यास सहज रूप से संकेत करता है; इससे लोगों के आनन्द और दाऊद के आनन्द के बीच अनावश्यक निर्णय नहीं थोपा जाता।
- source_word: לְהִתְנַדֶּב לָךְ
  choice: तुझे स्वेच्छा से अर्पित करते
  rationale: נדב की पुनरावृत्ति को ‘स्वेच्छा से अर्पित’ दोहराकर बनाए रखा गया है और לָךְ को स्पष्टतः ‘तुझे’ कहा गया है।
- source_word: אֱלֹהַי
  choice: हे मेरे परमेश्वर
  rationale: सम्बोधन को स्पष्ट करने के लिए हिन्दी का स्वाभाविक सम्बोधन-चिह्न ‘हे’ रखा गया है।
theological_decisions:
- issue: לֵבָב का मानवशास्त्रीय अर्थ
  choice: हृदय—भीतरी व्यक्ति, विचार और इच्छा को समेटने वाला रूपक
  alternative: मन अथवा अन्तर्मन
  rationale: ‘मन’ केवल विचार पर और ‘अन्तर्मन’ केवल आन्तरिकता पर बल दे सकता है; ‘हृदय’ मूल रूपक और उसकी व्यापकता को सुरक्षित रखता है।
- issue: רָאִיתִי בְשִׂמְחָה में आनन्द किसका है
  choice: ‘आनन्द के साथ’ को दाऊद के देखने से सम्बद्ध रखा गया
  alternative: प्रजा ने आनन्द से अर्पित किया
  rationale: इब्रानी में בְשִׂמְחָה ‘मैंने देखा’ के निकट और उससे स्वाभाविक रूप से जुड़ा है। लोगों के आनन्द को व्याकरणिक रूप से निश्चित करना सम्भव है, पर पाठ की संरचना दाऊद के आनन्द को अधिक सीधे व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण शैली रखी गई है। परमेश्वर के लिए पारम्परिक एकवचन ‘तू/तेरी/तुझे’ प्रयोग किया गया है। ‘खराई’ मूल पाठ में מֵישָׁרִים और יֹשֶׁר की अर्थगत निकटता को बनाए रखती है।
