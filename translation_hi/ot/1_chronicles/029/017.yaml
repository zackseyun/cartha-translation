review_pass:
  verdict: revise
  source_fidelity: 'The draft accurately represents the verse’s principal clauses: God examines the heart, approves uprightness, David has voluntarily offered all these things with integrity of heart, and he joyfully observes the people present voluntarily offering to God. The rendering of בְשִׂמְחָה as modifying David’s seeing appropriately preserves the syntactic ambiguity without assigning the joy exclusively to the people.'
  naturalness: Most of the Hindi is clear and suitably dignified. However, “खराई से प्रसन्न होता है” is less idiomatic and can be read instrumentally (“is pleased by means of integrity”) rather than expressing the object of divine approval. “खराई को पसन्द करता है” is direct, natural, and retains the source sense. Removing “भी” avoids adding an unnecessary explicit ‘also’ to the people’s offering.
  terminology: “हृदय,” “स्वेच्छा से,” and “अर्पित” are appropriate for the Hebrew and the offering context. “खराई” suitably maintains the semantic connection between מֵישָׁרִים and יֹשֶׁר; the revision only adjusts its syntactic role.
  issues:
  - severity: low
    issue: “खराई से प्रसन्न होता है” is syntactically ambiguous in Hindi.
    rationale: The Hebrew construction presents uprightness as that in which God takes pleasure. Using the accusative/object construction, “खराई को पसन्द करता है,” communicates this relation more naturally and precisely.
  - severity: low
    issue: “भी” in “प्रजा को भी” makes the additive relation explicit.
    rationale: Although contextually understandable, the Hebrew does not require an explicit ‘also’; omitting it is slightly closer and reads smoothly.
  revised_text: और हे मेरे परमेश्वर, मैं जानता हूँ कि तू हृदय को परखता है और खराई को पसन्द करता है। मैंने अपने हृदय की खराई से ये सब वस्तुएँ स्वेच्छा से अर्पित की हैं; और अब मैंने आनन्द के साथ यहाँ उपस्थित[a] तेरी प्रजा को तुझे स्वेच्छा से अर्पित करते देखा है।
