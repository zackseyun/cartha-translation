source:
  edition: WLC
  text: וַֽ/יִּתְּנ֞וּ לַ/עֲבוֹדַ֣ת בֵּית הָ/אֱלֹהִ֗ים זָהָ֞ב כִּכָּרִ֣ים חֲמֵֽשֶׁת אֲלָפִים֮ וַ/אֲדַרְכֹנִ֣ים רִבּוֹ֒ וְ/כֶ֗סֶף כִּכָּרִים֙ עֲשֶׂ֣רֶת אֲלָפִ֔ים וּ/נְחֹ֕שֶׁת רִבּ֛וֹ וּ/שְׁמוֹנַ֥ת אֲלָפִ֖ים כִּכָּרִ֑ים וּ/בַרְזֶ֖ל מֵֽאָה אֶ֥לֶף כִּכָּרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/007.yaml
  text: And they gave for the service of the house of God five thousand talents of gold and ten thousand darics[a], and ten thousand talents of silver, and eighteen thousand talents of bronze[c][b], and one hundred thousand talents of iron.
translation:
  language: hi
  text: उन्होंने परमेश्वर के भवन की सेवा के लिए पाँच हज़ार किक्कार सोना, दस हज़ार दारिक[a], दस हज़ार किक्कार चाँदी, अठारह हज़ार किक्कार काँसा और एक लाख किक्कार लोहा दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दारिक फ़ारस की एक सोने की मुद्रा थी।
    reason: cultural_note
  - marker: b
    text: किक्कार प्राचीन काल में भार की एक बड़ी इकाई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: उन्होंने ... दिया
  rationale: यह पूर्ण हुई कथात्मक क्रिया का सीधा और स्वाभाविक हिन्दी रूप है; प्रसंग से दान का भाव स्पष्ट है, इसलिए अधिक व्याख्यात्मक ‘योगदान किया’ आवश्यक नहीं।
- source_word: לַעֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन की सेवा के लिए
  rationale: ‘सेवा’ इब्रानी עֲבוֹדָה में निहित कार्य और धार्मिक सेवा दोनों की गुंजाइश बनाए रखती है; ‘भवन’ मूल के בית को दर्शाता है, बिना सीधे ‘मन्दिर’ कहे।
- source_word: כִּכָּרִים
  choice: किक्कार
  rationale: प्राचीन भार-माप के लिए प्रचलित बाइबलीय हिन्दी पारिभाषिक शब्द रखा गया है; आधुनिक पाठक की सहायता हेतु पादटिप्पणी दी गई है।
- source_word: אֲדַרְכֹנִים
  choice: दारिक
  rationale: यह फ़ारसी स्वर्ण-मुद्रा का ऐतिहासिक नाम है; सामान्य ‘सोने के सिक्के’ कहने से उसकी विशिष्टता मिट जाती।
- source_word: רִבּוֹ וּשְׁמוֹנַת אֲלָפִים
  choice: अठारह हज़ार
  rationale: मूल की ‘दस हज़ार और आठ हज़ार’ संरचना का स्वाभाविक हिन्दी योग अठारह हज़ार है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: शब्द ताँबा या काँसा सूचित कर सकता है; प्राचीन भवन-सामग्री की इस सूची में काँसा परंपरागत और प्रसंगानुकूल विकल्प है।
- source_word: מֵאָה אֶלֶף
  choice: एक लाख
  rationale: 100,000 का स्वाभाविक आधुनिक हिन्दी संख्या-रूप।
