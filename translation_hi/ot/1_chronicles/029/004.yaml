translation:
  language: hi
  text: ओपीर के सोने में से[a] तीन हज़ार किक्कार[b], और शुद्ध की हुई चाँदी के सात हज़ार किक्कार, भवनों की दीवारों पर मढ़ने के लिए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘ओपीर का सोना’ भी हो सकता है। इब्रानी पदबंध सोने के ओपीर से प्राप्त होने या उसे ‘ओपीर का सोना’ कहकर वर्णित करने—दोनों अर्थों की अनुमति देता है।
    reason: lexical_alternative
  - marker: b
    text: ‘किक्कार’ भार की एक प्राचीन इकाई है।
    reason: cultural_note
