- source_word: שְׁלֹשֶׁת אֲלָפִים
  choice: तीन हज़ार
  rationale: इब्रानी संख्या-पदबंध का आधुनिक मानक हिन्दी में सीधा और स्वाभाविक अनुवाद।
- source_word: כִּכְּרֵי / כִּכַּר
  choice: किक्कार
  rationale: यह प्राचीन भार-माप है। ऐतिहासिक इकाई को लिप्यंतरित रखने से किसी अनिश्चित आधुनिक भार-समानता को पाठ में आरोपित नहीं किया गया; अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: זָהָב
  choice: सोना
  rationale: बहुमूल्य धातु का सीधा और प्रसंगानुकूल हिन्दी पद।
- source_word: מִזְּהַב אוֹפִיר
  choice: ओपीर के सोने में से
  rationale: מִן उपसर्ग के स्रोत या चयन-सूचक भाव को ‘में से’ द्वारा रखा गया है और אוֹפִיר को स्थाननाम के रूप में लिप्यंतरित किया गया है।
- source_word: וְשִׁבְעַת אֲלָפִים
  choice: और ... सात हज़ार
  rationale: संयोजक और संख्या का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: इस प्रसंग में शब्द धन नहीं, बहुमूल्य धातु को सूचित करता है।
- source_word: מְזֻקָּק
  choice: शुद्ध की हुई
  rationale: निष्क्रिय कृदन्त धातु को परिशोधन द्वारा शुद्ध किए जाने का भाव देता है।
- source_word: לָטוּחַ
  choice: मढ़ने के लिए
  rationale: सोने-चाँदी से किसी सतह को आवृत करने के स्थापत्य प्रसंग में ‘मढ़ना’ स्वाभाविक और सटीक है; ‘पलस्तर करना’ धातु के प्रयोग को अस्पष्ट कर सकता है।
- source_word: קִירוֹת
  choice: दीवारों
  rationale: बहुवचन संज्ञा का सामान्य और सटीक हिन्दी रूप।
- source_word: הַבָּתִּים
  choice: भवनों
  rationale: शाब्दिक ‘घरों’ की अपेक्षा मंदिर-निर्माण के स्थापत्य प्रसंग में ‘भवनों’ अधिक स्वाभाविक है, जबकि इब्रानी बहुवचन की व्यापकता बनी रहती है।
