base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/005.yaml
  text: gold for the things of gold[a], and silver for the things of silver, and for every kind of work by the hands of craftsmen. And who is willing to fill his hand today for Yahweh?
translation:
  language: hi
  text: सोना, सोने की वस्तुओं के लिए, और चाँदी, चाँदी की वस्तुओं के लिए, और कारीगरों के हाथों किए जाने वाले हर प्रकार के काम के लिए। और आज कौन याहवे के लिए अपना हाथ भरने[a] को स्वेच्छा से आगे आएगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपना हाथ भरना।” यह इब्रानी मुहावरा पवित्र सेवा के लिए समर्पण या भेंट अर्पित करने का भाव दे सकता है।
    reason: मुहावरे की शाब्दिक छवि तथा समर्पण और अर्पण से संबंधित उसकी संभावित अर्थ-सीमा को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: לַזָּהָב לַזָּהָב
  choice: सोना, सोने की वस्तुओं के लिए
  rationale: इब्रानी की पुनरुक्त, दीर्घवृत्तीय अभिव्यक्ति सोने से बननेवाली वस्तुओं के लिए निर्धारित सोने की ओर संकेत करती है। ‘वस्तुओं’ जोड़ने से आशय स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: וְלַכֶּסֶף לַכֶּסֶף
  choice: और चाँदी, चाँदी की वस्तुओं के लिए
  rationale: यह सोनेवाले वाक्यांश के समानांतर है और चाँदी से बननेवाली वस्तुओं के लिए रखी गई चाँदी को दर्शाता है।
- source_word: וּלְכָל מְלָאכָה בְּיַד חָרָשִׁים
  choice: और कारीगरों के हाथ से होनेवाले हर प्रकार के काम के लिए
  rationale: यह रूप कारीगरों द्वारा किए जानेवाले समस्त शिल्पकार्य को व्यक्त करता और मूल के ‘हाथ’ वाले बिंब को बनाए रखता है।
- source_word: וּמִי מִתְנַדֵּב
  choice: फिर ... कौन ... स्वेच्छा से आगे आएगा?
  rationale: हित्पाएल रूप स्वेच्छा और उदार तत्परता का भाव देता है; प्रश्न राजा की सार्वजनिक अपील के रूप में स्वाभाविक रहता है।
- source_word: לְמַלֹּאות יָדוֹ
  choice: अपना हाथ भरने को
  rationale: मूल मुहावरे का शाब्दिक रूप रखा गया है ताकि समर्पण और पवित्र सेवा के लिए भेंट देने के बीच की वास्तविक अर्थगत व्यापकता बनी रहे; अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: הַיּוֹם
  choice: आज
  rationale: समयवाचक क्रियाविशेषण का सीधा और आधुनिक हिन्दी रूप।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: इब्रानी में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; ‘के लिए’ समर्पण अथवा अर्पण की दिशा को व्यक्त करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: לְמַלֹּאות יָדוֹ पवित्र-संदर्भित मुहावरा
  choice: मुख्य पाठ में ‘अपना हाथ भरने’ और फुटनोट में अर्थ-सीमा
  alternative: अपने आपको समर्पित करने / भरपूर भेंट देने
  rationale: संदर्भ भेंट देने का है, जबकि इस मुहावरे में अभिषेक, समर्पण या पवित्र सेवा के लिए हाथ में अर्पण रखने का भाव भी हो सकता है। शाब्दिक बिंब और फुटनोट इस तनाव को बिना एक ही व्याख्या थोपे सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। समानांतर संरचना और ‘हाथ’ का इब्रानी बिंब सुरक्षित रखा गया है; अल्पपरिचित मुहावरे को फुटनोट से स्पष्ट किया गया है।
