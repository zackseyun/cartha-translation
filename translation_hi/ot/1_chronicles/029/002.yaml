base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/002.yaml
  text: 'And with all my strength I have prepared for the house of my God: the gold for the things of gold[a], and the silver for the things of silver, and the bronze for the things of bronze, the iron for the things of iron, and the wood for the things of wood; onyx stones, settings, stones of antimony, variegated stones, every precious stone[d][c][b], and marble stones in abundance.'
translation:
  language: hi
  text: और मैंने अपनी पूरी सामर्थ्य से अपने परमेश्वर के भवन के लिए सोने की वस्तुओं के लिए सोना, चाँदी की वस्तुओं के लिए चाँदी, काँसे की वस्तुओं के लिए काँसा, लोहे की वस्तुओं के लिए लोहा और लकड़ी की वस्तुओं के लिए लकड़ी तैयार की है; सुलेमानी पत्थर[a], जड़ाव[b], सुरमे के पत्थर[c], रंग-बिरंगे पत्थर[d], हर प्रकार के बहुमूल्य पत्थर और बहुतायत में संगमरमर के पत्थर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद में बताए गए कुछ पत्थरों की ठीक पहचान अनिश्चित है। שֹׁהַם के लिए ‘सुलेमानी पत्थर’ और שַׁיִשׁ के लिए ‘संगमरमर’ सामान्य पारंपरिक अनुवाद हैं, यद्यपि अन्य पहचानें भी सुझाई गई हैं।
    reason: lexical_alternative
  - marker: b
    text: מִלּוּאִים का अर्थ ‘जड़ाव’, ‘जड़ाई’, पत्थर बैठाने की ‘सेटिंग’ या ‘खाँचे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘सुरमे के पत्थर’ वाला पदबंध कठिन है; यह गहरे वर्णक से जुड़े पत्थरों, सजावटी जड़ाई या किसी अन्य अलंकरण-सामग्री को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: d
    text: רִקְמָה को आसपास के पत्थरों और निर्माण-सामग्री की सूची के अनुसार ‘रंग-बिरंगे पत्थर’ कहा गया है; अन्य स्थानों पर यह शब्द कढ़ाईदार या विविध रंगों वाले काम के लिए भी आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּכְכָל כֹּחִי
  choice: और मैंने अपनी पूरी सामर्थ्य से
  rationale: यह पदबंध दाऊद द्वारा अपनी सारी शक्ति और उपलब्ध साधनों के पूरे उपयोग को व्यक्त करता है; ‘अपनी पूरी सामर्थ्य से’ स्वाभाविक और स्रोत के निकट है।
- source_word: הֲכִינוֹתִי
  choice: तैयार की है
  rationale: पूर्ण क्रिया दाऊद की पूरी हो चुकी तैयारी और वर्तमान भाषण में उसकी प्रासंगिकता दर्शाती है। सामग्री की सूची के कारण हिन्दी में स्त्रीलिंग क्रिया स्वाभाविक है।
- source_word: לְבֵית אֱלֹהַי
  choice: अपने परमेश्वर के भवन के लिए
  rationale: ‘भवन’ स्रोत के ‘घर/भवन’ रूपक को बनाए रखता है और ‘मन्दिर’ जैसी व्याख्यात्मक संज्ञा को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: הַזָּהָב לַזָּהָב ... וְהָעֵצִים לָעֵצִים
  choice: सोने की वस्तुओं के लिए सोना ... लकड़ी की वस्तुओं के लिए लकड़ी
  rationale: दोहराए गए सामग्री + ל विन्यास का आशय प्रत्येक सामग्री को उसी से बनने वाली वस्तुओं के लिए नियत करना है; हिन्दी में ‘वस्तुओं के लिए’ अर्थ स्पष्ट करता है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: शब्द ताँबा या काँसा सूचित कर सकता है; पवित्र भवन की धातु-वस्तुओं के प्रसंग में पारंपरिक और संभावित अर्थ ‘काँसा’ है।
- source_word: אַבְנֵי שֹׁהַם
  choice: सुलेमानी पत्थर
  rationale: शोहम की ठीक पहचान अनिश्चित है; ‘सुलेमानी पत्थर’ हिन्दी की परिचित पारंपरिक संज्ञा है, और अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: וּמִלּוּאִים
  choice: जड़ने के लिए खाँचे
  rationale: मिल्लूईम आभूषणकारी काम में पत्थर बैठाने की जगह, जड़ाई अथवा जड़ाव का संकेत देता है; प्रसंग में यह अर्थ स्पष्ट और सहज है।
- source_word: אַבְנֵי פוּךְ
  choice: सुरमे के पत्थर
  rationale: पूख सामान्यतः सुरमा बनाने वाले गहरे खनिज या वर्णक से जुड़ा है; शाब्दिक संबंध बनाए रखते हुए इसकी कठिन पहचान पादटिप्पणी में बताई गई है।
- source_word: וְרִקְמָה
  choice: रंग-बिरंगे पत्थर
  rationale: रिक्माह प्रायः रंग-बिरंगे या कढ़ाईदार काम को दर्शाता है; पत्थरों और निर्माण-सामग्री की इस सूची में रंग-बिरंगे पत्थर या पत्थरकारी सबसे प्रसंगानुकूल है।
- source_word: אַבְנֵי שַׁיִשׁ
  choice: संगमरमर के पत्थर
  rationale: शयिश की सटीक पहचान विवादित है, पर ‘संगमरमर’ सामान्य पारंपरिक अर्थ है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לָרֹב
  choice: बहुतायत में
  rationale: यह मात्रा की प्रचुरता व्यक्त करता है; ‘बहुतायत में’ dignified तथा स्पष्ट हिन्दी है।
