source:
  edition: WLC
  text: כִּֽי גֵרִ֨ים אֲנַ֧חְנוּ לְ/פָנֶ֛י/ךָ וְ/תוֹשָׁבִ֖ים כְּ/כָל אֲבֹתֵ֑י/נוּ כַּ/צֵּ֧ל יָמֵ֛י/נוּ עַל הָ/אָ֖רֶץ וְ/אֵ֥ין מִקְוֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/015.yaml
  text: For we are sojourners before you[a], and temporary residents, as all our fathers were. Our days on the earth are like a shadow[c][b], and there is no hope.
translation:
  language: hi
  text: क्योंकि हम आपके सामने परदेशी और अस्थायी निवासी हैं,[a] जैसे हमारे सभी पुरखे थे। पृथ्वी पर हमारे दिन छाया के समान हैं, और कोई आशा नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ के लिए ‘विदेशी’ और ‘अस्थायी निवासी’ के लिए ‘प्रवासी’ या ‘निवासी परदेसी’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘कोई आशा नहीं’ पृथ्वी पर मानव जीवन की क्षणभंगुरता के संदर्भ में है; यह परमेश्वर में आशा के पूर्ण अभाव का कथन नहीं है।
    reason: contextual_clarification
lexical_decisions:
- source_word: גֵרִים
  choice: परदेशी
  rationale: यह शब्द ऐसे व्यक्ति को दर्शाता है जो अपने मूल देश से बाहर रह रहा हो; ‘परदेशी’ सामाजिक अस्थायित्व और गैर-स्थानीय स्थिति दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְפָנֶיךָ
  choice: आपके सामने
  rationale: यह ‘आपके मुख के सामने’ का स्वाभाविक और निकट हिंदी रूप है तथा प्रार्थना की परमेश्वराभिमुखता बनाए रखता है।
- source_word: תוֹשָׁבִים
  choice: प्रवासी
  rationale: यह किसी स्थान पर रहने वाले, पर वहाँ स्थायी या मूल निवासी का पूरा दर्जा न रखने वाले व्यक्ति को सूचित करता है। ‘परदेशी’ के साथ इसकी समानांतरता भी बनी रहती है।
- source_word: כְּכָל אֲבֹתֵינוּ
  choice: जैसे हमारे सभी पुरखे थे
  rationale: ‘पुरखे’ यहाँ इस्राएल की पिछली पीढ़ियों को समावेशी और सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: כַּצֵּל
  choice: छाया के समान
  rationale: यह जीवन की क्षणभंगुरता का मूल रूपक बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: יָמֵינוּ עַל הָאָרֶץ
  choice: पृथ्वी पर हमारे दिन
  rationale: मूल के स्थानिक और कालिक भाव को सीधी, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְאֵין מִקְוֶה
  choice: और कोई आशा नहीं है
  rationale: מִקְוֶה का सामान्य अर्थ ‘आशा’ या ‘अपेक्षा’ है। सीधा अनुवाद मूल कथन की गंभीरता और संभावित धर्मवैज्ञानिक तनाव को बनाए रखता है।
theological_decisions:
- issue: וְאֵין מִקְוֶה का आशय
  choice: ‘और कोई आशा नहीं है’ के रूप में सीधा अनुवाद, साथ में संदर्भ स्पष्ट करने वाला पादटिप्पण
  alternative: ‘और स्थायित्व की कोई आशा नहीं’ या ‘और कोई अपेक्षा नहीं’
  rationale: मूल पाठ निरपेक्ष और तीखा है। मुख्य पाठ में ‘स्थायित्व’ जोड़ना अस्पष्टता को समय से पहले सुलझा देता; इसलिए मूल तनाव सुरक्षित रखा गया है, जबकि पादटिप्पण इसे पृथ्वी पर मानव जीवन की क्षणभंगुरता के संदर्भ में पढ़ने में सहायता करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण प्रार्थनात्मक स्वर रखा गया है। ‘आप’ से परमेश्वर को संबोधित किया गया है। ‘पुरखे’ सामान्य पाठक के लिए ‘पितरों’ की अपेक्षा अधिक सहज है। सभी पादटिप्पण-चिह्न मुख्य पाठ में उपस्थित हैं।
