base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/011.yaml
  text: Yours[a], O Yahweh, are the greatness and the power and the splendor and the victory and the majesty, for everything in the heavens and on the earth is yours. Yours, O Yahweh, is the kingdom, and you are exalted as head over all.
translation:
  language: hi
  text: हे याहवे, महानता, सामर्थ्य, शोभा, विजय[a] और प्रताप तेरे ही हैं, क्योंकि स्वर्ग और पृथ्वी में जो कुछ है, सब तेरा ही है। हे याहवे, राज्य तेरा ही है, और तू सब पर प्रधान के रूप में सर्वोच्च है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनन्तता” अथवा “सर्वोच्चता”; यहाँ हिब्रू शब्द נֵצַח विजय के साथ-साथ स्थायी प्रभुत्व या श्रेष्ठता भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְךָ
  choice: तेरे ही हैं / तेरा ही है
  rationale: सम्बन्ध और अधिकार के अर्थ के साथ मूल की अग्रस्थापित, बलयुक्त पुनरावृत्ति को ‘ही’ द्वारा सुरक्षित रखा गया है।
- source_word: הַגְּדֻלָּה
  choice: महानता
  rationale: अमूर्त संज्ञा का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: הַגְּבוּרָה
  choice: सामर्थ्य
  rationale: शक्ति और पराक्रम दोनों की गरिमा व्यक्त करता है तथा स्तुतिपरक प्रसंग में स्वाभाविक है।
- source_word: הַתִּפְאֶרֶת
  choice: शोभा
  rationale: सौन्दर्य, महिमा और वैभव के अर्थक्षेत्र को संक्षेप में व्यक्त करता है और הוֹד से भेद बनाए रखता है।
- source_word: הַנֵּצַח
  choice: विजय
  rationale: राजकीय स्तुति-सूची में विजय का अर्थ प्रसंगानुकूल है; स्थायित्व अथवा श्रेष्ठता की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: הַהוֹד
  choice: प्रताप
  rationale: राजसी महिमा, गरिमा और वैभव का भाव व्यक्त करता है तथा ‘शोभा’ की पुनरावृत्ति से बचाता है।
- source_word: כִּי כֹל בַּשָּׁמַיִם וּבָאָרֶץ
  choice: क्योंकि स्वर्ग और पृथ्वी में जो कुछ है, सब
  rationale: כִּי को कारणसूचक और כֹל को सर्वसमावेशी रूप में प्रस्तुत किया गया है; हिन्दी में ‘स्वर्ग’ सामूहिक अर्थ में स्वाभाविक है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: राजकीय क्षेत्र और शासनाधिकार दोनों का संकेत देने वाला सीधा हिन्दी रूप।
- source_word: וְהַמִּתְנַשֵּׂא
  choice: और तू ... ऊँचा है
  rationale: हिब्रू कृदन्त को विधेयात्मक रूप में स्वाभाविक हिन्दी वाक्य बनाया गया है।
- source_word: לְכֹל לְרֹאשׁ
  choice: सबके ऊपर प्रधान के रूप में
  rationale: सभी पर सर्वोच्च मुखिया होने का मूल रूपक और आधिपत्य दोनों बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि में विलीन न करके व्यक्तिवाचक रूप में रखा गया है; ‘यहोवा’ सामान्य हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाता है।
- issue: נֵצַח का अर्थ
  choice: विजय
  alternative: अनन्तता या सर्वोच्चता
  rationale: स्तुतिपरक राजकीय गुणों की सूची में ‘विजय’ सुसंगत है, पर शब्द के स्थायी प्रभुत्व/श्रेष्ठता सम्बन्धी अर्थ को पादटिप्पणी द्वारा खुला रखा गया है।
- issue: וְהַמִּתְנַשֵּׂא לְכֹל לְרֹאשׁ की वाक्यगत व्याख्या
  choice: तू सबके ऊपर प्रधान के रूप में ऊँचा है
  alternative: और वह जो सब पर प्रधान होकर ऊँचा है
  rationale: कृदन्त को यहोवा को सम्बोधित विधेय के रूप में समझना प्रसंग और हिन्दी वाक्य-विन्यास के अनुकूल है, जबकि प्रधानता का रूपक सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और स्तुतिपरक हिन्दी; सम्बोधन में ‘हे यहोवा’ तथा अधिकार पर बल देने के लिए ‘ही’ की पुनरावृत्ति रखी गई है।
