  text: And he died in a good old age[a], full of days, riches, and honor; and Solomon his son reigned in his place.
translation:
  language: hi
  text: और वह अच्छी वृद्धावस्था में मरा—लंबी आयु पाकर, धन और सम्मान से भरपूर—और उसका पुत्र सुलैमान उसके स्थान पर राज्य करने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: और वह ... मरा
  rationale: क्रमिक कथन को सरल और स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: בְּשֵׂיבָה טוֹבָה
  choice: अच्छी वृद्धावस्था में
  rationale: मृत्यु की अनुकूल परिस्थिति और इब्रानी की सकारात्मक अभिव्यक्ति दोनों को सुरक्षित रखता है।
- source_word: שְׂבַע יָמִים
  choice: आयु ... से परिपूर्ण
  rationale: शाब्दिक चित्र ‘दिनों से तृप्त/भरा हुआ’ है; हिन्दी में ‘आयु से परिपूर्ण’ दीर्घ और संतोषपूर्ण जीवन का भाव स्वाभाविक रूप से देता है।
- source_word: עֹשֶׁר וְכָבוֹד
  choice: धन और सम्मान
  rationale: עֹשֶׁר के भौतिक वैभव और כָבוֹד के सामाजिक/राजकीय आदर को स्पष्ट आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּמְלֹךְ
  choice: राजा हुआ
  rationale: उत्तराधिकार के प्रसंग में क्रिया מלך के ‘राजा बनना/राज्य करना’ अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁלֹמֹה בְנוֹ
  choice: उसका पुत्र सुलैमान
  rationale: सम्बन्ध और नाम को आधुनिक हिन्दी के स्वाभाविक शब्दक्रम में प्रस्तुत करता है।
- source_word: תַּחְתָּיו
  choice: उसके स्थान पर
  rationale: राजकीय उत्तराधिकार के सूत्र का सीधा अर्थ सुरक्षित रखता है।
