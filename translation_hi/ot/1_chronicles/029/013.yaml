id: 1CH.29.13
reference: 1 Chronicles 29:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֱלֹהֵ֔י/נוּ מוֹדִ֥ים אֲנַ֖חְנוּ לָ֑/ךְ וּֽ/מְהַֽלְלִ֖ים לְ/שֵׁ֥ם תִּפְאַרְתֶּֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/029/013.yaml
  text: And now[a], our God, we give thanks to you and praise the name of your glory.
translation:
  language: hi
  text: और अब, हे हमारे परमेश्वर, हम आपका धन्यवाद करते और आपके महिमामय नाम की स्तुति करते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: वाव के संयोजक बल और प्रार्थना में वर्तमान प्रत्युत्तर की ओर बढ़ते प्रवाह, दोनों को सुरक्षित रखता है।
- source_word: אֱלֹהֵינוּ
  choice: हे हमारे परमेश्वर
  rationale: पहले पुरुष बहुवचन प्रत्यय का अर्थ ‘हमारे परमेश्वर’ है; हिंदी में प्रत्यक्ष संबोधन को स्वाभाविक और स्पष्ट बनाने के लिए ‘हे’ उचित है।
- source_word: מוֹדִים אֲנַחְנוּ לָךְ
  choice: हम आपका धन्यवाद करते
  rationale: उपासना के इस प्रसंग में ידה का हिफ़ील रूप धन्यवाद देने का अर्थ रखता है; לָךְ को आदरसूचक आधुनिक हिंदी में ‘आपका’ से व्यक्त किया गया है।
- source_word: וּמְהַלְלִים
  choice: और ... स्तुति करते हैं
  rationale: הלל का पिएल कृदंत लगातार/वर्तमान स्तुति को सूचित करता है; संयुक्त हिंदी वाक्य में ‘करते हैं’ दोनों समानांतर क्रियाओं के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: לְשֵׁם תִּפְאַרְתֶּךָ
  choice: आपके महिमामय नाम की
  rationale: शाब्दिक संरचना ‘आपकी महिमा के नाम की’ हिंदी में अस्वाभाविक और अर्थतः धुंधली होगी। ‘महिमामय नाम’ नाम-संबंधी बाइबलीय भाषा बनाए रखते हुए תִּפְאֶרֶת की महिमा/वैभव की विशेषता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वर को प्रत्यक्ष संबोधन
  choice: हे हमारे परमेश्वर
  alternative: हमारे परमेश्वर
  rationale: मूल में अलग संबोधन-कण नहीं है, फिर भी वाक्य में אֱלֹהֵינוּ प्रत्यक्ष संबोधन है। आधुनिक हिंदी में ‘हे’ इसे बिना किसी संप्रदायगत अर्थ जोड़े स्पष्ट करता है।
- issue: ‘नाम’ और ‘महिमा’ की अभिव्यक्ति
  choice: आपके महिमामय नाम की स्तुति
  alternative: आपकी महिमा के नाम की स्तुति
  rationale: ‘नाम’ को हटाया नहीं गया, क्योंकि वह परमेश्वर की प्रकट पहचान और प्रतिष्ठा से जुड़ी महत्वपूर्ण बाइबलीय अभिव्यक्ति है। साथ ही, संज्ञा-निर्माण की मूल अर्थवत्ता को हिंदी में स्वाभाविक विशेषण ‘महिमामय’ द्वारा व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, आदरसूचक ‘आप’, और प्रार्थना के अनुरूप गरिमापूर्ण किंतु सहज शैली। ‘धन्यवाद’ और ‘स्तुति’ का समानांतरपन सुरक्षित रखा गया है; कोई अनावश्यक पुरातन या संप्रदाय-विशिष्ट शब्दावली नहीं जोड़ी गई।
