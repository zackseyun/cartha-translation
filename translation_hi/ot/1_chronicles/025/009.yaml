  yaml_path: translation/ot/1_chronicles/025/009.yaml
  text: The first lot came out for Asaph[a], for Joseph; Gedaliah the second, he and his brothers and his sons[b], twelve.
translation:
  language: hi
  text: पहली चिट्ठी आसाप के लिए, योसेप के लिए निकली[a]; दूसरी गदल्याहू के लिए निकली—वह, उसके भाई और उसके पुत्र, कुल बारह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “पहली चिट्ठी आसाप के लिए, योसेप के लिए निकली।” दोनों नामों के संबंध को पद स्पष्ट नहीं करता।'
    reason: textual_ambiguity
lexical_decisions:
- source_word: וַיֵּצֵא הַגּוֹרָל
  choice: चिट्ठी ... निकली
  rationale: चिट्ठी डालकर दायित्व बाँटने के प्रसंग में यह वाक्यांश मूल की ठोस छवि बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְאָסָף לְיוֹסֵף
  choice: आसाप के घराने में से योसेप के नाम
  rationale: दोनों לְ को केवल समानांतर 'के लिए' कहने से योसेप और आसाप के संबंध में भ्रम हो सकता है। अध्याय के संदर्भ में योसेप आसाप के वंशीय दल का अगुआ है; 'घराने में से' यह संबंध स्पष्ट करता है, जबकि आवंटन योसेप के नाम रखता है।
- source_word: גְּדַלְיָהוּ
  choice: गदल्याहू
  rationale: नाम के हिब्रू -याहू अंत को सुरक्षित रखते हुए देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: הַשֵּׁנִי
  choice: दूसरी ... के नाम
  rationale: क्रम में दूसरे आवंटन का अर्थ हिन्दी में पूरा और सहज बनाने के लिए पहले खंड से 'चिट्ठी' और 'निकली' अर्थतः ग्रहण किए गए हैं।
- source_word: הוּא וְאֶחָיו וּבָנָיו
  choice: वह, उसके भाई और उसके पुत्र
  rationale: गिने गए दल के मुखिया के रूप में गदल्याहू स्वयं भी संख्या में सम्मिलित है; 'पुत्र' मूल की पुरुषवाचक विशिष्टता बनाए रखता है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: क्रियारहित हिब्रू संख्या-वाक्य को स्पष्ट करता है कि पूरी उल्लिखित टोली की संख्या बारह थी।
