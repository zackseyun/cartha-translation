lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: पाँचवाँ
  rationale: निश्चित उपपद के साथ क्रमवाचक विशेषण यहाँ सूची के संदर्भ में लुप्त पद के साथ प्रयुक्त है। मूल पद में ‘चिट्ठा’ या ‘दल’ स्पष्ट नहीं है, इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया।
- source_word: נְתַנְיָהוּ
  choice: नतन्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: בנים पर एकवचन पुल्लिंग संबंधसूचक प्रत्यय लगा है और यहाँ इसका सीधा अर्थ ‘उसके बेटे’ है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: אחים का सामान्य और इस सूची में उपयुक्त अर्थ ‘भाई’ है; व्यापक अर्थ ‘कुटुम्बी’ अनावश्यक रूप से नहीं अपनाया गया।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: संख्या इस नामित समूह की कुल गिनती बताती है। स्वाभाविक हिन्दी में गणना का आशय स्पष्ट करने के लिए ‘कुल’ जोड़ा गया है।
