  choice: बीसवीं
  rationale: सूची के क्रम में यह बीसवें स्थान को दर्शाता है। अध्याय की बार-बार आने वाली संरचना के आधार पर ‘चिट्ठी’ को मुख्य पाठ में स्पष्ट किया गया है।
- source_word: לֶאֱלִיָּתָה
  choice: एल्याता के नाम
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है; उपसर्ग ל को आवंटन के अर्थ में स्वाभाविक हिन्दी ‘के नाम’ से व्यक्त किया गया है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: בנים यहाँ पुरुष संतान को सूचित करता है; ‘पुत्र’ वंशावली और सेवक-दल की सूची के संदर्भ में सटीक है।
- source_word: וְאֶחָיו
  choice: और भाइयों
  rationale: אחים के सामान्य पारिवारिक अर्थ ‘भाई’ को बनाए रखा गया है, इसे अनावश्यक रूप से ‘कुटुम्बियों’ तक विस्तृत नहीं किया गया।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह पूरे दल की संख्या बताता है। हिन्दी में ‘कुल’ जोड़ने से क्रियारहित इब्रानी सूची का आशय स्वाभाविक और स्पष्ट होता है।
