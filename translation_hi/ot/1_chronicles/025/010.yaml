translation:
  language: hi
  text: तीसरी चिट्ठी जक्कूर के नाम निकली; उसके पुत्र और उसके भाई कुल बारह थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁלִשִׁי
  choice: तीसरा
  rationale: निश्चित उपपद सहित क्रमवाचक शब्द आसपास के पदों में चिट्ठियों अथवा दलों की क्रम-सूची का संकेत देता है। मूल पाठ में ‘चिट्ठी’ संज्ञा दोहराई नहीं गई है, इसलिए मुख्य पाठ में संक्षिप्त रूप रखा गया है।
- source_word: זַכּוּר
  choice: जक्कूर
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; זַכּוּר के व्यंजन और दीर्घ ऊ ध्वनि को निकटता से व्यक्त करता है।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: בנים के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय का सीधा अर्थ ‘उसके पुत्र’ है; ‘संतान’ कहना मूल के पुल्लिंग बहुवचन को अनावश्यक रूप से व्यापक कर देगा।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: אחים के साथ प्रत्यय का स्वाभाविक और इस आवर्ती सूची में सबसे सीधा अर्थ ‘उसके भाई’ है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह समूह की कुल संख्या बताता है। ‘कुल’ हिंदी में संख्या का संबंध जक्कूर, उसके पुत्रों और भाइयों से स्पष्ट करता है, जबकि मूल की क्रियारहित गणना-शैली बनी रहती है।
