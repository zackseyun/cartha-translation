  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। अर्धविराम और डैश सूची की संक्षिप्त, गणनात्मक शैली को स्पष्ट करते हैं। नाम ‘जक्कूर’ स्रोत-भाषा के उच्चारण के निकट रखा गया है।
