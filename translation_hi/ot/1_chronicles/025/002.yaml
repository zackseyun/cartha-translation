base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/002.yaml
  text: 'Of the sons of Asaph: Zaccur[a], Joseph, Nethaniah, and Asharelah, sons of Asaph, under the direction of Asaph, who prophesied under the direction of the king.'
translation:
  language: hi
  text: 'आसाप के पुत्रों में से: ज़क्कूर, योसेफ, नतन्याह और असरेला—आसाप के ये पुत्र आसाप के निर्देशन में[a] थे। आसाप राजा के निर्देशन में[a] भविष्यवाणी करता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, दोनों स्थानों पर ‘के हाथ द्वारा’; इब्रानी में पहले वाक्यांश में ‘हाथ’ एकवचन और दूसरे में बहुवचन है। यह इब्रानी मुहावरा अभिकरण, देखरेख या निर्देशन का भाव दे सकता है।
    reason: עַל יַד / עַל יְדֵי के शाब्दिक हाथ-संबंधी रूप और उसके व्यापक मुहावरेदार अर्थ-क्षेत्र को सुरक्षित रखना।
lexical_decisions:
- source_word: לִבְנֵי אָסָף
  choice: आसाप के पुत्रों में से
  rationale: सूची के इस प्रसंग में उपसर्ग לְ उपविभाग या श्रेणी का परिचय देता है; यह हिंदी में स्वाभाविक सूची-शीर्षक है।
- source_word: זַכּוּר וְיוֹסֵף וּנְתַנְיָה וַאֲשַׂרְאֵלָה
  choice: जक्कूर, योसेफ, नतन्याह और अशरेला
  rationale: व्यक्तिवाचक नामों को इब्रानी रूपों के आधार पर देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּנֵי אָסָף
  choice: आसाप के ये पुत्र
  rationale: मूल पाठ की पुनरावृत्ति बनाए रखते हुए हिंदी में सूचीबद्ध व्यक्तियों की पहचान स्पष्ट की गई है।
- source_word: עַל יַד / עַל יְדֵי
  choice: के निर्देशन में
  rationale: इस इब्रानी मुहावरे का भाव अभिकरण, देखरेख या अधिकार के अधीन होना है; स्वाभाविक हिंदी में ‘के निर्देशन में’ इस प्रशासनिक संबंध को व्यक्त करता है।
- source_word: הַנִּבָּא
  choice: भविष्यवाणी करता था
  rationale: נבא के निफ़अल कृदंत की भविष्यसूचक गतिविधि को बनाए रखा गया है; मंदिर-संगीत के प्रसंग के कारण इसे केवल ‘गाता था’ या ‘संगीत प्रस्तुत करता था’ नहीं बनाया गया।
theological_decisions:
- issue: मंदिर-संगीत के प्रसंग में ‘भविष्यवाणी’ का अर्थ
  choice: भविष्यवाणी करता था
  alternative: प्रेरित संगीत प्रस्तुत करता था / भविष्यसूचक ढंग से गाता था
  rationale: इतिहासकार आसाप की सेवकाई के लिए נבא का प्रयोग करता है। ‘भविष्यवाणी’ मूल पाठ के धार्मिक दावे और उसके संभावित व्यापक अर्थ को खुला रखती है, जबकि प्रसंग उसके संगीत-संबंधी स्वरूप का संकेत देता है।
- issue: עַל יַד मुहावरे में अधिकार और अभिकरण का संबंध
  choice: दोनों स्थानों पर ‘के निर्देशन में’
  alternative: ‘के हाथ से’ / ‘के अधिकार में’ / ‘राजा की आज्ञा से’
  rationale: एक ही इब्रानी मुहावरे की समानांतर पुनरावृत्ति सुरक्षित रखी गई है। ‘राजा की आज्ञा से’ संभव भाव है, पर वह मूल की अभिकरण/देखरेख संबंधी अस्पष्टता को अधिक निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण सूची-शैली अपनाई गई है। मूल की दोहरी संरचना स्पष्ट करने के लिए वाक्य-विभाजन किया गया है, पर आसाप के पुत्रों की पुनरुक्त पहचान और ‘निर्देशन में’ का समानांतर प्रयोग बनाए रखा गया है।
