translation:
  language: hi
  text: सोलहवाँ हनन्याहू के लिए था; उसके बेटे और उसके भाई—कुल बारह थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְשִׁשָּׁה עָשָׂר
  choice: सोलहवाँ ... के लिए था
  rationale: לְ के साथ क्रमवाचक संख्या इस प्रसंग में चिट्ठी द्वारा क्रमिक नियुक्ति दर्शाती है। स्वाभाविक हिन्दी के लिए ‘था’ जोड़ा गया है, जबकि ‘भाग’ या ‘चिट्ठा’ मूल पद में स्पष्ट नहीं है।
- source_word: לַחֲנַנְיָהוּ
  choice: हनन्याह
  rationale: यह हिब्रू नाम חֲנַנְיָהוּ का हिन्दी में सुबोध और प्रचलित बाइबलीय लिप्यंतरण है।
- source_word: בָּנָיו
  choice: उसके बेटों
  rationale: בָּנִים यहाँ वंशावली-सूची के प्रसंग में विशेष रूप से पुत्रों को सूचित करता है।
- source_word: וְאֶחָיו
  choice: और उसके भाइयों
  rationale: אָח का सीधा अर्थ ‘भाई’ है; यद्यपि कुछ प्रसंगों में इसका अर्थ निकट पुरुष संबंधी भी हो सकता है, यहाँ आवर्ती सूची-सूत्र में ‘भाई’ उपयुक्त है।
- source_word: שְׁנֵים עָשָׂר
  choice: वे बारह थे
  rationale: अंतिम संख्या पूरे उल्लिखित दल की कुल संख्या बताती है। हिन्दी में ‘वे बारह थे’ इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
