    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: दसवाँ
  rationale: निश्चित पद के साथ क्रमवाचक संख्या है और आसपास के पदों में चिट्ठियों अथवा दलों का क्रम जारी रखती है। संक्षिप्त सूची-शैली बनाए रखते हुए संज्ञा को निहित रखा गया है।
- source_word: שִׁמְעִי
  choice: शिमी
  rationale: व्यक्तिवाचक नाम का आधुनिक हिन्दी में सहज देवनागरी लिप्यंतरण।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: यहाँ בנים का सीधा और संदर्भानुकूल अर्थ पुरुष संतानों से है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: אחים का सामान्य प्रत्यक्ष अर्थ 'भाई' है; इस सूची में संभावित व्यापक कुल-संबंध या सहगिल्ड अर्थ को मुख्य पाठ में आरोपित नहीं किया गया।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह शिमी से जुड़े बेटों और भाइयों की संयुक्त संख्या बताता है; 'कुल' हिन्दी में संबंध स्पष्ट करता है, कोई नई सूचना नहीं जोड़ता।
