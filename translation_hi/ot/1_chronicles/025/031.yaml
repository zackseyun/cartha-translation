  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सूची-जैसी हिब्रू वाक्यरचना को बनाए रखते हुए संख्या के संबंध को स्पष्ट करने के लिए दीर्घ विराम और ‘कुल’ का प्रयोग किया गया है।
