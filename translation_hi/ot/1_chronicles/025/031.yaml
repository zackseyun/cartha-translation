  text: for the twenty-fourth[a], Romamti-ezer, his sons and his brothers, twelve.
translation:
  language: hi
  text: चौबीसवें[a] के लिए रोमामती-एज़ेर, उसके पुत्र और उसके भाई—कुल बारह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “चौबीसवें के लिए।” इस खंड में यह वाक्यांश चौबीसवीं चिट्ठी या चौबीसवें दल को सूचित करता है।
    reason: संदर्भ के आधार पर निहित ‘चिट्ठी/दल’ को स्पष्ट करना, जबकि उसे मुख्य पाठ में नहीं जोड़ा गया है।
lexical_decisions:
- source_word: לְאַרְבָּעָה וְעֶשְׂרִים
  choice: चौबीसवें के लिए
  rationale: उपसर्ग לְ यहाँ बारी अथवा विभाग के आवंटन का भाव देता है। मूल पाठ में ‘चिट्ठी’ या ‘दल’ स्पष्ट रूप से नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לְרוֹמַמְתִּי עָזֶר
  choice: रोमामती-एजेर
  rationale: व्यक्तिनाम को अर्थानुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; नाम के दोनों अंगों को योजक-चिह्न से जोड़ा गया है।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: हिब्रू शब्द विशेष रूप से पुत्रों को सूचित करता है, अतः ‘बच्चे’ जैसे व्यापक शब्द के बजाय ‘पुत्र’ रखा गया।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: शब्द का सीधा अर्थ ‘उसके भाई’ है। यद्यपि इस सूची में इसका दायरा निकट संबंधियों या समूह-सहयोगियों तक हो सकता है, उस संभावित विस्तार को मुख्य पाठ में नहीं थोपा गया।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह नामित समूह की कुल संख्या बताता है। स्वाभाविक हिन्दी और आशय की स्पष्टता के लिए ‘कुल’ जोड़ा गया है।
