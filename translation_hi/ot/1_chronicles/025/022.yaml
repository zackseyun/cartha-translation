translation:
  language: hi
  text: 'पन्द्रहवीं[a] यिरेमोत के लिए: उसके पुत्र और उसके भाई, बारह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पन्द्रहवीं, यिरेमोत के लिए।” इस अध्याय में बार-बार आने वाले क्रम से ‘चिट्ठी’ समझी जाती है, पर इस पद के इब्रानी पाठ में यह शब्द नहीं है।
    reason: cross_reference
lexical_decisions:
- source_word: לַחֲמִשָּׁה עָשָׂר
  choice: पन्द्रहवीं
  rationale: अध्याय में चिट्ठियों के क्रम के कारण यह पदबंध अर्थ की दृष्टि से क्रमवाचक है। हिन्दी में स्त्रीलिंग रूप निहित ‘चिट्ठी’ के अनुरूप है; ‘चिट्ठी’ मूल पदबंध में व्यक्त नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לִירֵמוֹת
  choice: यिर्मोत के लिए
  rationale: उपसर्ग ל इस वितरण-सूची में नियत किए जाने या हिस्से में आने का भाव देता है। नाम का निकट देवनागरी लिप्यंतरण ‘यिर्मोत’ रखा गया है।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: इब्रानी शब्द विशेष रूप से पुत्रों को सूचित करता है, इसलिए अधिक व्यापक ‘सन्तान’ नहीं चुना गया।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: यह सीधा अर्थ है; प्रसंग में निकट पुरुष संबंधी या कुल-सहयोगी भी अभिप्रेत हो सकते हैं, पर मुख्य पाठ में अस्पष्टता को ‘भाई’ द्वारा सुरक्षित रखा गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह यिर्मोत के पुत्रों और भाइयों से संबद्ध कुल संख्या बताता है। स्वाभाविक हिन्दी के लिए ‘कुल’ जोड़ा गया है।
