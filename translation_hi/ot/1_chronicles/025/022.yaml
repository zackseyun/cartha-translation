  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की संक्षिप्त सूची-शैली बनाए रखते हुए हिन्दी में निहित क्रिया ‘पड़ी’ और स्पष्टता के लिए ‘कुल’ का प्रयोग किया गया है।
