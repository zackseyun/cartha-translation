  text: The fourth[a], to Izri, his sons and his brothers, twelve.
translation:
  language: hi
  text: चौथा[a], यिस्री को—उसके बेटे और उसके भाई, कुल बारह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंग में अधिक स्पष्ट रूप से, “चौथी चिट्ठी यिस्री के नाम निकली।” आसपास की सूची से ‘चिट्ठी’ समझी जाती है, पर इस पद में यह शब्द नहीं आया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: चौथा
  rationale: क्रमवाचक शब्द इस सूची में संक्षिप्त रूप से प्रयुक्त है। प्रसंग से ‘चिट्ठा’ समझ में आता है, पर इस पद में वह संज्ञा स्पष्ट रूप से नहीं लिखी गई है।
- source_word: לַיִּצְרִי
  choice: यिस्री के लिए
  rationale: उपसर्ग ל इस सूची में आवंटन का भाव व्यक्त करता है; इसलिए ‘के लिए’ स्वाभाविक हिन्दी है। नाम को स्रोत के अनुरूप ‘यिस्री’ लिखा गया है।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: इब्रानी शब्द विशेष रूप से पुत्रों को दर्शाता है; ‘बेटे’ आधुनिक और स्पष्ट हिन्दी है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: אֶחָיו का सीधा अर्थ ‘उसके भाई’ है। यद्यपि व्यापक संबंधियों या साथियों का भाव संभव हो सकता है, मूल शब्द का सामान्य अर्थ सुरक्षित रखा गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: संख्या पूरे बताए गए दल की कुल गिनती देती है। हिन्दी में अर्थ स्पष्ट करने के लिए ‘कुल’ जोड़ा गया है, बिना किसी अतिरिक्त सदस्य को निहित किए।
