- source_word: לְ/מַחֲזִיאוֹת
  choice: महज़ीओत
  rationale: यह व्यक्ति का नाम है, इसलिए इसका अनुवाद नहीं बल्कि देवनागरी लिप्यंतरण किया गया है।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: इब्रानी शब्द विशेष रूप से पुत्रों को दर्शाता है; सूची और वंश-संबंधी संदर्भ में ‘पुत्र’ सटीक और गरिमापूर्ण है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: इस सूची के संदर्भ में अर्थ ‘भाई’ है; व्यापक ‘कुटुम्बी’ की अपेक्षा यही अधिक प्रत्यक्ष है।
- source_word: שְׁנֵים עָשָׂר
  choice: मिलाकर बारह थे
  rationale: यह महज़ीओत के पुत्रों और भाइयों की कुल संख्या बताता है; ‘मिलाकर’ हिन्दी में इस सामूहिक गणना को स्पष्ट करता है।
