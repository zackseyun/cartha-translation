  choice: तेरहवाँ
  rationale: उपसर्ग ל यहाँ चिट्ठी द्वारा क्रम-निर्धारण को दर्शाता है। सूची की शैली में स्वाभाविक हिन्दी के लिए ‘तेरहवाँ’ रखा गया है; ‘भाग/दल’ संदर्भ से समझा जाता है और मूल पद में स्पष्ट नहीं है।
- source_word: שׁוּבָאֵל
  choice: शूबाएल
  rationale: व्यक्तिनाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: हिब्रू शब्द स्पष्ट रूप से पुत्रों को सूचित करता है, इसलिए सामान्य ‘संतान’ के बजाय ‘बेटे’ रखा गया है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: शाब्दिक अर्थ ‘उसके भाई’ है। संदर्भ में व्यापक पुरुष संबंधी या सहकर्मी संभव हो सकते हैं, पर उस संभावना को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह संख्या शूबाएल से जुड़े बेटों और भाइयों की कुल संख्या बताती है। संक्षिप्त सूची-शैली बनाए रखते हुए हिन्दी में आशय स्पष्ट करने के लिए ‘कुल’ जोड़ा गया है।
