base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/005.yaml
  text: All these were sons of Heman[a], the king’s seer in the words of God, to exalt the horn[b]. And God gave Heman fourteen sons and three daughters.
translation:
  language: hi
  text: ये सभी हेमान के पुत्र थे। हेमान परमेश्वर के वचनों में राजा का दर्शी था[a], सींग को ऊँचा करने के लिए[b]। परमेश्वर ने हेमान को चौदह पुत्र और तीन पुत्रियाँ दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘परमेश्वर के वचनों के विषय में राजा का दर्शी,’ ‘परमेश्वर से संबंधित विषयों में राजा का दर्शी,’ या ‘परमेश्वर के वचनों के द्वारा राजा का दर्शी’ भी हो सकता है। इब्रानी वाक्यांश संक्षिप्त है और हेमान की दर्शी की भूमिका तथा ईश्वरीय प्रकाशन के बीच संबंध को पूरी तरह स्पष्ट नहीं करता।
    reason: alternative_reading
  - marker: b
    text: या ‘सींग को उठाने के लिए।’ इब्रानी में ‘सींग’ शक्ति, सम्मान या ऊँची प्रतिष्ठा का रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֹזֵה
  choice: दर्शी
  rationale: यह शब्द उस व्यक्ति को दर्शाता है जिसे ईश्वरीय प्रकाशन प्राप्त होता है। ‘दर्शी’ इतिहास-वृत्तांत में उसके राजकीय और प्रकाशन-संबंधी पद को बनाए रखता है और ‘भविष्यद्वक्ता’ की अपेक्षा मूल शब्द के अधिक निकट है।
- source_word: בְּדִבְרֵי הָאֱלֹהִים
  choice: परमेश्वर के वचनों में
  rationale: इब्रानी वाक्यांश संक्षिप्त और अर्थ की दृष्टि से खुला है। यह अनुवाद उसके मूल रूप को बनाए रखता है; इसका आशय परमेश्वर के वचनों के विषय में, उनके माध्यम से, अथवा उनसे संबंधित विषयों में हो सकता है।
- source_word: לְהָרִים קָרֶן
  choice: सींग को ऊँचा करे
  rationale: यह अभिव्यक्ति शक्ति, सम्मान या ऊँचे पद का चित्र प्रस्तुत करती है। रूपक को मुख्य पाठ में बनाए रखा गया है और उसके कर्ता अथवा लाभार्थी को अनावश्यक रूप से निश्चित नहीं किया गया।
- source_word: קָרֶן
  choice: सींग
  rationale: मूल इब्रानी रूपक को ‘शक्ति’ या ‘सम्मान’ कहकर व्याख्यायित करने के बजाय ज्यों का त्यों रखा गया है।
- source_word: וַיִּתֵּן הָאֱלֹהִים לְהֵימָן
  choice: परमेश्वर ने हेमान को ... दिए/दीं
  rationale: यह हिन्दी में स्वाभाविक रूप से संतान के ईश्वरीय वरदान को व्यक्त करता है और मूल के अप्रत्यक्ष कर्म ‘हेमान को’ को बनाए रखता है।
- source_word: בָנִים ... וּבָנוֹת
  choice: पुत्र ... पुत्रियाँ
  rationale: मूल पाठ नर और नारी संतानों का स्पष्ट भेद करता है; ये शब्द उस भेद को सीधे और स्वाभाविक ढंग से रखते हैं।
- source_word: אַרְבָּעָה עָשָׂר וּבָנוֹת שָׁלֹשׁ
  choice: चौदह पुत्र और तीन पुत्रियाँ
  rationale: संख्याएँ और उनका क्रम स्पष्ट रूप से मूल पाठ के अनुसार रखे गए हैं।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: सूची का सार प्रस्तुत करने वाले मूल संकेतवाचक वाक्यांश का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ‘परमेश्वर के वचनों में राजा का दर्शी’ का अर्थ
  choice: हेमान की राजकीय दर्शी की भूमिका को परमेश्वर के वचनों से संबद्ध बताया गया है, पर संबंध का ठीक प्रकार खुला रखा गया है।
  alternative: ‘परमेश्वर से संबंधित विषयों में राजा का दर्शी’ अथवा ‘परमेश्वर के वचनों के द्वारा राजा का दर्शी।’
  rationale: इब्रानी में בְּ का संबंध एक से अधिक प्रकार से समझा जा सकता है। मुख्य पाठ उसकी संक्षिप्तता और अस्पष्टता को बनाए रखता है; पादटिप्पणी संभावित अर्थ बताती है।
- issue: ‘सींग को ऊँचा करने’ का आशय
  choice: शक्ति, सम्मान या प्रतिष्ठा के ऊँचा किए जाने का बाइबलीय रूपक बनाए रखा गया है।
  alternative: ‘उसकी शक्ति बढ़ाने’ अथवा ‘उसे सम्मान देने।’
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि किसका सींग ऊँचा होता है और न ही रूपक को केवल एक अमूर्त अर्थ तक सीमित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। ‘दर्शी’ और ‘सींग’ जैसे बाइबलीय पदों को सुरक्षित रखते हुए उनकी व्याख्या पादटिप्पणियों में दी गई है। मूल की दो वास्तविक अस्पष्टताओं—दर्शी की भूमिका का परमेश्वर के वचनों से संबंध और सींग के रूपक का संदर्भ—को मुख्य पाठ में खुला रखा गया है।
