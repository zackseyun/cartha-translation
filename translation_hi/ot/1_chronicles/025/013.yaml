  text: the sixth[a], Bukkiah; his sons and his brothers, twelve.
translation:
  language: hi
  text: छठा[a], बुक्कियाहू; उसके पुत्र और उसके भाई, कुल बारह।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, प्रसंग को अधिक स्पष्ट करते हुए, “छठी चिट्ठी बुक्कियाहू के नाम निकली; उसके पुत्र और उसके भाई, कुल बारह।” इब्रानी सूची-शैली में “चिट्ठी ... के नाम निकली” आस-पास के पदों से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: छठा
  rationale: संज्ञा के बिना प्रयुक्त यह निश्चित क्रमवाचक पद इस सूची में संक्षिप्त रूप से छठे चिट्ठे को दर्शाता है; मुख्य पाठ में इब्रानी की संक्षिप्त शैली रखी गई है।
- source_word: בֻקִּיָּהוּ
  choice: बुक्कियाहू
  rationale: इब्रानी नाम का देवनागरी में निकट लिप्यंतरण किया गया है और उसके अंत का יהו भी सुरक्षित रखा गया है।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: इब्रानी पद विशेष रूप से उसके पुत्रों को दर्शाता है, इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: मूल अर्थ 'भाई' है; यहाँ यह निकट पुरुष संबंधियों या साथियों को भी सूचित कर सकता है, पर सीधे और पारदर्शी अनुवाद को चुना गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: संख्या पूरे उल्लिखित समूह की कुल गिनती बताती है। हिंदी में अर्थ स्पष्ट करने के लिए 'कुल' जोड़ा गया है, जबकि मूल की संक्षिप्त सूची-शैली बनी रहती है।
