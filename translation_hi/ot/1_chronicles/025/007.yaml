base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/007.yaml
  text: Their number[a], together with their brothers who were trained in singing to Yahweh, all who were skillful[b], was two hundred eighty-eight.
translation:
  language: hi
  text: उनकी और उनके भाइयों की, जो याहवे के लिए[a] गाने में प्रशिक्षित थे—सभी निपुण जनों की—कुल संख्या दो सौ अट्ठासी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याहवे को।” इब्रानी संबंधबोधक इस संगीतमय सेवा के प्रसंग में दिशा या उद्देश्य व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפָּרָם
  choice: उनकी गिनती
  rationale: यह संज्ञा गिने हुए कुल को दर्शाती है; हिंदी में यह सहज और मूल के निकट है।
- source_word: עִם אֲחֵיהֶם
  choice: उनके ... भाइयों समेत
  rationale: עִם साथ या सहभागिता प्रकट करता है और אֲחֵיהֶם का शाब्दिक अर्थ ‘उनके भाई’ है; पुरुष लेवीय सेवकों के इस प्रसंग में ‘भाइयों’ उपयुक्त है।
- source_word: מְלֻמְּדֵי שִׁיר
  choice: गाने में प्रशिक्षित थे
  rationale: למד का निष्क्रिय कृदंत सिखाए या प्रशिक्षित किए गए लोगों को दर्शाता है; שִׁיר यहाँ गीत अथवा गायन का बोध देता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל संगीतमय उपासना की दिशा या उद्देश्य व्यक्त कर सकता है; ‘के लिए’ सेवा के उद्देश्य को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל הַמֵּבִין
  choice: सभी निपुण लोगों
  rationale: בין का कृदंत यहाँ केवल बौद्धिक समझ नहीं, बल्कि संगीत-कार्य में योग्यता और दक्षता का संकेत देता है।
- source_word: מָאתַיִם שְׁמוֹנִים וּשְׁמוֹנָה
  choice: दो सौ अट्ठासी
  rationale: इब्रानी संख्या-क्रम स्पष्ट रूप से 288 दर्शाता है; शब्दों में लिखना हिंदी बाइबल की गरिमामय शैली के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे प्रयुक्त है। हिंदी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ उसे उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में बनाए रखता है।
- issue: לַיהוָה में संबंध का प्रकार
  choice: यहोवा के लिए
  alternative: यहोवा के लिए/सम्मुख गाना
  rationale: ל उद्देश्य और दिशा दोनों व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक उद्देश्य-सूचक अनुवाद रखा गया है और अस्पष्टता पाद-टिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमामय वाक्य-विन्यास अपनाया गया है। ‘गाने में प्रशिक्षित’ मूल के निष्क्रिय भाव को बनाए रखता है, जबकि ‘निपुण’ प्रसंगगत संगीत-दक्षता को सामान्य पाठक के लिए स्पष्ट करता है। दोनों पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
