- source_word: וְאֶחָיו
  choice: उसके भाई
  rationale: मूल अर्थ ‘भाई’ है; यद्यपि सूची के संदर्भ में व्यापक पुरुष संबंधी या दल-सहयोगी अभिप्रेत हो सकते हैं, पाठ में अधिक औपचारिक अर्थ रखा गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: मिलाकर बारह थे
  rationale: संख्या पुत्रों और भाइयों के पूरे समूह की कुल गिनती बताती है; ‘मिलाकर’ इस संबंध को सहज हिन्दी में स्पष्ट करता है।
- source_word: '[implied allotment formula]'
  choice: के नाम निकली
  rationale: इस संक्षिप्त हिब्रू पंक्ति में क्रिया नहीं है, पर आसपास के पदों में चिट्ठी द्वारा आवंटन का बार-बार आने वाला सूत्र इसे निहित करता है।
