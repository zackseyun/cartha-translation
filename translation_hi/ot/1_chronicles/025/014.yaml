lexical_decisions:
- source_word: הַשְּׁבִעִי
  choice: सातवीं चिट्ठी
  rationale: क्रमवाचक शब्द यहाँ चिट्ठी डालकर दलों के आवंटन की सूची में संज्ञा के रूप में प्रयुक्त है; स्वाभाविक हिन्दी के लिए निहित ‘चिट्ठी’ स्पष्ट की गई है।
- source_word: יְשַׂרְאֵלָה
  choice: यशरेला
  rationale: व्यक्तिनाम का अर्थानुवाद न करके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בָּנָיו
