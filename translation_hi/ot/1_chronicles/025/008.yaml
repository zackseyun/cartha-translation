  text: And they cast lots for duties[a], the small as well as the great[b], the teacher with the student.
translation:
  language: hi
  text: उन्होंने सेवा की बारी के लिए चिट्ठियाँ डालीं—छोटे और बड़े, दोनों के लिए समान रूप से[b], और जानकार[a] तथा सीखनेवाले, दोनों के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निपुण” अथवा “शिक्षक”; इब्रानी शब्द का शाब्दिक अर्थ “समझ रखनेवाला” है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “छोटे और बड़े”; यह पद या प्रतिष्ठा की परवाह किए बिना समान व्यवहार का संकेत देता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּפִּילוּ גּוֹרָלוֹת
  choice: चिट्ठियाँ डालीं
  rationale: हिफ़ील क्रिया נפל और גּוֹרָלוֹת का संयोग चिट्ठी डालकर चयन या बारी निर्धारित करने का प्रचलित इब्रानी मुहावरा है।
- source_word: מִשְׁמֶרֶת
  choice: सेवा की बारी
  rationale: मन्दिर की संगीत-सेवा के प्रसंग में यह किसी निर्धारित सेवा, पहरे या पारी को दर्शाता है; ‘सेवा की बारी’ हिन्दी में कार्य और क्रम दोनों स्पष्ट करता है।
- source_word: לְעֻמַּת
  choice: समान रूप से
  rationale: यहाँ इसका भाव स्थानिक ‘सामने’ की अपेक्षा समूहों के बीच समान व्यवहार या अनुरूपता का है।
- source_word: כַּקָּטֹן כַּגָּדוֹל
  choice: छोटे और बड़े, दोनों
  rationale: ‘छोटा और बड़ा’ पद या प्रतिष्ठा की परवाह किए बिना सभी को समेटने वाला इब्रानी युग्म है; मूल बिंब बनाए रखते हुए ‘दोनों’ वाक्य का वितरणात्मक भाव स्पष्ट करता है।
- source_word: מֵבִין
  choice: जानकार
  rationale: यह कृदन्त मूलतः ‘समझ रखनेवाला’ बताता है और इस प्रसंग में कुशल या अनुभवी व्यक्ति का संकेत दे सकता है। ‘जानकार’ शिक्षक की भूमिका को निश्चित किए बिना इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: עִם תַּלְמִיד
  choice: तथा सीखनेवाले
  rationale: תַּלְמִיד का अर्थ विद्यार्थी या सीखनेवाला है। हिन्दी में समान श्रेणियों की जोड़ी को स्वाभाविक बनाने के लिए עִם को समावेशी संयोजन ‘तथा’ से व्यक्त किया गया है।
