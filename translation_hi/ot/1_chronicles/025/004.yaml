base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/004.yaml
  text: 'To Heman: the sons of Heman: Bukkiah[a], Mattaniah, Uzziel, Shebuel, and Jerimoth, Hananiah, Hanani, Eliathah, Giddalti, and Romamti-ezer, Joshbekashah, Mallothi, Hothir[c][b], Mahazioth.'
translation:
  language: hi
  text: 'हेमान के लिए—हेमान के पुत्र: बुक्कियाह, मत्तन्याह, उज्जीएल, शबूएल[a] और यरीमोत[b], हनन्याह, हनानी, एलीआता, गिद्दलती[c] और रोममती-एजेर, योशबकाशा, मल्लोती, होतीर, महज़ीओत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शबूएल’ का एक अन्य रूप ‘शूबाएल’ भी मिलता है।
    reason: lexical_alternative
  - marker: b
    text: ‘यरीमोत’ को कुछ परंपराओं में ‘यरेमोत’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: c
    text: इस सूची के कुछ नाम, विशेषकर ‘गिद्दलती’ और ‘रोममती-एजेर’, क्रियात्मक वाक्यांश की तरह भी पढ़े जा सकते हैं; यहाँ प्रसंग के अनुसार इन्हें व्यक्तिनाम माना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לְ/הֵימָן
  choice: हेमान के लिए
  rationale: उपसर्ग ל इस अध्याय में दल अथवा दायित्व हेमान को सौंपे जाने का संकेत देता है। ‘हेमान के लिए’ सूची की संरचना को स्वाभाविक रूप से बनाए रखता है।
- source_word: בְּנֵי הֵימָן
  choice: हेमान के पुत्र
  rationale: בני का सीधा अर्थ ‘पुत्र’ है; वंश-सूचियों में यह कभी-कभी वंशजों को भी समेट सकता है, पर यहाँ नामित संतानों की सूची होने के कारण ‘पुत्र’ सबसे स्पष्ट है।
- source_word: שְׁבוּאֵל
  choice: शबूएल
  rationale: यह इब्रानी व्यंजन-विन्यास और स्वरांकन के निकट देवनागरी लिप्यंतरण है; प्रचलित वैकल्पिक रूप ‘शूबाएल’ पादटिप्पणी में दिया गया है।
- source_word: וִֽ/ירִימוֹת
  choice: यरीमोत
  rationale: मसोरेटिक स्वरांकन के निकट लिप्यंतरण किया गया है और आरंभिक संयोजक को हिंदी सूची की स्वाभाविक विराम-व्यवस्था में व्यक्त किया गया है।
- source_word: גִדַּלְתִּי
  choice: गिद्दलती
  rationale: यद्यपि यह रूप अन्य संदर्भ में क्रियात्मक अर्थ दे सकता है, यहाँ पुत्रों की सूची में इसे व्यक्तिनाम समझना प्रसंगानुकूल है।
- source_word: וְ/רֹמַמְתִּי עֶזֶר
  choice: रोममती-एजेर
  rationale: सूची के संदर्भ में दोनों पदों को संयुक्त व्यक्तिनाम माना गया है; योजक चिह्न नाम की संयुक्त प्रकृति स्पष्ट करता है।
theological_decisions:
- issue: क्या गिद्दलती और रोममती-एजेर सहित सूची के कुछ रूपों को व्यक्तिनाम माना जाए या अर्थपूर्ण वाक्यांश
  choice: पूरे क्रम को हेमान के पुत्रों के व्यक्तिनामों की सूची के रूप में प्रस्तुत किया गया है।
  alternative: कुछ नामों को ‘मैंने बढ़ाया और सहायता को ऊँचा किया’ जैसे अर्थपूर्ण वाक्यांश का भाग मानना।
  rationale: तात्कालिक साहित्यिक संदर्भ गायकों और उनके पुत्रों की नामावली है। फिर भी रूपों में निहित संभावित वाक्यार्थ को पादटिप्पणी में सुरक्षित रखा गया है, ताकि वास्तविक भाषिक अस्पष्टता दब न जाए।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण नामावली-शैली अपनाई गई है। नामों को यथासंभव मसोरेटिक इब्रानी उच्चारण के निकट देवनागरी में लिखा गया है; हिंदी में अस्वाभाविक ढंग से प्रत्येक इब्रानी संयोजक दोहराने के बजाय स्वाभाविक अल्पविराम और अंतिम ‘और’ का प्रयोग किया गया है।
