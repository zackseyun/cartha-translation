base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/003.yaml
  text: 'Of Jeduthun: the sons of Jeduthun—Gedaliah, Zeri, Jeshaiah, Hashabiah, and Mattithiah, six—under the direction of their father Jeduthun, who prophesied with the lyre in giving thanks and praise to Yahweh.'
translation:
  language: hi
  text: 'यदूतून का दल: यदूतून के पुत्र—गदल्याह, सेरी, यशायाह, हशब्याह और मत्तित्याह—छह[a], अपने पिता यदूतून के निर्देशन में थे, जो वीणा के साथ याहवे के प्रति धन्यवाद और स्तुति के लिए भविष्यवाणी करता था।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ यहाँ पाँच नाम गिनाता है, पर इसके बाद ‘छह’ कहता है। कुछ व्याख्याकार मानते हैं कि सूची से एक पुत्र का नाम छूट गया है या यदूतून स्वयं भी संख्या में शामिल है।
    reason: textual_variant
  - marker: b
    text: या, “जो वीणा के साथ याहवे का धन्यवाद और स्तुति करते हुए भविष्यवाणी करता था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לִידוּתוּן
  choice: यदूतून के दल में
  rationale: लְ उपसर्ग यहाँ सूची के अगले संगीत-दल अथवा विभाग का परिचय देता है। केवल ‘यदूतून के’ की अपेक्षा यह रूप आधुनिक हिन्दी में सूची की भूमिका स्पष्ट करता है।
- source_word: בְּנֵי יְדוּת֡וּן
  choice: यदूतून के पुत्र
  rationale: मूल का पारिवारिक पद बनाए रखा गया है; प्रसंग में ये उसके वंश अथवा संगीत-सेवा से जुड़े घराने के सदस्य हैं।
- source_word: גְּדַלְיָהוּ וּצְרִי וִישַׁעְיָהוּ חֲשַׁבְיָהוּ וּמַתִּתְיָהוּ
  choice: गदल्याह, सरी, यशायाह, हशब्याह और मत्तित्याह
  rationale: हिब्रू नामों को आधुनिक हिन्दी की स्वाभाविक देवनागरी ध्वन्यात्मक परंपरा में प्रस्तुत किया गया है।
- source_word: שִׁשָּׁה
  choice: कुल छः
  rationale: मसोरेटी पाठ में केवल पाँच नाम होने पर भी संख्या स्पष्ट रूप से ‘छः’ है; पाठ की कठिनाई को सुधारे बिना बनाए रखा गया है।
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: अपने पिता ... के निर्देशन में
  rationale: शाब्दिक ‘अपने पिता के हाथों के अधीन’ यहाँ देखरेख अथवा निर्देशन का मुहावरा है।
- source_word: בַּכִּנּוֹר
  choice: वीणा बजाते हुए
  rationale: כִּנּוֹר एक प्राचीन तार-वाद्य था। ‘वीणा’ सामान्य हिन्दी पाठक के लिए स्वाभाविक पारंपरिक समतुल्य है, और ‘बजाते हुए’ वाद्य के प्रयोग को स्पष्ट करता है।
- source_word: הַנִּבָּא
  choice: भविष्यवाणी करता था
  rationale: निफ़अल कृदंत के सामान्य भविष्यवाणी-संबंधी अर्थ को संगीत के प्रसंग में भी बनाए रखा गया है।
- source_word: עַל הֹדוֹת וְהַלֵּל
  choice: धन्यवाद देता तथा ... स्तुति करता था
  rationale: हिब्रू पदबंध भविष्यवाणी-संगीत के विषय अथवा उद्देश्य को व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक हिन्दी के साथ दोनों क्रियाएँ सुरक्षित हैं; वैकल्पिक उद्देश्य-संबंधी अर्थ पादटिप्पणी में दिया गया है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि में बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: मन्दिर के संगीत में ‘भविष्यवाणी’ का अर्थ
  choice: मुख्य पाठ में ‘भविष्यवाणी करता था’
  alternative: प्रेरित संगीत प्रस्तुत करता था; भविष्यसूचक ढंग से गाता था
  rationale: इतिहासकार संगीतकारों के लिए स्पष्ट रूप से भविष्यवाणी की शब्दावली प्रयोग करता है। इसे केवल संगीत-प्रस्तुति में बदल देने से मूल की धर्मवैचारिक गहनता मिट जाएगी।
- issue: पाँच नामों के बाद ‘छः’ की संख्या
  choice: ‘कुल छः’ को यथावत रखना
  alternative: संख्या को पाँच करना; यदूतून को छठा मानकर पाठ में जोड़ना
  rationale: मूल पाठ की वास्तविक कठिनाई को बिना प्रमाण सामंजस्यपूर्ण नहीं बनाया गया; संभावित व्याख्याएँ पादटिप्पणी में रखी गई हैं।
- issue: एकवचन कृदंत הַנִּבָּא का कर्ता
  choice: यदूतून को कर्ता मानकर अलग वाक्य में स्पष्ट करना
  alternative: पुत्रों को सामूहिक कर्ता मानना
  rationale: कृदंत पुल्लिंग एकवचन है और निकटतम एकवचन संज्ञा यदूतून है। अलग वाक्य हिन्दी में संबंध को स्पष्ट करता है, जबकि भविष्यवाणी की प्रकृति को नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सूची की संक्षिप्त शैली बनाए रखते हुए कठिन संख्या-पाठ और संगीत-संबंधी ‘भविष्यवाणी’ दोनों को बिना सामंजस्यकरण के सुरक्षित रखा गया है।
