base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/001.yaml
  text: 'And David and the commanders of the army set apart for the service the sons of Asaph[a], Heman, and Jeduthun, who prophesied with lyres, harps, and cymbals; and their number, the men for the work of their service[b], was:'
translation:
  language: hi
  text: दाऊद और सेना के अधिकारियों ने आसाप, हेमान और यदूतून के पुत्रों[a] को सेवा के लिए अलग ठहराया, जो वीणाओं, हार्पों और झाँझों के साथ भविष्यवाणी करते थे। अपनी सेवा का काम करने वाले इन पुरुषों की संख्या यह थी:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पुत्रों’ से उनके वंशज या उनके संगीत-दलों के सदस्य भी अभिप्रेत हो सकते हैं, केवल सगे पुत्र ही नहीं।
    reason: lexical_alternative
  - marker: b
    text: इस वाक्य की गणना आगे के पदों में दी गई है।
    reason: discourse_clarification
lexical_decisions:
- source_word: וַיַּבְדֵּל
  choice: अलग ठहराया
  rationale: हिफ़ील रूप का अर्थ अलग करना अथवा किसी विशेष कार्य के लिए ठहराना है; यह पद मंदिर-सेवा के लिए नियोजन का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂרֵי הַצָּבָא
  choice: सेना के अधिकारी
  rationale: שָׂרֵי नेतृत्व करनेवाले अधिकारियों और צָּבָא सेना को सूचित करता है; यह सहज आधुनिक हिन्दी है और सैन्य संदर्भ बनाए रखती है।
- source_word: לַעֲבֹדָה
  choice: सेवा के लिए
  rationale: मंदिर-संबंधी संदर्भ में עֲבֹדָה संगठित धार्मिक सेवा को सूचित करता है।
- source_word: לִבְנֵי אָסָף וְהֵימָן וִידוּתוּן
  choice: आसाप, हेमान और यदूतून के पुत्रों
  rationale: शाब्दिक पारिवारिक पदावली को सुरक्षित रखा गया है; 'पुत्र' तत्काल पुत्रों के अतिरिक्त वंशजों या उनके समूहों के सदस्यों को भी सूचित कर सकता है।
- source_word: הנביאים
  choice: जो ... भविष्यवाणी करते थे
  rationale: रूपात्मक संज्ञा को स्वाभाविक हिन्दी में वर्णनात्मक उपवाक्य बनाया गया है; इससे वाद्य-संगीत के साथ जुड़ी भविष्यवाणी का दावा बना रहता है।
- source_word: בְּכִנֹּרוֹת בִּנְבָלִים וּבִמְצִלְתָּיִם
  choice: वीणाओं, सारंगियों और झाँझों के साथ
  rationale: तीनों वाद्यों का भेद बनाए रखते हुए प्रचलित और समझने योग्य हिन्दी नाम चुने गए हैं; प्राचीन वाद्यों की सटीक आधुनिक पहचान अनिश्चित है।
- source_word: וַיְהִי מִסְפָּרָם
  choice: 'इन ... की संख्या यह थी:'
  rationale: यह वाक्य अगले पदों में आनेवाली गणना का परिचय देता है; इसलिए अंत में अपूर्णता-सूचक द्विबिंदु रखा गया है।
- source_word: אַנְשֵׁי מְלָאכָה לַעֲבֹדָתָם
  choice: अपनी सेवा का काम करनेवाले इन पुरुषों
  rationale: काम और सेवा दोनों धारणाओं को बनाए रखा गया है, पर 'कुशल' जैसा अर्थ नहीं जोड़ा गया, क्योंकि वह मूल में स्पष्ट नहीं है।
theological_decisions:
- issue: הַנְּבִיאִים को संज्ञा 'भविष्यद्वक्ता' माना जाए या संगीत से जुड़ी क्रिया के रूप में व्यक्त किया जाए
  choice: '''जो ... भविष्यवाणी करते थे'''
  alternative: '''वे भविष्यद्वक्ता, जो वीणाओं, सारंगियों और झाँझों के साथ थे'''
  rationale: इब्रानी में यह पद आसाप, हेमान और यदूतून के साथ समानाधिकरण में पढ़ा जा सकता है। क्रियात्मक हिन्दी वाक्य सहज है और यह तनाव सुरक्षित रखता है कि उनकी संगीत-सेवा भविष्यवाणी कही गई है, बिना किसी विशेष संस्थागत पद की अतिरिक्त धारणा थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। 'अलग ठहराया' धार्मिक-संगठनात्मक संदर्भ व्यक्त करता है। वाद्यों के लिए परिचित हिन्दी शब्द लिए गए हैं, जबकि प्राचीन वाद्यों की पूर्ण समानता का दावा नहीं किया गया।
