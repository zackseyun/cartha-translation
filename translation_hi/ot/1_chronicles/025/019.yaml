lexical_decisions:
- source_word: הַשְּׁנֵים עָשָׂר
  choice: बारहवीं चिट्ठी
  rationale: शाब्दिक रूप संख्या ‘बारह’ है, पर अध्याय के क्रमिक चिट्ठी-वर्णन में यह बारहवें क्रम को सूचित करता है। हिन्दी में सूची का आशय स्पष्ट करने के लिए ‘बारहवीं चिट्ठी’ स्वाभाविक है।
- source_word: לַחֲשַׁבְיָה
  choice: हशब्याह के नाम निकली
  rationale: उपसर्ग ל चिट्ठी द्वारा हशब्याह को हुए आवंटन को दर्शाता है; हिन्दी में ‘के नाम निकली’ इस प्रसंग को सहज रूप से व्यक्त करता है।
- source_word: חֲשַׁבְיָה
  choice: हशब्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: यहाँ בנים पुरुष संतानों को दर्शाता है; ‘पुत्र’ सटीक और इस वंशावली-सदृश सूची के अनुकूल है।
- source_word: וְאֶחָיו
  choice: और भाइयों
  rationale: אחים का प्राथमिक अर्थ ‘भाई’ है; व्यापक ‘कुटुम्बी’ अर्थ की यहाँ आवश्यकता नहीं है।
- source_word: שְׁנֵים עָשָׂר
  choice: वे बारह थे
  rationale: अंतिम संख्या हशब्याह सहित उससे संबद्ध दल की कुल संख्या बताती है; पूर्ण हिन्दी वाक्य में ‘वे बारह थे’ स्वाभाविक है।
