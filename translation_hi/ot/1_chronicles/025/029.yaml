    text: या, “बाईसवाँ चिट्ठी गिद्दलती के लिए निकली; उसके बेटे और उसके भाई—कुल बारह।” इब्रानी सूची की शैली संक्षिप्त है, और “चिट्ठी” आसपास के प्रसंग से समझी जाती है।
