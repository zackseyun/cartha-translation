lexical_decisions:
- source_word: לִשְׁנַיִם וְעֶשְׂרִים
  choice: बाईसवाँ
  rationale: अध्याय की क्रमिक सूची में यह बाईसवें चिट्ठे अथवा क्रम को सूचित करता है। स्वाभाविक हिन्दी में क्रमवाचक संख्या प्रयुक्त हुई है; संक्षिप्त इब्रानी शैली के कारण ‘चिट्ठा’ मुख्य पाठ में निहित रखा गया है।
- source_word: לְגִדַּלְתִּי
  choice: गिद्दलती के लिए
  rationale: उपसर्ग לְ यहाँ गिद्दलती को हुए आवंटन का संकेत देता है। ‘के लिए’ हिन्दी में इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּנָיו
  choice: उसके बेटों
  rationale: इब्रानी शब्द विशेष रूप से पुरुष संतान के बहुवचन को दर्शाता है, इसलिए सामान्य ‘संतानों’ के बजाय ‘बेटों’ रखा गया है।
- source_word: וְאֶחָיו
  choice: और भाइयों
  rationale: सामान्य शाब्दिक अर्थ ‘उसके भाई’ है। यहाँ व्यापक अर्थ ‘कुटुम्बी’ अपनाने की आवश्यकता नहीं है; हिन्दी में पुनरुक्त सर्वनाम से बचने के लिए ‘उसके’ साझा रूप से समझा जाता है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: अंतिम संख्या पूरे दल की कुल सदस्य-संख्या बताती है। ‘कुल’ इस सूचीगत अर्थ को स्पष्ट करता है, जबकि जोड़ी गई क्रिया ‘ठहरा’ पिछले पदों से निहित चिट्ठा-आवंटन को स्वाभाविक हिन्दी में व्यक्त करती है।
