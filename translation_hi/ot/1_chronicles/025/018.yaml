lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר
  choice: बारहवीं चिट्ठी
  rationale: सूची के प्रसंग में यह संख्या बारहवें क्रम की चिट्ठी को सूचित करती है। हिंदी में संदर्भ से निहित ‘चिट्ठी’ जोड़ने पर अर्थ स्वाभाविक और स्पष्ट रहता है।
- source_word: עֲזַרְאֵל
  choice: अज़रेल
  rationale: व्यक्तिनाम का अनुवाद नहीं, बल्कि इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בָּנָיו
  choice: उसके पुत्र
  rationale: इब्रानी शब्द विशेष रूप से पुत्रों को सूचित करता है; इसलिए लिंग-विशिष्ट अर्थ सुरक्षित रखा गया है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: सीधा अर्थ ‘उसके भाई’ है। यद्यपि व्यापक संदर्भ में पुरुष संबंधी या सहकर्मी संभव हो सकते हैं, पाठ की अनिश्चितता को विस्तार देकर हल नहीं किया गया।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: अंतिम संख्या अज़रेल के दल की कुल सदस्य-संख्या बताती है; सहज हिंदी के लिए ‘कुल’ जोड़ा गया है।
