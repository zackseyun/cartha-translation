- source_word: לִשְׁמוֹנָה עָשָׂר
  choice: अठारहवीं बारी
  rationale: पूर्ववर्ती प्रसंग में चिट्ठियों से ठहराई गई सेवाक्रम की बारी अभिप्रेत है। हिन्दी में केवल ‘अठारहवीं’ कहना अस्वाभाविक और अस्पष्ट होता, इसलिए निहित संज्ञा ‘बारी’ जोड़ी गई है; इसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לַחֲנָנִי
  choice: हनानी की हुई
  rationale: व्यक्तिनाम को देवनागरी में लिप्यंतरित किया गया है। उपसर्ग ל द्वारा व्यक्त नियुक्ति/विभाजन को स्वाभाविक हिन्दी में ‘की हुई’ से व्यक्त किया गया है।
- source_word: בָּנָיו
  choice: उसके बेटों
  rationale: मूल शब्द विशेष रूप से पुत्रों को दर्शाता है, इसलिए व्यापक ‘बच्चों’ के बजाय ‘बेटों’ रखा गया है।
- source_word: וְאֶחָיו
  choice: और भाइयों
  rationale: सामान्य और पारदर्शी अर्थ ‘भाई’ है; प्रसंग में इसे ‘कुटुम्बियों’ जैसा व्यापक अर्थ देने का पर्याप्त कारण नहीं है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह हनानी के बेटों और भाइयों सहित इस दल की कुल संख्या बताता है; हिन्दी में संबंध स्पष्ट करने के लिए ‘कुल’ जोड़ा गया है।
