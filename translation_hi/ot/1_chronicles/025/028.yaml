  text: 'इक्कीसवीं बारी: होतीर; उसके पुत्र और उसके भाई—कुल बारह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אֶחָד וְ/עֶשְׂרִים
  choice: इक्कीसवीं बारी
  rationale: यह अध्याय चिट्ठियों से ठहराए गए क्रम को गिनाता है। לְ assignment को सूचित करता है; हिन्दी में ‘इक्कीसवीं बारी’ स्वाभाविक है। ‘चिट्ठी’ पद में प्रत्यक्ष नहीं है, इसलिए मुख्य पाठ में उसे नहीं जोड़ा गया।
- source_word: לְ/הוֹתִיר
  choice: होतीर के लिए निकली
  rationale: הוֹתִיר व्यक्ति का नाम है। उपसर्ग לְ को हिन्दी के स्वाभाविक सूची-वाक्य ‘होतीर के लिए निकली’ में व्यक्त किया गया है।
- source_word: בָּנָי/ו
  choice: उसके पुत्र
  rationale: בנים यहाँ पुरुष संतानों को दर्शाता है; ‘पुत्र’ वंशावली-सूची के गरिमापूर्ण आधुनिक हिन्दी रूप के अनुकूल है।
- source_word: וְ/אֶחָי/ו
  choice: और उसके भाई
  rationale: אחים का सीधा अर्थ ‘भाई’ है। प्रसंग में सहकर्मी या कुल-सदस्य का व्यापक संकेत संभव होने पर भी मूल का पारिवारिक शब्द सुरक्षित रखा गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह संख्या पूरे समूह का योग बताती है। हिन्दी में ‘कुल’ जोड़ने से संक्षिप्त सूची-वाक्य का आशय स्पष्ट होता है, बिना कोई नई तथ्यात्मक सूचना जोड़े।
