lexical_decisions:
- source_word: לְ/אַרְבָּעָה עָשָׂר
  choice: चौदहवाँ ... का था
  rationale: इस सूची में לְ के साथ संख्या क्रमिक चिट्ठी अथवा दल का संकेत देती है। हिन्दी में स्वाभाविक सूची-शैली के लिए ‘चौदहवाँ ... का था’ रखा गया है; ‘चिट्ठा’ मूल पद में प्रत्यक्ष नहीं है।
- source_word: מַתִּתְיָהוּ
  choice: मतित्याह
  rationale: इब्रानी नाम के रूप को हिन्दी देवनागरी में निकट और पठनीय ढंग से लिप्यंतरित किया गया है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: इब्रानी בנים यहाँ विशेष रूप से पुत्रों को दर्शाता है, इसलिए अधिक व्यापक ‘संतान’ नहीं लिया गया।
- source_word: וְאֶחָיו
  choice: और भाइयों
  rationale: אחים का सीधा आधुनिक हिन्दी रूप ‘भाई’ है; ‘कुटुम्बी’ मूल से अधिक व्यापक होता।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह जन थे
  rationale: संख्या मतित्याह से संबद्ध पुत्रों और भाइयों की कुल गिनती बताती है। हिन्दी में वाक्य स्पष्ट और स्वाभाविक बनाने के लिए ‘कुल’ और ‘जन थे’ जोड़े गए हैं।
