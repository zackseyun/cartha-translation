  text: כָּל אֵ֣לֶּה עַל יְדֵי֩ אֲבִי/הֶ֨ם בַּ/שִּׁ֜יר בֵּ֣ית יְהוָ֗ה בִּ/מְצִלְתַּ֨יִם֙ נְבָלִ֣ים וְ/כִנֹּר֔וֹת לַ/עֲבֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים עַ֚ל יְדֵ֣י הַ/מֶּ֔לֶךְ אָסָ֥ף וִ/ידוּת֖וּן וְ/הֵימָֽן־־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/025/006.yaml
  text: 'All these were under the direction of their father in the music of the house of Yahweh[a], with cymbals, harps, and lyres, for the service of the house of God, under the direction of the king: Asaph, Jeduthun[c][b], and Heman.'
translation:
  language: hi
  text: ये सभी अपने-अपने पिता के निर्देशन में याहवे के भवन के संगीत में झाँझों, नबलों और वीणाओं[a] के साथ परमेश्वर के भवन की सेवा करते थे; और आसाप, यदूतून और हेमान राजा के निर्देशन में थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नबल’ और ‘वीणा’ के रूप में अनूदित इन दोनों प्राचीन तार-वाद्यों की ठीक-ठीक पहचान और उनके बीच का अंतर निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: עַל יְדֵי אֲבִיהֶם
  choice: अपने-अपने पिता के निर्देशन में
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपने पिता के हाथ के अधीन’ है, पर यहाँ यह संगीत-दलों पर प्रत्येक पिता की देखरेख और निर्देशन बताता है।
- source_word: בַּשִּׁיר
  choice: संगीत में
  rationale: שִׁיר का अर्थ ‘गीत’ या ‘गायन’ हो सकता है; वाद्यों और मंदिर-सेवा के इस प्रसंग में ‘संगीत’ स्वाभाविक व्यापक अर्थ देता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा का भवन
  rationale: ‘भवन’ मूल के בֵּית को बनाए रखता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त करता है।
- source_word: בִּמְצִלְתַּיִם
  choice: झाँझों के साथ
  rationale: यह मंदिर के संगीत में प्रयुक्त झाँझों को सूचित करता है और उपसर्ग साधन का अर्थ देता है।
- source_word: נְבָלִים וְכִנֹּרוֹת
  choice: सारंगियों और वीणाओं
  rationale: दो अलग प्राचीन तार-वाद्यों का भेद बनाए रखा गया है, यद्यपि आधुनिक वाद्यों से उनका सटीक साम्य अनिश्चित है।
- source_word: לַעֲבֹדַת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन की सेवा करते थे
  rationale: עֲבֹדָה यहाँ उपासना-स्थल से जुड़ी सेवा या कार्य है; हिंदी में क्रियात्मक रूप वाक्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עַל יְדֵי הַמֶּלֶךְ
  choice: राजा के निर्देशन में
  rationale: दोहराया गया मुहावरा राजकीय देखरेख या प्राधिकार व्यक्त करता है; अंतिम नामों के साथ इसका संबंध हिंदी में स्पष्ट किया गया है।
- source_word: אָסָף וִידוּתוּן וְהֵימָן
  choice: आसाप, यदूतून और हेमान
  rationale: व्यक्तिगत नामों के प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहोवा’ हिंदी पाठकों में परिचित रूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: अंतिम वाक्यांश का वाक्यगत संबंध
  choice: आसाप, यदूतून और हेमान राजा के निर्देशन में थे
  alternative: राजा के निर्देशन में—आसाप, यदूतून और हेमान
  rationale: इब्रानी पदक्रम संक्षिप्त और कुछ असहज है। चुना गया रूप इस स्वाभाविक अर्थ को व्यक्त करता है कि तीनों प्रमुख राजा के अधिकार में थे, बिना उन्हें राजा के समानाधिकरण में रखे।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘अपने-अपने पिता’ से पिछले संदर्भ में तीनों दलों के अलग-अलग पिताओं का आशय स्पष्ट होता है। वाद्य-नामों में परिचित हिंदी बाइबलीय शब्दावली रखी गई है और अनिश्चितता पाद-टिप्पणी में बताई गई है।
