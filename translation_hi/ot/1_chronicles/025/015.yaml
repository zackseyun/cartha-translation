  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: आठवाँ
  rationale: निश्चित उपपद सहित क्रमवाचक शब्द अध्याय की चिट्ठी/नियुक्ति-सूची में प्रयुक्त है। मूल पद में ‘चिट्ठी’ स्पष्ट रूप से नहीं है, इसलिए मुख्य पाठ में केवल ‘आठवाँ’ रखा गया है।
- source_word: יְשַׁעְיָהוּ
  choice: यशायाह
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: בנים यहाँ पुरुष संतानों, अर्थात बेटों, को सूचित करता है; अतः लिंग-सटीक अभिव्यक्ति रखी गई है।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: אחים का सीधा अर्थ ‘भाई’ है; प्रसंग इसे ‘कुटुम्बी’ जैसे व्यापक अर्थ में लेने को बाध्य नहीं करता।
- source_word: שְׁנֵים עָשָׂר
  choice: कुल बारह
  rationale: यह समूह की कुल संख्या बताता है। ‘कुल’ हिन्दी में सूची की संक्षिप्त शैली को स्वाभाविक बनाता है, जबकि मूल की क्रियारहित रचना को अनावश्यक पूर्ण वाक्य में नहीं बदलता।
