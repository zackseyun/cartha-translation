  text: וַ/יֹּ֤אמֶר דָּוִיד֙ אֶל הָ֣/אֱלֹהִ֔ים חָטָ֣אתִֽי מְאֹ֔ד אֲשֶׁ֥ר עָשִׂ֖יתִי אֶת הַ/דָּבָ֣ר הַ/זֶּ֑ה וְ/עַתָּ֗ה הַֽעֲבֶר נָא֙ אֶת עֲו֣וֹן עַבְדְּ/ךָ֔ כִּ֥י נִסְכַּ֖לְתִּי מְאֹֽד־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/008.yaml
  text: Then David said to God[a], “I have sinned greatly in doing this thing. But now, please take away the guilt of your servant, for I have acted very foolishly.”
translation:
  language: hi
  text: तब दाऊद ने परमेश्वर से कहा, “यह काम करके मैंने बहुत बड़ा पाप किया है। पर अब कृपा करके अपने सेवक का अपराध[a] दूर कर दे, क्योंकि मैंने बहुत मूर्खता की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवक का अधर्म दूर कर दे।” इब्रानी शब्द का अर्थ ‘अधर्म,’ ‘दोष,’ या दोष के कारण उत्पन्न दायित्व भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर से
  rationale: यहाँ אֱלֹהִים इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ मानक, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: חָטָאתִי מְאֹד
  choice: मैंने बहुत बड़ा पाप किया है
  rationale: यह पूर्ण क्रिया के स्वीकारोक्ति-भाव और מְאֹד की तीव्रता—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר עָשִׂיתִי אֶת הַדָּבָר הַזֶּה
  choice: यह काम करके
  rationale: यह वाक्यांश पाप को दाऊद के इसी विशेष कार्य से जोड़ता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: וְעַתָּה
  choice: पर अब
  rationale: स्वीकारोक्ति से विनती की ओर होने वाले भावगत मोड़ को स्पष्ट करता है।
- source_word: הַעֲבֶר נָא
  choice: कृपा करके ... दूर कर दे
  rationale: हिफ़ील आज्ञार्थक रूप हटाने या दूर करने का भाव देता है और נָא विनम्र आग्रह प्रकट करता है।
- source_word: עֲוֹן
  choice: अपराध
  rationale: इस शब्द में अधर्म, दोष और दोष से उत्पन्न दायित्व के अर्थ समाहित हो सकते हैं। ‘अपराध’ हिन्दी में इस नैतिक बोझ को व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַבְדְּךָ
  choice: अपने सेवक का
  rationale: यह परमेश्वर के सामने दाऊद का विनम्र आत्म-संबोधन है; ‘सेवक’ प्रसंगानुकूल है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह दाऊद की विनती का कारण प्रस्तुत करता है।
- source_word: נִסְכַּלְתִּי מְאֹד
  choice: मैंने बहुत मूर्खता का काम किया है
  rationale: क्रिया केवल मूर्ख होने की अवस्था नहीं, बल्कि मूर्खतापूर्ण आचरण को दर्शाती है; यह अनुवाद उस क्रियात्मक बल और तीव्रता को बनाए रखता है।
theological_decisions:
- issue: दाऊद की विनती में עָוֹן का अर्थ
  choice: मुख्य पाठ में ‘अपराध’
  alternative: ‘अधर्म’; अथवा दोष और उसके कारण उत्पन्न दायित्व
  rationale: मूल शब्द पापपूर्ण कर्म, उसके दोष और उससे उपजे दायित्व के बीच अर्थगत विस्तार रखता है। मुख्य पाठ में ‘अपराध’ इस बहुव्यंजकता को यथासंभव खुला रखता है और पादटिप्पणी अन्य अर्थ बताती है; इसे केवल दंड या केवल पापी कर्म तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। दाऊद की स्वीकारोक्ति और विनम्र विनती का सीधा भाव सुरक्षित है; धार्मिक पारिभाषिकता को अनावश्यक रूप से भारी नहीं बनाया गया।
