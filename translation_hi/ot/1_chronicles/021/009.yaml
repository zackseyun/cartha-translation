lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब … कहा
  rationale: वाव-क्रमिक रूप कथा की अगली घटना बताता है; हिन्दी में ‘तब’ क्रम को स्वाभाविक बनाता है। דבר तथा לֵאמֹר की संयुक्त अभिव्यक्ति को एक ही सहज वाक्-क्रिया ‘कहा’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ रखा गया है।
- source_word: אֶל־גָּד
  choice: गाद से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: חֹזֵה דָוִיד
  choice: दाऊद के दर्शी
  rationale: חֹזֵה ऐसे व्यक्ति को दर्शाता है जिसे प्रकाशनात्मक दर्शन प्राप्त होता है। ‘दर्शी’ इस विशिष्ट पद को ‘भविष्यद्वक्ता’ जैसे व्यापक शब्द में मिलाए बिना सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह सूत्र आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘कहा’ पर्याप्त और स्वाभाविक है; ‘यह कहते हुए’ अनावश्यक रूप से कृत्रिम होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में स्थापित ‘यहोवा’ उसे नाम के रूप में सुरक्षित रखता है; ‘याहवे’ सम्भावित वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। ‘दर्शी’ बाइबलीय पद की विशिष्टता बनाए रखता है। मूल के ‘बोला…कहते हुए’ ढाँचे को हिन्दी में अनावश्यक पुनरुक्ति से बचाते हुए ‘कहा’ में समेटा गया है।
