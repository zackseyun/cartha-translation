  text: וַ/יֹּ֤אמֶר יְהוָה֙ לַ/מַּלְאָ֔ךְ וַ/יָּ֥שֶׁב חַרְבּ֖/וֹ אֶל נְדָנָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/027.yaml
  text: And Yahweh spoke to the angel[b][a], and he returned his sword to its sheath.
translation:
  language: hi
  text: तब यहोवा ने स्वर्गदूत से कहा, और उसने अपनी तलवार फिर उसकी म्यान में रख ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר का मूल अर्थ ‘कहना’ है; यहाँ ‘स्वर्गदूत से कहा’ स्वाभाविक है और ‘आज्ञा दी’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: לַמַּלְאָךְ
  choice: स्वर्गदूत से
  rationale: מלאך का अर्थ दूत भी हो सकता है, पर खिंची हुई तलवार वाले स्वर्गीय प्राणी के इस प्रसंग में ‘स्वर्गदूत’ स्पष्ट अर्थ है।
- source_word: וַיָּשֶׁב
  choice: फिर ... रख ली
  rationale: שוב के हिफ़ील रूप का भाव वापस करने या पुनः रखने का है; तलवार और म्यान के साथ यह हिन्दी में स्वाभाविक अभिव्यक्ति है।
- source_word: חַרְבּוֹ
  choice: अपनी तलवार
  rationale: प्रत्यय तलवार को कर्ता, अर्थात निकट संदर्भ में स्वर्गदूत, की बताता है; हिन्दी में ‘अपनी’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶל נְדָנָהּ
  choice: उसकी म्यान में
  rationale: נְדָן तलवार की म्यान है; אֶל यहाँ गति के लक्ष्य को सूचित करता है, जिसे हिन्दी में ‘में’ स्वाभाविक रूप से व्यक्त करता है। स्त्रीलिंग प्रत्यय तलवार की ओर संकेत करता है।
theological_decisions:
- issue: וַיָּשֶׁב (‘और उसने वापस रखा’) का कर्ता
  choice: ‘उसने’ का निकटतम संदर्भ स्वर्गदूत है, जो अपनी तलवार म्यान में रखता है।
  alternative: यहोवा को व्याकरणिक कर्ता मानना, अर्थात उसने तलवार वापस कराई या लौटाई।
  rationale: तत्काल पूर्ववर्ती ‘स्वर्गदूत से’ और कथा की क्रिया स्वर्गदूत को स्वाभाविक कर्ता बनाते हैं। फिर भी हिन्दी में ‘उसने’ रखकर मूल की सर्वनामगत संरचना बनाए रखी गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘तब’ कथात्मक וַ को प्रवाह देता है; ‘फिर’ वापसी के भाव को व्यक्त करता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
