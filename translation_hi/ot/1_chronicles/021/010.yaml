source:
  edition: WLC
  text: לֵךְ֩ וְ/דִבַּרְתָּ֨ אֶל דָּוִ֜יד לֵ/אמֹ֗ר כֹּ֚ה אָמַ֣ר יְהוָ֔ה שָׁל֕וֹשׁ אֲנִ֖י נֹטֶ֣ה עָלֶ֑י/ךָ בְּחַר לְ/ךָ֛ אַחַ֥ת מֵ/הֵ֖נָּה וְ/אֶֽעֱשֶׂה לָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/010.yaml
  text: 'Go and speak to David[a], saying, ‘Thus says Yahweh: I am setting three things before you. Choose one of them for yourself, and I will do it to you.’'
translation:
  language: hi
  text: 'जा और दाऊद से कह, ‘याहवे इस प्रकार कहता है: मैं तेरे सामने तीन बातें[a] रख रहा हूँ। उनमें से अपने लिए एक चुन ले, और मैं वही तुझ पर करूँगा।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तीन मैं तुझ पर फैलाए/ताने हुए हूँ।” इब्रानी में ‘तीन’ के बाद वस्तु का नाम नहीं दिया गया है; प्रसंग का भाव है कि याहवे दाऊद के सामने चुनने के लिए तीन संभावनाएँ रख रहा है।
    reason: मूल क्रिया के शाब्दिक अर्थ और अनकही संज्ञा की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: לֵךְ וְדִבַּרְתָּ אֶל דָּוִיד
  choice: जा और दाऊद से कह
  rationale: आज्ञार्थक क्रिया और דִבֶּר אֶל की दिशा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। यहाँ ‘कह’ अगले प्रत्यक्ष कथन के अनुरूप है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे इस प्रकार कहता है
  rationale: यह भविष्यद्वक्ताओं के संदेश की प्रचलित सूत्रात्मक अभिव्यक्ति है; יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: שָׁלוֹשׁ אֲנִי נֹטֶה עָלֶיךָ
  choice: मैं तेरे सामने तीन बातें रख रहा हूँ
  rationale: मूल में ‘तीन’ का संज्ञात्मक आधार अनकहा है और נֹטֶה का मूल भाव फैलाने या बढ़ाने का है। चुनाव के प्रसंग में ‘सामने ... रख रहा हूँ’ स्वाभाविक है, जबकि ‘बातें’ न्यूनतम पूर्ति है जो इन्हें समय से पहले दंड या विपत्तियाँ नहीं कहती।
- source_word: בְּחַר לְךָ אַחַת מֵהֵנָּה
  choice: उनमें से अपने लिए एक चुन ले
  rationale: आज्ञा, अंशवाचक ‘उनमें से’, और לְךָ में निहित व्यक्तिगत चुनाव—तीनों को स्पष्ट और स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: और मैं वही तेरे साथ करूँगा
  rationale: עשה के सामान्य अर्थ ‘करना’ को बनाए रखता है और לְךְ को ‘तेरे साथ’ द्वारा व्यक्त करता है। इससे दंडात्मक प्रसंग का संकेत बना रहता है, पर क्रिया को अधिक व्याख्यात्मक ‘तुझ पर लाऊँगा’ में नहीं बदला जाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है; उसका लिप्यंतरण वाचा-संबंधी नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: ‘तीन’ के साथ अनकही संज्ञा
  choice: तीन बातें
  alternative: तीन दंड / तीन विपत्तियाँ / तीन विकल्प
  rationale: इब्रानी में संज्ञा व्यक्त नहीं की गई है। ‘बातें’ न्यूनतम हिन्दी पूर्ति है और अगले पद से पहले उन तीन को किसी अधिक विशिष्ट धार्मिक श्रेणी में निर्धारित नहीं करती।
- issue: וְאֶעֱשֶׂה לָּךְ में לְ का अर्थ-संबंध
  choice: मैं वही तेरे साथ करूँगा
  alternative: मैं उसे तुझ पर लाऊँगा / मैं उसे तेरे लिए करूँगा
  rationale: प्रसंग में भाव प्रतिकूल है, इसलिए ‘तेरे लिए’ भ्रामक हो सकता है; फिर भी मूल क्रिया केवल ‘करना’ है। चुना गया रूप दंडात्मक तनाव बनाए रखते हुए ‘लाने’ की अतिरिक्त धारणा नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सीधा कथन। ईश्वर से मनुष्य के एकवचन संबोधन तथा आज्ञा के लिए ‘तू/तेरे’ रूप रखे गए हैं। प्रत्यक्ष वचन के भीतर भविष्यद्वक्तात्मक संदेश-सूत्र की औपचारिकता बनाए रखी गई है।
