base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/030.yaml
  text: But David could not go before it to seek God[a], because he was terrified by the sword of the angel of Yahweh.
translation:
  language: hi
  text: पर दाऊद गिबोन में यहोवा के निवास-स्थान के सामने जाकर परमेश्वर की खोज नहीं कर सका[a], क्योंकि वह यहोवा के दूत की तलवार से आतंकित था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सामने,” अर्थात परमेश्वर के सामने। इब्रानी सर्वनाम का संदर्भ परमेश्वर भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/לֹא יָכֹל
  choice: पर ... नहीं जा सका
  rationale: संयोजक कथा में पिछले पद से हल्का विरोध दिखाता है, और יכל सामर्थ्य व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: לָ/לֶכֶת
  choice: जा
  rationale: यहाँ הלך किसी स्थान की ओर जाने को दर्शाता है।
- source_word: לְ/פָנָי/ו
  choice: उसके सामने
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे निकट और प्रसंगानुकूल पूर्वपद पिछले पद का निवास-स्थान है; हिन्दी में 'उसके' इस सम्भावित संकेत को बनाए रखता है, जबकि पादटिप्पणी दूसरी सम्भावना बताती है।
- source_word: לִ/דְרֹשׁ אֱלֹהִים
  choice: परमेश्वर की खोज करने के लिए
  rationale: דרשׁ यहाँ आराधना और प्रार्थना में परमेश्वर को खोजने अथवा उससे पूछने का व्यापक भाव रखता है; 'खोज करने' उस व्यापकता को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह दाऊद के न जा सकने का कारण प्रस्तुत करता है।
- source_word: נִבְעַת
  choice: बहुत डर गया था
  rationale: निफ़अल रूप तीव्र भय से अभिभूत होने का भाव देता है; साधारण आधुनिक हिन्दी में यह स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: מִ/פְּנֵי חֶרֶב
  choice: तलवार से
  rationale: भय-सूचक क्रिया के साथ מִפְּנֵי भय का कारण बताता है; तलवार को वास्तविक हथियार के रूप में रखा गया है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: इस प्रसंग में מַלְאָךְ स्वर्गीय दूत है; יהוה को परियोजना की हिन्दी परंपरा के अनुरूप 'यहोवा' कहा गया है।
theological_decisions:
- issue: לְפָנָיו में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में 'उसके सामने', जिसका सबसे सम्भावित संदर्भ गिबोन का निवास-स्थान है
  alternative: इसे परमेश्वर के संदर्भ में 'उसके सामने' समझा जा सकता है
  rationale: पद 29 में तुरन्त पहले यहोवा के निवास-स्थान और वेदी का उल्लेख है, और पद 30 बताता है कि दाऊद वहाँ क्यों नहीं गया। फिर भी इब्रानी पुल्लिंग एकवचन सर्वनाम व्याकरणतः परमेश्वर की ओर भी संकेत कर सकता है, इसलिए अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। 'परमेश्वर की खोज करना' मूल के व्यापक धार्मिक भाव को रखता है और उसे केवल परामर्श लेने तक सीमित नहीं करता।
