  text: And David gave Ornan six hundred shekels of gold by weight for the place[a].
translation:
  language: hi
  text: और दाऊद ने उस स्थान के लिए ओर्नान को सोने के छह सौ शेकेल तौलकर दिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 शमूएल 24:24 के समानांतर वृत्तांत में पचास शेकेल चाँदी का उल्लेख है; 1 इतिहास में यहाँ सोने के छह सौ शेकेल लिखे हैं। यह खरीदी के भिन्न दायरे या अलग पाठ-परंपरा को दर्शा सकता है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है। खरीद के प्रसंग में भुगतान का भाव स्पष्ट है, फिर भी ‘दिया’ इब्रानी अभिव्यक्ति को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: לְאָרְנָן
  choice: ओर्नान को
  rationale: इतिहास की पुस्तक के इब्रानी पाठ में नाम אָרְנָן है; इसलिए समानांतर शमूएल-वृत्तांत के ‘अरौना’ के बजाय इसी पाठ के नाम का लिप्यंतरण रखा गया है।
- source_word: בַּמָּקוֹם
  choice: उस स्थान के लिए
  rationale: מָקוֹם का अर्थ ‘स्थान’ है और यहाँ בְּ का प्रसंगानुसार मूल्य के बदले/के लिए होने का भाव है; यह अनुवाद बताता है कि धन उस स्थान के लिए दिया गया।
- source_word: שִׁקְלֵי זָהָב
  choice: शेकेल सोना
  rationale: प्राचीन भार-माप ‘शेकेल’ को परिवर्तित किए बिना रखा गया है; हिंदी में ‘छः सौ शेकेल सोना’ स्वाभाविक रूप से सोने की तौली हुई मात्रा व्यक्त करता है।
- source_word: מִשְׁקָל
  choice: तौलकर
  rationale: מִשְׁקָל सोने के भार से मापे जाने पर बल देता है। ‘तौलकर’ आधुनिक हिंदी में इस भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת
  choice: छः सौ
  rationale: इब्रानी पाठ की संख्या को यथावत रखा गया है; समानांतर वृत्तांत के कारण इसमें कोई सामंजस्यकारी परिवर्तन नहीं किया गया।
theological_decisions:
- issue: 2 शमूएल 24:24 के समानांतर वृत्तांत से संख्या और धातु का अंतर
  choice: इतिहास के पाठ के अनुसार ‘छः सौ शेकेल सोना’ रखा गया।
  alternative: 2 शमूएल 24:24 के ‘पचास शेकेल चाँदी’ से सामंजस्य बैठाने वाला अनुवाद।
  rationale: इब्रानी इतिहास-पाठ स्पष्ट रूप से छः सौ सोने के शेकेल कहता है। अनुवाद को इस अंतर्पाठीय तनाव को मिटाने के बजाय पाठ को जैसा है वैसा प्रस्तुत करना चाहिए; संभावित व्याख्याएँ पाद-टिप्पणी तक सीमित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन भार-माप ‘शेकेल’ को बनाए रखा गया है। ‘उस स्थान’ संदर्भगत निश्चितता को स्वाभाविक हिंदी में व्यक्त करता है, और ‘तौलकर’ מִשְׁקָל का भाव स्पष्ट करता है।
