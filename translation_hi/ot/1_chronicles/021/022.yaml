base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/022.yaml
  text: Then David said to Ornan, “Give me the place of the threshing floor, so that I may build on it an altar to the LORD. Give it to me for the full price, so that the plague may be stopped from upon the people.”
translation:
  language: hi
  text: तब दाऊद ने ओर्नान से कहा, “मुझे उस खलिहान का स्थान दे दो, ताकि मैं उस पर यहोवा के लिए एक वेदी बनाऊँ। इसका पूरा दाम लेकर इसे मुझे दे दो, ताकि लोगों पर आई महामारी रुक जाए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מְקוֹם הַגֹּרֶן
  choice: इस खलिहान की जगह
  rationale: מְקוֹם का मूल अर्थ ‘जगह/स्थान’ और גֹּרֶן का अर्थ ‘खलिहान’ है; संकेतवाचक ‘इस’ प्रसंग और हिंदी की स्वाभाविकता के अनुरूप है।
- source_word: בְּכֶסֶף מָלֵא
  choice: इसका पूरा दाम लेकर
  rationale: शाब्दिक अर्थ ‘पूरे चाँदी/धन के बदले’ है; भूमि-क्रय के प्रसंग में आधुनिक हिंदी का स्वाभाविक अर्थ ‘पूरा दाम’ है।
- source_word: וְתֵעָצַר
  choice: रुक जाए
  rationale: עצר के निफ़अल रूप का अर्थ यहाँ महामारी का रोक दिया जाना या थमना है; हिंदी में ‘रुक जाए’ उद्देश्यसूचक वाक्य के साथ सहज है।
- source_word: מֵעַל הָעָם
  choice: लोगों पर आई
  rationale: मूल में महामारी के ‘लोगों के ऊपर से’ रुकने का चित्र है; ‘लोगों पर आई महामारी’ उस संबंध को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ईश्वरीय नाम יהוה को हिंदी बाइबलीय परंपरा में परिचित ‘यहोवा’ से व्यक्त किया गया है, सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: महामारी रुकने का उद्देश्य और कारक
  choice: “ताकि लोगों पर आई महामारी रुक जाए”
  alternative: “ताकि वह लोगों पर से महामारी रोक दे”
  rationale: हिब्रू क्रिया निष्क्रिय/मध्य रूप में है और कर्ता स्पष्ट नहीं किया गया; चुना हुआ अनुवाद उसी अस्पष्टता को बनाए रखता है तथा परमेश्वर को व्याकरण में अप्रकट कर्ता बनाकर नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दाऊद की माँग में दोहराव मूल पाठ के अनुरूप बनाए रखा गया है।
