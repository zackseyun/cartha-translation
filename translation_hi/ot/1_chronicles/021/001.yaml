  yaml_path: translation/ot/1_chronicles/021/001.yaml
  text: Then Satan stood up against Israel and incited David to count Israel[a][b].
translation:
  language: hi
  text: तब शैतान[a] इस्राएल के विरुद्ध उठ खड़ा हुआ और उसने दाऊद को इस्राएल की गिनती करने के लिए उकसाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक विरोधी’। इब्रानी शब्द ‘सातान’ का अर्थ ‘विरोधी’ हो सकता है, अथवा यह व्यक्तिगत नाम या पदवी ‘शैतान’ के रूप में प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 2 शमूएल 24:1 में दाऊद को उकसाने की घटना को इस्राएल के विरुद्ध यहोवा के क्रोध से जोड़ा गया है। इतिहास-वृत्तान्त यहाँ शैतान को तात्कालिक कर्ता के रूप में प्रस्तुत करता है; दोनों विवरणों के बीच के धर्मवैचारिक तनाव को ज्यों का त्यों रखा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: उठ खड़ा हुआ
  rationale: עמד का मूल अर्थ ‘खड़ा होना/अपना स्थान लेना’ है। यहाँ ‘उठ खड़ा हुआ’ ठोस बिंब और विरोधी पहल—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שָׂטָן
  choice: शैतान
  rationale: बिना निश्चित उपपद का यह शब्द सामान्यतः ‘विरोधी’ भी हो सकता है, पर इस प्रसंग में व्यक्तिगत पदनाम के रूप में समझना सम्भाव्य है। वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: विरोधपूर्ण क्रिया के साथ עַל का अर्थ यहाँ स्वाभाविक रूप से ‘के विरुद्ध’ है।
- source_word: וַיָּסֶת
  choice: उकसाया
  rationale: סות के हिफ़ील रूप में किसी को कार्य के लिए भड़काने या प्रेरित करने का कारणात्मक भाव है। ‘उकसाया’ इस भाव को व्यक्त करता है, पर बाध्य करने का अर्थ नहीं जोड़ता।
- source_word: לִמְנוֹת
  choice: गिनती करने के लिए
  rationale: מנה का सीधा अर्थ ‘गिनना’ है। यह चयन ‘जनगणना करना’ की अपेक्षा मूल की संक्षिप्तता बनाए रखता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल में कर्म केवल ‘इस्राएल’ है; ‘इस्राएल के लोगों’ जैसा विस्तार आवश्यक नहीं है।
theological_decisions:
- issue: שָׂטָן की पहचान और अर्थ
  choice: व्यक्तिगत विरोधी के रूप में ‘शैतान’
  alternative: ‘एक विरोधी’
  rationale: इस पद में व्यक्तिगत सत्ता के रूप में ‘शैतान’ सम्भाव्य मुख्य अर्थ है, किन्तु इब्रानी संज्ञा सामान्य ‘विरोधी’ को भी सूचित कर सकती है। इसलिए मुख्य पाठ में ‘शैतान’ और पादटिप्पणी में वैकल्पिक अर्थ रखा गया है।
- issue: उकसाने वाले की पहचान और 2 शमूएल 24:1 से संबंध
  choice: इतिहास-वृत्तान्त के अनुसार शैतान को तात्कालिक कर्ता कहना
  alternative: 2 शमूएल 24:1 में यहोवा के क्रोध को दाऊद को उकसाने से जोड़ा गया है
  rationale: दोनों विवरणों को कृत्रिम रूप से एक कथन में मिलाने या उनके तनाव को मिटाने के बजाय, मुख्य पाठ इस पद की अपनी अभिव्यक्ति रखता है और पादटिप्पणी समानांतर विवरण का भेद स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप। ‘उठ खड़ा हुआ’ मूल के ठोस बिंब को रखता है; ‘उकसाया’ कारणात्मक प्रेरणा बताता है, बाध्यता नहीं। सभी पादटिप्पणी-चिह्न संबंधित पदांश के तुरंत बाद दिए गए हैं।
