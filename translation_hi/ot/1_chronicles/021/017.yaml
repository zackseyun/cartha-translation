base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/017.yaml
  text: Then David said to God[a], “Was it not I who ordered the people to be counted? I am the one who has sinned and done great evil. But these sheep—what have they done? O Yahweh my God, please let your hand be against me and against my father’s house[d][c][b], but not against your people for a plague.”
translation:
  language: hi
  text: तब दाऊद ने परमेश्वर से कहा, “क्या मैंने ही लोगों की गिनती करने की आज्ञा नहीं दी थी?[a] मैंने ही पाप किया है और बहुत बड़ी बुराई की है। पर ये भेड़ें—इन्होंने क्या किया है?[b] हे यहोवा, मेरे परमेश्वर, कृपा करके तेरा हाथ मुझ पर और मेरे पिता के घराने पर पड़े,[c] पर तेरी प्रजा पर महामारी न हो।”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “क्या मैंने ही लोगों को गिनने के लिए नहीं कहा था?”'
    reason: मूल क्रिया ‘कहा’ है, जिसका प्रसंगगत अर्थ आदेश देना है।
  - marker: b
    text: “ये भेड़ें” लोगों के लिए प्रयुक्त एक रूपक है।
    reason: आधुनिक पाठक के लिए चरवाही रूपक का संदर्भ स्पष्ट करना।
  - marker: c
    text: '“हाथ” यहाँ परमेश्वर की सक्रिय शक्ति या न्याय का हिब्रू रूपक है; अनुवाद यह भी हो सकता है: “तेरा हाथ मेरे और मेरे पिता के घराने के विरुद्ध हो।”'
    reason: मूल रूपक और पूर्वसर्ग की वैकल्पिक व्याख्या बताना।
  - marker: d
    text: 'शाब्दिक रूप से: “और तेरी प्रजा पर महामारी के लिए नहीं।” इसका आशय है कि महामारी तेरी प्रजा पर न पड़े।'
    reason: संक्षिप्त हिब्रू रचना के स्वाभाविक हिन्दी अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ निश्चित पद इस्राएल के परमेश्वर को सूचित करता है; आधुनिक मानक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הֲלֹא אֲנִי אָמַרְתִּי לִמְנוֹת בָּעָם
  choice: क्या मैंने ही लोगों की गिनती करने की आज्ञा नहीं दी थी?
  rationale: הֲלֹא की पुष्टिकारक आलंकारिक प्रश्न-विधि और दाऊद की व्यक्तिगत जिम्मेदारी पर बल दोनों सुरक्षित हैं; אָמַרְתִּי का प्रसंगगत आशय जनगणना का निर्देश देना है।
- source_word: וַאֲנִי הוּא אֲשֶׁר חָטָאתִי
  choice: मैंने ही पाप किया है
  rationale: וַאֲנִי הוּא का emphatic बल ‘मैंने ही’ से स्पष्ट होता है और पूर्ण क्रिया का वर्तमान परिणाम भी बना रहता है।
- source_word: וְהָרֵעַ הֲרֵעוֹתִי
  choice: और बहुत बुरा किया है
  rationale: धातु की पुनरुक्ति (infinitive absolute + finite verb) की तीव्रता ‘बहुत’ से व्यक्त होती है, बिना किसी अतिरिक्त नैतिक श्रेणी को आरोपित किए।
- source_word: הַצֹּאן
  choice: ये भेड़ें
  rationale: लोगों के लिए प्रयुक्त मूल चरवाही रूपक को प्रत्यक्ष रूप से बनाए रखा गया है।
- source_word: יְהוָה אֱלֹהַי
  choice: हे यहोवा, मेरे परमेश्वर
  rationale: व्यक्तिगत दिव्य नाम को लिप्यंतरित किया गया है और सम्बोधन हिन्दी में स्पष्ट किया गया है।
- source_word: תְּהִי נָא יָדְךָ בִּי וּבְבֵית אָבִי
  choice: कृपा करके तेरा हाथ मुझ पर और मेरे पिता के घराने पर पड़े
  rationale: ‘हाथ’ का हिब्रू रूपक सुरक्षित है; ‘पड़े’ प्रसंग में दंडात्मक क्रिया का संकेत देता है, पर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּבְעַמְּךָ לֹא לְמַגֵּפָה
  choice: पर तेरी प्रजा पर महामारी लाने के लिए नहीं
  rationale: निषेध का संबंध प्रजा और महामारी से स्पष्ट करते हुए मूल की संक्षिप्त तथा कुछ असामान्य रचना का आशय स्वाभाविक हिन्दी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है, इसलिए उसे ‘प्रभु’ जैसे पद से प्रतिस्थापित नहीं किया गया। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ रूप चुना गया; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: लोगों को ‘भेड़ें’ कहना
  choice: रूपक को मुख्य पाठ में बनाए रखना
  alternative: ‘ये लोग’ कहकर रूपक स्पष्ट करना
  rationale: दाऊद की अपील का चरवाही रूपक धर्मवैचारिक और साहित्यिक महत्व रखता है; उसे व्याख्यात्मक अनुवाद से हटाना उचित नहीं।
- issue: परमेश्वर के ‘हाथ’ का आशय
  choice: ‘तेरा हाथ ... पड़े’
  alternative: ‘तेरा दंड ... आए’
  rationale: मूल रूपक शक्ति, क्रिया या न्याय को सूचित कर सकता है। ‘दंड’ कहने से संभावित अर्थ समय से पहले निश्चित हो जाता, इसलिए तनाव और चित्रात्मकता बचाई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य। ‘तू/तेरा’ रूप प्रत्यक्ष प्रार्थना में पारंपरिक निकटता और एकवचन संबोधन बनाए रखता है। ‘पिता का घराना’ वंश और विस्तृत परिवार दोनों की मूल अर्थ-सीमा सुरक्षित रखता है।
