  text: וַ/יִּשָּׂ֨א דָוִ֜יד אֶת עֵינָ֗י/ו וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ עֹמֵ֗ד בֵּ֤ין הָ/אָ֨רֶץ֙ וּ/בֵ֣ין הַ/שָּׁמַ֔יִם וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ נְטוּיָ֖ה עַל יְרוּשָׁלִָ֑ם וַ/יִּפֹּ֨ל דָּוִ֧יד וְ/הַ/זְּקֵנִ֛ים מְכֻסִּ֥ים בַּ/שַּׂקִּ֖ים עַל פְּנֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/016.yaml
  text: David lifted up his eyes and saw the angel of Yahweh standing between the earth and the heavens[a], with his sword drawn in his hand, stretched out over Jerusalem. Then David and the elders, covered in sackcloth, fell on their faces.
translation:
  language: hi
  text: दाऊद ने अपनी आँखें उठाईं और याहवे के दूत को धरती और आकाश के बीच[a] खड़ा देखा। उसके हाथ में म्यान से निकली हुई तलवार थी, जो यरूशलेम के ऊपर बढ़ाई हुई थी। तब दाऊद और बुज़ुर्ग, जो टाट ओढ़े हुए थे, मुँह के बल गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धरती और आकाशों के बीच।” हिब्रू में शाब्दिक रूप से “धरती और आकाशों के बीच” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת עֵינָיו
  choice: अपनी आँखें उठाईं
  rationale: हिब्रू मुहावरे और उसके गंभीर दृश्यात्मक प्रभाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: रचना-संबंध को सीधे व्यक्त करता है और יְהוָה को व्यक्तिगत नाम के रूप में लिप्यंतरित करता है।
- source_word: בֵּין הָאָרֶץ וּבֵין הַשָּׁמַיִם
  choice: धरती और आकाशों के बीच
  rationale: धरती के साथ ब्रह्मांडीय विरोध को सुरक्षित रखता है और שָׁמַיִם के हिब्रू बहुवचन रूप को दर्शाता है।
- source_word: וְחַרְבּוֹ שְׁלוּפָה
  choice: उसके हाथ में नंगी तलवार थी
  rationale: तलवार के म्यान से निकले होने की परिणामात्मक अवस्था को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נְטוּיָה עַל יְרוּשָׁלִָם
  choice: यरूशलेम के ऊपर तनी हुई थी
  rationale: नगर की ओर बढ़ी हुई तलवार के धमकीपूर्ण और न्यायसूचक भाव को स्पष्ट रखता है।
- source_word: וְהַזְּקֵנִים
  choice: और पुरनिये
  rationale: इस्राएल के समुदाय-नेताओं के लिए प्रचलित बाइबलीय हिन्दी पद है और केवल अधिक आयु का अर्थ देने से बचता है।
- source_word: מְכֻסִּים בַּשַּׂקִּים
  choice: टाट ओढ़े हुए थे
  rationale: शोक और दीनता के सांस्कृतिक संकेत को रखते हुए शरीर के टाट से ढके होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּפֹּל ... עַל פְּנֵיהֶם
  choice: मुँह के बल गिर पड़े
  rationale: शारीरिक दण्डवत मुद्रा तथा नम्रता—दोनों को सीधे और सुबोध ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त चार-अक्षरी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- issue: दूत की पहचान
  choice: याहवे का दूत
  alternative: याहवे-स्वरूप दूत जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: मूल construct phrase को बिना यह तय किए रखा गया है कि इस दूत की तात्त्विक पहचान क्या है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी अपनाई गई है। “पुरनिये” सामुदायिक पद को व्यक्त करता है; बाकी वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
