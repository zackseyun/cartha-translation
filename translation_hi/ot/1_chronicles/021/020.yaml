  yaml_path: translation/ot/1_chronicles/021/020.yaml
  text: Ornan turned and saw the angel[a], and his four sons with him were hiding themselves, while Ornan was threshing wheat.
translation:
  language: hi
  text: ओर्नान ने मुड़कर स्वर्गदूत को देखा, और उसके साथ उसके चार बेटे अपने को छिपा रहे थे[क]; उस समय ओर्नान गेहूँ की मड़ाई कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “छिप रहे थे।” इब्रानी का आत्मवाचक रूप अधिक शाब्दिक रूप से “अपने को छिपा रहे थे” का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: मुड़कर
  rationale: שׁוב का मूल अर्थ ‘मुड़ना/लौटना’ है। यहाँ देखने से पहले की शारीरिक क्रिया के लिए ‘मुड़कर’ स्वाभाविक और संक्षिप्त है।
- source_word: וַיַּרְא אֶת הַמַּלְאָךְ
  choice: स्वर्गदूत को देखा
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है; इस दैवी दंड के प्रसंग में अलौकिक दूत स्पष्ट है, इसलिए ‘स्वर्गदूत’ उपयुक्त है।
- source_word: וְאַרְבַּעַת בָּנָיו עִמּוֹ
  choice: उसके साथ उसके चारों बेटे
  rationale: इब्रानी पदबंध ओर्नान के चार बेटों और उनके उसके साथ होने को बताता है। ‘चारों बेटे’ सामान्य हिन्दी में स्वाभाविक रूप से उल्लिखित चार बेटों के पूरे समूह को दर्शाता है।
- source_word: מִתְחַבְּאִים
  choice: अपने को छिपा रहे थे
  rationale: हित्पएल रूप की आत्मवाचक/मध्यवाचक छाया को ‘अपने को छिपा रहे थे’ स्पष्ट रूप से बनाए रखता है।
- source_word: וְאָרְנָן דָּשׁ חִטִּים
  choice: उस समय ओर्नान गेहूँ दाँव रहा था
  rationale: यह पृष्ठभूमि में चल रही परिस्थिति बताने वाला खंड है। ‘उस समय’ समकालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חִטִּים
  choice: गेहूँ
  rationale: यह संज्ञा सामान्य अनाज नहीं, विशेष रूप से गेहूँ को दर्शाती है।
