base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/023.yaml
  text: And Ornan said to David, “Take it for yourself, and let my lord the king do what is good in his eyes. See, I have given the cattle for burnt offerings, the threshing sledges for wood, and the wheat for the grain offering. I have given it all.”
translation:
  language: hi
  text: तब ओर्नान ने दाऊद से कहा, “इसे अपने लिए ले लीजिए, और मेरे प्रभु राजा वही करें जो उन्हें अपनी दृष्टि में अच्छा लगे। देखिए, मैंने होमबलियों के लिए बैल, ईंधन के लिए दँवाने के पटरे,[a] और अन्नबलि के लिए गेहूँ दे दिया है। मैंने यह सब दे दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात अनाज से भूसा अलग करने के लिए इस्तेमाल होने वाले लकड़ी के भारी उपकरण; ओर्नान इन्हें बलिदान की आग के ईंधन के रूप में दे रहा था।
    reason: cultural_note
lexical_decisions:
- source_word: קַח לָךְ
  choice: इसे अपने लिए ले लीजिए
  rationale: आज्ञार्थक क्रिया के साथ לָךְ व्यक्तिगत ग्रहण का भाव देता है। आदरसूचक बहुवचन ओर्नान द्वारा राजा दाऊद को किए गए संबोधन के अनुरूप है।
- source_word: וְיַעַשׂ אֲדֹנִי הַמֶּלֶךְ הַטּוֹב בְּעֵינָיו
  choice: और मेरे प्रभु राजा को जो अपनी दृष्टि में अच्छा लगे, वह करें
  rationale: यह हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है और निर्णय दाऊद की दृष्टि पर छोड़ने का भाव बनाए रखता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: मेरे प्रभु राजा
  rationale: यह दाऊद के लिए आदरपूर्ण राजकीय संबोधन है, परमेश्वर के लिए प्रयुक्त उपाधि नहीं।
- source_word: רְאֵה
  choice: देखिए
  rationale: यह आगे दिए गए प्रस्ताव की ओर ध्यान खींचता है; आधुनिक हिन्दी में आदरसूचक रूप प्रसंगानुकूल है।
- source_word: הַבָּקָר לָעֹלוֹת
  choice: होमबलियों के लिए बैल
  rationale: בקר सामूहिक रूप से गौ-पशुओं को सूचित कर सकता है; इस बलिदानी और कृषि-संदर्भ में ‘बैल’ ठोस तथा स्वाभाविक है। बहुवचन עֹלוֹת को ‘होमबलियों’ से दर्शाया गया है।
- source_word: הַמּוֹרִגִּים לָעֵצִים
  choice: ईंधन के लिए दाँवने के पटरे
  rationale: מורגים अनाज दाँवने के भारी उपकरणों या पटरेनुमा यंत्रों को सूचित करता है; לָעֵצִים का प्रसंगगत आशय उन्हें बलिदान की आग के ईंधन के रूप में देना है।
- source_word: הַחִטִּים לַמִּנְחָה
  choice: अन्नबलि के लिए गेहूँ
  rationale: बलिदानी संदर्भ में מנחה अन्नबलि है, और חטים स्पष्ट रूप से गेहूँ को सूचित करता है।
- source_word: הַכֹּל נָתָתִּי
  choice: मैं यह सब देता हूँ
  rationale: हिब्रू पूर्ण क्रिया यहाँ प्रस्तुत भेंट को दृढ़तापूर्वक घोषित करती है। हिन्दी में वर्तमान ‘देता हूँ’ तत्काल प्रस्ताव के प्रसंग में अधिक स्वाभाविक है, जबकि पूर्ण समर्पण का भाव ‘यह सब’ से सुरक्षित रहता है।
