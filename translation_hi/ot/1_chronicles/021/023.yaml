  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक रखी गई है। दाऊद के लिए आदरसूचक क्रियारूप प्रयुक्त हुए हैं। ‘होमबलि’ और ‘अन्नबलि’ परिचित बाइबलीय बलिदानी शब्दावली हैं; कम परिचित कृषि-उपकरण को मुख्य पाठ में संक्षेप से और पादटिप्पणी में स्पष्ट किया गया है।
