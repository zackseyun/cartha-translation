  text: But the king’s word prevailed against Joab[a]. So Joab went out and went throughout all Israel[b], and he came to Jerusalem.
translation:
  language: hi
  text: परन्तु राजा की बात योआब पर भारी पड़ी[a]। तब योआब निकला और सारे इस्राएल में घूमता-फिरता रहा[b], और यरूशलेम आया।
  philosophy: optimal-equivalence
  footnotes:
