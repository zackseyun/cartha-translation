    text: या, “राजा की आज्ञा योआब पर भारी पड़ी।”
    reason: lexical_alternative
  - marker: b
    text: या, “सारे इस्राएल में यात्रा करता रहा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּדְבַר הַמֶּלֶךְ
  choice: परन्तु राजा की बात
  rationale: דָּבָר का मूल अर्थ ‘बात/वचन’ है और प्रसंग में यह राजा की अधिकारपूर्ण आज्ञा को सूचित करता है। ‘बात’ हिब्रू अभिव्यक्ति को बनाए रखती है, जबकि ‘परन्तु’ पिछले पद में योआब के विरोध से संबंध दिखाता है।
- source_word: חָזַק עַל
  choice: योआब पर प्रबल हुई
  rationale: यह मुहावरा बताता है कि राजा की बात ने योआब के विरोध को दबा दिया। ‘पर प्रबल हुई’ मूल की शक्ति और संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וַיֵּצֵא יוֹאָב
  choice: तब योआब निकल पड़ा
  rationale: יָצָא का सामान्य अर्थ ‘निकलना’ है। ‘तब’ कथानक की अगली परिणामी घटना को सहज रूप से जोड़ता है।
- source_word: וַיִּתְהַלֵּךְ בְּכָל יִשְׂרָאֵל
  choice: सारे इस्राएल में घूमता रहा
  rationale: הָלַךְ का हित्पाएल रूप यहाँ विभिन्न स्थानों में घूमने या यात्रा करने का भाव देता है। ‘घूमता रहा’ व्यापक भ्रमण को स्पष्ट करता है, बिना जनगणना की अतिरिक्त क्रिया पाठ में जोड़े।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह पूरे राष्ट्र-क्षेत्र में यात्रा के व्यापक दायरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיָּבֹא יְרוּשָׁלִָם
  choice: फिर यरूशलेम आया
  rationale: בּוֹא का अर्थ ‘आना/प्रवेश करना’ है। यद्यपि प्रसंग में लौटना निहित हो सकता है, मूल पाठ केवल ‘आया’ कहता है; इसलिए उस अस्पष्टता को बनाए रखा गया है।
