base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/029.yaml
  text: The tabernacle of Yahweh, which Moses had made in the wilderness, and the altar of burnt offering were at that time on the high place at Gibeon.
translation:
  language: hi
  text: याहवे का पवित्र निवास, जिसे मूसा ने वीराने में बनाया था, और होमबलि की वेदी उस समय गिबोन में ऊँचे स्थान[a] पर थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उपासना के लिए प्रयुक्त ऊँचा स्थान।
    reason: ‘ऊँचा स्थान’ को केवल भौगोलिक ऊँचाई समझे जाने से बचाते हुए בָּמָה का उपासना-संबंधी अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: מִשְׁכַּן
  choice: पवित्र-निवास
  rationale: यह शब्द उस तंबू-जैसे पवित्र निवास को दर्शाता है जिसे मूसा ने बनाया था। ‘पवित्र-निवास’ आधुनिक पाठक के लिए स्वाभाविक है और परमेश्वर के निवास की मूल धारणा बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר עָשָׂה מֹשֶׁה
  choice: जिसे मूसा ने ... बनाया था
  rationale: संबंधवाचक उपवाक्य और मुख्य कथा से पहले हुए निर्माण का कालगत संबंध स्पष्ट रहता है।
- source_word: בַמִּדְבָּר
  choice: वीराने में
  rationale: यह निर्जन, कम आबाद प्रदेश का अर्थ देता है और केवल रेतीले ‘रेगिस्तान’ तक अर्थ को सीमित नहीं करता।
- source_word: מִזְבַּח הָעוֹלָה
  choice: होमबलि की वेदी
  rationale: עֹלָה उस बलि को दर्शाता है जो वेदी पर पूरी तरह जलाई जाती थी; ‘होमबलि’ इसका प्रचलित और संक्षिप्त हिन्दी धार्मिक पद है।
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह वाक्यांश कथा की तत्कालीन स्थिति बताता है।
- source_word: בַּבָּמָה
  choice: ऊँचे स्थान पर
  rationale: בָּמָה उपासना के लिए प्रयुक्त ऊँचे स्थान को दर्शाता है; मुख्य पाठ स्रोत की स्थानिक अभिव्यक्ति बनाए रखता है और पादटिप्पणी उसका सांस्कृतिक अर्थ स्पष्ट करती है।
- source_word: בְּגִבְעוֹן
  choice: गिबोन के ... पर
  rationale: स्थान को गिबोन से संबद्ध बताने के लिए हिन्दी में संबंधसूचक रचना स्वाभाविक है।
- source_word: וּ
  choice: और
  rationale: आरंभिक संयोजक और दोनों संज्ञा-पदों के बीच संबंध को हिन्दी वाक्य में स्वाभाविक रूप से व्यक्त किया गया है; कोई अस्रोत ‘अब’ नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: מִשְׁכַּן में परमेश्वर के निवास की धारणा
  choice: पवित्र-निवास
  alternative: निवासस्थान; तंबू
  rationale: चयन उस ऐतिहासिक तंबू-पवित्रस्थान और ‘निवास’ की मूल अर्थ-छाया दोनों को व्यक्त करता है, बिना उसे किसी बाद की स्थायी मंदिर-इमारत के समान ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। संयुक्त कर्ता ‘पवित्र-निवास ... और ... वेदी’ के कारण बहुवचन क्रिया ‘थे’ प्रयुक्त हुई है।
