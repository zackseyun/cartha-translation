source:
  edition: WLC
  text: וַ/יִּבֶן֩ שָׁ֨ם דָּוִ֤יד מִזְבֵּ֨חַ֙ לַ/יהוָ֔ה וַ/יַּ֥עַל עֹל֖וֹת וּ/שְׁלָמִ֑ים וַ/יִּקְרָא֙ אֶל יְהוָ֔ה וַ/יַּֽעֲנֵ֤/הוּ בָ/אֵשׁ֙ מִן הַ/שָּׁמַ֔יִם עַ֖ל מִזְבַּ֥ח הָ/עֹלָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/026.yaml
  text: There David built an altar to Yahweh and offered up burnt offerings and peace offerings. He called on Yahweh[a], and he answered him with fire from heaven on the altar of burnt offering.
translation:
  language: hi
  text: वहाँ दाऊद ने यहवे के लिए एक वेदी बनाई और होमबलियाँ तथा शांति-बलियाँ[a] चढ़ाईं। उसने यहवे को पुकारा, और यहवे ने स्वर्ग से होमबलि की वेदी पर आग के द्वारा उसे उत्तर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेलबलियाँ।”
    reason: शְׁלָמִים के लिए एक प्रचलित अर्थगत विकल्प, जो सहभागी मेल अथवा संगति के पहलू को उभारता है।
lexical_decisions:
- source_word: וַיִּבֶן שָׁם דָּוִיד מִזְבֵּחַ לַיהוָה
  choice: वहाँ दाऊद ने यहवे के लिए एक वेदी बनाई
  rationale: इब्रानी वाक्य की स्थान-सूचना और निर्माण की ठोस क्रिया को स्वाभाविक आधुनिक हिन्दी में रखा गया है; לַיהוָה वेदी के समर्पण को दर्शाता है।
- source_word: וַיַּעַל עֹלוֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: עֹלוֹת उस बलिदान-श्रेणी को सूचित करता है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ पद है।
- source_word: וּשְׁלָמִים
  choice: शांति-बलियाँ
  rationale: यह शब्द बलिदान की श्रेणी का नाम है। ‘शांति-बलियाँ’ उसके שלום-संबंधी रूप को बनाए रखता है; ‘मेलबलियाँ’ एक सम्भव अर्थगत विकल्प है।
- source_word: וַיִּקְרָא אֶל יְהוָה
  choice: उसने यहवे को पुकारा
  rationale: प्रार्थना अथवा सहायता की याचना के प्रसंग में קרא אל का स्वाभाविक हिन्दी रूप ‘को पुकारा’ है।
- source_word: וַיַּעֲנֵהוּ בָאֵשׁ מִן הַשָּׁמַיִם
  choice: यहवे ने ... स्वर्ग से आग भेजकर उसे उत्तर दिया
  rationale: इब्रानी में उत्तर का साधन आग है। हिन्दी में ‘आग भेजकर’ घटना और साधन को स्पष्ट एवं स्वाभाविक बनाता है, जबकि उत्तर देने का भाव सुरक्षित रहता है।
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी पर
  rationale: यह आग के उतरने का स्थान बताता है और इब्रानी संबंधवाचक संरचना को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत करता है।
- issue: וַיַּעֲנֵהוּ का निहित कर्ता
  choice: यहवे ने ... उसे उत्तर दिया
  alternative: उसने उसे उत्तर दिया
  rationale: इब्रानी में कर्ता सर्वनाम से निहित है और निकटतम संदर्भ में यहवे है। हिन्दी में दो पुरुष पात्रों के कारण अस्पष्टता से बचने हेतु नाम दोहराया गया है।
- issue: आग द्वारा उत्तर की प्रकृति
  choice: स्वर्ग से आग भेजकर उसे उत्तर दिया
  alternative: आग से उसे उत्तर दिया
  rationale: अनुवाद कथित चमत्कारी घटना को ही व्यक्त करता है और उसका कोई अतिरिक्त प्रतीकात्मक या सिद्धान्तगत अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘वेदी’, ‘होमबलि’ और ‘शांति-बलि’ जैसे स्थापित बाइबलीय पद बनाए गए हैं; वाक्य-संरचना को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
