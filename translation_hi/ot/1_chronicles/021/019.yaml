base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/019.yaml
  text: So David went up at the word of Gad[b][a], which he had spoken in the name of Yahweh.
translation:
  language: hi
  text: तब दाऊद गाद के उस वचन के अनुसार ऊपर गया, जो गाद ने याहवे के नाम से कहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: क्रिया עלה की ऊपर जाने की दिशात्मक बारीकी को स्वाभाविक हिन्दी में सुरक्षित रखता है; प्रसंग में दाऊद का खलिहान की ओर जाना अभिप्रेत है।
- source_word: בִּדְבַר גָּד
  choice: गाद के वचन के अनुसार
  rationale: ב यहाँ आधार अथवा अनुरूपता व्यक्त करता है। यह रूप स्पष्ट करता है कि दाऊद ने गाद के दिए हुए वचन का पालन किया।
- source_word: אֲשֶׁר דִּבֶּר
  choice: जो उसने ... कहा था
  rationale: सम्बन्धवाचक उपवाक्य गाद के वचन की ओर लौटता है; 'कहा था' दाऊद के जाने से पहले हुए कथन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम से
  rationale: मूल अभिव्यक्ति को निकटता से रखते हुए यह बताता है कि गाद ने यहोवा के अधिकार से भविष्यद्वक्ता के रूप में कहा।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण द्वारा चतुरक्षरीय दिव्य नाम को शीर्षक से प्रतिस्थापित किए बिना व्यक्तिगत नाम के रूप में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में निजी दिव्य नाम है। आधुनिक हिन्दी पाठकों के लिए परिचित 'यहोवा' उसका प्रचलित लिप्यंतरण है और उसे केवल उपाधि 'प्रभु' में नहीं बदलता।
- issue: בְּשֵׁם में निहित अधिकार
  choice: के नाम से
  alternative: के अधिकार से
  rationale: '''के नाम से'' मूल रूपक और उसकी धार्मिक अर्थवत्ता को सुरक्षित रखता है; ''के अधिकार से'' अर्थ को स्पष्ट तो करता, पर मूल अभिव्यक्ति की व्यापकता को संकुचित कर देता।'
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। 'वचन' भविष्यद्वक्ताई संदेश के लिए स्वाभाविक बाइबलीय हिन्दी है, जबकि वाक्यरचना सामान्य पाठक के लिए सीधी है।
