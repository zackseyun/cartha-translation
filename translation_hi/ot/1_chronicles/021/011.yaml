  terminology: “याहवे” consistently preserves the Tetragrammaton as a personal name. “गाद” and “दाऊद” are suitable standard Hindi biblical forms. A footnote should preserve the lexical alternative for קַבֶּל, since “चुन” is contextually inferred from the options in the following verse.
