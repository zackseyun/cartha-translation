  edition: WLC
  text: וַ/יָּ֥בֹא גָ֖ד אֶל דָּוִ֑יד וַ/יֹּ֥אמֶר ל֛/וֹ כֹּֽה אָמַ֥ר יְהוָ֖ה קַבֶּל לָֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/011.yaml
  text: So Gad came to David and said to him[a], “Thus says Yahweh, ‘Choose for yourself—’”
translation:
  language: hi
  text: 'तब गाद दाऊद के पास आया और उससे कहा, “याहवे यों कहता है: ‘अपने लिए चुन[a]—’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “अपने लिए स्वीकार कर।” अगले पद में दिए गए विकल्पों के संदर्भ में इसका अर्थ “चुन” है।
    reason: कַבֶּל के शाब्दिक ‘स्वीकार/ग्रहण कर’ अर्थ को सुरक्षित रखते हुए संदर्भगत “चुन” अनुवाद स्पष्ट करता है।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य कथात्मक अर्थ; दाऊद की ओर गाद के आने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גָד
  choice: गाद
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל דָּוִיד
  choice: दाऊद के पास
  rationale: אֶל द्वारा व्यक्ति की ओर गति व्यक्त होती है; आधुनिक हिन्दी में यह सहज प्रयोग है।
- source_word: וַיֹּאמֶר לוֹ
  choice: उससे कहा
  rationale: אמר के साथ परोक्ष कर्म-सर्वनाम का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כֹּה אָמַר
  choice: ऐसा कहता है
  rationale: भविष्यद्वक्ताई संदेशवाहक सूत्र को वर्तमानकालीन, गरिमापूर्ण और सहज हिन्दी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: קַבֶּל
  choice: चुन
  rationale: मूल क्रिया का सामान्य अर्थ ‘ग्रहण/स्वीकार कर’ है, पर अगले पद में दिए विकल्पों के संदर्भ में यहाँ ‘चुन’ उसका अभिप्रेत आदेश स्पष्ट करता है।
- source_word: לָךְ
  choice: अपने लिए
  rationale: दत्तिव सर्वनाम दाऊद की निजी पसंद अथवा ग्रहण को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि से बदले बिना सुरक्षित रखता है।
- issue: קַבֶּל के आदेश का अर्थ
  choice: चुन
  alternative: अपने लिए स्वीकार कर
  rationale: अगले पद में दंड के विकल्प सामने रखे जाते हैं, इसलिए संदर्भगत अर्थ ‘चुन’ है; फिर भी मूल क्रिया के ग्रहण/स्वीकार करने वाले अर्थ को चुपचाप मिटाया नहीं जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक शैली सरल, गरिमापूर्ण और मौखिक पठन के अनुकूल है। अधूरा अंतिम आदेश और दीर्घ विराम अगले पद से उसके घनिष्ठ संबंध को बनाए रखते हैं।
