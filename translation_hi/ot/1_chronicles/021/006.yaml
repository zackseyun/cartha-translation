lexical_decisions:
- source_word: וְ/לֵוִי
  choice: परन्तु...लेवी
  rationale: वाव को पिछले पद के जनगणना-विवरण से विरोध दिखाने के लिए ‘परन्तु’ किया गया है; लेवी गोत्र का प्रचलित हिन्दी नाम रखा गया है।
- source_word: וּ/בִנְיָמִן
  choice: और बिन्यामीन
  rationale: लेवी के साथ दूसरे न गिने गए गोत्र के रूप में समन्वित है; प्रचलित हिन्दी नाम अपनाया गया है।
- source_word: לֹא פָקַד
  choice: नहीं गिना
  rationale: जनगणना के प्रसंग में פקד का अर्थ गिनना या संख्या लेना है; ‘नहीं गिना’ स्वाभाविक और स्पष्ट है।
- source_word: בְּ/תוֹכָ/ם
  choice: उनके साथ
  rationale: शाब्दिक अर्थ ‘उनके बीच’ है; यहाँ आशय पहले वर्णित गिने गए समूहों में सम्मिलित न करने से है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह योआब द्वारा इन गोत्रों को न गिनने का कारण प्रस्तुत करता है।
- source_word: נִתְעַב
  choice: घृणित लगी
  rationale: निफ़अल रूप किसी बात के अत्यन्त अप्रिय या घृणास्पद माने जाने का प्रबल भाव देता है; हिन्दी में अनुभवकर्ता योआब के साथ ‘घृणित लगी’ स्वाभाविक है।
- source_word: דְּבַר הַ/מֶּלֶךְ
  choice: राजा की आज्ञा
  rationale: דבר का अर्थ ‘वचन’, ‘बात’ या ‘आज्ञा’ हो सकता है; जनगणना कराने के राजकीय आदेश के प्रसंग में ‘आज्ञा’ सबसे स्पष्ट है।
- source_word: אֶת יוֹאָב
  choice: योआब को
  rationale: भाव या मूल्यांकन बताने वाले प्रयोग में אֶת प्रभावित अथवा अनुभव करने वाले व्यक्ति को चिह्नित करता है।
