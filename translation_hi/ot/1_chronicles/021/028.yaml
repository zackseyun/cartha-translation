  text: בָּ/עֵ֣ת הַ/הִ֔יא בִּ/רְא֤וֹת דָּוִיד֙ כִּי עָנָ֣/הוּ יְהוָ֔ה בְּ/גֹ֖רֶן אָרְנָ֣ן הַ/יְבוּסִ֑י וַ/יִּזְבַּ֖ח שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/028.yaml
  text: At that time[a], when David saw that Yahweh had answered him at the threshing floor of Ornan the Jebusite, he sacrificed there.
translation:
  language: hi
  text: उस समय, जब दाऊद ने देखा कि याहवे ने यबूसी ओर्नान के खलिहान में उसे उत्तर दिया था,[a] तो उसने वहीं बलिदान चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी सुन ली थी।” यहाँ प्रयुक्त इब्रानी क्रिया प्रार्थना या बलिदान के प्रत्युत्तर में उत्तर देने का अर्थ रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּעֵת הַהִיא
  choice: उस समय
  rationale: यह मानक कालवाचक पद है और कथा की पिछली घटना से स्वाभाविक संबंध बनाए रखता है, बिना क्षणिकता पर अनावश्यक बल दिए।
- source_word: בִּרְאוֹת דָּוִיד
  choice: जब दाऊद ने देखा
  rationale: ב उपसर्ग सहित infinitive construct यहाँ कालवाचक परिस्थिति बताता है; आधुनिक हिन्दी में यह सहज और सटीक रूप है।
- source_word: כִּי
  choice: कि
  rationale: यह दाऊद के देखने की विषय-वस्तु प्रस्तुत करता है; इसे 'क्योंकि' करने से कारण का अर्थ मूल से अधिक स्पष्ट हो जाता।
- source_word: עָנָהוּ
  choice: उसकी सुन ली है
  rationale: ענה का अर्थ यहाँ प्रार्थना अथवा बलिदान के प्रत्युत्तर में सुनना/उत्तर देना है। हिन्दी का मुहावरा 'उसकी सुन ली' इस प्रसंग में स्वाभाविक है; पूर्ण प्रत्युत्तर को 'ली है' व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामाटन है; हिन्दी बाइबलीय परंपरा में व्यापक और पहचाना हुआ लिप्यंतरण 'यहोवा' है, जो इसे किसी उपाधि से नहीं बदलता।
- source_word: בְּגֹרֶן
  choice: खलिहान में
  rationale: גֹּרֶן अनाज दाँवने/मँड़ाई करने के स्थान को दर्शाता है। आधुनिक हिन्दी में 'खलिहान' इसका स्वाभाविक संक्षिप्त समतुल्य है; यहाँ ב स्थानसूचक है।
- source_word: אָרְנָן הַיְבוּסִי
  choice: यबूसी ओर्नान
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया और जातिसूचक विशेषण को हिन्दी की स्वाभाविक विशेषण-पूर्व संज्ञा-रचना में रखा गया।
- source_word: וַיִּזְבַּח
  choice: तो उसने ... बलिदान चढ़ाया
  rationale: זבח बलिदान करने को दर्शाता है। हिन्दी में 'बलिदान चढ़ाया' स्वाभाविक धार्मिक अभिव्यक्ति है; 'तो' पूर्ववर्ती परिस्थिति से परिणामात्मक कथा-संबंध स्पष्ट करता है, बिना उसे कठोर कारणवाचक बनाए।
- source_word: שָׁם
  choice: वहीं
  rationale: यह स्थानसूचक क्रियाविशेषण है; 'वहीं' पहले उल्लिखित खलिहान पर हल्का और स्वाभाविक बल देता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत दिव्य नाम को उपाधि 'प्रभु' से नहीं बदला गया। आधुनिक हिन्दी पाठकों में 'यहोवा' अधिक पहचाना हुआ लिप्यंतरण है; 'याहवे' ध्वन्यात्मक पुनर्निर्माण के अधिक निकट माना जाता है, पर मूल उच्चारण पूर्णतः निश्चित नहीं है।
- issue: ענה के दिव्य प्रत्युत्तर का स्वरूप
  choice: उसकी सुन ली है
  alternative: उसे उत्तर दिया है
  rationale: संदर्भ प्रार्थना और बलिदान पर परमेश्वर के प्रत्युत्तर का है। मुख्य पाठ का हिन्दी मुहावरा यह संबंध सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य ने इब्रानी की कालवाचक रचना और दाऊद द्वारा देखे गए तथ्य को बनाए रखा है।
