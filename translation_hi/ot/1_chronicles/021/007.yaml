translation:
  language: hi
  text: परन्तु यह बात परमेश्वर की दृष्टि में बुरी थी,[a] इसलिए उसने इस्राएल पर प्रहार किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की आँखों में अप्रिय थी।” इब्रानी में शाब्दिक रूप से, “परमेश्वर की आँखों में बुरी थी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: बुरी थी
  rationale: यह क्रिया इस प्रसंग में नैतिक बुराई अथवा परमेश्वर को अप्रिय लगने का प्रबल मूल्यांकन व्यक्त करती है। ‘बुरी थी’ मूल की तीव्रता बनाए रखता है।
- source_word: בְּעֵינֵי הָאֱלֹהִים
  choice: परमेश्वर की दृष्टि में
  rationale: यह इब्रानी मुहावरे ‘परमेश्वर की आँखों में’ का स्वाभाविक हिन्दी समतुल्य है और परमेश्वर के मूल्यांकन का भाव सुरक्षित रखता है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: मूल पाठ में אֱלֹהִים है, יהוה नहीं; इसलिए ‘परमेश्वर’ उपयुक्त है, ‘यहोवा’ नहीं।
- source_word: עַל הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: דָּבָר का अर्थ यहाँ ‘बात/मामला’ है और यह दाऊद द्वारा कराई गई जनगणना की ओर संकेत करता है; ‘यह बात’ स्वाभाविक है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: וַיַּךְ
  choice: मारा
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है। ‘मारा’ आधुनिक हिन्दी में सीधा है और इस पद से अकेले ही घातक परिणाम को अधिक स्पष्ट नहीं करता।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल
  rationale: प्रत्यक्ष कर्म पूरी जाति इस्राएल है; मूल के अनुसार इसे बिना विस्तार के रखा गया है।
- source_word: וַ
  choice: परन्तु … इसलिए
  rationale: पहला वाव पिछले वर्णन के साथ विरोधात्मक मोड़ दिखाता है, जबकि दूसरा परमेश्वर के मूल्यांकन के परिणामस्वरूप हुई कार्रवाई व्यक्त करता है।
theological_decisions:
- issue: दाऊद की जनगणना का परमेश्वरीय मूल्यांकन और उसके बाद इस्राएल पर दंड
  choice: पद सीधे कहता है कि यह बात परमेश्वर की दृष्टि में बुरी थी और परिणामस्वरूप उसने इस्राएल को मारा।
  alternative: इसे केवल परमेश्वर को अप्रिय लगना कहना, अथवा ‘मारा’ को किसी अस्पष्ट और गैर-दंडात्मक प्रतिक्रिया के रूप में नरम करना।
  rationale: इब्रानी पाठ प्रबल नैतिक मूल्यांकन और सीधी परिणामी कार्रवाई दोनों व्यक्त करता है। अनुवाद इस तनाव को बनाए रखता है कि कार्य दाऊद का था, जबकि प्रहार इस्राएल पर हुआ; पद से बाहर जाकर इसे सुलझाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज कथात्मक रूप। ‘परमेश्वर की दृष्टि में’ स्वाभाविक हिन्दी मुहावरा है; पादटिप्पणी में मूल की शाब्दिक छवि और अपेक्षाकृत कोमल विकल्प दोनों दिए गए हैं।
