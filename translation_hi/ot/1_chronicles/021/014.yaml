  yaml_path: translation/ot/1_chronicles/021/014.yaml
  text: So Yahweh sent a plague on Israel[a], and seventy thousand men of Israel fell.
translation:
  language: hi
  text: तब यहोवा ने इस्राएल पर महामारी भेजी[a], और इस्राएल के सत्तर हज़ार पुरुष मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘घातक रोग’। इब्रानी शब्द घातक बीमारी के प्रकोप को दर्शाता है, प्रायः परमेश्वर के न्याय के प्रसंग में।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: וַיִּתֵּן
  choice: भेजी
  rationale: इस क्रिया का मूल अर्थ ‘दिया’ है, पर דֶּבֶר के साथ हिन्दी में ‘महामारी भेजी’ स्वाभाविक है और प्रत्यक्ष कर्तृत्व को बनाए रखता है।
- source_word: דֶּבֶר
  choice: महामारी
  rationale: यह शब्द घातक संक्रामक प्रकोप, विशेषकर दैवी न्याय के प्रसंग में, सूचित करता है; ‘महामारी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: पूर्वसर्ग यहाँ महामारी के इस्राएल पर आने को व्यक्त करता है; ‘पर’ हिन्दी का स्वाभाविक प्रयोग है।
- source_word: וַיִּפֹּל
  choice: मारे गए
  rationale: शाब्दिक अर्थ ‘गिरे’ है, किन्तु इस प्रसंग में यह मृत्यु का मुहावरा है। ‘मारे गए’ न्याय के कारण हुई मृत्यु को स्पष्ट करता है, बिना किसी अतिरिक्त साधन का उल्लेख किए।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल के
  rationale: यहाँ מן समूह में से संबंध या सदस्यता बताता है; संख्या के साथ ‘इस्राएल के’ स्वाभाविक हिन्दी है।
- source_word: שִׁבְעִים אֶלֶף אִישׁ
  choice: सत्तर हज़ार पुरुष
  rationale: אִישׁ संख्या के बाद सामूहिक रूप में प्रयुक्त है और मूल पाठ के पुरुषवाचक शब्द को ‘पुरुष’ के रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: न्याय में परमेश्वर का प्रत्यक्ष कर्तृत्व
  choice: यहोवा ने ... महामारी भेजी
  alternative: यहोवा ने ... महामारी आने दी
  rationale: इब्रानी पाठ क्रिया का कर्ता सीधे यहोवा को बताता है; ‘आने दी’ कहना मूल पाठ में निहित न होने वाला शमन जोड़ देता।
- issue: וַיִּפֹּל में मृत्यु का मुहावरा
  choice: मारे गए
  alternative: गिर पड़े
  rationale: प्रसंग में ‘गिरना’ मृत्यु को दर्शाता है। हिन्दी में केवल ‘गिर पड़े’ मृत्यु को अस्पष्ट कर सकता है; ‘मारे गए’ मुहावरे का आशय स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गंभीर और सार्वजनिक पाठ के अनुकूल शैली। ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘महामारी’ सामान्य पाठक के लिए स्पष्ट है।
