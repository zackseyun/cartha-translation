source:
  edition: WLC
  text: וַ/יִּתֵּ֥ן יוֹאָ֛ב אֶת מִסְפַּ֥ר מִפְקַד הָ/עָ֖ם אֶל דָּוִ֑יד וַ/יְהִ֣י כָֽל יִשְׂרָאֵ֡ל אֶ֣לֶף אֲלָפִים֩ וּ/מֵאָ֨ה אֶ֤לֶף אִישׁ֙ שֹׁ֣לֵֽף חֶ֔רֶב וִֽ/יהוּדָ֕ה אַרְבַּע֩ מֵא֨וֹת וְ/שִׁבְעִ֥ים אֶ֛לֶף אִ֖ישׁ שֹׁ֥לֵֽף חָֽרֶב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/005.yaml
  text: Joab gave the number of the census of the people to David. All Israel was 1,100,000 men drawing the sword[a], and Judah was 470,000 men drawing the sword.
translation:
  language: hi
  text: योआब ने लोगों की जनगणना की कुल संख्या दाऊद को दी। समस्त इस्राएल में 11,00,000[a] तलवार खींचनेवाले पुरुष थे, और यहूदा में 4,70,000 तलवार खींचनेवाले पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक हज़ार हज़ार और एक लाख।”
    reason: मूल हिब्रू में संख्या की असामान्य अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: מִסְפַּר מִפְקַד הָעָם
  choice: लोगों की जनगणना की कुल संख्या
  rationale: מִסְפַּר और מִפְקַד दोनों का भाव रखते हुए यह वाक्यांश गणना से प्राप्त कुल संख्या को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיְהִי כָל יִשְׂרָאֵל
  choice: समस्त इस्राएल में ... थे
  rationale: हिब्रू की परिणामसूचक संरचना को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और सामूहिक ‘समस्त इस्राएल’ का भाव बनाए रखता है।
- source_word: אֶלֶף אֲלָפִים וּמֵאָה אֶלֶף
  choice: 11,00,000
  rationale: हिब्रू संख्या का सही योग आधुनिक भारतीय अंक-विन्यास में स्पष्ट रूप से प्रस्तुत किया गया है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: אִישׁ
  choice: पुरुष
  rationale: यह सैनिक जनगणना का संदर्भ है; पुल्लिंग संज्ञा युद्ध के योग्य पुरुषों को सूचित करती है।
- source_word: שֹׁלֵף חֶרֶב
  choice: तलवार खींचनेवाले
  rationale: शाब्दिक और सजीव सैनिक मुहावरे को बनाए रखता है; इसे सामान्यीकृत ‘हथियार उठानेवाले’ नहीं किया गया।
- source_word: וִיהוּדָה
  choice: और यहूदा में ... थे
  rationale: पहले खंड के समानांतर दूसरी कुल संख्या को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: אַרְבַּע מֵאוֹת וְשִׁבְעִים אֶלֶף
  choice: 4,70,000
  rationale: मूल संख्या को आधुनिक भारतीय अंक-विन्यास में स्पष्ट रूप से प्रस्तुत करता है।
