language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר הַ/מֶּ֤לֶךְ דָּוִיד֙ לְ/אָרְנָ֔ן לֹ֕א כִּֽי קָנֹ֥ה אֶקְנֶ֖ה בְּ/כֶ֣סֶף מָלֵ֑א כִּ֠י לֹא אֶשָּׂ֤א אֲשֶׁר לְ/ךָ֙ לַ/יהוָ֔ה וְ/הַעֲל֥וֹת עוֹלָ֖ה חִנָּֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/024.yaml
  text: But King David said to Ornan[a], “No, for I will surely buy it for the full price in silver, because I will not take for Yahweh what is yours[b], nor offer up a burnt offering for nothing.”
translation:
  language: hi
  text: परन्तु राजा दाऊद ने ओर्नान से कहा, “नहीं, मैं इसे पूरी कीमत चाँदी में चुकाकर ही खरीदूँगा; क्योंकि जो तुम्हारा है, उसे मैं यहोवा के लिए नहीं लूँगा, और न ऐसी होमबलि चढ़ाऊँगा जो मुझे बिना मूल्य मिली हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא כִּי
  choice: नहीं, … क्योंकि
  rationale: यह क्रम पहले दृढ़ अस्वीकार और फिर उसका कारण व्यक्त करता है; हिन्दी में यह स्वाभाविक रहते हुए दोनों तत्वों को सुरक्षित रखता है।
- source_word: קָנֹה אֶקְנֶה
  choice: खरीदूँगा ही
  rationale: धातु के infinitive absolute और finite verb का मेल क्रिया पर जोर देता है; ‘ही’ दाऊद के दृढ़ निश्चय को स्पष्ट करता है।
- source_word: בְּכֶסֶף מָלֵא
  choice: पूरा मूल्य देकर
  rationale: शाब्दिक रूप से बात ‘पूरी चाँदी’ की है, पर प्रसंग में इसका अर्थ बिना किसी कटौती के पूरा दाम चुकाना है।
- source_word: אֶשָּׂא אֲשֶׁר לְךָ
  choice: जो तुम्हारा है उसे … नहीं लूँगा
  rationale: यहाँ נשׂא का अर्थ किसी दूसरे की वस्तु लेना या अपने उपयोग के लिए ग्रहण करना है; स्वामित्व-संबंधी स्रोत संरचना भी बनी रहती है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: बलिदान के लिए किसी वस्तु को ग्रहण करने का भाव है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְהַעֲלוֹת עוֹלָה
  choice: और न … होमबलि चढ़ाऊँगा
  rationale: עלה/עולה की बलिदानी शब्दावली को प्रचलित और विशिष्ट हिन्दी पद ‘होमबलि चढ़ाना’ से व्यक्त किया गया है।
- source_word: חִנָּם
  choice: जो मुझे बिना मूल्य मिली हो
  rationale: इस प्रसंग में חִנָּם का आशय दाऊद द्वारा कोई दाम न चुकाने से है; यह रूप हिन्दी में बलिदान के उसके लिए निःशुल्क होने की बात स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ से नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखा गया है।
- issue: חִנָּם का बलिदान-संबंधी आशय
  choice: ऐसी होमबलि जो दाऊद को बिना मूल्य मिली हो
  alternative: व्यर्थ होमबलि; निष्फल होमबलि
  rationale: यह पद बलिदान के आध्यात्मिक मूल्य या प्रभाव को नहीं, उसके लिए भुगतान न किए जाने को दर्शाता है; इसलिए आर्थिक आशय स्पष्ट रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वाक्य-विन्यास अपनाया गया है। ‘परन्तु’, ‘होमबलि’ और ‘यहोवा’ बाइबलीय प्रसंग की प्रतिष्ठित शैली रखते हैं, जबकि शेष भाषा सामान्य पाठक के लिए सीधी है।
