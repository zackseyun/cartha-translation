  yaml_path: translation/ot/1_chronicles/021/018.yaml
  text: And the angel of Yahweh said to Gad to tell David that David should go up to set up an altar to Yahweh on the threshing floor of Ornan the Jebusite[a][b].
translation:
  language: hi
  text: और यहोवा के दूत ने गाद से कहा कि वह दाऊद से कहे कि दाऊद ऊपर जाकर यबूसी ओर्नान के खलिहान पर यहोवा के लिए एक वेदी स्थापित करे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा का संदेशवाहक।”
    reason: lexical_alternative
  - marker: b
    text: या, “कि दाऊद को ऊपर जाकर यबूसी ओर्नान के खलिहान पर यहोवा के लिए एक वेदी स्थापित करनी चाहिए” अथवा “कि दाऊद ऊपर जाकर यबूसी ओर्नान के खलिहान पर यहोवा के लिए एक वेदी स्थापित करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַלְאַךְ יְהוָה
  choice: तब यहोवा के दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत/संदेशवाहक’ है और प्रसंग में यह स्वर्गीय दूत है; हिन्दी में ‘यहोवा का दूत’ स्वाभाविक और परंपरागत है। आरंभिक וּ को कथात्मक प्रवाह में ‘तब’ से व्यक्त किया गया है।
- source_word: אָמַר אֶל גָּד לֵאמֹר לְדָוִיד
  choice: ने गाद से कहा कि वह दाऊद से कहे
  rationale: दोहराए गए कथन-संबंधी रूपों और गाद की मध्यस्थ भूमिका को स्पष्ट तथा स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כִּי יַעֲלֶה דָוִיד
  choice: कि दाऊद ऊपर जाकर
  rationale: יַעֲלֶה में निर्देशात्मक भाव है; ‘ऊपर जाकर’ עלה की दिशात्मकता को बनाए रखता है और अगले उद्देश्यवाचक पद से स्वाभाविक रूप से जुड़ता है।
- source_word: לְהָקִים מִזְבֵּחַ
  choice: एक वेदी खड़ी करे
  rationale: הקים का अर्थ उठाना/स्थापित करना है; वेदी के साथ ‘खड़ी करे’ हिन्दी में संक्षिप्त और स्रोत-संगत है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद यहाँ समर्पण अथवा संबंध बताता है; ‘के लिए’ हिन्दी में स्वाभाविक है और वेदी के यहोवा को समर्पित होने का भाव देता है।
- source_word: בְּגֹרֶן אָרְנָן הַיְבֻסִי
  choice: यबूसी ओर्नान के खलिहान में
  rationale: גֹרֶן के लिए प्रचलित हिन्दी ‘खलिहान’ और בְּ के लिए स्थानसूचक ‘में’ लिया गया है; gentilic को व्यक्ति के नाम से पहले रखना हिन्दी में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को स्पष्ट रखा गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में अधिक पहचाना जाने वाला रूप है, जबकि ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
- issue: כִּי יַעֲלֶה का निर्देशात्मक बल
  choice: कि दाऊद ऊपर जाकर…खड़ी करे
  alternative: कि दाऊद को ऊपर जाकर…खड़ी करनी चाहिए
  rationale: अप्रत्यक्ष आज्ञा को हिन्दी के विधिलिंग ‘करे’ से व्यक्त किया गया है, बिना उसे केवल सलाह या अनिवार्यता की किसी अधिक कठोर श्रेणी में सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में गाद की मध्यस्थ भूमिका स्पष्ट की गई है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
