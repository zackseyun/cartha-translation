  text: וַ/יֹּ֨אמֶר דָּוִ֤יד אֶל יוֹאָב֙ וְ/אֶל שָׂרֵ֣י הָ/עָ֔ם לְכ֗וּ סִפְרוּ֙ אֶת יִשְׂרָאֵ֔ל מִ/בְּאֵ֥ר שֶׁ֖בַע וְ/עַד דָּ֑ן וְ/הָבִ֣יאוּ אֵלַ֔/י וְ/אֵדְעָ֖ה אֶת מִסְפָּרָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/002.yaml
  text: Then David said to Joab and to the commanders of the people[a], “Go, count Israel from Beersheba to Dan, and bring it to me, so that I may know their number.”
translation:
  language: hi
  text: तब दाऊद ने योआब और प्रजा के सरदारों से कहा, “जाओ, बेर्शेबा से दान तक[a] इस्राएल की गिनती करो और उसकी संख्या मेरे पास लाओ, ताकि मैं उनकी संख्या जान सकूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेर्शेबा से दान तक’ इब्रानी मुहावरा है, जिसका अर्थ इस्राएल के एक छोर से दूसरे छोर तक है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂרֵי הָעָם
  choice: प्रजा के सरदारों
  rationale: שָׂרִים अधिकारी, प्रधान या सैन्य नायक हो सकते हैं। योआब और जनगणना के प्रसंग में ‘सरदारों’ से प्रशासनिक-सैन्य भाव बना रहता है, पर कोई निश्चित पद अनावश्यक रूप से नहीं थोपा जाता।
- source_word: לְכוּ
  choice: जाओ
  rationale: הלך के बहुवचन आज्ञार्थक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: סִפְרוּ
  choice: गिनती करो
  rationale: यहाँ ספר का अर्थ लोगों को गिनना है; ‘गिनती करो’ स्पष्ट है और औपचारिक ‘जनगणना लो’ जैसी व्याख्यात्मक वृद्धि से बचता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में कर्म केवल ‘इस्राएल’ है और वह सामूहिक रूप से देश की प्रजा को सूचित करता है; हिन्दी में भी यह सामूहिक प्रयोग स्वाभाविक है।
- source_word: מִבְּאֵר שֶׁבַע וְעַד דָּן
  choice: बेर्शेबा से दान तक
  rationale: दक्षिण से उत्तर तक पूरे देश की सीमा बताने वाला प्रचलित भौगोलिक मुहावरा; स्थान-नामों का मानक हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְהָבִיאוּ אֵלַי
  choice: और उसका ब्यौरा मेरे पास लाओ
  rationale: इब्रानी में लाए जाने वाली वस्तु स्पष्ट नहीं कही गई है; प्रसंग में वह गिनती से प्राप्त ब्यौरा है। हिन्दी में ‘उसका ब्यौरा’ इस लोप को न्यूनतम और स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: וְאֵדְעָה
  choice: ताकि मैं ... जान सकूँ
  rationale: कोहोर्टेटिव रूप आज्ञाओं के उद्देश्य या इच्छित परिणाम को व्यक्त करता है; ‘ताकि ... जान सकूँ’ इस भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: אֶת מִסְפָּרָם
  choice: उनकी संख्या
  rationale: मूल संज्ञा-पद का सीधा और सहज रूप, जिसमें गिने गए लोगों पर ध्यान बना रहता है।
