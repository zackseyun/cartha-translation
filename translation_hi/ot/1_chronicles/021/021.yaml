  text: וַ/יָּבֹ֥א דָוִ֖יד עַד אָרְנָ֑ן וַ/יַּבֵּ֤ט אָרְנָן֙ וַ/יַּ֣רְא אֶת דָּוִ֔יד וַ/יֵּצֵא֙ מִן הַ/גֹּ֔רֶן וַ/יִּשְׁתַּ֧חוּ לְ/דָוִ֛יד אַפַּ֖יִם אָֽרְצָ/ה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/021.yaml
  text: When David came to Ornan[a], Ornan looked and saw David, and he went out from the threshing floor and bowed down before David with his face to the ground.
translation:
  language: hi
  text: जब दाऊद ओर्नान के पास पहुँचा, तब ओर्नान ने दृष्टि डाली और दाऊद को देखा। वह खलिहान से बाहर निकला और दाऊद के सामने भूमि पर मुँह के बल झुक गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद के सामने दण्डवत् किया।” इब्रानी में पूर्ण रूप से झुकने, मुँह भूमि की ओर करने का वर्णन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִיד עַד אָרְנָן
  choice: दाऊद ओर्नान के पास पहुँचा
  rationale: בוא और עַד यहाँ दाऊद के ओर्नान तक पहुँचने को व्यक्त करते हैं; ‘के पास पहुँचा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וַיַּבֵּט אָרְנָן וַיַּרְא אֶת דָּוִיד
  choice: ओर्नान ने दृष्टि उठाकर दाऊद को देखा
  rationale: नבט दृष्टि लगाने या देखने और ראה देखने को दर्शाता है। हिन्दी में दोनों क्रियाओं का क्रम बनाए रखते हुए यह अभिव्यक्ति स्वाभाविक है; ‘उठाकर’ प्रसंगानुकूल है, यद्यपि स्रोत में ऊपर की दिशा स्पष्ट नहीं है।
- source_word: וַיֵּצֵא מִן הַגֹּרֶן
  choice: वह खलिहान से बाहर निकला
  rationale: יצא מן किसी स्थान से बाहर निकलने को और גֹּרֶן अनाज दाँवने के खुले स्थान, अर्थात खलिहान, को दर्शाता है।
- source_word: וַיִּשְׁתַּחוּ לְדָוִיד
  choice: दाऊद के सामने दण्डवत् किया
  rationale: השתחוה गहरा झुकने या स्वयं को भूमि पर झुकाने की शारीरिक क्रिया है। ‘दण्डवत् किया’ सम्मानसूचक क्रिया को व्यक्त करता है और इसे ईश्वरीय उपासना नहीं ठहराता।
- source_word: אַפַּיִם אָרְצָה
  choice: भूमि पर मुँह के बल
  rationale: शाब्दिक मुहावरे का भाव चेहरा भूमि की ओर करके पूर्ण रूप से झुकना है; हिन्दी में ‘भूमि पर मुँह के बल’ इसकी मुद्रा स्पष्ट करता है।
theological_decisions:
- issue: क्या ओर्नान की क्रिया को दाऊद की उपासना के रूप में व्यक्त किया जाए
  choice: दाऊद के सामने दण्डवत् किया
  alternative: दाऊद की उपासना की
  rationale: השתחוה मनुष्य के सामने सम्मान से झुकने और परमेश्वर की आराधना, दोनों संदर्भों में प्रयुक्त हो सकता है। यहाँ दाऊद मानवीय राजा है, इसलिए शारीरिक सम्मान की क्रिया को रखना उचित है, बिना उसे धार्मिक उपासना ठहराए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक गद्य। ‘खलिहान’ सामान्य पाठक के लिए परिचित कृषि-संबंधी शब्द है। ‘दण्डवत्’ पूर्ण झुकाव की मुद्रा को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
