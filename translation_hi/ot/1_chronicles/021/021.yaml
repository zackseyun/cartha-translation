  naturalness: The revised wording is natural, clear modern standard Hindi while retaining a dignified narrative register. “दृष्टि डाली और दाऊद को देखा” preserves the Hebrew’s two successive seeing verbs without the unsupported ‘upward’ nuance.
  terminology: “खलिहान” appropriately renders גֹּרֶן. “भूमि पर मुँह के बल झुक गया” conveys the bodily act of השתחוה plus אַפַּיִם אַרְצָה without implying that David received divine worship.
  issues:
