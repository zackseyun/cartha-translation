    issue: “दृष्टि उठाकर” adds a directional nuance.
    rationale: The Hebrew says that Ornan looked and saw David, but does not explicitly say that he looked upward. The English audit trail likewise identifies ‘looked up’ only as a contextual possibility, not the chosen rendering.
