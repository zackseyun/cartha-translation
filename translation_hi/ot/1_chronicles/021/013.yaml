reference: 1 Chronicles 21:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר דָּוִ֛יד אֶל גָּ֖ד צַר לִ֣/י מְאֹ֑ד אֶפְּלָה נָּ֣א בְ/יַד יְהוָ֗ה כִּֽי רַבִּ֤ים רַחֲמָי/ו֙ מְאֹ֔ד וּ/בְ/יַד אָדָ֖ם אַל אֶפֹּֽל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/013.yaml
  text: Then David said to Gad[a], “I am in great distress. Please let me fall into the hand of Yahweh, for his mercies are very great; but do not let me fall into the hand of man.”
translation:
  language: hi
  text: तब दाऊद ने गाद से कहा, “मैं बड़े संकट में हूँ। कृपया मैं याहवे के हाथ में पड़ जाऊँ, क्योंकि उसकी करुणा बहुत बड़ी है; पर मैं मनुष्य के हाथ में न पड़ूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צַר לִי מְאֹד
  choice: मैं बड़े संकट में हूँ
  rationale: यह इब्रानी मुहावरा अत्यंत घोर संकट और व्याकुलता व्यक्त करता है; यह हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: אֶפְּלָה נָּא
  choice: कृपया मुझे ... पड़ने दे
  rationale: कोहोर्टेटिव रूप के साथ נָא दाऊद की विनम्र किंतु तीव्र विनती व्यक्त करता है।
- source_word: בְיַד יְהוָה
  choice: यहोवा के हाथ में
  rationale: ‘हाथ में पड़ना’ किसी के अधिकार और न्याय के अधीन होने का बिंब सुरक्षित रखता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: כִּי רַבִּים רַחֲמָיו מְאֹד
  choice: क्योंकि उसकी करुणा बहुत अधिक है
  rationale: רַחֲמִים रूप में बहुवचन होते हुए भी करुणा/दयालुता का सामूहिक भाव दे सकता है; हिंदी में ‘करुणा’ स्वाभाविक है और רַבִּים ... מְאֹד की प्रबलता ‘बहुत अधिक’ से व्यक्त होती है।
- source_word: וּבְיַד אָדָם אַל אֶפֹּל
  choice: पर मुझे मनुष्य के हाथ में न पड़ने दे
  rationale: यह शब्दक्रम यहोवा के हाथ और मानवीय अधिकार के बीच समानांतर विरोध बनाए रखता है; אָדָם का एकवचन प्रतिनिधिक अर्थ ‘मनुष्य’ से सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। आधुनिक हिंदी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को ‘प्रभु’ पदवी में नहीं बदलता।
- issue: רַחֲמָיו के व्याकरणिक बहुवचन का निरूपण
  choice: उसकी करुणा
  alternative: उसकी करुणाएँ
  rationale: इब्रानी बहुवचन दया/करुणा की प्रचुरता या अनेक अभिव्यक्तियों को सूचित कर सकता है। हिंदी में अमूर्त भाववाचक एकवचन अधिक स्वाभाविक है, जबकि ‘बहुत अधिक’ उसकी प्रचुरता बनाए रखता है।
- issue: אָדָם और יְהוָה के अधिकार का विरोध
  choice: मनुष्य के हाथ
  alternative: मनुष्यों के हाथों
  rationale: एकवचन ‘मनुष्य’ मूल की प्रतिनिधिक एकवचनता तथा ‘यहोवा के हाथ’ के साथ साहित्यिक समानांतरता सुरक्षित रखता है; बहुवचन विकल्प अर्थ की व्याख्यात्मक स्पष्टता देता, पर रूपक को कुछ बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘हाथ में पड़ना’ मूल इब्रानी बिंब तथा दोनों विकल्पों के तीखे विरोध को बनाए रखता है।
