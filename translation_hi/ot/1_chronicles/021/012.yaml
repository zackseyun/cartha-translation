source:
  edition: WLC
  text: אִם שָׁל֨וֹשׁ שָׁנִ֜ים רָעָ֗ב וְ/אִם שְׁלֹשָׁ֨ה חֳדָשִׁ֜ים נִסְפֶּ֥ה מִ/פְּנֵי צָרֶי/ךָ֮ וְ/חֶ֣רֶב אוֹיְבֶ֣/ךָ לְ/מַשֶּׂגֶת֒ וְ/אִם שְׁלֹ֣שֶׁת יָ֠מִים חֶ֣רֶב יְהוָ֤ה וְ/דֶ֨בֶר֙ בָּ/אָ֔רֶץ וּ/מַלְאַ֣ךְ יְהוָ֔ה מַשְׁחִ֖ית בְּ/כָל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה רְאֵ֔ה מָֽה אָשִׁ֥יב אֶת שֹׁלְחִ֖/י דָּבָֽר־־־׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/012.yaml
  text: either three years of famine[a], or three months of being swept away before your foes while the sword of your enemies overtakes you, or three days of the sword of Yahweh, even pestilence in the land, with the angel of Yahweh destroying throughout all the territory of Israel[b]. Now consider what answer I should return to the one who sent me.
translation:
  language: hi
  text: या तो तीन वर्ष का अकाल[a], या तीन महीने तक अपने शत्रुओं के सामने से मिटते जाना और तुम्हारे दुश्मनों की तलवार का तुम तक आ पहुँचना, या याहवे की तलवार के तीन दिन—अर्थात देश में महामारी[b]—जब याहवे का स्वर्गदूत इस्राएल के पूरे क्षेत्र में विनाश कर रहा हो। अब विचार करो कि जिसने मुझे भेजा है, उसे मैं क्या उत्तर दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूखमरी।”
    reason: lexical_alternative
  - marker: b
    text: या “मरी”; इब्रानी शब्द न्याय के रूप में आने वाली व्यापक महामारी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָעָב
  choice: अकाल
  rationale: राष्ट्रीय स्तर पर भोजन की भीषण कमी के लिए मानक और स्वाभाविक हिन्दी शब्द।
- source_word: נִסְפֶּה
  choice: मिटते जाना
  rationale: निफ़अल कृदन्त युद्ध में नाश या बरबादी की ओर ले जाए जाने का भाव देता है; यह मृत्यु तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מִפְּנֵי צָרֶיךָ
  choice: अपने शत्रुओं के सामने से
  rationale: सैन्य प्रसंग में शत्रुओं के सामने से भागने या खदेड़े जाने की इब्रानी अभिव्यक्ति को निकटता से रखता है।
- source_word: חֶרֶב אוֹיְבֶיךָ
  choice: तुम्हारे दुश्मनों की तलवार
  rationale: मूल की युद्ध-संबंधी छवि बनाए रखता है और निकटवर्ती 'शत्रुओं' की पुनरावृत्ति से बचता है।
- source_word: לְמַשֶּׂגֶת
  choice: तुम्हें जा पकड़ना
  rationale: पीछा करते हुए किसी तक पहुँचने या उसे धर लेने का सजीव और स्वाभाविक हिन्दी रूप।
- source_word: חֶרֶב יְהוָה
  choice: याहवे की तलवार
  rationale: मूल रूपक तथा शत्रुओं की तलवार के साथ जानबूझकर रखा गया विरोध सुरक्षित रहता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को नाम के रूप में प्रस्तुत करता है।
- source_word: דֶבֶר
  choice: महामारी
  rationale: न्याय के प्रसंग में व्यापक रूप से फैलने वाले घातक रोग का आधुनिक, स्पष्ट हिन्दी समतुल्य।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאַךְ का मूल अर्थ 'दूत' सुरक्षित रखता है और उस व्यक्तित्व की अधिक विशिष्ट धर्मवैज्ञानिक पहचान आरोपित नहीं करता।
- source_word: מַשְׁחִית
  choice: विनाश करता हुआ
  rationale: हिफ़इल कृदन्त की जारी विनाशकारी क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּכָל גְּבוּל יִשְׂרָאֵל
  choice: इस्राएल के पूरे क्षेत्र में
  rationale: यहाँ גְּבוּל केवल सीमा-रेखाओं के बजाय देश के समूचे भूभाग को सूचित करता है।
- source_word: רְאֵה
  choice: विचार करो
  rationale: इस संवाद में आज्ञार्थक क्रिया शारीरिक रूप से देखने के बजाय सोचकर निर्णय करने को कहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; लिप्यंतरण नाम को छिपाने के बजाय सुरक्षित रखता है।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: याहवे का दूत
  alternative: याहवे का स्वर्गदूत
  rationale: '''दूत'' मूल शब्द का व्यापक अर्थ रखता है और यह तय नहीं करता कि यह कोई सृजित स्वर्गदूत है या ईश्वर का कोई विशेष प्राकट्य।'
- issue: דֶבֶר और 'याहवे की तलवार' का संबंध
  choice: अर्थात देश में महामारी
  alternative: और देश में महामारी
  rationale: वाक्य-संरचना महामारी को याहवे की तलवार की व्याख्या या उसका विशिष्ट रूप मानने की संभावना प्रबल करती है; 'अर्थात' उस संबंध को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। त्रिपक्षीय विकल्पों की संरचना, तलवार का रूपक और अंतिम निर्णय-संबंधी आज्ञा सुरक्षित हैं; 'शत्रु/दुश्मन' से मूल के दो निकटार्थी शब्दों का हल्का भेद व्यक्त किया गया है।
