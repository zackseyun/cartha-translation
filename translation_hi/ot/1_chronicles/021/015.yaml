base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/015.yaml
  text: And God sent an angel to Jerusalem to destroy it[a], but as he was destroying it, Yahweh saw and relented concerning the calamity, and he said to the destroying angel, “Enough[b]; now withdraw your hand.” And the angel of Yahweh was standing by the threshing floor of Ornan the Jebusite.
translation:
  language: hi
  text: और परमेश्वर ने यरूशलेम को नष्ट करने के लिए एक स्वर्गदूत भेजा। पर जब वह उसे नष्ट कर रहा था, तब याहवे ने देखा और उस विपत्ति के विषय में अपना मन बदला[a]। उसने नाश करनेवाले स्वर्गदूत से कहा, “बस! अब अपना हाथ रोक ले।” और याहवे का दूत यबूसी ओर्नान के खलिहान के पास खड़ा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अपना मन बदला”—इब्रानी क्रिया यहाँ विनाशकारी विपत्ति को आगे न बढ़ाने के लिए मन बदलने या उससे विरत होने को व्यक्त करती है; इसका अर्थ आवश्यक रूप से किसी नैतिक भूल को स्वीकार करना नहीं है।
    reason: इब्रानी נחם के इस संदर्भगत अर्थ-क्षेत्र को स्पष्ट करता है, बिना ईश्वर की कथात्मक प्रतिक्रिया के तनाव को मिटाए।
lexical_decisions:
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: निश्चित उपपद और एकवचन क्रियात्मक संदर्भ इसे इस्राएल के परमेश्वर के लिए प्रयुक्त पद ठहराते हैं; आधुनिक हिन्दी में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: מַלְאָךְ
  choice: स्वर्गदूत
  rationale: यहाँ परमेश्वर द्वारा भेजा गया अलौकिक दूत अभिप्रेत है; ‘स्वर्गदूत’ सामान्य हिन्दी पाठक के लिए ‘दूत’ की अपेक्षा संदर्भ को अधिक स्पष्ट करता है।
- source_word: לְהַשְׁחִיתָהּ / וּכְהַשְׁחִית
  choice: उसे नष्ट करने के लिए / जब वह उसे नष्ट कर ही रहा था
  rationale: पहला पद उद्देश्य और दूसरा चल रही, बीच में रोकी गई विनाशकारी कार्रवाई व्यक्त करता है। ‘कर ही रहा था’ इस प्रगतिशील और बाधित कार्रवाई को स्वाभाविक हिन्दी में दिखाता है।
- source_word: וַיִּנָּחֶם עַל הָרָעָה
  choice: उस विपत्ति के विषय में पछताया
  rationale: נחם की कथात्मक, मानवीय भाव-सदृश अभिव्यक्ति को दबाए बिना ‘पछताया’ उसका सीधा अर्थ रखता है; רָעָה यहाँ नैतिक बुराई नहीं, विनाशकारी विपत्ति है।
- source_word: הַמַּלְאָךְ הַמַּשְׁחִית
  choice: नाश करनेवाला स्वर्गदूत
  rationale: कृदन्त की सक्रिय शक्ति और संज्ञा के विशेषणात्मक संबंध, दोनों को स्पष्ट व सहज हिन्दी में सुरक्षित रखता है।
- source_word: רַב
  choice: बस!
  rationale: यह पर्याप्तता अथवा रुकने की संक्षिप्त उद्गारात्मक आज्ञा है; ‘बस!’ आधुनिक हिन्दी में सीधा और प्रभावशाली है।
- source_word: הֶרֶף יָדֶךָ
  choice: अपना हाथ रोक ले
  rationale: इब्रानी मुहावरे का आशय हाथ से की जा रही कार्रवाई बंद करना है; यह हिन्दी में स्वाभाविक है और मूल बिंब भी बनाए रखता है।
- source_word: גֹּרֶן
  choice: खलिहान
  rationale: यह अनाज दाँवने की जगह को सूचित करता है; हिन्दी बाइबलीय और ग्रामीण संदर्भ में ‘खलिहान’ परिचित तथा संक्षिप्त है।
- source_word: אָרְנָן הַיְבוּסִי
  choice: यबूसी ओर्नान
  rationale: जातिसूचक विशेषण को नाम से पहले रखना हिन्दी में स्वाभाविक है और व्यक्ति की पहचान अक्षुण्ण रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को सामान्य पदवी ‘प्रभु’ से प्रतिस्थापित न करके नाम के रूप में रखा गया है। ‘यहोवा’ हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: וַיִּנָּחֶם की ईश्वर-विषयक मानवीय भाव-सदृश भाषा
  choice: पछताया
  alternative: विपत्ति को आगे न बढ़ाने का निश्चय किया / विपत्ति के विषय में मन फिराया
  rationale: मूल पाठ ईश्वर की वास्तविक कथात्मक प्रतिक्रिया को נחם से व्यक्त करता है। ‘पछताया’ तनाव को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि इससे नैतिक गलती मान लेना आवश्यक नहीं।
- issue: מַלְאַךְ יְהוָה की पहचान
  choice: यहोवा का दूत
  alternative: यहोवा स्वयं स्वर्गदूत के रूप में / यहोवा का सृजा हुआ स्वर्गदूत
  rationale: पदबंध का सीधा अनुवाद किया गया है, बिना इस व्यक्ति की तात्त्विक पहचान पर कोई अतिरिक्त धर्मसैद्धांतिक निष्कर्ष थोपे।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। कथा की गति के लिए छोटे, स्पष्ट वाक्य रखे गए हैं। ‘कर ही रहा था’ चल रहे विनाश के रुकने को उभारता है। ईश्वरीय नाम को ‘यहोवा’ और מַלְאַךְ יְהוָה को निरपेक्ष रूप से ‘यहोवा का दूत’ रखा गया है।
