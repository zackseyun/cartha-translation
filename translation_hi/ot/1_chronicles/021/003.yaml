source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יוֹאָ֗ב יוֹסֵף֩ יְהוָ֨ה עַל עַמּ֤/וֹ כָּ/הֵם֙ מֵאָ֣ה פְעָמִ֔ים הֲ/לֹא֙ אֲדֹנִ֣/י הַ/מֶּ֔לֶךְ כֻּלָּ֥/ם לַ/אדֹנִ֖/י לַ/עֲבָדִ֑ים לָ֣/מָּה יְבַקֵּ֥שׁ זֹאת֙ אֲדֹנִ֔/י לָ֛/מָּה יִהְיֶ֥ה לְ/אַשְׁמָ֖ה לְ/יִשְׂרָאֵֽל־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/021/003.yaml
  text: But Joab said[a], “May Yahweh add to his people a hundred times as many as they are! Are they not all, my lord the king[c][b], servants of my lord? Why does my lord seek this? Why should it become guilt for Israel?”
translation:
  language: hi
  text: परन्तु योआब ने कहा, “याहवे अपनी प्रजा को उनकी वर्तमान संख्या से सौ गुना बढ़ाए! हे मेरे प्रभु राजा, क्या वे सब मेरे प्रभु के सेवक नहीं हैं? मेरे प्रभु यह क्यों चाहते हैं? यह इस्राएल के लिए दोष का कारण क्यों बने?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह इस्राएल पर दोष क्यों लाए?”
    reason: मूल हिब्रू इस बात को संक्षेप में कहता है कि इस कार्य से इस्राएल दोषी या दंड का भागी हो सकता है।
lexical_decisions:
- source_word: יוֹסֵף
  choice: बढ़ाए
  rationale: हिब्रू का इच्छासूचक रूप योआब की प्रार्थना या कामना व्यक्त करता है; हिंदी में ‘बढ़ाए’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामाटन है; उसका लिप्यंतरण ‘याहवे’ किया गया है।
- source_word: עַל עַמּוֹ כָּהֵם מֵאָה פְעָמִים
  choice: अपनी प्रजा को जितनी वह अब है उससे सौ गुना
  rationale: यह मुहावरा वर्तमान संख्या की तुलना में सौ गुना वृद्धि बताता है; यह हिंदी रूप अर्थ को स्पष्ट और स्वाभाविक रखता है।
- source_word: הֲלֹא
  choice: क्या ... नहीं हैं?
  rationale: यह सहमति की अपेक्षा करने वाला नकारात्मक आलंकारिक प्रश्न है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे स्वामी राजा
  rationale: यह राजा के लिए आदरसूचक दरबारी संबोधन है।
- source_word: כֻּלָּם לַאדֹנִי לַעֲבָדִים
  choice: वे सभी मेरे स्वामी के सेवक
  rationale: संदर्भ में राजनीतिक अधीनता और राजकीय सेवा प्रमुख है; ‘सेवक’ इस भाव को ‘दास’ की तुलना में अधिक उपयुक्त ढंग से व्यक्त करता है।
- source_word: יְבַקֵּשׁ זֹאת
  choice: यह क्यों चाहते हैं
  rationale: בקש यहाँ जनगणना कराने की इच्छा या प्रयत्न को दर्शाता है; ‘चाहते हैं’ सहज हिंदी है, जबकि ‘ढूँढ़ते हैं’ इस संदर्भ में भ्रामक होता।
- source_word: לְאַשְׁמָה
  choice: दोष का कारण
  rationale: यहाँ संज्ञा बलिदान नहीं, बल्कि दोष या दंडनीय उत्तरदायित्व को दर्शाती है; ‘दोष का कारण’ परिणामकारी भाव स्पष्ट करता है।
- source_word: יִהְיֶה לְאַשְׁמָה לְיִשְׂרָאֵל
  choice: यह इस्राएल के लिए दोष का कारण क्यों बने?
  rationale: रचना इस कार्य से इस्राएल पर आने वाले दोष या दायित्व को व्यक्त करती है और मूल की कारणात्मक अस्पष्टता बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में उपाधि नहीं, व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे लिप्यंतरित करता है।
- issue: राजा के संबंध में עֲבָדִים
  choice: सेवक
  alternative: दास
  rationale: शब्द दोनों अर्थ धारण कर सकता है, पर यहाँ राजकीय अधीनता प्रमुख है; ‘सेवक’ संदर्भ के अनुकूल है।
- issue: לְאַשְׁמָה का आशय
  choice: दोष का कारण
  alternative: दोष / दोषबलि
  rationale: यहाँ बलिदान का उल्लेख नहीं है। वाक्य इस कार्य के कारण इस्राएल के दोषी या दायित्वग्रस्त होने की बात करता है।
translation_notes:
  register: आधुनिक मानक हिंदी में आदरपूर्ण, सहज और गरिमामय शैली रखी गई है। राजा के लिए बहुवचन आदरसूचक क्रिया का प्रयोग हुआ है। ‘परन्तु’ और ‘हे मेरे स्वामी राजा’ बाइबलीय कथन की गरिमा रखते हैं, जबकि शेष वाक्य सामान्य पाठक के लिए स्पष्ट है।
