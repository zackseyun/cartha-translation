  yaml_path: translation/ot/1_chronicles/023/006.yaml
  text: 'David divided them into divisions for the sons of Levi: Gershon[a], Kohath, and Merari.'
translation:
  language: hi
  text: दाऊद ने उन्हें लेवी के पुत्रों के लिए दलों में बाँट दिया—गेर्शोन, कहात और मरारी के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחָלְקֵם
  choice: उन्हें ... बाँट दिया
  rationale: पिएल रूप में חלק का अर्थ बाँटना या विभाजित करना है। 3 पुरुष बहुवचन कर्म-प्रत्यय को स्पष्ट रखने के लिए ‘उन्हें’ रखा गया है।
- source_word: מַחְלְקוֹת
  choice: दलों में
  rationale: यह संज्ञा व्यवस्थित विभागों या दलों को दर्शाती है। ‘दलों में’ आधुनिक हिन्दी में स्वाभाविक है और क्रिया के परिणाम को व्यक्त करता है।
- source_word: לִבְנֵי לֵוִי
  choice: लेवी के पुत्रों के अनुसार
  rationale: मूल का शाब्दिक रूप ‘लेवी के पुत्रों के लिए’ है, पर यहाँ आगे दिए गए तीन वंश-मुखियों के आधार पर विभाजन का भाव है। ‘के अनुसार’ उस संबंध को सहज हिन्दी में व्यक्त करता है, बिना ‘लेवियों’ कहकर वंशावली की अभिव्यक्ति मिटाए।
- source_word: לְגֵרְשׁוֹן קְהָת וּמְרָרִי
  choice: गेर्शोन, कहात और मरारी
  rationale: ये लेवी के तीन पुत्रों तथा उनसे निकले प्रमुख कुलों के नाम हैं। पहले नाम पर लगे לְ־ को पूर्ववर्ती संबंध के अंतर्गत समझते हुए सूची को स्वाभाविक रूप से रखा गया है।
