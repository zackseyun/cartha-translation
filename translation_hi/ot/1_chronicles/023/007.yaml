lexical_decisions:
- source_word: לַגֵּרְשֻׁנִּי
  choice: गेर्शोनियों में से
  rationale: उपसर्ग ל यहाँ लेवियों की सूची में एक उपसमूह या श्रेणी प्रस्तुत करता है। हिन्दी में ‘गेर्शोनियों में से’ इस वंशगत सूची के शीर्षक-सदृश प्रयोग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַעְדָּן
  choice: लादान
  rationale: यह व्यक्ति का नाम है, इसलिए इसका अनुवाद नहीं बल्कि देवनागरी लिप्यंतरण किया गया है। स्वर-रूप के अनुसार ‘लादान’ रखा गया है।
- source_word: וְשִׁמְעִי
  choice: और शिमी
  rationale: וְ का अर्थ ‘और’ है, जो सूची के दूसरे नाम को जोड़ता है; שִׁמְעִי का देवनागरी लिप्यंतरण ‘शिमी’ है।
