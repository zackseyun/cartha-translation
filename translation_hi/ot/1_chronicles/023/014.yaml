source:
  edition: WLC
  text: וּ/מֹשֶׁ֖ה אִ֣ישׁ הָ/אֱלֹהִ֑ים בָּנָ֕י/ו יִקָּרְא֖וּ עַל שֵׁ֥בֶט הַ/לֵּוִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/014.yaml
  text: And as for Moses, the man of God, his sons were counted among the tribe of Levi.
translation:
  language: hi
  text: और परमेश्वर के जन मूसा के पुत्र लेवी के गोत्र में गिने गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन
  rationale: यह प्रतिष्ठित इब्रानी उपाधि का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; यहाँ אִישׁ का आशय केवल जैविक पुरुष बताना नहीं, बल्कि परमेश्वर से विशेष संबंध रखने वाले व्यक्ति की पहचान कराना है।
- source_word: יִקָּרְאוּ
  choice: गिने गए
  rationale: शाब्दिक अर्थ ‘कहलाए गए’ हो सकता है, पर עַל שֵׁבֶט के साथ वंशावली-संदर्भ में आशय किसी गोत्र में दर्ज या सम्मिलित माने जाने का है; ‘गिने गए’ इस अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל שֵׁבֶט הַלֵּוִי
  choice: लेवी के गोत्र में
  rationale: इब्रानी עַל यहाँ संबद्धता अथवा गणना का भाव देता है; हिन्दी में ‘गोत्र में’ स्वाभाविक रूप से बताता है कि वे लेवी की गोत्रीय गणना में सम्मिलित थे।
theological_decisions:
- issue: मूसा की विशिष्ट उपाधि और उनके पुत्रों की गोत्रीय स्थिति
  choice: ‘परमेश्वर के जन’ उपाधि को सुरक्षित रखते हुए पुत्रों को लेवी के गोत्र में ‘गिने गए’ कहा गया है।
  alternative: ‘परमेश्वर का पुरुष’; ‘लेवी के गोत्र के कहलाए गए’
  rationale: चुना हुआ पाठ मूसा की सम्मानसूचक बाइबलीय उपाधि तथा उनके पुत्रों की लेवी-गोत्र में वंशावलीगत गणना—दोनों को बिना अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़े स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और वंशावली-संदर्भ के अनुरूप। वाक्य में कोई पादटिप्पणी आवश्यक नहीं मानी गई।
