  text: וְ/שָׁמְר֞וּ אֶת מִשְׁמֶ֣רֶת אֹֽהֶל מוֹעֵ֗ד וְ/אֵת֙ מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וּ/מִשְׁמֶ֕רֶת בְּנֵ֥י אַהֲרֹ֖ן אֲחֵי/הֶ֑ם לַ/עֲבֹדַ֖ת בֵּ֥ית יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/032.yaml
  text: And they were to keep charge of the tent of meeting[a], the charge of the holy place, and the charge of the sons of Aaron their brothers, for the service of the house of Yahweh.
translation:
  language: hi
  text: उन्हें मिलापवाले तम्बू की देखरेख का दायित्व, पवित्रस्थान[a] की देखरेख का दायित्व, और अपने भाइयों—हारून के पुत्रों—से संबंधित दायित्व निभाना था, याहवे के भवन की सेवा के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र परिसर।” इब्रानी शब्द यहाँ पवित्रस्थान या अधिक व्यापक पवित्र क्षेत्र को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: उन्हें ... दायित्व निभाना था
  rationale: שׁמר का मूल भाव रखवाली करना, ध्यान रखना या सौंपा हुआ दायित्व निभाना है। यहाँ लेवियों के नियत कर्तव्यों का सार दिया गया है, इसलिए हिंदी में नियत उत्तरदायित्व का भाव व्यक्त किया गया है।
- source_word: מִשְׁמֶרֶת
  choice: देखरेख का दायित्व / दायित्व
  rationale: यह संज्ञा रखवाली, देखरेख और सौंपे गए उत्तरदायित्व को दर्शाती है। स्थानों के साथ 'देखरेख का दायित्व' स्वाभाविक है, जबकि हारून के पुत्रों के प्रति संबंध में केवल 'दायित्व' अधिक स्पष्ट है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह पदबंध उस पवित्र तम्बू का पारदर्शी और हिंदी बाइबलीय प्रयोग में परिचित नाम है जहाँ परमेश्वर अपने लोगों से मिलता था।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: उपासना-संबंधी संदर्भ में यह पवित्र क्षेत्र, पवित्रस्थान अथवा व्यापक रूप से पवित्र परिसर को सूचित कर सकता है। मुख्य पाठ में संक्षिप्त और स्वाभाविक 'पवित्रस्थान' रखा गया है।
- source_word: בְּנֵי אַהֲרֹן אֲחֵיהֶם
  choice: अपने भाइयों—हारून के पुत्रों—के प्रति
  rationale: यह वाक्यांश हारून के पुत्रों को लेवियों के भाई बताता है। विराम-चिह्न द्वारा दोनों पदों का संबंध स्पष्ट किया गया है और 'पुत्रों' की पारिवारिक तथा याजकीय भाषा सुरक्षित रखी गई है।
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: ताकि याहवे के भवन की सेवा होती रहे
  rationale: עֲבֹדָה यहाँ पवित्र सेवा या कार्य को दर्शाता है। उद्देश्य/परिणाम का भाव हिंदी में 'ताकि' से स्वाभाविक रूप में व्यक्त किया गया है; בֵּית का शाब्दिक भाव 'भवन' में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; इसे उपाधि से बदलने के बजाय देवनागरी में नाम के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: हारून के पुत्रों के संबंध में מִשְׁמֶרֶת का अर्थ
  choice: उनके प्रति सौंपा गया दायित्व
  alternative: हारून के पुत्रों की रखवाली अथवा उनका अपना दायित्व
  rationale: इब्रानी संबंधसूचक रचना संक्षिप्त है और संबंध की सटीक प्रकृति को पूरी तरह नहीं खोलती। अनुवाद सामान्य उत्तरदायित्व का भाव रखता है और किसी विशिष्ट याजकीय व्यवस्था को अनावश्यक रूप से आरोपित नहीं करता।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम सीधे प्रयुक्त हुआ है। 'याहवे' नाम को नाम के रूप में सुरक्षित रखता है, जबकि 'प्रभु' उसे उपाधि में बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। इब्रानी में מִשְׁמֶרֶת की तीन बार पुनरावृत्ति का औपचारिक प्रभाव हिंदी में 'दायित्व' की पुनरावृत्ति से यथासंभव सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ का पादटिप्पणी-चिह्न अर्थ की दृष्टि से הַקֹּדֶשׁ पर अधिक उपयुक्त है, इसलिए उसे 'पवित्रस्थान' के बाद रखा गया है।
