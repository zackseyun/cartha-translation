base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/001.yaml
  text: David was old and full of days[a], and he made his son Solomon king over Israel.
translation:
  language: hi
  text: दाऊद वृद्ध और दीर्घायु था[a], और उसने अपने पुत्र सुलैमान को इस्राएल पर राजा बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अधिक आयु का’; शाब्दिक अर्थ, ‘वृद्ध और दिनों से परिपूर्ण।’
    reason: हिब्रू मुहावरे שָׂבַע יָמִים का सहज अर्थ ‘दीर्घायु’ है; पाद-टिप्पणी उसका शाब्दिक रूप और निकटवर्ती वैकल्पिक अर्थ देती है।
lexical_decisions:
- source_word: זָקֵן
  choice: बूढ़ा ... हो गया था
  rationale: यह दाऊद की वृद्धावस्था बताता है। हिन्दी में ‘बूढ़ा हो गया था’ कथात्मक संदर्भ में स्वाभाविक है और हिब्रू अवस्था-वर्णन का अर्थ बनाए रखता है।
- source_word: וְשָׂבַע יָמִים
  choice: और बहुत दिनों का हो गया था
  rationale: शाब्दिक मुहावरा ‘दिनों से भरपूर’ है, जिसका आशय बहुत आयु हो जाना है। मुख्य पाठ में सहज हिन्दी रखी गई है, जबकि शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וַיַּמְלֵךְ
  choice: राजा बनाया
  rationale: 'हिफ़ील रूप का कारक भाव है: दाऊद ने सुलैमान को राजकीय पद पर स्थापित किया। ‘राजा बनाया’ समारोह या रीति का अतिरिक्त अर्थ जोड़े बिना इसे स्पष्ट करता है।'
- source_word: אֶת שְׁלֹמֹה בְנוֹ
  choice: अपने पुत्र सुलैमान को
  rationale: यह स्वाभाविक, गरिमापूर्ण हिन्दी है और सुलैमान के पुत्र होने की स्पष्ट पहचान सुरक्षित रखती है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: राजत्व के संदर्भ में עַל शासन के क्षेत्र या प्रजा को सूचित करता है। ‘इस्राएल पर’ सीधा अनुवाद है; मूल में न होने के कारण ‘समस्त’ नहीं जोड़ा गया।
