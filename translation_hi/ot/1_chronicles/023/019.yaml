- source_word: אֲמַרְיָה הַשֵּׁנִי
  choice: अमर्याह दूसरा
  rationale: नाम का हिन्दी लिप्यंतरण और क्रमसूचक विशेषण का सीधा अनुवाद।
- source_word: יַחֲזִיאֵל הַשְּׁלִישִׁי
  choice: यहजीएल तीसरा
  rationale: नाम का हिन्दी लिप्यंतरण और क्रमसूचक विशेषण का सीधा अनुवाद।
- source_word: וִיקַמְעָם הָרְבִיעִי
  choice: और यकमाम चौथा
  rationale: संयोजक, व्यक्तिगत नाम और क्रमसूचक विशेषण को सीधे व्यक्त किया गया है।
theological_decisions:
- issue: הָרֹאשׁ का अर्थ पद-सूचक है या क्रम-सूचक
  choice: मुख्य पाठ में ‘प्रधान’ रखा गया और पादटिप्पणी में ‘पहला’ बताया गया।
  alternative: ‘पहला’
  rationale: आगामी ‘दूसरा, तीसरा, चौथा’ क्रमसूचक अर्थ का समर्थन करते हैं, पर मूल में सामान्य क्रमसूचक רִאשׁוֹן के बजाय רֹאשׁ है। इसलिए पाठ की वास्तविक शब्दगत तनातनी को बनाए रखना उचित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। नामों के लिए हिन्दी बाइबल परंपरा के परिचित रूप चुने गए हैं और הָרֹאשׁ की अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
