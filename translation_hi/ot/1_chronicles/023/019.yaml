  text: 'The sons of Hebron: Jeriah the first[a], Amariah the second, Jahaziel the third, and Jekameam the fourth.'
translation:
  language: hi
  text: 'हेब्रोन के पुत्र: यरीयाह पहला[a], अमर्याह दूसरा, यहजीएल तीसरा, और यकमाम चौथा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “मुख्य” या “सिर”; यहाँ “दूसरा,” “तीसरा,” और “चौथा” के समानांतर इसका अर्थ “पहला” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי חֶבְרוֹן
  choice: हेब्रोन के पुत्र
  rationale: यह रचना-संबंधी बहुवचन वंशावली की सूची आरम्भ करता है। यहाँ ‘पुत्र’ मूल के निकट और संदर्भानुकूल है।
- source_word: יְרִיָּהוּ
  choice: यरिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הָרֹאשׁ
