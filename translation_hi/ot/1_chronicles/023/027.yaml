  text: For by the last words of David[a], the sons of Levi were numbered from twenty years old and upward.
translation:
  language: hi
  text: क्योंकि दाऊद के अंतिम वचनों के अनुसार, बीस वर्ष और उससे अधिक आयु के लेवी के वंशज गिने गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּדִבְרֵי דָוִיד הָאַחֲרֹנִים
  choice: दाऊद के अंतिम निर्देशों के अनुसार
  rationale: ב यहाँ आधार या मानक का भाव दे सकता है। संदर्भ में ‘बातों’ की अपेक्षा ‘निर्देशों’ से दाऊद के अंतिम आदेश का आशय अधिक स्पष्ट होता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: הֵמָּה מִסְפַּר
  choice: गिनती ... की गई थी
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ हद तक लुप्तपदीय है; प्रसंग में इसका अर्थ लेवियों को गणना में सम्मिलित किया जाना है।
- source_word: בְּנֵי לֵוִי
  choice: लेवी के वंशजों
  rationale: वंश-संबंधी इब्रानी अभिव्यक्ति का स्वाभाविक आधुनिक हिन्दी रूप; यहाँ पूरे लेवी समुदाय का संकेत है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וּלְמָעְלָה
  choice: बीस वर्ष और उससे अधिक आयु वालों में
  rationale: मानक इब्रानी आयु-सूत्र को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
