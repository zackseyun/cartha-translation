revisions:
- from: क्योंकि दाऊद के अंतिम निर्देशों[a] के अनुसार लेवी के वंशजों की गिनती बीस वर्ष और उससे अधिक आयु वालों में की गई थी।
  to: क्योंकि दाऊद के अंतिम वचनों के अनुसार, बीस वर्ष और उससे अधिक आयु के लेवी के वंशज गिने गए थे।
  rationale: The revision retains the explanatory force of כִּי, represents the Hebrew prepositional phrase naturally as “के अनुसार,” avoids narrowing “words” to “instructions” in the main text, and directly states that the Levi descendants aged twenty and above were counted. The note preserves the contextual possibility of a final directive.
  reviewer_model: gpt-5.6-terra
