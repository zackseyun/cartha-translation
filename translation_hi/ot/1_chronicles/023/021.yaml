  text: 'मरारी के पुत्र: महली और मूशी। महली के पुत्र: एलिआज़ार और कीश।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधसूचक बहुवचन रूप है और वंशावली की सूची प्रस्तुत करता है। यहाँ प्रत्यक्ष जैविक पुत्रों के नाम दिए गए हैं, इसलिए ‘के पुत्र’ स्वाभाविक और सटीक है।
- source_word: מְרָרִי
  choice: मरारी
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार प्रस्तुत किया गया है।
- source_word: מַחְלִי
  choice: महली
  rationale: व्यक्तिवाचक नाम का लिप्यंतरण; पद में दोनों स्थानों पर एक ही रूप रखा गया है।
- source_word: וּמוּשִׁי
  choice: और मूशी
  rationale: संयोजक וּ को ‘और’ तथा व्यक्तिवाचक नाम को ‘मूशी’ के रूप में प्रस्तुत किया गया है।
- source_word: בְּנֵי מַחְלִי
  choice: महली के पुत्र
  rationale: दूसरे वंशावली-शीर्षक में इब्रानी संरचना को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: אֶלְעָזָר
  choice: एलिआज़र
  rationale: व्यक्तिवाचक नाम का ऐसा लिप्यंतरण जो इब्रानी उच्चारण के निकट है और हिन्दी पाठक के लिए पठनीय है।
- source_word: וְקִישׁ
  choice: और कीश
  rationale: संयोजक וְ को ‘और’ तथा नाम को ‘कीश’ के रूप में लिप्यंतरित किया गया है।
