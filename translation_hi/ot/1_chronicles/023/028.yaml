  text: כִּ֣י מַעֲמָדָ֞/ם לְ/יַד בְּנֵ֣י אַהֲרֹ֗ן לַ/עֲבֹדַת֙ בֵּ֣ית יְהוָ֔ה עַל הַ/חֲצֵרוֹת֙ וְ/עַל הַ/לְּשָׁכ֔וֹת וְ/עַֽל טָהֳרַ֖ת לְ/כָל קֹ֑דֶשׁ וּ/מַֽעֲשֵׂ֔ה עֲבֹדַ֖ת בֵּ֥ית הָ/אֱלֹהִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/028.yaml
  text: For their duty was to assist the sons of Aaron in the service of the house of Yahweh, concerning the courts and the chambers, and the purification of all that is holy, and the work of the service of the house of God.
translation:
  language: hi
  text: क्योंकि उनका दायित्व[a] यह था कि वे याहवे के भवन की सेवा में हारून के पुत्रों की सहायता[b] करें—आँगनों और कोठरियों के संबंध में, हर पवित्र वस्तु के शुद्धीकरण[c] में, और परमेश्वर के भवन की सेवा के काम में।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका स्थान” अथवा “उनका पद।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हारून के पुत्रों के हाथ के पास”; अर्थात उनके साथ रहकर उनकी सहायता करना।
    reason: lexical_alternative
  - marker: c
    text: या “जो कुछ पवित्र है उसकी शुद्धि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण अथवा स्पष्टीकरण देता है; इसलिए आधुनिक हिन्दी में “क्योंकि” उपयुक्त है।
- source_word: מַעֲמָדָם
  choice: उनका नियुक्त दायित्व
  rationale: शब्द नियुक्त स्थान, पद या सेवा-भूमिका को सूचित करता है। प्रसंग में “नियुक्त दायित्व” उसके कार्यात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: לְיַד בְּנֵי אַהֲרֹן
  choice: हारून के पुत्रों की सहायता करें
  rationale: मुहावरे का शाब्दिक अर्थ “हारून के पुत्रों के हाथ के पास” है। यहाँ यह उनके साथ सहायक रूप में सेवा करने को दर्शाता है, बिना उससे अधिक कठोर अधिकार-संबंध निर्धारित किए।
- source_word: לַעֲבֹדַת בֵּית יְהוָה
  choice: याहवे के भवन की सेवा में
  rationale: עֲבֹדָה मंदिर-संबंधी सेवा को और בֵּית יְהוָה मंदिर को “याहवे का भवन” कहता है।
- source_word: עַל הַחֲצֵרוֹת וְעַל הַלְּשָׁכוֹת
  choice: आँगनों और कोठरियों से संबंधित कामों में
  rationale: עַל यहाँ केवल स्थान नहीं, बल्कि सेवा के क्षेत्र या ज़िम्मेदारी को सूचित करता है। “से संबंधित कामों में” इस संबंध को स्पष्ट किंतु अनावश्यक रूप से विशिष्ट किए बिना व्यक्त करता है।
- source_word: וְעַל טָהֳרַת לְכָל קֹדֶשׁ
  choice: हर पवित्र वस्तु के शुद्धीकरण में
  rationale: यह वाक्यांश पवित्र वस्तुओं से संबंधित शुद्धि की बात करता है। सामूहिक एकवचन קֹדֶשׁ को “हर पवित्र वस्तु” के रूप में प्रस्तुत किया गया है और वैकल्पिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: וּמַעֲשֵׂה עֲבֹדַת בֵּית הָאֱלֹהִים
  choice: और परमेश्वर के भवन के सेवा-कार्य में
  rationale: “सेवा-कार्य” מַעֲשֵׂה और עֲבֹדַת दोनों का भाव संक्षिप्त, स्वाभाविक हिन्दी में रखता है; “परमेश्वर का भवन” मूल में प्रयुक्त אֱלֹהִים को अलग रूप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-नाम सीधे आया है। “याहवे” उसे उपाधि में बदले बिना नाम के रूप में प्रस्तुत करता है।
- issue: לְיַד में लेवियों और हारूनी याजकों का संबंध
  choice: हारून के पुत्रों की सहायता करें
  alternative: हारून के पुत्रों के पास रहें; हारून के पुत्रों के अधीन रहें
  rationale: मुहावरा निकट रहकर सहायक सेवा करने का संकेत देता है। “अधीन” संभावित पदानुक्रम को मूल की अपेक्षा अधिक स्पष्ट कर सकता है, इसलिए उसे मुख्य पाठ में नहीं अपनाया गया।
- issue: קֹדֶשׁ का सामूहिक आशय
  choice: हर पवित्र वस्तु
  alternative: जो कुछ पवित्र है; हर पवित्र चीज़
  rationale: सामूहिक एकवचन का दायरा खुला रखा गया है और किसी विशेष प्रकार की मंदिर-वस्तु को अनावश्यक रूप से नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। मंदिर-संबंधी शब्दावली के लिए “भवन,” “सेवा,” “आँगन,” “कोठरी” और “शुद्धीकरण” चुने गए हैं। मूल की प्रशासनिक सूची को डैश और समानांतर पदबंधों से पठनीय बनाया गया है।
