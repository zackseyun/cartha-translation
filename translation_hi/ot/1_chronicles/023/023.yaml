  text: 'मूशी के पुत्र: महली, एदेर और यरेमोत—तीन।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह ‘पुत्र’ का संबंधसूचक बहुवचन रूप है और वंशावली की सूची आरम्भ करता है; यहाँ तीन व्यक्तियों के सीधे नाम दिए गए हैं, इसलिए ‘वंशज’ की अपेक्षा ‘पुत्र’ अधिक सटीक है।
- source_word: מוּשִׁי
  choice: मूशी
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: מַחְלִי
  choice: महली
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: וְעֵדֶר
  choice: और एदेर
  rationale: संयोजक וְ को ‘और’ तथा व्यक्तिवाचक नाम को ‘एदेर’ के रूप में प्रस्तुत किया गया है।
- source_word: וִירֵמוֹת
  choice: और यरेमोत
  rationale: संयोजक सहित व्यक्तिवाचक नाम का मूल हिब्रू रूप के निकट देवनागरी लिप्यंतरण; अंग्रेज़ी वर्तनी-परंपराओं पर आधारित भेद को हिंदी पाठ में लाना आवश्यक नहीं है।
- source_word: שְׁלֹשָׁה
  choice: तीन
  rationale: यह सूची में आए पुत्रों की कुल संख्या बताने वाला पुल्लिंग संख्यावाचक शब्द है; डैश सूची और उसके सारांश का संबंध स्पष्ट करता है।
