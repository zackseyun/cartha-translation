source:
  edition: WLC
  text: כִּ֚י אָמַ֣ר דָּוִ֔יד הֵנִ֛יחַ יְהוָ֥ה אֱלֹהֵֽי יִשְׂרָאֵ֖ל לְ/עַמּ֑/וֹ וַ/יִּשְׁכֹּ֥ן בִּ/ירוּשָׁלִַ֖ם עַד לְ/עוֹלָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/025.yaml
  text: For David said[a], “Yahweh, the God of Israel, has given rest to his people, and he has dwelt in Jerusalem forever.”
translation:
  language: hi
  text: क्योंकि दाऊद ने कहा था, “याहवे, इस्राएल के परमेश्वर, ने अपनी प्रजा को विश्राम दिया है और वह यरूशलेम में सदा वास करता है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह यरूशलेम में सदा वास करेगा।” इब्रानी क्रिया को याहवे के वहाँ स्थिर और निरंतर वास के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निर्देश का कारण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָמַר דָּוִיד
  choice: दाऊद ने कहा था
  rationale: यह कथन पिछले निर्देश की पृष्ठभूमि और आधार बताता है, इसलिए हिन्दी का पूर्ण भूतकाल प्रसंगगत संबंध को स्पष्ट करता है।
- source_word: הֵנִיחַ
  choice: विश्राम दिया है
  rationale: नוח के हिफ़ील रूप में किसी को विश्राम या सुरक्षित स्थिरता प्रदान करने का भाव है; यह रूप कारणवाचक और वर्तमान-प्रासंगिक परिणाम दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: इब्रानी संबंधवाचक संरचना का सीधा और स्वाभाविक हिन्दी रूप; यह ‘याहवे’ का समानाधिकरण है।
- source_word: לְעַמּוֹ
  choice: अपनी प्रजा को
  rationale: לְ अप्रत्यक्ष कर्म को चिह्नित करता है; ‘अपनी’ वाक्य के कर्ता याहवे से संबंध स्पष्ट करती है। ‘प्रजा’ सामूहिक वाचा-समुदाय के लिए स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיִּשְׁכֹּן
  choice: और वह ... वास करने लगा है
  rationale: שׁכן स्थायी निवास का बोध देता है। यह चयन आरंभ हुई और बनी रहने वाली स्थिति को व्यक्त करता है, जबकि इब्रानी रूप की कालगत व्याख्या पूरी तरह संकीर्ण नहीं की गई; वैकल्पिक भविष्यगत समझ पादटिप्पणी में दी गई है।
- source_word: בִּירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थानवाचक उपसर्ग का सीधा हिन्दी अनुवाद।
- source_word: עַד לְעוֹלָם
  choice: सदा के लिए
  rationale: दीर्घस्थायी अथवा अनंत अवधि का स्पष्ट, प्रचलित हिन्दी रूप।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसका पारदर्शी आधुनिक हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: यरूशलेम में याहवे के वास का कालगत अर्थ
  choice: वह ... सदा के लिए वास करने लगा है
  alternative: वह ... सदा वास करेगा
  rationale: इब्रानी וַיִּשְׁכֹּן को दाऊद के समय आरंभ हुई, स्थायी मानी गई अवस्था के रूप में पढ़ा जा सकता है; भविष्यगत अर्थ भी व्याकरण और प्रसंग में संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल शैली रखी गई है। ‘विश्राम दिया है’ और ‘वास करने लगा है’ मूल की परिणामकारी तथा स्थायी ध्वनि को सहज हिन्दी में व्यक्त करते हैं।
