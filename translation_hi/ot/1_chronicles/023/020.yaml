  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का बहुवचन संबंध-रूप है और वंशावली की सूची आरम्भ करता है; यहाँ सीधे पुत्रों के नाम हैं, इसलिए ‘पुत्र’ स्वाभाविक और सटीक है।
- source_word: עֻזִּיאֵל
  choice: उज्जीएल
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: מִיכָה
  choice: मीका
  rationale: व्यक्तिवाचक नाम का प्रचलित और हिब्रू रूप के निकट लिप्यंतरण।
- source_word: הָרֹאשׁ
  choice: पहला
  rationale: רֹאשׁ का मूल अर्थ ‘सिर’ या ‘प्रधान’ है, पर अगले नाम के साथ ‘दूसरा’ आने के कारण यहाँ क्रम अथवा अग्रता का अर्थ सबसे स्वाभाविक है।
- source_word: וְיִשִּׁיָּה
  choice: और यिश्शियाह
  rationale: संयोजक सहित व्यक्तिवाचक नाम; देवनागरी रूप हिब्रू के आरम्भिक योध और प्रबल शिन को यथासंभव दर्शाता है।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: यह स्पष्ट क्रमवाचक विशेषण है, जो सूची में दूसरे पुत्र को चिह्नित करता है।
