  text: and to stand every morning to give thanks and to praise Yahweh[a], and likewise at evening,
translation:
  language: hi
  text: और हर सुबह[a] याहवे को धन्यवाद देने और उसकी स्तुति करने के लिए खड़े होना, और इसी प्रकार शाम को भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “सुबह, सुबह”; अर्थात नियमित रूप से हर सुबह।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לַ/עֲמֹד
  choice: और … खड़े होना
  rationale: लְ के साथ क्रिया का यह रूप पिछले संदर्भ में सौंपे गए कर्तव्य को व्यक्त करता है। ‘खड़े होना’ उपासना-सेवा की ठोस मुद्रा को बनाए रखता है और अनावश्यक रूप से ‘सेवा करना’ नहीं जोड़ता।
- source_word: בַּ/בֹּקֶר בַּ/בֹּקֶר
  choice: हर सुबह
  rationale: ‘सुबह’ की पुनरावृत्ति नियमित, प्रतिदिन होने वाले कर्तव्य का बोध कराती है। ‘हर सुबह’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְ/הֹדֹות
  choice: धन्यवाद देने
  rationale: उपासना के इस संदर्भ में हिफ़ील रूप का अर्थ धन्यवाद देना है; साथ आए ‘स्तुति करने’ से भी यही अर्थ पुष्ट होता है।
- source_word: וּ/לְ/הַלֵּל
  choice: और उसकी स्तुति करने
  rationale: पिएल रूप प्रत्यक्षतः स्तुति करने को व्यक्त करता है। हिन्दी में कर्ता-संबंध स्पष्ट करने के लिए ‘उसकी’ स्वाभाविक रूप से जोड़ा गया है, बिना गायन का अतिरिक्त भाव जोड़े।
- source_word: לַ/יהוָה
  choice: याहवे को
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और इसे सामान्य उपाधि से नहीं बदलता।
- source_word: וְ/כֵן
  choice: और इसी प्रकार
  rationale: यह पदबंध शाम के कर्तव्य को सुबह वाले समान कार्य से जोड़ता है।
- source_word: לָ/עָרֶב
  choice: शाम को भी
  rationale: यह उसी उपासना-कर्तव्य के शाम के समय भी होने को बताता है। ‘भी’ וכן में निहित समानता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा-संबंधी विशिष्ट नाम सीधे आया है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि बना देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य से जुड़ी कर्तव्य-सूची का अंश है, इसलिए ‘खड़े होना’ वाला क्रियार्थक रूप बनाए रखा गया है।
