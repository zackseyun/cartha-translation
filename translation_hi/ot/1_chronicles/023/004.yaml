  text: מֵ/אֵ֗לֶּה לְ/נַצֵּ֨חַ֙ עַל מְלֶ֣אכֶת בֵּית יְהוָ֔ה עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָ֑לֶף וְ/שֹׁטְרִ֥ים וְ/שֹׁפְטִ֖ים שֵׁ֥שֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/004.yaml
  text: Of these, twenty-four thousand were to oversee the work of the house of Yahweh, and six thousand were officers and judges.
translation:
  language: hi
  text: इनमें से चौबीस हज़ार यहवे के भवन के काम की देखरेख करने के लिए नियुक्त थे, और छह हज़ार अधिकारी और न्यायाधीश थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵאֵלֶּה
  choice: इनमें से
  rationale: מִן के साथ संकेतवाचक אֵלֶּה पहले बताए गए लेवियों में से एक भाग को सूचित करता है; ‘इनमें से’ हिंदी में स्वाभाविक और अंशसूचक है।
- source_word: לְנַצֵּחַ
  choice: देखरेख करने के लिए थे
  rationale: पिएल धातुरूप यहाँ संगीत-संबंधी नेतृत्व नहीं, बल्कि काम का पर्यवेक्षण या निर्देशन व्यक्त करता है; हिंदी वाक्य में नियुक्ति/दायित्व का भाव भी स्पष्ट रहता है।
- source_word: עַל מְלֶאכֶת
  choice: काम की
  rationale: מְלָאכָה काम, श्रम या नियत कार्य को दर्शाता है। ‘काम’ मंदिर से जुड़े विविध दायित्वों को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: בֵּית יְהוָה
  choice: यहवे के भवन
  rationale: בַּיִת का सीधा अर्थ ‘भवन/घर’ है और יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहवे’ से प्रस्तुत किया गया है; ‘मंदिर’ अर्थसंगत होते हुए भी अधिक व्याख्यात्मक है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार
  rationale: मूल संख्या का सीधा, आधुनिक हिंदी रूप।
- source_word: וְשֹׁטְרִים
  choice: अधिकारी
  rationale: שֹׁטֵר प्रशासनिक पदाधिकारी को सूचित करता है; ‘अधिकारी’ आधुनिक हिंदी में व्यापक और स्वाभाविक समतुल्य है।
- source_word: וְשֹׁפְטִים
  choice: न्यायी
  rationale: שֹׁפֵט न्यायिक कार्य करने वाले व्यक्ति को दर्शाता है; ‘न्यायी’ गरिमापूर्ण बाइबलीय हिंदी में पदनाम के रूप में उपयुक्त है।
- source_word: שֵׁשֶׁת אֲלָפִים
  choice: छः हज़ार
  rationale: मूल संख्या का सीधा रूप, पहली संख्या की शैली के अनुरूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण ध्वन्यात्मक रूप है और नाम तथा उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘भवन’ मूल के रूपक/पदबंध को बचाता है, जबकि ‘देखरेख करने के लिए थे’ प्रशासनिक नियुक्ति का आशय स्वाभाविक ढंग से व्यक्त करता है।
