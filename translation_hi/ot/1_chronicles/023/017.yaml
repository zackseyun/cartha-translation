base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/017.yaml
  text: 'The sons of Eliezer: Rehabiah was the chief[a], and Eliezer had no other sons; but the sons of Rehabiah became very many.'
translation:
  language: hi
  text: 'एलीएज़ेर के पुत्र: रहब्याह प्रधान[a] था। एलीएज़ेर के और कोई पुत्र नहीं था, पर रहब्याह के पुत्रों की संख्या बहुत अधिक बढ़ गई।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुखिया” अथवा “पहला।”
    reason: इब्रानी הָרֹאשׁ संदर्भ के अनुसार प्रधान/मुखिया, अथवा संभवतः क्रम में पहला जन दर्शा सकता है।
lexical_decisions:
- source_word: וַיִּהְיוּ בְנֵי אֱלִיעֶזֶר
  choice: एलीएज़ेर के पुत्रों में
  rationale: वंशावली की परिचयात्मक शैली को स्वाभाविक हिन्दी में रखा गया है; आगे स्पष्ट होता है कि एलीएज़ेर का केवल एक पुत्र था।
- source_word: רְחַבְיָה
  choice: रहब्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: הָרֹאשׁ
  choice: मुखिया
  rationale: यहाँ शब्द प्रधानता अथवा वंशीय नेतृत्व का भाव दे सकता है; ‘मुखिया’ उस अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא הָיָה לֶאֱלִיעֶזֶר בָּנִים אֲחֵרִים
  choice: एलीएज़ेर के और कोई पुत्र नहीं था
  rationale: इब्रानी अस्तित्व-सूचक स्वामित्व रचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: וּבְנֵי רְחַבְיָה
  choice: पर रहब्याह के पुत्रों
  rationale: संयोजक वाव को ‘पर’ से व्यक्त किया गया है, क्योंकि एलीएज़ेर के एकमात्र पुत्र होने और उसी पुत्र के बहुत से वंशज होने के बीच स्पष्ट विरोध है।
- source_word: רָבוּ לְמָעְלָה
  choice: की संख्या बहुत अधिक बढ़ गई
  rationale: רָבוּ वृद्धि अथवा बहुगुणित होने को और לְמָעְלָה उसकी अत्यधिक मात्रा को व्यक्त करता है। संयुक्त अनुवाद मूल के बल को स्वाभाविक हिन्दी में रखता है।
