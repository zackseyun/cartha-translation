  text: וְ/גַ֖ם לַ/לְוִיִּ֑ם אֵין לָ/שֵׂ֧את אֶת הַ/מִּשְׁכָּ֛ן וְ/אֶת כָּל כֵּלָ֖י/ו לַ/עֲבֹדָתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/026.yaml
  text: And also[a], the Levites no longer need to carry the tabernacle and all its utensils for its service.
translation:
  language: hi
  text: और लेवियों को अब मिलापवाले तंबू और उसकी सेवा के लिए उसके सभी सामान को उठाकर ले जाने की आवश्यकता नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: और
  rationale: यह पिछले कथन से संबंध बनाए रखते हुए एक और परिणाम जोड़ता है; हिंदी में केवल ‘और’ स्वाभाविक ढंग से दोनों काम करता है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: לְ यहाँ उस पक्ष को चिह्नित करता है जिसके लिए यह दायित्व नहीं रहा; हिंदी में ‘लेवियों को ... आवश्यकता नहीं’ मूल संरचना और अर्थ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין לָשֵׂאת
  choice: फिर उठाकर ले जाने की आवश्यकता नहीं है
  rationale: संदर्भ में यह नैतिक निषेध नहीं, बल्कि अब उस काम के आवश्यक न रहने का कथन है। ‘फिर’ पूर्व स्थिति की तुलना में ‘अब आगे नहीं’ का भाव व्यक्त करता है।
- source_word: הַמִּשְׁכָּן
  choice: मिलापवाला तम्बू
  rationale: यह हिंदी बाइबल-परंपरा में इस्राएल के पवित्र निवास-तम्बू के लिए परिचित पद है और सामान्य पाठक के लिए पहचानने योग्य है।
- source_word: וְאֶת כָּל כֵּלָיו
  choice: और ... सभी सामान को
  rationale: मूल में संयोजक וְ और समग्रता सूचक כָּל दोनों स्पष्ट हैं। כֵּלִים यहाँ पात्रों, उपकरणों और अन्य वस्तुओं का व्यापक नाम है, इसलिए ‘सामान’ उपयुक्त है।
- source_word: לַעֲבֹדָתוֹ
  choice: उसकी सेवा के
  rationale: प्रत्यय का निकटतम और स्वाभाविक संदर्भ मिलापवाला तम्बू है; वाक्यांश उन सभी वस्तुओं को उसकी सेवा से संबंधित बताता है।
theological_decisions:
- issue: אֵין לָשֵׂאת का बल—निषेध या आवश्यकता का अंत
  choice: आवश्यकता नहीं है
  alternative: उठाकर न ले जाएँ
  rationale: दाऊद द्वारा लेवियों के कामों की पुनर्व्यवस्था के संदर्भ में कथन बताता है कि तम्बू अब स्थानांतरित नहीं होगा, इसलिए उसे ढोना उनका आवश्यक काम नहीं रहा; यह निषेधात्मक आज्ञा नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उठाकर ले जाना’ तम्बू तथा भारी पवित्र सामान को ढोने का ठोस भाव देता है।
