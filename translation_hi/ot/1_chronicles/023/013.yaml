base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/013.yaml
  text: 'The sons of Amram: Aaron and Moses. And Aaron was set apart[a], he and his sons forever, to sanctify him as most holy, to burn incense before Yahweh, to minister to him, and to bless in his name forever.'
translation:
  language: hi
  text: 'अम्राम के पुत्र: हारून और मूसा। हारून को अलग ठहराया गया, ताकि उसे परम पवित्र[a] ठहराया जाए—वह और उसके पुत्र सदा के लिए—याहवे के सामने धूप जलाने[b], उसकी सेवा करने और उसके नाम से सदा आशीर्वाद देने के लिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पवित्रताओं की पवित्रता”; यह इब्रानी में परमश्रेष्ठता व्यक्त करने का ढंग है। इसका अनुवाद “परम पवित्र” भी किया जाता है।
    reason: קֹדֶשׁ קָדָשִׁים की शाब्दिक रचना और परमश्रेष्ठता-सूचक अर्थ को बताना।
  - marker: b
    text: या, “भेंटों को आग में जलाकर उनका धुआँ चढ़ाने।”
    reason: קטר धूप जलाने के साथ-साथ भेंट को आग में धुएँ के रूप में चढ़ाने का व्यापक अर्थ भी रख सकता है।
lexical_decisions:
- source_word: בְּנֵי עַמְרָם
  choice: अम्राम के पुत्र
  rationale: यहाँ हारून और मूसा का सीधा नामोल्लेख है, इसलिए वंशजों के व्यापक अर्थ के बजाय शाब्दिक और स्वाभाविक ‘पुत्र’ उपयुक्त है।
- source_word: וַיִּבָּדֵל
  choice: अलग ठहराया गया
  rationale: निफ़अल रूप किसी विशेष पवित्र उद्देश्य के लिए अलग किए जाने को व्यक्त करता है; यह हिन्दी में अभिषेक का अतिरिक्त विचार जोड़े बिना अर्थ स्पष्ट करता है।
- source_word: לְהַקְדִּישׁוֹ קֹדֶשׁ קָדָשִׁים
  choice: ताकि उसे परम पवित्र ठहराया जाए
  rationale: एकवचन कर्म-सर्वनाम को बनाए रखा गया है और קֹדֶשׁ קָדָשִׁים की इब्रानी परमश्रेष्ठता-सूचक रचना को ‘परम पवित्र’ कहा गया है।
- source_word: הוּא וּבָנָיו עַד עוֹלָם
  choice: उसे और उसके पुत्रों को सदा के लिए
  rationale: हारून और उसके पुत्रों की स्थायी याजकीय नियुक्ति को वर्तमान हिन्दी में स्पष्ट किया गया है, जबकि ‘पुत्रों’ और ‘सदा’ की मूल शब्दावली सुरक्षित है।
- source_word: לְהַקְטִיר לִפְנֵי יְהוָה
  choice: याहवे के सामने धूप जलाएँ
  rationale: याजकीय संदर्भ में קטר धूप जलाने के लिए प्रयुक्त हो सकता है; फिर भी इसका व्यापक अर्थ भेंट को धुएँ में चढ़ाना भी हो सकता है, जिसे पादटिप्पणी में रखा गया है। परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: לְשָׁרְתוֹ
  choice: उसकी सेवा करें
  rationale: שרת याजकीय सेवा को दर्शाता है। निकटतम स्पष्ट दैवी संदर्भ याहवे है, और ‘सेवा’ साधारण पाठक के लिए स्वाभाविक तथा गरिमापूर्ण है।
- source_word: וּלְבָרֵךְ בִּשְׁמוֹ
  choice: और उसके नाम से सदा आशीर्वाद दें
  rationale: ‘नाम से’ मूल वाक्यांश में निहित अधिकार अथवा माध्यम—दोनों संभावनाओं को बिना अनावश्यक व्याख्या के बनाए रखता है।
theological_decisions:
- issue: לְהַקְדִּישׁוֹ में एकवचन प्रत्यय का संदर्भ
  choice: ‘उसे परम पवित्र ठहराया जाए’ में ‘उसे’ हारून के लिए रखा गया है
  alternative: इसे अवैयक्तिक रीति से ‘परम पवित्र सेवा के लिए’ कहना
  rationale: ‘हारून को अलग ठहराया गया’ के तुरंत बाद आया एकवचन पुल्लिंग प्रत्यय स्वाभाविक रूप से हारून की ओर संकेत करता है। अनुवाद मूल की असामान्य लेकिन अर्थपूर्ण एकवचन रचना को मिटाता नहीं है।
- issue: לְשָׁרְתוֹ में प्रत्यय का संदर्भ
  choice: ‘उसकी सेवा करें’ में संदर्भ याहवे है
  alternative: हारून की सेवा करना
  rationale: ‘याहवे के सामने’ निकटतम दैवी संदर्भ है और याजकीय कार्यों का क्रम याहवे की सेवा की ओर संकेत करता है; हिन्दी सर्वनाम मूल की संक्षिप्तता को भी बनाए रखता है।
- issue: הוּא וּבָנָיו के बाद याजकीय कर्तव्य का वचन
  choice: कर्तव्यों के लिए बहुवचन ‘वे’
  alternative: एकवचन में केवल हारून को कर्ता मानना
  rationale: हारून और उसके पुत्रों का संयुक्त उल्लेख आगामी याजकीय कार्यों का स्वाभाविक बहुवचन कर्ता है। इससे वंशानुगत याजकीय दायित्व स्पष्ट होता है, बिना किसी साम्प्रदायिक निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘अलग ठहराया गया,’ ‘परम पवित्र,’ और ‘उसके नाम से’ जैसे पद मूल की याजकीय गंभीरता तथा वास्तविक अस्पष्टताओं को बनाए रखते हैं। वाक्य में डैश मूल इब्रानी के बीच आए ‘वह और उसके पुत्र सदा के लिए’ को बिना कठोर या भ्रामक हिन्दी बनाए सुरक्षित करता है।
