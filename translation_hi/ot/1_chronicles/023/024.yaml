  terminology: ‘लेवी के वंशज,’ ‘पितृकुल,’ ‘पंजीकरण,’ ‘सेवा,’ and ‘याहवे’ are suitable. ‘एक-एक व्यक्ति’ naturally conveys the census idiom; the note appropriately preserves its literal head/skull imagery, though ‘सिर’ is sufficient and less distracting than foregrounding ‘खोपड़ी.’
