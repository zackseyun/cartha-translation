base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/024.yaml
  text: These were the sons of Levi by their fathers’ houses[a], the heads of the fathers’ houses, according to those counted of them, by the number of names, head by head, doing the work for the service of the house of Yahweh, from twenty years old and upward.
translation:
  language: hi
  text: लेवी के वंशजों में ये अपने पितृकुलों के अनुसार पितृकुलों के मुखिया थे। उनका पंजीकरण नामों की गिनती के अनुसार, एक-एक व्यक्ति[a] करके किया गया था—अर्थात बीस वर्ष और उससे अधिक आयु के उन लोगों का, जो याहवे के भवन की सेवा का काम करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘एक-एक सिर के अनुसार’; यह प्रत्येक व्यक्ति को अलग-अलग गिनने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי לֵוִי
  choice: लेवी के वंशज
  rationale: यहाँ בְּנֵי केवल प्रत्यक्ष पुत्रों तक सीमित नहीं, बल्कि लेवी के वंशजों के लिए प्रयुक्त है; इसलिए ‘वंशज’ प्रसंगानुकूल और स्पष्ट है।
- source_word: לְבֵית אֲבֹתֵיהֶם
  choice: अपने पितृकुलों के अनुसार
  rationale: यह पदबंध इस्राएली वंशगत पारिवारिक इकाइयों के आधार पर वर्गीकरण बताता है। ‘पितृकुल’ संक्षिप्त और आधुनिक हिन्दी में अर्थपूर्ण है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: शाब्दिक ‘पितरों के मुखिया’ हिन्दी में अस्पष्ट होता; प्रसंग में आशय वंशगत घरानों के अगुओं से है।
- source_word: לִפְקוּדֵיהֶם בְמִסְפַּר שֵׁמוֹת
  choice: उनका पंजीकरण नामों की गिनती के अनुसार
  rationale: פקד की गणना/नामांकन संबंधी धारणा और नामों पर आधारित सूची—दोनों को व्यक्त करता है।
- source_word: לְגֻלְגְּלֹתָם
  choice: एक-एक व्यक्ति
  rationale: शाब्दिक अर्थ ‘उनकी खोपड़ियों/सिरों के अनुसार’ है, पर यह प्रत्येक व्यक्ति की अलग गणना का मुहावरा है। मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक चित्र footnote में दिया गया है।
- source_word: עֹשֵׂה הַמְּלָאכָה לַעֲבֹדַת בֵּית יְהוָה
  choice: याहवे के भवन की सेवा का काम करते थे
  rationale: עֲבֹדָה में उपासना-स्थान से जुड़ी व्यावहारिक और धार्मिक सेवा दोनों समाहित हैं; ‘सेवा का काम’ इस व्यापकता को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह सेवा के लिए न्यूनतम आयु बताने वाले इब्रानी मुहावरे का सहज और सटीक हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: עֲבֹדָה के धार्मिक आशय की सीमा
  choice: सेवा
  alternative: उपासना; सेवकाई
  rationale: मंदिर से जुड़े कर्तव्यों में धार्मिक अनुष्ठान और व्यावहारिक श्रम दोनों हो सकते हैं। ‘सेवा’ किसी एक संप्रदायगत या केवल अनुष्ठानिक अर्थ को आरोपित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबी इब्रानी सूची-संरचना को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है, जबकि पितृकुल, पंजीकरण, व्यक्तिगत गणना, सेवा और आयु-सीमा के सभी तत्व सुरक्षित रखे गए हैं।
