  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यहाँ रचनात्मक बहुवचन एक वंशावली सूची में मूसा के प्रत्यक्ष पुत्रों का परिचय देता है; इसलिए ‘के पुत्र’ सटीक और स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिब्रू व्यक्तिवाचक नाम का प्रचलित मानक हिन्दी रूप।
- source_word: גֵּרְשֹׁם
  choice: गेर्शोम
  rationale: मूसा के पुत्र के हिब्रू नाम का निकट लिप्यंतरण; इससे भिन्न नाम ‘गेर्शोन’ के साथ भ्रम नहीं होता।
- source_word: וֶ/אֱלִיעֶזֶר
  choice: और एलीएज़ेर
  rationale: वाव को साधारण संयोजक ‘और’ के रूप में तथा אֱלִיעֶזֶר को उसके विशिष्ट हिब्रू रूप के अनुसार लिप्यंतरित किया गया है; यह ‘एलआज़ार’ से अलग नाम है।
