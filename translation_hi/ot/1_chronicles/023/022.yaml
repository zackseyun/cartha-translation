  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। हिन्दी में सम्बन्ध स्पष्ट करने के लिए ‘जो उनके भाई थे’ जोड़ा गया है। परामर्श-पाठ में [a] का स्थान असंगत था; विवाह-सम्बन्धी वैकल्पिक अनुवाद होने के कारण उसे ‘विवाह कर लिया’ के बाद रखा गया है।
