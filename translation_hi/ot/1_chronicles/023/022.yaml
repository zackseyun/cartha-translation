  edition: WLC
  text: וַ/יָּ֨מָת֙ אֶלְעָזָ֔ר וְ/לֹא הָ֥יוּ ל֛/וֹ בָּנִ֖ים כִּ֣י אִם בָּנ֑וֹת וַ/יִּשָּׂא֥וּ/ם בְּנֵי קִ֖ישׁ אֲחֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/022.yaml
  text: Eleazar died and had no sons[a], but only daughters; and the sons of Kish, their brothers[b], married them.
translation:
  language: hi
  text: एलआज़ार मर गया। उसके कोई पुत्र नहीं थे, केवल पुत्रियाँ थीं। कीश के पुत्रों ने—जो उनके भाई[b] थे—उनसे विवाह कर लिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उन्हें पत्नियों के रूप में ग्रहण किया।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “उनके भाई” सम्भवतः उसी सम्बद्ध वंश के निकट कुल-सम्बन्धियों को दर्शाता है; इसका अर्थ अनिवार्य रूप से सगे भाई नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות का सीधा अर्थ ‘मरना’ है; यह सहज और स्पष्ट हिन्दी है तथा अनावश्यक शिष्टोक्ति से बचती है।
- source_word: אֶלְעָזָר
  choice: एलआज़ार
  rationale: इब्रानी नाम का देवनागरी में प्रचलित और स्रोत-सन्निकट लिप्यंतरण।
- source_word: וְלֹא הָיוּ לוֹ בָּנִים
  choice: उसके कोई पुत्र नहीं थे
  rationale: अगले वाक्यांश में पुत्रियों से स्पष्ट विरोध होने के कारण בָּנִים का अर्थ यहाँ सामान्य ‘सन्तान’ नहीं, बल्कि विशेष रूप से ‘पुत्र’ है।
- source_word: כִּי אִם בָּנוֹת
  choice: केवल पुत्रियाँ थीं
  rationale: כִּי אִם यहाँ अपवाद और विरोध व्यक्त करता है; यह हिन्दी रूप उसी आशय को स्वाभाविक ढंग से रखता है।
- source_word: וַיִּשָּׂאוּם
  choice: उनसे विवाह कर लिया
  rationale: स्त्रियों को कर्म बनाकर प्रयुक्त נשׂא का अर्थ यहाँ विवाह में ग्रहण करना है। आधुनिक हिन्दी में ‘उनसे विवाह कर लिया’ स्पष्ट और स्वाभाविक है।
- source_word: בְּנֵי קִישׁ
  choice: कीश के पुत्रों
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा अनुवाद, जो इतिहास-वृत्तान्त की वंशावलीगत शैली बनाए रखता है।
- source_word: אֲחֵיהֶם
  choice: उनके भाई
  rationale: मसोराई पाठ का सीधा रूप ‘उनके भाई’ है। प्रसंग में इसका संकेत निकट कुल-सम्बन्धियों की ओर हो सकता है, पर मुख्य पाठ में अधिक व्यापक अर्थ थोपने के बजाय मूल अभिव्यक्ति रखी गई है।
