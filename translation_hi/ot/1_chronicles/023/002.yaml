  text: וַ/יֶּאֱסֹף֙ אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֔ל וְ/הַ/כֹּהֲנִ֖ים וְ/הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/002.yaml
  text: And he gathered all the leaders of Israel[a], and the priests and the Levites.
translation:
  language: hi
  text: तब उसने इस्राएल के सभी अगुओं[a], याजकों और लेवियों को इकट्ठा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएल के प्रधानों,’ ‘इस्राएल के अधिकारियों,’ अथवा ‘इस्राएल के सरदारों।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּאֱסֹף
  choice: तब उसने ... इकट्ठा किया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ इसका स्वाभाविक हिन्दी संकेत है और ‘इकट्ठा किया’ אסף के सामान्य अर्थ को स्पष्ट रूप से व्यक्त करता है।
- source_word: כָּל
  choice: सभी
  rationale: बहुवचन संज्ञा के साथ यह समग्रता व्यक्त करने वाला स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: שָׂרֵי יִשְׂרָאֵל
  choice: इस्राएल के अगुओं
  rationale: שָׂרִים का अर्थ प्रधान, अधिकारी, शासक या अगुआ हो सकता है। इस प्रशासनिक प्रसंग में ‘अगुए’ व्यापक और सहज है तथा अनावश्यक रूप से राजकुमार होने का भाव नहीं देता।
- source_word: וְהַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन כֹּהֲנִים का प्रचलित और स्पष्ट बाइबलीय हिन्दी रूप। हिन्दी सूची-विन्यास में संयोजक अंतिम पद से पहले रखा गया है।
- source_word: וְהַלְוִיִּם
  choice: और लेवियों
  rationale: लेवी वंश/गोत्र के सदस्यों के लिए प्रचलित हिन्दी नाम; मूल के संयोजक को भी व्यक्त करता है।
