  text: וְ/אַרְבַּ֥עַת אֲלָפִ֖ים שֹׁעֲרִ֑ים וְ/אַרְבַּ֤עַת אֲלָפִים֙ מְהַֽלְלִ֣ים לַ/יהוָ֔ה בַּ/כֵּלִ֕ים אֲשֶׁ֥ר עָשִׂ֖יתִי לְ/הַלֵּֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/005.yaml
  text: and four thousand gatekeepers[a], and four thousand praising Yahweh with the instruments that I made to praise him.
translation:
  language: hi
  text: और चार हज़ार द्वारपाल थे, और चार हज़ार उन वाद्यों के साथ यहोवा की स्तुति करनेवाले थे, जिन्हें मैंने स्तुति करने के लिए बनाया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֹׁעֲרִים
  choice: द्वारपाल
  rationale: यह मंदिर के द्वारों पर नियुक्त लोगों को सूचित करता है; आधुनिक हिन्दी में ‘द्वारपाल’ सटीक और स्वाभाविक है।
- source_word: מְהַֽלְלִים
  choice: स्तुति करनेवाले
  rationale: इब्रानी कृदन्त यहाँ इन लोगों की निरंतर भूमिका या नियुक्त कार्य को व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा की
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम יהוה है; हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘यहोवा’ नामात्मकता को बनाए रखता है।
- source_word: בַּכֵּלִים
  choice: वाद्यों के साथ
  rationale: כֵּלִים सामान्यतः उपकरण या पात्र हो सकता है, पर स्तुति के प्रसंग में वाद्ययंत्र अभिप्रेत हैं; ‘वाद्यों’ से अर्थ स्वाभाविक रूप से स्पष्ट होता है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: जिन्हें मैंने ... बनाया था
  rationale: प्रथम पुरुष एकवचन और वाद्यों से संबंधित उपवाक्य को सीधे बनाए रखा गया है।
- source_word: לְהַלֵּל
  choice: स्तुति करने के लिए
  rationale: लामेद सहित infinitive स्तुति के उद्देश्य को व्यक्त करता है; कर्म मूल में व्यक्त नहीं है, इसलिए हिन्दी में भी अनावश्यक ‘उसकी’ नहीं जोड़ा गया।
- source_word: וְאַרְבַּעַת אֲלָפִים ... וְאַרְבַּעַת אֲלָפִים
  choice: और चार हज़ार ... और चार हज़ार
  rationale: दो अलग समूहों पर बल देनेवाली मूल की पुनरुक्त संख्या-संरचना सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: विशिष्ट वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; हिन्दी पाठकों में ‘यहोवा’ अधिक परिचित रूप है।
- issue: לְהַלֵּל में स्तुति का कर्म
  choice: कर्म को अव्यक्त रखना
  alternative: उसकी स्तुति करने के लिए
  rationale: निकटवर्ती יהוה से आशय स्पष्ट है, किंतु infinitive में सर्वनाम प्रत्यक्षतः नहीं है; इसलिए मूल की अभिव्यक्ति और हल्की अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज बाइबलीय गद्य। ‘करनेवाले’ को संयुक्त रूप में रखा गया है। वाक्य को सूची के पूर्ववर्ती संदर्भ से जुड़ी संरचना के अनुसार ‘और’ से आरम्भ किया गया है।
