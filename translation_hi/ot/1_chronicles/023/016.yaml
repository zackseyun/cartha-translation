- source_word: בְּנֵי
  choice: पुत्रों में
  rationale: यह בֵּן का संबंधसूचक बहुवचन रूप है। सूची की संक्षिप्त इब्रानी रचना को स्वाभाविक हिन्दी वाक्य बनाने के लिए ‘के पुत्रों में’ चुना गया है; इससे वंश-संबंध और शबूएल की प्रधानता दोनों स्पष्ट रहते हैं।
- source_word: גֵרְשׁוֹם
  choice: गेर्शोम
  rationale: यह व्यक्तिवाचक नाम है; इब्रानी रूप גֵרְשׁוֹם के अनुसार लिप्यंतरण किया गया है, जो ‘गेर्शोन’ से भिन्न है।
- source_word: שְׁבוּאֵל
  choice: शबूएल
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट प्रचलित हिन्दी लिप्यंतरण।
- source_word: הָרֹאשׁ
  choice: प्रधान
  rationale: सव्यंजक רֹאשׁ यहाँ वंशीय अथवा प्रशासनिक सूची में नेतृत्व या सर्वोच्च पद बताता है। ‘प्रधान’ आधुनिक हिन्दी में स्वाभाविक है; अधिक शाब्दिक अर्थ ‘मुखिया’ भी संभव है।
