base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/029.yaml
  text: and for the bread of the arrangement[a], and for the fine flour for the grain offering, and for the wafers of unleavened bread, and for what is cooked on the griddle, and for what is well-mixed, and for every measure and size,
translation:
  language: hi
  text: और पंक्तियों में सजाई गई रोटी[a], अन्नबलि के लिए बारीक आटा, अख़मीरी पतली रोटियाँ, तवे पर पकाई गई वस्तु, मिश्रित वस्तु, और हर परिमाण और माप के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “व्यवस्था/पंक्ति की रोटी।” इसे “दर्शन की रोटी,” “भेंट की रोटी,” या “उपस्थिति की रोटी” भी कहा जाता है।
    reason: मूल इब्रानी शब्दावली का शाब्दिक अर्थ और प्रचलित उपासना-संबंधी वैकल्पिक नाम उपलब्ध कराना।
lexical_decisions:
- source_word: לֶחֶם הַמַּעֲרֶכֶת
  choice: भेंट की रोटियाँ
  rationale: शाब्दिक अर्थ ‘सजाकर रखी गई रोटी’ है। यहाँ मंदिर में विधिपूर्वक रखी जाने वाली पवित्र रोटियाँ अभिप्रेत हैं; ‘भेंट की रोटियाँ’ सामान्य पाठक के लिए स्वाभाविक है, जबकि शाब्दिक और पारंपरिक विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: סֹלֶת
  choice: मैदा
  rationale: बलियों में प्रयुक्त बारीक, परिष्कृत आटे के लिए आधुनिक हिन्दी का स्पष्ट और सहज शब्द।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: इस उपासना-संबंधी प्रसंग में यह सामान्य भेंट नहीं, अनाज से तैयार की जाने वाली बलि है।
- source_word: רְקִיקֵי הַמַּצּוֹת
  choice: अख़मीरी पतली रोटियाँ
  rationale: רְקִיקִים की पतली रोटी/चपटी टिकिया और מַצּוֹת के बिना खमीर होने, दोनों तत्वों को स्पष्ट रखता है।
- source_word: מַּחֲבַת
  choice: तवे पर पकाई गई वस्तुएँ
  rationale: शब्द सपाट तवे या उस पर तैयार की गई भेंट को सूचित करता है; सूची में खाद्य तैयारियों की चर्चा होने के कारण तैयार वस्तु का अनुवाद प्रसंगानुकूल है।
- source_word: מֻּרְבָּכֶת
  choice: गूँधकर तैयार की गई वस्तुएँ
  rationale: निष्क्रिय कृदंत किसी मिश्रित या तैयार किए गए खाद्य पदार्थ को दर्शाता है। ‘गूँधकर तैयार’ आटे-तेल की तैयारी को स्वाभाविक हिन्दी में व्यक्त करता है, पर ठीक विधि को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: מְשׂוּרָה וּמִדָּה
  choice: मात्रा और नाप
  rationale: युग्म मानकीकृत परिमाण और माप का संकेत देता है; हिन्दी में दोनों निकटार्थी शब्द मूल की द्विपदी अभिव्यक्ति बनाए रखते हैं।
theological_decisions:
- issue: לֶחֶם הַמַּעֲרֶכֶת का उपासना-संबंधी नाम
  choice: मुख्य पाठ में ‘भेंट की रोटियाँ’ और पाद-टिप्पणी में शाब्दिक तथा पारंपरिक विकल्प
  alternative: ‘सजाकर रखी गई रोटी’, ‘दर्शन की रोटी’
  rationale: मूल पद ‘व्यवस्था/पंक्ति की रोटी’ कहता है; संबंधित याजकीय पदों के आधार पर केवल ‘उपस्थिति की रोटी’ चुनना इस पद की विशिष्ट शब्दावली को व्याख्यात्मक रूप से बदल सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। पद पिछले वाक्य से जुड़ी कर्तव्य-सूची का अंश है, इसलिए अंत में ‘ध्यान रखने के लिए’ जोड़कर हिन्दी में संबंध स्पष्ट किया गया है। ‘अख़मीरी’ स्थापित बाइबलीय शब्दावली है; ‘मैदा’ सामान्य पाठक के लिए ‘बारीक आटे’ से अधिक संक्षिप्त और स्वाभाविक है।
