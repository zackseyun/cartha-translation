id: 1CH.23.31
reference: 1 Chronicles 23:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/כֹ֨ל הַעֲל֤וֹת עֹלוֹת֙ לַ/יהוָ֔ה לַ/שַּׁבָּת֔וֹת לֶ/חֳדָשִׁ֖ים וְ/לַ/מֹּעֲדִ֑ים בְּ/מִסְפָּ֨ר כְּ/מִשְׁפָּ֧ט עֲלֵי/הֶ֛ם תָּמִ֖יד לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/031.yaml
  text: and for all the burnt offerings offered to Yahweh on the Sabbaths[a], at the new moons, and at the appointed feasts, by number according to the ordinance concerning them, continually before Yahweh.
translation:
  language: hi
  text: और याहवे के लिए सारी होमबलियाँ चढ़ाने के लिए[a]—विश्राम-दिनों, नए चाँद के अवसरों और नियत पर्वों पर—उनके लिए ठहराई गई विधि के अनुसार निश्चित संख्या में, नियमित रूप से याहवे के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘होमबलियों का चढ़ाना’ है; वहाँ बलि चढ़ाने की क्रिया पर बल देने के लिए ‘चढ़ाना’ और ‘होमबलियाँ’ साथ प्रयुक्त हुए हैं।
    reason: मूल की क्रिया-संज्ञा रचना और उसके बलाघात को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: וּלְכֹל הַעֲלוֹת עֹלוֹת
  choice: और ... सारी होमबलियाँ चढ़ाने के लिए
  rationale: यह वाक्यांश पिछले संदर्भ में लेवियों के एक और कर्तव्य को जोड़ता है। क्रिया के infinitive construct और उसी मूल से संबंधित बलिदान-संज्ञा को स्वाभाविक हिन्दी में ‘होमबलियाँ चढ़ाने’ से व्यक्त किया गया है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह वे बलियाँ हैं जो वेदी पर पूरी तरह जलाई जाती थीं; ‘होमबलि’ हिन्दी में इस स्थापित धार्मिक शब्द का स्पष्ट और प्रचलित समतुल्य है।
- source_word: לַיהוָה / לִפְנֵי יְהוָה
  choice: याहवे के लिए / याहवे के सामने
  rationale: 'יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में ‘याहवे’ लिखा गया है। दोनों पूर्वसर्गों का भेद भी रखा गया है: बलि ‘के लिए’ और सेवा उसकी उपस्थिति में, अर्थात ‘के सामने’।'
- source_word: לַשַּׁבָּתוֹת
  choice: विश्राम-दिनों पर
  rationale: बहुवचन और बलि चढ़ाने के अवसर—दोनों को सुरक्षित रखते हुए आधुनिक हिन्दी का अर्थपूर्ण धार्मिक पद चुना गया है।
- source_word: לֶחֳדָשִׁים
  choice: नए चाँद के अवसरों पर
  rationale: इस उपासना-संबंधी सूची में शब्द सामान्य महीनों के बजाय अमावस्या/नवचंद्र के नियत धार्मिक अवसरों को सूचित करता है; ‘नए चाँद के अवसर’ इसे सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: וְלַמּוֹעֲדִים
  choice: और नियत पर्वों पर
  rationale: מוֹעֲדִים यहाँ उपासना-पंचांग के निर्धारित पर्व हैं। ‘नियत पर्व’ समय की नियुक्ति और उत्सव, दोनों भाव रखता है।
- source_word: בְּמִסְפָּר כְּמִשְׁפָּט עֲלֵיהֶם
  choice: उनके लिए ठहराई गई विधि के अनुसार निश्चित संख्या में
  rationale: बलियों की संख्या पहले से निर्धारित विधान के अनुसार थी। ‘उनके’ से मूल का संभावित संदर्भ खुला रहता है—यह अवसरों अथवा उनसे संबंधित बलियों की ओर संकेत कर सकता है।
- source_word: תָּמִיד
  choice: नियमित रूप से
  rationale: इस उपासना-संदर्भ में शब्द निरंतर बिना रुके किए जाने के बजाय बार-बार नियत रीति से होने वाली सेवा बताता है; ‘नियमित रूप से’ उस आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम יהוה है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण का निकट देवनागरी रूप है और नाम को किसी उपाधि से नहीं बदलता।
- issue: תָּמִיד का कालगत आशय
  choice: नियमित रूप से
  alternative: निरंतर
  rationale: यहाँ बलियाँ विश्राम-दिनों, नए चाँद के अवसरों और पर्वों जैसे आवर्ती समयों पर चढ़ाई जाती हैं। इसलिए ‘नियमित रूप से’ सतत क्रिया का अनावश्यक अर्थ दिए बिना चलती व्यवस्था को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से जुड़ा कर्तव्य-वाक्यांश है, इसलिए मूल की अपूर्ण/सूचीगत वाक्य-संरचना को पूर्णतः स्वतंत्र वाक्य बनाकर नहीं बदला गया। डैश से उपासना के तीन अवसर मुख्य कर्तव्य से स्पष्ट रूप से जुड़े हैं।
