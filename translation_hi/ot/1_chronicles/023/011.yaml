  text: Jahath was the first and Zizah the second[a]; Jeush and Beriah did not have many sons[b], so they became one father’s house for one reckoning.
translation:
  language: hi
  text: यहत पहला था और ज़ीज़ा दूसरा[a]। यऊश और बेरियाह के बहुत बेटे नहीं थे, इसलिए वे गणना के लिए एक ही पितृकुल बने[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ज़ीज़ा नाम को कुछ अनुवादों में ‘ज़ीज़ाह’ भी लिखा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे एक ही पितृकुल के रूप में एक इकाई गिने गए।” हिब्रू में आशय एक ऐसे पैतृक कुल से है जिसे प्रशासनिक गणना में एक इकाई माना गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי יַחַת הָרֹאשׁ
  choice: यहत पहला था
  rationale: רֹאשׁ का मूल अर्थ ‘सिर/प्रधान’ है, पर הַשֵּׁנִי (‘दूसरा’) के साथ क्रमसूचक संदर्भ में ‘पहला’ स्वाभाविक है।
- source_word: זִיזָה הַשֵּׁנִי
  choice: ज़ीज़ा दूसरा था
  rationale: नाम का हिब्रू उच्चारण निकटता से रखा गया है और ordinal का सीधा अनुवाद किया गया है।
- source_word: לֹא הִרְבּוּ בָנִים
  choice: बहुत बेटे नहीं थे
  rationale: शाब्दिक भाव ‘बेटों को बहुत न बढ़ाया’ है; आधुनिक हिन्दी में यह उनकी कम पुत्र-संख्या को स्वाभाविक और पुरुष-विशिष्ट रूप में व्यक्त करता है।
- source_word: לְבֵית אָב
  choice: एक ही पितृकुल
  rationale: בֵּית אָב एक तकनीकी वंश-सामाजिक पद है; ‘पितृकुल’ आधुनिक हिन्दी में पैतृक परिवार/कुल की इकाई को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: לִפְקֻדָּה אֶחָת
  choice: गणना के लिए
  rationale: פקדה यहाँ लेवीय प्रशासन में गिनती, नामांकन या नियत इकाई के रूप में दर्ज किए जाने का संकेत देता है; ‘गणना के लिए’ कार्य-सौंपे जाने की अपेक्षा इस संदर्भ को अधिक निकटता से रखता है।
