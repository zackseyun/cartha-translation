  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’ तकनीकी पारिवारिक पद को बचाता है, जबकि पादटिप्पणी प्रशासनिक गणना का आशय स्पष्ट करती है।
