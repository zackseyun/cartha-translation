  text: וּ/בְנֵ֣י שִׁמְעִ֔י יַ֣חַת זִינָ֔א וִ/יע֖וּשׁ וּ/בְרִיעָ֑ה אֵ֥לֶּה בְנֵי שִׁמְעִ֖י אַרְבָּעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/023/010.yaml
  text: 'And the sons of Shimei: Jahath[a], Zina, Jeush, and Beriah. These were the sons of Shimei—four.'
translation:
  language: hi
  text: 'और शिमी के पुत्र ये थे: यहत, ज़ीना[a], यऊश और बरीआ। ये शिमी के चार पुत्र थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद इस दूसरे नाम को “ज़ीज़ा” लिखते हैं (तुलना करें 1 इतिहास 23:11); यहाँ इब्रानी पाठ में “ज़ीना” है।
    reason: नाम के पाठ-रूप का विकल्प स्पष्ट करना।
lexical_decisions:
- source_word: וּבְנֵי שִׁמְעִי
  choice: और शिमी के पुत्र ये थे
  rationale: वाव को सूची की पिछली कड़ी से जोड़ने वाले ‘और’ के रूप में रखा गया है। वंशावली के संदर्भ में בְנֵי का स्वाभाविक अर्थ ‘पुत्र’ है, यद्यपि व्यापक कुल-संदर्भ में यह वंशजों को भी सूचित कर सकता है।
- source_word: יַחַת
  choice: यहत
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: זִינָא
  choice: ज़ीना
  rationale: इस पद के इब्रानी पाठ में नून वाला नाम-रूप זִינָא है; संबंधित अगले पद में पाए जाने वाले भिन्न रूप को पादटिप्पणी में रखा गया है।
- source_word: וִיעוּשׁ
  choice: यऊश
  rationale: इब्रानी नाम יעוש का निकट देवनागरी लिप्यंतरण; आरंभिक वाव सूची-संयोजक है।
- source_word: וּבְרִיעָה
  choice: और बरीआ
  rationale: नाम בְרִיעָה का देवनागरी लिप्यंतरण किया गया और सूची के अंतिम संयोजक वाव को ‘और’ के रूप में स्पष्ट रखा गया।
- source_word: אֵלֶּה בְנֵי שִׁמְעִי אַרְבָּעָה
  choice: ये शिमी के चार पुत्र थे
  rationale: इब्रानी का संक्षिप्त नामवाचक सार आधुनिक हिंदी में स्वाभाविक पूर्ण वाक्य के रूप में दिया गया है; चार की स्पष्ट कुल-संख्या और ‘शिमी के पुत्र’ की पुनरुक्ति सुरक्षित है।
theological_decisions: []
