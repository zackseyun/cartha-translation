  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। वंशावली की सूची-संरचना तथा इब्रानी की पुनरुक्ति को बनाए रखते हुए वाक्य-विन्यास हिंदी के अनुरूप किया गया है।
