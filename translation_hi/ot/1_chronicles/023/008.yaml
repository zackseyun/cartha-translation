  yaml_path: translation/ot/1_chronicles/023/008.yaml
  text: 'The sons of Ladan: Jehiel the head[a], and Zetham and Joel—three.'
translation:
  language: hi
  text: 'लादान के पुत्र: प्रधान[a] यहीएल, जेताम और योएल—कुल तीन।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुखिया”; इब्रानी शब्द का शाब्दिक अर्थ “सिर” है और यहाँ संभवतः यहीएल को प्रमुख या पहला पुत्र बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह ‘पुत्रों’ का संबंधकारक बहुवचन रूप है। यहाँ इसके बाद तीन नामों की सीधी सूची है, इसलिए ‘के पुत्र’ सबसे स्वाभाविक है।
- source_word: לַעְדָּן
  choice: लादान
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण; दीर्घ आ ध्वनियों को स्पष्ट रखा गया है।
- source_word: הָרֹאשׁ
  choice: प्रधान
  rationale: शाब्दिक अर्थ ‘सिर/मुखिया’ है। वंशावली के इस संदर्भ में यह यहीएल को प्रमुख या अग्रणी पुत्र बताता है; ‘प्रधान’ मूल की पद अथवा क्रम संबंधी संभावित अस्पष्टता को काफी हद तक बनाए रखता है।
- source_word: יְחִיאֵל
  choice: यहीएल
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וְזֵתָם
  choice: जेताम
  rationale: संयोजक सहित नाम का स्वाभाविक हिन्दी रूप; आरंभिक व्यंजन का उच्चारण ‘ज’ से दर्शाया गया है।
- source_word: וְיוֹאֵל
  choice: और योएल
  rationale: संयोजक और नाम को सीधे रूप में प्रस्तुत किया गया है।
- source_word: שְׁלֹשָׁה
  choice: कुल तीन
  rationale: इब्रानी में दी गई कुल संख्या को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: הָרֹאשׁ का आशय पारिवारिक क्रम है या नेतृत्व
  choice: प्रधान
  alternative: पहला / मुखिया
  rationale: मूल शब्द ‘सिर’ से विकसित होकर ‘मुखिया, प्रधान’ का अर्थ देता है और संदर्भ में संभवतः अग्रणी अथवा ज्येष्ठ पुत्र को सूचित करता है। केवल ‘पहला’ कहना क्रम को निश्चित कर देता, जबकि ‘मुखिया’ औपचारिक पद का अधिक प्रबल आभास दे सकता है; ‘प्रधान’ तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। वंशावली की संक्षिप्त सूची-शैली बनाए रखी गई है; ‘कुल’ संख्या-सारांश को हिन्दी में स्वाभाविक बनाता है।
