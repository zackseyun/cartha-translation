  text: 'The sons of Kohath: Amram, Izhar, Hebron, and Uzziel—four.'
translation:
  language: hi
  text: 'कहात के पुत्र: अम्राम, यिसहार, हेब्रोन और उज्जीएल—कुल चार।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בן का बहुवचन संबंध-रूप है, जो वंशावली की सूची आरम्भ करता है। यहाँ तुरंत चार नाम दिए गए हैं, इसलिए व्यापक अर्थ वाले ‘वंशज’ के बजाय प्रत्यक्ष ‘पुत्र’ उपयुक्त है।
- source_word: קְהָת
  choice: कहात
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: עַמְרָם
  choice: अम्राम
  rationale: हिब्रू व्यक्तिगत नाम का निकट और हिन्दी में सुबोध लिप्यंतरण।
- source_word: יִצְהָר
  choice: यिसहार
  rationale: हिब्रू नाम में आरम्भिक योध और मध्य के צְה समूह को दर्शाने वाला सुबोध हिन्दी लिप्यंतरण।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: यहाँ संदर्भ से यह स्थान नहीं, व्यक्ति का नाम है; प्रचलित हिन्दी रूप रखा गया है।
- source_word: וְעֻזִּיאֵל
  choice: और उज्जीएल
  rationale: वाव को सूची के अंतिम संयोजक ‘और’ के रूप में और व्यक्तिगत नाम को उसके हिब्रू उच्चारण के निकट प्रस्तुत किया गया है।
- source_word: אַרְבָּעָה
  choice: कुल चार
  rationale: यह संख्या सूचीबद्ध पुत्रों की कुल गिनती बताती है। हिन्दी में ‘कुल चार’ इसका स्वाभाविक और स्पष्ट सारांश है।
