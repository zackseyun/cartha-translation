    reason: lexical_alternative
lexical_decisions:
- source_word: חֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहों
  rationale: लेवीय नगरों के संदर्भ में यह शब्द नगर से संबंधित खुली भूमि को दर्शाता है, जिसका उपयोग सामान्यतः पशु चराने के लिए होता था। स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगर की ओर संकेत करते हुए ‘उसकी’ से व्यक्त किया गया है।
- source_word: יַעְזֵיר
  choice: याजेर
  rationale: स्थान-नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וְאֶת
  choice: और … को
  rationale: וְ से सूची का संयोजन ‘और’ द्वारा तथा अनुवाद में आवश्यक कर्म-चिह्न को ‘को’ द्वारा व्यक्त किया गया है; हिब्रू את का स्वतंत्र शाब्दिक अर्थ नहीं जोड़ा गया।
