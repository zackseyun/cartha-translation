    reason: textual_variant
lexical_decisions:
- source_word: חוּקֹק
  choice: हुक्कोक
  rationale: यह स्थान का नाम है; मसोरेटिक पाठ के अनुसार देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसके चरागाहों सहित
  rationale: यह नगर से लगी उस खुली भूमि को दर्शाता है जो मुख्यतः पशुओं के चरने और सामुदायिक उपयोग के लिए होती थी; इस नगर-सूची में यह सहज और ठोस अर्थ देता है।
- source_word: רְחֹב
  choice: रहोब
  rationale: स्थान के नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְאֶת
  choice: और … को
  rationale: संयोजक वाव और निश्चित कर्म-चिह्न को हिन्दी सूची-वाक्य में स्वाभाविक रूप से ‘और … को’ द्वारा व्यक्त किया गया है; नगर और उसकी चरागाह-भूमि का संबंध ‘सहित’ से स्पष्ट होता है।
theological_decisions: []
