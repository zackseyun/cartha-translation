base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/050.yaml
  text: They assigned by lot from the tribe of the sons of Judah[a], and from the tribe of the sons of Simeon, and from the tribe of the sons of Benjamin, these cities, which they called by name.
translation:
  language: hi
  text: उन्होंने चिट्ठी डालकर यहूदा के वंशजों के गोत्र में से, शिमोन के वंशजों के गोत्र में से और बिन्यामीन के वंशजों के गोत्र में से ये नगर आवंटित किए, जिनके नाम बताए गए हैं:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिन्हें उन्होंने नामों से पुकारा।” यह इब्रानी अभिव्यक्ति आगे दी गई नगरों की नाम-सूची का परिचय कराती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: उन्होंने ... दिए
  rationale: נתן का मूल अर्थ ‘देना’ है; लेवीय नगरों के बँटवारे के संदर्भ में ‘दिए’ स्वाभाविक है और मूल क्रिया को सीधे सुरक्षित रखता है।
- source_word: בַגּוֹרָל
  choice: चिट्ठी डालकर
  rationale: גורל यहाँ निर्णय अथवा बँटवारे के लिए चिट्ठी डालने की प्रथा को सूचित करता है; यह आधुनिक हिन्दी में ‘चिट्ठी के द्वारा’ से अधिक सहज है।
- source_word: מִמַּטֵּה
  choice: के गोत्र में से
  rationale: מַטֶּה का इस वंशीय संदर्भ में अर्थ ‘गोत्र’ है; מִן को ‘में से’ द्वारा व्यक्त किया गया है।
- source_word: בְנֵי יְהוּדָה / בְנֵי שִׁמְעוֹן / בְּנֵי בִנְיָמִן
  choice: यहूदा / शिमोन / बिन्यामीन के वंशजों
  rationale: शाब्दिक ‘पुत्रों’ की अपेक्षा ‘वंशजों’ से सामूहिक जनजातीय अर्थ आधुनिक हिन्दी में स्पष्ट होता है और בְנֵי की वंशगत भावना बनी रहती है।
- source_word: הֶעָרִים הָאֵלֶּה
  choice: ये नगर
  rationale: עִיר का सामान्य और संदर्भानुकूल हिन्दी रूप ‘नगर’ है; demonstrative האלה को ‘ये’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר יִקְרְאוּ אֶתְהֶם בְּשֵׁמוֹת
  choice: जिनके नाम ये हैं
  rationale: इब्रानी में ‘बुलाना’ और ‘नामों से’ का सूत्रात्मक प्रयोग आगे आने वाली नाम-सूची का परिचय देता है। हिन्दी में यह रूप उस कार्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
