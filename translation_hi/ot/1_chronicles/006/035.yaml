  text: וְ/אֵ֖לֶּה בְּנֵ֣י אַהֲרֹ֑ן אֶלְעָזָ֥ר בְּנ֛/וֹ פִּֽינְחָ֥ס בְּנ֖/וֹ אֲבִישׁ֥וּעַ בְּנֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/035.yaml
  text: 'And these were the sons of Aaron: Eleazar his son, Phinehas his son, Abishua his son.'
translation:
  language: hi
  text: 'और हारून के पुत्र ये थे: उसका पुत्र एलीआज़र, उसका पुत्र पीनहास, और उसका पुत्र अबीशूआ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: और ... ये थे
  rationale: संयोजक और संकेतवाचक पद वंशावली की सूची आरम्भ करते हैं। प्रसंगानुसार हिन्दी में भूतकाल का ‘ये थे’ स्वाभाविक है, यद्यपि इब्रानी रूप में क्रिया व्यक्त नहीं है।
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यहाँ आगे प्रत्यक्ष पिता-पुत्र उत्तराधिकार दिया गया है, इसलिए व्यापक ‘वंशज’ के बजाय ‘पुत्र’ उपयुक्त है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: אֶלְעָזָר
  choice: एलीआज़र
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּנ/וֹ
  choice: उसका पुत्र
  rationale: एकवचन पुल्लिंग प्रत्यय सहित संज्ञा प्रत्यक्ष पुत्र-संबंध बताती है; ‘उसका पुत्र’ मूल की क्रमिक वंशावली संरचना बनाए रखता है।
- source_word: פִּינְחָס
  choice: पीनहास
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֲבִישׁוּעַ
  choice: अबीशूआ
  rationale: इब्रानी नाम के स्वर और व्यंजन-क्रम को स्पष्ट रखने वाला हिन्दी लिप्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली शैली रखी गई है। मूल पाठ में बार-बार आने वाले ‘उसका पुत्र’ को बनाए रखा गया है, ताकि प्रत्यक्ष उत्तराधिकार की कड़ी अस्पष्ट न हो।
