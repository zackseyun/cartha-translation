  text: यहत का पुत्र[a], गेर्शोम का पुत्र[b], लेवी का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, वंशावली की व्यापक शैली में, “यहत का वंशज … गेर्शोम का वंशज … लेवी का वंशज।”
