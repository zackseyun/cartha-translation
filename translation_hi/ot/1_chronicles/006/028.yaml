  - marker: b
    text: इब्रानी पाठ में “गेर्शोम” है। अन्य वंशावलियों के कारण कुछ पाठक यहाँ “गेर्शोन” की अपेक्षा कर सकते हैं, पर मूल पाठ में यह नाम अलग रूप में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली में בֶּן का सबसे स्वाभाविक अर्थ ‘का पुत्र’ है। ऐसी सूचियों में कभी-कभी इसका व्यापक अर्थ ‘वंशज’ भी हो सकता है, इसलिए उस संभावना को पाद-टिप्पणी में रखा गया है।
- source_word: יַחַת
  choice: यहत
  rationale: इब्रानी नाम का आधुनिक हिन्दी देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण।
- source_word: גֵּרְשֹׁם
  choice: गेर्शोम
  rationale: मूल पाठ में रूप גֵּרְשֹׁם है; इसलिए इसे अन्यत्र मिलने वाले संबंधित नाम ‘गेर्शोन’ के रूप में सामान्यीकृत नहीं किया गया।
- source_word: לֵוִי
  choice: लेवी
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित और स्रोत-संगत रूप।
