source:
  edition: WLC
  text: וַ/יִּהְי֨וּ מְשָׁרְתִ֜ים לִ/פְנֵ֨י מִשְׁכַּ֤ן אֹֽהֶל מוֹעֵד֙ בַּ/שִּׁ֔יר עַד בְּנ֧וֹת שְׁלֹמֹ֛ה אֶת בֵּ֥ית יְהוָ֖ה בִּ/ירוּשָׁלִָ֑ם וַ/יַּעַמְד֥וּ כְ/מִשְׁפָּטָ֖/ם עַל עֲבוֹדָתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/017.yaml
  text: They were ministering before the tabernacle[a], the tent of meeting, with song until Solomon built the house of Yahweh in Jerusalem[c][b], and they stood according to their ordinance over their service.
translation:
  language: hi
  text: वे मिलाप के तंबू, अर्थात् निवासस्थान, के सामने गीत गाकर[a] सेवा करते थे, सुलैमान के यरूशलेम में याहवे का भवन[b] बनाने तक; और वे अपनी सेवा के लिए अपने निर्धारित विधान[c] के अनुसार खड़े होते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गीत के साथ’ अथवा ‘गाते हुए’।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् याहवे का मंदिर; इब्रानी में ‘भवन’।
    reason: lexical_alternative
  - marker: c
    text: या, ‘अपनी निर्धारित व्यवस्था’ अथवा ‘अपनी रीति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשָׁרְתִים
  choice: सेवा करते थे
  rationale: यह कृदन्त पवित्रस्थान से जुड़ी नियमित धार्मिक सेवा को दर्शाता है। हिंदी में ‘सेवा करते थे’ स्वाभाविक है और प्रसंग के धार्मिक अर्थ को बनाए रखता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पवित्रस्थान के सम्मुख की स्थानगत धारणा को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁכַּן אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के निवास-स्थान
  rationale: दोनों इब्रानी संज्ञाओं को बनाए रखा गया है। ‘निवास-स्थान’ מִשְׁכָּן का मूल भाव देता है और ‘मिलापवाला तंबू’ אֹהֶל מוֹעֵד का प्रचलित हिंदी रूप है।
- source_word: בַּשִּׁיר
  choice: गीत गाकर
  rationale: בְּ यहाँ सेवा के ढंग या साधन को बताता है। ‘गीत गाकर’ सामान्य हिंदी में स्पष्ट है; ‘गीत के साथ’ भी संभव है।
- source_word: עַד בְּנוֹת שְׁלֹמֹה
  choice: जब तक सुलैमान ने ... नहीं बनाया
  rationale: עַד के साथ infinitive construct उस व्यवस्था की अंतिम समय-सीमा बताता है। हिंदी का ‘जब तक ... नहीं’ विन्यास इस अर्थ को स्वाभाविक ढंग से देता है।
- source_word: בֵּית יְהוָה
  choice: याहवे का भवन
  rationale: בַּיִת का शाब्दिक अर्थ ‘भवन/घर’ सुरक्षित रखा गया है; यहाँ उसका संदर्भ मंदिर से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिंदी लिप्यंतरण किया गया है, न कि उसके स्थान पर कोई उपाधि रखी गई है।
- source_word: וַיַּעַמְדוּ
  choice: खड़े होते थे
  rationale: क्रिया का मूल अर्थ ‘खड़ा होना’ बनाए रखा गया है; प्रसंग में इसका भाव नियत सेवा-स्थान ग्रहण करना है।
- source_word: כְמִשְׁפָּטָם
  choice: अपने निर्धारित विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ स्थापित नियम, विधि या नियत व्यवस्था का संकेत देता है। ‘निर्धारित विधान’ औपचारिक अर्थ को बनाए रखता है, जबकि संभावित ‘रीति’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עַל עֲבוֹדָתָם
  choice: अपनी सेवा में
  rationale: עַל यहाँ उनकी सौंपी हुई सेवा से संबंध दर्शाता है। शाब्दिक ‘अपनी सेवा के ऊपर’ हिंदी में भ्रामक होता, इसलिए संबंधसूचक स्वाभाविक रूप चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בֵּית יְהוָה को ‘भवन’ या ‘मंदिर’ कहना
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: मुख्य पाठ इब्रानी के ‘भवन’ को बनाए रखता है, जबकि ऐतिहासिक संदर्भ में यह मंदिर है; वह अर्थ पादटिप्पणी में दिया गया है।
- issue: וַיַּעַמְדוּ का क्रियात्मक भाव
  choice: खड़े होते थे
  alternative: नियुक्त होकर सेवा करते थे
  rationale: मूल क्रिया के प्रत्यक्ष अर्थ को बनाए रखा गया है और प्रशासनिक/धार्मिक कार्य के भाव को आसपास के शब्दों से समझने दिया गया है; इस प्रकार पाठ किसी एक व्याख्यात्मक विस्तार को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘मिलापवाला तंबू’, ‘सेवा’ और ‘विधान’ जैसे परिचित धार्मिक शब्दों का उपयोग हुआ है। इब्रानी वाक्य की पुनरुक्ति और औपचारिकता को यथासंभव रखा गया है, पर हिंदी की स्पष्टता के लिए वाक्य को दो भागों में बाँटा गया है।
