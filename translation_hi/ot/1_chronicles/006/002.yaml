  text: 'These are the names of the sons of Gershom: Libni and Shimei[a].'
translation:
  language: hi
  text: 'गेर्शोम के पुत्रों के नाम ये हैं: लिबनी और शिमी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू पांडुलिपियों में “गेर्शोम” है; संबंधित वंशावलियों में कुछ अनुवाद-परंपराएँ “गेर्शोन” नाम का प्रयोग करती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये हैं
  rationale: संयोजक के साथ संकेतवाचक शब्द नामों की सूची प्रस्तुत करता है। हिंदी में “ये हैं” स्वाभाविक है; आरंभिक וְ का अलग से “और” अनिवार्य नहीं।
- source_word: שְׁמוֹת בְּנֵי
  choice: पुत्रों के नाम
  rationale: संबंधसूचक हिब्रू पदबंध को सहज और अर्थनिष्ठ हिंदी में प्रस्तुत करता है।
- source_word: גֵרְשׁוֹם
  choice: गेर्शोम
  rationale: यहाँ मसोराई पाठ स्पष्ट रूप से गेर्शोम पढ़ता है; नाम का अनुवाद नहीं, देवनागरी लिप्यंतरण किया गया है।
- source_word: לִבְנִי
  choice: लिबनी
  rationale: व्यक्तिवाचक नाम का प्रचलित ध्वन्यात्मक देवनागरी रूप।
- source_word: וְשִׁמְעִי
  choice: और शिमी
  rationale: उपसर्ग וְ दूसरे नाम को पहले से जोड़ता है; שִׁמְעִי का सहज देवनागरी लिप्यंतरण “शिमी” है।
