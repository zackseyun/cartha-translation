lexical_decisions:
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली की पुनरावृत्त संरचना को बनाए रखते हुए यह निकट या वंशगत पुत्र-संबंध व्यक्त करता है; यहाँ संदर्भ में इसे अधिक व्यापक अर्थ देकर ‘वंशज’ करना आवश्यक नहीं है।
- source_word: חֲשַׁבְיָה
  choice: हशब्याह
  rationale: हिब्रू व्यक्ति-नाम का देवनागरी में निकट लिप्यंतरण; अंतिम ‘याह’ नाम के हिब्रू रूप को दर्शाता है।
- source_word: אֲמַצְיָה
  choice: अमस्याह
  rationale: हिब्रू व्यक्ति-नाम का प्रचलित और स्रोत-सन्निकट हिन्दी रूप।
- source_word: חִלְקִיָּה
  choice: हिल्कियाह
  rationale: हिब्रू व्यक्ति-नाम का प्रचलित हिन्दी बाइबलीय रूप, जो मूल नाम के अंतिम ‘याह’ को भी सुरक्षित रखता है।
