    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन रूप है। वंशावलियों में इसका अर्थ कभी व्यापक ‘वंशज’ भी हो सकता है, पर यहाँ लेवी के प्रत्यक्ष पुत्रों की सूची है; इसलिए ‘पुत्र’ स्वाभाविक और सटीक है।
- source_word: לֵוִי
  choice: लेवी
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: גֵּרְשֹׁם
  choice: गेर्शोम
  rationale: इस पद के मसोराई पाठ में गेर्शोम रूप है; इसे गेर्शोन जैसे संबंधित वैकल्पिक रूप में बदलने के बजाय स्रोत-पाठ के अनुसार रखा गया है।
- source_word: קְהָת
  choice: कहात
  rationale: इब्रानी व्यक्तिवाचक नाम का हिन्दी में प्रचलित और सुबोध लिप्यंतरण।
- source_word: וּ/מְרָרִי
  choice: और मरारी
  rationale: संयोजक וּ को ‘और’ तथा व्यक्तिवाचक नाम מְרָרִי को ‘मरारी’ के रूप में प्रस्तुत किया गया है।
