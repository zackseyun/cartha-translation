base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/059.yaml
  text: 'and from the tribe of Asher: Mashal with its pasturelands[a], and Abdon with its pasturelands.'
translation:
  language: hi
  text: और आशेर के गोत्र में से माशाल और उसकी चरागाहें,[a] तथा अब्दोन और उसकी चरागाहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इतिहास-वृत्तांत के पाठ के अनुसार नाम “माशाल” है; यहोशू 21:30 की समानांतर सूची में “मिशाल” मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: और ... के गोत्र में से
  rationale: मַטֶּה यहाँ भूमि-विभाजन के संदर्भ में ‘गोत्र’ को दर्शाता है; उपसर्गों के अर्थ ‘और’ तथा ‘में से’ के रूप में रखे गए हैं।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: इस्राएल के गोत्र का नाम; आधुनिक मानक हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: אֶת מָשָׁל
  choice: माशाल
  rationale: אֶת का हिन्दी में अलग अनुवाद आवश्यक नहीं है। स्थान-नाम को इतिहास-वृत्तांत के मसोराई रूप מָשָׁל के अनुसार लिप्यंतरित किया गया है; यहोशू 21:30 के समानांतर रूप ‘मिशाल’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: मִגְרָשׁ नगर से जुड़ी खुली भूमि, विशेषतः पशु चराने की भूमि, को दर्शाता है। स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है, इसलिए ‘उसकी’ रखा गया है।
- source_word: עַבְדּוֹן
  choice: अब्दोन
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण।
theological_decisions: []
