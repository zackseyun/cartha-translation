  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। नगरों की लेवीय भूमि के लिए ‘चरागाहें’ चुना गया है। मूल सूची की समन्वयी संरचना और पद के आरंभ का ‘और’ सुरक्षित रखा गया है।
