lexical_decisions:
- source_word: יוֹאָח
  choice: योआह
  rationale: यह व्यक्ति का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: वंशावली के इस सूत्र में בֵּן पर लगे तृतीय पुरुष एकवचन प्रत्यय का स्वाभाविक अर्थ ‘उसका पुत्र’ है। वंशावलियाँ कभी-कभी पीढ़ियाँ छोड़ सकती हैं, फिर भी मूल शब्दावली को सीधे रूप में रखा गया है।
- source_word: עִדּוֹ
  choice: इद्दो
  rationale: यह व्यक्ति का नाम है; हिब्रू रूप के अनुसार लिप्यंतरित किया गया है।
- source_word: זֶרַח
  choice: जेरह
  rationale: यह व्यक्ति का नाम है; हिब्रू नाम का सरल और प्रचलित देवनागरी लिप्यंतरण अपनाया गया है।
- source_word: יְאָתְרַי
  choice: याअतरी
  rationale: यह व्यक्ति का नाम है; व्यंजनात्मक और स्वरांकित हिब्रू रूप को यथासंभव स्पष्ट रखते हुए लिप्यंतरित किया गया है। वैकल्पिक रूप पादटिप्पणी में दिया गया है।
