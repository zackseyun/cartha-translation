base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/008.yaml
  text: Elkanah his son[a], and Ebiasaph his son, and Assir his son.
translation:
  language: hi
  text: उसका पुत्र एलकाना, उसका पुत्र एब्यासाप[a], और उसका पुत्र अस्सीर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अबियासाप”; यह कुछ परंपरागत अनुवादों और समानांतर वंशावलियों में पाया जाने वाला अधिक परिचित रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶלְקָנָה
  choice: एलकाना
  rationale: व्यक्तिवाचक नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: בֵּן पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय का सीधा अर्थ ‘उसका पुत्र’ है। वंशावलियों में इसका व्यापक अर्थ ‘वंशज’ हो सकता है, पर यहाँ मूल की स्पष्ट पुत्र-संबंधी भाषा सुरक्षित रखी गई है।
- source_word: וְ
  choice: और
  rationale: वंशावली की अगली कड़ी जोड़ने वाले साधारण संयोजक के रूप में अनूदित किया गया है।
- source_word: אֶבְיָסָף
  choice: एब्यासाप
  rationale: इस पद के इब्रानी रूप אֶבְיָסָף का निकट लिप्यंतरण; अधिक परिचित वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: אַסִּיר
  choice: अस्सीर
  rationale: व्यक्तिवाचक नाम को इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है; दागेश के कारण व्यंजन-द्वित्व दिखाया गया है।
theological_decisions: []
