  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। इब्रानी क्रम को स्वाभाविक हिन्दी में सुरक्षित रखते हुए प्रत्येक בְנוֹ को ‘उसका पुत्र’ कहा गया है।
