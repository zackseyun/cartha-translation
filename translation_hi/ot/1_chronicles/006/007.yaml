  text: 'कहात के पुत्र: उसका पुत्र अम्मीनादाब[a], उसका पुत्र कोरह, और उसका पुत्र अस्सीर।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ समानांतर वंशावलियों में इस स्थान के संबंधित पूर्वज का नाम अम्मीनादाब के बजाय यिसहार है; यहाँ इब्रानी पाठ में अम्मीनादाब लिखा है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन रूप है और वंशावली का परिचय देता है। हिंदी में ‘के पुत्र’ मूल की संरचना को स्वाभाविक और स्पष्ट रूप से बनाए रखता है।
- source_word: קְהָת
  choice: कहात
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: עַמִּינָדָב
  choice: अम्मीनादाब
  rationale: इब्रानी पाठ के नाम का लिप्यंतरण; समानांतर वंशावलियों में भिन्न नाम मिलने पर भी यहाँ मूल पाठ अम्मीनादाब पढ़ता है।
- source_word: בְּנוֹ
  choice: उसका पुत्र
  rationale: एकवचन בֵּן पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय लगा है। ‘उसका पुत्र’ इब्रानी वंश-श्रृंखला को सीधे और स्पष्ट रूप से व्यक्त करता है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण।
- source_word: אַסִּיר
  choice: अस्सीर
  rationale: यहाँ यह व्यक्तिवाचक नाम है; अतः इसके संभावित शब्दार्थ का अनुवाद न करके लिप्यंतरण किया गया है।
theological_decisions:
- issue: अम्मीनादाब और समानांतर वंशावलियों में यिसहार नाम का अंतर
  choice: मुख्य पाठ में इब्रानी पाठ के अनुसार ‘अम्मीनादाब’ रखा गया
  alternative: समानांतर वंशावलियों के आधार पर ‘यिसहार’ लिखना
  rationale: उपलब्ध WLC पाठ स्पष्ट रूप से עַמִּינָדָב पढ़ता है। पाठांतर-संबंधी तनाव को मुख्य पाठ में बदले बिना पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली रखी गई है। मूल इब्रानी की दोहराई हुई ‘उसका पुत्र’ संरचना को बनाए रखा गया है; अंतिम सदस्य से पहले हिंदी की स्वाभाविकता के लिए ‘और’ जोड़ा गया है।
