base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/018.yaml
  text: 'And these are the ones who stood[a], and their sons: from the sons of the Kohathites: Heman the singer, son of Joel[b], son of Samuel.'
translation:
  language: hi
  text: 'और ये वे हैं जो खड़े थे[a], और उनके पुत्र[b]: कहात के वंशजों में से गायक हेमान, योएल का पुत्र, शमूएल का पुत्र।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “खड़े थे” का अर्थ इस प्रसंग में नियुक्त सेवा में उपस्थित थे भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने पुत्रों के साथ।” इब्रानी में शाब्दिक रूप से, “और उनके पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये वे हैं
  rationale: संयोजक वाव और सूची आरम्भ करने वाले संकेतवाचक पद—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָעֹמְדִים
  choice: खड़े रहते थे
  rationale: עמד के ठोस अर्थ ‘खड़ा होना’ को सुरक्षित रखता है; प्रसंग में इससे नियुक्त सेवा में उपस्थित रहने का भाव भी निकल सकता है, पर मुख्य पाठ में उस अर्थ को अनिवार्य नहीं बनाया गया।
- source_word: וּבְנֵיהֶם
  choice: अपने पुत्रों के साथ
  rationale: इब्रानी में शाब्दिक रूप से ‘और उनके पुत्र’ है। यहाँ सूची में उन पुरुषों और उनके पुत्रों की संयुक्त उपस्थिति को सहज हिन्दी में व्यक्त करने के लिए ‘अपने पुत्रों के साथ’ चुना गया है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִבְּנֵי הַקְּהָתִי
  choice: कहातियों के वंशजों में से
  rationale: कहात के कुल से वंशगत सम्बन्ध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵימָן הַמְשׁוֹרֵר
  choice: गायक हेमान
  rationale: מְשׁוֹרֵר का सीधा अर्थ ‘गायक’ है; ‘संगीतकार’ अधिक व्यापक होता। नाम का प्रचलित हिन्दी लिप्यन्तरण ‘हेमान’ रखा गया है।
- source_word: בֶּן יוֹאֵל בֶּן שְׁמוּאֵל
  choice: योएल का पुत्र, जो शमूएल का पुत्र था
  rationale: वंशावली की क्रमिक ‘पुत्र’ संरचना को बिना ‘पोता’ जोड़कर व्यक्त करता है और दोनों בֶּן पदों को स्पष्ट रखता है।
