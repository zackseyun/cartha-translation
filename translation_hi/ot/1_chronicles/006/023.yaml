  text: यिसहार का पुत्र, कहात का पुत्र, लेवी का पुत्र, इस्राएल[a] का पुत्र।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात याकूब, जिसे इस्राएल नाम दिया गया था।
    reason: यह टिप्पणी ‘इस्राएल’ नाम वाले व्यक्ति की पहचान स्पष्ट करती है, जबकि मुख्य पाठ में मूल इब्रानी नाम को बनाए रखती है।
lexical_decisions:
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली के इस सूत्र में बार-बार आया בֶּן सीधे पिता-पुत्र संबंध को व्यक्त करता है। यद्यपि कुछ वंशावलियों में इसका अर्थ व्यापक रूप से ‘वंशज’ हो सकता है, यहाँ ऐसा करने की कोई तात्कालिक आवश्यकता नहीं है।
- source_word: יִצְהָר
  choice: यिसहार
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: קְהָת
  choice: कहात
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित और आसानी से पहचाना जाने वाला रूप।
- source_word: לֵוִי
  choice: लेवी
  rationale: व्यक्तिगत नाम का मानक हिन्दी लिप्यंतरण।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में יִשְׂרָאֵל है, इसलिए मुख्य पाठ में ‘याकूब’ से बदलने के बजाय उसी नाम को रखा गया है।
