  text: וַֽ/יִּתְּנ֥וּ לָ/הֶ֛ם אֶת חֶבְר֖וֹן בְּ/אֶ֣רֶץ יְהוּדָ֑ה וְ/אֶת מִגְרָשֶׁ֖י/הָ סְבִיבֹתֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/040.yaml
  text: They gave them Hebron in the land of Judah[a], with its pasturelands around it.
translation:
  language: hi
  text: उन्होंने उन्हें यहूदा देश में हेब्रोन दिया और उसके चारों ओर की चरागाहें भी दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: उन्होंने ... दे दीं
  rationale: נתן का क़ाल वय्यिक्तोल कथात्मक क्रम में साधारण भूतकाल व्यक्त करता है। हिन्दी में स्त्रीलिंग बहुवचन कर्म ‘चरागाहें’ के अनुसार ‘दे दीं’ स्वाभाविक है; आरम्भिक וַ का अलग अनुवाद आवश्यक नहीं।
- source_word: לָהֶם
  choice: उन्हें
  rationale: ל अप्रत्यक्ष कर्म को चिह्नित करता है; ‘उन्हें’ आधुनिक हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּאֶרֶץ יְהוּדָה
  choice: यहूदा देश में
  rationale: אֶרֶץ का अर्थ यहाँ भौगोलिक देश/प्रदेश है। ‘यहूदा देश’ मूल पदबंध को बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी ... चरागाहें
  rationale: מִגְרָשׁ नगर से लगी खुली भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था। ‘चरागाहें’ इस संदर्भ में सहज और अर्थपूर्ण है।
- source_word: סְבִיבֹתֶיהָ
  choice: उसके चारों ओर की
  rationale: यह प्रत्यययुक्त रूप हेब्रोन नगर के आसपास के क्षेत्र को बताता है; ‘चारों ओर की’ सम्बन्ध और स्थान दोनों स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘चरागाहें’ सामान्य पाठक के लिए स्पष्ट है, जबकि पाद-टिप्पणी मूल शब्द के व्यापक अर्थ को सुरक्षित रखती है।
