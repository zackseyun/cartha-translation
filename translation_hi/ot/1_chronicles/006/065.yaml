base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/065.yaml
  text: 'And from the tribe of Gad: Ramoth in Gilead with its pasturelands[a], and Mahanaim with its pasturelands.'
translation:
  language: hi
  text: 'और गाद के गोत्र में से: गिलाद में रामोत और उसकी चरागाहें, तथा महनैम और उसकी चरागाहें।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: और ... के गोत्र में से
  rationale: मַטֶּה इस भूमि-विभाजन के प्रसंग में ‘गोत्र’ है। उपसर्ग וּ और מִ को सूची के स्वाभाविक हिन्दी संयोजन में ‘और ... में से’ कहा गया है।
- source_word: גָד
  choice: गाद
  rationale: इब्रानी गोत्र-नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: רָאמוֹת בַּגִּלְעָד
  choice: गिलाद में रामोत
  rationale: בְּ के स्थान-सूचक अर्थ ‘में’ को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: मִגְרָשׁ लेवीय नगर से जुड़ी खुली, पशु चराने की भूमि को दर्शाता है; ‘चरागाहें’ इस प्रसंग में संक्षिप्त और सहज है।
- source_word: מַחֲנַיִם
  choice: महनैम
  rationale: इब्रानी स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: וְאֶת
  choice: तथा
  rationale: संयोजक וְ और प्रत्यक्ष कर्म-चिह्न אֶת मिलकर सूची की अगली वस्तु प्रस्तुत करते हैं; हिन्दी में ‘तथा’ स्वाभाविक समन्वय देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और स्पष्ट सूची-शैली रखी गई है। पद की आरम्भिक संयोजकता बनाए रखने के लिए ‘और’ रखा गया है। स्थान-नामों को हिन्दी बाइबलीय प्रयोग के अनुरूप लिप्यंतरित किया गया है।
