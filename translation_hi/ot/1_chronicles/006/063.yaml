  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֵ/עֵ֜בֶר לְ/יַרְדֵּ֣ן יְרֵחוֹ֮ לְ/מִזְרַ֣ח הַ/יַּרְדֵּן֒ מִ/מַּטֵּ֣ה רְאוּבֵ֔ן אֶת בֶּ֥צֶר בַּ/מִּדְבָּ֖ר וְ/אֶת מִגְרָשֶׁ֑י/הָ וְ/אֶת יַ֖הְצָ/ה וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/063.yaml
  text: 'And beyond the Jordan at Jericho[a], east of the Jordan, from the tribe of Reuben: Bezer in the wilderness, with its pasturelands, and Jahzah, with its pasturelands.'
translation:
  language: hi
  text: और यरदन के उस पार, यरीहो के सामने, यरदन के पूर्व में, रूबेन के गोत्र में से उन्हें निर्जन प्रदेश में बेसेर और उसके चरागाह, तथा यहसा[a] और उसके चरागाह मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहसा” को कुछ अनुवादों में “यहाज़” भी कहा गया है।
    reason: स्थाननाम के वैकल्पिक पारंपरिक रूप Jahaz को दर्शाने के लिए।
lexical_decisions:
- source_word: וּמֵעֵבֶר לְיַרְדֵּן יְרֵחוֹ
  choice: और यरीहो के पास यरदन के पार
  rationale: यह वाक्यांश सूची में अगले भौगोलिक क्षेत्र को प्रस्तुत करता है। ‘के पास’ יְרֵחוֹ के स्थानसूचक संबंध को और ‘यरदन के पार’ מֵעֵבֶר לְיַרְדֵּן के स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְמִזְרַח הַיַּרְדֵּן
  choice: यरदन के पूर्व में
  rationale: מִזְרָח यहाँ भौगोलिक दिशा ‘पूर्व’ बताता है; यह पदबंध यरदन के पूर्वी क्षेत्र को स्पष्ट करता है।
- source_word: מִמַּטֵּה רְאוּבֵן
  choice: रूबेन के गोत्र में से
  rationale: भूमि-वितरण के इस संदर्भ में מַטֶּה का अर्थ ‘गोत्र’ है।
- source_word: בֶּצֶר בַּמִּדְבָּר
  choice: जंगल में स्थित बेसेर
  rationale: בֶּצֶר स्थाननाम है और בַּמִּדְבָּר उसे भौगोलिक रूप से अलग पहचान देता है। ‘जंगल’ आधुनिक हिन्दी बाइबलीय प्रयोग में निर्जन या वन्य प्रदेश का स्वाभाविक बोध कराता है; ‘स्थित’ संबंध को स्पष्ट करता है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसके चरागाह
  rationale: लेवीय नगरों की सूचियों में מִגְרָשׁ नगर के चारों ओर पशुओं के लिए रखी खुली भूमि को दर्शाता है; ‘चरागाह’ संक्षिप्त और सामान्य पाठक के लिए स्पष्ट है।
- source_word: יַהְצָה
  choice: यहसा
  rationale: यह इब्रानी स्थाननाम יַהְצָה का देवनागरी लिप्यंतरण है। संबंधित रूप יַהַץ के कारण परंपरागत वर्तनी में भिन्नता मिलती है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सूची-संगत शैली रखी गई है। इब्रानी मूल में क्रिया निहित है; पिछले पदों से चल रहे नगर-वितरण के अर्थ को स्वाभाविक हिन्दी में पूरा करने के लिए ‘उन्हें … मिले’ जोड़ा गया है।
