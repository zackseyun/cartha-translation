base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/014.yaml
  text: 'The sons of Merari: Mahli[a], Libni his son, Shimei his son, Uzzah his son.'
translation:
  language: hi
  text: 'मरारी के पुत्र: महली[a], उसका पुत्र लिबनी, उसका पुत्र शिमी, और उसका पुत्र उज्जा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, वंशावली की व्यापक शैली में, “मरारी के वंशज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यह בֵּן का रचनावस्था बहुवचन है और वंशावली का परिचय देता है। ‘पुत्र’ इसका सीधा और स्वाभाविक हिन्दी रूप है; वंशावली में इसका व्यापक अर्थ ‘वंशज’ भी हो सकता है।
- source_word: מְרָרִי
  choice: मरारी
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुसार रखा गया है।
- source_word: מַחְלִי
  choice: महली
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: לִבְנִי
  choice: लिबनी
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: संज्ञा בֵּן पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय पुत्र-संबंध बताता है। नाम के बाद ‘उसका पुत्र’ वंशक्रम को स्पष्ट और स्वाभाविक ढंग से बनाए रखता है।
- source_word: שִׁמְעִי
  choice: शिमी
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: עֻזָּה
  choice: उज्जा
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; हिब्रू के द्वित्वयुक्त ज़ायिन को प्रचलित रूप ‘ज्ज’ से दर्शाया गया है।
