  text: וַ/יִּתְּנ֨וּ לָ/הֶ֜ם אֶת עָרֵ֧י הַ/מִּקְלָ֛ט אֶת שְׁכֶ֥ם וְ/אֶת מִגְרָשֶׁ֖י/הָ בְּ/הַ֣ר אֶפְרָ֑יִם וְ/אֶת גֶּ֖זֶר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/052.yaml
  text: 'They gave them the cities of refuge: Shechem with its pasturelands in the hill country of Ephraim[a], and Gezer with its pasturelands.'
translation:
  language: hi
  text: 'उन्होंने उन्हें शरण-नगर दिए: एप्रैम के पहाड़ी प्रदेश में शकेम और उसकी चरागाहें, और गेजेर और उसकी चरागाहें।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “शरण के नगर—एप्रैम के पहाड़ी प्रदेश में शकेम और उसकी चरागाहें, और गेजेर और उसकी चरागाहें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: उन्होंने दिए
  rationale: वय्यिक्तोल रूप कथा की अगली क्रिया बताता है; हिन्दी में प्रसंगगत क्रम बिना आरम्भिक ‘और’ के स्वाभाविक रूप से व्यक्त होता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: यह व्यापक प्रसंग में पहले बताए गए प्राप्तकर्ताओं की ओर संकेत करता है।
- source_word: עָרֵי הַמִּקְלָט
  choice: शरण-नगर
  rationale: यह इस्राएली व्यवस्था में निर्दिष्ट आश्रय-नगरों का पारिभाषिक पद है; संक्षिप्त और स्पष्ट आधुनिक हिन्दी रूप चुना गया है।
- source_word: שְׁכֶם
  choice: शकेम
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: नगर से लगी खुली भूमि, विशेषकर पशुओं के चरने के लिए प्रयुक्त क्षेत्र, को संदर्भानुकूल रूप से व्यक्त करता है।
- source_word: בְּהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: यह किसी एक पर्वत के बजाय एप्रैम से संबद्ध ऊँचे पहाड़ी भूभाग को दर्शाता है।
- source_word: גֶּזֶר
  choice: गेजेर
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: וְאֶת ... וְאֶת
  choice: और ... और
  rationale: इब्रानी में दोनों नगरों को समन्वित प्रत्यक्ष कर्मों के रूप में रखा गया है; हिन्दी में इसकी संरचना स्वाभाविक रूप से सुरक्षित है।
theological_decisions:
- issue: क्या केवल शकेम को शरण-नगर कहा गया है या सूची के दोनों नगरों को?
  choice: मुख्य पाठ में ‘शरण-नगर’ को पूरी सूची का शीर्षक माना गया है।
  alternative: वाक्य को इस प्रकार समझना कि शरण-नगरों में शकेम था, जबकि गेजेर केवल आगे सूचीबद्ध एक नगर था।
  rationale: इब्रानी पदबंध אֶת עָרֵי הַמִּקְלָט के बाद कर्म-सूचक אֶת के साथ नगरों की सूची आती है; वाक्य-संरचना कुछ तनाव रखती है, इसलिए वैकल्पिक अधिक औपचारिक विन्यास पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘शरण-नगर’ पारिभाषिक स्पष्टता देता है; ‘चरागाहें’ नगरों से लगी पशु-चराई की भूमि को स्वाभाविक ढंग से व्यक्त करता है।
