base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/004.yaml
  text: 'The sons of Merari: Mahli and Mushi[b][a]. These were the clans of the Levites according to their fathers’ houses.'
translation:
  language: hi
  text: मरारी के पुत्र महली और मूशी थे। लेवियों के ये कुल[a] उनके पितृ-घरानों के अनुसार थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परिवार”।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “उनके पितरों के अनुसार”; इस वंशावली के संदर्भ में आशय पितृवंशीय घरानों के अनुसार वर्गीकरण से है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यह בן का रचनात्मक बहुवचन रूप है और वंशावली में सीधे नामित पुत्रों का परिचय देता है; इसलिए व्यापक अर्थ वाले ‘वंशज’ के बजाय ‘पुत्र’ उपयुक्त है।
- source_word: מְרָרִי
  choice: मरारी
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מַחְלִי
  choice: महली
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: וּמֻשִׁי
  choice: और मूशी
  rationale: संयोजक सहित व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: וְאֵלֶּה
  choice: और ... ये थे
  rationale: वाव को ‘और’ से बनाए रखते हुए संकेतवाचक बहुवचन को स्वाभाविक हिन्दी वाक्यक्रम में रखा गया है।
- source_word: מִשְׁפְּחוֹת
  choice: कुल
  rationale: वंशावली और गोत्रीय व्यवस्था में यह शब्द केवल छोटे परिवार नहीं, बल्कि विस्तृत रिश्तेदारी-समूहों को दर्शाता है; हिन्दी ‘कुल’ इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַלֵּוִי
  choice: लेवियों के
  rationale: यद्यपि इब्रानी रूप एकवचन जातिवाचक है, यहाँ उसका सामूहिक अर्थ लेवी के वंशजों के समूह से है; हिन्दी में बहुवचन ‘लेवियों’ से यह आशय स्वाभाविक रूप से प्रकट होता है।
- source_word: לַאֲבוֹתֵיהֶם
  choice: उनके पितृ-घरानों के अनुसार
  rationale: शाब्दिक अर्थ ‘उनके पितरों के अनुसार’ है। वंशावली के संदर्भ में इससे पितृवंशीय घरानों के आधार पर वर्गीकरण अभिप्रेत है; ‘पितृ-घरानों’ से निहित सामाजिक इकाई स्पष्ट होती है।
