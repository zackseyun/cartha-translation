  text: וְֽ/אַהֲרֹ֨ן וּ/בָנָ֜י/ו מַקְטִירִ֨ים עַל מִזְבַּ֤ח הָֽ/עוֹלָה֙ וְ/עַל מִזְבַּ֣ח הַ/קְּטֹ֔רֶת לְ/כֹ֕ל מְלֶ֖אכֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים וּ/לְ/כַפֵּר֙ עַל יִשְׂרָאֵ֔ל כְּ/כֹל֙ אֲשֶׁ֣ר צִוָּ֔ה מֹשֶׁ֖ה עֶ֥בֶד הָ/אֱלֹהִֽים־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/034.yaml
  text: And Aaron and his sons were offering on the altar of burnt offering and on the altar of incense[a], for all the work of the Most Holy Place and to make atonement for Israel, according to all that Moses the servant of God had commanded.
translation:
  language: hi
  text: और हारून और उसके पुत्र होमबलि की वेदी और धूप की वेदी पर अर्पण जलाते थे। वे परमपवित्र स्थान[a] की सारी सेवा करते और इस्राएल के लिए प्रायश्चित करते थे, जो कुछ परमेश्वर के सेवक मूसा ने आज्ञा दी थी उसके अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमपवित्र वस्तुओं”; इब्रानी पदबंध प्रसंग के अनुसार “परमपवित्र स्थान” अथवा “परमपवित्र वस्तुओं” का बोध करा सकता है।
    reason: मूल इब्रानी पदबंध की वास्तविक स्थानवाचक/वस्तुवाचक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: מַקְטִירִים
  choice: अर्पण जलाते थे
  rationale: हिफ़इल कृदन्त का अर्थ किसी चढ़ावे या धूप को आग पर जलाकर उसका धुआँ ऊपर उठाना है। पद में होमबलि और धूप—दोनों वेदियाँ हैं, इसलिए ‘अर्पण जलाते थे’ दोनों प्रकार की वेदी-सेवा को समेटता है और अनुल्लिखित ‘बलिदान’ को पाठ में नहीं जोड़ता।
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह עֹלָה से संबंधित वेदी का प्रचलित और स्पष्ट हिन्दी नाम है।
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: यह इब्रानी पदबंध का सीधा, स्वाभाविक और आसानी से समझ आने वाला हिन्दी रूप है।
- source_word: לְכֹל מְלֶאכֶת
  choice: की सारी सेवा करते
  rationale: पवित्रस्थान के प्रसंग में מְלָאכָה नियुक्त कार्य या सेवा को सूचित करता है। हिन्दी में ‘सारी सेवा’ पुरोहितों के दायित्व को स्वाभाविक रूप से व्यक्त करता है।
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान
  rationale: यह इब्रानी पद परमपवित्र स्थान अथवा परमपवित्र वस्तुओं को सूचित कर सकता है। मुख्य पाठ में तत्काल पवित्रस्थान-संबंधी प्रसंग के अनुरूप स्थानवाचक अर्थ लिया गया है, जबकि दूसरा संभव अर्थ पादटिप्पणी में रखा गया है।
- source_word: וּלְכַפֵּר עַל יִשְׂרָאֵל
  choice: इस्राएल के लिए प्रायश्चित करते थे
  rationale: ‘प्रायश्चित करना’ याजकीय और बलिदान-संबंधी अर्थ को किसी एक विशिष्ट प्रायश्चित-सिद्धान्त तक सीमित किए बिना सुरक्षित रखता है।
- source_word: כְּכֹל אֲשֶׁר צִוָּה
  choice: ठीक उस हर आज्ञा के अनुसार, जो ... ने दी थी
  rationale: यह रूप मूसा की आज्ञा के संपूर्ण दायरे के अनुसार कार्य किए जाने पर इब्रानी के बल को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶבֶד הָאֱלֹהִים
  choice: परमेश्वर के सेवक
  rationale: यह मूसा की औपचारिक उपाधि को गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים का अभिप्राय
  choice: मुख्य पाठ में स्थानवाचक ‘परमपवित्र स्थान’
  alternative: ‘परमपवित्र वस्तुएँ’
  rationale: इब्रानी पदबंध अंतरतम पवित्रस्थान अथवा विशेष रूप से पवित्र वस्तुओं—दोनों का बोध करा सकता है। वेदियों और याजकीय सेवा के निकट प्रसंग में स्थानवाचक अर्थ संभव और पठनीय है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: כפר का अनुवाद
  choice: प्रायश्चित करना
  alternative: दोष ढाँपना अथवा शुद्धिकरण करना
  rationale: चुना गया व्यापक धार्मिक शब्द बलिदान-संबंधी क्रिया को व्यक्त करता है, पर पाठ से परे जाकर प्रायश्चित की कोई संकीर्ण धर्मवैज्ञानिक व्याख्या आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। पहले लंबे इब्रानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है; अर्थगत संबंध बनाए रखने के लिए दूसरे वाक्य में ‘वे’ दोहराया गया है। ‘अर्पण जलाते थे’ होमबलि और धूप दोनों वेदियों पर होने वाली क्रिया को समेटता है।
