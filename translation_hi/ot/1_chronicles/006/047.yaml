base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/047.yaml
  text: 'And to the sons of Gershom[a], according to their clans, from the tribe of Issachar, and from the tribe of Asher, and from the tribe of Naphtali[b], and from the tribe of Manasseh in Bashan: thirteen cities.'
translation:
  language: hi
  text: और गेर्शोम[a] के पुत्रों को, उनके कुलों के अनुसार, इस्साकार के गोत्र से, आशेर के गोत्र से, नप्ताली के गोत्र से, और बाशान में मनश्शे[b] के गोत्र से तेरह नगर मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ कुलनाम की वर्तनी ‘गेर्शोम’ है; कई अनुवादों में ‘गेर्शोन’ मिलता है।
    reason: alternative_reading
  - marker: b
    text: कुछ अनुवाद भौगोलिक आशय स्पष्ट करने के लिए ‘बाशान में मनश्शे के आधे गोत्र’ लिखते हैं; इस पद के इब्रानी पाठ में ‘आधा गोत्र’ नहीं कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלִבְנֵי
  choice: और ... के वंशजों को
  rationale: आवंटन-सूची में यह अगले प्राप्तकर्ता समूह का परिचय देता है। हिन्दी में ‘वंशज’ वंशगत समुदाय को ‘पुत्रों’ की अपेक्षा अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: גֵרְשׁוֹם
  choice: गेर्शोम
  rationale: मसोरा-पाठ में यहाँ नाम का रूप गेर्शोम है; इसलिए पारंपरिक वैकल्पिक रूप गेर्शोन के स्थान पर स्रोत-पाठ का रूप रखा गया है।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: जनजातीय आवंटन के प्रसंग में מִשְׁפָּחָה व्यापक परिवार नहीं, बल्कि कुल अथवा वंश-समूह को सूचित करता है।
- source_word: מִמַּטֵּה
  choice: के गोत्र से
  rationale: क्षेत्रीय और वंशावली प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है; यही हिन्दी बाइबलीय संदर्भ में स्वाभाविक और सटीक है।
- source_word: מְנַשֶּׁה בַּבָּשָׁן
  choice: बाशान में मनश्शे के गोत्र से
  rationale: इब्रानी में केवल ‘बाशान में मनश्शे’ है। ‘आधे गोत्र’ जोड़ने के बजाय मूल की संक्षिप्त भौगोलिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: עָרִים שְׁלֹשׁ עֶשְׂרֵה
  choice: तेरह नगर
  rationale: यह संख्या-वाचक पद का सीधा और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: बाशान में मनश्शे की पहचान
  choice: ‘आधे गोत्र’ को मुख्य पाठ में नहीं जोड़ा गया
  alternative: ‘बाशान में मनश्शे के आधे गोत्र से’
  rationale: भौगोलिक संदर्भ पूर्वी मनश्शे के भाग की ओर संकेत करता है, पर इस पद के इब्रानी पाठ में ‘आधा गोत्र’ स्पष्टतः नहीं कहा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आवंटन का आशय स्पष्ट करने के लिए हिन्दी वाक्य में ‘मिले’ जोड़ा गया है; यह प्रसंग से निहित है। सभी गोत्रनाम प्रचलित हिन्दी बाइबलीय रूपों में दिए गए हैं।
