  text: Ashan with its pasturelands[a], and Beth-shemesh with its pasturelands.
translation:
  language: hi
  text: और आशान को उसके चरागाहों[a] समेत, और बेत-शेमेश को उसके चरागाहों समेत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ समानांतर पाठ-साक्ष्यों और अनुवादों में यहाँ ‘ऐन’ है; इतिहास की मसोरेटिक इब्रानी पाठ-परंपरा में ‘आशान’ है।
    reason: textual_variant
lexical_decisions:
- source_word: עָשָׁן
  choice: आशान
  rationale: यह स्थान-नाम है; इतिहास की मसोरेटिक इब्रानी पाठ-परंपरा में עָשָׁן है, इसलिए मुख्य पाठ में उसी का देवनागरी लिप्यंतरण रखा गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसके चरागाहों
  rationale: מִגְרָשׁ नगर से लगी खुली भूमि, विशेषतः पशुओं के चरने की भूमि, को दर्शाता है; लेवीय नगरों के संदर्भ में ‘चरागाह’ स्वाभाविक और स्पष्ट है। स्त्रीलिंग एकवचन प्रत्यय नगर की ओर संकेत करता है, जिसे हिंदी में ‘उसके’ से व्यक्त किया गया है।
- source_word: בֵּית שֶׁמֶשׁ
  choice: बेत-शेमेश
  rationale: स्थान-नाम का अर्थानुवाद करने के बजाय उसका प्रचलित देवनागरी लिप्यंतरण किया गया है।
- source_word: וְאֶת
  choice: और … को
  rationale: संयोजक וְ को ‘और’ तथा निश्चित कर्मचिह्न אֶת को हिंदी के स्वाभाविक परसर्ग ‘को’ से व्यक्त किया गया है; इसकी पुनरावृत्ति सूची की संरचना बनाए रखती है।
