  text: 'And the sons of Kohath: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: hi
  text: 'और कहात के पुत्र ये थे: अम्राम, यिसहार, हेब्रोन और उज्जीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: ו को वंशावली की पिछली कड़ी से संबंध बनाए रखने के लिए “और” से व्यक्त किया गया है। בְנֵי का अर्थ यहाँ प्रत्यक्ष पुत्र हैं; हिन्दी में नामों की सूची आरम्भ करने के लिए “ये थे” स्वाभाविक है।
- source_word: קְהָת
  choice: कहात
  rationale: इब्रानी व्यक्ति-नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: עַמְרָם
  choice: अम्राम
  rationale: इब्रानी व्यक्ति-नाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְיִצְהָר
  choice: यिसहार
  rationale: नाम के आरम्भिक י और मध्यवर्ती צְה ध्वनि-समूह को पहचानने योग्य हिन्दी रूप में प्रस्तुत किया गया है; उपसर्ग ו सूची-संरचना में व्यक्त है।
- source_word: וְחֶבְרוֹן
  choice: हेब्रोन
  rationale: यहाँ חֶבְרוֹן नगर नहीं, व्यक्ति का नाम है; उसे हिन्दी में प्रचलित रूप “हेब्रोन” से लिप्यंतरित किया गया है।
- source_word: וְעֻזִּיאֵל
  choice: उज्जीएल
  rationale: इब्रानी नाम में व्यंजन की प्रबलता और אֵל घटक को दर्शाने वाला प्रचलित हिन्दी रूप; अंतिम ו को “और” से व्यक्त किया गया है।
