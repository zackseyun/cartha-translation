  text: וּ/בְנֵ֧י שְׁמוּאֵ֛ל הַ/בְּכֹ֥ר וַשְׁנִ֖י וַ/אֲבִיָּֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/013.yaml
  text: 'And the sons of Samuel: the firstborn[a], Vashni, and Abijah.'
translation:
  language: hi
  text: 'और शमूएल के पुत्र: पहलौठा[a], वशनी और अबिय्याह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘वशनी’। इस पदबंध को ‘और दूसरा’ भी समझा जा सकता है; तुलना करें 1 शमूएल 8:2, जहाँ शमूएल के पुत्रों के नाम योएल और अबिय्याह हैं।
    reason: पाठगत भिन्नता और असामान्य इब्रानी पदबंध को स्पष्ट करना।
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: संयोजक ו को वंशावली की क्रमबद्धता बनाए रखने के लिए ‘और’ रखा गया है; בְנֵי का व्यक्तिवाचक नाम के साथ स्वाभाविक हिन्दी रूप ‘के पुत्र’ है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַבְּכֹר
  choice: पहलौठा
  rationale: सपद रूप परिवार में जन्मक्रम और पद को दर्शाता है; ‘पहलौठा’ संक्षिप्त और सटीक वंशावली-संबंधी शब्द है।
- source_word: וַשְׁנִי
  choice: वशनी
  rationale: मसोरेटिक स्वरांकन के अनुसार इसे मुख्य पाठ में व्यक्तिवाचक नाम के रूप में रखा गया है। इसका ‘और दूसरा’ अर्थ लेना भी संभव है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַאֲבִיָּה
  choice: और अबिय्याह
  rationale: संयोजक और व्यक्तिवाचक नाम का सीधा, प्रचलित हिन्दी रूप।
theological_decisions:
- issue: शमूएल के पुत्रों के नाम और जन्मक्रम से जुड़ी पाठगत कठिनाई
  choice: मुख्य पाठ में मसोरेटिक रूप ‘वशनी’ बनाए रखना
  alternative: पदबंध को ‘पहलौठा, और दूसरा अबिय्याह’ पढ़ना, अथवा 1 शमूएल 8:2 से सामंजस्य बैठाने के लिए पहलौठे का नाम ‘योएल’ जोड़ना
  rationale: यह मुख्यतः पाठगत और वंशावली-संबंधी कठिनाई है। मूल भाषा की प्रधानता के अनुसार मुख्य पाठ प्राप्त इब्रानी रूप को रखता है और 1 शमूएल 8:2 के आधार पर नाम को चुपचाप नहीं जोड़ता। संभावित वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। ‘पहलौठा’ सामान्य हिन्दी पाठक के लिए सहज है और वंशावली के जन्मक्रम को सटीक रूप से व्यक्त करता है। मुख्य पाठ की असामान्य संरचना मूल इब्रानी की वास्तविक कठिनाई को अनावश्यक रूप से सुलझाए बिना बनाए रखती है।
