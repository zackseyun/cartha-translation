base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/061.yaml
  text: 'And from the tribe of Naphtali: Kedesh in Galilee with its pasturelands[a], Hammon with its pasturelands, and Kiriathaim with its pasturelands.'
translation:
  language: hi
  text: 'और नप्ताली के गोत्र से: गलील का केदेश और उसकी चरागाहें[a], हम्मोन और उसकी चरागाहें, तथा किर्यातैम और उसकी चरागाहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साझी खुली भूमि”; इब्रानी शब्द से आशय प्रत्येक नगर से संबद्ध खुले भूभाग से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמַּטֵּה
  choice: और ... के गोत्र से
  rationale: वंशीय भू-आवंटन के संदर्भ में מַטֶּה का स्वाभाविक हिन्दी अर्थ ‘गोत्र’ है; आरंभिक וּ और מִן को ‘और ... से’ से व्यक्त किया गया है।
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: इब्रानी जनजातीय नाम का हिन्दी बाइबलीय लिप्यंतरण।
- source_word: קֶדֶשׁ בַּגָּלִיל
  choice: गलील का केदेश
  rationale: בַּגָּלִיל स्थान को गलील क्षेत्र से पहचानता है; हिन्दी में ‘गलील का केदेश’ सहज और स्पष्ट है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ लेवीय नगर से संबद्ध खुले भूभाग, विशेषतः पशुओं के चरने की भूमि, को दर्शाता है; स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगर की ओर संकेत करता है।
- source_word: חַמּוֹן
  choice: हम्मोन
  rationale: इब्रानी स्थान-नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: קִרְיָתַיִם
  choice: किर्यातैम
  rationale: इब्रानी स्थान-नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
