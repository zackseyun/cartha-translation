base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/045.yaml
  text: 'and from the tribe of Benjamin: Geba with its pasturelands[a], Alemeth with its pasturelands, and Anathoth with its pasturelands—all their cities were thirteen cities according to their families.'
translation:
  language: hi
  text: 'और बिन्यामीन के गोत्र में से: गेबा और उसकी चरागाहें, अलेमेत[a] और उसकी चरागाहें, तथा अनातोत और उसकी चरागाहें—उनके कुलों के अनुसार उनके सब नगर तेरह थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘अलेमेत’ है; यहोशू 21:18 की समानांतर सूची में ‘अल्मोन’ है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִמַּטֵּה בִנְיָמִן
  choice: और बिन्यामीन के गोत्र में से
  rationale: מַטֶּה यहाँ लाठी नहीं, इस्राएल का गोत्र है। आरम्भिक וּמִן पिछले पद की सूची को आगे बढ़ाता है, इसलिए ‘और ... में से’ रखा गया है।
- source_word: גֶּבַע
  choice: गेबा
  rationale: यह स्थान का नाम है; इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर के आसपास पशुओं के चरने के लिए खुली सामुदायिक भूमि को दर्शाता है; ‘चरागाहें’ आधुनिक हिन्दी में सहज और प्रसंगानुकूल है।
- source_word: עָלֶמֶת
  choice: अलेमेत
  rationale: मुख्य पाठ में इतिहासवृत्त के मसोराई रूप עָלֶמֶת को रखा गया है; यहोशू 21:18 का समानांतर रूप पादटिप्पणी में दिया गया है।
- source_word: עֲנָתוֹת
  choice: अनातोत
  rationale: स्थान-नाम को प्रचलित हिन्दी बाइबलीय शैली के अनुरूप देवनागरी में लिप्यंतरित किया गया है।
- source_word: כָּל עָרֵיהֶם שְׁלֹשׁ עֶשְׂרֵה עִיר
  choice: उनके नगर कुल तेरह थे
  rationale: यह सूची का योग बताने वाला वाक्यांश है। हिन्दी में स्वाभाविक संख्या-विन्यास अपनाते हुए ‘कुल’ से כָּל का सार स्पष्ट किया गया है।
- source_word: בְּמִשְׁפְּחוֹתֵיהֶם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה विस्तृत परिवार अथवा कुल को सूचित कर सकता है। ‘कुल’ यहाँ गोत्र के भीतर के पारिवारिक समूह के लिए संक्षिप्त और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-वर्णन के अनुरूप रखी गई है। पिछले पद से चल रहे अपूर्ण वाक्य को हिन्दी में सुबोध बनाने के लिए संदर्भ से निहित ‘मिलीं’ जोड़ा गया है। स्थान-नामों का अनुवाद नहीं, लिप्यंतरण किया गया है।
