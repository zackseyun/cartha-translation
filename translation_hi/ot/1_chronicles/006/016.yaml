source:
  edition: WLC
  text: וְ/אֵ֗לֶּה אֲשֶׁ֨ר הֶעֱמִ֥יד דָּוִ֛יד עַל יְדֵי שִׁ֖יר בֵּ֣ית יְהוָ֑ה מִ/מְּנ֖וֹחַ הָ/אָרֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/016.yaml
  text: These are the men whom David appointed over the service of song in the house of Yahweh[b][a], after the ark came to rest.
translation:
  language: hi
  text: ये वे लोग हैं जिन्हें दाऊद ने याहवे के भवन में गायन की सेवा के लिए नियुक्त किया था[a], सन्दूक के विश्राम पाने के बाद[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘गायन की देखरेख के लिए नियुक्त किया था’ अथवा ‘गायन की सेवा का दायित्व सौंपा था।’ इब्रानी पदबंध पवित्रस्थान में गायन-संबंधी उत्तरदायित्व को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘सन्दूक के विश्राम से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה אֲשֶׁר
  choice: ये वे लोग हैं जिन्हें
  rationale: यह वाक्य आगे आने वाली व्यक्तियों की सूची का परिचय देता है। प्रसंग के अनुसार ‘लोग’ जोड़ने से हिन्दी स्वाभाविक बनती है, यद्यपि इब्रानी में यह शब्द प्रत्यक्ष रूप से नहीं है।
- source_word: הֶעֱמִיד דָּוִיד
  choice: दाऊद ने ... दायित्व सौंपा था
  rationale: עמד के हिफ़ील रूप का अर्थ यहाँ किसी को औपचारिक सेवा या पद पर नियुक्त करना है; ‘दायित्व सौंपा’ प्रशासनिक नियुक्ति और उत्तरदायित्व दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל יְדֵי שִׁיר
  choice: गायन की सेवा का दायित्व
  rationale: यह पदबंध पवित्रस्थान में गायन से जुड़े उत्तरदायित्व को सूचित करता है। यह अनुवाद ‘गायन’ और सेवा-संबंधी कार्यभार दोनों को बनाए रखता है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन में
  rationale: בֵּית का शाब्दिक अर्थ ‘भवन/घर’ है और यहाँ पवित्रस्थान अभिप्रेत है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: מִמְּנוֹחַ הָאָרוֹן
  choice: जब से सन्दूक को विश्राम-स्थान मिला था
  rationale: מן के साथ מנוח यहाँ उस समय से आरम्भ होने वाली अवधि बताता है जब सन्दूक स्थिर स्थान पर रखा गया। ‘विश्राम-स्थान मिला’ संज्ञात्मक इब्रानी अभिव्यक्ति और उसके कालगत भाव दोनों को सुरक्षित रखता है।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: मूल पाठ में केवल ‘सन्दूक’ है; ‘वाचा का सन्दूक’ जोड़ना इस पद में स्पष्ट न की गई सूचना को शामिल करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में परिचित नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय व्यक्तिगत नाम के रूप में बनाए रखता है; ‘याहवे’ अधिक संभावित ऐतिहासिक उच्चारण का वैकल्पिक लिप्यंतरण है।
- issue: ‘भवन’ का संदर्भ
  choice: यहोवा का भवन
  alternative: यहोवा का मन्दिर
  rationale: ‘भवन’ मूल בית के रूपक को सुरक्षित रखता है और इस सन्दूक-केंद्रित प्रसंग में बाद के स्थापत्य अर्थ को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गायन की सेवा’ उपासना-संबंधी प्रसंग को व्यक्त करती है, जबकि ‘दायित्व सौंपा’ औपचारिक नियुक्ति का भाव देता है। ‘सन्दूक’ की वर्तनी हिन्दी बाइबल परम्परा के अनुरूप रखी गई है।
