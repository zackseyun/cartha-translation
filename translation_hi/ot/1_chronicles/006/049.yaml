  text: And the sons of Israel gave to the Levites the cities and their pasturelands[a][b].
translation:
  language: hi
  text: और इस्राएलियों ने लेवियों को नगर और उन नगरों की चरागाहें दे दीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְּנוּ
  choice: दे दीं
  rationale: נתן के सामान्य अर्थ ‘देना’ को कथा के पूर्ण हुए कार्य के रूप में स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ पूरे समुदाय का जननाम अभिप्रेत है; ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: लेवी गोत्र के लोगों के लिए मानक हिन्दी पद और सम्प्रदान कारक का सीधा अनुवाद।
- source_word: הֶעָרִים
  choice: वे नगर
  rationale: निर्दिष्ट नगरों के लिए עָרִים का प्रसंगानुकूल और प्रतिष्ठित हिन्दी रूप; ‘वे’ हिब्रू निश्चितता को स्वाभाविक रूप से दर्शाता है।
- source_word: מִגְרְשֵׁיהֶם
  choice: उनकी चरागाहें
  rationale: नगरों से संबंधित खुले, पशु चराने योग्य भूभाग का ठोस अर्थ व्यक्त करता है; वैकल्पिक व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली। ‘इस्राएल के पुत्रों’ की अपेक्षा ‘इस्राएलियों’ चुना गया है क्योंकि इस संदर्भ में सामुदायिक जननाम अधिक स्वाभाविक है। ‘चरागाहें’ भूमि-उपयोग का प्रमुख भाव देता है, जबकि शब्द की व्यापक स्थानीय धारणा पादटिप्पणी में रखी गई है।
