lexical_decisions:
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली में यह पद पुत्र-संबंध बताता है। इसकी पुनरावृत्ति इब्रानी पाठ की शृंखलाबद्ध शैली को बनाए रखती है। कुछ वंशावलियों में इसका अर्थ व्यापक रूप से ‘वंशज’ हो सकता है, पर यहाँ निकटवर्ती वंशक्रम ‘पुत्र’ का समर्थन करता है।
- source_word: אֶלְקָנָה
  choice: एलकाना
  rationale: इब्रानी व्यक्तिगत नाम का आधुनिक हिन्दी में सुबोध लिप्यंतरण।
- source_word: יוֹאֵל
  choice: योएल
  rationale: इब्रानी उच्चारण के निकट और हिन्दी बाइबलीय प्रयोग में सुबोध लिप्यंतरण।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और सुबोध हिन्दी रूप।
- source_word: צְפַנְיָה
  choice: सपन्याह
  rationale: इब्रानी व्यक्तिगत नाम का आधुनिक हिन्दी में सुबोध लिप्यंतरण।
