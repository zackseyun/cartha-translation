base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/057.yaml
  text: 'And from the tribe of Issachar: Kedesh with its pasturelands[a], and Daberath with its pasturelands.'
translation:
  language: hi
  text: 'और इस्साकार के गोत्र में से: केदेश और उसकी चरागाहें, तथा दाबरत[a] और उसकी चरागाहें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दाबरत का नाम कुछ अनुवादों में और समानांतर नगर-सूची में “दाबेरत” भी लिखा गया है (देखें यहोशू 21:28)।
    reason: alternative_reading
lexical_decisions:
- source_word: וּ/מִ/מַּטֵּה
  choice: और ... के गोत्र में से
  rationale: מַטֶּה यहाँ भूमि-वितरण के संदर्भ में ‘गोत्र’ है। וּ और מִ मिलकर पिछली सूची को जारी रखते हुए ‘और ... में से’ का भाव देते हैं।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: इस गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: קֶדֶשׁ
  choice: केदेश
  rationale: स्थान-नाम को बिना किसी ऐसे अतिरिक्त विशेषण के लिप्यंतरित किया गया है जो इब्रानी पाठ में नहीं है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ लेवीय नगर के आसपास पशुओं के चरने और सामुदायिक उपयोग के लिए निर्धारित खुले भूभाग को दर्शाता है; ‘चरागाहें’ आधुनिक हिन्दी में स्पष्ट और संदर्भानुकूल है। स्त्रीलिंग एकवचन प्रत्यय प्रत्येक नगर की ओर संकेत करता है।
- source_word: דָּבְרַת
  choice: दाबरत
  rationale: इब्रानी व्यंजन और स्वर-परंपरा के निकट स्थान-नाम का हिन्दी लिप्यंतरण; वैकल्पिक प्रचलित वर्तनी पादटिप्पणी में दी गई है।
theological_decisions: []
