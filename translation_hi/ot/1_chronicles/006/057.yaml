  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सूची की इब्रानी संरचना को स्पष्ट करने के लिए द्विबिंदु लगाया गया है। पादटिप्पणी-चिह्न को संबंधित स्थान-नाम ‘दाबरत’ के साथ रखा गया है।
