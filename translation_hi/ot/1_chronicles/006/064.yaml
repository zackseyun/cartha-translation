lexical_decisions:
- source_word: קְדֵמוֹת
  choice: केदेमोत
  rationale: स्थान-नाम को अनुवादित करने के बजाय हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से जुड़ी खुली भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था। स्त्रीलिंग एकवचन प्रत्यय को प्रत्येक नगर के संदर्भ में ‘उसकी’ से व्यक्त किया गया है।
- source_word: מֵיפַעַת
  choice: मेपात
  rationale: स्थान-नाम का हिब्रू रूप देवनागरी में लिप्यंतरित किया गया है; פ को यहाँ ‘प’ से दर्शाया गया है।
- source_word: וְאֶת ... וְאֶת
  choice: और ... तथा
  rationale: संयोजक वाव और प्रत्यक्ष कर्म-चिह्न की आवृत्ति सूची की संरचना बनाती है। हिंदी में ‘और/तथा’ से इसका योगात्मक बल सहज रूप में बना रहता है।
