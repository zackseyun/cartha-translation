translation:
  language: hi
  text: महली का पुत्र, मूशी का पुत्र, मरारी का पुत्र, लेवी का पुत्र।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशावली में बार-बार आया בֶּן प्रत्यक्ष पितृ-पुत्र संबंध का सामान्य सूत्र है। यद्यपि इब्रानी वंशावलियों में कभी-कभी पीढ़ियाँ छोड़ी जा सकती हैं, इस क्रम में अर्थ को व्यापक करके ‘वंशज’ करने की आवश्यकता नहीं है।
- source_word: מַחְלִי
  choice: महली
  rationale: व्यक्तिनाम का देवनागरी में ऐसा लिप्यंतरण किया गया है जो इब्रानी उच्चारण के निकट और हिन्दी पाठक के लिए सहज है।
- source_word: מוּשִׁי
  choice: मूशी
  rationale: व्यक्तिनाम מוּשִׁי में दीर्घ ऊ और श ध्वनि को स्पष्ट रखने के लिए ‘मूशी’ चुना गया है।
- source_word: מְרָרִי
  choice: मरारी
  rationale: इब्रानी व्यक्तिनाम का ध्वन्यात्मक रूप से निकट देवनागरी लिप्यंतरण।
- source_word: לֵוִי
  choice: लेवी
  rationale: यहाँ नाम कुलपिता लेवी को सूचित करता है; हिन्दी बाइबल परंपरा में प्रचलित रूप ‘लेवी’ रखा गया है।
