  register: भाषा आधुनिक, गरिमापूर्ण और सूची-वर्णन के अनुकूल रखी गई है। ‘कुल,’ ‘गोत्र’ और ‘क्षेत्र’ सामान्य हिन्दी बाइबलीय शब्दावली से मेल खाते हैं। स्रोत पद की व्याकरणिक अपूर्णता को पिछले संदर्भ के आधार पर सहज हिन्दी में व्यक्त किया गया है, और वैकल्पिक शाब्दिक रूप पादटिप्पणियों में सुरक्षित रखा गया है।
