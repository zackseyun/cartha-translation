base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/051.yaml
  text: And from the families of the sons of Kohath[b][a], the cities of their territory were from the tribe of Ephraim.
translation:
  language: hi
  text: और कहात के पुत्रों के कुलों में से, उनके क्षेत्र के नगर एप्रैम के गोत्र में से थे।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहात के पुत्रों के कुलों में से।” ‘कुल’ का अर्थ वंशगत परिवार-समूह या गोत्रीय कुल भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनकी सीमा के नगर” या “उनके सीमावर्ती भूभाग के नगर”; इब्रानी गेवूल का अर्थ “सीमा,” “सीमावर्ती भूभाग,” या “क्षेत्र” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִמִּשְׁפְּחוֹת
  choice: और ... के कुलों को
  rationale: מִשְׁפָּחוֹת वंशगत परिवार-समूहों या कुलों को दर्शाता है। हिन्दी में ‘कुल’ इस गोत्रीय संदर्भ में स्वाभाविक है। पद के खंडित सूची-वाक्य को पिछले संदर्भ से जोड़कर समझने के कारण संबंधबोधक מִן को प्राप्तकर्ता के रूप में ‘को’ से व्यक्त किया गया है; शाब्दिक ‘में से’ का विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּנֵי קְהָת
  choice: कहात के पुत्रों
  rationale: शाब्दिक वंशावली अभिव्यक्ति ‘कहात के पुत्र’ को बनाए रखा गया है; संदर्भ में इसमें उनके वंशज भी सम्मिलित हैं।
- source_word: וַיְהִי
  choice: मिले
  rationale: नगर-वितरण के संदर्भ में היה का आशय इन नगरों का उनके हिस्से में होना है। प्राकृतिक हिन्दी के लिए ‘मिले’ चुना गया, जबकि स्रोत का अस्तित्वसूचक रूप पादटिप्पणी में दिया गया है।
- source_word: עָרֵי גְבוּלָם
  choice: उनके क्षेत्र के नगर
  rationale: גְבוּל का अर्थ सीमा, सीमावर्ती भूभाग या क्षेत्र हो सकता है। यहाँ लेवीय नगरों के आवंटन के संदर्भ में ‘क्षेत्र’ सबसे स्वाभाविक है, पर वास्तविक शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: מִמַּטֵּה אֶפְרָיִם
  choice: एप्रैम के गोत्र में से
  rationale: भूमि और नगरों के वितरण के प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है। מִן के स्रोत/चयन के भाव को ‘में से’ स्पष्ट रूप से व्यक्त करता है।
