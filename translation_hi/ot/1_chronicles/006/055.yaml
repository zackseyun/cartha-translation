  text: וּ/מִֽ/מַּחֲצִית֙ מַטֵּ֣ה מְנַשֶּׁ֔ה אֶת עָנֵר֙ וְ/אֶת מִגְרָשֶׁ֔י/הָ וְ/אֶת בִּלְעָ֖ם וְ/אֶת מִגְרָשֶׁ֑י/הָ לְ/מִשְׁפַּ֥חַת לִ/בְנֵי קְהָ֖ת הַ/נּוֹתָרִֽים־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/055.yaml
  text: 'And from the half-tribe of Manasseh: Aner with its pasturelands[a], and Bileam with its pasturelands, for the clan of the remaining sons of Kohath.'
translation:
  language: hi
  text: और मनश्शे के आधे गोत्र में से आनेर और उसकी चरागाहें, तथा बिलाम[a] और उसकी चरागाहें, कहात के शेष पुत्रों के कुल के लिए दी गईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘बिलाम’ है; यहोशू 21:25 के समानांतर वर्णन में ‘यिबलाम’ है।
    reason: textual_variant
lexical_decisions:
- source_word: וּמִמַּחֲצִית מַטֵּה מְנַשֶּׁה
  choice: और मनश्शे के आधे गोत्र में से
  rationale: מַחֲצִית का अर्थ ‘आधा भाग’ और מַטֶּה का अर्थ इस भू-विभाजन प्रसंग में ‘गोत्र’ है; यह हिंदी में स्वाभाविक और सटीक है।
- source_word: אֶת עָנֵר
  choice: आनेर
  rationale: स्थान-नाम को उसके इब्रानी रूप के अनुसार देवनागरी में लिप्यंतरित किया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से लगी खुली भूमि, विशेषकर पशु चराने की भूमि, को दर्शाता है; लेवीय नगरों के संदर्भ में ‘चरागाहें’ स्पष्ट है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: मसोरेटिक पाठ में उपलब्ध नाम בִּלְעָם को ही मुख्य पाठ में लिप्यंतरित किया गया है; समानांतर पाठ का भिन्न रूप पादटिप्पणी में रखा गया है।
- source_word: לְמִשְׁפַּחַת לִבְנֵי קְהָת הַנּוֹתָרִים
  choice: कहात के शेष पुत्रों के कुल के लिए
  rationale: מִשְׁפָּחָה यहाँ एक सामूहिक पारिवारिक समूह या कुल है, और הַנּוֹתָרִים उन कहाती पुत्रों को सूचित करता है जिन्हें पहले के बँटवारे में सम्मिलित नहीं किया गया था।
theological_decisions: []
