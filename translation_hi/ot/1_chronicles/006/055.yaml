  register: भाषा आधुनिक, गरिमापूर्ण और सूची-सदृश ऐतिहासिक संदर्भ के अनुकूल रखी गई है। इब्रानी वाक्य में क्रिया निहित है; हिंदी में वाक्य पूरा और स्वाभाविक बनाने के लिए ‘दी गईं’ जोड़ा गया है। पादटिप्पणी-चिह्न को संबंधित स्थान-नाम ‘बिलाम’ के साथ रखा गया है।
