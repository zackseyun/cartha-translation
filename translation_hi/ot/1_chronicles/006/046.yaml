base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/046.yaml
  text: And to the sons of Kohath[a] who remained, from the families of the tribe, from the half-tribe, the half of Manasseh, ten cities were given by lot.
translation:
  language: hi
  text: और कहात के शेष वंशजों को[a], मनश्शे के आधे गोत्र के कुलों में से, चिट्ठी डालकर दस नगर दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यह पदबंध सूत्रात्मक और पुनरुक्त है: “गोत्र के कुल में से, आधे गोत्र में से, मनश्शे के आधे गोत्र में से।” आशय मनश्शे के आधे गोत्र से है।'
    reason: मूल इब्रानी की पुनरुक्त संरचना और उसके संदर्भगत आशय—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת הַנּוֹתָרִים
  choice: और कहात के शेष वंशजों को
  rationale: בְּנֵי का वंशावली-संबंधी सामूहिक अर्थ यहाँ केवल प्रत्यक्ष पुत्र नहीं, बल्कि कहाती वंशज है; הַנּוֹתָרִים को स्वाभाविक हिन्दी में ‘शेष’ रखा गया है।
- source_word: מִ/מִּשְׁפַּחַת הַ/מַּטֶּה מִֽ/מַּחֲצִית מַטֵּה חֲצִי מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र के कुलों में से
  rationale: इब्रानी पदबंध सूत्रात्मक और कुछ पुनरुक्त है। सन्दर्भगत अर्थ मनश्शे के आधे गोत्र के कुल हैं; मुख्य पाठ में इसे स्पष्ट, स्वाभाविक हिन्दी में दिया और शब्दशः पुनरुक्ति को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בַּ/גּוֹרָל
  choice: चिट्ठी डालकर
  rationale: גוֹרָל यहाँ नगरों के आवंटन के लिए चिट्ठी डालने की प्रथा को सूचित करता है; यह आधुनिक पाठक के लिए ‘चिट्ठी से’ की अपेक्षा अधिक स्पष्ट है।
- source_word: עָרִים עָשֶׂר
  choice: दस नगर दिए गए
  rationale: इब्रानी में क्रिया व्यक्त नहीं है, पर वितरण-सूची के प्रसंग से ‘दिए गए’ निहित है; עָרִים का सामान्य अनुवाद ‘नगर’ है।
