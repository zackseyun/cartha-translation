  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘उसके’ का संदर्भ मूल इब्रानी की तरह प्रसंग पर निर्भर रहने दिया गया है; किसी नाम को जोड़कर उसे अनावश्यक रूप से निश्चित नहीं किया गया।
