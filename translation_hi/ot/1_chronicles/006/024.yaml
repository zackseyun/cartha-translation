base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/024.yaml
  text: 'And his brother Asaph stood at his right hand: Asaph son of Berechiah[a], son of Shimea.'
translation:
  language: hi
  text: और उसका भाई आसाप उसके दाहिनी ओर खड़ा था—आसाप, बेरेक्याह का पुत्र, शिमा का पुत्र।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאָחִיו
  choice: और उसका भाई
  rationale: וְ का सामान्य अर्थ ‘और’ है और אָחִיו का सीधा अर्थ ‘उसका भाई’ है। व्यापक अर्थ ‘कुटुम्बी’ संभव है, पर संदर्भ उसे आवश्यक नहीं बनाता।
- source_word: אָסָף
  choice: आसाप
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण; पद में जहाँ नाम दो बार आया है, वहाँ दोनों बार रखा गया है।
- source_word: הָעֹמֵד
  choice: खड़ा था
  rationale: עמד का कालवाचक कृदंत यहाँ स्थिति या नियुक्त स्थान बताता है; सहज हिन्दी में ‘खड़ा था’ मूल भाव बनाए रखता है।
- source_word: עַל יְמִינוֹ
  choice: उसके दाहिनी ओर
  rationale: यह इब्रानी पदबंध किसी व्यक्ति के दाहिने पार्श्व में स्थित होने का बोध कराता है। हिन्दी में ‘दाहिनी ओर’ स्वाभाविक है और अस्पष्ट सर्वनाम ‘उसके’ को भी सुरक्षित रखता है।
- source_word: בֶּן בֶּרֶכְיָהוּ בֶּן שִׁמְעָא
  choice: बेरेक्याह का पुत्र और शिमा का पोता
  rationale: इब्रानी वंशावली सूत्र का शाब्दिक रूप ‘बेरेक्याह का पुत्र, शिमा का पुत्र’ है। प्राकृतिक हिन्दी में दूसरे संबंध को ‘शिमा का पोता’ कहने से वही वंशक्रम स्पष्ट होता है, बिना सूचना बदले।
- source_word: בֶּרֶכְיָהוּ
  choice: बेरेक्याह
  rationale: इब्रानी नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
- source_word: שִׁמְעָא
  choice: शिमा
  rationale: इब्रानी नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
theological_decisions: []
