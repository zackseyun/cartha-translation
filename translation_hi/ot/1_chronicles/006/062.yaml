  text: לִ/בְנֵ֣י מְרָרִי֮ הַ/נּוֹתָרִים֒ מִ/מַּטֵּ֣ה זְבוּלֻ֔ן אֶת רִמּוֹנ֖וֹ וְ/אֶת מִגְרָשֶׁ֑י/הָ אֶת תָּב֖וֹר וְ/אֶת מִגְרָשֶֽׁי/הָ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/062.yaml
  text: 'To the sons of Merari who remained[a], from the tribe of Zebulun: Rimmono and its pasturelands, Tabor and its pasturelands.'
translation:
  language: hi
  text: मरारी के शेष वंशजों को जबूलून के गोत्र से रिम्मोनो[a] और उसके चरागाहों सहित, तथा ताबोर और उसके चरागाहों सहित मिले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘रिम्मोनो’ है; यहोशू 21:35 की समानांतर सूची में ‘दिम्ना’ है।
    reason: textual_variant
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי הַנּוֹתָרִים
  choice: मरारी के शेष वंशजों को
  rationale: לִבְנֵי में लगा לְ नगरों के आवंटन को सूचित करता है। בְּנֵי का वंश-सूची के संदर्भ में स्वाभाविक हिन्दी रूप ‘वंशज’ है, और הַנּוֹתָרִים उन शेष लोगों को दर्शाता है जिन्हें पहले के आवंटनों के बाद नगर मिलने थे।
- source_word: מִמַּטֵּה זְבוּלֻן
  choice: जबूलून के गोत्र में से
  rationale: इस आवंटन-सूची में מַטֶּה का अर्थ भौतिक ‘लाठी’ नहीं, बल्कि ‘गोत्र’ है। ‘में से’ नगरों के उस गोत्र के भूभाग से लिए जाने का भाव व्यक्त करता है।
- source_word: רִמּוֹנוֹ
  choice: रिम्मोनो
  rationale: मसोरेटिक इब्रानी पाठ में यही स्थान-नाम है; समानांतर सूची के भिन्न पाठ को मुख्य पाठ में मिलाए बिना पादटिप्पणी में बताया गया है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसके चरागाह
  rationale: लेवीय नगरों के संदर्भ में מִגְרָשׁ नगर से जुड़ी खुली भूमि, विशेषकर पशुओं के चरने की भूमि, को दर्शाता है; ‘चरागाह’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: תָּבוֹר
  choice: ताबोर
  rationale: यहाँ यह नगर का व्यक्तिवाचक नाम है, इसलिए इसका लिप्यंतरण किया गया है; इसे स्वतः ताबोर पर्वत नहीं माना गया।
- source_word: לִבְנֵי... אֶת
  choice: को ... मिले
  rationale: इब्रानी में इस सूची का क्रियापद संदर्भ से समझा जाता है। हिन्दी में पूर्ण और स्वाभाविक वाक्य के लिए ‘मिले’ जोड़ा गया है, जो नगरों के आवंटन का निहित भाव स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शेष वंशजों’ से सूची का क्रमिक भाव सुरक्षित रहता है। स्थान-नामों का देवनागरी में निकट लिप्यंतरण किया गया है और पाठांतर को मुख्य पाठ बदलने के बजाय पादटिप्पणी में रखा गया है।
