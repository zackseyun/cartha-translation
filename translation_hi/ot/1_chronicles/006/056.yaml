base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/056.yaml
  text: 'To the sons of Gershom[a], from the clan of the half-tribe of Manasseh: Golan in Bashan with its pasturelands, and Ashtaroth with its pasturelands.'
translation:
  language: hi
  text: गेर्शोम के पुत्रों को मनश्शे के आधे गोत्र के कुल में से बाशान में गोलान और उसकी चरागाहें[a], तथा अश्तारोत और उसकी चरागाहें मिलीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी सामुदायिक खुली भूमि’; इब्रानी शब्द नगर से जुड़ी उस खुली भूमि को दर्शाता है जिसका उपयोग प्रायः पशु चराने के लिए होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גֵּרְשׁוֹם
  choice: गेर्शोम के वंशजों को
  rationale: ल उपसर्ग आवंटन पाने वाले पक्ष को सूचित करता है। इस वंशावली-संदर्भ में ‘वंशज’ आधुनिक हिन्दी में ‘पुत्रों’ की अपेक्षा अभिप्रेत विस्तृत वंश-समूह को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִמִּשְׁפַּחַת
  choice: कुल में से
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के कुल अथवा वंश-समूह को दर्शाता है; ‘कुल’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: חֲצִי מַטֵּה מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र
  rationale: מַטֶּה का इस जनजातीय संदर्भ में प्रचलित हिन्दी समतुल्य ‘गोत्र’ है; ‘आधा गोत्र’ मनश्शे के क्षेत्रीय विभाजन को बनाए रखता है।
- source_word: אֶת גּוֹלָן בַּבָּשָׁן
  choice: बाशान का गोलान
  rationale: यह गोलान नगर को बाशान क्षेत्र में स्थित बताता है। हिन्दी में ‘बाशान का गोलान’ सूचीगत शैली में सहज है।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहें
  rationale: מִגְרָשׁ नगर से लगी खुली सामुदायिक भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था; ‘चरागाहें’ ठोस और सामान्य पाठक के लिए स्पष्ट है।
- source_word: עַשְׁתָּרוֹת
  choice: अश्तारोत
  rationale: यह इब्रानी स्थान-नाम का निकट और हिन्दी में उच्चारणयोग्य लिप्यंतरण है।
- source_word: וְאֶת ... וְאֶת
  choice: और ... तथा ... और
  rationale: दो नगरों और उनसे संबद्ध भूमियों की समानांतर सूची को स्वाभाविक हिन्दी समन्वय के साथ सुरक्षित रखा गया है।
