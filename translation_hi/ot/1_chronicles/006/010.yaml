lexical_decisions:
- source_word: וּ/בְנֵי
  choice: और ... के पुत्र
  rationale: वाव को वंशावली की क्रमबद्धता बनाए रखने के लिए ‘और’ से व्यक्त किया गया है; संबंधसूचक रचना בְנֵי אֶלְקָנָה का स्वाभाविक हिन्दी रूप ‘एलकाना के पुत्र’ है।
- source_word: אֶלְקָנָה
  choice: एलकाना
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: עֲמָשַׂי
  choice: अमासै
  rationale: व्यक्तिवाचक नाम का इब्रानी स्वरूप के निकट देवनागरी लिप्यंतरण। अंग्रेज़ी वर्तनी के वैकल्पिक रूप का हिन्दी पाठ पर कोई सार्थक प्रभाव नहीं पड़ता।
- source_word: וַ/אֲחִימוֹת
  choice: और अहीमोत
  rationale: उपसर्ग וַ को ‘और’ से व्यक्त किया गया है तथा नाम को इब्रानी उच्चारण के निकट ‘अहीमोत’ लिप्यंतरित किया गया है।
