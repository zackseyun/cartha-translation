  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। मूल की संक्षिप्त वंशावली-शैली सुरक्षित है; आरंभिक संबंध को हिन्दी में स्पष्ट करने के लिए ‘के वंश में’ जोड़ा गया है।
