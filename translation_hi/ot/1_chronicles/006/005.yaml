  yaml_path: translation/ot/1_chronicles/006/005.yaml
  text: 'To Gershom: Libni his son, Jahath his son, Zimmah his son.'
translation:
  language: hi
  text: 'गेर्शोम से: लिबनी उसका पुत्र, यहत उसका पुत्र, ज़िम्मा उसका पुत्र।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹם
  choice: गेर्शोम के वंश में
  rationale: उपसर्ग ל यहाँ वंशावली की उस शाखा का परिचय देता है जो गेर्शोम से चली। शाब्दिक ‘गेर्शोम के लिए’ की अपेक्षा ‘गेर्शोम के वंश में’ आधुनिक हिन्दी में आशय स्पष्ट करते हुए सूची की संक्षिप्तता बनाए रखता है।
- source_word: לִבְנִי
  choice: लिबनी
  rationale: यह व्यक्ति का नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: בְנוֹ
  choice: उसका पुत्र
  rationale: संज्ञा בֵּן के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय प्रत्यक्ष पुत्र-संबंध बताता है; ‘उसका पुत्र’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: יַחַת
  choice: यहत
  rationale: यह व्यक्ति का नाम है; हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: זִמָּה
  choice: ज़िम्मा
  rationale: यहाँ यह व्यक्ति का नाम है, इसलिए अन्य संदर्भों में मूल के सामान्य संज्ञा-संबंधी अर्थ को न अपनाकर नाम के रूप में लिप्यंतरित किया गया है।
