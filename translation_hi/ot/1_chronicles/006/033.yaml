lexical_decisions:
- source_word: וַאֲחֵיהֶם
  choice: और उनके भाई
  rationale: वाव को सूची-वर्णन के स्वाभाविक क्रम में “और” रखा गया है; “भाई” इब्रानी संबंध-सूचक शब्द को पारदर्शी रूप से सुरक्षित रखता है, यद्यपि यहाँ व्यापक कुल-संबंधी अर्थ संभव है।
- source_word: הַלְוִיִּם
  choice: लेवीय
