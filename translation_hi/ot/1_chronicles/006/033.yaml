- source_word: נְתוּנִים
  choice: नियुक्त किए गए थे
  rationale: शाब्दिक अर्थ “दिए हुए” है, पर इस सेवागत संदर्भ में कर्तव्य के लिए नियोजन अभिप्रेत है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְכָל עֲבוֹדַת
  choice: सारी सेवा के लिए
  rationale: ל उद्देश्य/कार्य-क्षेत्र और כָל सेवा की संपूर्णता दर्शाते हैं; עֲבוֹדָה को उपासना-संबंधी कार्य के अर्थ में “सेवा” कहा गया है।
- source_word: מִשְׁכַּן
  choice: निवास-स्थान
  rationale: यह मूल शब्द के “निवास” अर्थ को स्पष्ट रखता है और अगले पदबंध “परमेश्वर का भवन” से उसे अलग बनाए रखता है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर का भवन
  rationale: इब्रानी के शाब्दिक “परमेश्वर का घर/भवन” को सुरक्षित रखा गया है; “मन्दिर” कहने से मूल के दो अलग स्थापत्य-संबंधी पद एक में समा सकते थे।
theological_decisions:
- issue: “निवास-स्थान” और “परमेश्वर का भवन” का परस्पर संबंध
  choice: दोनों पदों को अलग रखते हुए “परमेश्वर के भवन के निवास-स्थान” अनूदित किया गया।
  alternative: केवल “परमेश्वर का मन्दिर” या “परमेश्वर के भवन” कहना।
  rationale: इब्रानी में מִשְׁכַּן और בֵּית הָאֱלֹהִים दोनों उपस्थित हैं। दोनों को बनाए रखने से इतिहासकार के तम्बू/निवास और भवन संबंधी शब्दों के बीच की वास्तविक पाठगत कसावट नहीं मिटती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “लेवीय” और “सेवा” उपासना-संबंधी ऐतिहासिक संदर्भ के उपयुक्त प्रचलित पद हैं; मूल के दोनों विशिष्ट पदों को सुरक्षित रखने के लिए “निवास-स्थान” और “भवन” अलग-अलग रखे गए हैं।
