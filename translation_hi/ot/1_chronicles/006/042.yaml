base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/042.yaml
  text: 'And to the sons of Aaron they gave the cities of refuge: Hebron[a], and Libnah with its pasturelands, and Jattir, and Eshtemoa with its pasturelands.'
translation:
  language: hi
  text: 'और हारून के पुत्रों को उन्होंने शरण-नगर दिए: हेब्रोन, लिब्ना उसकी आसपास की खुली भूमि[a] समेत, यत्तीर, और एश्तमोआ उसकी आसपास की खुली भूमि समेत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी साझी खुली भूमि’; इब्रानी शब्द नगर से लगी और उसी की मानी जाने वाली खुली भूमि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי אַהֲרֹן
  choice: और हारून के पुत्रों को
  rationale: לְ प्राप्तकर्ता को सूचित करता है; इसलिए ‘को’ स्वाभाविक और मूल के निकट है। वंशगत संदर्भ में בְּנֵי का सीधा अर्थ ‘पुत्रों’ रखा गया है।
- source_word: נָתְנוּ
  choice: उन्होंने ... दिए
  rationale: נתן का सामान्य अर्थ ‘देना’ है। नगरों के आवंटन के संदर्भ में भी यह सहज और स्पष्ट है।
- source_word: עָרֵי הַמִּקְלָט
  choice: शरण-नगर
  rationale: यह व्यवस्था में निर्दिष्ट उन नगरों का पारिभाषिक नाम है जहाँ शरण ली जा सकती थी। ‘शरण-नगर’ संक्षिप्त, स्पष्ट और आधुनिक हिंदी में बोधगम्य है।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: इब्रानी स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: לִבְנָה
  choice: लिब्ना
  rationale: इब्रानी स्थान-नाम का निकट लिप्यंतरण।
- source_word: מִגְרָשֶׁיהָ
  choice: उसकी चरागाहों
  rationale: מִגְרָשׁ नगर से लगी उसकी खुली भूमि को दर्शाता है, जिसका उपयोग विशेषतः पशु चराने के लिए होता था। स्त्रीलिंग एकवचन प्रत्यय का संबंध ठीक पहले आए नगर से है।
- source_word: יַתִּר
  choice: यत्तीर
  rationale: इब्रानी स्थान-नाम का निकट लिप्यंतरण।
- source_word: אֶשְׁתְּמֹעַ
  choice: एश्तमोआ
  rationale: इब्रानी स्थान-नाम का निकट और पठनीय हिंदी लिप्यंतरण।
