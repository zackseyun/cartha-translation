  text: These were their dwelling places according to their settlements within their territory[a], for the sons of Aaron, of the family of the Kohathites; for the lot was theirs.
translation:
  language: hi
  text: ये उनके निवास-स्थान थे, उनकी बस्तियों[a] के अनुसार, उनके क्षेत्र के भीतर—हारून के वंशजों के लिए, जो कहाती कुल के थे; क्योंकि चिट्ठी उन्हीं की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी छावनियों के अनुसार” अथवा “उनके गाँवों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מוֹשְׁבוֹתָם
  choice: उनके निवास-स्थान
  rationale: यह पद रहने के स्थानों को ठोस रूप में दर्शाता है; ‘निवास-स्थान’ आधुनिक, स्पष्ट और गरिमापूर्ण है।
- source_word: לְטִירוֹתָם
  choice: उनकी बस्तियों के अनुसार
  rationale: טִירָה बस्ती, छावनी या घिरे हुए गाँव को सूचित कर सकता है। भूमि-विभाजन के प्रसंग में ‘बस्तियाँ’ स्वाभाविक है और किसी एक अधिक विशिष्ट अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בִּגְבוּלָם
  choice: उनके क्षेत्र के भीतर
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, बल्कि उसके भीतर के भू-भाग को दर्शाता है; इसलिए ‘क्षेत्र के भीतर’ हिंदी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִבְנֵי אַהֲרֹן
  choice: हारून के वंशजों के लिए
  rationale: वंशावली और भूमि-विभाजन के इस प्रसंग में בָּנִים का आशय बाद की पीढ़ियों सहित वंशजों से है; ‘वंशज’ आधुनिक हिंदी में भ्रम से बचाता है।
- source_word: לְמִשְׁפַּחַת הַקְּהָתִי
  choice: कहाती कुल के
  rationale: यह पद हारून के वंशजों की व्यापक कहाती कुल-संबद्धता बताता है। ‘कहाती कुल के’ संक्षिप्त और स्वाभाविक है।
- source_word: כִּי לָהֶם הָיָה הַגּוֹרָל
  choice: क्योंकि चिट्ठी उन्हीं की थी
  rationale: हिब्रू में क्रिया ‘गिरी’ नहीं है, बल्कि चिट्ठी के उनके होने की बात है। यह अनुवाद मूल की संरचना और भूमि-विभाजन की चिट्ठी वाली छवि दोनों बनाए रखता है।
