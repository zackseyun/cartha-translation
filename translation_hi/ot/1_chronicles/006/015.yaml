- source_word: חַגִּיָּה
  choice: हग्गियाह
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित लिप्यंतरण; अंतिम יָה घटक को ‘याह’ से व्यक्त किया गया है।
- source_word: עֲשָׂיָה
  choice: असायाह
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित देवनागरी लिप्यंतरण; अंतिम יָה घटक सुरक्षित रखा गया है।
