base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/006/048.yaml
  text: To the sons of Merari, according to their clans, from the tribe of Reuben, from the tribe of Gad, and from the tribe of Zebulun, twelve cities by lot.
translation:
  language: hi
  text: मरारी के वंशजों को उनके कुलों के अनुसार रूबेन के गोत्र, गाद के गोत्र और जबूलून के गोत्र में से चिट्ठी डालकर बारह नगर मिले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי מְרָרִי
  choice: मरारी के वंशजों को
  rationale: यहाँ בני वंशगत समूह को सूचित करता है; स्वाभाविक आधुनिक हिन्दी में ‘वंशज’ अर्थ को स्पष्ट रखता है, जबकि ל allotment के प्राप्तकर्ताओं को चिह्नित करता है।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: भूमि-वितरण के प्रसंग में מִשְׁפָּחָה व्यापक परिवार से अधिक एक कुलगत उपसमूह को दर्शाता है; ‘कुल’ हिन्दी में उपयुक्त और गरिमापूर्ण है।
- source_word: מִמַּטֵּה
  choice: के गोत्र ... में से
  rationale: जनगणना और आवंटन के प्रसंग में מַטֶּה का अर्थ इस्राएली ‘गोत्र’ है; מִן स्रोत को दर्शाता है।
- source_word: רְאוּבֵן / גָד / זְבוּלֻן
  choice: रूबेन / गाद / जबूलून
  rationale: हिब्रू नामों के प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाए गए हैं।
- source_word: בַּגּוֹרָל
  choice: चिट्ठी डालकर
  rationale: यह आवंटन की विधि बताता है। ‘चिट्ठी डालकर’ आधुनिक हिन्दी में ‘lot’ की क्रिया और अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָרִים שְׁתֵּים עֶשְׂרֵה
  choice: बारह नगर
  rationale: עִיר के लिए ‘नगर’ पारंपरिक, सहज और इस आवंटन-सूची के अनुकूल है; संख्या को स्वाभाविक हिन्दी क्रम में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य। हिब्रू का खंडित नामसूची-विन्यास हिन्दी में पूर्ण वाक्य बनाने के लिए ‘मिले’ से स्पष्ट किया गया है; इससे आवंटन का निहित अर्थ व्यक्त होता है, कोई नया धार्मिक निष्कर्ष नहीं जोड़ा जाता।
