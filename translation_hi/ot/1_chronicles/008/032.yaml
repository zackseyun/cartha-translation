  text: Mikloth fathered Shimeah[a]. They too lived opposite their brothers in Jerusalem[b], with their brothers.
translation:
  language: hi
  text: और मिक्लोत शिमआ का पिता हुआ। वे भी यरूशलेम में अपने भाइयों के आमने-सामने[a], अपने भाइयों के साथ रहते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने भाइयों के सामने” या “अपने भाइयों के निकट”; इब्रानी शब्द किसी के सामने, आमने-सामने, या निकट होने का बोध करा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से संभवतः बिन्यामीन के वंश में एक ही कुल के सदस्य या संबंधी अभिप्रेत हैं, केवल सगे भाई नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִקְלוֹת
  choice: और मिक्लोत
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है और आरंभिक संयोजक וּ को ‘और’ से व्यक्त किया गया है, क्योंकि यह वंशावली की पिछली कड़ी से संबंध बनाए रखता है।
- source_word: הוֹלִיד אֶת שִׁמְאָה
  choice: शिमआ का पिता हुआ
  rationale: हिफ़ील वंशावली क्रिया का पुरुष-जनक संबंध स्पष्ट रखते हुए ऐसा आधुनिक हिन्दी रूप चुना गया है जो ‘जन्म दिया’ से उत्पन्न संभावित जैविक असहजता से बचता है।
- source_word: וְאַף הֵמָּה
  choice: वे भी
  rationale: यह संक्षिप्त और स्वाभाविक रूप संयोजक तथा समावेशी बल—‘वे भी’—दोनों को व्यक्त करता है।
- source_word: נֶגֶד
  choice: सामने
  rationale: मूल शब्द की स्थानसूचक धारणा—सामने या आमने-सामने—को सुरक्षित रखा गया है; निकटता की संभावित छाया को टिप्पणी में दिया गया है।
- source_word: אֲחֵיהֶם
  choice: अपने भाइयों
  rationale: मूल का शाब्दिक संबंध बनाए रखा गया है। वंशावली के संदर्भ में इसके व्यापक कुल-संबंधी अर्थ की जानकारी टिप्पणी में दी गई है।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: निवास बताने वाली क्रिया का सहज आधुनिक हिन्दी रूप है।
- source_word: בִירוּשָׁלִַם
  choice: यरूशलेम में
  rationale: स्थाननाम का प्रचलित हिन्दी रूप और अधिकरण कारक प्रयुक्त है।
- source_word: עִם אֲחֵיהֶם
  choice: अपने भाइयों के साथ
  rationale: עִם का सीधा अर्थ ‘के साथ’ रखा गया है और मूल में ‘भाइयों’ की पुनरावृत्ति भी सुरक्षित है।
