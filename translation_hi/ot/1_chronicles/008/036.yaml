  text: और आहाज, यहोअद्दा[a] का पिता था; यहोअद्दा आलेमेत, अज़मावेत और ज़िम्री का पिता था; और ज़िम्री मोसा का पिता था।
  philosophy: optimal-equivalence
  footnotes:
