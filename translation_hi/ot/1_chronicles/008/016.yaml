- source_word: וּ/מִיכָאֵל
  choice: और मीकाएल
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण-सन्निकट देवनागरी लिप्यंतरण किया गया है और उपसर्ग וּ को ‘और’ से व्यक्त किया गया है।
- source_word: וְ/יִשְׁפָּה
  choice: यिश्पा
  rationale: आरंभिक योध को ‘य’ से और שׁ को ‘श’ से दर्शाते हुए नाम का सहज हिंदी लिप्यंतरण किया गया है; सूची में संयोजक को स्वाभाविक हिंदी शैली के अनुसार अंतिम दो नामों के बीच रखा गया है।
- source_word: וְ/יוֹחָא
  choice: योहा
  rationale: हिब्रू नाम יוֹחָא का उच्चारण-सन्निकट हिंदी लिप्यंतरण है।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: वंशावली के इस संदर्भ में शब्द सीधे पुरुष संतानों को सूचित करता है; इसलिए व्यापक ‘सन्तान’ के बजाय ‘पुत्र’ चुना गया है।
- source_word: בְרִיעָה
  choice: बरीआ
  rationale: हिब्रू व्यंजन और स्वरों के निकट रहते हुए नाम को आधुनिक हिंदी पाठक के लिए सहज रूप में लिखा गया है।
