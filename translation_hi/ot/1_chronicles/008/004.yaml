lexical_decisions:
- source_word: וַ/אֲבִישׁוּעַ
  choice: और अबीशूअ
  rationale: उपसर्ग וַ को वंशावली की जारी सूची दिखाने के लिए ‘और’ से व्यक्त किया गया है। व्यक्ति के नाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְ/נַעֲמָן
  choice: नामान
  rationale: नाम को हिब्रू נַעֲמָן के उच्चारण के निकट लिप्यंतरित किया गया है। स्वाभाविक हिन्दी सूची-शैली में इसके पहले का संयोजक अलग से दोहराना आवश्यक नहीं है।
- source_word: וַ/אֲחוֹחַ
  choice: और अहोह
  rationale: अंतिम नाम से पहले וַ को ‘और’ से व्यक्त किया गया है। אֲחוֹחַ का ‘अहोह’ लिप्यंतरण मूल व्यंजन और अंतिम हल्के कंठ्य उच्चारण के निकट है।
