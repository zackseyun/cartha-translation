source:
  edition: WLC
  text: וְ/נֵר֙ הוֹלִ֣יד אֶת קִ֔ישׁ וְ/קִ֖ישׁ הוֹלִ֣יד אֶת שָׁא֑וּל וְ/שָׁא֗וּל הוֹלִ֤יד אֶת יְהֽוֹנָתָן֙ וְ/אֶת מַלְכִּי שׁ֔וּעַ וְ/אֶת אֲבִֽינָדָ֖ב וְ/אֶת אֶשְׁבָּֽעַל־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/033.yaml
  text: Ner fathered Kish[a], and Kish fathered Saul, and Saul fathered Jonathan, Malchi-shua, Abinadab, and Eshbaal.
translation:
  language: hi
  text: नेर कीश का पिता था, कीश शाऊल का पिता था, और शाऊल योनातान, मल्कीशूआ, अबीनादाब और एशबाल[a] का पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 2 शमूएल में एशबाल को ईशबोशेत कहा गया है।
    reason: वैकल्पिक नाम-रूप की जानकारी
lexical_decisions:
- source_word: הוֹלִיד
  choice: का पिता हुआ
  rationale: वंशावली में हिफ़ील रूप प्रत्यक्ष पुरुष-वंश को व्यक्त करता है। ‘का पिता हुआ’ आधुनिक, स्पष्ट और स्वाभाविक हिन्दी है तथा मूल की वंशावली-संबंधी शक्ति बनाए रखता है।
- source_word: נֵר
  choice: नेर
  rationale: व्यक्तिवाचक नाम का हिन्दी में ध्वन्यात्मक लिप्यंतरण।
- source_word: קִישׁ
  choice: कीश
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित ध्वन्यात्मक रूप।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: हिब्रू उच्चारण के निकट और हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला रूप।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: मूल नाम का सुबोध हिन्दी लिप्यंतरण; यहाँ शाऊल के पुत्र का परिचित नाम अभिप्रेत है।
- source_word: מַלְכִּי שׁוּעַ
  choice: मल्कीशूआ
  rationale: दो घटकों वाले हिब्रू नाम को हिन्दी में एक संयुक्त व्यक्तिवाचक नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֲבִינָדָב
  choice: अबीनादाब
  rationale: हिब्रू नाम का स्पष्ट हिन्दी लिप्यंतरण।
- source_word: אֶשְׁבָּעַל
  choice: एशबाल
  rationale: इतिहास की पुस्तक के हिब्रू पाठ में उपस्थित नाम-रूप को ही मुख्य पाठ में रखा गया है; इसे शमूएल के वैकल्पिक रूप से नहीं मिलाया गया।
theological_decisions:
- issue: शाऊल के अंतिम उल्लिखित पुत्र के नाम का रूप
  choice: मुख्य पाठ में ‘एशबाल’
  alternative: ‘ईशबोशेत’
  rationale: यह सिद्धान्तगत नहीं, बल्कि पाठ और नाम-परम्परा से जुड़ा प्रश्न है। इतिहास का हिब्रू पाठ स्पष्ट रूप से אֶשְׁבָּעַל देता है, इसलिए वही मुख्य पाठ में रखा गया है; पाठक की पहचान के लिए शमूएल में प्रयुक्त नाम पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वंशावली के अनुरूप रखी गई है। नाम मूल हिब्रू से लिप्यंतरित हैं और वाक्य में मूल की क्रमिक वंशावली-संरचना सुरक्षित है।
