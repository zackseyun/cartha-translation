base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/039.yaml
  text: 'The sons of Eshek his brother: Ulam his firstborn[a], Jeush the second, and Eliphelet the third.'
translation:
  language: hi
  text: 'और उसके भाई एशेक के पुत्र ये थे: उसका पहलौठा ऊलाम, दूसरा यऊश और तीसरा एलीपेलेत।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: आरंभिक संयोजक וּ को ‘और’ के रूप में बनाए रखा गया है। संबंधवाचक बहुवचन ‘पुत्र’ को हिन्दी वंशावली की स्वाभाविक वाक्य-रचना के लिए ‘ये थे’ के साथ रखा गया है।
- source_word: עֵשֶׁק
  choice: एशेक
  rationale: व्यक्तिनाम को उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: אָחִיו
  choice: उसके भाई
  rationale: मूल शब्द का सामान्य और सीधा अर्थ ‘उसका भाई’ है। सर्वनाम का पूर्वपद मूल पाठ की तरह प्रसंग पर निर्भर रहने दिया गया है।
- source_word: אוּלָם
  choice: ऊलाम
  rationale: हिब्रू व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: בְּכֹרוֹ
  choice: उसका पहलौठा
  rationale: ‘पहलौठा’ जन्मक्रम और मूल शब्द के विशिष्ट अर्थ को ‘सबसे बड़ा’ की अपेक्षा अधिक ठीक रूप से व्यक्त करता है।
- source_word: יְעוּשׁ
  choice: यऊश
  rationale: हिब्रू व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: जन्मक्रम बताने वाले क्रमवाचक शब्द का सीधा अनुवाद।
- source_word: וֶאֱלִיפֶלֶט
  choice: और एलीपेलेत
  rationale: अंतिम नाम से पहले के संयोजक को स्पष्ट रखा गया है और व्यक्तिनाम को देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַשְּׁלִשִׁי
  choice: तीसरा
  rationale: जन्मक्रम बताने वाले क्रमवाचक शब्द का सीधा अनुवाद।
