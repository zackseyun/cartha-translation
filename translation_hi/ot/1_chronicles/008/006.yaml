id: 1CH.8.6
reference: 1 Chronicles 8:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֖לֶּה בְּנֵ֣י אֵח֑וּד אֵ֣לֶּה הֵ֞ם רָאשֵׁ֤י אָבוֹת֙ לְ/י֣וֹשְׁבֵי גֶ֔בַע וַ/יַּגְל֖וּ/ם אֶל מָנָֽחַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/006.yaml
  text: 'These were the sons of Ehud[a]. These were the heads of fathers’ houses for the inhabitants of Geba[b], and they carried them into exile to Manahath:'
translation:
  language: hi
  text: और ये एहूद के पुत्र थे। ये गेबा के निवासियों के पितृकुलों के मुखिया थे,[a] और उन्होंने उन्हें मानहत में निर्वासित कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पितृकुलों के मुखिया’ से आशय पैतृक वंश पर आधारित कुलों या विस्तृत परिवारों के अगुओं से है।
    reason: cultural_note
  - marker: b
    text: यहाँ ‘उन्होंने’ और ‘उन्हें’ किन समूहों की ओर संकेत करते हैं, यह इब्रानी में स्पष्ट नहीं है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये थे
  rationale: आरंभिक וְ को वंशावली की क्रमबद्धता दिखाने के लिए ‘और’ से रखा गया; हिन्दी में ‘ये ... थे’ स्वाभाविक है।
- source_word: בְּנֵי אֵחוּד
  choice: एहूद के पुत्र
  rationale: בְּנֵי का वंशावली-संबंधी सामान्य और औपचारिक अर्थ ‘पुत्र’ रखा गया; नाम का लिप्यंतरण ‘एहूद’ किया गया।
- source_word: אֵלֶּה הֵם
  choice: ये ... थे
  rationale: इब्रानी के बलाघाती पुनरुक्त संकेत को हिन्दी में दोबारा ‘ये ... थे’ कहकर दर्शाया गया।
- source_word: רָאשֵׁי אָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पैतृक वंश पर आधारित सामाजिक इकाइयों के अगुओं का तकनीकी पद है; ‘पितृकुल’ अर्थ को केवल ‘परिवार’ की अपेक्षा अधिक स्पष्ट रखता है।
- source_word: לְיוֹשְׁבֵי גֶבַע
  choice: गेबा के निवासियों के
  rationale: לְ को यहाँ संबंध/अधिकार के रूप में समझकर सहज हिन्दी संबंधकारक से व्यक्त किया गया है।
- source_word: וַיַּגְלוּם
  choice: और उन्होंने उन्हें निर्वासित करके ... पहुँचा दिया
  rationale: गלה के हिफ़ील रूप में जबरन निर्वासन कराने का भाव है; कर्ता और कर्म दोनों बहुवचन को बनाए रखते हुए हिन्दी में स्वाभाविक क्रिया-रचना चुनी गई।
- source_word: אֶל מָנָחַת
  choice: मानहत पहुँचा दिया
  rationale: אֶל की गंतव्य-दिशा को हिन्दी की संयुक्त क्रिया में व्यक्त किया गया; स्थाननाम का लिप्यंतरण ‘मानहत’ है।
theological_decisions:
- issue: וַיַּגְלוּם में कर्ता और कर्म की पहचान
  choice: ‘उन्होंने उन्हें’ कहकर दोनों सर्वनाम अनिर्दिष्ट रखे गए
  alternative: वंश-मुखियाओं को कर्ता और गेबा के निवासियों को कर्म मानकर स्पष्ट नाम दोहराना
  rationale: इब्रानी पाठ दोनों पक्षों को सर्वनामों से व्यक्त करता है और संदर्भ में पहचान पूरी तरह निर्विवाद नहीं है; अनुवाद में अस्पष्टता को कृत्रिम रूप से नहीं सुलझाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज वंशावली-शैली रखी गई है। तकनीकी सामाजिक पद के लिए ‘पितृकुलों के मुखिया’ चुना गया और मूल की सर्वनामगत अस्पष्टता सुरक्षित रखी गई है।
