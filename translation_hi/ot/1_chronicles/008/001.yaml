translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और वंशावली-पाठ के अनुकूल रखी गई है। ‘बिन्यामीन ने जन्म दिया’ जैसी जैविक रूप से अस्वाभाविक हिन्दी के बजाय ‘के पुत्र थे’ का प्रयोग किया गया है, जबकि ‘पहलौठा’, ‘दूसरा’ और ‘तीसरा’ मूल पाठ के जन्म-क्रम को सुरक्षित रखते हैं। अंग्रेज़ी परामर्श-पाठ की पादटिप्पणी मूल इब्रानी पाठ में किसी वास्तविक पाठांतर को नहीं दर्शाती और उसका संकेत भी असंगत स्थान पर था, इसलिए हिन्दी मसौदे में अनावश्यक पादटिप्पणी नहीं जोड़ी गई।
