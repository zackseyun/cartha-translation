  text: Benjamin fathered Bela his firstborn[a], Ashbel the second, and Aharah the third.
translation:
  language: hi
  text: 'बिन्यामीन के पुत्र ये थे: उसका ज्येष्ठ पुत्र बेला, दूसरा अशबेल और तीसरा अहरह।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבִנְיָמִן
  choice: बिन्यामीन
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण लिया गया है। आरम्भिक וּ को वंशावली की स्वाभाविक हिन्दी वाक्य-रचना में अलग शब्द के रूप में व्यक्त नहीं किया गया।
- source_word: הוֹלִיד
  choice: के पुत्र थे
  rationale: हिफ़ील रूप यहाँ वंशावली में पिता बनने या संतान उत्पन्न करने का बोध देता है। पुरुष के लिए अस्वाभाविक ‘जन्म दिया’ से बचते हुए सम्बन्ध को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; पुनर्गठित हिन्दी वाक्य में इसका कोई अलग शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: בֶּלַע
  choice: बेला
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּכֹרוֹ
  choice: उसका पहलौठा
  rationale: ‘पहलौठा’ जन्म-क्रम की इब्रानी संज्ञा को सीधे सुरक्षित रखता है और ‘उसका’ सम्बन्धसूचक प्रत्यय को व्यक्त करता है।
- source_word: אַשְׁבֵּל
  choice: अशबेल
  rationale: इब्रानी व्यक्तिनाम का निकट हिन्दी लिप्यंतरण।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: क्रमसूचक पद को सूची की स्वाभाविक हिन्दी संरचना में व्यक्त किया गया है।
- source_word: וְאַחְרַח
  choice: और अहरह
  rationale: संयोजक וְ को ‘और’ से व्यक्त किया गया है और मसोराई स्वरांकन אַחְרַח के अनुसार नाम का निकट देवनागरी लिप्यंतरण ‘अहरह’ रखा गया है।
- source_word: הַשְּׁלִישִׁי
  choice: तीसरा
  rationale: इब्रानी क्रमसूचक पद का सीधा और स्वाभाविक हिन्दी रूप।
