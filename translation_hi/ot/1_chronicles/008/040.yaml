  text: וַֽ/יִּהְי֣וּ בְנֵי א֠וּלָם אֲנָשִׁ֨ים גִּבֹּרֵי חַ֜יִל דֹּ֣רְכֵי קֶ֗שֶׁת וּ/מַרְבִּ֤ים בָּנִים֙ וּ/בְנֵ֣י בָנִ֔ים מֵאָ֖ה וַ/חֲמִשִּׁ֑ים כָּל אֵ֖לֶּה מִ/בְּנֵ֥י בִנְיָמִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/040.yaml
  text: The sons of Ulam were mighty men of valor[a], drawers of the bow, and had many sons and grandsons, one hundred and fifty[c][b]. All these were from the sons of Benjamin.
translation:
  language: hi
  text: ऊलाम के पुत्र वीर योद्धा और धनुर्धर थे। उनके बहुत-से बेटे और पोते थे—कुल मिलाकर एक सौ पचास। ये सभी बिन्यामीन के वंशज थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: यहाँ היה का रूप वंशावली के संदर्भ में ऊलाम के पुत्रों का वर्णन आरम्भ करता है; हिन्दी में ‘थे’ स्वाभाविक है।
- source_word: בְנֵי אוּלָם
  choice: ऊलाम के पुत्र
  rationale: सम्बन्धवाचक रचना को औपचारिक वंशावली शैली में सीधे प्रस्तुत करता है।
- source_word: אֲנָשִׁים גִּבֹּרֵי חַיִל
  choice: वीर योद्धा
  rationale: यह रूढ़ पद शक्ति, पराक्रम और सैनिक सामर्थ्य का बोध कराता है; ‘वीर योद्धा’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: דֹּרְכֵי קֶשֶׁת
  choice: धनुर्धर
  rationale: शाब्दिक अर्थ ‘धनुष को मोड़ने/चढ़ाने वाले’ है, पर प्रसंग में यह कुशल धनुष चलाने वालों का मुहावरा है; ‘धनुर्धर’ उसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: וּמַרְבִּים בָּנִים וּבְנֵי בָנִים
  choice: उनके बहुत-से बेटे और पोते थे
  rationale: हिफ़ील कृदन्त वंशवृद्धि और बहुत-सी संतान होने का संकेत देता है; यह हिन्दी में अर्थ को सहज रूप से व्यक्त करता है।
- source_word: מֵאָה וַחֲמִשִּׁים
  choice: कुल मिलाकर एक सौ पचास
  rationale: संख्या बेटों और पोतों की संयुक्त संख्या बताती है; ‘कुल मिलाकर’ हिन्दी में इस सम्बन्ध को स्पष्ट करता है।
- source_word: כָּל אֵלֶּה מִבְּנֵי בִנְיָמִן
  choice: ये सभी बिन्यामीन के वंशज थे
  rationale: מן + בני यहाँ गोत्रीय वंश को सूचित करता है; शाब्दिक ‘बिन्यामीन के पुत्रों में से’ की अपेक्षा यह आधुनिक हिन्दी में स्पष्ट है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज वंशावली शैली अपनाई गई है। शाब्दिक मुहावरों के स्थान पर उनके स्पष्ट हिन्दी समतुल्य दिए गए हैं, जबकि मूल का सैन्य और वंशगत आशय सुरक्षित रखा गया है।
