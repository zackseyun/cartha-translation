base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/035.yaml
  text: 'And the sons of Micah: Pithon[a], Melech, Tarea, and Ahaz.'
translation:
  language: hi
  text: 'और मीका के पुत्र ये थे: पीतोन, मेलेक, तारेअ[a] और आहाज।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ परंपराओं में इस नाम की वर्तनी “तहरेअ” भी मिलती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: वाव को वंशावली की पिछली कड़ी से जोड़ने के लिए ‘और’ से व्यक्त किया गया है; בְנֵי का इस निकट वंश-सूची में स्वाभाविक अर्थ ‘पुत्र’ है। हिंदी में सूची का परिचय स्पष्ट और सहज बनाने के लिए ‘ये थे’ जोड़ा गया है।
- source_word: מִיכָה
  choice: मीका
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: פִּיתוֹן
  choice: पीतोन
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וָמֶלֶךְ
  choice: मेलेक
  rationale: वंशावली के संदर्भ में इसे सामान्य संज्ञा ‘राजा’ के बजाय व्यक्तिगत नाम माना गया है। सूची की स्वाभाविक हिंदी शैली के अनुसार इसके पहले का संयोजक अलग से नहीं दोहराया गया।
- source_word: וְתַאְרֵעַ
  choice: तारेअ
  rationale: मसोरेटिक स्वरांकन תַאְרֵעַ को यथासंभव निकटता से देवनागरी में प्रस्तुत किया गया है; वैकल्पिक पारंपरिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: וְאָחָז
  choice: आहाज
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण; अंतिम नाम से पहले संयोजक को हिंदी के स्वाभाविक ‘और’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। इब्रानी में प्रत्येक नाम के साथ आए संयोजकों को हिंदी सूची की स्वाभाविक शैली में केवल आरंभ और अंतिम नाम से पहले व्यक्त किया गया है। पाद-टिप्पणी का चिह्न उस नाम ‘तारेअ’ पर रखा गया है जिससे वैकल्पिक वर्तनी संबंधित है।
