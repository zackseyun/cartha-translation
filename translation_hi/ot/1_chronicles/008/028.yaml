  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण वंशावली-वर्णन। ‘पितृकुल’ सामान्य ‘परिवार’ की अपेक्षा मूल सामाजिक संरचना को अधिक ठीक से व्यक्त करता है; ‘अर्थात्’ इब्रानी में समान मूल वाले ‘मुखिया/प्रधान’ के बलात्मक पुनर्कथन को स्वाभाविक हिन्दी में जोड़ता है।
