  text: These were heads of fathers’ houses according to their generations[a], chief men. These lived in Jerusalem.
translation:
  language: hi
  text: ये अपने-अपने वंशों के अनुसार पितृकुलों के मुखिया, अर्थात् प्रधान पुरुष थे। ये यरूशलेम में रहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: רָאשֵׁי אָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह इब्रानी पद पूर्वज से चले आ रहे कुलों या घरानों के अगुओं को दर्शाता है। ‘पितृकुलों के मुखिया’ सामाजिक और वंशावली-संबंधी अर्थ को स्पष्ट तथा संक्षिप्त रखता है।
- source_word: לְתֹלְדוֹתָם
  choice: अपने-अपने वंशों के अनुसार
  rationale: תולדות यहाँ पीढ़ियों अथवा वंशक्रम का बोध कराता है। ‘अपने-अपने वंशों के अनुसार’ वंशावली के आधार पर उनके वर्गीकरण को व्यक्त करता है, बिना इसे अनिवार्यतः लिखित अभिलेख मानने के।
- source_word: רָאשִׁים
  choice: प्रधान पुरुष
  rationale: रָאשֵׁי के बाद उसी मूल की पुनरावृत्ति उनकी प्रमुख हैसियत पर बल देती है। ‘प्रधान पुरुष’ अनावश्यक रूप से ‘मुखिया’ दोहराए बिना यह बल बनाए रखता है।
- source_word: יָשְׁבוּ
  choice: रहते थे
  rationale: इस वंशावली-संदर्भ में क्रिया का अर्थ निवास करना है, न कि बैठना। ‘रहते थे’ आधुनिक मानक हिन्दी में स्वाभाविक है।
- source_word: בִירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थाननाम और उसके पूर्वसर्ग का मानक हिन्दी रूप।
- source_word: אֵלֶּה ... אֵלֶּה
  choice: ये ... ये
  rationale: इब्रानी पाठ में संकेतवाचक की पुनरावृत्ति संरचनात्मक बल देती है; दोनों बार ‘ये’ रखकर इसे सुरक्षित किया गया है।
