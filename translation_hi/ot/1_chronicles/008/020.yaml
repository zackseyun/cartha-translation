lexical_decisions:
- source_word: וֶ/אֱלִיעֵנַי
  choice: और एलीएनै
  rationale: उपसर्ग ו को “और” से व्यक्त किया गया है। व्यक्ति-नाम אֱלִיעֵנַי का अर्थानुवाद न करके उसके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण “एलीएनै” रखा गया है।
- source_word: וְ/צִלְּתַי
  choice: सिल्लतै
  rationale: व्यक्ति-नाम צִלְּתַי को इब्रानी उच्चारण के निकट “सिल्लतै” लिखा गया है; צ के लिए प्रचलित हिन्दी बाइबलीय रूप “स” और द्वित्व ל के लिए “ल्ल” रखा गया है। सूची को स्वाभाविक हिन्दी में रखने के लिए इसके पहले का ו अलग से दोहराया नहीं गया, जबकि उसका संयोजक बल अंतिम नाम से पहले आए “और” में समाहित है।
- source_word: וֶ/אֱלִיאֵל
  choice: और एलीएल
  rationale: उपसर्ग ו को “और” से व्यक्त किया गया है और אֱלִיאֵל का अर्थानुवाद किए बिना “एलीएल” के रूप में लिप्यंतरण किया गया है।
