- source_word: וְ
  choice: और
  rationale: हर नाम से पहले लगे इब्रानी समुच्चयबोधक उपसर्ग को स्पष्ट रूप से रखा गया है, ताकि मूल सूची की संरचना बनी रहे।
- source_word: יָקִים
  choice: याकीम
  rationale: व्यक्तिनाम का अनुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: זִכְרִי
  choice: ज़िक्री
  rationale: व्यक्तिनाम को इब्रानी व्यंजन और स्वर-रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: זַבְדִּי
  choice: ज़ब्दी
  rationale: व्यक्तिनाम को इब्रानी रूप के निकट और हिंदी पाठकों के लिए सहज देवनागरी में लिप्यंतरित किया गया है।
