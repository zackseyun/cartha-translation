lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְבָלַע
  choice: बेला के पुत्र थे
  rationale: इब्रानी वंशावली की शाब्दिक संरचना ‘बेला के लिए पुत्र थे’ को स्वाभाविक और अर्थ-सटीक आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: בָנִים
  choice: पुत्र
  rationale: इस वंशावली-संदर्भ में यह शब्द नामित पुरुष संतानों को सूचित करता है; इसलिए ‘पुत्र’ उपयुक्त है।
- source_word: בָלַע
  choice: बेला
  rationale: व्यक्तिवाचक नाम का हिन्दी में सुगम लिप्यंतरण।
- source_word: אַדָּר
  choice: अद्दार
  rationale: दागेश से सूचित व्यंजन-द्वित्व को ‘द्द’ द्वारा दर्शाते हुए इब्रानी रूप का निकट लिप्यंतरण।
- source_word: גֵרָא
  choice: गेरा
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट, हिन्दी में सुगम लिप्यंतरण।
- source_word: אֲבִיהוּד
  choice: अबीहूद
  rationale: दीर्घ ऊ स्वर को बनाए रखते हुए व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
