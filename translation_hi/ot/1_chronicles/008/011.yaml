- source_word: אֶת
  choice: को
  rationale: हिब्रू के निश्चित कर्म-सूचक को हिंदी में कर्मचिह्न ‘को’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: אֲבִיטוּב
  choice: अबीतूब
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וְ/אֶת
  choice: और … को
  rationale: וְ को ‘और’ से व्यक्त किया गया है; साझा कर्मचिह्न ‘को’ हिंदी वाक्य के अंत में दोनों नामों पर लागू होता है।
- source_word: אֶלְפָּעַל
  choice: एल्पाल
  rationale: व्यक्तिनाम का पठनीय देवनागरी लिप्यंतरण; हिब्रू व्यंजन ע को अलग से चिह्नित नहीं किया गया है।
