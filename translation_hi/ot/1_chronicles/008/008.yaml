base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/008.yaml
  text: And Shaharaim fathered children in the country of Moab after he sent away Hushim and Baara[b][a], his wives.
translation:
  language: hi
  text: और शहारैम ने मोआब के प्रदेश[a] में अपनी पत्नियों हूशीम और बारा को विदा कर देने के बाद[b] सन्तान उत्पन्न की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘मोआब के खेत में’; यहाँ ‘मोआब के भूभाग में’ भी सम्भव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके उन्हें विदा करने से’; आशय सम्भवतः ‘उन्हें विदा कर देने के बाद’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שַׁחֲרַיִם
  choice: और शहरैम
  rationale: वाव वंशावली की पिछली कड़ी से इस कथन को जोड़ता है; इसलिए ‘और’ रखा गया है। नाम का निकट देवनागरी लिप्यंतरण ‘शहरैम’ है।
- source_word: הוֹלִיד
  choice: सन्तान उत्पन्न की
  rationale: हिफ़ील रूप वंशावली के प्रसंग में ‘सन्तान का पिता बना/सन्तान उत्पन्न की’ का अर्थ देता है। अगली आयत तक सन्तानों के नाम न आने के कारण सामान्य ‘सन्तान’ स्वाभाविक और सटीक है।
- source_word: בִּ/שְׂדֵה מוֹאָב
  choice: मोआब के प्रदेश में
  rationale: שָׂדֶה का मूल अर्थ ‘खेत’ है, पर भौगोलिक प्रयोग में यह देश-प्रदेश या भूभाग को सूचित कर सकता है; यहाँ ‘प्रदेश’ आधुनिक हिन्दी में उपयुक्त है।
- source_word: מִן שִׁלְח/וֹ אֹתָם
  choice: विदा कर देने के बाद
  rationale: מִן के साथ infinitive construct यहाँ समयगत परिस्थिति व्यक्त करता है। ‘के बाद’ हिन्दी में स्वाभाविक है, जबकि ‘विदा कर देना’ שלח के यहाँ सम्भावित वैवाहिक अलगाव को अनावश्यक रूप से अधिक निश्चित नहीं करता।
- source_word: חוּשִׁים וְ/אֶת בַּעֲרָא
  choice: हूशीम और बारा
  rationale: दोनों स्त्रियों के व्यक्तिगत नामों का देवनागरी में निकट लिप्यंतरण किया गया है; אֵת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: נָשָׁיו
  choice: अपनी पत्नियों
  rationale: सन्दर्भ में אִשָּׁה का बहुवचन वैवाहिक पत्नियों को दर्शाता है। ‘अपनी’ हिन्दी वाक्य में शहरैम के साथ सम्बन्ध स्पष्ट करता है।
