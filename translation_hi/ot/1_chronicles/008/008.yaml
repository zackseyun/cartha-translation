  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। वंशावली की शैली बनाए रखते हुए कठिन इब्रानी वाक्य-विन्यास को स्वाभाविक हिन्दी क्रम में रखा गया है; ‘विदा’ मूल की सम्भावित अस्पष्टता को ‘त्याग दिया’ या ‘तलाक दिया’ कहकर संकीर्ण नहीं करता।
