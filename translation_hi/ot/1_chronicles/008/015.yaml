lexical_decisions:
- source_word: וּ/זְבַדְיָה
  choice: और जबद्याह
  rationale: आरंभिक संयोजक וּ को ‘और’ से व्यक्त किया गया है। इब्रानी व्यक्तिगत नाम זְבַדְיָה का हिंदी में स्रोत-निकट और प्रचलित बाइबलीय लिप्यंतरण ‘जबद्याह’ रखा गया है।
- source_word: וַ/עֲרָד
  choice: अराद
  rationale: עֲרָד का देवनागरी लिप्यंतरण ‘अराद’ किया गया है। सूची की स्वाभाविक हिंदी शैली में इसके पहले अलग से ‘और’ दोहराना आवश्यक नहीं है।
- source_word: וָ/עָדֶר
  choice: और एदेर
  rationale: अंतिम नाम से पहले संयोजक וָ को ‘और’ से व्यक्त किया गया है। मासोरेटिक स्वरांकन עָדֶר के अनुसार नाम ‘एदेर’ लिप्यंतरित किया गया है।
