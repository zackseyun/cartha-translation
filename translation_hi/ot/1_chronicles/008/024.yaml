  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֲנַנְיָה
  choice: हनन्याह
  rationale: यह व्यक्ति का इब्रानी नाम है; इसका अर्थानुवाद करने के बजाय देवनागरी में मूल उच्चारण के निकट लिप्यंतरण किया गया है।
- source_word: עֵילָם
  choice: एलाम
  rationale: वंशावली के इस संदर्भ में यह व्यक्ति का नाम है; इसे प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: עַנְתֹתִיָּה
  choice: अनतोतियाह
  rationale: यह व्यक्ति का नाम है। देवनागरी रूप इब्रानी व्यंजनों और स्वरों को स्वाभाविक हिन्दी उच्चारण में यथासंभव सुरक्षित रखता है।
- source_word: וְ
  choice: और
  rationale: नामों को जोड़ने वाला संयोजक है। आरंभिक וַ को भी ‘और’ से व्यक्त किया गया है, जबकि बीच के सभी संयोजकों को हिन्दी सूची-शैली के अनुसार दोहराना आवश्यक नहीं है।
