  text: और मोत्सा बिनआ का पिता था; बिनआ का पुत्र रफ़ा, रफ़ा का पुत्र एलेआसा, और एलेआसा का पुत्र आत्सेल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/מוֹצָא
  choice: और मोसा
  rationale: ו को वंशावली की क्रमबद्ध कड़ी बनाए रखने के लिए “और” से व्यक्त किया गया है; מוֹצָא का आधुनिक हिन्दी बाइबलीय रूपांतरण “मोसा” रखा गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में पिता बनने अथवा संतान उत्पन्न करने का बोध देता है। हिन्दी में “से … उत्पन्न हुआ” स्वाभाविक, संक्षिप्त और स्पष्ट है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्मसूचक चिह्न है; हिन्दी वाक्य-विन्यास में इसका पृथक समतुल्य आवश्यक नहीं है।
- source_word: בִּנְעָא
  choice: बिनआ
  rationale: नाम के अंतिम ע को पूरी तरह लुप्त किए बिना इब्रानी स्वरूप के निकट देवनागरी लिप्यंतरण रखा गया है।
- source_word: רָפָה
  choice: रापा
  rationale: רָפָה का उच्चारण-सन्निकट हिन्दी लिप्यंतरण; פ पर दागेश न होने के कारण यहाँ “फ” की ध्वनि आती है, जिसे हिन्दी नाम-परंपरा में “प/फ” के बीच रूपांतरित किया जाता है; “रापा” प्रचलित हिन्दी बाइबलीय रूप से मेल खाता है।
- source_word: בְנ֛/וֹ
  choice: उसका पुत्र
  rationale: शाब्दिक अर्थ “उसका पुत्र” है और यह पूर्ववर्ती व्यक्ति से अगली पीढ़ी का संबंध बताता है।
- source_word: אֶלְעָשָׂה
  choice: एलआसा
  rationale: इब्रानी नाम के आरंभिक אֶלְ और मध्यवर्ती ע को यथासंभव पारदर्शी रखते हुए देवनागरी लिप्यंतरण किया गया है।
- source_word: בְנ֖/וֹ
  choice: उसका पुत्र
  rationale: दोहराया गया पद क्रमिक वंश-संबंध को चिह्नित करता है; हिन्दी में उसी पुनरावृत्ति को बनाए रखा गया है।
- source_word: אָצֵל
  choice: आसेल
  rationale: इब्रानी אָצֵל का उच्चारण-सन्निकट हिन्दी लिप्यंतरण है; צ को हिन्दी पाठकों के लिए “स” से दर्शाया गया है।
- source_word: בְּנֽ/וֹ
  choice: उसका पुत्र था
  rationale: अंतिम पद में “था” जोड़ने से पूरी नाम-श्रृंखला हिन्दी में स्वाभाविक रूप से पूर्ण होती है, जबकि मूल का वंश-संबंध अक्षुण्ण रहता है।
