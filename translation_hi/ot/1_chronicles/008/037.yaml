translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। नामों को अंग्रेज़ी रूपों से नहीं, इब्रानी पाठ के आधार पर देवनागरी में रूपांतरित किया गया है। मूल में बार-बार आए “उसका पुत्र” को बनाए रखकर क्रमिक वंश-संबंध स्पष्ट किया गया है। अंग्रेज़ी में दिए गए लिप्यंतरण-विकल्प हिन्दी के लिए सीधे प्रासंगिक नहीं हैं, इसलिए अनावश्यक पादटिप्पणियाँ नहीं जोड़ी गईं।
