  yaml_path: translation/ot/1_chronicles/008/038.yaml
  text: 'Azel had six sons[a], and these were their names: Azrikam his firstborn, Ishmael, Sheariah, Obadiah, and Hanan. All these were the sons of Azel.'
translation:
  language: hi
  text: 'आसेल के छह पुत्र थे[a], और उनके नाम ये थे: अज्रीकाम, उसका पहलौठा पुत्र, इश्माएल, शेआर्याह, ओबद्याह और हानान। ये सभी आसेल के पुत्र थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
