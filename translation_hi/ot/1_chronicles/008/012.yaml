base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/012.yaml
  text: 'The sons of Elpaal: Eber[a], Misham, and Shemed[b]; he built Ono and Lod and its villages.'
translation:
  language: hi
  text: एल्पाल के पुत्र एबेर, मिशाम और शेमेद थे; उसी ने[b] ओनो और लोद तथा उसके गाँवों[a] को बनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ है, “और उसकी बेटियों को”; यह किसी नगर से संबद्ध या उसके आश्रित गाँवों के लिए प्रयुक्त हिब्रू मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “उसी” का सबसे स्वाभाविक संकेत अंतिम उल्लिखित पुत्र, शेमेद, की ओर है; कुछ लोग इसे अधिक व्यापक रूप से उसके वंश-परिवार से संबंधित समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי אֶלְפַּעַל
  choice: एल्पाल के पुत्र
  rationale: वंशावली की सूची आरम्भ करने वाली संबंधवाचक रचना; हिन्दी में स्वाभाविक शीर्षकीय वाक्य के रूप में प्रस्तुत।
- source_word: עֵבֶר וּמִשְׁעָם וָשָׁמֶד
  choice: एबेर, मिशाम और शेमेद
  rationale: व्यक्तिनामों का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הוּא
  choice: उसी ने
  rationale: पुल्लिंग एकवचन सर्वनाम सबसे स्वाभाविक रूप से अंतिम उल्लिखित व्यक्ति शेमेद की ओर संकेत करता है; ‘उसी’ इस पुनःसंकेत को स्पष्ट रखता है, पर टिप्पणी में व्यापक वंशगत संदर्भ की संभावना दी गई है।
- source_word: בָּנָה
  choice: बसाया
  rationale: नगरों के विषय में हिन्दी में ‘बसाया’ स्वाभाविक है और हिब्रू ‘निर्माण करना’ के प्रसंगगत अर्थ को व्यक्त करता है; यह अनावश्यक रूप से ‘फिर से बसाया’ नहीं कहता।
- source_word: אוֹנוֹ וְאֶת לֹד
  choice: ओनो और लोद
  rationale: दोनों स्थाननामों का हिब्रू रूप से सीधा देवनागरी लिप्यंतरण।
- source_word: וּבְנֹתֶיהָ
  choice: तथा उसके अधीन गाँवों को
  rationale: शाब्दिक अर्थ ‘और उसकी बेटियों’ है, पर नगर के संदर्भ में यह उससे संबद्ध या उसके अधीन छोटी बस्तियों के लिए हिब्रू मुहावरा है।
theological_decisions:
- issue: הוּא (‘वह/उसी’) का संदर्भ
  choice: मुख्य पाठ में इसे निकटतम नाम शेमेद से जोड़ने वाला ‘उसी ने’
  alternative: इसे पूरे एल्पाल-वंश से अधिक ढीले रूप में संबंधित समझना
  rationale: व्याकरण और निकटतम पूर्वपद शेमेद की ओर संकेत करते हैं, किंतु वंशावली की संक्षिप्त शैली व्यापक पारिवारिक संदर्भ की संभावना को पूरी तरह समाप्त नहीं करती।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। वंशावली की संक्षिप्तता बनाए रखते हुए स्थाननामों और व्यक्तिनामों को हिब्रू के निकट लिप्यंतरित किया गया है।
