base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/008/013.yaml
  text: And Beriah and Shema—they were heads of fathers’ houses among the inhabitants of Aijalon[b][a]; they were the ones who drove out the inhabitants of Gath.
translation:
  language: hi
  text: और बरीआ और शेमा—वे अय्यालोन के निवासियों के पितृकुलों के मुखिया थे[a]; उन्हीं ने गत के निवासियों को भगा दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पिताओं के घरानों के मुखिया”; यह कुल-आधारित पैतृक परिवारों के अगुओं के लिए प्रयुक्त अभिव्यक्ति है।
    reason: cultural_note
  - marker: b
    text: या “भागने पर विवश कर दिया।” इब्रानी क्रिया का मुख्य भाव उन्हें भगाना या पलायन कराना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְרִעָה וָשֶׁמַע
  choice: और बरीआ और शेमा
  rationale: दोनों व्यक्तिनामों का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; आरंभिक संयोजक वंशावली के प्रवाह को बनाए रखता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पद कुल-आधारित पैतृक परिवारों के नेतृत्व को बताता है; यह स्वाभाविक हिंदी में सामाजिक संरचना को सुरक्षित रखता है।
- source_word: לְיוֹשְׁבֵי אַיָּלוֹן
  choice: अय्यालोन के निवासियों के
  rationale: 'לְ को यहाँ नेतृत्व-संबंध के रूप में समझा गया है: वे अय्यालोन के निवासियों के पितृकुलों के मुखिया थे। यह ''उनके लिए'' और ''उनके बीच'' के बीच स्रोत की संबंधगत व्यापकता को अनावश्यक रूप से नहीं बढ़ाता।'
- source_word: הֵמָּה הִבְרִיחוּ
  choice: उन्हीं ने ... भगा दिया
  rationale: स्वतंत्र सर्वनाम के बल को 'उन्हीं ने' व्यक्त करता है; हिफ़ील क्रिया का कारक अर्थ 'भगा दिया' में स्वाभाविक रूप से आता है।
- source_word: יֹשְׁבֵי גַת
  choice: गत के निवासियों
  rationale: स्थाननाम का निकट लिप्यंतरण और יֹשְׁבֵי का सीधा, प्रसंगानुकूल अनुवाद।
