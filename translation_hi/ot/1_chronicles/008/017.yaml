- source_word: וּ/זְבַדְיָה
  choice: और जबद्याह
  rationale: व्यक्तिनाम को उसके इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: וּ/מְשֻׁלָּם
  choice: मशुल्लाम
  rationale: व्यक्तिनाम का प्रचलित और इब्रानी उच्चारण के निकट हिन्दी लिप्यंतरण; समन्वयकारी ‘और’ को हिन्दी सूची में स्वाभाविक ढंग से व्यवस्थित किया गया है।
- source_word: וְ/חִזְקִי
  choice: हिजकी
  rationale: חִזְקִי को सीधे लिप्यंतरित किया गया है और इसे भिन्न नाम ‘हिजकिय्याह’ नहीं बनाया गया।
- source_word: וָ/חָבֶר
  choice: और हेबेर
  rationale: व्यक्तिनाम חָבֶר के लिए बाइबलीय हिन्दी में पहचाने जाने योग्य ‘हेबेर’ रखा गया है; prefixed conjunction को ‘और’ से व्यक्त किया गया है।
