lexical_decisions:
- source_word: וּ/בֶן
  choice: और ... का पुत्र
  rationale: संयोजक וּ वंशावली की अगली कड़ी जोड़ता है, और בֶן का स्वाभाविक हिन्दी रूप ‘का पुत्र’ है।
- source_word: יְהוֹנָתָן
  choice: यहोनातान
  rationale: नाम को पाठ में उपस्थित विस्तृत इब्रानी रूप के अनुसार लिप्यंतरित किया गया है; इसे अधिक परिचित संक्षिप्त रूप ‘योनातान’ में सामान्यीकृत नहीं किया गया।
- source_word: מְרִיב בָּעַל / מְרִיב בַּעַל
  choice: मरीब-बाल
  rationale: इब्रानी में दो शब्दों में लिखे इस एक व्यक्तिगत नाम को हिन्दी में योजक-चिह्न के साथ रखा गया है। दोनों बार एक ही व्यक्ति का उल्लेख है।
- source_word: הוֹלִיד
  choice: को जन्म दिया
  rationale: वंशावली में ילד के हिफ़ील रूप का अर्थ संतान उत्पन्न करना है। ‘को जन्म दिया’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ पिता को कर्ता मानते हुए प्रत्यक्ष वंश-संबंध व्यक्त करता है।
- source_word: אֶת מִיכָה
  choice: मीकाह
  rationale: אֶת प्रत्यक्ष कर्म का चिह्न है और अलग से अनूदित नहीं होता। מִיכָה को उसके इब्रानी रूप के अनुसार ‘मीकाह’ लिप्यंतरित किया गया है।
