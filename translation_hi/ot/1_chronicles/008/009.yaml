lexical_decisions:
- source_word: וַיּוֹלֶד
  choice: उसने ... को जन्म दिया
  rationale: वंशावली में ילד का हिफ़ील रूप संतान उत्पन्न करने का पुरुष-विषयक भाव व्यक्त करता है। आधुनिक हिन्दी में यह स्वाभाविक है; प्रसंग से पिता होना स्पष्ट है।
- source_word: מִן
  choice: से
  rationale: यहाँ מִן पत्नी को संतानों के मातृ-स्रोत के रूप में चिह्नित करता है। हिन्दी का ‘से’ ‘द्वारा’ की अपेक्षा अधिक स्वाभाविक है और इब्रानी के ‘से/की ओर से’ वाले भाव को भी बनाए रखता है।
- source_word: חֹדֶשׁ
  choice: होदेश
  rationale: यह स्त्री का व्यक्तिगत नाम है, इसलिए इसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: אִשְׁתּוֹ
  choice: अपनी पत्नी
  rationale: इस प्रसंग में אִשָּׁה प्रत्यय सहित स्पष्ट रूप से पत्नी को दर्शाता है। हिन्दी में कर्ता के संदर्भ में ‘अपनी पत्नी’ स्वाभाविक है।
- source_word: אֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: नामों की सूची; अंतिम नाम से पहले ‘और’
  rationale: प्रत्यक्ष कर्म-सूचक אֶת का हिन्दी में अलग शब्द नहीं दिया जाता; समन्वित सूची से उसका व्याकरणिक कार्य पर्याप्त रूप से व्यक्त होता है।
- source_word: יוֹבָב
  choice: योबाब
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: צִבְיָא
  choice: सिब्या
  rationale: इब्रानी צִבְיָא का उच्चारण-सन्निकट हिन्दी लिप्यंतरण; צ को यहाँ प्रचलित हिन्दी बाइबलीय रीति के अनुसार ‘स’ से दर्शाया गया है।
- source_word: מֵישָׁא
  choice: मेशा
  rationale: इब्रानी व्यक्तिगत नाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
- source_word: מַלְכָּם
  choice: मल्काम
  rationale: यहाँ यह वंशावली में व्यक्तिगत नाम है, इसलिए अनुवाद के बजाय लिप्यंतरण किया गया है।
