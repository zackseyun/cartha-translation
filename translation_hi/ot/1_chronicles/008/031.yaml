  choice: और गदोर
  rationale: उपसर्ग וּ को वंशावली की क्रमिक शैली के अनुसार ‘और’ से व्यक्त किया गया है; גְדוֹר व्यक्ति का नाम है, इसलिए इसका लिप्यंतरण ‘गदोर’ किया गया है।
- source_word: וְאַחְיוֹ
  choice: अहियो
  rationale: אַחְיוֹ व्यक्ति का नाम है और उसका निकट देवनागरी लिप्यंतरण ‘अहियो’ है। हिन्दी सूची में हर नाम से पहले ‘और’ दोहराना अस्वाभाविक होता, इसलिए संयोजक का अर्थ सूची की स्वाभाविक रचना में सुरक्षित रखा गया है।
- source_word: וָזָכֶר
  choice: और जेकर
  rationale: וָ को ‘और’ से व्यक्त किया गया है। मसोरी स्वरांकन के अनुसार זָכֶר का देवनागरी लिप्यंतरण ‘जेकर’ रखा गया है; आरम्भिक ז को प्रचलित बाइबलीय हिन्दी परंपरा के अनुरूप ‘ज’ से लिखा गया है।
