lexical_decisions:
- source_word: יִשְׁמְרַי
  choice: यिशमरै
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; आरम्भिक योध को ‘यि’ से दर्शाया गया है।
- source_word: יִזְלִיאָה
  choice: यिजलियाह
  rationale: व्यक्तिवाचक नाम का हिब्रू-आधारित लिप्यंतरण; आरम्भिक योध और अंतिम יָה को क्रमशः ‘यि’ और ‘याह’ से दर्शाया गया है।
- source_word: יוֹבָב
  choice: योबाब
  rationale: हिब्रू व्यक्तिवाचक नाम का स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: בְּנֵי
  choice: के पुत्र थे
  rationale: यह ‘पुत्र’ का बहुवचन संबंधवाची रूप है। हिब्रू वंशावली का वाक्य क्रियारहित है; स्वाभाविक हिंदी वाक्य के लिए ‘थे’ जोड़ा गया है, बिना अर्थ बदले।
- source_word: אֶלְפָּעַל
  choice: एल्पाल
  rationale: व्यक्तिवाचक नाम का पठनीय देवनागरी लिप्यंतरण; बीच के अयिन को अलग चिह्न से न दिखाकर सामान्य हिंदी पाठक के लिए सरल रूप रखा गया है।
