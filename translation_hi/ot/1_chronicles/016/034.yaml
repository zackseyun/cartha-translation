base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/034.yaml
  text: Give thanks to Yahweh[a], for he is good[b]; for his steadfast love endures forever.
translation:
  language: hi
  text: याहवे[a] का धन्यवाद करो, क्योंकि वह भला है; क्योंकि उसका अटल प्रेम[b] सदा बना रहता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ईश्वर के नाम के चार अक्षर יהוה (YHWH) हैं; यहाँ उन्हें ‘याहवे’ के रूप में प्रस्तुत किया गया है। हिंदी में ‘यहोवा’ और ‘प्रभु’ भी प्रचलित हैं।
    reason: alternative_reading
  - marker: b
    text: या, “वाचा के प्रति उसकी निष्ठा सदा बनी रहती है।” इब्रानी חֶסֶד में अटल प्रेम, करुणा और निष्ठा के भाव समाहित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: धन्यवाद करो
  rationale: हिफ़ील बहुवचन आज्ञार्थक रूप यहाँ सामूहिक उपासना में धन्यवाद और स्तुति व्यक्त करने का आह्वान है। ‘धन्यवाद करो’ इसके प्रचलित और स्वाभाविक अर्थ को व्यक्त करता है।
- source_word: לַ/יהוָה֙
  choice: याहवे का
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है। हिंदी में ‘का धन्यवाद करो’ स्वाभाविक प्रयोग है, यद्यपि इब्रानी में संबंधसूचक उपसर्ग का शाब्दिक अर्थ ‘को/के लिए’ है।
- source_word: כִּ֣י ט֔וֹב
  choice: क्योंकि वह भला है
  rationale: כִּי कारण बताता है और טוֹב याहवे की नैतिक तथा कल्याणकारी भलाई को व्यक्त करता है। ‘भला’ गरिमापूर्ण और सामान्य हिंदी है।
- source_word: חַסְדּֽ/וֹ
  choice: उसका अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और संबंध अथवा वाचा के प्रति दृढ़ प्रतिबद्धता के अर्थ साथ-साथ हैं। ‘अटल प्रेम’ इस व्यापकता को किसी एक पक्ष तक सीमित किए बिना संक्षेप में व्यक्त करता है।
- source_word: לְ/עוֹלָ֖ם חַסְדּֽ/וֹ
  choice: उसका अटल प्रेम सदा बना रहता है
  rationale: इब्रानी उपवाक्य में स्पष्ट क्रिया नहीं है। हिंदी में ‘बना रहता है’ उसके निरंतर स्थायी होने का निहित भाव स्वाभाविक रूप से व्यक्त करता है; ‘सदा’ לְעוֹלָם का कालगत बल बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है; अन्य प्रचलित हिंदी रूप पादटिप्पणी में दिए गए हैं।
- issue: חֶסֶד का अर्थ
  choice: अटल प्रेम
  alternative: वाचा के प्रति निष्ठा; करुणा
  rationale: इस स्तुतिपरक सूत्र में חֶסֶד स्नेह, विश्वसनीयता और वाचागत निष्ठा का संयुक्त भाव रखता है। ‘अटल प्रेम’ मूल की अर्थगत व्यापकता और धर्मवैज्ञानिक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और उपासना के योग्य गरिमापूर्ण रखी गई है। दोनों כִּי को ‘क्योंकि’ से व्यक्त करके इब्रानी की पुनरुक्ति और काव्यात्मक लय सुरक्षित रखी गई है।
