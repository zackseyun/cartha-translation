id: 1CH.16.31
reference: 1 Chronicles 16:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִשְׂמְח֤וּ הַ/שָּׁמַ֨יִם֙ וְ/תָגֵ֣ל הָ/אָ֔רֶץ וְ/יֹאמְר֥וּ בַ/גּוֹיִ֖ם יְהוָ֥ה מָלָֽךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/031.yaml
  text: Let the heavens rejoice[a], and let the earth be glad; and let them say among the nations, “Yahweh reigns!”
translation:
  language: hi
  text: 'आकाश आनन्दित हों और पृथ्वी मगन हो;

    वे राष्ट्रों के बीच कहें, “याहवे राज्य करता है!”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יִשְׂמְחוּ
  choice: आनन्दित हो
  rationale: काव्यात्मक समानांतर रचना में क़ाल अपूर्ण बहुवचन का प्रयोग इच्छासूचक आह्वान के रूप में है; इसलिए इसे भविष्यवाणी के बजाय ‘आनन्दित हो’ कहा गया है।
- source_word: הַשָּׁמַיִם
  choice: आकाश
  rationale: हिन्दी में ‘आकाश’ इस ब्रह्मांडीय स्तुति-संदर्भ में स्वाभाविक सामूहिक संज्ञा है और इब्रानी बहुवचन שׁמים के आशय को व्यक्त करता है।
- source_word: וְתָגֵל
  choice: और ... मगन हो
  rationale: גיל हर्ष और उल्लास व्यक्त करता है। ‘मगन हो’ पहली पंक्ति के ‘आनन्दित हो’ से अनावश्यक पुनरावृत्ति बचाते हुए काव्यात्मक समानता बनाए रखता है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: ‘आकाश’ के समानांतर यह समूची पृथ्वी को सूचित करता है, किसी स्थानीय ‘देश’ या ‘भूमि’ को नहीं।
- source_word: וְיֹאמְרוּ
  choice: वे ... कहें
  rationale: अपूर्ण बहुवचन पहले के इच्छासूचक क्रियापदों की शृंखला जारी रखता है। ‘वे’ मूल की अनिर्दिष्ट बहुवचन कर्तृता को बिना किसी विशेष समूह की पहचान जोड़े सुरक्षित रखता है।
- source_word: בַגּוֹיִם
  choice: राष्ट्रों के बीच
  rationale: גּוֹיִם संसार के विभिन्न राष्ट्रों या जनसमुदायों को सूचित करता है; ‘राष्ट्रों के बीच’ सार्वजनिक घोषणा का भाव देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिवाचक वाचा-नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ दिया गया है।
- source_word: מָלָךְ
  choice: राज्य करता है
  rationale: इस स्तुति-घोषणा में पूर्ण क्रिया वर्तमान और स्थापित राजसत्ता को व्यक्त करती है। ‘राज्य करता है’ स्वाभाविक हिन्दी है और अनावश्यक रूप से यह संकेत नहीं देता कि याहवे अभी-अभी राजा बना है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में ईश्वर का व्यक्तिवाचक नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है और किसी सम्प्रदाय-विशेष की व्याख्या नहीं जोड़ता।
- issue: מָלָךְ में राजत्व का कालगत भाव
  choice: राज्य करता है
  alternative: राजा बन गया है / राज्य करने लगा है
  rationale: स्तुति और राजत्व-घोषणा के इस सूत्र में क्रिया स्थापित, वर्तमान राजसत्ता घोषित कर सकती है। संक्रमण का अर्थ सम्भव होने पर भी संदर्भ उसे अनिवार्य नहीं करता; इसलिए मुख्य पाठ में कम व्याख्यात्मक रूप चुना गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। दो समानांतर इच्छासूचक पंक्तियों की काव्यात्मक गति सुरक्षित है। अंग्रेज़ी परामर्श-पाठ की फुटनोट सामग्री और उसके चिह्न में असंगति थी; क्योंकि हिन्दी मुख्य पाठ में ईश्वरीय नाम सीधे ‘याहवे’ दिया गया है, कोई भ्रामक फुटनोट नहीं जोड़ा गया।
