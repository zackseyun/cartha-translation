  text: בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל מִן הָ/עוֹלָ֖ם וְ/עַ֣ד הָ/עֹלָ֑ם וַ/יֹּאמְר֤וּ כָל הָ/עָם֙ אָמֵ֔ן וְ/הַלֵּ֖ל לַֽ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/036.yaml
  text: Blessed be Yahweh[a], the God of Israel, from everlasting to everlasting. Then all the people said[b], “Amen!” and praised Yahweh.
translation:
  language: hi
  text: याहवे, इस्राएल का परमेश्वर, अनादिकाल से अनन्तकाल तक[a] धन्य हो। तब सब लोगों ने कहा, “आमीन!” और याहवे की स्तुति की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “युग-युग तक” या “सदा से सदा तक।”
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू अभिव्यक्ति बहुत संक्षिप्त है: “आमीन, और याहवे की स्तुति” अथवा “आमीन, और याहवे की स्तुति करो।” आशय यह है कि लोगों ने “आमीन” कहकर स्तुति के साथ प्रत्युत्तर दिया।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: यह निष्क्रिय कृदन्त स्तुतिपरक आशीर्वचन में प्रयुक्त हुआ है। हिंदी में “धन्य है” इस घोषणा का स्वाभाविक, गरिमापूर्ण रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; उसे किसी उपाधि से बदलने के बजाय हिंदी में “याहवे” लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धसूचक पद-समूह का सीधा और स्वाभाविक हिंदी रूप, जो याहवे की पहचान इस्राएल के परमेश्वर के रूप में कराता है।
- source_word: מִן הָעוֹלָם וְעַד הָעֹלָם
  choice: अनादिकाल से अनन्तकाल तक
  rationale: यह स्तुतिपरक मुहावरा असीम कालावधि व्यक्त करता है। चुना हुआ रूप हिंदी में सहज और गरिमापूर्ण है तथा आरम्भ और अन्त, दोनों दिशाओं में काल की असीमता बनाए रखता है।
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; “तब” घटनाक्रम को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: כָל הָעָם
  choice: सारी प्रजा
  rationale: यहाँ עָם एकत्रित जनसमुदाय को सूचित करता है। “सारी प्रजा” सामूहिक और सार्वजनिक प्रत्युत्तर को संक्षेप में व्यक्त करता है।
- source_word: אָמֵן
  choice: आमीन
  rationale: सभा के पारम्परिक प्रत्युत्तर को अनुवाद करने के बजाय प्रचलित धार्मिक लिप्यंतरण में रखा गया है।
- source_word: וְהַלֵּל לַיהוָה
  choice: और याहवे की स्तुति की
  rationale: संक्षिप्त हिब्रू अभिव्यक्ति को लोगों के प्रत्युत्तर का दूसरा कार्य मानकर स्वाभाविक हिंदी कथन बनाया गया है; वैकल्पिक आज्ञार्थक पठन पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। “याहवे” उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: עוֹלָם की कालगत सीमा
  choice: अनादिकाल से अनन्तकाल तक
  alternative: युग-युग तक / सदा से सदा तक
  rationale: यह पद स्तुति में असीम काल को व्यक्त करता है। अनुवाद हिब्रू मुहावरे का व्यापक कालगत आशय रखता है, पर उस पर किसी विशिष्ट दार्शनिक परिभाषा को आरोपित नहीं करता।
- issue: וְהַלֵּל לַיהוָה की वाक्यगत भूमिका
  choice: लोगों ने याहवे की स्तुति की
  alternative: 'उद्धृत आह्वान: “याहवे की स्तुति करो”'
  rationale: रूप अत्यन्त संक्षिप्त है और कथात्मक क्रिया अथवा स्तुति के आह्वान—दोनों रूपों में समझा जा सकता है। मुख्य पाठ में प्रसंगानुकूल कथात्मक अर्थ रखा गया है और दूसरी सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल किंतु स्तुतिपरक और गरिमापूर्ण रूप अपनाया गया है। वाक्यरचना सामान्य पाठकों के लिए सहज रखी गई है; “आमीन” और “याहवे” जैसे धार्मिक नाम/पद लिप्यंतरित हैं।
