  text: חִ֤ילוּ מִ/לְּ/פָנָי/ו֙ כָּל הָ/אָ֔רֶץ אַף תִּכּ֥וֹן תֵּבֵ֖ל בַּל תִּמּֽוֹט־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/030.yaml
  text: Tremble before him[a], all the earth; indeed, the world is established; it shall not be moved.
translation:
  language: hi
  text: हे सारी पृथ्वी, उसके सामने काँप! सचमुच, संसार दृढ़ता से स्थापित है; वह डगमगाएगा नहीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह हिलाया नहीं जाएगा।” इब्रानी में दृढ़ स्थिरता का चित्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִילוּ
  choice: काँप
  rationale: क़ाल आज्ञार्थक यहाँ परमेश्वर की उपस्थिति के सामने भय और विस्मय से काँपने का भाव देता है; आधुनिक हिन्दी में ‘काँप’ स्वाभाविक और सशक्त है।
- source_word: מִלְּפָנָיו
  choice: उसके सामने
  rationale: शाब्दिक भाव ‘उसके मुख/उपस्थिति के सामने से’ है; ‘उसके सामने’ हिन्दी में उपस्थिति और श्रद्धापूर्ण स्थिति दोनों को सहजता से व्यक्त करता है।
- source_word: כָּל הָאָרֶץ
  choice: हे सारी पृथ्वी
  rationale: स्तुति के इस विश्वव्यापी संदर्भ में אֶרֶץ किसी विशेष देश के बजाय पूरी पृथ्वी को सूचित करता है; सम्बोधन को स्पष्ट करने के लिए ‘हे’ जोड़ा गया है।
- source_word: אַף
  choice: सचमुच
  rationale: यहाँ यह केवल जोड़ नहीं, बल्कि अगले कथन पर बल देता है; ‘सचमुच’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּכּוֹן
  choice: दृढ़ता से स्थापित है
  rationale: निफ़अल रूप स्थापित और स्थिर होने का भाव रखता है; ‘दृढ़ता से स्थापित’ उसकी स्थायित्व-छवि को स्पष्ट रखता है।
- source_word: תֵּבֵל
  choice: संसार
  rationale: תֵּבֵל व्यवस्थित अथवा आबाद जगत को सूचित करता है; ‘संसार’ संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּל תִּמּוֹט
  choice: वह डगमगाएगा नहीं
  rationale: מוֹט का निफ़अल रूप डगमगाने, खिसकने या हिलाए जाने की छवि देता है; ‘डगमगाएगा नहीं’ दृढ़ स्थिरता को व्यक्त करता है और निरपेक्ष वैज्ञानिक गतिहीनता का अनावश्यक अर्थ नहीं लाता।
theological_decisions:
- issue: सृष्टि अथवा संसार की स्थिरता की भाषा
  choice: काव्यात्मक रूप से संसार की परमेश्वर-प्रदत्त दृढ़ता और सुव्यवस्था को व्यक्त करना
  alternative: ‘वह हिलाया नहीं जाएगा’ कहकर अधिक शाब्दिक निष्क्रिय रूप देना
  rationale: इब्रानी काव्य परमेश्वर के शासन में सृष्टि की दृढ़ता का दावा करता है, कोई वैज्ञानिक प्रतिपादन निर्दिष्ट नहीं करता। ‘डगमगाएगा नहीं’ मूल स्थिरता-चित्र को बनाए रखते हुए बाद की ब्रह्माण्ड-विज्ञान संबंधी बहस नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘हे सारी पृथ्वी’ सम्बोधन को स्पष्ट और स्वाभाविक बनाता है; ‘सचमुच’ emphatic אַף को व्यक्त करता है।
