  text: כִּ֠י כָּל אֱלֹהֵ֤י הָ/עַמִּים֙ אֱלִילִ֔ים וַ/יהוָ֖ה שָׁמַ֥יִם עָשָֽׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/026.yaml
  text: For all the gods of the peoples are idols[b][a], but Yahweh made the heavens.
translation:
  language: hi
  text: क्योंकि सभी लोगों के देवता मूर्तियाँ हैं, परन्तु याहवे ने आकाश बनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के आराधना-आह्वान का कारण बताता है और इब्रानी के व्याख्यात्मक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: כָּל אֱלֹהֵי הָעַמִּים
  choice: सब जातियों के देवता
  rationale: כָּל की व्यापकता, אֱלֹהֵי का सीधा अर्थ ‘देवता’, और עַמִּים का सामूहिक बहुवचन इस वाक्यांश में स्पष्ट रहते हैं।
- source_word: אֱלִילִים
  choice: मूर्तियाँ
  rationale: यह शब्द पूजी जाने वाली प्रतिमाओं के साथ उनकी व्यर्थता का तिरस्कारपूर्ण भाव भी रखता है; मुख्य पाठ में ‘मूर्तियाँ’ सहज और संक्षिप्त है।
- source_word: וַיהוָה
  choice: परन्तु यहोवा
  rationale: וְ का मूल अर्थ ‘और’ है, किंतु यहाँ जातियों के देवताओं और सृष्टिकर्ता यहोवा के बीच विरोध होने के कारण ‘परन्तु’ प्रसंगगत बल को व्यक्त करता है।
- source_word: שָׁמַיִם
  choice: आकाश
  rationale: सृष्टि-संदर्भ में यह इब्रानी शब्द आकाश/आकाशमंडल को दर्शाता है; ‘आकाश’ आधुनिक हिन्दी में स्वाभाविक सामूहिक पद है।
- source_word: עָשָׂה
  choice: बनाया
  rationale: עשה का सीधा और व्यापक अर्थ ‘बनाना’ है; ‘सृष्टि की’ की अपेक्षा यह मूल क्रिया से अधिक निकट है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है।
- issue: יהוה से पहले संयोजक וְ का बल
  choice: विरोधसूचक ‘परन्तु’
  alternative: साधारण संयोजन ‘और’
  rationale: इब्रानी में रूपतः ‘और’ है, पर दोनों उपवाक्यों का अर्थ स्पष्ट विरोध स्थापित करता है; ‘परन्तु’ उसी प्रवचनगत संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: אֱלִילִים का निंदात्मक अर्थ
  choice: मुख्य पाठ में ‘मूर्तियाँ’
  alternative: ‘व्यर्थ मूर्तियाँ’ या ‘निरर्थक वस्तुएँ’
  rationale: शब्द में व्यर्थता का भाव निहित है, किंतु उसे विशेषण जोड़कर अत्यधिक स्पष्ट करना मूल की संक्षिप्तता से आगे जाता; देवताओं और आकाश के निर्माता के बीच का विरोध भाव को पर्याप्त रूप से प्रकट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और साधारण पाठक के लिए स्पष्ट शैली। ‘परन्तु’ औपचारिक किंतु प्रचलित विरोधसूचक है; पद की काव्यात्मक समानांतरता सुरक्षित रखी गई है।
