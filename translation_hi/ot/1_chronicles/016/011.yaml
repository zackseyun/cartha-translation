base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/011.yaml
  text: Seek Yahweh and his strength[a]; seek his face continually.
translation:
  language: hi
  text: याहवे और उसके सामर्थ्य को खोजो; निरन्तर उसके मुख[a] को खोजो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसकी उपस्थिति’ (शाब्दिक अर्थ, ‘उसका मुख’)।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִּרְשׁוּ
  choice: खोजो
  rationale: आज्ञार्थक क्रिया यहाँ परमेश्वर की ओर सक्रिय रूप से मुड़ने और उसे पाने का प्रयत्न करने का आह्वान करती है; ‘खोजो’ इसका सहज और सीधा हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וְעֻזּוֹ
  choice: और उसके सामर्थ्य को
  rationale: עֹז का मूल अर्थ शक्ति या सामर्थ्य है। ‘सामर्थ्य’ वर्तमान प्रसंग में गरिमापूर्ण और स्पष्ट है तथा इसे ‘गढ़’ जैसे अधिक प्रसंग-निर्भर अर्थ में नहीं बदलता।
- source_word: בַּקְּשׁוּ
  choice: खोज करते रहो
  rationale: यह क्रिया लगन से खोजने का भाव रखती है। ‘करते रहो’ के साथ इसका आज्ञार्थक और निरन्तर प्रयास का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: פָנָיו
  choice: उसके मुख
  rationale: शाब्दिक चित्र ‘उसका मुख’ सुरक्षित रखा गया है; यह परमेश्वर की व्यक्तिगत उपस्थिति और अनुग्रह की खोज का संकेत दे सकता है, पर मुख्य पाठ उस निहितार्थ को एक ही व्याख्या में सीमित नहीं करता।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह शब्द लगातार या नियमित रूप से बने रहने का भाव देता है; ‘निरन्तर’ पद्य के उपदेशात्मक और गरिमापूर्ण स्वर के अनुकूल है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: ‘उसके मुख’ का आशय
  choice: मुख्य पाठ में शाब्दिक रूप ‘उसके मुख’
  alternative: उसकी उपस्थिति
  rationale: ‘मुख’ मूल रूपक को सुरक्षित रखता है, जबकि ‘उपस्थिति’ उसका सम्भावित मुहावरेदार अर्थ स्पष्ट करती है। सम्भावित अर्थ को पादटिप्पणी में रखने से मूल की चित्रात्मकता और अर्थगत खुलापन दोनों बने रहते हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त, आज्ञार्थक और गरिमापूर्ण रखी गई है। समानान्तर ‘खोज’ को दोनों खंडों में बनाए रखा गया है, जबकि ‘करते रहो’ से תָּמִיד की निरन्तरता स्वाभाविक रूप से उभरती है।
