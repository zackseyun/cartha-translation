base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/038.yaml
  text: And Obed-edom and their brothers[a], sixty-eight; and Obed-edom son of Jeduthun and Hosah were gatekeepers.
translation:
  language: hi
  text: और ओबेद-एदोम और उनके भाई[a]—अड़सठ जन; और यदूतून का पुत्र ओबेद-एदोम और होसा द्वारपाल थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘उनके भाई’ है। कुछ अनुवाद संबंध स्पष्ट करने के लिए ‘उसके भाई’ करते हैं, पर मुख्य पाठ उपलब्ध इब्रानी पाठ के बहुवचन संबंधसूचक रूप का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְ/עֹבֵד אֱדֹם
  choice: और ओबेद-एदोम
  rationale: आरंभिक וְ को सूची की पिछली कड़ी से जोड़ने वाले सामान्य संयोजक ‘और’ से व्यक्त किया गया है; नाम का मानक देवनागरी लिप्यंतरण रखा गया है।
- source_word: וַ/אֲחֵי/הֶם
  choice: और उनके भाई
  rationale: इब्रानी रूप में तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय है, इसलिए अस्पष्ट संदर्भ को एकवचन ‘उसके’ में बदलने के बजाय ‘उनके’ रखा गया है।
- source_word: שִׁשִּׁים וּ/שְׁמוֹנָה
  choice: अड़सठ जन
  rationale: संख्या को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; व्यक्तियों की गिनती स्पष्ट करने के लिए ‘जन’ जोड़ा गया है।
- source_word: וְ/עֹבֵד אֱדֹם
  choice: और ओबेद-एदोम
  rationale: नाम की दूसरी उपस्थिति को बनाए रखा गया है, ताकि इब्रानी की संरचना और उसमें निहित संभावित संदर्भगत तनाव न मिटे।
- source_word: בֶּן יְדִיתוּן
  choice: यदूतून का पुत्र
  rationale: वंशगत पहचान को सीधे और औपचारिक रूप में प्रस्तुत किया गया है।
- source_word: וְ/חֹסָה
  choice: और होसा
  rationale: नाम का देवनागरी लिप्यंतरण किया गया है और संयोजक से उसे ओबेद-एदोम के साथ समान भूमिका में जोड़ा गया है।
- source_word: לְ/שֹׁעֲרִים
  choice: द्वारपाल थे
  rationale: לְ यहाँ नियुक्त भूमिका या कार्य बताता है। स्वाभाविक हिन्दी वाक्य के लिए सहायक क्रिया ‘थे’ जोड़ी गई है; ‘द्वारपाल’ पद का संक्षिप्त और प्रचलित रूप है।
