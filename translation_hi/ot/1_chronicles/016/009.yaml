base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/009.yaml
  text: Sing to him[a]; sing praises to him; speak of all his wondrous deeds.
translation:
  language: hi
  text: उसके लिए गाओ, उसका गुणगान करो; उसके सब अद्भुत कामों की चर्चा करो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके सब आश्चर्यकर्मों का वर्णन करो,” अथवा “उसके सब अद्भुत कामों पर मनन करो।” इब्रानी क्रिया बोलने और मनन करने—दोनों का भाव दे सकती है; यहाँ सार्वजनिक आह्वान का प्रसंग बोलकर बताने के अर्थ का अधिक समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; काव्यात्मक समानांतरता बनाए रखता है।
- source_word: לֹו
  choice: उसके लिए
  rationale: ל उपसर्ग यहाँ गीत और स्तुति को परमेश्वर की ओर निर्देशित करता है; आधुनिक हिन्दी में ‘उसके लिए गाओ’ स्वाभाविक है।
- source_word: זַמְּרוּ
  choice: उसका गुणगान करो
  rationale: पिएल रूप זמר संगीत सहित स्तुति करने का भाव देता है। ‘गुणगान करो’ पहले ‘गाओ’ से भेद रखते हुए आराधनात्मक आशय प्रकट करता है।
- source_word: שִׂיחוּ
  choice: चर्चा करो
  rationale: שׂיח बोलने, वर्णन करने अथवा मनन करने का अर्थ दे सकता है। सार्वजनिक आह्वान के प्रसंग में बाहरी वाचिक अर्थ अधिक उपयुक्त है, जबकि पादटिप्पणी वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: בְּכָל
  choice: सब ... की
  rationale: हिन्दी में ‘चर्चा करना’ के साथ संबंधकारक प्रयोग स्वाभाविक है और כָּל की समग्रता बनाए रखता है।
- source_word: נִפְלְאֹתָיו
  choice: उसके सब अद्भुत कामों
  rationale: यह शब्द आश्चर्य उत्पन्न करने वाले, विशेषतः परमेश्वर के सामर्थी कार्यों को दर्शाता है; ‘अद्भुत काम’ सहज और ठोस अभिव्यक्ति है।
