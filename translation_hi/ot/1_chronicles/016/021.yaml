base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/021.yaml
  text: He allowed no man to oppress them[a], and he rebuked kings on their account,
translation:
  language: hi
  text: उसने किसी मनुष्य को उन पर अत्याचार करने नहीं दिया, और उनके कारण[a] राजाओं को डाँटा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनकी खातिर’ अथवा ‘उनके संबंध में।’
