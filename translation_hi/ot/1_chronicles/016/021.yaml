lexical_decisions:
- source_word: הִנִּיחַ
  choice: करने नहीं दिया
  rationale: हिफ़ील रूप, निषेध और क्रिया के साथ यहाँ अनुमति न देने का भाव व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אִישׁ
  choice: किसी मनुष्य को
  rationale: एकवचन पुल्लिंग संज्ञा यहाँ सामान्य अर्थ में प्रयुक्त है; यह अनिश्चित व्यापकता को बनाए रखती है।
- source_word: לְעָשְׁקָם
  choice: उन पर अत्याचार करने
  rationale: עשׁק उत्पीड़न, शोषण या अन्यायपूर्ण दुर्व्यवहार का अर्थ दे सकता है; संदर्भ में ‘अत्याचार’ इसका व्यापक और स्वाभाविक हिन्दी रूप है।
- source_word: וַיּוֹכַח
  choice: डाँटा
  rationale: יכח यहाँ राजाओं के विरुद्ध फटकार या ताड़ना व्यक्त करता है; ‘डाँटा’ साधारण पाठक के लिए स्पष्ट और सशक्त है।
- source_word: עֲלֵיהֶם
  choice: उनके कारण
  rationale: עַל और सर्वनाम-प्रत्यय यहाँ उनके संबंध में अथवा उनके पक्ष में की गई कार्रवाई बताता है; ‘उनके कारण’ मूल की कारणात्मक अस्पष्टता बनाए रखता है।
- source_word: מְלָכִים
  choice: राजाओं
  rationale: यह संज्ञा सीधे ‘राजाओं’ को सूचित करती है; इसे अधिक सामान्य ‘शासकों’ में बदलने की आवश्यकता नहीं है।
theological_decisions:
- issue: क्रियाओं का अंतर्निहित कर्ता
  choice: ‘उसने’, जिसका संदर्भ पिछले प्रसंग से परमेश्वर की ओर है
  alternative: कोई अनिर्दिष्ट कर्ता
  rationale: इब्रानी में कर्ता सर्वनाम अलग से नहीं है, पर आसपास का प्रसंग इन सुरक्षात्मक कार्यों का कर्ता यहोवा को ठहराता है। पठनीय हिन्दी के लिए ‘उसने’ दिया गया है, बिना पद में परमेश्वर का नाम जोड़कर अधिक स्पष्टता आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की समानांतर संरचना और मूल की कारणात्मक/हितार्थक संभाव्यता यथासंभव सुरक्षित रखी गई है।
