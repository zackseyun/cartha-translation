  text: אָסָ֥ף הָ/רֹ֖אשׁ וּ/מִשְׁנֵ֣/הוּ זְכַרְיָ֑ה יְעִיאֵ֡ל וּ/שְׁמִֽירָמ֡וֹת וִֽ/יחִיאֵ֡ל וּ/מַתִּתְיָ֡ה וֶ/אֱלִיאָ֡ב וּ/בְנָיָהוּ֩ וְ/עֹבֵ֨ד אֱדֹ֜ם וִֽ/יעִיאֵ֗ל בִּ/כְלֵ֤י נְבָלִים֙ וּ/בְ/כִנֹּר֔וֹת וְ/אָסָ֖ף בַּֽ/מְצִלְתַּ֥יִם מַשְׁמִֽיעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/005.yaml
  text: Asaph was the chief[a], and second to him was Zechariah; then Jeiel, Shemiramoth, Jehiel, Mattithiah, Eliab, Benaiah, Obed-edom, and Jeiel, with instruments of harps and lyres[b]; and Asaph sounded the cymbals.
translation:
  language: hi
  text: आसाफ प्रधान था,[a] और उसके बाद दूसरे स्थान पर जकर्याह था; फिर यीएल, शमीरामोत, यहीएल, मत्तित्याह, एलीआब, बनायाह, ओबेद-एदोम और यीएल नबाल और किंनोर नाम के तारवाद्य बजाते थे,[b] और आसाफ झाँझ बजाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसका दूसरा जकर्याह था।” इब्रानी शब्द आसाफ के संबंध में दूसरे पद या स्थान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में दो अलग प्राचीन तारवाद्यों, नबालिम और किन्नोरोत, का उल्लेख है। उनकी ठीक बनावट निश्चित नहीं है; इसलिए यहाँ उनके नामों का लिप्यंतरण किया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: הָרֹאשׁ
  choice: प्रधान
  rationale: यहाँ רֹאשׁ शरीर के अंग के लिए नहीं, बल्कि संगीतकारों के बीच नेतृत्व या सर्वोच्च पद के लिए प्रयुक्त है; ‘प्रधान’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: וּמִשְׁנֵהוּ
  choice: और उसके बाद दूसरे स्थान पर ... था
  rationale: प्रत्यय सहित מִשְׁנֵהוּ आसाप की तुलना में दूसरे पद को दर्शाता है। यह रूप पदानुक्रम स्पष्ट करता है, पर इसे सहायक या उत्तराधिकारी के विशिष्ट पद के रूप में नहीं बाँधता।
- source_word: יְעִיאֵל / וִיעִיאֵל
  choice: यीएल
  rationale: पद में इसी वर्तनी वाला नाम दो बार आता है; दोनों स्थानों पर एक ही मानकीकृत हिन्दी लिप्यंतरण रखा गया है।
- source_word: בִּכְלֵי נְבָלִים
  choice: सारंगी
  rationale: נֵבֶל एक प्राचीन तारवाद्य था जिसकी ठीक आधुनिक पहचान अनिश्चित है। ‘सारंगी’ सामान्य हिन्दी पाठक के लिए तारवाद्य का बोध कराती है, जबकि पादटिप्पणी ऐतिहासिक समानता का दावा किए बिना भेद स्पष्ट करती है।
- source_word: וּבְכִנֹּרוֹת
  choice: वीणा
  rationale: כִּנּוֹר भी एक अलग प्रकार का प्राचीन तारवाद्य था। ‘वीणा’ परिचित हिन्दी नाम है और נֵבֶל से उसका शब्दगत भेद बनाए रखता है।
- source_word: בַּמְצִלְתַּיִם
  choice: झाँझ
  rationale: מְצִלְתַּיִם धातु के परस्पर टकराए जाने वाले तालवाद्य को दर्शाता है; ‘झाँझ’ आधुनिक हिन्दी में स्वाभाविक समतुल्य है।
- source_word: מַשְׁמִיעַ
  choice: बजाता था
  rationale: שׁמע का हिफ़ील कृदन्त यहाँ झाँझ को सुनाने या ध्वनित करने की क्रिया बताता है। वाद्य के साथ ‘बजाता था’ स्वाभाविक हिन्दी है और कृदन्त की निरंतर भूमिका को व्यक्त करता है।
