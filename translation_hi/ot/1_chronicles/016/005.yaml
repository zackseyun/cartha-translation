  register: भाषा आधुनिक मानक हिन्दी में, सूची-सदृश मूल संरचना को पठनीय बनाते हुए रखी गई है। व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप लिए गए हैं। पदानुक्रम और प्राचीन वाद्यों की अनिश्चितता को पादटिप्पणियों में सुरक्षित रखा गया है।
