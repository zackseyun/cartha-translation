source:
  edition: WLC
  text: וַ/יִּתֵּ֞ן לִ/פְנֵ֨י אֲר֧וֹן יְהוָ֛ה מִן הַ/לְוִיִּ֖ם מְשָׁרְתִ֑ים וּ/לְ/הַזְכִּיר֙ וּ/לְ/הוֹד֣וֹת וּ/לְ/הַלֵּ֔ל לַ/יהוָ֖ה אֱלֹהֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/004.yaml
  text: He appointed some of the Levites to minister before the ark of Yahweh[a], to commemorate, to give thanks, and to praise Yahweh, the God of Israel.
translation:
  language: hi
  text: उसने लेवियों में से कुछ को याहवे के संदूक के सामने सेवा करने, स्मरण कराने[a], धन्यवाद देने और इस्राएल के परमेश्वर याहवे की स्तुति करने के लिए नियुक्त किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्मरणोत्सव मनाएँ” अथवा “उल्लेख करें।” इब्रानी क्रिया उपासना के संदर्भ में किसी बात को स्मरण में लाने का भाव व्यक्त कर सकती है।
    reason: וּלְהַזְכִּיר के कारक और उपासनात्मक अर्थ की सम्भावनाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: नियुक्त किया
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दिया/रखा’ है, पर लोगों को आराधना-सेवा सौंपने के इस प्रशासनिक संदर्भ में ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: מִן הַלְוִיִּם
  choice: कुछ लेवियों को
  rationale: מִן यहाँ अंशवाचक है; सभी लेवियों के बजाय उनमें से कुछ को नियुक्त किया गया।
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: याहवे के सन्दूक के सामने
  rationale: यह सन्दूक के सम्मुख उनकी उपासना-सेवा का स्थान व्यक्त करता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखता है।
- source_word: מְשָׁרְתִים
  choice: सेवा करने के लिए
  rationale: कृदन्त यहाँ पवित्रस्थान से जुड़ी आराधना-सेवा की भूमिका बताता है; ‘सेवा करना’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וּלְהַזְכִּיר
  choice: ताकि वे स्मरण कराएँ
  rationale: זכר का हिफ़ील रूप किसी बात को स्मरण में लाने या उसका उल्लेख कराने का भाव दे सकता है। ‘स्मरण कराएँ’ मूल के कारक भाव को बचाता है, जबकि उसकी उपासनात्मक व्याप्ति पादटिप्पणी में दी गई है।
- source_word: וּלְהוֹדוֹת
  choice: धन्यवाद दें
  rationale: आराधना के इस संदर्भ में ידה का अर्थ अंगीकार करने के बजाय धन्यवाद देना है।
- source_word: וּלְהַלֵּל
  choice: स्तुति करें
  rationale: पिएल में הלל का सामान्य अर्थ स्तुति करना है; मूल पाठ स्पष्ट रूप से गाने का उल्लेख नहीं करता।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह मूल सम्बन्धवाचक संरचना और वाचा से जुड़े पदनाम को सीधे तथा स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יְהוָה है। ‘याहवे’ उपाधि से बदलने के बजाय उस नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण प्रस्तुत करता है।
- issue: וּלְהַזְכִּיר का उपासनात्मक आशय
  choice: स्मरण कराएँ
  alternative: स्मरणोत्सव मनाएँ; उल्लेख करें
  rationale: मूल क्रिया में स्मरण कराने, स्मारक रूप से याद करने या उल्लेख करने की वास्तविक अर्थगत गुंजाइश है। मुख्य पाठ कारक भाव को रखता है और पादटिप्पणी अन्य सम्भावनाएँ बताती है, बिना किसी विशेष धार्मिक व्याख्या को निर्णायक बनाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सन्दूक’, ‘लेवी’, ‘स्तुति’ और ‘परमेश्वर’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्य में उद्देश्य व्यक्त करने के लिए ‘ताकि’ का प्रयोग किया गया है।
