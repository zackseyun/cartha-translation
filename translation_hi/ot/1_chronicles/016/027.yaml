id: 1CH.16.27
reference: 1 Chronicles 16:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ה֤וֹד וְ/הָדָר֙ לְ/פָנָ֔י/ו עֹ֥ז וְ/חֶדְוָ֖ה בִּ/מְקֹמֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/027.yaml
  text: Splendor and majesty are before him[a]; strength and joy are in his place.
translation:
  language: hi
  text: वैभव और प्रताप उसके सामने हैं; सामर्थ्य और आनंद उसके स्थान में[a] हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके निवास-स्थान में” अथवा “उसके पवित्रस्थान में।” इब्रानी में “उसके स्थान में” है, जो भजन 96:6 के समानांतर वचन की अभिव्यक्ति से अधिक व्यापक है।
    reason: मूल इब्रानी की व्यापक अभिव्यक्ति और प्रसंग से संभव अधिक विशिष्ट अर्थों—निवास-स्थान या पवित्रस्थान—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: הוֹד
  choice: वैभव
  rationale: यह शब्द भव्य, राजसी शोभा को व्यक्त करता है। ‘वैभव’ काव्यात्मक गरिमा बनाए रखता है और इसके साथ आए הָדָר से अलग अर्थ-छाया देता है।
- source_word: הָדָר
  choice: प्रताप
  rationale: यहाँ इसका भाव राजसी गरिमा और महिमा का है। ‘प्रताप’ ‘वैभव’ का स्वाभाविक काव्यात्मक सहचर है, पर दोनों शब्दों को एक ही अर्थ में नहीं मिला देता।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: इब्रानी अभिव्यक्ति का शाब्दिक भाव ‘उसके मुख के सामने’ है। ‘उसके सामने’ आधुनिक हिन्दी में स्वाभाविक रहते हुए स्थानिक और उपस्थिति-संबंधी बिंब को बनाए रखता है।
- source_word: עֹז
  choice: सामर्थ्य
  rationale: यह शब्द शक्ति या बल को दर्शाता है। ‘सामर्थ्य’ पद की गरिमापूर्ण काव्य-शैली के अनुरूप है।
- source_word: חֶדְוָה
  choice: आनंद
  rationale: यह शब्द आनंद और हर्ष का बोध देता है। ‘आनंद’ संक्षिप्त, सहज और ‘सामर्थ्य’ के साथ काव्यात्मक संतुलन रखता है।
- source_word: בִּמְקֹמוֹ
  choice: उसके स्थान में
  rationale: मूल शब्द व्यापक अर्थ में ‘स्थान’ कहता है। आराधना का प्रसंग निवास-स्थान या पवित्रस्थान की ओर संकेत कर सकता है, पर मूल पाठ उसे स्पष्ट रूप से सीमित नहीं करता; इसलिए व्यापक अभिव्यक्ति रखी गई है।
theological_decisions:
- issue: क्या מְקוֹמוֹ को विशेष रूप से पवित्रस्थान या मंदिर के रूप में समझाया जाए
  choice: मुख्य पाठ में व्यापक अर्थ वाला ‘उसके स्थान में’
  alternative: ‘उसके निवास-स्थान में’ अथवा ‘उसके पवित्रस्थान में’
  rationale: तात्कालिक प्रसंग आराधना से जुड़ा है और भजन 96:6 के समानांतर वचन में ‘उसके पवित्रस्थान में’ आता है; फिर भी इतिहास की पुस्तक यहाँ מְקוֹמוֹ, अर्थात ‘उसका स्थान’, कहती है। इसलिए समानांतर वचन के अनुसार पाठ को बदलने के बजाय मूल की व्यापकता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर स्तुति-काव्य की गरिमा बनाए रखने के लिए ‘वैभव’, ‘प्रताप’ और ‘सामर्थ्य’ जैसे सहज, ऊँचे शब्द चुने गए हैं। वाक्य की दो समानांतर पंक्तियों का संतुलन और मूल का संक्षिप्त काव्यात्मक रूप सुरक्षित रखा गया है।
