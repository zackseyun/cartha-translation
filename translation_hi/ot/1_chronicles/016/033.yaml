  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ निजी ईश्वरीय नाम का प्रयोग करता है; ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: הָאָרֶץ का क्षेत्र
  choice: पृथ्वी
  alternative: देश; भूमि
  rationale: आसपास का सृष्टि-व्यापी काव्यात्मक संदर्भ सार्वभौमिक अर्थ का समर्थन करता है, पर स्थानीय ‘भूमि/देश’ का अर्थ भाषिक रूप से सम्भव है।
- issue: בָא का कालगत बल
  choice: आ रहा है
  alternative: आता है; आ चुका है
  rationale: इब्रानी पूर्ण रूप यहाँ काव्य में निश्चित अथवा आसन्न घटना को सजीव बना सकता है; किसी एक कालगत व्याख्या को पूर्णतः निर्विवाद नहीं माना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, काव्यात्मक किन्तु सामान्य पाठक के लिए सहज और गरिमापूर्ण। ‘आनन्द से गा उठेंगे’ मानवीकरण और उल्लास दोनों को बनाए रखता है। सभी वैकल्पिक अर्थों को पादटिप्पणियों में सुरक्षित रखा गया है।
