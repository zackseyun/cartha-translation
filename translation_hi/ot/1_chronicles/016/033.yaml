  text: Then the trees of the forest will sing for joy before Yahweh[c][b][a], for he comes to judge the earth.
translation:
  language: hi
  text: तब वन के वृक्ष याहवे के सामने आनन्द से गा उठेंगे[a], क्योंकि वह पृथ्वी का न्याय करने आ रहा है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आनन्द से जयकार करेंगे।” इब्रानी क्रिया उल्लास की ऊँची ध्वनि को सूचित कर सकती है, चाहे वह गाकर हो या पुकारकर।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि वह पृथ्वी का न्याय करने आता है।” इब्रानी रूप काव्यात्मक प्रसंग में आने वाली घटना को सजीव निश्चितता के साथ व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “भूमि का।” इब्रानी शब्द किसी विशेष देश या भूमि को भी सूचित कर सकता है; यहाँ सृष्टि-व्यापी प्रसंग के कारण “पृथ्वी” चुना गया है।
    reason: alternative_reading
