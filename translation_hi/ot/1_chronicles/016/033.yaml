- source_word: עֲצֵי הַיָּעַר
  choice: वन के वृक्ष
  rationale: सम्बन्धवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो वृक्षों के मानवीकरण को बनाए रखता है।
- source_word: מִלִּפְנֵי
  choice: के सामने
  rationale: यहाँ यह यहवे की उपस्थिति में आनन्द मनाने का भाव देता है; ‘के सामने’ हिन्दी में सहज है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह वृक्षों के आनन्द का कारण प्रस्तुत करता है।
- source_word: בָא
  choice: आ रहा है
  rationale: काव्यात्मक प्रसंग में पूर्ण रूप निकट और निश्चित आगमन को सजीव ढंग से व्यक्त कर सकता है; ‘आ रहा है’ उस प्रगतिशील और आसन्न भाव को सुरक्षित रखता है।
- source_word: לִשְׁפּוֹט
  choice: न्याय करने
  rationale: यहाँ न्यायिक शासन का प्राथमिक भाव है; ‘न्याय करने’ सीधा और धर्मवैचारिक भार बनाए रखने वाला रूप है।
- source_word: הָאָרֶץ
  choice: पृथ्वी
  rationale: सृष्टि के व्यापक स्तुतिगान के प्रसंग में सार्वभौमिक क्षेत्र अभिप्रेत जान पड़ता है, इसलिए ‘पृथ्वी’ चुना गया है।
theological_decisions:
