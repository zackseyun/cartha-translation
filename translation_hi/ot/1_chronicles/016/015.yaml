base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/015.yaml
  text: Remember his covenant forever[a], the word he commanded for a thousand generations.
translation:
  language: hi
  text: उसकी वाचा को सदा स्मरण रखो—उस वचन को, जिसकी आज्ञा उसने हज़ार पीढ़ियों के लिए दी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रतिज्ञा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: स्मरण रखो
  rationale: यह क़ाल आज्ञार्थक बहुवचन है और समुदाय को सीधा संबोधन देता है। ‘स्मरण रखो’ आधुनिक, गरिमापूर्ण हिन्दी में निरंतर याद रखने का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा
  rationale: यह स्थायी अथवा निरंतर अवधि बताता है। ‘सदा’ संक्षिप्त, सहज और काव्यात्मक हिन्दी है।
- source_word: בְּרִיתוֹ
  choice: उसकी वाचा
  rationale: धर्मशास्त्रीय संदर्भ में בְּרִית परमेश्वर की बंधनकारी प्रतिबद्धता को सूचित करता है; ‘वाचा’ हिन्दी बाइबलीय प्रयोग में सटीक और प्रतिष्ठित शब्द है।
- source_word: דָּבָר
  choice: उस वचन को
  rationale: דָּבָר का मूल अर्थ ‘वचन/बात’ है। ‘वचन’ मूल की व्यापकता को बनाए रखता है और प्रसंग से प्रतिज्ञात्मक अर्थ सुनाई दे सकता है, बिना उसे मुख्य पाठ में निश्चित किए।
- source_word: צִוָּה
  choice: जिसकी आज्ञा उसने ... दी थी
  rationale: צוה का सामान्य अर्थ ‘आज्ञा देना’ है। सम्बन्धवाचक रचना हिन्दी में ‘वाचा’ और ‘वचन’ के समानाधिकरण संबंध को स्पष्ट और स्वाभाविक बनाती है।
- source_word: לְאֶלֶף דּוֹר
  choice: हज़ार पीढ़ियों के लिए
  rationale: यह पीढ़ियों तक बने रहने वाली अवधि या विस्तार व्यक्त करता है। यह अनुवाद संख्या को न तो केवल शाब्दिक घोषित करता है, न मुहावरे के रूप में सीमित करता है।
theological_decisions:
- issue: דָּבָר को ‘वचन’ कहा जाए या अधिक व्याख्यात्मक ‘प्रतिज्ञा’
  choice: वचन
  alternative: प्रतिज्ञा
  rationale: मूल शब्द ‘प्रतिज्ञा’ से अधिक व्यापक है। मुख्य पाठ में ‘वचन’ रखने से मूल की अर्थगत खुलावट बनी रहती है; वाचा के संदर्भ में संभव ‘प्रतिज्ञा’ अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामुदायिक उपदेशात्मक शैली। ‘वाचा’ और ‘वचन’ जैसे स्थापित बाइबलीय शब्द रखे गए हैं; वाक्य-संरचना को सामान्य पाठक के लिए स्वाभाविक बनाया गया है।
