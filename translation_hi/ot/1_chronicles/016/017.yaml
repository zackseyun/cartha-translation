  verdict: revise
  source_fidelity: The draft correctly retains the initial conjunction, the anaphoric object pronoun, the Jacob/Israel parallelism, and the covenant terminology. However, ‘...विधि के रूप में दृढ़ किया’ is not an idiomatic or sufficiently clear Hindi rendering of the Hiphil of עמד in this construction. ‘स्थापित किया’ more naturally conveys making the antecedent covenantal matter binding/established without narrowing its referent.
  naturalness: The proposed revision is modern, formal Hindi and preserves the Hebrew’s compact parallel structure. ‘विधि के रूप में स्थापित किया’ is substantially more natural than ‘विधि के रूप में दृढ़ किया.’
  terminology: ‘विधि’ appropriately represents חֹק, and ‘वाचा’ retains the central covenant term בְּרִית. ‘सदा की’ is a natural rendering of עוֹלָם here. The footnote offers ‘दृढ़ किया’ as a viable lexical alternative to the primary rendering.
  issues:
  - severity: medium
    issue: ‘उसे ... एक विधि के रूप में दृढ़ किया’ is semantically awkward Hindi.
    rationale: In Hindi, ‘दृढ़ करना’ normally means to strengthen or make firm; with ‘विधि के रूप में’ it does not naturally express the Hebrew causative sense of establishing/validating the prior covenantal statement. ‘स्थापित किया’ does so clearly and idiomatically.
