base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/017.yaml
  text: And he confirmed it to Jacob as a statute[a], to Israel as an everlasting covenant[b],
translation:
  language: hi
  text: 'और उसने उसे याकूब के लिए एक विधि के रूप में स्थापित किया[a],

    इस्राएल के लिए सदा की वाचा के रूप में[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृढ़ किया।’ इब्रानी क्रिया में किसी बात को स्थिर या दृढ़ता से स्थापित करने का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सनातन वाचा के रूप में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמִידֶהָ
  choice: और उसने उसे ... दृढ़ किया
  rationale: עמד के हिफ़ील रूप का भाव किसी बात को स्थिर या प्रभावी बनाए रखने का है। ‘दृढ़ किया’ वाचा-संबंधी संदर्भ में स्वाभाविक है; ‘उसे’ स्त्रीलिंग प्रत्यय के पूर्ववर्ती वाचा/शपथ-संबंधी कथन की ओर संकेत को खुला रखता है। आरंभिक ‘और’ וַ को व्यक्त करता है।
- source_word: לְיַעֲקֹב לְחֹק
  choice: याकूब के लिए एक विधि के रूप में
  rationale: לְיַעֲקֹב हितग्राही को और לְחֹק उस निश्चित वैधानिक स्वरूप को दर्शाता है जिसमें प्रतिज्ञा दृढ़ की गई। ‘विधि’ חֹק के औपचारिक अर्थ को सहज आधुनिक हिन्दी में रखता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: यह याकूब वाली समानांतर रचना को बनाए रखता है और याकूब/इस्राएल की इब्रानी पुनरुक्ति को समतल नहीं करता।
- source_word: בְּרִית עוֹלָם
  choice: सदा की वाचा
  rationale: ‘वाचा’ בְּרִית का केंद्रीय धर्मवैचारिक अर्थ सुरक्षित रखता है। ‘सदा की’ עוֹלָם की स्थायी, निरंतर वैधता व्यक्त करता है, बिना दार्शनिक अनंतता को अनावश्यक रूप से आरोपित किए।
theological_decisions:
- issue: וַיַּעֲמִידֶהָ में स्त्रीलिंग कर्म-प्रत्यय का संदर्भ
  choice: ‘उसे’ द्वारा संदर्भ को खुला रखा गया है, जो पिछले प्रसंग की वाचा-संबंधी प्रतिज्ञा या शपथ की ओर लौट सकता है।
  alternative: इसे केवल पिछली पंक्ति की ‘शपथ’ का स्पष्ट संदर्भ मानना।
  rationale: निकटवर्ती प्रसंग में वाचा, वचन और शपथ समानांतर रूप से आते हैं। किसी एक पूर्वपद को निश्चित कर देने के बजाय सर्वनाम इब्रानी की वास्तविक संदर्भगत गुंजाइश बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता बनाए रखने के लिए दोनों पंक्तियों में ‘के लिए ... के रूप में’ की रचना प्रयुक्त हुई है।
