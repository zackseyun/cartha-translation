source:
  edition: WLC
  text: וַ/יַּֽעֲזָב שָׁ֗ם לִ/פְנֵי֙ אֲר֣וֹן בְּרִית יְהוָ֔ה לְ/אָסָ֖ף וּ/לְ/אֶחָ֑י/ו לְ/שָׁרֵ֞ת לִ/פְנֵ֧י הָ/אָר֛וֹן תָּמִ֖יד לִ/דְבַר י֥וֹם בְּ/יוֹמֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/037.yaml
  text: So he left Asaph and his brothers there before the ark of the covenant of Yahweh[a], to minister before the ark continually, according to each day's requirement.
translation:
  language: hi
  text: तब उसने आसाफ और उसके भाइयों को वहाँ याहवे की वाचा के संदूक के सामने छोड़ दिया, ताकि वे संदूक के सामने निरन्तर सेवा करते रहें, हर दिन के निर्धारित कार्य के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲזָב
  choice: उसने ... छोड़ दिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘छोड़ना’ है; यहाँ इसका आशय उन्हें निरन्तर सेवा के लिए वहीं रहने देना है। ‘नियुक्त किया’ संदर्भानुकूल तो है, पर मूल से अधिक व्याख्यात्मक है।
- source_word: לִפְנֵי אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा के संदूक के सामने
  rationale: सम्बन्ध-श्रृंखला और स्थान/उपासना-सूचक ‘सामने’ दोनों सुरक्षित रखे गए हैं; יְהוָה को व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिखा गया है।
- source_word: לְאָסָף וּלְאֶחָיו
  choice: आसाप और उसके भाइयों को
  rationale: ‘भाइयों’ मूल का सीधा अर्थ है और इस प्रसंग में सहकर्मी लेवियों को भी सूचित कर सकता है; व्यापक अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: לְשָׁרֵת
  choice: सेवा करें
  rationale: यहाँ पवित्र स्थान से जुड़ी नियमित उपासना-सेवा अभिप्रेत है। आधुनिक हिन्दी में ‘सेवा करें’ स्वाभाविक और गरिमापूर्ण है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: शब्द नियमित और लगातार जारी रहने वाली सेवा को व्यक्त करता है।
- source_word: לִדְבַר יוֹם בְּיוֹמוֹ
  choice: हर दिन की आवश्यकता के अनुसार
  rationale: शाब्दिक रूप ‘एक दिन के विषय के अनुसार, उसके दिन में’ है; हिन्दी में यह उस दिन के निर्धारित कार्य या आवश्यकता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरी व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: אֶחָיו का सामुदायिक अर्थ
  choice: उसके भाइयों
  alternative: उसके साथी लेवियों
  rationale: प्रसंग में सहकर्मी लेवी सम्भव हैं, पर मूल का पारिवारिक/सामुदायिक शब्द व्यापक अर्थ रखता है; इसलिए व्याख्यात्मक सीमांकन से बचा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और उपासना-संदर्भ के अनुकूल। ‘सन्दूक’ के बजाय प्रचलित आधुनिक वर्तनी ‘संदूक’ और ‘निरन्तर’ का मानक रूप रखा गया है। मूल की पुनरुक्ति ‘संदूक के सामने’ दोनों स्थानों पर सुरक्षित है।
