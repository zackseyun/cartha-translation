  text: when you were few in number[a], very few, and sojourners in it,
translation:
  language: hi
  text: जब तुम गिनती में थोड़े[a], बहुत ही थोड़े, और उस देश में परदेशी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सचमुच थोड़े” या “लगभग न के बराबर”; इब्रानी उनकी अत्यन्त छोटी संख्या पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּהְיוֹתְכֶם
  choice: जब तुम ... थे
  rationale: ב के साथ היה का infinitive construct और द्वितीय पुरुष बहुवचन प्रत्यय एक कालवाचक उपवाक्य बनाते हैं; यह हिंदी में उसका स्वाभाविक रूप है।
- source_word: מְתֵי מִסְפָּר
  choice: गिनती में थोड़े
  rationale: यह इब्रानी मुहावरा ऐसे छोटे समूह को दर्शाता है जिसे आसानी से गिना जा सके; यह अनुवाद संख्या की अल्पता को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: כִּמְעַט
  choice: बहुत ही थोड़े
  rationale: यहाँ यह पहले कही गई संख्या की अल्पता पर बल देता है; 'बहुत ही थोड़े' उस तीव्रता को स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: וְגָרִים
  choice: और ... परदेशी
  rationale: גור का कृदन्त ऐसे लोगों को दर्शाता है जो अपनी भूमि से बाहर अस्थायी निवासी के रूप में रहते हैं; 'परदेशी' सामाजिक और स्थानिक भाव को संक्षेप में रखता है।
- source_word: בָּהּ
  choice: उस देश में
  rationale: स्त्रीलिंग एकवचन प्रत्यय निकटवर्ती संदर्भ में उल्लिखित देश की ओर संकेत करता है; हिंदी में संदर्भ को स्पष्ट करने के लिए संज्ञा दोहराना स्वाभाविक है।
