  yaml_path: translation/ot/1_chronicles/016/022.yaml
  text: Do not touch my anointed ones[a], and do not harm my prophets.
translation:
  language: hi
  text: “मेरे अभिषिक्तों[a] को मत छुओ, और मेरे नबियों को हानि मत पहुँचाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे अभिषिक्त जन”; मूल इब्रानी में शब्दशः “मेरे अभिषिक्तों।” यह इब्रानी शब्द “मसीह” शब्द से संबंधित है, पर यहाँ इसका प्रयोग व्यापक अर्थ में परमेश्वर द्वारा अभिषिक्त लोगों के लिए है, किसी विशिष्ट मसीहाई उपाधि के लिए नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּגְּעוּ
  choice: मत छूना
  rationale: נגע का सीधा अर्थ ‘छूना’ है। इस निषेधात्मक संदर्भ में समानांतर वाक्यांश शत्रुतापूर्ण स्पर्श का भाव देता है, पर अनुवाद मूल की संक्षिप्तता बनाए रखता है।
- source_word: בִּמְשִׁיחָי
  choice: मेरे अभिषिक्त जनों
  rationale: מָשִׁיחַ का अर्थ ‘अभिषिक्त जन’ है। यहाँ रूप बहुवचन तथा प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय के साथ है; ‘जनों’ से बहुवचन स्पष्ट और स्वाभाविक रहता है।
- source_word: וּבִנְבִיאַי
  choice: और मेरे नबियों
  rationale: נָבִיא का सामान्य अर्थ ‘नबी’ है; यहाँ बहुवचन और ‘मेरे’ का संबंध स्पष्ट रूप से व्यक्त किया गया है।
- source_word: תָּרֵעוּ
  choice: हानि मत पहुँचाना
  rationale: רעע के हिफ़ील रूप का अर्थ किसी के साथ बुरा करना या उसे हानि पहुँचाना है। यह चयन स्वाभाविक हिंदी में अर्थ को पर्याप्त व्यापक रखता है।
- source_word: אַל
  choice: मत
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है; हिंदी में ‘मत’ इसका संक्षिप्त और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: מְשִׁיחָי का गैर-मसीहाई बहुवचन संदर्भ
  choice: मेरे अभिषिक्त जनों
  alternative: मेरे मसीहों / मेरे अभिषिक्तों
  rationale: यहाँ इब्रानी शब्द बहुवचन में उन लोगों के लिए व्यापक रूप से प्रयुक्त है जिन्हें परमेश्वर ने अभिषिक्त किया, न कि विशिष्ट एकवचन ‘मसीह’ की उपाधि के रूप में। ‘अभिषिक्त जनों’ मूल अर्थ को रखता और अनुचित मसीहाई विशिष्टता से बचाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण निषेधात्मक शैली रखी गई है। ‘नबी’ सामान्य पाठकों में प्रचलित बाइबलीय शब्द है; ‘अभिषिक्त जन’ बहुवचन को स्पष्ट करता है।
