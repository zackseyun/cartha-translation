  text: וְ/עִמָּ/הֶם֩ הֵימָ֨ן וִֽ/ידוּת֜וּן חֲצֹצְר֤וֹת וּ/מְצִלְתַּ֨יִם֙ לְ/מַשְׁמִיעִ֔ים וּ/כְלֵ֖י שִׁ֣יר הָ/אֱלֹהִ֑ים וּ/בְנֵ֥י יְדוּת֖וּן לַ/שָּֽׁעַר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/042.yaml
  text: And with them were Heman and Jeduthun with trumpets and cymbals for sounding aloud[a], and instruments for the songs of God; and the sons of Jeduthun were at the gate.
translation:
  language: hi
  text: उनके साथ हेमान और यदूतून थे, जिनके पास ध्वनि करने के लिए तुरहियाँ और झाँझ, और परमेश्वर के गीतों के लिए वाद्ययंत्र थे; और यदूतून के पुत्र फाटक पर थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “फाटक की रखवाली के लिए नियुक्त थे”; इब्रानी में शाब्दिक रूप से “फाटक के लिए/पर” है, जो फाटक की नियुक्त सेवा का संकेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: उनके साथ ... थे
  rationale: इब्रानी संबंधसूचक पदबंध को स्वाभाविक हिन्दी वाक्य बनाने के लिए ‘थे’ के साथ प्रस्तुत किया गया है।
- source_word: הֵימָן וִידוּתוּן
  choice: हेमान और यदूतून
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: חֲצֹצְרוֹת וּמְצִלְתַּיִם
  choice: तुरहियाँ और झाँझ
  rationale: ये आराधना में प्रयुक्त धातु के वाद्ययंत्रों के सहज और प्रचलित हिन्दी नाम हैं।
- source_word: לְמַשְׁמִיעִים
  choice: ऊँची ध्वनि करने के लिए
  rationale: हिफ़ील रूप का मूल भाव ‘सुनाई देना/सुनाना’ अर्थात वाद्यों की ध्वनि को सार्वजनिक रूप से सुनाई देना है; अनुवाद इसे गायन या विशिष्ट धुन तक सीमित नहीं करता।
- source_word: וּכְלֵי שִׁיר הָאֱלֹהִים
  choice: और परमेश्वर के गीतों के लिए वाद्ययंत्र
  rationale: ‘गीत के वाद्य’ वाली संबंध-रचना और ‘परमेश्वर के’ को बनाए रखते हुए हिन्दी में सहज अभिव्यक्ति दी गई है; इसे केवल सामान्य ‘संगीत-वाद्य’ नहीं बनाया गया।
- source_word: וּבְנֵי יְדוּתוּן
  choice: और यदूतून के पुत्र
  rationale: वंशीय और लेवीय संदर्भ में ‘पुत्र’ इब्रानी का सीधा तथा उपयुक्त समतुल्य है।
- source_word: לַשָּׁעַר
  choice: फाटक पर थे
  rationale: इब्रानी का शाब्दिक अर्थ ‘फाटक के लिए/पर’ है। मुख्य पाठ निकट अर्थ रखता है और संभावित नियुक्त पहरेदारी को पाद-टिप्पणी में बताता है।
theological_decisions:
- issue: הָאֱלֹהִים के साथ संबंध का अर्थ
  choice: परमेश्वर के गीतों के लिए
  alternative: परमेश्वर की आराधना के गीतों के लिए
  rationale: मुख्य पाठ इब्रानी के संबंध को खुला रखता है और उसे स्पष्ट रूप से केवल आराधना-संबंधी अर्थ में सीमित नहीं करता।
- issue: לַשָּׁעַר में सेवा-नियुक्ति का संकेत
  choice: फाटक पर थे
  alternative: फाटक के रखवाले थे
  rationale: संदर्भ से फाटक की सेवा संभावित है, पर इब्रानी संक्षिप्त है और सीधे ‘रखवाले’ संज्ञा का प्रयोग नहीं करता; इसलिए व्याख्यात्मक विकल्प पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और पाठयोग्य शैली रखी गई है। दोहराए गए ‘थे’ से इब्रानी के संक्षिप्त नाम-सूची जैसे वाक्य को स्पष्ट किया गया है; अर्धविराम अंतिम स्वतंत्र खंड को अलग करता है।
