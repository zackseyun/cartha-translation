  text: זִכְר֗וּ נִפְלְאֹתָי/ו֙ אֲשֶׁ֣ר עָשָׂ֔ה מֹפְתָ֖י/ו וּ/מִשְׁפְּטֵי פִֽי/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/012.yaml
  text: Remember his wondrous deeds that he has done[a], his signs[c][b], and the judgments of his mouth.
translation:
  language: hi
  text: उसके किए हुए अद्भुत कामों[a], उसके संकेतों[b] और उसके मुख से घोषित न्यायों[c] को स्मरण करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके आश्चर्यकर्म”।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी निशानियाँ” या “उसके चिह्न”; इस शब्द का अर्थ “अलौकिक संकेत” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “उसके मुख से निकले विधान” या “आदेश”।
    reason: lexical_alternative
lexical_decisions:
- source_word: זִכְרוּ
  choice: स्मरण करो
  rationale: बहुवचन आज्ञार्थक क्रिया श्रोताओं को परमेश्वर के कामों को सक्रिय रूप से याद रखने के लिए बुलाती है। ‘स्मरण करो’ इस गरिमापूर्ण उपदेशात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נִפְלְאֹתָיו אֲשֶׁר עָשָׂה
  choice: उसके किए हुए अद्भुत कामों
  rationale: यह पदबंध विस्मय उत्पन्न करने वाले परमेश्वर के असाधारण कार्यों को दर्शाता है। ‘अद्भुत काम’ आश्चर्य और किए गए कार्य—दोनों भाव व्यक्त करता है।
- source_word: מֹפְתָיו
  choice: उसके चिह्नों
  rationale: מֹפֵת उन चिह्नों या अलौकिक संकेतों को दर्शा सकता है जो परमेश्वर की सामर्थ्य प्रकट करते हैं। ‘चिह्न’ अर्थ को अनावश्यक रूप से केवल ‘चमत्कार’ तक सीमित नहीं करता।
- source_word: וּמִשְׁפְּטֵי פִיהוּ
  choice: और उसके मुख से सुनाए गए निर्णयों
  rationale: מִשְׁפָּט न्यायिक निर्णय, विधान या आदेश का अर्थ दे सकता है। ‘मुख से सुनाए गए निर्णय’ मूल के सजीव मौखिक बिंब और न्यायिक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: समानांतर पदों נִפְלְאֹתָיו और מֹפְתָיו में परमेश्वर के कार्यों का वर्णन
  choice: दो अलग अभिव्यक्तियाँ—‘अद्भुत काम’ और ‘चिह्न’—रखी गई हैं।
  alternative: दोनों को ‘आश्चर्यकर्म’ या ‘चमत्कार’ कहना।
  rationale: इब्रानी कविता में दोनों शब्द निकटार्थी होने पर भी एक जैसे नहीं हैं। अलग हिन्दी शब्द रखने से परमेश्वर के विस्मयकारी कार्य और उनकी संकेतात्मक भूमिका दोनों बनी रहती हैं।
- issue: מִשְׁפְּטֵי का अर्थ-क्षेत्र
  choice: निर्णयों
  alternative: विधानों या आदेशों
  rationale: यहाँ शब्द न्यायिक घोषणाओं और अधिकारपूर्ण विधानों—दोनों की ओर संकेत कर सकता है। मुख्य पाठ में ‘निर्णयों’ रखा गया है और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं, ताकि अर्थगत तनाव को किसी एक संकीर्ण व्याख्या में न बाँधा जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, उपदेशात्मक बहुवचन प्रयोग किया गया है। ‘मुख’ मूल के काव्यात्मक बिंब को बनाए रखता है, जबकि ‘सुनाए गए निर्णय’ उसे सामान्य पाठक के लिए स्पष्ट और स्वाभाविक बनाता है।
