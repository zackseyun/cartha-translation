  text: וְ/אִמְר֕וּ הוֹשִׁיעֵ֨/נוּ֙ אֱלֹהֵ֣י יִשְׁעֵ֔/נוּ וְ/קַבְּצֵ֥/נוּ וְ/הַצִּילֵ֖/נוּ מִן הַ/גּוֹיִ֑ם לְ/הֹדוֹת֙ לְ/שֵׁ֣ם קָדְשֶׁ֔/ךָ לְ/הִשְׁתַּבֵּ֖חַ בִּ/תְהִלָּתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/035.yaml
  text: And say[a], “Save us, O God of our salvation; gather us and deliver us from the nations[b], that we may give thanks to your holy name and glory in your praise.”
translation:
  language: hi
  text: और कहो, “हे हमारे उद्धार के परमेश्वर, हमें बचा; हमें इकट्ठा कर और राष्ट्रों[a] में से छुड़ा, ताकि हम तेरे पवित्र नाम का धन्यवाद करें और तेरी स्तुति में आनन्दित हों[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अन्यजातियों में से”; यहाँ अर्थ अधिक व्यापक रूप से राष्ट्रों अथवा जनसमूहों का है।
    reason: lexical_alternative
  - marker: b
    text: या “तेरी स्तुति में गर्व करें” अथवा “तेरी स्तुति में उल्लसित हों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִמְרוּ
  choice: और कहो
  rationale: बहुवचन आज्ञार्थक रूप और आरम्भिक संयोजक को बनाए रखता है तथा सामूहिक आराधना के प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוֹשִׁיעֵנוּ
  choice: हमें बचा
  rationale: ישׁע के हिफ़ील आज्ञार्थक का सीधा और स्वाभाविक अर्थ देता है; आगे נצל के लिए अलग क्रिया रखी गई है।
- source_word: אֱלֹהֵי יִשְׁעֵנוּ
  choice: हे हमारे उद्धार के परमेश्वर
  rationale: सम्बोधन को स्पष्ट करते हुए इब्रानी समास ‘हमारे उद्धार के परमेश्वर’ को सुरक्षित रखता है, बिना इसे किसी बाद की उपाधि में बदलने के।
- source_word: וְקַבְּצֵנוּ
  choice: हमें इकट्ठा कर
  rationale: קבץ के एकत्र करने के मूल अर्थ और बिखराव से पुनः एकत्र किए जाने की सम्भावित छाया, दोनों को बनाए रखता है।
- source_word: וְהַצִּילֵנוּ
  choice: छुड़ा ला
  rationale: נצל के बचाकर बाहर निकालने के भाव को व्यक्त करता है और पहले आए ‘बचा’ से शब्दगत भेद बनाए रखता है।
- source_word: מִן־הַגּוֹיִם
  choice: जातियों में से
  rationale: גּוֹיִם यहाँ उन राष्ट्रों अथवा जनसमूहों को सूचित करता है जिनमें लोग बिखरे हो सकते हैं; यह अनावश्यक रूप से बाद का यहूदी–गैरयहूदी भेद नहीं जोड़ता।
- source_word: לְהוֹדוֹת לְשֵׁם קָדְשֶׁךָ
  choice: तेरे पवित्र नाम का धन्यवाद करें
  rationale: उद्देश्यसूचक ל और ידה के ‘धन्यवाद करना’ अर्थ को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त करता है।
- source_word: לְהִשְׁתַּבֵּחַ בִּתְהִלָּתֶךָ
  choice: तेरी स्तुति पर गर्व करें
  rationale: שׁבח के हित्पाएल में निहित सकारात्मक गर्व अथवा उल्लास को बनाए रखता है; यहाँ गर्व का आधार परमेश्वर की स्तुति है, मनुष्य की अपनी उपलब्धि नहीं।
theological_decisions:
- issue: הַגּוֹיִם को ‘अन्यजातियों’ या ‘जातियों’ के रूप में प्रस्तुत करना
  choice: जातियों में से
  alternative: अन्यजातियों में से
  rationale: इस पुराने नियम के प्रसंग में आशय उन राष्ट्रों या जनसमूहों से है जिनके बीच इस्राएल बिखरा हुआ हो सकता है। ‘जातियों’ ऐतिहासिक अर्थ को बनाए रखता है और बाद के धर्मवैज्ञानिक वर्गीकरण को आरोपित नहीं करता।
- issue: अन्तिम खण्ड में आत्मवाची प्रशंसा की भाषा
  choice: तेरी स्तुति पर गर्व करें
  alternative: तेरी स्तुति में आनन्दित हों
  rationale: मूल क्रिया परमेश्वर की स्तुति को लेकर गर्व करने अथवा उल्लसित होने का भाव रखती है। मुख्य पाठ में ‘गर्व करें’ क्रिया की तीक्ष्णता बचाता है, जबकि पादटिप्पणी सकारात्मक उल्लास वाला सम्भव अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक प्रार्थना के अनुकूल रखी गई है। परमेश्वर के लिए एकवचन आत्मीय सम्बोधन ‘तेरे/कर/ला’ मूल इब्रानी के एकवचन सम्बोधन को स्पष्ट करता है। ‘बचा’ और ‘छुड़ा ला’ द्वारा ישׁע तथा נצל का भेद सुरक्षित रखा गया है।
