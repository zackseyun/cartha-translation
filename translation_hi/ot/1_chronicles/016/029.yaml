reference: 1 Chronicles 16:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָב֥וּ לַ/יהוָ֖ה כְּב֣וֹד שְׁמ֑/וֹ שְׂא֤וּ מִנְחָה֙ וּ/בֹ֣אוּ לְ/פָנָ֔י/ו הִשְׁתַּחֲו֥וּ לַ/יהוָ֖ה בְּ/הַדְרַת קֹֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/029.yaml
  text: Ascribe to Yahweh the glory due his name; bring an offering and come before him[a]. Bow down to Yahweh in holy splendor.
translation:
  language: hi
  text: याहवे को उसके नाम के योग्य महिमा दो; भेंट लेकर उसके सामने आओ। पवित्र वैभव में[a] याहवे के आगे दण्डवत करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रता के वैभव में”; संभवतः, “पवित्र वस्त्रों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָבוּ
  choice: दो
  rationale: यहाँ बहुवचन आज्ञार्थक क्रिया का अर्थ भौतिक वस्तु देना नहीं, बल्कि याहवे की महिमा को स्वीकार करके उसे अर्पित करना है। ‘दो’ मूल रूप को बनाए रखता है और ‘नाम के योग्य’ के साथ हिंदी में स्वाभाविक अर्थ देता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יְהוָה है; इसलिए उसका लिप्यंतरण ‘याहवे’ किया गया है।
- source_word: כְּבוֹד שְׁמוֹ
  choice: उसके नाम के योग्य महिमा
  rationale: शाब्दिक रूप ‘उसके नाम की महिमा’ है, पर स्तुति के इस सूत्र में आशय उसके नाम को मिलने योग्य महिमा से है। यह रूप उस निहित संबंध को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: שְׂאוּ מִנְחָה
  choice: भेंट लेकर
  rationale: שְׂאוּ का मूल अर्थ उठाना या ले जाना है, किंतु מִנְחָה के साथ इसका आशय उपासना के लिए भेंट लाना है। ‘भेंट’ इसके व्यापक अर्पण-संबंधी अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וּבֹאוּ לְפָנָיו
  choice: उसके सामने आओ
  rationale: यह परमेश्वर की उपस्थिति में उपासना के लिए आने का स्थानिक और श्रद्धापूर्ण मुहावरा है।
- source_word: הִשְׁתַּחֲווּ
  choice: दण्डवत करो
  rationale: क्रिया झुकने या भूमि पर गिरकर सम्मान प्रकट करने की शारीरिक क्रिया बताती है। ‘दण्डवत करो’ केवल सामान्य ‘आराधना करो’ की अपेक्षा इस मूर्त भाव को सुरक्षित रखता है।
- source_word: בְּהַדְרַת קֹדֶשׁ
  choice: पवित्र वैभव में
  rationale: यह काव्यात्मक पद पवित्रता के शोभायमान वैभव को सूचित कर सकता है, और संभवतः पवित्र उपासना-वस्त्रों की ओर भी संकेत करता है। मुख्य पाठ संक्षिप्तता और काव्यात्मक अस्पष्टता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: इब्रानी में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: בְּהַדְרַת קֹדֶשׁ का अर्थ
  choice: पवित्र वैभव में
  alternative: पवित्रता के वैभव में; पवित्र वस्त्रों में
  rationale: पद पवित्रता की शानदार शोभा अथवा उपासकों के पवित्र अलंकरण/वस्त्र—दोनों का संकेत दे सकता है। मुख्य पाठ व्यापक काव्यात्मक अर्थ रखता है और संकीर्ण विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी का श्रद्धापूर्ण, काव्यात्मक और सार्वजनिक उपासना के अनुकूल स्वर रखा गया है। वाक्यरचना सरल है; ‘दण्डवत’ जैसे परिचित धार्मिक शब्द द्वारा मूल क्रिया का शारीरिक भाव सुरक्षित रखा गया है।
