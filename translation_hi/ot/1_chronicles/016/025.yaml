reference: 1 Chronicles 16:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ גָד֨וֹל יְהוָ֤ה וּ/מְהֻלָּל֙ מְאֹ֔ד וְ/נוֹרָ֥א ה֖וּא עַל כָּל אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/025.yaml
  text: For Yahweh is great and greatly to be praised[a], and he is to be feared above all gods.
translation:
  language: hi
  text: क्योंकि याहवे महान है और अत्यन्त स्तुति के योग्य है; वह सब देवताओं से अधिक भययोग्य है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आसपास के आराधना-आह्वान का कारण बताता है और इब्रानी के व्याख्यात्मक संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: גָדוֹל
  choice: महान
  rationale: यह पद, महिमा और श्रेष्ठता की महानता व्यक्त करता है; ‘महान’ सीधा और गरिमापूर्ण हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: מְהֻלָּל מְאֹד
  choice: अत्यन्त स्तुति के योग्य
  rationale: निष्क्रिय कृदन्त और तीव्रतासूचक क्रियाविशेषण मिलकर प्रचुर स्तुति की योग्यता बताते हैं; यह रूप सहज हिन्दी में उस भाव को व्यक्त करता है।
- source_word: נוֹרָא
  choice: भय मानना चाहिए
  rationale: मूल शब्द श्रद्धामिश्रित भय और विस्मय जगाने का भाव रखता है; यह चयन केवल आतंक अथवा आधुनिक हल्के अर्थ वाले ‘अद्भुत’ से बचता है।
- source_word: עַל כָּל אֱלֹהִים
  choice: सब देवताओं से बढ़कर
  rationale: यहाँ עַל तुलनात्मक श्रेष्ठता व्यक्त करता है और बहुवचन אֱלֹהִים राष्ट्रों के देवताओं की ओर संकेत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ मूल उच्चारण का वैकल्पिक लिप्यंतरण है।
- issue: נוֹרָא में भय और विस्मय का संबंध
  choice: उसी का भय मानना चाहिए
  alternative: वह विस्मयकारी है
  rationale: चयन श्रद्धापूर्ण भय के नैतिक-आराधनात्मक बल को बनाए रखता है और अर्थ को केवल आश्चर्य तक सीमित नहीं करता।
- issue: אֱלֹהִים का बहुवचन संदर्भ
  choice: देवताओं
  alternative: दैवी प्राणियों
  rationale: निकटवर्ती संदर्भ में राष्ट्रों के देवताओं से तुलना है; इसलिए सरल शाब्दिक बहुवचन रखा गया है, उनके वास्तविक ईश्वरत्व की पुष्टि किए बिना।
translation_notes:
  register: आधुनिक मानक हिन्दी; काव्यात्मक और आराधनात्मक गरिमा के साथ सामान्य पाठक के लिए सहज वाक्य-विन्यास। ‘उसी’ इब्रानी सर्वनाम के बल को स्पष्ट करता है और ‘सब देवताओं से बढ़कर’ को भय मानने की अभिव्यक्ति से स्वाभाविक रूप से जोड़ता है।
