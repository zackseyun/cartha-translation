translation:
  language: hi
  text: और वे एक राष्ट्र से दूसरे राष्ट्र तक, और एक राज्य से दूसरे लोगों के पास घूमते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתְהַלְּכוּ
  choice: घूमते रहे
  rationale: हिथ्पाएल रूप यहाँ इधर-उधर या एक स्थान से दूसरे स्थान तक निरंतर होते आवागमन का भाव देता है; ‘घूमते रहे’ इस पुनरावृत्त गतिशीलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִגּוֹי אֶל גּוֹי
  choice: एक जाति से दूसरी जाति में
  rationale: גּוֹי के लिए ‘जाति’ राष्ट्र अथवा जनसमुदाय का अर्थ देता है, और ‘एक...दूसरी’ हिब्रू की ‘से...तक’ संरचना का वितरणात्मक भाव स्पष्ट करता है।
- source_word: וּמִמַּמְלָכָה
  choice: और एक राज्य से
  rationale: מַמְלָכָה का सामान्य अर्थ ‘राज्य’ है; हिन्दी में समानांतर संरचना स्वाभाविक बनाने के लिए ‘एक’ जोड़ा गया है।
- source_word: אֶל עַם אַחֵר
  choice: दूसरे लोगों के पास
  rationale: עַם को ‘लोगों’ कहना पहले आए גּוֹי से शब्दगत भेद बनाए रखता है; गति के लक्ष्य के लिए ‘के पास’ स्वाभाविक है और ‘दूसरे’ אַחֵר को व्यक्त करता है।
