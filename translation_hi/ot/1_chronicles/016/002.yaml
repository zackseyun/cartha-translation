id: 1CH.16.2
reference: 1 Chronicles 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְכַ֣ל דָּוִ֔יד מֵ/הַעֲל֥וֹת הָ/עֹלָ֖ה וְ/הַ/שְּׁלָמִ֑ים וַ/יְבָ֥רֶךְ אֶת הָ/עָ֖ם בְּ/שֵׁ֥ם יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/002.yaml
  text: When David finished offering up the burnt offering and the peace offerings[a], he blessed the people in the name of Yahweh.
translation:
  language: hi
  text: जब दाऊद होमबलि और शान्ति-बलियाँ[a] चढ़ा चुका था, तब उसने याहवे के नाम से लोगों को आशीर्वाद दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सहभागिता की बलियाँ” या “कुशल-मंगल की बलियाँ”।
    reason: इब्रानी שְׁלָמִים का अर्थ-क्षेत्र शान्ति, सहभागिता और समग्र कुशलता को समेटता है।
lexical_decisions:
- source_word: וַיְכַל
  choice: जब ... चुका, तब
  rationale: यह क्रिया बलियाँ चढ़ाने की समाप्ति बताकर अगली क्रिया से समय-संबंध जोड़ती है; हिन्दी में ‘जब ... चुका, तब’ स्वाभाविक रूप से दोनों बातें व्यक्त करता है।
- source_word: מֵהַעֲלוֹת
  choice: चढ़ा चुका
  rationale: כלה के साथ מִן और עלה का क्रियार्थक रूप बलि चढ़ाने का काम पूरा होने का अर्थ देता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलि का प्रचलित पारिभाषिक नाम है जो वेदी पर पूरी तरह जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ शब्द है।
- source_word: וְהַשְּׁלָמִים
  choice: और शान्ति-बलियाँ
  rationale: שְׁלָמִים बहुवचन में ऐसी बलियों का वर्ग है जिसका अर्थ-क्षेत्र शान्ति, कुशलता और सहभागिता से जुड़ा है। ‘शान्ति-बलियाँ’ मूल शब्द से निकट और पारम्परिक श्रेणी-सूचक अनुवाद है; अन्य सम्भव अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: וַיְבָרֶךְ
  choice: उसने ... आशीर्वाद दिया
  rationale: ברך का यहाँ सीधा अर्थ आशीर्वाद देना है; यह हिन्दी में स्वाभाविक और सटीक है।
- source_word: אֶת־הָעָם
  choice: लोगों को
  rationale: इब्रानी में निश्चित ‘लोग/प्रजा’ प्रत्यक्ष कर्म है; ‘सब’ मूल पाठ में नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: בְּשֵׁם יְהוָה
  choice: याहवे के नाम से
  rationale: בְּשֵׁם का यहाँ स्वाभाविक अर्थ किसी के नाम और अधिकार से आशीर्वाद देना है; ‘के नाम से’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ के रूप में लिप्यन्तरित किया गया है।
theological_decisions:
- issue: बलि-सूचक शब्द שְׁלָמִים का अनुवाद
  choice: शान्ति-बलियाँ
  alternative: सहभागिता की बलियाँ; कुशल-मंगल की बलियाँ
  rationale: इब्रानी शब्द शान्ति, सम्पूर्ण कुशलता और सामुदायिक सहभागिता—इन परस्पर जुड़े भावों को समेट सकता है। मुख्य पाठ में पहचानी हुई बलि-श्रेणी ‘शान्ति-बलियाँ’ रखी गई है और वैध विकल्प पादटिप्पणी में दिए गए हैं, ताकि अर्थ को अनावश्यक रूप से संकीर्ण न किया जाए।
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित न करके ‘याहवे’ के रूप में प्रस्तुत किया गया है; ‘यहोवा’ हिन्दी में प्रचलित वैकल्पिक रूप है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’ और ‘शान्ति-बलियाँ’ बलि-व्यवस्था के स्थापित श्रेणी-सूचक शब्द हैं। वाक्य की ‘जब ... तब’ रचना इब्रानी कथानक में बलि चढ़ाने की समाप्ति और उसके बाद दिए गए आशीर्वाद का संबंध स्पष्ट करती है।
