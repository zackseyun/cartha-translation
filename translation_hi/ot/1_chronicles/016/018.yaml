  text: saying[a], “To you I will give the land of Canaan[b], the portion of your inheritance.”
translation:
  language: hi
  text: यह कहते हुए[a], “मैं तुझे कनान की भूमि दूँगा, तुम्हारी विरासत का हिस्सा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में संबोधन एकवचन ‘तुझे’ से आगे बहुवचन ‘तुम्हारी विरासत’ में बदल जाता है; संभवतः प्रतिज्ञा कुलपिता से उसके वाचा के उत्तराधिकारी वंशजों की ओर बढ़ती है।
    reason: lexical_alternative
  - marker: b
    text: ‘हिस्सा’ का अनुवाद ‘आबंटित अंश’ भी हो सकता है। इब्रानी शब्द का मूल अर्थ डोरी या नापने की रेखा है, और उससे नापकर दी गई भूमि का हिस्सा भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵאמֹר
  choice: यह कहते हुए
  rationale: यह אָמַר के infinitive construct को स्वाभाविक हिन्दी में व्यक्त करता है और पिछले पद में उल्लिखित वाचा-वचन की विषयवस्तु प्रस्तुत करता है।
- source_word: לְךָ
  choice: तुझे
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन को स्पष्ट रूप से बनाए रखता है और देने की क्रिया के संप्रदान अर्थ को व्यक्त करता है।
- source_word: אֶתֵּן
  choice: मैं ... दूँगा
  rationale: Qal अपूर्ण, प्रथम पुरुष एकवचन, यहाँ प्रतिज्ञा के प्रसंग में स्वाभाविक रूप से भविष्यकालीन अर्थ रखता है।
- source_word: אֶרֶץ כְּנָעַן
  choice: कनान देश
  rationale: नामित भूभाग के ठोस प्रादेशिक अर्थ को आधुनिक हिन्दी में सहज रूप से व्यक्त करता है।
- source_word: חֶבֶל
  choice: भाग
  rationale: शब्द का मूल अर्थ नापने की डोरी है, पर भूमि-वितरण के प्रसंग में यह नापकर दिए गए हिस्से या आबंटन को दर्शाता है; ‘भाग’ संक्षिप्त और स्वाभाविक है।
- source_word: נַחֲלַתְכֶם
  choice: तुम्हारी विरासत
  rationale: נַחֲלָה के पैतृक और वाचा-संबंधी भूमि-अधिकार दोनों अर्थों को बनाए रखता है; ‘तुम्हारी’ बहुवचन समुदाय की ओर हुए मूल इब्रानी बदलाव को दर्शाता है।
theological_decisions:
- issue: एकवचन संबोधन से बहुवचन अधिकारसूचक रूप में बदलाव
  choice: ‘तुझे ... तुम्हारी विरासत’ के द्वारा दोनों वचनों को बनाए रखा गया है।
  alternative: पूरे कथन को एकवचन में कर देना, अथवा अर्थ खोलकर ‘तुझे और तेरे वंशजों को’ लिखना।
  rationale: इब्रानी पाठ लְךָ के एकवचन और נַחֲלַתְכֶם के बहुवचन को साथ रखता है। अनुवाद इस तनाव को स्पष्ट किए बिना न तो समतल करता है, न वंशजों को मुख्य पाठ में जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुझे’ और ‘तुम्हारी’ का जानबूझकर किया गया मेल मूल पाठ के एकवचन-बहुवचन बदलाव को सुरक्षित रखता है; अल्पविराम के बाद का पदबंध इब्रानी की समानाधिकरण संरचना को दर्शाता है।
