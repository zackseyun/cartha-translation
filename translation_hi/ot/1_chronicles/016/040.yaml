base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/040.yaml
  text: to offer burnt offerings to Yahweh on the altar of burnt offering continually[a], morning and evening, and according to all that is written in the law of Yahweh, which he commanded for Israel.
translation:
  language: hi
  text: याहवे के लिए होमबलि की वेदी पर निरंतर, सुबह और शाम, होमबलियाँ चढ़ाने और याहवे की उस व्यवस्था[a] में जो कुछ लिखा है उसके अनुसार ऐसा करने के लिए, जिसकी आज्ञा उसने इस्राएल को दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की शिक्षा”; इब्रानी ‘तोराह’ का अर्थ ‘व्यवस्था’ और ‘शिक्षा’ दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְהַעֲלוֹת
  choice: चढ़ाने के लिए
  rationale: עלה के हिफ़ील रूप का बलिदान-संबंधी मुहावरेदार अर्थ बलि अर्पित करना है; ‘चढ़ाना’ हिन्दी में इस धार्मिक क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: עֹלָה उस बलि का मानक पद है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ प्रचलित और सटीक हिन्दी धार्मिक पद है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: ל समर्पण या उद्देश्य को दर्शाता है, और יְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह संबंधवाचक पद उस विशिष्ट वेदी की पहचान करता है जिस पर होमबलियाँ चढ़ाई जाती थीं।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह नियमित, सतत धार्मिक पालन को व्यक्त करता है; ‘सुबह और शाम’ आगे उसकी दैनिक लय स्पष्ट करता है।
- source_word: לַבֹּקֶר וְלָעָרֶב
  choice: सुबह और शाम
  rationale: यह जोड़ी प्रतिदिन दोनों समय बलि चढ़ाने की नियत व्यवस्था बताती है।
- source_word: וּלְכָל הַכָּתוּב
  choice: और उस सबके अनुसार जो ... लिखा है
  rationale: यहाँ ל लिखित विधानों के अनुरूप कार्य करने का भाव देता है; ‘के अनुसार’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹרַת יְהוָה
  choice: याहवे की व्यवस्था
  rationale: תּוֹרָה का अर्थ व्यवस्था और शिक्षा दोनों हो सकता है; इस लिखित बलिदान-विधि के प्रसंग में ‘व्यवस्था’ मुख्य पाठ में उपयुक्त है, जबकि ‘शिक्षा’ को पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר צִוָּה עַל יִשְׂרָאֵל
  choice: जिसकी आज्ञा उसने इस्राएल के लिए दी थी
  rationale: צוה के साथ עַל इस्राएल पर लागू की गई आज्ञा का भाव देता है; ‘इस्राएल के लिए’ मूल संबंध को बिना अस्वाभाविक शब्दशः अनुवाद के बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम יְהוָה है; ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: תּוֹרָה का अर्थ
  choice: व्यवस्था
  alternative: शिक्षा
  rationale: बलिदान-विधि और लिखित आदेशों के इस प्रसंग में ‘व्यवस्था’ उपयुक्त है, पर मूल शब्द के व्यापक ‘शिक्षा’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य शैली। पद मूलतः पिछले वाक्य से जुड़ा उद्देश्यवाचक खंड है, इसलिए आरम्भ में ‘चढ़ाने के लिए’ रखा गया है। ‘निरन्तर—सुबह और शाम—’ से תָּמִיד की निरंतरता और उसके नियमित दैनिक क्रम दोनों सुरक्षित हैं।
