  yaml_path: translation/ot/1_chronicles/016/032.yaml
  text: Let the sea thunder[a], and all that fills it; let the field exult[b], and all that is in it.
translation:
  language: hi
  text: समुद्र गरज उठे[a], और वह सब भी जो उसे भरता है[b]; मैदान आनन्द से झूम उठे, और वह सब भी जो उसमें है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समुद्र गूँज उठे।’ इब्रानी क्रिया ऊँची गड़गड़ाहट या गर्जना की ध्वनि को सूचित कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसकी भरपूरी’; अर्थात समुद्र को भरने वाला सब कुछ।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִרְעַם
  choice: गरज उठे
  rationale: रעם ऊँची, गड़गड़ाती या गर्जना जैसी ध्वनि करने को दर्शाता है। ‘गरज उठे’ समुद्र के सजीव और प्रबल ध्वनि-बिंब को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיָּם
  choice: समुद्र
  rationale: יָם का सीधा और सामान्य हिन्दी समतुल्य ‘समुद्र’ है, जो काव्यात्मक सन्दर्भ में भी सहज है।
- source_word: וּמְלוֹאוֹ
  choice: और वह सब भी जो उसे भरता है
  rationale: מְלוֹא का शाब्दिक भाव ‘उसकी भरपूरी’ है, अर्थात समुद्र को भरने वाली सारी वस्तुएँ और जीव। चुना हुआ रूप आधुनिक हिन्दी में अर्थ को स्पष्ट रखते हुए मूल बिंब बचाता है।
- source_word: יַעֲלֹץ
  choice: आनन्द से झूम उठे
  rationale: עלץ उल्लासपूर्ण आनन्द व्यक्त करता है। ‘आनन्द से झूम उठे’ निर्जीव प्रकृति के मानवीकरण और काव्यात्मक उत्कटता दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַשָּׂדֶה
  choice: मैदान
  rationale: שׂדה खेत, मैदान या खुली भूमि को सूचित कर सकता है। ‘मैदान’ यहाँ समुद्र के समानान्तर व्यापक खुले भू-भाग को सहज रूप से दर्शाता है और केवल खेती किए हुए खेत तक अर्थ सीमित नहीं करता।
- source_word: וְכָל אֲשֶׁר בּוֹ
  choice: और वह सब भी जो उसमें है
  rationale: यह सम्बन्धवाचक पद मैदान में उपस्थित हर वस्तु और जीव को समाविष्ट करता है। यह रूप כָל की व्यापकता और मूल वाक्य की समानान्तर संरचना बनाए रखता है।
