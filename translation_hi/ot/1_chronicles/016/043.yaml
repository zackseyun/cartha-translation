translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। पहले בֵּיתוֹ को निवासस्थान (‘घर’) और दूसरे को घरेलू समुदाय (‘घराना’) के रूप में संदर्भानुसार अलग किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, क्योंकि अंग्रेज़ी पादटिप्पणी का चिह्न वַיֵּלְכוּ पर असंगत प्रतीत होता है और बताई गई अस्पष्टता वास्तव में בֵּיתוֹ से संबंधित है।
