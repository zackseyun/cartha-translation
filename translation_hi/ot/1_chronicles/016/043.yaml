  text: Then all the people went[a], each man to his house, and David turned to bless his household.
translation:
  language: hi
  text: तब सब लोग अपने-अपने घर[a] चले गए, और दाऊद अपने घर के लोगों को आशीर्वाद देने के लिए मुड़ गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘घर’ या उससे जुड़ा ‘घर-परिवार/घरेलू समुदाय’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: चले गए
  rationale: הלך का वय्यिक्तोल रूप कथा की अगली क्रिया बताता है; ‘चले गए’ सहज और सीधा हिन्दी रूप है।
- source_word: כָל הָעָם
  choice: सब लोग
  rationale: עַם यहाँ एकत्र जनसमुदाय को सूचित करता है; आधुनिक हिन्दी में ‘सब लोग’ स्वाभाविक है।
- source_word: אִישׁ
  choice: हर एक
  rationale: כָל הָעָם के बाद אִישׁ का प्रयोग वितरणात्मक है। ‘हर एक’ प्रत्येक व्यक्ति का भाव रखता है और हिन्दी में अनावश्यक रूप से पुरुष-विशेष तक अर्थ सीमित नहीं करता।
- source_word: לְבֵיתוֹ
  choice: अपने घर को
  rationale: בַּיִת यहाँ निवासस्थान के अर्थ में है। कर्ता-सम्बन्ध स्पष्ट करने के लिए हिन्दी का स्वाभाविक निजवाचक ‘अपने’ लिया गया है।
- source_word: וַיִּסֹּב
  choice: मुड़ा
  rationale: סבב यहाँ सार्वजनिक सभा से अपने घरेलू क्षेत्र की ओर दिशा बदलने का भाव देता है; ‘मुड़ा’ मूल क्रिया के निकट है, जबकि ‘लौटा’ अधिक व्याख्यात्मक होता।
- source_word: לְבָרֵךְ
  choice: आशीर्वाद देने के लिए
  rationale: ברך का उद्देश्यसूचक infinitive है; यह हिन्दी में स्पष्ट और मानक धार्मिक अभिव्यक्ति है।
- source_word: בֵּיתוֹ
  choice: अपने घराने को
  rationale: दूसरी बार בַּיִת केवल भवन नहीं, दाऊद के घरेलू समुदाय या परिवार को सूचित करता जान पड़ता है। ‘घराना’ इस सामूहिक अर्थ को रखते हुए मूल शब्द की अर्थ-व्याप्ति के निकट रहता है।
