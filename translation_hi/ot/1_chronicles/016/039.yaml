source:
  edition: WLC
  text: וְ/אֵ֣ת צָד֣וֹק הַ/כֹּהֵ֗ן וְ/אֶחָי/ו֙ הַ/כֹּ֣הֲנִ֔ים לִ/פְנֵ֖י מִשְׁכַּ֣ן יְהוָ֑ה בַּ/בָּמָ֖ה אֲשֶׁ֥ר בְּ/גִבְעֽוֹן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/039.yaml
  text: And Zadok the priest and his fellow priests were before the tabernacle of Yahweh at the high place that was in Gibeon,[a]
translation:
  language: hi
  text: और सादोक याजक और उसके साथी याजकों को गिबोन के उस ऊँचे स्थान पर यहवे के निवास-तंबू के सामने वहाँ रहने दिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यह पद पिछले वाक्य की क्रिया पर निर्भर है; शाब्दिक रूप है, “और सादोक याजक और उसके भाइयों, अर्थात् याजकों को।”
    reason: पिछले पद से निहित क्रिया और אֶחָיו का शाब्दिक “उसके भाइयों” दोनों स्पष्ट करता है।
lexical_decisions:
- source_word: וְאֵת
  choice: और ... को
  rationale: וְ समन्वय को आगे बढ़ाता है और אֵת कर्म-चिह्न है। पद पिछले वाक्य के क्रियात्मक संदर्भ पर निर्भर है, इसलिए हिन्दी में कर्म-सूचक ‘को’ और निहित क्रिया देकर वाक्य पूरा किया गया है।
- source_word: צָדוֹק הַכֹּהֵן
  choice: सादोक याजक
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण और כֹּהֵן के लिए प्रचलित, गरिमापूर्ण ‘याजक’ लिया गया है।
- source_word: וְאֶחָיו הַכֹּהֲנִים
  choice: तथा उसके साथी याजकों को
  rationale: शाब्दिक अर्थ ‘और उसके भाई, याजक’ है; इस सेवकाई-संदर्भ में אֶחָיו सहकर्मी याजकों को सूचित करता है, इसलिए स्वाभाविक हिन्दी में ‘साथी याजक’ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पवित्र निवास के सम्मुख या उसकी उपस्थिति में स्थान को दर्शाता है; ‘के सामने’ सामान्य हिन्दी में स्पष्ट है।
- source_word: מִשְׁכַּן יְהוָה
  choice: यहवे के पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव निवास-स्थान है और यहाँ वह उपासना के तंबू-सदृश पवित्र स्थान को सूचित करता है। ‘पवित्र निवास’ अर्थ स्पष्ट करता है, जबकि יְהוָה को ‘यहवे’ रूप में रखा गया है।
- source_word: בַּבָּמָה
  choice: उस ऊँचे स्थान पर
  rationale: בָּמָה उपासना के लिए प्रयुक्त ऊँचे स्थान का तकनीकी पद है। ‘ऊँचा स्थान’ उसके स्थानिक और धार्मिक दोनों अर्थों को बिना नकारात्मक मूल्यांकन जोड़े बनाए रखता है।
- source_word: אֲשֶׁר בְּגִבְעוֹן
  choice: गिबोन में उस ... स्थान पर
  rationale: हिन्दी के स्वाभाविक शब्दक्रम में सापेक्ष उपवाक्य को विशेषणात्मक संरचना के रूप में पहले रखा गया है; अर्थ है कि वह ऊँचा स्थान गिबोन में था।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का विशिष्ट वाचा-नाम है। उसे उपाधि ‘प्रभु’ से बदलने के बजाय देवनागरी में ‘यहवे’ रूप से प्रस्तुत किया गया है।
- issue: אֶחָיו का संबंध-सूचक अर्थ
  choice: उसके साथी याजक
  alternative: उसके भाई, अर्थात् याजक
  rationale: संदर्भ याजकीय सहकर्मियों का है, पर हिब्रू के शाब्दिक ‘भाइयों’ को मिटाया नहीं गया; उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: पिछले पद से निहित क्रिया
  choice: नियुक्त किया गया था
  alternative: छोड़ दिया था; ठहराया था
  rationale: हिब्रू पद अपने आप में क्रियारहित कर्म-खंड है और पिछली पंक्ति की क्रिया पर निर्भर है। हिन्दी में पूर्ण वाक्य के लिए ‘नियुक्त किया गया था’ दिया गया है, जो दायित्व सौंपे जाने का संदर्भ व्यक्त करता है; इस पाठगत निर्भरता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धार्मिक गद्य। ‘याजक’, ‘पवित्र निवास’ और ‘ऊँचा स्थान’ जैसे शब्द सामान्य पाठक के लिए बोधगम्य रखते हुए मूल के उपासना-संबंधी अर्थ को बनाए रखते हैं।
