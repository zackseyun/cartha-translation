source:
  edition: WLC
  text: הִֽתְהַֽלְלוּ֙ בְּ/שֵׁ֣ם קָדְשׁ֔/וֹ יִשְׂמַ֕ח לֵ֖ב מְבַקְשֵׁ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/010.yaml
  text: Boast in his holy name[a]; let the hearts of those who seek Yahweh rejoice.
translation:
  language: hi
  text: उसके पवित्र नाम पर गर्व करो; याहवे[a] को खोजने वालों के हृदय आनन्दित हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में YHWH, परमेश्वर का विशिष्ट नाम; परम्परागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।
    reason: ईश्वरीय नाम की पहचान और परम्परागत वैकल्पिक प्रस्तुति स्पष्ट करना।
lexical_decisions:
- source_word: הִתְהַלְלוּ
  choice: गर्व करो
  rationale: हित्पएल बहुवचन आज्ञार्थक यहाँ किसी में गौरव करने या उस पर गर्व करने का भाव देता है। ‘गर्व करो’ आज्ञा के बल को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּשֵׁם קָדְשׁוֹ
  choice: उसके पवित्र नाम पर
  rationale: בְּ नाम को गर्व करने के आधार या विषय के रूप में प्रस्तुत करता है। हिन्दी में ‘नाम पर गर्व करना’ स्वाभाविक है, और קָדְשׁוֹ का अर्थ ‘उसका पवित्र’ सुरक्षित रहता है।
- source_word: יִשְׂמַח
  choice: आनन्दित हों
  rationale: रूपतः अपूर्ण काल होते हुए भी काव्यात्मक उपदेशात्मक संदर्भ में इसका इच्छार्थक बल है; ‘आनन्दित हों’ उस भाव को स्पष्ट करता है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी में शब्द एकवचन है, पर वह बहुवचन ‘खोजने वालों’ के भीतरी मन को सामूहिक रूप से व्यक्त करता है। हिन्दी में ‘हृदय’ रूप बहुवचन संदर्भ में भी अपरिवर्तित रहकर स्वाभाविक है।
- source_word: מְבַקְשֵׁי
  choice: खोजने वालों
  rationale: संज्ञात्मक कृदन्त निरन्तर या चारित्रिक रूप से खोजने वाले लोगों को दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम YHWH है। ‘याहवे’ उसका प्रचलित ध्वन्यात्मक रूप है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘याहवे’ मूल नाम को प्रत्यक्ष रखता है; उच्चारण पूर्णतः निश्चित न होने के कारण पादटिप्पणी पाठक को इसकी प्रकृति बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘नाम पर गर्व करो’ समकालीन हिन्दी में स्वाभाविक है, जबकि ‘आनन्दित हों’ काव्यात्मक इच्छार्थक भाव बनाए रखता है। पादटिप्पणी-चिह्न मूलतः जिस शब्द की व्याख्या करता है, उसी ‘याहवे’ के बाद रखा गया है।
