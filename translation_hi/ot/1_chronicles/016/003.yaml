  text: He distributed to every person of Israel[a], from man to woman, to each one a loaf of bread, a portion of meat, and a raisin cake.
translation:
  language: hi
  text: उसने इस्राएल के हर व्यक्ति को—पुरुष से लेकर स्त्री तक—एक रोटी, मांस का एक भाग[a] और किशमिश की एक टिकिया बाँटी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “एक भाग” अथवा कोई अन्य खाद्य-वस्तु। इब्रानी शब्द אֶשְׁפָּר दुर्लभ है और उसका ठीक अर्थ निश्चित नहीं है; यहाँ बहुत-से लोग इसे मांस का एक भाग समझते हैं।
    reason: lexical_alternative
