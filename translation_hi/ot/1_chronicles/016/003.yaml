- source_word: אֶשְׁפָּר
  choice: मांस का एक भाग
  rationale: यह दुर्लभ और अनिश्चित संज्ञा है। उत्सवी भोजन-वितरण के संदर्भ में ‘मांस का एक भाग’ एक प्रचलित प्रासंगिक समझ है, पर अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֲשִׁישָׁה
  choice: किशमिश की एक टिकिया
  rationale: यह दबाकर बनाई गई टिकिया को सूचित करता है, जिसे सामान्यतः किशमिश की टिकिया समझा जाता है; यह हिंदी में सहज और विशिष्ट है।
