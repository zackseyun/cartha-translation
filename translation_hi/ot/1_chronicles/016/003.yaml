- source_word: לְאִישׁ
  choice: हर व्यक्ति को
  rationale: यह पुनरुक्त वितरणात्मक प्रयोग प्रत्येक प्राप्तकर्ता को अलग-अलग सूचित करता है; हिंदी वाक्य में इसे पहले ही ‘हर व्यक्ति को’ द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
