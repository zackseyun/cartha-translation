  text: הוֹד֤וּ לַֽ/יהוָה֙ קִרְא֣וּ בִ/שְׁמ֔/וֹ הוֹדִ֥יעוּ בָ/עַמִּ֖ים עֲלִילֹתָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/008.yaml
  text: Give thanks to Yahweh[a]; call on his name[b]; make his deeds known among the peoples.
translation:
  language: hi
  text: याहवे का धन्यवाद करो; उसका नाम पुकारो; विभिन्न जनसमूहों में उसके कार्यों की घोषणा करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוֹד֤וּ
  choice: धन्यवाद करो
  rationale: इस स्तुतिपरक संदर्भ में ידה के हिफ़ील बहुवचन आज्ञार्थक का स्वाभाविक अर्थ परमेश्वर को धन्यवाद देना या उसकी स्तुति करना है। ‘धन्यवाद करो’ आधुनिक हिन्दी में स्पष्ट और सटीक है।
- source_word: לַֽיהוָה
  choice: याहवे का
  rationale: יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है। हिन्दी में ‘धन्यवाद करना’ के साथ संबंधसूचक ‘का’ स्वाभाविक प्रयोग है।
- source_word: קִרְא֣וּ בִשְׁמ֔וֹ
  choice: उसका नाम पुकारो
  rationale: यह पदबंध परमेश्वर के नाम का आह्वान करने का भाव व्यक्त करता है। ‘उसका नाम पुकारो’ सहज हिन्दी है और ‘नाम’ में उसकी प्रकट पहचान और प्रतिष्ठा का भाव बनाए रखता है।
- source_word: הוֹדִ֥יעוּ
  choice: घोषणा करो
  rationale: ידע के हिफ़ील रूप का अर्थ दूसरों को ज्ञात कराना है। ‘घोषणा करो’ इस कारक भाव को स्वाभाविक और सार्वजनिक अभिव्यक्ति के रूप में देता है।
- source_word: בָעַמִּים
  choice: जाति-जाति के लोगों के बीच
  rationale: עַמִּים अनेक जनसमूहों या जातियों को दर्शाता है। यह प्रयोग आधुनिक पाठक को बहुवचन और समूहगत अर्थ स्पष्ट करता है, बिना उसे केवल आधुनिक राष्ट्र-राज्यों तक सीमित किए।
- source_word: עֲלִילֹתָיו
  choice: उसके किए हुए कामों
  rationale: यह संज्ञा उसके कार्यों या कृत्यों को बताती है। ‘किए हुए काम’ अर्थ को स्पष्ट रखता है और मूल में निहित न होने के कारण ‘सामर्थी’ जैसा विशेषण नहीं जोड़ता।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה स्पष्ट रूप से आया है। ‘याहवे’ उस वाचा-नाम को नाम के रूप में सुरक्षित रखता है, उसे उपाधि में नहीं बदलता।
- issue: קרא בשם का अर्थ
  choice: उसका नाम पुकारो
  alternative: उसके नाम की घोषणा करो
  rationale: इस स्तुति और उपासना के संदर्भ में पदबंध को परमेश्वर का आह्वान मानना अधिक स्वाभाविक है; फिर भी ‘नाम लेकर घोषणा करना’ इसका संभावित भाषिक विस्तार है, इसलिए अनावश्यक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामूहिक उपासना में बोलने योग्य रखी गई है। तीनों आज्ञार्थक खंडों की समानांतर लय बनाए रखी गई है; ‘जाति-जाति के लोगों’ से बहुवचन जनसमूहों का अर्थ साधारण पाठक के लिए स्पष्ट होता है।
