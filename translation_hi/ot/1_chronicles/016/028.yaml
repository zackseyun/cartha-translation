source:
  edition: WLC
  text: הָב֤וּ לַֽ/יהוָה֙ מִשְׁפְּח֣וֹת עַמִּ֔ים הָב֥וּ לַ/יהוָ֖ה כָּב֥וֹד וָ/עֹֽז׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/028.yaml
  text: Ascribe to Yahweh[a], families of the peoples, ascribe to Yahweh glory and strength.
translation:
  language: hi
  text: हे जातियों के कुलों, याहवे को दो; याहवे को महिमा और सामर्थ्य दो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָבוּ
  choice: दो
  rationale: बहुवचन आज्ञार्थक क्रिया का मूल अर्थ ‘दो’ है। स्तुति के इस संदर्भ में इसका आशय याहवे को वह महिमा और सामर्थ्य अर्पित करना अथवा उनका श्रेय देना है जो उसके योग्य है। दोहराव को मूल पद के अनुरूप रखा गया है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: לְ यहाँ प्राप्तकर्ता को चिह्नित करता है, और יהוה को उसके निज नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: מִשְׁפְּחוֹת עַמִּים
  choice: विभिन्न जातियों के कुलो
  rationale: מִשְׁפְּחוֹת निकट संबंध वाले कुलों या वंश-समूहों को और עַמִּים अनेक जनसमुदायों अथवा जातियों को दर्शाता है। यह हिंदी रूप बहुवचन और सार्वभौमिक आह्वान दोनों को स्पष्ट रखता है।
- source_word: כָּבוֹד
  choice: महिमा
  rationale: स्तुति के संदर्भ में כָּבוֹד परमेश्वर के योग्य गौरव और सम्मान को व्यक्त करता है; ‘महिमा’ इसका स्वाभाविक और प्रतिष्ठित हिंदी समतुल्य है।
- source_word: וָעֹז
  choice: और सामर्थ्य
  rationale: עֹז शक्ति या पराक्रम को दर्शाता है। ‘सामर्थ्य’ महिमा के साथ स्वाभाविक रूप से जुड़ता है और ईश्वरीय शक्ति का भाव व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला ईश्वरीय निज नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और निज नाम को सामान्य उपाधि में नहीं बदलता।
- issue: הָבוּ का ईश्वर के लिए प्रयोग
  choice: दो
  alternative: श्रेय दो; स्वीकार करो
  rationale: ‘दो’ मूल आज्ञा की ठोस और काव्यात्मक भाषा तथा उसके दोहराव को सुरक्षित रखता है। यहाँ इसका अर्थ यह नहीं कि ईश्वर में पहले सामर्थ्य का अभाव था, बल्कि उसकी महिमा और सामर्थ्य को मानकर उसे अर्पित करना है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी अपनाई गई है। पहले आज्ञार्थक पद के बाद संबोधन रखने की इब्रानी संरचना को बनाए रखा गया है; हिंदी में यह स्तुतिगीत की शैली में स्वाभाविक रूप से समझी जाती है।
