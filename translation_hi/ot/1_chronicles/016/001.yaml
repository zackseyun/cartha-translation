id: 1CH.16.1
reference: 1 Chronicles 16:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבִ֨יאוּ֙ אֶת אֲר֣וֹן הָֽ/אֱלֹהִ֔ים וַ/יַּצִּ֣יגוּ אֹת֔/וֹ בְּ/ת֣וֹךְ הָ/אֹ֔הֶל אֲשֶׁ֥ר נָֽטָה ל֖/וֹ דָּוִ֑יד וַ/יַּקְרִ֛יבוּ עֹל֥וֹת וּ/שְׁלָמִ֖ים לִ/פְנֵ֥י הָ/אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/001.yaml
  text: So they brought in the ark of God and set it in the midst of the tent that David had pitched for it[b][a], and they offered burnt offerings and peace offerings before God.
translation:
  language: hi
  text: तब वे परमेश्वर का सन्दूक ले आए और उसे उस तम्बू के बीच में रख दिया, जिसे दाऊद ने उसके लिए खड़ा किया था[a]; और उन्होंने परमेश्वर के सामने होमबलियाँ और मेलबलियाँ[b] चढ़ाईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तम्बू के अन्दर।” हिब्रू पद का शाब्दिक अर्थ “तम्बू के बीच में” है, पर वह सामान्य रूप से उसके भीतर होने का अर्थ भी दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “शान्ति-बलियाँ” अथवा “कल्याण-बलियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבִיאוּ
  choice: ले आए
  rationale: בוא के हिफ़ील रूप का अर्थ यहाँ सन्दूक को तैयार किए गए तम्बू में लाना है; ‘ले आए’ हिन्दी में स्वाभाविक रूप से इस गति को व्यक्त करता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: मूल पाठ में ठीक यही संक्षिप्त पद है; ‘वाचा का सन्दूक’ जोड़ना मूल से अधिक कहना होता।
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: उसे ... रख दिया
  rationale: יצג का कारक रूप किसी वस्तु को निर्धारित स्थान पर रखने या स्थापित करने का बोध देता है।
- source_word: בְּתוֹךְ הָאֹהֶל
  choice: तम्बू के बीच में
  rationale: בְּתוֹךְ का ठोस स्थानिक अर्थ ‘बीच में’ हो सकता है, यद्यपि प्रसंग में व्यापक अर्थ ‘अन्दर’ भी सम्भव है; विकल्प को पादटिप्पणी में रखा गया है।
- source_word: הָאֹהֶל
  choice: तम्बू
  rationale: यह सामान्य संज्ञा ‘तम्बू’ है, और पाठ स्वयं बताता है कि दाऊद ने इसे खड़ा किया था; ‘मिलापवाला तम्बू’ कहना अतिरिक्त पहचान जोड़ता।
- source_word: אֲשֶׁר נָטָה לוֹ דָּוִיד
  choice: जिसे दाऊद ने उसके लिए खड़ा किया था
  rationale: तम्बू के साथ נטה का अर्थ तानना या खड़ा करना है; לוֹ को निकट प्रसंग में सन्दूक के लिए प्रयोजनसूचक माना गया है।
- source_word: וַיַּקְרִיבוּ
  choice: चढ़ाईं
  rationale: बलिदान-सन्दर्भ में קרב का हिफ़ील रूप अर्पित करने या चढ़ाने का अर्थ देता है; हिन्दी में ‘बलियाँ चढ़ाईं’ स्वाभाविक धार्मिक प्रयोग है।
- source_word: עֹלוֹת
  choice: होमबलियाँ
  rationale: यह वेदी पर पूर्णतः जलाए जाने वाले विशिष्ट बलिदान का पारम्परिक और संक्षिप्त हिन्दी नाम है।
- source_word: שְׁלָמִים
  choice: मेलबलियाँ
  rationale: शब्द שלם के शान्ति, कुशल और सहभागिता से जुड़े अर्थक्षेत्र को ‘मेलबलि’ संक्षेप में व्यक्त करता है; अन्य सम्भव रूप पादटिप्पणी में दिए गए हैं।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह ‘परमेश्वर के मुख/उपस्थिति के सामने’ का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: बलिदानों की विशिष्ट शब्दावली
  choice: ‘होमबलियाँ’ और ‘मेलबलियाँ’ के दो अलग बलिदान-प्रकार बनाए रखे गए।
  alternative: सामान्य रूप से केवल ‘बलिदान’ या ‘होमबलियाँ और शान्ति-बलियाँ’
  rationale: मूल पाठ दो विशिष्ट अनुष्ठानिक श्रेणियाँ बताता है; उन्हें एक सामान्य शब्द में मिलाने से पाठ की धार्मिक और विधिक विशिष्टता खो जाती।
- issue: तम्बू की पहचान
  choice: सामान्य शब्द ‘तम्बू’ रखा गया।
  alternative: ‘मिलापवाला तम्बू’ या ‘पवित्र निवास’
  rationale: इस पद का हिब्रू शब्द साधारण ‘तम्बू’ है और इसे दाऊद द्वारा खड़ा किया हुआ बताता है; किसी अन्य विशिष्ट पवित्र तम्बू से इसकी पहचान अनावश्यक रूप से नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सहज रखी गई है। ‘सन्दूक,’ ‘होमबलि’ और ‘मेलबलि’ जैसे स्थापित बाइबलीय शब्द अनुष्ठानिक विशिष्टता बनाए रखते हैं; वाक्य-विन्यास मूल हिब्रू की क्रमिक कथा-गति को स्वाभाविक हिन्दी में प्रस्तुत करता है।
