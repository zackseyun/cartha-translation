  text: On that day then David first appointed Asaph and his brothers to give thanks to Yahweh[a].
translation:
  language: hi
  text: उसी दिन दाऊद ने पहली बार आसाप और उसके भाइयों के माध्यम से याहवे को धन्यवाद देने की व्यवस्था की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। इसका अनुवाद “दाऊद ने सबसे पहले आसाप और उसके भाइयों के माध्यम से याहवे को धन्यवाद देने की व्यवस्था की” या “दाऊद ने आसाप और उसके भाइयों को अगुवाई के स्थान पर रखकर याहवे को धन्यवाद देने की व्यवस्था की” भी हो सकता है। यह आरंभिक नियुक्ति, प्राथमिकता या नेतृत्व पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא אָז
  choice: उस दिन
  rationale: दोनों कालवाचक पद मिलकर कथा में उसी अवसर और उसके बाद हुई कार्रवाई की ओर संकेत करते हैं। हिंदी में “उस दिन” स्वाभाविक है; अलग से “तब” जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: נָתַן
  choice: दायित्व सौंपा
  rationale: मूल अर्थ “दिया” है, पर इस प्रशासनिक और उपासना-संबंधी संदर्भ में किसी को कार्य सौंपने का भाव है।
- source_word: בָּרֹאשׁ
  choice: पहली बार
  rationale: यह कठिन मुहावरा आरंभिक नियुक्ति या प्राथमिकता का संकेत दे सकता है। मुख्य पाठ में आरंभिक स्थापना का अर्थ लिया गया है और अन्य संभावनाएँ पाद-टिप्पणी में रखी गई हैं।
- source_word: לְהֹדוֹת
  choice: धन्यवाद करने
  rationale: ידה का हिफ़ील रूप इस उपासना-संदर्भ में परमेश्वर को धन्यवाद देने या उसकी स्तुति करने का अर्थ रखता है; “धन्यवाद करने” सबसे सीधा समतुल्य है।
- source_word: לַיהוָה
  choice: याहवे का
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है; उसे उपाधि से बदलने के बजाय “याहवे” रूप में रखा गया है।
- source_word: בְּיַד אָסָף וְאֶחָיו
  choice: आसाप और उसके भाइयों को
  rationale: शाब्दिक रूप “आसाप और उसके भाइयों के हाथ से” है। यहाँ בְּיַד कार्य को किसी के हाथ सौंपने अथवा उसके माध्यम से कराने का मुहावरा है; हिंदी में कर्तव्य सौंपने की संरचना स्वाभाविक है।
- source_word: אָסָף וְאֶחָיו
  choice: आसाप और उसके भाई
  rationale: “भाई” मूल אחים का सीधा रूप है और यहाँ संभवतः आसाप के सहकर्मी लेवियों को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का वाचा-नाम सीधे आया है। “याहवे” उसे नाम के रूप में सुरक्षित रखता है, जबकि “प्रभु” उसे उपाधि में बदल देता है।
- issue: בָּרֹאשׁ में आरंभ अथवा नेतृत्व का भाव
  choice: पहली बार
  alternative: अगुवाई के स्थान पर; सबसे पहले
  rationale: संदर्भ इस धन्यवाद-सेवा की आरंभिक स्थापना का समर्थन करता है, लेकिन इब्रानी मुहावरा प्राथमिकता या नेतृत्व भी व्यक्त कर सकता है; इसलिए वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी अपनाई गई है। “दायित्व सौंपा” मूल के मुहावरेदार प्रशासनिक भाव को स्पष्ट करता है, जबकि कठिन בָּרֹאשׁ की वास्तविक अस्पष्टता पाद-टिप्पणी में सुरक्षित रखी गई है।
