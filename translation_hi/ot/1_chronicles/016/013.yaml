  text: O offspring of Israel his servant[a], sons of Jacob[c][b], his chosen ones.
translation:
  language: hi
  text: 'हे उसके सेवक इस्राएल के वंशजो[a],

    हे याकूब के पुत्रो[b], उसके चुने हुए लोगो[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल का बीज’; इब्रानी में वंशजों के लिए सामूहिक एकवचन है।
    reason: lexical_alternative
  - marker: b
    text: या ‘याकूब की संतान’; इब्रानी में शाब्दिक रूप से ‘याकूब के पुत्र’।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसके निर्वाचित लोग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶרַע
  choice: वंशजो
  rationale: यह सामूहिक एकवचन संज्ञा इस्राएल की संतान अथवा वंश को संबोधित करती है। हिंदी में संबोधन के लिए बहुवचन ‘वंशजो’ स्वाभाविक है और सामूहिक आशय स्पष्ट करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: व्यक्तिगत और वाचागत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: עַבְדּוֹ
  choice: उसके सेवक
  rationale: यहाँ עבד परमेश्वर के साथ इस्राएल के संबंध का पदनाम है; ‘सेवक’ प्रसंगानुकूल है और दासत्व की सामाजिक स्थिति पर अनावश्यक बल नहीं देता।
- source_word: בְּנֵי
  choice: पुत्रो
  rationale: इब्रानी में शाब्दिक रूप से ‘पुत्र’ है। संबोधन के कारण हिंदी में ‘पुत्रो’ रखा गया है; इसका आशय याकूब के वंशजों से है।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: कुलपिता के नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בְּחִירָיו
  choice: उसके चुने हुओ
  rationale: यह बहुवचन रूप परमेश्वर द्वारा चुने गए लोगों को दर्शाता है। ‘चुने हुए’ आधुनिक हिंदी में स्पष्ट है और ‘निर्वाचित’ की अपेक्षा कम पारिभाषिक है।
theological_decisions:
- issue: ‘उसके सेवक’ और ‘उसके चुने हुओ’ में एकवचन पुल्लिंग संबंधसूचक प्रत्ययों का संदर्भ
  choice: ‘उसके’ को बनाए रखा गया है; प्रसंग में इसका संदर्भ यहोवा परमेश्वर है।
  alternative: नाम को स्पष्ट करते हुए ‘परमेश्वर के सेवक’ और ‘परमेश्वर के चुने हुओ’ कहना।
  rationale: इब्रानी पाठ केवल संबंधसूचक प्रत्यय देता है। ‘उसके’ मूल की संरचना और संदर्भगत स्पष्टता दोनों को बनाए रखता है, बिना नाम को व्याख्यात्मक रूप से जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक संबोधन-शैली रखी गई है। ‘हे ... वंशजो’ और ‘हे ... पुत्रो’ हिंदी में प्रत्यक्ष संबोधन को स्पष्ट करते हैं; पंक्ति-विभाजन इब्रानी समानांतरता को उभारता है।
