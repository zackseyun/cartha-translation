base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/023.yaml
  text: Sing to Yahweh[a], all the earth[b]; proclaim his salvation from day to day.
translation:
  language: hi
  text: हे सारी पृथ्वी, याहवे[a] के लिए गाओ; दिन-प्रतिदिन उसके उद्धार का शुभ समाचार सुनाओ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है, जिसका यहाँ ‘याहवे’ लिप्यंतरण किया गया है।
    reason: divine_name_transliteration
  - marker: b
    text: इस क्रिया का अर्थ अच्छे समाचार की घोषणा करना है; इसका अनुवाद ‘उसके उद्धार की घोषणा करो’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁירוּ
  choice: गाओ
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; मूल में ‘स्तुति’ जैसा अतिरिक्त कर्म नहीं जोड़ा गया।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग के लक्ष्यार्थी भाव को ‘के लिए’ से व्यक्त किया गया और व्यक्तिगत ईश्वरीय नाम को नाम के रूप में रखा गया।
- source_word: כָּל הָאָרֶץ
  choice: हे सारी पृथ्वी
  rationale: भजनात्मक सार्वभौमिक संबोधन के कारण אָרֶץ का अर्थ ‘पृथ्वी’ लिया गया; ‘हे’ हिन्दी में संबोधन को स्पष्ट और स्वाभाविक बनाता है।
- source_word: בַּשְּׂרוּ
  choice: शुभ समाचार सुनाओ
  rationale: पिएल आज्ञार्थक בשׂר केवल सामान्य घोषणा नहीं, अच्छे समाचार के प्रचार का भाव रखता है; यह हिन्दी वाक्यांश उस अर्थ को स्पष्ट रखता है।
- source_word: מִיּוֹם אֶל יוֹם
  choice: दिन-प्रतिदिन
  rationale: निरंतर दैनिक पुनरावृत्ति को संक्षिप्त, काव्यात्मक और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: יְשׁוּעָתוֹ
  choice: उसके उद्धार
  rationale: יְשׁוּעָה के बचाव/छुटकारे के व्यापक अर्थ को ‘उद्धार’ व्यक्त करता है और प्रत्यय का अर्थ ‘उसके’ से सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिगत नाम को सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में रखा गया; पादटिप्पणी हिब्रू नाम और वैकल्पिक लिप्यंतरण बताती है।
- issue: יְשׁוּעָתוֹ का अर्थ-क्षेत्र
  choice: उसके उद्धार
  alternative: उसके छुटकारे; उसकी विजय
  rationale: ‘उद्धार’ मूल के व्यापक बचावकारी अर्थ को बनाए रखता है और प्रसंग से परे केवल सैन्य विजय तक अर्थ सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सार्वजनिक पाठ के अनुकूल शैली। ‘हे सारी पृथ्वी’ मूल के सार्वभौमिक संबोधन को स्वाभाविक बनाता है; ‘दिन-प्रतिदिन’ समानांतर पंक्ति की लय बनाए रखता है।
