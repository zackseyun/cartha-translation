source:
  edition: WLC
  text: וְ/עִמָּ/הֶם֙ הֵימָ֣ן וִֽ/ידוּת֔וּן וּ/שְׁאָר֙ הַ/בְּרוּרִ֔ים אֲשֶׁ֥ר נִקְּב֖וּ בְּ/שֵׁמ֑וֹת לְ/הֹדוֹת֙ לַֽ/יהוָ֔ה כִּ֥י לְ/עוֹלָ֖ם חַסְדּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/041.yaml
  text: And with them were Heman and Jeduthun and the rest of those chosen, who were designated by name to give thanks to Yahweh, for his steadfast love endures forever.
translation:
  language: hi
  text: और उनके साथ हेमान, यदूतून और बाकी चुने हुए लोग भी थे, जिन्हें नाम से निर्दिष्ट किया गया था, ताकि वे यहोवा का धन्यवाद करें, क्योंकि उसका अटल प्रेम सदा बना रहता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “क्योंकि उसका अटल प्रेम सदा के लिए है”; यह आराधना में बार-बार प्रयुक्त होने वाला सूत्र है।'
    reason: cultural_note
lexical_decisions:
- source_word: וְעִמָּהֶם
  choice: और उनके साथ ... थे
  rationale: इब्रानी संबंधसूचक पद के साथ बहुवचन कर्ताओं के अनुरूप हिंदी में ‘थे’ जोड़ा गया है।
- source_word: הֵימָן וִידוּתוּן
  choice: हेमान और यदूतून
  rationale: व्यक्तिवाचक नामों का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וּשְׁאָר הַבְּרוּרִים
  choice: तथा बाकी चुने हुए लोग
  rationale: שְׁאָר का अर्थ ‘बाकी’ और passive participle הַבְּרוּרִים का अर्थ ‘चुने हुए’ है; सहज हिंदी के लिए ‘लोग’ स्पष्टतः जोड़ा गया है।
- source_word: אֲשֶׁר נִקְּבוּ בְּשֵׁמוֹת
  choice: जिन्हें नाम लेकर नियुक्त किया गया था
  rationale: यह पद नाम से स्पष्ट रूप से निर्दिष्ट या नियुक्त किए जाने का भाव देता है; ‘नाम लेकर’ व्यक्तिगत पहचान को बनाए रखता है।
- source_word: לְהֹדוֹת
  choice: धन्यवाद दें
  rationale: आराधनात्मक संदर्भ में ידה का Hiphil रूप धन्यवाद देने का अर्थ रखता है और आगे आने वाले स्तुतिगान के सूत्र से मेल खाता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ के व्यक्तिवाचक दैवी नाम יהוה को हिंदी में प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: כִּי לְעוֹלָם חַסְדּוֹ
  choice: क्योंकि उसकी अटल करुणा सदा बनी रहती है
  rationale: חֶסֶד की स्थायी, निष्ठावान दया को ‘अटल करुणा’ व्यक्त करती है; ‘सदा बनी रहती है’ प्रचलित आराधनात्मक सूत्र की स्वाभाविक हिंदी है।
theological_decisions:
- issue: दैवी नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-संबंधी व्यक्तिवाचक नाम है। हिंदी पाठकों में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ चुना गया, जबकि ‘याहवे’ अधिक अकादमिक लिप्यंतरण है।
- issue: חֶסֶד का अर्थ
  choice: अटल करुणा
  alternative: वाचा की प्रीति
  rationale: ‘अटल करुणा’ परमेश्वर की स्थायी निष्ठा और दया दोनों को संप्रेषित करती है, बिना ‘वाचा’ शब्द को वहाँ जोड़ने के जहाँ वह स्पष्ट रूप से उपस्थित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिंदी। वाक्य की इब्रानी संरचना को यथासंभव रखा गया है, पर सहजता के लिए ‘लोग’ और सहायक क्रिया जोड़ी गई हैं।
