base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/016/006.yaml
  text: And Benaiah and Jahaziel the priests were continually with the trumpets before the ark of the covenant of God[a].
translation:
  language: hi
  text: और बनायाह और यहजीएल याजक परमेश्वर की वाचा के सन्दूक के सामने तुरहियों के साथ निरन्तर रहते थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर की वाचा के सन्दूक के सामने निरन्तर तुरहियाँ बजाते थे।” इब्रानी पाठ में “बजाते थे” क्रिया स्पष्ट रूप से नहीं है, यद्यपि सम्भवतः यही आशय है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בְנָיָהוּ
  choice: और बनायाह
  rationale: व्यक्तिनाम को इब्रानी रूप के निकट देवनागरी में लिप्यन्तरित किया गया है; आरम्भिक संयोजक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: וְ/יַחֲזִיאֵל
  choice: और यहजीएल
  rationale: व्यक्तिनाम יַחֲזִיאֵל का इब्रानी उच्चारण-सन्निकट लिप्यन्तरण किया गया है।
- source_word: הַ/כֹּהֲנִים
  choice: याजक
  rationale: כֹּהֲנִים का मानक, स्पष्ट हिन्दी पद ‘याजक’ है; यहाँ यह दोनों व्यक्तियों के पद को बताता है।
- source_word: בַּ/חֲצֹצְרוֹת
  choice: तुरहियों के साथ
  rationale: חֲצֹצְרוֹת विशिष्ट रूप से तुरहियों को दर्शाता है। בַּ को यहाँ साहचर्य/करण के अर्थ में ‘के साथ’ रखा गया है; ‘बजाते’ मुख्य पाठ में नहीं जोड़ा गया क्योंकि इब्रानी में क्रिया स्पष्ट रूप से उपस्थित नहीं है।
- source_word: תָּמִיד
  choice: निरन्तर
  rationale: यह नियमित अथवा सतत सेवा का भाव देता है; ‘निरन्तर’ मूल की क्रियाविशेषणात्मक अस्पष्टता बनाए रखता है।
- source_word: לִ/פְנֵי
  choice: के सामने
  rationale: यह स्थानिक और उपासना-संबंधी दोनों अर्थों में स्वाभाविक आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: אֲרוֹן בְּרִית
  choice: वाचा का सन्दूक
  rationale: सम्बन्धवाचक इब्रानी पद-समूह का परिचित और सटीक हिन्दी रूप।
- source_word: הָ/אֱלֹהִים
  choice: परमेश्वर की
  rationale: यहाँ निश्चित אֱלֹהִים इस्राएल के परमेश्वर को दर्शाता है और हिन्दी में सम्बन्धसूचक रचना के अनुसार ‘परमेश्वर की’ स्वाभाविक है।
theological_decisions:
- issue: क्या याजकों के तुरहियाँ बजाने की क्रिया मुख्य पाठ में स्पष्ट की जाए
  choice: मुख्य पाठ में ‘तुरहियों के साथ निरन्तर रहते थे’ रखा गया है।
  alternative: ‘निरन्तर तुरहियाँ बजाते थे’
  rationale: इब्रानी पाठ में ‘बजाना’ क्रिया स्पष्ट रूप से नहीं है, यद्यपि प्रसंग में यही आशय सम्भावित है। मुख्य पाठ मूल की व्याकरणिक अपूर्णता/संक्षिप्तता को यथासम्भव बनाए रखता है और सम्भावित अर्थ को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वाचा का सन्दूक’, ‘याजक’ और ‘तुरही’ जैसे परिचित बाइबलीय पद बनाए गए हैं; जहाँ इब्रानी में क्रिया लुप्त है, वहाँ अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
