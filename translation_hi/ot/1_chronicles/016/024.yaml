  yaml_path: translation/ot/1_chronicles/016/024.yaml
  text: Declare his glory among the nations, his wondrous deeds among all the peoples.
translation:
  language: hi
  text: राष्ट्रों के बीच उसकी महिमा का वर्णन करो, और सब लोगों के बीच उसके अद्भुत कामों का वर्णन करो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: סַפְּרוּ
  choice: वर्णन करो
  rationale: बहुवचन आज्ञार्थक क्रिया सार्वजनिक रूप से बताने और सुनाने का आह्वान करती है। ‘वर्णन करो’ गरिमापूर्ण, स्वाभाविक और कृत्यों को विस्तार से घोषित करने के भाव के अनुकूल है।
- source_word: בַגּוֹיִם
  choice: जाति-जाति में
  rationale: גּוֹיִם विभिन्न राष्ट्रों अथवा जनजातीय समुदायों को सूचित करता है। ‘जाति-जाति में’ व्यापक बहुवचन और ב के ‘में/बीच’ संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כְּבוֹדוֹ
  choice: उसकी महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर के गौरव, सम्मान और तेज को समेटता है; ‘महिमा’ इसका प्रचलित और धर्मवैचारिक रूप से खुला हिन्दी पर्याय है।
- source_word: בְּכָל־הָעַמִּים
  choice: सब लोगों के बीच
  rationale: עַמִּים को ‘लोगों’ से व्यक्त करने पर पहले आए גּוֹיִם से काव्यात्मक भेद बना रहता है, और ‘के बीच’ पूर्वसर्ग ב को दर्शाता है।
- source_word: נִפְלְאֹתָיו
  choice: उसके अद्भुत कामों
  rationale: यह शब्द विस्मय उत्पन्न करने वाले असाधारण कार्यों को दर्शाता है। ‘अद्भुत काम’ गुण और ठोस कृत्य दोनों को सरल आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एकवचन संबंधसूचक प्रत्ययों (‘उसकी/उसके’) का संदर्भ
  choice: मूल पाठ की तरह सर्वनाम बनाए रखा गया है; संदर्भ में यह इस्राएल के परमेश्वर की महिमा और उसके कामों को सूचित करता है।
  alternative: नाम को स्पष्ट करते हुए ‘यहोवा की महिमा’ और ‘उसके अद्भुत काम’ कहना।
  rationale: तात्कालिक संदर्भ संदर्भित व्यक्ति को स्पष्ट करता है, पर पद स्वयं सर्वनाम प्रयोग करता है। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति सुरक्षित रहती है और अनावश्यक व्याख्यात्मक विस्तार नहीं जुड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक स्तुति-आह्वान के योग्य काव्यात्मक रजिस्टर। समानांतर पंक्तियों में ‘जाति-जाति’ और ‘सब लोगों’ का भेद सुरक्षित रखा गया है।
