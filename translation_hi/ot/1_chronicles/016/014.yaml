  yaml_path: translation/ot/1_chronicles/016/014.yaml
  text: He is Yahweh our God[b][a]; his judgments are in all the earth.
translation:
  language: hi
  text: वही याहवे[b] हमारा परमेश्वर है; उसके न्याय सारी पृथ्वी[a] में हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पृथ्वी’ के स्थान पर ‘सारे देश’ भी अनुवाद संभव है, यदि אֶרֶץ को स्थानीय अर्थ में लिया जाए। यहाँ व्यापक संदर्भ के कारण ‘पृथ्वी’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘याहवे’ इब्रानी दिव्य नाम YHWH का लिप्यंतरण है; परंपरागत अनुवादों में इसे प्रायः ‘यहोवा’ या ‘प्रभु’ कहा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: הוּא
  choice: वही ... है
  rationale: स्वतंत्र सर्वनाम यहाँ बल देता है; ‘वही’ इस जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश-नाम YHWH को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारा परमेश्वर
  rationale: बहुवचनाकार संज्ञा यहाँ इस्राएल के एकमात्र परमेश्वर के लिए प्रयुक्त है; हिन्दी में एकवचन अर्थ स्वाभाविक है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारी पृथ्वी पर
  rationale: यहाँ בְּכָל के साथ אֶרֶץ व्यापक भौगोलिक विस्तार बताता है; स्तुतिगान के संदर्भ में ‘पृथ्वी’ विश्वव्यापी आशय को बनाए रखती है।
- source_word: מִשְׁפָּטָיו
  choice: उसके न्याय
  rationale: מִשְׁפָּטָיו न्यायिक निर्णयों, न्याय-कार्यों अथवा विधानों का अर्थ दे सकता है; ‘न्याय’ हिन्दी में इसकी व्यापक अर्थ-सीमा को अपेक्षाकृत खुला रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: הָאָרֶץ का विस्तार
  choice: पृथ्वी
  alternative: देश
  rationale: संदर्भ विश्वव्यापी शासन की ओर संकेत करता है, फिर भी स्थानीय अर्थ की भाषिक संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: מִשְׁפָּטָיו की अर्थ-सीमा
  choice: उसके न्याय
  alternative: उसके न्यायिक निर्णय; उसकी विधियाँ
  rationale: ‘न्याय’ किसी एक कानूनी या दंडात्मक अर्थ को अनावश्यक रूप से निश्चित किए बिना मूल की अर्थगत व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण स्तुतिपरक वाक्य। ‘वही’ मूल सर्वनाम का बल रखता है। पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखने के बजाय वाक्यांत में क्रमबद्ध रखे गए हैं, और दोनों चिह्न मुख्य पाठ में उपस्थित हैं।
