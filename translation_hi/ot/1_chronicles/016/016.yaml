  rationale: לְ शपथ के संबोधित व्यक्ति को चिह्नित करता है। हिंदी में ‘किसी से शपथ खाना’ स्वाभाविक प्रयोग है; अतः ‘इसहाक से’ स्रोत के संबंध को सहज रूप से व्यक्त करता है।
