- source_word: כָּרַת
  choice: बाँधा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘काटना’ है, पर वाचा के साथ यह वाचा स्थापित करने का इब्रानी मुहावरा है। हिंदी का ‘वाचा बाँधना’ अर्थ और रूपक दोनों को सहजता से व्यक्त करता है।
- source_word: אֶת אַבְרָהָם
  choice: अब्राहम के साथ
  rationale: אֶת सामान्यतः कर्म-चिह्न है, किंतु वाचा बाँधने के मुहावरे में अब्राहम सहभागी पक्ष है; इसलिए ‘के साथ’ आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וּשְׁבוּעָתוֹ
  choice: और अपनी शपथ
  rationale: संज्ञा का अर्थ ‘शपथ’ है और तृतीय पुरुष एकवचन प्रत्यय उसी कर्ता की ओर लौटता है; हिंदी में ‘अपनी’ इसे स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: לְיִצְחָק
