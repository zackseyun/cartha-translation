  text: וַ/יַּעֲל֥וּ בְּ/בַֽעַל פְּרָצִים֮ וַ/יַּכֵּ֣/ם שָׁ֣ם דָּוִיד֒ וַ/יֹּ֣אמֶר דָּוִ֔יד פָּרַ֨ץ הָֽ/אֱלֹהִ֧ים אֶת אוֹיְבַ֛/י בְּ/יָדִ֖/י כְּ/פֶ֣רֶץ מָ֑יִם עַל כֵּ֗ן קָֽרְא֛וּ שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא בַּ֥עַל פְּרָצִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/011.yaml
  text: So they went up to Baal-perazim[a], and David struck them down there. And David said, “God has broken through my enemies by my hand, like a bursting flood of waters.” Therefore they called the name of that place Baal-perazim.
translation:
  language: hi
  text: तब वे बाल-परासीम[a] पर चढ़ आए, और दाऊद ने वहाँ उन्हें मार गिराया। दाऊद ने कहा, “परमेश्वर मेरे हाथ के द्वारा मेरे शत्रुओं पर ऐसे फूट पड़ा है, जैसे पानी फूट पड़ता है।” इसलिए उन्होंने उस स्थान का नाम बाल-परासीम रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाल-परासीम” नाम का अर्थ लगभग “भंगों” या “फूट निकलने का स्वामी” है। यह दाऊद के कथन में “फूट पड़ा” के लिए प्रयुक्त हिब्रू शब्द के साथ शब्दालंकार करता है।
    reason: स्थान-नाम और हिब्रू פרץ पर आधारित शब्दालंकार को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: वे ... चढ़ आए
  rationale: सैन्य गतिविधि के संदर्भ में עלה ऊपर आने या चढ़ाई करने को दर्शाता है। ‘चढ़ आए’ दिशा और आक्रमण, दोनों का स्वाभाविक हिंदी संकेत देता है।
- source_word: בְּבַעַל פְּרָצִים / בַּעַל פְּרָצִים
  choice: बाल-परासीम
  rationale: स्थान-नाम को लिप्यंतरित किया गया है; פרץ से जुड़ा शब्दालंकार मुख्य वाक्य और पादटिप्पणी में स्पष्ट रखा गया है।
- source_word: וַיַּכֵּם
  choice: दाऊद ने ... उन्हें मार गिराया
  rationale: युद्ध-संदर्भ में נכה प्रहार करके परास्त या मार गिराने का ठोस अर्थ रखता है। यह अमूर्त ‘हरा दिया’ की अपेक्षा मूल की मारक शक्ति को बेहतर बनाए रखता है।
- source_word: פָּרַץ
  choice: टूट पड़ा है
  rationale: פרץ अवरोध तोड़कर आगे निकलने या वेग से फूट पड़ने का बोध देता है। ‘टूट पड़ा’ शत्रुओं के विरुद्ध कार्रवाई और आगे दिए जल-चित्र, दोनों के साथ स्वाभाविक है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया इसे एकवचन दिव्य कर्ता ठहराती है। आधुनिक हिंदी बाइबलीय गद्य में ‘परमेश्वर’ स्पष्ट और गरिमापूर्ण है।
- source_word: בְּיָדִי
  choice: मेरे हाथ से
  rationale: मूल के ‘मेरे हाथ द्वारा’ वाले साधनात्मक मुहावरे और मानवीय सहभागिता को बनाए रखता है।
- source_word: כְּפֶרֶץ מָיִם
  choice: जैसे पानी बाँध तोड़कर उमड़ पड़ता है
  rationale: यह जल के किसी अवरोध को तोड़कर वेग से निकलने का जीवंत चित्र देता है और פרץ की पुनरावृत्ति को अर्थगत रूप में बनाए रखता है; ‘बाँध’ चित्र में निहित अवरोध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: קָרְאוּ שֵׁם הַמָּקוֹם הַהוּא
  choice: उन्होंने उस स्थान का नाम ... रखा
  rationale: बहुवचन क्रिया को ‘उन्होंने’ के रूप में सुरक्षित रखा गया है और हिब्रू नामकरण सूत्र को स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: दाऊद के कथन में אֱלֹהִים का संदर्भ और विजय की कर्तृता
  choice: परमेश्वर एकवचन दिव्य कर्ता है, जो दाऊद के हाथ से कार्य करता है
  alternative: विजय को केवल दाऊद की सैन्य उपलब्धि के रूप में व्यक्त करना
  rationale: एकवचन פָּרַץ परमेश्वर को कर्ता बताता है, जबकि בְּיָדִי दाऊद को साधन के रूप में रखता है। अनुवाद दिव्य कर्तृता और मानवीय सहभागिता, दोनों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, कथात्मक और गरिमापूर्ण रखी गई है। ‘चढ़ आए,’ ‘मार गिराया’ और ‘बाँध तोड़कर उमड़ पड़ता है’ युद्ध तथा प्रबल जलधारा की सजीवता बनाए रखते हैं। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
