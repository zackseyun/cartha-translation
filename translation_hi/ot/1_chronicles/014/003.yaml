base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/003.yaml
  text: And David took more wives in Jerusalem[a], and David fathered more sons and daughters.
translation:
  language: hi
  text: दाऊद ने यरूशलेम में और पत्नियाँ लीं[a], और दाऊद के और बेटे और बेटियाँ हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और स्त्रियों से विवाह किया”; इब्रानी में शाब्दिक रूप से “और पत्नियाँ लीं” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ग्रहण कीं
  rationale: לקח का मूल अर्थ ‘लेना’ है। पत्नियों के संदर्भ में ‘ग्रहण कीं’ स्रोत की अभिव्यक्ति के निकट रहते हुए आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है; ‘विवाह किया’ अपेक्षाकृत अधिक व्याख्यात्मक होता।
- source_word: עוֹד
  choice: और
  rationale: दोनों स्थानों पर עוֹד अतिरिक्त संख्या सूचित करता है। हिन्दी में ‘और पत्नियाँ’ तथा ‘और बेटे-बेटियाँ’ स्वाभाविक रूप से ‘अधिक/अतिरिक्त’ का भाव देते हैं।
- source_word: נָשִׁים
  choice: पत्नियाँ
  rationale: נָשִׁים का अर्थ ‘स्त्रियाँ’ या ‘पत्नियाँ’ हो सकता है; दाऊद द्वारा उन्हें ग्रहण करने के प्रसंग में वैवाहिक संबंध अभिप्रेत है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: בְּ यहाँ स्थानवाचक है; नगर के नाम का प्रचलित हिन्दी रूप ‘यरूशलेम’ है।
- source_word: וַיּוֹלֶד
  choice: से ... उत्पन्न हुए
  rationale: हिफ़ील रूप और पुरुष कर्ता दाऊद के पितृत्व को व्यक्त करते हैं। ‘दाऊद से ... उत्पन्न हुए’ आधुनिक हिन्दी में स्पष्ट है और अत्यधिक संस्कृतनिष्ठ ‘जन्माया’ अथवा पुराने ‘उत्पन्न किए’ से अधिक स्वाभाविक है।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: इब्रानी पाठ पुत्रों और पुत्रियों दोनों को स्पष्ट रूप से नामित करता है; ‘बच्चे’ कहने से यह विशिष्टता मिट जाती।
- source_word: דָּוִיד
  choice: दाऊद
  rationale: व्यक्तिनाम का स्थापित हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: दाऊद के बहुविवाह का कथात्मक वर्णन
  choice: पद को बिना नैतिक टिप्पणी के वर्णनात्मक रूप में प्रस्तुत किया गया है।
  alternative: ऐसी भाषा जोड़ना जो इस आचरण की स्वीकृति या निंदा सूचित करे।
  rationale: यह पद दाऊद द्वारा अतिरिक्त पत्नियाँ ग्रहण करने और उससे संतान उत्पन्न होने का वृत्तांत देता है, पर इसी पद में कोई नैतिक निर्णय व्यक्त नहीं करता। अनुवाद पाठ की इसी संयत कथात्मक मुद्रा को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘ग्रहण कीं’ मूल क्रिया की ठोस अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी अधिक स्वाभाविक वैकल्पिक अर्थ स्पष्ट करती है।
