base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/010.yaml
  text: And David inquired of God[a], saying, “Shall I go up against the Philistines, and will you give them into my hand?” And Yahweh said to him, “Go up, and I will give them into your hand.”
translation:
  language: hi
  text: और दाऊद ने परमेश्वर से पूछा, “क्या मैं पलिश्तियों के विरुद्ध चढ़ाई करूँ? क्या तू उन्हें मेरे हाथ में दे देगा?” तब याहवे ने उससे कहा, “चढ़ाई कर, और मैं उन्हें तेरे हाथ में दे दूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: परमेश्वर से पूछा
  rationale: इस प्रयोग में क्रिया का अर्थ परमेश्वर से मार्गदर्शन माँगना है। हिंदी में ‘परमेश्वर से पूछा’ स्वाभाविक है और संदर्भ इस औपचारिक परामर्श का भाव स्पष्ट करता है।
- source_word: הַאֶעֱלֶה עַל פלשתיים
  choice: क्या मैं पलिश्तियों के विरुद्ध चढ़ाई करूँ?
  rationale: עלה सैन्य प्रसंग में आगे बढ़कर आक्रमण करने को सूचित करता है; ‘चढ़ाई करूँ’ मूल क्रिया की गति और सैन्य अर्थ दोनों रखता है।
- source_word: וּנְתַתָּם בְּיָדִי
  choice: क्या तू उन्हें मेरे हाथ में कर देगा?
  rationale: ‘हाथ में करना’ נתן ביד के अधिकार और विजय संबंधी मुहावरे को उसकी मूल देहात्मक छवि सहित व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: עֲלֵה
  choice: चढ़ाई कर
  rationale: उत्तर में उसी עלה क्रिया की पुनरावृत्ति है जो दाऊद के प्रश्न में है; हिंदी में ‘चढ़ाई कर’ इस साहित्यिक समानता को बनाए रखता है।
- source_word: וּנְתַתִּים בְּיָדֶךָ
  choice: मैं उन्हें तेरे हाथ में कर दूँगा
  rationale: यह दाऊद के प्रश्न के शब्दों को प्रतिध्वनित करता है और शत्रुओं को उसके अधिकार में देने का अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से बदलने के बजाय व्यक्तिगत दिव्य नाम के रूप में रखा गया है। आधुनिक हिंदी बाइबलीय प्रयोग में ‘यहोवा’ अधिक व्यापक रूप से पहचाना जाता है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दाऊद और परमेश्वर के सीधे संवाद में एकवचन निकट संबोधन ‘तू/तेरे’ रखा गया है। प्रश्न और उत्तर में ‘चढ़ाई’ तथा ‘हाथ में करना’ की समानांतर शब्दावली मूल की पुनरावृत्ति को सुरक्षित रखती है।
