  yaml_path: translation/ot/1_chronicles/014/016.yaml
  text: So David did as God had commanded him, and they struck down the Philistine army from Gibeon as far as Gezer.
translation:
  language: hi
  text: तब दाऊद ने वैसा ही किया जैसा परमेश्वर ने उसे आज्ञा दी थी, और उन्होंने गिबोन से लेकर गेजेर तक पलिश्तियों की सेना को परास्त किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने ... किया
  rationale: सामान्य कथात्मक क्रिया עשה को आज्ञा के अनुरूप कार्य करने वाले स्वाभाविक हिन्दी मुहावरे में रखा गया है।
- source_word: כַּאֲשֶׁר צִוָּהוּ הָאֱלֹהִים
  choice: वैसा ही ... जैसा परमेश्वर ने उसे आज्ञा दी थी
  rationale: כַּאֲשֶׁר की अनुरूपता और आज्ञा के पहले दिए जाने का समय-संबंध दोनों स्पष्ट रहते हैं।
- source_word: וַיַּכּוּ
  choice: उन्होंने ... मार गिराया
  rationale: हिब्रू क्रिया बहुवचन है; इसलिए दाऊद और उसके साथ की सेना को सूचित करने वाला आदरसूचक नहीं, बल्कि वास्तविक बहुवचन ‘उन्होंने’ रखा गया है। सैन्य संदर्भ में נכה की प्रबलता भी बनी रहती है।
- source_word: מַחֲנֵה פְלִשְׁתִּים
  choice: पलिश्तियों की छावनी
  rationale: מַחֲנֶה का प्रत्यक्ष अर्थ ‘छावनी’ है। सैन्य बल का लाक्षणिक अर्थ संभव है, फिर भी मूल की ठोस संज्ञा को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: מִגִּבְעוֹן וְעַד גָּזְרָה
  choice: गिबोन से लेकर गेजेर तक
  rationale: מִן...עַד द्वारा व्यक्त आरम्भ और अंतिम सीमा को स्वाभाविक हिन्दी में ठीक प्रकार दर्शाता है।
theological_decisions:
- issue: וַיַּכּוּ का कर्ता
  choice: बहुवचन—दाऊद और उसके लोग
  alternative: केवल दाऊद को एकवचन कर्ता मानना
  rationale: क्रिया का रूप स्पष्टतः बहुवचन है और युद्ध के प्रसंग में दाऊद के साथ उसकी सेना का कार्य करना स्वाभाविक है।
- issue: מַחֲנֵה का अर्थ
  choice: छावनी
  alternative: सेना
  rationale: ‘सेना’ प्रसंगगत लाक्षणिक अर्थ हो सकता है, पर ‘छावनी’ हिब्रू शब्द के प्रत्यक्ष अर्थ को बिना अनावश्यक व्याख्यात्मक विस्तार के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप। ‘तब’ से हिब्रू वाव-क्रम की कथा-प्रगति स्वाभाविक ढंग से व्यक्त होती है। स्थान-नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘गिबोन’ और ‘गेजेर’ तथा जातिनाम ‘पलिश्ती’ रखा गया है।
