- source_word: וַֽ/יִּפְשְׁטוּ
  choice: फैल गए
  rationale: पשט का मूल स्थानिक अर्थ ‘फैलना/फैल जाना’ यहाँ सैन्य तैनाती या धावे का संकेत दे सकता है। मुख्य पाठ में अपेक्षाकृत औपचारिक और अर्थगत रूप से खुला अनुवाद रखा गया है; सैन्य विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: בְּ/עֵ֥מֶק
  choice: की घाटी में
  rationale: עֵמֶק का स्वाभाविक हिन्दी अर्थ ‘घाटी’ है और ב का स्पष्ट अनुवाद ‘में’ किया गया है।
- source_word: רְפָאִים
  choice: रपाईम
  rationale: यहाँ यह स्थान-नाम ‘रपाईम की घाटी’ का अंग है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
