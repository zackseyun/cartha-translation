- source_word: וּ/פְלִשְׁתִּים
  choice: और पलिश्ती
  rationale: जाति-नाम פְלִשְׁתִּים का प्रचलित हिन्दी रूप ‘पलिश्ती’ है; आरंभिक ו को कथा की क्रमबद्धता बनाए रखने के लिए ‘और’ कहा गया है।
- source_word: בָּאוּ
