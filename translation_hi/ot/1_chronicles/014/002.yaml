source:
  edition: WLC
  text: וַ/יֵּ֣דַע דָּוִ֔יד כִּֽי הֱכִינ֧/וֹ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵ֑ל כִּֽי נִשֵּׂ֤את לְ/מַ֨עְלָ/ה֙ מַלְכוּת֔/וֹ בַּ/עֲב֖וּר עַמּ֥/וֹ יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/002.yaml
  text: And David knew that Yahweh had established him as king over Israel[b][a], for his kingdom had been greatly exalted for the sake of his people Israel.
translation:
  language: hi
  text: और दाऊद जान गया कि यहोवा ने उसे इस्राएल पर राजा के रूप में स्थापित किया था, क्योंकि उसकी राजसत्ता बहुत ऊँची उठाई गई थी[a] उसकी प्रजा इस्राएल के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बहुत ऊँची उठाई गई थी’ का अनुवाद ‘बहुत प्रतिष्ठित की गई थी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसकी प्रजा’ में ‘उसकी’ का संकेत यहोवा की ओर हो सकता है—अर्थात इस्राएल यहोवा की प्रजा है; कुछ इसे दाऊद की प्रजा मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּדַע
  choice: जान गया
  rationale: यह रूप कथा में प्राप्त बोध को व्यक्त करता है; ‘जान गया’ प्रत्यक्ष और स्वाभाविक हिन्दी है।
- source_word: הֱכִינוֹ
  choice: उसे ... स्थापित किया है
  rationale: כון के हिफ़ील रूप में दृढ़ करने या पद पर स्थिर करने का भाव है; राजकीय संदर्भ में ‘स्थापित किया’ उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से रखा गया है।
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: इस्राएल पर राजा के रूप में
  rationale: לְ नियुक्ति और עַל शासन-अधिकार व्यक्त करते हैं।
- source_word: נִשֵּׂאת לְמַעְלָה
  choice: बहुत ऊँची उठाई गई थी
  rationale: शाब्दिक ऊर्ध्वगमन और रूपकात्मक उत्कर्ष—दोनों को बनाए रखता है; केवल ‘महान की गई’ कहने से मूल बिंब खो जाता।
- source_word: מַלְכוּתוֹ
  choice: उसकी राजसत्ता
  rationale: מַלְכוּת यहाँ राज्य-क्षेत्र की अपेक्षा दाऊद के राजत्व, शासन और प्रतिष्ठा को अधिक स्वाभाविक रूप से सूचित करता है।
- source_word: בַּעֲבוּר
  choice: के लिए
  rationale: लाभ अथवा उद्देश्य का भाव संक्षेप और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: עַמּוֹ יִשְׂרָאֵל
  choice: उसकी प्रजा इस्राएल
  rationale: सर्वनाम के व्याकरणिक रूप को सुरक्षित रखा गया है; उसका संदर्भ यहोवा या दाऊद—दोनों समझा जा सकता है।
theological_decisions:
- issue: עַמּוֹ में ‘उसकी’ का संदर्भ
  choice: मुख्य पाठ में संदर्भ को अनिर्णीत रखा गया
  alternative: इसे स्पष्टतः ‘यहोवा की प्रजा’ या ‘दाऊद की प्रजा’ कहना
  rationale: इब्रानी सर्वनाम दोनों निकटवर्ती पुल्लिंग एकवचन संदर्भों से जुड़ सकता है। व्यापक प्रसंग यहोवा की ओर संकेत कर सकता है, पर मुख्य पाठ में उसे स्पष्ट कर देना वास्तविक अस्पष्टता मिटा देता।
- issue: दूसरे כִּי का अर्थ
  choice: कारणसूचक ‘क्योंकि’
  alternative: व्याख्यात्मक ‘कि’
  rationale: दूसरा खंड दाऊद के जानने का आधार बताता है; कारणसूचक संबंध संदर्भ में अधिक सहज है।
- issue: निष्प्राण कर्ता के साथ निष्क्रिय रूप
  choice: ‘राजसत्ता ... उठाई गई थी’
  alternative: ‘उसकी राजसत्ता बहुत ऊँची उठी थी’
  rationale: निफ़अल की निष्क्रिय/मध्यवाच्य शक्ति को बनाए रखा गया है, बिना कर्ता को अनावश्यक रूप से नामित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। ‘राजसत्ता’ से מַלְכוּת का राजत्व/शासनगत भाव व्यक्त किया गया है। मूल की अस्पष्टता मुख्य पाठ में सुरक्षित है और टिप्पणियों के चिह्न [a], [b] पाठ में उपस्थित हैं।
