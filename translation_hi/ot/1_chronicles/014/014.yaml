base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/014.yaml
  text: So David inquired of God again[a], and God said to him, “You shall not go up after them. Circle around from behind them, and come against them opposite the balsam trees.”
translation:
  language: hi
  text: तब दाऊद ने फिर परमेश्वर से पूछा, और परमेश्वर ने उससे कहा, “उनका पीछा करते हुए चढ़ाई मत कर। घूमकर उनसे अलग हो जा और बलसान के पेड़ों[a] के सामने की ओर से उन पर आक्रमण कर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “बाका के पेड़”; पेड़ की ठीक प्रजाति निश्चित नहीं है। परंपरागत अनुवादों में प्रायः “शहतूत के पेड़” मिलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בֵּאלֹהִים
  choice: परमेश्वर से पूछा
  rationale: שׁאל के साथ ב यहाँ परमेश्वर से मार्गदर्शन माँगने का भाव रखता है। प्रसंग इस परामर्शात्मक अर्थ को स्पष्ट करता है, इसलिए सहज हिंदी ‘परमेश्वर से पूछा’ पर्याप्त और स्वाभाविक है।
- source_word: עוֹד
  choice: फिर
  rationale: यह दाऊद द्वारा पहले भी परमेश्वर से पूछे जाने की पुनरावृत्ति बताता है।
- source_word: לֹא תַעֲלֶה אַחֲרֵיהֶם
  choice: उनके पीछे चढ़ाई मत कर
  rationale: עלה का मूल गति-संबंधी अर्थ ‘ऊपर जाना/चढ़ना’ है, किंतु सैन्य प्रसंग में ‘चढ़ाई करना’ स्वाभाविक है; अनुवाद सीधे पीछा करते हुए आक्रमण न करने की आज्ञा को व्यक्त करता है।
- source_word: הָסֵב מֵעֲלֵיהֶם
  choice: उनसे हटकर घूम जा
  rationale: הָסֵב दिशा बदलकर चक्कर लगाने को और מֵעֲלֵיהֶם सीधी दिशा या स्थिति से हटने को सूचित करता है। यह अनुवाद ‘उनके पीछे से’ जैसी ऐसी निश्चित दिशा नहीं जोड़ता जो इब्रानी में स्पष्ट नहीं है।
- source_word: וּבָאתָ לָהֶם
  choice: उन पर आक्रमण कर
  rationale: בוא + ל का शाब्दिक भाव ‘उनके पास/विरुद्ध आना’ है; सैन्य प्रसंग में हिंदी का ‘उन पर आक्रमण कर’ अभिप्रेत क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמּוּל
  choice: के सामने से
  rationale: यह किसी वस्तु के सामने या उसके ठीक सम्मुख की स्थिति बताता है।
- source_word: הַבְּכָאִים
  choice: बलसान के पेड़
  rationale: पेड़ की ठीक प्रजाति अनिश्चित है। ‘बलसान’ एक प्रचलित संभावित पहचान देता है, जबकि पादटिप्पणी मूल नाम और अनिश्चितता सुरक्षित रखती है।
