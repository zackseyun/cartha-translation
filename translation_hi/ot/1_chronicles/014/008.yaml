base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/008.yaml
  text: When the Philistines heard that David had been anointed king over all Israel[a], all the Philistines went up to seek David. And David heard, and went out before them.
translation:
  language: hi
  text: जब पलिश्तियों ने सुना कि दाऊद का सारे इस्राएल पर राजा के रूप में अभिषेक किया गया था, तब सारे पलिश्ती दाऊद को ढूँढ़ने चढ़ गए। दाऊद ने यह सुना और उनके सामने निकल गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनसे मिलने निकल गया” अथवा “उनका सामना करने निकल गया।” इब्रानी में शाब्दिक रूप से “उनके सामने निकल गया” है; इससे सैनिक मुठभेड़ का संकेत मिल सकता है, पर यह बात स्पष्ट रूप से नहीं कही गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: सुना
  rationale: कथात्मक संदर्भ में שׁמע का अर्थ किसी समाचार को सुनना या उसकी खबर पाना है; ‘सुना’ सीधा और स्वाभाविक है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के लिए प्रचलित हिन्दी नाम।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי सुनी गई बात की विषय-वस्तु प्रस्तुत करता है।
- source_word: נִמְשַׁח דָּוִיד לְמֶלֶךְ
  choice: दाऊद का ... राजा होने के लिए अभिषेक किया गया है
  rationale: निफ़अल रूप अभिषेक किए जाने को व्यक्त करता है, और לְמֶלֶךְ राजकीय पद या परिणाम बताता है। हिन्दी का पूर्ण पक्ष उस घटना को पलिश्तियों के सुनने से पहले घटित दिखाता है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल पर
  rationale: עַל यहाँ प्रजा पर राजकीय अधिकार और शासन का क्षेत्र व्यक्त करता है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ आए
  rationale: עלה की ऊपर की ओर गति को बनाए रखता है और इस संदर्भ में हिन्दी कथन को स्वाभाविक बनाता है; क्रिया में स्वयं ‘युद्ध करने’ का अर्थ नहीं जोड़ा गया।
- source_word: כָל פְּלִשְׁתִּים
  choice: सारे पलिश्ती
  rationale: इब्रानी के सामूहिक और व्यापक कथन को बिना उसे केवल सेना तक सीमित किए सुरक्षित रखता है।
- source_word: לְבַקֵּשׁ אֶת דָּוִיד
  choice: दाऊद को ढूँढ़ने
  rationale: בקשׁ का मूल अर्थ खोजने या ढूँढ़ने का है। शत्रुतापूर्ण उद्देश्य संदर्भ से स्पष्ट हो सकता है, पर उसे अनावश्यक रूप से क्रिया में नहीं जोड़ा गया।
- source_word: וַיִּשְׁמַע דָּוִיד
  choice: दाऊद ने यह सुना
  rationale: पलिश्तियों और दाऊद—दोनों के सुनने की कथात्मक समानता बनाए रखता है; ‘यह’ हिन्दी में संदर्भ को स्वाभाविक रूप से जोड़ता है।
- source_word: וַיֵּצֵא לִפְנֵיהֶם
  choice: उनके सामने निकल गया
  rationale: לִפְנֵיהֶם के ‘उनके सामने/आगे’ वाले स्थानिक बिंब को बनाए रखता है और यह निश्चित नहीं करता कि अर्थ केवल मिलने जाना था या युद्ध के लिए सामना करना।
