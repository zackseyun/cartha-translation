    reason: alternative_reading
lexical_decisions:
- source_word: וֶ/אֱלִישָׁמָע
  choice: और एलीशामा
  rationale: उपसर्ग ו को ‘और’ के रूप में व्यक्त किया गया है। व्यक्ति के नाम אֱלִישָׁמָע का ध्वन्यात्मक देवनागरी रूप ‘एलीशामा’ रखा गया है।
- source_word: וּ/בְעֶלְיָדָע
  choice: बाल्यादा
  rationale: इस पद के मासोरेटिक इब्रानी पाठ בְעֶלְיָדָע का अनुसरण करते हुए नाम को ‘बाल्यादा’ लिखा गया है। समानांतर सूची में मिलने वाले भिन्न रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וֶ/אֱלִיפָלֶט
  choice: एलीपेलेत
  rationale: व्यक्ति के नाम אֱלִיפָלֶט को उसके इब्रानी उच्चारण के निकट ‘एलीपेलेत’ के रूप में लिप्यंतरित किया गया है। सूची को स्वाभाविक हिन्दी बनाने के लिए अंतिम नाम से पहले आए ו को अलग से दोहराना आवश्यक नहीं समझा गया।
