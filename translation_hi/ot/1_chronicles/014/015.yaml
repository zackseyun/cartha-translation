  text: וִ֠/יהִי כְּֽ/שָׁמְעֲ/ךָ֞ אֶת ק֤וֹל הַ/צְּעָדָה֙ בְּ/רָאשֵׁ֣י הַ/בְּכָאִ֔ים אָ֖ז תֵּצֵ֣א בַ/מִּלְחָמָ֑ה כִּֽי יָצָ֤א הָֽ/אֱלֹהִים֙ לְ/פָנֶ֔י/ךָ לְ/הַכּ֖וֹת אֶת מַחֲנֵ֥ה פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/015.yaml
  text: And when you hear the sound of marching in the tops of the balsam trees[a], then go out to battle, for God has gone out before you to strike down the camp of the Philistines.
translation:
  language: hi
  text: और जब तुम बलसाम के पेड़ों[a] की चोटियों में कदमों की आहट सुनो, तब युद्ध के लिए निकल पड़ना, क्योंकि परमेश्वर पलिश्तियों की छावनी को परास्त करने के लिए तुमसे आगे निकल चुका है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाका के पेड़”; परंपरागत अनुवाद “शहतूत के पेड़” है। इब्रानी शब्द से सूचित पेड़ की ठीक-ठीक जाति अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהִי כְּשָׁמְעֲךָ
  choice: और जब तुम ... सुनो
  rationale: वाव + היה और כְּ के साथ क्रिया का infinitive construct एक कालवाचक परिस्थिति प्रस्तुत करते हैं। आधुनिक हिन्दी में ‘और जब तुम ... सुनो’ स्वाभाविक है और अनावश्यक रूप से ‘जैसे ही’ की तात्कालिकता नहीं जोड़ता।
- source_word: קוֹל הַצְּעָדָה
  choice: कदमों की आहट
  rationale: צְעָדָה का संबंध कदम बढ़ाने या कूच करने से है। ‘कदमों की आहट’ सुनाई देने वाली घटना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करती है, जबकि सैन्य प्रसंग आगे के आदेश से स्पष्ट रहता है।
- source_word: בְּרָאשֵׁי הַבְּכָאִים
  choice: बलसान के पेड़ों की चोटियों में
  rationale: רָאשִׁים यहाँ पेड़ों के ऊपरी भागों को दर्शाता है। בְּכָאִים की सटीक वनस्पति-जाति अनिश्चित है; ‘बलसान’ एक प्रचलित विद्वत्तापूर्ण पहचान है, और अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אָז תֵּצֵא בַמִּלְחָמָה
  choice: तब युद्ध के लिए निकल पड़ना
  rationale: יָצָא का मूल अर्थ ‘निकलना’ है और בַּמִּלְחָמָה सैन्य प्रयोजन बताता है। ‘निकल पड़ना’ आदेश की सक्रियता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי יָצָא הָאֱלֹהִים לְפָנֶיךָ
  choice: क्योंकि परमेश्वर तुमसे आगे ... निकल चुका होगा
  rationale: כִּי कारण प्रस्तुत करता है। सिद्ध क्रिया יָצָא उस समय तक आरम्भ हो चुकी दैवी कार्रवाई को दिखाती है जब संकेत सुनाई देगा; हिन्दी का ‘निकल चुका होगा’ इस भविष्य-सापेक्ष पूर्णता को स्पष्ट करता है और ‘आगे’ सैन्य अग्रगमन की छवि बनाए रखता है।
- source_word: לְהַכּוֹת אֶת מַחֲנֵה פְלִשְׁתִּים
  choice: पलिश्तियों की छावनी को मार गिराने के लिए
  rationale: हिफ़िल לְהַכּוֹת युद्ध में प्रहार करके परास्त या मार गिराने का अर्थ दे सकता है। ‘मार गिराने’ निर्णायक सैन्य कार्रवाई को दर्शाता है, और מַחֲנֶה के लिए ‘छावनी’ उपयुक्त है।
theological_decisions:
- issue: הָאֱלֹהִים का वचन
  choice: परमेश्वर
  alternative: देवता
  rationale: रूप की दृष्टि से אֱלֹהִים बहुवचन-जैसा है, पर यहाँ इसके साथ एकवचन क्रिया יָצָא है और प्रसंग इस्राएल के परमेश्वर का है; इसलिए एकवचन ‘परमेश्वर’ स्रोत के आशय को सही व्यक्त करता है।
- issue: दैवी अग्रगमन के पूर्ण पक्ष का हिन्दी रूप
  choice: निकल चुका होगा
  alternative: निकल चुका है / निकलता है
  rationale: आदेश उस भावी समय से जुड़ा है जब दाऊद आहट सुनेगा। उस समय परमेश्वर का आगे निकलना पहले से घटित मानकर प्रस्तुत है; ‘चुका होगा’ इस भविष्य-सापेक्ष दृष्टिकोण को बनाए रखता है, बिना घटनाक्रम की धार्मिक व्याख्या बढ़ाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘कदमों की आहट’ श्रव्य संकेत को स्वाभाविक बनाता है; ‘निकल चुका होगा’ इब्रानी सिद्ध क्रिया के भविष्य-सापेक्ष पक्ष को सुरक्षित रखता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में उपस्थित है।
