base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/017.yaml
  text: And David’s name went out into all the lands[b][a], and Yahweh put the fear of him on all the nations.
translation:
  language: hi
  text: दाऊद का नाम सभी देशों में फैल गया[a], और याहवे ने सभी जातियों पर उसका भय डाल दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद की ख्याति सभी देशों में फैल गई।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात् याहवे ने सभी जातियों के मन में दाऊद का भय उत्पन्न कर दिया।
    reason: referent_clarification
lexical_decisions:
- source_word: וַיֵּצֵא שֵׁם דָּוִיד
  choice: दाऊद का नाम … फैल गया
  rationale: इब्रानी मुहावरे में शाब्दिक रूप से दाऊद का ‘नाम निकल गया’ है, जिसका आशय उसकी ख्याति फैलने से है। ‘नाम … फैल गया’ मूल बिंब को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी देता है।
- source_word: בְּכָל הָאֲרָצוֹת
  choice: सभी देशों में
  rationale: बहुवचन אֲרָצוֹת यहाँ आसपास के देशों अथवा भूभागों को दर्शाता है। ‘सभी देशों में’ हिन्दी में प्रसार के भाव के साथ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत इब्रानी नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: נָתַן אֶת פַּחְדּוֹ עַל
  choice: उसका भय … पर डाल दिया
  rationale: ‘भय को किसी पर रखना/देना’ वाले इब्रानी मुहावरे के लिए ‘भय डाल दिया’ स्पष्ट और स्वाभाविक हिन्दी है। सर्वनाम मूल पाठ की व्याकरणिक बनावट को भी दर्शाता है।
- source_word: כָּל הַגּוֹיִם
  choice: सभी जातियों
  rationale: גּוֹיִם यहाँ इस्राएल के आसपास के जनसमूहों अथवा राष्ट्रों के लिए है; ‘जातियाँ’ बाइबलीय सन्दर्भ में इस सामूहिक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: פַּחְדּוֹ में तीसरे पुरुष एकवचन पुल्लिंग प्रत्यय का सन्दर्भ
  choice: मुख्य पाठ में ‘उसका भय’ रखा गया और पादटिप्पणी में इसे दाऊद का भय बताया गया।
  alternative: इसे याहवे का भय मानना।
  rationale: निकटवर्ती प्रसंग दाऊद की विजयों और दूर-दूर तक फैली उसकी ख्याति पर केन्द्रित है; इसलिए सबसे संगत अर्थ है कि याहवे ने जातियों में दाऊद का भय उत्पन्न किया। फिर भी इब्रानी सर्वनाम अपने आप में केवल पुल्लिंग एकवचन है, इसलिए मुख्य पाठ में उसकी सर्वनामिक संरचना सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नाम फैलना’ हिन्दी का स्वाभाविक मुहावरा है और साथ ही इब्रानी ‘नाम’ के बिंब को सुरक्षित रखता है।
