  text: And they left their gods there[a], and David gave the order[b], and they were burned with fire.
translation:
  language: hi
  text: और वे अपने देवताओं[a] को वहीं छोड़ गए। तब दाऊद ने कहा, और वे आग में जला दिए गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी मूर्तियों।” इब्रानी में शाब्दिक रूप से “अपने देवताओं” है, हालाँकि यहाँ आशय संभवतः उनकी उपासना-मूर्तियों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַזְבוּ
  choice: छोड़ गए
  rationale: עזב का सामान्य अर्थ ‘छोड़ना’ या ‘त्याग देना’ है। यहाँ पलायन के समय वस्तुओं को पीछे छोड़ देने का सीधा भाव है।
- source_word: שָׁם
  choice: वहीं
  rationale: स्थानवाचक क्रियाविशेषण को स्वाभाविक हिंदी में संक्षेप से व्यक्त करता है।
- source_word: אֶת אֱלֹהֵיהֶם
  choice: अपने देवताओं
  rationale: इब्रानी में शाब्दिक रूप से ‘उनके देवता’ है; कर्ता के साथ संबंध स्पष्ट करने के लिए हिंदी में ‘अपने देवताओं’ स्वाभाविक है। संदर्भ संभवतः उनकी उपासना-मूर्तियों का है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וַיֹּאמֶר דָּוִיד
  choice: तब दाऊद ने आज्ञा दी
  rationale: शाब्दिक अर्थ ‘दाऊद ने कहा’ है, पर अगले निष्क्रिय वाक्य के संदर्भ में कथन का कार्य आदेश देना है। ‘आज्ञा दी’ आधुनिक हिंदी में इसे स्पष्ट और संक्षिप्त रूप से व्यक्त करता है।
- source_word: וַיִּשָּׂרְפוּ
  choice: वे ... जला दिए गए
  rationale: रूप को यहाँ निष्क्रिय अर्थ में लिया गया है, जिसका विषय पीछे उल्लिखित देवता/उपासना-मूर्तियाँ हैं। इससे ऐसा सक्रिय कर्म नहीं जोड़ा जाता जो मूल पाठ में स्पष्ट नहीं है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: हिंदी में जलाए जाने के साधन और प्रक्रिया को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मूर्तिपूजक उपासना-वस्तुओं के लिए אֱלֹהֵיהֶם का अनुवाद
  choice: अपने देवताओं
  alternative: अपनी मूर्तियों
  rationale: मूल इब्रानी ‘उनके देवता’ कहता है। मुख्य पाठ में इसी शब्दावली को सुरक्षित रखा गया है, जबकि संभावित भौतिक संदर्भ—उपासना-मूर्तियाँ—को पादटिप्पणी में बताया गया है।
- issue: दाऊद के कथन और जलाए जाने के बीच संबंध
  choice: दाऊद ने आज्ञा दी ... वे आग में जला दिए गए
  alternative: दाऊद ने कहा ... उन्होंने उन्हें आग में जला दिया
  rationale: इतिहास की पुस्तक का पाठ आदेश के बाद निष्क्रिय रूप में जलाए जाने को प्रस्तुत करता है। अनुवाद उसी संरचना को रखता है और समानांतर विवरण की सक्रिय भाषा को इसमें नहीं मिलाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘देवताओं’ मूल की वास्तविक शब्दावली बनाए रखता है; ‘मूर्तियों’ को व्याख्यात्मक विकल्प के रूप में पादटिप्पणी में दिया गया है। निष्क्रिय वाक्य-विन्यास मूल पाठ की अस्पष्ट एजेंसी को सुरक्षित रखता है।
