base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/001.yaml
  text: Then Hiram king of Tyre sent messengers to David[a], and cedar timber, masons, and carpenters[b], to build a house for him.
translation:
  language: hi
  text: तब सोर के राजा हीराम ने दाऊद के पास दूत[a], देवदार की लकड़ी, राजमिस्त्री और बढ़ई भेजे, ताकि उसके लिए एक घर[b] बनाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रतिनिधि।” राजकीय प्रसंग में इब्रानी शब्द आधिकारिक प्रतिनिधियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “महल।” इब्रानी शब्द का सामान्य अर्थ “घर” है, पर यहाँ वह राजा के निवास को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजे
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: חירם
  choice: हीराम
  rationale: यहाँ के व्यंजनात्मक पाठ के अनुरूप प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: מֶלֶךְ צֹר
  choice: सोर के राजा
  rationale: सम्बन्धवाचक इब्रानी रचना हीराम के पद और राज्य को सीधे पहचानती है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यह सामान्य अर्थ ‘संदेशवाहक/दूत’ को बनाए रखता है; राजकीय प्रसंग में ‘राजदूत’ भी सम्भव है, पर वह पद की औपचारिकता अधिक निश्चित कर देगा।
- source_word: וַעֲצֵי אֲרָזִים
  choice: देवदार की लकड़ी
  rationale: निर्माण के प्रसंग में यह जीवित पेड़ों के बजाय निर्माण-सामग्री के रूप में देवदार की लकड़ी को सूचित करता है।
- source_word: חָרָשֵׁי קִיר
  choice: राजमिस्त्री
  rationale: शाब्दिक रूप से ‘दीवार के कारीगर’; निर्माण के इस प्रसंग में ‘राजमिस्त्री’ स्वाभाविक और सटीक हिन्दी है।
- source_word: חָרָשֵׁי עֵצִים
  choice: बढ़ई
  rationale: ‘लकड़ी के कारीगर’ के लिए भवन-निर्माण के प्रसंग में प्रचलित हिन्दी समतुल्य।
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: ताकि वे उसके लिए एक भवन बनाएँ
  rationale: उद्देश्यवाचक भाव स्पष्ट किया गया है। ‘भवन’ בָּיִת के सामान्य अर्थ को रखता है और राजकीय निवास की सम्भावना को ‘महल’ कहकर अनावश्यक रूप से निश्चित नहीं करता।
