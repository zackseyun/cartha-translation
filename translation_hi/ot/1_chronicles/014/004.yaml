base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/014/004.yaml
  text: 'And these are the names of the children born to him in Jerusalem: Shammua[a], Shobab, Nathan, and Solomon.'
translation:
  language: hi
  text: 'और ये उन बच्चों के नाम हैं जो यरूशलेम में उसके जन्मे थे: शम्मूआ, शोबाब, नातान और सुलैमान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये हैं
  rationale: संयोजक और संकेतवाचक पद सूची को पिछले प्रसंग से जोड़ते हुए उसका परिचय देते हैं; यह हिंदी में स्वाभाविक रूप से वाक्य के आरंभ और विधेय में व्यक्त किया गया है।
- source_word: שְׁמוֹת
  choice: के नाम
  rationale: यह ‘नाम’ का बहुवचन संबंधसूचक रूप है और आगे व्यक्तियों की सूची प्रस्तुत करता है।
- source_word: הַיְלוּדִים
  choice: जन्म लेनेवालों
  rationale: यह ילד धातु का कर्मवाच्य कृदंत है, जिसका शाब्दिक अर्थ ‘जन्मे हुए लोग’ है। ‘जन्म लेनेवालों’ मूल की अभिव्यक्ति को बनाए रखता है और सामान्य संज्ञा ‘पुत्र’ अनावश्यक रूप से नहीं जोड़ता।
- source_word: אֲשֶׁר הָיוּ לוֹ
  choice: उसके यहाँ
  rationale: היה के साथ ל संबंध या अधिकार व्यक्त करता है। जन्म के प्रसंग में ‘उसके यहाँ’ सहज हिंदी में दाऊद से उनका संबंध बताता है।
- source_word: בִּירוּשָׁלִָם
  choice: यरूशलेम में
  rationale: स्थानवाचक पूर्वसर्ग जन्म का स्थान बताता है।
- source_word: שַׁמּוּעַ
  choice: शम्मूआ
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: שׁוֹבָב
  choice: शोबाब
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: נָתָן
  choice: नातान
  rationale: इब्रानी नाम का प्रचलित और स्रोत-सन्निकट हिंदी रूप।
- source_word: שְׁלֹמֹה
  choice: सुलैमान
  rationale: इस बाइबलीय व्यक्तिवाचक नाम का हिंदी में सुस्थापित रूप अपनाया गया है।
theological_decisions:
- issue: הַיְלוּדִים का लिंग और संबंध
  choice: मुख्य पाठ में ‘जन्म लेनेवालों’ रखा गया है।
  alternative: ‘पुत्रों’ या ‘बच्चों’
  rationale: सूची के सभी नाम पुरुषों के हैं, पर इब्रानी में यहाँ सामान्य शब्द ‘पुत्र’ नहीं, बल्कि ‘जन्मे हुए’ अर्थ वाला कृदंत है। इसलिए पाठ मूल की शब्दगत विशेषता और संभावित व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण सूची-वाक्य रखा गया है। ‘उसके यहाँ जन्म लेनेवालों’ सामान्य पाठक के लिए सहज है और मूल इब्रानी के कृदंतात्मक रूप को भी सुरक्षित रखता है।
