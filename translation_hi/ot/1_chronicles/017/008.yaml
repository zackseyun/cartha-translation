  to: मैं जहाँ कहीं तू गया, तेरे साथ रहा; मैंने तेरे सब शत्रुओं को तेरे सामने से हटा दिया; और मैं तेरे लिए ऐसा नाम बनाऊँगा, जैसा पृथ्वी[a] पर रहनेवाले महान लोगों का नाम है।
