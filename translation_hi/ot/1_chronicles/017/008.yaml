source:
  edition: WLC
  text: וָֽ/אֶהְיֶ֣ה עִמְּ/ךָ֗ בְּ/כֹל֙ אֲשֶׁ֣ר הָלַ֔כְתָּ וָ/אַכְרִ֥ית אֶת כָּל אוֹיְבֶ֖י/ךָ מִ/פָּנֶ֑י/ךָ וְ/עָשִׂ֤יתִֽי לְ/ךָ֙ שֵׁ֔ם כְּ/שֵׁ֥ם הַ/גְּדוֹלִ֖ים אֲשֶׁ֥ר בָּ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/008.yaml
  text: And I have been with you wherever you have gone[a], and I have cut off all your enemies from before you[b], and I will make for you a name like the name of the great ones who are on the earth.
translation:
  language: hi
  text: मैं जहाँ कहीं तू गया, तेरे साथ रहा; मैंने तेरे सब शत्रुओं को तेरे सामने से हटा दिया; और मैं तेरे लिए ऐसा नाम बनाऊँगा, जैसा पृथ्वी[a] पर रहनेवाले महान लोगों का नाम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘देश में।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶהְיֶה עִמְּךָ
  choice: मैं तेरे साथ रहा
  rationale: वर्णनात्मक क्रम में यहोवा की दाऊद के प्रति पिछली उपस्थिति और सहायता को व्यक्त करता है। एकवचन निकट संबोधन के लिए ‘तेरे’ रखा गया है।
- source_word: בְּכֹל אֲשֶׁר הָלַכְתָּ
  choice: जहाँ कहीं तू गया
  rationale: शाब्दिक संरचना का स्वाभाविक हिन्दी मुहावरा है और दाऊद की हर यात्रा अथवा अभियान में साथ होने का भाव देता है।
- source_word: וָאַכְרִית
  choice: मैंने ... मिटा दिया
  rationale: हिफ़ील रूप शत्रुओं को हटाने या नष्ट करने का बोध देता है। हिन्दी में ‘मिटा दिया’ इस परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אֶת כָּל אוֹיְבֶיךָ
  choice: तेरे सब शत्रुओं को
  rationale: मूल के स्पष्ट समग्रताबोधक ‘सब’ को बनाए रखा गया है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने से
  rationale: इब्रानी स्थानवाचक मुहावरे ‘तेरे मुख/उपस्थिति के सामने से’ को निकटता से और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעָשִׂיתִי לְךָ שֵׁם
  choice: मैं तेरे लिए ऐसा नाम करूँगा
  rationale: यहाँ वचन-क्रम में भविष्य का भाव है। ‘नाम करना’ प्रतिष्ठा या यश स्थापित करने का हिन्दी मुहावरा है और मूल ‘तेरे लिए नाम बनाना’ के चित्र को बनाए रखता है।
- source_word: כְּשֵׁם הַגְּדוֹלִים
  choice: जैसा ... महान लोगों का नाम है
  rationale: तुलनात्मक संरचना और ‘नाम’ की पुनरावृत्ति सुरक्षित रखी गई है; ‘लोगों’ से विशेषण का व्यक्तिवाचक बहुवचन स्वाभाविक हिन्दी में आता है, बिना अनावश्यक रूप से केवल पुरुषों तक सीमित किए।
- source_word: אֲשֶׁר בָּאָרֶץ
  choice: पृथ्वी के
  rationale: אֶרֶץ के व्यापक अर्थ ‘पृथ्वी’ को मुख्य पाठ में चुना गया है; यहाँ महान लोगों की व्यापक ख्याति से तुलना इस अर्थ के अनुकूल है।
theological_decisions:
- issue: ईश्वरीय कार्यों का कालक्रम
  choice: पहले दो कार्य भूतकाल में और अंतिम प्रतिज्ञा भविष्यकाल में
  alternative: सभी खंडों को भूतकाल अथवा सभी को भविष्यकाल में पढ़ना
  rationale: वर्णनात्मक वय्यिक्तोल रूप पिछली संगति और विजय को याद करते हैं, जबकि अंतिम रूप प्रसंग की आगामी प्रतिज्ञा के क्रम में भविष्य की ओर संकेत करता है।
- issue: אֶרֶץ का दायरा
  choice: पृथ्वी
  alternative: देश
  rationale: दोनों अर्थ भाषिक रूप से संभव हैं। व्यापक ख्याति की तुलना के कारण ‘पृथ्वी’ मुख्य पाठ में अधिक उपयुक्त है, पर संकीर्ण ‘देश’ अर्थ को निर्णायक रूप से नकारना आवश्यक नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और मूल-पाठ के निकट शैली अपनाई गई है। परमेश्वर द्वारा दाऊद को किए गए एकवचन संबोधन में ‘तू/तेरे’ का प्रयोग निकटता और पारंपरिक बाइबिलीय प्रत्यक्षता बनाए रखता है। कोई पादटिप्पणी आवश्यक नहीं समझी गई, इसलिए मुख्य पाठ में पादटिप्पणी-चिह्न नहीं हैं।
