  text: What more can David add before you for honoring your servant? You know your servant.
translation:
  language: hi
  text: दाऊद तुझसे और क्या कह सकता है कि तूने अपने दास को आदर दिया है?[a][b] तू अपने दास को जानता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “दाऊद तुझको और क्या जोड़ सकता है?” यहाँ “कह” शब्द अर्थ स्पष्ट करने के लिए जोड़ा गया है; वह इब्रानी पाठ में स्पष्ट रूप से नहीं है।'
    reason: lexical_alternative
  - marker: b
    text: “कि तूने अपने दास को आदर दिया है” वाला इब्रानी पदबंध कठिन है। इसका अर्थ “अपने दास के आदर के विषय में” या “अपने दास का आदर करने के लिए” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַה יּוֹסִיף עוֹד
  choice: और क्या कह सकता है
  rationale: शाब्दिक भाव ‘और क्या जोड़ सकता है’ है, पर हिन्दी में वाणी के संदर्भ में ‘और क्या कह सकता है’ स्वाभाविक है; ‘कह’ अर्थ की स्पष्टता के लिए पूरित है, इसलिए इसे पादटिप्पणी में बताया गया है।
- source_word: דָּוִיד
  choice: दाऊद
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: אֵלֶיךָ
  choice: तुझसे
  rationale: यहाँ אֶל संबोधन की दिशा दर्शाता है; प्रार्थना के प्रसंग में ‘तुझसे ... कह सकता है’ स्वाभाविक हिन्दी है और मूल के ‘तेरी ओर/तुझको’ भाव को व्यक्त करता है।
- source_word: לְכָבוֹד אֶת עַבְדֶּךָ
  choice: कि तूने अपने दास को आदर दिया है
  rationale: संक्षिप्त और कठिन इब्रानी पदबंध को प्रसंगानुसार परमेश्वर द्वारा दाऊद को दिए गए आदर के रूप में व्यक्त किया गया है; वैकल्पिक संरचनाएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: עַבְדֶּךָ
  choice: अपने दास
  rationale: עֶבֶד का इस राजकीय प्रार्थना में उपयुक्त और परंपरागत हिन्दी रूप ‘दास’ है; दाऊद स्वयं को परमेश्वर का दास कहता है।
- source_word: וְאַתָּה אֶת עַבְדְּךָ יָדָעְתָּ
  choice: तू अपने दास को जानता है
  rationale: इब्रानी पूर्ण क्रिया यहाँ परमेश्वर के स्थिर और वर्तमान ज्ञान को व्यक्त करती है; हिन्दी वर्तमान काल स्वाभाविक है।
theological_decisions:
- issue: לְכָבוֹד אֶת עַבְדֶּךָ का कठिन अर्थ
  choice: परमेश्वर ने अपने दास दाऊद को आदर दिया है
  alternative: ‘अपने दास के आदर के विषय में’ अथवा ‘अपने दास का आदर करने के लिए’
  rationale: निकट प्रसंग में दाऊद उस सम्मान पर आश्चर्य करता है जो परमेश्वर ने उसे दिया। मुख्य पाठ इस प्रसंगगत अर्थ को सहज हिन्दी में देता है, जबकि मूल की वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में श्रद्धापूर्ण, सहज और गरिमामय शैली। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू’ और दाऊद के आत्मनिर्देश के लिए ‘दास’ रखा गया है।
