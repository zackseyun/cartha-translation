lexical_decisions:
- source_word: וַיְהִי
  choice: परन्तु ... पहुँचा
  rationale: पहला वַיְהִי कथा को आगे बढ़ाता है और पिछले प्रसंग से हल्का विरोध दर्शाता है; दूसरा हिंदी के स्वाभाविक वाक्य-विन्यास में ‘वचन ... पहुँचा’ के भीतर समाहित है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उसी रात
  rationale: यह स्वाभाविक आधुनिक हिंदी में निश्चित समय और הַהוּא के संकेतात्मक बल, दोनों को व्यक्त करता है।
- source_word: דְּבַר אֱלֹהִים
  choice: परमेश्वर का वचन
  rationale: भविष्यद्वाणी-संबंधी प्रकाशन के सूत्र में यह औपचारिक और गरिमापूर्ण अर्थ को बनाए रखता है; ‘परमेश्वर की ओर से एक वचन’ भी व्याकरणतः संभव है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द इस्राएल के परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है; ‘परमेश्वर’ मानक और संदर्भानुकूल हिंदी है।
- source_word: אֶל נָתָן
  choice: नातान के पास
  rationale: אֶל संदेश के प्राप्तकर्ता की ओर दिशा व्यक्त करता है; इस प्रकाशन-सूत्र में ‘के पास’ स्वाभाविक हिंदी है।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह इब्रानी में आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में पद के अंत का द्विबिंदु यही कार्य स्वाभाविक रूप से करता है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: प्रकाशन-सूत्र דְּבַר אֱלֹהִים का अनुवाद
  choice: परमेश्वर का वचन
  alternative: परमेश्वर की ओर से एक वचन
  rationale: मुख्य पाठ औपचारिक प्रकाशन-सूत्र और उसके धार्मिक भार को बनाए रखता है, जबकि पादटिप्पणी रचना की वास्तविक वैकल्पिक व्याख्या को सुरक्षित रखती है।
