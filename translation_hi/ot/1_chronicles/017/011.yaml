id: 1CH.17.11
reference: 1 Chronicles 17:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֗ה כִּֽי מָלְא֤וּ יָמֶ֨י/ךָ֙ לָ/לֶ֣כֶת עִם אֲבֹתֶ֔י/ךָ וַ/הֲקִֽימוֹתִ֤י אֶֽת זַרְעֲ/ךָ֙ אַחֲרֶ֔י/ךָ אֲשֶׁ֥ר יִהְיֶ֖ה מִ/בָּנֶ֑י/ךָ וַ/הֲכִינוֹתִ֖י אֶת מַלְכוּתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/011.yaml
  text: And it shall be[a], when your days are fulfilled to go to be with your fathers, that I will raise up your offspring after you, who shall be one of your sons, and I will establish his kingdom.
translation:
  language: hi
  text: और ऐसा होगा कि जब तुम्हारे दिन पूरे हो जाएँ और तुम अपने पुरखाओं के पास चले जाओ[a], तब मैं तुम्हारे बाद तुम्हारे वंशज को खड़ा करूँगा, जो तुम्हारे पुत्रों में से एक होगा, और मैं उसका राज्य स्थिर करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पुरखाओं के साथ चले जाओ।” यह मृत्यु और अपने पूर्वजों से जा मिलने के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और ऐसा होगा कि जब
  rationale: यह भविष्य में होने वाली बात की ओर ले जाने वाला सूत्र है; כִּי यहाँ समयवाचक उपवाक्य आरम्भ करता है।
- source_word: מָלְאוּ יָמֶיךָ
  choice: तुम्हारे दिन पूरे हो जाएँ
  rationale: यह जीवनकाल पूरा होने का गरिमापूर्ण इब्रानी मुहावरा है और हिन्दी में भी स्वाभाविक है।
- source_word: לָלֶכֶת עִם אֲבֹתֶיךָ
  choice: अपने पुरखाओं के पास चले जाओ
  rationale: मूल का शाब्दिक रूप ‘पुरखाओं के साथ जाना’ है। ‘पुरखाओं के पास चले जाना’ मृत्यु और पूर्वजों से जा मिलने का आशय स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: וַהֲקִימוֹתִי
  choice: मैं ... खड़ा करूँगा
  rationale: हिफ़ील रूप यहाँ दाऊद के बाद एक उत्तराधिकारी को उठाने या सामने लाने का भाव देता है; इसे अगले क्रिया-पद ‘स्थिर करूँगा’ से अलग रखा गया है।
- source_word: זַרְעֲךָ
  choice: तुम्हारे वंशज को
  rationale: यहाँ זרע सामूहिक अथवा एकवचन वंश-संतान को सूचित कर सकता है, पर आगे एक पुत्र और ‘उसका राज्य’ आने से ‘वंशज’ प्रसंग में स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר יִהְיֶה מִבָּנֶיךָ
  choice: जो तुम्हारे पुत्रों में से एक होगा
  rationale: מִן का अंशवाचक अर्थ स्पष्ट रखते हुए यह बताता है कि प्रतिज्ञात वंशज दाऊद के अपने पुत्रों में से होगा।
- source_word: וַהֲכִינוֹתִי אֶת מַלְכוּתוֹ
  choice: मैं उसका राज्य स्थिर करूँगा
  rationale: הכין यहाँ राज्य को दृढ़, सुरक्षित और स्थापित करने का अर्थ देता है; ‘स्थिर’ इस वाचा-संबंधी भाव को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दाऊदी वंश की प्रतिज्ञा और उसका संभावित मसीही महत्व
  choice: मुख्य पाठ में दाऊद के पुत्रों में से आने वाले ऐतिहासिक उत्तराधिकारी का सीधा अर्थ रखा गया है।
  alternative: पद में स्पष्ट मसीही पदवी या बाद की धर्मवैज्ञानिक पहचान जोड़ना।
  rationale: मूल पाठ दाऊद के बाद उसके पुत्रों में से एक वंशज और उसके राज्य की स्थापना की बात करता है। व्यापक शास्त्रीय संदर्भ में इसके मसीही निहितार्थ हो सकते हैं, पर उन्हें इस पद के शब्दों में जोड़ना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज रखी गई है। ‘पुरखा’, ‘वंशज’, ‘राज्य’ और ‘स्थिर करना’ सामान्य पाठक के लिए स्पष्ट हैं और मूल की राजवंशीय भाषा को बनाए रखते हैं।
