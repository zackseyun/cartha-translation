reference: 1 Chronicles 17:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָה֙ אֵ֣ין כָּמ֔וֹ/ךָ וְ/אֵ֥ין אֱלֹהִ֖ים זוּלָתֶ֑/ךָ בְּ/כֹ֥ל אֲשֶׁר שָׁמַ֖עְנוּ בְּ/אָזְנֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/020.yaml
  text: O Yahweh[a], there is none like you, and there is no God besides you, in all that we have heard with our own ears.
translation:
  language: hi
  text: हे याहवे, आपके समान कोई नहीं है, और आपके सिवा कोई परमेश्वर नहीं है—हमने अपने कानों से जो कुछ सुना है, उसके अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप से व्यक्त किया गया है।
- source_word: אֵין כָּמוֹךָ
  choice: आपके समान कोई नहीं है
  rationale: अस्तित्व-निषेध और तुलना, दोनों को स्पष्ट रखते हुए यह स्वाभाविक तथा गरिमापूर्ण हिन्दी है। परमेश्वर को संबोधन होने के कारण आदरसूचक ‘आप’ अपनाया गया है।
- source_word: וְאֵין אֱלֹהִים זוּלָתֶךָ
  choice: और आपके सिवा कोई परमेश्वर नहीं है
  rationale: זוּלָתֶךָ के ‘सिवा/अलावा’ भाव और कथन के स्पष्ट एकेश्वरवादी बल, दोनों को बनाए रखता है।
- source_word: בְּכֹל אֲשֶׁר
  choice: जो कुछ … उसके अनुसार
  rationale: בְ यहाँ सुनी हुई समस्त गवाही को कथन का आधार या मानक बनाता है; हिन्दी में उपवाक्य को पहले रखने से अर्थ स्पष्ट और वाक्य स्वाभाविक रहता है।
- source_word: שָׁמַעְנוּ בְּאָזְנֵינוּ
  choice: हमने अपने ही कानों से जो कुछ सुना है
  rationale: पूर्ण क्रिया को वर्तमान तक संचित गवाही के रूप में व्यक्त किया गया है और ‘अपने ही कानों से’ मूल की देहगत, प्रत्यक्ष सुनवाई पर दी गई दृढ़ता को सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; इसलिए उसे केवल उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: וְאֵין אֱלֹהִים זוּלָתֶךָ में विशिष्टता का बल
  choice: आपके सिवा कोई परमेश्वर नहीं है
  alternative: आपको छोड़कर कोई देवता नहीं है; आपसे अलग कोई परमेश्वर नहीं है
  rationale: यह केवल अन्य देवताओं पर श्रेष्ठता नहीं, बल्कि किसी अन्य परमेश्वर के अस्तित्व का सीधा निषेध है। साथ ही पादटिप्पणी אֱלֹהִים और זוּלָתֶךָ की वैध वैकल्पिक अभिव्यक्तियाँ दिखाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली। इब्रानी का मूल क्रम अर्थ को अस्पष्ट या खंडित कर सकता था, इसलिए ‘हमने… उसके अनुसार’ उपवाक्य को आगे रखा गया है; आशय और समस्त गवाही का बल सुरक्षित है।
