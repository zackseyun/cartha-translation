id: 1CH.17.2
reference: 1 Chronicles 17:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר נָתָן֙ אֶל דָּוִ֔יד כֹּ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ עֲשֵׂ֑ה כִּ֥י הָ/אֱלֹהִ֖ים עִמָּֽ/ךְ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/002.yaml
  text: And Nathan said to David, “Do all that is in your heart, for God is with you.”
translation:
  language: hi
  text: तब नातान ने दाऊद से कहा, “जो कुछ तुम्हारे मन में है, वह करो, क्योंकि परमेश्वर तुम्हारे साथ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ स्वाभाविक रूप से घटनाक्रम व्यक्त करता है।
- source_word: נָתָן
  choice: नातान
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶל דָּוִיד
  choice: दाऊद से
  rationale: कहने की क्रिया के साथ हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक है; दाऊद प्रचलित हिन्दी रूप है।
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ
  rationale: यह आगामी विषय की संपूर्णता व्यक्त करता है और आधुनिक हिन्दी में सहज है।
- source_word: בִּלְבָבְךָ
  choice: तुम्हारे मन में है
  rationale: לֵבָב यहाँ भीतरी विचार, इच्छा या संकल्प को दर्शाता है। हिन्दी में ‘मन’ इस अर्थ को ‘हृदय’ से अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना आशय को केवल बुद्धि तक सीमित किए।
- source_word: עֲשֵׂה
  choice: वह करो
  rationale: עשה का सीधा आज्ञार्थक रूप है; ‘वह’ जोड़ने से पूर्ववर्ती ‘जो कुछ’ के साथ हिन्दी वाक्य पूरा और सहज बनता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ स्रोत में אֱלֹהִים है, YHWH नहीं। ‘परमेश्वर’ हिन्दी में इस ईश्वरीय पदनाम का प्रतिष्ठित और सहज समतुल्य है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ है
  rationale: यह दिव्य उपस्थिति और समर्थन का सीधा, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: הָאֱלֹהִים के लिए ईश्वरीय पदनाम
  choice: परमेश्वर
  alternative: यहोवा
  rationale: मूल पाठ אֱלֹהִים का प्रयोग करता है, न कि दिव्य नाम YHWH का; इसलिए ‘यहोवा’ लाना स्रोतगत भेद को मिटा देगा।
- issue: בִּלְבָבְךָ का मानव-अंतरंग संबंधी अर्थ
  choice: तुम्हारे मन में
  alternative: तुम्हारे हृदय में
  rationale: संदर्भ दाऊद के विचार/संकल्प का है। ‘मन’ आधुनिक हिन्दी में इस व्यापक आंतरिक इच्छा को सहज रूप से व्यक्त करता है; इसे किसी विशिष्ट doctrinal अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद की सीधाई तथा नातान के तत्काल समर्थन का भाव सुरक्षित है।
