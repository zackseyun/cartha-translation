  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יְהוָ֕ה בַּ/עֲב֤וּר עַבְדְּ/ךָ֙ וּֽ/כְ/לִבְּ/ךָ֔ עָשִׂ֕יתָ אֵ֥ת כָּל הַ/גְּדוּלָּ֖ה הַ/זֹּ֑את לְ/הֹדִ֖יעַ אֶת כָּל הַ/גְּדֻלּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/019.yaml
  text: O Yahweh[a], for the sake of your servant and according to your heart, you have done all this greatness[b], to make known all these great things.
translation:
  language: hi
  text: हे यहोवा, अपने दास के निमित्त और अपने मन के अनुसार आपने यह सारा महान कार्य[क] किया है, इन सभी महान कार्यों को ज्ञात कराने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: इब्रानी में पहले ‘यह सारी महानता’ एकवचन में है, और फिर ‘सभी महान कार्य’ बहुवचन में; एकवचन संभवतः सामूहिक रूप से प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בַּעֲבוּר עַבְדְּךָ
  choice: अपने दास के कारण
  rationale: यह पदबंध दास के संबंध में या उसके निमित्त किए गए कार्य की प्रेरणा/दृष्टि व्यक्त करता है; ‘के कारण’ स्रोत की संक्षिप्तता बनाए रखता है।
- source_word: וּכְלִבְּךָ
  choice: और अपने मन के अनुसार
  rationale: इब्रानी ‘हृदय’ इच्छा और अभिप्राय का केंद्र है; आधुनिक हिन्दी में परमेश्वर की आंतरिक इच्छा के लिए ‘मन’ अधिक सहज है और रूपक को भी बनाए रखता है।
- source_word: עָשִׂיתָ אֵת כָּל הַגְּדוּלָּה הַזֹּאת
  choice: आपने यह सारी महानता दिखाई है
  rationale: ‘करना’ का शाब्दिक रूप हिन्दी में ‘महानता करना’ अस्वाभाविक होता; ‘महानता दिखाई’ दैवी कार्य में प्रकट हुई महानता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְהֹדִיעַ
  choice: प्रकट करें
  rationale: हिफ़ील रूप का आशय ‘ज्ञात कराना’ है; वाक्य में कर्ता को लेकर स्रोत की असामान्यता बनाए रखने हेतु बहुवचन क्रिया के साथ ‘प्रकट करें’ रखा गया है।
- source_word: כָּל הַגְּדֻלּוֹת
  choice: ये सभी महान कार्य
  rationale: बहुवचन अमूर्त संज्ञा को हिन्दी में बोधगम्य ‘महान कार्य’ से व्यक्त किया गया है, जो महानता की अनेक अभिव्यक्तियों की ओर संकेत करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: विशिष्ट दैवी नाम को नाम के रूप में ही रखा गया है; हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है।
- issue: וּכְלִבְּךָ में मानवरूपी ‘हृदय’ भाषा
  choice: अपने मन के अनुसार
  alternative: अपने हृदय के अनुसार
  rationale: ‘मन’ आधुनिक हिन्दी में इच्छा और अभिप्राय दोनों को सहज रूप से व्यक्त करता है, बिना इसे किसी अधिक विशिष्ट धर्मवैज्ञानिक सिद्धांत में सीमित किए।
- issue: अंतिम खंड में ज्ञात कराने वाला कर्ता
  choice: ताकि ये सभी महान कार्य प्रकट करें
  alternative: ताकि आप ये सभी महान कार्य प्रकट करें
  rationale: मसोरेटी व्यंजन-पाठ का infinitive לְהוֹדִיעַ सामान्यतः ‘ज्ञात कराने के लिए’ है, पर उसके बाद प्रत्यक्ष कर्म चिह्न אֶת आने से ‘आप ... ज्ञात कराएँ’ स्वाभाविक समझ है। फिर भी उपलब्ध WLC स्वरांकन לְהֹדִיעַ और वाक्यगत तनाव को देखते हुए पाठ की असामान्यता को पूरी तरह समतल नहीं किया गया।
translation_notes:
  register: प्रार्थनापूर्ण, आदरपूर्ण आधुनिक मानक हिन्दी; परमेश्वर के लिए ‘आप’ का प्रयोग। वाक्य को सामान्य पाठक के लिए स्वाभाविक रखते हुए एकवचन ‘महानता’ और बहुवचन ‘महान कार्यों’ का स्रोतगत बदलाव सुरक्षित रखा गया है।
