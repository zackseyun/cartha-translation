source:
  edition: WLC
  text: בְּ/כֹ֥ל אֲשֶֽׁר הִתְהַלַּכְתִּי֮ בְּ/כָל יִשְׂרָאֵל֒ הֲ/דָבָ֣ר דִּבַּ֗רְתִּי אֶת אַחַד֙ שֹׁפְטֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֥ר צִוִּ֛יתִי לִ/רְע֥וֹת אֶת עַמִּ֖/י לֵ/אמֹ֑ר לָ֛/מָּה לֹא בְנִיתֶ֥ם לִ֖/י בֵּ֥ית אֲרָזִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/006.yaml
  text: In all the places where I have walked among all Israel[a], did I ever speak a word to one of the judges of Israel, whom I commanded to shepherd my people, saying, ‘Why have you not built for me a house of cedar?’
translation:
  language: hi
  text: सारे इस्राएल में जहाँ कहीं मैं चलता-फिरता रहा, क्या मैंने इस्राएल के न्यायियों[a] में से किसी एक से भी, जिसे मैंने अपनी प्रजा की चरवाही करने की आज्ञा दी थी, कभी एक बात भी कही, ‘तुम लोगों ने मेरे लिए देवदार का भवन क्यों नहीं बनाया?’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: समानांतर पद 2 शमूएल 7:7 में ‘इस्राएल के गोत्रों’ पढ़ा जाता है; कुछ पाठ-साक्ष्य ‘अगुओं’ या ‘राजदंडों’ को प्रतिबिंबित करते हैं। इतिहास की पुस्तक के इब्रानी पाठ में यहाँ ‘न्यायियों’ लिखा है।
    reason: textual_variant
lexical_decisions:
- source_word: הִתְהַלַּכְתִּי
  choice: चलता-फिरता रहा
  rationale: हित्पएल रूप यहाँ परमेश्वर के अपनी प्रजा के बीच निरंतर विचरण को व्यक्त करता है। यह अनुवाद गति के रूपक और उसकी पुनरावृत्त प्रकृति—दोनों को बनाए रखता है।
- source_word: בְּכָל יִשְׂרָאֵל
  choice: सारे इस्राएल के बीच
  rationale: पूर्ववर्ती गति-सूचक क्रिया के साथ यह वाक्यांश राष्ट्र के लोगों के बीच उपस्थिति और विचरण का भाव देता है, केवल भौगोलिक विस्तार का नहीं।
- source_word: הֲדָבָר דִּבַּרְתִּי
  choice: क्या मैंने ... कभी यह कहा
  rationale: प्रश्नवाचक रचना और धातु-संबंधी कर्म का बल हिन्दी में ‘कभी’ और ‘यह कहा’ से स्वाभाविक रूप में व्यक्त होता है; प्रश्न का अपेक्षित उत्तर ‘नहीं’ है।
- source_word: אֶת אַחַד שֹׁפְטֵי יִשְׂרָאֵל
  choice: इस्राएल के न्यायियों में से किसी एक से भी
  rationale: דבר के साथ אֶת संबोधित व्यक्ति को सूचित करता है। ‘किसी एक से भी’ मूल के אַחַד और आलंकारिक निषेध के बल को व्यक्त करता है।
- source_word: שֹׁפְטֵי יִשְׂרָאֵל
  choice: इस्राएल के न्यायियों
  rationale: इतिहास की इस पुस्तक के उपलब्ध इब्रानी पाठ में ‘न्यायी’ है; इसे समानांतर शमूएल-पाठ के ‘गोत्रों’ के अनुसार नहीं बदला गया है।
- source_word: צִוִּיתִי לִרְעוֹת
  choice: चरवाही करने की आज्ञा दी थी
  rationale: רעה का चरवाहे वाला रूपक शासन, देखभाल और मार्गदर्शन को समेटता है। ‘चरवाही करना’ इस रूपक को स्पष्ट और परिचित हिन्दी में सुरक्षित रखता है।
- source_word: עַמִּי
  choice: अपनी प्रजा
  rationale: यह परमेश्वर और इस्राएल के वाचा-संबंध को व्यक्त करने वाला सामान्य पद है; हिन्दी में वक्ता के संदर्भ में ‘अपनी प्रजा’ स्वाभाविक है।
- source_word: לָמָּה לֹא בְנִיתֶם לִי
  choice: तुम लोगों ने मेरे लिए ... क्यों नहीं बनाया
  rationale: इब्रानी क्रिया बहुवचन है, इसलिए एक न्यायी के उल्लेख के बाद भी ‘तुम लोगों ने’ रखा गया है; इस व्याकरणिक तनाव को एकवचन बनाकर मिटाया नहीं गया।
- source_word: בֵּית אֲרָזִים
  choice: देवदार का भवन
  rationale: यह देवदार की लकड़ी से बने स्थायी भवन को सूचित करता है। ‘भवन’ गरिमापूर्ण है और संदर्भ में परमेश्वर के निवास-स्थान के लिए स्वाभाविक है।
theological_decisions:
- issue: इतिहास में ‘न्यायियों’ और 2 शमूएल 7:7 के समानांतर पाठ में ‘गोत्रों’ का अंतर
  choice: मुख्य पाठ में इतिहास के मसोरेटिक इब्रानी पाठ के अनुसार ‘इस्राएल के न्यायियों’ का अनुवाद
  alternative: 2 शमूएल 7:7 के अनुसार ‘इस्राएल के गोत्रों’ या कुछ पाठ-साक्ष्यों के आधार पर ‘अगुओं’ का अनुवाद
  rationale: मूल-पाठ की प्राथमिकता के कारण इतिहास के विद्यमान इब्रानी शब्द को मुख्य पाठ में रखा गया है। समानांतर पाठ का अंतर पाठालोचनात्मक टिप्पणी में बताया गया है, उसे चुपचाप सामंजस्यपूर्ण नहीं बनाया गया।
- issue: एक न्यायी को संबोधन और उद्धरण में बहुवचन क्रिया
  choice: उद्धरण में ‘तुम लोगों ने’ रखकर इब्रानी बहुवचन को सुरक्षित रखना
  alternative: संदर्भ के अनुसार एकवचन ‘तुमने’ करना
  rationale: इब्रानी בְנִיתֶם स्पष्ट रूप से बहुवचन है। सम्भव है कि प्रतिनिधि न्यायी के माध्यम से व्यापक नेतृत्व संबोधित हो, पर अनुवाद इस व्याख्या को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘चलता-फिरता रहा’ और ‘चरवाही’ मूल के रूपकों को बचाते हैं। ‘देवदार का भवन’ धार्मिक संदर्भ के योग्य है, पर ‘मन्दिर’ जोड़कर पाठ की भावी परिणति को पहले से स्पष्ट नहीं करता।
