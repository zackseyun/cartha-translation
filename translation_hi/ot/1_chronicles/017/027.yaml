source:
  edition: WLC
  text: וְ/עַתָּ֗ה הוֹאַ֨לְתָּ֙ לְ/בָרֵךְ֙ אֶת בֵּ֣ית עַבְדְּ/ךָ֔ לִ/הְי֥וֹת לְ/עוֹלָ֖ם לְ/פָנֶ֑י/ךָ כִּֽי אַתָּ֤ה יְהוָה֙ בֵּרַ֔כְתָּ וּ/מְבֹרָ֖ךְ לְ/עוֹלָֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/027.yaml
  text: And now[a], you have been pleased to bless the house of your servant, that it may be before you forever; for you, O Yahweh, have blessed it[c][b], and it is blessed forever.
translation:
  language: hi
  text: और अब आपने अपने दास के घराने[b] को आशीष देने की कृपा की है[a], कि वह सदा आपके सामने रहे; क्योंकि हे याहवे, आपने उसे आशीष दी है, और वह सदा आशीषित है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘आपने आशीष देने का निश्चय किया है’ अथवा ‘आप आशीष देने के लिए सहमत हुए हैं।’
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘घराना’ से आशय केवल निवास-स्थान नहीं, बल्कि दास का परिवार और राजवंश भी है।
    reason: cultural_note
  - marker: c
    text: या, ‘और वह सदा आशीषित रहे।’ इब्रानी को कुछ लोग इच्छा के रूप में समझते हैं, यद्यपि उसका रूप अधिक स्वाभाविक रूप से स्थायी आशीष की घोषणा है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और कालवाचक עַתָּה दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הוֹאַלְתָּ
  choice: आपने ... स्वीकार किया है
  rationale: यह क्रिया इच्छा, कृपापूर्वक सहमति या किसी कार्य को करने की तत्परता व्यक्त कर सकती है; प्रार्थना के प्रसंग में यह सहज और गरिमापूर्ण है।
- source_word: לְבָרֵךְ
  choice: आशीष देना
  rationale: क्रिया का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: בֵּית עַבְדְּךָ
  choice: अपने दास के घराने
  rationale: इस दाऊदी प्रसंग में בַּיִת केवल भवन नहीं, बल्कि परिवार और राजवंश को सूचित करता है; ‘घराना’ हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִהְיוֹת לְעוֹלָם לְפָנֶיךָ
  choice: ताकि वह सदा आपके सामने बना रहे
  rationale: उद्देश्य/परिणाम और परमेश्वर के सम्मुख स्थायी बने रहने—दोनों भावों को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पिछले कथन का आधार प्रस्तुत करने वाले संबंध को स्पष्ट और स्वाभाविक ढंग से दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप द्वारा मूल पाठ के व्यक्तिगत दिव्य नाम को शीर्षक से बदले बिना रखा गया है।
- source_word: בֵּרַכְתָּ
  choice: आपने उसे आशीष दी है
  rationale: पूर्ण क्रिया के संपन्न कार्य और उसके वर्तमान परिणाम दोनों को हिन्दी में व्यक्त करता है।
- source_word: וּמְבֹרָךְ לְעוֹלָם
  choice: और वह सदा आशीषित रहेगा
  rationale: निष्क्रिय कृदंत की स्थायी, परिणामसूचक अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है; इच्छासूचक अर्थ को मुख्य पाठ में आरोपित नहीं करता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत दिव्य नाम स्पष्ट रखा गया है। ‘यहोवा’ आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला बाइबलीय रूप है; इसे ‘प्रभु’ जैसे शीर्षक से नहीं बदला गया।
- issue: अंतिम वाक्यांश וּמְבֹרָךְ לְעוֹלָם का भाव
  choice: परिणामसूचक/घोषणात्मक—‘वह सदा आशीषित रहेगा’
  alternative: इच्छासूचक—‘वह सदा आशीषित रहे’
  rationale: मूल में निष्क्रिय कृदंत है, स्पष्ट आज्ञार्थक या इच्छार्थक रूप नहीं। अतः परमेश्वर की दी हुई आशीष से उत्पन्न स्थायी अवस्था मुख्य पाठ में रखी गई, जबकि संभव इच्छासूचक पाठ फुटनोट में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरसूचक ‘आप’ का प्रयोग किया गया है। भाषा प्रार्थनामय और गरिमापूर्ण है, पर सामान्य पाठक के लिए सहज रखी गई है। ‘घराना’ राजवंशीय अर्थ को स्पष्ट करता है और ‘आपके सामने बना रहे’ मूल की वाचिक तथा वाचा-संबंधी व्यापकता को सुरक्षित रखता है।
