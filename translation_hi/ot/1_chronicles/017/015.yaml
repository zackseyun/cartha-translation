  language: hi
  text: इन सभी वचनों के अनुसार और इस पूरे दर्शन[a] के अनुसार, नातान ने दाऊद से वैसा ही कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस पूरे प्रकाशन”; इब्रानी शब्द חָזוֹן भविष्यद्वक्ताई दर्शन या परमेश्वर से मिले प्रकाशन को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּכֹל ... וּכְכֹל
  choice: इन सभी ... के अनुसार और इस पूरे ... के अनुसार
  rationale: दोहराए गए इब्रानी अनुरूपतासूचक ढाँचे को बनाए रखा गया है; हिन्दी में ‘के अनुसार’ स्वाभाविक और औपचारिक दोनों है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: इन सभी वचनों
  rationale: संदर्भ में नातान को मिला परमेश्वर का मौखिक संदेश है; ‘वचन’ दְּבָרִים के कथित शब्दों के अर्थ को स्पष्ट रखता है, यद्यपि इसका अर्थ ‘बातें’ भी हो सकता है।
- source_word: הֶחָזוֹן הַזֶּה
  choice: इस पूरे दर्शन
  rationale: חָזוֹן भविष्यद्वक्ताई दर्शन अथवा प्रकाशन को सूचित करता है। ‘दर्शन’ सीधा और प्रचलित हिन्दी प्रतिरूप है; כֹל को हिन्दी में ‘पूरे’ से व्यक्त किया गया है।
- source_word: כֵּן
  choice: वैसा ही
  rationale: यह पहले बताए गए वचनों और दर्शन के साथ नातान के कथन की सटीक अनुरूपता दर्शाता है।
- source_word: דִּבֶּר נָתָן אֶל דָּוִיד
  choice: नातान ने दाऊद से ... कहा
  rationale: हिन्दी में प्रत्यक्ष कथन के आशय के साथ ‘से कहा’ स्वाभाविक है और אֶל की संबोधन-दिशा को व्यक्त करता है।
