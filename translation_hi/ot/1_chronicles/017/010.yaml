source:
  edition: WLC
  text: וּ/לְ/מִ/יָּמִ֗ים אֲשֶׁ֨ר צִוִּ֤יתִי שֹֽׁפְטִים֙ עַל עַמִּ֣/י יִשְׂרָאֵ֔ל וְ/הִכְנַ֖עְתִּי אֶת כָּל אוֹיְבֶ֑י/ךָ וָ/אַגִּ֣ד לָ֔/ךְ וּ/בַ֖יִת יִֽבְנֶה לְּ/ךָ֥ יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/010.yaml
  text: from the days when I appointed judges over my people Israel. And I will subdue all your enemies. Moreover[a], I tell you that Yahweh will build you a house.
translation:
  language: hi
  text: उन दिनों से जब मैंने अपनी प्रजा इस्राएल के ऊपर न्यायी नियुक्त किए थे। मैं तुम्हारे सभी शत्रुओं को अधीन कर दूँगा। और मैं तुम्हें बताता हूँ कि यहोवा तुम्हारे लिए एक घर बनाएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “घर” का अभिप्राय राजघराना या राजवंश भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְמִיָּמִים
  choice: उन दिनों से
  rationale: संयुक्त पूर्वसर्गीय पद का स्वाभाविक कालवाचक अर्थ रखा गया है; यह पिछले संदर्भ से आगे की बात जोड़ता है।
- source_word: אֲשֶׁר צִוִּיתִי שֹׁפְטִים
  choice: जब मैंने ... न्यायियों को नियुक्त किया था
  rationale: यहाँ צוה न्यायियों को आदेश देने के बजाय उन्हें इस्राएल पर पदस्थ करने या नियुक्त करने का भाव देता है।
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल पर
  rationale: עַל अधिकार के संबंध को व्यक्त करता है; 'अपनी प्रजा इस्राएल' वाचा-संबंधी स्वामित्व को बनाए रखता है।
- source_word: וְהִכְנַעְתִּי
  choice: मैं ... दबा दूँगा
  rationale: प्रतिज्ञा के क्रम में पूर्ण रूप का भावी बल है; शत्रुओं के संदर्भ में 'दबा दूँगा' सहज और सटीक है।
- source_word: אֶת כָּל אֹיְבֶיךָ
  choice: तुम्हारे सभी शत्रुओं को
  rationale: כָּל की समग्रता को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: וָאַגִּד לָךְ
  choice: और मैं तुम्हें बताता हूँ
  rationale: नגד यहाँ गंभीर ईश्वरीय घोषणा करता है; वर्तमानकालीन कथन घोषणा के क्रियात्मक बल को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּבַיִת יִבְנֶה לְּךָ יְהוָה
  choice: यहोवा तुम्हारे लिए एक घर बनाएगा
  rationale: בַּיִת को 'घर' रखकर भवन और राजवंश के बीच अभिप्रेत शब्द-क्रीड़ा तथा अर्थगत तनाव सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: '''घर'' का अर्थ'
  choice: मुख्य पाठ में 'घर' बनाए रखना
  alternative: '''यहोवा तुम्हारे लिए एक राजवंश स्थापित करेगा'''
  rationale: इब्रानी בַּיִת व्यापक दाऊदी वाचा के संदर्भ में भवन और राजघराने/राजवंश दोनों की ओर संकेत करता है। मुख्य पाठ में 'घर' रखने से साहित्यिक शब्द-क्रीड़ा और धर्मवैचारिक तनाव बिना समयपूर्व व्याख्या के सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। 'न्यायियों', 'प्रजा', और 'यहोवा' जैसे बाइबलीय शब्द रखते हुए वाक्य-विन्यास को सामान्य पाठकों के लिए स्वाभाविक बनाया गया है।
