reference: 1 Chronicles 17:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה הַ/דָּבָ֗ר אֲשֶׁ֨ר דִּבַּ֤רְתָּ עַֽל עַבְדְּ/ךָ֙ וְ/עַל בֵּית֔/וֹ יֵאָמֵ֖ן עַד עוֹלָ֑ם וַ/עֲשֵׂ֖ה כַּ/אֲשֶׁ֥ר דִּבַּֽרְתָּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/023.yaml
  text: And now[a], Yahweh, let the word that you have spoken concerning your servant and concerning his house be established forever, and do as you have spoken.
translation:
  language: hi
  text: और अब, हे याहवे, जो वचन तूने अपने सेवक और उसके घराने[a] के विषय में कहा है, वह सदा के लिए स्थिर हो जाए; और जैसा तूने कहा है, वैसा ही कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके राजवंश’ अथवा ‘उसकी वंश-परंपरा’। इस वाचा के संदर्भ में इब्रानी शब्द ‘घर’ परिवार, वंश-परंपरा या राजकीय वंश को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण को रखते हुए यह पिछले स्तुतिपरक कथन से वर्तमान विनती की ओर स्वाभाविक संक्रमण दिखाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: संदर्भ में यह प्रतिज्ञा है, पर ‘वचन’ मूल शब्द और आगे के ‘कहा है’ के बीच संबंध बनाए रखता है।
- source_word: עַל עַבְדְּךָ וְעַל בֵּיתוֹ
  choice: अपने सेवक और उसके घराने के विषय में
  rationale: עַל यहाँ कथन के विषय को दर्शाता है। בַּיִת का ‘घराना’ अनुवाद हिन्दी में परिवार और राजवंश, दोनों की व्यापकता को रहने देता है।
- source_word: יֵאָמֵן
  choice: स्थिर हो जाए
  rationale: अमन धातु का निफ़अल रूप यहाँ वचन के दृढ़, प्रमाणित और कायम होने की विनती व्यक्त करता है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह स्थायी निरंतरता का स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी रूप है।
- source_word: וַעֲשֵׂה כַּאֲשֶׁר דִּבַּרְתָּ
  choice: और जैसा तूने कहा है, वैसा ही कर
  rationale: यह परमेश्वर से अपने कहे के अनुसार कार्य करने की सीधी विनती है और मूल की समानांतर रचना को स्वाभाविक हिन्दी में बनाए रखती है।
theological_decisions:
- issue: दाऊद की वाचा के संदर्भ में בֵּיתוֹ का अर्थ
  choice: मुख्य पाठ में ‘उसके घराने’ रखा गया है।
  alternative: उसका राजवंश; उसकी वंश-परंपरा; उसका घर
  rationale: इस संदर्भ में शब्द दाऊद के परिवार और राजकीय वंश तक विस्तृत है। ‘घराना’ हिन्दी में इस वाचागत व्यापकता को बिना केवल भवन या केवल राजवंश तक सीमित किए व्यक्त करता है; पादटिप्पणी अन्य संभव अर्थ स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनापरक, गरिमापूर्ण शैली रखी गई है। परमेश्वर को संबोधित करते हुए निकट और गंभीर ‘तू’ रूप अपनाया गया है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिसकी अर्थ-व्याप्ति वह समझाती है।
