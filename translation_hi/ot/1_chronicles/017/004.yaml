base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/004.yaml
  text: 'Go and say to David my servant[b][a], ‘Thus says Yahweh: You shall not build for me the house to dwell in.’'
translation:
  language: hi
  text: 'जा और मेरे सेवक दाऊद से कह, ‘याहवे यों कहता है: मेरे निवास के लिए उस भवन को बनानेवाला तू नहीं है[a][b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “तू मेरे निवास के लिए उस भवन को नहीं बनाएगा।” इब्रानी में “तू” पर विशेष बल है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह भवन जिसे याहवे का निवासस्थान होना था—मंदिर।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֵךְ וְאָמַרְתָּ
  choice: जा और ... से कह
  rationale: दोनों क्रियाएँ आदेश की क्रमिक शृंखला बनाती हैं; एकवचन रूप नातान को सीधे संबोधित करता है।
- source_word: דָּוִיד עַבְדִּי
  choice: मेरे सेवक दाऊद
  rationale: עֶבֶד यहाँ दाऊद की याहवे के अधीन नियुक्त सेवा और वाचा-संबंधी भूमिका बताता है; ‘सेवक’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: כֹּה אָמַר יְהוָה
  choice: याहवे यों कहता है
  rationale: यह भविष्यद्वक्ताओं का प्रामाणिक संदेश-सूत्र है; ‘यों कहता है’ उसकी औपचारिकता बनाए रखता है और יְהוָה को उसके नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: לֹא אַתָּה תִּבְנֶה
  choice: बनानेवाला तू नहीं है
  rationale: अलग से आए אַתָּה पर बल है। यह रूप केवल निषेध के बजाय इस बात को प्रमुख करता है कि नियुक्त निर्माता दाऊद नहीं है।
- source_word: לִּי הַבַּיִת לָשָׁבֶת
  choice: मेरे निवास के लिए वह भवन
  rationale: ‘भवन’ בית के मूल अर्थ को बनाए रखता है, जबकि ‘मेरे निवास के लिए’ उद्देश्यसूचक לָשָׁבֶת और לִּי के आशय को स्वाभाविक हिन्दी में व्यक्त करता है। निश्चितता-सूचक הַ को ‘वह’ से दर्शाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है; उसका लिप्यंतरण नाम और उपाधि के अंतर को सुरक्षित रखता है।
- issue: לֹא אַתָּה में दाऊद पर बल
  choice: बनानेवाला तू नहीं है
  alternative: तू ... न बनाएगा
  rationale: व्यक्तिवाचक सर्वनाम अनिवार्य न होते हुए भी स्पष्ट रूप से लिखा गया है, इसलिए दाऊद और भावी निर्माता के बीच निहित विरोध को मुख्य पाठ में बनाए रखा गया है।
- issue: הַבַּיִת को मंदिर कहना या भवन
  choice: वह भवन
  alternative: मंदिर
  rationale: प्रसंग में इससे मंदिर अभिप्रेत है, पर मूल शब्द सामान्यतः ‘घर/भवन’ है। मुख्य पाठ स्रोत की अभिव्यक्ति रखता है और स्पष्टार्थ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘जा’, ‘कह’ और ‘तू’ एकवचन संबोधन के परस्पर अनुरूप हैं। ‘बनानेवाला तू नहीं है’ इब्रानी की चिह्नित शब्द-रचना और उसके बल को स्वाभाविक हिन्दी में सुरक्षित रखता है।
