  text: כִּ֣י אַתָּ֣ה אֱלֹהַ֗/י גָּלִ֨יתָ֙ אֶת אֹ֣זֶן עַבְדְּ/ךָ֔ לִ/בְנ֥וֹת ל֖/וֹ בָּ֑יִת עַל כֵּן֙ מָצָ֣א עַבְדְּ/ךָ֔ לְ/הִתְפַּלֵּ֖ל לְ/פָנֶֽי/ךָ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/025.yaml
  text: For you[a], my God, have revealed to your servant that you will build him a house[b]; therefore your servant has found courage to pray before you.
translation:
  language: hi
  text: क्योंकि हे मेरे परमेश्वर, तूने अपने दास को प्रकट किया है[a] कि तू उसके लिए एक घर बनाएगा[b]; इस कारण तेरे दास ने तेरे सामने प्रार्थना करने का साहस पाया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “तूने अपने दास का कान खोल दिया है”; यह किसी बात को प्रकट करने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके लिए एक राजवंश स्थापित करेगा”; यहाँ “घर” का अर्थ घराना और स्थायी राजकीय वंश भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: גָּלִיתָ אֶת אֹזֶן עַבְדְּךָ
  choice: तूने अपने दास पर प्रकट किया है
  rationale: शाब्दिक अर्थ ‘अपने दास का कान खोल दिया’ है, पर यह बताने या प्रकट करने का इब्रानी मुहावरा है। स्वाभाविक हिन्दी में अर्थ स्पष्ट रखा गया है और शाब्दिक चित्र पादटिप्पणी में दिया गया है।
- source_word: לִבְנוֹת לוֹ בָּיִת
  choice: कि तू उसके लिए एक घर बनाएगा
  rationale: प्रकाशित बात की विषय-वस्तु को भविष्याभिमुख प्रतिज्ञा के रूप में व्यक्त करता है। ‘घर’ रखने से भौतिक घर और राजवंश—दोनों की अर्थ-संभावना बनी रहती है।
- source_word: בָּיִת
  choice: घर
  rationale: मूल इब्रानी रूपक को बनाए रखता है और दाऊदी सन्दर्भ में गृह तथा स्थायी राजवंश के स्तरित अर्थ को अनावश्यक रूप से एक ही अर्थ में सीमित नहीं करता।
- source_word: מָצָא ... לְהִתְפַּלֵּל
  choice: प्रार्थना करने का साहस पाया है
  rationale: शाब्दिक ‘प्रार्थना करने को पाया’ हिन्दी में अस्पष्ट होगा; प्रसंग में यह प्रार्थना करने का साहस या हियाव मिलने का भाव देता है।
- source_word: לְפָנֶיךָ
  choice: तेरे सामने
  rationale: प्रार्थना के सम्बन्धपरक और भक्तिपूर्ण परिवेश में यह वाक्यांश का सहज तथा निकट अनुवाद है।
- source_word: עַבְדְּךָ
  choice: तेरा दास
  rationale: राजकीय प्रार्थना में यह परमेश्वर के प्रति अधीनता और विनम्र आत्म-संबोधन है; ‘दास’ हिन्दी बाइबलीय गरिमा और मूल अर्थ दोनों को बनाए रखता है।
theological_decisions:
- issue: दाऊदी प्रतिज्ञा में ‘घर’ का अर्थ
  choice: मुख्य पाठ में ‘घर’ रखा गया है और राजवंशीय अर्थ को निहित रहने दिया गया है।
  alternative: इसे स्पष्ट रूप से ‘राजवंश’ अनुवाद करना।
  rationale: इस प्रसंग में इब्रानी शब्द में घराने और स्थायी राजकीय वंश की स्तरित अर्थ-संभावना है। ‘घर’ मूल बिम्ब और वास्तविक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। दाऊद द्वारा परमेश्वर को सीधे संबोधित करने के अनुरूप एकवचन निकट संबोधन ‘तू/तेरा’ प्रयुक्त हुआ है; भाषा साधारण पाठकों के लिए स्पष्ट है और ‘घर’ की मूल अर्थ-बहुलता सुरक्षित है।
