source:
  edition: WLC
  text: כִּ֣י לֹ֤א יָשַׁ֨בְתִּי֙ בְּ/בַ֔יִת מִן הַ/יּ֗וֹם אֲשֶׁ֤ר הֶעֱלֵ֨יתִי֙ אֶת יִשְׂרָאֵ֔ל עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה וָֽ/אֶהְיֶ֛ה מֵ/אֹ֥הֶל אֶל אֹ֖הֶל וּ/מִ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/005.yaml
  text: For I have not lived in a house from the day that I brought up Israel to this day[a], but I have gone from tent to tent and from dwelling place to dwelling place.
translation:
  language: hi
  text: क्योंकि जिस दिन मैं इस्राएल को ऊपर ले आया, उस दिन से आज तक मैं किसी घर में नहीं रहा; बल्कि मैं तंबू से तंबू और निवास-स्थान से निवास-स्थान में रहा हूँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं एक तंबू से दूसरे तंबू और एक निवास-स्थान से दूसरे निवास-स्थान जाता रहा हूँ।”
    reason: हिब्रू वָאֶהְיֶה का मूल अर्थ ‘मैं रहा/था’ है। आगे के स्थानसूचक पदों के आधार पर निरंतर स्थान बदलते रहने का गतिशील अनुवाद भी सम्भव है।
lexical_decisions:
- source_word: יָשַׁבְתִּי
  choice: मैं ... नहीं रहा
  rationale: स्थान के साथ יָשַׁב का सामान्य अर्थ ‘रहना/निवास करना’ है। ‘नहीं रहा’ आधुनिक हिन्दी में स्वाभाविक है और यहाँ शाब्दिक ‘नहीं बैठा’ से अधिक सटीक है।
- source_word: בְּבַיִת
  choice: किसी भवन में
  rationale: בַּיִת यहाँ किसी स्थायी घर या इमारत को सूचित करता है। ‘भवन’ चलायमान तंबू के साथ विरोध को स्पष्ट रखता है, जबकि ‘मन्दिर’ कहना मूल से अधिक विशिष्ट होता।
- source_word: הֶעֱלֵיתִי אֶת יִשְׂרָאֵל
  choice: मैं इस्राएल को ऊपर लाया
  rationale: हिफ़ील रूप में עלה का अर्थ ‘ऊपर लाना’ है। यह अनुवाद मूल बिंब और परमेश्वर की कर्तृता बनाए रखता है तथा मूल में अनकहे ‘मिस्र से’ को मुख्य पाठ में नहीं जोड़ता।
- source_word: וָאֶהְיֶה
  choice: मैं ... जाता रहा हूँ
  rationale: क्रिया का मूल अर्थ ‘मैं रहा/होता रहा’ है, पर आगे के ‘एक तंबू से दूसरे’ गतिशील वाक्यांश के साथ हिन्दी में निरन्तर स्थानांतरण व्यक्त करने के लिए ‘जाता रहा हूँ’ स्वाभाविक है। अधिक रूपात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מֵאֹהֶל אֶל אֹהֶל
  choice: एक तंबू से दूसरे तंबू
  rationale: यह अभिव्यक्ति अस्थायी तंबू-स्थानों के बीच जाने को दर्शाती है। हिन्दी में यह रूप स्पष्ट, स्वाभाविक और पुनरुक्ति के भाव के अनुरूप है।
- source_word: וּמִמִּשְׁכָּן
  choice: और एक निवास-स्थान से दूसरे निवास-स्थान
  rationale: מִשְׁכָּן का अर्थ ‘निवास-स्थान’ या पवित्र ‘मिलापवाला तंबू’ हो सकता है। मुख्य पाठ में ‘निवास-स्थान’ शब्दार्थ की व्यापकता बचाता है; समानांतर रचना के लिए दूसरा पद हिन्दी में स्पष्ट किया गया है।
theological_decisions:
- issue: पवित्रस्थान-संबंधी शब्दावली में बाद की मन्दिर-धारणा न जोड़ना
  choice: בַּיִת के लिए ‘भवन’ और מִשְׁכָּן के लिए ‘निवास-स्थान’
  alternative: ‘मन्दिर’ और तकनीकी अर्थ में ‘पवित्र तंबू’
  rationale: पद स्थायी भवन और चलायमान तंबू-निवास के बीच विरोध प्रस्तुत करता है। ‘मन्दिर’ मूल में स्पष्ट न होने वाली बाद की विशिष्टता जोड़ देता; ‘निवास-स्थान’ शब्द की वास्तविक अर्थ-सीमा को खुला रखता है।
- issue: וָאֶהְיֶה में अवस्था और गति के बीच तनाव
  choice: मुख्य पाठ में ‘जाता रहा हूँ’
  alternative: ‘रहा हूँ’
  rationale: हिब्रू क्रिया रूपात्मक रूप से ‘रहा’ है, पर ‘तंबू से तंबू’ के साथ गति निहित है। मुख्य पाठ स्वाभाविक हिन्दी में यह गति व्यक्त करता है और पादटिप्पणी अधिक औपचारिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज रखी गई है। ‘मन्दिर’ जैसी अत्यधिक विशिष्ट धार्मिक शब्दावली से बचते हुए मूल के स्थायी भवन और चलायमान निवास के विरोध को बनाए रखा गया है।
