source:
  edition: WLC
  text: וְ֠/יֵֽאָמֵן וְ/יִגְדַּ֨ל שִׁמְ/ךָ֤ עַד עוֹלָם֙ לֵ/אמֹ֔ר יְהוָ֤ה צְבָאוֹת֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֱלֹהִ֖ים לְ/יִשְׂרָאֵ֑ל וּ/בֵית דָּוִ֥יד עַבְדְּ/ךָ֖ נָכ֥וֹן לְ/פָנֶֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/024.yaml
  text: May it be established[a], and may your name be magnified forever, saying, ‘Yahweh of hosts, the God of Israel[b], is God to Israel,’ and may the house of David your servant be established before you.
translation:
  language: hi
  text: 'यह बात दृढ़ हो[a], और आपका नाम सदा महान ठहरे: “सेनाओं के याहवे, इस्राएल के परमेश्वर, इस्राएल के लिए परमेश्वर हैं”; और आपके सेवक दाऊद का घराना[b] आपके सामने दृढ़ बना रहे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आपकी प्रतिज्ञा दृढ़ हो।” इब्रानी में कर्ता स्पष्ट नहीं है; प्रसंग में इसका संकेत परमेश्वर की पहले कही हुई बात या प्रतिज्ञा की ओर है।
    reason: textual_ambiguity
  - marker: b
    text: यहाँ “घराना” से आशय दाऊद का राजघराना या राजवंश है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיֵאָמֵן
  choice: यह बात दृढ़ हो
  rationale: निफ़अल रूप यहाँ प्रार्थनात्मक इच्छा व्यक्त करता है कि पहले कही गई प्रतिज्ञा प्रमाणित और अटल हो। निहित कर्ता को स्वाभाविक हिन्दी में ‘यह बात’ से व्यक्त किया गया है।
- source_word: וְיִגְדַּל שִׁמְךָ עַד עוֹלָם
  choice: आपका नाम सदा महान माना जाए
  rationale: גדל का भाव परमेश्वर के नाम की महिमा और प्रतिष्ठा बढ़ने का है; ‘महान माना जाए’ वर्तमान हिन्दी में सम्मानसूचक अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: לֵאמֹר
  choice: ताकि लोग कहें
  rationale: यह आगे आने वाली सार्वजनिक उद्घोषणा का परिचय देता है; हिन्दी में केवल ‘कहते हुए’ अस्पष्ट होता, इसलिए निहित मानवीय वक्ताओं को सामान्य रूप में व्यक्त किया गया है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: व्यक्तिगत दिव्य नाम को ‘यहोवा’ और צְבָאוֹת को व्यापक पारंपरिक अर्थ में ‘सेनाओं’ से प्रस्तुत किया गया है।
- source_word: אֱלֹהִים לְיִשְׂרָאֵל
  choice: इस्राएल के लिए परमेश्वर हैं
  rationale: לְ के संबंधपरक/हितकारी बल को ‘के लिए’ से रखा गया है, उसे केवल स्वामित्वसूचक ‘इस्राएल के परमेश्वर’ में नहीं मिला दिया गया।
- source_word: וּבֵית דָּוִיד עַבְדְּךָ
  choice: आपके सेवक दाऊद का घराना
  rationale: בַּיִת यहाँ दाऊद के राजवंश का सूचक है; ‘घराना’ वंशगत अर्थ को सामान्य हिन्दी में स्पष्ट रखता है।
- source_word: נָכוֹן לְפָנֶיךָ
  choice: आपके सामने दृढ़ बना रहे
  rationale: נכון स्थिर और स्थापित रहने की अवस्था बताता है, और לְפָנֶיךָ को संबंधपरक रूप से ‘आपके सामने’ रखा गया है।
theological_decisions:
- issue: יְהוָה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से रखा गया है।
- issue: प्रार्थना में क्रियाओं का बल
  choice: 'इच्छार्थक: ‘दृढ़ हो’, ‘महान माना जाए’, ‘दृढ़ बना रहे’'
  alternative: 'भविष्यसूचक: ‘दृढ़ होगी’, ‘महान होगा’'
  rationale: दाऊद की प्रार्थना के प्रसंग में ये रूप निवेदन और अभिलाषा व्यक्त करते हैं, केवल भविष्यवाणी नहीं।
- issue: אֱלֹהִים לְיִשְׂרָאֵל का संबंध
  choice: इस्राएल के लिए परमेश्वर
  alternative: इस्राएल के परमेश्वर
  rationale: यह विकल्प לְיִשְׂרָאֵל की वास्तविक संबंधपरक अस्पष्टता और वाचा-संबंधी दिशा को बनाए रखता है, जबकि सहज स्वामित्वसूचक अर्थ को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, आदरसूचक और गरिमापूर्ण हिन्दी; परमेश्वर के लिए ‘आप’ का प्रयोग। वाक्य की प्रार्थनात्मक लय तथा मूल के दो समान ‘दृढ़’ भाव सुरक्षित रखे गए हैं।
