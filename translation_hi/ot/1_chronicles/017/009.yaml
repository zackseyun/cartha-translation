  edition: WLC
  text: וְ/שַׂמְתִּ֣י מָ֠קוֹם לְ/עַמִּ֨/י יִשְׂרָאֵ֤ל וּ/נְטַעְתִּ֨י/הוּ֙ וְ/שָׁכַ֣ן תַּחְתָּ֔י/ו וְ/לֹ֥א יִרְגַּ֖ז ע֑וֹד וְ/לֹא יוֹסִ֤יפוּ בְנֵי עַוְלָה֙ לְ/בַלֹּת֔/וֹ כַּ/אֲשֶׁ֖ר בָּ/רִאשׁוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/009.yaml
  text: And I will appoint a place for my people Israel and will plant them[a], and they will dwell in their own place and be disturbed no more. And the sons of wickedness will no longer wear them down, as at the first[b],
translation:
  language: hi
  text: और मैं अपनी प्रजा इस्राएल के लिए एक स्थान ठहराऊँगा और उन्हें वहाँ रोपूँगा। वे अपने स्थान पर बसेंगे और फिर कभी अशांत नहीं होंगे। दुष्ट लोग[a] उन्हें पहले की तरह[b] फिर नहीं सताएँगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “दुष्टता के पुत्र।”'
    reason: हिब्रू मुहावरे के अधिक शाब्दिक रूप को दर्ज करना।
  - marker: b
    text: या “पूर्वकाल की तरह।”
    reason: כַּאֲשֶׁר בָּרִאשׁוֹנָה के कालगत अर्थ का वैकल्पिक अनुवाद देना।
lexical_decisions:
- source_word: וְשַׂמְתִּי מָקוֹם
  choice: एक स्थान ठहराऊँगा
  rationale: שׂוּם का मूल भाव रखना या निर्धारित करना है। मָקוֹם के साथ ‘स्थान ठहराना’ परमेश्वर द्वारा इस्राएल के लिए जगह निर्धारित करने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְעַמִּי יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल के लिए
  rationale: यह वाचा-संबंधी अधिकार और आत्मीयता व्यक्त करने वाले ‘मेरी प्रजा इस्राएल’ के भाव को सहज हिंदी वाक्यक्रम में सुरक्षित रखता है।
- source_word: וּנְטַעְתִּיהוּ
  choice: उन्हें वहाँ रोपूँगा
  rationale: क्रिया का शाब्दिक अर्थ ‘रोपना’ है और एकवचन प्रत्यय सामूहिक इस्राएल की ओर संकेत करता है। ‘वहाँ’ निर्धारित स्थान से संबंध स्पष्ट करता है, जबकि रोपने का रूपक बनाए रखता है।
- source_word: וְשָׁכַן תַּחְתָּיו
  choice: वे अपने ही स्थान में बसे रहेंगे
  rationale: एकवचन रूप सामूहिक इस्राएल के लिए है। תַּחְתָּיו का शब्दशः रूप ‘उसके नीचे’ अस्पष्ट होगा; प्रसंग में यह अपनी निर्धारित जगह पर स्थिर निवास का बोध देता है।
- source_word: וְלֹא יִרְגַּז עוֹד
  choice: फिर कभी अशांत नहीं किए जाएँगे
  rationale: רגז में काँपने, व्याकुल होने या विचलित किए जाने का अर्थ हो सकता है। शत्रुओं से राष्ट्रीय सुरक्षा के प्रसंग में यह अनुवाद बाहरी उपद्रव और उससे उत्पन्न अशांति दोनों को व्यक्त करता है।
- source_word: בְנֵי עַוְלָה
  choice: दुष्ट लोग
  rationale: यह हिब्रू संबंधवाची मुहावरा दुष्टता करने वाले मनुष्यों को दर्शाता है। आधुनिक हिंदी में ‘दुष्ट लोग’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से संप्रेषित करता है।
- source_word: לְבַלֹּתוֹ
  choice: उन्हें सताएँगे
  rationale: בלה का यह रूप घिसा डालने या लगातार उत्पीड़न से क्षीण करने का भाव रखता है। हिंदी में ‘सताना’ प्रसंगानुकूल निरंतर उत्पीड़न को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּאֲשֶׁר בָּרִאשׁוֹנָה
  choice: पहले की तरह
  rationale: यह इस्राएल के पूर्वकालीन उत्पीड़न की ओर संकेत करता है। ‘पहले की तरह’ संक्षिप्त, स्वाभाविक और मूल की कालगत तुलना के निकट है।
theological_decisions:
- issue: इस्राएल के लिए सामूहिक एकवचन रूप
  choice: हिंदी में बहुवचन ‘उन्हें/वे’ का प्रयोग
  alternative: कड़ाई से एकवचन ‘उसे/वह’ रखना
  rationale: हिब्रू प्रत्यय और क्रिया-रूप एकवचन हैं, पर उनका संदर्भ सामूहिक ‘प्रजा इस्राएल’ है। हिंदी में बहुवचन से सामूहिक जनसमुदाय स्पष्ट होता है और प्रतिज्ञा का आशय नहीं बदलता।
- issue: תַּחְתָּיו का मुहावरेदार अर्थ
  choice: ‘अपने ही स्थान में’ द्वारा स्थिर और सुरक्षित निवास व्यक्त करना
  alternative: शब्दशः ‘उसके नीचे’
  rationale: शब्दशः रूप हिंदी में अस्पष्ट होगा। संदर्भ परमेश्वर द्वारा दिए गए स्थान में इस्राएल के स्थायी और सुरक्षित बसने का है।
- issue: רגז में कर्तृवाच्य अथवा कर्मवाच्य भाव
  choice: ‘अशांत नहीं किए जाएँगे’
  alternative: ‘अशांत नहीं होंगे’ या ‘न काँपेंगे’
  rationale: क्रिया स्वयं व्याकुल होने या हिलाए जाने दोनों का भाव दे सकती है। अगले वाक्य में दुष्टों के उत्पीड़न का उल्लेख बाहरी उपद्रव को प्रमुख बनाता है; कर्मवाच्य हिंदी में इस संबंध को स्पष्ट करता है, बिना आंतरिक भय की संभावना मिटाए।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण शैली। ‘रोपूँगा’ का बाइबिलीय रूपक सुरक्षित रखा गया है, जबकि सामूहिक एकवचन और תַּחְתָּיו को हिंदी की स्वाभाविक अभिव्यक्ति में प्रस्तुत किया गया है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
