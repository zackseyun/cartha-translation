  verdict: revise
  source_fidelity: Draft accurately conveys God's assigning a place to Israel, planting them, secure residence, and the cessation of oppression. However, ‘अशांत नहीं किए जाएँगे’ makes the Hebrew intransitive ‘will not be disturbed/agitated’ into an explicitly passive construction. The context supports disturbance by enemies, but the Hebrew wording should retain the broader, noncommittal formulation.
  naturalness: The Hindi is clear and appropriately dignified. ‘अपने स्थान पर’ is slightly more idiomatic than ‘अपने ही स्थान में’; ‘अशांत नहीं होंगे’ is both natural and closer to the source.
  terminology: ‘प्रजा इस्राएल,’ ‘स्थान ठहराऊँगा,’ ‘रोपूँगा,’ and ‘दुष्ट लोग’ are suitable modern-standard Hindi renderings. The footnote on ‘दुष्ट लोग’ properly preserves the Hebrew idiom, and both anchors are placed with the words they explain.
  issues:
  - severity: medium
    issue: ‘अशांत नहीं किए जाएँगे’ is an unnecessary passive narrowing of וְלֹא יִרְגַּז.
    rationale: יִרְגַּז is grammatically intransitive and can express being disturbed, unsettled, or agitated. The following clause supplies hostile oppressors, but does not require the translation to make this clause passive.
  - severity: low
    issue: ‘अपने ही स्थान में’ is somewhat less idiomatic than ‘अपने स्थान पर।’
    rationale: The latter naturally conveys settled residence in the allotted place while preserving the contextual sense of תַּחְתָּיו.
