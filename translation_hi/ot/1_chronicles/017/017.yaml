  text: וַ/תִּקְטַ֨ן זֹ֤את בְּ/עֵינֶ֨י/ךָ֙ אֱלֹהִ֔ים וַ/תְּדַבֵּ֥ר עַל בֵּֽית עַבְדְּ/ךָ֖ לְ/מֵ/רָח֑וֹק וּ/רְאִיתַ֗/נִי כְּ/ת֧וֹר הָ/אָדָ֛ם הַֽ/מַּעֲלָ֖ה יְהוָ֥ה אֱלֹהִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/017.yaml
  text: And this was a small thing in your eyes[a], O God; yet you have spoken concerning your servant’s house for a long time to come, and you have regarded me according to the rank of man on high, O Yahweh God.
translation:
  language: hi
  text: और यह तेरी दृष्टि में छोटी बात थी, हे परमेश्वर; फिर भी तूने अपने दास के घराने के दूर भविष्य के विषय में कहा है, और तूने मुझे ऊँचे पद के मनुष्य के क्रम के अनुसार माना है, हे यहोवा परमेश्वर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इस कठिन इब्रानी वाक्यांश का अनुवाद इस प्रकार भी हो सकता है: “तूने मुझे मनुष्यों की आनेवाली पीढ़ियाँ दिखाईं हैं,” अथवा, “तूने मुझे ऊँचे दर्जे का मनुष्य समझा है।”'
    reason: मूल इब्रानी के अंतिम वाक्यांश के कई सम्भव अर्थ हैं।
lexical_decisions:
- source_word: וַתִּקְטַן זֹאת בְּעֵינֶיךָ
  choice: यह बात तेरी दृष्टि में छोटी थी
  rationale: इब्रानी मूल्यांकन-सूचक मुहावरे को स्वाभाविक हिन्दी में रखते हुए קטן का ‘छोटी’ अर्थ सुरक्षित किया गया है।
- source_word: אֱלֹהִים
  choice: हे परमेश्वर
  rationale: प्रार्थना में प्रत्यक्ष संबोधन होने के कारण सम्बोधनसूचक ‘हे’ रखा गया है।
- source_word: וַתְּדַבֵּר עַל בֵּית עַבְדְּךָ
  choice: तूने अपने दास के घराने के ... विषय में भी कहा है
  rationale: דבר על का मूल अर्थ ‘के विषय में कहना’ रखा गया है; प्रतिज्ञा का भाव प्रसंग से प्रकट होता है। ‘घराना’ यहाँ वंशगत राजघराने को सहजता से व्यक्त करता है।
- source_word: לְמֵרָחוֹק
  choice: दूर भविष्य
  rationale: प्रसंग में दूरी समय-संबंधी है और दाऊद के घराने के भावी काल को सूचित करती है।
- source_word: וּרְאִיתַנִי
  choice: तूने मुझे ... देखा है
  rationale: ראה के मूल दृश्य रूप को रखा गया है, जबकि आगे का वाक्यांश विचार या व्यवहार का भाव देता है।
- source_word: כְּתוֹר הָאָדָם הַמַּעֲלָה
  choice: ऊँचे पद के मनुष्य के क्रम के अनुसार
  rationale: अत्यंत कठिन वाक्यांश में תור के क्रम/व्यवस्था और המעלה के ऊँचे दर्जे के संभावित अर्थ को बिना पूरी तरह स्पष्ट कर दिए सुरक्षित रखा गया है।
- source_word: יְהוָה אֱלֹהִים
  choice: हे यहोवा परमेश्वर
  rationale: दिव्य नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से और אֱלֹהִים को ‘परमेश्वर’ से व्यक्त किया गया है।
theological_decisions:
- issue: अंतिम कठिन वाक्यांश וּרְאִיתַנִי כְּתוֹר הָאָדָם הַמַּעֲלָה की व्याख्या
  choice: तूने मुझे ऊँचे पद के मनुष्य के क्रम के अनुसार देखा है
  alternative: तूने मुझे मनुष्यों की आनेवाली पीढ़ियाँ दिखाईं हैं; अथवा, तूने मुझे ऊँचे दर्जे का मनुष्य समझा है
  rationale: मसोरेटी पाठ स्थिर है, पर इसका अर्थ अनिश्चित है। मुख्य पाठ शब्दावली और कठिनता के निकट रहता है; प्रमुख वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं, ताकि अस्पष्टता को कृत्रिम रूप से समाप्त न किया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में प्रार्थनात्मक, गरिमापूर्ण शैली अपनाई गई है। दाऊद द्वारा परमेश्वर को संबोधित करने के कारण एकवचन निकट संबोधन ‘तू/तेरी’ रखा गया है। अंतिम खंड की असामान्यता मूल की वास्तविक अर्थगत कठिनता को जानबूझकर सुरक्षित रखती है।
