id: 1CH.17.26
reference: 1 Chronicles 17:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֣ה יְהוָ֔ה אַתָּה ה֖וּא הָ/אֱלֹהִ֑ים וַ/תְּדַבֵּר֙ עַֽל עַבְדְּ/ךָ֔ הַ/טּוֹבָ֖ה הַ/זֹּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/026.yaml
  text: And now[a], Yahweh, you are God, and you have spoken this good thing concerning your servant.
translation:
  language: hi
  text: और अब, हे याहवे, तू ही परमेश्वर है, और तूने अपने दास के विषय में यह भली बात कही है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तूने अपने दास के विषय में यह भली प्रतिज्ञा की है।” इब्रानी में शाब्दिक रूप से “यह भली बात” है।
    reason: संदर्भगत अर्थ ‘प्रतिज्ञा’ हो सकता है, जबकि मूल अभिव्यक्ति अधिक व्यापक है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को बनाए रखते हुए प्रार्थना में अगले कथन की ओर स्वाभाविक संक्रमण व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को पदवी से बदलने के बजाय हिंदी लिपि में प्रत्यक्ष रूप से प्रस्तुत किया गया है।
- source_word: אַתָּה הוּא הָאֱלֹהִים
  choice: तू ही परमेश्वर है
  rationale: ‘ही’ सर्वनाम-क्रम के बलाघात को स्वाभाविक हिंदी में व्यक्त करता है; ‘तू’ प्रार्थना में निकटता और प्रत्यक्ष संबोधन बनाए रखता है।
- source_word: וַתְּדַבֵּר
  choice: तूने ... कही है
  rationale: यह परमेश्वर के पहले कहे हुए वचन और उसकी वर्तमान प्रासंगिकता को व्यक्त करता है; मुख्य पाठ में ‘प्रतिज्ञा की’ कहने से मूल क्रिया में निहित न होने वाला अर्थ जुड़ जाता।
- source_word: עַל עַבְדְּךָ
  choice: अपने दास के विषय में
  rationale: עַל यहाँ वचन के विषय को दर्शाता है, और עֶבֶד प्रार्थना में दाऊद का विनम्र आत्म-संबोधन है।
- source_word: הַטּוֹבָה הַזֹּאת
  choice: यह भली बात
  rationale: मूल का शाब्दिक अर्थ ‘यह भली [बात]’ है। हिंदी में ‘बात’ स्वाभाविक पूर्ति है और संदर्भगत ‘प्रतिज्ञा’ को मुख्य पाठ में आरोपित नहीं करती।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम प्रत्यक्ष है; ‘याहवे’ उसे पदवी में बदले बिना और किसी संप्रदायगत व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: אַתָּה הוּא में निहित बलाघात
  choice: तू ही परमेश्वर है
  alternative: तू परमेश्वर है
  rationale: ‘ही’ इस स्वीकारोक्ति के बल को सुरक्षित रखता है, पर इससे आगे कोई दार्शनिक व्याख्या नहीं जोड़ता।
- issue: הַטּוֹבָה को प्रतिज्ञा मानना
  choice: मुख्य पाठ में ‘भली बात’, पादटिप्पणी में ‘भली प्रतिज्ञा’
  alternative: मुख्य पाठ में ‘भली प्रतिज्ञा’
  rationale: संदर्भ इसे परमेश्वर की प्रतिज्ञा समझने का समर्थन करता है, लेकिन इब्रानी संज्ञीकृत विशेषण का शाब्दिक रूप केवल ‘भली [बात]’ है; इसलिए वास्तविक अर्थगत गुंजाइश सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण प्रार्थना-शैली अपनाई गई है। ‘तू’ और ‘अपने दास’ बाइबलीय प्रार्थना की निकटता तथा विनम्रता को स्वाभाविक हिंदी में बनाए रखते हैं। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
