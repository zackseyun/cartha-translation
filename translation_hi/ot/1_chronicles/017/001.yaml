source:
  edition: WLC
  text: וַ/יְהִ֕י כַּ/אֲשֶׁ֛ר יָשַׁ֥ב דָּוִ֖יד בְּ/בֵית֑/וֹ וַ/יֹּ֨אמֶר דָּוִ֜יד אֶל נָתָ֣ן הַ/נָּבִ֗יא הִנֵּ֨ה אָנֹכִ֤י יוֹשֵׁב֙ בְּ/בֵ֣ית הָֽ/אֲרָזִ֔ים וַ/אֲר֥וֹן בְּרִית יְהוָ֖ה תַּ֥חַת יְרִיעֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/001.yaml
  text: It happened[a], when David was living in his house, that David said to Nathan the prophet, “Look, I am living in a house of cedar, but the ark of the covenant of Yahweh is under curtains.”
translation:
  language: hi
  text: ऐसा हुआ कि जब दाऊद अपने भवन में रहता था, तब उसने नातान भविष्यद्वक्ता से कहा, “देखो, मैं तो देवदार के भवन में रहता हूँ, परन्तु याहवे की वाचा का सन्दूक परदों के नीचे है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तम्बू के परदों के नीचे।” इब्रानी शब्द कपड़े के परदों को, विशेष रूप से तम्बू या पवित्र निवास के परदों को, दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: ऐसा हुआ कि जब
  rationale: यह पदबंध नए दृश्य का आरम्भ करते हुए मुख्य घटना की समय-परिस्थिति बताता है। यह अनुवाद इब्रानी कथात्मक ढाँचे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יָשַׁב ... יוֹשֵׁב
  choice: रहने लगा ... रहता हूँ
  rationale: ישׁב यहाँ बैठने के बजाय किसी भवन में निवास करने का अर्थ देता है। हिन्दी में ‘रहना’ स्वाभाविक है और मूल की पुनरावृत्ति को बनाए रखता है। पहले प्रयोग में प्रसंगानुसार बसे हुए निवास की शुरुआत का भाव ‘रहने लगा’ से व्यक्त हुआ है।
- source_word: בְּבֵיתוֹ ... בְּבֵית הָאֲרָזִים
  choice: अपने भवन में ... देवदार के भवन में
  rationale: ‘भवन’ मूल के בַּיִת को बनाए रखते हुए राजकीय निवास के प्रसंग में स्वाभाविक और गरिमापूर्ण है। दोनों स्थानों पर एक ही शब्द रखने से मूल का आलंकारिक सम्बन्ध सुरक्षित रहता है।
- source_word: נָתָן הַנָּבִיא
  choice: नातान भविष्यद्वक्ता
  rationale: नाम और उसके पद, दोनों को सीधे और प्रचलित बाइबलीय हिन्दी में रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला अव्यय है; ‘देखो’ आधुनिक हिन्दी में स्पष्ट है और अनावश्यक पुरातनता से बचता है।
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: परन्तु याहवे की वाचा का सन्दूक
  rationale: सरल वाव यहाँ दाऊद के देवदार के भवन और सन्दूक की अपेक्षाकृत साधारण छत के बीच निहित विरोध दिखाता है, इसलिए ‘परन्तु’ स्वाभाविक है। सम्बन्धवाचक रचना मूल अर्थ को स्पष्ट रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में रखा गया है।
- source_word: תַּחַת יְרִיעוֹת
  choice: परदों के नीचे
  rationale: יְרִיעוֹת कपड़े के परदों या विशेषतः तम्बू के परदों को दर्शाता है। मुख्य पाठ निकट और संक्षिप्त अर्थ रखता है; अधिक विशिष्ट सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यन्तरण है और नाम को किसी उपाधि से नहीं बदलता।
- issue: वाचा के सन्दूक और दाऊद के भवन के बीच विरोध
  choice: ‘परन्तु’ द्वारा निहित विरोध स्पष्ट किया गया
  alternative: ‘और’ द्वारा इब्रानी संयोजक का औपचारिक अनुकरण
  rationale: इब्रानी ו सामान्य संयोजक है, पर प्रसंग में दाऊद की चिंता दोनों निवास-स्थितियों के विरोध पर निर्भर है। ‘परन्तु’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। ‘भवन’, ‘वाचा’ और ‘सन्दूक’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; वाक्य-विन्यास को मूल कथात्मक प्रवाह और दाऊद के कथन में मौजूद विरोध के अनुरूप रखा गया है।
