source:
  edition: WLC
  text: וּ/מִי֙ כְּ/עַמְּ/ךָ֣ יִשְׂרָאֵ֔ל גּ֥וֹי אֶחָ֖ד בָּ/אָ֑רֶץ אֲשֶׁר֩ הָלַ֨ךְ הָ/אֱלֹהִ֜ים לִ/פְדּ֧וֹת ל֣/וֹ עָ֗ם לָ/שׂ֤וּם לְ/ךָ֙ שֵׁ֚ם גְּדֻלּ֣וֹת וְ/נֹרָא֔וֹת לְ/גָרֵ֗שׁ מִ/פְּנֵ֧י עַמְּ/ךָ֛ אֲשֶׁר פָּדִ֥יתָ מִ/מִּצְרַ֖יִם גּוֹיִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/021.yaml
  text: And who is like your people Israel[a], one nation on the earth, whom God went to redeem for himself as a people, to make for yourself a name by great and fearsome deeds, driving out nations from before your people[b], whom you redeemed from Egypt?
translation:
  language: hi
  text: और पृथ्वी पर कौन तेरी प्रजा इस्राएल के समान है—एक ऐसा राष्ट्र, जिसे अपनी प्रजा बनाने के लिए परमेश्वर छुड़ाने गया, ताकि बड़े और भयावह कामों से अपने लिए नाम करे और तेरी प्रजा के सामने से, जिसे तूने मिस्र से छुड़ाया था, जातियों को निकाल दे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में ‘जातियों को’ वाक्य के अंत में आता है: “तेरी प्रजा के सामने से, जिसे तूने मिस्र से छुड़ाया, जातियों को निकालने के लिए।” 2 शमूएल 7:23 का समानांतर पाठ भी कठिन है; इसलिए कुछ लोग इस अंतिम शब्द के वाक्यगत संबंध को अलग ढंग से समझते हैं।'
    reason: textual_variant
lexical_decisions:
- source_word: וּמִי כְעַמְּךָ יִשְׂרָאֵל
  choice: और कौन तेरी प्रजा इस्राएल के समान है
  rationale: מִי के व्यक्तिगत प्रश्नवाचक रूप और स्पष्ट तुलना को बनाए रखता है; 'तेरी प्रजा' परमेश्वर से प्रत्यक्ष संबोधन को सुरक्षित रखता है।
- source_word: גּוֹי אֶחָד בָּאָרֶץ
  choice: पृथ्वी पर ... एक ऐसा राष्ट्र
  rationale: शाब्दिक अर्थ 'पृथ्वी पर एक राष्ट्र' है; हिंदी वाक्य-विन्यास में 'एक ऐसा राष्ट्र' पिछले प्रश्न को स्वाभाविक रूप से आगे बढ़ाता है, बिना 'अद्वितीय' जोड़कर अर्थ को अधिक निश्चित किए।
- source_word: אֲשֶׁר הָלַךְ הָאֱלֹהִים
  choice: जिसे ... परमेश्वर स्वयं गया
  rationale: הלך में निहित परमेश्वर के निर्णायक रूप से जाने की मानवरूपी भाषा बचाई गई है; 'स्वयं' हिंदी में बल को स्वाभाविक बनाता है।
- source_word: לִפְדּוֹת לוֹ עָם
  choice: छुड़ाकर अपनी प्रजा बनाने के लिए
  rationale: פדה के लिए परिचित और स्पष्ट 'छुड़ाना' चुना गया है; वाक्यांश का फलसूचक भाव बताता है कि छुड़ाए गए लोग परमेश्वर की प्रजा बने।
- source_word: לָשׂוּם לְךָ שֵׁם
  choice: अपने लिए नाम कमाया
  rationale: यह प्रतिष्ठा स्थापित करने का स्वाभाविक हिंदी मुहावरा है और परमेश्वर के कार्यों द्वारा उसके नाम की ख्याति होने का आशय रखता है।
- source_word: גְּדֻלּוֹת וְנוֹרָאוֹת
  choice: बड़े-बड़े और भय जगाने वाले काम
  rationale: גדלות की महानता और נוראות से उत्पन्न विस्मय तथा भय—दोनों को सामान्य आधुनिक हिंदी में व्यक्त करता है।
- source_word: לְגָרֵשׁ מִפְּנֵי עַמְּךָ ... גּוֹיִם
  choice: तेरी प्रजा के सामने से ... जातियों को निकाल दिया
  rationale: מִפְּנֵי की स्थानगत छवि और לגרש की निष्कासन क्रिया को बनाए रखता है; अंतिम גוים को क्रिया का कर्म माना गया है।
- source_word: אֲשֶׁר פָּדִיתָ מִמִּצְרַיִם
  choice: जिसे तूने मिस्र से छुड़ाया था
  rationale: परमेश्वर को संबोधित दूसरे पुरुष एकवचन और मिस्र से छुटकारे के स्पष्ट ऐतिहासिक संदर्भ को सुरक्षित रखता है।
theological_decisions:
- issue: לָשׂוּם לְךָ שֵׁם में परमेश्वर द्वारा अपने नाम की प्रतिष्ठा
  choice: अपने लिए नाम कमाया
  alternative: अपने लिए नाम स्थापित किया
  rationale: मूल पाठ स्पष्ट रूप से छुटकारे और सामर्थी कार्यों द्वारा परमेश्वर की ख्याति स्थापित होने की बात कहता है; इसे नरम किए बिना सामान्य हिंदी मुहावरे में रखा गया है।
- issue: נוראות में भय और विस्मय का संबंध
  choice: भय जगाने वाले
  alternative: विस्मयकारी
  rationale: '''विस्मयकारी'' अकेले भय के प्रबल पहलू को कम कर सकता है; चुना हुआ रूप दैवी कार्यों से उत्पन्न श्रद्धामिश्रित भय को खुला रखता है।'
- issue: पद के अंतिम גּוֹיִם का वाक्यगत संबंध
  choice: जातियों को निकाल दिया
  alternative: अंतिम शब्द-क्रम को अनिश्चित मानते हुए अधिक शाब्दिक संरचना
  rationale: मासोरेटिक पाठ में इसे לגרש का कर्म समझना सर्वाधिक स्वाभाविक है, पर 2 शमूएल 7:23 के कठिन समानांतर के कारण पाठगत/वाक्यगत अनिश्चितता को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ शैली। परमेश्वर से प्रार्थनात्मक प्रत्यक्ष संबोधन के कारण 'तू/तेरी' रखा गया है। 'जातियाँ' बाइबलीय जनसमूहों के लिए प्रयुक्त है।
