base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/014.yaml
  text: But I will establish him in my house and in my kingdom forever[c][b][a], and his throne will be established forever.
translation:
  language: hi
  text: परन्तु मैं उसे अपने घर में और अपने राज्य में सदा के लिए स्थापित करूँगा[b][c], और उसका सिंहासन सदा के लिए स्थिर रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘उसे’ का निकट सन्दर्भ दाऊद के राजकीय वंशज, विशेषकर सुलैमान, से हो सकता है; साथ ही यह दाऊदी प्रतिज्ञा के उस व्यापक अर्थ में भी योगदान देता है जिसे बाद में मसीही रूप में समझा गया।
    reason: alternative_reading
  - marker: c
    text: ‘अपने घर’ से व्यापक अर्थ में परमेश्वर का घर या वाचा-सम्बन्धी क्षेत्र अभिप्रेत हो सकता है; कुछ इसे विशेष रूप से मन्दिर या परमेश्वर के राजकीय घराने के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַעֲמַדְתִּיהוּ
  choice: परन्तु मैं उसे ... स्थापित करूँगा
  rationale: हिफ़ील रूप यहाँ किसी को दृढ़ पद पर खड़ा करने या स्थापित करने का भाव देता है। प्रसंग में पिछले पद की चेतावनी के विपरीत परमेश्वर की सकारात्मक प्रतिज्ञा होने के कारण וְ को स्वाभाविक हिन्दी में ‘परन्तु’ किया गया है।
- source_word: בְּבֵיתִי
  choice: अपने भवन में
  rationale: בְּ का सीधा अर्थ ‘में’ है। ‘भवन’ בית के घर, राज-परिवार या पवित्र भवन से जुड़े व्यापक अर्थ को खुला रखता है; ‘अपने भवन के ऊपर’ अधिक व्याख्यात्मक होता।
- source_word: וּבְמַלְכוּתִי
  choice: और अपने राज्य में
  rationale: यह ‘अपने भवन में’ के समानान्तर है। ‘राज्य’ מלכות का स्वाभाविक हिन्दी रूप है और ‘में’ मूल पूर्वसर्ग को सुरक्षित रखता है।
- source_word: עַד הָעוֹלָם
  choice: सदा के लिए
  rationale: यह पदबंध स्थायी निरन्तरता व्यक्त करता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְכִסְאוֹ
  choice: और उसका सिंहासन
  rationale: כִּסֵּא का प्रत्यक्ष राजकीय अर्थ ‘सिंहासन’ है, इसलिए इसे ‘शासन’ या ‘वंश’ कहकर व्याख्यायित नहीं किया गया।
- source_word: יִהְיֶה נָכוֹן
  choice: स्थिर रहेगा
  rationale: נכון यहाँ दृढ़, सुरक्षित और कायम रहने का भाव देता है। ‘स्थिर रहेगा’ पहले खंड के ‘स्थापित करूँगा’ से अनावश्यक पुनरावृत्ति किए बिना राजकीय स्थायित्व व्यक्त करता है।
- source_word: עַד עוֹלָם
  choice: सदा तक
  rationale: यह स्थायी अवधि का वही भाव दोहराता है; हिन्दी में ‘सदा तक’ वाक्य के साथ स्वाभाविक बैठता है।
theological_decisions:
- issue: दाऊदी वाचा में ‘उसे’ का अभिप्रेत व्यक्ति
  choice: मुख्य पाठ में केवल ‘उसे’ रखा गया है।
  alternative: विशेष रूप से सुलैमान; सामूहिक रूप से दाऊद का राजवंश; अन्ततः मसीह
  rationale: इब्रानी पाठ पुल्लिंग एकवचन सर्वनाम का प्रयोग करता है, पर इस पद में नाम नहीं बताता। अनुवाद तत्कालीन वंशगत सन्दर्भ और बाद में समझे गए मसीही महत्त्व के बीच के तनाव को खुला रखता है।
- issue: ‘मेरे भवन’ का अर्थ-क्षेत्र
  choice: इसे ‘अपने भवन’ के रूप में व्यापक रखा गया है।
  alternative: मेरा मन्दिर; मेरा घराना; मेरा राजकीय परिवार या वाचा-सम्बन्धी क्षेत्र
  rationale: בית यहाँ पवित्र भवन, घराने या परमेश्वर के वाचा-सम्बन्धी अधिकार-क्षेत्र की ओर संकेत कर सकता है। मुख्य पाठ किसी एक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भवन’ बहुअर्थी בית को ‘मन्दिर’ या ‘घराना’ तक सीमित नहीं करता। अंग्रेज़ी परत का [a] विकल्प हिन्दी में अलग टिप्पणी के रूप में उपयोगी नहीं है, क्योंकि ‘में’ मूल בְּ का सीधा और स्वाभाविक अनुवाद है; इसलिए केवल प्रयुक्त टिप्पणियों [b] और [c] के चिह्न मुख्य पाठ में दिए गए हैं।
