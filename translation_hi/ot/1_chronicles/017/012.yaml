base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/012.yaml
  text: He will build a house for me[a], and I will establish his throne forever.
translation:
  language: hi
  text: वही मेरे लिए एक भवन[a] बनाएगा, और मैं उसका सिंहासन सदा के लिए स्थिर करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मन्दिर”; इब्रानी शब्द का शाब्दिक अर्थ “घर” है, और इस संदर्भ में यह उस पवित्रस्थान को दर्शाता है जिसे सुलैमान बनाएगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र तृतीय पुरुष पुल्लिंग एकवचन सर्वनाम यहाँ कर्ता पर बल देता है; ‘वही’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִבְנֶה
  choice: बनाएगा
  rationale: בנה का क़ाल अपूर्ण रूप प्रतिज्ञा के इस संदर्भ में भविष्य की क्रिया बताता है।
- source_word: לִּי
  choice: मेरे लिए
  rationale: לְ उपसर्ग और प्रथम पुरुष एकवचन प्रत्यय यहाँ लाभ अथवा संबंध व्यक्त करते हैं; भवन वक्ता के लिए बनाया जाएगा।
- source_word: בָּיִת
  choice: एक भवन
  rationale: शब्द का मूल अर्थ ‘घर/भवन’ है और संदर्भ में परमेश्वर के पवित्रस्थान की ओर संकेत करता है। ‘भवन’ मूल शब्द की व्यापकता बनाए रखते हुए हिन्दी में परमेश्वर के लिए निर्मित इमारत के संदर्भ में स्वाभाविक है।
- source_word: וְכֹנַנְתִּי
  choice: और मैं ... स्थिर करूँगा
  rationale: כון का यह रूप स्थापित करने, दृढ़ करने या सुरक्षित रूप से कायम रखने का भाव देता है; राजसिंहासन के साथ ‘स्थिर करूँगा’ स्वाभाविक और अर्थ-संगत है।
- source_word: אֶת כִּסְאוֹ
  choice: उसका सिंहासन
  rationale: प्रत्यक्ष कर्म चिह्न के बाद संज्ञा पर तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है; इसका स्वाभाविक हिन्दी रूप ‘उसका सिंहासन’ है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह मुहावरा निरंतर स्थायित्व व्यक्त करता है; ‘सदा के लिए’ इसके दावे को बिना अतिरिक्त व्याख्या के रखता है।
theological_decisions:
- issue: בָּיִת को ‘भवन/घर’ कहना या संदर्भानुसार ‘मन्दिर’ कहना
  choice: भवन
  alternative: मन्दिर
  rationale: इब्रानी पाठ व्यापक शब्द ‘घर/भवन’ का प्रयोग करता है। मुख्य पाठ में ‘भवन’ रखने से दाऊदी वाचा में ‘घर’ की साहित्यिक प्रतिध्वनि पूरी तरह व्याख्यात्मक ‘मन्दिर’ में सीमित नहीं होती, जबकि पादटिप्पणी संदर्भ स्पष्ट करती है।
- issue: दाऊदी प्रतिज्ञा में עַד עוֹלָם का आशय
  choice: सदा के लिए
  alternative: सर्वदा
  rationale: अनुवाद पाठ के स्थायी दावे को सीधे व्यक्त करता है और इस प्रतिज्ञा की अंतिम पूर्ति से जुड़े धर्मवैज्ञानिक प्रश्नों को अनुवाद के भीतर नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘वही’ मूल सर्वनाम के बल को दर्शाता है। ‘भवन’ मूल की व्यापकता और पवित्रस्थान के संदर्भ—दोनों को संभालता है; ‘मन्दिर’ पादटिप्पणी में दिया गया है।
