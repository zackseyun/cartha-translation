id: 1CH.17.7
reference: 1 Chronicles 17:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/עַתָּה כֹּֽה תֹאמַ֞ר לְ/עַבְדִּ֣/י לְ/דָוִ֗יד כֹּ֤ה אָמַר֙ יְהוָ֣ה צְבָא֔וֹת אֲנִ֤י לְקַחְתִּ֨י/ךָ֙ מִן הַ/נָּוֶ֔ה מִֽן אַחֲרֵ֖י הַ/צֹּ֑אן לִ/הְי֣וֹת נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־ס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/007.yaml
  text: 'Now therefore[a], this is what you shall say to my servant David: This is what Yahweh of hosts says: I took you from the pasture, from following the flock[b], to be ruler over my people Israel.'
translation:
  language: hi
  text: '“इसलिए अब मेरे सेवक दाऊद से यह कहना: ‘सेनाओं का याहवे यह कहता है: मैंने तुझे चरागाह[a] से, भेड़-बकरियों के झुंड के पीछे-पीछे चलने से, लिया, ताकि तू मेरी प्रजा इस्राएल का शासक[b] हो।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेड़शाला।”
    reason: lexical_alternative
  - marker: b
    text: या “अगुआ” अथवा “प्रधान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक וְ और समयवाचक עַתָּה के साथ प्रसंगगत निष्कर्ष और संक्रमण—दोनों को व्यक्त करता है।
- source_word: לְעַבְדִּי לְדָוִיד
  choice: मेरे सेवक दाऊद से
  rationale: यहाँ עֶבֶד दाऊद की परमेश्वर के प्रति अधीन सेवा का सम्मानसूचक पद है; ‘दास’ से बंधुआ स्थिति पर अनावश्यक बल पड़ सकता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को लिप्यंतरित करता और צְבָאוֹת के व्यापक सैन्य/स्वर्गीय भाव को अनिर्दिष्ट रखते हुए सुरक्षित रखता है।
- source_word: לְקַחְתִּיךָ
  choice: मैंने तुझे ... से उठाया
  rationale: לקח में परमेश्वर की पहल प्रमुख है; हिंदी में निम्न चरवाही स्थिति से नेतृत्व के लिए चुने जाने के संदर्भ में ‘उठाया’ स्वाभाविक है।
- source_word: מִן הַנָּוֶה
  choice: चरागाह से
  rationale: चरवाही के निकट संदर्भ में נָוֶה का संभावित अर्थ चरने की जगह है; वैकल्पिक अर्थ ‘भेड़शाला’ पादटिप्पणी में रखा गया है।
- source_word: מִן אַחֲרֵי הַצֹּאן
  choice: भेड़-बकरियों के झुंड के पीछे चलने से
  rationale: मूल के स्थानगत चरवाहा-बिंब को बनाए रखता है और הצאן को हिंदी में स्वाभाविक सामूहिक अभिव्यक्ति से प्रस्तुत करता है।
- source_word: לִהְיוֹת נָגִיד
  choice: ताकि तू ... शासक हो
  rationale: नियुक्त नेतृत्व और शासन-अधिकार दोनों को स्पष्ट करता है, बिना इसे अनिवार्य रूप से तकनीकी राजकीय उपाधि बनाने के।
- source_word: עַל עַמִּי יִשְׂרָאֵל
  choice: मेरी प्रजा इस्राएल का
  rationale: परमेश्वर से प्रजा के संबंध और प्रजा की पहचान—दोनों को स्वाभाविक हिंदी क्रम में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से है; ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: दाऊद के लिए עַבְדִּי
  choice: मेरे सेवक
  alternative: मेरे दास
  rationale: इस प्रसंग में शब्द चुने हुए राजकीय सेवक की परमेश्वर-अधीन भूमिका बताता है; ‘सेवक’ सम्मानसूचक तथा संबंधपरक अर्थ को बेहतर संप्रेषित करता है।
- issue: נָגִיד की पदवी
  choice: शासक
  alternative: अगुआ; प्रधान; राजकुमार
  rationale: शब्द नियुक्त नेतृत्व और शासन को सूचित करता है, किंतु अपने आप में ‘राजा’ का तकनीकी पद नहीं है; इसलिए ‘शासक’ चुना गया और अन्य संभावनाएँ पादटिप्पणी में दी गईं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रत्यक्ष ईश्वरीय वचन के लिए एकवचन निकट संबोधन ‘तू/तुझे’ मूल के व्याकरण और पारंपरिक बाइबलीय संबोधन के अनुरूप है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिंदी पाठ में [a] को ‘चरागाह’ और [b] को ‘शासक’ के बाद रखा गया है।
