source:
  edition: WLC
  text: וַ֠/תִּתֵּן אֶת עַמְּ/ךָ֨ יִשְׂרָאֵ֧ל לְ/ךָ֛ לְ/עָ֖ם עַד עוֹלָ֑ם וְ/אַתָּ֣ה יְהוָ֔ה הָיִ֥יתָ לָ/הֶ֖ם לֵ/אלֹהִֽים־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/022.yaml
  text: And you made your people Israel your people forever[a], and you, O Yahweh, became their God.
translation:
  language: hi
  text: और तूने अपनी प्रजा इस्राएल को सदा के लिए अपने लिए प्रजा ठहराया, और हे याहवे, तू उनका परमेश्वर बना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तू उनका परमेश्वर था।” इब्रानी पदबंध को स्थितिवाचक अर्थ में भी अनूदित किया जा सकता है; मुख्य पाठ प्रसंग में वाचा-संबंध स्थापित होने के भाव को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּתֵּן
  choice: ठहराया
  rationale: נתן का मूल अर्थ ‘देना’ है, पर לְךָ לְעָם वाली रचना में यह किसी को एक संबंध या पद में स्थापित करने का भाव देता है। ‘ठहराया’ इस विधानात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַמְּךָ יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल
  rationale: इससे ‘तेरी प्रजा’ और उसकी पहचान ‘इस्राएल’—दोनों सुरक्षित रहते हैं।
- source_word: לְךָ לְעָם
  choice: अपनी प्रजा
  rationale: दोनों לְ उपसर्गों से परमेश्वर के लिए उसकी निज प्रजा के रूप में स्थापित किए जाने का भाव आता है; हिन्दी वाक्य में ‘ठहराया’ के साथ यह संबंध स्पष्ट है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह टिकाऊ और निरंतर रहने वाले संबंध को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הָיִיתָ לָהֶם לֵאלֹהִים
  choice: तू उनका परमेश्वर बना
  rationale: היה के पूर्ण रूप और वाचा-संबंधी संदर्भ में संबंध स्थापित होने का कथात्मक भाव है। ‘बना’ परमेश्वर के स्वभाव में परिवर्तन नहीं, बल्कि इस्राएल के साथ स्थापित संबंध को बताता है; स्थितिवाचक अर्थ की संभावना पादटिप्पणी में रखी गई है।
theological_decisions:
- issue: वाचा-सूत्र היה + ל + אלהים का अनुवाद
  choice: तू उनका परमेश्वर बना
  alternative: तू उनका परमेश्वर था
  rationale: मुख्य पाठ इस्राएल को अपनी प्रजा ठहराने के अनुरूप वाचा-संबंध की स्थापना का भाव रखता है। इससे परमेश्वर के स्वरूप में परिवर्तन अभिप्रेत नहीं है। इब्रानी के स्थितिवाचक पाठ की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ बाइबलीय हिन्दी की निकटता और गंभीरता बनाए रखता है।
