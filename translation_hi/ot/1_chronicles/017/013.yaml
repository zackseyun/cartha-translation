base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/013.yaml
  text: I will be a father to him[a], and he will be a son to me. And I will not remove my steadfast love from him[b], as I removed it from the one who was before you.
translation:
  language: hi
  text: मैं उसका पिता होऊँगा[a], और वह मेरा पुत्र होगा। मैं अपना अटल प्रेम उससे दूर नहीं करूँगा, जैसा मैंने उसे उस व्यक्ति से हटा लिया था जो तुमसे पहले था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं उसके लिए पिता होऊँगा, और वह मेरे लिए पुत्र होगा।”
    reason: lexical_alternative
  - marker: b
    text: “जो तुमसे पहले था” से आशय शाऊल है, जो दाऊद से पहले राजा था।
    reason: cross_reference
lexical_decisions:
- source_word: אֶהְיֶה לּוֹ לְאָב
  choice: मैं उसका पिता ठहरूँगा
  rationale: इब्रानी की संबंधसूचक रचना का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; ‘ठहरूँगा’ भविष्य में स्थापित और बने रहने वाले संबंध का भाव व्यक्त करता है।
- source_word: וְהוּא יִהְיֶה לִּי לְבֵן
  choice: और वह मेरा पुत्र ठहरेगा
  rationale: पहले खंड की समानांतर संरचना और वाचा-संबंधी पिता-पुत्र भाषा को बनाए रखता है।
- source_word: חַסְדִּי
  choice: अपना अटल प्रेम
  rationale: חֶסֶד में प्रेम, निष्ठा और स्थायित्व साथ निहित हैं; ‘अटल प्रेम’ इन्हें सामान्य आधुनिक हिन्दी में संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: לֹא אָסִיר מֵעִמּוֹ
  choice: उससे दूर न करूँगा
  rationale: हिफ़ील क्रिया סור के ‘हटा देना/दूर करना’ अर्थ को स्पष्ट करता है और अगले तुलनात्मक खंड में उसी क्रिया की पुनरावृत्ति बनाए रखता है।
- source_word: כַּאֲשֶׁר הֲסִירוֹתִי
  choice: जैसा मैंने ... दूर कर दिया था
  rationale: पहले प्रयुक्त क्रिया को दोहराकर मूल की तुलना सुरक्षित रखता है; हिन्दी में पूर्ण भूतकाल संदर्भ के अनुकूल है।
- source_word: מֵאֲשֶׁר הָיָה לְפָנֶיךָ
  choice: जो तुमसे पहले था
  rationale: मूल की जानबूझकर अनाम अभिव्यक्ति को बनाए रखता है; मुख्य पाठ में शाऊल का नाम जोड़कर अर्थ का मौन विस्तार नहीं करता।
theological_decisions:
- issue: दाऊदी वाचा में पिता-पुत्र की भाषा
  choice: प्रत्यक्ष संबंधसूचक भाषा ‘उसका पिता’ और ‘मेरा पुत्र’ बनाए रखी गई।
  alternative: मैं पिता के समान उसकी देखभाल करूँगा, और वह पुत्र के समान मेरा होगा।
  rationale: मूल में वास्तविक वाचा-संबंधी राजकीय पुत्रत्व की सीधी भाषा है; उपमा बनाकर उसका धर्मवैज्ञानिक बल कम नहीं किया गया।
- issue: वाचा के संदर्भ में חֶסֶד का अनुवाद
  choice: अटल प्रेम
  alternative: करुणा; वाचा की निष्ठा; प्रेममय कृपा
  rationale: ‘अटल प्रेम’ भावनात्मक प्रेम और स्थायी निष्ठा—दोनों को समेटता है, बिना शब्द को केवल दया या कानूनी दायित्व तक सीमित किए।
- issue: ‘जो तुमसे पहले था’ की पहचान
  choice: मुख्य पाठ में व्यक्ति को अनाम रखा गया और पादटिप्पणी में शाऊल की पहचान दी गई।
  alternative: मुख्य पाठ में सीधे ‘शाऊल’ लिखना।
  rationale: मूल पाठ शाऊल का नाम नहीं लेता; उसकी अंतर्निहित पहचान स्पष्ट करने के लिए पादटिप्पणी पर्याप्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘ठहरूँगा’ संबंध की स्थापना और स्थिरता व्यक्त करता है। मूल की समानांतरता, अनाम संकेत और वाचा-संबंधी तनाव सुरक्षित रखे गए हैं।
