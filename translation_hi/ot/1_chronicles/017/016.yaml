  text: וַ/יָּבֹא֙ הַ/מֶּ֣לֶךְ דָּוִ֔יד וַ/יֵּ֖שֶׁב לִ/פְנֵ֣י יְהוָ֑ה וַ/יֹּ֗אמֶר מִֽי אֲנִ֞י יְהוָ֤ה אֱלֹהִים֙ וּ/מִ֣י בֵיתִ֔/י כִּ֥י הֲבִיאֹתַ֖/נִי עַד הֲלֹֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/017/016.yaml
  text: Then King David went in and sat before Yahweh and said[a], “Who am I, O Yahweh God, and what is my house, that you have brought me this far?”
translation:
  language: hi
  text: तब राजा दाऊद भीतर गया और यहोवा के सामने बैठकर बोला, “हे यहोवा परमेश्वर, मैं कौन हूँ और मेरा घराना[a] क्या है कि तू मुझे यहाँ तक ले आया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घर,” “परिवार,” अथवा “राजवंश।” यहाँ हिब्रू शब्द दाऊद के परिवार और उसके राजकीय वंश, दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: भीतर गया
  rationale: בוא का अर्थ ‘आना/जाना/प्रवेश करना’ हो सकता है। प्रसंग में दाऊद का यहोवा की उपस्थिति के स्थान में प्रवेश करना अभिप्रेत है; ‘भीतर गया’ स्थान को अनावश्यक रूप से निश्चित किए बिना यह भाव व्यक्त करता है।
- source_word: וַיֵּשֶׁב
  choice: बैठकर
  rationale: यहाँ ישב का ठोस अर्थ ‘बैठना’ क्रमिक कथात्मक क्रिया के अनुकूल है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह पदबंध प्रत्यक्ष रूप से दाऊद के यहोवा की उपस्थिति में बैठने को व्यक्त करता है; ‘सामने’ स्वाभाविक और औपचारिक दोनों है।
- source_word: יְהוָה אֱלֹהִים
  choice: हे यहोवा परमेश्वर
  rationale: प्रत्यक्ष संबोधन को ‘हे’ से स्पष्ट किया गया है; יְהוָה को वाचा-संबंधी नाम ‘यहोवा’ और אֱלֹהִים को ‘परमेश्वर’ से व्यक्त किया गया है।
- source_word: מִי אֲנִי
  choice: मैं कौन हूँ
  rationale: यह प्रश्न दाऊद की विनम्रता और अयोग्यता-बोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמִי בֵיתִי
  choice: और मेरा घराना क्या है
  rationale: हिब्रू में ‘कौन’ दोहराया गया है, पर हिन्दी में निर्जीव/सामूहिक संदर्भ के लिए ‘क्या’ अधिक स्वाभाविक है। ‘घराना’ परिवार, गृहस्थी और राजवंश—तीनों की व्यापकता को काफी हद तक बनाए रखता है।
- source_word: הֲבִיאֹתַנִי
  choice: तू मुझे ... ले आया है
  rationale: बोא के हिफ़ील रूप का कारक भाव ‘ले आया’ से स्पष्ट होता है और परमेश्वर द्वारा दाऊद को उसकी वर्तमान स्थिति तक पहुँचाने का भाव बना रहता है।
- source_word: עַד הֲלֹם
  choice: यहाँ तक
  rationale: यह अभिव्यक्ति दाऊद की वर्तमान अवस्था या उन्नति की सीमा तक पहुँचाए जाने को संक्षेप और स्वाभाविक ढंग से बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-संबंधी नाम प्रत्यक्ष रूप से उपस्थित है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया है, न कि उसे केवल उपाधि ‘प्रभु’ से बदलकर नाम को छिपाया गया है।
- issue: בֵיתִי में दाऊद के ‘घर’ का आशय
  choice: घराना
  alternative: घर / परिवार / राजवंश
  rationale: प्रसंग दाऊद के परिवार और भावी राजकीय वंश दोनों से संबंधित है। ‘घराना’ इस बहुअर्थकता को पूरी तरह किसी एक अर्थ तक सीमित किए बिना स्वाभाविक हिन्दी देता है; विकल्प पादटिप्पणी में स्पष्ट किए गए हैं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दाऊद के प्रत्यक्ष संबोधन में श्रद्धापूर्ण एकवचन ‘तू’ प्रयुक्त है, जो हिन्दी की पारंपरिक प्रार्थना-भाषा में निकटता और आदर दोनों व्यक्त करता है।
