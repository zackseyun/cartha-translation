  language: en
  yaml_path: translation/ot/1_chronicles/027/020.yaml
  text: 'For the sons of Ephraim: Hoshea son of Azaziah[a]; for the half-tribe of Manasseh: Joel son of Pedaiah.'
translation:
  language: hi
  text: 'एप्रैम के वंशजों के लिए: अज़ज़्याह का पुत्र होशे; मनश्शे के आधे गोत्र के लिए: पदायाह का पुत्र योएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों के लिए
  rationale: ל उपसर्ग इस प्रशासनिक सूची में किसी गोत्र के लिए नियुक्त दायित्व दर्शाता है। בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर गोत्र के सामूहिक संदर्भ में आधुनिक हिन्दी में ‘वंशज’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: הוֹשֵׁעַ
  choice: होशे
  rationale: इब्रानी नाम की ध्वनि के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-संबंध बताने वाला सामान्य इब्रानी प्रयोग।
- source_word: עֲזַזְיָהוּ
  choice: अजज्याह
  rationale: इब्रानी व्यंजन और याहू-तत्व को ध्यान में रखकर किया गया हिन्दी लिप्यंतरण।
- source_word: לַ/חֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र के लिए
  rationale: ל नियुक्त दायित्व दिखाता है; חֲצִי שֵׁבֶט का स्वाभाविक हिन्दी रूप ‘आधा गोत्र’ है।
- source_word: יוֹאֵל
  choice: योएल
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: פְּדָיָהוּ
  choice: पदायाह
  rationale: इब्रानी नाम का हिन्दी में पारंपरिक और स्रोत-संगत लिप्यंतरण।
