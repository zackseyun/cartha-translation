  text: पहले महीने के लिए पहली टुकड़ी का अधिकारी जब्दीएल का पुत्र याशोबाम था; और उसकी टुकड़ी में चौबीस हज़ार थे।[a]
  philosophy: optimal-equivalence
  footnotes:
