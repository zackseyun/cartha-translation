  text: Over the olive trees and the sycamore trees in the Shephelah was Baal-hanan the Gederite[b][a]; and over the stores of oil was Joash.
translation:
  language: hi
  text: शफेला[b] में जैतून और सिकमोर-अंजीर के पेड़ों[a] की देखरेख गदेरवासी बाल-हानान के हाथ में थी, और तेल के भंडारों की देखरेख योआश के हाथ में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिकमोर के पेड़ों।”
    reason: lexical_alternative
  - marker: b
    text: या “निचले प्रदेश में।” “शफेला” यहूदा की पहाड़ियों की तलहटी में फैला हुआ प्रदेश था।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: की देखरेख … के हाथ में थी
  rationale: इस प्रशासनिक सूची में עַל किसी क्षेत्र या संपत्ति पर नियुक्त उत्तरदायित्व व्यक्त करता है। यह हिंदी में स्वाभाविक रूप से पर्यवेक्षण और प्रभार दोनों का भाव देता है।
- source_word: הַזֵּיתִים
  choice: जैतून … के पेड़ों
  rationale: भूमि-प्रबंधन के इस संदर्भ में बहुवचन संज्ञा फल के बजाय जैतून के पेड़ों को सूचित करती है।
- source_word: וְהַשִּׁקְמִים
  choice: गूलर के पेड़ों
  rationale: שִׁקְמִים से सिकमोर-फिग जाति के पेड़ अभिप्रेत हैं। सामान्य हिंदी पाठक के लिए ‘गूलर’ निकट और सुबोध नाम है; अधिक तकनीकी विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֲשֶׁר בַּשְּׁפֵלָה
  choice: शफेला में
  rationale: שְׁפֵלָה यहाँ यहूदा के पहाड़ी पादप्रदेश के मान्य भौगोलिक नाम के रूप में समझा जा सकता है। नाम को लिप्यंतरित करके उसका वर्णन पादटिप्पणी में दिया गया है।
- source_word: בַּעַל חָנָן
  choice: बाल-हानान
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट लिप्यंतरण।
- source_word: הַגְּדֵרִי
  choice: गदेरवासी
  rationale: यह जातिवाचक/स्थान-संबंधी विशेषण है, जिसका अर्थ गदेर से संबंध रखने वाला व्यक्ति है; ‘गदेरवासी’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: אֹצְרוֹת הַשֶּׁמֶן
  choice: तेल के भंडारों
  rationale: यह पद तेल के संग्रह अथवा उसे रखने के भंडारों को सूचित करता है। ‘भंडार’ संग्रहित सामग्री और भंडारण-स्थान, दोनों की संभाव्यता बनाए रखता है।
- source_word: יוֹעָשׁ
  choice: योआश
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित देवनागरी लिप्यंतरण।
