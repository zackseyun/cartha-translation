  yaml_path: translation/ot/1_chronicles/027/007.yaml
  text: The fourth[a], for the fourth month, was Asahel the brother of Joab, and Zebadiah his son after him; and over his division were twenty-four thousand.
translation:
  language: hi
  text: चौथे महीने के लिए चौथा दल योआब के भाई असाहेल का था, और उसके बाद उसका पुत्र जबद्याह था; उसके दल में चौबीस हज़ार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרְבִיעִי
  choice: चौथा दल
  rationale: क्रमवाचक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है। संदर्भ सैन्य दलों की मासिक बारी का है, इसलिए हिन्दी में निहित संज्ञा ‘दल’ स्पष्ट करना स्वाभाविक है।
- source_word: לַחֹדֶשׁ הָרְבִיעִי
  choice: चौथे महीने के लिए
  rationale: ל उपसर्ग मासिक सेवा-बारी के लिए नियुक्ति दर्शाता है; यह अनुवाद प्रशासनिक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: עֲשָׂהאֵל אֲחִי יוֹאָב
  choice: योआब के भाई असाहेल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी रूप ‘असाहेल’ रखा गया है और संबंधवाचक रचना मूल के अर्थ को सीधे व्यक्त करती है।
- source_word: וּזְבַדְיָה בְנוֹ אַחֲרָיו
  choice: और उसके बाद उसका पुत्र जबद्याह था
  rationale: אַחֲרָיו का शाब्दिक अर्थ ‘उसके बाद’ है और यहाँ पद या दायित्व में उत्तराधिकार का संकेत देता है; मुख्य पाठ मूल की संक्षिप्तता और संभावित अस्पष्टता बनाए रखता है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: उसके दल में
  rationale: מַחֲלֻקָה इस अध्याय में सैन्य दल या टुकड़ी है। संख्या बताने के प्रसंग में हिन्दी का ‘दल में’ स्वाभाविक है, यद्यपि עַל का मूल मुहावरा नेतृत्व/नियुक्ति से जुड़ा है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या आधुनिक हिन्दी में दी गई है; सैन्य सूची के संदर्भ से ‘पुरुष’ निहित है और हिन्दी में वाक्य को स्पष्ट करता है।
