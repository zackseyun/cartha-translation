  yaml_path: translation/ot/1_chronicles/027/006.yaml
  text: This was Benaiah[a], a mighty man of the Thirty and over the Thirty; and his division was under Ammizabad his son.
translation:
  language: hi
  text: यह बनायाह था, जो तीस वीरों का एक पराक्रमी योद्धा और उन तीसों के ऊपर था; और उसके दल का प्रभारी उसका पुत्र अम्मीजाबाद था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הוּא
  choice: यह वही ... था
  rationale: यह संकेतवाचक और बलाघातपूर्ण रूप पिछले पद में नामित बनायाह से संबंध स्पष्ट करता है।
- source_word: גִּבּוֹר
  choice: पराक्रमी
  rationale: सैन्य संदर्भ में यह वीरता और युद्ध-कौशल का बोध कराता है; सहज हिन्दी के लिए ‘पराक्रमी’ उपयुक्त है।
- source_word: הַשְּׁלֹשִׁים
  choice: तीस वीरों
  rationale: यह दाऊद से जुड़े विशिष्ट योद्धा-दल का उल्लेख है; हिन्दी में केवल ‘तीस’ की अपेक्षा ‘तीस वीरों’ से आशय स्पष्ट होता है।
- source_word: וְעַל הַשְּׁלֹשִׁים
  choice: और उन तीसों के ऊपर था
  rationale: עַל अधिकार या नेतृत्व की स्थिति दर्शाता है; ‘के ऊपर था’ मूल की संक्षिप्तता बनाए रखता है और विशिष्ट पदवी नहीं जोड़ता।
- source_word: מַחֲלֻקְתּוֹ
  choice: उसके दल
  rationale: अध्याय के संदर्भ में यह बारी-बारी से सेवा करने वाले सैन्य दल को दर्शाता है; ‘दल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עַמִּיזָבָד בְּנוֹ
  choice: उसका पुत्र अम्मीज़ाबाद
  rationale: हिन्दी की स्वाभाविक शब्द-व्यवस्था अपनाते हुए नाम और संबंध दोनों सुरक्षित रखे गए हैं।
