revisions:
- from: यह वही बनायाह था, जो तीस वीरों में पराक्रमी था और उन तीसों के ऊपर था; और उसके दल का नेतृत्व उसका पुत्र अम्मीज़ाबाद करता था।
  to: यह बनायाह था, जो तीस वीरों का एक पराक्रमी योद्धा और उन तीसों के ऊपर था; और उसके दल का प्रभारी उसका पुत्र अम्मीजाबाद था।
