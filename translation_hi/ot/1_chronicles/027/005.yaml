base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/005.yaml
  text: The commander of the third division for the third month was Benaiah son of Jehoiada the chief[a], and in his division were twenty-four thousand.
translation:
  language: hi
  text: तीसरे महीने की तीसरी टुकड़ी का सेनापति, याजक और प्रधान यहोयादा[a] का पुत्र बनायाह था; उसकी टुकड़ी में चौबीस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोयादा का पुत्र बनायाह, याजक और प्रधान था।” इब्रानी पदबंध में ‘याजक’ और ‘प्रधान’ को बनायाह से भी जोड़ा जा सकता है।
    reason: इब्रानी הַכֹּהֵן רֹאשׁ के संदर्भ-संबंध की वैकल्पिक व्याकरणिक समझ को सुरक्षित रखता है, बिना ‘प्रधान याजक’ जैसी अतिरिक्त निश्चित उपाधि लगाए।
lexical_decisions:
- source_word: שַׂר הַצָּבָא
  choice: टुकड़ी का सेनापति
  rationale: שַׂר सैन्य संदर्भ में अधिकारी या सेनापति है। अध्याय की मासिक सैन्य टुकड़ियों के संदर्भ में ‘सेनापति’ स्वाभाविक और स्पष्ट है।
- source_word: הַשְּׁלִישִׁי לַחֹדֶשׁ הַשְּׁלִישִׁי
  choice: तीसरे महीने की तीसरी टुकड़ी
  rationale: पहला ‘तीसरा’ अध्याय में क्रम से गिनाई गई सैन्य टुकड़ी को और दूसरा ‘तीसरा’ महीने को सूचित करता है; इब्रानी में निहित ‘टुकड़ी’ को स्पष्ट किया गया है।
- source_word: בְּנָיָהוּ בֶן יְהוֹיָדָע
  choice: यहोयादा ... का पुत्र बनायाह
  rationale: नामों को हिन्दी बाइबिल में प्रचलित रूपों के अनुसार लिप्यंतरित किया गया है।
- source_word: הַכֹּהֵן רֹאשׁ
  choice: यहोयादा याजक ... वह प्रधान था
  rationale: शब्दक्रम और वाक्य-विन्यास के अनुसार הַכֹּהֵן को यहोयादा का परिचय और רֹאשׁ को बनायाह का विधेय मानना संभव है। दूसरी व्याकरणिक समझ को पादटिप्पणी में रखा गया है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: उसकी टुकड़ी में
  rationale: מַחֲלֻקָה यहाँ सैन्य टुकड़ी है। संख्या बताने वाले सूत्र में हिन्दी का ‘उसकी टुकड़ी में ... थे’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या का सीधा अनुवाद है; सैन्य गणना के संदर्भ में हिन्दी में निहित व्यक्तियों को स्पष्ट करने के लिए ‘पुरुष’ जोड़ा गया है।
theological_decisions:
- issue: הַכֹּהֵן רֹאשׁ में ‘याजक’ और ‘प्रधान’ किससे संबंधित हैं
  choice: यहोयादा को ‘याजक’ और बनायाह को ‘प्रधान’ माना गया है
  alternative: पूरे पदबंध को बनायाह का परिचय मानकर ‘यहोयादा का पुत्र बनायाह प्रधान याजक था’ पढ़ा जा सकता है
  rationale: इब्रानी संक्षिप्त है और दोनों संबंध व्याकरणतः संभव हैं। मुख्य पाठ निकटतम नाम ‘यहोयादा’ के साथ ‘याजक’ जोड़ता है और רֹאשׁ को बनायाह का पद बताता है, जबकि वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘टुकड़ी’ अध्याय की संगठित मासिक सैन्य इकाई को स्पष्ट करती है; पादटिप्पणी मूल की वाक्यगत अस्पष्टता बनाए रखती है।
