  text: The twelfth[a], for the twelfth month, was Heldai the Netophathite, of Othniel[b]; and over his division were twenty-four thousand.
translation:
  language: hi
  text: बारहवें महीने के लिए बारहवाँ नतोपा का निवासी हेल्दै[b] था, जो ओत्नीएल से सम्बन्धित था;[a] और उसके दल के अधीन चौबीस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
