id: 1CH.27.24
reference: 1 Chronicles 27:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יוֹאָ֨ב בֶּן צְרוּיָ֜ה הֵחֵ֤ל לִ/מְנוֹת֙ וְ/לֹ֣א כִלָּ֔ה וַ/יְהִ֥י בָ/זֹ֛את קֶ֖צֶף עַל יִשְׂרָאֵ֑ל וְ/לֹ֤א עָלָה֙ הַ/מִּסְפָּ֔ר בְּ/מִסְפַּ֥ר דִּבְרֵֽי הַ/יָּמִ֖ים לַ/מֶּ֥לֶךְ דָּוִֽיד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/024.yaml
  text: Joab son of Zeruiah began to count[a], but he did not finish; and because of this wrath came upon Israel[b]. And the number was not entered in the account of the chronicles of King David.
translation:
  language: hi
  text: सरूयाह के पुत्र योआब ने गिनती करना शुरू किया, पर उसे पूरा नहीं किया; और इस कारण इस्राएल पर प्रकोप आया। वह संख्या राजा दाऊद के इतिहास-वृत्तांत में दर्ज नहीं की गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵחֵל לִמְנוֹת
  choice: गिनती करना शुरू किया
  rationale: यह החל और מנה के संयोग का सीधा और स्वाभाविक हिन्दी रूप है; प्रसंग जनगणना का है, पर मूल में प्रयुक्त सामान्य क्रिया ‘गिनना’ को बनाए रखा गया है।
- source_word: וְלֹא כִלָּה
  choice: पर उसे पूरा नहीं किया
  rationale: כלה यहाँ आरम्भ किए गए कार्य को पूरा करने का अर्थ देता है; ‘उसे’ गिनती की ओर स्पष्ट संकेत करता है।
- source_word: וַיְהִי בָזֹאת קֶצֶף עַל יִשְׂרָאֵל
  choice: और इस कारण इस्राएल पर प्रकोप आया
  rationale: בָזֹאת को कारणसूचक रूप में और קֶצֶף को न्यायपूर्ण रोष/दंड की गंभीरता वाले ‘प्रकोप’ से व्यक्त किया गया है; प्रकोप के कर्ता को मूल की तरह अनकहा रखा गया है।
- source_word: הַמִּסְפָּר
  choice: वह संख्या
  rationale: यह की गई गिनती से प्राप्त कुल संख्या को सूचित करता है और पहले खंड से शब्दार्थ-संबंध बनाए रखता है।
- source_word: וְלֹא עָלָה
  choice: दर्ज नहीं की गई
  rationale: עלה का शाब्दिक अर्थ ‘ऊपर जाना’ है, पर अभिलेखीय प्रसंग में इसका भाव किसी आधिकारिक लेखे में प्रविष्ट या दर्ज होना है।
- source_word: בְּמִסְפַּר דִּבְרֵי הַיָּמִים
  choice: इतिहास-वृत्तांत में
  rationale: דברי הימים राजकीय वार्षिकी या आधिकारिक ऐतिहासिक अभिलेख को सूचित करता है। निकटस्थ दोहरे מספר को हिन्दी में यांत्रिक ढंग से दोहराने के बजाय अभिप्रेत प्रशासनिक अर्थ स्पष्ट किया गया है।
- source_word: לַמֶּלֶךְ דָּוִיד
  choice: राजा दाऊद के
  rationale: लामेद यहाँ संबंध या स्वामित्व दर्शाता है; ‘राजा दाऊद के’ स्वाभाविक हिन्दी है और निजी रूप से राजा को संख्या सौंपने का अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: प्रकोप के स्रोत को स्पष्ट रूप से परमेश्वर बताना या न बताना
  choice: कर्ता को अनकहा रखते हुए ‘इस्राएल पर प्रकोप आया’
  alternative: ‘यहोवा का प्रकोप इस्राएल पर आया’ अथवा ‘परमेश्वर इस्राएल पर क्रोधित हुआ’
  rationale: व्यापक प्रसंग दिव्य प्रकोप की ओर संकेत करता है, पर इस पद के इब्रानी वाक्य में कर्ता का स्पष्ट नाम नहीं है; इसलिए मूल की धर्मवैचारिक अनिर्दिष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य शैली। ‘इतिहास-वृत्तांत’ से राजकीय वार्षिकी का भाव व्यक्त किया गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी; इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
