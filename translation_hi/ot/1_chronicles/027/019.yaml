  text: ज़बूलून के लिए ओबद्याह का पुत्र यिश्मायाह; नप्ताली के लिए अज्रीएल का पुत्र यरीमोत।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/זְבוּלֻן
  choice: जबूलून के लिए
  rationale: उपसर्ग ל इस प्रशासनिक सूची में कबीले के लिए नियुक्ति या प्रतिनिधित्व का भाव देता है; हिंदी में ‘के लिए’ इसे संक्षेप में बनाए रखता है।
- source_word: יִשְׁמַעְיָהוּ
  choice: यिश्मायाह
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है; आरंभिक व्यंजन और नाम के अंत का रूप स्रोत के निकट रखा गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: בֶּן यहाँ प्रत्यक्ष पुत्र-संबंध बताता है; हिंदी पहचान-सूत्र में ‘का पुत्र’ स्वाभाविक है।
- source_word: עֹבַדְיָהוּ
  choice: ओबद्याह
  rationale: इब्रानी व्यक्तिनाम का प्रचलित और स्रोत-सन्निकट हिंदी रूप चुना गया है।
- source_word: לְ/נַפְתָּלִי
  choice: नप्ताली के लिए
  rationale: उपसर्ग ל संबंधित कबीले के लिए नियुक्त अधिकारी का संकेत देता है; ‘के लिए’ सूची की समानांतर संरचना को भी सुरक्षित रखता है।
- source_word: יְרִימוֹת
  choice: यरीमोत
  rationale: इब्रानी व्यक्तिनाम का सहज देवनागरी लिप्यंतरण, जिसमें अंतिम ת को ‘त’ से दर्शाया गया है।
- source_word: עַזְרִיאֵל
  choice: अज्रीएल
  rationale: व्यक्तिनाम का स्रोत-सन्निकट देवनागरी लिप्यंतरण किया गया है।
