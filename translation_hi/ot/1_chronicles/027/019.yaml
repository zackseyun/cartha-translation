  register: संक्षिप्त प्रशासनिक सूची की मूल समानांतर रचना और अर्धविराम बनाए रखे गए हैं। भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है; अनावश्यक रूप से ‘गोत्र’ जोड़कर मूल से अधिक स्पष्टता नहीं थोपी गई।
