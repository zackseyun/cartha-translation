  text: וְ/עַל֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל לָ/רֽאוּבֵנִ֣י נָגִ֔יד אֱלִיעֶ֖זֶר בֶּן זִכְרִ֑י לַ/שִּׁ֨מְעוֹנִ֔י שְׁפַטְיָ֖הוּ בֶּֽן מַעֲכָֽה־ס־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/016.yaml
  text: 'And over the tribes of Israel: for the Reubenites[a], Eliezer son of Zichri was leader; for the Simeonites, Shephatiah son of Maacah.'
translation:
  language: hi
  text: 'इस्राएल के गोत्रों पर ये अधिकारी थे: रूबेनियों का अगुवा जिक्री का पुत्र एलीएजेर था; और शिमोनियों का अगुवा माका का पुत्र शपत्याह था।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों पर ये अधिकारी थे
  rationale: यह पद पिछले प्रशासनिक विवरण से जुड़ते हुए गोत्रीय नेतृत्व की नई सूची आरम्भ करता है। ‘पर’ अधिकार या देखरेख का भाव रखता है; सहज हिन्दी के लिए निहित सूची-सूचक भाव ‘ये अधिकारी थे’ से व्यक्त किया गया है।
- source_word: לָרְאוּבֵנִי
  choice: रूबेनियों का
  rationale: हिब्रू जातिवाचक रूप कुलपिता रूबेन को नहीं, उसके गोत्र के लोगों को दर्शाता है।
- source_word: נָגִיד
  choice: अगुवा
  rationale: यह शब्द अधिकार के पद पर नियुक्त व्यक्ति को दर्शाता है। ‘अगुवा’ आधुनिक, बोधगम्य हिन्दी है और ‘राजकुमार’ जैसे अनावश्यक राजकीय अर्थ से बचता है।
- source_word: אֱלִיעֶזֶר בֶּן זִכְרִי
  choice: जिक्री का पुत्र एलीएजेर
  rationale: नामों का मानक हिन्दी लिप्यंतरण किया गया है और בֶּן की वंशसूचक रचना को ‘का पुत्र’ से व्यक्त किया गया है।
- source_word: לַשִּׁמְעוֹנִי
  choice: शिमोनियों का
  rationale: जातिवाचक रूप शिमोन के गोत्रीय समुदाय को सूचित करता है; यह पहले खंड के समानांतर है।
- source_word: שְׁפַטְיָהוּ בֶּן מַעֲכָה
  choice: माका का पुत्र शपत्याह
  rationale: नामों को मानक हिन्दी रूप में रखा गया है। माका नाम अन्यत्र पुरुष या स्त्री दोनों के लिए आ सकता है, पर यहाँ पाठ केवल माता-पिता से संबंध बताता है; हिन्दी में ‘पुत्र’ इस अस्पष्टता को नहीं मिटाता कि माका पिता थे या माता।
theological_decisions: []
