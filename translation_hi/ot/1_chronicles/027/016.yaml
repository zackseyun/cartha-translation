  register: भाषा आधुनिक, गरिमापूर्ण और सूचीपरक है। दूसरे खंड में हिब्रू से लुप्त क्रिया और पदवी को हिन्दी में समानांतरता तथा स्पष्टता के लिए दोहराया गया है।
