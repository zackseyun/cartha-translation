translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य-प्रशासनिक संदर्भ के लिए ‘दल’ तथा स्थान-सूचक पहचान के लिए ‘पिरातोनवासी’ चुना गया है। अंग्रेज़ी परामर्श पाठ में ‘बारहवाँ महीना’ है, पर WLC के दिए हुए इब्रानी पाठ और 1 इतिहास 27 के क्रम के अनुसार यहाँ ‘ग्यारहवाँ महीना’ है।
