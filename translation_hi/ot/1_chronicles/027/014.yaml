source:
  edition: WLC
  text: עַשְׁתֵּֽי עָשָׂר֙ לְ/עַשְׁתֵּ֣י עָשָׂ֣ר הַ/חֹ֔דֶשׁ בְּנָיָ֥ה הַ/פִּרְעָתוֹנִ֖י מִן בְּנֵ֣י אֶפְרָ֑יִם וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/014.yaml
  text: For the twelfth month[a], Benaiah the Pirathonite, from the sons of Ephraim; and over his division were twenty-four thousand.
translation:
  language: hi
  text: बारहवें महीने के लिए पिरातोनवासी बनायाह नियुक्त था, जो एप्रैम के वंशजों में से था[a]; और उसके दल में चौबीस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एप्रैम के पुत्रों में से”; यह एप्रैम के गोत्रीय वंश को सूचित करता है।
    reason: मूल इब्रानी की वंश-सूचक अभिव्यक्ति को सुरक्षित रखना।
lexical_decisions:
- source_word: עַשְׁתֵּי עָשָׂר לְעַשְׁתֵּי עָשָׂר הַחֹדֶשׁ
  choice: ग्यारहवाँ दल, अर्थात ग्यारहवें महीने का दल
  rationale: इब्रानी में ‘ग्यारहवाँ’ और ‘ग्यारहवें महीने’ दोनों आते हैं। अध्याय के सैन्य-दल संबंधी संदर्भ को स्पष्ट करने के लिए पहले पद के निहित संज्ञा ‘दल’ को व्यक्त किया गया है। मूल पाठ ‘बारहवाँ’ नहीं, ‘ग्यारहवाँ’ कहता है।
- source_word: בְּנָיָה
  choice: बनायाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַפִּרְעָתוֹנִי
  choice: पिरातोनवासी
  rationale: 'स्थान-सूचक विशेषण को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है: पिरातोन का निवासी।'
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: एप्रैम के वंशजों में से
  rationale: शाब्दिक ‘एप्रैम के पुत्रों में से’ यहाँ निकट पुत्रत्व के बजाय गोत्रीय वंश को सूचित करता है; ‘वंशजों’ से आशय स्वाभाविक और स्पष्ट रहता है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: उसके दल में
  rationale: מַחֲלֻקָה इस अध्याय में उसके अधीन नियुक्त सैन्य दल को दर्शाता है। संख्या बताने वाली हिन्दी संरचना में ‘उसके दल में’ स्वाभाविक है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या का सीधा अनुवाद; सैन्य गणना के संदर्भ में गिने गए व्यक्तियों के लिए ‘पुरुष’ निहित रूप से स्पष्ट किया गया है।
