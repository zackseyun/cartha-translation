  yaml_path: translation/ot/1_chronicles/027/022.yaml
  text: 'For Dan: Azarel son of Jeroham[a]. These were the leaders of the tribes of Israel.'
translation:
  language: hi
  text: 'दान के लिए: यरोहाम का पुत्र अज़रेल। ये इस्राएल के गोत्रों के प्रधान[a] थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मुखिया’ या ‘अधिकारी’।
    reason: इब्रानी שָׂרֵי नेतृत्व, पद या प्रशासनिक अधिकार रखने वालों को सूचित कर सकता है।
lexical_decisions:
- source_word: לְ/דָן
  choice: दान के लिए
  rationale: इस प्रशासनिक सूची में उपसर्ग לְ गोत्र से संबंधित नियुक्त व्यक्ति का शीर्षक देता है; इसलिए ‘दान के लिए’ मूल संरचना और आशय दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲזַרְאֵל
  choice: अज़रेल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट और सुबोध लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: यह वंश-संबंध बताने वाला सामान्य शब्द है; संक्षिप्त प्रशासनिक विवरण में ‘पुत्र’ स्वाभाविक है।
- source_word: יְרֹחָם
  choice: यरोहाम
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: אֵלֶּה
  choice: ये
  rationale: बहुवचन संकेतवाचक सर्वनाम का सीधा और स्वाभाविक अनुवाद।
- source_word: שָׂרֵי
  choice: प्रधान
  rationale: यहाँ शब्द गोत्रों पर नेतृत्व या अधिकार रखने वालों को सूचित करता है; ‘प्रधान’ आधुनिक, गरिमापूर्ण और पर्याप्त व्यापक है, जबकि ‘राजकुमार’ अनावश्यक राजवंशीय अर्थ ला सकता है।
- source_word: שִׁבְטֵי
  choice: गोत्रों के
  rationale: इस्राएल के जनजातीय विभाजनों के लिए हिन्दी बाइबलीय संदर्भ में ‘गोत्र’ स्पष्ट और प्रचलित है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्रीय नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
