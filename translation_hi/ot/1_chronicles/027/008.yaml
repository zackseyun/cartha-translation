base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/008.yaml
  text: The fifth[a], for the fifth month, was the commander Shamhuth the Izrahite; and over his division were twenty-four thousand.
translation:
  language: hi
  text: पाँचवाँ दल पाँचवें महीने के लिए था। उसका सेनापति यिज्राही[a] शम्हूत था, और उसके दल में चौबीस हज़ार सैनिक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जेरही।” कुछ अनुवादों में इब्रानी के इस वंश-सूचक शब्द को परंपरागत रूप से इस प्रकार लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲמִישִׁי
  choice: पाँचवाँ दल
  rationale: क्रमवाचक शब्द यहाँ संज्ञा के रूप में प्रयुक्त है और अध्याय के संदर्भ में पाँचवें सैन्य दल को सूचित करता है; स्पष्टता के लिए ‘दल’ जोड़ा गया है।
- source_word: לַחֹדֶשׁ הַחֲמִישִׁי
  choice: पाँचवें महीने के लिए
  rationale: लामेद यहाँ उस महीने के लिए नियुक्त सेवा-अवधि दर्शाता है; यह हिंदी में प्रशासनिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַשַּׂר
  choice: सेनापति
  rationale: שַׂר का अर्थ प्रधान या अधिकारी हो सकता है; सैन्य सूची के इस संदर्भ में ‘सेनापति’ उपयुक्त और सहज है।
- source_word: שַׁמְהוּת
  choice: शम्हूत
  rationale: मसोरेटिक स्वरांकन के आधार पर व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: הַיִּזְרָח
  choice: यिज्राही
  rationale: इब्रानी व्यंजन और स्वरांकन के निकट जाति अथवा वंश-सूचक रूप रखा गया है; परंपरागत वैकल्पिक पहचान पादटिप्पणी में दी गई है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: और उसके दल में
  rationale: מַחֲלֻקָה इस अध्याय में सैन्य दल को दर्शाता है। हिंदी में संख्या बताने के साथ ‘उसके दल में’ स्वाभाविक है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार सैनिक
  rationale: संख्या का मानक हिंदी रूप दिया गया है; सूची के सैन्य संदर्भ में निहित व्यक्तियों को स्पष्ट करने के लिए ‘सैनिक’ जोड़ा गया है।
