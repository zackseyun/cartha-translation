base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/011.yaml
  text: 'The eighth[a], for the eighth month: Sibbecai the Hushathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: hi
  text: आठवें महीने के लिए आठवाँ अधिकारी हूशाती सिब्बकै था, जेरही; और उसके दल के अधीन चौबीस हज़ार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשְּׁמִינִי
  choice: आठवाँ अधिकारी
  rationale: क्रमसूचक शब्द यहाँ सूची के संदर्भ में लुप्त संज्ञा के साथ आया है। स्वाभाविक हिन्दी में भूमिका स्पष्ट करने के लिए ‘अधिकारी’ जोड़ा गया है, जबकि पद के आशय को अनावश्यक रूप से विशिष्ट नहीं बनाया गया।
- source_word: לַחֹדֶשׁ הַשְּׁמִינִי
  choice: आठवें महीने के लिए
  rationale: ל उपसर्ग इस प्रशासनिक-सैनिक सूची में उस महीने की नियुक्ति या सेवा-अवधि बताता है।
- source_word: סִבְּכַי
  choice: सिब्बकै
  rationale: इब्रानी व्यंजनरूप और हिन्दी में स्वाभाविक लिप्यंतरण के निकट नाम-रूप।
- source_word: הַחֻשָׁתִי
  choice: हूशावासी
  rationale: यह विशेषण किसी स्थान अथवा समूह से संबंध बताता है; ‘-वासी’ आधुनिक हिन्दी में यह अर्थ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: לַזַּרְחִי
  choice: जेरह के वंशजों में से
  rationale: इस संदर्भ में रूप को जेरह से जुड़े कुल या वंश की सदस्यता के रूप में लिया गया है। इससे हिन्दी में एकवचन जातिवाचक रूप की कठोरता से बचते हुए वंशगत संबंध स्पष्ट होता है।
- source_word: מַחֲלֻקְתּוֹ
  choice: उसके दल
  rationale: यहाँ מַחֲלֻקָה संगठित सैनिक इकाई को सूचित करता है। ‘दल’ सामान्य आधुनिक हिन्दी में सहज है और इकाई का अनावश्यक तकनीकी आकार निर्धारित नहीं करता।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या का सीधा आधुनिक हिन्दी रूप दिया गया है। सूची के सैन्य संदर्भ के कारण गिने जा रहे लोगों के लिए ‘पुरुष’ स्पष्टतः जोड़ा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रशासनिक-सैनिक शैली रखी गई है। मूल की अत्यंत संक्षिप्त सूची-रचना को हिन्दी में समझने योग्य बनाने के लिए ‘अधिकारी’, ‘था’ और ‘पुरुष थे’ की पूर्ति की गई है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि לַזַּרְחִי का वंशगत आशय मुख्य पाठ में स्वाभाविक रूप से व्यक्त किया जा सकता है।
