base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/013.yaml
  text: 'The tenth[a], for the tenth month: Mahrai the Netophathite, of the Zerahites; and over his division were twenty-four thousand.'
translation:
  language: hi
  text: दसवें महीने के लिए दसवाँ अधिकारी नेतोपाती महरै था, जो जेरहवंशी था; उसकी टुकड़ी में चौबीस हज़ार थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲשִׂירִי
  choice: दसवाँ अधिकारी
  rationale: क्रमसूचक विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है; अध्याय की सूची के संदर्भ में निहित पद को स्पष्ट करने के लिए ‘अधिकारी’ जोड़ा गया है।
- source_word: לַחֹדֶשׁ הָעֲשִׂירִי
  choice: दसवें महीने के लिए
  rationale: ל उपसर्ग इस अध्याय में मासिक सेवा-क्रम का नियोजन दर्शाता है; यह हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: מַהְרַי
  choice: महरै
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: הַנְּטוֹפָתִי
  choice: नतोपावासी
  rationale: निस्बत रूप नतोपा से उत्पत्ति या निवास दर्शाता है; ‘नतोपावासी’ साधारण हिंदी में अर्थ स्पष्ट करता है।
- source_word: לַזַּרְחִי
  choice: जेरह के कुल का
  rationale: एकवचन निस्बत रूप व्यक्ति की जेरहवंशी कुल-संबद्धता बताता है; ‘कुल’ इस वंशीय अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: उसके दल में ... पुरुष थे
  rationale: מַחֲלֻקָה यहाँ मासिक सैन्य दल को दर्शाता है। हिंदी में यह संख्या-सूचना का स्वाभाविक रूप है, यद्यपि इब्रानी का शाब्दिक विन्यास ‘उसके दल के ऊपर’ है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार
  rationale: संख्या-वाक्यांश का मानक आधुनिक हिंदी रूप।
theological_decisions: []
