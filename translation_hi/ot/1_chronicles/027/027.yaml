  text: Over the vineyards was Shimei the Ramathite[b][a]; and over the produce of the vineyards for the wine cellars was Zabdi the Shiphmite.
translation:
  language: hi
  text: दाख की बारियों की देखरेख रामाती शिमई के हाथ में थी; और दाख की बारियों की उपज[a], जो दाखमधु के भंडारों[b] के लिए थी, उसकी देखरेख शिफ्मी जब्दी के हाथ में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो दाख की बारियों में था”; संदर्भ में इसका आशय संभवतः बारियों की उपज से है।
    reason: lexical_alternative
  - marker: b
    text: या “दाखमधु के भंडारगृहों के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: की देखरेख ... के हाथ में थी
  rationale: इस प्रशासनिक सूची में עַל किसी अधिकारी के दायित्व या निगरानी को दर्शाता है। यह हिंदी में स्वाभाविक रूप से उत्तरदायित्व व्यक्त करता है।
- source_word: הַכְּרָמִים
  choice: दाख की बारियाँ
  rationale: כֶּרֶם का सामान्य अर्थ अंगूर उगाने की बारी है; बहुवचन और निश्चितता को हिंदी में स्वाभाविक ढंग से रखा गया है।
- source_word: שִׁמְעִי
  choice: शिमई
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: הָרָמָתִי
  choice: रामाती
  rationale: यह किसी रामा नामक स्थान से संबंध बताने वाला विशेषण है; स्रोत की संक्षिप्त जातिवाचक/स्थानवाचक संज्ञा को लिप्यंतरित रूप में सुरक्षित रखा गया है।
- source_word: שֶׁבַּכְּרָמִים
  choice: दाख की बारियों की उपज
  rationale: शाब्दिक अर्थ ‘जो दाख की बारियों में था’ है। पहली जिम्मेदारी स्वयं बारियों की और दूसरी उनके भंडारण योग्य फल/उपज की है, इसलिए संदर्भानुसार ‘उपज’ स्पष्ट और स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְאֹצְרוֹת הַיַּיִן
  choice: दाखमधु के भंडारों के लिए
  rationale: אֹצָר भंडार या भंडारगृह को सूचित करता है। יַיִן के साथ यह दाखमधु रखने के स्थान हैं। ‘भंडारों’ स्रोत की व्यापकता बनाए रखता है, जबकि अधिक विशिष्ट विकल्प पादटिप्पणी में है।
- source_word: זַבְדִּי
  choice: जब्दी
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: הַשִּׁפְמִי
  choice: शिफ्मी
  rationale: यह संभवतः किसी स्थान से संबंध बताने वाला विशेषण है। स्थान की सटीक पहचान अनिश्चित होने के कारण इसे अनुमानपूर्वक विस्तार देने के बजाय लिप्यंतरित किया गया है।
