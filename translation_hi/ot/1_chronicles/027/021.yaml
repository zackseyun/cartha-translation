base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/021.yaml
  text: 'for the half-tribe of Manasseh in Gilead: Iddo son of Zechariah[a]; for Benjamin: Jaasiel son of Abner.'
translation:
  language: hi
  text: 'गिलाद में मनश्शे के आधे गोत्र के लिए: जकर्याह का पुत्र इद्दो; और बिन्यामीन के लिए: अब्नेर का पुत्र यासीएल[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याशीएल।”
    reason: व्यक्तिनाम की वैकल्पिक वर्तनी को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: לַ/חֲצִי הַֽ/מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र के लिए
  rationale: प्रशासनिक सूची में חֲצִי मनश्शे के आधे जनजातीय भाग को सूचित करता है; हिन्दी में आशय स्पष्ट करने के लिए ‘गोत्र’ जोड़ा गया है।
- source_word: גִּלְעָדָ/ה
  choice: गिलाद में
  rationale: यहाँ दिशासूचक प्रत्यय सूची के संदर्भ में उस क्षेत्र को पहचानता है जहाँ मनश्शे का यह आधा गोत्र बसा था; इसलिए स्थानवाचक ‘में’ स्वाभाविक है।
- source_word: יִדּוֹ
  choice: इद्दो
  rationale: इब्रानी व्यक्तिनाम का निकट और प्रचलित देवनागरी लिप्यंतरण।
- source_word: בֶּן זְכַרְיָהוּ
  choice: जकर्याह का पुत्र
  rationale: वंशसूचक בֶּן को स्वाभाविक हिन्दी क्रम में ‘का पुत्र’ किया गया है और नाम का परिचित बाइबलीय रूप रखा गया है।
- source_word: לְ/בִנְיָמִן
  choice: बिन्यामीन के लिए
  rationale: उपसर्ग לְ इस प्रशासनिक सूची में उस गोत्र को चिह्नित करता है जिसका अधिकारी आगे नामित है।
- source_word: יַעֲשִׂיאֵל
  choice: यासीएल
  rationale: मसोरेटी स्वरीकरण के अनुरूप व्यक्तिनाम का देवनागरी लिप्यंतरण; वैकल्पिक पारंपरिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בֶּן אַבְנֵר
  choice: अब्नेर का पुत्र
  rationale: मानक वंशसूचक अभिव्यक्ति को स्वाभाविक हिन्दी शब्दक्रम में प्रस्तुत किया गया है।
