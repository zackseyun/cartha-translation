  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी; पद की सूचीगत संरचना बनाए रखने के लिए अर्धविराम और द्विबिंदु प्रयुक्त हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न जकर्याह के बाद था, पर उसका विषय יַעֲשִׂיאֵל का वैकल्पिक नामरूप है; इसलिए हिन्दी मुख्य पाठ में चिह्न यासीएल के बाद रखा गया है।
