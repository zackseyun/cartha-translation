- source_word: יְהוֹנָתָן
  choice: यहोनातान
  rationale: यहाँ मूल पाठ में नाम का पूर्ण रूप יְהוֹנָתָן है; हिंदी लिप्यंतरण में उसे बनाए रखा गया है।
- source_word: בֶּן עֻזִּיָּהוּ
  choice: उज्जियाह के पुत्र
