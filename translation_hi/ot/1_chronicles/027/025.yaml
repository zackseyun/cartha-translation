base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/025.yaml
  text: Over the king’s treasuries was Azmaveth son of Adiel[a], and over the treasuries in the countryside, in the cities, in the villages, and in the towers[b], was Jehonathan son of Uzziah.
translation:
  language: hi
  text: राजा के भंडारों की देखरेख अदिएल के पुत्र अजमावेत के हाथ में थी; और देहात[a], नगरों, गाँवों और मीनारों में स्थित भंडारों की देखरेख उज्जियाह के पुत्र यहोनातान[b] के हाथ में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खेत में”; यहाँ इब्रानी एकवचन का अर्थ संभवतः सामूहिक है और वह नगरों, गाँवों तथा मीनारों से अलग ग्रामीण क्षेत्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “यहोनातान” इब्रानी नाम के पूर्ण रूप को दर्शाता है; कुछ अनुवाद इसे संक्षिप्त करके “योनातान” लिखते हैं।
    reason: lexical_alternative
