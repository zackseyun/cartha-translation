base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/010.yaml
  text: 'The seventh[a], for the seventh month: Helez the Pelonite, from the sons of Ephraim; and over his division were twenty-four thousand.'
translation:
  language: hi
  text: 'सातवाँ[a], सातवें महीने के लिए: एप्रैम के पुत्रों में से पेलोनी[b] हेलेस; उसकी टुकड़ी में चौबीस हज़ार थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सातवाँ सेनानायक” अथवा “सातवाँ अधिकारी।” मूल भाषा में संज्ञा निहित है।
    reason: क्रमवाचक विशेषण का अंडरलक्षित संज्ञा के साथ प्रयोग सुरक्षित रखना।
  - marker: b
    text: या संभवतः “पलती,” जो हेलेस के कुलनाम की एक भिन्न पारंपरिक पहचान को दर्शाता है।
    reason: पेलोनी के वैकल्पिक पारंपरिक पाठ/पहचान को सुरक्षित रखना।
lexical_decisions:
- source_word: הַשְּׁבִיעִי
  choice: सातवाँ
  rationale: सूची के संदर्भ में यह क्रमवाचक विशेषण लुप्त संज्ञा के साथ प्रयुक्त है और सातवें सेनानायक अथवा दल को सूचित करता है; स्रोत की संक्षिप्तता बनाए रखी गई है।
- source_word: לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के लिए
  rationale: इस अध्याय में ל उपसर्ग मासिक सेवा-नियुक्ति दर्शाता है; यह हिंदी में स्वाभाविक रूप से उसी प्रशासनिक अर्थ को व्यक्त करता है।
- source_word: חֶלֶץ
  choice: हेलेस
  rationale: व्यक्तिवाचक नाम का आधुनिक हिंदी ध्वन्यंतरण किया गया है।
- source_word: הַפְּלוֹנִי
  choice: पिलोनी
  rationale: मसोरेटिक पाठ के व्यंजनों के अनुरूप कुल अथवा स्थान-सूचक पद का ध्वन्यंतरण; वैकल्पिक पारंपरिक पहचान पलीती को पादटिप्पणी में रखा गया है।
- source_word: מִן בְּנֵי אֶפְרָיִם
  choice: एप्रैम के वंशजों में से
  rationale: शाब्दिक 'एप्रैम के पुत्रों में से' का स्वाभाविक आधुनिक हिंदी रूप, जो गोत्रीय संबंध स्पष्ट रखता है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: और उसके दल में ... थे
  rationale: מַחֲלֻקָה यहाँ सैन्य दल है। עַל अधिकारी के उस दल पर अधिकार को सूचित करता है; हिंदी वाक्य-विन्यास में संख्या बताने के लिए 'उसके दल में' अधिक स्वाभाविक है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या को शब्दों में रखा गया है। सैन्य सूची के प्रसंग में हिंदी वाक्य पूर्ण और स्पष्ट करने के लिए निहित गणनीय संज्ञा 'पुरुष' जोड़ी गई है।
