base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/031.yaml
  text: Over the flocks was Jaziz the Hagrite[a]. All these were officers over the property that belonged to King David.
translation:
  language: hi
  text: भेड़-बकरियों के झुंडों का अधिकारी हाग्री याज़ीज़ था। ये सभी राजा दाऊद की संपत्ति के अधिकारी थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: का अधिकारी
  rationale: प्रशासनिक सूची में עַל दायित्व या देखरेख को सूचित करता है; हिंदी में ‘का अधिकारी’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַצֹּאן
  choice: भेड़-बकरियों के झुंडों
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, के सामूहिक झुंडों को सूचित कर सकता है; यह चयन अर्थ की व्यापकता बनाए रखता है।
- source_word: יָזִיז
  choice: याज़ीज़
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: הַהַגְרִי
  choice: हाग्री
  rationale: यह जातिसूचक पद है; ‘हाग्री’ हिब्रू रूप का संक्षिप्त और निकट लिप्यंतरण है।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: सूची का सार प्रस्तुत करने वाला सीधा और स्वाभाविक हिंदी वाक्यांश।
- source_word: שָׂרֵי
  choice: अधिकारी
  rationale: यहाँ שָׂרִים राजकीय संपत्ति की देखरेख करने वाले प्रशासनिक पदाधिकारियों को दर्शाता है, इसलिए ‘अधिकारी’ उपयुक्त है।
- source_word: הָרְכוּשׁ
  choice: संपत्ति
  rationale: רְכוּשׁ अधिकार में रखी वस्तुओं, संसाधनों या परिसंपत्तियों को दर्शाता है; इस राजकीय प्रशासनिक संदर्भ में ‘संपत्ति’ स्वाभाविक है।
- source_word: אֲשֶׁר לַמֶּלֶךְ דָּוִיד
  choice: राजा दाऊद की
  rationale: हिब्रू संबंधवाचक संरचना स्वामित्व बताती है; हिंदी की संबंधकारक रचना इसे संक्षेप और स्पष्टता से व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण प्रशासनिक शैली रखी गई है। ‘भेड़-बकरियों के झुंडों’ से צֹאן की सामूहिक और संभावित व्यापक अर्थ-सीमा स्पष्ट होती है। जातिसूचक पद को हिंदी पाठकों के लिए ‘हाग्री’ रूप में लिप्यंतरित किया गया है।
