translation:
  language: hi
  text: और अहीतोपेल राजा का सलाहकार था, और अर्की हूशै राजा का मित्र था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲחִיתֹפֶל
  choice: अहीतोपेल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: יוֹעֵץ
  choice: सलाहकार
  rationale: यह शब्द सलाह देने वाले व्यक्ति को दर्शाता है; राजदरबार के संदर्भ में ‘सलाहकार’ स्वाभाविक और स्पष्ट है।
- source_word: לַמֶּלֶךְ
  choice: राजा का
  rationale: ल संबंध अथवा सेवा को सूचित करता है; हिन्दी में पद-संबंध को स्वाभाविक रूप से ‘राजा का सलाहकार’ कहा जाता है।
- source_word: חוּשַׁי
  choice: हूशै
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित हिन्दी लिप्यंतरण।
- source_word: הָאַרְכִּי
  choice: एरेकी
  rationale: यह हूशै के कुल अथवा स्थान-संबंध की पहचान कराने वाला विशेषण है; इसे अर्थानुवाद किए बिना लिप्यंतरित किया गया है।
- source_word: רֵעַ
  choice: मित्र
  rationale: शब्द का सामान्य अर्थ ‘मित्र’ है; राजकीय संदर्भ में यह विश्वासपात्र सहचर या दरबारी पद का संकेत भी दे सकता है, पर मुख्य पाठ में उस अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
- source_word: וַ / וְ
  choice: और
  rationale: दोनों संयोजक इस पद को आस-पास की सूची से जोड़ते और दोनों कथनों को परस्पर मिलाते हैं।
