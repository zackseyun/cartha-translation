source:
  edition: WLC
  text: וְ/לֹא נָשָׂ֤א דָוִיד֙ מִסְפָּרָ֔/ם לְ/מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וּ/לְ/מָ֑טָּה כִּ֚י אָמַ֣ר יְהוָ֔ה לְ/הַרְבּ֥וֹת אֶת יִשְׂרָאֵ֖ל כְּ/כוֹכְבֵ֥י הַ/שָּׁמָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/023.yaml
  text: But David did not count them from twenty years old and under[b][a], because Yahweh had said he would multiply Israel like the stars of the heavens.
translation:
  language: hi
  text: पर दाऊद ने बीस वर्ष और उससे कम आयु वालों की गिनती नहीं की[a], क्योंकि यहोवा ने कहा था कि वह इस्राएल को आकाश के तारों के समान बढ़ाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी संख्या नहीं ली।” इब्रानी मुहावरे का शाब्दिक अर्थ “उनकी संख्या नहीं उठाई” है, अर्थात उनकी गिनती या जनगणना नहीं की।
    reason: lexical_alternative
  - marker: b
    text: या, “स्वर्ग के तारों के समान।” यह इस्राएल को अत्यन्त बढ़ाने की यहोवा की प्रतिज्ञा की प्रतिध्वनि है।
    reason: cross_reference
lexical_decisions:
- source_word: וְלֹא
  choice: पर ... नहीं
  rationale: संयोजक यहाँ पिछली जनगणना के संदर्भ से विरोध दर्शाता है; आधुनिक हिन्दी में ‘पर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָשָׂא ... מִסְפָּרָם
  choice: उनकी गिनती नहीं की
  rationale: शाब्दिक मुहावरा ‘उनकी संख्या उठाना’ है, जिसका अर्थ गिनना अथवा जनगणना करना है; चुना हुआ रूप हिन्दी में सहज है और जनगणना का आशय बनाए रखता है।
- source_word: לְמִבֶּן עֶשְׂרִים שָׁנָה וּלְמָטָּה
  choice: बीस वर्ष और उससे कम आयु वालों की
  rationale: यह पदबंध बीस वर्ष से नीचे की ओर समावेशी आयु-सीमा बताता है; हिन्दी रूप स्पष्ट और स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कण दाऊद के उस आयु-वर्ग को न गिनने का कारण प्रस्तुत करता है।
- source_word: אָמַר יְהוָה
  choice: यहोवा ने कहा था
  rationale: भूतपूर्व कथन को ‘कहा था’ से व्यक्त किया गया है; יְהוָה को उसके वाचा-संबंधी व्यक्तिनाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: לְהַרְבּוֹת אֶת יִשְׂרָאֵל
  choice: वह इस्राएल को ... बढ़ाएगा
  rationale: क्रिया का अर्थ संख्या में बहुत बढ़ाना है; यह रूप प्रतिज्ञा के भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: כְּכוֹכְבֵי הַשָּׁמָיִם
  choice: आकाश के तारों के समान
  rationale: यह पितृपुरुषों से की गई प्रतिज्ञा की भाषा को प्रतिध्वनित करता है और हिन्दी में गरिमापूर्ण तथा स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिनाम सीधे आया है। हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: इस्राएल को तारों के समान बढ़ाने की प्रतिज्ञा
  choice: प्रतिज्ञा को भविष्यसूचक कथन के रूप में रखा गया
  alternative: इसे केवल ‘बहुत अधिक लोग’ कहकर स्पष्ट करना
  rationale: मूल उपमा और प्रतिज्ञात्मक तनाव को बनाए रखा गया है; व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण रूप अपनाया गया है। ‘आयु वालों’ से आयु-सीमा स्पष्ट की गई है, जबकि ‘आकाश के तारों के समान’ मूल उपमा और प्रतिज्ञा-संबंधी भाषा को सुरक्षित रखता है।
