base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/032.yaml
  text: Jonathan[a], David’s uncle, was a counselor, a man of understanding, and a scribe[b]; and Jehiel son of Hachmoni was with the king’s sons.
translation:
  language: hi
  text: योनातान, जो दाऊद का चाचा था, एक सलाहकार, समझदार व्यक्ति और लेखक था। हकमोनी का पुत्र यहीएल राजा के पुत्रों के साथ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा के पुत्रों के साथ था।” संदर्भ के आधार पर कुछ लोग इसका अर्थ उनकी सेवा करना या उनकी देखरेख करना समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד
  choice: चाचा
  rationale: इस दरबारी और पारिवारिक संदर्भ में यह शब्द दाऊद के पुरुष संबंधी, विशेषतः चाचा, को सूचित करता है। हिंदी में ‘चाचा’ स्वाभाविक और विशिष्ट है।
- source_word: יוֹעֵץ
  choice: सलाहकार
  rationale: यह कृदन्त ऐसे व्यक्ति को दर्शाता है जो आधिकारिक रूप से परामर्श देता था; ‘सलाहकार’ आधुनिक हिंदी में दरबारी पद के लिए स्पष्ट है।
- source_word: אִישׁ מֵבִין
  choice: समझ-बूझ वाला व्यक्ति
  rationale: यह अभिव्यक्ति विवेक और समझ की प्रशंसा करती है। चुना हुआ रूप सहज हिंदी में इस गुण को सुरक्षित रखता है।
- source_word: סוֹפֵר
  choice: शास्त्री
  rationale: राजकीय संदर्भ में यह लिखने-पढ़ने में निपुण अधिकारी या सचिव को सूचित कर सकता है। ‘शास्त्री’ पारंपरिक बाइबलीय पद है और अर्थ को अनावश्यक रूप से केवल सचिवीय कार्य तक सीमित नहीं करता।
- source_word: עִם
  choice: के साथ था
  rationale: इब्रानी पूर्वसर्ग का प्रत्यक्ष अर्थ ‘के साथ’ है। पाठ किसी निरीक्षण या देखरेख की भूमिका को स्पष्ट रूप से नहीं बताता, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: בְּנֵי הַמֶּלֶךְ
  choice: राजा के पुत्रों
  rationale: इब्रानी में स्पष्टतः ‘राजा के पुत्र’ है। ‘राजकुमारों’ की तुलना में यह रूप स्रोत की शब्दावली और लैंगिक विशिष्टता को अधिक निकटता से सुरक्षित रखता है।
- source_word: חַכְמוֹנִי
  choice: हकमोनी
  rationale: इब्रानी नाम का देवनागरी में निकट और प्रचलन-संगत लिप्यंतरण।
