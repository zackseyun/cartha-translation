  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद-सूचक शब्दों में ‘सलाहकार’ वर्तमान हिंदी के अनुकूल है, जबकि ‘शास्त्री’ मूल के व्यापक लेखकीय-प्रशासनिक अर्थ को खुला रखता है। अंतिम वाक्य में अस्पष्ट दरबारी भूमिका को मुख्य पाठ में स्पष्ट नहीं किया गया, बल्कि पादटिप्पणी में संभावित अर्थ बताया गया है।
