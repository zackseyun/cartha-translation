  text: For Judah[a], Elihu, one of David’s brothers; for Issachar, Omri son of Michael.
translation:
  language: hi
  text: यहूदा के लिए, दाऊद के भाइयों में से एलीहू[a]; इस्साकार के लिए, मीकाएल का पुत्र ओम्री।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पाठ में ‘एलीहू’ है। कुछ प्राचीन अनुवादों और व्याख्याकारों में ‘एलीआब’ मिलता है; सम्भवतः इसे अन्य स्थानों पर दाऊद के भाई के नाम के अनुरूप किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: לִיהוּדָה
  choice: यहूदा के लिए
  rationale: उपसर्ग ל इस प्रशासनिक सूची में गोत्र का शीर्षक प्रस्तुत करता है; ‘यहूदा के लिए’ सूची की संक्षिप्त संरचना को बनाए रखता है।
- source_word: אֱלִיהוּ
  choice: एलीहू
  rationale: मसोरेटिक पाठ में नाम אֱלִיהוּ स्पष्ट है, जिसका मानक हिन्दी लिप्यंतरण ‘एलीहू’ है।
- source_word: מֵאֲחֵי דָוִיד
  choice: दाऊद के भाइयों में से
  rationale: מִן और बहुवचन संबंध-रचना का भाव अंशवाचक है; यह वाक्यांश उसी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और स्रोत की शब्दावली के निकट रहता है।
- source_word: לְיִשָׂשכָר
  choice: इस्साकार के लिए
  rationale: यहाँ भी ל सूची में संबंधित गोत्र का परिचय देता है।
- source_word: עָמְרִי
  choice: ओम्री
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן מִיכָאֵל
  choice: मीकाएल का पुत्र
  rationale: हिब्रू की सामान्य पितृनाम-सूचक रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त किया गया है।
