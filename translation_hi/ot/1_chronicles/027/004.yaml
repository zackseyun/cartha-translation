  text: וְ/עַ֞ל מַחֲלֹ֣קֶת הַ/חֹ֣דֶשׁ הַ/שֵּׁנִ֗י דּוֹדַ֤י הָ/אֲחוֹחִי֙ וּ/מַ֣חֲלֻקְתּ֔/וֹ וּ/מִקְל֖וֹת הַ/נָּגִ֑יד וְ/עַל֙ מַחֲלֻקְתּ֔/וֹ עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/004.yaml
  text: Over the division for the second month was Dodai the Ahohite[a], and Mikloth was the leader over his division; and in his division were twenty-four thousand.
translation:
  language: hi
  text: दूसरे महीने के दल का अधिकारी अहोही दोदै था; उसके दल पर मिक्लोत प्रधान था[a]। उसके दल में चौबीस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसका दल, और मिक्लोत प्रधान”; इब्रानी वाक्य-क्रम संक्षिप्त है। व्याख्याकारों में मतभेद है कि मिक्लोत दोदै के दल में उसके अधीन प्रधान था या उसी दल पर नियुक्त अधिकारी।
    reason: alternative_reading
lexical_decisions:
- source_word: מַחֲלֹקֶת / מַחֲלֻקְתּוֹ
  choice: दल / उसके दल
  rationale: यहाँ यह शब्द महीने-महीने सेवा करने वाली संगठित सैन्य इकाई को दर्शाता है। आधुनिक हिन्दी में ‘दल’ स्वाभाविक और संक्षिप्त है।
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने
  rationale: मासिक सेवा-क्रम में साधारण क्रमवाचक समय-सूचक अभिव्यक्ति।
- source_word: דּוֹדַי
  choice: दोदै
  rationale: पद के मसोरी व्यंजन-पाठ में दिए नामरूप को हिन्दी में लिप्यंतरित किया गया है; संबंधित ‘दोदो’ रूप को यहाँ नहीं अपनाया गया।
- source_word: הָאֲחוֹחִי
  choice: अहोही
  rationale: यह कुल अथवा वंश-संबंधी विशेषण है; हिन्दी में नाम के साथ विशेषण रूप में रखा गया है।
- source_word: וּמִקְלוֹת
  choice: मिक्लोत
  rationale: व्यक्तिवाचक नाम का निकट हिन्दी लिप्यंतरण।
- source_word: הַנָּגִיד
  choice: प्रधान
  rationale: यह शब्द नेतृत्व या अधिकार रखने वाले व्यक्ति को बताता है। ‘प्रधान’ प्रशासनिक-सैन्य संदर्भ के अनुकूल है और किसी अधिक विशिष्ट पद को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या को स्वाभाविक हिन्दी शब्दों में दिया गया है; संदर्भ सैन्य दल की जनसंख्या का है, इसलिए स्पष्टता के लिए ‘पुरुष’ जोड़ा गया है।
theological_decisions:
- issue: וּמַחֲלֻקְתּוֹ וּמִקְלוֹת הַנָּגִיד וְעַל מַחֲלֻקְתּוֹ की संक्षिप्त और अस्पष्ट वाक्य-संरचना
  choice: मिक्लोत को दोदै के दल में प्रधान के रूप में प्रस्तुत किया गया
  alternative: ‘और उसका दल, और मिक्लोत प्रधान था’ अथवा मिक्लोत को उसी दल पर नियुक्त मुख्य अधिकारी समझना
  rationale: इब्रानी क्रम संक्षिप्त है और मिक्लोत तथा दोदै के अधिकार-संबंध को पूरी तरह स्पष्ट नहीं करता। मुख्य पाठ पठनीय अर्थ देता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। सैन्य-प्रशासनिक संदर्भ में ‘दल’, ‘अधिकारी’ और ‘प्रधान’ जैसे प्रचलित शब्द चुने गए हैं। मूल पाठ की संक्षिप्त संरचना से उत्पन्न अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
