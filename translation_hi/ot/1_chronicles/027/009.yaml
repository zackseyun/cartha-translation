  yaml_path: translation/ot/1_chronicles/027/009.yaml
  text: 'The sixth, for the sixth month: Ira son of Ikkesh the Tekoite; and over his division were twenty-four thousand.'
translation:
  language: hi
  text: 'छठे महीने के लिए छठा: तकोआवासी इरा, इक्केश का पुत्र; उसके दल के अधीन चौबीस हज़ार थे।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַשִּׁשִּׁי
  choice: छठा था
  rationale: क्रमसूचक शब्द इस सूची में लुप्त पद के साथ प्रयुक्त है; संदर्भ से छठा प्रधान या अधिकारी अभिप्रेत है। हिंदी में संक्षिप्तता और स्वाभाविकता बनाए रखते हुए पद को स्पष्ट रूप से नहीं जोड़ा गया।
- source_word: לַחֹדֶשׁ הַשִּׁשִּׁי
  choice: छठे महीने के लिए
  rationale: ל यहाँ मासिक सेवा-नियुक्ति का भाव देता है; यह अनुवाद प्रशासनिक क्रम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עִירָא
  choice: इरा
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण।
- source_word: בֶן עִקֵּשׁ
  choice: इक्केश का पुत्र
  rationale: इब्रानी पितृनाम-संबंध का सीधा और स्वाभाविक हिंदी रूप।
- source_word: הַתְּקוֹעִי
  choice: तकोआवासी
  rationale: यह जातिवाचक विशेषण तकोआ के निवासी को दर्शाता है; ‘तकोआवासी’ संक्षिप्त और स्पष्ट है।
- source_word: וְעַל מַחֲלֻקְתּוֹ
  choice: उसके दल में ... पुरुष थे
  rationale: מַחֲלֻקָה इस अध्याय में सैन्य सेवा-दल या क्रमिक इकाई है। हिंदी वाक्य-विन्यास में संख्या को उस दल की जनशक्ति के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार
  rationale: संख्या का प्रचलित आधुनिक हिंदी रूप; संदर्भानुसार ‘पुरुष’ स्पष्टता के लिए जोड़ा गया है।
