lexical_decisions:
- source_word: לְ/לֵוִי
  choice: लेवी के लिए
  rationale: प्रशासनिक सूची में उपसर्ग לְ उस वंश या समूह को सूचित करता है जिसके लिए नामित व्यक्ति नियुक्त था। मूल में पूर्वज का एकवचन नाम ‘लेवी’ है, इसलिए ‘लेवियों के लिए’ की व्याख्यात्मक बहुवचन अभिव्यक्ति से बचा गया है।
- source_word: חֲשַׁבְיָה
  choice: हशब्याह
  rationale: व्यक्तिनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶן
  choice: जो ... का पुत्र था
  rationale: हिब्रू वंशसूचक संबंध को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: קְמוּאֵל
  choice: कमूएल
  rationale: व्यक्तिनाम का हिब्रू के आधार पर देवनागरी लिप्यंतरण।
- source_word: לְ/אַהֲרֹן
  choice: हारून के लिए
  rationale: ‘लेवी के लिए’ के समानांतर मूल के לְ और पूर्वज के नाम ‘हारून’ को बनाए रखा गया है; आशय संभवतः हारून का याजकीय घराना है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: צָדוֹק
  choice: सादोक
  rationale: व्यक्तिनाम का प्रचलित और स्रोत-संगत हिन्दी लिप्यंतरण।
theological_decisions:
- issue: क्या ‘हारून’ को मुख्य पाठ में हारून के याजकीय घराने के रूप में स्पष्ट किया जाए
  choice: मुख्य पाठ में मूल का पूर्वज-नाम ‘हारून’ बनाए रखना
  alternative: हारून के घराने के लिए / हारूनवंशियों के लिए
  rationale: हिब्रू पाठ केवल ‘हारून के लिए’ कहता है। विस्तृत रूप आशय को स्पष्ट करता, पर मूल की संक्षिप्तता और संभावित लक्षणा को व्याख्यात्मक ढंग से निश्चित कर देता; इसलिए स्पष्टीकरण पादटिप्पणी में रखा गया है।
