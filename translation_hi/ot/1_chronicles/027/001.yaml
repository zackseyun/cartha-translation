  text: וּ/בְנֵ֣י יִשְׂרָאֵ֣ל לְֽ/מִסְפָּרָ֡/ם רָאשֵׁ֣י הָ/אָב֣וֹת וְ/שָׂרֵ֣י הָֽ/אֲלָפִ֣ים וְ/הַ/מֵּא֡וֹת וְ/שֹׁטְרֵי/הֶם֩ הַ/מְשָׁרְתִ֨ים אֶת הַ/מֶּ֜לֶךְ לְ/כֹ֣ל דְּבַ֣ר הַֽ/מַּחְלְק֗וֹת הַ/בָּאָ֤ה וְ/הַ/יֹּצֵאת֙ חֹ֣דֶשׁ בְּ/חֹ֔דֶשׁ לְ/כֹ֖ל חָדְשֵׁ֣י הַ/שָּׁנָ֑ה הַֽ/מַּחֲלֹ֨קֶת֙ הָֽ/אַחַ֔ת עֶשְׂרִ֥ים וְ/אַרְבָּעָ֖ה אָֽלֶף׀׀־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/001.yaml
  text: The sons of Israel according to their number—the heads of fathers’ houses[a], and the commanders of thousands and of hundreds[c][b], and their officers who served the king in every matter of the divisions that came in and went out month by month throughout all the months of the year—each division was twenty-four thousand.
translation:
  language: hi
  text: इस्राएल के पुत्रों की संख्या के अनुसार—पितृकुलों के मुखिया[a], हजारों और सैकड़ों के सेनापति, और उनके अधिकारी—दलों के हर काम में राजा की सेवा करते थे। ये दल वर्ष के सभी महीनों में महीने-दर-महीने आते और जाते थे। प्रत्येक दल चौबीस हजार का था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पिताओं के मुखिया”; यह पितृवंश पर आधारित कुलों के मुखियाओं के लिए एक प्रशासनिक पद था।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल अभिव्यक्ति का औपचारिक रूप बनाए रखता है; प्रसंग में इसका सामूहिक अर्थ इस्राएली जन है। आरंभिक ו को अलग संयोजक से व्यक्त करना हिन्दी में आवश्यक नहीं।
- source_word: לְמִסְפָּרָם
  choice: उनकी गिनती के अनुसार
  rationale: यह सैन्य-प्रशासनिक गणना या सूचीबद्ध संख्या का भाव व्यक्त करता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पूर्वज-आधारित सामाजिक और प्रशासनिक इकाइयों के अगुओं के लिए प्रयुक्त तकनीकी पद है।
- source_word: וְשָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: हज़ारों और सैकड़ों के सेनापति
  rationale: שׂרים यहाँ सैन्य नेतृत्व को सूचित करता है; संख्या-आधारित इकाइयों की मूल संरचना भी सुरक्षित रहती है।
- source_word: וְשֹׁטְרֵיהֶם
  choice: और उनके अधिकारी
  rationale: שֹׁטְרִים प्रशासनिक अधिकारियों को सूचित कर सकता है; केवल 'लेखक' कहना इस प्रसंग में अत्यधिक संकीर्ण होगा।
- source_word: הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: जो ... राजा की सेवा करते थे
  rationale: कृदंत निरंतर आधिकारिक सेवा बताता है; हिन्दी में यह सहज और पर्याप्त व्यापक है।
- source_word: לְכֹל דְּבַר הַמַּחְלְקוֹת
  choice: दलों से संबंधित हर काम में
  rationale: דבר यहाँ काम, विषय या कार्य-व्यवस्था का अर्थ देता है; यह हिन्दी रूप प्रशासनिक दायरे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַבָּאָה וְהַיֹּצֵאת חֹדֶשׁ בְּחֹדֶשׁ
  choice: हर महीने बारी-बारी से सेवा में आते और जाते थे
  rationale: शाब्दिक आने-जाने को रखते हुए प्रसंगगत घूर्णन-सेवा स्पष्ट की गई है; 'सेवा में' पूरक अर्थ के रूप में फुटनोट द्वारा संकेतित है।
- source_word: לְכֹל חָדְשֵׁי הַשָּׁנָה
  choice: वर्ष के सभी महीनों में
  rationale: यह पूरे वार्षिक चक्र में मासिक व्यवस्था को स्पष्ट करता है।
- source_word: הַמַּחֲלֹקֶת הָאַחַת
  choice: प्रत्येक दल
  rationale: शाब्दिक रूप 'एक दल' है, पर यहाँ निर्माण का अर्थ वितरणात्मक है—हर अलग दल।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: संख्या प्रत्यक्ष है; 'पुरुष' हिन्दी में दल की गिनी हुई सदस्य-संख्या स्पष्ट करता है, यद्यपि मूल में संज्ञा अध्याहृत है।
