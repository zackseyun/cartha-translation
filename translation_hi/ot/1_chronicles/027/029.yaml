  text: Over the herds grazing in Sharon was Shitrai the Sharonite[b][a], and over the herds in the valleys was Shaphat son of Adlai.
translation:
  language: hi
  text: शारोन में चरनेवाले गाय-बैलों[a] का अधिकारी शारोनी शित्रै था[b], और घाटियों में गाय-बैलों का अधिकारी अदलै का पुत्र शापात था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गोवंश के झुंड।”
    reason: lexical_alternative
  - marker: b
    text: शारोन इस्राएल का समुद्रतटीय मैदानी क्षेत्र था; “शारोनी” का अर्थ है शारोन का निवासी।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַל
  choice: का अधिकारी
  rationale: प्रशासनिक सूची में עַל जिम्मेदारी या देखरेख को सूचित करता है; हिंदी में ‘का अधिकारी’ इस आशय को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הַבָּקָר
  choice: गाय-बैल
  rationale: בקר गोवंश अथवा मवेशियों के झुंड को दर्शाता है। ‘गाय-बैल’ सामान्य आधुनिक हिंदी में आशय स्पष्ट करता है, जबकि ‘मवेशी’ का व्यापक अर्थ अन्य पशुओं को भी समेट सकता है।
- source_word: הָרֹעִים
  choice: चरनेवाले
  rationale: רעה का कृदंत यहाँ पशुओं के चरने को बताता है; ‘चरनेवाले’ स्रोत की व्याकरणिक भूमिका को सहज हिंदी में बनाए रखता है।
- source_word: בַּשָּׁרוֹן
  choice: शारोन में
  rationale: शारोन भौगोलिक नाम है; सीधा स्थानवाचक अनुवाद स्रोत के अनुरूप है।
- source_word: שטרי
  choice: शित्रै
  rationale: व्यक्तिवाचक नाम का हिब्रू रूप के निकट देवनागरी लिप्यंतरण।
- source_word: הַשָּׁרוֹנִי
  choice: शारोनी
  rationale: यह क्षेत्र-संबंधी विशेषण शित्रै को शारोन का निवासी बताता है; ‘शारोनी’ हिब्रू रूप की संक्षिप्तता बनाए रखता है और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בָּעֲמָקִים
  choice: घाटियों में
  rationale: עמקים का सीधा बहुवचन अर्थ ‘घाटियाँ’ है; यह भौगोलिक अभिव्यक्ति हिंदी में स्वाभाविक है।
- source_word: שָׁפָט
  choice: शापात
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן עַדְלָי
  choice: अदलै का पुत्र
  rationale: हिब्रू पितृनाम-सूचक रचना का स्पष्ट और औपचारिक हिंदी रूप।
