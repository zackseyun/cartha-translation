    reason: lexical_alternative
  - marker: b
    text: या, ‘सेनाओं के अधिकारियों।’ इब्रानी शब्द का सामान्य अर्थ ‘सेनाएँ’ या ‘सैन्य समूह’ है; इस अध्याय के मासिक संगठन के प्रसंग में ‘सैन्य दल’ अभिप्रेत हो सकता है।
