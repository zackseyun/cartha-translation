  choice: पेरेस के वंशजों में से
  rationale: शाब्दिक रूप से ‘पेरेस के पुत्रों में से’; वंशावली के प्रसंग में यह व्यापक वंश-परंपरा को सूचित करता है। आधुनिक हिन्दी में ‘वंशजों में से’ अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: הָרֹאשׁ
  choice: मुखिया
  rationale: यहाँ רֹאשׁ सर्वोच्च नेतृत्व या अधिकार रखने वाले व्यक्ति की पदवी है; ‘मुखिया’ इस सैन्य-प्रशासनिक संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: לְכָל שָׂרֵי הַצְּבָאוֹת
  choice: सेना की सभी टुकड़ियों के प्रधानों का
  rationale: לְ यहाँ अधिकार-क्षेत्र का संबंध बताता है। צְבָאוֹת का मूल अर्थ ‘सेनाएँ/दल’ हो सकता है, पर अध्याय के मासिक सैन्य संगठन में ‘सेना की टुकड़ियाँ’ प्रसंगानुकूल है।
- source_word: לַחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने के लिए
  rationale: यह वाक्यांश मासिक सेवा-चक्र की पहली अवधि को निर्दिष्ट करता है; ‘पहले महीने के लिए’ वर्तमान हिन्दी में स्पष्ट है।
