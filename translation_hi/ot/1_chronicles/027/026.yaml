source:
  edition: WLC
  text: וְ/עַ֗ל עֹשֵׂי֙ מְלֶ֣אכֶת הַ/שָּׂדֶ֔ה לַ/עֲבֹדַ֖ת הָ/אֲדָמָ֑ה עֶזְרִ֖י בֶּן כְּלֽוּב־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/026.yaml
  text: And over those who did the work of the field for the cultivation of the ground was Ezri son of Chelub[a][b].
translation:
  language: hi
  text: और भूमि जोतने के लिए खेत का काम करने वालों पर कलूब का पुत्र एज्री नियुक्त था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: और ... पर ... नियुक्त था
  rationale: प्रशासनिक सूची में עַל किसी कार्यक्षेत्र पर अधिकारी होने का भाव देता है; हिंदी में ‘पर ... नियुक्त था’ यह संबंध स्वाभाविक रूप से व्यक्त करता है और וְ का संयोजक बल भी बनाए रखता है।
- source_word: עֹשֵׂי מְלֶאכֶת הַשָּׂדֶה
  choice: खेतों में काम करने वालों
  rationale: यह सहभागी पदबंध खेत के काम में लगे लोगों को सूचित करता है। हिंदी में यह संक्षिप्त और सहज है; बहुवचन ‘खेतों’ कृषि-कार्य के सामान्य क्षेत्र को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַעֲבֹדַת הָאֲדָמָה
  choice: खेती के लिए
  rationale: संदर्भ में עֲבֹדָה और אֲדָמָה का संयुक्त अर्थ मिट्टी को कृषि के लिए जोतने-काम में लेने से है। ‘खेती के लिए’ सामान्य आधुनिक हिंदी में उद्देश्य को स्पष्ट रखता है, बिना अतिरिक्त तकनीकी अर्थ जोड़े।
- source_word: עֶזְרִי בֶּן כְּלוּב
  choice: कलूब का पुत्र एज्री
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और בֶּן को प्रशासनिक वंश-सूचना के अनुरूप ‘का पुत्र’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण प्रशासनिक शैली। वाक्य-क्रम हिंदी की स्वाभाविकता के अनुसार रखा गया है, जबकि अधिकारी, कार्यकर्ता और कृषि-कार्य का मूल संबंध सुरक्षित है।
