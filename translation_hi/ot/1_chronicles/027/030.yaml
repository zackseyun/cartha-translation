  text: Over the camels was Obil the Ishmaelite[a], and over the female donkeys was Jehdeiah the Meronothite.
translation:
  language: hi
  text: ऊँटों की देखरेख इश्माएली ओबील करता था, और गधियों की देखरेख मेरोनोती यहेदयाह करता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: की देखरेख ... करता था
  rationale: प्रशासनिक सूची में עַל दायित्व या निगरानी का बोध कराता है। हिंदी में यह प्रयोग स्वाभाविक है और पद का संक्षिप्त सूचीगत स्वर बनाए रखता है।
- source_word: הַגְּמַלִּים
  choice: ऊँटों
  rationale: निश्चित बहुवचन संज्ञा का सीधा और स्वाभाविक हिंदी रूप।
- source_word: אוֹבִיל
  choice: ओबील
  rationale: व्यक्तिनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַיִּשְׁמְעֵאלִי
  choice: इश्माएली
  rationale: यह जातीय अथवा कुल-संबंधी विशेषण है; हिंदी में प्रचलित बाइबलीय रूप 'इश्माएली' इस पहचान को संक्षेप में सुरक्षित रखता है।
- source_word: הָאֲתֹנוֹת
  choice: गदहियों
  rationale: हिब्रू אָתוֹן विशेष रूप से मादा गधे को दर्शाता है; 'गदहियों' इस लैंगिक विशिष्टता को सहज हिंदी में बनाए रखता है।
- source_word: יֶחְדְּיָהוּ
  choice: यहदयाह
  rationale: व्यक्तिनाम को हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַמֵּרֹנֹתִי
  choice: मेरोनोती
  rationale: संभवतः स्थान या कुल से जुड़ा जातिवाचक संबोधन है; लिप्यंतरण मूल की पहचान और उसकी संभावित अस्पष्टता दोनों को सुरक्षित रखता है।
