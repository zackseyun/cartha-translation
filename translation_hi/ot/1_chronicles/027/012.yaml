base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/027/012.yaml
  text: 'The ninth, for the ninth month: Abiezer the Anathothite, from Benjamin; and over his division were twenty-four thousand.'
translation:
  language: hi
  text: नौवें महीने के लिए नौवाँ सेनापति अनातोतवासी अबीएजेर था, जो बिन्यामीन के गोत्र से था। उसके दल में चौबीस हज़ार पुरुष थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַתְּשִׁיעִי לַחֹדֶשׁ הַתְּשִׁיעִי
  choice: नौवें महीने के लिए नौवाँ सेनापति
  rationale: सूची के प्रसंग में केवल ‘नौवाँ’ का आशय उस महीने के नियुक्त दल-प्रमुख से है; ‘सेनापति’ जोड़ने से हिंदी में निहित अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: אֲבִיעֶזֶר הָעַנְּתֹתִי
  choice: अनातोतवासी अबीएजेर
  rationale: व्यक्तिनाम और स्थान-संबंधी उपाधि का स्वाभाविक हिंदी रूप; उपाधि बताती है कि वह अनातोत का निवासी था।
- source_word: ל/בנימיני
  choice: जो बिन्यामीन के गोत्र से था
  rationale: मसोरेटिक पाठ में रूप असामान्य है, पर संदर्भ में बिन्यामीन से जनजातीय संबंध अभिप्रेत है; इसे केवल ‘बिन्यामीनी’ की अपेक्षा सामान्य पाठक के लिए स्पष्ट किया गया है।
- source_word: מַחֲלֻקְתּוֹ
  choice: उसके दल
  rationale: यहाँ मासिक सैन्य सेवा-विभाग अभिप्रेत है; ‘दल’ सहज और प्रसंगानुकूल है।
- source_word: עֶשְׂרִים וְאַרְבָּעָה אָלֶף
  choice: चौबीस हज़ार पुरुष
  rationale: गिनती सैन्य दल के सदस्यों की है; हिंदी में ‘पुरुष’ जोड़ने से संख्या का संदर्भ स्पष्ट होता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सूची-संगत शैली रखी गई है। मूल पद की दो खंडों वाली संरचना को दो वाक्यों में प्रस्तुत किया गया है, ताकि सामान्य पाठक पदानुक्रम और दल की संख्या तुरंत समझ सके।
