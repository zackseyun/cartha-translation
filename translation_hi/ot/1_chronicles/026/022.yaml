source:
  edition: WLC
  text: בְּנֵ֖י יְחִֽיאֵלִ֑י זֵתָם֙ וְ/יוֹאֵ֣ל אָחִ֔י/ו עַל אֹצְר֖וֹת בֵּ֥ית יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/022.yaml
  text: 'The sons of Jehieli: Zetham and Joel his brother were over the treasuries of the house of Yahweh[a].'
translation:
  language: hi
  text: यहीएली के पुत्र—जेताम और उसका भाई योएल—याहवे के भवन[a] के भंडारों के अधिकारी थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “याहवे का घर”; परंपरागत रूप से “प्रभु का भवन” भी अनूदित।
    reason: शाब्दिक अर्थ और पारंपरिक ईश्वरीय-नाम प्रस्तुति बताने के लिए।
lexical_decisions:
- source_word: בְּנֵי יְחִיאֵלִי
  choice: यहीएली के पुत्र
  rationale: בְּנֵי का सीधा अर्थ ‘पुत्र’ है; प्रशासनिक और वंशावली संदर्भ में इसे बनाए रखना उचित है। יְחִיאֵלִי को यहाँ व्यक्ति का नाम माना गया है, यद्यपि विशेषणात्मक ‘यहीएली वंश के’ भी संभव है।
- source_word: זֵתָם
  choice: जेताम
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: וְיוֹאֵל אָחִיו
  choice: और उसका भाई योएल
  rationale: אָחִיו में एकवचन पुल्लिंग प्रत्यय है; इसलिए योएल को जेताम का भाई बताने वाली इब्रानी संरचना सुरक्षित रखी गई है।
- source_word: עַל אֹצְרוֹת
  choice: भंडारों के अधिकारी थे
  rationale: प्रशासनिक संदर्भ में עַל दायित्व या देखरेख सूचित करता है। אֹצְרוֹת से मंदिर के कोष अथवा भंडार-स्थान अभिप्रेत हो सकते हैं; ‘भंडारों’ से यह व्यापकता बनी रहती है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ है और यहाँ उपासना-स्थल के लिए है। יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि में बदले बिना प्रकट करता है; पादटिप्पणी पारंपरिक रूप से प्रचलित ‘प्रभु’ से पाठक को परिचित कराती है।
- issue: בֵּית יְהוָה का अर्थ
  choice: याहवे का भवन
  alternative: याहवे का मंदिर
  rationale: ‘भवन’ मूल के रूपक और शब्दावली के अधिक निकट है, जबकि संदर्भ में इसका आशय मंदिर से है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण प्रशासनिक शैली रखी गई है। नामों का सरल देवनागरी लिप्यंतरण किया गया है और इब्रानी एकवचन ‘उसका भाई’ को अस्पष्ट किए बिना सुरक्षित रखा गया है।
