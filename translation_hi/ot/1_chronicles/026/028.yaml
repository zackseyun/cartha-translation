  text: וְ/כֹ֨ל הַֽ/הִקְדִּ֜ישׁ שְׁמוּאֵ֤ל הָ/רֹאֶה֙ וְ/שָׁא֣וּל בֶּן קִ֔ישׁ וְ/אַבְנֵ֣ר בֶּן נֵ֔ר וְ/יוֹאָ֖ב בֶּן צְרוּיָ֑ה כֹּ֚ל הַ/מַּקְדִּ֔ישׁ עַ֥ל יַד שְׁלֹמִ֖ית וְ/אֶחָֽי/ו־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/028.yaml
  text: And all that Samuel the seer[a], Saul son of Kish, Abner son of Ner[b], and Joab son of Zeruiah had dedicated—everything that anyone had dedicated—was under the care of Shelomith and his brothers.
translation:
  language: hi
  text: शमूएल दर्शी[a], कीश के पुत्र शाऊल, नेर के पुत्र अब्नेर और सरूयाह के पुत्र योआब ने जो कुछ समर्पित किया था—और जो कुछ भी किसी ने समर्पित किया था—वह सब शलोमीत और उसके भाइयों की देखरेख[b] में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दर्शी’ इब्रानी पदवी רֹאֶה है, जो भविष्यद्वक्ता के लिए प्रयुक्त एक प्राचीन शब्द था।
    reason: cultural_note
  - marker: b
    text: या ‘के प्रभार में’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַהִקְדִּישׁ / הַמַּקְדִּישׁ
  choice: समर्पित किया था
  rationale: קדשׁ के हिफ़ील रूप यहाँ वस्तुओं को पवित्र उपयोग के लिए अलग करके देने का भाव व्यक्त करते हैं। ‘समर्पित किया था’ आधुनिक हिन्दी में स्वाभाविक है और भंडार के संदर्भ के अनुकूल है।
- source_word: שְׁמוּאֵל הָרֹאֶה
  choice: शमूएल दर्शी
  rationale: רֹאֶה एक पुराने भविष्यद्वक्ताई पदनाम का शब्द है। ‘दर्शी’ उसके विशिष्ट अर्थ को बनाए रखता है, उसे सामान्य ‘भविष्यद्वक्ता’ में नहीं बदलता।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-सूचक सूत्र का यहाँ सीधा अर्थ ‘पुत्र’ है। हिन्दी वाक्य-विन्यास के अनुसार ‘कीश के पुत्र शाऊल’ आदि रूप अपनाया गया है।
- source_word: כֹּל הַמַּקְדִּישׁ
  choice: जो कुछ भी किसी ने समर्पित किया था
  rationale: כֹּל के साथ एकवचन कृदंत सामूहिक और व्यापक अर्थ देता है। यह अनुवाद पहले उल्लिखित समर्पित वस्तुओं से आगे सभी दाताओं द्वारा समर्पित वस्तुओं को समेटता है।
- source_word: עַל יַד
  choice: की देखरेख में
  rationale: प्रशासनिक संदर्भ में यह मुहावरा किसी के प्रभार या निगरानी में होने का अर्थ देता है; ‘देखरेख में’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: שְׁלֹמִית וְאֶחָיו
  choice: शलोमीत और उसके भाई
  rationale: व्यक्तिनाम को लिप्यंतरित किया गया है और אֶחָיו का सीधा अर्थ ‘उसके भाई’ रखा गया है; व्यापक ‘कुटुम्बी’ अर्थ संभव होने पर भी संदर्भ में ‘भाई’ अधिक स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। नामों को प्रचलित हिन्दी बाइबलीय रूपों के निकट लिप्यंतरित किया गया है। दोहराए गए כֹּל को ‘जो कुछ…वह सब’ तथा मध्यवर्ती विस्तार से व्यक्त किया गया है, ताकि इब्रानी का सर्वसमावेशी और पुनरुक्त बल बना रहे।
