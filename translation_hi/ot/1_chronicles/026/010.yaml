base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/010.yaml
  text: 'And Hosah[a], from the sons of Merari, had sons: Shimri the chief, though he was not the firstborn; his father made him chief.'
translation:
  language: hi
  text: 'और मरारी के वंशजों में से होसा के पुत्र ये थे: प्रधान शिम्री—यद्यपि वह ज्येष्ठ पुत्र नहीं था[a], फिर भी उसके पिता ने उसे प्रधान नियुक्त किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि वह ज्येष्ठ पुत्र नहीं था”; इब्रानी संयोजक को कारण अथवा व्याख्या बताने वाला भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחֹסָה
  choice: और ... होसा के
  rationale: सूची की पिछली कड़ी से संबंध बनाए रखने के लिए וּ को ‘और’ तथा सूची-संदर्भ में संबंध/अधिकार सूचित करने वाले לְ को स्वाभाविक हिंदी में ‘होसा के पुत्र’ संरचना द्वारा व्यक्त किया गया है।
- source_word: מִן בְּנֵי מְרָרִי
  choice: मरारी के वंशजों में से
  rationale: शाब्दिक अर्थ ‘मरारी के पुत्रों में से’ है; यहाँ व्यापक कुल-संबंध अभिप्रेत होने के कारण ‘वंशजों में से’ आधुनिक हिंदी में अधिक स्पष्ट और स्वाभाविक है।
- source_word: בָּנִים
  choice: पुत्र ये थे
  rationale: इब्रानी में केवल ‘पुत्र’ है; वंशावली-सूची की नाममात्र संरचना को हिंदी में पूर्ण और सहज बनाने के लिए न्यूनतम क्रियात्मक पूर्ति की गई है।
- source_word: שִׁמְרִי
  choice: शिम्री
  rationale: व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: הָרֹאשׁ
  choice: प्रधान
  rationale: רֹאשׁ यहाँ शारीरिक ‘सिर’ नहीं, बल्कि परिवार या दल में सर्वोच्च पद सूचित करता है। ‘प्रधान’ गरिमापूर्ण, संक्षिप्त और दोनों occurrences में उपयुक्त है।
- source_word: כִּי לֹא הָיָה בְכוֹר
  choice: यद्यपि वह पहलौठा नहीं था
  rationale: כִּי कारण अथवा व्याख्या भी व्यक्त कर सकता है, पर संदर्भ में शिम्री का पहलौठा न होते हुए प्रधान होना स्पष्ट विरोध उत्पन्न करता है; इसलिए मुख्य पाठ में concessive अर्थ रखा गया और दूसरी संभावना पादटिप्पणी में सुरक्षित की गई है।
- source_word: בְכוֹר
  choice: पहलौठा
  rationale: जन्मक्रम के इस पद के लिए प्रचलित और सटीक हिंदी शब्द। प्रसंग में पुत्रों की बात होने से ‘पुत्र’ जोड़ना आवश्यक नहीं।
- source_word: וַיְשִׂימֵהוּ אָבִיהוּ לְרֹאשׁ
  choice: फिर भी उसके पिता ने उसे प्रधान ठहराया था
  rationale: שׂים + לְ किसी पद पर नियुक्त या स्थापित करने का भाव देता है। ‘प्रधान ठहराया’ पद-निर्धारण को स्वाभाविक हिंदी में व्यक्त करता और पहले आए רֹאשׁ से शब्दगत संबंध बनाए रखता है। ‘फिर भी’ हिंदी में concessive संबंध को स्पष्ट करता है।
