  text: These were the divisions of the gatekeepers for the sons of the Korahites and for the sons of Merari[a].
translation:
  language: hi
  text: द्वारपालों के ये दल कोरहवंशियों और मरारी के पुत्रों के लिए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... थे
  rationale: इब्रानी में यह बहुवचन संकेतवाचक शब्द है और वाक्य क्रियारहित है। सूची के समापन-सार के रूप में स्वाभाविक हिन्दी में भूतकाल का प्रयोग किया गया है।
- source_word: מַחְלְקוֹת
  choice: दल
  rationale: मन्दिर की व्यवस्थित सेवा के लिए नियुक्त समूहों का बोध कराता है। ‘दल’ सामान्य आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: הַשֹּׁעֲרִים
  choice: द्वारपालों
  rationale: यह मन्दिर के द्वारों पर पहरा देने और उनकी देखरेख करने वालों का पदनाम है।
- source_word: לִבְנֵי הַקָּרְחִי
  choice: कोरहवंशियों ... के लिए
  rationale: यह कोरह से सम्बद्ध कुल के सदस्यों को दर्शाता है; हिन्दी में ‘कोरहवंशी’ स्वाभाविक सामूहिक कुलनाम है।
- source_word: וְלִבְנֵי מְרָרִי
  choice: और मरारी के वंशजों के लिए
  rationale: मूल की ‘मरारी के पुत्रों’ वाली वंशगत अभिव्यक्ति को आधुनिक हिन्दी में ‘वंशजों’ से स्पष्ट किया गया है और समानांतर ‘के लिए’ संबंध बनाए रखा गया है।
- source_word: לְ
  choice: के लिए ठहराए गए
  rationale: उपसर्ग यहाँ दलों की कुलों के अनुसार संबद्धता अथवा नियुक्ति बताता है। हिन्दी में अस्पष्ट संबंध से बचने के लिए ‘ठहराए गए’ जोड़ा गया है।
