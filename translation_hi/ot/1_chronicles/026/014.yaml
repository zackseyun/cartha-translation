base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/014.yaml
  text: The lot for the east fell to Shelemyahu. Then they cast lots for his son Zekaryahu[a], a counselor with insight, and his lot came out for the north.
translation:
  language: hi
  text: पूर्व दिशा की चिट्ठी शेलेम्याहू के नाम निकली। फिर उसके पुत्र जकर्याहू[a] के लिए चिट्ठियाँ डाली गईं, जो समझ-बूझ रखनेवाला सलाहकार था; और उसकी चिट्ठी उत्तर दिशा के लिए निकली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो विवेक से सलाह देता था।” इब्रानी वाक्यांश में जकर्याहू को ऐसा सलाहकार बताया गया है जिसमें समझ-बूझ या विवेक था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל הַגּוֹרָל
  choice: चिट्ठी ... निकली
  rationale: चिट्ठी डालने के प्रसंग में נפל + גורל परिणाम निकलने का प्रचलित मुहावरा है। हिंदी में ‘चिट्ठी निकली’ स्वाभाविक है और दैव-निर्णय के साधन का ठोस बिंब बनाए रखता है।
- source_word: מִזְרָחָה
  choice: पूर्व दिशा की
  rationale: दिशासूचक ה यहाँ द्वार-सेवा के क्षेत्र का संकेत देता है; ‘पूर्व दिशा की’ नियुक्ति का भाव सहज रूप से व्यक्त करता है।
- source_word: לְשֶׁלֶמְיָהוּ
  choice: शेलेम्याहू के नाम
  rationale: लामेद चिट्ठी द्वारा नियुक्त व्यक्ति को चिह्नित करता है। ‘के नाम’ हिंदी में इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּזְכַרְיָהוּ בְנוֹ
  choice: फिर उसके पुत्र जकर्याहू के लिए
  rationale: यह अगली चिट्ठी-प्रक्रिया में पुत्र का परिचय कराता है। ‘फिर’ वाव से सूचित कथात्मक क्रम को स्पष्ट करता है, और ‘उसके पुत्र’ संबंध को सहज बनाता है।
- source_word: יוֹעֵץ בְּשֶׂכֶל
  choice: समझ-बूझ रखनेवाला सलाहकार
  rationale: יוֹעֵץ के ‘सलाहकार’ और בְּשֶׂכֶל के विवेक/सूझ-बूझ—दोनों अर्थ-तत्त्व सुरक्षित रहते हैं; वाक्यांश को केवल ‘बुद्धिमान’ विशेषण में नहीं समेटा गया।
- source_word: הִפִּילוּ גּוֹרָלוֹת
  choice: चिट्ठियाँ डाली गईं
  rationale: हिफ़ईल रूप का अर्थ चिट्ठियाँ डालना है। मूल में कर्ता अनिर्दिष्ट बहुवचन है; हिंदी का भाववाच्य इस अनिर्दिष्ट कर्ता को स्वाभाविक रूप से बनाए रखता है।
- source_word: וַיֵּצֵא גוֹרָלוֹ
  choice: और उसकी चिट्ठी ... निकली
  rationale: יצא + גורל चिट्ठी के परिणाम के सामने आने को बताता है। ‘निकली’ हिंदी में चिट्ठी डालने के परिणाम के लिए स्वाभाविक मुहावरा है।
- source_word: צָפוֹנָה
  choice: उत्तर दिशा के लिए
  rationale: दिशासूचक ה नियुक्त दिशा को दर्शाता है। ‘के लिए’ सेवा-क्षेत्र के आवंटन को स्पष्ट रखता है।
