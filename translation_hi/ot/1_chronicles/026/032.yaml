  text: וְ/אֶחָ֣י/ו בְּנֵי חַ֗יִל אַלְפַּ֛יִם וּ/שְׁבַ֥ע מֵא֖וֹת רָאשֵׁ֣י הָ/אָב֑וֹת וַ/יַּפְקִידֵ֞/ם דָּוִ֣יד הַ/מֶּ֗לֶךְ עַל הָ/ראוּבֵנִ֤י וְ/הַ/גָּדִי֙ וַ/חֲצִי֙ שֵׁ֣בֶט הַֽ/מְנַשִּׁ֔י לְ/כָל דְּבַ֥ר הָ/אֱלֹהִ֖ים וּ/דְבַ֥ר הַ/מֶּֽלֶךְ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/032.yaml
  text: And his brothers[a], valiant men, were two thousand seven hundred heads of fathers’ houses; and King David appointed them over the Reubenites, the Gadites, and the half-tribe of Manasseh for every matter of God and of the king.
translation:
  language: hi
  text: और उसके भाई-बन्धु, जो पराक्रमी पुरुष थे, दो हज़ार सात सौ पितृकुलों के मुखिया थे। राजा दाऊद ने उन्हें रूबेनियों, गादियों और मनश्शे के आधे गोत्र पर परमेश्वर से सम्बन्धित हर विषय और राजा से सम्बन्धित हर विषय की ज़िम्मेदारी सौंपी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֶחָיו
  choice: और उसके भाई-बन्धु
  rationale: प्रत्यय का संकेत पिछले पद के हशब्याह की ओर है। אחים का मूल अर्थ ‘भाई’ है, पर कुल-सन्दर्भ में व्यापक पुरुष सम्बन्धी भी अभिप्रेत हो सकते हैं; ‘भाई-बन्धु’ इस दायरे को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּנֵי חַיִל
  choice: जो पराक्रमी पुरुष थे
  rationale: यह पद शक्ति, वीरता और योग्यता का बोध करा सकता है। ‘पराक्रमी पुरुष’ पारम्परिक बाइबलीय गरिमा रखते हुए उसके बलपूर्ण अर्थ को बनाए रखता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह वंशावली और प्रशासन से जुड़ा तकनीकी पद है। ‘पितृकुल’ हिब्रू सामाजिक संरचना को ‘परिवार’ से अधिक स्पष्टता से व्यक्त करता है।
- source_word: וַיַּפְקִידֵם
  choice: उन्हें ... की ज़िम्मेदारी सौंपी
  rationale: हिफ़ील रूप यहाँ किसी को आधिकारिक देखरेख या दायित्व सौंपने का अर्थ देता है; यह हिन्दी में ‘नियुक्त किया’ की अपेक्षा वाक्य-सन्दर्भ में अधिक स्वाभाविक है।
- source_word: עַל
  choice: पर
  rationale: प्रशासनिक सन्दर्भ में यह सूचीबद्ध समुदायों पर अधिकार अथवा उनकी देखरेख की ज़िम्मेदारी सूचित करता है।
- source_word: הָראוּבֵנִי וְהַגָּדִי וַחֲצִי שֵׁבֶט הַמְנַשִּׁי
  choice: रूबेनियों, गादियों और मनश्शे के आधे गोत्र
  rationale: एकवचन जातिवाचक हिब्रू रूप सामूहिक समुदायों को सूचित करते हैं; हिन्दी में बहुवचन ‘रूबेनियों, गादियों’ स्वाभाविक है।
- source_word: לְכָל דְּבַר הָאֱלֹהִים וּדְבַר הַמֶּלֶךְ
  choice: परमेश्वर से सम्बन्धित हर विषय और राजा से सम्बन्धित हर विषय
  rationale: דבר यहाँ विषय, मामला या काम हो सकता है। समानान्तर हिन्दी रचना धार्मिक और राजकीय उत्तरदायित्व के दो क्षेत्रों को स्पष्ट करती है, पर उनके सटीक स्वरूप को अनावश्यक रूप से निर्धारित नहीं करती।
theological_decisions:
- issue: परमेश्वर और राजा से सम्बन्धित उत्तरदायित्वों का दायरा
  choice: दो समानान्तर क्षेत्रों—परमेश्वर से सम्बन्धित विषय और राजा से सम्बन्धित विषय—की देखरेख
  alternative: ‘परमेश्वर के सब काम और राजा के कामकाज के लिए’
  rationale: हिब्रू दो उत्तरदायित्व-क्षेत्रों में भेद करता है, पर उनके बीच कोई धर्मवैज्ञानिक पदानुक्रम या बाद की धार्मिक-राजकीय श्रेणियाँ निर्धारित नहीं करता। चुना हुआ पाठ इस तनाव और व्यापकता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गद्य। ‘पितृकुल’ प्रशासनिक-वंशावली पद को सुरक्षित रखता है; ‘भाई-बन्धु’ कुलगत सन्दर्भ में אחים की सम्भावित व्यापकता दर्शाता है। किसी पादटिप्पणी की आवश्यकता नहीं समझी गई।
