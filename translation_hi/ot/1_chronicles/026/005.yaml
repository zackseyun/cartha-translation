source:
  edition: WLC
  text: עַמִּיאֵ֤ל הַ/שִּׁשִּׁי֙ יִשָׂשכָ֣ר הַ/שְּׁבִיעִ֔י פְּעֻלְּתַ֖י הַ/שְּׁמִינִ֑י כִּ֥י בֵרֲכ֖/וֹ אֱלֹהִֽים׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/005.yaml
  text: Ammiel the sixth[a], Issachar the seventh, Peullethai the eighth; for God had blessed him.
translation:
  language: hi
  text: छठा अम्मीएल, सातवाँ इस्साकार और आठवाँ पउल्लतै; क्योंकि परमेश्वर ने उसे आशीष दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַמִּיאֵל
  choice: अम्मीएल
  rationale: व्यक्तिवाचक नाम का उसके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: הַשִּׁשִּׁי
  choice: छठा
  rationale: निश्चित क्रमवाचक संख्या; पुत्रों की चल रही सूची में जन्मक्रम बताती है।
- source_word: יִשָּׂשכָר
  choice: इस्साकार
  rationale: यहाँ गोत्र नहीं, एक पुत्र का नाम है; हिन्दी बाइबलीय परंपरा से परिचित रूप रखा गया है।
- source_word: הַשְּׁבִיעִי
  choice: सातवाँ
  rationale: आसपास की सूची के समानांतर निश्चित क्रमवाचक संख्या।
- source_word: פְּעֻלְּתַי
  choice: पउल्लतै
  rationale: हिब्रू स्वर-विन्यास और व्यंजन-द्वित्व को यथासंभव दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: הַשְּׁמִינִי
  choice: आठवाँ
  rationale: सूची का क्रम पूरा करने वाली निश्चित क्रमवाचक संख्या।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक इतने पुत्र होने का कारण प्रस्तुत करता है; आधुनिक हिन्दी में स्पष्ट और स्वाभाविक कारणसूचक रूप।
- source_word: בֵרֲכוֹ
  choice: ने उसे आशीष दी थी
  rationale: क्रिया के पुल्लिंग एकवचन कर्म-प्रत्यय को ‘उसे’ से रखा गया है। पूर्ववर्ती वंशसूची के स्पष्टीकरण के रूप में पूर्ण भूतकाल हिन्दी में स्वाभाविक है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: सन्दर्भ और एकवचन क्रिया के अनुसार इस्राएल के परमेश्वर के लिए प्रचलित, गरिमापूर्ण हिन्दी पद।
theological_decisions:
- issue: ‘उसे’ का सन्दर्भ
  choice: सर्वनाम को पाठ में अनिर्दिष्ट रखते हुए सन्दर्भतः ओबेद-एदोम की ओर संकेत करने दिया गया है।
  alternative: इसे व्यापक रूप से ओबेद-एदोम के घराने या वंश पर मिली आशीष समझना।
  rationale: निकटवर्ती प्रसंग ओबेद-एदोम के पुत्रों और वंशजों को गिनाता है, इसलिए व्याकरणिक पुल्लिंग एकवचन सर्वनाम सबसे स्वाभाविक रूप से उसी की ओर लौटता है; फिर भी अनुवाद में उसका नाम जोड़कर सम्भावित व्यापक अर्थ को बन्द नहीं किया गया।
- issue: आशीष की कालगत अभिव्यक्ति
  choice: ‘आशीष दी थी’
  alternative: ‘आशीष दी’
  rationale: हिब्रू पूर्ण क्रिया स्वयं हिन्दी के पूर्ण भूतकाल को अनिवार्य नहीं करती, पर यह कारणसूचक उपवाक्य पूर्ववर्ती सन्तान-सूची की पृष्ठभूमि बताता है; अतः ‘दी थी’ सन्दर्भगत सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त वंशावली-शैली रखी गई है। क्रमवाचक पद नामों से पहले रखे गए हैं, जो हिन्दी में स्वाभाविक है। भाषा गरिमापूर्ण पर सामान्य पाठक के लिए सहज है; किसी साम्प्रदायिक व्याख्या को नहीं जोड़ा गया।
