  yaml_path: translation/ot/1_chronicles/026/021.yaml
  text: 'The sons of Ladan[b][a], the sons of the Gershonite belonging to Ladan: the heads of the fathers’ houses belonging to Ladan the Gershonite were Jehieli.'
translation:
  language: hi
  text: लादान के पुत्रों—गेर्शोनी वंश के लादान के पुत्रों—के पितृकुलों के मुखिया यहीएली थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: वंशावली की औपचारिक शैली बनाए रखने के लिए ‘पुत्र’ रखा गया है; यहाँ इसका अर्थ व्यापक रूप से ‘वंशज’ भी हो सकता है।
- source_word: לַעְדָּן
  choice: लादान
  rationale: इब्रानी नाम का स्वाभाविक देवनागरी लिप्यंतरण।
- source_word: הַגֵּרְשֻׁנִּי
  choice: गेर्शोनी
  rationale: यह रूप गेर्शोन के कुल या वंश से संबंध बताता है; हिंदी बाइबलीय वंशावली की संक्षिप्त शैली में ‘गेर्शोनी’ उपयुक्त है।
- source_word: לְלַעְדָּן
  choice: लादान से संबंधित
  rationale: यहाँ ל उपसर्ग दिशा के बजाय वंशगत संबंध या वर्गीकरण दर्शाता है; ‘से संबंधित’ संक्षिप्त इब्रानी वाक्य-विन्यास को स्पष्ट करता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखिया
  rationale: यह पदबंध पूर्वज से जुड़े विस्तृत पारिवारिक समूहों के अगुओं को दर्शाता है और स्रोत की सामाजिक संरचना को बनाए रखता है।
- source_word: יְחִיאֵלִי
  choice: यहीएली
  rationale: रूप को कुल-संबंधी नाम के रूप में लिप्यंतरित किया गया है; संदर्भ में यह संभवतः यहीएल से निकले कुल के लोगों के लिए सामूहिक रूप है।
