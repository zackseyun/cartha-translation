base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/020.yaml
  text: And of the Levites[b][a], Ahijah was over the treasuries of the house of God and the treasuries of the holy things.
translation:
  language: hi
  text: और लेवियों में से[a] अहिय्याह परमेश्वर के भवन के भंडारों और पवित्र वस्तुओं[b] के भंडारों का प्रभारी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, “और लेवियों के विषय में: अहिय्याह ...।” इब्रानी वाक्य का आरंभ कुछ अपूर्ण-सा है और संभवतः शीर्षक-जैसे प्रसंग-परिवर्तन का काम करता है।'
    reason: alternative_reading
  - marker: b
    text: “पवित्र वस्तुओं” का अनुवाद “समर्पित वस्तुओं” या “पवित्र उपयोग के लिए अलग की गई वस्तुओं” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: और लेवियों में से
  rationale: इब्रानी आरंभ कुछ लुप्तपदीय है और लेवियों के विषय में एक नए प्रसंग की ओर संकेत करता है। ‘लेवियों में से’ अगले एकवचन नाम के साथ स्वाभाविक हिंदी बनाता है, जबकि पादटिप्पणी शीर्षक-सदृश वैकल्पिक समझ को सुरक्षित रखती है।
- source_word: אֲחִיָּה
  choice: अहिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: עַל
  choice: का अधिकारी था
  rationale: प्रशासनिक संदर्भ में यह देखरेख और अधिकार को व्यक्त करता है; यह हिंदी में स्वाभाविक और गरिमापूर्ण है।
- source_word: אֹצְרוֹת
  choice: भंडारों
  rationale: मंदिर-परिसर में मूल्यवान वस्तुओं और सामग्री को रखने के स्थानों या उनके संग्रहों के लिए उपयुक्त व्यापक शब्द।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: इब्रानी का सीधा अर्थ ‘परमेश्वर का भवन’ है; ‘मंदिर’ की व्याख्यात्मक विशिष्टता जोड़े बिना मूल रूपक बनाए रखा गया है।
- source_word: וּלְאֹצְרוֹת
  choice: और ... के भंडारों
  rationale: दूसरा भंडार भी पहले वाले ‘अधिकारी था’ के अंतर्गत है; हिंदी वाक्य में संबंध स्पष्ट रहते हुए क्रिया को दोहराना आवश्यक नहीं।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं
  rationale: यह उन वस्तुओं को दर्शाता है जिन्हें पवित्र उपयोग के लिए अलग किया गया था। सीधा अर्थ रखा गया है और संभावित ‘समर्पित वस्तुएँ’ अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: הַקֳּדָשִׁים का धार्मिक-सांस्कृतिक आशय
  choice: पवित्र वस्तुएँ
  alternative: समर्पित वस्तुएँ / पवित्र उपयोग के लिए अलग की गई वस्तुएँ
  rationale: मूल बहुवचन का व्यापक अर्थ बनाए रखा गया है; इसे केवल चढ़ावों या किसी विशेष प्रकार की मंदिर-संपत्ति तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण प्रशासनिक शैली रखी गई है। ‘परमेश्वर का भवन’ मूल अभिव्यक्ति को सुरक्षित रखता है, और ‘का अधिकारी था’ देखरेख के भाव को सामान्य पाठक के लिए स्पष्ट करता है।
