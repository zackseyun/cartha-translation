base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/031.yaml
  text: For the Hebronites[a], Jeriah was the chief of the Hebronites according to his generations by fathers’ houses. In the fortieth year of David’s reign they were sought out[c][b], and among them mighty men of valor were found at Jazer of Gilead.
translation:
  language: hi
  text: हेब्रोनियों के विषय में, यरीय्याह हेब्रोनियों का प्रधान था, अपनी वंश-परंपराओं और पितृकुलों के अनुसार। दाऊद के शासन के चालीसवें वर्ष में उनकी खोजबीन की गई, और उनमें गिलाद के याजेर में वीर और सामर्थी पुरुष पाए गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: हेब्रोनियों में
  rationale: आरंभिक לְ यहाँ विषय-परिवर्तन का संकेत देता है; हिन्दी में ‘हेब्रोनियों में’ स्वाभाविक रूप से उस कुल का परिचय कराता है और अगले ‘प्रधान’ से संबंध स्पष्ट रखता है।
- source_word: יְרִיָּה הָרֹאשׁ
  choice: यरिय्याह प्रधान था
  rationale: नाम का हिन्दी बाइबलीय रूप ‘यरिय्याह’ रखा गया और प्रशासनिक-वंशावली संदर्भ में רֹאשׁ के लिए गरिमापूर्ण तथा सहज ‘प्रधान’ चुना गया।
- source_word: לְתֹלְדֹתָיו לְאָבוֹת
  choice: वंशावलियों के अनुसार उनके पितृकुलों का
  rationale: תֹלְדוֹת वंशक्रम/वंशावली को और אָבוֹת पूर्वजों पर आधारित कुल-इकाइयों को सूचित करता है। ‘पितृकुल’ इसे केवल छोटे परिवार तक सीमित नहीं करता।
- source_word: בִּשְׁנַת הָאַרְבָּעִים לְמַלְכוּת דָּוִיד
