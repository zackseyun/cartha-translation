  rationale: यह राजकीय काल-निर्धारण का सूत्र है; ‘शासन’ आधुनिक हिन्दी में स्वाभाविक है और מלכות के प्रसंगगत अर्थ को व्यक्त करता है।
- source_word: נִדְרָשׁוּ
  choice: उनकी खोजबीन की गई
  rationale: निफ़अल रूप औपचारिक जाँच या पता लगाए जाने का निष्क्रिय भाव देता है। ‘खोजबीन की गई’ इस प्रशासनिक/वंशावली प्रसंग को हिन्दी में स्पष्ट रखता है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: वीर और सामर्थी पुरुष
  rationale: यह पद वीरता, शक्ति और सिद्ध योग्यता—इन सबका बोध करा सकता है। संयुक्त अभिव्यक्ति अर्थ को केवल सैनिक योद्धाओं तक सीमित नहीं करती।
- source_word: בְּיַעְזֵיר גִּלְעָד
  choice: गिलाद के याजेर में
  rationale: 'स्थान-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है: गिलाद क्षेत्र का याजेर।'
