  yaml_path: translation/ot/1_chronicles/026/008.yaml
  text: All these were from the sons of Obed-edom—they and their sons and their brothers, able men with strength for the service—sixty-two belonging to Obed-edom.
translation:
  language: hi
  text: ये सभी ओबेद-एदोम के पुत्रों में से थे—वे, उनके पुत्र और उनके भाई[a], सेवा के लिए सामर्थ्यवान और योग्य पुरुष[b] थे—ओबेद-एदोम के कुल बासठ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके कुल के पुरुष संबंधी”; यहाँ “भाई” के लिए प्रयुक्त इब्रानी शब्द व्यापक अर्थ में कुल के पुरुष संबंधियों को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “योग्य पुरुष” के लिए प्रयुक्त इब्रानी पद का अनुवाद “वीर पुरुष” या “पराक्रमी पुरुष” भी हो सकता है; इस प्रसंग में बल और मंदिर-सेवा की योग्यता पर बल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבְּנֵי
  choice: के पुत्रों में से
  rationale: מִן के साथ यह वंश अथवा परिवार-समूह में सदस्यता बताता है; यह हिंदी में स्वाभाविक रहते हुए स्रोत का अर्थ बनाए रखता है।
- source_word: הֵמָּה וּבְנֵיהֶם וַאֲחֵיהֶם
  choice: वे, उनके पुत्र और उनके भाई
  rationale: सूची में वे स्वयं, अगली पीढ़ी और उनके पुरुष भाई सम्मिलित हैं। मुख्य पाठ में ‘भाई’ रखकर אֲחֵיהֶם का सीधा अर्थ सुरक्षित रखा गया है।
- source_word: אִישׁ חַיִל בַּכֹּחַ
  choice: सामर्थ्यवान और योग्य पुरुष
  rationale: אִישׁ חַיִל योग्यता, क्षमता अथवा वीरता का बोध करा सकता है, जबकि בַּכֹּחַ बल या सामर्थ्य को स्पष्ट करता है। इस सेवाकार्य के प्रसंग में यह अनुवाद उनकी योग्यता और शक्ति दोनों व्यक्त करता है।
- source_word: לַעֲבֹדָה
  choice: सेवा के लिए
  rationale: यहाँ עֲבֹדָה नियुक्त मंदिर-सेवा अथवा कर्तव्य की ओर संकेत करता है; ‘सेवा’ अनावश्यक विस्तार के बिना प्रसंगानुकूल है।
- source_word: שִׁשִּׁים וּשְׁנַיִם
  choice: बासठ
  rationale: मूल संख्या का सीधा हिंदी रूप।
- source_word: לְעֹבֵד אֱדֹם
  choice: ओबेद-एदोम से संबंधित
  rationale: अंतिम לְ संबंध अथवा संबद्धता बताकर ओबेद-एदोम के परिवार की कुल संख्या प्रस्तुत करता है।
