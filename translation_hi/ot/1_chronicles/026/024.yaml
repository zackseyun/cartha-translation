    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׁבֻאֵל
  choice: और ... शबूएल
  rationale: उपसर्ग ו को सूची के पिछले संदर्भ से संबंध बनाए रखने के लिए ‘और’ से व्यक्त किया गया है; नाम का मानक हिन्दी लिप्यंतरण ‘शबूएल’ रखा गया है।
- source_word: בֶּן גֵּרְשׁוֹם בֶּן מֹשֶׁה
  choice: मूसा के पुत्र गेर्शोम का पुत्र
  rationale: वंश-संबंध को स्पष्ट और स्वाभाविक हिन्दी क्रम में रखा गया है; दोनों बार בֶּן का प्रत्यक्ष पुत्र-संबंध सुरक्षित है।
- source_word: נָגִיד
  choice: प्रधान
  rationale: मंदिर की प्रशासनिक व्यवस्था में यह शब्द अधिकार और देखरेख के पद को दर्शाता है; ‘प्रधान’ राजकीय अर्थ जोड़े बिना इसे संक्षेप में व्यक्त करता है।
- source_word: עַל
  choice: का
  rationale: ‘भंडारों का प्रधान’ स्वाभाविक हिन्दी प्रशासनिक प्रयोग है और עַל द्वारा सूचित अधिकार/देखरेख का संबंध व्यक्त करता है।
- source_word: הָ/אֹצָרוֹת
  choice: भंडारों
  rationale: אֹצָרוֹת संग्रहित बहुमूल्य वस्तुओं अथवा उन्हें रखने के स्थानों, दोनों को सूचित कर सकता है; प्रसंग में ‘भंडार’ इस अर्थ-विस्तार को यथासंभव बनाए रखता है।
