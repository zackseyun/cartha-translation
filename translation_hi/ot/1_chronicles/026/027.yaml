source:
  edition: WLC
  text: מִן הַ/מִּלְחָמ֥וֹת וּ/מִן הַ/שָּׁלָ֖ל הִקְדִּ֑ישׁוּ לְ/חַזֵּ֖ק לְ/בֵ֥ית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/027.yaml
  text: From the wars and from the spoil they had dedicated things to strengthen the house of Yahweh.
translation:
  language: hi
  text: युद्धों से और लूट के माल में से उन्होंने यहोवा के भवन को सुदृढ़ करने के लिए वस्तुएँ[a] समर्पित की थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'मूल इब्रानी में ‘वस्तुएँ’ शब्द नहीं है; कर्म अनकहा है। इसका अनुवाद यह भी हो सकता है: ‘युद्धों से और लूट के माल में से उन्होंने यहोवा के भवन को सुदृढ़ करने के लिए समर्पित किया था।’'
    reason: मूल पाठ में प्रत्यक्ष कर्म निहित है; पाठ में स्पष्टता के लिए ‘वस्तुएँ’ जोड़ा गया है।
lexical_decisions:
- source_word: מִן הַמִּלְחָמוֹת
  choice: युद्धों से
  rationale: מִן स्रोत या उद्गम दर्शाता है और बहुवचन מִלְחָמוֹת का अर्थ ‘युद्ध’ या ‘लड़ाइयाँ’ हो सकता है। ‘युद्धों से’ व्यापक सामूहिक अर्थ को बनाए रखता है।
- source_word: וּמִן הַשָּׁלָל
  choice: और लूट के माल में से
  rationale: שָׁלָל युद्ध में हथियाए गए माल को सूचित करता है। ‘लूट का माल’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; ‘लूट’ अकेले भी सम्भव है।
- source_word: הִקְדִּישׁוּ
  choice: उन्होंने … समर्पित की थीं
  rationale: קדשׁ का हिफ़ील रूप यहाँ किसी वस्तु को पवित्र प्रयोजन के लिए अलग रखने या अर्पित करने का अर्थ देता है। ‘समर्पित’ मन्दिर के लिए अर्पण का भाव स्वाभाविक हिन्दी में व्यक्त करता है; पूर्ण क्रिया को प्रसंगानुसार भूतपूर्ण रूप में रखा गया है।
- source_word: לְחַזֵּק
  choice: सुदृढ़ करने के लिए
  rationale: חזק का अर्थ मजबूत या दृढ़ करना है। ‘सुदृढ़ करना’ मूल अर्थ को बनाए रखते हुए भवन की मरम्मत, रखरखाव या मजबूती के सम्भावित आशय को अनावश्यक रूप से सीमित नहीं करता।
- source_word: לְבֵית יְהוָה
  choice: यहोवा के भवन को
  rationale: בֵּית יְהוָה का शाब्दिक मुहावरा ‘यहोवा का भवन’ है और प्रसंग में मन्दिर को सूचित करता है। ‘भवन’ मूल रूपक को बनाए रखता है तथा יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूपान्तरण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिन्दी पाठकों के लिए परिचित नामरूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: הִקְדִּישׁוּ में पवित्र समर्पण का भाव
  choice: समर्पित की थीं
  alternative: पवित्र ठहराई थीं
  rationale: प्रसंग में युद्ध से प्राप्त वस्तुओं को मन्दिर के प्रयोजन के लिए अलग रखने की बात है। ‘समर्पित’ इस धार्मिक अर्पण को सहज हिन्दी में व्यक्त करता है, जबकि ‘पवित्र ठहराई’ अधिक शाब्दिक पर कम स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सुदृढ़’ मूल क्रिया की व्यापकता बनाए रखता है, और ‘यहोवा का भवन’ इब्रानी मुहावरे को सुरक्षित रखता है।
