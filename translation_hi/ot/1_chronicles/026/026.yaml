source:
  edition: WLC
  text: ה֧וּא שְׁלֹמ֣וֹת וְ/אֶחָ֗י/ו עַ֣ל כָּל אֹצְר֤וֹת הַ/קֳּדָשִׁים֙ אֲשֶׁ֨ר הִקְדִּ֜ישׁ דָּוִ֣יד הַ/מֶּ֗לֶךְ וְ/רָאשֵׁ֧י הָ/אָב֛וֹת לְ/שָׂרֵֽי הָ/אֲלָפִ֥ים וְ/הַ/מֵּא֖וֹת וְ/שָׂרֵ֥י הַ/צָּבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/026.yaml
  text: Shelomoth and his brothers were over all the treasuries of the holy things that King David[a], the heads of the fathers’ houses, the commanders of thousands and of hundreds[b], and the commanders of the army had dedicated.
translation:
  language: hi
  text: शलोमोत और उसके भाई उन पवित्र वस्तुओं के सभी भंडारों की देखरेख करते थे, जिन्हें राजा दाऊद, पितृवंशों के मुखियाओं[a], हजारों और सैकड़ों के सेनापतियों[b], तथा सेना के सेनापतियों ने पवित्र ठहराकर समर्पित किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पितृवंशों के मुखिया” वंश या कुल पर आधारित एक प्रशासनिक पद था।
    reason: cultural_note
  - marker: b
    text: “हजारों और सैकड़ों” सेना की संगठनात्मक इकाइयों को दर्शाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: הוּא שְׁלֹמוֹת וְאֶחָיו
  choice: शलोमोत और उसके भाई ... अधिकारी थे
  rationale: यद्यपि הוּא व्याकरणतः एकवचन है, आगे शलोमोत और उसके भाइयों का संयुक्त कर्ता है। हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: עַל כָּל אֹצְרוֹת
  choice: सभी भंडारों के अधिकारी
  rationale: प्रशासनिक प्रसंग में עַל दायित्व या देखरेख सूचित करता है। אֹצְרוֹת यहाँ संग्रहित धन मात्र नहीं, पवित्र वस्तुओं के भंडार हैं।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं
  rationale: यह समर्पित और पवित्र ठहराई गई वस्तुओं का व्यापक उल्लेख है; अनावश्यक रूप से इन्हें केवल भेंट या धन तक सीमित नहीं किया गया।
- source_word: אֲשֶׁר הִקְדִּישׁ
  choice: जिन्हें ... पवित्र उपयोग के लिए समर्पित किया था
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को पवित्र ठहराना या समर्पित करना है। यह हिन्दी अभिव्यक्ति अर्थ को स्पष्ट और स्वाभाविक रखती है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृकुलों के मुखियाओं
  rationale: इतिहासवृत्त में यह वंश-आधारित प्रशासनिक पद है। ‘पितृकुल’ तकनीकी पारिवारिक संरचना को संक्षेप में सुरक्षित रखता है।
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: हजारों और सैकड़ों के सेनापतियों
  rationale: ये सैन्य-प्रशासनिक इकाइयों पर नियुक्त अधिकारी हैं; हिन्दी बाइबलीय प्रयोग में ‘सेनापति’ स्पष्ट और गरिमापूर्ण है।
- source_word: שָׂרֵי הַצָּבָא
  choice: सेना के सेनापतियों
  rationale: צָבָא यहाँ मानवीय सेना को सूचित करता है, स्वर्गीय दल को नहीं।
theological_decisions:
- issue: पवित्र वस्तुओं को समर्पित करने वाले व्यक्तियों का दायरा
  choice: राजा दाऊद सहित सूचीबद्ध सभी समूह समर्पित करने वाले माने गए हैं।
  alternative: केवल दाऊद को समर्पित करने वाला मानना और शेष पदों को परोक्ष रूप से जोड़ना।
  rationale: लगातार संयोजक וְ के साथ दी गई सूची स्वाभाविक रूप से संयुक्त कर्ता है। इब्रानी की एकवचन क्रिया आरंभिक निकटतम कर्ता के कारण हो सकती है; हिन्दी बहुवचन क्रिया सूची के सामूहिक अर्थ को व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। नाम ‘शलोमोत’ मूल שְׁלֹמוֹת के निकट लिप्यंतरित है। ‘पवित्र वस्तुएँ’ मूल की व्यापकता बनाए रखता है, जबकि ‘पवित्र उपयोग के लिए समर्पित’ קדשׁ की पुनरुक्त मूल-ध्वनि को स्वाभाविक हिन्दी में स्पष्ट करता है।
