base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/004.yaml
  text: 'And Obed-edom had sons: Shemaiah the firstborn[a], Jehozabad the second, Joah the third, and Sakar the fourth[b], and Nethanel the fifth.'
translation:
  language: hi
  text: 'और ओबेद-एदोम के पुत्र ये थे: पहलौठा शमायाह[a], दूसरा यहोजाबाद, तीसरा योआह, चौथा साकार[b], और पाँचवाँ नतनेल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ‘पहलौठा’ है, जो केवल सूची में पहला होने के बजाय परिवार में उसकी स्थिति भी बताता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी नाम ‘साकार’ है; यह ‘इस्साकार’ नाम से भिन्न रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/עֹבֵד אֱדֹם בָּנִים
  choice: और ओबेद-एदोम के पुत्र ये थे
  rationale: इब्रानी में शाब्दिक रूप से ‘और ओबेद-एदोम के लिए पुत्र’ जैसी लुप्त-क्रियात्मक वंशावली-संरचना है। आधुनिक हिन्दी में ‘के पुत्र ये थे’ स्वाभाविक है और कोई अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: שְׁמַעְיָה הַ/בְּכוֹר
  choice: पहलौठा शमायाह
  rationale: בכור केवल क्रमसूचक ‘पहला’ नहीं, बल्कि पारिवारिक स्थिति ‘पहलौठा’ बताता है; हिन्दी में विशेषण को नाम से पहले रखना स्वाभाविक है।
- source_word: יְהוֹזָבָד הַ/שֵּׁנִי
  choice: दूसरा यहोजाबाद
  rationale: नाम का इब्रानी-आधारित लिप्यंतरण और जन्मक्रम का सीधा अनुवाद।
- source_word: יוֹאָח הַ/שְּׁלִשִׁי
  choice: तीसरा योआह
  rationale: יוֹאָח का हिन्दी लिप्यंतरण ‘योआह’ स्रोत के व्यंजन और उच्चारण को निकटता से दर्शाता है।
- source_word: וְ/שָׂכָר הָ/רְבִיעִי
  choice: चौथा साकार
  rationale: שָׂכָר को इसी पद में पाए जाने वाले नाम के अनुसार ‘साकार’ लिप्यंतरित किया गया है; इसे ‘इस्साकार’ नहीं बनाया गया।
- source_word: וּ/נְתַנְאֵל הַ/חֲמִישִׁי
  choice: और पाँचवाँ नतनेल
  rationale: נְתַנְאֵל का इब्रानी-आधारित हिन्दी लिप्यंतरण ‘नतनेल’ है; क्रमसूचक विशेषण सीधे सुरक्षित रखा गया है।
