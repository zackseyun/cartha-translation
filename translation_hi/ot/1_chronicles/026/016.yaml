  text: For Shuppim and Hosah[a], the lot fell to the west, with the Gate of Shallecheth on the ascending highway, guard corresponding to guard.
translation:
  language: hi
  text: शुप्पीम और होसा के लिए चिट्ठी पश्चिम की ओर पड़ी, शल्लेकेत[a] फाटक के साथ, उस ऊपर जाती हुई सड़क पर; पहरा पहरे के सामने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “शल्लेकेत” संभवतः फाटक का नाम है। इसका अर्थ “बाहर फेंकने का फाटक” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְשֻׁפִּים וּלְחֹסָה
  choice: शुप्पीम और होसा के लिए
  rationale: ל उपसर्ग यहाँ आस-पास के पदों में चिट्ठी द्वारा कार्य-निर्धारण का संकेत देता है; दोनों नामों के लिए संयुक्त रूप से ‘के लिए’ स्वाभाविक है।
- source_word: לַמַּעֲרָב
  choice: पश्चिम की ओर
  rationale: यह चिट्ठी द्वारा निर्धारित पश्चिमी दिशा अथवा भाग को व्यक्त करता है।
- source_word: עִם שַׁעַר שַׁלֶּכֶת
  choice: शल्लेकेत फाटक के पास
  rationale: עִם का मूल संबंधसूचक भाव बनाए रखते हुए यहाँ स्थल-संबंध के लिए ‘के पास’ सहज हिंदी है; שַׁלֶּכֶת को संभावित व्यक्तिवाचक फाटक-नाम मानकर लिप्यंतरित किया गया है।
- source_word: בַּמְסִלָּה הָעוֹלָה
  choice: ऊपर जाती हुई सड़क पर स्थित
  rationale: מְסִלָּה किसी बनाई हुई अथवा ऊँची सड़क का बोध करा सकता है और participle הָעוֹלָה उसकी चढ़ती दिशा बताता है; हिंदी में स्थल-संबंध स्पष्ट करने हेतु ‘स्थित’ जोड़ा गया है।
- source_word: מִשְׁמָר לְעֻמַּת מִשְׁמָר
  choice: पहरा, पहरे के सामने
  rationale: इब्रानी की संक्षिप्त और कुछ अस्पष्ट संरचना को बनाए रखा गया है; לְעֻמַּת आमने-सामने अथवा अनुरूप स्थिति का संकेत दे सकता है, और ‘सामने’ स्थानिक अर्थ को बिना अनावश्यक विस्तार के व्यक्त करता है।
