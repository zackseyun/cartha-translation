  edition: WLC
  text: וְ/לִֽ/שְׁמַֽעְיָ֤ה בְנ/וֹ֙ נוֹלַ֣ד בָּנִ֔ים הַ/מִּמְשָׁלִ֖ים לְ/בֵ֣ית אֲבִי/הֶ֑ם כִּֽי גִבּ֥וֹרֵי חַ֖יִל הֵֽמָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/006.yaml
  text: And to Shemaiah his son[a], sons were born who ruled over their fathers’ house[b], for they were mighty men of valor.
translation:
  language: hi
  text: और उसके पुत्र शमायाह के बेटे भी पैदा हुए, जो अपने पितृकुल के शासक थे, क्योंकि वे सामर्थी पुरुष थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִשְׁמַעְיָה בְנוֹ
  choice: और उसके पुत्र शमायाह के भी
  rationale: לְ के साथ जन्म-सूचक रचना को स्वाभाविक हिन्दी में संबंधसूचक रूप से व्यक्त किया गया है। בְנוֹ शमायाह को ओबेद-एदोम के पुत्र के रूप में पहचानता है; ‘भी’ वंशावली की अगली कड़ी को सहज बनाता है।
- source_word: נוֹלַד בָּנִים
  choice: बेटे पैदा हुए
  rationale: यद्यपि क्रिया रूपात्मक रूप से एकवचन है, जन्म-विवरण में उसका आशय बहुवचन ‘बेटों’ से है। हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: הַמִּמְשָׁלִים
  choice: अधिकारी थे
  rationale: משׁל यहाँ शासन या अधिकार रखने का भाव देता है। संदर्भ पारिवारिक-प्रशासनिक है, इसलिए ‘अधिकारी’ पद और वास्तविक अधिकार दोनों को संक्षेप में व्यक्त करता है।
- source_word: לְבֵית אֲבִיהֶם
  choice: अपने पितृकुल के
  rationale: בית אב का अर्थ केवल भवन नहीं, बल्कि पिता का घराना या वंशगत पारिवारिक इकाई है। ‘पितृकुल’ आधुनिक हिन्दी में इस सामाजिक-वंशीय अर्थ को स्पष्ट रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उनके अधिकारी होने का कारण प्रस्तुत करता है।
- source_word: גִּבּוֹרֵי חַיִל
  choice: सामर्थी और योग्य पुरुष
  rationale: मुहावरा शक्ति, वीरता, योग्यता और प्रतिष्ठित क्षमता को सूचित कर सकता है। गैर-युद्धात्मक, पारिवारिक-प्रशासनिक संदर्भ में यह अनुवाद केवल सैनिक वीरता तक अर्थ को सीमित नहीं करता।
- source_word: הֵמָּה
  choice: वे ... थे
  rationale: स्वतंत्र सर्वनाम का बल हिन्दी के स्पष्ट ‘वे’ द्वारा पर्याप्त रूप से व्यक्त होता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पितृकुल’ वंशगत घराने को और ‘सामर्थी और योग्य पुरुष’ सामर्थ्य तथा प्रमाणित क्षमता की संयुक्त धारणा को व्यक्त करता है।
