base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/001.yaml
  text: 'For the divisions of the gatekeepers: of the Korahites[a], Meshelemiah son of Kore, from the sons of Asaph.'
translation:
  language: hi
  text: 'द्वारपालों के दलों के विषय में[a]: कोरहवंशियों में से कोरे का पुत्र मेशेलेम्याह था, जो आसाप के पुत्रों में से था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “द्वारपालों के दलों के अनुसार।” आरम्भिक पदबंध द्वारपालों के दलों का परिचय देने वाले खंड-शीर्षक के रूप में काम करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְמַחְלְקוֹת לְשֹׁעֲרִים
  choice: द्वारपालों के दलों के विषय में
  rationale: आरम्भिक לְ पदबंध इस नए खंड का विषय या शीर्षक प्रस्तुत करता है। מַחְלְקוֹת संगठित दलों अथवा सेवा-क्रमों को दर्शाता है; आधुनिक हिन्दी में ‘दलों’ से यह संगठनात्मक भाव स्पष्ट रहता है।
- source_word: לַקָּרְחִים
  choice: कोरहवंशियों में से
  rationale: यह द्वारपालों के भीतर कोरह से संबंधित वंशीय समूह को पहचानता है। ‘कोरहवंशी’ साधारण हिन्दी पाठक के लिए केवल लिप्यंतरित बहुवचन की अपेक्षा अधिक स्पष्ट है।
- source_word: מְשֶׁלֶמְיָהוּ
  choice: मशेलेम्याह
  rationale: व्यक्तिनाम को इब्रानी व्यंजन-रूप के निकट, हिन्दी में सहज ढंग से लिप्यंतरित किया गया है।
- source_word: בֶן קֹרֵא
  choice: कोरे का पुत्र
  rationale: בֶן यहाँ निकट वंशावली संबंध का सीधा संकेत देता है, इसलिए ‘पुत्र’ स्वाभाविक और पर्याप्त है।
- source_word: מִן בְּנֵי אָסָף
  choice: आसाप के वंशजों में से
  rationale: מִן किसी बड़े पारिवारिक समूह में सदस्यता दर्शाता है और בְּנֵי वंशावली-सूची में व्यापक वंशजों को भी सूचित कर सकता है। ‘वंशजों में से’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह मानने के कि वे आसाप के प्रत्यक्ष पुत्र थे।
theological_decisions:
- issue: यहाँ उल्लिखित आसाप की पहचान
  choice: नाम को केवल वंशावली-सूचक रूप में रहने दिया गया है
  alternative: इसे प्रसिद्ध लेवीय गायक आसाप के रूप में स्पष्ट करना
  rationale: पद स्वयं इस आसाप की अतिरिक्त पहचान नहीं देता; किसी विशिष्ट व्यक्ति से उसकी समानता घोषित करना पाठ से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-जैसी वंशावली शैली के अनुकूल रखी गई है। शीर्षकीय आरम्भ को स्पष्ट करने के लिए विसर्ग का प्रयोग किया गया है; मूल पाठ की संक्षिप्तता बनाए रखते हुए संबंधों को हिन्दी में स्वाभाविक बनाने हेतु सीमित रूप से ‘में से’ और ‘जो…था’ जोड़े गए हैं।
