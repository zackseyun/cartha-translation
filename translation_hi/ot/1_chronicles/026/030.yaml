  text: לַֽ/חֶבְרוֹנִ֡י חֲשַׁבְיָהוּ֩ וְ/אֶחָ֨י/ו בְּנֵי חַ֜יִל אֶ֣לֶף וּ/שְׁבַע מֵא֗וֹת עַ֚ל פְּקֻדַּ֣ת יִשְׂרָאֵ֔ל מֵ/עֵ֥בֶר לַ/יַּרְדֵּ֖ן מַעְרָ֑בָ/ה לְ/כֹל֙ מְלֶ֣אכֶת יְהוָ֔ה וְ/לַ/עֲבֹדַ֖ת הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/030.yaml
  text: 'For the Hebronites: Hashabiah and his brothers[a], 1,700 capable men, were in charge of the oversight of Israel west of the Jordan, for all the work of the LORD and for the service of the king.'
translation:
  language: hi
  text: 'हेब्रोनियों के संबंध में: हशब्याह और उसके भाई, 1,700 योग्य पुरुष, यरदन के पश्चिम में[a] इस्राएल की देखरेख के अधिकारी थे; वे यहोवा के सब काम और राजा की सेवा के लिए उत्तरदायी थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “यरदन के पार, पश्चिम की ओर”; अर्थात यरदन के पश्चिमी भाग में।'
    reason: मूल भौगोलिक अभिव्यक्ति का अधिक शाब्दिक रूप और उसका प्रसंगगत आशय बताने के लिए।
lexical_decisions:
- source_word: לַחֶבְרוֹנִי
  choice: हेब्रोनियों में से
  rationale: एकवचन रूप यहाँ प्रसंगानुसार हेब्रोनियों के लेवीय कुल को सूचित करता है; हिन्दी में समूह का बोध स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: חֲשַׁבְיָהוּ
  choice: हशब्याह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְאֶחָיו
  choice: और उसके भाई
  rationale: मूल पारिवारिक शब्द को बनाए रखा गया है; कुल-संबंधी प्रसंग में इसका अर्थ निकट संबंधी भी हो सकता है।
- source_word: בְּנֵי חַיִל
  choice: योग्य पुरुष
  rationale: प्रशासनिक प्रसंग में यह पद सामर्थ्य और कार्य-कुशलता बताता है; अनावश्यक सैनिक अर्थ से बचते हुए क्षमता का भाव रखा गया है।
- source_word: עַל פְּקֻדַּת יִשְׂרָאֵל
  choice: इस्राएल की देखरेख के अधिकारी थे
  rationale: פְּקֻדָּה में देखरेख, प्रभार या निरीक्षण का भाव है; हिन्दी वाक्यांश प्रशासनिक उत्तरदायित्व को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: מֵעֵבֶר לַיַּרְדֵּן מַעְרָבָה
  choice: यरदन के पश्चिमी पार
  rationale: मूल के ‘यरदन के पार, पश्चिम की ओर’ भाव को संक्षिप्त हिन्दी में रखा गया है; आशय यरदन का पश्चिमी किनारा है।
- source_word: לְכֹל מְלֶאכֶת יְהוָה
  choice: यहोवा के सब काम
  rationale: מְלָאכָה के व्यापक अर्थ—काम, कार्य या दायित्व—को सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में परिचित लिप्यंतरण द्वारा व्यक्त किया गया है, किसी सामान्य उपाधि से नहीं बदला गया।
- source_word: וְלַעֲבֹדַת הַמֶּלֶךְ
  choice: और राजा की सेवा
  rationale: עֲבֹדָה का सेवा या नियुक्त दायित्व का अर्थ यहाँ उपयुक्त है और परमेश्वर के काम तथा राजकीय सेवा का भेद बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से है; हिन्दी पाठ में उसे परिचित नाम-रूप से व्यक्त करना स्रोत का भेद बनाए रखता है।
- issue: ‘यहोवा के काम’ और ‘राजा की सेवा’ का संबंध
  choice: दो समानांतर दायित्व
  alternative: दोनों को एक ही धार्मिक-राजकीय पद के रूप में मिला देना
  rationale: इब्रानी में दो अलग पूर्वसर्गीय पद हैं; अनुवाद दोनों क्षेत्रों को अलग रखता है और उनके परस्पर संबंध को अतिरिक्त रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सहज प्रशासनिक भाषा रखी गई है। संख्यांक को स्पष्टता के लिए अंकों में दिया गया है। मूल के लंबे वाक्य को दो वाक्यों में बाँटकर संबंध और दायित्व स्पष्ट किए गए हैं, बिना अर्थ बढ़ाए।
