lexical_decisions:
- source_word: פַּרְבָּר
  choice: परबार
  rationale: यह दुर्लभ इब्रानी स्थापत्य-संबंधी शब्द है और इसका सटीक अर्थ अनिश्चित है। लिप्यंतरण मूल की अस्पष्टता बनाए रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: מַעֲרָב
  choice: पश्चिम की ओर
  rationale: यह पश्चिम दिशा अथवा पश्चिमी भाग को सूचित करता है; प्रसंग में स्थान-विन्यास के लिए यह स्वाभाविक हिन्दी है।
- source_word: מְסִלָּה
  choice: सड़क
  rationale: यह मार्ग, ऊँची बनाई गई सड़क अथवा बाँध-सदृश पहुँच-मार्ग का बोध करा सकता है। मुख्य पाठ में सामान्य और तटस्थ शब्द चुना गया है तथा विकल्प पादटिप्पणी में रखा गया है।
- source_word: אַרְבָּעָה
  choice: चार
  rationale: यह उस स्थान पर नियुक्त पहरेदारों की संख्या है।
- source_word: שְׁנַיִם
  choice: दो
  rationale: यह परबार पर नियुक्त पहरेदारों की दूसरी संख्या है।
- source_word: לְ
  choice: के लिए / पर
  rationale: बार-बार आया संबंधबोधक उपसर्ग विभिन्न स्थानों के लिए नियुक्ति या वहाँ तैनाती दर्शाता है; हिन्दी में प्रसंगानुसार ‘के लिए’ और ‘पर’ स्वाभाविक हैं।
