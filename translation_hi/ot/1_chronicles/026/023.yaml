  yaml_path: translation/ot/1_chronicles/026/023.yaml
  text: For the Amramites[a], the Izharites, the Hebronites, and the Uzzielites.
translation:
  language: hi
  text: अम्रामी, यिसहारी, हेब्रोनी और उज्जीएली कुलों के लिए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अम्रामी, यिसहारी, हेब्रोनी और उज्जीएली कुलों के।” इब्रानी में केवल चार कुलवाचक नाम हैं, जिनमें प्रत्येक के साथ ל उपसर्ग है; यह एक सूची-शीर्षक के रूप में कार्य करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַעַמְרָמִי
  choice: अम्रामी कुल के विषय में
  rationale: ל उपसर्ग सहित कुलवाचक रूप यहाँ प्रशासनिक सूची के शीर्षक जैसा काम करता है। हिंदी में ‘के विषय में’ इस अधूरे शीर्षकीय स्वरूप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַיִּצְהָרִי
  choice: यिसहारी कुल
  rationale: यिसहार से बना यह कुलवाचक रूप है; ‘कुल’ साधारण हिंदी पाठक के लिए पहचान स्पष्ट करता है और सूची की संक्षिप्तता बनाए रखता है।
- source_word: לַחֶבְרוֹנִי
  choice: हेब्रोनी कुल
  rationale: यह हेब्रोन से संबंधित कुलवाचक पद है। नाम का लिप्यंतरण और ‘कुल’ मूल की पारिवारिक पहचान को सुरक्षित रखते हैं।
- source_word: לָעָזִּיאֵלִי
  choice: उज्जीएली कुल
  rationale: यह उज्जीएल से बना अंतिम कुलवाचक पद है। हिंदी सूची को स्वाभाविक बनाने के लिए इसके पहले ‘और’ जोड़ा गया है।
