base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/026/012.yaml
  text: For these divisions of the gatekeepers[a], the chief men had assigned duties corresponding to those of their brothers, to minister in the house of Yahweh.
translation:
  language: hi
  text: द्वारपालों के ये दल प्रधान पुरुषों के थे; यहोवा के भवन में सेवा करने के उनके दायित्व उनके भाइयों के दायित्वों के अनुरूप थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְאֵלֶּה מַחְלְקוֹת הַשֹּׁעֲרִים
  choice: द्वारपालों के इन दलों में
  rationale: לְאֵלֶּה के संबंधसूचक भाव और מַחְלְקוֹת के संगठित सेवा-दलों के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְרָאשֵׁי הַגְּבָרִים
  choice: प्रधान पुरुषों को भी
  rationale: רָאשֵׁי का नेतृत्व-सूचक अर्थ और גְּבָרִים का पुरुष-संदर्भ सुरक्षित है; ‘भी’ आगे के ‘अपने भाइयों के समान’ वाले समानांतर संबंध को स्पष्ट करता है।
- source_word: מִשְׁמָרוֹת
  choice: जिम्मेदारियाँ मिली थीं
  rationale: इस संक्षिप्त और क्रियारहित इब्रानी वाक्यांश में संज्ञा का अर्थ पहरे, सेवा-कार्य या नियुक्त जिम्मेदारियाँ हो सकता है। यहाँ स्वाभाविक हिन्दी के लिए सीमित क्रियात्मक पूर्ति की गई है।
- source_word: לְעֻמַּת אֲחֵיהֶם
  choice: अपने भाइयों के समान
  rationale: לְעֻמַּת का समानांतरता अथवा अनुरूपता का भाव और אֲחֵיהֶם का शाब्दिक पारिवारिक पद दोनों सुरक्षित रखे गए हैं।
- source_word: לְשָׁרֵת
  choice: सेवा करने
  rationale: मंदिर-संदर्भ में पवित्र सेवा का भाव है; आधुनिक हिन्दी में ‘सेवा करना’ स्पष्ट और गरिमापूर्ण है।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन में
  rationale: בֵּית का रूपक ‘भवन’ के रूप में और יהוה का व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी नाम יהוה है। हिन्दी पाठकों के बीच व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से नामात्मक स्वरूप बना रहता है, बिना उसे उपाधि ‘प्रभु’ में बदलने के।
- issue: גְּבָרִים में पुरुष-सूचकता
  choice: पुरुषों
  alternative: लोगों; अगुओं
  rationale: ऐतिहासिक संदर्भ पुरुष मंदिर-कर्मियों का है और इब्रानी पद पुरुष-सूचक है, इसलिए इसे तटस्थ नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण मंदिर-सेवा संबंधी शब्दावली। मूल इब्रानी की संक्षिप्त, क्रियारहित रचना को पठनीय बनाने के लिए ‘मिली थीं’ जोड़ा गया है, पर नियुक्ति करने वाले किसी अज्ञात कर्ता को पाठ में नहीं लाया गया।
