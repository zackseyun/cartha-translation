  text: 'The sons of Shemaiah: Othni[a], Rephael, Obed, Elzabad, whose brothers were capable men, Elihu and Semakiah.'
translation:
  language: hi
  text: 'शमायाह के पुत्र थे: ओत्नी, रफाएल, ओबेद और एलज़ाबाद। एलज़ाबाद के भाई एलीहू और समक्याहू योग्य पुरुष[a] थे।'
  philosophy: optimal-equivalence
