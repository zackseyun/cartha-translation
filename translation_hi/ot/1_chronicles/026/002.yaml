  text: 'And Shelemiah had sons: Zechariah the firstborn[a], Jediael the second, Zebadiah the third[b], and Jathniel the fourth.'
translation:
  language: hi
  text: 'और मेशेलेम्याह के पुत्र ये थे: पहलौठा जकर्याह, दूसरा यदीएल, तीसरा जबद्याह और चौथा यत्नीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלִמְשֶׁלֶמְיָהוּ בָּנִים
  choice: और मशेलेम्याह के पुत्र ये थे
  rationale: इब्रानी का शाब्दिक विन्यास ‘और मशेलेम्याह के लिए पुत्र’ एक क्रियारहित वंशावली-सूत्र है। स्वाभाविक हिन्दी में ‘के पुत्र ये थे’ उसका अर्थ स्पष्ट रखता है और וְ के प्रसंग-संयोजक बल को ‘और’ से बनाए रखता है।
- source_word: זְכַרְיָהוּ הַבְּכוֹר
  choice: पहलौठा जकर्याह
  rationale: בְּכוֹר का अर्थ केवल क्रम में पहला नहीं, बल्कि परिवार का पहलौठा पुत्र है; इसलिए ‘पहलौठा’ चुना गया है। नाम का प्रचलित हिन्दी बाइबलीय रूप ‘जकर्याह’ रखा गया है।
- source_word: יְדִיעֲאֵל הַשֵּׁנִי
  choice: दूसरा यदीएल
  rationale: क्रमवाचक विशेषण का सीधा अनुवाद ‘दूसरा’ है; नाम का निकट देवनागरी लिप्यंतरण ‘यदीएल’ रखा गया है।
- source_word: זְבַדְיָהוּ הַשְּׁלִישִׁי
  choice: तीसरा जबद्याह
  rationale: क्रमवाचक विशेषण को सीधे ‘तीसरा’ और नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘जबद्याह’ दिया गया है।
- source_word: יַתְנִיאֵל הָרְבִיעִי
  choice: चौथा यत्नीएल
  rationale: आरम्भिक इब्रानी योद को हिन्दी में ‘य’ से सीधे दर्शाया गया है; अतः अंग्रेज़ी परंपरा-आधारित Jathniel के बजाय स्रोत-निकट ‘यत्नीएल’ चुना गया। הָרְבִיעִי का सीधा अर्थ ‘चौथा’ है।
