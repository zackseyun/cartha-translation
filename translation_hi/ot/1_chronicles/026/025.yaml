  yaml_path: translation/ot/1_chronicles/026/025.yaml
  text: 'And his brothers belonging to Eliezer: Rehabiah his son[a], and Jeshaiah his son, and Joram his son, and Zichri his son, and Shelomith his son.'
translation:
  language: hi
  text: 'और एलीएज़ेर से संबंधित उसके भाई[a] ये थे: उसका पुत्र रहब्याह, रहब्याह का पुत्र यशायाह, यशायाह का पुत्र योराम, योराम का पुत्र जिक्री और जिक्री का पुत्र शलोमीत।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “उसके भाई, एलीएज़ेर के।” हिब्रू की यह असामान्य रचना संभवतः एलीएज़ेर की वंश-शाखा का परिचय देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶחָיו לֶאֱלִיעֶזֶר
  choice: और एलीएज़ेर से संबंधित उसके भाई-बन्धु
  rationale: शाब्दिक रचना ‘और उसके भाई एलीएज़ेर के लिए/के’ असामान्य है। वंशावली के संदर्भ में ל संबंध सूचित करता है और एलीएज़ेर की पारिवारिक शाखा का परिचय देता है। ‘भाई-बन्धु’ אָח के व्यापक कुल-संबंधी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רְחַבְיָהוּ
  choice: रहब्याह
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְנוֹ
  choice: उसका पुत्र / अमुक का पुत्र
  rationale: बार-बार आए इस संबंधसूचक पद को वंश-क्रम के रूप में स्पष्ट किया गया है। बाद के प्रत्येक ‘उसका’ का पूर्ववर्ती नाम से संबंध हिन्दी में नाम दोहराकर स्पष्ट किया गया, बिना वंशावली की सूचना बदले।
- source_word: וִישַׁעְיָהוּ
  choice: यशायाह
  rationale: नाम का निकट और परिचित हिन्दी लिप्यंतरण; यह इसी नाम वाले व्यक्ति को दर्शाता है, किसी अतिरिक्त पहचान को आरोपित नहीं करता।
- source_word: וְיֹרָם
  choice: योराम
  rationale: पाठ में लिखे संक्षिप्त नाम-रूप का लिप्यंतरण; इसे विस्तृत रूप ‘यहो राम/यहोरोम’ में नहीं बदला गया।
- source_word: וְזִכְרִי
  choice: जिक्री
  rationale: व्यक्तिगत नाम का सहज हिन्दी लिप्यंतरण।
- source_word: וּשְׁלֹמוֹת
  choice: शलोमीत
  rationale: व्यक्तिगत नाम के पारंपरिक रूप के निकट हिन्दी लिप्यंतरण।
