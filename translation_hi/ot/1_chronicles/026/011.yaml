  text: Hilkiah the second[a], Tebaliah the third, Zechariah the fourth. All the sons and brothers of Hosah were thirteen.
translation:
  language: hi
  text: दूसरा हिल्किय्याह था, तीसरा तबल्याह, और चौथा जकर्याह। होसा के सब पुत्र और भाई[a] मिलाकर तेरह थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः “कुल के पुरुष संबंधी”; यहाँ “भाई” के लिए आया शब्द व्यापक अर्थ में होसा के कुल के पुरुष रिश्तेदारों को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִלְקִיָּהוּ
  choice: हिल्किय्याह
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट, हिन्दी-पाठक के लिए स्वाभाविक लिप्यंतरण।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: सव्यय क्रमवाचक विशेषण सूची में क्रम को बताता है।
- source_word: טְבַלְיָהוּ
  choice: तबल्याह
  rationale: व्यक्तिवाचक नाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: הַשְּׁלִשִׁי
  choice: तीसरा
  rationale: क्रमसूचक विशेषण को सीधे और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: זְכַרְיָהוּ
  choice: जकर्याह
  rationale: व्यक्तिवाचक नाम का इब्रानी ध्वनि के निकट देवनागरी लिप्यंतरण।
- source_word: הָרְבִעִי
  choice: चौथा
  rationale: सूची के क्रम को दर्शाने वाला सीधा हिन्दी क्रमवाचक रूप।
- source_word: כָּל
  choice: सब ... मिलाकर
  rationale: यह पद समूह की कुल संख्या प्रस्तुत करता है; हिन्दी में ‘सब ... मिलाकर’ इस सारात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בָּנִים
  choice: पुत्र
  rationale: इब्रानी शब्द विशेष रूप से पुरुष संतानों को दर्शाता है; वंशावली-संदर्भ में ‘पुत्र’ सटीक और गरिमापूर्ण है।
- source_word: וְאַחִים
  choice: और भाई
  rationale: मूल शब्द का प्राथमिक अर्थ ‘भाई’ है; कुल-संबंध के व्यापक अर्थ की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: לְחֹסָה
  choice: होसा के
  rationale: सम्बन्ध अथवा स्वामित्व बताने वाले לְ को स्वाभाविक हिन्दी संबंधकारक से व्यक्त किया गया है।
- source_word: שְׁלֹשָׁה עָשָׂר
  choice: तेरह
  rationale: समूह की कुल संख्या का सीधा और प्रचलित हिन्दी रूप।
