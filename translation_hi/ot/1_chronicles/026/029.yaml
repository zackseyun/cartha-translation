  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल इब्रानी की संक्षिप्त पद-सूची शैली के अनुरूप स्पष्ट सहायक क्रिया जोड़ी गई है; नियुक्ति का कोई अतिरिक्त स्पष्ट क्रियापद नहीं जोड़ा गया।
