lexical_decisions:
- source_word: לַיִּצְהָרִי
  choice: यिसहारी वंशियों में से
  rationale: ל उपसर्ग के साथ वंश का नाम सूची में एक वर्ग प्रस्तुत करता है। हिन्दी में ‘वंशियों में से’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כְּנַנְיָהוּ
  choice: कनन्याह
  rationale: व्यक्तिनाम का अर्थानुवाद न करके उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וּבָנָיו
  choice: और उसके पुत्र
  rationale: בנים यहाँ पुरुष बहुवचन में वंश/परिवार के सदस्यों को सूचित करता है; इसलिए ‘पुत्र’ सटीक है।
- source_word: לַמְּלָאכָה הַחִיצוֹנָה
  choice: बाहरी कामकाज के लिए
  rationale: מְלָאכָה कार्य या दायित्व और חִיצוֹנָה बाहरी क्षेत्र को दर्शाता है। ‘कामकाज’ प्रशासनिक दायित्वों के भाव के अनुकूल है, जबकि ‘बाहरी’ मूल की स्थानगत अस्पष्टता बनाए रखता है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के
  rationale: इस प्रशासनिक प्रसंग में עַל इस्राएल से संबंधित या उस पर किए जाने वाले निरीक्षणात्मक काम को सूचित करता है। हिन्दी वाक्य में ‘इस्राएल के बाहरी कामकाज’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: לְשֹׁטְרִים
  choice: अधिकारी
  rationale: שֹׁטְרִים यहाँ प्रशासनिक पदाधिकारियों को दर्शाता है, न कि आधुनिक अर्थ के पुलिसकर्मियों को।
- source_word: וּלְשֹׁפְטִים
  choice: और न्यायी
  rationale: यह शब्द न्याय करने वाले व्यक्तियों को सीधे दर्शाता है; ‘न्यायी’ पारदर्शी और प्रसंगानुकूल है।
