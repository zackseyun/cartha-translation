  yaml_path: translation/ot/1_chronicles/026/015.yaml
  text: To Obed-edom[a], the south; and to his sons, the house of stores.
translation:
  language: hi
  text: ओबेद-एदोम को दक्षिण की ओर का स्थान मिला, और उसके पुत्रों को भंडार-गृह[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भंडारों का भवन’ अथवा ‘संग्रहों का भवन।’ इब्रानी शब्द किसी भंडारण-स्थान या संग्रह रखने के कक्षों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְעֹבֵד אֱדֹם
  choice: ओबेद-एदोम को
  rationale: लामेद उपसर्ग इस चिट्ठी द्वारा किए गए कार्य-विभाजन में प्राप्तकर्ता को दर्शाता है; हिंदी में ‘को’ स्वाभाविक है।
- source_word: נֶגְבָּה
  choice: दक्षिण की ओर का स्थान
  rationale: दिशासूचक प्रत्यय वाला यह रूप दक्षिण दिशा अथवा दक्षिणी ओर को दर्शाता है। संदर्भगत ‘स्थान’ जोड़ने से संक्षिप्त इब्रानी आवंटन-वाक्य हिंदी में स्पष्ट और स्वाभाविक बनता है।
- source_word: וּלְבָנָיו
  choice: और उसके पुत्रों को
  rationale: यह ओबेद-एदोम के पुत्रों को दूसरे दायित्व या स्थान के आवंटन का संकेत देता है; ‘पुत्रों’ से मूल का लिंग-सूचक अर्थ सुरक्षित रहता है।
- source_word: בֵּית הָאֲסֻפִּים
  choice: भंडार-गृह
  rationale: בֵּית भवन या गृह को और אסף से संबंधित הָאֲסֻפִּים एकत्र की हुई वस्तुओं अथवा उनके भंडारण को सूचित करता है; ‘भंडार-गृह’ मंदिर-परिसर के संदर्भ में संक्षिप्त और स्वाभाविक है, जबकि अन्य संभावित अर्थ पादटिप्पणी में रखे गए हैं।
