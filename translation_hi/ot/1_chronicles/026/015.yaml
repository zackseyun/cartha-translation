  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। मूल इब्रानी की संक्षिप्त आवंटन-शैली को बनाए रखते हुए हिंदी में स्पष्टता के लिए ‘स्थान मिला’ जोड़ा गया है; ‘फाटक’ नहीं जोड़ा गया, क्योंकि वह इस पद में प्रत्यक्ष रूप से नहीं है।
