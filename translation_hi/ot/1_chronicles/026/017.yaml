- source_word: שִׁשָּׁה
  choice: छः
  rationale: पूर्व दिशा में नियुक्त व्यक्तियों की संख्या बताने वाला मूल पाठ का अंक सुरक्षित रखा गया है।
- source_word: לַצָּפוֹנָה
  choice: उत्तर दिशा में
  rationale: यह पूर्व और दक्षिण के समानांतर स्थानसूचक दिशावाचक अभिव्यक्ति है।
- source_word: לַיּוֹם
  choice: प्रतिदिन
  rationale: प्रशासनिक नियुक्ति के संदर्भ में यह हर दिन निर्धारित संख्या का वितरण व्यक्त करता है।
- source_word: אַרְבָּעָה
  choice: चार
  rationale: उत्तर और दक्षिण दिशा की दैनिक नियुक्ति की संख्या।
- source_word: לַנֶּגְבָּה
  choice: दक्षिण दिशा में
  rationale: अन्य दिशाओं के समानांतर स्थानसूचक अनुवाद।
- source_word: וְלָאֲסֻפִּים
  choice: और भंडार-कक्षों पर
  rationale: शब्द संभवतः मन्दिर-परिसर के भंडारण-कक्षों अथवा ‘असुप्पीम’ नामक विशिष्ट स्थान को सूचित करता है; मुख्य पाठ में अर्थपरक अनुवाद और पादटिप्पणी में अनिश्चितता रखी गई है।
- source_word: שְׁנַיִם שְׁנָיִם
  choice: दो-दो
  rationale: संख्या की पुनरावृत्ति वितरणात्मक अर्थ देती है, जिसे हिन्दी में ‘दो-दो’ स्वाभाविक रूप से व्यक्त करता है।
