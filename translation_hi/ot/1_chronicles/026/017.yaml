  yaml_path: translation/ot/1_chronicles/026/017.yaml
  text: On the east were six Levites; on the north[a], four a day; on the south, four a day; and at the storehouses, two by two.
translation:
  language: hi
  text: पूर्व दिशा में छह लेवी थे; उत्तर दिशा में प्रतिदिन चार, दक्षिण दिशा में प्रतिदिन चार, और भंडार-कक्षों[a] पर दो-दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: असुप्पीम; यह शब्द सामान्य भंडार-कक्षों के बजाय किसी विशिष्ट स्थान अथवा कक्ष-समूह का नाम भी हो सकता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: לַמִּזְרָח
  choice: पूर्व दिशा में
  rationale: दिशासूचक संज्ञा पर लगा पूर्वसर्ग यहाँ स्थान अथवा नियुक्ति का क्षेत्र बताता है; सूची के संदर्भ में यह स्वाभाविक हिन्दी है।
- source_word: הַלְוִיִּם
  choice: लेवी
