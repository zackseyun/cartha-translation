source:
  edition: WLC
  text: וַ/יֹּ֡אמֶר חָלִילָ/ה֩ לִּ֨/י מֵ/אֱלֹהַ֜/י מֵ/עֲשׂ֣וֹת זֹ֗את הֲ/דַ֣ם הָ/אֲנָשִׁים֩ הָ/אֵ֨לֶּה אֶשְׁתֶּ֤ה בְ/נַפְשׁוֹתָ/ם֙ כִּ֣י בְ/נַפְשׁוֹתָ֣/ם הֱבִיא֔וּ/ם וְ/לֹ֥א אָבָ֖ה לִ/שְׁתּוֹתָ֑/ם אֵ֣לֶּה עָשׂ֔וּ שְׁלֹ֖שֶׁת הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/019.yaml
  text: And he said[a], “Far be it from me, by my God, to do this! Shall I drink the blood of these men at the cost of their lives? For they brought it at the cost of their lives.” So he was not willing to drink it[b]. These things the three mighty men did.
translation:
  language: hi
  text: उसने कहा, “मेरा परमेश्वर न करे कि मैं ऐसा करूँ! क्या मैं इन पुरुषों का रक्त पीऊँ,[a] जिन्होंने अपने प्राण दाँव पर लगा दिए हैं?[b] क्योंकि वे इसे अपने प्राण दाँव पर लगाकर लाए हैं।” इसलिए वह उसे पीने को तैयार नहीं हुआ। ये काम उन तीन वीर योद्धाओं ने किए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रक्त’ यहाँ अक्षरशः रखा गया है। दाऊद उस जल को उन पुरुषों के रक्त के समान मानता है, क्योंकि वे उसे प्राणघातक जोखिम उठाकर लाए थे।
    reason: cultural_note
  - marker: b
    text: इब्रानी में यहाँ और अगले वाक्य में एक ही अभिव्यक्ति दोहराई गई है, जिसका शाब्दिक रूप ‘अपने प्राणों के साथ’ है; आशय ‘अपने प्राणों को जोखिम में डालकर’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵאֱלֹהַי
  choice: मेरा परमेश्वर न करे कि मैं ऐसा करूँ
  rationale: यह स्वाभाविक हिन्दी में प्रबल निषेध व्यक्त करता है और परमेश्वर के प्रति अपील को बनाए रखता है। इब्रानी पदबंध की शपथ-सदृश अथवा परमेश्वर के सामने कही गई बात की छाया को किसी एक संकीर्ण व्याख्या में नहीं बाँधा गया।
- source_word: הֲדַם הָאֲנָשִׁים הָאֵלֶּה אֶשְׁתֶּה
  choice: क्या मैं इन पुरुषों का रक्त पीऊँ
  rationale: प्रश्नवाचक הֲ को आलंकारिक प्रश्न के रूप में रखा गया है और דַם का ठोस रूपक ‘रक्त’ बनाए रखा गया है।
- source_word: בְנַפְשׁוֹתָם
  choice: अपने प्राण दाँव पर लगाकर / अपने प्राण दाँव पर लगा दिए
  rationale: נֶפֶשׁ यहाँ शारीरिक जीवन को सूचित करता है। हिन्दी मुहावरा जीवन के घोर जोखिम को स्वाभाविक रूप से व्यक्त करता है; संदर्भ यह नहीं कहता कि वे वास्तव में मर गए थे।
- source_word: וְלֹא אָבָה לִשְׁתּוֹתָם
  choice: इसलिए वह उसे पीने को तैयार नहीं हुआ
  rationale: אָבָה इच्छा अथवा सहमति को सूचित करता है; ‘तैयार नहीं हुआ’ इस अर्थ को ‘इनकार कर दिया’ की अपेक्षा अधिक निकटता से रखता है। एकत्र जल के लिए एकवचन ‘उसे’ स्वाभाविक है।
- source_word: שְׁלֹשֶׁת הַגִּבּוֹרִים
  choice: तीन वीर योद्धा
  rationale: גִּבּוֹרִים दाऊद के विशिष्ट पराक्रमी सैनिकों के लिए प्रयुक्त सैन्य-वीरता का पद है; ‘वीर योद्धा’ आधुनिक हिन्दी में यह भाव स्पष्ट करता है।
theological_decisions:
- issue: दाऊद द्वारा जल को ‘रक्त’ कहना
  choice: मुख्य पाठ में ‘रक्त’ को अक्षरशः बनाए रखना
  alternative: इसे केवल ‘प्राणों को जोखिम में डालकर लाया गया जल’ कहकर स्पष्ट कर देना
  rationale: इब्रानी में स्पष्टतः ‘रक्त’ है। दाऊद उस जल को उनके प्राणघातक जोखिम के कारण उनके रक्त के तुल्य मानता है; रूपक को हटाने से कथन की नैतिक और धार्मिक तीव्रता घट जाएगी।
- issue: נֶפֶשׁ का आशय
  choice: ‘प्राण’ अर्थात जीवन
  alternative: ‘आत्मा’
  rationale: यहाँ प्रसंग शारीरिक जीवन को संकट में डालने का है, मनुष्य की अभौतिक आत्मा के विषय में कोई कथन नहीं।
- issue: חָלִילָה לִּי מֵאֱלֹהַי में परमेश्वर-संबंधी वाक्यांश
  choice: ‘मेरा परमेश्वर न करे’
  alternative: ‘मेरे परमेश्वर के सामने मुझसे ऐसा कदापि न हो’ अथवा ‘मेरे परमेश्वर की शपथ’
  rationale: वाक्यांश में परमेश्वर की ओर अपील और प्रबल निषेध दोनों हैं। चुना हुआ हिन्दी रूप स्वाभाविक है और इसे केवल स्थानगत ‘सामने’ या पूर्णतः स्पष्ट शपथ के रूप में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘रक्त’ कथात्मक-धार्मिक गंभीरता बनाए रखता है, जबकि ‘प्राण दाँव पर लगाना’ जोखिम का स्वाभाविक हिन्दी मुहावरा है। इब्रानी की पुनरावृत्ति को दोनों वाक्यांशों में यथासंभव बनाए रखा गया है।
