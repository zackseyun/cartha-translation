- source_word: וְיֹחָא
  choice: और ... योहा
  rationale: संयोजक וְ का अनुवाद ‘और’ किया गया तथा व्यक्तिवाचक नाम का लिप्यंतरण किया गया है।
- source_word: אָחִיו
  choice: उसका भाई
  rationale: אָחִיו का सामान्य और इस सूची में सर्वाधिक स्वाभाविक अर्थ सगा या पारिवारिक ‘भाई’ है; व्यापक ‘कुटुम्बी’ अर्थ को बिना प्रसंगगत आवश्यकता के नहीं अपनाया गया।
- source_word: הַתִּיצִי
  choice: जो तीज़ी था
  rationale: यह निश्चित उपपद सहित किसी स्थान या कुल से संबद्ध जातिवाचक पद है। उसके अज्ञात आधार को ‘निवासी’ या ‘कुल का’ कहकर निश्चित करने के बजाय पद को लिप्यंतरित किया गया है।
