source:
  edition: WLC
  text: גַּם תְּמ֣וֹל גַּם שִׁלְשׁ֗וֹם גַּ֚ם בִּ/הְי֣וֹת שָׁא֣וּל מֶ֔לֶךְ אַתָּ֛ה הַ/מּוֹצִ֥יא וְ/הַ/מֵּבִ֖יא אֶת יִשְׂרָאֵ֑ל וַ/יֹּאמֶר֩ יְהוָ֨ה אֱלֹהֶ֜י/ךָ לְ/ךָ֗ אַתָּ֨ה תִרְעֶ֤ה אֶת עַמִּ/י֙ אֶת יִשְׂרָאֵ֔ל וְ/אַתָּה֙ תִּהְיֶ֣ה נָגִ֔יד עַ֖ל עַמִּ֥/י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/002.yaml
  text: Even in times past[a], even before, when Saul was king, you were the one who led Israel out and brought them in; and Yahweh your God said to you, ‘You shall shepherd my people Israel[c][b], and you shall be ruler over my people Israel.’
translation:
  language: hi
  text: पहले भी, जब शाऊल राजा था, तू ही इस्राएल को बाहर ले जाता और भीतर लाता था[a]। और तेरे परमेश्वर याहवे ने तुझसे कहा था, ‘तू मेरी प्रजा इस्राएल की चरवाहे की तरह देखभाल करेगा, और तू मेरी प्रजा इस्राएल का प्रधान होगा[b]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल को बाहर ले जाता और भीतर लाता था”; यह लोगों का नेतृत्व करने के लिए प्रयुक्त इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या “शासक” अथवा “अगुआ”; यहाँ प्रयुक्त इब्रानी शब्द सामान्यतः “राजा” के लिए प्रयुक्त शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם תְּמוֹל גַּם שִׁלְשׁוֹם
  choice: पहले भी
  rationale: शाब्दिक रूप से ‘कल और परसों’ वाला यह इब्रानी मुहावरा बीते समय को दर्शाता है। ‘पहले भी’ स्वाभाविक हिन्दी में उसका अर्थ और גַּם का बल व्यक्त करता है।
- source_word: בִּהְיוֹת שָׁאוּל מֶלֶךְ
  choice: जब शाऊल राजा था
  rationale: בְּ के साथ infinitive construct समयसूचक उपवाक्य बनाता है; यह सरल और स्वाभाविक हिन्दी रूप है।
- source_word: אַתָּה הַמּוֹצִיא וְהַמֵּבִיא אֶת יִשְׂרָאֵל
  choice: तू ही इस्राएल को बाहर ले जाता और भीतर लाता था
  rationale: यह नेतृत्व का मुहावरा है। अनुवाद इब्रानी की बाहर/भीतर वाली छवि बनाए रखता है और सकर्मक रूप के अनुसार दाऊद द्वारा इस्राएल का नेतृत्व व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: תִרְעֶה
  choice: चरवाही करेगा
  rationale: यह राजकीय चरवाहे का रूपक है। ‘चरवाही करेगा’ उस रूपक को सुरक्षित रखते हुए सामान्य हिन्दी में स्पष्ट है।
- source_word: נָגִיד
  choice: प्रधान
  rationale: נָגִיד नियुक्त अगुआ या शासक को दर्शाता है, पर यह सामान्य ‘राजा’ (מֶלֶךְ) शब्द नहीं है। ‘प्रधान’ इस भेद को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी में परिचित नामरूप ‘यहोवा’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: תִרְעֶה में नेतृत्व का चरवाहा-रूपक
  choice: तू मेरी प्रजा इस्राएल की चरवाही करेगा
  alternative: तू मेरी प्रजा इस्राएल पर शासन करेगा; तू मेरी प्रजा इस्राएल की देखभाल करेगा
  rationale: मूल में चरवाहे का रूपक स्पष्ट है; उसे बनाए रखने से राजकीय और धार्मिक प्रतिध्वनि बिना किसी अतिरिक्त व्याख्या के बनी रहती है।
- issue: נָגִיד और מֶלֶךְ के बीच भेद
  choice: प्रधान
  alternative: शासक; अगुआ; राजकुमार
  rationale: पद दाऊद के अधिकार को व्यक्त करता है, पर उसी पद में उसे מֶלֶךְ ‘राजा’ नहीं कहता। ‘प्रधान’ इस शब्दगत तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली अपनाई गई है। प्रत्यक्ष संबोधन में ‘तू’ रखा गया है, क्योंकि मूल इब्रानी में दाऊद को एकवचन संबोधन है और हिन्दी बाइबलीय वाणी में परमेश्वर द्वारा व्यक्ति को संबोधित करते समय यह स्वाभाविक है। वाक्य-विन्यास को बोलचाल की सहजता देते हुए बाहर/भीतर और चरवाही की मूल छवियाँ सुरक्षित रखी गई हैं।
