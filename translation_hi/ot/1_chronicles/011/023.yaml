base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/023.yaml
  text: And he struck down the Egyptian[a], a man five cubits tall. In the Egyptian’s hand was a spear like a weaver’s beam, and he went down to him with a staff, snatched the spear from the Egyptian’s hand[c][b], and killed him with his own spear.
translation:
  language: hi
  text: और उसने उस मिस्री को मार गिराया[a]—वह पाँच हाथ[b] ऊँचा आदमी था। उस मिस्री के हाथ में जुलाहे के शहतीर के समान एक भाला था। वह एक लाठी[c] लेकर उसके पास उतरा, मिस्री के हाथ से भाला छीन लिया और उसी के भाले से उसे मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “नाप का आदमी” है; इसका अर्थ असाधारण कद-काठी वाला पुरुष भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हाथ” प्राचीन लंबाई की एक इकाई थी, जो लगभग कोहनी से उँगलियों के सिरों तक की दूरी के बराबर मानी जाती थी।
    reason: cultural_note
  - marker: c
    text: “लाठी” के स्थान पर “डंडा” या “छड़ी” भी सम्भव है।
    reason: lexical_alternative
