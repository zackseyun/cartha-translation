- source_word: חֲנִית
  choice: भाला
  rationale: युद्ध के हथियार और जुलाहे के शहतीर से उसकी तुलना के अनुकूल सामान्य हिन्दी शब्द।
- source_word: כִּמְנוֹר אֹרְגִים
  choice: जुलाहे के शहतीर जैसी
  rationale: भाले के डंडे की असाधारण मोटाई का पारंपरिक और स्रोत-संगत चित्र बनाए रखता है।
- source_word: וַיֵּרֶד אֵלָיו
  choice: उसके पास उतरा
  rationale: ירד के शाब्दिक उतरने के भाव को बिना 'आक्रमण किया' जैसी व्याख्या जोड़े सुरक्षित रखता है।
- source_word: בַּשָּׁבֶט
  choice: एक लाठी लेकर
  rationale: שבט के सम्भव अर्थों में तटस्थ और संदर्भानुकूल चयन; डंडा या गदा भी सम्भव हैं।
- source_word: וַיִּגְזֹל
  choice: छीन लिया
  rationale: बलपूर्वक हथियार ले लेने की तीव्र युद्धगत क्रिया स्पष्ट करता है।
- source_word: וַיַּהַרְגֵהוּ
  choice: उसे मार डाला
  rationale: स्पष्ट हत्या-वाचक क्रिया को वर्तमान, सहज हिन्दी में प्रस्तुत करता है।
- source_word: בַּחֲנִיתוֹ
  choice: उसी की भाला से
  rationale: सर्वनाम का स्वाभाविक संदर्भ मिस्री और उससे छीनी गई भाला है; हिन्दी में यह विडंबना स्पष्ट रहती है।
