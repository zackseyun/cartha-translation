language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֛לֶּה מִסְפַּ֥ר הַ/גִּבֹּרִ֖ים אֲשֶׁ֣ר לְ/דָוִ֑יד יָשָׁבְעָ֣ם בֶּן חַכְמוֹנִ֗י רֹ֚אשׁ ה/שלושים הֽוּא עוֹרֵ֧ר אֶת חֲנִית֛/וֹ עַל שְׁלֹשׁ מֵא֥וֹת חָלָ֖ל בְּ/פַ֥עַם אֶחָֽת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/011.yaml
  text: 'And these are the number of David’s mighty men: Jashobeam son of Hachmoni[a], the chief of the Thirty; he wielded his spear against three hundred slain in one encounter.'
translation:
  language: hi
  text: 'दाऊद के वीर योद्धाओं की सूची यह है: याशोबाम, हकमोनी का पुत्र, तीस के दल का प्रधान था। उसने एक ही अवसर पर तीन सौ मारे हुओं के विरुद्ध अपना भाला उठाया।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने एक ही अवसर पर तीन सौ मारे हुओं के विरुद्ध अपना भाला भाँजा।” हिब्रू अभिव्यक्ति संक्षिप्त और कुछ कठिन है। भाले की क्रिया को “उठाया,” “भाँजा,” या “चलाया” कहा जा सकता है; “मारे हुए” शब्द का संबंध और घटना का परिणाम भी अनुवादों में अलग-अलग ढंग से व्यक्त किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסְפַּר הַגִּבֹּרִים
  choice: वीर योद्धाओं का विवरण
  rationale: מִסְפַּר का मूल अर्थ ‘गिनती’ या ‘संख्या’ है, पर यहाँ यह योद्धाओं के क्रमबद्ध विवरण का परिचय देता है। ‘विवरण’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का आशय स्पष्ट करता है।
- source_word: אֲשֶׁר לְדָוִיד
  choice: दाऊद के
  rationale: לְ यहाँ दाऊद से संबंध या संबद्धता प्रकट करता है; हिन्दी का संबंधकारक इसे संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָשָׁבְעָם בֶּן חַכְמוֹנִי
  choice: याशोबाम, हकमोनी का पुत्र
  rationale: नामों का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण किया गया है और स्पष्ट पुत्र-संबंध बनाए रखा गया है।
- source_word: רֹאשׁ הַשלושים
  choice: तीसों का प्रधान
  rationale: רֹאשׁ पद या नेतृत्व के अर्थ में ‘प्रधान’ है। ‘तीसों’ विशिष्ट वीर-दल की पदवी को बनाए रखता है, यद्यपि इस पद में पाठगत और समानांतर-वृत्तांत संबंधी कठिनाई है।
- source_word: עוֹרֵר אֶת חֲנִיתוֹ
  choice: अपना भाला चलाया
  rationale: עוֹרֵר का सामान्य अर्थ ‘जगाना/उभारना’ है, पर भाले के साथ यह युद्ध में उसे उठाने, भाँजने या प्रयोग करने का संक्षिप्त मुहावरा है। ‘भाला चलाया’ हिन्दी में स्वाभाविक युद्धगत क्रिया है।
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: तीन सौ पुरुषों के विरुद्ध ... और उन्हें मार डाला
  rationale: עַל विरोधी दिशा में आक्रमण को दिखाता है और חָלָל मारे गए लोगों को। हिन्दी में मूल के परिणाम को स्पष्ट करने के लिए वाक्य को स्वाभाविक रूप दिया गया है, बिना यह कहे कि वे एक ही वार में मारे गए।
- source_word: בְּפַעַם אֶחָת
  choice: एक ही मुठभेड़ में
  rationale: शाब्दिक अर्थ ‘एक ही बार/अवसर पर’ है। युद्ध के प्रसंग में ‘एक ही मुठभेड़ में’ एक घटना का आशय देता है और ‘एक ही वार में’ जैसी अतिशयोक्ति से बचता है।
