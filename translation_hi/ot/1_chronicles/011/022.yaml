  text: בְּנָיָ֨ה בֶן יְהוֹיָדָ֧ע בֶּן אִֽישׁ חַ֛יִל רַב פְּעָלִ֖ים מִֽן קַבְצְאֵ֑ל ה֣וּא הִכָּ֗ה אֵ֣ת שְׁנֵ֤י אֲרִיאֵל֙ מוֹאָ֔ב וְ֠/הוּא יָרַ֞ד וְ/הִכָּ֧ה אֶֽת הָ/אֲרִ֛י בְּ/ת֥וֹךְ הַ/בּ֖וֹר בְּ/י֥וֹם הַ/שָּֽׁלֶג־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/022.yaml
  text: Benaiah son of Jehoiada[a], son of a mighty man, a man of many deeds, from Kabzeel—he struck down the two heroes of Moab. He also went down and struck down the lion in the midst of a pit on a snowy day.
translation:
  language: hi
  text: यहोयादा का पुत्र बनायाह कबसेएल के एक पराक्रमी और बड़े-बड़े काम करनेवाले पुरुष का पुत्र था। उसने मोआब के दो वीरों[a] को मार गिराया। वह बर्फ़ वाले दिन एक गड्ढे में उतरा और वहाँ एक सिंह को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी पद אֲרִיאֵל מוֹאָב का अर्थ अनिश्चित है। इसका अर्थ ‘मोआब के अरीएल के दो पुत्र’, ‘मोआब के दो अरीएल’ या ‘मोआब के दो सिंह-समान वीर’ भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ חַיִל
  choice: पराक्रमी पुरुष
  rationale: युद्धवीरों की इस सूची में यह पद शक्ति, वीरता और सिद्ध क्षमता को व्यक्त करता है; ‘पराक्रमी पुरुष’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: רַב פְּעָלִים
  choice: बड़े-बड़े काम करनेवाला
  rationale: शाब्दिक अर्थ ‘बहुत कामों/कार्यों वाला’ है। यह अनुवाद उल्लेखनीय वीरतापूर्ण कारनामों का भाव सरल हिन्दी में देता है, पर उनके स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מִן קַבְצְאֵל
  choice: कबसेएल के ... पुरुष
  rationale: מן यहाँ उद्गम या निवास-स्थान बताता है। हिन्दी वाक्य-विन्यास में इसे उस पुरुष के स्थान-संबंध के रूप में रखा गया है।
- source_word: הִכָּה
  choice: मार गिराया
  rationale: נכה का अर्थ प्रहार करना या धराशायी करना है। वीरगाथात्मक संदर्भ में ‘मार गिराया’ हिंसक और संभवतः घातक परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁנֵי אֲרִיאֵל מוֹאָב
  choice: मोआब के दो वीरों
  rationale: אֲרִיאֵל यहाँ कठिन और अनिश्चित है। ‘दो वीर’ प्रसंग में संभावित अर्थ को पठनीय बनाता है, जबकि अन्य वास्तविक संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: יָרַד
  choice: उतरा
  rationale: सामान्य क्रिया ‘नीचे उतरना’ गड्ढे में जाने की गति को संक्षेप और स्वाभाविक रूप से बताती है।
- source_word: הָאֲרִי
  choice: एक सिंह
  rationale: संज्ञा यहाँ स्पष्ट रूप से सिंह को सूचित करती है; हिन्दी में पहली बार उल्लेख होने के कारण ‘एक सिंह’ स्वाभाविक है।
- source_word: בְּתוֹךְ הַבּוֹר
  choice: एक गड्ढे में ... वहाँ
  rationale: मूल वाक्य सिंह को गड्ढे के भीतर स्थित बताता है। हिन्दी में ‘गड्ढे में उतरा और वहाँ’ उसी स्थानिक संबंध को स्पष्ट और सहज बनाता है।
- source_word: בְּיוֹם הַשָּׁלֶג
  choice: बर्फ़ पड़ने के दिन
  rationale: शाब्दिक रूप से ‘बर्फ़ के दिन’; चुना हुआ रूप उस समय की हिमपात वाली परिस्थिति को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
