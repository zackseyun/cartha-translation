  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक शैली अपनाई गई है। ‘अगुए’, ‘छावनी’ और ‘डेरा डाले हुए’ सामान्य पाठक के लिए सुबोध हैं; स्थल-संबंधी इब्रानी अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
