  text: וַ/יֵּרְד֡וּ שְֽׁלוֹשָׁה֩ מִן הַ/שְּׁלוֹשִׁ֨ים רֹ֤אשׁ עַל הַ/צֻּר֙ אֶל דָּוִ֔יד אֶל מְעָרַ֖ת עֲדֻלָּ֑ם וּ/מַחֲנֵ֣ה פְלִשְׁתִּ֔ים חֹנָ֖ה בְּ/עֵ֥מֶק רְפָאִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/015.yaml
  text: Then three of the thirty chiefs went down to the rock[a], to David, at the cave of Adullam, while the camp of the Philistines was encamped in the Valley of Rephaim.
translation:
  language: hi
  text: तब उन तीस प्रधानों में से तीन चट्टान पर, अदुल्लाम की गुफा में दाऊद के पास उतर गए। उस समय पलिश्तियों की छावनी रपाईम की घाटी में डेरा डाले हुए थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: उतर आए
  rationale: ירד के दिशात्मक अर्थ ‘नीचे उतरना’ को रखता है; दाऊद की ओर गति होने के कारण हिन्दी में ‘उतर आए’ स्वाभाविक है।
- source_word: שְׁלוֹשָׁה מִן הַשְּׁלוֹשִׁים רֹאשׁ
  choice: उन तीस अगुओं में से तीन
  rationale: तीस के ज्ञात दल में से तीन प्रमुख व्यक्तियों का बोध कराता है। संक्षिप्त इब्रानी विन्यास में רֹאשׁ पद या प्रमुखता सूचित करता है; ‘अगुए’ किसी विशेष सैन्य पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַל־הַצּוּר
  choice: चट्टान पर
  rationale: עַל का मूल स्थानिक अर्थ और הַצּוּר का ठोस स्थल-संदर्भ सुरक्षित रहता है। प्रसंग में यह चट्टानी शरणस्थल हो सकता है, पर अनुवाद इसे ‘गढ़’ नहीं बनाता।
- source_word: אֶל־דָּוִיד אֶל־מְעָרַת עֲדֻלָּם
  choice: अदुल्लाम की गुफा में दाऊद के पास
  rationale: दोनों אֶל-वाक्यांशों के संकुचित संबंध को स्वाभाविक हिन्दी में दाऊद का स्थान स्पष्ट करते हुए व्यक्त करता है, बिना यह दावा किए कि इब्रानी वाक्य-विन्यास पूर्णतः असंदिग्ध है।
- source_word: וּמַחֲנֵה פְלִשְׁתִּים חֹנָה
  choice: उस समय पलिश्तियों की छावनी ... डेरा डाले हुए थी
  rationale: वाव से आरम्भ इस खंड की परिस्थितिजन्य पृष्ठभूमि तथा חֹנָה कृदंत की जारी अवस्था को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵמֶק רְפָאִים
  choice: रपाईम की घाटी में
  rationale: भौगोलिक नाम רְפָאִים का देवनागरी लिप्यंतरण करते हुए स्थान-सूचक अर्थ बनाए रखता है।
