base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/043.yaml
  text: Hanan son of Maacah[a], and Joshaphat the Mithnite;
translation:
  language: hi
  text: माका का पुत्र हानान, और मित्नी योशापात[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी नाम יוֹשָׁפָט उस अधिक परिचित विस्तृत नाम-रूप से छोटा है जिसे प्रायः “यहोशापात” लिखा जाता है; इसलिए यहाँ “योशापात” है।
    reason: नाम के छोटे इब्रानी रूप और अधिक परिचित विस्तृत रूप के बीच पाठगत-शाब्दिक अंतर स्पष्ट करना।
lexical_decisions:
- source_word: חָנָן
  choice: हानान
  rationale: व्यक्तिवाचक नाम का उसके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश अथवा पितृ-संबंध बताने वाली सामान्य इब्रानी अभिव्यक्ति; सूची के संदर्भ में स्वाभाविक हिन्दी पदक्रम अपनाया गया है।
- source_word: מַעֲכָה
  choice: माका
  rationale: व्यक्तिवाचक नाम का सरल, प्रचलन-संगत देवनागरी लिप्यंतरण।
- source_word: וְיוֹשָׁפָט
  choice: और योशापात
  rationale: संयोजक के साथ नाम के इसी पद में पाए जाने वाले छोटे इब्रानी रूप יוֹשָׁפָט को दर्शाया गया है; अधिक परिचित विस्तृत रूप को मूल पाठ में नहीं थोपा गया।
- source_word: הַמִּתְנִי
  choice: मित्नी
  rationale: निश्चित उपाधि/जातिवाचक रूप, जो किसी स्थान या कुल से संबंध बताता है; संक्षिप्त योद्धा-सूची में हिन्दी विशेषण-संज्ञा के रूप में लिप्यंतरित किया गया है।
