  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी; मूल सूची की संक्षिप्त शैली बनाए रखी गई है। अंग्रेज़ी परामर्श-पाठ में पाद-टिप्पणी का चिह्न ‘Maacah’ के बाद था, पर उसकी विषयवस्तु יוֹשָׁפָט से संबंधित होने के कारण हिन्दी मुख्य पाठ में चिह्न ‘योशापात’ के बाद रखा गया है।
