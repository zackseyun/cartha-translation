  text: וַ/יֹּ֣אמֶר דָּוִ֔יד כָּל מַכֵּ֤ה יְבוּסִי֙ בָּ/רִ֣אשׁוֹנָ֔ה יִהְיֶ֥ה לְ/רֹ֖אשׁ וּ/לְ/שָׂ֑ר וַ/יַּ֧עַל בָּ/רִאשׁוֹנָ֛ה יוֹאָ֥ב בֶּן צְרוּיָ֖ה וַ/יְהִ֥י לְ/רֹֽאשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/006.yaml
  text: And David said[a], “Whoever strikes down a Jebusite first shall become chief and commander.” So Joab son of Zeruiah went up first[b], and he became chief.
translation:
  language: hi
  text: तब दाऊद ने कहा, “जो कोई सबसे पहले किसी यबूसी को मार गिराएगा, वह प्रधान और सेनापति बनेगा।” तब सरूयाह का पुत्र योआब सबसे पहले चढ़ गया[a], और वह प्रधान बन गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “चढ़ गया” का आशय दुर्ग पर चढ़कर आक्रमण करने से हो सकता है, पर हिब्रू में सामान्यतः केवल “ऊपर गया/चढ़ गया” कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: כָּל מַכֵּה יְבוּסִי
  choice: जो कोई ... किसी यबूसी को मार गिराएगा
  rationale: כָּל के साथ कृदंत यहाँ अनिश्चित संबंधवाचक अर्थ ‘जो कोई’ देता है। सैन्य प्रसंग में נכה के लिए ‘मार गिराना’ प्रहार से अधिक स्वाभाविक और सशक्त है; एकवचन יְבוּסִי को जातिवाचक रूप में ‘किसी यबूसी’ कहा गया है।
- source_word: בָּרִאשׁוֹנָה
  choice: सबसे पहले
  rationale: यह क्रिया करने में प्राथमिकता दर्शाता है। हिंदी में ‘सबसे पहले’ पुरस्कार की शर्त और योआब की कार्रवाई—दोनों स्थानों पर स्पष्ट तथा स्वाभाविक है।
- source_word: יִהְיֶה לְרֹאשׁ וּלְשָׂר
  choice: वह प्रधान और सेनापति बनेगा
  rationale: לְרֹאשׁ नेतृत्व की प्रमुख स्थिति और שַׂר अधिकारयुक्त, यहाँ सैन्य नेतृत्व, दर्शाता है। ‘प्रधान और सेनापति’ दोनों पदों को अलग रखते हुए सहज आधुनिक हिंदी देता है।
- source_word: וַיַּעַל
  choice: चढ़ गया
  rationale: עלה का मूल अर्थ ऊपर जाना/चढ़ना है। दुर्ग पर सैन्य चढ़ाई का भाव संभव है, पर ‘आक्रमण किया’ कहने से मूल की अपेक्षा अधिक व्याख्या जुड़ती; इसलिए ‘चढ़ गया’ रखा गया है।
- source_word: יוֹאָב בֶּן צְרוּיָה
  choice: सरूयाह का पुत्र योआब
  rationale: हिब्रू वंशसूचक पदबंध को स्वाभाविक हिंदी क्रम में प्रस्तुत किया गया है और प्रचलित बाइबलीय नाम-रूप बनाए रखे गए हैं।
- source_word: וַיְהִי לְרֹאשׁ
  choice: और वह प्रधान बन गया
  rationale: यह पहले दिए वचन में आए רֹאשׁ को दोहराता है। यहाँ केवल רֹאשׁ है, שַׂר नहीं, इसलिए केवल ‘प्रधान’ रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’ और ‘सेनापति’ से नेतृत्व के दोनों हिब्रू पद अलग बने रहते हैं। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
