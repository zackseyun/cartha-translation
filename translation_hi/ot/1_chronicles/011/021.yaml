base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/021.yaml
  text: He was more honored than the two among the three[a], and he became their commander; but he did not attain to the three.
translation:
  language: hi
  text: तीनों के बीच वह उन दोनों से अधिक सम्मानित था[a] और उनका सेनापति बन गया; फिर भी वह उन तीनों के पद तक नहीं पहुँचा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उन तीनों से अधिक सम्मानित था—उन दोनों के द्वारा।” इब्रानी वाक्य बहुत संक्षिप्त और कठिन है। आशय यह है कि किसी श्रेणीबद्ध वीर-दल में उसे बड़ा सम्मान मिला था, फिर भी वह “उन तीनों” के बराबर नहीं हुआ।
    reason: alternative_reading
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשָׁה בַשְּׁנַיִם
  choice: उन तीनों में वह दो से अधिक
  rationale: इब्रानी पदबंध संक्षिप्त और व्याकरण की दृष्टि से कठिन है। यह अनुवाद तुलनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और तीन के समूह में दो की अपेक्षा उसकी श्रेष्ठ प्रतिष्ठा का संकेत बनाए रखता है।
- source_word: נִכְבָּד
  choice: अधिक सम्मानित था
  rationale: निफ़अल रूप यहाँ किसी व्यक्ति के सम्मानित या अत्यधिक प्रतिष्ठित माने जाने को व्यक्त करता है; तुलनात्मक रचना के कारण ‘अधिक’ जोड़ा गया है।
- source_word: וַיְהִי לָהֶם לְשָׂר
  choice: उनका सेनापति बन गया
  rationale: שַׂר का अर्थ प्रधान, अगुआ या सेनापति हो सकता है। दाऊद के वीर योद्धाओं के सैन्य प्रसंग में ‘सेनापति’ स्पष्ट और स्वाभाविक है।
- source_word: וְעַד הַשְּׁלוֹשָׁה לֹא בָא
  choice: फिर भी वह उन तीनों के पद तक नहीं पहुँचा
  rationale: עַד के साथ בוא यहाँ किसी स्थान पर शारीरिक रूप से पहुँचने के बजाय प्रतिष्ठा या श्रेणी तक पहुँचने का भाव देता है। ‘पद तक नहीं पहुँचा’ इस दर्जागत अर्थ को स्पष्ट करता है।
