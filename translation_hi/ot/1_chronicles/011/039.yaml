  choice: सेलेक
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक लिप्यंतरण।
- source_word: הָעַמּוֹנִי
  choice: अम्मोनी
  rationale: निश्चित जातिवाचक विशेषण, जो सेलेक की जातीय अथवा भौगोलिक पहचान बताता है।
- source_word: נַחְרַי
  choice: नहरै
  rationale: मसोरेटी स्वरांकन के अनुरूप व्यक्तिवाचक नाम का सहज हिन्दी लिप्यंतरण।
- source_word: הַבֵּרֹתִי
  choice: बेरोती
  rationale: बेरोत स्थान से संबंध बताने वाला निश्चित निवासी-सूचक शब्द।
- source_word: נֹשֵׂא כְּלֵי
  choice: शस्त्रवाहक
  rationale: शाब्दिक अर्थ ‘हथियारों/साज-सामान को उठानेवाला’ है; प्रसंग में यह स्थापित सैनिक पद है, जिसे ‘शस्त्रवाहक’ स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: יוֹאָב
  choice: योआब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: בֶּן צְרוּיָה
  choice: सरूयाह के पुत्र
  rationale: सम्बन्धवाचक इब्रानी पदबंध को स्वाभाविक हिन्दी में रखते हुए योआब की मातृवंशीय पहचान सुरक्षित की गई है।
