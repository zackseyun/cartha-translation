lexical_decisions:
- source_word: וְגִבּוֹרֵי הַחֲיָלִים
  choice: और पराक्रमी योद्धा
  rationale: यह पदबंध सामर्थ्यवान और वीर लड़ाकों, विशेषकर विशिष्ट योद्धाओं, को दर्शाता है। ‘पराक्रमी योद्धा’ आधुनिक हिन्दी में स्वाभाविक है और सैन्य भाव बनाए रखता है; आरम्भिक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: עֲשָׂהאֵל
  choice: असाहेल
  rationale: इस इब्रानी व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲחִי יוֹאָב
  choice: योआब का भाई
  rationale: सम्बन्ध बतानेवाली रचना को स्वाभाविक आधुनिक हिन्दी में प्रस्तुत किया गया है।
- source_word: אֶלְחָנָן
  choice: एल्हानान
  rationale: इब्रानी व्यक्तिनाम का निकट और प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן דּוֹדוֹ
  choice: दोदो का पुत्र
  rationale: वंशसूचक पदबंध का सीधा अनुवाद; यहाँ ‘दोदो’ एक व्यक्तिनाम है।
- source_word: מִבֵּית לָחֶם
  choice: बैतलहम से था
  rationale: מִן के साथ स्थाननाम उद्गम या निवास-स्थान दर्शाता है। ‘बैतलहम से था’ इब्रानी अभिव्यक्ति के निकट रहते हुए सहज हिन्दी देता है।
