base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/017.yaml
  text: And David longed and said[b][a], “Who will give me water to drink from the well of Bethlehem that is by the gate?”
translation:
  language: hi
  text: दाऊद ने लालसा व्यक्त करते हुए कहा,[a] “कौन मुझे बेतलेहेम के उस कुएँ[b] का पानी पिलाएगा, जो फाटक के पास है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे अधिक भावपूर्ण ढंग से ऐसा भी कहा जा सकता है: “काश, कोई मुझे बेतलेहेम के उस कुएँ का पानी पिला देता, जो फाटक के पास है!”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ जिस इब्रानी शब्द का अनुवाद “कुआँ” किया गया है, उसका अर्थ “जलाशय” या “गड्ढा” भी हो सकता है; इस प्रसंग में वह पीने के पानी के स्रोत को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ויתאו
  choice: बड़ी लालसा से कहा
  rationale: हित्पएल रूप तीव्र इच्छा या लालसा व्यक्त करता है। हिन्दी में क्रिया ‘लालसा करना’ के अस्वाभाविक प्रयोग से बचते हुए इसे बोलने की क्रिया के साथ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מי
  choice: कौन ... पिलाएगा
  rationale: प्रश्नवाचक रूप को बनाए रखता है, जबकि प्रसंग में निहित इच्छा को भी व्यक्त होने देता है।
- source_word: ישקני
  choice: मुझे ... पानी पिलाएगा
  rationale: שקה के हिफ़ईल रूप का अर्थ ‘पिलाना’ है; यह हिन्दी में कारणवाचक अर्थ को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מים
  choice: पानी
  rationale: सामान्य हिन्दी में इसका सीधा और स्पष्ट समतुल्य।
- source_word: מבּור
  choice: कुएँ का
  rationale: בּוֹר का अर्थ गड्ढा, हौज या कुआँ हो सकता है; यहाँ पीने के पानी के परिचित स्रोत के संदर्भ में ‘कुआँ’ सबसे स्पष्ट है।
- source_word: בית לחם
  choice: बेतलेहेम
  rationale: इस स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אשר בשער
  choice: जो फाटक के पास है
  rationale: सम्बन्धवाचक उपवाक्य और स्थान-सूचक अर्थ दोनों को सहज आधुनिक हिन्दी में सुरक्षित रखता है।
