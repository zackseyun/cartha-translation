lexical_decisions:
- source_word: וַיִּקָּבְצוּ כָל־יִשְׂרָאֵל
  choice: तब समस्त इस्राएल ... इकट्ठा हुआ
  rationale: सामूहिक जाति/समुदाय के रूप में ‘इस्राएल’ को हिन्दी में एकवचन क्रिया के साथ रखना स्वाभाविक है; וַ का कथात्मक क्रम ‘तब’ से व्यक्त किया गया है।
- source_word: אֶל־דָּוִיד חֶבְרוֹנָה
  choice: हेब्रोन में दाऊद के पास
  rationale: אֶל गंतव्य/समीपता और दिशासूचक ה स्थानीय गंतव्य को दर्शाते हैं; हिन्दी में यह संयोजन सहज और सटीक है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यहाँ ध्यान आकर्षित करने वाला संवाद-सूचक है; सम्मानसूचक संबोधन के अनुरूप ‘देखिए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עַצְמְךָ וּבְשָׂרְךָ אֲנָחְנוּ
  choice: हम आपकी ही हड्डी और आपका ही मांस हैं
  rationale: मूल के देह-संबंधी मुहावरे को ज्यों का त्यों सुरक्षित रखा गया है; ‘ही’ निकट आत्मीय/वंशगत एकता पर बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘आपकी हड्डी और आपका मांस’ मुहावरे का अर्थ
  choice: शाब्दिक देह-संबंधी रूपक बनाए रखा
  alternative: हम आपके अपने रक्त-संबंधी हैं
  rationale: मूल वाक्यांश पारिवारिक/जातीय एकता को रूपक द्वारा व्यक्त करता है। अर्थ खोलकर लिखने से बाइबिलीय प्रतिध्वनि और रूपक की शक्ति घटती, इसलिए उसे व्याख्यायित नहीं किया गया।
translation_notes:
