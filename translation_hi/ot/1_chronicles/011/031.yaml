  rationale: व्यक्तिवाचक नाम का हिब्रू के निकट प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַפִּרְעָתֹנִי
  choice: पिरातोनी
  rationale: स्थान अथवा कुल-संबंध सूचित करने वाले gentilic का संक्षिप्त हिन्दी लिप्यंतरण; अर्थ है पिरातोन से संबंधित व्यक्ति।
