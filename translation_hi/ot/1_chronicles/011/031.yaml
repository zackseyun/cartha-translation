  rationale: מִן मूल स्थान या संबंध दर्शाता है; בְּנֵי בִנְיָמִן यहाँ शाब्दिक रूप से ‘बिन्यामीन के पुत्र’ पर आशय बिन्यामीन गोत्र के लोगों से है। इस रूप में गिबा को उसी गोत्र से संबद्ध स्थान के रूप में स्पष्ट किया गया है।
- source_word: בְּנָיָה
