  yaml_path: translation/ot/1_chronicles/011/012.yaml
  text: After him was Eleazar son of Dodo the Ahohite[a]; he was among the three mighty men.
translation:
  language: hi
  text: उसके बाद अहोही दोदो का पुत्र, एलीआज़र था; वह तीन वीर योद्धाओं में था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तीन वीर योद्धाओं में से एक था।” इब्रानी अभिव्यक्ति उस विशिष्ट तीन-सदस्यीय वीर-दल में उसकी सदस्यता बता सकती है।
    reason: इब्रानी पूर्वसर्ग और संख्या का मेल सामान्य संगति (“तीनों में”) अथवा स्पष्ट सदस्यता (“तीनों में से एक”) के रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וְאַחֲרָיו
  choice: उसके बाद
  rationale: यह पदावली दाऊद के वीरों की सूची में क्रम बताती है। हिन्दी में आरंभिक संयोजक को अलग से व्यक्त किए बिना “उसके बाद” स्वाभाविक और अर्थ-सटीक है।
- source_word: אֶלְעָזָר
  choice: एलीआज़र
  rationale: व्यक्तिवाचक नाम को हिन्दी की प्रचलित बाइबलीय वर्तनी के अनुसार लिप्यंतरित किया गया है।
- source_word: בֶּן־דּוֹדוֹ
  choice: दोदो का पुत्र
  rationale: यहाँ בֶּן का सीधा वंश-संबंधी अर्थ “पुत्र” सर्वाधिक स्वाभाविक है; דּוֹדוֹ को इसी पाठ के स्वरित रूप के अनुसार “दोदो” लिखा गया है।
- source_word: הָאֲחוֹחִי
  choice: अहोही
  rationale: कुल अथवा स्थान-संबंधी इस विशेषण को अनुवाद करने के बजाय संक्षिप्त जातिवाचक उपाधि के रूप में लिप्यंतरित किया गया है। शब्दक्रम से यह दोदो का परिचय देता है।
- source_word: הוּא בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: वह तीन वीर योद्धाओं में था
  rationale: पूर्वसर्ग בְּ के समावेश-सूचक भाव को “में” से व्यक्त किया गया है और इस संभावना को खुला रखा गया है कि वाक्यांश उस विशिष्ट तीन-सदस्यीय दल में उसकी सदस्यता बताता है। גִּבֹּרִים के सैनिक संदर्भ को स्पष्ट करने के लिए “वीर योद्धा” चुना गया है।
