base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/024.yaml
  text: These things Benaiah son of Jehoiada did[a], and he had a name among the three mighty men.
translation:
  language: hi
  text: यहोयादा के पुत्र बनायाह ने ये काम किए, और उन तीन वीरों में उसका नाम था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उन तीन वीरों में वह प्रसिद्ध था।” इब्रानी में शाब्दिक रूप से “उसका नाम था” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה עָשָׂה
  choice: ये काम किए
  rationale: बहुवचन संकेतवाचक शब्द पहले बताए गए पराक्रमों की ओर लौटकर संकेत करता है; ‘ये काम किए’ आधुनिक हिन्दी में इस सारांशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנָיָהוּ בֶּן יְהוֹיָדָע
  choice: यहोयादा के पुत्र बनायाह
  rationale: नामों का हिन्दी लिप्यंतरण किया गया है और इब्रानी संबंध-रचना को स्वाभाविक हिन्दी में ‘के पुत्र’ से व्यक्त किया गया है।
- source_word: וְלוֹ שֵׁם
  choice: और ... उसका नाम था
  rationale: इब्रानी में शाब्दिक अर्थ ‘और उसके लिए एक नाम था’ है, जो प्रतिष्ठा या ख्याति का मुहावरा है। ‘उसका नाम था’ मूल रूपक को बनाए रखता है; स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: בִּשְׁלוֹשָׁה הַגִּבֹּרִים
  choice: उन तीन वीरों में
  rationale: בְּ यहाँ समूह के बीच स्थान या मान्यता दर्शाता है। הַגִּבֹּרִים दाऊद के विशिष्ट पराक्रमी योद्धाओं के लिए प्रयुक्त पद है; संक्षिप्त ‘वीरों’ से यह भाव स्वाभाविक हिन्दी में बना रहता है।
theological_decisions: []
