  yaml_path: translation/ot/1_chronicles/011/025.yaml
  text: Among the Thirty[a], he was indeed honored, but he did not attain to the Three[b]; and David appointed him over his bodyguard.
translation:
  language: hi
  text: वह उन तीस वीरों में प्रतिष्ठित था, पर उन तीन वीरों के पद तक नहीं पहुँचा[a]। दाऊद ने उसे अपने अंगरक्षक-दल का अधिकारी ठहराया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन तीन वीरों के पास नहीं आया”; यहाँ “आना” उनके पद या स्तर तक पहुँचने के अर्थ में प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने रक्षक-दल का अधिकारी” अथवा “अपने अधीन लोगों का अधिकारी।” इब्रानी शब्द दाऊद की आज्ञा के अधीन किसी रक्षक-दल या अन्य दल को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִן הַשְּׁלוֹשִׁים
