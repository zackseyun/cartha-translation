  rationale: מִן को यहाँ समूह के भीतर स्थान बताने वाला माना गया है। केवल संख्या के बजाय ‘वीरों’ जोड़ने से हिन्दी में संदर्भ स्वाभाविक और स्पष्ट होता है।
- source_word: הִנּוֹ נִכְבָּד
  choice: प्रतिष्ठित था
  rationale: הִנּוֹ बल देता है और נִכְבָּד सम्मानित अथवा ऊँचे दर्जे का होना बताता है। हिन्दी में ‘प्रतिष्ठित था’ दोनों का स्वाभाविक संप्रेषण करता है।
- source_word: וְאֶל הַשְּׁלוֹשָׁה לֹא בָא
  choice: पर उन तीन वीरों के पद तक नहीं पहुँचा
  rationale: בוא אֶל यहाँ शारीरिक रूप से आने के बजाय पद या स्तर तक पहुँचने का मुहावरा है। ‘पद तक नहीं पहुँचा’ यह अर्थ स्पष्ट करता है।
- source_word: הַשְּׁלוֹשָׁה
  choice: उन तीन वीरों
  rationale: यह दाऊद के योद्धाओं के विशिष्ट त्रय को सूचित करता है। ‘वीरों’ संदर्भ से निहित है, जबकि ‘मुख्य’ जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: וַיְשִׂימֵהוּ
  choice: अधिकारी ठहराया
  rationale: שׂים का सैन्य-प्रशासनिक संदर्भ में अर्थ किसी पद या दायित्व पर नियुक्त करना है।
- source_word: עַל מִשְׁמַעְתּוֹ
  choice: अपने अंगरक्षक-दल का अधिकारी
  rationale: מִשְׁמַעַת आज्ञा के अधीन दल, पहरेदार-दल या विशेष रक्षक-दल को सूचित कर सकता है। यहाँ राजकीय सैन्य संदर्भ में ‘अंगरक्षक-दल’ सम्भाव्य है, पर इसकी व्यापक अर्थ-संभावना पादटिप्पणी में रखी गई है।
