  text: David was in the stronghold[b][a], and the garrison of the Philistines was then in Bethlehem.
translation:
  language: hi
  text: उस समय दाऊद गढ़[a] में था, और पलिश्तियों की चौकी उस समय बेतलेहेम में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दुर्ग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְּצוּדָה
  choice: गढ़
  rationale: यह शब्द किसी किलेबंद और रक्षा योग्य स्थान को दर्शाता है। ‘गढ़’ सैन्य प्रसंग में स्वाभाविक और ठोस है।
- source_word: נְצִיב
  choice: चौकी
  rationale: पलिश्तियों और स्थान-सूचक वाक्यांश के साथ यहाँ अर्थ किसी नागरिक अधिकारी की अपेक्षा सैनिक चौकी या तैनात दल का है। ‘चौकी’ स्थान और वहाँ तैनात सैन्य उपस्थिति—दोनों का संकेत दे सकती है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के लिए प्रचलित मानक हिन्दी नाम। संबंधकारक बहुवचन में ‘पलिश्तियों’ स्वाभाविक है।
- source_word: בְּבֵית לָחֶם
  choice: बैतलहम में
  rationale: בְ स्थान बताता है; नगर के साथ ‘में’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: אָז ... אָז
  choice: उस समय ... उस समय
  rationale: इब्रानी दोनों उपवाक्यों में אָז दोहराती है। हिन्दी में ‘उस समय’ की पुनरावृत्ति मूल की समानांतर संरचना और कालगत बल को सुरक्षित रखती है।
- source_word: וְדָוִיד
  choice: दाऊद
  rationale: आरंभिक וְ कथात्मक संयोजक है। अलग से ‘और’ जोड़ना हिन्दी में अनावश्यक और कृत्रिम होता; अगले उपवाक्य में संबंध स्पष्ट रूप से ‘और’ से व्यक्त है।
