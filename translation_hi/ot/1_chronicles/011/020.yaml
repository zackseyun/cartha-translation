source:
  edition: WLC
  text: וְ/אַבְשַׁ֣י אֲחִֽי יוֹאָ֗ב ה֤וּא הָיָה֙ רֹ֣אשׁ הַ/שְּׁלוֹשָׁ֔ה וְ/הוּא֙ עוֹרֵ֣ר אֶת חֲנִית֔/וֹ עַל שְׁלֹ֥שׁ מֵא֖וֹת חָלָ֑ל ו/לא שֵׁ֖ם בַּ/שְּׁלוֹשָֽׁה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/020.yaml
  text: And Abishai[a], the brother of Joab, was chief of the Three. He brandished his spear against three hundred slain[c][b], and had a name among the Three.
translation:
  language: hi
  text: योआब का भाई अबीशै तीनों वीरों[a] का प्रधान था। उसने अपना भाला तीन सौ लोगों के विरुद्ध चलाकर उन्हें मार गिराया[b] और वह तीनों वीरों में नामी हुआ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में ‘तीनों’ है। समानांतर वर्णन (2 शमूएल 23:18) और आसपास के वीरों की सूचियों में ‘तीन’ तथा ‘तीस’ को लेकर पाठगत और संदर्भगत कठिनाइयाँ हैं।
    reason: textual_variant
  - marker: b
    text: इसका अनुवाद ‘अपना भाला उठाया’ या ‘अपना भाला लहराया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘उसका नाम था’ है, अर्थात वह प्रसिद्ध या प्रतिष्ठित था। व्यंजनात्मक लिखित पाठ को ‘और नाम नहीं था’ भी पढ़ा जा सकता है, पर मसोरेटी पाठ की पारंपरिक पढ़त ‘और उसका नाम था’ है।
    reason: textual_variant
lexical_decisions:
- source_word: רֹאשׁ
  choice: प्रधान
  rationale: सैनिक पद और नेतृत्व के अर्थ में ‘प्रधान’ स्वाभाविक और संक्षिप्त है; यहाँ शाब्दिक ‘सिर’ अभिप्रेत नहीं है।
- source_word: הַשְּׁלוֹשָׁה / בַּשְּׁלוֹשָׁה
  choice: तीनों वीरों / तीनों वीरों में
  rationale: मसोरेटी पाठ में स्पष्ट रूप से ‘तीन’ है। ‘वीरों’ शब्द संदर्भ से समूह को पहचानने योग्य बनाता है, जबकि संख्या को ‘तीस’ करके समानांतर पाठ से सामंजस्य नहीं बैठाया गया।
- source_word: עוֹרֵר אֶת־חֲנִיתוֹ
  choice: अपना भाला चलाया
  rationale: मूल क्रिया में भाले को उकसाने, उठाने या सक्रिय रूप से चलाने का चित्र है। ‘भाला चलाया’ आधुनिक हिन्दी में युद्ध-संदर्भ का स्वाभाविक अर्थ देता है और मूल की सजीवता बनाए रखता है।
- source_word: עַל שְׁלֹשׁ מֵאוֹת חָלָל
  choice: तीन सौ लोगों के विरुद्ध ... और उन्हें मार डाला
  rationale: חָלָל मारे गए अथवा भेदे गए व्यक्ति को दर्शाता है। हिन्दी में ‘तीन सौ मारे हुओं के विरुद्ध’ अस्वाभाविक होगा, इसलिए परिणाम को स्पष्ट क्रियात्मक रूप में व्यक्त किया गया है।
- source_word: שֵׁם
  choice: नामी हुआ
  rationale: शाब्दिक अर्थ ‘नाम’ है, पर इस मुहावरे का भाव ख्याति या प्रतिष्ठा पाना है। ‘नामी हुआ’ मूल मुहावरे से निकट और सामान्य पाठकों के लिए सहज है।
- source_word: אַבְשַׁי
  choice: अबीशै
  rationale: इब्रानी नाम का हिन्दी देवनागरी में प्रचलित और स्रोत-सन्निकट लिप्यंतरण।
- source_word: אֲחִי יוֹאָב
  choice: योआब का भाई
  rationale: इब्रानी संबंधसूचक रचना का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘तीनों वीरों’ से सैनिक समूह स्पष्ट होता है; पाठगत कठिनाई को मुख्य पाठ में सुलझाने के बजाय पादटिप्पणी में सुरक्षित रखा गया है। युद्ध-वर्णन को न तो नरम किया गया है, न अनावश्यक रूप से अधिक रक्तरंजित बनाया गया है।
