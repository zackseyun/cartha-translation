source:
  edition: WLC
  text: הֽוּא הָיָ֨ה עִם דָּוִ֜יד בַּ/פַּ֣ס דַּמִּ֗ים וְ/הַ/פְּלִשְׁתִּים֙ נֶאֱסְפוּ שָׁ֣ם לַ/מִּלְחָמָ֔ה וַ/תְּהִ֛י חֶלְקַ֥ת הַ/שָּׂדֶ֖ה מְלֵאָ֣ה שְׂעוֹרִ֑ים וְ/הָ/עָ֥ם נָ֖סוּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/013.yaml
  text: He was with David at Pas-dammim[a], where the Philistines had gathered for battle. Now the plot of the field was full of barley[b], and the people fled from before the Philistines.
translation:
  language: hi
  text: वह दाऊद के साथ पस-दम्मीम[a] में था, जहाँ पलिश्ती युद्ध के लिए इकट्ठे हुए थे। खेत का वह भाग जौ से भरा हुआ था, और लोग पलिश्तियों के सामने से भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पस-दम्मीम एक स्थान का नाम है। 1 शमूएल 17:1 के समानांतर वर्णन में इस स्थान को एपेस-दम्मीम कहा गया है।
    reason: cross_reference
lexical_decisions:
- source_word: בַּפַּס דַּמִּים
  choice: पस-दम्मीम में
  rationale: इसे इतिहास-वृत्तांत में आए स्थान-नाम के रूप में लिप्यंतरित किया गया है; इसका व्युत्पत्तिपरक अनुवाद स्थान-नाम होने की बात को धुँधला कर देता।
- source_word: נֶאֱסְפוּ
  choice: इकट्ठे हुए थे
  rationale: निफ़अल रूप यहाँ एकत्र होने या सेना जुटने को व्यक्त करता है; पूर्वपूर्ण भूतकाल प्रसंग में दाऊद के वहाँ होने से पहले की युद्ध-तैयारी को स्वाभाविक रूप से दर्शाता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: यह किसी विशिष्ट सैन्य मुठभेड़ के लिए जुटने का भाव देता है और आधुनिक हिन्दी में सहज है।
- source_word: חֶלְקַת הַשָּׂדֶה
  choice: खेत का एक भाग
  rationale: חלקה खेत के निश्चित हिस्से या भूखंड को दर्शाता है; यह अनुवाद अर्थ को स्पष्ट रखते हुए अनावश्यक तकनीकी शब्दावली से बचता है।
- source_word: מְלֵאָה שְׂעוֹרִים
  choice: जौ से भरा हुआ था
  rationale: मूल पाठ सामान्य अनाज नहीं, विशेष रूप से जौ का उल्लेख करता है; इस कृषि-संबंधी विवरण को बनाए रखा गया है।
- source_word: וְהָעָם
  choice: लोग
  rationale: עם का सीधा और व्यापक अर्थ रखा गया है; प्रसंग में ये इस्राएली योद्धा हो सकते हैं, पर मूल शब्द को उससे अधिक संकीर्ण नहीं किया गया।
- source_word: נָסוּ מִפְּנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सामने से भाग गए
  rationale: यह अभिव्यक्ति मूल इब्रानी के 'उनके सामने से' मुहावरे को बनाए रखते हुए शत्रु से पीछे हटने का भाव स्पष्ट करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण कथात्मक शैली अपनाई गई है। स्थान-नामों को हिन्दी बाइबिल परंपरा के अनुरूप लिप्यंतरित किया गया है और मूल पाठ की सैन्य तथा कृषि-संबंधी ठोस भाषा सुरक्षित रखी गई है।
