source:
  edition: WLC
  text: וְ/אֵ֨לֶּה רָאשֵׁ֤י הַ/גִּבּוֹרִים֙ אֲשֶׁ֣ר לְ/דָוִ֔יד הַ/מִּתְחַזְּקִ֨ים עִמּ֧/וֹ בְ/מַלְכוּת֛/וֹ עִם כָּל יִשְׂרָאֵ֖ל לְ/הַמְלִיכ֑/וֹ כִּ/דְבַ֥ר יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/010.yaml
  text: These were the chiefs of the mighty men who belonged to David[a], who strengthened themselves with him in his kingdom, together with all Israel, to make him king[b], according to the word of Yahweh concerning Israel.
translation:
  language: hi
  text: ये दाऊद के वीर योद्धाओं के प्रधान थे, जो उसके राजत्व में उसके साथ दृढ़ता से खड़े थे[a] और समस्त इस्राएल के साथ मिलकर उसे राजा बनाने के लिए खड़े थे, यहोवा के उस वचन के अनुसार जो इस्राएल के विषय में था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में अधिक शब्दशः: “जो उसके साथ अपने को दृढ़ करते थे।” इसका अर्थ “जो उसके साथ दृढ़ता से खड़े थे” या “जो उसका दृढ़ समर्थन करते थे” भी हो सकता है। “उसके राजत्व में” का अर्थ “उसके शासन में” या “उसके राज्य में” भी हो सकता है।'
    reason: הַמִּתְחַזְּקִים עִמּוֹ के रूपात्मक/अर्थगत विकल्प और בְמַלְכוּתוֹ के व्यापक अर्थ-क्षेत्र को सुरक्षित रखना।
  - marker: b
    text: 'हिब्रू को इस प्रकार भी जोड़ा जा सकता है: “यहोवा के वचन के अनुसार उसे इस्राएल पर राजा बनाएँ।”'
    reason: עַל יִשְׂרָאֵל को “यहोवा के वचन” के साथ “इस्राएल के विषय में” जोड़ने के बजाय “उसे राजा बनाएँ” के साथ जोड़ने की संभावित वाक्यगत समझ बताना।
lexical_decisions:
- source_word: רָאשֵׁי הַגִּבּוֹרִים
  choice: वीर योद्धाओं के प्रधान
  rationale: רָאשֵׁי नेतृत्व करने वाले प्रमुख व्यक्तियों को और הַגִּבּוֹרִים दाऊद के विशिष्ट पराक्रमी योद्धाओं को दर्शाता है। यह हिंदी में स्वाभाविक रहते हुए सैन्य और पदानुक्रमिक भाव बनाए रखता है।
- source_word: אֲשֶׁר לְדָוִיד
  choice: दाऊद के
  rationale: לְדָוִיד यहाँ संबंध या संबद्धता प्रकट करता है। हिंदी का संबंधसूचक रूप संक्षिप्त और स्वाभाविक है।
- source_word: הַמִּתְחַזְּקִים עִמּוֹ
  choice: उन्होंने ... दाऊद का दृढ़ समर्थन किया
  rationale: חזק का हित्पएल रूप עִם के साथ दाऊद के पक्ष में दृढ़ता से खड़े होने या उसे समर्थ बनाने का भाव देता है। शब्दशः रूप हिंदी में अस्पष्ट होता, इसलिए राजनीतिक-सैन्य संदर्भ को स्पष्ट किया गया है।
- source_word: בְמַלְכוּתוֹ
  choice: दाऊद का ... समर्थन किया ... ताकि ... उसे राजा बनाएँ
  rationale: מַלְכוּת राजत्व, शासन या राज्य का बोध करा सकता है। हिंदी वाक्य में राजत्व स्थापित करने का भाव अगले उद्देश्य-वाक्य के साथ स्वाभाविक रूप से व्यक्त हुआ है, बिना इसे केवल भूभाग के अर्थ में सीमित किए।
- source_word: עִם כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल के साथ मिलकर
  rationale: עִם सहभागिता दर्शाता है; यह रूप योद्धाओं और पूरे इस्राएल की संयुक्त कार्रवाई स्पष्ट करता है।
- source_word: לְהַמְלִיכוֹ
  choice: उसे राजा बनाएँ
  rationale: מלך का हिफ़ील रूप किसी को राजा बनाने का सीधा कारणवाचक अर्थ देता है।
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के उस वचन के अनुसार
  rationale: דבר को 'वचन' रखना ईश्वरीय कथन से औपचारिक संबंध बनाए रखता है; יְהוָה को व्यक्तिगत नाम 'यहोवा' से प्रस्तुत किया गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल के विषय में
  rationale: דבר के साथ עַל का अर्थ यहाँ स्वाभाविक रूप से 'के विषय में' है; इससे इसे दाऊद के 'इस्राएल पर' शासन के रूप में गलत जोड़ने से बचा जाता है।
theological_decisions:
- issue: הַמִּתְחַזְּקִים עִמּוֹ में समर्थकों की कार्रवाई
  choice: दाऊद के राजारोहण के लिए दृढ़ राजनीतिक-सैन्य समर्थन
  alternative: दाऊद के साथ स्वयं को दृढ़ करना या परस्पर दृढ़ होना
  rationale: निकटवर्ती उद्देश्य-वाक्य 'उसे राजा बनाएँ' सक्रिय समर्थन के अर्थ को बल देता है, फिर भी वैकल्पिक अधिक शब्दशः अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בְמַלְכוּתוֹ का अर्थ-क्षेत्र
  choice: दाऊद के राजत्व की स्थापना के संबंध में
  alternative: उसके राज्य-क्षेत्र में या उसके शासनकाल में
  rationale: प्रसंग दाऊद को राजा बनाने का है। अनुवाद राजत्व की स्थापना को सामने रखता है, जबकि हिब्रू संज्ञा के व्यापक अर्थ को पादटिप्पणी में स्वीकार करता है।
- issue: עַל יִשְׂרָאֵל का वाक्यगत संबंध
  choice: यहोवा के वचन का विषय इस्राएल है
  alternative: दाऊद को इस्राएल पर राजा बनाना
  rationale: עַל सीधे 'वचन' के साथ 'विषय में' अर्थ दे सकता है। दूसरी समझ संदर्भतः संभव होने के कारण पादटिप्पणी में संकेतित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय और सहज शैली अपनाई गई है। 'वीर योद्धा', 'प्रधान', 'दृढ़ समर्थन' और 'वचन' सामान्य पाठक के लिए बोधगम्य हैं। मुख्य पाठ में राजनीतिक-सैन्य आशय स्वाभाविक हिंदी में व्यक्त है, जबकि हिब्रू की वास्तविक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
