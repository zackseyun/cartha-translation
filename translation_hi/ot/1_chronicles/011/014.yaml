  yaml_path: translation/ot/1_chronicles/011/014.yaml
  text: And they took their stand in the middle of the plot and delivered it[a], and they struck down the Philistines, and Yahweh saved by a great victory.
translation:
  language: hi
  text: वे खेत के उस टुकड़े के बीच में डटकर खड़े हुए और उसे बचाया[क]। उन्होंने पलिश्तियों को मार गिराया, और याहवे ने बड़ी विजय दिलाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उसे छुड़ाया।”
    reason: वַיַּצִּילוּהָ के लिए नצל का वैकल्पिक ‘छुड़ाने/बचाने’ का अर्थ दर्शाता है।
lexical_decisions:
- source_word: וַיִּתְיַצְּבוּ
  choice: डटकर खड़े हो गए
  rationale: हित्पएल रूप जान-बूझकर मोर्चा लेने और दृढ़ता से टिके रहने का भाव देता है; यह हिंदी अभिव्यक्ति युद्ध-संदर्भ में स्वाभाविक है।
- source_word: בְתוֹךְ הַחֶלְקָה
  choice: उस खेत के बीच में
  rationale: תוך का अर्थ ‘बीच में’ और חלקה का अर्थ खेती की भूमि का खंड है। प्रसंग में सहज हिंदी के लिए ‘खेत’ चुना गया।
- source_word: וַיַּצִּילוּהָ
  choice: उसे बचाया
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ חלקה से है; נצל यहाँ शत्रु के अधिकार से भूमि को बचाने का अर्थ रखता है।
- source_word: וַיַּכּוּ אֶת־פְּלִשְׁתִּים
  choice: उन्होंने पलिश्तियों को मार गिराया
  rationale: युद्ध-संदर्भ में נכה प्रहार करके धराशायी करने का प्रबल भाव देता है; ‘मार गिराया’ उसकी शक्ति को बनाए रखता है।
- source_word: וַיּוֹשַׁע יְהוָה תְּשׁוּעָה גְדוֹלָה
  choice: यहोवा ने बड़ी विजय दिलाई
  rationale: ישׁע और תשועה की संयुक्त रचना परिणामकारी उद्धार अथवा विजय को व्यक्त करती है। सैन्य प्रसंग में ‘बड़ी विजय दिलाई’ स्वाभाविक है और इब्रानी में अनुपस्थित कर्म को नहीं जोड़ती।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से आया है; उपाधि से बदलने के बजाय उसका हिंदी में परिचित लिप्यंतरण रखा गया।
- issue: תְּשׁוּעָה גְדוֹלָה का सैन्य अर्थ
  choice: बड़ी विजय दिलाई
  alternative: बड़ा छुटकारा दिया
  rationale: दोनों अर्थ संभव हैं, पर तत्काल युद्ध-संदर्भ में ‘विजय’ सर्वाधिक स्पष्ट और स्वाभाविक है; यह विजय अंततः यहोवा के कार्य के रूप में प्रस्तुत होती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। कथात्मक क्रियाओं का क्रम स्पष्ट रखा गया है और अनावश्यक निहित कर्म नहीं जोड़ा गया।
