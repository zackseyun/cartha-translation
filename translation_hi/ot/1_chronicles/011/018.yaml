  text: וַ/יִּבְקְע֨וּ הַ/שְּׁלֹשָׁ֜ה בְּ/מַחֲנֵ֣ה פְלִשְׁתִּ֗ים וַ/יִּֽשְׁאֲבוּ מַ֨יִם֙ מִ/בּ֤וֹר בֵּֽית לֶ֨חֶם֙ אֲשֶׁ֣ר בַּ/שַּׁ֔עַר וַ/יִּשְׂא֖וּ וַ/יָּבִ֣אוּ אֶל דָּוִ֑יד וְ/לֹֽא אָבָ֤ה דָוִיד֙ לִ/שְׁתּוֹתָ֔/ם וַ/יְנַסֵּ֥ךְ אֹתָ֖/ם לַ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/018.yaml
  text: So the three broke through into the camp of the Philistines and drew water from the well of Bethlehem that was by the gate[a], and carried it and brought it to David. But David was not willing to drink it; instead, he poured it out to Yahweh.
translation:
  language: hi
  text: तब वे तीनों फ़िलिस्तियों की छावनी को चीरकर भीतर घुस गए और बेतलेहेम के उस कुएँ से पानी भरा जो फाटक के पास था। वे उसे लेकर दाऊद के पास आए। पर दाऊद ने उसे पीना नहीं चाहा; उसने उसे यहोवा के लिए उंडेल दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक स्पष्ट रूप से, “उसने उसे यहोवा को पेय-भेंट के रूप में उंडेल दिया।” इब्रानी क्रिया में पेय-भेंट या अर्घ के रूप में अर्पित करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּבְקְעוּ
  choice: घुस गए
  rationale: सैन्य प्रसंग में क्रिया शत्रु की पंक्तियाँ चीरकर भीतर जाने का भाव देती है। सहज हिन्दी में ‘घुस गए’ उस गति और साहस को स्पष्ट करता है।
- source_word: הַשְּׁלֹשָׁה
  choice: वे तीनों
  rationale: इब्रानी में केवल ‘वे तीन’ है; प्रसंग से वे वीर पुरुष हैं, पर पद में अनुपस्थित उपाधि नहीं जोड़ी गई।
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: फ़िलिस्तियों की छावनी में
  rationale: यह शत्रु-शिविर के भीतर प्रवेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: पानी भरा
  rationale: कुएँ से पानी निकालने के लिए ‘पानी भरा’ साधारण और स्वाभाविक हिन्दी है।
- source_word: מִבּוֹר בֵּית לֶחֶם אֲשֶׁר בַּשַּׁעַר
  choice: बैतलहम के उस कुएँ से ... जो फाटक के पास था
  rationale: בּוֹר के ‘गड्ढा/कुंड/कुआँ’ अर्थों में पीने का पानी भरने के प्रसंग के कारण ‘कुआँ’ उपयुक्त है; स्थान-संबंध को ‘फाटक के पास’ से स्पष्ट रखा गया।
- source_word: וַיִּשְׂאוּ וַיָּבִיאוּ אֶל דָּוִיד
  choice: वे उसे लेकर दाऊद के पास आए
  rationale: दोनों क्रमिक क्रियाओं—उठाकर ले जाना और पहुँचाना—को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְלֹא אָבָה דָוִיד לִשְׁתּוֹתָם
  choice: दाऊद ने उसे पीना नहीं चाहा
  rationale: אָבָה इच्छा या सहमति को व्यक्त करता है; इसलिए अधिक प्रबल ‘इनकार कर दिया’ के बजाय ‘नहीं चाहा’ चुना गया। इब्रानी का बहुवचन प्रत्यय ‘पानी’ के लिए है, जिसे हिन्दी में एकवचन संकेत ‘उसे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיְנַסֵּךְ אֹתָם לַיהוָה
  choice: उसने उसे यहोवा के सामने उंडेल दिया
  rationale: נסך में वास्तविक रूप से उंडेलने के साथ अर्घ/पेय-भेंट का धार्मिक भाव हो सकता है। मुख्य पाठ दृश्य क्रिया रखता है और पादटिप्पणी धार्मिक आशय बताती है। ‘के सामने’ समर्पण की दिशा व्यक्त करता है और हिन्दी में ‘यहोवा को उंडेला’ की अस्वाभाविकता से बचाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
theological_decisions:
- issue: दाऊद द्वारा पानी उंडेलने का उपासना-संबंधी अर्थ
  choice: मुख्य पाठ में ठोस क्रिया ‘यहोवा के सामने उंडेल दिया’ और पादटिप्पणी में पेय-भेंट का भाव
  alternative: ‘यहोवा को पेय-भेंट के रूप में चढ़ा दिया’
  rationale: इब्रानी क्रिया में अर्घ या पेय-भेंट का धार्मिक बल संभव है, पर कथा प्रत्यक्ष रूप से उंडेलने का कार्य भी दिखाती है। मुख्य पाठ में क्रिया और पादटिप्पणी में उसका संभावित उपासना-संबंधी आशय रखने से दोनों आयाम सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘वे तीनों’, ‘छावनी’, ‘कुआँ’ और ‘उंडेल दिया’ सामान्य पाठकों के लिए स्पष्ट हैं। पादटिप्पणी का चिह्न [a] संबंधित वाक्य के तुरंत बाद रखा गया है।
