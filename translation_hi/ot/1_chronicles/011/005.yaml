base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/005.yaml
  text: The inhabitants of Jebus said to David[a], “You will not come in here.” But David captured the stronghold of Zion, that is, the City of David.
translation:
  language: hi
  text: यबूस के निवासियों ने दाऊद से कहा,[a] “तुम यहाँ प्रवेश नहीं करोगे।” परन्तु दाऊद ने सिय्योन के गढ़ पर अधिकार कर लिया, अर्थात् दाऊद का नगर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम यहाँ नहीं आओगे” अथवा “तुम यहाँ प्रवेश नहीं कर पाओगे।” इब्रानी में शाब्दिक रूप से “तुम यहाँ नहीं आओगे” है; यहाँ यह प्रवेश से इनकार व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹשְׁבֵי יְבוּס
  choice: यबूस के निवासी
  rationale: यह रचना यबूस में रहने वाले लोगों को सामूहिक रूप से दर्शाती है; ‘निवासी’ आधुनिक, स्वाभाविक और स्पष्ट हिन्दी है।
- source_word: לֹא תָבוֹא הֵנָּה
  choice: तुम यहाँ प्रवेश नहीं कर पाओगे
  rationale: शाब्दिक अर्थ ‘तुम यहाँ नहीं आओगे’ है, पर प्रसंग में यह प्रवेश रोकने और दाऊद की असमर्थता का चुनौतीपूर्ण दावा है। मुख्य पाठ स्वाभाविक हिन्दी में उसका प्रसंगगत बल रखता है और पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וַיִּלְכֹּד
  choice: अधिकार कर लिया
  rationale: सैनिक प्रसंग में क्रिया किसी किलेबंद स्थान को पकड़ लेने या जीत लेने का अर्थ देती है; ‘अधिकार कर लिया’ परिणाम को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְצֻדַת צִיּוֹן
  choice: सिय्योन का गढ़
  rationale: מְצוּדָה एक सुरक्षित किले या गढ़ को दर्शाता है; ‘गढ़’ संक्षिप्त, सुबोध और सैन्य संदर्भ के अनुकूल है।
- source_word: הִיא עִיר דָּוִיד
  choice: जो दाऊदपुर कहलाता है
  rationale: यह उपवाक्य सिय्योन के गढ़ की पहचान ‘दाऊद के नगर’ के रूप में कराता है। हिन्दी बाइबलीय स्थान-नाम ‘दाऊदपुर’ इस स्थापित पदवी को सहज रूप से व्यक्त करता है।
