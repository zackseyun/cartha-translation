  text: וַ֠/יָּבֹאוּ כָּל זִקְנֵ֨י יִשְׂרָאֵ֤ל אֶל הַ/מֶּ֨לֶךְ֙ חֶבְר֔וֹנָ/ה וַ/יִּכְרֹת֩ לָ/הֶ֨ם דָּוִ֥יד בְּרִ֛ית בְּ/חֶבְר֖וֹן לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּמְשְׁח֨וּ אֶת דָּוִ֤יד לְ/מֶ֨לֶךְ֙ עַל יִשְׂרָאֵ֔ל כִּ/דְבַ֥ר יְהוָ֖ה בְּ/יַד שְׁמוּאֵֽל־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/003.yaml
  text: So all the elders of Israel came to the king at Hebron[a], and David made a covenant with them at Hebron before Yahweh. Then they anointed David king over Israel, according to the word of Yahweh by Samuel.
translation:
  language: hi
  text: तब इस्राएल के सभी पुरनिये हेब्रोन में राजा के पास आए। दाऊद ने हेब्रोन में यहोवा के सामने उनके साथ वाचा बाँधी। फिर उन्होंने दाऊद को इस्राएल पर राजा के रूप में अभिषेक किया, यहोवा के उस वचन के अनुसार जो उसने शमूएल के द्वारा[a] कहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “शमूएल के हाथ से”; यह इब्रानी मुहावरा “शमूएल के द्वारा” या “शमूएल के माध्यम से” के अर्थ में है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: זִקְנֵי
  choice: पुरनिये
  rationale: यह इस्राएल के मान्य सामाजिक और राजनीतिक प्रतिनिधियों के लिए प्रचलित बाइबलीय हिन्दी शब्द है; केवल ‘अगुए’ कहना पद की विशिष्टता घटा देता।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ यहाँ नाम के बजाय निश्चित उपाधि का प्रयोग करता है; अगली उपवाक्य में राजा की पहचान दाऊद के रूप में स्पष्ट होती है।
- source_word: חֶבְרוֹנָה / בְּחֶבְרוֹן
  choice: हेब्रोन में
  rationale: पहला रूप हेब्रोन की ओर गति दिखाता है, पर ‘राजा के पास आए’ के साथ हिन्दी में स्थान को ‘हेब्रोन में’ कहना स्वाभाविक है; दूसरा रूप स्पष्टतः वहीं घटित घटना बताता है।
- source_word: וַיִּכְרֹת ... בְּרִית
  choice: वाचा बाँधी
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘वाचा काटी’ है। ‘वाचा बाँधी’ आधुनिक हिन्दी में स्वाभाविक है और औपचारिक पारस्परिक प्रतिज्ञा का भाव बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह वाचा के दिव्य साक्षी की गंभीर भावना को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी में स्थापित लिप्यंतरण है, न कि ‘प्रभु’ जैसी स्थानापन्न उपाधि।
- source_word: וַיִּמְשְׁחוּ
  choice: उन्होंने ... अभिषेक करके
  rationale: क्रिया राजकीय स्थापना के प्रसंग में तेल से अभिषेक किए जाने को विशिष्ट रूप से व्यक्त करती है; ‘नियुक्त किया’ अकेले कहना ठोस क्रिया को खो देता।
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: उसे इस्राएल का राजा बनाया
  rationale: यह अभिषेक के राजकीय उद्देश्य और इस्राएल पर दाऊद के शासन को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּדְבַר יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: ‘वचन’ דָבָר का सीधा और प्रसंगानुकूल अनुवाद है; ‘प्रतिज्ञा’ अर्थ को अनावश्यक रूप से संकीर्ण कर देती।
- source_word: בְּיַד שְׁמוּאֵל
  choice: शमूएल के द्वारा
  rationale: शाब्दिक ‘शमूएल के हाथ से’ यहाँ माध्यम अथवा प्रतिनिधि के लिए इब्रानी मुहावरा है; हिन्दी में ‘के द्वारा’ उसका स्वाभाविक रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता है।
- issue: दाऊद के राजत्व में दिव्य वचन और मानवीय अभिषेक का संबंध
  choice: अभिषेक को शमूएल के द्वारा दिए गए यहोवा के वचन के अनुसार बताया गया
  alternative: इसे केवल राजनीतिक नियुक्ति के रूप में व्यक्त करना
  rationale: मूल पाठ इस्राएल के पुरनियों की क्रिया और यहोवा के पहले से दिए वचन—दोनों को साथ रखता है; अनुवाद इसी तनाव और संबंध को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरनिये’, ‘वाचा’ और ‘अभिषेक’ जैसे स्थापित बाइबलीय शब्द प्रसंग की सामाजिक तथा धार्मिक विशिष्टता बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में [a] का चिह्न ‘Hebron’ के बाद था, पर उसकी टिप्पणी בְּיַד שְׁמוּאֵל से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न को ‘शमूएल के द्वारा’ के बाद सही स्थान पर रखा गया है।
