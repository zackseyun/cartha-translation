source:
  edition: WLC
  text: וַ/יֵּ֨לֶךְ דָּוִ֧יד וְ/כָל יִשְׂרָאֵ֛ל יְרוּשָׁלִַ֖ם הִ֣יא יְב֑וּס וְ/שָׁם֙ הַ/יְבוּסִ֔י יֹשְׁבֵ֖י הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/004.yaml
  text: Then David and all Israel went to Jerusalem—that is[a], Jebus—where the Jebusites, the inhabitants of the land, were.
translation:
  language: hi
  text: तब दाऊद और समस्त इस्राएल यरूशलेम गए—अर्थात यबूस—जहाँ उस देश के निवासी यबूसी रहते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: तब ... गए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और समस्त इस्राएल
  rationale: संयोजक और सामूहिक राष्ट्रीय पदनाम का सीधा तथा गरिमापूर्ण अनुवाद।
- source_word: יְרוּשָׁלִַם הִיא יְבוּס
  choice: यरूशलेम—अर्थात यबूस—
  rationale: सर्वनाम הִיא यरूशलेम की पहचान उसके पुराने नाम यबूस से कराता है; व्याख्यात्मक समानाधिकरण इसे स्पष्ट रखता है।
- source_word: וְשָׁם
  choice: जहाँ
  rationale: शाब्दिक ‘और वहाँ’ के अर्थ को अगले निवासी-सूचक उपवाक्य से स्वाभाविक हिन्दी में जोड़ता है।
- source_word: הַיְבוּסִי
  choice: यबूसी
  rationale: रूप की दृष्टि से एकवचन होते हुए भी यह यहाँ सामूहिक जातिनाम है, जैसा कि बहुवचन कृदंत יֹשְׁבֵי से स्पष्ट है; हिन्दी में ‘यबूसी’ सामूहिक/बहुवचन अर्थ सहज व्यक्त करता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासी ... रहते थे
  rationale: कृदंत-संरचना का अर्थ ‘देश के निवासी’ है; हिन्दी वाक्य में विधेय पूरा करने के लिए ‘रहते थे’ स्वाभाविक है। ‘उस देश’ स्थानीय भूभाग की ओर संकेत करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘दाऊद’, ‘इस्राएल’, ‘यरूशलेम’ और ‘यबूस’ रखे गए हैं। मूल का सामूहिक एकवचन अर्थ हिन्दी के जातिनाम ‘यबूसी’ और बहुवचन क्रिया ‘रहते थे’ से स्पष्ट होता है, इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
