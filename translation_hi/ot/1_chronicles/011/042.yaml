  text: עֲדִינָ֨א בֶן שִׁיזָ֜א הָ/רֽאוּבֵנִ֗י רֹ֛אשׁ לָ/רֽאוּבֵנִ֖י וְ/עָלָ֥י/ו שְׁלוֹשִֽׁים־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/042.yaml
  text: Adina son of Shiza the Reubenite[a], a chief of the Reubenites, and with him were thirty.
translation:
  language: hi
  text: शीजा का पुत्र अदीना, जो रूबेनवंशी और रूबेनवंशियों का एक प्रधान था; उसके साथ तीस पुरुष थे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “और उसके ऊपर तीस थे।” इस सैनिक सूची में इसका आशय संभवतः यह है कि तीस पुरुष उसके साथ या उसके अधीन थे।'
    reason: इब्रानी पूर्वसर्ग עַל के शाब्दिक अर्थ और प्रसंगगत अर्थ—साथ अथवा अधीन—के बीच की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: עֲדִינָא
  choice: अदीना
  rationale: इब्रानी व्यक्तिवाचक नाम का हिंदी देवनागरी में निकट लिप्यंतरण।
- source_word: בֶן שִׁיזָא
  choice: शीजा का पुत्र
  rationale: वंश-सूची के संदर्भ में בֶן सामान्यतः प्रत्यक्ष पुत्र-संबंध बताता है; हिंदी में संबंधसूचक क्रम स्वाभाविक रखा गया है।
- source_word: הָרְאוּבֵנִי
  choice: रूबेनवंशी
  rationale: निश्चित जातिवाचक रूप रूबेन के गोत्र से संबद्ध व्यक्ति को दर्शाता है; ‘रूबेनवंशी’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: רֹאשׁ לָרְאוּבֵנִי
  choice: रूबेनवंशियों का एक प्रधान
  rationale: यहाँ רֹאשׁ शारीरिक ‘सिर’ नहीं, नेतृत्व-पद दर्शाता है; ל संबंध या कार्यक्षेत्र सूचित करता है। अनिश्चितता को बनाए रखने के लिए ‘एक प्रधान’ कहा गया है।
- source_word: וְעָלָיו שְׁלוֹשִׁים
  choice: उसके साथ तीस पुरुष थे
  rationale: על का मूल अर्थ ‘ऊपर’ है, पर इस सैनिक सूची में संभवतः अदीना से जुड़े या उसके अधीन तीस जन अभिप्रेत हैं। हिंदी मुख्य पाठ में संभावित प्रसंगगत अर्थ दिया गया और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions: []
