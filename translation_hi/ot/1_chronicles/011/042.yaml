  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण सूची-शैली रखी गई है। जनजातीय पहचान के लिए ‘रूबेनवंशी’ और नेतृत्व के लिए सामान्य, गैर-सांप्रदायिक ‘प्रधान’ चुना गया है।
