- source_word: וְיוֹשַׁוְיָה
  choice: और योशव्याह
  rationale: नाम को इब्रानी ध्वनियों, विशेषकर שׁ और अंतिम יָה, के निकट लिप्यंतरित किया गया है।
- source_word: בְּנֵי
  choice: के पुत्र
  rationale: रचनात्मक बहुवचन का स्वाभाविक हिन्दी रूप; यह यरीबै और योशव्याह दोनों को एलीनाम के पुत्र बताता है।
- source_word: אֶלְנָעַם
  choice: एलीनाम
  rationale: व्यक्तिवाचक नाम का इब्रानी ध्वनि-रूप के निकट देवनागरी लिप्यंतरण।
- source_word: וְיִתְמָה
  choice: और यित्माह
  rationale: व्यक्तिवाचक नाम में आरंभिक י को 'य' और अंतिम ה को दीर्घ ध्वनि सहित लिप्यंतरित किया गया है।
- source_word: הַמּוֹאָבִי
  choice: मोआबी
  rationale: निश्चित जातिवाची विशेषण को हिन्दी के स्वाभाविक पहचानसूचक रूप में रखा गया है; यह यित्माह की पहचान बताता है।
