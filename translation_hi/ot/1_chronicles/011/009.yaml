  edition: WLC
  text: וַ/יֵּ֥לֶךְ דָּוִ֖יד הָל֣וֹךְ וְ/גָד֑וֹל וַ/יהוָ֥ה צְבָא֖וֹת עִמּֽ/וֹ׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/011/009.yaml
  text: And David became greater and greater[a], and Yahweh of hosts was with him.
translation:
  language: hi
  text: और दाऊद लगातार और अधिक महान होता गया[a], और सेनाओं का यहोवा उसके साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “दाऊद जाता हुआ महान होता गया”; यह लगातार और अधिक महान होते जाने का इब्रानी मुहावरा है।'
    reason: मूल इब्रानी अभिव्यक्ति के रूप और उसके प्रगतिशील अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֵּלֶךְ הָלוֹךְ וְגָדוֹל
  choice: अधिक से अधिक महान होता गया
  rationale: इब्रानी में सीमित क्रिया के साथ क्रियार्थक रूप और ‘महान’ का यह विन्यास लगातार बढ़ती महानता व्यक्त करने वाला मुहावरा है; हिंदी में यह चुनाव उसकी प्रगतिशीलता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דָּוִיד
  choice: दाऊद
  rationale: हिंदी बाइबल परंपरा में इस नाम का प्रचलित और आसानी से पहचाना जाने वाला रूप।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
- source_word: צְבָאוֹת
  choice: सेनाओं का
  rationale: यह बहुवचन संज्ञा सेनाओं या समूहों का बिंब बनाए रखती है और ‘सर्वशक्तिमान’ जैसी व्याख्यात्मक उपाधि में उसका विलय नहीं करती।
- source_word: עִמּוֹ
  choice: उसके साथ था
  rationale: पूर्वसर्ग עִם उपस्थिति अथवा संगति का सीधा अर्थ देता है; पाठ में स्पष्ट न किए गए ‘उसकी ओर था’ जैसे पक्षसमर्थन के भाव को नहीं जोड़ा गया।
theological_decisions:
- issue: परमेश्वर के विशिष्ट नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: यह पद टेट्राग्रामटन को सीधे प्रयोग करता है; नाम को ‘प्रभु’ उपाधि से बदलने के बजाय हिंदी में परिचित नामरूप रखा गया है।
- issue: וַ־ द्वारा दोनों कथनों का संबंध
  choice: और
  alternative: क्योंकि
  rationale: इब्रानी संयोजक स्वयं कारण स्पष्ट नहीं करता। ‘और’ मूल की खुली अर्थ-संभावना बनाए रखता है और यह निर्णायक रूप से नहीं कहता कि दाऊद की बढ़ती महानता का कारण अगला कथन है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अधिक से अधिक महान होता गया’ सामान्य हिंदी में प्रगति का भाव स्पष्ट करता है, जबकि पादटिप्पणी इब्रानी मुहावरे का अधिक शाब्दिक रूप सुरक्षित रखती है।
