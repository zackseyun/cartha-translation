translation:
  language: hi
  text: दाऊद उस गढ़[a] में रहने लगा; इसलिए उन्होंने उसे “दाऊद का नगर” कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दुर्ग।” इब्रानी शब्द מְצָד एक किलेबंद सुरक्षित स्थान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: स्थान-सूचक संदर्भ में יָשַׁב का अर्थ केवल ‘बैठना’ नहीं, बल्कि ‘निवास करना’ है। ‘रहने लगा’ इस प्रसंग में दाऊद के वहाँ अपना निवास स्थापित करने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּמְצָד
  choice: उस गढ़ में
  rationale: מְצָד किसी किलेबंद और सुरक्षित स्थान को दर्शाता है। ‘गढ़’ संक्षिप्त, सहज और सैन्य-सुरक्षा का भाव रखने वाला हिन्दी शब्द है; निश्चितता का भाव व्यक्त करने के लिए ‘उस’ जोड़ा गया है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह इब्रानी मुहावरा पहले कथन के परिणाम को प्रस्तुत करता है। ‘इसलिए’ कारण और परिणाम के संबंध को स्पष्ट और स्वाभाविक रूप से बनाए रखता है।
- source_word: קָרְאוּ לוֹ
  choice: उन्होंने उसे … कहा
  rationale: मूल पाठ में क्रिया सक्रिय बहुवचन है। ‘उन्होंने उसे … कहा’ इस व्याकरणिक रूप को सुरक्षित रखते हुए हिन्दी में नामकरण का स्वाभाविक ढंग है।
- source_word: עִיר דָּוִיד
  choice: दाऊद का नगर
  rationale: यह बाइबलीय स्थान-नाम है। ‘दाऊद का नगर’ मूल संबंधवाचक संरचना को स्पष्ट और प्रतिष्ठित हिन्दी में व्यक्त करता है।
