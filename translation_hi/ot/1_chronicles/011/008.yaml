  yaml_path: translation/ot/1_chronicles/011/008.yaml
  text: He built the city all around[a], from the Millo even to the surrounding area[b], and Joab restored the rest of the city.
translation:
  language: hi
  text: उसने नगर को चारों ओर बनाया, मिल्लो[b] से लेकर आसपास तक; और योआब ने नगर के शेष भाग को बहाल किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बहाल किया” का अनुवाद “पुनर्जीवित किया” या “मरम्मत की” भी हो सकता है। इब्रानी क्रिया का शाब्दिक अर्थ “जीवित किया” है; यहाँ इसका प्रयोग संभवतः नगर के पुनरुद्धार के अर्थ में हुआ है।
    reason: lexical_alternative
  - marker: b
    text: “मिल्लो” यरूशलेम का एक स्थलाकृतिक नाम है, जिसका ठीक अर्थ अनिश्चित है। संभव है कि यह सीढ़ीनुमा संरचना या मिट्टी भरकर बनाए गए निर्माण को सूचित करता हो।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּבֶן
  choice: उसने ... बनाया
  rationale: בנה का सामान्य कथात्मक अर्थ ‘बनाना’ है। कर्ता पिछले पद से दाऊद है; ‘फिर से बनाया’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: הָעִיר מִסָּבִיב
  choice: नगर को चारों ओर
  rationale: עיר के लिए ‘नगर’ स्वाभाविक और गरिमापूर्ण है, और סביב यहाँ निर्माण के चारों ओर विस्तार को दर्शाता है।
- source_word: מִן הַמִּלּוֹא
  choice: मिल्लो से
  rationale: מִלּוֹא यरूशलेम का अनिश्चित स्थलाकृतिक नाम है, इसलिए अर्थ को मुख्य पाठ में निश्चित करने के बजाय उसका लिप्यंतरण रखा गया है।
- source_word: וְעַד הַסָּבִיב
  choice: लेकर आस-पास के क्षेत्र तक
  rationale: संक्षिप्त इब्रानी पदबंध निर्माण की सीमा या परिधि बताता है; यह हिंदी रूप अर्थ को सहज रखता है, पर किसी अत्यधिक तकनीकी पहचान को आरोपित नहीं करता।
- source_word: יְחַיֶּה
  choice: फिर से बसाया
  rationale: חיה के पिएल रूप का शाब्दिक भाव ‘जीवित करना’ है। नगर के संदर्भ में यह उसे पुनर्जीवित या बहाल करने का मुहावरेदार अर्थ देता है; ‘फिर से बसाया’ इस जीवंतता के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶת שְׁאָר הָעִיר
  choice: नगर के शेष भाग को
  rationale: שְׁאָר का सीधा अर्थ बचा हुआ या शेष भाग है।
