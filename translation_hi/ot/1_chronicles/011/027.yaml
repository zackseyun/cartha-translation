lexical_decisions:
- source_word: שַׁמּוֹת
  choice: शम्मोत
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है; इसका अनुवाद नहीं किया गया।
- source_word: הֲרוֹרִי
  choice: हरोरी
  rationale: निश्चयवाचक उपपद सहित यह स्थान अथवा कुल-संबंधी पद है। मुख्य पाठ में इतिहास की मसोरी पठन-परंपरा को रखा गया है और 2 शमूएल के समानांतर रूप से इसका सामंजस्य नहीं किया गया।
- source_word: חֶלֶץ
  choice: हेलेस
  rationale: व्यक्तिवाचक नाम का देवनागरी में लिप्यंतरण; अंतिम צ को प्रचलित हिंदी बाइबलीय नाम-रूप के अनुरूप 'स' से दर्शाया गया है।
- source_word: פְּלוֹנִי
  choice: पलोनी
  rationale: निश्चयवाचक उपपद सहित स्थान अथवा कुल-संबंधी पद का लिप्यंतरण। इतिहास के मसोरी रूप को मुख्य पाठ में सुरक्षित रखा गया है, जबकि समानांतर पाठ का भिन्न रूप टिप्पणी में दिया गया है।
