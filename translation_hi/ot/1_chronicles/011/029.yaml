lexical_decisions:
- source_word: סִבְּכַי
  choice: सिब्बकै
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַחֻשָׁתִי
  choice: हूशाती
  rationale: यह स्थान अथवा कुल से जुड़ी पहचान बताने वाला विशेषण है; हिब्रू रूप को संक्षिप्त और स्वाभाविक देवनागरी लिप्यंतरण में रखा गया है।
- source_word: עִילַי
  choice: ईलै
  rationale: मसोरेटिक पाठ के व्यंजन עילי के अनुसार नाम को लिप्यंतरित किया गया है; समानांतर पद से प्रभावित ‘ईरै’ को मुख्य पाठ में नहीं अपनाया गया।
- source_word: הָאֲחוֹחִי
  choice: अहोही
  rationale: यह अहोह नामक कुल से संबंधित पहचान है; हिब्रू gentilic रूप को देवनागरी में लिप्यंतरित किया गया है।
