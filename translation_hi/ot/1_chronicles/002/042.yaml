id: 1CH.2.42
reference: 1 Chronicles 2:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֤י כָלֵב֙ אֲחִ֣י יְרַחְמְאֵ֔ל מֵישָׁ֥ע בְּכֹר֖/וֹ ה֣וּא אֲבִי זִ֑יף וּ/בְנֵ֥י מָרֵשָׁ֖ה אֲבִ֥י חֶבְרֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/042.yaml
  text: 'And the sons of Caleb the brother of Jerahmeel: Mesha his firstborn[a], who was the father of Ziph[b], and the sons of Mareshah the father of Hebron.'
translation:
  language: hi
  text: 'और यरहमेएल के भाई कालेब के पुत्र ये थे: उसका ज्येष्ठ पुत्र मेशा, जो ज़ीप का पिता था[a], और मारेशा के पुत्र, हेब्रोन के पिता[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इतिहास-वृत्तान्त में “पिता” केवल जैविक पिता ही नहीं, बल्कि पूर्वज, कुल-प्रधान या किसी स्थान से जुड़ा संस्थापक भी हो सकता है।
    reason: cultural_note
  - marker: b
    text: इस अन्तिम वाक्यांश की इब्रानी रचना कठिन है। मसोरेटिक पाठ का शाब्दिक रूप है, “और मारेशा के पुत्र, हेब्रोन के पिता।” कुछ विद्वान “हेब्रोन के पिता” को मारेशा से जोड़ते हैं; अन्य अनुवाद में इस कठिन शब्द-क्रम को ज्यों का त्यों रखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי כָלֵב
  choice: और कालेब के पुत्र ये थे
  rationale: वंशावली के मानक सूत्र ‘कालेब के पुत्र’ को बनाए रखा गया है। स्वाभाविक हिन्दी वाक्य के लिए ‘ये थे’ जोड़ा गया है; ‘पुत्र’ यहाँ निकट या व्यापक वंशजों को सूचित कर सकता है।
- source_word: אֲחִי יְרַחְמְאֵל
  choice: यरहमेएल के भाई
  rationale: सम्बन्धवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप, जो कालेब की पहचान बताता है।
- source_word: מֵישָׁע בְּכֹרוֹ
  choice: उसका पहलौठा मेशा
  rationale: בְּכוֹר का वंशावली और प्रतिष्ठा से जुड़ा अर्थ ‘पहलौठा’ में सुरक्षित रहता है।
- source_word: אֲבִי זִיף
  choice: ज़ीप का पिता
  rationale: ‘पिता’ मूल אָב का औपचारिक समतुल्य है और जैविक पिता, पूर्वज, कुल-प्रधान अथवा किसी स्थान से जुड़े संस्थापक की सम्भावना खुली रखता है।
- source_word: וּבְנֵי מָרֵשָׁה אֲבִי חֶבְרוֹן
  choice: और हेब्रोन के पिता मारेशा के पुत्र
  rationale: मसोरेटिक पाठ की कठिन संरचना और ‘मारेशा के पुत्र’ सूत्र को बिना पाठ-संशोधन के सुरक्षित रखा गया है। शब्द-क्रम ‘हेब्रोन के पिता’ को मारेशा के साथ स्वाभाविक रूप से जोड़ता है, जबकि पादटिप्पणी मूल की कठिनाई बताती है।
theological_decisions:
- issue: वंशावली में ‘पिता’ का अर्थ
  choice: मूल के अनुरूप ‘पिता’ रखा गया
  alternative: ‘पूर्वज’, ‘कुल-प्रधान’ या ‘संस्थापक’
  rationale: इतिहास-वृत्तान्त में אָב का अर्थ जैविक पिता से व्यापक हो सकता है। किसी एक अर्थ को मुख्य पाठ में निश्चित करना मूल की सम्भावित बहुअर्थकता को अनावश्यक रूप से समाप्त कर देता।
- issue: अन्तिम उपवाक्य का कठिन सम्बन्ध
  choice: मसोरेटिक शब्दावली को बनाए रखते हुए ‘हेब्रोन के पिता मारेशा के पुत्र’
  alternative: ‘और मारेशा, जो हेब्रोन का पिता था’ या पाठ-संशोधन पर आधारित कोई अधिक स्पष्ट वंशावली
  rationale: मूल पाठ स्पष्ट रूप से ‘मारेशा के पुत्र’ कहता है, पर उसके बाद ‘हेब्रोन का पिता’ का व्याकरणिक सम्बन्ध कठिन है। अनिश्चितता को पादटिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। व्यक्तिनामों का देवनागरी लिप्यन्तरण किया गया है। वंशावली की संक्षिप्त शैली बनाए रखते हुए आरम्भ में ‘ये थे’ जोड़कर हिन्दी वाक्य को स्वाभाविक बनाया गया है; अन्तिम खण्ड की वास्तविक पाठगत कठिनाई पादटिप्पणी में स्पष्ट की गई है।
