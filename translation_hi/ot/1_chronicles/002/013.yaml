  register: आधुनिक मानक हिन्दी में संक्षिप्त वंशावली-शैली रखी गई है। ‘पहलौठा’ बाइबलीय संदर्भ में परिचित और अर्थ-सटीक है; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए एक ही बहुवचन क्रिया अंत में रखी गई है।
