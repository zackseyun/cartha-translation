base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/013.yaml
  text: And Jesse fathered his firstborn Eliab[a], Abinadab the second, and Shimea the third.
translation:
  language: hi
  text: और यिशै से पहलौठा एलीआब, दूसरा अबीनादाब और तीसरा शिमा[a] उत्पन्न हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘शिमा’; 1 शमूएल 16:9 की समानांतर सूची में ‘शम्मा’ है।
    reason: cross_reference
lexical_decisions:
- source_word: וְאִישַׁי
  choice: और यिशै
  rationale: वंशावली में וְ साधारण संयोजक है। אִישַׁי को प्रचलित हिन्दी बाइबलीय रूप ‘यिशै’ में लिप्यंतरित किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुए
  rationale: ילד के हिफ़ील रूप का वंशावली-संबंधी अर्थ पिता के रूप में संतान उत्पन्न करना है। हिन्दी में ‘से ... उत्पन्न हुए’ स्वाभाविक, स्पष्ट और गरिमापूर्ण है।
- source_word: אֶת בְּכֹרוֹ אֶת אֱלִיאָב
  choice: उसका पहलौठा एलीआब
  rationale: בְּכֹרוֹ का अर्थ ‘उसका पहलौठा’ है; पुत्र का भाव संदर्भ से स्पष्ट है। אֶת का पृथक अनुवाद नहीं होता और אֱלִיאָב को ‘एलीआब’ लिप्यंतरित किया गया है।
- source_word: וַאֲבִינָדָב הַשֵּׁנִי
  choice: दूसरा अबीनादाब
  rationale: הַשֵּׁנִי क्रमसूचक ‘दूसरा’ है। नाम को स्रोत के अनुसार ‘अबीनादाब’ रखा गया है।
- source_word: וְשִׁמְעָא הַשְּׁלִישִׁי
  choice: और तीसरा शिमा[a]
  rationale: שִׁמְעָא का स्रोत-संगत लिप्यंतरण ‘शिमा’ है और הַשְּׁלִישִׁי का अर्थ ‘तीसरा’ है। समानांतर पाठ के भिन्न नाम-रूप को मुख्य पाठ में मिलाया नहीं गया।
theological_decisions: []
