  text: Hur fathered Uri, and Uri fathered Bezalel.
translation:
  language: hi
  text: हूर से ऊरी उत्पन्न हुआ, और ऊरी से बसलेल उत्पन्न हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוּר
  choice: हूर
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के प्रसंग में हिफ़ील रूप पुरुष-वंश में जन्म या पितृत्व को व्यक्त करता है। हिन्दी में यह रचना स्वाभाविक, गरिमापूर्ण और संक्षिप्त है तथा ‘जन्म दिया’ से उत्पन्न होने वाली अस्वाभाविकता से बचती है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी में इसका स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
- source_word: אוּרִי
  choice: ऊरी
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण; दीर्घ ऊ मूल उच्चारण को दर्शाता है।
- source_word: וְ
  choice: और
  rationale: दो क्रमिक वंशावली कथनों को जोड़ने वाला सामान्य संयोजक।
- source_word: בְּצַלְאֵל
  choice: बसलेल
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप चुना गया है, जो सामान्य पाठकों के लिए परिचित और पठनीय है।
