  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्रोत-पाठ में किसी पाठांतर या वास्तविक अर्थगत अस्पष्टता के अभाव में फुटनोट नहीं जोड़ा गया; परामर्शी अंग्रेज़ी पाठ का फुटनोट अपने चिह्न और विषय में असंगत प्रतीत होता है।
