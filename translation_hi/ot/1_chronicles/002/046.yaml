  text: וְ/עֵיפָה֙ פִּילֶ֣גֶשׁ כָּלֵ֔ב יָֽלְדָ֛ה אֶת חָרָ֥ן וְ/אֶת מוֹצָ֖א וְ/אֶת גָּזֵ֑ז וְ/חָרָ֖ן הֹלִ֥יד אֶת גָּזֵֽז־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/046.yaml
  text: And Ephah[a], Caleb’s concubine, bore Haran, Moza, and Gazez; and Haran fathered Gazez.
translation:
  language: hi
  text: और कालेब की उपपत्नी एपा ने हारान, मोसा और गाजेज को जन्म दिया; और हारान गाजेज का पिता बना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּילֶגֶשׁ
  choice: उपपत्नी
  rationale: यह इब्रानी शब्द मान्य किंतु गौण वैवाहिक दर्जे वाली स्त्री को दर्शाता है; ‘उपपत्नी’ आधुनिक हिन्दी में संक्षिप्त और वंशावली-संदर्भ के अनुकूल है।
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: स्त्री कर्ता के साथ ילד का यह स्वाभाविक हिन्दी रूप है और वंशावली का आशय स्पष्ट रखता है।
- source_word: הֹלִיד
  choice: पिता हुआ
  rationale: वंशावलियों में ילד का हिफ़ील रूप पुरुष की ओर से वंश-संबंध बताता है; यह रूप अर्थ को स्पष्ट रखते हुए पुरातन ‘उत्पन्न किया’ से अधिक सहज है।
- source_word: עֵיפָה
  choice: एपा
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: כָּלֵב
  choice: कालेब
  rationale: व्यक्तिवाचक नाम का हिन्दी में प्रचलित बाइबलीय रूप।
- source_word: חָרָן
  choice: हारान
  rationale: नाम दोनों स्थानों पर एक ही रूप में रखा गया है।
- source_word: מוֹצָא
  choice: मोसा
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
- source_word: גָּזֵז
  choice: गाजेज
  rationale: नाम की दोनों आवृत्तियों में एकरूप लिप्यंतरण रखा गया है।
- source_word: וְ
  choice: और
  rationale: यह संयोजक वंशावली की सीधी क्रमबद्धता में नामों और उपवाक्यों को जोड़ता है।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: सीधे कर्म का चिह्न हिन्दी में स्वतंत्र शब्द नहीं माँगता; उसका कार्य वाक्य-विन्यास से व्यक्त है।
