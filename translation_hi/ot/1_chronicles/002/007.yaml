source:
  edition: WLC
  text: וּ/בְנֵ֖י כַּרְמִ֑י עָכָר֙ עוֹכֵ֣ר יִשְׂרָאֵ֔ל אֲשֶׁ֥ר מָעַ֖ל בַּ/חֵֽרֶם׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/007.yaml
  text: 'And the sons of Karmi: Achar[a], the troubler of Israel[b], who acted unfaithfully regarding the devoted things.'
translation:
  language: hi
  text: 'और कर्मी के पुत्र: आखार[a], इस्राएल को संकट में डालने वाला, जिसने विनाश के लिए समर्पित वस्तुओं[b] के संबंध में विश्वासघात किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आकान।” 1 इतिहास में यहाँ “आखार” रूप का प्रयोग है, जो संभवतः आगे आए “संकट में डालने वाला” से शब्द-साम्य रखता है। देखें यहोशू 7।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “विनाश के लिए समर्पित वस्तु” एकवचन है; यहाँ इसका सामूहिक अर्थ है। ये वे वस्तुएँ थीं जो परमेश्वर के आदेश से विनाश के लिए अलग की गई थीं और जिन पर अधिकार करना निषिद्ध था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: वंशावली में यह संयोजक सहित रचनात्मक बहुवचन है। ‘पुत्र’ मूल के पुरुषवाची वंश-संदर्भ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כַּרְמִי
  choice: कर्मी
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: עָכָר
  choice: आखार
  rationale: इतिहास की पुस्तक में पाया जाने वाला रूप עָכָר सुरक्षित रखा गया है; इसे यहोशू 7 के अधिक परिचित ‘आकान’ से समरूप नहीं किया गया, क्योंकि यहाँ अगले शब्द עוֹכֵר के साथ जानबूझकर शब्द-साम्य है।
- source_word: עוֹכֵר יִשְׂרָאֵל
  choice: इस्राएल को संकट में डालने वाला
  rationale: कर्तृवाचक कृदंत का संज्ञात्मक प्रयोग है। यह आधुनिक हिन्दी में स्वाभाविक है और आखार के नाम तथा ‘संकट में डालने’ की क्रिया के बीच मूल शब्द-क्रीड़ा को यथासंभव बनाए रखता है।
- source_word: אֲשֶׁר
  choice: जिसने
  rationale: यह आखार के विषय में संबंधवाचक उपवाक्य आरम्भ करता है; हिन्दी में कर्ता और पूर्ण क्रिया के साथ ‘जिसने’ स्वाभाविक है।
- source_word: מָעַל
  choice: विश्वासघात किया
  rationale: यह क्रिया पवित्र वस्तु के संबंध में निष्ठा तोड़ने या अपराधपूर्ण बेईमानी का बोध देती है। ‘विश्वासघात किया’ नैतिक और पवित्र दायित्व के उल्लंघन—दोनों को व्यक्त करता है।
- source_word: בַּחֵרֶם
  choice: अर्पित वस्तुओं के विषय में
  rationale: חֵרֶם यहाँ उन वस्तुओं को सूचित करता है जो परमेश्वर के लिए अलग रखी गई थीं, विशेषतः विनाश के लिए। प्रसंगगत सामूहिक अर्थ के कारण हिन्दी में बहुवचन रखा गया है और विस्तृत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: חֵרֶם का अनुवाद—पवित्र समर्पण, निषेध और विनाश का संबंध
  choice: अर्पित वस्तुओं
  alternative: विनाश के लिए अर्पित वस्तुएँ; निषिद्ध वस्तु
  rationale: मुख्य पाठ में संक्षिप्त और समझने योग्य अभिव्यक्ति रखी गई है, जबकि पादटिप्पणी स्पष्ट करती है कि ये सामान्य भेंटें नहीं, बल्कि परमेश्वर के आदेश से विनाश के लिए अलग रखी गई वस्तुएँ थीं। इस प्रकार शब्द के धार्मिक और न्यायिक दोनों पहलू सुरक्षित रहते हैं।
- issue: עָכָר को यहोशू 7 के עָכָן से समरूप करना या इतिहास का रूप बनाए रखना
  choice: आखार
  alternative: आकान
  rationale: मूल पाठ में दिया गया नाम-रूप बनाए रखा गया है, जिससे עָכָר और עוֹכֵר की शब्द-क्रीड़ा तथा इतिहासकार की साहित्यिक प्रस्तुति न मिटे। परिचित वैकल्पिक नाम पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। वंशावली की संक्षिप्त संरचना बनाए रखते हुए ‘आखार’ और ‘संकट में डालने वाला’ के बीच इब्रानी शब्द-क्रीड़ा को हिन्दी में यथासंभव संकेतित किया गया है।
