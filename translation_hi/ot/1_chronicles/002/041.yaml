  text: Shallum fathered Jekamiah, and Jekamiah fathered Elishama.
translation:
  language: hi
  text: शल्लूम से यकम्याह उत्पन्न हुआ, और यकम्याह से एलीशामा उत्पन्न हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: व्यक्तिवाचक नाम का ध्वन्यात्मक लिप्यंतरण; हिब्रू व्यंजन के द्वित्व और दीर्घ स्वर को स्वाभाविक हिन्दी रूप में रखा गया है।
- source_word: הוֹלִיד / הֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली में हिफ़ील रूप का अर्थ ‘पिता बना/जन्म दिया’ है। हिन्दी वंशावली की स्वाभाविक और संक्षिप्त रचना ‘से … उत्पन्न हुआ’ पितृवंशीय संबंध को स्पष्ट करती है और पुरातन ‘जन्माया’ से बचती है।
- source_word: יְקַמְיָה / וִיקַמְיָה
  choice: यकम्याह / और यकम्याह
  rationale: नाम का ध्वन्यात्मक लिप्यंतरण किया गया है; दूसरी बार नाम की पुनरावृत्ति और prefixed ו का ‘और’ मूल पाठ के अनुसार बनाए रखा गया है।
- source_word: אֱלִישָׁמָע
  choice: एलीशामा
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट, हिन्दी में पठनीय ध्वन्यात्मक लिप्यंतरण।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित कर्म-सूचक चिह्न है; हिन्दी में इसका कोई स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
