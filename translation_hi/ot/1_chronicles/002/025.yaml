  yaml_path: translation/ot/1_chronicles/002/025.yaml
  text: The sons of Jerahmeel[a], the firstborn of Hezron, were Ram his firstborn, Bunah, Oren, Ozem, and Ahijah.
translation:
  language: hi
  text: 'हेस्रोन के ज्येष्ठ पुत्र यरहमेल[a] के पुत्र ये थे: उसका ज्येष्ठ पुत्र राम, बूना, ओरेन, ओसेम और अहिय्याह।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्य-विन्यास को सबसे स्वाभाविक रूप से इस प्रकार पढ़ा जाता है कि यरहमेल के पाँच पुत्रों की सूची दी गई है और राम को उसका ‘ज्येष्ठ पुत्र’ बताया गया है। कुछ व्याख्याकारों ने सूची में ‘अहिय्याह’ का संबंध अलग ढंग से समझने का प्रस्ताव रखा है, पर सीधा पठन इसे इसी क्रम में एक और व्यक्ति का नाम मानता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ये थे
  rationale: वंशावली में यह पद परिवार के सदस्यों की सूची प्रस्तुत करता है; ‘ये थे’ आधुनिक हिन्दी में स्वाभाविक सूची-सूचक प्रयोग है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: इस वंशावली-संदर्भ में यह पुरुष संतान या वंश की पुरुष कड़ियों को सूचित करता है; ‘पुत्र’ मूल की लिंग-सूचक और वंशावलीगत शक्ति बनाए रखता है।
- source_word: יְרַחְמְאֵל
  choice: यरहमेल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בְּכוֹר חֶצְרוֹן
  choice: हेस्रोन के पहलौठे
  rationale: यह पद यरहमेल को हेस्रोन का पहलौठा बताता है और मूल के संबंध को स्पष्ट रूप से बनाए रखता है।
- source_word: הַבְּכוֹר
  choice: उनका पहलौठा
  rationale: यह पद सबसे स्वाभाविक रूप से राम को यरहमेल का पहलौठा ठहराता है; ‘उनका’ हिन्दी में संबंध स्पष्ट करता है और इब्रानी की पुनरुक्ति भी बनाए रखता है।
- source_word: רָם
  choice: राम
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: וּבוּנָה
  choice: बूना
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וָאֹרֶן
  choice: ओरेन
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וָאֹצֶם
  choice: ओसेम
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण; צ को यहाँ ‘स’ से व्यक्त किया गया है।
- source_word: אֲחִיָּה
  choice: अहिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण, जिसमें मध्य व्यंजन की दृढ़ ध्वनि और अंतिम יָה तत्व व्यक्त होते हैं।
