    reason: alternative_reading
lexical_decisions:
- source_word: וְ/נַחְשׁוֹן
  choice: और नहशोन
  rationale: संयोजक וְ को ‘और’ से व्यक्त किया गया है और नַחְשׁוֹן का आधुनिक हिन्दी में स्रोतानुकूल लिप्यंतरण ‘नहशोन’ किया गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में हिफ़ील रूप का अर्थ पिता बनना/जन्म देना है। हिन्दी की स्वाभाविक वंशावली-शैली ‘से … उत्पन्न हुआ’ पुरुष वंश-संबंध को स्पष्ट रखती है और प्राचीन या असहज अभिव्यक्ति से बचती है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का चिह्न है; हिन्दी वाक्य-विन्यास में इसका अलग शब्द आवश्यक नहीं है।
- source_word: שַׂלְמָא
  choice: सलमा
  rationale: मसोराई पाठ का रूप שַׂלְמָא सीधे ‘सलमा’ का समर्थन करता है; संबंधित वंशावलियों से सामंजस्य बैठाने के लिए इसे चुपचाप ‘सलमोन’ नहीं बनाया गया।
- source_word: וְ/שַׂלְמָא
  choice: और सलमा
  rationale: וְ को ‘और’ और नाम שַׂלְמָא को स्रोत-पाठ के अनुसार ‘सलमा’ रखा गया है।
- source_word: בֹּעַז
  choice: बोअज़
  rationale: इब्रानी नाम בֹּעַז का निकट और हिन्दी में स्पष्ट लिप्यंतरण ‘बोअज़’ है; स्वर-संधि को बनाए रखने के लिए दोनों स्वरों को लिखा गया है।
