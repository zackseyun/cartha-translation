  text: 'The sons of Hebron: Korah[a], Tappuah, Rekem, and Shema.'
translation:
  language: hi
  text: 'और हेब्रोन के ये पुत्र थे: कोरह, तप्पूह, रेकेम और शामा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי חֶבְרוֹן
  choice: और हेब्रोन के पुत्र थे
  rationale: וּ को ‘और’ से व्यक्त किया गया है ताकि वंशावली की पूर्ववर्ती कड़ी बनी रहे। בְנֵי का सीधा अर्थ ‘पुत्र’ है; सूची को स्वाभाविक हिन्दी वाक्य बनाने के लिए ‘थे’ जोड़ा गया है।
- source_word: קֹרַח
  choice: कोरह
  rationale: इब्रानी व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: תַפֻּחַ
  choice: तप्पूह
  rationale: यहाँ सामान्य संज्ञा का अर्थ देने के बजाय व्यक्तिनाम के रूप में इब्रानी उच्चारण के निकट लिप्यंतरण किया गया है।
- source_word: רֶקֶם
  choice: रेकेम
  rationale: इब्रानी व्यक्तिनाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: שָׁמַע
  choice: शेमा
  rationale: मसोरेटी स्वरांकन שָׁמַע के अनुसार नाम को ‘शेमा’ लिखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। नामों को हिन्दी बाइबलीय प्रयोग और इब्रानी ध्वनि के संतुलन के साथ लिप्यंतरित किया गया है। अंग्रेज़ी परत का ‘Korah[a]’ वाला पादटिप्पणी-चिह्न उसके पादटिप्पणी-पाठ से असंगत है, क्योंकि टिप्पणी शेमा नाम से संबंधित है; मूल इब्रानी स्पष्ट रूप से שָׁמַע (शेमा) पढ़ता है, इसलिए अनावश्यक वैकल्पिक पादटिप्पणी नहीं रखी गई।
