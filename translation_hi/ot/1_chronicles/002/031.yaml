    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: वंशावलियों में בְּנֵי सीधे पुत्रों या व्यापक वंशजों, दोनों को सूचित कर सकता है। यहाँ बार-बार आने वाली वंशावली-सूची की संरचना को बनाए रखते हुए अधिक सीधा अर्थ ‘पुत्र’ रखा गया है; व्यापक अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: אַפַּיִם
  choice: अप्पैम
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: יִשְׁעִי
  choice: यिशई
  rationale: हिब्रू व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; आरंभिक י और अंतिम עִי की ध्वनि को स्वाभाविक हिंदी रूप में दर्शाता है।
- source_word: שֵׁשָׁן
  choice: शेशान
  rationale: हिब्रू व्यक्तिवाचक नाम का सीधा और पठनीय देवनागरी लिप्यंतरण।
- source_word: אַחְלָי
  choice: अहलै
  rationale: हिब्रू व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण; पद में व्यक्ति के बारे में कोई अतिरिक्त पहचान नहीं जोड़ी गई है।
