  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण शैली रखी गई है। कठिन इब्रानी वाक्य-संरचना और मृत्यु के बाद संतान-जन्म के कालक्रम को बिना व्याख्यात्मक संशोधन के सुरक्षित रखा गया है। पादटिप्पणी-चिह्न संबंधित पदों पर लगाए गए हैं; उपलब्ध अंग्रेज़ी परामर्श-पाठ में पादटिप्पणियों के चिह्न और विषय परस्पर उलटे थे, जिन्हें आशय के अनुसार ठीक किया गया है।
