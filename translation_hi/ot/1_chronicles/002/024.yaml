base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/024.yaml
  text: After Hezron died in Caleb-ephrathah[a], Hezron’s wife Abijah bore to him Ashhur[b], the father of Tekoa.
translation:
  language: hi
  text: हेस्रोन के कालेब-एप्राता[a] में मरने के बाद, हेस्रोन की पत्नी अबिय्याह ने हेस्रोन के लिए अशहूर को जन्म दिया, जो तकोआ का पिता[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “कालेब-एप्राता में” इब्रानी पदबंध कठिन है। यह किसी स्थान या कुल का नाम हो सकता है; परंपरागत रूप से इसे “कालेब एप्राता” भी लिखा जाता है।
    reason: alternative_reading
  - marker: b
    text: या “तकोआ का संस्थापक।” वंशावलियों में “पिता” किसी बस्ती या कुल के संस्थापक अथवा प्रमुख पूर्वज को भी सूचित कर सकता है, केवल सगे पिता को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַחַר מוֹת חֶצְרוֹן
  choice: हेस्रोन के ... मरने के बाद
  rationale: אַחַר के साथ infinitive construct מוֹת समय-संबंध व्यक्त करता है। हिंदी में यह स्वाभाविक रूप से “मरने के बाद” है और घटना-क्रम को स्पष्ट रखता है।
- source_word: בְּכָלֵב אֶפְרָתָה
  choice: कालेब-एप्राता में
  rationale: בְּ को स्थानवाचक “में” समझा गया है। कठिन इब्रानी पदबंध के दोनों तत्वों को योजक-चिह्न के साथ एक संयुक्त स्थान अथवा कुल-नाम के रूप में रखा गया है; इसकी अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: नाम का देवनागरी लिप्यंतरण है; अंतिम יה को प्रचलित बाइबलीय नाम-रूप के अनुरूप “य्याह” से दर्शाया गया है।
- source_word: וַתֵּלֶד לוֹ
  choice: उसके लिए ... को जन्म दिया
  rationale: לוֹ में निहित अप्रत्यक्ष संबंध को “उसके लिए” से सुरक्षित रखा गया है, यद्यपि हेस्रोन की मृत्यु के बाद जन्म का कथन असामान्य प्रतीत होता है। पाठ की इस कठिनाई को चुपचाप सरल नहीं किया गया।
- source_word: אַשְׁחוּר
  choice: अशहूर
  rationale: मसोरेटिक स्वरांकन और व्यंजन-रूप के निकट देवनागरी लिप्यंतरण।
- source_word: אֲבִי תְקוֹעַ
  choice: तकोआ का पिता
  rationale: אָב का सीधा अर्थ “पिता” मुख्य पाठ में रखा गया है। वंशावलियों में इसके व्यापक अर्थ—संस्थापक या प्रमुख पूर्वज—को पादटिप्पणी में दिया गया है।
