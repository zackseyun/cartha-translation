  text: Segub fathered Jair, and he had twenty-three cities in the land of Gilead.
translation:
  language: hi
  text: और सगूब से याईर उत्पन्न हुआ, और गिलाद देश में उसके तेईस नगर थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂגוּב
  choice: और सगूब
  rationale: व्यक्तिनाम का देवनागरी में निकट लिप्यंतरण किया गया है और आरंभिक संयोजक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में हिफ़ील रूप संतान उत्पन्न करने या पिता बनने का भाव देता है। हिंदी में ‘सगूब से याईर उत्पन्न हुआ’ स्वाभाविक और गरिमापूर्ण वंशावली-शैली है।
- source_word: יָאִיר
  choice: याईर
  rationale: हिब्रू व्यक्तिनाम का उच्चारण-सन्निकट देवनागरी लिप्यंतरण।
- source_word: וַיְהִי לוֹ
  choice: उसके ... थे
  rationale: היה + ל possession का मुहावरा है; बहुवचन ‘नगर’ के साथ हिंदी में स्वाभाविक रूप ‘उसके ... नगर थे’ है। सर्वनाम का निकटतम और अर्थसंगत पूर्वपद याईर है।
- source_word: עֶשְׂרִים וְשָׁלוֹשׁ
  choice: तेईस
  rationale: हिब्रू संख्या को आधुनिक मानक हिंदी की स्वाभाविक संख्या-रचना में व्यक्त किया गया है।
- source_word: עָרִים
  choice: नगर
  rationale: עִיר नगर या बस्ती को सूचित कर सकता है; इस क्षेत्रीय विवरण में ‘नगर’ मानक और संदर्भानुकूल है।
- source_word: בְּאֶרֶץ הַגִּלְעָד
  choice: गिलाद देश में
  rationale: אֶרֶץ का भौगोलिक अर्थ ‘देश/प्रदेश’ है। ‘गिलाद देश में’ पूरे हिब्रू पदबंध और स्थानगत अर्थ को संक्षेप में सुरक्षित रखता है।
