base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/028.yaml
  text: The sons of Onam were Shammai and Jada[a]. The sons of Shammai were Nadab and Abishur.
translation:
  language: hi
  text: ओनाम के पुत्र शम्मै और यादा थे। और शम्मै के पुत्र नादाब और अबीशूर थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: वंशावली के सूत्र में היה साधारण संबंधसूचक क्रिया के रूप में संतानों का परिचय देता है; हिन्दी में ‘थे’ स्वाभाविक और सटीक है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: इस वंशावली में निकटवर्ती पुरुष संतानों का उल्लेख है, इसलिए व्यापक ‘संतान’ की अपेक्षा ‘पुत्र’ अधिक सटीक है।
- source_word: אוֹנָם
  choice: ओनाम
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: שַׁמַּי
  choice: शम्मै
  rationale: व्यक्तिवाचक नाम को दोनों स्थानों पर एक ही रूप में लिप्यंतरित किया गया है।
- source_word: יָדָע
  choice: यादा
  rationale: व्यक्तिवाचक नाम का हिब्रू व्यंजन और स्वर-रूप के निकट लिप्यंतरण।
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: आरंभिक וּ को ‘और’ द्वारा सुरक्षित रखा गया है, क्योंकि यह अगली वंशावली शाखा को पिछले कथन से जोड़ता है।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिवाचक नाम का हिब्रू रूप के निकट देवनागरी लिप्यंतरण।
- source_word: אֲבִישׁוּר
  choice: अबीशूर
  rationale: व्यक्तिवाचक नाम का हिब्रू रूप के निकट देवनागरी लिप्यंतरण।
