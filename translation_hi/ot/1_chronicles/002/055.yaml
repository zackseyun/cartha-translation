  text: וּ/מִשְׁפְּח֤וֹת סֹפְרִים֙ ישבו יַעְבֵּ֔ץ תִּרְעָתִ֥ים שִׁמְעָתִ֖ים שׂוּכָתִ֑ים הֵ֚מָּה הַ/קִּינִ֣ים הַ/בָּאִ֔ים מֵ/חַמַּ֖ת אֲבִ֥י בֵית רֵכָֽב־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/055.yaml
  text: 'and the families of the scribes who lived at Jabez: the Tirathites[a], the Shimeathites, and the Sucathites. These are the Kenites who came from Hammath, the father of the house of Rechab.'
translation:
  language: hi
  text: 'और याबेस में रहनेवाले शास्त्रियों के कुल ये थे: तिराती, शिमाती और सूकाती। ये वे केनी थे जो हम्मत से आए थे, जो रेकाब के घराने का पिता[a] था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रेकाब के घराने का पूर्वज’ अथवा ‘संस्थापक’। वंशावली के संदर्भों में इब्रानी शब्द ‘पिता’ किसी पूर्वज या घराने के संस्थापक को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת סֹפְרִים
  choice: और ... शास्त्रियों के कुल
  rationale: वाव को ‘और’ के रूप में रखा गया है ताकि वंशावली-सूची की कड़ी बनी रहे। מִשְׁפְּחוֹת के लिए ‘कुल’ और סֹפְרִים के लिए प्रचलित तथा सीधा पद ‘शास्त्री’ चुना गया है।
- source_word: ישבו יַעְבֵּץ
  choice: याबेस में रहनेवाले
  rationale: बहुवचन क्रिया के निवास-संबंधी अर्थ को स्वाभाविक हिन्दी संबंधवाचक पदबंध में व्यक्त किया गया है; याबेस को स्थान के रूप में रखा गया है।
- source_word: תִּרְעָתִים שִׁמְעָתִים שׂוּכָתִים
  choice: तिराती, शिमाती और सूकाती
  rationale: ये समुदाय अथवा कुल-सूचक नाम हैं, इसलिए इनके नामों का देवनागरी लिप्यंतरण किया गया है।
- source_word: הַקִּינִים
  choice: केनी
  rationale: जातीय अथवा कुल-सूचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: הַבָּאִים מֵחַמַּת
  choice: जो हम्मत से आए थे
  rationale: ‘आने’ वाले कृदंत और מִן से व्यक्त उद्गम को सीधे रूप में रखा गया है; इससे यह अनावश्यक रूप से तय नहीं किया जाता कि आशय प्रवास है या वंशगत उद्गम।
- source_word: אֲבִי בֵית רֵכָב
  choice: रेकाब के घराने का पिता
  rationale: ‘पिता’ और ‘घराना’ हिब्रू वंशावली-मुहावरे को पारदर्शी ढंग से सुरक्षित रखते हैं; संदर्भ में ‘पिता’ पूर्वज या संस्थापक भी हो सकता है।
theological_decisions:
- issue: אֲבִי का वंशावली-संदर्भ में अर्थ
  choice: पिता
  alternative: पूर्वज अथवा संस्थापक
  rationale: मुख्य पाठ में हिब्रू का ठोस संबंध-सूचक शब्द सुरक्षित रखा गया है और उसके व्यापक वंशावलीगत अर्थ को पादटिप्पणी में बताया गया है; इस प्रकार किसी एक व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। लम्बे हिब्रू वाक्य को स्पष्टता के लिए दो वाक्यों में बाँटा गया है, जबकि हम्मत को रेकाब के घराने के ‘पिता’ के रूप में जोड़ने वाला व्याकरणिक संबंध सुरक्षित है।
