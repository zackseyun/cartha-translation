base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/054.yaml
  text: 'The sons of Salma: Bethlehem[a], the Netophathites, Atroth-beth-joab, half of the Manahathites[b], the Zorites.'
translation:
  language: hi
  text: 'सलमा के वंशज: बेतलेहेम, नतोपावासी, अत्रोत-बेत-योआब, मनहाती लोगों का आधा भाग[a], और सोरावासी[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः “मनूहोती लोगों का आधा भाग।” इस इब्रानी जातिवाचक नाम का ठीक किस स्थान से संबंध है, यह अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् सोरा से संबद्ध लोग; नाम का लिप्यंतरण “सोराती” भी किया जा सकता है।
    reason: lexical_alternative
