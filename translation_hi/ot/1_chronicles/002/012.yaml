  source_fidelity: 'The translation accurately conveys the two genealogical relationships expressed by the repeated Hiphil of ילד: Obed is descended from Boaz, and Jesse (यिशै) is descended from Obed. The conjunction is retained, and no source element is omitted in a meaning-bearing way.'
