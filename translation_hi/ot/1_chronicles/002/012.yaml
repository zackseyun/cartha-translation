  text: Boaz fathered Obed, and Obed fathered Jesse.
translation:
  language: hi
  text: बोअज़ से ओबेद उत्पन्न हुआ, और ओबेद से यिशै उत्पन्न हुआ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בֹעַז
  choice: बोअज़
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी रूप के निकट, हिन्दी में प्रचलित बाइबलीय वर्तनी के अनुसार लिप्यंतरित किया गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में हिफ़ील रूप पिता बनने अथवा संतान उत्पन्न करने का भाव देता है। हिन्दी में ‘से … उत्पन्न हुआ’ स्वाभाविक, गरिमापूर्ण और वंश-संबंध में स्पष्ट है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित कर्म का सूचक है; हिन्दी में इसकी अलग अभिव्यक्ति आवश्यक नहीं है।
- source_word: עוֹבֵד
  choice: ओबेद
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וְ/עוֹבֵד
  choice: और ओबेद
  rationale: וְ को दोनों वंशावली-वाक्यांशों को जोड़ने वाले ‘और’ के रूप में अनूदित किया गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: दोहराए गए वंशावली-क्रियापद का अनुवाद एकरूप रखा गया है।
- source_word: יִשָׁי
  choice: यिशै
  rationale: नाम को अंग्रेज़ी के पारंपरिक रूप से नहीं, बल्कि मूल इब्रानी उच्चारण के निकट देवनागरी में प्रस्तुत किया गया है।
