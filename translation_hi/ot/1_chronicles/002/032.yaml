  register: आधुनिक मानक हिन्दी की संक्षिप्त, गरिमापूर्ण वंशावली शैली अपनाई गई है। ‘पुत्रहीन’ को ‘निःसंतान’ पर वरीयता दी गई, क्योंकि स्रोत केवल पुत्रों का उल्लेख करता है और सम्भावित पुत्रियों के विषय में कुछ नहीं कहता।
