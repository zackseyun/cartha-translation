id: 1CH.2.32
reference: 1 Chronicles 2:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֤י יָדָע֙ אֲחִ֣י שַׁמַּ֔י יֶ֖תֶר וְ/יוֹנָתָ֑ן וַ/יָּ֥מָת יֶ֖תֶר לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/032.yaml
  text: 'The sons of Jada[a], Shammai’s brother: Jether and Jonathan. Jether died without sons.'
translation:
  language: hi
  text: और शम्मै के भाई यादा के पुत्र येतेर और योनातान थे। येतेर पुत्रहीन मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: संयोजक וּ को ‘और’ के रूप में रखा गया है और בְנֵי की संबंधकारक बहुवचन रचना को स्वाभाविक हिन्दी वंशावली शैली में व्यक्त किया गया है।
- source_word: יָדָע
  choice: यादा
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण है; अंतिम ע के लिए अलग अप्राकृतिक ध्वनि जोड़े बिना नाम का निकट रूप रखा गया है।
- source_word: אֲחִי שַׁמַּי
  choice: शम्मै के भाई
  rationale: अर्थ सीधे ‘शम्मै का भाई’ है; हिन्दी वाक्यक्रम के अनुसार इसे यादा से पहले रखा गया है।
- source_word: יֶתֶר
  choice: येतेर
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण दोनों स्थानों पर समान रखा गया है।
- source_word: וְיוֹנָתָן
  choice: और योनातान
  rationale: संयोजक सहित व्यक्तिनाम का स्रोत-निकट लिप्यंतरण किया गया है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: क्रमागत कथन को सरल और स्वाभाविक हिन्दी भूतकाल में व्यक्त किया गया है।
- source_word: לֹא בָנִים
  choice: पुत्रहीन
  rationale: शाब्दिक खंड ‘पुत्र नहीं’ को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है और वंशावली में पुरुष संतान न होने की बात को सुरक्षित रखता है।
theological_decisions: []
