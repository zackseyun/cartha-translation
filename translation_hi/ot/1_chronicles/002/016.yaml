  yaml_path: translation/ot/1_chronicles/002/016.yaml
  text: 'Their sisters were Zeruiah and Abigail. The sons of Zeruiah: Abishai, Joab, and Asahel—three.'
translation:
  language: hi
  text: उनकी बहनें सरूयाह और अबीगैल थीं। सरूयाह के पुत्र अबीशै, योआब और असाहेल थे—कुल तीन।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַאֲחֹתֵיהֶם
  choice: उनकी बहनें
  rationale: बहुवचन ‘बहनें’ और तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय ‘उनकी’ को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: צְרוּיָה
  choice: सरूयाह
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी ध्वन्यंतरण।
- source_word: וַאֲבִיגָיִל
  choice: और अबीगैल
  rationale: संयोजक को ‘और’ से व्यक्त करते हुए व्यक्तिगत नाम का हिन्दी ध्वन्यंतरण किया गया है।
- source_word: וּבְנֵי צְרוּיָה
  choice: सरूयाह के पुत्र
  rationale: इब्रानी संबंध-विन्यास का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אַבְשַׁי
  choice: अबीशै
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी ध्वन्यंतरण।
- source_word: וְיוֹאָב
  choice: योआब
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी ध्वन्यंतरण; सूची में संयोजक अंतिम नाम से पहले रखा गया है।
- source_word: וַעֲשָׂהאֵל
  choice: और असाहेल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी ध्वन्यंतरण और सूची के अंतिम पद में संयोजक का स्वाभाविक प्रयोग।
- source_word: שְׁלֹשָׁה
  choice: कुल तीन
  rationale: मूल में दिए गए सारात्मक अंक को छोड़ा नहीं गया; ‘कुल’ हिन्दी में उसकी गणनात्मक भूमिका स्पष्ट करता है।
