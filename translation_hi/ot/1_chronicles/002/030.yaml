source:
  edition: WLC
  text: וּ/בְנֵ֥י נָדָ֖ב סֶ֣לֶד וְ/אַפָּ֑יִם וַ/יָּ֥מָת סֶ֖לֶד לֹ֥א בָנִֽים׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/030.yaml
  text: 'The sons of Nadab: Seled and Appaim[a]. Seled died without sons.'
translation:
  language: hi
  text: नादाब के पुत्र सेलेद और अप्पैम थे। सेलेद बिना पुत्र के मर गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेलेद मर गया और उसके कोई पुत्र नहीं थे।”
    reason: इब्रानी के संक्षिप्त לֹא בָנִים को परिस्थिति-सूचक ‘बिना पुत्र के’ अथवा स्वतंत्र कथन ‘उसके कोई पुत्र नहीं थे’—दोनों प्रकार से स्वाभाविक रूप में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וּבְנֵי
  choice: के पुत्र
  rationale: בְּנֵי का रचनात्मक बहुवचन वंशावली में पुत्रों का परिचय देता है। आरम्भिक וּ को हिन्दी में अलग से ‘और’ कहना आवश्यक नहीं, क्योंकि इससे वाक्य अस्वाभाविक लगेगा।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: סֶלֶד
  choice: सेलेद
  rationale: व्यक्तिवाचक नाम को दोनों स्थानों पर एक ही रूप में लिप्यंतरित किया गया है।
- source_word: וְאַפָּיִם
  choice: और अप्पैम
  rationale: वंशावली के प्रसंग में यह व्यक्तिवाचक नाम है; इसलिए इसका अर्थ ‘नथुने/मुख’ न करके लिप्यंतरण किया गया है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מוּת के इस कथात्मक रूप का स्वाभाविक हिन्दी भूतकाल; पूर्वसर्गीय וַ का घटनाक्रम हिन्दी वाक्य-विन्यास से स्पष्ट है।
- source_word: לֹא בָנִים
  choice: बिना पुत्र के
  rationale: इब्रानी में शाब्दिक रूप से ‘पुत्र नहीं’ है। ‘बिना पुत्र के’ स्वाभाविक हिन्दी है और ‘सन्तानहीन’ की अपेक्षा मूल के ‘पुत्र’ को अधिक ठीक रूप से सुरक्षित रखता है।
