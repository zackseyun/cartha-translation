base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/027.yaml
  text: 'The sons of Ram: Jerahmeel the firstborn[a], Maaz, Jamin, and Eker.'
translation:
  language: hi
  text: 'राम के पुत्र ये थे: उसका पहला पुत्र यरहमेल, माअस, यामीन और एकेर।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: 'थे:'
  rationale: यह क्रिया वंशावली की सूची आरम्भ करती है। हिंदी में ‘राम के पुत्र थे:’ मूल के अस्तित्व-सूचक भाव को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: इस वंशावली में पुरुष संतानों के नाम दिए गए हैं, इसलिए ‘पुत्र’ सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: רָם
  choice: राम
  rationale: इब्रानी व्यक्तिगत नाम का हिंदी बाइबलीय लिप्यंतरण।
- source_word: בְּכוֹר
  choice: उसका पहलौठा
  rationale: यह पद यरहमेल को राम के पहलौठे के रूप में पहचानता है। हिंदी में संबंध स्पष्ट करने के लिए ‘उसका’ जोड़ा गया है।
- source_word: יְרַחְמְאֵל
  choice: यरहमेल
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: מַעַץ
  choice: माअस
  rationale: नाम में उपस्थित इब्रानी अयिन को स्वर-विच्छेद द्वारा दर्शाने वाला निकट लिप्यंतरण।
- source_word: יָמִין
  choice: यामीन
  rationale: यहाँ शब्द व्यक्तिगत नाम है; अतः इसके शाब्दिक अर्थ के बजाय लिप्यंतरण किया गया है।
- source_word: עֵקֶר
  choice: एकेर
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
