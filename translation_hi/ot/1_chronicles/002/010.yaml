lexical_decisions:
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली में हिफ़ील रूप पुरुष से अगली पीढ़ी के जन्म को बताता है। हिंदी का यह मुहावरा स्वाभाविक और गरिमापूर्ण है तथा बार-बार आने वाले ‘जन्म दिया’ की संभावित अस्वाभाविकता से बचता है।
- source_word: נְשִׂיא
  choice: प्रधान
  rationale: यह शब्द समुदाय या गोत्र में मान्य नेतृत्व-पद को दर्शाता है। ‘प्रधान’ आधुनिक हिंदी में स्पष्ट है और ‘राजकुमार’ जैसे अनावश्यक राजवंशीय अर्थ से बचता है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: शाब्दिक अर्थ ‘यहूदा के पुत्र’ है, पर इस गोत्रीय संदर्भ में आशय यहूदा से निकले समुदाय से है। ‘वंशजों’ मूल की वंशगत धारणा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: רָם / עַמִּינָדָב / נַחְשׁוֹן
  choice: राम / अम्मीनादाब / नहशोन
  rationale: व्यक्तिगत नामों का अनुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
