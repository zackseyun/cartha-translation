  yaml_path: translation/ot/1_chronicles/002/004.yaml
  text: Tamar[a], his daughter-in-law, bore Perez and Zerah to him[b]. All the sons of Judah were five.
translation:
  language: hi
  text: और उसकी बहू तामार ने उसके पेरेस और जेरह को जन्म दिया। यहूदा के सभी पुत्र कुल पाँच थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָמָר
  choice: तामार
  rationale: व्यक्तिवाचक नाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: כַּלָּתוֹ
  choice: उसकी बहू
  rationale: כַּלָּה पर तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय है; प्रसंग में इसका स्वाभाविक हिन्दी संबंधवाची रूप ‘उसकी बहू’ है।
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: ילד का स्त्रीलिंग पूर्ण रूप प्रसव को व्यक्त करता है; आधुनिक हिन्दी में ‘जन्म दिया’ स्वाभाविक और स्पष्ट है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: לְ के साथ सर्वनामिक प्रत्यय यहूदा से संबंध दर्शाता है; ‘उसके लिए’ मूल संरचना को बनाए रखता है, यद्यपि हिन्दी में इसे छोड़ा भी जा सकता था।
- source_word: פֶּרֶץ
  choice: पेरेस
  rationale: नाम का हिन्दी बाइबलीय परंपरा और इब्रानी ध्वनि के अनुरूप लिप्यंतरण।
- source_word: זָרַח
  choice: जेरह
  rationale: नाम के आरंभिक ז और अंतिम ח को हिन्दी पाठकों के लिए प्रचलित और सुबोध रूप में लिप्यंतरित किया गया है।
- source_word: כָּל בְּנֵי יְהוּדָה
  choice: यहूदा के सभी पुत्र
  rationale: בְּנֵי का लिंग-विशिष्ट अर्थ ‘पुत्र’ रखा गया है और संबंधसूचक रचना स्वाभाविक हिन्दी में दी गई है।
- source_word: חֲמִשָּׁה
  choice: कुल पाँच
  rationale: संख्या पाँच है; ‘कुल’ अंतिम उपवाक्य के सारांशात्मक कार्य को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: पेरेस और जेरह के उल्लेख के बाद वंशावली का कुल योग
  choice: यहूदा के सभी पुत्र कुल पाँच थे।
  alternative: ये यहूदा के सभी पुत्र थे—कुल पाँच।
  rationale: इब्रानी एक सीधा सारांशात्मक कथन देता है। चुना गया रूप पाँच पुत्रों की कुल संख्या को बनाए रखते हुए अनावश्यक व्याख्या नहीं जोड़ता।
- issue: लिंग-विशिष्ट संबंध और वंशावली शब्दावली
  choice: ‘बहू’ और ‘पुत्र’ को बनाए रखा गया।
  alternative: ‘विवाह-संबंधी’ और ‘संतान’
  rationale: मूल पाठ विशिष्ट संबंध और पुरुष संतानों का उल्लेख करता है; तटस्थ शब्द अर्थ को अनावश्यक रूप से व्यापक कर देते।
translation_notes:
  register: शैली आधुनिक, गरिमापूर्ण और वंशावली-संगत रखी गई है। वाक्यरचना सहज हिन्दी में है, पर मूल का संबंधसूचक ‘उसके लिए’ और अंतिम कुल-गणना दोनों सुरक्षित हैं।
