id: 1CH.2.23
reference: 1 Chronicles 2:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֣ח גְּשֽׁוּר וַ֠/אֲרָם אֶת חַוֺּ֨ת יָאִ֧יר מֵ/אִתָּ֛/ם אֶת קְנָ֥ת וְ/אֶת בְּנֹתֶ֖י/הָ שִׁשִּׁ֣ים עִ֑יר כָּל אֵ֕לֶּה בְּנֵ֖י מָכִ֥יר אֲבִי גִלְעָֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/023.yaml
  text: But Geshur and Aram took the villages of Jair from them[a], along with Kenath and its daughter towns—sixty cities. All these were the sons of Machir[c][b], the father of Gilead.
translation:
  language: hi
  text: परन्तु गशूर और अराम ने उनसे याईर के गाँव[a], और कनात तथा उसके अधीन गाँव[b]—कुल साठ नगर—ले लिए। ये सभी माकीर के पुत्र[c] थे; माकीर गिलाद का पिता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हव्वोत-याईर”; यह स्थान-नाम है, जिसका अर्थ “याईर के तंबू-गाँव” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसकी बेटियाँ”; अर्थात कनात के आसपास की उस पर निर्भर बस्तियाँ।
    reason: cultural_note
  - marker: c
    text: “माकीर के पुत्र” से उसके वंशज या कुल के सदस्य भी अभिप्रेत हो सकते हैं, केवल उसके सगे पुत्र नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले लिए
  rationale: यह क्षेत्र और बस्तियाँ अपने अधिकार में लेने को व्यक्त करता है, पर युद्ध द्वारा विजय पाने का भाव अनावश्यक रूप से नहीं जोड़ता। संयुक्त कर्ता के साथ हिब्रू का एकवचन क्रिया-रूप मुहावरेदार है।
- source_word: גְּשׁוּר וַאֲרָם
  choice: गशूर और अराम
  rationale: दोनों नामों को हिब्रू के निकट लिप्यंतरित किया गया है; 'अराम' मूल नाम को आधुनिक 'सीरिया' से अधिक सीधे सुरक्षित रखता है।
- source_word: חַוֺּת יָאִיר
  choice: याईर के गाँव
  rationale: यह स्थान-नाम भी हो सकता है, पर इसका शाब्दिक अर्थ पारदर्शी है। सहज हिन्दी के लिए अर्थानुवाद किया गया और स्थान-नाम का विकल्प पादटिप्पणी में रखा गया है।
- source_word: מֵאִתָּם
  choice: उनसे
  rationale: यह पहले उल्लिखित लोगों के अधिकार से इन स्थानों के ले लिए जाने को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: קְנָת
  choice: कनात
  rationale: स्थान-नाम का हिब्रू-आधारित हिन्दी लिप्यंतरण।
- source_word: בְּנֹתֶיהָ
  choice: उसके अधीन गाँव
  rationale: शाब्दिक रूप 'उसकी बेटियाँ' मुख्य नगर पर निर्भर आसपास की बस्तियों के लिए मुहावरा है। हिन्दी में अर्थ स्पष्ट करने के लिए 'अधीन गाँव' चुना गया है और मूल रूप पादटिप्पणी में बताया गया है।
- source_word: שִׁשִּׁים עִיר
  choice: कुल साठ नगर
  rationale: עִיר का सामान्य अर्थ नगर/शहर है। 'कुल' जोड़ने से पूर्ववर्ती कनात और उसकी आश्रित बस्तियों की कुल संख्या स्वाभाविक हिन्दी में स्पष्ट होती है।
- source_word: כָּל אֵלֶּה
  choice: ये सभी
  rationale: मूल में संकेत का संदर्भ कुछ अस्पष्ट है। यह अभिव्यक्ति उस अस्पष्टता को बनाए रखती है और अगली वंशावलीगत उक्ति से स्वाभाविक रूप से जुड़ती है।
- source_word: בְּנֵי מָכִיר
  choice: माकीर के पुत्र
  rationale: मूल पदबंध को सीधे सुरक्षित रखा गया है। वंशावली में 'पुत्र' दूर के वंशजों या कुल-सदस्यों को भी सूचित कर सकता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: אֲבִי גִלְעָד
  choice: माकीर गिलाद का पिता था
  rationale: हिब्रू के 'गिलाद का पिता' को स्पष्ट हिन्दी वाक्य में रखा गया है, बिना यह तय किए कि 'पिता' यहाँ निकट जनक है, पूर्वज है या कुल-प्रमुख।
theological_decisions:
- issue: כָּל אֵלֶּה בְּנֵי מָכִיר का संदर्भ
  choice: इसे वंशावलीगत कथन के रूप में 'ये सभी माकीर के पुत्र थे' रखा गया।
  alternative: '''ये सभी स्थान माकीर के पुत्रों के थे'' या ''ये सभी माकीर के वंशज थे।'''
  rationale: हिब्रू में संबंधसूचक या अधिकारसूचक शब्द स्पष्टतः नहीं है। सीधा व्याकरण वंशावलीगत कथन का समर्थन करता है, जबकि 'पुत्र' की व्यापक कुलगत अर्थ-सीमा पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण गद्य अपनाया गया है। स्थान-नाम हिब्रू के निकट रखे गए हैं। 'परन्तु' पूर्ववर्ती प्रसंग के साथ विरोधसूचक संबंध बनाए रखता है। मूल की वंशावलीगत अस्पष्टता को मुख्य पाठ और पादटिप्पणियों में सुरक्षित रखा गया है।
