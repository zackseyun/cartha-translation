- source_word: שַׂלְמָא
  choice: सलमा
  rationale: व्यक्तिवाचक नाम का हिब्रू रूपानुसार देवनागरी लिप्यंतरण किया गया है।
- source_word: אֲבִי
  choice: का पिता
  rationale: यह हिब्रू अभिव्यक्ति को पारदर्शी रूप से सुरक्षित रखता है; वंशावली के संदर्भ में इसका अर्थ पूर्वज, कुल-प्रमुख या किसी बस्ती का संस्थापक भी हो सकता है।
- source_word: בֵית לָחֶם
  choice: बेतलेहेम
  rationale: इस प्रसिद्ध स्थान-नाम का प्रचलित आधुनिक हिन्दी बाइबलीय रूप अपनाया गया है।
- source_word: חָרֵף
  choice: हारेफ़
  rationale: मसोरा-पाठ के स्वरांकन חָרֵף के निकट देवनागरी लिप्यंतरण; नाम का अनुवाद नहीं किया गया।
- source_word: בֵית גָּדֵר
  choice: बेत-गेदेर
  rationale: इसे संभावित स्थान-नाम मानकर उसके בֵית + नाम वाले रूप को लिप्यंतरित किया गया है, न कि शाब्दिक रूप से ‘गेदेर का घर’ कहा गया है।
