  text: וַ/יִּתֵּ֨ן שֵׁשָׁ֧ן אֶת בִּתּ֛/וֹ לְ/יַרְחָ֥ע עַבְדּ֖/וֹ לְ/אִשָּׁ֑ה וַ/תֵּ֥לֶד ל֖/וֹ אֶת עַתָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/035.yaml
  text: Sheshan gave his daughter to Jarha his servant as a wife[a], and she bore Attai to him.
translation:
  language: hi
  text: शेशान ने अपनी बेटी का विवाह अपने दास यर्हा से कर दिया[a], और उसने उसके लिए अत्तै को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने सेवक यर्हा से।” इब्रानी शब्द עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ दोनों हो सकता है। यहाँ ‘दास’ यर्हा की शेशान के घराने में अधीन स्थिति को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן ... לְאִשָּׁה
  choice: विवाह ... कर दिया
  rationale: शाब्दिक अर्थ ‘पत्नी के रूप में दिया’ है; आधुनिक स्वाभाविक हिन्दी में वैवाहिक आशय स्पष्ट करने के लिए ‘विवाह कर दिया’ उपयुक्त है।
- source_word: שֵׁשָׁן
  choice: शेशान
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
- source_word: בִּתּוֹ
  choice: अपनी बेटी
  rationale: तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय सहित ‘उसकी बेटी’; हिन्दी में कर्ता शेशान की ओर लौटने के कारण ‘अपनी बेटी’ स्वाभाविक है।
- source_word: יַרְחָע
  choice: यर्हा
  rationale: इब्रानी व्यक्तिवाचक नाम का निकट देवनागरी लिप्यंतरण।
- source_word: עַבְדּוֹ
  choice: अपने दास
  rationale: עֶבֶד सेवक अथवा दास दोनों को सूचित कर सकता है; घराने में यर्हा की अधीन और आश्रित सामाजिक स्थिति को बनाए रखने के लिए मुख्य पाठ में ‘दास’ चुना गया है।
- source_word: וַתֵּלֶד
  choice: जन्म दिया
  rationale: स्त्रीलिंग कर्ता के साथ ילד का अर्थ ‘उसने जन्म दिया’ है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: לְ प्रत्यय जन्म-वृत्तांत में पिता से संबंध दर्शाता है; ‘उसके लिए’ मूल संरचना को बनाए रखता है, यद्यपि हिन्दी में इसे छोड़ा भी जा सकता था।
- source_word: עַתָּי
  choice: अत्तै
  rationale: इब्रानी व्यक्तिवाचक नाम का देवनागरी लिप्यंतरण।
theological_decisions:
- issue: עֶבֶד में सेवक और दास के बीच अर्थगत व्यापकता
  choice: मुख्य पाठ में ‘दास’
  alternative: ‘सेवक’
  rationale: वर्णन में यर्हा का शेशान के घराने के भीतर अधीन दर्जा कथात्मक रूप से महत्त्वपूर्ण है; फिर भी मूल शब्द की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त वंशावली-शैली रखी गई है। ‘अपनी बेटी का विवाह ... से कर दिया’ हिन्दी में स्वाभाविक है और मूल के वैवाहिक वाक्यांश का अर्थ स्पष्ट करता है।
