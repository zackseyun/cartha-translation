    reason: textual_variant
lexical_decisions:
- source_word: יָלְדָה
  choice: जन्म दिया
  rationale: स्त्री कर्ता के साथ काल रूप यहाँ संतान को जन्म देने का अर्थ रखता है; यह आधुनिक हिन्दी में स्वाभाविक और वंशावली के प्रसंग में स्पष्ट है।
- source_word: אֶת עֲמָשָׂא
  choice: अमासा को
  rationale: אֶת निश्चित प्रत्यक्ष कर्म का चिह्न है; हिन्दी में उसका अर्थ ‘को’ से स्वाभाविक रूप से व्यक्त होता है। नाम को ‘अमासा’ रूप में लिप्यंतरित किया गया है।
- source_word: וַאֲבִי עֲמָשָׂא
  choice: और अमासा का पिता
  rationale: रचनात्मक संबंध ‘अमासा का पिता’ के रूप में स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: יֶתֶר
  choice: येतेर
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: הַיִּשְׁמְעֵאלִי
  choice: इश्माएली
  rationale: यह निश्चित जातिवाचक पहचान है; हिन्दी में विधेय के रूप में ‘इश्माएली’ स्वाभाविक है और इब्रानी पहचान को बनाए रखता है।
