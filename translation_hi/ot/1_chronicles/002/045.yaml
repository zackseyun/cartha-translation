  text: And the son of Shammai was Maon[a], and Maon was the father of Beth-zur.
translation:
  language: hi
  text: और शम्मै का पुत्र माओन था, और माओन बेत-सूर का पिता[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बेत-सूर का पूर्वज/संस्थापक।” वंशावलियों में “पिता” किसी कुल या बस्ती के संस्थापक अथवा प्रमुख पूर्वज को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/בֶן
  choice: और ... का पुत्र
  rationale: वाव वंशावली की पिछली कड़ी से संबंध जोड़ता है; בֶן को उसके सामान्य वंशावली अर्थ में ‘पुत्र’ रखा गया है।
- source_word: שַׁמַּי
  choice: शम्मै
  rationale: व्यक्तिवाचक इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: מָעוֹן
  choice: माओन
  rationale: यहाँ वाक्य-विन्यास इसे वंशावली में आए व्यक्ति के नाम के रूप में प्रस्तुत करता है; इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: וּ/מָעוֹן
  choice: और माओन
  rationale: इब्रानी वंशावली की पुनरावृत्त संरचना को स्वाभाविक हिन्दी में बनाए रखा गया है।
- source_word: אֲבִי
  choice: का पिता था
  rationale: मूल वंशावली पद का सीधा और परिचित हिन्दी रूप; इसके व्यापक अर्थ—पूर्वज या संस्थापक—की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: בֵית צֽוּר
  choice: बेत-सूर
  rationale: स्थान अथवा कुल के संयुक्त व्यक्तिवाचक नाम के रूप में देवनागरी लिप्यंतरण; इसे शाब्दिक ‘सूर का घर’ नहीं किया गया।
