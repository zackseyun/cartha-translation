lexical_decisions:
- source_word: אֶלְעָשָׂה
  choice: एलआसा
  rationale: इब्रानी व्यक्तिनाम का देवनागरी लिप्यंतरण; हिंदी बाइबल परंपरा में प्रचलित रूप के निकट।
- source_word: הֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में हिफ़ील रूप का अर्थ संतान उत्पन्न करना या पिता होना है। हिंदी में यह रचना स्वाभाविक, संक्षिप्त और गरिमापूर्ण है तथा अनावश्यक रूप से केवल तत्काल जैविक पितृत्व पर ज़ोर नहीं देती।
- source_word: אֶת
  choice: अलग से अनूदित नहीं
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है; हिंदी में इसका कोई स्वतंत्र शब्दगत समतुल्य आवश्यक नहीं।
- source_word: סִסְמָי
  choice: सिस्मै
  rationale: इब्रानी व्यक्तिनाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: दो वंशावली कथनों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: שַׁלּוּם
  choice: शल्लूम
  rationale: इब्रानी व्यक्तिनाम का ध्वन्यात्मक देवनागरी लिप्यंतरण; व्यंजन के द्वित्व और दीर्घ स्वर को दर्शाता है।
