lexical_decisions:
- source_word: וּבְנֵי חֶצְרוֹן
  choice: हेस्रोन के जो पुत्र
  rationale: בְנֵי का स्वाभाविक वंशावलीगत अर्थ ‘पुत्र’ है। आरम्भिक וּ को अलग से ‘और’ कहने के बजाय हिन्दी वाक्य-रचना में समाहित किया गया है। חֶצְרוֹן का लिप्यंतरण ‘हेस्रोन’ रखा गया है।
- source_word: אֲשֶׁר נוֹלַד לוֹ
  choice: उत्पन्न हुए
  rationale: निफ़अल रूप की निष्क्रिय भाव-छाया को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक बहुवचन प्रयोग किया गया है; प्रसंग से स्पष्ट है कि ये हेस्रोन के पुत्र थे।
- source_word: יְרַחְמְאֵל
  choice: यरहमेल
  rationale: इब्रानी व्यक्ति-नाम का देवनागरी लिप्यंतरण।
- source_word: רָם
  choice: राम
  rationale: इब्रानी व्यक्ति-नाम का प्रचलित देवनागरी लिप्यंतरण; यहाँ यह व्यक्ति-नाम है।
- source_word: כְּלוּבָי
  choice: कलूबै
  rationale: मसोरेटिक पाठ में दिए गए नाम כְּלוּבָי का सीधा लिप्यंतरण किया गया है; इसे मुख्य पाठ में अधिक परिचित ‘कालेब’ से नहीं मिलाया गया।
- source_word: אֶת
  choice: —
  rationale: यह निश्चित कर्म-सूचक चिह्न है, जिसका हिन्दी में अलग शब्द द्वारा अनुवाद आवश्यक नहीं है।
