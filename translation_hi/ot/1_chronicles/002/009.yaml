  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वंशावली की संक्षिप्त सूची-शैली बनाए रखने के लिए ‘वे थे:’ का प्रयोग किया गया है। पादटिप्पणी का चिह्न उसी नाम ‘कलूबै’ के बाद लगाया गया है जिससे उसका आशय संबंधित है।
