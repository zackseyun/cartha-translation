- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है; हिन्दी में इसकी भूमिका वाक्य-विन्यास से व्यक्त होती है।
- source_word: יֵהוּא
  choice: येहू
  rationale: व्यक्तिवाचक नाम का स्रोत-आधारित हिन्दी लिप्यंतरण।
- source_word: וְ
  choice: और
  rationale: दो समान वंशावली खंडों को जोड़ने वाला सामान्य समुच्चयबोधक।
- source_word: עֲזַרְיָה
  choice: अजर्याह
  rationale: व्यक्तिवाचक नाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
