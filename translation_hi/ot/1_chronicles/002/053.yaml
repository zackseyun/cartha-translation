base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/053.yaml
  text: 'And the clans of Kiriath-jearim: the Ithrites[a], the Puthites, the Shumathites, and the Mishraites[b]. From these came the Zorathites and the Eshtaolites.'
translation:
  language: hi
  text: 'और किर्यत-यारीम के कुल ये थे: यित्री[a], पूती, शुमाती और मिश्राई। इनसे सोराती और एश्ताउली निकले[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कुल’ के लिए आया इब्रानी शब्द विस्तृत परिवारों या वंशगत समूहों के लिए भी प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘बाहर निकले’; यहाँ वंशावली के प्रसंग में आशय है कि इन समुदायों की उत्पत्ति पहले बताए गए कुलों से हुई।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשְׁפְּחוֹת
  choice: और ... के कुल ये थे
  rationale: वंशावली के प्रसंग में מִשְׁפָּחוֹת विस्तृत पारिवारिक या वंशगत समूहों को दर्शाता है; आधुनिक हिन्दी में ‘कुल’ संक्षिप्त, स्वाभाविक और सामाजिक अर्थ के अनुरूप है।
- source_word: קִרְיַת יְעָרִים
  choice: किर्यत-यारीम
  rationale: स्थान-नाम का अनुवाद करने के बजाय इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: הַיִּתְרִי
  choice: यित्री
  rationale: यह कुल अथवा स्थान से संबंधित समुदाय-सूचक नाम है; इब्रानी रूप के निकट लिप्यंतरण रखा गया है।
- source_word: וְהַפּוּתִי
  choice: पूती
  rationale: समुदाय-सूचक नाम को इब्रानी स्वरूप के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְהַשֻּׁמָתִי
  choice: शुमाती
  rationale: कुल-नाम की विशिष्ट पहचान बनाए रखने के लिए लिप्यंतरण किया गया है।
- source_word: וְהַמִּשְׁרָעִי
  choice: मिश्राई
  rationale: इब्रानी समुदाय-सूचक रूप को यथासंभव निकटता से देवनागरी में दर्शाया गया है।
- source_word: מֵאֵלֶּה
  choice: इन्हीं में से
  rationale: यह पद पहले बताए गए कुलों की ओर संकेत करता है; ‘इन्हीं में से’ उस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יָצְאוּ
  choice: निकले
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘बाहर निकले’ है। वंशावली में यह उत्पत्ति या किसी समूह के उद्भव को दर्शाती है; ‘निकले’ मूल रूपक और उसकी संभावित व्यापकता दोनों को बचाए रखता है।
- source_word: הַצָּרְעָתִי
  choice: सोराई
  rationale: यह सोरा से जुड़ा समुदाय-सूचक नाम है; हिन्दी में स्थान-नाम से संबंध को दर्शाने वाला स्वाभाविक लिप्यंतरण चुना गया है।
- source_word: וְהָאֶשְׁתָּאֻלִי
  choice: एश्ताओली
  rationale: एश्ताओल से जुड़े समुदाय का नाम होने के कारण इसे लिप्यंतरित किया गया है।
