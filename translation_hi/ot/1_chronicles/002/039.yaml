lexical_decisions:
- source_word: וַעֲזַרְיָה
  choice: अजर्याह
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है; आरंभिक वाव का संबंध वंशावली के पिछले कथन से है और अलग से ‘और’ लगाने पर हिंदी में पद अस्वाभाविक लगेगा।
- source_word: הֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में संतान उत्पन्न करने का संबंध बताता है। हिंदी में यह प्रयोग संक्षिप्त और स्वाभाविक है तथा ‘जन्म दिया’ से पैदा हो सकने वाली मातृ-संबंधी अस्पष्टता से बचता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का सूचक है; हिंदी में इसका स्वतंत्र शब्दगत समतुल्य आवश्यक नहीं है।
- source_word: חָלֶץ / וְחֶלֶץ
  choice: हेलेस / और हेलेस
  rationale: एक ही व्यक्तिवाचक नाम को दोनों स्थानों पर समान रूप से लिप्यंतरित किया गया है; दूसरे स्थान का वाव ‘और’ से व्यक्त किया गया है।
- source_word: אֶלְעָשָׂה
  choice: एलासा
  rationale: व्यक्तिवाचक नाम का सरल, पठनीय हिंदी लिप्यंतरण; हिब्रू स्वर-विन्यास को अधिक स्पष्ट करने वाला ‘एलेआसा’ भी संभव है, इसलिए उसे पादटिप्पणी में दिया गया है।
