translation:
  language: hi
  text: उसने मदमन्ना के पिता शाअफ़ को और मकबेना के पिता तथा गिबआ के पिता शवा को जन्म दिया। कालेब की बेटी अकसा थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֵּלֶד
  choice: उसने ... को जन्म दिया
  rationale: क्रिया स्त्रीलिंग एकवचन है और पिछले पद की स्त्री को कर्ता मानती है; हिन्दी में सर्वनाम रखकर मूल की संदर्भ-निर्भरता सुरक्षित की गई है।
- source_word: שַׁעַף
  choice: शाअफ़
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण।
- source_word: אֲבִי
  choice: के पिता
  rationale: वंशावली की ‘पिता’ वाली भाषा को औपचारिक रूप से बनाए रखा गया है; यहाँ इसका अर्थ पूर्वज या किसी बस्ती का संस्थापक भी हो सकता है, पर पाठ में उसे सीमित नहीं किया गया।
- source_word: מַדְמַנָּה
  choice: मदमन्ना
  rationale: स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: שְׁוָא
  choice: शवा
  rationale: व्यक्तिनाम का निकट देवनागरी लिप्यंतरण; इसे शाअफ़ के साथ मिलाकर एक ही व्यक्ति नहीं बनाया गया।
- source_word: מַכְבֵּנָה
  choice: मकबेना
  rationale: स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: גִבְעָא
  choice: गिबआ
  rationale: स्थान-नाम का निकट देवनागरी लिप्यंतरण।
- source_word: עַכְסָה
  choice: अकसा
  rationale: इब्रानी व्यक्तिनाम का सरल और निकट हिन्दी लिप्यंतरण।
