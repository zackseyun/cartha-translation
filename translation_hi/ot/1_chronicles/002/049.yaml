  register: 'आधुनिक, सहज और गरिमापूर्ण हिन्दी। मूल इब्रानी की दो समानांतर कर्म-संरचनाएँ स्पष्ट रखी गई हैं: शाअफ़ मदमन्ना का पिता है, जबकि शवा मकबेना और गिबआ का पिता है। अंग्रेज़ी परामर्श-पाठ में छूटी हुई ‘मदमन्ना के पिता शाअफ़’ वाली सामग्री मूल स्रोत के आधार पर बहाल की गई है।'
