  text: בְּנֵ֣י יְהוּדָ֗ה עֵ֤ר וְ/אוֹנָן֙ וְ/שֵׁלָ֔ה שְׁלוֹשָׁה֙ נ֣וֹלַד ל֔/וֹ מִ/בַּת שׁ֖וּעַ הַֽ/כְּנַעֲנִ֑ית וַ/יְהִ֞י עֵ֣ר בְּכ֣וֹר יְהוּדָ֗ה רַ֛ע בְּ/עֵינֵ֥י יְהוָ֖ה וַ/יְמִיתֵֽ/הוּ־׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/003.yaml
  text: 'The sons of Judah: Er[a], Onan, and Shelah; three were born to him by Bath-shua the Canaanite. Er, Judah’s firstborn, was evil in the sight of Yahweh[b], and he put him to death.'
translation:
  language: hi
  text: यहूदा के पुत्र एर, ओनान और शेला थे। उसके कनानी शूआ की बेटी[a] से ये तीनों पुत्र हुए। यहूदा का पहलौठा एर याहवे की दृष्टि में बुरा था, और याहवे ने उसे मार डाला[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का शाब्दिक अर्थ “शूआ की बेटी, कनानी स्त्री” है; कुछ लोग यहाँ “बत-शूआ” को स्त्री का व्यक्तिगत नाम मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू में इस क्रिया का कर्ता स्पष्ट रूप से दोहराया नहीं गया है; संदर्भ में वह सबसे स्वाभाविक रूप से याहवे है। यह भी अनुवाद किया जा सकता है: “और उसने उसे मार डाला।”'
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के पुत्र
  rationale: वंशावली की रचना को सहज और औपचारिक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁלוֹשָׁה נוֹלַד לוֹ
  choice: ये तीनों उसे ... से उत्पन्न हुए थे
  rationale: तीनों नामित पुत्रों की स्पष्ट संख्या और ילד के निफ़अल रूप की निष्क्रिय अर्थ-छाया को बनाए रखता है।
- source_word: מִבַּת שׁוּעַ הַכְּנַעֲנִית
  choice: कनानी स्त्री, शूआ की बेटी, से
  rationale: व्यंजन-पाठ का स्वाभाविक अर्थ ‘कनानी स्त्री, शूआ की बेटी’ है; ‘बत-शूआ’ को नाम मानने की संभावना पाद-टिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּכוֹר יְהוּדָה
  choice: यहूदा का पहलौठा
  rationale: वंशावली में ज्येष्ठ पुत्र की स्थिति को दर्शाने वाला प्रचलित बाइबलीय हिन्दी पद है।
- source_word: רַע בְּעֵינֵי יְהוָה
  choice: याहवे की दृष्टि में बुरा था
  rationale: ईश्वरीय मूल्यांकन के हिब्रू मुहावरे को स्वाभाविक हिन्दी में रखते हुए उसके रूपक को भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: וַיְמִיתֵהוּ
  choice: याहवे ने उसे मार डाला
  rationale: हिफ़ईल क्रिया का कारक अर्थ व्यक्त करता है। हिन्दी में संदिग्ध सर्वनाम से एर को कर्ता समझे जाने का जोखिम होने के कारण संदर्भ से निहित कर्ता को स्पष्ट किया गया है।
theological_decisions:
- issue: וַיְמִיתֵהוּ का अप्रकट कर्ता
  choice: याहवे ने उसे मार डाला
  alternative: उसने उसे मार डाला
  rationale: हिब्रू में कर्ता व्यक्त नहीं है, पर पिछले उपवाक्य में आए याहवे की ओर उसका संदर्भ सबसे स्वाभाविक है। हिन्दी में केवल ‘उसने’ लिखने पर उसका संदर्भ एर की ओर समझा जा सकता है, इसलिए मुख्य पाठ में याहवे को स्पष्ट किया गया और मूल की व्याकरणिक अंतर्निहितता पाद-टिप्पणी में बताई गई।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिगत ईश्वरीय नाम को नाम के रूप में बनाए रखता है; उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वंशावली का संक्षिप्त स्वर बना रहता है। ‘पहलौठा’ बाइबलीय हिन्दी में परिचित है, जबकि शेष वाक्यरचना वर्तमान मानक हिन्दी के अनुरूप है।
