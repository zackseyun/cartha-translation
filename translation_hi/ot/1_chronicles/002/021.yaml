  yaml_path: translation/ot/1_chronicles/002/021.yaml
  text: Afterward Hezron went in to the daughter of Machir the father of Gilead[a], and he took her when he was sixty years old[c][b], and she bore Segub to him.
translation:
  language: hi
  text: इसके बाद हेस्रोन माकीर की बेटी के पास गया[a]। माकीर गिलाद का पिता[b] था। हेस्रोन ने उस स्त्री से विवाह किया[c]; उस समय वह साठ वर्ष का था। उस स्त्री ने उसके लिए सगूब को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अनुवाद ‘उसके पास आया’ भी हो सकता है; किसी स्त्री के पास ‘जाना/आना’ वैवाहिक या यौन सम्बन्ध के लिए प्रयुक्त संयत अभिव्यक्ति हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: वंशावली के सन्दर्भ में ‘पिता’ का अर्थ निकट पिता के साथ-साथ पूर्वज या किसी कुल अथवा क्षेत्र का मूल पुरुष भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘उसे लिया’; इसका अर्थ ‘उससे विवाह किया’ या ‘उसे पत्नी के रूप में लिया’ भी हो सकता है।
    reason: lexical_alternative
