  rationale: यहाँ इब्रानी पाठ में नाम का छोटा रूप אֶפְרָת है; इसलिए संबंधित विस्तृत रूप ‘एप्राता’ के बजाय ‘एप्रात’ रखा गया है।
- source_word: וַתֵּלֶד לוֹ
  choice: उसने उसके लिए ... को जन्म दिया
  rationale: ילד प्रसव को और לוֹ अप्रत्यक्ष संबंध ‘उसके लिए’ को व्यक्त करता है; हिन्दी में अर्थ को स्पष्ट रखते हुए दोनों तत्व सुरक्षित हैं।
- source_word: חוּר
