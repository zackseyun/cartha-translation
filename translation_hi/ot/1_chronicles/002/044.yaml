  choice: मुख्य पाठ में शाब्दिक ‘पिता’
  alternative: योरकोआम का संस्थापक/पूर्वज
  rationale: אָבִי किसी व्यक्ति का पिता बता सकता है, पर वंशावलियों में किसी कुल या बस्ती के संस्थापक अथवा पूर्वज का संकेत भी दे सकता है। मूल की अस्पष्टता को मुख्य पाठ और पादटिप्पणी के मेल से बनाए रखा गया है।
