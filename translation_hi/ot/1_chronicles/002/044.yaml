    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली के संदर्भ में हिफ़ील रूप संतान उत्पन्न करने को व्यक्त करता है। हिंदी में यह रचना संक्षिप्त, स्वाभाविक और गरिमापूर्ण है तथा ‘जन्म दिया’ से बचती है, जो सामान्यतः माता के लिए प्रयुक्त होता है।
- source_word: אֲבִי
  choice: का पिता
  rationale: मूल इब्रानी की संबंधवाचक अभिव्यक्ति को सीधे सुरक्षित रखता है; वंश या बस्ती के संस्थापक/पूर्वज का संभावित अर्थ पादटिप्पणी में दिया गया है।
- source_word: יָרְקֳעָם
  choice: योरकोआम
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण; यह व्यक्ति, कुल अथवा स्थान का नाम हो सकता है।
- source_word: שֶׁמַע
  choice: शेमा
  rationale: व्यक्तिवाचक नाम का इब्रानी के निकट लिप्यंतरण।
- source_word: רַחַם
  choice: रहम
  rationale: व्यक्तिवाचक नाम का इब्रानी के निकट लिप्यंतरण।
- source_word: רֶקֶם
  choice: रेकेम
  rationale: व्यक्तिवाचक नाम का इब्रानी के निकट लिप्यंतरण।
- source_word: שַׁמָּי
  choice: शम्मै
  rationale: व्यक्तिवाचक नाम का इब्रानी के निकट लिप्यंतरण; द्वित्व व्यंजन को ‘म्म’ से और अंतिम द्विस्वर को ‘ऐ’ से दर्शाया गया है।
