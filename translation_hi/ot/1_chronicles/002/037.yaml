lexical_decisions:
- source_word: זָבָד
  choice: ज़ाबाद
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: הוֹלִיד
  choice: से ... उत्पन्न हुआ
  rationale: वंशावली में हिफ़ील रूप पिता द्वारा संतान उत्पन्न किए जाने का बोध कराता है। हिंदी की स्वाभाविक वंशावली-शैली में यह प्रयोग संक्षिप्त और स्पष्ट है; क्रिया दोनों खंडों में दोहराई गई है।
- source_word: אֶת
  choice: '[अनूदित नहीं]'
  rationale: यह निश्चित प्रत्यक्ष कर्म का चिह्न है; हिंदी में इसका कोई अलग शाब्दिक समकक्ष आवश्यक नहीं है। हिंदी वाक्य-विन्यास में संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֶפְלָל
  choice: एफ़लाल
  rationale: व्यक्तिवाचक नाम को इब्रानी ध्वनियों के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְ
  choice: और
  rationale: दो वंशावली खंडों को जोड़ने वाला साधारण समुच्चयबोधक है।
- source_word: עוֹבֵד
  choice: ओबेद
  rationale: व्यक्तिवाचक नाम को अनुवादित करने के बजाय इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है।
