base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/001.yaml
  text: 'These are the sons of Israel: Reuben, Simeon, Levi, Judah, Issachar, and Zebulun.'
translation:
  language: hi
  text: 'इस्राएल के पुत्र ये हैं: रूबेन, शिमोन, लेवी, यहूदा, इस्साकार और जबूलून।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये हैं
  rationale: यह बहुवचन संकेतवाचक शब्द नामों की सूची प्रस्तुत करता है; हिन्दी में स्वाभाविक सूची-परिचय के लिए ‘ये हैं’ उपयुक्त है।
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यहाँ इस्राएल के स्वयं पुरुष वंशजों के नाम दिए गए हैं, इसलिए ‘पुत्र’ ‘सन्तान’ या ‘वंशज’ से अधिक सटीक है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में वाचा-संबंधी व्यक्तिगत नाम ‘इस्राएल’ है; इसलिए इसे ‘याकूब’ से प्रतिस्थापित नहीं किया गया।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: हिब्रू नाम के अनुरूप हिन्दी में प्रचलित लिप्यंतरण।
- source_word: לֵוִי
  choice: लेवी
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: וִיהוּדָה
  choice: यहूदा
  rationale: व्यक्तिगत नाम का प्रचलित हिन्दी रूप; सूची को स्वाभाविक हिन्दी बनाने के लिए बीच का संयोजक अलग से नहीं दोहराया गया।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: हिब्रू नाम का हिन्दी में व्यापक रूप से पहचाना जाने वाला पारंपरिक रूप।
- source_word: וּזְבֻלוּן
  choice: और जबूलून
  rationale: अंतिम नाम से पहले हिब्रू संयोजक को स्वाभाविक हिन्दी सूची के अनुसार ‘और’ से व्यक्त किया गया; नाम का प्रचलित हिन्दी रूप रखा गया।
