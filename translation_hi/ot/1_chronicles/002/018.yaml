  text: וְ/כָלֵ֣ב בֶּן חֶצְר֗וֹן הוֹלִ֛יד אֶת עֲזוּבָ֥ה אִשָּׁ֖ה וְ/אֶת יְרִיע֑וֹת וְ/אֵ֣לֶּה בָנֶ֔י/הָ יֵ֥שֶׁר וְ/שׁוֹבָ֖ב וְ/אַרְדּֽוֹן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/018.yaml
  text: 'And Caleb son of Hezron fathered children by Azubah his wife[a], and by Jerioth; and these were her sons: Jesher, Shobab[b], and Ardon.'
translation:
  language: hi
  text: 'और हेस्रोन के पुत्र कालेब ने अपनी पत्नी अजूबा से[a] और यरीओत से सन्तान उत्पन्न की; और उसके पुत्र ये थे: येशेर, शोबाब और अर्दोन।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यरचना कठिन है। कुछ व्याख्याओं में ‘यरीओत’ को कालेब से जुड़ी दूसरी स्त्री माना जाता है, जबकि अन्य में उसे अजूबा के साथ समानाधिकरण में जोड़ा जाता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उस स्त्री के पुत्र’ है; प्रत्यय स्त्रीलिंग एकवचन है। वंशावली की कुछ व्याख्याएँ इस सम्बन्ध को अलग ढंग से समझती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הוֹלִיד
  choice: सन्तान उत्पन्न की
  rationale: हिफ़ील रूप का अर्थ वंशावली में ‘जन्म देना/पिता बनना’ है। स्त्रियों के नामों के साथ यह हिन्दी अभिव्यक्ति स्वाभाविक है और अनावश्यक रूप से सन्तानों की संख्या या लिंग निर्धारित नहीं करती।
- source_word: אֶת עֲזוּבָה אִשָּׁה וְאֶת יְרִיעוֹת
  choice: अपनी पत्नी अजूबा से और यरीओत से
  rationale: संक्षिप्त और कठिन इब्रानी रचना में אִשָּׁה को अजूबा के साथ समानाधिकरण में ‘पत्नी’ समझा गया है और यरीओत को समन्वित नाम के रूप में रखा गया है; ‘से’ הוֹלִיד के वंशावलीगत सम्बन्ध को हिन्दी में स्पष्ट करता है।
- source_word: אִשָּׁה
  choice: अपनी पत्नी
  rationale: यद्यपि इब्रानी में अधिकारसूचक प्रत्यय नहीं है, इस वंशावलीगत सन्दर्भ में ‘पत्नी’ स्वाभाविक अर्थ है; हिन्दी में ‘अपनी’ सम्बन्ध को सहज रूप से व्यक्त करता है।
- source_word: יְרִיעוֹת
  choice: यरीओत
  rationale: व्यक्तिनाम का देवनागरी लिप्यन्तरण किया गया है।
- source_word: וְאֵלֶּה בָנֶיהָ
  choice: और उसके पुत्र ये थे
  rationale: בָנֶיהָ का प्रत्यय स्त्रीलिंग एकवचन है, इसलिए ‘उसके’ को किसी स्त्री की ओर संकेत करते हुए बनाए रखा गया है; इसे ‘कालेब के’ करके पाठ को सरल नहीं किया गया।
- source_word: יֵשֶׁר וְשׁוֹבָב וְאַרְדּוֹן
  choice: येशेर, शोबाब और अर्दोन
  rationale: इन व्यक्तिनामों का मूल ध्वनियों के निकट देवनागरी लिप्यन्तरण किया गया है।
theological_decisions:
- issue: पद में उल्लिखित स्त्रियों और पुत्रों का वंशावलीगत सम्बन्ध
  choice: मुख्य पाठ में अजूबा को कालेब की पत्नी और यरीओत को अलग समन्वित नाम के रूप में प्रस्तुत किया गया है; स्त्रीलिंग एकवचन प्रत्यय के अनुसार ‘उसके पुत्र’ रखा गया है।
  alternative: यरीओत को अजूबा का दूसरा नाम या उससे समानाधिकरण में समझा जा सकता है; कुछ पुनर्निर्माण पुत्रों का सम्बन्ध अलग ढंग से बताते हैं।
  rationale: मसोरा-पाठ की व्याकरणिक सूचना सुरक्षित रखते हुए कठिन वाक्यरचना को पूरी तरह निर्णीत नहीं किया गया; वास्तविक अस्पष्टता पादटिप्पणियों में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सन्तान उत्पन्न की’ वंशावलीगत अर्थ को स्वाभाविक हिन्दी में देता है। नामों के लिए देवनागरी लिप्यन्तरण अपनाया गया है और मूल पाठ की अस्पष्टता को पादटिप्पणियों में सुरक्षित रखा गया है।
