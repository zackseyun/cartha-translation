  text: וַ/יִּהְי֤וּ בָנִים֙ לְ/שׁוֹבָ֔ל אֲבִ֖י קִרְיַ֣ת יְעָרִ֑ים הָרֹאֶ֖ה חֲצִ֥י הַ/מְּנֻחֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/052.yaml
  text: 'And Shobal the father of Kiriath-jearim had sons: Haroeh[c][b][a], half of the Manahathites.'
translation:
  language: hi
  text: 'और किर्यत-यारीम के पिता[a] शोबाल के पुत्र थे: हारोए[b] और मनूहोत का आधा भाग।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किर्यत-यारीम का संस्थापक”; वंशावलियों में “पिता” किसी नगर से जुड़े पूर्वज, संस्थापक या प्रधान को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: हारोए एक व्यक्तिनाम जान पड़ता है; कुछ परंपराओं में इसका रूप “रायाह” मिलता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक अर्थ “मनूहोत का आधा”; इसका आशय मनूहोत नामक स्थान, अथवा उसके निवासियों या कुल के आधे भाग से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ בָנִים לְשׁוֹבָל
  choice: शोबाल के पुत्र थे
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और वंशावली का अर्थ बनाए रखता है।
- source_word: אֲבִי קִרְיַת יְעָרִים
  choice: किर्यत-यारीम के पिता
  rationale: मुख्य पाठ में शाब्दिक वंशावली-संबंधी पद रखा गया है; नगर के पूर्वज, संस्थापक या प्रधान का व्यापक भाव पादटिप्पणी में दिया गया है।
- source_word: קִרְיַת יְעָרִים
  choice: किर्यत-यारीम
  rationale: स्थान-नाम का अर्थानुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: הָרֹאֶה
  choice: हारोए
  rationale: वंशावली में इसे व्यक्तिनाम मानते हुए स्वरयुक्त इब्रानी रूप का निकट लिप्यंतरण किया गया है; वैकल्पिक नाम-परंपरा पादटिप्पणी में है।
- source_word: חֲצִי הַמְּנֻחוֹת
  choice: मनूहोत का आधा भाग
  rationale: इब्रानी की वास्तविक अस्पष्टता बनाए रखने के लिए शब्दशः भौगोलिक/सामूहिक रूप रखा गया है; इसे मनूहोत के कुल या निवासियों का आधा भाग भी समझा जा सकता है।
