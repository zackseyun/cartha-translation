translation:
  language: hi
  text: यरहमेल की एक और पत्नी थी, जिसका नाम अतारा था। वह ओनाम की माता थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: थी
  rationale: היה के साथ לִירַחְמְאֵל यहाँ संबंध/अधिकार व्यक्त करता है। हिंदी में ‘यरहमेएल की ... पत्नी थी’ स्वाभाविक रूप से वही अर्थ देता है; वाव का संबंध प्रसंग में ‘और’ से व्यक्त है।
- source_word: אִשָּׁה אַחֶרֶת
  choice: एक और पत्नी
  rationale: वंशावली के प्रसंग में אִשָּׁה का अर्थ ‘पत्नी’ है और אַחֶרֶת एक अतिरिक्त पत्नी को सूचित करता है। ‘एक और पत्नी’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: לִירַחְמְאֵל
  choice: यरहमेएल की
  rationale: उपसर्ग ל को हिंदी के संबंधसूचक ‘की’ में समाहित किया गया है। यरहमेएल नाम का देवनागरी लिप्यंतरण है।
- source_word: וּשְׁמָהּ
  choice: जिसका नाम ... था
  rationale: इब्रानी नामकरण-सूत्र को हिंदी में स्वाभाविक संबंधवाचक वाक्य के रूप में प्रस्तुत किया गया है।
- source_word: עֲטָרָה
  choice: अतारा
  rationale: व्यक्तिनाम का अर्थानुवाद न करके देवनागरी में स्रोत-आधारित लिप्यंतरण किया गया है।
- source_word: הִיא
  choice: वह
  rationale: स्वतंत्र सर्वनाम को अलग वाक्य में ‘वह’ के रूप में रखा गया है; इससे स्रोत की स्पष्टता बनी रहती है और अनावश्यक अतिरिक्त बल नहीं जुड़ता।
- source_word: אֵם
  choice: माता
  rationale: वंशावली की गरिमापूर्ण शैली में ‘माता’ सरल और सटीक समतुल्य है।
- source_word: אוֹנָם
  choice: ओनाम
  rationale: व्यक्तिनाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
