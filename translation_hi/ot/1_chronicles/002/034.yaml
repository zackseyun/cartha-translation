  text: Sheshan had no sons[a], only daughters. And Sheshan had an Egyptian servant whose name was Jarha.
translation:
  language: hi
  text: शेशान के कोई पुत्र नहीं थे, केवल पुत्रियाँ थीं। शेशान का एक मिस्री दास[a] था, जिसका नाम यर्हा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सेवक।’ हिब्रानी शब्द עֶבֶד सेवक या दास, दोनों को सूचित कर सकता है; यहाँ ‘दास’ उसकी पराधीन स्थिति को स्पष्ट रखने के लिए चुना गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָיָה לְשֵׁשָׁן
  choice: शेशान के … थे / शेशान का … था
  rationale: हिब्रानी स्वामित्व-सूचक मुहावरे को प्रसंग के अनुसार स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בָּנִים
  choice: पुत्र
  rationale: आगे ‘पुत्रियाँ’ के साथ स्पष्ट विरोध होने के कारण व्यापक ‘सन्तान’ के बजाय ‘पुत्र’ आवश्यक है।
- source_word: כִּי אִם
  choice: केवल
  rationale: नकार के बाद यह पदबंध ‘बल्कि केवल/सिवाय’ का अर्थ देता है; यहाँ ‘केवल’ संक्षिप्त और स्वाभाविक है।
- source_word: בָּנוֹת
  choice: पुत्रियाँ
  rationale: यह सीधा अर्थ देता है और वंशावली में पुत्र-पुत्री का विरोध सुरक्षित रखता है।
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द सेवक अथवा बँधे हुए अधीनस्थ व्यक्ति को सूचित कर सकता है। ‘दास’ मूल पद में निहित पराधीन स्थिति को ‘सेवक’ से अधिक स्पष्ट रूप में सुरक्षित रखता है।
- source_word: מִצְרִי
  choice: मिस्री
  rationale: यह व्यक्ति के मिस्री मूल या जातीय पहचान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּשְׁמוֹ
  choice: जिसका नाम … था
  rationale: शाब्दिक ‘और उसका नाम था’ के अर्थ को अधिक प्रवाहपूर्ण हिन्दी सम्बन्धवाचक रचना में रखा गया है।
- source_word: יַרְחָע
  choice: यर्हा
  rationale: हिब्रानी व्यक्तिगत नाम का देवनागरी में निकट ध्वन्यात्मक लिप्यंतरण किया गया है।
