source:
  edition: WLC
  text: וּ/בְנֵ֣י זֶ֗רַח זִ֠מְרִי וְ/אֵיתָ֧ן וְ/הֵימָ֛ן וְ/כַלְכֹּ֥ל וָ/דָ֖רַע כֻּלָּ֥/ם חֲמִשָּֽׁה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/006.yaml
  text: 'And the sons of Zerah: Zimri[a], Ethan, Heman, Kalkol[b], and Dara—five in all.'
translation:
  language: hi
  text: 'और ज़ेरह के पुत्र थे: ज़िम्री, एतान, हेमान, कलकोल और दारा[a]—कुल पाँच।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘दारा’; 1 राजा 4:31 के समानांतर उल्लेख में ‘दार्दा’ है।
    reason: cross_reference
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र थे
  rationale: वंशावली के संदर्भ में בְּנֵי का स्वाभाविक और सटीक अर्थ ‘पुत्र’ है; आरंभिक וּ को सूची की निरंतरता दिखाने के लिए ‘और’ से व्यक्त किया गया है। हिंदी वाक्य को सहज बनाने के लिए ‘थे’ जोड़ा गया है।
- source_word: זֶרַח
  choice: ज़ेरह
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में स्रोत-सन्निकट लिप्यंतरण।
- source_word: זִמְרִי
  choice: ज़िम्री
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: וְאֵיתָן
  choice: एतान
  rationale: इब्रानी אֵיתָן के उच्चारण के निकट व्यक्तिगत नाम; सूची में संयोजक को हिंदी वाक्य-विन्यास के अनुसार अंतिम पद से पहले रखा गया है।
- source_word: וְהֵימָן
  choice: हेमान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित और स्रोत-सन्निकट देवनागरी रूप।
- source_word: וְכַלְכֹּל
  choice: कलकोल
  rationale: नाम के इब्रानी व्यंजनों और स्वरों को स्पष्ट रूप से प्रतिबिंबित करने वाला लिप्यंतरण। अंग्रेज़ी में Kalkol/Calcol का वर्तनी-भेद हिंदी में अलग टिप्पणी की मांग नहीं करता।
- source_word: וָדָרַע
  choice: दारा
  rationale: इस पद के मसोराई पाठ में דָרַע है, इसलिए समानांतर पद से सामंजस्य बैठाकर ‘दार्दा’ करने के बजाय ‘दारा’ रखा गया है।
- source_word: כֻּלָּם חֲמִשָּׁה
  choice: कुल पाँच
  rationale: शाब्दिक भाव ‘वे सब पाँच थे’ को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: 1 राजा 4:31 के समानांतर पाठ में नाम का भिन्न रूप
  choice: मुख्य पाठ में ‘दारा’
  alternative: ‘दार्दा’
  rationale: 1 इतिहास 2:6 का उपलब्ध इब्रानी पाठ ‘दारा’ का समर्थन करता है। समानांतर पाठ का रूप पाद-टिप्पणी में बताया गया है, ताकि पाठांतर-जैसा तनाव मिटाया न जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामों का देवनागरी लिप्यंतरण इब्रानी उच्चारण के निकट है। अंग्रेज़ी की Calcol/Kalkol वर्तनी-वैकल्पिकता हिंदी में सार्थक भेद न होने के कारण पाद-टिप्पणी में नहीं रखी गई।
