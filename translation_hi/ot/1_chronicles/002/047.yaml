base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/002/047.yaml
  text: 'The sons of Jahdai: Regem, Jotham, Geshan, Pelet, Ephah, and Shaaph.'
translation:
  language: hi
  text: 'और यहदई के पुत्र ये थे: रेगेम, योताम, गेशान, पेलेत, एपा और शाअप।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र ये थे
  rationale: וּ संयोजक 'और' है तथा בְנֵי वंशावली में 'के पुत्र' का सामान्य रचनात्मक बहुवचन है। 'ये थे' सूची को आधुनिक हिन्दी में स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: יָהְדָּי
  choice: यहदई
  rationale: व्यक्तिनाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: רֶגֶם
  choice: रेगेम
  rationale: व्यक्तिनाम का स्रोत-आधारित देवनागरी लिप्यंतरण।
- source_word: יוֹתָם
  choice: योताम
  rationale: व्यक्तिनाम का हिब्रू रूप के निकट लिप्यंतरण; आरम्भिक yod को 'य' से दर्शाया गया है।
- source_word: גֵישָׁן
  choice: गेशान
  rationale: व्यक्तिनाम का सुबोध हिन्दी लिप्यंतरण।
- source_word: פֶלֶט
  choice: पेलेत
  rationale: व्यक्तिनाम का स्रोत के निकट लिप्यंतरण; अंतिम ת को 'त' रखा गया है।
- source_word: עֵיפָה
  choice: एपा
  rationale: यहाँ यह माप की इकाई नहीं बल्कि व्यक्तिनाम है; हिब्रू עֵיפָה के स्वर और व्यंजन-क्रम को हिन्दी में स्वाभाविक रूप से 'एपा' दिया गया है।
- source_word: שָׁעַף
  choice: शाअप
  rationale: व्यक्तिनाम में बीच के ע से बनी स्वर-विभक्ति को 'अ' द्वारा और अंतिम ף को 'प' द्वारा दर्शाया गया है।
