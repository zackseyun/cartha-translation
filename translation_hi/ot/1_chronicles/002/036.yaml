lexical_decisions:
- source_word: וְ/עַתַּי
  choice: अत्तै
  rationale: व्यक्तिवाचक नाम का हिब्रू उच्चारणानुसार देवनागरी लिप्यंतरण; आरंभिक וְ को हिन्दी वाक्य के आरंभ में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: הֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: वंशावली के प्रसंग में हिफ़ील रूप संतान उत्पन्न करने अथवा पिता बनने का भाव देता है। हिन्दी में ‘से … उत्पन्न हुआ’ स्वाभाविक, संक्षिप्त और गरिमापूर्ण वंशावली-प्रयोग है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह निश्चित कर्म का सूचक है; हिन्दी में इसका स्वतंत्र समतुल्य आवश्यक नहीं।
- source_word: נָתָן
  choice: नातान
  rationale: हिब्रू व्यक्तिवाचक नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
- source_word: וְ/נָתָן
  choice: और नातान
  rationale: וְ को ‘और’ से व्यक्त किया गया है और नाम का लिप्यंतरण ‘नातान’ किया गया है।
- source_word: הוֹלִיד
  choice: से … उत्पन्न हुआ
  rationale: पहले आए उसी क्रिया-रूप और वंशावली-संबंध को एकरूपता से व्यक्त किया गया है।
- source_word: זָבָד
  choice: जाबाद
  rationale: हिब्रू व्यक्तिवाचक नाम का ध्वन्यात्मक देवनागरी लिप्यंतरण।
