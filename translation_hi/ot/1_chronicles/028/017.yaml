  text: and the forks, the basins, and the pitchers of pure gold; and for the golden bowls, by weight for each bowl and bowl; and for the silver bowls, by weight for each bowl and bowl.
translation:
  language: hi
  text: और शुद्ध सोने के काँटे, छिड़काव के पात्र और सुराहियाँ[b]; सोने के कटोरों के लिए, प्रत्येक कटोरे के लिए तौल के अनुसार[a]; और चाँदी के कटोरों के लिए भी, प्रत्येक कटोरे के लिए तौल के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘कटोरे और कटोरे के लिए’ दोहराया गया है; यह वितरणात्मक अभिव्यक्ति बताती है कि प्रत्येक पात्र के लिए अलग भार निर्धारित था।
    reason: lexical_alternative
  - marker: b
    text: या ‘उँडेलने के पात्र।’ इब्रानी शब्द किसी तरल पदार्थ को उँडेलने के पात्र को दर्शाता है; उसका ठीक आकार अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִּזְלָגוֹת
  choice: काँटे
  rationale: यह शब्द मन्दिर की सेवा में प्रयुक्त काँटेनुमा उपकरणों को दर्शाता है। ‘काँटे’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִּזְרָקוֹת
  choice: छिड़काव के कटोरे
  rationale: यह शब्द बलिदान-सम्बन्धी सेवा में प्रयुक्त पात्रों, विशेषकर रक्त आदि के छिड़काव के कटोरों, के लिए आता है। इस अनुवाद से आगे आने वाले כְפוֹרֵי, ‘प्यालों,’ से भेद बना रहता है।
- source_word: קְּשָׂוֹת
  choice: सुराहियाँ
  rationale: यह शब्द सम्भवतः उँडेलने के पात्र को दर्शाता है। ‘सुराहियाँ’ इस कार्य को सहज आधुनिक हिन्दी में व्यक्त करता है, यद्यपि पात्र का ठीक आकार निश्चित नहीं है।
- source_word: זָהָב טָהוֹר
  choice: शुद्ध सोने के
  rationale: वाक्यांश को सूची में आए तीनों प्रकार के उपकरणों की सामग्री बताने वाला समझा गया है।
- source_word: כְפוֹרֵי
  choice: प्याले
  rationale: यहाँ कटोरेनुमा पात्र अभिप्रेत है। ‘प्याले’ पहले प्रयुक्त מִּזְרָקוֹת, ‘छिड़काव के कटोरे,’ से स्पष्ट भेद रखता है।
- source_word: בְּמִשְׁקָל
  choice: तौल
  rationale: यह प्रत्येक पात्र के लिए निर्धारित बहुमूल्य धातु के भार को दर्शाता है।
- source_word: לִכְפוֹר וּכְפוֹר
  choice: हर एक प्याले का अलग-अलग
  rationale: इब्रानी की पुनरुक्ति वितरणात्मक है और प्रत्येक पात्र के लिए अलग तौल निर्धारित होने पर बल देती है। हिन्दी में ‘हर एक…अलग-अलग’ उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: सोने के विपरीत प्रयुक्त धातु के लिए मानक हिन्दी शब्द।
