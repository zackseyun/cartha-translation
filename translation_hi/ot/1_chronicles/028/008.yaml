- from: और अब, सारे इस्राएल की दृष्टि में—जो याहवे की सभा है—और हमारे परमेश्वर के सुनते हुए, तुम अपने परमेश्वर याहवे की सभी आज्ञाओं का पालन करो और उनकी खोज में लगे रहो, ताकि तुम उस उत्तम देश के अधिकारी बने रहो[a] और अपने बाद अपने पुत्रों[b] को वह सदा के लिए विरासत में दे सको।
  to: और अब, सारे इस्राएल के, अर्थात् याहवे की सभा के, सामने और हमारे परमेश्वर के सुनते हुए, अपने परमेश्वर याहवे की सब आज्ञाओं का पालन करो और उनकी खोज करो, ताकि तुम उस अच्छे देश के अधिकारी बनो[a] और उसे अपने बाद अपने पुत्रों[b] को सदा के लिए विरासत में दे सको।
