source:
  edition: WLC
  text: וְ֠/עַתָּה לְ/עֵינֵ֨י כָל יִשְׂרָאֵ֤ל קְהַל יְהוָה֙ וּ/בְ/אָזְנֵ֣י אֱלֹהֵ֔י/נוּ שִׁמְר֣וּ וְ/דִרְשׁ֔וּ כָּל מִצְוֺ֖ת יְהוָ֣ה אֱלֹהֵי/כֶ֑ם לְמַ֤עַן תִּֽירְשׁוּ֙ אֶת הָ/אָ֣רֶץ הַ/טּוֹבָ֔ה וְ/הִנְחַלְתֶּ֛ם לִ/בְנֵי/כֶ֥ם אַחֲרֵי/כֶ֖ם עַד עוֹלָֽם־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/008.yaml
  text: And now[a], in the sight of all Israel, the assembly of Yahweh, and in the hearing of our God, keep and seek all the commandments of Yahweh your God[b], so that you may possess the good land and leave it as an inheritance to your sons after you forever.
translation:
  language: hi
  text: और अब, सारे इस्राएल के, अर्थात् याहवे की सभा के, सामने और हमारे परमेश्वर के सुनते हुए, अपने परमेश्वर याहवे की सब आज्ञाओं का पालन करो और उनकी खोज करो, ताकि तुम उस अच्छे देश के अधिकारी बनो[a] और उसे अपने बाद अपने पुत्रों[b] को सदा के लिए विरासत में दे सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस अच्छे देश को विरासत में पाओ।” इब्रानी क्रिया का अर्थ संदर्भ के अनुसार विरासत में पाना या अधिकार में रखना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “पुत्रों”; यह शब्द पुल्लिंग बहुवचन है, अधिक सामान्य “संतानों” नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: यह पिछले संबोधन से संबंध और अब दिए जा रहे सार्वजनिक निर्देश की ओर संक्रमण—दोनों को बनाए रखता है।
- source_word: לְעֵינֵי כָל־יִשְׂרָאֵל
  choice: सारे इस्राएल की दृष्टि में
  rationale: इब्रानी के शाब्दिक नेत्र-संबंधी मुहावरे और सार्वजनिक साक्षी की भावना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: קְהַל יְהוָה
  choice: याहवे की सभा
  rationale: קהל एकत्रित समुदाय को दर्शाता है; ‘सभा’ आधुनिक, स्पष्ट और अनावश्यक रूप से संस्थागत अर्थ से मुक्त है।
- source_word: וּבְאָזְנֵי אֱלֹהֵינוּ
  choice: और हमारे परमेश्वर के सुनते हुए
  rationale: शाब्दिक ‘हमारे परमेश्वर के कानों में’ का मानवीकरण बनाए रखते हुए अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: שִׁמְרוּ
  choice: पालन करो
  rationale: आज्ञाओं के संदर्भ में यह वाचा-संबंधी आज्ञाकारिता को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וְדִרְשׁוּ
  choice: उनकी खोज में लगे रहो
  rationale: דרש के खोजने, ध्यानपूर्वक जानने और समर्पित होकर उसके पीछे लगे रहने के व्यापक भाव को केवल बौद्धिक अध्ययन तक सीमित नहीं करता।
- source_word: כָּל־מִצְוֺת
  choice: सभी आज्ञाओं
  rationale: כל के साथ बहुवचन संज्ञा का सीधा और स्वाभाविक प्रतिनिधित्व है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: उद्देश्य अथवा अपेक्षित परिणाम को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִּירְשׁוּ
  choice: अधिकारी बने रहो
  rationale: देश के संबंध में ירשׁ के अधिकार रखने के अर्थ को तत्कालीन संदर्भ में स्वाभाविक बनाता है; ‘विरासत में पाना’ भी संभव है और पादटिप्पणी में रखा गया है।
- source_word: הָאָרֶץ הַטּוֹבָה
  choice: उत्तम देश
  rationale: प्रतिज्ञात देश के पारंपरिक वाचा-संबंधी वर्णन को शाब्दिक और गरिमापूर्ण रूप में रखता है।
- source_word: וְהִנְחַלְתֶּם
  choice: विरासत में दे सको
  rationale: נחל के हिफ़ील रूप का कारणवाचक भाव—पुत्रों को उत्तराधिकारी बनाना—स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לִבְנֵיכֶם
  choice: अपने पुत्रों
  rationale: इब्रानी בנים यहाँ स्पष्ट रूप से पुल्लिंग बहुवचन है; अनुवाद उसी लैंगिक रूप को बनाए रखता है।
- source_word: עַד־עוֹלָם
  choice: सदा के लिए
  rationale: दीर्घस्थायी, अनिश्चित भविष्यकालीन अधिकार की अभिव्यक्ति को सामान्य हिन्दी में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; उसे सामान्य उपाधि से बदले बिना लिप्यंतरित किया गया है।
- issue: תִּירְשׁוּ में अधिकार और विरासत का संबंध
  choice: अधिकारी बने रहो
  alternative: विरासत में पाओ
  rationale: संदर्भ में इस्राएल पहले से देश में है, इसलिए देश पर अधिकार बनाए रखने का भाव उपयुक्त है; फिर भी क्रिया का विरासत-संबंधी अर्थ वास्तविक है और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בנים का लैंगिक रूप
  choice: पुत्रों
  alternative: संतानों / बच्चों
  rationale: मूल संज्ञा पुल्लिंग बहुवचन है; अधिक सामान्य शब्द चुनकर स्रोत की विशिष्टता को मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। सार्वजनिक साक्षी का भाव, दोनों बहुवचन आज्ञार्थक क्रियाएँ और देश के अधिकार/विरासत की वास्तविक शाब्दिक अस्पष्टता बनाए रखी गई है।
