  text: וַ/יֹּ֨אמֶר דָּוִ֜יד לִ/שְׁלֹמֹ֣ה בְנ֗/וֹ חֲזַ֤ק וֶ/אֱמַץ֙ וַ/עֲשֵׂ֔ה אַל תִּירָ֖א וְ/אַל תֵּחָ֑ת כִּי֩ יְהוָ֨ה אֱלֹהִ֤ים אֱלֹהַ/י֙ עִמָּ֔/ךְ לֹ֤א יַרְפְּ/ךָ֙ וְ/לֹ֣א יַֽעַזְבֶ֔/ךָּ עַד לִ/כְל֕וֹת כָּל מְלֶ֖אכֶת עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/020.yaml
  text: And David said to Solomon his son[a], “Be strong and courageous, and do it. Do not fear or be dismayed, for Yahweh God, my God, is with you. He will not fail you or forsake you until all the work for the service of the house of Yahweh is finished.”
translation:
  language: hi
  text: तब दाऊद ने अपने पुत्र सुलैमान से कहा, “दृढ़ और साहसी बनो और यह काम करो। मत डरो और न हताश हो, क्योंकि याहवे परमेश्वर, मेरा परमेश्वर, तुम्हारे साथ है। वह तुम्हें निराश नहीं करेगा[a] और न तुम्हारा त्याग करेगा, जब तक याहवे के भवन की सेवा का सारा काम पूरा न हो जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम्हारा हाथ ढीला नहीं छोड़ेगा”; इब्रानी क्रिया में सहारा या पकड़ ढीली न करने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזַק וֶאֱמַץ
  choice: दृढ़ और साहसी बनो
  rationale: दोनों आदेश साथ मिलकर शक्ति, संकल्प और साहस का आह्वान करते हैं; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: וַעֲשֵׂה
  choice: और यह काम करो
  rationale: संदर्भ में सुलैमान को मन्दिर-सम्बन्धी कार्य आरम्भ और सम्पन्न करने का आदेश है; ‘यह काम’ निहित कर्म को स्पष्ट करता है।
- source_word: אַל תִּירָא וְאַל תֵּחָת
  choice: मत डरो और न हताश हो
  rationale: पहला निषेध भय और दूसरा साहस टूटने या निरुत्साहित होने को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: אֱלֹהִים אֱלֹהַי
  choice: परमेश्वर, मेरा परमेश्वर
  rationale: मूल की पुनरुक्ति और दाऊद के व्यक्तिगत सम्बन्ध पर दिए गए बल को सुरक्षित रखता है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ है
  rationale: मूल में यह अव्यक्त क्रिया वाला वर्तमान नामवाचक वाक्य है; हिन्दी में ‘है’ स्वाभाविक पूर्ति है।
- source_word: לֹא יַרְפְּךָ
  choice: वह तुम्हें असहाय नहीं छोड़ेगा
  rationale: हिफ़ील रूप समर्थन ढीला न करने या किसी को गिरने के लिए न छोड़ने का भाव देता है; यह अनुवाद उसे अगले ‘त्याग’ से अलग रखते हुए स्पष्ट करता है।
- source_word: וְלֹא יַעַזְבֶךָּ
  choice: और न तुम्हारा त्याग करेगा
  rationale: עזב यहाँ छोड़ देने या परित्याग करने की वाचा-संबंधी आश्वस्ति व्यक्त करता है।
- source_word: כָּל מְלֶאכֶת עֲבוֹדַת בֵּית יְהוָה
  choice: यहोवा के भवन की सेवा का सारा काम
  rationale: घनी इब्रानी संबंध-श्रृंखला में ‘काम’ और ‘सेवा’ दोनों अर्थों को सहज हिन्दी में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: לֹא יַרְפְּךָ और וְלֹא יַעַזְבֶךָ के बीच अर्थभेद
  choice: असहाय नहीं छोड़ेगा ... त्याग नहीं करेगा
  alternative: तुम्हें नहीं छोड़ेगा ... त्याग नहीं करेगा
  rationale: पहली क्रिया समर्थन या पकड़ ढीली करने और दूसरी परित्याग करने का भाव रखती है; अनुवाद दोनों को एक ही अर्थ में मिला नहीं देता।
- issue: עַד ‘जब तक’ से ईश्वर की उपस्थिति की अवधि
  choice: मूल का ‘जब तक’ बनाए रखा
  alternative: कार्य पूरा होने तक वह तुम्हारे साथ रहेगा
  rationale: पद कार्य की समाप्ति को इस आश्वासन का निर्दिष्ट लक्ष्य बनाता है; अनुवाद इससे आगे ईश्वर की उपस्थिति समाप्त होने का निष्कर्ष न जोड़ता है, न उस भाषिक तनाव को मिटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सामान्य पाठक के लिए स्पष्ट। ‘दृढ़ और साहसी’, ‘हताश’, ‘त्याग’ जैसे शब्द औपचारिकता और सहजता में संतुलन रखते हैं।
