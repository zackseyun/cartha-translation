source:
  edition: WLC
  text: וּֽ/לְ/מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם וּֽ/לְ/כָל מְלֶ֖אכֶת עֲבוֹדַ֣ת בֵּית יְהוָ֑ה וּֽ/לְ/כָל כְּלֵ֖י עֲבוֹדַ֥ת בֵּית יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/013.yaml
  text: for the divisions of the priests and the Levites[a], and for all the work of the service of the house of Yahweh[b], and for all the vessels of service of the house of Yahweh.
translation:
  language: hi
  text: और याजकों और लेवियों के दलों[a] के लिए, और याहवे के भवन की सेवा के सारे काम के लिए, और याहवे के भवन की सेवा के सभी पात्रों[b] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याजकों और लेवियों की सेवा-टोलियों”।
    reason: lexical_alternative
  - marker: b
    text: या “सामान” अथवा “उपकरणों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַחְלְקוֹת
  choice: दल
  rationale: इतिहास-वृत्तांत में यह शब्द याजकों और लेवियों के व्यवस्थित सेवा-दलों को सूचित करता है। ‘दल’ आधुनिक हिन्दी में स्वाभाविक है और प्रशासनिक विभाजन का भाव बनाए रखता है।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: इस्राएल के पुरोहित वर्ग के लिए मानक और सहज हिन्दी पद। विभक्ति के कारण परसर्गीय रूप रखा गया है।
- source_word: וְהַלְוִיִּם
  choice: और लेवियों
  rationale: लेवी गोत्र तथा उसके मंदिर-सेवकों का पारंपरिक नाम बनाए रखा गया है।
- source_word: מְלֶאכֶת עֲבוֹדַת
  choice: सेवा के ... काम
  rationale: מְלֶאכֶת का व्यापक अर्थ ‘काम’ है और עֲבוֹדַת यहाँ मंदिर की नियत सेवा को व्यक्त करता है। हिन्दी शब्दक्रम में दोनों का संबंध स्पष्ट और स्वाभाविक किया गया है।
- source_word: בֵּית יְהוָה
  choice: याहवे के भवन
  rationale: ‘भवन’ मूल के ‘घर/भवन’ रूपक को सुरक्षित रखता है; केवल ‘मंदिर’ कहकर उसे संकुचित नहीं करता।
- source_word: כְּלֵי עֲבוֹדַת
  choice: सेवा के ... पात्रों
  rationale: כְּלֵי मंदिर-सेवा में प्रयुक्त विविध पवित्र वस्तुओं का व्यापक पद है। ‘पात्र’ प्रचलित बाइबलीय हिन्दी है, जबकि पादटिप्पणी इसके ‘सामान/उपकरण’ अर्थ की व्यापकता बताती है।
- source_word: לְכָל
  choice: सारे ... के लिए / सभी ... के लिए
  rationale: दोहराए गए לְכָל की सूचीबद्ध संरचना को बनाए रखते हुए हिन्दी में संज्ञा के अनुसार ‘सारे’ और ‘सभी’ का स्वाभाविक प्रयोग किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका आधुनिक विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पूर्ववर्ती वाक्य से जुड़ी सूची का अंश है, इसलिए आरंभ का ‘और’ तथा बार-बार आने वाला ‘के लिए’ सुरक्षित रखा गया है। अंग्रेज़ी परामर्श-पाठ में [b] का स्थान ईश्वरीय नाम के बाद दिखता है, पर उसकी पादटिप्पणी כְּלֵי से संबंधित है; इसलिए हिन्दी मुख्य पाठ में चिह्न ‘पात्रों’ के बाद रखा गया है।
