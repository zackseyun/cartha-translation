source:
  edition: WLC
  text: וְ/תַבְנִ֗ית כֹּל֩ אֲשֶׁ֨ר הָיָ֤ה בָ/ר֨וּחַ֙ עִמּ֔/וֹ לְ/חַצְר֧וֹת בֵּית יְהוָ֛ה וּ/לְ/כָל הַ/לְּשָׁכ֖וֹת סָבִ֑יב לְ/אֹֽצְרוֹת֙ בֵּ֣ית הָ/אֱלֹהִ֔ים וּ/לְ/אֹצְר֖וֹת הַ/קֳּדָשִֽׁים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/012.yaml
  text: 'and the plan of all that was in the Spirit with him: for the courts of the house of Yahweh[a], for all the surrounding chambers, for the treasuries of the house of God, and for the treasuries of the holy things.'
translation:
  language: hi
  text: और उस सबकी योजना भी, जो कुछ उसके साथ आत्मा में था[a]—यहोवा के भवन के आँगनों, चारों ओर की सभी कोठरियों, परमेश्वर के भवन के भण्डारों और पवित्र वस्तुओं के भण्डारों के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उसके अपने मन में था।” इब्रानी वाक्यांश का अर्थ यह भी हो सकता है कि यह दैवी आत्मा से संबंधित था।
    reason: इब्रानी बָרוּחַ עִמּוֹ के दैवी आत्मा और दाऊद के अपने मन/आत्मा—दोनों संभावित अर्थों को बिना किसी एक को निश्चित किए सुरक्षित रखता है।
lexical_decisions:
- source_word: תַבְנִית
  choice: नमूना
  rationale: मन्दिर-निर्माण के संदर्भ में यह शब्द रूपरेखा, योजना या वास्तु-नमूने को दर्शाता है। ‘नमूना’ उस ठोस प्रतिरूप की धारणा को बनाए रखता है जिसे दाऊद ने सौंपा।
- source_word: כֹּל אֲשֶׁר
  choice: उस सबका
  rationale: यह निर्माण-संबंधी विवरण की समग्रता व्यक्त करता है और पिछले पद से स्वाभाविक रूप से जुड़ता है।
- source_word: הָיָה בָרוּחַ עִמּוֹ
  choice: जो आत्मा के द्वारा उसके पास था
  rationale: इब्रानी वाक्यांश असामान्य और अर्थ की दृष्टि से खुला है। यह अनुवाद दिव्य आत्मा द्वारा प्राप्त योजना की संभावना व्यक्त करता है, जबकि पादटिप्पणी दाऊद के अपने मन/अन्तःकरण वाले अर्थ को सुरक्षित रखती है।
- source_word: לְחַצְרוֹת
  choice: आँगनों के लिए
  rationale: मन्दिर-परिसर के खुले प्रांगणों के लिए ‘आँगन’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: ‘भवन’ इब्रानी ‘घर’ की उपमा और मन्दिर-संदर्भ दोनों को बनाए रखता है; परमेश्वर का व्यक्तिगत नाम ‘यहोवा’ रूप में दिया गया है।
- source_word: לְּשָׁכוֹת סָבִיב
  choice: चारों ओर की सभी कोठरियों
  rationale: यह आसपास स्थित मन्दिर-कक्षों को स्पष्ट और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: אֹצְרוֹת
  choice: भण्डारों
  rationale: यह उन स्थानों को दर्शाता है जहाँ मूल्यवान अथवा समर्पित वस्तुएँ रखी जाती थीं; ‘भण्डार’ हिन्दी में पर्याप्त व्यापक है।
- source_word: בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन
  rationale: यह मूल की समानान्तर अभिव्यक्ति को बनाए रखता है और मन्दिर का संकेत स्पष्ट रखता है।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं
  rationale: बहुवचन संज्ञा यहाँ मन्दिर में रखी पवित्र अथवा समर्पित वस्तुओं को सूचित करती है; सीधा अनुवाद अनावश्यक विशिष्टता से बचता है।
theological_decisions:
- issue: בָרוּחַ עִמּוֹ का आशय
  choice: 'दिव्य आत्मा से प्राप्त बात: ‘आत्मा के द्वारा उसके पास था’'
  alternative: दाऊद के अपने मन या अन्तःकरण में जो था
  rationale: पद 19 का प्रकाशन-संबंधी संदर्भ दिव्य स्रोत का समर्थन करता है, पर इब्रानी व्याकरण दाऊद के अपने मन/अन्तःकरण का अर्थ भी ले सकता है। मुख्य पाठ और पादटिप्पणी मिलकर इस वास्तविक अस्पष्टता को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। वास्तु-संबंधी सूची को संक्षिप्त रखा गया है और मूल की धार्मिक अस्पष्टता पादटिप्पणी सहित सुरक्षित रखी गई है।
