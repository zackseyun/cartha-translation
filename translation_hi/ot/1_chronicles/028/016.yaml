  text: and the weight of the gold for the tables of the arrangement[a], for each table and table, and silver for the silver tables.
translation:
  language: hi
  text: और क्रम से रखी रोटियों की मेज़ों के लिए सोने का भार, हर एक मेज़ के लिए, और चाँदी की मेज़ों के लिए चाँदी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “व्यवस्था की मेज़ें” अथवा “क्रम से सजाई गई वस्तुओं की मेज़ें।” यहाँ संभवतः उन मेज़ों का संकेत है जिन पर रोटियाँ क्रम से रखी जाती थीं; पारंपरिक रूप से इन्हें “दर्शन की रोटियों की मेज़ें” कहा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁקָל
  choice: भार
  rationale: मन्दिर की वस्तुओं के लिए धातु की निर्धारित तौल अभिप्रेत है; ‘भार’ मूल अर्थ को सीधे व्यक्त करता है। अंतिम खंड में यह शब्द अर्थ की दृष्टि से निहित है, इसलिए स्वाभाविक हिन्दी के लिए दोहराया गया है।
- source_word: שֻׁלְחֲנוֹת הַמַּעֲרֶכֶת
  choice: भेंट की रोटियों की मेज़ें
  rationale: מַעֲרֶכֶת का मूल भाव क्रम से सजाई गई वस्तुओं का है और इस उपासना-संदर्भ में मेज़ों पर यहोवा के सामने रखी जाने वाली रोटियाँ अभिप्रेत हैं। मुख्य पाठ में सामान्य पाठक के लिए अर्थ स्पष्ट किया गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: לְשֻׁלְחָן וְשֻׁלְחָן
  choice: हर एक मेज़ के लिए अलग-अलग
  rationale: हिब्रू की संज्ञा-पुनरावृत्ति वितरणात्मक है और प्रत्येक मेज़ के लिए पृथक भार निर्धारित होने पर बल देती है। यह हिन्दी में उसी बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֶסֶף
  choice: चाँदी
  rationale: यह सोने के विपरीत प्रयुक्त सामान्य धातु-संज्ञा है।
- source_word: שֻׁלְחֲנוֹת הַכָּסֶף
  choice: चाँदी की मेज़ें
  rationale: सम्बन्धसूचक संरचना सबसे स्वाभाविक रूप से चाँदी से बनी अथवा चाँदी वाली मेज़ों को सूचित करती है; ‘चाँदी की मेज़ें’ संक्षिप्त है और पदार्थ सम्बन्धी हल्की अस्पष्टता भी बनाए रखता है।
