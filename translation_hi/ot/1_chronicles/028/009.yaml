source:
  edition: WLC
  text: וְ/אַתָּ֣ה שְׁלֹמֹֽה בְנִ֡/י דַּע֩ אֶת אֱלֹהֵ֨י אָבִ֜י/ךָ וְ/עָבְדֵ֗/הוּ בְּ/לֵ֤ב שָׁלֵם֙ וּ/בְ/נֶ֣פֶשׁ חֲפֵצָ֔ה כִּ֤י כָל לְבָבוֹת֙ דּוֹרֵ֣שׁ יְהוָ֔ה וְ/כָל יֵ֥צֶר מַחֲשָׁב֖וֹת מֵבִ֑ין אִֽם תִּדְרְשֶׁ֨/נּוּ֙ יִמָּ֣צֵא לָ֔/ךְ וְ/אִם תַּֽעַזְבֶ֖/נּוּ יַזְנִיחֲ/ךָ֥ לָ/עַֽד־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/009.yaml
  text: And you[a], Solomon my son, know the God of your father and serve him with a whole heart and a willing soul, for Yahweh searches all hearts and understands every intention of the thoughts. If you seek him, he will let himself be found by you; but if you forsake him[b], he will cast you off forever.
translation:
  language: hi
  text: और तू, मेरे पुत्र सुलैमान, अपने पिता के परमेश्वर को जान और पूरे हृदय तथा इच्छुक मन से उसकी सेवा कर; क्योंकि यहोवा सब हृदयों को जाँचता है और विचारों की हर प्रवृत्ति को समझता है। यदि तू उसे खोजेगा, तो वह तुझे मिल जाएगा[a]; पर यदि तू उसे त्याग देगा, तो वह तुझे सदा के लिए ठुकरा देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तेरे द्वारा पाया जाएगा।” इब्रानी क्रिया निष्क्रिय अथवा आत्मवाचक भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह तुझे सदा के लिए दूर कर देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּע
  choice: जान
  rationale: आज्ञार्थक क्रिया यहाँ केवल बौद्धिक जानकारी नहीं, बल्कि परमेश्वर को पहचानने और उसके साथ निष्ठापूर्ण संबंध रखने का भाव व्यक्त करती है।
- source_word: אֱלֹהֵי אָבִיךָ
  choice: अपने पिता के परमेश्वर
  rationale: यह रचना दाऊद से सुलैमान तक पारिवारिक और वाचा-संबंधी निरंतरता बनाए रखती है।
- source_word: וְעָבְדֵהוּ
  choice: उसकी सेवा कर
  rationale: עבד में उपासना, आज्ञाकारिता और समर्पित सेवा सभी सम्मिलित हो सकते हैं; ‘सेवा कर’ इस व्यापकता को बनाए रखता है।
- source_word: בְּלֵב שָׁלֵם
  choice: सम्पूर्ण हृदय से
  rationale: שָׁלֵם अखंडता, पूर्णता और निष्कपट समर्पण बताता है; यह शब्दावली पापरहित सिद्धता का अनावश्यक अर्थ नहीं जोड़ती।
- source_word: וּבְנֶפֶשׁ חֲפֵצָה
  choice: इच्छुक मन से
  rationale: נֶפֶשׁ यहाँ व्यक्ति के भीतरी स्व को और חֲפֵצָה तत्पर इच्छा को व्यक्त करता है। स्वाभाविक हिन्दी में ‘इच्छुक मन’ स्वेच्छापूर्ण भीतरी तत्परता संप्रेषित करता है।
- source_word: כִּי כָל לְבָבוֹת דּוֹרֵשׁ יְהוָה
  choice: क्योंकि यहोवा सब हृदयों को जाँचता है
  rationale: इस प्रसंग में דרשׁ खोजकर जाँचने या परखने के अर्थ में है, न कि किसी अज्ञात वस्तु को ढूँढ़ने के अर्थ में।
- source_word: וְכָל יֵצֶר מַחֲשָׁבוֹת מֵבִין
  choice: और विचारों की हर प्रवृत्ति को समझता है
  rationale: יֵצֶר विचारों की भीतरी रचना, झुकाव या अभिप्राय को दर्शाता है; ‘प्रवृत्ति’ मूल की अर्थगत व्यापकता और कुछ अस्पष्टता बनाए रखती है।
- source_word: אִם תִּדְרְשֶׁנּוּ
  choice: यदि तू उसे खोजेगा
  rationale: यहाँ דרשׁ परमेश्वर को भक्ति, निष्ठा और निर्भरता के साथ खोजने का भाव रखता है।
- source_word: יִמָּצֵא לָךְ
  choice: वह तुझे मिल जाएगा
  rationale: हिन्दी का यह स्वाभाविक प्रयोग मूल निफ़अल के ‘तेरे लिए पाया जाएगा’ भाव को व्यक्त करता है, बिना यह तय किए कि बल केवल मानवीय खोज पर है या परमेश्वर के स्वयं उपलब्ध होने पर।
- source_word: תַּעַזְבֶנּוּ
  choice: यदि तू उसे त्याग देगा
  rationale: עזב यहाँ वाचा-संबंधी निष्ठा छोड़ने या परित्याग करने की गंभीरता रखता है।
- source_word: יַזְנִיחֲךָ לָעַד
  choice: वह तुझे सदा के लिए ठुकरा देगा
  rationale: זנח का हिफ़ील रूप अस्वीकार करने या दूर कर देने का प्रबल भाव देता है; यह अनुवाद चेतावनी की गंभीरता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को पदवी से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ‘हृदय’ और ‘प्राण/मन’ की मानवशास्त्रीय भाषा
  choice: ‘सम्पूर्ण हृदय तथा इच्छुक मन’
  alternative: ‘सम्पूर्ण हृदय तथा इच्छुक प्राण’
  rationale: मूल לֵב और נֶפֶשׁ में भेद करता है। हिन्दी में ‘मन’ यहाँ इच्छुक भीतरी स्व को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘हृदय’ को अलग बनाए रखने से पूर्ण आंतरिक समर्पण का दोहरा चित्र पूरी तरह लुप्त नहीं होता।
- issue: יִמָּצֵא לָךְ में परमेश्वर का पाया जाना
  choice: ‘वह तुझे मिल जाएगा’ को मुख्य पाठ में रखा
  alternative: '‘वह तुझे मिल जाएगा’ का अधिक शाब्दिक विकल्प: ‘वह तुझे पाया जाएगा’ अथवा व्याख्यात्मक ‘वह अपने को तुझ पर प्रकट करेगा’'
  rationale: निफ़अल रूप निष्क्रिय अथवा आत्मवाचक छाया रखता है। स्वाभाविक हिन्दी मुख्य पाठ मूल तनाव को खुला रखता है; पादटिप्पणी शाब्दिक रूप बताती है, पर परमेश्वर की आत्म-प्रकाशना का कोई विस्तृत सिद्धान्त आरोपित नहीं करती।
- issue: वाचा-संबंधी चेतावनी की कठोरता
  choice: ‘वह तुझे सदा के लिए ठुकरा देगा’
  alternative: ‘वह तुझे सदा के लिए दूर कर देगा’
  rationale: मूल कथन की गंभीरता को नरम नहीं किया गया और न ही उससे जुड़े व्यापक धर्मवैज्ञानिक प्रश्नों का समाधान पाठ के बाहर से जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सीधा संबोधन रखा गया है। दाऊद द्वारा पुत्र सुलैमान को दिए गए व्यक्तिगत और गंभीर निर्देश के कारण ‘तू’ का प्रयोग किया गया है। ‘सम्पूर्ण हृदय’, ‘सेवा’, ‘खोजना’, ‘त्यागना’ और ‘सदा के लिए’ जैसे पद मूल की वाचा-संबंधी गंभीरता बनाए रखते हैं।
