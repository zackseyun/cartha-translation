reference: 1 Chronicles 28:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִ/כָּ֨ל בָּנַ֔/י כִּ֚י רַבִּ֣ים בָּנִ֔ים נָ֥תַן לִ֖/י יְהוָ֑ה וַ/יִּבְחַר֙ בִּ/שְׁלֹמֹ֣ה בְנִ֔/י לָ/שֶׁ֗בֶת עַל כִּסֵּ֛א מַלְכ֥וּת יְהוָ֖ה עַל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/005.yaml
  text: And from among all my sons—for Yahweh has given me many sons—he chose Solomon my son to sit on the throne of the kingdom of Yahweh over Israel[a][b].
translation:
  language: hi
  text: और मेरे सब पुत्रों में से—क्योंकि यहोवा ने मुझे बहुत-से पुत्र दिए हैं—उसने मेरे पुत्र सुलैमान को इस्राएल पर यहोवा के राज्य के सिंहासन पर बैठने के लिए चुना[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोवा के राज्य का सिंहासन’ इस बात पर बल देता है कि इस्राएल का राज्य अन्ततः यहोवा का है, यद्यपि सुलैमान उसका मानवीय राजा है।
    reason: cross_reference
lexical_decisions:
- source_word: וּמִכָּל בָּנַי
  choice: और मेरे सब पुत्रों में से
  rationale: מן चयन के लिए पूरे समूह में से किसी एक को चुनने का भाव देता है; ‘सब पुत्रों में से’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: כִּי רַבִּים בָּנִים נָתַן לִי יְהוָה
  choice: क्योंकि यहोवा ने मुझे बहुत-से पुत्र दिए हैं
  rationale: כִּי यहाँ व्याख्यात्मक उपवाक्य आरम्भ करता है। पूर्ण क्रिया का परिणाम वर्तमान में बना हुआ है, इसलिए ‘दिए हैं’ उपयुक्त है; ‘दिए’ भी सम्भव है।
- source_word: וַיִּבְחַר בִּשְׁלֹמֹה בְנִי
  choice: उसने मेरे पुत्र सुलैमान को ... चुना
  rationale: क्रिया का कर्ता पिछले उपवाक्य का यहोवा है। בחר के साथ ב चुने गए व्यक्ति को चिह्नित करता है; हिन्दी में ‘को चुना’ स्वाभाविक है।
- source_word: לָשֶׁבֶת עַל כִּסֵּא
  choice: सिंहासन पर बैठने के लिए
  rationale: राजकीय सन्दर्भ में ישב का आशय सिंहासन पर बैठकर शासन करना है; मूल की ठोस राजाभिषेक-भाषा बनाए रखी गई है।
- source_word: מַלְכוּת יְהוָה
  choice: यहोवा के राज्य
  rationale: सम्बन्धसूचक रचना राज्य को स्पष्ट रूप से यहोवा का बताती है; इसे केवल ‘इस्राएल का राज्य’ या ‘राजसिंहासन’ कहकर संक्षिप्त नहीं किया गया।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: सिंहासन और राज्य के प्रसंग में עַל शासन-अधिकार का बोध कराता है; ‘इस्राएल पर’ मूल संरचना और अर्थ दोनों सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: आधुनिक हिन्दी बाइबल-पाठकों के लिए ‘यहोवा’ परिचित और विशिष्ट नाम है; इसे सामान्य उपाधि ‘प्रभु’ से बदलने पर मूल के व्यक्तिगत वाचा-नाम का भेद मिट जाता।
- issue: ‘यहोवा के राज्य के सिंहासन’ का अर्थ
  choice: पूरी सम्बन्धसूचक अभिव्यक्ति बनाए रखना
  alternative: इस्राएल का राजसिंहासन
  rationale: मूल पाठ इस्राएल की राजसत्ता को अन्ततः यहोवा का राज्य बताता है। अनुवाद इस धर्मवैज्ञानिक तनाव को बनाए रखता है कि सुलैमान मानवीय राजा है, पर राज्य यहोवा का है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। व्याख्यात्मक उपवाक्य को डैश के बीच रखा गया है, और मूल की राजकीय तथा धर्मवैज्ञानिक अभिव्यक्ति को सरल बनाकर मिटाया नहीं गया।
