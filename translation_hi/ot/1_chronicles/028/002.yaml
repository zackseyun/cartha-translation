base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/002.yaml
  text: Then King David rose to his feet and said[a], “Hear me, my brothers and my people. It was in my heart to build a house of rest for the ark of the covenant of Yahweh, and for the footstool of our God[c][b], and I made preparations to build it.”
translation:
  language: hi
  text: तब राजा दाऊद उठ खड़ा हुआ और बोला, “मेरे भाइयो[a] और मेरी प्रजा, मेरी सुनो। मेरे मन में था कि मैं याहवे की वाचा का संदूक के लिए और हमारे परमेश्वर के चरणों की चौकी[c] के लिए विश्राम का भवन[b] बनाऊँ; और मैंने उसे बनाने की तैयारी की थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे संबंधियो”; हिब्रू में शाब्दिक रूप से “मेरे भाइयो” है—यह सार्वजनिक संबोधन में प्रयुक्त पुल्लिंग बहुवचन रूप है।
    reason: lexical_alternative
  - marker: b
    text: “विश्राम का भवन” का अर्थ “विश्राम-स्थान” भी हो सकता है; आशय संदूक के लिए एक स्थायी निवास से है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ संदूक को इस्राएल के परमेश्वर की उपस्थिति से जुड़ी परमेश्वर के चरणों की चौकी के रूप में वर्णित समझा जा सकता है; भजन 132:7 देखें।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּקָם ... עַל רַגְלָיו
  choice: अपने पैरों पर खड़ा हुआ
  rationale: हिब्रू क्रिया और उसके पूरक का स्वाभाविक हिन्दी रूप; यह दाऊद के सभा को संबोधित करने के लिए उठ खड़े होने की क्रिया को स्पष्ट रखता है।
- source_word: שְׁמָעוּנִי
  choice: मेरी सुनो
  rationale: שמע के बहुवचन आज्ञार्थक और प्रथम पुरुष प्रत्यय का संक्षिप्त, स्वाभाविक तथा गरिमापूर्ण हिन्दी रूप।
- source_word: אַחַי וְעַמִּי
  choice: मेरे भाइयो और मेरी प्रजा
  rationale: ‘भाइयो’ स्रोत के पुल्लिंग बहुवचन संबंधसूचक शब्द को बनाए रखता है, जबकि ‘मेरी प्रजा’ राष्ट्रीय समुदाय को व्यक्त करता है।
- source_word: אֲנִי עִם לְבָבִי
  choice: मेरे मन में था
  rationale: शाब्दिक हृदय-वाक्यांश को हिन्दी की स्वाभाविक अभिव्यक्ति में रखते हुए दाऊद की भीतरी इच्छा और संकल्प दोनों का भाव सुरक्षित रखा गया है।
- source_word: בֵּית מְנוּחָה
  choice: विश्राम का भवन
  rationale: ‘विश्राम का घर/भवन’ की स्रोत-छवि को बनाए रखता है और संदूक के लिए स्थायी ठिकाने का भाव देता है। धार्मिक-सार्वजनिक प्रसंग में ‘भवन’ अधिक गरिमापूर्ण है।
- source_word: לַאֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा के संदूक के लिए
  rationale: हिब्रू संबंध-श्रृंखला को स्पष्ट हिन्दी में व्यक्त करता है और दिव्य नाम को नाम के रूप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וְלַהֲדֹם רַגְלֵי אֱלֹהֵינוּ
  choice: और हमारे परमेश्वर के चरणों की चौकी के लिए
  rationale: ‘चरणों की चौकी’ मूल रूपक को सुरक्षित रखती है; वाक्य-संयोजन संदूक और चौकी के संबंध को व्याख्या द्वारा कठोरता से तय नहीं करता।
- source_word: וַהֲכִינוֹתִי לִבְנוֹת
  choice: और मैंने उसे बनाने की तैयारी भी कर ली थी
  rationale: हिफ़ील क्रिया के तैयारी करने के भाव को स्पष्ट करता है; ‘उसे’ हिन्दी में पूर्वोक्त भवन की ओर स्वाभाविक संकेत है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: संदूक और परमेश्वर के चरणों की चौकी का संबंध
  choice: मुख्य पाठ में हिब्रू के ‘और ... के लिए’ वाले विन्यास को बनाए रखा गया; टिप्पणी में संभावित समानाधिकरण स्पष्ट किया गया
  alternative: ‘अर्थात हमारे परमेश्वर के चरणों की चौकी’
  rationale: संदर्भ में चौकी संभवतः संदूक का वर्णन है, पर मुख्य पाठ में ‘अर्थात’ जोड़ने से हिब्रू की व्याकरणिक खुली बनावट अनावश्यक रूप से निश्चित हो जाती।
- issue: אַחַי का लिंग-सूचक रूप
  choice: मेरे भाइयो
  alternative: मेरे संबंधियो / मेरे भाइयो और बहनो
  rationale: स्रोत का शब्द पुल्लिंग बहुवचन है। सार्वजनिक संबोधन की व्यापकता को पादटिप्पणी में बताया गया है, मुख्य पाठ में रूप नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण सार्वजनिक-संबोधन वाला रूप अपनाया गया है। ‘प्रजा’, ‘वाचा’, ‘संदूक’, ‘चरणों की चौकी’ और ‘विश्राम का भवन’ बाइबलीय प्रसंग की गंभीरता बनाए रखते हैं, पर वाक्यरचना सामान्य पाठक के लिए सहज रखी गई है।
