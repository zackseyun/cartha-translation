  text: וְ/הָ/אֱלֹהִים֙ אָ֣מַר לִ֔/י לֹא תִבְנֶ֥ה בַ֖יִת לִ/שְׁמִ֑/י כִּ֣י אִ֧ישׁ מִלְחָמ֛וֹת אַ֖תָּה וְ/דָמִ֥ים שָׁפָֽכְתָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/003.yaml
  text: But God said to me[a], ‘You shall not build a house for my name[b], because you are a man of wars and have shed blood.’
translation:
  language: hi
  text: परन्तु परमेश्वर ने मुझसे कहा, “तू मेरे नाम के लिए एक भवन[a] नहीं बनाएगा, क्योंकि तू युद्धों का आदमी[b] है और तूने रक्त बहाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे नाम के लिए एक भवन” से आशय उस मन्दिर से है जो परमेश्वर के नाम से जुड़ा हुआ था।
    reason: cultural_note
  - marker: b
    text: इब्रानी में शाब्दिक अर्थ “युद्धों का मनुष्य” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֱלֹהִים
  choice: परन्तु परमेश्वर
  rationale: וְ यहाँ दाऊद की इच्छा और परमेश्वर की मनाही के बीच विरोध दर्शाता है; इसलिए स्वाभाविक हिन्दी में ‘परन्तु’ उपयुक्त है। אֱלֹהִים इस प्रसंग में इस्राएल के परमेश्वर को दर्शाता है।
- source_word: אָמַר לִי
  choice: मुझसे कहा
  rationale: यह אָמַר के साथ प्रथम पुरुष एकवचन के अप्रत्यक्ष कर्म का सीधा और स्वाभाविक अनुवाद है।
- source_word: לֹא תִבְנֶה
  choice: तू ... नहीं बनाएगा
  rationale: לֹא के साथ अपूर्ण क्रिया यहाँ निषेध और दैवी निर्णय—दोनों की छाया रखती है। भविष्यत् रूप वाली हिन्दी इस तनाव को ‘मत बना’ की अपेक्षा बेहतर सुरक्षित रखती है।
- source_word: בַיִת
  choice: एक भवन
  rationale: בַיִת का मूल अर्थ ‘घर/भवन’ है। प्रसंग में यह मन्दिर है, पर ‘भवन’ मूल रूपक को बनाए रखते हुए हिन्दी में परमेश्वर के नाम से जुड़े पवित्र निर्माण के लिए गरिमापूर्ण और स्वाभाविक है।
- source_word: לִשְׁמִי
  choice: मेरे नाम के लिए
  rationale: यह निकट और स्वाभाविक अनुवाद उस बाइबिलीय अभिव्यक्ति को सुरक्षित रखता है जिसमें पवित्रस्थान परमेश्वर के नाम और उपस्थिति से जुड़ा है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह परमेश्वर की मनाही का कारण प्रस्तुत करने वाले कारणवाचक संबंध को स्पष्ट रूप से व्यक्त करता है।
- source_word: אִישׁ מִלְחָמוֹת
  choice: युद्ध करने वाला मनुष्य
  rationale: शाब्दिक रूप ‘युद्धों का मनुष्य’ है। मुख्य पाठ में वर्तमान हिन्दी की सहज अभिव्यक्ति दी गई है, जबकि बहुवचन और बार-बार के युद्धों का संकेत पादटिप्पणी में सुरक्षित है।
- source_word: וְדָמִים שָׁפָכְתָּ
  choice: और तूने रक्त बहाया है
  rationale: דמים שפך का स्वाभाविक हिन्दी मुहावरा ‘रक्त बहाना’ है। पूर्ण क्रिया को ‘बहाया है’ कहना पिछले कार्य और वर्तमान प्रसंग में उसकी प्रासंगिकता को व्यक्त करता है।
theological_decisions:
- issue: दाऊद को परमेश्वर का भवन बनाने से रोके जाने का कारण
  choice: पाठ के अनुसार दाऊद का युद्ध करने वाला मनुष्य होना और रक्त बहाना इस मनाही के बताए गए कारण हैं।
  alternative: रक्त बहाना विशेष रूप से नैतिक अपराध था; अथवा युद्ध उचित होते हुए भी दाऊद केवल धार्मिक रीति से इस कार्य के अयोग्य था।
  rationale: इब्रानी पाठ यह स्पष्ट नहीं करता कि रक्तपात पापपूर्ण था, धार्मिक रीति से अयोग्य ठहराने वाला था, या शान्ति के भवन के निर्माता की भूमिका के लिए अनुपयुक्त था। अनुवाद इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किन्तु गरिमापूर्ण शैली अपनाई गई है। दैवी प्रत्यक्ष वचन में एकवचन ‘तू’ स्रोत के निकट और पारम्परिक बाइबिलीय सम्बोधन है। ‘मन्दिर’ को मुख्य पाठ में रखने के बजाय ‘भवन’ चुना गया है ताकि मूल के ‘घर/भवन’ रूपक को सुरक्षित रखा जा सके।
