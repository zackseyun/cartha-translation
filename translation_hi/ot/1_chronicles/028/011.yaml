source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן דָּוִ֣יד לִ/שְׁלֹמֹ֣ה בְנ֡/וֹ אֶת תַּבְנִ֣ית הָ/אוּלָם֩ וְֽ/אֶת בָּ֨תָּ֜י/ו וְ/גַנְזַכָּ֧י/ו וַ/עֲלִיֹּתָ֛י/ו וַ/חֲדָרָ֥י/ו הַ/פְּנִימִ֖ים וּ/בֵ֥ית הַ/כַּפֹּֽרֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/011.yaml
  text: Then David gave to Solomon his son the plan of the portico[a], its houses, its treasuries, its upper rooms, its inner chambers, and the house of the mercy seat.
translation:
  language: hi
  text: तब दाऊद ने अपने पुत्र सुलैमान को द्वारमण्डप की योजना दी—उसके भवनों, उसके भण्डारों, उसके ऊपरी कक्षों, उसके भीतरी कमरों और प्रायश्चित्त-आवरण[a] के कक्ष की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अनुग्रहासन।” इब्रानी शब्द כַּפֹּרֶת परमपवित्र स्थान में रखे वाचा के सन्दूक के आवरण को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּבְנִית
  choice: योजना
  rationale: मन्दिर-निर्माण के सन्दर्भ में यह शब्द निर्धारित नमूने, रूपरेखा या वास्तु-योजना को दर्शाता है; ‘योजना’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: הָאוּלָם
  choice: द्वारमण्डप
  rationale: यह किसी विशाल भवन के प्रवेश-भाग में बने बरामदे या मण्डप को दर्शाता है; मन्दिर के वास्तु-सन्दर्भ में ‘द्वारमण्डप’ सटीक और सहज है।
- source_word: בָּתָּיו
  choice: उसके भवनों
  rationale: शाब्दिक अर्थ ‘उसके घर’ है, पर यहाँ बहुवचन मन्दिर-परिसर की संरचनाओं या भवन-भागों को सूचित करता है; ‘भवनों’ से यह वास्तु-सन्दर्भ स्पष्ट रहता है।
- source_word: גַנְזַכָּיו
  choice: भण्डारों
  rationale: यह बहुमूल्य या समर्पित वस्तुओं को रखने के स्थानों के लिए प्रयुक्त है; ‘भण्डारों’ में कोष और भण्डार-कक्ष दोनों का आशय आ सकता है।
- source_word: עֲלִיֹּתָיו
  choice: ऊपरी कक्षों
  rationale: यह ऊपर स्थित कमरों या कक्षों को दर्शाता है; ‘ऊपरी कक्ष’ स्पष्ट और वास्तु-विवरण के अनुकूल है।
- source_word: חֲדָרָיו הַפְּנִימִים
  choice: भीतरी कमरों
  rationale: मूल पाठ भीतर स्थित कमरों को बताता है; ‘भीतरी’ किसी अनावश्यक अतिशयोक्ति के बिना विशेषण का अर्थ सुरक्षित रखता है।
- source_word: בֵית הַכַּפֹּרֶת
  choice: प्रायश्चित्त-आवरण के कक्ष
  rationale: शाब्दिक संरचना ‘कप्पोरेत का घर’ है। यहाँ ‘कक्ष’ वास्तु-सन्दर्भ में स्वाभाविक है, और כַּפֹּרֶת वाचा के सन्दूक के आवरण को दर्शाता है।
- source_word: וַיִּתֵּן
  choice: तब ... दी
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: मन्दिर-सम्बन्धी शब्द כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त-आवरण
  alternative: अनुग्रहासन
  rationale: यह शब्द परमपवित्र स्थान में वाचा के सन्दूक के आवरण को दर्शाता है और प्रायश्चित्त-विधि से जुड़ा है। ‘प्रायश्चित्त-आवरण’ वस्तु तथा उसके धार्मिक कार्य दोनों को स्पष्ट करता है; पारम्परिक ‘अनुग्रहासन’ को पादटिप्पणी में रखकर वास्तविक अनुवाद-विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किन्तु सामान्य पाठक के लिए बोधगम्य रखी गई है। वास्तु-शब्दावली में ‘द्वारमण्डप’, ‘भवन’, ‘कक्ष’ और ‘कमरे’ का प्रयोग प्रसंगानुकूल भेद बनाए रखता है।
