source:
  edition: WLC
  text: רְאֵ֣ה עַתָּ֗ה כִּֽי יְהוָ֛ה בָּ֧חַר בְּ/ךָ֛ לִ/בְנֽוֹת בַּ֥יִת לַ/מִּקְדָּ֖שׁ חֲזַ֥ק וַ/עֲשֵֽׂה׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/010.yaml
  text: See now[a], for Yahweh has chosen you to build a house for the sanctuary. Be strong[b], and do it.
translation:
  language: hi
  text: अब ध्यान दे[a], क्योंकि यहोवा ने तुझे पवित्रस्थान के लिए एक भवन बनाने के लिए चुना है। दृढ़ हो और यह काम कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अब विचार कर” अथवा “अब सावधान हो।” आरम्भिक आज्ञा केवल आँखों से देखने की नहीं, बल्कि ध्यान देकर विचार करने की पुकार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רְאֵה עַתָּה
  choice: अब ध्यान दे
  rationale: यह आज्ञार्थक पद केवल शारीरिक रूप से देखने का नहीं, बल्कि बात पर सावधानी से ध्यान देने और विचार करने का आह्वान करता है; ‘अब’ आग्रह की तात्कालिकता बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आगे दिए गए कारण को आरंभ करता है—सुलैमान को ध्यान देने और कार्य करने का आधार यहोवा का चुनाव है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בָּחַר בְּךָ
  choice: तुझे ... चुना है
  rationale: पूर्ण हो चुके दिव्य चुनाव और उसके वर्तमान दायित्व, दोनों को हिन्दी का पूर्णकाल स्वाभाविक रूप से व्यक्त करता है। एक व्यक्ति से सीधे संबोधन के कारण ‘तुझे’ रखा गया है।
- source_word: לִבְנוֹת בַּיִת לַמִּקְדָּשׁ
  choice: पवित्रस्थान के लिए भवन बनाने को
  rationale: ‘भवन’ בַּיִת का अर्थ बनाए रखता है और ‘पवित्रस्थान के लिए’ לַמִּקְדָּשׁ की संरचना को बिना केवल ‘मन्दिर’ कहकर दोनों संज्ञाओं को मिला देने के व्यक्त करता है।
- source_word: חֲזַק
  choice: दृढ़ हो
  rationale: यह निर्माण-कार्य के लिए संकल्प और सामर्थ्य का आदेश है; ‘दृढ़ हो’ आधुनिक हिन्दी में प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: וַעֲשֵׂה
  choice: और इसे पूरा कर
  rationale: עשה का मूल अर्थ ‘करना’ है; यहाँ संदर्भित निर्माण-कार्य को अंजाम देने का भाव है। ‘पूरा कर’ हिन्दी में उस निहित कर्म और कार्यसिद्धि को स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप से प्रस्तुत किया गया है।
- issue: בַּיִת לַמִּקְדָּשׁ की व्याख्या
  choice: पवित्रस्थान के लिए भवन
  alternative: मन्दिर
  rationale: प्रसंग सुलैमान के मन्दिर का है, फिर भी मूल में ‘भवन’ और ‘पवित्रस्थान’ दोनों पद हैं। चुना हुआ रूप इस संरचना और उसके धार्मिक प्रयोजन को सुरक्षित रखता है।
- issue: וַעֲשֵׂה में निहित कर्म
  choice: इसे पूरा कर
  alternative: और कर
  rationale: इब्रानी में व्यापक क्रिया का कर्म प्रसंग से समझा जाता है। हिन्दी में ‘इसे’ निर्माण-कार्य की ओर संकेत करता है और ‘पूरा कर’ आदेश का स्वाभाविक आशय देता है, बिना कोई नया धार्मिक सिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, प्रत्यक्ष एकवचन संबोधन और गरिमापूर्ण आज्ञार्थक शैली। ‘भवन’ और ‘पवित्रस्थान’ मूल की दो संज्ञाओं को अलग रखते हैं; भाषा सामान्य पाठक के लिए सहज रखी गई है।
