  text: וְ/הִנֵּ֗ה מַחְלְקוֹת֙ הַ/כֹּהֲנִ֣ים וְ/הַ/לְוִיִּ֔ם לְ/כָל עֲבוֹדַ֖ת בֵּ֣ית הָ/אֱלֹהִ֑ים וְ/עִמְּ/ךָ֙ בְ/כָל מְלָאכָ֜ה לְ/כָל נָדִ֤יב בַּֽ/חָכְמָה֙ לְ/כָל עֲבוֹדָ֔ה וְ/הַ/שָּׂרִ֥ים וְ/כָל הָ/עָ֖ם לְ/כָל דְּבָרֶֽי/ךָ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/021.yaml
  text: And behold[a], the divisions of the priests and the Levites are for all the service of the house of God, and with you in all the work will be every willing man skilled in wisdom for every kind of service; the officials also, and all the people[b], will be wholly at your command.
translation:
  language: hi
  text: और देखो, परमेश्वर के भवन की सारी सेवा के लिए याजकों और लेवियों के दल हैं। हर काम में तुम्हारे साथ हर वह इच्छुक पुरुष होगा जो हर प्रकार की सेवा के लिए कुशल है[a]। अधिकारी और सारी प्रजा भी तुम्हारी हर बात मानने को तैयार रहेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर वह स्वयंसेवक जो बुद्धि में निपुण है।” इब्रानी में शाब्दिक रूप से “बुद्धि में हर इच्छुक पुरुष” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम्हारी सब बातों के लिए”; अर्थात् तुम्हारे सभी निर्देशों या मामलों को पूरा करने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: ध्यान आकर्षित करने वाले इब्रानी प्रयोग का बल बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מַחְלְקוֹת
  choice: दल
  rationale: याजकों और लेवियों के व्यवस्थित सेवा-समूहों को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֲנִים וְהַלְוִיִּם
  choice: याजकों और लेवियों
  rationale: मन्दिर-सेवा से जुड़े दोनों विशिष्ट समूहों को स्पष्ट रूप से बनाए रखता है।
- source_word: לְכָל עֲבוֹדַת בֵּית הָאֱלֹהִים
  choice: परमेश्वर के भवन की सारी सेवा के लिए
  rationale: स्रोत के ठोस पद ‘परमेश्वर का भवन’ और सेवा के पूर्ण विस्तार—दोनों को सुरक्षित रखता है।
- source_word: וְעִמְּךָ בְכָל מְלָאכָה
  choice: हर काम में तुम्हारे साथ
  rationale: सुलैमान को मिलने वाले सहयोग और काम के व्यापक क्षेत्र को सीधे व्यक्त करता है।
- source_word: לְכָל נָדִיב
  choice: हर वह इच्छुक पुरुष
  rationale: नָדִיב की स्वेच्छा/तत्परता तथा इब्रानी के पुल्लिंग एकवचन रूप, दोनों को दर्शाता है।
- source_word: בַּחָכְמָה
  choice: कुशल
  rationale: इस कारीगरी और सेवा-संदर्भ में חָכְמָה के व्यावहारिक ज्ञान अथवा दक्षता के भाव को स्वाभाविक हिन्दी में देता है।
- source_word: לְכָל עֲבוֹדָה
  choice: हर प्रकार की सेवा के लिए
  rationale: विभिन्न प्रकार की सेवाओं के व्यापक दायरे को व्यक्त करता है।
- source_word: וְהַשָּׂרִים
  choice: अधिकारी
  rationale: राजकीय-प्रशासनिक संदर्भ में शासकीय अगुओं के लिए आधुनिक और उपयुक्त पद है।
- source_word: וְכָל הָעָם
  choice: सारी प्रजा
  rationale: समूचे जनसमुदाय की सम्मिलित तत्परता को दर्शाता है।
- source_word: לְכָל דְּבָרֶיךָ
  choice: तुम्हारी हर बात मानने को तैयार
  rationale: शाब्दिक ‘तुम्हारी सब बातों के लिए’ का प्रसंगगत अर्थ—निर्देशों को पूरा करने की तत्परता—स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: נָדִיב में लिंग-सूचक उल्लेख
  choice: हर वह इच्छुक पुरुष
  alternative: हर इच्छुक व्यक्ति / हर स्वयंसेवक
  rationale: इब्रानी का पुल्लिंग एकवचन रूप बनाए रखा गया है, जबकि ‘इच्छुक’ उसकी स्वैच्छिक तत्परता स्पष्ट करता है।
- issue: בֵּית הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर का भवन
  alternative: मन्दिर
  rationale: स्रोत के ठोस उपासना-संबंधी रूपक को सुरक्षित रखा गया है; प्रसंग में मन्दिर अभिप्रेत है, पर उसे व्याख्यात्मक संक्षेप से नहीं बदला गया।
- issue: לְכָל דְּבָרֶיךָ की आज्ञार्थक प्रसंगगत शक्ति
  choice: तुम्हारी हर बात मानने को तैयार
  alternative: तुम्हारी सब बातों के लिए / तुम्हारे हर मामले में
  rationale: यह वाक्य अधिकारियों और प्रजा की सुलैमान के निर्देशों के प्रति उपलब्धता बताता है; अनुवाद इस अर्थ को स्पष्ट करता है, और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज स्तर रखा गया है। ‘परमेश्वर का भवन’, ‘याजक’, ‘लेवी’ और ‘प्रजा’ जैसे प्रचलित बाइबलीय पद संस्थागत विशिष्टता बनाए रखते हैं; वाक्य-विन्यास को हिन्दी की स्वाभाविक पठनीयता के अनुसार बाँटा गया है।
