source:
  edition: WLC
  text: וַ/יַּקְהֵ֣ל דָּוִ֣יד אֶת כָּל שָׂרֵ֣י יִשְׂרָאֵ֡ל שָׂרֵ֣י הַ/שְּׁבָטִ֣ים וְ/שָׂרֵ֣י הַ/מַּחְלְק֣וֹת הַ/מְשָׁרְתִ֪ים אֶת הַ/מֶּ֟לֶךְ וְ/שָׂרֵ֣י הָ/אֲלָפִ֣ים וְ/שָׂרֵ֣י הַ/מֵּא֡וֹת וְ/שָׂרֵ֣י כָל רְכוּשׁ וּ/מִקְנֶה֩ לַ/מֶּ֨לֶךְ וּ/לְ/בָנָ֜י/ו עִם הַ/סָּרִיסִ֧ים וְ/הַ/גִּבּוֹרִ֛ים וּֽ/לְ/כָל גִּבּ֥וֹר חָ֖יִל אֶל יְרוּשָׁלִָֽם־־־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/001.yaml
  text: 'Then David assembled at Jerusalem all the leaders of Israel: the leaders of the tribes[a], the leaders of the divisions that served the king, the commanders of thousands and of hundreds, and the leaders over all the property and livestock belonging to the king and to his sons, together with the officials, the mighty men, and every mighty man of valor.'
translation:
  language: hi
  text: तब दाऊद ने इस्राएल के सभी अगुओं को यरूशलेम में इकट्ठा किया—गोत्रों के अगुओं को, राजा की सेवा करने वाले दलों के अगुओं को, हज़ारों और सैकड़ों के सेनापतियों को, राजा और उसके पुत्रों की सारी सम्पत्ति और पशुधन की देखरेख करने वाले अगुओं को, साथ ही राजदरबार के अधिकारियों[a], वीर योद्धाओं और प्रत्येक पराक्रमी योद्धा को।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खोजे”; इब्रानी शब्द शाब्दिक रूप से नपुंसक बनाए गए पुरुषों के लिए, अथवा अधिक सामान्य अर्थ में राजदरबार के अधिकारियों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप किसी औपचारिक सभा के लिए लोगों को एकत्र करने का बोध देता है; आधुनिक हिन्दी में यह सहज और सटीक है।
- source_word: שָׂרֵי יִשְׂרָאֵל / שָׂרֵי הַשְּׁבָטִים
  choice: इस्राएल के सभी अगुओं / गोत्रों के अगुओं
  rationale: שַׂר का अर्थ प्रसंगानुसार अगुआ, अधिकारी या सेनापति हो सकता है। व्यापक प्रशासनिक वर्गों के लिए ‘अगुआ’ स्वाभाविक है, जबकि सैन्य इकाइयों के साथ ‘सेनापति’ अधिक सटीक है।
- source_word: הַמַּחְלְקוֹת הַמְשָׁרְתִים אֶת הַמֶּלֶךְ
  choice: राजा की सेवा करने वाले दल
  rationale: מַחְלְקוֹת संगठित सेवा-दलों को और participle מְשָׁרְתִים उनकी निरंतर राजकीय सेवा को दर्शाता है।
- source_word: שָׂרֵי הָאֲלָפִים וְשָׂרֵי הַמֵּאוֹת
  choice: हज़ारों और सैकड़ों के सेनापति
  rationale: यह सैन्य-प्रशासनिक पदनामों की समानांतर जोड़ी है। संख्याओं को स्रोत की तरह रखा गया है, बिना यह तय किए कि वे ठीक संख्या हैं या इकाइयों के नाम।
- source_word: רְכוּשׁ וּמִקְנֶה
  choice: सम्पत्ति और पशुधन
  rationale: רְכוּשׁ चल सम्पत्ति अथवा धन-दौलत का व्यापक शब्द है और מִקְנֶה सामान्यतः पाले गए पशुओं को दर्शाता है।
- source_word: שָׂרֵי כָל רְכוּשׁ וּמִקְנֶה
  choice: सारी सम्पत्ति और पशुधन की देखरेख करने वाले अगुए
  rationale: शाब्दिक ‘सम्पत्ति के अगुए’ हिन्दी में अस्वाभाविक है; ‘देखरेख करने वाले’ उनके प्रशासनिक अधिकार को स्पष्ट करता है।
- source_word: הַסָּרִיסִים
  choice: राजदरबार के अधिकारी
  rationale: סָרִיס राजदरबार के पदाधिकारी अथवा शाब्दिक रूप से नपुंसक बनाए गए व्यक्ति को सूचित कर सकता है। प्रशासनिक सूची में पदगत अर्थ मुख्य पाठ में उपयुक्त है, और दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: הַגִּבּוֹרִים וּלְכָל גִּבּוֹר חָיִל
  choice: वीर योद्धाओं और प्रत्येक पराक्रमी योद्धा
  rationale: दो निकटवर्ती पर अलग पदबंधों का भेद ‘वीर’ और ‘पराक्रमी’ से रखा गया है; חַיִל में सामर्थ्य और युद्ध-कौशल का भाव है।
theological_decisions:
- issue: הַסָּרִיסִים में पद अथवा शारीरिक स्थिति
  choice: मुख्य पाठ में ‘राजदरबार के अधिकारी’, पादटिप्पणी में ‘खोजे’
  alternative: मुख्य पाठ में ‘खोजे’
  rationale: प्रशासनिक सूची पदगत अर्थ का समर्थन करती है, पर इब्रानी शब्द की वास्तविक lexical ambiguity को पादटिप्पणी में बनाए रखना आवश्यक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल हिन्दी। सूची की औपचारिक संरचना बनाए रखते हुए अनावश्यक रूप से पुरातन पदावली से बचा गया है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे उसका संबंध है।
