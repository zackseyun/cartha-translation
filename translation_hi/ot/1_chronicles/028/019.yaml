  text: הַ/כֹּ֥ל בִּ/כְתָ֛ב מִ/יַּ֥ד יְהוָ֖ה עָלַ֣/י הִשְׂכִּ֑יל כֹּ֖ל מַלְאֲכ֥וֹת הַ/תַּבְנִֽית׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/019.yaml
  text: All this he made clear to me in writing from the hand of Yahweh[b][a], all the works of the pattern.
translation:
  language: hi
  text: याहवे के हाथ से, लिखित रूप में, उसने मुझे यह सब समझाया—उस रूपरेखा[b] के सभी कार्य।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का हाथ मुझ पर था और उसने मुझे उस रूपरेखा के सभी कार्य समझाए।”
    reason: alternative_reading
  - marker: b
    text: “रूपरेखा” का अनुवाद “नमूना” या “योजना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּל
  choice: यह सब
  rationale: संदर्भ में दाऊद अभी बताए गए भवन-सम्बन्धी पूरे प्रबंध की ओर संकेत करता है; इसलिए यह प्रयोग כֹּל की समग्रता और प्रसंगगत संकेत, दोनों को व्यक्त करता है।
- source_word: בִּכְתָב
  choice: लिखित रूप में
  rationale: בְּ और כְּתָב का मेल बताता है कि यह बात मौखिक रूप से ही नहीं, बल्कि लेखबद्ध रूप में दी गई थी।
- source_word: מִיַּד יְהוָה
  choice: याहवे ने अपने हाथ से
  rationale: इब्रानी मुहावरे में प्रत्यक्ष दिव्य कर्तृत्व का भाव है। स्वाभाविक हिन्दी वाक्य में इसे सक्रिय रूप देकर रखा गया है, जबकि वैकल्पिक पद-संबंध को पादटिप्पणी में सुरक्षित किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: עָלַי הִשְׂכִּיל
  choice: मुझे समझा दिया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ—समझ प्रदान करना—सरल और वर्तमान हिन्दी में व्यक्त होता है। संक्षिप्त इब्रानी वाक्य-विन्यास की दूसरी सम्भव व्याख्या पादटिप्पणी में दी गई है।
- source_word: כֹּל מַלְאֲכוֹת
  choice: सारे काम
  rationale: यह निर्माण-योजना को पूरा करने में सम्मिलित सभी कार्यों या कारीगरी के अंगों को व्यापक रूप से समेटता है।
- source_word: הַתַּבְנִית
  choice: नमूना
  rationale: תַּבְנִית किसी प्रतिरूप, योजना या अभिकल्प को सूचित कर सकता है। ‘नमूना’ मूल अर्थ की व्यापकता बनाए रखता है; अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
theological_decisions:
- issue: עָלַי הִשְׂכִּיל के संक्षिप्त वाक्य-विन्यास को कैसे समझा जाए
  choice: याहवे को निहित कर्ता मानकर ‘याहवे ने अपने हाथ से ... मुझे समझा दिया’
  alternative: ‘याहवे का हाथ मुझ पर था और उसने मुझे नमूने के सारे काम समझाए’
  rationale: इब्रानी पदबंध संक्षिप्त है और ‘मुझ पर’ को ‘याहवे के हाथ’ से जोड़ने की भी सम्भावना रखता है। मुख्य पाठ प्रत्यक्ष दिव्य कर्तृत्व और लिखित माध्यम को स्वाभाविक हिन्दी में देता है; दूसरी सम्भव संरचना पादटिप्पणी में रखी गई है, ताकि अस्पष्टता को सिद्धान्तगत रूप से जबरन हल न किया जाए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य के बीच के डैश ‘यह सब’ को ‘नमूने से जुड़े सारे काम’ से स्पष्ट करते हैं। दिव्य नाम को ‘याहवे’ के रूप में रखा गया है और मूल की वास्तविक वाक्यगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
