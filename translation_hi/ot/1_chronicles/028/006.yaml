  text: And he said to me[a], ‘Solomon your son—he will build my house and my courts, for I have chosen him for myself as a son, and I will be to him as a father.’
translation:
  language: hi
  text: और उसने मुझसे कहा, “तेरा पुत्र सुलैमान—वही मेरा भवन और मेरे आँगन बनाएगा, क्योंकि मैंने उसे अपने लिए पुत्र के रूप में चुना है, और मैं उसका पिता होऊँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक मुहावरेदार रूप: “मैंने उसे अपने पुत्र के रूप में चुना है, और मैं उसका पिता होऊँगा।”'
    reason: לִי לְבֵן और לוֹ לְאָב की अधिक स्वाभाविक हिन्दी अभिव्यक्ति।
lexical_decisions:
