- source_word: יִבְנֶה בֵיתִי
  choice: मेरा भवन बनाएगा
  rationale: בֵּית का मूल अर्थ ‘घर/भवन’ है; यहाँ मंदिर-संदर्भ स्पष्ट है, इसलिए ‘भवन’ उसके धार्मिक संदर्भ को बिना ‘मंदिर’ जोड़कर व्याख्यायित किए व्यक्त करता है।
- source_word: וַחֲצֵרוֹתָי
  choice: और मेरे आँगन
