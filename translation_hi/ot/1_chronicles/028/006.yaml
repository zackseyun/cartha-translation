- source_word: כִּי בָחַרְתִּי בוֹ
  choice: क्योंकि मैंने उसे ... चुना है
  rationale: כִּי कारण बताता है और पूर्ण क्रिया का वर्तमान तक प्रभाव ‘चुना है’ में व्यक्त होता है।
- source_word: לִי לְבֵן
  choice: अपने लिए पुत्र के रूप में
  rationale: दोनों לְ संबंधों को यथासंभव बनाए रखते हुए यह चयन और पुत्रत्व के संबंध को व्यक्त करता है, बिना उसे केवल साधारण स्वामित्व में समेटे।
- source_word: וַאֲנִי אֶהְיֶה לוֹ לְאָב
  choice: और मैं उसके लिए पिता होऊँगा
  rationale: हिब्रू की ‘उसके लिए पिता’ वाली वाचागत संरचना और वाचाई संबंध को बनाए रखा गया है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर और सुलैमान के बीच पिता-पुत्र की भाषा
  choice: ‘अपने लिए पुत्र के रूप में’ और ‘उसके लिए पिता होऊँगा’ को सीधे बनाए रखना
  alternative: ‘मैंने उसे अपना पुत्र होने के लिए चुना है, और मैं उसका पिता होऊँगा’
  rationale: यह राजकीय वाचा की पुत्र-पिता भाषा को न तो कमजोर करता है, न तत्काल संदर्भ में बाद की धर्मवैज्ञानिक व्याख्याएँ आरोपित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। दाऊद से सीधे संबोधन के कारण एकवचन ‘तेरा’ रखा गया है। ‘वही’ हिब्रू के बलाघात को व्यक्त करता है।
