base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/015.yaml
  text: and the weight for the lampstands of gold and their lamps of gold[a], by the weight of each lampstand and its lamps; and for the lampstands of silver, by weight for each lampstand and its lamps, according to the service of each lampstand.
translation:
  language: hi
  text: और सोने की दीवटों और उनके सोने के दीपकों के लिए वज़न—प्रत्येक दीवट और उसके दीपकों के वज़न के अनुसार; और चाँदी की दीवटों के लिए, प्रत्येक दीवट और उसके दीपकों के लिए वज़न, प्रत्येक दीवट की सेवा के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁקָל
  choice: तौल
  rationale: मन्दिर की वस्तुओं के लिए धातु की भार-मात्रा के संदर्भ में ‘तौल’ स्वाभाविक है और नापे गए भार का भाव व्यक्त करता है।
- source_word: מְנֹרוֹת
  choice: दीवटें
  rationale: यह शब्द केवल दीपक नहीं, बल्कि दीपकों को धारण करने वाली दीवट को दर्शाता है; ‘दीवट’ आधुनिक हिन्दी में वस्तु का भेद स्पष्ट रखता है।
- source_word: נֵרֹתֵיהֶם / נֵרֹתֶיהָ
  choice: दीपक
  rationale: ये दीवट पर रखे जाने वाले अलग-अलग दीपक हैं; इस अनुवाद से दीवट और दीपक का अंतर बना रहता है।
- source_word: זָהָב
  choice: सोना
  rationale: मूल पाठ में दीवटों और उनके दीपकों—दोनों की सामग्री सोना बताई गई है, इसलिए दोनों संबंधों को स्पष्ट रखा गया है।
- source_word: בְּמִשְׁקַל מְנוֹרָה וּמְנוֹרָה
  choice: एक-एक दीवट और उसके दीपकों के लिए निर्धारित तौल
  rationale: ‘दीवट और दीवट’ की इब्रानी पुनरुक्ति वितरणात्मक है; ‘एक-एक’ प्रत्येक वस्तु के लिए अलग भार निर्धारित होने का भाव सहज हिन्दी में देता है।
- source_word: וְלִמְנֹרוֹת הַכֶּסֶף
  choice: और चाँदी की दीवटों के लिए
  rationale: यह सोने की दीवटों के समानांतर वाक्यांश है और सामग्री का अंतर स्पष्ट करता है।
- source_word: כַּעֲבוֹדַת מְנוֹרָה וּמְנוֹרָה
  choice: हर दीवट के काम के अनुसार
  rationale: עֲבוֹדָה यहाँ प्रत्येक दीवट के काम, उपयोग या नियत सेवा को सूचित करता है; ‘काम’ हिन्दी में स्वाभाविक रहते हुए कार्यगत अर्थ को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-जैसे मूल वाक्य-विन्यास के अनुरूप रखी गई है। ‘दीवट’ और ‘दीपक’ का भेद स्पष्ट है; ‘काम’ को इस प्रकार चुना गया है कि धार्मिक सेवा और व्यावहारिक उपयोग—दोनों संभावित अर्थ अनावश्यक रूप से संकुचित न हों।
