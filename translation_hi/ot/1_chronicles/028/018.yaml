source:
  edition: WLC
  text: וּ/לְ/מִזְבַּ֧ח הַ/קְּטֹ֛רֶת זָהָ֥ב מְזֻקָּ֖ק בַּ/מִּשְׁקָ֑ל וּ/לְ/תַבְנִ֣ית הַ/מֶּרְכָּבָ֗ה הַ/כְּרֻבִ֤ים זָהָב֙ לְ/פֹ֣רְשִׂ֔ים וְ/סֹכְכִ֖ים עַל אֲר֥וֹן בְּרִית יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/018.yaml
  text: and for the altar of incense[a], refined gold by weight; and for the pattern of the chariot[b], the cherubim of gold spreading out their wings and overshadowing the ark of the covenant of Yahweh.
translation:
  language: hi
  text: और धूप की वेदी के लिए भार के अनुसार परिष्कृत सोना; और रथ की रूपरेखा[a] के लिए सोने के वे करूब, जो अपने पंख फैलाए हुए यहोवा की वाचा के संदूक पर छाया करते हुए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रथ का नमूना।” इब्रानी पद कठिन है; सम्भव है कि इसका संकेत संदूक से जुड़ी करूबों वाली रथ-सिंहासन संरचना की ओर हो।
    reason: alternative_reading
lexical_decisions:
- source_word: מִזְבַּח הַקְּטֹרֶת
  choice: धूप की वेदी
  rationale: यह सीधा संबंधवाचक पद है और मंदिर की जानी-पहचानी धूप-वेदी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זָהָב מְזֻקָּק
  choice: कुंदन सोना
  rationale: מְזֻקָּק परिशोधित किए हुए सोने को दर्शाता है; ‘कुंदन सोना’ आधुनिक हिन्दी में परिष्कृत उच्च-शुद्धता वाले सोने का सहज पद है।
- source_word: בַּמִּשְׁקָל
  choice: तौला हुआ
  rationale: यह निर्धारित भार के अनुसार सोना दिए जाने का भाव स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: תַבְנִית
  choice: नमूना
  rationale: शब्द रूपरेखा, प्रतिरूप या नमूने को सूचित कर सकता है; ‘नमूना’ इस प्रसंग में ठोस भी है और मूल की कुछ व्यापकता भी बनाए रखता है।
- source_word: הַמֶּרְכָּבָה
  choice: रथ
  rationale: संज्ञा का सामान्य अर्थ ‘रथ’ है। कठिन मंदिर-संदर्भ को व्याख्यात्मक ‘रथ-सिंहासन’ बनाकर निश्चित करने के बजाय मूल रूपक को रखा गया है।
- source_word: הַכְּרֻבִים זָהָב
  choice: सोने के करूब
  rationale: तकनीकी बाइबलीय पद ‘करूब’ को रखा गया है और זָהָב को उनकी सामग्री के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לְפֹרְשִׂים
  choice: अपने पंख फैलाकर
  rationale: क्रिया का अर्थ फैलाना है; करूबों के प्रसंग में निहित कर्म ‘पंख’ स्पष्टता के लिए जोड़ा गया है।
- source_word: וְסֹכְכִים
  choice: छाया करते थे
  rationale: סכך ढकने या ऊपर छाया करने का भाव देता है; यह वाचा के संदूक पर फैले करूबों के पंखों की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का संदूक
  rationale: हिन्दी की स्वाभाविक संबंध-रचना में पूरी पद-शृंखला व्यक्त की गई है और יְהוָה को व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: הַמֶּרְכָּבָה और करूबों के बीच संबंध
  choice: रथ के नमूने के लिए सोने के करूब
  alternative: करूबों से बने रथ-सिंहासन के नमूने के लिए
  rationale: इब्रानी वाक्य-विन्यास कठिन है और सम्भवतः संदूक से जुड़ी करूब-सिंहासन संरचना की ओर संकेत करता है। मुख्य पाठ ‘रथ’ को स्पष्ट रूप से रखता है और अधिक निश्चित व्याख्या को टिप्पणी में छोड़ता है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला नाम-रूप ‘यहोवा’ चुना गया है; ‘याहवे’ सम्भावित उच्चारण के निकट वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पूर्ववर्ती सूची की निरंतरता में आरम्भ होता है, इसलिए आरम्भिक ‘और’ बनाए रखा गया है। मूल में ‘पंख’ प्रत्यक्ष नहीं है, पर करूबों की परिचित संदूक-छवि और क्रिया के आशय को स्पष्ट करने के लिए इसे जोड़ा गया है।
