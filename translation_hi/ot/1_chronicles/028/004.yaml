  text: וַ/יִּבְחַ֡ר יְהוָ֣ה אֱלֹהֵי֩ יִשְׂרָאֵ֨ל בִּ֜/י מִ/כֹּ֣ל בֵּית אָבִ֗/י לִ/הְי֨וֹת לְ/מֶ֤לֶךְ עַל יִשְׂרָאֵל֙ לְ/עוֹלָ֔ם כִּ֤י בִֽ/יהוּדָה֙ בָּחַ֣ר לְ/נָגִ֔יד וּ/בְ/בֵ֥ית יְהוּדָ֖ה בֵּ֣ית אָבִ֑/י וּ/בִ/בְנֵ֣י אָבִ֔/י בִּ֣/י רָצָ֔ה לְ/הַמְלִ֖יךְ עַל כָּל יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/004.yaml
  text: Yet Yahweh[a], the God of Israel, chose me from all my father's house to be king over Israel forever; for he chose Judah as leader, and in the house of Judah, my father's house, and among my father's sons[b], he took pleasure in me to make me king over all Israel.
translation:
  language: hi
  text: फिर भी इस्राएल के परमेश्वर, यहोवा ने मेरे पिता के सारे घराने में से मुझे चुना कि मैं सदा के लिए इस्राएल का राजा बनूँ; क्योंकि उसने यहूदा को अगुआ चुना, और यहूदा के घराने के भीतर मेरे पिता के घराने में, और मेरे पिता के पुत्रों में से, वह मुझसे प्रसन्न हुआ कि मुझे सारे इस्राएल का राजा बनाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सदा के लिए” हिब्रू शब्द का अनुवाद है, जो स्थायी या चिरस्थायी अवधि का संकेत दे सकता है; यहाँ यह दाऊद के राजवंश के संदर्भ में है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से ईश्वरीय व्यक्तिगत नाम को दर्शाता है; इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּבְחַר / בָּחַר
  choice: चुन लिया / चुना
  rationale: בחר के चयन के अर्थ और पद में इसकी पुनरावृत्ति को बनाए रखता है।
- source_word: בִּי מִכֹּל בֵּית אָבִי
  choice: मेरे पिता के सारे घराने में से मुझे
  rationale: मूल वाक्य के अनुसार बड़े पैतृक घराने के भीतर से दाऊद के चयन को स्पष्ट करता है।
- source_word: לִהְיוֹת לְמֶלֶךְ
  choice: कि मैं ... राजा बनूँ
  rationale: नियुक्ति अथवा परिणामी पद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְעוֹלָם
  choice: सदा के लिए
  rationale: दाऊदी राजत्व की स्थायी अथवा वंशगत अवधि का भार बनाए रखता है, बिना इसे केवल दाऊद के जीवनकाल तक सीमित किए।
- source_word: לְנָגִיד
  choice: अगुआ होने के लिए
  rationale: נָגִיד के नेतृत्व और अधिकार को व्यक्त करता है, जबकि ‘राजकुमार’ जैसी आधुनिक संकीर्ण वंशगत धारणा से बचता है।
- source_word: וּבְבֵית יְהוּדָה בֵּית אָבִי
  choice: और यहूदा के घराने में मेरे पिता के घराने को
  rationale: हिब्रू בְ को ‘में’ के रूप में रखते हुए चयन की क्रमिक संकीर्णता—यहूदा, फिर पिता का घराना—दिखाता है।
- source_word: וּבִבְנֵי אָבִי
  choice: और मेरे पिता के पुत्रों में से
  rationale: मूल की वंशावली-संबंधी स्पष्ट अभिव्यक्ति को ‘मेरे भाइयों’ में सरल किए बिना सुरक्षित रखता है।
- source_word: בִּי רָצָה
  choice: मुझसे प्रसन्न हुआ
  rationale: רצה में निहित अनुकूल प्रसन्नता को स्वाभाविक हिन्दी में व्यक्त करता है और इसे केवल ‘चुना’ का पर्याय नहीं बनाता।
- source_word: לְהַמְלִיךְ
  choice: मुझे ... राजा बनाए
  rationale: מלך के हिफ़ील रूप की कारक शक्ति—किसी को राजा बनाना—को स्पष्ट रखता है।
- source_word: עַל כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल का
  rationale: सम्पूर्ण इस्राएल पर राजकीय अधिकार का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: לְעוֹלָם की अवधि
  choice: सदा के लिए
  alternative: दीर्घकाल तक; युगों तक
  rationale: पाठ दाऊदी राजत्व के स्थायी, वंशगत क्षितिज को खुला रखता है; अनुवाद बाद की मसीही व्याख्या को पद में जोड़कर तनाव का समाधान नहीं करता।
- issue: נָגִיד का पदनाम
  choice: अगुआ
  alternative: शासक; प्रधान; राजकुमार
  rationale: यह शब्द आधिकारिक नेतृत्व सूचित करता है, पर यहाँ राजा के समान कोई निश्चित तकनीकी पदानुक्रम थोपना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वंशावली की क्रमिक चयन-रचना को बनाए रखा गया है। मुख्य पाठ में केवल वास्तविक व्याख्यात्मक आवश्यकता वाली अवधि-संबंधी टिप्पणी के लिए [a] लगाया गया है।
