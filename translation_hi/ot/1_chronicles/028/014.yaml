    reason: lexical_alternative
lexical_decisions:
- source_word: זָהָב
  choice: सोना
  rationale: मन्दिर की वस्तुओं के लिए निर्धारित धातु का सामान्य नाम; सूची की शैली में स्वाभाविक हिन्दी।
- source_word: מִשְׁקָל
  choice: भार
  rationale: यहाँ वस्तुओं के लिए निर्धारित सोने और चाँदी की मापी हुई मात्रा सूचित होती है।
- source_word: כְּלֵי
  choice: पात्र
  rationale: मन्दिर-सेवा में प्रयुक्त विविध वस्तुओं के लिए हिन्दी बाइबल-परंपरा में परिचित व्यापक शब्द; केवल बर्तनों तक सीमित अर्थ अभिप्रेत नहीं।
- source_word: עֲבוֹדָה
  choice: सेवा
  rationale: मन्दिर-संबंधी कार्य और उपासना-सेवा के कार्यात्मक भाव को संक्षेप में व्यक्त करता है।
- source_word: עֲבוֹדָה וַעֲבוֹדָה
  choice: प्रत्येक प्रकार की सेवा
  rationale: इब्रानी पुनरुक्ति का वितरणात्मक भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: सोने के समानांतर मन्दिर की वस्तुओं हेतु निर्धारित धातु।
- source_word: לְכָל / לְכֹל
  choice: सभी ... के लिए
  rationale: उपसर्ग और כֹּל के व्यापक तथा वितरणात्मक दायरे को हिन्दी में स्पष्ट रखता है।
