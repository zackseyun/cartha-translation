language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲכִינוֹתִ֥י אֶת מַלְכוּת֖/וֹ עַד לְ/עוֹלָ֑ם אִם יֶחֱזַ֗ק לַ/עֲשׂ֛וֹת מִצְוֺתַ֥/י וּ/מִשְׁפָּטַ֖/י כַּ/יּ֥וֹם הַ/זֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/028/007.yaml
  text: And I will establish his kingdom forever[a], if he is strong to do my commandments and my judgments[c][b], as at this day.
translation:
  language: hi
  text: और मैं उसके राज्य को सदा के लिए स्थिर करूँगा[a], यदि वह मेरी आज्ञाओं और मेरे नियमों का पालन करने में दृढ़ बना रहे[b], जैसा वह आज कर रहा है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दृढ़ करूँगा’ अथवा ‘स्थायी करूँगा’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी आज्ञाओं और मेरे नियमों को मानने के लिए दृढ़ रहे’।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘जैसा आज के दिन’; आशय है, जैसा वह अभी कर रहा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַהֲכִינוֹתִי
  choice: और मैं ... स्थिर करूँगा
  rationale: כון के हिफ़ील रूप का अर्थ किसी वस्तु को दृढ़ या स्थायी बनाना है। राजकीय संदर्भ में ‘स्थिर करूँगा’ स्वाभाविक है और मूल अर्थ को बनाए रखता है।
- source_word: מַלְכוּתוֹ
  choice: उसके राज्य को
  rationale: מַלְכוּת का अर्थ राज्य, राजत्व या शासनकाल हो सकता है। वंशगत स्थायित्व के इस संदर्भ में ‘राज्य’ व्यापक और सहज विकल्प है।
- source_word: עַד לְעוֹלָם
  choice: सदा के लिए
  rationale: यह पदबंध दीर्घस्थायी निरंतरता व्यक्त करता है; ‘सदा के लिए’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אִם
  choice: यदि
  rationale: यह अव्यय स्पष्ट शर्त प्रस्तुत करता है; ‘यदि’ उसकी शर्तात्मक शक्ति को सुरक्षित रखता है।
- source_word: יֶחֱזַק
  choice: दृढ़ बना रहे
  rationale: חזק यहाँ आज्ञापालन में दृढ़ता और संकल्प व्यक्त करता है। ‘दृढ़ बना रहे’ शर्त के भीतर अपेक्षित स्थिरता को सहज हिन्दी में व्यक्त करता है।
- source_word: לַעֲשׂוֹת
  choice: पालन करने में
  rationale: शाब्दिक अर्थ ‘करना’ है, पर आज्ञाओं और नियमों के साथ आधुनिक हिन्दी में ‘पालन करना’ अधिक स्वाभाविक है और आशय को ठीक व्यक्त करता है।
- source_word: מִצְוֺתַי
  choice: मेरी आज्ञाओं
  rationale: ‘आज्ञाएँ’ מִצְוֹת के वाचा-संबंधी आदेशात्मक अर्थ को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וּמִשְׁפָּטַי
  choice: और मेरे नियमों
  rationale: מִשְׁפָּטִים का अर्थ न्याय-विधियाँ, विधान या नियम हो सकता है। यहाँ ‘नियम’ सामान्य पाठक के लिए स्पष्ट है और विधिक अर्थ बनाए रखता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा वह आज कर रहा है
  rationale: शाब्दिक मुहावरा ‘जैसा आज के दिन’ वर्तमान आचरण की ओर संकेत करता है। हिन्दी में स्पष्टता के लिए निहित कर्ता और क्रिया को व्यक्त किया गया है।
theological_decisions:
- issue: सुलैमान के राज्य के विषय में प्रतिज्ञा की शर्तात्मकता
  choice: ‘यदि’ के द्वारा प्रतिज्ञा को स्पष्ट रूप से उसके दृढ़ आज्ञापालन पर निर्भर बताया गया है।
  alternative: शर्त को नरम करके इसे केवल उसके वर्तमान चरित्र का वर्णन मानना।
  rationale: אִם स्पष्ट रूप से शर्त प्रस्तुत करता है। दाऊद से जुड़ी प्रतिज्ञाओं के अन्य पक्षों के साथ इसका सामंजस्य बैठाने के लिए इस तनाव को अनुवाद में हटाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। विधिक शब्दावली को सामान्य पाठक के लिए स्पष्ट रखा गया है; शर्त और वर्तमान आज्ञापालन के संकेत को सुरक्षित रखा गया है।
