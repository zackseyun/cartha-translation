  text: וַ/יִּ֣חַר לְ/דָוִ֔יד כִּֽי פָרַ֧ץ יְהוָ֛ה פֶּ֖רֶץ בְּ/עֻזָּ֑א וַ/יִּקְרָ֞א לַ/מָּק֤וֹם הַ/הוּא֙ פֶּ֣רֶץ עֻזָּ֔א עַ֖ד הַ/יּ֥וֹם הַ/זֶּֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/011.yaml
  text: And David was angry because Yahweh had broken out against Uzza[a]; so he called that place Perez-uzza to this day.
translation:
  language: hi
  text: दाऊद क्रोधित हो उठा, क्योंकि याहवे ने उज्जा के विरुद्ध प्रकोप बरपाया। इसलिए उसने उस स्थान को पेरेस-उज्जा[a] नाम दिया; वह आज तक इसी नाम से जाना जाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पेरेस-उज्जा” का अर्थ लगभग “उज्जा के विरुद्ध भंग” या “उज्जा के विरुद्ध फूटा प्रकोप” है। इब्रानी में ‘प्रकोप बरपाया’ के पीछे का शब्द और इस स्थान-नाम एक ही मूल शब्द से जुड़े हैं।
    reason: मूल इब्रानी की सजातीय क्रिया-संज्ञा और स्थान-नाम के शब्दालंकार को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּחַר לְדָוִיד
  choice: दाऊद क्रोधित हुआ
  rationale: यह इब्रानी मुहावरा दाऊद के भीतर क्रोध भड़कने को व्यक्त करता है। यह चयन आधुनिक हिन्दी में स्पष्ट है और भाव की तीव्रता बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह दाऊद के क्रोधित होने का कारण प्रस्तुत करता है।
- source_word: פָרַץ יְהוָה פֶּרֶץ בְּעֻזָּא
  choice: याहवे उज्जा के विरुद्ध टूट पड़े थे
  rationale: क्रिया और उसी मूल की संज्ञा अचानक और प्रबल रूप से फूट पड़ने अथवा सेंध पड़ने का शब्दालंकार बनाती हैं। ‘टूट पड़े’ स्वाभाविक हिन्दी में उस प्रबल आकस्मिक कार्रवाई को व्यक्त करता है; संज्ञा-संबंधी शब्दालंकार की अतिरिक्त जानकारी पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: פֶּרֶץ עֻזָּא
  choice: पेरेस-उज्जा
  rationale: स्थान-नाम का लिप्यंतरण रखा गया है; उसके अर्थ और पूर्ववर्ती कथन से शब्द-संबंध को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जो आज तक चला आता है
  rationale: यह उस स्थान-नाम के लेखक के समय तक प्रचलित रहने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण उच्चारण-आधारित हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: दाऊद के क्रोध का लक्ष्य
  choice: केवल क्रोधित होने का कारण बताया गया है, लक्ष्य नहीं जोड़ा गया
  alternative: दाऊद याहवे पर क्रोधित हुआ
  rationale: इब्रानी पाठ कहता है कि दाऊद क्रोधित हुआ क्योंकि यह घटना हुई, पर स्पष्ट रूप से यह नहीं बताता कि उसका क्रोध किस पर था। अनुवाद इस वास्तविक अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘टूट पड़े’ मूल की तीव्रता को बचाता है, जबकि पादटिप्पणी उसके बहुअर्थी शब्दालंकार को बिना मुख्य पाठ को बोझिल बनाए सामने लाती है।
