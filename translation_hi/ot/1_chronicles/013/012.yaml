  text: And David feared God that day[a], saying, “How can I bring the ark of God to me?”
translation:
  language: hi
  text: उस दिन दाऊद परमेश्वर से डर गया[a] और बोला, “मैं परमेश्वर के सन्दूक को अपने पास कैसे ला सकता हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर से भयभीत हुआ”; इब्रानी क्रिया प्रसंग के अनुसार डर, दहशत, या श्रद्धामिश्रित भय व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּירָא
  choice: डर गया
  rationale: यह ירא का कथात्मक रूप है। उज्जा की मृत्यु के तत्काल प्रसंग में इसका मुख्य भाव परमेश्वर के न्याय से उत्पन्न भय है; ‘डर गया’ इस भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी श्रद्धामिश्रित भय की अर्थ-छाया सुरक्षित रखती है।
- source_word: אֶת הָאֱלֹהִים
  choice: परमेश्वर से
  rationale: हिन्दी में ‘परमेश्वर से डरना’ स्वाभाविक प्रयोग है और इब्रानी के निश्चित संज्ञा-रूप को उचित ढंग से व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक कालवाचक पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: और कहने लगा
  rationale: प्रत्यक्ष कथन का परिचय देने वाले इब्रानी infinitive construct को प्रवाहपूर्ण हिन्दी कथन में व्यक्त करता है।
- source_word: הֵיךְ
  choice: कैसे
  rationale: दाऊद के प्रश्न में उपाय, सम्भावना और उपयुक्तता की कठिनाई को बिना अतिरिक्त व्याख्या जोड़े बनाए रखता है।
- source_word: אָבִיא
  choice: ला सकता हूँ
  rationale: בוא के हिफ़ील रूप का अर्थ ‘लाना’ है; प्रश्न के प्रसंग में ‘ला सकता हूँ’ स्वाभाविक हिन्दी है और सामर्थ्य अथवा उपयुक्तता की खुली अर्थ-छाया रखता है।
- source_word: אֵלַי
  choice: अपने पास
  rationale: पहले पुरुष एकवचन का स्वाभाविक हिन्दी रूप; यह गन्तव्य को दाऊद के पास बताता है, पर उसे उसके घर या नगर के रूप में स्पष्ट करके मूल की अस्पष्टता नहीं मिटाता।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर के सन्दूक
  rationale: इब्रानी construct chain का पारदर्शी और गरिमापूर्ण अनुवाद है तथा वर्णन में प्रयुक्त धार्मिक वस्तु की पहचान बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के न्याय के प्रति दाऊद की प्रतिक्रिया का स्वरूप
  choice: ‘परमेश्वर से डर गया’—वास्तविक भय को प्रमुख रखना
  alternative: ‘परमेश्वर का भय माना’ या ‘परमेश्वर के प्रति श्रद्धा से भर गया’
  rationale: उज्जा की मृत्यु के तत्काल प्रसंग में क्रिया भय या दहशत का संकेत देती है, यद्यपि उसमें श्रद्धामिश्रित भय भी हो सकता है। मुख्य पाठ को केवल श्रद्धा तक नरम नहीं किया गया और पादटिप्पणी में अर्थ-सीमा स्पष्ट की गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘सन्दूक’ प्रचलित बाइबलीय पदावली को बनाए रखता है; वाक्य-रचना सामान्य पाठक के लिए सहज रखी गई है।
