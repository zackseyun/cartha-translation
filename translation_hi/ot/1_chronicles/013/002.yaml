base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/002.yaml
  text: And David said to all the assembly of Israel[a], “If it seems good to you, and if it is from Yahweh our God, let us send word to our brothers who remain in all the lands of Israel, and also to the priests and Levites with them in the cities of their pasturelands[d][c][b], that they may gather to us.”
translation:
  language: hi
  text: दाऊद ने इस्राएल की सारी सभा से कहा, “यदि तुम्हें यह अच्छा लगे और यह हमारे परमेश्वर याहवे की ओर से हो, तो आओ हम दूर-दूर तक संदेश भेजें[a]—इस्राएल के सभी क्षेत्रों[c] में जो हमारे भाई शेष हैं[b], उन्हें; और उनके साथ याजकों और लेवियों को भी, जो अपने चरागाह-भूमियों वाले नगरों[d] में रहते हैं—ताकि वे हमारे पास इकट्ठे हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “आओ हम फैल निकलें; आओ हम भेजें।” संयुक्त अभिव्यक्ति का आशय संभवतः व्यापक रूप से संदेश भेजना है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “भाइयों” से प्रतिनिधिक अर्थ में साथी इस्राएली अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “इस्राएल की सभी भूमियों में”; अर्थात उसके विभिन्न क्षेत्रों में।
    reason: lexical_alternative
  - marker: d
    text: अर्थात नगरों से लगी खुली भूमि, जो विशेष रूप से पशु चराने के काम आती थी।
    reason: cultural_note
lexical_decisions:
- source_word: קְהַל
  choice: सभा
  rationale: यह शब्द यहाँ एकत्रित राष्ट्रीय समुदाय को दर्शाता है; ‘सभा’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक कलीसियाई अर्थ नहीं जोड़ता।
- source_word: אִם עֲלֵיכֶם טוֹב
  choice: यदि तुम्हें यह अच्छा लगे
  rationale: हिब्रू मुहावरा श्रोताओं की सहमति या स्वीकृति पूछता है; यह हिन्दी में उसी भाव को सहज रूप से व्यक्त करता है।
- source_word: וּמִן יְהוָה אֱלֹהֵינוּ
  choice: और यह हमारे परमेश्वर याहवे की ओर से हो
  rationale: पहले उपवाक्य की शर्त यहाँ भी निहित है। अनुवाद लोगों की सहमति और परमेश्वर की स्वीकृति, दोनों को साथ रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को उपाधि में बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: נִפְרְצָה נִשְׁלְחָה
  choice: आओ हम दूर-दूर तक संदेश भेजें
  rationale: दोनों सहायतार्थक क्रियारूपों में पहला व्यापक रूप से निकलने या फैलने का भाव देता है और दूसरा भेजने का। संयुक्त हिन्दी अभिव्यक्ति व्यापक संदेश-प्रेषण का आशय स्पष्ट करती है, जबकि शाब्दिक कठिनाई पादटिप्पणी में सुरक्षित है।
- source_word: עַל אַחֵינוּ
  choice: अपने भाइयों को
  rationale: ‘भाई’ मूल के पारिवारिक रूपक को बनाए रखता है; यहाँ यह प्रतिनिधिक अर्थ में साथी इस्राएलियों के लिए है।
- source_word: הַנִּשְׁאָרִים
  choice: रहने वाले
  rationale: संदर्भ में ये विभिन्न क्षेत्रों में मौजूद या शेष लोग हैं। यह चयन ‘बचे हुए’ से उत्पन्न हो सकने वाले अनावश्यक विनाश अथवा तकनीकी ‘शेष’ संबंधी अर्थ से बचता है।
- source_word: בְּכֹל אַרְצוֹת יִשְׂרָאֵל
  choice: इस्राएल के सभी क्षेत्रों में
  rationale: बहुवचन אַרְצוֹת को ‘क्षेत्रों’ से व्यक्त किया गया है, जो हिन्दी में ‘देशों’ की अपेक्षा यहाँ की आंतरिक भौगोलिक व्यापकता अधिक स्वाभाविक ढंग से बताता है।
- source_word: מִגְרְשֵׁיהֶם
  choice: चरागाहों
  rationale: यह लेवीय नगरों से लगी खुली भूमि को दर्शाता है, जिसका उपयोग विशेषतः पशु चराने के लिए होता था।
- source_word: וְיִקָּבְצוּ אֵלֵינוּ
  choice: ताकि वे हमारे पास इकट्ठे हों
  rationale: क्रिया संदेश भेजने के उद्देश्य को और אֵלֵינוּ दिशा को व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: וּמִן יְהוָה में निहित शर्त
  choice: और यह हमारे परमेश्वर याहवे की ओर से हो
  alternative: और हमारे परमेश्वर याहवे की ओर से
  rationale: हिब्रू में पहले ‘यदि’ का प्रभाव दूसरे समन्वित वाक्यांश तक जा सकता है। हिन्दी में निहित विधेय और शर्त स्पष्ट की गई है, पर दाऊद की योजना को परमेश्वर की स्वीकृति के अधीन रखने वाला तनाव बनाए रखा गया है।
