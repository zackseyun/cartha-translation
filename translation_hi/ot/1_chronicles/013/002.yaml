  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘आओ हम’ दाऊद के सहायतार्थक प्रस्ताव को व्यक्त करता है। लंबे हिब्रू वाक्य की संरचना को डैशों से स्पष्ट किया गया है, ताकि संदेश पाने वाले सामान्य इस्राएलियों तथा उनके बीच रहने वाले याजकों और लेवियों का संबंध सहज समझ में आए।
