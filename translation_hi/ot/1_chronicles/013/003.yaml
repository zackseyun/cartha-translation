reference: 1 Chronicles 13:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָסֵ֛בָּה אֶת אֲר֥וֹן אֱלֹהֵ֖י/נוּ אֵלֵ֑י/נוּ כִּי לֹ֥א דְרַשְׁנֻ֖/הוּ בִּ/ימֵ֥י שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/003.yaml
  text: And let us bring the ark of our God back to us[a], for we did not seek it in the days of Shaul.
translation:
  language: hi
  text: और हम अपने परमेश्वर का संदूक अपने पास वापस ले आएँ, क्योंकि शाऊल के दिनों में हमने उसकी खोज नहीं की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने उसकी सुधि नहीं ली” अथवा “हमने उससे पूछताछ नहीं की।” इब्रानी क्रिया का अर्थ खोज करना या पूछताछ करना हो सकता है। यहाँ कर्म-प्रत्यय व्याकरण की दृष्टि से ‘संदूक’ की ओर संकेत करता है, यद्यपि इसमें परमेश्वर की खोज न करने का भाव भी निहित हो सकता है।
    reason: इब्रानी क्रिया דרשׁ के वैकल्पिक अर्थों तथा ‘संदूक’ की ओर संकेत करते कर्म को बिना व्याख्यात्मक निष्कर्ष थोपे सुरक्षित रखना।
lexical_decisions:
- source_word: וְנָסֵבָּה
  choice: और हम ... वापस ले आएँ
  rationale: प्रथम पुरुष बहुवचन के संकल्पसूचक रूप और संदर्भगत गति को स्वाभाविक हिन्दी में प्रस्ताव के रूप में व्यक्त करता है।
- source_word: אֶת אֲרוֹן אֱלֹהֵינוּ
  choice: अपने परमेश्वर का संदूक
  rationale: सम्बन्धवाचक रचना का सीधा अर्थ सुरक्षित है; ‘संदूक’ उपासना से जुड़ी ठोस वस्तु को बिना अतिरिक्त व्याख्या के दर्शाता है।
- source_word: אֵלֵינוּ
  choice: अपने पास
  rationale: समुदाय की ओर वापस लाने की दिशा को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: प्रस्ताव का कारण स्पष्ट करने वाले इब्रानी संयोजक का सीधा और सहज रूप है।
- source_word: לֹא דְרַשְׁנֻהוּ
  choice: हमने उसकी सुधि नहीं ली थी
  rationale: דרשׁ के ‘खोजने/पूछताछ करने/ध्यान देने’ के अर्थक्षेत्र को प्रसंग में स्वाभाविक हिन्दी देता है और व्याकरणिक प्रत्यय को संदूक से सम्बद्ध रखता है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בִּימֵי שָׁאוּל
  choice: शाऊल के दिनों में
  rationale: इब्रानी मुहावरे का निकट रूप रखते हुए שָׁאוּל का मूल-आधारित देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: ‘सुधि नहीं ली’ का कर्म
  choice: मुख्य पाठ में व्याकरणिक कर्म को संदूक ही रहने दिया गया है।
  alternative: ‘हमने उसे नहीं खोजा/उससे पूछताछ नहीं की’ अथवा कर्म को सीधे परमेश्वर मानना।
  rationale: एकवचन पुल्लिंग प्रत्यय निकटवर्ती पुल्लिंग संज्ञा ‘संदूक’ की ओर स्वाभाविक रूप से संकेत करता है। उसे सीधे परमेश्वर के रूप में प्रस्तुत करना व्याख्यात्मक निष्कर्ष को मुख्य पाठ में जोड़ देता; व्यापक आत्मिक आशय को पाठक के लिए खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामुदायिक कथन के अनुकूल है। ‘सुधि लेना’ सामान्य पाठक के लिए बोधगम्य है और संदूक की उपेक्षा का भाव देता है; पादटिप्पणी मूल क्रिया के अधिक शाब्दिक विकल्पों को स्पष्ट करती है।
