  text: וַ/יֵּשֶׁב֩ אֲר֨וֹן הָ/אֱלֹהִ֜ים עִם בֵּ֨ית עֹבֵ֥ד אֱדֹ֛ם בְּ/בֵית֖/וֹ שְׁלֹשָׁ֣ה חֳדָשִׁ֑ים וַ/יְבָ֧רֶךְ יְהוָ֛ה אֶת בֵּ֥ית עֹבֵֽד אֱדֹ֖ם וְ/אֶת כָּל אֲשֶׁר לֽ/וֹ־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/014.yaml
  text: And the ark of God remained with the household of Obed-edom[a], in his house, for three months. And Yahweh blessed the household of Obed-edom and all that belonged to him.
translation:
  language: hi
  text: परमेश्वर का सन्दूक ओबेद-एदोम के घराने[a] के साथ, उसके घर में, तीन महीने तक रहा। और याहवे ने ओबेद-एदोम के घराने और जो कुछ उसका था, उस सब को आशीष दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, यहाँ और आगे दोनों स्थानों पर ‘ओबेद-एदोम का घर’; इब्रानी शब्द בֵּית का अर्थ भौतिक घर या घराना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישׁב यहाँ सन्दूक के किसी स्थान पर कुछ समय तक बने रहने को व्यक्त करता है; ‘रहा’ आधुनिक हिन्दी में स्वाभाविक है और स्थायी निवास का अनावश्यक संकेत नहीं देता।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: इब्रानी पदबंध ठीक ‘परमेश्वर का सन्दूक’ है; इसमें ‘वाचा’ शब्द नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: עִם בֵּית עֹבֵד אֱדֹם
  choice: ओबेद-एदोम के घराने के साथ
  rationale: בֵּית का अर्थ भवन या घराना दोनों हो सकता है। अगले पदबंध ‘उसके घर में’ से भेद बनाए रखने के लिए यहाँ सामाजिक अर्थ ‘घराना’ चुना गया।
- source_word: בְּבֵיתוֹ
  choice: उसके घर में
  rationale: यह पदबंध सन्दूक का भौतिक स्थान बताता है, इसलिए ठोस अर्थ ‘घर’ रखा गया।
- source_word: שְׁלֹשָׁה חֳדָשִׁים
  choice: तीन महीने तक
  rationale: अवधि व्यक्त करने के लिए ‘तक’ सहज हिन्दी है और मूल की समयावधि को ठीक व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम יהוה है; उसका लिप्यंतरण ‘याहवे’ मूल नाम को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֶת בֵּית עֹבֵד אֱדֹם
  choice: ओबेद-एदोम के घराने
  rationale: आशीष का लक्ष्य केवल भवन नहीं, ओबेद-एदोम का घराना है; फिर भी בֵּית की वैकल्पिक भौतिक व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: וְאֶת כָּל אֲשֶׁר לוֹ
  choice: और उसकी सारी सम्पत्ति को
  rationale: शाब्दिक भाव ‘जो कुछ उसका था’ है। ‘उसकी सारी सम्पत्ति’ हिन्दी में स्वाभाविक ढंग से उसकी सब वस्तुओं और साधनों का व्यापक आशय व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में टेट्राग्रामटन प्रत्यक्ष रूप से आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और सामान्य उपाधि से अलग व्यक्तिगत वाचा-नाम को सुरक्षित रखता है।
- issue: בֵּית को ‘घराना’ या ‘घर’ समझना
  choice: दोनों सामाजिक प्रयोगों में ‘घराना’, और בְּבֵיתוֹ में ‘घर’
  alternative: दोनों occurrences में ‘घर’
  rationale: एक ही इब्रानी शब्द भवन और परिवार/घराने दोनों को सूचित कर सकता है। निकटवर्ती ‘उसके घर में’ भौतिक स्थान को स्पष्ट करता है, इसलिए अन्य occurrences में ‘घराना’ प्रसंगानुकूल है; वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सन्दूक’, ‘घराना’, ‘आशीष’ और ‘सम्पत्ति’ सामान्य हिन्दी बाइबलीय पाठकों के लिए परिचित हैं। वाक्य-विन्यास मूल की दो क्रमिक घटनाओं को बनाए रखता है, और [a] मुख्य पाठ में उचित स्थान पर दिया गया है।
