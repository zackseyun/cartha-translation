  text: So David did not bring the ark to himself[a], into the City of David; instead[b], he turned it aside to the house of Obed-edom the Gittite.
translation:
  language: hi
  text: इसलिए दाऊद सन्दूक को अपने पास[a], अर्थात् दाऊद के नगर में, नहीं ले गया; बल्कि उसने उसकी दिशा मोड़कर उसे गित्ती ओबेद-एदोम के घर की ओर कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सन्दूक को अपने पास से नहीं हटाया।” इब्रानी क्रिया का अर्थ “हटाना” हो सकता है और इस सन्दर्भ में “ले जाना” या “लाना” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵסִיר
  choice: नहीं ले गया
  rationale: हिफ़ील रूप का मूल अर्थ ‘हटाना’ या ‘दूर ले जाना’ हो सकता है; यहाँ गन्तव्य-वाचक पदों के साथ सन्दर्भगत अर्थ सन्दूक को आगे दाऊद के नगर तक न ले जाना है।
- source_word: אֵלָיו
  choice: अपने पास
  rationale: शाब्दिक अर्थ ‘उसके पास’ है, पर कर्ता दाऊद होने के कारण हिन्दी में स्वाभाविक प्रतिवर्ती अर्थ ‘अपने पास’ है।
- source_word: עִיר דָּוִיד
  choice: दाऊद का नगर
  rationale: यह स्थापित स्थान-नाम है और आधुनिक हिन्दी में इसका प्रचलित, स्पष्ट रूप ‘दाऊद का नगर’ है।
- source_word: וַיַּטֵּהוּ
  choice: उसे मार्ग से हटाकर … पहुँचा दिया
  rationale: नָטָה यहाँ नियत मार्ग से दूसरी ओर मोड़ने का भाव देता है। हिन्दी वाक्य में ‘मार्ग से हटाकर … पहुँचा दिया’ दिशा बदलने और नए स्थान तक ले जाने दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵּית
  choice: घर
  rationale: सन्दूक को ठहराने के स्थान के सन्दर्भ में भौतिक ‘घर’ सबसे सीधा अर्थ है, यद्यपि शब्द ‘घराने’ का भाव भी रख सकता है।
- source_word: עֹבֵד אֱדֹם
  choice: ओबेद-एदोम
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में ध्वन्यात्मक लिप्यन्तरण।
- source_word: הַגִּתִּי
  choice: गित्ती
  rationale: यह गात से सम्बन्ध सूचित करने वाला जातिवाचक/स्थानवाचक विशेषण है; ‘गित्ती’ संक्षिप्त और पारम्परिक हिन्दी रूप है।
