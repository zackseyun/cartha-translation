  yaml_path: translation/ot/1_chronicles/013/004.yaml
  text: And all the assembly said to do so[a], for the matter was right in the eyes of all the people.
translation:
  language: hi
  text: तब सारी सभा ने कहा कि ऐसा ही किया जाए[a], क्योंकि यह बात सभी लोगों की दृष्टि में उचित थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सारी सभा ने ऐसा करने को कहा”; इब्रानी शब्दावली प्रस्ताव के प्रति सभा की सहमति व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: ने कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है। इसे बनाए रखने से सभा की मौखिक प्रतिक्रिया स्पष्ट रहती है; संदर्भ में सहमति निहित है, पर उसे मुख्य पाठ में केवल ‘सहमत हुई’ कहकर सीमित नहीं किया गया।
- source_word: כָל הַקָּהָל
  choice: सारी सभा
  rationale: קָהָל यहाँ एकत्र समुदाय को दर्शाता है। ‘सारी सभा’ आधुनिक हिन्दी में स्वाभाविक है और כָל की समग्रता भी व्यक्त करता है।
- source_word: לַעֲשׂוֹת כֵּן
  choice: कि ऐसा ही किया जाए
  rationale: शाब्दिक संरचना ‘ऐसा करने के लिए’ है, पर אמר के बाद हिन्दी में यह सहमति या प्रस्ताव की स्वीकृति व्यक्त करने का अधिक स्वाभाविक ढंग है। कर्ता की अस्पष्टता को कर्मवाच्य से सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי सभा की प्रतिक्रिया का कारण बताता है; ‘क्योंकि’ इस संबंध को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: יָשַׁר
  choice: उचित थी
  rationale: इस संदर्भ में יָשַׁר का अर्थ नैतिक रूप से केवल ‘सीधी’ नहीं, बल्कि प्रस्ताव का ठीक, सही या स्वीकार्य होना है। ‘उचित’ विचार-विमर्श के संदर्भ में स्वाभाविक है।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דָּבָר का अर्थ ‘बात’, ‘विषय’ या ‘मामला’ हो सकता है। निकटवर्ती प्रस्ताव की ओर संकेत करने के लिए ‘यह बात’ सहज है और अनावश्यक रूप से ‘प्रस्ताव’ नहीं जोड़ता।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: यह בְּעֵינֵי के मूल्यांकन-संबंधी मुहावरे को औपचारिक किंतु प्रचलित आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָל הָעָם
  choice: सभी लोगों
  rationale: עָם सामूहिक रूप से लोगों को दर्शाता है और כָל की समग्रता ‘सभी’ से बनी रहती है।
