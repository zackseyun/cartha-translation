source:
  edition: WLC
  text: וַ/יַּ֨עַל דָּוִ֤יד וְ/כָל יִשְׂרָאֵל֙ בַּעֲלָ֔תָ/ה אֶל קִרְיַ֥ת יְעָרִ֖ים אֲשֶׁ֣ר לִ/יהוּדָ֑ה לְ/הַעֲל֣וֹת מִ/שָּׁ֗ם אֵת֩ אֲר֨וֹן הָ/אֱלֹהִ֧ים יְהוָ֛ה יוֹשֵׁ֥ב הַ/כְּרוּבִ֖ים אֲשֶׁר נִקְרָ֥א שֵֽׁם־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/006.yaml
  text: So David and all Israel went up to Baalah[a], that is, to Kiriath-jearim, which belongs to Judah, to bring up from there the ark of God, Yahweh who is enthroned above the cherubim, whose name is called upon it.
translation:
  language: hi
  text: तब दाऊद और सारा इस्राएल यहूदा में स्थित बालाह, अर्थात् किर्यत-यारीम, को चढ़कर गए, ताकि वहाँ से परमेश्वर का संदूक—याहवे का, जो करूबों पर विराजमान है और जिस पर नाम पुकारा जाता है—ऊपर ले आएँ।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक मुहावरेदार ढंग से: “परमेश्वर का वह संदूक, जो करूबों पर विराजमान याहवे के नाम से पुकारा जाता है।” अंतिम इब्रानी उपवाक्य संक्षिप्त और व्याकरणिक रूप से अस्पष्ट है; तुलना करें 2 शमूएल 6:2।'
    reason: अंतिम इब्रानी उपवाक्य के संबंध को मुख्य पाठ में अनिर्णीत रखा गया है और 2 शमूएल 6:2 से समर्थित वैकल्पिक, अधिक मुहावरेदार समझ पादटिप्पणी में दी गई है।
lexical_decisions:
- source_word: וַיַּעַל
  choice: को गए
  rationale: עלה में ऊपर जाने का भाव है, पर गंतव्य के साथ स्वाभाविक आधुनिक हिन्दी में ‘को गए’ यात्रा का अर्थ स्पष्ट करता है; उसी धातु का दिशात्मक भाव आगे ‘ऊपर ले आएँ’ में सुरक्षित है।
- source_word: בַּעֲלָתָה אֶל קִרְיַת יְעָרִים
  choice: बालाह, अर्थात् किर्यत-यारीम, को
  rationale: बालाह स्थान-नाम का लिप्यंतरण है और अगला नाम उसी स्थान की व्याख्यात्मक पहचान देता है; ‘अर्थात्’ इस समानाधिकरण को स्पष्ट करता है।
- source_word: אֲשֶׁר לִיהוּדָה
  choice: यहूदा के
  rationale: लामेद यहाँ यहूदा के क्षेत्र से स्थान का संबंध व्यक्त करता है; संक्षिप्त हिन्दी में ‘यहूदा के बालाह’ स्वाभाविक है।
- source_word: לְהַעֲלוֹת מִשָּׁם
  choice: वहाँ से ... ऊपर ले आएँ
  rationale: हिफ़ील रूप किसी वस्तु को ऊपर लाने का अर्थ देता है। यह अनुवाद मूल की दिशात्मकता और आरम्भिक עלה से शब्दगत संबंध बनाए रखता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: यह सामान्य और समझने योग्य हिन्दी बाइबलीय पद है, जो इब्रानी संबंध-वाचक रचना को सीधे व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत दिव्य नाम का हिन्दी लिप्यंतरण है; मूल में आए नाम को किसी उपाधि से नहीं बदला गया।
- source_word: יוֹשֵׁב הַכְּרוּבִים
  choice: जो करूबों पर विराजमान है
  rationale: יוֹשֵׁב राजकीय आसन ग्रहण करने का भाव दे सकता है। बिना पूर्वसर्ग वाली इब्रानी रचना में ‘पर’ संदूक और करूबों से जुड़े सिंहासन-बिंब को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘बीच में’ जैसी अधिक विशिष्ट व्याख्या से बचता है।
- source_word: אֲשֶׁר נִקְרָא שֵׁם
  choice: जिसका नाम उस संदूक पर पुकारा जाता है
  rationale: अत्यंत संक्षिप्त और कठिन इब्रानी वाक्यांश के कर्मवाच्य ‘पुकारा जाता है’ को रखा गया है। ‘उस संदूक पर’ निकटवर्ती संदूक से संबंध स्पष्ट करता है, जबकि वैकल्पिक व्याकरणिक समझ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। उसका लिप्यंतरण नाम और उपाधि के बीच का अंतर सुरक्षित रखता है।
- issue: अंतिम वाक्यांश אֲשֶׁר נִקְרָא שֵׁם का संबंध
  choice: जिसका नाम उस संदूक पर पुकारा जाता है
  alternative: वह संदूक जो उस नाम से पुकारा जाता है
  rationale: इब्रानी वाक्यांश व्याकरण की दृष्टि से संक्षिप्त और संदिग्ध है। मुख्य पाठ याहवे के नाम और संदूक के संबंध को अपेक्षाकृत शाब्दिक रूप में रखता है; पादटिप्पणी 2 शमूएल 6:2 से समर्थित वैकल्पिक संबंध को बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। स्थान-नामों को हिन्दी में लिप्यंतरित किया गया है। ‘संदूक’ परिचित बाइबलीय शब्द है; ‘विराजमान’ राजकीय-सिंहासन के भाव को सम्मानजनक किन्तु सहज ढंग से व्यक्त करता है।
