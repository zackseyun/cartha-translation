base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/009.yaml
  text: When they came to the threshing floor of Kidon[a], Uzza reached out his hand to take hold of the ark, because the oxen stumbled.
translation:
  language: hi
  text: जब वे कीदोन के खलिहान तक पहुँचे, तब उज्जा ने सन्दूक को थामने के लिए अपना हाथ बढ़ाया, क्योंकि बैल फिसल गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि बैल लड़खड़ा गए।” इब्रानी क्रिया का अर्थ फिसलना हो सकता है; कुछ संदर्भों में यह किसी वस्तु के छूटने या गिरने देने का भाव भी व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּרֶן כִּידֹן
  choice: कीदोन का खलिहान
  rationale: גֹּרֶן का अर्थ अनाज दाँवने का स्थान, अर्थात् खलिहान, है; כִּידֹן स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ
  choice: अपना हाथ बढ़ाया
  rationale: हाथ के साथ שׁלח का मुहावरा हाथ आगे बढ़ाने की शारीरिक क्रिया व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: לֶאֱחֹז
  choice: थामने के लिए
  rationale: אחז का अर्थ पकड़ना या थामना है। प्रसंग में उज्जा सन्दूक को स्थिर करने का प्रयास करता है, इसलिए 'थामना' सहज है और बलपूर्वक छीनने का भाव नहीं देता।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: इब्रानी पाठ में केवल 'सन्दूक' है, 'परमेश्वर का सन्दूक' नहीं; अतः व्यापक प्रसंग से अतिरिक्त शब्द नहीं जोड़े गए।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ उज्जा के हाथ बढ़ाने का कारण बताता है।
- source_word: שָׁמְטוּ
  choice: फिसल गए थे
  rationale: שׁמט फिसलने, छूटने या गिरा देने का भाव दे सकता है। הַבָּקָר को कर्ता मानते हुए 'बैल फिसल गए थे' प्रत्यक्ष व्याकरण और संदर्भ दोनों के अनुकूल है; दूसरी सम्भावना पादटिप्पणी में रखी गई है।
- source_word: הַבָּקָר
  choice: बैल
  rationale: בָּקָר सामान्यतः गौ-पशु कह सकता है, पर गाड़ी खींचने के इस प्रसंग में 'बैल' अधिक सटीक और स्वाभाविक है।
