  yaml_path: translation/ot/1_chronicles/013/010.yaml
  text: Then Yahweh’s anger burned against Uzza[a], and he struck him down because he had put out his hand to the ark; and he died there before God.
translation:
  language: hi
  text: तब उज्जा पर याहवे का क्रोध भड़क उठा, और उसने उस पर प्रहार किया, क्योंकि उसने सन्दूक की ओर अपना हाथ बढ़ाया था; और वह वहीं परमेश्वर के सामने मर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּחַר אַף יְהוָה
  choice: यहोवा का क्रोध भड़क उठा
  rationale: यह हिब्रानी मुहावरे में क्रोध के जल उठने की तीव्रता को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְּעֻזָּא
  choice: उज्जा पर
  rationale: यहाँ ב क्रोध के लक्ष्य को सूचित करता है; हिन्दी में ‘उज्जा पर ... क्रोध’ स्वाभाविक है।
- source_word: וַיַּכֵּהוּ
  choice: उसने उसे मार डाला
  rationale: נכה का अर्थ प्रहार करना या मार गिराना हो सकता है; अगले खंड में तत्काल मृत्यु के कारण यहाँ परिणामसूचक अनुवाद उपयुक्त है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह वाक्यांश दण्ड का कारण प्रस्तुत करता है।
- source_word: שָׁלַח יָדוֹ עַל הָאָרוֹן
  choice: उसने सन्दूक की ओर अपना हाथ बढ़ाया था
  rationale: यह भौतिक क्रिया को व्यक्त करता है और उसके उद्देश्य या मनोभाव के विषय में अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: मूल पाठ में केवल निश्चित ‘सन्दूक’ है; प्रसंग से उसका अभिप्राय स्पष्ट है।
- source_word: וַיָּמָת שָׁם
  choice: वह वहीं ... मर गया
  rationale: यह कथा-क्रम और שָׁם के स्थानसूचक बल को बिना विस्तार के सुरक्षित रखता है।
- source_word: לִפְנֵי אֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह לִפְנֵי का सीधा और स्वाभाविक हिन्दी रूप है तथा दृश्य की गंभीरता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम है; हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखते हुए नाम के रूप में प्रस्तुत करता है।
- issue: एक ही पद में יְהוָה और אֱלֹהִים का भेद
  choice: ‘यहोवा’ ... ‘परमेश्वर’ दोनों को सुरक्षित रखा गया
  alternative: दोनों स्थानों पर एक ही पद का प्रयोग
  rationale: मूल पाठ पहले विशिष्ट ईश्वरीय नाम और अन्त में सामान्य पद אֱלֹהִים का प्रयोग करता है; इस भिन्नता को समतल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गंभीर और कथात्मक शैली। ‘सन्दूक’ प्रसंगानुकूल पारंपरिक शब्द है। मूल में उपस्थित कारणात्मक कथन और ईश्वरीय पदों का अंतर बनाए रखा गया है।
