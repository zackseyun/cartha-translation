  text: וַ/יַּרְכִּ֜יבוּ אֶת אֲר֤וֹן הָ/אֱלֹהִים֙ עַל עֲגָלָ֣ה חֲדָשָׁ֔ה מִ/בֵּ֖ית אֲבִינָדָ֑ב וְ/עֻזָּ֣א וְ/אַחְי֔וֹ נֹהֲגִ֖ים בָּ/עֲגָלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/007.yaml
  text: So they set the ark of God on a new cart from the house of Abinadab[a], and Uzza and Ahio were guiding the cart.
translation:
  language: hi
  text: उन्होंने परमेश्वर के सन्दूक को अबीनादाब के घर से एक नई गाड़ी पर रखा, और उज्जा और अह्यो उस गाड़ी को चला रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस गाड़ी को आगे ले जा रहे थे।” हिब्रू कृदंत वाहन को चलाने या आगे ले जाने, दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְכִּיבוּ
  choice: चढ़ाया
  rationale: रכב के हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को वाहन पर सवार करना या रखकर ले जाना है। ‘गाड़ी पर चढ़ाया’ इस ठोस क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: निर्माण-संबंध को सीधे व्यक्त करता है; इस उपासना-संबंधी वस्तु के लिए ‘सन्दूक’ प्रचलित और अर्थ-संगत हिन्दी शब्द है।
- source_word: עַל עֲגָלָה חֲדָשָׁה
  choice: एक नई गाड़ी पर
  rationale: עֲגָלָה पहियों वाली गाड़ी को दर्शाता है। मूल में बैलों का स्पष्ट उल्लेख नहीं है, इसलिए ‘बैलगाड़ी’ जोड़ने के बजाय ‘गाड़ी’ रखा गया है; ‘नई’ को स्पष्ट रूप से बनाए रखा गया है।
- source_word: מִבֵּית אֲבִינָדָב
  choice: अबीनादाब के घर से
  rationale: מִן स्रोत या आरम्भ-बिंदु बताता है। यह रूप हिब्रू संरचना और अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: עֻזָּא
  choice: उज्जा
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: אַחְיוֹ
  choice: अहयो
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण, जिसमें हिब्रू उच्चारण के निकट रूप रखा गया है।
- source_word: נֹהֲגִים בָּעֲגָלָה
  choice: उस गाड़ी को चला रहे थे
  rationale: נהג का कृदन्त वाहन या पशुओं को हाँकने, चलाने अथवा आगे ले जाने को व्यक्त कर सकता है। ‘चला रहे थे’ हिन्दी में स्वाभाविक है और जारी क्रिया का भाव बनाए रखता है; वैकल्पिक अर्थ फुटनोट में दिया गया है।
