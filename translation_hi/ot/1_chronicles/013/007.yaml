  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। अनावश्यक रूप से ‘बैलगाड़ी’ नहीं जोड़ा गया, क्योंकि मूल पद में पशुओं का स्पष्ट उल्लेख नहीं है।
