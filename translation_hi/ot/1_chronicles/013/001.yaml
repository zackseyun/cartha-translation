translation:
  language: hi
  text: तब दाऊद ने हज़ारों और सैकड़ों के प्रधानों और हर एक अगुवे से विचार-विमर्श किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּוָּעַץ
  choice: विचार-विमर्श किया
  rationale: निफ़अल रूप यहाँ परस्पर परामर्श और deliberation का भाव देता है; ‘विचार-विमर्श किया’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इस अर्थ को व्यक्त करता है।
- source_word: עִם
  choice: से
  rationale: ‘विचार-विमर्श करना’ के साथ हिन्दी में ‘से’ स्वाभाविक रूप से सहभागिता का संबंध व्यक्त करता है।
- source_word: שָׂרֵי
  choice: प्रधानों
  rationale: हज़ारों और सैकड़ों की इकाइयों के संदर्भ में यह पद सैन्य-प्रशासनिक अधिकारियों को सूचित करता है; ‘प्रधान’ पद और नेतृत्व दोनों को बनाए रखता है।
- source_word: הָאֲלָפִים וְהַמֵּאוֹת
  choice: हज़ारों और सैकड़ों के
  rationale: इब्रानी की संख्यात्मक इकाइयों को ज्यों का त्यों रखा गया है, ताकि उनकी संभावित सैन्य अथवा प्रशासनिक संरचना अनावश्यक रूप से निश्चित न की जाए।
- source_word: לְכָל נָגִיד
  choice: हर एक अगुवे
  rationale: ‘अगुवा’ नेतृत्व का व्यापक अर्थ देता है, बिना उसे राजा, राजकुमार या केवल सैन्य अधिकारी तक सीमित किए। लְ को प्रसंगानुसार पहले आए परामर्श के संबंध के विस्तार के रूप में समझा गया है।
