  text: וְ/דָוִ֣יד וְ/כָל יִשְׂרָאֵ֗ל מְשַׂחֲקִ֛ים לִ/פְנֵ֥י הָ/אֱלֹהִ֖ים בְּ/כָל עֹ֑ז וּ/בְ/שִׁירִ֤ים וּ/בְ/כִנֹּרוֹת֙ וּ/בִ/נְבָלִ֣ים וּ/בְ/תֻפִּ֔ים וּ/בִ/מְצִלְתַּ֖יִם וּ/בַ/חֲצֹצְרֽוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/008.yaml
  text: And David and all Israel were celebrating before God with all their might[a], with songs, lyres, harps, tambourines, cymbals, and trumpets.
translation:
  language: hi
  text: दाऊद और सारा इस्राएल परमेश्वर के सामने अपनी पूरी शक्ति से[a] उत्सव मना रहे थे, गीतों के साथ वीणाएँ, दूसरे तारवाले वाद्य, डफ, झाँझ और तुरहियाँ बजा रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के सामने खेलते अथवा आनंद करते हुए”; इब्रानी क्रिया उत्सवपूर्ण, आनंदभरी गतिविधि भी दर्शा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְשַׂחֲקִים
  choice: उत्सव मना रहे थे
  rationale: यह क्रिया खेल-कूद, आनंद और उत्सवपूर्ण गतिविधि को व्यक्त कर सकती है। वाद्यों से युक्त धार्मिक जुलूस के संदर्भ में ‘उत्सव मना रहे थे’ स्वाभाविक है और इसे केवल वाद्य बजाने तक सीमित नहीं करता।
- source_word: לִפְנֵי הָאֱלֹהִים
  choice: परमेश्वर के सामने
  rationale: यह परमेश्वर की उपस्थिति में की गई उपासना और उत्सव का सीधा, स्वाभाविक हिंदी रूप है।
- source_word: בְּכָל עֹז
  choice: अपना पूरा ज़ोर लगाकर
  rationale: עֹז शक्ति या सामर्थ्य दर्शाता है। बहुवचन कर्ता के साथ यह मुहावरेदार हिंदी उत्सव की पूरी तीव्रता को व्यक्त करती है।
- source_word: שִׁירִים
  choice: गीत गा रहे थे
  rationale: मूल में बहुवचन संज्ञा ‘गीत’ है; हिंदी में वाद्यों की सूची के साथ ‘गीत गा रहे थे’ आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כִנֹּרוֹת
  choice: वीणाएँ
  rationale: כִּנּוֹר प्राचीन तार वाला, संभवतः लायर-जैसा वाद्य था। ‘वीणा’ आधुनिक हिंदी पाठकों के लिए परिचित निकटतम सामान्य नाम है।
- source_word: נְבָלִים
  choice: सारंगियाँ
  rationale: נֵבֶל पहले तार वाले वाद्य से अलग एक अन्य तार वाद्य था, जिसकी ठीक बनावट अनिश्चित है। ‘सारंगी’ सूची में दोनों वाद्यों का भेद बनाए रखते हुए सहज हिंदी वाद्य-नाम देती है।
- source_word: תֻפִּים
  choice: डफ
  rationale: תֹּף चौखटे वाला हाथ से बजाया जाने वाला ढोल था; ‘डफ’ हिंदी में इसका संक्षिप्त और परिचित समतुल्य है।
- source_word: מְצִלְתַּיִם
  choice: झाँझ
  rationale: यह धातु के आपस में टकराकर बजाए जाने वाले वाद्य का मानक और स्वाभाविक हिंदी नाम है।
- source_word: חֲצֹצְרוֹת
  choice: तुरहियाँ
  rationale: यह औपचारिक सीधे फूँक-वाद्यों को दर्शाता है। ‘तुरहियाँ’ उपयुक्त है; मूल में यहाँ ‘चाँदी की’ नहीं कहा गया, इसलिए वह विवरण नहीं जोड़ा गया।
- source_word: וְדָוִיד וְכָל יִשְׂרָאֵל
  choice: दाऊद और सारा इस्राएल
  rationale: राष्ट्रीय समुदाय के सामूहिक उल्लेख को ‘सारा इस्राएल’ स्वाभाविक रूप से सुरक्षित रखता है। आरंभिक संयोजक को हिंदी अनुच्छेद की स्वतंत्र पद-प्रस्तुति में आवश्यक न मानकर नहीं रखा गया।
theological_decisions:
- issue: הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: उस परमेश्वर
  rationale: यद्यपि इब्रानी में निश्चित उपपद है, यहाँ यह इस्राएल के परमेश्वर का सामान्य पदनाम है। ‘परमेश्वर’ स्वाभाविक हिंदी है और संदर्भित सत्ता की पहचान बनाए रखता है।
- issue: מְשַׂחֲקִים में उत्सव, खेल और आनंद की अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘उत्सव मना रहे थे’, पादटिप्पणी में वैकल्पिक अर्थ
  alternative: परमेश्वर के सामने खेलते/आनंद करते हुए
  rationale: धार्मिक जुलूस का प्रसंग उत्सवपूर्ण अर्थ का समर्थन करता है, पर क्रिया की व्यापक अर्थ-व्याप्ति को पादटिप्पणी में सुरक्षित रखा गया है ताकि संभावित तनाव मिटाया न जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी अपनाई गई है। वाद्यों के प्राचीन स्वरूप की अनिश्चितता के कारण परिचित हिंदी समतुल्य चुने गए हैं; सूची में अलग-अलग तार वाद्यों का भेद बनाए रखा गया है।
