  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। भौगोलिक नामों को मूल इब्रानी के निकट लिप्यंतरित किया गया है और जहाँ पहचान या अर्थ अनिश्चित है, वहाँ पादटिप्पणी में विकल्प सुरक्षित रखा गया है।
