  text: וַ/יַּקְהֵ֤ל דָּוִיד֙ אֶת כָּל יִשְׂרָאֵ֔ל מִן שִׁיח֥וֹר מִצְרַ֖יִם וְ/עַד לְב֣וֹא חֲמָ֑ת לְ/הָבִיא֙ אֶת אֲר֣וֹן הָ/אֱלֹהִ֔ים מִ/קִּרְיַ֖ת יְעָרִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_chronicles/013/005.yaml
  text: So David assembled all Israel[a], from the Shihor of Egypt to Lebo-hamath[b], to bring the ark of God from Kiriath-jearim.
translation:
  language: hi
  text: तब दाऊद ने मिस्र के शीहोर[a] से लेकर लबो-हमात[b] तक समस्त इस्राएल को इकट्ठा किया, ताकि परमेश्वर का सन्दूक किर्यत-यारीम से ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मिस्र का शीहोर” दक्षिणी सीमा का एक संकेत है; कुछ लोग इसे “मिस्र का नाला” समझते हैं।
    reason: cultural_note
  - marker: b
    text: 'अधिक शाब्दिक अनुवाद: “हमात के प्रवेश तक।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप किसी समूह को एकत्र करने का भाव देता है। यह आधुनिक हिन्दी में स्वाभाविक और राष्ट्रीय सभा के प्रसंग के अनुकूल है।
- source_word: כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल
  rationale: इब्रानी के सामूहिक राष्ट्रीय पद को बनाए रखता है; इसका आशय राष्ट्र का प्रतिनिधिक समूहन हो सकता है, अनिवार्यतः हर व्यक्ति नहीं।
- source_word: מִן שִׁיחוֹר מִצְרַיִם
  choice: मिस्र के शीहोर से
  rationale: शीहोर को स्थान-नाम के रूप में लिप्यंतरित किया गया है, ताकि मुख्य पाठ में किसी विशेष जलधारा से उसकी पहचान समय से पहले निश्चित न कर दी जाए।
- source_word: וְעַד לְבוֹא חֲמָת
  choice: लबो-हमात तक
  rationale: यह पद सीमा-सूचक मान्य स्थान-नाम के रूप में काम करता है। अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְהָבִיא
  choice: ताकि ... ले आएँ
  rationale: उद्देश्यसूचक क्रियार्थक रूप को स्वाभाविक हिन्दी उद्देश्य-वाक्य से व्यक्त किया गया है; बहुवचन कर्ता एकत्र किए गए इस्राएल को इंगित करता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: सम्बन्धवाचक इब्रानी पद का मानक और सीधा हिन्दी अनुवाद है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
- source_word: מִקִּרְיַת יְעָרִים
  choice: किर्यत-यारीम से
  rationale: इब्रानी स्थान-नाम को हिन्दी देवनागरी में पहचाने जाने योग्य रूप में सुरक्षित रखा गया है।
