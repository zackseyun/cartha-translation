source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן מֹשֶׁ֗ה אֶת מֶ֨כֶס֙ תְּרוּמַ֣ת יְהוָ֔ה לְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/041.yaml
  text: And Moses gave the tribute[a], the contribution for Yahweh, to Eleazar the priest[b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: और मूसा ने कर का वह अंश, जो याहवे के लिए अलग किया गया था, एलीआज़र याजक को दे दिया, जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का यह कथात्मक रूप पूर्ण हुई क्रिया बताता है; हिंदी में ‘दे दिया’ स्वाभाविक और स्पष्ट है।
- source_word: מֶכֶס
  choice: निर्धारित कर
  rationale: लूट में से आँककर अनिवार्य रूप से लिया गया हिस्सा अभिप्रेत है। ‘कर’ उसकी देय प्रकृति और ‘निर्धारित’ प्रसंगगत आकलन को व्यक्त करता है।
- source_word: תְּרוּמַת יְהוָה
  choice: यहोवा के लिए निर्धारित
  rationale: यह पदबंध उस कर को यहोवा के लिए अलग किए गए अंश के रूप में स्पष्ट करता है; इससे अनावश्यक रूप से किसी विशिष्ट चढ़ाने की विधि का संकेत नहीं मिलता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि से।
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़र याजक को
  rationale: पूर्वसर्ग, व्यक्ति के नाम और पद का सीधा तथा स्वाभाविक हिंदी रूप।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: यह पूर्व में दी गई आज्ञा के ठीक अनुरूप किए गए कार्य को व्यक्त करता है; ‘दी थी’ हिंदी कथन में पूर्वकालिकता स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में ईश्वर का व्यक्तिगत चतुरक्षरी नाम है। हिंदी पाठकों में स्थापित बाइबलीय रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से अलग रखते हुए स्पष्ट रूप से प्रस्तुत करता है।
- issue: תְּרוּמַת יְהוָה का संबंध
  choice: कर को यहोवा के लिए निर्धारित बताना
  alternative: यहोवा की भेंट
  rationale: रचनात्मक संबंध को उद्देश्य या स्वामित्व दोनों की दिशा में समझा जा सकता है। मुख्य पाठ प्रसंगानुसार अलग किए गए हिस्से को व्यक्त करता है, जबकि पादटिप्पणी ‘भेंट’ की वैकल्पिक अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, सहज कथात्मक शैली रखी गई है। ‘निर्धारित कर’ प्रसंगगत अर्थ को संक्षेप में व्यक्त करता है, और तकनीकी ‘उठाई हुई भेंट’ को मुख्य पाठ के बजाय पादटिप्पणी में रखा गया है।
