  text: וַֽ/יִּקְרְבוּ֙ אֶל מֹשֶׁ֔ה הַ/פְּקֻדִ֕ים אֲשֶׁ֖ר לְ/אַלְפֵ֣י הַ/צָּבָ֑א שָׂרֵ֥י הָ/אֲלָפִ֖ים וְ/שָׂרֵ֥י הַ/מֵּאֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/048.yaml
  text: Then the officers who were over the thousands of the army[a], the commanders of thousands and the commanders of hundreds[b], came near to Moses.
translation:
  language: hi
  text: तब सेना की हज़ारों की टुकड़ियों पर नियुक्त अधिकारी, अर्थात् हज़ारों के सेनापति और सैकड़ों के सेनापति, मूसा के पास आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: पास आए
  rationale: क्रिया קרב किसी व्यक्ति की ओर निकट आने को व्यक्त करती है; ‘पास आए’ ठोस अर्थ और कथात्मक प्रवाह दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַפְּקֻדִים
  choice: नियुक्त अधिकारी
  rationale: यह פקד से बना रूप है और यहाँ सैन्य इकाइयों पर नियुक्त व्यक्तियों को दर्शाता है; ‘नियुक्त अधिकारी’ उनके पद और दायित्व दोनों को स्पष्ट करता है।
- source_word: אֲשֶׁר לְאַלְפֵי הַצָּבָא
  choice: सेना की हज़ारों की टुकड़ियों पर
  rationale: सन्दर्भ और आगे आने वाले पदनामों से अधिकार-क्षेत्र का भाव निकलता है। ‘टुकड़ियों पर’ सैन्य इकाइयों की जिम्मेदारी को सहज हिन्दी में व्यक्त करता है।
- source_word: אַלְפֵי
  choice: हज़ारों की टुकड़ियाँ
  rationale: אֶלֶף का अर्थ कभी कुल या सैन्य दल भी हो सकता है; यहाँ ‘सैकड़ों’ के समानांतर सैन्य सन्दर्भ में हज़ार सैनिकों की इकाइयाँ अभिप्रेत हैं। ‘टुकड़ियाँ’ जोड़ने से हिन्दी में इकाई का भाव स्पष्ट होता है।
- source_word: הַצָּבָא
  choice: सेना
  rationale: यहाँ צבא संगठित युद्ध-बल को दर्शाता है; आधुनिक मानक हिन्दी में ‘सेना’ स्पष्ट और गरिमापूर्ण है।
- source_word: שָׂרֵי הָאֲלָפִים
  choice: हज़ार-हज़ार के सेनापति
  rationale: שׂר सैन्य प्रसंग में अधिकारी या सेनानायक है। यह अभिव्यक्ति प्रत्येक हज़ार की इकाई पर अधिकार रखने वाले पद को स्वाभाविक हिन्दी में बताती है।
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: और सौ-सौ के सेनापति
  rationale: पिछले पदनाम के समानांतर यह प्रत्येक सौ की इकाई के अधिकारी को दर्शाता है और सैन्य पदक्रम बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। मूल के ‘नियुक्त लोगों/अधिकारियों’ और उसके बाद दिए गए विशिष्ट सैन्य पदों के संबंध को डैश द्वारा ऐपोज़िशन के रूप में सुरक्षित रखा गया है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी, क्योंकि वैकल्पिक अर्थों को मुख्य पाठ में स्वाभाविक रूप से स्पष्ट किया जा सकता है।
