base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/008.yaml
  text: 'They killed the kings of Midian along with the rest of their slain: Evi[a], Rekem, Zur, Hur, and Reba, the five kings of Midian. They also killed Balaam son of Beor with the sword.'
translation:
  language: hi
  text: 'उन्होंने मिद्यान के राजाओं को भी मिद्यान के मारे गए लोगों के साथ[a] मार डाला: एवी, रेकेम, सूर, हूर और रेबा—मिद्यान के पाँचों राजा। उन्होंने बओर के पुत्र बिलाम को भी तलवार से मार डाला।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिद्यान के मारे गए लोगों के बीच।” इब्रानी वाक्यांश संक्षिप्त है और यह संकेत कर सकता है कि ये राजा मिद्यान के अन्य मृतकों के बीच मारे गए थे।
    reason: lexical_alternative
