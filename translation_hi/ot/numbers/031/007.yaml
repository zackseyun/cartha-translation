base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/007.yaml
  text: So they waged war against Midian[a], just as Yahweh had commanded Moses, and they killed every male.
translation:
  language: hi
  text: उन्होंने मिद्यान के विरुद्ध युद्ध किया[a], ठीक जैसे याहवे ने मूसा को आज्ञा दी थी, और उन्होंने हर नर को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने मिद्यान से लड़ाई की।” इब्रानी क्रिया सैन्य सेवा या युद्ध में उतरने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְבְּאוּ
  choice: उन्होंने … युद्ध किया
  rationale: यह क्रिया सैन्य अभियान या युद्ध में उतरने को व्यक्त करती है। ‘युद्ध किया’ आधुनिक हिन्दी में स्वाभाविक है और इसके सैन्य अर्थ को स्पष्ट रखता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: सैन्य क्रिया के साथ यह संबंधबोधक शत्रुतापूर्ण दिशा दर्शाता है; इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: מִדְיָן
  choice: मिद्यान
  rationale: इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसे
  rationale: यह युद्ध की कार्रवाई और दी गई आज्ञा के बीच पूर्ण अनुरूपता व्यक्त करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: 'हिन्दी में पूर्वकालिकता स्वाभाविक ढंग से दिखती है: आज्ञा युद्ध से पहले दी गई थी।'
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय निज नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת मूसा को ‘आज्ञा देना’ क्रिया का कर्म बनाता है; हिन्दी में ‘मूसा को आज्ञा दी’ स्वाभाविक रचना है।
- source_word: וַיַּהַרְגוּ
  choice: उन्होंने … मार डाला
  rationale: הרג का सीधा अर्थ ‘मार डालना’ है; यह न तो अर्थ को नरम करता है, न पुरातन भाषा अपनाता है।
- source_word: כָּל
  choice: हर
  rationale: एकवचन ‘नर’ के साथ ‘हर’ כָּל के वितरणात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: זָכָר
  choice: नर
  rationale: इब्रानी शब्द जैविक रूप से पुरुष लिंग के व्यक्ति को व्यापक रूप में बताता है, केवल वयस्क पुरुष को नहीं; ‘नर’ इस दायरे को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निज नाम है। ‘याहवे’ उसके संभावित प्राचीन उच्चारण के निकट लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: זָכָר के लिंग और आयु-दायरे को बनाए रखना
  choice: नर
  alternative: पुरुष
  rationale: ‘पुरुष’ प्रायः वयस्क मनुष्य का बोध करा सकता है, जबकि זָכָר आयु को सीमित किए बिना प्रत्येक पुरुष-लिंगी व्यक्ति को समेटता है। कठोर दायरे को मूल के अनुसार अनसुलझा रखा गया है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी। युद्ध और वध की कठोरता को न नरम किया गया है, न उससे आगे बढ़ाया गया है। मुख्य पाठ में पाद-टिप्पणी चिह्न [a] रखा गया है।
