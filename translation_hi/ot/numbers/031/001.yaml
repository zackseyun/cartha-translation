  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। हिन्दी में किसी व्यक्ति को संबोधित कर דבר और उसके बाद לֵאמֹר आने पर ‘कहा’ सहज और अर्थनिष्ठ प्रयोग है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम चतुरक्षर יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: बोलने के प्रसंग में यह संबोधित व्यक्ति को चिह्नित करता है; आधुनिक हिन्दी में ‘मूसा से कहा’ स्वाभाविक रचना है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी व्यक्तिगत नाम का मानक हिन्दी रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियारूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘यह कहते हुए’ या ‘कहते हुए कहा’ बोझिल होता; ‘कहा’ सूत्र का अर्थ स्वाभाविक रूप से समेटता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ मूल पाठ में व्यक्तिगत नाम יהוה है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। इब्रानी कथात्मक क्रम के लिए ‘तब’ रखा गया है; वाक्य अगले पद में आने वाले प्रत्यक्ष कथन की स्वाभाविक भूमिका बनाता है।
