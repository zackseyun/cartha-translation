source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֶלְעָזָ֤ר הַ/כֹּהֵן֙ אֶל אַנְשֵׁ֣י הַ/צָּבָ֔א הַ/בָּאִ֖ים לַ/מִּלְחָמָ֑ה זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/021.yaml
  text: Then Eleazar the priest said to the men of the army who had come to the battle[a], “This is the statute of the law that Yahweh commanded Moses:”
translation:
  language: hi
  text: तब एलिआज़ार याजक ने सेना के उन पुरुषों से, जो युद्ध में गए थे, कहा, “यह व्यवस्था का विधान[a] है, जिसकी आज्ञा याहवे ने मूसा को दी थी:”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “व्यवस्था की विधि” अथवा “शिक्षा का विधान।”
    reason: חֻקָּה का अर्थ ‘विधान/विधि’ और תּוֹרָה का अर्थ ‘व्यवस्था/शिक्षा’ हो सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलिआज़ार याजक
  rationale: व्यक्तिनाम का मानक लिप्यंतरण किया गया है और निश्चित पदवी הַכֹּהֵן को ‘याजक’ कहा गया है।
- source_word: אַנְשֵׁי הַצָּבָא
  choice: सेना के ... पुरुषों
  rationale: इब्रानी पदबंध का स्पष्ट पुरुषवाची अर्थ और सामूहिक सैन्य संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: הַבָּאִים לַמִּלְחָמָה
  choice: जो युद्ध में गए थे
  rationale: शाब्दिक रूप से यह ‘युद्ध की ओर आने/जाने वाले’ है। हिन्दी में वक्ता के दृष्टिकोण से ‘युद्ध में गए थे’ स्वाभाविक है और प्रसंग के सैनिकों को सूचित करता है, बिना ‘लौटकर आए’ को पाठ में जोड़ने के।
- source_word: חֻקַּת הַתּוֹרָה
  choice: व्यवस्था का विधान
  rationale: חֻקָּה का स्थिर, बाध्यकारी विधान और תּוֹרָה का अधिकारपूर्ण व्यवस्था/शिक्षा-संबंधी अर्थ इस संक्षिप्त कानूनी पदबंध में सुरक्षित है।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: जिसकी आज्ञा याहवे ने मूसा को दी थी
  rationale: אֶת मूसा को आज्ञा पाने वाले प्रत्यक्ष कर्म के रूप में चिह्नित करता है; इसलिए यह नहीं कहा गया कि आज्ञा ‘मूसा के द्वारा’ दी गई।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: חֻקַּת הַתּוֹרָה में विधान और शिक्षा का संबंध
  choice: व्यवस्था का विधान
  alternative: शिक्षा का विधान; व्यवस्था की विधि
  rationale: यह अनुवाद कानूनी बाध्यता को सामने रखता है, जबकि पादटिप्पणी תּוֹרָה के व्यापक ‘शिक्षा’ अर्थ को खुला रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी अपनाई गई है। कानूनी पदबंध को अत्यधिक संस्कृतनिष्ठ बनाए बिना उसकी औपचारिकता रखी गई है। पद के अंत का द्विबिंदु आगे आने वाली आज्ञाओं से इसके व्याकरणिक संबंध को दर्शाता है।
