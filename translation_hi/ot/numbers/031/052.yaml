source:
  edition: WLC
  text: וַ/יְהִ֣י כָּל זְהַ֣ב הַ/תְּרוּמָ֗ה אֲשֶׁ֤ר הֵרִ֨ימוּ֙ לַֽ/יהוָ֔ה שִׁשָּׁ֨ה עָשָׂ֥ר אֶ֛לֶף שְׁבַע מֵא֥וֹת וַ/חֲמִשִּׁ֖ים שָׁ֑קֶל מֵ/אֵת֙ שָׂרֵ֣י הָֽ/אֲלָפִ֔ים וּ/מֵ/אֵ֖ת שָׂרֵ֥י הַ/מֵּאֽוֹת׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/052.yaml
  text: And all the gold of the contribution that they presented to Yahweh was sixteen thousand seven hundred and fifty shekels[a], from the commanders of the thousands and from the commanders of the hundreds.
translation:
  language: hi
  text: और याहवे के लिए चढ़ाई गई भेंट का सारा सोना सोलह हज़ार सात सौ पचास शेकेल था[a]—हज़ारों के सेनापतियों और सैकड़ों के सेनापतियों की ओर से।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “योगदान”; परंपरागत रूप से “उठाई हुई भेंट।” इब्रानी शब्द उस अंश को दर्शाता है जिसे याहवे के लिए अलग किया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כָּל זְהַב
  choice: और ... सोना ... कुल ... था
  rationale: वाक्य को पिछले वृत्तांत से जोड़ते हुए सोने की कुल मात्रा स्वाभाविक हिन्दी में व्यक्त की गई है।
- source_word: הַתְּרוּמָה
  choice: अर्पित भेंट
  rationale: यह शब्द पवित्र उपयोग के लिए अलग किए गए अंश या योगदान को दर्शाता है; ‘अर्पित भेंट’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और केवल सामान्य दान का भाव नहीं देता।
- source_word: אֲשֶׁר הֵרִימוּ
  choice: के रूप में चढ़ाया गया
  rationale: हिफ़ील रूप यहाँ सचमुच ऊपर उठाने के बजाय अलग करके परमेश्वर को प्रस्तुत करने का भाव रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: पूर्वसर्ग समर्पण की दिशा बताता है, और चार अक्षरों वाले ईश्वरीय नाम को नाम के रूप में लिप्यंतरित किया गया है।
- source_word: שִׁשָּׁה עָשָׂר אֶלֶף שְׁבַע מֵאוֹת וַחֲמִשִּׁים שָׁקֶל
  choice: सोलह हज़ार सात सौ पचास शेकेल
  rationale: मूल संख्या और प्राचीन भार-इकाई को बिना अनुमानित आधुनिक रूपांतरण के सुरक्षित रखा गया है।
- source_word: מֵאֵת שָׂרֵי הָאֲלָפִים וּמֵאֵת שָׂרֵי הַמֵּאוֹת
  choice: सहस्र-दल के सेनापतियों और शत-दल के सेनापतियों की ओर से
  rationale: מֵאֵת स्रोत बताता है। ‘सहस्र-दल’ और ‘शत-दल’ इन पदाधिकारियों के अधीन सैन्य इकाइयों को स्पष्ट करते हैं, न कि केवल व्यक्तियों की गिनती को।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: תְּרוּמָה का पवित्र-अर्पण संबंधी अर्थ
  choice: अर्पित भेंट
  alternative: योगदान; उठाई हुई भेंट
  rationale: संदर्भ में यह युद्ध की लूट में से याहवे के लिए अलग किया गया अंश है। चुना हुआ रूप पवित्र समर्पण का भाव रखता है, पर किसी विशिष्ट बाद की अनुष्ठानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। सैन्य पदक्रम को ‘सहस्र-दल’ और ‘शत-दल’ से व्यक्त किया गया है ताकि मूल की इकाई-संरचना बनी रहे; ‘शेकेल’ को प्राचीन भार-इकाई के रूप में ज्यों का त्यों रखा गया है।
