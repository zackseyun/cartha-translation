  yaml_path: translation/ot/numbers/031/036.yaml
  text: And the half[a], the portion of those who went out to war, was in number 337,500 sheep.
translation:
  language: hi
  text: और आधा भाग, अर्थात युद्ध में जानेवालों का हिस्सा, भेड़ों की संख्या में 337,500 था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: था
  rationale: यहाँ क्रिया विभाजन के बाद निकली कुल मात्रा बताती है; सरल संबंधसूचक रूप स्वाभाविक और मूल के निकट है।
- source_word: הַמֶּחֱצָה
  choice: आधा भाग
  rationale: यह पिछले संदर्भ में बाँटी गई लूट के एक आधे भाग को सूचित करता है।
- source_word: חֵלֶק
  choice: हिस्सा
  rationale: यह 'आधा भाग' के समानाधिकरण में आकर स्पष्ट करता है कि यह आधा किसका था।
- source_word: הַיֹּצְאִים בַּצָּבָא
  choice: युद्ध में गए लोगों
  rationale: सैन्य अभियान में भाग लेने वालों के लिए यह स्वाभाविक आधुनिक हिन्दी है और इब्रानी सैन्य अभिव्यक्ति का आशय सुरक्षित रखती है।
- source_word: מִסְפַּר
  choice: 337,500
  rationale: हिन्दी वाक्य में सीधे संख्यात्मक विधान से गिनती का अर्थ स्पष्ट हो जाता है; अलग से 'संख्या में' कहना अनावश्यक और अस्वाभाविक होगा।
- source_word: הַצֹּאן
  choice: भेड़ें
  rationale: इस प्रसंग में यह झुंड के रूप में गिनी गई भेड़ों को सूचित करता है।
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף וְשִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 337,500
  rationale: इब्रानी की योगात्मक संख्या ठीक 337,500 है; आधुनिक अंकों में देना पढ़ने और जाँचने में सरल है।
