base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/040.yaml
  text: And the persons of mankind were sixteen thousand, and their tribute for Yahweh was thirty-two persons.
translation:
  language: hi
  text: और मनुष्यों की संख्या सोलह हज़ार थी, और उनमें से यहोवा के लिए लिया गया कर बत्तीस व्यक्ति था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कर’ के लिए ‘निर्धारित अंश’ भी कहा जा सकता है। इब्रानी शब्द लूट में से यहोवा के लिए अलग किए गए नियत हिस्से को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: मनुष्यों की संख्या
  rationale: इस लूट-सूची में यह पदबंध पशुओं के विपरीत मानव व्यक्तियों की गणना बताता है। स्वाभाविक हिन्दी में ‘मनुष्यों की संख्या’ मूल अर्थ को स्पष्ट रखता है और נֶפֶשׁ को अनावश्यक रूप से आध्यात्मिक ‘आत्मा’ नहीं बनाता।
- source_word: שִׁשָּׁה עָשָׂר אָלֶף
  choice: सोलह हज़ार
  rationale: मूल संख्या का सीधा और मानक हिन्दी रूप।
- source_word: מִכְסָם
  choice: उनमें से ... कर-बँटाई
  rationale: מֶכֶס यहाँ लूट में से निर्धारित करके अलग किए गए अंश को दर्शाता है। ‘कर-बँटाई’ प्रशासनिक आकलन और अलग किए गए हिस्से, दोनों भावों को व्यक्त करती है; ‘कर’ या ‘चढ़ावा’ इसके अर्थ को क्रमशः अत्यधिक राजस्व-संबंधी या धार्मिक बना सकते हैं।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ समर्पण अथवा आवंटन दर्शाता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שְׁנַיִם וּשְׁלֹשִׁים נָפֶשׁ
  choice: बत्तीस व्यक्ति
  rationale: נֶפֶשׁ यहाँ अलग-अलग मानव व्यक्तियों की गणना का शब्द है; ‘व्यक्ति’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में टेट्राग्रामटन व्यक्तिगत नाम के रूप में है। हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को शीर्षक ‘प्रभु’ में बदलने के बजाय उसकी विशिष्टता बनाए रखता है; ‘याहवे’ भी संभावित लिप्यंतरण है।
- issue: נֶפֶשׁ को मानव-गणना के संदर्भ में समझना
  choice: संख्या / व्यक्ति
  alternative: प्राण / आत्माएँ
  rationale: यहाँ נֶפֶשׁ मनुष्य के किसी पृथक आध्यात्मिक घटक पर शिक्षा नहीं देता, बल्कि लूट में गिने गए मानव व्यक्तियों के लिए प्रयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-जैसे प्रशासनिक प्रसंग के अनुरूप रखी गई है। ‘मनुष्यों की संख्या’ पशुओं से भेद स्पष्ट करता है, जबकि ‘बत्तीस व्यक्ति’ हिन्दी में स्वाभाविक गणना है।
