id: NUM.31.39
reference: Numbers 31:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/חֲמֹרִ֕ים שְׁלֹשִׁ֥ים אֶ֖לֶף וַ/חֲמֵ֣שׁ מֵא֑וֹת וּ/מִכְסָ֥/ם לַֽ/יהוָ֖ה אֶחָ֥ד וְ/שִׁשִּֽׁים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/039.yaml
  text: The donkeys were 30,500[a], and their tribute to Yahweh was 61.
translation:
  language: hi
  text: और गधे 30,500 थे, और उनका याहवे के लिए निर्धारित अंश 61 था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: और गधे
  rationale: חֲמֹרִים का सामान्य अर्थ ‘गधे’ है। आरंभिक וַ को सूची की पिछली कड़ी से संबंध बनाए रखने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: שְׁלֹשִׁים אֶלֶף וַ/חֲמֵשׁ מֵאוֹת
  choice: 30,500
  rationale: इब्रानी संख्या ‘तीस हज़ार और पाँच सौ’ है; सांख्यिकीय सूची में स्पष्टता के लिए अंकों का प्रयोग किया गया है।
- source_word: וּ/מִכְסָ/ם
  choice: उनमें से ... निर्धारित कर
  rationale: מֶכֶס यहाँ युद्ध की लूट में से आकलित करके अलग रखे गए अनिवार्य अंश को दर्शाता है। ‘निर्धारित कर’ उसकी बाध्य और अनुपातित प्रकृति को सामान्य हिन्दी में व्यक्त करता है; प्रत्यय ם को ‘उनमें से’ द्वारा संदर्भानुसार स्पष्ट किया गया है।
- source_word: לַ/יהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ उस कर के प्राप्तकर्ता अथवा उसके लिए अलग किए जाने को सूचित करता है। परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘यहोवा’ रखा गया है।
- source_word: אֶחָד וְ/שִׁשִּׁים
  choice: 61 गधों का
  rationale: इब्रानी में संख्या ‘इकसठ’ है। हिन्दी में यह स्पष्ट करने के लिए ‘गधों का’ दोहराया गया है कि यह कर की राशि नहीं, पशुओं की संख्या है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को किसी उपाधि में बदलने के बजाय सुरक्षित रखता है; स्वरांकन की ऐतिहासिक अनिश्चितता के कारण ‘याहवे’ भी संभव है।
- issue: מֶכֶס की धार्मिक-प्रशासनिक प्रकृति
  choice: निर्धारित कर
  alternative: निर्धारित हिस्सा; भेंट
  rationale: यह स्वैच्छिक भेंट नहीं, लूट में से गणना के अनुसार निकाला गया देय अंश है। इसलिए ‘कर’ बाध्यता को बनाए रखता है, जबकि ‘निर्धारित’ इसके विशेष संदर्भ को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। सूचीगत प्रवाह के लिए आरंभ में ‘और’ तथा सटीक गणना के लिए अंक प्रयुक्त हैं। ‘61 गधों का’ जोड़कर हिन्दी में संदर्भ स्पष्ट किया गया है, बिना मूल संख्या या उसके कर के रूप में दिए जाने को बदले।
