    issue: “शारीरिक संबंध” is semantically broader than the source idiom.
    rationale: The phrase may refer to any physical contact, while the Hebrew expression “know the bed of a male” is an established euphemism for sexual relations.
  - severity: low
    issue: The footnote’s literal Hindi, “पुरुष का शयन नहीं जाना था,” is unidiomatic and does not clearly reflect the Hebrew construction.
    rationale: A literal gloss should remain understandable while indicating that the underlying expression is idiomatic.
  revised_text: और उन स्त्रियों में से, जिन्होंने किसी पुरुष के साथ सहवास नहीं किया था,[a] कुल बत्तीस हज़ार व्यक्ति थे।
