  yaml_path: translation/ot/numbers/031/035.yaml
  text: And the persons from the women who had not known the bed of a male[a], all the persons, were thirty-two thousand.
translation:
  language: hi
  text: और उन स्त्रियों में से, जिन्होंने किसी पुरुष के साथ सहवास नहीं किया था,[a] कुल बत्तीस हज़ार व्यक्ति थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “किसी पुरुष का बिछौना नहीं जाना था”; यह किसी पुरुष के साथ यौन संबंध न होने का मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶפֶשׁ אָדָם
  choice: व्यक्ति
  rationale: यह पद आसपास गिने गए पशुओं के विपरीत मनुष्यों की संख्या बताता है। आधुनिक हिन्दी में “व्यक्ति” इस भेद और गणना—दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַנָּשִׁים
  choice: उन स्त्रियों में से
  rationale: מִן इस समूह को युद्ध में लाई गई स्त्रियों के बड़े समूह में से अलग करता है; “उन स्त्रियों में से” प्रसंग और विभाजन दोनों को स्पष्ट रखता है।
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: जिन्होंने किसी पुरुष के साथ शारीरिक संबंध नहीं बनाए थे
  rationale: यह इब्रानी यौन-संबंध का शिष्टोक्तिपूर्ण मुहावरा है। अर्थ को मुख्य पाठ में स्वाभाविक और स्पष्ट हिन्दी में दिया गया है, जबकि मूल मुहावरे का अधिक शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
- source_word: כָּל נֶפֶשׁ
  choice: कुल व्यक्तियों की संख्या
  rationale: यह अभिव्यक्ति गिने जा रहे पूरे समूह का योग प्रस्तुत करती है; हिन्दी में यह गणना-सूत्र को स्पष्ट और सहज बनाती है।
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אָלֶף
  choice: बत्तीस हज़ार
  rationale: इब्रानी संख्या का मानक हिन्दी रूप।
theological_decisions:
- issue: यौन अनुभव का वर्णन
  choice: किसी पुरुष के साथ शारीरिक संबंध नहीं बनाए थे
  alternative: पुरुष का शयन नहीं जाना था
  rationale: पाठ का आशय बिना किसी अतिरिक्त नैतिक या सांप्रदायिक व्याख्या के व्यक्त किया गया है। अधिक शाब्दिक मुहावरा आधुनिक हिन्दी में अस्पष्ट होता, इसलिए उसे पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज गणना-वर्णन। “व्यक्ति” मनुष्यों और पशुओं के बीच प्रसंगगत भेद बनाए रखता है; मुख्य पाठ में कठिन शाब्दिक मुहावरे के स्थान पर उसका स्वाभाविक अर्थ दिया गया है।
