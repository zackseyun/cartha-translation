  yaml_path: translation/ot/numbers/031/037.yaml
  text: And the tribute for Yahweh from the flock was six hundred seventy-five.
translation:
  language: hi
  text: और झुंड में से यहोवा के लिए लिया गया कर छह सौ पचहत्तर पशुओं का था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... था
  rationale: यहाँ यह रूप कथा को आगे बढ़ाते हुए निर्धारित अंश की संख्या बताने वाला सामान्य संयोजक और अस्तित्वसूचक वाक्य-विन्यास है।
- source_word: הַמֶּכֶס
  choice: कर
  rationale: यह युद्ध की लूट में से निर्धारित और अलग किए गए अनिवार्य अंश को दर्शाता है। आधुनिक हिन्दी में ‘कर’ संक्षिप्त और सहज है, जबकि प्रसंग इसे सामान्य आधुनिक कराधान से अलग स्पष्ट करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग यहाँ उस अंश के गंतव्य अथवा समर्पण को व्यक्त करता है।
- source_word: יהוה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִן הַצֹּאן
  choice: झुंड में से
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, का सामूहिक बोध कराता है; ‘झुंड’ इसे किसी एक जाति तक सीमित नहीं करता।
- source_word: שֵׁשׁ מֵאוֹת חָמֵשׁ וְשִׁבְעִים
  choice: छः सौ पचहत्तर पशु
  rationale: संख्या को ठीक रखा गया है; हिन्दी वाक्य में गणनीय वस्तु स्पष्ट करने के लिए ‘पशु’ जोड़ा गया है।
theological_decisions:
- issue: ईश-नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में पहचाना जाने वाला लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण हिन्दी। पद की गणनात्मक शैली को बनाए रखते हुए शब्द-क्रम को स्वाभाविक किया गया है।
