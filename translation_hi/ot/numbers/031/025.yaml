  yaml_path: translation/ot/numbers/031/025.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: 'तब याहवे ने मूसा से कहा[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याहवे ने मूसा से कहा।” इब्रानी में यहाँ कथा के भीतर वचन आरम्भ करने का प्रचलित सूत्र है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब … ने … कहा
  rationale: वाव-क्रमिक रूप कथा को अगले घटनाक्रम में आगे बढ़ाता है। ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है; ‘और’ भी सम्भव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत नाम (चार अक्षरों वाला पवित्र नाम) है। इसे किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ इस कथन-सूत्र का स्वाभाविक रूप है, यद्यपि इब्रानी पूर्वसर्ग का अधिक शाब्दिक अर्थ ‘की ओर/को’ है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का मानक हिन्दी बाइबलीय रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप आगे आने वाले वचन का परिचय देता है। हिन्दी में ‘कहा:’ और उसके बाद का उद्धरण वही कार्य स्वाभाविक ढंग से करते हैं; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक और असहज होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और ‘यहोवा’ की अपेक्षा उसके सम्भावित प्राचीन उच्चारण का निकटतर लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘तब’ कथा के क्रम को स्पष्ट करता है, और अन्त का द्विबिंदु अगले पद में आने वाले कथन का संकेत देता है।
