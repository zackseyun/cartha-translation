lexical_decisions:
- source_word: וַ/חֲמֹרִים
  choice: और गधे
  rationale: חֲמֹרִים का सामान्य अर्थ ‘गधे’ है। आरम्भिक ו को सूची की संरचना बनाए रखने के लिए ‘और’ के रूप में रखा गया है। हिंदी में इस गणना-सूची में निश्चित उपपद की आवश्यकता नहीं है।
- source_word: שְׁלֹשִׁים אֶלֶף
  choice: तीस हज़ार
  rationale: यह मानक इब्रानी संख्या-रचना है और इसका सीधा, स्वाभाविक हिंदी रूप ‘तीस हज़ार’ है।
- source_word: וַ/חֲמֵשׁ מֵאוֹת
  choice: पाँच सौ
  rationale: इब्रानी में संख्या का यह भाग संयोजक ו के साथ जोड़ा गया है। हिंदी में संयुक्त संख्या ‘तीस हज़ार पाँच सौ’ बिना दूसरे ‘और’ के अधिक स्वाभाविक और अर्थतः पूर्ण है।
