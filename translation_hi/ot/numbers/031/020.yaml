  text: וְ/כָל בֶּ֧גֶד וְ/כָל כְּלִי ע֛וֹר וְ/כָל מַעֲשֵׂ֥ה עִזִּ֖ים וְ/כָל כְּלִי עֵ֑ץ תִּתְחַטָּֽאוּ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/020.yaml
  text: And every garment[a], and every article of leather, and every work of goats’ hair, and every article of wood, you shall purify.
translation:
  language: hi
  text: और हर वस्त्र, चमड़े की हर वस्तु, बकरियों के बाल से बनी हर वस्तु और लकड़ी की हर वस्तु को शुद्ध करो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया आत्मवाचक रूप में है और इसका अर्थ “अपने आप को शुद्ध करो” भी हो सकता है; यहाँ प्रसंग में यह युद्ध के बाद वस्तुओं के अनुष्ठानिक शुद्धीकरण को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: वस्त्र
  rationale: यह शब्द सामान्यतः पहनने के कपड़े या वस्त्र को दर्शाता है; सूची की गरिमापूर्ण शैली में ‘वस्त्र’ स्वाभाविक है।
- source_word: כְּלִי עוֹר
  choice: चमड़े की हर वस्तु
  rationale: כְּלִי केवल पात्र नहीं, किसी भी प्रकार की वस्तु या उपकरण हो सकता है; עוֹר यहाँ खाल से तैयार चमड़े को दर्शा सकता है।
- source_word: מַעֲשֵׂה עִזִּים
  choice: बकरी के बाल से बनी हर चीज़
  rationale: शाब्दिक रूप से यह ‘बकरियों का बनाया हुआ काम/उत्पाद’ है। सामग्री-सूची के इस प्रसंग में बकरी के बाल से बनी चीज़ सबसे संभावित और सहज अर्थ है, यद्यपि इब्रानी में ‘बाल’ स्पष्ट रूप से नहीं लिखा है।
- source_word: כְּלִי עֵץ
  choice: लकड़ी की हर वस्तु
  rationale: כְּלִי का व्यापक अर्थ बनाए रखते हुए इसे केवल लकड़ी के पात्रों तक सीमित नहीं किया गया।
- source_word: תִּתְחַטָּאוּ
  choice: शुद्ध करो
  rationale: हित्पएल रूप सामान्यतः आत्मवाचक है, पर यहाँ इसके पहले वस्तुओं की सूची है और प्रसंग उन वस्तुओं के अनुष्ठानिक शुद्धीकरण की माँग करता है। हिंदी मुख्य पाठ में वस्तुओं को कर्म बनाकर अर्थ स्पष्ट किया गया है, जबकि रूपगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
theological_decisions:
- issue: युद्ध और शव-संपर्क के बाद अनुष्ठानिक शुद्धीकरण
  choice: ‘शुद्ध करो’ द्वारा वस्तुओं के अनुष्ठानिक शुद्धीकरण को व्यक्त करना
  alternative: ‘अपने को शुद्ध करो’
  rationale: इब्रानी क्रिया का रूप आत्मवाचक पढ़ा जा सकता है, लेकिन तत्काल पूर्ववर्ती सूची वस्त्रों और अन्य वस्तुओं की है। इसलिए मुख्य पाठ प्रसंगगत अर्थ देता है और पादटिप्पणी शाब्दिक रूप को दर्ज करती है; इसे नैतिक पाप-क्षमा या बाद की धर्मवैज्ञानिक अवधारणा नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सूची-सदृश वाक्य-विन्यास रखा गया है। ‘हर वस्तु/हर चीज़’ सामान्य पाठक के लिए सहज है, और ‘शुद्ध करो’ अनुष्ठानिक संदर्भ को बिना सांप्रदायिक विस्तार के व्यक्त करता है।
