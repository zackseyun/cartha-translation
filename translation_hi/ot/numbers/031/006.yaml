  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה אֶ֥לֶף לַ/מַּטֶּ֖ה לַ/צָּבָ֑א אֹ֠תָ/ם וְ/אֶת פִּ֨ינְחָ֜ס בֶּן אֶלְעָזָ֤ר הַ/כֹּהֵן֙ לַ/צָּבָ֔א וּ/כְלֵ֥י הַ/קֹּ֛דֶשׁ וַ/חֲצֹצְר֥וֹת הַ/תְּרוּעָ֖ה בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/006.yaml
  text: So Moses sent them to the war[a], a thousand from each tribe, them and Phinehas son of Eleazar the priest, to the war[b], with the holy vessels and the trumpets for the battle cry in his hand.
translation:
  language: hi
  text: मूसा ने उन्हें—हर गोत्र से एक हज़ार पुरुषों को—युद्ध के लिए भेजा, और उनके साथ एलीआज़र याजक के पुत्र पीनहास को भी भेजा। पीनहास के हाथ में पवित्र पात्र[a] और रण-संकेत देने की तुरहियाँ[b] थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान के पात्र” अथवा “पवित्र वस्तुएँ।”
    reason: lexical_alternative
  - marker: b
    text: या “संकेत देने की तुरहियाँ” अथवा “चेतावनी की तुरहियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: वर्णनात्मक प्रसंग में सामान्य और स्वाभाविक हिन्दी; मूल क्रिया का सीधा अर्थ सुरक्षित रखता है।
- source_word: אֶלֶף לַמַּטֶּה
  choice: हर गोत्र से एक हज़ार पुरुष
  rationale: वितरणात्मक अर्थ स्पष्ट करता है कि प्रत्येक गोत्र ने एक हज़ार पुरुष दिए; 'पुरुष' संदर्भ से स्पष्ट पूरक है।
- source_word: לַצָּבָא
  choice: युद्ध के लिए
  rationale: यहाँ शब्द संस्थागत सेना की अपेक्षा युद्ध-अभियान या सैनिक सेवा को सूचित करता है; हिन्दी में स्वाभाविक उद्देश्यात्मक प्रयोग।
- source_word: אֹתָם ... אֹתָם
  choice: उन्हें ... उन्हें
  rationale: इब्रानी की पुनरावृत्ति और बलाघात को बनाए रखा गया है, यद्यपि पठनीयता के लिए वाक्य-विभाजन किया गया है।
- source_word: פִּינְחָס בֶּן אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़र याजक के पुत्र पीनहास
  rationale: वंश-संबंध स्पष्ट और आधुनिक हिन्दी में स्वाभाविक है; 'याजक' धार्मिक पद का प्रचलित समतुल्य है।
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: पवित्र पात्र
  rationale: כְּלֵי का अर्थ पात्र, उपकरण या वस्तुएँ हो सकता है; संक्षिप्त मुख्य पाठ के साथ पादटिप्पणी व्यापक विकल्प सुरक्षित रखती है।
- source_word: וַחֲצֹצְרוֹת הַתְּרוּעָה
  choice: रण-संकेत देने की तुरहियाँ
  rationale: תְּרוּעָה के ऊँचे युद्ध-संकेत या चेतावनी-संकेत के कार्य को व्यक्त करता है, बिना उसे केवल मानवीय युद्ध-घोष बनाने के।
- source_word: בְּיָדוֹ
  choice: पीनहास के हाथ में
  rationale: एकवचन सर्वनाम का निकटतम एकवचन पूर्वपद पीनहास है; नाम दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है और 'हाथ में' मूल मुहावरा बचता है।
theological_decisions:
- issue: सैनिक अभियान में पीनहास और पवित्र वस्तुओं की भूमिका
  choice: पीनहास याजकीय प्रतिनिधि के रूप में पवित्र पात्रों और संकेत की तुरहियों सहित सेना के साथ जाता है।
  alternative: पीनहास केवल पर्यवेक्षक था, अथवा वस्तुओं का कोई याजकीय महत्व नहीं था।
  rationale: पद स्वयं पीनहास, पवित्र पात्रों और तुरहियों को अभियान से जोड़ता है; अनुवाद इस धार्मिक-सैनिक संबंध को रखता है, पर 'पवित्र युद्ध' जैसी अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: כְּלֵי הַקֹּדֶשׁ की सटीक पहचान
  choice: मुख्य पाठ में 'पवित्र पात्र', साथ में वैकल्पिक अर्थों की पादटिप्पणी।
  alternative: निश्चित रूप से 'पवित्रस्थान के पात्र' या सामान्यतः 'पवित्र वस्तुएँ'।
  rationale: इब्रानी पदबंध वस्तुओं के प्रकार अथवा उनके पवित्रस्थान-संबंध—दोनों की ओर संकेत कर सकता है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली। लंबे इब्रानी वाक्य को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। 'रण-संकेत' सैन्य प्रसंग को व्यक्त करता है, जबकि पादटिप्पणी मूल शब्द की व्यापक संकेत/चेतावनी-संबंधी अर्थ-सीमा बनाए रखती है।
