  text: וַ/יֹּ֥אמֶר אֲלֵי/הֶ֖ם מֹשֶׁ֑ה הַֽ/חִיִּיתֶ֖ם כָּל נְקֵבָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/015.yaml
  text: Moses said to them[a], “Have you kept alive every female?”
translation:
  language: hi
  text: मूसा ने उनसे कहा, “क्या तुमने हर स्त्री को जीवित छोड़ दिया?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: इब्रानी कथात्मक शैली में אמר का सामान्य और स्वाभाविक हिन्दी रूप ‘कहा’ है।
- source_word: אֲלֵיהֶם
  choice: उनसे
  rationale: אֶל के साथ तृतीय पुरुष बहुवचन प्रत्यय वाणी की दिशा उस समूह की ओर दिखाता है; हिन्दी में ‘उनसे कहा’ स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिवाचक नाम का प्रचलित मानक हिन्दी बाइबलीय रूप।
- source_word: הַחִיִּיתֶם
  choice: क्या तुमने ... जीवित छोड़ दिया
  rationale: חיה का हिफ़ईल रूप यहाँ ‘जीवित रहने देना/जीवित छोड़ना’ व्यक्त करता है। प्रश्नसूचक הֲ समाहित रूप में है; ‘क्या’ उसे स्पष्ट और स्वाभाविक हिन्दी में दर्शाता है।
- source_word: כָּל
  choice: हर
  rationale: एकवचन संज्ञा के साथ כָּל का व्यापक, व्यक्ति-व्यक्ति को समेटने वाला अर्थ ‘हर’ से सहज रूप में व्यक्त होता है।
- source_word: נְקֵבָה
  choice: स्त्री
  rationale: नְקֵבָה जैविक लिंग के आधार पर स्त्री-जाति के व्यक्ति को सूचित करता है और आयु को सीमित नहीं करता। आधुनिक हिन्दी में मनुष्यों के लिए ‘स्त्री’ dignified और स्वाभाविक है; ‘महिला’ अपेक्षाकृत वयस्कता का संकेत दे सकती है, जबकि ‘मादा’ मनुष्यों के लिए अमर्यादित सुनाई देती है।
theological_decisions:
- issue: युद्ध के हिंसक संदर्भ में נְקֵבָה का दायरा
  choice: स्त्री
  alternative: महिला; स्त्रियाँ और लड़कियाँ; मादा
  rationale: मूल शब्द आयु के अनुसार दायरा सीमित नहीं करता। ‘स्त्री’ हिन्दी में व्यापक रूप से स्त्री-जाति के व्यक्ति को व्यक्त कर सकता है और स्रोत की कठोर व्यापकता को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘जीवित छोड़ दिया’ सैन्य प्रसंग में causative अर्थ को स्वाभाविक ढंग से व्यक्त करता है। मूल के नְקֵבָה के आयु-अनिर्दिष्ट दायरे को ‘स्त्री’ से रखा गया है; पद में कोई फुटनोट आवश्यक नहीं माना गया।
