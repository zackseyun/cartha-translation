id: NUM.31.23
reference: Numbers 31:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל דָּבָ֞ר אֲשֶׁר יָבֹ֣א בָ/אֵ֗שׁ תַּעֲבִ֤ירוּ בָ/אֵשׁ֙ וְ/טָהֵ֔ר אַ֕ךְ בְּ/מֵ֥י נִדָּ֖ה יִתְחַטָּ֑א וְ/כֹ֨ל אֲשֶׁ֧ר לֹֽא יָבֹ֛א בָּ/אֵ֖שׁ תַּעֲבִ֥ירוּ בַ/מָּֽיִם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/023.yaml
  text: Everything that can go through the fire[a], you shall pass through the fire, and it shall be clean; only it must be purified with the water for impurity. But everything that cannot go through the fire, you shall pass through the water.
translation:
  language: hi
  text: जो भी वस्तु आग में से गुज़र सकती है, उसे आग में से गुज़ारो, और वह शुद्ध हो जाएगी; परन्तु उसे अशुद्धता के जल[a] से शुद्ध किया जाए। पर जो कुछ आग में से नहीं गुज़र सकता, उसे जल में से गुज़ारो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अशुद्धता दूर करने वाले जल से”; परंपरागत रूप से, “पृथक्करण के जल से” (गिनती 19 देखें)।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל דָּבָר
  choice: जो भी वस्तु
  rationale: यहाँ דָּבָר लूट में मिली प्रत्येक ठोस वस्तु को समावेशी रूप से दर्शाता है; ‘जो भी वस्तु’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר יָבֹא בָאֵשׁ
  choice: आग में डाली जा सकती है
  rationale: संदर्भ उन वस्तुओं का है जो आग द्वारा शुद्ध किए जाने योग्य हैं; यह प्रयोग केवल वास्तविक प्रवेश नहीं, बल्कि आग सह सकने की व्यावहारिक योग्यता व्यक्त करता है।
- source_word: תַּעֲבִירוּ בָאֵשׁ
  choice: उसे आग में से निकालो
  rationale: עבר का हिफ़ील रूप किसी वस्तु को आर-पार ले जाने का भाव देता है। ‘आग में से निकालो’ हिन्दी में उस क्रिया को सहज रूप से व्यक्त करता है और अगले जल-वाक्य के साथ समानांतरता रखता है।
- source_word: וְטָהֵר
  choice: और वह शुद्ध हो जाएगी
  rationale: क्रिया आग से गुज़रने के बाद प्राप्त अनुष्ठानिक शुद्ध अवस्था बताती है।
- source_word: אַךְ
  choice: फिर भी
  rationale: यह पहले कथन पर एक आवश्यक योग्यता या अतिरिक्त शर्त लगाता है।
- source_word: בְּמֵי נִדָּה
  choice: अशुद्धता दूर करने वाले जल से
  rationale: यह गिनती 19 में वर्णित अनुष्ठानिक अशुद्धता से शुद्ध करने के विशेष जल को दर्शाता है; हिन्दी में प्रयोजन स्पष्ट करते हुए नैतिक पाप का अर्थ नहीं जोड़ा गया।
- source_word: יִתְחַטָּא
  choice: उसका शुद्धीकरण किया जाए
  rationale: याजकीय संदर्भ में हित्पएल रूप अशुद्धता से अनुष्ठानिक शुद्धीकरण से गुज़रने को दर्शाता है, न कि नैतिक आत्मशुद्धि को।
- source_word: וְכֹל אֲשֶׁר לֹא יָבֹא בָּאֵשׁ
  choice: पर जो कुछ आग में नहीं डाला जा सकता
  rationale: यह आग सह सकने वाली और न सह सकने वाली वस्तुओं के बीच व्यावहारिक विरोध व्यक्त करता है।
- source_word: תַּעֲבִירוּ בַמָּיִם
  choice: उसे जल में से निकालो
  rationale: आग वाले खंड की तरह वही कारक क्रिया दोहराई गई है; समान हिन्दी संरचना मूल की समानांतरता बनाए रखती है।
theological_decisions:
- issue: याजकीय व्यवस्था में शुद्धीकरण की प्रकृति
  choice: भाषा को अनुष्ठानिक शुद्धता और अशुद्धता के अर्थ में रखा गया है।
  alternative: इसे पाप से नैतिक शुद्धि या क्षमा की भाषा में प्रस्तुत करना।
  rationale: गिनती 31 और उससे संबद्ध गिनती 19 में वस्तुओं को अशुद्धता से विधिपूर्वक शुद्ध करने की बात है, नैतिक दोष की क्षमा की नहीं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जल’ अनुष्ठानिक-विधिक संदर्भ के अनुकूल है। आग और जल वाले दोनों खंडों में समानांतर वाक्य-विन्यास सुरक्षित रखा गया है।
