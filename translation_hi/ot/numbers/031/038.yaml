  text: And the cattle were thirty-six thousand, and their tribute for the LORD was seventy-two.
translation:
  language: hi
  text: और गाय-बैल छत्तीस हज़ार थे, और उनमें से याहवे के लिए देय अंश बहत्तर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּקָר
  choice: गाय-बैल
  rationale: בָּקָר गोवंश के पशुओं के सामूहिक समूह को दर्शाता है। आधुनिक हिन्दी में “गाय-बैल” इस गणना-सूची के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: שִׁשָּׁה וּשְׁלֹשִׁים אָלֶף
  choice: छत्तीस हज़ार
  rationale: इब्रानी में संख्या का क्रम शाब्दिक रूप से ‘छः और तीस हज़ार’ है; मानक आधुनिक हिन्दी में इसे ‘छत्तीस हज़ार’ कहना स्वाभाविक है।
- source_word: מִכְסָם
  choice: उनमें से ... कर
  rationale: מֶכֶס यहाँ युद्ध की लूट में से निर्धारित करके निकाले गए देय अंश को दर्शाता है। “उनमें से ... कर” यह स्पष्ट करता है कि बहत्तर पशु कुल संख्या में से लिया गया निर्धारित अंश थे।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ समर्पण अथवा किसी के लिए निर्धारित किए जाने का भाव देता है, और יהוה परमेश्वर का विशिष्ट नाम है; इसलिए “याहवे के लिए” स्रोत को सीधे व्यक्त करता है।
- source_word: שְׁנַיִם וְשִׁבְעִים
  choice: बहत्तर
  rationale: इब्रानी का शाब्दिक क्रम ‘दो और सत्तर’ है; आधुनिक हिन्दी में मानक रूप “बहत्तर” है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, बल्कि चतुरक्षरीय दिव्य नाम יהוה है। “याहवे” नाम को नाम के रूप में बनाए रखता है; “प्रभु” नाम को उपाधि में बदल देता, जबकि “यहोवा” बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गणना-सूची के अनुरूप संक्षिप्त रखी गई है। “गाय-बैल” सामान्य पाठक को सामूहिक गोवंश का अर्थ तुरंत देता है; वाक्य की दोहरी संरचना मूल इब्रानी के दो जुड़े हुए खंडों को बनाए रखती है।
