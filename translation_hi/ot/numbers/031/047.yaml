source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/מַּחֲצִ֣ת בְּנֵֽי יִשְׂרָאֵ֗ל אֶת הָֽ/אָחֻז֙ אֶחָ֣ד מִן הַ/חֲמִשִּׁ֔ים מִן הָ/אָדָ֖ם וּ/מִן הַ/בְּהֵמָ֑ה וַ/יִּתֵּ֨ן אֹתָ֜/ם לַ/לְוִיִּ֗ם שֹֽׁמְרֵי֙ מִשְׁמֶ֨רֶת֙ מִשְׁכַּ֣ן יְהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/047.yaml
  text: From the half belonging to the sons of Israel[a], Moses took one portion out of fifty, from the people and from the livestock, and gave them to the Levites who kept charge of the tabernacle of Yahweh[b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] के लिए निर्धारित आधे भाग में से मूसा ने मनुष्यों और पशुओं में से हर पचास में से एक-एक को[b] लिया और उन्हें उन लेवियों को दे दिया जो यहवे के निवास-तंबू की देखरेख का दायित्व निभाते थे, ठीक जैसा यहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘इस्राएल के पुत्रों’; अर्थात इस्राएलियों।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर पचास में से लिया गया एक।’
    reason: alternative_reading
lexical_decisions:
- source_word: מִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के आधे भाग में से
  rationale: मַחֲצִית लूट के बँटवारे में इस्राएल को मिले आधे भाग को दर्शाता है। ‘इस्राएल के पुत्रों’ से मूल इब्रानी अभिव्यक्ति बनी रहती है।
- source_word: הָאָחֻז אֶחָד מִן הַחֲמִשִּׁים
  choice: पचास में से एक भाग
  rationale: אָחֻז यहाँ निर्धारित अंश अथवा कर के रूप में लिए गए भाग को दर्शाता है; पूरा पद एक-में-पचास की दर बताता है।
- source_word: מִן הָאָדָם וּמִן הַבְּהֵמָה
  choice: मनुष्यों और पशुओं में से
  rationale: אָדָם यहाँ सामूहिक रूप से मानव बंदियों और בְּהֵמָה पालतू पशुओं को सूचित करता है। यह अनुवाद दोनों वर्गों को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: וַיִּתֵּן אֹתָם
  choice: और उसे ... दे दिया
  rationale: यद्यपि इब्रानी सर्वनाम बहुवचन है, उसका संकेत मनुष्यों और पशुओं से लिए गए सामूहिक अंश की ओर है; हिंदी में ‘भाग’ के साथ एकवचन सर्वनाम अधिक स्वाभाविक है।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת מִשְׁכַּן יְהוָה
  choice: जो यहवे के निवास-तंबू की देखरेख का दायित्व निभाते थे
  rationale: सजातीय क्रिया और संज्ञा का मेल सौंपे गए पहरे, देखरेख और सेवा-दायित्व को व्यक्त करता है। ‘देखरेख का दायित्व निभाते थे’ इस अर्थ को सहज आधुनिक हिंदी में देता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक जैसा यहवे ने मूसा को आज्ञा दी थी
  rationale: כַּאֲשֶׁר पहले दी गई आज्ञा के ठीक अनुरूप कार्य किए जाने को दर्शाता है; ‘दी थी’ कथानक में उसकी पूर्वता स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: चुना गया रूप मूल की स्पष्ट ‘पुत्रों’ वाली अभिव्यक्ति को सुरक्षित रखता है; पादटिप्पणी इसका सामूहिक संदर्भ स्पष्ट करती है।
- issue: मानव बंदियों और पशुओं से लिए गए अंश का उल्लेख
  choice: मनुष्यों और पशुओं में से पचास में से एक भाग
  alternative: लोगों और मवेशियों में से हर पचास में एक
  rationale: यह रूप मूल पाठ के दोनों वर्गों और एक-में-पचास की दर को बिना नैतिक या धर्मवैज्ञानिक तनाव दबाए सीधे व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिंदी अपनाई गई है। ‘निवास-तंबू’ से מִשְׁכָּן का निवास और तंबू—दोनों भाव सुरक्षित रहते हैं। वाक्य की लंबी इब्रानी संरचना को बनाए रखते हुए हिंदी में संबंध स्पष्ट किए गए हैं।
