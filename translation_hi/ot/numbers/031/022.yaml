- source_word: הַנְּחֹשֶׁת
  choice: काँसा
  rationale: हिब्रू शब्द ताँबे अथवा ताँबा-आधारित धातु के लिए आ सकता है; इस प्राचीन धातु-सूची में ‘काँसा’ स्वाभाविक है, जबकि ‘ताँबा’ भी संभव है।
- source_word: הַבַּרְזֶל
  choice: लोहा
  rationale: इस धातु का मानक हिन्दी नाम।
- source_word: הַבְּדִיל
  choice: राँगा
  rationale: यहाँ सूचीबद्ध धातु टिन है; ‘राँगा’ उसका स्वाभाविक हिन्दी नाम है।
- source_word: הָעֹפָרֶת
  choice: सीसा
  rationale: इस धातु का मानक हिन्दी नाम।
- source_word: אֵת (प्रत्येक संज्ञा से पहले)
  choice: अलग से अनूदित नहीं
  rationale: यह हिब्रू का प्रत्यक्ष-कर्म चिह्न है; हिन्दी में सूची और विराम-चिह्न इसकी संरचनात्मक भूमिका व्यक्त करते हैं।
