  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל הָ/עָ֣ם לֵ/אמֹ֔ר הֵחָלְצ֧וּ מֵ/אִתְּ/כֶ֛ם אֲנָשִׁ֖ים לַ/צָּבָ֑א וְ/יִהְיוּ֙ עַל מִדְיָ֔ן לָ/תֵ֥ת נִקְמַת יְהוָ֖ה בְּ/מִדְיָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/003.yaml
  text: So Moses spoke to the people, saying, “Arm men from among you for the army, and let them go against Midian to execute Yahweh’s vengeance on Midian.”
translation:
  language: hi
  text: तब मूसा ने लोगों से कहा, “अपने बीच से पुरुषों को युद्ध के लिए हथियारबंद करो, और वे मिद्यान के विरुद्ध जाएँ, ताकि मिद्यान से यहोवा का बदला[a] लें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के लिए बदला।” इब्रानी अभिव्यक्ति का अर्थ यहोवा का अपना बदला अथवा उसकी ओर से लिया गया बदला हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: इब्रानी कथात्मक रूप अगले घटनाक्रम और प्रत्यक्ष वचन का परिचय देता है; आधुनिक हिन्दी में ‘तब ... कहा’ स्वाभाविक है।
- source_word: הֵחָלְצוּ
  choice: हथियारबंद करो
  rationale: सैन्य प्रसंग में क्रिया युद्ध के लिए सुसज्जित करने का भाव देती है; यह चयन उसके मार्शल अर्थ को स्पष्ट रखता है।
- source_word: מֵאִתְּכֶם אֲנָשִׁים
  choice: अपने बीच से पुरुषों को
  rationale: वाक्यांश समुदाय में से पुरुष योद्धाओं के चयन को बताता है; ‘पुरुषों’ मूल के पुल्लिंग बहुवचन को बनाए रखता है।
- source_word: לַצָּבָא
  choice: युद्ध के लिए
  rationale: צָבָא यहाँ सैन्य अभियान अथवा युद्ध-सेवा को सूचित करता है; हिन्दी में ‘युद्ध के लिए’ अधिक स्वाभाविक है।
- source_word: וְיִהְיוּ עַל מִדְיָן
  choice: ताकि वे मिद्यान के विरुद्ध होकर
  rationale: शाब्दिक ‘मिद्यान के विरुद्ध हों’ के निकट रहते हुए शत्रुतापूर्ण सैन्य अभिमुखता व्यक्त की गई है; मूल में स्पष्ट न होने वाली गति या आक्रमण को नहीं जोड़ा गया।
- source_word: לָתֵת נִקְמַת
  choice: बदला लें
  rationale: शाब्दिक रूप से ‘बदला देना/पूरा करना’ है; वर्तमान हिन्दी में ‘बदला लेना’ इस संयोग का स्वाभाविक और गंभीर समतुल्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है, न कि केवल पदवी ‘प्रभु’ से।
- source_word: בְּמִדְיָן
  choice: मिद्यान से
  rationale: यह पूर्वसर्ग मिद्यान को बदले के लक्ष्य के रूप में चिह्नित करता है; ‘बदला लेना’ के साथ हिन्दी में ‘से’ स्वाभाविक है।
theological_decisions:
- issue: पवित्र युद्ध के प्रसंग में נִקְמַת יְהוָה का संबंध
  choice: यहोवा का बदला
  alternative: यहोवा के लिए बदला
  rationale: रचनात्मक संबंध बदले को यहोवा से संबंधित—उसका अथवा उसकी ओर से लिया जाने वाला—बताता है। मुख्य पाठ में संक्षिप्त स्वाभाविक अर्थ रखा गया है और वास्तविक संबंधगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘हथियारबंद’, ‘युद्ध’ और ‘बदला’ मूल की सैन्य तीव्रता और धर्मवैचारिक तनाव को नरम किए बिना सामान्य पाठक के लिए स्पष्ट रखते हैं।
