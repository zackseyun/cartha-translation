source:
  edition: WLC
  text: וַ/יִּמָּֽסְרוּ֙ מֵ/אַלְפֵ֣י יִשְׂרָאֵ֔ל אֶ֖לֶף לַ/מַּטֶּ֑ה שְׁנֵים עָשָׂ֥ר אֶ֖לֶף חֲלוּצֵ֥י צָבָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/005.yaml
  text: 'So from the thousands of Israel[b][a], a thousand from each tribe were assigned: twelve thousand armed for war.'
translation:
  language: hi
  text: इस प्रकार इस्राएल के हज़ारों[b] में से हर गोत्र से एक हज़ार पुरुष नियुक्त किए गए[a]—कुल बारह हज़ार पुरुष, जो युद्ध के लिए हथियारबंद थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सौंपे गए” अथवा “सेवा के लिए जुटाए गए”; इब्रानी क्रिया का अर्थ किसी कार्य के लिए उपलब्ध कराया या नियुक्त किया जाना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल के हज़ारों” केवल संख्या ही नहीं, बल्कि इस्राएल के बड़े कुल-समूहों या सैन्य दलों को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּסְרוּ
  choice: नियुक्त किए गए
  rationale: निफ़अल रूप यहाँ इस्राएलियों में से पुरुषों के अभियान के लिए दिए जाने या उपलब्ध कराए जाने का निष्क्रिय भाव व्यक्त करता है। ‘नियुक्त किए गए’ सैन्य संदर्भ में स्वाभाविक है, जबकि अन्य संभावित अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: מֵאַלְפֵי יִשְׂרָאֵל
  choice: इस्राएल के हज़ारों में से
  rationale: אַלְפֵי का शाब्दिक अर्थ ‘हज़ारों’ है, पर गोत्रीय या सैन्य संदर्भ में यह बड़े कुल-समूहों अथवा सैन्य दलों को भी सूचित कर सकता है। मुख्य पाठ शाब्दिक रूप रखता है और पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: אֶלֶף לַמַּטֶּה
  choice: हर गोत्र के एक हज़ार पुरुष
  rationale: 'संदर्भ में לַמַּטֶּה वितरणात्मक है: प्रत्येक गोत्र से एक हज़ार पुरुष। ‘हर गोत्र के’ इसे सहज हिन्दी में व्यक्त करता है। ‘पुरुष’ संदर्भ से निहित सैनिकों को स्पष्ट करता है।'
- source_word: שְׁנֵים עָשָׂר אֶלֶף
  choice: कुल बारह हज़ार पुरुष
  rationale: यह बारह गोत्रों से आए सैनिकों की कुल संख्या का सीधा सार है; ‘कुल’ वाक्य के सारांशात्मक संबंध को स्पष्ट करता है।
- source_word: חֲלוּצֵי צָבָא
  choice: जो युद्ध के लिए हथियारबंद थे
  rationale: חֲלוּצֵי युद्ध के लिए सुसज्जित या तैयार पुरुषों को दर्शाता है। ‘युद्ध के लिए हथियारबंद’ सैन्य अर्थ को संक्षिप्त और स्वाभाविक ढंग से बनाए रखता है।
