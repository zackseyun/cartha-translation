source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִרְג֥וּ כָל זָכָ֖ר בַּ/טָּ֑ף וְ/כָל אִשָּׁ֗ה יֹדַ֥עַת אִ֛ישׁ לְ/מִשְׁכַּ֥ב זָכָ֖ר הֲרֹֽגוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/017.yaml
  text: So now[a], kill every male among the little ones, and kill every woman who has known a man by lying with him.
translation:
  language: hi
  text: इसलिए अब छोटे बच्चों में से हर लड़के को मार डालो, और हर उस स्त्री को भी मार डालो जिसने किसी पुरुष के साथ शारीरिक संबंध बनाए हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “जिसने पुरुष को पुरुष के शयन के द्वारा जाना है”; यह यौन संबंध के लिए एक इब्रानी मुहावरा है।'
    reason: हिब्रू मुहावरे की शब्दशः बनावट और उसके यौन अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: वाव के प्रसंगगत परिणाम/संक्रमण और עַתָּה की तात्कालिकता—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הִרְגוּ / הֲרֹגוּ
  choice: मार डालो
  rationale: हिब्रू आज्ञार्थक क्रिया की सीधी और कठोर शक्ति बनाए रखता है; केवल ‘मारो’ की तुलना में मृत्यु का आशय स्पष्ट करता है।
- source_word: כָל זָכָר בַּטָּף
  choice: छोटे बच्चों में से हर लड़के को
  rationale: זָכָר का पुरुष-लिंग और טַף का छोटे बच्चों/आश्रित बाल-बच्चों का अर्थ सहज आधुनिक हिन्दी में व्यक्त होता है। ‘हर नर’ अधिक शब्दशः होता, पर मनुष्यों के लिए यहाँ अस्वाभाविक और अनावश्यक रूप से जैविक सुनाई देता।
- source_word: כָל אִשָּׁה
  choice: हर उस स्त्री को
  rationale: אִשָּׁה यहाँ पत्नी विशेष नहीं, बल्कि स्त्री को सामान्य वर्ग के रूप में दर्शाता है।
- source_word: יֹדַעַת אִישׁ לְמִשְׁכַּב זָכָר
  choice: जिसने किसी पुरुष के साथ शारीरिक संबंध बनाए हैं
  rationale: हिब्रू के ‘जानना’ और ‘पुरुष के शयन’ वाले यौन मुहावरे का अर्थ स्पष्ट, संयत और आधुनिक हिन्दी में देता है; शब्दशः रूप पाद-टिप्पणी में सुरक्षित है।
theological_decisions:
- issue: नैतिक रूप से कठिन युद्ध-संबंधी आज्ञा को बिना नरम किए प्रस्तुत करना
  choice: आज्ञा को सीधे ‘मार डालो’ के रूप में अनूदित किया गया है
  alternative: ‘मृत्यु-दंड दो’ जैसे औपचारिक शब्दों से भाषा को नरम करना या मुख्य पाठ में ऐतिहासिक/नैतिक व्याख्या जोड़ना
  rationale: मूल पाठ की कठोरता और प्रत्यक्ष आज्ञार्थक स्वर को बनाए रखना आवश्यक है; अनुवाद में न तो नैतिक टिप्पणी जोड़ी गई है, न उसकी तीव्रता घटाई गई है।
- issue: यौन संबंध के हिब्रू मुहावरे का रूप
  choice: मुख्य पाठ में अर्थ स्पष्ट किया गया और शब्दशः बनावट पाद-टिप्पणी में दी गई
  alternative: ‘जिसने पुरुष को जाना है’ का अस्पष्ट शब्दशः अनुवाद
  rationale: हिन्दी में ‘पुरुष को जानना’ अपने आप यौन अर्थ नहीं बताता। स्पष्ट अर्थ देना संप्रेषणीय है, जबकि पाद-टिप्पणी मूल की विशिष्ट अभिव्यक्ति को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिंसक आज्ञा को जानबूझकर नरम नहीं किया गया। ‘छोटे बच्चों’ और ‘शारीरिक संबंध’ जैसे पद सामान्य पाठक के लिए सहज हैं, जबकि पाद-टिप्पणी मूल मुहावरे की निकटतर शब्दावली देती है।
