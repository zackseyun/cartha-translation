base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/002.yaml
  text: Take vengeance for the sons of Israel on the Midianites[b][a]. Afterward you will be gathered to your people.
translation:
  language: hi
  text: “इस्राएलियों का बदला मिद्यानियों से ले।”[a] उसके बाद तू अपने लोगों में जा मिलेगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद यह भी हो सकता है: “मिद्यानियों से इस्राएलियों का प्रतिशोध ले।” इब्रानी में शब्दशः: “इस्राएल के पुत्रों का बदला मिद्यानियों से ले।”'
    reason: lexical_alternative
  - marker: b
    text: “अपने लोगों में जा मिलना” मृत्यु के लिए प्रयुक्त एक इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: נְקֹם נִקְמַת
  choice: बदला ... ले
  rationale: क्रिया और उसी मूल से बनी संज्ञा का संयुक्त प्रयोग प्रतिशोध की स्पष्ट आज्ञा देता है। स्वाभाविक हिन्दी में ‘बदला ले’ इस बल को संक्षेप और प्रभावी ढंग से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ पूरे जातीय समुदाय के लिए प्रयुक्त है; ‘इस्राएलियों’ आधुनिक हिन्दी में अधिक स्वाभाविक और अर्थतः समावेशी है।
- source_word: מֵאֵת הַמִּדְיָנִים
  choice: मिद्यानियों से
  rationale: נקם के साथ यह पद उस समुदाय को बताता है जिससे बदला लिया जाना है। हिन्दी मुहावरे ‘किसी से बदला लेना’ में ‘से’ स्वाभाविक है।
- source_word: אַחַר
  choice: उसके बाद
  rationale: यह बदला लिए जाने के बाद घटने वाली अगली घटना का समय बताता है।
- source_word: תֵּאָסֵף אֶל עַמֶּיךָ
  choice: तू अपने लोगों में मिला लिया जाएगा
  rationale: मृत्यु के लिए प्रयुक्त इब्रानी रूपक को सीधे ‘तू मर जाएगा’ कहकर समतल नहीं किया गया। कर्मवाच्य और ‘अपने लोगों’ की छवि दोनों सुरक्षित हैं।
theological_decisions:
- issue: मूसा की मृत्यु के लिए प्रयुक्त इब्रानी मुहावरा
  choice: अपने लोगों में मिला लिया जाएगा
  alternative: तू मर जाएगा / अपने पुरखों के पास चला जाएगा
  rationale: मूल पाठ मृत्यु का संकेत देता है, पर केवल ‘पुरखों’ या किसी विशिष्ट परलोक-सिद्धांत को स्पष्ट नहीं करता। इसलिए मूल रूपक और उसकी धार्मिक अस्पष्टता बनाए रखी गई है।
- issue: प्रतिशोध का संबंध
  choice: इस्राएलियों का बदला मिद्यानियों से लेना
  alternative: इस्राएलियों की ओर से मिद्यानियों को दण्ड देना
  rationale: ‘बदला’ נקמה का सीधा अर्थ सुरक्षित रखता है; ‘दण्ड’ न्यायिक व्याख्या जोड़ सकता है, जबकि ‘की ओर से’ संबंध को आवश्यकता से अधिक स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर मूसा को एकवचन में संबोधित करते हैं, इसलिए ‘तू’ मूल के निकट और प्रसंगानुकूल है। मुख्य पाठ में जातीय समुदाय के लिए स्वाभाविक ‘इस्राएलियों’ चुना गया है; अधिक शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
