base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/012.yaml
  text: And they brought the captives[a], the prey, and the spoil to Moses, to Eleazar the priest, and to the congregation of the sons of Israel, to the camp on the plains of Moab[c][b], which are by the Jordan at Jericho.
translation:
  language: hi
  text: वे बंदियों, पकड़ी हुई संपत्ति और लूट के माल को मूसा, याजक एलीआज़ार और इस्राएलियों की मंडली[a] के पास, मोआब के मैदानों[b] में छावनी तक ले आए। ये मैदान यरीहो के पास यरदन के किनारे थे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों की मंडली।’
    reason: lexical_alternative
  - marker: b
    text: अथवा ‘मोआब के मैदानी प्रदेश।’
    reason: lexical_alternative
  - marker: c
    text: अथवा ‘जो यरीहो के सामने यरदन के किनारे थे।’
    reason: geographical_ambiguity
lexical_decisions:
- source_word: וַיָּבִאוּ
  choice: ले आए
  rationale: בוא के हिफ़ईल रूप का यहाँ कर्मवाचक आशय ‘लाना’ है; इसके बाद आए प्रत्यक्ष कर्म भी इसी अर्थ की पुष्टि करते हैं।
- source_word: הַשְּׁבִי
  choice: बंदियों
  rationale: सैनिक प्रसंग में यह शब्द बंदी बनाए गए व्यक्तियों को सूचित करता है, न कि बंदी होने की अमूर्त अवस्था को।
- source_word: הַמַּלְקוֹחַ
  choice: पकड़ी हुई संपत्ति
  rationale: यह युद्ध में अधिकार में ली गई चल संपत्ति या पशुधन आदि के लिए प्रयुक्त हो सकता है। इस अनुवाद से इसे अगले निकटार्थक शब्द שׁלל से अलग रखा गया है, पर इसका अर्थ केवल पशुधन तक सीमित नहीं किया गया।
- source_word: הַשָּׁלָל
  choice: लूट के माल
  rationale: यह युद्ध में प्राप्त लूट के लिए प्रचलित शब्द है। अलग अभिव्यक्ति मूल के दो संबंधित किंतु भिन्न शब्दों का अंतर बनाए रखती है।
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की मंडली
  rationale: עֵדָה एकत्र समुदाय या मंडली को दर्शाता है। स्वाभाविक आधुनिक हिन्दी के लिए בני ישראל को ‘इस्राएलियों’ कहा गया है; शाब्दिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: אֶל הַמַּחֲנֶה
  choice: उस छावनी तक
  rationale: אֶל दिशा या गंतव्य बताता है। ‘तक’ पहुँचने का भाव व्यक्त करता है, बिना यह अनावश्यक रूप से निश्चित किए कि वे छावनी के भीतर कितनी दूर गए।
- source_word: עַרְבֹת מוֹאָב
  choice: मोआब के मैदानों
  rationale: यह प्रचलित और सामान्य पाठक के लिए स्पष्ट भौगोलिक अभिव्यक्ति है; ‘मैदानी प्रदेश’ भी संभव है।
- source_word: אֲשֶׁר עַל יַרְדֵּן יְרֵחוֹ
  choice: जो यरीहो के सामने यरदन के किनारे थी
  rationale: वाक्यांश मोआब के मैदानों की स्थिति यरदन और यरीहो के संबंध में बताता है। ‘सामने’ संभावित भौगोलिक संबंध को स्पष्ट करता है, जबकि वैकल्पिक कम-विशिष्ट पाठ पाद-टिप्पणी में सुरक्षित है।
