base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/026.yaml
  text: Take a count of the plunder that was taken[c][b][a], both of man and of beast—you and Eleazar the priest and the heads of the fathers’ houses of the congregation.
translation:
  language: hi
  text: “तुम, याजक एलीआज़ार और मंडली के पितृकुलों के मुखिया, बंदी बनाकर लाई गई लूट की—मनुष्यों और पशुओं, दोनों की—गिनती करो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बंदी लूट की।” इब्रानी अभिव्यक्ति युद्ध में पकड़ी गई लूट को सूचित करती है; यहाँ इसमें मनुष्य और पशु दोनों शामिल हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂא אֵת רֹאשׁ
  choice: गिनती करो
  rationale: शाब्दिक रूप से ‘सिर उठाओ’ यहाँ गणना करने का मुहावरा है; स्वाभाविक हिन्दी में ‘गिनती करो’ उसी अर्थ को स्पष्ट करता है।
- source_word: מַלְקוֹחַ הַשְּׁבִי
  choice: लूट में पकड़े गए
  rationale: यह युद्ध में अधिकार में आए लोगों और पशुओं को समेटता है। हिन्दी वाक्य में इसे अगले पदों—मनुष्यों और पशुओं—से जोड़ने पर आशय स्पष्ट और स्वाभाविक रहता है।
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: मनुष्यों और पशुओं
  rationale: אָדָם यहाँ पशुओं के विपरीत मानव प्राणियों के लिए सामूहिक अर्थ में है; בְּהֵמָה पशु, विशेषतः घरेलू पशु, को दर्शाता है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़ार याजक
  rationale: नाम का देवनागरी लिप्यंतरण किया गया है और पदवी का प्रचलित बाइबिलीय हिन्दी रूप रखा गया है।
- source_word: רָאשֵׁי אֲבוֹת הָעֵדָה
  choice: मंडली के पितृकुलों के मुखिया
  rationale: यह मंडली की पूर्वज-पिताओं से पहचानी जाने वाली पारिवारिक इकाइयों के अगुओं को दर्शाता है; ‘पितृकुल’ सामाजिक संरचना को संक्षेप और स्पष्टता से सुरक्षित रखता है।
