  text: וְ/כֹל֙ הַ/טַּ֣ף בַּ/נָּשִׁ֔ים אֲשֶׁ֥ר לֹא יָדְע֖וּ מִשְׁכַּ֣ב זָכָ֑ר הַחֲי֖וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/018.yaml
  text: But keep alive for yourselves every young girl among the women who has not known the bed of a man[a].
translation:
  language: hi
  text: परन्तु स्त्रियों में से हर उस बालिका को, जिसने किसी पुरुष के साथ सहवास नहीं किया है[a], अपने लिए जीवित रखो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “जिसने पुरुष का शयन नहीं जाना है”; यह पुरुष के साथ यौन सम्बन्ध की इब्रानी शिष्टोक्ति है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כֹל
  choice: परन्तु ... हर
  rationale: वाव यहाँ पिछले आदेशों के विपरीत अगली श्रेणी को सामने लाता है, इसलिए ‘परन्तु’ प्रसंगगत विरोध को स्पष्ट करता है। एकवचन सामूहिक הַטַּף के साथ כֹל को वितरणात्मक रूप में ‘हर’ कहा गया है।
- source_word: הַטַּף בַּנָּשִׁים
  choice: स्त्रियों में से हर उस बालिका को
  rationale: טַף सामान्यतः छोटे बच्चों को सूचित करता है, पर בַּנָּשִׁים और आगे का लैंगिक अनुभव वाला उपवाक्य यहाँ स्त्रीलिंग संदर्भ को सीमित करते हैं। ‘बालिका’ आयु और लिंग दोनों को स्वाभाविक, संक्षिप्त हिन्दी में व्यक्त करता है; ‘में से’ ב के अंशवाचक भाव को दर्शाता है।
- source_word: אֲשֶׁר לֹא יָדְעוּ מִשְׁכַּב זָכָר
  choice: जिसने किसी पुरुष के साथ सहवास नहीं किया है
  rationale: יָדַע और מִשְׁכַּב זָכָר मिलकर पुरुष के साथ यौन सम्बन्ध का शिष्टोक्तिपूर्ण संकेत देते हैं। शब्दशः हिन्दी (‘पुरुष का शयन नहीं जाना’) अस्वाभाविक और अस्पष्ट होगी; ‘सहवास’ स्रोत के शिष्ट, गरिमापूर्ण स्वर को बनाए रखते हुए अर्थ स्पष्ट करता है। זָכָר के अनिश्चित संदर्भ को ‘किसी पुरुष’ व्यक्त करता है।
- source_word: הַחֲיוּ לָכֶם
  choice: अपने लिए जीवित रखो
  rationale: חיה का हिफ़ील बहुवचन आदेश किसी को जीवित रहने देने या जीवित रखने का भाव देता है। ‘जीवित रखो’ सीधा आदेश सुरक्षित रखता है और ‘अपने लिए’ לָכֶם को बिना उसके उद्देश्य के बारे में पाठ से आगे अनुमान लगाए व्यक्त करता है।
theological_decisions:
- issue: यौन शिष्टोक्ति को हिन्दी में कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘सहवास नहीं किया है’
  alternative: ‘पुरुष का शयन नहीं जाना’ अथवा ‘पुरुष के साथ नहीं सोई है’
  rationale: मूल इब्रानी अमूर्त पद ‘कुँवारी’ का उपयोग नहीं करता, बल्कि जानने और पुरुष के शयन की शिष्टोक्ति करता है। ‘सहवास’ उसी अर्थ को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है और ‘कुँवारी’ जैसा अधिक तकनीकी या सांस्कृतिक रूप से भारित पद नहीं जोड़ता। पादटिप्पणी मूल अभिव्यक्ति के अधिक शब्दशः रूप को सुरक्षित रखती है।
- issue: טַף के स्त्रीलिंग संदर्भ को स्पष्ट करना
  choice: ‘बालिका’
  alternative: ‘बच्चा’ या ‘छोटा जन’
  rationale: टַף अपने आप में लिंग-निरपेक्ष सामूहिक संज्ञा हो सकता है, किन्तु इस पद के तात्कालिक विशेषण इसे स्त्रीलिंग बच्चों तक सीमित करते हैं। इसलिए ‘बालिका’ संदर्भगत आशय को स्पष्ट करता है, जबकि कोई अतिरिक्त सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘सहवास’ स्पष्ट किन्तु अशिष्ट नहीं है। आदेश की कठोरता को नरम नहीं किया गया, और ‘अपने लिए’ को बनाए रखकर मूल के नैतिक तथा कथात्मक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
