  text: And they burned with fire all their cities in their dwelling places[b][a], and all their encampments.
translation:
  language: hi
  text: और उन्होंने उनके निवास-स्थानों के सभी नगरों[a] और उनके सभी डेरों[b] को आग से जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी बस्तियों के सभी नगरों”; हिब्रू पदबंध का अर्थ “जहाँ वे बसे थे, वहाँ के सभी नगरों” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पड़ावों” अथवा “बस्तियों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עָרֵיהֶם
  choice: उनके ... नगरों
  rationale: עִיר नगर या शहर को सूचित करता है। इस सैन्य और भौगोलिक प्रसंग में ‘नगर’ स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: בְּמוֹשְׁבֹתָם
  choice: उनके निवास-स्थानों के
  rationale: מוֹשָׁב का अर्थ निवास-स्थान, बसावट या बस्ती हो सकता है। संबंधकारक रचना ‘निवास-स्थानों के सभी नगरों’ हिब्रू के स्थानवाचक संबंध को बनाए रखती है, यद्यपि हिंदी में ‘जहाँ वे बसे थे’ भी संभव है।
- source_word: טִירֹתָם
  choice: उनके ... डेरों
  rationale: טִירָה यहाँ घिरे हुए पड़ाव, डेरा या कम शहरी बसावट को सूचित कर सकता है। ‘डेरे’ इसे ‘नगरों’ से अलग निवास-रूप के रूप में रखता है और अनावश्यक रूप से सैन्य ‘छावनी’ नहीं बनाता।
- source_word: שָׂרְפוּ בָּאֵשׁ
  choice: आग से जला दिया
  rationale: שׂרף का अर्थ जलाना है और בָּאֵשׁ साधन को व्यक्त करता है। ‘आग से जला दिया’ हिब्रू के बल को रखते हुए स्पष्ट हिंदी देता है।
- source_word: וְאֵת ... וְאֵת
  choice: सभी ... और ... सभी
  rationale: दोहराया गया कर्मचिह्न और כָּל दो संपूर्ण समूहों को समानांतर रखता है; हिंदी में ‘सभी ... और ... सभी’ इस व्यापकता को बनाए रखता है।
