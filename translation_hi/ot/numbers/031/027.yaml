id: NUM.31.27
reference: Numbers 31:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/חָצִ֨יתָ֙ אֶת הַ/מַּלְק֔וֹחַ בֵּ֚ין תֹּפְשֵׂ֣י הַ/מִּלְחָמָ֔ה הַ/יֹּצְאִ֖ים לַ/צָּבָ֑א וּ/בֵ֖ין כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/027.yaml
  text: And divide the plunder between those who took part in the war[a], who went out to battle[b], and all the congregation.
translation:
  language: hi
  text: और लूट[a] को युद्ध में भाग लेनेवालों—जो युद्ध के लिए निकले थे—और सारी मण्डली[b] के बीच आधा-आधा बाँट देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात युद्ध में पकड़े गए लोग और लिया गया माल; इसे ‘युद्ध की लूट’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सारा समुदाय’ अथवा ‘पूरी सभा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָצִיתָ
  choice: और ... आधा-आधा बाँट देना
  rationale: חצה का मूल भाव दो भाग करना है। इस आदेशात्मक प्रसंग में ‘आधा-आधा बाँट देना’ दो पक्षों के बीच विभाजन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּלְקוֹחַ
  choice: लूट
  rationale: यह युद्ध में लिए गए लोगों और माल, दोनों को समेटने वाला व्यापक शब्द है। ‘लूट’ आधुनिक हिन्दी में संक्षिप्त और सहज है; इसकी व्यापकता पादटिप्पणी में स्पष्ट की गई है।
- source_word: בֵּין ... וּבֵין
  choice: के बीच ... और ... के बीच
  rationale: इब्रानी रचना दो निश्चित पक्षों के बीच बँटवारे को दर्शाती है। हिन्दी में संयुक्त संरचना ‘X और Y के बीच’ इसी संबंध को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: תֹּפְשֵׂי הַמִּלְחָמָה
  choice: युद्ध में भाग लेनेवालों
  rationale: शाब्दिक अर्थ ‘युद्ध को थामने/संभालने वाले’ है, जो योद्धाओं के लिए मुहावरा है। चुना गया रूप न तो अस्वाभाविक रूप से शाब्दिक है, न उससे अधिक संकीर्ण।
- source_word: הַיֹּצְאִים לַצָּבָא
  choice: जो युद्ध के लिए निकले थे
  rationale: यह सहभागी वाक्यांश सैन्य अभियान पर निकलनेवालों की पहचान करता है। ‘युद्ध के लिए निकले थे’ प्रसंगानुकूल और सामान्य हिन्दी है।
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה इस्राएल के समूचे संगठित समुदाय को सूचित करता है। ‘मण्डली’ बाइबलीय गरिमा बनाए रखते हुए हिन्दी पाठकों के लिए परिचित है।
