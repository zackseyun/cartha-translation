  text: Then Moses[a], Eleazar the priest, and all the leaders of the congregation went out to meet them outside the camp.
translation:
  language: hi
  text: तब मूसा, एलीआज़र याजक और समुदाय के सभी प्रधान[a] उनसे मिलने छावनी के बाहर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘समुदाय के सभी मुखिया’ अथवा ‘सभा के सभी सरदार’।
    reason: נְשִׂיאֵי הָעֵדָה के लिए उपलब्ध शाब्दिक विकल्पों को दर्शाने हेतु।
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: बाहर गए
  rationale: क्रिया יצא बाहर की ओर जाने को व्यक्त करती है; प्रसंग में ‘बाहर गए’ स्वाभाविक और दिशात्मक अर्थ के अनुरूप है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़र याजक
  rationale: यह पदबंध एलीआज़र के पद की पहचान कराता है; हिन्दी में बिना अतिरिक्त विराम-चिह्न के यह रूप सहज है।
- source_word: כָל נְשִׂיאֵי הָעֵדָה
  choice: समुदाय के सभी प्रधान
  rationale: נְשִׂיאִים यहाँ राजाओं को नहीं, समुदाय के मान्य नेतृत्वकर्ताओं को दर्शाता है; ‘प्रधान’ इस औपचारिक भूमिका को व्यक्त करता है और ‘समुदाय’ הָעֵדָה के सामूहिक अर्थ को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: לִקְרָאתָם
  choice: उनसे मिलने
  rationale: ל उपसर्ग सहित क्रियार्थक रूप और बहुवचन प्रत्यय बाहर जाने का उद्देश्य—‘उनसे मिलने’—व्यक्त करते हैं।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी की सीमा से बाहर के स्थान की ओर जाने को बताता है; हिन्दी में यही संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
