base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/014.yaml
  text: And Moses was angry with the officers of the army[a], the commanders of thousands and the commanders of hundreds, who were coming from the service of the war.
translation:
  language: hi
  text: और मूसा सेना के अधिकारियों[a]—हज़ारों के सेनापतियों और सैकड़ों के सेनापतियों—पर क्रोधित हुआ, जो युद्ध-सेवा से आ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सैन्य बल के नियुक्त अधिकारी।’ इब्रानी पद यहाँ सैन्य बल में नियुक्त या पदस्थ अधिकारियों का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצֹף
  choice: क्रोधित हुआ
  rationale: קצף तीव्र क्रोध को व्यक्त करता है; ‘क्रोधित हुआ’ आधुनिक, गरिमापूर्ण और अर्थ की तीव्रता के अनुरूप है।
- source_word: פְּקוּדֵי הֶחָיִל
  choice: सेना के अधिकारियों
  rationale: פקד से बना यह पद यहाँ सैन्य बल में नियुक्त अधिकार रखनेवालों को दर्शाता है; ‘सेना के अधिकारी’ प्रशासनिक और सैन्य दोनों भाव स्पष्ट करता है।
- source_word: שָׂרֵי הָאֲלָפִים
  choice: हज़ारों के सेनापतियों
  rationale: सैन्य प्रसंग में שׂרים के लिए ‘सेनापति’ स्वाभाविक है; ‘हज़ारों के’ इब्रानी सैन्य संगठन को सुरक्षित रखता है।
- source_word: וְשָׂרֵי הַמֵּאוֹת
  choice: और सैकड़ों के सेनापतियों
  rationale: पूर्ववर्ती समानांतर पद के अनुरूप ‘सेनापति’ रखा गया है और इब्रानी की इकाई-संरचना सुरक्षित है।
- source_word: הַבָּאִים
  choice: जो ... आ रहे थे
  rationale: वर्तमान कृदंत जारी अथवा वर्णनात्मक क्रिया दर्शाता है; ‘आ रहे थे’ इसे बिना ‘लौटने’ का अर्थ जोड़े व्यक्त करता है।
- source_word: מִצְּבָא הַמִּלְחָמָה
  choice: युद्ध-सेवा से
  rationale: צָבָא में सैन्य दल और सैन्य सेवा दोनों का भाव हो सकता है; इस संयुक्त पद में ‘युद्ध-सेवा’ संक्षिप्त और स्रोत के निकट है, जबकि वैकल्पिक सैन्य-दल संबंधी अर्थ पादटिप्पणी में रखा गया है।
