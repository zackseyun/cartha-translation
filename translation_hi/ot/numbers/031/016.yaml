id: NUM.31.16
reference: Numbers 31:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֵ֣ן הֵ֜נָּה הָי֨וּ לִ/בְנֵ֤י יִשְׂרָאֵל֙ בִּ/דְבַ֣ר בִּלְעָ֔ם לִ/מְסָר מַ֥עַל בַּ/יהוָ֖ה עַל דְּבַר פְּע֑וֹר וַ/תְּהִ֥י הַ/מַּגֵּפָ֖ה בַּ/עֲדַ֥ת יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/016.yaml
  text: Look[a], these women were the ones who, at Balaam’s word, caused the sons of Israel to act unfaithfully against Yahweh in the matter of Peor[b], and so the plague came upon the congregation of Yahweh.
translation:
  language: hi
  text: देखो, इन्हीं स्त्रियों ने बिलाम की बात मानकर इस्राएल के पुत्रों को पोर के मामले में यहवे के प्रति विश्वासघात करने के लिए उकसाया था; इसी कारण यहवे की मंडली पर महामारी आई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֵן הֵנָּה
  choice: देखो, इन्हीं स्त्रियों ने
  rationale: दोहरा, बलसूचक स्त्रीलिंग बहुवचन प्रयोग संदर्भ में मिद्यानी स्त्रियों की ओर संकेत करता है। ‘देखो’ उसका ध्यानाकर्षक बल और ‘इन्हीं स्त्रियों’ उसकी विशिष्टता व्यक्त करता है।
- source_word: בִּדְבַר בִּלְעָם
  choice: बिलाम की बात मानकर
  rationale: शाब्दिक अर्थ ‘बिलाम की बात/वचन के द्वारा’ है। यहाँ उसकी सलाह या प्रेरणा के अनुसार कार्य करने का भाव है; हिन्दी में ‘बात मानकर’ स्वाभाविक रहते हुए इस अर्थ को व्यक्त करता है।
- source_word: לִמְסָר מַעַל
  choice: विश्वासघात करने के लिए उकसाया
  rationale: מעל निष्ठा भंग करने, विशेषतः वाचा-संबंधी विश्वासघात का बोध देता है; מסר के इस कठिन प्रयोग में स्त्रियों की प्रेरक भूमिका है। ‘उकसाया’ उस कारकता को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल पद का औपचारिक रूप सुरक्षित रखा गया है, यद्यपि प्रसंग में यह इस्राएल की प्रजा के पुरुषों को इंगित करता है।
- source_word: עַל דְּבַר פְּעוֹר
  choice: पोर के मामले में
  rationale: यह पद पोर से संबंधित घटना या प्रकरण को दर्शाता है; ‘मामले में’ मूल की व्यापकता बनाए रखता है।
- source_word: וַתְּהִי הַמַּגֵּפָה בַּעֲדַת יְהוָה
  choice: इसी कारण यहवे की मंडली पर महामारी आई
  rationale: क्रमवाचक वाव यहाँ पूर्ववर्ती कृत्य के परिणाम को संदर्भतः जोड़ता है। ‘मंडली पर महामारी आई’ हिन्दी में स्वाभाविक और मूल के अनुरूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम स्पष्ट रूप से आया है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में परिवर्तित नहीं करता।
- issue: מעל का वाचा-संबंधी आशय
  choice: यहवे के प्रति विश्वासघात
  alternative: यहवे के विरुद्ध अपराध / यहवे से अविश्वासयोग्यता
  rationale: ‘विश्वासघात’ निष्ठा भंग के नैतिक और संबंधपरक तनाव को बनाए रखता है; ‘के प्रति’ लक्ष्य-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: स्त्रियों की कारक भूमिका
  choice: उकसाया
  alternative: कारण बनीं / फुसलाया
  rationale: मूल निर्माण असामान्य है, पर संदर्भ स्त्रियों को इस्राएलियों के विश्वासघात की प्रेरक अथवा माध्यमिक कारक बताता है। ‘उकसाया’ प्रत्यक्ष कारकता व्यक्त करता है, जबकि अंतिम नैतिक कर्तृत्व इस्राएलियों का ही रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज पर गरिमापूर्ण रखी गई है। वाक्य में बलसूचक ‘इन्हीं’, वाचा-संबंधी ‘विश्वासघात’, और सामुदायिक ‘मंडली’ मूल के प्रमुख अर्थ-सूत्र सुरक्षित रखते हैं।
