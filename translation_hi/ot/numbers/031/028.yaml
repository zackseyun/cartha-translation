base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/028.yaml
  text: 'And you shall levy a tribute for Yahweh from the men of war who went out to battle: one out of five hundred[b][a], from the people and from the cattle and from the donkeys and from the flock.'
translation:
  language: hi
  text: 'और तुम युद्ध के लिए निकले योद्धाओं से याहवे के लिए कर के रूप में एक अंश अलग करो: मनुष्यों, गाय-बैलों, गधों और भेड़-बकरियों में से हर पाँच सौ में से एक प्राणी[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर पाँच सौ में से एक जीव।” यहाँ इब्रानी शब्द नेफ़ेश मनुष्य या पशु—किसी भी एक जीवित प्राणी—की गिनती के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַהֲרֵמֹתָ
  choice: अलग करना
  rationale: रום के हिफ़ील रूप का अर्थ यहाँ लूट में से निर्धारित अंश निकालकर समर्पित करना है। आज्ञाओं की इस शृंखला में हिंदी का ‘अलग करना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: מֶכֶס
  choice: कर के रूप में एक हिस्सा
  rationale: यह संज्ञा लूट में से देय या निर्धारित अंश को दर्शाती है। केवल ‘कर’ प्रशासनिक लग सकता है, इसलिए ‘कर के रूप में एक हिस्सा’ देय अंश और वस्तुगत भाग—दोनों को स्पष्ट करता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; ‘के लिए’ बताता है कि यह हिस्सा याहवे के लिए निर्धारित है।
- source_word: מֵאֵת אַנְשֵׁי הַמִּלְחָמָה הַיֹּצְאִים לַצָּבָא
  choice: युद्ध में गए योद्धाओं से
  rationale: यह उन युद्ध करनेवाले पुरुषों को निर्दिष्ट करता है जिन्होंने सैन्य अभियान में भाग लिया था। ‘योद्धाओं’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: אֶחָד נֶפֶשׁ מֵחֲמֵשׁ הַמֵּאוֹת
  choice: हर पाँच सौ में एक प्राणी
  rationale: נפש यहाँ मनुष्यों और पशुओं, दोनों की गिनती में एक जीवित इकाई को दर्शाता है। ‘प्राणी’ इस व्यापकता को बनाए रखता है और ‘आत्मा’ से उत्पन्न होनेवाली अनावश्यक तत्त्वमीमांसात्मक धारणा से बचता है।
- source_word: מִן הָאָדָם
  choice: मनुष्यों
  rationale: आदम यहाँ पशुओं के विपरीत लूट के मानवीय वर्ग के लिए सामूहिक रूप से प्रयुक्त है।
- source_word: וּמִן הַבָּקָר
  choice: गाय-बैलों
  rationale: בקר बड़े पालतू मवेशियों का सामूहिक पद है; ‘गाय-बैल’ हिंदी पाठक के लिए ठोस और सहज है।
- source_word: וּמִן הַחֲמֹרִים
  choice: गधों
  rationale: यह חמור का सीधा आधुनिक हिंदी बहुवचन है।
- source_word: וּמִן הַצֹּאן
  choice: भेड़-बकरियों
  rationale: צאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक पद है; हिंदी में दोनों को स्पष्ट करना ‘झुंड’ से अधिक सटीक है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम יהוה सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: נפש को मनुष्य और पशु दोनों के लिए गिनती के पद के रूप में समझना
  choice: प्राणी
  alternative: जीव; एक अदद; आत्मा
  rationale: यहाँ נפש किसी मनुष्य के अमूर्त आत्मिक अंग को नहीं, बल्कि प्रत्येक वर्ग में एक जीवित इकाई को दर्शाता है। ‘प्राणी’ मनुष्य और पशु दोनों पर लागू हो सकता है और मूल की व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कर के रूप में एक हिस्सा’ कानूनी देयता और अलग किए गए वास्तविक अंश दोनों को व्यक्त करता है; सूची में ठोस हिंदी पशु-नामों का प्रयोग किया गया है।
