source:
  edition: WLC
  text: וּ/מִ/מַּחֲצִ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל תִּקַּ֣ח אֶחָ֣ד אָחֻ֣ז מִן הַ/חֲמִשִּׁ֗ים מִן הָ/אָדָ֧ם מִן הַ/בָּקָ֛ר מִן הַ/חֲמֹרִ֥ים וּ/מִן הַ/צֹּ֖אן מִ/כָּל הַ/בְּהֵמָ֑ה וְ/נָתַתָּ֤ה אֹתָ/ם֙ לַ/לְוִיִּ֔ם שֹׁמְרֵ֕י מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן יְהוָֽה־׀׀־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/030.yaml
  text: And from the half belonging to the sons of Israel you shall take one taken from every fifty[a], from the man, from the cattle, from the donkeys, and from the flock, from every kind of livestock[b]; and you shall give them to the Levites who keep charge of the tabernacle of Yahweh.
translation:
  language: hi
  text: और इस्राएलियों के आधे हिस्से में से तुम मनुष्यों, गाय-बैलों, गधों और भेड़-बकरियों, अर्थात हर प्रकार के पशुधन, में से हर पचास में से एक लेना; और उन्हें उन लेवियों को देना, जो याहवे के निवासस्थान की रखवाली का दायित्व निभाते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִמַּחֲצִת בְּנֵי יִשְׂרָאֵל
  choice: और इस्राएलियों के आधे भाग में से
  rationale: मַחֲצִית के ‘आधा भाग’ के अर्थ को स्पष्ट रखा गया है। בְּנֵי יִשְׂרָאֵל का स्वाभाविक आधुनिक हिन्दी रूप ‘इस्राएली’ है; इससे पूरे समुदाय का आशय साफ़ रहता है।
- source_word: תִּקַּח
  choice: तुम ... लेना
  rationale: यह मूसा को दिया गया प्रत्यक्ष निर्देश है। हिन्दी में ‘तुम ... लेना’ आदेशात्मक भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: אֶחָד אָחֻז מִן הַחֲמִשִּׁים
  choice: प्रत्येक पचास पर एक
  rationale: यह 1:50 की लेवी-दर बताता है। אָחֻז में लिए हुए अंश का भाव है, पर हिन्दी में अनुपात को इस प्रकार कहना अधिक स्पष्ट है और आशय को बदले बिना मूल निर्देश पहुँचाता है।
- source_word: מִן הָאָדָם
  choice: मनुष्यों ... में से
  rationale: אָדָם यहाँ युद्ध में प्राप्त मानव-बंदियों की सामूहिक श्रेणी को सूचित करता है। बहुवचन हिन्दी में सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַבָּקָר
  choice: गाय-बैलों
  rationale: בָּקָר का अर्थ बड़े पालतू मवेशी है; ‘गाय-बैल’ सामान्य हिन्दी में इस श्रेणी को स्पष्ट करता है।
- source_word: מִן הַחֲמֹרִים
  choice: गधों
  rationale: यह חֲמוֹר का सीधा और वर्तमान हिन्दी रूप है।
- source_word: וּמִן הַצֹּאן
  choice: और भेड़-बकरियों
  rationale: צֹאן एक सामूहिक संज्ञा है जिसमें सामान्यतः भेड़ और बकरियाँ दोनों आती हैं; स्पष्ट हिन्दी रूप उसी अर्थ-क्षेत्र को व्यक्त करता है।
- source_word: מִכָּל הַבְּהֵמָה
  choice: हर प्रकार के पशुधन
  rationale: בְּהֵמָה यहाँ सूचीबद्ध पालतू पशुओं की व्यापक श्रेणी को समेटता है। ‘पशुधन’ प्रसंगानुकूल है और केवल जंगली अथवा सभी जीवों का भ्रामक संकेत नहीं देता।
- source_word: וְנָתַתָּה אֹתָם לַלְוִיִּם
  choice: और उन्हें उन लेवियों को देना
  rationale: क्रमिक निर्देश को सरल और निकट रूप में रखा गया है; बहुवचन सर्वनाम मनुष्यों और पशुओं में से लिए गए अंशों की ओर संकेत करता है।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: देखरेख का दायित्व निभाते हैं
  rationale: यह सजातीय धातु-निर्माण किसी सौंपे हुए पहरे, संरक्षण या जिम्मेदारी को निभाने का भाव देता है। चुना हुआ वाक्यांश उस दायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁכַּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास’ है और यहाँ वह उपासना के तंबू को सूचित करता है। ‘पवित्र निवास’ पाठकों के लिए स्पष्ट रहते हुए ईश्वर के निवासस्थान का भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: मूल में चतुरक्षरीय निजी नाम सीधे आया है। ‘याहवे’ उसके व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण का निकट देवनागरी रूप है; उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: שֹׁמְרֵי מִשְׁמֶרֶת का सेवकीय अर्थ
  choice: देखरेख का दायित्व निभाते हैं
  alternative: पहरा देते हैं
  rationale: यह पद केवल भौतिक पहरे तक सीमित नहीं, बल्कि पवित्र निवास से जुड़ी सौंपी गई जिम्मेदारी को भी दर्शा सकता है। चुना हुआ रूप इस अर्थ-विस्तार को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, निर्देशात्मक और गरिमापूर्ण रखी गई है। कानूनी अनुपात को सहज ढंग से व्यक्त किया गया है, जबकि सूची और पवित्र निवास से संबंधित दायित्व की संरचना मूल के निकट रखी गई है।
