  yaml_path: translation/ot/numbers/031/042.yaml
  text: And from the half belonging to the sons of Israel[a], which Moses had separated from the men who served in the army—
translation:
  language: hi
  text: और इस्राएलियों के उस आधे भाग में से, जिसे मूसा ने युद्ध के लिए निकले पुरुषों[a] से अलग किया था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैन्य अभियान पर गए पुरुषों”; या “सैन्य सेवा करने वाले पुरुषों।”
    reason: इब्रानी कृदंत הַצֹּבְאִים उन पुरुषों का संकेत कर सकता है जो युद्ध के लिए निकले, अभियान पर थे, या सैन्य सेवा में लगे थे।
lexical_decisions:
- source_word: וּ/מִֽ/מַּחֲצִית
  choice: और … के आधे भाग में से
  rationale: संयोजक וּ और संबंधसूचक מִן दोनों को व्यक्त किया गया है। मַחֲצִית यहाँ लूट के बाँटे हुए आधे हिस्से को दर्शाता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह प्रचलित जातिनाम आधुनिक हिन्दी में स्वाभाविक रूप से समस्त इस्राएली समुदाय को दर्शाता है; शाब्दिक ‘इस्राएल के पुत्रों’ की अपेक्षा संदर्भ में अधिक स्पष्ट है।
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: संबंधवाचक सर्वनाम का पूर्वपद ‘आधा भाग’ है और वही अलग की गई वस्तु है।
- source_word: חָצָה
  choice: अलग किया था
  rationale: लूट को दो हिस्सों में बाँटने के संदर्भ में क्रिया एक आधे भाग को दूसरे से अलग करने का अर्थ देती है। पूर्ण भूतकाल पूर्ववर्ती क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: מִן הָ/אֲנָשִׁים
  choice: पुरुषों के भाग से
  rationale: אֲנָשִׁים का पुरुषवाचक अर्थ सुरक्षित रखा गया है। हिन्दी में ‘के भाग से’ जोड़ने से स्पष्ट होता है कि इस्राएलियों का आधा हिस्सा सैनिक पुरुषों को मिले हिस्से से अलग किया गया था।
- source_word: הַ/צֹּבְאִים
  choice: युद्ध में गए
  rationale: צבא का कृदंत यहाँ सैन्य अभियान में भाग लेने वाले पुरुषों को दर्शाता है। यह रूप संदर्भानुकूल, स्वाभाविक और सैन्य अर्थ को सुरक्षित रखने वाला है।
