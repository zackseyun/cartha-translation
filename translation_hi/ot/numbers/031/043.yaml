  text: And the half belonging to the congregation, from the flock, was 337,500.
translation:
  language: hi
  text: और भेड़-बकरियों में से समुदाय का आधा हिस्सा 3,37,500 था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּהִי
  choice: की संख्या … थी
  rationale: यहाँ क्रिया संख्यात्मक ब्योरे का कुल परिणाम बताती है। हिन्दी में केवल ‘था’ कहने की अपेक्षा ‘की संख्या … थी’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: מֶחֱצַת הָעֵדָה
  choice: समुदाय के आधे हिस्से
  rationale: निर्मित रूप ‘समुदाय का आधा हिस्सा’ दर्शाता है, अर्थात पहले किए गए विभाजन में समुदाय को मिला आधा भाग। ‘समुदाय’ आधुनिक हिन्दी में इस्राएली सामूहिक निकाय का स्वाभाविक और गैर-सांप्रदायिक वर्णन है।
- source_word: מִן הַצֹּאן
  choice: भेड़-बकरियों में से
  rationale: צֹאן छोटे पालतू पशुओं का सामूहिक पद है, जिसमें सामान्यतः भेड़ और बकरियाँ दोनों आती हैं। स्पष्ट हिन्दी के लिए इसे ‘भेड़-बकरियाँ’ कहा गया है और מִן को ‘में से’ द्वारा व्यक्त किया गया है।
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף וּשְׁלֹשִׁים אֶלֶף שִׁבְעַת אֲלָפִים וַחֲמֵשׁ מֵאוֹת
  choice: 3,37,500
  rationale: इब्रानी संख्या 3,00,000 + 30,000 + 7,000 + 500 है। भारतीय अंक-विभाजन के अनुसार 3,37,500 आधुनिक हिन्दी पाठकों के लिए सहज और ठीक है।
