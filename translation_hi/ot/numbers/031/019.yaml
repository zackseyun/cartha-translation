  text: וְ/אַתֶּ֗ם חֲנ֛וּ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה שִׁבְעַ֣ת יָמִ֑ים כֹּל֩ הֹרֵ֨ג נֶ֜פֶשׁ וְ/כֹ֣ל נֹגֵ֣עַ בֶּֽ/חָלָ֗ל תִּֽתְחַטְּא֞וּ בַּ/יּ֤וֹם הַ/שְּׁלִישִׁי֙ וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֔י אַתֶּ֖ם וּ/שְׁבִי/כֶֽם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/019.yaml
  text: And you[a], camp outside the camp for seven days. Everyone who has killed a person, and everyone who has touched one slain, shall purify yourselves on the third day and on the seventh day—you and your captives.
translation:
  language: hi
  text: “तुम छावनी के बाहर सात दिन तक डेरा डालकर रहो। तुममें से जिस किसी ने किसी व्यक्ति को मारा है या किसी मारे गए व्यक्ति को छुआ है[a], वह तीसरे दिन और सातवें दिन शुद्धि करे—तुम और तुम्हारे बंदी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी मारे गए व्यक्ति के शव को छुआ है।” इब्रानी में शब्दशः “किसी मारे गए व्यक्ति” है; इस प्रसंग में शव का स्पर्श और उससे उत्पन्न अनुष्ठानिक अशुद्धता अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲנוּ
  choice: डेरा डालकर रहो
  rationale: बहुवचन आज्ञार्थक क्रिया यहाँ केवल डेरा लगाने ही नहीं, सात दिन तक वहीं ठहरे रहने का निर्देश देती है; यह हिंदी प्रयोग दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: युद्ध और जंगल-यात्रा के प्रसंग में ‘छावनी’ स्थानसूचक अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹּל הֹרֵג נֶפֶשׁ
  choice: तुममें से जिसने किसी व्यक्ति को मारा हो
  rationale: נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं, मनुष्य को दर्शाता है। युद्ध के बाद का प्रसंग participle को पूर्व में किए गए कार्य का भाव देता है।
- source_word: וְכֹל נֹגֵעַ בֶּחָלָל
  choice: या किसी मारे गए व्यक्ति को छुआ हो
  rationale: חָלָל हिंसा से मारे गए व्यक्ति को दर्शाता है और इस शुद्धि-विधान में उसके शव से संपर्क निहित है। मुख्य पाठ व्यक्तिगत संदर्भ बनाए रखता है, जबकि पादटिप्पणी शव-संपर्क का अर्थ स्पष्ट करती है।
- source_word: תִּתְחַטְּאוּ
  choice: अपने आपको शुद्ध करे
  rationale: हित्पाएल रूप इस प्रसंग में अशुद्धता से विधिवत शुद्ध होने को बताता है, न कि सामान्य नैतिक सुधार या पाप-क्षमा को। हिंदी में एकवचन ‘जिसने’ के साथ ‘करे’ स्वाभाविक है; अगला वाक्य आदेश को बंदियों तक स्पष्ट रूप से बढ़ाता है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי וּבַיּוֹם הַשְּׁבִיעִי
  choice: तीसरे दिन और सातवें दिन
  rationale: विधि में निर्धारित दोनों समय-सूचकों को औपचारिक और स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: אַתֶּם וּשְׁבִיכֶם
  choice: तुम और तुम्हारे बंदी
  rationale: שְׁבִי युद्ध में पकड़े गए लोगों को दर्शाता है; ‘बंदी’ आधुनिक हिंदी में संक्षिप्त और प्रसंगानुकूल है।
theological_decisions:
- issue: हत्या या शव-संपर्क के बाद शुद्धि का स्वरूप
  choice: शव-संपर्क से उत्पन्न विधिगत अशुद्धता से शुद्धि
  alternative: रक्तपात के अपराध से नैतिक शुद्धि
  rationale: तीसरे और सातवें दिन का स्पष्ट उल्लेख और प्रसंगगत क्रिया תתחטאו शव-संपर्क संबंधी विधिगत शुद्धि की ओर संकेत करते हैं। इसलिए अनुवाद ‘शुद्ध करे’ कहता है, पर पाप-क्षमा या नैतिक निर्दोषता का अतिरिक्त दावा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे इब्रानी वाक्य को हिंदी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है। ‘ऐसा ही करो’ मूल के अंतिम बलाघात ‘तुम और तुम्हारे बंदी’ को स्वाभाविक हिंदी में लागू करता है।
