  text: מִ/מַּֽחֲצִיתָ֖/ם תִּקָּ֑חוּ וְ/נָתַתָּ֛ה לְ/אֶלְעָזָ֥ר הַ/כֹּהֵ֖ן תְּרוּמַ֥ת יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/029.yaml
  text: From their half you shall take it and give it to Eleazar the priest as Yahweh’s contribution[a].
translation:
  language: hi
  text: उनके आधे भाग में से लो और याजक एलीआज़र को यहोवा का अंशदान दो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा की भेंट” अथवा “यहोवा के लिए अंशदान।” हिब्रू शब्द תְּרוּמָה उस अंश को दर्शाता है जो अलग रखकर अर्पित किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמַּחֲצִיתָם
  choice: उनके आधे भाग में से
  rationale: מִן और מַחֲצִית का संयुक्त अर्थ उनके लिए निर्धारित आधे भाग में से है; यह अनुवाद संदर्भगत स्वामित्व और विभाजन दोनों को स्पष्ट रखता है।
- source_word: תִּקָּחוּ
  choice: यह हिस्सा लेना
  rationale: हिब्रू रूप बहुवचन निर्देश देता है। हिन्दी में संयुक्त आज्ञार्थक वाक्य के रूप में ‘लेना ... देना’ विधिक निर्देश का स्वाभाविक और स्पष्ट भाव व्यक्त करता है। ‘यह हिस्सा’ पूर्वपद में निहित उस देय अंश को दर्शाता है जिसे लेना है।
- source_word: וְנָתַתָּה
  choice: और उसे ... देना
  rationale: यहाँ क्रिया एकवचन में होकर पिछले बहुवचन रूप के बाद आती है। हिन्दी में अनावश्यक कर्ता जोड़े बिना क्रिया-श्रृंखला रखने से मूल का निर्देशात्मक बल बना रहता है और वचन-परिवर्तन को कृत्रिम रूप से नहीं उभारा जाता।
- source_word: לְאֶלְעָזָר הַכֹּהֵן
  choice: याजक एलीआज़र को
  rationale: व्यक्तिनाम का मानक देवनागरी लिप्यंतरण किया गया है और निश्चित पदवी को सहज हिन्दी शब्दक्रम में रखा गया है।
- source_word: תְּרוּמַת יְהוָה
  choice: यहोवा के लिए पवित्र अंश
  rationale: תְּרוּמָה अलग रखे गए अंश या पवित्र प्रयोजन के लिए दिए गए योगदान को दर्शाता है। ‘पवित्र अंश’ युद्ध की लूट में से निर्धारित हिस्से के संदर्भ में स्वाभाविक है; ‘यहोवा के लिए’ संबंधसूचक पदबंध की संभावित लक्ष्यवाचक व्याख्या व्यक्त करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उसे किसी उपाधि से बदला गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। आधुनिक हिन्दी बाइबिलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है।
- issue: תְּרוּמַת יְהוָה में संबंध का अर्थ
  choice: यहोवा के लिए पवित्र अंश
  alternative: यहोवा का पवित्र अंश / यहोवा को दी जाने वाली भेंट
  rationale: हिब्रू संबंधसूचक रचना स्वामित्व, समर्पण या लक्ष्य का भाव दे सकती है। मुख्य पाठ संदर्भानुसार समर्पण का भाव देता है, और पादटिप्पणी वास्तविक वैकल्पिक अर्थों को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘उठाई हुई भेंट’ जैसे तकनीकी या पुराने पद से बचते हुए पवित्र प्रयोजन के लिए अलग किए गए हिस्से का भाव स्पष्ट किया गया है।
