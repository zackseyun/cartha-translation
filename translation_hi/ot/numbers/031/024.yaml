  text: וְ/כִבַּסְתֶּ֧ם בִּגְדֵי/כֶ֛ם בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י וּ/טְהַרְתֶּ֑ם וְ/אַחַ֖ר תָּבֹ֥אוּ אֶל הַֽ/מַּחֲנֶֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/024.yaml
  text: You shall wash your clothes on the seventh day[a], and you shall be clean[b]; afterward you may come into the camp.
translation:
  language: hi
  text: सातवें दिन अपने कपड़े धोओ, और तुम शुद्ध हो जाओगे[a]; उसके बाद तुम छावनी में आ सकोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम शुद्ध ठहरोगे।” यहाँ इब्रानी शब्द निर्धारित धुलाई के बाद कर्मकाण्डीय रूप से शुद्ध अवस्था में आने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम छावनी में प्रवेश करोगे।” प्रसंग में भाव यह है कि शुद्धि पूरी होने के बाद उन्हें फिर से छावनी में आने की अनुमति होगी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִבַּסְתֶּם
  choice: तुम अपने कपड़े धोना
  rationale: पिएल रूप कपड़ों को धोने का निर्देश देता है। ‘धोना’ आधुनिक हिन्दी में स्वाभाविक निर्देशात्मक प्रयोग है और अनिवार्यता को प्रसंग से स्पष्ट रहने देता है।
- source_word: בִּגְדֵיכֶם
  choice: अपने कपड़े
  rationale: בגד का सामान्य अर्थ वस्त्र या कपड़े है; ‘अपने कपड़े’ सहज आधुनिक हिन्दी है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: यह इब्रानी कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וּטְהַרְתֶּם
  choice: और तब तुम शुद्ध हो जाओगे
  rationale: טהר का काल रूप यहाँ शुद्धता की परिणामी अवस्था व्यक्त करता है। ‘शुद्ध हो जाओगे’ कर्मकाण्डीय शुद्धता को व्यक्त करता है, बिना इसे नैतिक या आत्मिक शुद्धि मान लेने के।
- source_word: וְאַחַר
  choice: उसके बाद
  rationale: यह शुद्ध होने के बाद होने वाली अगली क्रिया का स्पष्ट क्रम बताता है।
- source_word: תָּבֹאוּ אֶל הַמַּחֲנֶה
  choice: तुम छावनी में आ सकोगे
  rationale: בוא אל का अर्थ भीतर आना या प्रवेश करना है। शुद्धि पूरी होने के बाद छावनी में लौटने की अनुमति को ‘आ सकोगे’ स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: कर्मकाण्डीय शुद्धता की भाषा
  choice: शुद्ध हो जाओगे
  alternative: तुम्हें शुद्ध किया जाएगा; अपने को शुद्ध करना
  rationale: इब्रानी काल रूप को यहाँ अकर्मक और परिणामसूचक समझना सबसे उपयुक्त है। यह युद्ध के बाद निर्धारित विधि द्वारा कर्मकाण्डीय अशुद्धता से मुक्त होने की अवस्था बताता है; नैतिक या आत्मिक शुद्धि का अतिरिक्त अर्थ नहीं जोड़ा गया।
- issue: छावनी में पुनः प्रवेश
  choice: छावनी में आ सकोगे
  alternative: छावनी में आओगे; छावनी में आना
  rationale: व्याकरणतः साधारण भविष्य या निर्देश संभव है, पर प्रसंग में शुद्धि पूरी होने पर पुनः प्रवेश की अनुमति मुख्य भाव है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। बहुवचन ‘तुम’ मूल पाठ के बहुवचन संबोधन को दर्शाता है। ‘छावनी’ इस्राएली शिविर के लिए परिचित बाइबलीय हिन्दी शब्द है।
