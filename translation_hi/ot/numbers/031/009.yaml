source:
  edition: WLC
  text: וַ/יִּשְׁבּ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת נְשֵׁ֥י מִדְיָ֖ן וְ/אֶת טַפָּ֑/ם וְ/אֵ֨ת כָּל בְּהֶמְתָּ֧/ם וְ/אֶת כָּל מִקְנֵ/הֶ֛ם וְ/אֶת כָּל חֵילָ֖/ם בָּזָֽזוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/009.yaml
  text: The sons of Israel took captive the women of Midian and their little ones[a], and plundered all their livestock, all their herds[c][b], and all their wealth.
translation:
  language: hi
  text: इस्राएलियों ने मिद्यान की स्त्रियों और उनके छोटे बच्चों[a] को बंदी बना लिया, और उनके सारे पालतू पशु, सारे मवेशी और सारी संपत्ति लूट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके बाल-बच्चों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: बंदी बना लिया
  rationale: שׁבה के क़ाल रूप का अर्थ व्यक्तियों को युद्धबंदी बनाना है; यह सामान्य रूप से वस्तुएँ पकड़ लेने का संकेत नहीं देता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: हिन्दी में जातिसूचक बहुवचन स्वाभाविक और स्पष्ट है तथा प्रसंग में सामूहिक कर्ता को ठीक व्यक्त करता है।
- source_word: נְשֵׁי מִדְיָן
  choice: मिद्यान की स्त्रियों
  rationale: נָשִׁים यहाँ केवल पत्नियों तक सीमित नहीं, बल्कि व्यापक रूप से स्त्रियों को सूचित करता है।
- source_word: טַפָּם
  choice: उनके बाल-बच्चों
  rationale: טַף छोटे बच्चों अथवा नन्हों के लिए प्रयुक्त होता है; 'बाल-बच्चे' आधुनिक हिन्दी में उम्र की इस छाया को सहज रूप से व्यक्त करता है।
- source_word: בְּהֶמְתָּם
  choice: उनके सारे पालतू पशु
  rationale: सामूहिक בְּהֵמָה यहाँ घरेलू पशुओं को सूचित करता है।
- source_word: מִקְנֵהֶם
  choice: उनके सारे मवेशी
  rationale: מִקְנֶה अर्जित पशुधन, झुंडों और रेवड़ों को सूचित कर सकता है; 'मवेशी' पशुधन का स्वाभाविक हिन्दी पद है और पहले पद से यथासंभव भेद बनाए रखता है।
- source_word: חֵילָם
  choice: उनकी सारी संपत्ति
  rationale: इस गैर-सैनिक संदर्भ में חַיִל शेष धन-संपत्ति या संसाधनों को सूचित करता है।
- source_word: בָּזָזוּ
  choice: लूट ली
  rationale: בזז विजय के बाद युद्ध की लूट लेने को व्यक्त करता है; 'लूट ली' वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का जातिसूचक वाचक अनुवाद
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: शाब्दिक रूप 'इस्राएल के पुत्रों' सम्भव है, पर आधुनिक हिन्दी में कृत्रिम लग सकता है। 'इस्राएलियों' उसी जनसमूह को बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। क्रियाओं में स्त्रीलिंग एकवचन सहमति निकटवर्ती समष्टिवाचक कर्म-सूची के अनुरूप रखी गई है। मूल में पशुधन के दो निकटार्थक पदों को 'पालतू पशु' और 'मवेशी' से अलग रखने का प्रयास किया गया है।
