base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/054.yaml
  text: So Moses and Eleazar the priest took the gold from the commanders of thousands and of hundreds[a], and they brought it into the tent of meeting as a memorial for the sons of Israel before Yahweh.
translation:
  language: hi
  text: तब मूसा और एलीआज़ार याजक ने हज़ारों और सैकड़ों के सेनापतियों से वह सोना लिया और उसे मिलाप के तंबू में यहोवा के सामने इस्राएल के पुत्रों[a] के लिए स्मारक के रूप में ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है, जो वाचा के समुदाय के लिए प्रचलित पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; यहाँ ‘प्राप्त किया’ भी संदर्भतः संभव है, पर ‘लिया’ इब्रानी क्रिया को अधिक सीधे दर्शाता है।
- source_word: הַזָּהָב
  choice: वह सोना
  rationale: निश्चित उपपद पहले वर्णित विशिष्ट सोने की ओर संकेत करता है; हिन्दी में ‘वह सोना’ इस संदर्भ-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׂרֵי הָאֲלָפִים וְהַמֵּאוֹת
  choice: हज़ारों और सैकड़ों के सेनापतियों
  rationale: युद्ध-संदर्भ में שׂרים सैन्य अधिकारियों को दर्शाता है; ‘हज़ारों’ और ‘सैकड़ों’ सैन्य-प्रशासनिक टुकड़ियों के पदनाम हैं।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह इस्राएली उपासना-स्थान का प्रचलित हिन्दी नाम है और ‘भेंट/मुलाकात के तंबू’ की धारणा को सहज ढंग से व्यक्त करता है।
- source_word: זִכָּרוֹן
  choice: एक स्मारक
  rationale: यह संज्ञा स्मरण कराने वाली भेंट या वस्तु को सूचित करती है; ‘स्मारक’ उसके धार्मिक-स्मरणात्मक भाव को बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी की औपचारिक वाचा-संबंधी अभिव्यक्ति को सुरक्षित रखता है; आधुनिक मुहावरे में ‘इस्राएलियों’ भी संभव है, इसलिए पादटिप्पणी दी गई है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह उपासना-संदर्भ में यहोवा की उपस्थिति के समक्ष होने का स्वाभाविक और निकट अर्थ देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ हिन्दी पाठकों में प्रचलित नाम-रूप है और इसे केवल ‘प्रभु’ जैसी उपाधि में नहीं बदलता।
- issue: בני ישראל की वाचा-संबंधी अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: औपचारिक इब्रानी रूप और उसके वाचा-संबंधी स्वर को मुख्य पाठ में सुरक्षित रखा गया है, जबकि अधिक स्वाभाविक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- issue: זִכָּרוֹן का प्रयोजन-संबंध
  choice: ताकि वह ... एक स्मारक हो
  alternative: '... के लिए स्मारक के रूप में'
  rationale: इब्रानी में संक्षिप्त प्रयोजन/भूमिका-वाचक संरचना है। हिन्दी में ‘ताकि’ उस संबंध को स्पष्ट करती है, बिना यह निर्धारित किए कि स्मारक का प्रभाव केवल लोगों पर है या वह परमेश्वर के सामने उनकी स्मृति का चिह्न है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘मिलापवाला तंबू’ और ‘यहोवा’ जैसे परिचित बाइबलीय पद बनाए गए हैं; ‘इस्राएल के पुत्रों’ की औपचारिकता को पादटिप्पणी द्वारा स्पष्ट किया गया है।
