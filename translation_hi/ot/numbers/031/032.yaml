source:
  edition: WLC
  text: וַ/יְהִי֙ הַ/מַּלְק֔וֹחַ יֶ֣תֶר הַ/בָּ֔ז אֲשֶׁ֥ר בָּזְז֖וּ עַ֣ם הַ/צָּבָ֑א צֹ֗אן שֵׁשׁ מֵא֥וֹת אֶ֛לֶף וְ/שִׁבְעִ֥ים אֶ֖לֶף וַ/חֲמֵֽשֶׁת אֲלָפִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/032.yaml
  text: The plunder[a], the remainder of the spoil that the people of the army had plundered, was 675,000 sheep.
translation:
  language: hi
  text: लूटी हुई संपत्ति[a]—अर्थात लूट के माल का वह शेष भाग, जिसे सेना के लोगों ने लूटा था—में 6,75,000 भेड़-बकरियाँ थीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध में पकड़ा गया माल, लूट के माल का शेष भाग।” इब्रानी में युद्ध में प्राप्त माल के लिए अर्थ में बहुत निकट दो शब्द (מַלְקוֹחַ और בָּז) आए हैं; संभव है कि उनके प्रयोग में शैलीगत या वर्गीकरण-संबंधी सूक्ष्म अंतर हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: थीं
  rationale: यहाँ היה का रूप सूची में मात्रा बताने वाला सामान्य कथन आरम्भ करता है। हिन्दी में अलग आरम्भिक संयोजक जोड़े बिना क्रिया से इसका स्वाभाविक भाव व्यक्त होता है।
- source_word: הַמַּלְקוֹחַ
  choice: लूटी हुई संपत्ति
  rationale: यह युद्ध में हाथ लगी वस्तुओं या जीवों को दर्शाता है। यह पद आधुनिक हिन्दी में स्पष्ट है और निकटवर्ती בָּז से शब्दगत भेद भी बनाए रखता है।
- source_word: יֶתֶר הַבָּז
  choice: लूट के माल का वह शेष भाग
  rationale: יֶתֶר शेष या बचा हुआ भाग बताता है और בָּז युद्ध की लूट को। यह अनुवाद दोनों के संबंध को स्पष्ट रखता है।
- source_word: אֲשֶׁר בָּזְזוּ
  choice: जिसे ... ने लूटा था
  rationale: क्रिया בזז का युद्ध-संदर्भित अर्थ सीधे व्यक्त किया गया है; पूर्वकालिकता के लिए ‘था’ रखा गया है।
- source_word: עַם הַצָּבָא
  choice: सेना के लोग
  rationale: इब्रानी के ‘सेना के लोग’ को पारदर्शी और सहज हिन्दी में रखा गया है; इसे केवल ‘सैनिक’ कहकर संकुचित नहीं किया गया।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, विशेषतः भेड़ों और बकरियों, को समेट सकता है। ‘भेड़-बकरियाँ’ हिन्दी में इस व्यापक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וְשִׁבְעִים אֶלֶף וַחֲמֵשֶׁת אֲלָפִים
  choice: 6,75,000
  rationale: इब्रानी संख्या 6,00,000 + 70,000 + 5,000 है। भारतीय अंक-विभाजन हिन्दी पाठकों के लिए स्पष्ट और सटीक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। निकटार्थी इब्रानी युद्ध-लूट शब्दों का अंतर ‘लूटी हुई संपत्ति’ और ‘लूट का माल’ द्वारा बनाए रखा गया है। कोष्ठक-सदृश व्याख्यात्मक अंश को दीर्घ विराम-चिह्नों से अलग किया गया है, ताकि मूल की पुनर्व्याख्यात्मक संरचना स्पष्ट रहे।
