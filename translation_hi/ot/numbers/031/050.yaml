  text: וַ/נַּקְרֵ֞ב אֶת קָרְבַּ֣ן יְהוָ֗ה אִישׁ֩ אֲשֶׁ֨ר מָצָ֤א כְלִֽי זָהָב֙ אֶצְעָדָ֣ה וְ/צָמִ֔יד טַבַּ֖עַת עָגִ֣יל וְ/כוּמָ֑ז לְ/כַפֵּ֥ר עַל נַפְשֹׁתֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/050.yaml
  text: 'So we have brought near Yahweh’s offering: each man what he found—articles of gold[a], armlets and bracelets, rings, earrings[c][b], and pendants—to make atonement for ourselves before Yahweh.'
translation:
  language: hi
  text: 'इसलिए हम यहोवा की भेंट ले आए हैं—हर पुरुष ने जो सोने की वस्तुएँ पाई हैं: बाजूबंद[a], कंगन, अंगूठियाँ, बालियाँ और लटकन[b]—ताकि यहोवा के सामने अपने प्राणों के लिए प्रायश्चित करें।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “बाजूबंद” का अर्थ “पायल” भी हो सकता है; इब्रानी शब्द किसी अंग पर पहने जाने वाले आभूषण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: “लटकन” के लिए प्रयुक्त इब्रानी शब्द का ठीक अर्थ अनिश्चित है; सम्भावित अर्थों में हार, आभूषण या नथ भी हैं।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “अपने प्राणों/अपने व्यक्तियों के लिए प्रायश्चित करने के लिए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנַּקְרֵב
  choice: इसलिए हम ... ले आए हैं
  rationale: हिफ़ील रूप का मूल भाव ‘निकट लाना’ है; भेंट के संदर्भ में ‘ले आए हैं’ स्वाभाविक हिन्दी है, और आरम्भिक वाव को ‘इसलिए’ से संदर्भानुकूल व्यक्त किया गया है।
- source_word: קָרְבַּן יְהוָה
  choice: यहोवा के लिए भेंट
  rationale: קָרְבָּן निकट लाई गई भेंट है। संबंध-रचना को ‘यहोवा के लिए भेंट’ कहना हिन्दी में स्वाभाविक है और यह स्वामित्व तथा अर्पण के बीच अनावश्यक रूप से निर्णय नहीं करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אִישׁ אֲשֶׁר מָצָא
  choice: हर पुरुष को ... जो वस्तु मिली
  rationale: אִישׁ यहाँ सैनिकों में से प्रत्येक पुरुष को वितरणात्मक रूप से दर्शाता है।
- source_word: כְלִי זָהָב
  choice: सोने की ... वस्तु
  rationale: כְלִי व्यापक शब्द है; ‘वस्तु’ इसे केवल आभूषण तक सीमित नहीं करता, जबकि आगे की सूची उसका स्वरूप स्पष्ट करती है।
- source_word: אֶצְעָדָה
  choice: बाजूबंद
  rationale: यह किसी अंग पर पहना जाने वाला आभूषण है; ‘बाजूबंद’ सम्भावित अर्थ को दर्शाता है, जबकि ‘पायल’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: צָמִיד
  choice: कंगन
  rationale: कलाई या बाँह पर पहने जाने वाले अलंकार के लिए स्पष्ट और प्रचलित आधुनिक हिन्दी शब्द।
- source_word: טַבַּעַת
  choice: अंगूठियाँ
  rationale: मूल शब्द सामान्यतः अंगूठी बताता है; ‘मुहरदार अंगूठी’ कहना यहाँ आवश्यकता से अधिक विशिष्ट होगा।
- source_word: עָגִיל
  choice: बालियाँ
  rationale: इस आभूषण-सूची में कान में पहने जाने वाले छल्ले या बाली का स्वाभाविक हिन्दी रूप।
- source_word: כוּמָז
  choice: लटकन
  rationale: वस्तु की ठीक पहचान अनिश्चित है; ‘लटकन’ पठनीय पर सावधान चयन है, और अन्य सम्भावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: לְכַפֵּר
  choice: प्रायश्चित करें
  rationale: याजकीय संदर्भ में כפר के धार्मिक भार को बनाए रखता है और इसे केवल धन्यवाद या संकट टालने के अर्थ में हल्का नहीं करता।
- source_word: עַל נַפְשֹׁתֵינוּ
  choice: अपने प्राणों के लिए
  rationale: נֶפֶשׁ का शब्दगत जीवन/प्राण/व्यक्ति-संबंधी भाव बचता है, बिना आधुनिक आत्मा-शरीर द्वैत आरोपित किए।
theological_decisions:
- issue: सैनिकों की भेंट और כפר का संबंध
  choice: भेंट को यहोवा के सामने पुरुषों के प्राणों के लिए प्रायश्चित से संबद्ध रखा गया है।
  alternative: इसे केवल धन्यवाद-भेंट या सामान्य संकट-निवारण कहना।
  rationale: पद स्वयं קָרְבַּן, כפר और ‘यहोवा के सामने’ को साथ रखता है। अनुवाद प्रायश्चित का भाव बनाए रखता है, पर उसकी विधि या तंत्र को मूल से आगे नहीं समझाता।
- issue: אִישׁ का लिंग-सूचक अनुवाद
  choice: हर पुरुष
  alternative: हर व्यक्ति
  rationale: संदर्भ पुरुष सैनिकों/अधिकारियों का है; इसलिए मूल के पुल्लिंग वितरणात्मक रूप को बनाए रखा गया है।
- issue: עַל נַפְשֹׁתֵינוּ का अर्थ
  choice: अपने प्राणों के लिए
  alternative: अपने लिए
  rationale: अधिक सहज ‘अपने लिए’ के बजाय मूल के נֶפֶשׁ को दृश्य रखा गया है, पर इसे केवल अमूर्त ‘आत्माओं’ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली। आभूषणों के लिए परिचित शब्द चुने गए हैं; दो अनिश्चित शब्दों की अस्पष्टता पादटिप्पणियों में बनाए रखी गई है।
