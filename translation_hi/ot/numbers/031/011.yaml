  text: उन्होंने मनुष्यों और पशुओं समेत सारी लूट और सारा पकड़ा हुआ माल ले लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁלָל
  choice: लूट का माल
  rationale: युद्ध में छीनी गई वस्तुओं के लिए स्वाभाविक और स्पष्ट हिन्दी अभिव्यक्ति।
- source_word: מַלְקוֹחַ
  choice: पकड़े गए सभी लोगों और पशुओं
  rationale: मूल शब्द पकड़ी या कब्ज़े में ली गई जीवित संपत्ति को सूचित करता है; अगला वाक्यांश स्पष्ट करता है कि इसमें मनुष्य और पशु दोनों शामिल हैं।
- source_word: אָדָם
  choice: लोगों
  rationale: इस प्रसंग में सामूहिक अर्थ में पकड़े गए मनुष्यों को दर्शाता है; आधुनिक हिन्दी में 'लोगों' अधिक स्वाभाविक है।
- source_word: בְּהֵמָה
  choice: पशुओं
  rationale: यह सामान्यतः घरेलू या बड़े चौपाए पशुओं के लिए प्रयुक्त व्यापक शब्द है; 'पशु' मूल की व्यापकता बनाए रखता है।
