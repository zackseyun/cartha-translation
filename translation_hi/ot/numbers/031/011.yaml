  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रसंगानुकूल युद्ध-वर्णन। दो निकटार्थी इब्रानी संज्ञाओं का अंतर इस प्रकार रखा गया है कि שָׁלָל वस्तुगत लूट और מַלְקוֹחַ पकड़े गए जीवित मनुष्यों व पशुओं को दर्शाए।
