lexical_decisions:
- source_word: אַנְשֵׁי הַצָּבָא
  choice: सेना के ... पुरुष
  rationale: रचना का अर्थ सेना में सम्मिलित पुरुषों से है। ‘सेना के पुरुष’ मूल के संबंध और पुरुषवाचक अर्थ को बनाए रखता है, जबकि वाक्य में ‘हर एक’ के साथ इसे स्वाभाविक क्रम दिया गया है।
- source_word: בָּזְזוּ
  choice: लूट का माल लिया था
  rationale: क्रिया בזז का अर्थ लूटना या लूट का माल लेना है। कर्म मूल में अंतर्निहित है; हिन्दी में ‘लूट का माल लिया’ उसे सहज और स्पष्ट रूप से व्यक्त करता है। पूर्वसंदर्भ के कारण पूर्ण भूतकाल ‘लिया था’ उपयुक्त है।
- source_word: אִישׁ לוֹ
  choice: हर एक ... अपने लिए
  rationale: यह वितरणात्मक पदबंध बताता है कि प्रत्येक सैनिक ने व्यक्तिगत रूप से अपने लिए माल लिया। यह अनुवाद मूल के ‘एक-एक पुरुष, अपने लिए’ भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
