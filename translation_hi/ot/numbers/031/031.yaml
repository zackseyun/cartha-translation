  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/031/031.yaml
  text: So Moses and Eleazar the priest did as Yahweh had commanded Moses[a].
translation:
  language: hi
  text: तब मूसा और याजक एलआज़ार ने वैसा ही किया, जैसा याहवे[a] ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से ‘प्रभु’ अनूदित।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: तब ... ने ... किया
  rationale: क्रिया עשה यहाँ पिछली आज्ञा के पालन को समेटती है। हिंदी में ‘वैसा ही किया’ स्वाभाविक रूप से आज्ञा के अनुरूप कार्य करने का भाव देता है; वाव-क्रमिक को प्रसंगानुसार ‘तब’ से व्यक्त किया गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का प्रचलित मानक हिंदी बाइबलीय रूप।
- source_word: וְאֶלְעָזָר
  choice: और एलआज़ार
  rationale: संयोजक सहित व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: एलआज़ार की औपचारिक धार्मिक भूमिका बताने वाला पद; ‘याजक’ आधुनिक हिंदी बाइबलीय प्रयोग में स्पष्ट और प्रतिष्ठित है।
- source_word: כַּאֲשֶׁר
  choice: वैसा ही ... जैसा
  rationale: यह रचना आज्ञा के साथ पूर्ण अनुरूपता व्यक्त करती है और हिंदी में सहज है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: आज्ञा कार्य से पहले दी गई थी; ‘दी थी’ हिंदी में उस पूर्वकालिक संबंध को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में लंबे समय से प्रचलित नामरूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת अनुवादित नहीं होता; हिंदी में आज्ञा पाने वाले कर्म को ‘को’ से चिह्नित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। हिंदी पाठकों में स्थापित ‘यहोवा’ को मुख्य पाठ में चुना गया; ‘याहवे’ अधिक प्रत्यक्ष आधुनिक लिप्यंतरण है, पर इस संक्षिप्त पद में पाठकीय स्पष्टता के लिए प्रचलित रूप अपनाया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘वैसा ही ... जैसा’ मूल के अनुरूपता-संबंध को स्वाभाविक हिंदी में व्यक्त करता है। इस पद में किसी पाठांतर या वास्तविक अर्थगत अस्पष्टता के लिए पादटिप्पणी आवश्यक नहीं समझी गई।
