translation:
  language: hi
  text: और तुम्हारे लिए प्रायश्चित करने हेतु एक बकरा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी वाक्य संक्षिप्त है: “और एक बकरा, तुम्हारे लिए प्रायश्चित करने के लिए।” निकटवर्ती बलिदान-संदर्भ से इसे पापबलि के रूप में समझा जाता है, पर इस उपवाक्य में यह बात स्पष्ट रूप से नहीं कही गई है।'
    reason: स्रोत की अपूर्णोक्ति और संदर्भ से समझी जाने वाली बलिदान-श्रेणी स्पष्ट करना
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: इस याजकीय बलिदान-संदर्भ में संयुक्त पद का अर्थ नर बकरी है। आधुनिक हिन्दी में “बकरा” स्वाभाविक और स्पष्ट है।
- source_word: אֶחָד
  choice: एक
  rationale: यह संख्या एक ही पशु को सूचित करती है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित करने के लिए
  rationale: याजकीय बलिदान-संदर्भ में כפר के प्रचलित धार्मिक अर्थ को बनाए रखता है, पर प्रायश्चित की किसी विशेष धर्मसैद्धांतिक व्याख्या को आरोपित नहीं करता।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे लिए
  rationale: כפר के साथ עַל उन व्यक्तियों को दर्शाता है जिनके लिए प्रायश्चित किया जाता है; यह आधुनिक हिन्दी में स्वाभाविक लाभार्थी-सूचक प्रयोग है।
theological_decisions:
- issue: इब्रानी में स्पष्ट रूप से न दोहराई गई बलिदान-श्रेणी को जोड़ना
  choice: मुख्य पाठ में “पापबलि” न जोड़कर इब्रानी की संक्षिप्तता बनाए रखना
  alternative: “पापबलि के रूप में एक बकरा” कहना
  rationale: इस उपवाक्य में חטאת नहीं है। निकटवर्ती बलिदान-संदर्भ से पापबलि का कार्य समझ में आता है, पर उसे मुख्य पाठ में जोड़ने से स्रोत की वास्तविक अपूर्णोक्ति स्पष्ट कथन में बदल जाएगी। टिप्पणी पाठक को संदर्भगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य का आरंभ “और” से किया गया है ताकि पिछले पद की बलिदान-सूची से इसका संबंध बना रहे; शब्दक्रम स्वाभाविक हिन्दी के अनुरूप है।
