source:
  edition: WLC
  text: וּ/שְׁלֹשָׁ֣ה עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/פָּ֖ר הָ/אֶחָ֑ד וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לָ/אַ֖יִל הָֽ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/012.yaml
  text: and three-tenths of an ephah of fine flour as a grain offering[a], mixed with oil, for the one bull, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], for the one ram.
translation:
  language: hi
  text: और उस एक बैल के लिए एपा के तीन-दसवें भाग बारीक आटे की अन्नबलि, जो तेल में मिलाई हुई हो[a]; और उस एक मेढ़े के लिए एपा के दो-दसवें भाग बारीक आटे की अन्नबलि, जो तेल में मिलाई हुई हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल ‘तीन दसवें भाग’ और ‘दो दसवें भाग’ है; यहाँ माप का अर्थ एपा के दसवें भागों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: और एपा का तीन-दसवाँ भाग
  rationale: עֶשְׂרוֹן बलिदान-संबंधी विधान में एपा के दसवें भाग का माप है। मूल में केवल ‘तीन दसवें भाग’ है, पर आधुनिक पाठक के लिए निहित माप ‘एपा’ स्पष्ट किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह चढ़ावे में प्रयुक्त बारीक, परिष्कृत आटे का पारिभाषिक शब्द है; आधुनिक हिन्दी में ‘मैदा’ इसका स्वाभाविक और स्पष्ट समतुल्य है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: इस बलिदान-संदर्भ में מִנְחָה सामान्य भेंट नहीं, अनाज से तैयार की जाने वाली बलि को दर्शाता है; ‘अन्नबलि’ संक्षिप्त और संदर्भानुकूल है।
- source_word: בְּלוּלָה בַ/שֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: यह कृदन्तीय पदबंध मैदे को तेल के साथ मिलाकर तैयार करने का वर्णन करता है। ‘तेल में मिला हुआ’ मूल की रचना और अर्थ दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לַ/פָּר הָ/אֶחָד
  choice: उस एक बछड़े के लिए
  rationale: निश्चित उपपद के साथ אֶחָד यहाँ क्रमसूचक ‘पहला’ नहीं, एक विशिष्ट पशु को अलग-अलग निर्दिष्ट करता है। ‘उस एक’ इस बल को बनाए रखता है।
- source_word: וּ/שְׁנֵי עֶשְׂרֹנִים
  choice: और एपा का दो-दसवाँ भाग
  rationale: עֶשְׂרוֹן के निहित माप को स्पष्ट करते हुए ‘एपा का दो-दसवाँ भाग’ कहा गया है।
- source_word: לָ/אַיִל הָֽ/אֶחָד
  choice: उस एक मेढ़े के लिए
  rationale: यह ‘उस एक बछड़े’ के समानांतर व्यक्तिगत निर्देश है; ‘पहले मेढ़े’ कहना अनावश्यक क्रमसूचक अर्थ जोड़ देता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-उपासना संबंधी शैली में रखी गई है। ‘एपा’ प्राचीन माप की सांस्कृतिक विशिष्टता बनाए रखता है, जबकि पादटिप्पणी मूल की संक्षिप्त अभिव्यक्ति स्पष्ट करती है। पद की सूची-जैसी संरचना और दोनों पशुओं के लिए समानांतर वाक्य-विन्यास सुरक्षित रखा गया है।
