source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עוֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם אַ֣יִל אֶחָ֑ד שִׁבְעָ֥ה כְבָשִׂ֖ים בְּנֵ֥י שָׁנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/027.yaml
  text: 'And you shall present a burnt offering as a pleasing aroma to Yahweh: two bulls from the herd[a], one ram, and seven male lambs a year old.'
translation:
  language: hi
  text: 'और तुम यहवे के लिए सुखद सुगंध के निमित्त होमबलि चढ़ाओ: गोवंश के दो बैल, एक मेढ़ा और एक वर्ष के सात नर मेमने।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: और तुम ... चढ़ाना
  rationale: हिफ़ील रूप का बलिदान-संबंधी अर्थ ‘प्रस्तुत करना/चढ़ाना’ है; आज्ञात्मक प्रसंग में हिंदी का ‘चढ़ाना’ स्वाभाविक और अनुष्ठानिक अर्थ में स्पष्ट है।
- source_word: עוֹלָה
  choice: होमबलि
  rationale: यह पूर्णतः जलाए जाने वाले बलिदान की पारंपरिक और व्यापक रूप से समझी जाने वाली हिंदी संज्ञा है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगन्ध के रूप में
  rationale: इब्रानी बलिदानी सूत्र में स्वीकार्यता और तुष्टिकारक सुगन्ध का भाव है; ‘सुखदायक सुगन्ध’ मूल की अर्थ-सीमा को सहज हिंदी में रखता है।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय हिंदी में ‘यहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: झुंड में से दो बैल
  rationale: यह वाक्यांश गोवंशीय झुंड से दो नर पशुओं को दर्शाता है; यहाँ आयु स्पष्ट न होने से ‘जवान’ नहीं जोड़ा गया।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל के लिए सहज और सटीक हिंदी पशु-संज्ञा।
- source_word: שִׁבְעָה כְבָשִׂים
  choice: सात नर मेमने
  rationale: כְבָשִׂים पुल्लिंग मेमनों को सूचित करता है, इसलिए लिंग-सूचना स्पष्ट रखी गई है।
- source_word: בְּנֵי שָׁנָה
  choice: एक वर्ष के
  rationale: बलिदानी पशुओं की आयु बताने वाला मानक पद; हिंदी में संक्षिप्त और स्वाभाविक रूप।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला व्यक्तिवाचक वाचा-नाम सीधे प्रयुक्त है। ‘यहवे’ उसका आधुनिक विद्वत्तापरक हिंदी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: לְרֵיחַ נִיחֹחַ में बलिदान की स्वीकार्यता
  choice: सुखदायक सुगन्ध के रूप में
  alternative: मनभावनी सुगन्ध के रूप में
  rationale: अनुवाद मूल की सुगन्ध-संबंधी बलिदानी भाषा बनाए रखता है, पर इससे परमेश्वर के विषय में कोई अतिरिक्त भौतिक या दार्शनिक निष्कर्ष नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। गिनती और पशु-सूची मूल क्रम में रखी गई है; अनावश्यक व्याख्यात्मक शब्द नहीं जोड़े गए।
