language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אָמַרְתָּ֣ לָ/הֶ֔ם זֶ֚ה הָֽ/אִשֶּׁ֔ה אֲשֶׁ֥ר תַּקְרִ֖יבוּ לַ/יהוָ֑ה כְּבָשִׂ֨ים בְּנֵֽי שָׁנָ֧ה תְמִימִ֛ם שְׁנַ֥יִם לַ/יּ֖וֹם עֹלָ֥ה תָמִֽיד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/003.yaml
  text: 'And you shall say to them[a], ‘This is the food offering that you shall present to Yahweh: two male lambs a year old, without blemish, each day, as a regular burnt offering.’'
translation:
  language: hi
  text: 'और उनसे कहना, ‘यह वह अग्नि-भेंट है जिसे तुम यहोवा के लिए चढ़ाओगे: हर दिन एक वर्ष के दो निर्दोष नर मेमने, नियमित होमबलि के रूप में।’'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह इब्रानी बलिदानी शब्द आग पर चढ़ाई जाने वाली भेंट को सूचित करता है। ‘अग्नि-भेंट’ मूल रूप और याजकीय संदर्भ दोनों को स्पष्ट रखता है; ‘भोजन-भेंट’ हिंदी में अन्नबलि का भ्रम पैदा कर सकता है।
- source_word: תַּקְרִיבוּ
  choice: सामने चढ़ाओगे
  rationale: हिफ़ील रूप का बलिदानी अर्थ किसी भेंट को निकट लाकर विधिपूर्वक प्रस्तुत करना है। ‘यहोवा के सामने चढ़ाओगे’ इस कर्मकांडीय भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: לְ यहाँ भेंट के प्राप्तकर्ता अथवा जिसके सम्मुख उसे प्रस्तुत किया जाता है, यह संबंध दर्शाता है। वाचा-नाम को ‘यहोवा’ के रूप में रखा गया है।
- source_word: כְּבָשִׂים
  choice: नर मेमने
  rationale: संज्ञा पुल्लिंग है और बलिदान के पशुओं का उल्लेख करती है; इसलिए ‘नर मेमने’ अपेक्षित विशिष्टता स्पष्ट करता है।
- source_word: בְּנֵי שָׁנָה
  choice: एक-एक वर्ष के
  rationale: शाब्दिक मुहावरा ‘एक वर्ष के पुत्र’ पशुओं की एक वर्ष की आयु बताता है। दो मेमनों में से प्रत्येक पर आयु लागू होने के कारण ‘एक-एक वर्ष के’ स्वाभाविक और सटीक है।
- source_word: תְמִימִם
  choice: निर्दोष
  rationale: बलिदानी विधान में इसका अर्थ किसी शारीरिक दोष से रहित पशु है। ‘निर्दोष’ प्रचलित धर्मग्रंथीय शब्द है और इस संदर्भ में निष्कलंकता बताता है।
- source_word: לַיּוֹם
  choice: हर दिन
  rationale: संख्या के साथ यह प्रतिदिन की वितरणात्मक मात्रा—प्रत्येक दिन दो—व्यक्त करता है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलिदान का स्थापित हिंदी नाम है जो वेदी पर पूर्णतः जलाया जाता था; व्युत्पत्तिमूलक ‘आरोहण-भेंट’ सामान्य पाठक के लिए कम स्पष्ट होगा।
- source_word: תָמִיד
  choice: नियमित
  rationale: याजकीय समय-सारणी में यह निरंतर चलने वाली नियमित व्यवस्था को दर्शाता है, न कि आवश्यकतः हर क्षण बिना रुके होने वाली क्रिया को।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम स्पष्ट रूप से आया है। हिंदी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया है; ‘याहवे’ संभावित उच्चारण का वैकल्पिक लिप्यंतरण है।
- issue: הָאִשֶּׁה का बलिदानी आशय
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: शब्द आग के द्वारा चढ़ाई गई भेंट को दर्शाता है। ‘भोजन-भेंट’ से परमेश्वर को भोजन की आवश्यकता होने का अनचाहा संकेत और हिंदी पाठक के लिए अन्नबलि का भ्रम हो सकता है, इसलिए अधिक प्रत्यक्ष ‘अग्नि-भेंट’ चुना गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में आज्ञार्थक विधान को गरिमापूर्ण किंतु सहज रूप दिया गया है। ‘अग्नि-भेंट’, ‘होमबलि’ और ‘निर्दोष’ जैसे स्थापित बलिदानी शब्द तकनीकी सटीकता बनाए रखते हैं। पद में किसी पादटिप्पणी की आवश्यकता नहीं रखी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
