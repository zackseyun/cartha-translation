  yaml_path: translation/ot/numbers/028/015.yaml
  text: And one male goat for a sin offering to Yahweh shall be offered besides the regular burnt offering and its drink offering[a].
translation:
  language: hi
  text: और यहोवा के लिए पापबलि[a] के रूप में एक बकरा चढ़ाया जाए, नित्य होमबलि और उसकी पेय-बलि के अतिरिक्त।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धिकरण-बलि।’ इब्रानी शब्द חַטָּאת उस बलि को सूचित कर सकता है जो पाप के साथ-साथ अशुद्धता का भी निवारण करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: एक बकरा
  rationale: यह इब्रानी पद बलिदान के लिए नर बकरे को सूचित करता है; आधुनिक हिन्दी में ‘बकरा’ स्वाभाविक रूप से नर पशु को स्पष्ट करता है।
- source_word: אֶחָד
  choice: एक
  rationale: बलिदान की निर्धारित संख्या को स्पष्ट रूप से बनाए रखा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदानी व्यवस्था में חַטָּאת का प्रचलित और पाठकों के लिए परिचित अर्थ ‘पापबलि’ है; ‘शुद्धिकरण-बलि’ की वास्तविक वैकल्पिक व्याख्या पादटिप्पणी में सुरक्षित है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ में आए परमेश्वर के निज नाम יהוה को हिन्दी के परिचित रूप ‘यहोवा’ से व्यक्त किया गया है; ‘को’ बलि के समर्पण का भाव देता है।
- source_word: עַל
  choice: के अतिरिक्त
  rationale: यहाँ עַל स्थानसूचक ‘पर’ नहीं, बल्कि नियमित बलि के साथ अतिरिक्त चढ़ावे का संबंध बताता है।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: תָּמִיד नियमित और निरंतर निर्धारित बलि को सूचित करता है; ‘नित्य होमबलि’ संक्षिप्त, प्रतिष्ठित और हिन्दी बाइबलीय प्रयोग में समझने योग्य है।
- source_word: יֵעָשֶׂה
  choice: चढ़ाया जाए
  rationale: क्रिया का शाब्दिक अर्थ ‘किया/बनाया जाए’ है, पर बलिदानी संदर्भ में ‘चढ़ाया जाए’ स्वाभाविक और सटीक है।
- source_word: וְנִסְכּוֹ
  choice: और उसके अर्घ
  rationale: נֶסֶךְ साथ में उंडेले जाने वाले पेय-चढ़ावे को दर्शाता है; ‘अर्घ’ इस धार्मिक क्रिया का संक्षिप्त हिन्दी पद है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: निज नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी पाठकों में अधिक परिचित ‘यहोवा’ चुना गया, जबकि ‘याहवे’ संभावित उच्चारण का वैकल्पिक लिप्यंतरण है।
- issue: बलिदानी संदर्भ में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ परिचित पारंपरिक पद है, पर इब्रानी शब्द अशुद्धता दूर करने वाली बलि को भी सूचित कर सकता है; इसलिए वैध अर्थगत तनाव पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। विधिक-बलिदानी शैली बनाए रखते हुए एक लंबी निष्क्रिय संरचना को दो वाक्यों में बाँटा गया है। ‘होमबलि’ और ‘अर्घ’ जैसे स्थापित धार्मिक पद प्रसंग की औपचारिकता को सुरक्षित रखते हैं।
