  text: וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֣ין הָֽ/עַרְבָּ֑יִם כְּ/מִנְחַ֨ת הַ/בֹּ֤קֶר וּ/כְ/נִסְכּ/וֹ֙ תַּעֲשֶׂ֔ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/008.yaml
  text: And you shall offer the second lamb between the evenings[a]; like the morning grain offering and its drink offering, you shall offer it as a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: hi
  text: और दूसरे मेमने को तुम दोनों साँझों के बीच[a] चढ़ाओ। प्रातःकाल की अन्न-भेंट और उसकी पेय-भेंट के अनुसार उसे चढ़ाओ—यहोवा के लिए अग्नि-भेंट, सुखद सुगन्ध।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘दोनों साँझों के बीच’; इस पारम्परिक अभिव्यक्ति को प्रायः ‘गोधूलि के समय’ समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֶּבֶשׂ הַשֵּׁנִי
  choice: दूसरे मेमने
  rationale: बलिदान-संबंधी प्रसंग में כֶּבֶשׂ के लिए ‘मेमना’ स्वाभाविक है; ‘दूसरे’ से भोर के बाद के क्रम का स्पष्ट संबंध बना रहता है।
- source_word: תַּעֲשֶׂה
  choice: चढ़ाना
  rationale: शाब्दिक अर्थ ‘करना/बनाना’ है, पर बलिदान के संदर्भ में हिन्दी में ‘चढ़ाना’ अर्थ को स्वाभाविक और सटीक ढंग से व्यक्त करता है।
- source_word: בֵּין הָעַרְבָּיִם
  choice: दोनों साँझों के बीच
  rationale: इब्रानी द्विवचनात्मक मुहावरे को औपचारिक रूप से सुरक्षित रखा गया है, क्योंकि इसके ठीक समय-संदर्भ पर मतभेद है।
- source_word: כְּמִנְחַת הַבֹּקֶר
  choice: भोर के अन्नबलि के समान
  rationale: याजकीय प्रसंग में מִנְחָה विशिष्ट रूप से अन्नबलि को दर्शाता है, सामान्य भेंट को नहीं।
- source_word: וּכְנִסְכּוֹ
  choice: और उसके अर्घ के समान
  rationale: נֶסֶךְ साथ में उँडेली जाने वाली भेंट है; ‘अर्घ’ हिन्दी बाइबलीय बलिदानी भाषा में संक्षिप्त और उपयुक्त है।
- source_word: אִשֵּׁה
  choice: आग में चढ़ाया जाने वाला बलिदान
  rationale: यह अभिव्यक्ति शब्द के अग्नि-संबंधी तत्व को स्पष्ट रखती है और अस्पष्ट ‘भोजन-भेंट’ से बचती है।
- source_word: רֵיחַ נִיחֹחַ
  choice: एक मनभावनी सुगन्ध
  rationale: यह बलिदानी सूत्र के रूपक और स्वीकार्यता के भाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल में आए व्यक्तिगत दिव्य नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से प्रत्यक्ष रूप में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम प्रत्यक्ष रूप से है; उसे किसी उपाधि से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ रखा गया है।
- issue: בֵּין הָעַרְבָּיִם का समय-संदर्भ
  choice: दोनों साँझों के बीच
  alternative: गोधूलि के समय / साँझ के समय
  rationale: सटीक समय को लेकर मूल मुहावरा व्याख्यात्मक खुलापन रखता है; मुख्य पाठ में उसका रूप सुरक्षित है और सहज अर्थ पादटिप्पणी में दिया गया है।
- issue: אִשֵּׁה का अर्थ
  choice: आग में चढ़ाया जाने वाला बलिदान
  alternative: भोजन-भेंट
  rationale: मूल शब्द का अग्नि से संबंध स्पष्ट है; इस अनुवाद से अनुष्ठानिक क्रिया सुरक्षित रहती है, जबकि वैकल्पिक व्युत्पत्तिगत समझ पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य धार्मिक शैली-विन्यास रखा गया है। ‘दोनों साँझों के बीच’ मूल की वास्तविक अस्पष्टता बचाता है; ‘अन्नबलि’, ‘अर्घ’ और ‘बलिदान’ प्रसंगानुकूल पारिभाषिक शब्द हैं।
