source:
  edition: WLC
  text: וַ/עֲשִׂירִ֧ית הָ/אֵיפָ֛ה סֹ֖לֶת לְ/מִנְחָ֑ה בְּלוּלָ֛ה בְּ/שֶׁ֥מֶן כָּתִ֖ית רְבִיעִ֥ת הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/005.yaml
  text: and a tenth of an ephah of fine flour for a grain offering[b][a], mixed with a quarter of a hin of beaten oil.
translation:
  language: hi
  text: और अन्नबलि के लिए एपा का दसवाँ भाग बारीक आटा, जो एक चौथाई हीन कुटाई से निकाले हुए तेल के साथ मिलाया हुआ हो।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एपा और हीन प्राचीन इस्राएली माप-इकाइयाँ थीं।
    reason: cultural_note
  - marker: b
    text: या, “एक चौथाई हीन दबाकर निकाले हुए तेल के साथ मिला हुआ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂירִית הָאֵיפָה
  choice: और ... एपा का दसवाँ भाग
  rationale: आरंभिक वाव इस सामग्री को पिछले पद के विधान से जोड़ता है। प्राचीन माप 'एपा' को स्रोत की विशिष्टता बनाए रखने के लिए लिप्यंतरित किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलियों में प्रयुक्त बारीक पिसे उत्तम आटे को दर्शाता है; आधुनिक हिंदी में 'मैदा' सहज और स्पष्ट है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय विधान में מִנְחָה अनाज से चढ़ाई जाने वाली विशिष्ट बलि है, इसलिए सामान्य 'भेंट' के बजाय 'अन्नबलि' चुना गया है।
- source_word: בְּלוּלָה בְּשֶׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत मैदे को तेल के साथ मिलाए जाने का वर्णन करता है; हिंदी में यह स्वाभाविक रचना है।
- source_word: כָּתִית
  choice: कूटे हुए जैतून का
  rationale: यह तेल निकालने के लिए जैतून को कूटने या कुचलने की प्रक्रिया बताता है। हिंदी में केवल 'कूटा हुआ तेल' अस्वाभाविक होगा, इसलिए वस्तु और प्रक्रिया स्पष्ट की गई है।
- source_word: רְבִיעִת הַהִין
  choice: एक चौथाई हीन
  rationale: अंश को सहज हिंदी में रखा गया और प्राचीन द्रव-माप 'हीन' को लिप्यंतरित किया गया है।
