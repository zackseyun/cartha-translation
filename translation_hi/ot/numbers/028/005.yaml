  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन माप-इकाइयाँ अनूदित या आधुनिक मात्राओं में परिवर्तित नहीं की गईं। मुख्य पाठ में दोनों पादटिप्पणी-चिह्न दिए गए हैं।
