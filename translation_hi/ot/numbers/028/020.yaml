  terminology: “अन्नबलि,” “मैदा,” “एपा,” “बैल,” and “मेढ़ा” are appropriate for this legal-sacrificial context. “एपा” is retained in the text, with a concise cultural note explaining the underlying Hebrew abbreviation and the ancient dry measure.
