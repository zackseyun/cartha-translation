  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִ֨נְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֗ר וּ/שְׁנֵ֧י עֶשְׂרֹנִ֛ים לָ/אַ֖יִל תַּעֲשֽׂוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/020.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], and two-tenths for the ram you shall prepare.'
translation:
  language: hi
  text: 'और उनकी अन्नबलि तेल से मिला हुआ मैदा हो: बैल के लिए एपा के तीन दसवें भाग[a] और मेढ़े के लिए एपा के दो दसवें भाग तुम तैयार करना।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “तीन दसवें भाग” और “दो दसवें भाग” है; ये एपा के दसवें भागों को सूचित करते हैं। एपा सूखी वस्तुओं की एक प्राचीन माप थी, जिसका उपयोग बलिदान-संबंधी विधियों में होता था।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: और उनका अन्नबलि
  rationale: बलिदान-संबंधी संदर्भ में מִנְחָה विशेष रूप से अन्नबलि को दर्शाता है; बहुवचन प्रत्यय को निकटवर्ती पशुओं के सामूहिक संदर्भ के अनुसार 'उनका' रखा गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलियों में प्रयुक्त बारीक पिसे उत्तम आटे का मानक पद है; आधुनिक हिन्दी में 'मैदा' सहज और स्पष्ट है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत और בְּ की रचना तेल के साथ मिलाए जाने को व्यक्त करती है; हिन्दी में यह स्वाभाविक ढंग से उसी क्रिया को बताता है।
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: एपा का तीन-दसवाँ भाग
  rationale: עִשָּׂרוֹן एपा के दसवें भाग की माप है। मुख्य पाठ में माप स्पष्ट करने से हिन्दी पाठक को अस्पष्ट 'तीन-दसवाँ' से बचाया जाता है।
- source_word: לַפָּר
  choice: बैल के लिए
  rationale: सप्रत्यय एकवचन उसी निर्धारित बैल की ओर संकेत करता है जिसका प्रसंग में उल्लेख है।
- source_word: וּשְׁנֵי עֶשְׂרֹנִים
  choice: और एपा का दो-दसवाँ भाग
  rationale: समान माप को समानांतर ढाँचे में स्पष्ट रूप से व्यक्त किया गया है।
- source_word: לָאַיִל
  choice: मेढ़े के लिए
  rationale: एकवचन पद प्रसंग में निर्धारित मेढ़े की ओर संकेत करता है।
- source_word: תַּעֲשׂוּ
  choice: तुम तैयार करना
  rationale: עשה का मूल अर्थ करना/बनाना है; बलिदान-विधि में 'तैयार करना' अपेक्षित क्रिया को सहज रूप से बताता है, बिना इसे विशेष रूप से 'चढ़ाना' बना देने के।
