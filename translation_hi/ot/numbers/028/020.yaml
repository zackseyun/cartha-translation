translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण विधिक शैली। 'अन्नबलि', 'मैदा', 'बैल' और 'मेढ़ा' जैसे प्रचलित बाइबलीय एवं सामान्य शब्द रखे गए हैं। मुख्य पाठ में 'एपा' जोड़कर निहित माप स्पष्ट की गई है, जबकि पाद-टिप्पणी इब्रानी की संक्षिप्त अभिव्यक्ति समझाती है।
