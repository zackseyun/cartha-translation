  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֣ר הָֽ/אֶחָ֔ד שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/028.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the one bull[a], and two-tenths for the one ram.'
translation:
  language: hi
  text: 'और उनकी अन्नबलि तेल में मिला हुआ मैदा हो: एक बैल के लिए तीन दशमांश[a] और एक मेढ़े के लिए दो दशमांश।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दसवें भाग के तीन माप” और “दसवें भाग के दो माप” हैं; बलिदान के इस प्रसंग में इन्हें सामान्यतः एपा के दसवें भाग समझा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: और उनका अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अनाज से चढ़ाई जाने वाली भेंट को सूचित करता है; ‘अन्नबलि’ इसका संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलि में प्रयुक्त बारीक, उत्तम आटे का मानक पद है; आधुनिक हिन्दी में ‘मैदा’ सहज और स्पष्ट है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत तेल के साथ मिलाकर तैयार किए गए मैदे को दर्शाता है; हिन्दी में यह स्वाभाविक रीति से उसी क्रिया को व्यक्त करता है।
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: तीन दशमांश
  rationale: इब्रानी में दसवें भाग के तीन माप हैं। मूल पाठ यहाँ बड़ी इकाई का नाम नहीं देता, इसलिए मुख्य पाठ में संक्षिप्त माप रखा गया और सांस्कृतिक जानकारी पादटिप्पणी में दी गई।
- source_word: לַפָּר הָאֶחָד
  choice: एक बैल के लिए
  rationale: פַּר झुंड का नर पशु, अर्थात बैल है। लेख सहित אֶחָד को सहज हिन्दी में ‘एक बैल’ कहा गया है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: दो दशमांश
  rationale: यह दसवें भाग के दो मापों को सूचित करता है; पहली मात्रा के समान संक्षिप्त रूप रखा गया है।
- source_word: לָאַיִל הָאֶחָד
  choice: एक मेढ़े के लिए
  rationale: אַיִל का अर्थ ‘मेढ़ा’ है; लेख सहित संख्या को स्वाभाविक हिन्दी में ‘एक मेढ़ा’ के रूप में व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद की सूची-जैसी विधिक संरचना बनाए रखने के लिए द्विबिंदु का प्रयोग किया गया है; इब्रानी में निहित क्रिया को हिन्दी में ‘हो’ से पूरा किया गया है।
