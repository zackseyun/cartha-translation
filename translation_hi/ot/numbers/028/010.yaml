  yaml_path: translation/ot/numbers/028/010.yaml
  text: The burnt offering of each Sabbath is on its Sabbath[a], in addition to the regular burnt offering and its drink offering.
translation:
  language: hi
  text: हर सब्त की होमबलि उसी सब्त के दिन, नियमित होमबलि और उसकी पेय-बलि के अतिरिक्त चढ़ाई जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֹלַת
  choice: होमबलि
  rationale: यह पूरे पशु को वेदी पर जलाकर चढ़ाए जाने वाले बलिदान का प्रचलित और संक्षिप्त हिन्दी बाइबलीय पद है।
- source_word: שַׁבַּת
  choice: सब्त
  rationale: बलिदानों के इस पंचांग-संदर्भ में इसका अर्थ विश्राम-दिन अर्थात सब्त है, न कि सामान्य रूप से सप्ताह।
- source_word: בְּשַׁבַּתּוֹ
  choice: उसी सब्त के दिन
  rationale: शाब्दिक रूप से ‘उसके सब्त में/पर’ है। हिन्दी में यह अभिव्यक्ति प्रत्येक सब्त के लिए निर्धारित बलिदान को उसी दिन चढ़ाने का आवर्ती भाव स्वाभाविक ढंग से व्यक्त करती है।
- source_word: עַל
  choice: के अतिरिक्त
  rationale: बलिदान-संबंधी निर्देशों में यह पहले से निर्धारित चढ़ावे के ऊपर जोड़े जाने वाले चढ़ावे को सूचित करता है।
- source_word: הַתָּמִיד
  choice: नियमित
  rationale: यह निरंतर अथवा नियमित रूप से चढ़ाए जाने वाले निर्धारित होमबलि का बोध कराता है; ‘नियमित’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְנִסְכָּהּ
  choice: और उसके अर्घ
  rationale: נֶסֶךְ उंडेलकर चढ़ाए जाने वाले पेय-चढ़ावे को दर्शाता है। स्त्रीलिंग एकवचन प्रत्यय का संबंध होमबलि से है; ‘अर्घ’ इसका प्रतिष्ठित हिन्दी बलिदानी पद है।
