  register: आधुनिक, गरिमापूर्ण और निर्देशात्मक हिन्दी। मूल में स्पष्ट क्रिया नहीं है; हिन्दी में पूर्ण और स्वाभाविक विधिक वाक्य के लिए ‘चढ़ाया जाए’ और ‘होगा’ जोड़े गए हैं, बिना नई धार्मिक व्याख्या जोड़े।
