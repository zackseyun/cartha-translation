- source_word: לֹא תַעֲשׂוּ
  choice: तुम ... न करना
  rationale: द्वितीय पुरुष बहुवचन में दिया गया विधिक निषेध हिन्दी में सामुदायिक संबोधन वाले ‘तुम ... न करना’ से स्वाभाविक और दृढ़ रूप में व्यक्त होता है।
