base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/031.yaml
  text: Besides the regular burnt offering and its grain offering[a], you shall prepare them; they shall be without blemish[c][b], along with their drink offerings.
translation:
  language: hi
  text: नित्य होमबलि[a] और उसकी अन्नबलि के अतिरिक्त, इन पशुओं को उनके अर्घों[c] समेत चढ़ाना; ये तुम्हारे लिए निर्दोष हों[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “नित्य होमबलि” का अनुवाद “निरन्तर होमबलि” या “प्रतिदिन की होमबलि” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में भाव है, “वे तुम्हारे लिए निर्दोष हों”; आशय यह है कि चढ़ाए जाने वाले पशुओं में कोई दोष न हो।
    reason: lexical_alternative
  - marker: c
    text: “अर्घ” अर्थात उंडेली जाने वाली पेय-भेंट।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह पद इन बलियों को नियमित होमबलि के साथ चढ़ाई जाने वाली अतिरिक्त बलियों के रूप में प्रस्तुत करता है।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: תָּמִיד यहाँ नियमित रूप से प्रतिदिन चढ़ाए जाने वाले होमबलि को सूचित करता है; ‘नित्य’ संक्षिप्त और प्रचलित धार्मिक भाषा है।
- source_word: וּמִנְחָתוֹ
  choice: और उसके अन्नबलि
  rationale: याजकीय प्रसंग में מִנְחָה होमबलि के साथ चढ़ाए जाने वाले अनाज-आधारित अर्पण को दर्शाता है।
- source_word: תַּעֲשׂוּ
  choice: चढ़ाना
  rationale: बलिदान-संबंधी प्रसंग में עשה का अर्थ बलि को विधिपूर्वक प्रस्तुत या चढ़ाना हो सकता है; हिंदी में यह स्वाभाविक निर्देश है।
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: ये पशु तुम्हारे लिए निर्दोष हों
  rationale: תְּמִימִם बलि-पशुओं के शारीरिक दोष से रहित होने को दर्शाता है। ‘तुम्हारे लिए’ इब्रानी के לָכֶם को बनाए रखता है, और ‘पशु’ निहित संदर्भ स्पष्ट करता है।
- source_word: וְנִסְכֵּיהֶם
  choice: और इनके साथ इनके अर्घ भी चढ़ाना
  rationale: נֶסֶךְ उंडेली जाने वाली, प्रायः दाखमधु की, भेंट है। ‘अर्घ’ हिंदी बाइबलीय बलिदान-भाषा में इस क्रिया को संक्षेप में व्यक्त करता है।
