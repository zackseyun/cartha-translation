source:
  edition: WLC
  text: כָּ/אֵ֜לֶּה תַּעֲשׂ֤וּ לַ/יּוֹם֙ שִׁבְעַ֣ת יָמִ֔ים לֶ֛חֶם אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה עַל עוֹלַ֧ת הַ/תָּמִ֛יד יֵעָשֶׂ֖ה וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/024.yaml
  text: 'Thus you shall offer these each day for seven days: food[a], an offering made by fire, a pleasing aroma to Yahweh[c][b]; it shall be offered in addition to the regular burnt offering and its drink offering.'
translation:
  language: hi
  text: 'इनके समान तुम सात दिन तक प्रतिदिन चढ़ाओ: याहवे के लिए भोजन—अग्नि में चढ़ाई जाने वाली भेंट—जो सुखद सुगंध है। इसे नित्य होमबलि और उसके पेय-चढ़ावे के अतिरिक्त चढ़ाया जाए।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּאֵלֶּה
  choice: ऐसी ही बलियाँ
  rationale: उपसर्ग כְּ की तुलनात्मक शक्ति को बनाए रखते हुए पिछले पदों में बताई गई बलियों की ओर संकेत करता है; हिन्दी में यह शब्दशः ‘इनके समान’ से अधिक स्वाभाविक है।
- source_word: תַּעֲשׂוּ
  choice: तुम ... चढ़ाना
  rationale: עשה का सामान्य अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी प्रसंग में ‘चढ़ाना’ अभिप्रेत क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַיּוֹם שִׁבְעַת יָמִים
  choice: सात दिन तक प्रतिदिन
  rationale: यह सातों दिनों में हर दिन क्रिया दोहराए जाने का वितरणात्मक भाव स्पष्ट करता है।
- source_word: לֶחֶם אִשֵּׁה
  choice: अग्नि-बलि का भोजन
  rationale: लֶחֶם यहाँ केवल रोटी नहीं, चढ़ावे के रूप में दिया गया ‘भोजन’ है; इश्शेह को पारंपरिक और पारदर्शी ‘अग्नि-बलि’ से व्यक्त किया गया है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखदायक सुगन्ध
  rationale: बलिदान की परमेश्वर को स्वीकार्यता दर्शाने वाले इब्रानी रूपक को आधुनिक, गरिमामय हिन्दी में बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को पदवी से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: עַל עֹלַת הַתָּמִיד
  choice: नित्य होमबलि ... के अतिरिक्त
  rationale: इस अनुष्ठानिक प्रसंग में עַל अतिरिक्त चढ़ावे का संबंध बताता है; תָּמִיד की निरंतर/नियमित प्रकृति को ‘नित्य’ व्यक्त करता है।
- source_word: יֵעָשֶׂה
  choice: चढ़ाया जाए
  rationale: עשה के निष्क्रिय रूप को बलिदान-संदर्भ के अनुसार स्वाभाविक रूप से प्रस्तुत करता है।
- source_word: וְנִסְכּוֹ
  choice: और उसके अर्घ
  rationale: נֶסֶךְ उंडेले जाने वाले पेय-चढ़ावे को दर्शाता है; ‘अर्घ’ संक्षिप्त और स्थापित धार्मिक हिन्दी है, तथा प्रत्यय का संबंध नित्य होमबलि से है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा-नाम सीधे आया है; ‘याहवे’ उसे पदवी में बदले बिना और किसी सम्प्रदायगत व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: רֵיחַ נִיחֹחַ के स्वीकार्यता-सूचक रूपक को बनाए रखना
  choice: सुखदायक सुगन्ध
  alternative: स्वीकार्य बलि
  rationale: मूल का संवेदी रूपक सुरक्षित रखा गया है; उसे केवल उसके धर्मवैज्ञानिक आशय ‘स्वीकार्य’ में समेटकर तनाव समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमामय किंतु सामान्य पाठक के लिए सहज। ‘होमबलि’, ‘अग्नि-बलि’ और ‘अर्घ’ जैसे अनुष्ठानिक शब्द संदर्भ की सटीकता बनाए रखते हैं। स्त्रीलिंग बहुवचन ‘बलियाँ’ के कारण अगले वाक्यों में ‘वे/उन्हें’ का प्रयोग किया गया है; यह इब्रानी निर्देश के सामूहिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
