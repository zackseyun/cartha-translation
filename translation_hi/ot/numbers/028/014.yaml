  to: 'और उनकी दाखरस की पेय-बलियाँ ये होंगी: बैल के लिए आधा हीन, मेढ़े के लिए एक-तिहाई हीन और मेम्ने के लिए एक-चौथाई हीन। यह वर्ष के महीनों में हर महीने की होमबलि है।[a]'
  rationale: Revised “बछड़ा” to “बैल” for the precise sense of פַּר; rendered drink offerings as “दाखरस की पेय-बलियाँ” for transparent modern Hindi and correct scope of יָיִן; and recast the concluding clause to retain the Hebrew’s monthly/distributive sense without redundant expansion. The footnote continues to preserve the legitimate lexical alternative “new moon.”
