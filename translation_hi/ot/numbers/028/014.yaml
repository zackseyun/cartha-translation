source:
  edition: WLC
  text: וְ/נִסְכֵּי/הֶ֗ם חֲצִ֣י הַ/הִין֩ יִהְיֶ֨ה לַ/פָּ֜ר וּ/שְׁלִישִׁ֧ת הַ/הִ֣ין לָ/אַ֗יִל וּ/רְבִיעִ֥ת הַ/הִ֛ין לַ/כֶּ֖בֶשׂ יָ֑יִן זֹ֣את עֹלַ֥ת חֹ֨דֶשׁ֙ בְּ/חָדְשׁ֔/וֹ לְ/חָדְשֵׁ֖י הַ/שָּׁנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/014.yaml
  text: 'And their drink offerings shall be: half a hin for the bull[a], a third of a hin for the ram, and a fourth of a hin for the lamb, of wine. This is the monthly burnt offering for each month throughout the months of the year.'
translation:
  language: hi
  text: 'और उनकी दाखरस की पेय-बलियाँ ये होंगी: बैल के लिए आधा हीन, मेढ़े के लिए एक-तिहाई हीन और मेम्ने के लिए एक-चौथाई हीन। यह वर्ष के महीनों में हर महीने की होमबलि है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह वर्ष के महीनों में, अपने-अपने महीने में नए चाँद की होमबलि है।” इब्रानी शब्द חֹדֶשׁ का अर्थ “महीना” या “नया चाँद” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִסְכֵּיהֶם
  choice: उनके अर्घ
  rationale: नֶסֶךְ उंडेली जाने वाली पेय-भेंट है। बलिदान-संबंधी हिंदी में ‘अर्घ’ संक्षिप्त और गरिमापूर्ण है; बहुवचन का भाव ‘ये होंगे’ और आगे दी मात्राओं से स्पष्ट है।
- source_word: חֲצִי הַהִין
  choice: आधा हीन
  rationale: प्राचीन माप ‘हीन’ को परिवर्तित न करके मूल पाठ की ऐतिहासिक पारदर्शिता बनाए रखी गई है।
- source_word: לַפָּר
  choice: बछड़े के लिए
  rationale: פַּר बलि के संदर्भ में जवान बैल/बछड़े को सूचित करता है; गिनती 28:11 के अनुरूप ‘बछड़ा’ स्वाभाविक हिंदी है।
- source_word: וּשְׁלִישִׁת הַהִין
  choice: एक-तिहाई हीन
  rationale: इब्रानी भिन्नात्मक अभिव्यक्ति का स्पष्ट और स्वाभाविक हिंदी रूप।
- source_word: לָאַיִל
  choice: मेढ़े के लिए
  rationale: אַיִל का बलिदान-संदर्भ में सामान्य अर्थ नर भेड़, अर्थात ‘मेढ़ा’, है।
- source_word: וּרְבִיעִת הַהִין
  choice: एक-चौथाई हीन
  rationale: मूल की भिन्नात्मक मात्रा को सटीक और सुबोध रूप में रखा गया है।
- source_word: לַכֶּבֶשׂ
  choice: मेम्ने के लिए
  rationale: כֶּבֶשׂ के लिए सामान्य, सुबोध बलिदान-संबंधी हिंदी शब्द ‘मेमना’ चुना गया है।
- source_word: יָיִן
  choice: दाखमधु
  rationale: यह शब्द सूची के अंत में आकर सभी अर्घों का पदार्थ बताता है। ‘दाखमधु’ बाइबलीय हिंदी में परिचित और गरिमापूर्ण है।
- source_word: זֹאת עֹלַת חֹדֶשׁ
  choice: यह ... मासिक होमबलि है
  rationale: חֹדֶשׁ में ‘महीना’ और ‘नया चाँद’ दोनों अर्थ संभव हैं। मुख्य पाठ में आवर्ती मासिक अर्थ को सहज हिंदी में व्यक्त किया गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְּחָדְשׁוֹ לְחָדְשֵׁי הַשָּׁנָה
  choice: वर्ष के सभी महीनों में हर महीने चढ़ाई जाने वाली
  rationale: शाब्दिक ‘उसके महीने में, वर्ष के महीनों के लिए’ के आवर्ती-वितरणात्मक भाव को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: חֹדֶשׁ का अर्थ ‘महीना’ या ‘नया चाँद’
  choice: मुख्य पाठ में ‘मासिक’
  alternative: ‘नए चाँद की होमबलि’
  rationale: परवर्ती वाक्यांश पूरे वर्ष के महीनों में नियमित पुनरावृत्ति पर बल देता है, इसलिए मुख्य पाठ में मासिक भाव स्वाभाविक है; फिर भी संस्कार के नए चाँद से संबंध को पादटिप्पणी में स्पष्ट रखकर वास्तविक शब्दार्थगत द्व्यर्थता सुरक्षित की गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सार्वजनिक पाठ के योग्य शैली अपनाई गई है। प्राचीन माप ‘हीन’ सुरक्षित रखा गया है। ‘अर्घ’ और ‘होमबलि’ जैसे परिचित बाइबलीय पदों के साथ वाक्यरचना को साधारण पाठक के लिए स्पष्ट रखा गया है।
