  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘होमबलि’ और ‘भेंट’ जैसे परिचित बाइबलीय-धार्मिक शब्द रखे गए हैं। पद के इब्रानी वाक्यक्रम को ज्यों का त्यों न रखकर स्वाभाविक हिन्दी क्रम अपनाया गया है; सभी वैकल्पिक अर्थ पादटिप्पणियों में सुरक्षित हैं।
