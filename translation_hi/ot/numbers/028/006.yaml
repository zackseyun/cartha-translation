  yaml_path: translation/ot/numbers/028/006.yaml
  text: It is the regular burnt offering[a], made at Mount Sinai as a pleasing aroma[d][c][b], a food offering to Yahweh.
translation:
  language: hi
  text: यह नियमित होमबलि[a] है, जो सीनै पर्वत पर की गई थी[b]—याहवे के लिए अग्निबलि[d], मनभावनी सुगंध के लिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निरन्तर होमबलि।”
    reason: lexical_alternative
  - marker: b
    text: या, “जो सीनै पर्वत पर अर्पित की गई थी” अथवा “जो सीनै पर्वत पर ठहराई गई थी।” इब्रानी का शाब्दिक अर्थ “की गई” है; आशय वहाँ चढ़ाई गई बलि या वहाँ निर्धारित की गई बलि हो सकता है।
    reason: alternative_reading
  - marker: c
    text: या, “सुखदायक सुगंध के लिए” अथवा “मधुर सुगंध के लिए।”
    reason: lexical_alternative
  - marker: d
    text: या, “अग्नि में अर्पित भेंट।” परम्परागत अनुवाद “याहवे के लिए अग्निबलि” है; इब्रानी शब्द का सटीक व्युत्पत्तिगत अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלַת תָּמִיד
  choice: नियमित होमबलि
  rationale: ‘होमबलि’ उस बलि का प्रचलित और स्पष्ट हिन्दी नाम है जो पूरी तरह वेदी पर जलाई जाती थी; ‘नियमित’ प्रतिदिन दोहराए जाने वाले विधान को व्यक्त करता है।
- source_word: הָעֲשֻׂיָה
  choice: चढ़ाई गई थी
  rationale: निष्क्रिय कृदंत का मूल अर्थ ‘की गई’ है; बलि के प्रसंग में ‘चढ़ाई गई’ स्वाभाविक है और ‘स्थापित की गई’ जैसी व्याख्यात्मक निश्चितता से बचता है।
- source_word: בְּהַר סִינַי
  choice: सीनै पर्वत पर
  rationale: स्थानवाचक בְ और הַר סִינַי का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: एक मनभावनी सुगंध
  rationale: बलिदानी मुहावरे में ग्रहणयोग्यता और प्रसन्नता का भाव रखते हुए गंध की ठोस छवि भी सुरक्षित रहती है।
- source_word: אִשֶּׁה
  choice: अग्नि में अर्पित भेंट
  rationale: शब्द की व्युत्पत्ति अनिश्चित है, पर पुरोहितीय प्रयोग में अग्नि पर प्रस्तुत बलि का संकेत स्पष्ट है; यह अनुवाद पारंपरिक अर्थ को सहज हिन्दी में रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को लिप्यंतरित किया गया है और לְ की दिशा/समर्पण ‘के लिए’ से व्यक्त है।
theological_decisions:
- issue: הָעֲשֻׂיָה בְּהַר סִינַי का आशय
  choice: जो सीनै पर्वत पर चढ़ाई गई थी
  alternative: जो सीनै पर्वत पर ठहराई गई थी
  rationale: इब्रानी रूप शाब्दिक रूप से ‘की गई’ कहता है और चढ़ाए जाने अथवा वहाँ विधान ठहराए जाने—दोनों की संभावना पर चर्चा होती है। मुख्य पाठ निकटतर बलिदानी अर्थ रखता है और पादटिप्पणी वैकल्पिक संस्थापनार्थ बताती है।
- issue: רֵיחַ נִיחֹחַ का बलिदानी मुहावरा
  choice: एक मनभावनी सुगंध
  alternative: एक सुखदायक सुगंध
  rationale: ईश्वर द्वारा बलि की स्वीकृति का भाव व्यक्त होता है, पर प्रायश्चित्त की कोई अतिरिक्त यांत्रिक व्याख्या आरोपित नहीं की गई।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए वाचा-नाम को सामान्य उपाधि में बदलने के बजाय नाम के रूप में रखा गया है।
