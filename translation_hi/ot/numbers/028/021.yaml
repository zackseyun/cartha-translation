base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/021.yaml
  text: You shall prepare a tenth of an ephah for each lamb[b][a], for the seven lambs.
translation:
  language: hi
  text: सातों मेमनों में से प्रत्येक मेमने के लिए तुम एपा का दसवाँ भाग[a][b] तैयार करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “दसवाँ भाग, दसवाँ भाग ... एक मेमने के लिए, सात मेमनों के लिए।” पुनरावृत्ति का अर्थ है कि हर मेमने के लिए अलग से दसवाँ भाग हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रसंग के अनुसार आशय एपा के दसवें भाग से है, जो अनाज-भेंट की मानक मात्रा थी।
    reason: cultural_note
lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: एपा का दसवाँ भाग
  rationale: याजकीय बलिदान-संबंधी प्रसंग में עִשָּׂרוֹן अनाज-भेंट की मानक मात्रा है, अर्थात एपा का दसवाँ भाग। हिब्रू में शब्द की पुनरावृत्ति वितरण का भाव देती है, जिसे हिन्दी में ‘प्रत्येक’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: תַּעֲשֶׂה
  choice: तुम ... तैयार करना
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है; भेंट की निर्धारित मात्रा के संदर्भ में ‘तैयार करना’ स्वाभाविक है और ‘चढ़ाना’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: प्रत्येक मेमने के लिए
  rationale: एकवचन पदबंध, दोहराए गए עִשָּׂרוֹן के साथ, हर पशु के लिए अलग-अलग मात्रा निर्धारित करता है।
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: सातों मेमनों में से
  rationale: यह वाक्यांश निर्देश को बलिदान के लिए निर्धारित सभी सात मेमनों पर लागू करता है; ‘सातों’ सम्पूर्ण समूह को स्वाभाविक हिन्दी में व्यक्त करता है।
