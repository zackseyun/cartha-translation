source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם אִשֶּׁ֤ה עֹלָה֙ לַֽ/יהוָ֔ה פָּרִ֧ים בְּנֵי בָקָ֛ר שְׁנַ֖יִם וְ/אַ֣יִל אֶחָ֑ד וְ/שִׁבְעָ֤ה כְבָשִׂים֙ בְּנֵ֣י שָׁנָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/019.yaml
  text: 'And you shall present a food offering[a], a burnt offering to Yahweh: two bulls, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: hi
  text: 'और तुम याहवे के लिए अग्नि-अर्पण, अर्थात् होमबलि, चढ़ाओ: दो सांड, एक मेढ़ा और एक-एक वर्ष के सात नर मेमने। वे तुम्हारे लिए निष्कलंक हों।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: और तुम ... चढ़ाना
  rationale: हिफ़ील रूप बलिदानी संदर्भ में किसी अर्पण को वेदी पर प्रस्तुत या अर्पित करने का निर्देश देता है। विधिक निर्देशों की इस शृंखला में हिंदी का ‘चढ़ाना’ स्वाभाविक और याजकीय अर्थ में स्पष्ट है।
- source_word: אִשֶּׁה
  choice: अग्नि में चढ़ाया जाने वाला अर्पण
  rationale: यह आग के द्वारा वेदी पर चढ़ाए जाने वाले अर्पण के लिए तकनीकी बलिदानी शब्द है। ‘भोजन-अर्पण’ संभावित अर्थ-संबंध को सामने लाता, पर हिंदी में भ्रामक हो सकता है; इसलिए अग्नि-संबंधी अर्थ को मुख्य पाठ में रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस अर्पण का प्रचलित हिंदी बाइबलीय नाम है जो वेदी पर पूर्णतः जलाया जाता था। ‘अर्थात्’ से स्पष्ट होता है कि यहाँ אִשֶּׁה के अंतर्गत विशेष अर्पण-प्रकार बताया गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण का लक्ष्य बताता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: दो बैल
  rationale: यह पदबंध गोवंश के दो नर पशुओं को बताता है। हिंदी में ‘दो बैल’ पर्याप्त, स्पष्ट और अनावश्यक शाब्दिक विस्तार से मुक्त है।
- source_word: וְאַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל का बलिदानी सूचियों में सामान्य अर्थ वयस्क नर भेड़, अर्थात् ‘मेढ़ा’, है।
- source_word: וְשִׁבְעָה כְבָשִׂים בְּנֵי שָׁנָה
  choice: एक-एक वर्ष के सात नर मेमने
  rationale: כְבָשִׂים नर मेमनों को और בְּנֵי שָׁנָה प्रत्येक के एक वर्ष की आयु का होने को दर्शाता है। ‘एक-एक वर्ष के’ सामूहिक सूची में आयु को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: वे तुम्हारे लिए निर्दोष हों
  rationale: बलिदानी संदर्भ में תְּמִימִם शारीरिक दोष से रहित होने की अपेक्षा बताता है। לָכֶם को छोड़े बिना ‘तुम्हारे लिए’ के रूप में रखा गया है, यद्यपि हिंदी में यह कुछ औपचारिक सुनाई देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी वाचा-नाम है, कोई उपाधि नहीं। आधुनिक हिंदी पाठकों में पहचाने जाने वाले नामरूप ‘यहोवा’ को रखा गया है; ‘याहवे’ अधिक प्रत्यक्ष ध्वन्यात्मक विकल्प है, पर हिंदी बाइबलीय व्यवहार में कम व्यापक है।
- issue: אִשֶּׁה और עֹלָה का संबंध
  choice: ‘अग्नि में चढ़ाया जाने वाला अर्पण, अर्थात् होमबलि’
  alternative: ‘भोजन-अर्पण, एक होमबलि’
  rationale: मूल में दोनों बलिदानी पद साथ हैं। चुना गया रूप दूसरे पद को यहाँ अर्पण के विशिष्ट प्रकार के रूप में स्पष्ट करता है, जबकि पादटिप्पणी तकनीकी शब्द की वैकल्पिक समझ सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-याजकीय है। ‘होमबलि’, ‘मेढ़ा’ और ‘निर्दोष’ जैसे परिचित बलिदानी शब्द रखे गए हैं। वाक्य-विन्यास को हिंदी में पठनीय बनाने के लिए सूची के बाद नया वाक्य आरंभ किया गया है।
