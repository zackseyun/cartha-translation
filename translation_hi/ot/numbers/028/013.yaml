source:
  edition: WLC
  text: וְ/עִשָּׂרֹ֣ן עִשָּׂר֗וֹן סֹ֤לֶת מִנְחָה֙ בְּלוּלָ֣ה בַ/שֶּׁ֔מֶן לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד עֹלָה֙ רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/013.yaml
  text: and a tenth of an ephah of fine flour as a grain offering mixed with oil for each lamb[a], as a burnt offering, a pleasing aroma, a food offering to Yahweh.
translation:
  language: hi
  text: और हर मेमने के लिए तेल में मिला हुआ मैदे की एपा का दसवाँ भाग अन्नबलि चढ़ाना। यह यहोवा के लिए सुखद सुगंध वाली अग्नि-भेंट, एक होमबलि है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעִשָּׂרֹן עִשָּׂרוֹן
  choice: एपा का दसवाँ भाग
  rationale: दोहराया हुआ इब्रानी प्रयोग वितरण का भाव देता है और बलिदान-संबंधी प्रसंग में एपा के दसवें भाग को सूचित करता है; माप की इकाई स्पष्ट करना हिन्दी पाठक के लिए आवश्यक है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलिदान में प्रयुक्त बारीक, परिष्कृत आटे का मानक शब्द है; आधुनिक हिन्दी में ‘मैदा’ स्वाभाविक और स्पष्ट है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: इस उपासना-संबंधी प्रसंग में यह सामान्य भेंट नहीं, अनाज से तैयार की जाने वाली विशिष्ट बलि है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: पदबंध मैदे को तेल के साथ मिलाए जाने का वर्णन करता है; यह सरल और वर्तमान हिन्दी है।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: हर मेमने के साथ
  rationale: प्रसंग में मात्रा प्रत्येक अलग-अलग मेमने के लिए निर्धारित है; ‘हर’ वितरण का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह पूरी तरह वेदी पर जलाए जाने वाले बलिदान का पारंपरिक और सटीक हिन्दी पद है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखद सुगंध
  rationale: स्थिर बलिदानी अभिव्यक्ति भेंट की स्वीकार्यता बताती है; यह अनुवाद मूल रूपक को बनाए रखते हुए स्वाभाविक है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: शब्द अग्नि पर चढ़ाई जाने वाली भेंट को सूचित करता है। इसकी व्युत्पत्ति और ‘भोजन-भेंट’ वाला प्रासंगिक अर्थ विवादित होने के कारण विकल्प पादटिप्पणी में रखा गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है; ‘यहोवा’ आधुनिक हिन्दी में उसका प्रचलित सीधा रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं बल्कि चार अक्षरों वाला वाचा-नाम है; नाम को प्रत्यक्ष रूप में रखना स्रोत का भेद सुरक्षित रखता है।
- issue: बलिदानी पद אִשֶּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: अग्नि से चढ़ाई गई भेंट का अर्थ स्रोत से निकट है, पर कुछ संदर्भों और शब्द-संबंधों के आधार पर ‘भोजन-भेंट’ भी संभव है; इस वास्तविक अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רֵיחַ נִיחֹחַ में मानवरूपी भाषा
  choice: सुखद सुगंध
  alternative: स्वीकार्य भेंट
  rationale: मूल की ठोस बलिदानी उपमा को अमूर्त व्याख्या से बदलने के बजाय उसी तनाव और बिंब को बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद मूलतः पिछली आज्ञा से जुड़ी संज्ञात्मक सूची है; स्वतंत्र हिन्दी वाक्य के रूप में स्पष्टता के लिए प्रसंग से ‘चढ़ाना’ और ‘होगी’ की पूर्ति की गई है। तकनीकी बलिदानी पदों ‘अन्नबलि’ और ‘होमबलि’ को निरंतरता के लिए बनाए रखा गया है।
