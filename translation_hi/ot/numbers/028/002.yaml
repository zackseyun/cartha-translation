language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אֶת קָרְבָּנִ֨/י לַחְמִ֜/י לְ/אִשַּׁ֗/י רֵ֚יחַ נִֽיחֹחִ֔/י תִּשְׁמְר֕וּ לְ/הַקְרִ֥יב לִ֖/י בְּ/מוֹעֲדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/002.yaml
  text: Command the sons of Israel[a], and say to them, ‘My offering, my food for my food offerings, my pleasing aroma[c][b], you shall be careful to present to me at its appointed time.’
translation:
  language: hi
  text: इस्राएलियों को आज्ञा दे और उनसे कह, ‘तुम इस बात का ध्यान रखना कि मेरा चढ़ावा—मेरी अग्नि-बलियों के लिए मेरा भोजन, मेरी सुखद सुगंध[a]—मेरे लिए उसके नियत समय पर चढ़ाओ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सुखद सुगंध” बलिदान के लिए प्रयुक्त एक रूढ़ अभिव्यक्ति है, जो बताती है कि वह परमेश्वर को स्वीकार्य है।
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: आज्ञा दे
  rationale: यह तीव्र आदेशसूचक क्रिया है; ‘आज्ञा दे’ उसके बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्रों’ है, पर यहाँ पूरी वाचा-समुदाय के लिए प्रचलित जातिनाम है; ‘इस्राएलियों’ आधुनिक हिन्दी में समावेशी और स्वाभाविक है।
- source_word: קָרְבָּנִי
  choice: मेरा चढ़ावा
  rationale: קָרְבָּן परमेश्वर के निकट लाया जाने वाला चढ़ावा है; ‘चढ़ावा’ बलिदानी संदर्भ में स्पष्ट और सामान्य हिन्दी है।
- source_word: לַחְמִי
  choice: मेरा भोजन
  rationale: मूल अर्थ ‘मेरी रोटी’ है, किंतु बलिदानी प्रसंग में यह व्यापक रूप से वेदी पर अर्पित भोजन को सूचित करता है।
- source_word: לְאִשַּׁי
  choice: मेरे अग्नि-बलियों के लिए
  rationale: אִשֶּׁה वेदी पर आग में अर्पित बलि को दर्शाता है; ‘अग्नि-बलि’ आग से संबंधित बलिदानी अर्थ को स्पष्ट रखता है।
- source_word: רֵיחַ נִיחֹחִי
  choice: मेरी सुखद सुगंध
  rationale: यह स्वीकृत बलि के लिए रूढ़ बलिदानी अभिव्यक्ति है; मूर्त भाषा को अमूर्त व्याख्या में नहीं बदला गया।
- source_word: תִּשְׁמְרוּ לְהַקְרִיב
  choice: इस बात का ध्यान रखना कि ... चढ़ाओ
  rationale: שׁמר के साथ infinitive सावधानीपूर्वक पालन का भाव देता है; यह हिन्दी संरचना उसी व्यावहारिक बल को व्यक्त करती है।
- source_word: בְּמוֹעֲדוֹ
  choice: उसके नियत समय पर
  rationale: प्रत्यय चढ़ावे की ओर संकेत करता है और מוֹעֵד यहाँ निर्धारित समय को सूचित करता है।
theological_decisions:
- issue: परमेश्वर के ‘भोजन’ और ‘सुखद सुगंध’ की मानवरूपी बलिदानी भाषा
  choice: ठोस बलिदानी भाषा को मुख्य पाठ में बनाए रखा
  alternative: ‘मुझे स्वीकार्य चढ़ावा’ जैसी व्याख्यात्मक अमूर्त अभिव्यक्ति
  rationale: इब्रानी पाठ जानबूझकर ठोस उपासना-संबंधी भाषा प्रयोग करता है। इसे बनाए रखने से यह संकेत नहीं देना पड़ता कि परमेश्वर को शारीरिक पोषण चाहिए, और पाठ का अपना रूप भी सुरक्षित रहता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक संदर्भ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद पूरे इस्राएली समुदाय को संबोधित करता है। जातिनाम ‘इस्राएलियों’ आधुनिक हिन्दी में अर्थ को सही और सहज रूप से देता है, जबकि शाब्दिक विकल्प केवल पुरुष सदस्यों का भ्रम उत्पन्न कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध शैली। एकवचन ‘दे/कह’ मूसा को संबोधन है और बहुवचन ‘तुम’ इस्राएली समुदाय को। डैश समानाधिकरण वाले बलिदानी पदबंधों को स्पष्ट करता है।
