  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד לְ/כַפֵּ֖ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/022.yaml
  text: and one male goat for a sin offering[a], to make atonement for you.
translation:
  language: hi
  text: और तुम्हारे लिए प्रायश्चित करने के लिए पापबलि के रूप में एक बकरा भी चढ़ाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: और ... एक बकरा भी
  rationale: שָׂעִיר नर बकरे को दर्शाता है; हिन्दी में ‘बकरा’ स्वयं नर पशु का स्पष्ट और स्वाभाविक नाम है। prefixed ו को ‘और’ से व्यक्त किया गया है, और वाक्य के प्रवाह के लिए ‘भी’ जोड़ा गया है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: याजकीय बलिदान-संदर्भ में חַטָּאת अमूर्त ‘पाप’ नहीं, बल्कि पाप से संबंधित बलि को दर्शाता है। ‘पापबलि’ प्रचलित, संक्षिप्त और स्पष्ट हिन्दी पद है; ‘शुद्धिकरण-बलि’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: אֶחָד
  choice: एक
  rationale: मूल पाठ में बलि के पशु की संख्या स्पष्ट रूप से एक है, इसलिए इसे बनाए रखा गया है।
- source_word: לְ/כַפֵּר
  choice: ताकि ... प्रायश्चित किया जाए
  rationale: याजकीय संदर्भ में כפר प्रायश्चित करने की विधिक-धार्मिक क्रिया व्यक्त करता है। यह रूप उसके धर्मवैज्ञानिक भार को बनाए रखता है, पर उसकी क्रियाविधि के बारे में पाठ से अधिक निश्चितता नहीं जोड़ता।
- source_word: עֲלֵי/כֶם
  choice: तुम्हारे लिए
  rationale: यहाँ עַל तथा बहुवचन प्रत्यय समुदाय की ओर से अथवा उसके हित में किए जाने वाले प्रायश्चित को दर्शाते हैं। ‘तुम्हारे लिए’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: बलिदान-संदर्भ में כפר का अनुवाद
  choice: तुम्हारे लिए प्रायश्चित किया जाए
  alternative: तुम्हारी ओर से प्रायश्चित किया जाए / तुम्हारे पाप ढाँपे जाएँ
  rationale: ‘प्रायश्चित’ इब्रानी याजकीय भाषा का व्यापक धर्मवैज्ञानिक आशय बनाए रखता है और यह निर्धारित नहीं करता कि उसका तंत्र केवल दंड-निवारण, शुद्धिकरण या किसी एक व्याख्यात्मक सिद्धांत तक सीमित है। कर्मवाच्य हिन्दी विधान के रूप में स्वाभाविक है और अनुष्ठान कराने वाले व्यक्ति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ हिन्दी बाइबलीय प्रयोग में समझने योग्य मानक पद है, जबकि मूल पद की सम्भव शुद्धिकरण-संबंधी सूक्ष्मता को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और विधि-संबंधी रजिस्टर अपनाया गया है। ‘चढ़ाना’ प्रसंग से निहित बलिदानी क्रिया को हिन्दी में स्पष्ट करता है; इससे मूल आदेश-सूची का स्वाभाविक प्रवाह बना रहता है।
