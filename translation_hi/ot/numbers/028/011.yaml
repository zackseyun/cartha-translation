source:
  edition: WLC
  text: וּ/בְ/רָאשֵׁי֙ חָדְשֵׁי/כֶ֔ם תַּקְרִ֥יבוּ עֹלָ֖ה לַ/יהוָ֑ה פָּרִ֨ים בְּנֵֽי בָקָ֤ר שְׁנַ֨יִם֙ וְ/אַ֣יִל אֶחָ֔ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/011.yaml
  text: 'At the beginnings of your months[a], you shall present a burnt offering to Yahweh: two bulls from the herd, one ram, and seven male lambs a year old, without blemish.'
translation:
  language: hi
  text: 'तुम्हारे महीनों के आरम्भ में[a] तुम यहोवा के लिए होमबलि चढ़ाओ: झुंड में से दो बैल, एक मेढ़ा और एक वर्ष के सात दोषरहित नर मेमने।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “तुम्हारे महीनों के आरम्भों में”; अर्थात् नए चाँद के अवसरों पर।'
    reason: इब्रानी मुहावरे की शाब्दिक बनावट और उसके अनुष्ठानिक आशय, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: וּבְרָאשֵׁי חָדְשֵׁיכֶם
  choice: तुम्हारे महीनों के आरम्भ में
  rationale: इब्रानी वाक्यांश का शाब्दिक अर्थ ‘तुम्हारे महीनों के आरम्भों में’ है और इससे प्रत्येक महीने के आरम्भ, अर्थात् नए चाँद के अवसर, का बोध होता है। स्वाभाविक हिन्दी के लिए ‘आरम्भ’ को एकवचन में रखा गया है।
- source_word: תַּקְרִיבוּ
  choice: तुम ... चढ़ाना
  rationale: हिफ़ील रूप बलिदान-संदर्भ में किसी भेंट को परमेश्वर के सामने प्रस्तुत या अर्पित करने को दर्शाता है। आज्ञार्थक ‘चढ़ाना’ हिन्दी में स्वाभाविक और यज्ञ-संदर्भ में स्पष्ट है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलिदान की स्थापित हिन्दी संज्ञा है जो वेदी पर पूर्णतः जलाया जाता था।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण या दिशा प्रकट करता है। יהוה को उसके वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: פָּרִים בְּנֵי בָקָר שְׁנַיִם
  choice: झुंड में से दो बैल
  rationale: यह पदबंध गोवंश के झुंड से दो बैलों को निर्दिष्ट करता है; इब्रानी पाठ यहाँ उनकी आयु को स्पष्टतः ‘जवान’ नहीं कहता।
- source_word: וְאַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: बलिदान में प्रयुक्त नर भेड़ के लिए सीधा और प्रचलित हिन्दी शब्द।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: एक वर्ष के सात नर मेमने
  rationale: כְּבָשִׂים नर मेमनों को और ‘एक वर्ष के पुत्र’ लगभग एक वर्ष की आयु या पहले वर्ष में होने को सूचित करता है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदान-संदर्भ में इसका अर्थ किसी शारीरिक दोष या खोट से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रचलित धार्मिक हिन्दी है।
theological_decisions:
- issue: मासिक अवसर को व्यक्त करने वाला कालवाचक वाक्यांश
  choice: तुम्हारे महीनों के आरम्भ में
  alternative: तुम्हारे नए चाँदों के अवसर पर / हर महीने के आरम्भ में
  rationale: मुख्य पाठ इब्रानी संरचना को निकटता से रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि आशय नए चाँद पर होने वाले मासिक अनुष्ठान से है।
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से इसे सामान्य उपाधि ‘प्रभु’ में बदलने से बचाया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। बलिदान-संबंधी स्थापित शब्द ‘होमबलि’ रखा गया है; आदेश के लिए स्वाभाविक हिन्दी ‘चढ़ाना’ प्रयुक्त है।
