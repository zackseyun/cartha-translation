  text: In addition to the regular morning burnt offering, you shall offer these.
translation:
  language: hi
  text: नियमित प्रातःकालीन होमबलि के अतिरिक्त, तुम इन्हें चढ़ाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह पद बताता है कि पर्व के ये बलिदान नियमित बलिदान के साथ अतिरिक्त रूप से चढ़ाए जाने हैं।
- source_word: עֹלַת הַבֹּקֶר אֲשֶׁר לְעֹלַת הַתָּמִיד
  choice: नियमित सुबह के होमबलि
  rationale: सम्बन्धवाचक वाक्यांश सुबह के होमबलि को नित्य चढ़ाए जाने वाले नियमित बलिदान के रूप में पहचानता है; यह एक बलिदान को दूसरे के लिए चढ़ाने की बात नहीं करता।
- source_word: תַּעֲשׂוּ
  choice: चढ़ाना
  rationale: बलिदान सम्बन्धी निर्देश में ‘करना/बनाना’ की अपेक्षा ‘चढ़ाना’ स्वाभाविक और प्रसंगानुकूल हिन्दी है; आज्ञार्थक रूप इब्रानी निर्देश की शक्ति बनाए रखता है।
- source_word: אֶת אֵלֶּה
  choice: इन्हें भी
  rationale: संकेतवाचक शब्द पहले बताए गए बलिदानों की ओर संकेत करता है। ‘भी’ अतिरिक्तता को स्वाभाविक हिन्दी में स्पष्ट करता है।
