  text: וּ/בַ/חֲמִשָּׁ֨ה עָשָׂ֥ר י֛וֹם לַ/חֹ֥דֶשׁ הַ/זֶּ֖ה חָ֑ג שִׁבְעַ֣ת יָמִ֔ים מַצּ֖וֹת יֵאָכֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/017.yaml
  text: And on the fifteenth day of this month is a feast[a]; for seven days unleavened bread shall be eaten.
translation:
  language: hi
  text: और इस महीने के पंद्रहवें दिन पर्व[a] होगा; सात दिन तक बिना खमीर की रोटी खाई जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उत्सव’ अथवा ‘पर्वीय भोज’। इब्रानी शब्द חָג पवित्र पर्व के आयोजन के साथ-साथ पर्वीय भोज का भी बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם
  choice: और ... पंद्रहवें दिन
  rationale: संयोजक और पूर्वसर्ग मिलकर समय-सूचक वाक्यांश बनाते हैं। हिन्दी में क्रमवाचक रूप ‘पंद्रहवें दिन’ स्वाभाविक है।
- source_word: לַחֹדֶשׁ הַזֶּה
  choice: इस महीने के
  rationale: इस पंचांग-संबंधी प्रसंग में חֹדֶשׁ का सामान्य अर्थ ‘महीना’ है।
- source_word: חָג
  choice: पर्व
  rationale: חָג किसी पवित्र उत्सव या पर्वीय भोज को सूचित कर सकता है। ‘पर्व’ आधुनिक हिन्दी में धार्मिक आयोजन का अर्थ स्पष्ट और संक्षिप्त रूप से देता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह पद अवधि बताता है; ‘तक’ हिन्दी में सात दिनों की पूरी अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַצּוֹת
  choice: बिना खमीर की रोटी
  rationale: यह पारदर्शी हिन्दी अभिव्यक्ति है और मַצּוֹת के अखमीरी होने का अर्थ सामान्य पाठक के लिए तुरंत स्पष्ट करती है।
- source_word: יֵאָכֵל
  choice: खाई जाए
  rationale: निफ़अल अपूर्ण रूप का कर्मवाच्य भाव बनाए रखते हुए यह रूप विधि या निर्देश को व्यक्त करता है, पर उसकी सामर्थ्य को अनावश्यक रूप से नहीं बढ़ाता।
theological_decisions:
- issue: חָג का अर्थ-क्षेत्र
  choice: मुख्य पाठ में ‘पर्व’
  alternative: ‘उत्सव’ या ‘पर्वीय भोज’
  rationale: यहाँ धार्मिक कैलेंडर का प्रसंग है। ‘पर्व’ पवित्र उत्सव के भाव को सुरक्षित रखता है, जबकि पादटिप्पणी भोज-संबंधी अर्थ की वास्तविक संभावना भी बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘बिना खमीर की रोटी’ सामान्य पाठकों के लिए ‘अखमीरी रोटी’ से अधिक पारदर्शी है; कर्मवाच्य ‘खाई जाए’ मूल निर्देशात्मक रूप को बनाए रखता है।
