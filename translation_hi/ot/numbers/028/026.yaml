  text: וּ/בְ/י֣וֹם הַ/בִּכּוּרִ֗ים בְּ/הַקְרִ֨יבְ/כֶ֜ם מִנְחָ֤ה חֲדָשָׁה֙ לַֽ/יהוָ֔ה בְּ/שָׁבֻעֹ֖תֵי/כֶ֑ם מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֥א תַעֲשֽׂוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/026.yaml
  text: And on the day of the firstfruits[a], when you present a new grain offering to Yahweh at your Feast of Weeks, you shall have a holy convocation[b]. You shall do no ordinary work.
translation:
  language: hi
  text: “पहली उपज के दिन, तुम्हारे सप्ताहों के पर्व में, जब तुम याहवे को नई अन्न-भेंट चढ़ाओ, तब तुम्हारे लिए पवित्र सभा[a] हो। तुम रोज़मर्रा का कोई काम[b] न करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र बुलाई हुई सभा।” हिब्रू पद उपासना के लिए विधिवत बुलाई गई पवित्र सभा का पारिभाषिक नाम है।
    reason: lexical_alternative
  - marker: b
    text: या “परिश्रम का कोई काम” अथवा “जीविका का कोई काम।” हिब्रू पदबंध दैनिक जीवन से जुड़े सामान्य श्रम को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבִּכּוּרִים
  choice: पहली उपज
  rationale: यह शब्द फसल की सबसे पहली उपज को दर्शाता है, जो इस पर्व और भेंट से जुड़ी थी। यह आधुनिक हिन्दी में स्पष्ट है और कृषि-संबंधी अर्थ बनाए रखता है।
- source_word: בְּהַקְרִיבְכֶם
  choice: जब तुम ... चढ़ाओ
  rationale: बलिदान-संबंधी प्रसंग में קרב का अर्थ किसी भेंट को परमेश्वर के सामने अर्पित करना है। ‘चढ़ाओ’ हिन्दी में स्वाभाविक धार्मिक भाषा है।
- source_word: מִנְחָה חֲדָשָׁה
  choice: नया अन्नबलि
  rationale: याजकीय प्रसंग में מִנְחָה विशेष रूप से अन्न से चढ़ाई जाने वाली भेंट है; ‘नया’ नई फसल से संबंधित भेंट को सूचित करता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּשָׁבֻעֹתֵיכֶם
  choice: तुम्हारे सप्ताहों के पर्व में
  rationale: यह केवल कई सप्ताहों का उल्लेख नहीं, बल्कि ‘सप्ताहों का पर्व’ नामक निश्चित पर्व का संकेत है। संबंधवाचक बहुवचन ‘तुम्हारे’ भी बनाए रखा गया है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: पवित्र सभा
  rationale: यह उपासना के लिए विधिवत बुलाई गई पवित्र सामुदायिक सभा का पारिभाषिक पद है। ‘पवित्र सभा’ सहज हिन्दी में इसका मुख्य आशय देता है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारी एक ... हो
  rationale: हिब्रू के अस्तित्वसूचक היה + ל प्रयोग को स्वाभाविक हिन्दी में प्रस्तुत करते हुए विधिक निर्देश का बल बनाए रखा गया है।
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: रोज़मर्रा का कोई काम
  rationale: यह पर्व के दिन निषिद्ध सामान्य जीविका या नियमित श्रम को दर्शाता है, न कि हर प्रकार की गतिविधि को।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: दूसरे पुरुष बहुवचन के सीधे निषेध को हिन्दी की स्वाभाविक विधिक शैली में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है।
- issue: מִקְרָא קֹדֶשׁ की सामुदायिक प्रकृति
  choice: पवित्र सभा
  alternative: पवित्र बुलावा
  rationale: यह पद केवल किसी दिन के पवित्र होने की बात नहीं करता, बल्कि उपासना के लिए बुलाई गई सभा को सूचित करता है। मुख्य पाठ में सहज अर्थ रखा गया है और तकनीकी पहलू पादटिप्पणी में स्पष्ट किया गया है।
- issue: पर्व के दिन काम का निषेध
  choice: रोज़मर्रा का कोई काम
  alternative: परिश्रम का कोई काम; जीविका का कोई काम
  rationale: मूल पदबंध सामान्य या व्यवसाय-संबंधी श्रम को निषिद्ध करता है। इसे ‘कोई भी काम’ कहना निषेध को मूल से अधिक व्यापक बना सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज रखी गई है। ‘अर्थात्’ द्वारा ‘पहली उपज के दिन’ और ‘सप्ताहों के पर्व’ के निकट संबंध को स्पष्ट किया गया है, पर दोनों को पूर्णतः समान ठहराने से बचा गया है। ‘अन्नबलि’ संक्षिप्त पारिभाषिक शब्द है; पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबंधित पदों के तुरंत बाद दिए गए हैं।
