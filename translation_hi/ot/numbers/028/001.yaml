  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ नाम को सुरक्षित रखता है; पाठक-सहायता के लिए हिब्रू रूप पादटिप्पणी में दिया गया है।
