- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह पिएल क्रिया हिब्रू कथन-सूत्र में वाणी व्यक्त करती है। अगले पद में प्रत्यक्ष वचन आरम्भ होने के कारण आधुनिक हिन्दी में ‘कहा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: हिन्दी में ‘किसी से कहना’ स्वाभाविक वाक्य-विन्यास है; इसलिए אֶל का कार्य ‘से’ द्वारा व्यक्त होता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह infinitive construct आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘कहा’ ही यह कार्य करता है; ‘यह कहते हुए कहा’ अनावश्यक पुनरुक्ति होगी।
theological_decisions:
