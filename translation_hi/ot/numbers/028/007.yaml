  text: וְ/נִסְכּ/וֹ֙ רְבִיעִ֣ת הַ/הִ֔ין לַ/כֶּ֖בֶשׂ הָ/אֶחָ֑ד בַּ/קֹּ֗דֶשׁ הַסֵּ֛ךְ נֶ֥סֶךְ שֵׁכָ֖ר לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/007.yaml
  text: And its drink offering shall be a quarter of a hin for each lamb[c][b][a]. In the holy place you shall pour out a drink offering of strong drink to Yahweh.
translation:
  language: hi
  text: उसकी पेय-भेंट हर मेमने के लिए[a] एक हीन का चौथाई भाग हो। पवित्र स्थान में[b] याहवे के लिए मादक पेय[c] की भेंट उंडेलो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘एक मेमने के लिए’; शाब्दिक अर्थ, ‘उस एक मेमने के लिए’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘पवित्रस्थान में।’
    reason: lexical_alternative
  - marker: c
    text: ‘मादक पेय’ से आशय शराब के अतिरिक्त किसी नशीले पेय से है; यहाँ उसका ठीक प्रकार नहीं बताया गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְנִסְכּוֹ
  choice: उसकी पेय-भेंट
  rationale: प्रत्यय को ‘उसकी’ से व्यक्त किया गया है और बलि के साथ चढ़ाए जाने वाले तरल अर्पण के लिए सरल, स्पष्ट ‘पेय-भेंट’ चुना गया है।
- source_word: רְבִיעִת הַהִין
  choice: एक हीन का चौथाई भाग
  rationale: मूल प्राचीन माप ‘हीन’ को बिना आधुनिक इकाई में बदले सुरक्षित रखा गया है और उसकी मात्रा ठीक-ठीक व्यक्त की गई है।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: हर मेमने के लिए
  rationale: शाब्दिक रूप ‘उस एक मेमने के लिए’ है, पर प्रसंग में मात्रा प्रत्येक मेमने के हिसाब से बताई गई है; इसलिए वितरणात्मक अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्र स्थान में
  rationale: बलिदान-संबंधी प्रसंग में यह किसी पवित्र स्थान या पवित्र परिसर को सूचित करता है; ‘पवित्रता में’ जैसा अमूर्त अर्थ यहाँ कम संभावित है।
- source_word: הַסֵּךְ
  choice: उंडेलना
  rationale: यह तरल भेंट को विधिपूर्वक उंडेलने की आज्ञा है; हिन्दी निर्देशात्मक शैली में ‘तुम ... उंडेलना’ मूल आज्ञार्थक बल को बनाए रखता है।
- source_word: נֶסֶךְ
  choice: पेय-भेंट
  rationale: मूल में संज्ञा की पुनरावृत्ति है, इसलिए उसे हटाने के बजाय हिन्दी में भी स्पष्ट रखा गया है।
- source_word: שֵׁכָר
  choice: मादक पेय
  rationale: यह किसी नशीले अथवा किण्वित पेय को दर्शाता है, पर उसका ठीक प्रकार नहीं बताता; ‘मादक पेय’ अनावश्यक रूप से किसी खास पेय का निर्धारण नहीं करता।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में ‘याहवे’ लिप्यंतरित किया गया है और לְ को भेंट के प्राप्तकर्ता के अर्थ में ‘के लिए’ व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: שֵׁכָר का स्वरूप
  choice: मादक पेय
  alternative: मदिरा; किण्वित पेय
  rationale: मूल शब्द पेय के मादक स्वरूप को बताता है, पर उसका सटीक प्रकार निश्चित नहीं करता। इसलिए पाठ में व्यापक शब्द और टिप्पणी में आवश्यक स्पष्टीकरण दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पेय-भेंट’ साधारण पाठक के लिए ‘अर्घ’ की तुलना में अधिक पारदर्शी है। प्राचीन माप ‘हीन’ को ज्यों का त्यों रखा गया है। आज्ञा को हिन्दी की स्वाभाविक विधिपरक शैली में प्रस्तुत किया गया है।
