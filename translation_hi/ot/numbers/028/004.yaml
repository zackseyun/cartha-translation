source:
  edition: WLC
  text: אֶת הַ/כֶּ֥בֶשׂ אֶחָ֖ד תַּעֲשֶׂ֣ה בַ/בֹּ֑קֶר וְ/אֵת֙ הַ/כֶּ֣בֶשׂ הַ/שֵּׁנִ֔י תַּעֲשֶׂ֖ה בֵּ֥ין הָֽ/עַרְבָּֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/004.yaml
  text: You shall offer one lamb in the morning[a], and the second lamb you shall offer between the evenings.
translation:
  language: hi
  text: एक मेमना सुबह चढ़ाना, और दूसरा मेमना दोनों साँझों के बीच[a] चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दोनों साँझों के बीच’; यह गोधूलि के आसपास या दोपहर ढलने के बाद के समय के लिए प्रयुक्त एक पारंपरिक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: הַכֶּבֶשׂ
  choice: मेमना
  rationale: बलिदान के प्रसंग में כֶּבֶשׂ भेड़ के बच्चे को दर्शाता है; ‘मेमना’ आधुनिक हिन्दी में स्वाभाविक और सटीक है। इस पद में नर होने की बात अलग से स्पष्ट नहीं की गई है।
- source_word: אֶחָד
  choice: एक
  rationale: इब्रानी में सामान्य गणनावाचक ‘एक’ है, ‘पहला’ नहीं; इसलिए मूल की शब्दावली सुरक्षित रखी गई है।
- source_word: תַּעֲשֶׂה
  choice: चढ़ाना
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी निर्देश में इसका आशय बलि अर्पित करना है। हिन्दी में ‘चढ़ाना’ इस धार्मिक क्रिया को सहज रूप से व्यक्त करता है।
- source_word: בַבֹּקֶר
  choice: सुबह
  rationale: בֹּקֶר का अर्थ ‘सुबह’ है; हिन्दी में बिना अतिरिक्त परसर्ग के यह समय-सूचक प्रयोग स्वाभाविक है।
- source_word: הַשֵּׁנִי
  choice: दूसरा
  rationale: שֵׁנִי क्रमवाचक ‘दूसरा’ है और पहले बताए गए मेमने के बाद की क्रमबद्धता बनाए रखता है।
- source_word: בֵּין הָעַרְבָּיִם
  choice: दोनों साँझों के बीच
  rationale: यह इब्रानी पदबंध का निकट, औपचारिक अनुवाद है। समय की इसकी सटीक सीमा पर मतभेद होने के कारण मुख्य पाठ में इसकी अस्पष्टता बनाए रखी गई और पादटिप्पणी में सामान्य समय-संदर्भ बताया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और निर्देशात्मक रखी गई है। ‘चढ़ाना’ बलिदान के प्रसंग में साधारण हिन्दी पाठकों के लिए ‘अर्पित करना’ से अधिक सहज है। विवादित समय-सूचक पदबंध को मुख्य पाठ में औपचारिक रूप से सुरक्षित रखा गया है।
