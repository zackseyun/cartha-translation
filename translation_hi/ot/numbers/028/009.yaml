  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הַ/שַּׁבָּ֔ת שְׁנֵֽי כְבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה תְּמִימִ֑ם וּ/שְׁנֵ֣י עֶשְׂרֹנִ֗ים סֹ֧לֶת מִנְחָ֛ה בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן וְ/נִסְכּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/028/009.yaml
  text: 'And on the Sabbath day: two male lambs a year old[a], without blemish, and two-tenths of an ephah of fine flour as a grain offering, mixed with oil[b], and its drink offering.'
translation:
  language: hi
  text: 'और सब्त के दिन: एक वर्ष के दो निर्दोष नर मेमने, अन्नबलि के लिए तेल में मिला हुआ एपा का दो-दशांश बारीक आटा[a], और उसका पेय-बलि[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘दो दशांश’ है; बलिदान-विधि में इसका अर्थ एपा के दो दशांश है।
    reason: cultural_note
  - marker: b
    text: अथवा ‘उसका अर्घ’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הַשַּׁבָּת
  choice: और सब्त के दिन
  rationale: संयोजक וּ को ‘और’ से रखा गया है, ताकि पिछले बलिदान-विधानों से इसका संबंध बना रहे; ‘सब्त के दिन’ आधुनिक हिन्दी में स्वाभाविक काल-सूचक पदबंध है।
- source_word: שְׁנֵי כְבָשִׂים בְּנֵי שָׁנָה
  choice: एक वर्ष के दो नर मेम्ने
  rationale: כְבָשִׂים यहाँ बलिदान के लिए नर मेमनों को सूचित करता है, और בְּנֵי שָׁנָה उनकी आयु लगभग एक वर्ष बताता है।
- source_word: תְמִימִם
  choice: निर्दोष
  rationale: बलिदान-संबंधी प्रसंग में इसका अर्थ शारीरिक दोष या दाग से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रचलित धार्मिक हिन्दी है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: दो-दशांश एपा
  rationale: मूल में माप की इकाई ‘दो दशांश’ है; बलिदान-विधि में यह एपा के दो दशांश समझी जाती है। ‘एपा’ को स्पष्टता के लिए पाठ में रखा गया है और सांस्कृतिक विवरण पाद-टिप्पणी में दिया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलिदानों में प्रयुक्त बारीक पिसे हुए उत्तम आटे को सूचित करता है; आधुनिक हिन्दी में ‘मैदा’ सामान्य पाठक के लिए सहज है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: याजकीय प्रसंग में यह सामान्य भेंट नहीं, बल्कि अनाज से बनी बलि है; ‘अन्नबलि’ अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: जो तेल में मिलाया गया हो
  rationale: यह मैदे के तेल के साथ मिश्रित होने का वर्णन करता है; यह रूप हिन्दी में स्वाभाविक है और विधिक भाव बनाए रखता है।
- source_word: וְנִסְכּוֹ
  choice: और उसका पेयबलि
  rationale: נֶסֶךְ चढ़ाए जाने वाले तरल अर्पण को सूचित करता है। एकवचन प्रत्यय को ‘उसका’ से सुरक्षित रखा गया है, बिना उसके संदर्भ को आवश्यकता से अधिक निश्चित किए।
theological_decisions:
- issue: वचन में स्पष्ट क्रिया का अभाव
  choice: हिन्दी में भी सूची-जैसी संरचना को द्विबिंदु के साथ बनाए रखा गया
  alternative: अंत में ‘चढ़ाना’ या ‘चढ़ाओ’ जोड़ना
  rationale: इब्रानी पद पिछले आदेश पर निर्भर एक क्रियारहित बलिदान-सूची है। नई आज्ञार्थक क्रिया जोड़ने से निहित संबंध स्पष्ट तो होता, पर मूल की संरचना से अधिक कहा जाता।
- issue: וְנִסְכּוֹ में एकवचन संबंधसूचक प्रत्यय
  choice: ‘उसका पेयबलि’
  alternative: ‘उनका पेयबलि’ या ‘उनके साथ का पेयबलि’
  rationale: मूल में प्रत्यय एकवचन है। ‘उसका’ उस व्याकरणिक रूप को बचाता है और यह तय नहीं करता कि संकेत निकटतम अन्नबलि, समूची भेंट, या बलिदान-व्यवस्था की ओर है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘सब्त’, ‘अन्नबलि’ और ‘पेयबलि’ जैसे पारिभाषिक शब्द बलिदान-विधि की सटीकता बनाए रखते हैं। मूल की क्रियारहित सूची और ‘उसका’ की संदर्भगत अस्पष्टता को जानबूझकर सुरक्षित रखा गया है।
