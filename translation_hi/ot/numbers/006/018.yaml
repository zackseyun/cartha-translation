id: NUM.6.18
reference: Numbers 6:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/גִלַּ֣ח הַ/נָּזִ֗יר פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד אֶת רֹ֣אשׁ נִזְר֑/וֹ וְ/לָקַ֗ח אֶת שְׂעַר֙ רֹ֣אשׁ נִזְר֔/וֹ וְ/נָתַן֙ עַל הָ/אֵ֔שׁ אֲשֶׁר תַּ֖חַת זֶ֥בַח הַ/שְּׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/018.yaml
  text: Then the Nazirite shall shave the head of his consecration at the entrance of the tent of meeting[a], and shall take the hair of the head of his consecration and put it on the fire that is under the sacrifice of peace offerings.
translation:
  language: hi
  text: तब नाज़ीर मिलापवाले तंबू के प्रवेश-द्वार पर अपना समर्पित सिर मुँड़ाए। वह अपने समर्पित सिर के बाल लेकर उस आग पर रखे जो मेलबलि[a] के नीचे है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति-बलि” अथवा “कुशल-मंगल की बलि।”
    reason: שְׁלָמִים के वैध वैकल्पिक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: הַנָּזִיר
  choice: नाज़ीर
  rationale: यह इस अध्याय में वर्णित विशेष नाज़ीर-व्रत धारण करने वाले व्यक्ति के लिए पारिभाषिक शब्द है; लिप्यंतरण उसके विशिष्ट विधिक अर्थ को सुरक्षित रखता है।
- source_word: וְגִלַּח
  choice: मुँड़ाए
  rationale: क्रिया सिर के बाल पूरी तरह मुँड़ाने की विधिक क्रिया बताती है; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח प्रवेश या द्वार का स्थान है और אֹהֶל מוֹעֵד के लिए यह प्रचलित, सुबोध पवित्रस्थान-संबंधी पदावली है।
- source_word: רֹאשׁ נִזְרוֹ
  choice: अपना समर्पित सिर
  rationale: शाब्दिक संरचना ‘उसके समर्पण का सिर’ हिंदी में अस्वाभाविक है। ‘समर्पित सिर’ बालों और नाज़ीर के पवित्र समर्पण के बीच संबंध को स्वाभाविक ढंग से बनाए रखता है।
- source_word: שְׂעַר רֹאשׁ נִזְרוֹ
  choice: अपने समर्पित सिर के बाल
  rationale: यह मूल पाठ की दोहराई हुई धारणा को बनाए रखता है कि मुँड़ाए गए बाल नाज़ीर के समर्पण से जुड़े हैं।
- source_word: הָאֵשׁ אֲשֶׁר תַּחַת
  choice: उस आग पर ... जो ... के नीचे है
  rationale: आग और बलि के बीच मूल पाठ में दिया गया स्थान-संबंध बिना अतिरिक्त व्याख्या के सुरक्षित रखा गया है।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: मेलबलि
  rationale: यह שְׁלָמִים की विशिष्ट बलि-श्रेणी के लिए संक्षिप्त और प्रचलित हिंदी पारिभाषिक शब्द है तथा मेल, शांति और कुशल-मंगल की अर्थ-छटा को पूरी तरह किसी एक अर्थ तक सीमित नहीं करता।
theological_decisions:
- issue: שְׁלָמִים नामक बलि-श्रेणी का अनुवाद
  choice: मेलबलि
  alternative: शांति-बलि; कुशल-मंगल की बलि
  rationale: मूल शब्द शांति, संपूर्णता, कुशल और सहभागिता से जुड़ी अर्थ-छटाएँ रखता है। ‘मेलबलि’ स्थापित श्रेणी को दर्शाता है, जबकि पाद-टिप्पणी अन्य संभव अर्थों को खुला रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और विधिक-आनुष्ठानिक हिंदी। ‘नाज़ीर’ और ‘मेलबलि’ जैसे पारिभाषिक शब्द रखे गए हैं; कठिन शाब्दिक वाक्यांश ‘समर्पण का सिर’ को स्वाभाविक हिंदी में ‘समर्पित सिर’ किया गया है।
