  text: וְ/כִֽי יָמ֨וּת מֵ֤ת עָלָי/ו֙ בְּ/פֶ֣תַע פִּתְאֹ֔ם וְ/טִמֵּ֖א רֹ֣אשׁ נִזְר֑/וֹ וְ/גִלַּ֤ח רֹאשׁ/וֹ֙ בְּ/י֣וֹם טָהֳרָת֔/וֹ בַּ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יְגַלְּחֶֽ/נּוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/009.yaml
  text: And if someone dies suddenly beside him[a], and he defiles his consecrated head, then he shall shave his head on the day of his cleansing[b]; on the seventh day he shall shave it.
translation:
  language: hi
  text: और यदि उसके पास कोई व्यक्ति एकाएक मर जाए[a], जिससे उसका समर्पित सिर[b] अशुद्ध हो जाए, तो वह अपने शुद्ध होने के दिन अपना सिर मुँड़ाए; सातवें दिन वह उसे मुँड़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘यदि उसके पास कोई मृत व्यक्ति एकाएक, अचानक मर जाए’ जैसा दोहराव है; यह उसकी निकट उपस्थिति में हुई आकस्मिक और अनपेक्षित मृत्यु को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके नाज़ीर-समर्पण का सिर।’ इब्रानी अभिव्यक्ति सिर को उसके नाज़ीर-समर्पण से सीधे जोड़ती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: यह नाज़ीर-संबंधी व्यवस्था में एक शर्तयुक्त परिस्थिति प्रस्तुत करता है; ‘और’ पूर्ववर्ती विधान से संबंध बनाए रखता है।
- source_word: יָמוּת מֵת
  choice: कोई व्यक्ति ... मर जाए
  rationale: इब्रानी में ‘मरे हुआ व्यक्ति मर जाए’ जैसा सजातीय प्रयोग है, जिसका स्वाभाविक हिन्दी अर्थ किसी व्यक्ति का मर जाना है।
- source_word: עָלָיו
  choice: उसके पास
  rationale: इस अशुद्धता-संबंधी प्रसंग में इसका आशय नाज़ीर की निकट उपस्थिति में मृत्यु होने से है; केवल शारीरिक स्पर्श आवश्यक नहीं है।
- source_word: בְּפֶתַע פִּתְאֹם
  choice: अचानक
  rationale: दो निकटार्थी शब्द घटना की आकस्मिकता और अनपेक्षितता पर बल देते हैं; ‘अचानक’ इसे सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְטִמֵּא
  choice: और ... को अशुद्ध कर दे
  rationale: मूल क्रिया सकर्मक है। हिन्दी में मृत्यु की परिस्थिति को कारण मानते हुए वाक्य रखा गया है, पर इब्रानी की सक्रिय अभिव्यक्ति भी बनी रहती है।
- source_word: רֹאשׁ נִזְרוֹ
  choice: उसके समर्पित सिर
  rationale: נֵזֶר यहाँ नाज़ीर के विशेष समर्पण को सूचित करता है, जिसका दृश्य चिह्न उसके बिना कटे बाल हैं। यह अनुवाद अनावश्यक रूप से ‘मन्नत’ जोड़ने के बजाय अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: וְגִלַּח רֹאשׁוֹ
  choice: तो वह ... अपना सिर मुँड़ाए
  rationale: यह अशुद्ध होने के बाद अपेक्षित कार्य बताता है; ‘तो’ शर्त और परिणाम का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: בְּיוֹם טָהֳרָתוֹ
  choice: अपने शुद्ध किए जाने के दिन
  rationale: यह अनुष्ठानिक अशुद्धता से शुद्ध किए जाने को दर्शाता है और कर्मवाच्य अर्थ को सुरक्षित रखता है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: समय का सीधा और स्वाभाविक हिन्दी निर्देश।
- source_word: יְגַלְּחֶנּוּ
  choice: वह उसे मुँड़ाए
  rationale: सर्वनाम पीछे आए ‘सिर’ की ओर संकेत करता है; पुनरुक्ति से बचते हुए इब्रानी का संकेतात्मक रूप रखा गया है।
theological_decisions:
- issue: नाज़ीर की अशुद्धता और समर्पण की भाषा
  choice: נזר को अनुष्ठानिक समर्पण के अर्थ में ‘समर्पित सिर’ कहा गया है।
  alternative: ‘उसके नाज़ीर-समर्पण का सिर’ या ‘उसकी मन्नत का सिर’
  rationale: पद नाज़ीर के समर्पण में बाधा डालने वाली अनुष्ठानिक अशुद्धता से संबंधित है। ‘समर्पित सिर’ बालों और सिर के विशेष धार्मिक महत्त्व को बनाए रखता है, पर इस उपवाक्य में सीधे न आए ‘मन्नत’ के विचार को नहीं जोड़ता।
- issue: अशुद्ध करने वाले का व्याकरणिक संबंध
  choice: मृत व्यक्ति की आकस्मिक मृत्यु से समर्पित सिर के अशुद्ध होने को सक्रिय वाक्य में रखा गया है।
  alternative: ‘और इससे उसका समर्पित सिर अशुद्ध हो जाए’
  rationale: इब्रानी क्रिया सकर्मक रूप में है, किंतु उसका कर्ता व्यक्ति अथवा मृत्यु की पूरी घटना समझा जा सकता है। चुना हुआ रूप मूल की सक्रियता रखता है, जबकि पादटिप्पणी के बिना किसी अतिरिक्त धार्मिक कारण की स्थापना नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण विधिक-अनुष्ठानिक स्तर रखा गया है। ‘नाज़ीर’ को मुख्य पाठ में अनावश्यक रूप से दोहराने के बजाय ‘समर्पित सिर’ प्रयोग किया गया है; पादटिप्पणी मूल सांस्कृतिक पद से संबंध स्पष्ट करती है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
