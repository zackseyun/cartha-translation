base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/023.yaml
  text: Speak to Aaron and to his sons[a], saying, ‘Thus you shall bless the sons of Israel. Say to them,’
translation:
  language: hi
  text: हारून और उसके पुत्रों से कह, ‘तुम इस प्रकार इस्राएलियों[a] को आशीर्वाद देना। उनसे कहना:’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: कह
  rationale: पिएल आज्ञार्थक एकवचन है और मूसा को सीधी आज्ञा देता है; हिंदी में संबोधन के साथ ‘कह’ स्वाभाविक और स्पष्ट है।
- source_word: וְאֶל בָּנָיו
  choice: और उसके पुत्रों से
  rationale: संदर्भ में हारून के पुरुष याजकीय वंशज अभिप्रेत हैं, इसलिए ‘पुत्रों’ सटीक है।
- source_word: לֵאמֹר
  choice: कह
  rationale: यह कथन की विषयवस्तु आरंभ करने वाला उद्धरण-सूचक रूप है; हिंदी में मुख्य क्रिया के साथ एक ही ‘कह’ में इसका भाव स्वाभाविक रूप से समाहित होता है।
- source_word: כֹּה
  choice: इस प्रकार
  rationale: यह निर्धारित आशीर्वाद-विधि का परिचय देता है और औपचारिकता बनाए रखते हुए आधुनिक हिंदी में सहज है।
- source_word: תְבָרֲכוּ
  choice: आशीर्वाद देना
  rationale: निर्देशात्मक संदर्भ में पिएल अपूर्ण बहुवचन का आज्ञार्थक बल ‘देना’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यह पूरे इस्राएली समुदाय का प्रचलित जातीय-सामुदायिक पद है; ‘इस्राएलियों’ आधुनिक हिंदी में स्पष्ट है।
- source_word: אָמֹר לָהֶם
  choice: उनसे कहना
  rationale: अगले पद में आने वाले आशीर्वाद के ठीक शब्दों का परिचय देने वाली आज्ञा है; ‘उनसे कहना’ उसके निर्देशात्मक बल को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त वाच्यार्थ और सामुदायिक प्रयोग
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यहाँ पद पूरे वाचा-समुदाय का पारंपरिक नाम है, केवल पुरुषों का सीमित उल्लेख नहीं। मुख्य पाठ में स्वाभाविक सामुदायिक अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- issue: याजकीय निर्देश का विधिसूचक बल
  choice: तुम इस प्रकार ... आशीर्वाद देना
  alternative: तुम इस प्रकार ... आशीर्वाद दोगे
  rationale: संदर्भ भविष्यवाणी नहीं बल्कि निर्धारित याजकीय आदेश है; हिंदी का ‘देना’ इस निर्देशात्मक बल को बिना अनावश्यक कठोरता के व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सहज निर्देशात्मक शैली। मूसा के लिए प्रसंगानुसार एकवचन ‘कह’ और हारून तथा उसके पुत्रों के लिए बहुवचन ‘तुम’ रखा गया है। अंतिम द्विबिंदु अगले पद में आने वाले आशीर्वाद के शब्दों का संकेत करता है।
