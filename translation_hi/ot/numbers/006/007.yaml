base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/007.yaml
  text: He shall not make himself unclean for them at their death[a], not even for his father or his mother, for his brother or his sister[b], because the consecration of his God is on his head.
translation:
  language: hi
  text: वह अपने पिता या अपनी माता, अपने भाई या अपनी बहन के लिए भी उनकी मृत्यु पर अपने आप को अशुद्ध न करे,[a] क्योंकि उसके सिर पर उसके परमेश्वर के प्रति उसके समर्पण का चिह्न है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब वे मरें, तब वह उनके कारण अशुद्ध न हो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לְאָבִיו ... וּלְאִמּוֹ ... לְאָחִיו ... וּלְאַחֹתוֹ
  choice: अपने पिता या अपनी माता, अपने भाई या अपनी बहन के लिए भी
  rationale: आरम्भ में रखे गए संबंध-सूचक पदों का बल हिन्दी में ‘भी’ द्वारा स्वाभाविक रूप से व्यक्त होता है; एकवचन और रिश्तों का लिंग मूल के अनुसार रखा गया है।
- source_word: לֹא יִטַּמָּא
  choice: अपने आप को अशुद्ध न करे
  rationale: हित्पएल रूप की आत्मवाची छाया को बनाए रखता है और प्रसंगानुसार धार्मिक-अनुष्ठानिक अशुद्धता बताता है, नैतिक भ्रष्टता नहीं।
- source_word: בְּמֹתָם
  choice: उनकी मृत्यु पर
  rationale: मूल की संज्ञात्मक रचना और मृत्यु के अवसर पर लगने वाली अशुद्धता—दोनों को संक्षेप में बनाए रखता है।
- source_word: נֵזֶר
  choice: समर्पण का चिह्न
  rationale: नाज़ीर के प्रसंग में यह परमेश्वर के लिए अलग किए जाने की स्थिति और उसके सिर पर दिखाई देने वाले संकेत, दोनों की ओर संकेत करता है; केवल भौतिक ‘मुकुट’ कहना भ्रामक होगा।
- source_word: אֱלֹהָיו
  choice: उसके परमेश्वर के लिए
  rationale: मूल के संबंधवाचक प्रत्यय को सुरक्षित रखते हुए हिन्दी में समर्पण का परमेश्वर से संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל רֹאשׁוֹ
  choice: उसके सिर पर है
  rationale: मूल की ठोस सिर-संबंधी छवि और नाज़ीर के बालों की ओर संभावित संकेत को बनाए रखता है।
theological_decisions:
- issue: नाज़ीर-विधान में अशुद्धता का स्वरूप
  choice: ‘अपने आप को अशुद्ध न करे’ द्वारा धार्मिक-अनुष्ठानिक अशुद्धता व्यक्त की गई है।
  alternative: ‘अपने आप को अपवित्र न करे’, जो नैतिक दोष का भाव दे सकता है।
  rationale: प्रसंग शव के संपर्क से होने वाली धार्मिक-अनुष्ठानिक अशुद्धता का है; पाठ इससे आगे कोई नैतिक अपराध घोषित नहीं करता।
- issue: נֵזֶר का आशय
  choice: मुख्य पाठ में ‘समर्पण का चिह्न’ और पादटिप्पणी में समर्पित/अलग किए जाने की अवस्था तथा बालों से उसका संबंध।
  alternative: ‘मुकुट’ या केवल ‘समर्पण’।
  rationale: यहाँ शब्द में समर्पित अवस्था और सिर पर उसके दृश्य चिह्न का तनाव है; अनुवाद को किसी एक पहलू तक सीमित नहीं करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक निषेध के लिए गरिमापूर्ण पर सहज ‘न करे’ का प्रयोग। रिश्तों के नाम सामान्य बोलचाल के हैं, जबकि ‘समर्पण’ धार्मिक प्रसंग की गरिमा बनाए रखता है।
