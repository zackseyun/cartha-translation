source:
  edition: WLC
  text: וְ/זֹ֥את תּוֹרַ֖ת הַ/נָּזִ֑יר בְּ/י֗וֹם מְלֹאת֙ יְמֵ֣י נִזְר֔/וֹ יָבִ֣יא אֹת֔/וֹ אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/013.yaml
  text: 'And this is the law of the Nazirite: on the day the days of his separation are completed[b][a], he shall be brought to the entrance of the tent of meeting.'
translation:
  language: hi
  text: 'और नाज़ीर की व्यवस्था यह है: जिस दिन उसके अलग रहने की अवधि पूरी हो, उसे मिलापवाले तंबू के द्वार पर लाया जाए।[a][b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘उसके अलग रहने की अवधि’ का अनुवाद ‘उसके नाज़ीर-व्रत की अवधि’ या ‘उसके समर्पण की अवधि’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'अधिक शाब्दिक रूप से: ‘वह उसे मिलापवाले तंबू के द्वार पर लाए।’ इब्रानी क्रिया सक्रिय है, पर इस पद में कर्ता स्पष्ट नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת תּוֹרַת הַנָּזִיר
  choice: और नाज़ीर के लिए व्यवस्था यह है
  rationale: संयोजक ו को ‘और’ से रखा गया है। תּוֹרָה यहाँ अनुष्ठान-संबंधी विधि/व्यवस्था है, और נָזִיר इस्राएली संस्था का तकनीकी नाम है; इसलिए ‘नाज़ीर’ को लिप्यंतरित रखा गया है।
- source_word: בְּיוֹם מְלֹאת יְמֵי נִזְרוֹ
  choice: जिस दिन उसके अलग रहने के दिन पूरे हो जाएँ
  rationale: מְלֹאת अवधि के पूरा होने को व्यक्त करता है। נִזְרוֹ में अलग किए जाने/रहने तथा समर्पण की अर्थ-छाया है; ‘अलग रहने’ से मूल भाव सुरक्षित रहता है, जबकि ‘मन्नत’ को मुख्य पाठ में अनिवार्य नहीं बनाया गया।
- source_word: יָבִיא אֹתוֹ
  choice: वह ... लाया जाए
  rationale: इब्रानी क्रिया रूपतः सक्रिय है, ‘वह उसे लाए’, पर कर्ता स्पष्ट नहीं है। स्वाभाविक हिन्दी में कर्मवाच्य अनिर्दिष्ट कर्ता को थोपे बिना नाज़ीर को अनुष्ठान के लिए प्रस्तुत किए जाने का भाव देता है।
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू के द्वार पर
  rationale: यह אֹהֶל מוֹעֵד के लिए प्रचलित और समझने योग्य बाइबिलीय पद है; פֶּתַח को यहाँ स्वाभाविक हिन्दी में ‘द्वार’ कहा गया है।
theological_decisions:
- issue: נָזִיר / נִזְרוֹ का अर्थ
  choice: तकनीकी पद के लिए ‘नाज़ीर’ और अवधि के लिए ‘अलग रहने के दिन’
  alternative: ‘समर्पित व्यक्ति’ और ‘उसके समर्पण की अवधि’, अथवा ‘उसकी नाज़ीर की मन्नत के दिन’
  rationale: ‘नाज़ीर’ विशिष्ट इस्राएली प्रथा को सुरक्षित रखता है। ‘अलग रहने’ में मूल का पृथक किए जाने का अर्थ बना रहता है और यह समर्पण अथवा मन्नत में से केवल एक व्याख्या को मुख्य पाठ में निर्णायक नहीं बनाता।
- issue: יָבִיא אֹתוֹ का वाच्य और कर्ता
  choice: 'कर्मवाच्य: ‘वह ... लाया जाए’'
  alternative: 'औपचारिक सक्रिय रूप: ‘वह उसे ... लाए’'
  rationale: मूल रूप सक्रिय है, किन्तु पद में उसका कर्ता स्पष्ट नहीं। कर्मवाच्य हिन्दी में विधिक-अनुष्ठानिक कथन को स्वाभाविक रखता है; औपचारिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध विधिक शैली अपनाई गई है। ‘नाज़ीर’ तकनीकी बाइबिलीय पद के रूप में रखा गया है। ‘मिलापवाला तम्बू’ हिन्दी बाइबिल परंपरा में परिचित पद है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
