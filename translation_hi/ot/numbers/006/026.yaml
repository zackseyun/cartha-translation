  text: יִשָּׂ֨א יְהוָ֤ה פָּנָי/ו֙ אֵלֶ֔י/ךָ וְ/יָשֵׂ֥ם לְ/ךָ֖ שָׁלֽוֹם׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/026.yaml
  text: May Yahweh lift up his face toward you and give you peace[a].
translation:
  language: hi
  text: याहवे अपना मुख तुम्हारी ओर उठाए और तुम्हें शांति[a] दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘शालोम’ का अर्थ शांति के साथ-साथ संपूर्णता, कुशल-मंगल और भलाई भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׂא
  choice: उठाए
  rationale: נשׂא का मूल अर्थ ‘उठाना’ है। ‘मुख’ के साथ यह अनुकूल ध्यान का भाव देता है; ‘उठाए’ इब्रानी बिंब को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: פָּנָיו
  choice: अपना मुख
  rationale: פנים का ठोस अर्थ ‘मुख’ है। ‘अपना मुख’ मूल मानवरूपी बिंब को बनाए रखता है और ‘उपस्थिति’ जैसे व्याख्यात्मक विकल्प से बचता है।
- source_word: אֵלֶיךָ
  choice: तुम्हारी ओर
  rationale: אֶל दिशा व्यक्त करता है; यहाँ ‘तुम्हारी ओर’ स्वाभाविक और सटीक है।
- source_word: וְיָשֵׂם לְךָ
  choice: और तुम्हें … दे
  rationale: שׂים का मूल अर्थ ‘रखना/स्थापित करना’ है, पर ‘तुम्हारे लिए शांति रखे’ का स्वाभाविक हिन्दी भाव ‘तुम्हें शांति दे’ है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: שָׁלוֹם के अर्थ-क्षेत्र में शांति, संपूर्णता और कुशल-मंगल सम्मिलित हैं। आशीर्वाद के इस सूत्र में ‘शांति’ मुख्य पाठ के लिए स्वाभाविक है; व्यापक भाव पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: ‘अपना मुख उठाए’ मानवरूपी मुहावरे को बनाए रखना
  choice: अपना मुख तुम्हारी ओर उठाए
  alternative: तुम पर कृपा करे; तुम्हें अनुग्रह की दृष्टि से देखे
  rationale: मूल की देहात्मक और काव्यात्मक छवि को बनाए रखा गया है। इसका आशय अनुकूल ध्यान है, पर मुख्य पाठ में उस छवि को अमूर्त व्याख्या से नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण आशीर्वचन। एकवचन संबोधन ‘तुम्हारी/तुम्हें’ मूल इब्रानी के एकवचन रूप को दर्शाता है। ‘मुख’ मूल बिंब सुरक्षित रखता है; ‘शांति दे’ स्वाभाविक हिन्दी के लिए अर्थ-समान रूप है।
