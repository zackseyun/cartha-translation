  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत रूप से “प्रभु” के रूप में अनुवादित।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक निरूपण को बताना।
lexical_decisions:
- source_word: יְבָרֶכְךָ
  choice: तुम्हें आशीष दे
  rationale: पिएल इच्छार्थक, तृतीय पुरुष एकवचन पुल्लिंग, द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय के साथ। याजकीय आशीर्वाद के संदर्भ में हिंदी का इच्छार्थक प्रयोग मूल की आशीषात्मक कामना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण लिप्यंतरण के अनुरूप रखा गया है।
- source_word: וְיִשְׁמְרֶךָ
  choice: और तुम्हारी रक्षा करे
  rationale: शמר का काल इच्छार्थक, तृतीय पुरुष एकवचन पुल्लिंग, द्वितीय पुरुष एकवचन पुल्लिंग प्रत्यय के साथ है। यहाँ 'रक्षा करे' सुरक्षापूर्वक संभालने के भाव को सहज, स्पष्ट हिंदी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। 'याहवे' उसे किसी उपाधि से प्रतिस्थापित किए बिना दर्शाता है; पारंपरिक विकल्प पाठ-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और काव्यात्मक आशीर्वचन। एकवचन पुल्लिंग संबोधन को सामान्य हिंदी के ‘तुम्हें/तुम्हारी’ से व्यक्त किया गया है।
