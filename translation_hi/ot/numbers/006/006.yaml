id: NUM.6.6
reference: Numbers 6:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל יְמֵ֥י הַזִּיר֖/וֹ לַ/יהוָ֑ה עַל נֶ֥פֶשׁ מֵ֖ת לֹ֥א יָבֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/006.yaml
  text: All the days of his separation to Yahweh[b][a], he shall not go near a dead body.
translation:
  language: hi
  text: जितने दिन वह यहोवा के लिए अलग रहे[a], उतने दिन वह किसी मनुष्य के शव[b] के पास न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी नाज़ीर मन्नत की अवधि में” अथवा “अपने समर्पण की अवधि में।” इब्रानी पद नाज़ीर के रूप में अलग रहने की अवस्था या अवधि को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मृत नेफ़ेश”; यहाँ इसका अर्थ किसी मनुष्य का शव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל יְמֵי
  choice: जितने दिन ... उतने दिन
  rationale: यह स्वाभाविक हिन्दी में पूरी अवधि के व्यापक अर्थ को स्पष्ट करता है।
- source_word: הַזִּירוֹ
  choice: वह ... अलग रहे
  rationale: नाज़ीर-संबंधी मूल נזר के अलग किए जाने की अवस्था या अवधि को व्यक्त करता है और मुख्य पाठ में ‘मन्नत’ जोड़ने से बचता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ समर्पण या किसी के लिए अलग किए जाने का भाव देता है; हिन्दी में ‘के लिए’ स्वाभाविक है। יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַל ... לֹא יָבֹא
  choice: के पास न जाए
  rationale: इस विधिक प्रसंग में यह मुहावरा शव के निकट जाने का निषेध व्यक्त करता है।
- source_word: נֶפֶשׁ מֵת
  choice: किसी मृत व्यक्ति के शव
  rationale: शाब्दिक रूप ‘मृत नेफ़ेश’ है, पर शुद्धता-विधि के प्रसंग में इसका आशय मानव शव है; यह हिन्दी रूप व्यक्ति-संदर्भ को स्पष्ट रखता है।
theological_decisions:
- issue: नाज़ीर-संबंधी पद को आवश्यकता से अधिक विशिष्ट न बनाना
  choice: वह ... अलग रहे
  alternative: उसकी नाज़ीर मन्नत / उसका समर्पण
  rationale: इब्रानी संज्ञा यहाँ नाज़ीर के रूप में अलग रहने की अवस्था या अवधि बताती है। क्रियात्मक हिन्दी अनुवाद उसी अर्थ को सहज रूप से देता है, बिना मुख्य पाठ में ‘मन्नत’ शब्द जोड़ने के।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। ‘यहोवा’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रत्यक्ष रखता है।
- issue: נֶפֶשׁ מֵת का आशय
  choice: किसी मृत व्यक्ति के शव
  alternative: मृत प्राणी / मृत देह
  rationale: गिनती 6 की अशुद्धता-विधि में यह पद मानव शव का संकेत करता है; ‘मृत व्यक्ति के शव’ से यह आशय स्पष्ट होता है और ‘प्राणी’ की व्यापकता से बचा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण विधिक शैली अपनाई गई है। ‘जितने दिन ... उतने दिन’ से पूरी अवधि का बल स्वाभाविक ढंग से व्यक्त होता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
