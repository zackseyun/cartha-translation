  text: זֹ֣את תּוֹרַ֣ת הַ/נָּזִיר֮ אֲשֶׁ֣ר יִדֹּר֒ קָרְבָּנ֤/וֹ לַֽ/יהוָה֙ עַל נִזְר֔/וֹ מִ/לְּ/בַ֖ד אֲשֶׁר תַּשִּׂ֣יג יָד֑/וֹ כְּ/פִ֤י נִדְר/וֹ֙ אֲשֶׁ֣ר יִדֹּ֔ר כֵּ֣ן יַעֲשֶׂ֔ה עַ֖ל תּוֹרַ֥ת נִזְרֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/021.yaml
  text: This is the law of the Nazirite who vows his offering to Yahweh for his Nazirite vow[a], besides what his hand can afford. According to the vow that he vows, so he shall do, according to the law of his Nazirite vow.
translation:
  language: hi
  text: “यह उस नाज़ीर की व्यवस्था है जो अपने नाज़ीर-व्रत के लिए याहवे को अपना चढ़ावा चढ़ाने की मन्नत मानता है, उसके अतिरिक्त जो उसकी सामर्थ्य में हो[a]। उसने जो मन्नत मानी है, उसके अनुसार वह अपने नाज़ीर-व्रत की व्यवस्था के अनुसार वैसा ही करे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो वह वहन कर सके”; शाब्दिक, “जो उसका हाथ प्राप्त कर सके।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: यहाँ תּוֹרָה नाज़ीर-व्रत को नियंत्रित करने वाले निर्धारित विधान को दर्शाता है; ‘व्यवस्था’ कानूनी संदर्भ में स्वाभाविक और गरिमापूर्ण है।
- source_word: הַנָּזִיר
  choice: नाज़ीर
  rationale: यह इस अध्याय के विशेष व्रत और समर्पित स्थिति का पारिभाषिक नाम है; लिप्यंतरण उस विशिष्ट अर्थ को बनाए रखता है।
- source_word: קָרְבָּנוֹ
  choice: अपना चढ़ावा
  rationale: קָרְבָּן परमेश्वर के सामने प्रस्तुत की जाने वाली भेंट का सामान्य शब्द है; ‘चढ़ावा’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण अथवा प्राप्तकर्ता को सूचित करता है; יהוה को वाचा-संबंधी व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: עַל נִזְרוֹ
  choice: अपने नाज़ीर-व्रत के कारण
  rationale: यह पदबंध उस चढ़ावे को नाज़ीर के व्रत/समर्पण से जोड़ता है; ‘के कारण’ עַל के आधार या प्रसंग-सूचक बल को स्पष्ट करता है।
- source_word: מִלְּבַד אֲשֶׁר תַּשִּׂיג יָדוֹ
  choice: इसके अतिरिक्त वह उतना भी चढ़ाए जितना वह दे सके
  rationale: शाब्दिक मुहावरा ‘जो उसका हाथ प्राप्त कर सके’ आर्थिक सामर्थ्य बताता है। हिन्दी में अर्थ स्वाभाविक रखते हुए ‘इसके अतिरिक्त’ को पहले बताए गए निर्धारित चढ़ावे से जोड़ा गया है।
- source_word: כְּפִי נִדְרוֹ אֲשֶׁר יִדֹּר
  choice: उसने जो मन्नत मानी हो, उसके अनुसार
  rationale: यह मन्नत की वास्तविक विषय-वस्तु के अनुरूप करने की बाध्यता व्यक्त करता है और मूल में दोहराए गए मन्नत-संबंधी शब्दों को बनाए रखता है।
- source_word: כֵּן יַעֲשֶׂה
  choice: वैसा ही करे
  rationale: यह कानूनी दायित्व का सूत्र है; ‘करे’ निर्देशात्मक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל תּוֹרַת נִזְרוֹ
  choice: अपने नाज़ीर-व्रत की व्यवस्था के साथ-साथ
  rationale: अंतिम עַל को जोड़/अतिरिक्तता के अर्थ में समझना वाक्य के आरंभ में निर्धारित नाज़ीर-विधान और व्यक्ति की अतिरिक्त मन्नत के संबंध को स्पष्ट करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को रखा गया है, न कि उसे केवल उपाधि ‘प्रभु’ से बदला गया।
- issue: अंतिम עַל תּוֹרַת נִזְרוֹ का संबंध
  choice: नाज़ीर-व्रत की निर्धारित व्यवस्था के साथ-साथ अतिरिक्त मन्नत पूरी करना
  alternative: नाज़ीर-व्रत की व्यवस्था के अनुसार ही करना
  rationale: עַל यहाँ ‘के अतिरिक्त/के ऊपर’ का भाव दे सकता है और पद के पहले מִלְּבַד से मेल खाता है। फिर भी ‘के अनुसार’ वाला अर्थ व्याकरणतः संभव है; मुख्य पाठ चुने गए संबंध को स्पष्ट करता है बिना किसी विशिष्ट सांप्रदायिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी, कानूनी-विधिक गरिमा के साथ। ‘मन्नत मानना’, ‘चढ़ावा’ और ‘नाज़ीर-व्रत’ साधारण पाठक के लिए समझने योग्य हैं। मूल की पुनरुक्ति और निर्धारित चढ़ावे बनाम सामर्थ्य/व्यक्तिगत मन्नत के तनाव को यथासंभव बनाए रखा गया है।
