  yaml_path: translation/ot/numbers/006/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; हिन्दी में ‘फिर’ स्वाभाविक क्रम-सूचक है। דבר के औपचारिक वचन और उसके बाद לֵאמֹר से आरम्भ होने वाली उक्ति को हिन्दी की प्रचलित सूत्रात्मक अभिव्यक्ति ‘ने ... से कहा’ सहज रूप से व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को हिन्दी बाइबल परम्परा में परिचित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: אֶל
  choice: से
  rationale: דבר אל की हिन्दी में स्वाभाविक अभिव्यक्ति ‘किसी से कहना/बोलना’ है; इसलिए शब्दशः ‘की ओर’ या ‘को’ के बजाय ‘से’ चुना गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का मानक और व्यापक रूप से पहचाना जाने वाला हिन्दी रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह infinitive construct आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में דבר ... לאמר की संयुक्त और स्वाभाविक अभिव्यक्ति ‘ने ... से कहा’ है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है। ‘यहोवा’ हिन्दी पाठकों के लिए स्थापित लिप्यंतरण है और ‘प्रभु’ जैसी उपाधि से नाम को प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। इब्रानी उद्घाटन सूत्र को शब्दशः बोझिल बनाए बिना संक्षिप्त कथात्मक रूप में रखा गया है।
