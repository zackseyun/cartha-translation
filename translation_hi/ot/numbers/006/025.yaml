id: NUM.6.25
reference: Numbers 6:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יָאֵ֨ר יְהוָ֧ה פָּנָ֛י/ו אֵלֶ֖י/ךָ וִֽ/יחֻנֶּֽ/ךָּ׀׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/025.yaml
  text: May Yahweh make his face shine upon you and be gracious to you[a].
translation:
  language: hi
  text: याहवे अपना मुख तुम पर चमकाए और तुम पर अनुग्रह करे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे अपना मुख तुम्हारी ओर चमकाए और तुम पर कृपा दिखाए।”
    reason: אֵלֶיךָ का अधिक दिशात्मक अनुवाद “तुम्हारी ओर” और חנן का वैकल्पिक अर्थ “कृपा दिखाए” भी संभव हैं।
lexical_decisions:
- source_word: יָאֵר
  choice: चमकाए
  rationale: हिफ़ील इच्छार्थक रूप आशीष की कामना व्यक्त करता है कि याहवे अपना मुख चमकाए। हिंदी में “चमकाए” कारणवाचक और कामनात्मक दोनों भावों को संक्षेप में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; इसलिए किसी उपाधि से बदलने के बजाय उसका प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: פָּנָיו
  choice: अपना मुख
  rationale: शाब्दिक चित्र “उसका मुख” है। हिंदी में कर्ता याहवे की ओर संकेत करने के लिए “अपना मुख” स्वाभाविक है और ईश्वरीय कृपा के इस सजीव रूपक को सुरक्षित रखता है।
- source_word: אֵלֶיךָ
  choice: तुम पर
  rationale: אֶל का मूल भाव “की ओर” है, पर मुख के चमकने के इस आशीर्वादी मुहावरे में “तुम पर” स्वाभाविक हिंदी है और कृपापूर्ण दिशा को ठीक से व्यक्त करता है।
- source_word: וִיחֻנֶּךָּ
  choice: और तुम पर अनुग्रह करे
  rationale: חנן कृपा या अनुग्रह दिखाने को व्यक्त करता है। “अनुग्रह करे” गरिमापूर्ण, समझने योग्य और दया मात्र की अपेक्षा मूल अर्थ के अधिक निकट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा-संबंधी व्यक्तिगत नाम सीधे प्रयुक्त है। “याहवे” उसे उपाधि में बदले बिना सुरक्षित रखता है।
- issue: “अपना मुख चमकाए” का मानवरूपी रूपक
  choice: मुख के चमकने की छवि मुख्य पाठ में सुरक्षित रखी गई
  alternative: अपनी उपस्थिति से तुम्हें प्रकाश दे; तुम पर कृपादृष्टि करे
  rationale: मूल का ठोस काव्यात्मक चित्र ईश्वरीय कृपा और अनुकूल उपस्थिति व्यक्त करता है। उसका अमूर्त अर्थ देकर रूपक को हटाना आवश्यक नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण आशीर्वादी शैली रखी गई है। एकवचन संबोधन को सम्मानजनक और सामान्य “तुम” से व्यक्त किया गया है; प्राचीन “तू/तुझ” से बचा गया है।
