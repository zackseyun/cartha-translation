  text: 'and a basket of unleavened bread: fine flour cakes mixed with oil[a], and unleavened wafers anointed with oil[b], along with their grain offering and their drink offerings.'
translation:
  language: hi
  text: 'और अख़मीरी रोटियों[a] की एक टोकरी: बारीक आटे की तेल में गूँथी हुई रोटियाँ और तेल से सनी हुई अख़मीरी पतली रोटियाँ[b], और उनकी अन्न-भेंट और पेय-भेंटें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अख़मीरी रोटियों’ के लिए ‘अख़मीरी पकवान’ भी संभव है। इब्रानी शब्द व्यापक है; आगे इसी वर्ग के अंतर्गत रोटियों और पतली रोटियों का उल्लेख है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘तेल से अभिषिक्त’; यहाँ यह पतली रोटियों पर तेल लगाने की विधि बताता है।
    reason: lexical_alternative
