  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן אֶת הַ/זְּרֹ֣עַ בְּשֵׁלָה֮ מִן הָ/אַיִל֒ וְֽ/חַלַּ֨ת מַצָּ֤ה אַחַת֙ מִן הַ/סַּ֔ל וּ/רְקִ֥יק מַצָּ֖ה אֶחָ֑ד וְ/נָתַן֙ עַל כַּפֵּ֣י הַ/נָּזִ֔יר אַחַ֖ר הִֽתְגַּלְּח֥/וֹ אֶת נִזְרֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/019.yaml
  text: Then the priest shall take the boiled shoulder from the ram[a], one unleavened loaf from the basket, and one unleavened wafer, and put them on the palms of the Nazirite after he has shaved his consecrated head.
translation:
  language: hi
  text: तब याजक मेढ़े की उबली हुई अगली टाँग, टोकरी में से एक अख़मीरी रोटी और एक अख़मीरी पतली टिकिया ले, और नाज़ीर के अपना समर्पित सिर[a] मुँडवा लेने के बाद उन्हें उसकी हथेलियों पर रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसके समर्पण को मुँडवा लेने के बाद।” संदर्भ में यह उसके नाज़ीर-समर्पण के चिह्न, अर्थात् उसके सिर या बालों, को दर्शाता है।
    reason: शाब्दिक विकल्प और संदर्भगत अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... ले
  rationale: विधि-संबंधी क्रम में वाव के साथ आए पूर्ण क्रियारूप को स्वाभाविक हिन्दी निर्देश के रूप में प्रस्तुत किया गया है; ‘तब’ पिछले कार्य के बाद का क्रम स्पष्ट करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-विधि में सेवा करने वाले अधिकारी के लिए प्रचलित और सुस्पष्ट हिन्दी शब्द।
- source_word: הַזְּרֹעַ בְּשֵׁלָה מִן הָאַיִל
  choice: मेढ़े की उबली हुई अगली टाँग
  rationale: זְרוֹעַ बलिदान के पशु की अगली टाँग अथवा कंधे वाले भाग को सूचित करता है; ‘अगली टाँग’ आधुनिक हिन्दी में ठोस और शारीरिक रूप से स्पष्ट है। בְּשֵׁלָה को ‘उबली हुई’ से ठीक-ठीक व्यक्त किया गया है।
- source_word: חַלַּת מַצָּה אַחַת
  choice: एक अख़मीरी रोटी
  rationale: חַלָּה यहाँ रोटी की एक पूरी लोई/रोटी है; सरल हिन्दी में ‘रोटी’ स्वाभाविक है और מַצָּה का भाव ‘अख़मीरी’ से सुरक्षित रहता है।
- source_word: מִן הַסַּל
  choice: टोकरी में से
  rationale: מן के स्रोत-सूचक अर्थ और סל के सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּרְקִיק מַצָּה אֶחָד
  choice: और एक अख़मीरी पतली टिकिया
  rationale: רָקִיק पतली रोटी या चपटी टिकिया है; ‘पतली टिकिया’ पहली रोटी से इसका भेद स्पष्ट करती है।
- source_word: וְנָתַן עַל כַּפֵּי
  choice: उन्हें ... हथेलियों पर रखे
  rationale: כַּפַּיִם हाथों के बजाय विशेष रूप से दोनों हथेलियों को दर्शाता है; बहुवचन वस्तुओं के कारण हिन्दी में ‘उन्हें’ स्पष्टता देता है।
- source_word: הַנָּזִיר
  choice: नाज़ीर
  rationale: विशेष मन्नत के अधीन समर्पित व्यक्ति के लिए पारंपरिक लिप्यंतरण रखा गया है, जिससे इस पद की विशिष्ट धार्मिक-सांस्कृतिक पहचान बनी रहती है।
- source_word: אַחַר הִתְגַּלְּחוֹ
  choice: मुँडवा लेने के बाद
  rationale: समय-सूचक रचना को ऐसे पूर्ण हो चुके कार्य के रूप में व्यक्त किया गया है जो याजक द्वारा वस्तुएँ रखे जाने से पहले होता है।
theological_decisions:
- issue: नाज़ीर-विधि में נִזְרוֹ का अर्थ
  choice: अपने नाज़ीर-समर्पण के बाल
  alternative: अपने नाज़ीर-समर्पण को; अपने समर्पित सिर को
  rationale: शब्द का मूल अर्थ ‘समर्पण/नाज़ीरपन’ है, पर इस विधि में वह उस समर्पण को चिह्नित करने वाले बढ़े हुए बालों से मूर्त रूप में जुड़ा है। मुख्य पाठ में ‘बाल’ जोड़ने से मुँडवाने की क्रिया स्वाभाविक होती है, जबकि ‘नाज़ीर-समर्पण’ रखने से धार्मिक अर्थ नहीं खोता; शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-वर्णनात्मक रूप अपनाया गया है। ‘नाज़ीर’ और ‘अख़मीरी’ जैसे आवश्यक बाइबिलीय पद बनाए रखे गए हैं, पर वाक्यरचना साधारण पाठक के लिए स्वाभाविक रखी गई है।
