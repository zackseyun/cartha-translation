source:
  edition: WLC
  text: וְ/הֵנִיף֩ אוֹתָ֨/ם הַ/כֹּהֵ֥ן תְּנוּפָה֮ לִ/פְנֵ֣י יְהוָה֒ קֹ֤דֶשׁ הוּא֙ לַ/כֹּהֵ֔ן עַ֚ל חֲזֵ֣ה הַ/תְּנוּפָ֔ה וְ/עַ֖ל שׁ֣וֹק הַ/תְּרוּמָ֑ה וְ/אַחַ֛ר יִשְׁתֶּ֥ה הַ/נָּזִ֖יר יָֽיִן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/020.yaml
  text: The priest shall wave them as a wave offering before Yahweh[a]. It is holy for the priest, besides the breast of the wave offering and the thigh of the contribution offering[b]. Afterward the Nazirite may drink wine.
translation:
  language: hi
  text: याजक उन्हें याहवे के सामने हिलाने की भेंट के रूप में हिलाए। यह याजक के लिए पवित्र है—हिलाने की भेंट की छाती और उठाकर अर्पित भेंट की जाँघ[a] के अतिरिक्त। इसके बाद नाज़ीर दाखमधु पी सकता है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से, “उठाई हुई भेंट की जाँघ।” इब्रानी תְּרוּמָה उस भाग को दर्शाता है जिसे अलग करके परमेश्वर के सामने प्रस्तुत किया जाता था।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप से, “इसके बाद नाज़ीर दाखमधु पीएगा।” संदर्भ में इसका आशय व्रत पूरा होने के बाद फिर से मिली अनुमति है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: हिलाने की भेंट के रूप में हिलाए
  rationale: मूल इब्रानी की सजातीय क्रिया और संज्ञा को बनाए रखते हुए याजकीय रीति में भेंट को हिलाकर प्रस्तुत करने का भाव स्पष्ट किया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्वाभाविक अर्थ ‘के सामने’ है और परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: קֹדֶשׁ הוּא לַכֹּהֵן
  choice: यह याजक के लिए पवित्र है
  rationale: इब्रानी के एकवचन הוּא को सुरक्षित रखा गया है; ‘यह’ पूरे हिलाए गए अर्पण को सामूहिक रूप से दर्शाता है।
- source_word: עַל
  choice: के अतिरिक्त
  rationale: यहाँ עַל स्थान नहीं, बल्कि याजक को पहले से मिलने वाले भागों के साथ अतिरिक्त भाग दिए जाने का संकेत करता है।
- source_word: חֲזֵה הַתְּנוּפָה
  choice: हिलाने की भेंट की छाती
  rationale: बलि के निर्धारित भाग और तकनीकी शब्द תְּנוּפָה, दोनों को पारदर्शी ढंग से व्यक्त करता है।
- source_word: שׁוֹק הַתְּרוּמָה
  choice: उठाकर अर्पित भेंट की जाँघ
  rationale: שׁוֹק के लिए ‘जाँघ’ और תְּרוּמָה में किसी भाग को अलग करके उठाते हुए प्रस्तुत करने के अनुष्ठानिक भाव को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: יִשְׁתֶּה הַנָּזִיר יָיִן
  choice: नाज़ीर दाखमधु पी सकता है
  rationale: व्रत पूरा होने के बाद पहले का निषेध हटने से मिली अनुमति को ‘पी सकता है’ व्यक्त करता है; יַיִן के लिए गरिमापूर्ण और प्रचलित बाइबलीय शब्द ‘दाखमधु’ चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में प्रयुक्त व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय सीधे लिप्यंतरित किया गया है।
- issue: יִשְׁתֶּה का विधिक बल
  choice: पी सकता है
  alternative: पीएगा
  rationale: व्याकरणतः ‘पीएगा’ संभव है, पर इस विधिक संदर्भ में व्रत के बाद दाखमधु पीने की बहाल अनुमति अभिप्रेत है; वैकल्पिक अधिक शाब्दिक पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण विधानात्मक रूप अपनाया गया है। ‘हिलाने की भेंट’, ‘उठाकर अर्पित भेंट’ और ‘नाज़ीर’ जैसे अनुष्ठानिक पदों को अर्थ-स्पष्ट रखा गया है; मूल की एकवचन सामूहिक अभिव्यक्ति और अंतिम क्रिया की संभावित विधिक अस्पष्टता भी सुरक्षित है।
