source:
  edition: WLC
  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַפְלִא֙ לִ/נְדֹּר֙ נֶ֣דֶר נָזִ֔יר לְ/הַזִּ֖יר לַֽ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/002.yaml
  text: 'Speak to the sons of Israel and say to them: When a man or a woman makes a special vow[a], the vow of a Nazirite, to dedicate himself to Yahweh[b],'
translation:
  language: hi
  text: '“इस्राएलियों से कहो: जब कोई पुरुष या स्त्री यहोवा के लिए अपने को अलग करने हेतु नाज़ीर[b] की विशेष मन्नत[a] माने,”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को अलग करने की मन्नत—नाज़ीर की मन्नत—माने।”
    reason: יַפְלִא और נָזִיר से जुड़े ‘विशेष करने/अलग करने’ के वैकल्पिक, अधिक औपचारिक निरूपण को सुरक्षित रखना।
  - marker: b
    text: ‘नाज़ीर’ वह पुरुष या स्त्री था जो मन्नत मानकर यहोवा के लिए स्वयं को विशेष रूप से अलग करता या करती थी।
    reason: आधुनिक पाठकों के लिए प्राचीन इस्राएली धार्मिक पद की संक्षिप्त सांस्कृतिक व्याख्या; पद में पुरुष और स्त्री दोनों के स्पष्ट समावेश तथा स्वयं को अलग करने के भाव को बनाए रखना।
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट सामुदायिक संबोधन है; यहाँ शाब्दिक ‘इस्राएल के पुत्रों’ से आशय केवल पुरुष नहीं है।
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: कोई पुरुष या स्त्री
  rationale: इब्रानी पाठ दोनों लिंगों का स्पष्ट उल्लेख करता है, इसलिए उसे बनाए रखा गया है।
- source_word: כִּי יַפְלִא לִנְדֹּר נֶדֶר
  choice: जब ... विशेष मन्नत माने
  rationale: कानूनी प्रसंग में כִּי को ‘जब’ और פלא के विशिष्ट अथवा असाधारण भाव को ‘विशेष’ से व्यक्त किया गया है; לִנְדֹּר נֶדֶר की सजातीय रचना हिन्दी में स्वाभाविक ‘मन्नत माने’ बनी है।
- source_word: נֶדֶר נָזִיר
  choice: नाज़ीर की विशेष मन्नत
  rationale: नָזִיר को इस अध्याय की विशिष्ट धार्मिक संस्था के तकनीकी नाम के रूप में लिप्यंतरित किया गया है।
- source_word: לְהַזִּיר
  choice: अपने को अलग करने हेतु
  rationale: यह क्रिया समर्पण के उद्देश्य से स्वयं को अलग ठहराने का भाव रखती है; अनुष्ठानिक पृथक्करण को स्पष्ट रखने के लिए ‘अलग करने’ चुना गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम יהוה को हिन्दी की प्रचलित ध्वन्यात्मक वर्तनी ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: יהוה के दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु; याहवे
  rationale: मूल में टेट्राग्राम יהוה प्रत्यक्ष है। हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम ‘यहोवा’ मूल के नाम-संबंधी स्वरूप को बनाए रखता है; इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: नाज़ीर की मन्नत में स्त्री और पुरुष की सहभागिता
  choice: ‘कोई पुरुष या स्त्री’ को स्पष्ट रखा गया
  alternative: ‘कोई व्यक्ति’
  rationale: मूल विधिक कथन दोनों का अलग-अलग उल्लेख करता है; इसलिए समावेश को सामान्यीकृत पद में विलीन नहीं किया गया।
- issue: לְהַזִּיר में पृथक्करण और समर्पण का संबंध
  choice: ‘यहोवा के लिए अपने को अलग करने’
  alternative: ‘यहोवा को अपने को समर्पित करने’
  rationale: चुना हुआ पाठ नाज़ीर शब्द से जुड़े ‘अलग किए जाने’ के मूल भाव को सुरक्षित रखता है, जबकि ‘यहोवा के लिए’ उसके धार्मिक उद्देश्य को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मन्नत मानना’ मानक हिन्दी धार्मिक प्रयोग है। वाक्य अगले पदों में जारी निर्देश की भूमिका है, इसलिए अंत में अल्पविराम रखा गया है।
