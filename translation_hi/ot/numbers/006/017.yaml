source:
  edition: WLC
  text: וְ/אֶת הָ/אַ֜יִל יַעֲשֶׂ֨ה זֶ֤בַח שְׁלָמִים֙ לַֽ/יהוָ֔ה עַ֖ל סַ֣ל הַ/מַּצּ֑וֹת וְ/עָשָׂה֙ הַ/כֹּהֵ֔ן אֶת מִנְחָת֖/וֹ וְ/אֶת נִסְכּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/017.yaml
  text: And he shall offer the ram as a sacrifice of peace offerings to Yahweh, along with the basket of unleavened bread; and the priest shall offer its grain offering and its drink offering.
translation:
  language: hi
  text: और वह मेढ़े को खमीररहित रोटियों की टोकरी के साथ याहवे के लिए मेलबलि[a] के रूप में चढ़ाए; और याजक उसकी अन्नबलि और पेयबलि चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शांतिबलि’ अथवा ‘सहभागिता-बलि।’ इब्रानी שְׁלָמִים उस बलिदान-श्रेणी का नाम है जिसे शांति, मेल या सहभागिता से जोड़ा जाता है।
    reason: शब्दार्थ का वास्तविक विकल्प
lexical_decisions:
- source_word: הָאַיִל
  choice: मेढ़े
  rationale: बलिदान के प्रसंग में אַיִל का विशिष्ट और स्वाभाविक अर्थ नर भेड़, अर्थात् मेढ़ा, है।
- source_word: יַעֲשֶׂה
  choice: चढ़ाए
  rationale: यद्यपि עשה का सामान्य अर्थ ‘करना/बनाना’ है, बलिदान-संबंधी विधान में यह बलि अर्पित करने की क्रिया व्यक्त करता है।
- source_word: זֶבַח שְׁלָמִים
  choice: मेलबलिदान
  rationale: यह चयन זֶבַח की बलिदान-संबंधी धारणा और שְׁלָמִים से जुड़ी शांति/मेल की व्यापकता को संक्षिप्त, प्रचलित हिन्दी बलिदानी शब्दावली में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ अर्पण के समर्पण या अभिमुखता को दिखाता है; ‘के लिए’ आधुनिक हिन्दी में स्वाभाविक है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: עַל סַל הַמַּצּוֹת
  choice: खमीररहित रोटियों की टोकरी के साथ
  rationale: עַל यहाँ स्थान की अपेक्षा अनुष्ठानिक सहचरता बताता है; ‘के साथ’ इस संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। מַצּוֹת को खाद्य वस्तु के रूप में ‘खमीररहित रोटियाँ’ कहना सामान्य पाठक के लिए स्पष्ट है।
- source_word: מִנְחָתוֹ
  choice: उसका अन्नबलि
  rationale: याजकीय विधान में מִנְחָה अनाज से बने सहायक अर्पण का तकनीकी नाम है। पुल्लिंग प्रत्यय को ‘उसका’ रखकर मूल का संबंध सुरक्षित रहता है, यद्यपि उसका संदर्भ मेढ़ा अथवा पूरे बलिदान-समुच्चय से जुड़ा समझा जा सकता है।
- source_word: נִסְכּוֹ
  choice: अर्घ
  rationale: נֶסֶךְ बलिदान के साथ उंडेला जाने वाला पेय-अर्पण है; ‘अर्घ’ हिन्दी बाइबलीय-सांस्कृतिक प्रयोग में संक्षिप्त और गरिमापूर्ण शब्द है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है। हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: שְׁלָמִים का अर्थ
  choice: मेलबलिदान
  alternative: शांतिबलिदान; सहभागिता-बलिदान
  rationale: शब्द बलिदान की उस श्रेणी को सूचित करता है जिसे शांति, कल्याण या सहभागिता से जोड़ा जा सकता है। मुख्य पाठ में ‘मेलबलिदान’ सहज है, जबकि पादटिप्पणी वास्तविक अर्थ-विकल्प सुरक्षित रखती है।
- issue: מִנְחָתוֹ और נִסְכּוֹ में प्रत्यय का संदर्भ
  choice: उसका
  alternative: उस बलिदान का
  rationale: हिब्रू पुल्लिंग एकवचन प्रत्यय संदर्भ को पूरी तरह स्पष्ट नहीं करता; शाब्दिक सर्वनाम मूल की इस हल्की अस्पष्टता को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मेलबलिदान’, ‘अन्नबलि’ और ‘अर्घ’ बलिदान-विधान की संक्षिप्त पारिभाषिक शब्दावली हैं; पादटिप्पणी שְׁלָמִים की अर्थ-व्याप्ति को बिना संप्रदायगत संकीर्णता के सुरक्षित रखती है।
