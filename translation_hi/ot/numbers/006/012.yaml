source:
  edition: WLC
  text: וְ/הִזִּ֤יר לַֽ/יהוָה֙ אֶת יְמֵ֣י נִזְר֔/וֹ וְ/הֵבִ֛יא כֶּ֥בֶשׂ בֶּן שְׁנָת֖/וֹ לְ/אָשָׁ֑ם וְ/הַ/יָּמִ֤ים הָ/רִאשֹׁנִים֙ יִפְּל֔וּ כִּ֥י טָמֵ֖א נִזְרֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/012.yaml
  text: He shall rededicate to Yahweh the days of his Nazirite vow[a], and he shall bring a male lamb a year old as a guilt offering. But the former days shall be void[b], because his Nazirite vow was defiled.
translation:
  language: hi
  text: वह अपनी नाज़ीर की मन्नत के दिनों को फिर से यहोवा के लिए समर्पित करे[a] और दोषबलि के रूप में एक वर्ष का नर मेमना लाए। पर पहले के दिन अमान्य हो जाएँगे[b], क्योंकि उसका नाज़ीर-समर्पण अशुद्ध हो गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने अलगाव के दिनों को” अथवा “अपने समर्पण के दिनों को।”
    reason: נזר में नाज़ीर मन्नत के साथ अलगाव और समर्पण—दोनों का भाव है।
  - marker: b
    text: शाब्दिक अर्थ, “पहले के दिन गिर जाएँगे”; अर्थात मन्नत के वे पहले दिन अब गिने नहीं जाएँगे।
    reason: मुख्य पाठ में יִפְּלוּ का प्रसंगगत कानूनी अर्थ दिया गया है; पादटिप्पणी उसका शाब्दिक रूप बताती है।
lexical_decisions:
- source_word: וְהִזִּיר לַיהוָה אֶת יְמֵי נִזְרוֹ
  choice: अपनी नाज़ीर मन्नत के दिनों को फिर से यहोवा के लिए समर्पित करे
  rationale: हिफ़ील क्रिया यहाँ अशुद्धता से बाधित नाज़ीर-अवधि को नए सिरे से आरम्भ करने का भाव देती है। यह अनुवाद पुनःसमर्पण और मन्नत की निश्चित अवधि—दोनों को स्पष्ट करता है।
- source_word: כֶּבֶשׂ בֶּן שְׁנָתוֹ
  choice: एक वर्ष का नर मेमना
  rationale: इब्रानी बलिदानी पदबंध जीवन के पहले वर्ष के नर मेमने को सूचित करता है; हिन्दी में यह स्वाभाविक और विशिष्ट है।
- source_word: לְאָשָׁם
  choice: दोषबलि के रूप में
  rationale: אָשָׁם व्यवस्था में एक निश्चित बलिदानी श्रेणी है; ‘दोषबलि’ परिचित और संक्षिप्त हिन्दी पद है।
- source_word: וְהַיָּמִים הָרִאשֹׁנִים יִפְּלוּ
  choice: पर पहले के दिन व्यर्थ माने जाएँगे
  rationale: शाब्दिक अर्थ ‘पहले दिन गिर जाएँगे’ है, पर कानूनी-रीतिगत संदर्भ में आशय यह है कि वे दिन मन्नत की अवधि में अब नहीं गिने जाएँगे।
- source_word: כִּי טָמֵא נִזְרוֹ
  choice: क्योंकि उसकी नाज़ीर मन्नत अशुद्ध हो गई थी
  rationale: טָמֵא रीतिगत अशुद्धता का परिणाम बताता है। נִזְרוֹ को प्रसंगानुसार ‘नाज़ीर मन्नत’ रखने से अध्याय की संस्था स्पष्ट रहती है।
theological_decisions:
- issue: Numbers 6 में נזר का अनुवाद
  choice: नाज़ीर मन्नत
  alternative: अलगाव; समर्पण
  rationale: मूल धातु समर्पित अलगाव का भाव रखती है, पर इस अध्याय में यह नाज़ीर संस्था और उसकी मन्नत का तकनीकी संकेत है।
- issue: יהוה का प्रतिलेखन
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत नाम को हिन्दी पाठक के लिए प्रचलित बाइबलीय रूप ‘यहोवा’ में रखा गया है, जिससे मूल में उपस्थित नाम और समर्पण की दिशा बनी रहती है।
- issue: יִפְּלוּ का कानूनी प्रभाव
  choice: व्यर्थ माने जाएँगे
  alternative: गिर जाएँगे; गिने नहीं जाएँगे
  rationale: शाब्दिक बिंब को मुख्य पाठ में यांत्रिक रूप से रखने के बजाय उसके प्रसंगगत प्रभाव को व्यक्त किया गया है; पादटिप्पणी मूल अभिव्यक्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज विधानात्मक रूप अपनाया गया है। ‘करे’, ‘लाए’ और ‘माने जाएँगे’ व्यवस्था-संबंधी निर्देश की शैली बनाए रखते हैं; तकनीकी बलिदानी शब्द ‘दोषबलि’ और संस्थागत पद ‘नाज़ीर मन्नत’ सुरक्षित रखे गए हैं।
