  yaml_path: translation/ot/numbers/006/016.yaml
  text: And the priest shall present them before Yahweh and offer his sin offering and his burnt offering[a][b].
translation:
  language: hi
  text: और याजक उन्हें यहोवा के सामने प्रस्तुत करे[a] और उसकी पापबलि[b] और होमबलि चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के सामने उन्हें निकट लाए।” इब्रानी क्रिया वास्तविक बलि चढ़ाने से पहले यहोवा के सामने प्रस्तुत करने पर बल दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “पापबलि” को याजकीय बलिदान की भाषा में “शुद्धिकरण-बलि” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: प्रस्तुत करे
  rationale: हिफ़ील रूप यहाँ बलि-सामग्री को परमेश्वर के सामने निकट लाने या प्रस्तुत करने का भाव देता है; आगे וְעָשָׂה वास्तविक बलि चढ़ाने की क्रिया बताता है, इसलिए दोनों क्रियाओं का भेद रखा गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना और बलिदान के संदर्भ में כֹּהֵן का स्वाभाविक और प्रचलित हिन्दी रूप।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति या सम्मुख होने का भाव व्यक्त करता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से व्यक्त किया गया है।
- source_word: וְעָשָׂה
  choice: चढ़ाए
  rationale: यद्यपि עשה का मूल अर्थ 'करना/बनाना' है, नामित बलियों के साथ यह बलि-विधान संपन्न करने अर्थात बलि चढ़ाने के अर्थ में प्रयुक्त है।
- source_word: אֶת חַטָּאתוֹ
  choice: उसका पापबलि
  rationale: याजकीय बलिदान-संदर्भ में חַטָּאת पाप के लिए चढ़ाई जाने वाली बलि को सूचित करता है; 'शुद्धिकरण-बलि' भी संभव अर्थ है।
- source_word: וְאֶת עֹלָתוֹ
  choice: और होमबलि
  rationale: עֹלָה उस बलि का मानक पद है जो पूरी तरह जलाकर चढ़ाई जाती थी; हिन्दी बाइबलीय प्रयोग में 'होमबलि' संक्षिप्त और परिचित है।
- source_word: implicit object of וְהִקְרִיב
  choice: उन्हें
  rationale: इब्रानी में कर्म निहित है और पिछली आयत की बलि-सामग्री से समझा जाता है; हिन्दी में 'उन्हें' संदर्भ-संबंध बनाए रखते हुए वाक्य को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। आधुनिक हिन्दी के सामान्य पाठकों के लिए स्थापित देवनागरी रूप 'यहोवा' रखा गया है, जबकि उच्चारण का वैकल्पिक पुनर्निर्माण 'याहवे' है।
- issue: חַטָּאת का बलिदान-संबंधी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: पद पाप से संबंधित बलि और शुद्धिकरण-कार्य दोनों को धारण कर सकता है। मुख्य पाठ में परिचित 'पापबलि' रखा गया है और वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। 'प्रस्तुत करे' और 'चढ़ाए' के द्वारा मूल की क्रमिक क्रियाओं का भेद रखा गया है। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न संबंधित पदों पर दिए गए हैं।
