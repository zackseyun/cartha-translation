source:
  edition: WLC
  text: וְ/עָשָׂ֣ה הַ/כֹּהֵ֗ן אֶחָ֤ד לְ/חַטָּאת֙ וְ/אֶחָ֣ד לְ/עֹלָ֔ה וְ/כִפֶּ֣ר עָלָ֔י/ו מֵ/אֲשֶׁ֥ר חָטָ֖א עַל הַ/נָּ֑פֶשׁ וְ/קִדַּ֥שׁ אֶת רֹאשׁ֖/וֹ בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/011.yaml
  text: And the priest shall offer one as a sin offering and one as a burnt offering[a], and he shall make atonement for him because he sinned in regard to the dead person[b], and he shall consecrate his head that same day.
translation:
  language: hi
  text: और याजक एक को पापबलि के रूप में और दूसरे को होमबलि के रूप में चढ़ाए; और वह उस व्यक्ति के लिए प्रायश्चित करे, क्योंकि मरे हुए व्यक्ति के संबंध में उससे पाप हुआ था[a], और उसी दिन उसका सिर पवित्र करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “उस प्राण/व्यक्ति पर।” इस प्रसंग में अभिप्राय मरे हुए व्यक्ति, अर्थात उस शव से है जिसके कारण वह अशुद्ध हुआ।
    reason: cultural_note
lexical_decisions:
- source_word: וְעָשָׂה הַכֹּהֵן
  choice: याजक ... चढ़ाए
  rationale: यद्यपि עשה का मूल अर्थ ‘करना/बनाना’ है, बलिदान-संबंधी संदर्भ में इसका स्वाभाविक अर्थ बलि चढ़ाना है।
- source_word: אֶחָד לְחַטָּאת
  choice: एक पक्षी को पापबलि
  rationale: חַטָּאת यहां बलिदान की श्रेणी को सूचित करता है। ‘पापबलि’ प्रचलित और समझने योग्य पद है; शुद्धिकरण-संबंधी अर्थ पादटिप्पणी में सुरक्षित रखा गया है। संदर्भ से बलि के पशु पक्षी हैं।
- source_word: וְאֶחָד לְעֹלָה
  choice: दूसरे को होमबलि के रूप में
  rationale: עֹלָה पूर्णतः जलाई जाने वाली बलि का पारंपरिक पद है; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और परिचित है।
- source_word: וְכִפֶּר עָלָיו
  choice: उस व्यक्ति के लिए प्रायश्चित करे
  rationale: पुरोहितीय संदर्भ में כפר के धार्मिक और अनुष्ठानिक अर्थ को बनाए रखता है, बिना प्रायश्चित के किसी विशिष्ट सिद्धान्त को आरोपित किए।
- source_word: מֵאֲשֶׁר חָטָא עַל הַנָּפֶשׁ
  choice: क्योंकि मरे हुए व्यक्ति के कारण उससे पाप हुआ था
  rationale: נֶפֶשׁ इस प्रसंग में मृत व्यक्ति को सूचित करता है। ‘से पाप हुआ’ अनपेक्षित शव-संपर्क के प्रसंग में दोष को अनावश्यक रूप से जानबूझकर किए गए नैतिक अपराध के रूप में प्रस्तुत नहीं करता।
- source_word: וְקִדַּשׁ אֶת רֹאשׁוֹ
  choice: अपने सिर को फिर से पवित्र करे
  rationale: क्रिया स्वयं ‘पवित्र करे’ कहती है, जबकि पिछले अपवित्रीकरण के बाद नाज़ीर की समर्पित अवस्था के नवीकरण को ‘फिर से’ संदर्भानुसार स्पष्ट करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: कालवाचक पद की निकटता और अनुष्ठान की तत्कालता को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: חַטָּאת का बलिदान-संबंधी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह पद पाप से संबंधित बलि और अशुद्धता दूर करने वाली शुद्धिकरण-बलि—दोनों पहलुओं को धारण कर सकता है। मुख्य पाठ में परिचित पद रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
- issue: הַנָּפֶשׁ का अभिप्राय
  choice: मरा हुआ व्यक्ति
  alternative: शव
  rationale: आसपास के नाज़ीर-विधान में यह मृत मानव देह को सूचित करता है। ‘मरा हुआ व्यक्ति’ मानवीय संदर्भ बनाए रखता है, जबकि पादटिप्पणी अनुष्ठानिक अशुद्धता का आशय स्पष्ट करती है।
- issue: חָטָא और अनपेक्षित शव-संपर्क
  choice: उससे पाप हुआ था
  alternative: उसने पाप किया था
  rationale: मूल में חטא प्रयुक्त है और उसका धार्मिक भार बनाए रखना आवश्यक है; फिर भी पद 9 के आकस्मिक मृत्यु-संदर्भ में हिन्दी की अकर्मक अभिव्यक्ति जानबूझकर नैतिक अपराध का अतिरिक्त अर्थ नहीं जोड़ती।
- issue: सिर को पवित्र करने का नवीकरण
  choice: फिर से पवित्र करे
  alternative: पवित्र करे
  rationale: ‘फिर से’ प्रसंगगत नवीकरण को स्पष्ट करता है, यद्यपि हिब्रू क्रिया में यह उपसर्ग अलग से नहीं है। इससे नाज़ीर-व्रत के पुनः आरम्भ का संबंध अगले पद से सहज बनता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। ‘याजक’, ‘पापबलि’, ‘होमबलि’ और ‘प्रायश्चित’ जैसे स्थापित धार्मिक पद रखे गए हैं। विधिक आदेश के लिए सम्मानसूचक एकवचन क्रियारूप ‘चढ़ाए/करे’ प्रयुक्त हुए हैं।
