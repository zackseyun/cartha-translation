- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: समर्पण या संबंध सूचित करने वाले ל को स्वाभाविक हिन्दी में व्यक्त करता है और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी में प्रचलित बाइबलीय रूप ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; इसे केवल उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: नाज़ीर-संबंधी נִזְרוֹ का अर्थ
  choice: नाज़ीर के रूप में अलग रहने की अवधि
  alternative: उसकी नाज़ीर मन्नत / उसका समर्पण
  rationale: संदर्भ में बल नाज़ीर की अलग की हुई अवस्था के समस्त दिनों पर है। यह चयन मन्नत और उससे उत्पन्न पवित्र अवस्था को अनावश्यक रूप से एक नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए बोधगम्य। ‘नाज़ीर’ संदर्भ-विशिष्ट पद के रूप में रखा गया है और साथ में ‘अलग रहे’ कहकर उसका आशय स्पष्ट किया गया है।
