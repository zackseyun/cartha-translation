lexical_decisions:
- source_word: כֹּל יְמֵי
  choice: जितने दिन ... उतने दिन
  rationale: यह स्वाभाविक हिन्दी में पूरी समयावधि को समेटते हुए इब्रानी के व्यापक अर्थ को सुरक्षित रखता है।
- source_word: נִזְרוֹ
  choice: वह नाज़ीर के रूप में अलग रहे
  rationale: यह नाज़ीर के रूप में अलग किए जाने की अवस्था और अवधि को व्यक्त करता है; केवल मन्नत की क्रिया तक अर्थ को सीमित नहीं करता।
- source_word: קָדֹשׁ הוּא
  choice: वह ... पवित्र है
