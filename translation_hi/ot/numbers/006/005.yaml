source:
  edition: WLC
  text: כָּל יְמֵי֙ נֶ֣דֶר נִזְר֔/וֹ תַּ֖עַר לֹא יַעֲבֹ֣ר עַל רֹאשׁ֑/וֹ עַד מְלֹ֨את הַ/יָּמִ֜ם אֲשֶׁר יַזִּ֤יר לַ/יהוָה֙ קָדֹ֣שׁ יִהְיֶ֔ה גַּדֵּ֥ל פֶּ֖רַע שְׂעַ֥ר רֹאשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/005.yaml
  text: All the days of his Nazirite vow[a], no razor shall pass over his head. Until the days are completed for which he separates himself to Yahweh, he shall be holy[b]; he shall let the locks of the hair of his head grow long.
translation:
  language: hi
  text: “अपनी नाज़ीर-मन्नत[a] के पूरे समय उसके सिर पर उस्तरा न फिरे[b]। जब तक वे दिन पूरे न हो जाएँ, जिनके लिए वह याहवे के लिए अपने को अलग रखता है, वह पवित्र रहेगा; वह अपने सिर के बाल बढ़ने देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अलगाव की मन्नत।” “नाज़ीर” से संबंधित इब्रानी शब्द में अलग किए जाने और समर्पित होने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसके सिर पर से उस्तरा न गुज़रे”; अर्थात वह अपने सिर के बाल न मुँडाए।
    reason: idiom_clarification
lexical_decisions:
- source_word: נֶדֶר נִזְרוֹ
  choice: नाज़ीर होने की मन्नत
  rationale: यह पद की तकनीकी नाज़ीर-विषयक भाषा को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है। साथ ही पादटिप्पणी मूल धातु में निहित अलगाव/समर्पण के भाव को स्पष्ट करती है।
- source_word: תַּעַר לֹא יַעֲבֹר עַל רֹאשׁוֹ
  choice: उसके सिर पर उस्तरा न चले
  rationale: यह हिन्दी का स्वाभाविक निषेधात्मक मुहावरा है और इब्रानी के ‘उस्तरा सिर पर से न गुज़रे’ वाले ठोस चित्र को भी पर्याप्त रूप से सुरक्षित रखता है।
- source_word: עַד מְלֹאת הַיָּמִים
  choice: जब तक वे दिन पूरे न हो जाएँ
  rationale: מלא के पूर्ण होने के भाव और मन्नत की निर्धारित अवधि, दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר יַזִּיר לַיהוָה
  choice: जिनके लिए वह अपने आपको याहवे के लिए अलग करता है
  rationale: नזר के मूल अलगाव/समर्पण के भाव को बनाए रखता है और उसे केवल किसी संप्रदायगत संस्कार के अर्थ में सीमित नहीं करता।
- source_word: קָדֹשׁ יִהְיֶה
  choice: वह पवित्र रहे
  rationale: קדוש के प्रत्यक्ष और धर्मवैज्ञानिक रूप से महत्त्वपूर्ण अर्थ ‘पवित्र’ को सुरक्षित रखता है; विधिक प्रसंग में ‘रहे’ निरंतर अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גַּדֵּל פֶּרַע שְׂעַר רֹאשׁוֹ
  choice: वह अपने सिर के बालों को लंबा बढ़ने दे
  rationale: גַּדֵּל के ‘बढ़ने देना’ और פֶרַע के बिना काटे लंबे होते बालों के भाव को सरल आधुनिक हिन्दी में संप्रेषित करता है।
theological_decisions:
- issue: वाचा के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम प्रत्यक्ष रूप से है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: קדוש को धर्मवैज्ञानिक शब्द के रूप में रखना
  choice: वह पवित्र रहे
  alternative: वह समर्पित रहे / वह अलग ठहराया जाए
  rationale: मूल में स्पष्टतः קדוש है। ‘पवित्र’ उसकी धर्मवैज्ञानिक गंभीरता बनाए रखता है, जबकि निकटवर्ती वाक्य नाज़ीर के अलगाव का स्वरूप बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘नाज़ीर’ तकनीकी बाइबलीय पद के रूप में रखा गया है और पादटिप्पणी में उसका मूल भाव समझाया गया है। मुख्य पाठ में इब्रानी मुहावरे का स्वाभाविक हिन्दी समकक्ष दिया गया है।
