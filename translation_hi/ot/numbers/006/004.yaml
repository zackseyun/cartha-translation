source:
  edition: WLC
  text: כֹּ֖ל יְמֵ֣י נִזְר֑/וֹ מִ/כֹּל֩ אֲשֶׁ֨ר יֵעָשֶׂ֜ה מִ/גֶּ֣פֶן הַ/יַּ֗יִן מֵ/חַרְצַנִּ֛ים וְ/עַד זָ֖ג לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/004.yaml
  text: All the days of his Nazirite vow[a], he shall not eat anything that is made from the grapevine, from the seeds to the skin.
translation:
  language: hi
  text: अपने नाज़ीर-व्रत के पूरे समय वह अंगूर की बेल से बनी कोई भी वस्तु—बीज से लेकर छिलके तक[a]—न खाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “बीजों से लेकर छिलके तक”; यह अंगूर के हर भाग को समेटने वाली अभिव्यक्ति है।
    reason: मूल भाषा की समावेशी अभिव्यक्ति और उसके शाब्दिक रूप को स्पष्ट करना।
lexical_decisions:
- source_word: נִזְרוֹ
  choice: अपने नाज़ीर-व्रत
  rationale: नֵזֶר मूलतः अलग किए जाने या समर्पण की दशा को सूचित कर सकता है, पर गिनती 6 के विधिक संदर्भ में यह विशेष रूप से नाज़ीर की मन्नत और उससे जुड़ी अवस्था को दर्शाता है। ‘नाज़ीर-व्रत’ इस पारिभाषिक अर्थ को संक्षेप और स्पष्ट रूप में रखता है।
- source_word: כֹּל יְמֵי
  choice: के पूरे समय
  rationale: यह पदबंध व्रत की संपूर्ण अवधि बताता है। आधुनिक हिन्दी में ‘के पूरे समय’ स्वाभाविक है और ‘सभी दिनों’ के अर्थ को सुरक्षित रखता है।
- source_word: מִכֹּל אֲשֶׁר יֵעָשֶׂה
  choice: से बनी कोई भी वस्तु
  rationale: מִן के साथ כֹּל निषिद्ध वस्तुओं की पूरी श्रेणी प्रस्तुत करता है, जबकि बाद का निषेध आज्ञा का बल देता है। हिन्दी में इसे ‘कोई भी वस्तु ... न खाए’ कहना स्पष्ट और स्वाभाविक है।
- source_word: מִגֶּפֶן הַיַּיִן
  choice: अंगूर की बेल से
  rationale: शाब्दिक रूप ‘दाखमधु की बेल’ है, पर यह अंगूर की बेल के लिए प्रयुक्त इब्रानी अभिव्यक्ति है। ‘अंगूर की बेल’ सामान्य आधुनिक हिन्दी में सटीक और सहज है।
- source_word: מֵחַרְצַנִּים וְעַד זָג
  choice: बीज से लेकर छिलके तक
  rationale: חַרְצַנִּים अंगूर के बीजों और זָג उसके छिलके को दर्शाता है। ‘से लेकर ... तक’ मूल के समावेशी विस्तार को बनाए रखता है और अंगूर के प्रत्येक भाग के निषेध का संकेत देता है।
- source_word: לֹא יֹאכֵל
  choice: न खाए
  rationale: विधिक प्रसंग में निषेधयुक्त अपूर्ण क्रिया आदेशात्मक निषेध व्यक्त करती है। ‘न खाए’ हिन्दी में संक्षिप्त, गरिमापूर्ण और विधिक बल के अनुकूल है।
theological_decisions:
- issue: נִזְרוֹ में अलगाव/समर्पण और नाज़ीर की पारिभाषिक अवस्था का संबंध
  choice: नाज़ीर-व्रत
  alternative: उसके अलग रहने/समर्पण के दिन
  rationale: तात्कालिक प्रसंग नाज़ीर-व्रत के नियमों का है; इसलिए पारिभाषिक संस्था को स्पष्ट करना उचित है। फिर भी अनुवाद इसे किसी विशेष सम्प्रदाय की व्याख्या से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘नाज़ीर-व्रत’ पारिभाषिक शब्द है; शेष वाक्य साधारण पाठक के लिए सहज रखा गया है। डैश निषिद्ध वस्तु की पूरी सीमा—बीज से छिलके तक—को स्पष्ट रूप से अलग करता है।
