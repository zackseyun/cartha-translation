lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रमिक रूप कथा में अगला चरण आरम्भ करता है। हिन्दी में ‘फिर’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है; לֵאמֹר के साथ अनावश्यक दोहराव से बचने के लिए मुख्य क्रिया को ‘कहा’ किया गया है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम YHWH को हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: भाषण की दिशा बताने वाले אֶל का स्वाभाविक हिन्दी प्रयोग ‘मूसा से कहा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह infinitive construct आगामी प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘से कहा’ अगले पद के कथन को स्वाभाविक रूप से खोलता है; ‘यह कहते हुए’ अधिक शाब्दिक पर कम सहज होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी नाम सीधे प्रयुक्त है। ‘यहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
