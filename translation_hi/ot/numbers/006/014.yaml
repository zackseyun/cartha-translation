id: NUM.6.14
reference: Numbers 6:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרִ֣יב אֶת קָרְבָּנ֣/וֹ לַ/יהוָ֡ה כֶּבֶשׂ֩ בֶּן שְׁנָת֨/וֹ תָמִ֤ים אֶחָד֙ לְ/עֹלָ֔ה וְ/כַבְשָׂ֨ה אַחַ֧ת בַּת שְׁנָתָ֛/הּ תְּמִימָ֖ה לְ/חַטָּ֑את וְ/אַֽיִל אֶחָ֥ד תָּמִ֖ים לִ/שְׁלָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/014.yaml
  text: 'and he shall present his offering to Yahweh: one year-old male lamb without blemish for a burnt offering[a], and one year-old ewe lamb without blemish for a sin offering, and one ram without blemish for peace offerings[b],'
translation:
  language: hi
  text: 'और वह याहवे के लिए अपना चढ़ावा प्रस्तुत करे: होमबलि के लिए एक वर्ष का दोषरहित नर मेमना, पापबलि[a] के लिए एक वर्ष की दोषरहित मेमनी, और मेलबलियों[b] के लिए एक दोषरहित मेढ़ा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धीकरण-बलि।” इब्रानी शब्द חַטָּאת पाप तथा अशुद्धता या अपराध से शुद्ध करने वाले बलिदान—दोनों को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: या “कुशल-बलियाँ” अथवा “सहभागिता-बलियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: और वह ... प्रस्तुत करे
  rationale: हिफ़ील रूप बलिदान-संदर्भ में किसी चढ़ावे को निकट लाने या प्रस्तुत करने का निर्देश देता है; विधिक शैली में संभावनार्थक क्रिया स्वाभाविक है।
- source_word: קָרְבָּנוֹ
  choice: अपना चढ़ावा
  rationale: यह परमेश्वर के सामने लाई जाने वाली बलिदानी भेंट का व्यापक पद है; ‘चढ़ावा’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: इब्रानी में परमेश्वर का विशिष्ट नाम יהוה है। यहाँ ל को बलिदानी प्रस्तुति के प्रसंग में स्वाभाविक हिन्दी ‘के सामने’ से व्यक्त किया गया है।
- source_word: כֶּבֶשׂ ... בֶּן שְׁנָתוֹ
  choice: एक वर्ष का एक ... नर मेमना
  rationale: כֶּבֶשׂ नर मेमना है और בֶּן שְׁנָתוֹ उसकी आयु एक वर्ष बताता है; हिन्दी क्रम लिंग और आयु दोनों स्पष्ट रखता है।
- source_word: תָמִים / תְּמִימָה
  choice: निर्दोष
  rationale: बलिदानी विधान में इसका अर्थ शारीरिक दोष से रहित पशु है; ‘निर्दोष’ प्रचलित, संक्षिप्त और प्रसंगानुकूल है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलिदान की स्थापित श्रेणी है जो वेदी पर पूर्णतः जलाया जाता है; हिन्दी बाइबलीय प्रयोग में ‘होमबलि’ सटीक और परिचित है।
- source_word: וְכַבְשָׂה ... בַּת שְׁנָתָהּ
  choice: एक वर्ष की एक ... मादा मेमनी
  rationale: כַבְשָׂה स्पष्टतः मादा मेमना है और स्त्रीलिंग आयु-वाक्यांश को ‘एक वर्ष की’ से सुरक्षित रखा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि
  rationale: חַטָּאת पाप और शुद्धीकरण से संबद्ध बलिदानी श्रेणी का नाम है; मुख्य पाठ में पहचाना हुआ ‘पापबलि’ रखा गया और दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְאַיִל אֶחָד
  choice: एक ... मेढ़ा
  rationale: אַיִל वयस्क नर भेड़ अर्थात मेढ़े को निर्दिष्ट करता है; संख्या ‘एक’ भी सुरक्षित है।
- source_word: לִשְׁלָמִים
  choice: मेलबलियों के लिए
  rationale: שְׁלָמִים बहुवचन बलिदानी श्रेणी है जिसमें शांति, कुशलता और सहभागिता के अर्थ जुड़े हैं; ‘मेलबलि’ संक्षिप्त मुख्य-पाठ विकल्प है और अन्य अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि वाचा का विशिष्ट नाम है। हिन्दी के व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ द्वारा नाम को नाम ही रखा गया है।
- issue: חַטָּאת की बलिदानी संज्ञा
  choice: पापबलि
  alternative: शुद्धीकरण-बलि
  rationale: पद मानक बलिदानों की सूची देता है, इसलिए परिचित ‘पापबलि’ मुख्य पाठ में उचित है; फिर भी शुद्धीकरण का कार्यात्मक अर्थ वास्तविक है और पादटिप्पणी में संरक्षित है।
- issue: שְׁלָמִים की अर्थ-व्याप्ति
  choice: मेलबलि
  alternative: कुशल-बलि या सहभागिता-बलि
  rationale: इब्रानी पद शांति, कल्याण और संगति की परस्पर जुड़ी धारणाएँ रखता है। मुख्य पाठ किसी एक व्याख्या को अत्यधिक विस्तार नहीं देता, जबकि पादटिप्पणी अर्थ-विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुरूप रखी गई है। पशुओं की आयु, लिंग, संख्या और निर्दोष होने की शर्त स्पष्ट रूप से सुरक्षित हैं; बलिदानी तकनीकी पदों के कठिन अर्थ-विकल्प पादटिप्पणियों में दिए गए हैं।
