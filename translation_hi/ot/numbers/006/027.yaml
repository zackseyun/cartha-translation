  text: וְ/שָׂמ֥וּ אֶת שְׁמִ֖/י עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וַ/אֲנִ֖י אֲבָרֲכֵֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/027.yaml
  text: So they shall put my name on the sons of Israel[b][a], and I myself will bless them.
translation:
  language: hi
  text: इस प्रकार वे मेरा नाम इस्राएल के पुत्रों पर रखेंगे[a][b], और मैं स्वयं उन्हें आशीष दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, ‘इस्राएलियों’ या ‘इस्राएल के लोगों’; इब्रानी में शाब्दिक रूप से, ‘इस्राएल के पुत्र’।
    reason: lexical_alternative
  - marker: b
    text: ‘मेरा नाम ... पर रखना’ सम्भवतः उन पर यहोवा के वाचा-नाम का आह्वान करने और उन्हें उसके अपने लोगों के रूप में चिह्नित करने का भाव व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׂמוּ
  choice: इस प्रकार वे ... रखेंगे
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। आरम्भिक וְ को यहाँ पिछले याजकीय आशीर्वाद के परिणाम से जोड़ने के लिए ‘इस प्रकार’ कहा गया है, और क्रिया का भाव भविष्यसूचक निर्देश के रूप में रखा गया है।
- source_word: אֶת שְׁמִי
  choice: मेरा नाम
  rationale: ‘नाम’ को शाब्दिक रखा गया है, क्योंकि इसमें वाचा, प्रतिनिधित्व और संबंध की अर्थ-समृद्धि है; ‘मेरा अधिकार’ या ‘मेरी आशीष’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
- source_word: עַל
  choice: पर
  rationale: 'इस ठोस रूपक में עַל का स्वाभाविक हिन्दी प्रतिरूप ‘पर’ है: परमेश्वर का नाम लोगों पर रखा जाता है।'
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का निकट, औपचारिक प्रतिरूप है और पंचग्रन्थ में प्रयुक्त वाचागत जातिनाम की निरन्तरता बनाए रखता है; प्रसंग में यह पूरे इस्राएली समुदाय को सूचित करता है।
- source_word: וַאֲנִי
  choice: और मैं स्वयं
  rationale: स्वतंत्र सर्वनाम אֲנִי कर्ता पर बल देता है। ‘मैं स्वयं’ उसी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲבָרֲכֵם
  choice: उन्हें आशीष दूँगा
  rationale: ברך का अर्थ ‘आशीष देना’ है। ‘दूँगा’ परमेश्वर की प्रतिज्ञात भावी क्रिया को व्यक्त करता है, और ‘उन्हें’ का संकेत इस्राएल के पुत्रों की ओर है।
theological_decisions:
- issue: परमेश्वर का नाम इस्राएल पर रखने का अर्थ
  choice: ‘मेरा नाम ... पर रखेंगे’ ठोस वाचागत अभिव्यक्ति को बनाए रखा गया।
  alternative: ‘मेरे नाम का आह्वान करेंगे’ अथवा ‘उन्हें मेरे अपने लोग ठहराएँगे।’
  rationale: यह पद सम्भवतः यहोवा के वाचा-नाम के आह्वान, उसकी स्वामित्व-छाप और उसके आशीर्वाद को समेटता है; पर मूल पाठ इन बातों को एक रूपक में खुला रखता है। इसलिए अनुवाद किसी एक व्याख्या में इसे सीमित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का निर्वचन
  choice: ‘इस्राएल के पुत्रों’
  alternative: ‘इस्राएलियों’ अथवा ‘इस्राएल के लोगों।’
  rationale: मूल पद व्याकरणतः पुल्लिंग बहुवचन वाला पारम्परिक वाचागत जातिनाम है। शाब्दिक रूप संरक्षित है, जबकि पादटिप्पणी स्पष्ट करती है कि संकेत पूरे समुदाय की ओर है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आशीष दूँगा’ बाइबलीय हिन्दी में परिचित होते हुए भी सहज है। मूल रूपक और ‘मैं स्वयं’ का बल सुरक्षित रखा गया है।
