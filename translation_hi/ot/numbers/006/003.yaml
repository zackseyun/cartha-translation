  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/יַּ֤יִן וְ/שֵׁכָר֙ יַזִּ֔יר חֹ֥מֶץ יַ֛יִן וְ/חֹ֥מֶץ שֵׁכָ֖ר לֹ֣א יִשְׁתֶּ֑ה וְ/כָל מִשְׁרַ֤ת עֲנָבִים֙ לֹ֣א יִשְׁתֶּ֔ה וַ/עֲנָבִ֛ים לַחִ֥ים וִ/יבֵשִׁ֖ים לֹ֥א יֹאכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/006/003.yaml
  text: he shall abstain from wine and strong drink[a]; he shall not drink vinegar made from wine or vinegar made from strong drink, and he shall not drink any juice of grapes or eat grapes[b], fresh or dried.
translation:
  language: hi
  text: वह दाखमधु और मादक पेय से दूर रहे; वह न तो दाखमधु से बना सिरका पिए, न मादक पेय से बना सिरका। वह अंगूरों का कोई रस[a] न पिए और न ताज़े या सूखे अंगूर[b] खाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अंगूरों को भिगोकर निकाला गया कोई द्रव।” इब्रानी शब्द भिगोए या संसाधित अंगूरों से प्राप्त द्रव को व्यापक रूप से सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “अंगूर, ताज़े और सूखे” है; सूखे अंगूर किशमिश हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִיַּיִן וְשֵׁכָר יַזִּיר
  choice: दाखमधु और मादक पेय से दूर रहे
  rationale: יַיִן सामान्यतः अंगूर से बनी मदिरा है, इसलिए ‘दाखमधु’ चुना गया। שֵׁכָר उससे अलग मादक पेय को दर्शाता है। नज़र-व्रत के इस संदर्भ में נזר के हिफ़ील रूप का स्वाभाविक अर्थ ‘से दूर रहना/परहेज़ करना’ है।
- source_word: חֹמֶץ יַיִן וְחֹמֶץ שֵׁכָר
  choice: दाखमधु से बना सिरका ... मादक पेय से बना सिरका
  rationale: חֹמֶץ खट्टे या सिरका बने पेय को सूचित करता है। ‘से बना सिरका’ संबंध को स्पष्ट करता है और दोनों समानांतर पदों की संरचना बनाए रखता है।
- source_word: וְכָל מִשְׁרַת עֲנָבִים
  choice: अंगूरों का कोई रस
  rationale: מִשְׁרָה भिगोने या संसाधित करने से निकले द्रव को सूचित कर सकता है। ‘अंगूरों का कोई रस’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी मूल शब्द की व्यापक संभाव्यता सुरक्षित रखती है।
- source_word: וַעֲנָבִים לַחִים וִיבֵשִׁים
  choice: ताज़े या सूखे अंगूर
  rationale: לַחִים और יְבֵשִׁים यहाँ ताज़े/नम और सूखे अंगूरों का विरोधी युग्म हैं। निषेध के हिंदी वाक्य में ‘या’ दोनों श्रेणियों पर लागू निषेध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא יִשְׁתֶּה ... לֹא יֹאכֵל
  choice: न पिए ... न ... खाए
  rationale: दोनों स्पष्ट निषेधों को आधुनिक और गरिमापूर्ण हिंदी में सीधे रखा गया है।
