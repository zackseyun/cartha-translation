  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: hi
  text: होमबलि के लिए झुंड में से एक बैल, एक मेढ़ा और एक वर्ष का एक नर मेमना;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: झुंड में से एक बैल
  rationale: פַּר का स्वाभाविक अर्थ ‘बैल’ है और בֶּן בָּקָר उसे गोवंश के पशु के रूप में वर्गीकृत करता है। ‘झुंड में से’ इब्रानी मुहावरे को असहज शब्दशः रूप दिए बिना यह सूचना बनाए रखता है।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל बलिदान-संबंधी प्रसंग में वयस्क नर भेड़ को दर्शाता है; ‘मेढ़ा’ इसका प्रचलित और स्पष्ट हिन्दी पर्याय है।
- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ नर मेमने को दर्शाता है; ‘नर मेमना’ मूल में निहित लिंग-भेद को स्पष्ट रखता है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह इब्रानी मुहावरा पशु की आयु बताता है। ‘एक वर्ष का’ सहज आधुनिक हिन्दी है और आयु की अपेक्षा को ठीक प्रकार व्यक्त करता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक पद है जो वेदी पर पूर्णतः जलाई जाती थी। ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और परिचित तकनीकी शब्द है।
- source_word: אֶחָד
  choice: एक
  rationale: प्रत्येक पशु के साथ दोहराया गया अंक बलि-सूची की गणनात्मक संरचना बनाता है; हिन्दी में ‘एक’ की पुनरावृत्ति इसे सुरक्षित रखती है।
