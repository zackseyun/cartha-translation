  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/041.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old[b]. This was the offering of Shelumiel son of Zurishaddai.'
translation:
  language: hi
  text: और शान्ति-बलि[a] के लिए दो गौवंशी पशु[b], पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच नर मेमने। यह सूरीशद्दै के पुत्र शलूमीएल का चढ़ावा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेलबलि’ अथवा ‘कुशल-बलि’।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ व्यापक रूप से गाय-बैल या गौवंश है; कुछ अनुवाद यहाँ ‘दो बैल’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: यह पदबंध चढ़ावों की सूची में अगली बलि को प्रस्तुत करता है। हिन्दी में ‘मेलबलि’ प्रचलित, संक्षिप्त और इस विशिष्ट बलि-श्रेणी को व्यक्त करने वाला शब्द है; ‘बलि के बलिदान’ जैसी पुनरुक्ति से बचा गया है।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गौवंशी पशु
  rationale: בָּקָר सामूहिक और व्यापक शब्द है, जो केवल नर बैलों तक सीमित नहीं है। ‘गौवंशी पशु’ लिंग को अनिर्धारित रखते हुए हिन्दी में संख्या के साथ स्वाभाविक रूप देता है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם बलि-संदर्भ में वयस्क नर भेड़ों को दर्शाता है; ‘मेढ़े’ इसका सहज हिन्दी समतुल्य है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים विशेष रूप से नर बकरों को दर्शाता है; ‘बकरे’ लिंग-सूचना को स्पष्ट रखता है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच नर मेमने
  rationale: כְּבָשִׂים में नर मेमनों का भाव है और בְּנֵי שָׁנָה उनकी आयु बताता है। हिन्दी वाक्य-विन्यास में संख्या, आयु और लिंग तीनों सुरक्षित रखे गए हैं।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: यह दोहराया जाने वाला वर्णनात्मक सूत्र है। कथा-संदर्भ के अनुरूप भूतकाल और קָרְבַּן के लिए सामान्य, सुबोध ‘चढ़ावा’ चुना गया है।
- source_word: שְׁלֻמִיאֵל בֶּן צוּרִישַׁדָּי
  choice: सूरीशद्दै के पुत्र शलूमीएल
  rationale: वंश-सूचक संबंध को हिन्दी के स्वाभाविक क्रम में रखा गया है और इब्रानी नामों का ध्वन्यात्मक देवनागरी लिप्यंतरण किया गया है।
theological_decisions:
- issue: שְׁלָמִים की बलि-श्रेणी का अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि; कुशल-बलि
  rationale: इब्रानी शब्द में शान्ति, कुशलता और सहभागिता से जुड़े अर्थ-संकेत हैं। ‘मेलबलि’ हिन्दी में इस सामुदायिक/संबंधपरक पक्ष को सहजता से व्यक्त करता है, जबकि पाद-टिप्पणी वैकल्पिक अर्थों को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुरूप संक्षिप्त रखी गई है। बलि-संबंधी पारिभाषिकता को सामान्य पाठक के लिए सुबोध बनाया गया है और जहाँ मूल शब्द अधिक व्यापक है वहाँ पाद-टिप्पणी द्वारा वास्तविक अर्थ-सीमा सुरक्षित रखी गई है।
