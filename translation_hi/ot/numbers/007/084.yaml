source:
  edition: WLC
  text: זֹ֣את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֗חַ בְּ/יוֹם֙ הִמָּשַׁ֣ח אֹת֔/וֹ מֵ/אֵ֖ת נְשִׂיאֵ֣י יִשְׂרָאֵ֑ל קַעֲרֹ֨ת כֶּ֜סֶף שְׁתֵּ֣ים עֶשְׂרֵ֗ה מִֽזְרְקֵי כֶ֨סֶף֙ שְׁנֵ֣ים עָשָׂ֔ר כַּפּ֥וֹת זָהָ֖ב שְׁתֵּ֥ים עֶשְׂרֵֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/084.yaml
  text: 'This was the dedication offering of the altar on the day it was anointed[a], from the leaders of Israel: twelve silver dishes, twelve silver bowls[c][b], and twelve gold pans.'
translation:
  language: hi
  text: 'यह उस दिन वेदी के समर्पण की भेंट[a] थी, जिस दिन उसका अभिषेक किया गया था—इस्राएल के प्रधानों की ओर से: चाँदी के बारह थाल, चाँदी के बारह कटोरे और सोने की बारह करछुलें[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “यह वेदी का समर्पण था।” प्रसंग में यह पहले चढ़ाई गई भेंटों का सारांश है।'
    reason: lexical_alternative
  - marker: b
    text: इन पात्रों के नामों का अनुवाद “चाँदी की परातें,” “चाँदी के पात्र,” और “सोने की कटोरियाँ/चम्मच” भी किया जा सकता है। इसी अध्याय के अनुसार सोने के ये पात्र धूप से भरे थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת חֲנֻכַּת הַמִּזְבֵּחַ
  choice: उसके समर्पण के लिए यह भेंट दी गई
  rationale: शाब्दिक अर्थ ‘यह वेदी का समर्पण था/है’ हो सकता है, पर सूची के बाद का सारांश प्रसंग उन वस्तुओं को समर्पण-भेंट के रूप में प्रस्तुत करता है; हिंदी में यह वाक्य स्वाभाविक और स्पष्ट है।
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: जिस दिन वेदी का अभिषेक किया गया
  rationale: निष्क्रिय क्रिया और कालसूचक रचना को स्पष्ट आधुनिक हिंदी में रखा गया है; सर्वनाम का संदर्भ वेदी से है।
- source_word: מֵאֵת נְשִׂיאֵי יִשְׂרָאֵל
  choice: इस्राएल के प्रधानों की ओर से
  rationale: נָשִׂיא यहाँ मान्य गोत्रीय अगुओं को सूचित करता है। ‘प्रधान’ आधुनिक हिंदी में पद और नेतृत्व दोनों को व्यक्त करता है तथा राजवंशीय ‘राजकुमार’ का भ्रामक भाव नहीं लाता।
- source_word: קַעֲרֹת כֶּסֶף
  choice: चाँदी के थाल
  rationale: קַעֲרָה चौड़े थाल या परात जैसे पात्र को सूचित करता है और अगले पात्र से भेद बनाए रखता है।
- source_word: מִזְרְקֵי כֶסֶף
  choice: चाँदी के कटोरे
  rationale: מִזְרָק अनुष्ठान में प्रयुक्त कटोरे या पात्र के लिए है; ‘कटोरे’ सहज आधुनिक हिंदी है।
- source_word: כַּפּוֹת זָהָב
  choice: सोने की धूपदानियाँ
  rationale: इसी अध्याय में ये सोने के כַּפּוֹת धूप से भरे बताए गए हैं; इसलिए प्रसंगानुकूल कार्यात्मक अनुवाद ‘धूपदानियाँ’ सामान्य पाठक को पात्र की भूमिका स्पष्ट करता है, जबकि उसका ठीक आकार अनिश्चित है।
- source_word: שְׁתֵּים עֶשְׂרֵה / שְׁנֵים עָשָׂר
  choice: बारह
  rationale: तीनों प्रकार के पात्रों की संख्या बारह है; हिब्रू का व्याकरणिक लिंग हिंदी अनुवाद में अलग अर्थ नहीं बनाता।
