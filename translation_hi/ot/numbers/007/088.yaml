id: NUM.7.88
reference: Numbers 7:88
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֹ֞ל בְּקַ֣ר זֶ֣בַח הַ/שְּׁלָמִ֗ים עֶשְׂרִ֣ים וְ/אַרְבָּעָה֮ פָּרִים֒ אֵילִ֤ם שִׁשִּׁים֙ עַתֻּדִ֣ים שִׁשִּׁ֔ים כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה שִׁשִּׁ֑ים זֹ֚את חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ אַחֲרֵ֖י הִמָּשַׁ֥ח אֹתֽ/וֹ׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/088.yaml
  text: And all the cattle for the sacrifice of peace offerings were twenty-four bulls[a], sixty rams, sixty male goats, and sixty one-year-old lambs. This was the dedication of the altar after it had been anointed.
translation:
  language: hi
  text: और मेलबलि[a] के लिए कुल चौबीस बैल, साठ मेढ़े, साठ बकरे और एक वर्ष के साठ मेमने थे। वेदी का अभिषेक किए जाने के बाद यह उसका समर्पण था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शांति-बलि’ अथवा ‘कल्याण की बलि’।
    reason: שְׁלָמִים में मेल, शांति, संपूर्णता और कल्याण से जुड़े अर्थ-संकेत हैं; हिन्दी में एक ही पद इन सभी को पूरी तरह व्यक्त नहीं करता।
lexical_decisions:
- source_word: וְכֹל בְּקַר
  choice: और ... कुल ... बैल
  rationale: וְ का संबंधसूचक भाव ‘और’ से रखा गया है। בְּקַר गोवंश के लिए सामूहिक शब्द है; संख्या के साथ आए פָּרִים को स्वाभाविक हिन्दी में ‘बैल’ कहा गया और כֹל का कुल-सूचक भाव ‘कुल’ से व्यक्त किया गया।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: मेलबलि
  rationale: यह विशिष्ट बलिदान-श्रेणी है। ‘मेलबलि’ भोजन, सहभागिता और मेल के भाव को संक्षेप में व्यक्त करता है; मूल शब्द की शांति/कल्याण संबंधी व्यापकता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: פָּרִים
  choice: बैल
  rationale: बलिदान के संदर्भ में פַּר के पुल्लिंग गोवंशीय अर्थ का स्पष्ट और स्वाभाविक हिन्दी रूप। मूल पाठ यहाँ ‘जवान’ आयु स्पष्ट नहीं करता।
- source_word: אֵילִם
  choice: मेढ़े
  rationale: वयस्क नर भेड़ों के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: עַתֻּדִים
  choice: बकरे
  rationale: यह नर बकरों को दर्शाता है; ‘बकरे’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: एक वर्ष के ... मेमने
  rationale: शाब्दिक आयु-सूचना को बनाए रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: वेदी का ... समर्पण
  rationale: חֲנֻכָּה यहाँ वेदी के उद्घाटन/समर्पण को सूचित करता है। मूल में अलग से ‘भेंट’ शब्द नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: אַחֲרֵי הִמָּשַׁח אֹתוֹ
  choice: वेदी का अभिषेक किए जाने के बाद
  rationale: इब्रानी में अभिषेक करने वाला कर्ता व्यक्त नहीं है; हिन्दी का कर्मवाच्य अनावश्यक कर्ता जोड़े बिना यही बात रखता है।
theological_decisions:
- issue: שְׁלָמִים बलिदान-श्रेणी का अनुवाद
  choice: मेलबलि
  alternative: शांति-बलि; कल्याण की बलि
  rationale: ‘मेलबलि’ इस बलिदान से जुड़ी सहभागिता और मेल को सहज हिन्दी में व्यक्त करता है, जबकि मूल धातु से जुड़े शांति, पूर्णता और कल्याण के अन्य संभव आयाम पादटिप्पणी में दिए गए हैं; किसी एक धार्मिक व्याख्या को निर्णायक नहीं बनाया गया।
- issue: חֲנֻכָּה को घटना या भेंट के रूप में समझना
  choice: समर्पण
  alternative: समर्पण की भेंट
  rationale: आसपास का प्रसंग भेंटों का योग बताता है, पर संज्ञा स्वयं ‘समर्पण/उद्घाटन’ भी दर्शा सकती है। इसलिए मुख्य पाठ स्रोत के अधिक निकट रहकर अस्पष्टता को ‘समर्पण’ में बनाए रखता है और ‘भेंट’ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। गणना को हिन्दी की स्वाभाविक क्रम-रचना में रखा गया है, जबकि सभी पशु-प्रकार, संख्याएँ, आयु और अभिषेक के बाद समर्पण का क्रम अक्षुण्ण है।
