  text: וַ/יַּקְרִ֨יבוּ֙ נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל רָאשֵׁ֖י בֵּ֣ית אֲבֹתָ֑/ם הֵ֚ם נְשִׂיאֵ֣י הַ/מַּטֹּ֔ת הֵ֥ם הָ/עֹמְדִ֖ים עַל הַ/פְּקֻדִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/002.yaml
  text: Then the leaders of Israel[a], the heads of their fathers’ houses, brought offerings. They were the leaders of the tribes[c][b]; they were the ones standing over those who were counted.
translation:
  language: hi
  text: तब इस्राएल के प्रधान, जो अपने पितृकुलों[b] के मुखिया थे, भेंटें लेकर आए[a]। वे गोत्रों के प्रधान थे; वे गिने हुए लोगों की देखरेख करनेवाले थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेंटें प्रस्तुत कीं।” इब्रानी क्रिया का शाब्दिक अर्थ “निकट लाए” है; यहाँ प्रसंग समर्पण की भेंटों का है।
    reason: lexical_alternative
  - marker: b
    text: “पितृकुल” से आशय इस्राएल के भीतर पूर्वज के आधार पर संगठित विस्तृत परिवार अथवा कुल से है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “वे गिने हुए लोगों के ऊपर खड़े रहनेवाले थे”; अर्थात वे जनगणना में दर्ज लोगों के निरीक्षक अथवा अधिकारी थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: भेंटें लेकर आए
  rationale: हिफ़इल क्रिया का मूल भाव ‘निकट लाना/प्रस्तुत करना’ है। अध्याय के समर्पण-संबंधी प्रसंग में इसका आशय भेंटें प्रस्तुत करना है; इसलिए सहज हिन्दी में निहित कर्म को स्पष्ट किया गया है।
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: इस्राएल के प्रधान
  rationale: נָשִׂיא यहाँ राजपुत्र नहीं, समुदाय अथवा गोत्र का अगुआ है। ‘प्रधान’ आधुनिक हिन्दी में पद और नेतृत्व दोनों को स्पष्ट करता है।
- source_word: רָאשֵׁי בֵּית אֲבֹתָם
  choice: अपने पितृकुलों के मुखिया
  rationale: यह पदबंध इस्राएल की वंशाधारित पारिवारिक इकाइयों को सूचित करता है। ‘पितृकुल’ स्रोत की संरचना और सांस्कृतिक अर्थ दोनों को संक्षेप में बनाए रखता है।
- source_word: הֵם נְשִׂיאֵי הַמַּטֹּת
  choice: गोत्रों के प्रधान
  rationale: מַטּוֹת का शाब्दिक अर्थ ‘लाठियाँ’ हो सकता है, पर यहाँ यह स्थापित सामाजिक अर्थ में इस्राएल के गोत्रों को दर्शाता है।
- source_word: הֵם הָעֹמְדִים עַל הַפְּקֻדִים
  choice: वे ही गिने गए लोगों की देखरेख करनेवाले थे
  rationale: עמד על का ठोस चित्र ‘ऊपर खड़ा होना’ है, पर इस प्रसंग में वह जिम्मेदारी अथवा निरीक्षण दर्शाता है। ‘देखरेख करनेवाले’ सहज हिन्दी में उस अधिकार-संबंध को व्यक्त करता है, जबकि ‘गिने गए लोग’ जनगणना की पृष्ठभूमि बनाए रखता है।
