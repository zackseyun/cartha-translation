  yaml_path: translation/ot/numbers/007/042.yaml
  text: 'On the sixth day[b][a], the leader of the sons of Gad was Eliasaph son of Deuel:'
translation:
  language: hi
  text: 'छठे दिन गाद के वंशजों का अगुआ एल्यासाप, देऊएल[a] का पुत्र, था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस पद के इब्रानी पाठ में नाम ‘देऊएल’ है; उन अन्य पदों से तुलना करें जहाँ यह नाम ‘रेऊएल’ रूप में मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בַּיּוֹם הַשִּׁשִּׁי
  choice: छठे दिन
  rationale: दिन के साथ בְּ का प्रयोग यहाँ समय बताने वाले कथात्मक सूत्र के रूप में हुआ है; आधुनिक हिन्दी में ‘छठे दिन’ स्वाभाविक है।
- source_word: נָשִׂיא
  choice: अगुआ
  rationale: यह शब्द गोत्र के मान्य प्रधान को दर्शाता है। ‘अगुआ’ सामान्य पाठकों के लिए स्पष्ट है और ‘राजकुमार’ जैसे अनपेक्षित राजकीय अर्थ से बचाता है।
- source_word: לִבְנֵי גָד
  choice: गाद के वंशजों का
  rationale: शाब्दिक अर्थ ‘गाद के पुत्रों का’ है, पर इस संदर्भ में בני पूरे गोत्र अथवा वंशजों को दर्शाता है; ‘वंशजों’ से पारिवारिक-गोत्रीय भाव स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: אֶלְיָסָף
  choice: एल्यासाप
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: इब्रानी वंशसूचक रचना का मानक और स्वाभाविक हिन्दी रूप।
- source_word: דְּעוּאֵל
  choice: देऊएल
  rationale: इस पद के इब्रानी पाठ में दलेत से आरम्भ होने वाला रूप דְּעוּאֵל है; इसलिए ‘देऊएल’ चुना गया है।
