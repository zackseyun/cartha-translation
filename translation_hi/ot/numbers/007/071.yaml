  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/071.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs. This was the offering of Ahiezer son of Ammishaddai.'
translation:
  language: hi
  text: और शान्ति-बलि[a] के लिए दो गोवंशीय पशु, पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच मेमने। यह अम्मीशद्दै के पुत्र अहीएजेर का चढ़ावा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेलबलि,” “सहभागिता-बलि” अथवा “कुशल-मंगल की बलि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: यह पदबंध चढ़ावों की सूची की अंतिम मद जोड़ता है। ‘मेलबलि’ शְׁלָמִים के बलिदानी अर्थ को संक्षिप्त और परिचित रूप में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: בָּקָר שְׁנַיִם
  choice: गोधन में से दो पशु
  rationale: בָּקָר सामूहिक रूप से गाय-बैल वर्ग के पशुओं को दर्शाता है और यहाँ लिंग निर्दिष्ट नहीं करता; यह अनुवाद उसी व्यापकता को बनाए रखता है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם वयस्क नर भेड़ों के लिए स्पष्ट शब्द है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים विशेष रूप से नर बकरों को दर्शाता है; आधुनिक हिन्दी में ‘बकरे’ स्वाभाविक और स्पष्ट है।
- source_word: כְּבָשִׂים בְּנֵי־שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच मेमने
  rationale: ‘एक वर्ष के’ बलि के लिए महत्त्वपूर्ण आयु-निर्देश को सुरक्षित रखता है; ‘एक-एक’ सभी पाँचों पर आयु लागू होने को सहज रूप से स्पष्ट करता है।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: कथा के पूर्ण हो चुके कार्य के संदर्भ में भूतकाल स्वाभाविक है और קָרְבָּן के लिए ‘चढ़ावा’ सामान्य, सुबोध हिन्दी है।
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: अम्मीशद्दै के पुत्र अहीएजेर
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और בֶּן को सीधे ‘पुत्र’ से व्यक्त किया गया है।
theological_decisions:
- issue: הַשְּׁלָמִים नामक बलि का अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि; सहभागिता-बलि; कुशल-मंगल का बलिदान
  rationale: इब्रानी शब्द में शान्ति, कुशलता और सहभागी भोज से जुड़े अर्थ-संकेत हो सकते हैं। मुख्य पाठ में परिचित ‘मेलबलि’ रखा गया है और अर्थ-सीमा को पादटिप्पणी में खुला छोड़ा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुरूप संक्षिप्त रखी गई है। पशुओं के पारंपरिक, सहज हिन्दी नाम प्रयुक्त हुए हैं; जहाँ इब्रानी लिंग निर्दिष्ट नहीं करता, वहाँ अनावश्यक लिंग-निर्धारण से बचा गया है।
