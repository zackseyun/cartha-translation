source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר יְהוָ֖ה אֶל מֹשֶׁ֑ה נָשִׂ֨יא אֶחָ֜ד לַ/יּ֗וֹם נָשִׂ֤יא אֶחָד֙ לַ/יּ֔וֹם יַקְרִ֨יבוּ֙ אֶת קָרְבָּנָ֔/ם לַ/חֲנֻכַּ֖ת הַ/מִּזְבֵּֽחַ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/011.yaml
  text: Then Yahweh said to Moses[a], “One leader each day, one leader each day, they shall present their offering for the dedication of the altar.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “प्रतिदिन एक प्रधान[a], प्रतिदिन एक प्रधान, वेदी के समर्पण के लिए अपना चढ़ावा प्रस्तुत करेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वैकल्पिक रूप से, “हर दिन एक गोत्र-प्रधान।” इब्रानी में “एक प्रधान, एक दिन” का पदबंध दोहराया गया है, जो चढ़ावे प्रस्तुत करने के व्यवस्थित क्रम पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहाँ यह शब्द इस्राएल के गोत्रों के मुखियाओं के लिए है; ‘प्रधान’ उनके नेतृत्व-पद को बिना राजकीय अर्थ जोड़े व्यक्त करता है।
- source_word: אֶחָד ... לַיּוֹם
  choice: हर दिन एक
  rationale: संख्या और कालवाचक पद का वितरणात्मक अर्थ है कि क्रम से प्रत्येक दिन एक प्रधान चढ़ावा लाए।
- source_word: יַקְרִיבוּ
  choice: प्रस्तुत करें
  rationale: हिफ़ील रूप बलिदानी संदर्भ में किसी भेंट को परमेश्वर के सामने लाने या चढ़ाने को दर्शाता है; ‘प्रस्तुत करें’ ‘चढ़ावा चढ़ाएँ’ की अनावश्यक पुनरुक्ति से बचता है।
- source_word: קָרְבָּנָם
  choice: अपना चढ़ावा
  rationale: संज्ञा परमेश्वर के निकट लाई गई भेंट को दर्शाती है; ‘चढ़ावा’ सामान्य और स्पष्ट धार्मिक हिन्दी है।
- source_word: לַחֲנֻכַּת
  choice: समर्पण के लिए
  rationale: यह वेदी के औपचारिक आरंभ और समर्पण के अवसर या उद्देश्य को व्यक्त करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान चढ़ाने के स्थान के लिए मानक और सहज हिन्दी शब्द।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय लिप्यंतरित करना स्रोत की विशिष्टता सुरक्षित रखता है; ‘यहवे’ आधुनिक विद्वत्तापूर्ण पुनर्निर्माण के निकट हिन्दी रूप है।
- issue: נָשִׂיא की पदगत विशिष्टता
  choice: प्रधान
  alternative: गोत्र-प्रधान; मुखिया; राजकुमार
  rationale: संदर्भ में ये गोत्रों के अगुए हैं, पर इस पद में स्वयं ‘गोत्र’ शब्द नहीं है। मुख्य पाठ व्यापक शब्द रखता है और पादटिप्पणी संदर्भगत विशिष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की बलाघातपूर्ण पुनरावृत्ति को डैशों के साथ बनाए रखा गया है। पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित वाक्य के अंत में रखा गया है।
