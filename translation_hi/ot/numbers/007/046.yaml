- source_word: אֶחָד
  choice: एक
  rationale: मूल में संख्या स्पष्ट रूप से दी गई है; गिनती वाली सूची की शैली बनाए रखने के लिए “एक” रखा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
