source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן פַּגְעִיאֵ֖ל בֶּן עָכְרָֽן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/077.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five male lambs a year old[b]. This was the offering of Pagiel son of Ocran.'
translation:
  language: hi
  text: 'और मेलबलि[a] के लिए: गोवंश के दो पशु[b], पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच नर मेमने। यह ओक्रान के पुत्र पगीएल का चढ़ावा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सहभागिता-बलि” अथवा “कुशल-मंगल की बलि।” इब्रानी बलिदानी पद के अर्थ में मेल, सहभागिता और कुशल-मंगल—तीनों भाव आ सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में सामूहिक शब्द “गोवंश” है; अनेक अनुवाद यहाँ अधिक विशिष्ट रूप से “दो बैल” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: संयोजक और संबंधसूचक उपसर्ग चढ़ावों की सूची में अगली वस्तु जोड़ते हैं। ‘मेलबलि’ שְׁלָמִים के लिए प्रचलित, संक्षिप्त बलिदानी पद है; पादटिप्पणी उसके व्यापक अर्थ-क्षेत्र को बनाए रखती है।
- source_word: בָּקָר שְׁנַיִם
  choice: गोवंश के दो पशु
  rationale: בָּקָר सामूहिक रूप से गोवंश को दर्शाता है और यहाँ लिंग निर्दिष्ट नहीं करता। यह अनुवाद ‘दो बैल’ की अपेक्षा स्रोत के प्रति अधिक सटीक है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם विशेष रूप से वयस्क नर भेड़ों को दर्शाता है; ‘मेढ़े’ आधुनिक हिन्दी में इसका स्वाभाविक और सटीक पद है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים नर बकरों को दर्शाता है; हिन्दी में ‘बकरे’ लिंग को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक वर्ष के पाँच नर मेमने
  rationale: כְּבָשִׂים यहाँ नर मेमनों को और בְּנֵי שָׁנָה उनकी एक वर्ष की आयु को बताता है; दोनों विवरण सुरक्षित रखे गए हैं।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: यह आवर्ती समापन-सूत्र है। कथा-संदर्भ के अनुरूप भूतकाल और קָרְבַּן के लिए सहज हिन्दी ‘चढ़ावा’ चुना गया है।
- source_word: פַּגְעִיאֵל בֶּן עָכְרָן
  choice: ओक्रान के पुत्र पगीएल
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और בֶּן को स्वाभाविक हिन्दी संबंधसूचक वाक्यांश से व्यक्त किया गया है।
theological_decisions:
- issue: שְׁלָמִים बलि-पद का अर्थ
  choice: मेलबलि
  alternative: सहभागिता-बलि; कुशल-मंगल की बलि
  rationale: इब्रानी पद मेल, सहभागिता और कुशल-मंगल से जुड़े अर्थ रख सकता है। मुख्य पाठ में परिचित बलिदानी पद रखा गया है, जबकि पादटिप्पणी विकल्प देकर अर्थगत विस्तार को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-पाठ के अनुरूप संक्षिप्त रखी गई है। पशुओं के पारंपरिक हिन्दी नाम प्रयुक्त हुए हैं; जहाँ इब्रानी लिंग निर्दिष्ट नहीं करता, वहाँ अनावश्यक विशिष्टता से बचा गया है।
