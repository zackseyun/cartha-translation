    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: धूपदानी
  rationale: यहाँ शब्द हथेली नहीं, पवित्रस्थान में धूप रखने का एक छोटा पात्र बताता है। प्रसंगानुकूल ‘धूपदानी’ सामान्य हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אַחַת
  choice: एक
  rationale: स्त्रीलिंग पात्र के साथ प्रयुक्त सामान्य संख्या का सीधा अनुवाद।
- source_word: עֲשָׂרָה
  choice: दस शेकेल
  rationale: मूल में केवल ‘दस’ है, पर निकटवर्ती बार-बार दोहराए गए भेंट-विवरण से भार की इकाई ‘शेकेल’ समझी जाती है; इसे स्पष्टता के लिए पाठ में रखा और पादटिप्पणी में बताया गया है।
- source_word: זָהָב
  choice: सोने की
  rationale: पात्र की सामग्री व्यक्त करता है; आधुनिक हिन्दी में ‘सोने की’ स्वाभाविक है।
- source_word: מְלֵאָה
  choice: भरी थी
  rationale: स्त्रीलिंग पात्र की अवस्था बताने वाले विशेषण को सहज हिन्दी विधेय के रूप में प्रस्तुत किया गया है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: पवित्रस्थान की सुगंधित अर्पण-सामग्री के लिए प्रचलित और स्पष्ट हिन्दी शब्द।
