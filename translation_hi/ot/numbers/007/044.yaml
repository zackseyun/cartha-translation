- source_word: עֲשָׂרָה זָהָב
  choice: जिसका भार दस शेकेल था
  rationale: मूल में शाब्दिक रूप से ‘दस सोना’ है; अध्याय के आवर्ती भार-सूत्र से शेकेल की इकाई निहित है। हिंदी में अर्थ स्पष्ट करने के लिए भार और शेकेल व्यक्त किए गए हैं।
- source_word: מְלֵאָה
  choice: भरा था
  rationale: पात्र की सामग्री बताने वाला विशेषण; हिंदी वाक्य में स्वाभाविक विधेय रूप।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: आराधना में चढ़ाए जाने वाले सुगंधित पदार्थ के लिए प्रचलित और सटीक हिंदी शब्द।
