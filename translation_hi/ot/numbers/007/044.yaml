lexical_decisions:
- source_word: כַּף
  choice: पात्र
  rationale: इस आवर्ती भेंट-सूची में यह शब्द धूप रखने के छोटे पात्र को दर्शाता है। ‘पात्र’ स्वाभाविक और पर्याप्त रूप से व्यापक है; ‘चम्मच’ अनावश्यक रूप से विशिष्ट होगा।
- source_word: אַחַת
