base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/049.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा, जिसका भार पवित्रस्थान के शेकेल के अनुसार सत्तर शेकेल था; दोनों अन्नबलि के लिए तेल से मिला हुआ मैदे से भरे हुए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी की एक परात”; यहाँ प्रयुक्त इब्रानी शब्द קַעֲרָה एक चौड़े पात्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट यह थी
  rationale: कָרְבָּן उपासना के प्रसंग में परमेश्वर के निकट लाई गई भेंट को दर्शाता है; यह हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קְעָרָה एक चौड़ा पात्र है; सूची के इस प्रसंग में ‘थाली’ सामान्य पाठक के लिए सहज है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार ... एक सौ तीस शेकेल था
  rationale: मूल में पात्र के बाद उसका भार बताया गया है; संबंधवाचक रचना इस अर्थ को स्वाभाविक आधुनिक हिंदी में व्यक्त करती है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק बलिदान-सेवा में प्रयुक्त कटोरे अथवा पात्र को दर्शाता है; ‘कटोरा’ सरल और ठोस हिंदी है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह वाक्यांश भार मापने के आधिकारिक पवित्रस्थान-मानक को बताता है; ‘के अनुसार’ उस कार्य को स्पष्ट करता है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... भरकर रखे गए थे
  rationale: यह दोनों चाँदी के पात्रों को संदर्भित करता है। हिंदी की स्वाभाविक वाक्य-रचना में उनके भरे होने की अवस्था इस प्रकार स्पष्ट होती है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת बलियों में प्रयुक्त बारीक, परिष्कृत आटे को दर्शाता है; आधुनिक हिंदी में ‘मैदा’ इसका सहज समतुल्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: यह मैदे को तेल के साथ मिलाकर तैयार किए जाने को सीधे व्यक्त करता है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय प्रसंग में מִנְחָה विशेष रूप से अन्नबलि है, केवल सामान्य भेंट नहीं।
