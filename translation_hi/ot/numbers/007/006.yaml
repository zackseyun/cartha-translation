  yaml_path: translation/ot/numbers/007/006.yaml
  text: So Moses took the carts and the cattle and gave them to the Levites[a][b].
translation:
  language: hi
  text: तब मूसा ने गाड़ियाँ[a] और मवेशी[b] लिए और उन्हें लेवियों को दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छकड़े।”
    reason: lexical_alternative
  - marker: b
    text: इस अध्याय के संदर्भ में इन्हें बैल कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिए
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। यहाँ मूसा भेंट की गई वस्तुओं को अपने अधिकार में ग्रहण करता है; इसलिए ‘लिए’ सीधा और स्वाभाविक अनुवाद है।
- source_word: הָעֲגָלֹת
  choice: गाड़ियाँ
  rationale: עגלה यहाँ पवित्र निवास की सेवा में सामान ढोने के लिए दी गई परिवहन-गाड़ियों को दर्शाता है। आधुनिक हिन्दी में ‘गाड़ियाँ’ स्पष्ट और स्वाभाविक है।
- source_word: הַבָּקָר
  choice: मवेशी
  rationale: בקר पशुओं के झुंड के लिए प्रयुक्त सामूहिक संज्ञा है। अध्याय का संदर्भ इन्हें बैल बताता है, पर इस पद के व्यापक शब्द को बनाए रखने के लिए ‘मवेशी’ चुना गया है।
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का मूल अर्थ ‘देना’ है। ‘सौंप दिया’ प्रशासनिक भाव को अधिक स्पष्ट करता, पर ‘दे दिया’ इब्रानी क्रिया के सरल अर्थ को सुरक्षित रखता है।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन कर्म-सर्वनाम गाड़ियों और मवेशियों, दोनों को सामूहिक रूप से संदर्भित करता है; हिन्दी में ‘उन्हें’ स्वाभाविक समतुल्य है।
- source_word: אֶל הַלְוִיִּם
  choice: लेवियों को
  rationale: אֶל यहाँ वस्तुओं के लेवियों के अधिकार में हस्तांतरण को व्यक्त करता है; ‘लेवियों को’ इसका सीधा हिन्दी रूप है।
