  text: הִקְרִ֨ב אֶת קָרְבָּנ֜/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/019.yaml
  text: 'He presented his offering: one silver plate[a], its weight one hundred thirty shekels; one silver basin, seventy shekels, by the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.'
translation:
  language: hi
  text: 'उसने अपनी भेंट चढ़ाई: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था; चाँदी का एक कटोरा[b], जिसका भार पवित्रस्थान के शेकेल[c] के अनुसार सत्तर शेकेल था; दोनों अन्नबलि के लिए तेल में मिला हुआ मैदा से भरे हुए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाँदी की परात’।
    reason: lexical_alternative
  - marker: b
    text: या ‘चाँदी का पात्र’।
    reason: lexical_alternative
  - marker: c
    text: ‘पवित्रस्थान का शेकेल’ वहाँ मान्य भार का मानक था।
    reason: cultural_note
lexical_decisions:
- source_word: הִקְרִב אֶת קָרְבָּנוֹ
  choice: उसने अपनी भेंट चढ़ाई
  rationale: हिफ़ील क्रिया यहाँ किसी भेंट को विधिपूर्वक निकट लाने या प्रस्तुत करने का बोध देती है। हिंदी बलिदानी संदर्भ में ‘भेंट चढ़ाई’ स्वाभाविक और स्पष्ट है।
- source_word: קַעֲרַת כֶּסֶף
  choice: चाँदी की एक थाली
  rationale: קְעָרָה अपेक्षाकृत चौड़े पात्र को सूचित करता है; ‘थाली’ आधुनिक हिंदी में सहज है, जबकि ‘परात’ भी संभव है।
- source_word: מִזְרָק
  choice: कटोरा
  rationale: यह अनुष्ठान में प्रयुक्त पात्र है। सामान्य पाठक के लिए ‘कटोरा’ स्पष्ट है; आकार की अनिश्चितता को देखते हुए अधिक विशिष्ट शब्द नहीं चुना गया।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह पवित्रस्थान में मान्य भार-मानक को दर्शाता है। ‘के अनुसार’ इकाई के मानकीकृत होने का अर्थ स्पष्ट करता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह अन्नबलि में प्रयुक्त बारीक, परिष्कृत आटे का शब्द है; आधुनिक हिंदी में ‘मैदा’ इसका सहज समतुल्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: वाक्यांश आटे को तेल के साथ मिलाने की तैयारी बताता है; यह हिंदी में सरल और स्रोत के निकट है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय संदर्भ में מִנְחָה सामान्य भेंट नहीं, विशेष रूप से अन्नबलि है।
