  text: one gold dish[a], ten shekels[b], full of incense.
translation:
  language: hi
  text: सोने का एक पात्र[a], जिसका भार दस शेकेल था, और जो धूप से भरा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कटोरा,’ ‘छोटी थाली,’ अथवा परंपरागत रूप से ‘चम्मच।’ मूल शब्द छोटे पात्र के लिए है; उसका ठीक आकार स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: पात्र
  rationale: इस पवित्र-स्थान की भेंटों की सूची में यह शब्द हाथ या हथेली नहीं, बल्कि धूप रखने के एक छोटे पात्र को दर्शाता है। ‘पात्र’ आधुनिक हिन्दी में स्वाभाविक है और उसके ठीक आकार के विषय में अनावश्यक निश्चितता से बचता है।
- source_word: אַחַת
  choice: एक
  rationale: यह כַּף के साथ प्रयुक्त सीधा संख्यावाचक विशेषण है।
- source_word: עֲשָׂרָה זָהָב
  choice: जिसका भार दस शेकेल था
  rationale: मूल में शाब्दिक रूप से ‘दस सोना’ जैसा संक्षिप्त भार-सूत्र है। अध्याय के निकटवर्ती समान वाक्यों से शेकेल इकाई समझी जाती है; हिन्दी में अर्थ स्पष्ट करने के लिए इसे व्यक्त किया गया है।
- source_word: זָהָב
  choice: सोने का
  rationale: यह पात्र की सामग्री बताता है; हिन्दी में संबंधवाचक रचना स्वाभाविक है।
- source_word: מְלֵאָה
  choice: भरा था
  rationale: यह स्त्रीलिंग पात्र की अवस्था और उसकी सामग्री को बताने वाला विधेय विशेषण है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: उपासना में जलाए जाने वाले सुगंधित पदार्थ के लिए यह मानक और सामान्य हिन्दी शब्द है।
