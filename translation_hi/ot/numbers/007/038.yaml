  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल के संक्षिप्त भार-सूत्र को स्पष्ट हिन्दी में खोला गया है, जबकि पात्र के आकार की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
