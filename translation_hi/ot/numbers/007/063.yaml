- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל वयस्क नर भेड़ के लिए मानक बलिदानी शब्द है; ‘मेढ़ा’ इसका सटीक और प्रचलित हिंदी पर्याय है।
- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ मेमने को, और इस बलिदानी प्रयोग में नर मेमने को सूचित करता है; इसलिए लिंग को स्पष्ट रखा गया है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह इब्रानी मुहावरा पशु के अपनी पहली वर्षावधि में होने को बताता है; ‘एक वर्ष का’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה पूर्णतः जलाए जाने वाले बलिदान का मानक पद है; हिंदी बाइबलीय प्रयोग में ‘होमबलि’ प्रतिष्ठित और संक्षिप्त समतुल्य है।
- source_word: אֶחָד
  choice: एक
  rationale: प्रत्येक पशु की संख्या बताने वाली पुनरावृत्ति को हिंदी में बनाए रखा गया है।
