  text: בַּ/יּוֹם֙ הַ/תְּשִׁיעִ֔י נָשִׂ֖יא לִ/בְנֵ֣י בִנְיָמִ֑ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/060.yaml
  text: On the ninth day[a], the leader of the sons of Benjamin was Abidan son of Gideoni.
translation:
  language: hi
  text: नौवें दिन बिन्यामीन के पुत्रों का प्रधान गिदोनी का पुत्र अबीदान था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַתְּשִׁיעִי
  choice: नौवें दिन
  rationale: कालवाचक בְּ और क्रमवाचक विशेषण का आधुनिक हिन्दी में स्वाभाविक तथा सटीक रूप।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहाँ गोत्र के मान्य अगुवे को दर्शाता है; ‘प्रधान’ पद और प्रतिनिधिक भूमिका को बिना राजकीय अर्थ जोड़े व्यक्त करता है।
- source_word: לִבְנֵי בִנְיָמִן
  choice: बिन्यामीन के पुत्रों का
  rationale: לְ यहाँ संबंध अथवा प्रतिनिधित्व दर्शा सकता है। मुख्य पाठ में संबंधसूचक अर्थ रखते हुए इब्रानी की पारिवारिक, वंशगत अभिव्यक्ति को सुरक्षित रखा गया है।
- source_word: אֲבִידָן
  choice: अबीदान
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן גִּדְעֹנִי
  choice: गिदोनी का पुत्र
  rationale: इब्रानी वंशपरिचय संरचना का स्वाभाविक हिन्दी रूप; व्यक्तिनाम का देवनागरी लिप्यंतरण।
theological_decisions:
- issue: בְנֵי का लिंगयुक्त गोत्रीय पदनाम
  choice: बिन्यामीन के पुत्रों
  alternative: बिन्यामीन के लोग; बिन्यामीनवंशी
  rationale: मूल की पुरुषवाचक पारिवारिक और वंशगत अभिव्यक्ति को बनाए रखा गया है; इस प्रशासनिक प्रसंग में यह पूरे गोत्रीय वंश-समूह को सूचित करती है।
- issue: לִבְנֵי के संबंध अथवा प्रतिनिधित्व का अर्थ
  choice: के पुत्रों का प्रधान
  alternative: के पुत्रों के लिए प्रधान
  rationale: לְ दोनों प्रकार का संबंध व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक संबंधसूचक हिन्दी चुनी गई है, बिना इस बात को नकारे कि प्रधान गोत्र का प्रतिनिधि भी था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद की संक्षिप्त सूची-जैसी शैली और इब्रानी वंशपरिचय संरचना सुरक्षित हैं।
