  text: וַ/יָּבִ֨יאוּ אֶת קָרְבָּנָ֜/ם לִ/פְנֵ֣י יְהוָ֗ה שֵׁשׁ עֶגְלֹ֥ת צָב֙ וּ/שְׁנֵ֣י עָשָׂ֣ר בָּקָ֔ר עֲגָלָ֛ה עַל שְׁנֵ֥י הַ/נְּשִׂאִ֖ים וְ/שׁ֣וֹר לְ/אֶחָ֑ד וַ/יַּקְרִ֥יבוּ אוֹתָ֖/ם לִ/פְנֵ֥י הַ/מִּשְׁכָּֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/003.yaml
  text: 'And they brought their offering before Yahweh: six covered carts and twelve oxen[a], a cart for every two leaders and an ox for each one; and they presented them before the tabernacle.'
translation:
  language: hi
  text: वे अपनी भेंट याहवे के सामने लाए—छह ढकी हुई गाड़ियाँ[a] और बारह बैल; हर दो प्रधानों के लिए एक गाड़ी और हर प्रधान के लिए एक बैल। उन्होंने इन्हें पवित्र निवास के सामने प्रस्तुत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पदबंध का ठीक अर्थ अनिश्चित है; परंपरागत रूप से इसका अर्थ छाजन या आवरण वाली परिवहन-गाड़ियाँ समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנָם
  choice: अपनी भेंट
  rationale: क़ोरबान यहाँ उपासना के संदर्भ में परमेश्वर के सामने लाई गई वस्तु को दर्शाता है; ‘भेंट’ स्वाभाविक और सटीक है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्थान-संबंधी अर्थ ‘के सामने’ है और יהוה को उसके व्यक्तिगत नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: עֶגְלֹת צָב
  choice: ढकी हुई गाड़ियाँ
  rationale: עֲגָלוֹת गाड़ियों को दर्शाता है; צָב का पारंपरिक अर्थ यहाँ ढकी या छाजन वाली परिवहन-गाड़ियाँ समझा जाता है, यद्यपि शब्द का ठीक आशय निश्चित नहीं है।
- source_word: בָּקָר / שׁוֹר
  choice: बैल
  rationale: परिवहन के संदर्भ और एक-एक पशु के वितरण से यहाँ बोझ खींचने वाले बैल अभिप्रेत हैं।
- source_word: הַנְּשִׂיאִים
  choice: प्रधानों
  rationale: नְשִׂיאִים इस प्रसंग में गोत्रों के अगुओं को दर्शाता है; ‘प्रधान’ नेतृत्व और पद, दोनों को सहज रूप से व्यक्त करता है।
- source_word: עֲגָלָה עַל שְׁנֵי הַנְּשִׂאִים וְשׁוֹר לְאֶחָד
  choice: हर दो प्रधानों की ओर से एक गाड़ी और हर प्रधान की ओर से एक बैल
  rationale: 'वाक्यांश वितरणात्मक अनुपात बताता है: दो प्रधानों पर एक गाड़ी और प्रत्येक प्रधान पर एक बैल। ‘की ओर से’ हिंदी में योगदान का भाव स्पष्ट करता है।'
- source_word: וַיַּקְרִיבוּ אֹתָם
  choice: उन्होंने इन्हें ... प्रस्तुत किया
  rationale: הקריב का मूल भाव पास लाने या अर्पण हेतु प्रस्तुत करने का है। गाड़ियों और बैलों के लिए ‘प्रस्तुत किया’ बलि चढ़ाए जाने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן परमेश्वर के निवास-स्थान रूपी पवित्र तंबू को दर्शाता है। ‘पवित्र निवास’ अर्थ स्पष्ट करता है और इसे אֹהֶל מוֹעֵד से नहीं मिलाता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וַיַּקְרִיבוּ को बलिदान-संबंधी क्रिया मानना
  choice: प्रस्तुत किया
  alternative: चढ़ाया / बलि किया
  rationale: यहाँ प्रस्तुत वस्तुओं में गाड़ियाँ भी हैं, इसलिए क्रिया को बलि-वध के अर्थ में लेना अनुचित होगा; ‘प्रस्तुत किया’ मूल के पास लाने और औपचारिक रूप से अर्पित करने के भाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’ गोत्रीय नेतृत्व को व्यक्त करता है; ‘पवित्र निवास’ तकनीकी धार्मिक शब्द को अर्थपूर्ण हिंदी में प्रस्तुत करता है।
