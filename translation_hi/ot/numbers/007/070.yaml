  text: पापबलि के लिए एक बकरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: यह इब्रानी पदबंध नर बकरी को दर्शाता है। आधुनिक हिन्दी में ‘बकरा’ स्वाभाविक, स्पष्ट और पशु के नर होने को व्यक्त करता है।
- source_word: אֶחָד
  choice: एक
  rationale: यह संख्या बलि के पशु की गिनती बताती है और गिनती 7 की सूचीबद्ध शैली को बनाए रखती है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: इस बलिदान-संबंधी संदर्भ में חַטָּאת का अर्थ ‘पापबलि’ है; उपसर्ग לְ को ‘के लिए’ से स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: बलिदान-संबंधी संदर्भ में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: पाप
  rationale: यह पद बलिदानों की सूची का भाग है, इसलिए यहाँ शब्द किसी अमूर्त पाप के बजाय पाप के लिए चढ़ाई जाने वाली बलि को सूचित करता है।
translation_notes:
  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी में है। मूल की सूचीबद्ध संरचना और ‘एक’ की पुनरावृत्ति सुरक्षित रखी गई है। ‘पापबलि’ स्थापित बलिदान-संबंधी अर्थ को स्पष्ट करता है; अतः अलग पाद-टिप्पणी आवश्यक नहीं है।
