  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। मूल वाक्य की आवंटन-संरचना और वंशगत पदावली सुरक्षित रखी गई है; ‘हाथ में’ वाले इब्रानी मुहावरे को अर्थानुकूल ‘देखरेख में’ किया गया है।
