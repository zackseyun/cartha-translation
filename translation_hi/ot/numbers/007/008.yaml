  text: וְ/אֵ֣ת אַרְבַּ֣ע הָ/עֲגָלֹ֗ת וְ/אֵת֙ שְׁמֹנַ֣ת הַ/בָּקָ֔ר נָתַ֖ן לִ/בְנֵ֣י מְרָרִ֑י כְּ/פִי֙ עֲבֹ֣דָתָ֔/ם בְּ/יַד֙ אִֽיתָמָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵֽן׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/008.yaml
  text: And he gave the four carts and the eight oxen to the sons of Merari[a], according to their service[b], under the direction of Ithamar son of Aaron the priest.
translation:
  language: hi
  text: और उसने चार गाड़ियाँ और आठ बैल मरारी के पुत्रों को उनकी सेवा के अनुसार दिए, याजक हारून के पुत्र ईतामार की देखरेख में।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: गाड़ियाँ
  rationale: यह शब्द पहियों वाले माल-ढुलाई के वाहन को दर्शाता है; तंबू के सामान के परिवहन के संदर्भ में ‘गाड़ियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: הַבָּקָר
  choice: बैल
  rationale: व्यापक अर्थ ‘पशु/गोधन’ हो सकता है, पर यहाँ गाड़ियाँ खींचने के लिए दिए गए पशु अभिप्रेत हैं, इसलिए ‘बैल’ संदर्भानुकूल है।
- source_word: נָתַן
  choice: दिए
  rationale: मूल क्रिया का सीधा अर्थ ‘देना’ है; प्रशासनिक आवंटन का भाव संदर्भ से स्पष्ट है, इसलिए अधिक व्याख्यात्मक ‘सौंपे’ नहीं चुना गया।
- source_word: לִבְנֵי מְרָרִי
  choice: मरारी के पुत्रों को
  rationale: इब्रानी की पारिवारिक/वंशगत अभिव्यक्ति को बनाए रखता है और हिन्दी में भी स्पष्ट है।
- source_word: כְּפִי עֲבֹדָתָם
  choice: उनकी सेवा की आवश्यकता के अनुसार
  rationale: כְּפִי का मुहावरेदार अर्थ ‘के अनुसार’ है और עֲבֹדָה यहाँ पवित्र तंबू से जुड़ी नियत सेवा है। ‘आवश्यकता’ संदर्भगत अनुपात को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: בְּיַד אִיתָמָר
  choice: ईतामार की देखरेख में
  rationale: शाब्दिक अर्थ ‘ईतामार के हाथ में/द्वारा’ है, पर प्रशासनिक संदर्भ में यह अधिकार, निर्देशन या पर्यवेक्षण का मुहावरा है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: यह हारून की निश्चित पदवी है; ‘याजक’ बाइबलीय संदर्भ में प्रचलित और गरिमापूर्ण हिन्दी शब्द है।
