  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: hi
  text: होमबलि के लिए झुंड में से एक बैल, एक मेढ़ा और एक वर्ष का एक नर मेमना;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: झुंड में से एक बैल
  rationale: बलिदान के प्रसंग में פַּר का अर्थ बैल है, और בֶּן בָּקָר उसे मवेशियों के झुंड से आया पशु बताता है। यह स्वाभाविक हिन्दी में दोनों अर्थों को सुरक्षित रखता है।
- source_word: אֶחָד
  choice: एक
  rationale: हर पशु के साथ दोहराया गया अंक उसकी अलग-अलग संख्या बताता है; इसलिए सूची में प्रत्येक के साथ ‘एक’ रखा गया है।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל बलिदान के संदर्भ में वयस्क नर भेड़ के लिए सामान्य शब्द है; आधुनिक हिन्दी में इसका सहज समकक्ष ‘मेढ़ा’ है।
- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ नर मेमने को सूचित करता है; ‘नर’ जोड़ने से मूल शब्द का लिंग स्पष्ट रहता है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह इब्रानी मुहावरा पशु की आयु बताता है। ‘एक वर्ष का’ स्पष्ट, संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलिदान का प्रचलित पद है जो वेदी पर पूर्णतः जलाया जाता था; हिन्दी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त और परिचित है।
