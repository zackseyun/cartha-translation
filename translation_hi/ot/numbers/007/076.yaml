translation:
  language: hi
  text: पापबलि के लिए एक बकरा;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शुद्धीकरण-बलि के लिए।’ बलिदान-संबंधी प्रसंगों में इब्रानी शब्द חַטָּאת उस बलि को दर्शा सकता है जो पाप और अनुष्ठानिक अशुद्धता से निपटती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: यह इब्रानी पदबंध नर बकरे को दर्शाता है। आधुनिक मानक हिन्दी में ‘बकरा’ स्वाभाविक रूप से नर पशु को स्पष्ट करता है और बलि के पशु की विशिष्टता बनाए रखता है।
- source_word: אֶחָד
  choice: एक
  rationale: मूल पाठ की स्पष्ट संख्या और गिनती-सूची की पुनरावृत्त शैली को बनाए रखने के लिए संख्या का सीधा अनुवाद किया गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी प्रसंग में חַטָּאת अमूर्त ‘पाप’ के बजाय पाप अथवा शुद्धीकरण से संबंधित बलि को दर्शाता है। ‘पापबलि’ हिन्दी में संक्षिप्त, स्पष्ट और प्रचलित धार्मिक पद है।
theological_decisions:
- issue: बलिदान-संबंधी प्रसंग में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धीकरण-बलि
  rationale: यहाँ शब्द स्पष्टतः एक बलि का नाम है। ‘पापबलि’ पहचानने योग्य पारंपरिक अर्थ को बनाए रखता है, जबकि ‘शुद्धीकरण-बलि’ इस अनुष्ठान के शुद्धीकरण-संबंधी पहलू को अधिक स्पष्ट करता है; इसलिए उस वास्तविक अर्थ-सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
