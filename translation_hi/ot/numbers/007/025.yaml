translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रजिस्टर रखा गया है। माप की प्राचीन इकाई ‘शेकेल’ को लिप्यंतरित किया गया है। सूची की सघन हिब्रू संरचना को पठनीय बनाने के लिए वज़न-संबंधी वाक्यांश स्पष्ट किए गए हैं, पर सभी वस्तुओं और उनके संबंधों को सुरक्षित रखा गया है।
