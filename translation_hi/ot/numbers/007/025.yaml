base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/025.yaml
  text: His offering was one silver plate, its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसका चढ़ावा यह था: चाँदी की एक थाली,[a] जिसका वज़न पवित्रस्थान के शेकेल के मानक के अनुसार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा,[b] जिसका वज़न सत्तर शेकेल था। दोनों में अन्नबलि के लिए तेल से मिला हुआ बारीक आटा भरा था।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी की एक परात।”
    reason: lexical_alternative
  - marker: b
    text: या “चाँदी का एक पात्र।”
    reason: lexical_alternative
  - marker: c
    text: “पवित्रस्थान का शेकेल” पवित्रस्थान में मान्य वज़न का मानक था; यह दोनों पात्रों के बताए गए वज़नों पर लागू होता है।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसका चढ़ावा यह था
  rationale: याजकीय संदर्भ में קָרְבָּן वेदी के निकट लाई गई भेंट को दर्शाता है। ‘चढ़ावा’ सामान्य आधुनिक हिन्दी में स्वाभाविक है, और ‘यह था’ सूची की भूमिका स्पष्ट करता है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קְעָרָה किसी चौड़े अथवा अपेक्षाकृत उथले पात्र को दर्शाता है; ‘थाली’ इस संदर्भ में सहज हिन्दी विकल्प है, जबकि ‘परात’ भी संभव है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका वज़न एक सौ तीस शेकेल था
  rationale: हिब्रू की संख्या-रचना को हिन्दी के सामान्य क्रम में रखा गया है और מִשְׁקָלָהּ का स्पष्ट अनुवाद ‘जिसका वज़न’ किया गया है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק धार्मिक कार्य में प्रयुक्त कटोरे या पात्र को दर्शाता है। ‘कटोरा’ आधुनिक पाठक के लिए स्पष्ट है; ‘कटोरा-नुमा पात्र’ अनावश्यक रूप से भारी होता।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका वज़न सत्तर शेकेल था
  rationale: मूल में वज़न का संक्षिप्त उल्लेख है; हिन्दी में स्पष्टता के लिए पहले पात्र से समानांतर वाक्यांश बनाया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह वज़न मापने के मानक को बताता है। ‘के अनुसार’ हिब्रू בְּ का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है; फुटनोट सांस्कृतिक आशय स्पष्ट करता है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... से भरे थे
  rationale: द्विवचन-संदर्भ दोनों पात्रों को स्पष्ट रूप से जोड़ता है और विधेय विशेषण को हिन्दी में स्वाभाविक क्रिया के साथ व्यक्त किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת अन्नबलि के लिए प्रयुक्त बारीक, उत्तम आटे को दर्शाता है। आधुनिक हिन्दी में ‘मैदा’ इसका संक्षिप्त और समझने योग्य समतुल्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल से मिले हुए
  rationale: निष्क्रिय कृदंत से तेल के साथ भली-भाँति मिलाए जाने का भाव आता है; यह रूप पात्रों को भरने वाले मैदे से व्याकरणतः जुड़ता है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय संदर्भ में מִנְחָה सामान्य भेंट नहीं, विशेष रूप से अनाज से तैयार बलि है; ‘अन्नबलि’ इस भेद को बनाए रखता है।
