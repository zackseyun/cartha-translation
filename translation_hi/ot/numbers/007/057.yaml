  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering;
translation:
  language: hi
  text: झुंड में से एक बैल,[a] एक मेढ़ा, और एक वर्ष का नर मेमना, होमबलि के लिए;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘एक बैल, गोधन का पुत्र।’ यह गाय-बैलों के झुंड के एक बैल के लिए प्रयुक्त मुहावरा है; इसका अनुवाद ‘एक जवान बैल’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר
  choice: बैल
  rationale: बलिदानी पशुओं की सूची में यह शब्द बैल अथवा युवा बैल को दर्शाता है; सामान्य आधुनिक हिन्दी में ‘बैल’ स्पष्ट और स्वाभाविक है।
- source_word: אֶחָד
  choice: एक
  rationale: प्रत्येक प्रकार के पशु की संख्या एक बताता है।
- source_word: בֶּן בָּקָר
  choice: झुंड में से
  rationale: शाब्दिक अर्थ ‘गोधन का पुत्र’ है; यह मुहावरा पशु को गाय-बैलों के झुंड का बताता है। ‘बैल’ के साथ इसे ‘झुंड में से’ कहना अर्थ को बनाए रखते हुए अनावश्यक पुनरुक्ति से बचाता है।
- source_word: אַיִל
  choice: मेढ़ा
  rationale: बलिदानी संदर्भ में वयस्क नर भेड़ के लिए प्रचलित और सटीक हिन्दी शब्द।
- source_word: כֶּבֶשׂ
  choice: नर मेमना
  rationale: यह मेमने को दर्शाता है और इस बलिदानी सूची में उसका नर होना स्पष्ट करना उपयुक्त है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह इब्रानी मुहावरा पशु की आयु बताता है; ‘एक वर्ष का’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलिदान का मानक पद है जिसे वेदी पर पूर्णतः जलाया जाता था; हिन्दी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त और परिचित है।
