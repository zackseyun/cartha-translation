base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/061.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका वज़न एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका वज़न पवित्रस्थान के शेकेल[c] के अनुसार सत्तर शेकेल था। दोनों अन्नबलि के लिए तेल से मिले हुए मैदे से भरे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परात’; इब्रानी शब्द (קַעֲרָה) चौड़े, उथले पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘बड़ा कटोरा’; इब्रानी शब्द (מִזְרָק) पवित्रस्थान की सेवा में प्रयुक्त पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: ‘पवित्रस्थान के शेकेल के अनुसार’ का अर्थ है पवित्रस्थान में मान्य मानक भार के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट यह थी
  rationale: कָרְבָּן उपासना के संदर्भ में निकट लाई गई भेंट है; यह हिंदी में सूची का स्वाभाविक आरंभ करता है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קְעָרָה चौड़े और अपेक्षाकृत उथले पात्र को दर्शाता है; ‘थाली’ इसका सहज आधुनिक हिंदी समकक्ष है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका वज़न एक सौ तीस शेकेल था
  rationale: मूल पाठ में ‘उसका वज़न’ स्पष्ट है; संबंधवाचक वाक्य हिंदी में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק पवित्रस्थान की सेवा में प्रयुक्त पात्र है; ‘कटोरा’ आकार का सामान्य और स्पष्ट संकेत देता है, जबकि विशिष्ट धार्मिक उपयोग प्रसंग से प्रकट है।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका वज़न ... सत्तर शेकेल था
  rationale: हिब्रू की संक्षिप्त भार-सूचना को स्पष्ट आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह वाक्यांश पवित्रस्थान द्वारा मान्य मानक भार को सूचित करता है; पारंपरिक इकाई ‘शेकेल’ को बनाए रखा गया है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... से भरे थे
  rationale: दोनों पात्रों की ओर संकेत करने वाले स्पष्ट बहुवचन को सुरक्षित रखा गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलियों में प्रयुक्त बारीक पिसे हुए उत्तम आटे को दर्शाता है; ‘मैदा’ साधारण आधुनिक हिंदी में सबसे सहज है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल से मिला हुआ
  rationale: निष्क्रिय कृदंत आटे के तेल के साथ मिश्रित होने को बताता है; हिंदी में लिंग-वचन के अनुसार ‘मिले हुए मैदे’ किया गया है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय संदर्भ में מִנְחָה सामान्य भेंट नहीं, विशिष्ट अन्नबलि है।
