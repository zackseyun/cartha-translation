source:
  edition: WLC
  text: וַ/יְהִ֗י הַ/מַּקְרִ֛יב בַּ/יּ֥וֹם הָ/רִאשׁ֖וֹן אֶת קָרְבָּנ֑/וֹ נַחְשׁ֥וֹן בֶּן עַמִּינָדָ֖ב לְ/מַטֵּ֥ה יְהוּדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/012.yaml
  text: And the one presenting his offering on the first day was Nahshon son of Amminadab[a], of the tribe of Judah.
translation:
  language: hi
  text: पहले दिन अपना चढ़ावा प्रस्तुत करनेवाला अम्मीनादाब का पुत्र नहशोन था[a], जो यहूदा के गोत्र की ओर से था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसका अनुवाद इस प्रकार भी हो सकता है: “पहले दिन अपना चढ़ावा चढ़ानेवाला अम्मीनादाब का पुत्र नहशोन था, जो यहूदा के गोत्र का था।” इब्रानी कृदंत और “यहूदा के गोत्र की ओर से/का” पदबंध को अर्थ में विशेष अंतर किए बिना थोड़े भिन्न ढंग से व्यक्त किया जा सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: वाव-क्रमिक के साथ היה यहाँ कथात्मक वाक्य को आगे बढ़ाता है; आधुनिक हिन्दी में स्वाभाविक भूतकालीन ‘था’ इसका अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: הַמַּקְרִיב
  choice: प्रस्तुत करनेवाला
  rationale: קרב का हिफ़ील कृदंत चढ़ावे को निकट लाने अथवा विधिपूर्वक प्रस्तुत करनेवाले व्यक्ति को दर्शाता है; ‘प्रस्तुत करनेवाला’ इस उपासना-संबंधी भाव को बनाए रखता है।
- source_word: בַּיּוֹם הָרִאשׁוֹן
  choice: पहले दिन
  rationale: यह समय-सूचक पद का आधुनिक हिन्दी में सीधा और स्वाभाविक रूप है।
- source_word: אֶת קָרְבָּנוֹ
  choice: अपना चढ़ावा
  rationale: קָרְבָּן यहाँ पवित्रस्थान के समर्पण के प्रसंग में अर्पित भेंट को दर्शाता है; ‘चढ़ावा’ धार्मिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נַחְשׁוֹן
  choice: नहशोन
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן עַמִּינָדָב
  choice: अम्मीनादाब का पुत्र
  rationale: इब्रानी पितृनाम-सूचक संरचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לְמַטֵּה יְהוּדָה
  choice: यहूदा के गोत्र की ओर से
  rationale: מַטֶּה यहाँ ‘गोत्र’ है और उपसर्ग לְ प्रतिनिधित्व या संबद्धता जता सकता है; प्रसंग में नहशोन का यहूदा के गोत्र का प्रतिनिधि होकर चढ़ावा प्रस्तुत करना प्रमुख है।
