  yaml_path: translation/ot/numbers/007/007.yaml
  text: He gave the two carts and the four cattle to the sons of Gershon[b][a], according to their service.
translation:
  language: hi
  text: उसने उनकी सेवा के अनुसार दो गाड़ियाँ और चार मवेशी गेरशोन के पुत्रों को दिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֲגָלֹת
  choice: गाड़ियाँ
  rationale: यह शब्द सामान ढोने वाली गाड़ी को दर्शाता है; तंबू के परिवहन के संदर्भ में ‘गाड़ियाँ’ स्वाभाविक और स्पष्ट है।
- source_word: הַבָּקָר
  choice: मवेशी
  rationale: इब्रानी शब्द गोवंश के लिए सामूहिक संज्ञा है। ‘मवेशी’ लिंग या बधियाकरण को अनावश्यक रूप से निश्चित किए बिना मूल की व्यापकता बनाए रखता है।
- source_word: לִבְנֵי גֵרְשׁוֹן
  choice: गेरशोन के पुत्रों को
  rationale: यह इब्रानी की शाब्दिक वंश-सूचक अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כְּפִי עֲבֹדָתָם
  choice: उनकी सेवा के अनुसार
  rationale: यहाँ עֲבֹדָה मिलापवाले तंबू से संबंधित नियत सेवा या दायित्व है; यह अनुवाद उसी भाव को बनाए रखता है।
- source_word: נָתַן
  choice: दे दिए
  rationale: क्रिया का सीधा अर्थ ‘देना’ है; प्रसंग में आवंटन निहित होने पर भी अनुवाद में अतिरिक्त अर्थ नहीं जोड़ा गया।
