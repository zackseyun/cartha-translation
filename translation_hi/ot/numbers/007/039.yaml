  yaml_path: translation/ot/numbers/007/039.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: hi
  text: गोवंश का एक बैल, एक मेढ़ा, और एक वर्ष का एक नर मेमना, होमबलि के लिए;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: एक बछड़ा
  rationale: यह पदबंध गोवंश के एक नर पशु को दर्शाता है। आधुनिक हिन्दी में बलि-सूची के संदर्भ में ‘बछड़ा’ स्वाभाविक और स्पष्ट है; ‘गोवंश का पुत्र’ जैसा अक्षरशः अनुवाद अस्वाभाविक होता।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל वयस्क नर भेड़ के लिए प्रचलित बलिदानी शब्द है; ‘मेढ़ा’ उसका सीधा हिन्दी समतुल्य है।
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: एक वर्ष का एक नर मेमना
  rationale: כֶּבֶשׂ बलिदानी संदर्भ में नर मेमने को सूचित करता है और בֶּן שְׁנָתוֹ का स्वाभाविक अर्थ ‘एक वर्ष का’ है। दोनों ‘एक’ बनाए रखने से मूल सूची की गणनात्मक संरचना सुरक्षित रहती है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक शब्द है जो वेदी पर पूर्णतः जलाई जाती थी; हिन्दी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त, प्रतिष्ठित और अर्थानुकूल है। उपसर्ग לְ को ‘के लिए’ से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त बलि-सूची; मूल इब्रानी की पुनरुक्त संख्या और पशुओं के क्रम को सुरक्षित रखा गया है। ‘होमबलि’ धार्मिक संदर्भ का परिचित शब्द है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए सहज रखा गया है।
