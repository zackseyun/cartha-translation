source:
  edition: WLC
  text: וּ/בְ/בֹ֨א מֹשֶׁ֜ה אֶל אֹ֣הֶל מוֹעֵד֮ לְ/דַבֵּ֣ר אִתּ/וֹ֒ וַ/יִּשְׁמַ֨ע אֶת הַ/קּ֜וֹל מִדַּבֵּ֣ר אֵלָ֗י/ו מֵ/עַ֤ל הַ/כַּפֹּ֨רֶת֙ אֲשֶׁר֙ עַל אֲרֹ֣ן הָ/עֵדֻ֔ת מִ/בֵּ֖ין שְׁנֵ֣י הַ/כְּרֻבִ֑ים וַ/יְדַבֵּ֖ר אֵלָֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/089.yaml
  text: When Moses went into the tent of meeting to speak with him[a], he heard the voice speaking to him from above the mercy seat that was on the ark of the testimony, from between the two cherubim[c][b]; and he spoke to him.
translation:
  language: hi
  text: जब मूसा उससे बात करने के लिए मिलापवाले तंबू में गया, तब उसने वह वाणी सुनी जो साक्षीपत्र के संदूक पर के प्रायश्चित के ढक्कन[a] के ऊपर से, दोनों करूबों के बीच से, उससे बोल रही थी; और वह उससे बोला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “प्रायश्चित का ढक्कन” साक्षीपत्र के संदूक का पवित्र ढक्कन था; यह वही स्थान था जिसके ऊपर से, दोनों करूबों के बीच से, यहोवा मूसा से बोलता था।
    reason: cultural_note
  - marker: b
    text: अंतिम वाक्यांश का कर्ता इब्रानी में स्पष्ट नाम से नहीं दिया गया है। प्रसंग में इसका सबसे स्वाभाविक अर्थ “और यहोवा उससे बोला” है; इसे “और वाणी उससे बोली” भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְבֹא
  choice: जब मूसा ... गया
  rationale: ב के साथ infinitive construct यहाँ कालवाचक उपवाक्य बनाता है। हिन्दी में ‘जब ... गया’ स्वाभाविक है और प्रसंग की घटनात्मक गति बनाए रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह इस्राएली पवित्रस्थान का प्रचलित और साधारण पाठकों के लिए बोधगम्य हिन्दी नाम है।
- source_word: לְדַבֵּר אִתּוֹ
  choice: उससे बात करने के लिए
  rationale: אִתּוֹ का संबंधपरक भाव ‘उससे’ द्वारा सुरक्षित रहता है; सर्वनाम को स्पष्ट नाम से बदलकर मूल की अंतर्निहितता नहीं मिटाई गई।
- source_word: וַיִּשְׁמַע אֶת־הַקּוֹל
  choice: उसने वह वाणी सुनी
  rationale: קוֹל का अर्थ ध्वनि या वाणी हो सकता है, पर आगे ‘बोल रही थी’ और दिव्य प्रकाशन का प्रसंग ‘वाणी’ को उपयुक्त बनाते हैं।
- source_word: מִדַּבֵּר
  choice: बोल रही थी
  rationale: Hitpael participle का रूप असामान्य है और बोलती हुई वाणी का निरंतर चित्र देता है। मुख्य पाठ सक्रिय अर्थ रखता है, पर व्याकरणिक सूक्ष्मता को अंतिम खंड की टिप्पणी में संकेतित किया गया है।
- source_word: מֵעַל הַכַּפֹּרֶת
  choice: प्रायश्चित-ढकने के ऊपर से
  rationale: כַּפֹּרֶת संदूक का विशिष्ट पवित्र ढक्कन है। ‘प्रायश्चित-ढकना’ वस्तु और उसके उपासना-संबंधी अर्थ दोनों को व्यक्त करता है; टिप्पणी इसे स्पष्ट करती है।
- source_word: אֲרֹן הָעֵדֻת
  choice: साक्षीपत्र का संदूक
  rationale: עֵדֻת यहाँ संदूक में रखे वाचा-संबंधी साक्षीपत्र को सूचित करता है। ‘साक्षीपत्र’ केवल अमूर्त ‘साक्षी’ की अपेक्षा आधुनिक हिन्दी में अधिक स्पष्ट है।
- source_word: מִבֵּין שְׁנֵי הַכְּרֻבִים
  choice: दोनों करूबों के बीच से
  rationale: ‘करूब’ כְּרוּב का प्रचलित लिप्यंतरण है; ‘दोनों’ ठीक दो आकृतियों को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: וַיְדַבֵּר אֵלָיו
  choice: और वह उससे बोलता रहा
  rationale: अपूर्ण क्रिया का प्रसंगगत निरंतर/पुनरावृत्त भाव ‘बोलता रहा’ से व्यक्त होता है। ‘वह’ मूल के अव्यक्त कर्ता—सबसे संभवतः दिव्य वक्ता या वाणी—को अनावश्यक रूप से स्पष्ट नहीं करता।
theological_decisions:
- issue: לְדַבֵּר אִתּוֹ में ‘उससे’ का संदर्भ
  choice: सर्वनाम को ‘उससे’ ही रखा गया
  alternative: ‘यहोवा से बात करने के लिए’
  rationale: प्रसंग में संदर्भ परमेश्वर का है, पर इब्रानी पाठ नाम स्पष्ट नहीं करता। सर्वनाम मूल की शैली और अंतर्निहित संदर्भ सुरक्षित रखता है।
- issue: अंतिम וַיְדַבֵּר אֵלָיו का कर्ता
  choice: ‘वह उससे बोलता रहा’—कर्ता को सर्वनाम द्वारा अनिर्दिष्ट रखा गया
  alternative: ‘यहोवा मूसा से बोलता रहा’; ‘वाणी उससे बोलती रही’; अथवा ‘मूसा उससे बोलता रहा’
  rationale: निकटतम प्रसंग दिव्य वाणी को स्रोत बनाता है, और सबसे संभावित अर्थ है कि परमेश्वर/वाणी मूसा से बोलती रही। फिर भी इब्रानी में कर्ता नामित नहीं है; इसलिए हिन्दी में उसे स्पष्ट करके वास्तविक व्याकरणिक तनाव समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय किंतु सहज शैली अपनाई गई है। पवित्रस्थान-संबंधी पारिभाषिक पदों के लिए ‘मिलापवाला तंबू’, ‘साक्षीपत्र का संदूक’, ‘प्रायश्चित-ढकना’ और ‘करूब’ प्रयुक्त हुए हैं। इब्रानी के अस्पष्ट सर्वनामों को अनावश्यक रूप से स्पष्ट नहीं किया गया।
