  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। मूल की सूचीगत संक्षिप्तता और प्रत्येक पशु के साथ दोहराए गए ‘एक’ को सुरक्षित रखा गया है।
