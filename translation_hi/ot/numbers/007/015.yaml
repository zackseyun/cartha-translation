translation:
  language: hi
  text: होमबलि के लिए झुंड में से एक बैल, एक मेढ़ा और एक वर्ष का एक नर मेमना;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר ... בֶּן בָּקָר
  choice: झुंड में से एक बैल
  rationale: פַּר बैल को दर्शाता है और בֶּן בָּקָר उसके गोवंश का होने को स्पष्ट करता है। ‘झुंड में से’ इब्रानी विशेषण को सहज हिंदी में रखता है और अनावश्यक पुनरुक्ति से बचाता है।
- source_word: אַיִל
  choice: एक मेढ़ा
  rationale: बलिदान-संबंधी प्रसंग में वयस्क नर भेड़ के लिए आधुनिक मानक हिंदी शब्द।
- source_word: כֶּבֶשׂ
  choice: एक नर मेमना
  rationale: यह मेमने को दर्शाता है और बलिदान की इस सूची में नर पशु का आशय स्पष्ट करना उचित है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: इब्रानी मुहावरे का स्वाभाविक हिंदी रूप, जो पशु की आयु बताता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि की मानक संज्ञा है जिसे वेदी पर पूर्णतः जलाया जाता था; ‘होमबलि’ प्रचलित और संक्षिप्त बाइबलीय हिंदी पद है।
- source_word: אֶחָד
  choice: एक
  rationale: हर पशु की संख्या बताने वाली इब्रानी पुनरावृत्ति को सूची की शैली में बनाए रखा गया है।
