lexical_decisions:
- source_word: כַּף
  choice: धूप-पात्र
  rationale: यहाँ כַּף मनुष्य की हथेली नहीं, बल्कि उपासना में धूप रखने का छोटा पात्र है। ‘धूप-पात्र’ आधुनिक हिन्दी में उसके कार्य को स्पष्ट करते हुए संदर्भ के अनुकूल है।
- source_word: אַחַת
  choice: एक
  rationale: यह स्त्रीलिंग संख्यावाचक शब्द כַּף के साथ मेल खाता है और साधारण संख्या ‘एक’ बताता है।
- source_word: עֲשָׂרָה
  choice: दस शेकेल
  rationale: मूल पाठ में केवल ‘दस’ है, पर आसपास बार-बार आने वाले भेंट-विवरण से भार की इकाई ‘शेकेल’ समझी जाती है; स्वाभाविक और स्पष्ट हिन्दी के लिए इसे मुख्य पाठ में व्यक्त किया गया है।
- source_word: זָהָב
  choice: सोने का
  rationale: यह पात्र की सामग्री बताता है; ‘सोने का’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מְלֵאָה
  choice: भरा था
  rationale: यह स्त्रीलिंग पात्र की अवस्था बताने वाला विशेषण है; हिन्दी वाक्य में ‘जो ... से भरा था’ सहज और स्पष्ट है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: यह उपासना में प्रयुक्त सुगंधित पदार्थ के लिए मानक और संदर्भानुकूल हिन्दी शब्द है।
