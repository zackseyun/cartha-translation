  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/037.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, by the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका भार पवित्रस्थान के शेकेल[c] के अनुसार सत्तर शेकेल था। दोनों तेल से मिले हुए मैदे से भरे थे—अन्नबलि के लिए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परात” अथवा “छिछला कटोरा”; इब्रानी शब्द קַעֲרָה एक चौड़े पात्र के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “छिड़काव का कटोरा”; इब्रानी מִזְרָק अन्य संदर्भों में धार्मिक छिड़काव के लिए प्रयुक्त पात्र को दर्शा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “पवित्रस्थान के शेकेल के अनुसार” का अर्थ है पवित्रस्थान में मान्य भार-मानक के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट
  rationale: קָרְבָּן उपासना में परमेश्वर के सामने लाई गई भेंट को दर्शाता है; आधुनिक हिन्दी में ‘भेंट’ स्पष्ट और स्वाभाविक है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קְעָרָה किसी चौड़े, अपेक्षाकृत छिछले पात्र—थाली, परात या कटोरे—को सूचित कर सकता है। मुख्य पाठ में ‘थाली’ सहज है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार एक सौ तीस शेकेल था
  rationale: इब्रानी की नामवाची रचना ‘उसका भार’ सुरक्षित रहती है और हिन्दी वाक्य स्वाभाविक बनता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק धार्मिक सेवा में प्रयुक्त कटोरे या पात्र को दर्शाता है, कभी छिड़काव के लिए भी। यहाँ कार्य को अनावश्यक रूप से निश्चित किए बिना ‘कटोरा’ उपयुक्त है।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका भार ... सत्तर शेकेल था
  rationale: यह दूसरे पात्र का भार बताता है; स्पष्टता के लिए हिन्दी में ‘जिसका भार’ दोहराया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह सामान्यतः पवित्रस्थान द्वारा मान्य भार-मानक को दर्शाता है; मूल का धार्मिक संदर्भ बनाए रखते हुए अर्थ स्पष्ट किया गया है।
- source_word: שְׁנֵיהֶם
  choice: दोनों
  rationale: यह पहले बताए गए दोनों चाँदी के पात्रों को सामूहिक रूप से संदर्भित करता है।
- source_word: מְלֵאִים
  choice: भरे थे
  rationale: पात्रों में सामग्री पूरी तरह भरी होने का विधेयात्मक भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת बलि में प्रयुक्त बारीक पिसे आटे को दर्शाता है; ‘मैदा’ सामान्य आधुनिक हिन्दी में इसका संक्षिप्त और बोधगम्य समतुल्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल से मिले हुए
  rationale: यह मैदे को तेल के साथ मिलाए जाने का वर्णन करता है; कृदन्त का स्त्रीलिंग रूप סֹלֶת के साथ जुड़ता है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय प्रसंग में מִנְחָה अनाज से तैयार की गई बलि को दर्शाता है; ‘अन्नबलि’ हिन्दी में संक्षिप्त और पारंपरिक रूप से समझने योग्य है।
