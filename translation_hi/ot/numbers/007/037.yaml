translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘शेकेल’ को प्राचीन भार-इकाई के रूप में लिप्यंतरित किया गया है। मूल की सूची-सदृश रचना को स्पष्ट हिन्दी वाक्य-विन्यास में बदला गया है, पर दोनों पात्रों, उनके भार, मानक और सामग्री के सभी विवरण सुरक्षित हैं।
