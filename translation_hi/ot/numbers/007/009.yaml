source:
  edition: WLC
  text: וְ/לִ/בְנֵ֥י קְהָ֖ת לֹ֣א נָתָ֑ן כִּֽי עֲבֹדַ֤ת הַ/קֹּ֨דֶשׁ֙ עֲלֵ/הֶ֔ם בַּ/כָּתֵ֖ף יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/009.yaml
  text: But to the sons of Kohath he gave none[a], because the service of the holy things was upon them; they were to carry them on the shoulder.
translation:
  language: hi
  text: परन्तु कहात के वंशजों को उसने कुछ नहीं दिया, क्योंकि पवित्र वस्तुओं की सेवा का दायित्व उन पर था; उन्हें वे वस्तुएँ अपने कंधों पर उठानी थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “क्योंकि पवित्रस्थान की सेवा उन पर थी; उन्हें उसे कंधे पर उठाना था।” यहाँ इब्रानी शब्द सम्भवतः विशेष रूप से कहातियों को सौंपी गई पवित्र वस्तुओं की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לִ/בְנֵי קְהָת
  choice: परन्तु कहात के वंशजों को
  rationale: לִבְנֵי यहाँ कहात के वंश-समूह को दर्शाता है। आधुनिक हिन्दी में ‘वंशजों’ से कुलगत अर्थ स्पष्ट होता है, और आरम्भिक וְ को पिछले पद में अन्य लेवी कुलों को मिले उपहारों के साथ विरोध दिखाने के लिए ‘परन्तु’ कहा गया है।
- source_word: לֹא נָתָן
  choice: उसने कुछ नहीं दिया
  rationale: नकार सहित נתן का कर्म पिछले संदर्भ के छकड़ों और बैलों से समझा जाता है। ‘कुछ नहीं दिया’ इस निहित कर्म को बिना अनावश्यक विस्तार के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उन्हें छकड़े और बैल न दिए जाने का कारण प्रस्तुत करता है।
- source_word: עֲבֹדַת הַקֹּדֶשׁ
  choice: पवित्र वस्तुओं की सेवा
  rationale: निकटवर्ती संदर्भ में הַקֹּדֶשׁ का संकेत कहातियों को सौंपी गई पवित्र वस्तुओं की ओर होने की अधिक सम्भावना है। यह अनुवाद ‘सेवा’ और पवित्र वस्तुओं—दोनों भावों को बनाए रखता है।
- source_word: עֲלֵיהֶם
  choice: का दायित्व उन पर था
  rationale: शाब्दिक ‘उन पर थी’ दायित्व का मुहावरा है। हिन्दी में ‘दायित्व उन पर था’ उसी बाध्यता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַּכָּתֵף
  choice: अपने कंधों पर
  rationale: इब्रानी में ‘कंधे पर’ एकवचन सामूहिक अर्थ में है। बहुवचन कर्ता के साथ हिन्दी में ‘अपने कंधों पर’ अधिक स्वाभाविक है और हाथ से ढोने की विधि स्पष्ट करता है।
- source_word: יִשָּׂאוּ
  choice: उन्हें वे वस्तुएँ ... उठानी थीं
  rationale: यहाँ अपूर्ण क्रिया निर्धारित कर्तव्य व्यक्त करती है। हिन्दी का ‘उठानी थीं’ उस बाध्यता को दिखाता है; कर्म संदर्भ से पवित्र वस्तुएँ है और स्पष्टता के लिए व्यक्त किया गया है।
theological_decisions:
- issue: עֲבֹדַת הַקֹּדֶשׁ में הַקֹּדֶשׁ का आशय
  choice: पवित्र वस्तुओं की सेवा
  alternative: पवित्रस्थान की सेवा
  rationale: गिनती 4 और इस पद में कंधों पर ढोने के उल्लेख के कारण पवित्र साज-सामान का अर्थ अधिक संदर्भ-संगत है, फिर भी ‘पवित्रस्थान’ वाला व्यापक अर्थ भाषिक रूप से सम्भव है; इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘कहात के वंशज’ कुलगत पहचान स्पष्ट करता है; ‘दायित्व’ इब्रानी मुहावरे ‘उन पर’ का स्वाभाविक हिन्दी रूप है। पादटिप्पणी का चिह्न मुख्य पाठ में रखा गया है।
