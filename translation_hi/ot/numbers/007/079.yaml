source:
  edition: WLC
  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/079.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका भार पवित्र-स्थान के शेकेल के अनुसार सत्तर शेकेल था। दोनों तेल से मिले हुए मैदे से भरे थे, जो अन्नबलि के लिए था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी का एक पात्र”; इब्रानी शब्द קַעֲרָה एक पात्र को दर्शाता है, पर उसका ठीक आकार निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या “छिड़काव का चाँदी का एक कटोरा”; इब्रानी शब्द מִזְרָק इस पात्र के अनुष्ठानिक उपयोग की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट
  rationale: बलिदान-संबंधी प्रसंग में קָרְבָּן परमेश्वर के सामने लाई गई भेंट को दर्शाता है; ‘भेंट’ स्वाभाविक और स्पष्ट है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קַעֲרָה एक पात्र है, संभवतः अपेक्षाकृत छिछला; ‘थाली’ उपयुक्त मुख्य-पाठ विकल्प है, जबकि आकार की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार एक सौ तीस शेकेल था
  rationale: इब्रानी में भार का स्पष्ट उल्लेख है; यह रूप हिंदी में स्वाभाविक रहते हुए उसे सुरक्षित रखता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק अनुष्ठान में प्रयुक्त पात्र है; ‘कटोरा’ उसके आकार को अनावश्यक रूप से निश्चित किए बिना सहज हिंदी देता है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्र-स्थान के शेकेल के अनुसार
  rationale: यह उपासना-स्थान में मान्य भार-मानक को सूचित करने वाला पारिभाषिक वाक्यांश है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... से भरे थे
  rationale: द्विवचन-संदर्भ दोनों पात्रों को स्पष्ट रूप से समेटता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलि में प्रयुक्त बारीक पिसे उत्तम आटे को दर्शाता है; आधुनिक हिंदी में ‘मैदा’ संक्षिप्त और बोधगम्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल से मिले हुए
  rationale: निष्क्रिय कृदंत आटे के तेल के साथ मिलाए जाने को दर्शाता है; यह रूप सरल और सटीक है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय प्रसंग में מִנְחָה विशेष रूप से अन्न से संबंधित बलि की श्रेणी को दर्शाता है।
