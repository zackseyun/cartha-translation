lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁמִינִי
  choice: आठवें दिन
  rationale: בְּ के साथ יוֹם और क्रमवाचक विशेषण स्वाभाविक काल-सूचक पद बनाते हैं। यह अनुवाद पद में निहित समय को बिना अतिरिक्त प्रसंग जोड़े स्पष्ट करता है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: इस प्रसंग में यह शब्द गोत्र के मान्य अगुवे या मुखिया को सूचित करता है। ‘प्रधान’ आधुनिक हिन्दी में गरिमापूर्ण है और ‘राजकुमार’ जैसे अनावश्यक राजकीय अर्थ से बचता है।
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों का
  rationale: यह पद उस जनसमूह को बताता है जिसका प्रधान गमलीएल था। בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह वंशीय/गोत्रीय समूह का पदनाम है; इसलिए मुख्य पाठ में ‘वंशजों’ स्वाभाविक और अर्थ-सटीक है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: व्यक्ति और उससे निकले गोत्र के नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: גַּמְלִיאֵל
  choice: गमलीएल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली-सूचक संबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: פְּדָה צוּר
  choice: पदासूर
  rationale: संयुक्त इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
