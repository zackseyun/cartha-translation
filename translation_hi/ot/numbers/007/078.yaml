  text: On the twelfth day, the leader of the sons of Naphtali was Ahira son of Enan.
translation:
  language: hi
  text: बारहवें दिन नप्ताली के पुत्रों का प्रधान एनान का पुत्र अहीरा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּיוֹם שְׁנֵים עָשָׂר
  choice: बारहवें दिन
  rationale: इब्रानी में בְּיוֹם के साथ संख्या का यह प्रयोग क्रमसूचक अर्थ देता है; आधुनिक हिन्दी में इसका स्वाभाविक रूप ‘बारहवें दिन’ है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: गोत्रीय संदर्भ में यह शब्द मान्य मुखिया या अगुआ को सूचित करता है। ‘प्रधान’ राजकीय अर्थ जोड़े बिना पद और नेतृत्व दोनों व्यक्त करता है।
- source_word: לִבְנֵי נַפְתָּלִי
  choice: नप्ताली के पुत्रों का
  rationale: ל संबंध या गोत्रीय संबद्धता दर्शाता है, और בְנֵי का पुरुषवाची बहुवचन ‘पुत्रों’ के रूप में सुरक्षित रखा गया है।
- source_word: אֲחִירַע
  choice: अहीरा
  rationale: व्यक्तिनाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן עֵינָן
  choice: एनान का पुत्र
  rationale: इब्रानी पितृनाम-सूचक रचना को हिन्दी की स्वाभाविक संबंधवाचक संरचना में प्रस्तुत किया गया है।
theological_decisions:
- issue: गोत्रीय पदबंध בְּנֵי का लिंग-सूचक रूप
  choice: नप्ताली के पुत्रों
  alternative: नप्ताली की सन्तानों / नप्ताली के वंशजों
  rationale: मूल इब्रानी व्याकरणतः पुल्लिंग बहुवचन है और यहाँ रूढ़ गोत्रीय पदनाम के रूप में प्रयुक्त हुआ है; इसलिए बिना प्रसंगगत आवश्यकता के इसे लिंग-निरपेक्ष नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य की इब्रानी परिचयात्मक संरचना और अध्याय में दोहराया गया सूत्र सुरक्षित है।
