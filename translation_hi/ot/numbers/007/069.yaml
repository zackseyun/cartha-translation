  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “एक बैल, मवेशियों का पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या “एक मेमना”; यहाँ प्रयुक्त हिब्रू शब्द बलि-संबंधी संदर्भों में प्रायः नर मेमने के लिए आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: झुंड में से एक बैल
  rationale: פַּר का अर्थ बैल या युवा बैल है, और בֶּן בָּקָר शाब्दिक रूप से ‘मवेशियों का पुत्र’ होकर गोवंशीय झुंड से होने का वर्गसूचक मुहावरा है। ‘झुंड में से एक बैल’ स्वाभाविक हिंदी में दोनों तत्व सुरक्षित रखता है।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל बलि-संबंधी संदर्भ में वयस्क नर भेड़ के लिए मानक शब्द है; ‘मेढ़ा’ इसका सटीक और प्रचलित हिंदी समतुल्य है।
- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ मेमने को दर्शाता है और बलि-संबंधी संदर्भ में नर पशु अभिप्रेत हो सकता है। मुख्य पाठ में ‘नर मेमना’ स्पष्ट है, जबकि पादटिप्पणी केवल ‘मेमना’ की संभावित प्रस्तुति बताती है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह हिब्रू आयु-सूचक मुहावरा है, जिसका स्वाभाविक आधुनिक हिंदी रूप ‘एक वर्ष का’ है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक पद है जो वेदी पर पूर्णतः जलाई जाती थी। हिंदी बाइबलीय प्रयोग में ‘होमबलि’ संक्षिप्त, गरिमापूर्ण और समझने योग्य है।
- source_word: אֶחָד
  choice: एक
  rationale: प्रत्येक पशु के साथ दोहराए गए संख्या-वाचक शब्द को सूची की संरचना बनाए रखने के लिए लगातार ‘एक’ किया गया है।
