base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/031.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the sanctuary shekel[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका वज़न एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका वज़न सत्तर शेकेल था—ये वज़न पवित्रस्थान के शेकेल[c] के अनुसार थे। दोनों अन्नबलि के लिए तेल से मिले हुए उत्तम मैदे से भरे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़ी तश्तरी”; इब्रानी शब्द एक अनुष्ठानिक पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “बेसिन”; यह बलिदान के काम में आने वाला पात्र था।
    reason: lexical_alternative
  - marker: c
    text: अर्थात पवित्रस्थान में मान्य वज़न के मानक के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट यह थी
  rationale: קָרְבָּן उपासना के लिए चढ़ाई गई भेंट को दर्शाता है; यह वाक्यांश सूची का स्वाभाविक हिन्दी परिचय देता है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קְעָרָה अपेक्षाकृत चौड़े पात्र को दर्शाता है; 'थाली' सरल और संदर्भानुकूल है, जबकि वैकल्पिक आकार फुटनोट में रखा गया है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका वज़न एक सौ तीस शेकेल था
  rationale: मूल के स्पष्ट 'उसका वज़न' को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק बलिदान-संबंधी पात्र है; 'कटोरा' आधुनिक हिन्दी में सहज है, और अधिक तकनीकी विकल्प फुटनोट में दिया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह उपासना-स्थान द्वारा निर्धारित मानक वज़न को सूचित करने वाला सूत्र है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... से भरे थे
  rationale: दोनों पात्रों की ओर संकेत करने वाले बहुवचन को स्पष्ट रूप से बनाए रखता है।
- source_word: סֹלֶת
  choice: उत्तम मैदा
  rationale: यह अन्नबलि में प्रयुक्त बारीक और उत्तम आटे का पारंपरिक अर्थ व्यक्त करता है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिलाया गया था
  rationale: निष्क्रिय कृदंत का अर्थ और तेल के साथ मिश्रण दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय प्रसंग में מִנְחָה सामान्य भेंट नहीं, विशिष्ट अन्नबलि को दर्शाता है।
