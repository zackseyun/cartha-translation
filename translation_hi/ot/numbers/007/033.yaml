  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/033.yaml
  text: one bull from the herd[a], one ram, one male lamb a year old, for a burnt offering[b];
translation:
  language: hi
  text: होमबलि के लिए झुंड में से एक बैल[a], एक मेढ़ा और एक वर्ष का एक नर मेमना[b];
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “एक बैल, गोधन का पुत्र”—यह झुंड के गोवंशीय पशु के लिए एक मुहावरा है, जिसे प्रायः जवान बैल समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने पहले वर्ष का एक नर मेमना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: झुंड में से एक बैल
  rationale: פַּר का स्वाभाविक अर्थ ‘बैल’ है और בֶּן בָּקָר शाब्दिक रूप से ‘गोधन का पुत्र’ होकर झुंड के गोवंशीय पशु का मुहावरेदार संकेत देता है। हिंदी में ‘झुंड में से एक बैल’ अर्थ को सहज रखते हुए अनावश्यक पुनरुक्ति से बचाता है।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל बलिदानी सूची में वयस्क नर भेड़ के लिए मानक शब्द है; ‘मेढ़ा’ इसका सटीक और प्रचलित हिंदी पर्याय है।
- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ मेमने को सूचित करता है और इस बलिदानी संदर्भ में उसका पुल्लिंग रूप स्पष्ट है; ‘नर मेमना’ उस विशिष्टता को बनाए रखता है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: यह इब्रानी आयु-सूचक मुहावरा ‘एक वर्ष का’ अथवा ‘अपने पहले वर्ष में’ होने का अर्थ देता है; मुख्य पाठ में स्वाभाविक हिंदी ‘एक वर्ष का’ रखी गई है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक पद है जिसे वेदी पर पूर्णतः जलाया जाता था; ‘होमबलि’ प्रतिष्ठित हिंदी बाइबलीय शब्दावली है और सूची के वाक्य-विन्यास में ‘के लिए’ स्वाभाविक है।
- source_word: אֶחָד
  choice: एक
  rationale: प्रत्येक पशु की संख्या बताने वाले दोहराए गए अंक को लगातार ‘एक’ अनूदित किया गया है।
