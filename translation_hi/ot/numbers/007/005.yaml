id: NUM.7.5
reference: Numbers 7:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קַ֚ח מֵֽ/אִתָּ֔/ם וְ/הָי֕וּ לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֣הֶל מוֹעֵ֑ד וְ/נָתַתָּ֤ה אוֹתָ/ם֙ אֶל הַ/לְוִיִּ֔ם אִ֖ישׁ כְּ/פִ֥י עֲבֹדָתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/005.yaml
  text: Take them from them[a], and let them be for doing the service of the tent of meeting; and you shall give them to the Levites[b], each according to his service.
translation:
  language: hi
  text: “उन्हें उनसे ले लो[a], ताकि वे मिलापवाले तम्बू की सेवा के काम आएँ; और उन्हें लेवियों को दे दो—हर एक को उसकी सेवा के अनुसार[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात उन प्रधानों से, जिन्होंने ये भेंटें चढ़ाई थीं।
    reason: referent_clarification
  - marker: b
    text: इसका भाव है कि प्रत्येक लेवी या लेवी-दल को उसके सौंपे गए काम की आवश्यकता के अनुसार दिया जाए।
    reason: idiom_clarification
lexical_decisions:
- source_word: קַח
  choice: ले लो
  rationale: לקח के आदेशात्मक रूप का सीधा और स्वाभाविक हिन्दी अनुवाद; प्रसंग में मूसा को भेंट की गई वस्तुएँ स्वीकार करने की आज्ञा है।
- source_word: מֵאִתָּם
  choice: उनसे
  rationale: पूर्वसर्ग और सर्वनाम स्रोत को व्यक्त करते हैं—वस्तुएँ उन प्रधानों से ली जानी हैं जिन्होंने उन्हें चढ़ाया था।
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת
  choice: ताकि वे ... सेवा के काम आएँ
  rationale: शाब्दिक रचना ‘वे सेवा करने के लिए हों’ उद्देश्य या नियत उपयोग बताती है। संदर्भ की निर्जीव वस्तुओं के लिए यह हिन्दी में स्वाभाविक है और मूल भाव सुरक्षित रखता है।
- source_word: עֲבֹדַת
  choice: सेवा
  rationale: यहाँ शब्द पवित्रस्थान से जुड़े नियत कार्य को दर्शाता है; ‘सेवा’ उसके आधिकारिक और उपासना-संबंधी भाव को बनाए रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: जंगल के पवित्रस्थान के लिए प्रचलित और समझने योग्य हिन्दी पद।
- source_word: וְנָתַתָּה אוֹתָם אֶל הַלְוִיִּם
  choice: उन्हें लेवियों को दे दो
  rationale: נתן का मूल अर्थ ‘देना’ है; यहाँ उपयोग के लिए सौंपना निहित है, पर सरल ‘दे दो’ मूल शब्दावली के निकट है।
- source_word: אִישׁ
  choice: हर एक को
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ रखता है और प्रत्येक लेवी अथवा लेवी-दल को उसके नियत कार्य के अनुसार दिए जाने की बात करता है।
- source_word: כְּפִי עֲבֹדָתוֹ
  choice: उसकी सेवा के अनुसार
  rationale: शाब्दिक मुहावरा ‘उसकी सेवा के मुँह के अनुसार’ प्रत्येक के नियत कार्य की आवश्यकता या मात्रा के अनुरूप वितरण बताता है। मुख्य पाठ मूल की संक्षिप्तता और संभावित व्यापकता बनाए रखता है।
