translation:
  language: hi
  text: झुंड में से एक बैल, एक मेढ़ा और एक वर्ष का एक नर मेमना—होमबलि के लिए;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר אֶחָד בֶּן בָּקָר
  choice: एक बैल
  rationale: פַּר בֶּן־בָּקָר बलि-सूची में गोवंश के एक नर पशु को सूचित करता है। हिंदी में ‘बैल’ स्वाभाविक और संक्षिप्त समतुल्य है; ‘झुंड में से’ जोड़ना अर्थ की अनावश्यक पुनरुक्ति करता।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל वयस्क नर भेड़ के लिए मानक बलिदानी पद है; ‘मेढ़ा’ इसका सटीक आधुनिक हिंदी रूप है।
- source_word: כֶּבֶשׂ אֶחָד בֶּן שְׁנָתוֹ
  choice: एक वर्ष का एक नर मेमना
  rationale: כֶּבֶשׂ यहाँ नर मेमना है और בֶּן שְׁנָתוֹ उसकी आयु को उसके पहले वर्ष/एक वर्ष का बताता है। यह रूप पशु की संख्या, लिंग और आयु को स्पष्ट रखता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का पारंपरिक और मानक पद है जिसे वेदी पर पूर्णतः जलाया जाता था; उपसर्ग לְ उद्देश्य दर्शाता है, इसलिए ‘के लिए’ स्वाभाविक है।
- source_word: אֶחָד
  choice: एक
  rationale: हर पशु के साथ दोहराई गई संख्या सूची की सटीक गणना बताती है; हिंदी में इसे प्रत्येक मद के साथ सुरक्षित रखा गया है।
