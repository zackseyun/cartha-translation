translation:
  language: hi
  text: सोने की एक तश्तरी[a], जिसका वज़न दस शेकेल था और जो धूप से भरी हुई थी;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “सोने की एक तश्तरी, दस, धूप से भरी हुई”; भार की इकाई “शेकेल” गिनती 7 में बार-बार आने वाले भेंट-विवरण से निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: धूपदानी
  rationale: यहाँ शब्द धूप रखने वाले छोटे पवित्र पात्र को दर्शाता है। ‘धूपदानी’ आधुनिक हिन्दी में उसके धार्मिक उपयोग को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है, यद्यपि मूल शब्द स्वयं पात्र की सामग्री का नाम नहीं है।
- source_word: אַחַת
  choice: एक
  rationale: स्त्रीलिंग संज्ञा כַּף के साथ प्रयुक्त सामान्य गणनावाचक संख्या।
- source_word: עֲשָׂרָה זָהָב
  choice: जिसका वज़न दस शेकेल था
  rationale: इब्रानी वाक्यांश संक्षिप्त है और भार की इकाई नहीं लिखता। गिनती 7 में बार-बार आने वाला भेंट-विवरण स्पष्ट करता है कि दस शेकेल भार अभिप्रेत है; इसलिए अर्थबोध के लिए ‘वज़न’ और ‘शेकेल’ जोड़े गए हैं।
- source_word: זָהָב
  choice: सोने की
  rationale: पात्र की सामग्री बताता है।
- source_word: מְלֵאָה
  choice: भरी थी
  rationale: पात्र की अवस्था और उसमें रखी सामग्री को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: आराधना में अर्पित किए जाने वाले सुगंधित पदार्थ के लिए मानक और सहज हिन्दी शब्द।
