  text: each silver plate weighing one hundred thirty shekels, and each basin seventy; all the silver of the vessels was two thousand four hundred shekels, by the shekel of the sanctuary.
translation:
  language: hi
  text: चाँदी की प्रत्येक थाली का वज़न एक सौ तीस शेकेल और प्रत्येक कटोरे का वज़न सत्तर शेकेल था। पवित्रस्थान के शेकेल के अनुसार[a] इन पात्रों की चाँदी का कुल वज़न दो हज़ार चार सौ शेकेल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्रस्थान में प्रचलित शेकेल के मान से।”
    reason: हिब्रू वाक्यांश वज़न के अधिकृत पवित्रस्थान-मानक को दर्शाता है और इसे हिन्दी में एक से अधिक स्वाभाविक ढंग से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: שְׁלֹשִׁים וּמֵאָה
  choice: एक सौ तीस
  rationale: हिब्रू संख्या-विन्यास का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: הַקְּעָרָה הָאַחַת
  choice: प्रत्येक थाली
  rationale: सूची के संदर्भ में निश्चित एकवचन और संख्या का प्रयोग वितरणात्मक है; קְעָרָה के लिए यहाँ ‘थाली’ उपयुक्त पात्र-संज्ञा है।
- source_word: כֶּסֶף
  choice: चाँदी
  rationale: यहाँ शब्द धन नहीं, पात्र की धातु को दर्शाता है।
- source_word: הַמִּזְרָק הָאֶחָד
  choice: प्रत्येक कटोरा
  rationale: מִזְרָק अनुष्ठान में प्रयुक्त कटोरे या पात्र को दर्शाता है; संदर्भ में एकवचन वितरणात्मक है।
- source_word: כֹּל כֶּסֶף הַכֵּלִים
  choice: इन पात्रों की चाँदी का कुल वज़न
  rationale: हिन्दी में स्वाभाविक ढंग से सभी पात्रों में प्रयुक्त चाँदी की कुल तौल व्यक्त होती है; ‘वज़न’ प्रसंग से निहित है।
- source_word: אַלְפַּיִם וְאַרְבַּע מֵאוֹת
  choice: दो हज़ार चार सौ
  rationale: संख्या का मानक आधुनिक हिन्दी रूप।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह वज़न के मानक को बताता है; यह रूप अर्थ को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
