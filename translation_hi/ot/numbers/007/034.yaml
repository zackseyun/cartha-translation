  text: पापबलि के लिए एक बकरा;[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: ‘पापबलि के लिए बकरियों में से एक नर बकरा।’'
    reason: इब्रानी שְׂעִיר עִזִּים की शब्दशः संरचना दिखाने के लिए।
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: यह इब्रानी संबंध-वाक्यांश शब्दशः ‘बकरियों में से एक रोएँदार नर’ है, पर बलिदान-सूची में स्वाभाविक रूप से नर बकरे को सूचित करता है। ‘बकरा’ आधुनिक हिन्दी में स्पष्ट, संक्षिप्त और लिंग-विशिष्ट है।
- source_word: אֶחָד
  choice: एक
  rationale: गिनती-सूचक संख्या को स्पष्ट रखा गया है, जिससे गिनती 7 की दोहरावपूर्ण सूची-शैली और चढ़ावे की निश्चित संख्या सुरक्षित रहती है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: इस बलिदान-संबंधी प्रसंग में חַטָּאת अमूर्त ‘पाप’ के बजाय बलिदान की एक श्रेणी को दर्शाता है; उपसर्ग לְ को यहाँ स्वाभाविक रूप से ‘के लिए’ कहा गया है।
theological_decisions:
- issue: बलिदान-संबंधी प्रसंग में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: पाप
  rationale: आसपास का प्रसंग गोत्रों के प्रधानों द्वारा चढ़ाई गई बलि-सामग्री की सूची है। इसलिए यहाँ संज्ञा बलिदान की श्रेणी बताती है, केवल पाप की धारणा नहीं; यह अनुवाद किसी बाद की धर्मवैज्ञानिक व्याख्या को जोड़े बिना याजकीय शब्दावली का सीधा अर्थ देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सूची के संक्षिप्त स्वरूप और मूल पद के अंत में आए विराम-सदृश प्रवाह को अर्धविराम द्वारा सुरक्षित रखा गया है।
