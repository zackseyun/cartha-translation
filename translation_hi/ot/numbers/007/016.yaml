lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: यह इब्रानी पदबंध बकरियों में से नर पशु को सूचित करता है। आधुनिक हिन्दी में ‘बकरा’ स्वाभाविक और स्पष्ट रूप से नर बकरी को दर्शाता है।
- source_word: אֶחָד
  choice: एक
  rationale: गिनती और सूची की शैली बनाए रखने के लिए संख्या को स्पष्ट रूप से रखा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी इस प्रसंग में חַטָּאת किसी अमूर्त ‘पाप’ के बजाय पाप के लिए चढ़ाई जाने वाली निर्धारित बलि को दर्शाता है; לְ का अर्थ यहाँ ‘के लिए’ स्वाभाविक रूप से व्यक्त होता है।
