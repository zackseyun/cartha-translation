  alternative: शांतिबलि; सहभागिता-बलि; कल्याण-बलि
  rationale: मूल पद शांति, पूर्णता, सकुशलता और सामुदायिक सहभागिता से जुड़ा है। ‘मेलबलि’ हिन्दी बाइबलीय प्रयोग में पहचाना जाता है और किसी एक व्याख्यात्मक पहलू को अत्यधिक प्रमुख किए बिना संबंधात्मक भाव व्यक्त करता है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
