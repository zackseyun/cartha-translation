base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/047.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, five one-year-old lambs. This was the offering of Eliasaph son of Deuel.'
translation:
  language: hi
  text: 'और मेलबलि[a] के लिए: दो गाय-बैल, पाँच मेढ़े, पाँच बकरे और एक-एक वर्ष के पाँच मेमने। यह देऊएल के पुत्र एल्यासाप का चढ़ावा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “शांतिबलि,” “सहभागिता-बलि” या “कल्याण-बलि” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: संयोजक और पूर्वसर्ग को सूची की अगली मद के रूप में रखा गया है। זֶבַח שְׁלָמִים के लिए प्रचलित और संक्षिप्त हिन्दी बलिदानी पद ‘मेलबलि’ चुना गया है, जो शांति, सहभागिता और सकुशलता के अर्थक्षेत्र को पूरी तरह किसी एक अर्थ में सीमित नहीं करता।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गाय-बैल
  rationale: בָּקָר गोवंश के लिए सामूहिक संज्ञा है और यहाँ लिंग निर्दिष्ट नहीं है। ‘गाय-बैल’ आधुनिक हिन्दी में दोनों लिंगों को समेटते हुए अनावश्यक विशिष्टता से बचता है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם स्पष्ट रूप से नर भेड़ों को सूचित करता है; ‘मेढ़े’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים नर बकरों को सूचित करता है; हिन्दी में ‘बकरे’ लिंग को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच मेमने
  rationale: शाब्दिक ‘एक वर्ष के पुत्र’ आयु-निर्देश है। ‘एक-एक वर्ष के पाँच मेमने’ प्रत्येक पशु की आयु को सहज हिन्दी में स्पष्ट करता है।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: קָרְבַּן के लिए बलिदानी संदर्भ में ‘चढ़ावा’ स्वाभाविक है। कथात्मक सूची के हिन्दी प्रवाह के अनुरूप ‘था’ रखा गया है, यद्यपि हिब्रू वाक्य नाममात्र है।
- source_word: אֶלְיָסָף בֶּן דְּעוּאֵל
  choice: देऊएल के पुत्र एल्यासाप
  rationale: पितृनाम संबंध को सामान्य हिन्दी क्रम में व्यक्त किया गया है और व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है।
