  text: पापबलि के लिए एक बकरा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: बलिदान-संबंधी इस प्रयोग में यह पदबंध नर बकरी को दर्शाता है। हिन्दी में ‘बकरा’ स्वाभाविक रूप से नर पशु को सूचित करता है, इसलिए अलग से ‘नर’ जोड़ना अनावश्यक है।
- source_word: אֶחָד
  choice: एक
  rationale: गिनती की इस सूची में स्पष्ट संख्या को बनाए रखा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: यहाँ חַטָּאת का अर्थ अमूर्त ‘पाप’ नहीं, बल्कि बलिदान-संबंधी ‘पापबलि’ है; לְ को प्रसंगानुसार ‘के लिए’ कहा गया है।
theological_decisions:
- issue: बलिदान-संबंधी प्रसंग में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: पाप के लिए
  rationale: आस-पास का पाठ चढ़ावे के पशुओं और बलियों की सूची है, इसलिए यहाँ बलि का तकनीकी अर्थ अपेक्षित है; इससे पाठ में बाद की कोई धार्मिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: संक्षिप्त सूची-शैली को बनाए रखते हुए आधुनिक, सहज और गरिमापूर्ण हिन्दी प्रयोग की गई है।
