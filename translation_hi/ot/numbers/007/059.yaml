  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן גַּמְלִיאֵ֖ל בֶּן פְּדָה צֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/059.yaml
  text: 'And for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five one-year-old lambs[c][b]. This was the offering of Gamliel son of Pedahzur.'
translation:
  language: hi
  text: और मेल-बलि[a] के लिए दो गौपशु[b], पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच मेमने। यही गमलीएल पुत्र पदाहसूर की भेंट थी।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “शांति-बलि”, “सहभागिता की बलि” या “कुशल-मंगल की बलि” भी समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में गोवंश के लिए व्यापक शब्द है; परंपरागत अनुवाद: “दो बैल।”'
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यह क्रियारहित वाक्य है, जिसका शाब्दिक रूप “यही … की भेंट है” हो सकता है; यहाँ भूतकाल वर्णनात्मक सूची के अनुसार है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: और मेल-बलि के लिए
  rationale: संयोजक और संबंधसूचक उपसर्ग पिछली सूची को आगे बढ़ाते हैं। ‘मेल-बलि’ शְׁלָמִים का परिचित बलिदानी पद है और शांति, सहभागिता तथा कुशल-मंगल से जुड़े उसके अर्थक्षेत्र को किसी एक अर्थ तक सीमित नहीं करता।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गौपशु
  rationale: בָּקָר सामूहिक रूप से गोवंश को दर्शाता है; ‘गौपशु’ मूल की व्यापकता बनाए रखता है, जबकि ‘दो बैल’ अनावश्यक रूप से पशुओं को अधिक विशिष्ट बना देता।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם का सीधा अर्थ वयस्क नर भेड़, अर्थात मेढ़े, है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים विशेष रूप से नर बकरों को दर्शाता है; आधुनिक हिन्दी में ‘बकरे’ स्वाभाविक और स्पष्ट है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच मेमने
  rationale: ‘एक-एक वर्ष के’ प्रत्येक मेमने की निर्धारित आयु को सहज हिन्दी में व्यक्त करता है।
- source_word: זֶה קָרְבַּן
  choice: यही … की भेंट थी
  rationale: קָרְבַּן को ‘भेंट’ से व्यक्त किया गया है। मूल इब्रानी उपवाक्य क्रियारहित है; हिन्दी का भूतकाल इस वर्णनात्मक सूची में स्वाभाविक है, जबकि पाद-टिप्पणी शाब्दिक वर्तमान-सदृश रूप बताती है।
- source_word: גַּמְלִיאֵל בֶּן פְּדָה־צוּר
  choice: गमलीएल पुत्र पदाहसूर
  rationale: व्यक्तिनामों को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है और בֶּן के लिए संक्षिप्त, गरिमापूर्ण ‘पुत्र’ रखा गया है।
theological_decisions:
- issue: הַשְּׁלָמִים के बलिदानी अर्थ की प्रस्तुति
  choice: मेल-बलि
  alternative: शांति-बलि; कुशल-मंगल की बलि
  rationale: यह पारंपरिक और बोधगम्य हिन्दी पद है, पर पाद-टिप्पणी में अन्य वास्तविक अर्थ-छायाएँ देकर मूल शब्द के धार्मिक आशय को केवल व्यक्तिगत शांति या केवल संगति तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सूची की संक्षिप्त लय और विधिक-उपासना संबंधी गरिमा बनाए रखते हुए रखी गई है। ‘गौपशु’ सामान्य बोलचाल से थोड़ा औपचारिक है, पर मूल के व्यापक पशुवर्ग को सही ढंग से बचाता है।
