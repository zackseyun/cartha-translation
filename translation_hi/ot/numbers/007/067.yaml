base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/067.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका भार पवित्रस्थान के शेकेल[c] के अनुसार सत्तर शेकेल था। दोनों अन्नबलि के लिए तेल से मिले हुए मैदे से भरे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परात’; इब्रानी शब्द एक उथले पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द बलिदान-संबंधी सेवा में प्रयुक्त कटोरे या पात्र को दर्शाता है।
    reason: lexical_clarification
  - marker: c
    text: अर्थात पवित्रस्थान में मान्य भार-माप के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट थी
  rationale: याजकीय संदर्भ में קָרְבָּן परमेश्वर के सामने लाई गई भेंट को दर्शाता है; ‘भेंट’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קְעָרָה एक उथले थाली-जैसे पात्र को दर्शाता है; ‘थाली’ सामान्य हिन्दी में सहज है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार एक सौ तीस शेकेल था
  rationale: यह मूल पाठ के स्पष्ट भार-सूचक कथन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק बलिदान-संबंधी सेवा में प्रयुक्त पात्र है। ‘कटोरा’ हिन्दी में उसके आकार को स्पष्ट करता है; उसका अनुष्ठानिक संदर्भ पद से स्पष्ट है।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका भार ... सत्तर शेकेल था
  rationale: मूल में भार का संक्षिप्त उल्लेख है; हिन्दी में स्पष्टता के लिए ‘जिसका भार’ दोहराया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह भार-मापन के पवित्रस्थान-मानक को औपचारिक किंतु बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... से भरे थे
  rationale: दोनों पात्रों पर दिए गए मूल जोर को सुरक्षित रखता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת भेंटों में प्रयुक्त महीन आटे को दर्शाता है; ‘मैदा’ आधुनिक हिन्दी में उसका सर्वाधिक सहज समतुल्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल से मिले हुए
  rationale: निष्क्रिय कृदंत आटे के तेल में मिलाए जाने को बताता है; हिन्दी वाक्य में लिंग-वचन ‘मैदे’ के अनुरूप रखा गया है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय संदर्भ में מִנְחָה विशेष रूप से अन्नबलि है, केवल सामान्य भेंट नहीं।
