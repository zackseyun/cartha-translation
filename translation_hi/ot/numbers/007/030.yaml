base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/030.yaml
  text: On the fourth day[b][a], the leader of the sons of Reuben was Elizur son of Shedeur.
translation:
  language: hi
  text: चौथे दिन रूबेन के वंशजों का[b] प्रधान[a] शदेऊर का पुत्र एलीसूर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुखिया”; परंपरागत अनुवाद “राजकुमार”। इब्रानी शब्द गोत्र के आधिकारिक प्रमुख को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “रूबेन के वंशजों के लिए”; इस प्रसंग में इब्रानी संबंध या प्रतिनिधित्व—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הָרְבִיעִי
  choice: चौथे दिन
  rationale: दिन के साथ בְּ यहाँ समय का बोध कराता है; आधुनिक हिन्दी में ‘चौथे दिन’ स्वाभाविक और स्रोत के अनुरूप है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह शब्द गोत्र के आधिकारिक मुखिया को दर्शाता है। ‘प्रधान’ पद और नेतृत्व दोनों व्यक्त करता है तथा ‘राजकुमार’ से उत्पन्न हो सकने वाला राजवंशीय अर्थ नहीं लाता।
- source_word: לִבְנֵי רְאוּבֵן
  choice: रूबेन के वंशजों का
  rationale: לְ यहाँ संबंध या प्रतिनिधित्व दर्शा सकता है। ‘वंशजों’ से स्पष्ट होता है कि आशय रूबेन के गोत्र से है, न केवल उसके प्रत्यक्ष पुत्रों से।
- source_word: אֱלִיצוּר
  choice: एलीसूर
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशपरक पहचान की मानक इब्रानी रचना; हिन्दी में ‘का पुत्र’ स्वाभाविक है।
- source_word: שְׁדֵיאוּר
  choice: शदेऊर
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
