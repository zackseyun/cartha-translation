  yaml_path: translation/ot/numbers/007/062.yaml
  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: hi
  text: सोने की एक कटोरी, जिसका वज़न दस शेकेल[a] था और जो धूप से भरी थी;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “एक कटोरी, दस सोना, धूप से भरी”; भार की इकाई “शेकेल” गिनती 7 में बार-बार आने वाले भेंट-सूत्र से समझी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: कटोरी
  rationale: इस पवित्र-स्थान संबंधी भेंट की सूची में यह शब्द हथेली नहीं, बल्कि धूप रखने का छोटा पात्र दर्शाता है; आधुनिक हिन्दी में ‘कटोरी’ स्वाभाविक और स्पष्ट है।
- source_word: אַחַת
  choice: एक
  rationale: यह पात्र की संख्या बताने वाला सामान्य गणनावाचक शब्द है।
- source_word: עֲשָׂרָה זָהָב
  choice: जिसका वज़न दस शेकेल था
  rationale: मूल पंक्ति में ‘शेकेल’ स्पष्ट रूप से नहीं लिखा है, पर गिनती 7 में बार-बार आने वाला पूरा भेंट-सूत्र इसी भार-इकाई को निहित करता है; ‘वज़न’ जोड़ने से हिन्दी में अर्थ स्पष्ट होता है।
- source_word: זָהָב
  choice: सोने की
  rationale: यह पात्र की सामग्री को दर्शाता है; ‘सोने की कटोरी’ सहज आधुनिक हिन्दी है।
- source_word: מְלֵאָה
  choice: भरी थी
  rationale: यह स्त्रीलिंग पात्र की अवस्था बताता है; हिन्दी में सापेक्ष उपवाक्य के भीतर यह स्वाभाविक है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: उपासना में जलाए जाने वाले सुगंधित पदार्थ के लिए यह मानक और सामान्य हिन्दी शब्द है।
