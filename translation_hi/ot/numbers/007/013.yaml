base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/013.yaml
  text: And his offering was one silver plate[a], its weight one hundred thirty shekels, one silver bowl of seventy shekels, according to the shekel of the sanctuary[b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'और उसका चढ़ावा यह था: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका भार सत्तर शेकेल था—पवित्रस्थान के शेकेल के अनुसार। दोनों अन्नबलि के लिए तेल से मिला हुआ मैदा से भरे हुए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाँदी का एक बड़ा उथला पात्र’; इब्रानी शब्द एक चौड़े, उथले पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कटोरेनुमा पात्र’; इब्रानी शब्द अनुष्ठान में प्रयुक्त पात्र के लिए है।
    reason: lexical_alternative
