  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: hi
  text: सोने का एक पात्र, जिसका वज़न दस शेकेल सोने का था और जो धूप से भरा हुआ था;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּף
  choice: पात्र
  rationale: इस पवित्र-स्थान संबंधी भेंट-सूची में यह शब्द हाथ या खाने के चम्मच के बजाय एक छोटा पात्र दर्शाता है। ‘पात्र’ आधुनिक हिन्दी में स्वाभाविक है और उसके आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אַחַת
  choice: एक
  rationale: यह स्त्रीलिंग संज्ञा כַּף के साथ प्रयुक्त सामान्य संख्या है।
- source_word: עֲשָׂרָה זָהָב
  choice: जिसका भार दस शेकेल था
  rationale: इब्रानी में भार की इकाई लुप्त है, पर आसपास बार-बार आने वाले भेंट-विवरण से ‘शेकेल’ समझा जाता है। हिन्दी में अर्थ स्पष्ट करने के लिए इसे जोड़ा गया है; सोने का होना ‘सोने का पात्र’ में व्यक्त है।
- source_word: מְלֵאָה
  choice: भरा था
  rationale: यह पात्र की अवस्था और उसकी सामग्री बताता है; ‘धूप से भरा था’ सहज और संक्षिप्त हिन्दी है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: पवित्र-स्थान की उपासना में जलाए जाने वाले सुगंधित पदार्थ के लिए यह मानक हिन्दी शब्द है।
