  text: פַּ֣ר אֶחָ֞ד בֶּן בָּקָ֗ר אַ֧יִל אֶחָ֛ד כֶּֽבֶשׂ אֶחָ֥ד בֶּן שְׁנָת֖/וֹ לְ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/051.yaml
  text: one bull from the herd, one ram, one male lamb a year old, for a burnt offering;
translation:
  language: hi
  text: होमबलि के लिए झुंड में से एक बैल, एक मेढ़ा और एक वर्ष का एक नर मेमना;
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פַּר בֶּן־בָּקָר
  choice: झुंड में से एक बैल
  rationale: פַּר बैल को और בֶּן־בָּקָר गोवंश के झुंड से उसके संबंध को व्यक्त करता है। यह अनुवाद हिब्रू के दोनों घटकों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַיִל
  choice: एक मेढ़ा
  rationale: यह वयस्क नर भेड़ के लिए मानक बलिदानी शब्द है; हिन्दी में इसका सीधा और प्रचलित समतुल्य ‘मेढ़ा’ है।
- source_word: כֶּבֶשׂ
  choice: एक नर मेमना
  rationale: यहाँ बलिदान की सूची में כֶּבֶשׂ नर मेमने को सूचित करता है; ‘नर’ लिंग को स्पष्ट करता है।
- source_word: בֶּן־שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: हिब्रू मुहावरा पशु की आयु बताता है। ‘एक वर्ष का’ सहज आधुनिक हिन्दी है और आयु की अपेक्षा को स्पष्ट रखता है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक शब्द है जो वेदी पर पूर्णतः जलाई जाती थी। ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में इस बलिदानी श्रेणी का संक्षिप्त और परिचित नाम है।
- source_word: אֶחָד
  choice: एक
  rationale: प्रत्येक पशु की संख्या बताने वाला यह अंक मूल पाठ में बार-बार आता है; हिन्दी में भी प्रत्येक मद के साथ इसे रखा गया है।
theological_decisions:
- issue: עֹלָה का बलिदानी नाम
  choice: होमबलि
  alternative: सर्वांग अग्निबलि
  rationale: ‘होमबलि’ आधुनिक हिन्दी बाइबलीय पाठकों के लिए परिचित है और पूरी तरह जलाकर चढ़ाई जाने वाली बलि को निर्दिष्ट करता है; अधिक व्याख्यात्मक विकल्प को मुख्य पाठ में लाना आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। हिब्रू सूची की पुनरावृत्त संख्या संरक्षित है, जबकि हिन्दी में स्वाभाविक क्रम के लिए ‘होमबलि के लिए’ आरम्भ में रखा गया है।
