id: NUM.7.10
reference: Numbers 7:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּקְרִ֣יבוּ הַ/נְּשִׂאִ֗ים אֵ֚ת חֲנֻכַּ֣ת הַ/מִּזְבֵּ֔חַ בְּ/י֖וֹם הִמָּשַׁ֣ח אֹת֑/וֹ וַ/יַּקְרִ֧יבוּ הַ/נְּשִׂיאִ֛ם אֶת קָרְבָּנָ֖/ם לִ/פְנֵ֥י הַ/מִּזְבֵּֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/010.yaml
  text: Then the leaders presented the dedication offering for the altar on the day it was anointed[a], and the leaders presented their offering before the altar.
translation:
  language: hi
  text: तब प्रधानों ने वेदी के अभिषेक के दिन उसके समर्पण की भेंट[a] चढ़ाई। प्रधानों ने अपनी भेंट वेदी के सामने प्रस्तुत की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वेदी का समर्पण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ
  choice: चढ़ाई / प्रस्तुत की
  rationale: קרב के हिफ़ील रूप का बल किसी वस्तु को परमेश्वर के सामने लाने या अर्पित करने पर है। पहले खंड में ‘भेंट चढ़ाई’ स्वाभाविक बलिदानी भाषा है, जबकि दूसरे में ‘प्रस्तुत की’ अनावश्यक शब्द-पुनरावृत्ति से बचते हुए मूल अर्थ बनाए रखता है।
- source_word: הַנְּשִׂאִים
  choice: प्रधानों
  rationale: गिनती की पुस्तक में נָשִׂיא गोत्रों के मुखियाओं को दर्शाता है। ‘प्रधान’ आधुनिक हिंदी में पद और नेतृत्व दोनों को स्पष्ट करता है; ‘राजकुमार’ यहाँ अनुचित राजवंशीय अर्थ दे सकता है।
- source_word: חֲנֻכַּת הַמִּזְבֵּחַ
  choice: वेदी के ... समर्पण की भेंट
  rationale: חֲנֻכָּה का मूल अर्थ ‘समर्पण’ है। संदर्भ में प्रधान वस्तुएँ अर्पित कर रहे हैं, इसलिए ‘समर्पण की भेंट’ आशय को स्वाभाविक हिंदी में स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּיוֹם הִמָּשַׁח אֹתוֹ
  choice: वेदी के अभिषेक के दिन
  rationale: בְּיוֹם समय की विशिष्टता बताता है और הִמָּשַׁח निष्क्रिय अर्थ में ‘उसका अभिषेक किए जाने’ को व्यक्त करता है। हिंदी में संबंध स्पष्ट करने के लिए ‘वेदी के अभिषेक के दिन’ स्वाभाविक है।
- source_word: קָרְבָּנָם
  choice: अपनी भेंट
  rationale: קָרְבָּן उपासना के प्रसंग में परमेश्वर के सामने लाई गई भेंट है। ‘भेंट’ व्यापक और स्वाभाविक हिंदी शब्द है तथा यहाँ वस्तु के रूप में उपयुक्त है।
- source_word: לִפְנֵי הַמִּזְבֵּחַ
  choice: वेदी के सामने
  rationale: לִפְנֵי का यहाँ स्थानसूचक अर्थ है। ‘वेदी के सामने’ वर्तमान हिंदी में स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: क्या חֲנֻכַּת הַמִּזְבֵּחַ को स्वयं समर्पण की क्रिया समझा जाए या समर्पण से जुड़ी भेंट?
  choice: मुख्य पाठ में ‘समर्पण की भेंट’
  alternative: ‘वेदी का समर्पण’
  rationale: व्याकरणिक रूप से अधिक शाब्दिक अर्थ ‘वेदी का समर्पण’ है, पर क्रिया ‘चढ़ाई’ के साथ संदर्भ उन भेंटों की ओर संकेत करता है जिन्हें प्रधान लाए। मुख्य पाठ अर्थ को स्पष्ट करता है और पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रधान’, ‘वेदी’, ‘अभिषेक’ और ‘समर्पण’ जैसे प्रचलित बाइबलीय शब्द संदर्भ की धार्मिक गंभीरता बनाए रखते हैं।
