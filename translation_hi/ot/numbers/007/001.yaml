source:
  edition: WLC
  text: וַ/יְהִ֡י בְּ/יוֹם֩ כַּלּ֨וֹת מֹשֶׁ֜ה לְ/הָקִ֣ים אֶת הַ/מִּשְׁכָּ֗ן וַ/יִּמְשַׁ֨ח אֹת֜/וֹ וַ/יְקַדֵּ֤שׁ אֹת/וֹ֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/אֶת הַ/מִּזְבֵּ֖חַ וְ/אֶת כָּל כֵּלָ֑י/ו וַ/יִּמְשָׁחֵ֖/ם וַ/יְקַדֵּ֥שׁ אֹתָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/001.yaml
  text: And it happened on the day Moses finished setting up the tabernacle[a], that he anointed it and consecrated it, along with all its furnishings, and the altar with all its utensils; he anointed them and consecrated them.
translation:
  language: hi
  text: और जिस दिन मूसा ने निवास-तम्बू को खड़ा करने का काम पूरा किया[a], उस दिन उसने निवास-तम्बू का अभिषेक किया और उसे पवित्र ठहराया, साथ ही उसकी सारी साज-सामग्री को; और वेदी तथा उसके सारे पात्रों को भी। उसने उनका अभिषेक किया और उन्हें पवित्र ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब मूसा निवास-तम्बू को खड़ा करने का काम पूरा कर चुका था।” इब्रानी समयवाचक अभिव्यक्ति का यह अधिक मुहावरेदार अनुवाद भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ... हुआ
  rationale: यह कथात्मक सूत्र नए प्रसंग का आरम्भ करता है। हिंदी में समयवाचक उपवाक्य के साथ इसे स्वाभाविक वाक्य-रचना में समाहित किया गया है।
- source_word: בְּיוֹם כַּלּוֹת
  choice: जिस दिन ... पूरा किया, उस दिन
  rationale: इब्रानी समयवाचक अभिव्यक्ति की ‘दिन’ वाली संरचना को स्पष्ट और स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: לְהָקִים
  choice: खड़ा करने
  rationale: हिफ़ील रूप यहाँ निवास-तम्बू को स्थापित या खड़ा करने की भौतिक क्रिया बताता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-तम्बू
  rationale: मिश्कान के मूल ‘निवास’ भाव और जंगल के चलायमान पवित्र तम्बू, दोनों को व्यक्त करता है; केवल पारंपरिक लिप्यंतरण से अधिक बोधगम्य है।
- source_word: וַיִּמְשַׁח
  choice: अभिषेक किया
  rationale: तेल द्वारा धार्मिक समर्पण की मानक क्रिया के लिए यह प्रतिष्ठित और सुबोध हिंदी पद है।
- source_word: וַיְקַדֵּשׁ
  choice: पवित्र ठहराया
  rationale: यहाँ वस्तुओं को पवित्र उपयोग के लिए अलग किए जाने का धार्मिक अर्थ है; यह नैतिक परिवर्तन का संकेत दिए बिना קדשׁ का भाव व्यक्त करता है।
- source_word: כָּל כֵּלָיו (निवास-तम्बू)
  choice: उसकी सारी साज-सामग्री
  rationale: निवास-तम्बू के विविध उपकरणों और वस्तुओं के लिए व्यापक तथा स्वाभाविक हिंदी अभिव्यक्ति है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलि और उपासना से संबद्ध מזבח का मानक हिंदी अनुवाद।
- source_word: כָּל כֵּלָיו (वेदी)
  choice: उसके सारे पात्रों
  rationale: वेदी के संदर्भ में כֵּלִים उसके धार्मिक कार्य में प्रयुक्त पात्रों और उपकरणों को दर्शाता है; प्रसंगानुसार यह ‘साज-सामग्री’ से अधिक सटीक है।
- source_word: וַיִּמְשָׁחֵם ... וַיְקַדֵּשׁ אֹתָם
  choice: उसने उनका अभिषेक किया और उन्हें पवित्र ठहराया
  rationale: इब्रानी के पुनरुक्त, सार-संक्षेपकारी बहुवचन को बिना हटाए रखा गया है, जिससे उसके संभावित व्यापक संदर्भ की अस्पष्टता भी बनी रहती है।
theological_decisions:
- issue: धार्मिक पवित्रता की शब्दावली
  choice: पवित्र ठहराया
  alternative: पवित्र किया; समर्पित किया
  rationale: प्रसंग में नैतिक रूपान्तरण नहीं, बल्कि पवित्र सेवा के लिए अलग करना अभिप्रेत है। ‘पवित्र ठहराया’ यह धार्मिक अर्थ बनाए रखता है और किसी संप्रदाय-विशेष की शब्दावली नहीं थोपता।
- issue: अंतिम बहुवचन सर्वनाम का विस्तार
  choice: ‘उनका/उन्हें’ को बिना स्पष्ट विस्तार के रखा
  alternative: केवल वेदी और उसके पात्र; सभी पहले उल्लिखित पवित्र सामान
  rationale: इब्रानी बहुवचन का निकटतम पूर्वपद वेदी और उसके पात्र हैं, पर इसकी सार-संक्षेपकारी भूमिका व्यापक भी समझी जा सकती है। अनुवाद मूल की यह संभावित अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘निवास-तम्बू’, ‘अभिषेक’, ‘वेदी’ और ‘पवित्र ठहराया’ जैसे पद धार्मिक संदर्भ की सटीकता रखते हैं। मूल इब्रानी की अंतिम पुनरुक्ति जानबूझकर सुरक्षित रखी गई है।
