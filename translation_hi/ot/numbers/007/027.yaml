- source_word: כֶּבֶשׂ אֶחָד
  choice: एक नर मेमना
  rationale: כֶּבֶשׂ नर मेमने को सूचित करता है; बलि की पशु-संबंधी विशिष्टता बनाए रखने के लिए ‘नर’ स्पष्ट किया गया है।
- source_word: בֶּן שְׁנָתוֹ
  choice: एक वर्ष का
  rationale: शाब्दिक मुहावरा ‘अपने वर्ष का पुत्र’ पशु के एक वर्ष का अथवा पहले वर्ष में होने का संकेत देता है; मुख्य पाठ में ‘एक वर्ष का’ सहज और स्पष्ट है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक पद है जो वेदी पर पूरी तरह जलाई जाती थी; हिन्दी बाइबिलीय प्रयोग में ‘होमबलि’ संक्षिप्त और प्रतिष्ठित शब्द है।
