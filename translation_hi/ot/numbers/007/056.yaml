  choice: दस शेकेल
  rationale: मूल पाठ में केवल ‘दस’ है और भार की इकाई निहित है; अध्याय के दोहराए गए अर्पण-विवरण के आधार पर स्पष्टता हेतु ‘शेकेल’ जोड़ा गया है।
- source_word: זָהָב
  choice: सोने की
  rationale: पात्र की सामग्री को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְלֵאָה
  choice: भरी थी
  rationale: पात्र की अवस्था को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: उपासना में प्रयुक्त सुगंधित अर्पण-पदार्थ के लिए मानक हिन्दी शब्द।
