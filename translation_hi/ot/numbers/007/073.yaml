  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/073.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा, जिसका भार पवित्रस्थान के शेकेल[b] के अनुसार सत्तर शेकेल था; दोनों में अन्नबलि के लिए तेल में मिला हुआ मैदा भरा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परात”; इब्रानी शब्द एक उथले चाँदी के पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पवित्रस्थान में मान्य भार-माप के अनुसार।
    reason: clarification
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट थी
  rationale: यह शब्द उपासना के संदर्भ में परमेश्वर के सामने लाई गई भेंट को दर्शाता है; हिंदी में ‘भेंट’ स्वाभाविक और स्पष्ट है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קַעֲרָה एक अपेक्षाकृत उथला पात्र है; ‘थाली’ इस आकार और सूची-वर्णन दोनों के अनुकूल है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार एक सौ तीस शेकेल था
  rationale: हिब्रू में पात्र के बाद उसका भार दिया गया है; यह हिंदी रूप अर्थ को स्पष्ट रखते हुए सूची की शैली बनाए रखता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק उपासना में प्रयुक्त पात्र है। ‘कटोरा’ आधुनिक हिंदी में सहज है और थाली से इसका भेद स्पष्ट करता है।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका भार ... सत्तर शेकेल था
  rationale: यह पद दूसरे पात्र का भार बताता है; पूर्ण उपवाक्य हिंदी में संबंध को स्पष्ट करता है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह किसी अलग वस्तु के बजाय पवित्रस्थान में मान्य भार-मानक को सूचित करता है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: वे दोनों ... भरकर लाए गए थे
  rationale: द्विवचन-संबंधी सर्वनाम दोनों पात्रों को स्पष्ट रूप से संदर्भित करता है; हिंदी में यह संरचना उनकी सामग्री को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: बलि-संबंधी संदर्भ में यह बारीक, उत्तम आटे को दर्शाता है; ‘मैदा’ सामान्य आधुनिक हिंदी में संक्षिप्त और बोधगम्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत बताता है कि मैदा तेल के साथ मिलाया गया था; यह आधुनिक हिंदी का सहज रूप है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय संदर्भ में מִנְחָה विशेष रूप से अन्न से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ इस विशिष्टता को बनाए रखता है।
