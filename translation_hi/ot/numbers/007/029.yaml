  choice: एक-एक वर्ष के पाँच नर मेमने
  rationale: כְּבָשִׂים बलिदानी सूची में नर मेमनों को और בְּנֵי שָׁנָה उनकी एक वर्ष की आयु को व्यक्त करता है।
