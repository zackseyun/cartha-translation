base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/043.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका भार सत्तर शेकेल था; इन दोनों का भार पवित्रस्थान के शेकेल[c] के अनुसार था, और दोनों अन्नबलि के लिए तेल में मिला हुआ मैदा से भरे हुए थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘परात’; इब्रानी शब्द קַעֲרָה एक चौड़े पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘कटोरे जैसा पात्र’; इब्रानी מִזְרָק उपासना में प्रयुक्त एक पात्र था।
    reason: lexical_alternative
  - marker: c
    text: अर्थात पवित्रस्थान में मान्य भार के मानक के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट थी
  rationale: यह शब्द उपासना के प्रसंग में परमेश्वर के सामने लाई गई भेंट को दर्शाता है; क्रियारहित इब्रानी वाक्य को स्वाभाविक हिन्दी बनाने के लिए ‘थी’ जोड़ा गया है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: קַעֲרָה चौड़े पात्र या थाली को दर्शाता है; ‘थाली’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार ... एक सौ तीस शेकेल था
  rationale: अनुवाद मूल में स्पष्ट ‘उसका भार’ को बनाए रखता है और संख्या को स्वाभाविक हिन्दी क्रम में देता है।
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: מִזְרָק उपासना में प्रयुक्त पात्र है; ‘कटोरा’ उसके आकार को बिना उसके विशिष्ट अनुष्ठानिक उपयोग को अनावश्यक रूप से निश्चित किए सहज रूप से व्यक्त करता है।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका भार सत्तर शेकेल था
  rationale: प्रसंगानुसार यह दूसरे पात्र का भार बताता है; स्पष्टता के लिए निहित भार-वाचक संबंध व्यक्त किया गया है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह पवित्रस्थान में मान्य मानक भार को सूचित करने वाला सूत्र है; ‘के अनुसार’ हिन्दी में अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: दोनों ... भरकर लाए गए थे
  rationale: द्विवचन दोनों पात्रों की ओर संकेत करता है। हिन्दी में वाक्य को सहज बनाने के लिए उनकी भरी हुई अवस्था को ‘भरकर लाए गए थे’ से व्यक्त किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलियों में प्रयुक्त बारीक आटे का प्रचलित शब्द है; आधुनिक हिन्दी में ‘मैदा’ संक्षिप्त और सुबोध है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदन्त आटे के तेल के साथ मिलाए जाने को व्यक्त करता है; यह हिन्दी में सीधा और स्वाभाविक अनुवाद है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय प्रसंग में מִנְחָה विशिष्ट रूप से अन्न से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ उसकी धार्मिक विशिष्टता बनाए रखता है।
