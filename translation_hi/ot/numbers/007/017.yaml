  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נַחְשׁ֖וֹן בֶּן עַמִּינָדָֽב־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/017.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Nahshon son of Amminadab.'
translation:
  language: hi
  text: और मेल-बलि के लिए दो गाय-बैल[a], पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच मेम्ने। यह अम्मीनादाब के पुत्र नहशोन की भेंट थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सहभागिता-बलि” अथवा “कुशल-बलि”; इब्रानी शब्द प्रायः ऐसी बलि के लिए आता है जिसका भोज मेल और सहभागिता में मिलकर खाया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: संयोजक और संबंधसूचक उपसर्ग सूची की अगली भेंट का परिचय देते हैं। 'मेलबलि' शְׁלָמִים का प्रचलित, संक्षिप्त बलिदानी पद है और मेल व सहभागिता के भाव को बनाए रखता है।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गाय-बैल
  rationale: בָּקָר मवेशियों के लिए सामूहिक शब्द है और यहाँ लिंग निर्दिष्ट नहीं करता; 'गाय-बैल' बिना अनावश्यक लिंग-निर्धारण के सहज हिन्दी है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם स्पष्ट रूप से नर भेड़ों अर्थात मेढ़ों को दर्शाता है।
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתּוּדִים नर बकरों को दर्शाता है; 'बकरे' आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच मेम्ने
  rationale: בְּנֵי שָׁנָה आयु को एक वर्ष का बताता है। כְּבָשִׂים के लिए 'मेम्ने' उपयुक्त है; संदर्भ से परे लिंग को अधिक स्पष्ट नहीं किया गया।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: इब्रानी का क्रियारहित सारांश-वाक्य हिन्दी कथा-प्रवाह में भूतकाल के साथ स्वाभाविक है; קָרְבָּן के लिए 'चढ़ावा' धार्मिक भेंट का अर्थ स्पष्ट करता है।
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: अम्मीनादाब के पुत्र नहशोन
  rationale: वंश-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया और नामों का ध्वन्यात्मक लिप्यंतरण किया गया।
theological_decisions:
- issue: הַשְּׁלָמִים का बलिदानी अर्थ
  choice: मेलबलि
  alternative: सहभागिता-बलि; कुशल-बलि
  rationale: यह पद केवल आंतरिक शांति नहीं, बल्कि मेल, कुशलता और साझा बलिदानी भोज से जुड़ा तकनीकी शब्द है। 'मेलबलि' संक्षिप्त और परंपरागत रूप से बोधगम्य है, जबकि पादटिप्पणी अन्य वास्तविक अर्थ-छायाएँ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। बलिदानी सूची की संक्षिप्त शैली रखी गई है; तकनीकी पद 'मेलबलि' को पादटिप्पणी से स्पष्ट किया गया है।
