source:
  edition: WLC
  text: כַּפּ֨וֹת זָהָ֤ב שְׁתֵּים עֶשְׂרֵה֙ מְלֵאֹ֣ת קְטֹ֔רֶת עֲשָׂרָ֧ה עֲשָׂרָ֛ה הַ/כַּ֖ף בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ כָּל זְהַ֥ב הַ/כַּפּ֖וֹת עֶשְׂרִ֥ים וּ/מֵאָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/086.yaml
  text: twelve gold dishes full of incense[a], each dish weighing ten shekels by the sanctuary shekel; all the gold of the dishes was one hundred twenty shekels.
translation:
  language: hi
  text: धूप से भरी सोने की बारह कटोरियाँ[a] थीं। पवित्रस्थान के शेकेल के अनुसार हर कटोरी का भार दस शेकेल था। कटोरियों का कुल सोना एक सौ बीस शेकेल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘धूपदान’, ‘पात्र’ अथवा पारंपरिक अनुवाद में ‘चम्मच’।
    reason: इब्रानी शब्द धूप रखने वाले छोटे पात्र के लिए प्रयुक्त है; उसका सटीक आकार निश्चित नहीं है।
lexical_decisions:
- source_word: כַּפּוֹת
  choice: कटोरियाँ
  rationale: इस संदर्भ में शब्द धूप रखने वाले छोटे पात्रों को दर्शाता है। ‘कटोरियाँ’ आधुनिक हिन्दी में स्वाभाविक है और पात्र के आकार को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מְלֵאֹת קְטֹרֶת
  choice: धूप से भरी
  rationale: विशेषण और संज्ञा का सीधा तथा स्वाभाविक हिन्दी रूप, जो बताता है कि पात्रों में धूप भरी हुई थी।
- source_word: עֲשָׂרָה עֲשָׂרָה הַכַּף
  choice: हर कटोरी का भार दस शेकेल
  rationale: संख्या की पुनरावृत्ति वितरण का भाव देती है; हिन्दी में ‘हर ... दस’ इसे स्पष्ट और सहज रूप में व्यक्त करता है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह उपासना-स्थान में मान्य आधिकारिक भार-मानक को व्यक्त करने वाला तकनीकी सूत्र है।
- source_word: כָּל זְהַב הַכַּפּוֹת
  choice: कटोरियों का कुल सोना
  rationale: इब्रानी रचना इन सभी पात्रों में लगे सोने के सम्मिलित भार का सार देती है।
- source_word: עֶשְׂרִים וּמֵאָה
  choice: एक सौ बीस शेकेल
  rationale: अर्थ 120 है; ‘शेकेल’ निकटवर्ती भार-सूचना से स्वाभाविक रूप से ग्रहण किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। ‘कटोरी’ सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी मूल शब्द की आकार-संबंधी अस्पष्टता बनाए रखती है।
