lexical_decisions:
- source_word: כַּף
  choice: पात्र
  rationale: यहाँ शब्द हथेली नहीं, बल्कि पवित्र सेवा में प्रयुक्त एक छोटे पात्र को दर्शाता है। ‘पात्र’ उसके सटीक आकार को अनावश्यक रूप से निश्चित किए बिना व्यापक अर्थ बनाए रखता है।
- source_word: אַחַת
  choice: एक
  rationale: स्त्रीलिंग संज्ञा כַּף के साथ प्रयुक्त साधारण संख्या।
- source_word: עֲשָׂרָה
  choice: जिसका वज़न दस शेकेल था
  rationale: मूल में केवल ‘दस’ है, पर अध्याय के दोहराए गए सूची-सूत्र में वज़न की इकाई ‘शेकेल’ संदर्भ से समझी जाती है; हिंदी में अर्थ स्पष्ट करने के लिए इसे व्यक्त किया गया है।
- source_word: זָהָב
  choice: सोने का
  rationale: पात्र की सामग्री का सीधा और स्वाभाविक वर्णन।
- source_word: מְלֵאָה
  choice: भरा था
  rationale: पात्र की अवस्था और उसकी सामग्री को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: आराधना में जलाए जाने वाले सुगंधित पदार्थ के लिए मानक हिंदी बाइबलीय शब्द।
