  text: one gold dish of ten shekels[a], full of incense;
translation:
  language: hi
  text: सोने की एक कटोरी, जिसका वज़न दस शेकेल[a] था और जो धूप से भरी थी;
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “एक कटोरी, दस, सोना, धूप से भरी हुई”; आसपास बार-बार आने वाले भेंट-विवरण के आधार पर “शेकेल” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּף
  choice: कटोरी
  rationale: इस भेंट-सूची में यह शब्द हथेली नहीं, धूप रखने का एक छोटा पात्र दर्शाता है; आधुनिक हिन्दी में ‘कटोरी’ स्वाभाविक और ठोस है।
- source_word: אַחַת
  choice: एक
  rationale: स्त्रीलिंग संज्ञा כַּף के साथ प्रयुक्त सामान्य संख्या।
- source_word: עֲשָׂרָה
  choice: दस शेकेल
  rationale: इब्रानी में केवल ‘दस’ है, पर आसपास बार-बार आने वाले भेंट-विवरण से वज़न की इकाई ‘शेकेल’ समझी जाती है; अर्थ स्पष्ट करने के लिए इसे मुख्य पाठ में जोड़ा गया है और पादटिप्पणी में बताया गया है।
- source_word: זָהָב
  choice: सोने की
  rationale: यह पात्र की सामग्री बताता है; हिन्दी में ‘सोने की कटोरी’ सहज और सटीक है।
- source_word: מְלֵאָה
  choice: भरी थी
  rationale: पात्र की अवस्था और उसकी सामग्री को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: याजकीय और पवित्र-स्थान के संदर्भ में सुगंधित अर्पण-पदार्थ के लिए प्रचलित हिन्दी शब्द।
