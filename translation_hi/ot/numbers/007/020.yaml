  rationale: यहाँ शब्द मनुष्य की हथेली नहीं, बल्कि पवित्र-स्थान की भेंट में प्रयुक्त एक छोटा पात्र दर्शाता है। आधुनिक हिन्दी में ‘कटोरी’ स्वाभाविक और स्पष्ट है।
- source_word: אַחַת
  choice: एक
  rationale: यह स्त्रीलिंग संज्ञा כַּף के साथ प्रयुक्त साधारण संख्या है।
- source_word: עֲשָׂרָה זָהָב
  choice: दस शेकेल सोने की
  rationale: मूल में ‘शेकेल’ स्पष्ट रूप से नहीं लिखा है, पर आसपास के पदों में दोहराए गए भेंट-विवरण से भार की यह इकाई निहित है।
- source_word: מְלֵאָה
  choice: भरी थी
  rationale: यह पात्र की अवस्था और उसकी सामग्री बताने वाला विशेषण है; हिन्दी वाक्य में ‘जो ... से भरी थी’ सहज है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: मिलापवाले तम्बू की उपासना में जलाए जाने वाले सुगंधित पदार्थ के लिए ‘धूप’ मानक और सामान्य हिन्दी शब्द है।
