  text: קָרְבָּנ֞/וֹ קַֽעֲרַת כֶּ֣סֶף אַחַ֗ת שְׁלֹשִׁ֣ים וּ/מֵאָה֮ מִשְׁקָלָ/הּ֒ מִזְרָ֤ק אֶחָד֙ כֶּ֔סֶף שִׁבְעִ֥ים שֶׁ֖קֶל בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ שְׁנֵי/הֶ֣ם מְלֵאִ֗ים סֹ֛לֶת בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן לְ/מִנְחָֽה־׀
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/055.yaml
  text: His offering was one silver plate[a], its weight one hundred thirty shekels, one silver basin of seventy shekels, according to the shekel of the sanctuary[c][b]; both of them were full of fine flour mixed with oil for a grain offering.
translation:
  language: hi
  text: 'उसकी भेंट यह थी: चाँदी की एक थाली[a], जिसका भार एक सौ तीस शेकेल था, और चाँदी का एक कटोरा[b], जिसका भार पवित्रस्थान के शेकेल[c] के मानक के अनुसार सत्तर शेकेल था; वे दोनों अन्नबलि के लिए तेल से मिले हुए बारीक आटे से भरे थे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परात”; इब्रानी शब्द एक छिछले चाँदी के पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यह पवित्रस्थान की सेवा में प्रयुक्त एक अनुष्ठानिक पात्र था; इसका अनुवाद “पात्र” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात पवित्रस्थान में मान्य भार के मानक के अनुसार।
    reason: cultural_note
lexical_decisions:
- source_word: קָרְבָּנוֹ
  choice: उसकी भेंट थी
  rationale: क़ोरबान उपासना के संदर्भ में परमेश्वर के निकट लाई गई भेंट को दर्शाता है; हिन्दी में ‘भेंट’ स्वाभाविक और व्यापक रूप से समझ में आने वाला शब्द है। इब्रानी के क्रियारहित वाक्य में सहजता के लिए ‘थी’ जोड़ा गया है।
- source_word: קַעֲרַת כֶּסֶף אַחַת
  choice: चाँदी की एक थाली
  rationale: क़ेआरा एक अपेक्षाकृत छिछला पात्र था; ‘थाली’ आधुनिक हिन्दी में उसके आकार को स्पष्ट करती है।
- source_word: שְׁלֹשִׁים וּמֵאָה מִשְׁקָלָהּ
  choice: जिसका भार एक सौ तीस शेकेल था
  rationale: 'मूल का अर्थ ‘उसका भार: तीस और सौ’ है। हिन्दी संख्या-क्रम में ‘एक सौ तीस’ और संबंधवाचक उपवाक्य सहज हैं।'
- source_word: מִזְרָק אֶחָד כֶּסֶף
  choice: चाँदी का एक कटोरा
  rationale: मिज़राक पवित्रस्थान की सेवा में प्रयुक्त पात्र था। ‘कटोरा’ उसके पात्ररूप को सामान्य पाठक के लिए स्पष्ट करता है; अनुष्ठानिक उपयोग पादटिप्पणी में बताया गया है।
- source_word: שִׁבְעִים שֶׁקֶל
  choice: जिसका भार ... सत्तर शेकेल था
  rationale: यह दूसरे पात्र का भार बताता है; स्पष्टता के लिए भारसूचक भाषा दोहराई गई है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: वाक्यांश पवित्रस्थान में मान्य मानक भार को दर्शाता है। ‘के अनुसार’ हिन्दी में माप के मानक का स्वाभाविक संकेत है।
- source_word: שְׁנֵיהֶם מְלֵאִים
  choice: वे दोनों ... से भरे थे
  rationale: द्विवचन-संदर्भ और दोनों पात्रों पर दिए गए बल को स्पष्ट रूप से सुरक्षित रखा गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: सॉलेत अर्पणों में प्रयुक्त बारीक आटे को दर्शाता है; आधुनिक हिन्दी में ‘मैदा’ संक्षिप्त और सहज समतुल्य है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल से सना हुआ
  rationale: निष्क्रिय कृदन्त आटे और तेल के अच्छी तरह मिलाए जाने को व्यक्त करता है। ‘तेल से सना’ बलि-संबंधी मिश्रण के लिए स्वाभाविक हिन्दी है।
- source_word: לְמִנְחָה
  choice: अन्नबलि के लिए
  rationale: याजकीय संदर्भ में मिन्हा विशिष्ट रूप से अनाज से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ इस अनुष्ठानिक अर्थ को बनाए रखता है।
