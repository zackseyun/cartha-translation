  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/035.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old. This was the offering of Elizur son of Shedeur.'
translation:
  language: hi
  text: 'और मेलबलि के लिए: दो गाय-बैल[a], पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच नर मेमने। यह शदेऊर के पुत्र एलीसूर का चढ़ावा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संगति-बलि” अथवा “कुशल-मंगल की बलि।”
    reason: הַשְּׁלָמִים के अर्थ-क्षेत्र में मेल/शांति, संगति और कुशल-मंगल के भाव सम्मिलित हो सकते हैं।
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: यह पदबंध चढ़ावों की सूची में अगली बलि को जोड़ता है। 'मेलबलि' शְׁלָמִים का प्रचलित, संक्षिप्त बलिदानी पद है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गाय-बैल
  rationale: בָּקָר गोवंश के लिए सामूहिक शब्द है और केवल बैलों तक सीमित नहीं; 'गाय-बैल' उसकी व्यापकता बनाए रखता है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם वयस्क नर भेड़ों को स्पष्ट रूप से दर्शाता है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים नर बकरों को दर्शाता है; हिंदी में 'बकरे' स्वाभाविक रूप से नर अर्थ देता है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच नर मेमने
  rationale: כְּבָשִׂים पुल्लिंग मेमनों को और בְּנֵי שָׁנָה उनकी एक वर्ष की आयु को व्यक्त करता है; दोनों सूचनाएँ सुरक्षित रखी गई हैं।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: कथात्मक सूची के हिंदी प्रवाह में भूतकाल स्वाभाविक है; קָרְבַּן के सामान्य बलिदानी अर्थ के लिए 'चढ़ावा' स्पष्ट है।
- source_word: אֱלִיצוּר בֶּן שְׁדֵיאוּר
  choice: शदीऊर के पुत्र एलीसूर
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और בֶּן का सामान्य संबंध 'के पुत्र' से व्यक्त हुआ है।
theological_decisions:
- issue: הַשְּׁלָמִים का बलिदानी अर्थ
  choice: मेलबलि
  alternative: संगति-बलि; कुशल-मंगल की बलि
  rationale: इब्रानी पद में शांति, संपूर्णता और सहभागी संगति से जुड़े अर्थ संभव हैं। मुख्य पाठ में पारंपरिक और समझने योग्य पद रखा गया है, जबकि वास्तविक अर्थ-विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज बलिदानी सूची। 'गाय-बैल' सामूहिक गोवंशार्थक शब्द की व्यापकता रखता है; संख्या और पशुओं की आयु/लिंग संबंधी विवरण मूल के अनुसार व्यक्त किए गए हैं।
