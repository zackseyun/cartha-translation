  text: On the third day[a], the leader of the sons of Zebulun was Eliab son of Helon.
translation:
  language: hi
  text: तीसरे दिन जबूलून के वंशजों का प्रधान[a] हेलोन का पुत्र एलीआब था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जबूलून के वंशजों के लिए प्रधान।” इब्रानी पूर्वसर्ग संबद्धता या प्रतिनिधित्व सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: इब्रानी कथात्मक सूत्र में בְּ + יוֹם समय सूचित करता है; आधुनिक हिन्दी में ‘तीसरे दिन’ स्वाभाविक और सटीक है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह शब्द गोत्र के मान्य, आधिकारिक मुखिया को सूचित करता है। ‘प्रधान’ उसके पद और नेतृत्व को व्यक्त करता है, पर ‘राजकुमार’ जैसा अनावश्यक राजकीय अर्थ नहीं जोड़ता।
- source_word: לִבְנֵי זְבוּלֻן
  choice: जबूलून के वंशजों का
  rationale: בְּנֵי का वंशगत अर्थ ‘वंशज’ से स्पष्ट होता है। לְ यहाँ संबद्धता या प्रतिनिधित्व सूचित कर सकता है; मुख्य पाठ में स्वाभाविक हिन्दी संबंधवाचक रचना रखी गई है और दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֱלִיאָב
  choice: एलीआब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן חֵלֹן
  choice: हेलोन का पुत्र
  rationale: इब्रानी वंशसूचक रचना का स्पष्ट और स्वाभाविक हिन्दी रूप।
