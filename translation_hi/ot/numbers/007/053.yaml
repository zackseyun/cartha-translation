  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵֽי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֱלִישָׁמָ֖ע בֶּן עַמִּיהֽוּד־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/053.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five lambs a year old[b]. This was the offering of Elishama son of Ammihud.'
translation:
  language: hi
  text: और मेलबलि[a] के लिए दो गाय-बैल[b], पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच नर मेम्ने। यह अम्मीहूद के पुत्र एलीशामा की भेंट थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद ‘शांतिबलि’, ‘सहभागिता-बलि’ या ‘कुशल-बलि’ भी किया जा सकता है। यह ऐसी बलि थी जो शांति, समग्र कुशलता और साझा बलि-भोज से जुड़ी थी।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में गोवंश के लिए सामूहिक शब्द है; कुछ अनुवाद इसे अधिक विशिष्ट रूप से ‘दो बैल’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: और मेलबलि के बलिदान के लिए
  rationale: संयोजक וּ पिछले पद की सूची को आगे बढ़ाता है; זֶבַח बलिदान को और שְׁלָמִים शांति, सहभागिता तथा कुशल-समृद्धि से जुड़े विशिष्ट बलिदान को सूचित करता है। ‘मेलबलि’ संक्षिप्त, परिचित और याजकीय संदर्भ के अनुकूल है।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गाय-बैल
  rationale: בָּקָר गोवंश के लिए सामूहिक शब्द है और स्वयं केवल बैलों को निर्दिष्ट नहीं करता; ‘गाय-बैल’ इस व्यापकता को बनाए रखता है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם वयस्क नर भेड़ों अर्थात मेढ़ों को स्पष्ट रूप से दर्शाता है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים नर बकरों को सूचित करता है; ‘बकरे’ हिंदी में लिंग को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक वर्ष के पाँच नर मेम्ने
  rationale: כְּבָשִׂים यहाँ नर मेम्नों का पद है और בְּנֵי שָׁנָה उनकी आयु एक वर्ष बताता है; बलिदान-सूची की दोनों विशेषताएँ सुरक्षित रखी गई हैं।
- source_word: זֶה קָרְבַּן
  choice: यह ... की भेंट थी
  rationale: वाक्य में व्यक्त क्रिया नहीं है; वर्णनात्मक सूची के भूतकालीन संदर्भ में ‘थी’ स्वाभाविक है। קָרְבַּן के लिए ‘भेंट’ उपयुक्त धार्मिक अर्थ रखता है।
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: अम्मीहूद के पुत्र एलीशामा
  rationale: इब्रानी नामों का देवनागरी लिप्यंतरण किया गया है और בֶּן का संबंध ‘के पुत्र’ द्वारा स्पष्ट रखा गया है।
theological_decisions:
- issue: שְׁלָמִים का अर्थ-क्षेत्र
  choice: मेलबलि
  alternative: शांतिबलि; सहभागिता-बलि; कुशल-बलि
  rationale: इब्रानी पद शांति या पूर्ण कुशलता के साथ-साथ सहभागी बलि-भोज से भी जुड़ा है। मुख्य पाठ में प्रचलित और सहज ‘मेलबलि’ रखा गया है, जबकि टिप्पणी में इसके व्यापक अर्थ की सूचना दी गई है ताकि किसी एक धार्मिक व्याख्या को निर्णायक न बनाया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सहज रखी गई है। गणना-सूची का क्रम मूल इब्रानी के अनुसार सुरक्षित है। हिंदी में पूर्ण वाक्य और स्वाभाविक कथात्मक प्रवाह के लिए ‘चढ़ाए गए’ जोड़ा गया है; इसका आशय पूर्ववर्ती ‘बलिदान के लिए’ और सूचीबद्ध भेंटों में निहित है।
