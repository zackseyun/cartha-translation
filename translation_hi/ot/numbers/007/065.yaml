  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתֻּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן אֲבִידָ֖ן בֶּן גִּדְעֹנִֽי־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/065.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Abidan son of Gideoni.'
translation:
  language: hi
  text: 'और मेलबलि के लिए: गोवंश के दो पशु,[a] पाँच मेढ़े, पाँच बकरे और एक-एक वर्ष के पाँच नर मेमने। यह गिदोनी के पुत्र अबीदान का चढ़ावा था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संगति-बलि” या “कल्याण-बलि।”
    reason: שְׁלָמִים के अर्थ-क्षेत्र में मेल, सहभागिता और कुशल-कल्याण के भाव आते हैं; कोई एक हिन्दी पद इन सभी पहलुओं को पूरी तरह व्यक्त नहीं करता।
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַשְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: संयोजक और संबंधसूचक उपसर्ग इस सूची को पिछले पद से जोड़ते हैं। זֶבַח שְׁלָמִים के लिए ‘मेलबलि’ संक्षिप्त, प्रतिष्ठित और साधारण पाठकों के लिए बोधगम्य बलिदानी पद है; इसके अर्थ-क्षेत्र की अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गौपशु
  rationale: בָּקָר गोवंश के पशुओं का सामूहिक पद है और यहाँ उनके लिंग को स्पष्ट नहीं करता; ‘गौपशु’ अनावश्यक रूप से बैल या गाय निर्धारित नहीं करता।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם विशेष रूप से नर भेड़ों, अर्थात मेढ़ों, को दर्शाता है।
- source_word: עַתֻּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתֻּדִים नर बकरों को दर्शाता है; आधुनिक हिन्दी में ‘बकरे’ स्वाभाविक और स्पष्ट है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच नर मेमने
  rationale: כְּבָשִׂים यहाँ नर मेमनों को और בְּנֵי שָׁנָה प्रत्येक पशु की एक वर्ष की आयु को दर्शाता है। ‘एक-एक वर्ष के’ संख्या और आयु दोनों को सहज हिन्दी में स्पष्ट करता है।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: यह अध्याय का समापन-सूत्र है। हिब्रू में स्पष्ट काल-चिह्न नहीं है, पर हिन्दी कथात्मक संदर्भ में ‘था’ स्वाभाविक है; קָרְבַּן के लिए ‘चढ़ावा’ धार्मिक अर्पण का अर्थ रखता है।
- source_word: אֲבִידָן בֶּן גִּדְעֹנִי
  choice: गिदोनी के पुत्र अबीदान
  rationale: पितृनाम-संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है और व्यक्तिनामों का ध्वन्यात्मक लिप्यंतरण किया गया है।
