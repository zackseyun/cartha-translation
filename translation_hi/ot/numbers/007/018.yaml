    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשֵּׁנִי
  choice: दूसरे दिन
  rationale: बְּ के साथ יוֹם और क्रमवाचक विशेषण का स्वाभाविक हिन्दी कालवाचक रूप; पद में न कही गई ‘समर्पण के’ जैसी सूचना नहीं जोड़ी गई।
- source_word: הִקְרִיב
  choice: अपनी भेंट चढ़ाई
  rationale: קרב के हिफ़ील रूप का इस उपासना-संबंधी प्रसंग में अर्थ किसी भेंट को निकट लाना अथवा अर्पित करना है। हिन्दी में ‘भेंट चढ़ाई’ स्वाभाविक है; कर्म मूल पद में व्यक्त नहीं है, इसलिए इसे संदर्भ से पूरित मानकर पादटिप्पणी दी गई है।
- source_word: נְתַנְאֵל
  choice: नतनेल
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और सरल लिप्यंतरण।
- source_word: בֶּן צוּעָר
  choice: सूआर के पुत्र
  rationale: इब्रानी वंशसूचक रचना בֶּן का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: נְשִׂיא
  choice: प्रधान
  rationale: गोत्रीय संदर्भ में נָשִׂיא मान्य अगुआ या मुखिया को दर्शाता है; ‘प्रधान’ नेतृत्व को स्पष्ट करता है और राजकीय पद का अनावश्यक संकेत नहीं देता।
- source_word: יִשָּׂשכָר
  choice: इस्साकार
  rationale: हिन्दी बाइबल परंपरा के अनुरूप गोत्र के नाम का लिप्यंतरण।
