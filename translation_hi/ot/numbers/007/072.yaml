  text: On the eleventh day[a], the leader of the sons of Asher was Pagiel son of Ocran.
translation:
  language: hi
  text: ग्यारहवें दिन आशेर के वंशजों का प्रधान[a] ओक्रान का पुत्र पगीएल था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आशेर के पुत्रों का प्रधान”; अर्थात आशेर गोत्र का प्रतिनिधि मुखिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/יוֹם ... י֔וֹם
  choice: ग्यारहवें दिन
  rationale: इब्रानी में ‘दिन’ की पुनरावृत्ति वाली सूत्रबद्ध रचना है; स्वाभाविक आधुनिक हिन्दी में समय-सूचक अर्थ को ‘ग्यारहवें दिन’ से स्पष्ट और संक्षिप्त रूप में व्यक्त किया गया है।
- source_word: עַשְׁתֵּי עָשָׂר
  choice: ग्यारहवें
  rationale: इस अर्पण-क्रम में संख्या क्रमवाचक अर्थ में प्रयुक्त है; इसलिए हिन्दी का स्वाभाविक क्रमवाचक रूप चुना गया है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहाँ शब्द किसी गोत्र के मान्य प्रतिनिधि मुखिया को दर्शाता है। ‘प्रधान’ इस भूमिका को गरिमापूर्ण और स्पष्ट रूप से व्यक्त करता है तथा ‘राजकुमार’ जैसे राजकीय अर्थ से बचता है।
- source_word: לִ/בְנֵי אָשֵׁר
  choice: आशेर के वंशजों का
  rationale: शाब्दिक ‘आशेर के पुत्रों’ का आशय यहाँ आशेर से निकले गोत्र के लोगों से है। ‘वंशजों’ आधुनिक हिन्दी में इस सामूहिक वंशगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּגְעִיאֵל
  choice: पगीएल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी देवनागरी में निकट और प्रचलित लिप्यंतरण।
- source_word: בֶּן עָכְרָן
  choice: ओक्रान का पुत्र
  rationale: इब्रानी संरक्षक-नामसूचक בֶּן को हिन्दी कथा-शैली के स्वाभाविक रूप ‘का पुत्र’ से अनूदित किया गया है; עָכְרָן का लिप्यंतरण ‘ओक्रान’ है।
