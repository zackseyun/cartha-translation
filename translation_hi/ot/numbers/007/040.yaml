- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी संदर्भ में חַטָּאת किसी अमूर्त ‘पाप’ के बजाय पाप के लिए चढ़ाई जाने वाली बलि को दर्शाता है; उपसर्ग לְ को ‘के लिए’ से व्यक्त किया गया है।
