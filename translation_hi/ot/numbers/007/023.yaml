  text: וּ/לְ/זֶ֣בַח הַ/שְּׁלָמִים֮ בָּקָ֣ר שְׁנַיִם֒ אֵילִ֤ם חֲמִשָּׁה֙ עַתּוּדִ֣ים חֲמִשָּׁ֔ה כְּבָשִׂ֥ים בְּנֵי שָׁנָ֖ה חֲמִשָּׁ֑ה זֶ֛ה קָרְבַּ֥ן נְתַנְאֵ֖ל בֶּן צוּעָֽר־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/023.yaml
  text: 'and for the sacrifice of peace offerings: two cattle[a], five rams, five male goats, and five male lambs a year old. This was the offering of Nethanel son of Zuar.'
translation:
  language: hi
  text: और मेल-बलि[a] के लिए दो गोवंशीय पशु, पाँच मेढ़े, पाँच बकरे और एक वर्ष के पाँच नर मेम्ने थे। यह सूआर के पुत्र नतनेल का चढ़ावा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अनुवाद “शांति-बलि,” “सहभागिता-बलि” या “कुशल-मंगल की बलि” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/זֶבַח הַ/שְּׁלָמִים
  choice: और मेलबलि के लिए
  rationale: संयोजक और संबंधसूचक उपसर्ग को सूची की अगली भेंट से जोड़ते हुए व्यक्त किया गया है। זֶבַח שְׁלָמִים के लिए ‘मेलबलि’ हिन्दी बाइबलीय बलिदान-शब्दावली में संक्षिप्त और परिचित है; पादटिप्पणी अन्य सम्भव अर्थों को सुरक्षित रखती है।
- source_word: בָּקָר שְׁנַיִם
  choice: दो गाय-बैल
  rationale: בָּקָר गोवंश के लिए सामूहिक शब्द है और लिंग को निश्चित नहीं करता; ‘गाय-बैल’ हिन्दी में इस व्यापकता को ‘दो बैल’ से बेहतर बनाए रखता है।
- source_word: אֵילִם חֲמִשָּׁה
  choice: पाँच मेढ़े
  rationale: אֵילִם विशेष रूप से वयस्क नर भेड़ों को दर्शाता है; ‘मेढ़े’ इसका स्वाभाविक हिन्दी समकक्ष है।
- source_word: עַתּוּדִים חֲמִשָּׁה
  choice: पाँच बकरे
  rationale: עַתּוּדִים नर बकरों को दर्शाता है; आधुनिक हिन्दी में ‘बकरे’ स्पष्ट और स्वाभाविक है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה חֲמִשָּׁה
  choice: एक-एक वर्ष के पाँच नर मेम्ने
  rationale: כְּבָשִׂים का पुल्लिंग और בְּנֵי שָׁנָה की आयु-सूचना दोनों स्पष्ट रखी गई हैं। ‘एक-एक वर्ष के’ बताता है कि प्रत्येक मेमना एक वर्ष का था।
- source_word: זֶה קָרְבַּן
  choice: यह ... का चढ़ावा था
  rationale: यह समापन पहचान-सूत्र है। कथात्मक प्रसंग के अनुरूप भूतकाल और बलिदानी सन्दर्भ में स्वाभाविक ‘चढ़ावा’ चुना गया है।
- source_word: נְתַנְאֵל בֶּן צוּעָר
  choice: सूआर के पुत्र नतनेल
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और בֶּן को स्वाभाविक हिन्दी वंशसूचक रचना ‘के पुत्र’ से व्यक्त किया गया है।
theological_decisions:
- issue: שְׁלָמִים बलिदान-श्रेणी का अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि; सहभागिता-बलि; कुशल-मंगल की बलि
  rationale: इब्रानी शब्द शान्ति, कल्याण और सहभागिता से जुड़े अर्थ रख सकता है। मुख्य पाठ में प्रचलित हिन्दी धार्मिक पद रखा गया है, जबकि पादटिप्पणी अर्थ-क्षेत्र की वास्तविक व्यापकता को बिना किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक बनाए दर्शाती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदान-सूची की लय बनाए रखते हुए पशुओं के प्रकार, संख्या, लिंग और आयु को स्रोत के अनुसार स्पष्ट किया गया है।
