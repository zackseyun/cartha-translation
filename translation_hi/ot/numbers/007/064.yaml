- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी संदर्भ में חַטָּאת अमूर्त ‘पाप’ नहीं, बल्कि पाप के लिए चढ़ाई जाने वाली बलि को दर्शाता है। उपसर्ग לְ का अर्थ यहाँ ‘के लिए’ स्वाभाविक रूप से व्यक्त होता है।
