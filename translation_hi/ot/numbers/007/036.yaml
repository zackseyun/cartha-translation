  text: בַּ/יּוֹם֙ הַ/חֲמִישִׁ֔י נָשִׂ֖יא לִ/בְנֵ֣י שִׁמְע֑וֹן שְׁלֻֽמִיאֵ֖ל בֶּן צוּרִֽישַׁדָּֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/036.yaml
  text: On the fifth day Shelumiel son of Zurishaddai[a], leader of the sons of Simeon,
translation:
  language: hi
  text: पाँचवें दिन शिमोन के वंशजों का प्रधान, सूरीशद्दै का पुत्र शलूमीएल,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּיּוֹם הַחֲמִישִׁי
  choice: पाँचवें दिन
  rationale: समयवाचक पदबंध में निश्चित ordinal है; यह स्वाभाविक हिन्दी है और प्रसंग से ‘समर्पण के’ जैसे शब्द नहीं जोड़ती।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यहाँ शब्द गोत्र के मान्य मुखिया को दर्शाता है। ‘प्रधान’ संक्षिप्त, गरिमापूर्ण और गैर-राजकीय है।
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: शिमोन के वंशजों का
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर इस गोत्रीय संदर्भ में वह वंशजों को सूचित करता है; सम्बन्धसूचक ל को स्वाभाविक हिन्दी में ‘का’ से व्यक्त किया गया है।
- source_word: שְׁלֻמִיאֵל
  choice: शलूमीएल
  rationale: व्यक्तिनाम का उसके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: इब्रानी पितृनाम-सूचक रचना का स्वाभाविक हिन्दी रूप।
- source_word: צוּרִישַׁדָּי
  choice: सूरीशद्दै
  rationale: व्यक्तिनाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण; צ को ‘स’, וּ को ‘ऊ’ और שַׁדָּי को ‘शद्दै’ से व्यक्त किया गया है।
theological_decisions: []
