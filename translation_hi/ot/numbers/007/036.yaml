  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। इब्रानी की क्रियारहित, अगले पद में जारी रहने वाली सूची-संरचना को बनाए रखने के लिए कोई अतिरिक्त क्रिया नहीं जोड़ी गई और अंत में अल्पविराम रखा गया।
