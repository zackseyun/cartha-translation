lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: यह इब्रानी संयुक्त पद बलि के लिए नर बकरी को सूचित करता है। आधुनिक हिन्दी में “बकरा” स्वाभाविक रूप से पशु का प्रकार और नर लिंग दोनों स्पष्ट करता है।
- source_word: אֶחָד
  choice: एक
  rationale: यह चढ़ाई जाने वाली वस्तु की संख्या बताता है और सूची की गणनात्मक शैली बनाए रखता है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: इस अनुष्ठानिक प्रसंग में חַטָּאת अमूर्त पाप नहीं, बल्कि निर्धारित बलि-श्रेणी को दर्शाता है; उपसर्ग לְ को “के लिए” से व्यक्त किया गया है।
theological_decisions:
- issue: बलिदान-संबंधी पद חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: पाप के लिए
  rationale: गिनती 7 की बलियों की सूची में यह शब्द एक निर्धारित बलि-प्रकार का नाम है। “पापबलि” अनुष्ठानिक अर्थ को स्पष्ट रखता है और इसे केवल अमूर्त पाप के अर्थ में सीमित नहीं करता।
