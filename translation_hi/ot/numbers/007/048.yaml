  yaml_path: translation/ot/numbers/007/048.yaml
  text: On the seventh day[a], the leader of the sons of Ephraim was Elishama son of Ammihud.
translation:
  language: hi
  text: सातवें दिन एप्रैम के पुत्रों का अगुवा[a] अम्मीहूद का पुत्र एलीशामा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एप्रैम के पुत्रों के लिए अगुवा।” इब्रानी संबंधबोधक शब्द संबंध या प्रतिनिधित्व—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: בְּ के साथ יוֹם और क्रमवाचक विशेषण मिलकर समय बताते हैं; यह स्वाभाविक और सटीक हिन्दी अभिव्यक्ति है।
- source_word: נָשִׂיא
  choice: अगुवा
  rationale: गिनती 7 में यह शब्द भेंट चढ़ाने वाले गोत्रीय प्रतिनिधि और प्रधान के लिए है। ‘अगुवा’ आधुनिक पाठक के लिए स्पष्ट है और राजवंशीय अर्थ देने वाले ‘राजकुमार’ से अधिक उपयुक्त है।
- source_word: לִבְנֵי אֶפְרָיִם
  choice: एप्रैम के पुत्रों का
  rationale: לְ यहाँ अगुवाई के संबंध अथवा प्रतिनिधित्व को सूचित कर सकता है। ‘पुत्रों’ मूल की वंशज-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: אֱלִישָׁמָע
  choice: एलीशामा
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी में निकट और प्रचलन-संगत लिप्यंतरण।
- source_word: בֶּן עַמִּיהוּד
  choice: अम्मीहूद का पुत्र
  rationale: यह सामान्य इब्रानी पितृनाम-सूचक रचना है; हिन्दी में यही स्वाभाविक समतुल्य है।
