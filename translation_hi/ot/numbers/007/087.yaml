  text: כָּל הַ/בָּקָ֨ר לָ/עֹלָ֜ה שְׁנֵ֧ים עָשָׂ֣ר פָּרִ֗ים אֵילִ֤ם שְׁנֵים עָשָׂר֙ כְּבָשִׂ֧ים בְּנֵֽי שָׁנָ֛ה שְׁנֵ֥ים עָשָׂ֖ר וּ/מִנְחָתָ֑/ם וּ/שְׂעִירֵ֥י עִזִּ֛ים שְׁנֵ֥ים עָשָׂ֖ר לְ/חַטָּֽאת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/007/087.yaml
  text: 'All the cattle for the burnt offering: twelve bulls[a], twelve rams, twelve one-year-old lambs, and their grain offering; and twelve male goats for a sin offering.'
translation:
  language: hi
  text: 'होमबलि के लिए कुल पशु ये थे: बारह बैल, बारह मेढ़े, एक वर्ष के बारह मेमने और उनके साथ की अन्नबलि; और पापबलि[a] के लिए बारह बकरे।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת पाप के साथ-साथ अशुद्धता से शुद्धि पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַבָּקָר
  choice: कुल पशु
  rationale: כָּל कुल संख्या का सार प्रस्तुत करता है। यद्यपि בָּקָר प्रायः गाय-बैल वर्ग के पशुओं को दर्शाता है, यहाँ इसके बाद बैल, मेढ़े और मेमने सभी गिनाए गए हैं; इसलिए सूची के व्यापक संदर्भ में स्वाभाविक हिन्दी ‘कुल पशु’ चुना गया है।
- source_word: לָעֹלָה
  choice: होमबलि के लिए
  rationale: लामेद उद्देश्य बताता है और עֹלָה के लिए प्रचलित, संक्षिप्त बलिदानी शब्द ‘होमबलि’ रखा गया है।
- source_word: פָּרִים
  choice: बैल
  rationale: बलिदान के संदर्भ में פַּר नर गोवंश को सूचित करता है; ‘बैल’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: אֵילִם
  choice: मेढ़े
  rationale: אֵיל का सामान्य अर्थ वयस्क नर भेड़ है, जिसके लिए ‘मेढ़ा’ सटीक हिन्दी शब्द है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: एक-एक वर्ष के मेमने
  rationale: आयु की शर्त को स्पष्ट रखते हुए हिन्दी में सहज वितरणात्मक अभिव्यक्ति अपनाई गई है।
- source_word: וּמִנְחָתָם
  choice: और उनके साथ का अन्नबलि
  rationale: बलिदानी व्यवस्था में מִנְחָה सामान्यतः पशुबलियों के साथ चढ़ाया जाने वाला अन्नबलि है; प्रत्यय का संबंध पहले गिनाए गए पशुओं से स्पष्ट किया गया है।
- source_word: וּשְׂעִירֵי עִזִּים
  choice: और बकरे
  rationale: यह पदबंध विशेष रूप से नर बकरों को दर्शाता है; हिन्दी ‘बकरे’ में नर होने का अर्थ अंतर्निहित है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: याजकीय बलिदानी संदर्भ में חַטָּאת का परिचित और स्पष्ट नाम ‘पापबलि’ है; शुद्धिकरण का संभावित भाव पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बलिदानी व्यवस्था में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप से संबंधित बलि और अशुद्धता से शुद्ध किए जाने—दोनों पहलुओं को व्यक्त कर सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और वास्तविक अर्थ-विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। गणनात्मक सूची की शैली बनाए रखने के लिए आरंभ में ‘कुल पशु ये थे’ और आगे समानांतर संख्या-वाक्यांश प्रयुक्त हुए हैं। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे अर्थ-विकल्प संबंधित है।
