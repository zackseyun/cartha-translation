source:
  edition: WLC
  text: וְ/אָמְר֗וּ אֶל יוֹשֵׁב֮ הָ/אָ֣רֶץ הַ/זֹּאת֒ שָֽׁמְעוּ֙ כִּֽי אַתָּ֣ה יְהוָ֔ה בְּ/קֶ֖רֶב הָ/עָ֣ם הַ/זֶּ֑ה אֲשֶׁר עַ֨יִן בְּ/עַ֜יִן נִרְאָ֣ה אַתָּ֣ה יְהוָ֗ה וַ/עֲנָֽנְ/ךָ֙ עֹמֵ֣ד עֲלֵ/הֶ֔ם וּ/בְ/עַמֻּ֣ד עָנָ֗ן אַתָּ֨ה הֹלֵ֤ךְ לִ/פְנֵי/הֶם֙ יוֹמָ֔ם וּ/בְ/עַמּ֥וּד אֵ֖שׁ לָֽיְלָה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/014.yaml
  text: And they will tell the inhabitants of this land[a], who have heard that you, Yahweh, are in the midst of this people, that you, Yahweh, are seen face to face, and your cloud stands over them, and you go before them in a pillar of cloud by day and in a pillar of fire by night.
translation:
  language: hi
  text: और वे इस देश के निवासियों को बताएँगे, जिन्होंने सुना है कि आप, याहवे, इस प्रजा के बीच में हैं; कि आप, याहवे, आमने-सामने दिखाई देते हैं[a]; कि आपका बादल उनके ऊपर ठहरा रहता है; और कि आप दिन में बादल के स्तंभ में और रात में आग के स्तंभ में उनके आगे-आगे चलते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आप आमने-सामने प्रकट होते हैं”; शाब्दिक रूप से, “आँख से आँख।”
    reason: हिब्रू मुहावरे के वैकल्पिक अर्थ और उसके शाब्दिक चित्र को सुरक्षित रखना।
lexical_decisions:
- source_word: יוֹשֵׁב הָאָרֶץ הַזֹּאת
  choice: इस देश के निवासियों
  rationale: एकवचन कृदंत यहाँ सामूहिक अर्थ रखता है; हिंदी में बहुवचन ‘निवासियों’ स्वाभाविक रूप से वहाँ रहने वाली जनसंख्या को व्यक्त करता है।
- source_word: שָׁמְעוּ
  choice: सुन चुके हैं
  rationale: पूर्ण क्रिया पहले सुनी हुई और अब विद्यमान जानकारी को दर्शाती है; ‘सुन चुके हैं’ इस परिणामात्मक भाव को स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर का व्यक्तिगत वाचा-नाम है; इसे किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: בְּקֶרֶב
  choice: के बीच में
  rationale: यह निकट और उपस्थित होने का स्थानगत भाव बनाए रखता है और आधुनिक हिंदी में सहज है।
- source_word: עַיִן בְּעַיִן נִרְאָה
  choice: आमने-सामने दिखाई देते हैं
  rationale: यह हिब्रू मुहावरे के प्रत्यक्ष दृश्य-सामनेपन को स्वाभाविक हिंदी में व्यक्त करता है; शाब्दिक चित्र को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַעֲנָנְךָ עֹמֵד עֲלֵהֶם
  choice: आपका बादल उनके ऊपर ठहरा रहता है
  rationale: ‘ठहरा रहता है’ עמד के स्थिर उपस्थिति-वाले ठोस चित्र को हिंदी में स्वाभाविक ढंग से रखता है।
- source_word: הֹלֵךְ לִפְנֵיהֶם
  choice: उनके आगे-आगे चलते हैं
  rationale: यह मूल क्रिया ‘चलना/जाना’ और आगे स्थित होने—दोनों को रखता है; ‘अगुवाई करते हैं’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: בְּעַמּוּד עָנָן ... וּבְעַמּוּד אֵשׁ
  choice: बादल के खंभे में ... आग के खंभे में
  rationale: पूर्वसर्ग ב को यहाँ दृश्य माध्यम अथवा रूप के रूप में ‘में’ कहना मूल अभिव्यक्ति के निकट और हिंदी में बोधगम्य है।
- source_word: יוֹמָם ... לָיְלָה
  choice: दिन में ... रात में
  rationale: ये समय-सूचक पद आधुनिक हिंदी में सबसे स्वाभाविक रूप से इसी प्रकार व्यक्त होते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से बदले बिना और किसी संप्रदायगत परंपरा को प्राथमिकता दिए बिना प्रस्तुत करता है।
- issue: עַיִן בְּעַיִן נִרְאָה का अर्थ
  choice: आमने-सामने दिखाई देते हैं
  alternative: आँख से आँख दिखाई देते हैं / प्रत्यक्ष प्रकट होते हैं
  rationale: मुख्य पाठ में स्वाभाविक हिंदी रखी गई है, जबकि पादटिप्पणी हिब्रू के असामान्य शाब्दिक चित्र और ‘प्रकट होते हैं’ वाली संभावित व्याख्या को सुरक्षित रखती है; इस प्रकार प्रत्यक्ष दर्शन की प्रकृति को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबे हिब्रू वाक्य को हिंदी में पठनीय बनाने के लिए विराम-चिह्नों और एक छोटे वाक्य-विभाजन का उपयोग किया गया है, पर विचारों का क्रम बनाए रखा गया है।
