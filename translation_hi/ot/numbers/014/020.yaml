base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/020.yaml
  text: And Yahweh said[a], “I have forgiven, according to your word.”
translation:
  language: hi
  text: तब याहवे ने कहा[a], “तेरे वचन के अनुसार मैंने क्षमा कर दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने तेरे कहने के अनुसार क्षमा की है।”
    reason: सָלַחְתִּי और כִּדְבָרֶךָ के वैकल्पिक, स्वाभाविक हिन्दी निरूपण को दर्शाता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; हिन्दी में ‘तब’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: סָלַחְתִּי
  choice: मैंने क्षमा कर दिया है
  rationale: क्रिया क्षमा करने को दर्शाती है और पूर्ण रूप ऐसे संपन्न कार्य को व्यक्त करता है जिसका वर्तमान में प्रभाव है।
- source_word: כִּדְבָרֶךָ
  choice: तेरे कहने के अनुसार
  rationale: यह ‘तेरे वचन के अनुसार’ का सहज आधुनिक हिन्दी रूप है और मूसा की पिछली विनती से स्पष्ट संबंध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है; हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नामात्मकता को सुरक्षित रखता है।
- issue: क्षमा की सीमा और आगामी दंड के बीच तनाव
  choice: क्षमा की घोषणा को बिना विस्तार के यथावत रखा
  alternative: ‘मैं लोगों को पूरी तरह दंडमुक्त करता हूँ’ जैसी व्याख्यात्मक अभिव्यक्ति
  rationale: संदर्भ में क्षमा के बाद भी परिणाम बताए जाते हैं; इसलिए पद स्वयं जितना कहता है उससे अधिक जोड़कर इस धर्मवैज्ञानिक तनाव को हल नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। परमेश्वर द्वारा मूसा को संबोधित एकवचन रूप के लिए ‘तेरे’ रखा गया है; वाक्य संक्षिप्त और मूल की प्रत्यक्ष वाणी के निकट है।
