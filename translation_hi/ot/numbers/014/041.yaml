id: NUM.14.41
reference: Numbers 14:41
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לָ֥/מָּה זֶּ֛ה אַתֶּ֥ם עֹבְרִ֖ים אֶת פִּ֣י יְהוָ֑ה וְ/הִ֖וא לֹ֥א תִצְלָֽח־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/041.yaml
  text: But Moses said[c][b][a], “Why is this that you are transgressing the command of Yahweh? It will not succeed.”
translation:
  language: hi
  text: परन्तु मूसा ने कहा, “तुम यहोवा की आज्ञा का उल्लंघन क्यों कर रहे हो? यह प्रयास सफल नहीं होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु मूसा ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर प्रसंग में मूसा लोगों के निश्चय का विरोध करते हुए चेतावनी देता है; इसलिए ‘परन्तु’ स्वाभाविक है।
- source_word: לָמָה זֶּה
  choice: क्यों
  rationale: यह इब्रानी प्रयोग प्रश्न को बल देता है। हिन्दी में ‘क्यों कर रहे हो?’ उसी बल को स्वाभाविक ढंग से व्यक्त करता है; शब्दशः ‘यह क्यों है कि’ असहज होता।
- source_word: אַתֶּם עֹבְרִים
  choice: तुम ... का उल्लंघन कर रहे हो
  rationale: यहाँ עבר का अर्थ शाब्दिक रूप से पार करना नहीं, बल्कि दी हुई आज्ञा की सीमा लाँघना या उसका उल्लंघन करना है।
- source_word: אֶת פִּי יְהוָה
  choice: यहोवा की आज्ञा
  rationale: शाब्दिक अर्थ ‘यहोवा का मुँह’ है, जो उसके बोले हुए आदेश के लिए इब्रानी मुहावरा है। प्रसंग में ‘आज्ञा’ अर्थ को स्पष्ट और ठीक व्यक्त करता है।
- source_word: וְהִוא לֹא תִצְלָח
  choice: यह प्रयास सफल नहीं होगा
  rationale: स्त्रीलिंग सर्वनाम संदर्भ में निहित चढ़ाई या अभियान की ओर संकेत करता है। ‘यह प्रयास’ हिन्दी में संदर्भ स्पष्ट करता है और צלח का अर्थ ‘सफल होना’ ठीक व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; यह उपाधि ‘प्रभु’ के बजाय नाम को बनाए रखता है।
- issue: וְהִוא के संदर्भ का निर्धारण
  choice: यह प्रयास
  alternative: यह सफल नहीं होगा
  rationale: सर्वनाम का सटीक व्याकरणिक पूर्वपद पद में व्यक्त नहीं है और यह लोगों की प्रस्तावित सैन्य कार्रवाई को संकेत कर सकता है। ‘यह प्रयास’ संदर्भ को पठनीय बनाता है, बिना सफलता को परमेश्वर की सामान्य आज्ञाकारिता या किसी अन्य धारणा से जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से स्वाभाविक शैली। ‘उल्लंघन’ नैतिक और आज्ञात्मक गंभीरता बनाए रखता है, जबकि ‘यह प्रयास’ अंतिम वाक्य के संदर्भ को सामान्य पाठक के लिए स्पष्ट करता है।
