  naturalness: The wording is fluent modern standard Hindi and maintains a dignified biblical register. ‘तुम यहोवा की आज्ञा का उल्लंघन क्यों कर रहे हो?’ is idiomatic and preserves the rhetorical force naturally, without the awkwardness of a literal rendering of לָמָה זֶה.
