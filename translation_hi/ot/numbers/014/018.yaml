source:
  edition: WLC
  text: יְהוָ֗ה אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד נֹשֵׂ֥א עָוֺ֖ן וָ/פָ֑שַׁע וְ/נַקֵּה֙ לֹ֣א יְנַקֶּ֔ה פֹּקֵ֞ד עֲוֺ֤ן אָבוֹת֙ עַל בָּנִ֔ים עַל שִׁלֵּשִׁ֖ים וְ/עַל רִבֵּעִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/018.yaml
  text: Yahweh is slow to anger and abundant in steadfast love[a], forgiving iniquity and transgression, but he will by no means clear the guilty[d][c][b], visiting the iniquity of fathers on children to the third and to the fourth generation.
translation:
  language: hi
  text: याहवे क्रोध करने में धीरज रखता है और अटल प्रेम से भरपूर है[a]; वह अधर्म और अपराध को क्षमा करता है[b], फिर भी दोषी को किसी भी दशा में निर्दोष नहीं ठहराता[c]; वह पिताओं के अधर्म का दण्ड उनकी सन्तानों पर तीसरी और चौथी पीढ़ी तक लाता है[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अटल प्रेम से भरपूर’ का अनुवाद ‘वाचा की निष्ठा में महान,’ ‘दया से भरपूर’ या ‘करुणामय प्रेम से परिपूर्ण’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘क्षमा करता है’ का शाब्दिक अर्थ ‘अधर्म और अपराध को उठाता’ या ‘ढोता है’ है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद ‘निश्चय ही दण्ड दिए बिना नहीं छोड़ता’ या ‘दोषमुक्त नहीं करता’ भी हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: इब्रानी में शाब्दिक रूप से ‘तीसरी और चौथी तक’ है; आशय पीढ़ियों से है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यन्तरण द्वारा सुरक्षित रखा गया है।
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीरजवन्त
  rationale: शाब्दिक इब्रानी मुहावरा ‘लम्बी नासिका वाला’ विलम्ब से क्रोधित होने को व्यक्त करता है; चुना हुआ रूप अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में देता है।
- source_word: רַב חֶסֶד
  choice: अटल प्रेम से भरपूर
  rationale: חֶסֶד में दृढ़ प्रेम, दया और वाचा-निष्ठा के अर्थ सम्मिलित हैं; ‘अटल प्रेम’ उसके स्थायी सम्बन्धपरक बल को रखता है और ‘भरपूर’ רַב को व्यक्त करता है।
- source_word: נֹשֵׂא עָוֺן וָפָשַׁע
  choice: अधर्म और अपराध को क्षमा करता है
  rationale: नשא पाप-संज्ञाओं के साथ उठाने, दूर करने और इस प्रकार क्षमा करने का अर्थ दे सकता है। ‘क्षमा करता है’ प्रसंग में स्वाभाविक है, जबकि टिप्पणी मूल बिम्ब बचाती है।
- source_word: עָוֺן
  choice: अधर्म
  rationale: यह शब्द नैतिक टेढ़ेपन, दोष और उसके दायित्व को सूचित करता है; ‘अधर्म’ आधुनिक धार्मिक हिन्दी में स्पष्ट है और פָשַׁע से भेद रखता है।
- source_word: פָשַׁע
  choice: अपराध
  rationale: यह उल्लंघन अथवा विद्रोह का बोध देता है; ‘अपराध’ सरल हिन्दी में उल्लंघन का भार व्यक्त करता है, जबकि ‘अधर्म’ से अलग रहता है।
- source_word: וְנַקֵּה לֹא יְנַקֶּה
  choice: फिर भी दोषी को किसी भी दशा में निर्दोष नहीं ठहराता
  rationale: धातु की पुनरावृत्ति निषेध को तीव्र करती है। ‘दोषी’ इब्रानी में निहित कर्म को स्पष्ट करता है और न्यायिक अर्थ को स्वाभाविक हिन्दी में संप्रेषित करता है।
- source_word: פֹּקֵד עֲוֺן אָבוֹת עַל בָּנִים
  choice: पिताओं के अधर्म का दण्ड उनकी सन्तानों पर ... लाता है
  rationale: यहाँ פקד अधर्म के न्यायिक परिणाम को लागू करने का बोध देता है। यह रूप अस्पष्ट हिन्दी मुहावरे ‘अधर्म का लेखा लेना’ की अपेक्षा सामान्य पाठक को स्पष्ट है, पर पद की पीढ़ीगत न्याय-विषयक कठोरता को नरम नहीं करता।
- source_word: עַל שִׁלֵּשִׁים וְעַל רִבֵּעִים
  choice: तीसरी और चौथी पीढ़ी तक
  rationale: मूल पाठ में ‘पीढ़ी’ अध्याहृत है; हिन्दी में स्पष्टता के लिए इसे जोड़ा गया है। ‘तक’ दोनों क्रमसूचकों के विस्तार को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय क्षमा और न्याय के बीच तनाव
  choice: परमेश्वर क्षमा करता है, फिर भी दोषी को किसी भी दशा में निर्दोष नहीं ठहराता।
  alternative: इसे केवल क्षमा न पाने वाले पश्चात्तापहीन व्यक्ति के बारे में स्पष्ट करना, अथवा न्याय को केवल स्वाभाविक परिणाम कहना।
  rationale: इब्रानी पाठ दोनों कथनों को साथ रखता है और उनके सम्बन्ध की व्याख्या नहीं करता; अनुवाद उसी वास्तविक तनाव को सुरक्षित रखता है।
- issue: पिताओं के अधर्म का सन्तानों पर दण्ड
  choice: पीढ़ीगत न्याय की मूल भाषा को बनाए रखना।
  alternative: इसे केवल पारिवारिक प्रभाव या स्वाभाविक सामाजिक परिणाम के रूप में नरम करना।
  rationale: פקד और עַל की संरचना यहाँ दैवी न्याय के लागू होने को व्यक्त करती है। अन्य बाइबलीय पाठों के आधार पर इस पद को पहले से सामंजस्यपूर्ण बनाना स्रोत के तनाव को मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप अपनाया गया है। ‘याहवे’ द्वारा दिव्य नाम सुरक्षित है। अर्धविरामों से दया, क्षमा और न्याय के परस्पर सम्बद्ध किन्तु तनावपूर्ण खण्ड स्पष्ट किए गए हैं। ‘सन्तान’ को बहुवचनार्थक रूप में बरता गया है और संयुक्ताक्षर-प्रधान अतिसंस्कृत शब्दावली से यथासम्भव बचा गया है।
