language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ הָ/עֲמָלֵקִ֨י וְ/הַ/כְּנַעֲנִ֥י שָׁם֙ לִ/פְנֵי/כֶ֔ם וּ/נְפַלְתֶּ֖ם בֶּ/חָ֑רֶב כִּֽי עַל כֵּ֤ן שַׁבְתֶּם֙ מֵ/אַחֲרֵ֣י יְהוָ֔ה וְ/לֹא יִהְיֶ֥ה יְהוָ֖ה עִמָּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/043.yaml
  text: For the Amalekites and the Canaanites are there before you, and you will fall by the sword, because you have turned back from following Yahweh, and Yahweh will not be with you.
translation:
  language: hi
  text: क्योंकि अमालेकी और कनानी वहाँ तुम्हारे सामने हैं, और तुम तलवार से मारे जाओगे; क्योंकि तुम याहवे के पीछे चलना छोड़ दिया है, इसलिए याहवे तुम्हारे साथ नहीं होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद की चेतावनी का कारण बताता है; हिन्दी में वाक्य के आरम्भ में ‘क्योंकि’ इस व्याख्यात्मक-कारणात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: अमालेकी और कनानी
  rationale: दोनों एकवचन रूप सामूहिक जाति-संज्ञाएँ हैं; हिन्दी में यही रूप पूरे जनसमूहों को स्वाभाविक ढंग से दर्शाते हैं।
- source_word: שָׁם לִפְנֵיכֶם
  choice: वहाँ तुम्हारे सामने हैं
  rationale: ‘वहाँ’ स्थान और ‘तुम्हारे सामने’ निकट आने वाले सैन्य सामना—दोनों को बनाए रखता है।
- source_word: וּנְפַלְתֶּם בֶּחָרֶב
  choice: और तुम तलवार से मारे जाओगे
  rationale: शाब्दिक ‘तलवार से गिरोगे’ हिन्दी में अस्वाभाविक है; युद्ध-संदर्भ में נפל का आशय मारे जाने से है, जिसे यह अनुवाद स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי עַל כֵּן
  choice: चूँकि ... इसलिए
  rationale: इब्रानी पदबंध कारण और परिणाम पर बल देता है; हिन्दी की सहसंबंधी रचना ‘चूँकि...इसलिए’ उस बल को स्पष्ट रूप से बनाए रखती है।
- source_word: שַׁבְתֶּם מֵאַחֲרֵי יְהוָה
  choice: तुम यहोवा के पीछे चलने से फिर गए हो
  rationale: यह שׁוב और מֵאַחֲרֵי के ‘पीछे चलना छोड़कर फिर जाना’ वाले चित्र को बनाए रखता है, केवल सामान्य ‘मुँह मोड़ना’ नहीं बनाता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुरक्षरीय ईश-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: וְלֹא יִהְיֶה יְהוָה עִמָּכֶם
  choice: इसलिए यहोवा तुम्हारे साथ नहीं रहेगा
  rationale: भविष्यगत परिणाम और परमेश्वर की साथ रहने वाली उपस्थिति, दोनों को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। हिन्दी पाठकों में सुबोध और प्रतिष्ठित रूप ‘यहोवा’ नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: परमेश्वर के ‘साथ’ न रहने का अर्थ
  choice: यहोवा तुम्हारे साथ नहीं रहेगा
  alternative: यहोवा तुम्हारी सहायता नहीं करेगा
  rationale: मूल की उपस्थिति-संबंधी भाषा को ज्यों का त्यों रखा गया है; इसे केवल सैन्य सहायता तक सीमित करना पाठ की वाचागत और धार्मिक व्यापकता को अनावश्यक रूप से संकुचित करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में dignified किंतु सहज शैली। ‘मारे जाओगे’ युद्ध-संदर्भ में स्वाभाविक है; ‘पीछे चलने से फिर गए’ मूल की अनुसरण-छवि और धार्मिक तनाव को सुरक्षित रखता है।
