  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/פִגְרֵי/כֶ֖ם אַתֶּ֑ם יִפְּל֖וּ בַּ/מִּדְבָּ֥ר הַ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/032.yaml
  text: But as for you[a], your dead bodies will fall in this wilderness.
translation:
  language: hi
  text: पर जहाँ तक तुम लोगों की बात है, तुम्हारे शव[a] इस मरुभूमि में गिरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मृत देहें’ अथवा ‘लाशें’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/פִגְרֵי/כֶם
  choice: पर ... तुम्हारी मृत देहें
  rationale: פֶּגֶר किसी मरे हुए व्यक्ति की देह या लाश को दर्शाता है। ‘मृत देहें’ न्याय की ठोस और गंभीर छवि बनाए रखता है, जबकि आरंभिक וּ को प्रसंगानुसार विरोधसूचक ‘पर’ से व्यक्त किया गया है।
- source_word: אַתֶּם
  choice: जहाँ तक तुम लोगों की बात है
  rationale: स्वतंत्र सर्वनाम אַתֶּם यहाँ विरोध और बल देता है। यह हिंदी वाक्यांश उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִפְּלוּ
  choice: गिरेंगी
  rationale: נפל का सीधा अर्थ ‘गिरना’ है। मृत्यु का भाव ‘मृत देहें’ से स्पष्ट होता है, इसलिए क्रिया में अतिरिक्त व्याख्या नहीं जोड़ी गई।
- source_word: בַּ/מִּדְבָּר
  choice: इस जंगल में
  rationale: מִדְבָּר निर्जन वन-प्रदेश या जंगल को दर्शाता है। गिनती की पुस्तक के संदर्भ में ‘जंगल’ सामान्य हिंदी पाठक के लिए स्वाभाविक और प्रचलित बाइबलीय शब्द है।
- source_word: הַ/זֶּה
  choice: इस
  rationale: संकेतवाचक शब्द उस विशेष जंगल की ओर इशारा करता है जहाँ इस्राएली उस समय थे; ‘इस’ बिना अनावश्यक अतिरिक्त बल के इसे व्यक्त करता है।
theological_decisions:
- issue: פִגְרֵיכֶם में न्याय की कठोर और शारीरिक छवि
  choice: तुम्हारी मृत देहें
  alternative: तुम्हारी लाशें / तुम्हारे शव
  rationale: यह अनुवाद अविश्वासी पीढ़ी पर घोषित मृत्यु-दंड की ठोस गंभीरता को बनाए रखता है, पर हिंदी में अनावश्यक रूप से घृणासूचक या असम्मानजनक भाषा नहीं लाता।
- issue: אַתֶּם का विरोधसूचक बल
  choice: जहाँ तक तुम लोगों की बात है
  alternative: तुम स्वयं
  rationale: प्रसंग में यह पीढ़ी उनके बच्चों के विपरीत रखी गई है। चुना हुआ रूप इस विरोध को स्पष्ट करता है, लेकिन मूल से अधिक आत्म-कर्तृत्व का भाव नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठकों के लिए सुबोध रखी गई है। ‘मृत देहें’ मूल की कठोरता को पूरी तरह नरम किए बिना ‘लाशें’ की अपेक्षा थोड़ा अधिक गरिमापूर्ण मुख्य-पाठ रूप देता है; अधिक प्रत्यक्ष विकल्प पादटिप्पणी में सुरक्षित हैं।
