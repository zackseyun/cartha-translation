  edition: WLC
  text: וַ/יִּפֹּ֥ל מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פְּנֵי/הֶ֑ם לִ/פְנֵ֕י כָּל קְהַ֥ל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/005.yaml
  text: Then Moses and Aaron fell on their faces before the whole assembly of the congregation of the sons of Israel[a][b].
translation:
  language: hi
  text: तब मूसा और हारून इस्राएल के पुत्रों[a] की मंडली की सारी सभा[b] के सामने मुँह के बल गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएली’ अथवा ‘इस्राएल की संतान’। इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी अभिव्यक्ति में ‘सभा’ और ‘मंडली’, दोनों संबद्ध सामुदायिक शब्द बल देने के लिए साथ आए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפֹּל
  choice: गिर पड़े
  rationale: נפל का मूल अर्थ ‘गिरना’ है। ‘गिर पड़े’ कथात्मक प्रवाह में स्वाभाविक है और अगले वाक्यांश के साथ मिलकर दण्डवत होने का भाव प्रकट करता है, बिना क्रिया में उससे अधिक अर्थ जोड़े।
- source_word: עַל־פְּנֵיהֶם
  choice: मुँह के बल
  rationale: यह इब्रानी मुहावरा दण्डवत होने अथवा गहरी दीनता दिखाने के लिए प्रयुक्त होता है। ‘मुँह के बल’ आधुनिक हिन्दी में इसका स्पष्ट और स्वाभाविक रूप है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह सार्वजनिक उपस्थिति या किसी के सम्मुख होने को दर्शाता है; ‘के सामने’ संक्षिप्त और सहज हिन्दी है।
- source_word: כָּל
  choice: पूरी
  rationale: सामूहिक संज्ञा के साथ ‘पूरी’ सम्पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְהַל
  choice: सभा
  rationale: קהל एकत्र हुए जनसमूह को दर्शाता है; ‘सभा’ इस सार्वजनिक और औपचारिक प्रसंग के अनुकूल है।
- source_word: עֲדַת
  choice: मण्डली
  rationale: עֵדָה संगठित समुदाय या मण्डली को दर्शाता है। ‘मण्डली’ चुनने से קהל और עדה, दोनों सम्बद्ध सामुदायिक शब्द अलग-अलग बने रहते हैं।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी का शाब्दिक रूप ‘इस्राएल के पुत्र’ है। इसे बनाए रखने से स्रोत की पुरुषवाची और वंशसूचक अभिव्यक्ति सुरक्षित रहती है; वैकल्पिक स्वाभाविक अर्थ पाद-टिप्पणी में दिए गए हैं।
theological_decisions:
- issue: क्या קְהַל עֲדַת के दो सामुदायिक पदों को हिन्दी में एक ही शब्द बना दिया जाए
  choice: दोनों को ‘मण्डली की पूरी सभा’ के रूप में बनाए रखना
  alternative: ‘पूरी मण्डली’ या ‘समूची सभा’
  rationale: इब्रानी में दो निकटार्थक सामुदायिक संज्ञाएँ हैं, जो दृश्य की सार्वजनिक और औपचारिक प्रकृति पर बल देती हैं। दोनों को रखना इस बल को सुरक्षित रखता है, यद्यपि हिन्दी पदबंध जानबूझकर कुछ औपचारिक है।
- issue: क्या בְּנֵי יִשְׂרָאֵל को लिंग-निरपेक्ष सामुदायिक नाम से अनूदित किया जाए
  choice: ‘इस्राएल के पुत्रों’ के रूप में पुरुषवाची स्रोत-अभिव्यक्ति बनाए रखना
  alternative: ‘इस्राएलियों’ या ‘इस्राएल की सन्तानों’
  rationale: मूल पाठ व्याकरणतः पुरुषवाची और वंशसूचक है। चुना गया रूप इसी विशेषता को रखता है, जबकि पाद-टिप्पणी स्पष्ट करती है कि व्यापक जातीय अभिव्यक्ति भी सम्भव है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मुँह के बल गिर पड़े’ हिन्दी का स्वाभाविक मुहावरा है। ‘मण्डली की पूरी सभा’ सामान्य बोलचाल से अधिक औपचारिक है, पर मूल के दोहरे सामुदायिक पदों को सुरक्षित रखने के लिए इसे जानबूझकर रखा गया है।
