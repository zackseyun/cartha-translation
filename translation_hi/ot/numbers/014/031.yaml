  yaml_path: translation/ot/numbers/014/031.yaml
  text: But your little ones[a], whom you said would become plunder, I will bring in[c][b], and they will know the land that you rejected.
translation:
  language: hi
  text: परन्तु तुम्हारे छोटे बच्चे, जिनके विषय में तुमने कहा था कि वे लूट का माल हो जाएँगे[a], मैं उन्हें उस देश में ले आऊँगा; और वे उस देश को जानेंगे[b], जिसे तुमने ठुकरा दिया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शत्रु के हाथ लग जाएँगे” अथवा “लूट हो जाएँगे।”
    reason: lexical_alternative
  - marker: b
    text: या “उस देश का अनुभव करेंगे।” यहाँ “जानना” प्रत्यक्ष अनुभव करने का भाव भी रख सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “जिसका तुमने तिरस्कार किया था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפְּכֶם
  choice: तुम्हारे छोटे बच्चे
  rationale: טַף यहाँ विशेष रूप से छोटे बच्चों को दर्शाता है और संदर्भ में उनकी असुरक्षा को बनाए रखता है।
- source_word: לָבַז
  choice: लूट का माल हो जाएँगे
  rationale: בַּז युद्ध में शत्रु द्वारा ले जाए जाने वाले लूट के माल को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וְהֵבֵיאתִי אֹתָם
  choice: उन्हें मैं भीतर ले आऊँगा
  rationale: בוא का हिफ़ील रूप किसी को प्रवेश कराने का भाव देता है; गंतव्य आगे उल्लिखित देश और व्यापक संदर्भ से समझ में आता है।
- source_word: וְיָדְעוּ
  choice: वे ... जानेंगे
  rationale: יָדַע का मूल अर्थ ‘जानना’ है, पर यहाँ देश का प्रत्यक्ष अनुभव करना भी निहित हो सकता है; मुख्य पाठ मूल की व्यापकता बनाए रखता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ में यह इस्राएल को दिए जाने वाले देश की ओर संकेत करता है, पर मूल पाठ केवल ‘देश’ कहता है; इसलिए ‘प्रतिज्ञात देश’ या ‘कनान’ नहीं जोड़ा गया।
- source_word: מְאַסְתֶּם בָּהּ
  choice: जिसे तुमने ठुकरा दिया था
  rationale: מָאַס अस्वीकार करने, तिरस्कार करने या ठुकराने का अर्थ दे सकता है; ‘ठुकरा दिया’ जानबूझकर किए गए इनकार को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क्या ‘देश’ को स्पष्ट रूप से ‘प्रतिज्ञात देश’ या ‘कनान’ कहा जाए
  choice: मुख्य पाठ में केवल ‘उस देश’ रखा गया।
  alternative: ‘प्रतिज्ञात देश’ अथवा ‘कनान देश’
  rationale: इब्रानी पाठ केवल הָאָרֶץ कहता है। संदर्भ से देश की पहचान स्पष्ट है; अतिरिक्त नाम या धर्मवैचारिक विशेषण जोड़ना आवश्यक नहीं।
- issue: ‘जानेंगे’ को अनुभवात्मक अर्थ में स्पष्ट करना
  choice: मुख्य पाठ में ‘जानेंगे’ रखकर अनुभवात्मक अर्थ पादटिप्पणी में दिया गया।
  alternative: ‘उस देश का अनुभव करेंगे’
  rationale: इससे יָדַע का सीधा अर्थ और उसका संभावित अनुभवात्मक भाव दोनों सुरक्षित रहते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘छोटे बच्चे’ सामान्य पाठक के लिए स्पष्ट है; ‘लूट का माल’ सैन्य प्रसंग को व्यक्त करता है। ‘देश को जानेंगे’ जानबूझकर कुछ हद तक मूलनिष्ठ रखा गया है और संभावित अनुभवात्मक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
