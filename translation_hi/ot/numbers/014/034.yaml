source:
  edition: WLC
  text: בְּ/מִסְפַּ֨ר הַ/יָּמִ֜ים אֲשֶׁר תַּרְתֶּ֣ם אֶת הָ/אָרֶץ֮ אַרְבָּעִ֣ים יוֹם֒ י֣וֹם לַ/שָּׁנָ֞ה י֣וֹם לַ/שָּׁנָ֗ה תִּשְׂאוּ֙ אֶת עֲוֺנֹ֣תֵי/כֶ֔ם אַרְבָּעִ֖ים שָׁנָ֑ה וִֽ/ידַעְתֶּ֖ם אֶת תְּנוּאָתִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/034.yaml
  text: According to the number of the days in which you spied out the land, forty days, a day for a year, a day for a year, you shall bear your iniquities forty years, and you shall know my opposition.
translation:
  language: hi
  text: जितने दिन तुमने उस देश की टोह ली थी—चालीस दिन—हर दिन के बदले एक वर्ष, हर दिन के बदले एक वर्ष, तुम चालीस वर्ष तक अपने अधर्मों का भार उठाओगे; तब तुम जानोगे कि मेरा विरोध क्या होता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा विमुख होना,” “मेरी शत्रुता,” अथवा “मेरी अप्रसन्नता।” कुछ पारंपरिक अनुवादों में “मेरी प्रतिज्ञा का भंग” मिलता है; पर इब्रानी शब्द संभवतः परमेश्वर की ओर से प्रतिज्ञा-भंग नहीं, बल्कि इस विद्रोही पीढ़ी के प्रति उसके विरोध या उससे विमुखता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּמִסְפַּר הַיָּמִים
  choice: जितने दिन
  rationale: यह प्रयोग दिनों की संख्या के अनुरूप दंड की अवधि व्यक्त करता है। स्वाभाविक हिन्दी में ‘जितने दिन’ इस समानुपातिक संबंध को स्पष्ट रखता है।
- source_word: תַּרְתֶּם
  choice: टोह ली थी
  rationale: यहाँ क्रिया कनान की जासूसी और निरीक्षण के अभियान को दर्शाती है; ‘टोह लेना’ सामान्य आधुनिक हिन्दी में उस संदर्भ को सटीक रूप से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ में यह प्रतिज्ञात कनान देश है। ‘उस देश’ पूर्वोक्त और विशिष्ट भूभाग को स्वाभाविक हिन्दी में इंगित करता है।
- source_word: יוֹם לַשָּׁנָה יוֹם לַשָּׁנָה
  choice: हर दिन के बदले एक वर्ष, हर दिन के बदले एक वर्ष
  rationale: मूल की बलाघातपूर्ण पुनरावृत्ति को बनाए रखते हुए चालीस दिनों और चालीस वर्षों का अनुरूप संबंध स्पष्ट किया गया है।
- source_word: תִּשְׂאוּ אֶת עֲוֺנֹתֵיכֶם
  choice: अपने अधर्मों का भार उठाओगे
  rationale: नשא עון के ठोस भार-वाले रूपक और नैतिक दोष तथा उसके परिणाम—दोनों को सुरक्षित रखता है।
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: ידע यहाँ अनुभव से जानने का भाव भी रखता है। ‘जानोगे’ इसकी व्यापकता बनाए रखता है, जबकि ‘तब’ परिणामसूचक प्रवाह को स्वाभाविक बनाता है।
- source_word: תְּנוּאָתִי
  choice: मेरा विरोध
  rationale: दुर्लभ संज्ञा विरोध, विमुखता या अप्रसन्नता का संकेत दे सकती है। न्याय के इस संदर्भ में ‘मेरा विरोध’ उपयुक्त है और परमेश्वर द्वारा प्रतिज्ञा तोड़ने का भ्रामक अर्थ नहीं देता।
theological_decisions:
- issue: תְּנוּאָתִי का धर्मवैज्ञानिक रूप से संवेदनशील अर्थ
  choice: मेरा विरोध
  alternative: मेरा विमुख होना; मेरी शत्रुता; मेरी अप्रसन्नता; मेरा प्रतिज्ञा से फिरना
  rationale: दुर्लभ इब्रानी शब्द संबंध-विच्छेद या विरोध की न्यायिक स्थिति व्यक्त करता जान पड़ता है। ‘मेरा विरोध’ विद्रोही पीढ़ी के प्रति कठोर दैवी प्रतिक्रिया को बनाए रखता है, पर परमेश्वर को प्रतिज्ञाभंग करने वाला नहीं ठहराता। मूल की अनिश्चितता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मूल की पुनरावृत्ति और ‘अधर्म का भार उठाने’ का रूपक सुरक्षित रखा गया है। दुर्लभ अंतिम शब्द की अनिश्चितता मुख्य पाठ और पादटिप्पणी के संतुलन से प्रस्तुत की गई है।
