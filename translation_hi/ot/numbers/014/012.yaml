base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/012.yaml
  text: I will strike him with the plague and dispossess him[a], and I will make you into a nation greater and mightier than he.
translation:
  language: hi
  text: मैं उस पर महामारी से प्रहार करूँगा और उसे बेदखल कर दूँगा[a]; फिर मैं तुझसे एक ऐसा राष्ट्र बनाऊँगा जो उससे बड़ा और अधिक शक्तिशाली होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “उसे उसकी विरासत से वंचित कर दूँगा।” हिब्रू क्रिया में किसी को उसके अधिकार या विरासत से हटाने का भाव हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אַכֶּנּוּ
  choice: मैं उसे ... मारूँगा
  rationale: נכה के हिफ़ील रूप का अर्थ यहाँ प्रहार करके मारना/दंड देना है। एकवचन ‘उसे’ इज़राइल को सामूहिक एकवचन के रूप में दर्शाता है।
- source_word: בַדֶּבֶר
  choice: महामारी से
  rationale: דֶּבֶר न्याय के प्रसंग में घातक महामारी को सूचित करता है; आधुनिक हिन्दी में ‘महामारी’ स्वाभाविक और स्पष्ट है।
- source_word: וְאוֹרִשֶׁנּוּ
  choice: उसे उसके अधिकार से वंचित कर दूँगा
  rationale: ירשׁ के हिफ़ील में अधिकार, संपत्ति या विरासत से हटाने का भाव है। यह अभिव्यक्ति उस व्यापक अर्थ को रखती है, जबकि विरासत का अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְאֶעֱשֶׂה אֹתְךָ לְגוֹי
  choice: मैं तुझसे ... जाति बनाऊँगा
  rationale: यहाँ עשה ... לְ किसी व्यक्ति से एक जाति बनाने का भाव देता है। परमेश्वर मूसा से सीधे एकवचन में बात कर रहा है, इसलिए ‘तुझसे’ रखा गया है।
- source_word: גָּדוֹל וְעָצוּם מִמֶּנּוּ
  choice: उससे बड़ी और अधिक शक्तिशाली
  rationale: מִמֶּנּוּ पूरे वर्णन को तुलनात्मक बनाता है। עָצוּם शक्ति या संख्यात्मक प्रबलता दोनों का संकेत दे सकता है; ‘अधिक शक्तिशाली’ प्रसंगानुकूल है और अर्थ को अनावश्यक रूप से केवल संख्या तक सीमित नहीं करता।
theological_decisions:
- issue: न्याय की धमकी में एकवचन प्रत्ययों का संदर्भ
  choice: इज़राइल के लिए सामूहिक एकवचन ‘उसे/उससे’
  alternative: स्वाभाविक हिन्दी के लिए बहुवचन ‘उन्हें/उनसे’
  rationale: मसोराई हिब्रू में 3 पुल्लिंग एकवचन प्रत्यय हैं। एकवचन बनाए रखने से इज़राइल को एक सामूहिक जाति के रूप में संबोधित करने वाली मूल वाक्पटुता सुरक्षित रहती है।
- issue: וְאוֹרִשֶׁנּוּ में ירשׁ का आशय
  choice: अधिकार से वंचित करना
  alternative: विरासत से वंचित करना; बेदखल करना
  rationale: क्रिया में अधिकार/विरासत छीनने और कब्जे से हटाने, दोनों की अर्थछाया संभव है। मुख्य पाठ व्यापक अर्थ रखता है और विरासत संबंधी अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। परमेश्वर द्वारा मूसा को सीधे संबोधन के कारण ‘तू’ का सम्मानपूर्ण शास्त्रीय रूप ‘तुझसे’ रखा गया है; इज़राइल के लिए मूल हिब्रू का सामूहिक एकवचन सुरक्षित है।
