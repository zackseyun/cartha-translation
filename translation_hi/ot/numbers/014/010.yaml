source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ כָּל הָ֣/עֵדָ֔ה לִ/רְגּ֥וֹם אֹתָ֖/ם בָּ/אֲבָנִ֑ים וּ/כְב֣וֹד יְהוָ֗ה נִרְאָה֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/010.yaml
  text: But all the congregation said to stone them with stones[a], and the glory of Yahweh appeared in the tent of meeting to all the sons of Israel.
translation:
  language: hi
  text: पर सारी मण्डली ने कहा कि उन्हें पत्थरों से मारें; तब याहवे की महिमा मिलाप के तम्बू में सभी इस्राएलियों के सामने दिखाई दी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “इस्राएल के सभी पुत्रों को।” यह पूरे इस्राएली समुदाय के लिए प्रयुक्त एक स्थापित राष्ट्रीय पदबंध है।'
    reason: בְּנֵי יִשְׂרָאֵל के शाब्दिक रूप और उसके संदर्भानुकूल राष्ट्रीय अर्थ—दोनों को स्पष्ट करने के लिए।
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: यह पद पूरे एकत्रित इस्राएली समुदाय को दर्शाता है। ‘मण्डली’ सामूहिक और औपचारिक अर्थ बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: לִרְגּוֹם אֹתָם בָּאֲבָנִים
  choice: उन्हें पत्थरों से मारें
  rationale: רגם का अर्थ पत्थर मारना है और בָּאֲבָנִים साधन को स्पष्ट करता है। मूल में मृत्यु का परिणाम अलग से नहीं कहा गया, इसलिए ‘मार डालें’ नहीं जोड़ा गया।
- source_word: אֹתָם
  choice: उन्हें
  rationale: निकटवर्ती सन्दर्भ में यह सर्वनाम यहोशू और कालेब की ओर संकेत करता है; मूल की कथात्मक प्रवाह-शैली बनाए रखने के लिए नाम नहीं जोड़े गए।
- source_word: כְבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד यहाँ याहवे की दृश्य रूप से प्रकट उपस्थिति या महिमा को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यन्तरण ‘याहवे’ से दिया गया है।
- source_word: נִרְאָה
  choice: दिखाई दी
  rationale: ראה का निफ़अल रूप यहाँ दृश्य अभिव्यक्ति बताता है। ‘दिखाई दी’ हिन्दी में सहज है और महिमा के प्रकट होने का भाव रखता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलाप के तम्बू में
  rationale: यह इस्राएल के पवित्र मिलन-स्थान का स्थापित नाम है; ‘में’ हिब्रू उपसर्ग בְּ को निकटता से व्यक्त करता है।
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सारी सन्तान को
  rationale: यह राष्ट्रीय समुदाय के लिए प्रयुक्त पारम्परिक हिब्रू पदबंध है। हिन्दी में ‘सन्तान’ स्त्री-पुरुष दोनों को समेटते हुए उसके वंशगत रूपक को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। लिप्यन्तरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का राष्ट्रीय पदबंध
  choice: इस्राएल की सारी सन्तान
  alternative: सभी इस्राएली
  rationale: चुना गया रूप मूल के वंशगत पदबंध को बनाए रखता है, जबकि फुटनोट अधिक मुहावरेदार सामुदायिक अभिव्यक्ति देता है।
- issue: רגם में मृत्यु के परिणाम को स्पष्ट करना
  choice: पत्थरों से मारें
  alternative: पत्थर मारकर मार डालें
  rationale: सन्दर्भ प्राणघातक आशय सुझा सकता है, पर इस पद में ‘मार डालना’ अलग से व्यक्त नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किन्तु गरिमापूर्ण कथात्मक शैली। ‘सारी मण्डली’, ‘मिलाप का तम्बू’ और ‘याहवे की महिमा’ जैसे पद स्रोत की औपचारिकता तथा धार्मिक प्रसंग को बनाए रखते हैं।
