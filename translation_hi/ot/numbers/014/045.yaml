  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘पहाड़ी प्रदेश’ भौगोलिक संदर्भ स्पष्ट करता है, और ‘कुचलते चले गए’ युद्ध में पराजय की तीव्रता तथा आगे बढ़ती कार्रवाई को व्यक्त करता है।
