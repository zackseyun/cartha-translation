  text: וַ/יֵּ֤רֶד הָ/עֲמָלֵקִי֙ וְ/הַֽ/כְּנַעֲנִ֔י הַ/יֹּשֵׁ֖ב בָּ/הָ֣ר הַ/ה֑וּא וַ/יַּכּ֥וּ/ם וַֽ/יַּכְּת֖וּ/ם עַד הַֽ/חָרְמָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/045.yaml
  text: Then the Amalekites and the Canaanites who lived in that hill country came down and struck them and beat them down as far as Hormah[a].
translation:
  language: hi
  text: तब उस पहाड़ी प्रदेश में रहनेवाले अमालेकी और कनानी नीचे उतरे और उन्होंने उन्हें मारा और होर्मा[a] तक उन्हें कुचल दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: होर्मा एक स्थान का नाम है; यह इब्रानी नाम उस शब्द से संबंधित है जिसका अर्थ “विनाश” या “विनाश के लिए अर्पण” हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: नीचे उतरे
  rationale: यह क्रिया पहाड़ी प्रदेश से नीचे की ओर सैनिक बढ़त को व्यक्त करती है। इब्रानी में संयुक्त कर्ता से पहले एकवचन क्रिया सामान्य है, जबकि हिन्दी में बहुवचन स्वाभाविक है।
- source_word: הָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: अमालेकी और कनानी
  rationale: दोनों एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ में हैं; बाद की बहुवचन क्रियाएँ भी इसकी पुष्टि करती हैं। हिन्दी में ये रूप समुदायों के सामूहिक नाम के रूप में स्वाभाविक हैं।
- source_word: הַיֹּשֵׁב בָּהָר הַהוּא
  choice: उस पहाड़ी प्रदेश में रहनेवाले
  rationale: יֹשֵׁב निवास करने का अर्थ देता है और הָר यहाँ किसी एक चोटी से अधिक उस ऊँचे भूभाग को सूचित करता है जहाँ से वे नीचे उतरे।
- source_word: וַיַּכּוּם
  choice: उन्होंने उन्हें मारा
  rationale: נכה का ठोस और व्यापक अर्थ ‘मारना/प्रहार करना’ है। यह अनावश्यक रूप से पूर्ण विनाश का अर्थ जोड़े बिना सैन्य आक्रमण व्यक्त करता है।
- source_word: וַיַּכְּתוּם
  choice: उन्हें कुचलते चले गए
  rationale: यह क्रिया पहले प्रहार के बाद प्रबल पराजय और लगातार खदेड़े जाने का चित्र देती है। ‘कुचलते चले गए’ उसकी तीव्रता और होर्मा तक की गति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד הַחָרְמָה
  choice: होर्मा तक
  rationale: עַד सीमा या पहुँच का बोध कराता है; स्थाननाम के साथ हिन्दी में ‘तक’ इसका सीधा और स्वाभाविक रूप है।
- source_word: הַחָרְמָה
  choice: होर्मा
  rationale: मुख्य पाठ में स्थाननाम का लिप्यंतरण रखा गया है; उसके विनाश-संबंधी शब्दार्थ की जानकारी पादटिप्पणी में दी गई है।
