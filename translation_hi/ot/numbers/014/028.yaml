source:
  edition: WLC
  text: אֱמֹ֣ר אֲלֵ/הֶ֗ם חַי אָ֨נִי֙ נְאֻם יְהוָ֔ה אִם לֹ֕א כַּ/אֲשֶׁ֥ר דִּבַּרְתֶּ֖ם בְּ/אָזְנָ֑/י כֵּ֖ן אֶֽעֱשֶׂ֥ה לָ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/028.yaml
  text: Say to them, ‘As I live, declares the LORD, surely just as you have spoken in my hearing, so I will do to you.’
translation:
  language: hi
  text: उनसे कहो, ‘मेरे जीवन की शपथ—यहोवा की यह घोषणा है—निश्चय ही, जैसा तुमने मेरे सुनते हुए कहा है, वैसा ही मैं तुम्हारे साथ करूँगा।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי אָנִי
  choice: मेरे जीवन की शपथ
  rationale: शाब्दिक रूप ‘मैं जीवित हूँ’ है, पर यहाँ यह ईश्वर की स्वयं अपने जीवन की शपथ खाने की सूत्रात्मक अभिव्यक्ति है; चुना हुआ रूप आधुनिक हिन्दी में इसका बल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: נְאֻם को भविष्यद्वाणी-संबंधी दिव्य उद्घोषणा के रूप में और चार-अक्षरीय दिव्य नाम को ‘यहोवा’ के रूप में स्पष्ट रखा गया है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: शपथ के बाद यह अधूरी शर्त नहीं, बल्कि दृढ़ प्रतिज्ञात्मक बल देता है; ‘निश्चय ही’ उसी अर्थ को व्यक्त करता है।
- source_word: כַּאֲשֶׁר דִּבַּרְתֶּם בְּאָזְנָי
  choice: जैसा तुमने मेरे सुनते हुए कहा है
  rationale: कान में बोलने की हिब्रू छवि का अर्थ ‘मेरी सुनवाई में’ है; यह हिन्दी रूप अर्थ और प्रसंग दोनों को स्पष्ट रखता है।
- source_word: כֵּן אֶעֱשֶׂה לָכֶם
  choice: वैसा ही मैं तुम्हारे साथ करूँगा
  rationale: לָכֶם का प्रसंगगत अर्थ उन पर/उनके साथ वही करना है जिसकी उन्होंने बात कही थी; हिन्दी में ‘तुम्हारे साथ’ स्वाभाविक और पर्याप्त रूप से खुला है।
theological_decisions:
- issue: दिव्य नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है; उसे शीर्षक में बदलने के बजाय हिन्दी पाठकों में प्रचलित लिप्यंतरण से नाम का भेद बनाए रखा गया है।
- issue: ईश्वर की शपथ का बल
  choice: ‘मेरे जीवन की शपथ’ और ‘निश्चय ही’ दोनों रखे गए
  alternative: ‘मैं जीवित हूँ’ अथवा केवल ‘निश्चय ही’
  rationale: חַי אָנִי और אִם לֹא मिलकर गंभीर शपथात्मक प्रतिज्ञा बनाते हैं; दोनों का बल व्यक्त करने से चेतावनी की निश्चितता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ में रखा गया है। शैली गरिमापूर्ण लेकिन सामान्य पाठक के लिए सहज है। उद्धरण-विन्यास से मूसा का कथन और यहोवा की घोषणा स्पष्ट अलग दिखाई देते हैं।
