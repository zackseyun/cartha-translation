id: NUM.14.11
reference: Numbers 14:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עַד אָ֥נָה יְנַאֲצֻ֖/נִי הָ/עָ֣ם הַ/זֶּ֑ה וְ/עַד אָ֨נָה֙ לֹא יַאֲמִ֣ינוּ בִ֔/י בְּ/כֹל֙ הָֽ/אֹת֔וֹת אֲשֶׁ֥ר עָשִׂ֖יתִי בְּ/קִרְבּֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/011.yaml
  text: And Yahweh said to Moses[a], “How long will this people treat me with contempt? And how long will they not believe in me[c][b], despite all the signs that I have done among them?”
translation:
  language: hi
  text: यहोवा ने मूसा से कहा, “यह प्रजा कब तक मेरा तिरस्कार करती रहेगी?[a] और वह कब तक मुझ पर विश्वास नहीं करेगी, उन सब चिन्हों के बावजूद जो मैंने उसके बीच में किए हैं?[b][c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे तुच्छ समझती रहेगी?”
    reason: नאַץ में तिरस्कार करने, तुच्छ समझने और अवमानना से ठुकराने की अर्थ-छायाएँ हैं।
  - marker: b
    text: शाब्दिक रूप से, “उसके भीतर”; यहाँ ‘उसके’ का संबंध सामूहिक एकवचन ‘इस प्रजा’ से है।
    reason: मूल इब्रानी के एकवचन प्रत्यय और सामूहिक संदर्भ को स्पष्ट करता है।
  - marker: c
    text: या, “मुझ पर भरोसा नहीं करेगी?”
    reason: अमन के साथ बे विश्वास करने के साथ-साथ भरोसा रखने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित प्रतिलेखन ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: עַד אָנָה
  choice: कब तक
  rationale: यह इब्रानी कालवाचक प्रश्न का स्वाभाविक हिन्दी रूप है और शिकायत की तीव्रता बनाए रखता है।
- source_word: יְנַאֲצֻנִי
  choice: मेरा तिरस्कार करती रहेगी
  rationale: क्रिया में अवमानना के साथ ठुकराने का भाव है; ‘तिरस्कार’ इसे स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָעָם הַזֶּה
  choice: यह प्रजा
  rationale: ‘प्रजा’ सामूहिक एकवचन को बनाए रखती है और आगे आने वाले एकवचन सर्वनाम के साथ स्वाभाविक मेल रखती है।
- source_word: לֹא יַאֲמִינוּ בִי
  choice: मुझ पर विश्वास नहीं करेगी
  rationale: אמן के साथ ב व्यक्ति पर विश्वास करने और भरोसा रखने, दोनों की अर्थ-छाया रखता है; मुख्य पाठ में ‘विश्वास’ रखा गया और ‘भरोसा’ पादटिप्पणी में।
- source_word: בְּכֹל הָאֹתוֹת
  choice: उन सब चिन्हों के बावजूद
  rationale: 'संदर्भ में ב concessive है: इतने चिन्हों के होते हुए भी प्रजा विश्वास नहीं करती।'
- source_word: הָאֹתוֹת
  choice: चिन्हों
  rationale: यह אוֹת का सीधा रूप है; ‘चमत्कारी’ जोड़ने से बचा गया क्योंकि वह शब्द में स्पष्ट रूप से उपस्थित नहीं है।
- source_word: עָשִׂיתִי
  choice: मैंने ... किए हैं
  rationale: हिन्दी पूर्ण भूतकाल उन पिछले कार्यों की वर्तमान प्रसंग में बनी हुई प्रासंगिकता व्यक्त करता है।
- source_word: בְּקִרְבּוֹ
  choice: उसके बीच
  rationale: इब्रानी प्रत्यय व्याकरणतः एकवचन है और सामूहिक एकवचन ‘यह प्रजा’ की ओर संकेत करता है; इसे हिन्दी में भी बनाए रखा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए स्थापित प्रतिलेखन ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसी स्थानापन्न उपाधि।
- issue: לֹא יַאֲמִינוּ בִי में विश्वास और भरोसे की अर्थ-छाया
  choice: मुझ पर विश्वास नहीं करेगी
  alternative: मुझ पर भरोसा नहीं करेगी
  rationale: इब्रानी वाक्यांश बौद्धिक स्वीकृति और संबंधपरक भरोसे दोनों को समेट सकता है। मुख्य पाठ में निकटतर ‘विश्वास’ और पादटिप्पणी में ‘भरोसा’ देकर अस्पष्टता सुरक्षित रखी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘यह प्रजा’ तथा ‘उसके बीच’ से मूल के सामूहिक एकवचन को सुरक्षित रखा गया है। दोहराए गए ‘कब तक’ से इब्रानी की समानांतर प्रश्नात्मक संरचना और भावात्मक तीव्रता बनी रहती है।
