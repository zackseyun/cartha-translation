  text: וַ/יַּעְפִּ֕לוּ לַ/עֲל֖וֹת אֶל רֹ֣אשׁ הָ/הָ֑ר וַ/אֲר֤וֹן בְּרִית יְהוָה֙ וּ/מֹשֶׁ֔ה לֹא מָ֖שׁוּ מִ/קֶּ֥רֶב הַֽ/מַּחֲנֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/044.yaml
  text: But they presumed to go up to the top of the mountain[b][a], though the ark of the covenant of Yahweh and Moses did not move from the midst of the camp.
translation:
  language: hi
  text: परन्तु उन्होंने पहाड़ की चोटी पर चढ़ने का दुस्साहस किया[a]; फिर भी याहवे की वाचा का सन्दूक[b] और मूसा छावनी के भीतर से नहीं हटे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने हठपूर्वक चढ़ने की कोशिश की” या “वे धृष्टतापूर्वक चढ़ने लगे।” इब्रानी क्रिया में जानबूझकर किए गए धृष्ट या हठपूर्ण कार्य का भाव है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “याहवे की वाचा का सन्दूक”; इसे “याहवे के वाचा-सन्दूक” के अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעְפִּלוּ
  choice: वे हठपूर्वक ... चढ़ गए
  rationale: यह क्रिया जानबूझकर दुस्साहस और आदेश की अवहेलना का भाव रखती है। ‘हठपूर्वक’ इस नैतिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לַעֲלוֹת
  choice: चढ़ गए
  rationale: עלה ऊपर की ओर जाने को दर्शाता है; पहाड़ के प्रसंग में ‘चढ़ गए’ स्वाभाविक हिन्दी है।
- source_word: אֶל רֹאשׁ הָהָר
  choice: पहाड़ की चोटी पर
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ मुहावरे के रूप में ‘चोटी’ अभिप्रेत है।
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: यहोवा की वाचा का सन्दूक
  rationale: यह हिन्दी में स्वाभाविक रहते हुए इब्रानी संबंध-रचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לֹא מָשׁוּ
  choice: नहीं हटे
  rationale: מוש यहाँ अपने स्थान से हटने या प्रस्थान करने का अर्थ देता है; ‘नहीं हटे’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: מִקֶּרֶב הַמַּחֲנֶה
  choice: छावनी के बीच से
  rationale: קֶרֶב छावनी के भीतर या मध्य भाग को दर्शाता है; यह अभिव्यक्ति मूल का स्थानिक अर्थ बनाए रखती है।
theological_decisions:
- issue: וַיַּעְפִּלוּ में लोगों के कार्य का नैतिक भाव
  choice: हठपूर्वक ... चढ़ गए
  alternative: दुस्साहस करके चढ़ गए; धृष्टतापूर्वक चढ़ने लगे
  rationale: सन्दर्भ में यह केवल साहसिक चढ़ाई नहीं, बल्कि चेतावनी के बावजूद जानबूझकर किया गया कार्य है। फिर भी अनुवाद उनके भीतर के उद्देश्य को मूल से अधिक विशिष्ट नहीं बनाता।
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिवाचक चार-अक्षरीय नाम है। हिन्दी के सामान्य पाठक के लिए स्थापित रूप ‘यहोवा’ नाम और उपाधि के भेद को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘हठपूर्वक’ मूल क्रिया के नैतिक तनाव को बचाता है; ‘मगर’ लोगों की चढ़ाई और सन्दूक तथा मूसा के न जाने के बीच विरोध को स्पष्ट करता है।
