  text: וְ/הֵמַתָּ֛ה אֶת הָ/עָ֥ם הַ/זֶּ֖ה כְּ/אִ֣ישׁ אֶחָ֑ד וְ/אָֽמְרוּ֙ הַ/גּוֹיִ֔ם אֲשֶׁר שָׁמְע֥וּ אֶֽת שִׁמְעֲ/ךָ֖ לֵ/אמֹֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/015.yaml
  text: And if you kill this people as one man[a], then the nations that have heard your report will say[b],
translation:
  language: hi
  text: और यदि तू इस प्रजा को एक मनुष्य के समान[a] मार डाले, तो जिन जातियों ने तेरी चर्चा सुनी है[b], वे कहेंगी,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “एक मनुष्य के समान”; यह मुहावरा पूरी प्रजा को एक साथ मार डालने का भाव देता है।
    reason: lexical_alternative
  - marker: b
    text: या “जिन्होंने तेरे विषय का समाचार सुना है” अथवा “जिन्होंने तेरी कीर्ति सुनी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵמַתָּה
  choice: और यदि तू ... मार डालेगा
  rationale: הֵמַתָּה, מות का हिफ़ील रूप, ‘मार डालना’ है। पूर्ववर्ती प्रसंग में मूसा की शर्तात्मक दलील के कारण सरल हिब्रू वाव को हिन्दी में ‘यदि’ से स्पष्ट किया गया है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा को
  rationale: עָם यहाँ इस्राएल के सामूहिक समुदाय को दर्शाता है; ‘प्रजा’ हिन्दी में स्वाभाविक और गरिमापूर्ण है तथा संकेतवाचक ‘इस’ को बनाए रखता है।
- source_word: כְּאִישׁ אֶחָד
  choice: एक मनुष्य के समान
  rationale: शाब्दिक रूप ‘एक मनुष्य के समान’ है और पूरे समुदाय के एक साथ समान अंत को व्यक्त करने वाला मुहावरा है। स्रोत की अभिव्यक्ति मुख्य पाठ में रखी गई और अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַגּוֹיִם
  choice: जातियाँ
  rationale: גּוֹיִם इस्राएल से भिन्न राष्ट्रों/जातियों के लिए है। ‘जातियाँ’ बाइबिलीय हिन्दी में सहज है और बाद की धार्मिक श्रेणियों को नहीं थोपता।
- source_word: אֲשֶׁר שָׁמְעוּ אֶת שִׁמְעֲךָ
  choice: जिन ... ने तेरी चर्चा सुनी है
  rationale: שֵׁמַע का अर्थ समाचार, चर्चा या ख्याति हो सकता है। ‘तेरी चर्चा’ इस संदर्भ में यह खुलापन बनाए रखती है कि जातियों ने यहोवा के विषय में फैली बात अथवा उसकी कीर्ति सुनी है।
- source_word: לֵאמֹר
  choice: वे कहेंगी,
  rationale: यह क्रियारूप अगले पद में आने वाली कथन-वस्तु का परिचय देता है; हिन्दी में भविष्यकालीन मुख्य क्रिया और अल्पविराम स्वाभाविक हैं।
theological_decisions:
- issue: मानव-संबंधी पुल्लिंग मुहावरे का अनुवाद
  choice: एक मनुष्य के समान
  alternative: सबको एक साथ
  rationale: אִישׁ אֶחָד का पुल्लिंग एक खास पुरुष को निर्दिष्ट नहीं करता, बल्कि सामूहिक और एकसमान अंत का मुहावरा है। फिर भी मूल रूप और उसकी अलंकारिक तीव्रता को पाठ में सुरक्षित रखा गया है।
- issue: שִׁמְעֲךָ में समाचार और ख्याति की अर्थ-संभावना
  choice: तेरी चर्चा
  alternative: तेरे विषय का समाचार / तेरी कीर्ति
  rationale: ‘चर्चा’ रिपोर्ट और ख्याति के बीच की वास्तविक अर्थगत गुंजाइश को खुला रखती है और किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सुबोध शैली रखी गई है। परमेश्वर को संबोधित करते हुए एकवचन ‘तू/तेरी’ मूल इब्रानी के सीधे संबोधन को दर्शाता है। वाक्य अगले पद के कथन की ओर खुला रहता है।
