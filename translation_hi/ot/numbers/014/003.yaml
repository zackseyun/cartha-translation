  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָ/מָ֣ה יְ֠הוָה מֵבִ֨יא אֹתָ֜/נוּ אֶל הָ/אָ֤רֶץ הַ/זֹּאת֙ לִ/נְפֹּ֣ל בַּ/חֶ֔רֶב נָשֵׁ֥י/נוּ וְ/טַפֵּ֖/נוּ יִהְי֣וּ לָ/בַ֑ז הֲ/ל֧וֹא ט֦וֹב לָ֖/נוּ שׁ֥וּב מִצְרָֽיְמָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/003.yaml
  text: And why is Yahweh bringing us into this land to fall by the sword? Our wives and our little ones will become plunder[a]. Would it not be better for us to return to Egypt?
translation:
  language: hi
  text: और यहोवा हमें इस देश में क्यों ला रहा है? क्या इसलिए कि हम तलवार से मारे जाएँ? हमारी पत्नियाँ और हमारे छोटे बच्चे लूट का माल[a] बन जाएँगे। क्या हमारे लिए मिस्र लौट जाना बेहतर न होगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शत्रुओं का शिकार’; इब्रानी शब्द युद्ध में शत्रुओं द्वारा लूट के रूप में ले जाए जाने का भाव भी व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: और ... क्यों
  rationale: आरंभिक וְ पिछले कथन से शिकायत की निरंतरता दिखाता है; हिंदी में ‘और’ इस प्रवाह को स्वाभाविक रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: מֵבִיא
  choice: ला रहा है
  rationale: कृदंत यहाँ चल रही अथवा निकट भविष्य की क्रिया व्यक्त करता है; हिंदी का अपूर्ण वर्तमान इसे स्पष्ट करता है।
- source_word: לִנְפֹּל בַּחֶרֶב
  choice: तलवार से मारे जाएँ
  rationale: शाब्दिक ‘तलवार से गिरना’ युद्ध में मारे जाने का इब्रानी मुहावरा है; वर्तमान हिंदी में अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त किया गया है।
- source_word: נָשֵׁינוּ וְטַפֵּנוּ
  choice: हमारी पत्नियाँ और हमारे छोटे बच्चे
  rationale: पारिवारिक संदर्भ में נָשִׁים का अर्थ ‘पत्नियाँ’ है और טַף विशेषतः असहाय छोटे बच्चों को सूचित करता है।
- source_word: יִהְיוּ לָבַז
  choice: लूट का माल बन जाएँगे
  rationale: בַּז युद्ध में शत्रु द्वारा हथियाई गई लूट को दर्शाता है; ‘लूट का माल’ हिंदी में ठोस और सहज है।
- source_word: הֲלוֹא טוֹב לָנוּ שׁוּב מִצְרָיְמָה
  choice: क्या हमारे लिए मिस्र लौट जाना बेहतर न होगा?
  rationale: नकारात्मक प्रश्नवाचक रचना अपेक्षित सहमति वाला आलंकारिक प्रश्न है; यह हिंदी रूप उसी बल को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिंदी पाठकों के लिए प्रतिष्ठित ‘यहोवा’ लिप्यंतरण नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक समीक्षात्मक पुनर्निर्मित उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। पहले प्रश्न को दो वाक्यों में बाँटकर उद्देश्यसूचक לִנְפֹּל का आशय स्पष्ट किया गया है, जबकि शिकायत का आलंकारिक तनाव सुरक्षित है।
