  text: וְ/הָֽ/עֲמָלֵקִ֥י וְ/הַֽ/כְּנַעֲנִ֖י יוֹשֵׁ֣ב בָּ/עֵ֑מֶק מָחָ֗ר פְּנ֨וּ וּ/סְע֥וּ לָ/כֶ֛ם הַ/מִּדְבָּ֖ר דֶּ֥רֶךְ יַם סֽוּף־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/025.yaml
  text: The Amalekites and the Canaanites are living in the valley[a]. Tomorrow turn and set out for yourselves into the wilderness by the way of the Red Sea.
translation:
  language: hi
  text: अमालेकी और कनानी घाटी में बसे हुए हैं। कल तुम मुड़कर लाल सागर[a] के मार्ग से निर्जन प्रदेश की ओर कूच करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “सरकंडों का सागर।” परंपरागत अनुवाद: “लाल सागर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָעֲמָלֵקִי וְהַכְּנַעֲנִי
  choice: अमालेकी और कनानी
  rationale: निश्चित उपपद के साथ एकवचन जातिवाचक संज्ञाएँ यहाँ दोनों जाति-समूहों को सामूहिक रूप से दर्शाती हैं; हिन्दी में ये रूप स्वाभाविक रूप से सामूहिक अर्थ देते हैं।
- source_word: יוֹשֵׁב
  choice: बसे हुए हैं
  rationale: कृदन्त निरंतर निवास की स्थिति बताता है; ‘बसे हुए हैं’ आधुनिक हिन्दी में इस स्थायी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק घाटी अथवा नीची भूमि को दर्शाता है; यहाँ ‘घाटी’ सीधा और संदर्भानुकूल है।
- source_word: מָחָר
  choice: कल
  rationale: यह अगले दिन का निर्देश देता है; हिन्दी में भविष्य-संदर्भ से ‘कल’ का अर्थ स्पष्ट है।
- source_word: פְּנוּ
  choice: मुड़कर
  rationale: क्रिया दिशा बदलने की आज्ञा देती है; मूल में ‘वापस’ स्पष्ट रूप से नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: וּסְעוּ לָכֶם
  choice: तुम … कूच करो
  rationale: נסע शिविर उठाकर यात्रा आरम्भ करने को दर्शाता है। ‘कूच करो’ यात्रा-संबंधी आज्ञा को संक्षिप्त रूप से व्यक्त करता है; לָכֶם का संबोधनात्मक बल ‘तुम’ से प्रकट होता है।
- source_word: הַמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं, बल्कि कम आबादी वाला वन्य/निर्जन क्षेत्र भी है; ‘निर्जन प्रदेश’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: דֶּרֶךְ יַם סוּף
  choice: लाल सागर[a] के मार्ग से
  rationale: דֶּרֶךְ मार्ग अथवा दिशा बताता है। יַם סוּף का पारंपरिक भौगोलिक नाम ‘लाल सागर’ मुख्य पाठ में रखा गया है, जबकि अधिक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
