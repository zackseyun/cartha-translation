  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आदेशवाचक लहजा स्पष्ट है और मूल पाठ से अधिक दिशा-सूचना, जैसे ‘वापस’, नहीं जोड़ी गई है। पादटिप्पणी-चिह्न संबंधित पद ‘लाल सागर’ के बाद रखा गया है।
