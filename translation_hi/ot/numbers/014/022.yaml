  text: כִּ֣י כָל הָ/אֲנָשִׁ֗ים הָ/רֹאִ֤ים אֶת כְּבֹדִ/י֙ וְ/אֶת אֹ֣תֹתַ֔/י אֲשֶׁר עָשִׂ֥יתִי בְ/מִצְרַ֖יִם וּ/בַ/מִּדְבָּ֑ר וַ/יְנַסּ֣וּ אֹתִ֗/י זֶ֚ה עֶ֣שֶׂר פְּעָמִ֔ים וְ/לֹ֥א שָׁמְע֖וּ בְּ/קוֹלִֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/022.yaml
  text: For all the men who have seen my glory and my signs that I did in Egypt and in the wilderness[a], and have tested me these ten times and have not listened to my voice—
translation:
  language: hi
  text: क्योंकि वे सभी पुरुष जिन्होंने मेरी महिमा और मेरे वे चिन्ह देखे हैं, जो मैंने मिस्र और निर्जन प्रदेश में किए, और जिन्होंने इन दस बार मुझे परखा है और मेरी बात नहीं मानी है[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरी आवाज़ नहीं सुनी।” इब्रानी मुहावरे का अर्थ ध्यान देना या आज्ञा मानना भी हो सकता है।
    reason: शाब्दिक वैकल्पिक अनुवाद और मुहावरेदार अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में कही गई शपथ और न्याय का आधार प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक-कारणसूचक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל הָאֲנָשִׁים
  choice: जिन सब पुरुषों ने
  rationale: אֲנָשִׁים यहाँ पुरुषों को सूचित करता है और प्रसंग में न्याय के अधीन उस पीढ़ी के वयस्क पुरुष अभिप्रेत हैं; इसलिए लिंग-निरपेक्ष ‘लोगों’ के बजाय ‘पुरुषों’ रखा गया है।
- source_word: הָרֹאִים
  choice: देखे हैं
  rationale: कर्तृवाचक कृदंत उन पुरुषों का वर्णन करता है जिन्होंने ये बातें देखी हैं; पूर्ण पक्ष उनके पिछले अनुभव की वर्तमान प्रासंगिकता रखता है।
- source_word: כְּבֹדִי
  choice: मेरी महिमा
  rationale: ईश्वरीय संदर्भ में כָּבוֹד प्रकट महिमा को दर्शाता है; ‘महिमा’ इसका प्रचलित और अर्थगर्भित हिन्दी रूप है।
- source_word: אֹתֹתַי
  choice: मेरे वे चिन्ह
  rationale: אוֹת संकेत अथवा प्रमाणस्वरूप चिन्ह को दर्शाता है; ‘चिन्ह’ उसके साक्ष्यात्मक कार्य को ‘चमत्कार’ की अपेक्षा अधिक निकटता से रखता है।
- source_word: אֲשֶׁר עָשִׂיתִי
  choice: जो मैंने ... किए
  rationale: עשה का सीधा और स्वाभाविक अनुवाद है; इससे इन कार्यों के स्वरूप के बारे में अनावश्यक विस्तार नहीं जुड़ता।
- source_word: בְמִצְרַיִם וּבַמִּדְבָּר
  choice: मिस्र और निर्जन प्रदेश में
  rationale: מִדְבָּר यहाँ आबादी से दूर उजाड़ अथवा निर्जन भूभाग है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में अर्थ स्पष्ट करता है और केवल रेतीले ‘रेगिस्तान’ तक सीमित नहीं करता।
- source_word: וַיְנַסּוּ אֹתִי
  choice: मुझे परखा
  rationale: נסה का अर्थ यहाँ परमेश्वर को जाँचना या परीक्षा में डालना है; ‘परखा’ संक्षिप्त और स्वाभाविक है।
- source_word: זֶה עֶשֶׂר פְּעָמִים
  choice: इन दस बार
  rationale: זֶה की संकेतात्मक शक्ति रखते हुए ‘इन दस बार’ बार-बार हुई विशिष्ट घटनाओं पर बल देता है।
- source_word: וְלֹא שָׁמְעוּ בְּקוֹלִי
  choice: मेरी बात नहीं मानी
  rationale: שׁמע בקול का मुहावरेदार अर्थ किसी की आवाज़ सुनकर उस पर ध्यान देना अथवा आज्ञा मानना है; ‘मेरी बात नहीं मानी’ हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय प्रथम-पुरुष वाणी
  choice: ‘मेरी महिमा,’ ‘मेरे ... चिन्ह,’ और ‘मेरी बात’ के साथ प्रथम-पुरुष वाणी बनाए रखी गई।
  alternative: ईश्वरीय आत्म-संदर्भ की व्याख्यात्मक वृद्धि करना।
  rationale: इब्रानी पाठ स्वयं परमेश्वर की सीधी वाणी है; बिना अतिरिक्त धर्मवैज्ञानिक व्याख्या के इसे उसी रूप में रखना उचित है।
- issue: הָאֲנָשִׁים का लिंग-सूचक अनुवाद
  choice: सब पुरुष
  alternative: सब लोग
  rationale: शब्द और प्रसंग पुरुषों की ओर संकेत करते हैं; ‘लोग’ करने से स्रोत का लिंग-सूचक पहलू समतल हो जाता।
- issue: विरोधसूचक संबंध
  choice: ‘फिर भी’ द्वारा देखे हुए चिन्हों और परमेश्वर को परखने के बीच निहित विरोध व्यक्त किया गया।
  alternative: साधारण ‘और’ द्वारा केवल समन्वय।
  rationale: यद्यपि स्रोत में अलग विरोधसूचक अव्यय नहीं है, वाक्य का आरोप उन अनुभवों के बावजूद अविश्वास पर केंद्रित है; हिन्दी में ‘फिर भी’ इस निहित संबंध को स्पष्ट और स्वाभाविक करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सहज शैली अपनाई गई है। पद अगले पद में पूरी होने वाली शपथात्मक घोषणा का अधूरा वाक्यांश है, इसलिए अंत में दीर्घ डैश रखा गया है।
