source:
  edition: WLC
  text: אֲנִ֣י יְהוָה֮ דִּבַּרְתִּי֒ אִם לֹ֣א זֹ֣את אֶֽעֱשֶׂ֗ה לְ/כָל הָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את הַ/נּוֹעָדִ֖ים עָלָ֑/י בַּ/מִּדְבָּ֥ר הַ/זֶּ֛ה יִתַּ֖מּוּ וְ/שָׁ֥ם יָמֻֽתוּ־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/035.yaml
  text: 'I[a], Yahweh, have spoken[b]. Surely I will do this to all this evil congregation who have gathered together against me: in this wilderness they will come to an end, and there they will die.'
translation:
  language: hi
  text: '“मैं, याहवे, कह चुका हूँ: मैं निश्चय ही[b] इस सारे दुष्ट समुदाय[a] के साथ ऐसा करूँगा, जो मेरे विरुद्ध इकट्ठा हुआ है। इसी निर्जन प्रदेश में उनका अन्त होगा, और वहीं वे मरेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मण्डली” अथवा “सभा”।
    reason: lexical_alternative
  - marker: b
    text: “निश्चय ही” के लिए प्रयुक्त इब्रानी मुहावरे का शाब्दिक रूप “यदि नहीं” है; यहाँ यह शपथ-सदृश दृढ़ निश्चितता व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: דִּבַּרְתִּי
  choice: कह चुका हूँ
  rationale: पूर्ण हो चुके गम्भीर ईश्वरीय कथन और उसके वर्तमान प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִם לֹא
  choice: निश्चय ही
  rationale: यहाँ यह शाब्दिक शर्त नहीं, बल्कि शपथ-सदृश दृढ़ निश्चय व्यक्त करने वाला इब्रानी मुहावरा है।
- source_word: הָעֵדָה הָרָעָה
  choice: दुष्ट समुदाय
  rationale: עֵדָה इस्राएल के सामूहिक निकाय को और הָרָעָה उसके विद्रोह पर नैतिक निर्णय को व्यक्त करता है।
- source_word: הַנּוֹעָדִים עָלָי
  choice: जो मेरे विरुद्ध इकट्ठा हुआ है
  rationale: समुदाय के एकत्र होने और उसके विरोधी रुख—दोनों को स्पष्ट रखता है; हिन्दी में सामूहिक संज्ञा के साथ एकवचन क्रिया स्वाभाविक है।
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: इसी उजाड़ प्रदेश में
  rationale: מִדְבָּר को वन का अर्थ देने से बचते हुए निर्जन भूभाग का भाव देता है और הַזֶּה के संकेत पर बल बनाए रखता है।
- source_word: יִתַּמּוּ
  choice: उनका अन्त होगा
  rationale: समाप्त हो जाने का अर्थ बनाए रखता है और अगले स्पष्ट मृत्यु-वचन में इसे समय से पहले नहीं मिला देता।
- source_word: וְשָׁם יָמֻתוּ
  choice: और यहीं वे मरेंगे
  rationale: स्थानसूचक שָׁם को बनाए रखते हुए मृत्यु के समानान्तर और निर्णायक कथन को अलग रखता है।
theological_decisions:
- issue: אִם לֹא की शपथ-सदृश अभिव्यक्ति
  choice: 'दृढ़ प्रतिज्ञात्मक कथन: “निश्चय ही”'
  alternative: शाब्दिक किन्तु हिन्दी में भ्रामक “यदि नहीं”
  rationale: सन्दर्भ में वाक्य अनसुलझी शर्त नहीं, बल्कि ईश्वरीय न्याय की सुनिश्चित घोषणा है।
- issue: עֵדָה का सामूहिक पद
  choice: समुदाय
  alternative: मण्डली; सभा
  rationale: यह शब्द पूरे एकत्र जनसमूह को न्याय के अधीन दिखाता है; “समुदाय” आधुनिक पाठक के लिए स्वाभाविक है और बाद की कलीसियाई संस्था का अनावश्यक संकेत नहीं देता।
- issue: יִתַּמּוּ और יָמֻתוּ का सम्बन्ध
  choice: “उनका अन्त होगा” और “वे मरेंगे” को अलग रखा गया
  alternative: दोनों को मिलाकर केवल “वे नष्ट हो जाएँगे”
  rationale: इब्रानी की क्रमिक समानान्तरता और न्याय-वचन की पुनरुक्त दृढ़ता को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। “उजाड़ प्रदेश” भौगोलिक अर्थ को “जंगल” की सम्भावित वन-संबंधी गलतफहमी से बचाता है; प्रत्यक्ष ईश्वरीय वचन की गंभीरता बनाए रखने के लिए वाक्य-रचना औपचारिक किन्तु सहज है।
