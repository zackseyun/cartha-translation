- source_word: וְנָשׁוּבָה
  choice: और ... लौट चलें
  rationale: שוב का समन्वित बहुवचन इच्छार्थक रूप सामूहिक प्रस्ताव को जारी रखता है; ‘लौट चलें’ हिन्दी में उसी आग्रह और वापसी, दोनों को व्यक्त करता है।
- source_word: מִצְרָיְמָה
  choice: मिस्र
  rationale: दिशासूचक प्रत्यय मिस्र की ओर गति बताता है; ‘लौट चलें’ के साथ हिन्दी में ‘मिस्र’ बिना अलग परसर्ग के स्वाभाविक और पर्याप्त है।
