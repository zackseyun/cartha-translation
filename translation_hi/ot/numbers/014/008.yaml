source:
  edition: WLC
  text: אִם חָפֵ֥ץ בָּ֨/נוּ֙ יְהוָ֔ה וְ/הֵבִ֤יא אֹתָ֨/נוּ֙ אֶל הָ/אָ֣רֶץ הַ/זֹּ֔את וּ/נְתָנָ֖/הּ לָ֑/נוּ אֶ֕רֶץ אֲשֶׁר הִ֛וא זָבַ֥ת חָלָ֖ב וּ/דְבָֽשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/008.yaml
  text: If Yahweh delights in us[a], he will bring us into this land and give it to us—a land flowing with milk and honey.
translation:
  language: hi
  text: यदि याहवे हमसे प्रसन्न है[a], तो वह हमें इस देश में ले जाएगा और हमें इसे दे देगा—ऐसा देश जिसमें दूध और मधु की धाराएँ बहती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमसे आनंद पाता है” अथवा “हम पर अनुकूल है।”
    reason: חָפֵץ में प्रसन्नता, आनंद और अनुकूलता से जुड़े अर्थ संभव हैं।
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह शर्त प्रस्तुत करता है; ‘यदि’ हिब्रू की वास्तविक सशर्तता को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: חָפֵץ בָּנוּ
  choice: हमसे प्रसन्न है
  rationale: חפץ प्रसन्नता, आनंद और अनुकूल मनोभाव व्यक्त करता है। ‘हमसे प्रसन्न है’ आधुनिक हिंदी में स्वाभाविक है और इस व्यक्तिगत भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: וְהֵבִיא אֹתָנוּ אֶל הָאָרֶץ הַזֹּאת
  choice: तो वह हमें इस देश में ले जाएगा
  rationale: वाव के साथ पूर्ण क्रिया यहाँ शर्त का भावी परिणाम बताती है। ‘में ले जाएगा’ देश में प्रवेश कराने का प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: וּנְתָנָהּ לָנוּ
  choice: और इसे हमें दे देगा
  rationale: נתן का सीधा अर्थ ‘देना’ है; ‘इसे’ का संकेत पहले बताए गए देश की ओर है।
- source_word: אֶרֶץ אֲשֶׁר הִוא זָבַת חָלָב וּדְבָשׁ
  choice: ऐसा देश जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: यह उर्वरता और प्रचुरता का हिब्रू चित्रात्मक मुहावरा है। हिंदी में ‘धाराएँ बहती हैं’ उसके प्रवाह के बिंब को स्वाभाविक ढंग से सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना, प्रचलित विद्वत्तापूर्ण उच्चारण के निकट हिंदी रूप में प्रस्तुत करता है।
- issue: याहवे की प्रसन्नता और प्रतिज्ञात देश में प्रवेश के बीच सशर्त संबंध
  choice: यदि…तो
  alternative: जब…तब
  rationale: אִם को ‘यदि’ रखने से वक्तव्य की वास्तविक सशर्तता और पाठ में निहित तनाव बना रहता है; इसे निश्चित कालगत कथन में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘दूध और मधु की धाराएँ बहती हैं’ मूल के समृद्धि-सूचक चित्र को सुरक्षित रखता है; ‘यदि…तो’ उसकी सशर्त संरचना को स्पष्ट करता है।
