source:
  edition: WLC
  text: סְלַֽח נָ֗א לַ/עֲוֺ֛ן הָ/עָ֥ם הַ/זֶּ֖ה כְּ/גֹ֣דֶל חַסְדֶּ֑/ךָ וְ/כַ/אֲשֶׁ֤ר נָשָׂ֨אתָה֙ לָ/עָ֣ם הַ/זֶּ֔ה מִ/מִּצְרַ֖יִם וְ/עַד הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/019.yaml
  text: Please forgive the iniquity of this people according to the greatness of your steadfast love[a], just as you have forgiven this people from Egypt until now.
translation:
  language: hi
  text: कृपया इस प्रजा के अधर्म को अपनी अटल करुणा की महानता के अनुसार क्षमा कर, जैसे तू मिस्र से लेकर अब तक इस प्रजा को सहता आया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे तू मिस्र से लेकर अब तक इस प्रजा को क्षमा करता आया है।” इब्रानी क्रिया का अर्थ ‘उठाना/वहन करना’ और कुछ प्रसंगों में ‘क्षमा करना’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סְלַח נָא
  choice: कृपया ... क्षमा कर
  rationale: סלח का आज्ञार्थक रूप और विनय-सूचक נָא मिलकर गंभीर निवेदन व्यक्त करते हैं; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: לַעֲוֺן
  choice: अधर्म को
  rationale: עָוֹן अपराध, दोष या उसके परिणाम का बोध करा सकता है। यहाँ क्षमा का विषय प्रजा का नैतिक अपराध है; ‘अधर्म’ उसके नैतिक भार को बनाए रखता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: עַם एकवचन सामूहिक संज्ञा है। ‘प्रजा’ यहाँ समुदायगत भाव को स्वाभाविक हिन्दी में बनाए रखती है।
- source_word: כְּגֹדֶל חַסְדֶּךָ
  choice: अपनी अटल करुणा की महानता के अनुसार
  rationale: גֹּדֶל का अर्थ ‘महानता’ है और חֶסֶד में स्थायी निष्ठा, दया और वाचा-संबंधी प्रेम का भाव है। ‘अटल करुणा’ इस प्रसंग में प्रेम और दया दोनों के आयामों को व्यक्त करती है।
- source_word: וְכַאֲשֶׁר
  choice: जैसे
  rationale: यह पद परमेश्वर के पहले के व्यवहार को वर्तमान विनती के आधार और तुलना के रूप में प्रस्तुत करता है।
- source_word: נָשָׂאתָה
  choice: सहता आया है
  rationale: נשא का मूल भाव उठाने या वहन करने का है और पाप-संबंधी प्रसंगों में यह क्षमा करना भी व्यक्त कर सकता है। यहाँ सीधा कर्म ‘इस प्रजा’ है, इसलिए ‘सहता आया है’ दीर्घकालीन धैर्यपूर्ण वहन को व्यक्त करता है, जबकि पादटिप्पणी ‘क्षमा करता आया है’ की सम्भावना सुरक्षित रखती है।
- source_word: מִמִּצְרַיִם וְעַד הֵנָּה
  choice: मिस्र से लेकर अब तक
  rationale: यह मिस्र से वर्तमान समय और स्थान तक निरन्तरता दिखाता है; हिन्दी में ‘अब तक’ प्रसंग का कालगत बल सहज रूप से बताता है।
theological_decisions:
- issue: मूसा की विनती में נָשָׂאתָה का अर्थ
  choice: परमेश्वर इस प्रजा को मिस्र से अब तक धैर्यपूर्वक सहता और वहन करता आया है।
  alternative: परमेश्वर इस प्रजा को मिस्र से अब तक क्षमा करता आया है।
  rationale: क्रिया का सीधा कर्म स्वयं प्रजा है, उसका अधर्म नहीं; इसलिए व्यापक ‘सहना/वहन करना’ मुख्य पाठ में उपयुक्त है। फिर भी पाप के प्रसंग में इस क्रिया का अर्थ ‘क्षमा करना’ हो सकता है, अतः उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और प्रार्थनापरक है। परमेश्वर से सीधे संबोधन में एकवचन ‘तू’ बाइबलीय निकटता और मूल इब्रानी के एकवचन को बनाए रखता है।
