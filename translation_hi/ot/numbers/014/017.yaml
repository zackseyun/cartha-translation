source:
  edition: WLC
  text: וְ/עַתָּ֕ה יִגְדַּל נָ֖א כֹּ֣חַ אֲדֹנָ֑/י כַּ/אֲשֶׁ֥ר דִּבַּ֖רְתָּ לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/017.yaml
  text: And now[a], please let the power of the Lord be great, just as you have spoken, saying,
translation:
  language: hi
  text: 'और अब, कृपा करके प्रभु की सामर्थ्य महान हो, जैसा आपने कहा था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और काल/विमर्श-सूचक עַתָּה दोनों को रखते हुए मूसा की विनती के नए चरण को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יִגְדַּל
  choice: महान हो
  rationale: גדל के इच्छार्थक प्रयोग को विनती के रूप में यथासंभव निकटता से रखता है। ‘बढ़े’ से ऐसा भ्रम हो सकता है मानो प्रभु की सामर्थ्य अभी अपर्याप्त हो।
- source_word: נָא
  choice: कृपा करके
  rationale: विनय और अनुरोध का भाव आधुनिक, सम्मानपूर्ण हिंदी में व्यक्त करता है।
- source_word: כֹּחַ
  choice: सामर्थ्य
  rationale: यहाँ परमेश्वर की कार्य करने की शक्ति के लिए ‘सामर्थ्य’ स्वाभाविक और गरिमापूर्ण है; ‘शक्ति’ भी संभव है।
- source_word: אֲדֹנָי
  choice: प्रभु
  rationale: यह אֲדֹנָי उपाधि का अनुवाद है, न कि चतुरक्षरीय दिव्य नाम का; इसलिए ‘प्रभु’ रखा गया है।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसा
  rationale: परमेश्वर की पहले कही हुई बात और वर्तमान विनती के बीच स्पष्ट अनुरूपता व्यक्त करता है।
- source_word: דִּבַּרְתָּ
  choice: आपने कहा था
  rationale: द्वितीय पुरुष एकवचन में परमेश्वर को सीधे संबोधन और पहले कही गई, अब उद्धृत होने वाली बात—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לֵאמֹר
  choice: इसके बाद द्विबिंदु
  rationale: यह उद्धरण आरंभ कराने वाला क्रियारूप है। हिंदी में अगले पद के प्रत्यक्ष कथन को द्विबिंदु से प्रस्तुत करना ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और उसका कार्य सुरक्षित रखता है।
theological_decisions:
- issue: दिव्य उपाधि אֲדֹנָי का अनुवाद
  choice: प्रभु
  alternative: हे प्रभु / परमेश्वर
  rationale: मूल में אֲדֹנָי उपाधि है, YHWH नहीं। ‘प्रभु’ इस भेद को बनाए रखता है; ‘हे’ जोड़ने से मूल के तृतीय-पुरुष वाक्य-विन्यास को प्रत्यक्ष संबोधन में बदलना पड़ता।
- issue: ‘प्रभु की सामर्थ्य महान हो’ का आशय
  choice: मूल की विनती और उसकी खुली अर्थ-छाया को बनाए रखा गया
  alternative: प्रभु अपनी महान सामर्थ्य दिखाएँ
  rationale: वैकल्पिक रूप अधिक सहज है, पर वह सामर्थ्य के ‘महान होने/महान माने जाने’ की अस्पष्टता को केवल उसके प्रदर्शन के अर्थ में सीमित कर देता है।
translation_notes:
  register: आधुनिक मानक हिंदी; प्रार्थनापूर्ण, विनम्र और गरिमापूर्ण शैली। मूल की संरचना और धर्मवैचारिक तनाव को बचाने के लिए ‘सामर्थ्य महान हो’ रखा गया है, यद्यपि यह सामान्य बोलचाल से थोड़ा अधिक औपचारिक है।
