  text: they certainly shall not see the land that I swore to their fathers[b][a], and none of those who despised me shall see it.
translation:
  language: hi
  text: वे उस देश को निश्चय ही नहीं देखेंगे[b], जिसके विषय में मैंने उनके पिताओं[a] से शपथ खाई थी; और मेरा तिरस्कार करनेवालों में से कोई भी उसे नहीं देखेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उनके पिताओं।’ या, ‘उनके पूर्वजों।’
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में शाब्दिक रूप से, ‘यदि वे उस देश को देखें।’ यह शपथ-सूत्र है, जिसका अर्थ प्रबल निषेध है: ‘वे उस देश को निश्चय ही नहीं देखेंगे।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם יִרְאוּ
  choice: निश्चय ही नहीं देखेंगे
  rationale: यहाँ אִם साधारण शर्त नहीं, बल्कि शपथ-सूत्र में प्रबल निषेध व्यक्त करता है; इसलिए अर्थ को स्वाभाविक हिन्दी में स्पष्ट किया गया है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ प्रतिज्ञा किए हुए विशिष्ट देश का है; ‘उस देश’ हिन्दी में निश्चित संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: נִשְׁבַּעְתִּי
  choice: देने की शपथ मैंने ... से खाई थी
  rationale: क्रिया शपथ खाने का अर्थ देती है। ‘देने की’ संदर्भगत आशय को स्पष्ट करती है, क्योंकि शपथ पूर्वजों के साथ किए गए देश-संबंधी वचन की है।
- source_word: לַאֲבֹתָם
  choice: उनके पूर्वजों
  rationale: אָבוֹת का शाब्दिक अर्थ ‘पिताओं’ है, पर यहाँ वह इस्राएल के पुरखों/पूर्वजों का द्योतक है; आधुनिक हिन्दी में ‘पूर्वजों’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: מְנַאֲצַי
  choice: जिन्होंने मेरा तिरस्कार किया है
  rationale: נאץ परमेश्वर को तुच्छ जानने या अवमानना करने का प्रबल भाव रखता है; ‘तिरस्कार’ उस गंभीरता को बनाए रखता है।
- source_word: לֹא יִרְאוּהָ
  choice: कोई भी उसे नहीं देखेगा
  rationale: स्त्रीलिंग प्रत्यय का संबंध ‘देश’ से है। हिन्दी में ‘उसे’ द्वारा संदर्भ स्पष्ट रहता है और इब्रानी की पुनरुक्ति भी सुरक्षित रहती है।
theological_decisions:
- issue: आरंभिक शपथ-सूत्र का बल
  choice: प्रबल निषेध के रूप में ‘निश्चय ही नहीं देखेंगे’
  alternative: शाब्दिक रूप से ‘यदि वे उस देश को देखें’
  rationale: इब्रानी शपथ-विधान में אִם यहाँ निहित शाप के साथ दृढ़ निषेध है। इसे साधारण शर्त के रूप में रखने से न्यायादेश का आशय अस्पष्ट हो जाएगा।
- issue: אָבוֹת का अनुवाद
  choice: मुख्य पाठ में ‘पूर्वजों’
  alternative: ‘पिताओं’ या ‘पुरखों’
  rationale: यह शब्द पितृपुरुषों को इंगित करता है। ‘पूर्वज’ वर्तमान मानक हिन्दी में अर्थ को बिना किसी अतिरिक्त सांप्रदायिक व्याख्या के स्पष्ट करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: देश देने का आशय
  choice: ‘जिसे देने की शपथ’
  alternative: अधिक शाब्दिक ‘जिसके विषय में मैंने शपथ खाई’
  rationale: इब्रानी में देने की क्रिया स्पष्ट रूप से नहीं है, पर निकटवर्ती वाचा-संदर्भ में शपथ का आशय देश देना है। अर्थ-स्पष्टता के लिए इसे मुख्य पाठ में व्यक्त किया गया और पादटिप्पणी में शाब्दिक रूप सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। न्यायादेश की गंभीरता के लिए ‘निश्चय ही नहीं’ और ‘तिरस्कार’ चुने गए हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
