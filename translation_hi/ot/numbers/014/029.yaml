  text: בַּ/מִּדְבָּ֣ר הַ֠/זֶּה יִפְּל֨וּ פִגְרֵי/כֶ֜ם וְ/כָל פְּקֻדֵי/כֶם֙ לְ/כָל מִסְפַּרְ/כֶ֔ם מִ/בֶּ֛ן עֶשְׂרִ֥ים שָׁנָ֖ה וָ/מָ֑עְלָ/ה אֲשֶׁ֥ר הֲלִֽינֹתֶ֖ם עָלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/029.yaml
  text: In this wilderness your dead bodies will fall[a], all of you who were counted according to your whole number, from twenty years old and upward[c][b], who have grumbled against me.
translation:
  language: hi
  text: इसी निर्जन प्रदेश में तुम सबके शव गिरेंगे[a]—तुम सब जो अपनी पूरी गिनती के अनुसार गिने गए थे, बीस वर्ष और उससे अधिक आयु के, और जिन्होंने मेरे विरुद्ध बड़बड़ाया है[c][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी लाशें गिरेंगी।’ इब्रानी की भाषा ठोस और कठोर है, जो इसी निर्जन प्रदेश में होने वाली शारीरिक मृत्यु पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: ‘गिने गए थे’ से आशय जनगणना अथवा सैनिक गणना में दर्ज किए गए लोगों से है।
    reason: cultural_note
  - marker: c
    text: या ‘मेरे विरुद्ध कुड़कुड़ाए हो।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: इसी निर्जन प्रदेश में
  rationale: מִדְבָּר ऐसे उजाड़ या निर्जन भूभाग को दर्शाता है जो अनिवार्य रूप से रेतीला मरुस्थल नहीं होता। ‘निर्जन प्रदेश’ अर्थ को स्पष्ट रखते हुए ‘जंगल’ के वन-संबंधी भ्रामक अर्थ से बचता है।
- source_word: יִפְּלוּ פִגְרֵיכֶם
  choice: तुम्हारे शव गिरेंगे
  rationale: יִפְּלוּ का ठोस बिंब ‘गिरेंगे’ और פִגְרֵיכֶם का अर्थ ‘तुम्हारे शव’ है। इसे केवल ‘तुम मर जाओगे’ करने के बजाय मूल की कठोर शारीरिक छवि सुरक्षित रखी गई है।
- source_word: וְכָל פְּקֻדֵיכֶם לְכָל מִסְפַּרְכֶם
  choice: तुम सबके सब, जो गिने गए थे, अर्थात तुम्हारी पूरी गिनती में
  rationale: פְּקֻדֵיכֶם जनगणना अथवा सैनिक गणना में दर्ज किए गए लोगों को सूचित करता है, और לְכָל מִסְפַּרְכֶם उनकी पूरी गिनी हुई संख्या पर बल देता है। हिंदी में पुनरुक्ति को अर्थपूर्ण और स्वाभाविक रखा गया है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह जनगणना में आयु-सीमा बताने वाला सामान्य इब्रानी सूत्र है। चुना हुआ रूप आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר הֲלִינֹתֶם עָלָי
  choice: जो मेरे विरुद्ध बड़बड़ाते रहे
  rationale: इस प्रसंग में לון का हिफ़ील रूप असंतोषपूर्ण, विद्रोही शिकायत को व्यक्त करता है। ‘बड़बड़ाते रहे’ बार-बार किए गए विरोधपूर्ण असंतोष को सहज हिंदी में प्रकट करता है।
theological_decisions:
- issue: दंड की शारीरिक और ठोस भाषा
  choice: ‘तुम्हारे शव गिरेंगे’ के मूल बिंब को बनाए रखा गया।
  alternative: ‘तुम इस निर्जन प्रदेश में मर जाओगे।’
  rationale: इब्रानी केवल मृत्यु की सूचना नहीं देता, बल्कि निर्जन प्रदेश में पड़े शरीरों की कठोर छवि के द्वारा न्याय की गंभीरता पर बल देता है।
- issue: दंड के अंतर्गत आने वाले लोगों की सीमा
  choice: पूरी गिनती में बीस वर्ष या उससे अधिक आयु के, परमेश्वर के विरुद्ध बड़बड़ाने वाले गिने गए लोगों के रूप में वाक्य को रखा गया।
  alternative: पूरी मंडली को आयु अथवा जनगणना के भेद के बिना संबोधित मानना।
  rationale: मूल पाठ जनगणना, कुल संख्या और बीस वर्ष की आयु-सीमा को स्पष्ट रूप से जोड़ता है; अनुवाद इसी सीमांकन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, स्पष्ट किंतु गरिमापूर्ण रखी गई है। ‘निर्जन प्रदेश’ भौगोलिक अर्थ को ‘जंगल’ की अपेक्षा अधिक ठीक व्यक्त करता है; ‘शव गिरेंगे’ जानबूझकर कुछ कठोर रखा गया है ताकि मूल इब्रानी की न्याय-संबंधी तीव्रता मंद न पड़े।
