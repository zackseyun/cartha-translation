source:
  edition: WLC
  text: אִם אַתֶּם֙ תָּבֹ֣אוּ אֶל הָ/אָ֔רֶץ אֲשֶׁ֤ר נָשָׂ֨אתִי֙ אֶת יָדִ֔/י לְ/שַׁכֵּ֥ן אֶתְ/כֶ֖ם בָּ֑/הּ כִּ֚י אִם כָּלֵ֣ב בֶּן יְפֻנֶּ֔ה וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/030.yaml
  text: Surely you shall not come into the land in which I raised my hand to settle you[a], except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: hi
  text: निश्चय ही तुम उस देश में प्रवेश नहीं करोगे, जिसमें तुम्हें बसाने के लिए मैंने अपना हाथ उठाया था[a]—सिवाय यपुन्ने के पुत्र कालेब और नून के पुत्र यहोशू के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वह देश जिसमें तुम्हें उसमें बसाने के लिए मैंने अपना हाथ उठाया था।” हाथ उठाना शपथ लेने का संकेत था; अर्थात परमेश्वर ने उन्हें उस देश में बसाने की शपथ ली थी।
    reason: cultural_note
lexical_decisions:
- source_word: אִם אַתֶּם תָּבֹאוּ
  choice: निश्चय ही तुम ... प्रवेश नहीं करोगे
  rationale: ईश्वरीय शपथ-सदृश घोषणा के आरंभ में אִם प्रबल निषेध व्यक्त करता है; साधारण शर्तसूचक ‘यदि’ यहाँ भ्रामक होगी।
- source_word: אֶל הָאָרֶץ
  choice: उस देश में
  rationale: בוא के साथ क्षेत्र में भीतर जाने का भाव है; आधुनिक हिन्दी में ‘देश में प्रवेश करना’ स्वाभाविक है।
- source_word: אֲשֶׁר נָשָׂאתִי אֶת יָדִי
  choice: जिसमें ... मैंने अपना हाथ उठाया था
  rationale: मूल इब्रानी में शपथ के समय हाथ उठाने का दृश्यात्मक मुहावरा है; मुख्य पाठ में इस छवि को सुरक्षित रखा गया है और पाद-टिप्पणी उसका सांस्कृतिक अर्थ स्पष्ट करती है।
- source_word: לְשַׁכֵּן אֶתְכֶם בָּהּ
  choice: जिसमें तुम्हें बसाने के लिए
  rationale: हिफ़ील रूप किसी को बसाने अथवा निवास कराने का कारणवाचक अर्थ देता है; ‘बसाने’ से यह अर्थ संक्षेप और सहजता से व्यक्त होता है।
- source_word: כִּי אִם
  choice: सिवाय
  rationale: पूर्ववर्ती निषेध के बाद यह पदबंध केवल दो अपवादों का परिचय देता है।
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: यपुन्ने के पुत्र कालेब
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप और इब्रानी पितृनाम-संबंध को रखा गया है।
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: और नून के पुत्र यहोशू
  rationale: संयोजक तथा पितृनाम-संबंध को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: शपथसूचक मुहावरे और ईश्वरीय न्याय की प्रबलता
  choice: निश्चय ही तुम ... प्रवेश नहीं करोगे
  alternative: यदि तुम उस देश में प्रवेश करोगे...
  rationale: यह पद यहोवा की न्यायिक घोषणा का अंश है। आरंभिक אִם को प्रबल निषेध के रूप में प्रस्तुत करने से शपथ का बल सुरक्षित रहता है और वाक्य भ्रामक अधूरी शर्त नहीं बनता।
- issue: उठे हुए हाथ की छवि
  choice: मैंने अपना हाथ उठाया था
  alternative: मैंने शपथ खाई थी
  rationale: शाब्दिक सांस्कृतिक छवि को मुख्य पाठ में रखना मूल की अभिव्यक्ति को सुरक्षित करता है; पाद-टिप्पणी बताती है कि यह शपथ का संकेत है, बिना अर्थ को किसी विशिष्ट धर्मवैधानिक व्याख्या तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘प्रवेश नहीं करोगे’ न्यायिक घोषणा का बल व्यक्त करता है, जबकि ‘अपना हाथ उठाया’ मूल इब्रानी की ठोस सांस्कृतिक छवि सुरक्षित रखता है।
