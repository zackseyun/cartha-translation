id: NUM.14.42
reference: Numbers 14:42
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַֽל תַּעֲל֔וּ כִּ֛י אֵ֥ין יְהוָ֖ה בְּ/קִרְבְּ/כֶ֑ם וְ/לֹא֙ תִּנָּ֣גְפ֔וּ לִ/פְנֵ֖י אֹיְבֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/042.yaml
  text: Do not go up[a], for Yahweh is not among you[b], so that you may not be struck down before your enemies.
translation:
  language: hi
  text: ऊपर मत चढ़ो, क्योंकि याहवे तुम्हारे बीच में नहीं है; नहीं तो तुम अपने शत्रुओं के सामने परास्त हो जाओगे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मारे जाओगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תַּעֲלוּ
  choice: ऊपर मत चढ़ो
  rationale: निषेधात्मक אַל और עלה के भौगोलिक-सैन्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; ‘ऊपर’ मूल पाठ की चढ़ने की दिशा को बनाए रखता है।
- source_word: כִּי אֵין יְהוָה בְּקִרְבְּכֶם
  choice: क्योंकि याहवे तुम्हारे बीच में नहीं है
  rationale: כִּי कारण बताता है, אֵין उपस्थिति का निषेध करता है, और בְּקֶרֶב का शाब्दिक-सामुदायिक भाव ‘बीच में’ से सुरक्षित रहता है। יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְלֹא תִּנָּגְפוּ
  choice: नहीं तो तुम ... मारे जाओगे
  rationale: संदर्भ में וְלֹא चेतावनी के नकारात्मक परिणाम को प्रस्तुत करता है। נגף का निफ़अल युद्ध में मारे जाने या पराजित होने, दोनों का संकेत दे सकता है; मुख्य पाठ में सशक्त निष्क्रिय अर्थ रखा गया है।
- source_word: לִפְנֵי אֹיְבֵיכֶם
  choice: अपने शत्रुओं के सामने
  rationale: युद्ध-संदर्भ में לִפְנֵי का सामान्य अर्थ ‘के सामने’ और אֹיְבֵיכֶם का अर्थ ‘तुम्हारे शत्रु’ है; हिन्दी में संबंध स्पष्ट करने के लिए ‘अपने’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित करता है।
- issue: בְּקִרְבְּכֶם में ईश्वरीय उपस्थिति
  choice: तुम्हारे बीच में नहीं है
  alternative: तुम्हारे साथ नहीं है
  rationale: ‘बीच में’ समुदाय के मध्य उपस्थिति के स्थानिक भाव को बनाए रखता है और ‘साथ’ कहकर कथन का अनावश्यक विस्तार नहीं करता।
- issue: תִּנָּגְפוּ का युद्ध-संबंधी परिणाम
  choice: मारे जाओगे
  alternative: पराजित हो जाओगे
  rationale: क्रिया प्रहार खाकर गिरने या युद्ध में हारने की अर्थ-सीमा रखती है। मुख्य पाठ में अधिक ठोस निष्क्रिय अर्थ चुना गया है और व्यापक सैन्य अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘ऊपर मत चढ़ो’ मूल की भौगोलिक छवि को बनाए रखता है, जबकि ‘नहीं तो’ हिन्दी में चेतावनी और उसके संभावित परिणाम का स्वाभाविक संबंध व्यक्त करता है।
