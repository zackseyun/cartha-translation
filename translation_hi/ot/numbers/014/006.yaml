  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘छानबीन’ सामान्य पाठक के लिए बोधगम्य है और पारंपरिक किंतु आज कम स्वाभाविक ‘भेद लेना’ से बचती है। विरामचिह्नों द्वारा संबंधवाचक उपवाक्य स्पष्ट किया गया है।
