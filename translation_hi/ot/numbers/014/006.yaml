base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/006.yaml
  text: And Joshua son of Nun and Caleb son of Jephunneh[a], from those who had spied out the land[b], tore their clothes.
translation:
  language: hi
  text: और नून के पुत्र यहोशू और यपुन्ने के पुत्र कालेब, जो देश की छानबीन करनेवालों में से थे, ने अपने वस्त्र फाड़े[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अपने वस्त्र फाड़ना शोक, भयावह स्थिति से स्तब्ध होने या गहरी व्यथा प्रकट करने का प्रचलित संकेत था।
    reason: cultural_note
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: तब ... यहोशू
  rationale: वाक्य के आरंभ का וְ कथा के क्रम को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ प्रसंगानुकूल और स्वाभाविक है। नाम का प्रचलित हिन्दी रूप ‘यहोशू’ रखा गया है।
- source_word: בִּן נוּן
  choice: नून के पुत्र
  rationale: पितृनामसूचक इब्रानी रचना को स्पष्ट और गरिमापूर्ण हिन्दी में औपचारिक रूप से व्यक्त किया गया है।
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: और यपुन्ने के पुत्र कालेब
  rationale: संयोजक दोनों व्यक्तियों को संयुक्त कर्ता बनाता है; नामों के प्रचलित हिन्दी रूप रखे गए हैं।
- source_word: מִן הַתָּרִים אֶת הָאָרֶץ
  choice: जो देश की छानबीन करनेवालों में से थे
  rationale: מִן को अंशवाचक मानकर यह स्पष्ट किया गया है कि यहोशू और कालेब खोजी दल के सदस्य थे। תָּרִים की जारी/भूमिकात्मक क्रिया को ‘छानबीन करनेवाले’ स्वाभाविक रूप से व्यक्त करता है, और הָאָרֶץ को बिना अतिरिक्त पहचान जोड़े ‘देश’ कहा गया है।
- source_word: קָרְעוּ בִּגְדֵיהֶם
  choice: अपने वस्त्र फाड़े
  rationale: קָרַע का सीधा अर्थ ‘फाड़ना’ है। हिन्दी में संयुक्त कर्ता के साथ स्वामित्व स्वाभाविक बनाने के लिए ‘अपने’ और गरिमापूर्ण किंतु सुबोध ‘वस्त्र’ चुना गया है।
