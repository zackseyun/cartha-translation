  text: עַד מָתַ֗י לָ/עֵדָ֤ה הָֽ/רָעָה֙ הַ/זֹּ֔את אֲשֶׁ֛ר הֵ֥מָּה מַלִּינִ֖ים עָלָ֑/י אֶת תְּלֻנּ֞וֹת בְּנֵ֣י יִשְׂרָאֵ֗ל אֲשֶׁ֨ר הֵ֧מָּה מַלִּינִ֛ים עָלַ֖/י שָׁמָֽעְתִּי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/027.yaml
  text: How long shall this evil congregation grumble against me? I have heard the complaints of the sons of Israel[b][a], which they are grumbling against me.
translation:
  language: hi
  text: “इस दुष्ट समुदाय को मैं कब तक सहूँ, जो मेरे विरुद्ध कुड़कुड़ाता है? इस्राएल के पुत्रों की शिकायतें, जो वे मेरे विरुद्ध करते हैं, मैंने सुनी हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַד מָתַי
  choice: कब तक
  rationale: यह स्वाभाविक हिन्दी कालवाचक प्रश्न है और परमेश्वर की खिन्नता तथा धैर्य की सीमा का भाव बनाए रखता है।
- source_word: לָעֵדָה
  choice: समुदाय
  rationale: עֵדָה यहाँ एक साथ पहचाने जाने वाले इस्राएली जनसमूह को दर्शाता है। ‘समुदाय’ आधुनिक, सहज और सामूहिक अर्थ के अनुकूल है।
- source_word: הָרָעָה הַזֹּאת
  choice: इस दुष्ट
  rationale: רָעָה का प्रयोग यहाँ नैतिक मूल्यांकन के रूप में हुआ है; ‘दुष्ट’ उसकी कठोरता को बनाए रखता है।
- source_word: מַלִּינִים
  choice: कुड़कुड़ाता रहता है
  rationale: मरुभूमि के वृत्तांतों में यह क्रिया विद्रोही और बार-बार की जाने वाली शिकायत को व्यक्त करती है। ‘रहता है’ निरंतरता को स्पष्ट करता है।
- source_word: עָלַי
  choice: मेरे विरुद्ध
  rationale: संदर्भ में शिकायत परमेश्वर के विरोध में निर्देशित है, इसलिए ‘मेरे विरुद्ध’ प्रतिकूल भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: תְּלֻנּוֹת
  choice: शिकायतें
  rationale: यह संज्ञा व्यक्त किए गए असंतोष या आरोपों को दर्शाती है; ‘शिकायतें’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह रूप हिब्रू की पुल्लिंग बहुवचन संरचना को औपचारिक रूप से बनाए रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: שָׁמָעְתִּי
  choice: मैंने सुन ली हैं
  rationale: हिब्रू पूर्ण क्रिया को ऐसे पूर्ण कार्य के रूप में प्रस्तुत किया गया है जिसका वर्तमान परिणाम है—परमेश्वर उनकी शिकायतों से पूरी तरह अवगत है।
theological_decisions:
- issue: עַד מָתַי के बाद निहित क्रिया
  choice: ‘सहता रहूँ’ को स्पष्ट किया गया
  alternative: ‘यह दुष्ट समुदाय कब तक मेरे विरुद्ध कुड़कुड़ाता रहेगा?’
  rationale: हिब्रू में प्रश्न के आरंभ में क्रिया स्पष्ट रूप से नहीं दी गई है। प्रसंग और प्रचलित वाक्य-समझ ‘मैं कब तक सहूँ?’ की ओर संकेत करते हैं, पर पाठ की संक्षिप्तता के कारण दूसरा अर्थ भी संभव है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल की सन्तान
  rationale: मुख्य पाठ में हिब्रू की पुल्लिंग बहुवचन अभिव्यक्ति सुरक्षित रखी गई है, जबकि सामूहिक और अधिक मुहावरेदार विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘कुड़कुड़ाना’ मरुभूमि-वृत्तांत की बार-बार और विरोधपूर्वक की गई शिकायत का भाव व्यक्त करता है।
