id: NUM.14.9
reference: Numbers 14:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֣ךְ בַּֽ/יהוָה֮ אַל תִּמְרֹדוּ֒ וְ/אַתֶּ֗ם אַל תִּֽירְאוּ֙ אֶת עַ֣ם הָ/אָ֔רֶץ כִּ֥י לַחְמֵ֖/נוּ הֵ֑ם סָ֣ר צִלָּ֧/ם מֵ/עֲלֵי/הֶ֛ם וַֽ/יהוָ֥ה אִתָּ֖/נוּ אַל תִּירָאֻֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/009.yaml
  text: Only[a], do not rebel against Yahweh. And do not fear the people of the land, for they are our bread; their protection has departed from over them, and Yahweh is with us[b]. Do not fear them.
translation:
  language: hi
  text: केवल यहोवा के विरुद्ध विद्रोह मत करो। और उस देश के लोगों से मत डरो, क्योंकि वे हमारी रोटी हैं[a]। उनकी छाया उन पर से हट गई है[b], और यहोवा हमारे साथ है। उनसे मत डरो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वे हमारी रोटी हैं”; अर्थात वे आसानी से हमारे वश में आ जाएँगे। इसका अनुवाद “वे हमारा भोजन हैं” भी किया जा सकता है।
    reason: रूपक का आशय और शाब्दिक वैकल्पिक अभिव्यक्ति स्पष्ट करना।
  - marker: b
    text: “छाया” यहाँ आश्रय या सुरक्षा का रूपक है; अर्थात उनकी सुरक्षा उनसे हट गई है।
    reason: मूल रूपक का प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यह शब्द exhortation पर प्रबल सीमित बल देता है—मुख्य निषेध यही है कि वे यहोवा के विरुद्ध विद्रोह न करें।
- source_word: בַּיהוָה אַל תִּמְרֹדוּ
  choice: यहोवा के विरुद्ध विद्रोह मत करो
  rationale: מָרַד के साथ בְּ उस व्यक्ति को दर्शाता है जिसके विरुद्ध विद्रोह किया जाता है; परमेश्वर का निज नाम यहाँ ‘यहोवा’ रखा गया है।
- source_word: עַם הָאָרֶץ
  choice: उस देश के लोगों
  rationale: इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप, जो प्रसंग में पहले उल्लिखित देश को इंगित करता है।
- source_word: כִּי לַחְמֵנוּ הֵם
  choice: क्योंकि वे हमारी रोटी हैं
  rationale: मूल की संक्षिप्त और सजीव विजय-रूपक भाषा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
- source_word: סָר צִלָּם מֵעֲלֵיהֶם
  choice: उनकी छाया उन पर से हट गई है
  rationale: ‘छाया’ के मूल रूपक को मुख्य पाठ में रखा गया है; यहाँ उसका आशय आश्रय या सुरक्षा से है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: וַיהוָה אִתָּנוּ
  choice: और यहोवा हमारे साथ है
  rationale: सरल waw को ‘और’ से व्यक्त किया गया है और वाचा-संबंधी उपस्थिति के कथन को बिना अतिरिक्त व्याख्या के रखा गया है।
- source_word: אַל תִּירָאוּ / אַל תִּירָאֻם
  choice: मत डरो / उनसे मत डरो
  rationale: शत्रु के सामने भय का सीधा अर्थ है; पद के अंत में दोहराए गए निषेध को यथावत सुरक्षित रखा गया है।
theological_decisions:
- issue: כִּי לַחְמֵנוּ הֵם में विजय का रूपक
  choice: मुख्य पाठ में ‘वे हमारी रोटी हैं’
  alternative: ‘वे हमारा भोजन हैं’ अथवा ‘हम उन्हें निगल जाएँगे’
  rationale: मूल पाठ विजय की निश्चितता को रूपक और जानबूझकर संक्षिप्त भाषा में कहता है। अधिक स्पष्ट विकल्प अर्थ खोलते हैं, पर मूल की साहित्यिक तीव्रता घटाते हैं।
- issue: צִלָּם का रूपक
  choice: मुख्य पाठ में ‘उनकी छाया’
  alternative: ‘उनकी सुरक्षा’ अथवा ‘उनका आश्रय’
  rationale: ‘छाया’ प्राचीन निकट-पूर्वी और बाइबलीय भाषा में संरक्षण का रूपक हो सकती है। मूल छवि को सुरक्षित रखकर उसका संभावित आशय पादटिप्पणी में दिया गया है, ताकि किसी विशिष्ट संरक्षक की पहचान पाठ में न जोड़ी जाए।
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में परमेश्वर का निज वाचा-नाम है; ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना हिन्दी पाठक के लिए परिचित रूप में प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सीधा और सार्वजनिक पाठ के अनुकूल रूप। आज्ञार्थक पुनरावृत्ति तथा ‘रोटी’ और ‘छाया’ की मूल रूपकात्मक तीव्रता सुरक्षित रखी गई है।
