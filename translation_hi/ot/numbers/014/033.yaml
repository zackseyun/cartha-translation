source:
  edition: WLC
  text: וּ֠/בְנֵי/כֶם יִהְי֨וּ רֹעִ֤ים בַּ/מִּדְבָּר֙ אַרְבָּעִ֣ים שָׁנָ֔ה וְ/נָשְׂא֖וּ אֶת זְנוּתֵי/כֶ֑ם עַד תֹּ֥ם פִּגְרֵי/כֶ֖ם בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/033.yaml
  text: And your sons will be shepherds in the wilderness for forty years, and they will bear your acts of sexual unfaithfulness until your dead bodies are finished off in the wilderness.
translation:
  language: hi
  text: और तुम्हारे बेटे चालीस वर्ष तक वीराने में चरवाहे रहेंगे[a], और तुम्हारे व्यभिचार का भार उठाएँगे[b], जब तक वीराने में तुम्हारे शवों का अंत न हो जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वीराने में भटकते फिरेंगे।” हिब्रू शब्द मूलतः चरवाही करने या पशु चराने से संबंधित है, लेकिन कुछ व्याख्याकार यहाँ भटकने की अवस्था पर बल देते हैं।
    reason: lexical_alternative
  - marker: b
    text: “व्यभिचार” के लिए प्रयुक्त हिब्रू शब्द यौन अनैतिकता को दर्शाता है; यहाँ यह यौन रूपक के द्वारा परमेश्वर के प्रति तुम्हारी बेवफाई को भी व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: या “जब तक वीराने में तुम्हारे शव पूरी तरह समाप्त न हो जाएँ।”
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵיכֶם
  choice: और तुम्हारे बेटे
  rationale: בנים का सामान्य पुल्लिंग बहुवचन अर्थ ‘बेटे’ है; संदर्भ इसे अनिवार्य रूप से व्यापक ‘सन्तान’ नहीं बनाता।
- source_word: רֹעִים
  choice: चरवाहे बने रहेंगे
  rationale: यह रूप רעה से है और मूलतः चरवाही करनेवालों को दर्शाता है। ‘भटकते फिरेंगे’ प्रसंगगत परिणाम बताता है, पर मूल शब्द की चरवाही-संबंधी छवि मुख्य पाठ में रखी गई है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन अथवा कम आबाद चरागाही क्षेत्र को सूचित कर सकता है; ‘वीराना’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है और केवल रेतीले मरुस्थल तक सीमित नहीं करता।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: अवधि का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וְנָשְׂאוּ
  choice: और ... का भार उठाएँगे
  rationale: נשא में उठाने या ढोने का मूल भाव है और यहाँ माता-पिता की बेवफाई के परिणाम सहने का अर्थ भी निहित है; ‘भार उठाएँगे’ दोनों को बनाए रखता है।
- source_word: אֶת זְנוּתֵיכֶם
  choice: तुम्हारे व्यभिचार का
  rationale: זְנוּת यौन अनैतिकता की तीखी छवि के द्वारा वाचा की बेवफाई व्यक्त करता है। ‘व्यभिचार’ हिन्दी में उस रूपक की धार बनाए रखता है; पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: עַד תֹּם פִּגְרֵיכֶם
  choice: जब तक तुम्हारे शव ... नष्ट न हो जाएँ
  rationale: תֹּם पूर्णतः समाप्त होने और פגר मृत शरीर या शव को दर्शाता है। यह हिन्दी वाक्य उस दोषी पीढ़ी के मरकर समाप्त हो जाने को गंभीर पर स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: זְנוּתֵיכֶם को शाब्दिक यौन आचरण मानना या वाचा-विरोधी बेवफाई का रूपक
  choice: मुख्य पाठ में ‘तुम्हारे व्यभिचार’ रखा गया है, और पादटिप्पणी में इसे परमेश्वर के प्रति बेवफाई की यौन-रूपकात्मक भाषा बताया गया है।
  alternative: तुम्हारी बेवफाई
  rationale: प्रसंग इस्राएल के विद्रोह का है, इसलिए केवल वास्तविक यौन पाप अर्थ को संकरा कर देगा; पर केवल ‘बेवफाई’ कहने से मूल की तीखी यौन छवि मिट जाएगी।
- issue: רֹעִים का अर्थ चरवाही है या भटकना
  choice: मुख्य पाठ में ‘चरवाहे बने रहेंगे’ रखा गया है।
  alternative: भटकते फिरेंगे
  rationale: हिब्रू शब्द प्रत्यक्षतः चरवाही से जुड़ा है। चालीस वर्षों का भटकाव संदर्भ में निहित है, इसलिए वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
- issue: बेटों द्वारा माता-पिता के व्यभिचार का भार उठाना
  choice: स्रोत की पीढ़ीगत न्याय-संबंधी तनावपूर्ण भाषा को ‘भार उठाएँगे’ के रूप में बनाए रखा गया है।
  alternative: तुम्हारी बेवफाई के परिणाम भुगतेंगे
  rationale: विस्तृत विकल्प अर्थ स्पष्ट करता, पर נשא की वहन करने की छवि को समतल कर देता। मुख्य पाठ जानबूझकर यह नहीं बताता कि वे दोष, दंड या परिणाम में से किस अर्थ में ‘भार’ उठाते हैं।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वीराना’, ‘चरवाहे’ और ‘शव’ मूल की ठोस छवियों को बनाए रखते हैं। ‘व्यभिचार’ तीखा है, पर זְנוּת की यौन-रूपकात्मक शक्ति को ‘बेवफाई’ की अपेक्षा अधिक ठीक से सुरक्षित करता है; पादटिप्पणी गलत रूप से केवल शाब्दिक यौन अर्थ लेने से बचाती है।
