base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/038.yaml
  text: But Joshua son of Nun and Caleb son of Jephunneh remained alive from among those men who had gone to spy out the land[a].
translation:
  language: hi
  text: परन्तु नून का पुत्र यहोशू और यपुन्ने का पुत्र कालेब उन पुरुषों में से जीवित बचे, जो उस देश की टोह लेने गए थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस देश का पता लगाना” अथवा “उस देश की जाँच-पड़ताल करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וִיהוֹשֻׁעַ
  choice: परन्तु ... यहोशू
  rationale: वाव को पिछले पद में अन्य भेदियों की मृत्यु के विपरीत परिणाम दिखाने के लिए ‘परन्तु’ किया गया है; नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: בִּן נוּן
  choice: नून का पुत्र
  rationale: हिब्रू वंश-संबंधी रचना का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: וְכָלֵב בֶּן יְפֻנֶּה
  choice: और यपुन्ने का पुत्र कालेब
  rationale: संयोजक दूसरे जीवित बचे व्यक्ति को पहले से जोड़ता है; नामों के प्रचलित हिन्दी रूप और पुत्र-संबंध को बनाए रखा गया है।
- source_word: חָיוּ
  choice: जीवित बचे
  rationale: यहाँ क्रिया केवल जीने के बजाय दूसरों की मृत्यु के विपरीत इन दोनों के जीवित रह जाने को व्यक्त करती है।
- source_word: מִן הָאֲנָשִׁים הָהֵם
  choice: उन पुरुषों में से
  rationale: מִן पूरे समूह के भीतर से इन दो अपवादों को अलग दर्शाता है; ‘पुरुषों’ से भेजे गए पुरुष भेदियों का विशिष्ट संदर्भ बना रहता है।
- source_word: הַהֹלְכִים
  choice: जो ... गए थे
  rationale: कर्तृवाचक कृदन्त को पिछली पूरी हो चुकी यात्रा का वर्णन करने वाले स्वाभाविक हिन्दी संबंधवाचक उपवाक्य के रूप में प्रस्तुत किया गया है।
- source_word: לָתוּר אֶת הָאָרֶץ
  choice: उस देश का भेद लेने
  rationale: תור यहाँ कनान की टोह लेने के अभियान को सूचित करता है। ‘भेद लेने’ संदर्भानुकूल है, जबकि ‘पता लगाने’ और ‘जाँच-पड़ताल करने’ जैसे विकल्प पादटिप्पणी में दिए गए हैं।
