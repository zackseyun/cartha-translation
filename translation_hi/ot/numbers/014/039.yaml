  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामुदायिक संदर्भ में स्वाभाविक। ‘इस्राएल के पुत्रों’ जैसी अधिक शब्दशः अभिव्यक्ति के बजाय आशयगत जातीय पद ‘इस्राएल के सभी लोगों’ का प्रयोग किया गया है।
