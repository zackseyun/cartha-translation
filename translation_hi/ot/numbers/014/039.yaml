  yaml_path: translation/ot/numbers/014/039.yaml
  text: Moses spoke these words to all the sons of Israel[a], and the people mourned greatly.
translation:
  language: hi
  text: मूसा ने ये बातें इस्राएल के सभी लोगों से कहीं, और लोगों ने बहुत शोक मनाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहीं
  rationale: यहाँ क्रिया मूसा द्वारा परमेश्वर के पिछले न्याय-वचन लोगों तक पहुँचाने को व्यक्त करती है। हिंदी में बहुवचन ‘बातें’ के साथ ‘कहीं’ स्वाभाविक और सीधा है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים का अर्थ ‘शब्द’, ‘बातें’ या ‘विषय’ हो सकता है। यहाँ पहले कही गई घोषणा के लिए ‘ये बातें’ निकट और स्वाभाविक हिंदी है।
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी लोगों से
  rationale: בְּנֵי יִשְׂרָאֵל इस समुदाय का प्रचलित जातीय-सामुदायिक नाम है। संदर्भ में पूरा समुदाय अभिप्रेत है; ‘इस्राएल के सभी लोगों’ से इसे स्पष्ट, समावेशी और आधुनिक हिंदी में व्यक्त किया गया है।
- source_word: וַיִּתְאַבְּלוּ
  choice: शोक करने लगे
  rationale: אבל का हित्पएल रूप शोक की अवस्था में प्रवेश करने या शोक मनाने को दर्शाता है। ‘शोक करने लगे’ उस आरंभिक प्रतिक्रिया को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: עָם यहाँ समुदाय को सामूहिक रूप से दर्शाता है। दोहराव के बावजूद ‘लोग’ आधुनिक हिंदी में सरल और स्वाभाविक है।
- source_word: מְאֹד
  choice: बहुत
  rationale: מְאֹד शोक की तीव्रता बढ़ाता है; ‘बहुत’ सहज आधुनिक हिंदी में वही बल देता है।
theological_decisions: []
