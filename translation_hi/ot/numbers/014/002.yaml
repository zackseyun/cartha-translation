base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/002.yaml
  text: And all the sons of Israel grumbled against Moses and against Aaron[a], and the whole congregation said to them[b], “If only we had died in the land of Egypt! Or if only we had died in this wilderness!”
translation:
  language: hi
  text: और इस्राएल के सब पुत्र[a] मूसा और हारून के विरुद्ध शिकायत करने लगे[b]। सारी मंडली ने उनसे कहा, “काश हम मिस्र देश में ही मर गए होते! या काश हम इस मरुभूमि में मर गए होते!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “इस्राएल के सब पुत्र”; यह राष्ट्रीय पदबंध सामूहिक रूप से इस्राएल के लोगों को सूचित करता है।
    reason: source_form_and_collective_sense
  - marker: b
    text: या, “बड़बड़ाने लगे” या “कुड़कुड़ाने लगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: कुड़कुड़ाने लगे
  rationale: यह क्रिया अगुवों के विरुद्ध सामूहिक असंतोष और शिकायत प्रकट करती है। ‘कुड़कुड़ाना’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: कुड़कुड़ाने की शिकायत मूसा और हारून की ओर विरोधात्मक रूप से निर्देशित है; इसलिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: כֹּל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्र
  rationale: यह चयन इब्रानी के लिंगयुक्त राष्ट्रीय पदबंध को औपचारिक रूप से सुरक्षित रखता है; पाठ में इसका आशय समूचे इस्राएली समुदाय से है।
- source_word: כָּל הָעֵדָה
  choice: सारी मंडली
  rationale: गिनती में עֵדָה संगठित वाचा-समुदाय को सूचित करता है। ‘मंडली’ संक्षिप्त, प्रतिष्ठित और प्रचलित बाइबलीय हिन्दी है।
- source_word: לוּ
  choice: काश
  rationale: לוּ अतीत के विषय में एक अपूर्ण और वास्तविकता-विरोधी इच्छा प्रकट करता है; हिन्दी में ‘काश’ इसका स्वाभाविक समतुल्य है।
- source_word: מַתְנוּ / מָתְנוּ
  choice: मर गए होते
  rationale: לוּ के साथ पूर्ण क्रिया अतीत की अवास्तविक इच्छा व्यक्त करती है; ‘मर गए होते’ उस प्रतिकल्पित भाव को स्पष्ट रखता है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: यह इब्रानी के पूर्ण भौगोलिक पदबंध को सहज हिन्दी में बनाए रखता है।
- source_word: בַּמִּדְבָּר הַזֶּה
  choice: इसी जंगल में
  rationale: ‘जंगल’ आधुनिक बाइबलीय हिन्दी में निर्जन वनप्रदेश के अर्थ में מִדְבָּר का सुबोध समतुल्य है; ‘इसी’ वक्ताओं के वर्तमान स्थान पर दिए गए संकेत का बल रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंगयुक्त राष्ट्रीय पदनाम
  choice: इस्राएल के सभी पुत्र
  alternative: सभी इस्राएली
  rationale: इब्रानी में ‘इस्राएल के पुत्र’ का पुल्लिंग बहुवचन पदबंध है। मुख्य पाठ में उसके रूप को रखा गया है, जबकि यह स्वीकार किया जाता है कि प्रसंग में वह पूरे लोगों को सामूहिक रूप से सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘कुड़कुड़ाने लगे’ सामूहिक असंतोष का आरंभ और निरंतरता दर्शाता है; ‘मंडली’ पेंटाट्यूक के सामुदायिक संदर्भ को बनाए रखता है।
