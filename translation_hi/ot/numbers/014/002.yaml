  terminology: “मंडली” appropriately renders עֵדָה in this Pentateuchal context. The national designation “इस्राएल के सब पुत्र” is retained, with a note explaining its collective reference. “मरुभूमि” accurately renders the wilderness setting without the forest connotation of “जंगल.”
