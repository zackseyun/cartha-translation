  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל יְהוָ֑ה וְ/שָׁמְע֣וּ מִצְרַ֔יִם כִּֽי הֶעֱלִ֧יתָ בְ/כֹחֲ/ךָ֛ אֶת הָ/עָ֥ם הַ/זֶּ֖ה מִ/קִּרְבּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/013.yaml
  text: But Moses said to Yahweh[a], “Then the Egyptians will hear, for by your power you brought up this people from among them.”
translation:
  language: hi
  text: परन्तु मूसा ने याहवे से कहा, “तब मिस्रवासी सुनेंगे, क्योंकि तू अपनी सामर्थ्य से इस प्रजा को उनके बीच से निकाल लाया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मिस्रवासियों ने सुना है, क्योंकि तू अपनी सामर्थ्य से इस प्रजा को उनके बीच से निकाल लाया है।” हिब्रू क्रिया-रूप को भूतकाल या मूसा की विनती में भावी परिणाम—दोनों रूपों में समझा जा सकता है; मुख्य पाठ ने आसपास के तर्क के अनुकूल भावी अर्थ अपनाया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: परन्तु मूसा ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; पिछले पद में घोषित दण्ड के प्रतिउत्तर का विरोध स्पष्ट करने के लिए ‘परन्तु’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וְשָׁמְעוּ
  choice: तब मिस्री सुनेंगे
  rationale: 'पूर्ण क्रिया-रूप को प्रसंग में भावी परिणाम के रूप में लिया गया है: यदि प्रजा नष्ट होती है, तो मिस्री यह समाचार सुनेंगे। भूतकालीन अर्थ भी व्याकरणतः सम्भव है और पादटिप्पणी में दिया गया है।'
- source_word: מִצְרַיִם
  choice: मिस्री
  rationale: स्थानवाचक नाम यहाँ सुनने वाले लोगों का सामूहिक बोध कराता है।
- source_word: כִּי
  choice: कि
  rationale: यह मूसा की बात की विषय-वस्तु प्रस्तुत करता है—मिस्री सुनेंगे कि यहवे इस प्रजा को सामर्थ्य से निकाल लाया था। यह वाक्य-संरचना अगले पद से भी सहज जुड़ती है।
- source_word: הֶעֱלִיתָ
  choice: निकाल लाया था
  rationale: हिफ़ील रूप का मूल भाव ‘ऊपर ले आना’ है; निर्गमन के प्रसंग में ‘निकाल लाना’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: בְכֹחֲךָ
  choice: अपने सामर्थ्य से
  rationale: בְ साधन को व्यक्त करता है और כֹּחַ शक्ति या सामर्थ्य को; यह चयन उसी साधनात्मक अर्थ को रखता है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा को
  rationale: एकवचन सामूहिक संज्ञा עַם के लिए ‘प्रजा’ dignified और सहज हिन्दी है।
- source_word: מִקִּרְבּוֹ
  choice: उनके बीच से
  rationale: एकवचन प्रत्यय सामूहिक मिस्र की ओर संकेत करता है; हिन्दी में लोगों के संदर्भ में ‘उनके बीच से’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ निजी वाचा-नाम का प्रयोग करता है; इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित न करके नाम को लिप्यंतरित किया गया है।
- issue: וְשָׁמְעוּ का कालगत अर्थ
  choice: भावी परिणाम—‘तब मिस्री सुनेंगे’
  alternative: भूतकाल—‘मिस्रियों ने सुन रखा है’
  rationale: मूसा की विनती और अगले पद में जारी परिणाम-श्रृंखला भावी अर्थ का समर्थन करती है, यद्यपि हिब्रू रूप भूतकालीन समझ की भी अनुमति देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। परमेश्वर को संबोधित करते समय एकवचन ‘तू’ बाइबलीय निकटता और प्रत्यक्ष संबोधन को रखता है; शैली में अनावश्यक संस्कृतनिष्ठता से बचते हुए ‘सामर्थ्य’ और ‘प्रजा’ जैसे प्रतिष्ठित, प्रचलित शब्द चुने गए हैं।
