id: NUM.14.24
reference: Numbers 14:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַבְדִּ֣/י כָלֵ֗ב עֵ֣קֶב הָֽיְתָ֞ה ר֤וּחַ אַחֶ֨רֶת֙ עִמּ֔/וֹ וַ/יְמַלֵּ֖א אַחֲרָ֑/י וַ/הֲבִֽיאֹתִ֗י/ו אֶל הָ/אָ֨רֶץ֙ אֲשֶׁר בָּ֣א שָׁ֔מָּ/ה וְ/זַרְע֖/וֹ יוֹרִשֶֽׁ/נָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/024.yaml
  text: But my servant Caleb[a], because a different spirit was with him and he followed me fully, I will bring him into the land where he went[c][b], and his offspring will possess it.
translation:
  language: hi
  text: लेकिन मेरा सेवक कालेब, क्योंकि उसके साथ एक अलग आत्मा थी[a] और उसने मेरा पूरी तरह अनुसरण किया, मैं उसे उस देश में ले आऊँगा जहाँ वह गया था, और उसके वंशज उस पर अधिकार करेंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका मनोभाव अलग था।” इब्रानी में “उसके साथ एक अलग आत्मा थी”; इसका संकेत बाकी इस्राएलियों से भिन्न प्रवृत्ति या रवैये की ओर भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके वंशज उसे विरासत में पाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַבְדִּי כָלֵב
  choice: लेकिन मेरे सेवक कालेब
  rationale: וְ को पिछले प्रसंग की अविश्वासी पीढ़ी के साथ विरोध दिखाने के लिए ‘लेकिन’ किया गया है। עֶבֶד के लिए यहाँ परमेश्वर के निष्ठावान अधीनस्थ के अर्थ में स्वाभाविक ‘सेवक’ उपयुक्त है।
- source_word: עֵקֶב
  choice: इसलिए
  rationale: यह कालेब के प्रति आगामी अनुग्रह का आधार बताता है। हिन्दी में पहले कारण रखकर फिर ‘इसलिए’ से परिणाम व्यक्त करना स्वाभाविक है।
- source_word: הָיְתָה רוּחַ אַחֶרֶת עִמּוֹ
  choice: उसके साथ एक अलग आत्मा थी
  rationale: यह इब्रानी संरचना और רוּחַ की व्यापकता को बनाए रखता है; इसका आशय आत्मा, मनोभाव या प्रवृत्ति हो सकता है, इसलिए इसे केवल ‘रवैया’ बनाकर सीमित नहीं किया गया।
- source_word: וַיְמַלֵּא אַחֲרָי
  choice: उसने पूरी तरह मेरा अनुसरण किया
  rationale: शाब्दिक मुहावरा ‘मेरे पीछे भर दिया’ हिन्दी में अस्पष्ट होगा। यह अभिव्यक्ति पूर्ण और निष्ठापूर्ण अनुसरण का अर्थ सहज ढंग से देती है।
- source_word: וַהֲבִיאֹתִיו
  choice: मैं उसे ... ले जाऊँगा
  rationale: घोषणात्मक/प्रतिज्ञात्मक संदर्भ में इब्रानी रूप परमेश्वर की भावी कार्रवाई व्यक्त करता है।
- source_word: אֶל הָאָרֶץ אֲשֶׁר בָּא שָׁמָּה
  choice: उस देश में ... जहाँ वह गया था
  rationale: यह שָׁמָּה सहित गति के मूल अर्थ को स्वाभाविक हिन्दी में रखता है और जासूस के रूप में कालेब की पिछली यात्रा को सूचित करता है।
- source_word: וְזַרְעוֹ
  choice: उसके वंशज
  rationale: זֶרַע सामूहिक रूप से भावी संतान को दर्शाता है; आधुनिक हिन्दी में ‘वंशज’ स्पष्ट और स्वाभाविक है।
- source_word: יוֹרִשֶׁנָּה
  choice: उस पर अधिकार करेंगे
  rationale: ירשׁ भूमि को विरासत में पाने और उस पर अधिकार करने, दोनों का भाव रख सकता है। मुख्य पाठ में अधिकार/कब्ज़े का भूमि-संबंधी अर्थ व्यक्त किया गया है और वैकल्पिक ‘उत्तराधिकारी होंगे’ को टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: कालेब के साथ ‘एक अलग आत्मा’ का अर्थ
  choice: वाक्यांश को व्यापक अर्थ में ‘एक अलग आत्मा’ रखा गया है।
  alternative: ‘उसका मनोभाव अलग था’ अथवा इसे विशेष रूप से परमेश्वर के आत्मा का उल्लेख मानना।
  rationale: רוּחַ आत्मा, मनोभाव या आंतरिक प्रवृत्ति का अर्थ दे सकता है। पाठ स्पष्ट रूप से पवित्र आत्मा की पहचान नहीं करता, इसलिए अनुवाद इस धार्मिक अस्पष्टता को बनाए रखता है।
- issue: भूमि पर वंशजों का अधिकार
  choice: ‘उस पर अधिकार करेंगे’
  alternative: ‘उसके उत्तराधिकारी होंगे’ / ‘उसे विरासत में पाएँगे’
  rationale: ירשׁ में विरासत और अधिकार ग्रहण करने के अर्थ एक-दूसरे से जुड़े हैं; मुख्य पाठ भूमि-अधिकार को सामने रखता है, जबकि टिप्पणी विरासत वाले अर्थ को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘अनुसरण किया’ बाइबलीय निष्ठा के अर्थ को स्पष्ट करता है, और ‘अलग आत्मा’ मूल की वास्तविक अर्थगत तथा धार्मिक खुलावट बनाए रखता है।
