lexical_decisions:
- source_word: וַתִּשָּׂא
  choice: अपनी आवाज़ ऊँची की
  rationale: נָשָׂא का मूल अर्थ ‘उठाना’ है। अगले वाक्यांश ‘अपनी आवाज़ दी’ के साथ यह ऊँचे सामूहिक विलाप या पुकार का मुहावरा बनाता है; हिन्दी में ‘आवाज़ ऊँची की’ इस बिंब को स्वाभाविक रूप से बनाए रखता है।
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ इस्राएल के एकत्र समुदाय को दर्शाता है। ‘सारी मण्डली’ כָּל को भी व्यक्त करता है और आधुनिक हिन्दी बाइबलीय शैली में सहज है।
- source_word: וַיִּתְּנוּ אֶת קוֹלָם
  choice: चिल्ला उठी
  rationale: शाब्दिक रूप से ‘उन्होंने अपनी आवाज़ दी’; यह ऊँची सामूहिक पुकार का इब्रानी मुहावरा है। ‘चिल्ला उठी’ उसका स्वाभाविक हिन्दी अर्थ देता है और पहले वाक्यांश के साथ क्रिया की तीव्रता बनाए रखता है।
- source_word: הָעָם
  choice: लोग
  rationale: עָם का सीधा और स्वाभाविक अनुवाद। ‘मण्डली’ से उसका संदर्भ मिलता-जुलता होने पर भी इब्रानी की शब्द-विविधता सुरक्षित रखी गई है।
- source_word: וַיִּבְכּוּ
  choice: रोते रहे
  rationale: בכה का अर्थ ‘रोना/विलाप करना’ है। ‘रोते रहे’ उस रात जारी रहे शोक को स्वाभाविक हिन्दी में व्यक्त करता और पहले की ऊँची पुकार से इसे अलग रखता है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उस रात
  rationale: कालसूचक इब्रानी पदबंध का संक्षिप्त और स्वाभाविक हिन्दी रूप।
