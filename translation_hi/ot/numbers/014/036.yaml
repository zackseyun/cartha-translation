  text: וְ/הָ֣/אֲנָשִׁ֔ים אֲשֶׁר שָׁלַ֥ח מֹשֶׁ֖ה לָ/ת֣וּר אֶת הָ/אָ֑רֶץ וַ/יָּשֻׁ֗בוּ ו/ילונו עָלָי/ו֙ אֶת כָּל הָ֣/עֵדָ֔ה לְ/הוֹצִ֥יא דִבָּ֖ה עַל הָ/אָֽרֶץ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/036.yaml
  text: The men whom Moses sent to scout out the land returned and caused the whole congregation to grumble against him by bringing out a bad report about the land[a][b].
translation:
  language: hi
  text: जिन पुरुषों को मूसा ने देश का निरीक्षण करने[a] भेजा था, उन्होंने लौटकर देश के बारे में बुरी रिपोर्ट फैलाकर[b] सारी मंडली को मूसा के विरुद्ध शिकायत करने के लिए उकसाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश की टोह लेने।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बुरी रिपोर्ट बाहर लाकर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: जिन पुरुषों
  rationale: हिब्रू पद पूर्व प्रसंग से जुड़े पुरुषों को फिर विषय बनाता है। हिंदी में संबंधवाचक रचना स्वाभाविक रूप से अगले उपवाक्य से इसे जोड़ती है; अलग से कालसूचक ‘अब’ नहीं जोड़ा गया।
- source_word: אֲשֶׁר שָׁלַח מֹשֶׁה
  choice: जिन्हें मूसा ने ... भेजा था
  rationale: संबंधवाचक उपवाक्य और उसके भूतपूर्व संदर्भ को स्पष्ट, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: देश का निरीक्षण करने
  rationale: תור यहाँ कनान की खोजबीन और टोह लेने को दर्शाता है। ‘निरीक्षण’ आधुनिक हिंदी में सहज है और ‘जासूसी’ की अनावश्यक नकारात्मक विशिष्टता से बचता है।
- source_word: וַיָּשֻׁבוּ
  choice: उन्होंने लौटकर
  rationale: שוב की वापसी की क्रिया को संक्षेप में रखता है और अगली क्रिया के साथ स्वाभाविक हिंदी संबंध बनाता है।
- source_word: וילונו עָלָיו
  choice: सारी मंडली को मूसा के विरुद्ध कुड़कुड़ाने के लिए उकसाया
  rationale: 'रूप और प्रत्यक्ष कर्म אֶת כָּל־הָעֵדָה के अनुसार यहाँ कारक भाव है: पुरुषों ने मंडली को शिकायत करने के लिए प्रेरित किया। ‘कुड़कुड़ाना’ जंगल-वृत्तांत की लगातार शिकायत के भाव को बनाए रखता है। सर्वनाम की अस्पष्टता से बचने के लिए हिंदी में ‘मूसा’ दोहराया गया है।'
- source_word: אֶת כָּל־הָעֵדָה
  choice: सारी मंडली
  rationale: עֵדָה इस्राएल के सामुदायिक समूह को सूचित करता है; ‘मंडली’ पंचग्रंथीय संदर्भ में प्रतिष्ठित और सामान्यतः बोधगम्य है।
- source_word: לְהוֹצִיא דִבָּה
  choice: बुरी खबर फैलाकर
  rationale: דִבָּה अपमानजनक या निरुत्साहित करने वाली बुरी रिपोर्ट है। הוציא का शाब्दिक ‘बाहर निकालना’ हिंदी में असहज होगा; ‘फैलाकर’ संप्रेषण के आशय को स्वाभाविक रूप से देता है।
- source_word: עַל־הָאָרֶץ
  choice: देश के बारे में
  rationale: यहाँ עַל रिपोर्ट के विषय को दर्शाता है; ‘के बारे में’ आधुनिक हिंदी में सबसे स्वाभाविक है।
