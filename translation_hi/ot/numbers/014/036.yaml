  terminology: “मूसा,” “देश,” and “मंडली” are suitable. “निरीक्षण करने” is acceptable for reconnaissance, with the supplied alternative “टोह लेने” preserving the more specific nuance. The revised wording retains the causative force of the Hebrew verbal form.
  issues:
