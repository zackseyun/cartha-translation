    issue: The expression “कुड़कुड़ाने” is overly colloquial for the passage’s dignified narrative register.
    rationale: Although it can convey grumbling, it sounds informal and can distract from the formal biblical narration. “शिकायत करने” is more idiomatic and register-appropriate.
