  yaml_path: translation/ot/numbers/014/021.yaml
  text: But as I live[a], the glory of Yahweh will fill all the earth.
translation:
  language: hi
  text: परन्तु, मेरे जीवन की शपथ, यहोवा की महिमा सारी पृथ्वी[a] को भर देगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सारी भूमि’; इब्रानी शब्द אֶרֶץ का अर्थ प्रसंग के अनुसार ‘पृथ्वी’, ‘देश’ या ‘भूमि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह शब्द पिछली बात के साथ प्रबल विरोध और नई घोषणा पर बल प्रकट करता है; ‘परन्तु’ आधुनिक, गरिमापूर्ण हिन्दी में यह संबंध स्पष्ट रखता है।
- source_word: חַי אָ֑נִי
  choice: मेरे जीवन की शपथ
  rationale: यह परमेश्वर की गंभीर शपथ का मुहावरा है। शाब्दिक ‘मैं जीवित हूँ’ की अपेक्षा यह हिन्दी में उसके शपथ-संबंधी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְיִמָּלֵא
  choice: छा जाएगी
  rationale: यहाँ क्रिया का भाव यह है कि यहोवा की महिमा पूरी पृथ्वी को भरकर सर्वत्र व्याप्त होगी। ‘छा जाएगी’ उसी परिणाम को सहज हिन्दी में व्यक्त करता है और महिमा को वाक्य का कर्ता बनाए रखता है।
- source_word: כְבוֹד
  choice: महिमा
  rationale: यहोवा के संदर्भ में כָּבוֹד उनकी प्रत्यक्ष गरिमा, महानता और प्रतिष्ठा का बोध कराता है; ‘महिमा’ इसका स्थापित और उपयुक्त हिन्दी रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए विशिष्ट दिव्य नाम को हिन्दी में उसके प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶת כָּל הָאָרֶץ
  choice: सारी पृथ्वी
  rationale: אֶרֶץ का अर्थ ‘पृथ्वी’ अथवा ‘देश/भूमि’ हो सकता है। इस व्यापक घोषणा में ‘सारी पृथ्वी’ प्रमुख अर्थ है, जबकि स्थानीय अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: הָאָרֶץ का भौगोलिक विस्तार
  choice: सार्वभौमिक अर्थ—‘सारी पृथ्वी’
  alternative: स्थानीय अर्थ—‘सारा देश’ या ‘सारी भूमि’
  rationale: यहोवा की महिमा से संबंधित इस शपथपूर्ण घोषणा का स्वर व्यापक अर्थ का समर्थन करता है। फिर भी इब्रानी शब्द की वास्तविक स्थानीय संभावना को पाद-टिप्पणी में रखा गया है, ताकि अस्पष्टता पूरी तरह मिट न जाए।
- issue: חַי אָ֑נִי का शपथ-संबंधी स्वरूप
  choice: ‘मेरे जीवन की शपथ’
  alternative: ‘जैसा कि मैं जीवित हूँ’
  rationale: यह वाक्यांश केवल परमेश्वर के जीवित होने का कथन नहीं, बल्कि उनके जीवन पर आधारित गंभीर शपथ का सूत्र है; हिन्दी में स्पष्ट शपथ-रूप उसके प्रयोजन को बेहतर बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे जीवन की शपथ’ गंभीर दिव्य घोषणा का बल बनाए रखता है, और ‘छा जाएगी’ महिमा के सर्वत्र व्याप्त होने को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
