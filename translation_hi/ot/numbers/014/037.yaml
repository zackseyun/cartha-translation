id: NUM.14.37
reference: Numbers 14:37
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּמֻ֨תוּ֙ הָֽ/אֲנָשִׁ֔ים מוֹצִאֵ֥י דִבַּת הָ/אָ֖רֶץ רָעָ֑ה בַּ/מַּגֵּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/037.yaml
  text: those men who had brought out a bad report about the land died by the plague before Yahweh.
translation:
  language: hi
  text: वे पुरुष जिन्होंने उस देश के बारे में बुरी रिपोर्ट फैलाई थी, यहोवा के सामने महामारी से मर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמֻתוּ
  choice: मर गए
  rationale: מות के क़ाल कथात्मक रूप को स्वाभाविक हिन्दी भूतकाल में व्यक्त करता है; आरंभिक संयोजक का क्रम सन्दर्भ से स्पष्ट है।
- source_word: הָאֲנָשִׁים
  choice: वे पुरुष
  rationale: निश्चित बहुवचन पहले बताए गए भेदियों की ओर संकेत करता है; 'वे पुरुष' इस अनाफोरिक बल को बनाए रखता है।
- source_word: מוֹצִאֵי דִבַּת הָאָרֶץ רָעָה
  choice: जो उस देश के विषय में बुरी खबर लाए थे
  rationale: कृदन्तीय वाक्यांश पुरुषों को उनके पहले किए हुए काम से पहचानता है। 'लाए थे' הוציא की बाहर लाने की छवि और पूर्वकालिकता को बनाए रखता है; דבה की निंदात्मक और हानिकारक रिपोर्ट का भाव 'बुरी खबर' से स्पष्ट होता है।
- source_word: בַּמַּגֵּפָה
  choice: महामारी से
  rationale: מַגֵּפָה यहाँ दैवी दंड के रूप में प्राणघातक विपत्ति या plague को दर्शाता है; करणार्थक בְּ का स्वाभाविक हिन्दी रूप 'से' है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי उपस्थिति और सम्मुखता व्यक्त करता है; 'के सामने' इस गंभीर अर्थ को सीधे बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में रखा गया है। आधुनिक हिन्दी बाइबलीय प्रयोग में 'यहोवा' अधिक परिचित है, यद्यपि 'याहवे' संभावित प्राचीन उच्चारण के अधिक निकट माना जाता है।
- issue: לִפְנֵי יְהוָה में दैवी उपस्थिति का भाव
  choice: यहोवा के सामने
  alternative: यहोवा की उपस्थिति में
  rationale: शाब्दिक स्थानिक भाषा और न्याय की गंभीरता को बनाए रखता है, बिना यह तय किए कि वाक्यांश दृश्य पवित्रस्थान, प्रत्यक्ष दैवी कार्रवाई, अथवा सामान्य दैवी उपस्थिति पर विशेष बल देता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। 'पुरुष' संदर्भित भेदियों के लिए स्पष्ट है; 'बुरी खबर' सामान्य पाठक के लिए सहज होते हुए דִבָּה के निंदात्मक और हानिकारक भाव को व्यक्त करती है।
