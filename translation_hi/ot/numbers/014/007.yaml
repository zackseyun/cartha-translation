  yaml_path: translation/ot/numbers/014/007.yaml
  text: And they said to all the congregation of the sons of Israel[b][a], “The land through which we passed to spy it out is an exceedingly good land.”
translation:
  language: hi
  text: और उन्होंने इस्राएलियों की सारी सभा से कहा, “जिस देश में से होकर हम उसकी टोह लेने गए थे, वह देश बहुत, बहुत अच्छा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: और उन्होंने ... कहा
  rationale: אמר का कथात्मक रूप प्रत्यक्ष वचन का स्वाभाविक परिचय देता है; हिंदी में ‘कहा’ सहज है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी सभा
  rationale: עֵדָה संगठित/एकत्र समुदाय को दर्शाता है और בְּנֵי יִשְׂרָאֵל के लिए आधुनिक हिंदी में ‘इस्राएली’ स्वाभाविक तथा समावेशी है।
- source_word: אֲשֶׁר עָבַרְנוּ בָהּ
  choice: जिस देश में हम ... गए थे
  rationale: עבר ב स्थान के भीतर से होकर जाने को व्यक्त करता है; अगले उद्देश्य-वाक्य के साथ यह हिंदी में सहज बनता है।
- source_word: לָתוּר אֹתָהּ
  choice: उसका भेद लेने
  rationale: תור यहाँ कनान की खोजपूर्ण टोह/जाँच के लिए प्रयुक्त है; ‘भेद लेने’ से गुप्तचर-संदर्भ बना रहता है, बिना केवल सामान्य भ्रमण का अर्थ देने के।
- source_word: טוֹבָה ... מְאֹד מְאֹד
  choice: बहुत ही अच्छा
  rationale: दोहराया מְאֹד तीव्र बल देता है; ‘बहुत ही’ आधुनिक हिंदी में स्वाभाविक ढंग से उसी प्रबलता को व्यक्त करता है।
