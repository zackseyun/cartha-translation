  text: וַ/יַּשְׁכִּ֣מוּ בַ/בֹּ֔קֶר וַ/יַּֽעֲל֥וּ אֶל רֹאשׁ הָ/הָ֖ר לֵ/אמֹ֑ר הִנֶּ֗/נּוּ וְ/עָלִ֛ינוּ אֶל הַ/מָּק֛וֹם אֲשֶׁר אָמַ֥ר יְהוָ֖ה כִּ֥י חָטָֽאנוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/040.yaml
  text: They rose early in the morning and went up to the top of the mountain[a], saying, “Here we are, and we will go up to the place that Yahweh has spoken of, for we have sinned.”
translation:
  language: hi
  text: वे सुबह तड़के उठे और पहाड़ की चोटी तक चढ़ गए। कहते हुए, “हम यहाँ हैं, और हम उस स्थान पर चढ़ेंगे जिसके विषय में याहवे ने कहा है, क्योंकि हमने पाप किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: वे भोर को तड़के उठे
  rationale: क्रिया שׁכם के हिफ़ील रूप में जल्दी उठने या जल्दी प्रस्थान करने का भाव है; בַבֹּקֶר के साथ ‘भोर को तड़के उठे’ समय के बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעֲלוּ אֶל רֹאשׁ הָהָר
  choice: पहाड़ की चोटी की ओर चढ़े
  rationale: עלה का सामान्य अर्थ ‘चढ़ना’ और רֹאשׁ הָהָר का अर्थ ‘पहाड़ की चोटी’ है। אֶל दिशा अथवा गंतव्य बता सकता है; ‘की ओर’ आगे के कथानक के साथ तनाव को मिटाए बिना चढ़ने की गति को व्यक्त करता है।
- source_word: לֵאמֹר
  choice: वे कहने लगे
  rationale: यह अनंत क्रिया-रूप सीधे कथन का परिचय देता है; हिन्दी में ‘वे कहने लगे’ सहज कथात्मक रूप है।
- source_word: הִנֶּנּוּ
  choice: लो, हम यहाँ हैं
  rationale: यह स्वयं को उपस्थित करने वाला सूत्र है। ‘लो, हम यहाँ हैं’ उसकी ध्यानाकर्षक शक्ति बनाए रखता है और केवल ‘हम तैयार हैं’ कहकर आशय को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וְעָלִינוּ
  choice: अब हम … चढ़ जाएँगे
  rationale: रूप पूर्णकालिक है, पर इस प्रसंग में प्रस्तावित या दृढ़ निश्चय की गई आगामी क्रिया व्यक्त करता है। ‘चढ़ जाएँगे’ आधुनिक हिन्दी में उस संकल्प को स्पष्ट करता है।
- source_word: אֶל הַמָּקוֹם
  choice: उस स्थान पर
  rationale: מָקוֹם का सामान्य अर्थ ‘स्थान’ है; यहाँ निश्चित पद के कारण ‘उस स्थान’ उपयुक्त है।
- source_word: אֲשֶׁר אָמַר יְהוָה
  choice: जिसके विषय में याहवे ने कहा था
  rationale: אָמַר मूलतः ‘कहा’ है, जबकि सम्बन्धवाचक उपवाक्य उस स्थान को पहचानता है जिसका याहवे ने उल्लेख किया था। ‘के विषय में’ हिन्दी में आवश्यक सम्बन्ध स्पष्ट करता है, बिना इसे अधिक प्रबल ‘प्रतिज्ञा की थी’ बनाने के।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत परमेश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: כִּי חָטָאנוּ
  choice: क्योंकि हमने पाप किया है
  rationale: כִּי यहाँ कारण प्रस्तुत करता है और חטא नैतिक दोष के अर्थ में ‘पाप करना’ है; पूर्ण क्रिया के वर्तमान परिणाम को ‘किया है’ व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, न कि उपाधि से प्रतिस्थापित करता है।
- issue: लोगों के कथन וְעָלִינוּ का काल और भाव
  choice: अब हम … चढ़ जाएँगे
  alternative: हम … चढ़ गए हैं / हम … चढ़ें
  rationale: व्याकरणिक रूप पूर्णकालिक होते हुए भी प्रसंग में आगामी संकल्प व्यक्त करता है। अनुवाद उनके इरादे को दर्शाता है, पर उसे परमेश्वर द्वारा स्वीकृत आज्ञाकारिता नहीं ठहराता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लो, हम यहाँ हैं’ मूल की आत्म-प्रस्तुति को बनाए रखता है। ‘चोटी की ओर चढ़े’ אֶל की दिशात्मक संभावना तथा अगले पदों के कथात्मक तनाव, दोनों को सुरक्षित रखता है।
