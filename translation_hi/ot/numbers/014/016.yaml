  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ/בִּלְתִּ֞י יְכֹ֣לֶת יְהוָ֗ה לְ/הָבִיא֙ אֶת הָ/עָ֣ם הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נִשְׁבַּ֣ע לָ/הֶ֑ם וַ/יִּשְׁחָטֵ֖/ם בַּ/מִּדְבָּֽר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/014/016.yaml
  text: Because Yahweh was not able to bring this people into the land that he swore to them[a], he slaughtered them in the wilderness.
translation:
  language: hi
  text: क्योंकि यहोवा इस प्रजा को उस देश में नहीं ला सका, जिस देश को उन्हें देने की उसने उनसे शपथ खाई थी,[a] इसलिए उसने मरुभूमि में उनका वध कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस देश के विषय में उसने उनसे शपथ खाई थी।”
    reason: इब्रानी में शपथ की विषयवस्तु स्पष्ट नहीं कही गई है; संदर्भ में भूमि को उन्हें देने का भाव निहित है।
lexical_decisions:
- source_word: מִבִּלְתִּי
  choice: क्योंकि ... नहीं
  rationale: यह पद राष्ट्रों द्वारा लगाए जाने वाले आरोप का कारण बताता है। हिन्दी में ‘क्योंकि ... नहीं’ इस कारणात्मक और नकारात्मक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְכֹלֶת
  choice: ला सका
  rationale: יכל सामर्थ्य या क्षमता व्यक्त करता है। ‘नहीं ला सका’ कथित असमर्थता को बिना नरम किए स्पष्ट आधुनिक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הָעָם הַזֶּה
  choice: इस प्रजा
  rationale: עָם एकवचन समूहवाचक संज्ञा है। ‘इस प्रजा’ उसके सामूहिक और वक्तृत्वपूर्ण बल को बनाए रखता है।
- source_word: אֶל הָאָרֶץ
  choice: उस देश में
  rationale: הביא के साथ यह वाक्यांश देश के भीतर प्रवेश कराने का भाव देता है; इसलिए हिन्दी में ‘देश में लाना’ स्वाभाविक और सटीक है।
- source_word: אֲשֶׁר נִשְׁבַּע לָהֶם
  choice: जिसके बारे में उसने उनसे शपथ खाई थी
  rationale: इब्रानी में शपथ की विषयवस्तु स्पष्ट रूप से नहीं दोहराई गई है। यह रूप उस लोप को बनाए रखता है और ‘देने’ को मुख्य पाठ में जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיִּשְׁחָטֵם
  choice: उसने उन्हें वध कर डाला
  rationale: שׁחט साधारण ‘मारना’ से अधिक तीखा, वध या संहार का भाव रखता है। ‘वध कर डाला’ राष्ट्रों के आरोप की कठोरता सुरक्षित रखता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: गिनती के भौगोलिक संदर्भ में מִדְבָּר निर्जन वनप्रदेश को दर्शाता है; ‘जंगल’ हिन्दी बाइबलीय प्रयोग में सहज और व्यापक रूप से समझा जाता है।
theological_decisions:
- issue: राष्ट्रों द्वारा यहोवा की सामर्थ्य पर लगाए गए आरोप का अनुवाद
  choice: यहोवा ... नहीं ला सका
  alternative: यहोवा में ... लाने की सामर्थ्य न होने के कारण
  rationale: यह कथन पिछले संदर्भ में राष्ट्रों की संभावित बात है, अनुवादक का धर्मवैज्ञानिक निष्कर्ष नहीं। इसलिए कथित ईश्वरीय असमर्थता को नरम किए बिना मूल की तनावपूर्ण भाषा बनाए रखी गई है।
- issue: शपथ की अप्रकट विषयवस्तु
  choice: जिसके बारे में उसने उनसे शपथ खाई थी
  alternative: जिसे उन्हें देने की उसने शपथ खाई थी
  rationale: मूल पाठ में ‘देने’ की क्रिया निहित समझी जा सकती है, पर व्यक्त नहीं है। मुख्य पाठ वास्तविक व्याकरणिक लोप को सुरक्षित रखता है और अधिक स्पष्ट अर्थ को पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वध कर डाला’ आरोप की कठोरता व्यक्त करता है, जबकि ‘जिसके बारे में’ मूल की संक्षिप्तता और अर्थगत खुलापन बनाए रखता है।
