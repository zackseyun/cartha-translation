lexical_decisions:
- source_word: כָּל הֶעָרִים
  choice: सब ... नगर
  rationale: כָּל पूरे समूह को समेटता है और הֶעָרִים नगरों को; हिंदी में विभक्त संरचना ‘जो नगर... वे सब’ स्वाभाविक रूप से पूर्णता व्यक्त करती है।
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: जो ... दोगे
  rationale: सम्बन्धवाचक אֲשֶׁר और द्वितीय पुरुष बहुवचन अपूर्ण क्रिया का प्रसंगानुकूल, स्वाभाविक भविष्यकालीन निर्देश।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: लेवी गोत्र के सदस्यों के लिए प्रचलित हिंदी नाम और सम्प्रदान कारक।
- source_word: אַרְבָּעִים וּשְׁמֹנֶה עִיר
  choice: अड़तालीस नगर
  rationale: इब्रानी संख्या ‘चालीस और आठ’ का आधुनिक हिंदी में स्वाभाविक संख्यात्मक रूप।
- source_word: אֶתְהֶן
  choice: वे नगर
  rationale: सर्वनाम-सहित कर्मचिह्न पहले उल्लिखित नगरों को पुनः ग्रहण करता है; इसे स्पष्ट पुनरुक्ति से रखा गया है, न कि केवल निहित मान लिया गया।
- source_word: וְאֶת מִגְרְשֵׁיהֶן
  choice: और उनकी चरागाहें
  rationale: מִגְרָשׁ नगर के चारों ओर की खुली/सामुदायिक भूमि को दर्शाता है, जो यहाँ पशुओं के चरने के काम आती थी; ‘चरागाहें’ संदर्भ में सहज है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
