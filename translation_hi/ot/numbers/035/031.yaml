source:
  edition: WLC
  text: וְ/לֹֽא תִקְח֥וּ כֹ֨פֶר֙ לְ/נֶ֣פֶשׁ רֹצֵ֔חַ אֲשֶׁר ה֥וּא רָשָׁ֖ע לָ/מ֑וּת כִּי מ֖וֹת יוּמָֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/031.yaml
  text: You shall not accept a ransom for the life of a murderer who is guilty of death[c][b][a], for he must surely be put to death.
translation:
  language: hi
  text: तुम किसी हत्यारे के प्राण के बदले कोई छुड़ौती स्वीकार न करो[a][b], जो मृत्यु-दण्ड का दोषी है; क्योंकि उसे अवश्य मार डाला जाना चाहिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मुआवज़ा” अथवा “छुड़ाने की कीमत।” इब्रानी शब्द ऐसे भुगतान को दर्शाता है जो दण्ड टालने या किसी को छुड़ाने के लिए दिया जाए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हत्यारे के प्राण/जीवन के लिए।” आशय यह है कि उसके प्राण बचाने के लिए कोई भुगतान स्वीकार न किया जाए।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “वह निश्चय ही मार डाला जाए।” इब्रानी में यह एक बलात्मक रचना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִקְחוּ
  choice: स्वीकार करना
  rationale: क्रिया का मूल अर्थ ‘लेना’ है, पर כֹּפֶר के साथ इस कानूनी संदर्भ में भुगतान स्वीकार करने का भाव है।
- source_word: כֹּפֶר
  choice: छुड़ौती
  rationale: यह ऐसे भुगतान को दर्शाता है जिसका उद्देश्य दण्ड टालना या किसी को छुड़ाना है; यहाँ धन देकर मृत्युदण्ड से बचाने की बात है।
- source_word: לְנֶפֶשׁ רֹצֵחַ
  choice: किसी हत्यारे के प्राण बचाने के लिए
  rationale: נֶפֶשׁ यहाँ ‘प्राण/जीवन’ के अर्थ में है। स्वाभाविक हिन्दी में यह वाक्यांश स्पष्ट करता है कि भुगतान हत्यारे का जीवन बचाने के लिए दिया जाता।
- source_word: רֹצֵחַ
  choice: हत्यारा
  rationale: अध्याय जानबूझकर की गई हत्या और अनजाने में हुई मृत्यु में भेद करता है; यहाँ मृत्युदण्ड के योग्य अपराधी अभिप्रेत है।
- source_word: רָשָׁע לָמוּת
  choice: मृत्यु-दण्ड का दोषी
  rationale: शाब्दिक अभिव्यक्ति ‘मरने के लिए दोषी’ न्यायिक दायित्व बताती है; चुना हुआ रूप आधुनिक हिन्दी में उसका विधिक आशय सुरक्षित रखता है।
- source_word: כִּי מוֹת יוּמָת
  choice: उसे निश्चय ही मार डाला जाए
  rationale: इन्फिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल मृत्यु-दण्ड की प्रबल निश्चितता और बाध्यता व्यक्त करता है; ‘निश्चय ही’ इस बल को दर्शाता है।
theological_decisions:
- issue: मृत्युदण्ड संबंधी विधान का कानूनी बल
  choice: यह आज्ञा मृत्युदण्ड के दोषी हत्यारे की सजा को भुगतान लेकर बदलने पर रोक लगाती है।
  alternative: इसे केवल प्रचलित रीति का वर्णन माना जाए, बाध्यकारी विधान नहीं।
  rationale: לֹא תִקְחוּ की निषेधात्मक आज्ञा और מוֹת יוּמָת की बलात्मक रचना इसे दृढ़ कानूनी आदेश बनाती हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और गरिमापूर्ण शैली रखी गई है। ‘छुड़ौती’ मूल के दण्ड टालने वाले भुगतान का भाव देती है; ‘प्राण बचाने के लिए’ वाक्य के कानूनी आशय को सामान्य पाठक के लिए स्वाभाविक बनाता है।
