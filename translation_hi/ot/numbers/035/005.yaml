  text: וּ/מַדֹּתֶ֞ם מִ/ח֣וּץ לָ/עִ֗יר אֶת פְּאַת קֵ֣דְמָ/ה אַלְפַּ֪יִם בָּֽ/אַמָּ֟ה וְ/אֶת פְּאַת נֶגֶב֩ אַלְפַּ֨יִם בָּ/אַמָּ֜ה וְ/אֶת פְּאַת יָ֣ם אַלְפַּ֣יִם בָּֽ/אַמָּ֗ה וְ/אֵ֨ת פְּאַ֥ת צָפ֛וֹן אַלְפַּ֥יִם בָּ/אַמָּ֖ה וְ/הָ/עִ֣יר בַּ/תָּ֑וֶךְ זֶ֚ה יִהְיֶ֣ה לָ/הֶ֔ם מִגְרְשֵׁ֖י הֶ/עָרִֽים־־־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/005.yaml
  text: 'You shall measure outside the city: the east side[a], two thousand cubits; the south side, two thousand cubits; the west side, two thousand cubits; and the north side, two thousand cubits, with the city in the middle[b]. This shall be for them the pasture lands of the cities.'
translation:
  language: hi
  text: 'नगर के बाहर यह माप लेना: पूर्व की ओर दो हज़ार हाथ, दक्षिण की ओर दो हज़ार हाथ, पश्चिम की ओर[a] दो हज़ार हाथ और उत्तर की ओर दो हज़ार हाथ; नगर बीच में हो। यही उनके लिए नगरों की चरागाह-भूमि[b] होगी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “समुद्र की ओर”; भूमध्य सागर की दिशा के आधार पर यह पश्चिम के लिए प्रचलित दिशासूचक प्रयोग है।
    reason: lexical_alternative
  - marker: b
    text: या “नगरों की सामुदायिक भूमि” अथवा “नगरों के चारों ओर की खुली भूमि”; इब्रानी शब्द नगर के आसपास की भूमि को दर्शाता है, जिसका उपयोग प्रायः चराने के लिए होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמַדֹּתֶם מִחוּץ לָעִיר
  choice: तुम नगर के बाहर इस प्रकार नापना
  rationale: कानूनी निर्देश में संयोजक सहित पूर्ण क्रिया आदेशात्मक भाव रखती है। हिंदी में ‘नापना’ निर्देश की संक्षिप्त और स्वाभाविक शैली है; ‘नगर के बाहर’ मापे जाने वाले बाहरी क्षेत्र को स्पष्ट करता है।
- source_word: פְּאַת
  choice: की ओर
  rationale: चारों दिशाओं के साथ यह चुनाव सर्वेक्षण की प्रत्येक दिशा/भुजा का भाव सहज हिंदी में व्यक्त करता है, बिना इसे केवल कोने तक सीमित किए।
- source_word: קֵדְמָה / נֶגֶב / יָם / צָפוֹן
  choice: पूर्व / दक्षिण / पश्चिम / उत्तर
  rationale: ये यहाँ दिशासूचक शब्द हैं। יָם का शाब्दिक अर्थ ‘समुद्र’ है, पर प्रचलित इब्रानी दिशासूचक प्रयोग में इसका आशय पश्चिम है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אַלְפַּיִם בָּאַמָּה
  choice: दो हज़ार हाथ
  rationale: ‘हाथ’ प्राचीन माप ‘अम्मा/क्यूबिट’ का प्रचलित हिंदी बाइबलीय समतुल्य है और मूल संख्या तथा इकाई को बिना आधुनिक रूपांतरण के बनाए रखता है।
- source_word: וְהָעִיר בַּתָּוֶךְ
  choice: नगर बीच में हो
  rationale: यह मापे गए क्षेत्र के मध्य नगर की स्थानिक स्थिति बताता है। संक्षिप्त हिंदी विधान मूल के कानूनी निर्देशात्मक स्वर को बनाए रखता है।
- source_word: זֶה יִהְיֶה לָהֶם
  choice: यही उनके लिए ... होगी
  rationale: यह पद भूमि के नियत किए जाने को व्यक्त करता है; ‘उनके लिए’ स्वामित्व की सीमा को मूल से अधिक निश्चित नहीं बनाता।
- source_word: מִגְרְשֵׁי הֶעָרִים
  choice: नगरों की चरागाह-भूमि
  rationale: यह शब्द नगरों के चारों ओर की खुली या सामुदायिक भूमि को दर्शाता है, जिसका उपयोग प्रायः पशु चराने के लिए होता था। मुख्य पाठ में व्यावहारिक अर्थ दिया गया है और व्यापक अर्थ पादटिप्पणी में रखा गया है।
