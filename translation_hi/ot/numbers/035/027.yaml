  text: וּ/מָצָ֤א אֹת/וֹ֙ גֹּאֵ֣ל הַ/דָּ֔ם מִ/ח֕וּץ לִ/גְב֖וּל עִ֣יר מִקְלָט֑/וֹ וְ/רָצַ֞ח גֹּאֵ֤ל הַ/דָּם֙ אֶת הָ֣/רֹצֵ֔חַ אֵ֥ין ל֖/וֹ דָּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/027.yaml
  text: and the avenger of blood finds him outside the boundary of his city of refuge[a], and the avenger of blood kills the manslayer[b], he is not guilty of blood.
translation:
  language: hi
  text: और यदि खून का बदला लेने वाला[a] उसे उसके शरण-नगर की सीमा के बाहर पा ले, और खून का बदला लेने वाला उस व्यक्ति को मार डाले जिसने किसी मनुष्य को मार डाला था, तो खून का बदला लेने वाला रक्तपात का दोषी न होगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘खून का छुड़ानेवाला/बदला लेने वाला’; इस कानूनी प्रसंग में वह मारे गए व्यक्ति के खून का बदला लेने के लिए अधिकृत व्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी मुहावरे का शाब्दिक रूप है, ‘उसके लिए खून नहीं है,’ अर्थात उस पर रक्तपात का दोष नहीं आता।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: यह पद उस व्यक्ति को सूचित करता है जिसे मारे गए व्यक्ति के खून का बदला लेने का अधिकार था। यह सहज आधुनिक हिन्दी है और मूल में स्पष्ट रूप से न कही गई रिश्तेदारी को नहीं जोड़ती।
- source_word: מִחוּץ לִגְבוּל
  choice: सीमा के बाहर
  rationale: यह शरण-नगर की संरक्षित भौगोलिक और कानूनी सीमा से बाहर होने को व्यक्त करता है।
- source_word: עִיר מִקְלָטוֹ
  choice: उसके शरण-नगर
  rationale: ‘शरण-नगर’ गिनती की इस व्यवस्था के संस्थागत अर्थ को संक्षेप और स्पष्ट रूप में रखता है; संबंधवाचक प्रत्यय को ‘उसके’ से व्यक्त किया गया है।
- source_word: וְרָצַח
  choice: मार डाले
  rationale: यहाँ अगला वाक्य इस कृत्य पर रक्तपात का दोष न लगने की बात कहता है, इसलिए अपराधसूचक ‘हत्या करे’ के बजाय तटस्थ ‘मार डाले’ उपयुक्त है।
- source_word: הָרֹצֵחַ
  choice: उस मनुष्य का वध करनेवाला
  rationale: यह शरण-नगर में आए उस व्यक्ति के लिए कानूनी पद है जिसने किसी मनुष्य को मार डाला था; अनजाने वध की संभावना बनाए रखने के लिए ‘हत्यारा’ से बचा गया है।
- source_word: אֵין לוֹ דָּם
  choice: बदला लेनेवाला रक्तपात का दोषी न होगा
  rationale: यह इब्रानी मुहावरे का कानूनी आशय स्पष्ट करता है कि इस परिस्थिति में बदला लेनेवाले पर उस मृत्यु का रक्त-दोष नहीं आएगा।
theological_decisions:
- issue: अनुमत माने गए वध के प्रसंग में רצח का नैतिक और कानूनी बल
  choice: क्रिया को ‘मार डाले’ कहा गया है, ‘हत्या करे’ नहीं।
  alternative: शब्द-संगति बनाए रखने के लिए ‘हत्या करे’ कहना।
  rationale: पद स्वयं कहता है कि बदला लेनेवाला रक्तपात का दोषी नहीं होगा; इसलिए अपराध सिद्ध कर देनेवाला शब्द मूल कानूनी कथन में अनावश्यक विरोध उत्पन्न करेगा।
- issue: אֵין לוֹ דָּם में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में ‘बदला लेनेवाला’ दोहराकर उसे रक्तपात के दोष से मुक्त बताया गया है।
  alternative: सिर्फ ‘वह दोषी न होगा’ कहकर सर्वनाम-संबंध अस्पष्ट रखना।
  rationale: इब्रानी कानूनी मुहावरे और प्रसंग में दोष-मुक्ति बदला लेनेवाले की है; हिन्दी में केवल ‘वह’ निकटवर्ती वध करनेवाले की ओर गलत संकेत कर सकता था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुकूल रखी गई है। ‘हत्यारा’ और ‘हत्या’ जैसे स्पष्ट अपराधसूचक शब्दों से बचकर अनजाने वध तथा इस पद में दी गई कानूनी दोष-मुक्ति के बीच का तनाव सुरक्षित रखा गया है।
