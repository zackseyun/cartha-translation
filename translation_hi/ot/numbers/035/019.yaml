  text: גֹּאֵ֣ל הַ/דָּ֔ם ה֥וּא יָמִ֖ית אֶת הָ/רֹצֵ֑חַ בְּ/פִגְע/וֹ ב֖/וֹ ה֥וּא יְמִיתֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/019.yaml
  text: The avenger of blood himself shall put the murderer to death; when he meets him[a], he himself shall put him to death.
translation:
  language: hi
  text: रक्त का बदला लेनेवाला[a] स्वयं हत्यारे को मार डाले; जब उसका हत्यारे से सामना हो, तब वह स्वयं उसे मार डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “रक्त का प्रतिशोध लेनेवाला।” इब्रानी में यह उस निकट संबंधी के लिए एक निश्चित कानूनी पद है, जो अवैध रक्तपात का बदला लेने के लिए उत्तरदायी होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: यह इब्रानी व्यवस्था का निश्चित कानूनी पद है, जो उस निकट संबंधी को सूचित करता है जिस पर अन्यायपूर्ण रक्तपात का बदला लेने का दायित्व था। यह अनुवाद ‘छुड़ानेवाला’ जैसे व्यापक अर्थ को यहाँ आरोपित नहीं करता।
- source_word: הוּא
  choice: स्वयं
  rationale: स्वतंत्र सर्वनाम कर्ता पर बल देता है; ‘स्वयं’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יָמִית
  choice: मार डाले
  rationale: מות का हिफ़ील रूप मृत्यु कारित करने का अर्थ देता है। इस प्राचीन कानूनी प्रसंग में ‘मार डाले’ स्पष्ट और सहज है तथा क्रिया की प्रत्यक्षता बनाए रखता है।
- source_word: הָרֹצֵחַ
  choice: हत्यारे
  rationale: רצח गैरकानूनी मानव-वध को दर्शाता है। निकटवर्ती कानूनी संदर्भ में यहाँ मृत्युदंड के योग्य व्यक्ति अभिप्रेत है, इसलिए ‘हत्यारा’ उपयुक्त है।
- source_word: בְּפִגְעוֹ בוֹ
  choice: जब उसका सामना उससे हो
  rationale: פגע यहाँ मिलने या सामना होने का भाव रखता है। यह चयन कालगत अर्थ और दोनों पुरुषवाचक संदर्भों को स्पष्ट रखता है।
- source_word: הוּא יְמִיתֶנּוּ
  choice: वह स्वयं उसे मार डाले
  rationale: दोहराया हुआ स्वतंत्र सर्वनाम और क्रिया नियुक्त कर्ता तथा उसके कार्य पर फिर से बल देते हैं; हिन्दी में पुनरुक्ति को बनाए रखा गया है।
theological_decisions:
- issue: גֹּאֵל הַדָּם की कानूनी भूमिका
  choice: इसे इस्राएली व्यवस्था में रक्तपात का बदला लेने के उत्तरदायी पारिवारिक कानूनी प्रतिनिधि के रूप में प्रस्तुत किया गया है।
  alternative: ‘खून का छुड़ानेवाला’ या ऐसा पद जो व्यापक धार्मिक उद्धार का भाव दे।
  rationale: यह पद यहाँ हत्या-संबंधी नागरिक-कानूनी व्यवस्था का भाग है; अनुवाद में बाद की धार्मिक धारणाएँ आरोपित नहीं की जानी चाहिए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। कानूनी पद को सामान्य पाठक के लिए बोधगम्य बनाया गया है, जबकि मूल की emphatic पुनरुक्ति—‘स्वयं ... स्वयं’—सुरक्षित है।
