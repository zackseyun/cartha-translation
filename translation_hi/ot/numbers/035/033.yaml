  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא תַחֲנִ֣יפוּ אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ בָּ֔/הּ כִּ֣י הַ/דָּ֔ם ה֥וּא יַחֲנִ֖יף אֶת הָ/אָ֑רֶץ וְ/לָ/אָ֣רֶץ לֹֽא יְכֻפַּ֗ר לַ/דָּם֙ אֲשֶׁ֣ר שֻׁפַּךְ בָּ֔/הּ כִּי אִ֖ם בְּ/דַ֥ם שֹׁפְכֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/033.yaml
  text: You shall not pollute the land in which you are[a], for blood pollutes the land, and no atonement can be made for the land for the blood that was shed in it[b], except by the blood of the one who shed it.
translation:
  language: hi
  text: जिस देश में तुम रहते हो, उसे अशुद्ध न करना,[a] क्योंकि खून देश को अशुद्ध करता है। और देश में बहाए गए खून के कारण उस देश के लिए प्रायश्चित केवल उस व्यक्ति के खून से हो सकता है जिसने वह खून बहाया है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसे दूषित न करना।’ इब्रानी क्रिया में देश को नैतिक या पवित्रतासंबंधी रूप से अशुद्ध करने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘देश में बहाए गए खून के सम्बन्ध में देश के लिए प्रायश्चित नहीं किया जा सकता।’
    reason: lexical_alternative
lexical_decisions:
- source_word: תַחֲנִיפוּ / יַחֲנִיף (חנף, Hiphil)
  choice: अशुद्ध करना
  rationale: यहाँ क्रिया खून बहाए जाने से देश के नैतिक और पवित्रतासंबंधी दूषित होने को व्यक्त करती है। ‘अशुद्ध करना’ आधुनिक हिन्दी में सहज है और केवल पर्यावरणीय प्रदूषण का आभास नहीं देता।
- source_word: הָאָרֶץ
  choice: देश
  rationale: सन्दर्भ में यह इस्राएल के निवास-क्षेत्र को सूचित करता है। ‘देश’ हिन्दी में इस विशिष्ट भूभाग का स्वाभाविक बोध कराता है।
- source_word: כִּי הַדָּם הוּא
  choice: क्योंकि खून
  rationale: हिब्रू सर्वनाम कथन को बल देता है, पर हिन्दी में अलग से ‘स्वयं’ जोड़ना अस्वाभाविक और आवश्यकता से अधिक बलयुक्त होता; वाक्य-विन्यास पर्याप्त बल बनाए रखता है।
- source_word: יְכֻפַּר
  choice: प्रायश्चित हो सकता है
  rationale: כפר के निष्क्रिय रूप का आशय देश पर आए रक्त-दोष को दूर करने से है। ‘प्रायश्चित’ धार्मिक-नैतिक अर्थ को सुरक्षित रखते हुए सामान्य हिन्दी पाठक के लिए परिचित है।
- source_word: וְלָאָרֶץ לֹא יְכֻפַּר לַדָּם
  choice: देश में बहाए गए खून के कारण देश के लिए प्रायश्चित
  rationale: यह रूप देश को प्रायश्चित से प्रभावित सत्ता के रूप में और बहाए गए खून को उसके कारण के रूप में बनाए रखता है।
- source_word: שֻׁפַּךְ
  choice: बहाया गया
  rationale: कानूनी सन्दर्भ में खून के लिए ‘बहाया गया’ स्वाभाविक और निकट अर्थ वाला हिन्दी प्रयोग है।
- source_word: כִּי אִם
  choice: केवल
  rationale: यह वाक्यांश एकमात्र उपाय को सूचित करता है; नकारात्मक पूर्ववाक्य के साथ हिन्दी में ‘केवल ... से’ स्पष्ट और सहज है।
- source_word: בְּדַם שֹׁפְכוֹ
  choice: उसी का खून बहाने से जिसने वह खून बहाया था
  rationale: यह हत्या करनेवाले के अपने खून की ओर संकेत स्पष्ट करता है और हिब्रू के साधनवाचक בְּ को ‘से’ द्वारा व्यक्त करता है।
theological_decisions:
- issue: खून बहाए जाने से देश का अशुद्ध होना
  choice: अन्यायपूर्ण रक्तपात देश को वास्तविक नैतिक-पवित्रतासंबंधी अशुद्धता में डालता है, और उस रक्त-दोष का प्रायश्चित खून बहानेवाले के खून से ही होता है।
  alternative: इसे केवल सामाजिक अव्यवस्था का रूपक या मात्र नागरिक दण्ड-विधान माना जाए।
  rationale: חנף की पुनरावृत्ति, כפר का प्रयोग और देश में बहाए गए खून का स्पष्ट उल्लेख नागरिक व्यवस्था से आगे नैतिक-पवित्रतासंबंधी दोष दर्शाते हैं। अनुवाद इसी तनाव को रखता है और बाद की किसी विशेष धर्मसैद्धान्तिक प्रणाली को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध। ‘देश’ से विशिष्ट भूभाग और ‘अशुद्ध’ से नैतिक-पवित्रतासंबंधी दूषण व्यक्त किया गया है। मुख्य पाठ में दोनों पादटिप्पणी चिह्न [a] और [b] उपस्थित हैं।
