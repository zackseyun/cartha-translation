lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया कथानक में वाणी की नई घटना आरम्भ करती है। हिन्दी में इसके साथ आने वाले לֵאמֹר को अलग से दोहराने के बजाय संयुक्त वाक्यांश स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से दर्शाया गया है, किसी उपाधि से नहीं।
- source_word: אֶל
  choice: से
  rationale: ‘किसी से कहना’ आधुनिक मानक हिन्दी में संबोधित व्यक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा में स्थापित रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह आगे आने वाले प्रत्यक्ष कथन की परिचयात्मक रचना है। ‘ने…कहा’ हिन्दी में וַיְדַבֵּר ... לֵאמֹר का अर्थ स्वाभाविक ढंग से समेटता है और अनावश्यक ‘यह कहते हुए’ से बचता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है। ‘यहोवा’ उसका हिन्दी में परिचित नामरूप बनाए रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘याहवे’ स्रोत उच्चारण का अधिक प्रत्यक्ष लिप्यंतरण है पर सामान्य हिन्दी पाठकों में कम स्थापित है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। इब्रानी सूत्र का आशय सुरक्षित रखते हुए हिन्दी में अस्वाभाविक दोहराव (‘बोला…यह कहते हुए’) नहीं रखा गया।
