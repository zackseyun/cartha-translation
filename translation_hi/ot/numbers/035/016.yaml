  text: וְ/אִם בִּ/כְלִ֨י בַרְזֶ֧ל הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/016.yaml
  text: But if he struck him with an iron tool and he died[a], he is a murderer; the murderer must surely be put to death.
translation:
  language: hi
  text: परन्तु यदि किसी ने उसे लोहे की किसी वस्तु[a] से मारा और वह मर गया, तो वह हत्यारा है; उस हत्यारे को निश्चय ही मृत्युदण्ड दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोहे के किसी उपकरण’ अथवा ‘लोहे के किसी साधन’ से। इब्रानी शब्द व्यापक है और अपने-आप में किसी विशेष हथियार का नाम नहीं बताता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह व्यापक विधिक क्रम में एक नई सशर्त स्थिति प्रस्तुत करता है; ‘परन्तु यदि’ प्रसंग के विरोधात्मक आगे बढ़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּכְלִי בַרְזֶל
  choice: लोहे की किसी वस्तु
  rationale: כְּלִי का अर्थ व्यापक है—वस्तु, उपकरण या साधन। ‘वस्तु’ मूल की व्यापकता बनाए रखता है और उसे विशेष रूप से हथियार नहीं ठहराता।
- source_word: הִכָּהוּ
  choice: उसे ... मारा
  rationale: נכה का हिफ़ील रूप यहाँ प्रहार करने को दर्शाता है। ‘मारा’ आधुनिक हिन्दी में स्वाभाविक है और हिंसक क्रिया को स्पष्ट रखता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: यह प्रहार के बाद की घटना को मूल के क्रम में रखता है और स्पष्ट रूप से अतिरिक्त कारणात्मक भाषा नहीं जोड़ता।
- source_word: רֹצֵחַ הוּא
  choice: वह हत्यारा है
  rationale: इस विधिक प्रसंग में רצח दोषपूर्ण मानव-वध और अपराधी की कानूनी पहचान व्यक्त करता है; ‘हत्यारा’ आकस्मिक मृत्यु से आवश्यक भेद बनाए रखता है।
- source_word: מוֹת יוּמַת
  choice: निश्चय ही मृत्युदण्ड दिया जाए
  rationale: इन्फिनिटिव एब्सोल्यूट और निष्क्रिय क्रिया का संयोजन दण्ड की निश्चितता और विधिक अनिवार्यता पर बल देता है।
- source_word: הָרֹצֵחַ
  choice: उस हत्यारे
  rationale: निश्चित रूप अपराधी की अभी-अभी घोषित कानूनी पहचान को दोहराता है; हिन्दी में ‘उस हत्यारे’ संदर्भ को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: इस पद में רצח का विधिक वर्गीकरण
  choice: हत्यारा
  alternative: वध करने वाला
  rationale: अध्याय में आकस्मिक हत्या से भेद किया गया है और यहाँ मृत्युदण्ड निर्धारित है; इसलिए ‘हत्यारा’ पाठ की कानूनी और नैतिक गंभीरता को अधिक ठीक व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज शैली। ‘मृत्युदण्ड’ कानूनी अर्थ को स्पष्ट करता है, जबकि ‘निश्चय ही’ मूल के बलाघात को बनाए रखता है।
