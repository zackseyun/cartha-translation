  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/001.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho, saying,
translation:
  language: hi
  text: 'यरीहो के पास यरदन के किनारे मोआब के मैदानों में याहवे ने मूसा से कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया नए वचन-प्रसंग का आरम्भ करती है। हिंदी में ‘ने…कहा’ इस सूत्र का स्वाभाविक और स्पष्ट रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: हिंदी में ‘कहना’ के साथ संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक कारक है; מֹשֶׁה का मानक हिंदी रूप ‘मूसा’ है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עֲרָבוֹת समतल, खुले मैदानी भूभाग को दर्शाता है। ‘मैदानों’ भौगोलिक अर्थ को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: עַל־יַרְדֵּן יְרֵחוֹ
  choice: यरीहो के पास यरदन के किनारे
  rationale: यह भौगोलिक पदबंध यरीहो के सामने या निकट यरदन से लगे क्षेत्र को बताता है। ‘के पास…के किनारे’ स्थान-संबंध को स्वाभाविक हिंदी में व्यक्त करता है, बिना यह संकेत दिए कि स्थान नदी के ऊपर था।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: हिब्रू में यह आगामी प्रत्यक्ष वचन का परिचय देता है। हिंदी में ‘कहा:’ उसी कार्य को स्वाभाविक रूप से निभाता है; अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से बोझिल होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है और हिब्रू नाम के संभावित उच्चारण का निकट आधुनिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। हिब्रू के दोहरे वचन-सूत्र וַיְדַבֵּר…לֵאמֹר को हिंदी की स्वाभाविक अभिव्यक्ति ‘ने…कहा:’ में समेटा गया है।
