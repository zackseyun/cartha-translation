  text: צַו֮ אֶת בְּנֵ֣י יִשְׂרָאֵל֒ וְ/נָתְנ֣וּ לַ/לְוִיִּ֗ם מִֽ/נַּחֲלַ֛ת אֲחֻזָּתָ֖/ם עָרִ֣ים לָ/שָׁ֑בֶת וּ/מִגְרָ֗שׁ לֶֽ/עָרִים֙ סְבִיבֹ֣תֵי/הֶ֔ם תִּתְּנ֖וּ לַ/לְוִיִּֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/002.yaml
  text: Command the sons of Israel that they give to the Levites[a], from the inheritance of their possession, cities to live in[b]; and you shall give to the Levites pasturelands around the cities.
translation:
  language: hi
  text: “इस्राएलियों[a] को आज्ञा दे कि वे अपनी विरासत में मिली संपत्ति में से लेवियों को रहने के लिए नगर दें; और तुम लेवियों को उन नगरों के चारों ओर की चरागाह-भूमि[b] भी देना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के पुत्रों”; अर्थात इस्राएली लोग।
    reason: lexical_alternative
  - marker: b
    text: यह उस खुली भूमि के लिए प्रयुक्त शब्द है जो नगर के चारों ओर होती थी और विशेष रूप से पशुओं को चराने तथा अन्य सामुदायिक कामों में आती थी।
    reason: cultural_note
lexical_decisions:
- source_word: צַו
  choice: आज्ञा दे
  rationale: इब्रानी आज्ञार्थक क्रिया का बल बनाए रखते हुए यह आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह सामूहिक जातिनाम आधुनिक हिन्दी में स्वाभाविक है; शाब्दिक रूप ‘इस्राएल के पुत्रों’ को पादटिप्पणी में बताया गया है।
- source_word: וְנָתְנוּ
  choice: कि वे ... दें
  rationale: आज्ञा के बाद यह रूप अपेक्षित कार्य को व्यक्त करता है और तीसरे पुरुष बहुवचन को बनाए रखता है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: प्राप्तकर्ता को सूचित करने वाला सीधा और प्रचलित रूप।
- source_word: מִנַּחֲלַת אֲחֻזָּתָם
  choice: अपनी विरासत में मिली संपत्ति में से
  rationale: यह अनुवाद נַחֲלָה की ‘विरासत’ और אֲחֻזָּה की अधिकारगत ‘संपत्ति’—दोनों कानूनी भावों को स्वाभाविक हिन्दी में रखता है।
- source_word: עָרִים לָשָׁבֶת
  choice: रहने के लिए नगर
  rationale: उद्देश्यसूचक infinitive को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: מִגְרָשׁ
  choice: चरागाह-भूमि
  rationale: यह नगर के चारों ओर की खुली सामुदायिक भूमि है, जिसका विशेष उपयोग पशुओं को चराने आदि के लिए होता था; ‘चरागाह-भूमि’ प्रसंग के व्यावहारिक अर्थ को संक्षेप में व्यक्त करती है।
- source_word: לֶעָרִים סְבִיבֹתֵיהֶם
  choice: उन नगरों के चारों ओर की
  rationale: यह नगरों और उनसे संबंधित आसपास की भूमि का संबंध हिन्दी में स्पष्ट करता है।
- source_word: תִּתְּנוּ
  choice: तुम ... देना
  rationale: मूल पाठ में तीसरे पुरुष बहुवचन से दूसरे पुरुष बहुवचन की ओर जो परिवर्तन है, उसे बनाए रखा गया है।
theological_decisions:
- issue: तीसरे पुरुष से दूसरे पुरुष बहुवचन की ओर संबोधन का परिवर्तन
  choice: ‘वे ... दें’ के बाद ‘तुम ... देना’
  alternative: दोनों क्रियाओं को एक ही पुरुष में समतल कर देना
  rationale: मूल इब्रानी में वास्तविक व्याकरणिक परिवर्तन है; उसे बनाए रखने से पाठ की संभावित संबोधन-गतिशीलता सुरक्षित रहती है और कोई व्याख्यात्मक समाधान थोपा नहीं जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘इस्राएलियों’ और ‘रहने के लिए’ जैसे प्रचलित रूप पठनीयता बढ़ाते हैं, जबकि ‘विरासत में मिली संपत्ति’ भूमि-वितरण के कानूनी संदर्भ को सुरक्षित रखता है।
