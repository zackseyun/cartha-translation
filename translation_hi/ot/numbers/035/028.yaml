base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/028.yaml
  text: For he must remain in his city of refuge until the death of the high priest[b][a], and after the death of the high priest the manslayer may return to the land of his possession.
translation:
  language: hi
  text: क्योंकि उसे महायाजक की मृत्यु तक अपने शरण-नगर में ही रहना होगा; और महायाजक की मृत्यु के बाद वह मारने वाला[a] अपनी भूमि-जायदाद पर लौट सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वध करने वाला।’ यहाँ हिब्रू शब्द शरण-नगरों की व्यवस्था में एक कानूनी श्रेणी है; इसका अर्थ अपने-आप ‘हत्यारा’ नहीं मानना चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कानूनी कथन का कारण बताता है; हिंदी में वाक्य के आरंभ में ‘क्योंकि’ इसका स्वाभाविक संकेत है।
- source_word: בְעִיר מִקְלָטוֹ
  choice: अपने शरण-नगर में
  rationale: ‘शरण-नगर’ מִקְלָט के कानूनी और स्थानवाचक अर्थ को संक्षिप्त तथा स्पष्ट रूप से व्यक्त करता है; संबंधसूचक प्रत्यय को ‘अपने’ से दर्शाया गया है।
- source_word: יֵשֵׁב
  choice: रहना होगा
  rationale: मूल क्रिया का अर्थ रहना या निवास करना है, पर इस कानूनी संदर्भ में बाध्यता निहित है; ‘रहना होगा’ दोनों बातों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: महायाजक की मृत्यु तक
  rationale: हिब्रू की संज्ञात्मक रचना और समय-सीमा दोनों सुरक्षित रहती हैं; ‘महायाजक’ इस पदवी का प्रचलित हिंदी रूप है।
- source_word: וְאַחֲרֵי מוֹת הַכֹּהֵן הַגָּדֹל
  choice: और महायाजक की मृत्यु के बाद
  rationale: मूल में पदवी और मृत्यु का पूरा वाक्यांश दोहराया गया है; कानूनी स्पष्टता के लिए हिंदी में भी यह पुनरुक्ति रखी गई है।
- source_word: הָרֹצֵחַ
  choice: वह मारने वाला
  rationale: यहाँ शब्द नगर-शरण संबंधी व्यवस्था की कानूनी श्रेणी को सूचित करता है। ‘हत्यारा’ जानबूझकर हत्या का दोष पहले ही निश्चित कर सकता है, जबकि ‘मारने वाला’ उस निर्णय को आरोपित नहीं करता।
- source_word: יָשׁוּב
  choice: लौट सकता है
  rationale: मृत्यु के बाद पूर्व प्रतिबंध हटने और लौटने की कानूनी अनुमति को व्यक्त करता है; केवल ‘लौटेगा’ भविष्यवाणी जैसा और ‘लौटे’ आदेश जैसा लग सकता है।
- source_word: אֶל אֶרֶץ אֲחֻזָּתוֹ
  choice: अपनी भू-संपत्ति की भूमि पर
  rationale: אֲחֻזָּה पैतृक विरासत मात्र नहीं, अधिकार में मिली स्थावर भूमि या भू-संपत्ति को दर्शाता है। यह रूप संपत्ति-संबंधी कानूनी अर्थ को बनाए रखता है।
theological_decisions:
- issue: הָרֹצֵחַ को नैतिक रूप से निश्चित ‘हत्यारा’ कहा जाए या तटस्थ कानूनी पद से व्यक्त किया जाए
  choice: वह मारने वाला
  alternative: हत्यारा
  rationale: शरण-नगर की व्यवस्था जानबूझकर की गई हत्या और अन्य प्रकार से हुई मनुष्य-वध की घटनाओं में भेद करती है। इसलिए इस पद में ऐसा शब्द उचित है जो इसी वचन में अपराध की प्रकृति का अंतिम निर्णय न कर दे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी आशय के अनुरूप रखी गई है। ‘शरण-नगर’ और ‘महायाजक’ जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि ‘रहना होगा’ और ‘लौट सकता है’ से बाध्यता तथा बाद में मिलने वाली अनुमति का भेद स्पष्ट किया गया है।
