id: NUM.35.18
reference: Numbers 35:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: א֡וֹ בִּ/כְלִ֣י עֵֽץ יָד֩ אֲשֶׁר יָמ֨וּת בּ֥/וֹ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/018.yaml
  text: Or if he struck him with a wooden object in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: hi
  text: या यदि उसने हाथ में पकड़ी लकड़ी की किसी वस्तु[a] से, जिससे किसी की मृत्यु हो सकती है, उसे मारा और वह मर गया, तो जिसने उसे मारा वह हत्यारा है; हत्यारे को निश्चय ही मृत्युदंड दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हाथ में प्रयुक्त लकड़ी के औज़ार/वस्तु से” अथवा “हाथ में थामी हुई लकड़ी की वस्तु से।”
    reason: हिब्रू “लकड़ी की वस्तु ... हाथ” का मुहावरेदार प्रयोग हाथ में पकड़ी या हाथ से चलाई जाने वाली वस्तु का संकेत देता है; वैकल्पिक अभिव्यक्तियाँ इस सूक्ष्मता को दर्शाती हैं।
lexical_decisions:
- source_word: בִּכְלִי עֵץ יָד
  choice: हाथ में पकड़ी लकड़ी की किसी वस्तु से
  rationale: כְּלִי व्यापक अर्थ वाला शब्द है, जो वस्तु, औज़ार या हथियार का बोध करा सकता है; यָד के साथ यहाँ हाथ में पकड़कर प्रयोग की जाने वाली लकड़ी की वस्तु अभिप्रेत है। यह अनुवाद उस व्यापकता को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֲשֶׁר יָמוּת בּוֹ
  choice: जिससे किसी की मृत्यु हो सकती है
  rationale: यह उपवाक्य वस्तु की जान लेने की क्षमता बताता है, केवल इस घटना के परिणाम को नहीं; इसलिए संभाव्यता व्यक्त करने वाला अनुवाद उपयुक्त है।
- source_word: הִכָּהוּ
  choice: उसे मारा
  rationale: נכה का सामान्य अर्थ प्रहार करना या मारना है। हिन्दी में 'उसे मारा' स्वाभाविक है और अगले वाक्यांश में कही गई मृत्यु को समय से पहले नहीं जोड़ता।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: यह हिब्रू के क्रमिक परिणाम को सीधे और स्पष्ट ढंग से व्यक्त करता है।
- source_word: רֹצֵחַ
  choice: हत्यारा
  rationale: इस न्यायिक प्रसंग में यह दोषपूर्ण, जानबूझकर की गई हत्या के अपराधी को दर्शाता है; 'हत्यारा' व्यापक 'मारने वाला' से अधिक सटीक कानूनी-नैतिक अर्थ देता है।
- source_word: מוֹת יוּמַת
  choice: निश्चय ही मृत्युदंड दिया जाए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute दंड की निश्चितता और बल को प्रकट करता है। यह हिन्दी रूप उस जोर को बनाए रखते हुए विधिक शैली में स्वाभाविक है।
theological_decisions:
- issue: हत्या-विधि में רֹצֵחַ का कानूनी वर्गीकरण
  choice: '''हत्यारा'''
  alternative: '''मारने वाला'' या ''वध करने वाला'''
  rationale: निकटवर्ती प्रसंग दोषपूर्ण हत्या और अनजाने में हुई मृत्यु के बीच भेद करता है तथा यहाँ मृत्युदंड निर्धारित करता है। 'हत्यारा' उसी कानूनी-नैतिक निर्णय को बिना अतिरिक्त सांप्रदायिक अर्थ जोड़े स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट विधिक शैली अपनाई गई है। 'हाथ में पकड़ी लकड़ी की किसी वस्तु' मूल के व्यापक כְּלִי और यָד से सूचित हाथ में थामे जाने के भाव—दोनों को व्यक्त करता है।
