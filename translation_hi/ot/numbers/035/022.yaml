  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कानूनी शैली। पद अगले वाक्य में जारी रहने के कारण अन्त में अल्पविराम रखा गया है। मूल पाठ के दो अलग भाव—शत्रुता का अभाव और घात लगाने का अभाव—दोनों स्पष्ट रूप से सुरक्षित रखे गए हैं।
