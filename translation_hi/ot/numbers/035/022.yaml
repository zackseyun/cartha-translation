base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/022.yaml
  text: But if he pushed him suddenly[a], without hostility, or threw any object at him without lying in wait[b],
translation:
  language: hi
  text: परन्तु यदि उसने उसे अचानक, बिना किसी शत्रुता के, धक्का दिया हो, या बिना घात लगाए उस पर कोई वस्तु फेंकी हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: पिछले प्रसंग के जानबूझकर किए गए अपराध के विपरीत एक शर्त प्रस्तुत करता है; इसलिए केवल ‘और यदि’ की अपेक्षा ‘परन्तु यदि’ अधिक उपयुक्त है।
- source_word: בְּפֶתַע
  choice: अचानक
  rationale: यह आकस्मिक या सहसा घटित होने का भाव व्यक्त करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּלֹא אֵיבָה
  choice: बिना किसी शत्रुता के
  rationale: אֵיבָה व्यक्तिगत वैर या शत्रुता को दर्शाता है; यह पदबंध अर्थ को स्पष्ट और सहज रूप में रखता है।
- source_word: הֲדָפוֹ
  choice: उसे ... धक्का दिया हो
  rationale: क्रिया किसी व्यक्ति को धकेलने या ठेलने का अर्थ देती है; ‘धक्का दिया’ सामान्य आधुनिक हिन्दी है।
- source_word: הִשְׁלִיךְ עָלָיו
  choice: उस पर ... फेंकी हो
  rationale: क्रिया और עַל का संयोजन वस्तु को उस व्यक्ति की ओर या उस पर फेंकने का संकेत देता है।
- source_word: כָּל כְּלִי
  choice: कोई वस्तु
  rationale: כְּלִי यहाँ किसी औज़ार, सामान या वस्तु के लिए व्यापक शब्द है; ‘कोई वस्तु’ अनावश्यक संकुचन से बचता है।
- source_word: בְּלֹא צְדִיָּה
  choice: बिना घात लगाए
  rationale: צְדִיָּה घात लगाकर प्रतीक्षा करने या हमला करने की ठोस छवि रखता है; यह अनुवाद आधुनिक कानूनी शब्द ‘पूर्वयोजना’ से अर्थ को अधिक व्यापक बनाने से बचता है।
