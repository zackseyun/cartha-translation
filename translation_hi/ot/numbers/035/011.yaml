  yaml_path: translation/ot/numbers/035/011.yaml
  text: then you shall designate cities for yourselves; they shall be cities of refuge for you, and the manslayer who strikes down a person unintentionally shall flee there.
translation:
  language: hi
  text: तब तुम अपने लिए नगर निर्धारित करोगे[a]; वे तुम्हारे लिए शरण-नगर होंगे। जो कोई अनजाने में किसी व्यक्ति को मार डाले[b], वह वहाँ भाग जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नियुक्त करोगे” अथवा “अलग ठहराओगे।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में भाव है, “अनजाने में किसी व्यक्ति को मारने वाला”; अर्थात यहाँ जानबूझकर की गई हत्या नहीं, बल्कि अनभिप्रेत मानव-वध की बात है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִקְרִיתֶם
  choice: निर्धारित करना
  rationale: हिफ़ील रूप यहाँ कुछ नगरों को चुनकर नियत करने का भाव देता है। कानूनी संदर्भ में ‘निर्धारित करना’ स्वाभाविक और सटीक है।
- source_word: עָרִים ... עָרֵי מִקְלָט
  choice: नगर ... शरण-नगर
  rationale: इब्रानी की पुनरुक्ति को कानूनी स्पष्टता के लिए रखा गया है। ‘शरण-नगर’ सुरक्षित आश्रय के लिए नियत नगरों को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: מִקְלָט
  choice: शरण
  rationale: यहाँ शब्द भागकर पहुँचने के सुरक्षित स्थान को सूचित करता है; ‘शरण’ आधुनिक मानक हिन्दी में सटीक और प्रतिष्ठित है।
- source_word: וְנָס שָׁמָּה
  choice: वह वहाँ भाग जाए
  rationale: कानूनी अनुक्रम में यह रूप भविष्यसूचक होने के साथ व्यवस्था द्वारा उपलब्ध कराए गए उपाय का भाव रखता है; हिन्दी में ‘भाग जाए’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹצֵחַ
  choice: जो कोई ... मार डाले
  rationale: अलग संज्ञा के रूप में ‘हत्यारा’ जानबूझकर हत्या का संकेत दे सकती है। संबंधवाचक वाक्यांश बִּשְׁגָגָה की अनजानेपन वाली योग्यता को सीधे जोड़ता है।
- source_word: מַכֵּה נֶפֶשׁ
  choice: किसी व्यक्ति को मार डाले
  rationale: शाब्दिक रूप से ‘किसी प्राणी/व्यक्ति को प्रहार करने वाला’; इस संदर्भ में प्रहार का परिणाम मृत्यु है, इसलिए ‘मार डाले’ स्पष्ट और प्रसंगानुकूल है।
- source_word: נֶפֶשׁ
  choice: व्यक्ति
  rationale: यहाँ נֶפֶשׁ किसी मनुष्य को सूचित करता है, अमूर्त ‘आत्मा’ को नहीं।
- source_word: בִּשְׁגָגָה
  choice: अनजाने में
  rationale: यह अभिप्राय के अभाव और असावधानी से हुई घटना को व्यक्त करता है; ‘अनजाने में’ जानबूझकर की गई हत्या से कानूनी भेद बनाए रखता है।
theological_decisions:
- issue: मारने वाले का कानूनी वर्गीकरण
  choice: ‘जो कोई अनजाने में किसी व्यक्ति को मार डाले’
  alternative: ‘अनजाने में किसी व्यक्ति को मारने वाला हत्यारा’
  rationale: ‘हत्यारा’ हिन्दी में प्रायः जानबूझकर हत्या करने वाले का बोध कराता है, जबकि मूल पाठ בִּשְׁגָגָה से अनभिप्रेत मानव-वध को स्पष्ट करता है। चुना हुआ संबंधवाचक वाक्यांश मूल के तनाव को बनाए रखते हुए अनुचित नैतिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी, कानूनी संदर्भ के अनुरूप स्पष्ट और गरिमापूर्ण। ‘शरण-नगर’ पारंपरिक बाइबलीय पदावली से मेल खाता है, जबकि ‘अनजाने में ... मार डाले’ साधारण पाठक के लिए सहज है।
