translation:
  language: hi
  text: तब मण्डली मारने वाले और लहू का बदला लेने वाले[a] के बीच इन विधियों[b] के अनुसार न्याय करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लहू का प्रतिशोध लेने वाला’। इब्रानी पदबंध उस व्यक्ति को दर्शाता है जिस पर अपने मारे गए संबंधी के लहू का बदला लेने का दायित्व था।
    reason: lexical_alternative
  - marker: b
    text: या ‘इन न्याय-विधानों’। इब्रानी शब्द कानूनी निर्णयों, नियमों या विधियों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁפְטוּ
  choice: तब ... न्याय करे
  rationale: संयोजक के साथ यह क्रिया कानूनी प्रक्रिया के अगले चरण को व्यक्त करती है; ‘न्याय करे’ न्यायिक अर्थ और विधिक निर्देश—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הָעֵדָה
  choice: मण्डली
  rationale: यह इस्राएल के एकत्रित समुदाय को उसकी सामूहिक न्यायिक भूमिका में दर्शाता है; ‘मण्डली’ औपचारिक और परिचित बाइबलीय हिन्दी है।
- source_word: בֵּין ... וּבֵין
  choice: '... और ... के बीच'
  rationale: दो पक्षों के मध्य न्याय करने की इब्रानी संरचना का स्वाभाविक हिन्दी रूप।
- source_word: הַמַּכֶּה
  choice: मारनेवाले
  rationale: यह נכה के कृदन्त रूप को संक्षेप में दर्शाता है और इस पद में उस व्यक्ति को पहले से ‘हत्यारा’ ठहराने से बचता है।
- source_word: גֹּאֵל הַדָּם
  choice: लहू का बदला लेनेवाले
  rationale: इब्रानी कानूनी पदबंध की छवि और उस नियुक्त भूमिका को बनाए रखता है, जिसमें कोई निकट संबंधी मारे गए व्यक्ति के लहू का बदला लेता था।
- source_word: עַל
  choice: के अनुसार
  rationale: यहाँ न्याय बताए गए कानूनी मानकों के अनुरूप किया जाना है।
- source_word: הַמִּשְׁפָּטִים הָאֵלֶּה
  choice: इन विधियों
  rationale: מִשְׁפָּטִים यहाँ निर्णय को नियंत्रित करने वाले कानूनी नियमों या विधानों को दर्शाता है; ‘विधियों’ से औपचारिक कानूनी भाव स्पष्ट रहता है।
theological_decisions:
- issue: हत्या-संबंधी मामले में समुदाय की न्यायिक भूमिका
  choice: मण्डली मारनेवाले और लहू का बदला लेनेवाले के बीच न्याय करती है, पर मारनेवाले को इस पद में पहले से दोषी हत्यारा नहीं कहा गया।
  alternative: ‘मण्डली’ को केवल किसी संकीर्ण न्यायालय के रूप में लेना, अथवा मारनेवाले को ‘हत्यारा’ कहना।
  rationale: इब्रानी पाठ सामुदायिक न्यायिक प्रक्रिया बताता है और इस चरण पर जानबूझकर हत्या का दोष सिद्ध नहीं करता; इसलिए अनुवाद प्रक्रियात्मक निष्पक्षता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘मारनेवाले’ न्यायिक निष्पक्षता बनाए रखता है; ‘लहू का बदला लेनेवाले’ मूल कानूनी मुहावरे को सुरक्षित रखता है।
