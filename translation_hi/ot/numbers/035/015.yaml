base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/015.yaml
  text: These six cities shall be for refuge for the sons of Israel[a], and for the sojourner and for the resident among them[c][b], so that anyone who kills a person unintentionally may flee there.
translation:
  language: hi
  text: ये छह नगर इस्राएलियों[a] तथा उनके बीच रहने वाले परदेशियों और निवासियों[b] के लिए शरणस्थान होंगे, ताकि जो कोई अनजाने में किसी व्यक्ति को मार डाले[c], वह वहाँ भाग सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों”; या “इस्राएल की संतान।”
    reason: lexical_alternative
  - marker: b
    text: “परदेशी” और “निवासी” दो अलग इब्रानी शब्दों (גֵּר और תּוֹשָׁב) का अनुवाद हैं। ये इस्राएली समाज में रहने वाले गैर-इस्राएली लोगों की अलग श्रेणियों को सूचित करते हैं।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “हर वह जो किसी प्राण/व्यक्ति को मारता है”; यहाँ आशय किसी मनुष्य की मृत्यु का कारण बनने वाले व्यक्ति से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पदबंध के शाब्दिक रूप और उसके मानक जातीय-वाचा-संबंधी नाम, दोनों को बनाए रखता है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह ऐसे गैर-मूल निवासी को दर्शाता है जो इस्राएली समाज के बीच रह रहा हो; ‘परदेशी’ सामान्य हिन्दी में बोधगम्य है और उसके बाहरी मूल को व्यक्त करता है।
- source_word: תּוֹשָׁב
  choice: अस्थायी निवासी
  rationale: यह समुदाय में रहनेवाले, पर पूर्ण मूल-निवासी दर्जा न रखनेवाले व्यक्ति को दर्शाता है। ‘अस्थायी निवासी’ इसे גֵּר से अलग रखते हुए कानूनी-सामाजिक अर्थ को स्पष्ट करता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच रहनेवाले
  rationale: यह परदेशी और अस्थायी निवासी की इस्राएली समुदाय के भीतर उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּהְיֶינָה שֵׁשׁ הֶעָרִים הָאֵלֶּה לְמִקְלָט
  choice: ये छह नगर ... शरणस्थान होंगे
  rationale: यह नगरों की कानूनी नियुक्ति व्यक्त करता है और מִקְלָט को प्रसंगानुकूल ‘शरणस्थान’ के रूप में प्रस्तुत करता है।
- source_word: לָנוּס שָׁמָּה
  choice: वहाँ भाग सके
  rationale: यह उद्देश्यसूचक क्रिया-रूप को स्वाभाविक हिन्दी में संभावना/अनुमति के भाव के साथ व्यक्त करता है।
- source_word: כָּל מַכֵּה נֶפֶשׁ
  choice: किसी व्यक्ति की जान लेनेवाला हर कोई
  rationale: शाब्दिक अर्थ ‘हर वह जो किसी प्राणी/व्यक्ति को मारता है’ है; कानूनी प्रसंग में यह मानव-मृत्यु का कारण बननेवाले व्यक्ति को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: בִּשְׁגָגָה
  choice: अनजाने में
  rationale: यह जानबूझकर हत्या और बिना इरादे हुई मृत्यु के बीच कानूनी भेद को स्पष्ट करता है, बिना घटना को केवल दुर्घटना तक सीमित किए।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंग-सूचक वाचा-संबंधी जातीय पदनाम
  choice: मुख्य पाठ में ‘इस्राएल के पुत्रों’ रखा गया
  alternative: ‘इस्राएलियों’ अथवा ‘इस्राएल की संतान’
  rationale: इब्रानी का पुल्लिंग बहुवचन रूप इस्राएल राष्ट्र का मानक पदनाम है। मुख्य पाठ उसके रूप को सुरक्षित रखता है, जबकि पादटिप्पणी आधुनिक जातिवाचक विकल्प बताती है।
- issue: शरण का अधिकार किन निवासियों तक विस्तृत है
  choice: גֵּר और תּוֹשָׁב को दो अलग सामाजिक श्रेणियों के रूप में रखा गया
  alternative: दोनों को मिलाकर केवल ‘विदेशी निवासियों’ कहना
  rationale: मूल पाठ जानबूझकर दो अलग शब्दों का प्रयोग करता है; उन्हें मिला देने से व्यवस्था के व्यापक दायरे और सामाजिक भेद का एक अंश खो जाएगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘शरणस्थान’ विधिक-धार्मिक प्रसंग को बनाए रखता है, और ‘अनजाने में’ मूल के आशयगत अभाव को ‘दुर्घटनावश’ की अपेक्षा अधिक व्यापक रूप में व्यक्त करता है।
