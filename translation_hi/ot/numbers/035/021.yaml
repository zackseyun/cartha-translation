source:
  edition: WLC
  text: א֣וֹ בְ/אֵיבָ֞ה הִכָּ֤ה/וּ בְ/יָד/וֹ֙ וַ/יָּמֹ֔ת מֽוֹת יוּמַ֥ת הַ/מַּכֶּ֖ה רֹצֵ֣חַֽ ה֑וּא גֹּאֵ֣ל הַ/דָּ֗ם יָמִ֛ית אֶת הָ/רֹצֵ֖חַ בְּ/פִגְע/וֹ בֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/021.yaml
  text: Or if he struck him with his hand in enmity and he died[a], the one who struck him must surely be put to death; he is a murderer[b]. The avenger of blood shall put the murderer to death when he meets him.
translation:
  language: hi
  text: या यदि उसने वैरभाव से उसे अपने हाथ से मारा और वह मर गया, तो जिसने प्रहार किया है, वह निश्चय ही मार डाला जाए; वह हत्यारा है। खून का बदला लेनेवाला जब वह उससे मिले, तो उसे मार डाले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּאֵיבָה
  choice: वैर के कारण
  rationale: אֵיבָה शत्रुता, वैर या घृणा का भाव व्यक्त करता है। “वैर के कारण” कानूनी प्रसंग में जानबूझकर किए गए शत्रुतापूर्ण प्रहार को स्वाभाविक आधुनिक हिन्दी में स्पष्ट करता है, बिना भाव को केवल निजी घृणा तक सीमित किए।
- source_word: הִכָּהוּ בְיָדוֹ
  choice: उसे अपने हाथ से मारा
  rationale: נכה का सामान्य अर्थ मारना या प्रहार करना है, और בְיָדוֹ प्रहार के साधन को स्पष्ट करता है। हिन्दी में यह वाक्यांश सहज रहते हुए मूल संरचना को बनाए रखता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: सरल क्रमसूचक अनुवाद इब्रानी कथन के रूप को सुरक्षित रखता है; प्रसंग से प्रहार और मृत्यु का कारणात्मक संबंध स्पष्ट है।
- source_word: מוֹת יוּמַת
  choice: निश्चय ही मार डाला जाए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute दंड की निश्चितता और जोर को व्यक्त करता है। “निश्चय ही” उस बल को बनाए रखता है और निष्क्रिय कानूनी कथन को स्वाभाविक हिन्दी में देता है।
- source_word: הַמַּכֶּה
  choice: मारनेवाला
  rationale: यह कृदन्त उस व्यक्ति की ओर लौटता है जिसने प्रहार किया। “मारनेवाला” संक्षिप्त, स्पष्ट और मूल पद के निकट है।
- source_word: רֹצֵחַ הוּא
  choice: वह हत्यारा है
  rationale: वैरपूर्वक किए गए घातक प्रहार के इस प्रसंग में רֹצֵחַ जानबूझकर हत्या करनेवाले को सूचित करता है; “हत्यारा” आकस्मिक मृत्यु करानेवाले से कानूनी भेद बनाए रखता है।
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: यह पद इस अध्याय की विशिष्ट कानूनी भूमिका को दर्शाता है। चुना हुआ रूप सामान्य पाठक के लिए अर्थपूर्ण है, जबकि पादटिप्पणी גֹּאֵל में निहित निकट संबंधी की भूमिका स्पष्ट करती है।
- source_word: יָמִית
  choice: उसे मार डाले
  rationale: यह causative क्रिया हत्यारे को मृत्यु देने का आदेश व्यक्त करती है। “मार डाले” स्पष्ट और प्रसंगानुकूल है तथा केवल सामान्य ‘मारे’ से अंतिम परिणाम को अधिक ठीक व्यक्त करता है।
- source_word: בְּפִגְעוֹ בוֹ
  choice: जब उस हत्यारे से मिले
  rationale: यह वाक्यांश किसी से सामना होने या उसे पा लेने का अर्थ देता है। “जब ... मिले” सहज आधुनिक हिन्दी है और मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: जानबूझकर की गई हत्या की कानूनी श्रेणी
  choice: हत्यारा
  alternative: वध करनेवाला
  rationale: पद में वैरपूर्ण मंशा स्पष्ट है, इसलिए यह केवल मृत्यु का कारण बननेवाले व्यक्ति का सामान्य वर्णन नहीं है। “हत्यारा” अध्याय में जानबूझकर की गई हत्या और अनजाने में हुई हत्या के बीच भेद सुरक्षित रखता है।
- issue: גֹּאֵל הַדָּם की कानूनी-सामाजिक भूमिका
  choice: खून का बदला लेनेवाला
  alternative: खून का बदला लेनेवाला निकट संबंधी
  rationale: मुख्य पाठ में पारंपरिक कानूनी पद का अर्थ स्पष्ट रखा गया है, पर “निकट संबंधी” को मुख्य पाठ में जोड़कर मूल वाक्यांश से अधिक स्पष्ट नहीं किया गया। संबंधी होने की सांस्कृतिक-कानूनी धारणा पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण कानूनी शैली में रखी गई है। “निश्चय ही” मूल के जोर को व्यक्त करता है, जबकि “खून का बदला लेनेवाला” प्राचीन इस्राएली संस्था को बिना सांप्रदायिक व्याख्या जोड़े सामान्य पाठक के लिए समझने योग्य बनाता है।
