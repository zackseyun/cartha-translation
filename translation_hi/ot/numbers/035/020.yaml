  text: וְ/אִם בְּ/שִׂנְאָ֖ה יֶהְדָּפֶ֑/נּוּ אֽוֹ הִשְׁלִ֥יךְ עָלָ֛י/ו בִּ/צְדִיָּ֖ה וַ/יָּמֹֽת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/020.yaml
  text: But if he pushed him in hatred[a], or threw something at him intentionally, and he died,
translation:
  language: hi
  text: परन्तु यदि कोई घृणा के कारण उसे धक्का दे, या घात लगाकर[a] उस पर कुछ फेंके, और वह मर जाए,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जानबूझकर” अथवा “दुर्भावना से”; इब्रानी शब्द सोच-समझकर किए गए शत्रुतापूर्ण कार्य का भाव रखता है और उसमें घात लगाने का आशय भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले अनजाने में हुई मृत्यु के प्रसंग के विपरीत एक शर्त प्रस्तुत करता है; इसलिए विरोधसूचक भाव स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בְּשִׂנְאָה
  choice: घृणा के कारण
  rationale: पूर्वसर्ग और संज्ञा यहाँ कार्य की प्रेरणा बताते हैं; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יֶהְדָּפֶנּוּ
  choice: उसे धक्का दे
  rationale: क्रिया का मूल अर्थ धकेलना या जोर से परे करना है; 'धक्का दे' न तो अर्थ को बढ़ाता है, न हिंसक संदर्भ को कम करता है।
- source_word: הִשְׁלִיךְ עָלָיו
  choice: उस पर कुछ फेंके
  rationale: इब्रानी में फेंकी गई वस्तु व्यक्त नहीं है; हिन्दी में वाक्य की सहजता और स्पष्टता के लिए 'कुछ' जोड़ा गया है।
- source_word: בִּצְדִיָּה
  choice: घात लगाकर
  rationale: यह दुर्लभ संज्ञा जानबूझकर की गई शत्रुतापूर्ण कार्रवाई का बोध कराती है और संभवतः घात लगाने का विशिष्ट भाव रखती है; मुख्य पाठ में स्रोत के ठोस बिंब को रखा गया है।
- source_word: וַיָּמֹת
  choice: और वह मर जाए
  rationale: शर्तवाचक कानूनी वाक्य में परिणाम को सरलता से व्यक्त करता है और कारण-संबंध को आवश्यकता से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: בִּצְדִיָּה में जानबूझकर किए गए कार्य और घात लगाने के बीच अर्थ-संबंध
  choice: मुख्य पाठ में 'घात लगाकर', और पाद-टिप्पणी में व्यापक विकल्प
  alternative: '''जानबूझकर'' या ''दुर्भावना से'''
  rationale: स्रोत शब्द की संभावित विशिष्ट छवि को बनाए रखते हुए उसके व्यापक कानूनी आशय को पाद-टिप्पणी में सुरक्षित रखा गया है; इससे हत्या की मंशा के विषय में पाठ को किसी एक संकीर्ण व्याख्या में बंद नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कानूनी-वर्णनात्मक रजिस्टर अपनाया गया है। 'परन्तु' औपचारिक संदर्भ के अनुकूल है, जबकि वाक्य-विन्यास साधारण पाठकों के लिए स्पष्ट रखा गया है।
