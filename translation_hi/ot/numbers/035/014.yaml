base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/014.yaml
  text: You shall appoint three of the cities beyond the Jordan[a], and three of the cities in the land of Canaan[b]; they shall be cities of refuge.
translation:
  language: hi
  text: तुम यरदन के पार[b] के नगरों में से तीन नगर और कनान देश के नगरों में से तीन नगर ठहराओ[a]। वे शरण-नगर होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देना’; इब्रानी क्रिया का शाब्दिक अर्थ ‘देना’ है, पर यहाँ आशय इन नगरों को इस उद्देश्य के लिए नियुक्त या निर्धारित करने से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यरदन के उस पार’ अथवा ‘यरदन के दूसरी ओर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּתְּנוּ / תִּתְּנ֖וּ
  choice: ठहराना
  rationale: נתן का मूल अर्थ ‘देना’ है, पर इस विधिक संदर्भ में नगरों को एक निश्चित उद्देश्य के लिए नियुक्त या अलग करना अभिप्रेत है। ‘ठहराना’ इस प्रशासनिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: यरदन के पार
  rationale: यह संक्षिप्त भौगोलिक अभिव्यक्ति इब्रानी के संबंधपरक अर्थ को बनाए रखती है और अनावश्यक रूप से किसी एक दिशात्मक दृष्टिकोण को निश्चित नहीं करती।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: मूल पाठ में ‘देश’ स्पष्ट रूप से उपस्थित है; यह रूप उसके भौगोलिक और प्रादेशिक बल को सुरक्षित रखता है।
- source_word: עָרֵי מִקְלָט
  choice: शरण-नगर
  rationale: यह अनजाने में हत्या करनेवाले के संरक्षण हेतु निर्धारित नगरों के विधिक पद का स्पष्ट, संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: אֵת שְׁלֹשׁ הֶעָרִים ... וְאֵת שְׁלֹשׁ הֶעָרִים
  choice: नगरों में से तीन ... नगरों में से तीन
  rationale: निश्चित बहुवचन संज्ञा पहले से विचाराधीन नगरों के बड़े समूह में से चुने जाने का संकेत देती है; ‘में से’ इस अंशात्मक अर्थ को स्पष्ट करता है।
- source_word: תִּהְיֶינָה
  choice: वे ... होंगे
  rationale: यह अपूर्ण क्रिया इन छह नगरों की निर्धारित परिणामी स्थिति बताती है; ‘होंगे’ विधिक-भावी अर्थ को सहज रूप से व्यक्त करता है।
