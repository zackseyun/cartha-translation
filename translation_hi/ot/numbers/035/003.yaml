  yaml_path: translation/ot/numbers/035/003.yaml
  text: The cities shall be for them to live in[a], and their pasturelands shall be for their livestock, for their possessions[b], and for all their animals.
translation:
  language: hi
  text: वे नगर उनके रहने के लिए हों, और उनके आसपास की खुली भूमि[a] उनके पशुधन, उनकी संपत्ति और उनके सभी जानवरों के लिए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी चरागाहें” अथवा “उनकी साझा भूमि।” इब्रानी शब्द नगरों के आसपास के खुले क्षेत्र को दर्शाता है, जो यहाँ विशेषकर चराई के काम आता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָרִים
  choice: नगर
  rationale: עִיר बस्ती या नगर को दर्शाता है; इस कानूनी भूमि-वितरण प्रसंग में ‘नगर’ मानक और स्वाभाविक है।
- source_word: לָשָׁבֶת
  choice: रहने के लिए
  rationale: ישׁב के निवास करने के अर्थ और उद्देश्यसूचक infinitive को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִגְרְשֵׁיהֶם
  choice: उनके चारों ओर की खुली भूमि
  rationale: מִגְרָשׁ नगर के आसपास उपयोग हेतु निर्धारित खुले क्षेत्र को दर्शाता है। यह अनुवाद स्थानगत अर्थ को सुरक्षित रखता है और इसे केवल चरागाह तक सीमित नहीं करता।
- source_word: לִבְהֶמְתָּם
  choice: उनके पशुओं के लिए
  rationale: בְּהֵמָה यहाँ सामूहिक रूप से पालतू पशुधन को दर्शाता है; ‘पशु’ सरल और प्रसंगानुकूल है।
- source_word: לִרְכֻשָׁם
  choice: उनकी संपत्ति के लिए
  rationale: רְכוּשׁ का अर्थ संपत्ति या possessions है; ‘संपत्ति’ कानूनी-प्रशासनिक प्रसंग के अनुकूल व्यापक शब्द है।
- source_word: וּלְכֹל חַיָּתָם
  choice: उनके सभी जानवरों के लिए
  rationale: חַיָּה यहाँ जीवित प्राणियों, विशेषतः जानवरों, का दायरा बढ़ाती है; ‘जानवर’ पूर्ववर्ती ‘पशुओं’ से भिन्न शब्द रखते हुए मूल की संभावित व्यापकता दर्शाता है।
