source:
  edition: WLC
  text: וְ/אִ֡ם בְּ/אֶ֣בֶן יָד֩ אֲשֶׁר יָמ֨וּת בָּ֥/הּ הִכָּ֛ה/וּ וַ/יָּמֹ֖ת רֹצֵ֣חַֽ ה֑וּא מ֥וֹת יוּמַ֖ת הָ/רֹצֵֽחַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/017.yaml
  text: Or if he struck him with a stone in the hand[a], by which one could die, and he died, he is a murderer; the murderer must surely be put to death.
translation:
  language: hi
  text: या यदि उसने हाथ में पकड़े पत्थर[a] से, जिससे किसी की मृत्यु हो सकती है, उसे मारा और वह मर गया, तो वह हत्यारा है; हत्यारे को निश्चय ही मृत्युदंड दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘हाथ का पत्थर’ है, अर्थात हाथ में पकड़ा हुआ या हाथ से हथियार के रूप में इस्तेमाल करने योग्य पत्थर।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: या यदि
  rationale: यह कानूनी मामलों की शृंखला में एक और वैकल्पिक स्थिति प्रस्तुत करता है; इसलिए ‘या यदि’ प्रसंग के अनुकूल है।
- source_word: בְּאֶבֶן יָד
  choice: हाथ में पकड़े पत्थर से
  rationale: शाब्दिक वाक्यांश ‘हाथ का पत्थर’ है। चुना हुआ रूप हाथ से हथियार की तरह इस्तेमाल किए जा सकने वाले पत्थर का स्वाभाविक और स्पष्ट अर्थ देता है।
- source_word: אֲשֶׁר יָמוּת בָּהּ
  choice: जिससे किसी की मृत्यु हो सकती है
  rationale: यह पत्थर की प्राणघातक क्षमता बताता है, न कि केवल परिणाम; ‘किसी की’ सामान्य मानवीय संदर्भ को बनाए रखता है।
- source_word: הִכָּהוּ
  choice: उसे मारा
  rationale: नכה का अर्थ यहाँ प्रहार करना है। हिंदी में ‘मारा’ स्वाभाविक है और अगले खंड में अलग से कही गई मृत्यु को पहले से नहीं जोड़ता।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: यह इब्रानी की सीधी क्रमिक रचना और प्रहार के वास्तविक परिणाम को बनाए रखता है।
- source_word: רֹצֵחַ הוּא
  choice: वह हत्यारा है
  rationale: इस न्यायिक संदर्भ में רצח दोषपूर्ण मानव-वध का कानूनी और नैतिक वर्गीकरण करता है; ‘हत्यारा’ तटस्थ ‘मारनेवाला’ से अधिक सटीक है।
- source_word: מוֹת יוּמַת
  choice: निश्चय ही मृत्युदंड दिया जाए
  rationale: इन्फिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल दंड की निश्चितता पर बल देता है; यह हिंदी रूप उस न्यायिक और प्रबल भाव को व्यक्त करता है।
- source_word: הָרֹצֵחַ
  choice: हत्यारे को
  rationale: मूल में अपराधी की संज्ञा दोहराई गई है; हिंदी में इसे दोहराने से वही न्यायिक जोर बना रहता है।
theological_decisions:
- issue: शरण-नगर संबंधी विधान में मारनेवाले का कानूनी वर्गीकरण
  choice: רצח को ‘हत्यारा’ कहना
  alternative: ‘मारनेवाला’ या ‘मनुष्य-वध करनेवाला’
  rationale: आसपास का प्रसंग जानबूझकर किए गए दोषपूर्ण मानव-वध और अनजाने में हुई मृत्यु के बीच भेद करता है। ‘हत्यारा’ पद के कानूनी और नैतिक निर्णय को बिना कोई बाद की सांप्रदायिक धारणा जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी की गरिमापूर्ण, सहज कानूनी शैली अपनाई गई है। ‘मृत्युदंड दिया जाए’ आदेशात्मक न्यायिक भाव रखता है, और मूल की पुनरुक्ति के अनुसार ‘हत्यारा’ दोहराया गया है।
