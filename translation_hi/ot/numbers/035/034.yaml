id: NUM.35.34
reference: Numbers 35:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹ֧א תְטַמֵּ֣א אֶת הָ/אָ֗רֶץ אֲשֶׁ֤ר אַתֶּם֙ יֹשְׁבִ֣ים בָּ֔/הּ אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֣ן בְּ/תוֹכָ֑/הּ כִּ֚י אֲנִ֣י יְהוָ֔ה שֹׁכֵ֕ן בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/034.yaml
  text: And you shall not defile the land in which you dwell[a], in the midst of which I dwell, for I, Yahweh, dwell in the midst of the sons of Israel.
translation:
  language: hi
  text: और उस देश को, जिसमें तुम रहते हो और जिसके बीच में मैं निवास करता हूँ, अशुद्ध न करना; क्योंकि मैं, याहवे, इस्राएल के पुत्रों के बीच निवास करता हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְטַמֵּא
  choice: अशुद्ध करना
  rationale: पिएल रूप यहाँ देश को धार्मिक और नैतिक रूप से दूषित करने का भाव रखता है। ‘अशुद्ध करना’ इस व्यापक बाइबलीय भाव को बनाए रखता है और केवल पर्यावरणीय प्रदूषण का संकेत नहीं देता।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ אֶרֶץ समूची पृथ्वी नहीं, बल्कि वह विशिष्ट देश है जिसमें इस्राएली रहते हैं। आधुनिक हिन्दी में इस वाचा-संबंधी भौगोलिक अर्थ के लिए ‘देश’ स्वाभाविक है।
- source_word: יֹשְׁבִים בָּהּ
  choice: जिस देश में तुम रहते हो
  rationale: ישב का कृदन्त रूप निरंतर निवास को व्यक्त करता है। ‘रहते हो’ वर्तमान हिन्दी में स्वाभाविक रहते हुए मूल अर्थ को स्पष्ट करता है।
- source_word: שֹׁכֵן
  choice: निवास करता हूँ
  rationale: שכן स्थायी उपस्थिति या निवास का बोध देता है और यहाँ परमेश्वर की अपने लोगों के बीच उपस्थिति का धर्मवैज्ञानिक स्वर बनाए रखता है।
- source_word: בְּתוֹכָהּ
  choice: उसी के बीच
  rationale: תוך देश के भीतर या मध्य में उपस्थिति बताता है। ‘उसी के बीच’ पूर्ववर्ती ‘देश’ से संबंध स्पष्ट रखता है और अगले समान पदबंध की पुनरावृत्ति भी सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ निषेध का आधार प्रस्तुत करता है; ‘क्योंकि’ उसका कारणसूचक बल स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल परंपरा में परमेश्वर के व्यक्तिगत वाचा-नाम के लिए ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच
  rationale: यह בני ישראל की रूपात्मक संरचना और पुल्लिंग अभिव्यक्ति को बनाए रखता है तथा हिन्दी में समझने योग्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ नाम को प्रत्यक्ष रखता है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘याहवे’ अधिक समीपी वैकल्पिक लिप्यंतरण है।
- issue: בני ישראל में लिंगसूचक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मुख्य पाठ में मूल की शाब्दिक पुल्लिंग संरचना सुरक्षित रखी गई है। प्रसंग में यह वाचा-समुदाय को सामूहिक रूप से सूचित करता है, पर उस अर्थ को लिंग-निरपेक्ष शब्द से चुपचाप प्रतिस्थापित नहीं किया गया।
- issue: देश में परमेश्वर के निवास की भाषा
  choice: उसी के बीच मैं निवास करता हूँ
  alternative: मैं उसमें निवास करता हूँ
  rationale: मूल में בתוך की दोहराई गई ‘बीच’ की भाषा परमेश्वर की देश और इस्राएलियों के मध्य उपस्थिति को जोड़ती है; इसे बनाए रखा गया है, बिना इसे मन्दिर या तम्बू तक सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। वाक्य की इब्रानी पुनरावृत्ति—‘बीच’ और ‘निवास’—को धर्मवैज्ञानिक तथा साहित्यिक संबंध बनाए रखने के लिए सुरक्षित रखा गया है। कोई पाद-टिप्पणी आवश्यक नहीं समझी गई।
