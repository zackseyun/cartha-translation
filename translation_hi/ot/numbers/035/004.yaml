  yaml_path: translation/ot/numbers/035/004.yaml
  text: And the pasture lands of the cities that you give to the Levites shall be from the wall of the city outward a thousand cubits all around[a][b].
translation:
  language: hi
  text: और उन नगरों की चरागाहें[a], जिन्हें तुम लेवियों को दोगे, नगर की दीवार[b] से बाहर की ओर चारों तरफ़ एक हज़ार हाथ तक होंगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साझी भूमि” अथवा “खुली भूमि”; अर्थात नगरों के चारों ओर की भूमि।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “नगर की दीवार”; कुछ लोग इसे अधिक सामान्य अर्थ में “नगर की सीमा” समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִגְרְשֵׁי
  choice: चरागाहें
  rationale: यह शब्द नगरों के चारों ओर उपयोग के लिए अलग रखी खुली भूमि को दर्शाता है; इस प्रसंग में उसका पशुओं के लिए उपयोग प्रमुख है।
- source_word: הֶעָרִים
  choice: नगरों
  rationale: עִיר का सामान्य अर्थ नगर या शहर है; आसपास के प्रसंग के अनुरूप 'नगर' स्वाभाविक और गरिमापूर्ण है।
- source_word: אֲשֶׁר תִּתְּנוּ
  choice: जिन्हें तुम ... दोगे
  rationale: यह सापेक्ष उपवाक्य भविष्यकालीन निर्देश को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: यह नगरों और उनसे लगी भूमि के प्राप्तकर्ताओं की सीधी पहचान है।
- source_word: מִקִּיר הָעִיר
  choice: नगर की दीवार से
  rationale: קִיר का सीधा अर्थ 'दीवार' है; सम्भावित व्यापक अर्थ 'नगर की सीमा' को पादटिप्पणी में रखा गया है।
- source_word: וָחוּצָה
  choice: बाहर की ओर
  rationale: यह दिशा-सूचक रूप नगर से बाहर की दिशा को व्यक्त करता है।
- source_word: אֶלֶף אַמָּה
  choice: एक हज़ार हाथ
  rationale: प्राचीन माप אַמָּה के लिए प्रचलित हिन्दी बाइबलीय पद 'हाथ' रखा गया है, बिना आधुनिक इकाई में अनुमानित परिवर्तन किए।
- source_word: סָבִיב
  choice: चारों तरफ़
  rationale: यह नगर के पूरे घेरे के चारों ओर माप लागू होने का भाव स्पष्ट करता है।
