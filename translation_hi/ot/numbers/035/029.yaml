- from: और ये नियम तुम्हारी पीढ़ी-दर-पीढ़ी तुम्हारी सभी बस्तियों में न्याय-विधान[a] ठहरेंगे[b]।
  to: और ये तुम्हारे लिए तुम्हारी पीढ़ियों तक, तुम्हारे सभी निवास-स्थानों[b] में, न्याय का विधान[a] होंगे।
  rationale: Recast the verse to state explicitly that these provisions are ‘for you,’ express their continuing force ‘throughout your generations’ as “तुम्हारी पीढ़ियों तक,” and preserve the legal collocation as “न्याय का विधान.” The dwelling-place alternative is now anchored to the corresponding Hindi phrase.
