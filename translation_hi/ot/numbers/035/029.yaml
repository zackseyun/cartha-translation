source:
  edition: WLC
  text: וְ/הָי֨וּ אֵ֧לֶּה לָ/כֶ֛ם לְ/חֻקַּ֥ת מִשְׁפָּ֖ט לְ/דֹרֹתֵי/כֶ֑ם בְּ/כֹ֖ל מוֹשְׁבֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/029.yaml
  text: And these shall be for you a statute of judgment throughout your generations in all your dwelling places[a][b].
translation:
  language: hi
  text: और ये तुम्हारे लिए तुम्हारी पीढ़ियों तक, तुम्हारे सभी निवास-स्थानों[b] में, न्याय का विधान[a] होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्याय-विधान” अथवा “कानूनी विधान।” इब्रानी पद में निर्धारित विधान और न्यायिक निर्णय या प्रक्रिया के अर्थ वाले शब्द साथ आए हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारी सभी बस्तियों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: और ... ठहरेंगे
  rationale: कानूनी प्रसंग में यह रूप भावी और विधिक स्थायित्व व्यक्त करता है; ‘ठहरेंगे’ स्वाभाविक हिंदी में निर्धारित व्यवस्था बने रहने का भाव देता है।
- source_word: אֵלֶּה
  choice: ये नियम
  rationale: बहुवचन संकेतवाचक इससे पहले दिए गए कानूनी प्रावधानों की ओर लौटता है; हिंदी में संदर्भ स्पष्ट करने के लिए ‘नियम’ जोड़ा गया है।
- source_word: לָכֶם
  choice: तुम्हारी
  rationale: यहाँ संबोधन और संबंध/प्रयोजन का भाव है; वाक्य-विन्यास में ‘तुम्हारी ... बस्तियों’ और ‘तुम्हारी पीढ़ी-दर-पीढ़ी’ से संबोधित समुदाय स्पष्ट है, जबकि अलग ‘तुम्हारे लिए’ रखना हिंदी में भारी पड़ता।
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: न्याय-विधान
  rationale: संयुक्त इब्रानी पद अधिनियमित विधान और न्यायिक निर्णय अथवा प्रक्रिया—दोनों कानूनी पहलुओं को जोड़ता है। ‘न्याय-विधान’ इस संयुक्त अर्थ को संक्षेप में रखता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-दर-पीढ़ी
  rationale: यह मुहावरा लगातार आने वाली पीढ़ियों में लागू रहने का अर्थ देता है; ‘पीढ़ी-दर-पीढ़ी’ आधुनिक और सहज हिंदी है।
- source_word: בְּכֹל מוֹשְׁבֹתֵיכֶם
  choice: तुम्हारी सभी बस्तियों में
  rationale: מוֹשָׁב निवास-स्थान या बसावट को सूचित करता है; ‘बस्तियों’ में सामुदायिक निवास-स्थानों का स्वाभाविक अर्थ बना रहता है।
theological_decisions:
- issue: לְחֻקַּת מִשְׁפָּט के दोनों कानूनी पदों का संबंध
  choice: न्याय-विधान
  alternative: न्याय का नियम / कानूनी विधान
  rationale: मूल पाठ जानबूझकर विधान और न्यायिक निर्णय/प्रक्रिया के पद साथ रखता है। संयुक्त अनुवाद किसी विशिष्ट धार्मिक-कानूनी व्याख्या को थोपे बिना दोनों पहलुओं को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण कानूनी रजिस्टर अपनाया गया है। ‘न्याय-विधान’ मूल के संयुक्त कानूनी पद को संक्षिप्त रूप से दर्शाता है; ‘पीढ़ी-दर-पीढ़ी’ और ‘सभी बस्तियों में’ सामान्य पाठक के लिए सहज हैं।
