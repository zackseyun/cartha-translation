  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֣ת הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ לַ/לְוִיִּ֔ם אֵ֚ת שֵׁשׁ עָרֵ֣י הַ/מִּקְלָ֔ט אֲשֶׁ֣ר תִּתְּנ֔וּ לָ/נֻ֥ס שָׁ֖מָּ/ה הָ/רֹצֵ֑חַ וַ/עֲלֵי/הֶ֣ם תִּתְּנ֔וּ אַרְבָּעִ֥ים וּ/שְׁתַּ֖יִם עִֽיר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/006.yaml
  text: And the cities that you give to the Levites shall be the six cities of refuge[a], which you shall give for the manslayer to flee there; and besides them you shall give forty-two cities.
translation:
  language: hi
  text: और जो नगर तुम लेवियों को दोगे, उनमें से छह शरण-नगर होंगे, जिन्हें तुम इसलिए दोगे कि जान लेनेवाला वहाँ भाग सके। इनके अतिरिक्त तुम बयालीस नगर और दोगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָרִים
  choice: नगर
  rationale: עִיר नगर या बस्ती को सूचित करता है; इस कानूनी और भूमि-वितरण के प्रसंग में ‘नगर’ स्वाभाविक और मानक है।
- source_word: לַלְוִיִּם
  choice: लेवियों को
  rationale: दातृवाचक पद उन लोगों को स्पष्ट करता है जिन्हें नगर दिए जाने हैं।
- source_word: שֵׁשׁ עָרֵי הַמִּקְלָט
  choice: छः शरण-नगर
  rationale: מִקְלָט शरण या आश्रय के स्थान को सूचित करता है; ‘शरण-नगर’ इस स्थापित कानूनी संस्था को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: לָנוּס שָׁמָּה
  choice: वहाँ भागकर शरण ले सके
  rationale: נוּס का मूल अर्थ ‘भागना’ है और שָׁמָּה दिशा ‘वहाँ’ बताता है; हिंदी में उद्देश्य और शरण-नगर के कार्य को स्वाभाविक ढंग से व्यक्त करने के लिए ‘भागकर शरण ले सके’ चुना गया है।
- source_word: הָרֹצֵחַ
  choice: मार डालनेवाला
  rationale: यह पद किसी मनुष्य की जान लेनेवाले व्यक्ति को बताता है, पर अपने आप यह निश्चित नहीं करता कि हत्या जानबूझकर हुई या अनजाने में; चुना हुआ रूप इस कानूनी अस्पष्टता को बनाए रखता है।
- source_word: וַעֲלֵיהֶם
  choice: इनके अतिरिक्त
  rationale: यहाँ עַל का प्रयोग भौतिक स्थिति नहीं, बल्कि जोड़ या अतिरिक्त संख्या व्यक्त करता है।
- source_word: אַרְבָּעִים וּשְׁתַּיִם עִיר
  choice: बयालीस नगर
  rationale: इब्रानी में संख्या के बाद एकवचन संज्ञा है, पर स्वाभाविक हिंदी में बहुवचन अर्थ ‘बयालीस नगर’ से व्यक्त होता है।
theological_decisions:
- issue: הָרֹצֵחַ में जानबूझकर या अनजाने में मारने का प्रश्न
  choice: मार डालनेवाला
  alternative: हत्यारा
  rationale: ‘हत्यारा’ प्रायः जानबूझकर हत्या का भाव देता है, जबकि इस पद का इब्रानी शब्द अकेले उस आशय को निश्चित नहीं करता। व्यापक प्रसंग बाद में दोष की प्रकृति का निर्णय करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। लंबी इब्रानी संरचना को हिंदी में तीन वाक्यों में बाँटा गया है; ‘शरण-नगर’ कानूनी संस्था को स्पष्ट करता है और ‘मार डालनेवाला’ मूल की आशयगत अनिश्चितता बनाए रखता है।
