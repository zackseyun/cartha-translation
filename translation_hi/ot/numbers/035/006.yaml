  to: और जो नगर तुम लेवियों को दोगे, उनमें से छह शरण-नगर होंगे, जिन्हें तुम इसलिए दोगे कि जान लेनेवाला वहाँ भाग सके। इनके अतिरिक्त तुम बयालीस नगर और दोगे।
