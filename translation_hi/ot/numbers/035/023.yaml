base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/023.yaml
  text: or with any stone by which one could die[a], without seeing, he dropped it on him so that he died, though he was not his enemy and was not seeking his harm—
translation:
  language: hi
  text: या वह बिना देखे[a] किसी के ऊपर ऐसा कोई पत्थर गिरा दे, जिससे किसी की मृत्यु हो सकती हो, और वह व्यक्ति मर जाए, जबकि जिसने पत्थर गिराया था वह उसका शत्रु न था और न उसका अहित चाहता था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘बिना देखे।’ यह पद जागरूकता के अभाव को सूचित करता है; इसका अर्थ अनिवार्यतः केवल शारीरिक दृष्टि का अभाव नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ
  choice: या
  rationale: यह पिछले पदों में दिए गए कानूनी विकल्पों की शृंखला को आगे बढ़ाता है।
- source_word: בְּכָל אֶבֶן אֲשֶׁר יָמוּת בָּהּ
  choice: कोई ऐसा पत्थर, जिससे किसी की मृत्यु हो सकती हो
  rationale: पत्थर को मृत्यु का कारण बन सकने वाले साधन के रूप में व्यक्त करता है और तीसरे पुरुष एकवचन का सामान्य कानूनी भाव बनाए रखता है।
- source_word: בְּלֹא רְאוֹת
  choice: बिना देखे
  rationale: इब्रानी का ठोस और संक्षिप्त प्रयोग सुरक्षित रहता है; इसे केवल ‘अनजाने में’ कहकर उसका अर्थ पहले से निर्धारित नहीं किया गया।
- source_word: וַיִּפֵּל עָלָיו
  choice: उसे ... उस पर गिरा दे
  rationale: नפל के हिफ़ील रूप की कारणवाचकता और कर्ता की क्रिया दोनों व्यक्त होती हैं।
- source_word: וַיָּמֹת
  choice: और वह मर जाए
  rationale: कानूनी शर्त-वाक्य में क्रिया के घातक परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהוּא לֹא אֹיֵב לוֹ
  choice: जबकि वह उसका शत्रु न था
  rationale: संदर्भ में यह विरोधसूचक-व्याख्यात्मक उपवाक्य है, जो पूर्व शत्रुता के अभाव को स्पष्ट करता है।
- source_word: וְלֹא מְבַקֵּשׁ רָעָתוֹ
  choice: और न उसका अहित चाहता था
  rationale: רָעָה का यहाँ अभिप्राय किसी को हानि पहुँचाने की मंशा है; ‘अहित चाहता था’ संक्षिप्त और स्वाभाविक हिन्दी है।
