source:
  edition: WLC
  text: כָּל מַ֨כֵּה נֶ֔פֶשׁ לְ/פִ֣י עֵדִ֔ים יִרְצַ֖ח אֶת הָ/רֹצֵ֑חַ וְ/עֵ֣ד אֶחָ֔ד לֹא יַעֲנֶ֥ה בְ/נֶ֖פֶשׁ לָ/מֽוּת־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/030.yaml
  text: Whoever strikes down a person[a], the murderer shall be put to death on the testimony of witnesses[b]; but one witness shall not testify against a person for death.
translation:
  language: hi
  text: जो कोई किसी व्यक्ति को मार डाले, उस हत्यारे को गवाहों की गवाही[a] के आधार पर मृत्युदण्ड दिया जाए[b]; लेकिन किसी व्यक्ति के विरुद्ध उसे मृत्युदण्ड देने के लिए एक ही गवाह गवाही न दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “गवाहों के मुँह के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “हत्यारा” और उसे मार डालने की न्यायिक कार्रवाई के लिए एक ही मूल शब्द प्रयुक्त हुआ है। हिन्दी में न्यायालय की कार्रवाई को अवैध हत्या समझे जाने से बचाने के लिए “मृत्युदण्ड दिया जाए” कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַכֵּה נֶפֶשׁ
  choice: किसी व्यक्ति को मार डाले
  rationale: यह पदबंध शाब्दिक रूप से किसी प्राणी/व्यक्ति पर ऐसा प्रहार करने वाले को दर्शाता है जिससे उसकी मृत्यु हो। न्यायिक प्रसंग में ‘व्यक्ति को मार डाले’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נֶפֶשׁ
  choice: व्यक्ति
  rationale: दोनों स्थानों पर נֶפֶשׁ किसी मानव व्यक्ति अथवा उसके जीवन को सूचित करता है; ‘प्राण’ या ‘आत्मा’ यहाँ अनचाहा शरीर-आत्मा भेद उत्पन्न कर सकता है।
- source_word: לְפִי עֵדִים
  choice: गवाहों की गवाही के आधार पर
  rationale: शाब्दिक मुहावरा ‘गवाहों के मुँह के अनुसार’ है, जिसका न्यायिक अर्थ उनकी गवाही के आधार पर है।
- source_word: יִרְצַח אֶת הָרֹצֵחַ
  choice: उस हत्यारे को ... मृत्युदण्ड दिया जाए
  rationale: इब्रानी में अपराधी और उसे मार डालने की न्यायिक कार्रवाई के लिए एक ही רצח धातु प्रयुक्त हुई है। हिन्दी में ‘हत्यारे की हत्या की जाए’ अवैध हत्या का संकेत दे सकता है, इसलिए न्यायिक दण्ड को स्पष्ट किया गया है।
- source_word: הָרֹצֵחַ
  choice: हत्यारा
  rationale: सन्दर्भ उस दोषी वधकर्ता का है जिसे मृत्युदण्ड दिया जाना है; ‘हत्यारा’ आधुनिक हिन्दी में इसका स्पष्ट न्यायिक अर्थ देता है।
- source_word: וְעֵד אֶחָד
  choice: लेकिन ... एक ही गवाह
  rationale: וְ यहाँ पिछले पर्याप्त बहुवचन गवाहों और एक अपर्याप्त गवाह के बीच विरोध दिखाता है; ‘एक ही’ एकमात्र गवाह पर बल देता है।
- source_word: לֹא יַעֲנֶה
  choice: गवाही न दे
  rationale: ענה का न्यायिक प्रयोग साक्ष्य देने या गवाही देने के अर्थ में है।
- source_word: בְנֶפֶשׁ לָמוּת
  choice: किसी व्यक्ति को मृत्यु-दण्ड देने के लिए ... उसके विरुद्ध
  rationale: यह संक्षिप्त न्यायिक पदबंध किसी व्यक्ति के विरुद्ध ऐसी गवाही को सूचित करता है जिसका परिणाम मृत्यु-दण्ड हो; अनुवाद व्यक्ति और दण्ड दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: एक गवाह से सम्बन्धित अंतिम निषेध का स्वरूप
  choice: एक ही गवाह उसके विरुद्ध गवाही न दे
  alternative: एक गवाह की गवाही उसे मृत्यु-दण्ड देने के लिए पर्याप्त न हो
  rationale: चुना गया रूप इब्रानी के कर्तृवाच्य निषेध को बनाए रखता है और उसे केवल प्रमाण की पर्याप्तता के नियम में बदलकर मूल की विधिक अभिव्यक्ति को चुपचाप हल नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। न्यायिक स्वर बनाए रखने के लिए ‘गवाही’, ‘आधार’ और ‘मृत्युदण्ड’ का प्रयोग किया गया है। फुटनोट चिह्न उन शब्दों के ठीक बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
