id: NUM.35.8
reference: Numbers 35:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֶֽ/עָרִ֗ים אֲשֶׁ֤ר תִּתְּנוּ֙ מֵ/אֲחֻזַּ֣ת בְּנֵי יִשְׂרָאֵ֔ל מֵ/אֵ֤ת הָ/רַב֙ תַּרְבּ֔וּ וּ/מֵ/אֵ֥ת הַ/מְעַ֖ט תַּמְעִ֑יטוּ אִ֗ישׁ כְּ/פִ֤י נַחֲלָת/וֹ֙ אֲשֶׁ֣ר יִנְחָ֔לוּ יִתֵּ֥ן מֵ/עָרָ֖י/ו לַ/לְוִיִּֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/008.yaml
  text: And the cities that you give from the possession of the sons of Israel—from the many you shall increase[a], and from the few you shall diminish. Each one, according to his inheritance that they inherit[b], shall give some of his cities to the Levites.
translation:
  language: hi
  text: और जो नगर तुम इस्राएलियों के भूमि-अधिकार में से दोगे, अधिक हिस्से से अधिक नगर देना और कम हिस्से से कम नगर देना। हर गोत्र अपनी उस विरासत के अनुपात में, जो उसे मिलेगी, अपने नगरों में से कुछ नगर लेवियों को दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶעָרִים
  choice: नगर
  rationale: עִיר किसी नगर या बस्ती को दर्शाता है; इस विधिक और भूमि-वितरण के प्रसंग में ‘नगर’ स्वाभाविक तथा पारंपरिक है।
- source_word: אֲחֻזַּת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की जागीर
  rationale: אֲחֻזָּה विरासत में मिली स्थायी भूमि-जायदाद या भू-अधिकार का बोध कराता है। ‘जागीर’ यहाँ आधुनिक निजी संपत्ति की अपेक्षा आवंटित भू-भाग का भाव अधिक संक्षेप में देता है; בְּנֵי יִשְׂרָאֵל का सामूहिक आशय स्वाभाविक हिन्दी में ‘इस्राएली’ है।
- source_word: מֵאֵת הָרַב תַּרְבּוּ וּמֵאֵת הַמְעַט תַּמְעִיטוּ
  choice: जिनके पास अधिक है उनसे अधिक लेना, और जिनके पास कम है उनसे कम लेना
  rationale: इब्रानी वाक्यांश शाब्दिक रूप से ‘अधिक से अधिक करना और कम से कम करना’ कहता है। प्रसंग नगरों के अनुपातिक योगदान का है; हिन्दी में यह रूप उसी आशय को स्पष्ट रखता है, बिना ‘गोत्र’ को दोनों खंडों में अनावश्यक रूप से जोड़ने के।
- source_word: אִישׁ כְּפִי נַחֲלָתוֹ
  choice: हर एक गोत्र अपनी ... विरासत के अनुपात में
  rationale: אִישׁ यहाँ वितरणात्मक एकवचन है और नगर देने वाली इकाइयाँ गोत्र हैं। כְּפִי का अर्थ ‘के माप/अनुपात के अनुसार’ है, इसलिए ‘विरासत के अनुपात में’ आशय को साफ करता है।
- source_word: אֲשֶׁר יִנְחָלוּ
  choice: जो वे पाएँगे
  rationale: יִנְחָלוּ बहुवचन है और सामूहिक गोत्रों/इस्राएलियों की ओर संकेत करता है। ‘विरासत ... पाएँगे’ मूल की विरासत-संबंधी धारणा और बहुवचन दोनों बनाए रखता है।
- source_word: יִתֵּן מֵעָרָיו לַלְוִיִּם
  choice: अपने नगरों में से कुछ लेवियों को दे
  rationale: एकवचन יִתֵּן वितरणात्मक אִישׁ के अनुरूप है; מִן का अंशवाचक अर्थ ‘में से कुछ’ द्वारा स्वाभाविक हिन्दी में व्यक्त होता है।
theological_decisions:
- issue: नगरों के योगदान का अनुपात
  choice: बड़े और छोटे भू-भागों से क्रमशः अधिक और कम नगर लिए जाने का निर्देश
  alternative: ‘अधिक से बढ़ाना और कम से घटाना’ का अत्यंत शाब्दिक रूप
  rationale: प्रसंग लेवियों के नगरों के अनुपातिक आवंटन का है। स्पष्ट अनुवाद न्यायसंगत अनुपात को व्यक्त करता है, पर योगदान की कोई ऐसी गणितीय दर नहीं जोड़ता जो मूल में नहीं है।
- issue: אִישׁ का संदर्भ
  choice: ‘हर एक गोत्र’
  alternative: ‘हर व्यक्ति’ या ‘हर एक’
  rationale: नगर व्यक्तिगत इस्राएलियों के बजाय गोत्रीय भू-भागों से दिए जाते हैं। संदर्भगत संज्ञा जोड़ना विधिक आशय स्पष्ट करता है और किसी सांप्रदायिक व्याख्या को आयात नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक निर्देश का गरिमापूर्ण पर सहज रूप रखा गया है। ‘लेना’ का प्रयोग संबोधित समुदाय के दृष्टिकोण से है, जबकि अंतिम वाक्य प्रत्येक गोत्र की देनदारी बताता है। बहुवचन יִנְחָלוּ को ‘वे पाएँगे’ में सुरक्षित रखा गया है।
