  to: और जो नगर तुम इस्राएलियों के भूमि-अधिकार में से दोगे, अधिक हिस्से से अधिक नगर देना और कम हिस्से से कम नगर देना। हर गोत्र अपनी उस विरासत के अनुपात में, जो उसे मिलेगी, अपने नगरों में से कुछ नगर लेवियों को दे।
