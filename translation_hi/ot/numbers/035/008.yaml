review_pass:
  verdict: revise
  source_fidelity: Draft reverses the direction of the central command by saying ‘लेना’ (take), whereas the Hebrew addresses Israel and commands them to give more cities from the larger allotment and fewer from the smaller. ‘जागीर’ is historically and register-wise misleading for אֲחֻזָּה, a landholding/possession. The revised wording retains the proportional sense without claiming a precise formula.
  naturalness: The revision uses idiomatic modern Hindi legal-instructional phrasing. ‘भूमि-अधिकार’ is clearer and less feudal than ‘जागीर’; ‘अधिक हिस्से’ and ‘कम हिस्से’ supply the contextual reference naturally.
  terminology: नगर and लेवी appropriate. ‘इस्राएलियों’ naturally conveys בני ישראל as the covenant people. ‘विरासत’ preserves the inheritance terminology. ‘हर गोत्र’ is contextually warranted by the immediately preceding tribal land allotments and the allocation of Levitical cities.
  issues:
  - severity: high
    issue: ‘...अधिक लेना...कम लेना’
    rationale: This makes the addressees take cities rather than give them, reversing the Hebrew תַּרְבּוּ / תַּמְעִיטוּ in context and the explicit final verb ‘shall give.’
  - severity: medium
    issue: ‘जागीर’ for אֲחֻזָּה
    rationale: ‘जागीर’ commonly evokes a feudal grant and can introduce an anachronistic institutional sense. ‘भूमि-अधिकार’ better represents an inherited landholding.
  - severity: low
    issue: Footnote describes ‘बड़े भू-भाग’ and ‘छोटे भू-भाग’ as though explicit
    rationale: The Hebrew says literally ‘the much’ and ‘the little’; the context supports proportional allotments, but the note should identify ‘हिस्सा/आवंटन’ as contextual sense rather than make ‘भू-भाग’ the lexical wording.
  revised_text: और जो नगर तुम इस्राएलियों के भूमि-अधिकार में से दोगे, अधिक हिस्से से अधिक नगर देना और कम हिस्से से कम नगर देना। हर गोत्र अपनी उस विरासत के अनुपात में, जो उसे मिलेगी, अपने नगरों में से कुछ नगर लेवियों को दे।
  revised_footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अधिक से अधिक करना, और कम से कम करना।” प्रसंग में आशय है कि बड़े हिस्से या आवंटन से अधिक नगर और छोटे हिस्से या आवंटन से कम नगर दिए जाएँ।
    reason: lexical_alternative
  revision_rationale: ‘लेना’ को ‘देना’ किया गया है ताकि आदेश की दिशा मूल के अनुरूप रहे। אֲחֻזָּה के लिए ‘भूमि-अधिकार’ चुना गया है, जो वंशानुगत भूमि-हिस्से का भाव देता है और ‘जागीर’ के सामंती संकेत से बचता है। अनुपातिक वितरण को ‘अधिक हिस्से’ और ‘कम हिस्से’ से व्यक्त किया गया है। वितरणात्मक אִישׁ को संदर्भानुकूल ‘हर गोत्र’ से स्पष्ट किया गया है; ‘अपनी ... विरासत’ और ‘अपने नगरों’ में उसका वितरणात्मक कार्य सुरक्षित है.
