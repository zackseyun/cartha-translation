  text: And the cities that you give shall be six cities of refuge for you.
translation:
  language: hi
  text: और जो नगर तुम दोगे, वे तुम्हारे लिए छह शरण-नगर होंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֶ/עָרִים
  choice: और जो नगर
  rationale: संयोजक וְ को ‘और’ से व्यक्त किया गया है। हिन्दी में संबंधवाचक उपवाक्य के साथ ‘जो नगर’ स्वाभाविक है और निश्चित नगरों की ओर संकेत करता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: संबंधवाचक अव्यय को आधुनिक हिन्दी के स्वाभाविक संबंधवाचक रूप ‘जो’ से व्यक्त किया गया है।
- source_word: תִּתֵּנוּ
  choice: तुम दोगे
  rationale: נתן के काल, द्वितीय पुरुष बहुवचन रूप का भावी अर्थ इस निर्देशात्मक संदर्भ में ‘तुम दोगे’ से स्पष्ट और सहज रूप में व्यक्त होता है।
- source_word: שֵׁשׁ
  choice: छः
  rationale: मूल संख्या का सीधा हिन्दी रूप।
- source_word: עָרֵי מִקְלָט
  choice: शरण के ... नगर
  rationale: इब्रानी संबंध-रचना का पारदर्शी हिन्दी रूप; ‘शरण-नगर’ की अपेक्षा यह सामान्य पाठक के लिए अधिक स्पष्ट और स्वाभाविक है।
- source_word: תִּהְיֶינָה
  choice: होंगे
  rationale: היה के स्त्रीलिंग बहुवचन अपूर्ण रूप का भावी/निर्देशात्मक बल हिन्दी में ‘होंगे’ से स्वाभाविक ढंग से व्यक्त होता है।
- source_word: לָ/כֶם
  choice: तुम्हारे लिए
  rationale: לְ के लाभार्थक/संबंधसूचक अर्थ को ‘तुम्हारे लिए’ ठीक प्रकार व्यक्त करता है।
