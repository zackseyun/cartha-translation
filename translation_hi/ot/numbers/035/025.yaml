  text: וְ/הִצִּ֨ילוּ הָ/עֵדָ֜ה אֶת הָ/רֹצֵ֗חַ מִ/יַּד֮ גֹּאֵ֣ל הַ/דָּם֒ וְ/הֵשִׁ֤יבוּ אֹת/וֹ֙ הָֽ/עֵדָ֔ה אֶל עִ֥יר מִקְלָט֖/וֹ אֲשֶׁר נָ֣ס שָׁ֑מָּ/ה וְ/יָ֣שַׁב בָּ֗/הּ עַד מוֹת֙ הַ/כֹּהֵ֣ן הַ/גָּדֹ֔ל אֲשֶׁר מָשַׁ֥ח אֹת֖/וֹ בְּ/שֶׁ֥מֶן הַ/קֹּֽדֶשׁ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/025.yaml
  text: Then the congregation shall rescue the manslayer from the hand of the avenger of blood[a], and the congregation shall return him to his city of refuge, where he fled; and he shall live in it until the death of the high priest[c][b], whom he was anointed with the holy oil.
translation:
  language: hi
  text: तब मंडली उस जान लेनेवाले को खून का बदला लेनेवाले[a] के हाथ से बचाएगी और उसे उसके शरण-नगर में लौटा देगी, जहाँ वह भागकर गया था। वह उस नगर में उस महायाजक की मृत्यु तक रहेगा[b], जिसका उसने पवित्र तेल से अभिषेक किया था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खून का प्रतिशोध लेनेवाला।” इब्रानी पद उस व्यक्ति को दर्शाता है जिस पर बहाए गए खून का बदला लेने की कानूनी जिम्मेदारी थी; वह प्रायः निकट संबंधी होता था।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “वहीं निवास करेगा” या “वहीं बना रहेगा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “जिसका उसने पवित्र तेल से अभिषेक किया था।” इब्रानी में “अभिषेक किया” का कर्ता स्पष्ट नहीं बताया गया है। अनेक अनुवाद इसे निष्क्रिय रूप में, “जिसका अभिषेक किया गया था,” कहते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: הִצִּילוּ
  choice: बचाएगी
  rationale: हिफ़ील रूप यहाँ किसी को दूसरे के अधिकार या आक्रमण से छुड़ाने का अर्थ देता है; कानूनी-सुरक्षात्मक प्रसंग में ‘बचाएगी’ स्वाभाविक और स्पष्ट है।
- source_word: הָעֵדָה
  choice: मण्डली
  rationale: गिनती में यह शब्द न्यायिक रूप से कार्य करनेवाले एकत्रित समुदाय को दर्शाता है; ‘मण्डली’ उसके औपचारिक सामुदायिक भाव को बनाए रखता है।
- source_word: הָרֹצֵחַ
  choice: जान लेनेवाला
  rationale: इस अध्याय में यह पद जानबूझकर और अनजाने में जान लेने, दोनों के संदर्भ में आ सकता है। ‘हत्यारा’ दोष सिद्ध होने का भाव ला सकता है, जबकि ‘जान लेनेवाला’ कानूनी अनिर्णय बनाए रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: यह इब्रानी मुहावरे का निकट और हिन्दी में समझ में आनेवाला रूप है, जो किसी के वश या पकड़ से छुड़ाने का भाव देता है।
- source_word: גֹּאֵל הַדָּם
  choice: खून का बदला लेनेवाला
  rationale: यह उस व्यक्ति की मान्य कानूनी भूमिका बताता है जिसे बहाए गए खून का बदला लेने का दायित्व था। निकट संबंधी होना प्रायः निहित है, पर इस पद में स्पष्ट नहीं, इसलिए मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וְהֵשִׁיבוּ אֹתוֹ
  choice: उसे ... लौटा देगी
  rationale: שוב का हिफ़ील किसी को वापस पहुँचाने का अर्थ देता है; ‘लौटा देगी’ वर्तमान हिन्दी में स्वाभाविक है।
- source_word: עִיר מִקְלָטוֹ
  choice: उसके शरण-नगर
  rationale: यह अध्याय में स्थापित कानूनी संस्था का संक्षिप्त और स्पष्ट हिन्दी नाम है।
- source_word: אֲשֶׁר נָס שָׁמָּה
  choice: जहाँ वह भागकर गया था
  rationale: वाक्यांश उस नगर को भागकर पहुँचने के स्थान के रूप में पहचानता है; हिन्दी में यह दिशा और गंतव्य दोनों को सहज रूप से व्यक्त करता है।
- source_word: וְיָשַׁב בָּהּ
  choice: वह उस नगर में ... रहे
  rationale: ישב यहाँ निवास करने या बने रहने का अर्थ रखता है; ‘रहे’ दोनों भावों के लिए स्वाभाविक है और वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עַד מוֹת הַכֹּהֵן הַגָּדֹל
  choice: उस महायाजक की मृत्यु तक
  rationale: इब्रानी संज्ञात्मक रचना को निकटता से रखते हुए प्रचलित धार्मिक पद ‘महायाजक’ अपनाया गया है।
- source_word: אֲשֶׁר מָשַׁח אֹתוֹ
  choice: जिसका उसने ... अभिषेक किया था
  rationale: इब्रानी क्रिया सक्रिय, तृतीय पुरुष एकवचन है और महायाजक उसका कर्म है; कर्ता व्यक्त नहीं किया गया। हिन्दी में ‘उसने’ सक्रिय रूप रखता है, जबकि पादटिप्पणी अस्पष्ट कर्ता की ओर ध्यान दिलाती है।
- source_word: בְּשֶׁמֶן הַקֹּדֶשׁ
  choice: पवित्र तेल से
  rationale: यह अभिषेक के लिए प्रयुक्त पवित्र तेल का निकट, स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: शरण-नगर की व्यवस्था में הָרֹצֵחַ की कानूनी स्थिति
  choice: ‘जान लेनेवाला’ रखा गया, जिससे अभी दोष सिद्ध न माना जाए।
  alternative: ‘हत्यारा’ या ‘खूनी’
  rationale: अध्याय जानबूझकर की गई हत्या और अनजाने में हुई मृत्यु में भेद करता है। दोषसूचक शब्द तत्काल प्रसंग से अधिक निर्णय आरोपित कर देते।
- issue: מָשַׁח אֹתוֹ का अप्रकट कर्ता
  choice: सक्रिय रूप ‘जिसका उसने ... अभिषेक किया था’ रखा गया और कर्ता की अस्पष्टता पादटिप्पणी में बताई गई।
  alternative: ‘जिसका पवित्र तेल से अभिषेक हुआ था’ या ‘जिसका अभिषेक किया गया था’
  rationale: मसोरेटिक पाठ में क्रिया सक्रिय है और उसका कर्ता स्पष्ट नहीं है। निष्क्रिय रूप हिन्दी में सहज होता, पर वह मूल वाक्य-विन्यास की वास्तविक अस्पष्टता को चुपचाप सुलझा देता।
