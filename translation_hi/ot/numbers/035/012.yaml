  text: וְ/הָי֨וּ לָ/כֶ֧ם הֶ/עָרִ֛ים לְ/מִקְלָ֖ט מִ/גֹּאֵ֑ל וְ/לֹ֤א יָמוּת֙ הָ/רֹצֵ֔חַ עַד עָמְד֛/וֹ לִ/פְנֵ֥י הָ/עֵדָ֖ה לַ/מִּשְׁפָּֽט־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/012.yaml
  text: The cities shall be for you as a refuge from the avenger[a], so that the manslayer may not die until he stands before the congregation for judgment.
translation:
  language: hi
  text: ये नगर तुम्हारे लिए बदला लेने वाले[a] से बचाव के शरण-स्थान हों, ताकि प्राण लेने वाला तब तक न मरे, जब तक वह न्याय किए जाने के लिए सभा के सामने खड़ा न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘लहू का बदला लेने वाला’ अथवा ‘बदला लेने वाला निकट संबंधी।’ इब्रानी गोएल नातेदारी का पद है; यहाँ यह उस व्यक्ति को दर्शाता है जो बहाए गए लहू का बदला लेता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיוּ
  choice: हों
  rationale: कानूनी निर्देश में यह रूप भावी और विधिसूचक बल रखता है; ‘हों’ हिंदी में निर्देश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֶעָרִים
  choice: ये नगर
  rationale: निश्चित पद निकट संदर्भ में पहले से निर्धारित नगरों की ओर संकेत करता है; हिंदी में ‘ये नगर’ उस संदर्भ को स्पष्ट रखता है।
- source_word: לְמִקְלָט
  choice: बचने के आश्रय-स्थान
  rationale: מִקְלָט सुरक्षा और शरण के स्थान को दर्शाता है। ‘आश्रय-स्थान’ संज्ञात्मक अर्थ बनाए रखता है, और ‘बचने के’ अगले पद से संबंध स्वाभाविक करता है।
- source_word: מִגֹּאֵל
  choice: बदला लेनेवाले
  rationale: גֹאֵל मूलतः निकट संबंधी की भूमिका का पद है; हत्या-विधि के इस प्रसंग में वह रक्तपात का बदला लेनेवाला है। मुख्य पाठ में संक्षिप्त और बोधगम्य रूप रखा गया है तथा संबंधी और लहू के बदले का भाव पाद-टिप्पणी में दिया गया है।
- source_word: וְלֹא יָמוּת
  choice: ताकि ... न मरे
  rationale: यह आश्रय-व्यवस्था का उद्देश्य या परिणाम बताता है। ‘न मरे’ मूल क्रिया की अकर्मक अभिव्यक्ति बनाए रखता है और मृत्यु की एजेंसी को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: הָרֹצֵחַ
  choice: प्राण लेनेवाला
  rationale: רֹצֵחַ यहाँ ऐसे व्यक्ति की कानूनी श्रेणी है जिसने किसी का प्राण लिया है, पर जिसका दोष अभी सभा द्वारा निर्धारित नहीं हुआ। ‘हत्यारा’ प्रायः जानबूझकर हत्या और सिद्ध दोष का भाव दे सकता है; ‘प्राण लेनेवाला’ निर्णय-पूर्व तटस्थता रखता है।
- source_word: עַד עָמְדוֹ
  choice: उस समय तक ... जब तक वह ... खड़ा न हो
  rationale: עַד के साथ क्रियार्थक संज्ञा और प्रत्यय स्वाभाविक हिंदी में समय-सीमा वाले उपवाक्य से व्यक्त होते हैं।
- source_word: לִפְנֵי הָעֵדָה
  choice: सभा के सामने
  rationale: עֵדָה यहाँ न्यायिक भूमिका में एकत्र समुदाय को दर्शाता है। ‘सभा’ आधुनिक हिंदी में औपचारिक सामुदायिक निकाय का स्पष्ट और स्वाभाविक पद है।
- source_word: לַמִּשְׁפָּט
  choice: न्याय के लिए
  rationale: מִשְׁפָּט यहाँ न्यायिक सुनवाई और निर्णय दोनों को समेट सकता है। ‘न्याय के लिए’ इस व्यापकता को बनाए रखता है; केवल ‘मुकदमे’ कहना अर्थ को कुछ संकरा कर देता।
theological_decisions:
- issue: न्यायिक निर्णय से पहले הָרֹצֵחַ की कानूनी स्थिति
  choice: ‘प्राण लेनेवाला’—दोष सिद्ध किए बिना घटना का वर्णन
  alternative: ‘हत्यारा’ या ‘खूनी’
  rationale: पद स्वयं सभा के सामने न्याय होने तक व्यक्ति की मृत्यु रोकता है। इसलिए अनुवाद को पहले से यह निर्धारित नहीं करना चाहिए कि हत्या जानबूझकर की गई थी या व्यक्ति दोषी सिद्ध हो चुका था।
- issue: हत्या-विधि में גֹאֵל का विशिष्ट अर्थ
  choice: मुख्य पाठ में ‘बदला लेनेवाला’, पाद-टिप्पणी में ‘लहू का बदला लेनेवाला’ और निकट संबंधी की भूमिका
  alternative: मुख्य पाठ में ‘लहू का बदला लेनेवाला संबंधी’
  rationale: यह पद संबंधी के छुटकारा दिलाने और अधिकार बहाल करने जैसे व्यापक कार्यों में भी प्रयुक्त होता है, पर यहाँ उसका कार्य रक्तपात का बदला लेना है। मुख्य पाठ पठनीय रखा गया है और मूल पद की संबंधपरक विशिष्टता पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज कानूनी शैली रखी गई है। ‘सभा’ और ‘न्याय’ मूल की औपचारिकता बनाए रखते हैं। ‘प्राण लेनेवाला’ कुछ व्याख्यात्मक है, पर ‘हत्यारा’ से जुड़ी पूर्व-दोषसिद्धि से बचता है और इस शरण-नगर प्रसंग की न्यायिक अनिश्चितता को सुरक्षित रखता है।
