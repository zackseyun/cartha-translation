language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם יָצֹ֥א יֵצֵ֖א הָ/רֹצֵ֑חַ אֶת גְּבוּל֙ עִ֣יר מִקְלָט֔/וֹ אֲשֶׁ֥ר יָנ֖וּס שָֽׁמָּ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/026.yaml
  text: But if the manslayer does indeed go out beyond the boundary of his city of refuge, to which he fled,[a]
translation:
  language: hi
  text: पर यदि वह व्यक्ति जिसने किसी की जान ली थी, सचमुच अपने शरण-नगर की सीमा के बाहर निकल जाए जहाँ वह भागकर गया था,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने शरण-नगर की सीमा के पार निकल जाए जहाँ वह भागकर गया था।” इब्रानी में बल देने के लिए एक ही धातु के इन्फिनिटिव एब्सोल्यूट और रूपांतरित क्रिया का प्रयोग हुआ है—शाब्दिक रूप से, “निकलना निकल जाए।”
    reason: वाक्य-संबंध की वैकल्पिक अभिव्यक्ति और इब्रानी क्रिया-बलाघात को स्पष्ट करना।
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पिछले कानूनी निर्देश के विपरीत एक शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘पर यदि’ स्वाभाविक और स्पष्ट है।
- source_word: יָצֹא יֵצֵא
  choice: सचमुच ... बाहर निकल जाए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute क्रिया पर बल देता है। ‘सचमुच’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָרֹצֵחַ
  choice: वध करने वाला व्यक्ति
  rationale: शरण-नगर के इस प्रसंग में यह शब्द किसी की जान लेने वाले व्यक्ति को सूचित करता है, पर आवश्यक रूप से दोषी हत्यारे को नहीं; इसलिए ‘हत्यारा’ की अपेक्षा यह चयन कानूनी अस्पष्टता बनाए रखता है।
- source_word: אֶת גְּבוּל
  choice: सीमा से बाहर
  rationale: יצא के साथ यह पद सीमा पार करके उसके बाहर जाने का भाव देता है।
- source_word: עִיר מִקְלָטוֹ
  choice: अपने उस शरण-नगर
  rationale: ‘शरण-नगर’ कानूनी संस्था को स्पष्ट करता है और ‘अपने’ इब्रानी प्रत्यय को व्यक्त करता है; ‘उस’ अगले संबंधवाचक उपवाक्य से नगर को जोड़ता है।
- source_word: אֲשֶׁר יָנוּס שָׁמָּה
  choice: जहाँ वह भागकर गया था
  rationale: שָׁמָּה में निहित दिशात्मक अर्थ और पूर्व में उस नगर में भागकर पहुँचने की घटना, दोनों स्वाभाविक हिन्दी में व्यक्त होते हैं।
theological_decisions:
- issue: वध करने वाले व्यक्ति की दोषिता
  choice: ‘वध करने वाला व्यक्ति’—एक तटस्थ कानूनी वर्णन
  alternative: ‘हत्यारा’
  rationale: इस व्यवस्था में शरण पाने वाला व्यक्ति अनजाने में भी किसी को मार सकता था; ‘हत्यारा’ जानबूझकर हत्या करने या सिद्ध दोषिता का अनावश्यक संकेत दे सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। कानूनी प्रसंग की तटस्थता बनाए रखने के लिए ‘हत्यारा’ के स्थान पर ‘वध करने वाला व्यक्ति’ रखा गया है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
