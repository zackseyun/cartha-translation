source:
  edition: WLC
  text: וְ/לֹא תִקְח֣וּ כֹ֔פֶר לָ/נ֖וּס אֶל עִ֣יר מִקְלָט֑/וֹ לָ/שׁוּב֙ לָ/שֶׁ֣בֶת בָּ/אָ֔רֶץ עַד מ֖וֹת הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/032.yaml
  text: And you shall not take a ransom for him who has fled to his city of refuge[b][a], so that he may return to live in the land before the death of the priest.
translation:
  language: hi
  text: और जो व्यक्ति अपने शरण-नगर में भाग आया है, उससे कोई छुड़ौती[a] न लेना, जिससे वह याजक की मृत्यु से पहले लौटकर देश में रह सके।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्षतिपूर्ति’ अथवा ‘भुगतान’; इब्रानी शब्द ऐसी कीमत या क्षतिपूर्ति को दर्शाता है जो किसी कानूनी परिणाम के बदले दी जाए।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी वाक्य-विन्यास संक्षिप्त है। इसे शरण-नगर में उसके बने रहने अथवा याजक की मृत्यु से पहले वहाँ से लौटने से जुड़े भुगतान के निषेध के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כֹּפֶר
  choice: छुड़ौती
  rationale: यह शब्द ऐसी कीमत या क्षतिपूर्ति को दर्शाता है जो निर्धारित कानूनी परिणाम के बदले स्वीकार की जाए; ‘छुड़ौती’ इस कानूनी भाव को संक्षेप में रखती है।
- source_word: לָנוּס
  choice: जो ... भागा है
  rationale: נוּס का मूल अर्थ ‘भागना’ है। शरण-नगर के प्रसंग में पूर्ण हो चुकी शरण-यात्रा को स्वाभाविक हिन्दी में व्यक्त करने के लिए संबंधवाचक वाक्यांश रखा गया है, जबकि संक्षिप्त इब्रानी रचना की अस्पष्टता पाद-टिप्पणी में सुरक्षित है।
- source_word: עִיר מִקְלָטוֹ
  choice: अपने शरण-नगर
  rationale: यह निर्धारित आश्रय-नगर के लिए प्रचलित कानूनी पद है; संबंधसूचक प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: לָשׁוּב לָשֶׁבֶת בָּאָרֶץ
  choice: लौटकर देश में रहने लगे
  rationale: दोनों infinitives लौटने और फिर से निवास करने का संयुक्त भाव देते हैं; यह आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: עַד מוֹת הַכֹּהֵן
  choice: याजक की मृत्यु से पहले
  rationale: निषेध के संदर्भ में עַד उस समय-सीमा को बताता है जिसके पूर्व वापसी की अनुमति नहीं दी जा सकती; ‘से पहले’ अपेक्षित कानूनी आशय स्पष्ट करता है।
theological_decisions:
- issue: शरण-नगर से संबंधित छुड़ौती के निषेध का कानूनी विस्तार
  choice: मुख्य पाठ इसे ऐसे भुगतान के निषेध के रूप में व्यक्त करता है जो याजक की मृत्यु से पहले व्यक्ति को लौटकर देश में रहने दे।
  alternative: इब्रानी को शरण-नगर को भागने, वहाँ बने रहने, अथवा वहाँ से समय से पहले लौटने से जुड़े भुगतान के निषेध के रूप में समझा जा सकता है।
  rationale: इब्रानी वाक्य-विन्यास अत्यंत संक्षिप्त है। मुख्य अर्थ कानूनी परिणाम को भुगतान से टालने का निषेध है; अधिक संकीर्ण व्याख्या थोपने के बजाय वैकल्पिक संबंध पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी और गरिमापूर्ण शैली। ‘शरण-नगर’, ‘छुड़ौती’ और ‘याजक’ प्रसंगानुकूल पारिभाषिक शब्द हैं।
