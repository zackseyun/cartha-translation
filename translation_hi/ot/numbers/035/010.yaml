  text: דַּבֵּר֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם כִּ֥י אַתֶּ֛ם עֹבְרִ֥ים אֶת הַ/יַּרְדֵּ֖ן אַ֥רְצָ/ה כְּנָֽעַן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/035/010.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you cross the Jordan into the land of Canaan,’
translation:
  language: hi
  text: “इस्राएल के पुत्रों से बात कर और उनसे कह[a], ‘जब तुम यरदन पार करके कनान देश में प्रवेश करोगे,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों से” अथवा “इस्राएल की सन्तानों से।” इब्रानी में शाब्दिक अर्थ “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: बात कर
  rationale: पिएल आज्ञार्थक का सीधा आदेश; ‘से बात कर’ אֶל के साथ स्वाभाविक आधुनिक हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पारिवारिक अभिव्यक्ति का शाब्दिक लिंग-सटीक रूप सुरक्षित रखा गया है; सामान्य अर्थ ‘इस्राएली’ है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: मूल के दोहरे आदेश ‘बात कर ... और कह’ की संरचना और लय बनाए रखता है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ आने वाली परिस्थिति का परिचय देता है, इसलिए कालवाचक ‘जब’ प्रसंगानुकूल है।
- source_word: אַתֶּם עֹבְרִים
  choice: तुम ... पार करके ... प्रवेश करोगे
  rationale: सर्वनाम सहित कृदन्त निकट भविष्य की क्रिया व्यक्त करता है; हिन्दी में भविष्यकाल स्वाभाविक है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन पार करके
  rationale: भौगोलिक नाम को नदी-सूचक क्रिया ‘पार करना’ के साथ स्पष्ट और स्वाभाविक रूप में दिया गया है।
- source_word: אַרְצָה כְּנָעַן
  choice: कनान देश में प्रवेश करोगे
  rationale: אֶרֶץ पर दिशासूचक प्रत्यय कनान की ओर, प्रसंगतः उसके भीतर, गति दर्शाता है; ‘में प्रवेश’ इस दिशा को स्पष्ट करता है।
