source:
  edition: WLC
  text: וַ/יֵּ֤רֶד יְהוָה֙ בְּ/עַמּ֣וּד עָנָ֔ן וַֽ/יַּעֲמֹ֖ד פֶּ֣תַח הָ/אֹ֑הֶל וַ/יִּקְרָא֙ אַהֲרֹ֣ן וּ/מִרְיָ֔ם וַ/יֵּצְא֖וּ שְׁנֵי/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/005.yaml
  text: Then Yahweh came down in a pillar of cloud and stood at the entrance of the tent[a], and he called Aaron and Miriam[b], and both of them came forward.
translation:
  language: hi
  text: तब याहवे बादल के स्तम्भ में उतर आया और तम्बू के द्वार पर खड़ा हुआ। उसने हारून और मरियम को बुलाया, और वे दोनों बाहर निकल आए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרֶד
  choice: उतर आया
  rationale: यह ירד के नीचे आने के ठोस अर्थ और कथात्मक दृष्टिकोण दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से ईश्वरीय व्यक्तिगत नाम को प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: בְּעַמּוּד עָנָן
  choice: बादल के एक खम्भे में
  rationale: बेथ को यहाँ माध्यम अथवा प्रकट होने के रूप में समझा गया है; अनिश्चित रचना को ‘एक’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हुआ
  rationale: עמד का सीधा कथात्मक अर्थ है और आधुनिक हिन्दी में सहज है।
- source_word: פֶּתַח הָאֹהֶל
  choice: तम्बू के द्वार पर
  rationale: פתח का अर्थ प्रवेश-द्वार है; मूल में केवल ‘तम्बू’ है, इसलिए मुख्य पाठ में विस्तृत पद ‘मिलापवाला तम्बू’ नहीं जोड़ा गया।
- source_word: וַיִּקְרָא
  choice: बुलाया
  rationale: קרא के सामान्य अर्थ को सरल और सटीक हिन्दी में रखता है।
- source_word: אַהֲרֹן וּמִרְיָם
  choice: हारून और मरियम
  rationale: हिन्दी बाइबल परम्परा में पहचाने जाने वाले नाम-रूप हैं।
- source_word: וַיֵּצְאוּ שְׁנֵיהֶם
  choice: वे दोनों बाहर निकलकर उसके सामने आए
  rationale: יצא के शाब्दिक ‘बाहर निकलने’ को बनाए रखते हुए प्रसंगगत आगे आने की गति स्पष्ट करता है; שְׁנֵיהֶם को ‘वे दोनों’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप रखा गया है।
- issue: यहोवा के उतरने का मानव-सदृश वर्णन
  choice: ठोस अभिव्यक्ति ‘उतर आया’ को बनाए रखना
  alternative: ‘प्रकट हुआ’ जैसे कम ठोस अर्थानुवाद का प्रयोग
  rationale: मूल पाठ स्पष्ट रूप से नीचे उतरने की भाषा प्रयुक्त करता है; इसे बनाए रखने से ईश्वर-दर्शन का कथात्मक बिम्ब सुरक्षित रहता है।
- issue: וַיֵּצְאוּ में गति की दिशा
  choice: शाब्दिक और प्रसंगगत दोनों पक्षों को ‘बाहर निकलकर उसके सामने आए’ में रखना
  alternative: केवल ‘आगे आए’ अथवा ‘बाहर निकले’
  rationale: क्रिया मूलतः बाहर निकलने को बताती है, जबकि बुलावे का प्रसंग यह संकेत देता है कि वे यहोवा के सामने आए; संयुक्त रूप अनावश्यक रूप से किसी एक पक्ष को नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास कथात्मक है; संदर्भ से ज्ञात ‘मिलापवाला तम्बू’ को मूल से आगे बढ़कर मुख्य पाठ में नहीं जोड़ा गया।
