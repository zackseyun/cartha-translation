  yaml_path: translation/ot/numbers/012/009.yaml
  text: And Yahweh’s anger burned against them[a], and he departed.
translation:
  language: hi
  text: और याहवे का क्रोध उन पर भड़क उठा[a], और वह चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक मुहावरा है, “याहवे की नाक उन पर जल उठी,” जिसका अर्थ है, “याहवे का क्रोध उन पर भड़क उठा।”
    reason: मूल इब्रानी मुहावरे और उसके उष्णता-संबंधी बिंब को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּחַר
  choice: भड़क उठा
  rationale: क्रिया חרה क्रोध के गरम होने या भड़कने का बिंब व्यक्त करती है। ‘भड़क उठा’ आधुनिक हिन्दी में स्वाभाविक है और मूल का उष्णता-संबंधी रूपक बनाए रखता है।
- source_word: אַף
  choice: क्रोध
  rationale: शाब्दिक अर्थ ‘नाक’ है, पर חרה के साथ यह एक मुहावरा है जिसका आशय क्रोध है। हिन्दी में ‘क्रोध’ अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בָּם
  choice: उन पर
  rationale: क्रोध के इस मुहावरे में בְ क्रोध के लक्ष्य को सूचित करता है; ‘उन पर’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: וַיֵּלַךְ
  choice: वह वहाँ से चला गया
  rationale: הלך यहाँ यहोवा के प्रस्थान को बताता है। ‘वहाँ से चला गया’ स्पष्ट, सहज और प्रसंगानुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को अपनाया गया है, न कि उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किया गया।
- issue: यहोवा के प्रस्थान का स्वरूप
  choice: वह वहाँ से चला गया
  alternative: उसने अपनी उपस्थिति हटा ली
  rationale: मूल क्रिया केवल जाने या प्रस्थान करने को कहती है; उसका धर्मवैचारिक अर्थ विस्तार से निर्धारित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली। वाक्य की दो समन्वित क्रियाओं और मूल के संक्षिप्त, निर्णायक स्वर को सुरक्षित रखा गया है।
