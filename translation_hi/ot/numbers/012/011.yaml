id: NUM.12.11
reference: Numbers 12:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר אַהֲרֹ֖ן אֶל מֹשֶׁ֑ה בִּ֣י אֲדֹנִ֔/י אַל נָ֨א תָשֵׁ֤ת עָלֵ֨י/נוּ֙ חַטָּ֔את אֲשֶׁ֥ר נוֹאַ֖לְנוּ וַ/אֲשֶׁ֥ר חָטָֽאנוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/011.yaml
  text: And Aaron said to Moses[a], “Please, my lord, do not lay sin on us, because we have acted foolishly and because we have sinned.”
translation:
  language: hi
  text: हारून ने मूसा से कहा, “मेरे स्वामी, कृपा करके यह पाप हम पर न डालिए[a], क्योंकि हमने मूर्खता की है और पाप किया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह दोष हम पर न डालिए।”
    reason: חַטָּאת यहाँ ‘पाप’ के साथ-साथ उसके कारण ठहरने वाले ‘दोष’ को भी सूचित कर सकता है; वैकल्पिक वाक्यांश इसी अर्थ और मूल के ‘पर रखना’ रूपक को दर्शाता है।
lexical_decisions:
- source_word: בִּי אֲדֹנִי
  choice: हे मेरे स्वामी, कृपा करके
  rationale: בִּי विनम्र और आग्रहपूर्ण निवेदन व्यक्त करता है, जबकि אֲדֹנִי यहाँ मूसा के लिए आदरसूचक मानवीय संबोधन है। ‘हे मेरे स्वामी’ सामाजिक विनय बनाए रखता है और ‘कृपा करके’ निवेदन का स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: אַל נָא
  choice: न रखिए
  rationale: निषेध को आदरसूचक क्रिया-रूप में व्यक्त किया गया है; נָא की निवेदनात्मकता पहले ही ‘कृपा करके’ से प्रकट है, इसलिए पुनरुक्ति से बचा गया है।
- source_word: תָשֵׁת עָלֵינוּ חַטָּאת
  choice: यह पाप हमारे सिर पर न रखिए
  rationale: שׁית + על के ‘किसी पर रखना’ रूपक को हिन्दी के स्वाभाविक मुहावरे ‘सिर पर रखना’ से सुरक्षित रखा गया है। חַטָּאת को मुख्य पाठ में सीधे ‘पाप’ कहा गया है; संदर्भ में ‘दोष’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר נוֹאַלְנוּ
  choice: क्योंकि हमने मूर्खता की है
  rationale: निफ़ाल क्रिया נוֹאַלְנוּ यहाँ मूर्खतापूर्ण या विवेकहीन आचरण को स्वीकार करती है। कारणसूचक ‘क्योंकि’ हारून की विनती और स्वीकारोक्ति के संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַאֲשֶׁר חָטָאנוּ
  choice: और पाप किया है
  rationale: दूसरा खंड पहले को नैतिक रूप से स्पष्ट और तीव्र करता है। हिन्दी में पहले आए ‘हमने’ और ‘क्योंकि’ को अनावश्यक रूप से दोहराए बिना समन्वय सुरक्षित है।
theological_decisions:
- issue: मूसा के लिए אֲדֹנִי का अनुवाद
  choice: मेरे स्वामी
  alternative: महोदय
  rationale: यहाँ संबोधन परमेश्वर के लिए प्रयुक्त उपाधि नहीं, बल्कि मूसा के प्रति आदर और अधीनता का मानवीय संबोधन है। ‘मेरे स्वामी’ मूल की सामाजिक विनय और विनती की तीव्रता को ‘महोदय’ से अधिक निकटता से व्यक्त करता है।
- issue: חַטָּאת को अपराध या उसके दायित्व के रूप में समझना
  choice: पाप
  alternative: दोष
  rationale: मुख्य पाठ में ‘पाप’ मूल शब्द का अधिक सीधा और पारदर्शी रूप है, पर हारून की दया-याचना में उस पाप का दोष या दायित्व भी अभिप्रेत हो सकता है; इस वास्तविक अर्थ-परास को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और आदरसूचक संवाद-रूप अपनाया गया है। ‘मेरे स्वामी’ को मानवीय सम्मानसूचक संबोधन के रूप में रखा गया है, और ‘हमारे सिर पर रखना’ मूल रूपक को सहज हिन्दी में व्यक्त करता है।
