  text: וְ/הֶ/עָנָ֗ן סָ֚ר מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/הִנֵּ֥ה מִרְיָ֖ם מְצֹרַ֣עַת כַּ/שָּׁ֑לֶג וַ/יִּ֧פֶן אַהֲרֹ֛ן אֶל מִרְיָ֖ם וְ/הִנֵּ֥ה מְצֹרָֽעַת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/010.yaml
  text: And the cloud departed from over the tent[a], and behold, Miriam was leprous, like snow. Then Aaron turned toward Miriam, and behold, she was leprous.
translation:
  language: hi
  text: और बादल तंबू के ऊपर से हट गया, और देखो, मरियम को चर्मरोग[a] था, जो बर्फ के समान था। हारून मरियम की ओर मुड़ा, और देखो, उसे चर्मरोग था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ जिस इब्रानी शब्द का अनुवाद “चर्मरोग” किया गया है, वह कई प्रकार के गंभीर त्वचा-रोग या ऐसी त्वचा-दशा को दर्शा सकता है जिससे व्यक्ति अनुष्ठानिक रूप से अशुद्ध माना जाता था; इसका अर्थ आवश्यक रूप से आधुनिक कुष्ठ रोग (हैन्सन रोग) नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶעָנָן
  choice: बादल
  rationale: सप्रत्यय संज्ञा संदर्भ में यहोवा की उपस्थिति से जुड़े दिखाई देने वाले बादल को दर्शाती है; हिंदी में ‘बादल’ स्वाभाविक और पर्याप्त है।
- source_word: סָר
  choice: हट गया
  rationale: क्रिया किसी स्थान से हटने या दूर चले जाने का भाव देती है; तंबू के ऊपर से बादल हटने के लिए यह सहज हिंदी है।
- source_word: מֵעַל הָאֹהֶל
  choice: तंबू के ऊपर से
  rationale: מֵעַל ऊपर स्थित स्थान से अलग होने की गति दर्शाता है; यह अनुवाद स्थान और गति दोनों को बनाए रखता है।
- source_word: וְהִנֵּה
  choice: तब देखो / तो देखा
  rationale: यह कण आकस्मिक और ध्यान खींचने वाली दृश्य-प्रस्तुति करता है। पहले प्रयोग में ‘तब देखो’ नाटकीयता रखता है; हारून के मुड़ने के बाद ‘तो देखा’ वही प्रभाव स्वाभाविक हिंदी में देता है।
- source_word: מְצֹרַעַת
  choice: चर्मरोग हो गया था
  rationale: यह शब्द आधुनिक हैन्सन रोग तक सीमित नहीं, बल्कि व्यापक गंभीर त्वचा-संबंधी अथवा अनुष्ठानिक अशुद्धता वाली दशा बता सकता है। ‘चर्मरोग’ आधुनिक पाठक को अनावश्यक चिकित्सकीय संकीर्णता से बचाता है।
- source_word: כַּשָּׁלֶג
  choice: बर्फ के समान
  rationale: इब्रानी में संक्षिप्त उपमा ‘बर्फ के समान’ है। संदर्भ श्वेत दिखाई देने की ओर संकेत करता है, पर मूल में ‘सफेद’ स्पष्ट रूप से जोड़कर उपमा की अस्पष्टता को समाप्त नहीं किया गया।
- source_word: וַיִּפֶן ... אֶל
  choice: की ओर मुड़ा
  rationale: क्रिया और संबंधसूचक पद मिलकर शारीरिक रूप से किसी की ओर मुड़ने का भाव देते हैं।
theological_decisions:
- issue: मिर्याम की दशा को आधुनिक कुष्ठ रोग मानना
  choice: मुख्य पाठ में ‘चर्मरोग’ और पादटिप्पणी में शब्द का व्यापक अर्थ
  alternative: ‘कोढ़’ या ‘कुष्ठ रोग’
  rationale: मूल इब्रानी शब्द को आधुनिक हैन्सन रोग के बराबर मानना चिकित्सकीय और अर्थगत रूप से अत्यधिक निश्चित होगा; व्यापक अनुष्ठानिक-त्वचा संबंधी अर्थ सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘देखो’ से וְהִנֵּה की नाटकीयता रखी गई है। स्त्रीलिंग विशेषण की पुनरावृत्ति को हिंदी में रोग-दशा की पुनरावृत्ति द्वारा व्यक्त किया गया है।
