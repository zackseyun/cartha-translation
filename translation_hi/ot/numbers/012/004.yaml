base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/004.yaml
  text: And Yahweh said suddenly to Moses and to Aaron and to Miriam[a], “Come out, you three[b], to the tent of meeting.” And the three of them went out.
translation:
  language: hi
  text: याहवे ने अचानक मूसा, हारून और मरियम से कहा, “तुम तीनों[b] मिलाप के तंबू की ओर निकल आओ[a]।” और वे तीनों निकल आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकल जाओ”; इब्रानी क्रिया केवल किसी स्थान से बाहर की ओर जाने को व्यक्त करती है।
    reason: lexical_alternative
  - marker: b
    text: या “तुम तीनों के तीनों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में लिप्यंतरित किया गया है।
- source_word: פִּתְאֹם
  choice: अचानक
  rationale: यह क्रियाविशेषण कथन के अप्रत्याशित और तत्काल होने का भाव व्यक्त करता है; ‘अचानक’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: צְאוּ
  choice: निकल आओ
  rationale: יצא का आदेश किसी स्थान से बाहर जाने या आने को दर्शाता है। प्रसंग में याहवे तीनों को उनके वर्तमान स्थान से मिलापवाले तंबू की ओर बुलाते हैं, इसलिए ‘निकल आओ’ स्वाभाविक है; दिशा की अंतर्निहित अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: שְׁלָשְׁתְּכֶם
  choice: तुम तीनों
  rationale: यह रूप संबोधित तीनों व्यक्तियों पर स्पष्ट बल देता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह इस्राएल के पवित्र तंबू के लिए प्रचलित और अर्थपूर्ण हिन्दी पद है।
- source_word: וַיֵּצְאוּ
  choice: निकल आए
  rationale: कथात्मक क्रिया आदेश के पालन में उनके बाहर आने को बताती है; ‘निकल आए’ हिन्दी में पूर्ववर्ती बुलावे से स्वाभाविक रूप से जुड़ता है।
- source_word: שְׁלָשְׁתָּם
  choice: वे तीनों
  rationale: इब्रानी पुनरुक्ति को बनाए रखते हुए यह स्पष्ट करता है कि तीनों ने आदेश का पालन किया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलापवाला तंबू’ बाइबलीय पारिभाषिक पद है। आदेश और उसके पालन में प्रयुक्त ‘निकल आओ/निकल आए’ हिन्दी कथन-प्रवाह को स्वाभाविक रखते हैं, जबकि मूल की दिशात्मक गुंजाइश पादटिप्पणी में सुरक्षित है।
