id: NUM.12.12
reference: Numbers 12:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל נָ֥א תְהִ֖י כַּ/מֵּ֑ת אֲשֶׁ֤ר בְּ/צֵאת/וֹ֙ מֵ/רֶ֣חֶם אִמּ֔/וֹ וַ/יֵּאָכֵ֖ל חֲצִ֥י בְשָׂרֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/012.yaml
  text: Please[a], do not let her be like one dead, whose flesh is half consumed when he comes out of his mother’s womb.
translation:
  language: hi
  text: कृपा करके, उसे उस मरे हुए के समान न होने दे, जो अपनी माँ के गर्भ से निकलते समय ऐसा हो कि उसका आधा मांस नष्ट हो चुका हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל נָא
  choice: कृपा करके ... न
  rationale: אַל निषेध व्यक्त करता है और נָא विनती की तीव्रता जोड़ता है; इसलिए इसे कठोर आज्ञा के बजाय आग्रहपूर्ण निवेदन के रूप में रखा गया है।
- source_word: תְהִי
  choice: उसे ... न रहने दे
  rationale: हयाह का स्त्रीलिंग एकवचन रूप यहाँ नकारात्मक इच्छा/निवेदन है; संदर्भ में स्त्रीलिंग सर्वनाम मरियम की ओर संकेत करता है।
- source_word: כַּמֵּת
  choice: उस मरे हुए के समान
  rationale: यह अभिव्यक्ति शाब्दिक तुलना—‘मरे हुए के समान’—को बनाए रखती है और मुख्य पाठ में मृत-जन्मे बच्चे का अर्थ अनिवार्य नहीं करती।
- source_word: בְּצֵאתוֹ מֵרֶחֶם אִמּוֹ
  choice: अपनी माँ के गर्भ से निकलते समय
  rationale: בְּ के साथ क्रियार्थक संज्ञा समयसूचक है; यह अनुवाद इब्रानी के जन्म-संबंधी चित्र को निकटता से रखता है।
- source_word: וַיֵּאָכֵל חֲצִי בְשָׂרוֹ
  choice: जिसका आधा मांस ... गल चुका हो
  rationale: शाब्दिक रूप में ‘उसके मांस का आधा खा लिया गया हो’ है, पर यहाँ परिणामस्वरूप क्षय का चित्र है। ‘गल चुका हो’ आधुनिक हिन्दी में रोगग्रस्त/क्षीण मांस की वीभत्स छवि स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: स्त्रीलिंग एकवचन का संदर्भ
  choice: ‘उसे’ से मरियम अभिप्रेत है
  alternative: सर्वनाम के स्थान पर ‘मरियम’ नाम स्पष्ट करना
  rationale: निकटवर्ती संदर्भ मरियम को स्पष्ट करता है; सर्वनाम रखना मूल की व्याकरणिक बनावट और कथात्मक प्रवाह के अधिक निकट है।
- issue: כַּמֵּת में मृत-जन्म की छवि
  choice: मुख्य पाठ में व्यापक अर्थ ‘मरे हुए के समान’
  alternative: ‘मृत-जन्मे बच्चे के समान’
  rationale: अगला उपवाक्य जन्म के समय मृत होने की छवि सुझाता है, पर כַּמֵּת स्वयं मृत-जन्मे बच्चे को स्पष्ट रूप से नहीं कहता। अस्पष्टता मुख्य पाठ में रखी गई और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विनती के भाव वाली रखी गई है। ‘मांस’ मूल के शारीरिक और कठोर चित्र को बचाता है; ‘गल चुका हो’ हिन्दी में शाब्दिक ‘खा लिया गया हो’ की अपेक्षा क्षय की दशा अधिक स्वाभाविक ढंग से व्यक्त करता है।
