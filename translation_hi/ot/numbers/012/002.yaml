source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ הֲ/רַ֤ק אַךְ בְּ/מֹשֶׁה֙ דִּבֶּ֣ר יְהוָ֔ה הֲ/לֹ֖א גַּם בָּ֣/נוּ דִבֵּ֑ר וַ/יִּשְׁמַ֖ע יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/002.yaml
  text: And they said[a], “Has Yahweh indeed spoken only through Moses? Has he not also spoken through us?” And Yahweh heard it.
translation:
  language: hi
  text: उन्होंने कहा[a], “क्या याहवे ने केवल मूसा के द्वारा ही बात की है? क्या उसने हमारे द्वारा भी बात नहीं की है?” और याहवे ने सुन लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या याहवे ने केवल मूसा से ही बात की है? क्या उसने हमसे भी बात नहीं की है?” हिब्रू पूर्वसर्ग का अर्थ दैवी वाणी का प्राप्तकर्ता अथवा उसका माध्यम—दोनों हो सकता है। मुख्य पाठ में प्रसंग के भविष्यद्वक्ताई अधिकार से संबंधित होने के कारण “के द्वारा” चुना गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: उन्होंने कहा
  rationale: बहुवचन क्रिया प्रत्यक्ष कथन का परिचय देती है; हिंदी में प्रसंगानुकूल स्वाभाविक कथात्मक क्रम रखा गया है।
- source_word: הֲרַק אַךְ
  choice: क्या ... केवल ... ही
  rationale: दोनों प्रतिबंधात्मक अव्ययों का संयुक्त बल ‘केवल ... ही’ से व्यक्त होता है और प्रश्न की चुनौतीपूर्ण प्रकृति बनी रहती है।
- source_word: בְּמֹשֶׁה
  choice: मूसा के द्वारा
  rationale: דבר के साथ ב यहाँ दैवी वाणी के माध्यम को सूचित कर सकता है; निकटवर्ती प्रसंग भविष्यद्वक्ताई अधिकार पर केंद्रित है।
- source_word: דִּבֶּר יְהוָה
  choice: यहोवा ने ... बात की है
  rationale: दिव्य संप्रेषण के लिए ‘बात की है’ आधुनिक हिंदी में स्वाभाविक है और पूर्ण क्रिया का वर्तमान-संबद्ध बल व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: הֲלֹא גַּם בָּנוּ דִבֵּר
  choice: क्या उसने हमारे द्वारा भी बात नहीं की?
  rationale: पहले खंड के समान रचना और भविष्यद्वक्ताई माध्यम होने के दावे को बनाए रखने के लिए ‘के द्वारा’ दोहराया गया है।
- source_word: וַיִּשְׁמַע יְהוָה
  choice: और यहोवा ने सुन लिया
  rationale: हिब्रू में कर्म व्यक्त नहीं है; हिंदी में ‘सुन लिया’ बिना अनावश्यक कर्म जोड़े उनके कथन के सुने जाने को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को मूल पाठ के अनुरूप नाम के रूप में बनाए रखा गया है, न कि उपाधि से प्रतिस्थापित किया गया है।
- issue: 'דבר के साथ ב का अर्थ: संबोधन का प्राप्तकर्ता या वाणी का माध्यम'
  choice: मूसा के द्वारा / हमारे द्वारा
  alternative: मूसा से / हमसे
  rationale: गिनती 12 का प्रसंग भविष्यद्वक्ताई अधिकार और दैवी वाणी के माध्यम से संबंधित है; फिर भी हिब्रू पूर्वसर्ग की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘केवल ... ही’ मूल के प्रतिबंधात्मक बल को व्यक्त करता है। ‘यहोवा’ हिंदी बाइबलीय परंपरा में पहचाना जाने वाला देवनागरी रूप है।
