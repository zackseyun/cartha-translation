  text: וַ/יִּצְעַ֣ק מֹשֶׁ֔ה אֶל יְהוָ֖ה לֵ/אמֹ֑ר אֵ֕ל נָ֛א רְפָ֥א נָ֖א לָֽ/הּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/013.yaml
  text: So Moses cried out to Yahweh[a], saying, “O God, please heal her.”
translation:
  language: hi
  text: तब मूसा ने यहवे को पुकारकर कहा, “हे परमेश्वर, कृपा करके उसे चंगा कर दे, कृपा कर!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: दोहाई देकर कहा
  rationale: צעק एक तीव्र पुकार अथवा संकट में की गई विनती व्यक्त करता है; यह हिंदी प्रयोग प्रार्थना की तीव्रता और आगे आने वाले कथन, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל יְהוָה
  choice: यहवे की
  rationale: אֶל प्रार्थना की दिशा यहवे की ओर दर्शाता है; 'यहवे की दोहाई' आधुनिक हिंदी में स्वाभाविक है और יְהוָה को निजी नाम के रूप में सुरक्षित रखता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियारूप पुकार की विषयवस्तु प्रस्तुत करता है; हिंदी में 'कहा' उद्धरण का सहज परिचय देता है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: אֵל यहाँ सीधे संबोधन में है; 'हे परमेश्वर' उसका प्रार्थनापूर्ण संबोधन स्पष्ट करता है।
- source_word: נָא ... נָא
  choice: कृपा करके ... कृपा कर
  rationale: दोनों विनयबोधक कणों को रखा गया है, जिससे मूल की तात्कालिकता और आग्रह बिना कृत्रिम पुनरुक्ति के सुनाई देते हैं।
- source_word: רְפָא
  choice: चंगा कर दे
  rationale: רפא का आदेशात्मक रूप मरियम की शारीरिक दशा से आरोग्य की विनती है; 'चंगा कर दे' सामान्य और स्पष्ट हिंदी है।
- source_word: לָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन प्रत्यय का संदर्भ मरियम है; हिंदी में संदर्भानुसार 'उसे' स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुराक्षरीय निजी नाम है। 'यहवे' उसका सीधा लिप्यंतरण करता है और उसे किसी उपाधि से नहीं बदलता।
- issue: נָא की दोहरी उपस्थिति
  choice: दोनों विनयबोधक कणों को मुख्य पाठ में व्यक्त किया
  alternative: एक ही बार 'कृपा करके' कहना
  rationale: पुनरावृत्ति मूसा की विनती की तीव्रता को बढ़ाती है; इसे हटाने से मूल का भावात्मक बल घट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। 'दोहाई देकर' तीव्र मध्यस्थ प्रार्थना को दर्शाता है, जबकि दो बार की विनती मूल इब्रानी के आग्रह को सुरक्षित रखती है।
