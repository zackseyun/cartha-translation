source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה וְ/אָבִ֨י/הָ֙ יָרֹ֤ק יָרַק֙ בְּ/פָנֶ֔י/הָ הֲ/לֹ֥א תִכָּלֵ֖ם שִׁבְעַ֣ת יָמִ֑ים תִּסָּגֵ֞ר שִׁבְעַ֤ת יָמִים֙ מִ/ח֣וּץ לַֽ/מַּחֲנֶ֔ה וְ/אַחַ֖ר תֵּאָסֵֽף־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/014.yaml
  text: And Yahweh said to Moses[a], “If her father had spit in her face, would she not be disgraced for seven days? Let her be shut up outside the camp for seven days[b], and afterward she may be brought back in.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “यदि उसके पिता ने उसके चेहरे पर थूका होता, तो क्या वह सात दिन तक अपमानित न रहती?[a] उसे सात दिन तक छावनी के बाहर बंद रखा जाए, और उसके बाद उसे फिर भीतर ले लिया जाए।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या वह सात दिन तक लज्जित न रहती?”
    reason: lexical_alternative
  - marker: b
    text: या “उसके बाद उसे फिर एकत्र किया जाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसका प्रचलित लिप्यंतरण रखा गया है।
- source_word: יָרֹק יָרַק
  choice: थूका होता
  rationale: इन्फिनिटिव ऐब्सोल्यूट और क्रिया का संयोजन क्रिया पर बल देता है; काल्पनिक शर्त में यह हिंदी अभिव्यक्ति स्वाभाविक ढंग से उसका आशय व्यक्त करती है।
- source_word: בְּפָנֶיהָ
  choice: उसके मुँह पर
  rationale: थूकने के प्रसंग में यह सार्वजनिक अपमान को व्यक्त करने वाला स्वाभाविक हिंदी मुहावरा है।
- source_word: תִכָּלֵם
  choice: अपमानित न रहती
  rationale: כלם के निफ़अल रूप में अपमान या लज्जा में डाले जाने का सामाजिक भाव है; प्रश्नवाचक संरचना भी सुरक्षित रखी गई है।
- source_word: תִּסָּגֵר
  choice: बंद रखा जाए
  rationale: निफ़अल का कर्मवाच्य अर्थ अलग रखे जाने या सीमित किए जाने को दर्शाता है; यह अनावश्यक व्याख्या किए बिना ठोस बहिष्करण व्यक्त करता है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: स्थान-सूचक इब्रानी पदबंध का सीधा और प्रसंगानुकूल हिंदी रूप।
- source_word: תֵּאָסֵף
  choice: फिर भीतर ले लिया जाए
  rationale: אסף के निफ़अल कर्मवाच्य को बनाए रखते हुए छावनी में पुनः ग्रहण किए जाने का प्रसंग स्वाभाविक हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: पिता के थूकने वाले उपवाक्य की प्रकृति
  choice: लज्जा और बहिष्करण को समझाने वाली काल्पनिक उपमा
  alternative: किसी वास्तविक पिछली घटना का उल्लेख
  rationale: इब्रानी रचना एक आलंकारिक शर्त प्रस्तुत करती है, जिसके द्वारा याहवे मरियम के सात दिन के बहिष्करण को स्पष्ट करते हैं; अनुवाद इसमें कोई अतिरिक्त प्रतीकात्मक या सांप्रदायिक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘छावनी,’ ‘अपमानित’ और ‘बंद रखा जाए’ जैसे शब्द सामान्य पाठक के लिए स्पष्ट हैं; कर्मवाच्य क्रियाएँ मूल इब्रानी की व्याकरणिक बनावट को यथासंभव सुरक्षित रखती हैं।
