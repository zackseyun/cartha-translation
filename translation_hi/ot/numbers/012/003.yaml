  yaml_path: translation/ot/numbers/012/003.yaml
  text: The man Moses was very humble[a], more than any man who was on the face of the earth.
translation:
  language: hi
  text: और मूसा बहुत ही नम्र था—धरती पर रहनेवाले किसी भी मनुष्य से अधिक नम्र।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הָ/אִישׁ מֹשֶׁה
  choice: और वह पुरुष मूसा
  rationale: वाव को प्रसंग की निरंतरता दिखाने के लिए ‘और’ कहा गया है। הָאִישׁ का औपचारिक संकेत बनाए रखने के लिए ‘वह पुरुष’ रखा गया, यद्यपि आधुनिक हिन्दी में केवल ‘मूसा’ भी स्वाभाविक होता।
- source_word: ענו
  choice: नम्र
  rationale: यहाँ विशेषण मूसा के स्वभाव या वृत्ति को बताता है। ‘नम्र’ आधुनिक हिन्दी में सहज है और ‘दीन’ से उत्पन्न निर्धनता अथवा दुःख की संभावित छाया से बचता है।
- source_word: מְאֹד
  choice: बहुत ही
  rationale: तीव्रता बताने वाले इस क्रियाविशेषण का स्वाभाविक हिन्दी रूप।
- source_word: מִ/כֹּל הָאָדָם
  choice: किसी भी मनुष्य से अधिक
  rationale: מן और כֹּל की तुलनात्मक रचना को सहज हिन्दी में व्यक्त करता है; אָדָם यहाँ सामान्य अर्थ में हर मानव को समेटता है।
- source_word: אֲשֶׁר עַל פְּנֵי הָאֲדָמָה
  choice: धरती पर रहनेवाले
  rationale: शाब्दिक ‘धरती के मुख पर’ के स्थान पर मुहावरे का अर्थ स्वाभाविक हिन्दी में दिया गया है। सापेक्ष उपवाक्य का आशय अस्तित्व/निवास है।
theological_decisions:
- issue: ענו का अर्थ
  choice: नम्र
  alternative: दीन; नम्र-स्वभाव
  rationale: संदर्भ में मूसा की वृत्ति का वर्णन प्रमुख है। अनावश्यक रूप से उसे दुर्बलता, निर्धनता या केवल दुःखभोग के अर्थ में सीमित नहीं किया गया।
- issue: הָאָדָם का सामान्य मानव-सूचक प्रयोग
  choice: मनुष्य
  alternative: व्यक्ति; पुरुष
  rationale: यह तुलना केवल पुरुषों तक सीमित नहीं है; हिन्दी ‘मनुष्य’ मूल के सामान्य मानव-सूचक अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल की तुलना और तीव्रता सुरक्षित रखी गई है। कथन की असाधारण व्यापकता को नरम नहीं किया गया।
