  text: So Miriam was confined outside the camp for seven days, and the people did not set out until Miriam was brought back in.
translation:
  language: hi
  text: तब मिरयम सात दिन तक छावनी के बाहर अलग रखी गई, और लोग तब तक आगे नहीं बढ़े, जब तक मिरयम को फिर भीतर नहीं लाया गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “जब तक मिरयम को एकत्र नहीं किया गया।” यहाँ इब्रानी क्रिया उसके अलगाव की अवधि पूरी होने पर उसे फिर छावनी में सम्मिलित किए जाने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּסָּגֵר
  choice: अलग रखी गई
  rationale: निफ़अल रूप निष्क्रिय अवस्था को व्यक्त करता है—मिरयम को समुदाय और छावनी से बाहर रखा गया। ‘अलग रखी गई’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंगगत बहिष्करण को स्पष्ट करती है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह सीधा स्थानवाचक पद है; जंगल की यात्रा के प्रसंग में ‘छावनी’ स्वाभाविक हिन्दी समतुल्य है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अवधि सूचित करता है; हिन्दी में ‘सात दिन तक’ उसी कालगत अर्थ को सहज रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ इसका संकेत यात्रा कर रहे इस्राएली समुदाय की ओर है; ‘लोग’ सरल और प्रसंगानुकूल है।
- source_word: לֹא נָסַע
  choice: आगे की यात्रा आरम्भ नहीं की
  rationale: נסע जंगल के यात्रा-वर्णनों में पड़ाव छोड़कर आगे बढ़ने को दर्शाता है। यह चयन सामान्य ‘नहीं चले’ की अपेक्षा उस विशेष यात्रा-अर्थ को स्पष्ट करता है।
- source_word: עַד הֵאָסֵף מִרְיָם
  choice: जब तक मिरयम को फिर भीतर नहीं लाया गया
  rationale: אסף का निफ़अल यहाँ अलगाव के बाद मिरयम के छावनी अथवा समुदाय में एकत्र किए जाने को दर्शाता है। ‘फिर भीतर लाया गया’ प्रसंगगत पुनःस्वीकार को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक ‘इकट्ठा किया गया’ पादटिप्पणी में सुरक्षित है।
