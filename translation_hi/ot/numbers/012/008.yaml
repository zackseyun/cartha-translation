  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: פֶּ֣ה אֶל פֶּ֞ה אֲדַבֶּר בּ֗/וֹ וּ/מַרְאֶה֙ וְ/לֹ֣א בְ/חִידֹ֔ת וּ/תְמֻנַ֥ת יְהוָ֖ה יַבִּ֑יט וּ/מַדּ֨וּעַ֙ לֹ֣א יְרֵאתֶ֔ם לְ/דַבֵּ֖ר בְּ/עַבְדִּ֥/י בְ/מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/008.yaml
  text: Mouth to mouth I speak with him[a], plainly and not in riddles; and he beholds the form of Yahweh. So why were you not afraid to speak against my servant[b], against Moses?
translation:
  language: hi
  text: मैं उससे मुँह-से-मुँह[a] बात करता हूँ, स्पष्ट रूप से, पहेलियों में नहीं; और वह याहवे के स्वरूप[b] को निहारता है। फिर तुम मेरे दास के विरुद्ध—मूसा के विरुद्ध—बोलने से क्यों नहीं डरे?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आमने-सामने।” इब्रानी में शाब्दिक रूप से “मुँह से मुँह” है, जो सीधे संवाद पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे की समानता” अथवा “याहवे का प्राकट्य।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּה אֶל פֶּה
  choice: मुँह से मुँह
  rationale: इब्रानी अभिव्यक्ति को निकटता से सुरक्षित रखा गया है; यह मूसा से सीधे और बिना मध्यस्थ के होने वाले संवाद पर बल देती है। अधिक व्याख्यात्मक ‘आमने-सामने’ को पादटिप्पणी में रखा गया है।
- source_word: אֲדַבֶּר בּוֹ
  choice: मैं उससे ... बात करता हूँ
  rationale: דבר के साथ ב यहाँ परस्पर संवाद का भाव देता है; ‘उससे बात करता हूँ’ आधुनिक हिन्दी में स्वाभाविक है और केवल एकतरफा संबोधन से अधिक उपयुक्त है।
- source_word: וּמַרְאֶה
  choice: स्पष्ट रूप से
  rationale: ‘पहेलियों में नहीं’ के साथ विरोध को देखते हुए इसे स्पष्ट संप्रेषण के अर्थ में क्रियाविशेषण रूप में प्रस्तुत किया गया है, बिना प्रकाशन की रीति को अनावश्यक रूप से परिभाषित किए।
- source_word: וְלֹא בְחִידֹת
  choice: और पहेलियों में नहीं
  rationale: חִידֹת गूढ़ या पहेली-जैसी उक्तियों को सूचित करता है। ‘पहेलियाँ’ साधारण आधुनिक पाठक के लिए स्पष्ट है और मूल विरोध बनाए रखता है।
- source_word: וּתְמֻנַת יְהוָה
  choice: याहवे का स्वरूप
  rationale: תְּמוּנָה के रूप, समानता या दिखाई देने वाले प्राकट्य के अर्थ-क्षेत्र को ‘स्वरूप’ संक्षेप में बनाए रखता है। याहवे व्यक्तिगत वाचा-नाम को लिप्यंतरित करता है।
- source_word: יַבִּיט
  choice: निहारता है
  rationale: हिफ़ील रूप ध्यानपूर्वक देखने का भाव देता है। ‘निहारता है’ प्रसंग की गंभीरता और उद्देश्यपूर्ण दृष्टि को व्यक्त करता है।
- source_word: וּמַדּוּעַ לֹא יְרֵאתֶם
  choice: फिर ... क्यों नहीं डरे?
  rationale: ‘फिर’ पिछले कथन से निकलने वाले निष्कर्ष और प्रश्न की भर्त्सनात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְדַבֵּר בְּעַבְדִּי בְמֹשֶׁה
  choice: मेरे दास के विरुद्ध—मूसा के विरुद्ध—बोलने
  rationale: दोहराया गया ב विरोधात्मक वाणी के लक्ष्य को चिह्नित करता है। पुनरुक्ति को सुरक्षित रखने से ‘मेरे दास’ की पहचान मूसा के रूप में और भर्त्सना का बल दोनों स्पष्ट रहते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है।
- issue: मूसा द्वारा ईश्वर के स्वरूप को देखना
  choice: याहवे के स्वरूप को निहारता है
  alternative: याहवे की समानता को देखता है; याहवे के प्राकट्य को देखता है
  rationale: यह पाठ मूसा को दिए गए विलक्षण और प्रत्यक्ष प्रकाशन की पुष्टि करता है, पर उस दर्शन की तत्त्वमीमांसीय प्रकृति नहीं समझाता। ‘स्वरूप’ कथन का बल और उसकी वास्तविक अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल की असामान्य किन्तु अर्थपूर्ण अभिव्यक्ति ‘मुँह से मुँह’ को पादटिप्पणी सहित बचाया गया है; भर्त्सना की पुनरुक्ति को डैश द्वारा स्पष्ट किया गया है।
