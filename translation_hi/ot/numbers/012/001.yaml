  text: וַ/תְּדַבֵּ֨ר מִרְיָ֤ם וְ/אַהֲרֹן֙ בְּ/מֹשֶׁ֔ה עַל אֹד֛וֹת הָ/אִשָּׁ֥ה הַ/כֻּשִׁ֖ית אֲשֶׁ֣ר לָקָ֑ח כִּֽי אִשָּׁ֥ה כֻשִׁ֖ית לָקָֽח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/001.yaml
  text: Then Miriam and Aaron spoke against Moses because of the Cushite woman whom he had taken[b][a], for he had taken a Cushite woman.
translation:
  language: hi
  text: तब मरियम और हारून ने मूसा के विरुद्ध उस कूशी स्त्री के कारण कहा, जिसे उसने पत्नी के रूप में लिया था[b]; क्योंकि उसने एक कूशी स्त्री को पत्नी के रूप में लिया था[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘कूशी’ का अर्थ कूश देश की स्त्री है; परंपरागत अनुवादों में इसे ‘इथियोपियाई’ भी कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जिसे उसने लिया था’; यह हिब्रू मुहावरा ‘पत्नी के रूप में लेना’ या ‘विवाह करना’ दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּדַבֵּר
  choice: बातें कीं
  rationale: דבר का मूल अर्थ बोलना है। मूसा के साथ ב उपसर्ग यहाँ विरोधात्मक भाव देता है, जिसे ‘मूसा के विरुद्ध’ से व्यक्त किया गया है। स्त्रीलिंग एकवचन क्रिया मरियम की अग्रणी भूमिका का संकेत दे सकती है, पर संयुक्त कर्ता को स्वाभाविक हिन्दी में बहुवचन रूप में रखा गया है।
- source_word: מִרְיָם וְאַהֲרֹן
  choice: मरियम और हारून
  rationale: नामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण अपनाया गया और मूल क्रम बनाए रखा गया है।
- source_word: בְּמֹשֶׁה
  choice: मूसा के विरुद्ध
  rationale: דבר के साथ ב यहाँ मूसा को नकारात्मक या विरोधी वाणी का लक्ष्य बताता है; ‘के विरुद्ध’ इस भाव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל אֹדוֹת
  choice: के कारण
  rationale: यह पदबंध बोलने का कारण अथवा अवसर बताता है; ‘के कारण’ उसके कारणसूचक बल को बनाए रखता है।
- source_word: הָאִשָּׁה
  choice: स्त्री
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। संज्ञा को ‘स्त्री’ रखा गया है, जबकि वैवाहिक आशय לקח के अनुवाद में व्यक्त किया गया है।
- source_word: הַכֻּשִׁית / כֻשִׁית
  choice: कूशी
  rationale: यह शब्द कूश की स्त्री को सूचित करता है। ‘कूशी’ मूल भौगोलिक-जातीय पद को बनाए रखता है और आधुनिक इथियोपिया से अनावश्यक समानता नहीं बैठाता।
- source_word: אֲשֶׁר לָקָח
  choice: जिसे उसने पत्नी बनाया था
  rationale: לקח का शाब्दिक अर्थ ‘लेना’ है, पर विवाह-संदर्भ में इसका मुहावरेदार अर्थ ‘पत्नी बनाना’ या ‘विवाह करना’ है। मुख्य पाठ में स्वाभाविक हिन्दी दी गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי पहले कथन का व्याख्यात्मक कारण दोहराता है। हिन्दी में ‘क्योंकि’ इस संबंध को स्पष्ट रखता है।
- source_word: אִשָּׁה כֻשִׁית לָקָח
  choice: उसने एक कूशी स्त्री को पत्नी बनाया था
  rationale: मूल पाठ आरोप को बल देने के लिए बात दोहराता है; अनुवाद ने इस पुनरुक्ति को हटाया नहीं है।
theological_decisions:
- issue: मूसा की पत्नी की पहचान और जातीय-भौगोलिक संज्ञा
  choice: כֻשִׁית को ‘कूशी’ रखा गया है और स्त्री की पहचान मूल पद से आगे निश्चित नहीं की गई।
  alternative: ‘इथियोपियाई’ कहना या उसे व्याख्यात्मक रूप से सिप्पोरा से एकरूप ठहराना।
  rationale: पद स्वयं स्त्री को कूशी कहता है। अनुवाद को न तो आधुनिक भूगोल आरोपित करना चाहिए, न सिप्पोरा/मिद्यान संबंधी सामंजस्यकारी निष्कर्ष जोड़ना चाहिए।
- issue: לקח का वैवाहिक आशय
  choice: मुख्य पाठ में ‘पत्नी बनाया था’ और पादटिप्पणी में शाब्दिक ‘लिया था’।
  alternative: केवल ‘ले लिया था’ कहना या सीधे ‘विवाह किया था’ कहना।
  rationale: वैवाहिक संदर्भ हिन्दी में स्पष्ट होना चाहिए, साथ ही हिब्रू मुहावरे का शाब्दिक रूप पाठक के लिए पादटिप्पणी में उपलब्ध रहना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की कारणसूचक संरचना और जानबूझकर की गई पुनरुक्ति सुरक्षित हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
