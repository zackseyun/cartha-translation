id: NUM.12.6
reference: Numbers 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֖אמֶר שִׁמְעוּ נָ֣א דְבָרָ֑/י אִם יִֽהְיֶה֙ נְבִ֣יאֲ/כֶ֔ם יְהוָ֗ה בַּ/מַּרְאָה֙ אֵלָ֣י/ו אֶתְוַדָּ֔ע בַּ/חֲל֖וֹם אֲדַבֶּר בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/006.yaml
  text: 'And he said[a], “Hear now my words: if there is a prophet among you, I, Yahweh, make myself known to him in a vision[c][b]; I speak to him in a dream.”'
translation:
  language: hi
  text: 'तब उसने कहा, “अब मेरी बातें सुनो: यदि तुम्हारे बीच कोई नबी हो[a], तो मैं, याहवे, दर्शन में उसे अपने को प्रकट करता हूँ[b]; स्वप्न में मैं उससे बोलता हूँ[c]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “यदि तुममें से कोई नबी हो” भी कहा जा सकता है। इब्रानी में शाब्दिक रूप से “यदि तुम्हारा नबी हो” है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं दर्शन में उसे अपना परिचय देता हूँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “स्वप्न में मैं उससे बात करता हूँ।” इब्रानी में शाब्दिक रूप से “उसमें/उससे” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब उसने कहा
  rationale: यह कथात्मक wayyiqtol है। कर्ता मूल पद में निहित है और प्रसंग से याहवे है; ‘तब उसने कहा’ हिन्दी में कथा का प्रवाह स्वाभाविक रखता है।
- source_word: שִׁמְעוּ נָא דְבָרָי
  choice: अब मेरी बातें सुनो
  rationale: बहुवचन आज्ञार्थक और נָא की आग्रहपूर्ण तात्कालिकता को सरल, गंभीर आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אִם יִהְיֶה נְבִיאֲכֶם
  choice: यदि तुम्हारे बीच कोई नबी हो
  rationale: शाब्दिक रूप ‘तुम्हारा नबी’ है; हिन्दी में सामुदायिक संबंध और शर्त को स्पष्ट रखने के लिए ‘तुम्हारे बीच कोई नबी’ स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण का लिप्यंतरण किया गया है।
- source_word: בַּמַּרְאָה אֵלָיו אֶתְוַדָּע
  choice: दर्शन में अपने आपको उस पर प्रकट करता हूँ
  rationale: מַרְאָה प्रकाशनात्मक दर्शन को दर्शाता है और התפעל रूप אֶתְוַדָּע में आत्म-प्रकटन का भाव है। ‘उस पर प्रकट करता हूँ’ हिन्दी में लक्ष्य-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּחֲלוֹם אֲדַבֶּר בּוֹ
  choice: स्वप्न में मैं उससे बोलता हूँ
  rationale: בַּחֲלוֹם प्रकाशन का माध्यम बताता है। דבר के साथ בּוֹ को ‘उससे’ कहना मूल पूर्वसर्ग की निकटता बनाए रखता है, यद्यपि इसका आशय ‘उससे/उसको बोलना’ हो सकता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: भविष्यद्वक्ता को प्रकाशन देने का ढंग
  choice: दर्शन में आत्म-प्रकटन और स्वप्न में बोलना
  alternative: दर्शन में दिखाई देना और स्वप्न के द्वारा संदेश देना
  rationale: अनुवाद पद के दो समानांतर कथनों और उनके अलग क्रियापदों को बनाए रखता है तथा भविष्यद्वाणी के स्वरूप पर बाद की कोई धर्मसैद्धांतिक व्यवस्था आरोपित नहीं करता।
- issue: אֲדַבֶּר בּוֹ में संबंध
  choice: मैं उससे बोलता हूँ
  alternative: मैं उसको बोलता हूँ; मैं उसमें बोलता हूँ
  rationale: בּוֹ का रूप शाब्दिक रूप से ‘उसमें/उससे’ है। यहाँ דבר के साथ ‘उससे बोलना’ स्वाभाविक है, पर संभावित पूर्वसर्गीय अस्पष्टता को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नबी’, ‘दर्शन’ और ‘स्वप्न’ परिचित बाइबलीय शब्द हैं। वाक्य-संरचना मूल के समानांतर प्रकाशन-माध्यमों को स्पष्ट रखती है, जबकि टिप्पणियाँ वास्तविक इब्रानी विकल्पों को सुरक्षित रखती हैं।
