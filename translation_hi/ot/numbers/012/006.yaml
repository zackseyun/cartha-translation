  to: 'तब उसने कहा, “अब मेरी बातें सुनो: यदि तुम्हारे बीच कोई नबी हो[a], तो मैं, याहवे, दर्शन में उसे अपने को प्रकट करता हूँ[b]; स्वप्न में मैं उससे बोलता हूँ[c]।”'
