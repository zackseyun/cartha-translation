base_translation:
  language: en
  yaml_path: translation/ot/numbers/012/007.yaml
  text: Not so with my servant Moses[a]; he is faithful in all my house.
translation:
  language: hi
  text: मेरे सेवक मूसा के विषय में ऐसा नहीं है; वह मेरे सारे घर[a] में विश्वासयोग्य है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे सारे घराने में।” इब्रानी “घर” का अर्थ घराना या अधिकार-क्षेत्र भी हो सकता है, केवल कोई भवन नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא כֵן
  choice: ऐसा नहीं है
  rationale: यह पद पिछले कथन के विपरीत मूसा की विशिष्ट स्थिति पर जोर देता है; यह हिंदी में स्वाभाविक और स्पष्ट सुधारात्मक वाक्यांश है।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: यहाँ शब्द परमेश्वर से मूसा के सम्मानित और आधिकारिक संबंध को दर्शाता है, बंधुआ स्थिति को नहीं।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिंदी बाइबल परंपरा में प्रचलित नाम-रूप।
- source_word: בְּכָל בֵּיתִי
  choice: मेरे सारे घराने में
  rationale: בַּיִת यहाँ केवल भवन नहीं, बल्कि परमेश्वर के घराने या उसके अधीन समुदाय/क्षेत्र को सूचित कर सकता है। 'घराना' इस विस्तृत अर्थ को आधुनिक हिंदी में स्वाभाविक रूप से व्यक्त करता है, जबकि रूपक को बनाए रखता है।
- source_word: נֶאֱמָן
  choice: विश्वासयोग्य
  rationale: यह शब्द भरोसेमंद, निष्ठावान और सौंपे गए दायित्व में विश्वसनीय होने का भाव रखता है; 'विश्वासयोग्य' इस प्रसंग में सुस्थापित और उपयुक्त है।
- source_word: הוּא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम को हिंदी के स्पष्ट कर्ता और विधेयात्मक संरचना में स्वाभाविक ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: मूसा की भूमिका के संबंध में 'मेरे घर' का अर्थ
  choice: मुख्य पाठ में 'मेरे सारे घराने में' रखकर घर के रूपक और उसके सामुदायिक अर्थ दोनों को व्यक्त किया गया है।
  alternative: मेरे सारे घर में; मेरे समस्त परिवार में; मेरी पूरी प्रजा के बीच
  rationale: इब्रानी בַּיִת भवन, घराने या अधीन क्षेत्र को सूचित कर सकता है। 'घराना' अर्थ को केवल भौतिक भवन तक सीमित नहीं करता और 'मेरी प्रजा' जैसी अधिक व्याख्यात्मक स्पष्टता से भी बचता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य। 'विश्वासयोग्य' बाइबलीय संदर्भ में परिचित है, और 'घराना' मूल रूपक को बनाए रखते हुए उसके व्यापक आशय को सहज बनाता है।
