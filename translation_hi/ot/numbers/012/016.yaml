  text: Afterward the people set out from Hazeroth and camped in the wilderness of Paran.
translation:
  language: hi
  text: इसके बाद लोग हसेरोत से रवाना हुए और पारान के वीराने में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह पद पिछले घटनाक्रम के बाद की क्रमिक घटना बताता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: נָסְעוּ
  choice: रवाना हुए
  rationale: यह क्रिया यहाँ पड़ाव उठाकर आगे चलने को दर्शाती है; ‘रवाना हुए’ इस यात्रा-संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: यहाँ संपूर्ण इस्राएली समुदाय सामूहिक रूप से अभिप्रेत है; ‘लोग’ इसका सरल और स्वाभाविक अनुवाद है।
- source_word: מֵחֲצֵרוֹת
  choice: हसेरोत से
  rationale: स्थान-नाम को अनूदित करने के बजाय ध्वन्यंतरित किया गया है, और מִן उपसर्ग को ‘से’ से व्यक्त किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना है; ‘डेरा डाला’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בְּמִדְבַּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन, अनाबाद भूभाग को दर्शाता है; ‘वीराना’ यहाँ केवल रेतीले मरुस्थल तक अर्थ सीमित किए बिना सहज हिन्दी देता है।
- source_word: פָּארָן
  choice: पारान
  rationale: स्थान-नाम का मूल उच्चारण ध्यान में रखते हुए हिन्दी ध्वन्यंतरण किया गया है।
