  text: וּ/מִ/בֶּן֙ חֲמִשִּׁ֣ים שָׁנָ֔ה יָשׁ֖וּב מִ/צְּבָ֣א הָ/עֲבֹדָ֑ה וְ/לֹ֥א יַעֲבֹ֖ד עֽוֹד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/025.yaml
  text: And from fifty years old he shall withdraw from the service of the work and shall serve no more[a].
translation:
  language: hi
  text: और पचास वर्ष की आयु से वह सेवा के काम से हट जाए[a] और फिर सेवा न करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह सेवा के काम से लौट जाए”; इब्रानी क्रिया का शाब्दिक अर्थ “लौटना/पीछे मुड़ना” है, पर यहाँ इसका भाव सक्रिय सेवा से हटना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִבֶּן חֲמִשִּׁים שָׁנָה
  choice: और पचास वर्ष की आयु से
  rationale: यह इब्रानी मुहावरा उस आयु-सीमा को बताता है जहाँ से यह नियम लागू होता है। यह हिंदी में स्वाभाविक है और ‘पचास वर्ष से आरम्भ’ का भाव बनाए रखता है।
- source_word: יָשׁוּב
  choice: वह ... हट जाए
  rationale: שׁוב का मूल अर्थ ‘लौटना/पीछे मुड़ना’ है, पर מן (‘से’) के साथ इस सेवा-संबंधी प्रसंग में इसका आशय सक्रिय कर्तव्य से हटना है। मूल अर्थ की वास्तविक संभावना पादटिप्पणी में रखी गई है।
- source_word: מִצְּבָא הָעֲבֹדָה
  choice: सेवा के काम से
  rationale: צָבָא यहाँ सैनिक सेना नहीं, लेवियों की नियत सेवा या कर्तव्य को दर्शाता है; עֲבֹדָה काम/सेवा है। ‘सेवा के काम’ दोनों पदों के संबंध को संक्षिप्त और समझने योग्य रूप में व्यक्त करता है।
- source_word: וְלֹא יַעֲבֹד עוֹד
  choice: और फिर सेवा न करे
  rationale: עבד इस प्रसंग में सौंपे गए सेवा-कार्य को करने के लिए प्रयुक्त है। ‘फिर सेवा न करे’ आगे सक्रिय सेवा जारी न रखने का स्पष्ट अर्थ देता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और प्रशासनिक-सेवा के प्रसंग के अनुकूल भाषा रखी गई है। ‘सेवा के काम’ द्वारा צָבָא और עֲבֹדָה की निकटवर्ती, किंतु अलग, शब्दावली को यथासंभव बनाए रखा गया है।
