reference: Numbers 8:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֥ אֶת הַ/לְוִיִּ֖ם לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמְכ֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת יְדֵי/הֶ֖ם עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/010.yaml
  text: You shall bring the Levites before Yahweh[a], and the sons of Israel shall lay their hands on the Levites.
translation:
  language: hi
  text: तुम लेवियों को याहवे के सामने ले आना, और इस्राएल के पुत्र[a] अपने हाथ लेवियों पर रखें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है, जो इस्राएल के लोगों के लिए प्रयुक्त एक प्रचलित सामूहिक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: तुम ... ले आना
  rationale: हिफ़ील रूप का अर्थ ‘निकट लाना’ या ‘प्रस्तुत करना’ है। ‘सामने ले आना’ अनुष्ठानिक संदर्भ और दिशात्मक भाव दोनों को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: לוי के निश्चित बहुवचन का मानक हिन्दी रूप।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ यहाँ ‘के सामने’ अथवा ‘की उपस्थिति में’ है; अनुष्ठानिक संदर्भ में ‘के सामने’ संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी वाचा-नाम को उपाधि से बदलने के बजाय नाम के प्रचलित हिन्दी लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: וְסָמְכוּ
  choice: रखें
  rationale: סמך के साथ ‘हाथ ... पर’ अनुष्ठानिक रूप से हाथ रखने की क्रिया बताता है। ‘रखें’ स्पष्ट है और क्रिया में कोई अतिरिक्त धर्मवैज्ञानिक अर्थ नहीं जोड़ता।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल अभिव्यक्ति का रूप बनाए रखा गया है; साथ की टिप्पणी स्पष्ट करती है कि यह इस्राएलियों के लिए प्रचलित सामूहिक पद है।
- source_word: יְדֵיהֶם עַל הַלְוִיִּם
  choice: अपने हाथ लेवियों पर
  rationale: बहुवचन ‘हाथ’ और עַל का स्थान-संबंध सीधे तथा स्वाभाविक ढंग से सुरक्षित है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को नाम के रूप में बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल की स्पष्ट पुरुषवाचक बहुवचन अभिव्यक्ति को सुरक्षित रखता है, जबकि टिप्पणी उसके मानक सामूहिक प्रयोग को बताती है; इस प्रकार रूप और आशय दोनों पाठक के सामने रहते हैं।
- issue: हाथ रखने की क्रिया का अर्थ
  choice: अपने हाथ ... पर रखें
  alternative: हाथ रखकर नियुक्त करें; हाथ रखकर अधिकार सौंपें
  rationale: पद स्वयं क्रिया का वर्णन करता है, पर उसके पूर्ण धर्मवैज्ञानिक अर्थ को स्पष्ट नहीं करता। इसलिए अनुवाद क्रिया को रखता है और कोई विशिष्ट नियुक्ति, प्रतिनिधित्व या अधिकार-सौंपने की व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूसा को संबोधित एकवचन निर्देश के लिए ‘तुम ... ले आना’ और समुदाय के अगले कार्य के लिए ‘रखें’ प्रयोग किया गया है।
