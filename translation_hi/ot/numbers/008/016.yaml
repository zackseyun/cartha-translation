reference: Numbers 8:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּי֩ נְתֻנִ֨ים נְתֻנִ֥ים הֵ֨מָּה֙ לִ֔/י מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל תַּחַת֩ פִּטְרַ֨ת כָּל רֶ֜חֶם בְּכ֥וֹר כֹּל֙ מִ/בְּנֵ֣י יִשְׂרָאֵ֔ל לָקַ֥חְתִּי אֹתָ֖/ם לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/016.yaml
  text: For they are wholly given to me from among the sons of Israel[a]; in place of everyone who opens the womb, the firstborn of all the sons of Israel[c][b], I have taken them for myself.
translation:
  language: hi
  text: क्योंकि वे इस्राएल के पुत्रों[c] में से मुझे पूरी तरह दिए गए हैं[a]। इस्राएल के पुत्रों के हर गर्भ खोलनेवाले के, अर्थात् हर पहलौठे के[c][b], बदले मैंने उन्हें अपने लिए ले लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निश्चय ही दिए गए’ अथवा ‘संपूर्ण रूप से दिए गए’; इब्रानी में ‘दिए गए’ शब्द बल देने के लिए दोहराया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘गर्भ खोलनेवाला हर एक’; यह पहलौठे के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या ‘इस्राएली’ अथवा ‘इस्राएल के लोग’; इब्रानी में ‘इस्राएल के पुत्र’।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְתֻנִים נְתֻנִים
  choice: पूरी तरह दिए गए
  rationale: इब्रानी में निष्क्रिय कृदंत ‘दिए गए’ की पुनरावृत्ति बल देने के लिए है। ‘पूरी तरह दिए गए’ इस बल और परमेश्वर के लिए विशेष समर्पण—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִי
  choice: मुझे
  rationale: पहला לִי उस व्यक्ति को दर्शाता है जिसे वे दिए गए हैं और साथ ही अधिकार अथवा समर्पण का भाव रखता है; ‘मुझे’ हिन्दी वाक्य-विन्यास में स्वाभाविक है।
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: מִתּוֹךְ किसी समूह के भीतर से चुने जाने को दर्शाता है। ‘में से’ इसे स्पष्ट करता है और ‘इस्राएल के पुत्रों’ से मूल पारिवारिक अभिव्यक्ति सुरक्षित रहती है।
- source_word: תַּחַת
  choice: के बदले
  rationale: 'यहाँ תַּחַת प्रतिस्थापन दर्शाता है: लेवीय इस्राएल के पहलौठों के स्थान पर लिए गए हैं। ‘के बदले’ संक्षिप्त और स्वाभाविक है।'
- source_word: פִּטְרַת כָּל רֶחֶם
  choice: गर्भ खोलनेवाले हर एक
  rationale: यह इब्रानी मुहावरा गर्भ से सबसे पहले निकलनेवाले, अर्थात पहलौठे, को दर्शाता है। मूल बिंब को मुख्य पाठ में रखकर ‘यानी हर पहलौठे’ से उसका अर्थ स्पष्ट किया गया है।
- source_word: בְּכוֹר כֹּל מִבְּנֵי יִשְׂרָאֵל
  choice: यानी हर पहलौठे
  rationale: यह पदबंध पिछले मुहावरे की समानाधिकरणीय व्याख्या करता है। ‘यानी’ उस स्पष्टीकरण-संबंध को सहज हिन्दी में प्रकट करता है।
- source_word: לָקַחְתִּי אֹתָם לִי
  choice: मैंने उन्हें अपने लिए ले लिया है
  rationale: पूर्ण क्रिया संपन्न दैवी ग्रहण को और अंतिम לִי व्यक्तिगत अधिकार अथवा समर्पण को व्यक्त करता है; ‘अपने लिए’ इस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल पाठ में पुरुषवाची पारिवारिक अभिव्यक्ति ‘इस्राएल के पुत्र’ है। इसे मुख्य पाठ में सुरक्षित रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि प्रसंग में यह सामूहिक रूप से इस्राएली समुदाय को सूचित करती है।
- issue: लेवियों और पहलौठों के बीच תַּחַת का संबंध
  choice: प्रतिस्थापन—‘के बदले’
  alternative: के स्थान पर; के एवज में
  rationale: वाक्य लेवियों को पहलौठों के बदले परमेश्वर द्वारा अपने लिए लिए जाने के रूप में प्रस्तुत करता है। ‘के बदले’ इस संबंध को व्यक्त करता है, पर उसके विस्तृत धार्मिक आशय को पाठ में अतिरिक्त रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी अपनाई गई है। इब्रानी के ‘गर्भ खोलने’ वाले बिंब को सुरक्षित रखते हुए उसी वाक्य में उसका अर्थ ‘हर पहलौठे’ से स्पष्ट किया गया है। ‘इस्राएल के पुत्रों’ पारंपरिक पारिवारिक पदावली को बनाए रखता है; विकल्प पादटिप्पणी में दिए गए हैं।
