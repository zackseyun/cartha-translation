base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/003.yaml
  text: 'And Aaron did so: toward the front of the lampstand he set up its lamps[b][a], just as Yahweh had commanded Moses.'
translation:
  language: hi
  text: 'और हारून ने वैसा ही किया: उसने दीपदान के अग्रभाग की ओर[a] उसके दीप लगाए[b], ठीक जैसा याहवे ने मूसा को आज्ञा दी थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘दीपदान के अग्रभाग के सामने’ अथवा ‘दीपदान के अग्रभाग की ओर मुख किए हुए’।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके दीप जलाए’। इब्रानी क्रिया का शाब्दिक भाव दीपों को ऊपर चढ़ाने का है; इस प्रसंग में इसका अर्थ उन्हें लगाना या जलाना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ כֵּן
  choice: और हारून ने वैसा ही किया
  rationale: यह इब्रानी मुहावरा पिछली आज्ञा के अनुसार कार्य करने को व्यक्त करता है। यह हिंदी में स्वाभाविक है और כֵּן के संदर्भसूचक बल को बनाए रखता है।
- source_word: אֶל מוּל פְּנֵי
  choice: दीपदान के सामने की ओर
  rationale: यह संयुक्त पद दिशा और अभिमुखता बताता है। चुना हुआ अनुवाद स्थानिक संबंध को अनावश्यक रूप से निश्चित किए बिना मूल भाव व्यक्त करता है।
- source_word: הַמְּנוֹרָה
  choice: दीपदान
  rationale: मिलापवाले तंबू के संदर्भ में מְנוֹרָה के लिए यह स्पष्ट, प्रचलित और अर्थपरक हिंदी शब्द है।
- source_word: הֶעֱלָה
  choice: लगाए
  rationale: עלה का हिफ़ील रूप दीपों को ऊपर रखने या स्थापित करने का भाव दे सकता है और प्रसंग में उन्हें जलाने का अर्थ भी संभव है। ‘लगाए’ व्यवस्था या स्थापना का मुख्य भाव रखता है, जबकि वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: נֵרֹתֶיהָ
  choice: उसके दीप
  rationale: स्त्रीलिंग एकवचन प्रत्यय दीपदान की ओर संकेत करता है; ‘उसके दीप’ इस संबंध को स्पष्ट और ठोस रूप में व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक जैसा याहवे ने मूसा को आज्ञा दी थी
  rationale: यह वाक्यांश ईश्वरीय आज्ञा के साथ हारून के ठीक अनुरूप आचरण को व्यक्त करता है। ‘दी थी’ पूर्व में दी गई आज्ञा को स्वाभाविक हिंदी में दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसका निकट हिंदी लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הֶעֱלָה का अर्थ
  choice: दीप लगाए
  alternative: दीप जलाए
  rationale: इस प्रसंग में क्रिया दीपों को स्थापित या व्यवस्थित करने और उन्हें जलाने—दोनों की ओर संकेत कर सकती है। मुख्य पाठ में स्थापना का भाव रखा गया है और दूसरी वास्तविक संभावना पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दीपदान’ सामान्य पाठक के लिए स्पष्ट है, और दो वास्तविक इब्रानी अस्पष्टताओं को मुख्य पाठ में जबरन सुलझाने के बजाय पाद-टिप्पणियों में सुरक्षित रखा गया है।
