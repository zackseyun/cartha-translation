source:
  edition: WLC
  text: וְ/הִקְרַבְתָּ֙ אֶת הַ/לְוִיִּ֔ם לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד וְ/הִ֨קְהַלְתָּ֔ אֶֽת כָּל עֲדַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/009.yaml
  text: Then you shall bring the Levites before the tent of meeting[a], and you shall assemble the whole congregation of the sons of Israel.
translation:
  language: hi
  text: फिर तुम लेवियों को मिलापवाले तंबू के सामने लाना, और इस्राएलियों[क] की सारी मण्डली को इकट्ठा करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'या, शाब्दिक: “इस्राएल के पुत्रों की सारी मण्डली।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתָּ
  choice: फिर तुम ... लाना
  rationale: קרב के हिफ़ील रूप का अर्थ यहाँ किसी को पवित्र स्थान के निकट लाना है। प्रक्रियात्मक क्रम में वाव को स्वाभाविक हिन्दी में “फिर” से व्यक्त किया गया है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवी गोत्र के उन सदस्यों के लिए प्रचलित और स्पष्ट हिन्दी पद, जो पवित्रस्थान की सेवा के लिए अलग किए गए थे।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान-सूचक अर्थ “के आगे/सामने” को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: इस्राएल के पवित्र तम्बू के लिए हिन्दी बाइबलीय परंपरा में परिचित पद; מוֹעֵד में निहित नियत भेंट/मिलने के स्थान का भाव बनाए रखता है।
- source_word: וְהִקְהַלְתָּ
  choice: इकट्ठा करना
  rationale: קהל के हिफ़ील का अर्थ समुदाय को एक स्थान पर एकत्र करना है; आधुनिक सामान्य हिन्दी में यह सहज है।
- source_word: כָּל עֲדַת
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ इस्राएल के संगठित समुदाय को दर्शाता है और כָּל उसकी समग्रता व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: हिब्रू का शाब्दिक रूप “इस्राएल के पुत्र” है, पर इस सामुदायिक संदर्भ में वाक्यांश समूचे इस्राएली समुदाय को सूचित करता है; “इस्राएलियों” आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यद्यपि हिब्रू अभिव्यक्ति रूपतः पुल्लिंग और पुत्र-संबंधी है, यहाँ पूरी वाचा-समुदाय की मण्डली अभिप्रेत है। “इस्राएलियों” उस सामूहिक अर्थ को बिना किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, निर्देशात्मक और गरिमापूर्ण रखी गई है। अनुष्ठानिक संदर्भ के लिए परिचित पद “मिलापवाला तम्बू” और “मण्डली” बनाए गए हैं; क्रियाओं में हिन्दी की विधिसूचक infinitive शैली (“लाना… करना”) अपनाई गई है।
