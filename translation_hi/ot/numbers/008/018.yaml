  text: And I took the Levites in place of every firstborn among the sons of Israel[a].
translation:
  language: hi
  text: और मैंने इस्राएल के पुत्रों में से हर पहलौठे के स्थान पर लेवियों को ले लिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों में से।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों में से” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֶקַּח
  choice: और मैंने ... ले लिया
  rationale: לקח का क़ाल वय्यिक्तोल प्रथम पुरुष एकवचन सामान्य कथात्मक अर्थ ‘और मैंने लिया’ देता है। हिन्दी में ‘ले लिया’ प्रसंग के अनुरूप स्वाभाविक है और नियुक्ति या चयन का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הַלְוִיִּם
  choice: लेवियों को
  rationale: निश्चित बहुवचन संज्ञा विशेष रूप से लेवीवंशियों को सूचित करती है; ‘लेवी’ का हिन्दी बहुवचन परसर्ग के साथ ‘लेवियों को’ स्वाभाविक और सटीक है।
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: यहाँ शब्द स्थानगत ‘नीचे’ नहीं, बल्कि प्रतिस्थापन का भाव व्यक्त करता है। ‘के स्थान पर’ उस प्रतिनिधिक प्रतिस्थापन को स्पष्ट रखता है।
- source_word: כָּל בְּכוֹר
  choice: हर पहलौठे
  rationale: एकवचन בְּכוֹר के साथ כָּל का वितरणात्मक अर्थ ‘हर’ है। ‘पहलौठा’ मूल के ‘पहिलौठे’ को व्यक्त करता है; मुख्य पाठ में ‘पुरुष’ जोड़ना मूल से अधिक स्पष्टता देना होता।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: यह इब्रानी पदबंध का निकट और स्वाभाविक हिन्दी रूप है। ‘में से’ इस प्रसंग के समूहगत/अंशसूचक ב को स्पष्ट करता है और मूल की पुल्लिंग अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल में स्पष्ट रूप से ‘इस्राएल के पुत्र’ है। मुख्य पाठ उस रूप को सुरक्षित रखता है, जबकि पादटिप्पणी अधिक प्रचलित सामूहिक विकल्प बताती है; इससे वाचा-समुदाय के व्यापक संकेत को नकारे बिना मूल की लैंगिक अभिव्यक्ति बनी रहती है।
- issue: लेवियों और पहलौठों के बीच संबंध
  choice: के स्थान पर
  alternative: के बदले
  rationale: दोनों प्रतिस्थापन व्यक्त करते हैं, पर ‘के स्थान पर’ अधिक तटस्थ है और पद से आगे जाकर प्रायश्चित या किसी विशिष्ट धर्मसैद्धांतिक विनिमय का अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘ले लिया’ मूल क्रिया की ठोसता और ‘के स्थान पर’ प्रतिस्थापन का भाव सुरक्षित रखते हैं।
