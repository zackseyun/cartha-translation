base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/008.yaml
  text: Then they shall take one young bull and its grain offering of fine flour mixed with oil[a], and you shall take a second young bull for a sin offering.
translation:
  language: hi
  text: तब वे एक जवान बैल और उसकी अन्नबलि—तेल में मिला हुआ मैदा—लें; और तुम पापबलि[a] के लिए दूसरा जवान बैल लो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת याजकीय अनुष्ठानों में पापबलि अथवा शुद्धिकरण-बलि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: तब वे ... लें
  rationale: अनुष्ठान-संबंधी निर्देशों के क्रम में संयोजक वाव सहित क्रिया को क्रमसूचक ‘तब’ और विधिसूचक ‘लें’ से व्यक्त किया गया है।
- source_word: פַּר בֶּן בָּקָר
  choice: एक जवान बैल
  rationale: शाब्दिक मुहावरा ‘गोधन का पुत्र बैल’ जवान बैल को दर्शाता है; ‘एक’ अगले ‘दूसरा’ बैल से इसका संबंध स्पष्ट करता है।
- source_word: וּמִנְחָתוֹ
  choice: और उसके साथ का अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה अन्नबलि है; प्रत्यय पहले बैल के साथ चढ़ाए जाने वाले अन्नबलि को सूचित करता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह भेंट में प्रयुक्त बारीक पिसे उत्तम आटे का पारंपरिक अनुष्ठानिक पद है; ‘मैदा’ सामान्य आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल में मिला हुआ
  rationale: बलिदानी तैयारी की प्रचलित अभिव्यक्ति को सहज आधुनिक हिन्दी में रखा गया है।
- source_word: וּפַר שֵׁנִי בֶן בָּקָר תִּקַּח
  choice: और तुम ... एक दूसरा जवान बैल लेना
  rationale: इब्रानी में बहुवचन ‘वे लें’ से एकवचन संबोधन ‘तुम लेना’ की ओर जो बदलाव है, उसे सुरक्षित रखा गया है; שֵׁנִי को ‘दूसरा’ कहा गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: याजकीय बलिदानी संदर्भ में חַטָּאת के लिए परिचित हिन्दी पद ‘पापबलि’ रखा गया है; शुद्धिकरण-संबंधी अर्थविकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: बलिदानी विधान में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह पद परंपरागत रूप से ‘पापबलि’ कहलाने वाले याजकीय बलिदान को दर्शाता है, पर उसका अनुष्ठानिक कार्य शुद्धिकरण से भी जुड़ा हो सकता है। मुख्य पाठ परिचित पद रखता है और पादटिप्पणी वास्तविक अर्थविकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। अनुष्ठानिक पदावली में ‘अन्नबलि’ और ‘पापबलि’ जैसे परिचित संयुक्त शब्द रखे गए हैं। इब्रानी में बहुवचन से एकवचन संबोधन की ओर बदलाव को जानबूझकर सुरक्षित रखा गया है।
