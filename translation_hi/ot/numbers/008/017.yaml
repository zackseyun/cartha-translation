id: NUM.8.17
reference: Numbers 8:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י לִ֤/י כָל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל בָּ/אָדָ֖ם וּ/בַ/בְּהֵמָ֑ה בְּ/י֗וֹם הַכֹּתִ֤/י כָל בְּכוֹר֙ בְּ/אֶ֣רֶץ מִצְרַ֔יִם הִקְדַּ֥שְׁתִּי אֹתָ֖/ם לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/017.yaml
  text: For every firstborn among the sons of Israel[a], among man and among beast, is mine. On the day I struck every firstborn in the land of Egypt[b], I consecrated them to myself.
translation:
  language: hi
  text: क्योंकि इस्राएलियों[a] में हर पहलौठा, चाहे मनुष्यों में हो या पशुओं में, मेरा है। जिस दिन मैंने मिस्र देश में हर पहलौठे को मारा, उसी दिन मैंने उन्हें अपने लिए पवित्र ठहराया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, ‘इस्राएल के पुत्रों में।’
    reason: इब्रानी की पारिवारिक-वाचा संबंधी अभिव्यक्ति का अधिक शब्दशः विकल्प बताने के लिए।
  - marker: b
    text: या ‘अपने लिए अलग कर लिया।’
    reason: הִקְדַּשְׁתִּי के वैकल्पिक अर्थ को दर्शाने के लिए, जिसमें पवित्र उपयोग हेतु अलग करना निहित है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका स्वाभाविक संयोजक है।
- source_word: לִי
  choice: मेरा है
  rationale: यह पद अधिकार या स्वामित्व व्यक्त करता है; हिन्दी में ‘मेरा है’ सीधा और स्वाभाविक है।
- source_word: כָל בְּכוֹר
  choice: हर पहलौठा
  rationale: एकवचन सामूहिक अभिव्यक्ति को स्वाभाविक हिन्दी में रखा गया है; इस पद में ‘नर’ स्पष्ट रूप से नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में
  rationale: ‘इस्राएल के पुत्रों में’ शब्दशः संभव है, पर यहाँ पूरे इस्राएली समुदाय का बोध है; ‘इस्राएलियों में’ आधुनिक हिन्दी में अधिक स्पष्ट और स्वाभाविक है।
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: चाहे मनुष्य का हो या पशु का
  rationale: इब्रानी के दो सामूहिक वर्गों—मनुष्य और पशु—का विरोध स्पष्ट करते हुए हिन्दी में सुबोध समानांतर रचना अपनाई गई है।
- source_word: בְּיוֹם הַכֹּתִי
  choice: जिस दिन मैंने ... मारा, उसी दिन
  rationale: ‘जिस दिन ... उसी दिन’ इब्रानी काल-सूचक संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है; נכה के सीधे अर्थ के लिए ‘मारा’ रखा गया है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: इब्रानी में आए ‘देश’ को बनाए रखता है और हिन्दी में स्वाभाविक है।
- source_word: הִקְדַּשְׁתִּי אֹתָם לִי
  choice: मैंने उन्हें अपने लिए पवित्र ठहराया
  rationale: हिफ़ील रूप का अर्थ अपने लिए पवित्र या समर्पित करके अलग करना है; यह अनुवाद उसके पवित्रता-संबंधी बल को बनाए रखता है।
theological_decisions:
- issue: בָּאָדָם में मानव-जाति और पशु का वर्गगत विरोध
  choice: चाहे मनुष्य का हो या पशु का
  alternative: मनुष्य और पशु में
  rationale: यहाँ אָדָם किसी एक पुरुष के लिए नहीं, मनुष्यों के वर्ग के लिए है। चुनी हुई रचना इस सामूहिक अर्थ को बिना लैंगिक भ्रम के स्पष्ट करती है।
- issue: הִקְדַּשְׁתִּי का पवित्रता-संबंधी अर्थ
  choice: अपने लिए पवित्र ठहराया
  alternative: अपने लिए अलग कर लिया
  rationale: संदर्भ में केवल स्वामित्व नहीं, परमेश्वर के लिए पवित्र समर्पण भी निहित है। ‘पवित्र ठहराया’ यह धार्मिक बल बनाए रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: मिस्र के पहलौठों पर נכה का अर्थ
  choice: मारा
  alternative: मार डाला
  rationale: निर्गमन की घटना में परिणाम मृत्यु है, पर इस पद का क्रिया-रूप अपने आप में अधिक सामान्य ‘मारना/प्रहार करना’ है; इसलिए पाठ में अनावश्यक रूप से अर्थ को अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पहलौठा’ बाइबलीय संदर्भ में परिचित शब्द है। वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार है, जबकि मनुष्य/पशु का विरोध, परमेश्वर का अधिकार और पवित्र समर्पण—तीनों मूल पाठ के अनुसार सुरक्षित हैं।
