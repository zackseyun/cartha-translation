  text: וְ/אַחֲרֵי כֵ֞ן בָּ֣אוּ הַ/לְוִיִּ֗ם לַ/עֲבֹ֤ד אֶת עֲבֹֽדָתָ/ם֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד לִ/פְנֵ֥י אַהֲרֹ֖ן וְ/לִ/פְנֵ֣י בָנָ֑י/ו כַּ/אֲשֶׁר֩ צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ עַל הַ/לְוִיִּ֔ם כֵּ֖ן עָשׂ֥וּ לָ/הֶֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/022.yaml
  text: And after that the Levites came to perform their service in the tent of meeting before Aaron and before his sons. Just as Yahweh had commanded Moses concerning the Levites[a], so they did for them.
translation:
  language: hi
  text: इसके बाद लेवीय अपनी सेवा करने के लिए हारून और उसके पुत्रों के सामने मिलापवाले तम्बू में आए। यहोवा ने मूसा को लेवियों के विषय में जैसी आज्ञा दी थी, वैसा ही उन्होंने उनके लिए किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वैसा ही उन्होंने उनके संबंध में किया।” इब्रानी वाक्य संक्षिप्त है; इसका संकेत लेवियों के संबंध में निर्धारित विधियाँ पूरी किए जाने की ओर हो सकता है।
    reason: כֵּן עָשׂוּ לָהֶם में לָהֶם के लाभार्थक अथवा संबंधात्मक अर्थ की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पद पिछले शुद्धीकरण और समर्पण-विधानों के बाद की अगली घटना बताता है; यह आधुनिक हिन्दी में स्वाभाविक क्रमसूचक अभिव्यक्ति है।
- source_word: בָּאוּ
  choice: आए
  rationale: मूल क्रिया का सामान्य अर्थ ‘आना’ है; ‘प्रवेश किया’ कहने से तम्बू के भीतर जाने का भाव आवश्यकता से अधिक निश्चित हो जाता।
- source_word: הַלְוִיִּם
  choice: लेवीय
  rationale: यह लेवी गोत्र के लोगों के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित और सुबोध जातिवाचक संज्ञा है।
- source_word: לַעֲבֹד אֶת עֲבֹדָתָם
  choice: अपनी सेवा करने
  rationale: क्रिया और उसी मूल से बनी संज्ञा की इब्रानी पुनरुक्ति को हिन्दी में सहज रखते हुए पवित्रस्थान से जुड़ी नियुक्त सेवा का भाव सुरक्षित रहता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू में
  rationale: यह אֹהֶל מוֹעֵד का स्थापित हिन्दी नाम है; בְּ को ‘में’ से व्यक्त किया गया है।
- source_word: לִפְנֵי אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: हारून और उसके पुत्रों के सामने
  rationale: ‘सामने’ मूल के स्थानिक/संबंधात्मक अर्थ को सुरक्षित रखता है और ‘देखरेख में’ जैसी व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम YHWH का सुस्थापित लिप्यंतरण है और इसे केवल किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: עַל הַלְוִיִּם
  choice: लेवियों के विषय में
  rationale: यहाँ עַל आज्ञा की विषयवस्तु बताता है; ‘के विषय में’ सटीक और स्वाभाविक है।
- source_word: כֵּן עָשׂוּ לָהֶם
  choice: वैसा ही उन्होंने उनके लिए किया
  rationale: इब्रानी की संक्षिप्तता और बहुवचन कर्ता को बनाए रखता है; לָהֶם को लाभार्थक ‘उनके लिए’ समझता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए ‘यहोवा’ प्रचलित और पहचानने योग्य रूप है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापरक लिप्यंतरण है।
- issue: כֵּן עָשׂוּ לָהֶם में कार्य के कर्ता और लक्ष्य का संबंध
  choice: वैसा ही उन्होंने उनके लिए किया
  alternative: वैसा ही उन्होंने उनके साथ किया
  rationale: मूल में कर्ता स्पष्ट रूप से दोहराया नहीं गया और לָהֶם संक्षिप्त है। मुख्य पाठ लाभार्थक अर्थ रखता है, पर विधियाँ लेवियों के संबंध में/उन पर पूरी किए जाने का अर्थ भी संभव है; इसलिए तनाव पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली। ‘मिलापवाला तम्बू’ और ‘लेवीय’ जैसे परिचित बाइबलीय पद रखे गए हैं; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
