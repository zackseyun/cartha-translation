  text: וְ/הֵנִיף֩ אַהֲרֹ֨ן אֶת הַ/לְוִיִּ֤ם תְּנוּפָה֙ לִ/פְנֵ֣י יְהוָ֔ה מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָי֕וּ לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/011.yaml
  text: Aaron shall present the Levites as a wave offering before Yahweh from the sons of Israel[b][a], and they shall be to serve the service of Yahweh.
translation:
  language: hi
  text: और हारून लेवियों को इस्राएलियों में से[b] यहोवा के सामने लहराने की भेंट के रूप में प्रस्तुत करेगा[a], ताकि वे यहोवा की सेवा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हारून लेवियों को यहोवा के सामने लहराने की भेंट के रूप में लहराए।” इब्रानी में क्रिया और “लहराने की भेंट” एक ही शब्द-मूल से हैं और अनुष्ठानिक प्रस्तुति को बताते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएलियों की ओर से।” इब्रानी वाक्यांश लेवियों को इस्राएलियों में से लिए जाने या उनकी ओर से उनके प्रतिनिधि के रूप में प्रस्तुत किए जाने—दोनों का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהֵנִיף ... תְּנוּפָה
  choice: हिलाई हुई भेंट के रूप में प्रस्तुत करे
  rationale: क्रिया और संज्ञा एक ही मूल נוף से हैं और अनुष्ठानिक प्रस्तुति का संकेत देती हैं। व्यक्तियों के विषय में केवल ‘हिलाए’ कहना भ्रामक हो सकता है; इसलिए मुख्य पाठ में स्वाभाविक ‘प्रस्तुत करे’ रखा गया और पारंपरिक अनुष्ठानिक पद ‘हिलाई हुई भेंट’ बनाए रखा गया।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवी गोत्र के सदस्यों के लिए प्रचलित हिन्दी पद।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह वाक्यांश यहोवा की उपस्थिति में अनुष्ठान संपन्न होने का सामान्य इब्रानी मुहावरा है; परमेश्वर के व्यक्तिगत नाम को ‘यहोवा’ रूप में रखा गया है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की ओर से
  rationale: מֵאֵת यहाँ उस समुदाय के साथ लेवियों का स्रोत/प्रतिनिधिक संबंध व्यक्त कर सकता है। निकट संदर्भ में वे इस्राएलियों के बदले यहोवा की सेवा के लिए दिए जाते हैं; फिर भी ‘इस्राएलियों में से’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְהָיוּ לַעֲבֹד אֶת עֲבֹדַת יְהוָה
  choice: ताकि वे यहोवा की सेवा करें
  rationale: शाब्दिक पुनरुक्ति ‘सेवा की सेवा करें’ हिन्दी में अस्वाभाविक है। उद्देश्य/परिणाम का भाव ‘ताकि’ से और עבד/עבודה का आशय ‘सेवा करें’ से स्पष्ट तथा स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: लेवियों को תְּנוּפָה के रूप में चढ़ाने का अनुष्ठानिक चित्र
  choice: ‘हिलाई हुई भेंट के रूप में प्रस्तुत करे’
  alternative: ‘लेवियों को हिलाई हुई भेंट के रूप में हिलाए’
  rationale: यह भाषा लेवियों के समर्पण को भेंट की अनुष्ठानिक श्रेणी में रखती है, पर यह नहीं कहती कि उनका बलिदान किया गया। चयनित रूप इस तनाव को बनाए रखते हुए हिन्दी में गलत भौतिक अर्थ से बचाता है।
- issue: מֵאֵת בְּנֵי יִשְׂרָאֵל का संबंध
  choice: ‘इस्राएलियों की ओर से’
  alternative: ‘इस्राएलियों में से’
  rationale: दोनों अर्थ व्याकरण और संदर्भ में संभव हैं। आसपास के पदों में लेवी इस्राएल के पहिलौठों के स्थान पर दिए जाते हैं, इसलिए प्रतिनिधिक अर्थ मुख्य पाठ में रखा गया है; स्रोत/समुदाय-अर्थ को पादटिप्पणी में संरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘हिलाई हुई भेंट’ पारंपरिक उपासना-संबंधी पद है, जबकि ‘प्रस्तुत करे’ व्यक्तियों के विषय में सहज हिन्दी देता है। ‘इस्राएल के पुत्रों’ के बजाय सामान्य सामुदायिक नाम ‘इस्राएली’ प्रयोग किया गया है, क्योंकि בְּנֵי יִשְׂרָאֵל यहाँ पूरे समुदाय का रूढ़ पद है।
