    text: या, “जब तू दीपकों को जलाएगा।” इब्रानी क्रिया का शाब्दिक अर्थ “ऊपर चढ़ाना” है; इस प्रसंग में इसका आशय दीपकों को इस तरह लगाने से हो सकता है कि वे आगे की ओर प्रकाश दें, या उन्हें जलाने से।
