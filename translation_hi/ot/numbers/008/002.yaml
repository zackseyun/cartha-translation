  text: Speak to Aaron and say to him, ‘When you set up the lamps, the seven lamps shall give light in front of the lampstand.’
translation:
  language: hi
  text: हारून से बात कर और उससे कह, ‘जब तू दीपकों को लगाएगा[a], तब सातों दीपक दीपाधार के सामने की ओर प्रकाश दें।’
  philosophy: optimal-equivalence
  footnotes:
