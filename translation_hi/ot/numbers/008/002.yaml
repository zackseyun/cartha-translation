  rationale: נֵר ठोस प्रकाश-पात्र अर्थात दीपक को सूचित करता है, केवल अमूर्त प्रकाश को नहीं।
- source_word: אֶל מוּל פְּנֵי הַמְּנוֹרָה
  choice: दीपाधार के सामने की ओर
