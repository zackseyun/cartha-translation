base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/013.yaml
  text: And you shall set the Levites before Aaron and before his sons[a], and you shall present them as a wave offering to Yahweh.
translation:
  language: hi
  text: तू लेवियों को हारून और उसके पुत्रों के सामने खड़ा कर, और उन्हें यहोवा के लिए हिलाई हुई भेंट के रूप में[a] अर्पित कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “उन्हें यहोवा के लिए हिलाई हुई भेंट के रूप में हिलाना।” इब्रानी में अनुष्ठानिक रूप से हिलाने या प्रस्तुत करने की क्रिया और “हिलाई हुई भेंट” की संज्ञा साथ-साथ आई हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: तू ... खड़ा करना
  rationale: עמד के हिफ़ील रूप का अर्थ यहाँ किसी को नियत स्थान पर खड़ा करना है; आज्ञात्मक संदर्भ में यह स्वाभाविक और स्पष्ट है।
- source_word: הַלְוִיִּם
  choice: लेवियों को
  rationale: इस्राएल के लेवी गोत्र से संबंधित समूह के लिए प्रचलित हिन्दी पद; निश्चितता संदर्भ से स्पष्ट है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान और औपचारिक प्रस्तुति—दोनों का भाव व्यक्त करता है।
- source_word: אַהֲרֹן וְלִפְנֵי בָנָיו
  choice: हारून और उसके पुत्रों के सामने
  rationale: व्यक्तिनाम का मानक हिन्दी रूप रखा गया है और בָנָיו का पुरुषवाचक अर्थ ‘उसके पुत्रों’ से सुरक्षित है।
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: उन्हें ... हिलाई हुई भेंट के रूप में अर्पित करना
  rationale: नוף और תְּנוּפָה के संबद्ध अनुष्ठानिक भाव को ‘हिलाई हुई भेंट’ से बनाए रखते हुए व्यक्तियों के संबंध में क्रिया को स्वाभाविक हिन्दी ‘अर्पित करना’ से व्यक्त किया गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל अनुष्ठानिक समर्पण के लक्ष्य/हित को दर्शाता है; परमेश्वर के निज नाम יהוה को हिन्दी के परिचित रूप ‘यहोवा’ में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निज वाचा-नाम है, इसलिए उसे उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- issue: लेवियों से संबंधित अनुष्ठानिक क्रिया
  choice: हिलाई हुई भेंट के रूप में अर्पित करना
  alternative: हिलाई हुई भेंट के रूप में उन्हें हिलाना
  rationale: यह अनुवाद औपचारिक अर्पण का अर्थ स्पष्ट करता है, पर संज्ञा תְּנוּפָה में निहित हिलाने की अनुष्ठानिक छवि को भी बनाए रखता है; अधिक शाब्दिक पुनरुक्ति पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। एकवचन संबोधन को निकटवर्ती विधिक निर्देशों के अनुरूप ‘तू’ से रखा गया है। अनुष्ठानिक पद ‘हिलाई हुई भेंट’ को तकनीकी विशिष्टता बनाए रखने के लिए सुरक्षित रखा गया है।
