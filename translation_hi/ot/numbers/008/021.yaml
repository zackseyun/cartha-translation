source:
  edition: WLC
  text: וַ/יִּֽתְחַטְּא֣וּ הַ/לְוִיִּ֗ם וַֽ/יְכַבְּסוּ֙ בִּגְדֵי/הֶ֔ם וַ/יָּ֨נֶף אַהֲרֹ֥ן אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה וַ/יְכַפֵּ֧ר עֲלֵי/הֶ֛ם אַהֲרֹ֖ן לְ/טַהֲרָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/021.yaml
  text: And the Levites purified themselves and washed their garments[a], and Aaron presented them as a wave offering before Yahweh, and Aaron made atonement for them to cleanse them.
translation:
  language: hi
  text: लेवियों ने अपने आपको शुद्ध किया और अपने वस्त्र धोए। तब हारून ने उन्हें यहोवा के सामने लहराने की भेंट के रूप में प्रस्तुत किया,[a] और उन्हें शुद्ध करने के लिए हारून ने उनके लिए प्रायश्चित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “हारून ने उन्हें लहराने की भेंट के रूप में लहराया” भी हो सकता है। इब्रानी में यह यहोवा के सामने किसी वस्तु या व्यक्ति को अनुष्ठानपूर्वक प्रस्तुत करने का प्रचलित पदबंध है।
    reason: मूल क्रिया और उसी मूल से बने संज्ञा-पदबंध की अधिक शाब्दिक सम्भावना को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּתְחַטְּאוּ
  choice: अपने आपको शुद्ध किया
  rationale: हित्पएल रूप आत्म-संबंधी शुद्धीकरण को व्यक्त करता है। यहाँ पाप का उल्लेख स्पष्ट रूप से नहीं है, इसलिए ‘पाप से’ नहीं जोड़ा गया।
- source_word: וַיְכַבְּסוּ בִּגְדֵיהֶם
  choice: अपने वस्त्र धोए
  rationale: यह अनुष्ठानिक शुद्धीकरण के प्रसंग में स्वाभाविक और सटीक हिन्दी है।
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: हिलाई जाने वाली भेंट के रूप में प्रस्तुत किया
  rationale: इब्रानी पदबंध अनुष्ठानिक प्रस्तुति का मानक प्रयोग है। ‘प्रस्तुत किया’ अर्थ को स्वाभाविक रखता है, जबकि पारंपरिक भेंट-नाम भी बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: लִפְנֵי का सामान्य अर्थ ‘के सामने’ है और יהוה को उसके वाचा-संबंधी नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיְכַפֵּר עֲלֵיהֶם
  choice: उनके लिए प्रायश्चित किया
  rationale: याजकीय संदर्भ में כפר के लिए ‘प्रायश्चित करना’ प्रचलित, सुबोध और धार्मिक अर्थ को सुरक्षित रखने वाला अनुवाद है।
- source_word: לְטַהֲרָם
  choice: उन्हें शुद्ध करने के लिए
  rationale: लְ उद्देश्य को व्यक्त करता है; ‘शुद्ध करना’ טהר के अनुष्ठानिक शुद्धता-संबंधी अर्थ को सीधे बनाए रखता है।
theological_decisions:
- issue: חטא, כפר और טהר की याजकीय शब्दावली
  choice: ‘अपने आपको शुद्ध किया’, ‘प्रायश्चित किया’ और ‘शुद्ध करने के लिए’
  alternative: ‘अपने पाप से शुद्ध किया’, ‘दोष-निवारण किया’ और ‘पवित्र करने के लिए’
  rationale: मूल पाठ में संबंधित किंतु अलग अनुष्ठानिक क्रियाएँ हैं। पहले क्रियापद में ‘पाप से’ स्पष्ट रूप से नहीं कहा गया, इसलिए उसे जोड़े बिना आत्म-शुद्धीकरण व्यक्त किया गया; כפר और טהר के विशिष्ट अर्थ भी सुरक्षित रखे गए।
- issue: लेवियों को תְּנוּפָה के रूप में प्रस्तुत करना
  choice: हिलाई जाने वाली भेंट के रूप में प्रस्तुत किया
  alternative: उन्हें हिलाई जाने वाली भेंट के रूप में हिलाया
  rationale: यह भाषा असामान्य धार्मिक अनुष्ठान को बनाए रखती है, पर अनावश्यक रूप से यह निष्कर्ष नहीं निकालती कि लेवियों के शरीरों को सचमुच किस ढंग से हिलाया गया था।
- issue: ईश्वरीय नाम יהוה
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में विशिष्ट ईश्वरीय नाम है। आधुनिक हिन्दी बाइबल-परंपरा में परिचित रूप ‘यहोवा’ नाम को सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। याजकीय शब्दावली के लिए ‘वस्त्र’, ‘भेंट’, ‘प्रायश्चित’ और ‘शुद्ध’ जैसे परिचित धार्मिक शब्द रखे गए हैं; वाक्य-विन्यास को हिन्दी में स्वाभाविक बनाने के लिए दूसरे खंड की शुरुआत ‘तब’ से की गई है।
