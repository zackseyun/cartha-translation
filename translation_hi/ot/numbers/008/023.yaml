  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। “यहोवा” आधुनिक हिंदी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और नाम को “प्रभु” जैसी उपाधि से प्रतिस्थापित नहीं करता।
