- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को हिंदी की स्वाभाविक संरचना “मूसा से कहा” द्वारा व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह प्रत्यक्ष वचन का परिचय देने वाला प्रचलित इब्रानी सूत्र है। “बोलते हुए कहा” हिंदी में अनावश्यक पुनरुक्ति होती; इसलिए अर्थ को मुख्य क्रिया “कहा” में समाहित किया गया है।
theological_decisions:
