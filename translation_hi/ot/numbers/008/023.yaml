  choice: तब ... कहा
  rationale: वाव-क्रमिक क्रिया अगले कथात्मक प्रसंग को आरम्भ करती है। हिंदी में “तब” क्रमिक प्रगति को स्वाभाविक ढंग से व्यक्त करता है; “कहा” वाणी की सामान्य और स्पष्ट अभिव्यक्ति है।
