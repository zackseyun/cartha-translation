  text: וְ/אַֽחֲרֵי כֵן֙ יָבֹ֣אוּ הַ/לְוִיִּ֔ם לַ/עֲבֹ֖ד אֶת אֹ֣הֶל מוֹעֵ֑ד וְ/טִֽהַרְתָּ֣ אֹתָ֔/ם וְ/הֵנַפְתָּ֥ אֹתָ֖/ם תְּנוּפָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/015.yaml
  text: And after that the Levites shall come to serve at the tent of meeting[b][a], and you shall cleanse them and wave them as a wave offering.
translation:
  language: hi
  text: इसके बाद लेवी मिलाप के तम्बू में सेवा करने आएँगे; और तुम उन्हें शुद्ध करोगे[a] और उन्हें लहराने की भेंट के रूप में प्रस्तुत करोगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उन्हें पवित्र करोगे।” हिब्रू क्रिया यहाँ विधिपूर्वक शुद्ध करने के लिए प्रयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्हें लहराओगे।” अर्थात उन्हें यहोवा के सामने लहराने की भेंट के रूप में विधिपूर्वक प्रस्तुत करोगे।
    reason: cultural_note
lexical_decisions:
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पिछले शुद्धीकरण और समर्पण-विधानों के बाद की अगली अवस्था बताता है; यह सहज और स्पष्ट कालक्रमसूचक अभिव्यक्ति है।
- source_word: יָבֹאוּ הַלְוִיִּם
  choice: लेवी ... आएँगे
  rationale: בוא का सामान्य अर्थ ‘आना’ है; यहाँ यह सेवा आरम्भ करने के लिए उनके आगे आने को दर्शाता है।
- source_word: לַעֲבֹד אֶת אֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू में सेवा करने
  rationale: עבד उपासना-संबंधी संदर्भ में निर्धारित सेवा या कार्य को व्यक्त करता है। हिन्दी में स्थान और कार्य का स्वाभाविक संबंध ‘तम्बू में सेवा’ से स्पष्ट होता है।
- source_word: וְטִהַרְתָּ אֹתָם
  choice: तुम उन्हें शुद्ध करना
  rationale: טהר यहाँ विधिपूर्वक शुद्ध करने का द्योतक है। ‘शुद्ध करना’ आधुनिक हिन्दी में स्पष्ट है और अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: וְהֵנַפְתָּ אֹתָם תְּנוּפָה
  choice: उन्हें हिलाई हुई भेंट के रूप में हिलाना
  rationale: निफ़/תנופה की शब्दावली अनुष्ठानिक रूप से यहोवा के सामने हिलाकर अर्पित करने या प्रस्तुत करने को दर्शाती है। असामान्य किंतु मूल-पाठ में स्पष्ट बात—कि स्वयं लेवियों को हिलाया जाता है—को बनाए रखा गया है।
theological_decisions:
- issue: लेवियों के समर्पण की अनुष्ठानिक भाषा
  choice: ‘शुद्ध करना’ और ‘हिलाई हुई भेंट के रूप में हिलाना’ जैसी स्पष्ट उपासना-विधि संबंधी भाषा बनाए रखना
  alternative: ‘उन्हें पवित्र करके अर्पित करना’ या केवल ‘उन्हें समर्पित करना’
  rationale: पद विशिष्ट विधियों का वर्णन करता है, केवल सामान्य नियुक्ति का नहीं। मूल अनुष्ठानिक बिंब को बनाए रखने से बाद की धर्मवैज्ञानिक व्याख्या आरोपित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और निर्देशात्मक रूप। ‘मिलापवाला तम्बू’ परिचित बाइबलीय पद है; ‘हिलाई हुई भेंट’ मूल अनुष्ठानिक बिंब को सामान्य ‘अर्पण’ में समतल होने से बचाती है।
