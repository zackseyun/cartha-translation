source:
  edition: WLC
  text: וְ/הַ/לְוִיִּם֙ יִסְמְכ֣וּ אֶת יְדֵי/הֶ֔ם עַ֖ל רֹ֣אשׁ הַ/פָּרִ֑ים וַ֠/עֲשֵׂה אֶת הָ/אֶחָ֨ד חַטָּ֜את וְ/אֶת הָ/אֶחָ֤ד עֹלָה֙ לַֽ/יהוָ֔ה לְ/כַפֵּ֖ר עַל הַ/לְוִיִּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/012.yaml
  text: Then the Levites shall lay their hands on the heads of the bulls[a], and you shall offer one as a sin offering and the other as a burnt offering to Yahweh, to make atonement for the Levites.
translation:
  language: hi
  text: तब लेवी उन बैलों के सिरों पर अपने हाथ रखेंगे, और तुम एक को पापबलि[a] और दूसरे को यहवे के लिए होमबलि के रूप में चढ़ाओ, ताकि लेवियों के लिए प्रायश्चित कर सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת याजकीय प्रसंगों में पाप से संबंधित बलि अथवा शुद्धिकरण के लिए दी जाने वाली बलि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִסְמְכוּ אֶת יְדֵיהֶם
  choice: अपने हाथ रखें
  rationale: बलिदान-संबंधी प्रसंग में סמך पशु पर हाथ रखने की विधिवत क्रिया को दर्शाता है; हिन्दी में ‘हाथ रखें’ स्वाभाविक और सटीक है।
- source_word: עַל רֹאשׁ הַפָּרִים
  choice: उन बैलों के सिरों पर
  rationale: ‘सिर’ इब्रानी में एकवचन है, पर दो बैलों के साथ इसका वितरणात्मक अर्थ है; हिन्दी में बहुवचन ‘सिरों’ से यह स्पष्ट होता है।
- source_word: וַעֲשֵׂה
  choice: चढ़ाना
  rationale: यह आज्ञा एकवचन संबोधन में है और बलिदान के प्रसंग में עשה का अर्थ बलि अर्पित करना है; ‘चढ़ाना’ हिन्दी में प्रचलित धार्मिक अभिव्यक्ति है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: याजकीय विधान में यह पाप से संबंधित बलि का मानक नाम है; ‘शुद्धिकरण-बलि’ भी संभव अर्थ है और उसे पादटिप्पणी में रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह पूरी तरह जलाकर चढ़ाई जाने वाली बलि का हिन्दी में स्थापित बाइबलीय पद है।
- source_word: לַיהוָה
  choice: यहवे के लिए
  rationale: मूल में परमेश्वर का निज नाम יהוה है; उसे उपाधि से बदलने के बजाय ‘यहवे’ रूप में रखा गया है।
- source_word: לְכַפֵּר עַל הַלְוִיִּם
  choice: ताकि लेवियों के लिए प्रायश्चित किया जाए
  rationale: यह כפר की याजकीय-विधिक शक्ति को बनाए रखता है और प्रायश्चित कैसे प्रभावी होता है, इस पर कोई संकीर्ण सिद्धान्त आरोपित नहीं करता।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा-संबंधी निज नाम प्रत्यक्ष है। ‘यहवे’ मूल नाम का व्यापक रूप से स्वीकृत आधुनिक लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: दोनों अर्थ याजकीय प्रयोग में संभव हैं। मुख्य पाठ में परिचित पद ‘पापबलि’ रखा गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: לְכַפֵּר की व्याख्या
  choice: प्रायश्चित किया जाए
  alternative: दोष मिटाया जाए; शुद्धि की जाए
  rationale: ‘प्रायश्चित’ मूल की धार्मिक-विधिक व्यापकता को बनाए रखता है और उसकी क्रियाविधि को अनावश्यक रूप से सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘लेवी’, ‘पापबलि’, ‘होमबलि’ और ‘प्रायश्चित’ जैसे स्थापित बाइबलीय पद बनाए गए हैं। आज्ञा के एकवचन संबोधन को ‘तुम ... चढ़ाना’ से व्यक्त किया गया है।
