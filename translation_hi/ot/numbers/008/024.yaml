base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/024.yaml
  text: 'This is what pertains to the Levites: from twenty-five years old and upward[a], he shall come to do duty in the service of the tent of meeting.'
translation:
  language: hi
  text: 'लेवियों के लिए यह नियम है: पच्चीस वर्ष या उससे अधिक आयु का हर लेवी मिलाप के तंबू की सेवा में कर्तव्य निभाने[a] आएगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ ऐसा मुहावरा है जिसका अर्थ नियुक्त सेवा या कर्तव्य निभाना है और जिसमें सैन्य ड्यूटी की भी हल्की छाया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת אֲשֶׁר לַלְוִיִּם
  choice: लेवियों के लिए यह नियम है
  rationale: यह पदबंध लेवियों पर लागू होने वाला निर्देश प्रस्तुत करता है; ‘नियम’ कानूनी-निर्देशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִבֶּן חָמֵשׁ וְעֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: पच्चीस वर्ष या उससे अधिक आयु का
  rationale: इब्रानी मुहावरा न्यूनतम आयु-सीमा बताता है; यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: יָבוֹא
  choice: आएगा
  rationale: सामूहिक विषय के बाद प्रयुक्त इब्रानी एकवचन क्रिया को विधिक सामान्य एकवचन के रूप में रखा गया है।
- source_word: לִצְבֹא צָבָא
  choice: अपना निर्धारित काम करने
  rationale: यह सेवा अथवा नियुक्त कर्तव्य निभाने का मुहावरा है, जिसमें सैन्य ड्यूटी की हल्की छाया है; ‘निर्धारित काम’ पवित्रस्थान के प्रसंग में उसके कर्तव्य-बोध को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּעֲבֹדַת אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू की सेवा में
  rationale: עֲבֹדָה नियुक्त सेवा-कार्य को और אֹהֶל מוֹעֵד इस्राएली पवित्रस्थान के प्रचलित नाम को दर्शाता है।
theological_decisions:
- issue: सामूहिक संज्ञा के साथ एकवचन क्रिया
  choice: हर लेवी ... आएगा
  alternative: वे ... आएँगे
  rationale: मूल पाठ लेवियों के समूह के विषय में एकवचन क्रिया प्रयोग करता है। ‘हर लेवी’ जोड़ने से सामान्य एकवचन का भाव हिन्दी में स्पष्ट रहता है, बिना निर्देश को केवल किसी एक व्यक्ति तक सीमित किए।
- issue: לִצְבֹא צָבָא में सेवा और सैन्य कर्तव्य का रूपक
  choice: अपना निर्धारित काम करने
  alternative: सेवा-दल में सम्मिलित होने / ड्यूटी करने
  rationale: मुख्य पाठ में पवित्रस्थान-संबंधी नियुक्त कर्तव्य स्पष्ट किया गया है, जबकि सैन्य-सदृश मुहावरे की छाया पाद-टिप्पणी में सुरक्षित है; इसे वास्तविक युद्ध-सेवा नहीं बनाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘मिलापवाला तंबू’ पंचग्रंथ में אֹהֶל מוֹעֵד के लिए पारंपरिक और बोधगम्य पद है।
