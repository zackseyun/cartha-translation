source:
  edition: WLC
  text: וְ/שֵׁרֵ֨ת אֶת אֶחָ֜י/ו בְּ/אֹ֤הֶל מוֹעֵד֙ לִ/שְׁמֹ֣ר מִשְׁמֶ֔רֶת וַ/עֲבֹדָ֖ה לֹ֣א יַעֲבֹ֑ד כָּ֛כָה תַּעֲשֶׂ֥ה לַ/לְוִיִּ֖ם בְּ/מִשְׁמְרֹתָֽ/ם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/026.yaml
  text: But he may minister with his brothers in the tent of meeting[a], to keep the charge, but he shall do no service[b]. Thus you shall do for the Levites in their duties.
translation:
  language: hi
  text: पर वह मिलाप के तंबू में अपने भाइयों के साथ सेवा कर सकता है, ताकि सौंपी गई ज़िम्मेदारी निभाए; पर वह नियमित सेवा-कार्य न करे। लेवियों के लिए उनकी ज़िम्मेदारियों के संबंध में तुम ऐसा ही करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשֵׁרֵת
  choice: पर वह ... सेवा कर सकता है
  rationale: שרת पवित्रस्थान से जुड़ी सेवकाई को दर्शाता है। पिछले पद में सक्रिय सेवा से हटने के बाद भी यहाँ सीमित सहभागिता की अनुमति है; इसलिए संयोजक को प्रसंगानुसार विरोधसूचक और क्रिया को अनुमतिसूचक रूप में रखा गया है।
- source_word: אֶת־אֶחָיו
  choice: अपने भाइयों के साथ
  rationale: यह लेवी के सहकर्मी लेवियों को संदर्भित करता है। 'भाइयों' मूल के पुरुषवाचक संबंधसूचक शब्द को बनाए रखता है, जबकि 'के साथ' שרת के बाद संबंध का स्वाभाविक हिन्दी रूप है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: אֹהֶל מוֹעֵד का प्रचलित, अर्थ-संगत हिन्दी रूप; स्थानवाचक בְּ को 'में' से व्यक्त किया गया है।
- source_word: לִשְׁמֹר מִשְׁמֶרֶת
  choice: ताकि सौंपी गई ज़िम्मेदारी निभाए
  rationale: क्रिया और समधातु संज्ञा का प्रयोग किसी सौंपे हुए दायित्व को बनाए रखने या पूरा करने का भाव देता है। आधुनिक हिन्दी में यह 'पहरा देने' तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וַעֲבֹדָה לֹא יַעֲבֹד
  choice: पर वह नियमित काम न करे
  rationale: עֲבֹדָה और עבד का समधातु प्रयोग उस कार्य-सेवा को निषिद्ध करता है जिससे वृद्ध लेवी मुक्त हुआ है। 'नियमित काम' इसे पहले अनुमत सहायक सेवा से अलग करता है, बिना इसे केवल भारी शारीरिक श्रम मान लेने के।
- source_word: כָּכָה תַּעֲשֶׂה לַלְוִיִּם בְּמִשְׁמְרֹתָם
  choice: लेवियों की ज़िम्मेदारियों के विषय में तुम उनसे इसी प्रकार करना
  rationale: निष्कर्षात्मक निर्देश को स्वाभाविक हिन्दी में रखा गया है। בְּמִשְׁמְרֹתָם उनकी नियुक्त ज़िम्मेदारियों या सेवा-दायित्वों को दर्शाता है।
theological_decisions:
- issue: आयु-सीमा के बाद लेवी की अनुमत सहभागिता और निषिद्ध कार्य के बीच भेद
  choice: वह भाइयों के साथ सहायक सेवा और सौंपा दायित्व निभा सकता है, पर नियमित कार्य-सेवा नहीं करेगा।
  alternative: आयु-सीमा के बाद हर प्रकार की सेवा पूर्णतः निषिद्ध है; अथवा केवल संकीर्ण अर्थ में पहरेदारी अनुमत है।
  rationale: שרת और עֲבֹדָה...עבד के बीच शब्दगत विरोध पूर्ण निष्क्रियता के बजाय सेवाकार्य के दो पहलुओं में भेद दिखाता है। अनुवाद इस भेद को बनाए रखता है, पर निषिद्ध काम को केवल शारीरिक श्रम तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। 'मिलापवाला तंबू' परिचित बाइबलीय पदावली है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि मुख्य पाठ में 'सौंपी गई ज़िम्मेदारी' और 'नियमित काम' से मूल का प्रमुख भेद स्पष्ट हो जाता है।
