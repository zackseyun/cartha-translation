source:
  edition: WLC
  text: וְ/כֹֽה תַעֲשֶׂ֤ה לָ/הֶם֙ לְ/טַֽהֲרָ֔/ם הַזֵּ֥ה עֲלֵי/הֶ֖ם מֵ֣י חַטָּ֑את וְ/הֶעֱבִ֤ירוּ תַ֨עַר֙ עַל כָּל בְּשָׂרָ֔/ם וְ/כִבְּס֥וּ בִגְדֵי/הֶ֖ם וְ/הִטֶּהָֽרוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/007.yaml
  text: 'And thus you shall do to them to cleanse them: sprinkle on them the water for purification from sin[a], and let them pass a razor over all their flesh, and wash their clothes[b], and so cleanse themselves.'
translation:
  language: hi
  text: 'उन्हें शुद्ध करने के लिए तुम उनके लिए यह करना: उन पर पाप-शुद्धि का जल[a] छिड़कना; वे अपने सारे शरीर पर उस्तरा फेरें, अपने वस्त्र धोएँ और इस प्रकार अपने को शुद्ध करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धि का जल”; शाब्दिक अर्थ “पाप का जल” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹה תַעֲשֶׂה לָהֶם
  choice: तुम उनके साथ यह करना
  rationale: यह पद पिछले प्रसंग से जुड़ी विधि का निर्देश देता है। हिंदी में यह प्रयोग स्वाभाविक रहते हुए इब्रानी के निर्देशात्मक भाव को बनाए रखता है।
- source_word: לְטַהֲרָם
  choice: उन्हें शुद्ध करने के लिए
  rationale: טהר यहाँ लेवियों की अनुष्ठानिक शुद्धि का द्योतक है; ‘शुद्ध करना’ आधुनिक हिंदी में स्पष्ट है और केवल नैतिक अर्थ तक सीमित नहीं करता।
- source_word: הַזֵּה עֲלֵיהֶם
  choice: उन पर ... छिड़कना
  rationale: हिफ़ील रूप अनुष्ठान में जल छिड़कने की क्रिया बताता है।
- source_word: מֵי חַטָּאת
  choice: पाप-शुद्धि का जल
  rationale: शाब्दिक रचना ‘पाप का जल’ है, पर यहाँ חטאת उस जल के शुद्धिकरण-संबंधी कार्य को सूचित करता है। यह चुनाव ‘पापबलि का जल’ जैसा अनिश्चित बलिदानी अर्थ आरोपित किए बिना संक्षिप्त रहता है।
- source_word: וְהֶעֱבִירוּ תַעַר עַל כָּל בְּשָׂרָם
  choice: वे अपने सारे शरीर पर उस्तरा फेरें
  rationale: ‘उस्तरा फेरना’ इब्रानी मुहावरे की ठोस छवि बनाए रखता है; ‘सारा शरीर’ בשר के प्रसंगगत आशय को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְכִבְּסוּ בִגְדֵיהֶם
  choice: अपने वस्त्र धोएँ
  rationale: כבס विशेषतः कपड़े धोने के लिए प्रयुक्त है; ‘वस्त्र धोएँ’ गरिमापूर्ण और सहज हिंदी है।
- source_word: וְהִטֶּהָרוּ
  choice: इस प्रकार अपने को शुद्ध करें
  rationale: हित्पएल का आत्मवाचक भाव ‘अपने को’ से व्यक्त होता है और ‘इस प्रकार’ पूरी प्रक्रिया के परिणामात्मक संबंध को स्पष्ट करता है।
theological_decisions:
- issue: लेवियों के अभिषेक-संबंधी अनुष्ठान में शुद्धि की प्रकृति
  choice: טהר को अनुष्ठानिक अर्थ बनाए रखते हुए ‘शुद्ध’ से व्यक्त किया गया और חטאת को ‘पाप-शुद्धि’ कहा गया।
  alternative: חטאת को ‘पापबलि’ मानकर ‘पापबलि का जल’ कहना, या पूरी भाषा को केवल नैतिक पाप की धुलाई के रूप में प्रस्तुत करना।
  rationale: यह पद एक ठोस अनुष्ठान बताता है। इब्रानी में बलिदानवाचक संज्ञा स्पष्ट रूप से नहीं है, इसलिए अनुवाद न तो बलिदानी अर्थ को निर्णायक बनाता है, न अनुष्ठानिक शुद्धि को केवल आंतरिक नैतिक शुद्धि में बदलता है।
translation_notes:
  register: आधुनिक मानक हिंदी; निर्देशात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मुख्य पाठ में इब्रानी मुहावरे ‘उस्तरा फेरें’ को बनाए रखा गया है।
