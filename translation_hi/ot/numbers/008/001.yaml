  text: 'फिर याहवे[a] ने मूसा से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “YHWH”; परंपरागत रूप से “प्रभु” अनुवाद किया जाता है।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक अनुवाद की जानकारी।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर … ने … कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है, इसलिए आधुनिक हिन्दी में “फिर” स्वाभाविक है। דּבר के बोलने के अर्थ को अगले לֵאמֹר के साथ मिलाकर हिन्दी की प्रचलित वाणी-परिचय शैली “ने … से कहा” में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप “याहवे” से प्रस्तुत किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने की क्रिया के साथ אֶל सम्बोधित व्यक्ति को सूचित करता है; हिन्दी में इसका स्वाभाविक रूप “मूसा से” है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप आगे आने वाले कथन का परिचय देता है। हिन्दी में “कहा:” इस कार्य को स्वाभाविक ढंग से पूरा करता है, और द्विबिंदु संकेत करता है कि कथन अगले पद में आता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम YHWH है। “याहवे” उस नाम को नाम के रूप में बनाए रखता है; पादटिप्पणी पारंपरिक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। इब्रानी की दोहरी वाणी-संरचना (“बोला … यह कहते हुए”) को अस्वाभाविक रूप से दोहराने के बजाय हिन्दी के सामान्य सूत्र “ने … से कहा:” में व्यक्त किया गया है।
