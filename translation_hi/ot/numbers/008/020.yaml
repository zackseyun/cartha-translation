id: NUM.8.20
reference: Numbers 8:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַשׂ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וְ/כָל עֲדַ֥ת בְּנֵי יִשְׂרָאֵ֖ל לַ/לְוִיִּ֑ם כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֤ה אֶת מֹשֶׁה֙ לַ/לְוִיִּ֔ם כֵּן עָשׂ֥וּ לָ/הֶ֖ם בְּנֵ֥י יִשְׂרָאֵֽל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/020.yaml
  text: So Moses and Aaron and all the congregation of the sons of Israel did to the Levites according to all that Yahweh had commanded Moses concerning the Levites[a]; so the sons of Israel did to them.
translation:
  language: hi
  text: तब मूसा, हारून और इस्राएलियों की सारी मण्डली ने लेवियों के साथ ठीक वैसा ही किया, जैसा यहोवा ने मूसा को लेवियों के विषय में आज्ञा दी थी; इस्राएलियों ने उनके साथ वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ / עָשׂוּ
  choice: किया
  rationale: עָשָׂה एक व्यापक क्रिया है। यहाँ यह पहले दिए गए निर्देशों के अनुसार लेवियों के साथ किए गए कार्यों को बताती है; इसलिए किसी विशेष अनुष्ठान का अर्थ जोड़े बिना सामान्य ‘किया’ उपयुक्त है।
- source_word: עֲדַת
  choice: मण्डली
  rationale: עֵדָה वाचा-समुदाय को सामूहिक रूप से दर्शाता है। ‘मण्डली’ पंचग्रन्थीय प्रसंग में इसका औपचारिक सामुदायिक भाव बनाए रखती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: हिब्रू का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर इस मानक सामुदायिक पदबंध का स्वाभाविक आधुनिक हिन्दी रूप ‘इस्राएली’ है; यहाँ पूरे वाचा-समुदाय का आशय है, केवल पुरुषों का नहीं।
- source_word: לַלְוִיִּם / לָהֶם
  choice: लेवियों के साथ / उनके साथ
  rationale: ל यहाँ उन व्यक्तियों को सूचित करता है जिनके प्रति निर्धारित कार्य किए गए। हिन्दी में ‘के साथ’ इस सम्बन्ध को स्वाभाविक रूप से व्यक्त करता है और केवल लाभार्थी होने तक अर्थ को सीमित नहीं करता।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वैसा ही, जैसा
  rationale: यह पदबंध आज्ञा के पूर्ण और सटीक पालन पर बल देता है; ‘ठीक वैसा ही, जैसा’ כֹל की व्यापकता और तुलना दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: आज्ञा वर्णित कार्य से पहले दी गई थी; ‘दी थी’ हिन्दी में उस पूर्वकालिक क्रम को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परम्परा में ‘यहोवा’ चतुरक्षरीय ईश्वरीय नाम का परिचित लिप्यन्तरण है और इसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: אֶת מֹשֶׁה לַלְוִיִּם
  choice: मूसा को लेवियों के विषय में
  rationale: रचना बताती है कि मूसा को दी गई आज्ञा लेवियों से सम्बन्धित थी। ‘के विषय में’ यह सम्बन्ध स्पष्ट रखता है।
- source_word: כֵּן
  choice: वैसा ही
  rationale: כֵּן पहले कही गई आज्ञा और उसके कार्यान्वयन के बीच पूर्ण अनुरूपता को दोहराता और उभारता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी में ‘यहोवा’ उसका व्यापक रूप से पहचाना जाने वाला लिप्यन्तरण है; इससे नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: सामुदायिक पदबंध בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह हिब्रू में पूरे इस्राएली वाचा-समुदाय के लिए मानक पदबंध है। ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के सामूहिक आशय को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। हिब्रू की पुनरुक्ति को बनाए रखा गया है, क्योंकि वह इस बात पर बल देती है कि इस्राएलियों ने आज्ञा का ठीक वैसा ही पालन किया।
