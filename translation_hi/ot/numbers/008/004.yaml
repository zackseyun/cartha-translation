base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/004.yaml
  text: 'This was the workmanship of the lampstand: hammered work of gold[a], from its base to its flower it was hammered work. According to the pattern that Yahweh had shown Moses[b], so he made the lampstand.'
translation:
  language: hi
  text: 'दीपाधार की बनावट यह थी: वह हथौड़े से पीटकर गढ़ा हुआ सोने का काम था[a]; उसके आधार से लेकर उसके फूल तक, वह हथौड़े से पीटकर गढ़ा हुआ था। यहोवा ने मूसा को जो प्रतिरूप दिखाया था[b], उसी के अनुसार उसने दीपाधार बनाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पीटकर बनाया गया”; इब्रानी शब्द धातु को हथौड़े से गढ़ने पर बल देता है। कुछ लोग इसमें “एक ही टुकड़े से बना” होने का भाव भी समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: “प्रतिरूप” का अनुवाद “रूप” या “दर्शन” भी किया जा सकता है—अर्थात वह जो यहोवा ने मूसा को दिखाया था।
    reason: lexical_alternative
lexical_decisions:
