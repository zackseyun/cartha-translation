  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। धातुकर्म की पुनरावृत्ति मूल के बलाघात के अनुसार सुरक्षित है। ‘फूल’ का एकवचन मूल रूप से मेल खाता है और फूलाकार सज्जा को दर्शाता है।
