- source_word: הֶרְאָה
  choice: दिखाया था
  rationale: हिफ़ील रूप का अर्थ ‘दिखाना’ है; पूर्वकालिकता व्यक्त करने के लिए ‘दिखाया था’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप के द्वारा विशिष्ट ईश्वरीय नाम को सामान्य पदवी में बदले बिना सुरक्षित रखा गया है।
- source_word: כֵּן עָשָׂה
  choice: उसी के अनुसार उसने … बनाया
  rationale: यह ‘जैसा…वैसा’ सम्बन्ध सुरक्षित रखता है। इब्रानी में कर्ता निहित है; हिन्दी वाक्य के लिए पुल्लिंग एकवचन ‘उसने’ रखा गया है, पर उसकी पहचान नहीं जोड़ी गई।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिवाचक ईश्वरीय नाम को ‘प्रभु’ जैसी पदवी से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में अधिक परिचित ‘यहोवा’ चुना गया है; उच्चारण का ‘याहवे’ रूप भी सम्भव है।
- issue: עָשָׂה का निहित कर्ता
  choice: उसने बनाया
  alternative: दीपाधार बनाया गया
  rationale: इब्रानी क्रिया सक्रिय और पुल्लिंग एकवचन है, पर कर्ता का नाम नहीं दिया गया। ‘उसने’ सक्रियता को बनाए रखता है और किसी विशिष्ट कारीगर की पहचान आरोपित नहीं करता।
- issue: כַּמַּרְאֶה का आशय
  choice: प्रतिरूप
  alternative: रूप अथवा दर्शन
  rationale: निर्माण-सन्दर्भ में दिखाया गया नमूना या आकृति मुख्य आशय है, फिर भी मूल शब्द की दृश्य/दर्शनसम्बन्धी व्यापकता को पादटिप्पणी में रखा गया है।
