  choice: बनावट
  rationale: यहाँ शब्द दीपाधार के कारीगरीपूर्ण निर्माण और उसकी रचना-विधि को बताता है; आधुनिक हिन्दी में ‘बनावट’ स्वाभाविक और स्पष्ट है।
- source_word: הַמְּנֹרָה
  choice: दीपाधार
  rationale: उपासना-स्थल में दीप रखने वाले इस पात्र के लिए अर्थानुवाद किया गया है; ‘दीपाधार’ संक्षिप्त, गरिमापूर्ण और बोधगम्य है।
- source_word: מִקְשָׁה
  choice: हथौड़े से गढ़ा हुआ
  rationale: शब्द धातु को पीटकर या हथौड़े से आकार देने की कारीगरी पर बल देता है। दोनों occurrences में इसी भाव को दोहराया गया है; ‘एक ही टुकड़े का’ सम्भव निहितार्थ है, पर मूल अर्थ से अधिक व्याख्यात्मक है।
- source_word: זָהָב
  choice: सोना
  rationale: पदार्थ का सीधा और स्वाभाविक हिन्दी नाम।
- source_word: עַד יְרֵכָהּ עַד פִּרְחָהּ
  choice: उसके आधार से लेकर उसके फूल तक
  rationale: युग्मित अभिव्यक्ति दीपाधार के पूरे विस्तार को दिखाती है। יָרֵךְ का सन्दर्भगत अर्थ निचला आधार है और פֶּרַח फूलाकार सज्जा को बताता है।
- source_word: כַּמַּרְאֶה
