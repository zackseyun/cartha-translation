  text: קַ֚ח אֶת הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/טִהַרְתָּ֖ אֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/006.yaml
  text: Take the Levites from among the sons of Israel and cleanse them[a].
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] में से लेवियों को ले और उन्हें शुद्ध कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल के लोग।” शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: शाब्दिक पारिवारिक पदबंध और उसके सामुदायिक अर्थ—दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: קַח
  choice: ले
  rationale: לקח का पुल्लिंग एकवचन आज्ञार्थक रूप मूसा को सीधी आज्ञा देता है। हिंदी में ‘ले’ इस प्रसंग में सरल और स्वाभाविक है तथा अलग किए जाने का भाव अगले पदबंध से स्पष्ट होता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी के वंशजों के उस समुदाय का मानक नाम है जिसे पवित्र-स्थान की सेवा के लिए नियुक्त किया गया था।
- source_word: מִתּוֹךְ
  choice: के बीच से
  rationale: यह बड़े समुदाय के भीतर से किसी समूह को अलग करने का भाव व्यक्त करता है। ‘के बीच से’ हिब्रू संरचना और चयन—दोनों भावों को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह हिब्रू पदबंध का निकट रूप है और इस्राएल की पारिवारिक तथा वाचागत पहचान को बनाए रखता है; अधिक सामान्य हिंदी विकल्प पाद-टिप्पणी में दिए गए हैं।
- source_word: וְטִהַרְתָּ אֹתָם
  choice: और उन्हें शुद्ध कर
  rationale: טהר यहाँ विधिवत शुद्ध किए जाने को व्यक्त करता है। ‘शुद्ध कर’ आधुनिक हिंदी में स्पष्ट है और अनुष्ठानिक संदर्भ के लिए उपयुक्त है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल पाठ का व्याकरणिक रूप पुल्लिंग बहुवचन है और यह वाचा के समुदाय के लिए पारिवारिक पदनाम के रूप में प्रयुक्त हुआ है। मुख्य पाठ में इस रूप को रखा गया है, जबकि स्वाभाविक सामुदायिक अर्थ पाद-टिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूसा को संबोधित एकवचन आज्ञार्थक ‘ले’ और ‘कर’ मूल की सीधी आज्ञा को दर्शाते हैं।
