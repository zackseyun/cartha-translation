source:
  edition: WLC
  text: וָ/אֶתְּנָ֨/ה אֶת הַ/לְוִיִּ֜ם נְתֻנִ֣ים לְ/אַהֲרֹ֣ן וּ/לְ/בָנָ֗י/ו מִ/תּוֹךְ֮ בְּנֵ֣י יִשְׂרָאֵל֒ לַ/עֲבֹ֞ד אֶת עֲבֹדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ בְּ/אֹ֣הֶל מוֹעֵ֔ד וּ/לְ/כַפֵּ֖ר עַל בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/לֹ֨א יִהְיֶ֜ה בִּ/בְנֵ֤י יִשְׂרָאֵל֙ נֶ֔גֶף בְּ/גֶ֥שֶׁת בְּנֵֽי יִשְׂרָאֵ֖ל אֶל הַ/קֹּֽדֶשׁ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/019.yaml
  text: And I have given the Levites as a gift to Aaron and to his sons from among the sons of Israel[a], to do the service of the sons of Israel in the tent of meeting, and to make atonement for the sons of Israel[c][b], so that there may not be a plague among the sons of Israel when the sons of Israel come near to the holy place.
translation:
  language: hi
  text: और मैंने इस्राएल के पुत्रों में से लेवियों को हारून और उसके पुत्रों को उपहार के रूप में दिया है[a], ताकि वे मिलापवाले तंबू में इस्राएल के पुत्रों की ओर से सेवा का काम करें और इस्राएल के पुत्रों के लिए प्रायश्चित करें; जिससे जब इस्राएल के पुत्र पवित्रस्थान[b] के निकट आएँ, तब इस्राएल के पुत्रों में कोई महामारी न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लेवियों को—जो हारून और उसके पुत्रों को दिए गए हैं—दिया है।” इब्रानी में “देना” धातु की पुनरावृत्ति लेवियों के दिए जाने पर बल देती है।
    reason: मूल की נתן-धातु की जोरदार पुनरावृत्ति और वाक्य-विन्यास का वैकल्पिक रूप स्पष्ट करना।
  - marker: b
    text: या, “पवित्र स्थान”; संदर्भ में यह पवित्र क्षेत्र अथवा पवित्रस्थान को सूचित करता है।
    reason: הַקֹּדֶשׁ के स्थान-संबंधी अर्थ की वैध वैकल्पिक अभिव्यक्ति देना।
lexical_decisions:
- source_word: וָאֶתְּנָה ... נְתֻנִים
  choice: मैंने ... दिए हुए लोगों के रूप में दे दिया है
  rationale: נתן धातु की पुनरावृत्ति को यथासंभव स्वाभाविक हिन्दी में बनाए रखता है और इस बात पर बल देता है कि लेवी स्वयं हारून और उसके पुत्रों को दिए गए हैं।
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: समूचे इस्राएल के भीतर से चयन का भाव और मूल का वाचा-संबंधी पुरुषवाचक पदबंध दोनों सुरक्षित हैं।
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: सेवा का काम करें
  rationale: एक ही धातु से बने क्रिया और संज्ञा के जोर को पठनीय आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: इस उपासना-स्थल के पारंपरिक और सामान्य हिन्दी नाम को रखता है; בְ का स्थानवाचक अर्थ भी व्यक्त है।
- source_word: וּלְכַפֵּר עַל
  choice: के लिए प्रायश्चित करें
  rationale: याजकीय संदर्भ में כפר के प्रायश्चित/शुद्धिकरण संबंधी अर्थ को बिना उसकी विधि को अनावश्यक रूप से निश्चित किए सुरक्षित रखता है।
- source_word: נֶגֶף
  choice: महामारी
  rationale: पवित्रस्थान के अनुचित निकट आने से होने वाले दैवी घातक प्रकोप का स्वाभाविक हिन्दी रूप है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: संदर्भ में किसी अमूर्त पवित्रता के बजाय तंबू के पवित्र क्षेत्र को सूचित करता है, जबकि उसकी ठीक सीमा को अधिक संकीर्ण नहीं करता।
theological_decisions:
- issue: लेवियों की सेवा और प्रायश्चित-संबंधी भूमिका
  choice: लेवी इस्राएल की ओर से तंबू की सेवा करते और इस्राएल के लिए प्रायश्चित करते हैं।
  alternative: लेवी केवल व्यावहारिक सहायता करते हैं और उनकी कोई प्रायश्चित-संबंधी भूमिका नहीं है।
  rationale: मूल पाठ सेवा और प्रायश्चित दोनों को स्पष्ट रूप से लेवियों के उद्देश्य के रूप में रखता है। अनुवाद बाद की धार्मिक श्रेणियों से इस तनाव को नहीं मिटाता।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल के औपचारिक वाचा-संबंधी पदबंध को बनाए रखता है और लिंग-विशिष्ट रूप को तटस्थ नहीं करता।
- issue: लेवियों का हारून और उसके पुत्रों को दिया जाना
  choice: दिए हुए लोगों के रूप में दे दिया है
  alternative: भेंट के रूप में दे दिया है
  rationale: यह शब्दशः धातु-पुनरावृत्ति और व्यक्तियों के सौंपे जाने का भाव सुरक्षित रखता है; 'भेंट' संभावित है, पर मूल में अलग से 'भेंट' की संज्ञा नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। “इस्राएल के पुत्र” मूल की औपचारिक अभिव्यक्ति को सुरक्षित रखता है। “दिए हुए लोगों के रूप में दे दिया” कुछ असामान्य है, पर जानबूझकर मूल की נתן-पुनरावृत्ति बचाता है; इसकी अधिक प्रवाहपूर्ण व्याख्या पादटिप्पणी में दी गई है।
