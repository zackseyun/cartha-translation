base_translation:
  language: en
  yaml_path: translation/ot/numbers/008/014.yaml
  text: So you shall separate the Levites from among the sons of Israel[c][b][a], and the Levites shall be mine.
translation:
  language: hi
  text: इस प्रकार तुम लेवियों को इस्राएल के पुत्रों में से अलग करोगे[a], और लेवी मेरे होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अलग ठहराओगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתָּ
  choice: इस प्रकार तुम ... अलग करना
  rationale: हिफ़ील रूप का अर्थ ‘अलग करना’ या ‘अलग ठहराना’ है। प्रसंग में यह निर्देशात्मक क्रम की अगली क्रिया है, इसलिए आरंभिक וְ को स्वाभाविक हिन्दी में ‘इस प्रकार’ से व्यक्त किया गया और आज्ञार्थक प्रवाह रखा गया है।
- source_word: אֶת הַלְוִיִּם
  choice: लेवियों को
  rationale: निश्चित बहुवचन प्रत्यक्ष कर्म है; ‘लेवी’ से हिन्दी का स्वाभाविक बहुवचन परसर्गीय रूप ‘लेवियों को’ बनता है।
- source_word: מִתּוֹךְ
  choice: के बीच से
  rationale: यह किसी बड़े समूह के भीतर से अलग किए जाने का भाव व्यक्त करता है; ‘के बीच से’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पारिवारिक अभिव्यक्ति ‘इस्राएल के पुत्र’ को सुरक्षित रखा गया है; ‘इस्राएलियों’ भी सम्भव है, पर वह मूल रूप को कुछ समतल कर देता है।
- source_word: וְהָיוּ לִי
  choice: मेरे होंगे
  rationale: היה के साथ לִי यहाँ स्वामित्व अथवा विशेष संबंध व्यक्त करता है। ‘मेरे होंगे’ संक्षिप्त, स्वाभाविक और धर्मवैज्ञानिक विस्तार से मुक्त है।
- source_word: הַלְוִיִּם
  choice: लेवीय
  rationale: मूल में संज्ञा दोहराई गई है, इसलिए सर्वनाम की जगह समुदाय का नाम दोहराया गया है; कर्ता के रूप में ‘लेवीय’ हिन्दी बाइबलीय प्रयोग में स्पष्ट है।
theological_decisions:
- issue: लेवियों की स्थिति को स्वामित्व के रूप में व्यक्त किया जाए या उपासना-संबंधी समर्पण के रूप में
  choice: लेवीय मेरे होंगे
  alternative: लेवीय मेरे लिए समर्पित होंगे
  rationale: לִי के साथ היה सीधे तौर पर परमेश्वर से उनके विशेष संबंध अथवा उसके होने को व्यक्त करता है। व्यापक प्रसंग समर्पण से जुड़ा है, पर इस पद में समर्पण का विशिष्ट शब्द नहीं है; इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘इस्राएल के पुत्र’ मूल की पारिवारिक अभिव्यक्ति को सुरक्षित रखता है। दूसरे खंड में मूल की संज्ञा-पुनरावृत्ति बनाए रखी गई है।
