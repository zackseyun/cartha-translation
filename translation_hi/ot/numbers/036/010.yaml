base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/010.yaml
  text: Just as Yahweh had commanded Moses[a], so the daughters of Zelophehad did.
translation:
  language: hi
  text: जैसा यहोवा ने मूसा को आज्ञा दी थी, वैसा ही सलोफहाद की बेटियों ने किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר ... כֵּן
  choice: जैसा ... वैसा ही
  rationale: यह सहसंबंधी रचना आज्ञा और उसके पालन के बीच ठीक उसी अनुरूपता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करती है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया आदेश देने को व्यक्त करती है; ‘दी थी’ पहले दी गई आज्ञा और उसके बाद हुए पालन का क्रम स्पष्ट करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת यहाँ मूसा को צוה का व्यक्ति-वाचक कर्म बनाता है; हिन्दी में ‘मूसा को आज्ञा दी’ स्वाभाविक रचना है।
- source_word: עָשׂוּ
  choice: किया
  rationale: כֵּן के साथ यह आज्ञा के अनुसार कार्य करने को संक्षेप और बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: בְּנוֹת צְלָפְחָד
  choice: सलोफाद की बेटियों
  rationale: इब्रानी संबंधवाचक पदबंध का स्पष्ट, सहज हिन्दी रूप है और स्त्रियों की पहचान बनाए रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम सीधे प्रयुक्त है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज है। ‘जैसा ... वैसा ही’ मूल की तुलनात्मक-सहसंबंधी संरचना और पूर्ण अनुरूपता को बनाए रखता है।
