source:
  edition: WLC
  text: וְ֠/הָיוּ לְ/אֶחָ֞ד מִ/בְּנֵ֨י שִׁבְטֵ֥י בְנֵֽי יִשְׂרָאֵל֮ לְ/נָשִׁים֒ וְ/נִגְרְעָ֤ה נַחֲלָתָ/ן֙ מִ/נַּחֲלַ֣ת אֲבֹתֵ֔י/נוּ וְ/נוֹסַ֕ף עַ֚ל נַחֲלַ֣ת הַ/מַּטֶּ֔ה אֲשֶׁ֥ר תִּהְיֶ֖ינָה לָ/הֶ֑ם וּ/מִ/גֹּרַ֥ל נַחֲלָתֵ֖/נוּ יִגָּרֵֽעַ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/003.yaml
  text: And if they become wives to one of the sons of the tribes of the sons of Israel[a], then their inheritance will be taken away from the inheritance of our fathers and added to the inheritance of the tribe to which they belong, and it will be taken away from the allotted portion of our inheritance.
translation:
  language: hi
  text: और यदि वे इस्राएल के गोत्रों में से किसी एक के पुत्रों की पत्नियाँ बनें, तो उनकी विरासत हमारे पूर्वजों की विरासत में से घट जाएगी और उस गोत्र की विरासत में जुड़ जाएगी, जिसके पुरुषों से वे विवाह करेंगी; इस प्रकार वह हमारी विरासत के आवंटित भाग[a] में से घट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘हमारी विरासत के लॉट/चिट्ठी में से।’ यहाँ ‘लॉट’ से आशय चिट्ठी डालकर निर्धारित किए गए भू-भाग के हिस्से से है।'
    reason: גּוֹרָל के शाब्दिक अर्थ और भूमि-वितरण के प्रसंगगत आशय को स्पष्ट करना।
lexical_decisions:
- source_word: וְהָיוּ ... לְנָשִׁים
  choice: और यदि वे ... पत्नियाँ बनें
  rationale: हिब्रू में शाब्दिक रूप से ‘और वे पत्नियाँ हों/बनें’ है; प्रसंग में चल रही संभावित स्थिति को स्वाभाविक हिन्दी में ‘यदि’ से व्यक्त किया गया है।
- source_word: מִבְּנֵי שִׁבְטֵי בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों में से किसी एक के पुत्रों
  rationale: यह पदबंध इस्राएल के किसी अन्य गोत्र के पुरुष सदस्यों को दर्शाता है। ‘पुत्रों’ रखकर मूल की वंशगत भाषा सुरक्षित की गई है।
- source_word: נַחֲלָתָן
  choice: उनकी विरासत
  rationale: नַחֲלָה इस भूमि-वितरण प्रसंग में पैतृक रूप से प्राप्त भू-भाग को सूचित करता है; ‘विरासत’ इसकी कानूनी और पारिवारिक दोनों धाराएँ बनाए रखता है।
- source_word: וְנִגְרְעָה
  choice: घट जाएगी
  rationale: גרע का निफ़अल रूप किसी हिस्से से कमी हो जाने को व्यक्त करता है; यहाँ भूमि के वास्तविक हस्तांतरण से मूल गोत्र की विरासत घटती है।
- source_word: מִנַּחֲלַת אֲבֹתֵינוּ
  choice: हमारे पुरखाओं की विरासत में से
  rationale: ‘पुरखाओं’ से אֲבֹתֵינוּ का वंशगत आशय आधुनिक, सहज और गरिमापूर्ण हिन्दी में आता है।
- source_word: וְנוֹסַף עַל נַחֲלַת הַמַּטֶּה
  choice: उस गोत्र की विरासत में जुड़ जाएगी
  rationale: 'मूल का निष्क्रिय परिणाम सुरक्षित है: भूमि दूसरे गोत्र के पैतृक हिस्से में सम्मिलित हो जाएगी।'
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: जिसके पुरुषों की वे पत्नियाँ होंगी
  rationale: शाब्दिक संरचना अस्पष्ट हो सकती है; प्रसंगानुसार स्त्रियों के उस गोत्र के पुरुषों से विवाह का संबंध स्पष्ट किया गया है, बिना विरासत के तर्क को बदले।
- source_word: וּמִגֹּרַל נַחֲלָתֵנוּ
  choice: हमारी विरासत के चिट्ठी से मिले भाग में से
  rationale: גּוֹרָל का मूल अर्थ ‘चिट्ठी’ है और यहाँ उससे आवंटित हिस्से का संकेत है। मुख्य पाठ में दोनों बातों को संक्षेप में रखा गया है।
