id: NUM.36.9
reference: Numbers 36:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֧ב נַחֲלָ֛ה מִ/מַּטֶּ֖ה לְ/מַטֶּ֣ה אַחֵ֑ר כִּי אִישׁ֙ בְּ/נַ֣חֲלָת֔/וֹ יִדְבְּק֕וּ מַטּ֖וֹת בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/009.yaml
  text: No inheritance shall pass from one tribe to another tribe[a], for each of the tribes of the sons of Israel shall hold fast to its own inheritance.
translation:
  language: hi
  text: कोई भी विरासत एक गोत्र से दूसरे गोत्र में न जाए, क्योंकि इस्राएल के पुत्रों के गोत्र अपनी-अपनी विरासत से जुड़े रहें।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: न जाए
  rationale: इस कानूनी संदर्भ में क्रिया का अर्थ विरासत का एक गोत्र से दूसरे गोत्र के अधिकार में चले जाना है; ‘न जाए’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यहाँ शब्द इस्राएल के गोत्रों को बाँटी गई पैतृक भूमि और उस पर उनके अधिकार को दर्शाता है; ‘विरासत’ मानक और सुबोध पद है।
- source_word: מִמַּטֶּה ... לְמַטֶּה אַחֵר
  choice: एक गोत्र से दूसरे गोत्र में
  rationale: भूमि-विभाजन के इस प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है, न कि उसका शाब्दिक अर्थ ‘लाठी’।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है।
- source_word: אִישׁ
  choice: अपनी-अपनी
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक अर्थ देता है और बहुवचन ‘गोत्र’ के प्रत्येक सदस्य-इकाई पर लागू होता है; हिन्दी में ‘अपनी-अपनी’ उसी बल को स्वाभाविक ढंग से रखता है।
- source_word: בְּנַחֲלָתוֹ יִדְבְּקוּ
  choice: अपनी-अपनी विरासत से जुड़े रहें
  rationale: דבק का मूल भाव जुड़े रहने या दृढ़ता से लगे रहने का है; यह रूपक बचाता है और स्थायी गोत्रीय अधिकार का आशय स्पष्ट करता है।
- source_word: מַטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के सभी गोत्र
  rationale: यह हिब्रू की लिंगयुक्त वाचिक संरचना ‘इस्राएल के पुत्र’ को बनाए रखते हुए सामूहिक गोत्रीय संदर्भ स्पष्ट करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל की लिंगयुक्त वाचा-संबंधी अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल पाठ की स्पष्ट पुरुषवाचक पारंपरिक अभिव्यक्ति को सुरक्षित रखा गया है; प्रसंग में यह पूरे वाचा-समुदाय का सामूहिक नाम है।
- issue: गोत्रों का अपनी विरासत से संबंध
  choice: अपनी-अपनी विरासत से जुड़े रहें
  alternative: अपनी-अपनी विरासत को थामे रहें
  rationale: दृढ़ता से जुड़े रहने का रूपक बनाए रखा गया है और इसे केवल स्वामित्व अथवा सक्रिय कब्जे के अधिक संकीर्ण अर्थ में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी-विधिक गरिमा बनाए रखते हुए वाक्य सामान्य पाठक के लिए सहज रखा गया है। ‘गोत्र’ और ‘विरासत’ परिचित बाइबलीय-कानूनी शब्द हैं। बहुवचन ‘अपनी-अपनी’ हिब्रू के वितरणात्मक एकवचन को स्वाभाविक हिन्दी में व्यक्त करता है।
