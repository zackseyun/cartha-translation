  text: זֶ֣ה הַ/דָּבָ֞ר אֲשֶׁר צִוָּ֣ה יְהוָ֗ה לִ/בְנ֤וֹת צְלָפְחָד֙ לֵ/אמֹ֔ר לַ/טּ֥וֹב בְּ/עֵינֵי/הֶ֖ם תִּהְיֶ֣ינָה לְ/נָשִׁ֑ים אַ֗ךְ לְ/מִשְׁפַּ֛חַת מַטֵּ֥ה אֲבִי/הֶ֖ם תִּהְיֶ֥ינָה לְ/נָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/006.yaml
  text: This is the word that Yahweh has commanded concerning the daughters of Zelophehad[a], saying, ‘Let them become wives to whomever seems good in their eyes[b]; only they must become wives within the family of the tribe of their father.’
translation:
  language: hi
  text: 'यहोवा ने सलोफहाद की बेटियों के विषय में यह आज्ञा दी है: ‘वे जिसे उचित समझें, उससे विवाह करें[a]; पर वे अपने पिता के गोत्र के कुल के भीतर ही विवाह करें[b]।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “जो उनकी आँखों में अच्छा हो।” अर्थात, जिसे वे उचित समझें।'
    reason: lexical_alternative
  - marker: b
    text: या, “अपने पिता के गोत्र के वंश-कुल के भीतर।” मूल भाषा में ‘कुल/परिवार’ और ‘गोत्र’ दोनों शब्द हैं, जो विवाह को पैतृक गोत्रीय सीमा के भीतर रखते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֶה הַדָּבָר
  choice: यह आज्ञा
  rationale: דָּבָר का अर्थ ‘वचन’ या ‘बात’ हो सकता है; यहाँ औपचारिक ईश्वरीय निर्देश के संदर्भ में ‘आज्ञा’ स्वाभाविक रूप से उसका अधिकारपूर्ण भाव व्यक्त करता है।
- source_word: צִוָּה יְהוָה
  choice: यहोवा ने ... आज्ञा दी है
  rationale: צוה स्पष्ट रूप से आदेश देने को दर्शाता है। पूर्ण क्रिया का वर्तमान-प्रासंगिक प्रभाव हिन्दी के ‘दी है’ से व्यक्त होता है, और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से लिखा गया है।
- source_word: לִבְנוֹת צְלָפְחָד
  choice: सलोफहाद की बेटियों के विषय में
  rationale: ל यहाँ आज्ञा के संबंध या विषय को सूचित करता है; ‘के विषय में’ इस अर्थ को स्पष्ट और सहज रखता है।
- source_word: לַטּוֹב בְּעֵינֵיהֶם
  choice: जो उनकी दृष्टि में अच्छा हो
  rationale: हिब्रू मुहावरे ‘उनकी आँखों में अच्छा’ को समझने योग्य हिन्दी में रखते हुए स्त्रियों की पसंद का भाव सुरक्षित रखा गया है।
- source_word: תִּהְיֶינָה לְנָשִׁים
  choice: वे उससे विवाह करें
  rationale: शाब्दिक अर्थ ‘पत्नियाँ हों’ है, किंतु हिन्दी में ‘विवाह करें’ अधिक स्वाभाविक है और प्रसंगगत अर्थ को ठीक व्यक्त करता है।
- source_word: אַךְ
  choice: पर
  rationale: यह कण पहले दी गई स्वतंत्रता पर प्रतिबंध लगाता है; ‘पर’ हिन्दी में इस सीमाबोध को सहजता से दर्शाता है।
- source_word: לְמִשְׁפַּחַת מַטֵּה אֲבִיהֶם
  choice: अपने पिता के गोत्र के कुल में ही
  rationale: מִשְׁפָּחָה और מַטֶּה दोनों को क्रमशः ‘कुल’ और ‘गोत्र’ से व्यक्त किया गया है; ‘ही’ विवाह को पैतृक गोत्रीय संरचना के भीतर सीमित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिन्दी बाइबल-पाठकों में सुस्थापित रूप ‘यहोवा’ नाम को पदवी में बदले बिना सुरक्षित रखता है।
- issue: विवाह की स्वतंत्रता और गोत्रीय सीमा
  choice: व्यक्तिगत पसंद को स्वीकार करते हुए विवाह को पिता के गोत्र के कुल तक सीमित रखना
  alternative: केवल कुल के भीतर विवाह का आदेश, बिना पसंद पर बल दिए
  rationale: पद में पहले ‘जो उनकी दृष्टि में अच्छा हो’ द्वारा वास्तविक पसंद दी गई है और फिर אַךְ द्वारा उस पर गोत्रीय प्रतिबंध लगाया गया है; दोनों पक्षों का तनाव बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। ‘गोत्र’ और ‘कुल’ दोनों पारिभाषिक शब्द मूल के सामाजिक ढाँचे को अलग-अलग व्यक्त करते हैं; वाक्य में दोहराए गए शाब्दिक ‘पत्नियाँ हों’ के स्थान पर स्वाभाविक ‘विवाह करें’ चुना गया है।
