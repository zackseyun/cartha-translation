base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/004.yaml
  text: And when the Jubilee comes for the sons of Israel[a], their inheritance will be added to the inheritance of the tribe to which they belong, and their inheritance will be taken away from the inheritance of the tribe of our fathers.
translation:
  language: hi
  text: और यदि इस्राएल के पुत्रों[a] के लिए जुबली-वर्ष आए, तो उनकी विरासत उस गोत्र की विरासत में जुड़ जाएगी जिससे वे संबद्ध होंगी, और उनकी विरासत हमारे पिताओं के गोत्र की विरासत में से घट जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों”; परम्परागत रूप से “इस्राएल की सन्तान।” इब्रानी में शाब्दिक अर्थ “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: इब्रानी पदबंध की शर्तसूचकता को सुरक्षित रखा गया है। प्रसंग में यह एक अपेक्षित भावी स्थिति है, फिर भी ‘जब’ कहने से मूल का शर्तसूचक तनाव दब सकता था।
- source_word: יִהְיֶה הַיֹּבֵל
  choice: जुबली-वर्ष आए
  rationale: היה के साथ योबेल के आगमन को स्वाभाविक हिन्दी में ‘आए’ कहा गया है; ‘जुबली-वर्ष’ इस नियत वर्ष का संक्षिप्त और प्रचलित बाइबलीय नाम है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक पदबंध ‘इस्राएल के पुत्रों’ को मुख्य पाठ में रखा गया है; अधिक सामान्य विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וְנוֹסְפָה
  choice: जुड़ जाएगी
  rationale: निफ़अल रूप यहाँ एक गोत्रीय भू-विरासत के दूसरी विरासत में सम्मिलित हो जाने का परिणाम व्यक्त करता है।
- source_word: נַחֲלָתָן
  choice: उनकी विरासत
  rationale: נחלה यहाँ वंशानुगत भूमि-अंश है। स्त्रीलिंग बहुवचन प्रत्यय प्रसंग की पुत्रियों की ओर संकेत करता है।
- source_word: עַל נַחֲלַת הַמַּטֶּה
  choice: उस गोत्र की विरासत में
  rationale: יסף के साथ על यहाँ किसी अन्य भू-अंश में जोड़ दिए जाने का अर्थ देता है; מטה का सन्दर्भानुकूल अर्थ ‘गोत्र’ है।
- source_word: אֲשֶׁר תִּהְיֶינָה לָהֶם
  choice: जिसकी वे हो जाएँगी
  rationale: यह अभिव्यक्ति स्त्रियों के दूसरे गोत्र से सम्बद्ध हो जाने को कहती है। हिन्दी रूप मूल के संबंधात्मक कथन को बनाए रखता है और ‘विवाह’ शब्द को स्पष्टतः नहीं जोड़ता।
- source_word: וּמִנַּחֲלַת מַטֵּה אֲבֹתֵינוּ
  choice: हमारे पिताओं के गोत्र की विरासत में से
  rationale: यह वक्ताओं के पैतृक गोत्र की विरासत और प्राप्तकर्ता गोत्र की विरासत के बीच विरोध को स्पष्ट रखता है।
- source_word: יִגָּרַע
  choice: घट जाएगी
  rationale: גרע का निफ़अल रूप यहाँ पैतृक गोत्रीय भू-अंश के कम हो जाने को व्यक्त करता है; यह निष्क्रिय ‘ले ली जाएगी’ की अपेक्षा मूल के घटने वाले परिणाम के निकट है।
