id: NUM.36.5
reference: Numbers 36:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְצַ֤ו מֹשֶׁה֙ אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל עַל פִּ֥י יְהוָ֖ה לֵ/אמֹ֑ר כֵּ֛ן מַטֵּ֥ה בְנֵֽי יוֹסֵ֖ף דֹּבְרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/005.yaml
  text: So Moses commanded the sons of Israel according to the word of Yahweh, saying, “The tribe of the sons of Joseph is speaking rightly.”
translation:
  language: hi
  text: 'तब मूसा ने यहोवा के वचन के अनुसार इस्राएलियों को यह आज्ञा दी: “यूसुफ़ के वंशजों का गोत्र ठीक कह रहा है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: क्रिया צוה अधिकारपूर्वक आदेश देने का भाव रखती है; ‘आज्ञा दी’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से प्रबल है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों को
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय यह प्रचलित सामुदायिक संबोधन है और पूरे इस्राएली समुदाय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा के वचन के अनुसार
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘यहोवा के मुँह के अनुसार’ है; यहाँ आशय उसके अधिकृत वचन अथवा आदेश के अनुरूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से अलग बनाए रखता है।
- source_word: לֵאמֹר
  choice: 'यह आज्ञा दी:'
  rationale: प्रत्यक्ष कथन का परिचय हिन्दी में विराम-चिह्न से स्वाभाविक रूप से हो जाता है; अलग से ‘कहते हुए’ जोड़ना अनावश्यक और बोझिल होता।
- source_word: מַטֵּה בְנֵי יוֹסֵף
  choice: यूसुफ़ के वंशजों का गोत्र
  rationale: מַטֶּה यहाँ ‘गोत्र’ है, और בְנֵי יוֹסֵף वंशगत समुदाय को सूचित करता है; यह हिन्दी में अर्थ स्पष्ट रखते हुए मूल पारिवारिक संबंध बचाता है।
- source_word: כֵּן ... דֹּבְרִים
  choice: ठीक कह रहा है
  rationale: כֵּן कथन की सत्यता या उचितता की पुष्टि करता है और participle דֹּבְרִים बोलने की क्रिया बनाए रखता है; सामूहिक एकवचन ‘गोत्र’ के साथ ‘कह रहा है’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय पाठकों के लिए व्यापक रूप से पहचाना जाने वाला नाम-रूप है और इसे केवल ‘प्रभु’ शीर्षक में नहीं बदलता।
- issue: यूसुफ़ के गोत्र के कथन पर ईश्वरीय अनुमोदन
  choice: ठीक कह रहा है
  alternative: सही है
  rationale: यह रूप उनके कथन को उचित ठहराता है और साथ ही मूल participle के ‘बोलने’ वाले तत्व को बनाए रखता है; इससे पुष्टि की सीमा अनावश्यक रूप से व्यापक नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘इस्राएलियों’ और ‘वंशजों’ से कृत्रिम शाब्दिकता टाली गई है, जबकि ‘गोत्र’, ईश्वरीय नाम और बोलने की क्रिया सुरक्षित रखी गई है।
