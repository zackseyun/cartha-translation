  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣לֶּה הַ/מִּצְוֺ֞ת וְ/הַ/מִּשְׁפָּטִ֗ים אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה אֶל בְּנֵ֣י יִשְׂרָאֵ֑ל בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/013.yaml
  text: These are the commandments and the judgments that Yahweh commanded through Moses to the sons of Israel in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: hi
  text: ये वे आज्ञाएँ और न्याय-विधान हैं, जिनकी आज्ञा याहवे ने मूसा के द्वारा इस्राएल के पुत्रों को मोआब के मैदानों में, यरदन के किनारे, यरीहो के सामने दी थी।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों”; यह वाचा-संबंधी अभिव्यक्ति सामूहिक रूप से इस्राएल की प्रजा को दर्शाती है।
    reason: lexical_alternative
  - marker: b
    text: या, “यरीहो के पास यरदन के किनारे।”
    reason: alternative_reading
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये वे ... हैं
  rationale: यह बहुवचन संकेतवाचक शब्द पुस्तक के अंत में सार-सूत्र प्रस्तुत करता है; हिन्दी में ‘ये वे ... हैं’ पिछले विधानों की ओर स्वाभाविक रूप से संकेत करता है।
- source_word: הַמִּצְוֺת
  choice: आज्ञाएँ
  rationale: מִצְוָה अधिकारपूर्वक दी गई आज्ञा को दर्शाता है; ‘आज्ञाएँ’ औपचारिक कानूनी स्वर बनाए रखता है।
- source_word: וְהַמִּשְׁפָּטִים
  choice: और न्याय-विधान
  rationale: कानूनी संदर्भ में מִשְׁפָּטִים न्यायिक निर्णयों, नियमों या विधानों का बोध करा सकता है; ‘न्याय-विधान’ इस व्यापक कानूनी अर्थ को स्पष्ट रखता है।
- source_word: צִוָּה
  choice: दिया था
  rationale: हिन्दी में ‘आज्ञाएँ और न्याय-विधान ... दिया’ स्वाभाविक है और प्रसंग में आदेश देने का अधिकारपूर्ण भाव सुरक्षित रहता है; ‘आज्ञाएँ’ के साथ ‘आज्ञा दी’ की पुनरुक्ति से बचता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक अर्थ ‘मूसा के हाथ से’ है; यह इब्रानी मुहावरा माध्यम या प्रतिनिधि को बताता है, जिसे आधुनिक हिन्दी में ‘मूसा के द्वारा’ स्पष्ट करता है।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों को
  rationale: בְּנֵי יִשְׂרָאֵל का औपचारिक वाचा-संबंधी रूप सुरक्षित रखा गया है; यहाँ यह सामूहिक रूप से इस्राएल की प्रजा को दर्शाता है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עַרְבֹת मोआब के मैदानी या स्तेपी भूभाग को दर्शाता है; ‘मैदानों’ सामान्य हिन्दी में स्पष्ट भौगोलिक अभिव्यक्ति है।
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: यरीहो के सामने यरदन के पास
  rationale: यह संक्षिप्त भौगोलिक पदबंध यरदन के मोआबी किनारे और यरीहो के सापेक्ष स्थान को बताता है; ‘सामने’ सम्भावित ‘यरीहो के सामने/उस पार’ अर्थ को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी दिव्य नाम है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला नाम-रूप है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल की वाचा-संबंधी पारिवारिक अभिव्यक्ति को मुख्य पाठ में रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि इसका आशय सामूहिक इस्राएली प्रजा है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। कानूनी समापन-सूत्र के औपचारिक स्वर को ‘आज्ञाएँ और न्याय-विधान’ से बनाए रखा गया है; स्थान-सूचक इब्रानी की संक्षिप्तता और सम्भावित अस्पष्टता को मुख्य पाठ तथा पादटिप्पणी में सुरक्षित रखा गया है।
