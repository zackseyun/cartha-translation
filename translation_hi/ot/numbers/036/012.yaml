  text: מִֽ/מִּשְׁפְּחֹ֛ת בְּנֵֽי מְנַשֶּׁ֥ה בֶן יוֹסֵ֖ף הָי֣וּ לְ/נָשִׁ֑ים וַ/תְּהִי֙ נַחֲלָתָ֔/ן עַל מַטֵּ֖ה מִשְׁפַּ֥חַת אֲבִי/הֶֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/012.yaml
  text: They became wives to the clans of the sons of Manasseh son of Joseph[a], and their inheritance remained with the tribe of the clan of their father.
translation:
  language: hi
  text: वे यूसुफ के पुत्र मनश्शे के पुत्रों के कुलों में ब्याही गईं[क], और उनकी विरासत उनके पिता के कुल के गोत्र में बनी रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “यूसुफ के पुत्र मनश्शे के पुत्रों के कुलों में से।” हिब्रू शब्द का अनुवाद संदर्भ के अनुसार ‘कुलों’ या ‘परिवारों’ किया जा सकता है।
    reason: मִמִּשְׁפְּחֹת के ‘से/में से’ संबंध और מִשְׁפָּחָה के ‘कुल/परिवार’ संबंधी वैकल्पिक अनुवाद को दर्शाने के लिए।
lexical_decisions:
- source_word: מִמִּשְׁפְּחֹת
  choice: के वंश के कुलों में ही
  rationale: מִן यहाँ उस समूह के भीतर से विवाह होने का भाव देता है। हिन्दी में ‘कुलों में ही ब्याही गईं’ स्वाभाविक रूप से बताता है कि विवाह मनश्शे के वंश के कुलों के भीतर हुआ; ‘ही’ अध्याय के अंतर्विवाह-संदर्भ को स्पष्ट करता है।
- source_word: בְּנֵי מְנַשֶּׁה בֶן יוֹסֵף
  choice: यूसुफ के पुत्र मनश्शे के वंश
  rationale: शाब्दिक ‘मनश्शे के पुत्र’ हिन्दी में केवल प्रत्यक्ष पुत्रों का भ्रम दे सकता है; यहाँ वंशगत समुदाय अभिप्रेत है। ‘यूसुफ के पुत्र मनश्शे’ वंशावली-संबंध को बनाए रखता है।
- source_word: הָיוּ לְנָשִׁים
  choice: ब्याही गईं
  rationale: इसका अर्थ ‘पत्नियाँ हुईं’ है। ‘ब्याही गईं’ आधुनिक हिन्दी में स्वाभाविक है और स्त्रियों को वाक्य का विषय बनाए रखता है।
- source_word: נַחֲלָתָן
  choice: उनकी विरासत
  rationale: गिनती के इस विधिक संदर्भ में נַחֲלָה पैतृक भूमि-अधिकार को दर्शाता है; ‘विरासत’ संक्षिप्त और प्रचलित समतुल्य है।
- source_word: וַתְּהִי
  choice: बनी रही
  rationale: मूल क्रिया ‘हुई/थी’ है, पर प्रसंग में विवाह के बाद भी विरासत के उसी गोत्र से जुड़ी रहने का परिणाम प्रमुख है; ‘बनी रही’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל מַטֵּה
  choice: के गोत्र में
  rationale: מַטֶּה यहाँ छड़ी नहीं, इस्राएल का जनजातीय विभाग है। बाइबलीय हिन्दी में ‘गोत्र’ इस बड़े जनजातीय निकाय के लिए परिचित और उपयुक्त है।
- source_word: מִשְׁפַּחַת אֲבִיהֶן
  choice: उनके पिता के कुल
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के पितृवंशीय कुल को दर्शाता है। ‘कुल’ ‘गोत्र’ से छोटे सामाजिक विभाग का भेद बनाए रखता है; एकवचन सामूहिक अर्थ में है।
