  text: וְ/כָל בַּ֞ת יֹרֶ֣שֶׁת נַחֲלָ֗ה מִ/מַּטּוֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/אֶחָ֗ד מִ/מִּשְׁפַּ֛חַת מַטֵּ֥ה אָבִ֖י/הָ תִּהְיֶ֣ה לְ/אִשָּׁ֑ה לְמַ֗עַן יִֽירְשׁוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלַ֥ת אֲבֹתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/008.yaml
  text: And every daughter who possesses an inheritance from the tribes of the sons of Israel shall become the wife of one from the clan of her father's tribe[d][c][b][a], so that the sons of Israel may each possess the inheritance of his fathers.
translation:
  language: hi
  text: और इस्राएल के पुत्रों के गोत्रों में से हर वह बेटी जो विरासत की अधिकारी हो[a], अपने पिता के गोत्र के कुल[c] में से किसी एक की पत्नी बने, ताकि इस्राएल के पुत्र[b] प्रत्येक अपने पुरखाओं की विरासत का अधिकारी हो[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो विरासत पाती हो”; इब्रानी कृदन्त उत्तराधिकारिणी के रूप में बेटी की स्थिति पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: c
    text: या, “परिवार”; यहाँ इब्रानी शब्द गोत्र के भीतर के एक कुल या नातेदारी-समूह को दर्शाता है।
    reason: lexical_alternative
  - marker: d
    text: या, “ताकि इस्राएल के पुत्रों में से हर एक अपने पुरखाओं की विरासत पाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרֶשֶׁת נַחֲלָה
  choice: विरासत की अधिकारी हो
  rationale: वर्तमान कृदन्त बेटी की उत्तराधिकारिणी के रूप में स्थिति को व्यक्त करता है। यह सहज हिन्दी में भूमि-विरासत पर उसके वैधानिक अधिकार को बताता है और अस्वाभाविक ‘विरासत को विरासत में पाए’ से बचता है।
- source_word: מִמַּטּוֹת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के गोत्रों में
  rationale: מַטֶּה यहाँ गोत्रीय इकाई है। ‘इस्राएल के पुत्र’ मूल के पितृवंशीय और वाचाई कानूनी मुहावरे को बनाए रखता है।
- source_word: מִמִּשְׁפַּחַת מַטֵּה אָבִיהָ
  choice: अपने पिता के गोत्र के कुल में से
  rationale: מִשְׁפָּחָה गोत्र के भीतर की कुल-स्तरीय नातेदारी इकाई है; इसलिए ‘कुल’ बड़े ‘गोत्र’ से इसका भेद स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: תִּהְיֶה לְאִשָּׁה
  choice: किसी एक की पत्नी बने
  rationale: शाब्दिक अर्थ ‘पत्नी के रूप में हो’ है। चुना हुआ रूप वैधानिक निर्देश को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִירְשׁוּ אִישׁ
  choice: अपने-अपने … के अधिकारी बने रहें
  rationale: ירשׁ भूमि को विरासत में पाने अथवा उस पर अधिकार बनाए रखने का अर्थ दे सकता है; אִישׁ का वितरणात्मक बल ‘अपने-अपने’ से व्यक्त हुआ है। प्रसंग में उद्देश्य पैतृक भू-अधिकार को संबंधित गोत्र में बनाए रखना है।
- source_word: נַחֲלַת אֲבֹתָיו
  choice: अपने-अपने पुरखाओं की विरासत
  rationale: ‘पुरखाओं’ से אֲבֹתָיו की पितृवंशीय दिशा बनी रहती है, जबकि वाक्य आधुनिक हिन्दी में स्वाभाविक रहता है।
theological_decisions:
- issue: लिंगसूचक वाचाई और उत्तराधिकार संबंधी भाषा
  choice: मुख्य पाठ में ‘इस्राएल के पुत्र’ और ‘पुरखाओं की विरासत’ रखा गया है।
  alternative: ‘इस्राएली’ और ‘पूर्वजों की विरासत’
  rationale: यह पद पितृवंशीय उत्तराधिकार व्यवस्था का वर्णन करता है; इसलिए पुल्लिंग रूप कानूनी संरचना का सार्थक भाग हैं, केवल सामान्य व्याकरणिक रूप नहीं।
- issue: ירשׁ का विरासत पाने और अधिकार रखने के बीच अर्थ-विस्तार
  choice: पहले प्रयोग में ‘विरासत की अधिकारी’ और उद्देश्य-वाक्य में ‘अधिकारी बने रहें’।
  alternative: ‘विरासत पाए’ और ‘विरासत पाएँ’
  rationale: मूल दोनों स्थानों पर उत्तराधिकार/अधिकार का अर्थ संभव करता है। इस कानूनी प्रसंग में स्थिति और निरंतर गोत्रीय भू-अधिकार को मुख्य पाठ में स्पष्ट किया गया है, और घटना-केंद्रित विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण वैधानिक स्वर रखा गया है। ‘गोत्र’ और ‘कुल’ से मूल की दो अलग सामाजिक इकाइयाँ स्पष्ट होती हैं। ‘अपने-अपने’ वितरणात्मक अर्थ को सहज रूप से व्यक्त करता है।
