source:
  edition: WLC
  text: וְ/לֹֽא תִסֹּ֤ב נַחֲלָה֙ לִ/בְנֵ֣י יִשְׂרָאֵ֔ל מִ/מַּטֶּ֖ה אֶל מַטֶּ֑ה כִּ֣י אִ֗ישׁ בְּ/נַחֲלַת֙ מַטֵּ֣ה אֲבֹתָ֔י/ו יִדְבְּק֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/007.yaml
  text: So no inheritance of the sons of Israel shall pass from tribe to tribe[a], for the sons of Israel shall each hold fast to the inheritance of the tribe of his fathers.
translation:
  language: hi
  text: इस्राएलियों की कोई विरासत एक गोत्र से दूसरे गोत्र में न जाए, क्योंकि हर इस्राएली अपने पितरों के गोत्र की विरासत से दृढ़ता से जुड़ा रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תִסֹּב
  choice: न जाए
  rationale: यहाँ क्रिया का अर्थ भौतिक रूप से मुड़ना नहीं, बल्कि विरासत का एक गोत्र के अधिकार से दूसरे गोत्र के अधिकार में चले जाना है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह इस प्रसंग में वंशानुगत रूप से मिली गोत्रीय भूमि और संपत्ति के लिए उपयुक्त कानूनी शब्द है।
- source_word: מִמַּטֶּה אֶל מַטֶּה
  choice: एक गोत्र से दूसरे गोत्र में
  rationale: संदर्भ में מַטֶּה का अर्थ स्पष्टतः 'गोत्र' है; हिन्दी में यह रूप कानूनी हस्तांतरण का भाव सहजता से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: हिब्रू का शाब्दिक रूप 'इस्राएल के पुत्र' है, पर यहाँ यह पूरे समुदाय का प्रचलित जातिवाचक नाम है; आधुनिक हिन्दी में 'इस्राएली' स्वाभाविक और स्पष्ट है।
- source_word: אִישׁ
  choice: हर इस्राएली
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ रखता है; 'हर इस्राएली' व्यक्तिगत दायित्व और उसके सामुदायिक संदर्भ दोनों को स्पष्ट करता है।
- source_word: יִדְבְּקוּ
  choice: से जुड़ा रहे
  rationale: דבק दृढ़ता से लगे या संबद्ध रहने को व्यक्त करता है। भूमि-विरासत के कानूनी संदर्भ में 'से जुड़ा रहे' स्वाभाविक है और संबंध न टूटने का भाव बनाए रखता है।
- source_word: בְּנַחֲלַת מַטֵּה אֲבֹתָיו
  choice: अपने पूर्वजों के गोत्र की विरासत से
  rationale: यह वाक्यांश पैतृक गोत्र को मिली विरासत बताता है। 'पूर्वजों' वर्तमान हिन्दी में वंशगत अर्थ को गरिमापूर्वक और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: सामुदायिक विधान में पुल्लिंग और वंशावली-संबंधी भाषा
  choice: इस्राएली ... हर इस्राएली ... अपने पूर्वजों के गोत्र
  alternative: इस्राएल के पुत्र ... हर पुरुष ... अपने पितरों के गोत्र
  rationale: मूल पाठ की वंशगत और गोत्रीय संरचना सुरक्षित रखी गई है, किंतु जातिवाचक בְּנֵי יִשְׂרָאֵל और वितरणात्मक אִישׁ को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है। 'पूर्वजों' अֲבֹתָיו के पैतृक वंश का आशय रखता है, बिना इस कानूनी कथन को केवल तत्कालीन व्यक्तिगत पिताओं तक सीमित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी-विधानात्मक किंतु सहज और गरिमापूर्ण शैली। 'विरासत', 'गोत्र' और 'पूर्वज' जैसे परिचित शब्दों से मूल की गोत्रीय भूमि-व्यवस्था स्पष्ट रखी गई है।
