base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/011.yaml
  text: Mahlah[a], Tirzah, Hoglah, Milcah, and Noah, the daughters of Zelophehad, became wives of the sons of their uncles.
translation:
  language: hi
  text: सलोफहाद की बेटियाँ—महला, तिर्सा, होग्ला, मिल्का और नोआ—अपने चाचाओं[a] के बेटों की पत्नियाँ बनीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात्, उनके पिता के भाइयों के बेटे।
    reason: ‘चाचा’ यहाँ सामान्य रूप से पिता के भाइयों के लिए प्रयुक्त है; पादटिप्पणी मूल इब्रानी के पैतृक संबंध को अधिक स्पष्ट करती है।
lexical_decisions:
- source_word: וַתִּהְיֶינָה
  choice: पत्नियाँ बनीं
  rationale: यह रूप विवाह के परिणामस्वरूप नई अवस्था में आने को व्यक्त करता है; इसलिए केवल ‘थीं’ की अपेक्षा ‘बनीं’ अधिक स्वाभाविक और सटीक है।
- source_word: בְּנוֹת צְלָפְחָד
  choice: सलोफहाद की बेटियाँ
  rationale: वंशावली-संबंधी इस प्रसंग में בְּנוֹת का सीधा अर्थ ‘बेटियाँ’ है; צְלָפְחָד का प्रचलित हिन्दी लिप्यंतरण ‘सलोफहाद’ रखा गया है।
- source_word: לִבְנֵי דֹדֵיהֶן
  choice: अपने चाचाओं के बेटों की
  rationale: विवाह-सूचक वाक्य में לִבְנֵי उन पुरुषों को बताता है जिनसे उनका विवाह हुआ। דֹדֵיהֶן यहाँ पैतृक कुल के संदर्भ में उनके पिता के भाइयों की ओर संकेत करता है; मुख्य पाठ में स्वाभाविक हिन्दी ‘चाचाओं’ रखी गई है और अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: לְנָשִׁים
  choice: पत्नियाँ
  rationale: यह विवाह-सूत्र में ‘पत्नियों के रूप में’ का अर्थ देता है; हिन्दी में ‘पत्नियाँ बनीं’ स्वाभाविक है।
- source_word: מַחְלָה תִרְצָה וְחָגְלָה וּמִלְכָּה וְנֹעָה
  choice: महला, तिर्सा, होग्ला, मिल्का और नोआ
  rationale: व्यक्तिनामों का हिन्दी में लिप्यंतरण किया गया है और मूल क्रम सुरक्षित रखा गया है।
