  text: וַֽ/יִּקְרְב֞וּ רָאשֵׁ֣י הָֽ/אָב֗וֹת לְ/מִשְׁפַּ֤חַת בְּנֵֽי גִלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה מִֽ/מִּשְׁפְּחֹ֖ת בְּנֵ֣י יוֹסֵ֑ף וַֽ/יְדַבְּר֞וּ לִ/פְנֵ֤י מֹשֶׁה֙ וְ/לִ/פְנֵ֣י הַ/נְּשִׂאִ֔ים רָאשֵׁ֥י אָב֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/001.yaml
  text: Then the heads of the fathers’ houses of the clan of the sons of Gilead son of Machir[a], son of Manasseh, from the clans of the sons of Joseph, came near and spoke before Moses and before the leaders[b], the heads of the fathers’ houses of the sons of Israel.
translation:
  language: hi
  text: तब यूसुफ़ के पुत्रों के कुलों में से, माकीर के पुत्र और मनश्शे के पुत्र गिलाद के पुत्रों के कुल के पितृ-घरानों के मुखिया[a] पास आए और मूसा तथा प्रधानों के सामने बोले, जो इस्राएलियों के पितृ-घरानों के मुखिया थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूर्वजों के घरानों के मुखिया” अथवा “परिवारों के मुखिया।” इब्रानी मुहावरा इस्राएल की गोत्रीय व्यवस्था में मान्य वंश-घरानों के अगुओं को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרְבוּ
  choice: पास आए
  rationale: क्रिया के ठोस अर्थ और किसी औपचारिक मामले को अधिकारियों के सामने लाने के प्रसंग—दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רָאשֵׁי הָאָבוֹת
  choice: पितृ-वंशों के मुखिया
  rationale: यह इस्राएल की वंश-आधारित सामाजिक व्यवस्था में मान्य अगुओं को दर्शाता है; केवल ‘परिवारों के मुखिया’ कहने की अपेक्षा मूल मुहावरे और संरचना को अधिक स्पष्ट रखता है।
- source_word: לְמִשְׁפַּחַת בְּנֵי גִלְעָד
  choice: गिलादियों के कुल के
  rationale: לְ संबंध सूचित करता है और בְּנֵי यहाँ गिलाद से निकले वंशजों को सामूहिक रूप से बताता है; ‘गिलादियों’ से हिन्दी में यह संबंध बिना इस भ्रम के स्पष्ट होता है कि सभी अगुए गिलाद के सीधे पुत्र थे।
- source_word: בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: गिलाद माकीर का पुत्र और मनश्शे का पोता था
  rationale: दोहराए गए ‘पुत्र’ को यांत्रिक ढंग से रखने के बजाय वास्तविक वंश-संबंध को स्पष्ट करता है और हिन्दी में संभावित अस्पष्टता से बचाता है।
- source_word: מִמִּשְׁפְּחֹת בְּנֵי יוֹסֵף
  choice: यूसुफ़ के वंशजों के कुलों में से
  rationale: מִן का स्रोत/समूह-संबंध और בְּנֵי का वंशगत अर्थ स्पष्ट तथा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וַיְדַבְּרוּ
  choice: अपनी बात रखी
  rationale: शाब्दिक ‘बोले’ की अपेक्षा औपचारिक निवेदन के प्रसंग को स्वाभाविक रूप से व्यक्त करता है, बिना अगले पद की विषय-वस्तु पहले जोड़ने के।
- source_word: לִפְנֵי מֹשֶׁה וְלִפְנֵי הַנְּשִׂיאִם
  choice: मूसा और प्रधानों के सामने
  rationale: לִפְנֵי की औपचारिक उपस्थिति और נְשִׂיאִים की नेतृत्व-संबंधी भूमिका को स्पष्ट रखता है।
- source_word: רָאשֵׁי אָבוֹת לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के पितृ-वंशों के मुखिया
  rationale: यह प्रधानों की समानाधिकरणात्मक पहचान को बनाए रखता है; ‘इस्राएली’ आधुनिक हिन्दी में औपचारिक ‘इस्राएल के पुत्र’ से अधिक सहज है।
