- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: यह भूमि-विभाजन की विधि को दर्शाता है; ‘चिट्ठी डालकर’ आधुनिक पाठक के लिए ‘चिट्ठी के अनुसार’ से अधिक स्पष्ट क्रियात्मक अभिव्यक्ति है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
