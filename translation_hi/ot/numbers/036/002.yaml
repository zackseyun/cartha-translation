  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में नाम के रूप में प्रस्तुत किया गया है।
- source_word: לָתֵת אֶת הָאָרֶץ בְּנַחֲלָה
  choice: देश को … विरासत के रूप में दे
