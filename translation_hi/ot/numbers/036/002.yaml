base_translation:
  language: en
  yaml_path: translation/ot/numbers/036/002.yaml
  text: And they said[a], “Yahweh commanded my lord to give the land as an inheritance by lot to the sons of Israel, and my lord was commanded by Yahweh to give the inheritance of Zelophehad our brother to his daughters.”
translation:
  language: hi
  text: उन्होंने कहा, “यहवे ने मेरे प्रभु को आज्ञा दी थी कि वह चिट्ठी डालकर देश को इस्राएल के पुत्रों[a] को विरासत के रूप में दे; और मेरे प्रभु को यहवे की ओर से आज्ञा मिली थी कि वह हमारे भाई सलोफाद की विरासत उसकी बेटियों को दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल की संतान” अथवा “इस्राएलियों को।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: לִבְנֵי יִשְׂרָאֵל के शाब्दिक पुल्लिंग रूप और उसके सामूहिक अर्थ, दोनों को दिखाने के लिए।
lexical_decisions:
