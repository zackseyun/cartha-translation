- source_word: נַחֲלַת צְלָפְחָד
  choice: सलोफाद की विरासत
  rationale: सम्बन्धवाचक रचना सलोफाद के वंश से जुड़ी पैतृक भूमि के हिस्से को संक्षेप और स्पष्ट रूप से व्यक्त करती है।
- source_word: אָחִינוּ
  choice: हमारे भाई
  rationale: मूल का निकट पारिवारिक/कुलीय संबोधन बिना उसे केवल ‘कुटुम्बी’ मानकर व्याख्यायित किए सुरक्षित रखा गया है।
- source_word: לִבְנֹתָיו
  choice: उसकी बेटियों को
  rationale: प्राप्तकर्ताओं और स्त्रीलिंग बहुवचन को सीधा तथा सहज ढंग से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहवे’ मूल नाम के प्रचलित विद्वत् पुनर्निर्मित उच्चारण का देवनागरी रूप है।
- issue: לִבְנֵי יִשְׂרָאֵל में लिंग-सूचक सामूहिक भाषा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की संतान; इस्राएलियों
  rationale: मूल की औपचारिक ‘पुत्रों’ वाली अभिव्यक्ति मुख्य पाठ में रखी गई है, जबकि उसके व्यापक सामूहिक आशय को पाद-टिप्पणी के विकल्पों से स्पष्ट किया गया है।
translation_notes:
  register: भाषा औपचारिक कानूनी प्रसंग के अनुरूप गरिमापूर्ण रखी गई है, पर वाक्य-विन्यास आधुनिक हिन्दी में सहज है। ‘मेरे प्रभु’ आदरसूचक मानवीय संबोधन है; ‘यहवे’ केवल परमेश्वर के व्यक्तिगत नाम के लिए प्रयुक्त हुआ है।
