  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बालाक के क्रोध को तीव्र परंतु अनावश्यक रूप से नाटकीय बनाए बिना व्यक्त किया गया है। फुटनोट चिह्न उसी वाक्यांश के बाद रखा गया है जिसकी हिब्रू रचना वह समझाता है।
