base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/010.yaml
  text: Then Balak’s anger burned against Balaam[a], and he struck his hands together. And Balak said to Balaam, “I called you to curse my enemies, but look—you have indeed blessed them these three times!”
translation:
  language: hi
  text: तब बिलाम पर बालाक का क्रोध भड़क उठा और उसने अपनी हथेलियाँ आपस में मारीं। बालाक ने बिलाम से कहा, “मैंने तुम्हें अपने शत्रुओं को शाप देने के लिए बुलाया था, पर देखो, तुमने तो इन तीनों बार उन्हें आशीष ही दी है![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शब्दशः, “तुमने आशीष दी, आशीष दी”; यह रचना आशीष देने पर बल देती है और यहाँ बार-बार आशीष देने को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף בָּלָק אֶל בִּלְעָם
  choice: बिलाम पर बालाक का क्रोध भड़क उठा
  rationale: यह हिब्रू के ‘क्रोध जलने’ वाले मुहावरे की तीव्रता और बिलाम की ओर उसके विरोधपूर्ण रुख को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּסְפֹּק אֶת כַּפָּיו
  choice: उसने अपनी हथेलियाँ आपस में मारीं
  rationale: क्रोध के प्रसंग में यह हाथों को एक-दूसरे से मारने का संकेत देता है और ‘तालियाँ बजाईं’ से उत्पन्न होने वाले प्रशंसा के भ्रामक अर्थ से बचता है।
- source_word: לָקֹב אֹיְבַי קְרָאתִיךָ
  choice: मैंने तुम्हें अपने शत्रुओं को शाप देने के लिए बुलाया था
  rationale: यह बुलाने के उद्देश्य, शत्रुओं के बहुवचन और शाप देने की क्रिया को स्पष्ट तथा सीधे ढंग से रखता है।
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: यह अपेक्षित परिणाम के विपरीत बात पर ध्यान खींचने वाली विस्मय और विरोध की शक्ति को बनाए रखता है।
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: तुमने तो … उन्हें आशीष ही दी है
  rationale: ‘तो’ और ‘ही’ हिब्रू की क्रियात्मक तीव्रता को स्वाभाविक हिन्दी में व्यक्त करते हैं, जबकि तीन अवसरों का स्पष्ट उल्लेख पुनरावृत्ति को दर्शाता है।
- source_word: זֶה שָׁלֹשׁ פְּעָמִים
  choice: इन तीनों बार
  rationale: यह वर्तमान क्षण तक हुए तीन विशिष्ट अवसरों की संकेतात्मक शक्ति को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
