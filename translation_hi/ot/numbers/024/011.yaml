source:
  edition: WLC
  text: וְ/עַתָּ֖ה בְּרַח לְ/ךָ֣ אֶל מְקוֹמֶ֑/ךָ אָמַ֨רְתִּי֙ כַּבֵּ֣ד אֲכַבֶּדְ/ךָ֔ וְ/הִנֵּ֛ה מְנָעֲ/ךָ֥ יְהוָ֖ה מִ/כָּבֽוֹד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/011.yaml
  text: So now[a], flee to your place. I said, ‘I would surely honor you,’ but behold[b], Yahweh has kept you back from honor.
translation:
  language: hi
  text: तो अब, अपने स्थान की ओर भाग जा। मैंने कहा था, ‘मैं निश्चय ही तेरा आदर करूँगा,’ पर देख, याहवे ने तुझे आदर पाने से रोक दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक और कालवाचक क्रियाविशेषण दोनों को रखते हुए बालाक की निर्णायक प्रतिक्रिया का स्वाभाविक संक्रमण व्यक्त करता है।
- source_word: בְּרַח לְךָ
  choice: भाग जा
  rationale: आज्ञार्थक रूप जल्द और कठोर विदाई का भाव रखता है; ‘चला जा’ की अपेक्षा ‘भाग जा’ बालाक का तिरस्कारपूर्ण स्वर बेहतर दिखाता है।
- source_word: אֶל־מְקוֹמֶךָ
  choice: अपने स्थान को
  rationale: मूल में ‘स्थान’ है; यह बिलाम के घर या उसके उचित ठिकाने की ओर संकेत करता है, पर उसे अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: אָמַרְתִּי
  choice: मैंने कहा था
  rationale: पूर्व में व्यक्त प्रतिज्ञा का संदर्भ आधुनिक हिन्दी में सहज रूप से प्रकट होता है।
- source_word: כַּבֵּד אֲכַבֶּדְךָ
  choice: मैं निश्चय ही तेरा आदर करूँगा
  rationale: धातु के infinitive absolute और finite verb का मेल बलाघात देता है; ‘निश्चय ही’ उस प्रबल प्रतिज्ञा को व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: पर देख
  rationale: प्रतिज्ञा और परिणाम के बीच तीखा विरोध तथा הִנֵּה की तत्क्षणता दोनों बनाए रखता है।
- source_word: מְנָעֲךָ
  choice: तुझे … पाने से रोक दिया है
  rationale: מנע के ‘रोकना/वंचित रखना’ अर्थ को अगले מִן-वाक्यांश के साथ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: מִכָּבוֹד
  choice: आदर पाने से
  rationale: संदर्भ में כָּבוֹד राजकीय सम्मान और प्रतिष्ठा है; ‘महिमा’ यहाँ अनुचित धार्मिक अर्थ ला सकती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी पाठकों के लिए स्थापित ‘यहोवा’ नाम को रखते हुए इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: यहोवा द्वारा बिलाम को आदर से रोकना
  choice: यहोवा ने तुझे आदर पाने से रोक दिया है
  alternative: यहोवा ने तुझसे आदर रोक रखा है
  rationale: कर्ता और परिणाम को मूल के अनुसार स्पष्ट रखा गया है, बिना यह तय किए कि यह रोक प्रत्यक्ष दंड, परिस्थितिजन्य निषेध या बालाक का आरोप किस अर्थ में है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सीधे संबोधन वाली हिन्दी। बालाक की कठोरता दिखाने के लिए ‘भाग जा’ और संदर्भानुसार एकवचन ‘तू’ के रूप प्रयुक्त हैं। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
