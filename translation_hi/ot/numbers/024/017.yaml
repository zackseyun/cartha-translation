  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֶרְאֶ֨/נּוּ֙ וְ/לֹ֣א עַתָּ֔ה אֲשׁוּרֶ֖/נּוּ וְ/לֹ֣א קָר֑וֹב דָּרַ֨ךְ כּוֹכָ֜ב מִֽ/יַּעֲקֹ֗ב וְ/קָ֥ם שֵׁ֨בֶט֙ מִ/יִּשְׂרָאֵ֔ל וּ/מָחַץ֙ פַּאֲתֵ֣י מוֹאָ֔ב וְ/קַרְקַ֖ר כָּל בְּנֵי שֵֽׁת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/017.yaml
  text: I see him[a], but not now; I behold him, but not near. A star has come forth from Jacob, and a scepter has risen from Israel[c][b]; it will crush the corners of Moab and tear down all the sons of Sheth.
translation:
  language: hi
  text: मैं उसे देखता हूँ[a], पर अभी नहीं; मैं उसे निहारता हूँ, पर वह निकट नहीं। याकूब से एक तारा निकल आया है, और इस्राएल से एक राजदंड उठ खड़ा हुआ है; वह मोआब के कोनों को चूर कर देगा[b] और शेत[c] के सभी पुत्रों को ढा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उसे देखूँगा, पर अभी नहीं; मैं उसे निहारूँगा, पर वह निकट नहीं।” इब्रानी अपूर्ण क्रियाएँ वर्तमान दर्शन अथवा भावी दर्शन—दोनों रूपों में समझी जा सकती हैं।
    reason: व्याकरणिक विकल्प
  - marker: b
    text: शाब्दिक रूप से “मोआब के कोने”; संभवतः मोआब के छोरों या उसकी शक्ति के लिए एक रूपक।
    reason: काव्यात्मक रूपक
  - marker: c
    text: या, “सेत के सभी पुत्रों को।” इब्रानी שֵׁת को व्यक्तिवाचक नाम सेत/शेत पढ़ा जा सकता है; कुछ इसे मानवजाति अथवा किसी शत्रु समुदाय का व्यापक काव्यात्मक संकेत समझते हैं। दुर्लभ क्रिया का अनुवाद “ढा देगा” के बजाय “उजाड़ देगा” भी हो सकता है।
    reason: वैकल्पिक पठन और दुर्लभ शब्द
lexical_decisions:
- source_word: אֶרְאֶנּוּ
  choice: मैं उसे देखता हूँ
  rationale: प्रथम पुरुष एकवचन क्रिया के साथ पुल्लिंग एकवचन कर्म-प्रत्यय है। भविष्यसूचक दर्शन की सजीव वर्तमान शैली रखते हुए व्यक्तिगत संकेत ‘उसे’ सुरक्षित रखा गया है; ‘मैं उसे देखूँगा’ भी व्याकरणतः संभव है।
- source_word: אֲשׁוּרֶנּוּ
  choice: मैं उसे निहारता हूँ
  rationale: שׁור का अर्थ ध्यान से देखना या निहारना है। ‘निहारता हूँ’ पहले क्रियापद के समानांतर रहते हुए उसका विशिष्ट भाव बनाए रखता है।
- source_word: קָרוֹב
  choice: निकट
  rationale: शब्द स्थानिक और कालिक दोनों अर्थ दे सकता है। यहाँ मुख्यतः कालिक संदर्भ है, पर ‘निकट’ मूल की अस्पष्टता को ‘शीघ्र’ से बेहतर बचाता है।
- source_word: דָּרַךְ כּוֹכָב
  choice: एक तारा निकल आया है
  rationale: דָּרַךְ का मूल भाव कदम रखना या आगे बढ़ना है और यहाँ तारे के प्रकट होने की राजकीय छवि है। ‘निकल आया है’ स्वाभाविक हिन्दी में भविष्यसूचक पूर्णता को व्यक्त करता है।
- source_word: וְקָם שֵׁבֶט
  choice: एक राजदंड उठ खड़ा हुआ है
  rationale: שֵׁבֶט के अर्थ दंड, छड़ी, गोत्र और राजदंड हो सकते हैं। तारे के समानांतर तथा विजय के संदर्भ में ‘राजदंड’ राजकीय अर्थ को उचित रूप से व्यक्त करता है।
- source_word: וּמָחַץ
  choice: वह ... चूर कर देगा
  rationale: מחץ का अर्थ कुचलना या चूर करना है। ‘वह’ आरंभ के पुल्लिंग व्यक्ति और तारा/राजदंड से चित्रित शासक—दोनों स्तरों को जोड़ता है, जबकि भविष्यकाल भविष्यवाणी की दिशा स्पष्ट करता है।
- source_word: פַּאֲתֵי מוֹאָב
  choice: मोआब के कोने
  rationale: פֵּאָה का सामान्य अर्थ कोना, किनारा या छोर है। शाब्दिक रूपक को मुख्य पाठ में रखा गया है और उसके संभावित भाव की टिप्पणी दी गई है।
- source_word: וְקַרְקַר
  choice: ढा देगा
  rationale: यह दुर्लभ और अनिश्चित क्रिया है, जिसके प्रस्तावित अर्थ गिराना, ध्वस्त करना या उजाड़ना हैं। ‘ढा देगा’ इस अनिश्चितता के भीतर विजय-संदर्भ के अनुकूल है।
- source_word: כָּל בְּנֵי שֵׁת
  choice: शेत के सभी पुत्र
  rationale: व्यंजन-पाठ को व्यक्तिवाचक नाम शेत के रूप में रखा गया है। ‘सेत’ तथा मानवजाति या किसी शत्रु समुदाय के व्यापक काव्यात्मक संकेत की संभावनाएँ टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: बिलाम के वचन का मसीही अर्थ
  choice: मुख्य पाठ में ‘तारा’ और ‘राजदंड’ की राजकीय छवियाँ रखी गई हैं, पर व्यक्ति को सीधे मसीह नहीं कहा गया।
  alternative: इसे सीधे मसीह की भविष्यवाणी कहना, अथवा इसे केवल दाऊद जैसे तत्कालीन ऐतिहासिक राजा तक सीमित करना।
  rationale: इब्रानी पाठ किसी नाम का उल्लेख किए बिना भविष्य के राजकीय विजेता की प्रतीकात्मक छवि देता है। अनुवाद बाद की मसीही व्याख्या को नकारता नहीं, पर उसे मूल पाठ में जोड़ता भी नहीं।
- issue: आरंभिक पुल्लिंग प्रत्ययों और बाद की प्रतीकात्मक संज्ञाओं का संबंध
  choice: आरंभ में ‘उसे’ और विजय-वाक्य में ‘वह’ रखा गया, जबकि ‘तारा’ और ‘राजदंड’ की छवियाँ अक्षुण्ण रहीं।
  alternative: पूरे पद को निर्जीव प्रतीकों के रूप में ‘यह’ कहना, या हर प्रतीक को स्पष्ट रूप से किसी नामित व्यक्ति में बदल देना।
  rationale: आरंभिक रूप स्पष्टतः पुल्लिंग एकवचन व्यक्ति की ओर संकेत करते हैं, जबकि मध्य भाग प्रतीकात्मक राजकीय संज्ञाएँ उपयोग करता है। यह रूप दोनों स्तरों को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के योग्य रखी गई है। ‘निहारता’, ‘राजदंड’ और ‘चूर’ काव्यात्मक ऊँचाई बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट है। सभी टिप्पणी-चिह्न मुख्य पाठ में क्रम से दिए गए हैं।
