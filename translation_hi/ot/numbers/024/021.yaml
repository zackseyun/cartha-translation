base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/021.yaml
  text: 'Then he saw the Kenite[a], and he took up his discourse and said: “Your dwelling place is enduring, and your nest is set in the rock.”'
translation:
  language: hi
  text: 'फिर उसने केनी जाति को देखा और अपना काव्य-वचन[a] आरम्भ करके कहा:


    “तेरा निवास अटल है,


    और तेरा घोंसला चट्टान में बना हुआ है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना भविष्यसूचक कथन।” इब्रानी מָשָׁל नीतिवचन, व्यंग्य-वचन या गंभीर भविष्यसूचक काव्य-कथन को सूचित कर सकता है; यहाँ यह बिलाम के काव्यात्मक कथन के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֵּינִי
  choice: केनी जाति
  rationale: इब्रानी रूप एकवचन और निश्चित है, पर यहाँ वह एक प्रतिनिधि सामूहिक नाम के रूप में केनी लोगों को सूचित करता है। ‘केनी जाति’ हिन्दी में इस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְשָׁלוֹ
  choice: अपना काव्य-वचन
  rationale: מָשָׁל यहाँ बिलाम के गंभीर, काव्यात्मक भविष्यसूचक कथन को दर्शाता है। ‘काव्य-वचन’ इसकी काव्यात्मक शैली और औपचारिक कथन—दोनों को बनाए रखता है; ‘नीतिवचन’ इस प्रसंग में बहुत संकीर्ण होगा।
- source_word: אֵיתָן
  choice: अटल
  rationale: यह शब्द दृढ़ता, स्थायित्व और सुरक्षा का बोध देता है। ‘अटल’ संक्षिप्त, काव्यात्मक और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מוֹשָׁבֶךָ
  choice: तेरा निवास
  rationale: यह बसने या रहने के स्थान को सूचित करता है। ‘निवास’ पद्य में गरिमापूर्ण और सहज है।
- source_word: וְשִׂים
  choice: बसा है
  rationale: पंक्ति के वर्णनात्मक समानांतर भाव में इसे घोंसले की सुरक्षित स्थिति के कथन के रूप में प्रस्तुत किया गया है। ‘बसा है’ घोंसले के रूपक और चट्टान में सुरक्षित ठिकाने—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּסֶּלַע
  choice: चट्टान में
  rationale: סֶלַע चट्टान, शैल या ऊँची पथरीली जगह को सूचित कर सकता है। ‘चट्टान में’ मूल संबंधसूचक בְּ और सुरक्षित शैल-आश्रय की छवि को बनाए रखता है।
- source_word: קִנֶּךָ
  choice: तेरा घोंसला
  rationale: मूल शब्द का सीधा अर्थ ‘घोंसला’ है। पक्षी के सुरक्षित घोंसले का रूपक बिना सपाट किए सुरक्षित रखा गया है।
