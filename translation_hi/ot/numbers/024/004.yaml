source:
  edition: WLC
  text: נְאֻ֕ם שֹׁמֵ֖עַ אִמְרֵי אֵ֑ל אֲשֶׁ֨ר מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/004.yaml
  text: 'the declaration of one who hears the words of God[a], who sees the vision of the Almighty, falling down[b], yet with eyes uncovered:'
translation:
  language: hi
  text: 'उस जन की उक्ति[a],

    जो परमेश्वर के वचन सुनता है,

    जो सर्वशक्तिमान का दर्शन देखता है,

    जो गिरा पड़ा है और जिसकी आँखें अनावृत हैं[b]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस जन की घोषणा।” इब्रानी נְאֻם भविष्यद्वक्ता की गंभीर और औपचारिक उक्ति के लिए प्रयुक्त शब्द है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसकी आँखें खुली हुई हैं।” शाब्दिक रूप से, “आँखें अनावृत हैं”; यह रहस्योद्घाटन में अनावृत दृष्टि की छवि बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: गंभीर वाणी
  rationale: यह भविष्यद्वक्ताओं की औपचारिक और गंभीर उक्ति के लिए प्रयुक्त संज्ञा है। ‘गंभीर वाणी’ उसके solemn prophetic स्वर को रखती है, बिना ऐसे पारिभाषिक अर्थ जोड़े जो मूल में अनिवार्य नहीं हैं।
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: जो परमेश्वर के वचन सुनता है
  rationale: कृदंत שֹׁמֵעַ व्यक्ति की विशेषता बताता है; वर्तमानकालीन संबंधवाचक वाक्यांश आधुनिक हिन्दी में स्वाभाविक है। אֵל यहाँ सामान्य ईश्वरीय उपाधि है।
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: जो सर्वशक्तिमान का दर्शन देखता है
  rationale: מַחֲזֵה और יֶחֱזֶה की दृष्टि-संबंधी पुनरुक्ति को जानबूझकर रखा गया है। שַׁדַּי को नाम की तरह लिप्यंतरित करने के बजाय उपाधि के रूप में अनूदित किया गया है।
- source_word: נֹפֵל
  choice: जो गिरा पड़ा है
  rationale: यह कृदंत दर्शन पाने वाले की अवस्था बताता है। ‘गिरा पड़ा है’ शारीरिक पतन की छवि रखता है और ‘दण्डवत’ कहकर मुद्रा को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וּגְלוּי עֵינָיִם
  choice: फिर भी उसकी आँखें खुली हुई हैं
  rationale: शाब्दिक अर्थ ‘आँखें अनावृत’ है। हिन्दी में ‘आँखें खुली हुई हैं’ स्वाभाविक है; ‘फिर भी’ गिरा होने और देखने में सक्षम होने के बीच निहित विरोध को स्पष्ट करता है।
theological_decisions:
- issue: שַׁדַּי का अनुवाद
  choice: सर्वशक्तिमान
  alternative: शद्दाय
  rationale: यहाँ इसे ईश्वर की उपाधि मानकर अर्थानुसार अनूदित किया गया है। इससे किसी संप्रदाय-विशेष की अतिरिक्त व्याख्या नहीं जुड़ती।
- issue: נֹפֵל में शरीर की मुद्रा
  choice: गिरा पड़ा है
  alternative: दण्डवत पड़ा है
  rationale: मूल शब्द गिरने या गिरे होने को व्यक्त करता है, पर स्वयं किसी उपासना-मुद्रा को निश्चित नहीं करता; इसलिए अधिक विशिष्ट धार्मिक मुद्रा आरोपित नहीं की गई।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। काव्यात्मक समानांतरता बनाए रखने के लिए पंक्तियाँ अलग रखी गई हैं। ‘दर्शन देखता है’ की पुनरुक्ति मूल इब्रानी की दृष्टि-संबंधी शब्दावली को सुरक्षित रखती है।
