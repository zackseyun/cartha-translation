source:
  edition: WLC
  text: נְאֻ֗ם שֹׁמֵ֨עַ֙ אִמְרֵי אֵ֔ל וְ/יֹדֵ֖עַ דַּ֣עַת עֶלְי֑וֹן מַחֲזֵ֤ה שַׁדַּי֙ יֶֽחֱזֶ֔ה נֹפֵ֖ל וּ/גְל֥וּי עֵינָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/016.yaml
  text: 'the declaration of one who hears the words of God[a], and knows the knowledge of the Most High, who sees the vision of the Almighty, falling down[b], yet with uncovered eyes:'
translation:
  language: hi
  text: 'यह उसका कथन है—जो परमेश्वर के वचन सुनता है[a], और परमप्रधान का ज्ञान जानता है, जो सर्वशक्तिमान का दर्शन देखता है, गिरता हुआ, फिर भी जिसकी आँखें खुली हैं:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो परमेश्वर की उक्तियाँ सुनता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נְאֻם
  choice: उसका कथन
  rationale: यह शब्द गंभीर भविष्यद्वाणी-संबंधी घोषणा का परिचय देता है; ‘कथन’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसकी औपचारिक गरिमा बनाए रखता है।
- source_word: שֹׁמֵעַ אִמְרֵי אֵל
  choice: जो परमेश्वर के वचन सुनता है
  rationale: कृदन्त के निरंतर स्वभाव और इम्रे एल के बोले गए दिव्य वचनों—दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְיֹדֵעַ דַּעַת עֶלְיוֹן
  choice: और परमप्रधान का ज्ञान जानता है
  rationale: हिब्रू की जानबूझकर की गई पुनरुक्ति और संबंध की अस्पष्टता को सुरक्षित रखता है; इसका अर्थ परमप्रधान से मिला ज्ञान या उसके विषय का ज्ञान हो सकता है।
- source_word: מַחֲזֵה שַׁדַּי יֶחֱזֶה
  choice: जो सर्वशक्तिमान का दर्शन देखता है
  rationale: दिव्य प्रकाशन के रूप में दर्शन और समान धातु-संबंधी हिब्रू अभिव्यक्ति को यथासंभव बनाए रखता है।
- source_word: נֹפֵל
  choice: गिरा हुआ
  rationale: मूल पाठ गिरने की अवस्था कहता है; ‘समाधि में’ जैसी व्याख्यात्मक भाषा मुख्य पाठ में नहीं जोड़ी गई।
- source_word: וּגְלוּי עֵינָיִם
  choice: फिर भी जिसकी आँखें खुली हैं
  rationale: शाब्दिक चित्र को स्वाभाविक हिन्दी में व्यक्त करता है; ‘फिर भी’ गिरने और देखने के बीच संभावित विरोध को उभारता है, जबकि टिप्पणी अधिक शाब्दिक संयोजन सुरक्षित रखती है।
theological_decisions:
- issue: אֵל, עֶלְיוֹן और שַׁדַּי दिव्य उपाधियों का अनुवाद
  choice: परमेश्वर / परमप्रधान / सर्वशक्तिमान
  alternative: एल / एल्योन / शद्दै
  rationale: यहाँ ये परमेश्वर की अर्थपूर्ण उपाधियाँ हैं; अनुवाद उनके आशय को आधुनिक हिन्दी पाठक के लिए स्पष्ट रखता है।
- issue: דַּעַת עֶלְיוֹן में संबंध
  choice: परमप्रधान का ज्ञान
  alternative: परमप्रधान से मिला ज्ञान
  rationale: मूल रचना यह निर्धारित नहीं करती कि ज्ञान मुख्यतः परमप्रधान के विषय में है या उससे प्राप्त है; संक्षिप्त संबंधकारक दोनों संभावनाएँ खुली रखता है।
- issue: נֹפֵל का दर्शनीय अनुभव से संबंध
  choice: गिरा हुआ
  alternative: दर्शनीय समाधि में पड़ा हुआ
  rationale: हिब्रू में प्रत्यक्षतः ‘गिरना’ है; दर्शनीय तंद्रा या समाधि संदर्भगत व्याख्या है, इसलिए उसे मुख्य पाठ में निर्णायक रूप से नहीं रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गंभीर भविष्यद्वाणी-शैली रखी गई है। ‘ज्ञान जानता है’ सामान्य गद्य में असामान्य है, पर मूल हिब्रू की अर्थपूर्ण पुनरुक्ति और काव्यात्मक समानांतरता को सुरक्षित रखने के लिए रखा गया है।
