  text: וַ/יַּרְא֙ אֶת עֲמָלֵ֔ק וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר רֵאשִׁ֤ית גּוֹיִם֙ עֲמָלֵ֔ק וְ/אַחֲרִית֖/וֹ עֲדֵ֥י אֹבֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/020.yaml
  text: 'Then he saw Amalek and took up his discourse and said: “Amalek was the first of the nations[c][b][a], but his end is utter destruction.”'
translation:
  language: hi
  text: 'फिर उसने अमालेक को देखा और अपना काव्य-वचन[a] कहा:


    “अमालेक जातियों में प्रथम[b] था,


    पर उसका अन्त पूर्ण विनाश में होगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना भविष्यसूचक वचन सुनाया,” “अपना नीतिवचन कहा”; इब्रानी शब्द काव्यात्मक कथन, नीतिवचन, व्यंग्य-वचन या भविष्यसूचक वचन को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “जातियों में प्रमुख”; इब्रानी पद समय की दृष्टि से पहले अथवा प्रतिष्ठा में प्रमुख होने का अर्थ दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא אֶת עֲמָלֵק
  choice: फिर उसने अमालेक को देखा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और ראה का सीधा अर्थ ‘देखना’ है; ‘फिर’ स्वाभाविक हिन्दी क्रम व्यक्त करता है।
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: अपना काव्य-वचन आरम्भ करके
  rationale: מָשָׁל यहाँ नीतिवचन, दृष्टान्त, व्यंग्य-वचन या भविष्यसूचक काव्य-वचन हो सकता है। ‘काव्य-वचन’ बिलाम के ऊँचे काव्यात्मक कथन के अनुकूल है और किसी एक संकीर्ण विधा को अनिवार्य नहीं करता।
- source_word: רֵאשִׁית גּוֹיִם
  choice: जातियों में प्रथम
  rationale: רֵאשִׁית आरम्भिकता या प्रमुखता दोनों सूचित कर सकता है। ‘प्रथम’ इस वास्तविक अस्पष्टता को बनाए रखता है।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: व्यक्तिवाचक नाम का मानक हिन्दी लिप्यन्तरण; प्रसंग में यह इसी नाम से अभिहित जाति को दर्शाता है।
- source_word: וְאַחֲרִיתוֹ
  choice: पर उसका अन्त
  rationale: אַחֲרִית अन्त, परिणाम या भावी दशा का बोध कराता है। पहले कथन के साथ विरोध दिखाने के लिए ‘पर’ स्वाभाविक है।
- source_word: עֲדֵי אֹבֵד
  choice: पूर्ण विनाश होगा
  rationale: इब्रानी अभिव्यक्ति संक्षिप्त और दीर्घवृत्तात्मक है तथा अन्तिम नाश पर बल देती है। ‘पूर्ण विनाश’ उसकी तीव्रता व्यक्त करता है, बिना पाठ में स्पष्ट न होने वाला ‘सदा के लिए’ जोड़ने के।
theological_decisions:
- issue: ‘जातियों में प्रथम’ में अमालेक की स्थिति
  choice: समय की दृष्टि से पहले और प्रतिष्ठा की दृष्टि से प्रमुख होने के बीच इब्रानी अस्पष्टता को सुरक्षित रखा गया है।
  alternative: ‘जातियों में सबसे प्राचीन’ अथवा ‘जातियों में सर्वोपरि’
  rationale: मूल पद दोनों अर्थों की अनुमति देता है और पद स्वयं किसी एक को निश्चित नहीं करता; इसलिए ऐतिहासिक या धर्मवैचारिक निष्कर्ष आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमामय, सहज और काव्यात्मक शैली रखी गई है। पद-विन्यास भविष्यसूचक काव्य की दो पंक्तियों को स्पष्ट करता है; ‘प्रथम’ मूल की अर्थगत अस्पष्टता बनाए रखता है।
