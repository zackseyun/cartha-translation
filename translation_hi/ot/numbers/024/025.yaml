  text: Then Balaam rose and went and returned to his place, and Balak also went on his way.
translation:
  language: hi
  text: तब बिलाम उठा, चला और अपने स्थान पर लौट गया; और बालाक भी अपने मार्ग पर चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का यह रूप कथा-क्रम में उठने अथवा प्रस्थान के लिए तैयार होने को व्यक्त करता है; ‘उठा’ संक्षिप्त और स्वाभाविक है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וַיֵּלֶךְ
  choice: चला
  rationale: הלך का सामान्य कथात्मक अर्थ ‘जाना/चलना’ है; यहाँ ‘चला’ अगले लौटने वाले क्रियापद के साथ स्वाभाविक क्रम बनाता है।
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: שׁוב गंतव्य לִמְקֹמוֹ के साथ पहले के स्थान पर लौटने का अर्थ देता है।
- source_word: לִמְקֹמוֹ
  choice: अपने स्थान को
  rationale: מקום का मूल अर्थ ‘स्थान’ है। ‘घर’ कहना पाठ में निहित से अधिक निश्चित अर्थ जोड़ देता; इसलिए मूल की अस्पष्टता रखी गई है।
- source_word: וְגַם
  choice: और ... भी
  rationale: संयोजक और योगवाची अव्यय दोनों का बल रखते हुए बालाक के प्रस्थान को समानांतर क्रिया के रूप में जोड़ा गया है।
- source_word: בָּלָק
  choice: बालाक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הָלַךְ
  choice: चला गया
  rationale: הלך की सीधी कथात्मक क्रिया को स्वाभाविक हिन्दी में प्रस्तुत करता है।
- source_word: לְדַרְכּוֹ
  choice: अपने मार्ग पर
  rationale: דרך का अर्थ ‘मार्ग/रास्ता’ है; ‘अपने मार्ग पर चला गया’ हिब्रू मुहावरे का स्वाभाविक और पाठ-संयत हिन्दी रूप है।
