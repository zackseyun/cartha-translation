  text: אֵ֚ל מוֹצִיא֣/וֹ מִ/מִּצְרַ֔יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם ל֑/וֹ יֹאכַ֞ל גּוֹיִ֣ם צָרָ֗י/ו וְ/עַצְמֹתֵי/הֶ֛ם יְגָרֵ֖ם וְ/חִצָּ֥י/ו יִמְחָֽץ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/008.yaml
  text: God brings him out of Egypt[a]; he has for him the horns of a wild ox. He will consume the nations that are his adversaries[b], and will gnaw their bones and crush them with his arrows.
translation:
  language: hi
  text: ईश्वर उसे मिस्र से बाहर निकालता है; उसके पास जंगली बैल के सींग हैं[a]। वह अपने विरोधी राष्ट्रों को निगल जाएगा, उनकी हड्डियाँ चबा डालेगा[b], और अपने तीरों से उन्हें चूर कर देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे जंगली बैल जैसा बल प्राप्त है।” इब्रानी पदबंध כְּתוֹעֲפֹת רְאֵם कठिन है; इसे सींगों के बिंब के रूप में या अधिक सामान्य रूप से शक्ति के अर्थ में समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी हड्डियाँ तोड़ डालेगा” अथवा “उनकी हड्डियाँ उघाड़ देगा।” इब्रानी क्रिया יְגָרֵם दुर्लभ है और उसका ठीक भाव अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: ईश्वर
  rationale: यहाँ यह संज्ञा इस्राएल को मिस्र से निकालने वाले परमेश्वर को सूचित करती है; ‘ईश्वर’ आधुनिक मानक हिन्दी में सहज और गरिमापूर्ण है।
- source_word: מוֹצִיאוֹ מִמִּצְרַיִם
  choice: उसे मिस्र से निकाल लाता है
  rationale: कृदन्त का सजीव, वर्तमान-जैसा काव्यात्मक बल बनाए रखा गया है और एकवचन सर्वनाम को स्पष्ट किए बिना सुरक्षित रखा गया है।
- source_word: כְּתוֹעֲפֹת רְאֵם לוֹ
  choice: उसमें जंगली बैल के सींगों जैसा बल है
  rationale: दुर्बोध इब्रानी पदबंध में ऊँचे उभार अथवा सींगों से व्यक्त सामर्थ्य का बिंब है। हिन्दी में ‘सींगों जैसा बल’ पशु-बिंब और आशय दोनों को स्वाभाविक रूप से रखता है; वैकल्पिक सामान्य अर्थ पादटिप्पणी में दिया गया है।
- source_word: יֹאכַל גּוֹיִם צָרָיו
  choice: अपने विरोधी राष्ट्रों को निगल जाएगा
  rationale: ‘खाना’ युद्ध-काव्य में विनाश का रूपक है; ‘निगल जाएगा’ उस तीखे रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְעַצְמֹתֵיהֶם יְגָרֵם
  choice: उनकी हड्डियाँ चबा डालेगा
  rationale: दुर्लभ क्रिया को निगलने के पिछले बिंब के अनुरूप ‘चबा डालना’ कहा गया है, जबकि इसकी अनिश्चित सूक्ष्मता पादटिप्पणी में सुरक्षित है।
- source_word: וְחִצָּיו יִמְחָץ
  choice: अपने तीरों से उन्हें चूर कर देगा
  rationale: हिन्दी में तीरों को साधन के रूप में व्यक्त करना युद्ध-बिंब को स्पष्ट और स्वाभाविक बनाता है; क्रिया की कुचलने या चूर करने की प्रबलता बनी रहती है।
theological_decisions:
- issue: बिलाम की वाणी में एकवचन सर्वनामों का संदर्भ
  choice: ‘उसे/उसमें/अपने’ जैसे एकवचन रूप सुरक्षित रखे गए हैं और उनके संदर्भ को इससे अधिक निश्चित नहीं किया गया।
  alternative: इन रूपों को सामूहिक इस्राएल, इस्राएल के राजा अथवा भावी मसीही व्यक्ति के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ एकवचन रूपों का प्रयोग करता है, पर निकट संदर्भ सामूहिक अथवा प्रतिनिधिक अर्थ की अनुमति देता है। अनुवाद किसी एक धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण युद्ध-काव्यात्मक शैली रखी गई है। ‘निगल जाएगा’, ‘चबा डालेगा’ और ‘चूर कर देगा’ मूल के प्रबल और क्रमिक हिंसक बिंबों को बनाए रखते हैं। ‘जंगली बैल’ पारंपरिक किंतु भ्रामक ‘एक-सींग वाला पशु’ से बचता है।
