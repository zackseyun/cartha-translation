source:
  edition: WLC
  text: כִּ/נְחָלִ֣ים נִטָּ֔יוּ כְּ/גַנֹּ֖ת עֲלֵ֣י נָהָ֑ר כַּ/אֲהָלִים֙ נָטַ֣ע יְהוָ֔ה כַּ/אֲרָזִ֖ים עֲלֵי מָֽיִם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/006.yaml
  text: Like valleys they spread out[a], like gardens beside a river, like aloes that Yahweh has planted, like cedars beside the waters.
translation:
  language: hi
  text: 'वे नदी-घाटियों के समान फैले हुए हैं,

    नदी के किनारे लगे बागों के समान,

    याहवे के लगाए अगरु-वृक्षों[a] के समान,

    और जल के पास देवदारों के समान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अगर के वृक्ष” अथवा “सुगंधित अगर-काष्ठ देने वाले वृक्ष”; यहाँ इब्रानी शब्द तंबुओं को नहीं, सुगंधित वृक्षों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נְחָלִים
  choice: नदी-घाटियों
  rationale: यह शब्द पानी बहने वाली घाटी, जलधारा या वादी को सूचित कर सकता है। ‘नदी-घाटियों’ से घाटी और जल—दोनों का बिंब बना रहता है और आगे के जल-संबंधी समानांतरों से मेल बैठता है।
- source_word: נִטָּיוּ
  choice: फैले हुए हैं
  rationale: נטה का भाव फैलने, खिंचने या दूर तक विस्तृत होने का है। यहाँ यह इस्राएल के डेरे या समुदाय के विस्तृत विन्यास का स्वाभाविक वर्णन है।
- source_word: גַנֹּת
  choice: बागों
  rationale: बहुवचन का सीधा और सहज हिन्दी रूप, जो उपजाऊ तथा सुव्यवस्थित हरियाली का बिंब बनाए रखता है।
- source_word: עֲלֵי נָהָר
  choice: नदी के किनारे लगे
  rationale: על यहाँ निकटता या किनारे स्थित होने का अर्थ देता है। ‘लगे’ जोड़ने से हिन्दी में बागों की स्थिति स्वाभाविक रूप से व्यक्त होती है।
- source_word: אֲהָלִים
  choice: अगरु-वृक्षों
  rationale: काव्यात्मक प्रसंग में यह तंबुओं का नहीं, सुगंधित लकड़ी देने वाले वृक्षों का द्योतक है। ‘अगरु-वृक्ष’ हिन्दी में वनस्पति-बिंब स्पष्ट करता है; पहचान की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: נָטַע
  choice: लगाए
  rationale: क्रिया स्थापित रूप से रोप दिए जाने का भाव देती है। ‘लगाए’ आधुनिक हिन्दी में वृक्षारोपण के लिए स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; उसे किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֲרָזִים
  choice: देवदारों
  rationale: यह אֶרֶז का प्रचलित हिन्दी रूप है और ऊँचे, दृढ़ वृक्षों का काव्यात्मक बिंब बनाए रखता है।
- source_word: עֲלֵי מָיִם
  choice: जल के पास उगे
  rationale: मूल में जल के समीप होने का भाव है। ‘उगे’ हिन्दी में वृक्षों के साथ अपेक्षित क्रिया देता है, जबकि स्थान-संबंधी अर्थ सुरक्षित रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ मूल नाम का निकट लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; ‘यहोवा’ हिन्दी में प्रचलित वैकल्पिक रूप है।
translation_notes:
  register: आधुनिक, सहज और गरिमामय काव्यात्मक हिन्दी। चार समानांतर उपमाओं को अलग पंक्तियों में रखा गया है। पहले शब्द की जलधारा/घाटी संबंधी अर्थ-व्याप्ति को ‘नदी-घाटियों’ द्वारा सुरक्षित किया गया है।
