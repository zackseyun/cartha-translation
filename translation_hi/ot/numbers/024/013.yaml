id: NUM.24.13
reference: Numbers 24:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם יִתֶּן לִ֨/י בָלָ֜ק מְלֹ֣א בֵית/וֹ֮ כֶּ֣סֶף וְ/זָהָב֒ לֹ֣א אוּכַ֗ל לַ/עֲבֹר֙ אֶת פִּ֣י יְהוָ֔ה לַ/עֲשׂ֥וֹת טוֹבָ֛ה א֥וֹ רָעָ֖ה מִ/לִּבִּ֑/י אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֲדַבֵּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/013.yaml
  text: If Balak were to give me his house full of silver and gold[a], I could not go beyond the word of Yahweh, to do good or evil from my own heart. Whatever Yahweh speaks, that I will speak.
translation:
  language: hi
  text: यदि बालाक मुझे अपने घर भर चाँदी और सोना दे, तब भी मैं याहवे के वचन से आगे बढ़कर अपने मन से भला या बुरा नहीं कर सकता[a]। याहवे जो कुछ बोलेगा, वही मैं बोलूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुँह से आगे नहीं जा सकता।”
    reason: मूल इब्रानी मुहावरे में ‘वचन’ के स्थान पर ‘मुँह’ है; पादटिप्पणी उस ठोस रूपक को सुरक्षित रखती है।
lexical_decisions:
- source_word: אִם יִתֶּן
  choice: यदि ... दे, तो भी
  rationale: अपूर्ण क्रिया के साथ אִם यहाँ काल्पनिक शर्त व्यक्त करता है। ‘यदि ... दे, तो भी’ स्वाभाविक हिन्दी में इस शर्त और उससे अप्रभावित निष्कर्ष दोनों को स्पष्ट करता है।
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: अपना घर भर चाँदी और सोना
  rationale: यह चयन घर को चाँदी-सोने से भर देने की अतिशयोक्तिपूर्ण छवि को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: לֹא אוּכַל
  choice: नहीं जा सकता
  rationale: सामर्थ्य सूचक क्रिया को काल्पनिक शर्त के निष्कर्ष में हिन्दी के स्वाभाविक ‘नहीं ... सकता’ से व्यक्त किया गया है।
- source_word: לַעֲבֹר אֶת־פִּי יְהוָה
  choice: याहवे के वचन से आगे नहीं जा सकता
  rationale: इब्रानी में शाब्दिक रूप से ‘याहवे के मुँह से आगे जाना’ है। मुख्य पाठ में ‘वचन’ अर्थ को स्पष्ट रखता है और ‘आगे जाना’ मूल रूपक को सुरक्षित रखता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में Yahweh के रूप में लिप्यंतरित किया गया है।
- source_word: לַעֲשׂוֹת טוֹבָה אוֹ רָעָה
  choice: भला या बुरा करने के लिए
  rationale: यह मूल की नैतिक अथवा परिणामगत द्विध्रुवता को बिना किसी अतिरिक्त व्याख्या के सीधे व्यक्त करता है।
- source_word: מִלִּבִּי
  choice: अपने मन से
  rationale: इब्रानी ‘मेरे हृदय से’ यहाँ बिलाम की अपनी इच्छा या पहल का स्रोत बताता है। आधुनिक हिन्दी में ‘अपने मन से’ यही अर्थ स्वाभाविक रूप से देता है।
- source_word: אֲשֶׁר יְדַבֵּר יְהוָה אֹתוֹ אֲדַבֵּר
  choice: याहवे जो कुछ बोलेगा, वही मैं बोलूँगा
  rationale: ‘जो कुछ ... वही’ मूल की संबंधवाचक और पुनरुक्त संरचना को स्पष्ट हिन्दी में बनाए रखता है; दोनों इब्रानी क्रियाओं के लिए ‘बोलना’ रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: बिलाम की सीमा का आशय
  choice: वह अपने मन से भला या बुरा करने के लिए याहवे के वचन से आगे नहीं जा सकता
  alternative: वह केवल आशीष या शाप से संबंधित आज्ञा को नहीं बदल सकता
  rationale: पद स्वयं ‘भला या बुरा’ और ‘अपने मन से’ कहकर कथन को कुछ व्यापक रखता है। अनुवाद तत्काल प्रसंग से आगे कोई व्यापक भविष्यवाणी-सिद्धांत आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर लहजा गरिमापूर्ण और मौखिक कथन के अनुकूल रखा गया है। ‘अपना घर भर’ और ‘अपने मन से’ सामान्य पाठक के लिए सहज हैं; ‘याहवे’ मूल के व्यक्तिगत ईश्वरीय नाम को दर्शाता है।
