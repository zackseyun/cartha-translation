  text: וְ/צִים֙ מִ/יַּ֣ד כִּתִּ֔ים וְ/עִנּ֥וּ אַשּׁ֖וּר וְ/עִנּוּ עֵ֑בֶר וְ/גַם ה֖וּא עֲדֵ֥י אֹבֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/024.yaml
  text: But ships shall come from the coast of Kittim[a], and they shall afflict Asshur, and they shall afflict Eber[d][c][b]; and he too shall come to destruction.
translation:
  language: hi
  text: पर कित्तीम[a] के तट से जहाज़ आएँगे; वे अश्शूर[b] को सताएँगे और एबेर[c] को भी सताएँगे; और वह भी विनाश को प्राप्त होगा[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कित्तीम विशेष रूप से साइप्रस या अधिक व्यापक रूप से पश्चिम के समुद्री लोगों को सूचित कर सकता है।
    reason: alternative_reading
  - marker: b
    text: अश्शूर का अनुवाद ‘असीरिया’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: एबेर किसी जन-समूह के नाम, इब्रानियों, या किसी सीमा—जैसे फरात नदी—के ‘पार’ रहने वाले लोगों को सूचित कर सकता है।
    reason: alternative_reading
  - marker: d
    text: इब्रानी में ‘और वह भी’ है। यह ‘वह’ किसके लिए है, स्पष्ट नहीं; कुछ लोग इसे सामूहिक अर्थ में ‘वह शक्ति भी’ या कित्तीम की शक्ति का प्रतिनिधित्व करने वाले किसी शासक के लिए समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: צִים
  choice: जहाज़
  rationale: यह शब्द समुद्री जलयानों को दर्शाता है। ‘जहाज़’ सहज और व्यापक है; ‘बेड़ा’ अनावश्यक रूप से सामूहिक अर्थ जोड़ सकता है।
- source_word: מִיַּד
  choice: के तट से
  rationale: शाब्दिक अर्थ ‘के हाथ से’ है, पर भौगोलिक प्रयोग में यह किसी स्थान की ओर, किनारे या क्षेत्र को सूचित कर सकता है। जहाज़ों के संदर्भ में ‘के तट से’ स्वाभाविक है।
- source_word: כִּתִּים
  choice: कित्तीम
  rationale: मूल के नाम को बनाए रखने से कुप्रुस अथवा व्यापक पश्चिमी समुद्री लोगों के बीच की संदिग्ध पहचान का निर्णय अनुवाद में नहीं थोपा जाता।
- source_word: וְעִנּוּ
  choice: दुःख देंगे
  rationale: पिएल रूप का अर्थ दुःख देना, दीन करना या सताना हो सकता है। ‘दुःख देंगे’ अर्थ की व्यापकता बनाए रखते हुए साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: नाम का लिप्यंतरण मूल रूप तथा भूमि या लोगों के बीच की संभावित अस्पष्टता को बनाए रखता है; ‘असीरिया’ व्याख्यात्मक विकल्प है।
- source_word: עֵבֶר
  choice: एबेर
  rationale: नाम का लिप्यंतरण किसी व्यक्ति-सम्बद्ध जन, इब्रानियों अथवा सीमा के पार के लोगों में से किसी एक पहचान को निश्चित नहीं करता।
- source_word: וְגַם הוּא
  choice: और वह भी
  rationale: इब्रानी में सर्वनाम पुल्लिंग एकवचन है। ‘वह भी’ उसकी व्याकरणिक संख्या को बनाए रखता है, जबकि उसका पूर्वपद अस्पष्ट रहने देता है।
- source_word: עֲדֵי אֹבֵד
  choice: विनाश को प्राप्त होगा
  rationale: यह विनाश या नाश तक पहुँचने का परिणाम व्यक्त करता है। यह अनन्त विनाश या पूर्णतः मिट जाने जैसी अधिक प्रबल धारणाएँ नहीं जोड़ता।
theological_decisions:
- issue: कित्तीम, अश्शूर, एबेर और अंतिम एकवचन सर्वनाम की पहचान
  choice: इब्रानी नामों को बनाए रखा गया है और अंतिम सर्वनाम को एकवचन ‘वह’ रखा गया है, बिना किसी ऐतिहासिक पात्र को निश्चित किए।
  alternative: कित्तीम को कुप्रुस या पश्चिमी समुद्री शक्तियाँ, अश्शूर को असीरिया, एबेर को इब्रानी अथवा फरात के पार के लोग, और अंतिम ‘वह’ को कित्तीम, उसके शासक या किसी अन्य साम्राज्य के रूप में समझा जा सकता है।
  rationale: यह भविष्यवाणी ऐतिहासिक रूप से विवादित है। मूल पाठ जिन पहचानों को स्पष्ट नहीं करता, अनुवाद भी उन्हें निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुबोध रखी गई है। व्यक्तिवाचक नामों का लिप्यंतरण मूल की ऐतिहासिक अस्पष्टता बचाता है; वाक्य की भविष्यसूचक लय के लिए भविष्यकाल और समानांतर खंड बनाए गए हैं।
