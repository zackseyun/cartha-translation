  text: מַה טֹּ֥בוּ אֹהָלֶ֖י/ךָ יַעֲקֹ֑ב מִשְׁכְּנֹתֶ֖י/ךָ יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/005.yaml
  text: How good are your tents[a], O Jacob, your dwellings, O Israel!
translation:
  language: hi
  text: हे याकूब, तेरे तंबू कितने अच्छे हैं[a], हे इस्राएल, तेरे निवास-स्थान कितने अच्छे हैं!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अच्छे’ का अनुवाद ‘सुहावने’, ‘मनभावने’ या ‘सुंदर’ भी हो सकता है। इब्रानी उद्गार गहरी प्रशंसा व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה
  choice: कितने
  rationale: यहाँ מַה प्रश्न नहीं, बल्कि प्रशंसा और विस्मय प्रकट करने वाला उद्गार है; हिंदी में ‘कितने … हैं’ इसका स्वाभाविक काव्यात्मक रूप है।
- source_word: טֹּבוּ
  choice: सुहावने / मनोहर
  rationale: טוֹב यहाँ अच्छे, सुखद और सुंदर होने का व्यापक भाव रखता है। समानांतर पंक्तियों में ‘सुहावने’ और ‘मनोहर’ स्वाभाविक हिंदी देते हुए प्रशंसात्मक अर्थ को व्यक्त करते हैं; पादटिप्पणी मूल शब्द की व्यापकता बताती है।
- source_word: אֹהָלֶיךָ
  choice: तेरे तंबू
  rationale: אֹהֶל का सामान्य अर्थ ‘तंबू’ है और प्रसंग में इस्राएल की छावनी दिखाई दे रही है; उपासना-स्थान का अर्थ थोपना उचित नहीं।
- source_word: יַעֲקֹב
  choice: याकूब
  rationale: व्यक्तिवाचक/सामूहिक नाम का प्रचलित हिंदी लिप्यंतरण; यहाँ यह इस्राएल की प्रजा का काव्यात्मक संबोधन है।
- source_word: מִשְׁכְּנֹתֶיךָ
  choice: तेरे निवास-स्थान
  rationale: מִשְׁכָּן निवास या रहने के स्थान को दर्शाता है। ‘निवास-स्थान’ पहली पंक्ति के ‘तंबू’ से समानांतरता बनाए रखता है, पर दोनों शब्दों को एक नहीं करता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: नाम का प्रचलित आधुनिक हिंदी रूप; ‘याकूब’ के समानांतर यह वाचा की प्रजा को संबोधित करता है।
theological_decisions:
- issue: क्या पारंपरिक उपासना-संबंधी ‘तंबू/तंबू-निवास’ भाषा अपनाई जाए
  choice: साधारण आवास के अर्थ में ‘तंबू’ और ‘निवास-स्थान’
  alternative: ऐसी शब्दावली जो विशेष रूप से पवित्र निवास या उपासना-स्थान का संकेत दे
  rationale: प्रसंग इस्राएल की छावनी और उसके रहने के स्थानों का है, किसी विशिष्ट पवित्रस्थान का नहीं। इसलिए मूल के आवास-संबंधी सामान्य अर्थ को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी; काव्यात्मक समानांतरता तथा संबोधन सुरक्षित रखे गए हैं। ‘हे’ और विस्मयादिबोधक चिह्न मूल के प्रशंसात्मक उद्गार को व्यक्त करते हैं।
