base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/002.yaml
  text: Then Balaam lifted up his eyes and saw Israel dwelling according to its tribes[b][a], and the Spirit of God came upon him.
translation:
  language: hi
  text: तब बिलाम ने अपनी आँखें उठाईं और इस्राएल को उसके गोत्रों के अनुसार बसे हुए देखा[a]। परमेश्वर का आत्मा उस पर आया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके गोत्रों के अनुसार डेरे डाले हुए,” अथवा “गोत्र-गोत्र के अनुसार।”
    reason: इब्रानी कृदन्त और לִשְׁבָטָיו बसे होने तथा गोत्रवार छावनी की व्यवस्था—दोनों भाव व्यक्त कर सकते हैं।
  - marker: b
    text: या, “परमेश्वर का आत्मा उस पर था।”
    reason: וַתְּהִי עָלָיו को आगमन के भाव में ‘उस पर आया’ या अवस्थात्मक रूप में ‘उस पर था’ समझा जा सकता है।
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת־עֵינָיו
  choice: अपनी आँखें उठाईं
  rationale: इब्रानी मुहावरे के स्पष्ट अंग ‘अपनी आँखें’ को बनाए रखते हुए स्वाभाविक हिन्दी अभिव्यक्ति दी गई है।
- source_word: וַיַּרְא
  choice: देखा
  rationale: यह क्रिया बिलाम द्वारा सामने का दृश्य देखने को सीधे व्यक्त करती है।
- source_word: שֹׁכֵן
  choice: बसा हुआ
  rationale: कृदन्त रूप इस्राएल की व्यवस्थित छावनी में स्थित अवस्था बताता है; ‘बसा हुआ’ उस अवस्था को व्यक्त करता है, बिना अनावश्यक सैनिक अर्थ जोड़े।
- source_word: לִשְׁבָטָיו
  choice: अपने गोत्रों के अनुसार
  rationale: यहाँ ל व्यवस्था या विभाजन का बोध कराता है; वाक्यांश इस्राएल के गोत्रवार बसे होने को स्पष्ट करता है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: भविष्यवाणी के प्रसंग में यह पद परमेश्वर के आत्मा को सूचित करता है। हिन्दी में ‘आत्मा’ पुल्लिंग है, इसलिए ‘का’ प्रयुक्त हुआ है।
- source_word: וַתְּהִי עָלָיו
  choice: उस पर आया
  rationale: शाब्दिक ‘उस पर हुआ’ अस्वाभाविक हिन्दी है; ‘उस पर आया’ भविष्यवाणी के लिए सामर्थ्य देने वाली उपस्थिति के आरम्भिक भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: भविष्यवाणी के प्रसंग में רוּחַ אֱלֹהִים का अनुवाद
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर का आत्मा उस पर था
  rationale: मुख्य पाठ में दिव्य आत्मा द्वारा भविष्यवाणी के लिए सामर्थ्य दिए जाने का प्रसंगगत अर्थ रखा गया है, पर पादटिप्पणी इब्रानी क्रिया की अधिक स्थिर अवस्थात्मक समझ को भी सुरक्षित रखती है। इससे बाद की किसी विशिष्ट सिद्धान्तगत व्याख्या को पाठ पर नहीं थोपा जाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘अपनी आँखें उठाईं’ मूल इब्रानी मुहावरे को सुरक्षित रखता है, जबकि ‘बसा हुआ’ सामान्य पाठक के लिए सहज है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के ठीक बाद रखे गए हैं।
