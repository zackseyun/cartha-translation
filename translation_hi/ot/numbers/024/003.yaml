source:
  edition: WLC
  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/003.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened.”'
translation:
  language: hi
  text: 'तब उसने अपना काव्य-वचन सुनाया और कहा:


    “बओर के पुत्र बिलाम की वाणी,


    उस पुरुष की वाणी जिसकी आँख बंद है[a]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी आँख खुली हुई है।” भविष्यदर्शी दर्शन के प्रसंग और प्राचीन व्याख्यात्मक परंपरा के आधार पर कुछ लोग इस वाक्यांश को इस अर्थ में समझते हैं, पर इब्रानी रूप अधिक सीधे तौर पर “बंद” या “मुँदी हुई” का संकेत देता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: तब उसने अपना काव्य-वचन आरम्भ किया
  rationale: यह इब्रानी मुहावरा किसी औपचारिक, प्रायः काव्यात्मक कथन को प्रस्तुत करने के लिए प्रयुक्त होता है। ‘काव्य-वचन आरम्भ किया’ मूल बिंब और प्रसंग की काव्यात्मकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: यह אָמַר का सामान्य कथात्मक रूप है; ‘और कहा’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: נְאֻם
  choice: की वाणी
  rationale: נְאֻם औपचारिक अथवा भविष्यद्वक्तापूर्ण कथन की भूमिका बाँधता है। ‘वाणी’ हिन्दी बाइबलीय शैली में गरिमापूर्ण और बोधगम्य है तथा दोनों समानांतर पंक्तियों की लय बनाए रखता है।
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: बओर के पुत्र बिलाम
  rationale: यह वंश-संबंध बताने वाली रचना है; नामों का रूप मूल उच्चारण के निकट रखा गया है।
- source_word: הַגֶּבֶר
  choice: उस पुरुष
  rationale: गֶּבֶר यहाँ एक पुरुष के औपचारिक आत्म-वर्णन में आया है। ‘उस पुरुष’ स्पष्ट और स्वाभाविक है।
- source_word: שְׁתֻם הָעָיִן
  choice: जिसकी आँख बंद है
  rationale: शब्द के इब्रानी रूप का अधिक सीधा अर्थ ‘बंद’ या ‘मुँदी हुई’ है। वाक्यांश कठिन और विवादित होने के कारण ‘खुली हुई’ अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: बिलाम के दर्शन-संबंधी वर्णन שְׁתֻם הָעָיִן का अर्थ
  choice: जिसकी आँख बंद है
  alternative: जिसकी आँख खुली हुई है
  rationale: मसोरेटिक इब्रानी रूप अधिक सीधे तौर पर ‘बंद’ या ‘मुँदी हुई’ का संकेत देता है। प्रसंग और प्राचीन व्याख्यात्मक परंपरा के आधार पर ‘खुली हुई’ भी समझा गया है; इसलिए मूल-पाठ की कठिनता को मिटाए बिना वह विकल्प पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। समानांतर इब्रानी संरचना को ‘की वाणी’ की पुनरावृत्ति से सुरक्षित रखा गया है, और विवादित अंतिम वाक्यांश की अस्पष्टता पाद-टिप्पणी में स्पष्ट की गई है।
