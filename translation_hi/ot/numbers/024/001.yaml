language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣רְא בִּלְעָ֗ם כִּ֣י ט֞וֹב בְּ/עֵינֵ֤י יְהוָה֙ לְ/בָרֵ֣ךְ אֶת יִשְׂרָאֵ֔ל וְ/לֹא הָלַ֥ךְ כְּ/פַֽעַם בְּ/פַ֖עַם לִ/קְרַ֣את נְחָשִׁ֑ים וַ/יָּ֥שֶׁת אֶל הַ/מִּדְבָּ֖ר פָּנָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/001.yaml
  text: When Balaam saw that it was good in the eyes of Yahweh to bless Israel[a], he did not go, as at other times, to seek omens, but set his face toward the wilderness.
translation:
  language: hi
  text: जब बिलाम ने देखा कि इस्राएल को आशीष देना याहवे की दृष्टि में अच्छा था, तो वह पहले की तरह शकुन ढूँढ़ने[a] नहीं गया, बल्कि उसने अपना मुख वीराने की ओर किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शकुनों से मिलने” अथवा “भविष्यवाणी के संकेतों का सामना करने।” इब्रानी अभिव्यक्ति बिलाम की पहले की उस प्रथा की ओर संकेत करती है जिसमें वह शकुन-संकेत खोजता था।
    reason: לִקְרַאת נְחָשִׁים की शाब्दिक रचना (‘शकुनों से मिलने/सामना करने’) और प्रसंगगत अर्थ (‘शकुन ढूँढ़ने’) दोनों को दिखाने के लिए।
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: ראה का मूल अर्थ ‘देखना’ है; यहाँ इससे बिलाम के समझ लेने का भाव भी निकलता है। ‘देखा’ इब्रानी अभिव्यक्ति को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: כִּי טוֹב בְּעֵינֵי יְהוָה
  choice: कि … याहवे की दृष्टि में अच्छा है
  rationale: ‘आँखों में अच्छा’ का आशय प्रसन्न करने वाला या स्वीकार्य होना है। ‘दृष्टि में अच्छा’ मूल बिंब और अर्थ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत् लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: לְבָרֵךְ
  choice: आशीष देना
  rationale: ברך के साधारण अर्थ को इस प्रसंग में सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּפַעַם בְּפַעַם
  choice: पहले की तरह
  rationale: शाब्दिक पुनरावृत्तिमूलक अभिव्यक्ति पूर्व अवसरों पर बार-बार अपनाई गई रीति की ओर संकेत करती है; ‘पहले की तरह’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לִקְרַאת נְחָשִׁים
  choice: शकुन ढूँढ़ने
  rationale: נְחָשִׁים यहाँ साँपों को नहीं, भावी घटना जानने के लिए खोजे जाने वाले शकुनों या दैवी संकेतों को दर्शाता है। לִקְרַאת का मूल भाव ‘सामना करने/मिलने जाना’ है, पर प्रसंग में उद्देश्यपूर्ण खोज निहित है।
- source_word: וַיָּשֶׁת ... פָּנָיו
  choice: उसने अपना मुख … की ओर किया
  rationale: यह जानबूझकर किसी दिशा की ओर उन्मुख होने का इब्रानी मुहावरा है। हिन्दी अभिव्यक्ति मूल बिंब को बनाए रखती है।
- source_word: אֶל הַמִּדְבָּר
  choice: वीराने की ओर
  rationale: מִדְבָּר निर्जन, वन्य या मरुस्थलीय भूभाग को दर्शाता है। ‘वीराना’ इस प्रसंग में निर्जन भूभाग का अर्थ देता है और केवल घने वन का भ्रम उत्पन्न नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: बिलाम की पूर्व क्रिया का स्वरूप
  choice: शकुन ढूँढ़ने
  alternative: टोना करने; शकुनों से मिलने
  rationale: पाठ बिलाम की भविष्य-सूचक संकेत खोजने की प्रथा बताता है। अनुवाद इसे सामान्य ‘जादू-टोना’ तक विस्तृत नहीं करता और न ही अस्वाभाविक शाब्दिक रूप अपनाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘याहवे की दृष्टि में अच्छा’ और ‘अपना मुख … की ओर किया’ जैसे मूल इब्रानी बिंब सुरक्षित रखे गए हैं, जबकि ‘पहले की तरह’ और ‘शकुन ढूँढ़ने’ को स्वाभाविक हिन्दी मुहावरे में व्यक्त किया गया है।
