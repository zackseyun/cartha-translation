  yaml_path: translation/ot/numbers/024/019.yaml
  text: And one shall rule from Jacob[b][a], and he shall destroy the survivor from the city.
translation:
  language: hi
  text: 'और याकूब में से एक शासन करेगा,[a]

    और वह नगर से बचे हुए व्यक्ति को नष्ट कर देगा।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याकूब में से वह प्रभुत्व रखेगा।” इब्रानी क्रिया का अर्थ “शासन करना” या “प्रभुत्व रखना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “और वह नगर से बचे हुए जन को नष्ट कर देगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵרְדְּ
  choice: और ... एक शासन करेगा
  rationale: यह क्रिया רדה से है और यहाँ ‘शासन करना/प्रभुत्व रखना’ अर्थ देती है। इब्रानी में कर्ता स्पष्ट नहीं है, इसलिए संदर्भ में पहले उल्लिखित राजकीय व्यक्ति की ओर संकेत करते हुए ‘एक’ रखा गया है।
- source_word: מִיַּעֲקֹב
  choice: याकूब में से
  rationale: מן उद्गम या स्रोत बताता है। ‘याकूब में से’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है कि शासक याकूब/इस्राएल से निकलेगा।
- source_word: וְהֶאֱבִיד
  choice: और वह ... नष्ट कर देगा
  rationale: אבד के हिफ़ईल रूप का अर्थ किसी को मिटा देना या नाश कर देना है। यह चयन मूल की तीव्रता को स्पष्ट और सीधी हिन्दी में रखता है।
- source_word: שָׂרִיד
  choice: बचे हुए जन
  rationale: यह शब्द बचे हुए या जीवित रह गए व्यक्ति को सूचित करता है और एकवचन में सामूहिक अर्थ भी रख सकता है। ‘बचे हुए जन’ हिन्दी में उस सामूहिक संभावना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעִיר
  choice: नगर के
  rationale: עִיר का सामान्य अर्थ ‘नगर’ है। מן को यहाँ उस नगर से संबद्ध शेष जन के भाव में ‘नगर के’ कहना अधिक स्वाभाविक है; ‘गढ़वाला नगर’ जैसी अतिरिक्त विशिष्टता मूल में नहीं है।
theological_decisions:
- issue: बिलाम की भविष्यवाणी में राजकीय/मसीहाई संकेत
  choice: पद को सामान्य राजकीय भाषा में रखा गया है और आने वाले शासक की पहचान स्पष्ट रूप से मसीह के रूप में नहीं की गई।
  alternative: इसे केवल किसी निकट ऐतिहासिक राजा या सीधे मसीह की भविष्यवाणी के रूप में स्पष्ट करना।
  rationale: व्यापक भविष्यवाणी में यह व्यक्ति राजकीय है और उसका मसीहाई अर्थ समझा जा सकता है, पर इस पद में उसकी पहचान सीधे नहीं दी गई। सामान्य भाषा मूल की धार्मिक-अर्थगत गुंजाइश और तनाव बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण भविष्यवाणी-काव्य शैली रखी गई है। ‘याकूब में से’ उद्गम का भाव और ‘एक’ इब्रानी के अनिर्दिष्ट कर्ता को बिना अधिक व्याख्या के प्रकट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
