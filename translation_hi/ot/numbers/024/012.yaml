  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दूत’ सामान्य पाठक के लिए स्वाभाविक है और इस संदर्भ में मानव संदेशवाहकों को दर्शाता है। वाक्य के अंत में द्विबिंदु अगले पद में जारी प्रत्यक्ष कथन को संकेत करता है।
