base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/012.yaml
  text: Balaam said to Balak[a], “Did I not also speak to your messengers whom you sent to me[b], saying,”
translation:
  language: hi
  text: बिलाम ने बालाक से कहा, “क्या मैंने तुम्हारे दूतों[a] से भी, जिन्हें तुमने मेरे पास भेजा था, नहीं कहा था:[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दूत’ के लिए प्रयुक्त इब्रानी शब्द दूसरे संदर्भों में ‘स्वर्गदूत’ का अर्थ भी दे सकता है; यहाँ प्रसंग में मानव दूत अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ आरम्भ हुआ उद्धरण अगले पद में जारी रहता है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... कहा
  rationale: यह אָמַר का सामान्य कथात्मक रूप है और सीधे कथन का परिचय देता है; आधुनिक हिन्दी में ‘ने ... कहा’ स्वाभाविक है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶל בָּלָק
  choice: बालाक से
  rationale: אֶל यहाँ कथन के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘से कहा’ स्वाभाविक संरचना है।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: नकारात्मक प्रश्न सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी में ‘क्या ... नहीं’ उसी कथन-बल को बनाए रखता है।
- source_word: גַּם
  choice: भी
  rationale: यह जोड़ और बल व्यक्त करता है कि बिलाम ने बालाक के दूतों से भी पहले ही यह बात कही थी।
- source_word: מַלְאָכֶיךָ
  choice: तुम्हारे ... दूतों
  rationale: מַלְאָךְ का अर्थ संदर्भानुसार संदेशवाहक अथवा स्वर्गदूत हो सकता है; यहाँ बालाक द्वारा भेजे गए मानव प्रतिनिधि अभिप्रेत हैं, इसलिए ‘दूत’ उपयुक्त है।
- source_word: אֲשֶׁר שָׁלַחְתָּ אֵלַי
  choice: जिन्हें तुमने मेरे पास भेजा था
  rationale: यह संबंधवाचक उपवाक्य दूतों को निर्दिष्ट करता है; पूर्ण क्रिया का पूर्वकालिक भाव ‘भेजा था’ से स्पष्ट होता है।
- source_word: דִּבַּרְתִּי לֵאמֹר
  choice: 'यह नहीं कहा था:'
  rationale: דִּבַּרְתִּי भूतकाल में बिलाम के पहले कथन की ओर लौटता है और לֵאמֹר अगले पद में आने वाले उद्धरण का परिचय देता है। हिन्दी में ‘यह ... कहा था:’ उद्धरण की निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
