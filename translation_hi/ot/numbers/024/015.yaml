  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר נְאֻ֤ם בִּלְעָם֙ בְּנ֣/וֹ בְעֹ֔ר וּ/נְאֻ֥ם הַ/גֶּ֖בֶר שְׁתֻ֥ם הָ/עָֽיִן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/015.yaml
  text: 'Then he took up his discourse and said: “The declaration of Balaam son of Beor[a], the declaration of the man whose eye is opened:”'
translation:
  language: hi
  text: 'तब उसने अपना काव्य-वचन प्रस्तुत किया और कहा:


    “बओर के पुत्र बिलाम की घोषणा,


    उस पुरुष की घोषणा जिसकी आँख खुली हुई है:[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसकी आँख बंद है।” इब्रानी पद कठिन है और इसे एक से अधिक प्रकार से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: तब उसने अपना काव्य-वचन आरम्भ किया
  rationale: यह इब्रानी मुहावरा औपचारिक काव्यात्मक कथन प्रस्तुत करता है। ‘काव्य-वचन आरम्भ किया’ आधुनिक हिन्दी में स्वाभाविक है और מָשָׁל को केवल ‘दृष्टान्त’ मानने से बचता है।
- source_word: וַיֹּאמַר
  choice: और कहा
  rationale: उद्धृत वचन का परिचय देने वाली सामान्य आख्यानात्मक अभिव्यक्ति।
- source_word: נְאֻם
  choice: घोषणा
  rationale: यह गंभीर और अधिकारपूर्ण भविष्यद्वक्तापरक कथन का सूत्र है; दोनों प्रयोगों में एक ही अनुवाद रखा गया है।
- source_word: בִּלְעָם בְּנוֹ בְעֹר
  choice: बओर के पुत्र बिलाम
  rationale: व्यक्तिनामों का मानक हिन्दी लिप्यंतरण और पितृनाम-संबंध की स्वाभाविक अभिव्यक्ति।
- source_word: הַגֶּבֶר
  choice: उस पुरुष
  rationale: גֶּבֶר यहाँ पुरुष व्यक्ति को सूचित करता है; ‘पुरुष’ औपचारिक काव्यात्मक शैली के अनुकूल है।
- source_word: שְׁתֻם הָעָיִן
  choice: जिसकी आँख खुली हुई है
  rationale: संदर्भ में यह दिव्य दर्शन ग्रहण करने की क्षमता की ओर संकेत करता प्रतीत होता है, पर इब्रानी पद कठिन है; ‘बन्द’ वाला अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: बिलाम के आत्मवर्णन שְׁתֻם הָעָיִן का अर्थ
  choice: जिसकी आँख खुली हुई है
  alternative: जिसकी आँख बन्द है
  rationale: अगले पद में दिव्य दर्शन और खुली आँखों का संदर्भ ‘खुली’ अर्थ का समर्थन करता है। फिर भी शब्दरूप विवादित होने के कारण वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है, ताकि वास्तविक अस्पष्टता समाप्त न हो।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक-भविष्यद्वक्तापरक शैली रखी गई है। ‘काव्य-वचन’ मָשָׁל की व्यापक काव्यात्मक प्रकृति बताता है, जबकि ‘घोषणा’ נְאֻם की औपचारिक शक्ति को व्यक्त करती है।
