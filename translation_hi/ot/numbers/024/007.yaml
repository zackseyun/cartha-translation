  text: יִֽזַּל מַ֨יִם֙ מִ/דָּ֣לְיָ֔/ו וְ/זַרְע֖/וֹ בְּ/מַ֣יִם רַבִּ֑ים וְ/יָרֹ֤ם מֵֽ/אֲגַג֙ מַלְכּ֔/וֹ וְ/תִנַּשֵּׂ֖א מַלְכֻתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/007.yaml
  text: Water will flow from his buckets[a], and his seed will be in abundant waters; his king will be higher than Agag[b], and his kingdom will be exalted.
translation:
  language: hi
  text: उसकी बाल्टियों से पानी बहेगा[a], और उसका बीज[b] प्रचुर जल में होगा; उसका राजा अगाग से ऊँचा होगा, और उसका राज्य ऊँचा उठेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “उसकी डालियों से,” यदि इस संज्ञा को उसके सामान्य अर्थ “बाल्टियाँ” के बजाय रूपक के रूप में समझा जाए।
    reason: lexical_alternative
  - marker: b
    text: “बीज” का अर्थ “संतान” या “वंशज” भी हो सकता है; हिब्रू शब्द संतान-वृद्धि और उर्वरता, दोनों की छवि जगा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִזַּל
  choice: बहेगा
  rationale: क्रिया तरल पदार्थ के बहने या टपकने को व्यक्त करती है; प्रचुरता के संदर्भ में ‘बहेगा’ स्वाभाविक है और ढंग को अनावश्यक रूप से सीमित नहीं करता।
- source_word: מִדָּלְיוֹ
  choice: उसकी बाल्टियों से
  rationale: דְּלִי का सामान्य अर्थ पानी खींचने की बाल्टी है। वैकल्पिक रूपक ‘डालियों’ को पादटिप्पणी में रखा गया है।
- source_word: וְזַרְעוֹ
  choice: और उसका बीज
  rationale: זֶרַע वास्तविक बीज और संतान/वंशज दोनों का बोध करा सकता है। ‘बीज’ काव्यात्मक द्विअर्थता को बनाए रखता है।
- source_word: בְּמַיִם רַבִּים
  choice: बहुत जल में
  rationale: यह हिब्रू पूर्वसर्ग और बहुवचन जल-छवि का निकट अनुवाद है तथा प्रचुर जल के बीच फलने-फूलने का भाव देता है।
- source_word: וְיָרֹם מֵאֲגַג מַלְכּוֹ
  choice: उसका राजा अगाग से ऊँचा होगा
  rationale: רוּם के साथ מִן तुलना व्यक्त करता है; इसलिए ‘अगाग से ऊँचा’ अर्थ और काव्यात्मक समानांतरता दोनों को सुरक्षित रखता है।
- source_word: וְתִנַּשֵּׂא מַלְכֻתוֹ
  choice: और उसका राज्य ऊँचा उठाया जाएगा
  rationale: निफ़अल रूप ऊँचा उठाए जाने या प्रतिष्ठित होने का भाव देता है। यह पूर्ववर्ती ‘ऊँचा होगा’ से संबंधित रहते हुए अलग क्रिया की छवि बनाए रखता है।
theological_decisions:
- issue: ‘उसका बीज’ का आशय
  choice: ‘बीज’ रखा गया, जिससे कृषि-उर्वरता और संतान/वंशज दोनों अर्थ संभव रहें।
  alternative: ‘उसकी संतान’ या ‘उसके वंशज’
  rationale: हिब्रू זֶרַע की वास्तविक द्विअर्थता को केवल एक अर्थ तक सीमित करना उचित नहीं है।
- issue: ‘उसका राजा’ की पहचान
  choice: राजा की कोई विशिष्ट पहचान मुख्य पाठ में नहीं दी गई।
  alternative: शाऊल, दाऊद, मसीहा या भावी इस्राएली राजतंत्र का स्पष्ट उल्लेख
  rationale: वचन स्वयं राजा की पहचान स्पष्ट नहीं करता; इसलिए बाद की ऐतिहासिक या मसीही व्याख्या को अनुवाद में आरोपित नहीं किया गया।
- issue: अगाग का स्वरूप
  choice: अगाग को व्यक्तिवाचक नाम के रूप में रखा गया।
  alternative: इसे अमालेकी राजाओं की उपाधि मानकर सामान्यीकृत करना
  rationale: हिब्रू पाठ में אֲגַג नाम स्पष्ट रूप से उपस्थित है; यह पद नहीं बताता कि यहाँ व्यक्तिगत नाम है या राजकीय उपाधि।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘बहुत जल’ सामान्य गद्य की अपेक्षा कुछ अधिक शाब्दिक और काव्यात्मक है, पर मूल की बहुवचन जल-छवि को सुरक्षित रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
