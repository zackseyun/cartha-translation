base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/009.yaml
  text: He crouched[a], he lay down like a lion, and like a lioness—who will rouse him? Those who bless you are blessed[b], and those who curse you are cursed.
translation:
  language: hi
  text: 'वह सिंह की तरह झुककर लेट गया,

    और सिंहनी की तरह[b]—कौन उसे उठाएगा?


    जो तुझे आशीष देते हैं, वे धन्य हैं[a],

    और जो तुझे शाप देते हैं, वे शापित हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह आशीष और शाप की भाषा उत्पत्ति 12:3 और उत्पत्ति 27:29 की प्रतिध्वनि करती है।
    reason: cross_reference
  - marker: b
    text: या, “बलवान सिंह की तरह।” इब्रानी शब्द एक शक्तिशाली या परिपक्व सिंह का संकेत भी दे सकता है; “सिंहनी” पहले प्रयुक्त “सिंह” शब्द से भेद बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרַע
  choice: झुका
  rationale: क्रिया का अर्थ नीचे झुकना या दुबकना है। सिंह की समानता और अगली क्रिया ‘लेट गया’ के साथ ‘झुका’ विश्राम के लिए नीचे होने की मुद्रा व्यक्त करता है, न कि आराधना या अधीनता।
- source_word: שָׁכַב
  choice: लेट गया
  rationale: यह लेटने की सामान्य क्रिया है और सिंह के विश्राम में बैठ जाने की क्रमिक काव्यात्मक छवि को स्वाभाविक हिन्दी में रखती है।
- source_word: כַּאֲרִי
  choice: सिंह के समान
  rationale: כ उपसर्ग की स्पष्ट उपमा और אֲרִי के सामान्य अर्थ को सीधे बनाए रखता है।
- source_word: וּכְלָבִיא
  choice: और सिंहनी के समान
  rationale: לָבִיא बलवान या परिपक्व सिंह को भी सूचित कर सकता है; ‘सिंहनी’ पहले प्रयुक्त אֲרִי से शब्दगत भेद बनाए रखती है। वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מִי יְקִימֶנּוּ
  choice: कौन उसे उठाएगा?
  rationale: हिफ़ील रूप का मूल भाव ‘उठाना/खड़ा करना’ है। विश्रामरत सिंह के संदर्भ में इसमें जगाने या उकसाने का भाव भी है; ‘उठाएगा’ स्रोत की व्यापकता को सुरक्षित रखता है।
- source_word: מְבָרֲכֶיךָ בָרוּךְ
  choice: जो तुझे आशीष देते हैं, वे आशीषित हैं
  rationale: कर्ता-वाचक कृदन्त और द्वितीय पुरुष एकवचन प्रत्यय को स्वाभाविक हिन्दी संबंधवाचक वाक्यांश में रखा गया है; विधेय विशेषण को घोषणात्मक रूप में अनूदित किया गया है।
- source_word: וְאֹרְרֶיךָ אָרוּר
  choice: और जो तुझे शाप देते हैं, वे शापित हैं
  rationale: आशीष वाले समानांतर पद की संरचना तथा आशीष और शाप का स्पष्ट विरोध सुरक्षित रहता है।
theological_decisions:
- issue: ‘जो तुझे आशीष देते हैं... जो तुझे शाप देते हैं’ में द्वितीय पुरुष का संदर्भ
  choice: एकवचन ‘तुझे’ रखकर इस्राएल/याकूब के प्रतिनिधिक-सामूहिक संबोधन को खुला रखा गया
  alternative: इसे केवल इस्राएल के राजा या स्पष्टतः पूरी प्रजा के नाम संबोधन के रूप में विस्तृत करना
  rationale: निकटवर्ती काव्यात्मक संदर्भ इस्राएल/याकूब को एकवचन में प्रस्तुत करता है। अनुवाद किसी अधिक संकीर्ण संदर्भ को आरोपित नहीं करता।
- issue: पूर्वजों की आशीष-शाप भाषा की प्रतिध्वनि
  choice: मुख्य पाठ में सीधी घोषणा रखी और समानांतर संदर्भ पादटिप्पणी में बताया
  alternative: अब्राहम से संबंधित संकेत को मुख्य पाठ में व्याख्यात्मक रूप से जोड़ना
  rationale: भाषा उत्पत्ति 12:3 और 27:29 की प्रतिध्वनि करती है, पर मूल पद स्वयं इसे स्पष्ट नहीं करता; इसलिए अनुवाद में विस्तार नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और काव्यात्मक रूप अपनाया गया है। एकवचन ‘तुझे’ मूल इब्रानी के प्रतिनिधिक-सामूहिक संबोधन को सुरक्षित रखता है।
