source:
  edition: WLC
  text: וְ/עַתָּ֕ה הִנְנִ֥/י הוֹלֵ֖ךְ לְ/עַמִּ֑/י לְכָ/ה֙ אִיעָ֣צְ/ךָ֔ אֲשֶׁ֨ר יַעֲשֶׂ֜ה הָ/עָ֥ם הַ/זֶּ֛ה לְ/עַמְּ/ךָ֖ בְּ/אַחֲרִ֥ית הַ/יָּמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/014.yaml
  text: And now[a], behold, I am going to my people. Come[b], I will advise you what this people will do to your people in the latter days.
translation:
  language: hi
  text: और अब, देख, मैं अपने लोगों के पास जा रहा हूँ। आ, मैं तुझे सलाह दूँगा कि यह प्रजा अन्तिम दिनों में[a] तेरी प्रजा के साथ[b] क्या करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आने वाले दिनों में।” हिब्रू पदबंध व्यापक रूप से भविष्य के समय को सूचित कर सकता है, फिर भी “अन्तिम दिनों में” उसका भविष्यसूचक भार बनाए रखता है।
    reason: alternative_reading
  - marker: b
    text: या, “तेरी प्रजा के विरुद्ध।” हिब्रू पूर्वसर्ग का शाब्दिक अर्थ “तेरी प्रजा की ओर/के लिए” है, पर प्रसंग में विरोधी कार्रवाई का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक ו और कालसूचक עַתָּה, दोनों के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: वक्ता की वर्तमान और आसन्न क्रिया पर बल देने वाले हिब्रू सूचक को सहज, किंतु गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הוֹלֵךְ לְעַמִּי
  choice: अपने लोगों के पास जा रहा हूँ
  rationale: कृदन्त की आसन्न/चल रही क्रिया तथा अपने समुदाय के पास लौटने का भाव सुरक्षित रहता है।
- source_word: לְכָה
  choice: आ
  rationale: ध्यान और सहभागिता के लिए बुलाने वाली एकवचन आज्ञा का सीधा रूप।
- source_word: אִיעָצְךָ
  choice: मैं तुझे बताऊँ
  rationale: יעץ का मूल अर्थ परामर्श देना है, पर यहाँ आगे आने वाली भविष्यवाणी की जानकारी देना आशय है; 'बताऊँ' वर्तमान प्रसंग में स्वाभाविक है, जबकि पादटिप्पणी में अधिक शाब्दिक विकल्प रखा गया है।
- source_word: הָעָם הַזֶּה
  choice: यह प्रजा
  rationale: एकवचन सामूहिक संज्ञा और इस्राएल के जनसमुदाय का भाव बनाए रखता है।
- source_word: לְעַמְּךָ
  choice: तेरी प्रजा के साथ
  rationale: לְ का संबंध/प्रभावित पक्ष वाला अर्थ हिन्दी में स्पष्ट करता है, पर hostile 'विरुद्ध' को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: בְּאַחֲרִית הַיָּמִים
  choice: आने वाले दिनों में
  rationale: हिब्रू मुहावरे के व्यापक भावी काल-संदर्भ को स्वाभाविक आधुनिक हिन्दी में देता है; संभावित गहन भविष्यसूचक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: בְּאַחֲרִית הַיָּמִים का भविष्यसूचक काल-संदर्भ
  choice: आने वाले दिनों में
  alternative: अन्तिम दिनों में
  rationale: इस प्रसंग में पदबंध भविष्य के समय को सूचित कर सकता है, पर अपने आप में पूर्ण विकसित अंत-काल सिद्धान्त को अनिवार्य नहीं करता। मुख्य पाठ सामान्य भविष्य को स्पष्ट रखता है और पादटिप्पणी संभावित भविष्यसूचक/अंत-कालीन भार को सुरक्षित करती है।
- issue: לְעַמְּךָ में क्रिया की दिशा
  choice: तेरी प्रजा के साथ
  alternative: तेरी प्रजा के विरुद्ध
  rationale: संदर्भ में शत्रुतापूर्ण कार्रवाई संभव है, किन्तु मूल पूर्वसर्ग केवल 'की ओर/के साथ/के संबंध में' भी व्यक्त कर सकता है; इसलिए मुख्य पाठ अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन के एकवचन रूप 'तू/तेरी' से मूल के एकवचन और प्राचीन राजकीय संवाद की निकटता बनी रहती है। भाषा सहज और गरिमापूर्ण रखी गई है; 'प्रजा' सामूहिक עַם के लिए प्रयुक्त है।
