  text: וַ/יִּשָּׂ֥א מְשָׁל֖/וֹ וַ/יֹּאמַ֑ר א֕וֹי מִ֥י יִחְיֶ֖ה מִ/שֻּׂמ֥/וֹ אֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/023.yaml
  text: Then he took up his discourse and said[a], “Alas[b], who can live when God does this?”
translation:
  language: hi
  text: 'फिर उसने अपना काव्य-वचन सुनाया और कहा,


    “हाय! जब परमेश्वर ऐसा करेगा, तब कौन जीवित रह सकेगा?”[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अन्तिम वाक्यांश का इब्रानी पाठ कठिन है। इसका अनुवाद यह भी हो सकता है: “हाय! जब परमेश्वर इसे स्थापित करेगा, तब कौन जीवित रह सकेगा?”'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: उसने अपना काव्य-वचन आरम्भ किया
  rationale: नָשָׂא और מָשָׁל का मेल किसी कथन या काव्यात्मक भविष्यवाणी को आरम्भ करके सुनाने का मुहावरा है। ‘काव्य-वचन’ इस प्रसंग की काव्यात्मक घोषणा को व्यक्त करता है और ‘दृष्टान्त’ के अधिक संकीर्ण अर्थ से बचता है।
- source_word: אֹוי
  choice: हाय!
  rationale: यह भय अथवा शोक की विस्मयादिबोधक पुकार है; आधुनिक हिन्दी में ‘हाय!’ स्वाभाविक और गंभीर है।
- source_word: מִי יִחְיֶה
  choice: कौन जीवित रह सकेगा
  rationale: शाब्दिक अर्थ ‘कौन जिएगा’ है, पर आने वाली विपत्ति के संदर्भ में प्रश्न जीवित बचने की सामर्थ्य के बारे में है। ‘रह सकेगा’ इस आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: מִשֻּׂמוֹ אֵל
  choice: जब परमेश्वर ऐसा करेगा
  rationale: यह अत्यंत संक्षिप्त और कठिन इब्रानी पदबंध है। यहाँ מִן को कालवाचक, שׂוּם को घटित/स्थापित करने के व्यापक अर्थ में, और אֵל को कर्ता मानकर ऐसा अनुवाद किया गया है; अस्पष्टता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: कठिन पदबंध מִשֻּׂמוֹ אֵל में कर्ता और अर्थ
  choice: अֵל को कर्ता मानकर ‘जब परमेश्वर ऐसा करेगा’
  alternative: ‘जब परमेश्वर इसे स्थापित करेगा’ अथवा अधिक शाब्दिक ‘परमेश्वर के इसे ठहराने पर’
  rationale: वाक्यांश व्याकरण की दृष्टि से संकुचित और विवादित है। चुना हुआ पाठ प्रसंग में दैवी कार्य को स्वाभाविक रूप से व्यक्त करता है, पर उसके स्वरूप को अनावश्यक रूप से निश्चित नहीं करता; वास्तविक वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘काव्य-वचन’ से מָשָׁל की व्यापक काव्यात्मक-भविष्यसूचक प्रकृति व्यक्त होती है; कठिन अंतिम खंड की वास्तविक अनिश्चितता पादटिप्पणी में स्पष्ट की गई है।
