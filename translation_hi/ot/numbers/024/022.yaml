  text: כִּ֥י אִם יִהְיֶ֖ה לְ/בָ֣עֵֽר קָ֑יִן עַד מָ֖ה אַשּׁ֥וּר תִּשְׁבֶּֽ/ךָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/022.yaml
  text: For if Kain is destined for burning, how long before Asshur carries you away captive?
translation:
  language: hi
  text: क्योंकि यदि काइन[a] भस्म होने को है, तो और कितनी देर में अश्शूर[b] तुम्हें बंदी बनाकर ले जाएगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘काइन’ से सम्भवतः व्यक्ति काइन नहीं, बल्कि केनी लोग अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: संदर्भ में ‘अश्शूर’ का अर्थ ‘अश्शूर देश’ या ‘अश्शूरी शक्ति’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי אִם
  choice: क्योंकि यदि
  rationale: यह पद पिछले कथन से संबंध रखते हुए एक शर्त प्रस्तुत कर सकता है। हिन्दी में ‘क्योंकि यदि’ उस व्याख्यात्मक और शर्तसूचक बल को बनाए रखता है; संयोजन का अर्थ ‘फिर भी’ भी समझा गया है।
- source_word: יִהְיֶה לְבָעֵר
  choice: भस्म होने को है
  rationale: यह निकट भविष्य या नियत परिणाम की ओर संकेत करता है। ‘भस्म होने को है’ मूल के ‘होना’ और जलाकर समाप्त किए जाने की छवि को रखते हुए ‘नियति’ जैसी अतिरिक्त दार्शनिक धारणा नहीं जोड़ता।
- source_word: קָיִן
  choice: क़ैन
  rationale: मूल पाठ के जातिवाचक रूप में प्रयुक्त व्यक्तिवाचक नाम का लिप्यंतरण किया गया है। संदर्भ में इसका संकेत सम्भवतः केनी लोगों की ओर है, जिसे पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: עַד מָה
  choice: और कितनी देर
  rationale: यह मुहावरा अगली घटना होने तक के समय के विषय में प्रश्न करता है। वाक्य-रचना में ‘के ... में और कितनी देर’ आधुनिक हिन्दी में ‘कितने समय बाद’ का स्वाभाविक भाव देता है।
- source_word: אַשּׁוּר
  choice: अश्शूर
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है। संदर्भ में यह अश्शूर देश अथवा अश्शूरी साम्राज्यिक शक्ति को सूचित कर सकता है।
- source_word: תִּשְׁבֶּךָּ
  choice: तुम्हें बंदी बनाकर ले जाने
  rationale: שבה का अर्थ केवल पकड़ना नहीं, बल्कि युद्ध-बंदी बनाकर ले जाना भी है। यह अनुवाद निर्वासन और बंदी बनाए जाने—दोनों निहित अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: क़ैन के विनाश का स्वरूप
  choice: भस्म होने को है
  alternative: नष्ट होने को है
  rationale: ‘भस्म’ मूल की जलाने या पूरी तरह समाप्त करने की सजीव छवि को बचाता है, पर यह निश्चित नहीं करता कि आग शाब्दिक है या विनाश का रूपक।
- issue: כִּי אִם की वाक्यगत भूमिका
  choice: क्योंकि यदि
  alternative: फिर भी
  rationale: मुख्य पाठ में व्याख्यात्मक-शर्तसूचक संभावना रखी गई है, जो अगले समयसूचक प्रश्न से सहज जुड़ती है। ‘फिर भी’ सम्भव है, पर वह शर्तसूचक तनाव को समाप्त कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। ‘भस्म होने को है’ मूल बिंब को बचाता है, जबकि ‘बंदी बनाकर ले जाना’ שבה के निर्वासन-संबंधी भाव को स्पष्ट करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में दिए गए हैं।
