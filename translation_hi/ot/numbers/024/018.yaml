  text: וְ/הָיָ֨ה אֱד֜וֹם יְרֵשָׁ֗ה וְ/הָיָ֧ה יְרֵשָׁ֛ה שֵׂעִ֖יר אֹיְבָ֑י/ו וְ/יִשְׂרָאֵ֖ל עֹ֥שֶׂה חָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/024/018.yaml
  text: Edom will become a possession[a]; Seir also will become a possession for his enemies[b], while Israel acts valiantly.
translation:
  language: hi
  text: एदोम अधिकार में आ जाएगा; सेईर भी उसके शत्रुओं के अधिकार में आ जाएगा[a], और इस्राएल पराक्रम दिखाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू में शाब्दिक रूप से ‘उसके शत्रु’ है; ‘उसके’ के लिए पुल्लिंग एकवचन प्रत्यय आया है। यह आस-पास की भविष्यवाणी में वर्णित शासक की ओर संकेत कर सकता है। इसे सेईर/एदोम से जोड़कर यह अर्थ भी लिया जाता है: ‘सेईर अपने शत्रुओं के अधिकार में आ जाएगा।’'
    reason: alternative_reading
  - marker: b
    text: हिब्रू में शाब्दिक रूप से ‘पराक्रम करता है’; यह सामर्थ्य दिखाने या वीरतापूर्वक कार्य करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: अधिकार में आ जाएगा
  rationale: भविष्यसूचक प्रसंग में यह रूप आगे होने वाली अवस्था को व्यक्त करता है; ‘आ जाएगा’ उस परिवर्तन को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְרֵשָׁה
  choice: अधिकार में
  rationale: यह संज्ञा ऐसी वस्तु या भूमि को दर्शाती है जिस पर अधिकार कर लिया गया हो। सैन्य-विजय के प्रसंग में ‘अधिकार में आना’ स्वाभाविक है और ‘विरासत’ की अनावश्यक घरेलू छाया से बचता है।
- source_word: שֵׂעִיר
  choice: सेईर
  rationale: यह एदोम के समानांतर प्रयुक्त स्थानवाचक नाम है। मूल में ‘पर्वत’ के लिए अलग शब्द नहीं है, इसलिए केवल ‘सेईर’ रखा गया है।
- source_word: אֹיְבָיו
  choice: उसके शत्रुओं में
  rationale: मूल रूप का अर्थ शाब्दिक रूप से ‘उसके शत्रु’ है और प्रत्यय पुल्लिंग एकवचन है। हिन्दी वाक्य में सेईर को उस एकवचन व्यक्ति के शत्रुओं में गिनाकर मूल की संबंध-सूचना और बहुवचन दोनों बनाए रखे गए हैं।
- source_word: עֹשֶׂה חָיִל
  choice: पराक्रम दिखाएगा
  rationale: यह मुहावरा सामर्थ्य और वीरता के प्रभावी प्रदर्शन को व्यक्त करता है; ‘पराक्रम दिखाना’ वर्तमान, गरिमापूर्ण और युद्ध-संदर्भ के अनुकूल हिन्दी है।
theological_decisions:
- issue: ‘उसके शत्रु’ में एकवचन संबंधवाचक प्रत्यय का संकेत
  choice: मुख्य पाठ में ‘उसके’ को बनाए रखते हुए इसे आस-पास की भविष्यवाणी में वर्णित एकवचन शासक की ओर संकेत करने दिया गया है।
  alternative: इसे सेईर/एदोम की ओर संकेत मानकर ‘सेईर अपने शत्रुओं के अधिकार में आ जाएगा’ अनुवाद किया जा सकता है।
  rationale: हिब्रू प्रत्यय पुल्लिंग एकवचन है, और पद 17–19 में इस्राएल से आने वाले एकवचन शासक का वर्णन है। फिर भी व्याकरणिक संकेत पूर्णतः निर्विवाद नहीं है, इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है और कोई विशिष्ट मसीही पहचान पाठ में नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘अधिकार में आ जाएगा’ विजय के परिणाम को सामान्य पाठक के लिए स्पष्ट करता है, जबकि ‘पराक्रम दिखाएगा’ मूल सैन्य मुहावरे की शक्ति बनाए रखता है।
