base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/018.yaml
  text: And they assembled all the congregation on the first day of the second month[a], and they registered themselves by clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[b], head by head.
translation:
  language: hi
  text: और उन्होंने दूसरे महीने के पहले दिन सारी मंडली को इकट्ठा किया। फिर लोगों ने अपने-अपने कुलों और अपने पितरों के घरानों के अनुसार अपनी वंशावली दर्ज कराई[a]; बीस वर्ष और उससे अधिक आयु के लोगों को नाम लेकर, एक-एक व्यक्ति करके[b] गिना गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने अपना वंश घोषित किया” अथवा “वंश के आधार पर अपना नाम दर्ज कराया”; यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और वंश के आधार पर पंजीकरण का संकेत देती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उनके सिरों के अनुसार” या “उनकी खोपड़ियों के अनुसार” है; यह प्रत्येक व्यक्ति को अलग-अलग गिनने का मुहावरा है।
    reason: lexical_alternative
