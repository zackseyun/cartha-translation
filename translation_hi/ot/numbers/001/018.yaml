  choice: उनके नामों की गिनती
  rationale: यह नामित व्यक्तियों की गणना को दर्शाता है और जनगणना का भाव स्पष्ट रखता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: आयु-सीमा के सूत्र का स्वाभाविक आधुनिक हिन्दी अनुवाद।
- source_word: לְגֻלְגְּלֹתָם
  choice: एक-एक व्यक्ति करके
  rationale: शाब्दिक ‘उनकी खोपड़ियों/सिरों के अनुसार’ एक मुहावरा है जिसका आशय प्रत्येक व्यक्ति की अलग-अलग गणना है; मुख्य पाठ में अर्थ स्पष्ट किया गया है और ठोस मूल बिंब पादटिप्पणी में रखा गया है।
