translation:
  language: hi
  text: तब मूसा और हारून ने इन पुरुषों को लिया, जिन्हें नाम से निर्दिष्ट किया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקַּח
  choice: अपने साथ लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। यहाँ द्विवचन कर्ता मूसा और हारून के संदर्भ में हिंदी का स्वाभाविक एकवचन क्रियारूप आता है; ‘अपने साथ लिया’ नेतृत्वकर्ताओं को संगठित करने का प्रसंग स्पष्ट करता है, बिना ‘बुलाया’ जैसा अलग अर्थ जोड़ने के।
- source_word: מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून
  rationale: हिंदी बाइबल परंपरा में प्रचलित और सहज व्यक्तिनाम-रूप।
- source_word: אֵת הָאֲנָשִׁים הָאֵלֶּה
  choice: इन पुरुषों को
  rationale: אֲנָשִׁים यहाँ पिछले पदों में नामित पुरुष प्रतिनिधियों को दर्शाता है। ‘पुरुषों’ लिंग और संदर्भ दोनों को सुरक्षित रखता है; ‘अगुओं’ कहना अतिरिक्त व्याख्या होती।
- source_word: נִקְּבוּ
  choice: चुना गया था
  rationale: נקב के निफ़अल रूप में नाम लेकर स्पष्ट रूप से निर्दिष्ट किए जाने का भाव है। प्रशासनिक संदर्भ में ‘चुना गया था’ औपचारिक नियुक्ति का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּשֵׁמוֹת
  choice: नाम लेकर
  rationale: यह पदबंध नाम के द्वारा विशिष्ट पहचान को दर्शाता है। ‘नाम लेकर’ हिंदी में सहज है और व्यक्तिगत रूप से पहचाने जाने का अर्थ बनाए रखता है।
