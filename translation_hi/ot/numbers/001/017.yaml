  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘अपने साथ लिया’ शाब्दिक ‘लिया’ से अधिक स्वाभाविक है, जबकि मूल क्रिया का अर्थ सुरक्षित रहता है।
