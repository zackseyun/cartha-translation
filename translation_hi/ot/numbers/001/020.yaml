language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּהְי֤וּ בְנֵֽי רְאוּבֵן֙ בְּכֹ֣ר יִשְׂרָאֵ֔ל תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֤ר שֵׁמוֹת֙ לְ/גֻלְגְּלֹתָ֔/ם כָּל זָכָ֗ר מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/020.yaml
  text: 'The sons of Reuben[a], the firstborn of Israel, by their generations, by their clans, by their fathers’ houses, according to the number of names, head by head, every male from twenty years old and upward, everyone going out to war:'
translation:
  language: hi
  text: 'इस्राएल के पहलौठे रूबेन के पुत्र—उनकी वंशावलियों, कुलों और पितृकुलों के अनुसार, नामों की गिनती के अनुसार, एक-एक व्यक्ति करके[a], बीस वर्ष या उससे अधिक आयु का हर पुरुष, जो युद्ध के लिए निकलनेवाला था:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘उनकी खोपड़ियों/सिरों के अनुसार’ है; यह प्रत्येक व्यक्ति को अलग-अलग गिनने का मुहावरा है।
    reason: मूल के ठोस शाब्दिक चित्र और उसके मुहावरेदार अर्थ—दोनों को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: की गई
  rationale: यह क्रिया जनगणना-सूत्र का आरम्भ करती है। हिन्दी में इसे ‘गिनती ... की गई’ के साथ व्यक्त करने से वाक्य स्वाभाविक रहता है और अगले पद में आनेवाली कुल संख्या के लिए सूत्रात्मक संरचना बनी रहती है।
- source_word: בְנֵי רְאוּבֵן
  choice: रूबेन के पुत्रों
  rationale: ‘पुत्र’ मूल शब्द के निकट है और यहाँ रूबेन के गोत्रीय वंशजों को सूचित करता है।
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: इस्राएल के पहलौठे
  rationale: यह रूबेन की पहचान करानेवाला समानाधिकरण पदबंध है; ‘पहलौठा’ ज्येष्ठ पुत्र की मूल धारणा को बनाए रखता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: जनगणना के प्रसंग में यह पद पीढ़ीगत वंशक्रम अथवा वंशावलीगत विभाजन को दर्शाता है; अनावश्यक रूप से लिखित अभिलेख मानने से बचा गया है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: ‘कुल’ गोत्र के भीतर के रिश्तेदारी-समूह को व्यक्त करता है और अगले ‘पितृकुल’ से पर्याप्त भेद रखता है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों के अनुसार
  rationale: यह पैतृक घराने की तकनीकी रिश्तेदारी इकाई को संक्षिप्त और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नाम गिनकर
  rationale: यह प्रत्येक नामित व्यक्ति की गणना का बोध कराता है और शाब्दिक ‘नामों की संख्या के अनुसार’ की अपेक्षा हिन्दी में अधिक स्वाभाविक है।
- source_word: לְגֻלְגְּלֹתָם
  choice: एक-एक व्यक्ति करके[a]
  rationale: मूल का शाब्दिक चित्र ‘खोपड़ियों/सिरों के अनुसार’ है, पर इसका मुहावरेदार आशय प्रत्येक व्यक्ति को अलग-अलग गिनना है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: आयु और सैन्य जनगणना के प्रसंग में ‘हर पुरुष’ सहज हिन्दी है और पुरुष-लिंग की सीमा स्पष्ट रखता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु का
  rationale: यह आयु-सीमा को आधुनिक, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: जो युद्ध के लिए निकलता था
  rationale: मूल में सक्रिय कृदन्त ‘सेना/युद्ध के लिए निकलनेवाला’ है। इसे केवल ‘योग्य’ कहकर संभाव्यता में बदलने के बजाय क्रियात्मक भाव बनाए रखा गया है।
theological_decisions:
- issue: כֹּל יֹצֵא צָבָא में वास्तविक सैन्य प्रस्थान बनाम सैन्य योग्यता
  choice: जो युद्ध के लिए निकलता था
  alternative: जो युद्ध में जाने के योग्य था
  rationale: मूल पाठ सक्रिय रूप से ‘निकलनेवाले’ कहता है; प्रसंग सैन्य पात्रता का संकेत दे सकता है, पर अनुवाद में उस व्याख्या को मूल क्रिया के स्थान पर नहीं रखा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज जनगणना-शैली रखी गई है। ‘कुल’ और ‘पितृकुल’ से दो अलग रिश्तेदारी इकाइयों का भेद बनाए रखा गया है। अंतिम द्विबिंदु अगले पद में दी जानेवाली संख्या से वाक्यगत संबंध दिखाता है।
