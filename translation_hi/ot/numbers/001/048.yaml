  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिंदी में व्यक्त करता है। דּבר के वाणी-संबंधी अर्थ और לֵאמֹר की सूत्रात्मक भूमिका को मिलाकर ‘कहा’ संक्षिप्त और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निजी नाम יהוה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से दर्शाया गया है; इसे केवल ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל
  choice: से
  rationale: דבר के साथ हिंदी में संबोधित व्यक्ति को स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इब्रानी नाम מֹשֶׁה का मानक और व्यापक रूप से पहचाना जाने वाला हिंदी रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: प्रत्यक्ष वचन का परिचय देने वाले इब्रानी सूत्र को हिंदी में अलग से ‘यह कहते हुए’ रखने के बजाय मुख्य क्रिया के साथ ‘कहा’ में स्वाभाविक रूप से समाहित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में निजी ईश्वरीय नाम सीधे उपस्थित है। हिंदी पाठकों के लिए परिचित ‘यहोवा’ उसका लिप्यंतरण है; पादटिप्पणी मूल व्यंजनात्मक रूप और पारंपरिक ‘प्रभु’ अनुवाद बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। इब्रानी कथात्मक क्रम को ‘तब’ से व्यक्त किया गया है और सूत्रात्मक ‘बोला...कहते हुए’ की अस्वाभाविक पुनरुक्ति से बचते हुए उसे ‘कहा’ में समाहित किया गया है।
