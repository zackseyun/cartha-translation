  text: 'for Simeon: Shelumiel son of Zurishaddai;'
translation:
  language: hi
  text: 'शिमोन के लिए: शलूमीएल, सूरीशद्दै का पुत्र;'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/שִׁמְעוֹן
  choice: शिमोन के लिए
  rationale: उपसर्ग לְ इस जनगणना-सूची में शिमोन गोत्र की ओर से नियुक्त प्रतिनिधि का संकेत देता है। “शिमोन के लिए” मूल की संक्षिप्त सूची-रचना को बनाए रखता है।
- source_word: שְׁלֻמִיאֵל
  choice: शलूमीएल
  rationale: व्यक्तिनाम का अनुवाद नहीं, देवनागरी में लिप्यंतरण किया गया है; यह हिब्रू उच्चारण के निकट और हिन्दी में सहज है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशपरिचय के इस सूत्र में בֶּן का सीधा और स्वाभाविक अर्थ “पुत्र” है।
- source_word: צוּרִישַׁדָּי
  choice: सूरीशद्दै
  rationale: व्यक्तिनाम को उसके हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है; आरम्भिक צ को “स” और שַׁדָּי को “शद्दै” से दर्शाया गया है।
