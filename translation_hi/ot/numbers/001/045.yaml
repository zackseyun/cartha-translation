  yaml_path: translation/ot/numbers/001/045.yaml
  text: So all those counted of the sons of Israel[a], by their fathers’ houses, from twenty years old and upward, every one able to go out to war in Israel[b],
translation:
  language: hi
  text: इस प्रकार इस्राएल के पुत्रों में से जितने गिने गए[a]—अपने-अपने पितृकुल के अनुसार, बीस वर्ष या उससे अधिक आयु के, इस्राएल में युद्ध के लिए निकलने योग्य सभी पुरुष[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों में से जितनों की गिनती हुई।” इब्रानी में “इस्राएल के पुत्र” है; यहाँ पुरुषों की सैन्य जनगणना होने के कारण मुख्य पाठ में यह अभिव्यक्ति रखी गई है।
    reason: lexical_alternative
  - marker: b
    text: या, “वे सभी जो सैनिक सेवा के योग्य थे।” शाब्दिक अर्थ है, “युद्ध के लिए निकलने वाला हर एक।”
    reason: lexical_alternative
