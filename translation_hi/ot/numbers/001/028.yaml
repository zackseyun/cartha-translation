base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/028.yaml
  text: 'For the sons of Issachar[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: hi
  text: 'इस्साकार के पुत्रों के लिए: उनकी वंश-परंपराओं के अनुसार, उनके कुलों के अनुसार, उनके पितरों के घरानों के अनुसार, नामों की संख्या के अनुसार, बीस वर्ष और उससे अधिक आयु के युद्ध के लिए जाने योग्य सभी पुरुष[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेना के लिए निकलने वाला हर एक।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ है “सेना के लिए निकलने वाला प्रत्येक”; यहाँ इससे सैन्य सेवा के योग्य पुरुष अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי יִשָּׂשכָר
  choice: इस्साकार के पुत्रों में से
  rationale: לְ यहाँ जनगणना की जनजातीय भूमिका आरम्भ करता है; בני का शाब्दिक वंशगत और पुरुष-संदर्भित अर्थ बनाए रखा गया है। ‘में से’ आगे आने वाली गिनती से स्वाभाविक संबंध जोड़ता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: यह शब्द यहाँ पीढ़ीगत वंश-क्रम या वंशगत विभाजन बताता है; ‘वंशावलियाँ’ आधुनिक हिन्दी में इस जनगणना-संदर्भ को स्पष्ट रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה जनजाति के भीतर एक विस्तृत नातेदारी-समूह है; ‘कुल’ आधुनिक हिन्दी में ‘परिवार’ से अधिक उपयुक्त और संक्षिप्त है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृ-परिवारों के अनुसार
  rationale: इब्रानी पदबंध पैतृक घराने या परिवार-इकाई को दर्शाता है। ‘पितृ-परिवार’ उसकी पुरुष-वंशीय संरचना को सुरक्षित रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती करके
  rationale: शाब्दिक ‘नामों की संख्या के अनुसार’ हिन्दी में भारी लगता है; यह चयन नाम लेकर व्यक्तियों की गणना किए जाने का जनगणना-संबंधी भाव स्वाभाविक ढंग से देता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह आयु-सीमा बीस वर्ष को सम्मिलित करती है; आधुनिक हिन्दी में यही स्पष्ट और सहज अभिव्यक्ति है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष जो युद्ध के लिए निकल सकते थे
  rationale: शाब्दिक अभिव्यक्ति ‘सेना/युद्ध के लिए निकलने वाला प्रत्येक’ है। जनगणना के संदर्भ में यह सैन्य सेवा के योग्य पुरुषों को सूचित करती है; ‘निकल सकते थे’ उस कार्यगत अर्थ को व्यक्त करता है।
theological_decisions:
- issue: जनगणना की पुरुष-संदर्भित भाषा
  choice: वे सभी पुरुष जो युद्ध के लिए निकल सकते थे
  alternative: वे सभी जो युद्ध के लिए निकलते थे
  rationale: व्याकरणिक रूप पुल्लिंग है और संदर्भ बीस वर्ष या अधिक आयु के सैन्य-योग्य पुरुषों की गणना का है। इसलिए लिंग-विशिष्ट अर्थ को सामान्यीकृत नहीं किया गया।
- issue: יֹצֵא צָבָא में वास्तविक प्रस्थान या सैन्य योग्यता
  choice: जो युद्ध के लिए निकल सकते थे
  alternative: जो युद्ध के लिए निकलते थे
  rationale: संदर्भ सैन्य जनगणना है, इसलिए यह केवल उस समय युद्ध में जा रहे लोगों के बजाय सेवा-योग्य वर्ग को सूचित करता है। फिर भी शाब्दिक विकल्प की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। पद अगले पद की संख्या-सूची की भूमिका है, इसलिए अंत में डैश रखा गया है। समानांतर जनगणना-सूत्रों में ‘कुल’, ‘पितृ-परिवार’, ‘नामों की गिनती’ और ‘युद्ध के लिए निकल सकते थे’ को संगत रखा जाना चाहिए।
