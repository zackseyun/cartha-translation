  register: आधुनिक मानक हिंदी का गरिमापूर्ण निर्देशात्मक रूप अपनाया गया है। मुख्य पाठ मूल की पुनरुक्ति और औपचारिक पदबंध को रखता है; पादटिप्पणी अधिक सहज सामूहिक और वैकल्पिक शब्दावली देती है।
