source:
  edition: WLC
  text: וְ/חָנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל אִ֧ישׁ עַֽל מַחֲנֵ֛/הוּ וְ/אִ֥ישׁ עַל דִּגְל֖/וֹ לְ/צִבְאֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/052.yaml
  text: The sons of Israel shall camp[a], each man by his camp and each man by his banner, according to their divisions.
translation:
  language: hi
  text: इस्राएल के पुत्र डेरा डालें[a]—हर एक अपने पड़ाव के पास और हर एक अपनी ध्वजा के पास, अपने-अपने सैन्य-दलों के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली डेरा डालें—हर एक अपने पड़ाव के पास और हर एक अपनी पताका के पास, अपने-अपने दलों के अनुसार।”
    reason: शाब्दिक विकल्पों “इस्राएली,” “पताका,” और “दल” को देते हुए मूल की संभावित सहज अभिव्यक्ति दर्शाना।
lexical_decisions:
- source_word: וְחָנוּ
  choice: डेरा डालें
  rationale: संयुक्त वाव के साथ यह क़ाल पूर्ण रूप निर्देशात्मक प्रसंग में भावी/आज्ञार्थक अर्थ देता है। हिंदी में “डेरा डालें” इस निर्देशात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह मूल पदबंध का औपचारिक और लिंग-सटीक रूप है। अधिक सहज सामूहिक विकल्प “इस्राएली” पादटिप्पणी में दिया गया है।
- source_word: אִישׁ ... וְאִישׁ
  choice: हर एक ... और हर एक
  rationale: दोहराया गया אִישׁ वितरणात्मक बल देता है। “हर एक” हिंदी में पुनरुक्ति और व्यक्तिगत नियुक्ति दोनों को स्वाभाविक ढंग से बनाए रखता है; संदर्भ तथा “इस्राएल के पुत्र” पुरुष-संबंधी आशय को स्पष्ट रखते हैं।
- source_word: עַל מַחֲנֵהוּ
  choice: अपने पड़ाव के पास
  rationale: מַחֲנֶה का अर्थ पड़ाव/छावनी है और עַל यहाँ स्थान या संबद्धता सूचित करता है। “के पास” सटीक स्थान को अनावश्यक रूप से निर्धारित किए बिना यह संबंध व्यक्त करता है।
- source_word: דִּגְלוֹ
  choice: अपनी ध्वजा के पास
  rationale: דֶּגֶל किसी कबीलाई या सैन्य पहचान-चिह्न वाली ध्वजा को दर्शाता है। “ध्वजा” आधुनिक, गरिमापूर्ण और ऐतिहासिक संदर्भ के अनुकूल है।
- source_word: לְצִבְאֹתָם
  choice: अपने-अपने सैन्य-दलों के अनुसार
  rationale: צָבָא यहाँ संगठित सैन्य/जनसमूहों को सूचित करता है। “सैन्य-दल” संगठनात्मक और सैन्य रंग दोनों बचाता है, पर तत्काल युद्ध का अर्थ नहीं थोपता।
