  text: אֵ֣לֶּה הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֤ה וְ/אַהֲרֹן֙ וּ/נְשִׂיאֵ֣י יִשְׂרָאֵ֔ל שְׁנֵ֥ים עָשָׂ֖ר אִ֑ישׁ אִישׁ אֶחָ֥ד לְ/בֵית אֲבֹתָ֖י/ו הָיֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/044.yaml
  text: These are the ones counted[a], whom Moses and Aaron counted, and the leaders of Israel—twelve men[b], each one for his fathers’ house—were with them.
translation:
  language: hi
  text: ये वे पुरुष हैं जिन्हें गिना गया था[a] और जिनकी गिनती मूसा, हारून और इस्राएल के प्रधानों ने की थी। वे प्रधान बारह पुरुष थे—हर एक अपने पितृकुल[b] का प्रतिनिधि था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्हें जनगणना में दर्ज किया गया था।” इब्रानी शब्द गिने गए व्यक्तियों या जनगणना में उनके पंजीकरण पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: “पितृकुल” इस्राएल की गोत्रीय व्यवस्था में पिता की वंश-रेखा से जुड़ी विस्तृत पारिवारिक या कुल-इकाई को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: הַפְּקֻדִים
  choice: वे पुरुष जिन्हें गिना गया था
  rationale: פקד के कर्मवाच्य रूप को जनगणना में गिने गए व्यक्तियों के रूप में व्यक्त किया गया है। संदर्भ में सैनिक सेवा योग्य पुरुषों की गणना हो रही है, इसलिए ‘पुरुष’ स्वाभाविक और लिंग-सटीक है।
- source_word: פָּקַד
  choice: गिनती ... की थी
  rationale: गिनती/जनगणना के इस संदर्भ में क्रिया का अर्थ लोगों को गिनना और दर्ज करना है। ‘गिनती की’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: נְשִׂיאֵי יִשְׂרָאֵל
  choice: इस्राएल के प्रधानों
  rationale: यहाँ נָשִׂיא गोत्रीय अगुओं को सूचित करता है। ‘प्रधान’ उनके नेतृत्वकारी पद को व्यक्त करता है और राजवंशीय अर्थ से बचता है।
- source_word: שְׁנֵים עָשָׂר אִישׁ
  choice: बारह पुरुष
  rationale: इब्रानी में स्पष्ट रूप से पुल्लिंग אִישׁ है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
- source_word: אִישׁ אֶחָד
  choice: एक पुरुष
  rationale: वितरणात्मक भाव—प्रत्येक पितृकुल का एक प्रतिनिधि—‘हर ... से एक पुरुष’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: לְבֵית אֲבֹתָיו
  choice: हर पितृकुल से
  rationale: यह वाक्यांश इस्राएल की पितृवंशीय कुल-इकाई को दर्शाता है। प्रतिनिधित्व के प्रसंग में ‘से’ हिन्दी में अपेक्षित सम्बन्ध स्पष्ट करता है।
- source_word: הָיוּ
  choice: वे प्रधान ... थे
  rationale: अंतिम बहुवचन क्रिया को बारह प्रधानों की पहचान बताने वाले स्वतंत्र वाक्य में स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: गिनती करने वालों में प्रधानों की वाक्यगत भूमिका
  choice: मूसा, हारून और इस्राएल के प्रधानों को संयुक्त कर्ता माना गया
  alternative: प्रधान मूसा और हारून के साथ उपस्थित थे
  rationale: אֲשֶׁר פָּקַד के बाद मूसा, हारून और प्रधान बिना किसी ‘साथ’ सूचक पूर्वसर्ग के आते हैं; अतः वे स्वाभाविक रूप से ‘गिनती की’ के संयुक्त कर्ता हैं। अंतिम הָיוּ बारह पुरुषों की पहचान को पूरा करता है। यह निर्णय पद की ऐतिहासिक भूमिका को स्पष्ट करता है, किसी संप्रदायगत निष्कर्ष को नहीं।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘पितृकुल’ कुछ औपचारिक शब्द है, पर सांस्कृतिक संरचना को केवल ‘परिवार’ कहकर सपाट करने से बचाता है; इसलिए इसे पादटिप्पणी में समझाया गया है। दो वाक्यों की रचना मूल इब्रानी के घने वाक्य-विन्यास को सहज हिन्दी में व्यक्त करती है।
