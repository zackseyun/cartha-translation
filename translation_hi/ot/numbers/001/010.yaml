  text: 'For the sons of Joseph: for Ephraim, Elishama son of Ammihud; for Manasseh, Gamaliel son of Pedahzur.'
translation:
  language: hi
  text: 'यूसुफ़ के पुत्रों के लिए: एप्रैम के लिए अम्मीहूद का पुत्र एलीशामा; और मनश्शे के लिए पदाहसूर का पुत्र गमलीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף
  choice: यूसुफ़ के पुत्रों में से
  rationale: לְ यहाँ जनगणना के लिए प्रत्येक गोत्र से चुने गए प्रतिनिधि को प्रस्तुत करता है। हिंदी में ‘के पुत्रों में से’ सूची के प्रसंग और यूसुफ़ की दो गोत्रीय शाखाओं—एप्रैम और मनश्शे—को स्वाभाविक रूप से व्यक्त करता है; ‘पुत्रों’ से मूल इब्रानी रूप भी बना रहता है।
- source_word: לְאֶפְרַיִם
  choice: एप्रैम के लिए
  rationale: दोहराया गया לְ यूसुफ़ के अधीन विशिष्ट गोत्रीय शाखा को चिह्नित करता है। ‘के लिए’ सूची की समानांतर रचना बनाए रखता है; संदर्भ स्पष्ट होने के कारण ‘एप्रैम के गोत्र के लिए’ जोड़ना आवश्यक नहीं है।
- source_word: אֱלִישָׁמָע
  choice: एलीशामा
  rationale: व्यक्तिनाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: इब्रानी संबंध-संरचना को स्वाभाविक हिंदी वंशसूचक प्रयोग में व्यक्त किया गया है।
- source_word: עַמִּיהוּד
  choice: अम्मीहूद
  rationale: व्यक्तिनाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: לִמְנַשֶּׁה
  choice: मनश्शे के लिए
  rationale: यह ‘एप्रैम के लिए’ के समानांतर है और यूसुफ़ की दूसरी गोत्रीय शाखा को चिह्नित करता है।
- source_word: גַּמְלִיאֵל
  choice: गमलीएल
  rationale: व्यक्तिनाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण।
- source_word: פְּדָהצוּר
  choice: पदाहसूर
  rationale: व्यक्तिनाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण; צוּר के आरंभिक व्यंजन को हिंदी में ‘स’ से दर्शाया गया है।
