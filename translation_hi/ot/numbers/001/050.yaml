  text: וְ/אַתָּ֡ה הַפְקֵ֣ד אֶת הַ/לְוִיִּם֩ עַל מִשְׁכַּ֨ן הָ/עֵדֻ֜ת וְ/עַ֣ל כָּל כֵּלָי/ו֮ וְ/עַ֣ל כָּל אֲשֶׁר ל/וֹ֒ הֵ֜מָּה יִשְׂא֤וּ אֶת הַ/מִּשְׁכָּן֙ וְ/אֶת כָּל כֵּלָ֔י/ו וְ/הֵ֖ם יְשָׁרְתֻ֑/הוּ וְ/סָבִ֥יב לַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/050.yaml
  text: But you[a], appoint the Levites over the tabernacle of the testimony, and over all its furnishings, and over all that belongs to it. They are to carry the tabernacle and all its furnishings, and they are to minister to it[b], and they are to camp around the tabernacle.
translation:
  language: hi
  text: पर तू लेवियों को साक्षी के पवित्र निवास[a], उसके सारे सामान और उससे संबंधित हर वस्तु की ज़िम्मेदारी सौंप। वे पवित्र निवास और उसके सारे सामान को उठाकर ले जाएँ, उसकी सेवा करें[b] और पवित्र निवास के चारों ओर डेरा डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साक्षी का तंबू।” इब्रानी शब्द מִשְׁכָּן का मूल अर्थ “निवास-स्थान” है और यहाँ वह चलायमान पवित्र-स्थान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वहाँ सेवा करें” अथवा “उसकी देखभाल करें।” मूल क्रिया पवित्र-स्थान से जुड़ी सेवा का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאַתָּה
  choice: पर तू
  rationale: संयोजक यहाँ पिछली बात के विपरीत लेवियों के विशेष दायित्व पर बल देता है; एकवचन संबोधन मूसा से है।
- source_word: הַפְקֵד ... עַל
  choice: की ज़िम्मेदारी सौंप
  rationale: हिफ़ील आज्ञार्थक और उसके साथ עַל नियुक्ति तथा उत्तरदायित्व का भाव देते हैं; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: साक्षी का पवित्र निवास
  rationale: מִשְׁכָּן के मूल ‘निवास’ भाव और इस संदर्भ में उसके पवित्र-स्थान संबंधी तकनीकी अर्थ, दोनों को व्यक्त करता है; הָעֵדֻת को औपचारिक रूप से ‘साक्षी’ रखा गया है।
- source_word: כֵּלָיו
  choice: उसका सारा सामान
  rationale: मूल शब्द पात्रों, उपकरणों और अन्य उपस्करों के लिए व्यापक है; ‘सामान’ सरल और पर्याप्त रूप से समावेशी है।
- source_word: כָּל אֲשֶׁר לוֹ
  choice: उससे संबंधित हर वस्तु
  rationale: यह वाक्यांश पवित्र निवास से संबद्ध सभी चीज़ों को समेटता है, केवल उसके भीतर रखी वस्तुओं को नहीं।
- source_word: יִשְׂאוּ
  choice: उठाकर ले जाएँ
  rationale: नשא यहाँ यात्रा के समय पवित्र निवास और उसके सामान को शारीरिक रूप से ढोने का अर्थ देता है।
- source_word: יְשָׁרְתֻהוּ
  choice: उसकी सेवा करें
  rationale: שרת का पिएल रूप पवित्र-स्थान संबंधी सेवा को दर्शाता है; सर्वनामिक कर्म को बनाए रखते हुए ‘सेवा’ धार्मिक संदर्भ का भाव सुरक्षित रखती है।
- source_word: סָבִיב לַמִּשְׁכָּן יַחֲנוּ
  choice: पवित्र निवास के चारों ओर डेरा डालें
  rationale: निर्देशात्मक अपूर्ण क्रिया को आज्ञात्मक हिन्दी में व्यक्त किया गया है और चारों ओर की परिधि का भाव स्पष्ट रखा गया है।
theological_decisions:
- issue: מִשְׁכָּן के पवित्र-स्थान संबंधी तकनीकी अर्थ का अनुवाद
  choice: पवित्र निवास
  alternative: तंबू; निवास-स्थान
  rationale: ‘पवित्र निवास’ मूल के ‘निवास’ अर्थ को बनाए रखता है और स्पष्ट करता है कि यहाँ साधारण आवास नहीं, इस्राएल का चलायमान पवित्र-स्थान अभिप्रेत है। इसे ‘मिलापवाला तंबू’ नहीं किया गया, क्योंकि वह सामान्यतः भिन्न इब्रानी पद אֹהֶל מוֹעֵד का अनुवाद है।
- issue: שרת में पवित्र सेवा का भाव
  choice: उसकी सेवा करें
  alternative: वहाँ सेवा करें; उसकी देखभाल करें
  rationale: यह चयन मूल के प्रत्यक्ष सर्वनामिक कर्म और धार्मिक सेवा के अर्थ को बनाए रखता है, पर लेवियों के कार्य को बाद की किसी विशेष पुरोहितीय धारणा से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूसा के लिए एकवचन ‘तू’ बाइबलीय हिन्दी की प्रचलित निकट संबोधन शैली के अनुसार है। ‘मिलापवाला तंबू’ से परहेज़ किया गया है ताकि מִשְׁכַּן הָעֵדֻת और אֹהֶל מוֹעֵד जैसे अलग इब्रानी पदों का अंतर न मिटे।
