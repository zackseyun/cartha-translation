    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: गिने गए लोगों की संख्या
  rationale: यह जनगणना के संदर्भ में नामांकित अथवा गिने गए लोगों के कुल आँकड़े को व्यक्त करता है। हिंदी में यह वाक्यांश स्वाभाविक है और मूल में निहित गणना तथा संख्या—दोनों भावों को बनाए रखता है।
- source_word: לְמַטֵּה
  choice: के गोत्र में
  rationale: इस जनगणना-सूत्र में לְמַטֵּה संबंधित गोत्र से संबद्धता बताता है; ‘के गोत्र में’ आधुनिक हिंदी में सहज और प्रसंगानुकूल है।
- source_word: יִשָּׂשכָר
  choice: इस्साकार
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी बाइबलीय लिप्यंतरण अपनाया गया है।
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: चौवन हज़ार चार सौ
  rationale: मूल की ठीक संख्या को आधुनिक मानक हिंदी की स्वाभाविक संख्या-रचना में प्रस्तुत किया गया है।
