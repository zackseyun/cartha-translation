lexical_decisions:
- source_word: לְיִשָּׂשכָר
  choice: इस्साकार के लिए
  rationale: उपसर्ग לְ इस जनगणना-सूची में गोत्र से संबद्ध प्रतिनिधि का परिचय देता है; हिंदी में ‘इस्साकार के लिए’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נְתַנְאֵל
  choice: नतनेल
  rationale: यह व्यक्ति का नाम है, इसलिए अर्थानुवाद करने के बजाय प्रचलित हिंदी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-संबंधी परिचय में בֶּן का सीधा अर्थ ‘पुत्र’ है; इस संदर्भ में व्यापक अर्थ ‘वंशज’ की आवश्यकता नहीं है।
- source_word: צוּעָר
  choice: सूआर
  rationale: यह व्यक्ति का नाम है; हिब्रू उच्चारण को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण चुना गया है।
