  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट वाक्य-विन्यास अपनाया गया है। ‘पूर्वजों के गोत्र के अनुसार’ मूल के पैतृक वंश-संबंध को बनाए रखता है; कोई सांप्रदायिक व्याख्या नहीं जोड़ी गई।
