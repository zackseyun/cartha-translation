base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/047.yaml
  text: But the Levites, by their ancestral tribe, were not counted among them.
translation:
  language: hi
  text: परन्तु लेवी अपने पैतृक गोत्र के अनुसार उनके बीच नहीं गिने गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: परन्तु लेवियों
  rationale: संदर्भ में וְ पिछले पदों में गिने गए अन्य गोत्रों और लेवियों के बीच विरोध दिखाता है; इसलिए ‘परन्तु’ स्वाभाविक है। לְוִיִּם का प्रचलित हिन्दी रूप ‘लेवी’ का बहुवचन ‘लेवियों’ है।
- source_word: לְמַטֵּה אֲבֹתָם
  choice: उनके पूर्वजों के गोत्र के अनुसार
  rationale: מַטֶּה यहाँ जनगणना के संदर्भ में ‘गोत्र’ है और אֲבֹתָם पैतृक/वंशगत पूर्वजों को सूचित करता है। यह अनुवाद मूल की संरचना और वंशगत भाव दोनों को स्पष्ट रखता है।
- source_word: לֹא הָתְפָּקְדוּ
  choice: गिनती ... नहीं की गई
  rationale: פקד का हित्पाएल रूप यहाँ आधिकारिक जनगणना में दर्ज या गिने जाने को दर्शाता है। ‘गिनती नहीं की गई’ वर्तमान हिन्दी में स्पष्ट है और अध्याय के संदर्भ से मेल खाता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: בְּתוֹךְ का अर्थ ‘बीच में’ है; यहाँ यह अन्य गिने गए गोत्रों के समूह में सम्मिलित होने का भाव देता है।
theological_decisions: []
