source:
  edition: WLC
  text: לִ/בְנֵ֣י יְהוּדָ֔ה תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/026.yaml
  text: 'For the sons of Judah[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male going out to war:'
translation:
  language: hi
  text: 'यहूदा के वंशजों के लिए: उनकी पीढ़ियों के अनुसार, उनके कुलों के अनुसार, उनके पैतृक घरानों के अनुसार, नामों की संख्या के अनुसार, बीस वर्ष और उससे अधिक आयु के युद्ध के लिए निकलनेवाले सभी पुरुष:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर जनगणना के इस प्रसंग में यह यहूदा से उत्पन्न गोत्र-सदस्यों को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों
  rationale: यह शब्द पीढ़ियों, वंशक्रम या वंशावली-संबंधी अभिलेख का बोध करा सकता है; यहाँ जनगणना की वंशगत व्यवस्था के लिए ‘वंशावलियों’ उपयुक्त है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के वंश-समूह को दर्शाता है; ‘कुल’ हिन्दी में इस सामाजिक इकाई को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृ-कुलों
  rationale: शाब्दिक वाक्यांश ‘उनके पिताओं के घरानों’ का आशय पितृवंशीय पारिवारिक इकाइयाँ है; ‘पितृ-कुल’ संरचना और अर्थ दोनों सुरक्षित रखता है।
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: नामों की संख्या के आधार पर
  rationale: मूल का अर्थ व्यक्तियों को नाम लेकर गिनना है; यह रूप हिब्रू सूत्र के निकट और हिन्दी में स्पष्ट है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह जनगणना की निर्धारित न्यूनतम आयु को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष, जो सेना में जानेवाले थे
  rationale: वाक्यांश शाब्दिक रूप से ‘हर एक जो सेना के लिए निकलता है’ कहता है। संदर्भ पुरुषों का है; ‘जानेवाले थे’ मूल की सक्रिय अभिव्यक्ति को रखता है और ‘योग्य’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: जनगणना की लिंग-विशिष्ट भाषा
  choice: वे सभी पुरुष, जो सेना में जानेवाले थे
  alternative: वे सभी, जो सेना में जानेवाले थे
  rationale: हिब्रू रूप व्याकरणतः पुल्लिंग है और प्रसंग सैन्य आयु के पुरुषों की गणना का है; इसलिए लिंग-विशिष्ट आशय को अस्पष्ट नहीं किया गया।
- issue: יֹצֵא צָבָא में सैन्य पात्रता बनाम वास्तविक प्रस्थान
  choice: सेना में जानेवाले थे
  alternative: युद्ध के लिए योग्य थे
  rationale: मूल मुहावरा सैन्य सेवा में निकलनेवालों को दर्शाता है। ‘योग्य’ संदर्भगत अर्थ स्पष्ट करता, पर मूल में अलग से सामर्थ्य का शब्द नहीं है; इसलिए अपेक्षाकृत निकट और फिर भी स्वाभाविक रूप चुना गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। पद पिछले जनगणना-वाक्य से व्याकरणतः जुड़ा है, पर स्वतंत्र प्रस्तुति में अर्थ पूरा करने के लिए ‘गिनती ... की गई’ जोड़ा गया है। ‘गोत्र’ के स्थान पर ‘कुल’ और ‘पितृ-कुल’ का भेद रखा गया है।
