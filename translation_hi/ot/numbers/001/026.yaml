  to: 'यहूदा के वंशजों के लिए: उनकी पीढ़ियों के अनुसार, उनके कुलों के अनुसार, उनके पैतृक घरानों के अनुसार, नामों की संख्या के अनुसार, बीस वर्ष और उससे अधिक आयु के युद्ध के लिए निकलनेवाले सभी पुरुष:'
