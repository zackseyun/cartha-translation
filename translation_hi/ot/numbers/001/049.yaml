  text: אַ֣ךְ אֶת מַטֵּ֤ה לֵוִי֙ לֹ֣א תִפְקֹ֔ד וְ/אֶת רֹאשָׁ֖/ם לֹ֣א תִשָּׂ֑א בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/049.yaml
  text: Only the tribe of Levi you shall not count[a], and you shall not take their number among the sons of Israel.
translation:
  language: hi
  text: “परन्तु लेवी के गोत्र की गिनती न करना, और इस्राएल के पुत्रों[a] के बीच उनकी संख्या न लेना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों के बीच।” इब्रानी में, “इस्राएल के पुत्रों के बीच।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यह शब्द पहले दिए गए जनगणना-संबंधी निर्देश से लेवी के गोत्र को अपवाद ठहराता है; ‘केवल’ उसके प्रतिबंधात्मक भाव को स्पष्ट रखता है।
- source_word: מַטֵּה לֵוִי
  choice: लेवी का गोत्र
  rationale: जनगणना के इस प्रसंग में מַטֶּה का अर्थ ‘गोत्र’ है, न कि उसका मूल भौतिक अर्थ ‘लाठी’।
- source_word: תִפְקֹד
  choice: गिनती करना
  rationale: פקד यहाँ जनगणना में लोगों को गिनने या उनका पंजीकरण करने के अर्थ में है; ‘गिनती करना’ साधारण पाठक के लिए सहज और प्रसंगानुकूल है।
- source_word: רֹאשָׁם ... תִשָּׂא
  choice: उनकी संख्या लेना
  rationale: शाब्दिक रूप से ‘उनका सिर उठाना’ जनगणना-संबंधी मुहावरा है। ‘उनकी संख्या लेना’ उसका अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּתוֹךְ
  choice: के बीच
  rationale: यहाँ यह बड़े समुदाय की गिनती में सम्मिलित होने का संबंध बताता है; ‘के बीच’ मूल संरचना और आशय दोनों को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के पुल्लिंग बहुवचन पदबंध को पारदर्शी ढंग से सुरक्षित रखता है, जो पूरी जाति के लिए प्रचलित सामुदायिक पदनाम भी है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंग-सूचक सामुदायिक पदनाम
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल इब्रानी पदबंध व्याकरण की दृष्टि से पुल्लिंग बहुवचन है और राष्ट्र के लिए पारंपरिक सामुदायिक नाम का काम करता है। मुख्य पाठ में उसके रूप को सुरक्षित रखा गया है, जबकि स्वाभाविक सामूहिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दोनों निषेधात्मक आदेश सीधे संबोधन में हैं। जनगणना के मुहावरे का अर्थ सहज हिन्दी में दिया गया है, पर ‘इस्राएल के पुत्रों’ की मूल लिंग-सूचक अभिव्यक्ति को बनाए रखा गया है।
