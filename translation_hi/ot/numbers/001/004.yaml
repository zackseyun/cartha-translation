  text: And with you there shall be a man from each tribe[a], each man the head of his fathers’ house.
translation:
  language: hi
  text: और तुम्हारे साथ हर गोत्र से एक-एक पुरुष होगा; हर एक अपने पितृकुल का मुखिया होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִתְּ/כֶם
  choice: और तुम्हारे साथ
  rationale: यह वाक्यांश मूसा और हारून के साथ जनगणना के कार्य में उपस्थित रहने वाले प्रतिनिधियों को प्रस्तुत करता है।
- source_word: יִהְיוּ
  choice: हो
  rationale: संदर्भ में अपूर्ण क्रिया का निर्देशात्मक भाव है; हिंदी में ‘हो’ इसे स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: אִישׁ אִישׁ לַ/מַּטֶּה
  choice: हर गोत्र से एक-एक पुरुष
  rationale: אִישׁ אִישׁ का दोहराव वितरणात्मक है, अर्थात प्रत्येक गोत्र से एक प्रतिनिधि; ‘एक-एक’ इस बल को स्पष्ट रखता है।
- source_word: מַטֶּה
  choice: गोत्र
  rationale: गिनती की पुस्तक में यह शब्द इस संदर्भ में इस्राएल की गोत्रीय इकाई को दर्शाता है, न कि शाब्दिक डंडे को।
- source_word: אִישׁ רֹאשׁ
  choice: वह ... मुखिया
  rationale: यह पद उसी पुरुष को उसके नेतृत्वकारी पद से परिभाषित करता है; ‘मुखिया’ आधुनिक हिंदी में स्वाभाविक है और ‘सिर’ के इब्रानी रूपक का पदगत अर्थ देता है।
- source_word: לְ/בֵית אֲבֹתָי/ו
  choice: अपने पितृकुल का
  rationale: ‘पितृकुल’ पैतृक वंश पर आधारित परिवार अथवा कुल-समूह को संक्षेप और स्पष्टता से व्यक्त करता है; केवल ‘परिवार’ कहने से सामाजिक संरचना का संकेत कम हो जाता।
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम को हिंदी में स्पष्ट रखा गया है, जिससे प्रत्येक चुने हुए पुरुष के पितृकुल का मुखिया होने पर बल बना रहता है।
