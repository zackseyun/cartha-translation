base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/040.yaml
  text: 'For the sons of Asher[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: hi
  text: 'आशेर के पुत्रों में से, उनकी वंशावलियों के अनुसार, उनके कुलों के अनुसार, उनके पिताओं के घरानों के अनुसार, नामों की संख्या के अनुसार, बीस वर्ष की आयु से और उससे ऊपर के, वे सब जो युद्ध के लिए निकलते हैं[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “हर एक जो सेना के लिए निकलता है”; यह युद्ध या सैन्य सेवा के लिए निकलने वालों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי אָשֵׁר
  choice: आशेर के वंशजों में से
  rationale: यह पद आशेर के गोत्र की जनगणना का परिचय देता है। हिन्दी में ‘वंशज’ सामूहिक गोत्रगत अर्थ को स्वाभाविक रूप से व्यक्त करता है, जबकि मूल के पुत्र-संबंधी भाव को बनाए रखता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: जनगणना के इस प्रसंग में यह शब्द वंशक्रम अथवा वंशगत विभाजन को सूचित करता है; ‘वंशावलियाँ’ मूल अर्थ के निकट और आधुनिक हिन्दी में स्पष्ट है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर की नातेदारी-इकाई है; ‘कुल’ व्यापक ‘परिवार’ की अपेक्षा अधिक सटीक है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृ-परिवारों के अनुसार
  rationale: यह इस्राएली सामाजिक इकाई ‘पिताओं के घराने’ को दर्शाता है। ‘पितृ-परिवार’ मूल की पितृवंशीय संरचना को रखते हुए हिन्दी में सहज है।
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: नामों की गिनती करके
  rationale: वाक्यांश व्यक्तियों को नाम के आधार पर गिनने की प्रक्रिया बताता है; यह हिन्दी में शाब्दिक ‘नामों की संख्या के अनुसार’ से अधिक स्वाभाविक है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह जनगणना के लिए निर्धारित न्यूनतम आयु को स्पष्ट और संक्षिप्त आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष ... जो युद्ध के लिए निकलने योग्य थे
  rationale: यह इब्रानी मुहावरा सैन्य सेवा के पात्र पुरुषों को सूचित करता है। ‘पुरुष’ अध्याय के जनगणना-संदर्भ से स्पष्ट है और ‘योग्य’ मुहावरे का आशय सामने लाता है।
