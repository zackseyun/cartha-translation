  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज जनगणना-वर्णन। वंशगत तकनीकी पदों के लिए ‘वंशावली’, ‘कुल’ और ‘पितृ-परिवार’ रखे गए हैं। पद को हिन्दी में पूर्ण वाक्य बनाया गया है, यद्यपि इब्रानी में यह अगले पद की संख्या-सूचना की ओर ले जाने वाला शीर्षकीय खंड है।
