  text: आशेर गोत्र के गिने गए लोगों की संख्या इकतालीस हज़ार पाँच सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: गिने गए लोगों की संख्या
  rationale: यह रूप जनगणना में दर्ज या गिने गए लोगों को सूचित करता है। हिंदी में यह वाक्यांश जनगणना का भाव स्वाभाविक रूप से व्यक्त करता है; ‘लोगों’ से आशय स्पष्ट होता है, जबकि मूल पद स्वयं यहाँ ‘पुरुष’ शब्द नहीं जोड़ता।
- source_word: לְמַטֵּה
  choice: के गोत्र में
  rationale: इस जनगणना-सूत्र में לְ के साथ מַטֶּה गिने गए लोगों की गोत्रीय संबद्धता बताता है। ‘के गोत्र में’ आधुनिक हिंदी में सहज है।
- source_word: אָשֵׁר
  choice: आशेर
  rationale: गोत्र के व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण रखा गया है।
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: इकतालीस हज़ार पाँच सौ
  rationale: हिब्रू संख्या-क्रम का ठीक संख्यात्मक मूल्य आधुनिक हिंदी की स्वाभाविक शब्दावली और क्रम में दिया गया है।
