source:
  edition: WLC
  text: לִ/בְנֵ֣י זְבוּלֻ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/030.yaml
  text: 'For the sons of Zebulun[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: hi
  text: 'ज़बूलून के वंशजों के लिए, उनकी पीढ़ियों के अनुसार, उनके कुलों के अनुसार, उनके पितरों के घरानों के अनुसार, नामों की संख्या के अनुसार, बीस वर्ष और उससे अधिक आयु का हर पुरुष, जो युद्ध के लिए निकलता है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי זְבוּלֻן
  choice: जबूलून के वंशजों में से
  rationale: जनगणना की इस सूची में לִבְנֵי गोत्र के सदस्यों को प्रस्तुत करता है। आधुनिक हिन्दी में ‘वंशज’ आशय को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘में से’ आगे आने वाली गिनती से इसका संबंध स्पष्ट करता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: यहाँ תּוֹלְדֹת वंश और वंश-संबंधी अभिलेख के आधार पर वर्गीकरण बताता है; ‘वंशावलियाँ’ उसके वंशगत अर्थ को बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर विस्तृत रिश्तेदारी-समूह को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में संक्षिप्त और उपयुक्त है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों के अनुसार
  rationale: शाब्दिक ‘उनके पिताओं के घरानों’ की अपेक्षा ‘पितृकुल’ तकनीकी रिश्तेदारी इकाई को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: नामों की गिनती के आधार पर
  rationale: मूल पद व्यक्तिगत नामों के अनुसार की गई गणना पर बल देता है; यह अनुवाद उस प्रशासनिक भाषा को सहज हिन्दी में बनाए रखता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह आयु-सीमा का मानक सूत्र है; चुनी हुई अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष ... जो युद्ध में जाने योग्य थे
  rationale: יֹצֵא צָבָא का शाब्दिक सैन्य मुहावरा ‘सेना/युद्ध के लिए निकलने वाला’ है। संदर्भ में इसका आशय सैन्य सेवा के योग्य पुरुषों से है; मुख्य पाठ मूल की युद्ध-संबंधी छवि भी बनाए रखता है।
theological_decisions:
- issue: सैन्य जनगणना में पुरुष-संदर्भ
  choice: वे सभी पुरुष ... जो युद्ध में जाने योग्य थे
  alternative: वे सभी लोग जो सैनिक सेवा के योग्य थे
  rationale: यद्यपि כֹּל स्वयं व्याकरणतः ‘सब/हर एक’ है और ‘पुरुष’ के लिए अलग संज्ञा नहीं दी गई, बीस वर्ष से ऊपर की इस सैन्य जनगणना का संदर्भ पुरुषों को लक्षित करता है। ‘पुरुष’ संदर्भगत दायरे को स्पष्ट करता है, जबकि ‘युद्ध में जाने योग्य’ मूल मुहावरे को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; जनगणना-सूत्र की औपचारिक, क्रमबद्ध शैली को बनाए रखते हुए अत्यधिक कृत्रिम शब्दानुक्रम से बचा गया है। पद के अंत का द्विबिंदु आगे आने वाली संख्या से इसके संबंध को दर्शाता है।
