  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בִ/נְסֹ֣עַ הַ/מִּשְׁכָּ֗ן יוֹרִ֤ידוּ אֹת/וֹ֙ הַ/לְוִיִּ֔ם וּ/בַ/חֲנֹת֙ הַ/מִּשְׁכָּ֔ן יָקִ֥ימוּ אֹת֖/וֹ הַ/לְוִיִּ֑ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/051.yaml
  text: When the tabernacle is to set out[a], the Levites shall take it down; and when the tabernacle is to camp, the Levites shall set it up. And the outsider who comes near shall be put to death.
translation:
  language: hi
  text: जब पवित्र निवास कूच करे, तब लेवी उसे उतारें; और जब पवित्र निवास पड़ाव डाले, तब लेवी उसे खड़ा करें। जो बाहरी व्यक्ति[a] पास आए, वह मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पराया व्यक्ति’ अथवा ‘अनधिकृत व्यक्ति’; इब्रानी शब्द यहाँ ऐसे व्यक्ति को सूचित करता है जिसे पवित्रस्थान के पास आने या उसकी सेवा में भाग लेने का अधिकार नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבִנְסֹעַ
  choice: जब ... कूच करे
  rationale: ב के साथ נסע का infinitive construct समयसूचक उपवाक्य बनाता है। ‘कूच करे’ आगे यात्रा आरम्भ करने का भाव स्वाभाविक और संक्षिप्त रूप में व्यक्त करता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और यहाँ वह इस्राएल के चलायमान पवित्रस्थान को सूचित करता है। ‘पवित्र’ संदर्भगत अर्थ स्पष्ट करता है और इसे אֹהֶל מוֹעֵד, ‘मिलापवाला तंबू’, से नहीं मिलाता।
- source_word: יוֹרִידוּ אֹתוֹ
  choice: उसे खोलें
  rationale: ירד के Hiphil रूप का यहाँ आशय यात्रा के लिए पवित्र निवास को नीचे उतारकर अलग-अलग करना है। हिंदी में किसी तंबू-जैसी संरचना के लिए ‘खोलना’ स्वाभाविक है।
- source_word: הַלְוִיִּם
  choice: लेवी
  rationale: यह लेवी गोत्र के अधिकृत सेवकों का मानक हिंदी पदनाम है।
- source_word: וּבַחֲנֹת
  choice: जब ... पड़ाव डाले
  rationale: חנה का अर्थ डेरा या पड़ाव डालना है। यह मूल पाठ में पवित्र निवास को वाक्य का कर्ता बनाए रखने के साथ यात्रा के विपरीत चरण को स्पष्ट करता है।
- source_word: יָקִימוּ אֹתוֹ
  choice: उसे खड़ा करें
  rationale: קום के Hiphil का अर्थ यहाँ पवित्र निवास को फिर से खड़ा करना है; ‘खड़ा करें’ आधुनिक हिंदी में स्पष्ट और ठोस है।
- source_word: וְהַזָּר
  choice: जो बाहरी व्यक्ति[a]
  rationale: זָר इस पवित्रस्थान-संबंधी संदर्भ में अधिकृत सेवा से बाहर के व्यक्ति को बताता है, आवश्यक रूप से किसी विदेशी जाति के व्यक्ति को नहीं। ‘बाहरी व्यक्ति’ मूल की व्यापकता रखता है और पादटिप्पणी अधिकृतता का संदर्भ स्पष्ट करती है।
- source_word: הַקָּרֵב
  choice: पास आए
  rationale: קרב का participle पवित्रस्थान के निकट आने को व्यक्त करता है। ‘पास आए’ सीधा और सहज है।
- source_word: יוּמָת
  choice: मार डाला जाए
  rationale: מות का Hophal रूप लगाई गई मृत्यु-दंडात्मक परिणति व्यक्त करता है, केवल स्वाभाविक मृत्यु नहीं। कर्मवाच्य मूल पाठ की तरह दंड देने वाले कर्ता को अनिर्दिष्ट रखता है।
theological_decisions:
- issue: יוּמָת में दंड का स्वरूप
  choice: 'दंडात्मक कर्मवाच्य: ‘मार डाला जाए’'
  alternative: 'परिणामसूचक: ‘मर जाए’'
  rationale: Hophal रूप सामान्यतः मृत्यु दिए जाने को सूचित करता है। अनुवाद मानव या ईश्वरीय कर्ता तय किए बिना कानूनी-पवित्रता संबंधी चेतावनी बनाए रखता है।
- issue: זָר का संदर्भ
  choice: पवित्रस्थान की अधिकृत सेवा से बाहर का व्यक्ति
  alternative: जातीय रूप से विदेशी व्यक्ति; अथवा हर गैर-लेवी व्यक्ति
  rationale: याजकीय संदर्भों में זָר प्रायः अधिकृत पवित्र भूमिका से बाहर होने को दर्शाता है। मुख्य पाठ का ‘बाहरी व्यक्ति’ संभावित व्यापकता बनाए रखता है, जबकि पादटिप्पणी संदर्भगत अर्थ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पवित्र निवास’ मूल מִשְׁכָּן के अर्थ को सामने लाता है; ‘खोलें/खड़ा करें’ चलायमान तंबू-जैसी संरचना की व्यावहारिक क्रियाओं को स्वाभाविक हिंदी में व्यक्त करते हैं।
