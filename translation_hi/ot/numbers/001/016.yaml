  yaml_path: translation/ot/numbers/001/016.yaml
  text: These were the ones called from the congregation[a], the leaders of their fathers’ tribes[b], the heads of the thousands of Israel.
translation:
  language: hi
  text: ये मंडली के बुलाए हुए लोग[a] थे—अपने पितरों के गोत्रों के प्रधान और इस्राएल के हज़ारों के मुखिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मंडली में से बुलाए हुए लोग।” इब्रानी कृदन्त का अर्थ बुलाए गए, बुलाहट पाने वाले, या नामित किए गए लोग हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल के हज़ारों” का अर्थ सचमुच एक-एक हज़ार के समूह हो सकता है, या व्यापक रूप से इस्राएल के कुलगत अथवा सैनिक विभागों की ओर संकेत कर सकता है।
    reason: lexical_alternative
