- source_word: אֵלֶּה
  choice: ये ... लोग थे
  rationale: बहुवचन संकेतवाचक को स्वाभाविक हिन्दी पहचान-वाक्य में व्यक्त किया गया है।
- source_word: קריאי הָעֵדָה
  choice: मंडली में से बुलाए हुए लोग
  rationale: निष्क्रिय कृदन्त में बुलाए, तलब किए या नामित किए जाने का भाव है। 'बुलाए हुए' उसके मूल बल को रखता है; 'में से' प्रसंगानुकूल चयन का संबंध बताता है, जबकि पादटिप्पणी रचना की सम्भव वैकल्पिक समझ सुरक्षित रखती है।
- source_word: נְשִׂיאֵי
  choice: प्रधान
  rationale: गोत्रीय प्रशासनिक संदर्भ में ऊँचे पद के अगुओं के लिए गरिमापूर्ण और सुबोध हिन्दी शब्द।
- source_word: מַטּוֹת אֲבוֹתָם
  choice: अपने पितरों के गोत्रों
  rationale: पैतृक वंश-संबंध और गोत्रीय विभाजन दोनों को स्पष्ट रखता है।
- source_word: רָאשֵׁי
  choice: मुखिया
  rationale: अधिकार रखने वाले प्रमुख व्यक्तियों का स्वाभाविक हिन्दी रूप; अगले पद में 'प्रधान' की पुनरावृत्ति से भी बचता है।
- source_word: אַלְפֵי יִשְׂרָאֵל
  choice: इस्राएल के हज़ारों
  rationale: शाब्दिक संख्या तथा कुलगत या सैनिक इकाइयों की सम्भावना को किसी एक अर्थ में सीमित किए बिना सुरक्षित रखता है।
- source_word: הֵם
  choice: थे
  rationale: अन्तिम स्वतंत्र सर्वनाम की पहचानात्मक शक्ति हिन्दी के विधेय और बहुवचन क्रिया में स्वाभाविक रूप से व्यक्त होती है।
