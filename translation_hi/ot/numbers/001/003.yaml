  text: מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵ֑ל תִּפְקְד֥וּ אֹתָ֛/ם לְ/צִבְאֹתָ֖/ם אַתָּ֥ה וְ/אַהֲרֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/003.yaml
  text: From twenty years old and upward[b][a], every man going out to war in Israel—you and Aaron shall count them by their companies.
translation:
  language: hi
  text: बीस वर्ष और उससे अधिक आयु के, इस्राएल में युद्ध के लिए निकलने वाले हर पुरुष को तुम और हारून उनके सैन्य दलों के अनुसार गिनो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह इब्रानी मुहावरा पात्रता की न्यूनतम आयु बताता है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: כָּל יֹצֵא צָבָא
  choice: युद्ध के लिए निकलने योग्य हर पुरुष
  rationale: यह सैन्य सेवा के योग्य पुरुषों के लिए प्रयुक्त सैन्य मुहावरा है। 'हर पुरुष' एकवचन रूप और अध्याय के पुरुष-जनगणना संदर्भ को व्यक्त करता है, जबकि 'निकलने योग्य' पात्रता का भाव स्पष्ट करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: यह राष्ट्रीय समुदाय के भीतर होने का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: תִּפְקְדוּ אֹתָם
  choice: गिनो
  rationale: इस जनगणना-संदर्भ में क्रिया का अर्थ सेवा के लिए गणना अथवा पंजीकरण करना है; 'गिनो' सरल आधुनिक हिंदी है।
- source_word: לְצִבְאֹתָם
  choice: उनके सैन्य दलों के अनुसार
  rationale: यह पद सैन्य संगठन की इकाइयों के अनुसार गणना का संकेत देता है; 'सैन्य दल' अर्थ को स्पष्ट रखते हुए सहज हिंदी प्रदान करता है।
- source_word: אַתָּה וְאַהֲרֹן
  choice: तुम और हारून
  rationale: मूसा को संबोधित स्पष्ट सर्वनाम और हारून का नाम, गणना करने वाले दोनों व्यक्तियों पर स्रोत का बल बनाए रखते हैं।
theological_decisions:
- issue: सैन्य पात्रता का लिंग-विशिष्ट वर्णन
  choice: हर पुरुष
  alternative: हर व्यक्ति
  rationale: इस अध्याय में जनगणना विशेष रूप से सैन्य सेवा के योग्य पुरुषों की है; इसलिए लिंग-विशिष्ट भाषा स्रोत और संदर्भ के अनुरूप है।
- issue: יֹצֵא צָבָא में वास्तविक प्रस्थान या सेवा-पात्रता
  choice: युद्ध के लिए निकलने योग्य
  alternative: युद्ध के लिए निकलने वाला
  rationale: यह अभिव्यक्ति सैन्य सेवा की पात्रता का मुहावरा है। 'योग्य' जोड़ने से संदर्भगत अर्थ स्पष्ट होता है, यद्यपि अधिक शाब्दिक विकल्प वास्तविक प्रस्थान की छवि को अधिक निकटता से रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। सैन्य संदर्भ को 'युद्ध' और 'सैन्य दलों' द्वारा स्पष्ट किया गया है; अनावश्यक पुरातन शब्दावली से बचा गया है।
