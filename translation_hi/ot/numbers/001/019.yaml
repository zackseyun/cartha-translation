  text: כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶׁ֑ה וַֽ/יִּפְקְדֵ֖/ם בְּ/מִדְבַּ֥ר סִינָֽי־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/019.yaml
  text: just as Yahweh had commanded Moses[a], so he counted them in the wilderness of Sinai.
translation:
  language: hi
  text: जैसा याहवे ने मूसा को आज्ञा दी थी, वैसे ही मूसा ने सीनै के निर्जन प्रदेश में उनकी गिनती की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें सूचीबद्ध किया” अथवा “उन्हें गिनकर दर्ज किया।” इब्रानी क्रिया का अर्थ लोगों की गणना करना या उन्हें सूची में दर्ज करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा…वैसे ही
  rationale: यह रचना पहले दिए गए आदेश के अनुरूप कार्य किए जाने को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया का अर्थ ‘आज्ञा देना’ है; ‘दी थी’ दिखाता है कि आज्ञा गिनती किए जाने से पहले दी गई थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: וַיִּפְקְדֵם
  choice: उसने उनकी गिनती की
  rationale: इस जनगणना-संदर्भ में פקד का आशय लोगों को गिनने अथवा सूचीबद्ध करने से है; मुख्य पाठ में सरल और स्पष्ट विकल्प रखा गया है।
- source_word: בְּמִדְבַּר סִינָי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר ऐसे निर्जन, विरल आबादी वाले भूभाग को दर्शाता है; यह हिन्दी पदबंध ‘जंगल’ से उत्पन्न संभावित भ्रम से बचता है और इब्रानी संबंध को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में परिचित ‘यहोवा’ चुना गया है; उच्चारण के अधिक समीप माना जाने वाला ‘याहवे’ भी संभव लिप्यंतरण है।
- issue: וַיִּפְקְדֵם में कर्ता की पहचान
  choice: उसने
  alternative: मूसा ने
  rationale: इब्रानी में कर्ता सर्वनाम क्रिया में निहित है और निकट संदर्भ से मूसा समझा जाता है। मूल की अभिव्यक्ति बनाए रखने के लिए नाम दोहराने के बजाय सर्वनाम रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘निर्जन प्रदेश’ भौगोलिक अर्थ को स्पष्ट करता है, जबकि ‘गिनती की’ सामान्य पाठक के लिए सहज है; नामांकन की व्यापक अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
