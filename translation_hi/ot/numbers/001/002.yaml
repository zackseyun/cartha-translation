source:
  edition: WLC
  text: שְׂא֗וּ אֶת רֹאשׁ֙ כָּל עֲדַ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמ֔וֹת כָּל זָכָ֖ר לְ/גֻלְגְּלֹתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], by their clans, by their fathers’ houses, according to the number of names, every male[c][b], head by head.
translation:
  language: hi
  text: “इस्राएलियों की सारी मण्डली की जनगणना करो—उनके कुलों के अनुसार, उनके पितरों के घरानों के अनुसार, नामों की संख्या के अनुसार, हर एक पुरुष को एक-एक व्यक्ति के हिसाब से।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जनगणना करो” का शाब्दिक रूप “सिर उठाओ” है। “एक-एक व्यक्ति के हिसाब से” का शाब्दिक रूप “उनकी खोपड़ियों/सिरों के अनुसार” है। ये पद यहाँ व्यक्तियों को नाम से दर्ज करके गिनने की जनगणना-संबंधी भाषा हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת רֹאשׁ
  choice: जनगणना करो
  rationale: शाब्दिक अर्थ ‘सिर उठाओ’ है, पर इस प्रशासनिक प्रसंग में यह जनगणना करने या नाम दर्ज करके गिनने का मुहावरा है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी मण्डली
  rationale: עֲדַת सामुदायिक निकाय को सूचित करता है; ‘मण्डली’ उसके सामूहिक भाव को रखता है। בְּנֵי יִשְׂרָאֵל का स्वाभाविक आधुनिक हिन्दी रूप ‘इस्राएली’ है, जबकि आगे ‘हर एक पुरुष’ स्पष्ट करता है कि किसे गिना जाना है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: यह शब्द गोत्र के भीतर के वंश-सम्बन्धी उपसमूहों को सूचित करता है; हिन्दी में ‘कुल’ इस सामाजिक इकाई को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृ-घरों के अनुसार
  rationale: यह पितृवंश के आधार पर संगठित घरानों को दर्शाता है; ‘पितृ-घर’ मूल की संरचना और वंशगत भाव दोनों को बनाए रखता है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती के आधार पर
  rationale: मूल पाठ नाम दर्ज करके की जाने वाली औपचारिक गणना पर बल देता है; यह रूप उस प्रशासनिक आशय को स्पष्ट रखता है।
- source_word: כָּל זָכָר
  choice: हर एक पुरुष
  rationale: זָכָר यहाँ पुरुष-लिंग के प्रत्येक व्यक्ति को निर्दिष्ट करता है; आधुनिक हिन्दी में ‘हर एक पुरुष’ स्पष्ट और गरिमापूर्ण है।
- source_word: לְגֻלְגְּלֹתָם
  choice: अलग-अलग गिनकर
  rationale: शाब्दिक रूप ‘उनकी खोपड़ियों/सिरों के अनुसार’ है और आशय व्यक्ति-व्यक्ति की गणना है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूर्त हिब्रू मुहावरा पादटिप्पणी में दिया गया है।
