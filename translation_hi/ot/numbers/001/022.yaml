base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/022.yaml
  text: 'For the sons of Simeon[a], by their generations, by their clans, by their fathers’ houses, those numbered of them, by the number of names, head by head, every male from twenty years old and upward[c][b], everyone going out to war:'
translation:
  language: hi
  text: 'शिमोन के वंशजों में से, उनकी वंशावलियों, कुलों और पितृकुलों के अनुसार गिने गए लोग—नामों की संख्या के अनुसार, एक-एक व्यक्ति करके—बीस वर्ष या उससे अधिक आयु का हर पुरुष, जो युद्ध के लिए निकलने वाला था:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: शिमोन के वंशजों में से
  rationale: जनगणना के इस संदर्भ में בני शिमोन से निकले गोत्रीय सदस्यों को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में ‘पुत्रों’ से अधिक स्वाभाविक और संदर्भानुकूल है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: यहाँ תולדות वंशक्रम अथवा वंश-संबंधी अभिलेख को दर्शाता है; ‘वंशावलियों’ से प्रशासनिक-वंशगत भाव बना रहता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: משפחה गोत्र के भीतर के कुल-समूह को दर्शाता है; हिन्दी में ‘कुल’ इस सामाजिक इकाई के लिए संक्षिप्त और स्वाभाविक है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: בית אבות पैतृक वंश पर आधारित सामाजिक इकाई है; ‘पितृकुल’ स्रोत की संरचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: פְּקֻדָיו
  choice: गिने गए लोग
  rationale: פקד का यह रूप जनगणना में दर्ज या गिने गए व्यक्तियों को बताता है; सैन्य संदर्भ के कारण ‘भर्ती किए गए’ भी संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती के अनुसार
  rationale: यह अभिव्यक्ति व्यक्तियों को नाम के आधार पर गिनने की प्रशासनिक प्रक्रिया को बनाए रखती है।
- source_word: לְגֻלְגְּלֹתָם
  choice: एक-एक व्यक्ति करके
  rationale: शाब्दिक अर्थ ‘उनकी खोपड़ियों/सिरों के अनुसार’ है; हिन्दी में इसका आशय व्यक्तिगत रूप से की गई गिनती है।
- source_word: כָּל זָכָר
  choice: हर वह पुरुष
  rationale: זכר यहाँ पुरुष लिंग को निर्दिष्ट करता है; आयु-सीमा के साथ ‘पुरुष’ स्वाभाविक और सटीक है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु का
  rationale: यह आयु की न्यूनतम सीमा बताने वाला मानक सूत्र है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: जो युद्ध के लिए निकलता था
  rationale: यह मूल अभिव्यक्ति के गतिशील और सैन्य भाव को बनाए रखता है; ‘सैनिक सेवा के योग्य’ उसका व्याख्यात्मक विकल्प है।
