id: NUM.1.53
reference: Numbers 1:53
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם יַחֲנ֤וּ סָבִיב֙ לְ/מִשְׁכַּ֣ן הָ/עֵדֻ֔ת וְ/לֹֽא יִהְיֶ֣ה קֶ֔צֶף עַל עֲדַ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/שָׁמְרוּ֙ הַ/לְוִיִּ֔ם אֶת מִשְׁמֶ֖רֶת מִשְׁכַּ֥ן הָ/עֵדֽוּת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/053.yaml
  text: But the Levites shall camp around the tabernacle of the testimony[a], so that there may be no wrath on the congregation of the sons of Israel; and the Levites shall keep charge of the tabernacle of the testimony.
translation:
  language: hi
  text: परन्तु लेवी लोग साक्ष्य के तंबू के चारों ओर डेरे डालें, ताकि इस्राएलियों की मण्डली पर प्रकोप न हो; और लेवी लोग साक्ष्य के तंबू की रखवाली का दायित्व निभाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: परन्तु लेवी
  rationale: वाव पिछले पदों में अन्य गोत्रों की छावनी-व्यवस्था से यहाँ लेवियों की अलग व्यवस्था की ओर विरोधात्मक संक्रमण करता है; इसलिए ‘परन्तु’ स्वाभाविक है।
- source_word: יַחֲנוּ סָבִיב
  choice: चारों ओर डेरे डालें
  rationale: अपूर्ण क्रिया यहाँ निर्देश का भाव रखती है, और סָבִיב स्थानगत रूप से चारों ओर होने को व्यक्त करता है।
- source_word: מִשְׁכַּן הָעֵדֻת
  choice: मिलापवाला तम्बू
  rationale: यह हिन्दी बाइबलीय प्रयोग में इस पवित्र तम्बू का परिचित और सुबोध नाम है; मूल पदबंध का अधिक शाब्दिक अर्थ ‘साक्षी का निवास-स्थान’ है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא יִהְיֶה קֶצֶף
  choice: ताकि ... प्रकोप न हो
  rationale: सन्दर्भ में यह लेवियों की छावनी-व्यवस्था और पहरे का निवारक उद्देश्य बताता है। ‘प्रकोप’ न्यायकारी/ईश्वरीय रोष की गंभीरता बनाए रखता है।
- source_word: עַל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की मण्डली पर
  rationale: עֵדָה के लिए ‘मण्डली’ सामुदायिक अर्थ देता है और בני ישראל का आधुनिक, स्वाभाविक हिन्दी रूप ‘इस्राएली’ है।
- source_word: וְשָׁמְרוּ ... אֶת מִשְׁמֶרֶת
  choice: रखवाली का दायित्व सँभालें
  rationale: शמר और משמרת का संयुक्त प्रयोग केवल कर्तव्य निभाने से अधिक, पवित्र स्थान की चौकसी और सौंपे गए उत्तरदायित्व—दोनों को सूचित करता है।
theological_decisions:
- issue: קֶצֶף का स्वरूप
  choice: ‘प्रकोप’—पवित्र सीमा के उल्लंघन पर होने वाला ईश्वरीय न्याय
  alternative: सामान्य क्रोध या मानवीय नाराज़गी
  rationale: गिनती के पवित्रस्थान-सन्दर्भ में संकट इस्राएल पर पवित्र न्याय के आने का है; फिर भी मुख्य पाठ ‘परमेश्वर का’ जोड़कर उस बात को मूल से अधिक स्पष्ट नहीं करता।
- issue: הָעֵדוּת का अर्थ
  choice: मुख्य पाठ में प्रचलित ‘मिलापवाला तम्बू’, शाब्दिक अर्थ पाद-टिप्पणी में
  alternative: ‘साक्षी का तम्बू’ या ‘विधान-पत्र का निवास-स्थान’
  rationale: הָעֵדוּת पवित्र साक्षी/वाचा-साक्ष्य की ओर संकेत करता है। पाद-टिप्पणी स्रोत-रूप को सुरक्षित रखती है और उसे किसी एक संकीर्ण व्याख्या तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। ‘डेरे डालें’, ‘प्रकोप’ और ‘रखवाली का दायित्व सँभालें’ निर्देश, पवित्र खतरे और लेवियों की सौंपित जिम्मेदारी को स्पष्ट रखते हैं।
