  language: hi
  text: रूबेन के गोत्र में गिने गए पुरुष छियालीस हज़ार पाँच सौ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: गिने गए पुरुष
  rationale: यह रूप जनगणना में दर्ज या गिने गए लोगों को सूचित करता है। अध्याय के प्रसंग में ये सैन्य सेवा के योग्य पुरुष हैं; इसलिए हिन्दी में निहित संदर्भ को स्वाभाविक ढंग से स्पष्ट किया गया है।
- source_word: לְמַטֵּה
  choice: के गोत्र में
  rationale: לְ के साथ מַטֶּה यहाँ गोत्रीय संबद्धता बताता है। ‘के गोत्र में’ आधुनिक हिन्दी में जनगणना के इस सूत्र के लिए स्वाभाविक है।
- source_word: רְאוּבֵן
  choice: रूबेन
  rationale: इब्रानी नाम का हिन्दी में प्रचलित लिप्यंतरण।
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: छियालीस हज़ार पाँच सौ
  rationale: मूल संख्या 46,500 को आधुनिक हिन्दी के सामान्य संख्या-क्रम में ठीक-ठीक व्यक्त किया गया है।
