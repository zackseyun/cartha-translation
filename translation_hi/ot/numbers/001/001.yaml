language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר יְהוָ֧ה אֶל מֹשֶׁ֛ה בְּ/מִדְבַּ֥ר סִינַ֖י בְּ/אֹ֣הֶל מוֹעֵ֑ד בְּ/אֶחָד֩ לַ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בַּ/שָּׁנָ֣ה הַ/שֵּׁנִ֗ית לְ/צֵאתָ֛/ם מֵ/אֶ֥רֶץ מִצְרַ֖יִם לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the tent of meeting, on the first day of the second month, in the second year after they had come out of the land of Egypt, saying,
translation:
  language: hi
  text: 'इस्राएलियों के मिस्र देश से निकलने के बाद दूसरे वर्ष के दूसरे महीने के पहले दिन, सीनै के निर्जन प्रदेश में, मिलने के तंबू[a] में याहवे ने मूसा से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘नियत भेंट/मिलन का तंबू’; परंपरागत हिंदी में ‘मिलापवाला तंबू’।
    reason: इब्रानी אֹהֶל מוֹעֵד का अर्थ उस तंबू से है जो नियत मिलन के लिए था। पारंपरिक पदावली को विकल्प के रूप में रखा गया है।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने कहा
  rationale: यह क्रिया दिव्य वाणी का परिचय देती है। पद के अंत के לֵאמֹר के साथ इसे हिंदी में एक स्वाभाविक वाक्य ‘ने ... से कहा:’ के रूप में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּמִדְבַּר סִינַי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से बाहर के खुले, विरल भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिंदी में ‘जंगल’ से उत्पन्न होने वाली वनाच्छादित क्षेत्र की धारणा से बचता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: भेंट के तंबू में
  rationale: शाब्दिक रूप से यह नियत भेंट अथवा मिलने के तंबू को दर्शाता है। पारंपरिक हिंदी विकल्प को पादटिप्पणी में रखा गया है।
- source_word: בְּאֶחָד לַחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने के पहले दिन
  rationale: इब्रानी तिथि-वाक्यांश का स्पष्ट और स्वाभाविक आधुनिक हिंदी रूप।
- source_word: בַּשָּׁנָה הַשֵּׁנִית לְצֵאתָם
  choice: इस्राएलियों के ... निकलने के दूसरे वर्ष
  rationale: प्रसंगगत बहुवचन प्रत्यय ‘उनके’ का संकेत इस्राएलियों की ओर है; हिंदी में संदर्भ स्पष्ट करने के लिए संज्ञा व्यक्त की गई है और समय-संबंध स्वाभाविक ढंग से रखा गया है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: אֶרֶץ को ‘देश’ के रूप में बनाए रखा गया है और מִן का स्रोत-सूचक अर्थ ‘से’ द्वारा व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: आगे आने वाली प्रत्यक्ष वाणी का संकेत हिंदी के विराम-चिह्न सहित भाषण-सूत्र से दिया गया है; ‘यह कहते हुए’ यहाँ अनावश्यक रूप से अस्वाभाविक होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है; प्राचीन उच्चारण पूर्णतः निश्चित न होने पर भी यह प्रचलित विद्वत् पुनर्निर्माण है।
- issue: לְצֵאתָם में निहित कर्ता की पहचान
  choice: इस्राएलियों के निकलने
  alternative: उनके निकलने
  rationale: व्याकरण में केवल ‘उनके’ है, पर पुस्तक के तत्काल ऐतिहासिक संदर्भ में यह इस्राएलियों को सूचित करता है। स्पष्ट हिंदी के लिए पहचान व्यक्त की गई है, बिना घटना में अतिरिक्त धर्मवैज्ञानिक विवरण जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। इब्रानी वाक्य के लंबे काल-स्थान क्रम को हिंदी में स्वाभाविक बनाने के लिए समय-सूचना पहले रखी गई है, जबकि सभी मूल सूचनाएँ सुरक्षित हैं।
