  text: एप्रैम के गोत्र के गिने हुए लोगों की संख्या चालीस हज़ार पाँच सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: गिने गए पुरुष
  rationale: यह रूप जनगणना में दर्ज या गिने गए लोगों को सूचित करता है। प्रसंग (गिनती 1:20–46) बीस वर्ष और उससे अधिक आयु के युद्ध के योग्य पुरुषों का है; इसलिए ‘गिने गए पुरुष’ स्वाभाविक और संदर्भानुकूल है।
- source_word: לְמַטֵּה
  choice: के गोत्र में
  rationale: यहाँ לְ के साथ מַטֶּה जनगणना में गोत्रीय संबद्धता बताता है; आधुनिक हिन्दी में ‘के गोत्र में’ स्पष्ट और सहज है।
- source_word: אֶפְרָיִם
  choice: एप्रैम
  rationale: हिब्रू नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: אַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: चालीस हज़ार पाँच सौ
  rationale: मूल संख्या का सीधा शब्दात्मक अनुवाद, जो सतत गद्य में स्वाभाविक और गरिमापूर्ण है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, स्पष्ट और गरिमापूर्ण जनगणना-सूत्र। ‘दर्ज किए गए’ की अपेक्षा ‘गिने गए’ मूल धातु और निकटवर्ती प्रसंग को अधिक सीधे व्यक्त करता है।
