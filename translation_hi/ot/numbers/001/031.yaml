  language: hi
  text: ज़बूलून गोत्र के पंजीकृत लोगों की संख्या 57,400 थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: पंजीकृत पुरुषों
  rationale: यह रूप פקד से है और जनगणना में गिने या दर्ज किए गए लोगों को दर्शाता है। प्रसंग में गिने जाने वाले बीस वर्ष और उससे अधिक आयु के युद्ध-योग्य पुरुष हैं, इसलिए ‘पंजीकृत पुरुषों’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: לְמַטֵּה
  choice: गोत्र में
  rationale: इस बार-बार आने वाले जनगणना-सूत्र में לְמַטֵּה गोत्रीय संबद्धता बताता है। हिंदी में ‘गोत्र में पंजीकृत’ सहज रूप से यही अर्थ व्यक्त करता है।
- source_word: זְבוּלֻן
  choice: ज़बूलून
  rationale: इब्रानी जनजातीय नाम का देवनागरी लिप्यंतरण, जिसमें आरंभिक ז की ध्वनि और दीर्घ स्वर को यथासंभव रखा गया है।
- source_word: שִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: 57,400
  rationale: इब्रानी संख्या का ठीक योग सत्तावन हज़ार चार सौ है। आधुनिक पठनीयता के लिए इसे अंकों में दिया गया है।
