source:
  edition: WLC
  text: בְּנֵ֣י נַפְתָּלִ֔י תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/042.yaml
  text: 'The sons of Naphtali[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: hi
  text: 'नप्ताली के पुत्र: उनकी वंशावलियों, उनके कुलों और उनके पितरों के घरानों के अनुसार, नामों की संख्या के अनुसार—बीस वर्ष और उससे अधिक आयु के वे सभी पुरुष जो सेना में सेवा करने योग्य थे[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “वे सभी, जो सेना के लिए निकलते थे” या “वे सभी, जो युद्ध के लिए निकलते थे।” इब्रानी मुहावरे का आशय सैन्य सेवा के योग्य लोगों से है।
    reason: इब्रानी כֹּל יֹצֵא צָבָא के सैन्य मुहावरे और उसके अधिक शाब्दिक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: नप्ताली के पुत्रों
  rationale: शाब्दिक अर्थ ‘नप्ताली के पुत्र’ है; जनगणना के इस प्रसंग में इससे नप्ताली के पुरुष वंशज अभिप्रेत हैं। ‘पुत्रों’ से मूल का वंशगत और लिंग-संबंधी बल बना रहता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: यह शब्द वंशक्रम अथवा वंशगत विभाजन को दर्शाता है; ‘वंशावलियों’ से जनगणना-सूत्र का औपचारिक भाव स्पष्ट रहता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: इस गोत्रीय संदर्भ में מִשְׁפָּחָה आधुनिक छोटे परिवार से बड़ी वंशगत इकाई है, इसलिए ‘कुल’ उपयुक्त है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों के अनुसार
  rationale: यह इस्राएली समाज की पिता के वंश पर आधारित पारिवारिक इकाइयों का संकेत है; ‘पितृकुल’ इसे संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּמִסְפַּר שֵׁמֹת
  choice: एक-एक नाम लेकर गिनती
  rationale: इब्रानी पदबंध नामों के आधार पर व्यक्तियों की गणना बताता है। ‘एक-एक नाम लेकर’ हिंदी में इस प्रक्रिया को सहजता से व्यक्त करता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह अध्याय में प्रयुक्त आयु-सीमा का सूत्र है; चुना हुआ रूप आधुनिक हिंदी में स्पष्ट और मूल के निकट है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी, जो सेना में सेवा करने योग्य थे
  rationale: शाब्दिक भाव ‘हर वह जो सेना के लिए निकलता है’ है। जनगणना के संदर्भ में यह सैन्य सेवा की पात्रता को दर्शाता है; मुख्य पाठ में अर्थ स्पष्ट किया गया और अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
