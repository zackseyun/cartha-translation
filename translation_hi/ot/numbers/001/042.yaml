translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली रखी गई है। पद की जनगणना-संबंधी सूची को स्वाभाविक हिंदी वाक्य बनाया गया है, जबकि मूल की वंशगत श्रेणियाँ और सैन्य पात्रता का भाव सुरक्षित हैं।
