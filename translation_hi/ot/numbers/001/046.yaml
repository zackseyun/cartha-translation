    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: इस प्रकार ... थी
  rationale: वाव-क्रम के साथ היה यहाँ जनगणना के परिणाम का सार प्रस्तुत करता है; ‘इस प्रकार’ उस निष्कर्षात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַפְּקֻדִים
  choice: गिने गए सभी लोगों की कुल संख्या
  rationale: הַפְּקֻדִים का आशय जनगणना में दर्ज किए गए लोगों से है। हिन्दी में संख्या-विधेय के साथ यह रचना स्पष्ट और स्वाभाविक है; पद में स्वयं ‘पुरुष’ शब्द न होने के कारण उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: छः लाख तीन हज़ार पाँच सौ पचास
  rationale: इब्रानी की संख्यात्मक जोड़-संरचना का ठीक मान भारतीय संख्या-पद्धति में स्वाभाविक आधुनिक हिन्दी के अनुसार दिया गया है।
