  language: hi
  text: मनश्शे के गोत्र में गिने गए पुरुषों की संख्या बत्तीस हज़ार दो सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: गिने गए पुरुषों की संख्या
  rationale: जनगणना के इस प्रसंग में פקד का यह रूप उन पुरुषों को दर्शाता है जिनकी गिनती की गई थी। हिंदी में यह प्रयोग मूल के गणना-संबंधी अर्थ और संख्यात्मक सूत्र दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְמַטֵּה
  choice: के गोत्र में
  rationale: यहाँ לְמַטֵּה गिने गए लोगों की गोत्रीय संबद्धता बताता है। ‘के गोत्र में’ आधुनिक हिंदी में सहज है और मूल अर्थ को बनाए रखता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इब्रानी नाम का हिंदी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है।
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וּמָאתָיִם
  choice: बत्तीस हज़ार दो सौ
  rationale: मूल संख्या 32,200 को आधुनिक हिंदी के स्वाभाविक क्रम में ठीक-ठीक व्यक्त किया गया है।
