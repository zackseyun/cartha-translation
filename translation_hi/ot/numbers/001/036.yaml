base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/036.yaml
  text: 'For the sons of Benjamin[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every man able to go out to war:'
translation:
  language: hi
  text: 'बिन्यामीन के वंशजों के लिए—उनकी पीढ़ियों के अनुसार, उनके कुलों के अनुसार, उनके पितृ-घरानों के अनुसार, नामों की संख्या के अनुसार—बीस वर्ष और उससे अधिक आयु के, युद्ध-सेवा के लिए योग्य सभी पुरुष[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “हर एक जो युद्ध के लिए निकलता है”; यह सैन्य सेवा के लिए योग्य व्यक्तियों का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों में
  rationale: यहाँ לְ जनगणना की सूची में संबंधित गोत्र का परिचय देता है। ‘वंशज’ בני का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, क्योंकि बात बिन्यामीन के प्रत्यक्ष पुत्रों की नहीं, उसके गोत्र के लोगों की है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों
  rationale: जनगणना के इस प्रसंग में शब्द वंश और वंश-संबंधी अभिलेख के आधार पर वर्गीकरण को सूचित करता है; ‘वंशावलियों’ मूल की औपचारिकता बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर की नातेदारी-इकाई है; ‘कुल’ इसे अगले पद ‘पितृकुल’ से संबंधित किंतु अलग स्तर के रूप में व्यक्त करता है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों
  rationale: शाब्दिक ‘पिताओं के घरानों’ के लिए ‘पितृकुल’ संक्षिप्त, गरिमापूर्ण और वर्तमान हिन्दी में बोधगम्य है तथा मूल की पितृवंशीय सामाजिक संरचना को बनाए रखता है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती के अनुसार
  rationale: यह पद नाम लेकर व्यक्तियों की गणना को दर्शाता है। चुना हुआ रूप मूल शब्दावली और जनगणना-सूत्र दोनों को सुरक्षित रखता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह आयु की निचली सीमा बताने वाला सूत्र है; हिन्दी रूप सहजता से बीस वर्ष और उससे ऊपर की आयु को समेटता है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष जो युद्ध के लिए निकलने योग्य थे
  rationale: शाब्दिक रूप ‘हर एक जो सेना/युद्ध के लिए निकलता है’ है। सैन्य जनगणना के संदर्भ में यह सैन्य सेवा के योग्य पुरुषों का मुहावरा है; ‘योग्य’ इस कार्यगत अर्थ को स्पष्ट करता है।
