base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/034.yaml
  text: 'From the sons of Manasseh[a], by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out for military service:'
translation:
  language: hi
  text: 'मनश्शे के पुत्रों में से, उनकी पीढ़ियों के अनुसार, उनके कुलों के अनुसार, उनके पितरों के घरानों के अनुसार, नामों की गिनती के अनुसार, बीस वर्ष और उससे अधिक आयु के वे सभी पुरुष जो सैन्य सेवा के लिए जाने वाले थे[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “युद्ध के लिए निकलने वाले।” इब्रानी वाक्यांश उन लोगों को सूचित करता है जो सैन्य सेवा के लिए पात्र थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों में से
  rationale: ל उपसर्ग इस जनगणना-सूत्र में गोत्र का शीर्षक प्रस्तुत करता है। בנים का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ पूरे गोत्र के पुरुष वंशज अभिप्रेत हैं; आधुनिक हिन्दी में ‘वंशजों’ से यह वंशगत अर्थ स्वाभाविक और स्पष्ट रहता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: इस जनगणना-संदर्भ में תולדות वंशक्रम अथवा वंशगत विभाजन को दर्शाता है। ‘वंशावलियों’ से औपचारिक वंश-संबंध सुरक्षित रहता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के व्यापक नातेदारी-समूह को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में ‘परिवार’ की अपेक्षा अधिक उपयुक्त है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों के अनुसार
  rationale: ‘पिताओं के घरानों’ की सामाजिक संरचना को ‘पितृकुल’ संक्षिप्त, गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती करके
  rationale: वाक्यांश व्यक्तियों को नाम लेकर गिने जाने का संकेत देता है। ‘नामों की गिनती करके’ हिन्दी में स्वाभाविक रहते हुए गणना की विधि को सुरक्षित रखता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह इब्रानी मुहावरा न्यूनतम आयु-सीमा बताता है। चुना हुआ रूप वर्तमान मानक हिन्दी में स्पष्ट और सहज है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष जो सैन्य सेवा के योग्य थे
  rationale: संदर्भ बीस वर्ष से अधिक आयु के पुरुषों की सैनिक जनगणना है। יֹצֵא צָבָא का आशय सेना अथवा युद्ध के लिए निकल सकने वाले, अर्थात सैन्य दायित्व के योग्य पुरुषों से है।
theological_decisions:
- issue: जनगणना की लिंग-सूचक भाषा
  choice: वे सभी पुरुष जो सैन्य सेवा के योग्य थे
  alternative: वे सभी जो सैन्य सेवा के योग्य थे
  rationale: प्रसंग इस्राएल के बीस वर्ष और उससे अधिक आयु वाले पुरुषों की सैन्य जनगणना है। ‘पुरुष’ मूल के पुल्लिंग और प्रसंगगत सीमा को अस्पष्ट होने से बचाता है।
- issue: יֹצֵא צָבָא में पात्रता बनाम वास्तविक प्रस्थान
  choice: सैन्य सेवा के योग्य थे
  alternative: युद्ध के लिए निकलते थे
  rationale: शाब्दिक रूप ‘सेना/युद्ध के लिए निकलने वाला’ है, पर जनगणना में यह सैन्य सेवा की पात्रता को सूचित करता है। मुख्य पाठ अर्थ को स्पष्ट करता है और पाद-टिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण जनगणना-शैली वाला रूप। ‘कुल’, ‘पितृकुल’ और ‘वंशावली’ से प्राचीन इस्राएली नातेदारी की अलग-अलग इकाइयाँ यथासंभव स्पष्ट रखी गई हैं। पद के अंत का द्विबिंदु अगले पद में आने वाली कुल संख्या से इसके व्याकरणिक संबंध को दर्शाता है।
