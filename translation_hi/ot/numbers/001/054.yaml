id: NUM.1.54
reference: Numbers 1:54
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה כֵּ֥ן עָשֽׂוּ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/054.yaml
  text: So the sons of Israel did according to all that Yahweh had commanded Moses[a]; so they did.
translation:
  language: hi
  text: इस प्रकार इस्राएलियों ने वह सब किया जो यहोवा ने मूसा को करने की आज्ञा दी थी; उन्होंने ठीक वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ
  choice: ने...किया
  rationale: עשה के व्यापक अर्थ ‘करना’ को स्वाभाविक हिन्दी में व्यक्त करता है और आज्ञापालन के सार-वाक्य के अनुकूल है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर इस प्रसंग में यह इस्राएल समुदाय का प्रचलित सामूहिक नाम है; ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: כְּכֹל אֲשֶׁר
  choice: वह सब...जिसकी
  rationale: यह वाक्यांश आज्ञा की संपूर्णता और उसके अनुरूप किए गए कार्य—दोनों को व्यक्त करता है।
- source_word: צִוָּה
  choice: आज्ञा...दी थी
  rationale: इब्रानी पूर्ण क्रिया इस्राएलियों के कार्य से पहले दी गई आज्ञा को दर्शाती है; हिन्दी का पूर्ण भूतकाल इस क्रम को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: צוה की हिन्दी वाक्य-रचना में आज्ञा पाने वाले व्यक्ति के लिए ‘को’ स्वाभाविक है।
- source_word: כֵּן עָשׂוּ
  choice: उन्होंने ठीक वैसा ही किया
  rationale: ‘ठीक वैसा ही’ पहले कथन से पूर्ण अनुरूपता पर बल देता है और इब्रानी की समापन-पुनरुक्ति को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के बीच ‘यहोवा’ सुविदित और प्रतिष्ठित नामरूप है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यद्यपि पदबंध रूपतः पुल्लिंग और शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, इस जनगणना-सम्बन्धी निष्कर्ष में यह पूरे इस्राएली समुदाय का जातिनाम है। ‘इस्राएलियों’ उस सामूहिक आशय को बिना अनावश्यक लैंगिक संकुचन के स्वाभाविक हिन्दी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। अर्धविराम इब्रानी के बलयुक्त पुनरुक्त समापन को स्पष्ट करता है; अनुच्छेद-समाप्ति संकेत ׃פ का अलग पाठानुवाद नहीं किया गया।
