  text: לִ/בְנֵ֣י דָ֔ן תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/038.yaml
  text: 'For the sons of Dan[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward, every male able to go out to war:'
translation:
  language: hi
  text: 'दान के वंशजों के लिए: उनकी वंशावलियों, उनके कुलों और उनके पितृकुलों के अनुसार, नामों की संख्या के अनुसार, बीस वर्ष या उससे अधिक आयु के वे सभी पुरुष जो युद्ध के लिए निकलने योग्य थे[a]—'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो सैनिक सेवा के योग्य थे।” इब्रानी मुहावरे का शाब्दिक अर्थ है “युद्ध के लिए निकलना।”
    reason: मूल मुहावरे और उसके प्रसंगगत अर्थ, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: לִבְנֵי דָן
  choice: दान के वंशजों में से
  rationale: לִבְנֵי tribal census heading introduces those belonging to Dan; ‘वंशज’ naturally conveys tribal descent in Hindi without implying only immediate sons.
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: In this census formula the term concerns genealogical registration or lineage, for which ‘वंशावलियाँ’ is clearer than the literal but potentially vague ‘पीढ़ियाँ’.
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: ‘कुल’ suitably represents the clan-level unit and remains distinct from the following paternal household grouping.
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों के अनुसार
  rationale: ‘पितृकुल’ concisely preserves the explicitly paternal ancestral-house structure of the Hebrew expression.
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती करके
  rationale: This conveys an enumeration of individuals by name in idiomatic modern Hindi while retaining the source image of counted names.
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: A natural Hindi expression of the inclusive age threshold.
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष जो युद्ध के लिए निकलने योग्य थे
  rationale: The phrase literally depicts going out for the army or war and contextually denotes military eligibility; ‘पुरुष’ accurately makes the masculine census referent explicit.
theological_decisions:
- issue: सैनिक जनगणना में पुरुषवाचक भाषा
  choice: वे सभी पुरुष जो युद्ध के लिए निकलने योग्य थे
  alternative: वे सभी जो सैनिक सेवा के योग्य थे
  rationale: संदर्भ और इब्रानी के पुरुषवाचक रूप सैन्य सेवा योग्य पुरुषों की गणना करते हैं। मुख्य पाठ मूल मुहावरे को बनाए रखता है; अधिक कार्यात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और जनगणना-सूत्र के अनुरूप है। ‘वंशावली’, ‘कुल’ और ‘पितृकुल’ से तीनों वंश-संगठन संबंधी पदों का भेद बनाए रखा गया है। पद अगले पद में संख्या आने तक व्याकरणिक रूप से जारी रहता है, इसलिए अंत में दीर्घ विरामचिह्न रखा गया है।
