source:
  edition: WLC
  text: לִ/בְנֵ֤י יוֹסֵף֙ לִ/בְנֵ֣י אֶפְרַ֔יִם תּוֹלְדֹתָ֥/ם לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֣ית אֲבֹתָ֑/ם בְּ/מִסְפַּ֣ר שֵׁמֹ֗ת מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה כֹּ֖ל יֹצֵ֥א צָבָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/032.yaml
  text: 'For the sons of Joseph[a], for the sons of Ephraim, by their generations, by their clans, by their fathers’ houses, by the number of names, from twenty years old and upward, every man going out to war:'
translation:
  language: hi
  text: यूसुफ के वंशजों में से, अर्थात् एप्रैम के वंशजों की—उनकी पीढ़ियों के अनुसार, उनके कुलों के अनुसार, उनके पितृ-घरानों के अनुसार, नामों की संख्या के अनुसार—बीस वर्ष और उससे अधिक आयु के, युद्ध के लिए निकलने वाले सभी पुरुषों की[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, सैनिक सेवा के लिए निकलने वाले सभी पुरुषों की। इब्रानी मुहावरे का शाब्दिक अर्थ है, “युद्ध के लिए निकलने वाले।”
    reason: इब्रानी सैन्य मुहावरे के प्रशासनिक अर्थ को वैकल्पिक रूप में स्पष्ट करते हुए मुख्य पाठ की शाब्दिकता बनाए रखना।
lexical_decisions:
- source_word: לִבְנֵי יוֹסֵף לִבְנֵי אֶפְרַיִם
  choice: यूसुफ के वंशजों में से एप्रैम के वंशजों
  rationale: यहाँ בנים प्रत्यक्ष पुत्रों के बजाय जनजातीय वंशजों को सूचित करता है। आधुनिक हिन्दी में ‘वंशज’ आशय को स्पष्ट रखता है, और दोहरे לִבְנֵי का संबंध भी व्यक्त करता है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी पीढ़ियों
  rationale: जनगणना के इस सूत्र में यह वंशगत पीढ़ियों या वंशक्रम को सूचित करता है; इसे लिखित अभिलेख मान लेना अनावश्यक होगा।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों
  rationale: מִשְׁפָּחָה यहाँ आधुनिक एकल परिवार नहीं, बल्कि जनजाति के भीतर का विस्तृत सामाजिक-वंशगत समूह है; ‘कुल’ स्वाभाविक और सटीक है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों
  rationale: यह पैतृक वंश पर आधारित घराने की तकनीकी अभिव्यक्ति है। ‘पितृकुल’ हिन्दी में संक्षिप्त रूप से उसी वंशगत इकाई को व्यक्त करता है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: एक-एक नाम गिनकर
  rationale: शाब्दिक ‘नामों की संख्या के अनुसार’ की अपेक्षा यह हिन्दी में व्यक्तिगत नामांकन द्वारा की गई गणना का आशय अधिक स्वाभाविक ढंग से देता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह आयु-सीमा का सामान्य सूत्र है और आधुनिक हिन्दी में स्पष्ट तथा सहज है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष, जो युद्ध के लिए निकलते थे
  rationale: इब्रानी सैन्य मुहावरे को निकटता से रखा गया है। जनगणना का प्रसंग सैन्य आयु के पुरुषों का है, इसलिए ‘पुरुष’ लिंग-संदर्भ को स्पष्ट करता है।
theological_decisions:
- issue: जनगणना की लिंग-विशिष्ट भाषा
  choice: वे सभी पुरुष
  alternative: वे सभी लोग
  rationale: प्रसंग और आयु-सैन्य सूत्र इस गणना को पुरुषों से संबंधित बताते हैं; लिंग-निरपेक्ष अनुवाद मूल संदर्भ को धुंधला कर देगा।
- issue: יֹצֵא צָבָא का सैन्य अर्थ
  choice: जो युद्ध के लिए निकलते थे
  alternative: जो सैनिक सेवा के योग्य थे
  rationale: मुख्य पाठ में मूल इब्रानी मुहावरे की ठोस भाषा सुरक्षित रखी गई है; प्रशासनिक अर्थ को पादटिप्पणी में स्पष्ट किया गया है, ताकि अभिव्यक्ति का संभावित तनाव न मिटे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। गणना के सूत्र को स्वाभाविक हिन्दी वाक्य बनाने के लिए ‘गिनती ... की गई’ संदर्भानुसार जोड़ा गया है; इससे अगले पद में आने वाली संख्या के साथ संबंध बना रहता है।
