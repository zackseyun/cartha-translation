lexical_decisions:
- source_word: פְּקֻדֵיהֶם
  choice: गिने गए लोगों की संख्या
  rationale: פקד का यह रूप जनगणना में दर्ज अथवा गिने गए व्यक्तियों को दर्शाता है। हिंदी में यह अभिव्यक्ति स्वाभाविक है और बहुवचन प्रत्यय का आशय संदर्भानुसार समेटती है।
- source_word: לְמַטֵּה
  choice: के गोत्र में
  rationale: इस जनगणना-सूत्र में לְמַטֵּה जनजातीय संबद्धता बताता है; ‘के गोत्र में’ आधुनिक हिंदी में सहज है।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: इब्रानी नाम का हिंदी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף וּשְׁלֹשׁ מֵאוֹת
  choice: उनसठ हज़ार तीन सौ
  rationale: इब्रानी संख्या-क्रम का ठीक कुल आधुनिक मानक हिंदी संख्या-शैली में व्यक्त किया गया है।
