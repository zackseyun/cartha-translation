base_translation:
  language: en
  yaml_path: translation/ot/numbers/001/024.yaml
  text: 'For the sons of Gad[a], by their generations, by their clans, by their fathers’ houses, according to the number of names, from twenty years old and upward[c][b], every man able to go out to war:'
translation:
  language: hi
  text: गाद के पुत्रों[a] के लिए, उनकी वंशावलियों, कुलों और पितृकुलों के अनुसार, नामों की गिनती के अनुसार, बीस वर्ष और उससे अधिक आयु का हर वह पुरुष जो सेना में सेवा के लिए निकलता है[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘गाद के पुत्रों’ है; यहाँ इससे जनगणना में गिने जा रहे गाद गोत्र के पुरुष सदस्य अभिप्रेत हैं।
    reason: cultural_note
  - marker: b
    text: शाब्दिक अर्थ ‘हर वह जो सेना के लिए निकलता है’; इसका अनुवाद ‘हर वह जो युद्ध में जाता है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבְנֵי גָד
  choice: गाद के वंशजों में
  rationale: इब्रानी का शाब्दिक अर्थ ‘गाद के पुत्रों के लिए/में’ है; जनगणना के प्रसंग में यह गाद गोत्र के गिने जा रहे पुरुष वंशजों को दर्शाता है। हिंदी में ‘वंशजों’ स्वाभाविक और स्पष्ट है।
- source_word: תּוֹלְדֹתָם
  choice: उनकी वंशावलियों के अनुसार
  rationale: यह पद वंशक्रम अथवा वंशगत वर्गीकरण को दर्शाता है। ‘वंशावलियों’ लिखित अभिलेख का अनावश्यक आग्रह किए बिना वंश-संबंधी अर्थ व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर की व्यापक नातेदारी इकाई है; ‘कुल’ आधुनिक हिंदी में ‘परिवार’ से अधिक उपयुक्त है।
- source_word: לְבֵית אֲבֹתָם
  choice: पितृकुलों के अनुसार
  rationale: यह पैतृक घराने की तकनीकी सामाजिक इकाई है। ‘पितृकुल’ मूल की पितृवंशीय संरचना को संक्षेप और स्पष्टता से सुरक्षित रखता है।
- source_word: בְּמִסְפַּר שֵׁמוֹת
  choice: नामों की गिनती में
  rationale: वाक्यांश व्यक्तिगत नामों के आधार पर की गई गणना को बताता है; यह हिंदी रूप मूल की गणना-संबंधी भाषा बनाए रखता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष और उससे अधिक आयु के
  rationale: यह जनगणना की आयु-सीमा का स्वाभाविक हिंदी रूप है और इब्रानी के शाब्दिक ‘बीस वर्ष का पुत्र’ जैसे असहज प्रयोग से बचता है।
- source_word: כֹּל יֹצֵא צָבָא
  choice: वे सभी पुरुष ... जो सेना में सेवा करने योग्य थे
  rationale: शाब्दिक भाव ‘हर वह जो सेना/युद्ध के लिए निकलता है’ है। प्रसंग सैनिक सेवा की पात्रता का है; ‘योग्य’ निहित पात्रता को स्पष्ट करता है और ‘सेना में सेवा’ צבא की सम्भावित सैन्य-सेवा की व्यापकता बनाए रखता है।
