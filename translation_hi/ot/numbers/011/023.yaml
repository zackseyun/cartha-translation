source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה הֲ/יַ֥ד יְהוָ֖ה תִּקְצָ֑ר עַתָּ֥ה תִרְאֶ֛ה הֲ/יִקְרְ/ךָ֥ דְבָרִ֖/י אִם לֹֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/023.yaml
  text: And Yahweh said to Moses[b][a], “Has Yahweh’s hand become short? Now you will see whether my word will happen for you or not.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “क्या याहवे का हाथ छोटा पड़ गया है?[a] अब तुम देखोगे कि मेरी बात तुम्हारे लिए पूरी होगी या नहीं।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “क्या याहवे का हाथ छोटा पड़ गया है?” यह मुहावरा पूछता है कि क्या याहवे की सामर्थ्य सीमित हो गई है।
    reason: cultural_note
  - marker: b
    text: 'या: “मेरी कही बात तुम्हारे साथ घटित होगी या नहीं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הֲיַד יְהוָה תִּקְצָר
  choice: क्या याहवे का हाथ छोटा पड़ गया है?
  rationale: मूल इब्रानी का सजीव रूपक और आलंकारिक प्रश्न बनाए रखा गया है; ‘छोटा पड़ना’ हिन्दी में सामर्थ्य अपर्याप्त होने का स्वाभाविक मुहावरा भी है।
- source_word: עַתָּה תִרְאֶה
  choice: अब तुम देखोगे
  rationale: आसन्न प्रत्यक्ष पुष्टि का भाव सरल और आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הֲיִקְרְךָ דְבָרִי
  choice: कि मेरी बात तुम्हारे लिए पूरी होगी या नहीं
  rationale: דְבָרִי को परमेश्वर की कही बात और קרה को उसके घटित अथवा पूरा होने के अर्थ में लिया गया है। ‘तुम्हारे लिए’ द्वितीय पुरुष प्रत्यय को बनाए रखता है, जबकि पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: אִם לֹא
  choice: या नहीं
  rationale: ‘कि...या नहीं’ हिन्दी में अप्रत्यक्ष प्रश्न की स्वाभाविक संरचना है।
theological_decisions:
- issue: ईश्वरीय सामर्थ्य के लिए मानव-अंग का रूपक
  choice: ‘याहवे का हाथ छोटा पड़ गया है’ रूपक को मूल रूप में बनाए रखना
  alternative: ‘क्या याहवे की सामर्थ्य सीमित हो गई है?’
  rationale: इब्रानी की शारीरिक छवि प्रश्न की तीव्रता बनाए रखती है; पादटिप्पणी उसका आशय स्पष्ट करती है, बिना मुख्य पाठ को व्याख्यात्मक रूप से सपाट किए।
- issue: मूसा के संदेह के प्रति प्रश्न का बल
  choice: सामर्थ्य घट जाने की संभावना पर आलंकारिक प्रश्न
  alternative: ‘क्या याहवे के लिए कुछ असम्भव है?’
  rationale: चुना हुआ पाठ इसी पद की विशिष्ट इब्रानी अभिव्यक्ति को सुरक्षित रखता है और किसी समानांतर पद की शब्दावली आयात नहीं करता।
- issue: परमेश्वर की कही बात के पूरा होने की अभिव्यक्ति
  choice: ‘मेरी बात तुम्हारे लिए पूरी होगी’
  alternative: ‘मेरी बात तुम पर घटित होगी’
  rationale: मुख्य पाठ वचन की पूर्ति का प्रसंगगत अर्थ स्वाभाविक हिन्दी में देता है, जबकि पादटिप्पणी קרה और द्वितीय पुरुष प्रत्यय की अधिक शाब्दिक सम्भावना को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण शैली रखी गई है। मूसा के लिए ‘तुम’ का प्रयोग समकालीन हिन्दी में सहज है और इब्रानी के एकवचन सम्बोधन को प्रसंग से स्पष्ट रहने देता है।
