  text: וַ/יַּ֜עַן יְהוֹשֻׁ֣עַ בִּן נ֗וּן מְשָׁרֵ֥ת מֹשֶׁ֛ה מִ/בְּחֻרָ֖י/ו וַ/יֹּאמַ֑ר אֲדֹנִ֥/י מֹשֶׁ֖ה כְּלָאֵֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/028.yaml
  text: Then Joshua son of Nun[a], Moses’ attendant from his youth, answered and said, “My lord Moses[b], restrain them!”
translation:
  language: hi
  text: तब नून के पुत्र यहोशू ने, जो अपनी युवावस्था से मूसा का सहायक था[a], उत्तर देकर कहा, “मेरे स्वामी मूसा, उन्हें रोकिए![b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जो मूसा के जवान सहायकों में से एक था,” अथवा संभवतः “जो उसके चुने हुओं में से एक था।” इब्रानी पद संक्षिप्त है और उसका अर्थ कुछ अस्पष्ट है।
    reason: lexical_alternative
  - marker: b
    text: या “उन्हें मना कीजिए।” इब्रानी क्रिया का अर्थ रोकना, नियंत्रण में रखना, या निषेध करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמַר
  choice: उत्तर दिया और कहा
  rationale: दोनों इब्रानी कथन-क्रियाओं को रखा गया है। यह हिन्दी में कुछ औपचारिक होते हुए भी कथात्मक प्रत्युत्तर का भाव स्पष्ट करता है। आरम्भ का ‘तब’ क्रमसूचक וַ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं और इब्रानी संबंध-रचना को सहज हिन्दी में व्यक्त किया गया है।
- source_word: מְשָׁרֵת מֹשֶׁה
  choice: मूसा का सहायक
  rationale: מְשָׁרֵת व्यक्तिगत सेवा और सहायता करने वाले व्यक्ति को दर्शाता है। ‘सहायक’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से दासत्व का अर्थ नहीं देता।
- source_word: מִבְּחֻרָיו
  choice: उसके जवानों में से एक
  rationale: इब्रानी पद संक्षिप्त और अर्थ की दृष्टि से कठिन है। मुख्य पाठ में बहुवचन तथा प्रत्यय को पारदर्शी ढंग से रखा गया है; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲדֹנִי מֹשֶׁה
  choice: मेरे स्वामी मूसा
  rationale: यह किसी मानवीय वरिष्ठ के प्रति आदरपूर्ण संबोधन है। ‘स्वामी’ सम्मान और अधीनता का भाव रखता है, जबकि मूसा का स्पष्ट नाम इसे परमेश्वर के लिए प्रयुक्त उपाधि समझे जाने से रोकता है।
- source_word: כְּלָאֵם
  choice: उन्हें रोक दीजिए
  rationale: क्रिया का अर्थ रोकना, नियंत्रण में रखना या निषेध करना हो सकता है। संदर्भ में ‘रोक दीजिए’ सरल और स्वाभाविक है, पर रोकने के साधन को अनावश्यक रूप से निश्चित नहीं करता।
