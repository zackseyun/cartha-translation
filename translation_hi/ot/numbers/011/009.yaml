  text: When the dew came down on the camp at night[a], the manna came down on it.
translation:
  language: hi
  text: और जब रात को छावनी पर ओस उतरती थी, तब उस पर मन्ना उतरता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְרֶדֶת
  choice: और जब ... उतरती थी
  rationale: וּ के समन्वयकारी भाव और בְּ + infinitive construct के कालवाचक प्रयोग, दोनों को स्वाभाविक हिन्दी में रखा गया है। अपूर्ण भूतकाल की आदतन क्रिया को ‘उतरती थी’ व्यक्त करता है।
- source_word: הַטַּל
  choice: ओस
  rationale: निश्चित संज्ञा का सीधा और सामान्य हिन्दी रूप; हिन्दी में यहाँ निश्चितता के लिए अलग उपपद आवश्यक नहीं है।
- source_word: עַל הַמַּחֲנֶה
  choice: छावनी पर
  rationale: עַל के स्थानवाचक अर्थ और उस समुदाय के डेरा डालने के स्थान को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָיְלָה
  choice: रात को
  rationale: कालवाचक क्रियाविशेषण का आधुनिक मानक हिन्दी में सहज रूप।
- source_word: יֵרֵד
  choice: उतरता था
  rationale: कथात्मक संदर्भ में imperfect नियमित अथवा आदतन भूतकालीन घटना बताता है। ओस और मन्ना के लिए एक ही हिन्दी क्रिया ‘उतरना’ रखकर इब्रानी समानांतरता बचाई गई है।
- source_word: הַמָּן
  choice: मन्ना
  rationale: पहले से परिचित विशिष्ट भोजन के पारंपरिक और व्यापक हिन्दी बाइबलीय नाम को रखा गया है।
- source_word: עָלָיו
  choice: उस पर
  rationale: पुल्लिंग एकवचन सर्वनाम को बिना अधिक व्याख्या किए सुरक्षित रखा गया है; इसका स्वाभाविक पूर्वपद ‘छावनी’ है।
