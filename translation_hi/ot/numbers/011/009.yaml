translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण है। ‘और जब ... तब ... भी’ से वाक्य का समन्वय और काल-संबंध स्पष्ट होता है; ‘भी’ ओस और मन्ना के समानांतर उतरने को स्वाभाविक हिन्दी में उभारता है, जबकि दोनों के लिए ‘उतरना’ क्रिया मूल पाठ की पुनरावृत्ति बनाए रखती है।
