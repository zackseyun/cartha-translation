  yaml_path: translation/ot/numbers/011/014.yaml
  text: I am not able, I alone, to carry all this people, because it is too heavy for me.
translation:
  language: hi
  text: मैं अकेला इस सारी प्रजा का भार नहीं उठा सकता, क्योंकि यह मेरे लिए बहुत भारी है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְבַדִּי
  choice: अकेला
  rationale: यह ‘मैं ही अकेला’ होने पर दिए गए स्पष्ट बल को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: לָשֵׂאת
  choice: भार ... उठा सकता
  rationale: मूल क्रिया का अर्थ ‘उठाना/ढोना’ है; सन्दर्भ में लोगों की जिम्मेदारी सँभालने का रूपक बनाए रखने के लिए ‘भार उठाना’ चुना गया।
- source_word: כָבֵד
  choice: बहुत भारी
  rationale: यह भार-संबंधी रूपक को बनाए रखता है और מִמֶּנִּי के साथ मिलकर मूसा की सामर्थ्य से परे होने का भाव देता है।
theological_decisions:
- issue: मूसा की व्यक्तिगत असमर्थता और अकेलेपन पर बल
  choice: ‘मैं अकेला ... नहीं उठा सकता’
  alternative: ‘मैं अपने आप ... नहीं उठा सकता’
  rationale: मूल में אָנֹכִי और לְבַדִּי का संयोजन वक्ता और उसके अकेले होने पर बल देता है; चुना हुआ रूप इसे बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और रूपक-संरक्षक भाषा। ‘इस सारे लोगों’ के बजाय स्वाभाविक हिन्दी ‘इन सारे लोगों’ से बचते हुए यहाँ मूल के निकट ‘इस सारे लोगों’ अस्वाभाविक होता, इसलिए ‘इस सारे लोगों’ की जगह ‘इस सारे लोगों’ नहीं अपनाया गया; वाक्य में ‘इस सारे लोगों’ को सहज बनाने हेतु ‘इस सारे लोगों का भार’ रखा गया है।
