language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם כָּ֣כָה אַתְּ עֹ֣שֶׂה לִּ֗/י הָרְגֵ֤/נִי נָא֙ הָרֹ֔ג אִם מָצָ֥אתִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ וְ/אַל אֶרְאֶ֖ה בְּ/רָעָתִֽ/י־׀־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/015.yaml
  text: If this is how you are going to deal with me[a], please kill me at once, if I have found favor in your eyes, and do not let me see my misery.
translation:
  language: hi
  text: यदि तू मेरे साथ ऐसा ही करेगा, तो कृपा करके मुझे मार ही डाल, यदि मुझ पर तेरी कृपादृष्टि हुई है; और मुझे मेरी विपत्ति[a] न देखने दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी दुर्दशा,” “मेरा संकट,” या “मेरी बुराई।” हिब्रू शब्द विपत्ति या अनिष्ट का अर्थ भी दे सकता है, केवल नैतिक बुराई का नहीं।
    reason: बְּרָעָתִי के अर्थ-क्षेत्र को सुरक्षित रखता है और यह स्पष्ट करता है कि यहाँ मुख्य आशय मूसा का संकट या विपत्ति है।
lexical_decisions:
- source_word: וְאִם כָּכָה
  choice: यदि ... ऐसा ही
  rationale: शर्त को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; आरम्भिक וְ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: אַתְּ עֹשֶׂה לִּי
  choice: तू मेरे साथ ... करेगा
  rationale: עשה ל־ का सम्बन्धपरक भाव रखता है और परमेश्वर द्वारा मूसा के साथ किए जा रहे व्यवहार को सहज हिन्दी में व्यक्त करता है।
- source_word: הָרְגֵנִי נָא הָרֹג
  choice: कृपा करके मुझे अभी मार डाल—हाँ, मार ही डाल
  rationale: נָא की विनती तथा infinitive absolute के साथ imperative की तीव्रता और आग्रह, दोनों को स्पष्ट करता है।
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: यदि मुझ पर तेरी कृपादृष्टि हुई है
  rationale: हिब्रू मुहावरे ‘तेरी आँखों में अनुग्रह पाना’ का स्वाभाविक किन्तु चित्रात्मक हिन्दी रूप।
- source_word: וְאַל אֶרְאֶה
  choice: और मुझे ... न देखने दे
  rationale: परमेश्वर से की गई निषेधात्मक विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּרָעָתִי
  choice: अपनी दुर्दशा
  rationale: רָעָה यहाँ नैतिक बुराई के बजाय विपत्ति, कष्ट या विनाशकारी दशा का बोध करा सकता है; ‘दुर्दशा’ प्रसंग में मूसा के व्यक्तिगत संकट को व्यक्त करती है।
theological_decisions:
- issue: בְּרָעָתִי में मूसा की विनती का आशय
  choice: अपनी दुर्दशा
  alternative: अपनी विपत्ति / अपना संकट / अपनी बुराई
  rationale: प्रसंग में मूसा लोगों का भार सहते-सहते निराश है; पाठ अनिवार्यतः व्यक्तिगत नैतिक बुराई की स्वीकारोक्ति नहीं करता। ‘दुर्दशा’ अनुभव किए जा रहे संकट को व्यक्त करती है, जबकि पादटिप्पणी मूल की अर्थ-व्याप्ति खुली रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; परमेश्वर के लिए एकवचन आत्मीय ‘तू/तेरी’ का प्रयोग। शैली गंभीर और भावात्मक है। मूल हिब्रू की तीव्र पुनरुक्ति को ‘हाँ, मार ही डाल’ से बनाए रखा गया है।
