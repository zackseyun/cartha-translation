revisions:
- from: यदि तू मेरे साथ ऐसा ही करेगा,[a] तो कृपा करके मुझे अभी मार डाल—हाँ, मार ही डाल—यदि मुझ पर तेरी कृपादृष्टि हुई है; और मुझे अपनी दुर्दशा न देखने दे।
  to: यदि तू मेरे साथ ऐसा ही करेगा, तो कृपा करके मुझे मार ही डाल, यदि मुझ पर तेरी कृपादृष्टि हुई है; और मुझे मेरी विपत्ति[a] न देखने दे।
  rationale: Revision removes an unnecessary temporal implication from the intensified imperative, uses a direct possessive expression for Moses’ calamity, and relocates the footnote to the Hebrew word whose interpretation is materially ambiguous. The conditional structure, divine-address register, plea, and emphatic force remain intact.
