  edition: WLC
  text: לֹ֣א י֥וֹם אֶחָ֛ד תֹּאכְל֖וּ/ן וְ/לֹ֣א יוֹמָ֑יִם וְ/לֹ֣א חֲמִשָּׁ֣ה יָמִ֗ים וְ/לֹא֙ עֲשָׂרָ֣ה יָמִ֔ים וְ/לֹ֖א עֶשְׂרִ֥ים יֽוֹם׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/019.yaml
  text: You will eat not for one day[a], or two days, or five days, or ten days, or twenty days,
translation:
  language: hi
  text: तुम केवल एक दिन[a], या दो दिन, या पाँच दिन, या दस दिन, या बीस दिन तक नहीं खाओगे,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “न एक दिन तुम खाओगे, न दो दिन, न पाँच दिन, न दस दिन और न बीस दिन।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא
  choice: नहीं
  rationale: प्रत्येक समय-अवधि को नकारने वाले इब्रानी לֹא को हिंदी में एक बार क्रिया के साथ रखकर, बीच की अवधियों को ‘या’ से जोड़ना स्वाभाविक है; पादटिप्पणी अधिक शब्दशः पुनरावृत्ति दिखाती है।
- source_word: יוֹם אֶחָד
  choice: एक दिन
  rationale: यह संख्या और संज्ञा का सीधा प्रयोग है तथा आगे बढ़ती गिनती को बनाए रखता है।
- source_word: תֹּאכְלוּ/ן
  choice: खाओगे
  rationale: काल इम्परफेक्ट, द्वितीय पुरुष बहुवचन, यहाँ आगामी घटना की घोषणा करता है; ‘खाओगे’ उसका स्वाभाविक हिंदी रूप है।
- source_word: יוֹמָיִם
  choice: दो दिन
  rationale: द्विवचन रूप स्पष्ट रूप से दो दिनों को दर्शाता है।
- source_word: חֲמִשָּׁה יָמִים
  choice: पाँच दिन
  rationale: बढ़ते हुए क्रम को सुरक्षित रखने वाला सीधा अनुवाद।
- source_word: עֲשָׂרָה יָמִים
  choice: दस दिन
  rationale: अलंकारिक क्रमवृद्धि को बनाए रखने वाला सीधा अनुवाद।
- source_word: עֶשְׂרִים יוֹם
  choice: बीस दिन
  rationale: इब्रानी में बीस के बाद ‘दिन’ का एकवचन रूप मुहावरेदार है; मानक हिंदी में ‘बीस दिन’ स्वाभाविक है।
- source_word: וְ
  choice: या
  rationale: यद्यपि וְ सामान्यतः ‘और’ है, बार-बार नकारी गई वैकल्पिक अवधियों की इस शृंखला में ‘या’ हिंदी में आशय को अधिक स्वाभाविक ढंग से व्यक्त करता है।
