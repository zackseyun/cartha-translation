  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֣קָם הָ/עָ֡ם כָּל הַ/יּוֹם֩ הַ/ה֨וּא וְ/כָל הַ/לַּ֜יְלָה וְ/כֹ֣ל י֣וֹם הַֽ/מָּחֳרָ֗ת וַ/יַּֽאַסְפוּ֙ אֶת הַ/שְּׂלָ֔ו הַ/מַּמְעִ֕יט אָסַ֖ף עֲשָׂרָ֣ה חֳמָרִ֑ים וַ/יִּשְׁטְח֤וּ לָ/הֶם֙ שָׁט֔וֹחַ סְבִיב֖וֹת הַֽ/מַּחֲנֶֽה־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/032.yaml
  text: And the people rose up all that day and all that night and all the next day[a], and they gathered the quail. The one who gathered the least gathered ten homers[b], and they spread them out for themselves all around the camp.
translation:
  language: hi
  text: लोग उठ खड़े हुए और उस पूरे दिन, पूरी रात और अगले पूरे दिन बटेरें बटोरते रहे। जिसने सबसे कम बटोरा, उसने भी दस होमेर[a][b] बटोरे। फिर उन्होंने उन्हें अपने लिए छावनी के चारों ओर फैला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: होमेर सूखी वस्तुओं को नापने की एक बड़ी प्राचीन इकाई थी। आधुनिक माप में इसका सटीक मान अनिश्चित है; आशय यह है कि सबसे कम बटोरने वाले ने भी बहुत बड़ी मात्रा इकट्ठी की।
    reason: cultural_note
  - marker: b
    text: या “गधे के दस बोझ”; यदि חֳמָרִים को मानक माप “होमेर” के बजाय उसके व्युत्पत्तिमूलक संबंध के आधार पर समझा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם הָעָם
  choice: लोग उठ खड़े हुए
  rationale: קום का यह कथात्मक रूप लोगों के सक्रिय होकर काम में लग जाने को व्यक्त करता है। ‘उठ खड़े हुए’ इब्रानी मुहावरे और क्रिया की तीव्रता दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלַּיְלָה וְכֹל יוֹם הַמָּחֳרָת
  choice: उस पूरे दिन, पूरी रात और अगले पूरे दिन
  rationale: यह क्रम लगातार बहुत लंबे समय तक बटोरने पर बल देता है। हिन्दी में समानांतर लय और अवधि का जोर बनाए रखा गया है।
- source_word: וַיַּאַסְפוּ אֶת הַשְּׂלָו
  choice: बटेरें बटोरते रहे
  rationale: אָסף के लिए ‘बटोरना’ इस प्रसंग में स्वाभाविक है। ‘बटोरते रहे’ अवधि-सूचक पदों के साथ लगातार चलती गतिविधि को स्पष्ट करता है, बिना कोई नया आशय जोड़े।
- source_word: הַמַּמְעִיט אָסַף
  choice: जिसने सबसे कम बटोरा, उसने भी ... बटोरे
  rationale: הַמַּמְעִיט का प्रसंगानुकूल अर्थ सबसे कम मात्रा बटोरने वाला है। ‘भी’ न्यूनतम मात्रा की आश्चर्यजनक विशालता को हिन्दी में स्वाभाविक ढंग से उभारता है।
- source_word: עֲשָׂרָה חֳמָרִים
  choice: दस होमेर
  rationale: חֹמֶר सामान्यतः प्राचीन सूखी वस्तुओं की माप है। लिप्यंतरण आधुनिक समतुल्य का झूठा सटीक अनुमान देने से बचता है; वैकल्पिक व्युत्पत्तिमूलक अर्थ पादटिप्पणी में रखा गया है।
- source_word: וַיִּשְׁטְחוּ לָהֶם שָׁטוֹחַ
  choice: उन्होंने उन्हें अपने लिए ... फैला दिया
  rationale: सजातीय क्रियारूप फैलाने की क्रिया पर बल देता है। ‘अपने लिए’ לָהֶם को दर्शाता है, जबकि सुखाने या संसाधित करने जैसा उद्देश्य पाठ में न जोड़कर अनिर्णीत छोड़ा गया है।
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: छावनी के चारों ओर
  rationale: यह आसपास के पूरे क्षेत्र में फैलाव का स्वाभाविक हिन्दी रूप है।
