  register: आधुनिक मानक हिन्दी में सजीव किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘जवान’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी इब्रानी निश्चितता और सूचना देने वाली क्रिया के विकल्प को सुरक्षित रखती है।
