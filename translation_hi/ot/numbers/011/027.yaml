  yaml_path: translation/ot/numbers/011/027.yaml
  text: Then a young man ran and told Moses[a], and said, “Eldad and Medad are prophesying in the camp.”
translation:
  language: hi
  text: तब एक युवक दौड़कर मूसा को बताया[a] और कहा, “एलदाद और मेदाद छावनी में भविष्यवाणी कर रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब वह युवक दौड़ा और मूसा को सूचना दी।” इब्रानी में ‘युवक’ के साथ निश्चित उपपद है, जिसे “वह युवक” भी अनुवाद किया जा सकता है; ‘बताया’ के लिए ‘सूचना दी’ या ‘खबर दी’ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: दौड़कर
  rationale: रוץ का सीधा अर्थ दौड़ना है; यह कथा की सजीवता बनाए रखता है।
- source_word: הַנַּעַר
  choice: एक जवान
  rationale: נַעַר संदर्भ के अनुसार लड़के, युवक या जवान व्यक्ति को सूचित कर सकता है। यहाँ संदेश पहुँचाने वाले व्यक्ति के लिए ‘एक जवान’ स्वाभाविक आधुनिक हिन्दी है; इब्रानी निश्चित उपपद के अधिक रूपगत अनुवाद ‘वह जवान’ को पादटिप्पणी में रखा गया है।
- source_word: וַיַּגֵּד לְמֹשֶׁה
  choice: मूसा के पास आया और उसे बताया
  rationale: Hiphil נגד का अर्थ बताना या सूचना देना है। हिन्दी में दौड़कर किसी के पास आने का भाव प्रसंगतः स्वाभाविक है, और ‘उसे बताया’ रिपोर्ट देने की क्रिया व्यक्त करता है।
- source_word: וַיֹּאמַר
  choice: और ... बताया ...
  rationale: इब्रानी का अलग कथन-सूचक क्रियापद प्रत्यक्ष उद्धरण आरम्भ करता है। हिन्दी में ‘बताया’ के बाद सीधा उद्धरण देने से वही कार्य स्वाभाविक ढंग से पूरा होता है, बिना अनावश्यक ‘और कहा’ दोहराए।
- source_word: אֶלְדָּד וּמֵידָד
  choice: एलदाद और मेदाद
  rationale: व्यक्तिनामों का मानक देवनागरी लिप्यंतरण किया गया है।
- source_word: מִתְנַבְּאִים
  choice: भविष्यवाणी कर रहे हैं
  rationale: נבא का Hitpael कृदन्त चल रही भविष्यद्वाणी-संबंधी गतिविधि दर्शाता है; यह हिन्दी में मानक और स्पष्ट अभिव्यक्ति है।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה इस जंगल-यात्रा के संदर्भ में इस्राएली समुदाय की छावनी है; ‘छावनी में’ सटीक और सहज है।
