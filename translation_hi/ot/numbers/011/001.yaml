id: NUM.11.1
reference: Numbers 11:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֤י הָ/עָם֙ כְּ/מִתְאֹ֣נְנִ֔ים רַ֖ע בְּ/אָזְנֵ֣י יְהוָ֑ה וַ/יִּשְׁמַ֤ע יְהוָה֙ וַ/יִּ֣חַר אַפּ֔/וֹ וַ/תִּבְעַר בָּ/ם֙ אֵ֣שׁ יְהוָ֔ה וַ/תֹּ֖אכַל בִּ/קְצֵ֥ה הַֽ/מַּחֲנֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/001.yaml
  text: The people were like those who complain of hardship in the hearing of Yahweh[a], and Yahweh heard it, and his anger burned[d][c][b], and the fire of Yahweh burned among them and consumed some at the edge of the camp.
translation:
  language: hi
  text: लोग यहोवा के सुनते हुए कठिनाई की शिकायत करनेवालों जैसे थे[a], और यहोवा ने सुना; उसका क्रोध भड़क उठा, और यहोवा की आग उनके बीच भड़क उठी[b] और छावनी के छोर पर भस्म कर गई[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोग शिकायत करनेवालों जैसे थे,” अथवा संभवतः, “लोग मानो शिकायत कर रहे थे।” यहाँ प्रयुक्त इब्रानी रूप दुर्लभ और कुछ कठिन है।
    reason: lexical_alternative
  - marker: b
    text: या, “यहोवा की ओर से आई आग उनके बीच भड़क उठी।”
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, “और उसने छावनी के छोर पर भस्म किया।” मूल पाठ क्रिया का कर्म स्पष्ट नहीं करता; यह नहीं बताता कि वहाँ लोग भस्म हुए या छावनी की कोई वस्तु अथवा भाग।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי הָעָם כְּמִתְאֹנְנִים רַע
  choice: लोग ऐसे हो गए मानो वे कठिनाई की शिकायत कर रहे हों
  rationale: दुर्लभ और कठिन כְּמִתְאֹנְנִים में तुलना या आभास का भाव है; רַע को यहाँ विपत्ति या कठिनाई के रूप में समझना प्रसंगानुकूल है। हिंदी में यह रूप आरंभिक/परिवर्तित दशा और मूल की अनिश्चितता दोनों बनाए रखता है।
- source_word: בְּאָזְנֵי יְהוָה
  choice: यह यहोवा के सुनने में आया
  rationale: शाब्दिक 'यहोवा के कानों में' के श्रवण-बिंब को स्वाभाविक हिंदी मुहावरे में रखा गया है और यह स्पष्ट किया गया है कि शिकायत उसके ध्यान में आई।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: וַיִּחַר אַפּוֹ
  choice: उसका क्रोध भड़क उठा
  rationale: इब्रानी के जलने/तपने वाले क्रोध के मुहावरे और ताप-बिंब को सहज आधुनिक हिंदी में सुरक्षित रखा गया है।
- source_word: וַתִּבְעַר בָּם אֵשׁ יְהוָה
  choice: यहोवा की आग उनके बीच भड़क उठी
  rationale: संबंधवाचक रचना 'यहोवा की आग' को सीधे रखा गया है; בָּם को 'उनके बीच' कहना उसके समुदाय के भीतर आग लगने का भाव देता है।
- source_word: וַתֹּאכַל בִּקְצֵה הַמַּחֲנֶה
  choice: छावनी के छोर के एक भाग को भस्म कर गई
  rationale: मूल में व्यक्तियों को सूचित करने वाला 'कुछ लोग' नहीं है। क्रिया का निहित कर्म छावनी का बाहरी भाग भी हो सकता है, इसलिए अनावश्यक मानवीय कर्म जोड़े बिना स्थानिक वाक्यांश को कर्म के रूप में स्वाभाविक बनाया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत नाम है। हिंदी पाठकों के लिए पहचाने जाने योग्य लिप्यंतरण 'यहोवा' नाम को उपाधि में बदलने से बचाता है।
- issue: आग का यहोवा से संबंध
  choice: यहोवा की आग
  alternative: यहोवा की ओर से आई आग
  rationale: אֵשׁ יְהוָה की संबंधवाचक अस्पष्टता को सीधे सुरक्षित रखा गया है; स्रोत/उद्गम की व्याख्या मुख्य पाठ में आरोपित नहीं की गई।
- issue: छावनी के छोर पर किसका भस्म होना
  choice: छावनी के छोर के एक भाग को भस्म कर गई
  alternative: छावनी के छोर पर कुछ लोगों को भस्म कर गई
  rationale: इब्रानी पाठ केवल स्थान बताता है और स्पष्ट कर्म नहीं देता। इसलिए मनुष्यों की मृत्यु को निश्चित करके जोड़ने के बजाय वास्तविक अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है। 'छावनी', 'क्रोध भड़क उठा' और 'भस्म' जैसे व्यापक रूप से समझे जाने वाले बाइबलीय-साहित्यिक शब्द रखे गए हैं; मूल की दुर्लभ तुलना और अंतिम कर्म की अस्पष्टता पादटिप्पणियों सहित सुरक्षित है।
