base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/007.yaml
  text: The manna was like coriander seed[a], and its appearance was like the appearance of bdellium.
translation:
  language: hi
  text: मन्ना धनिए के बीज जैसा था, और उसका रूप बदोलह[a] के रूप जैसा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बदोलह’ की सटीक पहचान अनिश्चित है। यह किसी सुगंधित राल या गोंद का नाम हो सकता है; कुछ लोग इसे मोती या स्फटिक जैसे रत्न-सदृश पदार्थ के रूप में समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמָּן
  choice: मन्ना
  rationale: यह निश्चित संज्ञा उस परिचित मरुभूमि के भोजन को दर्शाती है; हिन्दी में ‘मन्ना’ स्वाभाविक रूप से बिना किसी अतिरिक्त संकेतक के निश्चित अर्थ देता है।
- source_word: כִּזְרַע גַּד
  choice: धनिए के बीज जैसा
  rationale: כִּ समानता प्रकट करता है और גַּד की सामान्य पहचान धनिया है; यह अनुवाद ठोस तुलना को सरल और स्पष्ट रखता है।
- source_word: וְעֵינוֹ
  choice: और उसका रूप
  rationale: עַיִן का मूल अर्थ ‘आँख’ है, पर यहाँ यह मुहावरे के रूप में दिखाई देने वाले रूप या स्वरूप को व्यक्त करता है।
- source_word: כְּעֵין
  choice: के रूप जैसा था
  rationale: मूल पाठ में עַיִן से जुड़ी अभिव्यक्ति की पुनरावृत्ति है; ‘रूप ... के रूप जैसा’ उस दृश्य समानता और समानांतरता को बनाए रखता है।
- source_word: הַבְּדֹלַח
  choice: बदोलह
  rationale: इस पदार्थ की सटीक पहचान अनिश्चित है। व्याख्यात्मक विकल्प चुनने के बजाय इब्रानी शब्द का निकट देवनागरी लिप्यंतरण अस्पष्टता को सुरक्षित रखता है, और पाद-टिप्पणी संभावित अर्थ बताती है।
