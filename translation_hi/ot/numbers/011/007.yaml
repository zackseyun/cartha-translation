translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण वाक्य रखा गया है। मूल इब्रानी की दृश्य तुलना और ‘रूप’ की पुनरावृत्ति सुरक्षित रखी गई है। आरंभिक וְ को अलग से ‘अब’ नहीं बनाया गया, क्योंकि यहाँ कोई स्पष्ट कालवाचक ‘अब’ नहीं है।
