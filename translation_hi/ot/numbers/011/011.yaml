id: NUM.11.11
reference: Numbers 11:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל יְהוָ֗ה לָ/מָ֤ה הֲרֵעֹ֨תָ֙ לְ/עַבְדֶּ֔/ךָ וְ/לָ֛/מָּה לֹא מָצָ֥תִי חֵ֖ן בְּ/עֵינֶ֑י/ךָ לָ/שׂ֗וּם אֶת מַשָּׂ֛א כָּל הָ/עָ֥ם הַ/זֶּ֖ה עָלָֽ/י־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/011.yaml
  text: And Moses said to Yahweh[a], “Why have you treated your servant badly? And why have I not found favor in your eyes[c][b], that you have laid the burden of all this people on me?”
translation:
  language: hi
  text: तब मूसा ने यहोवा से कहा, “तूने अपने दास के साथ बुरा व्यवहार क्यों किया? और मुझ पर तेरी कृपादृष्टि क्यों नहीं हुई,[a] कि तूने इस पूरी प्रजा का बोझ मुझ पर डाल दिया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैंने तेरी आँखों में अनुग्रह क्यों नहीं पाया?” यह किसी की कृपा प्राप्त करने का एक सामान्य इब्रानी मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: הֲרֵעֹתָ לְעַבְדֶּךָ
  choice: तूने अपने दास के साथ बुरा व्यवहार क्यों किया
  rationale: यह हिफ़ील क्रिया मूसा की शिकायत में बुरा करने या कष्टदायक व्यवहार का भाव व्यक्त करती है। यह चयन शिकायत की तीव्रता बनाए रखता है, पर परमेश्वर द्वारा नैतिक बुराई करने का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְעַבְדֶּךָ
  choice: अपने दास
  rationale: यहाँ मूसा परमेश्वर के सामने अपने लिए आदरपूर्ण और अधीनतासूचक संबोधन प्रयोग करता है; ‘दास’ इस बाइबिलीय संबंध को संक्षेप में व्यक्त करता है।
- source_word: מָצָתִי חֵן בְּעֵינֶיךָ
  choice: मुझ पर तेरी कृपादृष्टि हुई
  rationale: शाब्दिक मुहावरा ‘तेरी आँखों में अनुग्रह पाया’ है। ‘कृपादृष्टि होना’ हिन्दी में स्वाभाविक रहते हुए दृष्टि और अनुग्रह दोनों भावों को बनाए रखता है।
- source_word: לָשׂוּם אֶת מַשָּׂא
  choice: बोझ ... डाल दिया
  rationale: ‘बोझ रखना’ की मूल रूपक-छवि को स्वाभाविक हिन्दी सहप्रयोग ‘बोझ डालना’ से व्यक्त किया गया है।
- source_word: כָּל הָעָם הַזֶּה
  choice: इस पूरी प्रजा
  rationale: हिब्रू में ‘प्रजा’ एकवचन सामूहिक संज्ञा है। हिन्दी ‘इस पूरी प्रजा’ उसी सामूहिकता को स्वाभाविक ढंग से बनाए रखता है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: कथात्मक क्रम को आधुनिक हिन्दी में सहज रूप से आगे बढ़ाने के लिए ‘तब’ चुना गया है।
theological_decisions:
- issue: परमेश्वर को कर्ता बनाकर הֲרֵעֹתָ का अर्थ
  choice: अपने दास के साथ बुरा व्यवहार किया
  alternative: अपने दास के साथ बुराई की
  rationale: मूल क्रिया ‘बुरा/अनिष्ट करना’ का प्रबल भाव रखती है, लेकिन वाक्य मूसा की व्यथित शिकायत है। चुना हुआ रूप तनाव को बनाए रखता है और साथ ही परमेश्वर पर नैतिक बुराई का लेखक होने का निष्कर्ष अनावश्यक रूप से नहीं थोपता।
- issue: חֵן בְּעֵינֶיךָ के मुहावरे का रूप
  choice: मुझ पर तेरी कृपादृष्टि नहीं हुई
  alternative: मैंने तेरी आँखों में अनुग्रह नहीं पाया
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी दी गई है, जबकि पादटिप्पणी मूल देहात्मक मुहावरे को दिखाती है; इस प्रकार अर्थ और स्रोत-रूप दोनों सुरक्षित रहते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। मूसा परमेश्वर को एकवचन निकट संबोधन ‘तू’ से संबोधित करता है, जो इब्रानी के एकवचन रूपों और प्रचलित हिन्दी बाइबिलीय शैली के अनुरूप है। ‘प्रजा’ एकवचन सामूहिक संज्ञा के रूप में मूल संरचना को सुरक्षित रखती है।
