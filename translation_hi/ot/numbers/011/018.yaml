source:
  edition: WLC
  text: וְ/אֶל הָ/עָ֨ם תֹּאמַ֜ר הִתְקַדְּשׁ֣וּ לְ/מָחָר֮ וַ/אֲכַלְתֶּ֣ם בָּשָׂר֒ כִּ֡י בְּכִיתֶם֩ בְּ/אָזְנֵ֨י יְהוָ֜ה לֵ/אמֹ֗ר מִ֤י יַאֲכִלֵ֨/נוּ֙ בָּשָׂ֔ר כִּי ט֥וֹב לָ֖/נוּ בְּ/מִצְרָ֑יִם וְ/נָתַ֨ן יְהוָ֥ה לָ/כֶ֛ם בָּשָׂ֖ר וַ/אֲכַלְתֶּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/018.yaml
  text: And to the people you shall say[a], ‘Consecrate yourselves for tomorrow, and you shall eat meat, because you have wept in the hearing of Yahweh, saying, “Who will feed us meat? For it was good for us in Egypt.” And Yahweh will give you meat, and you shall eat.”
translation:
  language: hi
  text: और लोगों से यह कहना, ‘कल के लिए अपने आपको पवित्र करो[a], और तुम मांस खाओगे; क्योंकि तुम यहोवा की सुनवाई में रोए हो, यह कहते हुए, “हमें मांस कौन खिलाएगा? क्योंकि मिस्र में हमारे लिए अच्छा था।” और यहोवा तुम्हें मांस देगा, और तुम खाओगे।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कल के लिए अपने आपको अलग करके तैयार करो।” इब्रानी क्रिया में यहोवा की आगामी कार्रवाई की तैयारी में स्वयं को पवित्र अथवा अलग करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֹּאמַר
  choice: कहना
  rationale: द्वितीय पुरुष एकवचन अपूर्ण क्रिया यहाँ मूसा को दिए गए निर्देश के रूप में प्रयुक्त है; हिंदी का आज्ञार्थक ‘कहना’ इस निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִתְקַדְּשׁוּ
  choice: अपने आपको पवित्र करो
  rationale: हित्पएल आज्ञार्थक रूप परमेश्वर की आगामी कार्रवाई के लिए स्वयं को अलग और तैयार करने का धार्मिक भाव रखता है; ‘पवित्र करो’ इस भाव को बनाए रखता है।
- source_word: לְמָחָר
  choice: कल के लिए
  rationale: לְ आगामी दिन को ध्यान में रखकर तैयारी करने का संकेत देता है; ‘कल के लिए’ निकट और स्वाभाविक समतुल्य है।
- source_word: וַאֲכַלְתֶּם בָּשָׂר
  choice: और तुम मांस खाओगे
  rationale: בָּשָׂר यहाँ भोजन के रूप में मांस है, और आज्ञा के बाद आया क्रियारूप भावी परिणाम व्यक्त करता है।
- source_word: בְּכִיתֶם
  choice: तुमने ... रोकर कहा है
  rationale: पूर्ण क्रिया पूर्व में हुए रोने को वर्तमान परिस्थिति का कारण बताती है; हिंदी पूर्ण रूप उसकी वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: בְּאָזְנֵי יְהוָה
  choice: यहोवा के सुनते हुए
  rationale: शाब्दिक ‘यहोवा के कानों में’ का आशय है कि शिकायत यहोवा की सुनवाई में की गई; चुना हुआ रूप उस बिंब और अर्थ को सहज हिंदी में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ द्वारा दर्शाया गया है।
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: हमें मांस कौन खिलाएगा?
  rationale: אכל का हिफ़िल रूप कारक अर्थ ‘खिलाना’ देता है; हिंदी में यह संक्षिप्त और सटीक है।
- source_word: כִּי טוֹב לָנוּ בְּמִצְרָיִם
  choice: क्योंकि मिस्र में हमारा भला था
  rationale: यह मूल के ‘हमारे लिए अच्छा था’ को बिना अनकहे तुलनात्मक भाव को जोड़कर स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְנָתַן יְהוָה לָכֶם בָּשָׂר
  choice: इसलिए यहोवा तुम्हें मांस देगा
  rationale: וְ संदर्भ में लोगों की शिकायत से यहोवा की प्रतिक्रिया को जोड़ता है; ‘इसलिए’ इस कारण-परिणाम संबंध को स्पष्ट करता है, यद्यपि साधारण ‘और’ भी संभव है।
- source_word: וַאֲכַלְתֶּם
  choice: और तुम खाओगे
  rationale: मूल की पुनरावृत्ति को उसके बल और आगे आने वाली व्याख्या की भूमिका के लिए बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में व्यक्तिगत चतुरक्षरीय नाम सीधे आया है। हिंदी के सामान्य पाठकों में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘याहवे’ अधिक समीपस्थ विद्वत्तापूर्ण लिप्यंतरण है।
- issue: וְנָתַן में संबंध का स्वरूप
  choice: इसलिए यहोवा तुम्हें मांस देगा
  alternative: और यहोवा तुम्हें मांस देगा
  rationale: संदर्भ शिकायत को आगामी प्रत्युत्तर का कारण बनाता है। ‘इसलिए’ संबंध स्पष्ट करता है, पर मूल संयोजक स्वयं साधारण ‘और’ भी हो सकता है; इस विकल्प को निर्णय में खुला रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, सामान्य पाठक के लिए सहज किंतु गरिमापूर्ण शैली। संबोधन में बहुवचन ‘तुम’ रखा गया है। धार्मिक अर्थ वाले הִתְקַדְּשׁוּ को केवल ‘तैयार हो जाओ’ कहकर समतल नहीं किया गया; विकल्प पादटिप्पणी में दिया गया है।
