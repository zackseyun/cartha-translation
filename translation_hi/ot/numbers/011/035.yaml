base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/035.yaml
  text: From Kibroth-hattaavah the people set out for Hazeroth[a], and they stayed at Hazeroth.
translation:
  language: hi
  text: किब्रोत-हत्तावाह[a] से लोगों ने हसेरोत के लिए कूच किया, और वे हसेरोत में ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किब्रोत-हत्तावाह” का अर्थ “लालसा की कब्रें” या “वासना की कब्रें” है।
    reason: स्थान-नाम के मूल हिब्रू अर्थ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: מִ/קִּבְר֧וֹת הַֽתַּאֲוָ֛ה
  choice: किब्रोत-हत्तावाह से
  rationale: यह सामान्य संज्ञाओं से बना स्थान-नाम है, पर इस यात्रा-वृत्तांत में व्यक्तिवाचक नाम के रूप में प्रयुक्त हुआ है; इसलिए इसका अर्थ मुख्य पाठ में अनुवादित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נָסְע֥וּ
  choice: कूच किया
  rationale: यात्रा-वृत्तांत में यह क्रिया पड़ाव उठाकर आगे बढ़ने का भाव देती है। ‘कूच किया’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक रूप से यही अर्थ व्यक्त करता है।
- source_word: הָ/עָ֖ם
  choice: लोगों ने
  rationale: यहाँ עָם इस्राएली समुदाय को सामूहिक रूप से सूचित करता है; ‘लोग’ सहज और प्रसंगानुकूल हिन्दी है।
- source_word: חֲצֵר֑וֹת
  choice: हसेरोत
  rationale: यह स्थान-नाम है, इसलिए हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण अपनाया गया है।
- source_word: וַ/יִּהְי֖וּ בַּ/חֲצֵרֽוֹת
  choice: और वे हसेरोत में ठहरे रहे
  rationale: शाब्दिक अर्थ ‘और वे हसेरोत में थे’ है; यात्रा-सूची के प्रसंग में यह वहाँ पड़ाव डालकर रहने का संकेत देता है। ‘ठहरे रहे’ उस भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
