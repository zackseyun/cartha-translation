  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘पैदल चलनेवाले’ स्रोत की वास्तविक अस्पष्टता को बनाए रखता है; इसे निश्चित रूप से ‘पैदल सैनिक’ या ‘पुरुष’ नहीं बनाया गया। फुटनोट चिह्न वाक्य के अंत में रखा गया है क्योंकि वह ‘पूरे महीने भर’ की व्याख्या करता है।
