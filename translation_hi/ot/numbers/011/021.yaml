base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/021.yaml
  text: But Moses said[a], “The people among whom I am are six hundred thousand on foot, and yet you have said, ‘I will give them meat[b], and they will eat for a month of days.’”
translation:
  language: hi
  text: पर मूसा ने कहा, “जिन लोगों के बीच मैं हूँ, उनमें पैदल चलनेवाले छह लाख हैं, और तूने कहा है, ‘मैं उन्हें मांस दूँगा, और वे पूरे एक महीने तक[a] खाएँगे।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “दिनों का एक महीना”; यह एक पूरे महीने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर मूसा ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर प्रसंग में मूसा की आपत्तिपूर्ण प्रतिक्रिया के कारण ‘पर’ स्वाभाविक विरोधसूचक अर्थ व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף
  choice: छः लाख
  rationale: यह संख्या का सीधा और आधुनिक हिन्दी में स्वाभाविक रूप है।
- source_word: רַגְלִי הָעָם
  choice: लोगों में पैदल चलनेवाले छः लाख हैं
  rationale: רַגְלִי का संबंध ‘पाँव’ से है और यहाँ पैदल चलनेवालों को सूचित करता है। यह अनुवाद ‘पैदल सैनिक’ या केवल ‘पुरुष’ कहकर अर्थ को अनावश्यक रूप से सैन्य अथवा लैंगिक रूप नहीं देता।
- source_word: אֲשֶׁר אָנֹכִי בְּקִרְבּוֹ
  choice: जिन लोगों के बीच मैं हूँ
  rationale: בקרב का अर्थ ‘के बीच/मध्य में’ है; यह हिन्दी में स्वाभाविक रहते हुए मूसा की उनके बीच उपस्थिति को बनाए रखता है।
- source_word: וְאַתָּה אָמַרְתָּ
  choice: और तूने कहा है
  rationale: स्पष्ट सर्वनाम אַתָּה पर बल है। ‘तू’ परमेश्वर से प्रत्यक्ष संबोधन की हिब्रू एकवचनता रखता है, और ‘कहा है’ अभी-अभी कही बात की वर्तमान प्रासंगिकता दर्शाता है।
- source_word: בָּשָׂר
  choice: मांस
  rationale: इस प्रसंग में यह खाने के लिए पशु-मांस को दर्शाता है; ‘मांस’ इसका सामान्य आधुनिक हिन्दी समतुल्य है।
- source_word: אֶתֵּן לָהֶם
  choice: मैं उन्हें मांस दूँगा
  rationale: प्रथम पुरुष अपूर्ण क्रिया यहाँ भविष्य की प्रतिज्ञा अथवा घोषित अभिप्राय व्यक्त करती है।
- source_word: וְאָכְלוּ
  choice: और वे ... खाएँगे
  rationale: यह समन्वित भविष्य परिणाम को बताता है, केवल उद्देश्य को नहीं।
- source_word: חֹדֶשׁ יָמִים
  choice: पूरे महीने भर
  rationale: शाब्दिक ‘दिनों का एक महीना’ एक मुहावरा है जिसका स्वाभाविक हिन्दी अर्थ ‘पूरा महीना’ है; ‘महीने भर’ अवधि को स्पष्ट करता है।
