  yaml_path: translation/ot/numbers/011/030.yaml
  text: Then Moses returned to the camp[a], he and the elders of Israel.
translation:
  language: hi
  text: तब मूसा और इस्राएल के बुज़ुर्ग छावनी में लौट आए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “तब मूसा छावनी में फिर से सम्मिलित हुआ—वह और इस्राएल के बुज़ुर्ग।” इब्रानी क्रिया का अधिक शाब्दिक अनुवाद सम्भव है, पर इस प्रसंग में उसका अर्थ छावनी में वापस जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּאָסֵף
  choice: लौट आया
  rationale: אסף के निफ़ाल रूप का शाब्दिक अर्थ ‘इकट्ठा किया गया’ हो सकता है, पर यहाँ प्रसंग में मूसा के फिर छावनी में जाने का भाव है। ‘लौट आया’ आधुनिक हिन्दी में स्वाभाविक रूप से यही अर्थ व्यक्त करता है।
- source_word: אֶל הַמַּחֲנֶה
  choice: छावनी में
  rationale: אֶל दिशा को दर्शाता है और מַחֲנֶה इस्राएल की छावनी है। हिन्दी में लौटने की क्रिया के साथ ‘छावनी में’ सहज है और गंतव्य का अर्थ स्पष्ट रखता है।
- source_word: הוּא וְזִקְנֵי יִשְׂרָאֵל
  choice: वह और इस्राएल के पुरनिए
  rationale: הוּא का स्पष्ट अनुवाद मूल की पुनरुक्त, बलात्मक संरचना को बनाए रखता है और बताता है कि मूसा के साथ पुरनिए भी लौटे।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनिए
  rationale: यह סמיכות संरचना का सीधा और हिन्दी बाइबिलीय परंपरा में परिचित अनुवाद है; ‘पुरनिए’ यहाँ समुदाय के मान्य अगुओं को सूचित करता है।
