source:
  edition: WLC
  text: וַ/יִּקְרָ֛א שֵֽׁם הַ/מָּק֥וֹם הַ/ה֖וּא תַּבְעֵרָ֑ה כִּֽי בָעֲרָ֥ה בָ֖/ם אֵ֥שׁ יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/003.yaml
  text: So he called the name of that place Taberah[a], because the fire of Yahweh burned among them.
translation:
  language: hi
  text: उसने उस स्थान का नाम तबेरा[a] रखा, क्योंकि यहोवा की आग उनके बीच भड़क उठी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तबेरा” नाम इब्रानी शब्द से संबंधित है, जिसका अर्थ “जलना” या “भड़क उठना” है।
    reason: स्थान-नाम תַּבְעֵרָה और आग के ‘भड़क उठने’ (בָעֲרָה) के बीच इब्रानी शब्द-संबंध को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם הַהוּא
  choice: उसने उस स्थान का नाम … रखा
  rationale: यह हिंदी में नामकरण का स्वाभाविक मुहावरा है और इब्रानी की स्पष्ट नामकरण-रचना को बनाए रखता है।
- source_word: תַּבְעֵרָה
  choice: तबएरा
  rationale: स्थान-नाम को ध्वन्यंतरित किया गया है; उससे जुड़े 'जलने' के शब्द-खेल को पादटिप्पणी स्पष्ट करती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कारण बताने वाले इब्रानी संबंध को स्पष्ट और सहज हिंदी में व्यक्त करता है।
- source_word: בָעֲרָה
  choice: जल उठी थी
  rationale: בער के जलने के अर्थ को स्वाभाविक कथात्मक हिंदी में व्यक्त करता है और तबएरा नाम से उसके ध्वन्यार्थ-संबंध को बनाए रखता है।
- source_word: בָם
  choice: उनके बीच
  rationale: यह आग के समुदाय या छावनी के भीतर फैलने का भाव देता है, न कि उनके शरीरों के अंदर जलने का।
- source_word: אֵשׁ יְהוָה
  choice: यहोवा की आग
  rationale: इब्रानी संबंधवाचक रचना को सीधे रखता है और वाचा के विशिष्ट नाम יהוה को हिंदी में प्रचलित रूप 'यहोवा' से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में विशिष्ट वाचा-नाम है; उसका नामरूप रखना सामान्य उपाधि से बदलने की अपेक्षा स्रोत के अधिक निकट है। हिंदी पाठकों के लिए 'यहोवा' सुस्थापित ध्वन्यंतरण है।
- issue: आग और यहोवा के संबंध का स्वरूप
  choice: यहोवा की आग
  alternative: यहोवा की ओर से आग
  rationale: मूल का אֵשׁ יְהוָה संक्षिप्त संबंधवाचक पद है। 'यहोवा की आग' उसकी संभावित स्वामित्व/उद्गम-संबंधी व्यापकता को सुरक्षित रखता है और केवल उद्गम के अर्थ तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। 'नाम रखा' हिंदी के स्वाभाविक नामकरण-मुहावरे के कारण चुना गया है; 'उनके बीच' सामुदायिक/छावनीगत संदर्भ को स्पष्ट रखता है।
