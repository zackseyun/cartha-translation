    reason: cross_reference
  revision_rationale: The revision strengthens fidelity to the Hebrew verbal expression by rendering ‘the words of Yahweh’ as ‘याहवे के वचन’ and its spoken delivery as ‘सुनाए.’ It also makes the causative sense of ‘caused them to stand’ explicit with ‘खड़ा कराया.’ No contextual expansion or doctrinal interpretation has been added.
