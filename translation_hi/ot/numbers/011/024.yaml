  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּצֵ֣א מֹשֶׁ֗ה וַ/יְדַבֵּר֙ אֶל הָ/עָ֔ם אֵ֖ת דִּבְרֵ֣י יְהוָ֑ה וַ/יֶּאֱסֹ֞ף שִׁבְעִ֥ים אִישׁ֙ מִ/זִּקְנֵ֣י הָ/עָ֔ם וַֽ/יַּעֲמֵ֥ד אֹתָ֖/ם סְבִיבֹ֥ת הָ/אֹֽהֶל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/024.yaml
  text: So Moses went out and spoke to the people the words of Yahweh[b][a]. He gathered seventy men from the elders of the people and stationed them around the tent.
translation:
  language: hi
  text: तब मूसा बाहर गया और उसने लोगों को याहवे के वचन सुनाए। उसने लोगों के बुज़ुर्गों में से सत्तर पुरुषों को इकट्ठा किया और उन्हें तंबू[b] के चारों ओर खड़ा कराया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें वहाँ ठहराया’ अथवा ‘उन्हें खड़ा किया।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘खड़ा करवाना’ है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘तंबू’; प्रसंग में संभवतः मिलापवाले तंबू की ओर संकेत है।
    reason: cross_reference
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: बाहर गया
  rationale: יצא कथा के इस क्रम में पहले स्थान से बाहर जाने को दर्शाता है; ‘बाहर गया’ स्वाभाविक और सीधा हिन्दी रूप है।
- source_word: וַיְדַבֵּר אֶל־הָעָם אֵת דִּבְרֵי יְהוָה
  choice: उसने लोगों को याहवे की बातें बताईं
  rationale: यह रूप लोगों से बोलने और याहवे के वचनों को उन तक पहुँचाने—दोनों भावों को स्वाभाविक आधुनिक हिन्दी में रखता है; बहुवचन ‘बातें’ मूल के דִּבְרֵי को प्रतिबिंबित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम की प्रचलित विद्वत्तापूर्ण ध्वन्यात्मक प्रस्तुति को शीर्षक से बदलने के बजाय सुरक्षित रखा गया है।
- source_word: וַיֶּאֱסֹף
  choice: इकट्ठा किया
  rationale: אסף का मूल भाव लोगों को एकत्र करना है; ‘इकट्ठा किया’ सामान्य पाठक के लिए सहज है।
- source_word: שִׁבְעִים אִישׁ
  choice: सत्तर पुरुषों
  rationale: संख्या के बाद सामूहिक अर्थ में प्रयुक्त אִישׁ यहाँ पुरुष अगुओं को सूचित करता है, इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: מִזִּקְנֵי הָעָם
  choice: लोगों के बुज़ुर्गों में से
  rationale: מִן का अंशवाचक अर्थ ‘में से’ द्वारा स्पष्ट होता है। ‘बुज़ुर्ग’ यहाँ समुदाय के मान्य वरिष्ठों को दर्शाता है और आधुनिक हिन्दी में ‘पुरनियों’ से अधिक स्वाभाविक है।
- source_word: וַיַּעֲמֵד אֹתָם
  choice: उन्हें … खड़ा किया
  rationale: עמד के हिफ़ील रूप का शाब्दिक कार्यवाचक भाव ‘खड़ा कराया/खड़ा किया’ है; यहाँ ‘खड़ा किया’ स्पष्ट और स्वाभाविक है।
- source_word: סְבִיבֹת הָאֹהֶל
  choice: तंबू के चारों ओर
  rationale: סְבִיבֹת का अर्थ ‘चारों ओर’ और הָאֹהֶל का शाब्दिक अर्थ ‘तंबू’ है; मूल में ‘मिलाप का’ नहीं जोड़ा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है।
- issue: שִׁבְעִים אִישׁ में लिंग का निरूपण
  choice: सत्तर पुरुषों
  alternative: सत्तर व्यक्तियों
  rationale: אִישׁ पुल्लिंग है और प्रसंग में चुने गए बुज़ुर्ग पुरुषों की ओर संकेत करता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथा-शैली वाला रूप अपनाया गया है। ‘बुज़ुर्ग’ को केवल आयु नहीं, समुदाय के मान्य वरिष्ठों के अर्थ में प्रयोग किया गया है। मूल की संक्षिप्तता और ‘तंबू’ संबंधी निहित संदर्भ को बिना विस्तार जोड़े सुरक्षित रखा गया है।
