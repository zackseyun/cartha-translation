source:
  edition: WLC
  text: הֶ/אָנֹכִ֣י הָרִ֗יתִי אֵ֚ת כָּל הָ/עָ֣ם הַ/זֶּ֔ה אִם אָנֹכִ֖י יְלִדְתִּ֑י/הוּ כִּֽי תֹאמַ֨ר אֵלַ֜/י שָׂאֵ֣/הוּ בְ/חֵיקֶ֗/ךָ כַּ/אֲשֶׁ֨ר יִשָּׂ֤א הָ/אֹמֵן֙ אֶת הַ/יֹּנֵ֔ק עַ֚ל הָֽ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֖עְתָּ לַ/אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/012.yaml
  text: Did I conceive all this people? Did I give birth to him[a], that you should say to me, ‘Carry him in your bosom[b], as a guardian carries a nursing child,’ to the land that you swore to his fathers?
translation:
  language: hi
  text: क्या मैंने ही इस सारी प्रजा को गर्भ में धारण किया था? क्या मैंने ही इसे जन्म दिया था[a], कि तू मुझसे कहे, ‘इसे अपनी गोद में लेकर चल, जैसे कोई पालक दूध पीते बच्चे को लेकर चलता है,’ उस देश तक जिसे देने की शपथ तूने इसके पुरखाओं से खाई थी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘प्रजा’ को समूहवाचक एकवचन मानकर यहाँ और आगे ‘इसे’ तथा ‘इसके पुरखाओं’ कहा गया है; भावानुसार ‘इन्हें’ और ‘इनके पुरखाओं’ भी अनुवाद किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֶאָנֹכִי הָרִיתִי
  choice: क्या मैंने ही ... गर्भ में धारण किया था?
  rationale: प्रश्नवाचक रूप और स्वतंत्र सर्वनाम का बल ‘मैंने ही’ से व्यक्त होता है; ‘गर्भ में धारण करना’ मातृत्व के रूपक को स्पष्ट और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: כָּל הָעָם הַזֶּה
  choice: इस सारी प्रजा
  rationale: עָם एकवचन समूहवाचक संज्ञा है। ‘प्रजा’ आधुनिक हिंदी में समूह के रूप में स्वाभाविक है और आगे के एकवचन संकेतों के साथ मेल खाती है।
- source_word: אִם אָנֹכִי יְלִדְתִּיהוּ
  choice: क्या मैंने ही इसे जन्म दिया था
  rationale: दूसरा अलंकारिक प्रश्न प्रसव के रूपक को जारी रखता है। ‘इसे’ मूल के एकवचन प्रत्यय को सुरक्षित रखकर पूरी प्रजा को एक शिशु के रूप में प्रस्तुत करता है।
- source_word: שָׂאֵהוּ בְחֵיקֶךָ
  choice: इसे अपनी गोद में उठा ले
  rationale: חֵיק गोद या वक्षस्थल का बोध देता है। हिंदी में बच्चे को ‘गोद में उठाना’ सटीक, ठोस और स्वाभाविक अभिव्यक्ति है।
- source_word: הָאֹמֵן
  choice: पालनकर्ता
  rationale: यह शब्द बच्चे की देखभाल और पालन करने वाले व्यक्ति को दर्शाता है। ‘पालनकर्ता’ भूमिका को व्यक्त करता है, पर अनावश्यक रूप से उसका लिंग या विशिष्ट पद तय नहीं करता।
- source_word: הַיֹּנֵק
  choice: दूध पीते बच्चे
  rationale: मूल शब्द उस छोटे बच्चे को दर्शाता है जो अभी दूध पीता है। यह रूप आधुनिक हिंदी में स्पष्ट है और शैशव की विशेष अवस्था को बनाए रखता है।
- source_word: עַל הָאֲדָמָה
  choice: उस देश में ले जा
  rationale: गति और प्रतिज्ञात गंतव्य के संदर्भ में עַל का भाव लक्ष्य की ओर है; ‘देश में ले जा’ हिंदी में इस दिशा को स्पष्ट करता है।
- source_word: אֲשֶׁר נִשְׁבַּעְתָּ לַאֲבֹתָיו
  choice: जिसकी शपथ तूने इसके पुरखाओं से खाई थी
  rationale: ‘शपथ खाना’ वाचा-संबंधी शपथ की गंभीरता बनाए रखता है। ‘इसके पुरखाओं’ में एकवचन समूहवाचक संबंध सुरक्षित है।
theological_decisions:
- issue: इस्राएल की प्रजा के लिए समूहवाचक एकवचन
  choice: ‘इसे’ और ‘इसके पुरखाओं’ जैसे एकवचन रूप बनाए रखे गए
  alternative: ‘इन्हें’ और ‘इनके पुरखाओं’ जैसे बहुवचन रूप
  rationale: इब्रानी पाठ प्रजा को एक समूहवाचक एकवचन मानकर एक ही शिशु के रूपक में प्रस्तुत करता है। हिंदी में ‘प्रजा’ के साथ एकवचन संकेत समझने योग्य हैं और इस रूपक को अधिक स्पष्टता से बचाए रखते हैं।
- issue: הָאֹמֵן की देखभाल-संबंधी भूमिका
  choice: पालनकर्ता
  alternative: धाय; पालक पिता; देखभाल करने वाला
  rationale: मूल शब्द बच्चे को संभालने और पालने वाले व्यक्ति को सूचित करता है, पर संदर्भ उसकी भूमिका का हर पहलू निश्चित नहीं करता। ‘पालनकर्ता’ इस अर्थ-व्याप्ति को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर को संबोधन में प्रसंगानुकूल निकट एकवचन ‘तू’ रखा गया है। मातृत्व और शिशु-पालन के रूपक को ठोस हिंदी मुहावरों—‘गर्भ में धारण करना,’ ‘जन्म देना,’ और ‘गोद में उठाना’—से सुरक्षित रखा गया है।
