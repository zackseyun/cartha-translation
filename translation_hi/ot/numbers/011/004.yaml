  text: וְ/הָֽ/אסַפְסֻף֙ אֲשֶׁ֣ר בְּ/קִרְבּ֔/וֹ הִתְאַוּ֖וּ תַּאֲוָ֑ה וַ/יָּשֻׁ֣בוּ וַ/יִּבְכּ֗וּ גַּ֚ם בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יֹּ֣אמְר֔וּ מִ֥י יַאֲכִלֵ֖/נוּ בָּשָֽׂר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/004.yaml
  text: The rabble among them had a strong craving[a], and the sons of Israel also turned back and wept, and said[d][c][b], “Who will feed us meat?”
translation:
  language: hi
  text: उनके बीच की उपद्रवी भीड़[a] ने तीव्र लालसा की[b], और इस्राएली भी[c] फिर रोने लगे और कहने लगे, “हमें मांस कौन खिलाएगा?”[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिली-जुली भीड़।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ और निंदात्मक है तथा इस्राएल के बीच के एक गौण जनसमूह की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उन्होंने लालसा की लालसा की,” अर्थात उन्होंने बहुत तीव्र इच्छा की।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “इस्राएल के पुत्र भी।”
    reason: lexical_alternative
  - marker: d
    text: या “हमें खाने के लिए मांस कौन देगा?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאסַפְסֻף
  choice: आवारा भीड़
  rationale: यह एक दुर्लभ और निंदात्मक सामूहिक संज्ञा है। ‘आवारा भीड़’ उसके नकारात्मक भाव और मुख्य समुदाय के भीतर मौजूद अनियंत्रित जनसमूह—दोनों को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: אֲשֶׁר בְּקִרְבּוֹ
  choice: उनके बीच की
  rationale: शाब्दिक अर्थ ‘जो उसके/उनके बीच में थी’ है। सन्दर्भ में यह भीड़ इस्राएली छावनी के भीतर थी; हिन्दी में ‘उनके बीच की’ संक्षिप्त और सहज है।
- source_word: הִתְאַוּוּ תַּאֲוָה
  choice: प्रबल लालसा करने लगी
  rationale: इब्रानी में क्रिया और उसी मूल की संज्ञा साथ आकर इच्छा की तीव्रता पर बल देती हैं। हिन्दी में कृत्रिम पुनरुक्ति के बजाय ‘प्रबल लालसा’ वही जोर स्वाभाविक रूप से पहुँचाती है।
- source_word: וַיָּשֻׁבוּ וַיִּבְכּוּ
  choice: फिर रोने लगे
  rationale: שׁוּב यहाँ किसी क्रिया को दोबारा करने के अर्थ में है। ‘फिर रोने लगे’ हिन्दी में पुनरारम्भ का भाव स्पष्ट करता है और अनावश्यक भौतिक ‘लौटने’ का संकेत नहीं देता।
- source_word: גַּם בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली भी
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र भी’ है, पर यहाँ यह पूरे जातीय समुदाय का प्रचलित नाम है। ‘इस्राएली भी’ आधुनिक हिन्दी में समावेशी, स्पष्ट और स्वाभाविक है।
- source_word: מִי יַאֲכִלֵנוּ בָּשָׂר
  choice: हमें मांस कौन खिलाएगा?
  rationale: אכל का हिफ़ील रूप ‘खिलाना’ या ‘खाने को देना’ दर्शाता है, और בָּשָׂר यहाँ भोजन के रूप में मांस है। यह अनुवाद संक्षिप्त और सीधे प्रश्न के अनुरूप है।
