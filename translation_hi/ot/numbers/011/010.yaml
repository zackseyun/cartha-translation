source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע מֹשֶׁ֜ה אֶת הָ/עָ֗ם בֹּכֶה֙ לְ/מִשְׁפְּחֹתָ֔י/ו אִ֖ישׁ לְ/פֶ֣תַח אָהֳל֑/וֹ וַ/יִּֽחַר אַ֤ף יְהוָה֙ מְאֹ֔ד וּ/בְ/עֵינֵ֥י מֹשֶׁ֖ה רָֽע־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/010.yaml
  text: Moses heard the people weeping by their clans[a], each man at the entrance of his tent. And the anger of Yahweh burned greatly[b], and it was evil in the eyes of Moses.
translation:
  language: hi
  text: मूसा ने लोगों को अपने-अपने कुलों में रोते हुए सुना; हर एक पुरुष अपने तंबू के द्वार पर था। तब याहवे का क्रोध बहुत भड़क उठा, और मूसा की दृष्टि में यह बुरा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या “इससे मूसा अप्रसन्न हुआ।” शाब्दिक अर्थ है, “मूसा की दृष्टि में यह बुरा था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुना
  rationale: यहाँ क्रिया लोगों के रोने को सुन लेने का बोध कराती है, ध्यानपूर्वक आज्ञापालन का नहीं।
- source_word: בֹּכֶה
  choice: रोते हुए
  rationale: इब्रानी कृदंत जारी क्रिया को व्यक्त करता है; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: לְמִשְׁפְּחֹתָיו
  choice: अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה निकट संबंध पर आधारित परिवार-समूह या कुल को दर्शा सकता है; यह अनुवाद सामूहिक विन्यास और अर्थ-सीमा दोनों को बनाए रखता है।
- source_word: אִישׁ
  choice: हर एक पुरुष
  rationale: वितरणात्मक पुल्लिंग एकवचन को स्पष्ट रूप से रखा गया है, जिससे प्रत्येक पुरुष के अपने तंबू के द्वार पर होने का चित्र बना रहता है।
- source_word: לְפֶתַח אָהֳלוֹ
  choice: अपने तंबू के द्वार पर
  rationale: פֶּתַח तंबू के प्रवेश-स्थान को दर्शाता है; 'द्वार पर' आधुनिक हिंदी में स्वाभाविक है।
- source_word: וַיִּחַר אַף יְהוָה מְאֹד
  choice: यहोवा का क्रोध बहुत भड़क उठा
  rationale: यह अभिव्यक्ति इब्रानी के जलते क्रोध के रूपक और מְאֹד की तीव्रता को सुबोध हिंदी में सुरक्षित रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिवाचक दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप 'यहोवा' से प्रस्तुत किया गया है।
- source_word: וּבְעֵינֵי מֹשֶׁה רָע
  choice: मूसा की दृष्टि में यह बुरा था
  rationale: इब्रानी मुहावरे को निकटता से रखते हुए यह अस्पष्ट छोड़ा गया है कि मूसा को ठीक किस बात का बुरा लगा।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में परमेश्वर का व्यक्तिगत नाम है। आधुनिक हिंदी बाइबलीय प्रयोग में पहचाने जाने योग्य 'यहोवा' चुना गया, बिना उसे 'प्रभु' जैसी उपाधि से बदलने के।
- issue: וּבְעֵינֵי מֹשֶׁה רָע में निहित कर्ता और मूल्यांकन
  choice: मूसा की दृष्टि में यह बुरा था
  alternative: इससे मूसा अप्रसन्न हुआ
  rationale: मूल पाठ यह स्पष्ट नहीं करता कि मूसा की दृष्टि में लोगों का रोना, यहोवा का क्रोध, या पूरी परिस्थिति बुरी थी। शाब्दिक मुहावरा इस वास्तविक अस्पष्टता और नैतिक/भावात्मक तनाव को बनाए रखता है।
- issue: वितरणात्मक אִישׁ का लिंग
  choice: हर एक पुरुष
  alternative: हर एक व्यक्ति
  rationale: इब्रानी में पुल्लिंग एकवचन वितरणात्मक रूप से आया है; संदर्भ को अनावश्यक रूप से लिंग-निरपेक्ष नहीं बनाया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। 'भड़क उठा' क्रोध के जलने वाले इब्रानी रूपक को स्वाभाविक हिंदी में व्यक्त करता है। अंतिम वाक्यांश को सरल व्याख्या में बदलने के बजाय उसकी मूल अस्पष्टता सुरक्षित रखी गई है।
