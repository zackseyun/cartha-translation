translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। ‘प्रजा’ सामूहिक עָם के अनुरूप है। עָלַי की मुहावरेदार अस्पष्टता को मुख्य पाठ में स्वाभाविक रूप और पादटिप्पणी में विकल्पों द्वारा सुरक्षित रखा गया है।
