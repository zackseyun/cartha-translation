base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/013.yaml
  text: Where am I to get meat to give to all this people? For they are weeping before me[a], saying, ‘Give us meat, so that we may eat.’
translation:
  language: hi
  text: मैं इस पूरी प्रजा को देने के लिए मांस कहाँ से लाऊँ? क्योंकि वे मेरे सामने रोते हुए कहते हैं,[a] ‘हमें मांस दे कि हम खाएँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे मुझसे रो-रोकर कहते हैं” अथवा “वे अपने रोने से मुझ पर दबाव डालते हैं।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “वे मुझ पर रोते हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵאַיִן לִי
  choice: मैं ... कहाँ से लाऊँ
  rationale: מֵאַיִן स्रोत के विषय में प्रश्न करता है और לִי मूसा की असमर्थता को व्यक्त करता है। स्वाभाविक हिन्दी में यह संयोजन मूल प्रश्न और उसकी व्याकुलता दोनों को व्यक्त करता है।
- source_word: בָּשָׂר
  choice: मांस
  rationale: भोजन की इस प्रसंगगत माँग में शब्द का अर्थ खाने योग्य पशु-मांस है।
- source_word: לְכָל הָעָם הַזֶּה
  choice: इस पूरी प्रजा को
  rationale: עָם सामूहिक एकवचन है; ‘प्रजा’ यहाँ समूह को एक इकाई के रूप में स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह मूसा के प्रश्न का कारण प्रस्तुत करता है।
- source_word: יִבְכּוּ עָלַי
  choice: वे मेरे सामने रोते हुए
  rationale: עָלַי का शाब्दिक रूप ‘मुझ पर’ है, पर यहाँ रोने का मूसा की ओर निर्देशित होना और उस पर पड़ता दबाव अभिप्रेत हो सकता है। ‘मेरे सामने’ मुख्य पाठ में स्वाभाविक है और टिप्पणी में वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- source_word: לֵאמֹר
  choice: कहते हैं
  rationale: उद्धरण प्रस्तुत करने वाले इब्रानी क्रियारूप को प्रवाहपूर्ण हिन्दी में व्यक्त करता है।
- source_word: תְּנָה לָּנוּ
  choice: हमें ... दे
  rationale: आज्ञार्थक क्रिया और बहुवचन सर्वनाम का सीधा, स्वाभाविक अनुवाद।
- source_word: וְנֹאכֵלָה
  choice: कि हम खाएँ
  rationale: कोहोर्टेटिव रूप इच्छित परिणाम या उद्देश्य व्यक्त करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
