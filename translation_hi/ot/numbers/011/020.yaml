source:
  edition: WLC
  text: עַ֣ד חֹ֣דֶשׁ יָמִ֗ים עַ֤ד אֲשֶׁר יֵצֵא֙ מֵֽ/אַפְּ/כֶ֔ם וְ/הָיָ֥ה לָ/כֶ֖ם לְ/זָרָ֑א יַ֗עַן כִּֽי מְאַסְתֶּ֤ם אֶת יְהוָה֙ אֲשֶׁ֣ר בְּ/קִרְבְּ/כֶ֔ם וַ/תִּבְכּ֤וּ לְ/פָנָי/ו֙ לֵ/אמֹ֔ר לָ֥/מָּה זֶּ֖ה יָצָ֥אנוּ מִ/מִּצְרָֽיִם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/020.yaml
  text: for a whole month, until it comes out of your nostrils and becomes loathsome to you, because you have rejected Yahweh who is among you and have wept before him, saying, ‘Why did we ever come out of Egypt?’”
translation:
  language: hi
  text: पूरे एक महीने तक, जब तक वह तुम्हारे नथुनों से बाहर न निकल आए और तुम्हें घिनौना न लगने लगे[a], क्योंकि तुमने याहवे को, जो तुम्हारे बीच में है, ठुकरा दिया और उसके सामने यह कहते हुए रोए, ‘हम मिस्र से बाहर क्यों निकले?’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे लिए घृणित हो जाए।” हिब्रू अभिव्यक्ति तीव्र घृणा या वितृष्णा का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד חֹדֶשׁ יָמִים
  choice: पूरे एक महीने तक
  rationale: हिब्रू पदबंध शाब्दिक रूप से ‘दिनों के एक महीने तक’ है और पूरे महीने की अवधि पर बल देता है।
- source_word: יֵצֵא מֵאַפְּכֶם
  choice: वह तुम्हारे नथुनों से बाहर न निकलने लगे
  rationale: यहाँ אַף का ठोस शारीरिक अर्थ ‘नाक/नथुना’ है; ‘नथुनों’ हिब्रू की तीखी और अतिशयोक्तिपूर्ण छवि बनाए रखता है।
- source_word: וְהָיָה לָכֶם לְזָרָא
  choice: तुम्हें घिनौना न लगे
  rationale: זָרָא तीव्र घृणा या वितृष्णा का भाव व्यक्त करता है; यह हिंदी में स्वाभाविक और प्रभावशाली रूप है।
- source_word: מְאַסְתֶּם
  choice: ठुकरा दिया
  rationale: क्रिया अस्वीकार करने और तिरस्कारपूर्वक दूर करने का भाव रखती है; ‘ठुकरा दिया’ दोनों पहलुओं को सहज हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है, इसलिए किसी उपाधि से बदलने के बजाय उसका लिप्यंतरण किया गया है।
- source_word: אֲשֶׁר בְּקִרְבְּכֶם
  choice: जो तुम्हारे बीच में है
  rationale: यह समुदाय के मध्य याहवे की उपस्थिति बताता है, न कि प्रत्येक व्यक्ति के भीतर होने की बात।
- source_word: וַתִּבְכּוּ לְפָנָיו
  choice: उसके सामने ... रोए
  rationale: यह रोने की क्रिया और याहवे की उपस्थिति में की गई शिकायत, दोनों को बनाए रखता है।
- source_word: לָמָּה זֶּה יָצָאנוּ מִמִּצְרָיִם
  choice: हम मिस्र से बाहर क्यों निकले?
  rationale: प्रश्न शिकायत का भाव स्वयं व्यक्त करता है; अतिरिक्त ‘आखिर’ या ‘कभी’ जोड़े बिना हिब्रू आशय को स्पष्ट रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में टेट्राग्रामटन प्रत्यक्ष रूप से है; व्यक्तिगत नाम को सुरक्षित रखने के लिए ‘याहवे’ चुना गया है।
- issue: ‘तुम्हारे बीच में’ का आशय
  choice: समुदाय के मध्य याहवे की उपस्थिति
  alternative: व्यक्तियों के भीतर याहवे की उपस्थिति
  rationale: בְּקִרְבְּכֶם इस प्रसंग में इस्राएली समुदाय के बीच उपस्थित याहवे को सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; संबोधन बहुवचन है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। मूल की तीखी शारीरिक छवि और शिकायत का स्वर सुरक्षित हैं।
