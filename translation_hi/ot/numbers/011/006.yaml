  text: וְ/עַתָּ֛ה נַפְשֵׁ֥/נוּ יְבֵשָׁ֖ה אֵ֣ין כֹּ֑ל בִּלְתִּ֖י אֶל הַ/מָּ֥ן עֵינֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/006.yaml
  text: But now our appetite is dried up[a]; there is nothing at all except the manna before our eyes.
translation:
  language: hi
  text: पर अब हमारी भूख सूख गई है[a]; हमारी आँखों के सामने मन्ना के सिवा कुछ भी नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारा प्राण सूख गया है’; इब्रानी נֶפֶשׁ (नेफ़ेश) का अर्थ ‘प्राण’, ‘जीवन’ या भोजन के संदर्भ में ‘भूख’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: शिकायत के प्रसंग में संयोजक और कालवाचक क्रिया-विशेषण पहले की स्थिति से विरोध दिखाते हैं; ‘पर अब’ इसे स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: נַפְשֵׁנוּ
  choice: हमारी भूख
  rationale: נֶפֶשׁ का मूल अर्थ ‘प्राण/जीवन’ हो सकता है, पर भोजन और लालसा के संदर्भ में यह भूख या खाने की इच्छा को सूचित करता है।
- source_word: יְבֵשָׁה
  choice: सूख गई है
  rationale: यह विशेषण शुष्क और मुरझाई हुई अवस्था बताता है; ‘सूख गई है’ शिकायत की तीव्रता और परिणामी अवस्था दोनों व्यक्त करता है।
- source_word: אֵין כֹּל
  choice: कुछ भी नहीं है
  rationale: निषेध के साथ כֹּל का प्रयोग पूर्ण अभाव पर बल देता है; ‘कुछ भी नहीं’ उसी जोर को सहज हिंदी में रखता है।
- source_word: בִּלְתִּי אֶל
  choice: के सिवा
  rationale: यह रचना अपवाद या बहिष्करण व्यक्त करती है—एक वस्तु को छोड़कर और कुछ नहीं।
- source_word: הַמָּן
  choice: इस मन्ना
  rationale: हिब्रू निश्चित उपपद परिचित और सामने उपस्थित मन्ना की ओर संकेत करता है; हिंदी में ‘इस’ उस विशिष्ट वस्तु और वक्ताओं के उपेक्षापूर्ण लहजे को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֵינֵינוּ
  choice: हमारी आँखों के सामने
  rationale: यह दृश्य रूप से लगातार सामने रहने की ठोस छवि को सुरक्षित रखता है।
theological_decisions:
- issue: נֶפֶשׁ का मानव-स्वरूप संबंधी या प्रसंगगत अर्थ
  choice: मुख्य पाठ में ‘भूख’
  alternative: ‘प्राण’
  rationale: प्रसंग भोजन की लालसा का है, इसलिए ‘भूख’ अर्थ को स्पष्ट करता है; फिर भी मूल शब्द की व्यापक अर्थ-सीमा को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। शिकायत का जोर ‘कुछ भी नहीं’ और सामने पड़े मन्ना से ऊब का भाव ‘इस मन्ना’ द्वारा व्यक्त किया गया है; मूल की देहात्मक उपमा ‘सूख गई है’ में रखी गई है।
