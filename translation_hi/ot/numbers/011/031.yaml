source:
  edition: WLC
  text: וְ/ר֜וּחַ נָסַ֣ע מֵ/אֵ֣ת יְהוָ֗ה וַ/יָּ֣גָז שַׂלְוִים֮ מִן הַ/יָּם֒ וַ/יִּטֹּ֨שׁ עַל הַֽ/מַּחֲנֶ֜ה כְּ/דֶ֧רֶךְ י֣וֹם כֹּ֗ה וּ/כְ/דֶ֤רֶךְ יוֹם֙ כֹּ֔ה סְבִיב֖וֹת הַֽ/מַּחֲנֶ֑ה וּ/כְ/אַמָּתַ֖יִם עַל פְּנֵ֥י הָ/אָֽרֶץ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/031.yaml
  text: Then a wind went out from Yahweh and drove quail in from the sea[a], and let them fall beside the camp, about a day’s journey on this side and a day’s journey on that side, all around the camp[b], and about two cubits above the surface of the ground.
translation:
  language: hi
  text: तब याहवे की ओर से एक हवा चली[a] और वह समुद्र की ओर से बटेरों को उड़ा लाई और उन्हें छावनी के पास गिरा दिया। वे छावनी के चारों ओर इधर लगभग एक दिन की यात्रा जितनी दूर तक और उधर भी लगभग एक दिन की यात्रा जितनी दूर तक थीं, और भूमि की सतह से लगभग दो हाथ ऊपर तक थीं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘हवा’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘आत्मा’ भी हो सकता है; पर यहाँ समुद्र से बटेरों को लाने का संदर्भ ‘हवा’ अर्थ का प्रबल समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “भूमि के मुख पर लगभग दो हाथ।” यह पक्षियों के उड़ने या फैले होने की ऊँचाई बता सकता है; अथवा भूमि पर उनकी परत की गहराई भी समझी जा सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְרוּחַ
  choice: एक हवा
  rationale: רוּחַ के अर्थ ‘हवा’, ‘साँस’ या ‘आत्मा’ हो सकते हैं; समुद्र से बटेरों को लाने की भौतिक क्रिया के कारण यहाँ ‘हवा’ संदर्भानुकूल है।
- source_word: נָסַע מֵאֵת יְהוָה
  choice: यहोवा की ओर से ... चली
  rationale: נָסַע गति या प्रस्थान को व्यक्त करता है और מֵאֵת स्रोत बताता है; यह अभिव्यक्ति हवा के यहोवा से आने को स्वाभाविक हिन्दी में रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम को पारंपरिक और व्यापक रूप से पहचाने जाने वाले हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि से।
- source_word: וַיָּגָז שַׂלְוִים מִן הַיָּם
  choice: वह समुद्र की ओर से बटेरों को उड़ा लाई
  rationale: दुर्लभ क्रिया גוז यहाँ हवा द्वारा बटेरों को समुद्र से लाए जाने का बोध देती है; ‘उड़ा लाई’ हवा की गति और परिणाम दोनों को सहज रूप से व्यक्त करता है।
- source_word: וַיִּטֹּשׁ עַל הַמַּחֲנֶה
  choice: उन्हें छावनी के चारों ओर गिरा दिया
  rationale: נטשׁ का अर्थ फैलाना, छोड़ना या डालना हो सकता है। अगले वाक्यांश में छावनी के चारों ओर विस्तार बताया गया है, इसलिए ‘गिरा दिया’ परिणाम और ‘चारों ओर’ वितरण को स्पष्ट करता है, बिना यह कहे कि पक्षी तंबुओं पर गिरे।
- source_word: כְּדֶרֶךְ יוֹם כֹּה וּכְדֶרֶךְ יוֹם כֹּה
  choice: इधर लगभग एक दिन की यात्रा जितनी दूर तक और उधर भी लगभग एक दिन की यात्रा जितनी दूर तक
  rationale: यह रूप इब्रानी की दोहरावयुक्त स्थानिक अभिव्यक्ति और दोनों ओर के विस्तार को सुरक्षित रखता है।
- source_word: סְבִיבוֹת הַמַּחֲנֶה
  choice: छावनी के चारों ओर
  rationale: बहुवचनात्मक अभिव्यक्ति समूची छावनी के आसपास व्यापक वितरण दर्शाती है।
- source_word: וּכְאַמָּתַיִם
  choice: लगभग दो हाथ
  rationale: כְּ अनुमान सूचित करता है। אַמָּה प्राचीन ‘क्यूबिट’ माप है; हिन्दी बाइबिलीय प्रयोग में ‘हाथ’ अधिक स्वाभाविक और समझने योग्य है।
- source_word: עַל פְּנֵי הָאָרֶץ
  choice: भूमि की सतह से ... ऊपर
  rationale: शाब्दिक अर्थ ‘भूमि के मुख पर’ है। माप के साथ यह पक्षियों की ऊँचाई या फैली हुई परत की गहराई का अस्पष्ट चित्र देता है; मुख्य पाठ में स्वाभाविक स्थानिक अर्थ रखा और टिप्पणी में अस्पष्टता बताई गई है।
theological_decisions:
- issue: यहोवा की ओर से आने वाली हवा की भूमिका
  choice: यहोवा से आई हवा बटेरों को समुद्र की ओर से लाई।
  alternative: इसे ‘यहोवा की ओर से एक आत्मा निकली’ भी शाब्दिक रूप से समझा जा सकता है।
  rationale: רוּחַ में वास्तविक शब्दगत अस्पष्टता है, पर बटेरों को समुद्र से लाने वाली क्रिया ‘हवा’ का प्रबल समर्थन करती है। अनुवाद ईश्वरीय स्रोत और प्राकृतिक साधन दोनों को बनाए रखता है।
- issue: भूमि से दो हाथ का संबंध
  choice: मुख्य पाठ इसे भूमि से लगभग दो हाथ ऊपर होने के रूप में प्रस्तुत करता है।
  alternative: यह भूमि पर पड़ी बटेरों की लगभग दो हाथ गहरी परत का वर्णन हो सकता है।
  rationale: इब्रानी עַל־פְּנֵי הָאָרֶץ ऊँचाई, भूमि पर विस्तार, अथवा ढेर की गहराई के बीच निर्णायक भेद नहीं करता; इसलिए वैकल्पिक समझ टिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘छावनी’, ‘बटेर’ और ‘दो हाथ’ जैसे परिचित बाइबिलीय शब्द रखे गए हैं; जटिल इब्रानी स्थानिक रचना को स्पष्ट हिन्दी में व्यक्त किया गया है, जबकि वास्तविक अस्पष्टता पादटिप्पणियों में सुरक्षित है।
