  text: שָׁטוּ֩ הָ/עָ֨ם וְ/לָֽקְט֜וּ וְ/טָחֲנ֣וּ בָ/רֵחַ֗יִם א֤וֹ דָכוּ֙ בַּ/מְּדֹכָ֔ה וּ/בִשְּׁלוּ֙ בַּ/פָּר֔וּר וְ/עָשׂ֥וּ אֹת֖/וֹ עֻג֑וֹת וְ/הָיָ֣ה טַעְמ֔/וֹ כְּ/טַ֖עַם לְשַׁ֥ד הַ/שָּֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/008.yaml
  text: The people would roam about and gather it, and grind it in the millstones or crush it in the mortar, and boil it in the pot, and make it into cakes; and its taste was like the taste of rich oil.
translation:
  language: hi
  text: लोग इधर-उधर घूमकर उसे बटोरते थे। फिर वे उसे चक्की में पीसते या ओखली में कूटते, हाँड़ी में उबालते और उसकी टिकियाँ बनाते थे। उसका स्वाद तेल की समृद्ध चिकनाई जैसा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ताज़े तेल के स्वाद जैसा।” इब्रानी पदबंध לְשַׁד הַשָּׁמֶן का अर्थ निश्चित नहीं है; संभवतः यह तेल के भरपूर, चिकने सार की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁטוּ
  choice: इधर-उधर जाकर
  rationale: क्रिया किसी क्षेत्र में घूमने या आने-जाने का भाव देती है; प्रसंग में यह मन्ना बटोरने के लिए लोगों की नियमित गतिविधि बताती है।
- source_word: לָקְטוּ
  choice: बटोरते थे
  rationale: यह इकट्ठा करने की सामान्य क्रिया है; मन्ना को भूमि से एकत्र करने के प्रसंग में ‘बटोरना’ स्वाभाविक हिंदी है।
- source_word: טָחֲנוּ בָרֵחַיִם
  choice: चक्की में पीसते
  rationale: רֵחַיִם हाथ की चक्की अथवा उसके पाटों को सूचित करता है; ‘चक्की में पीसना’ आधुनिक हिंदी में ठोस साधन और क्रिया दोनों को स्पष्ट रखता है।
- source_word: דָכוּ בַּמְּדֹכָה
  choice: ओखली में कूटते
  rationale: क्रिया कूटने या चूर करने और संज्ञा ओखली का बोध कराती है; यह हिंदी में स्वाभाविक घरेलू शब्दावली है।
- source_word: בִשְּׁלוּ בַּפָּרוּר
  choice: हाँड़ी में उबालते
  rationale: בשל पकाने या उबालने को और פָּרוּר पकाने के पात्र को दर्शाता है; ‘हाँड़ी में उबालना’ स्रोत की संभावित विधि को स्पष्ट रूप से व्यक्त करता है।
- source_word: עָשׂוּ אֹתוֹ עֻגוֹת
  choice: उसकी टिकियाँ बनाते थे
  rationale: עֻגוֹת गोलाकार पकवान या टिकियों को दर्शाता है; ‘टिकियाँ’ आकार को बनाए रखते हुए ‘केक’ की आधुनिक भ्रामक छवि से बचाता है।
- source_word: טַעְמוֹ
  choice: उसका स्वाद
  rationale: यह संज्ञा स्वाद या जायके को दर्शाती है; ‘स्वाद’ सीधा और सर्वसुलभ रूप है।
- source_word: לְשַׁד הַשָּׁמֶן
  choice: उत्तम तेल के स्वाद जैसा
  rationale: लשד एक दुर्लभ और कठिन शब्द है, जिसमें सार, चिकनाई या भरपूर ताज़गी का भाव हो सकता है। ‘उत्तम तेल’ पठनीय हिंदी में तेल की समृद्ध गुणवत्ता का संकेत देता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
