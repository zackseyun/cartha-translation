  yaml_path: translation/ot/numbers/011/034.yaml
  text: So the name of that place was called Kibroth-hattaavah[a], because there they buried the people who had craved.
translation:
  language: hi
  text: तब उसने उस स्थान का नाम किब्रोत-हत्तावाह[a] रखा, क्योंकि वहाँ उन्होंने उन लोगों को दफनाया था जिन्होंने लालसा की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किब्रोत-हत्तावाह” का अर्थ संभवतः “लालसा की कब्रें” या “लोभपूर्ण इच्छा की कब्रें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא אֶת שֵׁם הַמָּקוֹם הַהוּא
  choice: इसलिए उसने उस स्थान का नाम ... रखा
  rationale: इब्रानी नामकरण-वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। वय्यिक्तोल का कथात्मक क्रम ‘इसलिए’ से जुड़ता है, और कर्ता की पुल्लिंग एकवचन क्रिया को बनाए रखा गया है।
- source_word: קִבְרוֹת הַתַּאֲוָה
  choice: किब्रोत-हत्तावा
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; उसके अर्थ को मुख्य पाठ में बदलने के बजाय पाद-टिप्पणी में दिया गया है।
- source_word: כִּי שָׁם
  choice: क्योंकि वहीं
  rationale: כִּי नाम रखने का कारण बताता है और שָׁם उस स्थान पर बल देता है; ‘क्योंकि वहीं’ दोनों को सहज हिन्दी में रखता है।
- source_word: קָבְרוּ אֶת הָעָם
  choice: उन्होंने उन लोगों को दफ़नाया था
  rationale: बहुवचन क्रिया को ‘उन्होंने’ से और संदर्भित समूह הָעָם को स्वाभाविक हिन्दी ‘उन लोगों’ से व्यक्त किया गया है। पूर्वकालिकता के लिए ‘था’ उपयुक्त है।
- source_word: הַמִּתְאַוִּים
  choice: जो लालसा करने लगे थे
  rationale: हित्पाएल कृदंत तीव्र या स्वयं में पनपी चाह को सूचित करता है। ‘लालसा’ संदर्भ की प्रबल, अनुचित भोजन-इच्छा को व्यक्त करती है, बिना इसे संकीर्ण रूप से यौन अर्थ देने के।
