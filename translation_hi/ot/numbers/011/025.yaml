  text: וַ/יֵּ֨רֶד יְהוָ֥ה בֶּ/עָנָן֮ וַ/יְדַבֵּ֣ר אֵלָי/ו֒ וַ/יָּ֗אצֶל מִן הָ/ר֨וּחַ֙ אֲשֶׁ֣ר עָלָ֔י/ו וַ/יִּתֵּ֕ן עַל שִׁבְעִ֥ים אִ֖ישׁ הַ/זְּקֵנִ֑ים וַ/יְהִ֗י כְּ/נ֤וֹחַ עֲלֵי/הֶם֙ הָ/ר֔וּחַ וַ/יִּֽתְנַבְּא֖וּ וְ/לֹ֥א יָסָֽפוּ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/025.yaml
  text: Then Yahweh came down in the cloud and spoke to him[a], and he took some of the Spirit that was on him and put it on the seventy elders. And when the Spirit rested on them, they prophesied, but they did not continue.
translation:
  language: hi
  text: तब याहवे उस बादल में उतरा और उसने उससे बात की; फिर उसने उस आत्मा में से, जो उस पर था, कुछ लेकर सत्तर पुरुषों, अर्थात् उन बुज़ुर्गों, पर रख दिया। जब आत्मा उन पर ठहरा, तो उन्होंने भविष्यवाणी की, पर फिर ऐसा नहीं किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे रुके नहीं।” इब्रानी अभिव्यक्ति बहुत संक्षिप्त है और उसका अर्थ एक से अधिक प्रकार से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: בֶּעָנָן
  choice: बादल में
  rationale: निश्चित पदबंध इस प्रसंग में परमेश्वर की उपस्थिति से जुड़े परिचित बादल की ओर संकेत करता है; हिन्दी में संदर्भ से उसकी निश्चितता स्पष्ट है।
- source_word: וַיְדַבֵּר אֵלָיו
  choice: उससे बात की
  rationale: यह स्वाभाविक हिन्दी है और मूल के सर्वनाम को बनाए रखता है; प्रसंग में इसका संकेत मूसा की ओर है।
- source_word: וַיָּאצֶל מִן הָרוּחַ אֲשֶׁר עָלָיו
  choice: उस आत्मा में से, जो उस पर था, कुछ लेकर
  rationale: दुर्लभ क्रिया यहाँ किसी अंश को लेकर वितरित करने का भाव देती है। ‘कुछ’ मूल भाव को रखता है, पर आत्मा के घट जाने का अनावश्यक निष्कर्ष नहीं जोड़ता।
- source_word: רוּחַ
  choice: आत्मा
  rationale: प्रसंग में यह मूसा और पुरनियों को भविष्यवाणी के लिए सामर्थ्य देने वाले परमेश्वर के आत्मा का संकेत है, न कि हवा या मानवीय मनोभाव का।
- source_word: שִׁבְעִים אִישׁ הַזְּקֵנִים
  choice: उन सत्तर पुरनियों
  rationale: ‘सत्तर पुरुष, अर्थात् पुरनिये’ का आशय स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त किया गया है; संख्या और उनकी सामुदायिक भूमिका दोनों सुरक्षित हैं।
- source_word: כְּנוֹחַ עֲלֵיהֶם הָרוּחַ
  choice: जब आत्मा उन पर ठहरा
  rationale: यह נוח के ‘ठहरने/विश्राम करने’ के बिंब और על के ‘पर’ संबंध को बनाए रखता है।
- source_word: וַיִּתְנַבְּאוּ
  choice: उन्होंने भविष्यवाणी की
  rationale: यह भविष्यद्वक्ताओं जैसी प्रेरित वाणी या गतिविधि के लिए स्पष्ट और मानक हिन्दी अभिव्यक्ति है।
- source_word: וְלֹא יָסָפוּ
  choice: पर आगे ऐसा नहीं किया
  rationale: मुख्य पाठ में उस प्रसंग के बाद भविष्यवाणी जारी न रखने का संभावित अर्थ स्वाभाविक हिन्दी में दिया गया है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: רוּחַ का आशय परमेश्वर का आत्मा है या सामान्य ‘आत्मा’
  choice: परमेश्वर का सामर्थ्य देने वाला आत्मा
  alternative: मानवीय आत्मा या मनोभाव
  rationale: मूसा पर उपस्थित होकर पुरनियों को भविष्यवाणी करने में समर्थ बनाने वाला तत्व इस प्रसंग में परमेश्वर के आत्मा को दर्शाता है। हिन्दी में बड़े अक्षर का भेद उपलब्ध न होने के कारण संदर्भ ही यह अर्थ स्पष्ट करता है।
- issue: וְלֹא יָסָפוּ का अर्थ
  choice: उन्होंने आगे ऐसा नहीं किया
  alternative: वे रुके नहीं
  rationale: इब्रानी पदबंध संक्षिप्त और अर्थ की दृष्टि से विवादित है। प्रसंगानुसार एकबारगी भविष्यवाणी मुख्य पाठ में रखी गई है, जबकि प्राचीन और पारंपरिक वैकल्पिक समझ को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरनिये’ को इस्राएली समुदाय के मान्य अगुओं के लिए परिचित बाइबलीय पद के रूप में रखा गया है। सर्वनामों और आत्मा के ‘ठहरने’ के बिंब को मूल के निकट रखते हुए वाक्य-रचना स्वाभाविक हिन्दी में की गई है।
