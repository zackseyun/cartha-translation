base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/002.yaml
  text: Then the people cried out to Moses[a], and Moses prayed to Yahweh, and the fire died down.
translation:
  language: hi
  text: तब लोगों ने मूसा को पुकारा, और मूसा ने याहवे से प्रार्थना की; तब आग मंद पड़ गई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आग शांत हो गई” अथवा “आग बैठ गई।” इब्रानी क्रिया का भाव आग के मंद पड़ने या नीचे बैठ जाने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצְעַק
  choice: संकट में ... पुकारा
  rationale: צעק सहायता या संकट में लगाई गई पुकार को दर्शाता है। केवल ‘पुकारा’ की अपेक्षा यह अभिव्यक्ति प्रसंग की व्याकुलता स्पष्ट करती है, पर यह नहीं मानती कि लोगों ने विशेष शब्दों में क्या कहा।
- source_word: הָעָם
  choice: लोगों
  rationale: עם यहाँ इस्राएली समुदाय के लिए सामूहिक रूप से प्रयुक्त है; आधुनिक हिन्दी में ‘लोग’ स्वाभाविक और स्पष्ट है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा को
  rationale: אֶל व्यक्ति की ओर निर्देशित पुकार को दर्शाता है; हिन्दी में ‘मूसा को पुकारा’ इसका स्वाभाविक रूप है।
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: פלל का हित्पअल रूप सामान्यतः ‘प्रार्थना करना’ है। प्रसंग में मध्यस्थता निहित है, पर अनुवाद में उसे स्पष्ट जोड़ना आवश्यक नहीं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: וַתִּשְׁקַע
  choice: शांत हो गई
  rationale: שקע का मूल भाव नीचे बैठने या कम होने का है। आग के संदर्भ में ‘शांत हो गई’ आधुनिक हिन्दी में स्वाभाविक है और आग के प्रकोप के थमने को व्यक्त करता है; शाब्दिक विकल्प पाद-टिप्पणी में सुरक्षित हैं।
- source_word: הָאֵשׁ
  choice: आग
  rationale: אֵשׁ का सीधा अर्थ ‘आग’ है और यह पिछले पद में वर्णित आग को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य की क्रमिक घटनाएँ बनाए रखने के लिए ‘तब’ का प्रयोग हुआ है। ‘संकट में’ צעק की व्याकुल सहायता-पुकार को संक्षेप में व्यक्त करता है।
