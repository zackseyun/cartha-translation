base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/016.yaml
  text: Then Yahweh said to Moses[a], “Gather for me seventy men from the elders of Israel, whom you know to be the elders of the people and its officers, and bring them to the tent of meeting[b], and let them stand there with you.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “इस्राएल के बुज़ुर्गों में से सत्तर पुरुष मेरे लिए इकट्ठे कर, जिन्हें तू जानता है कि वे लोगों के बुज़ुर्ग और उनके अधिकारी[a] हैं। उन्हें मिलाप के तंबू में ले आ, और वे वहाँ तेरे साथ खड़े हों।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रशासक”; इब्रानी शब्द प्रशासनिक दायित्व निभाने वाले पदाधिकारियों के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: אֶסְפָה לִּי
  choice: मेरे लिए इकट्ठा कर
  rationale: यह चयनित लोगों को एकत्र करने की आज्ञा है; לִּי का हितार्थक भाव भी स्पष्ट रखा गया है।
- source_word: שִׁבְעִים אִישׁ מִזִּקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनियों में से सत्तर पुरुषों
  rationale: מִן बड़े समूह में से चयन को दर्शाता है, और नेतृत्व के इस प्रसंग में אִישׁ वयस्क पुरुषों को सूचित करता है।
- source_word: זִקְנֵי הָעָם
  choice: प्रजा के पुरनिए
  rationale: पुरनिए सामाजिक-राजनीतिक नेतृत्व का पदसूचक शब्द है; 'प्रजा' सामूहिक הָעָם को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְשֹׁטְרָיו
  choice: और उसके अधिकारी
  rationale: שֹׁטֵר यहाँ प्रशासनिक दायित्व वाले पदाधिकारी को दर्शाता है; एकवचन प्रत्यय का संबंध सामूहिक 'प्रजा' से है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: पवित्रस्थान के इस नाम का शब्दार्थ और हिंदी बाइबलीय पहचान दोनों बनाए रखे गए हैं।
- source_word: וְהִתְיַצְּבוּ שָׁם עִמָּךְ
  choice: और वे वहाँ तेरे साथ खड़े हों
  rationale: हित्पाएल रूप स्वयं उपस्थित होकर स्थान ग्रहण करने का भाव देता है; हिंदी में निर्देशात्मक बल स्वाभाविक ढंग से रखा गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। परमेश्वर द्वारा मूसा को एकवचन संबोधन के लिए ‘तू/तेरे’ का प्रयोग मूल की निकटता और हिंदी बाइबलीय शैली दोनों के अनुरूप है।
