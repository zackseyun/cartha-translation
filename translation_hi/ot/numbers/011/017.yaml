source:
  edition: WLC
  text: וְ/יָרַדְתִּ֗י וְ/דִבַּרְתִּ֣י עִמְּ/ךָ֮ שָׁם֒ וְ/אָצַלְתִּ֗י מִן הָ/ר֛וּחַ אֲשֶׁ֥ר עָלֶ֖י/ךָ וְ/שַׂמְתִּ֣י עֲלֵי/הֶ֑ם וְ/נָשְׂא֤וּ אִתְּ/ךָ֙ בְּ/מַשָּׂ֣א הָ/עָ֔ם וְ/לֹא תִשָּׂ֥א אַתָּ֖ה לְ/בַדֶּֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/017.yaml
  text: And I will come down and speak with you there[a], and I will take some of the Spirit that is on you and put it on them, and they will bear the burden of the people with you, so that you will not bear it by yourself alone.
translation:
  language: hi
  text: मैं वहाँ उतरूँगा और तुमसे बात करूँगा। जो आत्मा[a] तुम पर है, उसमें से कुछ लेकर मैं उसे उन पर रखूँगा। वे तुम्हारे साथ लोगों का बोझ उठाएँगे, ताकि तुम्हें उसे अकेले न उठाना पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द רוּחַ का अर्थ ‘आत्मा,’ ‘वायु’ या ‘श्वास’ हो सकता है। यहाँ संदर्भ उस आत्मा की ओर संकेत करता है जो मूसा को नेतृत्व के लिए सामर्थ्य देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתִּי
  choice: मैं उतरकर
  rationale: यָרַד का मूल अर्थ ‘नीचे उतरना’ है। यह अनुवाद परमेश्वर के उतरने की इब्रानी चित्रात्मक भाषा को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְדִבַּרְתִּי עִמְּךָ שָׁם
  choice: वहाँ तुमसे बात करूँगा
  rationale: דבר עם का अर्थ ‘किसी से बात करना’ है; ‘वहाँ’ मूल पाठ की स्थान-संबंधी स्पष्टता को सुरक्षित रखता है।
- source_word: וְאָצַלְתִּי מִן הָרוּחַ אֲשֶׁר עָלֶיךָ
  choice: जो आत्मा तुम पर है, उसमें से कुछ लेकर
  rationale: दुर्लभ क्रिया אצל यहाँ मूसा पर विद्यमान आत्मा में से लेकर प्राचीनों पर रखने को व्यक्त करती है। ‘कुछ लेकर’ हस्तांतरण बताता है, पर यह अनावश्यक रूप से तय नहीं करता कि मूसा के पास आत्मा घट गई।
- source_word: וְשַׂמְתִּי עֲלֵיהֶם
  choice: उन पर रखूँगा
  rationale: שׂים का सामान्य अर्थ ‘रखना’ है। ‘उन पर’ आत्मा के व्यक्तियों पर होने की मूल रूपकात्मक भाषा को बनाए रखता है।
- source_word: וְנָשְׂאוּ אִתְּךָ בְּמַשָּׂא הָעָם
  choice: वे लोगों का बोझ उठाने में तुम्हारा साथ देंगे
  rationale: נשא और מַשָּׂא का संयुक्त शब्दचित्र ‘बोझ उठाना’ नेतृत्व की जिम्मेदारी साझा करने को दर्शाता है। ‘तुम्हारा साथ देंगे’ אִתְּךָ की सहभागिता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא תִשָּׂא אַתָּה לְבַדֶּךָ
  choice: ताकि तुम्हें उसे अकेले न उठाना पड़े
  rationale: यह व्यवस्था के उद्देश्य या परिणाम को स्पष्ट करता है। ‘उसे’ पहले आए ‘बोझ’ की ओर संकेत करता है और ‘अकेले’ לְבַדֶּךָ के बल को बनाए रखता है।
theological_decisions:
- issue: רוּחַ का अर्थ और हिन्दी में उसका निरूपण
  choice: आत्मा
  alternative: शक्ति / मनोभाव
  rationale: निकटवर्ती संदर्भ, विशेषकर गिनती 11:25, इसे नेतृत्व के लिए परमेश्वर से मिलनेवाली सामर्थ्यदायक आत्मा के रूप में प्रस्तुत करता है, न कि केवल मूसा के निजी स्वभाव के रूप में। हिन्दी में बड़े अक्षर से भेद संभव नहीं है; इसलिए ‘आत्मा’ और पादटिप्पणी मूल शब्द की अर्थ-व्याप्ति तथा संदर्भ दोनों को सुरक्षित रखते हैं।
- issue: आत्मा में से लेने पर मूसा में कमी होने का प्रश्न
  choice: उसमें से कुछ लेकर
  alternative: उस आत्मा को बाँटकर
  rationale: מִן और אצל किसी अंश को लेकर दूसरों पर रखने की भाषा देते हैं, पर पाठ स्पष्ट रूप से यह नहीं बताता कि इससे मूसा की आत्मिक सामर्थ्य कम हुई या नहीं। अनुवाद इस तनाव को अनिर्णीत रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बोझ उठाना’ मूल इब्रानी रूपक को सुरक्षित रखता है। ‘तुम’ का प्रयोग मूसा के लिए एकवचन संबोधन के अनुरूप है।
