id: NUM.11.29
reference: Numbers 11:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר ל/וֹ֙ מֹשֶׁ֔ה הַֽ/מְקַנֵּ֥א אַתָּ֖ה לִ֑/י וּ/מִ֨י יִתֵּ֜ן כָּל עַ֤ם יְהוָה֙ נְבִיאִ֔ים כִּי יִתֵּ֧ן יְהוָ֛ה אֶת רוּח֖/וֹ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/029.yaml
  text: But Moses said to him[a], “Are you jealous for my sake? If only all Yahweh’s people were prophets[b], that Yahweh would put his Spirit on them!”
translation:
  language: hi
  text: परन्तु मूसा ने उससे कहा, “क्या तुम मेरी ओर से ईर्ष्या करते हो? काश कि यहोवा के सभी लोग भविष्यद्वक्ता होते, और यहोवा अपना आत्मा उन पर रख देता!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמְקַנֵּא
  choice: क्या तुम ... जलते हो
  rationale: कנא का यह रूप यहाँ मूसा के हित की रक्षात्मक ईर्ष्या या पक्षधरता व्यक्त करता है। ‘जलते हो’ आधुनिक हिन्दी में इस नकारात्मक भाव को स्वाभाविक ढंग से रखता है, जबकि ‘उत्साही हो’ अनावश्यक रूप से सकारात्मक लग सकता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: लामेद और प्रथम पुरुष प्रत्यय मूसा के पक्ष या हित में दिखाई गई चिंता को व्यक्त करते हैं; ‘मेरे लिए’ संक्षिप्त और स्वाभाविक है।
- source_word: וּמִי יִתֵּן
  choice: काश
  rationale: शाब्दिक ‘कौन देगा’ यहाँ इब्रानी इच्छासूचक मुहावरा है; ‘काश’ उसकी प्रबल अभिलाषा को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּל עַם יְהוָה
  choice: यहोवा के सभी लोग
  rationale: यह रचना यहोवा से संबंधित पूरे समुदाय को दर्शाती है। यह रूप स्वाभाविक हिन्दी में संबंध और समग्रता दोनों बनाए रखता है।
- source_word: נְבִיאִים
  choice: भविष्यद्वक्ता
  rationale: संज्ञा नबी/भविष्यद्वक्ता को सूचित करती है; यहाँ संज्ञात्मक रूप मूल की संरचना को बनाए रखता है।
- source_word: כִּי יִתֵּן יְהוָה אֶת רוּחוֹ עֲלֵיהֶם
  choice: और यहोवा अपना आत्मा उन पर रखता
  rationale: כִּי यहाँ इच्छा की संबंधित सामग्री या परिस्थिति को आगे बढ़ाता है। ‘उन पर रखता’ मूल के ‘देना ... उन पर’ वाले चित्र को सुबोध हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्रामाटन को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ दिया गया है।
- source_word: רוּחוֹ
  choice: अपना आत्मा
  rationale: संदर्भ में यह भविष्यद्वाणी के लिए परमेश्वर की ओर से सामर्थ्य देने वाले आत्मा को सूचित करता है। हिन्दी में ‘आत्मा’ अर्थ स्पष्ट रखता है; ‘अपना’ कर्ता यहोवा की ओर लौटता है।
theological_decisions:
- issue: भविष्यद्वाणी के संदर्भ में רוּחוֹ का अर्थ
  choice: अपना आत्मा
  alternative: अपनी सांस / अपनी वायु
  rationale: आस-पास का प्रसंग भविष्यद्वाणी के लिए ईश्वरीय सामर्थ्य दिए जाने का है, इसलिए ‘आत्मा’ सबसे उपयुक्त है। अनुवाद यह निर्धारित नहीं करता कि आत्मा किस व्यवस्थित धर्मवैज्ञानिक श्रेणी में समझा जाए।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम उपस्थित है। हिन्दी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: मूसा की इच्छा और आत्मा दिए जाने के बीच संबंध
  choice: काश ... और यहोवा ... रखता
  alternative: काश ... क्योंकि यहोवा ... रखता
  rationale: כִּי का संबंध यहाँ इच्छासूचक कथन की सामग्री या उससे जुड़ी परिस्थिति के रूप में समझा गया है; कारणसूचक ‘क्योंकि’ कथन को अनावश्यक रूप से निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘परन्तु’, ‘काश’ और ‘भविष्यद्वक्ता’ बाइबलीय संदर्भ की गरिमा रखते हैं; वाक्यरचना को बोलचाल के निकट रखा गया है।
