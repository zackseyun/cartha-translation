- from: परन्तु मूसा ने उससे कहा, “क्या तुम मेरे लिए जलते हो? काश, यहोवा के सभी लोग भविष्यद्वक्ता होते और यहोवा अपना आत्मा उन पर रखता!”
  to: परन्तु मूसा ने उससे कहा, “क्या तुम मेरी ओर से ईर्ष्या करते हो? काश कि यहोवा के सभी लोग भविष्यद्वक्ता होते, और यहोवा अपना आत्मा उन पर रख देता!”
  rationale: The revision replaces an ambiguous idiom with clear modern Hindi for Moses’ question and marks both clauses as the content of Moses’ wish. It retains the divine name, prophetic terminology, and the Hebrew image of Yahweh placing his Spirit upon the people without adding doctrinal interpretation.
