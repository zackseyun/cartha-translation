review_pass:
  verdict: revise
  source_fidelity: The draft correctly conveys Moses’ response, the optative force of וּמִי יִתֵּן ('काश'), the scope of 'all Yahweh’s people,' prophecy, and Yahweh’s Spirit being placed upon them. However, 'मेरे लिए जलते हो' does not naturally communicate the contextual sense of קנא—jealous/protective concern on Moses’ behalf—and 'रखता' weakens the wish by using an ordinary imperfect rather than an optative form carried forward from 'काश'.
  naturalness: ‘जलते हो’ is ambiguous in modern Hindi and commonly suggests anger, resentment, or burning rather than jealousy. ‘क्या तुम मेरी ओर से ईर्ष्या करते हो?’ is clear and natural in a dignified modern register. ‘काश कि ... रख देता’ gives the full sentence a coherent expression of wish.
  terminology: ‘यहोवा,’ ‘भविष्यद्वक्ता,’ and ‘आत्मा’ are appropriate. ‘अपना आत्मा’ correctly refers back to Yahweh and is grammatically acceptable, since ‘आत्मा’ is generally masculine in this usage.
  issues:
  - severity: medium
    issue: ‘मेरे लिए जलते हो’ inadequately renders הַמְקַנֵּא אַתָּה לִי.
    rationale: The expression concerns Joshua’s jealousy or protective zeal on Moses’ behalf. In Hindi, ‘जलना’ is too semantically broad and can suggest resentment or anger; it does not reliably convey the intended relational sense.
  - severity: medium
    issue: ‘यहोवा अपना आत्मा उन पर रखता’ is not explicitly optative.
    rationale: The Hebrew wish introduced by וּמִי יִתֵּן extends to Yahweh’s placing his Spirit on the people. ‘रख देता’ naturally carries that wished-for sense in Hindi.
  revised_text: परन्तु मूसा ने उससे कहा, “क्या तुम मेरी ओर से ईर्ष्या करते हो? काश कि यहोवा के सभी लोग भविष्यद्वक्ता होते, और यहोवा अपना आत्मा उन पर रख देता!”
  revised_footnotes: []
  revision_rationale: The revision replaces an ambiguous idiom with clear modern Hindi for Moses’ question and marks both clauses as the content of Moses’ wish. It retains the divine name, prophetic terminology, and the Hebrew image of Yahweh placing his Spirit upon the people without adding doctrinal interpretation.
