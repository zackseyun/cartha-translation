source:
  edition: WLC
  text: זָכַ֨רְנוּ֙ אֶת הַ/דָּגָ֔ה אֲשֶׁר נֹאכַ֥ל בְּ/מִצְרַ֖יִם חִנָּ֑ם אֵ֣ת הַ/קִּשֻּׁאִ֗ים וְ/אֵת֙ הָֽ/אֲבַטִּחִ֔ים וְ/אֶת הֶ/חָצִ֥יר וְ/אֶת הַ/בְּצָלִ֖ים וְ/אֶת הַ/שּׁוּמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/005.yaml
  text: We remember the fish that we ate in Egypt for nothing[a], the cucumbers, the melons, the leeks, the onions, and the garlic.
translation:
  language: hi
  text: मिस्र में जो मछलियाँ हम बिना दाम दिए खाते थे, वे हमें याद हैं; और खीरे, खरबूजे, गंदने, प्याज़ और लहसुन भी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זָכַרְנוּ
  choice: हमें याद है
  rationale: प्रत्यक्ष कथन में पूर्ण क्रिया वर्तमान स्मरण व्यक्त करती है; यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: הַדָּגָה
  choice: मछलियाँ
  rationale: यह भोजन के रूप में मछली का सामूहिक बोध कराता है; हिन्दी में बहुवचन स्वाभाविक है।
- source_word: אֲשֶׁר נֹאכַל
  choice: हम ... खाते थे
  rationale: यहाँ अपूर्ण क्रिया बीते समय की अभ्यस्त क्रिया बताती है।
- source_word: בְּמִצְרַיִם
  choice: मिस्र में
  rationale: स्थानवाचक पद का सीधा अनुवाद।
- source_word: חִנָּם
  choice: सेंत-मेंत
  rationale: इसका अर्थ बिना दाम चुकाए है; यह बोलचाल में शिकायत की तीव्रता को स्वाभाविक ढंग से रखता है।
- source_word: הַקִּשֻּׁאִים
  choice: खीरे
  rationale: इस उपज की मानक पहचान।
- source_word: הָאֲבַטִּחִים
  choice: खरबूजे
  rationale: शब्द एक प्रकार के बड़े रसीले फल को दर्शाता है; व्यापक शब्द किसी एक प्रजाति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הֶחָצִיר
  choice: गंदने
  rationale: भोजन-सूची में इसका संभावित अर्थ लीक नामक सब्ज़ी है; 'गंदना' उसका प्रचलित हिन्दी नाम है।
- source_word: הַבְּצָלִים
  choice: प्याज़
  rationale: मानक शाब्दिक अर्थ।
- source_word: הַשּׁוּמִים
  choice: लहसुन
  rationale: मानक शाब्दिक अर्थ।
theological_decisions:
- issue: मिस्र की दासता के संदर्भ में חִנָּם का अर्थ
  choice: सेंत-मेंत
  alternative: मुफ़्त में; बिना दाम दिए
  rationale: पद लोगों की शिकायत को उन्हीं के दृष्टिकोण से प्रस्तुत करता है, मिस्र की दासता का वस्तुनिष्ठ मूल्यांकन नहीं। सीधा अर्थ कथन की विडंबना और तनाव दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। सूची की मौखिक लय बनाए रखने के लिए डैश और अंतिम 'भी' का प्रयोग किया गया है। 'सेंत-मेंत' शिकायत के कथन में स्वाभाविक है; पादटिप्पणी अर्थ और प्रसंगगत विडंबना स्पष्ट करती है।
