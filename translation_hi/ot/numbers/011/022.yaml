base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/022.yaml
  text: Would sheep and cattle be slaughtered for them and be enough for them? Or if all the fish of the sea were gathered for them[a], would it be enough for them?
translation:
  language: hi
  text: क्या उनके लिए भेड़-बकरियाँ और गाय-बैल वध किए जाएँ और वे उनके लिए पर्याप्त हों? या समुद्र की सारी मछलियाँ उनके लिए इकट्ठी की जाएँ और वे उनके लिए पर्याप्त हों?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दोनों बार शाब्दिक अभिव्यक्ति ‘उनके लिए पाया जाए’ है, जिसका यहाँ मुहावरेदार अर्थ ‘उनके लिए पर्याप्त हो’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲ
  choice: क्या
  rationale: प्रश्नवाचक अव्यय मूसा के अलंकारिक और काल्पनिक प्रश्न का आरम्भ करता है; आधुनिक हिन्दी में ‘क्या’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: צֹאן छोटे पालतू पशुओं के सामूहिक वर्ग और בָּקָר बड़े मवेशियों को दर्शाता है। यह चयन दोनों वर्गों को साधारण पाठक के लिए ठोस और स्पष्ट बनाता है।
- source_word: יִשָּׁחֵט
  choice: काटे जाएँ
  rationale: שׁחט का निफ़अल रूप भोजन के लिए पशुओं के वध को सूचित करता है; पशु-संदर्भ में ‘काटे जाएँ’ स्वाभाविक हिन्दी है और सामान्य ‘मारे जाएँ’ से अधिक सटीक है।
- source_word: לָהֶם
  choice: उनके लिए
  rationale: यहाँ उपसर्ग लोगों के लिए भोजन की व्यवस्था या प्रावधान व्यक्त करता है।
- source_word: וּמָצָא לָהֶם
  choice: तो वे उनके लिए पर्याप्त होंगे/होंगी
  rationale: מצא का यह प्रयोग शाब्दिक ‘मिलना’ नहीं, बल्कि किसी आवश्यकता के लिए पर्याप्त होना दर्शाता है। हिन्दी में अर्थ को मुहावरेदार ढंग से व्यक्त किया गया है और दोनों खंडों में समानता बनाए रखी गई है।
- source_word: אִם
  choice: या
  rationale: यह दूसरे अलंकारिक विकल्प का परिचय देता है; हिन्दी में ‘या’ दोनों संभावनाओं के बीच का संबंध स्पष्ट करता है।
- source_word: אֵת כָּל דְּגֵי הַיָּם
  choice: समुद्र की सारी मछलियाँ
  rationale: यह रचना समुद्र की मछलियों की समग्रता पर बल देती है; ‘सारी’ मूल के כָּל को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יֵאָסֵף
  choice: इकट्ठी की जाएँ
  rationale: אסף का निफ़अल रूप इकट्ठा किए जाने को व्यक्त करता है। अनुवाद ‘पकड़ी जाएँ’ जैसी अधिक विशिष्ट क्रिया जोड़ने से बचता है।
