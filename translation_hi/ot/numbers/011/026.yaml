  text: וַ/יִּשָּׁאֲר֣וּ שְׁנֵֽי אֲנָשִׁ֣ים בַּֽ/מַּחֲנֶ֡ה שֵׁ֣ם הָ/אֶחָ֣ד אֶלְדָּ֡ד וְ/שֵׁם֩ הַ/שֵּׁנִ֨י מֵידָ֜ד וַ/תָּ֧נַח עֲלֵי/הֶ֣ם הָ/ר֗וּחַ וְ/הֵ֨מָּה֙ בַּ/כְּתֻבִ֔ים וְ/לֹ֥א יָצְא֖וּ הָ/אֹ֑הֱלָ/ה וַ/יִּֽתְנַבְּא֖וּ בַּֽ/מַּחֲנֶֽה־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/026.yaml
  text: But two men remained in the camp[a]. The name of the one was Eldad, and the name of the second was Medad. And the Spirit rested on them; they were among those recorded, but they had not gone out to the tent[b], and they prophesied in the camp.
translation:
  language: hi
  text: परन्तु दो पुरुष छावनी में रह गए। एक का नाम एलदाद और दूसरे का नाम मेदाद था। आत्मा उन पर ठहर गई। वे दर्ज किए गए लोगों में थे[a], पर तम्बू की ओर नहीं गए थे[b]; और उन्होंने छावनी में भविष्यवाणी की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे पंजीकृत लोगों में थे।’ हिब्रू का शाब्दिक अर्थ है, ‘वे लिखे हुए लोगों में थे।’
    reason: lexical_alternative
  - marker: b
    text: इस प्रसंग में सम्भवतः मिलापवाला तम्बू।
    reason: cross_reference
lexical_decisions:
- source_word: וַיִּשָּׁאֲרוּ
  choice: रह गए
  rationale: שׁאר यहाँ पीछे रह जाने या शेष रहने का भाव देता है। ‘रह गए’ स्वाभाविक हिन्दी है और उनके न जाने का कारण नहीं जोड़ता।
- source_word: בַּמַּחֲנֶה
  choice: छावनी में
  rationale: מַחֲנֶה इस्राएल की छावनी को सूचित करता है; दोनों occurrences में सामान्य स्थानवाचक अर्थ रखा गया है।
- source_word: שְׁנֵי אֲנָשִׁים
  choice: दो पुरुष
  rationale: אֲנָשִׁים यहाँ स्पष्टतः पुरुषों को सूचित करता है; ‘पुरुष’ आधुनिक गरिमापूर्ण हिन्दी में सटीक है।
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הַשֵּׁנִי
  choice: एक का नाम ... और दूसरे का नाम
  rationale: हिब्रू नामकरण-वाक्य की समानांतर रचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: אֶלְדָּד / מֵידָד
  choice: एलदाद / मेदाद
  rationale: व्यक्तिनामों का देवनागरी में स्रोत-सन्निकट लिप्यंतरण किया गया है।
- source_word: וַתָּנַח עֲלֵיהֶם הָרוּחַ
  choice: आत्मा उन पर आ ठहरा
  rationale: נוח का भाव उन पर ठहरने या टिकने का है। हिन्दी में ‘आ ठहरा’ घटना और परिणामी स्थिति दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהֵמָּה בַּכְּתֻבִים
  choice: वे दर्ज किए गए लोगों में थे
  rationale: כְּתֻבִים का शाब्दिक भाव ‘लिखे हुए/दर्ज किए हुए’ है; यह चयन किसी सूची में उनके सम्मिलित होने को स्पष्ट करता है, जबकि वैकल्पिक ‘पंजीकृत’ पादटिप्पणी में दिया गया है।
- source_word: וְלֹא יָצְאוּ הָאֹהֱלָה
  choice: पर तम्बू के पास नहीं गए थे
  rationale: दिशासूचक הָ movement toward the tent बताता है। पूर्वघटित अवस्था को ‘नहीं गए थे’ से व्यक्त किया गया है; स्रोत के केवल ‘तम्बू’ को मुख्य पाठ में विस्तृत नहीं किया गया।
- source_word: וַיִּתְנַבְּאוּ
  choice: भविष्यवाणी करने लगे
  rationale: התפעל रूप यहाँ भविष्यद्वक्तापूर्ण गतिविधि को बताता है। हिन्दी कथा-प्रवाह में ‘करने लगे’ उस प्रसंग में आरम्भ हुई गतिविधि को सहज रूप देता है, बिना उसकी विषयवस्तु निर्धारित किए।
theological_decisions:
- issue: הָרוּחַ को सामान्य ‘आत्मा’ या परमेश्वर के ‘आत्मा’ के रूप में समझना
  choice: आत्मा
  alternative: एक आत्मा / वायु
  rationale: निकटवर्ती प्रसंग में यह वही दिव्य आत्मा है जो मूसा पर था और प्राचीनों को भविष्यवाणी के लिए सामर्थ्य देता है। हिन्दी में निश्चित संदर्भ ‘आत्मा’ से व्यक्त होता है; अतिरिक्त त्रिएकवादी पदावली नहीं जोड़ी गई।
- issue: הָאֹהֱלָה को स्पष्ट करके ‘मिलापवाला तम्बू’ कहना या केवल स्रोत का ‘तम्बू’ रखना
  choice: तम्बू
  alternative: मिलापवाला तम्बू
  rationale: संदर्भ सम्भवतः मिलापवाले तम्बू की ओर संकेत करता है, लेकिन इस पद में हिब्रू केवल ‘तम्बू’ कहता है। मुख्य पाठ स्रोत की संक्षिप्तता रखता है और पहचान पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। ‘छावनी’, ‘तम्बू’, ‘आत्मा’ और ‘भविष्यवाणी’ जैसे प्रचलित बाइबलीय शब्द साधारण पाठक के लिए परिचित और स्रोतार्थ के अनुकूल हैं।
