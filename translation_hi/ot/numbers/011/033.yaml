source:
  edition: WLC
  text: הַ/בָּשָׂ֗ר עוֹדֶ֨/נּוּ֙ בֵּ֣ין שִׁנֵּי/הֶ֔ם טֶ֖רֶם יִכָּרֵ֑ת וְ/אַ֤ף יְהוָה֙ חָרָ֣ה בָ/עָ֔ם וַ/יַּ֤ךְ יְהוָה֙ בָּ/עָ֔ם מַכָּ֖ה רַבָּ֥ה מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/011/033.yaml
  text: While the meat was still between their teeth[a], before it was consumed, Yahweh’s anger burned against the people, and Yahweh struck the people with a very severe plague.
translation:
  language: hi
  text: मांस अभी उनके दाँतों के बीच ही था, उसके समाप्त होने से पहले याहवे का क्रोध लोगों पर भड़क उठा। याहवे ने लोगों पर एक बहुत बड़ी विपत्ति डाली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבָּשָׂר
  choice: मांस
  rationale: बटेरों को भोजन के रूप में खाने के प्रसंग में यह शब्द पशु-मांस को दर्शाता है; ‘मांस’ स्वाभाविक और सटीक हिन्दी है।
- source_word: עוֹדֶנּוּ בֵּין שִׁנֵּיהֶם
  choice: अभी उनके दाँतों के बीच ही था
  rationale: यह अनुवाद निरंतरता के भाव और मांस के अभी तक निगले न जाने की सजीव तस्वीर, दोनों को बनाए रखता है।
- source_word: טֶרֶם יִכָּרֵת
  choice: उसके समाप्त होने से पहले ही
  rationale: כרת का मूल अर्थ ‘काट देना’ है, किंतु खाने के इस संदर्भ में भाव मांस के समाप्त या पूरा खा लिए जाने का है। शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַף יְהוָה חָרָה
  choice: याहवे का क्रोध लोगों पर भड़क उठा
  rationale: यह हिन्दी में स्वाभाविक ढंग से इब्रानी के जलते या भड़कते क्रोध के रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וַיַּךְ ... מַכָּה רַבָּה מְאֹד
  choice: एक अत्यंत भयंकर विपत्ति से मारा
  rationale: न्याय के इस प्रसंग में נכה और מַכָּה का संयुक्त प्रयोग विनाशकारी दैवी मार या विपत्ति बताता है। ‘विपत्ति’ ‘महामारी’ की अपेक्षा कम विशिष्ट है और स्रोत की अर्थ-सीमा बनाए रखती है; ‘अत्यंत भयंकर’ उसकी असाधारण तीव्रता व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: दैवी क्रोध का मानव-सदृश रूपक
  choice: याहवे का क्रोध लोगों पर भड़क उठा
  alternative: याहवे लोगों से क्रोधित हुआ
  rationale: मूल का ‘क्रोध जलना’ रूपक न्याय की तीव्रता व्यक्त करता है; उसे सपाट किए बिना स्वाभाविक हिन्दी में रखा गया है।
- issue: מַכָּה को रोग-विशेष मानना या व्यापक विपत्ति
  choice: विपत्ति
  alternative: महामारी; मार
  rationale: शब्द प्रहार, मार या विनाशकारी विपत्ति का अर्थ दे सकता है। यह पद रोग की प्रकृति स्पष्ट नहीं करता, इसलिए ‘विपत्ति’ अनावश्यक विशिष्टीकरण से बचते हुए न्याय का भाव बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘भड़क उठा’ इब्रानी रूपक को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘अत्यंत भयंकर विपत्ति’ दैवी न्याय की गंभीरता को बिना रोग का प्रकार निश्चित किए संप्रेषित करती है।
