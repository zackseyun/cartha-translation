lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ क्रमसूचक बल को स्वाभाविक हिंदी में व्यक्त करता है। हिंदी में ‘कहा’ वाणी की क्रिया और आगे आने वाले कथन की भूमिका को सहजता से बताता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל ... וְאֶל
  choice: मूसा और हारून से
  rationale: दोनों व्यक्तियों को वाणी के प्रत्यक्ष संबोधित जन के रूप में स्पष्ट रखा गया है; हिंदी में ‘से कहा’ दोनों पर स्वाभाविक रूप से लागू होता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिंदी में इस व्यक्तिगत नाम का मानक और सुप्रचलित रूप।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: हिंदी में इस व्यक्तिगत नाम का मानक और सुप्रचलित रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। अलग से ‘यह कहते हुए’ जोड़ना आधुनिक हिंदी में अनावश्यक पुनरुक्ति होती; ‘कहा’ उसी कार्य को स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; हिंदी पाठकों के लिए परिचित नामरूप ‘यहोवा’ चुना गया है, जबकि प्राचीन उच्चारण पूरी निश्चितता से ज्ञात नहीं है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज। मूल के क्रमसूचक वाव को ‘तब’ से व्यक्त किया गया है और दोनों संबोधित व्यक्तियों को स्पष्ट रखा गया है।
