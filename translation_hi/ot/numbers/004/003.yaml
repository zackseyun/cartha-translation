  text: from thirty years old and upward[a], up to fifty years old[b], everyone who enters the service to do the work in the tent of meeting.
translation:
  language: hi
  text: तीस वर्ष की आयु से लेकर पचास वर्ष की आयु तक के वे सभी, जो मिलाप के तंबू में काम करने के लिए सेवा में आते हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “सेवा में आते हैं” का अनुवाद “कर्तव्य के लिए आते हैं” भी किया जा सकता है। यहाँ इब्रानी शब्द צָבָא का अर्थ प्रसंगानुसार “सेवा,” “कर्तव्य,” “दल,” या “सेना” हो सकता है; इस पद में यह लेवियों की संगठित सेवा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: तीस वर्ष की आयु से लेकर पचास वर्ष की आयु तक
  rationale: बेन + संख्या + शाना आयु बताने का हिब्रू मुहावरा है। यह हिंदी रूप निचली और ऊपरी आयु-सीमा को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל בָּא לַצָּבָא
  choice: वे सभी पुरुष, जो ... सेवा-दल में सम्मिलित होते हैं
  rationale: बा का कृदन्तगत अर्थ आने या प्रवेश करने का है, जबकि त्सावा यहाँ युद्ध नहीं बल्कि संगठित लेवीय सेवा-दल या नियुक्त सेवा को सूचित करता है। प्रसंग में गिने जाने वाले पुरुष हैं, इसलिए 'पुरुष' स्पष्ट किया गया है।
- source_word: לַעֲשׂוֹת מְלָאכָה
  choice: काम करने के लिए
  rationale: क्रिया के साधारण उद्देश्य और मेलाखा के ठोस कार्यभाव को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: अोहेल मोएद का प्रचलित, समझने योग्य हिंदी बाइबलीय रूप है; 'में' मूल उपसर्ग का सीधा प्रतिनिधित्व करता है।
theological_decisions:
- issue: צָבָא का आशय सैन्य दल है या पवित्रस्थान की संगठित सेवा
  choice: सेवा-दल
  alternative: सेवा / कर्तव्य / सेना
  rationale: गिनती 4 के प्रसंग में लेवियों का नियुक्त पवित्रस्थान-संबंधी कार्य अभिप्रेत है, सैन्य युद्ध नहीं। 'सेवा-दल' संगठित सेवा का भाव रखता है और सैन्य अर्थ थोपने से बचता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली रखी गई है। आयु-सीमा को स्वाभाविक हिंदी मुहावरे में दिया गया है। 'मिलापवाला तंबू' परिचित बाइबलीय पदावली है; צָבָא की वास्तविक अर्थ-विस्तार को पादटिप्पणी में सुरक्षित रखा गया है।
