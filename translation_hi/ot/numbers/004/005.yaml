base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/005.yaml
  text: When the camp sets out[a], Aaron and his sons shall come and take down the veil of the screen, and cover the ark of the testimony with it.
translation:
  language: hi
  text: जब छावनी कूच करे, तब हारून और उसके पुत्र आएँ, ओट का परदा उतारें और उससे साक्ष्य के संदूक[a] को ढक दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से ‘वाचा का संदूक’ भी कहा जाता है; लेकिन यहाँ इब्रानी पाठ में ‘साक्ष्य’ लिखा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָא
  choice: आएँ
  rationale: रूप एकवचन है, पर संयुक्त कर्ता ‘हारून और उसके पुत्र’ तथा आगे के बहुवचन क्रियापद सामूहिक निर्देश का भाव देते हैं; इसलिए हिन्दी में आदरसूचक/बहुवचन ‘आएँ’ स्वाभाविक है।
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: जब छावनी कूच करे
  rationale: ב के साथ infinitive construct समय की परिस्थिति बताता है। ‘कूच करे’ छावनी के यात्रा आरम्भ करने का सहज और सटीक हिन्दी रूप है।
- source_word: וְהוֹרִדוּ
  choice: उतारें
  rationale: मिलापवाले तंबू को समेटने के प्रसंग में यह क्रिया परदे को उसके स्थान से नीचे उतारने का निर्देश देती है।
- source_word: פָּרֹכֶת הַמָּסָךְ
  choice: ओट का परदा
  rationale: פָּרֹכֶת पवित्रस्थान का भीतरी परदा है और הַמָּסָךְ ओट/आवरण का भाव जोड़ता है। ‘ओट का परदा’ मूल की संयुक्त अभिव्यक्ति को बनाए रखते हुए सामान्य हिन्दी में बोधगम्य है।
- source_word: וְכִסּוּ בָהּ
  choice: और उससे … को ढक दें
  rationale: כסה का मूल अर्थ ‘ढकना’ है और स्त्रीलिंग सर्वनाम का संकेत परदे की ओर है; ‘उससे’ साधन का भाव स्पष्ट करता है।
- source_word: אֲרֹן הָעֵדֻת
  choice: साक्ष्य का संदूक
  rationale: עֵדוּת का अर्थ ‘साक्ष्य/गवाही’ है, ‘वाचा’ नहीं। ‘साक्ष्य’ मूल शब्द को औपचारिक किंतु समझने योग्य हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: אֲרֹן הָעֵדֻת का पारंपरिक अनुवाद
  choice: साक्ष्य का संदूक
  alternative: वाचा का संदूक
  rationale: इब्रानी पाठ में עֵדוּת (‘साक्ष्य/गवाही’) है, בְּרִית (‘वाचा’) नहीं। इसलिए परिचित पारंपरिक पद के स्थान पर स्रोत-पाठ की शब्दावली रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। निर्देशात्मक भाव के लिए ‘आएँ’, ‘उतारें’ और ‘ढक दें’ रखा गया है। ‘ओट का परदा’ और ‘साक्ष्य का संदूक’ पवित्रस्थान की विशिष्ट शब्दावली को अनावश्यक सांप्रदायिक व्याख्या के बिना व्यक्त करते हैं।
