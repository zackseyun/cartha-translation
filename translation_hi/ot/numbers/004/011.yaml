- source_word: בֶּגֶד תְּכֵלֶת
  choice: नीले रंग का कपड़ा
  rationale: תְּכֵלֶת विशिष्ट नीले अथवा नीले-बैंगनी रंग को सूचित करता है; मूल रंग की सटीक छटा अनिश्चित होने के कारण सामान्य हिन्दी 'नीले रंग' उपयुक्त है।
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: ताहश की खाल के ओढ़ने से
  rationale: תַּחַשׁ की जीववैज्ञानिक पहचान अनिश्चित है; लिप्यंतरण उस अनिश्चितता को बचाता है, जबकि 'खाल के ओढ़ने' से वस्तु और उसका आवरणात्मक काम स्पष्ट होता है।
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: और उसके डंडे लगा दें
  rationale: בַּדִּים पवित्र-सामग्री को उठाकर ले जाने के डंडे हैं; 'लगा दें' निर्देश की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, बिना मूल से अधिक विवरण जोड़े।
