  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “गेर्शोन के पुत्रों का सिर उठाओ—वे भी”; यह उनकी गिनती या जनगणना करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: जनगणना करो
  rationale: शाब्दिक अर्थ ‘सिर उठाओ’ है, पर इस प्रशासनिक प्रसंग में यह गिनती अथवा जनगणना करने का मुहावरा है। आधुनिक हिन्दी में ‘जनगणना करो’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: गेर्शोन के पुत्रों
  rationale: इब्रानी पाठ की वंशावली-सूचक पुत्र-संरचना को बनाए रखा गया है; ‘वंशजों’ भी संभव है, पर वह मूल अभिव्यक्ति से कुछ अधिक सामान्य है।
- source_word: גַּם הֵם
  choice: भी
  rationale: यह पिछले समूह के साथ गेर्शोन के पुत्रों को भी गणना में सम्मिलित करता है। हिन्दी में ‘भी’ इस संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: यह पद पितृवंश पर आधारित पूर्वज-गृहों अथवा व्यापक पारिवारिक इकाइयों को दर्शाता है। ‘पितृकुल’ आधुनिक हिन्दी में इस वंश-संरचना को संक्षेप में सुरक्षित रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: गणना और गोत्रीय व्यवस्था के संदर्भ में מִשְׁפָּחָה आधुनिक एकल परिवार नहीं, बल्कि वंश की सामाजिक उपइकाई को दर्शाता है; ‘कुल’ यहाँ उपयुक्त और सुबोध है।
