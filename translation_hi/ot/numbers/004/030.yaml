source:
  edition: WLC
  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה וְ/עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקְדֵ֑/ם כָּל הַ/בָּא֙ לַ/צָּבָ֔א לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/030.yaml
  text: From thirty years old and upward[a], up to fifty years old[b], you shall count them—everyone who enters the service to do the work of the tent of meeting.
translation:
  language: hi
  text: तीस वर्ष से लेकर पचास वर्ष तक के उन सभी लोगों की गिनती करना, जो मिलाप के तंबू का काम करने के लिए सेवा में आते हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियुक्त काम के लिए आते हैं।” “सेवा” के लिए प्रयुक्त इब्रानी शब्द संगठित दल या समूह को भी सूचित कर सकता है; यहाँ आशय लेवियों को सौंपे गए काम से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: तीस वर्ष से लेकर पचास वर्ष तक
  rationale: इब्रानी आयु-संबंधी मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और दोनों सीमाओं को समावेशी आयु-सीमा के रूप में रखता है।
- source_word: תִּפְקְדֵם
  choice: उनकी गिनती करना
  rationale: इस जनगणना-संदर्भ में פקד का अर्थ सेवा के योग्य लोगों को गिनना अथवा दर्ज करना है। हिन्दी आज्ञार्थक रचना मूल के एकवचन संबोधन को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: כָּל הַבָּא
  choice: उन सभी लोगों ... जो ... आते हैं
  rationale: वाक्यांश के प्रत्येक योग्य व्यक्ति को सम्मिलित करने वाले वितरणात्मक अर्थ को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: לַצָּבָא
  choice: सेवा में
  rationale: צָבָא में संगठित दल या नियुक्त सेवा का भाव हो सकता है। यहाँ लेवियों की व्यवस्थित पवित्र-स्थान सेवा अभिप्रेत है, न कि युद्ध; इसलिए 'सेवा' प्रसंगानुकूल है।
- source_word: לַעֲבֹד אֶת עֲבֹדַת
  choice: काम करने के लिए
  rationale: मूल में एक ही धातु से बने क्रिया और संज्ञा का संयोग है। हिन्दी में अनावश्यक दोहराव से बचते हुए कार्य करने का अर्थ सुरक्षित रखा गया है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: पवित्र-स्थान के इस पारंपरिक नाम को पहचानने योग्य रखते हुए आधुनिक वर्तनी और सहज संबंध-रचना अपनाई गई है।
theological_decisions:
- issue: לַצָּבָא में सैन्य अर्थ की संभावना
  choice: सेवा में
  alternative: दल में / नियुक्त काम के लिए
  rationale: צָבָא सामान्यतः सेना या संगठित दल भी दर्शाता है, पर गिनती 4 में प्रसंग मिलाप के तंबू की नियुक्त लेवीय सेवा का है। 'सेवा' युद्ध का अनावश्यक भाव नहीं जोड़ती, जबकि संगठित दायित्व का मूल आशय बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। 'मिलाप का तंबू' पारंपरिक बाइबलीय पद को सामान्य पाठक के लिए पहचानने योग्य रखता है। आज्ञा को हिन्दी में प्रचलित 'गिनती करना' रूप में रखा गया है।
