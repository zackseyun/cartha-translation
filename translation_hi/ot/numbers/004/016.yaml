  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी रखी गई है। ‘ज़िम्मेदारी’ और ‘देखरेख’ प्रशासनिक-पुजारीय संदर्भ को स्वाभाविक रूप से व्यक्त करते हैं। ‘पवित्र निवास’ शब्द מִשְׁכָּן के निवासस्थान-संबंधी अर्थ को सामने रखता है।
