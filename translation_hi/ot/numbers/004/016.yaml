base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/016.yaml
  text: And the oversight of Eleazar son of Aaron the priest shall be the oil for the light[a], the fragrant incense, the regular grain offering, and the anointing oil—the oversight of the whole tabernacle and all that is in it[d][c][b], the sanctuary and its furnishings.
translation:
  language: hi
  text: याजक हारून के पुत्र एलआज़ार की ज़िम्मेदारी[a] होगी—दीपक के लिए तेल, सुगंधित धूप, नित्य अन्नबलि[b] और अभिषेक का तेल; पूरे पवित्र निवास और उसमें जो कुछ है—पवित्रस्थान[c] और उसके उपकरणों[d]—की देखरेख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ज़िम्मेदारी’ का अनुवाद ‘सौंपी गई देखरेख’ या ‘प्रभार’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘नित्य अन्नबलि’ का अनुवाद ‘नियमित अन्नबलि’ या ‘निरंतर अन्नबलि’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘पवित्रस्थान’ का अनुवाद ‘पवित्र स्थान’ भी हो सकता है; यहाँ इसका संकेत व्यापक पवित्र क्षेत्र की ओर हो सकता है।
    reason: lexical_alternative
  - marker: d
    text: ‘उपकरणों’ के लिए प्रयुक्त इब्रानी शब्द का अनुवाद ‘पात्र’, ‘बर्तन’ या ‘अन्य साज-सामान’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת
  choice: ज़िम्मेदारी / देखरेख
  rationale: यह शब्द सौंपी गई निगरानी और उत्तरदायित्व को दर्शाता है। आरंभ में ‘ज़िम्मेदारी’ और सारांश में ‘देखरेख’ स्वाभाविक हिन्दी में उसी प्रशासनिक भाव को व्यक्त करते हैं।
- source_word: שֶׁמֶן הַמָּאוֹר
  choice: दीपक के लिए तेल
  rationale: शाब्दिक अर्थ ‘प्रकाश का तेल’ है; सन्दर्भ में यह दीप जलाने का तेल है। यह अनुवाद स्पष्ट है, पर किसी विशेष दीपाधार को अनावश्यक रूप से नहीं जोड़ता।
- source_word: קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप
  rationale: यह सुगंधित मसालों से तैयार धूप को दर्शाता है; आधुनिक हिन्दी में यह संक्षिप्त और स्वाभाविक अभिव्यक्ति है।
- source_word: מִנְחַת הַתָּמִיד
  choice: नित्य अन्नबलि
  rationale: מִנְחָה अन्नबलि है और תָּמִיד नियमित अथवा निरंतर होने का भाव देता है। ‘नित्य’ उस पुनरावृत्त उपासना-संबंधी भाव को बिना अतिरिक्त समय-सूचना जोड़े व्यक्त करता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह रचना के उपासना-संबंधी अर्थ को सीधे और प्रचलित हिन्दी में व्यक्त करता है।
- source_word: כָּל הַמִּשְׁכָּן
  choice: पूरा पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव निवासस्थान है और गिनती में यह तम्बूवाले पवित्र निवास को दर्शाता है। ‘पवित्र निवास’ सामान्य पाठक के लिए अर्थपूर्ण है और כָּל का पूर्णताबोध भी बनाए रखता है।
- source_word: בְּקֹדֶשׁ
  choice: पवित्रस्थान
  rationale: यहाँ शब्द स्थानिक और उपासना-संबंधी है। ‘पवित्रस्थान’ व्यापक पवित्र क्षेत्र का संकेत देता है और इसे केवल भीतरी कक्ष तक सीमित नहीं करता।
- source_word: כֵלָיו
  choice: उसके पात्र
  rationale: כֵּלִים में पात्र, उपकरण और अन्य पवित्र साज-सामान सम्मिलित हो सकते हैं। ‘पात्र’ पारंपरिक उपासना-संदर्भ में समझने योग्य है; पादटिप्पणी व्यापक विकल्प बताती है।
theological_decisions:
- issue: दो बार आए פְקֻדַּת का संबंध और पद की क्रियारहित रचना
  choice: पहले भाग को एलआज़ार की सौंपी गई ज़िम्मेदारी और दूसरे को उसका व्यापक सारांश माना गया है; हिन्दी में ‘होगी’ जोड़ा गया है।
  alternative: दूसरे פְקֻדַּת को स्वतंत्र समानाधिकरणीय शीर्षक की तरह रखते हुए वाक्य को और अधिक खंडित छोड़ा जा सकता है।
  rationale: इब्रानी रचना नामवाची और कुछ हद तक समानाधिकरणीय है। हिन्दी में ‘होगी’ वाक्य-संबंध स्पष्ट करता है, जबकि अर्धविराम और ‘अर्थात्’ सूची तथा व्यापक सारांश के बीच का तनाव बनाए रखते हैं।
- issue: בְּקֹדֶשׁ וּבְכֵלָיו की वाक्यगत भूमिका
  choice: इसे पूरे पवित्र निवास और उसकी सामग्री का स्पष्टीकरण मानकर ‘पवित्रस्थान और उसके पात्रों’ के रूप में रखा गया है।
  alternative: पूर्वसर्गों को अधिक शाब्दिक रूप से ‘पवित्रस्थान में और उसके पात्रों के संबंध में’ कहा जा सकता है।
  rationale: इब्रानी בְּ यहाँ कार्यक्षेत्र अथवा संबंध का भाव दे सकता है। चुनी हुई हिन्दी अस्वाभाविक स्थानिक अर्थ से बचती है, पर पादटिप्पणियों में शब्दार्थ की व्यापकता सुरक्षित रखती है।
