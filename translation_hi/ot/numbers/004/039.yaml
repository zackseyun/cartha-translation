  text: from thirty years old and upward[a], up to fifty years old, everyone who enters the service for the work in the tent of meeting—
translation:
  language: hi
  text: तीस वर्ष से पचास वर्ष तक की आयु का हर वह व्यक्ति जो सेवा के लिए, मिलाप के तंबू में काम करने आता था[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हर वह व्यक्ति जो मिलाप के तंबू में काम करने के कर्तव्य के लिए आता था।”
    reason: לַצָּבָא में संगठित सेवा अथवा नियत कर्तव्य—दोनों अर्थ-छायाएँ संभव हैं।
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: तीस वर्ष से लेकर पचास वर्ष तक की आयु का
  rationale: इब्रानी आयु-सूचक मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करते हुए न्यूनतम और अधिकतम आयु दोनों स्पष्ट रखी गई हैं।
- source_word: כָּל הַבָּא
  choice: हर वह व्यक्ति, जो ... आता था
  rationale: בוא के कृदंत का सामूहिक और पुनरावर्ती भाव रखा गया है; प्रसंग भूतकालीन गणना का है, इसलिए हिन्दी में ‘आता था’ स्वाभाविक है।
- source_word: לַצָּבָא
  choice: सेवा में
  rationale: यहाँ צבא सैनिक सेना के बजाय लेवियों की संगठित और नियत सेवा को दर्शाता है; ‘सेवा’ अनावश्यक सैन्य अर्थ से बचती है।
- source_word: לַעֲבֹדָה
  choice: काम करने के लिए
  rationale: עֲבֹדָה के श्रम/कार्य के भाव को स्पष्ट किया गया है और इसे पहले आए ‘सेवा’ से अलग रखा गया है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह אֹהֶל מוֹעֵד का प्रचलित, स्पष्ट हिन्दी रूप है और בְּ के स्थानगत अर्थ को बनाए रखता है।
