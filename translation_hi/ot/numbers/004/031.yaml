  to: 'और मिलाप के तंबू में उनकी सारी सेवा के लिए उनके भार उठाने की जिम्मेदारी यह है: निवास-स्थान के तख्ते[a], उसकी बल्लियाँ, उसके खंभे और उसके आधार[b]।'
  rationale: The revision replaces an awkward genitive construction with an idiomatic expression for the Merarites’ assigned carrying responsibility. It uses “तख्ते” for the tabernacle’s structural boards and “आधार” for their base pieces, while footnotes retain the relevant architectural alternatives. The list, possessive references, and scope of service remain faithful to the Hebrew.
