source:
  edition: WLC
  text: וְ/זֹאת֙ מִשְׁמֶ֣רֶת מַשָּׂאָ֔/ם לְ/כָל עֲבֹדָתָ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד קַרְשֵׁי֙ הַ/מִּשְׁכָּ֔ן וּ/בְרִיחָ֖י/ו וְ/עַמּוּדָ֥י/ו וַ/אֲדָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/031.yaml
  text: 'And this is the duty of their burden for all their service in the tent of meeting: the frames of the tabernacle[a], its bars, its pillars[c][b], and its bases.'
translation:
  language: hi
  text: 'और मिलाप के तंबू में उनकी सारी सेवा के लिए उनके भार उठाने की जिम्मेदारी यह है: निवास-स्थान के तख्ते[a], उसकी बल्लियाँ, उसके खंभे और उसके आधार[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निवास-स्थान के संरचनात्मक चौखटे।” इब्रानी शब्द उन तख्तों/पट्टों को सूचित करता है जो संरचना का ढाँचा बनाते थे।
    reason: lexical_alternative
  - marker: b
    text: या “उसके खाँचे” या “सॉकेट।” ये आधार-खंड थे जिनमें तख्ते या खंभे लगाए जाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת
  choice: और ... यह है
  rationale: संयोजक और संकेतवाचक की प्रस्तुतिपरक शैली को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִשְׁמֶרֶת מַשָּׂאָם
  choice: उनके उठाने के भार की ज़िम्मेदारी
  rationale: מִשְׁמֶרֶת नियुक्त दायित्व और מַשָּׂא उठाकर ले जाने योग्य भार को दर्शाता है; यह अभिव्यक्ति दोनों अर्थों को स्पष्ट रखती है।
- source_word: לְכָל עֲבֹדָתָם
  choice: उनकी सारी सेवा के लिए
  rationale: עֲבֹדָה यहाँ पवित्र स्थान से जुड़ी नियत सेवा है, केवल सामान्य काम नहीं।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह हिन्दी बाइबलीय प्रयोग में परिचित है और उस स्थान के नियत नाम को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: पवित्र निवास के चौखटे
  rationale: קֶרֶשׁ संरचना के तख्तों या फ्रेमों को सूचित करता है; 'चौखटे' उनकी संरचनात्मक भूमिका को सामान्य पाठक के लिए स्पष्ट करता है।
- source_word: בְרִיחָיו
  choice: उसके डंडे
  rationale: ये चौखटों को जोड़ने वाले क्षैतिज डंडे हैं; 'डंडे' सहज है, जबकि अधिक स्पष्ट विकल्प 'आड़े डंडे' हो सकता है।
- source_word: עַמּוּדָיו
  choice: उसके खंभे
  rationale: ऊर्ध्वाधर सहारों के लिए स्वाभाविक और सटीक आधुनिक हिन्दी शब्द।
- source_word: אֲדָנָיו
  choice: उसकी पायें
  rationale: ये वे आधार-खंड हैं जिनमें खंभे या चौखटे टिकते थे; 'पायें' वास्तुगत कार्य को सरल हिन्दी में बताता है।
