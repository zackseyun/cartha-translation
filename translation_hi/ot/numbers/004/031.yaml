review_pass:
  verdict: revise
  source_fidelity: The draft conveys the enumerated transport assignment and all four structural items. However, “उनके उठाने के भार की ज़िम्मेदारी” is syntactically heavy and does not idiomatically express מִשְׁמֶרֶת מַשָּׂאָם, an assigned responsibility concerning what they carry. “चौखटे” commonly denotes door or window frames in modern Hindi and is therefore potentially misleading for קַרְשֵׁי, the tabernacle’s structural boards/planks.
  naturalness: A modest revision gives a clear, modern Hindi sentence while retaining the formal inventory style. “मिलाप के तंबू” and “निवास-स्थान” are natural, recognizable biblical designations; “भार उठाने की जिम्मेदारी” directly states the assigned carrying duty.
  terminology: “तख्ते” is a safer primary rendering for קַרְשֵׁי than “चौखटे,” with a note preserving the possible structural-frame nuance. “आधार” clearly renders אֲדָנִים; the note supplies the technical alternative “खाँचे/सॉकेट.” No theological terminology has been added beyond conventional sanctuary designations.
  issues:
  - severity: medium
    issue: The phrase “उनके उठाने के भार की ज़िम्मेदारी” is unnatural and unclear.
    rationale: It can be read as responsibility belonging to a burden, rather than the assigned duty to carry the listed objects. The Hebrew combines assigned charge (מִשְׁמֶרֶת) with carrying load (מַשָּׂא).
  - severity: medium
    issue: “चौखटे” is an overly specific and potentially misleading rendering of קַרְשֵׁי.
    rationale: In current Hindi it normally evokes a frame around an opening. The Hebrew refers to the tabernacle’s structural boards/planks; “तख्ते” is clearer, while a note can retain the frame sense.
  - severity: low
    issue: “पायें” is less immediately clear than “आधार.”
    rationale: “आधार” directly conveys the base pieces and avoids possible association with furniture legs.
