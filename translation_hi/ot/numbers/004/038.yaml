  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: और ... जो गिने गए
  rationale: यह रूप संज्ञात्मक हिब्रू अभिव्यक्ति का अर्थ स्वाभाविक हिन्दी में देता है और अगले पद में आने वाली गणना की ओर ले जाता है; यहाँ मूल में 'पुरुष' शब्द स्पष्ट रूप से नहीं है।
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: गेरशोन के वंशजों में से
  rationale: वंशावली-संदर्भ में בְּנֵי का आशय केवल प्रत्यक्ष पुत्र नहीं, बल्कि गेरशोन से उतरे लोगों से है।
- source_word: לְמִשְׁפְּחוֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחוֹת व्यापक गोत्र के भीतर की पारिवारिक या कुलगत इकाइयों को दर्शाता है।
- source_word: וּלְבֵית אֲבֹתָם
  choice: और पितृकुलों के अनुसार
  rationale: בֵּית אָבוֹת पूर्वज-पिता के आधार पर संगठित पैतृक घराने को दर्शाता है; 'पितृकुल' इसे संक्षिप्त और स्पष्ट रखता है।
