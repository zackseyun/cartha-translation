  text: עַל פִּ֨י יְהוָ֜ה פָּקַ֤ד אוֹתָ/ם֙ בְּ/יַד מֹשֶׁ֔ה אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/עַל מַשָּׂא֑/וֹ וּ/פְקֻדָ֕י/ו אֲשֶׁר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/049.yaml
  text: At the command of Yahweh they were counted by the hand of Moses[a], each man according to his service and according to his burden; and his assignment[c] was as Yahweh had commanded Moses[b].
translation:
  language: hi
  text: याहवे की आज्ञा के अनुसार[a] मूसा के द्वारा[b] उनकी गिनती की गई—हर एक की उसके सेवा-कार्य और उसके भार के अनुसार; और उनकी गणना[c] वैसी ही हुई, जैसी याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुख के अनुसार।” यह एक इब्रानी मुहावरा है, जिसका अर्थ “याहवे की आज्ञा के अनुसार” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मूसा के हाथ से”; अर्थात मूसा के माध्यम से।
    reason: lexical_alternative
  - marker: c
    text: यह कठिन इब्रानी पद “उनकी गणना,” “गिने हुए लोग,” “नियुक्ति,” या “सौंपा गया दायित्व” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל־פִּי יְהוָה
  choice: याहवे की आज्ञा के अनुसार
  rationale: עַל־פִּי का शाब्दिक अर्थ “के मुख के अनुसार” है, पर यहाँ यह किसी के आदेश या आज्ञा के अनुसार किए गए कार्य का मुहावरा है। यְהוָה को व्यक्तिगत नाम “याहवे” के रूप में रखा गया है।
- source_word: פָּקַד אֹתָם
  choice: उनकी गिनती की गई
  rationale: פקד के अर्थ-क्षेत्र में गिनना, नाम दर्ज करना, नियुक्त करना और निरीक्षण करना शामिल हैं। गिनती और सेवा के लिए पंजीकरण के निकट संदर्भ में कर्मवाच्य “गिनती की गई” प्रशासनिक जनगणना का भाव स्पष्ट करता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: “मूसा के हाथ से” वाला इब्रानी मुहावरा माध्यम या कर्तृत्व बताता है। स्वाभाविक आधुनिक हिन्दी में “मूसा के द्वारा” यही अर्थ देता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: אִישׁ אִישׁ
  choice: हर पुरुष
  rationale: संज्ञा की पुनरुक्ति वितरणात्मक है और प्रत्येक पुरुष की अलग-अलग सेवा तथा भार पर बल देती है।
- source_word: עַל עֲבֹדָתוֹ
  choice: उसके सेवा-कार्य के अनुसार
  rationale: עֲבֹדָה यहाँ पवित्र-तम्बू से संबंधित निर्धारित सेवा या काम है। “सेवा-कार्य” धार्मिक सेवा और व्यावहारिक श्रम दोनों को समेटता है।
- source_word: וְעַל מַשָּׂאוֹ
  choice: उसके उठाने के भार के अनुसार
  rationale: מַשָּׂא वह भार है जिसे यात्रा के समय उठाकर ले जाना था। “उठाने का भार” हिन्दी में संदर्भ को केवल रूपकात्मक बोझ समझे जाने से बचाता है।
- source_word: וּפְקֻדָיו
  choice: और उसका नियुक्त कार्य
  rationale: यह रूप पाठ और वाक्य-विन्यास की दृष्टि से कठिन है तथा פקד से निकला है। संदर्भ में इसे प्रत्येक व्यक्ति को सौंपे गए कार्य या दायित्व के रूप में प्रस्तुत किया गया है, जबकि संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: वैसा ही था, जैसा याहवे ने मूसा को आज्ञा दी थी
  rationale: सम्बन्धवाचक उपवाक्य को हिन्दी में स्वाभाविक बनाने के लिए “वैसा ही था, जैसा” जोड़ा गया है। यह पूरी नियुक्त व्यवस्था को मूसा को दी गई याहवे की आज्ञा के अनुरूप बताता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। “याहवे” उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: פקד की प्रशासनिक क्रिया
  choice: गिनती की गई
  alternative: नियुक्त किए गए; नाम दर्ज किए गए
  rationale: अध्याय का तात्कालिक संदर्भ सेवा-योग्य लेवियों की गणना और उनके काम के निर्धारण का है। मुख्य क्रिया को “गिनती” कहना इस संदर्भ को सामने रखता है, पर नियुक्ति का निकट भाव अंतिम कठिन पद में बना रहता है।
- issue: וּפְקֻדָיו का कठिन वाचन
  choice: उसका नियुक्त कार्य
  alternative: उसकी नियुक्ति; उसकी देखरेख; उसे सौंपा गया दायित्व; इस प्रकार उनकी गिनती हुई
  rationale: इब्रानी रूप का विश्लेषण और वाक्य में उसका संबंध विवादास्पद है। मुख्य पाठ व्यक्तिगत सेवा और भार के समानांतर एक सौंपे हुए कार्य को रखता है, और पादटिप्पणी वैकल्पिक अर्थों को खुला रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक के लिए सुबोध रूप अपनाया गया है। “सेवा-कार्य” और “उठाने का भार” पवित्र-तम्बू की व्यावहारिक जिम्मेदारियों को स्पष्ट करते हैं। मूल इब्रानी के मुहावरे और कठिन अंतिम पद को पादटिप्पणियों में सुरक्षित रखा गया है।
