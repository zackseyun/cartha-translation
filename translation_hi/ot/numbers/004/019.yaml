  text: וְ/זֹ֣את עֲשׂ֣וּ לָ/הֶ֗ם וְ/חָיוּ֙ וְ/לֹ֣א יָמֻ֔תוּ בְּ/גִשְׁתָּ֖/ם אֶת קֹ֣דֶשׁ הַ/קֳּדָשִׁ֑ים אַהֲרֹ֤ן וּ/בָנָי/ו֙ יָבֹ֔אוּ וְ/שָׂמ֣וּ אוֹתָ֗/ם אִ֥ישׁ אִ֛ישׁ עַל עֲבֹדָת֖/וֹ וְ/אֶל מַשָּׂאֽ/וֹ׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/019.yaml
  text: 'But do this for them[b][a], so that they may live and not die when they come near the most holy things: Aaron and his sons shall come and assign each man to his service and to his load.'
translation:
  language: hi
  text: 'परन्तु उनके लिए ऐसा करो, जिससे वे परमपवित्र वस्तुओं[a] के निकट आते समय जीवित रहें और मरें नहीं: हारून और उसके पुत्र आएँ और एक-एक पुरुष[b] को उसकी सेवा और उसके भार के लिए नियुक्त करें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमपवित्र स्थान” अथवा “परमपवित्र कक्ष।” इस प्रसंग में यह पद सम्भवतः भीतरी पवित्र कक्ष के बजाय ढोई जाने वाली परमपवित्र वस्तुओं को दर्शाता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “पुरुष-पुरुष”; यह वितरणात्मक अभिव्यक्ति है, जिसका अर्थ है कि हर पुरुष को उसकी अपनी सेवा और ढोने का भार सौंपा जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְזֹאת עֲשׂוּ לָהֶם
  choice: परन्तु उनके लिए ऐसा करो
  rationale: וְזֹאת यहाँ पिछली चेतावनी के बाद निर्देशात्मक मोड़ लाता है; לָהֶם का हितार्थक भाव ‘उनके लिए’ से व्यक्त होता है।
- source_word: וְחָיוּ וְלֹא יָמֻתוּ
  choice: जिससे वे ... जीवित रहें और मरें नहीं
  rationale: आज्ञा के इच्छित परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है, साथ ही जीवन और मृत्यु का स्पष्ट विरोध बनाए रखता है।
- source_word: בְּגִשְׁתָּם
  choice: निकट आते समय
  rationale: בְּ के साथ infinitive construct का कालगत भाव और נגשׁ का उपासना-संबंधी ‘निकट आना’ दोनों सुरक्षित रहते हैं।
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र वस्तुओं
  rationale: इस प्रसंग में कहातियों द्वारा ढोई जाने वाली सर्वाधिक पवित्र वस्तुएँ अभिप्रेत होने की अधिक सम्भावना है; स्थानवाचक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: אַהֲרֹן וּבָנָיו יָבֹאוּ
  choice: हारून और उसके पुत्र आएँ
  rationale: निर्देशात्मक imperfect को आधुनिक, गरिमापूर्ण हिन्दी में विध्यर्थक रूप से व्यक्त किया गया है।
- source_word: וְשָׂמוּ אוֹתָם אִישׁ אִישׁ
  choice: एक-एक पुरुष को ... नियुक्त करें
  rationale: שׂים के नियुक्ति/तैनाती भाव और אִישׁ אִישׁ की वितरणात्मक पुनरुक्ति को स्पष्ट रूप से व्यक्त करता है।
- source_word: עַל עֲבֹדָתוֹ וְאֶל מַשָּׂאוֹ
  choice: उसकी सेवा और उसके उठाने के भार के लिए
  rationale: עֲבֹדָה निर्धारित लेवीय सेवा को और מַשָּׂא परिवहन में उठाए जाने वाले ठोस भार को दर्शाता है।
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים का अभिप्राय
  choice: परमपवित्र वस्तुएँ
  alternative: परमपवित्र स्थान / परमपवित्र कक्ष
  rationale: निकटवर्ती प्रसंग पवित्र सामान को ढोने के लिए तैयार करने और व्यक्तियों को सेवा तथा भार सौंपने से संबंधित है। फिर भी इब्रानी पद का स्थानवाचक अर्थ सम्भव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: אִישׁ אִישׁ में लिंग और वितरणात्मक बल
  choice: एक-एक पुरुष
  alternative: हर एक / प्रत्येक व्यक्ति
  rationale: यहाँ संदर्भ पुरुष लेवियों का है; इसलिए व्याकरणिक और संदर्भगत पुल्लिंग को बनाए रखते हुए पुनरुक्ति का वितरणात्मक अर्थ व्यक्त किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सहज रखी गई है। ‘परमपवित्र’ याजकीय प्रसंग की पवित्रता की उच्चतम कोटि को संक्षेप में व्यक्त करता है; ‘उठाने का भार’ सामान्य रूपकात्मक बोझ के बजाय परिवहन-संबंधी ठोस अर्थ स्पष्ट करता है।
