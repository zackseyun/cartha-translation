  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַ֣ל שֻׁלְחַ֣ן הַ/פָּנִ֗ים יִפְרְשׂוּ֮ בֶּ֣גֶד תְּכֵלֶת֒ וְ/נָתְנ֣וּ עָ֠לָי/ו אֶת הַ/קְּעָרֹ֤ת וְ/אֶת הַ/כַּפֹּת֙ וְ/אֶת הַ/מְּנַקִּיֹּ֔ת וְ/אֵ֖ת קְשׂ֣וֹת הַ/נָּ֑סֶךְ וְ/לֶ֥חֶם הַ/תָּמִ֖יד עָלָ֥י/ו יִהְיֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/007.yaml
  text: And over the table of the Presence they shall spread a blue cloth[a], and they shall place on it the plates, the cups, the bowls, and the pitchers for the drink offering[b]; and the regular bread shall be on it.
translation:
  language: hi
  text: और वे उपस्थिति की मेज़[a] पर नीला कपड़ा बिछाएँ और उस पर थालियाँ, कटोरियाँ, पात्र और पेय-अर्पण उँडेलने की सुराहियाँ रखें। नित्य की रोटी[b] उस पर रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत रूप से, “भेंट की रोटियों की मेज़।” इब्रानी में अधिक शाब्दिक अर्थ “उपस्थिति की मेज़” है।
    reason: alternative_reading
  - marker: b
    text: अर्थात वह रोटी जो नियमित रूप से इस मेज़ पर यहोवा के सामने रखी जाती थी। इसका अनुवाद “सदा रहने वाली रोटी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֻׁלְחַן הַפָּנִים
  choice: उपस्थिति की मेज़
  rationale: यह इब्रानी के शाब्दिक भाव ‘मुख/उपस्थिति की मेज़’ और पवित्रस्थान-संबंधी अर्थ को बनाए रखता है; परंपरागत व्याख्यात्मक नाम को पाद-टिप्पणी में दिया गया है।
- source_word: יִפְרְשׂוּ
  choice: बिछाएँ
  rationale: कपड़े को मेज़ के ऊपर फैलाने की क्रिया के लिए यह स्वाभाविक आधुनिक हिन्दी है।
- source_word: בֶּגֶד תְּכֵלֶת
  choice: नीला कपड़ा
  rationale: तम्बू के संदर्भ में प्रयुक्त विशिष्ट नीले अथवा नील-बैंगनी रंग को बिना अनावश्यक रूप से अधिक निश्चित किए सरल भाषा में व्यक्त करता है।
- source_word: הַקְּעָרֹת
  choice: थालियाँ
  rationale: यह सपाट परोसने वाले पात्रों के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: הַכַּפֹּת
  choice: कटोरियाँ
  rationale: पात्र के सटीक आकार के विषय में अनिश्चितता को स्वीकार करते हुए यह छोटे मेज़-पात्र का सुबोध रूप है।
- source_word: הַמְּנַקִּיֹּת
  choice: पात्र
  rationale: इस दुर्लभ उपासना-संबंधी पात्र की पहचान अनिश्चित है; सामान्य शब्द किसी अप्रमाणित आकार या उपयोग को आरोपित नहीं करता।
- source_word: קְשׂוֹת הַנָּסֶךְ
  choice: पेय-अर्पण उँडेलने की सुराहियाँ
  rationale: यह पात्रों के उँडेलने के कार्य और נֶסֶךְ के उपासना-संबंधी पेय-अर्पण, दोनों को स्पष्ट करता है।
- source_word: לֶחֶם הַתָּמִיד
  choice: नित्य की रोटी
  rationale: यह उस रोटी की नियमित और निरंतर निर्धारित उपस्थिति को संक्षेप में बनाए रखता है।
- source_word: עָלָיו יִהְיֶה
  choice: उस पर रहे
  rationale: इससे मेज़ पर रोटी की निर्धारित उपस्थिति स्वाभाविक हिन्दी में व्यक्त होती है, बिना अतिरिक्त व्याख्या जोड़े।
theological_decisions:
- issue: שֻׁלְחַן הַפָּנִים का उपासना-संबंधी नाम
  choice: उपस्थिति की मेज़
  alternative: भेंट की रोटियों की मेज़
  rationale: मूल पाठ के ‘उपस्थिति’ वाले रूपक को मुख्य पाठ में रखा गया है और प्रचलित व्याख्यात्मक नाम पाद-टिप्पणी में दिया गया है।
- issue: לֶחֶם הַתָּמִיד में निरंतरता का भाव
  choice: नित्य की रोटी
  alternative: सदा रहने वाली रोटी
  rationale: ‘नित्य’ नियमित और निरंतर रखे जाने का भाव देता है, पर यह निर्धारित प्रक्रिया के बारे में मूल से अधिक विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पेय-अर्पण’ को अपेक्षाकृत स्पष्ट उपासना-संबंधी पद के रूप में चुना गया है। दुर्लभ पात्र-नामों में जहाँ आकार अनिश्चित है, वहाँ अति-विशिष्ट शब्दावली से बचा गया है।
