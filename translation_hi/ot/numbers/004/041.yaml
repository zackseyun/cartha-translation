source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֗י מִשְׁפְּחֹת֙ בְּנֵ֣י גֵרְשׁ֔וֹן כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֥ד מֹשֶׁ֛ה וְ/אַהֲרֹ֖ן עַל פִּ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/041.yaml
  text: These were the counted men of the families of the sons of Gershon[a], all who served in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh.
translation:
  language: hi
  text: ये गेर्शोन के पुत्रों के कुलों के गिने हुए लोग थे—मिलाप के तंबू में सेवा करनेवाले वे सभी, जिन्हें मूसा और हारून ने याहवे की आज्ञा के अनुसार गिना था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: ये ... गिने गए लोग थे
  rationale: यह पद जनगणना के परिणाम का सार प्रस्तुत करता है। हिन्दी में भूतकाल कथात्मक संदर्भ के अनुकूल है, जबकि पादटिप्पणी इब्रानी की वर्तमानकाल-सदृश नामवाचक रचना को सुरक्षित रखती है।
- source_word: מִשְׁפְּחֹת בְּנֵי גֵרְשׁוֹן
  choice: गेर्शोन के पुत्रों के कुलों
  rationale: ‘कुल’ इस्राएल की वंश-आधारित सामाजिक इकाइयों के लिए स्वाभाविक और संक्षिप्त है; ‘पुत्रों’ से मूल की रिश्तेदारी-सूचक अभिव्यक्ति बनी रहती है।
- source_word: כָּל הָעֹבֵד
  choice: वे सभी जो ... सेवा करते थे
  rationale: कर्तृवाचक कृदन्त सेवा में लगे पूरे समूह को दर्शाता है। यह हिन्दी में स्वाभाविक है और सेवा के कार्य को स्पष्ट रखता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह पवित्रस्थान के प्रचलित नाम का स्पष्ट हिन्दी रूप है; ‘में’ मूल उपसर्ग בְּ को दर्शाता है।
- source_word: אֲשֶׁר פָּקַד מֹשֶׁה וְאַהֲרֹן
  choice: जिन्हें मूसा और हारून ने ... गिना था
  rationale: संबंधवाचक उपवाक्य को उसी समूह से जोड़ा गया है और פקד की जनगणना-संबंधी धारणा को ‘गिना’ से दोहराया गया है।
- source_word: עַל פִּי יְהוָה
  choice: याहवे की आज्ञा के अनुसार
  rationale: शाब्दिक ‘याहवे के मुख के अनुसार’ का स्वाभाविक अर्थ दैवी आदेश के अनुसार है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरीय निजी नाम सीधे आया है। ‘याहवे’ उसके व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण को हिन्दी में व्यक्त करता है और उसे केवल उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। जनगणना तथा पवित्रस्थान की सेवा से जुड़े पदों में मूल की औपचारिकता सुरक्षित है।
