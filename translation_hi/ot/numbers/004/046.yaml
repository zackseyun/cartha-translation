source:
  edition: WLC
  text: כָּֽל הַ/פְּקֻדִ֡ים אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן וּ/נְשִׂיאֵ֥י יִשְׂרָאֵ֖ל אֶת הַ/לְוִיִּ֑ם לְ/מִשְׁפְּחֹתָ֖/ם וּ/לְ/בֵ֥ית אֲבֹתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/046.yaml
  text: All those counted[a], whom Moses and Aaron and the leaders of Israel counted among the Levites[b], by their clans and by their fathers' houses—
translation:
  language: hi
  text: जितने लेवी गिने गए थे[a]—जिन्हें मूसा, हारून और इस्राएल के प्रधानों ने उनके कुलों और उनके पितृ-परिवारों[b] के अनुसार गिना था—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिनकी संख्या लिखी गई थी” अथवा “जिनका पंजीकरण हुआ था।” इब्रानी में यहाँ פקד क्रिया से निकली जनगणना-संबंधी भाषा है।
    reason: lexical_alternative
  - marker: b
    text: “पितृ-परिवार” से आशय कुलों के भीतर पैतृक वंश पर आधारित घरानों या पारिवारिक विभागों से है।
    reason: cultural_note
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: जितने ... गिने गए थे
  rationale: यह पूरे गिने हुए समूह का सार प्रस्तुत करता है। हिन्दी में यह रचना स्वाभाविक है और इब्रानी के जनगणना-संबंधी निष्क्रिय कृदन्त का भाव रखती है।
- source_word: פָּקַד
  choice: गिना
  rationale: गिनती अथवा जनगणना के इस प्रसंग में यह सरल और सटीक आधुनिक हिन्दी है।
- source_word: וּנְשִׂיאֵי יִשְׂרָאֵל
  choice: इस्राएल के प्रधानों
  rationale: נְשִׂיאִים से गोत्रीय मुखिया या अगुआ अभिप्रेत हैं; ‘प्रधान’ गरिमापूर्ण और स्पष्ट है तथा राजकुमार होने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: אֶת הַלְוִיִּם
  choice: लेवी
  rationale: प्रत्यक्ष कर्म के रूप में गिने गए समुदाय को दर्शाता है; हिन्दी वाक्य में जाति-सूचक ‘लेवी’ स्वाभाविक है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों ... के अनुसार
  rationale: מִשְׁפָּחָה यहाँ वंश-आधारित कुल-समूह को दर्शाता है और ‘के अनुसार’ गणना की संगठनात्मक रीति स्पष्ट करता है।
- source_word: וּלְבֵית אֲבֹתָם
  choice: उनके पितृ-परिवारों के अनुसार
  rationale: यह पैतृक वंश पर आधारित घराने अथवा पारिवारिक विभाग को दर्शाता है; ‘पितृ-परिवार’ स्रोत की सांस्कृतिक संरचना को संक्षेप में सुरक्षित रखता है।
