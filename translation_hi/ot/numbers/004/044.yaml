  text: וַ/יִּהְי֥וּ פְקֻדֵי/הֶ֖ם לְ/מִשְׁפְּחֹתָ֑/ם שְׁלֹ֥שֶׁת אֲלָפִ֖ים וּ/מָאתָֽיִם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/044.yaml
  text: And those counted from them by their clans were three thousand two hundred.
translation:
  language: hi
  text: और उनके कुलों के अनुसार गिने गए लोगों की संख्या तीन हज़ार दो सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: और ... थी
  rationale: वाव-परिणामी के साथ היה कथा और परिणाम की कड़ी को आगे बढ़ाता है। हिंदी में “और ... थी” इस निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: פְקֻדֵיהֶם
  choice: उनके ... गिने गए लोगों की संख्या
  rationale: इस जनगणना-संदर्भ में פקד से बना यह रूप उन लोगों के कुल योग को बताता है जिनकी गणना हुई थी। “लोगों” से आशय स्पष्ट होता है, जबकि पद में अलग से “पुरुष” जोड़ने से बचा गया है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के पारिवारिक-कुल समूह को दर्शाता है। “कुलों के अनुसार” आधुनिक हिंदी में स्वाभाविक है और गणना के वर्गीकरण को बनाए रखता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים וּמָאתָיִם
  choice: तीन हज़ार दो सौ
  rationale: यह संख्या 3,200 का सीधा और आधुनिक हिंदी में प्रचलित रूप है।
