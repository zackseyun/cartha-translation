  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְקוּדֵי
  choice: और ... जिनकी गिनती हुई, वे ये थे
  rationale: यह पद अगले पद में आने वाली आयु-सीमा और गणना के परिणाम की भूमिका है। स्रोत का संज्ञात्मक रूप हिन्दी में स्वाभाविक पूर्ण वाक्यांश के रूप में दिया गया है, जबकि गणना का भाव सुरक्षित रखा गया है।
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: मरारी के वंशजों के कुलों
  rationale: בני यहाँ मरारी से उत्पन्न वंश-समूह को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ जैविक पुत्रों तक अर्थ को सीमित नहीं करता।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों ... के अनुसार
  rationale: לְ का वर्गीकरणात्मक अर्थ ‘के अनुसार’ से व्यक्त किया गया है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: בית אבות वंशगत पैतृक परिवार/घराने की इकाई है; ‘पितृकुल’ इसे संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
