  text: their counted men were eight thousand five hundred and eighty[a].
translation:
  language: hi
  text: उनमें गिने गए पुरुषों की कुल संख्या आठ हज़ार पाँच सौ अस्सी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनमें से गिने गए लोग” अथवा “उनके गिने हुए लोग।” इब्रानी पद जनगणना में दर्ज किए गए लोगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: कुल संख्या ... थी
  rationale: यहाँ היה का रूप जनगणना के अंतिम योग को प्रस्तुत करता है। हिंदी में ‘कुल संख्या ... थी’ इस गणनात्मक अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: פְּקֻדֵיהֶם
  choice: उनमें गिने गए पुरुषों
  rationale: פקד से बना यह पद जनगणना में दर्ज या गिने गए लोगों को दर्शाता है। निकटवर्ती प्रसंग में मिलापवाले तंबू की सेवा के योग्य लेवी पुरुष गिने जा रहे हैं, इसलिए ‘पुरुषों’ वास्तविक संदर्भ को सटीक रखता है।
- source_word: שְׁמֹנַת אֲלָפִים
  choice: आठ हज़ार
  rationale: मूल के मानक संख्यात्मक पद का सीधा और स्वाभाविक हिंदी रूप।
- source_word: וַחֲמֵשׁ מֵאוֹת
  choice: पाँच सौ
  rationale: हज़ारों के बाद जुड़ने वाली संख्या को हिंदी की स्वाभाविक संख्या-रचना में रखा गया है।
- source_word: וּשְׁמֹנִים
  choice: अस्सी
  rationale: योगात्मक संख्या-क्रम का अंतिम घटक; हिंदी में पूरी संख्या ‘आठ हज़ार पाँच सौ अस्सी’ स्वाभाविक है।
theological_decisions:
- issue: जनगणना की लिंग-सूचक शब्दावली
  choice: उनमें गिने गए पुरुषों
  alternative: उनमें गिने गए लोगों / उनके गिने हुओं
  rationale: गिनती 4 के व्यापक प्रसंग में निश्चित आयु-सीमा वाले लेवी पुरुषों को तंबू की सेवा के लिए गिना गया है। ‘पुरुषों’ कहना स्रोत के वास्तविक संदर्भ को बनाए रखता है और उसे अनावश्यक रूप से लिंग-निरपेक्ष नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और जनगणना-संदर्भ के अनुकूल भाषा। ‘कुल संख्या’ मूल के संख्यात्मक निष्कर्ष को स्वाभाविक हिंदी में व्यक्त करती है; ‘हज़ार’ की प्रचलित वर्तनी अपनाई गई है।
