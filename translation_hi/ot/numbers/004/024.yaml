  yaml_path: translation/ot/numbers/004/024.yaml
  text: This is the service of the families of the Gershonites[a], for serving and for carrying.
translation:
  language: hi
  text: गेर्शोनियों के कुलों की सेवा यह है—सेवा करना और बोझ उठाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת
  choice: यह है
  rationale: स्त्रीलिंग एकवचन संकेतवाचक शब्द यहाँ नामवाचक वाक्य का परिचय देता है; हिन्दी में निहित योजक क्रिया को ‘है’ से स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: עֲבֹדַת
  choice: सेवा
  rationale: עֲבֹדָה सेवा, काम या दायित्व को सूचित कर सकता है; लेवीय और पवित्र-स्थान के प्रसंग में ‘सेवा’ व्यापक और उपयुक्त है।
- source_word: מִשְׁפְּחֹת
  choice: कुलों की
  rationale: यह बहुवचन रचना गेर्शोनियों के अंतर्गत पारिवारिक समूहों को दर्शाती है; ‘कुल’ आधुनिक हिन्दी में ‘परिवार’ की अपेक्षा इस वंशगत समूह-अर्थ को अधिक स्पष्ट करता है।
- source_word: הַגֵּרְשֻׁנִּי
  choice: गेर्शोनियों
  rationale: एकवचन रूप सामूहिक जातिवाचक अर्थ रखता है; हिन्दी में वंशज-समुदाय के लिए बहुवचन ‘गेर्शोनी’ स्वाभाविक है।
- source_word: לַעֲבֹד
  choice: सेवा करना
  rationale: लामेद सहित infinitive construct प्रयोजन या कार्य बताता है; ‘सेवा करना’ उसके क्रियात्मक अर्थ को स्पष्ट रखता है।
- source_word: וּלְמַשָּׂא
  choice: और बोझ उठाना
  rationale: מַשָּׂא का अर्थ उठाया या ढोया जाने वाला भार/बोझ है; तम्बू की वस्तुओं के परिवहन के प्रसंग में ‘बोझ उठाना’ अर्थ को बिना अनावश्यक विशिष्टीकरण के व्यक्त करता है।
