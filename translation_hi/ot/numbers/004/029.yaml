  text: As for the sons of Merari[a], you shall count them by their clans[b], by their fathers' houses.
translation:
  language: hi
  text: मरारी के वंशजों[a] की गिनती उनके कुलों और उनके पैतृक घरानों[b] के अनुसार करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘मरारी के पुत्र’। इसका अर्थ ‘मरारी के वंशज’ या ‘मरारीवंशी’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पैतृक घराने’ पिता की वंश-रेखा के अनुसार संगठित पारिवारिक समूहों के लिए प्रयुक्त वंशावली-संबंधी अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי מְרָרִי
  choice: मरारी के वंशजों
  rationale: शाब्दिक अर्थ ‘मरारी के पुत्र’ है, पर जनगणना और वंशावली के इस प्रसंग में यह उनके वंशजों को दर्शाता है। ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: जनजातीय व्यवस्था में מִשְׁפָּחָה निकट संबंध वाले वंश-समूह को दर्शाता है; ‘कुल’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृ-घरों के अनुसार
  rationale: यह इस्राएली वंशावली की मानक अभिव्यक्ति है, जो पिता की ओर से संगठित पारिवारिक समूहों को दर्शाती है। ‘पितृ-घर’ मूल रूपक और सामाजिक संरचना दोनों को बनाए रखता है।
- source_word: תִּפְקֹד
  choice: गिनती करना
  rationale: इस जनगणना-संदर्भ में פקד का अर्थ लोगों की गणना अथवा पंजीकरण करना है। आसपास के निर्देश के अनुरूप हिन्दी में आज्ञार्थक अनंत रूप स्वाभाविक है।
- source_word: אֹתָם
  choice: की गिनती
  rationale: हिब्रू कर्मवाचक सर्वनाम का आशय हिन्दी की संबंधसूचक रचना ‘वंशजों की गिनती’ में स्पष्ट रूप से समाहित है।
