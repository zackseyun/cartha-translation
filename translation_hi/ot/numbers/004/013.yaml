    reason: lexical_alternative
lexical_decisions:
- source_word: וְדִשְּׁנוּ
  choice: राख हटा दें
  rationale: पिएल रूप यहाँ बलिदान के बाद वेदी पर बचे राखयुक्त अवशेष को हटाने का संकेत देता है। यह सामान्य शुद्धिकरण की अपेक्षा वेदी तैयार करने की ठोस क्रिया को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: मिलापवाले तम्बू और बलिदान-संबंधी प्रसंग में מִזְבֵּחַ का मानक और स्पष्ट हिन्दी रूप।
- source_word: וּפָרְשׂוּ
  choice: बिछा दें
  rationale: פרשׂ का अर्थ फैलाना या बिछाना है; किसी वस्तु के ऊपर कपड़ा रखने के प्रसंग में 'बिछा दें' स्वाभाविक है।
- source_word: עָלָיו
  choice: उस पर
  rationale: עַל के सर्वनाम-प्रत्यय का सीधा संकेत वेदी की ओर है और कपड़े से उसे ढकने की क्रिया बताता है।
- source_word: בֶּגֶד
  choice: कपड़ा
  rationale: यद्यपि शब्द का अर्थ वस्त्र भी हो सकता है, यहाँ वह पवित्र साज-सामान को ढकने वाले कपड़े के लिए प्रयुक्त है।
- source_word: אַרְגָּמָן
  choice: बैंजनी
  rationale: यह शब्द बैंजनी रंग से रँगी सामग्री को सूचित करता है; בֶּגֶד के साथ 'बैंजनी कपड़ा' अर्थ को बिना अनावश्यक विशिष्टता के स्पष्ट करता है।
