source:
  edition: WLC
  text: עַל פִּי֩ אַהֲרֹ֨ן וּ/בָנָ֜י/ו תִּהְיֶ֗ה כָּל עֲבֹדַת֙ בְּנֵ֣י הַ/גֵּרְשֻׁנִּ֔י לְ/כָל מַשָּׂאָ֔/ם וּ/לְ/כֹ֖ל עֲבֹדָתָ֑/ם וּ/פְקַדְתֶּ֤ם עֲלֵ/הֶם֙ בְּ/מִשְׁמֶ֔רֶת אֵ֖ת כָּל מַשָּׂאָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/027.yaml
  text: All the service of the sons of the Gershonites shall be at the command of Aaron and his sons[a], for all their loads and for all their service; and you shall assign to them, as a duty[b], all their loads.
translation:
  language: hi
  text: गेर्शोनी वंशजों की सारी सेवा हारून और उसके पुत्रों के आदेश के अनुसार होगी[a]—उनके सभी बोझों और उनकी सारी सेवा के विषय में। तुम उनके सभी बोझ उनके जिम्मे, एक उत्तरदायित्व के रूप में, सौंप देना[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हारून और उसके पुत्रों के मुँह के अनुसार।” इब्रानी मुहावरे का अर्थ उनके वचन या निर्देश के अनुसार है।
    reason: lexical_alternative
  - marker: b
    text: या “उनके प्रभार के रूप में सौंपना।” इब्रानी शब्द किसी को सौंपी गई जिम्मेदारी या दायित्व को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי
  choice: के आदेश के अनुसार
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘के मुँह पर’ है, पर यहाँ यह हारून और उसके पुत्रों के निर्देश अथवा आदेश के अनुसार कार्य करने को दर्शाता है।
- source_word: תִּהְיֶה
  choice: होगी
  rationale: यह भविष्यात्मक विधान प्रशासनिक निर्देश का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל עֲבֹדַת
  choice: सारी सेवा
  rationale: मिलापवाले तम्बू के प्रसंग में עֲבֹדָה नियत सेवा और श्रम दोनों को सूचित करता है; ‘सेवा’ धार्मिक अर्थ को अनावश्यक रूप से संकीर्ण किए बिना दोनों भाव रखती है।
- source_word: בְּנֵי הַגֵּרְשֻׁנִּי
  choice: गेर्शोनी वंशजों
  rationale: शाब्दिक रूप ‘गेर्शोनी के पुत्र’ है, पर सन्दर्भ में गेर्शोन से निकले कुल के सदस्य अभिप्रेत हैं; ‘वंशजों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: לְכָל מַשָּׂאָם וּלְכֹל עֲבֹדָתָם
  choice: उनके सभी बोझों और उनकी सारी सेवा के विषय में
  rationale: לְ यहाँ हारून और उसके पुत्रों के निर्देशन के दायरे को सूचित करता है। ‘के विषय में’ हिन्दी में यह सम्बन्ध स्पष्ट करता और अस्पष्ट ‘के लिए’ से बचता है।
- source_word: מַשָּׂא
  choice: बोझ
  rationale: यहाँ शब्द उन वस्तुओं को दर्शाता है जिन्हें परिवहन में उठाना है। ‘बोझ’ ठोस वहन-सामग्री का अर्थ देता है, यद्यपि हिन्दी में इसका रूपक प्रयोग भी संभव है।
- source_word: וּפְקַדְתֶּם עֲלֵיהֶם
  choice: तुम ... उन्हें ... सौंपना
  rationale: פקד इस रचना में नियुक्त अथवा जिम्मा सौंपने का अर्थ रखता है; इसके बाद आने वाला प्रत्यक्ष कर्म बताता है कि प्रत्येक बोझ की जिम्मेदारी निर्धारित की जानी है।
- source_word: בְּמִשְׁמֶרֶת
  choice: उत्तरदायित्व के रूप में
  rationale: מִשְׁמֶרֶת नियत जिम्मेदारी, प्रभार या दायित्व को दर्शाता है। ‘उत्तरदायित्व के रूप में’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: אֵת כָּל מַשָּׂאָם
  choice: उनके सभी बोझ
  rationale: इब्रानी की पुनरावृत्ति बनाए रखते हुए यह उन सभी वस्तुओं को प्रत्यक्ष कर्म के रूप में रखता है जिन्हें उन्हें उठाना है।
