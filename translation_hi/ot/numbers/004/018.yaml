lexical_decisions:
- source_word: אַל תַּכְרִיתוּ
  choice: नाश न होने देना
  rationale: 'निषेध के साथ हिफ़ील रूप का कारक भाव व्यक्त होता है: संबोधित अगुवे ऐसी स्थिति न आने दें जिससे यह समूह मिट जाए। यह हिंदी में स्वाभाविक है और ‘काट डालना/नाश करना’ के अर्थ-क्षेत्र को संदर्भानुकूल रूप से व्यक्त करता है।'
- source_word: שֵׁבֶט
  choice: गोत्र
  rationale: वंशावली-संबंधी प्रसंग में यह किसी वंशगत जनसमूह को सूचित करता है। ‘गोत्र’ हिंदी बाइबलीय प्रयोग में ‘कुलों’ से बड़े इस समूह को अलग पहचान देता है।
- source_word: מִשְׁפְּחֹת
  choice: कुलों
  rationale: बहुवचन रूप कहाती वंश के घटक पारिवारिक समूहों को दर्शाता है; ‘कुलों’ आधुनिक हिंदी में संक्षिप्त और स्पष्ट है।
- source_word: הַקְּהָתִי
  choice: कहाती
  rationale: एकवचन जातिवाचक विशेषण यहाँ सामूहिक अर्थ रखता है और ‘कहाती कुलों’ में स्वाभाविक रूप से जुड़ता है।
- source_word: מִתּוֹךְ הַלְוִיִּם
  choice: लेवियों के बीच से
  rationale: यह बड़े लेवीय समुदाय के भीतर से अलग किए जाने या मिट जाने का संबंध बनाए रखता है।
theological_decisions:
- issue: कहाती समूह के विषय में निषेध का आशय
  choice: अगुवे ऐसा न होने दें कि कहाती कुलों का गोत्र लेवियों के बीच से नष्ट हो जाए।
  alternative: कहाती कुलों के गोत्र को लेवियों के बीच से काट न डालो।
  rationale: पद स्वयं विनाश की सटीक रीति नहीं बताता। निकटवर्ती संदर्भ पवित्र वस्तुओं के अनुचित संपर्क से मृत्यु के खतरे को स्पष्ट करता है, पर मुख्य पाठ उस व्याख्या को भीतर जोड़े बिना व्यापक निषेध बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘गोत्र’ और ‘कुल’ द्वारा שֵׁבֶט तथा מִשְׁפְּחֹת का स्तरभेद बनाए रखा गया है; निषेध को हिंदी में स्वाभाविक कारक रचना से व्यक्त किया गया है।
