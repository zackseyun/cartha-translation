  text: Do not cut off the tribe of the families of the Kohathites from among the Levites[a].
translation:
  language: hi
  text: लेवियों के बीच से कहातियों के कुलों के गोत्र को काट न डालो।[a]
  philosophy: optimal-equivalence
  footnotes:
