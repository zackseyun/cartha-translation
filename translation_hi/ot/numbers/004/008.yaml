  yaml_path: translation/ot/numbers/004/008.yaml
  text: They shall spread over them a cloth of scarlet yarn, and cover it with a covering of tahash skin, and put its poles in place.
translation:
  language: hi
  text: और वे उनके ऊपर लाल रंग का कपड़ा फैलाएँ, फिर उसे तहश की खाल[a] के आवरण से ढकें और उसके डंडे लगा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: तहश; यह ठीक किस पशु या किस प्रकार की सामग्री को दर्शाता है, निश्चित नहीं है। परंपरागत अनुवादों में बिज्जू की खाल, सूँस की खाल, अथवा सामान्य रूप से बढ़िया चमड़ा जैसे अर्थ मिलते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפָרְשׂוּ עֲלֵיהֶם
  choice: और वे उनके ऊपर ... फैलाएँ
  rationale: क्रिया और बहुवचन संबंधवाचक पद पिछली आयत में बताए गए पात्रों के ऊपर कपड़ा फैलाने की ठोस क्रिया व्यक्त करते हैं।
- source_word: בֶּגֶד תּוֹלַעַת שָׁנִי
  choice: लाल रंग का कपड़ा
  rationale: בגד यहाँ पहनने का वस्त्र नहीं, ढकने वाला कपड़ा है। תולעת שני गहरे लाल/किरमिजी रंग की सामग्री को सूचित करता है; मूल में 'सूत' स्पष्ट न होने के कारण उसे नहीं जोड़ा गया।
- source_word: וְכִסּוּ אֹתוֹ
  choice: फिर उसे ... ढकें
  rationale: एकवचन कर्म-प्रत्यय को 'उसे' से सुरक्षित रखा गया है; इसका संकेत मेज़ की ओर है, जबकि पहले बहुवचन पात्रों का उल्लेख है।
- source_word: בְּמִכְסֵה עוֹר תָּחַשׁ
  choice: तहश की खाल के आवरण से
  rationale: מכסה को 'आवरण' और עור को 'खाल' से व्यक्त किया गया है। תחש की सटीक पहचान अनिश्चित होने के कारण उसका लिप्यंतरण किया गया है।
- source_word: וְשָׂמוּ אֶת בַּדָּיו
  choice: और उसके डंडे लगा दें
  rationale: בדים पवित्र साज-सामान को उठाने के डंडे हैं। 'लगा दें' परिवहन के लिए उन्हें उनके स्थान पर रखने की प्रासंगिक क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
