  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: hi
  text: याहवे[a] ने मूसा और हारून से कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; इसे पारंपरिक रूप से “यहोवा” भी लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया कथात्मक क्रम में परमेश्वर के संबोधन का परिचय देती है। आधुनिक हिन्दी में अगले לֵאמֹר के साथ मिलाकर ‘ने…कहा’ स्वाभाविक और अर्थ-सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: दोनों व्यक्तियों को संबोधित किया गया है। हिन्दी में ‘से’ को दोनों नामों के बाद अलग-अलग दोहराना अनावश्यक है; संयुक्त पद स्रोत का आशय स्पष्ट रखता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह बोलने की क्रिया के बाद आने वाला मानक वचन-परिचायक है। וַיְדַבֵּר के साथ इसे एक स्वाभाविक हिन्दी क्रिया ‘ने…कहा’ में समाहित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम YHWH है। ‘याहवे’ उस नाम का प्रचलित विद्वत्तापूर्ण स्वरूप है और उसे किसी उपाधि से नहीं बदलता; ‘यहोवा’ वैकल्पिक पारंपरिक रूप है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। इब्रानी ‘बोला…कहते हुए’ की पुनरुक्त संरचना को स्वाभाविक हिन्दी ‘ने…कहा’ में व्यक्त किया गया है।
