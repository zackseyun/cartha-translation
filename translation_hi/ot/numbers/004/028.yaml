base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/028.yaml
  text: This is the service of the families of the sons of the Gershonites in the tent of meeting[b][a], and their duty shall be under the hand of Ithamar son of Aaron the priest.
translation:
  language: hi
  text: मिलापवाले तंबू में गेर्शोन के पुत्रों के कुलों की सेवा यही है; और उनका दायित्व[a] हारून याजक के पुत्र ईतामार के अधीन[b] होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका सौंपा हुआ कर्तव्य”; इब्रानी शब्द सौंपे गए दायित्व, रखवाली या कर्तव्य को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “ईतामार के हाथ में”; यह उसके अधिकार या देखरेख में होने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲבֹדַת
  choice: सेवा
  rationale: यहाँ शब्द मिलापवाले तंबू से जुड़ा सौंपा गया कार्य बताता है; ‘सेवा’ धार्मिक संदर्भ को स्वाभाविक रूप से व्यक्त करती है, बिना बाद की कलीसियाई शब्दावली थोपे।
- source_word: מִשְׁפְּחֹת בְּנֵי הַגֵּרְשֻׁנִּי
  choice: गेर्शोनियों के वंशों
  rationale: यह वंशगत समूहों को सूचित करता है। आधुनिक हिन्दी में ‘वंशों’ व्यापक कुल-समूह का भाव देता है और अनावश्यक रूप से शाब्दिक ‘पुत्रों’ से उत्पन्न अस्वाभाविकता से बचता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह स्थापित और सहज हिन्दी पदावली है; ‘में’ सेवा के क्षेत्र को दर्शाता है, केवल भवन के भीतर की भौतिक स्थिति को नहीं।
- source_word: וּמִשְׁמַרְתָּם
  choice: और उनकी जिम्मेदारी
  rationale: מִשְׁמֶרֶת सौंपे गए दायित्व, रखवाली या जिम्मेदारी को व्यक्त कर सकता है। ‘जिम्मेदारी’ वर्तमान हिन्दी में स्पष्ट है और प्रशासनिक संदर्भ के अनुकूल है।
- source_word: בְּיַד
  choice: की देखरेख में
  rationale: शाब्दिक अर्थ ‘के हाथ में’ है, पर यहाँ यह अधिकार और पर्यवेक्षण का मुहावरा है। ‘देखरेख में’ वही आशय स्वाभाविक हिन्दी में देता है।
- source_word: אִיתָמָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के पुत्र ईतामार
  rationale: यह ईतामार की पहचान उसकी याजकीय वंशावली के द्वारा करता है; हिन्दी शब्दक्रम संबंध को स्पष्ट रखता है।
