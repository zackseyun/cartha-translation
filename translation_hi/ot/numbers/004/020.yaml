source:
  edition: WLC
  text: וְ/לֹא יָבֹ֧אוּ לִ/רְא֛וֹת כְּ/בַלַּ֥ע אֶת הַ/קֹּ֖דֶשׁ וָ/מֵֽתוּ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/020.yaml
  text: But they must not go in to look at the holy things for even a moment[a], or they will die.
translation:
  language: hi
  text: पर वे पवित्र वस्तुओं को एक क्षण के लिए भी देखने के लिए भीतर न आएँ[a], नहीं तो वे मर जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्षणभर भी।” इब्रानी अभिव्यक्ति मुहावरेदार है; इसका अर्थ पवित्र वस्तुओं को केवल थोड़ी देर देखना, या उन्हें ढके जाते समय देखना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלֹא
  choice: पर ... न
  rationale: संयोजक और निषेध पिछली व्यवस्था को चेतावनीपूर्ण विरोध के साथ आगे बढ़ाते हैं; हिन्दी में ‘पर ... न’ स्वाभाविक है।
- source_word: יָבֹאוּ
  choice: भीतर न आएँ
  rationale: क्रिया का अर्थ आना/प्रवेश करना है; प्रसंग में यह कहातियों के लिए निषेध है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: यह सरल और स्वाभाविक रूप से दृश्य संपर्क को व्यक्त करता है; ‘निहारने’ से अनावश्यक रूप से देर तक देखने का भाव आ सकता है।
- source_word: כְבַלַּע
  choice: एक क्षण के लिए भी
  rationale: यह कठिन मुहावरेदार पद क्षणभर देखने के अर्थ में समझा जा सकता है, किंतु पवित्र वस्तुओं को ढके जाते समय देखने की संभावना भी बनी रहती है; इसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶת־הַקֹּדֶשׁ
  choice: पवित्र वस्तुओं को
  rationale: एकवचन रूप यहाँ निकटवर्ती प्रसंग की पवित्र साज-सामग्री का सामूहिक उल्लेख करता है।
- source_word: וָמֵתוּ
  choice: नहीं तो वे मर जाएँगे
  rationale: यह निषेध तोड़ने का परिणाम बताता है और आधुनिक हिन्दी में चेतावनी का बल स्पष्ट रखता है।
theological_decisions:
- issue: הַקֹּדֶשׁ का संदर्भ
  choice: पवित्र वस्तुओं का सामूहिक संदर्भ
  alternative: पवित्रस्थान अथवा अमूर्त अर्थ में पवित्र वस्तु
  rationale: गिनती 4 का तत्काल प्रसंग मिलापवाले तंबू की साज-सामग्री को ढकने और उठाने का है, इसलिए सामूहिक ठोस अर्थ सर्वाधिक प्रसंगानुकूल है।
- issue: כְבַלַּע की अस्पष्टता
  choice: एक क्षण के लिए भी
  alternative: जब पवित्र वस्तुएँ ढकी जा रही हों
  rationale: मुहावरे का सटीक आशय विवादित है। मुख्य पाठ सहज क्षणिकता का अर्थ देता है, जबकि आवरण के समय देखने की व्याख्या पादटिप्पणी में रखी गई है ताकि वास्तविक अस्पष्टता न मिटे।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण निषेध और चेतावनी। ‘भीतर न आएँ’ प्रवेश के भाव को, और ‘पवित्र वस्तुएँ’ प्रसंग के सामूहिक संदर्भ को स्पष्ट करता है।
