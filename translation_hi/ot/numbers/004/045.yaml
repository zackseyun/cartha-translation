source:
  edition: WLC
  text: אֵ֣לֶּה פְקוּדֵ֔י מִשְׁפְּחֹ֖ת בְּנֵ֣י מְרָרִ֑י אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/045.yaml
  text: These are the counted men of the families of the sons of Merari[a], whom Moses and Aaron counted according to the mouth of Yahweh[b], by the hand of Moses.
translation:
  language: hi
  text: ये मरारी के पुत्रों के कुलों के गिने हुए पुरुष हैं, जिन्हें मूसा और हारून ने यहवे के आदेश के अनुसार मूसा के द्वारा गिना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה פְקוּדֵי
  choice: ये ... गिने हुए पुरुष थे
  rationale: जनगणना के इस सार-वाक्य में פְקוּדֵי का आशय पंजीकृत/गिने गए पुरुषों से है; हिन्दी में पूर्ण हुई गणना के संदर्भ में ‘थे’ स्वाभाविक है।
- source_word: מִשְׁפְּחֹת בְּנֵי מְרָרִי
  choice: मरारी के पुत्रों के कुलों
  rationale: ‘पुत्रों’ से इब्रानी वंश-संबंध सुरक्षित रहता है, और जनजातीय संदर्भ में מִשְׁפְּחֹת के लिए ‘कुलों’ अधिक उपयुक्त है।
- source_word: פָּקַד
  choice: गिना
  rationale: गिनती/जनगणना के संदर्भ में सरल और सटीक आधुनिक हिन्दी; संज्ञात्मक פְקוּדֵי के साथ अर्थगत संगति रखता है।
- source_word: עַל פִּי יְהוָה
  choice: यहवे के आदेश के अनुसार
  rationale: शाब्दिक रूप ‘यहवे के मुख के अनुसार’ हिन्दी में अस्वाभाविक है; यह स्थापित इब्रानी मुहावरा आज्ञा/आदेश को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: व्यक्तिवाचक दिव्य नाम को उपाधि से प्रतिस्थापित न करके हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ यहाँ माध्यम/प्रतिनिधि के अर्थ वाला मुहावरा है; ‘मूसा के द्वारा’ उसका स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिवाचक नाम है; ‘यहवे’ उसे नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है।
- issue: आदेश और मानवीय माध्यम की दोहरी अभिव्यक्ति
  choice: यहवे के आदेश के अनुसार मूसा के द्वारा
  alternative: यहवे की आज्ञा से, जो मूसा के द्वारा दी गई थी
  rationale: मूल के עַל־פִּי और בְּיַד दोनों वाक्यांश बनाए गए हैं, बिना यह स्पष्ट किए कि आदेश किस प्रकार संप्रेषित हुआ; इससे मूल की संक्षिप्तता और संभावित तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल पर गरिमापूर्ण शैली। अनावश्यक शाब्दिक इब्रानी मुहावरों के स्थान पर उनके स्वाभाविक हिन्दी अर्थ दिए गए हैं; वंश-सूचक ‘पुत्रों’ और दिव्य नाम ‘यहवे’ को सुरक्षित रखा गया है।
