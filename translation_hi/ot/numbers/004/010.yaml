  yaml_path: translation/ot/numbers/004/010.yaml
  text: They shall put it and all its utensils into a covering of fine leather[a], and they shall place it on the carrying frame.
translation:
  language: hi
  text: वे उसे और उसके सभी उपकरणों को तहश की खाल के आवरण[a] में रखेंगे और उसे ढोने के डंडे पर रखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द תַּחַשׁ (तहश) का ठीक अर्थ अनिश्चित है। यह किसी विशेष पशु की खाल या किसी प्रकार के टिकाऊ चमड़े को दर्शा सकता है। परंपरागत अनुवादों में ‘सूँस की खाल’ जैसे अर्थ भी मिलते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ
  choice: रखेंगे
  rationale: निर्देशों के क्रम में संयोजक सहित पूर्ण क्रिया भावी/विधिक कार्य को व्यक्त करती है; हिन्दी में ‘रखेंगे’ स्वाभाविक है।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम पिछले पद की दीपवृक्ष-संज्ञा की ओर संकेत करता है; हिन्दी में ‘उसे’ इस संदर्भ को सहज रूप से बनाए रखता है।
- source_word: כָּל כֵּלֶיהָ
  choice: उसके सभी उपकरणों
  rationale: כֵּלִים यहाँ दीपवृक्ष से संबंधित सामान या साधनों के लिए व्यापक शब्द है; ‘उपकरण’ स्पष्ट और वर्तमान हिन्दी है।
- source_word: אֶל מִכְסֵה
  choice: आवरण में
  rationale: נתן के साथ אֶל वस्तु को आवरण के भीतर रखने का भाव दे सकता है; हिन्दी में ‘आवरण में रखेंगे’ enclosing action को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עוֹר תַּחַשׁ
  choice: उत्तम चमड़े
  rationale: תַּחַשׁ की सटीक पहचान अनिश्चित है। ‘उत्तम चमड़ा’ किसी संदिग्ध पशु की पहचान थोपे बिना सुरक्षात्मक खाल का अर्थ देता है; अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: עַל הַמּוֹט
  choice: उठाने के डंडे पर
  rationale: מוֹט एक डंडे या बार को दर्शाता है जिसका उपयोग भार उठाकर ले जाने में होता है। एकवचन को बनाए रखते हुए ‘उठाने का डंडा’ उसके कार्य को स्पष्ट करता है।
