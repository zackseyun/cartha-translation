  text: זֹ֛את עֲבֹדַ֥ת בְּנֵי קְהָ֖ת בְּ/אֹ֣הֶל מוֹעֵ֑ד קֹ֖דֶשׁ הַ/קֳּדָשִֽׁים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/004.yaml
  text: This is the service of the sons of Kohath in the tent of meeting concerning the most holy things[a].
translation:
  language: hi
  text: 'मिलाप के तंबू में परमपवित्र वस्तुओं के संबंध में कहात के पुत्रों की सेवा यह है[a]:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमपवित्र स्थान” या “पवित्रतम स्थान।” यहाँ यह पद सम्भवतः केवल भीतरी पवित्र कक्ष की ओर नहीं, बल्कि सबसे पवित्र वस्तुओं की ओर संकेत करता है।
    reason: हिब्रू पद קֹדֶשׁ הַקֳּדָשִׁים को परमपवित्र वस्तुओं अथवा परमपवित्र स्थान—दोनों अर्थों में समझा जा सकता है; निकट प्रसंग वस्तुवाचक अर्थ का समर्थन करता है।
lexical_decisions:
- source_word: זֹאת
  choice: यह है
  rationale: स्त्रीलिंग एकवचन संकेतवाचक इस उपवाक्य का परिचय देता है; हिन्दी में निहित संयोजक को ‘है’ से व्यक्त करना स्वाभाविक है।
- source_word: עֲבֹדַת
  choice: सेवा
  rationale: यहाँ शब्द निर्धारित पवित्र कार्य या दायित्व को दर्शाता है; ‘सेवा’ धार्मिक प्रसंग और औपचारिक जिम्मेदारी दोनों को सहज रूप से व्यक्त करता है।
- source_word: בְּנֵי קְהָת
  choice: कहात के पुत्रों
  rationale: हिब्रू के वंश-संबंधी मुहावरे को निकटता से सुरक्षित रखता है और आधुनिक हिन्दी में समझने योग्य है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह אֹהֶל מוֹעֵד का प्रचलित और सहज हिन्दी नाम है; בְ स्थान अथवा कार्यक्षेत्र को ‘में’ से व्यक्त करता है।
- source_word: קֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र वस्तुओं
  rationale: गिनती 4 के निकट प्रसंग में यह पद कहातियों की देखरेख और ढुलाई में आने वाली सर्वाधिक पवित्र वस्तुओं की ओर संकेत करता है; ‘वस्तुओं’ जोड़ना हिन्दी में आशय स्पष्ट करता है, जबकि वैकल्पिक स्थानवाचक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: קֹדֶשׁ הַקֳּדָשִׁים का अभिप्रेत अर्थ
  choice: कहातियों को सौंपी गई परमपवित्र वस्तुएँ
  alternative: परमपवित्र स्थान / महापवित्र स्थान
  rationale: आगे के प्रसंग में पवित्र साज-सामान को ढकने, उठाने और ले जाने के दायित्वों का वर्णन है, इसलिए वस्तुवाचक अर्थ यहाँ अधिक संभावित है; फिर भी हिब्रू पद का स्थानवाचक अर्थ संभव होने के कारण उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठक के लिए सहज शैली। ‘मिलापवाला तंबू’ परिचित बाइबलीय पदावली है। डैश अंतिम पद को सेवा के विषय के रूप में जोड़ता है और उसे सीधे समानाधिकरण मानने से बचाता है।
