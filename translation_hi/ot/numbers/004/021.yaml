  yaml_path: translation/ot/numbers/004/021.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: फिर यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... ने ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है, इसलिए ‘फिर’ उसके क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। דבר यहाँ संबोधित करके बोलने को सूचित करता है; इस परिचयात्मक वाक्य में ‘कहा’ सहज है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। हिन्दी में प्रचलित नामरूप ‘यहोवा’ शीर्षक से उसका प्रतिस्थापन किए बिना नाम को व्यक्त करता है।
- source_word: אֶל
  choice: से
  rationale: किसी व्यक्ति को संबोधित करके बोलने के हिन्दी मुहावरे में ‘मूसा से कहा’ स्वाभाविक समतुल्य है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह इस इब्रानी व्यक्तिगत नाम का मानक हिन्दी रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी कथन-सूत्र का अर्थ अगले वचन का परिचय देना है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता; ‘कहा,’ वही कार्य स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नामरूप है और उसे केवल ‘प्रभु’ जैसे शीर्षक से नहीं बदलता; ‘याहवे’ मूल उच्चारण के अधिक निकट वैकल्पिक लिप्यंतरण के रूप में संभव है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। इब्रानी कथन-सूत्र וַיְדַבֵּר ... לֵאמֹר को हिन्दी के स्वाभाविक ‘फिर ... ने ... से कहा,’ में संक्षिप्त किया गया है; अल्पविराम अगले पद में आने वाले कथन की ओर संकेत करता है।
