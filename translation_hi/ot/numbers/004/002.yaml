  text: נָשֹׂ֗א אֶת רֹאשׁ֙ בְּנֵ֣י קְהָ֔ת מִ/תּ֖וֹךְ בְּנֵ֣י לֵוִ֑י לְ/מִשְׁפְּחֹתָ֖/ם לְ/בֵ֥ית אֲבֹתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/002.yaml
  text: Take a census of the sons of Kohath from among the sons of Levi[a], by their clans, by their fathers’ houses.
translation:
  language: hi
  text: लेवी के वंशजों में से कहात के वंशजों की गिनती[a] उनके कुलों और उनके पितृ-परिवारों के अनुसार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “कहात के वंशजों का सिर उठाओ”; यह एक मुहावरा है जिसका अर्थ गिनती या जनगणना करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשֹׂא אֶת רֹאשׁ
  choice: गिनती करो
  rationale: शाब्दिक अर्थ ‘सिर उठाओ’ है, पर जनगणना और प्रशासनिक संदर्भ में यह मुहावरा लोगों को गिनने का निर्देश देता है। स्वाभाविक आधुनिक हिन्दी में ‘गिनती करो’ वही आशय स्पष्ट करता है।
- source_word: בְּנֵי קְהָת
  choice: कहात के वंशजों
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ पूरे वंश-समूह का उल्लेख है; ‘वंशज’ हिन्दी पाठक को अभिप्रेत सामूहिक अर्थ स्पष्ट रूप से देता है।
- source_word: מִתּוֹךְ בְּנֵי לֵוִי
  choice: लेवी के वंशजों में से
  rationale: מִתּוֹךְ बड़े समूह के भीतर से एक उपसमूह चुने जाने को दर्शाता है। यह हिन्दी प्रयोग उस संबंध को सहजता से व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों ... के अनुसार
  rationale: जनगणना के प्रसंग में מִשְׁפָּחָה वंश-आधारित कुल या गोत्रीय उपसमूह को सूचित करता है; ‘कुल’ संक्षिप्त और गरिमापूर्ण हिन्दी समकक्ष है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृ-परिवारों के अनुसार
  rationale: यह इस्राएली वंश-व्यवस्था की पिता के घराने पर आधारित प्रशासनिक इकाई है। ‘पितृ-परिवार’ उसे केवल सामान्य ‘परिवार’ कहने की अपेक्षा अधिक ठीक रूप से सुरक्षित रखता है।
