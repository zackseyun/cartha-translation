  text: וְ/נָ֨שְׂא֜וּ אֶת יְרִיעֹ֤ת הַ/מִּשְׁכָּן֙ וְ/אֶת אֹ֣הֶל מוֹעֵ֔ד מִכְסֵ֕/הוּ וּ/מִכְסֵ֛ה הַ/תַּ֥חַשׁ אֲשֶׁר עָלָ֖י/ו מִ/לְ/מָ֑עְלָ/ה וְ/אֶ֨ת מָסַ֔ךְ פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/025.yaml
  text: They shall carry the curtains of the tabernacle[a], and the tent of meeting with its covering, and the covering of fine leather that is over it above, and the screen for the entrance of the tent of meeting,
translation:
  language: hi
  text: वे निवासस्थान के परदे, मिलाप का तंबू, उसका आवरण, उसके ऊपर बिछा तहश का आवरण[a], और मिलाप के तंबू के प्रवेश-द्वार का परदा उठाकर ले जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘तहश’ (हिब्रू: תַּחַשׁ) किस पशु या सामग्री को दर्शाता है, यह निश्चित नहीं है। कुछ अनुवाद इसे किसी विशेष पशु की खाल या उत्तम चमड़ा मानते हैं।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָשְׂאוּ
  choice: उठाकर ले जाएँ
  rationale: परिवहन के इस प्रसंग में נָשָׂא का अर्थ सामान को उठाकर ढोना है; यह हिंदी प्रयोग क्रिया के दोनों पहलुओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְרִיעֹת הַמִּשְׁכָּן
  choice: पवित्र निवास के परदे
  rationale: יְרִיעֹת कपड़े के बड़े परदों या पटों को दर्शाता है। מִשְׁכָּן के लिए ‘पवित्र निवास’ उसके उपासना-संबंधी आशय को स्पष्ट करते हुए तंबू से उसका भेद बनाए रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह पद संरचना के रूप में तंबू और उसके नियत मिलन-कार्य, दोनों को सुरक्षित रखता है तथा आधुनिक हिंदी में सहज है।
- source_word: מִכְסֵהוּ
  choice: उसके आवरण
  rationale: प्रत्यय का संबंध मिलाप के तंबू से है। ‘आवरण’ किसी अनिश्चित अतिरिक्त विवरण को जोड़े बिना ढकने वाली परत को व्यक्त करता है।
- source_word: מִכְסֵה הַתַּחַשׁ
  choice: तहश की खाल के आवरण
  rationale: תַּחַשׁ की पहचान अनिश्चित है। उसका लिप्यंतरण किसी विशेष पशु या चमड़े की गुणवत्ता का अनुमान लगाने से बचता है; पादटिप्पणी अनिश्चितता स्पष्ट करती है।
- source_word: אֲשֶׁר עָלָיו מִלְמָעְלָה
  choice: उसके ऊपर बिछे
  rationale: यह हिंदी में स्वाभाविक ढंग से उस आवरण की सबसे ऊपर वाली स्थिति व्यक्त करता है।
- source_word: מָסַךְ פֶּתַח
  choice: प्रवेश-द्वार के परदे
  rationale: מָסָךְ द्वार पर लगे आड़ देने वाले लटकते परदे को दर्शाता है; ‘प्रवेश-द्वार के परदे’ संबंध को सहज हिंदी में व्यक्त करता है।
