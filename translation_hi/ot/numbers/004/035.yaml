  yaml_path: translation/ot/numbers/004/035.yaml
  text: from thirty years old and upward[a], up to fifty years old[b], everyone who comes for service, to do the work in the tent of meeting.
translation:
  language: hi
  text: तीस वर्ष की आयु से लेकर पचास वर्ष की आयु तक, हर वह व्यक्ति जो मिलापवाले तंबू में काम करने के लिए सेवा[a] में आता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘सेवा’ के लिए प्रयुक्त इब्रानी शब्द व्यवस्थित दल या नियत कर्तव्य में की जाने वाली सेवा का भाव भी रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: तीस वर्ष की आयु से लेकर पचास वर्ष की आयु तक
  rationale: यह सहज आधुनिक हिन्दी में आरम्भिक और अंतिम आयु-सीमा दोनों को स्पष्ट करता है; ‘से लेकर…तक’ के भीतर וָמַעְלָה का आशय स्वाभाविक रूप से समाहित है।
- source_word: כָּל הַבָּא
  choice: हर वह व्यक्ति जो … आता है
  rationale: כָּל के समष्टिगत अर्थ और בוא के कृदन्तीय, सामान्य-वर्तमान भाव को बनाए रखता है, बिना गति या प्रवेश का अनावश्यक विस्तार किए।
- source_word: לַצָּבָא
  choice: सेवा में
  rationale: इस लेवीय प्रसंग में צָבָא युद्ध नहीं, बल्कि व्यवस्थित और नियत सेवा-कर्तव्य को सूचित करता है। ‘सेवा में’ हिन्दी में स्वाभाविक है और सैनिक अर्थ थोपने से बचता है।
- source_word: לַעֲבֹדָה
  choice: काम करने के लिए
  rationale: עֲבֹדָה के वास्तविक कार्य या श्रम के अर्थ को व्यक्त करता है और पहले आए ‘सेवा’ से उसका भाषिक भेद बनाए रखता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह पवित्र तंबू के पारंपरिक हिन्दी नाम को बनाए रखते हुए בְּ के कार्य-क्षेत्र वाले अर्थ को स्पष्ट रूप से व्यक्त करता है।
