  text: וְ/נָתְנ֣וּ עָלָ֗י/ו כְּסוּי֙ ע֣וֹר תַּ֔חַשׁ וּ/פָרְשׂ֧וּ בֶֽגֶד כְּלִ֛יל תְּכֵ֖לֶת מִ/לְ/מָ֑עְלָ/ה וְ/שָׂמ֖וּ בַּדָּֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/006.yaml
  text: They shall put over it a covering of fine leather[a], and spread over that a cloth wholly of blue, and they shall put its poles in place.
translation:
  language: hi
  text: फिर वे उसके ऊपर ताहश की खाल[a] का आवरण रखें, और उसके ऊपर पूरी तरह नीले रंग का कपड़ा फैलाएँ; फिर उसके डंडे लगा दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द תַּחַשׁ (ताहश) का अर्थ अनिश्चित है; संभवतः यह किसी विशेष पशु की खाल का नाम था। इसके लिए बकरी, सूँस या डुगोंग जैसे अर्थ भी सुझाए गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: फिर वे उसके ऊपर ... रखें
  rationale: अनुष्ठान-संबंधी क्रमिक निर्देश में संयोजक सहित पूर्ण क्रिया को निर्देशात्मक भाव में प्रस्तुत किया गया है; עַל स्थान की ऊपरी परत को सूचित करता है।
- source_word: כְּסוּי
  choice: आवरण
  rationale: यह संज्ञा ढकने वाली वस्तु को दर्शाती है; आधुनिक हिन्दी में ‘आवरण’ स्वाभाविक और गरिमापूर्ण है।
- source_word: עוֹר תַּחַשׁ
  choice: ताहश की खाल
  rationale: תַּחַשׁ की प्राणी-विशेष के रूप में पहचान अनिश्चित है। किसी अनुमानित प्राणी या ‘उत्तम चमड़े’ जैसे व्याख्यात्मक गुण को मूल पाठ में जोड़ने के बजाय स्रोत शब्द का लिप्यंतरण रखा गया है और पादटिप्पणी में अनिश्चितता बताई गई है।
- source_word: וּפָרְשׂוּ
  choice: फैलाएँ
  rationale: क्रिया किसी कपड़े या आवरण को फैलाने का सामान्य अर्थ देती है और यहाँ निर्देशात्मक भाव उपयुक्त है।
- source_word: בֶגֶד
  choice: कपड़ा
  rationale: यद्यपि शब्द का अर्थ ‘वस्त्र’ भी हो सकता है, इस प्रसंग में उसे संदूक के ऊपर फैलाया जाता है, इसलिए ‘कपड़ा’ कार्य और संदर्भ के अनुरूप है।
- source_word: כְּלִיל תְּכֵלֶת
  choice: पूरी तरह नीले रंग का
  rationale: כְּלִיל संपूर्णता पर बल देता है और תְּכֵלֶת पवित्र-स्थान की सामग्री में प्रयुक्त नीले से नीला-बैंगनी रंग को दर्शाता है; मुख्य पाठ में प्रचलित ‘नीला’ सहज है।
- source_word: מִלְמָעְלָה
  choice: उसके ऊपर
  rationale: शाब्दिक रूप से ‘ऊपर की ओर/ऊपर से’; परतों के इस निर्देश में यह पहले बताए आवरण के ऊपर कपड़ा रखने को बताता है।
- source_word: וְשָׂמוּ בַּדָּיו
  choice: फिर उसके डंडे लगा दें
  rationale: בַּדִּים संदूक उठाने के डंडे हैं। ‘लगा दें’ हिन्दी में उन्हें नियत स्थान पर रखने की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
