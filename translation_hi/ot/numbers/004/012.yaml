source:
  edition: WLC
  text: וְ/לָקְחוּ֩ אֶת כָּל כְּלֵ֨י הַ/שָּׁרֵ֜ת אֲשֶׁ֧ר יְשָֽׁרְתוּ בָ֣/ם בַּ/קֹּ֗דֶשׁ וְ/נָֽתְנוּ֙ אֶל בֶּ֣גֶד תְּכֵ֔לֶת וְ/כִסּ֣וּ אוֹתָ֔/ם בְּ/מִכְסֵ֖ה ע֣וֹר תָּ֑חַשׁ וְ/נָתְנ֖וּ עַל הַ/מּֽוֹט־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/012.yaml
  text: Then they shall take all the utensils of service with which they minister in the sanctuary[a], and put them in a blue cloth, and cover them with a covering of fine leather[b], and place them on the carrying frame.
translation:
  language: hi
  text: फिर वे सेवा के उन सभी उपकरणों को लें जिनसे वे पवित्रस्थान में सेवा करते हैं। वे उन्हें नीले कपड़े में रखें, तहश की खाल[a] के आवरण से ढकें और ढोने के डंडे[b] पर रख दें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द תָּחַשׁ (तहश) का ठीक अर्थ निश्चित नहीं है। यह किसी विशेष पशु की खाल या किसी प्रकार के टिकाऊ चमड़े को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ढोने के ढाँचे पर।” इब्रानी में “डंडा/छड़” एकवचन में है, पर उससे पूरा ढुलाई-साधन भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקְחוּ
  choice: फिर वे…लें
  rationale: यह क्रिया क्रमिक विधि-निर्देश का अगला चरण बताती है; ‘फिर’ क्रम को और विधिलिंग ‘लें’ निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל כְּלֵי הַשָּׁרֵת
  choice: सेवा के उन सभी उपकरणों
  rationale: כְּלִי यहाँ पवित्रस्थान की सेवा में प्रयुक्त विविध वस्तुओं के लिए व्यापक शब्द है; ‘उपकरण’ प्याले जैसे केवल पात्रों तक अर्थ को सीमित नहीं करता।
- source_word: אֲשֶׁר יְשָׁרְתוּ בָם
  choice: जिनसे वे…सेवा करते हैं
  rationale: בָם साधन का बोध कराता है और שרת पवित्र सेवा करने को दर्शाता है; हिन्दी में यह संबंध सीधे और सहज ढंग से व्यक्त होता है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: शाब्दिक अर्थ ‘पवित्र [स्थान] में’ है। प्रसंग में यह पवित्र क्षेत्र को सूचित करता है; इसे सबसे भीतरी कक्ष तक सीमित नहीं किया गया।
- source_word: בֶּגֶד תְּכֵלֶת
  choice: नीले कपड़े
  rationale: בֶּגֶד पैक करने के इस प्रसंग में वस्त्र की अपेक्षा कपड़े को दर्शाता है; תְּכֵלֶת नीले अथवा नील-बैंगनी रंग की सामग्री है, जिसे संक्षेप में ‘नीला’ कहा गया है।
- source_word: מִכְסֵה עוֹר תָּחַשׁ
  choice: तहश की खाल के आवरण
  rationale: תָּחַשׁ की पहचान अनिश्चित है। अनुमानित पशु या चमड़े की गुणवत्ता चुनने के बजाय लिप्यंतरण से मूल की अनिश्चितता सुरक्षित रखी गई है और टिप्पणी में समझाई गई है।
- source_word: וְנָתְנוּ עַל הַמּוֹט
  choice: ढोने के डंडे पर रख दें
  rationale: מוֹט एक डंडा या छड़ है और यहाँ उसका कार्य ढोना है। मूल का एकवचन मुख्य पाठ में सुरक्षित है; सामूहिक ढुलाई-साधन होने की सम्भावना टिप्पणी में दी गई है।
