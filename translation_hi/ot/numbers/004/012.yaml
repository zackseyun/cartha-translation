translation_notes:
  register: आधुनिक, गरिमापूर्ण और निर्देशात्मक हिन्दी अपनाई गई है। ‘पवित्रस्थान’ और ‘सेवा’ जैसे परिचित धार्मिक शब्द रखे गए हैं, पर वाक्यरचना सरल है। अंग्रेज़ी परामर्श-पाठ में टिप्पणियों के संकेत उलटे स्थानों पर दिखते हैं; हिन्दी में [a] को תָּחַשׁ और [b] को הַמּוֹט के साथ सही स्थान पर लगाया गया है।
