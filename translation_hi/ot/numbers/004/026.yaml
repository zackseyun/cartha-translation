base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/026.yaml
  text: and the hangings of the court, and the screen for the entrance of the gate of the court that is around the tabernacle and around the altar, and their ropes, and all the equipment for their service, and all that is to be done with them. And they shall serve.
translation:
  language: hi
  text: और आँगन के परदे, आँगन के फाटक के प्रवेश का पर्दा—उस आँगन का, जो निवास और वेदी के चारों ओर है—उनकी रस्सियाँ,[a] उनकी सेवा के सभी उपकरण और वह सब जो उनके साथ किया जाना है;[b] और वे सेवा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘डोरियाँ’।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह सब जो उनके लिए किया जाना है।’ इब्रानी का अर्थ इन वस्तुओं के साथ किए जाने वाले काम या सेवा के दौरान उनके लिए किए जाने वाले काम—दोनों हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קַלְעֵי
  choice: परदे
  rationale: यह आँगन की घेराबंदी बनाने वाले कपड़े के लटकते परदों को दर्शाता है; आधुनिक हिन्दी में ‘परदे’ स्वाभाविक और स्पष्ट है।
- source_word: חָצֵר
  choice: आँगन
  rationale: मिलापवाले निवास से घिरे बाहरी क्षेत्र के लिए ‘आँगन’ सहज आधुनिक हिन्दी है।
- source_word: מָסַךְ
  choice: पर्दा
  rationale: यह प्रवेश पर लगाए गए वस्त्र के पर्दे को दर्शाता है; ‘पर्दा’ हिन्दी में उसके रूप और कार्य दोनों को स्पष्ट करता है।
- source_word: פֶּתַח שַׁעַר
  choice: फाटक के प्रवेश
  rationale: यह अभिव्यक्ति मूल की दोहरी संरचना को यथासंभव बनाए रखती है और प्रवेश-स्थान को निर्दिष्ट करती है।
- source_word: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב
  choice: उस आँगन का, जो निवास और वेदी के चारों ओर है
  rationale: सापेक्ष उपवाक्य को ‘आँगन’ से जोड़ना स्थानिक अर्थ स्पष्ट करता है; ‘चारों ओर’ סָבִיב का स्वाभाविक अनुवाद है।
- source_word: מֵיתְרֵיהֶם
  choice: उनकी रस्सियाँ
  rationale: आँगन के परदों और प्रवेश-पर्दे से जुड़ी बाँधने वाली डोरियों के लिए ‘रस्सियाँ’ सामान्य पाठक को तुरंत समझ आती है।
- source_word: כְּלֵי עֲבֹדָתָם
  choice: उनकी सेवा के सभी उपकरण
  rationale: כְּלֵי का व्यापक अर्थ ‘उपकरण’ से और עֲבֹדָה का सेवाकार्य-संबंधी अर्थ ‘सेवा’ से सुरक्षित रहता है।
- source_word: כָּל אֲשֶׁר יֵעָשֶׂה לָהֶם
  choice: वह सब जो उनके साथ किया जाना है
  rationale: लָהֶם की अस्पष्टता के बीच प्रसंगानुसार वस्तुओं के उपयोग या संभाल से जुड़े काम का अर्थ मुख्य पाठ में रखा गया है; ‘उनके लिए’ की संभावना पादटिप्पणी में दी गई है।
- source_word: וְעָבָדוּ
  choice: इन सबकी वे सेवा करें
  rationale: עבד के सेवाकार्य-संबंधी भाव को बनाए रखते हुए हिन्दी में सूचीबद्ध वस्तुओं के संबंध में कर्तव्य को स्पष्ट और स्वाभाविक बनाया गया है।
