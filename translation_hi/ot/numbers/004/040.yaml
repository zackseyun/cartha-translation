    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: उनकी संख्या ... थी
  rationale: जनगणना-सूत्र में היה कुल संख्या बताने वाला संयोजक/परिणामसूचक क्रिया-रूप है; हिंदी में यह संरचना स्वाभाविक है।
- source_word: פְּקֻדֵיהֶם
  choice: उनमें से जो गिने गए थे
  rationale: פקד का यह रूप जनगणना में दर्ज और गिने गए लोगों को सूचित करता है; यह अनुवाद मूल के समूह-संबंध को बनाए रखता है और इस पद में अलग से ‘पुरुष’ नहीं जोड़ता।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनकी कुल-शाखाओं के अनुसार
  rationale: מִשְׁפָּחָה यहाँ व्यापक पितृ-परिवार के भीतर की वंशगत इकाई है; ‘कुल-शाखा’ इसे अगले पदबंध ‘पितृ-परिवार’ से अलग रखते हुए स्पष्ट करती है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृ-परिवारों के अनुसार
  rationale: यह इस्राएली वंशावली और जनगणना का पारिभाषिक पदबंध है; ‘पितृ-परिवार’ अर्थ को आधुनिक, संक्षिप्त और गरिमापूर्ण हिंदी में व्यक्त करता है।
- source_word: אַלְפַּיִם וְשֵׁשׁ מֵאוֹת וּשְׁלֹשִׁים
  choice: दो हज़ार छह सौ तीस
  rationale: मूल संख्या का मानक आधुनिक हिंदी रूप।
