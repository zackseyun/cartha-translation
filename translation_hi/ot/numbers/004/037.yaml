source:
  edition: WLC
  text: אֵ֤לֶּה פְקוּדֵי֙ מִשְׁפְּחֹ֣ת הַ/קְּהָתִ֔י כָּל הָ/עֹבֵ֖ד בְּ/אֹ֣הֶל מוֹעֵ֑ד אֲשֶׁ֨ר פָּקַ֤ד מֹשֶׁה֙ וְ/אַהֲרֹ֔ן עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/037.yaml
  text: These were the counted men of the families of the Kohathites, everyone serving in the tent of meeting, whom Moses and Aaron counted at the command of Yahweh by the hand of Moses.
translation:
  language: hi
  text: कहातियों के कुलों में से गिने गए ये लोग थे—वे सभी जो मिलाप के तंबू में सेवा करते थे और जिनकी गिनती मूसा और हारून ने याहवे की आज्ञा के अनुसार, मूसा के हाथ से[a] की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मूसा के द्वारा।”
    reason: इब्रानी मुहावरे בְּיַד מֹשֶׁה का अधिक स्वाभाविक हिन्दी विकल्प; इसका अर्थ मूसा के माध्यम या द्वारा है।
lexical_decisions:
- source_word: פְקוּדֵי
  choice: गिने गए लोग
  rationale: यहाँ פקד जनगणना अथवा सेवा के लिए गिनती के संदर्भ में है। ‘गिने गए लोग’ परिणामस्वरूप गिने हुए व्यक्तियों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁפְּחֹת הַקְּהָתִי
  choice: कहाती कुलों
  rationale: מִשְׁפְּחֹת विस्तृत पारिवारिक समूहों अथवा कुलों को दर्शाता है; ‘कहाती’ कहात के वंशजों का सामूहिक विशेषण है।
- source_word: כָּל הָעֹבֵד
  choice: वे सभी जो ... सेवा करते थे
  rationale: सहभागी रूप עֹבֵד सेवा में लगे प्रत्येक व्यक्ति को दर्शाता है। प्रसंग की भूतकालीन जनगणना के अनुरूप यह हिन्दी में सहज है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह पवित्र तंबू के लिए प्रचलित और समझने योग्य हिन्दी पद है; בְּ को ‘में’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר פָּקַד
  choice: जिन्हें ... गिना था
  rationale: इस प्रसंग में פקד का अर्थ नियुक्त करना नहीं, बल्कि जनगणना में गिनना है।
- source_word: עַל פִּי יְהוָה
  choice: याहवे की आज्ञा के अनुसार
  rationale: शाब्दिक ‘याहवे के मुख के अनुसार’ एक इब्रानी मुहावरा है जिसका स्वाभाविक अर्थ उसकी आज्ञा के अनुसार है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के हाथ से
  rationale: यह अभिकरण अथवा मध्यस्थता का मुहावरा है। मुख्य पाठ इब्रानी की औपचारिक अभिव्यक्ति को बनाए रखता है और अधिक स्वाभाविक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּיַד מֹשֶׁה में मूसा की मध्यस्थ भूमिका
  choice: मूसा के हाथ से
  alternative: मूसा के द्वारा
  rationale: मुख्य पाठ मूल मुहावरे और उसकी औपचारिकता को सुरक्षित रखता है। इसका आशय अभिकरण या मध्यस्थता है, न कि अनिवार्यतः मूसा के शारीरिक हाथ से कोई क्रिया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। ‘मिलापवाला तंबू’ और ‘कुल’ बाइबलीय संदर्भ में परिचित हैं। वाक्य की सूची-सदृश संरचना को डैश से स्पष्ट किया गया है, जबकि ‘मूसा के हाथ से’ मूल की औपचारिक अभिव्यक्ति को बनाए रखता है।
