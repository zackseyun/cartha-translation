base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/034.yaml
  text: So Moses and Aaron and the leaders of the congregation counted the sons of the Kohathites by their clans and by their fathers’ houses[a][b][c].
translation:
  language: hi
  text: इस प्रकार मूसा, हारून और समुदाय के प्रधानों ने कहातियों के वंशजों[a] की गिनती[b] उनके कुलों और उनके पितृ-परिवारों[c] के अनुसार की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “कहाती के पुत्र,” अर्थात् कहात से उत्पन्न वंश-समूह।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी संख्या ली” अथवा “उनकी जनगणना की।” इब्रानी क्रिया का अर्थ दूसरे प्रसंगों में “नियुक्त करना” भी हो सकता है, पर यहाँ आशय सेवा के लिए गिनती करने से है।
    reason: lexical_alternative
  - marker: c
    text: “पितृ-परिवार” इस्राएल में पूर्वजों पर आधारित परिवारों या पारिवारिक विभागों के लिए प्रयुक्त पारंपरिक वंश-संबंधी पद है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: गिनती की
  rationale: गिनती और सेवा के लिए नाम लिखे जाने के इस प्रसंग में פקד का अर्थ लोगों को नियुक्त करना नहीं, बल्कि उनकी संख्या लेना है।
- source_word: נְשִׂיאֵי הָעֵדָה
  choice: समुदाय के प्रधानों
  rationale: נשיאים समुदाय के मान्य अगुए या मुखिया हैं; 'प्रधान' आधुनिक और गरिमापूर्ण हिन्दी में उनकी आधिकारिक भूमिका व्यक्त करता है, जबकि עֵדָה के लिए 'समुदाय' इस प्रसंग में स्वाभाविक है।
- source_word: בְּנֵי הַקְּהָתִי
  choice: कहातियों के वंशजों
  rationale: शाब्दिक इब्रानी अभिव्यक्ति 'कहाती के पुत्र' वंश-समूह को सूचित करती है। 'कहातियों के वंशज' उसका आशय स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों ... के अनुसार
  rationale: जनगणना और वंशावली के संदर्भ में מִשְׁפָּחָה एक गोत्र के भीतर के कुल को दर्शाता है; לְ का वर्गीकरणार्थक भाव 'के अनुसार' से व्यक्त होता है।
- source_word: וּלְבֵית אֲבֹתָם
  choice: और उनके पितृ-परिवारों के अनुसार
  rationale: בֵית אָבוֹת इस्राएली समाज की पैतृक वंश-आधारित पारिवारिक इकाई का पारिभाषिक पद है। 'पितृ-परिवार' उस संरचना को केवल 'परिवार' कहकर सपाट किए बिना समझने योग्य बनाता है।
