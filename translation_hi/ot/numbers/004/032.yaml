review_pass:
  verdict: revise
  source_fidelity: The inventory of the court pillars, bases, pegs, cords, equipment, and service is substantially faithful. The final Hebrew clause concerns designation by name of the articles/items comprising their assigned charge/load. The draft conveys this generally, but its Hindi construction is opaque and does not naturally express the act of designation.
  naturalness: “उनके ढोने के दायित्व की वस्तुएँ तुम नाम लेकर सौंपना” is grammatically strained in modern standard Hindi. A more idiomatic formulation can retain the compactness of the Hebrew without supplying a specific individual.
  terminology: “खम्भे,” “आधार,” “खूँटियाँ,” and “रस्सियाँ” are suitable. “उपकरण” appropriately renders the broad sense of כְּלִים. “सारा काम” is acceptable for עֲבֹדָה, though “सेवा-कार्य” better retains the assigned-service nuance in this context.
  issues:
  - severity: medium
    issue: The final command is awkward and semantically imprecise in Hindi.
    rationale: The Hebrew says to designate/assign by name the articles of their charge/load. In the draft, “दायित्व की वस्तुएँ ... सौंपना” leaves unclear what is being assigned and to whom, while “तुम ... सौंपना” is not idiomatic as a direct command.
  - severity: low
    issue: “उनसे सम्बन्धित सारा काम” weakens the formal assigned-service sense of עֲבֹדָתָם.
    rationale: “उनका सारा सेवा-कार्य” is natural Hindi and more closely reflects the verse's reference to the Levites' assigned work without adding interpretation.
