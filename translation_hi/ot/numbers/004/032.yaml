base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/032.yaml
  text: and the pillars of the surrounding court[a], with their bases, their pegs, and their cords, with all their equipment and with all their service; and you shall assign by name the items of the duty of their burden.
translation:
  language: hi
  text: और आँगन के चारों ओर के खम्भे, उनके आधार, उनकी खूँटियाँ और उनकी रस्सियाँ, उनके सभी उपकरण और उनका सारा सेवा-कार्य; और तुम नाम लेकर उन वस्तुओं को निर्दिष्ट करना जिनकी जिम्मेदारी उन्हें ढोने की है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक निकट रूप में: “तुम उनके भार की जिम्मेदारी की वस्तुएँ नाम लेकर नियुक्त करना।”'
    reason: मूल इब्रानी का अन्तिम पदबंध अत्यन्त सघन है। मुख्य पाठ में “निर्दिष्ट करना” इब्रानी क्रिया के नाम लेकर व्यक्तिगत रूप से नियत करने के भाव को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक रूप पदबंध की संरचना के अधिक निकट है।
lexical_decisions:
- source_word: עַמּוּדֵי הֶחָצֵר סָבִיב
  choice: आँगन के चारों ओर के खम्भे
  rationale: עַמּוּדֵי संरचनात्मक खम्भों को, הֶחָצֵר आँगन को और סָבִיב चारों ओर उनकी स्थिति को दर्शाता है। यह हिन्दी में स्वाभाविक रहते हुए स्थान-सम्बन्ध स्पष्ट करता है।
- source_word: אַדְנֵיהֶם
  choice: उनके आधार
  rationale: मिलापवाले तम्बू के सन्दर्भ में אֶדֶן खम्भे को थामने वाले आधार या खाने को दर्शाता है। ‘आधार’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: יְתֵדֹתָם
  choice: उनकी खूँटियाँ
  rationale: יָתֵד तम्बू या घेरे को बाँधने के लिए भूमि में गाड़ी जाने वाली खूँटी है; रस्सियों के साथ ‘खूँटियाँ’ स्वाभाविक तकनीकी अर्थ देता है।
- source_word: מֵיתְרֵיהֶם
  choice: उनकी रस्सियाँ
  rationale: מֵיתָר तम्बू को बाँधने वाली डोरी या रस्सी है। आधुनिक हिन्दी में ‘रस्सियाँ’ अधिक सहज और स्पष्ट है।
- source_word: לְכָל כְּלֵיהֶם
  choice: उनके सभी उपकरण
  rationale: כְּלִים यहाँ पात्रों तक सीमित नहीं, बल्कि उनसे जुड़े विविध सामान और उपकरणों का व्यापक बोध देता है।
- source_word: וּלְכֹל עֲבֹדָתָם
  choice: और उनसे सम्बन्धित सारा काम
  rationale: עֲבֹדָה सेवा, काम या नियुक्त कर्तव्य को व्यक्त कर सकता है। इस सूची में ‘सम्बन्धित सारा काम’ व्यावहारिक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: וּבְשֵׁמֹת תִּפְקְדוּ
  choice: तुम नाम लेकर सौंपना
  rationale: פקד और בְשֵׁמֹת मिलकर व्यक्तियों के नाम के अनुसार जिम्मेदारी निर्धारित करने का भाव देते हैं; यह केवल गिनती करने का संकेत नहीं है।
- source_word: כְּלֵי מִשְׁמֶרֶת מַשָּׂאָם
  choice: उनके ढोने के दायित्व की वस्तुएँ
  rationale: इस सघन पदबंध में כְּלֵי वस्तुओं, מִשְׁמֶרֶת सौंपे गए दायित्व और מַשָּׂא ढोए जाने वाले भार को जोड़ता है। मुख्य पाठ उसकी संरचना और अस्पष्टता को यथासम्भव बनाए रखता है।
