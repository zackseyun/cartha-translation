  choice: हारून याजक के पुत्र ईतामार
  rationale: पदक्रम को स्वाभाविक हिन्दी में रखते हुए ईतामार की वंशगत पहचान और हारून की याजकीय उपाधि सुरक्षित रखी गई है।
