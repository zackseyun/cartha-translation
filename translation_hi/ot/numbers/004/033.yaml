  text: This is the service of the clans of the sons of Merari for all their service in the tent of meeting[a], under the direction of Ithamar son of Aaron the priest.
translation:
  language: hi
  text: यह मिलाप के तंबू में उनकी सारी सेवा के लिए मरारी के पुत्रों के कुलों की सेवा है, हारून याजक के पुत्र ईतामार के निर्देशन में।[a]
  philosophy: optimal-equivalence
  footnotes:
