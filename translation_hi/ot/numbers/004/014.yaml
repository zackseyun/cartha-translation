  text: וְ/נָתְנ֣וּ עָ֠לָי/ו אֶֽת כָּל כֵּלָ֞י/ו אֲשֶׁ֣ר יְֽשָׁרְת֧וּ עָלָ֣י/ו בָּ/הֶ֗ם אֶת הַ/מַּחְתֹּ֤ת אֶת הַ/מִּזְלָגֹת֙ וְ/אֶת הַ/יָּעִ֣ים וְ/אֶת הַ/מִּזְרָקֹ֔ת כֹּ֖ל כְּלֵ֣י הַ/מִּזְבֵּ֑חַ וּ/פָרְשׂ֣וּ עָלָ֗י/ו כְּס֛וּי ע֥וֹר תַּ֖חַשׁ וְ/שָׂמ֥וּ בַדָּֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/014.yaml
  text: 'Then they shall place on it all its utensils with which they minister at it: the fire pans[a], the forks, the shovels, and the basins—all the utensils of the altar. Then they shall spread over it a covering of fine leather and put its poles in place.'
translation:
  language: hi
  text: फिर वे उस पर उसके सभी उपकरण रखेंगे, जिनसे वे उस पर सेवा करते हैं—अंगारदान, काँटे, फावड़े और कटोरे—वेदी के सभी उपकरण। फिर वे उसके ऊपर तहश की खाल[a] का आवरण फैलाएँगे और उसके डंडे लगा देंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तहश की खाल” का अर्थ अनिश्चित है। इसके लिए बकरी की खाल, समुद्री जीव की खाल, या सामान्य रूप से टिकाऊ बढ़िया चमड़ा भी प्रस्तावित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתְנוּ עָלָיו
  choice: फिर वे उस पर ... रखेंगे
  rationale: क्रमिक विधि-विधान में וְנָתְנוּ का स्वाभाविक आधुनिक हिन्दी रूप; עָלָיו का संदर्भ वेदी से है।
- source_word: כָּל כֵּלָיו
  choice: उसके वे सब उपकरण
  rationale: כְּלִי यहाँ वेदी की सेवा में प्रयुक्त विविध वस्तुओं के लिए व्यापक शब्द है; ‘उपकरण’ स्पष्ट और समकालीन है।
- source_word: אֲשֶׁר יְשָׁרְתוּ עָלָיו בָּהֶם
  choice: जिनसे वे उस पर सेवा करते हैं
  rationale: שרת की पवित्र-सेवा संबंधी छाया को ‘सेवा करते हैं’ बनाए रखता है और עָלָיו की स्थानगत अभिव्यक्ति को अनावश्यक रूप से नहीं बदलता।
- source_word: הַמַּחְתֹּת
  choice: अंगारदान
  rationale: मूल शब्द अंगारे या आग उठाने-रखने के पात्र को दर्शाता है; ‘अंगारदान’ धूपदान से अधिक सटीक है।
- source_word: הַמִּזְלָגֹת
  choice: काँटे
  rationale: काँटे जैसे वेदी-उपकरण का सरल और प्रत्यक्ष आधुनिक हिन्दी रूप।
- source_word: הַיָּעִים
  choice: फावड़े
  rationale: राख हटाने या सामग्री उठाने के उपकरण के लिए प्रचलित और स्पष्ट शब्द।
- source_word: הַמִּזְרָקֹת
  choice: कटोरे
  rationale: מִזְרָק अनुष्ठानिक द्रव या रक्त रखने/छिड़कने का पात्र है; ‘कटोरे’ सामान्य पाठक के लिए सहज है, यद्यपि ‘पात्र’ भी संभव है।
- source_word: כֹּל כְּלֵי הַמִּזְבֵּחַ
  choice: वेदी के सभी उपकरण
  rationale: सूची का सार प्रस्तुत करने वाले मूल वाक्यांश को पहले प्रयुक्त ‘उपकरण’ के साथ संगत रखा गया है।
- source_word: וּפָרְשׂוּ עָלָיו כְּסוּי
  choice: फिर वे उसके ऊपर ... का आवरण फैलाएँगे
  rationale: פרשׂ के ‘फैलाने’ के ठोस अर्थ और כְּסוּי संज्ञा दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: עוֹר תַּחַשׁ
  choice: तहश की खाल
  rationale: תַּחַשׁ की प्राणी-पहचान अनिश्चित है। लिप्यंतरण मूल की अनिश्चितता को पाठ में सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וְשָׂמוּ בַדָּיו
  choice: और उसके डंडे लगा देंगे
  rationale: בדיו वेदी को उठाने के डंडे हैं; ‘लगा देंगे’ उन्हें निर्धारित स्थान पर रखने का स्वाभाविक हिन्दी रूप है।
