base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/015.yaml
  text: When Aaron and his sons have finished covering the sanctuary and all the furnishings of the sanctuary[a], when the camp sets out, after that the sons of Kohath shall come to carry them; but they shall not touch the holy things, lest they die[c][b]. These are the burden of the sons of Kohath in the tent of meeting.
translation:
  language: hi
  text: हारून और उसके पुत्र पवित्रस्थान और उसकी सारी साज-सामग्री को ढकने का काम पूरा कर लें। छावनी के कूच करने के समय, उसके बाद कहात के पुत्र[a] उन्हें उठाने के लिए आएँ। पर वे पवित्र वस्तुओं[b] को न छुएँ, नहीं तो वे मर जाएँगे[c]। मिलापवाले तंबू के संबंध में यही कहात के पुत्रों का भार है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कहाती।’ शाब्दिक रूप से ‘कहात के पुत्र।’
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्रस्थान को।’ इब्रानी में ‘पवित्र’ शब्द पवित्र वस्तुओं के सामूहिक अर्थ में या अधिक व्यापक रूप से पवित्रस्थान के लिए समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: या ‘और वे मर जाएँगे।’ इब्रानी शब्दावली परिणाम को सीधे व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה
  choice: ढकने का काम पूरा करें
  rationale: क्रिया कार्य की पूर्णता बताती है। काल-सूचक प्रसंग में हिंदी का यह रूप क्रमबद्ध निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: पहली बार यह शब्द उस पवित्र क्षेत्र या समष्टि के लिए है जिसकी सामग्री यात्रा से पहले ढकी जाती है; ‘पवित्रस्थान’ हिंदी में उपासना-संबंधी अर्थ स्पष्ट रखता है।
- source_word: כָּל כְּלֵי הַקֹּדֶשׁ
  choice: उसकी सारी साज-सामग्री
  rationale: כְּלֵי में पात्र, उपकरण और अन्य सामान सम्मिलित हैं। ‘साज-सामग्री’ इस सामूहिक अर्थ को सामान्य आधुनिक हिंदी में व्यक्त करती है।
- source_word: בִּנְסֹעַ הַמַּחֲנֶה
  choice: जब छावनी कूच करने लगे
  rationale: यह समय बताने वाली रचना है। ‘कूच करना’ छावनी के अपने स्थान से यात्रा के लिए निकलने का स्वाभाविक और सटीक वर्णन है।
- source_word: בְנֵי קְהָת
  choice: कहात के पुत्र
  rationale: मूल का वंश-सूचक शाब्दिक रूप सुरक्षित रखा गया है; वैकल्पिक जाति-सूचक रूप फुटनोट में दिया गया है।
- source_word: לָשֵׂאת
  choice: उन्हें उठाने के लिए
  rationale: संदर्भ में ढकी हुई पवित्र वस्तुओं को परिवहन के लिए उठाना अभिप्रेत है; सर्वनाम पूर्वोक्त सामग्री से स्पष्ट है।
- source_word: וְלֹא יִגְּעוּ אֶל הַקֹּדֶשׁ
  choice: पर वे पवित्र वस्तुओं को न छुएँ
  rationale: निकट संदर्भ ढकी हुई पवित्र सामग्री का है, इसलिए यहाँ הַקֹּדֶשׁ को ठोस सामूहिक अर्थ में लिया गया है; व्यापक ‘पवित्रस्थान’ अर्थ फुटनोट में सुरक्षित है।
- source_word: וָמֵתוּ
  choice: नहीं तो वे मर जाएँगे
  rationale: मूल परिणाम को सीधे जोड़ता है। हिंदी में ‘नहीं तो’ निषेध के घातक परिणाम को स्पष्ट करता है, बिना उसे केवल संभाव्यता में बदलने के।
- source_word: אֵלֶּה מַשָּׂא בְנֵי קְהָת
  choice: कहात के पुत्रों को इन्हीं वस्तुओं का भार उठाना है
  rationale: מַשָּׂא में उठाए जाने वाले भार और सौंपे गए वहन-कार्य दोनों का भाव है। यह रूप मूल के ठोस भार तथा दायित्व, दोनों को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: בְּ का क्षेत्रगत/स्थानगत संबंध रखा गया है। ‘मिलापवाला तंबू’ हिंदी बाइबलीय प्रयोग में परिचित और अर्थपूर्ण पद है।
theological_decisions:
- issue: निषेध-वाक्य में הַקֹּדֶשׁ का संदर्भ
  choice: पवित्र वस्तुएँ
  alternative: पवित्रस्थान
  rationale: तत्काल प्रसंग ढकी हुई पवित्र सामग्री को उठाने का है, इसलिए निषेध को उन वस्तुओं के सीधे स्पर्श से जोड़ना सबसे संभावित है। फिर भी इब्रानी शब्द व्यापक रूप से पवित्रस्थान को भी सूचित कर सकता है, अतः विकल्प फुटनोट में रखा गया है।
- issue: וָמֵתוּ में परिणाम और चेतावनी का संबंध
  choice: नहीं तो वे मर जाएँगे
  alternative: और वे मर जाएँगे
  rationale: मूल इब्रानी परिणाम को ‘और वे मरेंगे’ के रूप में सीधे कहता है। हिंदी में ‘नहीं तो’ उसका चेतावनी-बल स्वाभाविक रूप से प्रकट करता है; अधिक शाब्दिक विकल्प फुटनोट में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पवित्रस्थान,’ ‘छावनी,’ ‘कूच’ और ‘मिलापवाला तंबू’ जैसे परिचित बाइबलीय पद बनाए गए हैं, जबकि वाक्य-क्रम को हिंदी की स्वाभाविक प्रवाहशीलता के अनुसार व्यवस्थित किया गया है। सभी वैकल्पिक अर्थ वहीं फुटनोट किए गए हैं जहाँ मूल इब्रानी वास्तविक अस्पष्टता रखता है।
