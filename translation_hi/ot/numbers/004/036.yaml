  yaml_path: translation/ot/numbers/004/036.yaml
  text: And those counted from them by their clans were two thousand seven hundred and fifty.
translation:
  language: hi
  text: और उनके कुलों के अनुसार गिने गए लोगों की संख्या दो हज़ार सात सौ पचास थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: और ... थी
  rationale: वाव-क्रम कथा के परिणाम को आगे बढ़ाता है; हिन्दी में ‘और ... थी’ स्वाभाविक रूप से साधारण अस्तित्व/संख्या का भाव रखता है।
- source_word: פְקֻדֵיהֶם
  choice: उनके ... गिने गए लोगों की संख्या
  rationale: जनगणना के प्रसंग में यह पद दर्ज या गिने गए व्यक्तियों को दर्शाता है। ‘लोगों’ से आशय स्पष्ट होता है, जबकि पद में निहित गणना का भाव सुरक्षित रहता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה इस्राएली सामाजिक संरचना में विस्तृत परिवार या कुल को दर्शाता है; ‘कुलों के अनुसार’ जनगणना की वर्गीकरण-पद्धति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַלְפַּיִם שְׁבַע מֵאוֹת וַחֲמִשִּׁים
  choice: दो हज़ार सात सौ पचास
  rationale: मूल इब्रानी की सटीक संख्या को मानक हिन्दी शब्दों में प्रस्तुत किया गया है।
