  text: Then they shall take a blue cloth and cover the lampstand for the light[a], along with its lamps, its tongs, its firepans, and all its oil vessels with which they minister to it.
translation:
  language: hi
  text: फिर वे नीले रंग का एक कपड़ा[a] लेकर प्रकाश देनेवाली दीवट को ढकें—उसके दीपकों, चिमटों, अग्निपात्रों और तेल के उन सभी पात्रों समेत, जिनसे वे उसकी सेवा करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नीले-बैंगनी रंग का एक कपड़ा।’ इब्रानी תְּכֵלֶת उस विशिष्ट रंगे हुए कपड़े को दर्शाता है जिसका उपयोग पवित्र तंबू की वस्तुओं में होता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד תְּכֵלֶת
  choice: नीले रंग का एक कपड़ा
  rationale: בֶּגֶד यहाँ पहनने के वस्त्र के बजाय पवित्र-सामग्री को ढकने वाला कपड़ा है। תְּכֵלֶת पवित्रस्थान के वस्त्रों में प्रयुक्त विशिष्ट नीले अथवा नीले-बैंगनी रंग को सूचित करता है; मुख्य पाठ में सहज ‘नीले रंग का’ रखा गया है और रंग की अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: מְנֹרַת הַמָּאוֹר
  choice: प्रकाश देनेवाली दीवट
  rationale: מְנוֹרָה के लिए प्रचलित और संक्षिप्त ‘दीवट’ चुना गया है। הַמָּאוֹר का संबंध प्रकाश/प्रकाशन से है; ‘प्रकाश देनेवाली’ संबंधवाचक पदबंध के कार्यात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֵרֹתֶיהָ
  choice: उसके दीपकों
  rationale: נֵרֹתֶיהָ दीवट पर लगे अलग-अलग दीपकों को सूचित करता है; ‘दीपक’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מַלְקָחֶיהָ
  choice: चिमटों
  rationale: यह दीपकों की बत्तियाँ अथवा ज्वाला सँभालने के उपकरणों का नाम है। ‘चिमटे’ व्यापक अर्थ को बनाए रखता है और अनिश्चित कार्य को अत्यधिक विशिष्ट नहीं बनाता।
- source_word: מַחְתֹּתֶיהָ
  choice: अग्निपात्रों
  rationale: מַחְתָּה आग, अंगारों अथवा राख से संबंधित पात्र हो सकता है। दीपक-संदर्भ में ‘अग्निपात्र’ ‘धूपदान’ की अपेक्षा कम भ्रामक है और मूल शब्द की अर्थ-सीमा को बनाए रखता है।
- source_word: כָּל כְּלֵי שַׁמְנָהּ
  choice: तेल के उन सभी पात्रों
  rationale: כְּלִים पात्रों या उपकरणों को और שַׁמְנָהּ दीवट से संबंधित तेल को सूचित करता है। ‘तेल के सभी पात्र’ संक्षिप्त और स्पष्ट है।
- source_word: אֲשֶׁר יְשָׁרְתוּ לָהּ בָּהֶם
  choice: जिनसे वे उसकी सेवा करते हैं
  rationale: בָּהֶם का बहुवचन उपकरणों/पात्रों को साधन के रूप में दर्शाता है और לָהּ का स्त्रीलिंग एकवचन दीवट की ओर संकेत करता है। ‘जिनसे’ और ‘उसकी’ दोनों संबंधों को स्पष्ट रखते हैं; ‘सेवा’ שׁרת के पवित्र सेवा-संबंधी भाव को बनाए रखती है।
