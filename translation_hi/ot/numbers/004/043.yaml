  yaml_path: translation/ot/numbers/004/043.yaml
  text: from thirty years old and upward[a], and up to fifty years old[b], everyone who comes for service, for the work in the tent of meeting.
translation:
  language: hi
  text: तीस वर्ष की आयु से लेकर पचास वर्ष की आयु तक का हर वह व्यक्ति, जो मिलाप के तंबू में काम करने के लिए सेवा[b] में आता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सेवा के लिए उपस्थित होता है।” इब्रानी कृदंत उन लोगों पर बल दे सकता है जो नियत सेवा में आते या अपने को प्रस्तुत करते हैं।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “सेवा” के लिए प्रयुक्त इब्रानी शब्द संगठित दायित्व को भी सूचित कर सकता है और कभी-कभी उसमें सैनिक अर्थ-छाया होती है; इस प्रसंग में इसका आशय लेवियों की सेवा से है।
    reason: cultural_note
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה
  choice: तीस वर्ष की आयु से
  rationale: בֶּן + संख्या + שָׁנָה आयु बताने वाला मुहावरा है। וָמַעְלָה निचली सीमा को समावेशी बनाता है; हिंदी में पूरी आयु-सीमा को ‘से लेकर ... तक’ कहना स्वाभाविक और स्पष्ट है।
- source_word: וְעַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: पचास वर्ष की आयु तक
  rationale: यह सेवा के लिए ऊपरी आयु-सीमा निर्धारित करता है; ‘तक’ मूल के सीमा-सूचक अर्थ को सहज हिंदी में व्यक्त करता है।
- source_word: כָּל הַבָּא
  choice: हर वह व्यक्ति ... आता है
  rationale: בוא का कृदंत यहाँ सेवा के लिए आने या अपने को उपस्थित करने वाले प्रत्येक व्यक्ति को सूचित करता है। ‘आता है’ मूल की गतिशीलता और उसकी संभावित व्यापकता बनाए रखता है।
- source_word: לַצָּבָא
  choice: सेवा में
  rationale: इस लेवीय संदर्भ में צָבָא संगठित और नियत सेवा को दर्शाता है, न कि अनिवार्य रूप से सैनिक सेना को। ‘सेवा में’ सैन्य अर्थ आरोपित किए बिना यह भाव देता है।
- source_word: לַעֲבֹדָה
  choice: काम करने के लिए
  rationale: עֲבֹדָה काम या श्रम को सूचित करता है। इसे क्रियात्मक रूप में रखने से צָבָא की ‘सेवा’ और वास्तविक ‘काम’ के बीच का भेद स्पष्ट रहता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह पंचग्रंथ में प्रयुक्त मानक पवित्रस्थान-संज्ञा है। ‘में’ בְּ का सीधा अर्थ देता है और ‘मिलापवाला तंबू’ प्रचलित, समझने योग्य हिंदी पद है।
