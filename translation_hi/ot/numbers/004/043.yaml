  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। आयु-सीमा को हिंदी के स्वाभाविक ‘से लेकर ... तक’ ढाँचे में व्यक्त किया गया है। ‘सेवा’ और ‘काम’ को अलग रखा गया है ताकि צָבָא और עֲבֹדָה के भेद को मिटाया न जाए; साथ ही अनावश्यक सैन्य अर्थ से बचा गया है।
