  text: מִ/בֶּן֩ שְׁלֹשִׁ֨ים שָׁנָ֜ה וָ/מַ֗עְלָ/ה עַ֛ד בֶּן חֲמִשִּׁ֥ים שָׁנָ֖ה תִּפְקֹ֣ד אוֹתָ֑/ם כָּל הַ/בָּא֙ לִ/צְבֹ֣א צָבָ֔א לַ/עֲבֹ֥ד עֲבֹדָ֖ה בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/004/023.yaml
  text: From thirty years old and upward to fifty years old[a], you shall count them, everyone who comes to do the service, to do the work in the tent of meeting.
translation:
  language: hi
  text: तीस वर्ष से लेकर पचास वर्ष तक की आयु वाले उन सभी लोगों की गिनती करना, जो मिलाप के तंबू में सेवा का दायित्व निभाने[a] और काम करने आते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कर्तव्य निभाने”; इब्रानी पदबंध संगठित तंबू-सेवा के लिए सैनिक कर्तव्य की भाषा का रूपकात्मक प्रयोग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן שְׁלֹשִׁים שָׁנָה וָמַעְלָה עַד בֶּן חֲמִשִּׁים שָׁנָה
  choice: तीस वर्ष से लेकर पचास वर्ष तक की आयु वाले
  rationale: इब्रानी आयु-सूचक मुहावरे को स्वाभाविक हिन्दी में प्रस्तुत करता है और आरम्भ तथा ऊपरी सीमा दोनों बनाए रखता है।
- source_word: תִּפְקֹד אֹתָם
  choice: उन ... लोगों की गिनती करना
  rationale: जनगणना और प्रशासनिक प्रसंग में פקד का अर्थ गिनना या सूचीबद्ध करना है; यहाँ 'गिनती करना' निकटवर्ती प्रसंग के अनुकूल और सर्वसुलभ है।
- source_word: כָּל הַבָּא
  choice: उन सभी लोगों ... जो ... आते हैं
  rationale: संज्ञात्मक कृदन्त का वितरणात्मक भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: לִצְבֹא צָבָא
  choice: सेवा का दायित्व निभाने
  rationale: यह सजातीय पदबंध संगठित और नियत सेवा का भाव रखता है; 'दायित्व निभाने' उसके कर्तव्यपरक बल को व्यक्त करता है, बिना वास्तविक युद्ध का संकेत दिए।
- source_word: לַעֲבֹד עֲבֹדָה
  choice: काम करने
  rationale: सजातीय क्रिया और संज्ञा को सरल, मुहावरेदार हिन्दी में व्यक्त करता है तथा पहले सेवा-पदबंध के साथ समानांतरता रखता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह इस पवित्र स्थान के लिए प्रचलित और समझने योग्य हिन्दी पद है तथा בְ के स्थानगत अर्थ को बनाए रखता है।
theological_decisions:
- issue: क्या צבא की भाषा को स्पष्ट सैनिक शब्दावली में अनूदित किया जाए
  choice: सेवा का दायित्व निभाने
  alternative: सैनिक सेवा करने / दल में सेवा करने
  rationale: गिनती 4 में लेवियों को तंबू की सेवा सौंपी जा रही है, युद्ध नहीं। चुना हुआ अनुवाद संगठित कर्तव्य का रूपकात्मक बल बनाए रखता है, पर वास्तविक सैन्य गतिविधि का भ्रामक संकेत नहीं देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। आज्ञार्थक संरचना को पिछले पदों से चल रहे मूसा को संबोधन के अनुरूप 'गिनती करना' में रखा गया है। 'मिलापवाला तंबू' पारंपरिक पहचान और सहज बोध के बीच संतुलन रखता है।
