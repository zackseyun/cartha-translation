  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י דְבַר יְהוָה֙ בָּזָ֔ה וְ/אֶת מִצְוָת֖/וֹ הֵפַ֑ר הִכָּרֵ֧ת תִּכָּרֵ֛ת הַ/נֶּ֥פֶשׁ הַ/הִ֖וא עֲוֺנָ֥/ה בָֽ/הּ־־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/031.yaml
  text: Because he has despised the word of Yahweh and has broken his commandment, that person shall surely be cut off; his guilt is on him.
translation:
  language: hi
  text: क्योंकि उसने याहवे के वचन का तिरस्कार किया है और उसकी आज्ञा तोड़ी है, इसलिए वह व्यक्ति निश्चय ही काट दिया जाएगा[a]; उसका दोष उसी पर है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘निश्चय ही काट दिया जाएगा’ इब्रानी का बलयुक्त मुहावरा है; यहाँ दण्ड का सटीक रूप नहीं बताया गया है।
    reason: cultural_note
  - marker: b
    text: या, ‘उसका अधर्म उसी पर है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद में बताए गए दण्ड का कारण प्रस्तुत करता है; आधुनिक हिन्दी में कारण-संबंध स्पष्ट करता है।
- source_word: דְבַר יְהוָה
  choice: यहोवा के वचन
  rationale: דָּבָר यहाँ परमेश्वर के प्रकट आदेश के अर्थ में है; יהוה को उसके वाचिक नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: בָּזָה
  choice: तिरस्कार किया
  rationale: यह केवल उपेक्षा नहीं, बल्कि सक्रिय अवमानना व्यक्त करता है।
- source_word: מִצְוָתוֹ
  choice: उसकी आज्ञा
  rationale: इब्रानी का एकवचन सुरक्षित रखते हुए सहज और विधिक भार वाली हिन्दी दी गई है।
- source_word: הֵפַר
  choice: तोड़ी है
  rationale: दैवी आज्ञा के उल्लंघन के लिए ‘आज्ञा तोड़ना’ स्वाभाविक हिन्दी प्रयोग है; पूर्ण क्रिया का प्रभाव भी बना रहता है।
- source_word: הִכָּרֵת תִּכָּרֵת
  choice: निश्चय ही काट दिया जाएगा
  rationale: धातु के साथ प्रयुक्त infinitive absolute की तीव्रता को ‘निश्चय ही’ व्यक्त करता है, जबकि ‘काट दिया जाएगा’ मूल वाचा-संबंधी मुहावरे को बनाए रखता है।
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति
  rationale: विधिक प्रसंग में נֶפֶשׁ पूरे व्यक्ति को सूचित करता है; ‘प्राण’ या ‘आत्मा’ यहाँ भ्रामक मानवशास्त्रीय अर्थ दे सकता है।
- source_word: עֲוֺנָהּ בָּהּ
  choice: उसका दोष उसी पर है
  rationale: क्रियारहित इब्रानी वाक्य अपराध की जवाबदेही अपराधी पर रहने को बताता है; ‘दोष’ आधुनिक हिन्दी में न्यायिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: वाचा के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय दिव्य नाम सीधे आया है। हिन्दी में प्रचलित नामरूप ‘यहोवा’ उसका नामात्मक स्वरूप बनाए रखता है, उसे केवल उपाधि में नहीं बदलता।
- issue: वाचा-विधि में ‘काट दिया जाना’ का अर्थ
  choice: मुहावरे को बनाए रखते हुए दण्ड की सटीक रीति अनिर्धारित रखना
  alternative: मार डाला जाएगा / समुदाय से निकाल दिया जाएगा
  rationale: निफ़अल כרת का यहाँ गम्भीर वाचा-संबंधी न्यायिक अर्थ है, पर यह पद नहीं बताता कि दण्ड मृत्यु, समुदाय से निष्कासन या किसी अन्य रूप में पूरा होगा। इसलिए मूल की अस्पष्टता सुरक्षित रखी गई है।
- issue: עָוֹן का न्यायिक आशय
  choice: उसका दोष उसी पर है
  alternative: उसका अधर्म उसी पर है
  rationale: यह वाक्य अपराध तथा उसके लिए उत्तरदायित्व दोनों का संकेत दे सकता है। ‘दोष’ इस न्यायिक उत्तरदायित्व को सहज हिन्दी में व्यक्त करता है, बिना परिणाम की प्रकृति को अतिरिक्त रूप से निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक-वाचा संबंधी गंभीरता के लिए ‘तिरस्कार’, ‘आज्ञा’ और ‘निश्चय ही’ चुने गए हैं। ‘काट दिया जाएगा’ की वास्तविक अस्पष्टता तथा अंतिम उपवाक्य का वर्तमान दायित्व-बोध सुरक्षित रखा गया है।
