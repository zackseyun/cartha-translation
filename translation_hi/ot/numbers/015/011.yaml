base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/011.yaml
  text: Thus it shall be done for the one bull[a], or for the one ram, or for the lamb among the sheep or among the goats.
translation:
  language: hi
  text: एक बैल के लिए, या एक मेढ़े के लिए, या भेड़ों अथवा बकरियों में से एक छोटे पशु[a] के लिए ऐसा ही किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी שֶׂה भेड़ या बकरी में से किसी छोटे पालतू पशु को सूचित कर सकता है; आगे का वाक्यांश इन दोनों वर्गों का उल्लेख करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּכָה
  choice: ऐसा ही
  rationale: यह क्रियाविशेषण पहले बताए गए विधि-विधान की ओर संकेत करता है; ‘ऐसा ही’ कानूनी निर्देश के संदर्भ में स्वाभाविक और स्पष्ट है।
- source_word: יֵעָשֶׂה
  choice: किया जाए
  rationale: עשה का निफ़ाल अपूर्ण रूप यहाँ कर्मवाच्य, विधिसूचक निर्देश व्यक्त करता है; ‘किया जाए’ अनावश्यक रूप से कर्म का विस्तार किए बिना यही भाव रखता है।
- source_word: לַשּׁוֹר הָאֶחָד
  choice: एक बैल के लिए
  rationale: निश्चित उपपद के साथ ‘एक’ प्रत्येक अलग पशु पर नियम लागू होने को रेखांकित करता है; हिन्दी में ‘एक बैल के लिए’ स्वाभाविक ढंग से एकवचन विशिष्टता व्यक्त करता है।
- source_word: אַיִל
  choice: मेढ़ा
  rationale: यहाँ नर भेड़ के लिए मानक हिन्दी शब्द है।
- source_word: הָאֶחָד
  choice: एक
  rationale: दोहराया गया अंक नियम के प्रत्येक पशु पर अलग-अलग लागू होने पर बल देता है; हिन्दी में ‘एक’ इस बल को सहज रूप में बनाए रखता है।
- source_word: שֶׂה
  choice: छोटा पशु
  rationale: इब्रानी शब्द भेड़ या बकरी—दोनों वर्गों के छोटे पालतू पशु को सूचित कर सकता है; आगे के वाक्यांश दोनों वर्गों को स्पष्ट करते हैं, इसलिए केवल ‘मेमना’ कहना अर्थ को अनावश्यक रूप से सीमित करेगा।
- source_word: בַכְּבָשִׂים
  choice: भेड़ों ... में से
  rationale: 'यहाँ ב वर्ग-सदस्यता दर्शाता है: पशु भेड़ों के वर्ग में से है।'
- source_word: בָעִזִּים
  choice: बकरियों में से
  rationale: भेड़ों वाले समानांतर पद की तरह यह बकरियों के वर्ग में सदस्यता बताता है।
- source_word: אוֹ ... אוֹ ... אוֹ ... אוֹ
  choice: या ... या ... अथवा
  rationale: वैकल्पिक बलि-पशुओं की सूची का वियोजक ढाँचा हिन्दी में बनाए रखा गया है; अंतिम निकटवर्ती विकल्पों में ‘अथवा’ सहज पठनीयता देता है।
