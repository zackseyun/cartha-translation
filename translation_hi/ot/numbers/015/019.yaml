  text: וְ/הָיָ֕ה בַּ/אֲכָלְ/כֶ֖ם מִ/לֶּ֣חֶם הָ/אָ֑רֶץ תָּרִ֥ימוּ תְרוּמָ֖ה לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/019.yaml
  text: And when you eat from the bread of the land[a], you shall present a contribution to Yahweh.
translation:
  language: hi
  text: और जब तुम उस देश की रोटी में से खाओ, तब याहवे के लिए एक अंश अर्पित करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה בַּאֲכָלְכֶם
  choice: और जब तुम…खाओ, तब
  rationale: היה के साथ בּ + क्रियार्थक संज्ञा भविष्य की परिस्थिति को व्यक्त करती है; आधुनिक हिन्दी में ‘जब…तब’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: מִלֶּחֶם הָאָרֶץ
  choice: उस देश की रोटी में से
  rationale: מן के स्रोत/अंशवाचक भाव को ‘में से’ से बनाए रखा गया है। לֶחֶם का मूल अर्थ ‘रोटी’ है और संदर्भ उस देश की उपज से बने भोजन का है; ‘उस देश’ पूर्ववर्ती प्रतिज्ञात देश की ओर संकेत करता है।
- source_word: תָּרִימוּ תְרוּמָה
  choice: एक अंश अर्पित करना
  rationale: यह याजकीय भेंट की तकनीकी अभिव्यक्ति है, जिसका शाब्दिक चित्र ‘उठाना’ है। ‘अंश अर्पित करना’ अलग रखे गए हिस्से और उसके परमेश्वर को चढ़ाए जाने—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण/लाभार्थी का भाव देता है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: תָּרִימוּ תְרוּמָה की याजकीय भाषा
  choice: एक अंश अर्पित करना
  alternative: एक उठाई हुई भेंट चढ़ाना
  rationale: अनुष्ठानिक अर्थ को सुरक्षित रखते हुए शाब्दिक किन्तु हिन्दी में अस्वाभाविक ‘उठाई हुई भेंट’ से बचा गया है; किसी विशिष्ट बाद की सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञा को हिन्दी की स्वाभाविक विधिवाचक शैली ‘अर्पित करना’ में दिया गया है। ‘रोटी’ मूल के ठोस शब्द को बनाए रखती है, जबकि ‘अंश’ מן और תְרוּמָה के अंशदान-संबंधी भाव को स्पष्ट करता है।
