  yaml_path: translation/ot/numbers/015/017.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: याहवे ने मूसा से कहा[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से ‘प्रभु’ अनुवाद किया जाता है।'
    reason: ईश्वरीय नाम के मूल इब्रानी रूप और पारंपरिक अनुवाद से पाठक को अवगत कराना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक रूप के साथ דּבר यहाँ एक नए कथन-प्रसंग का आरम्भ करता है। हिंदी में ‘मूसा से कहा’ इस प्रचलित दिव्य-वचन सूत्र का स्वाभाविक और सटीक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: אֶל
  choice: से
  rationale: דּבר के साथ אֶל संबोधित व्यक्ति को चिह्नित करता है; हिंदी में ‘मूसा से कहा’ स्वाभाविक प्रयोग है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिवाचक नाम का प्रचलित मानक हिंदी रूप रखा गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियार्थक रूप अगले पद में आने वाले कथन का परिचय देता है। हिंदी में ‘कहा’ के बाद अल्पविराम लगाकर यह कार्य स्वाभाविक ढंग से व्यक्त होता है; ‘यह कहते हुए’ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है; पादटिप्पणी पारंपरिक ‘प्रभु’ रूप की जानकारी देती है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिंदी। मूल के कथन-सूत्र को हिंदी की स्वाभाविक रचना में व्यक्त किया गया है और अगले पद से जुड़ाव बनाए रखने के लिए अंत में अल्पविराम रखा गया है।
