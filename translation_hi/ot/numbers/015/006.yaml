  edition: WLC
  text: א֤וֹ לָ/אַ֨יִל֙ תַּעֲשֶׂ֣ה מִנְחָ֔ה סֹ֖לֶת שְׁנֵ֣י עֶשְׂרֹנִ֑ים בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן שְׁלִשִׁ֥ית הַ/הִֽין׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/006.yaml
  text: Or for a ram you shall prepare a grain offering of fine flour[a], two-tenths, mixed with a third of a hin of oil.
translation:
  language: hi
  text: या मेढ़े के लिए तुम एपा के दो-दसवें भाग[a] का बारीक आटा, जो एक-तिहाई हिन तेल के साथ मिला हुआ हो, अन्नबलि के रूप में तैयार करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से केवल “दो दशमांश” है; बलिदानों की माप-पद्धति के अनुसार यहाँ “एपा” समझा जाता है। अन्य स्थानों पर पूरा पद “एपा का दो-दसवाँ भाग” मिलता है।
    reason: cultural_note
lexical_decisions:
- source_word: א֤וֹ
  choice: या
  rationale: यह पिछले बलिदानी विकल्पों की शृंखला को आगे बढ़ाने वाला विकल्पसूचक अव्यय है; इसलिए बिना अतिरिक्त शर्त जोड़े ‘या’ उपयुक्त है।
- source_word: לָ/אַ֨יִל֙
  choice: मेढ़े के लिए
  rationale: אַיִל का अर्थ नर भेड़, अर्थात ‘मेढ़ा’ है; ל यहाँ संबंध अथवा प्रयोजन बताता है।
- source_word: תַּעֲשֶׂ֣ה
  choice: तुम ... तैयार करना
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ व्यापक है; बलिदान की तैयारी के निर्देश में ‘तैयार करना’ स्वाभाविक और सटीक है।
- source_word: מִנְחָ֔ה
  choice: अन्नबलि
  rationale: याजकीय प्रसंग में מִנְחָה अनाज से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ संक्षिप्त, परिचित और प्रसंगानुकूल है।
- source_word: סֹ֖לֶת
  choice: मैदा
  rationale: סֹלֶת बारीक पिसे हुए उत्तम आटे को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘मैदा’ इसका सहज समतुल्य है।
- source_word: שְׁנֵ֣י עֶשְׂרֹנִ֑ים
  choice: एपा का दो-दसवाँ भाग
  rationale: इब्रानी में शाब्दिक रूप से ‘दो दशमांश’ है और माप की बड़ी इकाई प्रसंग से समझी जाती है। हिन्दी पाठक के लिए निहित ‘एपा’ को स्पष्ट करना अर्थ को स्वाभाविक बनाता है; इसे टिप्पणी में बताया गया है।
- source_word: בְּלוּלָ֥ה בַ/שֶּׁ֖מֶן
  choice: तेल में मिला हो
  rationale: निष्क्रिय कृदंत आटे के तेल से मिश्रित होने का वर्णन करता है; ‘तेल में मिला हो’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שְׁלִשִׁ֥ית הַ/הִֽין
  choice: एक-तिहाई हिन
  rationale: मूल पाठ प्राचीन माप की इकाई ‘हिन’ का एक-तिहाई बताता है; माप को परिवर्तित न करके मूल सांस्कृतिक रूप सुरक्षित रखा गया है।
