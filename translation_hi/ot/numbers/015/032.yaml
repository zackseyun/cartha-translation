  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּהְי֥וּ בְנֵֽי יִשְׂרָאֵ֖ל בַּ/מִּדְבָּ֑ר וַֽ/יִּמְצְא֗וּ אִ֛ישׁ מְקֹשֵׁ֥שׁ עֵצִ֖ים בְּ/י֥וֹם הַ/שַּׁבָּֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/032.yaml
  text: While the sons of Israel were in the wilderness[a], they found a man gathering wood on the Sabbath day.
translation:
  language: hi
  text: जब इस्राएली निर्जन प्रदेश में थे, तब उन्हें एक आदमी सब्त के दिन लकड़ियाँ[a] बटोरता हुआ मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘टहनियाँ।’
    reason: עֵצִים इस प्रसंग में लकड़ी के टुकड़ों अथवा टहनियों को सूचित कर सकता है; वैकल्पिक अर्थ को सुरक्षित रखा गया है।
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: यहाँ क्रिया कथा की पृष्ठभूमि बताती है; ‘थे’ इसका स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह पूरे समुदाय के लिए प्रचलित सामूहिक पद है। ‘इस्राएल के पुत्र’ स्रोत की संरचना के अधिक निकट है, पर आधुनिक हिन्दी में अनावश्यक रूप से केवल पुरुषों का बोध करा सकता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वन्य प्रदेश को सूचित करता है; ‘जंगल’ सामान्य आधुनिक हिन्दी में समझने योग्य है और केवल रेतीले मरुस्थल का अर्थ आरोपित नहीं करता।
- source_word: וַיִּמְצְאוּ
  choice: उन्होंने ... पाया
  rationale: कथात्मक प्रसंग में מצא का सीधा अर्थ किसी को किसी कार्य में लगा हुआ पाना है।
- source_word: אִישׁ
  choice: एक आदमी
  rationale: मूल पाठ यहाँ स्पष्ट रूप से एक पुरुष व्यक्ति का उल्लेख करता है।
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: लकड़ियाँ बटोरते हुए
  rationale: यह पद ईंधन आदि के लिए लकड़ी के टुकड़े या डंडियाँ इकट्ठी करने को दर्शाता है। ‘लकड़ियाँ बटोरना’ स्वाभाविक हिन्दी है; ‘टहनियाँ’ सम्भव वैकल्पिक अर्थ के रूप में पादटिप्पणी में रखा गया है।
- source_word: בְּיוֹם הַשַּׁבָּת
  choice: सब्त के दिन
  rationale: यह יוֹם और שַׁבָּת दोनों को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बְנֵי יִשְׂרָאֵל द्वारा वाचा-समुदाय का नामकरण
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: ‘इस्राएली’ आधुनिक हिन्दी में पूरे समुदाय को स्वाभाविक रूप से दर्शाता है और किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या को नहीं जोड़ता।
- issue: सब्त-संबंधी शब्दावली
  choice: सब्त के दिन
  alternative: विश्राम-दिन में
  rationale: ‘सब्त’ मूल के विशिष्ट दिन का मान्य नाम है और पद में उपस्थित ‘दिन’ को भी बनाए रखता है; पाठ से परे व्यवस्था की कोई व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य का ‘जब ... तब ...’ ढाँचा इब्रानी की परिस्थितिपरक भूमिका को स्पष्ट करता है। पादटिप्पणी का चिह्न उसी शब्द के बाद रखा गया है जिससे lexical विकल्प संबंधित है।
