  yaml_path: translation/ot/numbers/015/033.yaml
  text: And those who found him gathering wood brought him to Moses and Aaron and to all the congregation[a].
translation:
  language: hi
  text: और जिन लोगों ने उसे लकड़ी[a] बटोरते हुए पाया, वे उसे मूसा, हारून और पूरी सभा के पास ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “डंडियाँ बटोरते हुए।” हिब्रू शब्द का अर्थ सामान्य रूप से लकड़ी या लकड़ी के टुकड़े/डंडियाँ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרִיבוּ אֹתוֹ
  choice: वे उसे ... के पास ले आए
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी व्यक्ति को अधिकारियों और सभा के सामने/पास लाना है। ‘के पास ले आए’ कारणवाचक दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמֹּצְאִים אֹתוֹ
  choice: जिन लोगों ने उसे ... पाया था
  rationale: निश्चित उपपद सहित कृदन्त संज्ञा की तरह प्रयुक्त है और उन लोगों को सूचित करता है जिन्होंने उसे इस कार्य में पकड़ा या पाया। ‘जिन लोगों ने’ हिन्दी में सहज है।
- source_word: מְקֹשֵׁשׁ עֵצִים
  choice: लकड़ियाँ बटोरते
  rationale: מְקֹשֵׁשׁ लगातार संग्रह करने की क्रिया बताता है। עֵצִים यहाँ ईंधन के लिए लकड़ी के टुकड़ों/लकड़ियों को सूचित कर सकता है; बहुवचन ‘लकड़ियाँ’ हिन्दी में इस प्रसंग के लिए स्वाभाविक है।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן וְאֶל כָּל הָעֵדָה
  choice: मूसा, हारून और पूरी सभा के पास
  rationale: אֶל की दिशात्मकता ‘के पास’ से व्यक्त होती है। हिन्दी में प्रत्येक पद के साथ इसे दोहराना अस्वाभाविक होता, इसलिए संयुक्त सूची में एक बार रखा गया है।
- source_word: עֵדָה
  choice: सभा
  rationale: यह इस्राएल के एकत्रित समुदाय को दर्शाता है। ‘सभा’ आधुनिक, गरिमापूर्ण और व्यापक रूप से बोधगम्य है तथा केवल किसी स्थानीय धार्मिक मंडली का संकेत नहीं देती।
