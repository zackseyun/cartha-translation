  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶֽׁר תַּעֲשֶׂ֣ה בְּ/יָ֣ד רָמָ֗ה מִן הָֽ/אֶזְרָח֙ וּ/מִן הַ/גֵּ֔ר אֶת יְהוָ֖ה ה֣וּא מְגַדֵּ֑ף וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/קֶּ֥רֶב עַמָּֽ/הּ־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/030.yaml
  text: But the person who acts with a high hand[a], whether native-born or a sojourner, is reviling Yahweh, and that person shall be cut off from among his people.
translation:
  language: hi
  text: परन्तु जो व्यक्ति ढिठाई से[a] कुछ करता है, चाहे वह देश में जन्मा हुआ हो या परदेशी, वह यहोवा की निन्दा करता है; वह व्यक्ति अपने लोगों के बीच से काट दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जान-बूझकर” अथवा “विद्रोही ढंग से”; शाब्दिक अर्थ “ऊँचे हाथ से” है।
    reason: इब्रानी मुहावरे का शाब्दिक चित्र तथा उसके खुले, धृष्ट और जानबूझकर किए गए अवज्ञाकारी कार्य के अर्थ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: व्यक्ति
  rationale: कानूनी प्रसंग में נֶפֶשׁ पूरे व्यक्ति को सूचित करता है; ‘व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल ‘आत्मा’ तक सीमित नहीं करता।
- source_word: תַּעֲשֶׂה
  choice: कुछ करता है
  rationale: עשה का अर्थ व्यापक रूप से ‘करना’ है। यहाँ कर्म की वस्तु अव्यक्त है, इसलिए हिन्दी में आवश्यक ‘कुछ’ जोड़कर अपराध को अनावश्यक रूप से विशिष्ट नहीं बनाया गया।
- source_word: בְּיָד רָמָה
  choice: ढिठाई से[a]
  rationale: शाब्दिक अर्थ ‘ऊँचे हाथ से’ है और मुहावरा खुले दुस्साहस तथा जान-बूझकर किए गए विद्रोह को व्यक्त करता है। मुख्य पाठ में अर्थ-सुलभ रूप रखा गया और शाब्दिक चित्र फुटनोट में सुरक्षित किया गया।
- source_word: הָאֶזְרָח
  choice: देश में जन्मा
  rationale: यह समुदाय अथवा देश के मूल निवासी को सूचित करता है और גֵּר के साथ कानूनी विरोध को स्पष्ट रखता है।
- source_word: הַגֵּר
  choice: प्रवासी
  rationale: גֵּר उस गैर-मूल निवासी को सूचित करता है जो इस्राएली समुदाय के बीच रहता है; ‘प्रवासी’ संक्षिप्त और आधुनिक हिन्दी में बोधगम्य है।
- source_word: אֶת יְהוָה הוּא מְגַדֵּף
  choice: वह यहोवा का अपमान करता है
  rationale: גדף यहाँ परमेश्वर के प्रति निन्दात्मक अवमानना व्यक्त करता है। ‘अपमान करता है’ कथन या कर्म—दोनों के द्वारा प्रकट तिरस्कार की गुंजाइश बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से लिप्यंतरित किया गया।
- source_word: וְנִכְרְתָה
  choice: काट दिया जाए
  rationale: निफ़अल कानूनी सूत्र की कठोरता और रूपक को बनाए रखते हुए दण्ड का ठीक प्रकार—मृत्युदण्ड, निष्कासन या ईश्वरीय न्याय—अनिर्धारित रखा गया है।
- source_word: מִקֶּרֶב עַמָּהּ
  choice: उसके लोगों के बीच से
  rationale: यह वाचा-समुदाय के मध्य से हटाए जाने को व्यक्त करता है। लिंग-निरपेक्ष ‘उसके’ मूल के व्याकरणिक स्त्रीलिंग को जैविक लिंग न मानते हुए स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: अपराध और ‘काट दिए जाने’ का स्वरूप
  choice: पद को खुली, जान-बूझकर की गई धृष्ट अवज्ञा के रूप में प्रस्तुत किया गया है और दण्ड के लिए ‘काट दिया जाए’ रखा गया है।
  alternative: इसे विशेष रूप से ‘अभिमान का पाप’ कहना, अथवा ‘काट दिए जाने’ को निश्चित रूप से मृत्युदण्ड या केवल समुदाय से निष्कासन बताना।
  rationale: इब्रानी मुहावरा और कानूनी सूत्र गंभीर हैं, पर यह पद दण्ड की रीति स्पष्ट नहीं करता। अनुवाद इस धर्मवैज्ञानिक और न्यायिक अनिश्चितता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध कानूनी-धार्मिक रजिस्टर। ‘परन्तु’ पूर्ववर्ती अनजाने पापों के नियम से विरोध दिखाता है; डैश दोनों कानूनी वर्गों को स्पष्ट करता है।
