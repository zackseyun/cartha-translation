  choice: लटकन
  rationale: वस्त्र के कोने पर बाँधी जाने वाली झब्बेदार लटकन के लिए यह आधुनिक और सहज हिन्दी शब्द है; वैकल्पिक रूप 'झालर' पादटिप्पणी में दिया गया है।
- source_word: וְהָיָה לָכֶם לְצִיצִת
  choice: वह तुम्हारे लिए एक लटकन होगी
  rationale: पिछले पद में उल्लिखित एकवचन वस्तु की ओर संकेत रखते हुए इब्रानी विधेयात्मक रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּרְאִיתֶם אֹתוֹ
  choice: जब तुम उसे देखोगे
  rationale: 'वाव-संयुक्त क्रिया का प्रसंगगत कालक्रम स्पष्ट करता है: उसे देखने पर आज्ञाएँ स्मरण करनी हैं।'
- source_word: מִצְוֺת
  choice: आज्ञाओं
  rationale: वाचा और व्यवस्था से संबंधित आदेशों का विधिक भार बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के वाचागत नाम का प्रचलित प्रत्यक्ष रूप है और नाम को सामान्य उपाधि से नहीं बदलता।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: उनका पालन करोगे
  rationale: आज्ञाओं को 'करना' हिन्दी में अस्वाभाविक हो सकता है; 'पालन करना' עשה के प्रसंगगत अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: תָתֻרוּ
  choice: पीछे नहीं भटकोगे
  rationale: תור में खोजते या इधर-उधर फिरते हुए किसी के पीछे जाने का भाव है; निषेधात्मक नैतिक प्रसंग में 'पीछे भटकना' इस गति और विपथन दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: לְבַבְכֶם
  choice: अपने मन
  rationale: לֵבָב यहाँ आंतरिक इच्छा और विचार को दर्शाता है; आधुनिक हिन्दी में 'मन' मात्र भावना की अपेक्षा इस व्यापक आशय को अधिक सहजता से देता है।
- source_word: עֵינֵיכֶם
  choice: अपनी आँखों
  rationale: मूल की प्रत्यक्ष शारीरिक उपमा को बनाए रखता है और दिखाई देने वाली वस्तुओं की लालसा का संकेत खुला छोड़ता है।
- source_word: זֹנִים
  choice: व्यभिचार करते हो
  rationale: यौन बेवफाई की तीखी उपमा को बनाए रखता है, जिसे यहाँ वाचा के प्रति विश्वासघात के रूपक के रूप में प्रयुक्त किया गया है।
- source_word: אֲשֶׁר אַתֶּם זֹנִים אַחֲרֵיהֶם
  choice: जिनके पीछे चलकर तुम व्यभिचार करते हो
  rationale: संबंधवाचक वाक्य को मन और आँखों से जोड़ता है तथा मूल की यौन-बेवफाई की उपमा को बिना नरम किए स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: वाचागत नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए विशिष्ट ईश्वरीय नाम को उपाधि 'प्रभु' से प्रतिस्थापित नहीं किया गया; 'यहोवा' आधुनिक हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: זנה की वाचा-संबंधी उपमा की तीव्रता
  choice: व्यभिचार करते हो
  alternative: भटक जाते हो / विश्वासघात करते हो
  rationale: मूल पाठ जानबूझकर यौन बेवफाई की छवि का उपयोग करता है; इसे केवल सामान्य भटकाव कहना उसकी धर्मवैज्ञानिक तीव्रता को घटा देता।
- issue: मन और आँखों के पीछे जाने का संबंध
  choice: दोनों को बहुवचन संबंधवाचक 'जिनके' से अंतिम उपवाक्य से जोड़ा
  alternative: अंतिम उपवाक्य को केवल इच्छाओं अथवा देखी हुई वस्तुओं से जोड़ना
  rationale: אֲשֶׁר और אַחֲרֵיהֶם के रूप पूरे पूर्ववर्ती युग्म की ओर संकेत कर सकते हैं; अनुवाद मूल की इस संयुक्त संबद्धता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज बहुवचन संबोधन रखा गया है। वाक्य-विन्यास को हिन्दी में पठनीय बनाया गया है, पर लटकन, मन और आँखें, तथा व्यभिचार की मूल छवियाँ सुरक्षित रखी गई हैं।
