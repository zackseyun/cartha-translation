  text: וְ/הָיָ֣ה לָ/כֶם֮ לְ/צִיצִת֒ וּ/רְאִיתֶ֣ם אֹת֗/וֹ וּ/זְכַרְתֶּם֙ אֶת כָּל מִצְוֺ֣ת יְהוָ֔ה וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹֽא תָתֻ֜רוּ אַחֲרֵ֤י לְבַבְ/כֶם֙ וְ/אַחֲרֵ֣י עֵֽינֵי/כֶ֔ם אֲשֶׁר אַתֶּ֥ם זֹנִ֖ים אַחֲרֵי/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/039.yaml
  text: And it shall be a tassel for you[a], and when you see it, you shall remember all the commandments of Yahweh and do them, and you shall not go about after your own heart and after your own eyes[c][b], after which you are whoring.
translation:
  language: hi
  text: वह तुम्हारे लिए एक लटकन[a] होगी। जब तुम उसे देखोगे, तब तुम यहोवा की सभी आज्ञाओं को स्मरण करके उनका पालन करोगे और अपने मन और अपनी आँखों के पीछे-पीछे नहीं फिरोगे[b]—जिनके पीछे तुम व्यभिचार करते हो[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झालर।” इब्रानी शब्द वस्त्र के कोने पर लगाई गई झब्बेदार लटकन को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने मन और अपनी आँखों के पीछे खोजते हुए न फिरोगे।” इब्रानी क्रिया में किसी चीज़ की खोज में घूमने या उसके पीछे पड़ने का भाव है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में यौन बेवफाई की भाषा है, जो यहाँ वाचा के प्रति विश्वासघात का रूपक है; इसका अर्थ “जिनके पीछे तुम भटक जाते हो” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
