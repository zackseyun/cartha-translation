  edition: WLC
  text: כָּל הָ/אֶזְרָ֥ח יַעֲשֶׂה כָּ֖כָה אֶת אֵ֑לֶּה לְ/הַקְרִ֛יב אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/013.yaml
  text: Every native-born person shall do these things in this way[a], to present a food offering[b], a pleasing aroma to Yahweh.
translation:
  language: hi
  text: देश में जन्मा हर व्यक्ति[a] याहवे के लिए सुखदायक सुगंध देने वाला अग्नि-चढ़ावा[b] चढ़ाने के लिए इन बातों को इसी रीति से करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ पुल्लिंग एकवचन रूप है, पर विधिक निर्देश में वह उस देश या समुदाय में जन्मे प्रत्येक व्यक्ति का प्रतिनिधित्व करता है।
    reason: lexical_alternative
  - marker: b
    text: या “आग से चढ़ाया गया चढ़ावा”; इस पद का अनुवाद “भोजन-चढ़ावा” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הָאֶזְרָח
  choice: देश में जन्मा हर व्यक्ति
  rationale: כָּל का यहाँ वितरणात्मक अर्थ है और הָאֶזְרָח उस देश अथवा समुदाय में जन्मे सदस्य को प्रवासी के विपरीत दर्शाता है। यह अभिव्यक्ति आधुनिक हिन्दी में स्वाभाविक है और आशय को केवल पुरुषों तक सीमित नहीं करती।
- source_word: יַעֲשֶׂה כָּכָה אֶת אֵלֶּה
  choice: इन सब बातों को इसी रीति से करे
  rationale: विधिक प्रसंग में अपूर्ण क्रिया आदेशात्मक दायित्व व्यक्त करती है। כָּכָה प्रक्रिया की समानता और אֵלֶּה पिछली विधियों की ओर संकेत करता है।
- source_word: לְהַקְרִיב
  choice: चढ़ाने के लिए
  rationale: बलिदान-संबंधी प्रयोग में קרב हिफ़ील किसी वस्तु को अर्पण के लिए समीप लाने अथवा प्रस्तुत करने का अर्थ देता है; हिन्दी में ‘चढ़ाना’ इस प्रसंग का सहज धार्मिक शब्द है।
- source_word: אִשֵּׁה
  choice: अग्नि-चढ़ावा
  rationale: यह बलिदान-विधि का तकनीकी पद है, जिसे आग से चढ़ाए जाने वाले अर्पण के रूप में समझा जाता है। पद की वैकल्पिक व्याख्या पाद-टिप्पणी में रखी गई है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध
  rationale: यह स्थापित बलिदानी मुहावरा अर्पण की स्वीकार्यता अथवा प्रसन्नता व्यक्त करता है; अनुवाद मूल के सुगंध-संबंधी बिंब को बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी में ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: הָאֶזְרָח का व्याकरणिक पुल्लिंग एकवचन
  choice: देश में जन्मा हर व्यक्ति
  alternative: देश में जन्मा हर पुरुष
  rationale: इब्रानी रूप व्याकरणिक रूप से पुल्लिंग एकवचन है, पर विधिक निर्देश में उसका प्रतिनिधिक बल है। ‘व्यक्ति’ व्यापक आशय को स्पष्ट करता है; रूपगत तथ्य पाद-टिप्पणी में सुरक्षित है।
- issue: אִשֵּׁה का अर्थ
  choice: अग्नि-चढ़ावा
  alternative: भोजन-चढ़ावा
  rationale: शब्द का आग से अर्पित बलि से संबंध स्पष्ट है, जबकि ‘भोजन-चढ़ावा’ भी कुछ प्रसंगों में मान्य व्याख्या है। मुख्य पाठ तकनीकी बलिदानी स्वर को रखता है और विकल्प पाद-टिप्पणी में देता है।
- issue: ईश्वरीय नाम יהוה
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार-अक्षरी व्यक्तिगत नाम है; ‘याहवे’ उसे नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘इसी रीति से करे’ विधिक स्वर को बनाए रखता है, जबकि वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार उद्देश्य-वाक्यांश को मुख्य क्रिया से पहले रखता है।
