source:
  edition: WLC
  text: וְ/הָיָ֗ה אִ֣ם מֵ/עֵינֵ֣י הָ/עֵדָה֮ נֶעֶשְׂתָ֣ה לִ/שְׁגָגָה֒ וְ/עָשׂ֣וּ כָל הָ/עֵדָ֡ה פַּ֣ר בֶּן בָּקָר֩ אֶחָ֨ד לְ/עֹלָ֜ה לְ/רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה וּ/מִנְחָת֥/וֹ וְ/נִסְכּ֖/וֹ כַּ/מִּשְׁפָּ֑ט וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד לְ/חַטָּֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/024.yaml
  text: then[a], if it was done unintentionally and escaped the notice of the congregation, all the congregation shall offer one bull from the herd for a burnt offering, for a pleasing aroma to Yahweh, with its grain offering and its drink offering, according to the ordinance, and one male goat for a sin offering.
translation:
  language: hi
  text: और यदि कोई काम अनजाने में हो जाए और वह समुदाय के ध्यान से ओझल रह जाए, तो पूरा समुदाय यहोवा के लिए सुखदायक सुगंध के रूप में होमबलि के लिए गाय-बैलों में से एक बैल चढ़ाए, और उसके साथ उसकी अन्नबलि और पेय-बलि नियमानुसार चढ़ाए; तथा पापबलि[a] के लिए एक बकरा चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शुद्धिकरण-बलि।’ इब्रानी חַטָּאת पाप से संबंधित बलि और उसके अनुष्ठानिक शुद्धिकरण के प्रभाव—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵעֵינֵי הָעֵדָה
  choice: समुदाय की नज़र से छिपा रह गया हो
  rationale: इब्रानी मुहावरे ‘समुदाय की आँखों से’ का आशय है कि बात समुदाय के ध्यान में न आई। यह हिन्दी में स्वाभाविक रहते हुए मूल बिंब को आंशिक रूप से बनाए रखता है।
- source_word: נֶעֶשְׂתָה לִשְׁגָגָה
  choice: वह काम अनजाने में हुआ हो
  rationale: שְׁגָגָה जानबूझकर किए गए अपराध के विपरीत भूल या अनजानेपन को दर्शाता है।
- source_word: כָל הָעֵדָה
  choice: पूरा समुदाय
  rationale: עֵדָה यहाँ इस्राएल के सामुदायिक निकाय को सूचित करता है; ‘पूरा समुदाय’ सरल और व्यापक रूप से समझ में आने वाला है।
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: गाय-बैलों में से एक बछड़ा
  rationale: यह पद पशु-झुंड से एक नर गोवंश को निर्दिष्ट करता है। ‘बछड़ा’ बलि के लिए युवा नर गोवंश का स्वाभाविक हिन्दी पद है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה के लिए स्थापित हिन्दी बलिदानी पद ‘होमबलि’ रखा गया है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध
  rationale: यह बलिदानी मुहावरा यहोवा के सामने बलि की स्वीकार्यता व्यक्त करता है और मूल सुगंध-बिंब भी बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी के प्रचलित रूप ‘यहोवा’ से प्रस्तुत किया गया है, सामान्य उपाधि से नहीं बदला गया।
- source_word: וּמִנְחָתוֹ
  choice: उसका अन्नबलि
  rationale: बलिदानी संदर्भ में מִנְחָה साथ चढ़ाया जाने वाला अन्नबलि है; प्रत्यय मुख्य पशुबलि से उसके संबंध को दिखाता है।
- source_word: וְנִסְכּוֹ
  choice: उसका अर्घ
  rationale: נֶסֶךְ साथ चढ़ाया जाने वाला पेय-अर्पण है; ‘अर्घ’ संक्षिप्त और स्थापित हिन्दी धार्मिक पद है।
- source_word: כַּמִּשְׁפָּט
  choice: नियमानुसार
  rationale: यहाँ מִשְׁפָּט निर्धारित अनुष्ठानिक विधान या प्रक्रिया को दर्शाता है।
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: एक बकरा
  rationale: שְׂעִיר עִזִּים स्पष्टतः नर बकरी है; हिन्दी ‘बकरा’ स्वयं नरत्व व्यक्त करता है।
- source_word: לְחַטָּאת
  choice: पापबलि
  rationale: חַטָּאת के लिए परिचित बलिदानी पद ‘पापबलि’ मुख्य पाठ में रखा गया है; शुद्धिकरण संबंधी अर्थ-छाया पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: याजकीय बलिदानी संदर्भ में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: शब्द का संबंध पाप से भी है और अनुष्ठानिक शुद्धिकरण के प्रभाव से भी। परिचित पद मुख्य पाठ में रखा गया है, जबकि वास्तविक अर्थ-विकल्प पादटिप्पणी में दिया गया है।
- issue: יהוה दिव्य नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम है। आधुनिक हिन्दी पाठकों के लिए अधिक परिचित लिप्यंतरण ‘यहोवा’ चुना गया, जबकि इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण लेकिन सहज शैली अपनाई गई है। बलिदानी तकनीकी शब्दों में ‘होमबलि’, ‘अन्नबलि’, ‘अर्घ’ और ‘पापबलि’ का उपयोग किया गया है। वाक्य का क्रम मूल इब्रानी की शर्त और परिणामी आदेश को स्पष्ट रखता है।
