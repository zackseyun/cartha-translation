source:
  edition: WLC
  text: וַ/יֹּצִ֨יאוּ אֹת֜/וֹ כָּל הָ/עֵדָ֗ה אֶל מִ/חוּץ֙ לַֽ/מַּחֲנֶ֔ה וַ/יִּרְגְּמ֥וּ אֹת֛/וֹ בָּ/אֲבָנִ֖ים וַ/יָּמֹ֑ת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/036.yaml
  text: So the whole congregation brought him outside the camp and stoned him with stones, and he died, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: तब सारी मण्डली उसे छावनी के बाहर ले गई और उसे पत्थरों से मारा, और वह मर गया—ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ इस्राएल के एकत्रित समुदाय को दर्शाता है; ‘मण्डली’ उसके सामूहिक अर्थ को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है, और ‘सारी’ כָּל को दर्शाता है।
- source_word: וַיֹּצִיאוּ אֹתוֹ
  choice: उसे ... बाहर ले गई
  rationale: हिफ़ील रूप का अर्थ ‘बाहर ले जाना’ है। एकवचन सामूहिक संज्ञा ‘मण्डली’ के साथ ‘ले गई’ स्वाभाविक हिन्दी है।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी से बाहर के स्थान की ओर गति बताता है; हिन्दी में ‘छावनी के बाहर ले गई’ स्पष्ट और मुहावरेदार है।
- source_word: וַיִּרְגְּמוּ אֹתוֹ בָּאֲבָנִים
  choice: उस पर पत्थर बरसाए
  rationale: רגם और स्पष्ट साधन בָּאֲבָנִים दोनों को यह वाक्यांश व्यक्त करता है। ‘पत्थर बरसाए’ आधुनिक हिन्दी में पत्थर मारकर दण्ड देने की क्रिया को स्वाभाविक रूप से बताता है।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: מות का सामान्य और प्रत्यक्ष अर्थ ‘मरना’ है; यह अनावश्यक व्याख्यात्मक विस्तार से बचता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: כַּאֲשֶׁר अनुरूपता को व्यक्त करता है, जबकि पूर्ण क्रिया צִוָּה पहले दी गई आज्ञा की ओर संकेत करती है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मण्डली’ और ‘छावनी’ परिचित बाइबलीय शब्द हैं; वाक्य मूल इब्रानी की क्रमिक कथा-रचना को स्वाभाविक हिन्दी में बनाए रखता है।
