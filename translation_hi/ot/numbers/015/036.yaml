review_pass:
  verdict: revise
  source_fidelity: The draft accurately conveys the whole congregation, removal outside the camp, death, and conformity with Yahweh's prior command to Moses. However, ‘उस पर पत्थर बरसाए’ is less precise than the Hebrew's direct judicial action of stoning him, and its plural verb sits awkwardly after the singular collective subject ‘मण्डली’.
  naturalness: The register is generally modern and dignified. ‘मण्डली’ and ‘छावनी’ are natural biblical Hindi. Revising the stoning clause to ‘उसे पत्थरों से मारा’ gives a clearer, more idiomatic formal rendering while retaining the explicit instrument.
  terminology: ‘यहोवा’ appropriately renders the Tetragrammaton as a personal divine name and is consistent with established Hindi biblical usage. ‘मण्डली,’ ‘छावनी,’ and ‘मूसा’ are suitable terms.
  issues:
  - severity: low
    issue: The stoning clause is imprecise and has a number-agreement awkwardness.
    rationale: ‘उस पर पत्थर बरसाए’ can suggest a barrage rather than directly rendering רגם (‘stone’), and ‘बरसाए’ is plural although ‘मण्डली’ is treated as a feminine singular collective in ‘ले गई’. ‘उसे पत्थरों से मारा’ directly represents the action and the explicitly stated stones.
  revised_text: तब सारी मण्डली उसे छावनी के बाहर ले गई और उसे पत्थरों से मारा, और वह मर गया—ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  revised_footnotes: []
  revision_rationale: 'The revision makes the judicial stoning action more direct and resolves the awkward shift from singular collective agreement to a plural verb, without adding interpretation or altering the source''s sequence: removal, stoning, death, and fulfillment of Yahweh''s command.'
