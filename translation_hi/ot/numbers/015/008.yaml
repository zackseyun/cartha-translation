base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/008.yaml
  text: And when you prepare a bull as a burnt offering or a sacrifice[a], to fulfill a vow or as peace offerings to Yahweh[b],
translation:
  language: hi
  text: और जब तुम याहवे के लिए किसी बैल को होमबलि या बलिदान के रूप में चढ़ाओ—मन्नत पूरी करने के लिए अथवा मेलबलि के रूप में[a]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेलबलि” का अनुवाद “शांतिबलि,” “सहभागिता-बलि” या “कुशल-मंगल का बलिदान” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כִּי
  choice: और जब
  rationale: इस विधिक प्रसंग में यह आगे आने वाली स्थिति का परिचय देता है; ‘और जब’ क्रम और शर्तात्मक भाव दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: תַעֲשֶׂה
  choice: चढ़ाओ
  rationale: मूल क्रिया सामान्यतः ‘करना/बनाना’ है, पर बलिदान-विधि में पशु को अर्पित करने का भाव है; हिंदी में ‘चढ़ाओ’ स्वाभाविक है।
- source_word: בֶן בָּקָר
  choice: किसी बैल को
  rationale: शाब्दिक मुहावरा ‘गोधन का पुत्र’ गोवंश के नर पशु को सूचित करता है; आयु स्पष्ट न होने के कारण ‘बछड़ा’ या ‘जवान बैल’ नहीं चुना गया।
- source_word: עֹלָה
  choice: होमबलि
  rationale: पूरी तरह जलाए जाने वाले बलिदान के लिए प्रचलित और संक्षिप्त हिंदी पारिभाषिक शब्द।
- source_word: זָבַח
  choice: बलिदान
  rationale: यह व्यापक बलिदानी पद है; इसे किसी अधिक विशिष्ट प्रकार तक सीमित नहीं किया गया।
- source_word: לְפַלֵּא נֶדֶר
  choice: मन्नत पूरी करने के लिए
  rationale: यह मुहावरा की गई मन्नत के अनुसार अर्पण करने, अर्थात उसे पूरा करने, का भाव देता है।
- source_word: שְׁלָמִים
  choice: मेलबलि
  rationale: यह स्थापित बलिदानी श्रेणी है; ‘मेलबलि’ शांति और सहभागिता से जुड़े अर्थक्षेत्र को संक्षेप में बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ अर्पण के प्राप्तकर्ता/उद्देश्य को दर्शाता है; ‘के लिए’ स्वाभाविक हिंदी है और יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है; उपाधि ‘प्रभु’ से बदलने के बजाय नाम को हिंदी में परिचित रूप ‘यहोवा’ के रूप में रखा गया।
- issue: שְׁלָמִים की बलिदानी श्रेणी
  choice: मेलबलि
  alternative: शांतिबलि; कुशल-मंगल का बलिदान
  rationale: ‘मेलबलि’ पारंपरिक श्रेणी को पहचानने योग्य रखता है, पर मूल शब्द के शांति, कल्याण और सहभागिता संबंधी व्यापक अर्थ को केवल एक व्याख्या में सीमित नहीं करता; विकल्प पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिंदी। बलिदानी पारिभाषिक शब्दों ‘होमबलि’ और ‘मेलबलि’ को पहचान और संक्षिप्तता के लिए रखा गया है। वाक्य अगले पद में जारी रहने के कारण अंत में पूर्णविराम नहीं लगाया गया।
