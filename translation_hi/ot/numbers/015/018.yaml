  text: 'Speak to the sons of Israel and say to them: When you come into the land to which I am bringing you,[a]'
translation:
  language: hi
  text: '“इस्राएलियों से बोल और उनसे कह: जब तुम उस देश में प्रवेश करोगे, जहाँ मैं तुम्हें ले जा रहा हूँ,[क]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'शाब्दिक: ‘इस्राएल के पुत्र।’ इसका अर्थ ‘इस्राएल की संतान’ या ‘इस्राएली’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: बात कर
  rationale: पिएल आज्ञार्थक यहाँ मूसा को परमेश्वर का निर्देश इस्राएलियों तक पहुँचाने को कहता है। ‘बात कर’ आधुनिक हिंदी में स्वाभाविक और प्रत्यक्ष है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यह सूत्रबद्ध सामुदायिक संबोधन पूरे इस्राएली समुदाय को सूचित करता है; ‘इस्राएलियों’ आधुनिक हिंदी में स्वाभाविक और अर्थ-सटीक है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: इब्रानी के क्रमिक आदेश और ‘उनसे कह’ की औपचारिक संरचना को सहज हिंदी में सुरक्षित रखता है।
- source_word: בְּבֹאֲכֶם
  choice: जब तुम ... पहुँचो
  rationale: בְּ के साथ infinitive construct कालवाचक अर्थ देता है। देश में प्रवेश कर पहुँचने के भाव के लिए ‘जब ... पहुँचो’ स्वाभाविक है।
- source_word: אֶל הָאָרֶץ
  choice: उस देश में
  rationale: בוא के साथ אֶל गंतव्य और प्रवेश को दर्शाता है; हिंदी में ‘देश में पहुँचना’ इस गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: जहाँ मैं तुम्हें ले जा रहा हूँ
  rationale: מֵבִיא का कृदंत जारी तथा भावी लक्ष्य की ओर परमेश्वर की सक्रिय अगुवाई दर्शाता है। שָׁמָּה को ‘जहाँ’ में समाहित करने से अनावश्यक पुनरुक्ति के बिना मूल अर्थ रहता है।
