source:
  edition: WLC
  text: וְ/אִם נֶ֥פֶשׁ אַחַ֖ת תֶּחֱטָ֣א בִ/שְׁגָגָ֑ה וְ/הִקְרִ֛יבָה עֵ֥ז בַּת שְׁנָתָ֖/הּ לְ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/027.yaml
  text: But if one person sins unintentionally[a], then she shall present a one-year-old female goat as a sin offering.
translation:
  language: hi
  text: परन्तु यदि कोई एक व्यक्ति अनजाने में पाप करे, तो वह पापबलि[a] के रूप में एक वर्ष की बकरी चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת उस बलि को भी सूचित कर सकता है जो पाप या अशुद्धता को दूर करने के लिए चढ़ाई जाती है, न कि केवल पाप को।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह संयोजन पिछले विधान के बाद एक अलग, विपरीत स्थिति प्रस्तुत करता है; इसलिए केवल “यदि” की अपेक्षा “परन्तु यदि” संदर्भगत संबंध को अधिक स्पष्ट करता है।
- source_word: נֶפֶשׁ אַחַת
  choice: कोई एक व्यक्ति
  rationale: विधिक संदर्भ में נֶפֶשׁ का अर्थ व्यक्ति है; “एक” मूल के एकवचन और व्यक्तिगत मामले पर बल को बनाए रखता है।
- source_word: תֶּחֱטָא בִשְׁגָגָה
  choice: अनजाने में पाप करे
  rationale: בִשְׁגָגָה भूल या अनिच्छित रीति से किए गए अपराध को जानबूझकर किए गए पाप से अलग करता है। “पाप करे” शर्तवाचक विधिक शैली में स्वाभाविक है।
- source_word: וְהִקְרִיבָה
  choice: तो वह ... चढ़ाए
  rationale: बलिदानी संदर्भ में קרב का हिफ़ील रूप किसी भेंट को प्रस्तुत या अर्पित करने का अर्थ देता है। “तो” शर्त के परिणाम को स्पष्ट करता है और “चढ़ाए” हिन्दी की स्वाभाविक बलिदानी शब्दावली है।
- source_word: עֵז
  choice: बकरी
  rationale: यहाँ संज्ञा मादा बकरी को सूचित करती है; हिन्दी में “बकरी” स्वयं मादा पशु को स्पष्ट करती है।
- source_word: בַּת שְׁנָתָהּ
  choice: एक वर्ष की
  rationale: यह इब्रानी मुहावरा पशु के पहले वर्ष में होने, अर्थात लगभग एक वर्ष का होने, को व्यक्त करता है; हिन्दी में “एक वर्ष की” संक्षिप्त और स्वाभाविक है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: याजकीय बलिदानी संदर्भ में חַטָּאת उस बलि को दर्शाता है जो पाप या अशुद्धता से निपटती है। “पापबलि” हिन्दी पाठकों के लिए स्पष्ट और प्रचलित पद है।
theological_decisions:
- issue: एकवचन अपराधी का लिंग
  choice: “कोई एक व्यक्ति ... वह” द्वारा लिंग-निरपेक्ष रूप
  alternative: इब्रानी के स्त्रीलिंग व्याकरण के अनुसार अपराधी को स्त्री के रूप में व्यक्त करना
  rationale: נֶפֶשׁ इब्रानी में व्याकरणतः स्त्रीलिंग है और उसके साथ क्रियाएँ भी स्त्रीलिंग हैं; इससे यह आवश्यक रूप से सिद्ध नहीं होता कि विधान केवल स्त्रियों पर लागू है। हिन्दी में “व्यक्ति ... वह ... चढ़ाए” मूल की एकवचनता बनाए रखते हुए अनुचित जैविक लिंग-विशेष आरोपित नहीं करता।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: मुख्य पाठ में “पापबलि”
  alternative: “शुद्धिकरण-बलि”
  rationale: यह पद पाप से संबंधित बलि को दर्शाता है, पर याजकीय प्रसंगों में उसके शुद्धिकरण संबंधी अनुष्ठानिक कार्य पर भी बल हो सकता है। परिचित पद मुख्य पाठ में रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली रखी गई है। “परन्तु यदि ... तो” शर्त और उसके परिणाम को स्पष्ट करता है; “चढ़ाए” धार्मिक संदर्भ में सहज है।
