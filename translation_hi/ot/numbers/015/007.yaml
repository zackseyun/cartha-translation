source:
  edition: WLC
  text: וְ/יַ֥יִן לַ/נֶּ֖סֶךְ שְׁלִשִׁ֣ית הַ/הִ֑ין תַּקְרִ֥יב רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/007.yaml
  text: and wine for the drink offering[a], a third of a hin, you shall present[c][b], a pleasing aroma to Yahweh.
translation:
  language: hi
  text: और पेय-बलि[a] के लिए एक-तिहाई हीन[b] दाखरस याहवे को सुखद सुगंध[c] के रूप में चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पेय-अर्पण”; इब्रानी शब्द बलिदान के साथ उंडेले जाने वाले पेय-अर्पण को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: हीन प्राचीन काल में द्रव नापने की एक इकाई थी।
    reason: cultural_note
  - marker: c
    text: या “मनभावनी सुगंध” अथवा “शांतिदायक सुगंध”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיַיִן
  choice: और ... दाखमधु
  rationale: יַיִן का सामान्य अर्थ दाखमधु है; आरम्भिक וְ इस निर्देश को पिछले बलिदानी निर्देश से जोड़ता है। हिंदी वाक्य-क्रम के कारण ‘दाखमधु’ को मात्रा के बाद रखा गया है।
- source_word: לַנֶּסֶךְ
  choice: पेय-बलि के लिए
  rationale: נֶסֶךְ बलिदान के साथ उंडेला जाने वाला द्रव-अर्पण है। ‘पेय-बलि’ आधुनिक पाठक के लिए अपेक्षाकृत स्पष्ट है और अर्पण की विधिक प्रकृति बनाए रखता है।
- source_word: שְׁלִשִׁית הַהִין
  choice: एक-तिहाई हीन
  rationale: मूल पाठ की प्राचीन माप-इकाई ‘हीन’ को अनुमानित आधुनिक मात्रा में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: תַּקְרִיב
  choice: चढ़ाना
  rationale: קרב का हिफ़ील रूप बलिदानी प्रसंग में किसी वस्तु को अर्पित करने या समीप लाने का निर्देश देता है। हिंदी विधिक-निर्देश शैली में ‘चढ़ाना’ स्वाभाविक और स्पष्ट है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखद सुगंध के रूप में
  rationale: यह स्थिर बलिदानी पद अर्पण के परमेश्वर को स्वीकार्य होने का भाव व्यक्त करता है। ‘सुखद सुगंध’ इंद्रिय-बिंब को बनाए रखता है, जबकि ‘के रूप में’ हिंदी में इसकी क्रियाविशेषणीय भूमिका स्पष्ट करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘यहोवा’ हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: רֵיחַ נִיחֹחַ का बलिदानी आशय
  choice: सुखद सुगंध
  alternative: मनभावनी सुगंध; शांतिदायक सुगंध
  rationale: अनुवाद मूल के सुगंध-बिंब और अर्पण की स्वीकार्यता दोनों को बनाए रखता है, पर यह अतिरिक्त दावा नहीं करता कि वाक्यांश का आशय केवल क्रोध शांत करना है।
translation_notes:
  register: आधुनिक मानक हिंदी की संक्षिप्त विधिक-निर्देश शैली अपनाई गई है। ‘दाखमधु’, ‘पेय-बलि’ और ‘चढ़ाना’ गरिमापूर्ण किंतु सामान्य बाइबलीय शब्दावली हैं। वाक्य-क्रम को स्वाभाविक हिंदी के अनुरूप रखा गया है और मूल की बलिदानी सुगंध-छवि सुरक्षित रखी गई है।
