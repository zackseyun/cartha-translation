  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सरल आज्ञार्थक शैली रखी गई है। अस्वाभाविक शाब्दिक पदबंध ‘तुम्हारे निवासों का देश’ को मुख्य पाठ में अर्थ-स्पष्ट संबंधवाचक वाक्य बनाया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
