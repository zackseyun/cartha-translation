- issue: नֹתֵן में परमेश्वर के दान का काल-पक्ष
  choice: मैं तुम्हें दे रहा हूँ
  alternative: मैं तुम्हें देता हूँ / मैं तुम्हें दूँगा
  rationale: वर्तमान कृदन्त प्रतिज्ञात दान की निकटता और निश्चितता को व्यक्त करता है; केवल भविष्यकाल चुनने से मूल से अधिक समयगत विशिष्टता आ सकती है।
