base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/002.yaml
  text: Speak to the sons of Israel and say to them[a], ‘When you come into the land of your dwellings[b], which I am giving to you,’
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] से बात कर और उनसे कह, ‘जब तुम उस देश में आओगे जहाँ तुम बसोगे[b], जिसे मैं तुम्हें दे रहा हूँ,’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल की सन्तान।” इब्रानी में शाब्दिक अर्थ “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “तुम्हारे निवासों का देश”; इसका अनुवाद “वह देश जहाँ तुम निवास करोगे” या “तुम्हारी बस्तियों का देश” भी हो सकता है।
