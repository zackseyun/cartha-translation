  text: וְ/נִסְלַ֗ח לְ/כָל עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/לַ/גֵּ֖ר הַ/גָּ֣ר בְּ/תוֹכָ֑/ם כִּ֥י לְ/כָל הָ/עָ֖ם בִּ/שְׁגָגָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/026.yaml
  text: And all the congregation of the sons of Israel shall be forgiven[a], along with the sojourner who sojourns among them[c][b], because for all the people it was done unintentionally.
translation:
  language: hi
  text: और इस्राएलियों की सारी मण्डली[a] को और उनके बीच रहनेवाले परदेशी[b] को क्षमा किया जाएगा, क्योंकि सारे लोगों से यह अनजाने में हुआ था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “इस्राएल के पुत्रों की सारी मण्डली”; इसका अर्थ “इस्राएलियों का पूरा समुदाय” भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “परदेशी” से आशय उस गैर-इस्राएली निवासी से है जो इस्राएलियों के बीच रहकर समुदाय की व्यवस्था और संरक्षण के अधीन था।
    reason: cultural_note
  - marker: c
    text: इब्रानी का अंतिम वाक्यांश संक्षिप्त है; इसका अनुवाद “क्योंकि सारे लोग भूल में थे” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְנִסְלַח
  choice: क्षमा किया जाएगा
  rationale: निफ़अल अपूर्ण रूप यहाँ भाववाचक/कर्मवाच्य अर्थ देता है; हिन्दी का कर्मवाच्य समुदाय और परदेशी—दोनों को मिलने वाली क्षमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְכָל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी मण्डली
  rationale: עֵדָה का सामुदायिक और विधिक भाव ‘मण्डली’ से बना रहता है। ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक है; शब्दशः ‘इस्राएल के पुत्रों’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: और उनके बीच रहनेवाले परदेशी को
  rationale: גֵּר उस गैर-इस्राएली निवासी को दर्शाता है जो समुदाय के बीच रहकर उसकी व्यवस्था और संरक्षण के अधीन था। ‘परदेशी’ प्रचलित, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है; सहभागी रूप הַגָּר को ‘रहनेवाले’ से व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह संयोजक पहले कथन में दी गई क्षमा का कारण प्रस्तुत करता है।
- source_word: לְכָל הָעָם בִּשְׁגָגָה
  choice: क्योंकि यह सारे लोगों से अनजाने में हुआ था
  rationale: यह विधिक प्रसंग में सामूहिक अनजाने अपराध का अर्थ स्पष्ट करता है, जबकि इब्रानी की संक्षिप्त और कुछ हद तक दीर्घवृत्तीय रचना का वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्षमा का सामूहिक विस्तार
  choice: क्षमा इस्राएल की सारी मण्डली के साथ उनके बीच रहनेवाले परदेशी तक भी पहुँचती है।
  alternative: पद को केवल मूल इस्राएली समुदाय के संदर्भ में सीमित समझना।
  rationale: וְלַגֵּר स्पष्ट रूप से निवासी परदेशी को भी उसी क्षमा में सम्मिलित करता है; अनुवाद इस समावेश को बिना अतिरिक्त धर्मसैद्धान्तिक व्याख्या के रखता है।
- issue: अंतिम उपवाक्य की दीर्घवृत्तीय अस्पष्टता
  choice: यह सारे लोगों से अनजाने में हुआ था
  alternative: सारे लोग भूल में थे
  rationale: इब्रानी לְכָל הָעָם בִּשְׁגָגָה अत्यंत संक्षिप्त है और उसमें स्पष्ट क्रिया नहीं है। मुख्य पाठ विधिक प्रसंग के अनुसार अनजाने किए गए काम को व्यक्त करता है, जबकि वैकल्पिक वाचन पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज विधिक-धार्मिक शैली रखी गई है। ‘मण्डली’, ‘परदेशी’ और ‘अनजाने में’ जैसे शब्द प्रसंग की सामुदायिक, सामाजिक और अनिच्छित अपराध-संबंधी विशेषताओं को स्पष्ट रखते हैं।
