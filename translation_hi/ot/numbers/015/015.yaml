id: NUM.15.15
reference: Numbers 15:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/קָּהָ֕ל חֻקָּ֥ה אַחַ֛ת לָ/כֶ֖ם וְ/לַ/גֵּ֣ר הַ/גָּ֑ר חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם כָּ/כֶ֛ם כַּ/גֵּ֥ר יִהְיֶ֖ה לִ/פְנֵ֥י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/015.yaml
  text: For the assembly[a], there shall be one statute for you and for the sojourner who sojourns with you, a permanent statute throughout your generations. As you are[b], so shall the sojourner be before Yahweh.
translation:
  language: hi
  text: सभा के लिए एक ही विधि होगी—तुम्हारे लिए और तुम्हारे बीच रहनेवाले परदेशी[a] के लिए भी। यह पीढ़ी-दर-पीढ़ी तुम्हारे लिए स्थायी विधि[b] होगी। याहवे के सामने जैसा तुम हो, वैसा ही परदेशी भी होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रवासी’ अथवा ‘निवासी विदेशी’।
    reason: lexical_alternative
  - marker: b
    text: या ‘सदा की विधि’ अथवा ‘चिरस्थायी विधि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקָּהָל
  choice: सभा
  rationale: यह शब्द एकत्र समुदाय को दर्शाता है। ‘सभा’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से कलीसियाई अर्थ नहीं जोड़ता।
- source_word: חֻקָּה אַחַת
  choice: एक ही विधि
  rationale: ‘विधि’ निर्धारित कानूनी नियम का भाव देता है, और ‘एक ही’ दोनों समूहों पर समान नियम लागू होने पर बल बनाए रखता है।
- source_word: לָכֶם וְלַגֵּר הַגָּר
  choice: तुम्हारे लिए और तुम्हारे बीच रहनेवाले परदेशी के लिए
  rationale: גֵּר यहाँ इस्राएलियों के बीच निवास करनेवाले गैर-इस्राएली को सूचित करता है। कृदन्त הַגָּר को ‘रहनेवाले’ कहने से उसके निरंतर निवास का भाव बना रहता है।
- source_word: חֻקַּת עוֹלָם
  choice: स्थायी विधि
  rationale: कानूनी सूत्र में עוֹלָם पीढ़ियों तक बने रहने को व्यक्त करता है। ‘स्थायी’ इस भाव को स्वाभाविक आधुनिक हिन्दी में देता है, बिना दार्शनिक अनंतता को अनिवार्य किए।
- source_word: לְדֹרֹתֵיכֶם
  choice: पीढ़ी-दर-पीढ़ी तुम्हारे लिए
  rationale: यह पद क्रमागत पीढ़ियों में निरंतर लागू रहने का भाव प्रकट करता है।
- source_word: כָּכֶם כַּגֵּר יִהְיֶה
  choice: जैसा तुम हो, वैसा ही परदेशी भी होगा
  rationale: तुलनात्मक रचना दोनों के बीच समानता पर बल देती है; हिन्दी वाक्य वही संतुलन बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: ‘के सामने’ उपस्थिति और दैवी दृष्टि के वाचा-संबंधी संदर्भ को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिवाचक ईश्वरीय नाम को हिन्दी में लिप्यंतरित किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: इस्राएल की उपासना-संबंधी व्यवस्था में निवासी परदेशी की वैधानिक स्थिति
  choice: इस प्रसंग में सभा और उनके बीच रहनेवाले परदेशी पर एक ही विधि लागू होने की समानता व्यक्त की गई है।
  alternative: इसे केवल निकटवर्ती बलिदान-संबंधी नियमों तक सीमित कथन माना जा सकता है।
  rationale: पद दोनों समूहों के लिए ‘एक ही विधि’ और याहवे के सामने समानता पर स्पष्ट बल देता है। अनुवाद इस समानता को सुरक्षित रखता है, पर इसे तत्काल प्रसंग से आगे सार्वभौमिक दावे के रूप में विस्तृत नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। कानूनी समानता दिखाने के लिए ‘एक ही’ और ‘वैसा ही’ का प्रयोग किया गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्न अपने विषयों से असंगत स्थानों पर थे; हिन्दी पाठ में उन्हें संबंधित शब्दों के साथ रखा गया है।
