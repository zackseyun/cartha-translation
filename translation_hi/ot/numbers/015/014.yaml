source:
  edition: WLC
  text: וְ/כִֽי יָגוּר֩ אִתְּ/כֶ֨ם גֵּ֜ר א֤וֹ אֲשֶֽׁר בְּ/תֽוֹכְ/כֶם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָשָׂ֛ה אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָ֑ה כַּ/אֲשֶׁ֥ר תַּעֲשׂ֖וּ כֵּ֥ן יַעֲשֶֽׂה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/014.yaml
  text: And if a sojourner is staying with you[a], or anyone who is among you throughout your generations, and he offers a food offering, a pleasing aroma to Yahweh, just as you do, so he shall do.
translation:
  language: hi
  text: और यदि कोई परदेशी तुम्हारे साथ रहे, या तुम्हारी पीढ़ियों तक तुम्हारे बीच रहनेवाला कोई भी व्यक्ति हो, और वह यहोवा के लिए सुखद सुगन्ध देनेवाला अग्नि-चढ़ावा[a] चढ़ाए, तो जैसा तुम करते हो, वैसा ही वह भी करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आग में चढ़ाया जानेवाला चढ़ावा।’
    reason: אִשֵּׁה के अग्नि-संबंधी अर्थ का वैकल्पिक, अधिक व्याख्यात्मक अनुवाद।
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: पूर्ववर्ती व्यवस्था से संबंध रखते हुए शर्त प्रस्तुत करता है और וְ का संयोजक बल बनाए रखता है।
- source_word: יָגוּר ... גֵּר
  choice: कोई परदेशी ... रहता हो
  rationale: גור और גֵּר मिलकर इस्राएलियों के बीच रहने वाले गैर-स्थानीय निवासी की कानूनी-सामाजिक स्थिति बताते हैं; आधुनिक हिन्दी में ‘परदेशी’ संक्षिप्त और सहज है।
- source_word: אִתְּכֶם ... בְּתוֹכְכֶם
  choice: तुम्हारे साथ ... तुम्हारे बीच
  rationale: दोनों भिन्न पूर्वसर्गीय अभिव्यक्तियों का अंतर सुरक्षित रखा गया है।
- source_word: אוֹ אֲשֶׁר בְּתוֹכְכֶם לְדֹרֹתֵיכֶם
  choice: या तुम्हारी पीढ़ी-दर-पीढ़ी कोई और तुम्हारे बीच रहता हो
  rationale: अस्पष्ट सापेक्ष रचना को स्वाभाविक हिन्दी में व्यक्त करते हुए व्यवस्था की निरंतर पीढ़ीगत प्रयोज्यता बनाए रखता है।
- source_word: וְעָשָׂה
  choice: और वह ... चढ़ाए
  rationale: बलिदानी संदर्भ में עשה का आशय चढ़ावा प्रस्तुत करना है; ‘चढ़ाए’ हिन्दी का स्वाभाविक धार्मिक-कानूनी प्रयोग है।
- source_word: אִשֵּׁה
  choice: अग्नि-चढ़ावा
  rationale: यह शब्द आग के द्वारा चढ़ाए गए बलिदानी अर्पण को सूचित करता है। ‘अग्नि-चढ़ावा’ मूल की अग्नि-संबंधी धारणा बनाए रखता है और परमेश्वर के भोजन का अनावश्यक अर्थ आरोपित नहीं करता।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखद सुगन्धवाला
  rationale: बलिदान की स्वीकार्यता व्यक्त करने वाले मूल रूपक को स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: दिव्य नाम יהוה को ‘यहोवा’ से प्रत्यक्ष रूप में प्रस्तुत किया गया है; לְ यहाँ चढ़ावे की दिशा अथवा समर्पण बताता है।
- source_word: כַּאֲשֶׁר תַּעֲשׂוּ כֵּן יַעֲשֶׂה
  choice: जैसा तुम करते हो, वैसा ही वह भी करे
  rationale: तुलनात्मक कानूनी सूत्र और इस प्रसंग में समान विधि का निर्देश दोनों सुरक्षित हैं।
theological_decisions:
- issue: बलिदानी उपासना में गैर-इस्राएली निवासी की स्थिति
  choice: इस निर्दिष्ट चढ़ावे के विषय में परदेशी को वही विधि अपनानी है जो इस्राएली अपनाते हैं।
  alternative: इसे केवल ऐसे स्थायी परदेशी पर लागू समझा जा सकता है जो पहले से इस्राएल के सामुदायिक और वाचागत जीवन में सम्मिलित हो।
  rationale: ‘जैसा तुम करते हो, वैसा ही वह भी करे’ इस मामले में आचरण की समानता पर बल देता है, पर पद व्यापक वाचागत स्थिति को स्पष्ट नहीं करता; अनुवाद उस प्रश्न का निर्णय नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन रखा गया है। शैली कानूनी होते हुए भी सहज और गरिमापूर्ण है। ‘परदेशी’ को आधुनिक राजनीतिक अर्थ वाले शब्दों की अपेक्षा चुना गया है, और ‘यहोवा’ मूल के व्यक्तिगत दिव्य नाम को दर्शाता है।
