  yaml_path: translation/ot/numbers/015/029.yaml
  text: The same law shall apply to the native-born Israelite and to the resident foreigner[a] living among you when either acts unintentionally.
translation:
  language: hi
  text: इस्राएलियों में जन्मे व्यक्ति और तुम्हारे बीच रहने वाले परदेशी[a], दोनों के लिए एक ही व्यवस्था होगी, यदि इनमें से कोई अनजाने में कार्य करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय ऐसे गैर-इस्राएली निवासी से है जो इस्राएली समुदाय के बीच रहता है।
    reason: cultural_note
lexical_decisions:
- source_word: הָאֶזְרָח בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में जन्मा व्यक्ति
  rationale: यह पदबंध इस्राएली समुदाय के मूल निवासी सदस्य को दर्शाता है। यह सहज हिन्दी में उसकी जन्मगत सामुदायिक पहचान स्पष्ट करता है।
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: तुम्हारे बीच रहने वाला परदेशी
  rationale: גֵּר यहाँ राह चलते अजनबी नहीं, बल्कि समुदाय में रहने वाले गैर-मूल निवासी को दर्शाता है। ‘तुम्हारे बीच’ सम्बोधित समुदाय के द्वितीय पुरुष रूप को बनाए रखता है।
- source_word: תּוֹרָה אַחַת יִהְיֶה לָכֶם
  choice: तुम्हारे लिए एक ही व्यवस्था होगी
  rationale: תּוֹרָה אַחַת दोनों समूहों पर समान नियम लागू होने पर बल देता है। ‘व्यवस्था’ इस कानूनी-सांस्कृतिक प्रसंग में स्वाभाविक और गरिमापूर्ण है।
- source_word: לָעֹשֶׂה בִּשְׁגָגָה
  choice: जब कोई अनजाने में कोई काम कर बैठे
  rationale: एकवचन कृदंत सामान्य रूप से दोनों में से किसी भी समूह के व्यक्ति पर लागू होता है; בִּשְׁגָגָה जानबूझकर न किए गए कार्य को बताता है। ‘कर बैठे’ अनचाहे या भूलवश किए जाने का भाव सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अनजाने में किए गए कार्यों के विषय में मूल इस्राएली और निवासी परदेशी पर व्यवस्था का समान लागू होना
  choice: पद को दोनों समूहों के लिए एक ही व्यवस्था के कथन के रूप में अनूदित किया गया है।
  alternative: ‘एक ही शिक्षा’ या ‘एक ही नियम’ कहा जा सकता है।
  rationale: इब्रानी पाठ तत्कालीन कानूनी प्रसंग में समान व्यवहार पर बल देता है; अनुवाद इससे आगे कोई व्यापक धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी भाव के लिए ‘व्यवस्था’ और सामान्य पाठक की स्पष्टता के लिए सहज वाक्य-विन्यास अपनाया गया है। ‘अनजाने में’ मूल पाठ की अनैच्छिकता को बनाए रखता है।
