source:
  edition: WLC
  text: וְ/יַ֛יִן תַּקְרִ֥יב לַ/נֶּ֖סֶךְ חֲצִ֣י הַ/הִ֑ין אִשֵּׁ֥ה רֵֽיחַ נִיחֹ֖חַ לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/010.yaml
  text: And you shall present wine for the drink offering[a], half a hin, an offering made by fire, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: और पेय-अर्पण के लिए आधा हिन दाखमधु चढ़ाना—याहवे के लिए सुखद सुगंध वाला अग्नि-अर्पण।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיַיִן
  choice: और ... दाखमधु
  rationale: יַיִן का अर्थ अंगूर से बनी मदिरा है। ‘दाखमधु’ आधुनिक हिन्दी में अर्थ को स्पष्ट रखते हुए बाइबिलीय गरिमा बनाए रखता है; וְ को ‘और’ से व्यक्त किया गया है।
- source_word: תַּקְרִיב
  choice: चढ़ाना
  rationale: קרב के हिफ़ील रूप का बल किसी वस्तु को बलिदानी अर्पण के रूप में निकट लाने या प्रस्तुत करने पर है। विधिक निर्देश की हिन्दी शैली में ‘चढ़ाना’ स्वाभाविक है।
- source_word: לַנֶּסֶךְ
  choice: अर्घ के लिए
  rationale: נֶסֶךְ किसी उंडेले जानेवाले पेय-अर्पण को दर्शाता है। ‘अर्घ’ संक्षिप्त और स्थापित हिन्दी धार्मिक शब्द है।
- source_word: חֲצִי הַהִין
  choice: आधा हिन
  rationale: प्राचीन माप ‘हिन’ को अनुमानित आधुनिक मात्रा में बदलने के बजाय मूल इकाई के रूप में रखा गया है।
- source_word: אִשֵּׁה
  choice: आग में चढ़ाया जानेवाला अर्पण
  rationale: पुरोहितीय भाषा का यह शब्द अग्नि से संबद्ध अर्पण को सूचित करता है। यह अनुवाद उस संबंध को स्पष्ट करता है, जबकि संक्षिप्त वैकल्पिक रूप पादटिप्पणी में दिया गया है।
- source_word: רֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध मनभावनी है
  rationale: यह स्थिर बलिदानी अभिव्यक्ति अर्पण की स्वीकार्यता बताती है। संबंधवाचक हिन्दी वाक्य रचना स्वाभाविक है और ‘मनभावनी’ נִיחֹחַ का भाव रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ को लाभार्थी/समर्पण के अर्थ में ‘के लिए’ कहा गया है और परमेश्वर के व्यक्तिगत नाम יהוה को ‘याहवे’ लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय सीधे लिप्यंतरित किया गया है।
- issue: אִשֵּׁה का अर्थ
  choice: आग में चढ़ाया जानेवाला अर्पण
  alternative: अग्नि-अर्पण / खाद्य-अर्पण
  rationale: शब्द की अग्नि-संबद्ध पारंपरिक और व्युत्पत्तिगत समझ को मुख्य पाठ में रखा गया है। ‘खाद्य-अर्पण’ संभावित व्यापक पुरोहितीय कार्यगत अर्थ है, पर इस पद में उसे चुनना मूल की अग्नि-संबद्धता को अनावश्यक रूप से दबा सकता है।
- issue: רֵיחַ נִיחֹחַ में सुगंध और स्वीकार्यता
  choice: जिसकी सुगंध मनभावनी है
  alternative: सुखदायक सुगंध
  rationale: मूल की रूपकात्मक बलिदानी भाषा को बनाए रखा गया है, बिना यह विस्तार जोड़े कि सुगंध किसे प्रसन्न करती है या परमेश्वर को किस प्रकार ‘शांत’ करती है।
translation_notes:
  register: भाषा आधुनिक, निर्देशात्मक और गरिमापूर्ण रखी गई है। ‘अर्घ’ और ‘हिन’ जैसे बाइबिलीय-बलिदानी पद सुरक्षित हैं; वाक्य-विन्यास को सहज हिन्दी के लिए दो वाक्यों में बाँटा गया है।
