  yaml_path: translation/ot/numbers/015/034.yaml
  text: So they put him in custody[a], because it had not been made clear what should be done to him.
translation:
  language: hi
  text: तब उन्होंने उसे हिरासत में रखा, क्योंकि यह स्पष्ट नहीं किया गया था[a] कि उसके साथ क्या किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह निर्धारित नहीं किया गया था कि उसके साथ क्या किया जाए।”
    reason: פרש के निष्क्रिय रूप में ‘स्पष्ट किया गया’ और ‘निर्धारित किया गया’ दोनों अर्थ-सूक्ष्मताएँ संभव हैं।
lexical_decisions:
- source_word: וַיַּנִּיחוּ
  choice: उन्होंने … रखा
  rationale: नוח के हिफ़ील रूप का अर्थ यहाँ किसी को किसी स्थिति या स्थान में रखना है। ‘हिरासत में रखा’ आधुनिक हिन्दी में स्वाभाविक है और अस्थायी निरुद्धता का भाव देता है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मवाचक सर्वनाम है, जो पिछले प्रसंग में लकड़ियाँ बटोरते पाए गए व्यक्ति को सूचित करता है।
- source_word: בַּמִּשְׁמָר
  choice: हिरासत में
  rationale: מִשְׁמָר पहरे, अभिरक्षा या निरुद्ध रखने की अवस्था/जगह को सूचित कर सकता है। ‘हिरासत में’ कानूनी निर्णय से पहले रोके रखने का भाव व्यक्त करता है, पर इसे औपचारिक कारावास नहीं बनाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उसे हिरासत में रखने का कारण प्रस्तुत करता है।
- source_word: לֹא פֹרַשׁ
  choice: यह स्पष्ट नहीं किया गया था
  rationale: פרש का निष्क्रिय रूप बताता है कि अपेक्षित कार्रवाई स्पष्ट रूप से घोषित या निर्धारित नहीं हुई थी। यह अनुवाद निष्क्रिय रचना और प्रक्रियागत अनिश्चितता दोनों बनाए रखता है।
- source_word: מַה יֵּעָשֶׂה לוֹ
  choice: कि उसके साथ क्या किया जाए
  rationale: यह हिन्दी में स्वाभाविक विधिक-विचारात्मक अभिव्यक्ति है और उस व्यक्ति के विषय में की जाने वाली कार्रवाई को खुला रखती है।
theological_decisions:
- issue: कानूनी प्रक्रिया में अनिश्चितता का स्वरूप
  choice: आवश्यक कार्रवाई अभी स्पष्ट नहीं की गई थी।
  alternative: विशेष दंड अभी घोषित या निर्धारित नहीं किया गया था।
  rationale: इब्रानी निष्क्रिय अभिव्यक्ति केवल स्पष्ट विनिर्देश के अभाव पर बल देती है। अनुवाद इसे सामान्य व्यवस्था की अज्ञानता या किसी निश्चित दंड तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। ‘हिरासत’ प्रक्रियागत रोक को व्यक्त करती है और ‘कारागार’ की अपेक्षा मूल पाठ से अधिक कठोर अर्थ जोड़ने से बचती है।
