  yaml_path: translation/ot/numbers/015/005.yaml
  text: And you shall prepare a quarter of a hin of wine for the drink offering, with the burnt offering or for the sacrifice, for each lamb.
translation:
  language: hi
  text: और हर एक मेम्ने के लिए होमबलि या बलिदान के साथ पेय-बलि के लिए एक चौथाई हिन दाखमधु तैयार करना।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अधिक शाब्दिक अनुवाद ‘होमबलि पर’ है। यहाँ इब्रानी संबंधसूचक शब्द संभवतः बलिदान-विधि में साथ दिए जाने का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ ‘उस एक मेम्ने के लिए’ है; ‘हर एक मेम्ने के लिए’ निर्देश के वितरणात्मक भाव को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/יַיִן
  choice: और ... दाखमधु
  rationale: וְ पिछले निर्देश से जोड़ता है और יַיִן सामान्यतः दाखमधु को दर्शाता है। हिंदी में वाक्य के स्वाभाविक क्रम के अनुसार दोनों को अलग स्थान दिया गया है।
- source_word: לַ/נֶּסֶךְ
  choice: अर्घ के रूप में
  rationale: बलिदान-संबंधी प्रसंग में נֶסֶךְ उंडेला जाने वाला दाखमधु-अर्पण है। ‘अर्घ’ संक्षिप्त और प्रतिष्ठित हिंदी धार्मिक पद है; ‘के रूप में’ प्रयोजन स्पष्ट करता है।
- source_word: רְבִיעִית הַ/הִין
  choice: एक चौथाई हिन
  rationale: मूल मात्रा और प्राचीन माप-इकाई दोनों सुरक्षित रखी गई हैं; आधुनिक इकाई में अनुमानित परिवर्तन नहीं किया गया।
- source_word: תַּעֲשֶׂה
  choice: तैयार करना
  rationale: עָשָׂה का मूल अर्थ करना/बनाना है, पर इस अनुष्ठानिक निर्देश में दाखमधु-अर्घ तैयार करने का भाव स्वाभाविक है। निकटवर्ती विधि-वाक्यों के अनुरूप हिंदी में निर्देशात्मक क्रियारूप रखा गया है।
- source_word: עַל הָ/עֹלָה
  choice: होमबलि ... के साथ
  rationale: עַל का अधिक शाब्दिक अर्थ ‘पर’ है, किंतु यहाँ वह अनुष्ठान में अर्घ के साथ होने का संबंध सूचित करता है; ‘के साथ’ आधुनिक हिंदी में स्पष्ट है।
- source_word: א֣וֹ לַ/זָּבַח
  choice: या बलिदान के साथ
  rationale: זֶבַח को व्यापक ‘बलिदान’ से व्यक्त किया गया है और उसे עֹלָה ‘होमबलि’ से अलग रखा गया है। לְ के संबंध को समानांतर हिंदी रचना में ‘के साथ’ व्यक्त किया गया है।
- source_word: לַ/כֶּבֶשׂ הָ/אֶחָד
  choice: हर एक मेम्ने के लिए
  rationale: शाब्दिक रूप ‘उस एक मेम्ने के लिए’ है; विधिक प्रसंग में इसका वितरणात्मक आशय प्रति मेम्ना निर्धारित मात्रा बताना है।
