  yaml_path: translation/ot/numbers/015/009.yaml
  text: then he shall present with the bull a grain offering of fine flour[a], three-tenths of an ephah, mixed with half a hin of oil.
translation:
  language: hi
  text: 'तब वह बछड़े के साथ अन्नबलि चढ़ाए: एपा का तीन-दसवाँ भाग बारीक मैदा[a], जो आधे हीन तेल में मिला हुआ हो।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल पाठ में शाब्दिक रूप से ‘तीन दशमांश’ है; इस बलिदान-संबंधी संदर्भ में इसका अर्थ एपा का तीन-दसवाँ भाग समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: तब वह ... चढ़ाए
  rationale: हिफ़ील रूप बलिदान-संबंधी संदर्भ में किसी भेंट को पास लाने या अर्पित करने का भाव देता है। ‘चढ़ाए’ स्वाभाविक धार्मिक हिन्दी है, और ‘तब’ प्रक्रियात्मक क्रम में वाव को व्यक्त करता है।
- source_word: עַל בֶּן הַבָּקָר
  choice: बछड़े के साथ
  rationale: עַל यहाँ स्थानसूचक ‘ऊपर’ नहीं, बल्कि साथ दी जाने वाली भेंट का संबंध बताता है। בֶּן הַבָּקָר गोवंश के बलि-पशु के लिए मुहावरा है; निकटवर्ती संदर्भ के अनुरूप ‘बछड़ा’ स्पष्ट और सहज है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: याजकीय बलिदान-विधि में यह सामान्य भेंट नहीं, अनाज से बनी विशिष्ट भेंट को दर्शाता है। ‘अन्नबलि’ संक्षिप्त, प्रतिष्ठित और समझने योग्य है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलियों में प्रयुक्त बारीक, परिष्कृत आटे को दर्शाता है; आधुनिक हिन्दी में ‘मैदा’ इसका सहज समतुल्य है।
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: एपा का तीन-दसवाँ भाग
  rationale: मूल में शाब्दिक रूप से ‘तीन दशमांश’ है। बलिदान-संबंधी माप-प्रयोग में आधार इकाई एपा समझी जाती है; उसे मुख्य पाठ में स्पष्ट करना पाठक के लिए उपयोगी है।
- source_word: בָּלוּל בַּשֶּׁמֶן
  choice: तेल मिलाकर
  rationale: निष्क्रिय कृदंत आटे के तेल से मिश्रित होने को बताता है। हिन्दी वाक्य-विन्यास में ‘तेल मिलाकर’ स्वाभाविक रूप से यही संबंध व्यक्त करता है।
- source_word: חֲצִי הַהִין
  choice: आधा हीन
  rationale: प्राचीन द्रव-माप को अनुमानित आधुनिक रूपांतरण देने के बजाय लिप्यंतरित करके मूल की विशिष्टता सुरक्षित रखी गई है।
