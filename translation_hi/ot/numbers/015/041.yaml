  yaml_path: translation/ot/numbers/015/041.yaml
  text: I am Yahweh your God[a], who brought you out of the land of Egypt to be your God. I am Yahweh your God.
translation:
  language: hi
  text: मैं, याहवे, तुम्हारा परमेश्वर हूँ, जो तुम्हें मिस्र देश से निकाल लाया, ताकि मैं तुम्हारा परमेश्वर होऊँ[a]। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शब्दशः: “तुम्हारे लिए परमेश्वर होने के लिए।”'
    reason: मूल इब्रानी वाक्य-विन्यास और उसके संबंधपरक भाव को दिखाने वाला अधिक शब्दशः विकल्प।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: बहुवचन रूप वाला אֱלֹהִים यहाँ इस्राएल के एकमात्र परमेश्वर के लिए है; संबोधन सामूहिक होते हुए भी आधुनिक मानक हिन्दी में ‘तुम्हारा’ स्वाभाविक है।
- source_word: הוֹצֵאתִי אֶתְכֶם
  choice: तुम्हें … से निकाल लाया
  rationale: हिफ़ील रूप निर्गमन कराने का कारणवाचक भाव व्यक्त करता है; ‘निकाल लाया’ हिन्दी में इस ऐतिहासिक उद्धार-कर्म को स्पष्ट और स्वाभाविक ढंग से रखता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को बनाए रखने से אֶרֶץ का अर्थ और निर्गमन-सूत्र की औपचारिक लय सुरक्षित रहती है।
- source_word: לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ताकि तुम्हारा परमेश्वर बनूँ
  rationale: लְ उपसर्गयुक्त infinitive construct यहाँ उद्देश्य व्यक्त करता है। ‘ताकि’ उद्देश्य को स्पष्ट करता है और ‘तुम्हारा परमेश्वर बनूँ’ वाचा-संबंध का स्वाभाविक हिन्दी रूप है।
- source_word: אֲנִי
  choice: मैं … हूँ
  rationale: इब्रानी के क्रियारहित वाक्य को हिन्दी में स्वाभाविक बनाने के लिए सहायक क्रिया जोड़ी गई है और ‘मैं’ का बल बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसका लिप्यंतरण करता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: वाचा-सूत्र לִהְיוֹת לָכֶם לֵאלֹהִים
  choice: ताकि तुम्हारा परमेश्वर बनूँ
  alternative: ताकि मैं तुम्हारे लिए परमेश्वर रहूँ
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी के साथ वाचा-संबंध और उद्देश्य दोनों सुरक्षित हैं; अधिक शब्दशः संभावित अर्थ पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘निकाल लाया’ निर्गमन की स्थापित भावभूमि को व्यक्त करता है, और अंतिम वाक्य की पुनरावृत्ति मूल पाठ के emphatic वाचा-संबंधी समापन के रूप में ज्यों की त्यों रखी गई है।
