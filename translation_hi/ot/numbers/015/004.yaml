source:
  edition: WLC
  text: וְ/הִקְרִ֛יב הַ/מַּקְרִ֥יב קָרְבָּנ֖/וֹ לַֽ/יהוָ֑ה מִנְחָה֙ סֹ֣לֶת עִשָּׂר֔וֹן בָּל֕וּל בִּ/רְבִעִ֥ית הַ/הִ֖ין שָֽׁמֶן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/004.yaml
  text: then the one who presents his offering to Yahweh shall present a grain offering of fine flour[a], a tenth of an ephah, mixed with a fourth of a hin of oil.
translation:
  language: hi
  text: तब यहवे को अपनी भेंट चढ़ाने वाला व्यक्ति अन्न-भेंट के रूप में एक एपा का दसवाँ भाग[a] महीन आटा, चौथाई हिन तेल से मिला हुआ, चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “दसवाँ भाग” है; इस बलिदानी संदर्भ में इसका अर्थ एक एपा का दसवाँ भाग है।
    reason: मूल की संक्षिप्त माप-अभिव्यक्ति और मुख्य पाठ में स्पष्ट की गई इकाई को बताना।
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: तब ... चढ़ाए
  rationale: वाव के साथ यह क्रिया पिछले पद से विधिक प्रक्रिया को आगे बढ़ाती है; इसलिए ‘तब’ क्रम को और ‘चढ़ाए’ बलिदानी संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמַּקְרִיב
  choice: चढ़ाने वाला व्यक्ति
  rationale: हिफ़ील कृदंत भेंट प्रस्तुत करने वाले व्यक्ति की पहचान करता है; यह रूप उसके जारी कार्य को स्पष्ट रखता है।
- source_word: קָרְבָּנוֹ
  choice: अपनी भेंट
  rationale: קָרְבָּן परमेश्वर के निकट लाई जाने वाली भेंट का सामान्य शब्द है; ‘भेंट’ हिन्दी में स्पष्ट और व्यापक है।
- source_word: לַיהוָה
  choice: यहवे को
  rationale: पूर्वसर्ग ל को ‘को’ से और वाचा-संबंधी निजी नाम יהוה को ‘यहवे’ से व्यक्त किया गया है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: बलिदान-विधि में यह शब्द अनाज अथवा आटे से तैयार की गई भेंट को सूचित करता है; ‘अन्नबलि’ संक्षिप्त और प्रचलित हिन्दी रूप है।
- source_word: סֹלֶת
  choice: महीन आटा
  rationale: यह उच्च कोटि के बारीक पिसे आटे को दर्शाता है; ‘महीन आटा’ आधुनिक पाठक के लिए स्पष्ट है और ‘मैदा’ जैसी अतिरिक्त अनाज-विशिष्टता नहीं जोड़ता।
- source_word: עִשָּׂרוֹן
  choice: एपा का दसवाँ भाग
  rationale: शब्दशः अर्थ ‘दसवाँ भाग’ है, पर इस बलिदानी माप-प्रणाली में आशय एपा के दसवें भाग से है; मुख्य पाठ में निहित इकाई स्पष्ट की गई है और पादटिप्पणी में शाब्दिक रूप बताया गया है।
- source_word: בָּלוּל
  choice: मिलाकर
  rationale: निष्क्रिय कृदंत आटे के तेल में मिले होने को बताता है; हिन्दी वाक्य में ‘मिलाकर’ वही प्रक्रिया सहज ढंग से व्यक्त करता है।
- source_word: בִּרְבִעִית הַהִין
  choice: चौथाई हिन
  rationale: प्राचीन स्रोत-सांस्कृतिक माप ‘हिन’ को बनाए रखते हुए उसकी चौथाई मात्रा स्पष्ट की गई है।
- source_word: שָׁמֶן
  choice: तेल
  rationale: मूल पाठ केवल ‘तेल’ कहता है; सम्भावित जैतून के तेल को अनावश्यक रूप से विशिष्ट नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चार अक्षरों वाला निजी ईश्वरीय नाम सीधे आया है। ‘यहवे’ उस नाम को नाम के रूप में सुरक्षित रखता है, उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुरूप रखी गई है। प्राचीन माप ‘एपा’ और ‘हिन’ सुरक्षित हैं; वाक्य को हिन्दी में सहज बनाने के लिए कृदंत-रचना को ‘मिलाकर’ से व्यक्त किया गया है।
