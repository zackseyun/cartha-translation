  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। आज्ञा के एकवचन संबोधन को ‘बोल’ और ‘कह’ में बनाए रखा गया है; मुख्य आदेश के लिए सम्मानसूचक बहुवचन क्रिया ‘बनाएँ’ और ‘लगाएँ’ प्रयुक्त हुई है।
