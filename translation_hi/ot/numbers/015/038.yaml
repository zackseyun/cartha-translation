source:
  edition: WLC
  text: דַּבֵּ֞ר אֶל בְּנֵ֤י יִשְׂרָאֵל֙ וְ/אָמַרְתָּ֣ אֲלֵ/הֶ֔ם וְ/עָשׂ֨וּ לָ/הֶ֥ם צִיצִ֛ת עַל כַּנְפֵ֥י בִגְדֵי/הֶ֖ם לְ/דֹרֹתָ֑/ם וְ/נָֽתְנ֛וּ עַל צִיצִ֥ת הַ/כָּנָ֖ף פְּתִ֥יל תְּכֵֽלֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/038.yaml
  text: Speak to the sons of Israel and tell them to make tassels for themselves on the corners of their garments throughout their generations[b][a], and to put a cord of blue on the tassel of each corner.
translation:
  language: hi
  text: इस्राएल के पुत्रों से बोल और उनसे कह कि वे पीढ़ी-दर-पीढ़ी अपने वस्त्रों के कोनों पर लटकनें[a] बनाएँ और हर कोने की लटकन पर नीले रंग[b] की एक डोरी लगाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘झालरें’; इब्रानी צִיצִת वस्त्र के कोनों से लटकने वाले धागों के गुच्छों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी תְּכֵלֶת उस नीले या नीले-बैंगनी रंग अथवा रंगद्रव्य को दर्शाता है जिसका उपयोग इस्राएल की पवित्र वस्तुओं में भी होता था।
    reason: cultural_note
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी के पुरुषवाची संबंधसूचक पद का सीधा अर्थ सुरक्षित रखता है और यहाँ संबोधित वाचा-समुदाय को दर्शाता है।
- source_word: צִיצִת
  choice: लटकनें
  rationale: वस्त्रों के कोनों से लटकने वाले धागों के गुच्छों के लिए यह आधुनिक हिंदी में स्पष्ट और स्वाभाविक शब्द है।
- source_word: עַל כַּנְפֵי בִגְדֵיהֶם
  choice: अपने वस्त्रों के कोनों पर
  rationale: כָּנָף का मूल अर्थ ‘पंख’ है, पर वस्त्र के प्रसंग में यह उसके छोर या कोने को सूचित करता है।
- source_word: לְדֹרֹתָם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह आज्ञा आने वाली पीढ़ियों में निरंतर लागू रहने का भाव स्वाभाविक हिंदी में व्यक्त करती है।
- source_word: פְּתִיל
  choice: एक डोरी
  rationale: यह शब्द बटे हुए धागे या डोरी को सूचित करता है; ‘डोरी’ दृश्य रूप से लगाई जाने वाली वस्तु के लिए उपयुक्त है।
- source_word: תְּכֵלֶת
  choice: नीले रंग
  rationale: इस विशिष्ट रंगद्रव्य के लिए ‘नीला’ सर्वाधिक सुलभ मुख्य-पाठ अनुवाद है; संभावित नीला-बैंगनी रंगत टिप्पणी में दी गई है।
theological_decisions: []
