translation:
  language: hi
  text: तुम जितनी संख्या में तैयार करोगे, उतनी ही संख्या के अनुसार हर एक के लिए उनकी संख्या के अनुसार ऐसा ही करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּ/מִּסְפָּר
  choice: जितनी संख्या में
  rationale: כְּ के अनुरूपता-सूचक अर्थ और מִסְפָּר के ‘संख्या’ अर्थ को स्वाभाविक हिन्दी सहसंबंधी रचना ‘जितनी... उतनी’ में व्यक्त करता है।
- source_word: אֲשֶׁר
  choice: जितनी... में
  rationale: सम्बन्धवाचक उपवाक्य को हिन्दी में स्वाभाविक ‘जितनी’ रचना द्वारा व्यक्त किया गया है।
- source_word: תַּעֲשׂוּ
  choice: तुम तैयार करोगे / करना
  rationale: עשה का मूल अर्थ ‘करना/बनाना’ व्यापक है; बलिदान-संबंधी प्रसंग में पहली बार ‘तैयार करना’ अर्थ को स्पष्ट करता है, जबकि दूसरी बार ‘करना’ כָּכָה के साथ स्वाभाविक है।
- source_word: כָּכָה
  choice: ऐसा
  rationale: निर्देशित रीति को बताने वाले ‘इस प्रकार/ऐसा’ अर्थ को संक्षिप्त और सहज हिन्दी में रखता है।
- source_word: לָ/אֶחָד
  choice: हर एक के लिए
  rationale: शाब्दिक ‘एक के लिए’ का यहाँ वितरणात्मक अर्थ है, इसलिए ‘हर एक के लिए’ उपयुक्त है।
- source_word: כְ/מִסְפָּרָם
  choice: उतनी ही संख्या के अनुसार
  rationale: बहुवचन प्रत्यय से संकेतित कुल संख्या के अनुरूप प्रत्येक इकाई के लिए वही प्रक्रिया दोहराने का भाव बनाए रखता है; हिन्दी में अनावश्यक और अस्पष्ट ‘उनकी संख्या’ से बचता है।
