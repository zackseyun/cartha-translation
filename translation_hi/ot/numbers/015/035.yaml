  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה מ֥וֹת יוּמַ֖ת הָ/אִ֑ישׁ רָג֨וֹם אֹת֤/וֹ בָֽ/אֲבָנִים֙ כָּל הָ֣/עֵדָ֔ה מִ/ח֖וּץ לַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/035.yaml
  text: Then Yahweh said to Moses[a], “The man must surely be put to death[b]; the whole congregation shall stone him with stones outside the camp.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “उस मनुष्य को निश्चय ही मार डाला जाए[a]। पूरी मंडली छावनी के बाहर उसे पत्थरवाह करे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक विधिक ढंग से, “उसे निश्चय ही मृत्युदंड दिया जाए।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में ‘पत्थर मारना’ की क्रिया बलात्मक रूप में है: “उसे पत्थरों से पत्थरवाह करो।” यह पत्थर मारकर मृत्युदंड देने की बलात्मक न्यायिक अभिव्यक्ति है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट लिप्यंतरित किया गया है।
- source_word: מוֹת יוּמַת
  choice: निश्चय ही मार डाला जाए
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल मृत्यु-दंड की निश्चितता और बल को व्यक्त करता है; निष्क्रिय वाच्य भी सुरक्षित रखा गया है।
- source_word: הָאִישׁ
  choice: उस मनुष्य
  rationale: निश्चित संज्ञा पहले पहचाने जा चुके अपराधी की ओर संकेत करती है; हिन्दी प्रसंग में ‘उस मनुष्य’ स्पष्ट और स्वाभाविक है।
- source_word: רָגוֹם אֹתוֹ בָאֲבָנִים
  choice: उसे पत्थरों से मार डाले
  rationale: यह न्यायिक रूप से पत्थर मारकर मृत्युदंड देने का आदेश है। हिन्दी वाक्यांश क्रिया के अर्थ और परिणाम को स्पष्ट रखता है, जबकि इब्रानी की शब्दशः पुनरुक्ति पादटिप्पणी में दी गई है।
- source_word: כָּל־הָעֵדָה
  choice: पूरी मंडली
  rationale: עֵדָה यहाँ इस्राएल के संगठित सामुदायिक समूह को दर्शाता है; ‘पूरी मंडली’ उसके सामूहिक और औपचारिक भाव को बनाए रखता है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह मृत्युदंड दिए जाने के स्थान को बताने वाला स्वाभाविक और सटीक स्थानीय पदबंध है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ विशिष्ट चतुरक्षरीय ईश्वरीय नाम का प्रयोग करता है। उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है; ‘याहवे’ उपलब्ध स्रोत-साक्ष्य के निकट लिप्यंतरण है।
- issue: מוֹת יוּמַת की विधिक और बलात्मक प्रकृति
  choice: निश्चय ही मार डाला जाए
  alternative: उसे मृत्युदंड दिया जाए; वह अवश्य मारा जाए
  rationale: यह रचना आदेशित मृत्यु-दंड की निश्चितता पर बल देती है। अनुवाद न तो इसे केवल भविष्यवाणी बनाता है, न सक्रिय कर्ता जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मंडली’ विधिक-सामुदायिक संदर्भ को बनाए रखता है। आदेश की कठोरता को न तो नरम किया गया है, न मूल पाठ से अधिक विस्तार दिया गया है।
