id: NUM.15.20
reference: Numbers 15:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: רֵאשִׁית֙ עֲרִסֹ֣תֵ/כֶ֔ם חַלָּ֖ה תָּרִ֣ימוּ תְרוּמָ֑ה כִּ/תְרוּמַ֣ת גֹּ֔רֶן כֵּ֖ן תָּרִ֥ימוּ אֹתָֽ/הּ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/020.yaml
  text: From the first of your dough you shall lift up a loaf as a contribution[a]; like the contribution of the threshing floor[b], so you shall lift it up.
translation:
  language: hi
  text: तुम अपने गूँधे हुए आटे[a] के पहले भाग से एक रोटी भेंट के रूप में उठाकर देना; जैसे खलिहान की भेंट[b], वैसे ही उसे उठाकर देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ गूँधा हुआ आटा हो सकता है, और लक्षणा से आटा गूँधने का पात्र या कठौता भी।
    reason: lexical_alternative
  - marker: b
    text: परम्परागत अनुवादों में इसे ‘उठाई हुई भेंट’ कहा गया है। इब्रानी शब्द उस अंश को दर्शाता है जिसे अलग करके प्रस्तुत किया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֵאשִׁית
  choice: पहले भाग से
  rationale: यह शब्द आरम्भ या प्रथम अंश को दर्शाता है। यहाँ पूरे आटे में से एक अंश अलग करने का भाव है।
- source_word: עֲרִסֹתֵיכֶם
  choice: तुम्हारे गूँधे हुए आटे
  rationale: यह संज्ञा गूँधे हुए आटे अथवा उसे गूँधने के पात्र को सूचित कर सकती है; प्रसंग में आटे का अर्थ अधिक स्वाभाविक है।
- source_word: חַלָּה
  choice: एक रोटी
  rationale: यह गूँधे हुए आटे से बनाई गई रोटी या रोटी-जैसे पिंड को दर्शाता है; ‘रोटी’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: תָּרִימוּ
  choice: उठाकर देना
  rationale: रूम धातु का हिफ़ील रूप शाब्दिक रूप से ऊपर उठाने और भेंट के रूप में प्रस्तुत करने का भाव रखता है; यह अनुवाद उसी चित्र को बनाए रखता है।
- source_word: תְרוּמָה
  choice: भेंट
  rationale: यह परमेश्वर के लिए अलग करके प्रस्तुत किए गए अंश को दर्शाता है। ‘भेंट’ हिन्दी में स्वाभाविक है और पुराने तकनीकी पद की अपेक्षा अधिक सुबोध है।
- source_word: כִּתְרוּמַת גֹּרֶן
  choice: जैसे खलिहान की भेंट
  rationale: यह खलिहान के उत्पाद में से अलग की जाने वाली भेंट से तुलना करता है और इब्रानी संबंध-रचना को संक्षेप में बनाए रखता है।
- source_word: גֹּרֶן
  choice: खलिहान
  rationale: यह उस स्थान का प्रचलित हिन्दी नाम है जहाँ अनाज की मड़ाई और प्रसंस्करण होता था।
- source_word: כֵּן
  choice: वैसे ही
  rationale: यह पहले बताए गए उदाहरण के अनुरूप कार्य करने की तुलना को स्पष्ट करता है।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग सर्वनाम निकटवर्ती रोटी या भेंट की ओर संकेत करता है; स्रोत की संदर्भगत खुली गुंजाइश को ‘उसे’ बनाए रखता है।
