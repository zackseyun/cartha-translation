source:
  edition: WLC
  text: וְ/כִ֣י תִשְׁגּ֔וּ וְ/לֹ֣א תַעֲשׂ֔וּ אֵ֥ת כָּל הַ/מִּצְוֺ֖ת הָ/אֵ֑לֶּה אֲשֶׁר דִּבֶּ֥ר יְהוָ֖ה אֶל מֹשֶֽׁה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/022.yaml
  text: But if you unintentionally go astray and do not do all these commandments that Yahweh has spoken to Moses,[a]
translation:
  language: hi
  text: पर यदि तुम अनजाने में भटक जाओ और इन सभी आज्ञाओं का पालन न करो, जिन्हें यहोवा ने मूसा से कहा है,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अनजाने में चूक जाओ” अथवा “अनजाने में पाप कर बैठो।” इब्रानी क्रिया का अर्थ भटकना या चूक करना है और यहाँ इसका सम्बन्ध आज्ञाओं के विषय में अनजाने में हुई विफलता से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: पर यदि
  rationale: यह पद पिछले कानूनी निर्देश को आगे बढ़ाते हुए एक शर्त प्रस्तुत करता है; ‘पर यदि’ उसके हल्के विरोधात्मक और शर्तसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִשְׁגּוּ
  choice: तुम अनजाने में भटक जाओ
  rationale: שׁגה का मूल बिंब भटकने या चूकने का है; इस याजकीय-कानूनी संदर्भ में अनजानेपन का भाव भी निहित है।
- source_word: וְלֹא תַעֲשׂוּ
  choice: और ... पालन न करो
  rationale: עשה का सामान्य अर्थ ‘करना’ है, पर आज्ञाओं के साथ ‘पालन करना’ आधुनिक हिन्दी में स्वाभाविक है और अपेक्षित आज्ञाकारिता को स्पष्ट करता है।
- source_word: אֵת כָּל הַמִּצְוֺת הָאֵלֶּה
  choice: इन सभी आज्ञाओं का
  rationale: यह चयन כָּל की समग्रता और הָאֵלֶּה के निकट-संकेत को बनाए रखता है; מִצְוֺת के लिए ‘आज्ञाएँ’ वाचा-विधि के संदर्भ में उपयुक्त है।
- source_word: אֲשֶׁר דִּבֶּר יְהוָה אֶל מֹשֶׁה
  choice: जिन्हें यहोवा ने मूसा से कहा है
  rationale: सम्बन्धवाचक उपवाक्य आज्ञाओं को यहोवा द्वारा मूसा से कही गई आज्ञाओं के रूप में पहचानता है; पूर्ण क्रिया को वर्तमान प्रासंगिकता सहित स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित देवनागरी रूप ‘यहोवा’ चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिब्रू व्यक्तिगत नाम का मानक हिन्दी बाइबलीय रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नामरूप से रखा गया है।
- issue: याजकीय-कानूनी संदर्भ में שׁגה का आशय
  choice: अनजाने में भटकना
  alternative: पाप करना / भूल करना
  rationale: आस-पास का प्रसंग अनजाने अपराध को जान-बूझकर किए गए विद्रोह से अलग करता है। ‘भटकना’ क्रिया के बिंब को बचाता है, जबकि ‘अनजाने में’ कानूनी भेद स्पष्ट करता है; ‘पाप’ शब्द जोड़कर अर्थ को आवश्यकता से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘आज्ञाओं का पालन’ हिन्दी में स्वाभाविक है, जबकि ‘अनजाने में भटक जाओ’ मूल क्रिया के रूपक और कानूनी संदर्भ—दोनों को बनाए रखता है।
