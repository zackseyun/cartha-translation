  yaml_path: translation/ot/numbers/015/016.yaml
  text: One law and one ordinance shall be for you and for the sojourner who sojourns with you[a].
translation:
  language: hi
  text: तुम्हारे लिए और तुम्हारे साथ रहने वाले परदेशी[a] के लिए एक ही व्यवस्था और एक ही विधान होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘निवासी विदेशी।’ इब्रानी शब्द גֵּר ऐसे गैर-मूल निवासी को दर्शाता है जो इस्राएल के बीच उसकी सामुदायिक व्यवस्था के अधीन रहता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרָה
  choice: व्यवस्था
  rationale: इस कानूनी संदर्भ में यह बाध्यकारी व्यवस्था को दर्शाता है। ‘व्यवस्था’ आधुनिक हिन्दी में स्वाभाविक है और מִשְׁפָּט से भेद भी बनाए रखती है।
- source_word: מִשְׁפָּט
  choice: विधान
  rationale: यह निर्धारित कानूनी नियम या मानदंड को दर्शाता है। ‘विधान’ न्यायालय के निर्णय का भ्रामक अर्थ दिए बिना विधिक भाव व्यक्त करता है।
- source_word: אַחַת / אֶחָד
  choice: एक ही
  rationale: दोनों शब्दों की पुनरावृत्ति को ‘एक ही’ के रूप में बनाए रखने से एक समान मानक पर बल स्पष्ट होता है।
- source_word: יִהְיֶה
  choice: होगा
  rationale: यहाँ अपूर्ण क्रिया कानूनी निर्देश व्यक्त करती है; हिन्दी में ‘होगा’ प्रसंगानुसार विधिक अनिवार्यता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גֵּר
  choice: परदेशी
  rationale: यह इस्राएल के बीच उनकी सामुदायिक व्यवस्था के अधीन रहनेवाले गैर-मूल निवासी को दर्शाता है। ‘परदेशी’ सामान्य पाठक के लिए सहज है; अधिक विशिष्ट अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַגָּר
  choice: रहनेवाले
  rationale: हिन्दी में ‘परदेशी जो तुम्हारे साथ रहता है’ का भाव स्वाभाविक रूप से देता है, यद्यपि इब्रानी की सजातीय पुनरुक्ति को हूबहू रखना हिन्दी में कृत्रिम होता।
- source_word: אִתְּכֶם
  choice: तुम्हारे साथ
  rationale: यह इब्रानी पूर्वसर्ग का निकट और स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: मूल इस्राएली और निवासी परदेशी के लिए धार्मिक-कानूनी समानता
  choice: पद के व्यापक कथन को ज्यों का त्यों रखा गया है कि दोनों के लिए एक ही व्यवस्था और एक ही विधान होगा।
  alternative: इसे केवल निकटवर्ती बलिदान-संबंधी नियमों तक स्पष्ट रूप से सीमित करके अनूदित किया जा सकता था।
  rationale: संदर्भ एक विशिष्ट कानूनी खंड है, पर पद की भाषा व्यापक है। अनुवाद उस तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘एक ही’ की पुनरावृत्ति इब्रानी के जोर और कानूनी समानता को सुरक्षित रखती है।
