base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/021.yaml
  text: From the first of your dough you shall give to Yahweh a contribution throughout your generations[a][b].
translation:
  language: hi
  text: अपनी पीढ़ियों तक तुम अपने गूँधे हुए आटे[a] के पहले भाग में से यहोवा को एक अंशदान[b] देते रहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गूँधने के पात्र”; इब्रानी शब्द का अर्थ गूँधा हुआ आटा या उससे संबद्ध गूँधने का पात्र हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “भेंट”; पारंपरिक अनुवाद में “उठाई हुई भेंट।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵרֵאשִׁית
  choice: पहले भाग में से
  rationale: यहाँ רֵאשִׁית किसी अमूर्त आरम्भ को नहीं, बल्कि पूरी लोई में से निकाले गए आरम्भिक भाग को सूचित करता है; यह अनुवाद उसके अंशवाचक अर्थ को स्पष्ट रखता है।
- source_word: עֲרִסֹתֵיכֶם
  choice: अपनी गूँधी हुई लोई
  rationale: עֲרִסָה आटे की गूँधी हुई लोई या उससे संबद्ध गूँधने के पात्र का बोध करा सकता है। चढ़ाने के लिए उसी में से एक भाग निकाला जाता है, इसलिए प्रसंग में पदार्थ का अर्थ अधिक स्वाभाविक है।
- source_word: תִּתְּנוּ
  choice: देना
  rationale: נתן का सीधा अर्थ ‘देना’ है। आज्ञा की निरंतरता अगले वाक्यांश से व्यक्त होती है; इसलिए हिंदी में विधिवाचक रचना रखी गई है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; उसे सामान्य उपाधि से बदलने के बजाय प्रचलित हिंदी रूप ‘यहोवा’ रखा गया है।
- source_word: תְּרוּמָה
  choice: एक अंशदान
  rationale: תְּרוּמָה अलग करके दिए गए पवित्र अंश को सूचित करता है। ‘अंशदान’ आधुनिक हिंदी में दिए जाने वाले हिस्से का भाव व्यक्त करता है और अत्यधिक तकनीकी पारंपरिक पद से बचता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: यह नियम पीढ़ी-दर-पीढ़ी बना रहे
  rationale: यह सूत्र आने वाली सभी पीढ़ियों पर आज्ञा के स्थायी रूप से लागू रहने को बताता है; स्वाभाविक हिंदी में उसके आशय को स्पष्ट किया गया है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा-नाम सीधे आया है। आधुनिक हिंदी बाइबलीय प्रयोग में अधिक पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया, जबकि किसी सामान्य उपाधि से नाम को प्रतिस्थापित नहीं किया गया।
- issue: לְדֹרֹתֵיכֶם की विधिक शक्ति
  choice: यह नियम पीढ़ी-दर-पीढ़ी बना रहे
  alternative: अपनी पीढ़ियों तक
  rationale: इब्रानी सूत्र आज्ञा की पीढ़ियों तक निरंतरता बताता है। हिंदी में केवल ‘पीढ़ियों तक’ अस्पष्ट हो सकता था, इसलिए स्थायी दायित्व का आशय व्यक्त किया गया, बिना उसकी सीमा या धर्मशास्त्रीय अनुप्रयोग को आगे निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गूँधी हुई लोई’ सामान्य पाठक को अनुष्ठान में दिए जाने वाले पदार्थ का स्पष्ट बोध कराती है। इब्रानी की संभावित पात्र-संबंधी अर्थछाया मुख्य पाठ में नहीं अपनाई गई, क्योंकि इस पद में ‘में से’ लिया जाने वाला पदार्थ अभिप्रेत है।
