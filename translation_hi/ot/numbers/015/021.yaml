revisions:
- from: अपनी गूँधी हुई लोई के पहले भाग में से तुम यहोवा को एक अंशदान[a] देना; यह नियम पीढ़ी-दर-पीढ़ी बना रहे।
  to: अपनी पीढ़ियों तक तुम अपने गूँधे हुए आटे[a] के पहले भाग में से यहोवा को एक अंशदान[b] देते रहना।
  rationale: The revised wording preserves the partitive sense (‘के पहले भाग में से’), the direct command to Yahweh, and the ongoing force of ‘throughout your generations.’ It uses idiomatic modern Hindi and supplies footnotes for both relevant lexical alternatives without resolving the source ambiguity beyond what the context safely supports.
