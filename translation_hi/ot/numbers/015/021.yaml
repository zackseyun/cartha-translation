review_pass:
  verdict: revise
  source_fidelity: 'The draft correctly identifies the initial portion of the dough and renders the divine name as ‘यहोवा.’ However, ‘यह नियम ... बना रहे’ recasts the Hebrew duration formula as a separate statement about a rule, whereas the source directly qualifies the giving command: ‘throughout your generations.’'
  naturalness: ‘तुम ... देना’ is not a natural finite command in this context, and ‘गूँधी हुई लोई’ is needlessly singular and less idiomatic than ‘गूँधे हुए आटे.’ A direct habitual imperative better represents both the Hebrew imperfect and the continuing-generations formula.
  terminology: ‘अंशदान’ adequately conveys תְּרוּמָה as a portion set apart, though its alternatives should be documented. The lexical ambiguity of עֲרִסָה (dough or kneading vessel) also warrants a footnote, as in the audit trail.
  issues:
  - severity: medium
    issue: The final clause is recast as ‘यह नियम पीढ़ी-दर-पीढ़ी बना रहे।’
    rationale: לְדֹרֹתֵיכֶם directly marks the ongoing duration of the commanded action. The revision attaches ‘अपनी पीढ़ियों तक’ to ‘देते रहना,’ without adding a separate proposition about a rule.
  - severity: medium
    issue: The command ‘तुम ... देना’ is grammatically and stylistically weak.
    rationale: ‘देते रहना’ is natural modern Hindi for a continuing injunction and reflects the enduring obligation expressed by the verse.
  - severity: low
    issue: The lexical alternative for עֲרִסֹתֵיכֶם is absent from the footnotes.
    rationale: The source term may refer to dough or, by association, a kneading vessel; a footnote preserves this ambiguity while retaining ‘आटा’ in the main text.
  revised_text: अपनी पीढ़ियों तक तुम अपने गूँधे हुए आटे[a] के पहले भाग में से यहोवा को एक अंशदान[b] देते रहना।
