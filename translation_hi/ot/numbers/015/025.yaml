  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַֽל כָּל עֲדַ֛ת בְּנֵ֥י יִשְׂרָאֵ֖ל וְ/נִסְלַ֣ח לָ/הֶ֑ם כִּֽי שְׁגָגָ֣ה הִ֔וא וְ/הֵם֩ הֵבִ֨יאוּ אֶת קָרְבָּנָ֜/ם אִשֶּׁ֣ה לַֽ/יהוָ֗ה וְ/חַטָּאתָ֛/ם לִ/פְנֵ֥י יְהוָ֖ה עַל שִׁגְגָתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/025.yaml
  text: And the priest shall make atonement for all the congregation of the sons of Israel[a], and they shall be forgiven, because it was an unintentional error, and they have brought their offering, an offering made by fire to Yahweh, and their sin offering before Yahweh[c][b], for their unintentional error.
translation:
  language: hi
  text: और याजक इस्राएलियों की सारी मण्डली के लिए प्रायश्चित करे, और उन्हें क्षमा किया जाएगा, क्योंकि यह अनजाने में हुई भूल थी और वे अपनी भेंट—याहवे के लिए आग में चढ़ाई गई भेंट[a]—और अपनी पापबलि[b] याहवे के सामने अपनी अनजानी भूल के लिए ले आए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के लिए अग्नि-भेंट।” इब्रानी शब्द आग के द्वारा चढ़ाई जाने वाली भेंट पर बल दे सकता है; कुछ सन्दर्भों में इसका अनुवाद “भोजन-भेंट” भी किया जाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “अपनी शुद्धिकरण-बलि।” जिस इब्रानी शब्द का अनुवाद प्रायः “पापबलि” होता है, वह बलिदानी सन्दर्भों में शुद्धिकरण के लिए चढ़ाई गई बलि को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: प्रायश्चित करे
  rationale: पिएल रूप sacrificial context में समुदाय की ओर से प्रायश्चित सम्पन्न करने को व्यक्त करता है; ‘प्रायश्चित करे’ हिन्दी में संक्षिप्त, स्वाभाविक और धर्मवैज्ञानिक बल बनाए रखता है।
- source_word: עַל כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी मण्डली के लिए
  rationale: כפר के साथ עַל का अर्थ ‘के लिए/की ओर से’ है। ‘इस्राएलियों की सारी मण्डली’ आधुनिक हिन्दी में स्वाभाविक रूप से पूरे सामुदायिक समूह को दर्शाता है।
- source_word: וְנִסְלַח לָהֶם
  choice: और उन्हें क्षमा किया जाएगा
  rationale: निफ़ाल कर्मवाच्य को बनाए रखा गया है और इब्रानी में अनुल्लिखित कर्ता को हिन्दी में नहीं जोड़ा गया।
- source_word: כִּי שְׁגָגָה הִוא
  choice: क्योंकि यह अनजाने में हुई भूल थी
  rationale: שְׁגָגָה अनजानेपन के साथ दोषपूर्ण भूल का बोध कराता है; यह अभिव्यक्ति केवल दुर्घटना या जानबूझकर किए पाप, दोनों में से किसी एक तक अर्थ को सीमित नहीं करती।
- source_word: אֶת קָרְבָּנָם
  choice: अपनी भेंट
  rationale: קָרְבָּן परमेश्वर के सामने लाई गई भेंट का सामान्य बलिदानी शब्द है; ‘भेंट’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: אִשֶּׁה לַיהוָה
  choice: याहवे के लिए आग में चढ़ाई गई भेंट
  rationale: אִשֶּׁה के अग्नि-संबंधी बल को स्पष्ट रखा गया है, पर इसे केवल ‘भोजन’ कहकर सीमित नहीं किया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से प्रतिस्थापित करने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וְחַטָּאתָם
  choice: और अपनी पापबलि
  rationale: यहाँ वस्तु को याहवे के सामने लाया जाता है, इसलिए חַטָּאת का बलिदानी अर्थ अपेक्षित है; परिचित हिन्दी पद ‘पापबलि’ चुना गया है।
- source_word: עַל שִׁגְגָתָם
  choice: अपनी अनजानी भूल के लिए
  rationale: पहले आए שְׁגָגָה की जड़गत पुनरावृत्ति को हिन्दी में ‘अनजानी भूल’ दोहराकर सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: חַטָּאת का नैतिक या बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: वाक्य-विन्यास में इसे भेंट के रूप में याहवे के सामने लाया गया है, इसलिए बलिदानी अर्थ निश्चित है; ‘शुद्धिकरण-बलि’ सम्भव वैकल्पिक व्याख्या के रूप में पादटिप्पणी में रखी गई है।
- issue: क्षमा देने वाले कर्ता की पहचान
  choice: उन्हें क्षमा किया जाएगा
  alternative: याहवे उन्हें क्षमा करेगा
  rationale: मूल इब्रानी कर्मवाच्य है और कर्ता को स्पष्ट नहीं करता; अनुवाद ने निहित धर्मवैज्ञानिक कर्ता को पाठ में जोड़ने से परहेज़ किया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘मण्डली’, ‘प्रायश्चित’ और ‘पापबलि’ जैसे स्थापित बाइबलीय पदों को बनाए रखते हुए वाक्य-विन्यास को स्वाभाविक बनाया गया है। मूल के दो जुड़े कारण—भूल का अनजाना होना और अपेक्षित भेंटों का लाया जाना—‘क्योंकि… और…’ की सतत संरचना में सुरक्षित हैं।
