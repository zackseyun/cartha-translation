  naturalness: The revised wording is natural, clear modern standard Hindi with an appropriately dignified biblical register. ‘आज्ञाओं को मानो’ is idiomatic while retaining the practical force of עשה in this context.
  terminology: ‘परमेश्वर,’ ‘आज्ञाएँ,’ and ‘पवित्र’ are suitable established terms. The footnote retains the legitimate lexical nuance of קדשים without reducing its semantic range in the main text.
