id: NUM.15.40
reference: Numbers 15:40
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְמַ֣עַן תִּזְכְּר֔וּ וַ/עֲשִׂיתֶ֖ם אֶת כָּל מִצְוֺתָ֑/י וִ/הְיִיתֶ֥ם קְדֹשִׁ֖ים לֵֽ/אלֹהֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/040.yaml
  text: so that you may remember and do all my commandments[a], and be holy to your God.
translation:
  language: hi
  text: ताकि तुम स्मरण रखो और मेरी सभी आज्ञाओं को मानो, और अपने परमेश्वर के लिए पवित्र हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर के लिए अलग किए हुए हो।”
    reason: कְדֹשִׁים का वैकल्पिक अर्थ ‘अलग किए हुए’ या ‘समर्पित’ हो सकता है; मुख्य पाठ का ‘पवित्र’ शब्द व्यापक अर्थ-क्षेत्र बनाए रखता है।
lexical_decisions:
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्य या परिणाम का परिचय देता है; ‘ताकि’ आधुनिक हिन्दी में स्वाभाविक है और प्रयोजन का भाव सुरक्षित रखता है।
- source_word: תִּזְכְּרוּ
  choice: तुम स्मरण रखो
  rationale: זכר का अर्थ यहाँ केवल क्षणिक रूप से याद आना नहीं, बल्कि आज्ञाओं को सचेत रूप से ध्यान में रखना है; ‘स्मरण रखो’ इस वाचायी संदर्भ में स्वाभाविक है।
- source_word: וַעֲשִׂיתֶם
  choice: और … पालन करो
  rationale: עשה का मूल भाव ‘करना’ है, पर हिन्दी में आज्ञाओं के साथ ‘पालन करना’ अधिक स्वाभाविक है और उन्हें कार्य में उतारने का अर्थ व्यक्त करता है।
- source_word: אֶת כָּל מִצְוֺתָי
  choice: मेरी सभी आज्ञाओं का
  rationale: מִצְוֺתָי का अर्थ ‘मेरी आज्ञाएँ’ है और כָּל को ‘सभी’ से स्पष्ट रूप में रखा गया है।
- source_word: וִהְיִיתֶם
  choice: और … बनो
  rationale: היה के साथ विधेय विशेषण परिणामी अवस्था व्यक्त कर सकता है; हिन्दी में ‘पवित्र बनो’ उद्देश्य-क्रम के भीतर स्वाभाविक है, यद्यपि ‘पवित्र रहो’ भी संभव है।
- source_word: קְדֹשִׁים
  choice: पवित्र
  rationale: ‘पवित्र’ नैतिक, वाचायी और उपासना-संबंधी अर्थ-व्याप्ति को बनाए रखता है; केवल ‘अलग किए हुए’ कहना अर्थ को संकुचित कर देता।
- source_word: לֵאלֹהֵיכֶם
  choice: अपने परमेश्वर के लिए
  rationale: ל संबंध या समर्पण का भाव देता है। हिन्दी में ‘अपने परमेश्वर के लिए पवित्र’ स्वाभाविक है और परमेश्वर से वाचायी संबंध को व्यक्त करता है।
theological_decisions:
- issue: वाचा के संदर्भ में पवित्रता का अर्थ
  choice: ‘पवित्र’ शब्द को बनाए रखा गया है।
  alternative: ‘अपने परमेश्वर के लिए अलग किए हुए’ या ‘समर्पित’
  rationale: यह पद आज्ञाओं को स्मरण रखने और उनका पालन करने को परमेश्वर के संबंध में पवित्र होने से जोड़ता है। ‘पवित्र’ नैतिक, वाचायी और उपासना-संबंधी सभी आयामों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘स्मरण रखो’ और ‘आज्ञाओं का पालन करो’ सामान्य पाठकों के लिए सहज हैं; ‘अपने परमेश्वर’ हिन्दी में संबंधसूचक प्रत्यय का स्वाभाविक रूप है।
