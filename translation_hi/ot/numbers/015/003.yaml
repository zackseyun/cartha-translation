  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/עֲשִׂיתֶ֨ם אִשֶּׁ֤ה לַֽ/יהוָה֙ עֹלָ֣ה אוֹ זֶ֔בַח לְ/פַלֵּא נֶ֨דֶר֙ א֣וֹ בִ/נְדָבָ֔ה א֖וֹ בְּ/מֹעֲדֵי/כֶ֑ם לַ/עֲשׂ֞וֹת רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה מִן הַ/בָּקָ֖ר א֥וֹ מִן הַ/צֹּֽאן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/003.yaml
  text: and you present an offering by fire to Yahweh—either a burnt offering or a sacrifice—to fulfill a vow[a], or as a freewill offering, or at your appointed times, to make a pleasing aroma to Yahweh, from the herd or from the flock[b],
translation:
  language: hi
  text: और तुम याहवे के लिए अग्नि-भेंट[a] चढ़ाओ—चाहे होमबलि हो या बलिदान—किसी मन्नत को पूरा करने के लिए, या स्वेच्छा-भेंट के रूप में, या अपने नियत अवसरों[b] पर, याहवे के लिए सुखद सुगंध उत्पन्न करने के लिए; यह भेंट गाय-बैलों या भेड़-बकरियों में से हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अग्नि में अर्पित भेंट।”
    reason: אִשֶּׁה के पारिभाषिक बलिदानी अर्थ का अधिक व्याख्यात्मक विकल्प।
  - marker: b
    text: या, “अपने नियत पर्वों पर।” इब्रानी शब्द सामान्य नियत अवसरों अथवा विशेष पर्व-अवसरों, दोनों को दर्शा सकता है।
    reason: מוֹעֵד की व्यापक और पर्व-संबंधी दोनों अर्थ-छायाओं को सुरक्षित रखना।
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: तुम ... चढ़ाओ
  rationale: शाब्दिक अर्थ ‘तुम बनाओ/करो’ है, पर बलिदान के प्रसंग में हिन्दी का स्वाभाविक और सटीक प्रयोग ‘भेंट चढ़ाना’ है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह अग्नि पर अर्पित बलिदान के लिए पारिभाषिक शब्द है; संक्षिप्त हिन्दी समास मूल रूप को बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: मूल में परमेश्वर का निजी वाचा-नाम יהוה है; उसे उपाधि से बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: पूरी तरह जलाए जाने वाले बलिदान के लिए हिन्दी बाइबलीय परंपरा में प्रचलित और सटीक पद।
- source_word: זֶבַח
  choice: कोई और बलिदान
  rationale: זֶבַח सामान्य वध-बलिदान को दर्शाता है। ‘और’ हिन्दी पाठक के लिए स्पष्ट करता है कि इसे पहले उल्लिखित होमबलि के विकल्प के रूप में कहा गया है, बिना बलिदान का अनिर्दिष्ट प्रकार तय किए।
- source_word: לְפַלֵּא נֶדֶר
  choice: किसी मन्नत को पूरा करने के लिए
  rationale: यह वचनबद्ध भेंट देकर मन्नत निभाने का अर्थ देता है; ‘मन्नत पूरी करना’ सहज आधुनिक हिन्दी है।
- source_word: בִנְדָבָה
  choice: स्वेच्छा-भेंट के रूप में
  rationale: यह बाध्यता या मन्नत से अलग, अपनी इच्छा से दी गई भेंट का पारिभाषिक भाव व्यक्त करता है।
- source_word: בְּמֹעֲדֵיכֶם
  choice: अपने नियत अवसरों पर
  rationale: מוֹעֵד का अर्थ सामान्यतः ठहराया हुआ समय और विशेषतः पर्व का अवसर हो सकता है; मुख्य पाठ व्यापक अर्थ सुरक्षित रखता है।
- source_word: לַעֲשׂוֹת רֵיחַ נִיחֹחַ
  choice: ताकि ... सुखद सुगंध हो
  rationale: बलिदानी रूपक को स्वाभाविक हिन्दी में बनाए रखता है और मूल से आगे बढ़कर ईश्वरीय तुष्टीकरण का कोई सिद्धांत नहीं जोड़ता।
- source_word: מִן הַבָּקָר אוֹ מִן הַצֹּאן
  choice: गाय-बैलों या भेड़-बकरियों में से
  rationale: 'दोनों सामूहिक पशुधन-पदों को उनके ठोस हिन्दी अर्थ से व्यक्त किया गया है: बड़े पशु और छोटे झुंड के पशु।'
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम सीधे आया है; लिप्यंतरण उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: רֵיחַ נִיחֹחַ का मानवरूपी बलिदानी मुहावरा
  choice: सुखद सुगंध
  alternative: शांतिदायक सुगंध / मनभावनी सुगंध
  rationale: यह मूल रूपक और उसकी धर्मवैज्ञानिक तनावपूर्ण भाषा को बनाए रखता है, पर उससे आगे कोई यांत्रिक प्रायश्चित्त-सिद्धांत नहीं गढ़ता।
- issue: זֶבַח का עֹלָה से संबंध
  choice: चाहे होमबलि, चाहे कोई और बलिदान
  alternative: होमबलि या बलिदान
  rationale: मूल दोनों को विकल्पों के रूप में रखता है। हिन्दी में ‘कोई और’ वर्ग-संबंध को सहज बनाता है, जबकि זֶבַח के विशेष प्रकार को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘होमबलि’, ‘मन्नत’ और ‘स्वेच्छा-भेंट’ जैसे स्थापित बलिदानी पद प्रसंग की औपचारिकता बनाए रखते हैं। पद अगले वाक्य से व्याकरणिक रूप से जुड़ा है, इसलिए अंत में अल्पविराम रखा गया है।
