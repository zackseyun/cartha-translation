source:
  edition: WLC
  text: וְ/כִפֶּ֣ר הַ/כֹּהֵ֗ן עַל הַ/נֶּ֧פֶשׁ הַ/שֹּׁגֶ֛גֶת בְּ/חֶטְאָ֥ה בִ/שְׁגָגָ֖ה לִ/פְנֵ֣י יְהוָ֑ה לְ/כַפֵּ֥ר עָלָ֖י/ו וְ/נִסְלַ֥ח לֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/015/028.yaml
  text: And the priest shall make atonement before Yahweh for the person who sins unintentionally, when he sins unintentionally, to make atonement for him, and he shall be forgiven.
translation:
  language: hi
  text: और याजक उस व्यक्ति के लिए प्रायश्चित करेगा जो अनजाने में पाप करता है, जब वह याहवे के सामने अनजाने में पाप करता है, उसके लिए प्रायश्चित करने के लिए; और उसे क्षमा कर दिया जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִפֶּר / לְכַפֵּר
  choice: प्रायश्चित करे / प्रायश्चित करे
  rationale: पिएल रूप כפר याजकीय विधि द्वारा प्रायश्चित किए जाने को दर्शाता है। दोनों प्रयोगों को दोहराकर मूल पाठ की पुनरुक्ति सुरक्षित रखी गई है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-विधि संपन्न करने वाले अधिकारी के लिए प्रचलित और सीधा हिन्दी शब्द।
- source_word: עַל הַנֶּפֶשׁ
  choice: उस व्यक्ति के लिए
  rationale: यहाँ נֶפֶשׁ अमूर्त ‘आत्मा’ नहीं, पूरे व्यक्ति को सूचित करता है।
- source_word: הַשֹּׁגֶגֶת ... בְּחֶטְאָה בִשְׁגָגָה
  choice: जो अनजाने में पाप करता है, जब वह ... अनजाने में पाप करे
  rationale: שׁגג/שׁגגה की पुनरुक्ति को मिटाए बिना आधुनिक हिन्दी में अनिच्छित अथवा अनजाने अपराध का भाव व्यक्त किया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का संबंधपरक अर्थ ‘के सामने/की उपस्थिति में’ है और יהוה को उसके व्यक्तिवाचक वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וְנִסְלַח לוֹ
  choice: और उसे क्षमा कर दिया जाएगा
  rationale: निफ़अल रूप का कर्मवाच्य भाव सुरक्षित है; कर्ता को पाठ में स्पष्ट किए बिना क्षमा के परिणाम को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक वाचा-नाम है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: כפר का धार्मिक अर्थ
  choice: प्रायश्चित करे
  alternative: दोष ढाँपे / क्षतिपूर्ति करे
  rationale: ‘प्रायश्चित’ याजकीय अनुष्ठान के व्यापक अर्थ को व्यक्त करता है और प्रायश्चित की प्रक्रिया के किसी एक विशिष्ट धार्मिक सिद्धांत को पाठ पर आरोपित नहीं करता।
- issue: क्षमा का अव्यक्त कर्ता
  choice: कर्मवाच्य—‘उसे क्षमा कर दिया जाएगा’
  alternative: याहवे उसे क्षमा करेगा
  rationale: हिब्रू में क्षमा का कर्ता व्यक्त नहीं है; कर्मवाच्य उसे अव्यक्त रखता है और निहित कर्ता को अनावश्यक रूप से स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल में שׁגג तथा כפר की अर्थपूर्ण पुनरुक्ति को जानबूझकर बनाए रखा गया है, भले ही इससे वाक्य में कुछ औपचारिक दोहराव आता है।
