lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया क्रमिक कथा को आगे बढ़ाते हुए दिव्य वचन का परिचय देती है। हिन्दी में ‘मूसा से कहा’ स्वाभाविक और सूत्रात्मक है; अलग से ‘बोला…कहते हुए’ कहना अनावश्यक रूप से भारी होता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के निजी नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: אֶל
  choice: से
  rationale: ‘किसी से कहना’ आधुनिक मानक हिन्दी में संबोधित व्यक्ति को दर्शाने वाला स्वाभाविक प्रयोग है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में स्थापित और सामान्यतः पहचाना जाने वाला नामरूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी का यह वचन-परिचायक रूप अगले कथन की भूमिका बनाता है। हिन्दी में मुख्य क्रिया के साथ ‘कहा’ इसी कार्य को स्वाभाविक ढंग से पूरा करता है; शाब्दिक पुनरुक्ति से बचा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में निजी ईश्वरीय नाम स्पष्ट रूप से आया है। ‘यहोवा’ हिन्दी में परिचित लिप्यंतरण है और इसे केवल उपाधि ‘प्रभु’ से बदलता नहीं। पादटिप्पणी मूल चार-अक्षरी नाम को स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। मूल के वचन-परिचायक सूत्र को हिन्दी की स्वाभाविक रचना में संक्षिप्त किया गया है; पद के अंत का अल्पविराम आगे आने वाले कथन का संकेत देता है।
