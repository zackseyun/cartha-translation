  yaml_path: translation/ot/numbers/015/023.yaml
  text: everything that Yahweh has commanded you through Moses[a], from the day that Yahweh commanded and onward throughout your generations—
translation:
  language: hi
  text: वह सब जिसकी याहवे ने मूसा के द्वारा[a] तुम्हें आज्ञा दी है, उस दिन से जब याहवे ने आज्ञा दी, और आगे तुम्हारी पीढ़ियों तक—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मूसा के हाथ से’; यह मुहावरा ‘मूसा के द्वारा’ के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब जो
  rationale: यह पद पिछले वाक्य की निरंतरता है। यह अभिव्यक्ति आज्ञा दी गई सभी बातों की समग्रता को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: צִוָּה
  choice: आज्ञा दी है / आज्ञा दी
  rationale: पहले प्रयोग में पूर्ण हुई आज्ञाओं की वर्तमान प्रासंगिकता दिखाने के लिए ‘आज्ञा दी है’ और कालगत आरंभ-बिंदु वाले दूसरे प्रयोग में ‘आज्ञा दी’ रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: אֲלֵיכֶם
  choice: तुम्हें
  rationale: यह बहुवचन संबोधन है और हिन्दी में ‘आज्ञा देना’ के साथ स्वाभाविक रूप से ‘तुम्हें’ आता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक अर्थ ‘मूसा के हाथ से’ है, पर यहाँ בְּיַד माध्यम अथवा प्रतिनिधि के द्वारा दिए जाने का मुहावरा है; ‘मूसा के द्वारा’ इसे स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַיּוֹם אֲשֶׁר
  choice: उस दिन से जब
  rationale: यह आज्ञाओं के लागू होने का आरंभ-बिंदु बतानेवाली कालगत अभिव्यक्ति है।
- source_word: וָהָלְאָה
  choice: और आगे भी
  rationale: यह बताए गए दिन से आगे निरंतरता का अर्थ देता है। ‘भी’ हिन्दी में उस जारी रहने के भाव को स्वाभाविक बनाता है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी तक
  rationale: यह संबोधित समुदाय की क्रमिक पीढ़ियों में निरंतर लागू रहने का भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम יהוה का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से बदले बिना सीधे प्रस्तुत करता है।
- issue: בְּיַד מֹשֶׁה में मूसा की भूमिका
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: मूल मुहावरा मूसा को आज्ञाओं का माध्यम बताता है। स्वाभाविक हिन्दी में मुहावरे का अर्थ दिया गया है, जबकि उसका शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद पिछले वाक्य से जुड़ा हुआ है, इसलिए आरंभ में खंडात्मक संरचना और अंत में दीर्घ विराम-चिह्न बनाए रखा गया है।
