  text: וַ/יְדַבֵּ֥ר יְהוָ֖ה אֶל מֹשֶׁ֥ה לֵּ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: फिर यहोवा ने मूसा से कहा,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH (יהוה); इसका उच्चारण प्रायः ‘याहवे’ माना जाता है और परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: ईश्वरीय नाम के मूल रूप तथा प्रचलित वैकल्पिक निरूपण बताना।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... ने ... कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘फिर’ उसके क्रमिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। इस प्रचलित वाक्य-सूत्र में ‘कहा’ अगले प्रत्यक्ष कथन की सहज भूमिका बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में टेट्राग्रामाटन के व्यक्तिगत नाम का प्रचलित लिप्यंतरण ‘यहोवा’ है; इसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: דבר אל के साथ हिन्दी में संबोधित व्यक्ति के लिए ‘से’ स्वाभाविक है; מֹשֶׁה का मानक हिन्दी रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह infinitive construct आगामी वाणी का परिचय देता है। हिन्दी में ‘ने ... कहा’ मूल के דבר ... לאמר सूत्र को बिना कृत्रिम ‘यह कहते हुए’ के स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम YHWH है। ‘यहोवा’ आधुनिक हिन्दी पाठकों के लिए परिचित नामरूप है; पादटिप्पणी मूल व्यंजनात्मक रूप और अन्य प्रचलित उच्चारण को स्पष्ट करती है, जबकि ‘प्रभु’ जैसे केवल उपाधिमूलक प्रतिस्थापन से बचा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संक्षिप्त सूत्रात्मक शैली मूल वचन की भूमिका को बनाए रखती है।
