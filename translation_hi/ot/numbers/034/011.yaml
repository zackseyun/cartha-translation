  text: וְ/יָרַ֨ד הַ/גְּבֻ֧ל מִ/שְּׁפָ֛ם הָ/רִבְלָ֖ה מִ/קֶּ֣דֶם לָ/עָ֑יִן וְ/יָרַ֣ד הַ/גְּב֔וּל וּ/מָחָ֛ה עַל כֶּ֥תֶף יָם כִּנֶּ֖רֶת קֵֽדְמָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/011.yaml
  text: Then the border shall go down from Shepham to Riblah[a], on the east side of Ain[b]; and the border shall go down and reach the slope of the Sea of Kinnereth on the east.
translation:
  language: hi
  text: फिर सीमा शफाम से ऐन के पूर्व में रिबला तक नीचे जाएगी। वहाँ से सीमा और नीचे जाकर किन्नेरेत सागर के पूर्वी किनारे[a] तक पहुँचेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किन्नेरेत सागर के पूर्वी कंधे को छुएगी।” यहाँ “कंधा” भौगोलिक अर्थ में किनारे या बगल के भूभाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַד
  choice: नीचे जाएगी
  rationale: मूल क्रिया का अर्थ ‘नीचे जाना’ है और यहाँ यह भूभाग के साथ सीमा की दिशा बताती है।
- source_word: הַגְּבֻל / הַגְּבוּל
  choice: सीमा
  rationale: क्षेत्र की सीमा-रेखा के लिए यह स्वाभाविक और सटीक आधुनिक हिन्दी शब्द है।
- source_word: מִשְּׁפָם
  choice: शफाम से
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और उपसर्ग מִן का स्रोतार्थ ‘से’ द्वारा व्यक्त किया गया है।
- source_word: הָרִבְלָה
  choice: रिबला तक
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; दिशासूचक रूप को ‘तक’ से व्यक्त किया गया है।
- source_word: מִקֶּדֶם לָעָיִן
  choice: ऐन के पूर्व में
  rationale: यह पदबंध रिबला की स्थिति ऐन के पूर्व में बताता है; हिन्दी में सीधा भौगोलिक संबंध बनाए रखा गया है।
- source_word: וּמָחָה
  choice: तक पहुँचेगी
  rationale: सीमा-वर्णन में क्रिया किसी भौगोलिक विशेषता को छूने या वहाँ तक पहुँचने का भाव देती है; ‘तक पहुँचेगी’ स्वाभाविक हिन्दी है।
- source_word: עַל כֶּתֶף
  choice: किनारे तक
  rationale: כֶּתֶף का शाब्दिक अर्थ ‘कंधा’ है, पर भौगोलिक प्रयोग में यह किसी भूभाग या जलाशय की बगल अथवा किनारे को दर्शाता है। शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יָם כִּנֶּרֶת
  choice: किन्नेरेत सागर
  rationale: मूल पद का निकट रूप रखते हुए प्राचीन स्थान-नाम को बनाए रखा गया है; इसे बाद के नाम ‘गलील सागर’ से नहीं बदला गया।
- source_word: קֵדְמָה
  choice: पूर्वी
  rationale: दिशासूचक क्रियाविशेषण को यहाँ सागर के पूर्वी किनारे के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
