  yaml_path: translation/ot/numbers/034/020.yaml
  text: 'And for the tribe of the sons of Simeon: Shemuel son of Ammihud[a].'
translation:
  language: hi
  text: 'और शिमोन के पुत्रों के गोत्र के लिए: अम्मीहूद का पुत्र शमूएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र के लिए
  rationale: इस प्रशासनिक सूची में מַטֶּה का अर्थ शाब्दिक ‘लाठी’ नहीं, बल्कि ‘गोत्र’ है; וּ और לְ को स्वाभाविक रूप से ‘और ... के लिए’ कहा गया है।
- source_word: בְּנֵי שִׁמְעוֹן
  choice: शिमोन के वंशजों
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर गोत्र-सूचक प्रयोग में यह शिमोन के वंशजों को दर्शाता है; आधुनिक हिन्दी में ‘वंशजों’ अर्थ को अधिक स्पष्ट और स्वाभाविक रखता है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: इब्रानी नाम का निकट देवनागरी लिप्यंतरण; हिन्दी बाइबल परंपरा में भी यह रूप परिचित है।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली-सूचक בֶּן का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: עַמִּיהוּד
  choice: अम्मीहूद
  rationale: इब्रानी व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
