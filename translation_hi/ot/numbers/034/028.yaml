lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र के लिए
  rationale: इस भूमि-विभाजन संबंधी सूची में מַטֶּה का अर्थ छड़ी नहीं, बल्कि इस्राएल का ‘गोत्र’ है; उपसर्ग וּ और לְ को क्रमशः ‘और’ तथा ‘के लिए’ से व्यक्त किया गया है।
- source_word: בְנֵי נַפְתָּלִי
  choice: नप्ताली के वंशजों
  rationale: शाब्दिक अर्थ ‘नप्ताली के पुत्र’ है, पर यह मानक गोत्रीय पदबंध नप्ताली से उत्पन्न पूरे समुदाय को सूचित करता है; इसलिए स्वाभाविक आधुनिक हिन्दी में ‘वंशजों’ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: נָשִׂיא
  choice: एक प्रधान
  rationale: यहाँ यह शब्द नियुक्त गोत्रीय मुखिया या प्रतिनिधि के लिए है। ‘प्रधान’ प्रशासनिक भूमिका को स्पष्ट करता है और ‘राजकुमार’ जैसे राजकीय अर्थ से बचता है।
- source_word: פְּדַהְאֵל
  choice: पदहेल
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: यह सामान्य पितृनाम-सूचक पदबंध है और हिन्दी में स्वाभाविक क्रम ‘अम्मीहूद का पुत्र’ है।
- source_word: עַמִּיהוּד
  choice: अम्मीहूद
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
