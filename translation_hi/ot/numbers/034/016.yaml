  text: Then Yahweh spoke to Moses, saying,
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। इस प्रचलित वाक्य-सूत्र में ‘कहा’ सहज है, यद्यपि דבר का अधिक शाब्दिक अर्थ ‘बोला’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: यह परमेश्वर के व्यक्तिगत नाम יהוה का हिन्दी में प्रचलित लिप्यंतरण है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह आगे आने वाले प्रत्यक्ष कथन की परिचयात्मक हिब्रू रचना है। हिन्दी में ‘कहा,’ वही कार्य सहजता से करता है; ‘यह कहते हुए’ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी पाठक-वर्ग में स्थापित रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदलने के बजाय उसकी नाम-सत्ता बनाए रखता है; ‘याहवे’ संभावित वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। सूत्रात्मक हिब्रू ‘बोला ... यह कहते हुए’ को अर्थगत पुनरुक्ति से बचाते हुए स्वाभाविक ‘ने ... से कहा’ बनाया गया है।
