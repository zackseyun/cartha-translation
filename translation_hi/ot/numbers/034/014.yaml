  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सुबोध शैली रखी गई है। ‘गोत्र’, ‘पितृकुल’ और ‘उत्तराधिकार’ भूमि-विभाजन के सामाजिक, वंशगत और विधिक अर्थों को संक्षेप में बनाए रखते हैं।
