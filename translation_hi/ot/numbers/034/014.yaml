  text: כִּ֣י לָקְח֞וּ מַטֵּ֨ה בְנֵ֤י הָ/ראוּבֵנִי֙ לְ/בֵ֣ית אֲבֹתָ֔/ם וּ/מַטֵּ֥ה בְנֵֽי הַ/גָּדִ֖י לְ/בֵ֣ית אֲבֹתָ֑/ם וַ/חֲצִי֙ מַטֵּ֣ה מְנַשֶּׁ֔ה לָקְח֖וּ נַחֲלָתָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/014.yaml
  text: For the tribe of the sons of Reuben[a], by their fathers’ houses, and the tribe of the sons of Gad, by their fathers’ houses[c][b], and the half-tribe of Manasseh have taken their inheritance.
translation:
  language: hi
  text: क्योंकि रूबेनियों के गोत्र ने अपने-अपने पितृकुलों के अनुसार, और गादियों के गोत्र ने अपने-अपने पितृकुलों के अनुसार, तथा मनश्शे के आधे गोत्र ने अपना-अपना उत्तराधिकार ले लिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण अथवा स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָקְחוּ
  choice: ले चुके हैं
  rationale: काल रूप पूर्ण हो चुके ग्रहण को दर्शाता है। यह ‘प्राप्त कर चुके हैं’ की अपेक्षा मूल क्रिया के निकट है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: भूमि-विभाजन के इस प्रसंग में इसका अर्थ इस्राएल का जनजातीय विभाग है; बाइबलीय हिन्दी में ‘गोत्र’ स्पष्ट और प्रचलित है।
- source_word: בְנֵי הָרְאוּבֵנִי / בְנֵי הַגָּדִי
  choice: रूबेनी / गादी
  rationale: मूल के जाति-सूचक रूपों को हिन्दी में स्वाभाविक समुदाय-सूचक संज्ञाओं द्वारा व्यक्त किया गया है; शाब्दिक ‘रूबेन के पुत्र’ यहाँ कम स्वाभाविक होगा।
- source_word: לְבֵית אֲבֹתָם
  choice: अपने-अपने पितृकुलों के अनुसार
  rationale: यह प्रत्येक गोत्र के भीतर पूर्वज-आधारित कुल अथवा परिवार-विभागों के अनुसार भूमि मिलने को व्यक्त करता है।
- source_word: וַחֲצִי מַטֵּה מְנַשֶּׁה
  choice: मनश्शे का आधा गोत्र
  rationale: निर्माण को सीधे और स्पष्ट रूप में रखता है कि मनश्शे के गोत्र का केवल आधा भाग यहाँ अभिप्रेत है।
- source_word: נַחֲלָתָם
  choice: अपना-अपना उत्तराधिकार
  rationale: संदर्भ में यह विरासत के रूप में मिली भू-संपत्ति है। ‘अपना-अपना’ बहुवचन समुदायों के अलग-अलग भू-भागों को स्वाभाविक हिन्दी में स्पष्ट करता है।
