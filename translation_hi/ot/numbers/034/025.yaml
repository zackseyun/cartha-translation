  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי זְבוּלֻ֖ן נָשִׂ֑יא אֱלִיצָפָ֖ן בֶּן פַּרְנָֽךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/025.yaml
  text: 'And for the tribe of the sons of Zebulun, a leader: Elizaphan son of Parnach.'
translation:
  language: hi
  text: 'और जबूलून के वंशजों के गोत्र के लिए प्रधान: परनाख का पुत्र एलीसापान।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र के लिए
  rationale: इस भूमि-विभाजन संबंधी सूची में מַטֶּה का अर्थ ‘गोत्र’ है; וּ और לְ को हिन्दी में स्वाभाविक रूप से ‘और ... के लिए’ कहा गया है।
- source_word: בְנֵי זְבוּלֻן
  choice: जबूलून के वंशजों
  rationale: בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर गोत्रीय पदनाम में यह सामूहिक रूप से वंशजों को सूचित करता है; ‘वंशजों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נָשִׂיא
  choice: एक प्रधान
  rationale: נָשִׂיא यहाँ गोत्र के मान्य प्रतिनिधि या मुखिया को दर्शाता है। ‘प्रधान’ प्रशासनिक संदर्भ और सूची की गरिमा को बनाए रखता है, जबकि ‘राजकुमार’ भ्रामक हो सकता है।
- source_word: אֱלִיצָפָן
  choice: एलीसापान
  rationale: इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן פַּרְנָךְ
  choice: परनाक का पुत्र
  rationale: בֶּן मानक वंशावली-सूचक पद ‘पुत्र’ है; नाम परनाक का देवनागरी लिप्यंतरण किया गया है।
