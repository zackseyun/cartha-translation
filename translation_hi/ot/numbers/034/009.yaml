  yaml_path: translation/ot/numbers/034/009.yaml
  text: Then the border shall extend to Ziphron[a], and its endpoint shall be Hazar-enan. This shall be your northern border.
translation:
  language: hi
  text: फिर सीमा ज़िफ़रोन तक जाएगी, और उसका अंतिम छोर[a] हसर-एनान होगा। यही तुम्हारी उत्तरी सीमा होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उसके अंतिम छोर हसर-एनान होंगे।” हिब्रू में सीमा के समापन के लिए बहुवचन अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: जाएगी
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के आगे बढ़ने या किसी स्थान तक जाने को व्यक्त करती है; हिंदी में ‘सीमा ... तक जाएगी’ स्वाभाविक और भौगोलिक अर्थ के अनुरूप है।
- source_word: הַגְּבֻל
  choice: सीमा
  rationale: यह शब्द भूभाग की निर्धारित सरहद को दर्शाता है; आधुनिक मानक हिंदी में ‘सीमा’ स्पष्ट और गरिमापूर्ण है।
- source_word: זִפְרֹנָה
  choice: ज़िफ़रोन तक
  rationale: स्थान-नाम को लिप्यंतरित किया गया है, और दिशासूचक प्रत्यय को ‘तक’ से व्यक्त किया गया है।
- source_word: וְהָיוּ תוֹצְאֹתָיו
  choice: और उसका अंतिम छोर ... होगा
  rationale: सीमा-वर्णनों में תוֹצְאֹתָיו सीमा के समाप्त होने के स्थान को सूचित करता है। हिब्रू में रूप बहुवचन है, पर हिंदी में एक सीमा-रेखा के समापन के लिए ‘अंतिम छोर’ स्वाभाविक सामूहिक अभिव्यक्ति है।
- source_word: חֲצַר עֵינָן
  choice: हसर-एनान
  rationale: यह संयुक्त स्थान-नाम है; इसे अर्थानुवाद करने के बजाय हिंदी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: זֶה יִהְיֶה לָכֶם
  choice: यही तुम्हारी ... होगी
  rationale: यह वाक्यांश पहले वर्णित रेखा को इस्राएल की सीमा के रूप में पहचानता और सारांशित करता है; ‘यही तुम्हारी’ हिंदी में सहज रूप से बल भी बनाए रखता है।
- source_word: גְּבֻל צָפוֹן
  choice: उत्तरी सीमा
  rationale: यह उत्तर दिशा की सीमा को दर्शाने वाला संबंध-पदबंध है; ‘उत्तरी सीमा’ आधुनिक हिंदी का सबसे स्वाभाविक रूप है।
