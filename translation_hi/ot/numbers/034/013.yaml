  yaml_path: translation/ot/numbers/034/013.yaml
  text: Then Moses commanded the sons of Israel, saying, “This is the land that you shall inherit by lot, which the LORD commanded to give to the nine tribes and the half-tribe.”
translation:
  language: hi
  text: तब मूसा ने इस्राएलियों को यह आज्ञा दी, “यह वह देश है जिसे तुम चिट्ठी डालकर विरासत में पाओगे और जिसे यहोवा ने नौ गोत्रों और आधे गोत्र को देने की आज्ञा दी थी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के बजाय आधुनिक हिन्दी में पूरे समुदाय के लिए स्वाभाविक और समावेशी पद।
- source_word: תִּתְנַחֲלוּ אֹתָהּ
  choice: जिसे तुम ... विरासत में पाओगे
  rationale: हित्पएल क्रिया यहाँ भूमि को पैतृक अधिकार/विरासत के रूप में प्राप्त करने का भाव देती है।
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: भूमि के आवंटन हेतु चिट्ठियाँ डालने की प्राचीन प्रक्रिया को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को नाम के रूप में सुरक्षित रखता है।
- source_word: לְתִשְׁעַת הַמַּטּוֹת וַחֲצִי הַמַּטֶּה
  choice: साढ़े नौ गोत्रों को
  rationale: ‘नौ गोत्र और आधा गोत्र’ का अर्थ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक ढंग से व्यक्त होता है।
theological_decisions:
- issue: भूमि देने वाला कर्ता और विरासत पाने वाले समुदाय का संबंध
  choice: ‘जिसे यहोवा ने ... देने की आज्ञा दी है’
  alternative: ‘जो यहोवा की आज्ञा से ... दी जाएगी’
  rationale: मूल לָתֵת की सक्रिय अनंत क्रिया ‘देने’ को बनाए रखता है और निष्क्रिय रूप से उत्पन्न होने वाली अस्पष्टता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। प्रत्यक्ष कथन और आज्ञात्मक प्रसंग को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
