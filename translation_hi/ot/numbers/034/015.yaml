base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/015.yaml
  text: The two tribes and the half-tribe have taken their inheritance beyond the Jordan at Jericho[a], eastward[b], toward the sunrise.
translation:
  language: hi
  text: दो गोत्रों और आधे गोत्र ने यरदन के उस पार, यरीहो के पास, पूर्व की ओर, सूर्योदय की दिशा में अपना उत्तराधिकार ले लिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁנֵי הַמַּטּוֹת
  choice: दो गोत्रों
  rationale: מַטֶּה का मूल अर्थ ‘लाठी’ हो सकता है, पर भूमि-विभाजन के इस प्रसंग में इसका प्रचलित अर्थ ‘गोत्र’ है।
- source_word: וַחֲצִי הַמַּטֶּה
  choice: और आधे गोत्र
  rationale: यह मनश्शे के मान्य आधे गोत्र को सूचित करता है; हिन्दी में ‘आधा गोत्र’ स्वाभाविक और स्पष्ट है।
- source_word: לָקְחוּ
  choice: ले लिया है
  rationale: काल पूर्ण हो चुकी क्रिया बताता है; निकटवर्ती व्याख्यात्मक प्रसंग में पूर्ण वर्तमान हिन्दी में उपयुक्त है।
- source_word: נַחֲלָתָם
  choice: अपना उत्तराधिकार
  rationale: यह भूमि के पैतृक/वाचा-संबंधी आवंटन का भाव बनाए रखता है और केवल ‘सम्पत्ति’ से अधिक सटीक है।
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: यरदन के उस पार
  rationale: यह वक्ता के दृष्टिकोण से यरदन-पार के क्षेत्र को दर्शाने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: יְרֵחוֹ
  choice: यरीहो के पास
  rationale: स्थाननाम यरदन के उस भाग को यरीहो के निकट बताता है; ‘के पास’ अनावश्यक रूप से ठीक नगर के भीतर होने का अर्थ नहीं देता।
- source_word: קֵדְמָה מִזְרָחָה
  choice: पूर्व की ओर, सूर्योदय की दिशा में
  rationale: दोनों दिशासूचक पदों को अलग रखते हुए इब्रानी की बलयुक्त पुनरुक्ति और ‘उदय’ की छवि सुरक्षित रहती है।
