    text: या ‘मिस्र की वादी तक।’ इब्रानी शब्द נחל प्रायः किसी मौसमी जलधारा या वादी को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उसके छोर।’ इब्रानी में यह रूप बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב הַגְּבוּל
  choice: फिर सीमा ... से मुड़कर ... जाएगी
  rationale: सीमा-वर्णन में נסב दिशा बदलने को दर्शाता है। ‘फिर’ क्रमिक प्रगति को और ‘मुड़कर’ दिशा-परिवर्तन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵעַצְמוֹן
  choice: अज़मोन से
  rationale: स्थान-नाम को अनुवादित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נַחְלָה מִצְרָיִם
  choice: मिस्र के नाले तक
  rationale: נחל प्रायः किसी मौसमी जलधारा, नाले या वादी को दर्शाता है, न कि किसी बड़ी सदानीरा नदी को। ‘नाला’ सामान्य पाठक के लिए सुबोध है; अधिक स्थलाकृतिक विकल्प ‘वादी’ पादटिप्पणी में रखा गया है।
- source_word: תּוֹצְאֹתָיו
  choice: उसका अंतिम सिरा
  rationale: सीमा-विवरण में यह शब्द सीमा के अंतिम बिंदु या छोर को सूचित करता है। इब्रानी रूप बहुवचन है, पर हिन्दी में एक सीमा-रेखा के गंतव्य के लिए एकवचन ‘अंतिम सिरा’ अधिक स्वाभाविक है; बहुवचन की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: הַיָּמָּה
  choice: समुद्र पर
  rationale: दिशासूचक रूप का अर्थ ‘समुद्र की ओर/समुद्र तक’ है और यहाँ सीमा के समुद्र पर समाप्त होने की बात है। मूल में समुद्र का नाम नहीं दिया गया, इसलिए ‘भूमध्य सागर’ स्पष्ट रूप से नहीं जोड़ा गया।
