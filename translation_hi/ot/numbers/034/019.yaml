  language: hi
  text: 'और इन पुरुषों के नाम ये हैं: यहूदा के गोत्र की ओर से यपुन्ने का पुत्र कालेब।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ... ये हैं
  rationale: वाव पिछले कथन से क्रम जारी रखता है, और אֵלֶּה नामों की पहचान प्रस्तुत करता है; हिंदी में विभाजित संरचना स्वाभाविक है।
- source_word: שְׁמוֹת הָאֲנָשִׁים
  choice: उन पुरुषों के नाम
  rationale: שְׁמוֹת construct रूप में है और הָאֲנָשִׁים विशिष्ट पुरुष प्रतिनिधियों को सूचित करता है; 'पुरुषों' से स्रोत का लिंग-संदर्भ सुरक्षित रहता है।
- source_word: לְמַטֵּה יְהוּדָה
  choice: यहूदा के गोत्र की ओर से
  rationale: इस भूमि-विभाजन प्रसंग में מַטֶּה का अर्थ 'गोत्र' है और לְ प्रतिनिधित्व को सूचित करता है; 'की ओर से' नियुक्त प्रतिनिधि का भाव स्पष्ट करता है।
- source_word: כָּלֵב
  choice: कालेब
  rationale: हिंदी बाइबल परंपरा में प्रचलित नाम-रूप।
- source_word: בֶּן יְפֻנֶּה
  choice: यपुन्ने का पुत्र
  rationale: पितृनाम-संबंधी हिब्रू रचना को स्वाभाविक और स्पष्ट हिंदी में व्यक्त किया गया है; 'यपुन्ने' प्रचलित हिंदी नाम-रूप है।
