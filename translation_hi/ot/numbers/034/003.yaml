    issue: The directional adverb קֵדְמָה is rendered as part of the noun phrase “पूर्वी छोर.”
    rationale: The Hebrew says “from the end of the Salt Sea, eastward,” not unambiguously “from the eastern end of the Salt Sea.” The Hindi should retain the directional sequence and avoid resolving it into a specified eastern extremity.
