  text: וְ/הָיָ֨ה לָ/כֶ֧ם פְּאַת נֶ֛גֶב מִ/מִּדְבַּר צִ֖ן עַל יְדֵ֣י אֱד֑וֹם וְ/הָיָ֤ה לָ/כֶם֙ גְּב֣וּל נֶ֔גֶב מִ/קְצֵ֥ה יָם הַ/מֶּ֖לַח קֵֽדְמָ/ה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/003.yaml
  text: Your southern side shall be from the wilderness of Zin along the side of Edom[b][a], and your southern border shall be from the end of the Salt Sea eastward.
translation:
  language: hi
  text: तुम्हारी दक्षिणी ओर सीन के निर्जन प्रदेश से एदोम के साथ-साथ होगी; और तुम्हारी दक्षिणी सीमा खारे सागर[a] के छोर से पूर्व की ओर होगी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परम्परागत नाम: “मृत सागर”; इब्रानी में: “खारा सागर।”'
    reason: lexical_alternative
  - marker: b
    text: 'या, अधिक संक्षेप में: “खारे सागर के पूर्वी छोर से।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּאַת נֶגֶב
  choice: दक्षिणी किनारा
  rationale: सीमा-वर्णन में פֵּאָה भूभाग के एक ओर या किनारे को दर्शाता है; नֶגֶב यहाँ दिशासूचक है।
- source_word: מִמִּדְבַּר צִן
  choice: सीन के निर्जन प्रदेश से
  rationale: מִדְבָּר ऐसे निर्जन, कम आबादी वाले भूभाग को दर्शाता है जो आवश्यक नहीं कि पूर्णतः रेगिस्तान हो; आधुनिक हिन्दी में ‘निर्जन प्रदेश’ अर्थ को स्पष्ट रखता है।
- source_word: עַל יְדֵי אֱדוֹם
  choice: एदोम के पास-पास
  rationale: यह भौगोलिक मुहावरा एदोम के बगल या साथ-साथ स्थित होने का भाव देता है, बिना इसे औपचारिक राजनीतिक सीमा घोषित किए।
- source_word: גְּבוּל נֶגֶב
  choice: दक्षिणी सीमा
  rationale: גְּבוּל भूमि की निर्धारित सीमा है और נֶגֶב यहाँ दक्षिण दिशा बताता है।
- source_word: יָם הַמֶּלַח
  choice: खारा सागर
  rationale: यह इब्रानी भौगोलिक नाम का सीधा और सहज हिन्दी रूप है; परम्परागत नाम ‘मृत सागर’ पादटिप्पणी में दिया गया है।
- source_word: מִקְצֵה יָם הַמֶּלַח קֵדְמָה
  choice: खारे सागर के पूर्वी छोर से
  rationale: קָצֶה छोर या अंतिम बिंदु दर्शाता है और קֵדְמָה पूर्व दिशा का संकेत देता है। हिन्दी में यह संयोजन सीमा के आरम्भ-बिंदु को स्वाभाविक ढंग से व्यक्त करता है, जबकि अधिक शाब्दिक रचना पादटिप्पणी में सुरक्षित है।
