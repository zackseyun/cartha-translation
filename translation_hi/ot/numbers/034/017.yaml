  text: אֵ֚לֶּה שְׁמ֣וֹת הָֽ/אֲנָשִׁ֔ים אֲשֶׁר יִנְחֲל֥וּ לָ/כֶ֖ם אֶת הָ/אָ֑רֶץ אֶלְעָזָר֙ הַ/כֹּהֵ֔ן וִ/יהוֹשֻׁ֖עַ בִּן נֽוּן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/017.yaml
  text: 'These are the names of the men who shall assign the land to you as an inheritance: Eleazar the priest and Joshua son of Nun[a].'
translation:
  language: hi
  text: 'इन पुरुषों के नाम ये हैं, जो तुम्हारे लिए देश को विरासत के रूप में बाँटेंगे: एलीआज़ार याजक और नून का पुत्र यहोशू।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें देश विरासत में देंगे” अथवा “जो तुम्हें देश का वारिस बनाएँगे।” इब्रानी क्रिया में किसी को विरासत दिलाने या विरासत बाँटकर देने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: इन पुरुषों के नाम ये हैं
  rationale: इब्रानी की संकेतवाचक, क्रियारहित पहचान-वाक्य रचना को स्वाभाविक आधुनिक हिन्दी में रखा गया है; הָאֲנָשִׁים यहाँ आगे नामित पुरुष अगुओं को सूचित करता है।
- source_word: אֲשֶׁר יִנְחֲלוּ לָכֶם אֶת הָאָרֶץ
  choice: जो तुम्हारे लिए देश को विरासत के रूप में बाँटेंगे
  rationale: נחל का हिफ़ील रूप कारणवाचक है और प्रसंग में इन अगुओं द्वारा देश का प्रशासनिक बँटवारा कराने का भाव देता है, ताकि इस्राएली उसे विरासत में पाएँ। 'बाँटेंगे' कार्य को और 'विरासत के रूप में' विरासत-संबंधी अर्थ को व्यक्त करता है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़ार याजक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण और पदनाम כֹּהֵן का गरिमापूर्ण, परिचित हिन्दी रूप रखा गया है।
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: और नून का पुत्र यहोशू
  rationale: संयोजक तथा इब्रानी पितृनाम-सूचक संबंध को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है; नामों के प्रचलित हिन्दी रूप अपनाए गए हैं।
theological_decisions:
- issue: יִנְחֲלוּ के कारणवाचक और वितरणात्मक अर्थ की प्रस्तुति
  choice: तुम्हारे लिए देश को विरासत के रूप में बाँटेंगे
  alternative: तुम्हें देश विरासत में दिलाएँगे
  rationale: चुना हुआ पाठ अधिकारियों की सक्रिय वितरण-भूमिका और देश के विरासत होने—दोनों को बनाए रखता है; वैकल्पिक पाठ कारणवाचकता को अधिक प्रत्यक्ष करता है, पर प्रशासनिक बँटवारे का भाव कम स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली। 'देश' इस प्रसंग में प्रतिज्ञात भूभाग के लिए स्वाभाविक बाइबलीय हिन्दी है; 'विरासत के रूप में बाँटेंगे' मूल क्रिया की प्रशासनिक तथा कारणवाचक अर्थ-छटाओं को संतुलित करता है।
