- source_word: תְּתָאוּ
  choice: तुम सीमा को ... निर्धारित करना
  rationale: सीमा-वर्णन में क्रिया सीमा-रेखा को चिन्हित अथवा नियत करने का भाव देती है; ‘निर्धारित करना’ स्वाभाविक और संदर्भानुकूल है।
- source_word: לְבֹא חֲמָת
  choice: लबो-हमात तक
  rationale: शाब्दिक अर्थ ‘हमात के प्रवेश तक’ है, पर यह अभिव्यक्ति एक स्थिर भौगोलिक नाम के रूप में भी समझी जाती है; मुख्य पाठ में स्थान-नाम रखा और विकल्प पादटिप्पणी में दिया गया है।
- source_word: תּוֹצְאֹת הַגְּבֻל
  choice: सीमा का अंतिम बिंदु
  rationale: भौगोलिक सीमा-वर्णन में תּוֹצְאֹת अंतिम छोर अथवा निकास-बिंदु को सूचित करता है; एकवचन हिंदी वाक्यांश यहाँ सामूहिक भाव को सहज रूप से व्यक्त करता है।
- source_word: צְדָדָה
  choice: सदाद में
  rationale: दिशासूचक ה स्थान की ओर/तक का भाव दे सकता है; सीमा के अंतिम बिंदु के संदर्भ में हिंदी में ‘सदाद में’ स्वाभाविक है।
