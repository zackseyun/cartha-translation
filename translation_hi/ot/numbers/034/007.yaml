  yaml_path: translation/ot/numbers/034/007.yaml
  text: 'And this shall be your northern border: from the Great Sea you shall mark out for yourselves Mount Hor[a][b].'
translation:
  language: hi
  text: 'और तुम्हारी उत्तरी सीमा यह होगी: बड़े समुद्र से तुम अपनी सीमा-रेखा होर पर्वत तक खींचोगे[a]।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “तुम होर पर्वत तक अपनी सीमा निर्धारित करोगे।” इस भौगोलिक संदर्भ में इब्रानी क्रिया सीमा-रेखा खींचने या सीमा निर्धारित करने का बोध करा सकती है।
    reason: lexical_alternative
  - marker: b
    text: “बड़े समुद्र” से भूमध्य सागर का संकेत है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/זֶה יִהְיֶה לָ/כֶם
  choice: और तुम्हारी ... यह होगी
  rationale: संयोजक וְ को रखकर विधिक और क्रमिक प्रवाह बनाए रखा गया है; לָכֶם को स्वाभाविक हिन्दी में संबंधसूचक ‘तुम्हारी’ से व्यक्त किया गया है।
- source_word: גְּבוּל צָפוֹן
  choice: उत्तरी सीमा
  rationale: צָפוֹן यहाँ גְּבוּל का दिशासूचक विशेषण है; ‘उत्तरी सीमा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִן הַ/יָּם הַ/גָּדֹל
  choice: महासागर से
  rationale: शाब्दिक भौगोलिक पद ‘बड़ा समुद्र’ हिन्दी बाइबलीय प्रयोग में ‘महासागर’ के रूप में स्वाभाविक है; आधुनिक नाम मुख्य पाठ में आरोपित न करके टिप्पणी में स्पष्ट किया गया है।
- source_word: תְּתָאוּ לָ/כֶם
  choice: तुम सीमा को ... खींचना
  rationale: सीमा-वर्णन के इस संदर्भ में क्रिया का अर्थ सीमा-रेखा खींचना या निर्धारित करना है। हिन्दी का निर्देशात्मक क्रियारूप ‘खींचना’ विधिक शैली को सहजता से व्यक्त करता है; לָכֶם का हितार्थ भाव पूरे निर्देश और पहले आए ‘तुम्हारी’ से पर्याप्त रूप से संप्रेषित होता है।
- source_word: הֹר הָ/הָר
  choice: होर पर्वत
  rationale: असामान्य इब्रानी रूप को स्थापित स्थाननाम के रूप में ‘होर पर्वत’ लिखा गया है।
