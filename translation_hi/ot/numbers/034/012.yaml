  text: וְ/יָרַ֤ד הַ/גְּבוּל֙ הַ/יַּרְדֵּ֔נָ/ה וְ/הָי֥וּ תוֹצְאֹתָ֖י/ו יָ֣ם הַ/מֶּ֑לַח זֹאת֩ תִּהְיֶ֨ה לָ/כֶ֥ם הָ/אָ֛רֶץ לִ/גְבֻלֹתֶ֖י/הָ סָבִֽיב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/012.yaml
  text: Then the border shall go down to the Jordan[a], and its end shall be at the Salt Sea[b]. This shall be your land according to its borders all around.
translation:
  language: hi
  text: फिर सीमा यरदन तक नीचे जाएगी, और उसके अंतिम बिंदु खारे सागर[a] पर होंगे। चारों ओर की इसकी सीमाओं के अनुसार यही तुम्हारा देश होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘खारा सागर’; यह वही जलाशय है जिसे आज सामान्यतः मृत सागर कहा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְיָרַד
  choice: फिर ... नीचे जाएगी
  rationale: ירד का मूल अर्थ ‘नीचे जाना/उतरना’ है। सीमा-निर्धारण के इस क्रम में स्त्रीलिंग ‘सीमा’ के साथ भविष्यसूचक ‘नीचे जाएगी’ स्वाभाविक है; וְ को क्रमसूचक ‘फिर’ से व्यक्त किया गया है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: גְּבוּל यहाँ भूभाग को निर्धारित करने वाली सीमा-रेखा है; आधुनिक हिन्दी में ‘सीमा’ स्पष्ट और स्वाभाविक है।
- source_word: הַיַּרְדֵּנָה
  choice: यरदन तक
  rationale: दिशासूचक הָ गति को यरदन की ओर दर्शाता है। नदी की पहचान पाठ में अंतर्निहित है, इसलिए ‘नदी’ जोड़ना आवश्यक नहीं।
- source_word: תוֹצְאֹתָיו
  choice: उसका अंतिम छोर
  rationale: सीमा-वर्णनों में תוֹצָאוֹת सीमा के समाप्त होने के स्थान या अंतिम बिंदु को दर्शाता है। रूप बहुवचन है, पर एक सीमा-रेखा के समापन को सहज हिन्दी में ‘अंतिम छोर’ कहना स्पष्ट है।
- source_word: יָם הַמֶּלַח
  choice: खारा सागर
  rationale: हिब्रू पद का शाब्दिक अर्थ ‘नमक/खारेपन का सागर’ है। ‘खारा सागर’ स्रोत की संज्ञा को सुरक्षित रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: זֹאת תִּהְיֶה לָכֶם הָאָרֶץ
  choice: यही तुम्हारा देश होगा
  rationale: यह वाक्य निर्दिष्ट भूभाग का सार प्रस्तुत करता है। לָכֶם को स्वाभाविक अधिकारसूचक हिन्दी ‘तुम्हारा’ से व्यक्त किया गया है और זֹאת पर बल ‘यही’ से सुरक्षित है।
- source_word: לִגְבֻלֹתֶיהָ סָבִיב
  choice: चारों ओर अपनी सीमाओं के अनुसार
  rationale: यह पद देश को उसकी चारों ओर की सीमाओं द्वारा परिभाषित करता है। अनुवाद स्रोत की संरचना और परिसीमन का भाव बनाए रखता है।
theological_decisions: []
