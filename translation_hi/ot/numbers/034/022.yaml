  text: 'और दान के वंशजों[a] के गोत्र के लिए एक अगुआ: याग्ली का पुत्र बुक्की।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “दान के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र से
  rationale: गिनती 34 में מַטֶּה भूमि-विभाजन के संदर्भ में ‘गोत्र’ को सूचित करता है। לְ यहाँ प्रतिनिधि के उस गोत्र से संबद्ध होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְנֵי דָן
  choice: दान के वंशजों
  rationale: शाब्दिक अर्थ ‘दान के पुत्र’ है; गोत्रीय सूत्र में आशय दान के वंशजों से है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: נָשִׂיא
  choice: अगुआ
  rationale: यहाँ यह शब्द भूमि-विभाजन के लिए नियुक्त गोत्रीय प्रधान अथवा प्रतिनिधि को दर्शाता है। ‘अगुआ’ आधुनिक, स्पष्ट और राजकीय अर्थ से मुक्त है।
- source_word: בֻּקִּי
  choice: बुक्की
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: प्रत्यक्ष पिता-पुत्र संबंध बताने वाला सामान्य वंशावली-सूत्र।
- source_word: יָגְלִי
  choice: योगली
  rationale: इब्रानी יָגְלִי का ध्वनि-संगत देवनागरी लिप्यंतरण; प्रारम्भिक י को ‘य’ से दर्शाया गया है।
