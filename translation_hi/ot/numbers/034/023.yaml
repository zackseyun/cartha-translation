base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/023.yaml
  text: 'For the sons of Joseph[a], for the tribe of the sons of Manasseh: a leader, Hanniel son of Ephod.'
translation:
  language: hi
  text: 'यूसुफ के पुत्रों के लिए—मनश्शे के पुत्रों के गोत्र के लिए—एक प्रधान: हन्नीएल, एपोद का पुत्र।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי יוֹסֵף
  choice: यूसुफ के पुत्रों में से
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह वंशजों के लिए प्रयुक्त गोत्र-संबंधी भाषा है। ‘में से’ हिन्दी में सूची की संरचना और मनश्शे के गोत्र को यूसुफ के वंश के अंतर्गत दिखाता है।
- source_word: לְ/מַטֵּה
  choice: गोत्र के लिए
  rationale: मूल शब्द מַטֶּה का यहाँ जनगणना और भूमि-विभाजन के प्रशासनिक संदर्भ में अर्थ ‘गोत्र’ है; לְ को ‘के लिए’ से व्यक्त किया गया है।
- source_word: בְנֵי מְנַשֶּׁה
  choice: मनश्शे के पुत्रों
  rationale: मूल की बार-बार आने वाली ‘पुत्रों’ वाली गोत्र-वंशावली भाषा को बनाए रखा गया है; आशय मनश्शे के वंशजों से है।
- source_word: נָשִׂיא
  choice: एक प्रधान
  rationale: यह किसी गोत्र के नियुक्त मुखिया को दर्शाता है। ‘प्रधान’ आधुनिक हिन्दी में आधिकारिक नेतृत्व का भाव देता है और ‘राजकुमार’ जैसा अनावश्यक राजकीय अर्थ नहीं लाता।
- source_word: חַנִּיאֵל
  choice: हन्नीएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן אֵפֹד
  choice: एपोद का पुत्र
  rationale: यह सामान्य पितृनाम-सूचक रचना है। यहाँ ‘एपोद’ व्यक्ति का नाम है, याजकीय वस्त्र नहीं।
