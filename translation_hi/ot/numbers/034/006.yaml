  yaml_path: translation/ot/numbers/034/006.yaml
  text: And the western border shall be for you the Great Sea as a border[a]; this shall be your western border.
translation:
  language: hi
  text: और तुम्हारी पश्चिमी सीमा बड़ा समुद्र होगी; यही तुम्हारी पश्चिमी सीमा होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: גְבוּל
  choice: सीमा
  rationale: यह संज्ञा किसी भूभाग की हद या सीमा-रेखा को दर्शाती है; भूमि की सीमाओं के इस प्रसंग में ‘सीमा’ स्वाभाविक और सटीक है।
- source_word: יָם
  choice: पश्चिमी
  rationale: גְּבוּל יָם में יָם का मूल अर्थ ‘समुद्र’ है, पर यहाँ समुद्र की ओर की दिशा, अर्थात पश्चिम, अभिप्रेत है।
- source_word: הַיָּם הַגָּדוֹל
  choice: महासागर
  rationale: यह भूमध्य सागर के लिए प्रयुक्त भौगोलिक पदनाम है। ‘महासागर’ हिंदी बाइबलीय शैली में इस नाम को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: וְהָיָה לָכֶם ... וּגְבוּל
  choice: तुम्हारी ... सीमा होगी
  rationale: हिब्रू वाक्यांश निर्धारित करता है कि महासागर इस्राएल के लिए सीमा का काम करेगा; हिंदी में यह संरचना आवंटन और सीमांकन दोनों को स्पष्ट करती है।
- source_word: זֶה יִהְיֶה לָכֶם גְּבוּל יָם
  choice: यही तुम्हारी पश्चिमी सीमा होगी
  rationale: यह समापन-वाक्य पहले कथन को दोहराकर पश्चिमी सीमा की पुष्टि करता है; ‘यही’ זֶה के संकेतात्मक और सारांशात्मक बल को व्यक्त करता है।
