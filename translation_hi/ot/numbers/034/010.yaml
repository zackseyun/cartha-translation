    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְאַוִּיתֶם
  choice: खींचना
  rationale: यह असामान्य क्रिया इस भौगोलिक-वैधानिक संदर्भ में सीमा-रेखा अंकित या निर्धारित करने को दर्शाती है। आधुनिक हिंदी में ‘सीमा ... खींचना’ स्वाभाविक और स्पष्ट है।
- source_word: לָכֶם
  choice: अपने लिए
  rationale: यह इस्राएलियों के हित और अधिकार-क्षेत्र के लिए किए जाने वाले कार्य का लाभार्थी भाव सुरक्षित रखता है।
- source_word: לִגְבוּל קֵדְמָה
  choice: पूर्वी सीमा
  rationale: גְבוּל क्षेत्रीय सीमा को और קֵדְמָה यहाँ उसकी पूर्व दिशा को सूचित करता है; संयुक्त हिंदी पद स्वाभाविक है।
- source_word: מֵחֲצַר עֵינָן
  choice: हसर-एनान से
  rationale: स्थान-नाम को अनुवादित करने के बजाय देवनागरी में लिप्यंतरित किया गया है; מֵ־ आरंभ-बिंदु दर्शाता है।
- source_word: שְׁפָמָה
  choice: शपाम तक
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; दिशासूचक ה के कारण यहाँ सीमा-खंड का गंतव्य ‘तक’ से व्यक्त है।
