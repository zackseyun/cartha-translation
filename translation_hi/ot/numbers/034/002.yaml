base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/002.yaml
  text: 'Command the sons of Israel and say to them[a], ‘When you enter the land of Canaan[b], this is the land that will fall to you as an inheritance: the land of Canaan according to its borders.’'
translation:
  language: hi
  text: “इस्राएल के पुत्रों[a] को आज्ञा दे और उनसे कह, ‘जब तुम कनान देश में प्रवेश करोगे, तब यह वह देश है जो तुम्हारे हिस्से में विरासत के रूप में आएगा[b]—कनान देश, उसकी सीमाओं के अनुसार निर्धारित।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों”; अधिक सहज हिन्दी में, “इस्राएलियों।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो तुम्हारे लिए विरासत के रूप में गिरेगा।” यह इब्रानी मुहावरा चिट्ठी डालकर किए गए या निर्धारित बँटवारे में किसी के हिस्से आने वाले भूभाग के लिए प्रयुक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: आज्ञा दे
  rationale: यह צוה का आज्ञार्थक रूप है और एक अधिकारपूर्ण निर्देश व्यक्त करता है; ‘आज्ञा दे’ आधुनिक हिन्दी में उसके बल को स्वाभाविक ढंग से बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का निकट और लिंग-सटीक रूप है। अधिक सहज ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: यह क्रमिक आदेश को संक्षिप्त, औपचारिक और स्रोत के निकट रूप में व्यक्त करता है।
- source_word: כִּי אַתֶּם בָּאִים אֶל
  choice: जब तुम ... प्रवेश करोगे
  rationale: כִּי यहाँ परिस्थिति/समय का परिचय देता है और participle निकट भविष्य में प्रवेश को दर्शाता है; हिन्दी का भविष्यकाल इस आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאָרֶץ כְּנָעַן
  choice: कनान देश
  rationale: यह हिन्दी में स्पष्ट और प्रचलित ढंग से कनान नामक भूभाग को व्यक्त करता है।
- source_word: זֹאת הָאָרֶץ
  choice: यह वह देश है
  rationale: निर्देशक זֹאת आगामी सीमाविवरण के लिए निश्चित भूभाग की पहचान कराता है; ‘यह वह देश है’ हिन्दी में इस संकेतात्मक बल को बनाए रखता है।
- source_word: אֲשֶׁר תִּפֹּל לָכֶם בְּנַחֲלָה
  choice: जो तुम्हें विरासत के रूप में बाँटकर मिलेगा
  rationale: נפל का शाब्दिक अर्थ ‘गिरना’ है, पर भूमि-विभाजन के प्रसंग में यह चिट्ठी अथवा नियत बँटवारे में किसी के हिस्से आने का मुहावरा है। हिन्दी में ‘बाँटकर मिलेगा’ अर्थ को स्पष्ट करता है, जबकि शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: אֶרֶץ כְּנַעַן לִגְבֻלֹתֶיהָ
  choice: कनान देश अपनी सीमाओं के अनुसार
  rationale: यह आगे वर्णित होने वाली भौगोलिक सीमाओं के अनुसार निर्धारित पूरे भूभाग को औपचारिक ढंग से व्यक्त करता है।
