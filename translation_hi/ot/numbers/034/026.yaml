  text: 'And for the tribe of the sons of Issachar, a leader: Paltiel son of Azzan.'
translation:
  language: hi
  text: 'और इस्साकार के पुत्रों के गोत्र के लिए प्रधान: अज्जान का पुत्र पलतीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र के लिए
  rationale: इस जनजातीय और भूमि-विभाजन संबंधी सूची में מַטֶּה का अर्थ ‘गोत्र’ है; उपसर्ग וּ और לְ को स्वाभाविक रूप से ‘और ... के लिए’ द्वारा व्यक्त किया गया है।
- source_word: בְנֵי
  choice: पुत्रों के
  rationale: यह औपचारिक रूप से ‘पुत्रों’ है और इस्साकार के गोत्र की पारंपरिक वंशगत पहचान बताता है।
- source_word: יִשָׂשכָר
  choice: इस्साकार
  rationale: इब्रानी व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: נָשִׂיא
  choice: एक प्रधान
  rationale: यहाँ शब्द भूमि बाँटने के लिए नियुक्त गोत्रीय प्रतिनिधि या अगुए को दर्शाता है; ‘प्रधान’ सूची की गरिमापूर्ण प्रशासनिक भाषा में स्वाभाविक है और राजवंशीय अर्थ नहीं थोपता।
- source_word: פַּלְטִיאֵל
  choice: पलतीएल
  rationale: इब्रानी व्यक्तिनाम का हिन्दी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: यह सामान्य पितृनाम-सूचक पद है, इसलिए प्रत्यक्ष रूप से ‘पुत्र’ अनूदित किया गया है।
- source_word: עַזָּן
  choice: अज्जान
  rationale: इब्रानी नाम में व्यंजन के द्वित्व को दर्शाने वाला हिन्दी लिप्यंतरण।
