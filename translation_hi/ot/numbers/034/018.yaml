source:
  edition: WLC
  text: וְ/נָשִׂ֥יא אֶחָ֛ד נָשִׂ֥יא אֶחָ֖ד מִ/מַּטֶּ֑ה תִּקְח֖וּ לִ/נְחֹ֥ל אֶת הָ/אָֽרֶץ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/018.yaml
  text: And you shall take one leader from each tribe to inherit the land[a].
translation:
  language: hi
  text: और देश को विरासत में लेने के लिए तुम हर गोत्र से एक-एक प्रधान लो[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश को विरासत के रूप में बाँटने के लिए।” इब्रानी क्रिया का अर्थ विरासत में पाना या विरासत/भाग दिलाना हो सकता है; यहाँ का संदर्भ भूमि के हिस्से बाँटने की प्रक्रिया से जुड़ा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह शब्द किसी मान्य अगुए या मुखिया को दर्शाता है। गोत्रों के प्रशासनिक प्रतिनिधियों के लिए ‘प्रधान’ स्वाभाविक और गरिमापूर्ण है तथा ‘राजकुमार’ का भ्रामक राजकीय अर्थ नहीं लाता।
- source_word: אֶחָד נָשִׂיא אֶחָד מִמַּטֶּה
  choice: हर गोत्र से एक-एक प्रधान
  rationale: ‘एक’ की पुनरावृत्ति प्रत्येक गोत्र से एक प्रतिनिधि चुने जाने पर बल देती है; हिंदी में ‘एक-एक’ इस वितरणात्मक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: מִמַּטֶּה
  choice: हर गोत्र से
  rationale: מַטֶּה का मूल अर्थ ‘लाठी’ भी हो सकता है, पर इस गोत्रीय-प्रशासनिक संदर्भ में इसका अर्थ ‘गोत्र’ है।
- source_word: תִּקְחוּ
  choice: तुम ... लेना
  rationale: अपूर्ण क्रिया यहाँ बहुवचन संबोधन में निर्देश देती है। ‘लेना’ आधुनिक हिंदी में इस आज्ञार्थक निर्देश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִנְחֹל
  choice: विरासत के रूप में बाँटने के लिए
  rationale: संदर्भ में नियुक्त प्रधान देश के हिस्से निर्धारित करने की प्रक्रिया में भाग लेते हैं। यह पदबंध क्रिया के उत्तराधिकार दिलाने अथवा विरासत बाँटने वाले भाव को व्यक्त करता है, जबकि वैकल्पिक अकर्मक अर्थ पाद-टिप्पणी में सुरक्षित है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यह इस्राएल को मिलने वाले विशिष्ट भूभाग को दर्शाता है; बाइबलीय हिंदी में ‘देश’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: לִנְחֹל का कर्तृवाचक या हेत्वर्थक अर्थ
  choice: देश को विरासत के रूप में बाँटना
  alternative: देश का उत्तराधिकार पाना
  rationale: निकटवर्ती संदर्भ में ये प्रधान भूमि-विभाजन के प्रतिनिधि हैं, इसलिए हेत्वर्थक/आवंटन संबंधी अर्थ अधिक उपयुक्त है। फिर भी इब्रानी रूप उत्तराधिकार पाने का अर्थ भी दे सकता है, इसलिए उस वास्तविक अस्पष्टता को पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; निर्देशात्मक किंतु सहज शैली। ‘हर गोत्र से एक-एक प्रधान’ मूल की वितरणात्मक पुनरावृत्ति को स्वाभाविक हिंदी में रखता है।
