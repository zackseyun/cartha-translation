  text: אֵ֕לֶּה אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה לְ/נַחֵ֥ל אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/אֶ֥רֶץ כְּנָֽעַן־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/029.yaml
  text: These are the ones whom Yahweh commanded to apportion the inheritance to the sons of Israel in the land of Canaan[a].
translation:
  language: hi
  text: ये वे लोग हैं जिन्हें यहोवा ने कनान देश में इस्राएलियों को विरासत का भाग बाँटने की आज्ञा दी थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कनान देश में इस्राएलियों को विरासत दिलाने की आज्ञा दी थी।”
    reason: לְנַחֵל का हिफ़ील रूप विरासत का भाग बाँटने के साथ-साथ किसी को विरासत दिलाने का भाव भी व्यक्त कर सकता है।
lexical_decisions:
- source_word: אֵלֶּה אֲשֶׁר
  choice: ये वही लोग हैं जिन्हें
  rationale: यह पद पहले बताए गए नियुक्त अगुओं की निष्कर्षात्मक पहचान करता है; यह हिन्दी में स्वाभाविक रहते हुए संकेतवाचक और सम्बन्धवाचक बल बनाए रखता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: क्रिया का सामान्य अर्थ ‘आज्ञा देना’ है। पूर्ववर्ती सूची के समापन के प्रसंग में पूर्ण हुई नियुक्ति को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘दी थी’ प्रयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְנַחֵל
  choice: विरासत का भाग बाँटने
  rationale: हिफ़ील रूप यहाँ भूमि को विरासत के रूप में दिलाने अथवा उसका भाग निर्धारित करने का भाव रखता है; प्रसंग भूमि-विभाजन का है, इसलिए यह अभिव्यक्ति दोनों पक्षों को स्पष्ट करती है।
- source_word: אֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों को
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ के स्थान पर आधुनिक हिन्दी में पूरे समुदाय के लिए स्वाभाविक और समावेशी जातिवाचक रूप चुना गया है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: यह भौगोलिक पद का स्पष्ट और स्वाभाविक हिन्दी रूप है तथा ‘देश/भूमि’ का अर्थ भी सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में परिचित ‘यहोवा’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखता है; ‘याहवे’ अधिक अकादमिक लिप्यंतरण है।
- issue: לְנַחֵל में विरासत दिलाने और भाग बाँटने का अर्थ-संबंध
  choice: विरासत का भाग बाँटने
  alternative: विरासत दिलाने
  rationale: निकटवर्ती प्रसंग नियुक्त अगुओं द्वारा भूमि के हिस्से निर्धारित करने का है। मुख्य पाठ वितरण का भाव स्पष्ट करता है, जबकि पादटिप्पणी कारणवाचक ‘विरासत दिलाने’ की सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘इस्राएलियों’ सामान्य पाठक के लिए ‘इस्राएल के पुत्रों’ से अधिक स्वाभाविक है।
