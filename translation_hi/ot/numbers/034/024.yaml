  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। हिब्रू पदक्रम की सूची-जैसी संक्षिप्त संरचना और विराम को यथासंभव बनाए रखा गया है। ‘एप्रैम के वंशजों के गोत्र’ मूल के בְנֵי אֶפְרַיִם का अर्थ स्पष्ट करता है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
