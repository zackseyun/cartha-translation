  text: וּ/לְ/מַטֵּ֥ה בְנֵֽי אֶפְרַ֖יִם נָשִׂ֑יא קְמוּאֵ֖ל בֶּן שִׁפְטָֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/024.yaml
  text: 'And for the tribe of the sons of Ephraim[a], a leader: Kemuel son of Shiphtan.'
translation:
  language: hi
  text: 'और एप्रैम के वंशजों के गोत्र के लिए अगुआ: शिप्तान का पुत्र कमूएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र के लिए
  rationale: सूची के इस प्रशासनिक संदर्भ में מַטֶּה का अर्थ शाब्दिक ‘लाठी’ नहीं, बल्कि ‘गोत्र’ है; उपसर्गों וּ और לְ को ‘और ... के लिए’ से व्यक्त किया गया है।
- source_word: בְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों
  rationale: शाब्दिक रूप ‘एप्रैम के पुत्र’ है, पर गोत्र-सूत्र में इसका आशय एप्रैम के वंशजों अथवा गोत्र के सदस्यों से है। ‘वंशजों’ आधुनिक हिन्दी में इस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נָשִׂיא
  choice: अगुआ
  rationale: यहाँ शब्द गोत्र के नियुक्त प्रतिनिधि या प्रधान को दर्शाता है। ‘अगुआ’ स्पष्ट और गैर-राजकीय है, जबकि ‘राजकुमार’ भ्रामक राजसी अर्थ दे सकता है।
- source_word: קְמוּאֵל
  choice: कमूएल
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंशसूचक संरचना का स्वाभाविक हिन्दी रूप।
- source_word: שִׁפְטָן
  choice: शिप्तान
  rationale: हिब्रू व्यक्तिगत नाम का हिन्दी लिप्यंतरण; פְ को ‘प्’ और ט को ‘त’ से दर्शाया गया है।
theological_decisions: []
