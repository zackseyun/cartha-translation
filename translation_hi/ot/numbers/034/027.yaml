  text: וּ/לְ/מַטֵּ֥ה בְנֵי אָשֵׁ֖ר נָשִׂ֑יא אֲחִיה֖וּד בֶּן שְׁלֹמִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/027.yaml
  text: 'And for the tribe of the sons of Asher, a leader: Ahihud son of Shelomi.'
translation:
  language: hi
  text: 'और आशेर के वंशजों के गोत्र के लिए प्रधान: शलोमी का पुत्र अहीहूद।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/לְ/מַטֵּה
  choice: और ... के गोत्र के लिए
  rationale: भूमि-विभाजन के इस प्रसंग में מַטֶּה का अर्थ लाठी नहीं, बल्कि इस्राएल का गोत्र है; उपसर्ग וּ और לְ को स्वाभाविक रूप से ‘और ... के लिए’ कहा गया है।
- source_word: בְנֵי אָשֵׁר
  choice: आशेर के वंशजों
  rationale: शाब्दिक अर्थ ‘आशेर के पुत्र’ है, पर यहाँ पूरे गोत्रीय समुदाय का संकेत है; आधुनिक हिन्दी में ‘वंशजों’ अभिप्राय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह भूमि बाँटने के लिए नियुक्त गोत्रीय प्रतिनिधि या अगुआ को सूचित करता है। ‘प्रधान’ पद की आधिकारिक प्रकृति रखता है और ‘राजकुमार’ जैसे राजकीय अर्थ से बचता है।
- source_word: אֲחִיהוּד
  choice: अहीहूद
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן שְׁלֹמִי
  choice: शलोमी का पुत्र
  rationale: इब्रानी पितृनाम-सूचक रचना का स्वाभाविक हिन्दी रूप।
