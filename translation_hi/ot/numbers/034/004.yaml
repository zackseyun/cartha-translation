  text: וְ/נָסַ֣ב לָ/כֶם֩ הַ/גְּב֨וּל מִ/נֶּ֜גֶב לְ/מַעֲלֵ֤ה עַקְרַבִּים֙ וְ/עָ֣בַר צִ֔נָ/ה ו/היה תּֽוֹצְאֹתָ֔י/ו מִ/נֶּ֖גֶב לְ/קָדֵ֣שׁ בַּרְנֵ֑עַ וְ/יָצָ֥א חֲצַר אַדָּ֖ר וְ/עָבַ֥ר עַצְמֹֽנָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/034/004.yaml
  text: Then the border shall turn for you from the south of the Ascent of Akrabbim[a], and cross to Zin; and its end shall be south of Kadesh-barnea; then it shall go out to Hazar-addar and cross to Azmon.
translation:
  language: hi
  text: तब तुम्हारी सीमा अक्रब्बीम की चढ़ाई[a] के दक्षिण से मुड़ेगी और सीन से होकर गुज़रेगी। उसके अंतिम बिंदु कादेश-बर्ने के दक्षिण में होंगे। फिर वह हसर-अद्दार तक आगे बढ़ेगी और असमोन को पार करेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अक्रब्बीम’ का अर्थ संभवतः ‘बिच्छू’ है; इस स्थान-नाम का अनुवाद ‘बिच्छुओं की चढ़ाई’ या ‘बिच्छू दर्रा’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַב
  choice: मुड़ेगी
  rationale: सीमा-वर्णन में यह क्रिया सीमा-रेखा के मुड़ने या दिशा बदलने को व्यक्त करती है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: भूमि की क्षेत्रीय हद के लिए आधुनिक मानक हिन्दी में स्वाभाविक और स्पष्ट शब्द।
- source_word: מִנֶּגֶב לְמַעֲלֵה עַקְרַבִּים
  choice: अक्रब्बीम की चढ़ाई के दक्षिण से
  rationale: מִנֶּגֶב स्थान-चिह्न के दक्षिणी ओर को दर्शाता है; מַעֲלֵה का अर्थ चढ़ाई है और अक्रब्बीम को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: וְעָבַר צִנָה
  choice: और सीन तक जाएगी
  rationale: सीमा-विवरण में עָבַר सीमा-रेखा के आगे गुजरने को बताता है और दिशासूचक ה गति को सीन की ओर इंगित करता है। सहज हिन्दी में इसे 'तक जाएगी' कहा गया है।
- source_word: וְהָיָה תּוֹצְאֹתָיו
  choice: उसका अंतिम छोर ... होगा
  rationale: रूपात्मक रूप से תּוֹצְאֹתָיו बहुवचन है, पर सीमा-वर्णनों में यह उसके निकास या अंतिम छोर को सूचित करने वाला मुहावरा है; हिन्दी में एक सीमा-रेखा के लिए एकवचन अधिक स्वाभाविक है।
- source_word: מִנֶּגֶב לְקָדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्ने के दक्षिण में
  rationale: वाक्यांश सीमा के अंतिम छोर को कादेश-बर्ने की दक्षिणी ओर स्थित करता है।
- source_word: וְיָצָא חֲצַר אַדָּר
  choice: फिर वह हसर-अद्दार तक आगे बढ़ेगी
  rationale: सीमा-विवरण में יָצָא सीमा-रेखा के अगले स्थान तक फैलने या आगे बढ़ने को दर्शाता है।
- source_word: וְעָבַר עַצְמֹנָה
  choice: और असमोन तक जाएगी
  rationale: क्रिया सीमा के आगे गुजरने और दिशासूचक ה असमोन की ओर गति को दर्शाते हैं।
