base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/032.yaml
  text: 'And on the seventh day: seven bulls[a], two rams, and fourteen one-year-old lambs without blemish.'
translation:
  language: hi
  text: 'और सातवें दिन: सात बैल, दो मेढ़े और एक वर्ष के चौदह दोषरहित मेम्ने।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁבִיעִי
  choice: और सातवें दिन
  rationale: संयोजक וּ पिछले पदों की क्रमिक सूची से संबंध बनाए रखता है; בַיּוֹם और क्रमवाचक विशेषण का स्वाभाविक हिन्दी रूप ‘सातवें दिन’ है।
- source_word: פָּרִים שִׁבְעָה
  choice: सात बैल
  rationale: बलिदान-संबंधी संदर्भ में פָּרִים का सीधा और सहज अर्थ ‘बैल’ है; आयु मूल पाठ में स्पष्ट नहीं की गई।
- source_word: אֵילִם שְׁנָיִם
  choice: दो मेढ़े
  rationale: אַיִל के बहुवचन का बलिदान-सूची में मानक हिन्दी समतुल्य ‘मेढ़े’ है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: एक वर्ष के चौदह मेम्ने
  rationale: בְּנֵי שָׁנָה शाब्दिक रूप से ‘एक वर्ष के’ पशुओं को दर्शाता है; संख्या और संज्ञा को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदान-संबंधी प्रयोग में यह शब्द शारीरिक दोष या खोट से रहित होने को दर्शाता है; ‘निर्दोष’ संक्षिप्त, प्रतिष्ठित और सामान्य पाठक के लिए स्पष्ट है।
theological_decisions:
- issue: תְּמִימִם का व्याकरणिक संबंध
  choice: इसे निकटतम संज्ञा ‘मेम्ने’ के विशेषण के रूप में प्रस्तुत किया गया है।
  alternative: इसे सूची के सभी पशुओं—बैल, मेढ़े और मेम्ने—पर लागू माना जा सकता है।
  rationale: यह पुल्लिंग बहुवचन विशेषण सूची के अंत में आता है और निकटतम रूप से मेम्नों से जुड़ता है; हिन्दी में इसी स्पष्ट वाक्य-संबंध को रखा गया है, बिना व्यापक धार्मिक निष्कर्ष जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी, संक्षिप्त बलिदान-सूची की शैली और मूल के क्रमिक संबंध को बनाए रखते हुए। विराम-चिह्न के रूप में द्विबिंदु सूची का परिचय देता है।
