base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/024.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: hi
  text: और बैलों, मेढ़ों और मेम्नों के लिए उनकी अन्नबलि और पेय-बलियाँ, उनकी संख्या के अनुसार, निर्धारित विधि[a] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ठहराए हुए नियम के अनुसार।” इब्रानी शब्द इन बलियों के लिए स्थापित वैधानिक प्रक्रिया को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: उनकी अन्नबलियाँ
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अन्नबलि को दर्शाता है। इब्रानी में रूप सामूहिक एकवचन है, पर अनेक पशुओं के साथ दी जाने वाली बलियों के कारण हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: וְנִסְכֵּיהֶם
  choice: और पेय-बलियाँ
  rationale: נֶסֶךְ उंडेली जाने वाली पेय-भेंट है; ‘पेय-बलि’ आधुनिक हिन्दी में स्पष्ट है और धार्मिक संदर्भ बनाए रखती है।
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: बैलों, मेढ़ों और मेम्नों के लिए
  rationale: उपसर्ग ל यहाँ प्रत्येक प्रकार के बलि-पशु से संबंधित सहायक भेंटों को दर्शाता है; ‘के लिए’ इस संबंध को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּמִסְפָּרָם
  choice: उनकी संख्या के अनुसार
  rationale: यह वाक्यांश बताता है कि सहायक बलियाँ पशुओं की संख्या के अनुपात में हों।
- source_word: כַּמִּשְׁפָּט
  choice: निर्धारित विधि के अनुसार
  rationale: बलिदान-विधान में מִשְׁפָּט स्थापित और बाध्यकारी प्रक्रिया को दर्शाता है; यह अनुवाद कानूनी तथा प्रक्रियात्मक दोनों भावों को स्पष्ट रखता है।
