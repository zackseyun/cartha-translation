  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offerings.
translation:
  language: hi
  text: नित्य होमबलि, उसकी अन्नबलि और उसकी पेयबलियों के अतिरिक्त, पापबलि के लिए एक बकरा भी चढ़ाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׂעִיר
  choice: बकरा
  rationale: बलिदान के संदर्भ में यह शब्द नर बकरे को दर्शाता है; ‘बकरा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: इस अनुष्ठानिक संदर्भ में संज्ञा का अर्थ पाप के लिए चढ़ाया जाने वाला बलिदान है, न कि केवल अमूर्त ‘पाप’।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि उल्लिखित बलिदान पहले से निर्धारित नित्य चढ़ावे के अलावा चढ़ाया जाना है।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: यह नियमित रूप से बार-बार चढ़ाई जाने वाली स्थायी होमबलि को दर्शाता है; ‘नित्य’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और स्पष्ट है।
- source_word: מִנְחָתָהּ
  choice: उसके अन्नबलि
  rationale: बलिदानों की सूची में מִנְחָה साथ चढ़ाई जाने वाली अन्नबलि है; स्त्रीलिंग प्रत्यय का संबंध होमबलि से है।
- source_word: וּנְסָכֶיהָ
  choice: तथा पेय-अर्घों
  rationale: נֶסֶךְ उंडेला जाने वाला पेय-चढ़ावा है; मूल का बहुवचन बनाए रखते हुए ‘पेय-अर्घ’ उसका अर्थ स्पष्ट करता है।
