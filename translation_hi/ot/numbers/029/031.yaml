translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पूर्ववर्ती सूची से व्याकरणिक रूप से जुड़ा है, फिर भी हिन्दी में स्पष्टता के लिए आज्ञार्थक भाव और समापन वाक्य जोड़ा गया है। अंग्रेज़ी परामर्श-पाठ के पादटिप्पणी-चिह्न और उनकी सामग्री परस्पर असंगत थे, इसलिए स्रोत-पाठ में अनावश्यक पादटिप्पणियाँ नहीं जोड़ी गईं।
