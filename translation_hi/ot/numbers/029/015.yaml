lexical_decisions:
- source_word: עִשָּׂרוֹן ... עִשָּׂרוֹן
  choice: दसवाँ भाग
  rationale: बलिदान-संबंधी इस संदर्भ में यह संज्ञा एपा के दसवें भाग की माप को सूचित करती है। हिन्दी में संक्षिप्त और स्वाभाविक रूप रखा गया है; इब्रानी की पुनरुक्ति का वितरणात्मक भाव ‘हर एक के लिए’ से व्यक्त हुआ है।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: हर एक के लिए
  rationale: शाब्दिक रूप ‘उस एक मेमने के लिए’ है, पर सूची में इसका अर्थ प्रत्येक मेमने को अलग-अलग निर्धारित मात्रा देना है। ‘हर एक के लिए’ यह वितरणात्मक अर्थ स्पष्ट करता है और ‘मेमनों’ के साथ स्वाभाविक हिन्दी बनाता है।
- source_word: לְאַרְבָּעָה עָשָׂר כְּבָשִׂים
  choice: चौदहों मेमनों में से
  rationale: यह उस निश्चित चौदह मेमनों के समूह को बताता है जिस पर प्रति-मेमना मात्रा लागू होती है। ‘चौदहों’ समूह की निश्चितता और सभी चौदह पर लागू होने का भाव देता है।
