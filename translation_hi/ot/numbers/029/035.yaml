  choice: मुख्य पाठ में 'पवित्र समापन-सभा'
  alternative: केवल 'पवित्र सभा' या 'गंभीर सभा'
  rationale: संदर्भ आठवें और अंतिम पर्व-दिन का है; 'समापन-सभा' संभावित निष्कर्षात्मक अर्थ को व्यक्त करता है, जबकि 'पवित्र' उसके धार्मिक स्वरूप को स्पष्ट करता है। पादटिप्पणी मूल शब्द की व्यापकता बनाए रखती है और किसी बाद की पंथगत पहचान को नहीं जोड़ती।
