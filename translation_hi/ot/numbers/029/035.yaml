  choice: कोई भी रोज़मर्रा का काम
  rationale: यह पद पवित्र दिन पर निषिद्ध सामान्य आजीविका अथवा नियमित श्रम को दर्शाता है, हर प्रकार की गतिविधि को नहीं। 'रोज़मर्रा का काम' आधुनिक पाठक के लिए स्पष्ट है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: बहुवचन संबोधन में विधिक निषेध का स्वाभाविक, गरिमापूर्ण हिन्दी रूप।
