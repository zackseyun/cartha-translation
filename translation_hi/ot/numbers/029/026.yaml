  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। सूची की संक्षिप्त शैली और आरंभिक हिब्रू संयोजक दोनों सुरक्षित रखे गए हैं। ‘निर्दोष’ को बलि-संबंधी तकनीकी अर्थ में प्रयोग किया गया है।
