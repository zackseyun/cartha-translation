lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/חֲמִישִׁי
  choice: और पाँचवें दिन
  rationale: आरंभिक וּ को ‘और’ से स्पष्ट रखा गया है; בַיּוֹם और क्रमवाचक विशेषण का स्वाभाविक हिन्दी रूप ‘पाँचवें दिन’ है।
- source_word: פָּרִים תִּשְׁעָה
  choice: नौ बैल
  rationale: बलि-संबंधी संदर्भ में פָּרִים के लिए ‘बैल’ सटीक और सामान्य आधुनिक हिन्दी है; पद स्वयं ‘जवान’ आयु निर्दिष्ट नहीं करता।
- source_word: אֵילִם שְׁנָיִם
  choice: दो मेढ़े
  rationale: אַיִל के बहुवचन का बलि-सूची में मानक हिन्दी अर्थ ‘मेढ़े’ है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: एक वर्ष के चौदह नर मेमने
  rationale: כְּבָשִׂים यहाँ नर मेमनों को सूचित करता है; בְּנֵי שָׁנָה का स्वाभाविक हिन्दी रूप ‘एक वर्ष के’ है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलि-पशुओं के संदर्भ में इसका अर्थ शारीरिक दोष या खोट से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रचलित धार्मिक हिन्दी है।
