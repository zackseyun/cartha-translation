  yaml_path: translation/ot/numbers/029/027.yaml
  text: along with their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: hi
  text: और उनकी अन्न-भेंट और पेय-भेंटें बैलों, मेढ़ों और मेमनों के लिए, उनकी संख्या के अनुसार, निर्धारित विधि[a] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्धारित रीति के अनुसार।” इब्रानी शब्द यहाँ इन भेंटों के लिए स्थापित नियम या प्रक्रिया को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: उनके अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה पशुबलियों के साथ चढ़ाए जाने वाले अन्नबलि को दर्शाता है। हिंदी में ‘अन्नबलि’ इसका स्पष्ट और प्रचलित धार्मिक समतुल्य है।
- source_word: נִסְכֵּיהֶם
  choice: अर्घ
  rationale: נֶסֶךְ उंडेली जाने वाली पेय-भेंट को सूचित करता है। ‘अर्घ’ संक्षिप्त, गरिमापूर्ण और बलिदान-संबंधी हिंदी में समझने योग्य है।
- source_word: לַפָּרִים לָאֵילִם וְלַכְּבָשִׂים
  choice: बैलों, मेढ़ों और मेमनों के लिए
  rationale: यहाँ לְ प्रत्येक पशु-वर्ग से संबंधित अन्नबलि और अर्घ का आवंटन बताता है; ‘के लिए’ उस संबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: בְּמִסְפָּרָם
  choice: उनकी संख्या के अनुसार
  rationale: यह वाक्यांश साथ की भेंटों की मात्रा को पशुओं की संख्या के अनुरूप बताता है।
- source_word: כַּמִּשְׁפָּט
  choice: विधान के मुताबिक
  rationale: מִשְׁפָּט यहाँ स्थापित नियम अथवा निर्धारित बलिदान-विधि को दर्शाता है। ‘विधान’ कानूनी-धार्मिक भाव रखता है और ‘के मुताबिक’ वाक्य को सहज बनाता है।
- source_word: וּ
  choice: और … भी
  rationale: आरंभिक संयोजक इस पद को पिछले पद की बलि-सूची से जोड़ता है। ‘और … भी’ हिंदी में इस आश्रित, साथ जुड़ी सामग्री को स्पष्ट करता है।
