  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण बलिदान-संबंधी भाषा रखी गई है। मूल इब्रानी की तरह यह पद पिछले वाक्य पर आश्रित खंड है; कोई नया क्रियापद नहीं जोड़ा गया। पादटिप्पणी का चिह्न उसी शब्द पर रखा गया है जिससे उसका संबंध है।
