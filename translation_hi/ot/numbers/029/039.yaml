source:
  edition: WLC
  text: אֵ֛לֶּה תַּעֲשׂ֥וּ לַ/יהוָ֖ה בְּ/מוֹעֲדֵי/כֶ֑ם לְ/בַ֨ד מִ/נִּדְרֵי/כֶ֜ם וְ/נִדְבֹתֵי/כֶ֗ם לְ/עֹלֹֽתֵי/כֶם֙ וּ/לְ/מִנְחֹ֣תֵי/כֶ֔ם וּ/לְ/נִסְכֵּי/כֶ֖ם וּ/לְ/שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/039.yaml
  text: These you shall offer to Yahweh at your appointed times[a], besides your vow offerings and your freewill offerings, for your burnt offerings and for your grain offerings and for your drink offerings and for your peace offerings.
translation:
  language: hi
  text: इन सबको तुम अपने नियत समयों पर यहोवा को चढ़ाओगे, अपनी मन्नतों और स्वेच्छा-भेंटों के अतिरिक्त—अपनी होमबलियों, अन्नबलियों, पेय-बलियों और शांतिबलियों[a] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेलबलियाँ” या “सहभागिता की बलियाँ।” इब्रानी शब्द कुशलता/शांति से संबंधित बलियों की एक श्रेणी को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: इन सबको
  rationale: यह बहुवचन संकेतवाचक पिछले प्रसंग में निर्धारित पर्व-बलियों की ओर लौटता है; ‘इन सबको’ हिन्दी में उसके कर्म-रूप को स्पष्ट और स्वाभाविक बनाता है।
- source_word: תַּעֲשׂוּ
  choice: चढ़ाना
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर बलिदानी संदर्भ में इसका स्वाभाविक अर्थ यहोवा को भेंट चढ़ाना है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: पूर्वसर्ग समर्पण अथवा दिशा बताता है; वाचा के नाम יהוה को हिन्दी के परिचित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּמוֹעֲדֵיכֶם
  choice: अपने नियत समयों पर
  rationale: מוֹעֵד नियत समय और पर्व-अवसर दोनों को सूचित कर सकता है; यह रूप व्यापक अर्थ को बनाए रखता है।
- source_word: לְבַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि मन्नत और स्वेच्छा की भेंटें निर्धारित पर्व-बलियों के अलावा हैं।
- source_word: מִנִּדְרֵיכֶם
  choice: अपनी मन्नत की भेंटों
  rationale: यह केवल कही गई मन्नतों की नहीं, उनसे जुड़ी चढ़ाई जाने वाली भेंटों की बात है।
- source_word: וְנִדְבֹתֵיכֶם
  choice: और स्वेच्छा-भेंटों
  rationale: नियम से अनिवार्य भेंट के विपरीत अपनी इच्छा से दी गई भेंट का अर्थ स्पष्ट करता है।
- source_word: לְעֹלֹתֵיכֶם
  choice: तुम्हारे होमबलि
  rationale: עֹלָה पूरी तरह जलाए जाने वाले बलिदान की स्थापित याजकीय श्रेणी है; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और परिचित है।
- source_word: וּלְמִנְחֹתֵיכֶם
  choice: अन्नबलि
  rationale: याजकीय संदर्भ में מִנְחָה सामान्यतः अनाज से बनी भेंट को दर्शाता है।
- source_word: וּלְנִסְכֵּיכֶם
  choice: अर्घ
  rationale: נֶסֶךְ उंडेली जाने वाली पेय-भेंट है; ‘अर्घ’ हिन्दी बाइबलीय शब्दावली में उसका संक्षिप्त नाम है।
- source_word: וּלְשַׁלְמֵיכֶם
  choice: मेलबलि
  rationale: שְׁלָמִים शांति, कुशल और सहभागिता से जुड़ी बलिदानी श्रेणी है; ‘मेलबलि’ स्वाभाविक हिन्दी में संबंध और सहभागिता का पक्ष व्यक्त करता है, जबकि वैकल्पिक ‘शांतिबलि’ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; इसे उपाधि ‘प्रभु’ से बदलकर नाम की विशिष्टता नहीं मिटाई गई।
- issue: שְׁלָמִים की बलिदानी श्रेणी
  choice: मेलबलि
  alternative: शांतिबलि
  rationale: इब्रानी शब्द में शांति/कुशल के साथ सहभागिता का भाव भी है। मुख्य पाठ में सहज ‘मेलबलि’ रखा गया और वास्तविक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। बलिदानी श्रेणियों के लिए संक्षिप्त प्रचलित पद रखे गए हैं। सूची को हिन्दी में सहज बनाने के लिए ‘चाहे…हों’ की रचना अपनाई गई है, बिना मूल की श्रेणियों को घटाए।
