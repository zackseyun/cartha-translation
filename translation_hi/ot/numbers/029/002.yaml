base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/002.yaml
  text: 'And you shall offer a burnt offering as a pleasing aroma to Yahweh: one bull from the herd[a], one ram, and seven male lambs a year old, without blemish.'
translation:
  language: hi
  text: 'और तुम याहवे के लिए सुखद सुगंध[a] के रूप में एक होमबलि चढ़ाओ: झुंड में से एक बैल, एक मेढ़ा, और एक वर्ष के सात नर मेम्ने, जो बिना दोष के हों।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘शांतिदायक सुगंध’ या ‘मनभावनी सुगंध’ भी हो सकता है। यह इब्रानी की एक निश्चित बलिदानी अभिव्यक्ति है, जो बताती है कि भेंट याहवे को स्वीकार्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: और तुम…चढ़ाना
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर עֹלָה के साथ बलिदान-संदर्भ में इसका स्वाभाविक अर्थ ‘चढ़ाना’ है। बहुवचन संबोधन को ‘तुम’ से बनाए रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलिदान का प्रचलित हिन्दी बाइबलीय नाम है जो वेदी पर पूर्णतः जलाया जाता था।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखद सुगंध
  rationale: यह स्थिर बलिदानी अभिव्यक्ति भेंट के याहवे को स्वीकार्य होने का संकेत देती है। ‘सुखद सुगंध’ मूल बिंब को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: पशुओं के झुंड में से एक बैल
  rationale: शाब्दिक संरचना ‘एक बैल, गाय-बैलों का पुत्र’ है। यह चयन पशु की जाति और झुंड से उसके लिए जाने, दोनों को स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: बलिदानी सूची में אַיִל का सीधा अर्थ नर भेड़, अर्थात ‘मेढ़ा’, है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: एक वर्ष के सात…नर मेम्ने
  rationale: כְּבָשִׂים पुल्लिंग बहुवचन है और यहाँ सात नर मेम्नों को सूचित करता है; בְּנֵי שָׁנָה उनकी आयु एक वर्ष बताता है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदानी संदर्भ में इसका अर्थ शारीरिक दोष या दाग से रहित होना है; ‘निर्दोष’ संक्षिप्त और प्रचलित हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत करता है और स्रोत की प्रत्यक्षता बनाए रखता है।
- issue: ‘सुखद सुगंध’ का आशय
  choice: मूल बलिदानी बिंब को बनाए रखना
  alternative: ‘स्वीकार्य बलिदान’ कहकर अर्थ खोल देना
  rationale: इब्रानी पाठ सुगंध का रूपक प्रयोग करता है। अनुवाद उसे बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि सूत्र भेंट की स्वीकार्यता बताता है; इस प्रकार बिंब को चुपचाप धर्मवैज्ञानिक व्याख्या से प्रतिस्थापित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण पर सहज शैली रखी गई है। विधिसंबंधी निर्देश का स्वर ‘चढ़ाना’ से व्यक्त हुआ है। सूची को स्पष्ट रखने के लिए सहज हिन्दी क्रम अपनाया गया है और पादटिप्पणी-चिह्न उसी अभिव्यक्ति के बाद रखा गया है जिसे वह स्पष्ट करता है।
