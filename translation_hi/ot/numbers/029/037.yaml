base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/037.yaml
  text: and their grain offering and their drink offerings for the bull[a], for the ram, and for the lambs, according to their number, according to the ordinance.
translation:
  language: hi
  text: उनकी अन्नबलि और पेय-बलियाँ बैल के लिए, मेढ़े के लिए और मेमनों के लिए, उनकी संख्या के अनुसार, निर्धारित विधि[a] के अनुसार हों।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निर्धारित रीति के अनुसार।” इब्रानी शब्द इन बलियों के लिए स्थापित नियम या विधिक निर्देश को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: उनकी अन्नबलि
  rationale: बलिदानी प्रसंग में מִנְחָה साथ चढ़ाई जाने वाली अन्नबलि को दर्शाता है। इब्रानी का एकवचन सामूहिक अर्थ में है, इसलिए हिन्दी में भी एकवचन रखा गया है।
- source_word: וְנִסְכֵּיהֶם
  choice: और उनके अर्घ्य
  rationale: נֶסֶךְ उंडेलकर चढ़ाए जाने वाले पेय-पदार्थ को दर्शाता है। ‘अर्घ्य’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और गरिमापूर्ण है।
- source_word: לַפָּר
  choice: बैल के लिए
  rationale: פַּר का सीधा अर्थ बलिदान में चढ़ाया जाने वाला बैल है; मूल शब्द अपने आप में ‘जवान’ पर बल नहीं देता।
- source_word: לָאַיִל
  choice: मेढ़े के लिए
  rationale: אַיִל बलिदानी सूची में नर भेड़, अर्थात मेढ़े, को दर्शाता है।
- source_word: וְלַכְּבָשִׂים
  choice: और मेमनों के लिए
  rationale: כֶּבֶשׂ मेमने को दर्शाता है; इस सूची में सहज हिन्दी के लिए केवल ‘मेमनों’ पर्याप्त है।
- source_word: בְּמִסְפָּרָם
  choice: उनकी संख्या के अनुसार
  rationale: यह वाक्यांश चढ़ाए जाने वाले पशुओं की गिनी हुई संख्या के अनुरूप सहायक बलियों की मात्रा बताता है।
- source_word: כַּמִּשְׁפָּט
  choice: ठहराए हुए विधान के अनुसार
  rationale: यहाँ מִשְׁפָּט सामान्य न्याय नहीं, बल्कि इन बलियों के लिए स्थापित धार्मिक नियम अथवा निर्धारित प्रक्रिया को दर्शाता है।
