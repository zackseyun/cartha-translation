base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/007.yaml
  text: On the tenth day of this seventh month[a], there shall be a holy convocation for you, and you shall afflict yourselves; you shall do no work at all.
translation:
  language: hi
  text: “इस सातवें महीने के दसवें दिन तुम्हारे लिए एक पवित्र सभा होगी। तुम अपने आप को कष्ट दोगे[a] और कोई भी काम नहीं करोगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आप को दीन करोगे” अथवा “अपने आप को वंचित रखोगे।” इब्रानी मुहावरे का शाब्दिक अर्थ है “अपने प्राणों को कष्ट दोगे”; यह अनुष्ठानिक आत्म-संयम, विशेषकर उपवास, से जुड़ा है।
    reason: lexical_alternative
