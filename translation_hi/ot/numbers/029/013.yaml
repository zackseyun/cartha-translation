base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/013.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: thirteen bulls from the herd, two rams, and fourteen male lambs a year old; they shall be without blemish.'
translation:
  language: hi
  text: 'और तुम यहोवा के लिए एक होमबलि, अर्थात् अग्नि में चढ़ाया जाने वाला, मनभावनी सुगंध[a] वाला अर्पण चढ़ाओगे: झुंड में से तेरह बैल, दो मेढ़े और एक-एक वर्ष के चौदह नर मेमने; वे दोषरहित हों।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सुखदायक सुगंध” अथवा “मधुर सुगंध।” इब्रानी मुहावरा बताता है कि यह अर्पण यहोवा को स्वीकार्य है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: और तुम ... चढ़ाना
  rationale: हिफ़ील रूप बलिदान के संदर्भ में किसी अर्पण को प्रस्तुत या चढ़ाने का निर्देश देता है। आसपास के विधिक निर्देशों के अनुरूप हिंदी में आज्ञार्थक ‘चढ़ाना’ स्वाभाविक है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलिदान का प्रचलित हिंदी बाइबलीय नाम है जो वेदी पर पूर्णतः जलाया जाता था।
- source_word: אִשֵּׁה
  choice: आग में चढ़ाया जाने वाला ... अर्पण
  rationale: यह शब्द आग के द्वारा चढ़ाए जाने वाले अर्पण को दर्शाता है; विस्तृत रूप साधारण पाठक के लिए अर्थ स्पष्ट करता है।
- source_word: רֵיחַ נִיחֹחַ
  choice: मनभावना सुगंध
  rationale: यह इब्रानी मुहावरा अर्पण के यहोवा को स्वीकार्य और प्रसन्नतादायक होने का भाव व्यक्त करता है, जबकि सुगंध की मूल छवि भी बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम יהוה को हिंदी में स्थापित रूप ‘यहोवा’ से प्रत्यक्ष रूप में रखा गया है।
- source_word: פָּרִים בְּנֵי בָקָר
  choice: गाय-बैलों में से ... बैल
  rationale: यह पशु-वर्ग को व्यक्त करता है और केवल इब्रानी वाक्यांश के आधार पर उनकी कम आयु मान लेने से बचता है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: एक-एक वर्ष के ... नर मेमने
  rationale: כְּבָשִׂים का पुल्लिंग और आयु-सूचक वाक्यांश दोनों स्पष्ट रूप से सुरक्षित रखे गए हैं।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदानी संदर्भ में इसका अर्थ शारीरिक दोष या खोट से रहित पशु है; हिंदी में ‘निर्दोष’ संक्षिप्त और परंपरागत समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा-नाम प्रत्यक्ष रूप से है। ‘यहोवा’ आधुनिक हिंदी बाइबल पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे सामान्य पदवी ‘प्रभु’ में नहीं बदलता।
- issue: רֵיחַ נִיחֹחַ में ईश्वर के प्रसन्न होने की भाषा
  choice: मनभावना सुगंध
  alternative: सुखदायक सुगंध / स्वीकार्य अर्पण
  rationale: मूल की सुगंध-संबंधी मानवरूपी छवि और अर्पण की स्वीकार्यता दोनों को बनाए रखा गया है; इसे केवल अमूर्त ‘स्वीकार्य’ बनाकर छवि समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुरूप रखी गई है। पशुओं की सूची स्पष्ट है; ‘नर’ और ‘एक-एक वर्ष के’ मूल की विशिष्टताओं को सुरक्षित रखते हैं। मुख्य पाठ में [a] उसी वाक्यांश के बाद रखा गया है जिसकी वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
