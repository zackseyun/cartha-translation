  terminology: ‘पापबलि’ appropriately conveys חַטָּאת in this cultic context. ‘बकरा’ adequately indicates the male animal in standard Hindi. ‘प्रायश्चित’ maintains the broad sacrificial sense of כפר without specifying a doctrinal mechanism.
