  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את לְ/כַפֵּ֖ר עֲלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/005.yaml
  text: and one male goat for a sin offering[a], to make atonement for you—
translation:
  language: hi
  text: और पापबलि के लिए एक बकरा, तुम्हारे लिए प्रायश्चित करने हेतु—
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: और ... एक बकरा
  rationale: שְׂעִיר עִזִּים नर बकरे को सूचित करता है; हिन्दी में ‘बकरा’ स्वयं नर पशु को स्पष्ट करता है। אֶחָד की संख्या ‘एक’ से और prefixed וּ का अनुवाद ‘और’ से किया गया है।
- source_word: חַטָּאת
  choice: पापबलि के लिए
  rationale: याजकीय बलिदान-संदर्भ में חַטָּאת अमूर्त ‘पाप’ के बजाय पाप के लिए चढ़ाई जाने वाली बलि को सूचित करता है; ‘पापबलि’ इस अनुष्ठानिक अर्थ को संक्षेप और स्पष्ट रूप से रखता है।
- source_word: לְ/כַפֵּר
  choice: ताकि ... प्रायश्चित किया जाए
  rationale: यहाँ כפר याजकीय बलिदान द्वारा प्रायश्चित करने को दर्शाता है। हिन्दी का कर्मवाच्य उस निहित अनुष्ठानिक कर्ता को अनावश्यक रूप से निर्धारित नहीं करता जिसे इब्रानी में व्यक्त नहीं किया गया।
- source_word: עֲלֵי/כֶם
  choice: तुम्हारे लिए
  rationale: כפר के साथ עַל उन लोगों को सूचित करता है जिनके निमित्त प्रायश्चित किया जाता है; ‘तुम्हारे लिए’ स्वाभाविक हिन्दी में प्रतिनिधिक अर्थ बनाए रखता है।
theological_decisions:
- issue: बलिदान-संबंधी כפר का अनुवाद
  choice: तुम्हारे लिए प्रायश्चित किया जाए
  alternative: तुम्हारा दोष मिटाया जाए
  rationale: ‘प्रायश्चित’ बाइबलीय याजकीय श्रेणी की व्यापकता बनाए रखता है और प्रायश्चित की किसी विशेष बाद की सैद्धान्तिक व्याख्या को पाठ में आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और गिनती 29 की बलिदान-सूची के अनुरूप। ‘बकरा’ नर पशु को स्वाभाविक रूप से व्यक्त करता है। पद के अंत का डैश आगे जारी सूची/वाक्य-संबंध को बनाए रखता है।
