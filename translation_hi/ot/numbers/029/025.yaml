  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: hi
  text: और पाप-बलि के रूप में एक नर बकरा चढ़ाना; यह नित्य होमबलि, उसके अन्नबलि और उसकी पेय-बलि के अतिरिक्त होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׂעִיר עִזִּים אֶחָד
  choice: और एक बकरा
  rationale: यह इब्रानी बलिदानी पदबंध नर बकरे को सूचित करता है; हिंदी में ‘एक बकरा’ स्वाभाविक और स्पष्ट है।
- source_word: חַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदानी संदर्भ में यह अमूर्त ‘पाप’ नहीं, पाप के लिए चढ़ाई जाने वाली बलि का नाम है।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि उक्त बलि नियमित रूप से निर्धारित चढ़ावे के अलावा है।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: תמיד नियमित रूप से निरंतर चढ़ाई जाने वाली बलि को दर्शाता है; ‘नित्य’ संक्षिप्त, प्रतिष्ठित और प्रचलित बाइबलीय हिंदी है।
- source_word: מִנְחָתָהּ
  choice: उसके अन्नबलि
  rationale: याजकीय बलिदानी सूचियों में מִנְחָה साथ चढ़ाए जाने वाले अन्नबलि को सूचित करता है।
- source_word: וְנִסְכָּהּ
  choice: और अर्घ
  rationale: נֶסֶךְ उंडेले जाने वाले पेय-चढ़ावे को दर्शाता है; ‘अर्घ’ हिंदी बाइबल की बलिदानी शब्दावली में संक्षिप्त और प्रतिष्ठित है।
