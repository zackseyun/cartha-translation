  text: מִ/לְּ/בַד֩ עֹלַ֨ת הַ/חֹ֜דֶשׁ וּ/מִנְחָתָ֗/הּ וְ/עֹלַ֤ת הַ/תָּמִיד֙ וּ/מִנְחָתָ֔/הּ וְ/נִסְכֵּי/הֶ֖ם כְּ/מִשְׁפָּטָ֑/ם לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֖ה לַ/יהוָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/006.yaml
  text: besides the burnt offering of the month and its grain offering[a], and the regular burnt offering and its grain offering, and their drink offerings, according to their ordinance, as a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: hi
  text: महीने की होमबलि और उसकी अन्नबलि, नित्य होमबलि और उसकी अन्नबलि, तथा उनके पेय-चढ़ावों के अतिरिक्त, यह उनकी निर्धारित विधि के अनुसार यहोवा के लिए सुखद सुगंध की अग्नि-भेंट होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह पद इन बलियों को पहले से निर्धारित चढ़ावों के अतिरिक्त बताता है; यह हिंदी में संक्षिप्त और स्वाभाविक है।
- source_word: עֹלַת הַחֹדֶשׁ
  choice: महीने की होमबलि
  rationale: इब्रानी का शाब्दिक अर्थ ‘महीने की होमबलि’ है। संदर्भ में यह नवचंद्र की बलि है, पर मुख्य पाठ मूल की अभिव्यक्ति को बनाए रखता है।
- source_word: מִנְחָתָהּ
  choice: उसके अन्नबलि
  rationale: बलिदान-संबंधी संदर्भ में מִנְחָה पशुबलि के साथ चढ़ाया जाने वाला अन्नबलि है; एकवचन संबंधसूचक प्रत्यय को ‘उसके’ से रखा गया है।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: תָּמִיד नियमित और निरंतर चढ़ाई जाने वाली निर्धारित बलि को दर्शाता है; ‘नित्य’ प्रचलित, संक्षिप्त और स्पष्ट है।
- source_word: וְנִסְכֵּיהֶם
  choice: तथा उनके पेयबलियों
  rationale: נֶסֶךְ उंडेलकर चढ़ाए जाने वाले पेय को दर्शाता है। बहुवचन संबंधसूचक प्रत्यय को ‘उनके’ से सुरक्षित रखा गया है।
- source_word: כְּמִשְׁפָּטָם
  choice: उनकी निर्धारित विधि के अनुसार
  rationale: यहाँ מִשְׁפָּט उपासना में निर्धारित नियम या रीति को दर्शाता है; यह रूप अर्थ को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखद सुगंध वाली
  rationale: यह स्थिर बलिदानी पदबंध परमेश्वर को स्वीकार्य सुगंध का रूपक रखता है और आधुनिक हिंदी में सहज है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह बलिदानी पारिभाषिक शब्द आग पर चढ़ाई गई भेंट को दर्शाता है। संक्षिप्त ‘अग्नि-भेंट’ मूल रूपक को बनाए रखती है; वैकल्पिक ‘भोजन-भेंट’ पादटिप्पणी में दिया गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: समर्पण के लक्ष्य को ‘के लिए’ स्पष्ट करता है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; उसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: אִשֶּׁה का बलिदानी अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट
  rationale: शब्द की सटीक व्युत्पत्ति और बलिदानी अर्थ पर कुछ अनिश्चितता है। मुख्य पाठ आग पर प्रस्तुति का पारंपरिक और संदर्भ-संगत भाव रखता है, जबकि अन्य प्रचलित आधुनिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, किंतु सामान्य पाठक के लिए सुबोध शैली अपनाई गई है। बलिदानी शब्दावली में ‘होमबलि’, ‘अन्नबलि’ और ‘पेयबलि’ जैसे परिचित तकनीकी पद रखे गए हैं। मूल पद पिछले आदेशों से जुड़ी सूची जैसा है; हिंदी में उसका संबंध स्पष्ट करने के लिए ‘होगा’ और ‘इन्हें…चढ़ाना’ जोड़ा गया है, बिना नई धार्मिक व्याख्या आरोपित किए।
