  edition: WLC
  text: וּ/שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/016.yaml
  text: and one male goat for a sin offering[a], besides the regular burnt offering, its grain offering, and its drink offering.
translation:
  language: hi
  text: और पापबलि[a] के लिए एक बकरा, नियमित होमबलि, उसकी अन्नबलि और उसकी पेय-बलि के अतिरिक्त।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: बकरा
  rationale: यह इब्रानी पद बलि के लिए चढ़ाए जाने वाले नर बकरे को सूचित करता है; हिंदी में ‘बकरा’ स्वाभाविक रूप से नर होने का अर्थ व्यक्त करता है।
- source_word: אֶחָד
  choice: एक
  rationale: यह बलि के पशु की संख्या बताने वाला सामान्य संख्यावाचक शब्द है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: बलिदान-संबंधी संदर्भ में यह शब्द अमूर्त ‘पाप’ के बजाय एक विशेष बलि को सूचित करता है। ‘पापबलि’ प्रचलित और सहज है, जबकि ‘शुद्धिकरण-बलि’ एक संभावित अर्थ है।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि यह बलि नियमित रूप से निर्धारित चढ़ावे के अलावा चढ़ाई जानी है।
- source_word: עֹלַת הַתָּמִיד
  choice: नियमित होमबलि
  rationale: यह बार-बार नियत रूप से चढ़ाई जाने वाली होमबलि को सूचित करता है; ‘नियमित’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: מִנְחָתָהּ
  choice: उसके अन्नबलि
  rationale: बलिदान-संबंधी संदर्भ में מִנְחָה अन्नबलि है। स्त्रीलिंग एकवचन प्रत्यय पहले उल्लिखित होमबलि की ओर संकेत करता है।
- source_word: וְנִסְכָּהּ
  choice: और अर्घ
  rationale: यह साथ में उंडेली जाने वाली पेय-भेंट को सूचित करता है। ‘अर्घ’ संक्षिप्त और बलिदान-संबंधी हिंदी पद है; संबंधसूचक ‘उसके’ दोनों साथ आने वाले चढ़ावों पर लागू होता है।
theological_decisions:
- issue: חַטָּאת का बलिदान-संबंधी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ पाठकों के लिए अधिक परिचित है, पर मूल शब्द के शुद्धिकरण-संबंधी पक्ष को पादटिप्पणी में सुरक्षित रखा गया है; पाठ किसी एक धर्मवैज्ञानिक व्याख्या को अंतिम नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। पिछले पदों से चली आ रही विधि-सूची के अनुरूप ‘चढ़ाना’ जोड़ा गया है; मूल इब्रानी की संक्षिप्त सूचीगत रचना और बलियों के पारिभाषिक भेद बनाए रखे गए हैं।
