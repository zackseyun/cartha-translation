  register: आधुनिक, dignified और सामान्य पाठक के लिए सुबोध हिन्दी रखी गई है। पद की सूचीगत शैली बनाए रखते हुए हिन्दी में स्वाभाविक आज्ञार्थक वाक्य पूरा किया गया है। ‘होमबलि’, ‘अन्नबलि’ और ‘अर्घ’ स्थापित बलिदानी शब्दावली के रूप में प्रयुक्त हैं।
