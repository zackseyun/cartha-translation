  text: and one goat for a sin offering[a], besides the regular burnt offering[b], with its grain offering and its drink offering.
translation:
  language: hi
  text: और पापबलि के लिए एक बकरा, नियमित होमबलि, उसकी अन्नबलि और उसकी पेय-बलि के अतिरिक्त।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר ... אֶחָד
  choice: एक बकरा भी
  rationale: שׂעִיר नर बकरे को सूचित करता है और אֶחָד संख्या ‘एक’ बताता है। सहज हिन्दी में ‘एक बकरा’ रखा गया है; וּ को सूची की निरंतरता दिखाने के लिए ‘भी’ से व्यक्त किया गया है।
- source_word: חַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी प्रसंग में חַטָּאת अमूर्त ‘पाप’ नहीं, पाप के लिए चढ़ाई जाने वाली बलि को सूचित करता है।
- source_word: מִ/לְּ/בַד
  choice: के अतिरिक्त
  rationale: यह पद बताता है कि उक्त बलि नियमित चढ़ावे के अलावा चढ़ाई जानी है।
- source_word: עֹלַת הַ/תָּמִיד
  choice: नियमित होमबलि
  rationale: עֹלָה के लिए प्रचलित हिन्दी धार्मिक पद ‘होमबलि’ उपयुक्त है; תָּמִיד इस बलि के निरंतर, नियत रूप से दोहराए जाने का भाव देता है, जिसे ‘नियमित’ सहज रूप से व्यक्त करता है।
- source_word: מִנְחָתָ/הּ
  choice: उसके अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अन्नबलि है। स्त्रीलिंग प्रत्यय का संबंध होमबलि से है, इसलिए ‘उसके’ रखा गया है।
- source_word: וְ/נִסְכָּ/הּ
  choice: और अर्घ
  rationale: נֶסֶךְ बलि के साथ उंडेले जाने वाले पेय-चढ़ावे को सूचित करता है। ‘अर्घ’ संक्षिप्त और प्रतिष्ठित हिन्दी बलिदानी पद है; संबंध ‘उसके’ से दोनों संज्ञाओं पर लागू होता है।
