  edition: WLC
  text: וּ/מִנְחָתָ֣/ם וְ/נִסְכֵּ/הֶ֡ם לַ֠/פָּרִים לָ/אֵילִ֧ם וְ/לַ/כְּבָשִׂ֛ים בְּ/מִסְפָּרָ֖/ם כְּ/מִשְׁפָּטָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/033.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: hi
  text: और बैलों, मेढ़ों और मेमनों के लिए उनकी अन्नबलि और उनकी पेय-भेंटें, उनकी संख्या के अनुसार, उनके लिए निर्धारित विधि के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָתָם
  choice: उनकी अन्नबलि
  rationale: बलिदान-संबंधी संदर्भ में מִנְחָה साथ चढ़ाई जाने वाली अन्नबलि को दर्शाता है; इब्रानी के सामूहिक एकवचन को बनाए रखा गया है।
- source_word: נִסְכֵּיהֶם
  choice: अर्घ्य
  rationale: נֶסֶךְ उंडेली जाने वाली पेय-भेंट है। हिंदी बाइबलीय बलिदानी संदर्भ में ‘अर्घ्य’ संक्षिप्त और स्वाभाविक है; रूप अर्थतः सामूहिक है।
- source_word: לַפָּרִים
  choice: बैलों के लिए
  rationale: פָּרִים बलिदानी सूची में बैलों को सूचित करता है; मूल में आयु का स्पष्ट उल्लेख नहीं है।
- source_word: לָאֵילִם
  choice: मेढ़ों के लिए
  rationale: אַיִל का बलिदानी संदर्भ में सीधा अर्थ ‘मेढ़ा’ है।
- source_word: וְלַכְּבָשִׂים
  choice: और मेमनों के लिए
  rationale: כֶּבֶשׂ का स्वाभाविक हिंदी रूप ‘मेमना’ है; यहाँ लिंग को अलग से स्पष्ट करना आवश्यक नहीं।
- source_word: בְּמִסְפָּרָם
  choice: उनकी संख्या के अनुसार
  rationale: यह वाक्यांश पशुओं की निर्धारित गिनती के अनुरूप भेंटों को सूचित करता है और इब्रानी संरचना को स्पष्ट रूप से बनाए रखता है।
- source_word: כְּמִשְׁפָּטָם
  choice: उनके लिए ठहराए गए विधान के अनुसार
  rationale: מִשְׁפָּט यहाँ निर्धारित बलिदानी नियम या विधि को सूचित करता है। प्रत्यय की संभावित संबद्धता को स्वाभाविक हिंदी में पशुओं/भेंटों के लिए लागू विधान के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: כְּמִשְׁפָּטָם में बहुवचन प्रत्यय का संबंध
  choice: उनके लिए ठहराए गए विधान के अनुसार
  alternative: उनके विधान के अनुसार
  rationale: शाब्दिक ‘उनके विधान’ हिंदी में ऐसा भ्रम पैदा कर सकता है मानो पशुओं का अपना विधान हो। चुना हुआ रूप मूल प्रत्यय को अनदेखा किए बिना निर्धारित बलिदानी नियम का अर्थ स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सामान्य पाठक के लिए बोधगम्य बलिदानी शब्द-भंडार अपनाया गया है। पद पूर्ववर्ती आज्ञा पर निर्भर सूची-वाक्य है; हिंदी में पूर्ण और स्वाभाविक बनाने के लिए अंत में ‘हों’ जोड़ा गया है।
