language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֜ה אִשֵּׁ֨ה רֵ֤יחַ נִיחֹ֨חַ֙ לַֽ/יהוָ֔ה פַּ֥ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֧ים בְּנֵי שָׁנָ֛ה שִׁבְעָ֖ה תְּמִימִֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/036.yaml
  text: 'And you shall present a burnt offering[a], an offering by fire, a pleasing aroma to Yahweh: one bull, one ram, and seven one-year-old lambs without blemish.'
translation:
  language: hi
  text: 'और तुम याहवे के लिए सुखद सुगंधवाली अग्नि-भेंट के रूप में एक होमबलि चढ़ाओ: एक बैल, एक मेढ़ा और एक वर्ष के सात निर्दोष मेमने।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: और तुम ... चढ़ाना
  rationale: हिफ़ील रूप का बलिदानी संदर्भ में अर्थ किसी भेंट को विधिपूर्वक चढ़ाना है। निकटवर्ती आज्ञाओं की शैली के अनुरूप हिंदी में अनिवार्यता व्यक्त करने वाला सहज निर्देशात्मक रूप रखा गया है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह पूरी तरह आग में चढ़ाए जाने वाले बलिदान का प्रचलित और संक्षिप्त हिंदी बाइबलीय पद है।
- source_word: אִשֵּׁה
  choice: आग में चढ़ाया गया ... बलिदान
  rationale: यह आग के माध्यम से चढ़ाई जाने वाली भेंट को बताता है। हिंदी वाक्य में इसे स्पष्ट किया गया है, बिना इसे अनिवार्य रूप से 'भोजन-भेंट' मानने के।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखद सुगंधवाला
  rationale: यह स्थिर बलिदानी अभिव्यक्ति परमेश्वर को स्वीकार्य और प्रसन्न करने वाली सुगंध दर्शाती है; आधुनिक हिंदी में यह स्वाभाविक है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ दिशा अथवा समर्पण बताता है और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: פַּר אֶחָד
  choice: एक बैल
  rationale: प्रत्यक्ष और संदर्भानुकूल पशु-संज्ञा।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: बलिदानी सूची में אַיִל का सटीक आधुनिक हिंदी समतुल्य।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: एक-एक वर्ष के सात ... मेमने
  rationale: शाब्दिक 'एक वर्ष के पुत्र' आयु की आवश्यकता बताता है; हिंदी में 'एक-एक वर्ष के' सातों पशुओं पर आयु लागू होने को स्पष्ट करता है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदानी पशुओं के संदर्भ में शारीरिक दोष से रहित होने का प्रचलित संक्षिप्त हिंदी पद।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे उपस्थित है। उसका लिप्यंतरण वाचा-नाम को उपाधि में बदलने से बचाता है।
- issue: רֵיחַ נִיחֹחַ का आशय
  choice: सुखद सुगंधवाला
  alternative: शांतिदायक सुगंधवाला
  rationale: मूल मुहावरे की चित्रात्मक भाषा बनाए रखते हुए इसे बलिदान की स्वीकार्यता से जुड़ी अभिव्यक्ति के रूप में रखा गया है; किसी यांत्रिक या संप्रदायगत प्रायश्चित्त-सिद्धांत को इसमें नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदानी तकनीकी शब्द 'होमबलि' बनाए रखा गया है; शेष वाक्य को सूची-जैसी स्पष्टता दी गई है।
