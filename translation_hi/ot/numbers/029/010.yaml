lexical_decisions:
- source_word: עִשָּׂרוֹן עִשָּׂרוֹן
  choice: एपा का दसवाँ भाग
  rationale: दोहराया गया संज्ञा-रूप बलिदान-संबंधी निर्देशों में वितरण का भाव देता है और अन्न की उस मात्रा को दर्शाता है जिसे परंपरागत रूप से एपा का दसवाँ भाग समझा जाता है। हिंदी में माप स्पष्ट करने के लिए ‘एपा का’ जोड़ा गया है, जबकि स्रोत की शाब्दिक अभिव्यक्ति पादटिप्पणी में दी गई है।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: हर एक के लिए
  rationale: शाब्दिक अर्थ ‘एक मेमने के लिए’ है, पर इस सूची में भाव प्रत्येक पशु के लिए निर्धारित मात्रा का है। ‘हर एक के लिए’ हिंदी में इस वितरणात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: सातों मेमनों में से
  rationale: यह वाक्यांश उन सात मेमनों के पूरे समूह को निर्दिष्ट करता है जिनमें से प्रत्येक पर यही मात्रा लागू होती है। ‘सातों’ हिब्रू के निश्चित समूह को सहज हिंदी में व्यक्त करता है।
