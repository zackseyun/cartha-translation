base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/021.yaml
  text: and their grain offerings and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance;
translation:
  language: hi
  text: और बैलों, मेढ़ों और मेमनों के लिए उनकी अन्नबलि और उनकी पेय-बलियाँ, उनकी संख्या के अनुसार, निर्धारित विधि[a] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठहराए हुए नियम के अनुसार।” इब्रानी शब्द इन भेंटों के लिए स्थापित अनुष्ठानिक नियम या प्रक्रिया को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: उनके अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अन्न से चढ़ाई जाने वाली भेंट को सूचित करता है। हिंदी बाइबलीय प्रयोग में ‘अन्नबलि’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है; एकवचन रूप को सामूहिक अर्थ में रखा गया है।
- source_word: נִסְכֵּיהֶם
  choice: उनके अर्घ
  rationale: נֶסֶךְ बलि के साथ उंडेली जाने वाली पेय-भेंट है। ‘अर्घ’ हिंदी में इस अनुष्ठानिक उंडेली हुई भेंट का स्वाभाविक और संक्षिप्त पद है।
- source_word: לַפָּרִים
  choice: बैलों के लिए
  rationale: פָּרִים बलिदान की सूची में बैलों को सूचित करता है; मूल में आयु का कोई अलग विशेषण नहीं है।
- source_word: לָאֵילִם
  choice: मेढ़ों के लिए
  rationale: אַיִל का इस बलिदान-संबंधी प्रसंग में सीधा अर्थ ‘मेढ़ा’ है।
- source_word: וְלַכְּבָשִׂים
  choice: और मेमनों के लिए
  rationale: כֶּבֶשׂ मेमने को सूचित करता है। यहाँ लिंग को अलग से स्पष्ट करना आवश्यक नहीं, इसलिए सहज सामान्य पद चुना गया है।
- source_word: בְּמִסְפָּרָם
  choice: उनकी संख्या के अनुसार
  rationale: यह पद प्रत्येक पशु-वर्ग की पहले से ठहराई गई गिनती के अनुरूप भेंटों की मात्रा बताता है।
- source_word: כַּמִּשְׁפָּט
  choice: निर्धारित विधि के अनुसार
  rationale: מִשְׁפָּט यहाँ स्थापित अनुष्ठानिक नियम या प्रक्रिया को सूचित करता है। ‘निर्धारित विधि’ कानूनी और अनुष्ठानिक दोनों भावों को सहज आधुनिक हिंदी में व्यक्त करता है।
