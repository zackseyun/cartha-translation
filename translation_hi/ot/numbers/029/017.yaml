    text: इब्रानी में शाब्दिक अर्थ है, ‘बारह बैल, मवेशियों के पुत्र।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַיּוֹם הַשֵּׁנִי
  choice: और दूसरे दिन
  rationale: संयोजक वाव और समयसूचक पद उत्सव-बलियों की क्रमिक सूची को आगे बढ़ाते हैं; ‘और’ इस निरंतरता को बनाए रखता है।
- source_word: פָּרִים בְּנֵי בָקָר
  choice: झुंड के ... बैल
  rationale: פָּרִים बलि-संदर्भ में ‘बैल’ है और शाब्दिक ‘मवेशियों के पुत्र’ एक वर्गसूचक इब्रानी मुहावरा है, जिसे स्वाभाविक हिन्दी में ‘झुंड के’ कहा गया है।
- source_word: שְׁנֵים עָשָׂר
  choice: बारह
  rationale: यह ‘बैल’ की संख्या बताने वाला मूल संख्या-वाचक पद है।
- source_word: אֵילִם שְׁנָיִם
  choice: दो मेढ़े
  rationale: אֵילִם नर भेड़ों के लिए मानक बलि-संबंधी शब्द है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה
  choice: एक वर्ष के ... मेमने
  rationale: בְּנֵי שָׁנָה आयु बताने वाला मानक मुहावरा है; ‘एक वर्ष के’ वर्तमान हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: אַרְבָּעָה עָשָׂר
  choice: चौदह
  rationale: यह ‘मेमने’ की संख्या बताने वाला मूल संख्या-वाचक पद है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलि-विधान में यह शारीरिक दोष या खोट से रहित पशुओं को दर्शाता है; ‘निर्दोष’ प्रतिष्ठित, संक्षिप्त और संदर्भानुकूल हिन्दी है।
