  text: 'And on the sixth day: eight bulls, two rams, and fourteen male lambs a year old, without blemish.'
translation:
  language: hi
  text: 'और छठे दिन: आठ बैल, दो मेढ़े और एक वर्ष के चौदह दोषरहित नर मेमने।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שִּׁשִּׁי
  choice: और छठे दिन
  rationale: संयोजक, संबंधसूचक उपसर्ग और क्रमवाचक विशेषण दैनिक बलियों की अगली कड़ी प्रस्तुत करते हैं; यह आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: פָּרִים שְׁמֹנָה
  choice: आठ बैल
  rationale: बलिदान के प्रसंग में פָּרִים का सामान्य अर्थ बैल है; मूल पाठ यहाँ उनकी आयु स्पष्ट नहीं करता।
- source_word: אֵילִם שְׁנָיִם
  choice: दो मेढ़े
  rationale: אֵילִם बलि के लिए प्रयुक्त नर भेड़ों का मानक पद है, जिसके लिए हिन्दी में 'मेढ़े' सटीक है।
- source_word: כְּבָשִׂים ... אַרְבָּעָה עָשָׂר
  choice: चौदह ... नर मेमने
  rationale: כְּבָשִׂים मेमनों के लिए पुल्लिंग रूप है; 'नर मेमने' बलिदान-संबंधी विशिष्टता को स्पष्ट रखता है।
- source_word: בְּנֵי שָׁנָה
  choice: एक वर्ष के
  rationale: यह इब्रानी मुहावरा एक वर्ष की आयु वाले पशुओं को सूचित करता है; 'एक वर्ष के' सहज हिन्दी है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलिदान-विधान में यह शब्द शारीरिक दोष या खोट से रहित पशुओं को दर्शाता है; 'निर्दोष' संक्षिप्त और प्रचलित धार्मिक-विधिक अभिव्यक्ति है।
