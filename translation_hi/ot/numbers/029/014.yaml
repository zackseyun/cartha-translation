  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֨ה עֶשְׂרֹנִ֜ים לַ/פָּ֣ר הָֽ/אֶחָ֗ד לִ/שְׁלֹשָׁ֤ה עָשָׂר֙ פָּרִ֔ים שְׁנֵ֤י עֶשְׂרֹנִים֙ לָ/אַ֣יִל הָֽ/אֶחָ֔ד לִ/שְׁנֵ֖י הָ/אֵילִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/014.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for each bull[a], for the thirteen bulls, and two-tenths for each ram, for the two rams.'
translation:
  language: hi
  text: 'और उनकी अन्नबलि यह हो: तेल में मिला हुआ बारीक आटा—तेरह बैलों में से प्रत्येक बैल के लिए तीन दसवें भाग[a], और दोनों मेढ़ों में से प्रत्येक मेढ़े के लिए दो दसवें भाग।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘तीन दसवें भाग’ और ‘दो दसवें भाग’ एपा के दसवें भाग की मापों को दर्शाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: और उनका अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה विशेष रूप से अन्नबलि को सूचित करता है; बहुवचन संबंधसूचक प्रत्यय को ‘उनका’ से रखा गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह अन्नबलि में प्रयुक्त बारीक पिसे उत्तम आटे का पारंपरिक उपासना-संबंधी पद है; आधुनिक हिन्दी में ‘मैदा’ संक्षिप्त और सहज है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदन्त आटे को तेल के साथ मिलाकर तैयार किए जाने को व्यक्त करता है।
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: तीन-दसवाँ भाग
  rationale: עִשָּׂרוֹן दसवें अंश की माप है; मूल पाठ में यहाँ ‘एपा’ स्पष्ट रूप से नहीं दोहराया गया, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: לַפָּר הָאֶחָד לִשְׁלֹשָׁה עָשָׂר פָּרִים
  choice: तेरह बैलों में से प्रत्येक बैल के लिए
  rationale: शाब्दिक ‘एक बैल के लिए’ यहाँ वितरणार्थक है और आगे कुल तेरह बैलों की संख्या दी गई है; हिन्दी में संयुक्त वाक्यांश अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: दो-दसवाँ भाग
  rationale: यह उसी दसवें अंश की माप का द्विवचन-संख्यात्मक रूप है; समानांतरता बनाए रखी गई है।
- source_word: לָאַיִל הָאֶחָד לִשְׁנֵי הָאֵילִם
  choice: दोनों मेढ़ों में से प्रत्येक मेढ़े के लिए
  rationale: एक मेढ़े की प्रति-पशु मात्रा और कुल दो मेढ़ों की संख्या को स्वाभाविक हिन्दी में एक साथ व्यक्त किया गया है।
