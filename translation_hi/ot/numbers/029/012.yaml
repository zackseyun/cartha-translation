id: NUM.29.12
reference: Numbers 29:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בַ/חֲמִשָּׁה֩ עָשָׂ֨ר י֜וֹם לַ/חֹ֣דֶשׁ הַ/שְּׁבִיעִ֗י מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ וְ/חַגֹּתֶ֥ם חַ֛ג לַ/יהוָ֖ה שִׁבְעַ֥ת יָמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/012.yaml
  text: And on the fifteenth day of the seventh month, you shall have a holy convocation. You shall do no ordinary work, and you shall keep a feast to Yahweh seven days.
translation:
  language: hi
  text: सातवें महीने के पंद्रहवें दिन तुम्हारी एक पवित्र सभा होगी। तुम कोई सामान्य काम न करना, और सात दिन तक यहोवा के लिए पर्व मनाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבַחֲמִשָּׁה עָשָׂר יוֹם לַחֹדֶשׁ הַשְּׁבִיעִי
  choice: सातवें महीने के पंद्रहवें दिन
  rationale: इब्रानी पंचांग-सूत्र का स्वाभाविक और सटीक हिन्दी रूप; आरंभिक וּ को हिन्दी में अलग से व्यक्त करना आवश्यक नहीं है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: एक पवित्र सभा
  rationale: यह पदबंध उपासना के लिए विधिवत बुलाई गई पवित्र सामूहिक सभा को दर्शाता है; ‘पवित्र सभा’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: יִהְיֶה לָכֶם
  choice: तुम्हारी ... होगी
  rationale: शाब्दिक अर्थ ‘तुम्हारे लिए होगी’ है; स्वामित्वसूचक हिन्दी संरचना उसी भाव को अधिक स्वाभाविक ढंग से व्यक्त करती है।
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: कोई सामान्य काम
  rationale: यह नियमित या पेशागत श्रम का निषेध है, हर प्रकार की गतिविधि का नहीं; ‘सामान्य काम’ पवित्र दिन के कार्य से उसका विरोध स्पष्ट करता है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: कानूनी निषेध की शक्ति बनाए रखते हुए यह आधुनिक हिन्दी में सीधा और स्वाभाविक आदेश है।
- source_word: וְחַגֹּתֶם חַג
  choice: पर्व मनाना
  rationale: सजातीय क्रिया-संज्ञा रचना पर्व के विधिवत उत्सव को व्यक्त करती है; हिन्दी में ‘पर्व मनाना’ उसका सहज समतुल्य है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ यहाँ पर्व को यहोवा के सम्मान में और उन्हीं के लिए मनाए जाने का भाव देता है; ‘के लिए’ हिन्दी में इसे स्पष्ट रखता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि को हिन्दी में स्पष्ट और स्वाभाविक बनाने के लिए ‘तक’ जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में विशेष वाचा-नाम יהוה है। हिन्दी पाठकों में प्रचलित व्यक्तिगत नाम ‘यहोवा’ इसे ‘प्रभु’ जैसी उपाधि से अलग रखता है, यद्यपि ‘याहवे’ संभावित उच्चारण का अधिक समीपी रूप माना जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी-विधिक गरिमा बनाए रखते हुए वाक्य सरल और सामान्य पाठक के लिए बोधगम्य रखा गया है। संबोधन बहुवचन ‘तुम’ के रूप में है।
