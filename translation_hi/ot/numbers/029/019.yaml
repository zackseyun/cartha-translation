  yaml_path: translation/ot/numbers/029/019.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and their drink offerings.
translation:
  language: hi
  text: और पापबलि के लिए एक नर बकरा, नियमित होमबलि, उसकी अन्नबलि और उनकी पेय-बलियों[a] के अतिरिक्त।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में ‘उनकी पेय-बलियाँ’ बहुवचन है; संभवतः यह निर्धारित बलियों के साथ चढ़ाई जाने वाली पेय-बलियों के पूरे समूह को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר עִזִּים אֶחָד
  choice: और ... एक बकरा भी
  rationale: שְׂעִיר עִזִּים बलिदान-संबंधी मानक पद है, जिसका अर्थ नर बकरा है; हिन्दी में ‘बकरा’ स्वाभाविक रूप से नर को सूचित करता है। אֶחָד मात्रा को स्पष्ट करता है। ‘भी’ इस अतिरिक्त चढ़ावे के समन्वय को सहज हिन्दी में व्यक्त करता है।
- source_word: חַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-विधि के संदर्भ में חַטָּאת अमूर्त ‘पाप’ नहीं, पाप के लिए चढ़ाए जाने वाले बलिदान को सूचित करता है।
- source_word: מִ/לְּ/בַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि उक्त पापबलि नियमित बलिदान-समूह के अलावा चढ़ाई जानी है।
- source_word: עֹלַת הַ/תָּמִיד
  choice: नियमित होमबलि
  rationale: הַתָּמִיד निर्धारित रूप से निरंतर या नियमित चढ़ाई जाने वाली होमबलि को सूचित करता है; ‘नियमित’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וּ/מִנְחָתָ/הּ
  choice: उसके अन्नबलि
  rationale: बलिदान-विधि में מִנְחָה प्रायः अन्नबलि है। स्त्रीलिंग एकवचन प्रत्यय הּ का संबंध עֹלָה से है, इसलिए ‘उसके’ रखा गया है।
- source_word: וְ/נִסְכֵּי/הֶם
  choice: और उनके अर्घों
  rationale: נֶסֶךְ बलिदान के साथ उंडेला जाने वाला पेय-अर्पण है, जिसे हिन्दी बाइबलीय भाषा में ‘अर्घ’ संक्षेप और गरिमा से व्यक्त करता है। मूल में संज्ञा और प्रत्यय दोनों बहुवचन हैं; इसलिए ‘उनके अर्घों’ रखा गया है।
