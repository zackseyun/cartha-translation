  text: שְׂעִיר עִזִּ֥ים אֶחָ֖ד חַטָּ֑את מִ/לְּ/בַ֞ד חַטַּ֤את הַ/כִּפֻּרִים֙ וְ/עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכֵּי/הֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/011.yaml
  text: and one male goat for a sin offering[a], besides the sin offering of atonement[b], and the regular burnt offering with its grain offering and their drink offerings.
translation:
  language: hi
  text: और पापबलि[a] के रूप में एक बकरा चढ़ाना; यह प्रायश्चित्त की पापबलि, नित्य होमबलि[b], उसकी अन्नबलि और उनके पेय-अर्पणों के अतिरिक्त होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘पापबलि’ के बदले ‘शुद्धिकरण-बलि’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘निरंतर होमबलि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂעִיר עִזִּים
  choice: एक बकरा
  rationale: यह पदबंध बलि के लिए नर बकरे को दर्शाता है। हिन्दी में ‘बकरा’ स्वयं नर पशु का बोध कराता है, इसलिए ‘नर बकरा’ अनावश्यक पुनरुक्ति होती।
- source_word: אֶחָד
  choice: एक
  rationale: बलि के लिए निर्धारित संख्या को सीधे बनाए रखा गया है।
- source_word: חַטָּאת
  choice: पापबलि
  rationale: बलिदान-संबंधी प्रसंग में यह संज्ञा पाप को नहीं, बल्कि एक प्रकार की बलि को दर्शाती है। ‘पापबलि’ प्रचलित और संक्षिप्त हिन्दी धार्मिक पद है; ‘शुद्धिकरण-बलि’ की संभावित अर्थछाया पादटिप्पणी में दी गई है।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह स्पष्ट करता है कि पहले बताई गई बलि बाद में गिनाई गई नियमित बलियों के ऊपर अतिरिक्त रूप से चढ़ाई जानी है।
- source_word: חַטַּאת הַכִּפֻּרִים
  choice: प्रायश्चित्त की पापबलि
  rationale: सम्बन्धवाचक रचना को बनाए रखते हुए इसे प्रायश्चित्त-विधि से जुड़ी पापबलि के रूप में प्रस्तुत किया गया है, बिना प्रसंग से अधिक विशिष्ट पहचान जोड़ने के।
- source_word: עֹלַת הַתָּמִיד
  choice: नित्य होमबलि
  rationale: תָּמִיד नियमित अथवा निरंतर चढ़ाई जाने वाली बलि को सूचित करता है। ‘नित्य होमबलि’ हिन्दी में संक्षिप्त, स्वाभाविक और पारंपरिक रूप से बोधगम्य है।
- source_word: מִנְחָתָהּ
  choice: उसका अन्नबलि
  rationale: एकवचन स्त्रीलिंग प्रत्यय का संबंध निकटवर्ती होमबलि से है; इसलिए ‘उसका’ रखा गया। बलिदानी सूची में מִנְחָה के लिए ‘अन्नबलि’ स्पष्ट है।
- source_word: נִסְכֵּיהֶם
  choice: उनके पेय-बलियों
  rationale: बहुवचन प्रत्यय को ‘उनके’ द्वारा सुरक्षित रखा गया है। ‘पेय-बलि’ आधुनिक पाठक के लिए अनुष्ठानिक अर्घ या उंडेली जाने वाली बलि का अपेक्षाकृत स्पष्ट रूप है।
theological_decisions:
- issue: חַטָּאת का बलिदानी अर्थ
  choice: दोनों स्थानों पर ‘पापबलि’
  alternative: ‘शुद्धिकरण-बलि’
  rationale: यहाँ बलियों की प्रक्रियात्मक सूची है। ‘पापबलि’ स्थापित और स्पष्ट समतुल्य है, पर बलि के शुद्धिकरण-संबंधी कार्य को व्यक्त करने वाला वैकल्पिक अनुवाद वास्तविक शब्दार्थ-संभावना है और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: תָּמִיד की कालगत अर्थछाया
  choice: ‘नित्य होमबलि’
  alternative: ‘निरंतर होमबलि’
  rationale: यह शब्द लगातार बने रहने और नियमित रूप से दोहराए जाने—दोनों की अर्थछाया रख सकता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘नित्य’ चुना गया और वैकल्पिक रूप पादटिप्पणी में रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सुलभ रखी गई है। पद मूल सूची की निरंतरता में ‘और’ से आरम्भ होता है। हिन्दी में अर्थ और वाक्य-संबंध स्पष्ट करने के लिए इसे दो वाक्यों में बाँटा गया है। अंग्रेज़ी परामर्श-पाठ में [b] का स्थान असंगत प्रतीत होता है; उसके विषय के अनुसार हिन्दी में चिह्न ‘नित्य होमबलि’ के बाद रखा गया है।
