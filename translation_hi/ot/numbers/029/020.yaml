  language: hi
  text: 'और तीसरे दिन: ग्यारह बैल, दो मेढ़े, चौदह एक-वर्षीय दोषरहित मेम्ने,'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁלִישִׁי
  choice: और तीसरे दिन
  rationale: संयोजक וּ और कालसूचक בַּיּוֹם को बनाए रखते हुए पर्व की भेंटों के क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: פָּרִים עַשְׁתֵּי עָשָׂר
  choice: ग्यारह बैल
  rationale: बलि-संबंधी प्रसंग में פָּרִים नर गोवंश को दर्शाता है; मूल में आयु का स्पष्ट विशेषण न होने के कारण ‘बैल’ चुना गया।
- source_word: אֵילִם שְׁנָיִם
  choice: दो मेढ़े
  rationale: אֵילִם वयस्क नर भेड़ों के लिए प्रचलित बलि-संबंधी शब्द है; ‘मेढ़े’ इसका सीधा हिन्दी समतुल्य है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה אַרְבָּעָה עָשָׂר
  choice: एक वर्ष के चौदह मेम्ने
  rationale: בְּנֵי שָׁנָה पशुओं की एक वर्ष की आयु बताने वाला इब्रानी मुहावरा है; यह रूप हिन्दी में सहज और स्पष्ट है।
- source_word: תְּמִימִם
  choice: निर्दोष
  rationale: बलि-विधान में यह शब्द शारीरिक दोष या खोट से रहित पशुओं को दर्शाता है; ‘निर्दोष’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
