  yaml_path: translation/ot/numbers/029/030.yaml
  text: and their grain offering and their drink offerings for the bulls[a], for the rams, and for the lambs, according to their number, according to the ordinance.
translation:
  language: hi
  text: और बैलों, मेढ़ों और मेमनों के लिए उनकी अन्नबलि और पेय-बलियाँ, उनकी संख्या के अनुसार, निर्धारित विधि[a] के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ठहराए हुए नियम के अनुसार।” इब्रानी כַּמִּשְׁפָּט यहाँ इन चढ़ावों को प्रस्तुत करने की स्थापित रीति को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִנְחָתָם
  choice: अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה अनाज से चढ़ाई जाने वाली भेंट को सूचित करता है; ‘अन्नबलि’ संक्षिप्त और प्रचलित धार्मिक शब्द है।
- source_word: נִסְכֵּיהֶם
  choice: अर्घ
  rationale: נֶסֶךְ बलिदान के साथ उंडेली जाने वाली पेय-भेंट है; ‘अर्घ’ हिंदी बाइबलीय प्रयोग में इस विशिष्ट चढ़ावे को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַפָּרִים
  choice: बैलों के लिए
  rationale: פַּר बलिदान-सूचियों में बैल को सूचित करता है; मूल में आयु स्पष्ट न होने के कारण ‘बछड़े’ या ‘जवान बैल’ नहीं जोड़ा गया।
- source_word: לָאֵילִם
  choice: मेढ़ों के लिए
  rationale: אַיִל का बलिदान-संबंधी अर्थ सीधे तौर पर ‘मेढ़ा’ है।
- source_word: וְלַכְּבָשִׂים
  choice: और मेमनों के लिए
  rationale: כֶּבֶשׂ का अर्थ मेमना है; यहाँ लिंग को अलग से स्पष्ट करना आवश्यक नहीं है।
- source_word: בְּמִסְפָּרָם
  choice: उनकी संख्या के अनुसार
  rationale: यह वाक्यांश निर्धारित पशुओं की गिनी हुई संख्या के अनुरूप सहायक चढ़ावों को दर्शाता है।
- source_word: כַּמִּשְׁפָּט
  choice: निर्धारित विधि के अनुसार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय नहीं, बल्कि चढ़ावे प्रस्तुत करने के स्थापित नियम या निर्धारित रीति को सूचित करता है।
