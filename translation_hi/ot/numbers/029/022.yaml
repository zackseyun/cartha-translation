lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: और ... एक बकरा
  rationale: שָׂעִיר नर बकरे को सूचित करता है; हिन्दी में ‘बकरा’ स्वयं नर पशु को स्पष्ट करता है। आरम्भिक ‘और’ इब्रानी संयोजक וּ को दर्शाता है।
- source_word: חַטָּאת
