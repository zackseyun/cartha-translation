  register: आधुनिक मानक हिन्दी में स्वाभाविक किंतु गरिमापूर्ण बलिदानी शब्दावली रखी गई है। इब्रानी का क्रियारहित वाक्य हिन्दी में ‘हो’ से व्यक्त किया गया है। माप की अस्पष्टता से बचने के लिए ‘एपा’ मुख्य पाठ में जोड़ा गया है और सांस्कृतिक स्पष्टीकरण पादटिप्पणी में दिया गया है।
