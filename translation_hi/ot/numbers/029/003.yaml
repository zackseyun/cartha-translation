  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵ֥י עֶשְׂרֹנִ֖ים לָ/אָֽיִל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/003.yaml
  text: 'And their grain offering shall be fine flour mixed with oil: three-tenths for the bull[a], two-tenths for the ram.'
translation:
  language: hi
  text: 'और उनकी अन्नबलि तेल से मिला हुआ बारीक आटा हो: बैल के लिए एपा के तीन-दसवें भाग[a]; मेढ़े के लिए एपा के दो-दसवें भाग।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एपा प्राचीन इस्राएल में सूखी वस्तुओं को मापने की एक इकाई थी। यहाँ ‘तीन-दसवें भाग’ और आगे ‘दो-दसवें भाग’ से आशय एपा के दशांशों से है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: और उनका अन्नबलि
  rationale: बलिदान-संबंधी संदर्भ में מִנְחָה विशेष रूप से अन्नबलि को दर्शाता है; וּ को ‘और’ के रूप में रखा गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बलि के लिए प्रयुक्त बारीक पिसे उत्तम आटे को दर्शाता है; आधुनिक हिन्दी में ‘मैदा’ सहज और स्पष्ट है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत आटे को तेल के साथ मिलाकर तैयार किए जाने की विधि बताता है।
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: एपा के तीन-दसवें भाग
  rationale: עִשָּׂרוֹן एपा का दसवाँ भाग है; माप को मुख्य पाठ में स्पष्ट करने से हिन्दी पाठक मात्रा ठीक समझता है।
- source_word: לַפָּר
  choice: बछड़े के लिए
  rationale: बलिदान-संबंधी प्रयोग में פַּר जवान बैल अथवा बैल का बछड़ा है; निकटवर्ती संदर्भ के अनुरूप प्रचलित हिन्दी बलिदानी शब्दावली चुनी गई है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: एपा के दो-दसवें भाग
  rationale: मूल में उल्लिखित दो दशांशों को उनके निहित माप ‘एपा’ सहित स्पष्ट किया गया है।
- source_word: לָאָיִל
  choice: मेढ़े के लिए
  rationale: אַיִל बलिदान के संदर्भ में नर भेड़, अर्थात मेढ़ा, को दर्शाता है।
