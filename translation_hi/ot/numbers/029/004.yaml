translation:
  language: hi
  text: और सातों मेमनों में से प्रत्येक मेमने के लिए दसवाँ भाग[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘दसवाँ भाग’; बलिदान के इस संदर्भ में सामान्यतः इसका अर्थ एक एपा का दसवाँ भाग होता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעִשָּׂרוֹן אֶחָד
  choice: और ... दसवाँ भाग
  rationale: इब्रानी पदबंध का अर्थ एक दशमांश माप है। मूल पाठ में माप की इकाई स्पष्ट नहीं की गई है, इसलिए मुख्य पाठ में ‘एपा का’ नहीं जोड़ा गया।
- source_word: לַכֶּבֶשׂ הָאֶחָד
  choice: प्रत्येक मेमने के लिए
  rationale: शाब्दिक रूप ‘उस एक मेमने के लिए’ है, पर बलिदानों की इस सूची में इसका भाव वितरणात्मक है—निर्धारित मात्रा हर मेमने के लिए अलग-अलग है।
- source_word: לְשִׁבְעַת הַכְּבָשִׂים
  choice: सातों मेमनों में से
  rationale: यह पदबंध उस निश्चित सात-मेमनों के समूह को बताता है जिस पर प्रति-मेमना मात्रा लागू होती है; हिंदी में इसे पिछले पदबंध के साथ स्वाभाविक रूप से जोड़ा गया है।
