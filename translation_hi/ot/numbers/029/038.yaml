    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: और ... एक बकरा
  rationale: שׂעִיר बकरे को, और बलिदान-संबंधी प्रसंग में विशेष रूप से नर बकरे को, सूचित कर सकता है। मुख्य पाठ में सहज ‘बकरा’ रखा गया है और अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: חַטָּאת
  choice: पापबलि के लिए
  rationale: याजकीय बलिदान-संबंधी संदर्भ में חַטָּאת अमूर्त ‘पाप’ नहीं, बल्कि सामान्यतः पापबलि को सूचित करता है।
- source_word: אֶחָד
  choice: एक
  rationale: यह चढ़ाए जाने वाले पशु की संख्या बताने वाला गणनावाचक शब्द है।
- source_word: מִ/לְּ/בַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि यह बलि पहले से निर्धारित नियमित बलि के साथ अतिरिक्त रूप से चढ़ाई जानी है।
- source_word: עֹלַת הַ/תָּמִיד
  choice: नियमित होमबलि
  rationale: עֹלָה के लिए प्रचलित और संक्षिप्त ‘होमबलि’ तथा הַתָּמִיד के आवर्ती, नियत स्वरूप के लिए ‘नियमित’ चुना गया है।
- source_word: וּ/מִנְחָתָ/הּ
  choice: उसके अन्नबलि
  rationale: याजकीय प्रसंग में מִנְחָה अन्नबलि है; स्त्रीलिंग एकवचन प्रत्यय का संदर्भ होमबलि से है।
- source_word: וְ/נִסְכָּ/הּ
  choice: और अर्घ
  rationale: נֶסֶךְ बलि के साथ चढ़ाया जाने वाला पेय-अर्पण है। आधुनिक हिन्दी बाइबलीय शैली में ‘अर्घ’ संक्षिप्त और गरिमापूर्ण है; संबंधवाचक ‘उसके’ संयुक्त पदों पर लागू होता है।
