  text: וּ/שְׂעִ֥יר חַטָּ֖את אֶחָ֑ד מִ/לְּ/בַד֙ עֹלַ֣ת הַ/תָּמִ֔יד וּ/מִנְחָתָ֖/הּ וְ/נִסְכָּֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/028.yaml
  text: and one male goat for a sin offering[b][a], besides the regular burnt offering and its grain offering and its drink offering.
translation:
  language: hi
  text: और पापबलि के लिये एक बकरा, नियमित होमबलि और उसकी अन्नबलि तथा पेयबलि के अतिरिक्त।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׂעִיר
  choice: और ... एक बकरा
  rationale: שָׂעִיר नर बकरे को सूचित करता है; हिन्दी में ‘बकरा’ स्वयं नर पशु को स्पष्ट करता है। आरम्भिक ו को सूची की निरन्तरता दिखाने के लिए ‘और’ से व्यक्त किया गया है।
- source_word: חַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदान-संबंधी प्रसंग में חַטָּאת अमूर्त ‘पाप’ नहीं, पाप के लिए चढ़ाई जाने वाली बलि को सूचित करता है।
- source_word: אֶחָד
  choice: एक
  rationale: बलि के पशु की संख्या को मूल के अनुसार स्पष्ट रखा गया है।
- source_word: מִ/לְּ/בַד
  choice: के अतिरिक्त
  rationale: यह पद बताता है कि उक्त बलि नियमित बलि-समूह के साथ अतिरिक्त रूप से चढ़ाई जानी है।
- source_word: עֹלַת
  choice: होमबलि
  rationale: पूरी तरह जलाकर चढ़ाई जाने वाली बलि के लिए प्रचलित और संक्षिप्त हिन्दी धार्मिक पद।
- source_word: הַ/תָּמִיד
  choice: नियमित
  rationale: תָּמִיד की निरन्तर और निर्धारित प्रकृति व्यक्त होती है, बिना मूल से अधिक विशिष्ट ‘प्रतिदिन’ जोड़ने के।
- source_word: וּ/מִנְחָתָ/הּ
  choice: और उसके अन्नबलि
  rationale: याजकीय बलि-सूचियों में מִנְחָה साथ चढ़ाया जाने वाला अन्नबलि है; स्त्रीलिंग प्रत्यय होमबलि की ओर संकेत करता है।
- source_word: וְ/נִסְכָּ/הּ
  choice: और अर्घ
  rationale: נֶסֶךְ बलि के साथ उंडेला जाने वाला पेय-अर्पण है। ‘अर्घ’ गरिमापूर्ण और संक्षिप्त हिन्दी पद है; वैकल्पिक स्पष्ट रूप पादटिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण बलिदान-संबंधी शब्दावली रखी गई है। मूल की सूचीगत संरचना और अतिरिक्त अर्पण का संबंध स्पष्ट करने के लिए वाक्य को स्वाभाविक हिन्दी में दो वाक्यों में प्रस्तुत किया गया है।
