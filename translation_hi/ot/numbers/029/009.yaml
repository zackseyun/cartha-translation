  text: וּ/מִנְחָתָ֔/ם סֹ֖לֶת בְּלוּלָ֣ה בַ/שָּׁ֑מֶן שְׁלֹשָׁ֤ה עֶשְׂרֹנִים֙ לַ/פָּ֔ר שְׁנֵי֙ עֶשְׂרֹנִ֔ים לָ/אַ֖יִל הָ/אֶחָֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/009.yaml
  text: 'and their grain offering: fine flour mixed with oil[a], three-tenths for the bull, two-tenths for the one ram,'
translation:
  language: hi
  text: 'और उनकी अन्नबलि: तेल में मिला हुआ मैदा—बैल के लिए तीन दसवें माप, और उस एक मेढ़े के लिए दो दसवें माप।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘तीन दसवें माप’ और ‘दो दसवें माप’ है; इन मापों को सामान्यतः एपा के दसवें भाग समझा जाता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִנְחָתָם
  choice: और उनके साथ चढ़ाया जाने वाला अन्नबलि
  rationale: बलिदान-संबंधी प्रसंग में מִנְחָה पशु-बलियों के साथ चढ़ाए जाने वाले अन्नबलि को दर्शाता है। प्रत्यय का संबंध पहले बताए गए पशुओं से है; स्वाभाविक हिन्दी में इसे ‘उनके साथ’ से स्पष्ट किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת बलि में प्रयुक्त बारीक और उत्तम आटे को दर्शाता है। आधुनिक हिन्दी में ‘मैदा’ इसका सहज और संक्षिप्त समतुल्य है।
- source_word: בְּלוּלָה בַשָּׁמֶן
  choice: तेल में मिला हुआ
  rationale: निष्क्रिय कृदंत आटे को तेल के साथ मिलाए जाने का वर्णन करता है; यह प्रयोग हिन्दी में स्वाभाविक है और तैयारी की विधि को बनाए रखता है।
- source_word: שְׁלֹשָׁה עֶשְׂרֹנִים
  choice: एपा का तीन-दसवाँ भाग
  rationale: עִשָּׂרוֹן दसवें अंश की माप है, जिसे इस विधिक प्रसंग में परंपरागत रूप से एपा का दसवाँ भाग समझा जाता है। माप को स्पष्ट रूप से व्यक्त करने से हिन्दी पाठक के लिए अधूरापन नहीं रहता।
- source_word: לַפָּר
  choice: बैल के लिए
  rationale: सव्यंजक एकवचन पहले उल्लिखित बैल की ओर संकेत करता है; सीधा हिन्दी रूप मूल की निश्चितता बनाए रखता है।
- source_word: שְׁנֵי עֶשְׂרֹנִים
  choice: एपा का दो-दसवाँ भाग
  rationale: यह दो दसवें मापों को दर्शाता है; ‘एपा का’ जोड़कर निहित माप-इकाई स्पष्ट की गई है।
- source_word: לָאַיִל הָאֶחָד
  choice: उस एक मेढ़े के लिए
  rationale: सव्यंजक और אֶחָד मिलकर गिनाए गए एकमात्र मेढ़े को विशिष्ट करते हैं। ‘उस एक मेढ़े’ मूल की इसी विशिष्टता को सुरक्षित रखता है।
