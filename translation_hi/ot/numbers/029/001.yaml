source:
  edition: WLC
  text: וּ/בַ/חֹ֨דֶשׁ הַ/שְּׁבִיעִ֜י בְּ/אֶחָ֣ד לַ/חֹ֗דֶשׁ מִֽקְרָא קֹ֨דֶשׁ֙ יִהְיֶ֣ה לָ/כֶ֔ם כָּל מְלֶ֥אכֶת עֲבֹדָ֖ה לֹ֣א תַעֲשׂ֑וּ י֥וֹם תְּרוּעָ֖ה יִהְיֶ֥ה לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/001.yaml
  text: And in the seventh month, on the first day of the month, you shall have a holy convocation. You shall do no laborious work. It shall be a day of trumpet-blast for you.
translation:
  language: hi
  text: और सातवें महीने के पहले दिन तुम्हारी एक पवित्र सभा होगी। तुम कोई भी परिश्रम का काम न करना। वह तुम्हारे लिए तुरही-नाद का दिन होगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जयघोष का दिन” अथवा “ऊँची पुकार का दिन।” इब्रानी शब्द तेरूआह ऊँची ध्वनि को दर्शाता है और प्रसंग के अनुसार तुरही-संकेत, पुकार या जयघोष हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבַחֹדֶשׁ הַשְּׁבִיעִי
  choice: और सातवें महीने
  rationale: וּ को विधिक क्रम बनाए रखने के लिए ‘और’ से व्यक्त किया गया है; בַ का यहाँ कालवाचक अर्थ है।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: के पहले दिन
  rationale: शाब्दिक रूप से ‘महीने की एक तारीख को’ मानक इब्रानी पंचांगीय अभिव्यक्ति है, जिसका अर्थ महीने का पहला दिन है।
- source_word: מִקְרָא קֹדֶשׁ
  choice: एक पवित्र सभा
  rationale: यह नियत उपासना के लिए विधिवत बुलाई गई पवित्र सभा को दर्शाता है; ‘पवित्र सभा’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: כָּל מְלֶאכֶת עֲבֹדָה
  choice: कोई श्रम का काम
  rationale: यह हर प्रकार की गतिविधि नहीं, बल्कि पर्व के दिन निषिद्ध सामान्य श्रम या कामकाज को सूचित करता है।
- source_word: לֹא תַעֲשׂוּ
  choice: न करना
  rationale: द्वितीय पुरुष बहुवचन के विधिक निषेध को गरिमापूर्ण और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹם תְּרוּעָה
  choice: तुरही-नाद का दिन
  rationale: पर्व-संदर्भ में תְּרוּעָה को तुरही के संकेत-नाद के रूप में समझना उचित है, पर मूल शब्द किसी ऊँची पुकार या जयघोष को भी दर्शा सकता है; इस व्यापकता को पादटिप्पणी में रखा गया है।
- source_word: יִהְיֶה לָכֶם
  choice: वह तुम्हारे लिए ... होगा
  rationale: यह रचना समुदाय के लिए उस दिन के नियत स्वरूप को व्यक्त करती है।
theological_decisions:
- issue: יוֹם תְּרוּעָה पर्व-संज्ञा का अनुवाद
  choice: तुरही-नाद का दिन
  alternative: जयघोष या ऊँची पुकार का दिन
  rationale: मुख्य पाठ में बाद की पारंपरिक पर्व-संज्ञा आरोपित करने के बजाय इब्रानी पद का वर्णनात्मक अनुवाद किया गया है। תְּרוּעָה की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-उपासना संबंधी गरिमा बनाए रखते हुए सरल वाक्य-विन्यास। ‘तुरही-नाद’ औपचारिक किन्तु सामान्य पाठक के लिए बोधगम्य है।
