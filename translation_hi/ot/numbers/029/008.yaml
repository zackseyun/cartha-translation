source:
  edition: WLC
  text: וְ/הִקְרַבְתֶּ֨ם עֹלָ֤ה לַֽ/יהוָה֙ רֵ֣יחַ נִיחֹ֔חַ פַּ֧ר בֶּן בָּקָ֛ר אֶחָ֖ד אַ֣יִל אֶחָ֑ד כְּבָשִׂ֤ים בְּנֵֽי שָׁנָה֙ שִׁבְעָ֔ה תְּמִימִ֖ם יִהְי֥וּ לָ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/029/008.yaml
  text: 'You shall present a burnt offering to Yahweh[a], a pleasing aroma: one bull from the herd, one ram, and seven male lambs a year old; they shall be without blemish for you.'
translation:
  language: hi
  text: 'याहवे के लिए सुखद सुगंध के रूप में होमबलि चढ़ाओ: गोधन में से एक बैल, एक मेढ़ा और एक-एक वर्ष के सात नर मेमने। वे तुम्हारे लिए निर्दोष हों।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרַבְתֶּם
  choice: तुम ... चढ़ाना
  rationale: हिफ़ील रूप बलिदान के प्रसंग में किसी भेंट को परमेश्वर के सामने प्रस्तुत या अर्पित करने का निर्देश देता है। ‘चढ़ाना’ आधुनिक हिन्दी में बलिदान-संबंधी क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: यह उस बलिदान का मानक पद है जो वेदी पर पूरी तरह जलाया जाता था। ‘होमबलि’ हिन्दी बाइबल-परंपरा में संक्षिप्त और परिचित है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है; उसे उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है। ל समर्पण अथवा अर्पण की दिशा बताता है।
- source_word: רֵיחַ נִיחֹחַ
  choice: सुखद सुगंध
  rationale: यह बलिदान के स्वीकार्य होने को व्यक्त करने वाला स्थिर इब्रानी प्रयोग है। ‘सुखद सुगंध’ उसके रूपक और धार्मिक संदर्भ, दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: פַּר בֶּן בָּקָר אֶחָד
  choice: गोधन में से एक बैल
  rationale: शाब्दिक रचना ‘मवेशियों का पुत्र, एक बैल’ है। ‘गोधन में से एक बैल’ पशु की जाति और झुंड से उसके लिए जाने की बात को बिना अस्वाभाविक शाब्दिकता के व्यक्त करता है।
- source_word: אַיִל אֶחָד
  choice: एक मेढ़ा
  rationale: אַיִל का बलिदानी सूचियों में सामान्य अर्थ वयस्क नर भेड़, अर्थात ‘मेढ़ा’, है।
- source_word: כְּבָשִׂים בְּנֵי שָׁנָה שִׁבְעָה
  choice: एक-एक वर्ष के सात नर मेमने
  rationale: כְּבָשִׂים पुल्लिंग और बहुवचन है, इसलिए ‘नर’ रखा गया है। בְּנֵי שָׁנָה एक वर्ष की आयु का मुहावरा है।
- source_word: תְּמִימִם יִהְיוּ לָכֶם
  choice: तुम्हारे द्वारा चढ़ाए जाने वाले ये सभी पशु निर्दोष हों
  rationale: बलिदानी प्रसंग में תְּמִימִם का अर्थ शारीरिक दोष से रहित है। לָכֶם को यांत्रिक ‘तुम्हारे लिए’ के बजाय उपासकों की जिम्मेदारी स्पष्ट करने वाली स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ इब्रानी नाम का निकट लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: רֵיחַ נִיחֹחַ में बलिदान की स्वीकार्यता और सुगंध का रूपक
  choice: सुखद सुगंध
  alternative: शांतिदायक सुगंध
  rationale: मूल अभिव्यक्ति वास्तविक सुगंध की भाषा के द्वारा बलिदान के स्वीकार्य होने को बताती है। पाठ के रूपक को रखा गया है, पर ऐसा शब्द नहीं चुना गया जो अनिवार्य रूप से यह संकेत दे कि बलिदान परमेश्वर के क्रोध को शांत करता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। बलिदानी पदावली में परिचित ‘होमबलि’ और ‘निर्दोष’ का प्रयोग किया गया है, जबकि आयु और पशुओं के लिंग-संबंधी विवरण मूल के अनुसार स्पष्ट रखे गए हैं।
