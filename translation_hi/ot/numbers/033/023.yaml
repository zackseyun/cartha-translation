base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/023.yaml
  text: They set out from Kehelathah and camped at Mount Shepher[a].
translation:
  language: hi
  text: उन्होंने केहेलाता से कूच किया और शाफेर पर्वत[a] पर डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शेफेर पर्वत।’
    reason: स्थान-नाम שָׁפֶר के प्रचलित वैकल्पिक लिप्यंतरण को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से कूच किया
  rationale: गिनती 33 की यात्रा-सूची में נסע का अर्थ पड़ाव छोड़कर आगे बढ़ना है; ‘कूच किया’ आधुनिक हिन्दी में इस भाव को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִקְּהֵלָתָה
  choice: कहेलाता से
  rationale: מִן उपसर्ग प्रस्थान-बिंदु बताता है और קְהֵלָתָה स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: यात्रा-वृत्तांत में חנה का अर्थ शिविर लगाना है; ‘डेरा डाला’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּהַר
  choice: पर्वत पर
  rationale: הַר के बाद स्थान-नाम आने पर वह नामित पर्वत को सूचित करता है; ב को शिविर के स्थान के संदर्भ में ‘पर’ कहा गया है।
- source_word: שָׁפֶר
  choice: शापेर
  rationale: मसोरेटी स्वरांकन שָׁפֶר को हिन्दी में निकटता से दर्शाने के लिए ‘शापेर’ चुना गया है। ‘शेफेर’ एक प्रचलित वैकल्पिक लिप्यंतरण है।
