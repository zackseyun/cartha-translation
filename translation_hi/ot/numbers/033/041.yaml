  text: וַ/יִּסְע֖וּ מֵ/הֹ֣ר הָ/הָ֑ר וַֽ/יַּחֲנ֖וּ בְּ/צַלְמֹנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/041.yaml
  text: They set out from Mount Hor and camped at Zalmonah.
translation:
  language: hi
  text: उन्होंने होर पर्वत से कूच किया और सलमोना में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... कूच किया
  rationale: यात्रा-वृत्तांत में נסע का अर्थ शिविर समेटकर अगले पड़ाव के लिए निकलना है। ‘कूच किया’ इस सूत्रात्मक अर्थ को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: מֵהֹר הָהָר
  choice: होर पर्वत से
  rationale: הֹר הָהָר स्थापित स्थान-नाम है। हिन्दी में ‘होर पर्वत’ स्वाभाविक रूप है और מֵ की अपादान-वाचकता ‘से’ द्वारा स्पष्ट होती है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: חנה यहाँ यात्रा के दौरान शिविर लगाने या ठहरने को दर्शाता है। ‘पड़ाव डाला’ आधुनिक हिन्दी में यात्रा-सूची के प्रसंग के अनुकूल है।
- source_word: בְּצַלְמֹנָה
  choice: सलमोना में
  rationale: בְּ यहाँ स्थानवाचक है। नामित स्थान पर शिविर लगाने के लिए हिन्दी में ‘में’ सहज है; צַלְמֹנָה का लिप्यंतरण ‘सलमोना’ रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल इब्रानी यात्रा-सूत्र के दो समानांतर क्रियाखंडों को संक्षिप्त हिन्दी में सुरक्षित रखा गया है।
