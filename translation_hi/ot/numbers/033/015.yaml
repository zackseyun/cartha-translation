  yaml_path: translation/ot/numbers/033/015.yaml
  text: They set out from Rephidim and camped in the wilderness of Sinai.
translation:
  language: hi
  text: वे रपीदीम से चल पड़े और सीनै के जंगल में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चल पड़े
  rationale: यात्रा-वृत्तांत के सूत्र में נסע किसी पड़ाव से आगे प्रस्थान करने को दर्शाता है। ‘चल पड़े’ आधुनिक, सहज हिन्दी में इस गति को स्पष्ट रखता है।
- source_word: מֵרְפִידִם
  choice: रपीदीम से
  rationale: उपसर्ग מֵ־ स्रोत या प्रस्थान-बिंदु बताता है। רְפִידִם स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה का अर्थ इस जंगल-यात्रा के संदर्भ में पड़ाव डालना या शिविर लगाना है। ‘डेरा डाला’ स्वाभाविक आधुनिक हिन्दी में ठोस क्रिया को व्यक्त करता है।
- source_word: בְּמִדְבַּר סִינָי
  choice: सीनै के जंगल में
  rationale: מִדְבָּר निर्जन या कम आबाद जंगल-प्रदेश को दर्शा सकता है; ‘जंगल’ पेंटाट्यूक की हिन्दी शैली में स्वाभाविक है और इसे केवल रेतीला मरुस्थल मानकर अर्थ को संकुचित नहीं करता। संबंधसूचक रचना को ‘सीनै के’ से व्यक्त किया गया है।
