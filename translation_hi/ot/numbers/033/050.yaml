source:
  edition: WLC
  text: וַ/יְדַבֵּ֧ר יְהוָ֛ה אֶל מֹשֶׁ֖ה בְּ/עַֽרְבֹ֣ת מוֹאָ֑ב עַל יַרְדֵּ֥ן יְרֵח֖וֹ לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/050.yaml
  text: And Yahweh spoke to Moses in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: hi
  text: 'और याहवे ने मोआब के मैदानों में, यरीहो के पास यरदन के किनारे, मूसा से कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: और ... ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है। हिन्दी में ‘कहा’ इस वाक्य और अगले पद में आने वाली प्रत्यक्ष वाणी का स्वाभाविक परिचय देता है; अलग से ‘यह कहते हुए’ रखने पर अभिव्यक्ति अनावश्यक रूप से बोझिल होती।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी में प्रचलित बाइबलीय नामरूप।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עֲרָבוֹת यहाँ खुले समतल अथवा स्तेपी भूभाग को दर्शाता है; ‘मैदानों’ आधुनिक हिन्दी में स्वाभाविक और भौगोलिक संदर्भ के अनुकूल है।
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: यरीहो के पास यरदन के किनारे
  rationale: भौगोलिक पदबंध का आशय यरीहो के सामने/पास, यरदन के समीप स्थित स्थान है। हिन्दी में यह क्रम संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह infinitive अगले पद की प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में कथन-क्रिया के बाद विसर्ग-चिह्न लगाना उसी कार्य को संक्षेप और स्वाभाविक रूप से निभाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। मूल की स्थान-सूचना सुरक्षित रखी गई है। ‘मैदानों’ के लिए अलग पाद-टिप्पणी नहीं दी गई, क्योंकि ‘स्तेपी भूभाग’ निकटार्थी शब्दार्थ है, पाठगत भिन्नता नहीं; हिन्दी पाठ में ‘मैदानों’ पर्याप्त स्पष्ट है।
