  text: וַ/יִּסְע֖וּ מִ/סֻּכֹּ֑ת וַ/יַּחֲנ֣וּ בְ/אֵתָ֔ם אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/מִּדְבָּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/006.yaml
  text: They set out from Sukkoth and camped at Etham[a], which is at the edge of the wilderness.
translation:
  language: hi
  text: वे सुक्कोत से चले और एताम में डेरा डाला, जो निर्जन प्रदेश के किनारे पर[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निर्जन प्रदेश की सीमा पर।”
    reason: קָצֶה का अर्थ किसी क्षेत्र का ‘किनारा’ या उसकी ‘सीमा’ दोनों हो सकता है।
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चले
  rationale: यात्रा-विवरण में נסע प्रस्थान करने को दर्शाता है। ‘से चले’ सहज आधुनिक हिन्दी है और कथानक की गति बनाए रखता है।
- source_word: מִסֻּכֹּת
  choice: सुक्कोत से
  rationale: स्थान-नाम का अनुवाद न करके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना या शिविर लगाना है। इस यात्रा-विवरण में ‘डेरा डाला’ स्वाभाविक और स्पष्ट है।
- source_word: בְאֵתָם
  choice: एताम में
  rationale: स्थान-नाम אֵתָם का देवनागरी लिप्यंतरण किया गया है; उपसर्ग בְ यहाँ उस स्थान पर पड़ाव डालने का भाव देता है।
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह एताम का वर्णन करने वाला संबंधवाचक उपवाक्य आरम्भ करता है।
- source_word: בִּקְצֵה
  choice: किनारे पर
  rationale: קָצֶה किसी भूभाग के छोर या सीमा को दर्शा सकता है। ‘किनारे पर’ भौगोलिक अर्थ को सहज रूप में व्यक्त करता है, जबकि ‘सीमा पर’ को पादटिप्पणी में विकल्प के रूप में रखा गया है।
- source_word: הַמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: מִדְבָּר प्रायः बस्ती और खेती से बाहर के उजाड़ भूभाग को दर्शाता है, जो आवश्यक नहीं कि रेतीला मरुस्थल या पेड़ों वाला जंगल हो। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में यह व्यापक अर्थ स्पष्ट रखता है।
