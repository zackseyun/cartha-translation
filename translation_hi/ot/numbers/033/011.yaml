  text: וַ/יִּסְע֖וּ מִ/יַּם ס֑וּף וַֽ/יַּחֲנ֖וּ בְּ/מִדְבַּר סִֽין־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/011.yaml
  text: They set out from the Red Sea and camped in the wilderness of Sin[a][b].
translation:
  language: hi
  text: फिर वे लाल समुद्र[a] से रवाना हुए और सीन के वीराने[b] में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सरकंडों के समुद्र।” इब्रानी नाम याम सूफ़ का परंपरागत अनुवाद “लाल समुद्र” है, पर अधिक शब्दशः अर्थ प्रायः “सरकंडों का समुद्र” समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: “सीन” एक वीरान प्रदेश का नाम है; इसका पाप से कोई संबंध नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: रवाना हुए
  rationale: गिनती 33 की यात्रा-सूची में נסע किसी पड़ाव या स्थान से आगे चलने को दर्शाता है। ‘रवाना हुए’ स्वाभाविक आधुनिक हिन्दी में इस प्रस्थान-सूत्र को स्पष्ट रखता है।
- source_word: מִיַּם סוּף
  choice: लाल समुद्र
  rationale: याम सूफ़ इस प्रसंग में भौगोलिक नाम है और परंपरागत रूप से ‘लाल समुद्र’ कहलाता है। अधिक शब्दशः सम्भावना ‘सरकंडों का समुद्र’ पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: וַיַּחֲנוּ
  choice: पड़ाव डाला
  rationale: חנה जंगल-यात्रा के वर्णन में शिविर लगाने या ठहरने का सामान्य क्रियापद है। ‘पड़ाव डाला’ यात्रा-सूची के प्रसंग में सहज और ठोस हिन्दी अभिव्यक्ति है।
- source_word: בְּמִדְבַּר סִין
  choice: सीन के वीराने में
  rationale: מִדְבָּר निर्जन, बंजर या मरुस्थलीय क्षेत्र को सूचित करता है; ‘वीराना’ सामान्य आधुनिक हिन्दी में इसका स्वाभाविक रूप है। ‘सीन’ स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है।
theological_decisions: []
