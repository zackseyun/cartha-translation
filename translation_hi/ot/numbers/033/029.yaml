  text: They set out from Mithkah and camped at Hashmonah.
translation:
  language: hi
  text: उन्होंने मित्का से कूच किया और हश्मोना में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... कूच किया
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ एक स्थान से अगले स्थान के लिए प्रस्थान करना है। ‘कूच किया’ आधुनिक, सहज और यात्रा-संदर्भ के अनुकूल है।
- source_word: מִמִּתְקָה
  choice: मित्का से
  rationale: उपसर्ग מִן को ‘से’ अनूदित किया गया है और स्थान-नाम מִתְקָה का देवनागरी लिप्यंतरण ‘मित्का’ किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: חנה यात्रा-वृत्तांत में शिविर लगाने या ठहरने का मानक क्रियापद है। हिंदी में ‘पड़ाव डाला’ इस प्रसंग का स्वाभाविक और स्पष्ट रूप है।
- source_word: בְּחַשְׁמֹנָה
  choice: हशमोना में
  rationale: पड़ाव के स्थान के साथ בְּ को स्वाभाविक हिंदी में ‘में’ कहा गया है और חַשְׁמֹנָה का लिप्यंतरण ‘हशमोना’ किया गया है।
