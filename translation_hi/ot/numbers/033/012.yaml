translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संक्षिप्त हिब्रू यात्रा-सूत्र की क्रमबद्धता और समानांतर क्रियाएँ सुरक्षित हैं। अंग्रेज़ी में आवश्यक ‘sin’ संबंधी टिप्पणी हिंदी में आवश्यक नहीं, क्योंकि ‘सीन’ का हिंदी शब्द ‘पाप’ से कोई भ्रम नहीं होता।
