  text: They set out from the wilderness of Sin and camped at Dophkah[a].
translation:
  language: hi
  text: फिर वे सीन के जंगल से चल पड़े और दोफ्का में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे … से चल पड़े
  rationale: यात्रा-विवरण में נסע का अर्थ डेरा उठाकर आगे प्रस्थान करना है। ‘चल पड़े’ आधुनिक और स्वाभाविक है; ‘फिर’ क्रमसूचक वाव का भाव व्यक्त करता है।
- source_word: מִמִּדְבַּר
  choice: निर्जन प्रदेश से
  rationale: מִדְבָּר वीरान अथवा कम आबादी वाले मरुस्थलीय भूभाग को दर्शाता है। ‘निर्जन प्रदेश’ सामान्य पाठक के लिए स्पष्ट है और हर संदर्भ में केवल रेतीले रेगिस्तान का अर्थ नहीं थोपता।
- source_word: סִין
  choice: सीन
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय हिंदी ध्वन्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और … डेरा डाला
  rationale: חנה यात्रा-विवरण में पड़ाव डालने को व्यक्त करता है। ‘डेरा डाला’ सहज आधुनिक हिंदी है।
- source_word: בְּדָפְקָה
  choice: दोपका में
  rationale: בְּ स्थान सूचित करता है। דָּפְקָה का ध्वन्यंतरण ‘दोपका’ उसके पारंपरिक हिब्रू उच्चारण को हिंदी में निकटता से प्रस्तुत करता है।
