  choice: बात कर
  rationale: पिएल आज्ञार्थक क्रिया का सीधा संप्रेषणात्मक बल रखता है और आगे आने वाले ‘कह’ से अलग दोनों इब्रानी क्रियाओं को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
