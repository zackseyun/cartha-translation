    issue: ‘बात कर’ is less precise for דַּבֵּר אֶל.
    rationale: In Hindi it commonly means ‘converse/talk with,’ whereas the Hebrew directs Moses to address the sons of Israel. ‘संबोधित कर’ expresses the directional, public-address sense and retains a distinct verb before ‘कह।’
  - severity: low
    issue: Footnote b is anchored only after ‘करके,’ although its stated alternative concerns the participial crossing clause as a whole.
    rationale: Moving the anchor to the end of the clause gives it a clear and grammatically coherent scope.
