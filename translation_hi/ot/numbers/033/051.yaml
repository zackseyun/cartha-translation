- source_word: כִּי
  choice: जब
  rationale: यहाँ आगामी निर्देश की भूमिका में कृदंत के भावी/आसन्न अर्थ के साथ समयसूचक संबंध व्यक्त करता है; हिन्दी में ‘जब’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: אַתֶּם עֹבְרִים
  choice: तुम ... पार करके ... प्रवेश करोगे
  rationale: सर्वनाम और कृदंत आगामी/आसन्न पारगमन बताते हैं। हिन्दी में ‘जब ... प्रवेश करोगे’ इस भाव को सहज रूप से व्यक्त करता है; वर्तमान या आसन्न रूप पादटिप्पणी में सुरक्षित है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी का प्रचलित व्यक्तिवाचक नाम; प्रसंग में ‘नदी’ जोड़ना आवश्यक नहीं है।
- source_word: אֶל אֶרֶץ כְּנָעַן
  choice: कनान देश में प्रवेश करोगे
  rationale: אֶל की गंतव्य-दिशा और אֶרֶץ दोनों को स्पष्ट करता है तथा यरदन पार करके उस देश के भीतर जाने का आशय स्वाभाविक हिन्दी में देता है।
