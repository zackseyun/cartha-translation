  language: hi
  text: उन्होंने हत्सेरोत से कूच किया और रित्मा में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने … कूच किया
  rationale: जंगल की यात्रा-सूची में נסע का अर्थ पड़ाव छोड़कर आगे यात्रा आरम्भ करना है। ‘कूच किया’ आधुनिक हिन्दी में इस गति और प्रस्थान को संक्षेप में व्यक्त करता है।
- source_word: מֵחֲצֵרֹת
  choice: हसेरोत से
  rationale: מִן उपसर्ग स्रोत-बिंदु ‘से’ बताता है; स्थान-नाम חֲצֵרֹת का हिन्दी लिप्यंतरण ‘हसेरोत’ रखा गया है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה यात्रा-वृत्तांत में शिविर लगाने या पड़ाव करने का सामान्य क्रिया-पद है। ‘डेरा डाला’ सहज, स्पष्ट और वर्तमान हिन्दी में प्रचलित है।
- source_word: בְּרִתְמָה
  choice: रित्मा में
  rationale: בְּ स्थान सूचित करता है, इसलिए ‘में’ स्वाभाविक है; רִתְמָה को स्थान-नाम के रूप में ‘रित्मा’ लिप्यंतरित किया गया है।
