  register: संक्षिप्त यात्रा-सूची की शैली सुरक्षित रखी गई है। भाषा आधुनिक, सहज और गरिमापूर्ण है; स्थान-नाम अनूदित न करके देवनागरी में लिप्यंतरित किए गए हैं।
