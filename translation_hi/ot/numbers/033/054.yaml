  text: וְ/הִתְנַחַלְתֶּם֩ אֶת הָ/אָ֨רֶץ בְּ/גוֹרָ֜ל לְ/מִשְׁפְּחֹֽתֵי/כֶ֗ם לָ/רַ֞ב תַּרְבּ֤וּ אֶת נַחֲלָת/וֹ֙ וְ/לַ/מְעַט֙ תַּמְעִ֣יט אֶת נַחֲלָת֔/וֹ אֶל֩ אֲשֶׁר יֵ֨צֵא ל֥/וֹ שָׁ֛מָּ/ה הַ/גּוֹרָ֖ל ל֣/וֹ יִהְיֶ֑ה לְ/מַטּ֥וֹת אֲבֹתֵי/כֶ֖ם תִּתְנֶחָֽלוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/054.yaml
  text: You shall apportion the land by lot according to your clans. To the larger group you shall increase its inheritance[a], and to the smaller you shall reduce its inheritance. Wherever the lot falls for anyone, that shall be his. You shall receive your inheritances according to the tribes of your fathers.
translation:
  language: hi
  text: तुम चिट्ठी डालकर अपने कुलों के अनुसार भूमि को विरासत के रूप में बाँट लेना। जो कुल बड़ा हो, उसकी विरासत बढ़ाना, और जो छोटा हो, उसकी विरासत घटाना। जिसके लिए चिट्ठी जहाँ निकले, वह स्थान उसी का हो।[a] तुम अपने पैतृक गोत्रों के अनुसार अपनी-अपनी विरासत पाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “जिसके लिए चिट्ठी जिस स्थान के लिए निकले, वह स्थान उसका हो।”'
    reason: हिब्रू की स्थानसूचक रचना और एकवचन सर्वनाम का अधिक औपचारिक विकल्प देना।
lexical_decisions:
- source_word: וְהִתְנַחַלְתֶּם
  choice: विरासत के रूप में बाँट लेना
  rationale: हित्पएल रूप यहाँ भूमि को कुलों में बाँटकर विरासत में ग्रहण करने की सामूहिक प्रक्रिया बताता है; यह अनुवाद वितरण और विरासत, दोनों भावों को रखता है।
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: גורל भूमि-विभाजन का निर्णय करने के लिए डाली गई चिट्ठी है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट प्रयोग है।
- source_word: לְמִשְׁפְּחֹתֵיכֶם
  choice: अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ एकल परिवार नहीं, गोत्र के भीतर का विस्तृत सामाजिक समूह है; ‘कुल’ इस स्तर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָרַב ... וְלַמְעַט
  choice: जो कुल बड़ा हो ... जो छोटा हो
  rationale: सन्दर्भ में तुलना समूहों की जनसंख्या के अनुसार है। ‘बड़ा’ और ‘छोटा’ संक्षिप्त हैं और भूमि के आकार के बजाय कुल के आकार को व्याकरणतः स्पष्ट रखते हैं।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: נַחֲלָה वाचा के अंतर्गत मिली पैतृक भूमि के लिए प्रयुक्त मुख्य शब्द है; ‘विरासत’ इसके धर्मवैधानिक और भूमि-संबंधी भाव को बनाए रखती है।
- source_word: אֶל אֲשֶׁר יֵצֵא לוֹ שָׁמָּה הַגּוֹרָל לֹו יִהְיֶה
  choice: जिसकी चिट्ठी जहाँ निकले, वही भाग उसका होगा
  rationale: यह चिट्ठी निकलने की हिब्रू अभिव्यक्ति और निर्दिष्ट स्थान के उस व्यक्ति या समूह का होने—दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: לְמַטּוֹת אֲבֹתֵיכֶם
  choice: अपने पितरों के गोत्रों के अनुसार
  rationale: מַטּוֹת इस सन्दर्भ में इस्राएल के जनजातीय विभाग हैं और אֲבֹתֵיכֶם पैतृक वंश को सूचित करता है; पारंपरिक किन्तु बोधगम्य ‘पितरों के गोत्र’ दोनों तत्वों को सुरक्षित रखता है।
- source_word: תִּתְנֶחָלוּ
  choice: अपनी-अपनी विरासत पाना
  rationale: अंतिम हित्पएल रूप भूमि को विरासत के रूप में प्राप्त करने का आदेश समेटता है; ‘अपनी-अपनी’ विभिन्न गोत्रों के वितरणात्मक भाव को स्पष्ट करता है।
