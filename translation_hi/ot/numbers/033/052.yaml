source:
  edition: WLC
  text: וְ/ה֨וֹרַשְׁתֶּ֜ם אֶת כָּל יֹשְׁבֵ֤י הָ/אָ֨רֶץ֙ מִ/פְּנֵי/כֶ֔ם וְ/אִ֨בַּדְתֶּ֔ם אֵ֖ת כָּל מַשְׂכִּיֹּתָ֑/ם וְ/אֵ֨ת כָּל צַלְמֵ֤י מַסֵּֽכֹתָ/ם֙ תְּאַבֵּ֔דוּ וְ/אֵ֥ת כָּל בָּמֹתָ֖/ם תַּשְׁמִֽידוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/052.yaml
  text: and you shall drive out all the inhabitants of the land from before you[a], and you shall destroy all their figured stones, and all their cast-metal images you shall destroy[b], and all their high places you shall demolish.
translation:
  language: hi
  text: और तुम देश के सभी निवासियों को अपने सामने से निकाल देना। उनके सभी आकृतियों वाले पत्थरों[a] को नष्ट कर देना, उनकी ढली हुई धातु की सभी मूर्तियों[b] को नष्ट कर देना, और उनके सभी ऊँचे उपासना-स्थलों को ढा देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी सभी नक्काशीदार प्रतिमाएँ”; इब्रानी शब्द आकृतियों वाली वस्तुओं को सूचित करता है, पर उनका सटीक रूप और पदार्थ विवादित है।
    reason: lexical_alternative
  - marker: b
    text: या “उनकी सभी ढली हुई धातु की मूर्तियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: निकाल देना
  rationale: हिफ़ील रूप यहाँ देश के वर्तमान निवासियों को वहाँ से हटाने अथवा उनका अधिकार छुड़ाने का भाव देता है। “निकाल देना” आधुनिक हिन्दी में स्वाभाविक है और מִפְּנֵיכֶם के साथ ठीक बैठता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: देश के सभी निवासी
  rationale: कृदन्तीय पद देश में रहने वाले लोगों को सूचित करता है; यह संक्षिप्त, स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: מִפְּנֵיכֶם
  choice: अपने सामने से
  rationale: इब्रानी मुहावरे की स्थानगत छवि को बनाए रखता है और हिन्दी में समझने योग्य है।
- source_word: וְאִבַּדְתֶּם / תְּאַבֵּדוּ
  choice: नष्ट कर देना
  rationale: दोनों रूप उपासना से जुड़ी वस्तुओं के पूर्ण विनाश की आज्ञा देते हैं। पुनरावृत्ति मूल पाठ के बल को बनाए रखती है।
- source_word: מַשְׂכִּיֹּתָם
  choice: उनके सभी चित्रित पत्थर
  rationale: यह शब्द उकेरी या चित्रित आकृतियों वाली वस्तुओं को सूचित करता है, जिन्हें प्रायः पत्थर से जोड़ा जाता है; वस्तु का सटीक रूप और पदार्थ अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: צַלְמֵי מַסֵּכֹתָם
  choice: उनकी ढली हुई धातु की सभी मूर्तियाँ
  rationale: צֶלֶם प्रतिमा या मूर्ति और מַסֵּכָה साँचे में ढली धातु की वस्तु को सूचित करता है। यह अनुवाद वस्तु और उसके निर्माण की विधि दोनों स्पष्ट करता है।
- source_word: בָּמֹתָם
  choice: उनके सभी ऊँचे पूजा-स्थल
  rationale: בָּמוֹת ऊँचाइयों पर या ऊँचे मंचों से जुड़े उपासना-स्थलों का पारिभाषिक शब्द है। “पूजा-स्थल” जोड़ने से आधुनिक पाठक के लिए इसका धार्मिक अर्थ स्पष्ट होता है।
- source_word: תַּשְׁמִידוּ
  choice: ढा देना
  rationale: यहाँ क्रिया व्यक्तियों पर नहीं, पूजा-स्थलों पर लागू होती है; “ढा देना” उनके पूर्ण विध्वंस का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: कनानी निवासियों और उनके उपासना-संबंधी साधनों के विषय में आज्ञाएँ
  choice: निवासियों को निकालने तथा उनकी मूर्तियों और पूजा-स्थलों को नष्ट करने की आज्ञाओं को स्पष्ट और सीधे रूप में रखा गया है।
  alternative: पहली आज्ञा को केवल संपत्ति-अधिकार छुड़ाने के अर्थ में नरम करना, या विशिष्ट उपासना-वस्तुओं को सामान्यतः ‘मूर्तिपूजक प्रथाएँ’ कहना।
  rationale: इब्रानी पाठ निवासियों को हटाने और विशिष्ट धार्मिक वस्तुओं तथा स्थलों को मिटाने—दोनों की स्पष्ट आज्ञा देता है। अनुवाद इसकी कठोरता को न तो कम करता है, न पद से बाहर कोई धार्मिक औचित्य जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। आज्ञार्थक “कर देना/ढा देना” बहुवचन ‘तुम’ के संदर्भ में स्वाभाविक हिन्दी है। मूल पाठ की क्रियात्मक पुनरावृत्ति और धार्मिक वस्तुओं के अलग-अलग वर्ग सुरक्षित रखे गए हैं।
