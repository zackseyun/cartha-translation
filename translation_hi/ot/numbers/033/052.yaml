  naturalness: The register is modern and clear. “आकृतियों वाले पत्थर” is more idiomatic and less misleading than “चित्रित पत्थर.” “ऊँचे उपासना-स्थल” is a natural rendering of the established cultic term “high places.”
  terminology: “ढली हुई धातु की मूर्तियाँ” accurately distinguishes the cast-metal images from the preceding disputed objects. The footnote is revised to retain the lexical uncertainty and to provide a coherent alternative without an internal punctuation/quotation irregularity.
