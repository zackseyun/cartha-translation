base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/044.yaml
  text: They set out from Oboth and camped at Iye-abarim[a], on the border of Moab.
translation:
  language: hi
  text: उन्होंने ओबोत से प्रस्थान किया और मोआब की सीमा पर इय्ये-अबारीम[a] में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इये-अबारीम”; इब्रानी स्थान-नाम के घटकों का संबंध “खंडहरों” और “अबारीम/पार के क्षेत्रों” से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से प्रस्थान किया
  rationale: जंगल-यात्रा के क्रम में נסע का अर्थ पड़ाव छोड़कर आगे चलना है। ‘प्रस्थान किया’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इस यात्रा-सूत्र को व्यक्त करता है।
- source_word: מֵאֹבֹת
  choice: ओबोत से
  rationale: מֵ स्रोत या आरम्भ-स्थान बताता है और אֹבֹת स्थान-नाम है; इसलिए नाम का लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: חנה यात्रा के दौरान शिविर लगाने या ठहरने का सामान्य क्रिया-पद है। ‘पड़ाव डाला’ हिन्दी में यात्रा-वृत्तांत के लिए स्वाभाविक है और ठहरकर डेरा लगाने का ठोस भाव रखता है।
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: इय्ये-अबारीम में
  rationale: यह पद यात्रा-सूची में स्थान-नाम के रूप में कार्य करता है। इसके घटकों का संबंध ‘खंडहरों/ढेरों’ और ‘अबारीम/पार के क्षेत्रों’ से हो सकता है, पर मुख्य पाठ में अर्थ थोपने के बजाय लिप्यंतरण रखा गया है।
- source_word: בִּגְבוּל
  choice: की सीमा पर
  rationale: גְּבוּל का अर्थ सीमा, सीमांत या क्षेत्र हो सकता है। यहाँ ‘सीमा पर’ यात्रा-सूचना के लिए सीधा अर्थ देता है और यह अनावश्यक रूप से नहीं कहता कि पड़ाव मोआब के भीतर बहुत दूर था।
- source_word: מוֹאָב
  choice: मोआब
  rationale: स्थान और जनसमूह के इस नाम का हिन्दी में प्रचलित लिप्यंतरण।
