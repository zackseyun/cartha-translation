  text: They set out from Ezion-geber and camped in the wilderness of Zin (that is[a], Kadesh).
translation:
  language: hi
  text: उन्होंने एस्योन-गेबेर से कूच किया और सीन के निर्जन प्रदेश में डेरा डाला—वही[a] कादेश है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कादेश है।” इब्रानी सर्वनाम इस स्थान की पहचान कादेश के रूप में कराता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... कूच किया
  rationale: गिनती 33 की यात्रा-सूची में נסע का अर्थ डेरा उठाकर आगे बढ़ना है; आधुनिक हिन्दी में ‘कूच किया’ इस सूत्र को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵעֶצְיוֹן גָּבֶר
  choice: एस्योन-गेबेर से
  rationale: स्थान-नाम का अनुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה का ठोस अर्थ किसी स्थान पर पड़ाव डालना है; ‘डेरा डाला’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: בְמִדְבַּר צִן
  choice: सीन के निर्जन प्रदेश में
  rationale: מִדְבָּר आवश्यकतः रेतीले मरुस्थल को नहीं दर्शाता; ‘निर्जन प्रदेश’ भू-आकृति को अनावश्यक रूप से सीमित किए बिना उजाड़ क्षेत्र का भाव रखता है।
- source_word: הִוא
  choice: वही
  rationale: स्त्रीलिंग सर्वनाम पूर्ववर्ती भौगोलिक अभिव्यक्ति की पहचान कादेश के रूप में कराता है। ‘वही’ इस पहचान को संक्षेप में रखता है, जबकि पादटिप्पणी वैकल्पिक वाक्य-संबंध स्पष्ट करती है।
- source_word: קָדֵשׁ
  choice: कादेश
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबिलीय लिप्यंतरण रखा गया है।
