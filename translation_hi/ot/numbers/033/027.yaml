  text: वे ताहत से कूच करके तेरह में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चले
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ डेरा उठाकर आगे चलना है। संक्षिप्त हिंदी प्रयोग “से चले” इस यात्रा-क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִתָּחַת
  choice: ताहत से
  rationale: उपसर्ग מִן का अर्थ “से” है; स्थान-नाम תָּחַת का निकट देवनागरी लिप्यंतरण “ताहत” रखा गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: पड़ाव-वर्णन में חנה का अर्थ शिविर लगाना या ठहरना है। “डेरा डाला” आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: בְּתָרַח
  choice: तेरह में
  rationale: पड़ाव के स्थान के साथ בְּ स्थान-सूचक है और हिंदी में स्वाभाविक रूप से “में” आता है; תָּרַח का लिप्यंतरण “तेरह” है।
