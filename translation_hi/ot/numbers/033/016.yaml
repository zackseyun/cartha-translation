base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/016.yaml
  text: They set out from the wilderness of Sinai and camped at Kibroth-hattaavah[a].
translation:
  language: hi
  text: वे सीनै के निर्जन प्रदेश से चले और किब्रोत-हत्तावाह[a] में डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “किब्रोत-हत्तावाह” का अर्थ है “लालसा की कब्रें।”
    reason: स्थान-नाम के निहित शाब्दिक अर्थ को सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: कूच करके
  rationale: जंगल-यात्रा के पड़ाव-वर्णन में נסע का अर्थ किसी स्थान से आगे की यात्रा के लिए निकलना है। ‘कूच करना’ इस बार-बार आने वाले सूत्र को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: מִמִּדְבַּר סִינַי
  choice: सीनै के निर्जन प्रदेश से
  rationale: מִדְבָּר निर्जन, कम आबाद भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ हिंदी में अर्थ को स्पष्ट रखता है और ‘सीनै के’ से मूल संबंध सुरक्षित रहता है।
- source_word: וַיַּחֲנוּ
  choice: छावनी डालकर ठहरे
  rationale: חנה का अर्थ पड़ाव डालना या शिविर लगाकर ठहरना है। यह अभिव्यक्ति यात्रा-वृत्तांत के संदर्भ में स्वाभाविक है और केवल तंबू लगाने से अधिक, वहाँ ठहरने का भाव भी देती है।
- source_word: בְּקִבְרֹת הַתַּאֲוָה
  choice: किब्रोत-हत्तावा में
  rationale: यहाँ पद स्थान-नाम के रूप में प्रयुक्त है, इसलिए मुख्य पाठ में उसका लिप्यंतरण रखा गया है। नाम का शाब्दिक अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। यात्रा-सूत्र की संक्षिप्तता बनाए रखते हुए ‘छावनी डालकर ठहरे’ से חנה का पूरा भाव व्यक्त किया गया है।
