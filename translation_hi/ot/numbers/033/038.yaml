  rationale: चतुरक्षरीय परमेश्वर-नाम को हिन्दी में परिचित व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
