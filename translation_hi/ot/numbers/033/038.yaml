- source_word: לְצֵאת בְּנֵי־יִשְׂרָאֵל
  choice: इस्राएलियों को ... से निकले
  rationale: לְצֵאת यहाँ निर्गमन को काल-गणना का आरंभ-बिंदु बनाता है; ‘इस्राएलियों’ से राष्ट्रीय समुदाय का भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: מֵאֶרֶץ מִצְרַיִם
  choice: मिस्र देश से
  rationale: ‘देश’ को रखकर אֶרֶץ का अर्थ संरक्षित किया गया है और हिन्दी वाक्य सहज बना है।
- source_word: בַּחֹדֶשׁ הַחֲמִישִׁי
  choice: पाँचवें महीने
  rationale: पंचांग-संबंधी वाक्यांश का सीधा और स्पष्ट अनुवाद।
- source_word: בְּאֶחָד לַחֹדֶשׁ
  choice: महीने के पहले दिन
  rationale: इब्रानी तिथि-सूत्र को आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ को चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: עַל־פִּי יְהוָה में आज्ञा और वचन का संबंध
  choice: यहोवा की आज्ञा के अनुसार
  alternative: यहोवा के वचन के अनुसार
  rationale: मुहावरे का प्रसंगगत अर्थ दिव्य आदेश के अनुपालन को दर्शाता है। वैकल्पिक ‘वचन’ को पादटिप्पणी में रखा गया है ताकि मूल अभिव्यक्ति की व्यापकता और शाब्दिक चित्र दोनों सुरक्षित रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। काल-सूचना को पठनीय बनाने के लिए अलग वाक्य में रखा गया है; मूल की सभी घटनात्मक और तिथि-संबंधी सूचनाएँ सुरक्षित हैं।
