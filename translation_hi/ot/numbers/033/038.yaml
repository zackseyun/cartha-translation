base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/038.yaml
  text: And Aaron the priest went up Mount Hor at the command of Yahweh[a], and he died there, in the fortieth year after the Israelites came out from the land of Egypt, in the fifth month, on the first day of the month.
translation:
  language: hi
  text: याजक हारून याहवे की आज्ञा के अनुसार[a] होर पर्वत पर चढ़ा और वहीं मर गया। उसकी मृत्यु इस्राएलियों के मिस्र देश से निकलने के चालीसवें वर्ष के पाँचवें महीने के पहले दिन हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के वचन के अनुसार”; शाब्दिक रूप से, “याहवे के मुँह के अनुसार।”
    reason: עַל־פִּי יְהוָה के मुहावरेदार अर्थ और उसके शाब्दिक रूप को दर्ज करता है।
