  text: וַ/יִּסְע֖וּ מֵֽ/הַר שָׁ֑פֶר וַֽ/יַּחֲנ֖וּ בַּ/חֲרָדָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/024.yaml
  text: They set out from Mount Shepher and camped at Haradah[a].
translation:
  language: hi
  text: फिर वे शापेर पर्वत से चल पड़े और हरादा में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से चल पड़े
  rationale: निर्गमन/जंगल-यात्रा की पड़ाव-सूची में נסע एक पड़ाव से प्रस्थान को व्यक्त करता है। ‘चल पड़े’ आधुनिक और स्वाभाविक है; ‘फिर’ कथानुक्रम को स्पष्ट करता है।
- source_word: מֵהַר שָׁפֶר
  choice: शापेर पर्वत से
  rationale: מִן + הַר का अर्थ ‘पर्वत से’ है। שָׁפֶר स्थान-नाम है, इसलिए उसका अनुवाद करने के बजाय हिब्रू स्वरांकन के निकट ‘शापेर’ लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: पड़ाव-सूची में חנה का अर्थ किसी स्थान पर शिविर लगाना है। ‘डेरा डाला’ सामान्य आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בַּחֲרָדָה
  choice: हरादा में
  rationale: בְּ यहाँ यात्रा के अगले पड़ाव का स्थान बताता है। חֲרָדָה को स्थान-नाम मानकर ‘हरादा’ लिप्यंतरित किया गया है।
theological_decisions: []
translation_notes:
  register: संक्षिप्त यात्रा-वृत्तांत की सूत्रबद्ध शैली बनाए रखते हुए आधुनिक, सहज और गरिमापूर्ण हिन्दी प्रयुक्त हुई है। स्थान-नाम सीधे हिब्रू स्वरांकन के आधार पर देवनागरी में लिप्यंतरित किए गए हैं।
