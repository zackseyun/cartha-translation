  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज यात्रा-वृत्तांत शैली रखी गई है। स्थाननामों का लिप्यंतरण किया गया है और मूल वाक्य की क्रमिक संरचना सुरक्षित रखी गई है।
