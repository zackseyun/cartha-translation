  text: וַ/יִּסְעוּ֙ מִ/מָּרָ֔ה וַ/יָּבֹ֖אוּ אֵילִ֑מָ/ה וּ֠/בְ/אֵילִם שְׁתֵּ֣ים עֶשְׂרֵ֞ה עֵינֹ֥ת מַ֛יִם וְ/שִׁבְעִ֥ים תְּמָרִ֖ים וַ/יַּחֲנוּ שָֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/009.yaml
  text: They set out from Marah and came to Elim. At Elim there were twelve springs of water and seventy palm trees, and they camped there.
translation:
  language: hi
  text: वे मारा से चल पड़े और एलीम पहुँचे। एलीम में पानी के बारह सोते और खजूर के सत्तर पेड़ थे, और उन्होंने वहीं डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चल पड़े
  rationale: यात्रा-वृत्तांत में נסע का अर्थ डेरा उठाकर आगे बढ़ना है; ‘चल पड़े’ आधुनिक और स्वाभाविक हिन्दी में इस गति को व्यक्त करता है।
- source_word: מִמָּרָה
  choice: मारा से
  rationale: स्थाननाम को अनूदित करने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: וַיָּבֹאוּ
  choice: और ... पहुँचे
  rationale: בוא यहाँ गन्तव्य तक आने या पहुँचने का बोध देता है; हिन्दी कथन में ‘पहुँचे’ सबसे स्वाभाविक है।
- source_word: אֵילִמָה / בְאֵילִם
  choice: एलीम पहुँचे / एलीम में
  rationale: पहला रूप दिशा या गन्तव्य बताता है और दूसरा स्थान; हिन्दी में क्रमशः ‘एलीम पहुँचे’ और ‘एलीम में’ स्वाभाविक हैं।
- source_word: שְׁתֵּים עֶשְׂרֵה
  choice: बारह
  rationale: मूल संख्या का सीधा और सामान्य हिन्दी रूप।
- source_word: עֵינֹת מַיִם
  choice: पानी के ... सोते
  rationale: עַיִן यहाँ प्राकृतिक जलस्रोत या सोता है; ‘सोते’ कुओं की अपेक्षा मूल अर्थ को अधिक ठीक व्यक्त करता है।
- source_word: וְשִׁבְעִים
  choice: और ... सत्तर
  rationale: मूल संख्या और उसके संयोजक का सीधा हिन्दी रूप।
- source_word: תְּמָרִים
  choice: खजूर के ... पेड़
  rationale: תָּמָר खजूर के वृक्ष को सूचित करता है; ‘खजूर के पेड़’ सामान्य हिन्दी पाठक के लिए स्पष्ट और स्वाभाविक है।
- source_word: וַיַּחֲנוּ שָׁם
  choice: और उन्होंने वहीं डेरा डाला
  rationale: חנה यात्रा-वृत्तांत में पड़ाव डालने के अर्थ में है; ‘डेरा डाला’ आधुनिक हिन्दी में सहज है और שָׁם को ‘वहीं’ स्पष्ट रूप से व्यक्त करता है।
