  text: वे आलूश से चले और रपीदीम में डेरा डाला, पर वहाँ लोगों के पीने के लिए पानी नहीं था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: कूच करके
  rationale: निर्गमन-यात्रा की सूची में נסע का अर्थ पड़ाव छोड़कर आगे बढ़ना है। ‘कूच करना’ इस यात्रा-सूत्र को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: מֵאָלוּשׁ
  choice: आलूश से
  rationale: स्थान-नाम को अनुवाद करने के बजाय हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाले
  rationale: חנה यात्रा के दौरान किसी स्थान पर शिविर लगाने या ठहरने का सामान्य क्रियापद है; ‘डेरा डालना’ आधुनिक हिन्दी में सहज है।
- source_word: בִּרְפִידִם
  choice: रपीदीम में
  rationale: स्थान-नाम को हिब्रू उच्चारण के निकट लिप्यंतरित किया गया है; हिन्दी में पड़ाव के स्थान के साथ ‘में’ स्वाभाविक है।
- source_word: וְלֹא הָיָה שָׁם
  choice: पर वहाँ ... नहीं था
  rationale: वाव यहाँ पिछले कथन के विपरीत प्रतिकूल परिस्थिति प्रस्तुत करता है, इसलिए ‘पर’ संदर्भगत संबंध को स्पष्ट करता है।
- source_word: מַיִם
  choice: पानी
  rationale: מים का सामान्य और सहज आधुनिक हिन्दी समतुल्य ‘पानी’ है।
- source_word: לָעָם
  choice: लोगों के
  rationale: עם यहाँ इस्राएली लोगों को सामूहिक रूप से दर्शाता है; संदर्भ में ‘लोगों’ स्पष्ट और स्वाभाविक है।
- source_word: לִשְׁתּוֹת
  choice: पीने के लिए
  rationale: यह उद्देश्य सूचक infinitive है और पानी के अभाव का प्रयोजन-संबंध स्पष्ट करता है।
