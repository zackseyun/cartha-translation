source:
  edition: WLC
  text: אֵ֜לֶּה מַסְעֵ֣י בְנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֥ר יָצְא֛וּ מֵ/אֶ֥רֶץ מִצְרַ֖יִם לְ/צִבְאֹתָ֑/ם בְּ/יַד מֹשֶׁ֖ה וְ/אַהֲרֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/001.yaml
  text: These are the stages of the journey of the sons of Israel[a], who went out from the land of Egypt by their companies[d][c][b], under the hand of Moses and Aaron.
translation:
  language: hi
  text: ये इस्राएलियों की यात्रा के पड़ाव हैं[a], जो मिस्र देश से अपने दलों के अनुसार[c] मूसा और हारून की अगुवाई में निकले थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रस्थान” अथवा “यात्राएँ।” इब्रानी शब्द यात्रा के क्रमिक चरणों या पड़ावों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मूसा और हारून के हाथ से।” यह इब्रानी मुहावरा उनकी अगुवाई या उनके माध्यम से होने का अर्थ देता है।
    reason: cultural_note
  - marker: c
    text: या “अपनी सेनाओं के अनुसार” अथवा “अपने-अपने विभागों में।” इब्रानी शब्द में संगठित, यहाँ तक कि सैनिक, व्यवस्था का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה מַסְעֵי
  choice: ये ... यात्रा के पड़ाव हैं
  rationale: מַסְעֵי क्रमिक प्रस्थान-स्थलों अथवा यात्रा-पड़ावों की सूची को सूचित करता है; ‘यात्रा के पड़ाव’ आधुनिक हिन्दी में इस भाव को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे समुदाय का प्रचलित जातीय नाम है; ‘इस्राएली’ स्त्री-पुरुष सहित समुदाय को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר יָצְאוּ מֵאֶרֶץ מִצְרַיִם
  choice: जो ... मिस्र देश से निकले थे
  rationale: ‘मिस्र देश’ मूल के אֶרֶץ को बनाए रखता है, और ‘निकले थे’ सूची के आरम्भ से पहले हुई घटना को हिन्दी में स्वाभाविक रूप देता है।
- source_word: לְצִבְאֹתָם
  choice: अपने दलों के अनुसार
  rationale: צָבָא संगठित समूह, सेना या विभाग का अर्थ दे सकता है। प्रसंग में ‘दल’ संगठन का भाव रखता है, पर अनावश्यक रूप से युद्धरत सेना का अर्थ नहीं थोपता।
- source_word: בְּיַד מֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून के हाथ से
  rationale: मूल इब्रानी मुहावरे को बनाए रखा गया है; यह उनकी अगुवाई, साधनता या अधिकार के अधीन होने का भाव दे सकता है।
theological_decisions:
- issue: निर्गमन में मूसा और हारून की भूमिका
  choice: ‘के हाथ से’ मुहावरे को मुख्य पाठ में बनाए रखना
  alternative: ‘की अगुवाई में’
  rationale: मूल अभिव्यक्ति अगुवाई और साधनता दोनों का संकेत दे सकती है; केवल ‘अगुवाई में’ कहना अर्थ को अनावश्यक रूप से सीमित कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि ‘के हाथ से’ जैसे अर्थपूर्ण इब्रानी मुहावरे को टिप्पणी सहित सुरक्षित रखा गया है।
