source:
  edition: WLC
  text: וַ/יִּכְתֹּ֨ב מֹשֶׁ֜ה אֶת מוֹצָאֵי/הֶ֛ם לְ/מַסְעֵי/הֶ֖ם עַל פִּ֣י יְהוָ֑ה וְ/אֵ֥לֶּה מַסְעֵי/הֶ֖ם לְ/מוֹצָאֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/002.yaml
  text: Moses wrote down their starting points according to their journeys at the command of Yahweh[c][b][a], and these were their journeys according to their starting points.
translation:
  language: hi
  text: मूसा ने यहोवा की आज्ञा से उनकी यात्राओं के अनुसार उनके प्रस्थान-स्थलों को लिखा[a][b]; और ये उनके प्रस्थान-स्थलों के अनुसार उनकी यात्राएँ थीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘यहोवा के मुख के अनुसार’; यह ‘यहोवा की आज्ञा से’ के अर्थ का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘प्रस्थान-स्थलों’ का अनुवाद ‘उनके प्रस्थान’ या ‘उनके निकलने के स्थान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'इस पद में दोनों पदों का क्रम जानबूझकर उलट दिया गया है: ‘यात्राओं के अनुसार प्रस्थान-स्थल’ ... ‘प्रस्थान-स्थलों के अनुसार यात्राएँ।’'
    reason: literary_structure
lexical_decisions:
- source_word: וַיִּכְתֹּב
  choice: लिख लिया
  rationale: क्रिया भूतकालीन कथात्मक घटना बताती है; ‘लिख लिया’ अभिलेख तैयार करने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מוֹצָאֵיהֶם
  choice: उनके प्रस्थान-स्थान
  rationale: מוֹצָא निकलने की क्रिया या निकलने के स्थान को सूचित कर सकता है। यात्रा-विवरण में ‘प्रस्थान-स्थान’ ठोस पड़ावों को स्पष्ट करता है और दूसरी अर्ध-पंक्ति के साथ समानता बनाए रखता है।
- source_word: מַסְעֵיהֶם
  choice: उनकी यात्राएँ
  rationale: מַסָּע डेरे से प्रस्थान, यात्रा या यात्रा-चरण को सूचित करता है; सामान्य पाठक के लिए ‘यात्राएँ’ सहज है, जबकि चरणबद्ध क्रम संदर्भ से स्पष्ट होता है।
- source_word: לְמַסְעֵיהֶם / לְמוֹצָאֵיהֶם
  choice: उनकी यात्राओं के अनुसार / उनके प्रस्थान-स्थानों के अनुसार
  rationale: सम्बन्धसूचक ל को ‘के अनुसार’ से व्यक्त किया गया है, जिससे मूल की जानबूझकर की गई उलटी समानांतर रचना सुरक्षित रहती है।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा की आज्ञा से
  rationale: עַל־פִּי का शाब्दिक अर्थ ‘मुख के अनुसार’ है, पर यहाँ यह आज्ञा या निर्देश का मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुराक्षरीय दिव्य नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְאֵלֶּה
  choice: और ये ... थीं
  rationale: प्रदर्शनवाचक पद आगे आने वाली सूची का परिचय देता है; हिन्दी में स्त्रीलिंग बहुवचन क्रिया ‘थीं’ ‘यात्राएँ’ से मेल खाती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘प्रस्थान-स्थान’ थोड़ा औपचारिक है, पर यात्रा-सूची के संदर्भ में सटीक और स्पष्ट है। मूल की उलटी समानांतर संरचना को सहजता के लिए हटाया नहीं गया।
