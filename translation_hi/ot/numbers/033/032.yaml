  yaml_path: translation/ot/numbers/033/032.yaml
  text: They set out from Bene-jaakan and camped at Hor-haggidgad[a].
translation:
  language: hi
  text: उन्होंने बेने-याकान[a] से कूच किया और होर-हग्गिदगाद में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेने-याकान’ सम्भवतः एक स्थान का नाम है, हालाँकि इब्रानी में इसका शाब्दिक अर्थ ‘याकान के पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से कूच किया
  rationale: जंगल-यात्रा की सूची में נסע एक पड़ाव से प्रस्थान करने के लिए प्रयुक्त है। ‘कूच किया’ इस यात्रा-सूत्र को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: מִבְּנֵי יַעֲקָן
  choice: बेने-याकान से
  rationale: यहाँ यह यात्रा-विवरण में स्थान-नाम के रूप में कार्य करता है; इसलिए शाब्दिक अर्थ ‘याकान के पुत्रों’ के बजाय लिप्यंतरण उपयुक्त है। מִן का अर्थ ‘से’ है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: חנה यात्रा-विवरण का मानक क्रियापद है, जिसका आशय शिविर लगाकर ठहरना है। ‘पड़ाव डाला’ आधुनिक हिन्दी में इस प्रसंग के लिए स्वाभाविक है।
- source_word: בְּחֹר הַגִּדְגָּד
  choice: होर-हग्गिदगाद में
  rationale: यह स्थान-नाम है, इसलिए इसका लिप्यंतरण किया गया है। בְּ स्थान सूचित करता है और यहाँ ‘में’ उपयुक्त है; הַ को संयुक्त नाम ‘हग्गिदगाद’ में बनाए रखा गया है।
