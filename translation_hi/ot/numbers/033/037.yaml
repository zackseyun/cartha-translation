  text: वे कादेश[a] से चले और एदोम देश के छोर पर स्थित होर पर्वत[b] पर डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ केवल ‘कादेश’ है; व्यापक प्रसंग के आधार पर कुछ अनुवाद इसे ‘कादेश-बर्ने’ लिखते हैं।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘होर, वह पर्वत’; परंपरागत रूप से इसका अनुवाद ‘होर पर्वत’ किया जाता है।
