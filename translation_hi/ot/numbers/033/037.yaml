lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से चल पड़े
  rationale: निर्गमन-यात्रा की सूची में נסע किसी पड़ाव से प्रस्थान करने को दर्शाता है। ‘चल पड़े’ स्वाभाविक आधुनिक हिन्दी है; ‘फिर’ कथानुक्रम को स्पष्ट करता है।
- source_word: מִקָּדֵשׁ
  choice: कादेश से
  rationale: मसोराई इब्रानी पाठ में केवल ‘कादेश’ है; इसलिए यहाँ ‘कादेश-बर्ने’ का विस्तार नहीं किया गया।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה यात्रा के दौरान किसी स्थान पर पड़ाव डालने की ठोस क्रिया है। ‘डेरा डाला’ सामान्य और सहज हिन्दी है।
- source_word: בְּהֹר הָהָר
  choice: होर पर्वत के पास
  rationale: इब्रानी संरचना का शाब्दिक रूप ‘होर, वह पर्वत’ है। हिन्दी में स्थापित और स्वाभाविक स्थान-नाम ‘होर पर्वत’ है; בְ को इस स्थल के संदर्भ में ‘के पास’ कहना सहज है।
- source_word: בִּקְצֵה
  choice: के छोर पर
  rationale: קצה किसी भूभाग के सिरे, छोर या सीमा-वर्ती भाग को सूचित करता है। ‘छोर पर’ स्थानगत अर्थ बनाए रखता है और औपचारिक राजनीतिक सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֶרֶץ אֱדוֹם
  choice: एदोम देश
  rationale: אֶרֶץ यहाँ एदोम के भूभाग को दर्शाता है। ‘एदोम देश’ सीधा, सुबोध और गरिमापूर्ण हिन्दी रूप है।
