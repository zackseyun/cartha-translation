  text: वे मक्हेलोत से चले और ताहत में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... कूच किया
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ एक पड़ाव से प्रस्थान करना है। ‘कूच किया’ आधुनिक हिन्दी में इस यात्रा-सूत्र को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: מִמַּקְהֵלֹת
  choice: मखेलोत से
  rationale: מִן उपसर्ग को ‘से’ अनूदित किया गया है और स्थान-नाम מַקְהֵלֹת को अनुवादित करने के बजाय हिन्दी ध्वन्यात्मक रूप ‘मखेलोत’ में लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: यात्रा-वृत्तांत में חנה अगले स्थान पर शिविर लगाने या ठहरने को दर्शाता है। ‘पड़ाव डाला’ इस प्रसंग में सहज, स्पष्ट हिन्दी है।
- source_word: בְּתָחַת
  choice: ताहत में
  rationale: בְּ को पड़ाव के स्थान के लिए ‘में’ कहा गया है और תָחַת को यहाँ सामान्य शब्द के अर्थ में नहीं, बल्कि स्थान-नाम मानकर ‘ताहत’ लिप्यंतरित किया गया है।
