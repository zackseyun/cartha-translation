  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद यात्रा-विवरण की सरल कथात्मक शैली बनाए रखता है; किसी व्याख्यात्मक या संप्रदायगत विस्तार को नहीं जोड़ा गया।
