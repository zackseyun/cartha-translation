  yaml_path: translation/ot/numbers/033/005.yaml
  text: The sons of Israel set out from Rameses and camped at Succoth[a][b].
translation:
  language: hi
  text: इस्राएल के पुत्र रामसेस से चल पड़े और सुक्कोत में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: चल पड़े
  rationale: נסע का यात्रा-विवरणों में अर्थ पड़ाव से आगे जाने के लिए प्रस्थान करना है। ‘चल पड़े’ आधुनिक और स्वाभाविक हिन्दी में इस गति को स्पष्ट करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है। यहाँ मूल अभिव्यक्ति को बनाए रखा गया है; संदर्भ में यह इस्राएली समुदाय का सामूहिक नाम है।
- source_word: מֵרַעְמְסֵס
  choice: रामसेस से
  rationale: उपसर्ग מִן प्रस्थान-बिंदु बताता है। स्थान-नाम רַעְמְסֵס का हिन्दी लिप्यंतरण ‘रामसेस’ रखा गया है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה का अर्थ पड़ाव डालना या शिविर लगाना है। ‘डेरा डाला’ यात्रा-विवरण के संदर्भ में सहज और स्पष्ट हिन्दी है।
- source_word: בְּסֻכֹּת
  choice: सुक्कोत में
  rationale: בְּ स्थान सूचित करता है। स्थान-नाम סֻכֹּת को अर्थानुवाद किए बिना ‘सुक्कोत’ के रूप में लिप्यंतरित किया गया है।
