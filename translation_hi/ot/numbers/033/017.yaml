    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे … से रवाना हुए
  rationale: जंगल की यात्रा-सूची में נסע किसी पड़ाव से प्रस्थान करने को दर्शाता है। ‘रवाना हुए’ आधुनिक, स्वाभाविक हिन्दी में इस क्रमसूचक अर्थ को स्पष्ट रखता है।
- source_word: מִקִּבְרֹת הַתַּאֲוָה
  choice: किब्रोत-हत्तावा से
  rationale: यह स्थान-नाम है, इसलिए इसका अर्थ मुख्य पाठ में रखने के बजाय लिप्यंतरित किया गया है; उपसर्ग מִן का अनुवाद ‘से’ है।
- source_word: וַיַּחֲנוּ
  choice: और … पड़ाव डाला
  rationale: यात्रा-वृत्तांत में חנה का अर्थ किसी स्थान पर डेरा लगाना है। ‘पड़ाव डाला’ यात्रा-सूची के संदर्भ में सहज और सटीक हिन्दी है।
- source_word: בַּחֲצֵרֹת
  choice: हसेरोत में
  rationale: स्थान-नाम को लिप्यंतरित किया गया है। उपसर्ग בְּ यहाँ शिविर लगाने के स्थान को बताता है, जिसे हिन्दी में स्वाभाविक रूप से ‘में’ कहा गया है।
