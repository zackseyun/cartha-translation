  text: वे इय्यीम से चले और दीबोन-गाद में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से कूच किया
  rationale: गिनती की यात्रा-सूची में נסע एक पड़ाव से प्रस्थान करने को दर्शाता है। ‘कूच किया’ स्वाभाविक और संक्षिप्त हिन्दी है तथा आगे बढ़ने का भाव बनाए रखता है।
- source_word: מֵעִיִּים
  choice: इय्यीम से
  rationale: उपसर्ग מֵ का अर्थ ‘से’ है। स्थान-नाम עִיִּים को अनुवादित करने के बजाय उसके हिब्रू उच्चारण के निकट ‘इय्यीम’ रूप में लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: यात्रा-विवरणों में חנה का अर्थ पड़ाव डालना या छावनी लगाना है। ‘डेरा डाला’ आधुनिक हिन्दी में सहज और मूलार्थ के अनुरूप है।
- source_word: בְּדִיבֹן גָּד
  choice: दीबोन-गाद में
  rationale: स्थान के साथ בְּ को यहाँ स्वाभाविक हिन्दी में ‘में’ कहा गया है। דִיבֹן גָּד को संबंधसूचक पदबंध के रूप में खोलने के बजाय संयुक्त स्थान-नाम ‘दीबोन-गाद’ रखा गया है।
