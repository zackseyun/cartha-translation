source:
  edition: WLC
  text: וּ/מִצְרַ֣יִם מְקַבְּרִ֗ים אֵת֩ אֲשֶׁ֨ר הִכָּ֧ה יְהוָ֛ה בָּ/הֶ֖ם כָּל בְּכ֑וֹר וּ/בֵ/אלֹ֣הֵי/הֶ֔ם עָשָׂ֥ה יְהוָ֖ה שְׁפָטִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/004.yaml
  text: while the Egyptians were burying those whom Yahweh had struck down among them[a], all the firstborn; and on their gods Yahweh had executed judgments.
translation:
  language: hi
  text: उस समय मिस्री उन सभी पहलौठों को दफ़ना रहे थे जिन्हें याहवे ने उनके बीच मार डाला था। और याहवे ने उनके देवताओं के विरुद्ध न्याय किया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे ने उनके देवताओं पर न्याय किया था।”
    reason: पूर्वसर्ग בְּ को यहाँ ‘के विरुद्ध’ अथवा अधिक शाब्दिक रूप से ‘पर’ समझा जा सकता है।
lexical_decisions:
- source_word: וּמִצְרַיִם מְקַבְּרִים
  choice: उस समय मिस्री ... दफ़ना रहे थे
  rationale: संज्ञा के साथ वाव और कृदंत बीती कथा में इस्राएल के प्रस्थान के समय चल रही पृष्ठभूमि की क्रिया बताते हैं; हिंदी में ‘उस समय ... दफ़ना रहे थे’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵת אֲשֶׁר ... כָּל בְּכוֹר
  choice: उन लोगों को जिन्हें ...—अर्थात सभी पहलौठों को
  rationale: हिब्रू में संबंधवाचक कर्म का स्पष्टीकरण बाद में ‘सभी पहलौठों’ के रूप में आता है। यह रचना उसी क्रम और व्याख्यात्मक बल को बनाए रखती है तथा अनावश्यक स्वामित्वसूचक ‘उनके’ नहीं जोड़ती।
- source_word: הִכָּה
  choice: मार डाला था
  rationale: נכה का मूल बिंब ‘मारना/प्रहार करना’ है; दफ़नाने और पहलौठों की विपत्ति के प्रसंग में यहाँ परिणाम मृत्यु है, जिसे ‘मार डाला’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम की देवनागरी लिप्यंतरण-रूप में प्रस्तुति की गई है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: בָּהֶם
  choice: उनके बीच
  rationale: बहुवचन व्यक्तिवाचक प्रत्यय के साथ בְּ यहाँ मिस्रियों के समुदाय के भीतर का भाव देता है।
- source_word: וּבֵאלֹהֵיהֶם
  choice: उनके देवताओं के विरुद्ध भी
  rationale: עשה שפטים के साथ בְּ विरोध या लक्ष्य का भाव दे सकता है; ‘के विरुद्ध’ हिंदी में स्पष्ट और मुहावरेदार है, जबकि पादटिप्पणी अधिक रूपगत ‘पर’ को सुरक्षित रखती है।
- source_word: עָשָׂה ... שְׁפָטִים
  choice: न्याय-दंड दिए थे
  rationale: यह मुहावरा न्याय के दंडात्मक कार्यों को पूरा करने का अर्थ देता है। ‘न्याय-दंड’ न्याय और दंड दोनों पहलुओं को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम सीधे आया है; ‘याहवे’ उसका आधुनिक हिंदी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: ‘उनके देवताओं’ का संदर्भ
  choice: मिस्रियों के देवता
  alternative: उनके शासक / उनकी मूर्तियाँ
  rationale: אֱלֹהֵיהֶם का सीधा अर्थ मिस्र के देवता है। पाठ के दावे को शासकों या केवल मूर्तियों के रूप में पुनर्व्याख्यायित नहीं किया गया।
- issue: देवताओं के संबंध में न्याय का लक्ष्य
  choice: देवताओं के विरुद्ध न्याय-दंड
  alternative: देवताओं पर न्याय-दंड
  rationale: בְּ लक्ष्य अथवा विरोध दोनों रूपों में व्यक्त हो सकता है। मुख्य पाठ स्वाभाविक हिंदी ‘के विरुद्ध’ चुनता है और अधिक रूपगत विकल्प पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पहलौठे’ बाइबलीय संदर्भ में प्रचलित और संक्षिप्त शब्द है; डैश मूल वाक्य के पश्चात् आने वाले ‘सभी पहलौठों’ को व्याख्यात्मक समानाधिकरण के रूप में दर्शाता है।
