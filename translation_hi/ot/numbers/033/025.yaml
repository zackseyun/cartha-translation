  yaml_path: translation/ot/numbers/033/025.yaml
  text: They set out from Haradah and camped at Makheloth[a].
translation:
  language: hi
  text: उन्होंने हरादा से कूच किया और मखेलोत में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से कूच किया
  rationale: निर्गमन और जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ किसी पड़ाव से आगे चल पड़ना है। ‘कूच किया’ इस यात्रा-सूत्र को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵחֲרָדָה
  choice: हरादा से
  rationale: उपसर्ग מֵ स्रोत अथवा अलग होने का भाव देता है; इसलिए ‘से’। स्थान-नाम חֲרָדָה को अर्थानुवाद के बजाय ‘हरादा’ रूप में लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: पड़ाव-सूची में חנה का अर्थ शिविर लगाना या पड़ाव डालना है। ‘डेरा डाला’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: בְּמַקְהֵלֹת
  choice: मखेलोत में
  rationale: यात्रा-वृत्तांत में בְ पड़ाव के स्थान को दर्शाता है; हिन्दी में इसके लिए ‘में’ स्वाभाविक है। מַקְהֵלֹת को स्थान-नाम मानकर ‘मखेलोत’ लिप्यंतरित किया गया है।
