  text: They set out from Dophkah and camped at Alush.
translation:
  language: hi
  text: उन्होंने दोप्का से कूच किया और आलूश में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... कूच किया
  rationale: जंगल-यात्रा के पड़ाव-विवरण में נסע का अर्थ पिछले पड़ाव से आगे की यात्रा के लिए निकलना है। ‘कूच किया’ आधुनिक हिन्दी में इस प्रस्थान और यात्रा—दोनों के भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִדָּפְקָה
  choice: दोपका से
  rationale: उपसर्ग מִן स्रोत या प्रस्थान-बिंदु (‘से’) बताता है। דָּפְקָה स्थान-नाम है, इसलिए उसका अनुवाद करने के बजाय हिब्रू उच्चारण के निकट ‘दोपका’ लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: पड़ाव-सूची में חנה का अर्थ किसी स्थान पर शिविर लगाना है। ‘डेरा डाला’ सामान्य आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּאָלוּשׁ
  choice: आलूश में
  rationale: उपसर्ग בְּ यहाँ पड़ाव का स्थान बताता है, जिसे हिन्दी में ‘में’ से व्यक्त किया गया है। אָלוּשׁ स्थान-नाम है और इसे ‘आलूश’ के रूप में लिप्यंतरित किया गया है।
