  register: भाषा संक्षिप्त, गरिमापूर्ण और आधुनिक मानक हिन्दी की है। मूल के यात्रा-वृत्तांत वाले सूत्रात्मक ढाँचे—एक स्थान से कूच करना और दूसरे स्थान पर डेरा डालना—को बनाए रखा गया है।
