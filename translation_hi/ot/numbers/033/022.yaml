  text: They set out from Rissah and camped at Kehelathah.
translation:
  language: hi
  text: फिर वे रिस्सा से रवाना हुए और कहेलाता में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे … से रवाना हुए
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ एक स्थान से अगले स्थान के लिए प्रस्थान करना है। हिंदी में ‘रवाना हुए’ स्वाभाविक है, और ‘फिर’ क्रमसूचक וַ का भाव स्पष्ट करता है।
- source_word: מֵרִסָּה
  choice: रिस्सा से
  rationale: מֵ उपसर्ग का अर्थ ‘से’ है। स्थान-नाम רִסָּה को अनूदित करने के बजाय उसके हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और … डेरा डाला
  rationale: पड़ाव-सूची में חנה का आशय शिविर लगाकर ठहरना है। ‘डेरा डाला’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בִּקְהֵלָתָה
  choice: कहेलाता में
  rationale: בְּ उपसर्ग यहाँ पड़ाव के स्थान को बताता है, इसलिए ‘में’ चुना गया है। קְהֵלָתָה को अर्थानुवाद के बजाय हिब्रू रूप के निकट लिप्यंतरित किया गया है।
