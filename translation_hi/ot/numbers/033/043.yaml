  text: They set out from Punon and camped at Oboth.
translation:
  language: hi
  text: फिर वे पूनोन से रवाना हुए और ओबोत में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से रवाना हुए
  rationale: जंगल-यात्रा के क्रमिक विवरण में נסע का अर्थ पड़ाव छोड़कर आगे चलना है। ‘रवाना हुए’ आधुनिक, स्वाभाविक हिन्दी है; וַ का क्रमसूचक भाव ‘फिर’ से व्यक्त किया गया है।
- source_word: מִפּוּנֹן
  choice: पूनोन से
  rationale: उपसर्ग מִן प्रस्थान के स्रोत को दर्शाता है, इसलिए ‘से’। स्थान-नाम פּוּנֹן का ध्वन्यात्मक लिप्यंतरण ‘पूनोन’ किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה यात्रा-विवरण में शिविर लगाने या पड़ाव डालने को सूचित करता है। ‘डेरा डाला’ साधारण आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּאֹבֹת
  choice: ओबोत में
  rationale: पड़ाव के स्थान के साथ בְּ का हिन्दी में स्वाभाविक रूप ‘में’ है। स्थान-नाम אֹבֹת का लिप्यंतरण ‘ओबोत’ किया गया है।
