  text: וַ/יִּסְע֖וּ מֵ/עַלְמֹ֣ן דִּבְלָתָ֑יְמָ/ה וַֽ/יַּחֲנ֛וּ בְּ/הָרֵ֥י הָ/עֲבָרִ֖ים לִ/פְנֵ֥י נְבֽוֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/047.yaml
  text: They set out from Almon-diblathaim and camped in the mountains of Abarim[a], before Nebo.
translation:
  language: hi
  text: फिर वे अलमोन-दिबलातैम से चल पड़े और नबो के सामने अबारीम के पहाड़ों में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से चल पड़े
  rationale: गिनती 33 की पड़ाव-सूची में נסע का अर्थ डेरा उठाकर आगे यात्रा करना है। ‘चल पड़े’ आधुनिक और स्वाभाविक हिन्दी में इस क्रमिक यात्रा को व्यक्त करता है।
- source_word: מֵעַלְמֹן דִּבְלָתָיְמָה
  choice: अलमोन-दिबलातैम से
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है; संयुक्त स्थान-नाम को हाइफ़न से जोड़ा गया है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה पड़ाव डालने का मानक क्रियापद है। ‘डेरा डाला’ साधारण आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּהָרֵי הָעֲבָרִים
  choice: अबारीम के पहाड़ों में
  rationale: הָרֵי बहुवचन संबंधरूप है और עֲבָרִים यहाँ भौगोलिक नाम है। בְּ को ‘में’ कहना पर्वतीय क्षेत्र के भीतर पड़ाव डालने का स्वाभाविक बोध देता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: इस स्थानवाचक संबंध का मूल अर्थ ‘सामने/सम्मुख’ है। ‘के सामने’ दिशा की ऐसी अतिरिक्त भौगोलिक सटीकता नहीं जोड़ता जो इब्रानी में स्पष्ट नहीं है।
- source_word: נְבוֹ
  choice: नबो
  rationale: यह स्थान-नाम है, इसलिए देवनागरी में लिप्यंतरित किया गया है।
