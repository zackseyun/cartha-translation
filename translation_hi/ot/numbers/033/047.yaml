  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की यात्रा-वृत्तांत शैली को संक्षिप्त रखा गया है और किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया। לִפְנֵי की वास्तविक स्थानगत व्यापकता ‘के सामने’ में पर्याप्त रूप से बनी रहती है, इसलिए अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
