  text: וְ/הָיָ֗ה כַּ/אֲשֶׁ֥ר דִּמִּ֛יתִי לַ/עֲשׂ֥וֹת לָ/הֶ֖ם אֶֽעֱשֶׂ֥ה לָ/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/056.yaml
  text: then it will happen that what I intended to do to them[a], I will do to you.
translation:
  language: hi
  text: तब ऐसा होगा कि जैसा मैंने उनके साथ करने का ठाना था[a], वैसा ही तुम्हारे साथ करूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “करने का विचार किया था।”
    reason: דִּמִּיתִי दृढ़ अभिप्राय या विचार दोनों तरह व्यक्त किया जा सकता है; मुख्य पाठ में संदर्भानुकूल ‘ठाना था’ रखा गया है।
lexical_decisions:
- source_word: וְהָיָה
  choice: तब ऐसा होगा
  rationale: यह वाक्यांश पिछले पद की चेतावनी का भावी परिणाम प्रस्तुत करता है। यह अनुवाद आधुनिक और स्वाभाविक हिंदी में उस परिणामसूचक बल को बनाए रखता है।
- source_word: כַּאֲשֶׁר
  choice: जैसा … वैसा ही
  rationale: यह चयन इब्रानी की तुलनात्मक संरचना को स्पष्ट रखता है और उस समान प्रतिफल पर बल देता है जो इस चेतावनी का केंद्र है।
- source_word: דִּמִּיתִי
  choice: मैंने … ठाना था
  rationale: पिएल रूप यहाँ केवल मन में सोचने के बजाय दृढ़ अभिप्राय व्यक्त करता है। ‘ठाना था’ सामान्य पाठक के लिए स्पष्ट है और चेतावनी की गंभीरता बनाए रखता है।
- source_word: לַעֲשׂוֹת לָהֶם
  choice: उनके साथ करने
  rationale: ‘करना’ क्रिया की व्यापकता बनाए रखता है, जबकि हिंदी में ‘उनके साथ’ दंडात्मक संदर्भ को बिना अनावश्यक विस्तार के स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶעֱשֶׂה לָכֶם
  choice: तुम्हारे साथ करूँगा
  rationale: पहले खंड के ‘करने’ को दोहराकर मूल का कठोर समानांतर भाव बनाए रखा गया है; दंड का स्वर संदर्भ से स्पष्ट होता है।
theological_decisions:
- issue: चेतावनी में समान दैवी न्याय का बल
  choice: परमेश्वर ने देश के निवासियों के साथ जो करने का ठाना था, वही आज्ञा न मानने पर इस्राएल के साथ करने की सीधी चेतावनी देता है।
  alternative: इसे केवल कर्मों के स्वाभाविक परिणाम का अपेक्षाकृत नरम कथन मानना।
  rationale: प्रथम पुरुष की दोनों क्रियाएँ दैवी अभिप्राय और दैवी कार्य को स्पष्ट करती हैं। अनुवाद इस गंभीरता को बनाए रखता है, पर पद में न दिए गए दंड के विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा सरल, गरिमापूर्ण और सीधी है। ‘जैसा … वैसा ही’ मूल की समानता और न्याय की गंभीर चेतावनी को स्वाभाविक हिंदी में सुरक्षित रखता है।
