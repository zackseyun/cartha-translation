  language: hi
  text: वे योटबाता से चले और अव्रोना में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चले
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ एक स्थान से आगे प्रस्थान करना है। ‘चले’ संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी में स्पष्ट है।
- source_word: מִיָּטְבָתָה
  choice: योटबाता से
  rationale: מִן उपसर्ग को ‘से’ अनूदित किया गया है। स्थान-नाम יָטְבָתָה का मूल इब्रानी उच्चारण ध्यान में रखते हुए लिप्यंतरण ‘योटबाता’ रखा गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... छावनी डाली
  rationale: पड़ाव-वर्णन में חנה अगले स्थान पर डेरा लगाने को व्यक्त करता है। ‘छावनी डाली’ साधारण आधुनिक हिन्दी में इस क्रिया का स्वाभाविक रूप है।
- source_word: בְּעַבְרֹנָה
  choice: अब्रोना में
  rationale: בְּ यहाँ स्थानवाचक है, इसलिए ‘में’ चुना गया है। עַבְרֹנָה को अर्थानुवाद किए बिना ‘अब्रोना’ लिप्यंतरित किया गया है।
