  text: וַ/יִּסְע֖וּ מֵ/אֵילִ֑ם וַֽ/יַּחֲנ֖וּ עַל יַם סֽוּף־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/010.yaml
  text: They set out from Elim and camped by the Red Sea[a].
translation:
  language: hi
  text: फिर वे एलीम से चल पड़े और लाल सागर[a] के किनारे डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सरकंडों का सागर।’ इब्रानी नाम ‘याम सूफ़’ का पारंपरिक अनुवाद ‘लाल सागर’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से चल पड़े
  rationale: जंगल-यात्रा के पड़ाव-सूत्र में נסע एक स्थान से प्रस्थान करने को दर्शाता है। ‘चल पड़े’ स्वाभाविक आधुनिक हिन्दी है, और ‘फिर’ कथानुक्रम को स्पष्ट करता है।
- source_word: מֵאֵילִם
  choice: एलीम से
  rationale: מִן स्रोत या आरंभ-स्थान बताता है; אֵילִם स्थान-नाम है, इसलिए उसका लिप्यंतरण ‘एलीम’ किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה यात्रा-वृत्तांत में पड़ाव डालने की सामान्य क्रिया है। ‘डेरा डाला’ वर्तमान हिन्दी में सहज और ठोस अभिव्यक्ति है।
- source_word: עַל
  choice: के किनारे
  rationale: जलाशय के पास पड़ाव डालने के संदर्भ में עַל समीपवर्ती स्थान का बोध कराता है; ‘के किनारे’ हिन्दी में स्वाभाविक रूप से समुद्र के पास डेरा डालना व्यक्त करता है।
- source_word: יַם סוּף
  choice: लाल सागर
  rationale: יַם־סוּף का पारंपरिक और परिचित हिन्दी रूप ‘लाल सागर’ है। סוּף के आधार पर ‘सरकंडों का सागर’ सम्भव शाब्दिक विकल्प है, जिसे टिप्पणी में सुरक्षित रखा गया है।
