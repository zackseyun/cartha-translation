  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद के संक्षिप्त यात्रा-वृत्तांत और क्रमिक सूत्र को बनाए रखते हुए स्थान-नाम तथा समुद्र के पारंपरिक नाम को सामान्य हिन्दी रूप में प्रस्तुत किया गया है।
