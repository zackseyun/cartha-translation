base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/048.yaml
  text: They set out from the mountains of Abarim and camped in the plains of Moab by the Jordan at Jericho[a][b].
translation:
  language: hi
  text: वे अबारीम के पहाड़ों से चले और मोआब के मैदानों[a] में यरीहो के पास यरदन के किनारे[b] पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मोआब के स्तेपी प्रदेश में।” इब्रानी शब्द स्तेपी अथवा मैदानी भूभाग को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “यरीहो के सामने यरदन के किनारे।” अंतिम इब्रानी पदबंध को यरीहो के पार, सामने वाले क्षेत्र के संकेत के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से रवाना हुए
  rationale: यात्रा-विवरण में נסע का अर्थ पड़ाव उठाकर अगले स्थान के लिए निकलना है; ‘रवाना हुए’ आधुनिक और स्वाभाविक हिंदी में इस भाव को व्यक्त करता है।
- source_word: מֵהָרֵי הָעֲבָרִים
  choice: अबारीम के पहाड़ों से
  rationale: הָרֵי का सीधा अर्थ ‘पहाड़’ है और अबारीम स्थान-नाम का देवनागरी लिप्यंतरण है।
- source_word: וַיַּחֲנוּ
  choice: छावनी डाली
  rationale: חנה यात्रा-सूचियों में पड़ाव डालने को दर्शाता है; ‘छावनी डाली’ सहज और गरिमापूर्ण हिंदी है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עַרְבֹת खुले समतल अथवा अर्ध-शुष्क मैदानी भूभाग को दर्शाता है; ‘मैदान’ सामान्य पाठक के लिए स्पष्ट है, जबकि वैकल्पिक भौगोलिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: यरीहो के पास यरदन के किनारे
  rationale: עַל नदी के साथ ‘किनारे/पास’ का स्थानिक अर्थ देता है। יְרֵחוֹ के साथ संबंध संक्षिप्त और कुछ अस्पष्ट है; मुख्य पाठ स्वाभाविक हिंदी देता है और ‘यरीहो के सामने’ की संभावना पादटिप्पणी में रखता है।
