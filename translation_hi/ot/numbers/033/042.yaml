  text: वे सल्मोना से रवाना हुए और पूनोन में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से रवाना हुए
  rationale: जंगल-यात्रा की सूची में נסע का अर्थ पड़ाव छोड़कर आगे चलना है। ‘रवाना हुए’ आधुनिक और स्वाभाविक हिंदी है; ‘फिर’ वाव-क्रम को यात्रा के अगले चरण के रूप में व्यक्त करता है।
- source_word: מִצַּלְמֹנָה
  choice: सलमोना से
  rationale: מִן उपसर्ग का अर्थ ‘से’ है। स्थान-नाम צַלְמֹנָה को अनुवादित करने के बजाय हिंदी ध्वन्यंतरण ‘सलमोना’ रखा गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: यात्रा-वृत्तांत में חנה के लिए ‘डेरा डाला’ सहज, स्पष्ट और वर्तमान हिंदी में प्रचलित अभिव्यक्ति है।
- source_word: בְּפוּנֹן
  choice: पूनोन में
  rationale: पड़ाव के स्थान के साथ בְּ को हिंदी में स्वाभाविक रूप से ‘में’ कहा गया है। פוּנֹן का ध्वन्यंतरण ‘पूनोन’ किया गया है।
