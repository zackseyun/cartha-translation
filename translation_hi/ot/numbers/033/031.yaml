base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/031.yaml
  text: They set out from Moseroth and camped at Bene-jaakan[a].
translation:
  language: hi
  text: फिर वे मोसेरोत से रवाना हुए और बेने-याकान[a] में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी नाम बेने-याकान का शाब्दिक अर्थ ‘याकान के पुत्र’ है, पर यहाँ यह एक स्थान का नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से रवाना हुए
  rationale: נסע यात्रा-वृत्तांत के इस सूत्र में पड़ाव छोड़कर आगे चलने को दर्शाता है। ‘रवाना हुए’ आधुनिक, स्वाभाविक हिन्दी है; וַ की कथानक-क्रमसूचक भूमिका ‘फिर’ से व्यक्त हुई है।
- source_word: מִמֹּסֵרֹות
  choice: मोसेरोत से
  rationale: מִן का अर्थ ‘से’ है। מסרות स्थान-नाम है, इसलिए उसका अर्थानुवाद न करके हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: חנה का यात्रा-सूची के संदर्भ में अर्थ छावनी लगाना या ठहरना है। ‘पड़ाव डाला’ सामान्य हिन्दी में यात्रा के अगले ठहराव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: בִּבְנֵי יַעֲקָן
  choice: बेने-याकान में
  rationale: बְּ को स्थान के साथ ‘में’ के रूप में व्यक्त किया गया है। בְּנֵי יַעֲקָן की शब्दशः रचना ‘याकान के पुत्र’ है, पर यहाँ यह पड़ाव के स्थान-नाम के रूप में प्रयुक्त है; इसलिए इसका लिप्यंतरण किया गया है।
