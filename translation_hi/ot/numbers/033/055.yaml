  text: וְ/אִם לֹ֨א תוֹרִ֜ישׁוּ אֶת יֹשְׁבֵ֣י הָ/אָרֶץ֮ מִ/פְּנֵי/כֶם֒ וְ/הָיָה֙ אֲשֶׁ֣ר תּוֹתִ֣ירוּ מֵ/הֶ֔ם לְ/שִׂכִּים֙ בְּ/עֵ֣ינֵי/כֶ֔ם וְ/לִ/צְנִינִ֖ם בְּ/צִדֵּי/כֶ֑ם וְ/צָרֲר֣וּ אֶתְ/כֶ֔ם עַל הָ/אָ֕רֶץ אֲשֶׁ֥ר אַתֶּ֖ם יֹשְׁבִ֥ים בָּֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/055.yaml
  text: But if you do not drive out the inhabitants of the land from before you[a], then those whom you let remain from among them will become barbs in your eyes and thorns in your sides[c][b], and they will harass you on the land where you are living.
translation:
  language: hi
  text: पर यदि तुम उस देश के निवासियों को अपने सामने से नहीं निकालोगे, तो उनमें से जिन्हें तुम रहने दोगे, वे तुम्हारी आँखों में चुभनेवाली नोकें[a] और तुम्हारे पहलुओं में काँटे[b] बनेंगे; और जिस देश में तुम रहते हो, उसमें वे तुम्हें सताएँगे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा का दुर्लभ शब्द किसी नुकीली, चुभनेवाली वस्तु को दर्शाता है; अनुवाद ‘तुम्हारी आँखों में काँटे’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अनुवाद ‘तुम्हारे पहलुओं में नुकीली वस्तुएँ’ या ‘तुम्हारे पहलुओं में शूल’ भी हो सकता है। दोनों रूपक लगातार होनेवाली पीड़ादायक मुसीबत का चित्र देते हैं।
    reason: lexical_alternative
  - marker: c
    text: ‘सताएँगे’ का अनुवाद ‘तंग करेंगे’ या ‘उत्पीड़ित करेंगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תוֹרִישׁוּ
  choice: निकालोगे
  rationale: हिफ़ील रूप यहाँ वर्तमान निवासियों को देश से हटाने या उनका अधिकार छुड़ाने का भाव देता है। ‘निकालना’ सहज आधुनिक हिन्दी में इस बलपूर्वक हटाए जाने को स्पष्ट रखता है।
- source_word: יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासी
  rationale: प्रतिभागी रचना का सीधा और स्वाभाविक हिन्दी अनुवाद; सन्दर्भ में पहले से उल्लिखित देश होने के कारण ‘उस देश’ उपयुक्त है।
- source_word: מִפְּנֵיכֶם
  choice: अपने सामने से
  rationale: इब्रानी स्थानवाचक मुहावरे का दृश्यात्मक अर्थ बनाए रखता है और इस्राएल के आगे बढ़ने के सामने से हटाने का भाव व्यक्त करता है।
- source_word: תּוֹתִירוּ
  choice: जिन्हें तुम रहने दोगे
  rationale: हिफ़ील रूप का ‘शेष रहने देना’ वाला कारणवाचक भाव स्पष्ट करता है; ‘बख्श देना’ अनावश्यक दया का भाव जोड़ता।
- source_word: לְשִׂכִּים בְּעֵינֵיכֶם
  choice: तुम्हारी आँखों में चुभनेवाले काँटे
  rationale: दुर्लभ संज्ञा किसी नुकीली, भेदनेवाली वस्तु को सूचित करती है। ‘चुभनेवाले काँटे’ हिन्दी में सजीव और बोधगम्य है तथा आँखों की तीखी पीड़ा का रूपक बचाता है।
- source_word: לִצְנִינִם בְּצִדֵּיכֶם
  choice: तुम्हारी पसलियों में काँटे
  rationale: तीखी, चुभनेवाली वस्तु और शरीर के पार्श्व का रूपक सुरक्षित रहता है। ‘पसलियों’ से आधुनिक पाठक को शरीर का स्थान ‘बगल’ की अपेक्षा अधिक स्पष्ट मिलता है।
- source_word: וְצָרֲרוּ אֶתְכֶם
  choice: वे तुम्हें सताएँगे
  rationale: צרר के शत्रुतापूर्ण कष्ट, तंग करने और उत्पीड़न के अर्थ-क्षेत्र को सहज हिन्दी में व्यक्त करता है, बिना उसे अनिवार्य रूप से औपचारिक राजनीतिक दमन तक सीमित किए।
- source_word: עַל הָאָרֶץ אֲשֶׁר אַתֶּם יֹשְׁבִים בָּהּ
  choice: जिस देश में तुम रहते हो, उसमें
  rationale: עַל का मूल अर्थ ‘पर’ है, पर देश में निवास के लिए हिन्दी में ‘में’ स्वाभाविक है; वर्तमान निवास का भाव भी बना रहता है।
