base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/007.yaml
  text: They set out from Etham and turned back to Pi-hahiroth[a], which is opposite Baal-zephon, and camped before Migdol.
translation:
  language: hi
  text: वे एताम से निकले और पी-हहीरोत[a] की ओर मुड़ गए, जो बाल-सफ़ोन के सामने है; और उन्होंने मिगदोल के सामने पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लौट आए’; इब्रानी क्रिया का अर्थ लौटना या दिशा पलटना, दोनों हो सकता है। यहाँ संभवतः यात्रा की दिशा बदलने की बात है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ מֵאֵתָם
  choice: वे एताम से निकले
  rationale: यात्रा-वृत्तांत में נסע का अर्थ पड़ाव उठाकर आगे चलना है। आधुनिक हिन्दी में ‘से निकले’ स्वाभाविक और स्पष्ट है; एताम स्थान-नाम का लिप्यंतरण है।
- source_word: וַיָּשָׁב
  choice: और लौटकर
  rationale: שׁוב लौटने या दिशा पलटने, दोनों को व्यक्त कर सकता है। यहाँ यात्रा-मार्ग में दिशा बदलकर जाने का भाव है; ‘लौटकर’ मूल क्रिया की वास्तविक अर्थगत अस्पष्टता बनाए रखता है।
- source_word: עַל פִּי הַחִירֹת
  choice: पी-हहीरोत की ओर
  rationale: इस भौगोलिक संदर्भ में עַל गंतव्य या दिशा का संबंध बताता है। ‘की ओर’ हिन्दी में स्वाभाविक है और ‘पर’ की संभावित भ्रामक स्थानिकता से बचाता है।
- source_word: אֲשֶׁר עַל פְּנֵי בַּעַל צְפֹן
  choice: जो बाल-सपोन के सामने है
  rationale: עַל־פְּנֵי यहाँ स्थानिक संबंध, अर्थात सामने या आमने-सामने होना, दर्शाता है। दोनों नामों को स्थान-नाम मानकर लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: उन्होंने पड़ाव डाला
  rationale: חנה का अर्थ छावनी लगाना या पड़ाव डालना है। यात्रा-वृत्तांत में ‘पड़ाव डाला’ सहज आधुनिक हिन्दी है।
- source_word: לִפְנֵי מִגְדֹּל
  choice: मिगदोल के सामने
  rationale: לִפְנֵי किसी स्थान के आगे या सामने की स्थिति बताता है। मिगदोल यहाँ स्थान-नाम है, इसलिए उसका अर्थ ‘मीनार’ करने के बजाय लिप्यंतरण किया गया है।
