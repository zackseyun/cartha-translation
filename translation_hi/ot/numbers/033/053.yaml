  yaml_path: translation/ot/numbers/033/053.yaml
  text: You shall take possession of the land and live in it, because I have given the land to you to possess it.
translation:
  language: hi
  text: तुम उस देश पर अधिकार करो और उसमें बसो, क्योंकि मैंने वह देश तुम्हें अपने अधिकार में लेने के लिए[a] दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे विरासत में पाने के लिए।” इब्रानी क्रिया ירשׁ का अर्थ अधिकार में लेना और, विशेषकर वाचा-संबंधी भूमि-प्रतिज्ञा के संदर्भों में, विरासत में पाना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹרַשְׁתֶּם
  choice: तुम उस देश पर अधिकार कर लेना
  rationale: हिफ़ील रूप यहाँ भूमि को कर्म बनाता है। निकटवर्ती संदर्भ में निवासियों को निकालना निहित हो सकता है, पर हिन्दी में देश को ‘निकालना’ अस्वाभाविक और भ्रामक होगा; इसलिए परिणामार्थक ‘अधिकार कर लेना’ उपयुक्त है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: संदर्भ प्रतिज्ञात विशिष्ट भूभाग का है; आधुनिक हिन्दी में ‘उस देश’ स्वाभाविक है और निश्चितता बनाए रखता है।
- source_word: וִישַׁבְתֶּם בָּהּ
  choice: और उसमें बसना
  rationale: ישׁב का अर्थ यहाँ स्थायी रूप से रहना या बसना है। ‘बसना’ भूमि पर स्थापित निवास को संक्षेप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह आज्ञा का कारण प्रस्तुत करता है; ‘क्योंकि’ स्पष्ट कारणवाचक संबंध रखता है।
- source_word: לָכֶם נָתַתִּי
  choice: मैंने ... तुम्हें ... दिया है
  rationale: पूर्ण क्रिया परमेश्वर के दान को संपन्न और वर्तमानतः प्रभावी कार्य के रूप में प्रस्तुत करती है; हिन्दी पूर्णकाल ‘दिया है’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָרֶשֶׁת אֹתָהּ
  choice: अधिकार में लेने के लिए
  rationale: यह उद्देश्य बताने वाला प्रयोग है। ‘अधिकार में लेना’ वास्तविक भू-अधिग्रहण का भाव रखता है; वाचा-संदर्भ में ‘विरासत में पाना’ भी संभव है।
theological_decisions:
- issue: भूमि-प्रतिज्ञा के संदर्भ में ירשׁ का अनुवाद
  choice: अधिकार कर लेना / अधिकार में लेना
  alternative: विरासत में पाना
  rationale: पद का तत्काल बल परमेश्वर द्वारा दी गई भूमि पर वास्तविक अधिकार और उसमें निवास पर है। फिर भी ירשׁ में वाचा-संबंधी विरासत का अर्थ संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘निवास करना’ की अपेक्षा ‘बसना’ अधिक स्वाभाविक है, जबकि ‘अधिकार’ मूल के भूमि-अधिग्रहण संबंधी बल को बनाए रखता है।
