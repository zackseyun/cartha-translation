  yaml_path: translation/ot/numbers/033/039.yaml
  text: And Aaron was one hundred twenty-three years old when he died on Mount Hor.
translation:
  language: hi
  text: और जब हारून की मृत्यु होर पर्वत पर हुई, तब वह एक सौ तेईस वर्ष का था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אַהֲרֹן
  choice: और ... हारून
  rationale: वाव कथा की कड़ी को आगे बढ़ाता है, इसलिए इसे ‘और’ से व्यक्त किया गया है; אַהֲרֹן का प्रचलित हिन्दी रूप ‘हारून’ रखा गया है।
- source_word: בֶּן שָׁלֹשׁ וְ/עֶשְׂרִים וּ/מְאַת שָׁנָה
  choice: वह एक सौ तेईस वर्ष का था
  rationale: इब्रानी मुहावरा ‘पुत्र + संख्या + वर्ष’ आयु बताता है; आधुनिक हिन्दी में इसका स्वाभाविक रूप ‘एक सौ तेईस वर्ष का था’ है।
- source_word: בְּ/מֹת/וֹ
  choice: जब ... उसकी मृत्यु ... हुई
  rationale: בְּ के साथ ‘मृत्यु’ और तीसरे पुरुष प्रत्यय यहाँ समयसूचक अर्थ देते हैं; हिन्दी में ‘जब उसकी मृत्यु हुई’ इस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּ/הֹר הָ/הָר
  choice: होर पर्वत पर
  rationale: הֹר הָהָר स्थान-नाम है; हिन्दी में ‘होर पर्वत’ स्वाभाविक है और בְּ को प्रसंगानुसार ‘पर’ कहा गया है।
