  text: They set out from Abronah and camped at Ezion-geber.
translation:
  language: hi
  text: वे अब्रोना से निकले और एस्योन-गेबेर में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे निकले
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע एक पड़ाव से प्रस्थान करने को दर्शाता है। ‘निकले’ सहज आधुनिक हिन्दी है और यात्रा आरम्भ करने का भाव स्पष्ट रखता है।
- source_word: מֵעַבְרֹנָה
  choice: अब्रोना से
  rationale: מֵ का अर्थ ‘से’ है। עַבְרֹנָה स्थान-नाम है, इसलिए उसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: इस यात्रा-वृत्तांत में חנה का अर्थ किसी स्थान पर शिविर लगाकर ठहरना है। ‘पड़ाव डाला’ स्वाभाविक और प्रसंगानुकूल हिन्दी है।
- source_word: בְּעֶצְיוֹן גָּבֶר
  choice: एस्योन-गेबेर में
  rationale: בְּ यहाँ स्थान सूचित करता है, इसलिए ‘में’ चुना गया है। עֶצְיוֹן גָּבֶר स्थान-नाम है और संयुक्त नाम को योजक-चिह्न सहित लिप्यंतरित किया गया है।
