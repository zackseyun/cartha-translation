base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/049.yaml
  text: And they camped by the Jordan[a], from Beth-jeshimoth as far as Abel-shittim, in the plains of Moab.
translation:
  language: hi
  text: और उन्होंने यरदन के किनारे, बेत-यशीमोत से लेकर आबेल-शित्तीम तक, मोआब के मैदानों[a] में डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब के स्तेपी प्रदेश में।” हिब्रू शब्द मोआब के समतल, स्तेपी-सदृश क्षेत्र का भी संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחֲנוּ
  choice: और उन्होंने ... डेरा डाला
  rationale: חנה का यह कथात्मक रूप यात्रा के अगले पड़ाव को बताता है; ‘डेरा डाला’ स्वाभाविक और वर्तमान मानक हिन्दी है।
- source_word: עַל הַיַּרְדֵּן
  choice: यरदन के किनारे
  rationale: नदी के साथ עַל का अर्थ यहाँ उसके पास या तटवर्ती क्षेत्र में है; ‘किनारे’ शिविर के संदर्भ में स्वाभाविक है।
- source_word: מִבֵּית הַיְשִׁמֹת
  choice: बेत-यशीमोत से
  rationale: स्थान-नाम को लिप्यंतरित किया गया है और מִן सीमा के आरम्भ-बिंदु को दर्शाता है।
- source_word: עַד אָבֵל הַשִּׁטִּים
  choice: आबेल-शित्तीम तक
  rationale: עַד भौगोलिक विस्तार के अंतिम बिंदु को स्पष्ट करता है; स्थान-नाम का लिप्यंतरण किया गया है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עֲרָבוֹת समतल, शुष्क मैदानी अथवा स्तेपी क्षेत्र को सूचित करता है; ‘मैदानों’ सामान्य हिन्दी पाठक के लिए स्पष्ट और संदर्भानुकूल है।
