  yaml_path: translation/ot/numbers/033/019.yaml
  text: They set out from Rithmah and camped at Rimmon-perez[a].
translation:
  language: hi
  text: वे रितमा से चल पड़े और रिम्मोन-पेरेस में डेरा डाला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे रितमा से रवाना हुए और रिम्मोन-पेरेस में पड़ाव डाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे … से चल पड़े
  rationale: जंगल की यात्रा-सूची में נסע का अर्थ डेरा उठाकर अगले पड़ाव के लिए प्रस्थान करना है। ‘चल पड़े’ आधुनिक, स्वाभाविक हिन्दी में इस गतिशील अर्थ को व्यक्त करता है।
- source_word: מֵרִתְמָה
  choice: रितमा से
  rationale: उपसर्ग מִן प्रस्थान के स्थान को सूचित करता है, इसलिए ‘से’ उपयुक्त है। स्थान-नाम का अनुवाद न करके उसका लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और … डेरा डाला
  rationale: חנה यात्रा-वृत्तांत में पड़ाव डालने का सामान्य क्रिया-पद है। ‘डेरा डाला’ साधारण आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: בְּרִמֹּן פָּרֶץ
  choice: रिम्मोन-पेरेस में
  rationale: यहाँ בְ स्थान सूचित करता है, जिसे हिन्दी में स्वाभाविक रूप से ‘में’ कहा गया है। संयुक्त स्थान-नाम के दोनों भागों को योजक-चिह्न के साथ लिप्यंतरित किया गया है।
