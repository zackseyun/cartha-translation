  text: וַ/יִּסְע֖וּ מֵ/רִמֹּ֣ן פָּ֑רֶץ וַֽ/יַּחֲנ֖וּ בְּ/לִבְנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/020.yaml
  text: They set out from Rimmon-perez and camped at Libnah.
translation:
  language: hi
  text: वे रिम्मोन-पेरेस से चले और लिब्ना में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... से चले
  rationale: जंगल-यात्रा की सूची में נסע किसी पड़ाव से आगे प्रस्थान करने को दर्शाता है। आधुनिक हिन्दी में “से चले” सहज है और यात्रा-सूत्र को संक्षेप में बनाए रखता है।
- source_word: מֵרִמֹּן פָּרֶץ
  choice: रिम्मोन-पेरेस से
  rationale: מִן का अर्थ “से” है। स्थान-नाम का अनुवाद करने के बजाय उसका देवनागरी लिप्यंतरण किया गया है; संयुक्त नाम को हाइफ़न से जोड़ा गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... पड़ाव डाला
  rationale: यात्रा-विवरण में חנה का अर्थ किसी स्थान पर शिविर लगाकर ठहरना है। “पड़ाव डाला” वर्तमान हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: בְּלִבְנָה
  choice: लिब्ना में
  rationale: यहाँ בְּ अगले ठहरने के स्थान को चिह्नित करता है। हिन्दी में स्थान-नाम के साथ “में” स्वाभाविक है, और लिब्ना नाम का लिप्यंतरण किया गया है।
