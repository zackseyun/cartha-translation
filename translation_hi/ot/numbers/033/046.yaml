base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/046.yaml
  text: They set out from Dibon-gad and camped at Almon-diblathaim.
translation:
  language: hi
  text: उन्होंने दीबोन-गाद से कूच किया और अल्मोन-दिब्लातैम में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से कूच किया
  rationale: निर्गमन-यात्रा की इस आवर्ती सूची में נסע का अर्थ डेरा समेटकर अगले पड़ाव के लिए चलना है। ‘कूच किया’ आधुनिक, संक्षिप्त और यात्रा-वृत्तांत के अनुकूल है।
- source_word: מִדִּיבֹן גָּד
  choice: दीबोन-गाद से
  rationale: यह स्थान-नाम है; מִן उपसर्ग को ‘से’ के द्वारा व्यक्त किया गया है और संयुक्त स्थान-नाम को लिप्यंतरित किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: इस यात्रा-सूत्र में חנה किसी स्थान पर शिविर लगाने अथवा पड़ाव करने को दर्शाता है। ‘डेरा डाला’ सहज और सामान्य आधुनिक हिन्दी है।
- source_word: בְּעַלְמֹן דִּבְלָתָיְמָה
  choice: अलमोन-दिबलातैम में
  rationale: यह स्थान-नाम लिप्यंतरित किया गया है। בְ को गंतव्य पर ठहरने के संदर्भ में ‘में’ से व्यक्त किया गया है; अंतिम दिशासूचक ה स्थान की ओर गति का संकेत दे सकता है, पर חנה के साथ स्वाभाविक हिन्दी में आगमन के बाद का पड़ाव व्यक्त होता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आवर्ती यात्रा-सूत्र के लिए ‘कूच किया’ और ‘डेरा डाला’ का स्वाभाविक युग्म अपनाया गया है; स्थान-नामों का अनुवाद नहीं, लिप्यंतरण किया गया है।
