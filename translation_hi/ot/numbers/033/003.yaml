  text: וַ/יִּסְע֤וּ מֵֽ/רַעְמְסֵס֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן בַּ/חֲמִשָּׁ֥ה עָשָׂ֛ר י֖וֹם לַ/חֹ֣דֶשׁ הָ/רִאשׁ֑וֹן מִֽ/מָּחֳרַ֣ת הַ/פֶּ֗סַח יָצְא֤וּ בְנֵֽי יִשְׂרָאֵל֙ בְּ/יָ֣ד רָמָ֔ה לְ/עֵינֵ֖י כָּל מִצְרָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/003.yaml
  text: They set out from Rameses in the first month[a], on the fifteenth day of the first month[b]; on the day after the Passover the sons of Israel went out with a high hand before the eyes of all the Egyptians.
translation:
  language: hi
  text: वे पहले महीने के पंद्रहवें दिन रामसेस से रवाना हुए; फसह के अगले दिन इस्राएल के पुत्र[a] सब मिस्रियों की आँखों के सामने ऊँचा हाथ उठाए हुए[b] निकल गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘इस्राएली’। शाब्दिक रूप से, ‘इस्राएल के पुत्र’।
    reason: lexical_alternative
  - marker: b
    text: ‘ऊँचा हाथ उठाए हुए’ एक इब्रानी मुहावरा है, जिसका अर्थ सबके सामने खुलेआम और निर्भीकता से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: रवाना हुए
  rationale: यात्रा-विवरण में נסע का अर्थ पड़ाव उठाकर आगे चलना है; ‘रवाना हुए’ आधुनिक और स्वाभाविक हिन्दी है।
- source_word: מֵרַעְמְסֵס
  choice: रामसेस से
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן בַּחֲמִשָּׁה עָשָׂר יוֹם
  choice: पहले महीने के पंद्रहवें दिन
  rationale: इब्रानी तिथि-वाक्यांश का स्पष्ट और स्वाभाविक हिन्दी रूप।
- source_word: מִמָּחֳרַת הַפֶּסַח
  choice: फसह के अगले दिन
  rationale: מָחֳרַת अगले दिन को बताता है और הַפֶּסַח निर्दिष्ट फसह पर्व को।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: इब्रानी अभिव्यक्ति के पुरुषवाची बहुवचन रूप को पारदर्शी ढंग से सुरक्षित रखता है; सामूहिक अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: בְּיָד רָמָה
  choice: ऊँचा हाथ किए
  rationale: मूल ठोस इब्रानी मुहावरे को बनाए रखता है, जिसका आशय खुलेआम और निर्भीकता से निकलना है।
- source_word: לְעֵינֵי כָּל מִצְרָיִם
  choice: सब मिस्रियों की आँखों के सामने
  rationale: सार्वजनिक दृश्यता व्यक्त करने वाले मूल मुहावरे का निकट और सुबोध हिन्दी रूप।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: यह मूल की प्रतिनिधिक पुरुषवाची वाचा-संबंधी अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी सामूहिक अर्थ बताती है।
- issue: בְיָד רָמָה मुहावरे का अनुवाद
  choice: ऊँचा हाथ किए
  alternative: निर्भीकता से / विजयी भाव से
  rationale: मूल चित्रात्मक मुहावरा अर्थ की संभावित व्यापकता बनाए रखता है और किसी एक भावात्मक व्याख्या को पाठ में अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। मूल की यात्रा-विवरण शैली और दोनों इब्रानी मुहावरों की पारदर्शिता बनाए रखी गई है।
