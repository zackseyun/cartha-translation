  yaml_path: translation/ot/numbers/033/030.yaml
  text: They set out from Hashmonah and camped at Moseroth[a].
translation:
  language: hi
  text: उन्होंने हश्मोना से कूच किया और मोसेरोत में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... कूच किया
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ किसी स्थान से प्रस्थान करना है। ‘कूच किया’ स्वाभाविक, संक्षिप्त और यात्रा-क्रम के अनुरूप है।
- source_word: מֵחַשְׁמֹנָה
  choice: हशमोना से
  rationale: उपसर्ग מֵ का अर्थ ‘से’ है; חַשְׁמֹנָה स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: पड़ाव-सूची में חנה का ठोस अर्थ शिविर लगाना या पड़ाव डालना है। ‘डेरा डाला’ आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: בְּמֹסֵרוֹת
  choice: मोसेरोत में
  rationale: यहाँ בְ अगले पड़ाव के स्थान को सूचित करता है, जिसे हिन्दी में स्वाभाविक रूप से ‘में’ कहा जाता है; מֹסֵרוֹת स्थान-नाम होने के कारण लिप्यंतरित है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद की संक्षिप्त यात्रा-सूची शैली और दोनों क्रमिक क्रियाएँ सुरक्षित हैं। किसी पादटिप्पणी की आवश्यकता नहीं है, क्योंकि ‘डेरा डाला’ और ‘पड़ाव डाला’ का अंतर अर्थगत अस्पष्टता उत्पन्न नहीं करता।
