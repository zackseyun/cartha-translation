  text: वे लिब्ना से निकले और रिस्सा में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे … से निकले
  rationale: जंगल की यात्रा-सूची में נסע किसी पड़ाव से आगे की यात्रा के लिए प्रस्थान करने को दर्शाता है। ‘निकले’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מִלִּבְנָה
  choice: लिब्ना से
  rationale: מִן स्रोत या प्रस्थान-स्थान को सूचित करता है; לִבְנָה स्थान-नाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: और … पड़ाव डाला
  rationale: חנה का अर्थ शिविर लगाना या ठहरना है। यात्रा-वृत्तांत में ‘पड़ाव डाला’ सहज हिन्दी है और अस्थायी शिविर का भाव बनाए रखता है।
- source_word: בְּרִסָּה
  choice: रिस्सा में
  rationale: בְּ स्थान को सूचित करता है। हिन्दी में किसी बस्ती या स्थान के नाम के साथ ‘में’ स्वाभाविक है; רִסָּה का लिप्यंतरण ‘रिस्सा’ किया गया है।
