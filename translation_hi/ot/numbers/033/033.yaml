  yaml_path: translation/ot/numbers/033/033.yaml
  text: They set out from Hor-haggidgad and camped at Jotbathah.
translation:
  language: hi
  text: उन्होंने होर-हग्गिदगाद से कूच किया और योतबाता में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... से कूच किया
  rationale: जंगल-यात्रा की पड़ाव-सूची में נסע का अर्थ किसी स्थान से प्रस्थान करना है। ‘कूच किया’ इस बार-बार आने वाले यात्रा-सूत्र को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: מֵחֹר הַגִּדְגָּד
  choice: होर-हग्गिदगाद से
  rationale: מִן उपसर्ग प्रस्थान-बिंदु बताता है। स्थान-नाम का अनुवाद करने के बजाय उसका हिन्दी लिप्यंतरण किया गया है और संयुक्त नाम को योजक-चिह्न से जोड़ा गया है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: पड़ाव-सूची में חנה का अर्थ ठहरकर शिविर लगाना है। ‘डेरा डाला’ आधुनिक हिन्दी में सहज है और मूल क्रिया का अर्थ स्पष्ट रखता है।
- source_word: בְּיָטְבָתָה
  choice: योतबाता में
  rationale: בְּ यहाँ स्थानसूचक है। नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण ‘योतबाता’ किया गया है और ‘में’ पड़ाव के स्थान को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। यात्रा-वृत्तांत की सूत्रात्मक संक्षिप्तता सुरक्षित है; किसी व्याख्यात्मक या सांप्रदायिक तत्व को नहीं जोड़ा गया।
