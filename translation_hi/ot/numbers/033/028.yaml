  to: उन्होंने तेरह से कूच किया और मित्का में डेरा डाला।
  rationale: 'The revision renders each Hebrew clause with a simple completed action: departure from Terah followed by camping at Mithkah. It removes the unsupported inceptive sense while retaining natural modern Hindi and the itinerary register.'
