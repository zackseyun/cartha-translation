  text: They set out from Terah and camped at Mithkah.
translation:
  language: hi
  text: उन्होंने तेरह से कूच किया और मित्का में डेरा डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: फिर वे ... से कूच करके
  rationale: निर्गमन-यात्रा की पड़ाव-सूची में נסע का अर्थ किसी पड़ाव से आगे यात्रा के लिए निकलना है। ‘कूच करना’ इस सूत्रात्मक यात्रा-भाषा को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: מִתָּרַח
  choice: तेरह से
  rationale: उपसर्ग מִן प्रस्थान-बिंदु बताता है। תָּרַח यहाँ स्थान-नाम है, इसलिए उसका देवनागरी लिप्यंतरण ‘तेरह’ किया गया है।
- source_word: וַיַּחֲנוּ
  choice: पड़ाव डालने लगे
  rationale: חנה का मूल अर्थ डेरा लगाना या पड़ाव डालना है। वाव-क्रमिक रूप यात्रा-वृत्तांत की अगली घटना प्रस्तुत करता है; हिन्दी में ‘पड़ाव डालने लगे’ उस क्रियात्मक क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּמִתְקָה
  choice: मित्का में
  rationale: उपसर्ग בְ स्थान सूचित करता है। מִתְקָה स्थान-नाम है, जिसका देवनागरी लिप्यंतरण ‘मित्का’ किया गया है; ‘में’ इब्रानी स्थान-सूचक संबंध को सीधे रखता है।
