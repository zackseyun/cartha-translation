lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुना
  rationale: שׁמע के सामान्य अर्थ ‘सुनना’ को रखा गया है। इब्रानी में सुनी गई बात का कर्म स्पष्ट नहीं है; अगला कालवाचक पद बताता है कि उसने इस्राएल के पुत्रों के आने पर यह सुना।
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: अराद के कनानी राजा
  rationale: यह पद राजा की कनानी पहचान और अराद पर उसके शासन—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהוּא יֹשֵׁב
  choice: जो ... रहता था
  rationale: सर्वनाम और कृदंत से मिलने वाली पृष्ठभूमि-सूचना को हिन्दी में संबंधवाचक उपवाक्य द्वारा स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: בַּנֶּגֶב
  choice: नेगेव
  rationale: यहाँ इसे विशिष्ट भौगोलिक क्षेत्र का नाम माना गया है; ‘दक्षिण’ भी संभव है और उसे पादटिप्पणी में रखा गया है।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: मूल के ‘कनान की भूमि/देश’ को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: בְּבֹא
  choice: आ रहे हैं
  rationale: בְּ + infinitive construct कालवाचक है। प्रसंग में आगमन की चलती हुई घटना सुनने का विषय है; हिन्दी का ‘आ रहे हैं’ इसे सहज रूप से व्यक्त करता है, बिना किसी अनुल्लिखित गंतव्य को जोड़ने के।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल का औपचारिक रूप ‘इस्राएल के पुत्र’ रखा गया है; यह सामूहिक रूप से इस्राएलियों को दर्शाता है।
