translation_notes:
  register: आधुनिक मानक हिन्दी; यात्रा-विवरण की संक्षिप्त लय और स्थान-नामों का स्रोताधारित रूप बनाए रखा गया है। ‘जंगल’ के बजाय ‘निर्जन प्रदेश’ चुना गया, क्योंकि מִדְבָּר आवश्यक रूप से वृक्षाच्छादित वन नहीं दर्शाता।
