  text: וַ/יִּסְעוּ֙ מִ/פְּנֵ֣י הַֽ/חִירֹ֔ת וַ/יַּֽעַבְר֥וּ בְ/תוֹךְ הַ/יָּ֖ם הַ/מִּדְבָּ֑רָ/ה וַ/יֵּ֨לְכ֜וּ דֶּ֣רֶךְ שְׁלֹ֤שֶׁת יָמִים֙ בְּ/מִדְבַּ֣ר אֵתָ֔ם וַֽ/יַּחֲנ֖וּ בְּ/מָרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/033/008.yaml
  text: They set out from before Hahiroth and passed through the midst of the sea into the wilderness[b][a], and they went a three-day journey in the wilderness of Etham and camped at Marah.
translation:
  language: hi
  text: वे हहीरोत के सामने से कूच करके समुद्र के बीच से होते हुए निर्जन प्रदेश में गए। फिर उन्होंने एताम के निर्जन प्रदेश में तीन दिन की यात्रा की और मारा में डेरा डाला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में यहाँ नाम ‘हहीरोत’ है; निर्गमन की पुस्तक में यह स्थान प्रायः ‘पी-हहीरोत’ कहलाता है। यहाँ छोटे नाम को उसी रूप में रखा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: कूच करके
  rationale: यात्रा-विवरण में נסע का अर्थ पड़ाव छोड़कर आगे बढ़ना है; ‘कूच करना’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: מִפְּנֵי הַחִירֹת
  choice: हहीरोत के सामने से
  rationale: מִפְּנֵי का स्थानवाचक अर्थ ‘के सामने से’ रखा गया है और पाठ में उपस्थित छोटे नाम ‘हहीरोत’ को निर्गमन के ‘पी-हहीरोत’ से नहीं मिलाया गया।
- source_word: וַיַּעַבְרוּ בְתוֹךְ הַיָּם
  choice: समुद्र के बीच से होते हुए
  rationale: בתוך की ‘बीच में’ वाली स्पष्टता और עבר की आर-पार जाने की गति दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַמִּדְבָּרָה
  choice: निर्जन प्रदेश में पहुँचे
  rationale: दिशासूचक ה गति को निर्जन प्रदेश की ओर अथवा उसमें प्रवेश के रूप में दिखाता है; ‘में पहुँचे’ प्रसंग में इसे सहज रूप से व्यक्त करता है।
- source_word: וַיֵּלְכוּ דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: तीन दिन की यात्रा करके
  rationale: शाब्दिक संरचना ‘तीन दिनों की यात्रा’ दूरी अथवा यात्रा-अवधि बताती है; यह हिन्दी रूप अर्थ को बिना अनावश्यक कठोरता के रखता है।
- source_word: בְמִדְבַּר אֵתָם
  choice: एताम के निर्जन प्रदेश में
  rationale: सम्बन्धवाची इब्रानी रचना को स्वाभाविक हिन्दी में व्यक्त किया गया और स्थान-नाम का लिप्यंतरण रखा गया।
- source_word: וַיַּחֲנוּ בְּמָרָה
  choice: मारा में डेरा डाले
  rationale: חנה यात्रा-विवरण में पड़ाव डालने को दर्शाता है; ‘डेरा डालना’ सामान्य आधुनिक हिन्दी है।
