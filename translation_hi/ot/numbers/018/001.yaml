source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶֽל אַהֲרֹ֔ן אַתָּ֗ה וּ/בָנֶ֤י/ךָ וּ/בֵית אָבִ֨י/ךָ֙ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֣ן הַ/מִּקְדָּ֑שׁ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ תִּשְׂא֖וּ אֶת עֲוֺ֥ן כְּהֻנַּתְ/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/001.yaml
  text: Then Yahweh said to Aaron[a], “You and your sons and your father’s house with you shall bear the iniquity of the sanctuary[b], and you and your sons with you shall bear the iniquity of your priesthood.”
translation:
  language: hi
  text: तब याहवे ने हारून से कहा, “तुम, तुम्हारे पुत्र और तुम्हारे साथ तुम्हारे पिता का घराना पवित्रस्थान के अधर्म का भार उठाओगे[a]; और तुम और तुम्हारे साथ तुम्हारे पुत्र अपने याजकपद के अधर्म का भार उठाओगे[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान के दोष का भार उठाओगे”; हिब्रू मुहावरे का अर्थ पवित्रस्थान से जुड़े अपराधों की जिम्मेदारी उठाना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने याजकपद के दोष का भार उठाओगे”; हिब्रू मुहावरे का अर्थ याजकीय पद से जुड़े अपराधों की जिम्मेदारी उठाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिब्रू चतुरक्षरीय नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाची रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֵית אָבִיךָ
  choice: तुम्हारे पिता का घराना
  rationale: यह भौतिक घर नहीं, बल्कि पैतृक परिवार अथवा कुल का सूचक हिब्रू संबंध-वाचक मुहावरा है; ‘घराना’ हिन्दी में इस सामूहिक अर्थ को स्पष्ट करता है।
- source_word: אִתָּךְ
  choice: तुम्हारे साथ
  rationale: दोनों उपवाक्यों में संगति का सीधा अर्थ और मूल की पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: תִּשְׂאוּ אֶת עֲוֺן
  choice: अधर्म का भार उठाओगे
  rationale: ‘उठाना’ और ‘अधर्म’ वाले हिब्रू मुहावरे को स्वाभाविक हिन्दी में ‘भार’ के साथ व्यक्त किया गया है, ताकि दोष, दायित्व और उसके परिणाम सहने की अर्थ-व्याप्ति बनी रहे।
- source_word: הַמִּקְדָּשׁ
  choice: पवित्रस्थान
  rationale: यह पवित्र उपासना-स्थल और उससे संबंधित पवित्र क्षेत्र को दर्शाता है; ‘पवित्रस्थान’ हिन्दी बाइबलीय प्रयोग में स्पष्ट और प्रतिष्ठित शब्द है।
- source_word: כְּהֻנַּתְכֶם
  choice: अपने याजकपद
  rationale: यह हारून और उसके पुत्रों के याजकीय पद तथा सेवा को दर्शाता है; ‘याजकपद’ संस्थागत अर्थ को संक्षेप में सुरक्षित रखता है।
theological_decisions:
- issue: याजकीय संदर्भ में ‘अधर्म का भार उठाना’ का अर्थ
  choice: मूल मुहावरे को रखते हुए दोष, दायित्व और परिणाम सहने के बीच अर्थगत तनाव सुरक्षित रखा गया है।
  alternative: पवित्रस्थान अथवा याजकीय सेवा से जुड़े अपराधों के लिए उत्तरदायी होना
  rationale: हिब्रू पदबंध दोष वहन करने के साथ-साथ पवित्र सेवा में हुए उल्लंघनों की जिम्मेदारी भी सूचित कर सकता है। किसी एक अर्थ तक सीमित करने से मूल की व्यापकता घट जाती।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अधर्म का भार उठाना’ औपचारिक धर्मवैज्ञानिक मुहावरे को बनाए रखता है, जबकि पादटिप्पणियाँ उसके संभावित दायित्व-संबंधी अर्थ को स्पष्ट करती हैं।
