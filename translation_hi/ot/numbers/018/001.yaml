  terminology: ‘याहवे,’ ‘हारून,’ ‘पवित्रस्थान,’ and ‘याजकपद’ are consistent, intelligible renderings. ‘अधर्म’ is a viable broad equivalent for עָוֹן in the main text, while the footnotes responsibly supply ‘दोष’ and responsibility as alternatives.
