  text: וְ/אָמַרְתָּ֖ אֲלֵ/הֶ֑ם בַּ/הֲרִֽימְ/כֶ֤ם אֶת חֶלְבּ/וֹ֙ מִמֶּ֔/נּוּ וְ/נֶחְשַׁב֙ לַ/לְוִיִּ֔ם כִּ/תְבוּאַ֥ת גֹּ֖רֶן וְ/כִ/תְבוּאַ֥ת יָֽקֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/030.yaml
  text: And you shall say to them[a], ‘When you lift up its best part from it, it shall be counted to the Levites as the produce of the threshing floor and as the produce of the winepress.’
translation:
  language: hi
  text: और तुम उनसे कहना, ‘जब तुम उसमें से उसका उत्तम भाग[a] उठाकर अर्पित करोगे, तब वह लेवियों के लिए खलिहान की उपज और दाखरस के कुंड की उपज के समान माना जाएगा।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘उसकी चरबी’ है; यहाँ यह उपज के सबसे समृद्ध या उत्तम भाग के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और तुम उनसे कहना
  rationale: मूसा को दिए गए प्रत्यक्ष आदेश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּהֲרִימְכֶם
  choice: जब तुम ... उठाकर अर्पित करोगे
  rationale: हिफ़ील रूप में योगदान को अलग करके प्रस्तुत करने का भाव है; संयुक्त अभिव्यक्ति मूल के ‘उठाने’ वाले रूपक और अर्पण के प्रसंग दोनों को स्पष्ट करती है।
- source_word: חֶלְבּוֹ
  choice: उसका उत्तम भाग
  rationale: शाब्दिक अर्थ ‘उसकी चरबी’ है, पर उपज के संदर्भ में यह मुहावरे के रूप में सबसे समृद्ध या उत्तम अंश को दर्शाता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: यह उस दशमांश की ओर संकेत करता है जिसमें से उत्तम अंश अलग किया जाना है।
- source_word: וְנֶחְשַׁב
  choice: माना जाएगा
  rationale: निष्क्रिय रूप के लेखा-संबंधी और वैधानिक भाव को सहज हिन्दी में बनाए रखता है।
- source_word: לַלְוִיִּם
  choice: लेवियों के लिए
  rationale: लेवियों के संबंध में उस अर्पित भाग को किस रूप में गिना जाएगा, यह दातृ-संबंध स्पष्ट करता है।
- source_word: כִּתְבוּאַת גֹּרֶן
  choice: खलिहान की उपज के समान
  rationale: कृषि-बिंब और तुलनात्मक संरचना दोनों को सुरक्षित रखता है।
- source_word: וְכִתְבוּאַת יָקֶב
  choice: और दाखरस के कुंड की उपज के समान
  rationale: יֶקֶב अंगूर दबाने और रस एकत्र करने की व्यवस्था को दर्शाता है; ‘दाखरस का कुंड’ परिचित बाइबलीय कृषि-बिंब को व्यक्त करता है।
