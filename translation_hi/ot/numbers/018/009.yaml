source:
  edition: WLC
  text: זֶֽה יִהְיֶ֥ה לְ/ךָ֛ מִ/קֹּ֥דֶשׁ הַ/קֳּדָשִׁ֖ים מִן הָ/אֵ֑שׁ כָּל קָ֠רְבָּנָ/ם לְֽ/כָל מִנְחָתָ֞/ם וּ/לְ/כָל חַטָּאתָ֗/ם וּ/לְ/כָל אֲשָׁמָ/ם֙ אֲשֶׁ֣ר יָשִׁ֣יבוּ לִ֔/י קֹ֣דֶשׁ קָֽדָשִׁ֥ים לְ/ךָ֛ ה֖וּא וּ/לְ/בָנֶֽי/ךָ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/009.yaml
  text: 'This shall be yours from the most holy things[a], from the fire: every offering of theirs, every grain offering of theirs, every sin offering of theirs, and every guilt offering of theirs, which they return to me[c][b]. It is most holy for you and for your sons.'
translation:
  language: hi
  text: 'परमपवित्र वस्तुओं में से आग से अलग रखा गया भाग[a] तुम्हारा होगा: उनके हर चढ़ावे, हर अन्नबलि, हर पापबलि[b] और हर दोषबलि[c], जो वे मुझे लौटाएँगे[d]। वह तुम्हारे और तुम्हारे पुत्रों के लिए परमपवित्र है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आग में से।” प्रसंग में आशय उन बलिदानी अंशों से है जो आग में जलाए जाने के बजाय याजकों के लिए अलग रखे जाते थे।
    reason: lexical_alternative
  - marker: b
    text: “पापबलि” का अनुवाद “शुद्धिकरण-बलि” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “दोषबलि” का अनुवाद “क्षतिपूर्ति-बलि” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: “लौटाएँगे” का अर्थ यहाँ “अर्पित करेंगे” या, विशेषकर क्षतिपूर्ति के प्रसंग में, “चुकाएँगे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקֹּדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र वस्तुओं में से
  rationale: यहाँ इब्रानी पद सर्वोच्च पवित्रता-श्रेणी के बलिदानी अंशों को बताता है, न कि भवन के ‘परमपवित्र स्थान’ को।
- source_word: מִן הָאֵשׁ
  choice: आग से अलग रखा गया भाग
  rationale: शाब्दिक अर्थ ‘आग में से’ है। प्रसंग में आशय उस याजकीय अंश से है जो आग में जलाए जाने के बजाय अलग रखा जाता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: קָרְבָּנָם
  choice: उनका हर चढ़ावा
  rationale: קָרְבָּן परमेश्वर के निकट लाए गए चढ़ावे का सामान्य शब्द है; ‘चढ़ावा’ सहज और व्यापक है।
- source_word: מִנְחָתָם
  choice: हर अन्नबलि
  rationale: याजकीय बलिदान-विधि में מִנְחָה सामान्यतः अनाज से बने चढ़ावे को दर्शाता है।
- source_word: חַטָּאתָם
  choice: हर पापबलि
  rationale: बलिदानी सूची में यह पाप से संबंधित बलि है। प्रचलित पद ‘पापबलि’ रखा गया है और शुद्धिकरण-संबंधी वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲשָׁמָם
  choice: हर दोषबलि
  rationale: אָשָׁם दोष और उससे जुड़ी क्षतिपूर्ति की बलि को दर्शाता है। ‘दोषबलि’ परिचित है; ‘क्षतिपूर्ति-बलि’ पादटिप्पणी में सुरक्षित है।
- source_word: אֲשֶׁר יָשִׁיבוּ לִי
  choice: जिसे वे मुझे लौटाएँगे
  rationale: שוב के हिफ़ील रूप की ‘वापस करना/लौटाना’ वाली छवि को बनाए रखा गया है। हिंदी में असामान्य लग सकने के कारण व्यापक प्रसंगगत विकल्प पादटिप्पणी में दिया गया है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: यह बलिदानी अंशों की पवित्रता की सर्वोच्च श्रेणी बताने वाला विधेय है।
- source_word: לְךָ ... וּלְבָנֶיךָ
  choice: तुम्हारे और तुम्हारे पुत्रों के लिए
  rationale: संबोधन हारून और उसके पुरुष याजकीय वंशजों से है; इसलिए ‘पुत्रों’ को लिंग-निरपेक्ष नहीं किया गया।
theological_decisions:
- issue: बलिदानी पवित्रता की शब्दावली को भीतरी पवित्रस्थान से अलग रखना
  choice: परमपवित्र वस्तुएँ / परमपवित्र
  alternative: पवित्रों का पवित्र / परमपवित्र स्थान
  rationale: इस पद में अभिव्यक्ति बलिदानी वस्तुओं की श्रेणी बताती है, किसी स्थान या कक्ष का नाम नहीं।
- issue: हारून के याजकीय वंशजों का लिंग-सूचक उल्लेख
  choice: पुत्रों
  alternative: संतानों / वंशजों
  rationale: मूल पाठ स्पष्ट रूप से ‘पुत्रों’ कहता है और इस याजकीय प्रसंग में पुरुष-संदर्भ विशिष्ट है।
- issue: שוב के कारण लौटाने और सामान्य अर्पण के बीच अर्थगत तनाव
  choice: मुझे लौटाएँगे
  alternative: मुझे अर्पित करेंगे / मुझे चुकाएँगे
  rationale: मुख्य पाठ मूल क्रिया की लौटाने की छवि को बनाए रखता है; पादटिप्पणी बताती है कि बलिदानी प्रसंग में इसका व्यापक आशय परमेश्वर को अर्पित करना भी समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अन्नबलि’, ‘पापबलि’ और ‘दोषबलि’ जैसे स्थापित बलिदानी पद बनाए गए हैं। वाक्य में डैश सूची को स्पष्ट करता है, जबकि पादटिप्पणियाँ मूल इब्रानी की वास्तविक अर्थगत संभावनाएँ सुरक्षित रखती हैं।
