source:
  edition: WLC
  text: וַ/אֲנִ֗י הִנֵּ֤ה לָקַ֨חְתִּי֙ אֶת אֲחֵי/כֶ֣ם הַ/לְוִיִּ֔ם מִ/תּ֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֶ֞ם מַתָּנָ֤ה נְתֻנִים֙ לַֽ/יהוָ֔ה לַ/עֲבֹ֕ד אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/006.yaml
  text: And I—behold[a], I have taken your brothers the Levites from among the sons of Israel, given to you as a gift, given to Yahweh, to perform the service of the tent of meeting.
translation:
  language: hi
  text: और मैं—देखो—मैंने तुम्हारे भाई लेवियों को इस्राएल के पुत्रों[a] के बीच से ले लिया है। वे तुम्हें भेंट के रूप में दिए गए हैं, और याहवे को दिए गए हैं, मिलापवाले तंबू की सेवा करने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: शाब्दिक पारिवारिक अभिव्यक्ति के साथ उसका स्वाभाविक सामुदायिक अर्थ बताना।
lexical_decisions:
- source_word: וַאֲנִי הִנֵּה
  choice: और मैं—देखो
  rationale: संयोजक, बलसूचक प्रथम-पुरुष सर्वनाम और הִנֵּה की ध्यान आकर्षित करने वाली शक्ति को बनाए रखता है; डैश दिव्य वक्ता के ‘मैं’ पर पड़े बल को स्वाभाविक हिंदी में दर्शाता है।
- source_word: לָקַחְתִּי
  choice: मैंने ... ले लिया है
  rationale: मूल क्रिया ‘लेना’ को बनाए रखते हुए पूर्ण क्रिया की वर्तमान प्रासंगिकता व्यक्त करता है; ‘चुन लिया’ कहना मूल से अधिक व्याख्यात्मक होता।
- source_word: אֲחֵיכֶם הַלְוִיִּם
  choice: तुम्हारे भाइयों, लेवियों को
  rationale: पारिवारिक-सामुदायिक संबंध सूचित करने वाले ‘भाइयों’ और जातीय पदनाम ‘लेवियों’ दोनों को स्पष्ट रखता है।
- source_word: מִתּוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच से
  rationale: בְּנֵי יִשְׂרָאֵל की शाब्दिक पारिवारिक अभिव्यक्ति और बड़े समुदाय में से अलग किए जाने का भाव सुरक्षित रहता है।
- source_word: לָכֶם מַתָּנָה נְתֻנִים
  choice: तुम्हें भेंट के रूप में दिए गए हैं
  rationale: מַתָּנָה और נְתֻנִים के ‘भेंट/दिए गए’ संबंध को बनाए रखते हुए हिंदी में स्वाभाविक विधेय बनाता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: לַעֲבֹד אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: ताकि वे मिलापवाले तंबू की सेवा करें
  rationale: עבד/עבדה के सेवा-संबंधी अर्थ को स्पष्ट और सहज हिंदी में रखता है; ‘मिलापवाला तंबू’ אוהל מועד का प्रचलित हिंदी बाइबलीय पद है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापरक लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל की लिंग-सूचक पारिवारिक भाषा
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल के लोगों
  rationale: मूल की औपचारिक अभिव्यक्ति को सुरक्षित रखा गया है, जबकि अधिक सहज सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
- issue: लेवियों का दोहरा दिया जाना
  choice: तुम्हें भेंट के रूप में दिए गए हैं, और याहवे को दिए गए हैं
  alternative: याहवे की ओर से तुम्हें भेंट किए गए हैं
  rationale: मूल में לָכֶם और לַיהוָה दोनों संबंध साथ रखे गए हैं। अनुवाद इस धर्मवैज्ञानिक तनाव को बनाए रखता है कि लेवी हारून और उसके पुत्रों को भेंट हैं, फिर भी याहवे को समर्पित हैं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमामय, स्पष्ट शैली अपनाई गई है। ‘भेंट’, ‘सेवा’ और ‘मिलापवाला तंबू’ जैसे परिचित बाइबलीय पद रखे गए हैं, पर वाक्य-विन्यास को सामान्य पाठक के लिए सहज बनाया गया है।
