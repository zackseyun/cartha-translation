source:
  edition: WLC
  text: מִ/כֹּל֙ מַתְּנֹ֣תֵי/כֶ֔ם תָּרִ֕ימוּ אֵ֖ת כָּל תְּרוּמַ֣ת יְהוָ֑ה מִ/כָּל חֶלְבּ֔/וֹ אֶֽת מִקְדְּשׁ֖/וֹ מִמֶּֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/029.yaml
  text: From all your gifts you shall lift up every offering of Yahweh[a]; from all its best part[b], the holy portion from it.
translation:
  language: hi
  text: तुम अपने सभी दानों में से यहोवा के लिए पूरा अर्पण उठाकर चढ़ाओगे—हर दान के सर्वोत्तम भाग[a] में से उसका पवित्र भाग[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: ‘उसकी सारी चरबी’; यहाँ आशय हर दान के सबसे उत्तम या चुने हुए भाग से है।'
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसका पवित्रीकृत भाग।’
    reason: lexical_alternative
lexical_decisions:
- source_word: מִכֹּל מַתְּנֹתֵיכֶם
  choice: अपने सभी दानों में से
  rationale: מִן के पृथक्करण-सूचक अर्थ और כֹּל की समग्रता को स्वाभाविक हिन्दी में व्यक्त करता है; מַתָּנוֹת के लिए ‘दान’ इस याजकीय प्रसंग में उपयुक्त और व्यापक है।
- source_word: תָּרִימוּ
  choice: अलग करके चढ़ाना
  rationale: רוּם के हिफ़ील रूप में किसी अंश को उठाकर अलग करने की बलिदानी धारणा है। ‘अलग करके चढ़ाना’ इस तकनीकी भाव को केवल ‘देना’ की तुलना में अधिक स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל תְּרוּמַת יְהוָה
  choice: यहोवा का प्रत्येक अर्पण
  rationale: תְּרוּמָה अलग करके चढ़ाए गए अंश या अर्पण को दर्शाता है। संबंधवाचक रचना को ‘यहोवा का’ रखकर उसके स्वामित्व/समर्पण की मूल संक्षिप्तता सुरक्षित रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ द्वारा प्रस्तुत किया गया है।
- source_word: מִכָּל חֶלְבּוֹ
  choice: हर दान के सर्वोत्तम भाग में से
  rationale: חֵלֶב का मूल अर्थ ‘चरबी’ है, पर यहाँ दानों के संदर्भ में यह उनके सबसे उत्तम या चुने हुए भाग का मुहावरेदार संकेत है। एकवचन प्रत्यय के सामूहिक संदर्भ को स्पष्ट करने के लिए ‘हर दान’ कहा गया है।
- source_word: אֶת מִקְדְּשׁוֹ מִמֶּנּוּ
  choice: उसका पवित्र भाग
  rationale: מִקְדָּשׁ यहाँ उस अंश को दर्शाता है जो पवित्र करके अलग रखा गया है। ‘उसका पवित्र भाग’ प्रत्यय को व्यक्त करता है; ‘में से’ पहले ही वाक्यांश में होने के कारण अन्त में उसकी अस्वाभाविक पुनरावृत्ति नहीं की गई।
theological_decisions:
- issue: परमेश्वर के व्यक्तिगत नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना हिन्दी पाठक के लिए पहचानने योग्य रूप में रखता है।
- issue: מִקְדְּשׁוֹ का आशय
  choice: उसका पवित्र भाग
  alternative: उसका पवित्र किया हुआ भाग
  rationale: यहाँ संज्ञा उस अंश को सूचित करती है जो पवित्र क्षेत्र के लिए अलग किया गया है। संक्षिप्त ‘पवित्र भाग’ मूल की संज्ञात्मक अभिव्यक्ति को बचाता है, जबकि वैकल्पिक क्रियात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। याजकीय तकनीकी भाव को बनाए रखने के लिए ‘अलग करके चढ़ाना’ प्रयुक्त है; डैश दूसरी पंक्ति को पहली आज्ञा की व्याख्या के रूप में स्पष्ट करता है।
