reference: Numbers 18:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַ֣ךְ בְּֽכוֹר שׁ֡וֹר אֽוֹ בְכ֨וֹר כֶּ֜שֶׂב אֽוֹ בְכ֥וֹר עֵ֛ז לֹ֥א תִפְדֶּ֖ה קֹ֣דֶשׁ הֵ֑ם אֶת דָּמָ֞/ם תִּזְרֹ֤ק עַל הַ/מִּזְבֵּ֨חַ֙ וְ/אֶת חֶלְבָּ֣/ם תַּקְטִ֔יר אִשֶּׁ֛ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַֽ/יהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/017.yaml
  text: But you shall not redeem the firstborn of an ox[a], or the firstborn of a sheep, or the firstborn of a goat; they are holy. You shall sprinkle their blood on the altar, and you shall burn their fat as a food offering, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: लेकिन गाय-बैल, भेड़ या बकरी के पहलौठे को मत छुड़ाना; वे पवित्र हैं। उनका लहू वेदी पर छिड़कना और उनकी चरबी जलाकर याहवे के लिए मनभावनी सुगंध वाली अग्नि-भेंट चढ़ाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: लेकिन
  rationale: यह पिछले विधान के भीतर एक अपवाद अथवा सीमा प्रस्तुत करता है; ‘लेकिन’ आधुनिक हिन्दी में इसके विरोधसूचक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכוֹר
  choice: पहलौठा
  rationale: पहली सन्तान, विशेषतः धार्मिक विधान में परमेश्वर के लिए अलग किए गए पहले जन्मे पशु, के लिए यह प्रचलित और सटीक हिन्दी शब्द है।
- source_word: שׁוֹר
  choice: गाय-बैल
  rationale: यहाँ शब्द किसी एक लिंग के पशु से अधिक गोवंश की जाति को सूचित करता है; ‘गाय-बैल’ उस व्यापक जातिगत अर्थ को बनाए रखता है।
- source_word: כֶּשֶׂב
  choice: भेड़
  rationale: सूची में यह किसी विशेष आयु के मेमने के बजाय पशु-जाति का सामान्य उल्लेख है।
- source_word: עֵז
  choice: बकरी
  rationale: बलिदानी पशुओं की सूची में यह बकरी जाति का सीधा और स्वाभाविक हिन्दी नाम है।
- source_word: לֹא תִפְדֶּה
  choice: मत छुड़ाना
  rationale: पुजारीय-कानूनी सन्दर्भ में פדה मूल्य अथवा बदले की वस्तु देकर धार्मिक दायित्व से छुड़ाने को दर्शाता है; ‘छुड़ाना’ हिन्दी में इस क्रिया को स्पष्ट रखता है।
- source_word: קֹדֶשׁ הֵם
  choice: वे पवित्र हैं
  rationale: यह उनके न छुड़ाए जाने का धार्मिक कारण बताने वाला विधेय-वाक्य है और मूल का पवित्रता-संबंधी अर्थ बनाए रखता है।
- source_word: תִּזְרֹק
  choice: छिड़कना
  rationale: बलिदानी विधि में यह लहू को वेदी पर अथवा उसकी ओर डालने-छिड़कने की क्रिया है; ‘छिड़कना’ हिन्दी बाइबलीय और धार्मिक प्रयोग में सहज है।
- source_word: חֶלֶב
  choice: चरबी
  rationale: यह बलिदान में वेदी पर जलाए जाने के लिए सुरक्षित पशु की चरबी को दर्शाता है।
- source_word: תַּקְטִיר
  choice: जलाना
  rationale: हिफ़ील रूप बलिदान को वेदी पर जलाकर धुआँ उठाने को दर्शाता है; ‘जलाना’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह आग के द्वारा चढ़ाई जाने वाली भेंट का धार्मिक पद है; संक्षिप्त ‘अग्नि-भेंट’ मूल की विधि को बनाए रखता है, जबकि अधिक व्याख्यात्मक विकल्प पादटिप्पणी में दिया गया है।
- source_word: רֵיחַ נִיחֹחַ
  choice: मनभावनी सुगन्ध
  rationale: यह स्थापित बलिदानी मुहावरा ऐसी सुगन्ध को दर्शाता है जो परमेश्वर को प्रसन्न करती है; ‘मनभावनी’ उस स्वीकार्यता को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: बलिदानी पद אִשֶּׁה
  choice: अग्नि-भेंट
  alternative: आग में चढ़ाई गई भेंट / भोजन-भेंट
  rationale: शब्द की व्युत्पत्ति और प्रयोग आग द्वारा प्रस्तुत भेंट की ओर संकेत करते हैं। ‘भोजन-भेंट’ सम्भावित धार्मिक भाव को अधिक निश्चित कर देता, इसलिए मुख्य पाठ में अधिक औपचारिक और खुला ‘अग्नि-भेंट’ रखा गया है।
- issue: רֵיחַ נִיחֹחַ में परमेश्वर-संबंधी भाषा
  choice: याहवे के लिए मनभावनी सुगन्ध
  alternative: याहवे को शान्त करने वाली सुगन्ध
  rationale: मुहावरा स्वीकार्य और प्रसन्नकारी बलिदान को दर्शाता है। ‘मनभावनी’ इस भाव को रखता है, पर परमेश्वर को मानवीय क्रोध-शमन की संकीर्ण धारणा में सीमित नहीं करता।
