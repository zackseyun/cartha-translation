  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक-धार्मिक शैली रखी गई है। आज्ञाओं के लिए ‘मत छुड़ाना’, ‘छिड़कना’ और ‘जलाना’ जैसे स्वाभाविक हिन्दी क्रियारूप प्रयुक्त हैं। ‘पहलौठा’, ‘वेदी’, ‘लहू’ और ‘चरबी’ धार्मिक प्रसंग में सामान्य पाठक के लिए समझने योग्य हैं।
