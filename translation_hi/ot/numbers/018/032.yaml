id: NUM.18.32
reference: Numbers 18:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לֹֽא תִשְׂא֤וּ עָלָי/ו֙ חֵ֔טְא בַּ/הֲרִֽימְ/כֶ֥ם אֶת חֶלְבּ֖/וֹ מִמֶּ֑/נּוּ וְ/אֶת קָדְשֵׁ֧י בְנֵי יִשְׂרָאֵ֛ל לֹ֥א תְחַלְּל֖וּ וְ/לֹ֥א תָמֽוּתוּ־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/032.yaml
  text: And you will bear no sin because of it when you lift up its best part from it[a]. You shall not profane the holy things of the sons of Israel[b], and you shall not die.
translation:
  language: hi
  text: जब तुम उसमें से उसका उत्तम भाग[a] उठाकर अर्पित करोगे, तब उसके कारण तुम पर पाप का दोष नहीं आएगा। तुम इस्राएलियों की पवित्र वस्तुओं[b] को अपवित्र न करना, और तुम नहीं मरोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी चरबी” अथवा “उसका सबसे बढ़िया भाग।” इब्रानी शब्द חֶלֶב का शाब्दिक अर्थ “चरबी” है, पर अर्पण के प्रसंगों में यह प्रायः सबसे समृद्ध या उत्तम अंश को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों की पवित्र वस्तुएँ”; यह समूचे इस्राएली समुदाय के लिए प्रचलित अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִשְׂאוּ ... חֵטְא
  choice: तुम पर पाप का दोष नहीं आएगा
  rationale: נשא חטא दोष या पाप का भार उठाने और उत्तरदायी ठहरने का भाव व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए कानूनी-धार्मिक दोष के अर्थ को बनाए रखता है।
- source_word: עָלָיו
  choice: उसके कारण
  rationale: यह सर्वनाम दशमांश अथवा उस पवित्र अंश की ओर संकेत करता है और उस विषय में दोषी होने का संबंध बताता है।
- source_word: בַּהֲרִימְכֶם
  choice: जब तुम ... उठाकर अर्पित करोगे
  rationale: रूम के हिफ़ील रूप में उठाने और अर्पण के रूप में अलग रखने—दोनों का भाव है; संयुक्त हिन्दी अभिव्यक्ति दोनों पहलुओं को स्पष्ट करती है।
- source_word: חֶלְבּוֹ
  choice: उसका उत्तम भाग
  rationale: חֶלֶב का मूल अर्थ 'चरबी' है, पर अर्पण और उपज के प्रसंग में यह सबसे उत्तम या चुने हुए अंश के लिए प्रयुक्त होता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: यह उस दशमांश की ओर लौटता है जिसमें से उत्तम अंश अलग किया जाना है।
- source_word: קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की पवित्र वस्तुओं
  rationale: קָדְשֵׁי का व्यापक अर्थ सुरक्षित रखा गया है, जबकि בני ישראל के लिए आधुनिक हिन्दी में स्वाभाविक सामूहिक नाम 'इस्राएली' अपनाया गया है।
- source_word: תְחַלְּלוּ
  choice: अपवित्र न करना
  rationale: חלל के पिएल रूप का अर्थ पवित्र वस्तु को अपवित्र करना या साधारण मानना है; 'अपवित्र करना' पवित्रता के विरोध को स्पष्ट रखता है।
- source_word: וְלֹא תָמֻתוּ
  choice: और तुम नहीं मरोगे
  rationale: हिब्रू के समन्वयी वाक्य और उसकी वास्तविक विधि-परिणाम संबंधी अस्पष्टता को बनाए रखा गया है; इसे उद्देश्यवाचक 'ताकि' में नहीं बदला गया।
theological_decisions:
- issue: בני ישראל का हिन्दी रूप
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह मानक जातीय-सामुदायिक पद है। 'इस्राएली' आधुनिक हिन्दी में स्त्री-पुरुष सहित पूरे समुदाय को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: חֶלֶב का अर्पण-संबंधी अर्थ
  choice: उत्तम भाग
  alternative: चरबी; सबसे बढ़िया भाग
  rationale: प्रसंग लेवियों द्वारा दशमांश में से अंश अलग करने का है, केवल पशु-चरबी का नहीं। अतः मुहावरे का आशय मुख्य पाठ में दिया गया और मूल अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: अंतिम וְלֹא תָמֻתוּ का संबंध
  choice: और तुम नहीं मरोगे
  alternative: ताकि तुम न मरो; नहीं तो तुम मर जाओगे
  rationale: मूल पाठ साधारण समन्वय से निषेध/परिणाम रखता है। उद्देश्य या चेतावनी का संबंध स्पष्ट करके जोड़ना मूल की संभावित अर्थ-तनाव को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'उठाकर अर्पित करना' धार्मिक योगदान की क्रिया को स्पष्ट करता है, जबकि अंतिम उपवाक्य में हिब्रू का सीधा समन्वय और उसकी अर्थगत तनाव सुरक्षित है।
