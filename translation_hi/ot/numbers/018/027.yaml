translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अंशदान’ प्रसंग की विशिष्टता बनाए रखता है, और शाब्दिक ‘भराव’ की अस्पष्टता को मुख्य पाठ में स्वाभाविक ‘पूरी उपज’ तथा पादटिप्पणी में संरक्षित किया गया है।
