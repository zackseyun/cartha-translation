  text: וְ/נֶחְשַׁ֥ב לָ/כֶ֖ם תְּרוּמַתְ/כֶ֑ם כַּ/דָּגָן֙ מִן הַ/גֹּ֔רֶן וְ/כַֽ/מְלֵאָ֖ה מִן הַ/יָּֽקֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/027.yaml
  text: And your contribution will be reckoned to you like grain from the threshing floor and like the fullness from the winepress[a][b][c].
translation:
  language: hi
  text: और तुम्हारा अंशदान[a][b] तुम्हारे लिए खलिहान से निकले अनाज और दाखरस के कुंड से मिली पूरी उपज के समान गिना जाएगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी भेंट’।
    reason: lexical_alternative
  - marker: b
    text: 'परंपरागत अनुवाद: ‘उठाई हुई भेंट’।'
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से ‘दाखरस के कुंड का भराव’, अर्थात् कुंड से प्राप्त पूरी उपज।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנֶחְשַׁב
  choice: गिना जाएगा
  rationale: निफ़अल रूप यहाँ किसी वस्तु को किसी के खाते में मानने या उसके समकक्ष ठहराने का भाव देता है। ‘गिना जाएगा’ आधुनिक हिन्दी में स्पष्ट है और विधिक-अनुष्ठानिक संदर्भ के अनुकूल है।
- source_word: תְּרוּמַתְכֶם
  choice: तुम्हारा अंशदान
  rationale: תְּרוּמָה पवित्र उपयोग के लिए अलग किए गए अंश को दर्शाता है। यहाँ लेवियों द्वारा दशमांश में से दिए जाने वाले अंश के लिए ‘अंशदान’ सटीक और स्वाभाविक है।
- source_word: כַּדָּגָן מִן הַגֹּרֶן
  choice: मानो वह खलिहान का अनाज ... हो
  rationale: तुलनात्मक כ को ‘मानो ... हो’ से व्यक्त किया गया है; דָּגָן अनाज और גֹּרֶן खलिहान को दर्शाते हैं। यह हिन्दी में सहज रहते हुए कृषि-बिंब बनाए रखता है।
- source_word: וְכַמְלֵאָה מִן הַיָּקֶב
  choice: और दाखरस के कुंड की पूरी उपज
  rationale: מְלֵאָה का शाब्दिक भाव ‘भराव/परिपूर्णता’ है, पर यहाँ समानांतर कृषि-संदर्भ में कुंड से प्राप्त पूरी उपज अभिप्रेत है। יֶקֶב को ‘दाखरस का कुंड’ कहना उस स्थान/पात्र को स्पष्ट करता है जहाँ अंगूर का रस एकत्र होता है।
