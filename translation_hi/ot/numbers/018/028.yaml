  text: כֵּ֣ן תָּרִ֤ימוּ גַם אַתֶּם֙ תְּרוּמַ֣ת יְהוָ֔ה מִ/כֹּל֙ מַעְשְׂרֹ֣תֵי/כֶ֔ם אֲשֶׁ֣ר תִּקְח֔וּ מֵ/אֵ֖ת בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/נְתַתֶּ֤ם מִמֶּ֨/נּוּ֙ אֶת תְּרוּמַ֣ת יְהוָ֔ה לְ/אַהֲרֹ֖ן הַ/כֹּהֵֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/028.yaml
  text: So you also shall present Yahweh’s contribution from all your tithes[a], which you receive from the sons of Israel, and from it you shall give Yahweh’s contribution to Aaron the priest.
translation:
  language: hi
  text: इसी प्रकार तुम भी उन सब दशमांशों में से, जो तुम्हें इस्राएलियों[a] से प्राप्त होते हैं, यहोवा का चढ़ावा अलग करोगे; और उसमें से यहोवा का चढ़ावा हारून याजक को दोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘इस्राएल के पुत्रों’। इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֵּן
  choice: इसी प्रकार
  rationale: यह पिछले आदेश के अनुरूप अब लेवियों पर लागू होनेवाले निर्देश को जोड़ता है।
- source_word: תָּרִימוּ
  choice: अलग करना
  rationale: हिफ़ील रूप, תְּרוּמָה के साथ, किसी अंश को समर्पित करने के लिए अलग रखने का भाव देता है; हिंदी में यह कर्मकाण्डीय आशय स्वाभाविक ढंग से व्यक्त होता है।
- source_word: גַם אַתֶּם
  choice: तुम भी
  rationale: यह बल देता है कि इस्राएलियों की तरह लेवियों को भी मिले हुए दशमांश में से अंश अलग करना है।
- source_word: תְּרוּמַת יְהוָה
  choice: यहोवा का अंश
  rationale: תְּרוּמָה यहाँ अलग करके समर्पित किए गए हिस्से को दर्शाता है; ‘अंश’ बलिदान की किसी संकीर्ण श्रेणी का अनावश्यक संकेत नहीं देता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को हिंदी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִכֹּל מַעְשְׂרֹתֵיכֶם
  choice: अपनी सारी दशमांशों में से
  rationale: बहुवचन और מִן के अंशवाचक भाव को सुरक्षित रखते हुए मानक धार्मिक शब्द ‘दशमांश’ रखा गया है।
- source_word: אֲשֶׁר תִּקְחוּ מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: जो तुम इस्राएल के पुत्रों से प्राप्त करते हो
  rationale: इस व्यवस्थापरक संदर्भ में לקח का अर्थ वैध रूप से ‘प्राप्त करना’ है; בְּנֵי יִשְׂרָאֵל की शाब्दिक वाचागत अभिव्यक्ति मुख्य पाठ में रखी गई है।
- source_word: וּנְתַתֶּם מִמֶּנּוּ
  choice: और उसमें से ... देना
  rationale: प्राप्त दशमांश में से एक हिस्सा देने का अंशवाचक संबंध स्पष्ट रखा गया है।
- source_word: לְאַהֲרֹן הַכֹּהֵן
  choice: हारून याजक को
  rationale: לְ प्राप्तकर्ता को सूचित करता है; उपाधि ‘याजक’ भी सुरक्षित रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिंदी के सामान्य बाइबलीय पाठकों के लिए परिचित ‘यहोवा’ नाम को शीर्षक ‘प्रभु’ से बदलने के बजाय सुरक्षित रखा गया है।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ में हिब्रू की शाब्दिक, पुल्लिंग वाचागत अभिव्यक्ति रखी गई है, जबकि स्वाभाविक सामूहिक विकल्प पादटिप्पणी में दिया गया है।
- issue: תְּרוּמַת יְהוָה का संबंध
  choice: यहोवा का अंश
  alternative: यहोवा के लिए अंश
  rationale: हिब्रू संबंधवाचक रचना स्वामित्व अथवा समर्पण—दोनों की छाया रख सकती है; ‘यहोवा का अंश’ मूल की संक्षिप्तता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। आदेशात्मक भविष्य का हिंदी में स्वाभाविक निर्देशात्मक रूप ‘अलग करना ... देना’ रखा गया है।
