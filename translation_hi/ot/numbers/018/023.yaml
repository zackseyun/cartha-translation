id: NUM.18.23
reference: Numbers 18:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָבַ֨ד הַ/לֵּוִ֜י ה֗וּא אֶת עֲבֹדַת֙ אֹ֣הֶל מוֹעֵ֔ד וְ/הֵ֖ם יִשְׂא֣וּ עֲוֺנָ֑/ם חֻקַּ֤ת עוֹלָם֙ לְ/דֹרֹ֣תֵי/כֶ֔ם וּ/בְ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/023.yaml
  text: But the Levite himself shall serve the service of the tent of meeting, and they shall bear their iniquity. It is a permanent statute throughout your generations, and among the sons of Israel they shall not inherit an inheritance.
translation:
  language: hi
  text: परन्तु लेवी स्वयं मिलापवाले तम्बू की सेवा करेगा, और वे अपने अधर्म का भार उठाएँगे।[a] यह तुम्हारी पीढ़ी-पीढ़ी के लिए सदा की विधि है। इस्राएल के पुत्रों के बीच उन्हें कोई विरासत नहीं मिलेगी।[b][c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे अपने दोष का भार उठाएँगे।” इब्रानी मुहावरा दोष, अधर्म अथवा उससे जुड़े दायित्व और परिणाम को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “इस्राएलियों के बीच।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों के बीच” है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “वे विरासत में कोई विरासत नहीं पाएँगे।” इब्रानी की यह पुनरुक्ति गोत्रीय भूमि की विरासत न मिलने पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַד
  choice: सेवा करेगा
  rationale: कानूनी निर्देश के प्रसंग में यह रूप भावी तथा आदेशात्मक बल रखता है। ‘सेवा करेगा’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַלֵּוִי הוּא
  choice: लेवी स्वयं
  rationale: स्वतंत्र सर्वनाम הוּא ‘लेवी’ पर बल देता है। ‘स्वयं’ इस बल को व्यक्त करता है, पर अनावश्यक रूप से पूर्ण बहिष्करण का अर्थ नहीं जोड़ता।
- source_word: עֲבֹדַת אֹהֶל מוֹעֵד
  choice: मिलापवाले तम्बू की सेवा
  rationale: עֲבֹדָה यहाँ पवित्रस्थान से जुड़ी निर्धारित सेवा को दर्शाता है। ‘मिलापवाला तम्बू’ אֹהֶל מוֹעֵד का प्रचलित और सुबोध हिन्दी रूप है।
- source_word: וְהֵם יִשְׂאוּ עֲוֺנָם
  choice: वे अपने अधर्म का भार उठाएँगे
  rationale: नשא עון कानूनी-उपासना संबंधी मुहावरा है। यह अनुवाद दोष, दायित्व और परिणाम के बीच मूल पाठ की अर्थगत व्यापकता को संकुचित किए बिना उसके चित्र को बनाए रखता है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह वाक्यांश पीढ़ियों तक लागू रहने वाले स्थायी विधान को दर्शाता है। ‘सदा की विधि’ आधुनिक, संक्षिप्त और गरिमापूर्ण है।
- source_word: לְדֹרֹתֵיכֶם
  choice: तुम्हारी पीढ़ी-पीढ़ी के लिए
  rationale: यह पीढ़ियों के क्रम में लगातार लागू रहने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבְתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच
  rationale: यह मूल के בְּנֵי יִשְׂרָאֵל को औपचारिक रूप से सुरक्षित रखता है; अधिक स्वाभाविक जातिसूचक विकल्प फुटनोट में दिया गया है।
- source_word: לֹא יִנְחֲלוּ נַחֲלָה
  choice: उन्हें कोई विरासत नहीं मिलेगी
  rationale: यह निषेध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है। मूल की सजातीय क्रिया-संज्ञा पुनरुक्ति को फुटनोट में सुरक्षित किया गया है।
theological_decisions:
- issue: लेवियों के अधर्म, दोष अथवा उससे जुड़े दायित्व का वहन
  choice: अपने अधर्म का भार उठाएँगे
  alternative: अपने दोष का भार उठाएँगे; अपने पाप का दण्ड भोगेंगे
  rationale: मूल मुहावरा यह स्पष्ट नहीं करता कि यहाँ मुख्य बल नैतिक दोष, कानूनी दायित्व या उसके परिणाम पर है। चित्रात्मक भाषा बनाए रखने से यह धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: लेवी के लिए इस्राएल में विरासत का निषेध
  choice: उन्हें कोई विरासत नहीं मिलेगी
  alternative: वे किसी विरासत के वारिस नहीं होंगे; वे विरासत में कोई विरासत नहीं पाएँगे
  rationale: मुख्य पाठ में भूमि-विरासत से वंचित होने का आशय स्पष्ट रखा गया है, जबकि मूल की जोरदार पुनरुक्ति फुटनोट में बताई गई है; किसी विशेष सम्प्रदायगत व्याख्या को नहीं जोड़ा गया।
- issue: בְּנֵי יִשְׂרָאֵל का जातीय और पुल्लिंग रूप
  choice: इस्राएल के पुत्रों के बीच
  alternative: इस्राएलियों के बीच
  rationale: मुख्य पाठ मूल की पुल्लिंग बहुवचन अभिव्यक्ति को बनाए रखता है, जबकि उसका स्वाभाविक जातिसूचक अर्थ फुटनोट में उपलब्ध है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कानूनी-उपासना संबंधी शब्दावली में ‘सेवा’, ‘विधि’ और ‘विरासत’ का प्रयोग किया गया है। इब्रानी में एकवचन ‘लेवी’ से बहुवचन ‘वे’ की ओर परिवर्तन मूल पाठ के सामूहिक संदर्भ को सुरक्षित रखने के लिए ज्यों का त्यों रखा गया है।
