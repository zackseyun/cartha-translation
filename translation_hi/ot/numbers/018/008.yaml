source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָה֮ אֶֽל אַהֲרֹן֒ וַ/אֲנִי֙ הִנֵּ֣ה נָתַ֣תִּֽי לְ/ךָ֔ אֶת מִשְׁמֶ֖רֶת תְּרוּמֹתָ֑/י לְ/כָל קָדְשֵׁ֣י בְנֵֽי יִ֠שְׂרָאֵל לְ/ךָ֨ נְתַתִּ֧י/ם לְ/מָשְׁחָ֛ה וּ/לְ/בָנֶ֖י/ךָ לְ/חָק עוֹלָֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/008.yaml
  text: 'Then Yahweh spoke to Aaron: “And I[a], behold, I have given you the charge of my contributions, all the holy gifts of the sons of Israel. I have given them to you as your anointing portion[c][b], and to your sons as a permanent statute.”'
translation:
  language: hi
  text: तब यहवे ने हारून से कहा, “और देखो, मैंने स्वयं अपनी भेंटों—अर्थात् इस्राएल के पुत्रों की सभी पवित्र भेंटों—की ज़िम्मेदारी तुम्हें सौंपी है। मैंने उन्हें तुम्हें तुम्हारे अभिषिक्त याजकीय पद के कारण मिलने वाले हिस्से के रूप में, और तुम्हारे पुत्रों को सदा की विधि के रूप में दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַאֲנִי הִנֵּה
  choice: और देख, मैंने स्वयं
  rationale: וַאֲנִי के बलाघात और הִנֵּה के ध्यान आकर्षित करने वाले भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשְׁמֶרֶת
  choice: देखरेख
  rationale: यहाँ सौंपे गए याजकीय दायित्व और अभिरक्षा का भाव है; 'देखरेख सौंपी है' आधुनिक हिन्दी में स्पष्ट है।
- source_word: תְּרוּמֹתַי
  choice: अपने उठाए हुए अंशों
  rationale: תְּרוּמָה का मूलतः अलग करके अथवा उठाकर दिए गए अंश का भाव बचाता है और सामान्य 'भेंट' से इसका भेद दिखाता है।
- source_word: לְכָל קָדְשֵׁי בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की सभी पवित्र भेंटों की
  rationale: संदर्भ में קָדְשֵׁי समर्पित पवित्र वस्तुओं या भेंटों को दर्शाता है; בְנֵי יִשְׂרָאֵל की वाचायी अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: לְמָשְׁחָה
  choice: तुम्हारे अभिषेक के हिस्से के रूप में
  rationale: अर्थ को हारून के अभिषिक्त याजकीय पद से जुड़े नियत हिस्से के रूप में प्रस्तुत करता है, जबकि वैकल्पिक शाब्दिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לְחָק עוֹלָם
  choice: सदा की विधि के रूप में
  rationale: חֹק के नियत कानूनी प्रावधान और עוֹלָם की स्थायी निरंतरता को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: לְמָשְׁחָה में याजकीय अधिकार का अर्थ
  choice: तुम्हारे अभिषेक के हिस्से के रूप में
  alternative: अभिषेक के लिए
  rationale: संदर्भ में भेंटों का अनुदान हारून के अभिषिक्त पद से जुड़ा है, न कि आवश्यक रूप से किसी नए अभिषेक-अनुष्ठान से; फिर भी हिब्रू की संक्षिप्तता के कारण वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: בְנֵי יִשְׂרָאֵל का निर्वचन
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल की मानक वाचायी राष्ट्रीय संज्ञा और उसका औपचारिक पुरुषवाची रूप सुरक्षित रखा गया है।
- issue: תְּרוּמָה का अनुष्ठानिक अर्थ
  choice: उठाए हुए अंश
  alternative: भेंटें / अर्पण
  rationale: यह अनुवाद अलग करके यहवे को दिए गए नियत अंश का विशिष्ट भाव रखता है, बिना किसी बाद की सांप्रदायिक व्याख्या को जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली रखी गई है। 'यहवे' व्यक्तिगत दिव्य नाम को सुरक्षित रखता है। वाक्य की पुनरुक्ति और औपचारिक अनुदान-भाषा मूल के अनुरूप रखी गई है; तकनीकी शब्दों को पादटिप्पणियों से स्पष्ट किया गया है।
