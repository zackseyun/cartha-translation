  edition: WLC
  text: כֹּ֚ל חֵ֣לֶב יִצְהָ֔ר וְ/כָל חֵ֖לֶב תִּיר֣וֹשׁ וְ/דָגָ֑ן רֵאשִׁיתָ֛/ם אֲשֶׁר יִתְּנ֥וּ לַֽ/יהוָ֖ה לְ/ךָ֥ נְתַתִּֽי/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/012.yaml
  text: All the best of the oil[a], and all the best of the new wine and grain—their firstfruits, which they give to Yahweh—I have given to you.
translation:
  language: hi
  text: तेल का सारा उत्तम भाग[a], और नई दाखमधु और अनाज का सारा उत्तम भाग—उनका पहला अंश, जो वे यहोवा को देते हैं—मैंने तुम्हें दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से तेल, नई दाखमधु और अनाज की ‘चर्बी’; यह उनकी सबसे समृद्ध या उत्तम उपज के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֵלֶב
  choice: उत्तम भाग
  rationale: शाब्दिक अर्थ ‘चर्बी’ है, पर कृषि-उपज के संदर्भ में यह सबसे उत्तम या समृद्ध भाग का मुहावरा है।
- source_word: יִצְהָר
  choice: तेल
  rationale: यह ताज़े तेल, सामान्यतः जैतून के तेल, को दर्शाता है; मूल में जैतून स्पष्ट न होने के कारण ‘तेल’ रखा गया है।
- source_word: תִּירוֹשׁ
  choice: नई दाखमधु
  rationale: यह सामान्य मदिरा के बजाय नई या ताज़ी दाखमधु को दर्शाता है और इब्रानी का शब्दगत भेद बनाए रखता है।
- source_word: דָגָן
  choice: अनाज
  rationale: यह विविध प्रकार की धान्य-उपज के लिए व्यापक शब्द है।
- source_word: רֵאשִׁיתָם
  choice: उनकी उपज का पहला अंश
  rationale: यह इन उपजों के आरम्भिक या प्रथम अर्पित भाग को दर्शाता है; ‘पहला अंश’ अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֲשֶׁר יִתְּנוּ לַיהוָה
  choice: जिसे वे यहोवा को देंगे
  rationale: נתן के सामान्य अर्थ ‘देना’ को बनाए रखते हुए सम्बन्धवाचक उपवाक्य का स्वाभाविक अनुवाद किया गया है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: לְךָ נְתַתִּים
  choice: मैंने तुम्हें दे दिया है
  rationale: पूर्ण क्रिया स्थापित और सम्पन्न अनुदान को व्यक्त करती है; हिन्दी में वस्तु पूर्ववर्ती सूची से स्पष्ट है।
theological_decisions:
- issue: יהוה के व्यक्तिगत नाम का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम उपस्थित है; उसे उपाधि में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरित रूप से रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘उत्तम भाग’ कृषि-उपज के संदर्भ में मुहावरे का अर्थ देता है, जबकि पादटिप्पणी उसके शाब्दिक रूप को सुरक्षित रखती है।
