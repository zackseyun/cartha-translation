source:
  edition: WLC
  text: וּ/פְדוּיָ/ו֙ מִ/בֶּן חֹ֣דֶשׁ תִּפְדֶּ֔ה בְּ/עֶ֨רְכְּ/ךָ֔ כֶּ֛סֶף חֲמֵ֥שֶׁת שְׁקָלִ֖ים בְּ/שֶׁ֣קֶל הַ/קֹּ֑דֶשׁ עֶשְׂרִ֥ים גֵּרָ֖ה הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/016.yaml
  text: 'And those to be redeemed from a month old[a], you shall redeem according to your valuation: five shekels of silver, by the sanctuary shekel; it is twenty gerahs.'
translation:
  language: hi
  text: 'और जिन्हें छुड़ाया जाना है, उन्हें एक महीने की आयु से तुम अपने ठहराए हुए मूल्य के अनुसार छुड़ाओ: पवित्रस्थान के शेकेल के हिसाब से पाँच शेकेल चाँदी। पवित्रस्थान का एक शेकेल बीस गेरा का होता है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְדוּיָו
  choice: जिन्हें छुड़ाया जाना है
  rationale: इब्रानी रूप व्याकरण की दृष्टि से कठिन है; प्रसंग में यह छुड़ाए जाने योग्य पहलौठों को सामूहिक और सामान्य रूप से दर्शाता है। निष्क्रिय अभिव्यक्ति इस अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: מִבֶּן חֹדֶשׁ
  choice: एक महीने की आयु से
  rationale: यह मुहावरा एक माह की आयु से आरम्भ होने वाली सीमा बताता है।
- source_word: תִּפְדֶּה
  choice: तुम ... छुड़ाना
  rationale: कानूनी निर्देश में अपूर्ण क्रिया दायित्व व्यक्त करती है; हिन्दी में आज्ञार्थक रूप स्वाभाविक और स्पष्ट है।
- source_word: בְּעֶרְכְּךָ
  choice: अपने निर्धारित मूल्य पर
  rationale: याजकीय-कानूनी प्रसंग में यह संबोधित याजक द्वारा निर्धारित मूल्य या आकलन को दर्शाता है।
- source_word: כֶּסֶף חֲמֵשֶׁת שְׁקָלִים
  choice: पाँच शेकेल चाँदी देकर
  rationale: यह चाँदी की मात्रा को बताता है; 'देकर' हिन्दी में छुड़ौती के भुगतान का संबंध स्पष्ट करता है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह मूल्यांकन के मानक भार को निर्दिष्ट करता है; 'पवित्रस्थान का शेकेल' स्पष्ट और परंपरागत पद है।
- source_word: עֶשְׂרִים גֵּרָה הוּא
  choice: एक शेकेल बीस गेरा का होता है
  rationale: इब्रानी सर्वनाम का आशय मानक शेकेल से है। हिन्दी में संज्ञा दोहराने से संभावित भ्रम दूर होता है और मूल अभिप्राय स्पष्ट रहता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी-निर्देशात्मक शैली रखी गई है। 'शेकेल' और 'गेरा' प्राचीन भार-मुद्रा इकाइयों के लिप्यंतर हैं। इब्रानी के कठिन सामूहिक रूप को किसी अतिरिक्त धर्मसैद्धांतिक अर्थ के बिना स्वाभाविक बहुवचन अभिव्यक्ति में प्रस्तुत किया गया है।
