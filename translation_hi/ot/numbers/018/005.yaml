  text: וּ/שְׁמַרְתֶּ֗ם אֵ֚ת מִשְׁמֶ֣רֶת הַ/קֹּ֔דֶשׁ וְ/אֵ֖ת מִשְׁמֶ֣רֶת הַ/מִּזְבֵּ֑חַ וְ/לֹֽא יִהְיֶ֥ה ע֛וֹד קֶ֖צֶף עַל בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/005.yaml
  text: And you shall keep charge of the sanctuary and the charge of the altar[a], so that there may no longer be wrath against the sons of Israel.
translation:
  language: hi
  text: और तुम पवित्र स्थान की रक्षा की जिम्मेदारी और वेदी की रक्षा की जिम्मेदारी निभाना, ताकि इस्राएल के पुत्रों पर फिर प्रकोप न हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֵת מִשְׁמֶרֶת
  choice: तुम ... की देखरेख करना
  rationale: שׁמר और מִשְׁמֶרֶת का यह युग्म सौंपे गए पवित्र दायित्व की रक्षा और जिम्मेदारी निभाने का भाव देता है। आधुनिक हिन्दी में ‘देखरेख करना’ इस प्रशासनिक और रक्षात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: वेदी के साथ प्रयुक्त होने के कारण यहाँ अमूर्त पवित्रता नहीं, बल्कि पवित्र परिसर अथवा धर्मस्थान अभिप्रेत है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान की वेदी के लिए मानक, संक्षिप्त और प्रसंगानुकूल हिन्दी शब्द।
- source_word: וְלֹא יִהְיֶה עוֹד
  choice: ताकि ... फिर ... न हो
  rationale: इब्रानी संरचना औपचारिक रूप से संयोजक और निषेधात्मक अपूर्ण क्रिया है, पर प्रसंग में उचित पहरेदारी के उद्देश्य अथवा परिणाम को व्यक्त करती है। ‘फिर’ עוֹד को दर्शाता है।
- source_word: קֶצֶף
  choice: प्रकोप
  rationale: यह शब्द साधारण क्रोध से अधिक गंभीर, न्यायात्मक रोष का बोध कराता है। ‘प्रकोप’ हिन्दी में उसकी गंभीरता बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह मूल इब्रानी अभिव्यक्ति का औपचारिक रूप बनाए रखता है और सामूहिक इस्राएल को सूचित करता है।
theological_decisions:
- issue: अंतिम उपवाक्य को केवल भविष्यवाणी माना जाए या उद्देश्य/परिणाम
  choice: 'उद्देश्य/परिणाम: उचित देखरेख के कारण इस्राएल पर फिर प्रकोप न हो'
  alternative: और इस्राएल के पुत्रों पर फिर प्रकोप नहीं होगा
  rationale: निकटवर्ती प्रसंग में याजकीय और लेवीय जिम्मेदारियाँ अनुचित निकट आने और उससे होने वाले न्याय को रोकने के लिए दी गई हैं; ‘ताकि’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- issue: प्रकोप का कर्ता
  choice: मूल पाठ की तरह कर्ता को अप्रकट रखा गया
  alternative: परमेश्वर का प्रकोप
  rationale: प्रसंग से दिव्य प्रकोप स्पष्ट है, पर इस उपवाक्य में इब्रानी पाठ परमेश्वर का नाम नहीं जोड़ता; इसलिए अनुवाद भी उसे स्पष्ट रूप से नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘देखरेख’ को दोनों पदों के साथ दोहराकर इब्रानी की समानांतर पुनरावृत्ति सुरक्षित रखी गई है।
