id: NUM.18.18
reference: Numbers 18:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְשָׂרָ֖/ם יִהְיֶה לָּ֑/ךְ כַּ/חֲזֵ֧ה הַ/תְּנוּפָ֛ה וּ/כְ/שׁ֥וֹק הַ/יָּמִ֖ין לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/018.yaml
  text: But their flesh shall be yours[b][a], just as the breast of the wave offering and the right thigh shall be yours.
translation:
  language: hi
  text: परन्तु उनका मांस[a] तुम्हारा होगा, जैसे लहराने की भेंट की छाती[b] और दाहिनी जाँघ तुम्हारी होती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का शाब्दिक अर्थ ‘मांस’ है; यहाँ आशय बलि के खाने योग्य मांस-भाग से है।
    reason: lexical_alternative
  - marker: b
    text: ‘लहराने की भेंट’ उस भाग को दर्शाती है जिसे यहोवा के सामने एक विधिपूर्वक गति में प्रस्तुत किया जाता था; इसे ‘प्रस्तुति की भेंट’ भी कहा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּבְשָׂרָם
  choice: परन्तु उनका मांस
  rationale: בָּשָׂר का मूल अर्थ ‘मांस’ है और बलिदान के प्रसंग में यह खाने योग्य मांस-भाग को दर्शाता है। आरम्भिक ו को पिछले पद में रक्त और चर्बी के विपरीत इस मांस के याजकीय अधिकार को स्पष्ट करने के लिए ‘परन्तु’ कहा गया है।
- source_word: יִהְיֶה לָּךְ
  choice: तुम्हारा होगा
  rationale: היה + ל अधिकार अथवा स्वामित्व व्यक्त करता है। ‘तुम्हारा होगा’ कानूनी आवंटन का भाव स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כַחֲזֵה הַתְּנוּפָה
  choice: जैसे लहराकर अर्पित की गई छाती
  rationale: חָזֶה ‘छाती’ है और תְּנוּפָה यहोवा के सामने विधिपूर्वक लहराकर प्रस्तुत किए जाने को दर्शाता है। यह रूप हिन्दी पाठक के लिए क्रिया को स्पष्ट रखते हुए बलिदानी अर्थ बचाता है।
- source_word: וּכְשׁוֹק הַיָּמִין
  choice: और दाहिनी जाँघ
  rationale: שׁוֹק बलिदान में बाँटे जाने वाले पैर के ऊपरी भाग, अर्थात जाँघ, को दर्शाता है; הַיָּמִין का सीधा अर्थ ‘दाहिनी’ है।
- source_word: לְךָ יִהְיֶה
  choice: वैसे ही वह भी तुम्हारा होगा
  rationale: दोहराई गई अधिकार-सूचक अभिव्यक्ति को हिन्दी में बनाए रखने के लिए तुलना को ‘वैसे ही’ से पूरा किया गया और मांस के लिए एकवचन ‘वह’ रखा गया है।
theological_decisions:
- issue: दूसरे पुरुष के प्रत्ययों का व्याकरणिक रूप और संदर्भ
  choice: दोनों अधिकार-सूचक रूपों को हारून से संबोधित एकवचन ‘तुम्हारा’ के रूप में प्रस्तुत किया गया है।
  alternative: इसे स्पष्ट बहुवचन में ‘तुम याजकों का’ कहना, अथवा मुख्य पाठ में ‘हारून, तुम्हारा’ जोड़ना।
  rationale: इब्रानी में पहले לָּךְ का प्रत्यय स्त्रीलिंग रूप और बाद के לְךָ का प्रत्यय पुल्लिंग रूप है। इस असमानता को किसी अतिरिक्त अभिप्रेत पात्र या सिद्धान्त से नहीं सुलझाया गया; प्रसंग में अधिकार हारून को प्रतिनिधि याजक मानकर दिया गया है, इसलिए सरल एकवचन संबोधन मूल की अस्पष्टता पर अनावश्यक विस्तार नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लहराने की भेंट’ जैसे कम स्वाभाविक पद के स्थान पर ‘लहराकर अर्पित की गई’ कहा गया है। तुलना को ‘जैसे…वैसे ही’ से पूरा किया गया है ताकि इब्रानी की दोहराई हुई अधिकार-सूचक रचना हिन्दी में सहज और स्पष्ट रहे।
