  naturalness: ‘लहराकर अर्पित की गई छाती’ is understandable, but ‘लहराने की भेंट की छाती’ is a more natural and established Hindi rendering for this sacrificial designation. The revised sentence is more concise and idiomatic while retaining the formal legal-allotment register.
  terminology: ‘मांस,’ ‘लहराने की भेंट,’ ‘छाती,’ and ‘दाहिनी जाँघ’ are suitable modern-standard Hindi terms. The footnotes appropriately explain ‘मांस’ in its sacrificial sense and the ritual expression without adding doctrinal interpretation.
