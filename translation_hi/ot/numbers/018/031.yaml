id: NUM.18.31
reference: Numbers 18:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אֹת/וֹ֙ בְּ/כָל מָק֔וֹם אַתֶּ֖ם וּ/בֵֽיתְ/כֶ֑ם כִּֽי שָׂכָ֥ר הוּא֙ לָ/כֶ֔ם חֵ֥לֶף עֲבֹֽדַתְ/כֶ֖ם בְּ/אֹ֥הֶל מוֹעֵֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/031.yaml
  text: You and your household may eat it in any place[c][b][a], because it is your wages in return for your service in the tent of meeting.
translation:
  language: hi
  text: तुम और तुम्हारा घराना[b] इसे किसी भी स्थान पर खा सकते हो[a], क्योंकि यह मिलापवाले तंबू में तुम्हारी सेवा के बदले तुम्हारा पारिश्रमिक है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इसे खाओगे” अथवा “इसे खाना है”; इस विधिक संदर्भ में हिब्रू क्रियारूप निर्देश या अनुमति व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “घराना” से आशय घरेलू इकाई है, केवल भौतिक मकान नहीं।
    reason: cultural_note
  - marker: c
    text: या “मजदूरी,” “प्रतिफल” अथवा “भुगतान”।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אֹתוֹ
  choice: खा सकते हो
  rationale: विधिक संदर्भ में यह रूप साधारण भूतकाल नहीं, बल्कि अनुमत क्रिया या निर्देश व्यक्त करता है; यहाँ किसी भी स्थान पर खाने की अनुमति प्रमुख है।
- source_word: בְּכָל מָקוֹם
  choice: किसी भी स्थान पर
  rationale: यह बताता है कि इस अंश को खाने के लिए पवित्रस्थान की सीमा लागू नहीं है और हिब्रू के व्यापक वितरणात्मक अर्थ को स्वाभाविक हिन्दी में रखता है।
- source_word: אַתֶּם וּבֵיתְכֶם
  choice: तुम और तुम्हारा घराना
  rationale: यहाँ בַּיִת का आशय भौतिक मकान नहीं, व्यक्ति की घरेलू इकाई है; ‘घराना’ इस व्यापक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह खाने की अनुमति का कारण प्रस्तुत करता है और आधुनिक हिन्दी में कारण-संबंध स्पष्ट करता है।
- source_word: שָׂכָר
  choice: पारिश्रमिक
  rationale: यह सेवा के बदले मिलने वाले प्रतिफल या भुगतान को दर्शाता है; ‘पारिश्रमिक’ गरिमापूर्ण और सटीक आधुनिक हिन्दी है।
- source_word: חֵלֶף
  choice: के बदले
  rationale: यह किए गए कार्य के अनुरूप प्रतिदान का संबंध व्यक्त करता है।
- source_word: עֲבֹדַתְכֶם
  choice: तुम्हारी सेवा
  rationale: संज्ञा यहाँ लेवियों की निर्धारित पवित्रस्थान-संबंधी सेवा को दर्शाती है; ‘सेवा’ उसके औपचारिक धार्मिक स्वर को बनाए रखती है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू में
  rationale: यह इस पवित्र तंबू के प्रचलित हिन्दी नाम को बनाए रखता है और בְּ के स्थानीय अर्थ को ‘में’ से व्यक्त करता है।
theological_decisions:
- issue: लेवियों के अंश का स्वरूप
  choice: पद इस खाने योग्य अंश को मिलापवाले तंबू की लेवीय सेवा के वैध पारिश्रमिक के रूप में प्रस्तुत करता है, जिसे किसी भी स्थान पर खाया जा सकता है।
  alternative: इसे केवल पवित्र क्षेत्र में खाया जाने वाला अधिक सीमित पवित्र भोज समझना।
  rationale: בְּכָל מָקוֹם स्पष्ट रूप से स्थान-संबंधी प्रतिबंध के अभाव को दर्शाता है और इस अंश को उन पवित्र भेंटों से अलग करता है जिन्हें निर्धारित पवित्र स्थान में ही खाया जाता था।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘खा सकते हो’ विधिक अनुमति को स्वाभाविक हिन्दी में व्यक्त करता है; ‘घराना’ घरेलू इकाई का अर्थ बनाए रखता है; और ‘पारिश्रमिक’ सेवा के बदले वैध प्रतिदान का औपचारिक भाव देता है।
