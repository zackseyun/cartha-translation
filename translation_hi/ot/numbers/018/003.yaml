  terminology: “वेदी,” “तंबू,” and the second-person singular address are appropriate. “पवित्र वस्तुएँ” is a clearer, suitably formal rendering for the sacred articles, while a footnote can retain the alternative sense “पवित्रस्थान के पात्र/उपकरण.”
