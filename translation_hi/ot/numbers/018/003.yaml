  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָֽׁמְרוּ֙ מִֽשְׁמַרְתְּ/ךָ֔ וּ/מִשְׁמֶ֖רֶת כָּל הָ/אֹ֑הֶל אַךְ֩ אֶל כְּלֵ֨י הַ/קֹּ֤דֶשׁ וְ/אֶל הַ/מִּזְבֵּ֨חַ֙ לֹ֣א יִקְרָ֔בוּ וְ/לֹֽא יָמֻ֥תוּ גַם הֵ֖ם גַּם אַתֶּֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/003.yaml
  text: They shall keep your charge and the charge of the whole tent[a], but they shall not come near the vessels of the sanctuary or the altar[b], so that neither they nor you may die.
translation:
  language: hi
  text: वे तुम्हारे दायित्व और पूरे तंबू की ज़िम्मेदारी निभाएँ। पर वे पवित्र वस्तुओं[a] या वेदी के पास न आएँ, कहीं ऐसा न हो कि वे भी और तुम भी मर जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान के पात्र” अथवा “पवित्र उपकरण।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמְרוּ מִשְׁמַרְתְּךָ
  choice: वे तुम्हारी सौंपी हुई ज़िम्मेदारी...का काम संभालें
  rationale: שׁמר और מִשְׁמֶרֶת का मेल किसी सौंपे हुए दायित्व को निभाने और उसकी निगरानी करने का भाव देता है। हिंदी में यह अभिव्यक्ति तकनीकी अर्थ को स्वाभाविक ढंग से पहुँचाती है।
- source_word: וּמִשְׁמֶרֶת כָּל הָאֹהֶל
  choice: और पूरे तंबू की देखरेख
  rationale: כָּל को ‘पूरे’ और אֹהֶל को उसके सीधे अर्थ ‘तंबू’ से व्यक्त किया गया है; प्रसंग में यह पवित्र तंबू है, पर मूल में यहाँ ‘तंबू’ ही है।
- source_word: אַךְ
  choice: पर
  rationale: यह पहले बताए दायित्व पर स्पष्ट सीमा लगाता है और आधुनिक हिंदी में स्वाभाविक विरोधसूचक है।
- source_word: אֶל כְּלֵי הַקֹּדֶשׁ
  choice: पवित्रस्थान के सामान
  rationale: כְּלֵי का अर्थ पात्र, उपकरण या सामान हो सकता है और הַקֹּדֶשׁ पवित्र क्षेत्र/पवित्रस्थान को सूचित करता है। ‘सामान’ विविध पवित्र वस्तुओं को सहज रूप से समेटता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יִקְרָבוּ
  choice: या वेदी के पास न आएँ
  rationale: नकारात्मक वाक्य में हिंदी का ‘या’ दोनों में से किसी के भी निकट आने की मनाही स्पष्ट करता है; קרב का स्थानगत भाव ‘पास आना’ से सुरक्षित है।
- source_word: וְלֹא יָמֻתוּ גַם הֵם גַם אַתֶּם
  choice: कहीं ऐसा न हो कि वे भी और तुम भी मर जाओ
  rationale: यह निषेध के उल्लंघन से जुड़ी मृत्यु की चेतावनी को स्वाभाविक हिंदी में व्यक्त करता है और גַם...גַם के अनुसार दोनों पक्षों को स्पष्टतः शामिल रखता है।
theological_decisions:
- issue: सम्बोधित व्यक्ति और प्रतिबंधित समूह
  choice: ‘तुम्हारी’ एकवचन रूप में हारून को सम्बोधित करता है, जबकि ‘वे’ लेवियों के दायित्व और उनकी सीमा को बताता है।
  alternative: इसे सामान्य रूप से सभी याजकों को किया गया सम्बोधन मानना।
  rationale: מִשְׁמַרְתְּךָ में द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय है और प्रसंग हारून को सम्बोधित करता है; अनुवाद इस भेद को बनाए रखता है।
- issue: मृत्यु की चेतावनी में कौन शामिल है
  choice: लेवी और हारून/याजक—दोनों पक्ष मृत्यु के खतरे में शामिल हैं।
  alternative: केवल लेवी मरेंगे।
  rationale: גַם הֵם גַם אַתֶּם स्पष्ट रूप से ‘वे भी और तुम भी’ कहता है, इसलिए किसी एक पक्ष को बाहर नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तंबू’ मूल के सीधे शब्द को बनाए रखता है; ‘सौंपी हुई ज़िम्मेदारी’ और ‘देखरेख’ पुरोहितीय दायित्व का भाव स्पष्ट करते हैं।
