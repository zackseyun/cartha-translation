  text: בִּכּוּרֵ֞י כָּל אֲשֶׁ֧ר בְּ/אַרְצָ֛/ם אֲשֶׁר יָבִ֥יאוּ לַ/יהוָ֖ה לְ/ךָ֣ יִהְיֶ֑ה כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכֲלֶֽ/נּוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/013.yaml
  text: The firstfruits of everything in their land that they bring to Yahweh shall be yours[a]. Everyone in your house who is clean may eat it.
translation:
  language: hi
  text: उनकी भूमि की हर चीज़ के पहले फल, जो वे यहोवा के लिए लाएँगे, तुम्हारे होंगे। तुम्हारे घराने में जो कोई शुद्ध है, वह उसे खा सकता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, अनुष्ठानिक रूप से शुद्ध व्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּכּוּרֵי
  choice: उपज का पहला फल
  rationale: यह शब्द फसल या उपज के आरम्भिक फल को दर्शाता है; यह हिन्दी में स्पष्ट है और अनावश्यक विस्तार नहीं करता।
- source_word: כָּל אֲשֶׁר בְּאַרְצָם
  choice: उनके देश की हर उपज
  rationale: शाब्दिक अर्थ 'उनके देश में जो कुछ है' है, पर पहले फल के कृषि-संदर्भ में 'हर उपज' स्वाभाविक और अर्थानुकूल है।
- source_word: אֲשֶׁר יָבִיאוּ לַיהוָה
  choice: जिसे वे यहोवा के पास लाएँगे
  rationale: क्रिया के मूल अर्थ 'लाना' को बनाए रखता है और समर्पण का प्रसंग स्वयं वाक्य से स्पष्ट रहता है।
- source_word: לַיהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है।
- source_word: לְךָ יִהְיֶה
  choice: तुम्हारा होगा
  rationale: यह वाक्यांश हारून को उस चढ़ावे पर अधिकार दिए जाने को सरल और निकट रूप में व्यक्त करता है।
- source_word: כָּל טָהוֹר
  choice: हर शुद्ध व्यक्ति
  rationale: टָהוֹר का मूल अर्थ 'शुद्ध' रखा गया है; याजकीय प्रसंग में इसकी अनुष्ठानिक शुद्धता फुटनोट में स्पष्ट की गई है।
- source_word: בְּבֵיתְךָ
  choice: तुम्हारे घर का
  rationale: यह हारून के घराने के सदस्यों को दर्शाता है; हिन्दी में 'घर का' सदस्यता का भाव स्वाभाविक रूप से देता है।
- source_word: יֹאכֲלֶנּוּ
  choice: उसे खा सकता है
  rationale: इस प्रसंग में अपूर्ण क्रिया अनुमति और अधिकार दर्शाती है, इसलिए 'खा सकता है' उपयुक्त है।
theological_decisions:
- issue: याजकीय व्यवस्था में 'शुद्ध' का स्वरूप
  choice: हारून के घर का अनुष्ठानिक रूप से शुद्ध व्यक्ति याजकीय भाग खा सकता है
  alternative: सामान्य नैतिक अर्थ में शुद्ध व्यक्ति
  rationale: गिनती 18 का प्रसंग याजकीय अधिकारों और शुद्धता की विधियों से जुड़ा है; इसलिए यहाँ טָהוֹר मुख्यतः अनुष्ठानिक शुद्धता को सूचित करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और स्रोत-सन्निकट प्रयोग किया गया है। 'उपज का पहला फल' सामान्य पाठक के लिए स्पष्ट है; 'शुद्ध' की याजकीय विशिष्टता फुटनोट में रखी गई है।
