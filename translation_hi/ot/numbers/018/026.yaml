source:
  edition: WLC
  text: וְ/אֶל הַ/לְוִיִּ֣ם תְּדַבֵּר֮ וְ/אָמַרְתָּ֣ אֲלֵ/הֶם֒ כִּֽי תִ֠קְחוּ מֵ/אֵ֨ת בְּנֵֽי יִשְׂרָאֵ֜ל אֶת הַֽ/מַּעֲשֵׂ֗ר אֲשֶׁ֨ר נָתַ֧תִּי לָ/כֶ֛ם מֵ/אִתָּ֖/ם בְּ/נַחֲלַתְ/כֶ֑ם וַ/הֲרֵמֹתֶ֤ם מִמֶּ֨/נּוּ֙ תְּרוּמַ֣ת יְהוָ֔ה מַעֲשֵׂ֖ר מִן הַֽ/מַּעֲשֵֽׂר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/026.yaml
  text: 'And to the Levites you shall speak and say to them: When you take from the sons of Israel the tithe that I have given you from them as your inheritance[a], then you shall present from it Yahweh’s contribution[c][b], a tithe from the tithe.'
translation:
  language: hi
  text: लेवियों से बात करो और उनसे कहो, ‘जब तुम इस्राएल के पुत्रों[a] से वह दशमांश लो, जो मैंने तुम्हें उनसे तुम्हारी विरासत के रूप में दिया है, तब उसमें से याहवे का अंश[b] अर्पित करना—दशमांश में से दशमांश[c]।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे के लिए अंश”; परंपरागत रूप से “याहवे की उठाई हुई भेंट।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात लेवियों को मिले दशमांश का दसवाँ भाग।
    reason: clarification
lexical_decisions:
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवी गोत्र के सदस्यों के लिए हिन्दी में प्रचलित और स्पष्ट पद।
- source_word: תְּדַבֵּר ... וְאָמַרְתָּ
  choice: बात करना और ... कहना
  rationale: इब्रानी निर्देशात्मक सूत्र के दोनों क्रियापदों को रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: כִּי תִקְחוּ
  choice: जब तुम ... लो
  rationale: כִּי यहाँ उस परिस्थिति का परिचय देता है जिसमें आज्ञा लागू होती है; इसलिए ‘जब’ उपयुक्त है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल इब्रानी अभिव्यक्ति के स्पष्ट रूप को सुरक्षित रखता है; अधिक सामूहिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: הַמַּעֲשֵׂר
  choice: दशमांश
  rationale: धार्मिक व्यवस्था में दिए जाने वाले दसवें भाग के लिए सटीक और हिन्दी बाइबलीय प्रयोग में परिचित शब्द।
- source_word: אֲשֶׁר נָתַתִּי לָכֶם מֵאִתָּם
  choice: जिसे मैंने उनकी ओर से तुम्हें ... दिया है
  rationale: दशमांश का इस्राएल से आना और परमेश्वर द्वारा लेवियों को दिया जाना—दोनों संबंध स्पष्ट रखे गए हैं।
- source_word: בְּנַחֲלַתְכֶם
  choice: तुम्हारी विरासत के रूप में
  rationale: लेवियों को भूमि के बदले मिले परमेश्वर-प्रदत्त हिस्से का भाव व्यक्त करता है।
- source_word: וַהֲרֵמֹתֶם
  choice: अर्पित करना
  rationale: रום के हिफ़ील रूप का यहाँ धार्मिक अंश प्रस्तुत करने का भाव है; ‘अर्पित करना’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: תְּרוּמַת יְהוָה
  choice: याहवे का अंश
  rationale: תְּרוּמָה को अलग रखे या प्रस्तुत किए जाने वाले अंश के रूप में व्यक्त किया गया है, और संबंधसूचक रचना की संभावित द्विविधा पादटिप्पणी में सुरक्षित है।
- source_word: מַעֲשֵׂר מִן הַמַּעֲשֵׂר
  choice: दशमांश में से दशमांश
  rationale: मִן के अंशवाचक अर्थ को सीधे रखता है और बताता है कि लेवी अपने प्राप्त दशमांश का दसवाँ भाग दें।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: בְּנֵי יִשְׂרָאֵל की लिंगयुक्त अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल अभिव्यक्ति का रूप सुरक्षित रखता है, जबकि उसके सामूहिक अर्थ के स्वाभाविक विकल्प पादटिप्पणी में दिए गए हैं।
- issue: תְּרוּמַת יְהוָה में संबंधसूचक अर्थ
  choice: याहवे का अंश
  alternative: याहवे के लिए अंश
  rationale: इब्रानी संबंधसूचक रचना स्वामित्व अथवा गंतव्य दोनों का भाव दे सकती है; मुख्य पाठ इसे खुला रखता है और विकल्प पादटिप्पणी में दर्ज करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर व्यवस्था-संबंधी आदेश की गरिमा बनाए रखती है। एकवचन मूसा को दिए निर्देश और बहुवचन लेवियों को संबोधन का भेद हिन्दी में प्रसंग और क्रियारचना से व्यक्त है।
