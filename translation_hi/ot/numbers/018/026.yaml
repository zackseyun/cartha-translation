  to: लेवियों से बात करो और उनसे कहो, ‘जब तुम इस्राएल के पुत्रों[a] से वह दशमांश लो, जो मैंने तुम्हें उनसे तुम्हारी विरासत के रूप में दिया है, तब उसमें से याहवे का अंश[b] अर्पित करना—दशमांश में से दशमांश[c]।’
