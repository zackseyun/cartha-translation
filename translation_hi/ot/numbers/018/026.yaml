    reason: lexical_alternative
  - marker: c
    text: अर्थात लेवियों को मिले दशमांश का दसवाँ भाग।
    reason: clarification
  revision_rationale: The revision moves the opening instruction to Moses outside the Levites’ quoted message, thereby preserving the Hebrew singular-to-plural addressee transition. It also clarifies that the tithe is received from the Israelites, without changing the theological or legal meaning.
