lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा में अगला चरण आरम्भ करता है। हिन्दी में इस प्रचलित वाक्य-सूत्र के लिए ‘फिर ... कहा’ स्वाभाविक है; ‘बात की’ की अपेक्षा यह आगामी प्रत्यक्ष वचन की भूमिका अधिक सहजता से बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय परमेश्वर-नाम का हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है, न कि उसके स्थान पर उपाधि ‘प्रभु’।
- source_word: אֶל
  choice: से
  rationale: דבר के साथ यह पूर्वसर्ग उस व्यक्ति को सूचित करता है जिससे बात कही गई; हिन्दी मुहावरे में ‘मूसा से कहा’ स्वाभाविक समतुल्य है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी व्यक्तिगत नाम का मानक हिन्दी बाइबलीय रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अनन्त क्रिया-रूप आगे आने वाले प्रत्यक्ष कथन की भूमिका बनाता है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना इस छोटे सूत्र में अनावश्यक पुनरुक्ति होगा; ‘कहा,’ वही कार्य स्वाभाविक रूप से करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। हिन्दी पाठकों के लिए उसके स्थापित रूप ‘यहोवा’ को रखकर नाम और उपाधि का भेद सुरक्षित किया गया है; ‘याहवे’ स्रोत-उच्चारण के अधिक निकट एक सम्भव लिप्यंतरण है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिन्दी। आवर्ती इब्रानी कथन-सूत्र को शब्दशः बोझिल बनाने के बजाय स्वाभाविक हिन्दी ‘फिर ... ने ... से कहा’ में प्रस्तुत किया गया है।
