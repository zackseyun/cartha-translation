  text: וְ/אַתָּ֣ה וּ/בָנֶ֣י/ךָ אִ֠תְּ/ךָ תִּשְׁמְר֨וּ אֶת כְּהֻנַּתְ/כֶ֜ם לְ/כָל דְּבַ֧ר הַ/מִּזְבֵּ֛חַ וּ/לְ/מִ/בֵּ֥ית לַ/פָּרֹ֖כֶת וַ/עֲבַדְתֶּ֑ם עֲבֹדַ֣ת מַתָּנָ֗ה אֶתֵּן֙ אֶת כְּהֻנַּתְ/כֶ֔ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/007.yaml
  text: But you and your sons with you shall keep your priesthood for everything concerning the altar and for what is within the veil[a], and you shall serve. I give your priesthood as a gift of service[b], but the outsider who comes near shall be put to death.
translation:
  language: hi
  text: परन्तु तुम और तुम्हारे साथ तुम्हारे पुत्र अपनी याजकाई की जिम्मेदारी निभाओगे—वेदी से सम्बन्धित हर बात और परदे के भीतर की सेवा के विषय में—और सेवा करोगे। मैं तुम्हारा याजकपद सेवा के उपहार के रूप में देता हूँ[a]; परन्तु जो अनधिकृत व्यक्ति[b] निकट आएगा, वह मार डाला जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं तुम्हारी याजकीय सेवा उपहार के रूप में देता हूँ।” इब्रानी वाक्यांश में बल इस बात पर हो सकता है कि सेवा स्वयं उपहार है, या कि याजकपद सेवा के लिए दिया गया उपहार है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पराया” या “बाहरी व्यक्ति”; यहाँ आशय ऐसे व्यक्ति से है जिसे याजकीय कार्य करने का अधिकार नहीं है, न कि विशेष रूप से किसी विदेशी से।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּשְׁמְרוּ
  choice: जिम्मेदारी सम्भालोगे
  rationale: यहाँ שׁמר का अर्थ केवल पालन करना नहीं, बल्कि सौंपी गई याजकीय जिम्मेदारी की चौकसी और देखरेख करना है।
- source_word: כְּהֻנַּתְכֶם
  choice: अपनी याजकीय जिम्मेदारी / तुम्हारी याजकीय सेवा
  rationale: यह शब्द याजक के पद और उसके कार्य—दोनों को समेटता है; प्रसंगानुसार हिन्दी में जिम्मेदारी और सेवा से उसका कार्यात्मक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: לְכָל דְּבַר הַמִּזְבֵּחַ
  choice: वेदी से सम्बन्धित हर बात
  rationale: דבר यहाँ वेदी से जुड़े सभी मामलों और कर्तव्यों की व्यापकता दर्शाता है; इसे किसी एक प्रकार की विधि तक सीमित नहीं किया गया।
- source_word: וּלְמִבֵּית לַפָּרֹכֶת
  choice: परदे के भीतर के काम
  rationale: इब्रानी पदबंध परदे की भीतरी ओर के पवित्र क्षेत्र से सम्बन्धित सेवा को सूचित करता है; 'काम' वाक्य में निहित दायित्व को स्पष्ट करता है।
- source_word: וַעֲבַדְתֶּם
  choice: सेवा करोगे
  rationale: עבד का यहाँ आराधना-स्थान में नियत सेवा करना अर्थ है; 'सेवा' व्यापक और सम्प्रदाय-निरपेक्ष है।
- source_word: עֲבֹדַת מַתָּנָה אֶתֵּן אֶת כְּהֻנַּתְכֶם
  choice: मैं तुम्हारी याजकीय सेवा तुम्हें उपहार के रूप में देता हूँ
  rationale: संक्षिप्त इब्रानी रचना में सेवा और उपहार का सम्बन्ध कुछ खुला है। यह अनुवाद याजकीय सेवा के परमेश्वर द्वारा दिए जाने पर बल देता है और वैकल्पिक रचना को पादटिप्पणी में सुरक्षित रखता है।
- source_word: הַזָּר
  choice: अनधिकृत व्यक्ति
  rationale: याजकीय विधान में זָר जातीय विदेशी नहीं, बल्कि उस पवित्र सेवा के लिए अधिकार न रखने वाला व्यक्ति है।
- source_word: הַקָּרֵב
  choice: निकट आएगा
  rationale: קרב पवित्र क्षेत्र या आरक्षित सेवा के पास आने का भौतिक और धार्मिक दोनों भाव बनाए रखता है।
- source_word: יוּמָת
  choice: मार डाला जाएगा
  rationale: होफल रूप कानूनी और कारक कर्मवाच्य है; यह केवल मृत्यु की भविष्यवाणी नहीं, मृत्युदण्ड सूचित करता है।
theological_decisions:
- issue: עֲבֹדַת מַתָּנָה में उपहार और सेवा का सम्बन्ध
  choice: याजकीय सेवा परमेश्वर द्वारा उपहार के रूप में दी जाती है
  alternative: यह उपहार के रूप में दी गई सेवा है / याजकपद सेवा के लिए दिया गया उपहार है
  rationale: इब्रानी संरचना दोनों बलाघातों की अनुमति देती है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणी वास्तविक वाक्यगत अस्पष्टता बचाती है।
- issue: זָר की पहचान
  choice: अनधिकृत व्यक्ति
  alternative: बाहरी व्यक्ति / पराया व्यक्ति
  rationale: प्रतिबन्ध उस व्यक्ति पर है जिसे याजकीय कार्य का अधिकार नहीं, न कि अनिवार्यतः किसी विदेशी जाति के व्यक्ति पर।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कानूनी-धार्मिक शैली रखी गई है। 'याजकीय', 'वेदी' और 'परदा' जैसे परिचित बाइबलीय शब्द बनाए गए हैं; जातीय भ्रम से बचने के लिए 'अनधिकृत व्यक्ति' चुना गया है।
