source:
  edition: WLC
  text: וְ/לִ/בְנֵ֣י לֵוִ֔י הִנֵּ֥ה נָתַ֛תִּי כָּל מַֽעֲשֵׂ֥ר בְּ/יִשְׂרָאֵ֖ל לְ/נַחֲלָ֑ה חֵ֤לֶף עֲבֹֽדָתָ/ם֙ אֲשֶׁר הֵ֣ם עֹֽבְדִ֔ים אֶת עֲבֹדַ֖ת אֹ֥הֶל מוֹעֵֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/021.yaml
  text: And to the sons of Levi[a], behold, I have given every tithe in Israel as an inheritance, in return for the service that they perform[c][b], the service of the tent of meeting.
translation:
  language: hi
  text: देखो, मैंने लेवी के वंशजों को इस्राएल में हर दशमांश विरासत के रूप में दिया है, उनकी उस सेवा के बदले जो वे करते हैं—मिलापवाले तंबू की सेवा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/בְנֵי לֵוִי
  choice: और लेवी के वंशजों को
  rationale: शाब्दिक वंशावली-सूचक रूप को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति; ‘लेवी के पुत्रों’ की अपेक्षा यह पूरे लेवीय समुदाय को अधिक स्पष्ट रूप से दर्शाता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: घोषणा की ओर ध्यान खींचने और बल देने वाले हिब्रू अव्यय का सहज आधुनिक हिन्दी समतुल्य।
- source_word: נָתַתִּי
  choice: मैंने ... दिया है
  rationale: पूर्ण क्रिया को वर्तमान में प्रभावी और सुनिश्चित दैवी प्रावधान के रूप में व्यक्त करता है।
- source_word: כָּל מַעֲשֵׂר בְּיִשְׂרָאֵל
  choice: इस्राएल का हर दशमांश
  rationale: כָּל के वितरणात्मक भाव और מַעֲשֵׂר के स्थापित अर्थ ‘दशमांश’ को स्वाभाविक हिन्दी में रखता है।
- source_word: לְנַחֲלָה
  choice: विरासत के रूप में
  rationale: भूमि अथवा अन्य निर्धारित हिस्से के कानूनी-सामुदायिक भाव को सुरक्षित रखता है।
- source_word: חֵלֶף
  choice: के बदले
  rationale: विनिमय अथवा प्रतिफल का भाव संक्षेप और स्पष्टता से देता है, बिना अत्यधिक वाणिज्यिक भाषा के।
- source_word: עֲבֹדָתָם אֲשֶׁר הֵם עֹבְדִים
  choice: उनकी उस सेवा के बदले ... जो वे करते हैं
  rationale: मूल में संज्ञा और उसी धातु की क्रिया की पुनरावृत्ति को अर्थपूर्ण, किंतु हिन्दी में सहज रूप से प्रस्तुत करता है।
- source_word: אֶת עֲבֹדַת אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू की सेवा
  rationale: हिब्रू संबंध-वाक्यांश के निकट रहते हुए धार्मिक कर्तव्यों और उनके स्थान दोनों को व्यक्त करता है।
theological_decisions:
- issue: लेवियों के दशमांश और सेवा का संबंध
  choice: दशमांश को विरासत और उनकी सेवा के बदले मिलने वाला प्रावधान—दोनों रूपों में प्रस्तुत किया गया है।
  alternative: इसे केवल लेवियों को दिया गया हिस्सा कहना, प्रतिफल के भाव को उभारे बिना।
  rationale: पद में לְנַחֲלָה और חֵלֶף עֲבֹדָתָם दोनों स्पष्ट हैं; अनुवाद किसी एक भाव को दूसरे में विलीन नहीं करता।
- issue: אֹהֶל מוֹעֵד का हिन्दी रूप
  choice: मिलापवाला तंबू
  alternative: भेंट का तंबू / सभा का तंबू
  rationale: हिब्रू पद निर्दिष्ट भेंट या नियत मिलन के स्थान का बोध करा सकता है। ‘मिलापवाला तंबू’ हिन्दी बाइबलीय प्रयोग में परिचित है, पर वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वंशावली-सूचक भाषा, विरासत, प्रतिफल और पवित्र-स्थान की सेवा के अलग-अलग भाव सुरक्षित रखे गए हैं।
