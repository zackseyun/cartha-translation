source:
  edition: WLC
  text: כֹּ֣ל תְּרוּמֹ֣ת הַ/קֳּדָשִׁ֗ים אֲשֶׁ֨ר יָרִ֥ימוּ בְנֵֽי יִשְׂרָאֵל֮ לַֽ/יהוָה֒ נָתַ֣תִּֽי לְ/ךָ֗ וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם בְּרִית֩ מֶ֨לַח עוֹלָ֥ם הִוא֙ לִ/פְנֵ֣י יְהוָ֔ה לְ/ךָ֖ וּ/לְ/זַרְעֲ/ךָ֥ אִתָּֽ/ךְ׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/019.yaml
  text: All the contributions of the holy things that the sons of Israel lift up to the LORD I have given to you, and to your sons and your daughters with you, as a permanent statute. It is a covenant of salt forever before the LORD for you and for your offspring with you.
translation:
  language: hi
  text: इस्राएली यहोवा के लिए पवित्र वस्तुओं में से जो सारी भेंटें उठाकर अर्पित करते हैं, वे मैंने तुम्हें और तुम्हारे साथ तुम्हारे बेटे-बेटियों को स्थायी विधि के रूप में दी हैं। यहोवा के सम्मुख यह तुम्हारे और तुम्हारे साथ तुम्हारे वंश के लिए सदा के लिए नमक की वाचा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תְּרוּמֹת
  choice: उठाकर अर्पित की जानेवाली ... भेंटें
  rationale: शब्द का मूल भाव किसी वस्तु को उठाकर अलग करने अथवा अर्पित करने का है; संयुक्त अभिव्यक्ति हिन्दी में अर्थ स्पष्ट रखते हुए हिब्रानी बिंब को बचाती है।
- source_word: הַקֳּדָשִׁים
  choice: पवित्र वस्तुओं
  rationale: यह बहुवचन संज्ञा पवित्र ठहराई गई वस्तुओं/दानों को दर्शाती है; केवल 'पवित्र भेंटें' कहने से תְּרוּמֹת के साथ अर्थ दोहरता।
- source_word: חָק עוֹלָם
  choice: सदा की विधि
  rationale: חֹק का अर्थ निर्धारित विधान या स्थायी व्यवस्था है; 'विधि' वर्तमान मानक हिन्दी में संक्षिप्त और गरिमापूर्ण है।
- source_word: בְּרִית מֶלַח עוֹלָם
  choice: सदा की नमक की वाचा
  rationale: असामान्य हिब्रानी रूपक को व्याख्यात्मक रूप से बदलने के बजाय यथावत रखा गया है; עוֹלָם को वाचा की स्थायित्व-सूचना के रूप में व्यक्त किया गया।
- source_word: זַרְעֲךָ
  choice: तुम्हारे वंश
  rationale: सामूहिक 'बीज' यहाँ भावी संतति को दर्शाता है; हिन्दी में 'वंश' स्वाभाविक और संदर्भानुकूल है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: हिन्दी बाइबलीय प्रयोग में परिचित व्यक्तिगत नाम रखते हुए मूल पाठ में उपस्थित ईश्वरीय नाम और सामान्य उपाधि के बीच का भेद सुरक्षित किया गया।
- issue: ‘नमक की वाचा’ का आशय
  choice: रूपक को बिना विस्तार के अक्षरशः रखना
  alternative: अटूट अथवा स्थायी वाचा
  rationale: मूल पद स्वयं रूपक की व्याख्या नहीं करता; उसे केवल 'अटूट वाचा' बना देना सांस्कृतिक और धार्मिक संकेत को समयपूर्व हल कर देता।
- issue: स्थायी अधिकार के लाभार्थी
  choice: हारून, उसके साथ उसके बेटे-बेटियाँ, और उसका वंश
  alternative: केवल याजकीय पुरुष वंशज
  rationale: पद स्पष्ट रूप से बेटों और बेटियों दोनों का उल्लेख करता है; इसलिए किसी अधिक सीमित संस्थागत अर्थ को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। वाक्य-संरचना को स्वाभाविक बनाया गया, पर ‘उठाकर अर्पित’ और ‘नमक की वाचा’ जैसे मूल हिब्रानी बिंब सुरक्षित रखे गए हैं।
