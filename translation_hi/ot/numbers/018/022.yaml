  text: וְ/לֹא יִקְרְב֥וּ ע֛וֹד בְּנֵ֥י יִשְׂרָאֵ֖ל אֶל אֹ֣הֶל מוֹעֵ֑ד לָ/שֵׂ֥את חֵ֖טְא לָ/מֽוּת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/022.yaml
  text: And the sons of Israel shall no longer come near the tent of meeting[a], lest they bear sin and die.
translation:
  language: hi
  text: अब से इस्राएल के लोग मिलाप के तंबू के पास न आएँ, ऐसा न हो कि वे पाप का भार उठाएँ[a] और मर जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘दोष के भागी हों।’ इब्रानी में शाब्दिक रूप से ‘पाप उठाएँ’ है—यह गलत काम के दोष और उसके परिणाम का दायित्व उठाने के लिए प्रयुक्त याजकीय और कानूनी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִקְרְבוּ
  choice: पास आएँ
  rationale: यह קָרַב के ‘निकट आना’ अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और पवित्र स्थान के निकट जाने का भाव बनाए रखता है।
- source_word: לֹא ... עוֹד
  choice: अब से ... न आएँ
  rationale: निषेध के साथ עוֹד का अर्थ ‘अब आगे ऐसा न हो’ या ‘फिर कभी नहीं’ है; यहाँ ‘अब से ... न’ हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: यह सामूहिक रूप से इस्राएली समुदाय को स्वाभाविक हिन्दी में दर्शाता है; प्रसंग में अभिप्राय वंशगत समुदाय से है, केवल पुरुष संतानों से नहीं।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह पवित्र तंबू के प्रचलित हिन्दी नाम को बनाए रखता है और उस स्थान का बोध कराता है जहाँ परमेश्वर से भेंट होती थी।
- source_word: לָשֵׂאת חֵטְא
  choice: पाप का भार उठाएँ
  rationale: यह इब्रानी के ठोस मुहावरे ‘पाप उठाना’ को सुरक्षित रखता है; याजकीय और कानूनी प्रसंग में इसमें दोष तथा उसके परिणाम का दायित्व उठाना निहित है।
- source_word: לָמוּת
  choice: और मर जाएँ
  rationale: यह अनधिकृत रूप से निकट आने के घातक परिणाम को इब्रानी क्रम के अनुरूप संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: क्या पवित्र स्थान के निकट अनधिकृत रूप से आने और उससे उत्पन्न दोष को मुख्य पाठ में स्पष्ट करके व्याख्यायित किया जाए
  choice: 'इब्रानी की संक्षिप्त चेतावनी को बनाए रखना: ‘पास न आएँ, ऐसा न हो कि वे पाप का भार उठाएँ और मर जाएँ।’'
  alternative: ‘पास न आएँ, नहीं तो वे दोषी ठहरेंगे और मर जाएँगे।’
  rationale: निकटवर्ती प्रसंग सामान्य इस्राएलियों को उस पवित्र सेवा-क्षेत्र के निकट आने से रोकता है जिसकी जिम्मेदारी लेवियों और याजकों को दी गई है। मुख्य पाठ ‘पाप का भार उठाने’ की कानूनी-याजकीय तनावपूर्ण अभिव्यक्ति को किसी एक व्याख्या में सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलाप का तंबू’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला पद है। ‘पाप का भार उठाएँ’ मूल के ठोस मुहावरे को बनाए रखता है, जबकि पादटिप्पणी उसका कानूनी-याजकीय आशय स्पष्ट करती है।
