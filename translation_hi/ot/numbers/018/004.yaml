  text: וְ/נִלְו֣וּ עָלֶ֔י/ךָ וְ/שָֽׁמְר֗וּ אֶת מִשְׁמֶ֨רֶת֙ אֹ֣הֶל מוֹעֵ֔ד לְ/כֹ֖ל עֲבֹדַ֣ת הָ/אֹ֑הֶל וְ/זָ֖ר לֹא יִקְרַ֥ב אֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/004.yaml
  text: They shall join you and keep the charge of the tent of meeting for all the service of the tent[a], but no outsider shall come near you.
translation:
  language: hi
  text: वे तुमसे जुड़ें और मिलापवाले तंबू की जिम्मेदारी निभाएँ, अर्थात् तंबू की सारी सेवा करें; पर कोई बाहरी व्यक्ति[a] तुम सबके निकट न आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई अनधिकृत व्यक्ति।” यहाँ इब्रानी शब्द का अर्थ जाति से विदेशी व्यक्ति होना आवश्यक नहीं, बल्कि ऐसा व्यक्ति है जो पवित्रस्थान में सेवा करने या निकट आने के लिए अधिकृत नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִלְווּ עָלֶיךָ
  choice: वे तुम्हारे साथ जुड़ें
  rationale: निफ़अल क्रिया यहाँ हारून के साथ सहायक सेवा में जुड़ने का भाव देती है। ‘तुम्हारे साथ जुड़ें’ आधुनिक हिंदी में स्वाभाविक रहते हुए संबंधपरक और कार्यगत अर्थ सुरक्षित रखता है।
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמֶרֶת
  choice: सौंपी हुई जिम्मेदारी निभाएँ
  rationale: याजकीय प्रसंग में यह पदबंध किसी औपचारिक रूप से सौंपे गए दायित्व को निभाने का अर्थ देता है; केवल ‘पहरा दें’ कहना इसके कार्यगत विस्तार को सीमित कर सकता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पवित्रस्थान के इस विशिष्ट नाम का हिंदी में प्रचलित, स्पष्ट और गरिमापूर्ण रूप है।
- source_word: לְכֹל עֲבֹדַת הָאֹהֶל
  choice: तंबू की सारी सेवा के लिए
  rationale: עֲבֹדָה यहाँ उपासना-स्थान से संबंधित नियत सेवा या कार्य को दर्शाता है; ‘सेवा’ उसके धार्मिक-कार्यगत भाव को बनाए रखता है।
- source_word: וְזָר
  choice: पर कोई बाहरी व्यक्ति
  rationale: זָר इस प्रसंग में जातीय विदेशी के बजाय पवित्रस्थान की अनुमत भूमिका से बाहर के व्यक्ति को दर्शाता है। ‘बाहरी व्यक्ति’ मूल की संक्षिप्तता और अर्थगत तनाव बनाए रखता है; अधिक स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: לֹא יִקְרַב אֲלֵיכֶם
  choice: तुम सबके निकट न आए
  rationale: קרב पवित्रस्थान के संदर्भ में निषिद्ध पवित्र निकटता में आने को व्यक्त करता है। ‘तुम सबके’ से मूल के बहुवचन सर्वनाम का वह परिवर्तन भी दिखाई देता है जो पहले के एकवचन ‘तुम्हारे’ के बाद आता है।
theological_decisions:
- issue: पवित्रस्थान संबंधी विधान में זָר का अर्थ
  choice: बाहरी व्यक्ति—अर्थात अनुमत याजकीय या लेवीय भूमिका से बाहर का व्यक्ति
  alternative: अजनबी; विदेशी; अनधिकृत व्यक्ति
  rationale: संदर्भ जातीय पहचान का नहीं, पवित्र सेवा और निकट आने के अधिकार का है। मुख्य पाठ में ‘बाहरी व्यक्ति’ मूल की व्यापकता रखता है, जबकि पादटिप्पणी संभावित गलत जातीय अर्थ को रोकती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलापवाला तंबू’ परिचित बाइबलीय पद है। एकवचन עָלֶיךָ और बहुवचन אֲלֵיכֶם के अंतर को क्रमशः ‘तुम्हारे’ और ‘तुम सबके’ से सुरक्षित रखा गया है।
