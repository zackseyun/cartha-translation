  text: וְ/גַ֣ם אֶת אַחֶי/ךָ֩ מַטֵּ֨ה לֵוִ֜י שֵׁ֤בֶט אָבִ֨י/ךָ֙ הַקְרֵ֣ב אִתָּ֔/ךְ וְ/יִלָּו֥וּ עָלֶ֖י/ךָ וִֽ/ישָׁרְת֑וּ/ךָ וְ/אַתָּה֙ וּ/בָנֶ֣י/ךָ אִתָּ֔/ךְ לִ/פְנֵ֖י אֹ֥הֶל הָ/עֵדֻֽת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/002.yaml
  text: And also bring near with you your brothers[a], the tribe of Levi, your father's tribe, so that they may be joined to you and serve you[b], while you and your sons with you are before the tent of the testimony.
translation:
  language: hi
  text: और अपने भाइयों को भी—अर्थात् लेवी के गोत्र को, जो तुम्हारे पिता का गोत्र है—अपने साथ निकट ले आओ, ताकि वे तुमसे जुड़ जाएँ[a] और तुम्हारी सेवा करें; और तुम और तुम्हारे पुत्र, जो तुम्हारे साथ हैं, साक्षीपत्र के तंबू के सामने रहो।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तुम्हारे साथ हो जाएँ’ या ‘तुमसे संबद्ध हो जाएँ’ भी हो सकता है। यहाँ प्रयुक्त इब्रानी क्रिया ‘लेवी’ नाम के साथ एक शब्द-खेल भी करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘साक्षीपत्र का तंबू’। यहाँ इब्रानी पाठ में ‘मिलापवाला तंबू’ नहीं है, यद्यपि संबंधित पवित्र-तंबू की अभिव्यक्तियों के प्रभाव से कुछ अनुवाद ऐसा लिखते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְגַם
  choice: और ... भी
  rationale: आरंभिक संयोजन और योगात्मक बल, दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אַחֶיךָ
  choice: अपने भाइयों
  rationale: इब्रानी के पारिवारिक संबोधन को बनाए रखता है; संदर्भ में इसका आशय हारून के साथी लेवियों से है।
- source_word: מַטֵּה לֵוִי
  choice: लेवी के गोत्र
  rationale: यहाँ מַטֶּה का अर्थ भौतिक छड़ी नहीं, बल्कि गोत्र है।
- source_word: שֵׁבֶט אָבִיךָ
  choice: जो तुम्हारे पिता का गोत्र है
  rationale: लेवी के गोत्र की समानाधिकरणात्मक पहचान को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- source_word: הַקְרֵב אִתָּךְ
  choice: अपने साथ निकट ले आओ
  rationale: हिफ़ील रूप के ‘निकट लाने’ के भाव और אִתָּךְ के साथ होने के अर्थ, दोनों को सुरक्षित रखता है।
- source_word: וְיִלָּווּ עָלֶיךָ
  choice: ताकि वे तुमसे जुड़ जाएँ
  rationale: निफ़अल रूप का जुड़ने अथवा संबद्ध होने का अर्थ व्यक्त करता है और ‘लेवी’ नाम के साथ उपस्थित शब्दानुरणन की ओर पादटिप्पणी में संकेत की अनुमति देता है।
- source_word: וִישָׁרְתוּךָ
  choice: और तुम्हारी सेवा करें
  rationale: שרת के सेवाकार्य को स्पष्ट, आधुनिक और गैर-सांप्रदायिक भाषा में व्यक्त करता है।
- source_word: לִפְנֵי אֹהֶל הָעֵדֻת
  choice: साक्षीपत्र के तंबू के सामने
  rationale: मसोरेटिक पाठ में עֵדוּת ‘साक्षी/साक्षीपत्र’ है, ‘मिलाप’ नहीं; ‘साक्षीपत्र’ वाचा-संबंधी प्रमाण के ठोस भाव को सुरक्षित रखता है।
theological_decisions:
- issue: אֹהֶל הָעֵדֻת का अनुवाद
  choice: साक्षीपत्र का तंबू
  alternative: मिलापवाला तंबू
  rationale: इस पद के इब्रानी पाठ में सामान्य אֹהֶל מוֹעֵד नहीं, बल्कि אֹהֶל הָעֵדֻת है। इसलिए परिचित पारंपरिक अभिव्यक्ति से सामंजस्य बैठाने के बजाय स्रोत-पाठ के ‘साक्षीपत्र’ को रखा गया है।
- issue: हारून और उसके पुत्रों वाले अंतिम खंड का संबंध
  choice: जबकि तुम और तुम्हारे साथ तुम्हारे पुत्र ... रहो
  alternative: और तुम और तुम्हारे साथ तुम्हारे पुत्र ... रहो
  rationale: इब्रानी וְ सामान्य संयोजक है और संबंध कुछ खुला रखता है। हिन्दी में ‘जबकि’ लेवियों की सहायक सेवा और हारून-पुत्रों की तंबू के सामने की स्थिति के बीच प्रसंगगत भेद दिखाता है, बिना किसी अतिरिक्त याजकीय सिद्धांत को जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘निकट ले आओ’ उपासना-संबंधी सूक्ष्मता बनाए रखता है। लंबे समानाधिकरण को डैश से अलग किया गया है ताकि वाक्य पठनीय रहे; ‘तंबू’ और ‘गोत्र’ प्रचलित बाइबिलीय शब्द हैं।
