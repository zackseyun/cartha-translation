  yaml_path: translation/ot/numbers/018/010.yaml
  text: You shall eat it in a most holy place; every male may eat it. It shall be holy to you.
translation:
  language: hi
  text: तुम उसे परमपवित्र स्थान में खाओ[a]; हर पुरुष उसे खा सकता है। वह तुम्हारे लिए पवित्र होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “पवित्रों के पवित्र में।” यहाँ यह वाक्यांश याजकीय भोजन के लिए निर्धारित परमपवित्र क्षेत्र को दर्शाता है; इसका अर्थ केवल भीतरी पवित्रतम कक्ष नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּקֹדֶשׁ הַקֳּדָשִׁים
  choice: परमपवित्र स्थान में
  rationale: सम्बन्धवाचक בְּ के स्थानसूचक अर्थ और इब्रानी की सर्वोच्चता व्यक्त करने वाली रचना को स्वाभाविक हिन्दी में व्यक्त करता है। यह पद यहाँ याजकीय भोजन के लिए निर्धारित पवित्र क्षेत्र को सूचित करता है।
- source_word: תֹּאכֲלֶנּוּ
  choice: तुम उसे ... खाना
  rationale: हारून को सम्बोधित दूसरे पुरुष एकवचन निर्देश को आधुनिक, सहज हिन्दी में सुरक्षित रखता है।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: इब्रानी में लिंग-विशिष्ट पात्रता को स्पष्ट रूप से व्यक्त करता है; यहाँ सामान्य अर्थ में ‘हर व्यक्ति’ अभिप्रेत नहीं है।
- source_word: יֹאכַל אֹתוֹ
  choice: उसे खा सकता है
  rationale: इस सन्दर्भ में अपूर्ण क्रिया पात्र पुरुषों को दी गई अनुमति दर्शाती है, इसलिए ‘खा सकता है’ विधिक अधिकार को स्पष्ट करता है।
- source_word: קֹדֶשׁ יִהְיֶה לָּךְ
  choice: वह तुम्हारे लिए पवित्र होगा
  rationale: קֹדֶשׁ के पवित्रता-सम्बन्धी मुख्य अर्थ और हारून के प्रति एकवचन सम्बोधन दोनों को बनाए रखता है।
theological_decisions:
- issue: याजकीय निर्देश का सम्बोधन और विस्तार
  choice: एकवचन में हारून को याजकवर्ग के प्रतिनिधि के रूप में सम्बोधित किया गया है, और खाने की अनुमति पात्र पुरुषों तक विस्तृत है।
  alternative: एकवचन को केवल हारून के लिए व्यक्तिगत निर्देश माना जा सकता है।
  rationale: निकटवर्ती प्रसंग हारून और उसके पुत्रों को दिए गए याजकीय अंशों से सम्बन्धित है। पहला खण्ड इब्रानी का एकवचन बनाए रखता है और अगला खण्ड अनुमति की व्यापक पात्रता स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम ... खाना’ में एकवचन निर्देश का भाव है; ‘खा सकता है’ अनुमति को आदेश से अलग करता है।
