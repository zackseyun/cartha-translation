source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶֽל אַהֲרֹ֗ן בְּ/אַרְצָ/ם֙ לֹ֣א תִנְחָ֔ל וְ/חֵ֕לֶק לֹא יִהְיֶ֥ה לְ/ךָ֖ בְּ/תוֹכָ֑/ם אֲנִ֤י חֶלְקְ/ךָ֙ וְ/נַחֲלָ֣תְ/ךָ֔ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/020.yaml
  text: And Yahweh said to Aaron[a], “In their land you shall not inherit, and no portion shall be yours among them. I am your portion and your inheritance among the sons of Israel.”
translation:
  language: hi
  text: और याहवे ने हारून से कहा, “उनकी भूमि में तुम्हें विरासत नहीं मिलेगी, और उनके बीच तुम्हारा कोई भाग नहीं होगा। इस्राएल के पुत्रों[a] के बीच मैं तुम्हारा भाग और तुम्हारी विरासत हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के लोगों के बीच” अथवा “इस्राएलियों के बीच।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּאַרְצָם
  choice: उनके देश में
  rationale: यहाँ אֶרֶץ इस्राएलियों की भू-क्षेत्रीय विरासत को सूचित करता है; ‘देश’ आधुनिक हिन्दी में स्वाभाविक है और भूमि-संबंधी भाव बनाए रखता है।
- source_word: לֹא תִנְחָל
  choice: तुम्हें कोई विरासत नहीं मिलेगी
  rationale: נחל के विरासत पाने के अर्थ को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त किया गया है; निषेध और उत्तराधिकार का कानूनी-वाचाई भाव सुरक्षित है।
- source_word: חֵלֶק
  choice: भाग
  rationale: ‘भाग’ आवंटित हिस्से को स्वाभाविक ढंग से व्यक्त करता है और बाद के ‘मैं ही तुम्हारा भाग’ में वही शब्द दोहराकर मूल का शाब्दिक संबंध बनाए रखता है।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह सामाजिक और सामुदायिक संबंध को दर्शाता है, केवल भौतिक मध्यस्थान को नहीं।
- source_word: אֲנִי חֶלְקְךָ
  choice: मैं ही तुम्हारा भाग
  rationale: यह पद का केंद्रीय कथन है। ‘ही’ हिन्दी में सर्वनाम की अग्रता और विरोधात्मक बल को स्वाभाविक रूप से उभारता है, बिना अर्थ में नया तत्व जोड़े।
- source_word: נַחֲלָתְךָ
  choice: तुम्हारी विरासत
  rationale: यह भूमि और आवंटित उत्तराधिकार से जुड़े कानूनी-वाचाई अर्थ को बनाए रखता है तथा पहले प्रयुक्त विरासत-वाचक क्रिया से संबंध सुरक्षित करता है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच
  rationale: בְּנֵי יִשְׂרָאֵל की औपचारिक पारिवारिक अभिव्यक्ति को सुरक्षित रखा गया है; अधिक स्वाभाविक सामूहिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ चुना गया है।
- issue: בְּנֵי יִשְׂרָאֵל में व्याकरणिक लिंग और सामूहिक अर्थ
  choice: इस्राएल के पुत्रों के बीच
  alternative: इस्राएल के लोगों के बीच / इस्राएलियों के बीच
  rationale: मुख्य पाठ में मूल की पुल्लिंग, पारिवारिक और वाचाई अभिव्यक्ति रखी गई है, जबकि यह स्वीकार किया गया है कि वाक्यांश जातीय समुदाय के लिए सामूहिक नाम के रूप में भी काम करता है।
- issue: परमेश्वर स्वयं हारून का भाग और विरासत है
  choice: मैं ही तुम्हारा भाग और तुम्हारी विरासत हूँ
  alternative: मैं तुम्हारा हिस्सा और उत्तराधिकार हूँ
  rationale: मूल के दो विरासत-संबंधी संज्ञा-पदों और उनके बीच के तनाव को बनाए रखा गया है; कथन को केवल भौतिक भरण-पोषण के अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। भूमि-विरासत की शब्दावली में ‘विरासत’ और ‘भाग’ का पुनरावर्तन जानबूझकर रखा गया है। संबोधन एकवचन है, क्योंकि यह हारून से कहा गया है।
