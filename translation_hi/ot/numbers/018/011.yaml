id: NUM.18.11
reference: Numbers 18:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זֶה לְּ/ךָ֞ תְּרוּמַ֣ת מַתָּנָ֗/ם לְ/כָל תְּנוּפֹת֮ בְּנֵ֣י יִשְׂרָאֵל֒ לְ/ךָ֣ נְתַתִּ֗י/ם וּ/לְ/בָנֶ֧י/ךָ וְ/לִ/בְנֹתֶ֛י/ךָ אִתְּ/ךָ֖ לְ/חָק עוֹלָ֑ם כָּל טָה֥וֹר בְּ/בֵיתְ/ךָ֖ יֹאכַ֥ל אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/011.yaml
  text: 'And this is yours: the contribution of their gifts[a], with all the wave offerings of the sons of Israel. I have given them to you, and to your sons and your daughters with you, as a permanent statute[b]. Everyone in your house who is clean may eat it.'
translation:
  language: hi
  text: 'और यह तुम्हारा है: उनकी भेंटों का अलग किया हुआ अंश[a], इस्राएल के पुत्रों की हिलाकर चढ़ाई गई सभी भेंटों समेत। मैंने इन्हें तुम्हें और तुम्हारे साथ तुम्हारे पुत्रों और पुत्रियों को सदा की विधि के रूप में दिया है। तुम्हारे घराने में हर वह व्यक्ति जो शुद्ध[b] हो, इसे खा सकता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “उठाकर अर्पित किया हुआ अंश” भी हो सकता है। इब्रानी शब्द पवित्र उपयोग के लिए अलग किए गए अंश को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “शुद्ध” का अर्थ धार्मिक विधि के अनुसार शुद्ध होना है, केवल शारीरिक रूप से साफ़ या नैतिक रूप से अच्छा होना नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: תְּרוּמַת מַתָּנָם
  choice: उनकी भेंटों का अलग किया हुआ अंश
  rationale: תְּרוּמָה पवित्र उपयोग के लिए अलग किए गए अंश या चढ़ावे को दर्शाता है, और מַתָּנָם का अर्थ ‘उनकी भेंटें’ है। यह अनुवाद दोनों शब्दों का भेद बनाए रखते हुए आधुनिक हिन्दी में अर्थ स्पष्ट करता है।
- source_word: תְּנוּפֹת
  choice: हिलाकर चढ़ाई गई भेंटें
  rationale: यह उपासना में परमेश्वर के सामने विधिपूर्वक हिलाकर प्रस्तुत की जाने वाली भेंटों का तकनीकी शब्द है। वर्णनात्मक हिन्दी सामान्य पाठक के लिए क्रिया और धार्मिक संदर्भ दोनों स्पष्ट करती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल की औपचारिक सामूहिक अभिव्यक्ति को सुरक्षित रखा गया है; सन्दर्भ में यह इस्राएली समुदाय का पारंपरिक नाम है।
- source_word: לְחָק עוֹלָם
  choice: सदा की विधि के रूप में
  rationale: חֹק निर्धारित विधि या अधिकार को और עוֹלָם उसके स्थायी बने रहने को व्यक्त करता है। यह हिन्दी कानूनी बल और निरंतरता दोनों रखती है।
- source_word: כָּל טָהוֹר בְּבֵיתְךָ
  choice: तुम्हारे घराने में हर वह व्यक्ति जो शुद्ध हो
  rationale: בַּיִת यहाँ केवल भवन नहीं, परिवार या घराने का क्षेत्र है। טָהוֹר याजकीय सन्दर्भ में अनुष्ठानिक शुद्धता बताता है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יֹאכַל אֹתוֹ
  choice: इसे खा सकता है
  rationale: अपूर्ण क्रिया यहाँ भविष्यवाणी के बजाय अनुमति और अधिकार व्यक्त करती है। एकवचन सर्वनाम को ‘इसे’ द्वारा सुरक्षित रखा गया है और वह सामूहिक रूप से बताए गए पवित्र अंश की ओर संकेत करता है।
theological_decisions:
- issue: शुद्धता का अर्थ
  choice: ‘शुद्ध’ को अनुष्ठानिक या विधिगत शुद्धता के अर्थ में लिया गया है।
  alternative: नैतिक रूप से निष्कलंक या केवल शारीरिक रूप से साफ़
  rationale: याजकीय व्यवस्था का प्रसंग यह निर्धारित करता है कि हारून के घराने में कौन पवित्र अंश खा सकता है; इसलिए यहाँ धार्मिक विधि के अनुसार शुद्धता अभिप्रेत है।
- issue: עוֹלָם की अवधि
  choice: ‘सदा की विधि’
  alternative: ‘अनन्त विधि’
  rationale: यह पद covenantal व्यवस्था के भीतर निरंतर और स्थायी अधिकार को व्यक्त करता है। ‘सदा’ मूल के दीर्घकालिक बल को रखता है, पर दार्शनिक अर्थ में अनन्तता की अतिरिक्त व्याख्या नहीं थोपता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘घर’ के बजाय ‘घराना’ पारिवारिक दायरे को स्पष्ट करता है। दो अलग इब्रानी धार्मिक शब्दों के भेद को ‘अलग किया हुआ अंश’ और ‘हिलाकर चढ़ाई गई भेंटें’ द्वारा बनाए रखा गया है।
