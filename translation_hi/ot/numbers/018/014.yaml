  text: כָּל חֵ֥רֶם בְּ/יִשְׂרָאֵ֖ל לְ/ךָ֥ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/014.yaml
  text: Every devoted thing in Israel shall be yours[a].
translation:
  language: hi
  text: इस्राएल में हर स्थायी रूप से समर्पित वस्तु तुम्हारी होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल में प्रतिबंध के अधीन हर वस्तु।” इब्रानी शब्द ऐसी वस्तु को दर्शाता है जो परमेश्वर के लिए अपरिवर्तनीय रूप से समर्पित की गई हो; कुछ प्रसंगों में इसका अर्थ विनाश के लिए समर्पित वस्तु भी होता है।
    reason: शब्दार्थ का वैकल्पिक तकनीकी अर्थ सुरक्षित रखना
lexical_decisions:
- source_word: כָּל
  choice: हर
  rationale: एकवचन सामूहिक संज्ञा חֵרֶם की पूरी श्रेणी को समेटता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חֵרֶם
  choice: अर्पित वस्तु
  rationale: यह शब्द ऐसी वस्तु को सूचित करता है जो परमेश्वर के लिए अपरिवर्तनीय रूप से समर्पित होकर सामान्य उपयोग से अलग कर दी गई हो; इस पद में विनाश का भाव स्पष्ट नहीं किया गया है, इसलिए व्यापक तकनीकी अर्थ मुख्य पाठ में रखा गया है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: ב यहाँ स्थान अथवा दायरे को दर्शाता है; कानूनी प्रसंग में यह सीधा और स्वाभाविक अनुवाद है।
- source_word: לְךָ
  choice: तुम्हारी
  rationale: לְךָ हारून के लिए स्वामित्व अथवा नियत अधिकार व्यक्त करता है। स्त्रीलिंग रूप 'तुम्हारी' का मेल 'वस्तु' से है।
- source_word: יִהְיֶה
  choice: होगी
  rationale: היה का अपूर्ण रूप भावी कानूनी आवंटन व्यक्त करता है; 'होगी' हिन्दी में इस विधान को सहज रूप से प्रकट करता है।
theological_decisions:
- issue: तकनीकी उपासना-संबंधी शब्द חֵרֶם का अनुवाद
  choice: अर्पित वस्तु
  alternative: प्रतिबंध के अधीन वस्तु; विनाश के लिए समर्पित वस्तु
  rationale: חֵרֶם परमेश्वर के लिए अपरिवर्तनीय समर्पण को दर्शा सकता है और कुछ प्रसंगों में विनाश के लिए समर्पण को भी। यह पद स्वयं विनाश को निर्दिष्ट नहीं करता, इसलिए मुख्य पाठ में व्यापक अर्थ रखा गया और अधिक कठोर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कानूनी-विधिक शैली। 'अर्पित वस्तु' सामान्य पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी मूल शब्द की व्यापक और प्रसंगानुसार कठोर अर्थ-सीमा स्पष्ट करती है।
