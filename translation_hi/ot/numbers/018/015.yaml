source:
  edition: WLC
  text: כָּל פֶּ֣טֶר רֶ֠חֶם לְֽ/כָל בָּשָׂ֞ר אֲשֶׁר יַקְרִ֧יבוּ לַֽ/יהוָ֛ה בָּ/אָדָ֥ם וּ/בַ/בְּהֵמָ֖ה יִֽהְיֶה לָּ֑/ךְ אַ֣ךְ פָּדֹ֣ה תִפְדֶּ֗ה אֵ֚ת בְּכ֣וֹר הָֽ/אָדָ֔ם וְ/אֵ֛ת בְּכֽוֹר הַ/בְּהֵמָ֥ה הַ/טְּמֵאָ֖ה תִּפְדֶּֽה־־־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/015.yaml
  text: Every firstborn that opens the womb[a], of all flesh that they present to Yahweh, whether man or beast, shall be yours. Nevertheless, you must surely redeem the firstborn of man[b], and you must redeem the firstborn of the unclean beast.
translation:
  language: hi
  text: हर प्राणी का वह पहिलौठा जो गर्भ खोलता है[a], जिसे वे याहवे को प्रस्तुत करें[b]—चाहे मनुष्य हो या पशु—तुम्हारा होगा। परन्तु मनुष्य के पहिलौठे को तुम अवश्य छुड़ाना, और अशुद्ध पशु के पहिलौठे को भी छुड़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गर्भ से सबसे पहले निकलनेवाला।” यह इब्रानी मुहावरा गर्भ से निकलनेवाली पहली संतान को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे के पास ले आएँ” अथवा “याहवे को अर्पित करें।” इस क्रिया का अर्थ अर्पण के प्रसंग में पास लाना या प्रस्तुत करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶּטֶר רֶחֶם
  choice: गर्भ खोलनेवाला हर पहिलौठा
  rationale: यह इब्रानी मुहावरा गर्भ से सबसे पहले निकलनेवाली संतान को दर्शाता है। अनुवाद मूल बिंब को बनाए रखता है, जबकि पादटिप्पणी उसका आशय स्पष्ट करती है।
- source_word: כָּל ... לְכָל בָּשָׂר
  choice: सभी प्राणियों में ... हर
  rationale: यह वाक्यांश मनुष्य और पशु सहित समस्त जीवित प्राणियों के व्यापक दायरे को व्यक्त करता है। हिंदी में ‘सभी प्राणियों में’ स्वाभाविक है और प्रसंगानुकूल व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר יַקְרִיבוּ לַיהוָה
  choice: जिसे वे याहवे के सामने प्रस्तुत करें
  rationale: הקריב का मूल भाव निकट लाने या अर्पणार्थ प्रस्तुत करने का है। यहाँ मनुष्य और पशु दोनों सम्मिलित हैं, इसलिए ‘प्रस्तुत करें’ ऐसा व्यापक शब्द है जो हर मामले में बलिदान किए जाने का अर्थ नहीं थोपता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी लिपि में लिप्यंतरित किया गया है।
- source_word: בָּאָדָם וּבַבְּהֵמָה
  choice: चाहे मनुष्य हो या पशु
  rationale: यह मनुष्य और पशु, दोनों क्षेत्रों में पहिलौठे के नियम के लागू होने को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יִהְיֶה לָּךְ
  choice: तुम्हारा होगा
  rationale: यह याजक के अधिकार को सीधे और संक्षेप में व्यक्त करता है।
- source_word: אַךְ
  choice: परन्तु
  rationale: यह पहले कथन पर लगाई गई महत्त्वपूर्ण सीमा या योग्यता को दर्शाता है।
- source_word: פָּדֹה תִפְדֶּה
  choice: तुम अवश्य छुड़ाना
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का संयोजन आज्ञा को बल देता है; ‘अवश्य’ उस बल को हिंदी में व्यक्त करता है।
- source_word: בְּכוֹר הָאָדָם
  choice: मनुष्य के पहिलौठे
  rationale: אָדָם यहाँ पशु के विपरीत मानव को दर्शाता है। ‘मनुष्य’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בְּכוֹר הַבְּהֵמָה הַטְּמֵאָה
  choice: अशुद्ध पशु के पहिलौठे
  rationale: यह बलिदान के योग्य न माने जानेवाले पशु की धार्मिक श्रेणी को निकटता से व्यक्त करता है।
theological_decisions:
- issue: मनुष्य और पशु के पहिलौठों पर याजकीय अधिकार का स्वरूप
  choice: पहिलौठे याजक के अधिकार में आते हैं, पर मनुष्य और अशुद्ध पशु के पहिलौठों को छुड़ाना अनिवार्य है।
  alternative: ‘प्रस्तुत करने’ को हर स्थिति में वास्तविक बलिदान समझना।
  rationale: पद का दूसरा भाग स्वयं स्पष्ट करता है कि मनुष्य और अशुद्ध पशु के पहिलौठे बलिदान नहीं किए जाते, बल्कि छुड़ाए जाते हैं।
- issue: אָדָם का अनुवाद
  choice: मनुष्य
  alternative: आदमी; मानवजाति
  rationale: यहाँ शब्द सामूहिक मानवजाति के बजाय पशु से भिन्न मानव प्राणी की श्रेणी को दर्शाता है; ‘मनुष्य’ इस विरोध को स्वाभाविक हिंदी में सुरक्षित रखता है।
- issue: ईश्वरीय नाम יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत नाम को उपाधि में बदलने के बजाय उसका हिंदी लिप्यंतरण किया गया है; इससे स्रोत का नामरूप बना रहता है।
