  register: भाषा आधुनिक मानक हिंदी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘गर्भ खोलनेवाला’ मूल इब्रानी बिंब को सुरक्षित रखता है; उसके असामान्यपन को पादटिप्पणी स्पष्ट करती है। दोनों पादटिप्पणी-चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
