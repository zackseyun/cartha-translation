id: NUM.18.24
reference: Numbers 18:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֞י אֶת מַעְשַׂ֣ר בְּנֵֽי יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יָרִ֤ימוּ לַֽ/יהוָה֙ תְּרוּמָ֔ה נָתַ֥תִּי לַ/לְוִיִּ֖ם לְ/נַחֲלָ֑ה עַל כֵּן֙ אָמַ֣רְתִּי לָ/הֶ֔ם בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל לֹ֥א יִנְחֲל֖וּ נַחֲלָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/018/024.yaml
  text: For I have given to the Levites as an inheritance the tithe of the children of Israel, which they lift up to the LORD as a contribution; therefore I have said to them, ‘Among the children of Israel they shall have no inheritance.’
translation:
  language: hi
  text: क्योंकि इस्राएलियों का वह दशमांश, जिसे वे यहोवा के लिए उठाई हुई भेंट के रूप में अर्पित करते हैं, मैंने लेवियों को विरासत में दिया है। इसी कारण मैंने उनसे कहा, ‘इस्राएलियों के बीच उन्हें कोई विरासत नहीं मिलेगी।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַעְשַׂר
  choice: दशमांश
  rationale: यह स्थापित और स्पष्ट हिन्दी शब्द है, जो उपज या आय के दसवें भाग को ठीक रूप में व्यक्त करता है।
- source_word: יָרִימוּ ... תְּרוּמָה
  choice: उठाई हुई भेंट के रूप में चढ़ाते हैं
  rationale: ‘उठाना’ क्रिया की स्रोत-भाषा की छवि को बचाता है, जबकि ‘भेंट के रूप में चढ़ाते हैं’ धार्मिक अर्पण का आशय स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है; संबंधसूचक ל को ‘के लिए’ के रूप में रखा गया है।
- source_word: נַחֲלָה
  choice: विरासत
  rationale: यह शब्द पद में लेवियों को दिए गए हिस्से और इस्राएल के बीच भू-भागीय विरासत न मिलने—दोनों संदर्भों में एक ही स्रोत-शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल की सन्तान’ की अपेक्षा यह आधुनिक हिन्दी में अधिक स्वाभाविक है और उसी सामुदायिक अर्थ को व्यक्त करता है।
theological_decisions:
- issue: लेवियों की विरासत का स्वरूप
  choice: दशमांश को उनकी ‘विरासत’ कहा गया है
  alternative: दशमांश को केवल वेतन या पारिश्रमिक कहना
  rationale: स्रोत-पाठ स्वयं दशमांश के लिए נַחֲלָה का प्रयोग करता है; इसे आर्थिक पारिश्रमिक तक सीमित करने से धार्मिक और वाचागत अर्थ संकुचित हो जाता।
- issue: प्रत्यक्ष कथन में पुरुष-वचन का तनाव
  choice: ‘मैंने उनसे कहा’ के बाद ‘वे ... नहीं पाएँगे’ रखा गया है
  alternative: ‘मैंने उनके विषय में कहा’ या उद्धरण को दूसरे पुरुष में बदलना
  rationale: हिब्रू में לָהֶם (‘उनसे/उन्हें’) और उद्धरण में तीसरा पुरुष बहुवचन दोनों उपस्थित हैं; असामान्य तनाव को चुपचाप समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वाक्य-विन्यास हिन्दी के अनुरूप है, पर ‘उठाई हुई भेंट’ और ‘विरासत’ जैसे प्रमुख स्रोत-रूपक सुरक्षित हैं।
