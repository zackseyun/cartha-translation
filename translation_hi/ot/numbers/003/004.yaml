  text: וַ/יָּ֣מָת נָדָ֣ב וַ/אֲבִיה֣וּא לִ/פְנֵ֣י יְהוָ֡ה בְּֽ/הַקְרִבָ/ם֩ אֵ֨שׁ זָרָ֜ה לִ/פְנֵ֤י יְהוָה֙ בְּ/מִדְבַּ֣ר סִינַ֔י וּ/בָנִ֖ים לֹא הָי֣וּ לָ/הֶ֑ם וַ/יְכַהֵ֤ן אֶלְעָזָר֙ וְ/אִ֣יתָמָ֔ר עַל פְּנֵ֖י אַהֲרֹ֥ן אֲבִי/הֶֽם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/004.yaml
  text: But Nadab and Abihu died before Yahweh when they offered strange fire before Yahweh in the wilderness of Sinai[a], and they had no sons[b]; and Eleazar and Ithamar served as priests in the presence of Aaron their father.
translation:
  language: hi
  text: परन्तु नादाब और अबीहू सीनै के निर्जन प्रदेश में यहोवा के सामने अनधिकृत आग[a] चढ़ाते समय यहोवा के सामने मर गए। उनके कोई पुत्र नहीं थे; और एलीआज़ार और ईतामार ने अपने पिता हारून के सामने याजक के रूप में सेवा की[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘अनधिकृत आग’ का अनुवाद ‘अजनबी आग’ या ‘पराई आग’ भी हो सकता है। इब्रानी अभिव्यक्ति सम्भवतः ऐसी आग को सूचित करती है जिसे चढ़ाने की अनुमति नहीं थी।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने पिता हारून के सामने’ का अर्थ ‘अपने पिता हारून के जीवनकाल में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गए
  rationale: एकवचन क्रिया के बाद संयुक्त कर्ता नादाब और अबीहू है; स्वाभाविक हिन्दी में बहुवचन प्रयोग किया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह इब्रानी मुहावरा उपस्थिति का भाव रखता है और न्याय-संबंधी प्रसंग में ‘के सामने’ स्वाभाविक तथा निकट अनुवाद है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: בְּהַקְרִבָם
  choice: चढ़ाते समय
  rationale: ב के साथ क्रिया का infinitive construct घटना की परिस्थिति या समय बताता है; बलिदान-संबंधी प्रसंग में ‘चढ़ाते समय’ सहज है।
- source_word: אֵשׁ זָרָה
  choice: अनधिकृत आग
  rationale: זָרָה का मूल भाव बाहरी/अपरिचित का हो सकता है, पर याजकीय प्रसंग में ऐसी आग अभिप्रेत है जिसकी अनुमति नहीं थी; ‘अनधिकृत’ आधुनिक पाठक को अर्थ स्पष्ट करता है, जबकि विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: בְּמִדְבַּר סִינַי
  choice: सीनै के जंगल में
  rationale: भौगोलिक पदबंध का स्वाभाविक हिन्दी रूप, जिसमें מדבר का निर्जन जंगल वाला बाइबलीय प्रयोग बना रहता है।
- source_word: וּבָנִים לֹא הָיוּ לָהֶם
  choice: उनके कोई पुत्र नहीं थे
  rationale: בָנִים को ‘पुत्र’ कहा गया है, क्योंकि याजकीय उत्तराधिकार के संदर्भ में पुरुष वंश का उल्लेख महत्त्वपूर्ण है।
- source_word: וַיְכַהֵן
  choice: याजक के रूप में सेवा करने लगे
  rationale: כהן का अर्थ याजकीय कार्य करना है; कथात्मक क्रिया-क्रम को हिन्दी में ‘करने लगे’ व्यक्त करता है।
- source_word: עַל פְּנֵי אַהֲרֹן אֲבִיהֶם
  choice: उनके पिता हारून के सामने
  rationale: शाब्दिक स्थानिक चित्र और हारून की उपस्थिति दोनों सुरक्षित रहते हैं; केवल ‘उसके जीवनकाल में’ या ‘उसकी देखरेख में’ कहकर अर्थ को सीमित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। आधुनिक हिन्दी बाइबल-पाठकों में पहचाने जाने वाले ‘यहोवा’ को रखा गया है, उपाधि ‘प्रभु’ से उसे प्रतिस्थापित नहीं किया गया।
- issue: אֵשׁ זָרָה का आशय
  choice: अनधिकृत आग
  alternative: अजनबी आग / पराई आग
  rationale: लैव्यव्यवस्था 10 के याजकीय संदर्भ में निषिद्ध या आज्ञा के विरुद्ध अर्पित आग का भाव प्रबल है; फिर भी शब्द की वास्तविक शाब्दिक व्यापकता पादटिप्पणी में दी गई है।
- issue: עַל פְּנֵי אַהֲרֹן से संबंध
  choice: हारून के सामने
  alternative: हारून के जीवनकाल में / हारून की देखरेख में
  rationale: मूल मुहावरा उपस्थिति, समकालिकता या अधीन सेवा की ओर संकेत कर सकता है। मुख्य पाठ निकट और अस्पष्टता-संरक्षक है; संभावित कालगत अर्थ पादटिप्पणी में है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। याजकीय शब्दावली में ‘याजक के रूप में सेवा’ तथा वंश-संदर्भ में ‘पुत्र’ चुना गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में स्पष्ट रूप से उपस्थित हैं।
