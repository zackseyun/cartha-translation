source:
  edition: WLC
  text: וּ/בְנֵ֥י קְהָ֖ת לְ/מִשְׁפְּחֹתָ֑/ם עַמְרָ֣ם וְ/יִצְהָ֔ר חֶבְר֖וֹן וְ/עֻזִּיאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/019.yaml
  text: 'And the sons of Kohath, by their clans: Amram, Izhar, Hebron, and Uzziel.'
translation:
  language: hi
  text: 'और कहात के पुत्र, उनके कुलों के अनुसार: अम्राम, यिसहार, हेब्रोन और उज्जीएल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבְנֵי
  choice: और ... के पुत्र
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है; सूची की निरंतरता दिखाने के लिए आरंभिक וּ को ‘और’ के रूप में रखा गया है।
- source_word: קְהָת
  choice: कहात
  rationale: व्यक्तिवाचक नाम का हिंदी बाइबल परंपरा के अनुरूप लिप्यंतरण।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ इस्राएली सामाजिक-वंशीय इकाई को दर्शाता है; ‘कुल’ आधुनिक हिंदी में ‘परिवार’ से अधिक उपयुक्त और संरचनात्मक है। לְ और बहुवचन संबंधसूचक प्रत्यय का भाव ‘उनके ... के अनुसार’ से स्पष्ट होता है।
- source_word: עַמְרָם
  choice: अम्राम
  rationale: इब्रानी व्यक्तिवाचक नाम का निकट लिप्यंतरण।
- source_word: וְיִצְהָר
  choice: यिसहार
  rationale: इब्रानी יִצְהָר का निकट हिंदी लिप्यंतरण; संयोजक को हिंदी सूची-विन्यास में समाहित किया गया है।
- source_word: חֶבְרוֹן
  choice: हेब्रोन
  rationale: यहाँ स्थान नहीं, व्यक्ति का नाम है; इब्रानी रूप का प्रचलित हिंदी लिप्यंतरण।
- source_word: וְעֻזִּיאֵל
  choice: और उज्जीएल
  rationale: इब्रानी व्यक्तिवाचक नाम का निकट लिप्यंतरण; अंतिम וְ को स्वाभाविक हिंदी सूची के अनुसार ‘और’ कहा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सूची-संदर्भ के अनुरूप संक्षिप्त रखी गई है। ‘कुल’ वंशीय सामाजिक इकाई का बोध कराता है, जबकि नामों में स्रोत-निकटता और हिंदी बाइबल परंपरा के बीच संतुलन रखा गया है।
