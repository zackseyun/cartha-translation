source:
  edition: WLC
  text: וַ/יִּקַּ֣ח מֹשֶׁ֔ה אֵ֖ת כֶּ֣סֶף הַ/פִּדְי֑וֹם מֵ/אֵת֙ הָ/עֹ֣דְפִ֔ים עַ֖ל פְּדוּיֵ֥י הַ/לְוִיִּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/049.yaml
  text: And Moses took the redemption money from those who were in excess over those redeemed by the Levites[a][b].
translation:
  language: hi
  text: तब मूसा ने छुटकारे का धन[a] उन लोगों से लिया, जो लेवियों के द्वारा छुड़ाए गए लोगों की संख्या से अधिक थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुड़ौती की रकम।” इब्रानी शब्द छुटकारे के लिए दिए जाने वाले भुगतान को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उन इस्राएली पहलौठों से, जिनकी संख्या छुटकारे की गणना में लेवियों द्वारा प्रतिनिधित्व किए गए लोगों की संख्या से अधिक थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिया
  rationale: לקח के सामान्य आख्यानात्मक अर्थ ‘लेना’ को सहज हिन्दी में सुरक्षित रखता है; इस प्रसंग में ‘प्राप्त किया’ भी संभव है, पर वह मूल क्रिया से कुछ अधिक व्याख्यात्मक है।
- source_word: כֶּסֶף הַפִּדְיוֹם
  choice: छुटकारे का धन
  rationale: यह पद छुटकारे के लिए दिए गए भुगतान को दर्शाता है। ‘धन’ כֶּסֶף के मौद्रिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘छुटकारा’ विधिक और प्रतिनिधिक प्रसंग बनाए रखता है।
- source_word: מֵאֵת
  choice: से
  rationale: यहाँ पूर्वसर्ग धन के स्रोत को चिह्नित करता है; हिन्दी में ‘से’ पर्याप्त और स्वाभाविक है।
- source_word: הָעֹדְפִים
  choice: जो ... संख्या से अधिक थे
  rationale: עודף का कृदन्त यहाँ पिछले प्रसंग के अनुसार गिनती में बचे हुए, अर्थात अधिक ठहरे लोगों को सूचित करता है। हिन्दी वाक्यांश तुलनात्मक संख्यात्मक अर्थ स्पष्ट करता है, बिना मुख्य पाठ में ‘इस्राएली पहलौठे’ जोड़ने के।
- source_word: עַל
  choice: से अधिक
  rationale: यहाँ עַל संख्यात्मक तुलना और अधिकता व्यक्त करता है; ‘से अधिक’ आधुनिक हिन्दी का स्पष्ट और स्वाभाविक तुलनात्मक प्रयोग है।
- source_word: פְּדוּיֵי הַלְוִיִּם
  choice: लेवियों के द्वारा छुड़ाए गए लोग
  rationale: निष्क्रिय कृदन्तीय रचना उन लोगों की ओर संकेत करती है जिनका छुटकारा लेवियों की प्रतिनिधिक गणना के द्वारा माना गया। हिन्दी में यह रूप समझने योग्य है, यद्यपि इब्रानी संबंधसूचक रचना अपने आप में ‘के द्वारा’ को पूरी तरह स्पष्ट नहीं करती।
theological_decisions:
- issue: פְּדוּיֵי הַלְוִיִּם में लेवियों और छुड़ाए गए लोगों का संबंध
  choice: लेवियों के द्वारा छुड़ाए गए लोग
  alternative: लेवियों के छुड़ाए हुए लोग
  rationale: प्रसंग में लेवी इस्राएल के पहलौठों के स्थान पर गिने गए हैं, इसलिए ‘के द्वारा’ आशय को स्वाभाविक हिन्दी में स्पष्ट करता है। फिर भी इसे व्यक्तिगत उद्धार की क्रिया न समझा जाए; संबंधित गणना का स्पष्टीकरण पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण आख्यानात्मक शैली अपनाई गई है। ‘तब’ इब्रानी कथानक-क्रम को सहज रूप देता है। मुख्य पाठ मूल की संक्षिप्तता बनाए रखता है, जबकि गिनती और प्रतिनिधिक छुटकारे की आवश्यक पृष्ठभूमि पादटिप्पणी में दी गई है।
