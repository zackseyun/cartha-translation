base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/035.yaml
  text: And the chief of the ancestral house of the clans of Merari was Zuriel son of Abihail[b][a]. They were to camp on the north side of the tabernacle.
translation:
  language: hi
  text: और मरारी के कुलों के पैतृक-घराने का प्रधान[a] अबीहैल का पुत्र सूरीएल था। वे निवास-स्थान के उत्तरी पार्श्व में डेरा डालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अगुआ”; इब्रानी शब्द נָשִׂיא किसी मान्यता-प्राप्त नेता, प्रधान अथवा शासक को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא
  choice: और ... प्रधान
  rationale: नָשִׂיא यहाँ मान्य कुल-नेतृत्व के पद को दर्शाता है; ‘प्रधान’ आधुनिक हिन्दी में स्वाभाविक है और ‘राजकुमार’ के अनावश्यक राजकीय अर्थ से बचता है। वाव को सूची की निरंतरता दिखाने के लिए ‘और’ कहा गया है।
- source_word: בֵית אָב
  choice: पैतृक घराना
  rationale: शाब्दिक अर्थ ‘पिता का घर’ है, पर इस संदर्भ में यह पितृवंशीय विस्तृत घराने अथवा कुल-इकाई का पारिभाषिक पद है। ‘पैतृक घराना’ उस नातेदारी-संरचना को संक्षेप में व्यक्त करता है।
- source_word: לְמִשְׁפְּחֹת מְרָרִי
  choice: मरारी के कुलों का
  rationale: गिनती की संगठनात्मक भाषा में מִשְׁפָּחוֹת सामान्यतः विस्तृत परिवारों से बड़ी कुल-इकाइयों को दर्शाता है; इसलिए ‘कुलों’ चुना गया है।
- source_word: צוּרִיאֵל בֶּן אֲבִיחָיִל
  choice: अबीहैल का पुत्र सूरीएल
  rationale: व्यक्तिनामों का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण किया गया है और בֶּן को ‘का पुत्र’ कहा गया है।
- source_word: עַל יֶרֶךְ הַמִּשְׁכָּן ... צָפֹנָה
  choice: निवास-स्थान की उत्तर दिशा में
  rationale: יֶרֶךְ का मूल भाव ‘पार्श्व/बगल’ है; צָפֹנָה के साथ यह निवास-स्थान के उत्तरी पार्श्व पर निर्धारित स्थिति बताता है। आधुनिक हिन्दी में ‘उत्तर दिशा में’ स्वाभाविक रूप से वही स्थान व्यक्त करता है। מִשְׁכָּן को उसके ‘निवास’ संबंधी मूल भाव के अनुसार ‘निवास-स्थान’ कहा गया है।
- source_word: יַחֲנוּ
  choice: वे ... डेरा डालें
  rationale: अपूर्ण क्रिया यहाँ निर्धारित शिविर-व्यवस्था का निर्देश देती है। ‘डेरा डालें’ विधि/आदेश के भाव को बनाए रखता है।
