  yaml_path: translation/ot/numbers/003/006.yaml
  text: Bring near the tribe of Levi[a], and set it before Aaron the priest, and they shall serve him.
translation:
  language: hi
  text: “लेवी के गोत्र को पास ले आ और उसे हारून याजक के सामने खड़ा कर; वे उसकी सेवा करें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे उसकी परिचर्या करें।” इब्रानी क्रिया सहायक के रूप में की जाने वाली सेवा या धार्मिक अनुष्ठान से जुड़ी सेवा, दोनों को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקְרֵב
  choice: पास ले आ
  rationale: קרב के हिफ़ील आज्ञार्थक का अर्थ किसी को निकट लाना है। यह अनुष्ठानिक निकटता के ठोस भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַטֵּה לֵוִי
  choice: लेवी के गोत्र
  rationale: מַטֶּה का शाब्दिक अर्थ ‘छड़ी’ हो सकता है, पर जनजातीय संदर्भ में इसका अर्थ ‘गोत्र’ है; यहाँ पूरी लेवीय जनजाति अभिप्रेत है।
- source_word: וְהַעֲמַדְתָּ אֹתוֹ
  choice: और उसे ... खड़ा कर
  rationale: עמד के हिफ़ील रूप में ‘खड़ा करना’ या ‘नियुक्त स्थान पर उपस्थित करना’ निहित है। एकवचन सर्वनाम सामूहिक संज्ञा ‘गोत्र’ के अनुरूप रखा गया है।
- source_word: לִפְנֵי אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के सामने
  rationale: לִפְנֵי का सीधा अर्थ ‘के सामने’ है और यहाँ औपचारिक रूप से प्रस्तुत किए जाने के संदर्भ में स्वाभाविक है।
- source_word: וְשֵׁרְתוּ אֹתוֹ
  choice: वे उसकी सेवा करें
  rationale: שרת सहायक अथवा अनुष्ठानिक सेवा को सूचित कर सकता है। אֹתוֹ का स्वाभाविक पूर्वपद हारून है। सामूहिक एकवचन ‘गोत्र’ के बाद इब्रानी में आए बहुवचन क्रियारूप को हिन्दी में ‘वे’ से दर्शाया गया है।
theological_decisions:
- issue: हारून के प्रति लेवियों की सेवा का स्वरूप
  choice: लेवी हारून की सेवा करें
  alternative: लेवी हारून के साथ सेवा करें
  rationale: וְשֵׁרְתוּ אֹתוֹ में प्रत्यक्ष कर्मवाचक सर्वनाम ‘उसकी/उसको’ हारून की ओर संकेत करता है। इसलिए पाठ को ‘उसके साथ सेवा करें’ बनाकर इस संबंध को धुंधला नहीं किया गया। सेवा का सहायक या अनुष्ठानिक स्वरूप कितना प्रमुख है, इसे खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक’ बाइबलीय धार्मिक पद के लिए प्रचलित हिन्दी शब्द है। सामूहिक संज्ञा के एकवचन से उसके सदस्यों के बहुवचन की ओर इब्रानी में हुआ परिवर्तन अनुवाद में भी सुरक्षित रखा गया है।
