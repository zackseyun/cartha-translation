  text: 'Count the sons of Levi by their fathers'' houses[a], by their clans: every male from a month old and upward you shall count.'
translation:
  language: hi
  text: लेवी के पुत्रों की गिनती उनके पितृ-घरानों और कुलों के अनुसार करना। एक महीने या उससे अधिक आयु के हर लड़के और पुरुष की गिनती करना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פְּקֹד / תִּפְקְדֵם
  choice: गिनती करना
  rationale: इस प्रशासनिक संदर्भ में क्रिया का अर्थ लोगों को गिनना या सूची में दर्ज करना है। हिंदी में ‘गिनती करना’ स्पष्ट है और अनावश्यक सैनिक भाव नहीं जोड़ता।
- source_word: בְּנֵי לֵוִי
  choice: लेवी के वंशज
  rationale: शाब्दिक अर्थ ‘लेवी के पुत्र’ है, पर यहाँ आगे शिशुओं तक की व्यापक वंशावली-आधारित गणना है; ‘वंशज’ मूल के वंशगत बल को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: यह पद पिता की ओर से चले आ रहे वंशगत घरानों को सूचित करता है। ‘पितृकुल’ अगले पद ‘कुल’ से इसका स्तर अलग रखते हुए अर्थ को संक्षेप और स्पष्ट रूप में देता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: कुलों के अनुसार
  rationale: ‘कुल’ यहाँ वंशगत समूह का स्वाभाविक हिंदी नाम है और पहले आए ‘पितृकुलों’ से संबंधित किंतु पृथक सामाजिक इकाई को दर्शाता है।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: यहाँ आयु नहीं, लिंग निर्दिष्ट है और एक महीने के शिशु भी सम्मिलित हैं। सामान्य हिंदी में ‘हर पुरुष’ पठनीय है; आयु-सीमा तुरंत स्पष्ट कर देती है कि इसमें बालक भी शामिल हैं।
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: एक महीने और उससे अधिक आयु के
  rationale: यह मूल की न्यूनतम आयु-सीमा को वर्तमान, सहज और सटीक हिंदी में व्यक्त करता है।
