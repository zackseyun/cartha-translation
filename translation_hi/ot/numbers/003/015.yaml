translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। आदेशात्मक हिब्रू रूप को हिंदी के सम्मानसूचक आदेश ‘करना’ से व्यक्त किया गया है। ‘पितृकुल’ और ‘कुल’ द्वारा दोनों वंशगत श्रेणियों का भेद बनाए रखा गया है।
