  text: וַ/יִּֽהְיוּ אֵ֥לֶּה בְנֵֽי לֵוִ֖י בִּ/שְׁמֹתָ֑/ם גֵּרְשׁ֕וֹן וּ/קְהָ֖ת וּ/מְרָרִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/017.yaml
  text: 'These were the sons of Levi by their names: Gershon[a], Kohath, and Merari.'
translation:
  language: hi
  text: 'और लेवी के पुत्रों के नाम ये थे: गेर्शोन, कहात और मरारी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: थे
  rationale: यहाँ क्रिया किसी अवस्था-परिवर्तन को नहीं, बल्कि वंशावली की सूची का साधारण भूतकालीन परिचय व्यक्त करती है।
- source_word: אֵלֶּה
  choice: ये
  rationale: यह संकेतवाचक शब्द आगे दिए गए नामों की ओर संकेत करता है; हिंदी में ‘नाम ये थे’ स्वाभाविक सूची-सूत्र है।
- source_word: בְנֵי לֵוִי
  choice: लेवी के पुत्रों
  rationale: यहाँ उल्लिखित तीनों व्यक्ति लेवी के प्रत्यक्ष पुत्र हैं, इसलिए ‘पुत्र’ सटीक है; व्यापक ‘वंशज’ की आवश्यकता नहीं।
- source_word: בִּשְׁמֹתָם
  choice: के नाम
  rationale: इब्रानी पदबंध का अर्थ ‘उनके नामों के अनुसार/उनके नामों से’ है। वर्तमान संदर्भ में स्वाभाविक हिंदी नाम-सूत्र ‘के नाम ये थे’ उसके आशय को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: גֵּרְשׁוֹן
  choice: गेर्शोन
  rationale: व्यक्तिनाम का मूल इब्रानी उच्चारण ध्यान में रखकर देवनागरी लिप्यंतरण किया गया है।
- source_word: קְהָת
  choice: कहात
  rationale: व्यक्तिनाम का इब्रानी रूप קְהָת देवनागरी में ‘कहात’ द्वारा स्पष्ट और प्रचलित ढंग से प्रस्तुत होता है।
- source_word: מְרָרִי
  choice: मरारी
  rationale: व्यक्तिनाम का इब्रानी-आधारित देवनागरी लिप्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज वंशावली-शैली अपनाई गई है। ‘बִשְׁמֹתָם’ का शाब्दिक ‘अपने नामों के अनुसार’ हिंदी में अनावश्यक रूप से कृत्रिम लगता, इसलिए अर्थ-समान और स्वाभाविक ‘के नाम ये थे’ चुना गया है।
