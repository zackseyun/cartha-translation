translation_notes:
  register: भाषा आधुनिक, स्पष्ट और निर्देशात्मक है। ‘छुटकारा’ सामान्य पाठकों के लिए बोधगम्य रहते हुए धार्मिक-सांस्कृतिक प्रसंग की गरिमा बनाए रखता है; ‘चाँदी’ मूल इब्रानी की ठोस शब्दावली को सुरक्षित रखता है।
