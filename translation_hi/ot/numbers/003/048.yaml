  text: וְ/נָתַתָּ֣ה הַ/כֶּ֔סֶף לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו פְּדוּיֵ֕י הָ/עֹדְפִ֖ים בָּ/הֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/048.yaml
  text: And you shall give the silver to Aaron and to his sons as the redemption price for those among them who are in excess[a].
translation:
  language: hi
  text: और उस चाँदी को हारून और उसके पुत्रों को उन लोगों की छुड़ौती के लिए दे जो उनमें अधिक रह गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यह पदबंध संक्षिप्त है; अधिक शाब्दिक रूप से, ‘उनमें अधिक रह गए लोगों के छुड़ाए हुओं के लिए।’ प्रसंग में चाँदी को उनकी छुड़ौती के भुगतान के रूप में समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: और ... देना
  rationale: संयोजक वाव के साथ काल रूप यहाँ निर्देशों की क्रमिक शृंखला में आज्ञार्थक भाव व्यक्त करता है। हिंदी का ‘और ... देना’ इस निर्देशात्मक स्वर और पिछले वाक्य से संबंध, दोनों को स्वाभाविक ढंग से बनाए रखता है।
- source_word: הַכֶּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है और प्रसंग में यही छुड़ौती के लिए दी गई धनराशि है। ‘चाँदी’ मूल शब्द की ठोस धात्विक छवि को सुरक्षित रखता है।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों को
  rationale: दोनों प्राप्तकर्ताओं को स्पष्ट रखा गया है। ‘पुत्रों’ का प्रयोग प्रसंग में हारून के याजकीय पुरुष वंशजों के लिए मूल पाठ के लिंग-विशिष्ट संकेत को बनाए रखता है।
- source_word: פְּדוּיֵי
  choice: छुटकारे की
  rationale: यह פדה से बना संबंधसूचक बहुवचन रूप है, जो छुड़ाए जाने वाले व्यक्तियों अथवा उनसे जुड़ी छुड़ौती की राशि को सूचित करता है। चूँकि वाक्य का कर्म ‘चाँदी’ है, ‘छुटकारे की चाँदी’ हिंदी में अर्थ को स्पष्ट रखते हुए मूल संबंध को अनावश्यक रूप से नहीं खोलता।
- source_word: הָעֹדְפִים
  choice: जो ... गिनती से अधिक हैं
  rationale: עודף का कृदंत उन इस्राएली पहलौठों को सूचित करता है जिनकी संख्या लेवियों की संख्या से अधिक थी। ‘गिनती से अधिक’ जनगणना-संबंधी प्रसंग को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: בָּהֶם
  choice: उनमें
  rationale: यहाँ בְּ समूह के भीतर पाए जाने वाले अधिक व्यक्तियों का संबंध बताता है; इसलिए ‘उनमें’ संक्षिप्त और स्रोत-संगत है।
