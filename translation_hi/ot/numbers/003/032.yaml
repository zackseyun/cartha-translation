  text: וּ/נְשִׂיא֙ נְשִׂיאֵ֣י הַ/לֵּוִ֔י אֶלְעָזָ֖ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֑ן פְּקֻדַּ֕ת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/032.yaml
  text: And the chief over the chiefs of the Levites was Eleazar son of Aaron the priest, having oversight of those who kept charge of the sanctuary.
translation:
  language: hi
  text: और लेवियों के प्रधानों का प्रधान याजक हारून का पुत्र एलीआज़र था। पवित्रस्थान[a] की रखवाली का दायित्व निभानेवालों की देखरेख उसी के हाथ में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वस्तुओं।” इब्रानी शब्द का अर्थ स्वयं पवित्रस्थान या उससे जुड़ी पवित्र वस्तुएँ—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּנְשִׂיא נְשִׂיאֵי הַלֵּוִי
  choice: और लेवियों के प्रधानों का प्रधान
  rationale: इब्रानी रचना का निकट अर्थ ‘प्रधानों का प्रधान’ है। ‘प्रधान’ प्रशासनिक पद और वरिष्ठता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘राजकुमार’ यहाँ अनुचित राजकीय अर्थ दे सकता है।
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक का पुत्र एलीआज़र
  rationale: यह शब्दक्रम स्वाभाविक हिन्दी में स्पष्ट करता है कि ‘याजक’ हारून को विशेषित करता है और एलीआज़र उसका पुत्र है।
- source_word: פְּקֻדַּת
  choice: देखरेख उसी के हाथ में थी
  rationale: यहाँ संज्ञा निरीक्षण, प्रभार या उत्तरदायित्व का बोध कराती है। हिन्दी की क्रियात्मक अभिव्यक्ति एलीआज़र की पर्यवेक्षी भूमिका को स्पष्ट और सहज ढंग से प्रस्तुत करती है।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: ज़िम्मेदारी निभानेवालों
  rationale: मूल में समान धातु से बने कृदंत और संज्ञा सौंपे गए दायित्व को सावधानी से निभाने का भाव देते हैं। ‘ज़िम्मेदारी निभानेवाले’ केवल पहरेदारों की अपेक्षा व्यापक सेवकीय दायित्व को व्यक्त करता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: मिलापवाले तम्बू के प्रसंग में यह पवित्र क्षेत्र अथवा उससे जुड़ी पवित्र वस्तुओं को सूचित कर सकता है। मुख्य पाठ में ‘पवित्रस्थान’ प्रसंगानुकूल और सुबोध है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘प्रधान’, ‘याजक’, ‘पवित्रस्थान’ और ‘देखरेख’ जैसे परिचित बाइबलीय-प्रशासनिक शब्द रखे गए हैं; मूल की अस्पष्टता पादटिप्पणी में संरक्षित है।
