    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: और ... प्रधान
  rationale: נָשִׂיא इस गोत्रीय-प्रशासनिक संदर्भ में अधिकार रखने वाले मुखिया या अगुवे को दर्शाता है; ‘प्रधान’ राजसत्ता का अनावश्यक संकेत दिए बिना यह अर्थ व्यक्त करता है। आरंभिक ו को सूची की निरंतरता दिखाने के लिए ‘और’ किया गया है।
- source_word: בֵּית אָב
  choice: पैतृक घराना
  rationale: शाब्दिक रूप से ‘पिता का घर’, पर यहाँ इस्राएली समाज की पितृवंशीय पारिवारिक इकाई अभिप्रेत है। ‘पैतृक घराना’ मुहावरे का अर्थ स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לְ/מִשְׁפְּחֹת
  choice: कुलों के
  rationale: מִשְׁפָּחוֹת व्यापक परिवारों अथवा कुलों को दर्शाता है। ‘कुलों’ से बֵּית אָב की छोटी पितृवंशीय इकाई और उसके ऊपर की समूह-रचना के बीच अंतर बना रहता है।
- source_word: הַ/קְּהָתִי
  choice: कहातियों
  rationale: एकवचन जातिवाचक रूप यहाँ सामूहिक अर्थ में कहात के वंशजों के लिए प्रयुक्त है; हिन्दी में बहुवचन समुदाय-सूचक रूप स्वाभाविक है।
- source_word: אֶלִיצָפָן
  choice: एलीसाफान
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן עֻזִּיאֵל
  choice: उज्जीएल का पुत्र
  rationale: वंशावली-संबंध की सामान्य हिब्रू अभिव्यक्ति को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है।
