lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक के साथ पिअेल रूप कथा को आगे बढ़ाते हुए दिव्य वाणी का प्रचलित परिचय देता है। आधुनिक हिन्दी में ‘ने…कहा’ स्वाभाविक है और अगले पद में आने वाले कथन की भूमिका स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֶל
  choice: से
  rationale: कहने की हिन्दी संरचना ‘किसी से कहना’ में यह वाणी के संबोधित व्यक्ति को स्वाभाविक रूप से चिह्नित करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस इब्रानी व्यक्तिगत नाम का मानक हिन्दी बाइबलीय रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में ‘कहा,’ स्वयं यही कार्य करता है; ‘यह कहते हुए’ जोड़ना अनावश्यक और कम स्वाभाविक होता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में व्यापक और पहचाना हुआ लिप्यंतरण है; नाम को ‘प्रभु’ से बदलने के बजाय उसका नामात्मक स्वरूप सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। इब्रानी सूत्र का शब्दशः दोहराव ‘बोला…यह कहते हुए’ न लेकर स्वाभाविक हिन्दी वाक्य-विन्यास अपनाया गया है।
