base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/027.yaml
  text: 'And for Kohath: the clan of the Amramites, and the clan of the Izharites, and the clan of the Hebronites, and the clan of the Uzzielites—these are the clans of the Kohathites.'
translation:
  language: hi
  text: और कहात के वंश में अम्रामियों का कुल, यिसहारियों का कुल, हेब्रोनियों का कुल और उज्जीएलियों का कुल था—ये कहातियों के कुल हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לִ/קְהָת
  choice: और कहात से
  rationale: वाव और संबंधसूचक לְ अगले वंशगत वर्ग का परिचय देते हैं। हिंदी में ‘कहात से’ उनके वंशज कुलों का संबंध स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: इस जनगणना और वंशावली के संदर्भ में מִשְׁפָּחָה बड़े गोत्रीय समूह के भीतर की वंशगत इकाई है; ‘कुल’ आधुनिक हिंदी में संक्षिप्त और उपयुक्त है।
- source_word: הַֽ/עַמְרָמִי
  choice: अम्रामियों
  rationale: जातिवाचक रूप अम्राम के वंशजों को सूचित करता है; हिंदी बहुवचन ‘अम्रामी’ से यह संबंध स्पष्ट रहता है।
- source_word: הַ/יִּצְהָרִי
  choice: यिसहारियों
  rationale: यह यिसहार के वंशजों का जातिवाचक नाम है; ‘यिसहारी’ मूल नाम से संबंध बनाए रखता है।
- source_word: הַֽ/חֶבְרֹנִי
  choice: हेब्रोनियों
  rationale: जातिवाचक रूप हेब्रोन के वंशजों को सूचित करता है।
- source_word: הָֽ/עָזִּיאֵלִי
  choice: उज्जीएलियों
  rationale: जातिवाचक रूप उज्जीएल के वंशजों को सूचित करता है; यह लिप्यंतरण हिब्रू नाम की ध्वनि को निकटता से रखता है।
- source_word: אֵלֶּה הֵם
  choice: ये ... हैं
  rationale: संकेतवाचक और सर्वनाम मिलकर पहचानसूचक कथन बनाते हैं; हिंदी में वर्तमानकाल स्वाभाविक है।
- source_word: מִשְׁפְּחֹת הַ/קְּהָתִי
  choice: कहातियों के कुल
  rationale: बहुवचन construct और जातिवाचक रूप सूचीबद्ध कुलों को कहात के वंशजों के अंतर्गत समेटते हैं।
