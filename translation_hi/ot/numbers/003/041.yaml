language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַחְתָּ֨ אֶת הַ/לְוִיִּ֥ם לִ/י֙ אֲנִ֣י יְהוָ֔ה תַּ֥חַת כָּל בְּכֹ֖ר בִּ/בְנֵ֣י יִשְׂרָאֵ֑ל וְ/אֵת֙ בֶּהֱמַ֣ת הַ/לְוִיִּ֔ם תַּ֣חַת כָּל בְּכ֔וֹר בְּ/בֶהֱמַ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/041.yaml
  text: And you shall take the Levites for me—I am Yahweh—in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of every firstborn among the livestock of the sons of Israel.
translation:
  language: hi
  text: तू लेवियों को मेरे लिए—मैं याहवे हूँ—इस्राएल के पुत्रों में हर पहलौठे के स्थान पर, और लेवियों के पशुधन को इस्राएल के पुत्रों के पशुधन में हर पहलौठे के स्थान पर ले।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַחְתָּ
  choice: तू ... ले लेना
  rationale: संयोजक वाव के साथ काल रूप यहाँ मूसा को दिए गए निर्देश के रूप में प्रयुक्त है। हिंदी में ‘ले लेना’ आदेशात्मक भाव को स्वाभाविक और स्पष्ट रखता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: लेवी के वंशजों और गोत्रीय समूह के लिए प्रचलित हिंदी रूप। परसर्ग के कारण तिर्यक बहुवचन प्रयुक्त है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यहाँ समर्पण और अधिकार का भाव है; ‘मेरे लिए’ हिंदी में इसे सहज रूप से व्यक्त करता है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: मूल के बलयुक्त आत्म-परिचय को सीधे और गरिमापूर्ण ढंग से रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: इस संदर्भ में यह प्रतिस्थापन को सूचित करता है; ‘के स्थान पर’ सटीक और स्वाभाविक है।
- source_word: כָּל בְּכֹר
  choice: हर पहलौठे
  rationale: एकवचन संज्ञा के साथ כָּל का वितरणात्मक भाव ‘हर’ से स्पष्ट होता है; ‘पहलौठा’ मानव और पशु दोनों संदर्भों में मूल की समानता बनाए रखता है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल का शाब्दिक और लिंग-सूचक राष्ट्रीय पदबंध सुरक्षित रखा गया है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: लेवियों के पशुओं
  rationale: בְּהֵמָה यहाँ पालतू पशुधन को सामूहिक रूप से बताता है। ‘पशुओं’ साधारण आधुनिक हिंदी में व्यापक और स्पष्ट है।
- source_word: כָּל בְּכוֹר בְּבֶהֱמַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के पशुओं के हर पहलौठे
  rationale: यह वाक्यांश स्वामित्व और पशुओं में से प्रत्येक पहलौठे का भाव स्पष्ट करता है तथा पहली प्रतिस्थापनात्मक पंक्ति के समानांतर रहता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में निजी दिव्य नाम है, केवल ‘प्रभु’ जैसी उपाधि नहीं। हिंदी के सामान्य बाइबलीय प्रयोग में पहचाने जाने वाले ‘यहोवा’ को अपनाते हुए नाम की प्रकृति सुरक्षित रखी गई है।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल का व्याकरणिक रूप और पारंपरिक वंशगत अभिव्यक्ति मुख्य पाठ में सुरक्षित है; राष्ट्रीय समूह को सहज हिंदी में व्यक्त करने वाला विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और निर्देशात्मक हिंदी। मूसा को संबोधन के लिए एकवचन ‘तू’ रखा गया है, जो बाइबलीय दिव्य संबोधन में निकटता और अधिकार दोनों व्यक्त करता है। लंबे मूल वाक्य की समानांतर संरचना और बीच का दिव्य आत्म-परिचय डैशों द्वारा सुरक्षित रखा गया है।
