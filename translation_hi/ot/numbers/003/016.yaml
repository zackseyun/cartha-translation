base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/016.yaml
  text: So Moses counted them at the command of Yahweh[a], just as he had been commanded.
translation:
  language: hi
  text: तब मूसा ने याहवे की आज्ञा के अनुसार[a] उनकी गिनती की, जैसा उसे आदेश दिया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “याहवे के मुँह के अनुसार।”'
    reason: मूल इब्रानी मुहावरे के शाब्दिक रूप को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: गिनती की
  rationale: लेवियों की जनगणना के इस प्रसंग में פקד का अर्थ व्यक्तियों को गिनना या उनकी संख्या दर्ज करना है; ‘गिनती की’ सहज और स्पष्ट हिन्दी है।
- source_word: אֹתָם
  choice: उनकी
  rationale: यह कर्मवाचक सर्वनाम प्रसंग में पहले बताए गए लेवियों की ओर संकेत करता है। हिन्दी में ‘उनकी गिनती की’ स्वाभाविक अभिव्यक्ति है।
- source_word: עַל פִּי יְהוָה
  choice: यहवे की आज्ञा के अनुसार
  rationale: עַל־פִּי का शाब्दिक अर्थ ‘के मुँह के अनुसार’ है, पर यह मुहावरा यहाँ अधिकारपूर्ण आदेश के अनुसार कार्य करने को दर्शाता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר
  choice: ठीक जैसा
  rationale: यह पहले दिए गए आदेश और मूसा के कार्य के बीच सटीक अनुरूपता व्यक्त करता है।
- source_word: צֻוָּה
  choice: उसे आदेश दिया गया था
  rationale: यह पुअल कर्मवाच्य रूप है; संदर्भ से इसका अभिप्रेत व्यक्ति मूसा है। पूर्ण भूतकाल पूर्व में दिए जा चुके आदेश को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है; ‘यहोवा’ पारंपरिक वैकल्पिक लिप्यंतरण है और ‘प्रभु’ नाम के स्थान पर उपाधि रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘आज्ञा के अनुसार’ मूल मुहावरे का स्वाभाविक अर्थ देता है, जबकि पादटिप्पणी उसका शाब्दिक रूप बताती है।
