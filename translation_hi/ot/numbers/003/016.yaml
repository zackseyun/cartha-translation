- from: इसलिए मूसा ने यहवे की आज्ञा के अनुसार[a] उनकी गिनती की, ठीक जैसा उसे आदेश दिया गया था।
  to: तब मूसा ने याहवे की आज्ञा के अनुसार[a] उनकी गिनती की, जैसा उसे आदेश दिया गया था।
  rationale: Revisions remove the added inferential “इसलिए,” use a clearer Devanagari transliteration of the divine name, and smooth the final comparative clause while retaining the Hebrew passive and its contextual reference to Moses.
