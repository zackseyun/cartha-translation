  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली-शैली अपनाई गई है। 'कुल' जनगणना-संदर्भ में पारिवारिक समूह का सहज बोध कराता है; किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ा गया।
