base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/018.yaml
  text: 'And these are the names of the sons of Gershon by their clans: Libni and Shimei.'
translation:
  language: hi
  text: 'और उनके कुलों के अनुसार गेर्शोन के पुत्रों के नाम ये हैं: लिबनी और शिमी।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵלֶּה
  choice: और ... ये हैं
  rationale: संयोजक ו और संकेतवाचक אֵלֶּה पिछली बात से जोड़ते हुए सूची का परिचय देते हैं; हिंदी वाक्य-विन्यास में इसे स्वाभाविक रूप से विभाजित किया गया है।
- source_word: שְׁמוֹת
  choice: नाम
  rationale: यह रचना-संबंधी रूप है और आगे आने वाले 'गेर्शोन के पुत्रों' से जुड़कर 'पुत्रों के नाम' का अर्थ देता है।
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: गेर्शोन के पुत्रों
  rationale: בְּנֵי का मूल अर्थ 'पुत्र' है, और यहाँ आगे दो पुरुष संतानों के नाम दिए गए हैं; इसलिए व्यापक 'वंशजों' के बजाय 'पुत्रों' उपयुक्त है।
- source_word: לְ/מִשְׁפְּחֹתָ/ם
  choice: उनके कुलों के अनुसार
  rationale: गणना और वंशावली के संदर्भ में מִשְׁפָּחָה एक विस्तृत पारिवारिक इकाई या कुल को दर्शाता है; לְ विभाजन अथवा वर्गीकरण का भाव देता है।
- source_word: לִבְנִי
  choice: लिबनी
  rationale: व्यक्तिनाम का प्रचलित और स्रोत-सन्निकट देवनागरी लिप्यंतरण।
- source_word: וְ/שִׁמְעִי
  choice: और शिमी
  rationale: व्यक्तिनाम को संयोजक सहित सूची के अंतिम सदस्य के रूप में स्वाभाविक हिंदी में रखा गया है।
