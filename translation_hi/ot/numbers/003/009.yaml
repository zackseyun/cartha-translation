  text: וְ/נָתַתָּה֙ אֶת הַ/לְוִיִּ֔ם לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו נְתוּנִ֨ם נְתוּנִ֥ם הֵ֨מָּה֙ ל֔/וֹ מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/009.yaml
  text: You shall give the Levites to Aaron and to his sons[b][a]; they are wholly given to him from among the sons of Israel.
translation:
  language: hi
  text: तुम लेवियों को हारून और उसके पुत्रों को सौंप देना; वे इस्राएल के पुत्रों में से[b] उसके लिए पूरी तरह सौंपे गए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में बल देने के लिए ‘सौंपे गए’ शब्द दोहराया गया है: ‘सौंपे गए, सौंपे गए’ अथवा ‘निश्चय ही सौंपे गए।’'
    reason: lexical_alternative
  - marker: b
    text: या, ‘इस्राएलियों में से।’ इब्रानी का शाब्दिक रूप है, ‘इस्राएल के पुत्रों में से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: तुम ... सौंप देना
  rationale: निर्देशात्मक प्रसंग में संयोजक सहित पूर्ण क्रिया आज्ञात्मक बल रखती है। यहाँ ‘सौंप देना’ लेवियों को हारून और उसके पुत्रों की सेवा के लिए दिए जाने का भाव स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी गोत्र के उन सदस्यों का स्थापित हिंदी पद है जिन्हें पवित्र-स्थान की सेवा के लिए अलग किया गया था।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों को
  rationale: לְ अप्रत्यक्ष कर्म अथवा लाभार्थी को सूचित करता है; ‘को’ देने/सौंपने की संरचना को स्पष्ट रखता है।
- source_word: נְתוּנִם נְתוּנִם
  choice: पूरी तरह सौंपे गए
  rationale: ‘दिए हुए’ की पुनरुक्ति इब्रानी में प्रबल बलाघात देती है। स्वाभाविक हिंदी में ‘पूरी तरह सौंपे गए’ उसी जोर को व्यक्त करता है; शाब्दिक पुनरुक्ति पाद-टिप्पणी में दी गई है।
- source_word: הֵמָּה
  choice: वे ... हैं
  rationale: स्वतंत्र सर्वनाम कर्ता को उभारता है। हिंदी में ‘वे’ और बलाघाती विधेय मिलकर इस प्रभाव को पर्याप्त रूप से व्यक्त करते हैं।
- source_word: לוֹ
  choice: उसे
  rationale: निकटतम पूर्वपद हारून है; इसलिए एकवचन सर्वनाम उसी की ओर संकेत करता है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: מֵאֵת स्रोत को और इस संदर्भ में व्यापक समुदाय में से चुने जाने को सूचित करता है। ‘इस्राएल के पुत्र’ मूल की पारिवारिक-वाचक अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल में अक्षरशः ‘इस्राएल के पुत्र’ है। पारिवारिक और वाचा-संबंधी अभिव्यक्ति बनाए रखी गई है, जबकि अधिक सहज सामूहिक रूप पाद-टिप्पणी में दिया गया है।
- issue: लेवियों के दिए जाने की तीव्रता
  choice: पूरी तरह सौंपे गए
  alternative: दिए हुए, दिए हुए
  rationale: दोहरे נְתוּנִם का बल बनाए रखा गया है, पर इसे किसी विशेष सांप्रदायिक समर्पण-सिद्धांत के रूप में नहीं समझाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज निर्देशात्मक स्वर रखा गया है। ‘सौंप देना’ प्रशासनिक और सेवकाई-संबंधी हस्तांतरण को स्पष्ट करता है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
