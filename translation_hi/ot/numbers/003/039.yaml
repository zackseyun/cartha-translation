id: NUM.3.39
reference: Numbers 3:39
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כָּל פְּקוּדֵ֨י הַ/לְוִיִּ֜ם אֲשֶׁר֩ פָּקַ֨ד מֹשֶׁ֧ה וְׄ/אַׄהֲׄרֹ֛ׄןׄ עַל פִּ֥י יְהוָ֖ה לְ/מִשְׁפְּחֹתָ֑/ם כָּל זָכָר֙ מִ/בֶּן חֹ֣דֶשׁ וָ/מַ֔עְלָ/ה שְׁנַ֥יִם וְ/עֶשְׂרִ֖ים אָֽלֶף־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/039.yaml
  text: All those counted of the Levites[a], whom Moses and Aaron counted at the command of Yahweh, by their clans, every male from a month old and upward, were twenty-two thousand.
translation:
  language: hi
  text: लेवियों में से वे सभी, जिन्हें मूसा और हारून[b] ने याहवे की आज्ञा[a] से उनके कुलों के अनुसार गिना था—अर्थात एक महीने या उससे अधिक उम्र का हर पुरुष—कुल बाईस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुख के अनुसार”; यह याहवे की आज्ञा को व्यक्त करने वाला इब्रानी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: मसोरा-पाठ में “और हारून” के अक्षरों के ऊपर असाधारण बिंदु हैं। ये प्राचीन लिपिकीय संकेत हैं, पर उनका ठीक आशय निश्चित नहीं है।
    reason: textual_note
lexical_decisions:
- source_word: פְּקוּדֵי / פָּקַד
  choice: जिन्हें ... गिना था
  rationale: यहाँ दोनों रूप जनगणना में गिने जाने और उसकी कुल संख्या को बताते हैं। ‘गिना’ सहज आधुनिक हिन्दी है और अनावश्यक सैनिक अर्थ नहीं जोड़ता।
- source_word: הַלְוִיִּם
  choice: लेवियों
  rationale: यह लेवी गोत्र के लोगों का मानक हिन्दी नाम है।
- source_word: עַל פִּי יְהוָה
  choice: याहवे की आज्ञा से
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘याहवे के मुख के अनुसार’ है, पर यहाँ उसका आशय याहवे के आदेश अथवा अधिकार से है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम YHWH को पदवी से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: मִשְׁפָּחָה यहाँ जनगणना की वंश-आधारित सामाजिक इकाइयों को सूचित करता है; ‘कुल’ आधुनिक संकीर्ण परिवार से अधिक उपयुक्त है।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: मूल पाठ स्पष्ट रूप से पुरुष लिंग के प्रत्येक सदस्य को गिनता है। आयु में शिशु भी शामिल हैं, इसलिए वाक्य में आयु-सीमा साथ रखी गई है।
- source_word: מִבֶּן חֹדֶשׁ וָמַעְלָה
  choice: एक महीने या उससे अधिक उम्र का
  rationale: यह आयु की निचली सीमा बताने वाला सूत्र है; यह हिन्दी रूप अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: שְׁנַיִם וְעֶשְׂרִים אָלֶף
  choice: बाईस हज़ार
  rationale: इब्रानी संख्या का सीधा हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: यहाँ मूल पाठ में चार-अक्षरीय विशिष्ट नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है और उसे किसी पदवी में नहीं बदलता।
- issue: मूसा के साथ हारून का उल्लेख
  choice: मुख्य पाठ में ‘हारून’ को बनाए रखा गया
  alternative: असाधारण मसोरा-बिंदुओं के आधार पर ‘हारून’ को हटाना
  rationale: व्यंजनात्मक मसोरा-पाठ में ‘और हारून’ मौजूद है, इसलिए उसे मुख्य पाठ में रखा गया है। उसके ऊपर के असाधारण बिंदुओं का निश्चित आशय अज्ञात होने के कारण पाठ से नाम हटाना उचित नहीं; संकेत को पादटिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मुख्य इब्रानी वाक्य की कुल-संख्या वाली संरचना को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘कुल बाईस हज़ार थे’ अंत में रखा गया है। अंतःस्थ व्याख्यात्मक खंड आयु और लिंग की जनगणना-सीमा को स्पष्ट करता है।
