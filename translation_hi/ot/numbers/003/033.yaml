base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/033.yaml
  text: 'For Merari: the clan of the Mahlites and the clan of the Mushites; these are the clans of Merari.'
translation:
  language: hi
  text: 'मरारी के लिए: महलियों का कुल और मूशियों का कुल; ये मरारी के कुल हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִמְרָרִי
  choice: मरारी के वंश में
  rationale: यहाँ לְ सूची के शीर्षक और उससे जुड़े वंश-समूह का परिचय देता है। हिंदी में ‘मरारी के वंश में’ वर्गीकरण और वंशगत संबंध दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: गणना और वंशावली के इस प्रसंग में מִשְׁפָּחָה निकट संबंध वाले वंश-समूह को दर्शाता है। ‘कुल’ आधुनिक हिंदी में ‘परिवार’ से व्यापक और ‘गोत्र’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: הַמַּחְלִי
  choice: महलियों
  rationale: यह महली से निकले समूह का वंशवाची नाम है; ‘महलियों’ बहुवचन समुदाय-सूचक अर्थ को सुरक्षित रखता है।
- source_word: וּמִשְׁפַּחַת
  choice: और ... का कुल
  rationale: संयोजक दूसरे कुल को पहले के समान स्तर पर जोड़ता है; हिंदी में संरचना की पुनरावृत्ति सूची को स्पष्ट रखती है।
- source_word: הַמּוּשִׁי
  choice: मूशियों
  rationale: यह मूशी से जुड़े वंश-समूह का समुदाय-सूचक नाम है; ‘मूशियों’ उसी समानांतर रूप को बनाए रखता है जो ‘महलियों’ में है।
- source_word: אֵלֶּה הֵם
  choice: ये ... हैं
  rationale: संकेतवाचक और सर्वनाम का संयुक्त बल हिंदी की स्वाभाविक पहचान-वाक्य संरचना ‘ये ... हैं’ में पर्याप्त रूप से व्यक्त होता है।
- source_word: מִשְׁפְּחֹת מְרָרִי
  choice: मरारी के कुल
  rationale: यह पहले बताए गए दोनों उपसमूहों का बहुवचन सार है और पूरे पद में מִשְׁפָּחָה के लिए ‘कुल’ की संगति बनाए रखता है।
