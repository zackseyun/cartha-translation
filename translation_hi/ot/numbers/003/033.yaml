  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। व्यक्तिनामों को देवनागरी में निकट ध्वन्यात्मक रूप से लिखा गया है; वंशवाची रूपों को हिंदी बहुवचन में प्रस्तुत किया गया है।
