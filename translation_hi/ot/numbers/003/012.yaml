  text: וַ/אֲנִ֞י הִנֵּ֧ה לָקַ֣חְתִּי אֶת הַ/לְוִיִּ֗ם מִ/תּוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל תַּ֧חַת כָּל בְּכ֛וֹר פֶּ֥טֶר רֶ֖חֶם מִ/בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הָ֥יוּ לִ֖/י הַ/לְוִיִּֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/012.yaml
  text: And I—behold[a], I have taken the Levites from among the sons of Israel in place of every firstborn that opens the womb among the sons of Israel, and the Levites shall be mine.
translation:
  language: hi
  text: “और मैं—देखो, मैंने इस्राएल के पुत्रों[a] में से लेवियों को इस्राएल के पुत्रों में हर उस पहिलौठे के स्थान पर ले लिया है जो गर्भ खोलता है; और लेवी मेरे होंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली।” दोनों स्थानों पर इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “इस्राएल के पुत्र” है; यह एक रूढ़, पुल्लिंग पदबंध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं
  rationale: संयोजक और स्पष्ट प्रथम-पुरुष सर्वनाम दोनों को रखते हुए वक्ता के बलपूर्ण कथन को सुरक्षित रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: इब्रानी संकेतसूचक और बलदायक अव्यय का स्वाभाविक, वर्तमान हिन्दी रूप है।
- source_word: לָקַחְתִּי
  choice: मैंने ... ले लिया है
  rationale: पूर्ण क्रिया और उसके वर्तमान में बने हुए परिणाम—परमेश्वर द्वारा लेवियों का चयन—दोनों को व्यक्त करता है।
- source_word: הַלְוִיִּם
  choice: लेवियों / लेवी
  rationale: समुदाय के लिए हिन्दी में प्रचलित नाम; कर्मकारक में ‘लेवियों’ और विधेय में सामूहिक ‘लेवी’ स्वाभाविक है।
- source_word: מִתּוֹךְ
  choice: में से
  rationale: किसी बड़े समुदाय के भीतर से चुन लिए जाने का सहज हिन्दी रूप है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी की शाब्दिक रूप से पुल्लिंग और रूढ़ वाचायी अभिव्यक्ति को बनाए रखता है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: इस विधिक और उपासना-संबंधी प्रसंग में प्रतिस्थापन का अर्थ स्पष्ट करता है।
- source_word: כָּל בְּכוֹר פֶּטֶר רֶחֶם
  choice: हर उस पहिलौठे ... जो गर्भ से सबसे पहले जन्मता है
  rationale: इब्रानी विधिक पदबंध ‘गर्भ खोलनेवाला’ का आशय सामान्य पाठक के लिए स्पष्ट करता है, जबकि पहिलौठे की श्रेणी सुरक्षित रहती है।
- source_word: וְהָיוּ לִי
  choice: इसलिए लेवी मेरे होंगे
  rationale: लेवियों पर परमेश्वर के दावे और पिछले चयन के परिणाम को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल की रूढ़, व्याकरणतः पुल्लिंग अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है, और अधिक मुहावरेदार सामूहिक रूप को पादटिप्पणी में बताया गया है।
- issue: וְהָיוּ לִי में लेवियों का परमेश्वर से संबंध
  choice: लेवी मेरे होंगे
  alternative: लेवी मेरे अधिकार में होंगे / लेवी मेरे होंगे अर्थात मुझसे संबंधित होंगे
  rationale: यह रूप समर्पित होने और परमेश्वर के दावे को सीधे व्यक्त करता है, पर किसी बाद की धर्मवैज्ञानिक श्रेणी को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट शैली अपनाई गई है। ‘देखो’ से הִנֵּה का बल रखा गया है। लंबे इब्रानी वाक्य को हिन्दी में पठनीय बनाने के लिए विरामचिह्नों और ‘इसलिए’ का प्रयोग किया गया है, बिना प्रतिस्थापन और दिव्य अधिकार के संबंध को बदलते हुए।
