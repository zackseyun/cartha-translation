  text: וְ/שָׁמְר֣וּ אֶת מִשְׁמַרְתּ֗/וֹ וְ/אֶת מִשְׁמֶ֨רֶת֙ כָּל הָ֣/עֵדָ֔ה לִ/פְנֵ֖י אֹ֣הֶל מוֹעֵ֑ד לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/007.yaml
  text: They shall keep his charge and the charge of the whole congregation before the tent of meeting, to perform the service of the tabernacle.
translation:
  language: hi
  text: वे मिलापवाले तंबू के सामने उसकी ज़िम्मेदारी[a] और सारी सभा की ज़िम्मेदारी निभाएँ, ताकि वे निवास-स्थान की सेवा का कार्य करें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके दायित्व की रखवाली करें” या “उसके दायित्व का पालन करें।” इब्रानी क्रिया और संज्ञा का यह युग्म रक्षा या देखरेख के साथ सौंपे गए दायित्व को निष्ठापूर्वक पूरा करने का भाव भी रखता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् लेवी निवास-स्थान के संबंध में हारून और सारी सभा से जुड़ी ज़िम्मेदारियाँ निभाते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְשָׁמְרוּ אֶת־מִשְׁמַרְתּוֹ
  choice: वे उसकी सौंपी हुई ज़िम्मेदारी निभाएँ
  rationale: क्रिया שׁמר और संज्ञा מִשְׁמֶרֶת का युग्म किसी सौंपे हुए दायित्व की रक्षा, देखरेख और निष्ठापूर्वक निर्वाह का भाव देता है। आधुनिक हिन्दी में ‘सौंपी हुई ज़िम्मेदारी निभाएँ’ इस व्यापक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֶת־מִשְׁמֶרֶת כָּל־הָעֵדָה
  choice: और पूरी सभा की सौंपी हुई ज़िम्मेदारी
  rationale: पहले מִשְׁמֶרֶת के साथ समान शब्दावली रखकर इब्रानी समानांतरता बचाई गई है। यहाँ आशय पूरी इस्राएली सभा से संबंधित अथवा उसकी ओर से निभाई जाने वाली ज़िम्मेदारी है।
- source_word: הָעֵדָה
  choice: सभा
  rationale: गिनती की पुस्तक में עֵדָה इस्राएल के संगठित समुदाय को दर्शाता है। ‘सभा’ आधुनिक, संक्षिप्त और उपासना-संबंधी संदर्भ के अनुकूल है।
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के सामने
  rationale: לִפְנֵי का स्थानवाचक अर्थ ‘के सामने’ है। אֹהֶל מוֹעֵד के लिए ‘मिलापवाला तंबू’ हिन्दी बाइबलीय परंपरा में परिचित है और उस नियत भेंट-स्थान का संकेत देता है।
- source_word: לַעֲבֹד אֶת־עֲבֹדַת
  choice: और इस प्रकार ... की सेवा करें
  rationale: इब्रानी में עבד की धातु और उससे बनी संज्ञा עֲבֹדָה साथ आती हैं। शब्दशः पुनरुक्ति हिन्दी में अस्वाभाविक होती; ‘सेवा करें’ उद्देश्य और कार्य, दोनों को स्पष्ट रखता है, जबकि ‘इस प्रकार’ पिछले दायित्वों से इसका संबंध दिखाता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן मूलतः ‘निवास-स्थान’ है और इस प्रसंग में उस पवित्र तंबू को दर्शाता है जहाँ परमेश्वर का निवास माना गया। ‘पवित्र निवास’ अर्थ को स्पष्ट करता है और साधारण पाठक के लिए स्वाभाविक है।
theological_decisions:
- issue: מִשְׁמַרְתּוֹ में एकवचन पुल्लिंग प्रत्यय का संदर्भ
  choice: ‘उसकी’ रखा गया है; निकट संदर्भ में इसका सबसे स्वाभाविक संकेत हारून की ओर है।
  alternative: इसे व्यापक रूप से याजकीय दायित्व या पवित्र स्थान की देखरेख से संबंधित माना जा सकता है।
  rationale: पिछले पद में लेवियों को हारून और उसके पुत्रों की सेवा के लिए दिए जाने की बात है, इसलिए हारून निकटतम स्वाभाविक पूर्वपद है। फिर भी मुख्य पाठ में नाम जोड़ने के बजाय मूल की सर्वनामगत अभिव्यक्ति और उसकी सीमित अस्पष्टता रखी गई है।
- issue: पूरी सभा की ज़िम्मेदारी का स्वरूप
  choice: वाक्य को ऐसा रखा गया है कि लेवी पूरी सभा से संबंधित या उसकी ओर से पवित्र-स्थान की ज़िम्मेदारी निभाते हैं।
  alternative: इसे केवल सभा की निगरानी करने की ज़िम्मेदारी समझा जा सकता है।
  rationale: वाक्य-समानांतरता और पवित्र निवास की सेवा का उद्देश्य लेवियों की प्रतिनिधिक पवित्र-स्थान संबंधी भूमिका की ओर संकेत करता है; पाठ स्वयं इससे अधिक विस्तार नहीं देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘सौंपी हुई ज़िम्मेदारी निभाएँ’ के द्वारा इब्रानी शब्द-युग्म का संरक्षक और दायित्वपरक दोनों भाव व्यक्त किया गया है। ‘मिलापवाला तंबू’ परिचित हिन्दी बाइबलीय पद है; ‘पवित्र निवास’ מִשְׁכָּן के मूल अर्थ को पारदर्शी बनाता है।
