    reason: lexical_alternative
  - marker: b
    text: या ‘डोरियाँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: עַמֻּדֵי
  choice: खंभे
  rationale: यह शब्द आँगन के घेरे को सहारा देने वाले सीधे खड़े ढाँचागत खंभों को दर्शाता है; आधुनिक हिन्दी में ‘खंभे’ स्वाभाविक और स्पष्ट है।
- source_word: הֶחָצֵר
  choice: आँगन
  rationale: यह निवास-स्थान के चारों ओर के घिरे हुए खुले क्षेत्र को दर्शाता है; ‘आँगन’ सामान्य आधुनिक हिन्दी में सुबोध है।
- source_word: סָבִיב
  choice: चारों ओर के
  rationale: यह आँगन की पूरी परिधि में स्थित खंभों का भाव स्पष्ट करता है और हिन्दी में स्वाभाविक वाक्य-विन्यास देता है।
- source_word: אַדְנֵיהֶם
  choice: उनके आधार
  rationale: निवास-स्थान के वर्णनों में यह खंभों को थामने वाले ढाँचागत आधारों या खाँचेदार चौकियों का सूचक है; ‘आधार’ सरल और पर्याप्त व्यापक है।
- source_word: יְתֵדֹתָם
  choice: उनकी खूँटियाँ
  rationale: यह ढाँचे को बाँधकर स्थिर रखने के लिए भूमि में गाड़ी जाने वाली खूँटियों को दर्शाता है।
- source_word: מֵיתְרֵיהֶם
  choice: उनकी रस्सियाँ
  rationale: यह ढाँचे को खूँटियों से कसकर बाँधने वाली डोरियों या रस्सियों को दर्शाता है; ‘रस्सियाँ’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: וְ
  choice: और
  rationale: बार-बार आया संयोजक इस पद को पिछली सामग्री-सूची की निरंतरता के रूप में रखता है; ‘और’ से उसकी गणनात्मक शैली बनी रहती है।
