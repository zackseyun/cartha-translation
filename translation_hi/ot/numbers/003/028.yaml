  text: בְּ/מִסְפַּר֙ כָּל זָכָ֔ר מִ/בֶּן חֹ֖דֶשׁ וָ/מָ֑עְלָ/ה שְׁמֹנַ֤ת אֲלָפִים֙ וְ/שֵׁ֣שׁ מֵא֔וֹת שֹׁמְרֵ֖י מִשְׁמֶ֥רֶת הַ/קֹּֽדֶשׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/028.yaml
  text: By the number of every male from a month old and upward[a], there were eight thousand six hundred, keeping charge of the holy place.
translation:
  language: hi
  text: एक महीने या उससे अधिक आयु वाले हर पुरुष की गिनती में कुल 8,600 थे; वे पवित्र स्थान[a] की देखरेख की जिम्मेदारी निभाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र वस्तुओं की देखरेख की जिम्मेदारी निभाते थे।”
    reason: הַקֹּדֶשׁ स्थान अथवा पवित्र वस्तुओं—दोनों को सूचित कर सकता है।
lexical_decisions:
- source_word: בְּמִסְפַּר כָּל זָכָר
  choice: हर पुरुष की गिनती के अनुसार
  rationale: यह जनगणना का सूत्र है। यह अनुवाद בְּמִסְפַּר का संबंध संख्या-निर्धारण से बनाए रखता है और כָּל זָכָר के पुरुष-विशेष संदर्भ को स्पष्ट करता है।
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: एक महीने या उससे अधिक आयु के
  rationale: यह आयु की न्यूनतम सीमा बताने वाला मानक इब्रानी प्रयोग है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: שְׁמֹנַת אֲלָפִים וְשֵׁשׁ מֵאוֹת
  choice: 8,600
  rationale: अंकों में संख्या साधारण पाठक के लिए तुरंत स्पष्ट है और मूल संख्या को ठीक-ठीक प्रस्तुत करती है।
- source_word: שֹׁמְרֵי מִשְׁמֶרֶת
  choice: देखरेख का दायित्व सँभालते थे
  rationale: संजात पदों का यह मेल किसी सौंपी हुई, निरंतर जिम्मेदारी को दर्शाता है; हिन्दी में शाब्दिक पुनरुक्ति से बचते हुए यही भाव स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: याजकीय संदर्भ में यह पवित्र क्षेत्र या निवासस्थान को सूचित कर सकता है। 'पवित्रस्थान' स्थानगत अर्थ को स्पष्ट रखता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הַקֹּדֶשׁ का संदर्भ पवित्र स्थान है या पवित्र वस्तुएँ
  choice: मुख्य पाठ में ‘पवित्रस्थान’
  alternative: ‘पवित्र वस्तुओं’
  rationale: संदर्भ लेवियों की पवित्र क्षेत्र से जुड़ी जिम्मेदारी का है, इसलिए स्थानगत अर्थ मुख्य पाठ में अधिक संभावित है; फिर भी इब्रानी संज्ञा पवित्र वस्तुओं को भी सूचित कर सकती है, अतः इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; जनगणना की औपचारिक शैली को बनाए रखते हुए वाक्य को दो भागों में रखा गया है ताकि संख्या और सौंपे गए दायित्व दोनों सहज रूप से समझ आएँ।
