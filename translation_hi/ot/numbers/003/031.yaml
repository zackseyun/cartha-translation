base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/031.yaml
  text: And their duty was the ark[a], the table, the lampstand, the altars, the vessels of the sanctuary with which they minister, the screen[c][b], and all its service.
translation:
  language: hi
  text: और उनकी ज़िम्मेदारी[a] संदूक, मेज़, दीपाधार, वेदियाँ, पवित्रस्थान के वे पात्र[b] जिनसे वे पवित्र सेवा करते थे, प्रवेश का परदा[c], और उसकी सारी सेवा थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी देखरेख में था” अथवा “उनका दायित्व था।”
    reason: lexical_alternative
  - marker: b
    text: या “पवित्र पात्र” अथवा “पवित्रस्थान के उपकरण।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात प्रवेश पर लगा परदा; यह भीतर का विभाजक परदा नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִשְׁמַרְתָּם
  choice: और उनकी ज़िम्मेदारी ... की थी
  rationale: मिश्मेरेत याजकीय और पवित्रस्थान के प्रसंग में सौंपी गई देखरेख, दायित्व या ज़िम्मेदारी को दर्शाता है। हिंदी में यह संरचना स्वाभाविक रूप से बताती है कि इन वस्तुओं की देखभाल उनका निर्धारित दायित्व था।
- source_word: הָאָרֹן
  choice: सन्दूक
  rationale: यह पवित्र मिलापवाले तम्बू के सन्दूक का सामान्य पद है। मूल में केवल ‘सन्दूक’ है, इसलिए ‘वाचा का’ या ‘साक्षी का’ नहीं जोड़ा गया।
- source_word: הַשֻּׁלְחָן
  choice: मेज़
  rationale: मूल पाठ केवल निश्चित ‘मेज़’ कहता है; प्रसंग से पवित्रस्थान की मेज़ स्पष्ट है।
- source_word: הַמְּנֹרָה
  choice: दीपाधार
  rationale: यह दीपकों को थामने वाले पवित्र उपकरण को दर्शाता है; ‘दीपाधार’ अर्थ को स्पष्ट और संक्षिप्त रूप में व्यक्त करता है।
- source_word: הַמִּזְבְּחֹת
  choice: वेदियाँ
  rationale: हिब्रू रूप बहुवचन है, इसलिए उसे बहुवचन में ही रखा गया है।
- source_word: וּכְלֵי הַקֹּדֶשׁ
  choice: पवित्रस्थान के ... पात्र
  rationale: כְּלִים उपकरणों, पात्रों या बर्तनों को दर्शा सकता है और הַקֹּדֶשׁ यहाँ पवित्रस्थान के संदर्भ में है। ‘पात्र’ गरिमापूर्ण और व्यापक हिंदी विकल्प है।
- source_word: אֲשֶׁר יְשָׁרְתוּ בָהֶם
  choice: जिनसे वे पवित्र सेवा करते थे
  rationale: שׁרת सामान्य काम नहीं बल्कि उपासना-संबंधी सेवा को दर्शाता है। ‘पवित्र’ प्रसंगगत भाव स्पष्ट करता है और ‘जिनसे’ उन पात्रों के साधन होने को व्यक्त करता है।
- source_word: הַמָּסָךְ
  choice: प्रवेश का परदा
  rationale: मिश्कान के प्रसंग में מָסָךְ प्रवेश पर लगे आड़ करने वाले परदे को दर्शाता है, न कि भीतरी विभाजक परदे को।
- source_word: וְכֹל עֲבֹדָתוֹ
  choice: और उसकी सारी सेवा
  rationale: एकवचन प्रत्यय को ‘उसकी’ से सुरक्षित रखा गया है और עֲבֹדָה का पवित्रस्थान-संबंधी अर्थ ‘सेवा’ से व्यक्त हुआ है। इससे प्रत्यय के संदर्भ को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: पवित्रस्थान की सेवा से जुड़ी शब्दावली
  choice: ‘पवित्र सेवा’ और ‘सेवा’
  alternative: ‘सेवा करना’ और ‘काम’
  rationale: यह पद प्रशासनिक है, फिर भी इसकी शब्दावली उपासना और पवित्रस्थान के निर्धारित कार्य से संबंधित है। चुने हुए शब्द उस धार्मिक संदर्भ को बनाए रखते हैं, बिना बाद की कलीसियाई पदावली थोपे।
- issue: עֲבֹדָתוֹ में एकवचन सर्वनाम का संदर्भ
  choice: ‘उसकी सारी सेवा’ कहकर संदर्भ को खुला रखना
  alternative: ‘इन सब से संबंधित सारी सेवा’ कहकर सामूहिक संदर्भ स्पष्ट करना
  rationale: हिब्रू में पुल्लिंग एकवचन प्रत्यय है और उसका सटीक पूर्वपद पूरी तरह स्पष्ट नहीं है। शाब्दिक एकवचन को बनाए रखने से मूल की अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और पवित्रस्थान-संबंधी प्रशासनिक शैली रखी गई है। ‘सन्दूक’, ‘दीपाधार’ और ‘वेदियाँ’ जैसे प्रचलित बाइबलीय शब्द प्रयुक्त हैं; वाक्य में मूल सूची की संरचना और अंतिम एकवचन सर्वनाम की अस्पष्टता सुरक्षित रखी गई है।
