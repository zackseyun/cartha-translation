  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: गणना और छावनी-व्यवस्था के प्रसंग में यह निकट परिवार से बड़ी वंशगत इकाइयों को दर्शाता है; आधुनिक हिन्दी में ‘कुल’ स्वाभाविक और सटीक है।
- source_word: בְּנֵי קְהָת
  choice: कहात के वंश
  rationale: शाब्दिक अर्थ ‘कहात के पुत्र’ है, पर यहाँ आशय उनके वंशजों से है। ‘कहात के वंश’ मूल की वंशावली-संबंधी अभिव्यक्ति को स्वाभाविक हिन्दी में रखता है।
- source_word: יַחֲנוּ
  choice: डेरा डालें
  rationale: यह अपूर्ण क्रिया छावनी की निर्धारित व्यवस्था बताती है; ‘डेरा डालें’ निर्देशात्मक भाव को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: עַל יֶרֶךְ
  choice: के ... भाग में
  rationale: यह संयुक्त स्थानवाचक अभिव्यक्ति किसी वस्तु के पार्श्व या ओर को बताती है; हिन्दी वाक्य में ‘के दक्षिणी भाग में’ स्वाभाविक है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: मूल शब्द का अर्थ ‘निवास’ है और इस प्रसंग में वह पवित्र तम्बू-धाम को सूचित करता है; ‘निवास-स्थान’ मूल शब्द-संबंध को बनाए रखता है।
- source_word: תֵּימָנָה
  choice: दक्षिणी
  rationale: दिशासूचक रूप दक्षिण की ओर या दक्षिणी स्थिति बताता है; ‘दक्षिणी भाग’ हिन्दी में संक्षिप्त और स्पष्ट है।
