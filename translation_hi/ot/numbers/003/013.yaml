id: NUM.3.13
reference: Numbers 3:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י לִ/י֮ כָּל בְּכוֹר֒ בְּ/יוֹם֩ הַכֹּתִ֨/י כָל בְּכ֜וֹר בְּ/אֶ֣רֶץ מִצְרַ֗יִם הִקְדַּ֨שְׁתִּי לִ֤/י כָל בְּכוֹר֙ בְּ/יִשְׂרָאֵ֔ל מֵ/אָדָ֖ם עַד בְּהֵמָ֑ה לִ֥/י יִהְי֖וּ אֲנִ֥י יְהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/013.yaml
  text: For every firstborn is mine[a]. On the day when I struck down every firstborn in the land of Egypt, I consecrated to myself every firstborn in Israel, from man to beast. They shall be mine[b]. I am Yahweh.
translation:
  language: hi
  text: क्योंकि हर पहलौठा मेरा है। जिस दिन मैंने मिस्र देश में हर पहलौठे को मार डाला, उसी दिन मैंने मनुष्य से लेकर पशु तक, इस्राएल के हर पहलौठे को अपने लिए पवित्र ठहराया। वे मेरे होंगे। मैं याहवे हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण बताता है; हिन्दी में ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִי
  choice: मेरा है / अपने लिए / मेरे होंगे
  rationale: तीन बार आए לִי में परमेश्वर के स्वामित्व पर बल है। हिन्दी वाक्य-विन्यास के अनुरूप भिन्न रूप रखते हुए इसकी पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: כָּל בְּכוֹר
  choice: हर पहिलौठा
  rationale: यह प्रथम जन्मे मनुष्य या पशु को व्यापक रूप से दर्शाता है; मूल में ‘नर’ स्पष्ट नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: בְּיוֹם הַכֹּתִי
  choice: जिस दिन मैंने ... मारा, उस दिन
  rationale: मूल का स्पष्ट काल-संबंध बनाए रखते हुए उस ऐतिहासिक अवसर को स्वाभाविक हिन्दी में व्यक्त करता है। मिस्र के पहिलौठों के प्रसंग में נכה का आशय घातक प्रहार है।
- source_word: בְּאֶרֶץ מִצְרַיִם
  choice: मिस्र देश में
  rationale: मूल में उपस्थित ‘देश’ को बनाए रखता है और कथन की गंभीरता के अनुरूप है।
- source_word: הִקְדַּשְׁתִּי
  choice: पवित्र ठहराया
  rationale: हिफ़ील रूप का अर्थ परमेश्वर के लिए पवित्र करके अलग करना है; यह हिन्दी में धार्मिक अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: मूल के संक्षिप्त स्थानगत/सामुदायिक संकेत को सीधे बनाए रखता है।
- source_word: מֵאָדָם עַד בְּהֵמָה
  choice: मनुष्य से लेकर पशु तक
  rationale: यह मनुष्यों और पशुओं की दोनों श्रेणियों को समेटने वाली रूढ़ अभिव्यक्ति है। आधुनिक हिन्दी में यह सटीक, व्यापक और गरिमापूर्ण है।
- source_word: יִהְיוּ
  choice: वे ... होंगे
  rationale: यह परमेश्वर के स्थायी दावे को भविष्यसूचक/घोषणात्मक रूप में व्यक्त करता है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: मूल में आए व्यक्तिगत वाचा-नाम को लिप्यंतरित करके रखा गया है और समापन की अधिकारपूर्ण घोषणा सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। हिन्दी के सामान्य बाइबलीय प्रयोग में परिचित ‘यहोवा’ नाम को रखते हुए इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: מֵאָדָם עַד בְּהֵמָה में אָדָם का अर्थ
  choice: मनुष्य
  alternative: मानवजाति / आदमी
  rationale: यहाँ אָדָם किसी एक पुरुष के लिए नहीं, पशुओं के विपरीत सामूहिक मानव श्रेणी के लिए है; ‘मनुष्य’ इस अर्थ को बिना अनावश्यक लैंगिक सीमांकन के सुरक्षित रखता है।
- issue: पहिलौठों के पवित्रीकरण और स्वामित्व का संबंध
  choice: अपने लिए पवित्र ठहराया ... वे मेरे होंगे
  alternative: अर्पित किया / मेरे हैं
  rationale: मूल में קדשׁ और बार-बार आए לִי दोनों हैं। अनुवाद पवित्र अलगाव और ईश्वरीय स्वामित्व, दोनों को रखता है तथा किसी विशेष बाद की धार्मिक व्यवस्था को इसमें नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘पहिलौठा’ बाइबलीय संदर्भ में परिचित और संक्षिप्त है। मूल की तीनfold स्वामित्व-ध्वनि तथा काल-संबंध को बनाए रखा गया है; किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
