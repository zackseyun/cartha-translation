base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/043.yaml
  text: And all the firstborn males[a], by the number of names, from a month old and upward, according to their count, were twenty-two thousand[b], three hundred seventy-three.
translation:
  language: hi
  text: और एक महीने या उससे अधिक आयु के सभी पहलौठे पुत्रों की संख्या, नामों की संख्या के अनुसार[a] और उनकी गणना के अनुसार, बाईस हज़ार तीन सौ तिहत्तर थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नामों की संख्या के अनुसार।” यह जनगणना की अभिव्यक्ति है, जिसका अर्थ है कि प्रत्येक को नाम से दर्ज करके गिना गया था।
    reason: cultural_note
  - marker: b
    text: इसे “उनके पंजीकरण के अनुसार” भी कहा जा सकता है। हिब्रू पद समूह की आधिकारिक गणना को दर्शाता है।
    reason: lexical_alternative
