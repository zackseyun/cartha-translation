  rationale: यह रूप शब्दशः छुड़ाए जाने वालों की ओर संकेत कर सकता है, पर अगले पदों में अधिक संख्या वाले पहलौठों के लिए दी जाने वाली निश्चित राशि का निर्देश है। इसलिए ‘छुड़ौती-मूल्य’ प्रसंगगत अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הַשְּׁלֹשָׁה וְהַשִּׁבְעִים וְהַמָּאתָיִם
  choice: '273'
