- source_word: הָעֹדְפִים עַל הַלְוִיִּם
  choice: जो लेवियों की संख्या से अधिक हैं
  rationale: सहभागी रूप उन पहलौठों को बताता है जो प्रतिस्थापन के लिए उपलब्ध लेवियों की कुल संख्या से अधिक बचते हैं। हिन्दी में संख्या का उल्लेख तुलना को स्पष्ट और स्वाभाविक बनाता है।
- source_word: מִבְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के पहलौठों में से
  rationale: ‘में से’ उपसमूह का भाव व्यक्त करता है, जबकि ‘इस्राएल के पुत्र’ בני ישראל की औपचारिक वाचा-संबंधी अभिव्यक्ति को बनाए रखता है।
