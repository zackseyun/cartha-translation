  text: और इस्राएलियों के पहलौठों में से, लेवियों से अधिक बचे हुए उन 273 का छुड़ौती-मूल्य,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन 273 छुड़ाए जाने वालों का”; इब्रानी रूप को अधिक शब्दशः इस प्रकार समझा जा सकता है, पर निकटवर्ती प्रसंग में अधिक संख्या वाले पहलौठों के लिए दिए जाने वाले मूल्य की बात है (पद 47–48), इसलिए यहाँ “छुड़ौती-मूल्य” अभिप्रेत अर्थ को बेहतर ढंग से व्यक्त करता है।
