base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/026.yaml
  text: and the hangings of the court[a], and the screen for the entrance of the court that is around the tabernacle and the altar, and its ropes[b], for all its service.
translation:
  language: hi
  text: और निवास और वेदी को चारों ओर से घेरे हुए उस आँगन के परदे[a], उसके प्रवेश-द्वार का पर्दा, और उसकी रस्सियाँ[b]—आँगन की सारी सेवा के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आँगन के लटकते परदे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी डोरियाँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: קַלְעֵי
  choice: परदे
  rationale: यह शब्द आँगन की घेराबंदी बनाने वाले कपड़े के लटकते परदों को दर्शाता है; आधुनिक हिन्दी में ‘परदे’ स्वाभाविक और स्पष्ट है।
- source_word: חָצֵר
  choice: आँगन
  rationale: यह निवास के चारों ओर के घिरे हुए खुले क्षेत्र को दर्शाता है; ‘आँगन’ सामान्य पाठक के लिए सहज है और पवित्रस्थान के संदर्भ में उपयुक्त है।
- source_word: מָסַךְ
  choice: पर्दा
  rationale: यह प्रवेश पर लगे वस्त्र के आवरण को दर्शाता है। हिन्दी में ‘पर्दा’ इस वस्तु को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: यह भीतर आने के खुले स्थान को दर्शाता है; ‘प्रवेश-द्वार’ किसी कठोर फाटक का अनावश्यक संकेत दिए बिना स्थान और कार्य दोनों स्पष्ट करता है।
- source_word: מִשְׁכָּן
  choice: निवास
  rationale: मूल शब्द का अर्थ ‘निवास-स्थान’ है और यहाँ इस्राएल के पवित्र तम्बू के लिए तकनीकी नाम के रूप में प्रयुक्त है; ‘निवास’ मूल रूपक को बनाए रखता है।
- source_word: מִזְבֵּחַ
  choice: वेदी
  rationale: बलि चढ़ाने के स्थान के लिए मानक और व्यापक रूप से समझा जाने वाला हिन्दी शब्द।
- source_word: מֵיתָרָיו
  choice: उसकी रस्सियाँ
  rationale: यह संरचना को बाँधने या तानकर रखने वाली रस्सियों/डोरियों को दर्शाता है। ‘रस्सियाँ’ ठोस और सहज आधुनिक हिन्दी है; सर्वनाम मूल के एकवचन संबंधसूचक रूप को बनाए रखता है।
- source_word: לְכֹל עֲבֹדָתוֹ
  choice: उससे संबंधित सारी सेवा के लिए
  rationale: यह इन वस्तुओं से जुड़ी समस्त नियुक्त सेवा या कार्य को समेटता है; ‘सेवा’ पवित्रस्थान के कर्तव्य का भाव बनाए रखती है।
theological_decisions:
- issue: אֲשֶׁר עַל הַמִּשְׁכָּן וְעַל הַמִּזְבֵּחַ סָבִיב का संबंध
  choice: जो निवास और वेदी के चारों ओर है
  alternative: जो निवास के पास और वेदी के चारों ओर है
  rationale: संदर्भ में आँगन निवास और वेदी दोनों को घेरे हुए है। अनुवाद स्थानिक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, पर मूल से अधिक कोई धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। पद पिछले वाक्य की सूची का अंश है, इसलिए आरंभिक ‘और’ सुरक्षित रखा गया है। ‘निवास’ को पवित्र तम्बू के पारंपरिक तकनीकी नाम के रूप में प्रयोग किया गया है।
