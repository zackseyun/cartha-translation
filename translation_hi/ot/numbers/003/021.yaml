base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/021.yaml
  text: To Gershon belonged the clan of the Libnites and the clan of the Shimeites; these are the clans of the Gershonites.
translation:
  language: hi
  text: गेर्शोन के वंश में लिब्नी का कुल और शिमी का कुल थे; ये गेर्शोनियों के कुल हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְגֵרְשׁוֹן
  choice: गेर्शोन के वंश में
  rationale: सम्बन्धसूचक לְ यहाँ गेर्शोन से जुड़े वंशगत कुलों का परिचय देता है। हिंदी में ‘गेर्शोन के वंश में’ इस सम्बन्ध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת / מִשְׁפְּחֹת
  choice: कुल / कुल
  rationale: गणना और वंशावली के प्रसंग में מִשְׁפָּחָה गोत्र से छोटी विस्तृत नातेदारी इकाई को दर्शाता है। आधुनिक हिंदी में ‘कुल’ इस अर्थ के लिए ‘परिवार’ से अधिक व्यापक और ‘गोत्र’ से कम तकनीकी है।
- source_word: הַלִּבְנִי
  choice: लिब्नी का
  rationale: सम्बन्धवाची रूप लिब्नी से उतरे समूह को सूचित करता है। ‘लिब्नी का कुल’ हिंदी में वंशगत अर्थ को सीधे और स्वाभाविक ढंग से रखता है।
- source_word: הַשִּׁמְעִי
  choice: शिमी का
  rationale: यह सम्बन्धवाची रूप शिमी से उतरे समूह को दर्शाता है; ‘शिमी का कुल’ समानांतर वाक्यरचना और वंशगत सम्बन्ध बनाए रखता है।
- source_word: אֵלֶּה הֵם
  choice: ये ... हैं
  rationale: यह पहचान कराने वाला सामान्य इब्रानी सूत्र है। हिंदी में वर्तमानकालीन ‘ये ... हैं’ सूची की कथन-शैली को सुरक्षित रखता है।
- source_word: הַגֵּרְשֻׁנִּי
  choice: गेर्शोनियों
  rationale: यह गेर्शोन से निकली बड़ी लेवीय शाखा का सम्बन्धवाची बहुवचन अर्थ देता है। ‘गेर्शोनी’ का बहुवचन रूप हिंदी में उस समुदाय को संक्षेप और स्पष्टता से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण वंशावली-शैली अपनाई गई है। ‘कुल’ को पूरे पद में एकरूप रखा गया है; व्यक्तिनामों के साथ ‘का कुल’ प्रयोग करने से कृत्रिम जातिवाची रूपों से बचते हुए मूल का वंशगत अर्थ स्पष्ट रहता है।
