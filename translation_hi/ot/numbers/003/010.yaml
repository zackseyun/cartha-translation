source:
  edition: WLC
  text: וְ/אֶת אַהֲרֹ֤ן וְ/אֶת בָּנָי/ו֙ תִּפְקֹ֔ד וְ/שָׁמְר֖וּ אֶת כְּהֻנָּתָ֑/ם וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/010.yaml
  text: And you shall appoint Aaron and his sons[a], and they shall keep their priesthood; but the outsider who comes near shall be put to death.
translation:
  language: hi
  text: तुम हारून और उसके पुत्रों को नियुक्त करो, और वे अपने याजक-पद की रखवाली करेंगे। परन्तु जो बाहरी व्यक्ति[a] निकट आए, वह मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात ‘अनधिकृत व्यक्ति’; यहाँ इब्रानी शब्द का अर्थ जाति से विदेशी व्यक्ति नहीं, बल्कि वह व्यक्ति है जिसे याजकीय क्षेत्र या सेवा के निकट आने का अधिकार नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּפְקֹד
  choice: नियुक्त करना
  rationale: यहाँ פקד का अर्थ गिनना नहीं, बल्कि हारून और उसके पुत्रों को याजकीय दायित्व के लिए नियुक्त करना है। हिंदी में यह आज्ञार्थक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְשָׁמְרוּ
  choice: रक्षा करें
  rationale: שׁמר में संभालने, चौकसी करने और निर्धारित सीमाओं को बनाए रखने का भाव है। ‘रक्षा करें’ याजकीय दायित्व और उसकी सीमाओं की निगरानी—दोनों को व्यक्त करता है।
- source_word: כְּהֻנָּתָם
  choice: अपने याजक-पद
  rationale: यह संज्ञा याजकीय पद और कार्य को सूचित करती है। ‘याजक-पद’ केवल अमूर्त प्रतिष्ठा के बजाय सौंपे गए पद और सेवा को स्पष्ट करता है।
- source_word: הַזָּר
  choice: बाहरी व्यक्ति
  rationale: यहाँ זָר जातीय अर्थ में विदेशी नहीं, बल्कि याजकीय क्षेत्र में अधिकार न रखने वाला व्यक्ति है। ‘बाहरी व्यक्ति’ मूल की संक्षिप्तता बनाए रखता है; अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַקָּרֵב
  choice: जो निकट आए
  rationale: קרב पवित्र क्षेत्र या आरक्षित याजकीय कार्य के निकट आने को दर्शाता है। यह अनुवाद मूल की स्थानिक भाषा और उसकी अंतर्निहित धार्मिक सीमा दोनों को बनाए रखता है।
- source_word: יוּמָת
  choice: मार डाला जाए
  rationale: מות का होफ़ाल रूप कर्मवाच्य और दंडात्मक है—व्यक्ति केवल मरेगा नहीं, उसे मृत्यु दी जाएगी। ‘मार डाला जाए’ इस कानूनी परिणाम को स्पष्ट रखता है।
theological_decisions:
- issue: याजकीय सेवा तक सीमित पहुँच का अर्थ
  choice: हारून और उसके पुत्र याजक-पद के लिए नियुक्त हैं और उसकी रक्षा के उत्तरदायी हैं; अधिकार न रखने वाला निकट आने पर मृत्युदंड का भागी होगा।
  alternative: इसे अधिक सामान्य रूप से हर गैर-याजक के पवित्र वस्तुओं या क्षेत्र के निकट आने पर रोक माना जा सकता है, यद्यपि इस पद में सटीक अनुष्ठानिक सीमा नहीं बताई गई।
  rationale: अनुवाद अधिकृत याजकीय दायित्व और अनधिकृत निकटता के घातक परिणाम को सुरक्षित रखता है, पर इस एक पद से आगे जाकर सीमाओं का विस्तार या किसी बाद की धार्मिक व्यवस्था का विवरण नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और आज्ञात्मक शैली रखी गई है। ‘तुम … नियुक्त करना’ मूसा को दिए गए निर्देश का सीधा भाव देता है। ‘याजक-पद’ और ‘बाहरी व्यक्ति’ सामान्य पाठक के लिए बोधगम्य हैं, जबकि पादटिप्पणी दूसरे पद की प्रसंगगत सीमा स्पष्ट करती है।
