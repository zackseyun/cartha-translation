id: NUM.3.45
reference: Numbers 3:45
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קַ֣ח אֶת הַ/לְוִיִּ֗ם תַּ֤חַת כָּל בְּכוֹר֙ בִּ/בְנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת בֶּהֱמַ֥ת הַ/לְוִיִּ֖ם תַּ֣חַת בְּהֶמְתָּ֑/ם וְ/הָיוּ לִ֥/י הַ/לְוִיִּ֖ם אֲנִ֥י יְהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/045.yaml
  text: Take the Levites in place of every firstborn among the sons of Israel[a], and the livestock of the Levites in place of their livestock; and the Levites shall be mine[c][b]. I am Yahweh.
translation:
  language: hi
  text: इस्राएल के पुत्रों में से हर पहलौठे के स्थान पर लेवियों को[a], और उनके पशुओं के स्थान पर लेवियों के पशुओं को ले लो[b]। लेवी मेरे होंगे। मैं याहवे हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों में से।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों में से” है।
    reason: lexical_alternative
  - marker: b
    text: या, “के बदले।” इब्रानी शब्द यहाँ प्रतिस्थापन का भाव व्यक्त करता है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” या “यहोवा” अनूदित।'
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: ले लो
  rationale: לקח के आदेशात्मक रूप को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; प्रसंग में मूसा को लेवियों को प्रतिस्थापन के लिए ग्रहण या नियुक्त करने की आज्ञा दी गई है।
- source_word: הַלְוִיִּם
  choice: लेवियों / लेवी
  rationale: वंश-समूह के प्रचलित हिन्दी नाम को विभक्ति के अनुसार रखा गया है।
- source_word: תַּחַת
  choice: के स्थान पर
  rationale: यहाँ शब्द स्थानगत अर्थ नहीं, बल्कि स्पष्ट प्रतिस्थापन व्यक्त करता है।
- source_word: כָּל בְּכוֹר
  choice: हर पहलौठे
  rationale: एकवचन संज्ञा के साथ כָּל के वितरणात्मक अर्थ को व्यक्त करता है और प्रसंगानुसार पहलौठे पुरुष को सूचित करता है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: בְּ के अंशसूचक अर्थ और मूल इब्रानी पदबंध ‘इस्राएल के पुत्र’ दोनों को सुरक्षित रखता है।
- source_word: בֶּהֱמַת הַלְוִיִּם
  choice: लेवियों के पशुओं
  rationale: בְּהֵמָה पालतू पशुओं के सामूहिक वर्ग को दर्शाता है; ‘पशु’ हिन्दी में सहज और पर्याप्त व्यापक है।
- source_word: בְּהֶמְתָּם
  choice: उनके पशुओं
  rationale: बहुवचन प्रत्यय को इस्राएल के पुत्रों से संबद्ध रखते हुए मूल समानांतर संरचना को बनाए रखता है।
- source_word: וְהָיוּ לִי
  choice: मेरे होंगे
  rationale: दिव्य अधिकार और संबंध को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: אֲנִי יְהוָה
  choice: मैं याहवे हूँ
  rationale: दिव्य नाम יהוה को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है और समापन की आत्म-पहचान को बनाए रखता है।
theological_decisions:
- issue: लेवियों और पहलौठों के बीच प्रतिस्थापन
  choice: के स्थान पर
  alternative: के बदले
  rationale: दोनों सम्भव हैं, पर ‘के स्थान पर’ प्रतिनिधिक प्रतिस्थापन को स्पष्ट करता है और किसी व्यावसायिक लेन-देन का आभास कम देता है।
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार-अक्षरीय दिव्य नाम है; ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण उच्चारण प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल आदेश की समानांतर रचना को यथासम्भव सुरक्षित रखते हुए हिन्दी में स्वाभाविक क्रम अपनाया गया है। ‘इस्राएल के पुत्र’ स्रोत की लिंग-विशिष्ट अभिव्यक्ति को बनाए रखता है, जबकि पादटिप्पणी अधिक सामान्य विकल्प देती है।
