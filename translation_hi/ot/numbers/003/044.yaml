  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। इस प्रचलित वचन-आरंभ सूत्र में हिन्दी का ‘फिर ... कहा’ स्वाभाविक है, यद्यपि क्रिया דבּר का अधिक रूप-समीपी अर्थ ‘बात की’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय निजी नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी की दिशा बताने वाले אֶל को हिन्दी के स्वाभाविक कथन-ढाँचे ‘मूसा से कहा’ में व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाली ईश्वरीय वाणी का परिचय देता है। हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता; ‘कहा,’ वही कथन-प्रवेश स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी ईश्वरीय नाम सीधे आया है। हिन्दी पाठकों में स्थापित ‘यहोवा’ को रखते हुए उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण-आधारित विकल्प है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। मूल के सूत्रात्मक वाक्य को हिन्दी में अनावश्यक दोहराव के बिना स्वाभाविक बनाया गया है।
