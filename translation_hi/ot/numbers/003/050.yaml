source:
  edition: WLC
  text: מֵ/אֵ֗ת בְּכ֛וֹר בְּנֵ֥י יִשְׂרָאֵ֖ל לָקַ֣ח אֶת הַ/כָּ֑סֶף חֲמִשָּׁ֨ה וְ/שִׁשִּׁ֜ים וּ/שְׁלֹ֥שׁ מֵא֛וֹת וָ/אֶ֖לֶף בְּ/שֶׁ֥קֶל הַ/קֹּֽדֶשׁ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/050.yaml
  text: From the firstborn of the sons of Israel he took the silver[a], one thousand three hundred sixty-five shekels[b], according to the sanctuary shekel.
translation:
  language: hi
  text: उसने इस्राएल के पुत्रों के पहलौठों से चाँदी[a] ली—पवित्रस्थान के शेकेल के अनुसार कुल 1,365 शेकेल[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धन।” यहाँ मूल शब्द का शाब्दिक अर्थ “चाँदी” है और वह चाँदी के रूप में दिए गए धन को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पवित्रस्थान में मान्य शेकेल के भार-मान के अनुसार।
    reason: clarification
lexical_decisions:
- source_word: מֵאֵת
  choice: से
  rationale: यह उस समूह को बताता है जिससे छुड़ौती की राशि ली गई; हिंदी में ‘से’ स्वाभाविक और पर्याप्त है।
- source_word: בְּכוֹר בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के पहलौठों
  rationale: एकवचन ‘पहलौठा’ यहाँ सामूहिक अर्थ में है। यह अनुवाद मूल की संबंध-वाचक रचना और प्रसंग में पुरुष पहलौठों के संकेत को बनाए रखता है।
- source_word: לָקַח
  choice: उसने ... ली
  rationale: क्रिया का सीधा अर्थ ‘लेना’ है; ‘चाँदी’ के लिंग के अनुसार हिंदी वाक्य में ‘ली’ रखा गया है।
- source_word: הַכָּסֶף
  choice: चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ है, यद्यपि इसका प्रयोग धन के अर्थ में भी हो सकता है; शेकेल में राशि बताए जाने के कारण भौतिक शब्द बनाए रखा गया है।
- source_word: חֲמִשָּׁה וְשִׁשִּׁים וּשְׁלֹשׁ מֵאוֹת וָאֶלֶף
  choice: कुल 1,365
  rationale: इब्रानी संख्या-घटकों को हिंदी की सामान्य संख्या-पद्धति में स्पष्ट रूप से व्यक्त किया गया है; ‘कुल’ राशि को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह वाक्यांश पवित्रस्थान में मान्य भार-मान को सूचित करता है; यह अनुवाद इसे किसी अलग प्रकार के सिक्के के रूप में समझने से बचाता है।
