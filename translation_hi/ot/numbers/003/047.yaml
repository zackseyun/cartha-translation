- source_word: בְּשֶׁקֶל הַקֹּדֶשׁ
  choice: पवित्रस्थान के शेकेल के अनुसार
  rationale: यह राशि मापने के लिए पवित्रस्थान में मान्य मानक शेकेल को सूचित करता है; ‘के अनुसार’ मानक का भाव सुरक्षित रखता है।
- source_word: תִּקָּח
  choice: उन्हें ... लेना
  rationale: दूसरी पुरुष एकवचन क्रिया को छोड़े बिना हिंदी में राशि लेने के निर्देश से जोड़ा गया है; इससे इब्रानी की पुनरुक्त आज्ञा बनी रहती है और वाक्य अस्वाभाविक नहीं होता।
- source_word: עֶשְׂרִים גֵּרָה הַשָּׁקֶל
  choice: एक शेकेल बीस गेरा का होता है
  rationale: ज्ञात मानक इकाई का भार-संबंध स्पष्ट करता है और इब्रानी माप ‘गेरा’ को तकनीकी पद के रूप में बनाए रखता है।
