base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/020.yaml
  text: 'The sons of Merari[a], by their clans: Mahli and Mushi. These are the clans of the Levites, by their fathers’ houses.'
translation:
  language: hi
  text: 'मरारी के पुत्र, उनके कुलों के अनुसार: महली और मूशी। ये लेवी[a] के कुल हैं, उनके पितृकुलों के अनुसार।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लेवियों के कुल।” इब्रानी में “लेवी” एकवचन जातिवाचक रूप है, जिसका प्रयोग सामूहिक अर्थ में भी हो सकता है या जो वंश-पूर्वज लेवी की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי
  choice: के पुत्र
  rationale: בְּנֵי का वंशावली-सूची में स्वाभाविक और औपचारिक हिन्दी समतुल्य ‘पुत्र’ है; आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं।
- source_word: מְרָרִי
  choice: मरारी
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: यह पद वंशगत उपविभागों के आधार पर वर्गीकरण बताता है; ‘कुलों के अनुसार’ अर्थ और सूची की संरचना दोनों सुरक्षित रखता है।
- source_word: מַחְלִי וּמוּשִׁי
  choice: महली और मूशी
  rationale: दोनों व्यक्तिनामों का हिन्दी लिप्यंतरण तथा संयोजक וּ का ‘और’ से प्रतिनिधित्व।
- source_word: אֵלֶּה הֵם
  choice: ये ... हैं
  rationale: संकेतवाचक और सर्वनाम मिलकर पहचानसूचक कथन बनाते हैं, जिसे वर्तमानकालीन हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: מִשְׁפְּחֹת הַלֵּוִי
  choice: लेवियों के कुल
  rationale: הַלֵּוִי व्याकरणतः एकवचन जातिवाचक है, पर यहाँ सामूहिक अर्थ में लेवी गोत्र के लोगों को सूचित करता है; बहुवचन ‘लेवियों’ हिन्दी में प्रसंगानुकूल और स्पष्ट है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: בֵּית אָבוֹת एक स्थापित वंशगत-सामाजिक इकाई है; ‘पितृकुल’ आधुनिक हिन्दी में संक्षिप्त रहते हुए पैतृक घराने का आशय देता है, और ל वर्गीकरण को ‘के अनुसार’ व्यक्त करता है।
