source:
  edition: WLC
  text: אֵ֗לֶּה שְׁמוֹת֙ בְּנֵ֣י אַהֲרֹ֔ן הַ/כֹּהֲנִ֖ים הַ/מְּשֻׁחִ֑ים אֲשֶׁר מִלֵּ֥א יָדָ֖/ם לְ/כַהֵֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/003.yaml
  text: These are the names of Aaron’s sons[a], the anointed priests, whose hands were filled to serve as priests.
translation:
  language: hi
  text: ये हारून के पुत्रों के नाम हैं—वे अभिषिक्त याजक, जिनके हाथ उसने याजकीय सेवा करने के लिए भरे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “उसने उनके हाथ भरे”; यह किसी को याजकीय सेवा के लिए विधिवत नियुक्त या प्रतिष्ठित करने का इब्रानी मुहावरा है।
    reason: मूल इब्रानी मुहावरे का अर्थ आधुनिक पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: ये हारून के पुत्रों के नाम हैं
  rationale: पहचान कराने वाले इब्रानी सूत्र को स्वाभाविक आधुनिक हिन्दी वाक्य-विन्यास में रखा गया है; בְּנֵי का पुरुषवाचक अर्थ ‘पुत्रों’ से सुरक्षित है।
- source_word: הַכֹּהֲנִים הַמְּשֻׁחִים
  choice: वे अभिषिक्त याजक
  rationale: दोनों निश्चित पद हारून के पुत्रों के समानाधिकरण में हैं। ‘अभिषिक्त’ משׁח से व्यक्त वास्तविक अनुष्ठानिक क्रिया को बनाए रखता है।
- source_word: אֲשֶׁר מִלֵּא יָדָם
  choice: जिनके हाथ उसने ... भरे थे
  rationale: तकनीकी इब्रानी मुहावरे की ठोस छवि और क्रिया के एकवचन पुल्लिंग सक्रिय रूप को सुरक्षित रखा गया है। मूल पद में कर्ता का नाम नहीं है, इसलिए हिन्दी में भी ‘उसने’ का संदर्भ अनिर्दिष्ट छोड़ा गया है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: לְכַהֵן
  choice: याजक का काम करने के लिए
  rationale: यह उद्देश्यसूचक infinitive है; चयन आधुनिक पाठक के लिए याजकीय सेवा/कार्य का भाव स्पष्ट करता है और केवल ‘याजक होने’ की अपेक्षा क्रियात्मक अर्थ को बेहतर व्यक्त करता है।
theological_decisions:
- issue: מִלֵּא יָדָם के याजकीय नियुक्ति-संबंधी मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘जिनके हाथ उसने ... भरे थे’ रखकर मूल मुहावरा सुरक्षित किया गया और पादटिप्पणी में उसका अर्थ बताया गया।
  alternative: ‘जिन्हें याजक का काम करने के लिए नियुक्त किया गया था’
  rationale: केवल भावार्थ देने से इब्रानी की महत्वपूर्ण अनुष्ठानिक अभिव्यक्ति छिप जाती। सक्रिय ‘उसने’ क्रियारूप का सम्मान करता है, जबकि कर्ता की पहचान मूल पद से आगे जाकर निर्धारित नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘याजक’ और ‘अभिषिक्त’ प्रचलित बाइबलीय शब्द हैं; असामान्य ‘हाथ भरने’ की अभिव्यक्ति स्रोत-पारदर्शिता के लिए मुख्य पाठ में रखकर पादटिप्पणी में समझाई गई है।
