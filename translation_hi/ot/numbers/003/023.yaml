lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: गिनती की वंशगत और गोत्रीय व्यवस्था में यह शब्द बड़े समूह के भीतर रिश्तेदारी पर आधारित उपसमूहों को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में इस सामूहिक वंशगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגֵּרְשֻׁנִּי
  choice: गेर्शोनियों के
  rationale: सवर्णक एकवचन यहाँ गेर्शोन से जुड़े वंशजों के समूह के लिए सामूहिक अर्थ में प्रयुक्त है; ‘गेर्शोनियों’ उस सामूहिक भाव को स्पष्ट करता है।
- source_word: אַחֲרֵי
  choice: पीछे
  rationale: यहाँ संबंध स्थानगत है, कालगत नहीं; छावनी की स्थिति बताने के लिए ‘पीछे’ सीधा और स्वाभाविक है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-स्थान
  rationale: यह शब्द इस प्रसंग में पवित्र तंबू, अर्थात परमेश्वर के निवास के लिए ठहराए गए पवित्र स्थान को सूचित करता है। ‘निवास-स्थान’ मूल शब्द के अर्थ को पारदर्शी ढंग से रखता है और संदर्भ में गरिमापूर्ण है।
- source_word: יַחֲנוּ
  choice: छावनी डालें
  rationale: अपूर्ण क्रिया यहाँ निर्धारित छावनी-व्यवस्था का निर्देश देती है; ‘छावनी डालें’ इस आदेशात्मक/निर्देशात्मक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: यह ‘समुद्र’ से बना दिशासूचक रूप है, जो बाइबिलीय इब्रानी में प्रायः पश्चिम की दिशा के लिए रूढ़ है; मुख्य पाठ में ‘पश्चिम की ओर’ अर्थ स्पष्ट रखता है।
