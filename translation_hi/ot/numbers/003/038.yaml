source:
  edition: WLC
  text: וְ/הַ/חֹנִ֣ים לִ/פְנֵ֣י הַ/מִּשְׁכָּ֡ן קֵ֣דְמָ/ה לִ/פְנֵי֩ אֹֽהֶל מוֹעֵ֨ד מִזְרָ֜חָ/ה מֹשֶׁ֣ה וְ/אַהֲרֹ֣ן וּ/בָנָ֗י/ו שֹֽׁמְרִים֙ מִשְׁמֶ֣רֶת הַ/מִּקְדָּ֔שׁ לְ/מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל וְ/הַ/זָּ֥ר הַ/קָּרֵ֖ב יוּמָֽת־׀׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/038.yaml
  text: Those who camped in front of the tabernacle on the east[a], in front of the tent of meeting toward the sunrise, were Moses and Aaron and his sons, keeping charge of the sanctuary on behalf of the sons of Israel[b]. But the outsider who comes near shall be put to death.
translation:
  language: hi
  text: जो लोग पवित्र निवास के सामने, पूर्व की ओर[a], मिलापवाले तम्बू के सामने सूर्योदय की दिशा में डेरा डाले हुए थे, वे मूसा, हारून और उसके पुत्र थे; वे इस्राएल के पुत्रों की ओर से पवित्रस्थान की देखरेख का दायित्व निभाते थे। परन्तु जो अनधिकृत व्यक्ति[b] निकट आए, वह मार डाला जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पूर्व दिशा में ... पूरब की ओर”; इब्रानी में बल देने के लिए दो सम्बद्ध दिशासूचक अभिव्यक्तियाँ प्रयुक्त हुई हैं।
    reason: lexical_alternative
  - marker: b
    text: “अनधिकृत व्यक्ति” से आशय ऐसे व्यक्ति से है जिसे पवित्रस्थान के निकट आने या उसकी सेवा में भाग लेने की अनुमति नहीं थी; इसका अर्थ विशेष रूप से किसी दूसरी जाति का व्यक्ति नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהַחֹנִים
  choice: जो लोग ... डेरा डालते थे
  rationale: संज्ञात्मक कृदन्त उन लोगों का वर्णन करता है जिन्हें वहाँ ठहराया गया था; हिन्दी में अपूर्ण भूतकाल इस व्यवस्था-वर्णन के अनुकूल है।
- source_word: לִפְנֵי הַמִּשְׁכָּן
  choice: निवास के सामने
  rationale: לִפְנֵי का सामान्य अर्थ ‘के सामने’ है। מִשְׁכָּן के लिए ‘निवास’ उसके मूल ‘बसने’ के भाव को रखता है और आगे आए ‘मिलापवाले तम्बू’ से भेद बनाए रखता है।
- source_word: קֵדְמָה ... מִזְרָחָה
  choice: पूर्व की ओर ... सूर्योदय की दिशा में
  rationale: दो सम्बद्ध दिशासूचक अभिव्यक्तियों को अलग-अलग ढंग से प्रस्तुत कर इब्रानी का पूर्व दिशा पर दिया गया बल सुरक्षित रखा गया है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह हिन्दी बाइबलीय प्रयोग में परिचित है और उस निर्धारित भेंट-स्थान को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֹשֶׁה וְאַהֲרֹן וּבָנָיו
  choice: मूसा, हारून और उसके पुत्र
  rationale: ‘उसके’ का एकवचन प्रत्यय निकटतम पूर्वपद हारून की ओर संकेत करता है; अनुवाद उसी व्याकरणिक तथ्य को बनाए रखता है।
- source_word: שֹׁמְרִים מִשְׁמֶרֶת הַמִּקְדָּשׁ
  choice: पवित्रस्थान की देखरेख का दायित्व निभाते थे
  rationale: समधातु संरचना सौंपे गए पहरे और उत्तरदायित्व के निर्वाह को व्यक्त करती है; हिन्दी वाक्यांश स्वाभाविक रहते हुए दोनों भाव रखता है।
- source_word: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की ओर से
  rationale: 'यह प्रतिनिधिक दायित्व का भाव देता है: वे उस पवित्र उत्तरदायित्व को समूचे इस्राएल की ओर से निभाते थे।'
- source_word: וְהַזָּר
  choice: जो अनधिकृत व्यक्ति
  rationale: सन्दर्भ में זָר जातीय विदेशी नहीं, बल्कि पवित्र सेवा के निकट आने का अधिकार न रखने वाला व्यक्ति है।
- source_word: הַקָּרֵב
  choice: निकट आए
  rationale: कृदन्त पवित्रस्थान या उसकी सेवा की अनुचित निकटता को सीधे व्यक्त करता है।
- source_word: יוּמָת
  choice: मार डाला जाए
  rationale: होफल रूप आरोपित मृत्युदण्ड का निष्क्रिय अर्थ देता है, केवल ‘मर जाए’ का नहीं।
theological_decisions:
- issue: ‘उसके पुत्र’ का सम्बन्ध
  choice: हारून के पुत्र
  alternative: मूसा और हारून से व्यापक रूप से जुड़े घरानों के पुत्र
  rationale: एकवचन प्रत्यय निकटतम नाम हारून की ओर स्वाभाविक रूप से संकेत करता है और अध्याय में पवित्र सेवा का दायित्व हारून तथा उसके पुत्रों से जुड़ा है।
- issue: पवित्रस्थान के विधान में זָר का अर्थ
  choice: पवित्र सेवा के लिए अनधिकृत व्यक्ति
  alternative: जातीय विदेशी या सामान्य सामाजिक अर्थ में पराया व्यक्ति
  rationale: तात्कालिक प्रसंग पवित्रस्थान तक पहुँच और याजकीय दायित्व का है; इसलिए भेद जातीयता का नहीं, अधिकार का है।
- issue: לְמִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל में प्रतिनिधिक सम्बन्ध
  choice: इस्राएल के पुत्रों की ओर से दायित्व निभाना
  alternative: इस्राएल के पुत्रों के दायित्व के लिए
  rationale: ‘की ओर से’ हिन्दी में प्रतिनिधिक उत्तरदायित्व को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, बिना यह दावा किए कि इस सेवा को हर इस्राएली स्वयं कर सकता था।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट शैली अपनाई गई है। ‘निवास’ और ‘मिलापवाला तम्बू’ अलग इब्रानी पदों का भेद रखते हैं। लम्बे इब्रानी वाक्य को पठनीयता के लिए दो वाक्यों में बाँटा गया है, जबकि अर्थ-सम्बन्ध सुरक्षित है।
