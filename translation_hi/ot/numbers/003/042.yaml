base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/042.yaml
  text: So Moses counted every firstborn among the sons of Israel[a], just as Yahweh had commanded him.
translation:
  language: hi
  text: तब मूसा ने इस्राएल के पुत्रों के बीच हर पहलौठे की गिनती की[a], ठीक वैसे ही जैसे याहवे ने उसे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “इस्राएल के पुत्र”; वैकल्पिक अनुवाद: “इस्राएली” या “इस्राएल की सन्तानें।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְקֹד
  choice: गिना
  rationale: जनगणना के इस संदर्भ में פקד का अर्थ व्यक्तियों की गिनती करना है; ‘गिना’ सहज और स्पष्ट हिन्दी है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह प्रयोग मूसा के कार्य और परमेश्वर की आज्ञा के बीच पूर्ण अनुरूपता व्यक्त करता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: हिन्दी का पूर्ण भूतकाल स्पष्ट करता है कि आज्ञा मूसा की गिनती से पहले दी गई थी।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: אֹתוֹ
  choice: उसे
  rationale: यह सर्वनाम आज्ञा पाने वाले मूसा की ओर संकेत करता है।
- source_word: אֶת כָּל בְּכֹר
  choice: हर पहलौठे को
  rationale: ‘हर’ समष्टि के वितरणात्मक भाव को बनाए रखता है; इस पद में ‘पुरुष’ स्पष्ट रूप से नहीं जोड़ा गया है।
- source_word: בִּבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: यह मूल इब्रानी की पुरुषवाची वंश-संबंधी अभिव्यक्ति को सुरक्षित रखता है और בְ को इस गणना-संदर्भ में ‘में से’ द्वारा स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में ईश्वर का व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में सुविदित ‘यहोवा’ पाठकों के लिए स्वाभाविक है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: लिंगसूचक अभिव्यक्ति בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: चुना गया रूप मूल की पुरुषवाची संबंध-संज्ञा को बनाए रखता है; अधिक सहज सामूहिक विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘पहलौठा’ बाइबलीय संदर्भ में परिचित शब्द है। वाक्य-क्रम हिन्दी की स्वाभाविकता के अनुसार रखा गया है, जबकि मूल पाठ की प्रमुख शब्दावली और लिंगसूचक अभिव्यक्ति सुरक्षित हैं।
