  text: And the duty of the sons of Gershon in the tent of meeting was the tabernacle[a], the tent, its covering, and the screen for the entrance of the tent of meeting[b],
translation:
  language: hi
  text: 'मिलापवाले तंबू में गेर्शोन के पुत्रों की ज़िम्मेदारी ये थी: निवास और तंबू, उसका आवरण, और मिलापवाले तंबू के प्रवेश-द्वार का परदा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁמֶרֶת
  choice: देखरेख की ज़िम्मेदारी
  rationale: लेवीय सेवा के इस प्रसंग में यह शब्द उन वस्तुओं की देखभाल और उत्तरदायित्व को व्यक्त करता है जो गेर्शोन के पुत्रों को सौंपी गई थीं। यह हिंदी में स्वाभाविक है और केवल पहरेदारी का सीमित अर्थ नहीं देता।
- source_word: בְּנֵי גֵרְשׁוֹן
  choice: गेर्शोन के पुत्रों
  rationale: इब्रानी की पारिवारिक अभिव्यक्ति को सीधे बनाए रखता है; आशय गेर्शोन के वंशजों से है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: इस स्थापित पद से उस तंबू का बोध होता है जहाँ परमेश्वर अपने लोगों से मिलता था; दोनों occurrences में एकरूपता रखी गई है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן का मूल भाव ‘निवास’ है। ‘पवित्र’ जोड़ने से उपासना-संबंधी विशेष भवन स्पष्ट होता है और अगली वस्तु ‘तंबू’ से उसका भेद बना रहता है।
- source_word: וְהָאֹהֶל
  choice: तंबू
  rationale: सूची में इसे पवित्र निवास से अलग घटक के रूप में रखा गया है; हिंदी सूची में समुच्चयबोधक ‘और’ अंतिम मद से पहले स्वाभाविक रूप से रखा गया है।
- source_word: מִכְסֵהוּ
  choice: उसका ओढ़ना
  rationale: यह तंबू अथवा निवास-समुच्चय पर डाली जाने वाली बाहरी आवरण-सामग्री को दर्शाता है। ‘ओढ़ना’ वस्तुगत आवरण का भाव संक्षेप में देता है।
- source_word: מָסַךְ
  choice: परदा
  rationale: प्रवेश-द्वार पर लटकाए जाने वाले आवरण के लिए आधुनिक हिंदी में ‘परदा’ स्पष्ट और स्वाभाविक है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार
  rationale: यहाँ शब्द तंबू के खुले प्रवेश-स्थान को सूचित करता है; ‘प्रवेश-द्वार का परदा’ उसके कार्यात्मक संबंध को सहज हिंदी में व्यक्त करता है।
