  yaml_path: translation/ot/numbers/003/024.yaml
  text: And the chief of the ancestral house of the Gershonites was Eliasaph son of Lael[a].
translation:
  language: hi
  text: और गेर्शोनियों के पितृकुल[a] का प्रधान लाएल का पुत्र एल्यासाफ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पिता का घर’; यह इस्राएलियों में किसी पितृवंशीय परिवार या कुल-इकाई के लिए प्रयुक्त पद था।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/נְשִׂיא
  choice: और ... प्रधान
  rationale: ו सूची की पिछली बात से संबंध जोड़ता है, इसलिए ‘और’ रखा गया है। נָשִׂיא यहाँ किसी राजकीय उपाधि के बजाय कुल के आधिकारिक मुखिया को सूचित करता है, इसलिए ‘प्रधान’ स्वाभाविक और सटीक है।
- source_word: בֵית אָב
  choice: पितृकुल
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘पिता का घर’ है, पर यह इस्राएली समाज की पितृवंशीय पारिवारिक या कुल-इकाई का पारिभाषिक पद है। ‘पितृकुल’ उसके अर्थ और सांस्कृतिक रूप दोनों को संक्षेप में व्यक्त करता है।
- source_word: לַ/גֵּרְשֻׁנִּי
  choice: गेर्शोनियों के
  rationale: ל यहाँ गेर्शोन से उतरे सामूहिक समूह के साथ संबंध दर्शाता है। आधुनिक हिन्दी में बहुवचन ‘गेर्शोनियों’ से इस समूह का बोध स्पष्ट होता है।
- source_word: אֶלְיָסָף
  choice: एल्यासाप
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण किया गया है।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशावली संबंध व्यक्त करने वाला सामान्य और गरिमापूर्ण हिन्दी शब्द।
- source_word: לָאֵל
  choice: लाएल
  rationale: व्यक्तिनाम का इब्रानी रूप के निकट देवनागरी लिप्यंतरण किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, संक्षिप्त और गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। इब्रानी सूची-विन्यास बनाए रखने के लिए वाक्य ‘और’ से आरम्भ होता है; सांस्कृतिक पद ‘पितृकुल’ को पाद-टिप्पणी में स्पष्ट किया गया है।
