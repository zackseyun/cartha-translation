  yaml_path: translation/ot/numbers/003/002.yaml
  text: 'These are the names of Aaron’s sons: the firstborn Nadab, and Abihu, Eleazar, and Ithamar.'
translation:
  language: hi
  text: 'हारून के पुत्रों के नाम ये हैं: ज्येष्ठ पुत्र नादाब, अबीहू, एलिआज़र और ईतामार।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: ये हैं
  rationale: संयोजक और संकेतवाचक पद सूची का परिचय देते हैं; आधुनिक हिन्दी में वाक्य को स्वाभाविक रूप से आरम्भ करने के लिए ‘ये हैं’ उपयुक्त है।
- source_word: שְׁמוֹת בְּנֵי אַהֲרֹן
  choice: हारून के पुत्रों के नाम
  rationale: इब्रानी संबंध-संरचना का स्पष्ट, स्वाभाविक और गरिमापूर्ण हिन्दी रूप।
- source_word: הַבְּכֹר
  choice: पहलौठा
  rationale: यह केवल आयु में सबसे बड़े होने के बजाय जन्मक्रम में प्रथम होने की स्थिति बताता है; इसलिए ‘पहलौठा’ अर्थ की विशिष्टता सुरक्षित रखता है।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַאֲבִיהוּא
  choice: फिर अबीहू
  rationale: वाव सूची को आगे बढ़ाता है; ‘फिर’ हिन्दी में पहले नाम के बाद अगले नाम का स्वाभाविक संकेत देता है।
- source_word: אֶלְעָזָר
  choice: एलिआज़र
  rationale: व्यक्तिनाम का स्रोत-ध्वनि के निकट हिन्दी लिप्यंतरण।
- source_word: וְאִיתָמָר
  choice: और ईतामार
  rationale: अंतिम सूची-संयोजक को ‘और’ से सुरक्षित रखते हुए व्यक्तिनाम का हिन्दी लिप्यंतरण किया गया है।
