base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/040.yaml
  text: Then Yahweh said to Moses[a], “Count every firstborn male among the sons of Israel from a month old and upward, and take the number of their names.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “इस्राएल के पुत्रों में से एक महीने या उससे अधिक आयु के हर पहलौठे बेटे को गिन, और उनके नामों की संख्या ले[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, उनका नामवार हिसाब ले।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम YHWH का प्रचलित और स्पष्ट रूप; इसे सामान्य उपाधि से नहीं बदला गया।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमसूचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְּקֹד
  choice: गिन
  rationale: इस जनगणना-संदर्भ में क्रिया का अर्थ गिनना या संख्या लेना है; ‘गिन’ सीधा और सहज आदेश है।
- source_word: כָּל בְּכֹר זָכָר
  choice: जितने पहलौठे पुरुष ... उन सभी
  rationale: ‘पहलौठे’ בכור और ‘पुरुष’ זכר की लिंग-विशिष्टता को बनाए रखता है; हिन्दी वाक्य-विन्यास में यह रूप स्वाभाविक है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में
  rationale: इब्रानी के औपचारिक ‘इस्राएल के पुत्र’ को सुरक्षित रखते हुए לְ का जनगणना-सापेक्ष अर्थ ‘में’ से व्यक्त किया गया है।
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: एक महीने या उससे अधिक आयु के
  rationale: यह आयु की न्यूनतम सीमा बताने वाला इब्रानी मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְשָׂא אֵת מִסְפַּר שְׁמֹתָם
  choice: उनके नामों के अनुसार उनकी गिनती कर
  rationale: शाब्दिक ‘उनके नामों की संख्या उठा’ हिन्दी में अस्पष्ट होगा; यह रूप नामवार गणना के मुहावरेदार आशय को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली। एकवचन आज्ञार्थक ‘गिन’ और ‘कर’ मूसा को संबोधित मूल व्याकरण को बनाए रखते हैं। नामवार गणना का अर्थ मुख्य पाठ में स्पष्ट होने के कारण पादटिप्पणी आवश्यक नहीं मानी गई।
