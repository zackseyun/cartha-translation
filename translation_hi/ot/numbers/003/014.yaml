  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה בְּ/מִדְבַּ֥ר סִינַ֖י לֵ/אמֹֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/014.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], saying,
translation:
  language: hi
  text: याहवे ने सीनै के निर्जन प्रदेश में मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहा
  rationale: यह क्रिया मानक कथात्मक वाणी-सूत्र आरम्भ करती है। हिन्दी में ‘मूसा से कहा’ स्वाभाविक और अर्थ-सटीक है; अगले पद में कथन की विषयवस्तु आती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक परसर्ग ‘से’ द्वारा व्यक्त किया गया है।
- source_word: בְּמִדְבַּר סִינַי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से दूर वन्य अथवा शुष्क चरागाही भूभाग को सूचित करता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में अर्थ को अनावश्यक रूप से रेगिस्तान तक सीमित नहीं करता।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी में यह आगामी प्रत्यक्ष वचन का परिचायक है। हिन्दी में ‘ने ... से कहा’ पूरा वाणी-सूत्र स्वाभाविक रूप से व्यक्त करता है; अलग से ‘यह कहते हुए’ रखना बोझिल होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के दोहरे वाणी-सूत्र וַיְדַבֵּר ... לֵאמֹר को हिन्दी की स्वाभाविक एकल अभिव्यक्ति ‘से कहा’ में प्रस्तुत किया गया है।
