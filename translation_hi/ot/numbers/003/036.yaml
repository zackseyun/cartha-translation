base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/036.yaml
  text: And the appointed duty of the sons of Merari was the frames of the tabernacle[a], its bars, its pillars, its bases, all its furnishings[c][b], and all its service.
translation:
  language: hi
  text: 'मरारी के पुत्रों की सौंपी हुई जिम्मेदारी यह थी: निवास-तम्बू के तख्ते[a], उसके बेड़े, उसके खम्भे, उसके आधार[b], उसके सभी उपकरण और उसकी सारी सेवा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निवास-तम्बू के खड़े पट्टे।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके खाँचे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקֻדַּת מִשְׁמֶרֶת
  choice: सौंपी गई देखरेख
  rationale: दोनों संज्ञाएँ मिलकर आधिकारिक रूप से सौंपी गई जिम्मेदारी या प्रभार का भाव देती हैं। हिंदी में यह पदबंध उस संयुक्त अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי מְרָרִי
  choice: मरारी के पुत्रों
  rationale: इब्रानी वंश-सूचक अभिव्यक्ति को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: קַרְשֵׁי הַמִּשְׁכָּן
  choice: पवित्र निवास की चौखटें
  rationale: קֶרֶשׁ यहाँ निवास की खड़ी संरचनात्मक इकाइयों को दर्शाता है। 'चौखटें' आधुनिक पाठक को उनकी संरचनात्मक भूमिका समझाता है, जबकि 'तख्ते' भी संभव है। מִשְׁכָּן के लिए अर्थ-स्पष्ट 'पवित्र निवास' चुना गया है।
- source_word: בְרִיחָיו
  choice: उसके बेंड़े
  rationale: ये चौखटों को जोड़ने या थामने वाली आड़ी पट्टियाँ थीं; 'बेंड़े' तंबू-संरचना के संदर्भ में उपयुक्त पारंपरिक स्थापत्य शब्द है।
- source_word: עַמֻּדָיו
  choice: उसके खम्भे
  rationale: यह खड़ी सहायक संरचनाओं के लिए सहज और सटीक हिंदी शब्द है।
- source_word: אֲדָנָיו
  choice: उसके आधार
  rationale: ये वे नींव-सदृश खाँचे या आधार थे जिनमें खम्भे अथवा चौखटें टिकती थीं। 'आधार' पठनीय है; 'खाँचे' अधिक तकनीकी विकल्प है।
- source_word: כָל כֵּלָיו
  choice: उसके सभी उपकरण
  rationale: כֵּלִים व्यापक रूप से सामान, साधन या उपकरण दर्शाता है। 'उपकरण' संरचना से संबंधित विविध वस्तुओं को समेटता है और 'साज-सामान' की अपेक्षा अधिक सटीक है।
- source_word: כֹל עֲבֹדָתוֹ
  choice: उससे जुड़ा सारा काम
  rationale: עֲבֹדָה यहाँ इन वस्तुओं से संबंधित श्रम या सेवा को समेटती है। हिंदी में 'उससे जुड़ा सारा काम' संबंध को स्पष्ट रखते हुए मूल की व्यापकता बचाता है।
