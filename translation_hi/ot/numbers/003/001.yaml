base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/001.yaml
  text: These are the generations of Aaron and Moses at the time when Yahweh spoke with Moses on Mount Sinai[a][b][c].
translation:
  language: hi
  text: 'हारून और मूसा की वंशावली यह है: जब याहवे ने सीनै पर्वत पर मूसा से बात की[a][b][c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हारून और मूसा के वंशज।” इब्रानी शीर्षकीय शब्द का अर्थ वंश-परंपरा, वंशज, या किसी व्यक्ति से आगे निकलने वाला विवरण भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “जिस दिन”; यह इब्रानी मुहावरा “जब” या “उस समय जब” के अर्थ में भी आता है।
    reason: lexical_alternative
  - marker: c
    text: या “मूसा से कहा।”
    reason: alternative_reading
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: यह है
  rationale: यह सूत्र एक नए खंड का परिचय देता है। हिंदी में वाक्य-विन्यास के अनुसार इसे संज्ञा-पद के बाद रखना स्वाभाविक है; आरंभिक וְ को अलग से ‘और’ कहना आवश्यक नहीं।
- source_word: תּוֹלְדֹת
  choice: वंशावली
  rationale: यह शब्द किसी व्यक्ति की वंश-परंपरा या उससे आगे निकलने वाले विवरण के लिए शीर्षक-सूत्र है। अगले पदों में हारून के पुत्रों की सूची होने के कारण ‘वंशावली’ सहज है, जबकि पादटिप्पणी व्यापक अर्थ बताती है।
- source_word: אַהֲרֹן וּמֹשֶׁה
  choice: हारून और मूसा
  rationale: मूल पाठ दोनों व्यक्तियों का नाम लेता है; आगे का विवरण मुख्यतः हारून के पुत्रों पर केंद्रित होने पर भी दोनों नाम बनाए गए हैं।
- source_word: בְּיוֹם
  choice: उस समय की जब
  rationale: शाब्दिक अर्थ ‘उस दिन’ है, पर यहाँ यह कालवाचक मुहावरा ‘उस समय जब’ के अर्थ में है। मुख्य पाठ में स्वाभाविक हिंदी और पादटिप्पणी में शाब्दिक रूप रखा गया है।
- source_word: דִּבֶּר ... אֶת מֹשֶׁה
  choice: मूसा से बात की
  rationale: דבר के साथ אֶת व्यक्ति को संबोधित पक्ष के रूप में प्रस्तुत कर सकता है। ‘से बात की’ स्वाभाविक हिंदी है; ‘मूसा से कहा’ भी संभव है और पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּהַר סִינָי
  choice: सीनै पर्वत पर
  rationale: यह मूल के स्थानवाचक पदबंध का स्वाभाविक और सटीक हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: हारून और मूसा दोनों के साथ תּוֹלְדֹת का संबंध
  choice: दोनों नामों को एक ही वंशावली-शीर्षक के अंतर्गत बनाए रखना
  alternative: केवल हारून की वंशावली
  rationale: आगे की सूची मुख्यतः हारून के पुत्रों की होने पर भी मूल शीर्षक स्पष्ट रूप से हारून और मूसा दोनों को नामित करता है; अनुवाद इस तनाव को नहीं मिटाता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘वंशावली’ शीर्षकीय सूत्र को संक्षेप में व्यक्त करती है; मूल की व्यापकता और संभावित विकल्प पादटिप्पणियों में सुरक्षित हैं।
