source:
  edition: WLC
  text: וַ/יִּתֵּ֨ן מֹשֶׁ֜ה אֶת כֶּ֧סֶף הַ/פְּדֻיִ֛ם לְ/אַהֲרֹ֥ן וּ/לְ/בָנָ֖י/ו עַל פִּ֣י יְהוָ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/051.yaml
  text: And Moses gave the redemption money to Aaron and to his sons[a], at the command of Yahweh, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: और मूसा ने छुटकारे की रकम हारून और उसके पुत्रों को दी, याहवे की आज्ञा के अनुसार, ठीक जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दी
  rationale: נתן का यह रूप क्रमिक भूतकालीन घटना बताता है; स्त्रीलिंग क्रिया ‘चाँदी’ के साथ स्वाभाविक हिन्दी वाक्य बनाती है।
- source_word: כֶּסֶף הַפְּדֻיִם
  choice: छुड़ाए गए लोगों के लिए चाँदी
  rationale: כֶּסֶף का मूल अर्थ ‘चाँदी’ और הַפְּדֻיִם का शाब्दिक अर्थ ‘छुड़ाए गए लोग’ है। यह अनुवाद मूल संरचना को सामने रखता है, जबकि संदर्भ से स्पष्ट है कि यह उनके छुटकारे के लिए लिया गया भुगतान था।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों को
  rationale: सर्वनाम हारून की ओर संकेत करता है; ‘पुत्रों’ से याजकीय परिवार के तत्काल पुत्र अभिप्रेत हैं।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा की आज्ञा के अनुसार
  rationale: शाब्दिक रूप ‘यहोवा के मुख के अनुसार’ है, पर यह इब्रानी मुहावरा अधिकारपूर्ण आदेश को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ चतुर्वर्णी ईश-नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: כַּאֲשֶׁר अनुपालन की ठीक समानता दर्शाता है और पूर्वकालिक निर्देश के लिए ‘दी थी’ स्वाभाविक है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। आधुनिक मानक हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला नामरूप है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: כֶּסֶף הַפְּדֻיִם में भुगतान और व्यक्तियों का संबंध
  choice: छुड़ाए गए लोगों के लिए चाँदी
  alternative: छुटकारे की रकम
  rationale: मूल वाक्यांश का शाब्दिक संबंध ‘छुड़ाए गए लोगों की चाँदी’ है, जबकि प्रसंग इसे छुटकारे के भुगतान के रूप में पहचानता है। मुख्य पाठ और पादटिप्पणी दोनों पहलुओं को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। लम्बे इब्रानी वाक्य को हिन्दी में दो वाक्यों में बाँटा गया है, ताकि दोहराए गए आदेश-सूत्र का अर्थ स्पष्ट रहे।
