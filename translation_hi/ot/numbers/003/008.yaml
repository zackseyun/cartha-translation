source:
  edition: WLC
  text: וְ/שָׁמְר֗וּ אֶֽת כָּל כְּלֵי֙ אֹ֣הֶל מוֹעֵ֔ד וְ/אֶת מִשְׁמֶ֖רֶת בְּנֵ֣י יִשְׂרָאֵ֑ל לַ/עֲבֹ֖ד אֶת עֲבֹדַ֥ת הַ/מִּשְׁכָּֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/003/008.yaml
  text: They shall keep charge of all the furnishings of the tent of meeting[a], and the duty of the sons of Israel, to perform the service of the tabernacle.
translation:
  language: hi
  text: वे मिलाप के तंबू की सारी वस्तुओं और इस्राएल के पुत्रों के दायित्व[a] की जिम्मेदारी लें, ताकि वे निवास-स्थान की सेवा करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के पुत्रों से संबंधित दायित्व।” इब्रानी पदबंध का संबंधकारक संबंध यह अर्थ भी दे सकता है कि यह वह जिम्मेदारी है जो इस्राएल के पुत्रों के लिए या उनसे संबंधित सौंपी गई है।
    reason: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל के संबंधकारक संबंध की वास्तविक अस्पष्टता को सुरक्षित रखना, बिना ‘की ओर से’ जैसे व्याख्यात्मक अर्थ को मुख्य पाठ में जोड़ने के।
lexical_decisions:
- source_word: וְשָׁמְרוּ
  choice: देखरेख करें
  rationale: याजकीय और पवित्रस्थान-संबंधी प्रसंग में שׁמר केवल पहरा देने के बजाय सौंपी गई वस्तुओं और कर्तव्य की जिम्मेदार देखभाल का भाव रखता है।
- source_word: כָּל כְּלֵי אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू की सारी वस्तुओं
  rationale: כְּלֵי में पात्र, उपकरण और अन्य साज-सामान सभी आ सकते हैं; ‘वस्तुओं’ से अर्थ अनावश्यक रूप से संकुचित नहीं होता।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पदनाम तंबू और नियत भेंट/मिलाप, दोनों भावों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की ओर से सौंपा गया दायित्व
  rationale: מִשְׁמֶרֶת सौंपी गई जिम्मेदारी या कर्तव्य को दर्शाता है। ‘की ओर से’ निकटवर्ती सन्दर्भ में लेवियों द्वारा समुदाय के प्रतिनिधि रूप में यह दायित्व निभाने का संभावित संबंध स्पष्ट करता है, जबकि पादटिप्पणी व्याकरणगत विकल्प सुरक्षित रखती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल का पुरुषवाचक सामूहिक पदनाम औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: לַעֲבֹד אֶת עֲבֹדַת הַמִּשְׁכָּן
  choice: ताकि निवास-स्थान की सेवा करें
  rationale: उद्देश्यसूचक ל और עבד/עֲבֹדָה की शब्द-पुनरावृत्ति को सहज हिन्दी में सेवा करने के रूप में व्यक्त किया गया है; מִשְׁכָּן का मूल अर्थ ‘निवास-स्थान’ है।
theological_decisions:
- issue: מִשְׁמֶרֶת בְּנֵי יִשְׂרָאֵל का संबंध
  choice: इस्राएल के पुत्रों की ओर से सौंपा गया दायित्व
  alternative: इस्राएल के पुत्रों से संबंधित दायित्व / इस्राएल के पुत्रों की रखवाली
  rationale: समास समुदाय की ओर से निभाए जाने वाले दायित्व, समुदाय से संबंधित दायित्व, या उनकी रखवाली के भाव की अनुमति देता है। मुख्य पाठ प्रसंगानुकूल प्रतिनिधिक कर्तव्य चुनता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक लिंग
  choice: इस्राएल के पुत्र
  alternative: इस्राएली / इस्राएल की संतान
  rationale: मूल की स्पष्ट पुरुषवाचक सामूहिक अभिव्यक्ति को बनाए रखा गया है, बिना किसी अतिरिक्त सिद्धान्तगत निष्कर्ष के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘मिलापवाला तंबू’ परिचित पवित्रस्थान-पदनाम है; ‘निवास-स्थान’ מִשְׁכָּן की अलग शब्दावली और मूल बिंब को सुरक्षित रखता है।
