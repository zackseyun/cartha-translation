  text: וַ/יּ֥וֹסֶף מַלְאַךְ יְהוָ֖ה עֲב֑וֹר וַֽ/יַּעֲמֹד֙ בְּ/מָק֣וֹם צָ֔ר אֲשֶׁ֛ר אֵֽין דֶּ֥רֶךְ לִ/נְט֖וֹת יָמִ֥ין וּ/שְׂמֹֽאול־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/026.yaml
  text: Then the angel of Yahweh went farther and stood in a narrow place[a], where there was no way to turn to the right or to the left.
translation:
  language: hi
  text: तब याहवे का दूत आगे बढ़ा[a] और एक सँकरी जगह पर खड़ा हो गया, जहाँ दाईं या बाईं ओर मुड़ने का कोई रास्ता नहीं था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आगे चलता रहा” या “आगे निकल गया।” हिब्रू मुहावरे का शाब्दिक भाव है कि वह आगे जाता रहा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף ... עֲבוֹר
  choice: तब ... आगे बढ़ा
  rationale: יסף के साथ עבר का क्रियार्थक रूप आगे चलते रहने या और आगे जाने का भाव देता है। प्रसंग में दूत के दूसरी जगह आगे जाकर खड़े होने को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का अर्थ दूत या संदेशवाहक हो सकता है; इस अलौकिक कथा में ‘दूत’ स्वाभाविक और पारंपरिक हिन्दी शब्द है। परमेश्वर के नाम יְהוָה को ‘यहोवा’ लिखा गया है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד का मूल अर्थ खड़ा होना या स्थान लेकर खड़ा होना है। ‘खड़ा हो गया’ कथात्मक क्रम और आशय दोनों को सहज हिन्दी में रखता है।
- source_word: בְּמָקוֹם צָר
  choice: एक ऐसी सँकरी जगह पर
  rationale: यह पदबंध किसी तंग या सँकरे स्थान को बताता है। ‘सँकरी जगह’ स्थानिक चित्र को स्पष्ट और स्वाभाविक ढंग से बनाए रखता है।
- source_word: אֲשֶׁר אֵין דֶּרֶךְ לִנְטוֹת
  choice: जहाँ ... मुड़ने का रास्ता था
  rationale: דֶּרֶךְ यहाँ सड़क के अभाव की बजाय किसी ओर हटने या मुड़ने की गुंजाइश को सूचित करता है; इसलिए ‘मुड़ने का रास्ता’ प्रसंगानुकूल है।
- source_word: יָמִין וּשְׂמֹאול
  choice: न दाईं ओर ... न बाईं ओर
  rationale: दोनों दिशाओं में हटने की असंभवता को आधुनिक हिन्दी की स्वाभाविक ‘न ... न ...’ संरचना में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय ईश्वरीय नाम सीधे आया है। हिन्दी के सामान्य बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सँकरी जगह’ मूल स्थानिक बिंब को सुरक्षित रखता है और ‘न दाईं ओर..., न बाईं ओर’ हिन्दी में निषेध को स्पष्ट करता है।
