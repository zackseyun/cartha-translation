  text: וַ/יִּזְבַּ֥ח בָּלָ֖ק בָּקָ֣ר וָ/צֹ֑אן וַ/יְשַׁלַּ֣ח לְ/בִלְעָ֔ם וְ/לַ/שָּׂרִ֖ים אֲשֶׁ֥ר אִתּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/040.yaml
  text: And Balak sacrificed cattle and sheep[b][a], and sent some to Balaam and to the officials who were with him.
translation:
  language: hi
  text: बालाक ने गाय-बैलों और भेड़-बकरियों[a] का बलिदान किया और उनमें से कुछ भाग[b] बिलाम और उसके साथ के अधिकारियों के पास भेजे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ ‘भेड़ें’ अथवा अधिक व्यापक रूप से ‘भेड़-बकरियों का झुंड’ या ‘छोटे पालतू पशु’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में केवल ‘भेजे’ है। बलिदान किए गए पशुओं के संदर्भ से यहाँ मांस या बलिदान के भाग भेजे जाने का भाव निकलता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזְבַּח
  choice: बलिदान किया
  rationale: זבח सामान्यतः बलि के लिए पशु वध करने को दर्शाता है; यह चयन केवल साधारण वध के बजाय धार्मिक अर्थ बनाए रखता है।
- source_word: בָּקָר
  choice: गाय-बैल
  rationale: בקר गोवंश के लिए सामूहिक शब्द है। ‘गाय-बैल’ आधुनिक हिन्दी में स्वाभाविक है और इसे केवल नर पशुओं तक सीमित नहीं करता।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צאן छोटे पालतू पशुओं के झुंड, विशेषकर भेड़ों और बकरियों, दोनों को समेट सकता है; इसलिए व्यापक अर्थ को मुख्य पाठ में स्पष्ट किया गया है।
- source_word: וַיְשַׁלַּח
  choice: उनमें से कुछ भाग भेजे
  rationale: क्रिया का शाब्दिक अर्थ केवल ‘भेजा’ है, पर बलिदान किए गए पशुओं के संदर्भ में भेजी गई वस्तु उनके अंश अथवा भोजन के भाग समझे जाते हैं। ‘कुछ भाग’ अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी मूल की संक्षिप्तता बताती है।
- source_word: לְבִלְעָם
  choice: बिलाम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לַשָּׂרִים
  choice: अधिकारियों
  rationale: שׂרים उच्च पदधारी व्यक्तियों को सूचित करता है। ‘अधिकारी’ आधुनिक पाठक के लिए स्पष्ट है और वंशानुगत राजकुमार होने का अनावश्यक संकेत नहीं देता।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ के
  rationale: एकवचन सर्वनाम का निकटतम और कथानकानुसार स्वाभाविक पूर्वपद बिलाम है; हिन्दी में यह वाक्यांश संक्षिप्त और सहज है।
