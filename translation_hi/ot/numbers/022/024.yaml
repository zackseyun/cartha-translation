source:
  edition: WLC
  text: וַֽ/יַּעֲמֹד֙ מַלְאַ֣ךְ יְהוָ֔ה בְּ/מִשְׁע֖וֹל הַ/כְּרָמִ֑ים גָּדֵ֥ר מִ/זֶּ֖ה וְ/גָדֵ֥ר מִ/זֶּֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/024.yaml
  text: Then the angel of Yahweh stood in a narrow path between the vineyards[a], with a wall on this side and a wall on that side.
translation:
  language: hi
  text: तब यहोवा का दूत दाख की बारियों के बीच के एक सँकरे रास्ते में खड़ा हुआ[a]; उसके इस ओर भी दीवार थी और उस ओर भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा का स्वर्गदूत।” इब्रानी शब्द का अर्थ “दूत” या “स्वर्गदूत” हो सकता है; यहाँ कथा का प्रसंग अलौकिक दूत की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: तब ... जा खड़ा हुआ
  rationale: यह वय्यिक्तोल रूप कथा को आगे बढ़ाता है। ‘तब’ क्रम को और ‘जा खड़ा हुआ’ किसी स्थान पर मोर्चा लेने जैसी स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता बनाए रखता है, जबकि प्रसंग से उसका अलौकिक स्वरूप स्पष्ट होता है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ के रूप में रखा गया है।
- source_word: בְּמִשְׁעוֹל הַכְּרָמִים
  choice: दाख की बारियों के बीच एक सँकरे रास्ते में
  rationale: מִשְׁעוֹל सँकरे रास्ते या पगडंडी को सूचित करता है और बहुवचन הַכְּרָמִים दाख की बारियों को। दोनों ओर की दीवारों से ‘बीच’ का स्थानिक भाव पुष्ट होता है।
- source_word: גָּדֵר מִזֶּה וְגָדֵר מִזֶּה
  choice: उसके इस ओर भी दीवार थी और उस ओर भी
  rationale: दोनों ओर अवरोध होने का समानांतर हिब्रू विन्यास सुरक्षित है। सामग्री निर्दिष्ट न होने के कारण ‘पत्थर की’ नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में बनाए रखता है।
- issue: מַלְאָךְ को ‘दूत’ या ‘स्वर्गदूत’ कहना
  choice: दूत
  alternative: स्वर्गदूत
  rationale: मूल शब्द की वास्तविक शाब्दिक अस्पष्टता बनाए रखने के लिए ‘दूत’ चुना गया है; कथा का प्रसंग बताता है कि यह अलौकिक दूत है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘दाख की बारियाँ’ सामान्य पाठक के लिए स्पष्ट कृषि-परिवेश देता है; ‘सँकरा रास्ता’ सीमित स्थान को उभारता है।
