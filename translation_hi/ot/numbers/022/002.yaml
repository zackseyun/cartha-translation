  text: וַ/יַּ֥רְא בָּלָ֖ק בֶּן צִפּ֑וֹר אֵ֛ת כָּל אֲשֶׁר עָשָׂ֥ה יִשְׂרָאֵ֖ל לָֽ/אֱמֹרִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/002.yaml
  text: Balak son of Zippor saw all that Israel had done to the Amorites[a].
translation:
  language: hi
  text: सिप्पोर के पुत्र बालाक ने वह सब देखा जो इस्राएल ने एमोरियों[a] के साथ किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में जाति का नाम एकवचन में, ‘एमोरी’, सामूहिक अर्थ में आया है; अर्थात ‘एमोरी लोग’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: ने ... देखा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; हिन्दी में साधारण भूतकाल और वाक्य-क्रम से यह प्रवाह स्वाभाविक रूप से व्यक्त होता है, इसलिए अलग से ‘तब’ नहीं जोड़ा गया।
- source_word: בָּלָק בֶּן צִפּוֹר
  choice: सिप्पोर के पुत्र बालाक
  rationale: वंश-सूचक रचना का स्वाभाविक और गरिमापूर्ण हिन्दी रूप; व्यक्तिनामों का मानक लिप्यंतरण किया गया है।
- source_word: אֵת כָּל אֲשֶׁר
  choice: वह सब ... जो
  rationale: यह रचना अगले उपवाक्य में बताई गई समस्त बात को प्रत्यक्ष कर्म बनाती है; ‘वह सब ... जो’ सहज हिन्दी है।
- source_word: עָשָׂה
  choice: किया था
  rationale: बालाक के देखने से पहले पूरा हो चुका कार्य कथा-संबंध में स्पष्ट करने के लिए पूर्वपूर्ण भूतकाल उपयुक्त है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ नाम सामूहिक रूप से इस्राएली लोगों के लिए प्रयुक्त है; मानक हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: לָאֱמֹרִי
  choice: एमोरियों के साथ
  rationale: לְ के व्यापक संबंध को हिन्दी में स्वाभाविक ढंग से व्यक्त करता है और ‘के विरुद्ध’ जैसी अधिक व्याख्यात्मक दिशा नहीं जोड़ता; एकवचन जातिवाचक संज्ञा को हिन्दी में सामूहिक बहुवचन बनाया गया है।
