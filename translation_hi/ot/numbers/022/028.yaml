source:
  edition: WLC
  text: וַ/יִּפְתַּ֥ח יְהוָ֖ה אֶת פִּ֣י הָ/אָת֑וֹן וַ/תֹּ֤אמֶר לְ/בִלְעָם֙ מֶה עָשִׂ֣יתִֽי לְ/ךָ֔ כִּ֣י הִכִּיתַ֔/נִי זֶ֖ה שָׁלֹ֥שׁ רְגָלִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/028.yaml
  text: Then Yahweh opened the mouth of the donkey[a], and she said to Balaam, “What have I done to you[b], that you have struck me these three times?”
translation:
  language: hi
  text: तब याहवे ने गधी का मुँह खोल दिया, और उसने बिलाम से कहा, “मैंने तुम्हारा क्या बिगाड़ा है कि तुमने मुझे तीन बार मारा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यह तीन पाँव”; यह एक मुहावरेदार अभिव्यक्ति है, जिसका अर्थ “तीन बार” या “तीन अवसरों पर” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְתַּח
  choice: खोल दिया
  rationale: काल रूप कथा को आगे बढ़ाता है; ‘खोल दिया’ प्रत्यक्ष दैवी कार्य और पूर्ण क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: פִּי הָאָתוֹן
  choice: गधी का मुँह
  rationale: אָתוֹן मादा गधे के लिए प्रयुक्त स्त्रीलिंग संज्ञा है; ‘गधी’ हिन्दी में उसका सहज और सटीक रूप है। सम्बन्धसूचक हिन्दी रचना मूल के construct phrase को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַתֹּאמֶר
  choice: और उसने ... कहा
  rationale: स्त्रीलिंग एकवचन क्रिया का संकेत ‘उसने’ द्वारा सुरक्षित है और उसका संदर्भ गधी है।
- source_word: לְבִלְעָם
  choice: बिलाम से
  rationale: नाम का प्रचलित हिन्दी बाइबलीय रूप ‘बिलाम’ है; बोलने की क्रिया के साथ לְ का स्वाभाविक हिन्दी रूप ‘से’ है।
- source_word: מֶה עָשִׂיתִי לְךָ
  choice: मैंने तुम्हारा क्या बिगाड़ा है
  rationale: शाब्दिक ‘मैंने तुम्हारे लिए/साथ क्या किया है?’ यहाँ शिकायत का मुहावरा है। ‘तुम्हारा क्या बिगाड़ा है’ आधुनिक हिन्दी में उसी आशय को स्वाभाविक रूप से देता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस व्यवहार को प्रश्न से जोड़ता है जिसने शिकायत को जन्म दिया; हिन्दी ‘कि’ इस सम्बन्ध को संक्षेप और स्वाभाविकता से रखता है।
- source_word: הִכִּיתַנִי
  choice: तुमने मुझे ... मारा
  rationale: נכה का सामान्य अर्थ मारना/प्रहार करना है; प्रसंग में ‘मारा’ साधारण और सटीक हिन्दी है।
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: इन तीन बार
  rationale: רְגָלִים का मूल अर्थ ‘पाँव’ है, पर यह पूरा पद यहाँ तीन अवसरों/बारों का मुहावरा है। ‘इन तीन बार’ संकेतवाचक זֶה को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहवे’ उसे उपाधि से प्रतिस्थापित किए बिना अपेक्षाकृत निकट लिप्यंतरण में रखता है।
- issue: गधी के बोलने में दैवी कर्तृत्व
  choice: यहवे ने गधी का मुँह खोल दिया
  alternative: गधी बोलने लगी
  rationale: मूल स्पष्ट रूप से यहवे को कर्ता बताता है। अनुवाद इस अलौकिक घटना को न तो सामान्य बनाता है, न उसकी प्रक्रिया में मूल से अधिक विवरण जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘गधी’ मूल की स्त्रीलिंग पशु-संज्ञा को स्पष्ट करती है। केवल उस इब्रानी मुहावरे पर पादटिप्पणी दी गई है जिसे शाब्दिक रूप में रखने से हिन्दी पाठक भ्रमित हो सकता है।
