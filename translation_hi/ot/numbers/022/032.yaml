  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ מַלְאַ֣ךְ יְהוָ֔ה עַל מָ֗ה הִכִּ֨יתָ֙ אֶת אֲתֹ֣נְ/ךָ֔ זֶ֖ה שָׁל֣וֹשׁ רְגָלִ֑ים הִנֵּ֤ה אָנֹכִי֙ יָצָ֣אתִי לְ/שָׂטָ֔ן כִּֽי יָרַ֥ט הַ/דֶּ֖רֶךְ לְ/נֶגְדִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/032.yaml
  text: And the angel of Yahweh said to him[a], “Why have you struck your donkey these three times? Look, I have come out as an adversary[b], because your way is perverse before me.”
translation:
  language: hi
  text: तब यहोवा के दूत ने उससे कहा, “तूने अपनी गधी को इन तीन अवसरों पर क्यों मारा? देख, मैं तेरा विरोध करने निकला हूँ,[a] क्योंकि तेरी चाल मेरे सामने टेढ़ी है।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द שָׂטָן का अर्थ यहाँ ‘विरोधी’ या ‘प्रतिपक्षी’ है; यह आवश्यक नहीं कि वह व्यक्तिनाम ‘शैतान’ हो।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया बहुत दुर्लभ है। इसका अर्थ ‘उतावली/बेलगाम है’, ‘टेढ़ी या विकृत है’, या ‘मेरे प्रतिकूल है’ भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। कथानक में अलौकिक सत्ता स्पष्ट है, फिर भी हिन्दी में ‘यहोवा का दूत’ स्वाभाविक और प्रचलित बाइबलीय अभिव्यक्ति है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֲתֹנְךָ
  choice: अपनी गधी
  rationale: अर्थात् ‘तेरी मादा गदही’; हिन्दी में ‘गधी’ लिंग-विशेष को संक्षेप और स्वाभाविक ढंग से बनाए रखता है।
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: इन तीन बार
  rationale: शाब्दिक ‘तीन पाँव/अवसर’ एक मुहावरा है, जिसका स्वाभाविक अर्थ ‘तीन बार’ है।
- source_word: הִנֵּה אָנֹכִי יָצָאתִי
  choice: देख, मैं ... निकला हूँ
  rationale: הִנֵּה का ध्यान आकर्षित करने वाला बल ‘देख’ से और יצא का बाहर आकर सामना करने का भाव ‘निकला हूँ’ से व्यक्त होता है।
- source_word: לְשָׂטָן
  choice: तेरा विरोध करने
  rationale: שָׂטָן यहाँ सामान्य संज्ञा के रूप में विरोधी होने या विरोध करने को दर्शाता है; इसे व्यक्तिनाम ‘शैतान’ बनाना संदर्भ से अधिक अर्थ जोड़ता।
- source_word: יָרַט הַדֶּרֶךְ לְנֶגְדִּי
  choice: मेरे सामने तेरा मार्ग विपरीत दिशा में जा रहा है
  rationale: יָרַט अत्यंत दुर्लभ और अनिश्चित क्रिया है। यह अनुवाद मार्ग के मेरे विरुद्ध/विपरीत होने का प्रसंगगत भाव रखता है, जबकि पादटिप्पणी में अन्य सम्भावित अर्थ दिए गए हैं।
theological_decisions:
- issue: לְשָׂטָן का अर्थ
  choice: विरोध करने
  alternative: ‘एक विरोधी बनकर’; या व्यक्तिनाम समझे जाने पर ‘शैतान के रूप में’
  rationale: यहाँ यहोवा का दूत बिलाम का मार्ग रोकता है, इसलिए शब्द सामान्य संज्ञा/भूमिका सूचित करता है, बाद का व्यक्तिनाम नहीं।
- issue: יָרַט द्वारा बिलाम के मार्ग का मूल्यांकन
  choice: विपरीत दिशा में जा रहा है
  alternative: ‘उतावला है’, ‘विकृत है’, या ‘मेरे विरुद्ध है’
  rationale: दुर्लभ क्रिया का अर्थ निश्चित नहीं है। मुख्य पाठ संदर्भ में विरोधी दिशा का भाव देता है और पादटिप्पणी वास्तविक शाब्दिक अनिश्चितता बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरपूर्ण किंतु सहज कथात्मक शैली। प्रत्यक्ष कथन में प्राचीन निकट-संबोधन के अनुरूप ‘तू’ रखा गया है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के बाद दिए गए हैं।
