  text: וַ/יֹּ֥אמֶר בִּלְעָ֖ם אֶל הָ/אֱלֹהִ֑ים בָּלָ֧ק בֶּן צִפֹּ֛ר מֶ֥לֶךְ מוֹאָ֖ב שָׁלַ֥ח אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/010.yaml
  text: And Balaam said to God[a], “Balak son of Zippor, king of Moab, has sent to me:”
translation:
  language: hi
  text: तब बिलाम ने परमेश्वर से कहा, “बालाक, सिप्पोर का पुत्र, मोआब के राजा ने मेरे पास भेजा है:[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे बुलाने के लिए भेजा है।” हिब्रू में शाब्दिक रूप से, “मेरे पास भेजा है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ स्वाभाविक रूप से इस प्रगति को व्यक्त करता है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶל הָאֱלֹהִים
  choice: परमेश्वर से
  rationale: संदर्भ में सवाचक एकवचन अर्थ है और पिछले पद में बिलाम से बात करने वाले उसी परमेश्वर का उल्लेख है; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: בָּלָק בֶּן צִפֹּר
  choice: सिप्पोर के पुत्र बालाक
  rationale: हिब्रू संबंध-संरचना को स्वाभाविक और स्पष्ट हिन्दी पदक्रम में व्यक्त किया गया है।
- source_word: מֶלֶךְ מוֹאָב
  choice: मोआब के राजा
  rationale: यह पद बालाक की पहचान और पदवी बताता है; इसे नाम के साथ समानाधिकरण में रखा गया है।
- source_word: שָׁלַח אֵלָי
  choice: मेरे पास यह संदेश भेजा है
  rationale: हिब्रू का शाब्दिक भाव ‘मेरे पास भेजा है’ है। हिन्दी में कर्म के बिना यह अधूरा और अस्वाभाविक लगता है; अगले पद में आने वाले संदेश तथा पदांत के संकेत को देखते हुए ‘यह संदेश’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है, जबकि वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: הָאֱלֹהִים का संदर्भ
  choice: बिलाम द्वारा संबोधित एकमात्र परमेश्वर
  alternative: सामान्य अर्थ में कोई देवता या देवगण
  rationale: निकटवर्ती कथा-संदर्भ में बिलाम पिछले पद में उससे मिलने आए परमेश्वर को उत्तर दे रहा है। ‘परमेश्वर’ इसी संदर्भगत पहचान को व्यक्त करता है और कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। हिब्रू पद के अंत में आगे आने वाले कथन की भूमिका है, इसलिए हिन्दी में द्विबिंदु रखा गया है। पादटिप्पणी-चिह्न संबंधित क्रिया-वाक्यांश के बाद लगाया गया है।
