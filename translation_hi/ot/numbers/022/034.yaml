reference: Numbers 22:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל מַלְאַ֤ךְ יְהוָה֙ חָטָ֔אתִי כִּ֚י לֹ֣א יָדַ֔עְתִּי כִּ֥י אַתָּ֛ה נִצָּ֥ב לִ/קְרָאתִ֖/י בַּ/דָּ֑רֶךְ וְ/עַתָּ֛ה אִם רַ֥ע בְּ/עֵינֶ֖י/ךָ אָשׁ֥וּבָה לִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/034.yaml
  text: Then Balaam said to the angel of Yahweh[a], “I have sinned, for I did not know that you were standing to confront me on the road. And now, if it is evil in your eyes[b], I will turn back.”
translation:
  language: hi
  text: तब बिलाम ने यहवे के दूत[a] से कहा, “मैंने पाप किया है, क्योंकि मैं नहीं जानता था कि आप मार्ग में मेरा सामना करने के लिए खड़े थे। अब यदि यह आपकी दृष्टि में बुरा है[b], तो मैं लौट जाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहवे के संदेशवाहक।”
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “यदि यह आपकी आँखों में बुरा है।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: यहवे के दूत
  rationale: מַלְאַךְ का अर्थ ‘संदेशवाहक’ या ‘स्वर्गदूत’ हो सकता है। इस प्रसंग में अलौकिक व्यक्ति होने के कारण ‘दूत’ स्वाभाविक है और मूल की कुछ व्यापकता भी बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: पूर्ण क्रिया बिलाम की दोष-स्वीकृति और उसके वर्तमान महत्व को व्यक्त करती है।
- source_word: כִּי לֹא יָדַעְתִּי
  choice: क्योंकि मैं नहीं जानता था
  rationale: כִּי यहाँ स्वीकारोक्ति के बाद कारण बताता है।
- source_word: נִצָּב לִקְרָאתִי
  choice: मेरा सामना करने के लिए खड़े हैं
  rationale: נִצָּב दृढ़ता से खड़े होने और לִקְרָאתִי सामने आने का भाव देता है; खिंची हुई तलवार के प्रसंग में विरोधात्मक अर्थ ‘सामना करने’ से स्वाभाविक रूप में प्रकट होता है।
- source_word: בַּדָּרֶךְ
  choice: मार्ग में
  rationale: यात्रा के स्थल को स्पष्ट करने वाला सीधा स्थानवाचक अनुवाद।
- source_word: אִם רַע בְּעֵינֶיךָ
  choice: यदि यह आपकी दृष्टि में बुरा है
  rationale: मूल इब्रानी मुहावरे और उसके नैतिक भार को बनाए रखा गया है; हिन्दी में भी यह बोधगम्य है।
- source_word: אָשׁוּבָה לִּי
  choice: मैं लौट जाऊँगा
  rationale: कोहोर्टेटिव रूप बिलाम की इच्छा अथवा तत्परता व्यक्त करता है; हिन्दी में यह कथन स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है। ‘यहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत; संदेशवाहक
  rationale: प्रसंग इस व्यक्ति को अलौकिक बताता है, पर मूल संज्ञा का मूल अर्थ ‘दूत/संदेशवाहक’ है। ‘दूत’ दोनों पहलुओं को समेटता है और अनावश्यक doctrinal विशिष्टता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज प्रत्यक्ष वचन। बिलाम द्वारा दूत को संबोधन में आदरसूचक ‘आप’ रखा गया है। ‘मार्ग’ कथात्मक-बाइबलीय गरिमा बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
