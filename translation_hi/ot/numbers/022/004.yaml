  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מוֹאָ֜ב אֶל זִקְנֵ֣י מִדְיָ֗ן עַתָּ֞ה יְלַחֲכ֤וּ הַ/קָּהָל֙ אֶת כָּל סְבִ֣יבֹתֵ֔י/נוּ כִּ/לְחֹ֣ךְ הַ/שּׁ֔וֹר אֵ֖ת יֶ֣רֶק הַ/שָּׂדֶ֑ה וּ/בָלָ֧ק בֶּן צִפּ֛וֹר מֶ֥לֶךְ לְ/מוֹאָ֖ב בָּ/עֵ֥ת הַ/הִֽוא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/004.yaml
  text: And Moab said to the elders of Midian[a], “Now this assembly will lick up all that is around us[b], as the ox licks up the green growth of the field.” Now Balak son of Zippor was king of Moab at that time.
translation:
  language: hi
  text: तब मोआब ने मिद्यान के बुज़ुर्गों से कहा, “अब यह समुदाय हमारे चारों ओर की हर चीज़ को ऐसे चाट जाएगा, जैसे बैल खेत की हरी वनस्पति को चाट जाता है।” उस समय सिप्पोर का पुत्र बालाक मोआब का राजा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹאָב
  choice: मोआब
  rationale: राष्ट्रीय नाम को बोलते हुए सामूहिक राजनीतिक समुदाय के रूप में रखा गया है; हिन्दी में स्थान/जनसमुदाय का नाम स्वाभाविक कर्ता है।
- source_word: זִקְנֵי מִדְיָן
  choice: मिद्यान के पुरनियों
  rationale: रचना का सीधा अर्थ ‘मिद्यान के प्राचीन/वरिष्ठ जन’ है; ‘पुरनिये’ बाइबलीय संदर्भ में समुदाय के मान्य अगुओं के लिए सुबोध और प्रतिष्ठित पद है।
- source_word: עַתָּה
  choice: अब
  rationale: यह वक्ता की तात्कालिक चिंता और आसन्न खतरे को व्यक्त करता है।
- source_word: יְלַחֲכוּ
  choice: चट कर जाएगा
  rationale: लाक्षणिक अर्थ ‘चाट लेना’ है। हिन्दी मुहावरा ‘चट कर जाना’ मूल चित्र और निगल जाने की धमकी, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַקָּהָל
  choice: यह समुदाय
  rationale: इकट्ठे इस्राएली जनसमूह का सामूहिक बोध देता है और ‘कलीसिया’ जैसे बाद के पारिभाषिक अर्थ से बचता है।
- source_word: אֶת כָּל סְבִיבֹתֵינוּ
  choice: हमारे चारों ओर की हर चीज़
  rationale: शाब्दिक ‘हमारे सब आसपास’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּלְחֹךְ הַשּׁוֹר
  choice: जैसे बैल ... चट कर जाता है
  rationale: तुलना और לחך धातु की पुनरावृत्ति को हिन्दी में समान क्रिया दोहराकर सुरक्षित रखा गया है।
- source_word: יֶרֶק הַשָּׂדֶה
  choice: मैदान की हरी वनस्पति
  rationale: יֶרֶק केवल घास नहीं, व्यापक हरी वनस्पति को सूचित कर सकता है; इसलिए अर्थ की व्यापकता बनाए रखी गई है।
- source_word: וּבָלָק בֶּן צִפּוֹר
  choice: सिप्पोर का पुत्र बालाक
  rationale: वंशसूचक संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: מֶלֶךְ לְמוֹאָב
  choice: मोआब का राजा था
  rationale: इब्रानी विधेय का सीधा और सहज हिन्दी रूप।
- source_word: בָּעֵת הַהִוא
  choice: उस समय
  rationale: कथा की पृष्ठभूमि बताने वाले कालवाचक पद का सीधा अनुवाद।
