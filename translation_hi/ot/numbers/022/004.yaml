    issue: “मैदान की हरी वनस्पति” for יֶרֶק הַשָּׂדֶה
    rationale: The Hebrew phrase is ‘the green vegetation of the field.’ In this context, “खेत” better represents the agricultural setting and the ox-grazing simile than “मैदान.”
  - severity: low
    issue: The repeated Hebrew ‘lick’ image is softened by “चट कर जाना.”
    rationale: Although idiomatic, “चट कर जाना” primarily means devour/consume. Repeating “चाट जाना” more transparently preserves the lexical repetition between the threat and the simile.
