  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। मूल उपमा तथा ‘चट करना’ की पुनरावृत्ति सुरक्षित है। इस पद में किसी आवश्यक पाठालोचनात्मक या धर्मवैज्ञानिक टिप्पणी की जरूरत नहीं है।
