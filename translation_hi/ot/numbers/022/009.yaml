  text: וַ/יָּבֹ֥א אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֕אמֶר מִ֛י הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה עִמָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/009.yaml
  text: Then God came to Balaam and said, “Who are these men with you?”
translation:
  language: hi
  text: तब परमेश्वर बिलाम के पास आया और उसने कहा, “तुम्हारे साथ ये पुरुष कौन हैं?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का काल रूप कथा को आगे बढ़ाते हुए यहाँ स्वाभाविक रूप से ‘आया’ अर्थ देता है; ‘प्रवेश किया’ अनावश्यक रूप से अधिक विशिष्ट होता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और कथा-संदर्भ में यह इस्राएल के परमेश्वर को सूचित करता है; आधुनिक हिन्दी बाइबलीय भाषा में ‘परमेश्वर’ स्पष्ट और प्रतिष्ठित पद है।
- source_word: אֶל בִּלְעָם
  choice: बिलाम के पास
  rationale: אֶל दिशा या किसी व्यक्ति के निकट आने को व्यक्त करता है; हिन्दी में ‘के पास आया’ ‘को आया’ की अपेक्षा अधिक स्वाभाविक है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: אמר प्रत्यक्ष कथन का सामान्य परिचायक है; हिन्दी में कर्ता स्पष्ट करने के लिए ‘उसने’ जोड़ा गया है।
- source_word: מִי
  choice: कौन
  rationale: यह व्यक्तियों की पहचान पूछने वाला सीधा प्रश्नवाचक शब्द है।
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: ये पुरुष
  rationale: संज्ञा पुल्लिंग बहुवचन है और संदर्भ में पुरुष दूतों को दर्शाती है; निकटवाचक הָאֵלֶּה को ‘ये’ से व्यक्त किया गया है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ
  rationale: עם और द्वितीय पुरुष प्रत्यय साथ या संगति का सामान्य अर्थ देते हैं।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस अनुक्रम को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: बिलाम की कथा में אֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: कोई देवता / दिव्य सत्ता
  rationale: यद्यपि אֱלֹהִים के अन्य अर्थ संभव हैं, यहाँ एकवचन क्रिया और कथा-संदर्भ एक विशिष्ट परमेश्वर की ओर संकेत करते हैं; ‘परमेश्वर’ अतिरिक्त सिद्धान्त आरोपित किए बिना इस संदर्भ को व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरुष’ ने मूल के लिंग-सूचक बहुवचन को सुरक्षित रखा है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
