source:
  edition: WLC
  text: הִנֵּ֤ה הָ/עָם֙ הַ/יֹּצֵ֣א מִ/מִּצְרַ֔יִם וַ/יְכַ֖ס אֶת עֵ֣ין הָ/אָ֑רֶץ עַתָּ֗ה לְכָ֤/ה קָֽבָ/ה לִּ/י֙ אֹת֔/וֹ אוּלַ֥י אוּכַ֛ל לְ/הִלָּ֥חֶם בּ֖/וֹ וְ/גֵרַשְׁתִּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/011.yaml
  text: Look[a], the people who came out of Egypt have covered the face of the land. Now come, curse them for me. Perhaps I will be able to fight against them and drive them out.
translation:
  language: hi
  text: देखो[a], मिस्र से निकले हुए लोगों ने देश की सतह को ढक लिया है। अब आओ, मेरे लिए उन्हें शाप दो। शायद मैं उनसे लड़ सकूँ और उन्हें निकाल दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः, “देश की आँख को ढक लिया है”; यह देश की दिखाई देने वाली सतह या उसके चेहरे को ढक लेने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह शब्द ध्यान खींचते हुए बात की तात्कालिकता प्रकट करता है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावपूर्ण है।
- source_word: הָעָם הַיֹּצֵא מִמִּצְרַיִם
  choice: जो लोग मिस्र से निकले हैं
  rationale: इब्रानी में सामूहिक एकवचन ‘प्रजा/लोग’ है और कृदंत निर्गमन द्वारा उनकी पहचान कराता है। हिन्दी में बहुवचन संबंधवाचक उपवाक्य स्पष्ट और स्वाभाविक है।
- source_word: וַיְכַס אֶת עֵין הָאָרֶץ
  choice: उन्होंने धरती का मुँह ढक लिया है
  rationale: क्रिया सामूहिक कर्ता के साथ एकवचन है और वर्तमान में परिणामी स्थिति बताती है। ‘धरती का मुँह’ मूल रूपक को समझने योग्य हिन्दी में बनाए रखता है।
- source_word: עַתָּה לְכָה
  choice: इसलिए अब आओ
  rationale: עַתָּה आग्रह की ओर तात्कालिक संक्रमण करता है और לְכָה कार्य के लिए बुलाने वाला आदेश है। ‘इसलिए’ प्रसंगगत निष्कर्ष को स्वाभाविक बनाता है।
- source_word: קָבָה לִי אֹתוֹ
  choice: मेरे लिए उन्हें शाप दो
  rationale: קָבָה स्पष्टतः शाप देने को कहता है; לִי हितार्थक है। एकवचन सर्वनाम सामूहिक लोगों को सूचित करता है, इसलिए हिन्दी में ‘उन्हें’ उपयुक्त है।
- source_word: אוּלַי אוּכַל
  choice: शायद मैं … सकूँ
  rationale: यह संभावना और आशा की अनिश्चितता को बनाए रखता है।
- source_word: לְהִלָּחֶם בּוֹ וְגֵרַשְׁתִּיו
  choice: उनसे लड़कर उन्हें निकाल सकूँ
  rationale: पहला पद उनके विरुद्ध युद्ध करने और दूसरा उन्हें उस क्षेत्र से खदेड़ने/निकालने को व्यक्त करता है; संयुक्त हिन्दी रचना दोनों क्रियाओं का संबंध सहज बनाती है।
