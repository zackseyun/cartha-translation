  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। सामूहिक इब्रानी एकवचन को स्वाभाविक हिन्दी बहुवचन में व्यक्त किया गया है। मूल का ‘धरती की आँख’ रूपक मुख्य पाठ में समझने योग्य ‘धरती का मुँह’ और पादटिप्पणी में शब्दशः रूप के साथ सुरक्षित है।
