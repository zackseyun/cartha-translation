source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם אֶל בָּלָ֗ק הִֽנֵּה בָ֨אתִי֙ אֵלֶ֔י/ךָ עַתָּ֕ה הֲ/יָכ֥וֹל אוּכַ֖ל דַּבֵּ֣ר מְא֑וּמָה הַ/דָּבָ֗ר אֲשֶׁ֨ר יָשִׂ֧ים אֱלֹהִ֛ים בְּ/פִ֖/י אֹת֥/וֹ אֲדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/038.yaml
  text: And Balaam said to Balak[a], “Look, I have come to you now. Am I really able to speak anything at all? I will speak only the word that God puts in my mouth.”
translation:
  language: hi
  text: तब बिलाम ने बालाक से कहा, “देखो, अब मैं तुम्हारे पास आ गया हूँ। क्या मैं सचमुच कुछ भी कह सकता हूँ?[a] जो वचन परमेश्वर मेरे मुँह में रखे, वही मैं कहूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या मैं वास्तव में कुछ भी कहने में समर्थ हूँ?” हिब्रू में सामर्थ्य पर बल देने वाली रचना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह बिलाम के उत्तर पर ध्यान खींचता है; आधुनिक आदरपूर्ण संवाद में ‘देखिए’ स्वाभाविक है और हिब्रू के संकेतात्मक बल को बनाए रखता है।
- source_word: בָאתִי אֵלֶיךָ עַתָּה
  choice: अब मैं आपके पास आ गया हूँ
  rationale: पूर्ण क्रिया और עַתָּה की तात्कालिकता दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: הֲיָכוֹל אוּכַל
  choice: क्या मैं सचमुच ... कह सकता हूँ?
  rationale: धातु के infinitive absolute और finite verb का संयोजन सामर्थ्य पर बल देता है; ‘सचमुच’ उस जोर को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: דַּבֵּר מְאוּמָה
  choice: कुछ भी कह
  rationale: מְאוּמָה का अर्थ ‘कुछ भी’ है; प्रश्न के भीतर यह बिलाम की स्वतंत्र वाणी की सीमा को व्यक्त करता है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: भविष्यवाणी-संबंधी प्रसंग में ‘वचन’ एकवचन और परमेश्वर से प्राप्त कथन, दोनों भावों को सुरक्षित रखता है।
- source_word: יָשִׂים אֱלֹהִים בְּפִי
  choice: परमेश्वर मेरे मुँह में रखेगा
  rationale: ईश्वर-प्रदत्त वाणी के मूल हिब्रू रूपक को हिन्दी में ज्यों का त्यों और स्वाभाविक रूप से रखता है।
- source_word: אֹתוֹ אֲדַבֵּר
  choice: वही मैं कहूँगा
  rationale: आगे रखे गए कर्म की विशिष्टता को ‘वही’ स्पष्ट करता है, बिना मूल से अधिक व्याख्या जोड़े।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया एकवचन है और प्रसंग में इस्राएल के परमेश्वर का उल्लेख है; इसलिए एकवचन आदरसूचक नाम उपयुक्त है।
theological_decisions:
- issue: बिलाम की वाणी पर परमेश्वर का नियंत्रण
  choice: बिलाम कहता है कि वह अपनी ओर से कुछ नहीं कह सकता; वह वही कहेगा जो परमेश्वर उसके मुँह में रखेगा।
  alternative: बिलाम कुछ भी कहने में समर्थ है, पर अपनी इच्छा से केवल परमेश्वर का दिया हुआ वचन कहने का निर्णय करता है।
  rationale: हिब्रू की बलाघाती प्रश्नवाचक रचना और ‘वही मैं कहूँगा’ केवल स्वैच्छिक पसंद की अपेक्षा बाधित भविष्यवाणी-वाणी की ओर संकेत करते हैं; फिर भी अनुवाद इसकी कार्यविधि को अनावश्यक रूप से परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। बालाक को सीधे संबोधन में ‘आप’ और ‘देखिए’ रखा गया है। ‘अपनी ओर से’ मूल के निहित प्रतिबंध को स्पष्ट करता है, जबकि पादटिप्पणी अधिक शब्दशः विकल्प देती है।
