source:
  edition: WLC
  text: וַ/תֵּ֣רֶא הָ/אָתוֹן֩ אֶת מַלְאַ֨ךְ יְהוָ֜ה נִצָּ֣ב בַּ/דֶּ֗רֶךְ וְ/חַרְבּ֤/וֹ שְׁלוּפָה֙ בְּ/יָד֔/וֹ וַ/תֵּ֤ט הָֽ/אָתוֹן֙ מִן הַ/דֶּ֔רֶךְ וַ/תֵּ֖לֶךְ בַּ/שָּׂדֶ֑ה וַ/יַּ֤ךְ בִּלְעָם֙ אֶת הָ֣/אָת֔וֹן לְ/הַטֹּתָ֖/הּ הַ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/023.yaml
  text: When the donkey saw the angel of Yahweh standing in the road with his sword drawn in his hand[a], the donkey turned aside from the road and went into the field. So Balaam struck the donkey to turn her back to the road.
translation:
  language: hi
  text: जब गधी ने यहोवा के दूत[a] को हाथ में खींची हुई तलवार लिए मार्ग में खड़ा देखा, तो वह मार्ग से मुड़कर खेत में चली गई। तब बिलाम ने गधी को मार्ग की ओर वापस मोड़ने के लिए मारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा का स्वर्गदूत।’
    reason: מַלְאַךְ के ‘दूत’ और ‘स्वर्गदूत’ दोनों अर्थ संभव हैं; प्रसंग अलौकिक दूत की ओर संकेत करता है।
lexical_decisions:
- source_word: הָאָתוֹן
  choice: गधी
  rationale: אָתוֹן विशेष रूप से मादा गधे को दर्शाता है; हिन्दी में ‘गधी’ इसका स्वाभाविक और सटीक रूप है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। ‘दूत’ मूल शब्द की व्यापकता बनाए रखता है, जबकि प्रसंग उसके अलौकिक स्वरूप को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि किसी उपाधि से।
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: मार्ग में खड़ा है
  rationale: यह पदबंध दूत की ऐसी स्थिति दर्शाता है जिसमें वह मार्ग में सामने खड़ा होकर रास्ता रोक रहा है।
- source_word: וְחַרְבּוֹ שְׁלוּפָה בְיָדוֹ
  choice: हाथ में नंगी तलवार लिए
  rationale: שְׁלוּפָה म्यान से निकाली हुई तलवार का बोध कराता है; ‘नंगी तलवार’ हिन्दी में इस दृश्य का स्वाभाविक वर्णन है।
- source_word: וַתֵּט ... מִן הַדֶּרֶךְ
  choice: मार्ग से मुड़कर
  rationale: נטה यहाँ निर्धारित मार्ग से हट जाने को व्यक्त करता है।
- source_word: וַתֵּלֶךְ בַּשָּׂדֶה
  choice: खेत में चली गई
  rationale: שָׂדֶה का ठोस और प्रसंगानुकूल अर्थ ‘खेत’ है।
- source_word: וַיַּךְ
  choice: मारा
  rationale: נכה प्रहार करने को दर्शाता है; एकवचन क्रिया अपने आप बार-बार पीटने का अर्थ नहीं देती, इसलिए सरल ‘मारा’ उचित है।
- source_word: לְהַטֹּתָהּ הַדָּרֶךְ
  choice: मार्ग पर वापस मोड़ने के लिए
  rationale: गधी पहले मार्ग छोड़ चुकी थी; causative infinitive उसे मार्ग की ओर फिर मोड़ने का आशय रखता है। ‘वापस’ प्रसंग से निहित दिशा को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुराक्षरी व्यक्तिगत नाम יהוה है। हिन्दी पाठकों के लिए प्रतिष्ठित रूप ‘यहोवा’ नाम की प्रकृति को बनाए रखता है।
- issue: מַלְאַךְ को दूत या स्वर्गदूत कहना
  choice: दूत
  alternative: स्वर्गदूत
  rationale: ‘दूत’ मूल शब्द की वास्तविक शाब्दिक व्यापकता सुरक्षित रखता है। इस प्रसंग में हाथ में नंगी तलवार लिए अलौकिक पात्र होने से उसका स्वर्गीय स्वरूप कथानक में स्वयं स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘गधी’ मूल की स्त्रीलिंग विशिष्टता को सीधे रखता है; ‘मार्ग’ कथात्मक गरिमा बनाए रखते हुए सामान्य पाठक के लिए सुबोध है।
