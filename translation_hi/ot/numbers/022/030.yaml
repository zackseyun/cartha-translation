base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/030.yaml
  text: Then the donkey said to Balaam[a], “Am I not your donkey, on which you have ridden all your life to this day? Have I ever been accustomed to do thus to you?” And he said, “No.”
translation:
  language: hi
  text: तब गधी ने बिलाम से कहा, “क्या मैं तुम्हारी गधी नहीं हूँ, जिस पर तुम अपने जीवन के आरम्भ से आज तक सवारी करते आए हो? क्या मुझे कभी तुम्हारे प्रति ऐसा करने की आदत रही है?” उसने कहा, “नहीं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן / אֲתֹנְךָ
  choice: गधी / तुम्हारी वही गधी
  rationale: אָתוֹן विशेष रूप से मादा गधे को दर्शाता है; हिन्दी में ‘गधी’ स्वाभाविक रूप से इस लैंगिक विशिष्टता को सुरक्षित रखता है। הֲלוֹא के सहमति-अपेक्षी बल को ‘क्या मैं ... वही ... नहीं हूँ’ व्यक्त करता है।
- source_word: אֲשֶׁר רָכַבְתָּ עָלַי
  choice: जिस पर तुम ... सवारी करते आए हो
  rationale: עַל का ‘पर’ अर्थ और लंबे समय से जारी सवारी का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: מֵעוֹדְךָ עַד הַיּוֹם הַזֶּה
  choice: जीवन भर आज के दिन तक
  rationale: यह आरम्भ/अस्तित्व से वर्तमान दिन तक की अवधि बताने वाला मुहावरा है; यह चयन मूल की विस्तृत समय-सीमा को स्पष्ट और सहज रूप में रखता है।
- source_word: הַהַסְכֵּן הִסְכַּנְתִּי
  choice: क्या मुझे कभी ... आदत रही है
  rationale: सजातीय क्रिया-रचना व्यवहार की प्रथा या आदत पर बल देती है; ‘कभी’ प्रश्न की अपेक्षित नकारात्मक प्रतिक्रिया को स्वाभाविक रूप से उभारता है।
- source_word: לַעֲשׂוֹת לְךָ כֹּה
  choice: तुम्हारे साथ ऐसा करने
  rationale: כֹּה वर्तमान असामान्य व्यवहार की ओर संकेत करता है; ‘ऐसा करने’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: וַיֹּאמֶר לֹא
  choice: उसने कहा, “नहीं।”
  rationale: सरल कथात्मक क्रम और बिलाम के संक्षिप्त नकारात्मक उत्तर को ज्यों का त्यों रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है। मूल में मादा गधे की स्पष्टता होने के कारण मुख्य पाठ में ‘गधी’ रखा गया है, अतः अलग पाद-टिप्पणी आवश्यक नहीं।
