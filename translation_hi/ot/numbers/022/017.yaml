source:
  edition: WLC
  text: כִּֽי כַבֵּ֤ד אֲכַבֶּדְ/ךָ֙ מְאֹ֔ד וְ/כֹ֛ל אֲשֶׁר תֹּאמַ֥ר אֵלַ֖/י אֶֽעֱשֶׂ֑ה וּ/לְכָ/ה נָּא֙ קָֽבָ/ה לִּ֔/י אֵ֖ת הָ/עָ֥ם הַ/זֶּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/017.yaml
  text: For I will greatly honor you[a], and I will do whatever you say to me. So please come, curse this people for me.
translation:
  language: hi
  text: क्योंकि मैं तुम्हारा बहुत आदर करूँगा[a], और जो कुछ तुम मुझसे कहोगे, वह मैं करूँगा। इसलिए कृपा करके आओ और मेरे लिए इन लोगों को शाप दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं निश्चय ही तुम्हारा बहुत आदर करूँगा”; प्रसंग के अनुसार इसका भाव “मैं तुम्हें भरपूर पुरस्कार दूँगा” भी हो सकता है। इब्रानी में एक ही धातु के विशेष क्रियारूप और सामान्य क्रियारूप को साथ रखकर कथन पर बल दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बालाक के फिर से किए गए अनुरोध के आधार के रूप में उसके वादे को प्रस्तुत करता है।
- source_word: כַבֵּד אֲכַבֶּדְךָ מְאֹד
  choice: मैं तुम्हारा बहुत आदर करूँगा
  rationale: मूल धातु כבד आदर की भाषा है, और infinitive absolute के साथ finite verb तथा מְאֹד मिलकर वादे पर प्रबल बल देते हैं। 'बहुत आदर करूँगा' इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְכֹל אֲשֶׁר תֹּאמַר אֵלַי אֶעֱשֶׂה
  choice: और जो कुछ तुम मुझसे कहोगे, वह मैं करूँगा
  rationale: כֹל אֲשֶׁר की व्यापकता और אֵלַי के 'मुझसे' अर्थ को स्पष्ट, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּלְכָה נָּא
  choice: इसलिए कृपा करके आओ
  rationale: לְכָה गति का आदेश है और נָא विनम्र आग्रह जोड़ता है; 'इसलिए' पिछले वादे से अनुरोध का संबंध स्वाभाविक रूप से दिखाता है।
- source_word: קָבָה
  choice: शाप दो
  rationale: इस प्रसंग में क्रिया किसी पर शाप बुलाने या उच्चारित करने को सूचित करती है।
- source_word: לִּי
  choice: मेरे लिए
  rationale: बालाक के निजी हित और उसकी ओर से कार्य किए जाने की भावना को सीधे व्यक्त करता है।
- source_word: אֵת הָעָם הַזֶּה
  choice: इन लोगों को
  rationale: हिन्दी में सामूहिक עָם के लिए 'इन लोगों' सहज और स्पष्ट है, यद्यपि इब्रानी में संज्ञा व्याकरणतः एकवचन है।
