id: NUM.22.8
reference: Numbers 22:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם לִ֤ינוּ פֹה֙ הַ/לַּ֔יְלָה וַ/הֲשִׁבֹתִ֤י אֶתְ/כֶם֙ דָּבָ֔ר כַּ/אֲשֶׁ֛ר יְדַבֵּ֥ר יְהוָ֖ה אֵלָ֑/י וַ/יֵּשְׁב֥וּ שָׂרֵֽי מוֹאָ֖ב עִם בִּלְעָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/008.yaml
  text: And he said to them[a], “Lodge here tonight[c][b], and I will bring back word to you according to what Yahweh speaks to me.” So the princes of Moab stayed with Balaam.
translation:
  language: hi
  text: उसने उनसे कहा, “आज रात यहीं ठहरो। याहवे[a] मुझसे जो कहेगा, उसके अनुसार मैं तुम्हें उत्तर दूँगा[b]।” तब मोआब के प्रधान[c] बिलाम के साथ ठहर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम चार अक्षरों YHWH से लिखा है; इसका उच्चारण प्रायः “याहवे” माना जाता है। पारंपरिक रूप “यहोवा” भी मिलता है।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक भाव: “मैं तुम्हारे पास बात/संदेश लौटाऊँगा”; अर्थात, “मैं तुम्हें संदेश दूँगा” या “उत्तर पहुँचाऊँगा।”'
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “मोआब के अधिकारी,” “अगुए” या “राजकुमार” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִינוּ פֹה הַלַּיְלָה
  choice: आज रात यहीं ठहरो
  rationale: बहुवचन आज्ञार्थक לִינוּ रात भर रुकने का निमंत्रण देता है। यह हिन्दी में स्वाभाविक है और स्थान तथा समय दोनों को स्पष्ट रखता है।
- source_word: וַהֲשִׁבֹתִי אֶתְכֶם דָּבָר
  choice: मैं तुम्हें उत्तर दूँगा
  rationale: शाब्दिक बिंब ‘बात/संदेश लौटाना’ है, पर इस प्रसंग में इसका अर्थ उत्तर पहुँचाना है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और मूल बिंब को पादटिप्पणी में बताया गया है।
- source_word: כַּאֲשֶׁר יְדַבֵּר יְהוָה אֵלָי
  choice: याहवे मुझसे जो कहेगा, उसके अनुसार
  rationale: כַּאֲשֶׁר के अनुरूपता-सूचक अर्थ को ‘के अनुसार’ से और प्रसंगगत भविष्य को ‘कहेगा’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וַיֵּשְׁבוּ
  choice: ठहर गए
  rationale: ישב का मूल अर्थ बैठना या निवास करना हो सकता है, लेकिन रात रुकने के निमंत्रण के बाद इस प्रसंग में ‘ठहर गए’ उपयुक्त है।
- source_word: שָׂרֵי מוֹאָב
  choice: मोआब के प्रधान
  rationale: שָׂרִים उच्च पद वाले अगुओं, अधिकारियों या राजकुमारों के लिए प्रयुक्त हो सकता है। ‘प्रधान’ पद और नेतृत्व व्यक्त करता है, पर अनावश्यक रूप से वंशानुगत राजकुमार होने का निष्कर्ष नहीं निकालता।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; अथवा ‘यहोवा परमेश्वर/प्रभु’ जैसी पारंपरिक प्रतिस्थापना
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदले बिना प्रस्तुत करता है; उच्चारण की ऐतिहासिक अनिश्चितता पादटिप्पणी में स्वीकार की गई है।
- issue: बिलाम के उत्तर का स्वरूप
  choice: याहवे जो कहेगा, उसी के अनुसार उत्तर
  alternative: बिलाम स्वयं उत्तर गढ़ेगा
  rationale: वाक्य बिलाम के भावी उत्तर को याहवे के कथन के अधीन रखता है। अनुवाद इस संबंध को बनाए रखता है, पर बिलाम के व्यापक चरित्र या प्रेरणा पर कोई अतिरिक्त धर्मवैज्ञानिक निर्णय नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। संवाद स्वाभाविक रखने के लिए एक लंबे वाक्य को दो वाक्यों में बाँटा गया है। ‘प्रधान’ सामाजिक पद की व्यापकता बनाए रखता है, और पादटिप्पणियाँ वास्तविक शाब्दिक विकल्प तथा ईश्वरीय नाम के उच्चारण की अनिश्चितता स्पष्ट करती हैं।
