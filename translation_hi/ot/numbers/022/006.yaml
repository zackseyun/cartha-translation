source:
  edition: WLC
  text: וְ/עַתָּה֩ לְכָ/ה נָּ֨א אָֽרָ/ה לִּ֜/י אֶת הָ/עָ֣ם הַ/זֶּ֗ה כִּֽי עָצ֥וּם הוּא֙ מִמֶּ֔/נִּי אוּלַ֤י אוּכַל֙ נַכֶּה בּ֔/וֹ וַ/אֲגָרְשֶׁ֖/נּוּ מִן הָ/אָ֑רֶץ כִּ֣י יָדַ֗עְתִּי אֵ֤ת אֲשֶׁר תְּבָרֵךְ֙ מְבֹרָ֔ךְ וַ/אֲשֶׁ֥ר תָּאֹ֖ר יוּאָֽר־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/006.yaml
  text: So now[a], please come and curse this people for me, because they are too mighty for me. Perhaps I will be able to strike them and drive them out of the land, for I know that whoever you bless is blessed[b], and whoever you curse is cursed.
translation:
  language: hi
  text: इसलिए अब, कृपया आओ और इन लोगों[a] को मेरे लिए शाप दो, क्योंकि वे मुझसे अधिक शक्तिशाली हैं। शायद मैं इतना समर्थ हो जाऊँ कि हम उन पर प्रहार कर सकें[b] और मैं उन्हें भूमि से निकाल दूँ। क्योंकि मैं जानता हूँ कि जिसे तुम आशीर्वाद देते हो, वह धन्य होता है, और जिसे तुम शाप देते हो, वह शापित होता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘ये लोग’ के लिए सामूहिक एकवचन रूप है; हिन्दी में स्वाभाविक रूप से बहुवचन ‘इन लोगों’ किया गया है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में ‘शायद मैं समर्थ हो जाऊँ’ और ‘मैं उसे भूमि से निकाल दूँ’ प्रथम पुरुष एकवचन हैं, पर ‘हम प्रहार कर सकें’ प्रथम पुरुष बहुवचन है। ‘उन पर’ हिन्दी में ‘लोगों’ के लिए बहुवचन है, जबकि हिब्रू कर्म सामूहिक एकवचन है।
    reason: textual_ambiguity
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: संयोजक वाव और तात्कालिक संक्रमण दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְכָה נָּא
  choice: कृपया आओ
  rationale: एकवचन आज्ञा और विनयसूचक נָא को आधुनिक, सम्मानजनक और सहज हिन्दी में रखता है।
- source_word: אָרָה לִּי
  choice: मेरे लिए ... शाप दो
  rationale: אָרָה का सीधा अर्थ हानि बुलाने वाला शाप देना है; לִּי बालाक के हित में किए जाने वाले कार्य को दर्शाता है।
- source_word: הָעָם הַזֶּה
  choice: इन लोगों
  rationale: हिब्रू में सामूहिक एकवचन है, पर आधुनिक हिन्दी में लोगों के समूह के लिए यह अधिक स्वाभाविक है; सामूहिक एकवचन की सूचना पादटिप्पणी में दी गई है।
- source_word: כִּי עָצוּם הוּא מִמֶּנִּי
  choice: क्योंकि वे मुझसे अधिक शक्तिशाली हैं
  rationale: तुलनात्मक सैन्य सामर्थ्य को स्पष्ट रखते हुए हिन्दी में सामूहिक समूह के लिए स्वाभाविक बहुवचन अपनाया गया है।
- source_word: אוּלַי אוּכַל
  choice: शायद मैं समर्थ हो जाऊँ
  rationale: अनिश्चितता और क्षमता, दोनों को बनाए रखता है; हिन्दी में वाक्य को आगे आने वाले प्रयोजन से स्वाभाविक रूप से जोड़ता है।
- source_word: נַכֶּה בּוֹ
  choice: हम उन पर प्रहार कर सकें
  rationale: मसोरेटी पाठ के प्रथम पुरुष बहुवचन ‘हम प्रहार करें’ को सुरक्षित रखता है; सामूहिक एकवचन कर्म को हिन्दी में ‘उन पर’ कहा गया है।
- source_word: וַאֲגָרְשֶׁנּוּ מִן הָאָרֶץ
  choice: फिर मैं उन्हें देश से निकाल दूँ
  rationale: क्रिया के प्रथम पुरुष एकवचन और ‘खदेड़ने/निकालने’ के अर्थ को बनाए रखता है; देश यहाँ बालाक के क्षेत्र को सूचित करता है।
- source_word: אֵת אֲשֶׁר תְּבָרֵךְ מְבֹרָךְ
  choice: जिसे तुम आशीर्वाद देते हो, वह धन्य होता है
  rationale: सामान्य संबंधवाचक कथन तथा आशीर्वाद के परिणामस्वरूप बनी दशा, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וַאֲשֶׁר תָּאֹר יוּאָר
  choice: और जिसे तुम शाप देते हो, वह शापित होता है
  rationale: पहले खंड के समानांतर ढाँचे और निष्क्रिय/परिणामी भाव को सुरक्षित रखता है।
theological_decisions:
- issue: बालाम के आशीर्वाद और शाप की प्रभावशीलता के बारे में बालाक का दावा
  choice: ‘मैं जानता हूँ’ के रूप में बालाक के कथन को ज्यों का त्यों रखा गया है
  alternative: ‘मेरा विश्वास है’ या कथन को वस्तुनिष्ठ धर्मवैज्ञानिक सत्य के रूप में समझाना
  rationale: हिब्रू יָדַעְתִּי स्पष्टतः ‘मैं जानता हूँ’ कहता है। वचन बालाक की धारणा प्रस्तुत करता है; अनुवाद न तो उसे कमजोर करता है, न कथावाचक की स्वतंत्र पुष्टि में बदलता है।
- issue: ‘मैं’ से ‘हम’ और फिर ‘मैं’ की ओर पुरुष-वचन का परिवर्तन
  choice: मुख्य पाठ में परिवर्तन को रखा गया है और पादटिप्पणी में कठिनाई बताई गई है
  alternative: सभी क्रियाओं को ‘मैं’ के रूप में समतल कर देना
  rationale: WLC का נַכֶּה प्रथम पुरुष बहुवचन है, जबकि אוּכַל और וַאֲגָרְשֶׁנּוּ प्रथम पुरुष एकवचन हैं। इस वास्तविक पाठगत तनाव को चुपचाप हटाना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। बालाक और बालाम के बीच संबोधन के लिए एकवचन ‘तुम’ चुना गया है, जिससे मूल का एकवचन बना रहता है और अत्यधिक पुरातन ‘तू’ से बचा जाता है। ‘जाति’ से आधुनिक हिन्दी में उत्पन्न हो सकने वाले जाति-व्यवस्था संबंधी अर्थ से बचने के लिए ‘इन लोगों’ रखा गया है।
