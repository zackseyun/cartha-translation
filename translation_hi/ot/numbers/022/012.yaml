id: NUM.22.12
reference: Numbers 22:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אֱלֹהִים֙ אֶל בִּלְעָ֔ם לֹ֥א תֵלֵ֖ךְ עִמָּ/הֶ֑ם לֹ֤א תָאֹר֙ אֶת הָ/עָ֔ם כִּ֥י בָר֖וּךְ הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/012.yaml
  text: And God said to Balaam[a], “You must not go with them. You must not curse the people, because it is blessed.”
translation:
  language: hi
  text: तब परमेश्वर ने बिलाम से कहा, “तुम उनके साथ मत जाओ। उन लोगों को शाप मत दो, क्योंकि वे आशीषित हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ इसका स्वाभाविक संकेत देता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस प्रसंग में यह इस्राएल के परमेश्वर के लिए प्रयुक्त है; ‘परमेश्वर’ मानक, गरिमापूर्ण हिन्दी रूप है।
- source_word: לֹא תֵלֵךְ עִמָּהֶם
  choice: तुम उनके साथ मत जाओ
  rationale: לֹא के साथ अपूर्ण क्रिया यहाँ स्पष्ट निषेध व्यक्त करती है; ‘मत जाओ’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से दृढ़ है।
- source_word: לֹא תָאֹר אֶת הָעָם
  choice: उन लोगों को शाप मत दो
  rationale: אָרַר का अर्थ ‘शाप देना’ है। הָעָם एक सामूहिक जनसमुदाय को दर्शाता है; हिन्दी में ‘उन लोगों’ से संदर्भ और सामूहिक अर्थ सहज रूप से स्पष्ट होता है।
- source_word: כִּי בָרוּךְ הוּא
  choice: क्योंकि वे आशीषित हैं
  rationale: כִּי कारण बताता है। हिब्रू में הָעָם के अनुरूप व्याकरणिक एकवचन है, पर आधुनिक हिन्दी में ‘लोग’ के साथ बहुवचन सर्वनाम और क्रिया स्वाभाविक हैं; आशय पूरे समुदाय का आशीषित होना है।
theological_decisions:
- issue: ‘आशीषित’ उपवाक्य में वचन और संदर्भ
  choice: ‘वे आशीषित हैं’—अर्थात इस्राएल के लोग सामूहिक रूप से
  alternative: ‘वह आशीषित है’
  rationale: हिब्रू בָרוּךְ הוּא पुल्लिंग एकवचन है क्योंकि הָעָם एक सामूहिक एकवचन संज्ञा है। हिन्दी में ‘लोग’ बहुवचन व्यवहार माँगता है। बहुवचन अनुवाद किसी व्यक्ति की ओर संकेत नहीं करता, बल्कि उसी सामूहिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और प्रत्यक्ष ईश्वरीय निषेध के अनुरूप। ‘मत जाओ’ और ‘शाप मत दो’ ने अनावश्यक रूप से पुरातन या कानूनी शैली से बचते हुए मूल का बल बनाए रखा है।
