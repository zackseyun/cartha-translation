source:
  edition: WLC
  text: וַ/יָּ֨גָר מוֹאָ֜ב מִ/פְּנֵ֥י הָ/עָ֛ם מְאֹ֖ד כִּ֣י רַב ה֑וּא וַ/יָּ֣קָץ מוֹאָ֔ב מִ/פְּנֵ֖י בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/003.yaml
  text: And Moab was very afraid because of the people[a], because they were numerous[b]; and Moab was filled with dread because of the sons of Israel.
translation:
  language: hi
  text: मोआब उस प्रजा से बहुत डर गया, क्योंकि उनकी संख्या बहुत बड़ी थी; और इस्राएलियों[b] के कारण मोआब व्याकुल हो उठा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ ‘घृणा करने लगा’, ‘वितृष्णा अनुभव करने लगा’ या ‘भय और घबराहट से व्याकुल हो उठा’ भी हो सकता है। यहाँ प्रसंग भय से जुड़ी तीव्र व्याकुलता की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; परंपरागत रूप से ‘इस्राएल की संतान’। यहाँ इसका अर्थ इस्राएली लोग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּגָר
  choice: बहुत डर गया
  rationale: גור यहाँ भय या आतंक की प्रतिक्रिया व्यक्त करता है; מְאֹד की तीव्रता को ‘बहुत’ से स्वाभाविक रूप में रखा गया है।
- source_word: מִפְּנֵי
  choice: से / के कारण
  rationale: इस प्रसंग में इसका शाब्दिक स्थानवाचक अर्थ नहीं, बल्कि भय और व्याकुलता का कारण अभिप्रेत है। हिंदी में दोनों वाक्यांशों के साथ क्रमशः ‘से’ और ‘के कारण’ स्वाभाविक हैं।
- source_word: הָעָם
  choice: उन लोगों
  rationale: यह सामूहिक संज्ञा इस्राएल की प्रजा को सूचित करती है। हिंदी में पूर्ववर्ती प्रसंग की ओर संकेत करने वाला ‘उन लोगों’ सहज और स्पष्ट है।
- source_word: כִּי רַב הוּא
  choice: क्योंकि वे बहुत अधिक थे
  rationale: इब्रानी में सामूहिक संज्ञा के साथ एकवचन सर्वनाम है, पर आधुनिक हिंदी में व्यक्तियों के समूह के लिए बहुवचन अधिक स्वाभाविक है। רַב यहाँ बड़ी संख्या को दर्शाता है।
- source_word: וַיָּקָץ
  choice: का जी घबरा उठा
  rationale: קוץ घृणा, वितृष्णा, क्लेश या भय-मिश्रित घबराहट का बोध करा सकता है। ‘जी घबरा उठा’ इसकी तीव्र और शारीरिक-सी प्रतिक्रिया को स्वाभाविक हिंदी में रखता है, जबकि पादटिप्पणी वास्तविक अर्थ-सीमा सुरक्षित करती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे जातीय समुदाय का प्रचलित नाम है; ‘इस्राएली’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: מוֹאָב
  choice: मोआब
  rationale: स्थान और जनसमुदाय के नाम का मानक हिंदी लिप्यंतरण।
theological_decisions:
- issue: וַיָּקָץ में भय और घृणा के बीच अर्थगत तनाव
  choice: मुख्य पाठ में ‘का जी घबरा उठा’ और पादटिप्पणी में अन्य संभावनाएँ
  alternative: ‘घृणा करने लगा’ अथवा ‘भय से भर गया’
  rationale: प्रसंग भय को प्रमुख बनाता है, किंतु क्रिया में संभव घृणा या वितृष्णा को पूरी तरह मिटाना उचित नहीं; पादटिप्पणी दोनों पहलुओं को खुला रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘का जी घबरा उठा’ मुहावरेदार हिंदी है और मूल क्रिया की तीव्र, लगभग शारीरिक प्रतिक्रिया को व्यक्त करता है; पादटिप्पणी उसके घृणा-वितृष्णा संबंधी अर्थ को भी सुरक्षित रखती है।
