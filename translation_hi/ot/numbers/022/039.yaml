  yaml_path: translation/ot/numbers/022/039.yaml
  text: So Balaam went with Balak[a], and they came to Kiriath-huzoth.
translation:
  language: hi
  text: तब बिलाम बालाक के साथ गया, और वे किर्यात-हुसोत[a] आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘किर्यात-हुसोत’ का अर्थ संभवतः ‘सड़कों का नगर’ या ‘खुले स्थानों का नगर’ है।
    reason: स्थान-नाम के संभावित शाब्दिक अर्थ के दोनों प्रमुख विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का क़ाल वय्यिक्तोल कथा को आगे बढ़ाते हुए सामान्य गति व्यक्त करता है; ‘गया’ इसका सहज और सटीक हिन्दी रूप है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עִם
  choice: के साथ
  rationale: यह संबंधबोधक शब्द साथ होने का सीधा अर्थ देता है; ‘के साथ’ स्वाभाविक हिन्दी है।
- source_word: בָּלָק
  choice: बालाक
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיָּבֹאוּ
  choice: वे … आए
  rationale: בוא का बहुवचन वय्यिक्तोल अगली कथात्मक क्रिया और स्थान की ओर गति व्यक्त करता है। ‘आए’ मूल अर्थ को बनाए रखता है और ‘पहुँचे’ या ‘प्रवेश किया’ जैसी अतिरिक्त विशिष्टता नहीं जोड़ता।
- source_word: קִרְיַת חֻצוֹת
  choice: किर्यत-हुस्सोत
  rationale: यहाँ यह व्यक्तिवाचक स्थान-नाम है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है; इसके घटकों का अर्थ पादटिप्पणी में दिया गया है।
