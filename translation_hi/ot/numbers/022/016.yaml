  rationale: אמר के साथ अप्रत्यक्ष कर्म को सरल हिंदी वाक्य-विन्यास में रखा गया है।
- source_word: כֹּה אָמַר
  choice: इस प्रकार कहता है
  rationale: यह औपचारिक संदेशवाहक-सूत्र है; वर्तमानकालीन हिंदी अभिव्यक्ति उद्धृत संदेश की औपचारिकता बनाए रखती है।
- source_word: בָּלָק בֶּן־צִפּוֹר
  choice: सिप्पोर का पुत्र बालाक
  rationale: हिब्रू संबंध-संरचना को स्वाभाविक हिंदी में व्यक्त करते हुए दोनों व्यक्तिनामों का लिप्यंतरण किया गया है।
- source_word: אַל־נָא
  choice: कृपया ... न
  rationale: אַל निषेध और נָא विनम्र आग्रह व्यक्त करता है; ‘कृपया ... न’ दोनों को स्वाभाविक हिंदी में समेटता है।
- source_word: תִמָּנַע מֵהֲלֹךְ
  choice: आने से अपने को न रोकिए
  rationale: מנע का ‘रोकना/विरत रखना’ भाव सुरक्षित है और מן के साथ क्रियार्थक रचना ‘से’ द्वारा व्यक्त हुई है। आदरसूचक रूप संदेश के विनम्र आग्रह के अनुकूल है।
- source_word: אֵלָי
  choice: मेरे पास
  rationale: प्रथम पुरुष की ओर दिशा को सामान्य आधुनिक हिंदी में स्पष्ट रूप से व्यक्त करता है।
