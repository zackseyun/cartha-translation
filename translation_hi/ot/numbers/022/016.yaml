  yaml_path: translation/ot/numbers/022/016.yaml
  text: 'They came to Balaam and said to him[a], “Thus says Balak son of Zippor: Please do not refrain from coming to me.”'
translation:
  language: hi
  text: 'वे बिलाम के पास आए और उससे कहा, “सिप्पोर का पुत्र बालाक इस प्रकार कहता है: कृपया मेरे पास आने से अपने को न रोकिए।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “मेरे पास जाने से अपने को न रोकिए।” हिब्रू में सामान्य गति-सूचक क्रिया “जाना/चलना” है; वक्ता के दृष्टिकोण से हिंदी में “मेरे पास आना” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ אֶל־בִּלְעָם
  choice: वे बिलाम के पास आए
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है; दूतों के बिलाम के निकट पहुँचने के संदर्भ में यह स्वाभाविक और स्रोत-संगत है।
- source_word: וַיֹּאמְרוּ לוֹ
