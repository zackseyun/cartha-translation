base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/005.yaml
  text: So he sent messengers to Balaam son of Beor at Pethor[a], which is by the River, in the land of the sons of his people, to call him, saying, “Look, a people has come out of Egypt. Look, it has covered the face of the land[c][b], and it is dwelling opposite me.”
translation:
  language: hi
  text: तब उसने बओर के पुत्र बिलाम को बुलाने के लिए उसके पास दूत भेजे। बिलाम पेतोर में रहता था, जो नदी[a] के किनारे, उसके लोगों की संतानों के देश में था।[b] दूतों ने उससे कहा, “देखो, एक जनसमूह मिस्र से निकल आया है। देखो, उसने भूमि का मुख[c] ढक लिया है, और वह मेरे सामने निवास कर रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “नदी”; संभवतः फरात नदी।
    reason: cross_reference
  - marker: b
    text: या “उसके लोगों के देश में।” हिब्रू पदबंध “उसके लोगों की संतानों का देश” कठिन है, और “उसके” का संदर्भ अलग-अलग तरह से समझा जा सकता है।
    reason: alternative_reading
  - marker: c
    text: मूलतः “भूमि की आँख”; यहाँ इसका अर्थ भूमि का दिखाई देने वाला मुख या सतह है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח מַלְאָכִים
  choice: तब उसने ... दूत भेजकर
  rationale: कथात्मक क्रम को ‘तब’ से स्वाभाविक रूप में आगे बढ़ाया गया है; इस राजनयिक संदर्भ में מַלְאָכִים मनुष्य दूत हैं, स्वर्गदूत नहीं।
- source_word: בִּלְעָם בֶּן בְּעוֹר
  choice: बओर के पुत्र बिलाम
  rationale: व्यक्तिनामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है और हिब्रू संबंध-रचना सुरक्षित है।
- source_word: פְּתוֹרָה אֲשֶׁר עַל־הַנָּהָר
  choice: पतोर में, जो महानद के किनारे ... था
  rationale: दिशासूचक रूप पतोर की ओर भेजे जाने को बताता है; हिन्दी में स्थान-सूचक ‘पतोर में’ अगले संबंधवाचक उपवाक्य के साथ सहज है। הַנָּהָר को विशिष्ट ‘महानद’ के रूप में रखा गया है, जबकि उसकी पहचान पादटिप्पणी में दी गई है।
- source_word: אֶרֶץ בְּנֵי עַמּוֹ
  choice: उसके लोगों के वंशजों के देश में
  rationale: कठिन हिब्रू पदबंध में בְּנֵי की पीढ़ी/वंश-संबंधी धारणा और ‘उसके’ की वास्तविक अस्पष्टता को यथासंभव बचाया गया है।
- source_word: לִקְרֹא לוֹ לֵאמֹר
  choice: उसे बुलाने के लिए ... कहलवाया
  rationale: उद्देश्य और संदेश-परिचय दोनों को स्वाभाविक हिन्दी वाक्य-विन्यास में व्यक्त किया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: दोनों बार प्रयुक्त ध्यानाकर्षक और बलात्मक कण को आधुनिक, सहज हिन्दी में प्रत्यक्ष रूप से रखा गया है।
- source_word: עַם יָצָא מִמִּצְרַיִם
  choice: एक जाति मिस्र से निकल आई है
  rationale: עַם के सामूहिक जातीय-राष्ट्रीय अर्थ के लिए ‘जाति’ और पूर्ण घटना की वर्तमान प्रासंगिकता के लिए ‘निकल आई है’ स्वाभाविक हैं।
- source_word: כִסָּה אֶת עֵין הָאָרֶץ
  choice: उसने धरती का मुख ढक लिया है
  rationale: शाब्दिक ‘धरती की आँख’ हिन्दी में अपारदर्शी है; ‘धरती का मुख’ दृश्य सतह का अर्थ देते हुए मूल रूपक को बनाए रखता है।
- source_word: וְהוּא יֹשֵׁב מִמֻּלִי
  choice: वह मेरे सामने आकर बस गई है
  rationale: יֹשֵׁב यहाँ ठहरने/निवास करने का भाव देता है और מִמֻּלִי वक्ता के सामने या उस पार की स्थिति बताता है; ‘आकर’ प्रसंगगत निकटता को सहज बनाता है।
theological_decisions:
- issue: אֶרֶץ בְּנֵי עַמּוֹ में ‘उसके’ का संदर्भ
  choice: मुख्य पाठ में ‘उसके लोगों के वंशजों’ रखकर सर्वनाम की अस्पष्टता बनाए रखी गई
  alternative: ‘अपने लोगों के देश में’ या ‘अम्मावियों के देश में’
  rationale: हिब्रू पाठ कठिन है और सर्वनाम का संदर्भ निश्चित करना व्याख्यात्मक निर्णय होगा; इसलिए वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। ‘दूत’, ‘महानद’, ‘धरती का मुख’ जैसे शब्द मूल की संरचना और बिंब को बचाते हैं; कठिन पाठ को पादटिप्पणियों में स्पष्ट किया गया है।
