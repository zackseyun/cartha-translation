  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ לָֽ/אָת֔וֹן כִּ֥י הִתְעַלַּ֖לְתְּ בִּ֑/י ל֤וּ יֶשׁ חֶ֨רֶב֙ בְּ/יָדִ֔/י כִּ֥י עַתָּ֖ה הֲרַגְתִּֽי/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/029.yaml
  text: And Balaam said to the donkey[a], “Because you have made a mockery of me! If only there were a sword in my hand[c][b], I would kill you right now.”
translation:
  language: hi
  text: तब बिलाम ने गदही से कहा, “तूने मेरा मज़ाक उड़ाया है![a] काश मेरे हाथ में तलवार होती, तो मैं तुझे अभी मार डालता।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तूने मेरे साथ दुर्व्यवहार किया है” अथवा “तूने मुझे मूर्ख बनाया है।” इब्रानी क्रिया में अपमानजनक, उपहासपूर्ण या दुर्व्यवहारपूर्ण व्यवहार का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “तो मैं तुझे अब तक मार चुका होता।” इब्रानी में बिलाम की वास्तविकता के विपरीत इच्छा और तत्काल इरादा व्यक्त होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को स्वाभाविक आधुनिक हिन्दी में आगे बढ़ाता है; ‘तब’ प्रसंग का क्रम दिखाता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: לָאָתוֹן
  choice: गदही से
  rationale: אָתוֹן विशेष रूप से मादा गधे को दर्शाता है; ‘गदही’ हिन्दी में स्वाभाविक है और स्रोत का स्त्रीलिंग स्पष्ट रखता है।
- source_word: הִתְעַלַּלְתְּ בִּי
  choice: तूने मेरा मज़ाक उड़ाया है
  rationale: यहाँ क्रिया अपमानजनक, उपहासपूर्ण या दुर्व्यवहारपूर्ण ढंग से पेश आने का भाव रखती है। ‘मज़ाक उड़ाया’ बिलाम के अपमान और क्रोध को सहज हिन्दी में व्यक्त करता है।
- source_word: לוּ יֶשׁ חֶרֶב בְּיָדִי
  choice: काश मेरे हाथ में तलवार होती
  rationale: לוּ एक अवास्तविक इच्छा व्यक्त करता है। यह रूप मूल के ‘मेरे हाथ में तलवार’ वाले चित्र को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: כִּי עַתָּה הֲרַגְתִּיךְ
  choice: तो मैं तुझे अभी मार डालता
  rationale: अवास्तविक पूर्ववाक्य के परिणाम और तत्काल हिंसक इरादे को व्यक्त करता है। ‘अभी’ עַתָּה की तात्कालिकता और ‘मार डालता’ हत्या के अर्थ को स्पष्ट रखता है।
