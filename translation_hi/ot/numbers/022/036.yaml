  text: וַ/יִּשְׁמַ֥ע בָּלָ֖ק כִּ֣י בָ֣א בִלְעָ֑ם וַ/יֵּצֵ֨א לִ/קְרָאת֜/וֹ אֶל עִ֣יר מוֹאָ֗ב אֲשֶׁר֙ עַל גְּב֣וּל אַרְנֹ֔ן אֲשֶׁ֖ר בִּ/קְצֵ֥ה הַ/גְּבֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/036.yaml
  text: When Balak heard that Balaam had come[a], he went out to meet him at the city of Moab, which is on the border of the Arnon[b], at the edge of the border.
translation:
  language: hi
  text: जब बालाक ने सुना कि बिलाम आ गया था, तो वह उससे मिलने के लिए मोआब के नगर[a] की ओर निकल पड़ा, जो अर्नोन की सीमा पर था, उस सीमा के छोर पर[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब के किसी नगर।” इब्रानी वाक्यांश किसी विशेष, ज्ञात मोआबी नगर या सामान्यतः मोआब के किसी नगर को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उस प्रदेश के अंतिम छोर पर।” यहाँ “सीमा” के लिए प्रयुक्त इब्रानी शब्द का अर्थ कुछ संदर्भों में “प्रदेश” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने सुना
  rationale: שׁמע का सामान्य अर्थ ‘सुनना’ है; यहाँ यह किसी समाचार के मिलने को स्वाभाविक और बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: כִּי בָא בִלְעָם
  choice: कि बिलाम आ गया है
  rationale: यह बालाक द्वारा सुने गए समाचार की विषय-वस्तु है। हिन्दी में ‘आ गया है’ आगमन पूरा होने और उसके बाद बालाक के निकलने का क्रम सहज रूप से व्यक्त करता है।
- source_word: וַיֵּצֵא לִקְרָאתוֹ
  choice: वह उससे मिलने के लिए ... गया
  rationale: יצא और לקראת मिलकर किसी की ओर निकलकर उससे मिलने का भाव देते हैं। हिन्दी में यह रूप स्वाभाविक है और न विशेष आत्मीय स्वागत जोड़ता है, न विरोधी मुठभेड़ का भाव।
- source_word: אֶל עִיר מוֹאָב
  choice: मोआब के नगर तक
  rationale: אֶל गति की दिशा या गंतव्य बताता है। עִיר מוֹאָב को संदर्भ में ज्ञात नगर के रूप में लिया गया है; इसकी अनिश्चित व्याख्या पादटिप्पणी में रखी गई है।
- source_word: אֲשֶׁר עַל גְּבוּל אַרְנֹן
  choice: जो अर्नोन की सीमा पर ... है
  rationale: עַל גְּבוּל सीमा पर स्थित होने का भाव देता है। अर्नोन यहाँ नदी/घाटी से चिह्नित भौगोलिक सीमा है।
- source_word: אֲשֶׁר בִּקְצֵה הַגְּבוּל
  choice: उस सीमा के छोर पर
  rationale: קצה का अर्थ ‘छोर/अंतिम सिरा’ है। ‘सीमा’ को दोहराने से इब्रानी की पुनरुक्ति बनी रहती है।
