source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֣ף אֱלֹהִים֮ כִּֽי הוֹלֵ֣ךְ הוּא֒ וַ/יִּתְיַצֵּ֞ב מַלְאַ֧ךְ יְהוָ֛ה בַּ/דֶּ֖רֶךְ לְ/שָׂטָ֣ן ל֑/וֹ וְ/הוּא֙ רֹכֵ֣ב עַל אֲתֹנ֔/וֹ וּ/שְׁנֵ֥י נְעָרָ֖י/ו עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/022.yaml
  text: But God’s anger burned because he was going[a], and the angel of Yahweh took his stand in the road as an adversary to him. He was riding on his donkey[b], and his two young men were with him.
translation:
  language: hi
  text: परमेश्वर का क्रोध इसलिए भड़क उठा कि वह जा रहा था। तब याहवे का दूत उसका विरोधी[a] बनकर मार्ग में आ खड़ा हुआ। वह अपनी गधी[b] पर सवार था, और उसके दो युवक उसके साथ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ हिब्रू शब्द שָׂטָן (सातान) का अर्थ ‘विरोधी’ या ‘प्रतिपक्षी’ है; यह आवश्यक नहीं कि यहाँ वह व्यक्तिवाचक नाम ‘शैतान’ हो।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू शब्द विशेष रूप से मादा गधे को दर्शाता है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּחַר אַף אֱלֹהִים
  choice: परमेश्वर का क्रोध भड़क उठा
  rationale: हिब्रू मुहावरे में क्रोध के जलने का सजीव भाव है; ‘भड़क उठा’ उसे स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי הוֹלֵךְ הוּא
  choice: क्योंकि वह जा रहा था
  rationale: कारणसूचक כִּי और जारी क्रिया दर्शाने वाले कृदन्त—दोनों को बनाए रखता है तथा प्रसंग में अनुमति और क्रोध के बीच के तनाव को अनावश्यक रूप से नहीं सुलझाता।
- source_word: וַיִּתְיַצֵּב
  choice: आ खड़ा हुआ
  rationale: हित्पएल रूप में जानबूझकर किसी स्थान पर डटने का भाव है; हिन्दी में यह प्रयोग उस उद्देश्यपूर्ण स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत’ है और इस प्रसंग में स्वर्गीय दूत अभिप्रेत है; יְהוָה को उसके व्यक्तिवाचक नाम ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: לְשָׂטָן לוֹ
  choice: उसका विरोधी बनकर
  rationale: שָׂטָן यहाँ सामान्य संज्ञा है, जो दूत की विरोध करने वाली भूमिका बताती है; यह अनुवाद इसे व्यक्तिवाचक नाम ‘शैतान’ नहीं बनाता।
- source_word: אֲתֹנוֹ
  choice: अपनी गदही
  rationale: हिब्रू संज्ञा विशेष रूप से मादा गधे को दर्शाती है, और ‘गदही’ हिन्दी में संक्षिप्त तथा स्वाभाविक है।
- source_word: שְׁנֵי נְעָרָיו
  choice: उसके दो युवक
  rationale: נַעַר युवक, सेवक या परिचर का बोध करा सकता है। ‘युवक’ सबसे सीधा अर्थ रखता है और उनकी सामाजिक भूमिका को आवश्यकता से अधिक निश्चित नहीं करता।
theological_decisions:
- issue: इस प्रसंग में שָׂטָן का अर्थ
  choice: सामान्य संज्ञा ‘विरोधी’
  alternative: व्यक्तिवाचक नाम ‘शैतान’
  rationale: वाक्य-विन्यास और प्रसंग में यह शब्द याहवे के दूत की बिलाम-विरोधी भूमिका बताता है। इसे ‘शैतान’ नाम देना बाद की धर्मवैचारिक पहचान को यहाँ आयात करेगा।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुराक्षरीय व्यक्तिवाचक नाम सीधे उपस्थित है; ‘याहवे’ उसे नाम के रूप में बनाए रखता है।
- issue: परमेश्वर के क्रोध का कारण
  choice: ‘क्योंकि वह जा रहा था’ को बिना व्याख्यात्मक विस्तार के रखा
  alternative: यह जोड़ना कि बिलाम लालच या गलत मनोभाव से जा रहा था
  rationale: हिब्रू वाक्य केवल उसके जाने को कारण बताता है। पिछले प्रसंग के साथ दिखाई देने वाले तनाव को अनुवाद में किसी अनकहे उद्देश्य द्वारा सुलझाना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किन्तु गरिमापूर्ण रखी गई है। ‘युवक’ मूल शब्द की आयु-संबंधी धारणा को बनाए रखता है और उन्हें निश्चित रूप से ‘सेवक’ बताने से बचता है। कारणसूचक वाक्य को यथावत रखकर प्रसंग का वास्तविक धर्मवैचारिक तनाव सुरक्षित रखा गया है।
