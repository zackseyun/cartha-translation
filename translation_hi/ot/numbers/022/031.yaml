source:
  edition: WLC
  text: וַ/יְגַ֣ל יְהוָה֮ אֶת עֵינֵ֣י בִלְעָם֒ וַ/יַּ֞רְא אֶת מַלְאַ֤ךְ יְהוָה֙ נִצָּ֣ב בַּ/דֶּ֔רֶךְ וְ/חַרְבּ֥/וֹ שְׁלֻפָ֖ה בְּ/יָד֑/וֹ וַ/יִּקֹּ֥ד וַ/יִּשְׁתַּ֖חוּ לְ/אַפָּֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/031.yaml
  text: Then Yahweh uncovered Balaam’s eyes[a], and he saw the angel of Yahweh standing in the road with his sword drawn in his hand[c][b]; and he bowed down and prostrated himself with his face to the ground.
translation:
  language: hi
  text: तब याहवे ने बिलाम की आँखों पर से आवरण हटा दिया[a], और उसने मार्ग में याहवे के दूत[b] को खड़ा देखा, जो हाथ में खिंची हुई तलवार लिए हुए था। तब बिलाम झुका और मुँह के बल भूमि पर दंडवत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बिलाम की आँखें खोल दीं।” इब्रानी क्रिया का शाब्दिक भाव “आवरण हटाना” है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे के संदेशवाहक।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְגַל
  choice: आँखों पर से आवरण हटा दिया
  rationale: क्रिया גלה का मूल भाव किसी ढकी हुई वस्तु को खोलने या उसका आवरण हटाने का है। यह अभिव्यक्ति बताती है कि याहवे ने बिलाम को वह देखने योग्य बनाया जो पहले उसकी दृष्टि से ओझल था।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का दूत
  rationale: מַלְאָךְ का अर्थ दूत या संदेशवाहक है। हिन्दी का ‘दूत’ इस संदर्भ में स्वाभाविक है और प्राणी के स्वरूप के विषय में मूल पाठ से अधिक स्पष्टता नहीं जोड़ता।
- source_word: נִצָּב בַּדֶּרֶךְ
  choice: मार्ग में ... खड़ा
  rationale: पदबंध दूत की स्थिर मुद्रा और बिलाम के रास्ते में उसकी अवरोधक स्थिति व्यक्त करता है।
- source_word: וְחַרְבּוֹ שְׁלֻפָה בְיָדוֹ
  choice: जो हाथ में तलवार खींचे हुए था
  rationale: शְׁלֻפָה म्यान से खींची हुई तलवार को दर्शाता है; हिन्दी वाक्य में इसे दूत की साथ-साथ चल रही अवस्था के रूप में स्वाभाविक ढंग से रखा गया है।
- source_word: וַיִּקֹּד וַיִּשְׁתַּחוּ לְאַפָּיו
  choice: झुका और मुँह के बल भूमि पर दंडवत किया
  rationale: दोनों क्रियाओं और अंतिम शारीरिक मुहावरे को बनाए रखते हुए गहरे झुकने और भूमि पर मुँह के बल प्रणाम करने की क्रिया स्पष्ट की गई है। ‘आराधना की’ कहने से बचकर धार्मिक आशय को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: וַיִּשְׁתַּחוּ को शारीरिक दंडवत या स्पष्ट आराधना के रूप में प्रस्तुत करना
  choice: मुँह के बल भूमि पर दंडवत किया
  alternative: आराधना की
  rationale: संदर्भ बिलाम की शारीरिक प्रतिक्रिया का स्पष्ट वर्णन करता है। ‘दंडवत किया’ क्रिया को सुरक्षित रखता है, पर यह तय नहीं करता कि लेखक यहाँ औपचारिक आराधना का दावा कर रहा है।
- issue: מַלְאַךְ की पहचान
  choice: दूत
  alternative: स्वर्गदूत; संदेशवाहक
  rationale: ‘दूत’ मूल शब्द की व्यापकता को सुरक्षित रखता है; ‘स्वर्गदूत’ उसके स्वभाव को अधिक स्पष्ट कर सकता है, जबकि ‘संदेशवाहक’ उसके कार्य पर बल देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी रखी गई है। ‘आवरण हटा दिया’ मूल इब्रानी बिंब को सुरक्षित रखते हुए सामान्य पाठक के लिए समझने योग्य है। ‘दंडवत किया’ शारीरिक क्रिया और सम्मान दोनों व्यक्त करता है, बिना ‘आराधना’ का अधिक विशिष्ट धार्मिक अर्थ आरोपित किए।
