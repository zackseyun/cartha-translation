base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/018.yaml
  text: Balaam answered and said to Balak’s servants, “Even if Balak were to give me his house full of silver and gold, I could not go beyond the word of Yahweh my God, to do anything small or great.”
translation:
  language: hi
  text: बिलाम ने बालाक के सेवकों को उत्तर दिया, “यदि बालाक मुझे चाँदी और सोने से भरा हुआ अपना घर भी दे दे, तो भी मैं यहोवा, मेरे परमेश्वर, के वचन से आगे नहीं बढ़ सकता, न छोटा काम कर सकता हूँ, न बड़ा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे परमेश्वर यहोवा के मुँह से आगे नहीं बढ़ सकता।” यह एक हिब्रू मुहावरा है, जिसका अर्थ है उसकी कही हुई बात या आज्ञा का उल्लंघन न करना।
    reason: मूल हिब्रू मुहावरे और उसके अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַן בִּלְעָם וַיֹּאמֶר
  choice: बिलाम ने ... उत्तर दिया
  rationale: हिब्रू का दोहरा संवाद-सूत्र हिन्दी में स्वाभाविक रूप से संक्षिप्त किया गया है; उत्तर देने का भाव सुरक्षित है।
- source_word: עַבְדֵי בָלָק
  choice: बालाक के सेवकों
  rationale: संदर्भ में ये बालाक के दूत अथवा दरबारी हैं; ‘सेवक’ मूल शब्द के निकट और हिन्दी में सहज है।
- source_word: אִם יִתֶּן לִי בָלָק
  choice: यदि बालाक मुझे ... भी दे दे
  rationale: शर्त की काल्पनिक तथा रियायती शक्ति को ‘यदि ... भी’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מְלֹא בֵיתוֹ כֶּסֶף וְזָהָב
  choice: अपना घर भर चाँदी और सोना
  rationale: घर को चाँदी-सोने से भरा होने की मूल अतिशयोक्तिपूर्ण छवि बनाए रखी गई है।
- source_word: לֹא אוּכַל
  choice: मैं ... नहीं बढ़ सकता
  rationale: यह केवल अनिच्छा नहीं, बल्कि व्यक्त की गई असमर्थता है।
- source_word: לַעֲבֹר אֶת פִּי יְהוָה אֱלֹהָי
  choice: अपने परमेश्वर यहोवा के मुँह की बात से आगे नहीं बढ़ सकता
  rationale: ‘मुँह’ की ठोस हिब्रू अभिव्यक्ति को मुख्य पाठ में रखा गया है; इसका अर्थ कही हुई बात अथवा आज्ञा का उल्लंघन करना है।
- source_word: לַעֲשׂוֹת קְטַנָּה אוֹ גְדוֹלָה
  choice: छोटे या बड़े किसी भी काम को करने के लिए
  rationale: मूल के लघु-महान युग्म को रखते हुए उसके समग्र अर्थ ‘कुछ भी’ को स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: आधुनिक हिन्दी बाइबल-पाठकों में परिचित व्यक्तिगत नाम ‘यहोवा’ अपनाया गया है; इसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया।
- issue: बिलाम के कथन की शक्ति
  choice: परमेश्वर की कही बात से आगे बढ़ने में असमर्थता
  alternative: परमेश्वर की आज्ञा न मानने से इनकार
  rationale: יכל और ‘मुँह की बात से आगे बढ़ना’ वाली अभिव्यक्ति कथन को असमर्थता के रूप में प्रस्तुत करती है; अनुवाद इसे केवल स्वैच्छिक इनकार नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘घर भर’ धन की मूल छवि को बचाता है, और ‘छोटे या बड़े किसी भी काम’ मूल के व्यापक युग्म को स्पष्ट करता है।
