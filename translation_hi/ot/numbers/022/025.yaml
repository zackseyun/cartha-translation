  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תֵּ֨רֶא הָ/אָת֜וֹן אֶת מַלְאַ֣ךְ יְהוָ֗ה וַ/תִּלָּחֵץ֙ אֶל הַ/קִּ֔יר וַ/תִּלְחַ֛ץ אֶת רֶ֥גֶל בִּלְעָ֖ם אֶל הַ/קִּ֑יר וַ/יֹּ֖סֶף לְ/הַכֹּתָֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/025.yaml
  text: When the donkey saw the angel of Yahweh[a], she pressed herself against the wall and pressed Balaam’s foot against the wall, so he struck her again.
translation:
  language: hi
  text: जब गधी ने यहोवा के दूत[a] को देखा, तो वह दीवार से जा सटी और उसने बिलाम का पैर दीवार से दबा दिया। तब बिलाम ने उसे फिर मारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यहोवा के स्वर्गदूत’। यहाँ वर्णित दूत अलौकिक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָתוֹן
  choice: गधी
  rationale: आतोन विशेष रूप से मादा गधे को दर्शाता है; हिन्दी में ‘गधी’ इसका सहज और संक्षिप्त रूप है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा के दूत
  rationale: מַלְאַךְ का मूल अर्थ ‘दूत’ है और इस प्रसंग में वह अलौकिक दूत है; ‘यहोवा के दूत’ स्रोत की रचना और उसकी संभावित अर्थ-व्याप्ति दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय निज नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַתִּלָּחֵץ אֶל הַקִּיר
  choice: वह दीवार से जा सटी
  rationale: क्रिया यहाँ गधी के अपने को दीवार की ओर कसकर ले जाने का भाव देती है; ‘जा सटी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַתִּלְחַץ אֶת רֶגֶל בִּלְעָם אֶל הַקִּיר
  choice: उसने बिलाम का पैर दीवार से दबा दिया
  rationale: सकर्मक प्रयोग बताता है कि गधी की गति से बिलाम का पैर दीवार के विरुद्ध दब गया; ‘दबा दिया’ कारण और परिणाम दोनों स्पष्ट करता है।
- source_word: וַיֹּסֶף לְהַכֹּתָהּ
  choice: बिलाम ने उसे फिर मारा
  rationale: יָסַף के साथ infinitive यहाँ क्रिया की पुनरावृत्ति दर्शाता है; ‘फिर मारा’ इसका सहज हिन्दी रूप है।
theological_decisions:
- issue: מַלְאַךְ को ‘दूत’ या ‘स्वर्गदूत’ कहना
  choice: यहोवा के दूत
  alternative: यहोवा के स्वर्गदूत
  rationale: इस प्रसंग में सत्ता स्पष्टतः अलौकिक है, पर मूल शब्द का व्यापक अर्थ ‘दूत’ है। मुख्य पाठ में ‘दूत’ रखने और पादटिप्पणी में ‘स्वर्गदूत’ बताने से मूल की शब्दार्थगत व्यापकता सुरक्षित रहती है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: निज नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। हिन्दी पाठकों के लिए अधिक परिचित ‘यहोवा’ चुना गया, जबकि ‘याहवे’ संभावित लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘जा सटी’ और ‘दबा दिया’ दृश्य की शारीरिक गति को स्पष्ट रखते हैं; वाक्य-विन्यास मूल घटनाक्रम का अनुसरण करता है।
