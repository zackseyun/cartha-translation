  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: कथात्मक क्रम में קום के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: इब्रानी पद का सीधा कालवाचक अर्थ; इसमें ‘बहुत सवेरे’ जैसी अतिरिक्त तीव्रता नहीं जोड़ी गई है।
- source_word: וַיַּחֲבֹשׁ
  choice: काठी कसी
  rationale: गदही को सवारी के लिए तैयार करने की क्रिया का स्वाभाविक हिन्दी मुहावरा।
- source_word: אֶת אֲתֹנוֹ
  choice: अपनी गदही
  rationale: אָתוֹן विशेष रूप से मादा गधे को दर्शाता है; हिन्दी में ‘गदही’ इस जानकारी को संक्षेप और स्पष्ट रूप से बनाए रखता है।
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: הלך की साधारण कथात्मक गति को सहज हिन्दी में व्यक्त करता है।
- source_word: עִם
  choice: के साथ
  rationale: संगति या साथ होने का सीधा अर्थ।
- source_word: שָׂרֵי מוֹאָב
  choice: मोआब के अधिकारियों
  rationale: שָׂרִים यहाँ ऊँचे पद वाले राजकीय प्रतिनिधियों को दर्शाता है; ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और ‘राजकुमार’ कहकर वंशगत पद का अनावश्यक अर्थ नहीं जोड़ता।
