base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/013.yaml
  text: So Balaam rose in the morning and said to Balak’s officials[a], “Go to your land, because Yahweh has refused to let me go with you.”
translation:
  language: hi
  text: तब बिलाम सुबह उठा और बालाक के अधिकारियों[a] से कहा, “अपने देश चले जाओ, क्योंकि याहवे ने मुझे तुम्हारे साथ जाने की अनुमति देने से इनकार कर दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बालाक के प्रधानों” अथवा “बालाक के हाकिमों”।
    reason: שָׂרֵי पद के सामाजिक और प्रशासनिक अर्थ-क्षेत्र में ‘अधिकारी,’ ‘प्रधान,’ और ‘हाकिम’ जैसे समतुल्य संभव हैं।
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: कथात्मक क्रम में קום का स्वाभाविक आधुनिक हिन्दी रूप; अगले समय-सूचक पद के साथ सहज है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: मानक समय-सूचक अभिव्यक्ति, बिना ऐसी अतिरिक्त शीघ्रता जो मूल में स्पष्ट नहीं है।
- source_word: שָׂרֵי בָלָק
  choice: बालाक के अधिकारियों
  rationale: שָׂרִים राजकीय पदाधिकारियों, प्रधानों या हाकिमों को दर्शा सकता है; यहाँ वे राजा के प्रतिनिधि हैं, इसलिए ‘अधिकारियों’ स्पष्ट और स्वाभाविक है।
- source_word: לְכוּ אֶל אַרְצְכֶם
  choice: अपने देश लौट जाओ
  rationale: शाब्दिक अर्थ ‘अपने देश को जाओ’ है; प्रसंग में वे वहीं से आए थे, इसलिए ‘लौट जाओ’ गंतव्य और वापसी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बिलाम की आज्ञा का कारण प्रस्तुत करता है।
- source_word: מֵאֵן
  choice: इनकार कर दिया है
  rationale: Piel पूर्ण रूप दृढ़ अस्वीकृति व्यक्त करता है; हिन्दी पूर्णकाल वर्तमान परिणाम को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: לְתִתִּי לַהֲלֹךְ עִמָּכֶם
  choice: मुझे तुम्हारे साथ जाने की अनुमति देने
  rationale: נתן के साथ infinitive यहाँ अनुमति देने का मुहावरेदार अर्थ रखता है; यह हिन्दी में अर्थ को स्पष्ट रखते हुए इब्रानी संरचना के निकट है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: सामान्य कथात्मक वचन-क्रिया का स्वाभाविक हिन्दी समतुल्य।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम सीधे आया है। हिन्दी पाठकों के लिए प्रतिष्ठित और पहचाना हुआ लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘अपने देश लौट जाओ’ प्रसंगगत दिशा को स्वाभाविक बनाता है। सर्वनाम ‘तुम्हारे’ प्रतिनिधिमंडल के लिए बहुवचन है।
