  text: וַ/יָּבֹ֨א אֱלֹהִ֥ים אֶל בִּלְעָם֮ לַיְלָה֒ וַ/יֹּ֣אמֶר ל֗/וֹ אִם לִ/קְרֹ֤א לְ/ךָ֙ בָּ֣אוּ הָ/אֲנָשִׁ֔ים ק֖וּם לֵ֣ךְ אִתָּ֑/ם וְ/אַ֗ךְ אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֥/וֹ תַעֲשֶֽׂה׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/020.yaml
  text: God came to Balaam at night and said to him[a], “If the men have come to call you, rise, go with them; but only the word that I speak to you[b], that you shall do.”
translation:
  language: hi
  text: रात में परमेश्वर बिलाम के पास आया और उससे कहा, “यदि वे पुरुष तुम्हें बुलाने आए हैं,[a] तो उठो और उनके साथ जाओ; लेकिन केवल वही करना जो मैं तुमसे कहूँ।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि वे पुरुष तुम्हें बुलाने के लिए आए थे।”
    reason: इब्रानी क्रिया के पूर्ण आगमन को हिन्दी में भूतकाल से भी व्यक्त किया जा सकता है।
  - marker: b
    text: 'शाब्दिक: “लेकिन केवल वह वचन जो मैं तुमसे कहूँ, उसे करना।” ‘वचन’ के लिए ‘बात’ या ‘विषय’ भी संभव है।'
    reason: इब्रानी दָּבָר (‘वचन/बात/विषय’) और कर्म को आगे रखकर दिए गए बल को स्पष्ट करता है; मुख्य पाठ में हिन्दी के स्वाभाविक मुहावरे का प्रयोग किया गया है।
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सामान्य आख्यानात्मक अर्थ यहाँ ‘आया’ है। ‘प्रकट हुआ’ कहना मूल पाठ से अधिक अर्थ जोड़ता।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: इस पद में मूल पाठ אֱלֹהִים का प्रयोग करता है, न कि यहोवा नाम का; इसलिए इस भेद को सुरक्षित रखा गया है।
- source_word: לַיְלָה
  choice: रात में
  rationale: यह आधुनिक हिन्दी में समय बताने वाला स्वाभाविक और स्पष्ट प्रयोग है।
- source_word: אִם לִקְרֹא לְךָ בָּאוּ הָאֲנָשִׁים
  choice: यदि वे पुरुष तुम्हें बुलाने आए हैं
  rationale: לִקְרֹא לְךָ का भाव ‘तुम्हें बुलाना’ या ‘तुम्हें बुलाने के लिए आना’ है। पूर्ण हुई आगमन-क्रिया की वर्तमान प्रासंगिकता दिखाने के लिए ‘आए हैं’ रखा गया है।
- source_word: קוּם לֵךְ
  choice: उठो और ... जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं को स्पष्ट रखा गया है; ‘और’ हिन्दी में क्रम को स्वाभाविक बनाता है।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: यह पूर्वसर्ग और उसके सर्वनाम-प्रत्यय का सीधा तथा स्पष्ट अनुवाद है।
- source_word: וְאַךְ
  choice: लेकिन केवल
  rationale: यह जाने की अनुमति पर लगाए गए कड़े प्रतिबंध को व्यक्त करता है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: דָּבָר के कई अर्थ हो सकते हैं, पर यहाँ אֲדַבֵּר ‘मैं कहूँ’ के साथ वाणी-संबंधी संदर्भ होने के कारण ‘वचन’ उपयुक्त है और आदेशात्मक बल बनाए रखता है।
- source_word: אֲשֶׁר אֲדַבֵּר אֵלֶיךָ
  choice: जो मैं तुमसे कहूँ
  rationale: हिन्दी का संभाव्य-भविष्य रूप आगामी ईश्वरीय कथन का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֹתוֹ תַעֲשֶׂה
  choice: तुम्हें करना है
  rationale: यह अनिवार्यता को आधुनिक हिन्दी में स्पष्ट करता है; पहले आए ‘वही वचन’ से मूल के कर्म पर बल को सुरक्षित रखा गया है।
theological_decisions:
- issue: इस पद में ईश्वर के लिए प्रयुक्त पदनाम
  choice: אֱלֹהִים का अनुवाद ‘परमेश्वर’
  alternative: ‘यहोवा’
  rationale: मूल इब्रानी पाठ इस पद में אֱלֹהִים कहता है, יהוה नहीं। निकटवर्ती प्रसंग के आधार पर पदनामों का सामंजस्य करने के बजाय मूल पाठ का भेद रखा गया है।
- issue: बिलाम को जाने की अनुमति और उस पर प्रतिबंध
  choice: जाने की अनुमति के साथ केवल परमेश्वर के वचन को करने की स्पष्ट सीमा
  alternative: अनुमति को बिना शर्त मानना
  rationale: וְאַךְ का प्रतिबंधात्मक बल बनाए रखना आवश्यक है; अनुवाद अनुमति और सीमा के बीच पाठ में मौजूद तनाव को हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। परमेश्वर के सीधे संबोधन में सम्मानसूचक बहुवचन के बजाय सामान्य एकवचन ‘तुम’ और उसके अनुरूप आज्ञार्थक रूप रखे गए हैं। ‘वचन’ धार्मिक संदर्भ में परिचित है, जबकि पादटिप्पणी ‘बात’ की व्यापक शब्दार्थ-संभावना बताती है।
