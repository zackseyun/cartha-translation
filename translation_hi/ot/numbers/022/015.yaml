base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/015.yaml
  text: Then Balak again sent officials[a], more numerous and more honored than these.
translation:
  language: hi
  text: तब बालाक ने फिर से अधिकारी भेजे, जो पहले आए अधिकारियों से अधिक संख्या में और अधिक प्रतिष्ठित[a] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अधिक सम्मानित’ अथवा ‘ऊँचे पद वाले।’ इब्रानी शब्द उनकी ऊँची हैसियत या अधिक प्रतिष्ठा पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף עוֹד ... שְׁלֹחַ
  choice: फिर से ... भेजे
  rationale: יָסַף के साथ infinitive और עוֹד मिलकर किसी कार्य को दोबारा करने का भाव देते हैं। ‘फिर से ... भेजे’ इस इब्रानी मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בָּלָק
  choice: बालाक
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: שָׂרִים
  choice: अधिकारी
  rationale: यह शब्द यहाँ राजकीय हैसियत वाले प्रतिनिधियों के लिए है। ‘अधिकारी’ आधुनिक हिन्दी में स्पष्ट है और ‘राजकुमार’ की अपेक्षा प्रसंग के अधिक अनुकूल है।
- source_word: רַבִּים
  choice: अधिक संख्या में
  rationale: מֵאֵלֶּה के तुलनात्मक प्रयोग के कारण केवल ‘बहुत-से’ नहीं, बल्कि पिछले दल से संख्या में अधिक होने का भाव व्यक्त किया गया है।
- source_word: וְנִכְבָּדִים
  choice: अधिक प्रतिष्ठित
  rationale: כבד से बना यह रूप सामाजिक पद, सम्मान या महत्त्व में ऊँचा होने का संकेत देता है। ‘प्रतिष्ठित’ इस हैसियत-संबंधी अर्थ को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵאֵלֶּה
  choice: पहले आए अधिकारियों से
  rationale: शाब्दिक अर्थ ‘इनसे’ है, पर संकेत पिछले पद में भेजे गए अधिकारियों की ओर है। स्पष्ट हिन्दी के लिए उस संदर्भ को संक्षेप में व्यक्त किया गया है।
