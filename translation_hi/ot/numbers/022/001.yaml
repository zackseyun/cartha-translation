base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/001.yaml
  text: Then the sons of Israel set out and camped in the plains of Moab[c][b][a], beyond the Jordan at Jericho.
translation:
  language: hi
  text: तब इस्राएली चल पड़े और मोआब के मैदानों में, यरदन के पार यरीहो के सामने, पड़ाव डाला।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यरदन के पार” कथाकार की भौगोलिक दृष्टि के सापेक्ष कहा गया है। मोआब के ये मैदान यरदन के पूर्वी ओर, यरीहो के सामने थे।
    reason: geographical_note
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वहाँ से चले
  rationale: נסע पड़ाव उठाकर आगे बढ़ने को दर्शाता है। संदर्भ में ‘वहाँ से चले’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यह पूरे राष्ट्र के लिए प्रचलित सामूहिक पद है; ‘इस्राएली’ सामान्य पाठक के लिए स्वाभाविक और आशय-सटीक है।
- source_word: וַיַּחֲנוּ
  choice: पड़ाव डाला
  rationale: חנה का अर्थ शिविर लगाना या पड़ाव डालना है। यात्रा-वृत्तांत में ‘पड़ाव डाला’ सहज और गरिमापूर्ण है।
- source_word: בְּעַרְבוֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עֲרָבוֹת यहाँ समतल मैदानी अथवा स्तेपी भूभाग को सूचित करता है; ‘मैदानों’ से भौगोलिक अर्थ स्पष्ट रहता है।
- source_word: מֵעֵבֶר לְיַרְדֵּן
  choice: यरदन के पार
  rationale: यह पद वक्ता या कथाकार की भौगोलिक दृष्टि के सापेक्ष यरदन के दूसरे पार का क्षेत्र बताता है; हिन्दी में ‘के पार’ इसकी वास्तविक सापेक्षता बनाए रखता है।
- source_word: יְרֵחוֹ
  choice: यरीहो के सामने
  rationale: खंड के भूगोल में यरीहो सामने स्थित पहचान-चिह्न है। ‘के सामने’ पूर्वी तट पर पड़ाव और यरदन के पश्चिम में यरीहो के संबंध को ‘यरीहो में’ की अपेक्षा अधिक स्पष्ट और सटीक बनाता है।
