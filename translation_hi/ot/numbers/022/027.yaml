source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אָתוֹן֙ אֶת מַלְאַ֣ךְ יְהוָ֔ה וַ/תִּרְבַּ֖ץ תַּ֣חַת בִּלְעָ֑ם וַ/יִּֽחַר אַ֣ף בִּלְעָ֔ם וַ/יַּ֥ךְ אֶת הָ/אָת֖וֹן בַּ/מַּקֵּֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/027.yaml
  text: When the donkey saw the angel of Yahweh[a], she lay down under Balaam[b]. Then Balaam became angry and struck the donkey with his staff.
translation:
  language: hi
  text: जब गधी ने याहवे के दूत को देखा, तो वह बिलाम के नीचे लेट गई। तब बिलाम का क्रोध भड़क उठा, और उसने गधी को अपनी लाठी से मारा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאָתוֹן
  choice: गधी
  rationale: אָתוֹן विशेष रूप से मादा गधे को दर्शाता है। हिंदी में ‘गधी’ स्वाभाविक और सटीक है तथा मूल का स्त्रीलिंग स्पष्ट रखता है।
- source_word: מַלְאַךְ יְהוָה
  choice: यहोवा का दूत
  rationale: מַלְאָךְ का अर्थ ‘दूत’ हो सकता है; प्रसंग से यह अलौकिक दूत है। हिंदी बाइबलीय भाषा में ‘यहोवा का दूत’ स्वाभाविक है और शब्द की मूल दूत-संबंधी धारणा भी बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַתִּרְבַּץ
  choice: बैठ गई
  rationale: רבץ का अर्थ लेटना या नीचे दुबकना है। सवार के नीचे पशु के जमीन पर बैठ जाने के दृश्य के लिए आधुनिक हिंदी में ‘बैठ गई’ सबसे स्वाभाविक है, बिना क्रिया को ‘गिर पड़ी’ बनाकर तीव्र किए।
- source_word: תַּחַת בִּלְעָם
  choice: बिलाम के नीचे
  rationale: תַּחַת का सीधा अर्थ ‘नीचे’ है; यहाँ बिलाम गधी पर सवार है, इसलिए यह अभिव्यक्ति मूल चित्र को बनाए रखती है।
- source_word: וַיִּחַר אַף בִּלְעָם
  choice: बिलाम का क्रोध भड़क उठा
  rationale: इब्रानी मुहावरा शाब्दिक रूप से क्रोध के जलने को व्यक्त करता है। ‘क्रोध भड़क उठा’ हिंदी में स्वाभाविक रहते हुए उस तीव्र चित्र को बनाए रखता है।
- source_word: וַיַּךְ
  choice: मारा
  rationale: נכה प्रहार करने की व्यापक क्रिया है। एक क्रिया के इस प्रसंग में ‘मारा’ स्पष्ट और सहज है तथा बार-बार पीटने का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: בַּמַּקֵּל
  choice: अपनी लाठी से
  rationale: מַקֵּל लाठी या डंडे को दर्शाता है। यात्री के प्रसंग में ‘लाठी’ उपयुक्त है; ‘अपनी’ संदर्भ से निहित संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिंदी के सामान्य पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘याहवे’ स्रोत उच्चारण के अधिक निकट एक संभव विकल्प है।
- issue: מַלְאַךְ को दूत या स्वर्गदूत कहना
  choice: दूत
  alternative: स्वर्गदूत
  rationale: प्रसंग अलौकिक सत्ता को स्पष्ट करता है, पर मूल शब्द का बुनियादी अर्थ ‘दूत’ है। ‘यहोवा का दूत’ मूल की शब्दगत व्यापकता और परिचित बाइबलीय पदबंध दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त और कथात्मक शैली। भाषा साधारण पाठक के लिए सहज है, पर ‘क्रोध भड़क उठा’ जैसे पद से मूल इब्रानी मुहावरे की जीवंतता सुरक्षित रखी गई है।
