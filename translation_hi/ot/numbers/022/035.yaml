reference: Numbers 22:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֩ מַלְאַ֨ךְ יְהוָ֜ה אֶל בִּלְעָ֗ם לֵ֚ךְ עִם הָ֣/אֲנָשִׁ֔ים וְ/אֶ֗פֶס אֶת הַ/דָּבָ֛ר אֲשֶׁר אֲדַבֵּ֥ר אֵלֶ֖י/ךָ אֹת֣/וֹ תְדַבֵּ֑ר וַ/יֵּ֥לֶךְ בִּלְעָ֖ם עִם שָׂרֵ֥י בָלָֽק־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/035.yaml
  text: Then the angel of Yahweh said to Balaam[a], “Go with the men, but only the word that I speak to you[c][b], that you shall speak.” So Balaam went with the officials of Balak.
translation:
  language: hi
  text: तब याहवे के स्वर्गदूत[a] ने बिलाम से कहा, “उन पुरुषों के साथ जा; पर जो वचन[b] मैं तुझसे कहूँ, वही तू कहना।” तब बिलाम बालाक के अधिकारियों[c] के साथ चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे का दूत।”
    reason: מַלְאָךְ का मूल अर्थ ‘दूत/संदेशवाहक’ है, जबकि प्रसंग में यह अलौकिक दूत है।
  - marker: b
    text: इब्रानी में “वचन”; “बात” या “संदेश” भी संभव है।
    reason: דָּבָר के अर्थ-क्षेत्र में वचन, बात, विषय और संदेश शामिल हैं।
  - marker: c
    text: या, “बालाक के सरदारों के साथ।”
    reason: שָׂרִים पदाधिकारियों, शासकों या सरदारों के लिए प्रयुक्त हो सकता है।
lexical_decisions:
- source_word: מַלְאַךְ יְהוָה
  choice: याहवे का स्वर्गदूत
  rationale: מַלְאַךְ का अर्थ ‘दूत’ या ‘स्वर्गदूत’ हो सकता है। इस प्रसंग में अलौकिक प्राणी अभिप्रेत है, इसलिए मुख्य पाठ में ‘स्वर्गदूत’ स्वाभाविक है; व्यापक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से प्रतिस्थापित करने के बजाय हिंदी में ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: לֵךְ עִם הָאֲנָשִׁים
  choice: इन पुरुषों के साथ जा
  rationale: आज्ञार्थक क्रिया और पुरुषवाचक बहुवचन को स्पष्ट रखा गया है। प्रसंग में सामने उपस्थित दल के कारण ‘इन’ स्वाभाविक हिंदी है।
- source_word: וְאֶפֶס
  choice: पर
  rationale: यह अनुमति के बाद कठोर सीमा लगाता है; हिंदी में ‘पर’ अगले ‘वही’ के साथ उस प्रतिबंध को सहज ढंग से व्यक्त करता है।
- source_word: הַדָּבָר
  choice: वचन
  rationale: דָּבָר के ‘बात’, ‘संदेश’ और ‘वचन’ अर्थ संभव हैं। बोलने के प्रसंग और דבר धातु की पुनरावृत्ति के कारण ‘वचन’ उपयुक्त है।
- source_word: אֲדַבֵּר אֵלֶיךָ אֹתוֹ תְדַבֵּר
  choice: जो वचन मैं तुझसे कहूँ, वही तू कहना
  rationale: आगे रखे गए אֹתוֹ का बल ‘वही’ से सुरक्षित है। इससे बिलाम को केवल दिए गए वचन को बोलने की सीमा स्पष्ट होती है, बिना अलग से ‘अवश्य’ जोड़ने के।
- source_word: שָׂרֵי בָלָק
  choice: बालाक के अधिकारी
  rationale: שָׂרִים शासकीय पदाधिकारियों या सरदारों को सूचित करता है। ‘अधिकारी’ आधुनिक हिंदी में राजनयिक दल के लिए स्वाभाविक है और राजपुत्र होने का अनावश्यक अर्थ नहीं देता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: बिलाम को दिए निर्देश की विशिष्टता
  choice: ‘वही तू कहना’
  alternative: ‘तू केवल वही कहना’
  rationale: दोनों रूप प्रतिबंध व्यक्त करते हैं; चुना गया रूप אֹתוֹ की अग्रस्थ बलाघातपूर्ण स्थिति को सहज हिंदी में सुरक्षित रखता है और मूल में निहित आदेश से अधिक अलग अनिवार्यता नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी। प्रत्यक्ष संबोधन में एकवचन ‘तू’ बाइबिलीय संवाद की निकटता और मूल के एकवचन रूप को रखता है। वाक्य में ‘वही’ मूल के बल और प्रतिबंध को स्पष्ट करता है।
