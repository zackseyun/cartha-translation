source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר בָּלָ֜ק אֶל בִּלְעָ֗ם הֲ/לֹא֩ שָׁלֹ֨חַ שָׁלַ֤חְתִּי אֵלֶ֨י/ךָ֙ לִ/קְרֹא לָ֔/ךְ לָ֥/מָּה לֹא הָלַ֖כְתָּ אֵלָ֑/י הַֽ/אֻמְנָ֔ם לֹ֥א אוּכַ֖ל כַּבְּדֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/037.yaml
  text: And Balak said to Balaam[c][b][a], “Did I not indeed send to you to call you? Why did you not come to me? Am I really not able to honor you?”
translation:
  language: hi
  text: तब बालाक ने बिलाम से कहा, “क्या मैंने तुम्हें बुलाने के लिए तुम्हारे पास निश्चय ही संदेश नहीं भेजा था?[a] तुम मेरे पास क्यों नहीं आए?[b] क्या मैं सचमुच तुम्हारा सम्मान करने में समर्थ नहीं हूँ?”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्या मैंने तुम्हारे पास बार-बार संदेश नहीं भेजा था?” हिब्रू में क्रिया के साथ उसी धातु का क्रियार्थक रूप जोड़कर जोर दिया गया है; प्रसंग के अनुसार इसे निश्चित, आग्रहपूर्ण या बार-बार भेजने के अर्थ में समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तुम मेरे पास क्यों नहीं गए?”
    reason: lexical_alternative
  - marker: c
    text: “सम्मान करने” में पुरस्कार देना या ऊँचा पद अथवा प्रतिष्ठा प्रदान करना भी शामिल हो सकता है; इसका अर्थ केवल आदर दिखाना नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक वय्यिक्तोल को स्वाभाविक हिन्दी कथा-प्रवाह में व्यक्त करता है; ‘तब’ प्रसंग का क्रम दिखाता है, बिना अतिरिक्त कारण-संबंध जोड़े।
- source_word: הֲלֹא
  choice: क्या ... नहीं
  rationale: नकारात्मक आलंकारिक प्रश्न है, जो सकारात्मक उत्तर की अपेक्षा करता है; हिन्दी में यही संरचना उसका बल बनाए रखती है।
- source_word: שָׁלֹחַ שָׁלַחְתִּי
  choice: निश्चय ही संदेश ... भेजा था
  rationale: इनफिनिटिव एब्सोल्यूट और सीमित क्रिया का मेल क्रिया पर जोर देता है। ‘निश्चय ही’ उस जोर को रखता है, पर ‘बार-बार’ या ‘तुरंत’ जैसी संदर्भगत व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- source_word: לִקְרֹא לָךְ
  choice: तुम्हें बुलाने के लिए
  rationale: इस प्रसंग में קרא का अर्थ किसी को अपने पास बुलाना या समन करना है; यह सरल और स्वाभाविक आधुनिक हिन्दी है।
- source_word: לָמָּה לֹא הָלַכְתָּ אֵלָי
  choice: तुम मेरे पास क्यों नहीं आए?
  rationale: הלך का मूल अर्थ ‘जाना’ है, पर वक्ता की ओर गति को हिन्दी में स्वाभाविक रूप से ‘मेरे पास आना’ कहा जाता है।
- source_word: הַאֻמְנָם
  choice: सचमुच
  rationale: यह प्रश्न में जोर और अविश्वास व्यक्त करता है; ‘सचमुच’ बालाक की आहत और चुनौतीपूर्ण मुद्रा को स्वाभाविक ढंग से प्रकट करता है।
- source_word: לֹא אוּכַל כַּבְּדֶךָ
  choice: क्या मैं ... तुम्हारा सम्मान करने में समर्थ नहीं हूँ?
  rationale: יכל सामर्थ्य और כבד सम्मान प्रदान करने को व्यक्त करते हैं। यह रूप मूल की व्यापकता बनाए रखता है, जिसमें प्रतिष्ठा और पुरस्कार दोनों निहित हो सकते हैं।
