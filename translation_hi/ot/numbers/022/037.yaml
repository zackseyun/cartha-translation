  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। संबोधन में प्रसंगानुकूल ‘तुम’ रखा गया है। ‘संदेश भेजा’ हिन्दी में दूत भेजकर बुलाने की क्रिया को स्वाभाविक बनाता है। सभी पादटिप्पणी-चिह्न संबंधित वाक्यांशों के बाद रखे गए हैं।
