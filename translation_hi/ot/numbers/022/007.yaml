base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/007.yaml
  text: So the elders of Moab and the elders of Midian went[a], with divination fees in their hands, and they came to Balaam and spoke to him the words of Balak.
translation:
  language: hi
  text: तब मोआब और मिद्यान के बुज़ुर्ग अपने हाथों में शकुन-विचार की फीस लिए हुए गए। वे बिलाम के पास आए और उससे बालाक की बातें कहीं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זִקְנֵי
  choice: पुरनिए
  rationale: यह शब्द संबंधित समुदाय के मान्य वरिष्ठ अगुओं को दर्शाता है; ‘पुरनिए’ सामाजिक और नेतृत्वकारी भूमिका दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וּקְסָמִים בְּיָדָם
  choice: भावी जानने की दक्षिणा हाथ में लेकर
  rationale: קְסָמִים मूलतः भावी जानने/शकुन-विचार से संबंधित है और प्रसंग में संभवतः बिलाम की सेवा के लिए लाई गई दक्षिणा को लक्षणा से दर्शाता है। ‘दक्षिणा’ धार्मिक-व्यावसायिक सेवा के प्रतिफल का स्वाभाविक हिंदी संकेत देती है।
- source_word: וַיָּבֹאוּ אֶל
  choice: वे ... के पास आए
  rationale: בוא אֶל का सीधा अर्थ किसी के पास आना या पहुँचना है; पूर्ववर्ती ‘चल पड़े’ के बाद यह घटनाक्रम को स्पष्ट रखता है।
- source_word: וַיְדַבְּרוּ אֵלָיו
  choice: उससे ... बातें कहीं
  rationale: דבר אֶל किसी से बोलने को दर्शाता है; हिंदी में अगली संज्ञा ‘बातें’ के साथ यह रूप सहज है।
- source_word: דִּבְרֵי בָלָק
  choice: बालाक की बातें
  rationale: शाब्दिक संरचना को बनाए रखता है और इसे केवल सारांशित ‘संदेश’ मानकर अर्थ को सीमित नहीं करता।
- source_word: וַיֵּלְכוּ
  choice: तब ... चल पड़े
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिंदी में क्रम और पिछले प्रसंग से संबंध को सहज रूप से प्रकट करता है।
