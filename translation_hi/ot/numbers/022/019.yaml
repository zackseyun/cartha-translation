id: NUM.22.19
reference: Numbers 22:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁב֨וּ נָ֥א בָ/זֶ֛ה גַּם אַתֶּ֖ם הַ/לָּ֑יְלָה וְ/אֵ֣דְעָ֔ה מַה יֹּסֵ֥ף יְהוָ֖ה דַּבֵּ֥ר עִמִּֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/019.yaml
  text: Now please stay here tonight[a], you also, so that I may know what more Yahweh will say to me.
translation:
  language: hi
  text: अब आप भी कृपया आज रात यहीं ठहरिए, ताकि मैं जानूँ कि यहोवा मुझसे और क्या कहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह अगले निर्देश की ओर ले जाने वाला वार्तालाप-सूचक है; आधुनिक हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: שְׁבוּ נָא
  choice: कृपया ... ठहरिए
  rationale: यहाँ ישׁב का अर्थ शाब्दिक रूप से ‘बैठना’ नहीं, बल्कि किसी स्थान पर ठहरना है; נָא विनम्र अनुरोध व्यक्त करता है।
- source_word: בָזֶה
  choice: यहीं
  rationale: संदर्भ में यह स्थानवाचक है; ‘यहीं’ संक्षिप्त और स्वाभाविक है।
- source_word: גַּם אַתֶּם
  choice: आप भी
  rationale: यह पिछले दूतमंडल की तरह इन दूतों के भी ठहरने का योगात्मक बल बनाए रखता है।
- source_word: הַלָּיְלָה
  choice: आज रात
  rationale: यह आने वाली रात को सूचित करने वाला कालवाचक प्रयोग है।
- source_word: וְאֵדְעָה
  choice: ताकि मैं जानूँ
  rationale: कोहोर्टेटिव रूप उनके ठहरने से जुड़ा प्रयोजन व्यक्त करता है।
- source_word: מַה יֹּסֵף
  choice: और क्या
  rationale: יסף का प्रयोग अतिरिक्त या आगे की बात का भाव देता है; ‘और क्या’ इस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित व्यक्तिगत नाम ‘यहोवा’ टेट्राग्राम को किसी उपाधि से बदले बिना प्रस्तुत करता है।
- source_word: דַּבֵּר עִמִּי
  choice: मुझसे ... कहता है
  rationale: संदर्भ में बल उस अतिरिक्त संदेश पर है जो परमेश्वर बिलाम को बताएगा; हिन्दी में यह प्रयोग स्वाभाविक है और עִמִּי के संबंधात्मक भाव को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम सीधे आया है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी पाठकों के लिए ‘यहोवा’ अधिक पहचाना हुआ रूप है, यद्यपि ‘याहवे’ संभावित उच्चारण के अधिक निकट माना जाता है।
- issue: बिलाम की अपेक्षा में अतिरिक्त प्रकाशन का भाव
  choice: और क्या कहता है
  alternative: आगे मुझसे क्या कहेगा
  rationale: מַה יֹּסֵף में अतिरिक्त कथन का भाव है। अनुवाद बिलाम की मनोवृत्ति का धर्मशास्त्रीय मूल्यांकन जोड़े बिना वही खुला भाव रखता है।
translation_notes:
  register: भाषा आधुनिक, विनम्र और गरिमापूर्ण रखी गई है। बहुवचन आदरसूचक आदेश के लिए ‘ठहरिए’ और संबोधन के लिए ‘आप’ प्रयुक्त हुआ है। किसी पाद-टिप्पणी की आवश्यकता नहीं समझी गई।
