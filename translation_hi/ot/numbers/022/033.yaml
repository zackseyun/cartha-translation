source:
  edition: WLC
  text: וַ/תִּרְאַ֨/נִי֙ הָֽ/אָת֔וֹן וַ/תֵּ֣ט לְ/פָנַ֔/י זֶ֖ה שָׁלֹ֣שׁ רְגָלִ֑ים אוּלַי֙ נָטְתָ֣ה מִ/פָּנַ֔/י כִּ֥י עַתָּ֛ה גַּם אֹתְ/כָ֥ה הָרַ֖גְתִּי וְ/אוֹתָ֥/הּ הֶחֱיֵֽיתִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/033.yaml
  text: The donkey saw me and turned aside before me these three times. If she had not turned aside from before me[a], surely by now I would have killed you and let her live.
translation:
  language: hi
  text: गदही ने मुझे देखा और इन तीनों बार मेरे सामने मुड़ गई। यदि वह मेरे सामने से न हटी होती[a], तो निश्चय ही अब तक मैं तुझे मार डालता और उसे जीवित छोड़ देता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से, “शायद वह मेरे सामने से हट गई।” प्रसंग और अगले कथन के कारण इसे सामान्यतः प्रतितथ्यात्मक अर्थ में समझा जाता है: “यदि वह मेरे सामने से न हटी होती।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּרְאַנִי
  choice: मुझे देखा
  rationale: ראה यहाँ प्रत्यक्ष रूप से देखने को व्यक्त करता है; सरल और स्वाभाविक हिन्दी।
- source_word: הָאָתוֹן
  choice: गदही
  rationale: אָתוֹן विशेष रूप से मादा गधे को सूचित करता है; हिन्दी में ‘गदही’ संक्षिप्त और स्वाभाविक है।
- source_word: וַתֵּט לְפָנַי
  choice: मेरे सामने से हट गई
  rationale: נטה का भाव रास्ते से मुड़ने या हटने का है; यह चयन स्वर्गदूत के सामने उपस्थित होने और गदही के उससे बचकर हटने, दोनों को स्पष्ट करता है।
- source_word: זֶה שָׁלֹשׁ רְגָלִים
  choice: इन तीनों बार
  rationale: यहाँ רְגָלִים अवसरों की गणना करने वाला मुहावरा है; ‘इन तीनों बार’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: אוּלַי נָטְתָה מִפָּנַי
  choice: यदि वह मेरे सामने से न हटी होती
  rationale: मसोरेटिक पाठ में אוּלַי सामान्यतः ‘शायद’ है और स्पष्ट निषेध नहीं है, पर प्रसंग तथा परिणाम-वाक्य इसे प्रतितथ्यात्मक शर्त के रूप में समझने की माँग करते हैं; इस पाठगत तनाव को पादटिप्पणी में रखा गया है।
- source_word: כִּי עַתָּה גַּם אֹתְךָה הָרַגְתִּי
  choice: तो निश्चय ही अब तक मैं तुझे मार डालता
  rationale: पूर्ण क्रिया प्रतितथ्यात्मक परिणाम दर्शाती है। גם का बल ‘तुझे’ पर है और ‘निश्चय ही’ कथन की प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֹתָהּ הֶחֱיֵיתִי
  choice: और उसे जीवित छोड़ देता
  rationale: חיה के हिफ़ईल रूप का अर्थ जीवित रखना या जीवित छोड़ देना है; यह बिलाम को मारने के विपरीत परिणाम को साफ रखता है।
theological_decisions:
- issue: אוּלַי के बाद स्पष्ट निषेध न होने पर प्रतितथ्यात्मक अर्थ
  choice: मुख्य पाठ में ‘यदि वह ... न हटी होती’
  alternative: शाब्दिक रूप से ‘शायद वह मेरे सामने से हट गई’
  rationale: कथा के अनुसार गदही के हटने ने बिलाम की जान बचाई; इसलिए अगले कथन के साथ सुसंगत अर्थ प्रतितथ्यात्मक और नकारात्मक है। फिर भी इब्रानी की वास्तविक अभिव्यक्ति और उसकी कठिनाई को पादटिप्पणी में स्पष्ट किया गया है, ताकि अस्पष्टता छिपे नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘तुझे’ एकवचन संबोधन और मूल के प्रत्यक्ष, तीखे स्वर को बनाए रखता है। ‘गदही’ द्वारा मूल में निहित स्त्रीलिंग स्पष्ट किया गया है।
