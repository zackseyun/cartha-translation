  text: וַ/יְהִ֣י בַ/בֹּ֔קֶר וַ/יִּקַּ֤ח בָּלָק֙ אֶת בִּלְעָ֔ם וַֽ/יַּעֲלֵ֖/הוּ בָּמ֣וֹת בָּ֑עַל וַ/יַּ֥רְא מִ/שָּׁ֖ם קְצֵ֥ה הָ/עָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/022/041.yaml
  text: And in the morning Balak took Balaam and brought him up to Bamoth-baal[b][a], and from there he saw the edge of the people.
translation:
  language: hi
  text: सुबह हुई तो बालाक बिलाम को अपने साथ ले गया और उसे बामोत-बाल[a] पर चढ़ा ले गया। वहाँ से उसने लोगों का बाहरी भाग[b] देखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाल के ऊँचे स्थानों पर,” यदि इसे स्थान-नाम के बजाय वर्णनात्मक पद माना जाए।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वहाँ से इस्राएल के लोगों का केवल सबसे बाहरी भाग दिखाई देता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: सुबह हुई तो
  rationale: यह इब्रानी कथात्मक सूत्र अगले घटनाक्रम की सुबह का समय बताता है। ‘सुबह हुई तो’ स्वाभाविक हिन्दी में काल और कथा-क्रम दोनों को बनाए रखता है।
- source_word: וַיִּקַּח
  choice: अपने साथ ले गया
  rationale: לקח का मूल अर्थ ‘लेना’ है; यहाँ बालाक बिलाम को दूसरी जगह साथ ले जाता है, इसलिए यह प्रयोग संदर्भानुकूल और स्पष्ट है।
- source_word: וַיַּעֲלֵהוּ
  choice: उसे ... पर चढ़ा ले गया
  rationale: עלה के हिफ़ईल रूप में ऊपर ले जाने का कारक भाव है। यह चयन ऊँचे स्थान की ओर चढ़ाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּמוֹת בָּעַל
  choice: बामोत-बाल
  rationale: संदर्भ में यह पद स्थान-नाम के रूप में प्रयुक्त है, इसलिए इसका अर्थानुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है। वर्णनात्मक अर्थ की संभावना पादटिप्पणी में रखी गई है।
- source_word: וַיַּרְא
  choice: उसने ... देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है। ‘उसने’ इब्रानी में निहित कर्ता को व्यक्त करता है, पर बालाक और बिलाम में से उसकी पहचान को हिन्दी मुख्य पाठ में अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह उस स्थान या दृष्टिबिंदु को सीधे और स्वाभाविक रूप से बताता है जहाँ से लोगों को देखा गया।
- source_word: קְצֵה הָעָם
  choice: लोगों का छोर
  rationale: קצה का अर्थ अंत, किनारा या छोर है। मूल पाठ ‘लोगों’ कहता है, ‘छावनी’ नहीं; इसलिए ‘लोगों का छोर’ स्रोत की संक्षिप्तता और दृश्य की सीमितता दोनों बनाए रखता है।
