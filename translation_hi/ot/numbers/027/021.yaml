base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/021.yaml
  text: And he shall stand before Eleazar the priest[a], who shall inquire for him by the judgment of the Urim before Yahweh. At his command they shall go out, and at his command they shall come in—he and all the sons of Israel with him[b], even all the congregation.
translation:
  language: hi
  text: वह एलीआज़ार याजक के सामने खड़ा होगा, और एलीआज़ार उसके लिए याहवे के सामने ऊरीम के निर्णय[a] के अनुसार परामर्श लेगा। उसके आदेश पर वे बाहर निकलेंगे और उसके आदेश पर भीतर आएँगे—वह और उसके साथ इस्राएल के सभी पुत्र[b], अर्थात् पूरी मंडली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऊरीम के न्याय-निर्णय के अनुसार।” यह वाक्यांश ऊरीम के माध्यम से याहवे के सामने की जानेवाली याजकीय पूछताछ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “इस्राएल के पुत्र”; अर्थात् इस्राएली।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִפְנֵי
  choice: के सामने
  rationale: 'यह स्थान और संबंध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है: यहोशू एलीआज़ार के सामने खड़ा होगा, और पूछताछ याहवे के सामने होगी।'
- source_word: יַעֲמֹד
  choice: खड़ा होगा
  rationale: इस नियुक्ति-संदर्भ में अपूर्ण क्रिया का निर्देशात्मक-भावी बल है; यह रूप गरिमापूर्ण और स्पष्ट है।
- source_word: וְשָׁאַל לוֹ
  choice: एलीआज़ार उसके लिए ... पूछताछ करेगा
  rationale: संदर्भ के अनुसार कर्ता एलीआज़ार है और पूछताछ यहोशू की ओर से की जाती है। कर्ता को दोहराने से हिन्दी में अस्पष्ट व्याकरण से बचते हुए अर्थ सुरक्षित रहता है।
- source_word: בְּמִשְׁפַּט הָאוּרִים
  choice: ऊरीम के निर्णय के द्वारा
  rationale: מִשְׁפָּט यहाँ याजकीय पूछताछ से प्राप्त निर्णय अथवा निर्णय-प्रक्रिया का बोध देता है। ‘ऊरीम’ तकनीकी याजकीय पद होने के कारण लिप्यंतरित किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: עַל פִּיו
  choice: उसके आदेश पर
  rationale: शाब्दिक ‘उसके मुँह के अनुसार’ हिन्दी में अस्वाभाविक है; यह मुहावरा अधिकारपूर्ण निर्देश को दर्शाता है। एकवचन सर्वनाम को बनाए रखने से उसके निकटतम संदर्भ की वास्तविक संक्षिप्तता भी बनी रहती है।
- source_word: יֵצְאוּ ... יָבֹאוּ
  choice: बाहर निकलेंगे ... भीतर आएँगे
  rationale: इब्रानी की युग्मित अभिव्यक्ति को निकटता से सुरक्षित रखा गया है; यह सामुदायिक और संभवतः सैनिक आवागमन दोनों को समेट सकती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुत्र
  rationale: मुख्य पाठ में इब्रानी का पुरुषवाचक संबंधसूचक रूप सुरक्षित है; अधिक प्रचलित सामूहिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הָעֵדָה
  choice: पूरी मंडली
  rationale: यह पंचग्रंथ में एकत्रित वाचा-समुदाय के औपचारिक और सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसके आदेश पर’ में सर्वनाम का संदर्भ
  choice: मुख्य पाठ में एकवचन ‘उसके’ को बिना किसी नाम से बदलकर रखा गया है।
  alternative: इसे सीधे एलीआज़ार, यहोशू, अथवा ऊरीम की पूछताछ से प्राप्त ईश्वरीय निर्देश से संबंधित मानकर स्पष्ट किया जा सकता है।
  rationale: इब्रानी में निकटतम संदर्भ संक्षिप्त है। किसी एक पात्र का नाम जोड़ना पाठ की वास्तविक अस्पष्टता और अधिकार के मध्यस्थित क्रम को अनावश्यक रूप से निर्णीत कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। तकनीकी पद ‘ऊरीम’ तथा व्यक्तिगत नाम ‘याहवे’ को लिप्यंतरित किया गया है। इब्रानी मुहावरों को जहाँ संभव था संरक्षित रखा गया, पर अस्वाभाविक शाब्दिक हिन्दी से बचा गया है।
