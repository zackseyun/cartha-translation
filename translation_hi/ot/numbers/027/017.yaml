source:
  edition: WLC
  text: אֲשֶׁר יֵצֵ֣א לִ/פְנֵי/הֶ֗ם וַ/אֲשֶׁ֤ר יָבֹא֙ לִ/פְנֵי/הֶ֔ם וַ/אֲשֶׁ֥ר יוֹצִיאֵ֖/ם וַ/אֲשֶׁ֣ר יְבִיאֵ֑/ם וְ/לֹ֤א תִהְיֶה֙ עֲדַ֣ת יְהוָ֔ה כַּ/צֹּ֕אן אֲשֶׁ֥ר אֵין לָ/הֶ֖ם רֹעֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/017.yaml
  text: who will go out before them and come in before them[a], and who will lead them out and bring them in[c][b], so that the congregation of Yahweh may not be like sheep that have no shepherd.
translation:
  language: hi
  text: जो उनके सामने निकले और उनके सामने आए,[a] और जो उन्हें बाहर ले जाए और भीतर ले आए,[b] ताकि यहोवा की सभा उन भेड़ों के समान न हो जिनका कोई चरवाहा नहीं है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके आगे निकले और उनके आगे आए।”
    reason: לִפְנֵיהֶם का अर्थ ‘उनके सामने’ या ‘उनके आगे’ हो सकता है; दोनों में नेतृत्व का भाव है।
  - marker: b
    text: “निकलना…आना…बाहर ले जाना…भीतर ले आना” व्यापक सार्वजनिक अगुवाई का इब्रानी ढंग है।
    reason: ठोस आवागमन की भाषा के मुहावरेदार नेतृत्व-अर्थ को स्पष्ट करता है, बिना उसे मूल पाठ के स्थान पर रखने के।
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जो
  rationale: यह अपेक्षित अगुवे का वर्णन करने वाला संबंधवाचक पद है; हिंदी में व्यक्ति के लिए ‘जो’ स्वाभाविक है।
- source_word: יֵצֵא לִפְנֵיהֶם
  choice: उनके आगे निकले
  rationale: יצא का मूल अर्थ ‘निकलना’ है और לִפְנֵיהֶם अगुवाई के भाव में ‘उनके आगे’ है।
- source_word: יָבֹא לִפְנֵיהֶם
  choice: उनके आगे लौटे
  rationale: בוא का अर्थ ‘आना/प्रवेश करना’ है; יצא के साथ युग्म और सैन्य-सार्वजनिक नेतृत्व के संदर्भ में ‘लौटे’ स्वाभाविक हिंदी है, जबकि ‘उनके आगे’ मूल पदबंध को बनाए रखता है।
- source_word: יוֹצִיאֵם
  choice: उन्हें बाहर ले जाए
  rationale: יצא का हिफ़ील रूप कारणवाचक है; यह लोगों को बाहर निकालने और उनकी अगुवाई करने का भाव देता है।
- source_word: יְבִיאֵם
  choice: उन्हें भीतर ले आए
  rationale: בוא का हिफ़ील रूप कारणवाचक है और पूर्ववर्ती ‘बाहर ले जाए’ के साथ संतुलित युग्म बनाता है।
- source_word: עֲדַת יְהוָה
  choice: यहोवा की सभा
  rationale: עֵדָה यहाँ इस्राएल के एकत्रित समुदाय को सूचित करता है; ‘सभा’ आधुनिक, स्पष्ट और सामूहिक अर्थ वाला शब्द है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: כַצֹּאן
  choice: भेड़ों के समान
  rationale: सामूहिक एकवचन צֹאן का स्वाभाविक हिंदी रूप बहुवचन ‘भेड़ों’ है और उपमा प्रत्यक्ष रखी गई है।
- source_word: רֹעֶה
  choice: चरवाहा
  rationale: यह झुंड की देखभाल और अगुवाई करने वाले व्यक्ति को दर्शाता है; ‘चरवाहा’ सामान्य और चित्रात्मक हिंदी शब्द है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि ‘प्रभु’ से प्रतिस्थापित न करके हिंदी में परिचित रूप ‘यहोवा’ रखा गया है।
- issue: ‘निकलना…लौटना…बाहर ले जाना…भीतर ले आना’ में अगुवाई का भाव
  choice: ठोस आवागमन-भाषा को बनाए रखा
  alternative: इसका सार केवल ‘उनकी अगुवाई करे’ कहना
  rationale: मूल की गतिशील और व्यापक सार्वजनिक अगुवाई की छवि अंत में आने वाली चरवाहे की उपमा से जुड़ी है; अमूर्त परिभाषा उस साहित्यिक और धर्मवैचारिक तनाव को कम कर देती।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। ‘सभा’, ‘चरवाहा’ और ‘आगे’ जैसे सामान्य शब्द रखे गए हैं। वाक्य की चार समानांतर क्रियाओं और अंतिम चरवाहा-उपमा को सुरक्षित रखा गया है।
