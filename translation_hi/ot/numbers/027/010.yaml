  text: But if he has no brothers[a], then you shall give his inheritance to his father's brothers.
translation:
  language: hi
  text: परन्तु यदि उसके कोई भाई न हों, तो तुम उसकी विरासत उसके पिता के भाइयों[a] को दे देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उसके चाचाओं को।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पद कानूनी क्रम में अगली, विपरीत परिस्थिति प्रस्तुत करता है; ‘परन्तु यदि’ शर्त और क्रमगत विरोध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵין לוֹ
  choice: उसके कोई ... न हों
  rationale: इब्रानी अस्तित्ववाचक निषेध और ל־युक्त सर्वनाम को हिन्दी में स्वाभाविक अधिकारवाचक रचना से व्यक्त किया गया है।
- source_word: אַחִים
  choice: भाई
  rationale: पुल्लिंग बहुवचन का यहाँ उत्तराधिकार-विधि में पुरुष सहोदरों से संबंध है, इसलिए ‘भाई’ सटीक है।
- source_word: וּנְתַתֶּם
  choice: तो तुम ... देना
  rationale: द्वितीय पुरुष बहुवचन में दी गई कानूनी आज्ञा को आधुनिक, सहज हिन्दी में व्यक्त करता है; ‘तो’ शर्त के परिणाम को स्पष्ट करता है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: नחלה यहाँ उत्तराधिकार में मिलने वाली संपत्ति अथवा पैतृक भाग को दर्शाता है; ‘विरासत’ स्पष्ट और प्रचलित है।
- source_word: לַאֲחֵי אָבִיו
  choice: उसके पिता के भाइयों
  rationale: यह चयन इब्रानी संबंधसूचक संरचना ‘उसके पिता के भाइयों’ को निकटता से सुरक्षित रखता है; अधिक मुहावरेदार अर्थ फुटनोट में दिया गया है।
theological_decisions: []
