  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण कानूनी लहजा अपनाया गया है। ‘पिता के भाइयों’ से मूल की पारिवारिक संरचना सुरक्षित रहती है, जबकि फुटनोट में सामान्य हिन्दी संबंध-संज्ञा स्पष्ट की गई है।
