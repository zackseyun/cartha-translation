source:
  edition: WLC
  text: כֵּ֗ן בְּנ֣וֹת צְלָפְחָד֮ דֹּבְרֹת֒ נָתֹ֨ן תִּתֵּ֤ן לָ/הֶם֙ אֲחֻזַּ֣ת נַחֲלָ֔ה בְּ/ת֖וֹךְ אֲחֵ֣י אֲבִי/הֶ֑ם וְ/הַֽעֲבַרְתָּ֛ אֶת נַחֲלַ֥ת אֲבִי/הֶ֖ן לָ/הֶֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/007.yaml
  text: The daughters of Zelophehad are right[a]. You must surely give them a hereditary possession among their father's brothers[b], and you shall transfer their father's inheritance to them.
translation:
  language: hi
  text: सलोफ़हाद की बेटियाँ ठीक कह रही हैं[a]। तुम उन्हें उनके पिता के भाइयों के बीच अवश्य ही विरासत की संपत्ति देना[b], और उनके पिता की विरासत उन्हें सौंप देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “सलोफ़हाद की बेटियाँ ठीक बोल रही हैं।”
    reason: lexical_alternative
  - marker: b
    text: इस स्थान पर इब्रानी पाठ में “उन्हें” के साथ पुल्लिंग बहुवचन प्रत्यय है, यद्यपि प्रसंग में उसका संदर्भ सलोफ़हाद की बेटियों से है। हिन्दी में “उन्हें” दोनों लिंगों के लिए समान रूप है।
    reason: textual_variant
lexical_decisions:
- source_word: כֵּן ... דֹּבְרֹת
  choice: ठीक कह रही हैं
  rationale: यह न्यायिक प्रसंग में बेटियों के दावे को सही ठहराता है। हिन्दी में यह अभिव्यक्ति स्वाभाविक भी है और इब्रानी के बोलने-संबंधी रूप को बनाए रखती है।
- source_word: נָתֹן תִּתֵּן
  choice: अवश्य ही ... देना
  rationale: क्रिया के साथ infinitive absolute आज्ञा पर विशेष बल देता है; ‘अवश्य ही’ उस तीव्रता को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לָהֶם
  choice: उन्हें
  rationale: मसोरेटी स्वरांकन में प्रत्यय पुल्लिंग बहुवचन है, पर प्रसंग का स्पष्ट संदर्भ सलोफ़हाद की बेटियाँ हैं; हिन्दी का ‘उन्हें’ लिंग-निरपेक्ष रहते हुए संदर्भ को ठीक व्यक्त करता है।
- source_word: אֲחֻזַּת נַחֲלָה
  choice: विरासत की संपत्ति
  rationale: यह पदबंध अधिकार में रखी भूमि और उत्तराधिकार, दोनों धारणाओं को जोड़ता है; चुनी हुई हिन्दी सामान्य पाठक के लिए स्पष्ट और कानूनी प्रसंग के अनुकूल है।
- source_word: בְּתוֹךְ אֲחֵי אֲבִיהֶם
  choice: उनके पिता के भाइयों के बीच
  rationale: यह पिता के भाइयों के कुलगत भू-भाग के भीतर बेटियों को हिस्सा दिए जाने का स्थान बताता है और इब्रानी संरचना को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְהַעֲבַרְתָּ
  choice: सौंप देना
  rationale: यहाँ हिफ़ील रूप विरासत को बेटियों के अधिकार में पहुँचाने की कानूनी कार्रवाई व्यक्त करता है। ‘सौंप देना’ आधुनिक हिन्दी में अधिकार के हस्तांतरण को स्पष्ट करता है।
- source_word: נַחֲלַת אֲבִיהֶן
  choice: उनके पिता की विरासत
  rationale: यह उनके मृत पिता से संबंधित उत्तराधिकार को सीधे और स्पष्ट रूप से व्यक्त करता है।
