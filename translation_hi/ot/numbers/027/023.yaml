- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक अर्थ 'मूसा के हाथ से' है; यहाँ यह माध्यम अथवा प्रतिनिधि के द्वारा बोलने का इब्रानी मुहावरा है, जिसे स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
