  choice: उसे दायित्व सौंपा
  alternative: उसे आज्ञा दी / उसे निर्देश दिया
  rationale: निकट प्रसंग सार्वजनिक नेतृत्व-स्थापन का है। 'दायित्व सौंपा' उस औपचारिक कार्य को स्पष्ट करता है, पर किसी बाद की कलीसियाई अभिषेक-पद्धति को पाठ में नहीं जोड़ता; पादटिप्पणी क्रिया की वास्तविक अर्थ-सीमा बताती है।
- issue: בְּיַד מֹשֶׁה में मध्यस्थता का मुहावरा
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: यह मूसा को यहोवा के माध्यम के रूप में दिखाता है और हिन्दी में गलत शारीरिक अर्थ से बचाता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण शैली रखी गई है। वाक्य में मूसा का नाम स्पष्ट किया गया है ताकि स्वतंत्र पद के रूप में सर्वनाम अस्पष्ट न हो। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के तुरंत बाद दिए गए हैं।
