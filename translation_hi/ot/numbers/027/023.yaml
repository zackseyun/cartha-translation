  text: And he laid his hands on him and commanded him[b][a], just as Yahweh had spoken by the hand of Moses.
translation:
  language: hi
  text: मूसा ने अपने हाथ उस पर रखे और उसे आज्ञा दी[a], जैसा यहोवा ने मूसा के द्वारा कहा था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे निर्देश दिया” अथवा “उसे औपचारिक रूप से दायित्व सौंपा।” इब्रानी क्रिया का मूल अर्थ आज्ञा देना है; यहोशू की नियुक्ति के इस प्रसंग में इसमें औपचारिक निर्देश या दायित्व सौंपने की अर्थ-छाया भी हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मूसा के हाथ से”; यह इब्रानी मुहावरा बताता है कि यहोवा ने मूसा के माध्यम से कहा था।
    reason: lexical_alternative
