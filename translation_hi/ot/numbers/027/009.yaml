  text: And if he has no daughter, then you shall give his inheritance to his brothers.
translation:
  language: hi
  text: और यदि उसकी कोई बेटी न हो, तो उसकी विरासत उसके भाइयों को दे देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִם
  choice: और यदि
  rationale: यह कानूनी क्रम में अगली शर्त प्रस्तुत करता है; ‘और यदि’ संयोजक וְ और शर्तसूचक אִם दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֵין ל/וֹ בַּת
  choice: उसकी कोई बेटी न हो
  rationale: हिब्रू का अस्तित्वसूचक प्रयोग לְ के साथ स्वामित्व व्यक्त करता है। हिंदी में यह संरचना स्पष्ट और स्वाभाविक है तथा एक भी बेटी न होने का भाव देती है।
- source_word: וּ/נְתַתֶּם
  choice: तो ... दे देना
  rationale: ‘तो’ शर्त के परिणाम को स्पष्ट करता है। ‘दे देना’ बहुवचन संबोधन वाले कानूनी निर्देश को आधुनिक, सुबोध हिंदी में व्यक्त करता है।
- source_word: נַחֲלָת/וֹ
  choice: उसकी विरासत
  rationale: यहाँ נַחֲלָה मृत व्यक्ति की पैतृक संपत्ति अथवा उत्तराधिकार में मिलने वाली मिल्कियत को सूचित करता है; ‘विरासत’ कानूनी संदर्भ में संक्षिप्त और स्वाभाविक है।
- source_word: לְ/אֶחָי/ו
  choice: उसके भाइयों को
  rationale: हिब्रू शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और इस उत्तराधिकार-विधान में अगले पुरुष उत्तराधिकारियों को दर्शाता है।
