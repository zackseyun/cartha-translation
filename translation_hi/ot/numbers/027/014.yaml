source:
  edition: WLC
  text: כַּ/אֲשֶׁר֩ מְרִיתֶ֨ם פִּ֜/י בְּ/מִדְבַּר צִ֗ן בִּ/מְרִיבַת֙ הָֽ/עֵדָ֔ה לְ/הַקְדִּישֵׁ֥/נִי בַ/מַּ֖יִם לְ/עֵינֵי/הֶ֑ם הֵ֛ם מֵֽי מְרִיבַ֥ת קָדֵ֖שׁ מִדְבַּר צִֽן־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/014.yaml
  text: because you rebelled against my command in the wilderness of Zin[a], in the strife of the congregation, by not treating me as holy at the waters before their eyes[b]. These are the waters of Meribath-kadesh in the wilderness of Zin.
translation:
  language: hi
  text: क्योंकि सीन के निर्जन प्रदेश में, समुदाय के विवाद के समय, तुमने मेरी आज्ञा के विरुद्ध विद्रोह किया था और जल के पास उनकी आँखों के सामने मुझे पवित्र नहीं ठहराया था[a]। ये सीन के निर्जन प्रदेश में मरीबत-कादेश[b] के जल हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘मुझे पवित्र ठहराने के लिए।’ इब्रानी क्रियारूप सकारात्मक है, किंतु संदर्भ से स्पष्ट है कि मूसा और हारून ऐसा करने में असफल रहे।
    reason: lexical_alternative
  - marker: b
    text: ‘मरीबत-कादेश’ का अनुवाद ‘कादेश की मरीबा’ अथवा अधिक शाब्दिक रूप से ‘कादेश का विवाद’ भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: क्योंकि
  rationale: यह पद मूसा और हारून को देश में प्रवेश न मिलने का कारण बताता है; इसलिए प्रसंग में कारणसूचक अनुवाद स्वाभाविक है।
- source_word: מְרִיתֶם פִּי
  choice: तुमने मेरी आज्ञा का विरोध किया
  rationale: शाब्दिक रूप से 'मेरे मुँह का विरोध किया'; यह इब्रानी मुहावरा परमेश्वर की कही आज्ञा की अवज्ञा या उसके विरुद्ध विद्रोह करने को दर्शाता है।
- source_word: בְּמִדְבַּר צִן
  choice: सीन के निर्जन प्रदेश में
  rationale: מִדְבָּר अनिवार्यतः रेतीला मरुस्थल नहीं, बल्कि निर्जन भूभाग भी हो सकता है; 'निर्जन प्रदेश' आधुनिक हिंदी में अर्थ स्पष्ट रखता है।
- source_word: בִּמְרִיבַת הָעֵדָה
  choice: जब समुदाय ने झगड़ा किया
  rationale: संज्ञात्मक इब्रानी पदबंध को स्वाभाविक हिंदी उपवाक्य में व्यक्त किया गया है; עֵדָה के लिए 'समुदाय' सामूहिक अर्थ सुरक्षित रखता है।
- source_word: לְהַקְדִּישֵׁנִי
  choice: मुझे पवित्र ठहराने के बजाय
  rationale: क्रिया का रूप सकारात्मक, 'मुझे पवित्र ठहराना', है; पर मुख्य क्रिया 'विरोध किया' के साथ यह उस अपेक्षित कार्य को बताता है जिसे उन्होंने पूरा नहीं किया। 'के बजाय' इस संबंध को बिना अनावश्यक व्याख्यात्मक विस्तार के स्पष्ट करता है।
- source_word: בַמַּיִם לְעֵינֵיהֶם
  choice: जल के पास उनकी आँखों के सामने
  rationale: घटना के स्थान/परिस्थिति और उसके सार्वजनिक रूप से घटित होने—दोनों को निकटता से सुरक्षित रखा गया है।
- source_word: מֵי מְרִיבַת קָדֵשׁ
  choice: कादेश-मरीबा का जल
  rationale: स्थान-नाम के दोनों घटक बनाए रखे गए हैं; हिंदी में यह रूप पठनीय है और 'मरीबा' में निहित झगड़े की पिछली पंक्ति से संबद्धता भी बनी रहती है।
theological_decisions:
- issue: לְהַקְדִּישֵׁנִי में सकारात्मक क्रियारूप और प्रसंगगत विफलता
  choice: मुझे पवित्र ठहराने के बजाय
  alternative: मुझे पवित्र ठहराने के लिए / मुझे पवित्र न ठहराकर
  rationale: मूल infinitive सकारात्मक है, इसलिए सीधे 'न ठहराकर' कहने के बजाय 'के बजाय' चुना गया है। इससे अपेक्षित कार्य और वास्तविक विद्रोह का विरोध स्पष्ट होता है, जबकि मूल की व्याकरणिक तनावपूर्णता कुछ हद तक बनी रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'निर्जन प्रदेश', 'समुदाय' और 'आज्ञा का विरोध' जैसे पद औपचारिकता तथा सहजता में संतुलन रखते हैं। किसी पंथ-विशेष की व्याख्या नहीं जोड़ी गई है।
