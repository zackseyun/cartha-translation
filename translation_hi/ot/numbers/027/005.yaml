  text: וַ/יַּקְרֵ֥ב מֹשֶׁ֛ה אֶת מִשְׁפָּטָ֖/ לִ/פְנֵ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/005.yaml
  text: So Moses brought their case before Yahweh[a].
translation:
  language: hi
  text: तब मूसा उनका मुक़दमा यहोवा के सामने ले गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: ले गया
  rationale: हिफ़िल रूप का अर्थ किसी बात को निकट लाना या प्रस्तुत करना है। कानूनी प्रसंग में ‘मुक़दमा ... के सामने ले गया’ स्वाभाविक हिंदी में औपचारिक प्रस्तुति का भाव व्यक्त करता है।
- source_word: מִשְׁפָּטָן
  choice: उनका मुक़दमा
  rationale: מִשְׁפָּט न्याय, निर्णय, कानूनी दावा या मामला दर्शा सकता है। यहाँ स्त्रियों के उत्तराधिकार-संबंधी विवाद के लिए ‘मुक़दमा’ संक्षिप्त और प्रसंगानुकूल है; स्त्रीलिंग बहुवचन प्रत्यय का अर्थ ‘उनका’ है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: इसका मूल अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है और यहाँ निर्णय के लिए विषय प्रस्तुत करने को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित प्रत्यक्ष नाम-रूप ‘यहोवा’ चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में सुरक्षित रखता है।
- source_word: וַ
  choice: तब
  rationale: वाव कथा को आगे बढ़ाता है और पिछली विनती के प्रत्युत्तर में मूसा की अगली कार्रवाई दिखाता है; हिंदी में ‘तब’ यह क्रम स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में दिव्य नाम स्वयं आया है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नाम-रूप है और मूल के व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: वाक्य आधुनिक, सहज और गरिमापूर्ण हिंदी में है। कानूनी प्रसंग को स्पष्ट रखने के लिए ‘मुक़दमा’ चुना गया है; कोई पादटिप्पणी आवश्यक नहीं मानी गई।
