lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिंदी में व्यक्त करता है। यहाँ דבר के साथ לֵאמֹר होने पर ‘कहा’ हिंदी में वाणी-परिचय का सहज और सटीक रूप है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का प्रचलित मानक हिंदी रूप।
- source_word: אֶל
  choice: से
  rationale: हिंदी में ‘किसी से कहना’ संबोधित व्यक्ति को स्वाभाविक रूप से व्यक्त करता है; इसलिए हिब्रू में वाणी की दिशा बताने वाले אֶל का अर्थ सुरक्षित रहता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह प्रत्यक्ष कथन का परिचय देने वाला क्रियारूप है। हिंदी में דבר और לֵאמֹר को अलग-अलग दोहराने के बजाय ‘ने ... कहा’ दोनों की संयुक्त भूमिका स्वाभाविक ढंग से निभाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘यहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता; ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘मूसा ने यहवे से कहा’ ने हिब्रू के दोहरे वाणी-सूत्र को हिंदी की स्वाभाविक अभिव्यक्ति में संक्षिप्त किया है; अंतिम अल्पविराम अगले प्रत्यक्ष कथन से इसके जुड़ाव को दिखाता है।
