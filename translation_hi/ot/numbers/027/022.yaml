  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/יִּקַּ֣ח אֶת יְהוֹשֻׁ֗עַ וַ/יַּֽעֲמִדֵ֨/הוּ֙ לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/022.yaml
  text: 'And Moses did as Yahweh had commanded him: he took Joshua and set him before Eleazar the priest and before all the congregation[a].'
translation:
  language: hi
  text: मूसा ने वैसा ही किया जैसा यहोवा ने उसे आज्ञा दी थी। उसने यहोशू को लेकर उसे याजक एलीआज़र के और सारी मण्डली के सामने खड़ा किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे प्रस्तुत किया।” इब्रानी क्रिया का मूल अर्थ है, “उसे खड़ा किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַשׂ ... כַּאֲשֶׁר צִוָּה
  choice: ने वैसा ही किया जैसा ... आज्ञा दी थी
  rationale: यह स्वाभाविक हिन्दी मुहावरा मूसा की उस आज्ञा के प्रति ठीक वैसी ही आज्ञाकारिता और क्रियाओं का कालक्रम व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: וַיִּקַּח אֶת־יְהוֹשֻׁעַ
  choice: उसने यहोशू को लेकर
  rationale: לקח का मूल अर्थ ‘लेना’ है; ‘को लेकर’ इस नियुक्ति के प्रसंग में स्वाभाविक हिन्दी है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: וַיַּעֲמִדֵהוּ
  choice: उसे ... खड़ा किया
  rationale: עמד के हिफ़ील रूप का कारणवाचक अर्थ ‘खड़ा करना’ है। यह शारीरिक क्रिया को स्पष्ट रखता है, जबकि औपचारिक रूप से ‘प्रस्तुत करना’ प्रसंगगत विकल्प है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह एलीआज़ार और समुदाय की उपस्थिति में सार्वजनिक रूप से खड़ा किए जाने को सहज हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: यह כֹּהֵן के लिए मानक, प्रतिष्ठित और व्यापक रूप से समझा जाने वाला हिन्दी बाइबलीय पद है।
- source_word: כָּל־הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ एकत्र इस्राएली समुदाय को दर्शाता है; ‘सारी मण्डली’ כָּל की समग्रता सहित संक्षिप्त और परिचित अनुवाद है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए स्थापित ‘यहोवा’ उसका पहचान योग्य लिप्यंतरण है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: यहोशू को सामने खड़ा करने की क्रिया
  choice: खड़ा किया
  alternative: प्रस्तुत किया
  rationale: कारणवाचक इब्रानी क्रिया के प्रत्यक्ष अर्थ को मुख्य पाठ में रखा गया है; नियुक्ति-संबंधी ‘प्रस्तुत किया’ अर्थ-संगत है, पर कुछ अधिक व्याख्यात्मक है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण शैली रखी गई है। ‘आज्ञा दी थी’ पूर्ववर्ती ईश्वरीय आदेश को दिखाता है। ‘मण्डली’ और ‘याजक’ परिचित बाइबलीय शब्द हैं; वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
