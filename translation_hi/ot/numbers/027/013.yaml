  text: וְ/רָאִ֣יתָה אֹתָ֔/הּ וְ/נֶאֱסַפְתָּ֥ אֶל עַמֶּ֖י/ךָ גַּם אָ֑תָּה כַּ/אֲשֶׁ֥ר נֶאֱסַ֖ף אַהֲרֹ֥ן אָחִֽי/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/013.yaml
  text: And when you have seen it[a], you also will be gathered to your people, just as Aaron your brother was gathered.
translation:
  language: hi
  text: और जब तुम उसे देख लोगे, तब तुम भी अपने लोगों के पास इकट्ठे किए जाओगे[a], जैसे तुम्हारा भाई हारून इकट्ठा किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक व्याख्यात्मक अनुवाद: “तुम मर जाओगे” या “तुम अपने पूर्वजों के पास इकट्ठे किए जाओगे।” इब्रानी मुहावरे का शाब्दिक भाव है, “अपने लोगों के पास इकट्ठा किया जाना।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאִיתָה
  choice: और जब तुम ... देख लो
  rationale: ראה का क़ाल द्वितीय पुरुष एकवचन रूप संयोजक וְ के साथ है। पिछले आदेश के संदर्भ में ‘जब ... देख लो’ घटनाओं का क्रम स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹתָהּ
  choice: उसे
  rationale: स्त्रीलिंग एकवचन कर्मवाचक सर्वनाम का संकेत प्रसंग में उस देश की ओर है जिसे मूसा को देखना है; हिन्दी में देश के लिए ‘उसे’ स्वाभाविक है।
- source_word: וְנֶאֱסַפְתָּ
  choice: मिला लिए जाओगे
  rationale: אסף का निफ़अल रूप यहाँ मृत्यु और अपने लोगों के साथ सम्मिलित किए जाने के मुहावरे में है। यह अनुवाद कर्मवाच्य और रूपक दोनों को बनाए रखता है।
- source_word: אֶל עַמֶּיךָ
  choice: अपने लोगों में
  rationale: इब्रानी का शाब्दिक अर्थ ‘अपने लोगों की ओर/के पास’ है। हिन्दी में ‘अपने लोगों में मिला लिया जाना’ उसी पारिवारिक-सामुदायिक मुहावरे को सहज ढंग से सुरक्षित रखता है।
- source_word: גַּם אָתָּה
  choice: तुम भी
  rationale: यह बल देता है कि मूसा का अनुभव भी हारून के समान होगा।
- source_word: כַּאֲשֶׁר
  choice: जैसे
  rationale: हारून के साथ हुई घटना से सीधी तुलना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֶאֱסַף
  choice: मिला लिया गया था
  rationale: पहले प्रयुक्त मृत्यु-मुहावरे के साथ शब्दगत संगति रखता है और इब्रानी निफ़अल का कर्मवाच्य भाव सुरक्षित करता है।
- source_word: אַהֲרֹן אָחִיךָ
  choice: तुम्हारा भाई हारून
  rationale: मानक हिन्दी नाम-रूप और स्वाभाविक सम्बन्धसूचक पदक्रम अपनाया गया है।
theological_decisions:
- issue: मृत्यु के मुहावरे אסף אל־עמיו का अनुवाद
  choice: अपने लोगों में मिला लिए जाओगे
  alternative: तुम मर जाओगे; अपने पूर्वजों में मिला दिए जाओगे
  rationale: मूल इब्रानी केवल मृत्यु नहीं कहता, बल्कि अपने लोगों के साथ मिलाए जाने का पारिवारिक और सामुदायिक रूपक रखता है। इसे बनाए रखने से पद के साहित्यिक और धर्मवैचारिक तनाव को किसी निश्चित परलोक-सिद्धान्त में बदले बिना सुरक्षित रखा जाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और सामान्य पाठकों के लिए बोधगम्य शैली। ‘मिला लिए जाओगे’ मृत्यु के इब्रानी मुहावरे को अक्षुण्ण रखते हुए हिन्दी में स्वाभाविक सुनाई देता है।
