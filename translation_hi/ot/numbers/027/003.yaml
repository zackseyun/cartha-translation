  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָבִי/נוּ֮ מֵ֣ת בַּ/מִּדְבָּר֒ וְ/ה֨וּא לֹא הָיָ֜ה בְּ/ת֣וֹךְ הָ/עֵדָ֗ה הַ/נּוֹעָדִ֛ים עַל יְהוָ֖ה בַּ/עֲדַת קֹ֑רַח כִּֽי בְ/חֶטְא֣/וֹ מֵ֔ת וּ/בָנִ֖ים לֹא הָ֥יוּ לֽ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/003.yaml
  text: Our father died in the wilderness[a], and he was not among the congregation of those who gathered themselves against Yahweh in the company of Korah; rather, he died for his own sin[c][b], and he had no sons.
translation:
  language: hi
  text: “हमारे पिता की मृत्यु निर्जन प्रदेश में हुई। वह उन लोगों के समुदाय में नहीं थे जो कोरह के दल में यहोवा के विरुद्ध इकट्ठे हुए थे; बल्कि वह अपने ही पाप के कारण मरे[a], और उनके कोई पुत्र नहीं था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने पाप में मरे।” इब्रानी में यह वाक्यांश कारण भी व्यक्त कर सकता है; यहाँ किसी विशेष पाप का उल्लेख नहीं है, केवल इतना स्पष्ट है कि वह कोरह के विद्रोह में सम्मिलित नहीं थे।
    reason: alternative_reading
lexical_decisions:
- source_word: אָבִינוּ
  choice: हमारे पिता
  rationale: बोलने वाली पुत्रियाँ अपने प्रत्यक्ष पिता का उल्लेख कर रही हैं; इसलिए ‘पिता’ स्वाभाविक और संदर्भानुकूल है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר इस्राएल की जंगल-यात्रा के व्यापक, अनावाद क्षेत्र को दर्शाता है; ‘निर्जन प्रदेश’ आधुनिक हिन्दी में ‘जंगल’ के वन-संबंधी भ्रम से बचता है।
- source_word: בְּתוֹךְ הָעֵדָה
  choice: समुदाय में
  rationale: בְּתוֹךְ का अर्थ ‘के बीच/में’ और עֵדָה का सामुदायिक अर्थ यहाँ सहज रूप से व्यक्त होता है।
- source_word: הַנּוֹעָדִים עַל יְהוָה
  choice: जो यहोवा के विरुद्ध इकट्ठे हुए थे
  rationale: निफ़ाल कृदंत सामूहिक रूप से इकट्ठा होने और עַל यहाँ विरोधी दिशा को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप से परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से बदले बिना व्यक्त करता है।
- source_word: בַּעֲדַת קֹרַח
  choice: कोरह के दल में
  rationale: यह पदबंध कोरह से जुड़े विशिष्ट विद्रोही समूह को बताता है; ‘दल’ पहले आए עֵדָה के अनावश्यक शब्द-दोहराव से भी बचाता है।
- source_word: כִּי בְחֶטְאוֹ מֵת
  choice: बल्कि वह अपने ही पाप के कारण मरे
  rationale: כִּי पिछले निषेध के बाद सुधारात्मक विरोध प्रस्तुत करता है और בְּ को संदर्भ में कारणसूचक समझा जा सकता है; ‘अपने ही’ कोरह के सामूहिक विद्रोह से भेद स्पष्ट करता है।
- source_word: וּבָנִים לֹא הָיוּ לוֹ
  choice: और उनके कोई पुत्र नहीं था
  rationale: अस्तित्वसूचक היה + לְ का स्वाभाविक हिन्दी रूप; उत्तराधिकार के संदर्भ के कारण ‘पुत्र’ को लिंग-निरपेक्ष नहीं बनाया गया।
theological_decisions:
- issue: यहोवा के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत नाम יהוה है; इसलिए उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: व्यक्तिगत पाप और कोरह के सामूहिक विद्रोह का संबंध
  choice: अपने ही पाप के कारण मरे
  alternative: अपने पाप में मरे
  rationale: वचन पिता को कोरह के विद्रोह से अलग करता है, पर उसके पाप का स्वरूप नहीं बताता। चुना हुआ पाठ इस भेद को रखता है और फुटनोट इब्रानी पूर्वसर्ग की वास्तविक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सामान्य पाठक के लिए सहज। पिता के लिए बहुवचन-सम्मानसूचक क्रिया और सर्वनाम प्रयुक्त हैं। ‘निर्जन प्रदेश’ से מִדְבָּר का अर्थ वन के बजाय अनावाद क्षेत्र के रूप में स्पष्ट रहता है।
