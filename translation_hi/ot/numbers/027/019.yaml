  yaml_path: translation/ot/numbers/027/019.yaml
  text: You shall set him before Eleazar the priest and before all the congregation[a], and you shall commission him in their sight.
translation:
  language: hi
  text: तू उसे एलिआज़ार याजक और सारी सभा के सामने खड़ा कर, और उनकी आँखों के सामने उसे दायित्व सौंप[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे आज्ञा देना” अथवा “उसे निर्देश देना।” इब्रानी क्रिया का सामान्य अर्थ “आज्ञा देना” है; यहाँ संभवतः यहोशू को सार्वजनिक रूप से उसका दायित्व सौंपना अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַעֲמַדְתָּ
  choice: तू ... खड़ा करना
  rationale: עמד के हिफ़ईल रूप का अर्थ यहाँ किसी को औपचारिक रूप से दूसरों के सामने खड़ा करना है; यह नियुक्ति के दृश्य को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थान और औपचारिक उपस्थिति—दोनों का स्वाभाविक हिन्दी बोध देता है।
- source_word: אֶלְעָזָר
  choice: एलीआज़ार
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: एलीआज़ार के निश्चित पदनाम को संक्षिप्त और स्थापित बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: כָּל הָעֵדָה
  choice: सारी सभा
  rationale: עֵדָה यहाँ इस्राएल के एकत्र समुदाय को दर्शाता है; ‘सारी सभा’ आधुनिक हिन्दी में सहज है और सामूहिक अर्थ बनाए रखता है।
- source_word: וְצִוִּיתָה
  choice: उसे दायित्व सौंपना
  rationale: צוה का मूल अर्थ ‘आज्ञा देना’ है, पर इस सार्वजनिक उत्तराधिकार-समारोह में यह यहोशू को अधिकारपूर्वक कार्यभार/दायित्व सौंपने की ओर संकेत करता है।
- source_word: לְעֵינֵיהֶם
  choice: उन सबके देखते
  rationale: शाब्दिक ‘उनकी आँखों के सामने’ का स्वाभाविक हिन्दी मुहावरा, जो कार्य की सार्वजनिक और साक्ष्यपूर्ण प्रकृति सुरक्षित रखता है।
theological_decisions:
- issue: यहोशू को सार्वजनिक रूप से अधिकार और दायित्व सौंपना
  choice: ‘दायित्व सौंपना’
  alternative: ‘आज्ञा देना’ या ‘निर्देश देना’
  rationale: संदर्भ औपचारिक सार्वजनिक नियुक्ति का है। चुना हुआ रूप उस प्रसंग को स्पष्ट करता है, जबकि पादटिप्पणी क्रिया के सामान्य अर्थ और वास्तविक भाषिक तनाव को सुरक्षित रखती है।
