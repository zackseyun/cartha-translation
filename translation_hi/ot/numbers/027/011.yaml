base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/011.yaml
  text: And if his father has no brothers[a], then you shall give his inheritance to his nearest relative from his clan, and he shall possess it. This shall be for the sons of Israel a statute of judgment[d][c][b], just as Yahweh commanded Moses.
translation:
  language: hi
  text: और यदि उसके पिता का कोई भाई न हो, तो तुम उसकी विरासत उसके कुल में से उसके निकटतम रक्त-संबंधी[a] को दे देना, और वह उस पर अधिकार करेगा[b]। यह इस्राएल के पुत्रों[c] के लिए न्याय का विधान होगा[d], जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके कुल में से उस रक्त-संबंधी को जो उसके सबसे निकट है।” इब्रानी में “रक्त-संबंधी” और “उसके सबसे निकट” दोनों भाव साथ आते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “और वह उसे विरासत में पाएगा।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों”; यह पूरे इस्राएली समुदाय का प्रचलित वाचागत पदनाम है।
    reason: cultural_note
  - marker: d
    text: या, “कानूनी विधान” या “न्यायिक विधि”; इब्रानी पद एक बाध्यकारी कानूनी विधान को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַחִים
  choice: भाई
  rationale: विरासत के क्रम में यहाँ पिता के सगे या पारिवारिक भाइयों का साधारण अर्थ अभिप्रेत है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: यह पद उत्तराधिकार में मिलने वाली पैतृक सम्पत्ति के कानूनी हस्तान्तरण की बात करता है।
- source_word: שְׁאֵרוֹ הַקָּרֹב אֵלָיו
  choice: उसके सबसे निकट के रक्त-सम्बन्धी
  rationale: שְׁאֵר रक्त या निकट कुटुम्ब के सम्बन्धी को और הַקָּרֹב אֵלָיו निकटता की कोटि को व्यक्त करता है; हिन्दी में दोनों तत्व स्पष्ट रखे गए हैं।
- source_word: מִמִּשְׁפַּחְתּוֹ
  choice: उसके कुल में
  rationale: מִשְׁפָּחָה यहाँ इस्राएल की विस्तृत पारिवारिक या कुलगत इकाई को दर्शाता है, केवल छोटे परिवार को नहीं।
- source_word: וְיָרַשׁ אֹתָהּ
  choice: और वह उसे विरासत में पाएगा
  rationale: ירשׁ के उत्तराधिकार और अधिकार-प्राप्ति दोनों भावों को स्वाभाविक हिन्दी कानूनी अभिव्यक्ति में रखा गया है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के लिए
  rationale: शाब्दिक रूप 'इस्राएल के पुत्रों' है, पर यह समूचे वाचा-समुदाय का रूढ़ राष्ट्रीय पदनाम है; आधुनिक हिन्दी में 'इस्राएलियों' से वही सामूहिक अर्थ सहज रूप से पहुँचता है।
- source_word: לְחֻקַּת מִשְׁפָּט
  choice: न्याय का स्थायी विधान
  rationale: חֻקָּה बाध्यकारी और स्थापित विधि को तथा מִשְׁפָּט न्यायिक-कानूनी निर्णय को सूचित करता है; यह अनुवाद दोनों भावों को पठनीय हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में प्रतिलिपित किया गया है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: इब्रानी पाठ में व्यक्तिगत नाम स्पष्ट रूप से है; इसलिए उसे उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: לִבְנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद केवल पुरुष सन्तानों को नहीं, पूरे राष्ट्रीय वाचा-समुदाय को निर्दिष्ट करता है। मुख्य पाठ में स्वाभाविक सामूहिक हिन्दी और पादटिप्पणी में शाब्दिक रूप दिया गया है।
- issue: וְיָרַשׁ में विरासत और अधिकार का सम्बन्ध
  choice: उसे विरासत में पाएगा
  alternative: उस पर अधिकार करेगा
  rationale: सन्दर्भ उत्तराधिकार का है, पर क्रिया अधिकार ग्रहण करने का भाव भी रख सकती है; विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुरूप रखी गई है। बहुवचन आज्ञा וּנְתַתֶּם को 'तुम ... देना' से व्यक्त किया गया है। 'कुल', 'विरासत' और 'स्थायी विधान' सामाजिक तथा न्यायिक संरचना को सामान्य पाठक के लिए स्पष्ट रखते हैं।
