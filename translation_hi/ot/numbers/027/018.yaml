source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַח לְ/ךָ֙ אֶת יְהוֹשֻׁ֣עַ בִּן נ֔וּן אִ֖ישׁ אֲשֶׁר ר֣וּחַ בּ֑/וֹ וְ/סָמַכְתָּ֥ אֶת יָדְ/ךָ֖ עָלָֽי/ו־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/018.yaml
  text: And Yahweh said to Moses[a], “Take Joshua son of Nun, a man in whom is spirit, and lay your hand on him.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “नून के पुत्र यहोशू को ले—एक ऐसा पुरुष जिसमें आत्मा है[a]—और उस पर अपना हाथ रख।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू का शाब्दिक भाव “जिसमें आत्मा है” है। यहाँ “आत्मा” से परमेश्वर की आत्मा या यहोशू में विद्यमान आत्मिक सामर्थ्य अभिप्रेत हो सकता है; हिब्रू में निश्चित उपपद नहीं है।
    reason: मूल अभिव्यक्ति की वास्तविक संदिग्धता और संभावित धार्मिक अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचा-नाम का प्रचलित लिप्यंतरण; इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- source_word: קַח לְךָ
  choice: को ले
  rationale: हिब्रू आज्ञार्थक मुहावरे का स्वाभाविक हिन्दी रूप; לְךָ को अलग से ‘अपने लिए’ कहना यहाँ अनावश्यक और भ्रामक हो सकता है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: नामों का मानक हिन्दी बाइबलीय रूप और पुत्र-संबंध का स्पष्ट अनुवाद।
- source_word: אִישׁ
  choice: एक ऐसा पुरुष
  rationale: स्रोत का शब्द व्याकरण और अर्थ दोनों में पुल्लिंग एकवचन है; ‘व्यक्ति’ कहकर इसे लिंग-निरपेक्ष नहीं बनाया गया।
- source_word: אֲשֶׁר רוּחַ בּוֹ
  choice: जिसमें आत्मा है
  rationale: हिब्रू की संक्षिप्त और अनिश्चित अभिव्यक्ति को निकटता से रखता है। ‘पवित्र आत्मा’ या ‘परमेश्वर का आत्मा’ जोड़कर संभावित संकेत को निश्चित सिद्धांत में नहीं बदला गया।
- source_word: וְסָמַכְתָּ אֶת יָדְךָ עָלָיו
  choice: और उस पर अपना हाथ रख
  rationale: हाथ रखे जाने के हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप; स्रोत के अनुसार ‘हाथ’ एकवचन रखा गया है।
theological_decisions:
- issue: רוּחַ से परमेश्वर के आत्मा का आशय है या मनुष्य की आत्मिक क्षमता/स्वभाव का
  choice: आत्मा
  alternative: परमेश्वर का आत्मा; आत्मिक सामर्थ्य
  rationale: मूल हिब्रू में निश्चित उपपद नहीं है और वाक्यांश केवल ‘जिसमें आत्मा है’ कहता है। नियुक्ति का प्रसंग ईश्वरीय सामर्थ्य की ओर संकेत कर सकता है, पर मुख्य पाठ उस संकेत को स्पष्ट पहचान में बदलकर तनाव समाप्त नहीं करता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। प्रत्यक्ष आज्ञा में स्वाभाविक एकवचन रूप ‘ले’ और ‘रख’ रखा गया है। डैश मूल वाक्य के वर्णनात्मक खंड को स्पष्ट करते हैं, बिना उसका अर्थ बदले।
