  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। लंबी इब्रानी वंशावली को अर्थ बदले बिना छोटे वाक्यों में बाँटा गया है। “आगे आईं” आगामी औपचारिक निवेदन की ओर संकेत करता है, पर पाठ में अनुल्लिखित अधिकारियों को इस पद में नहीं जोड़ता।
