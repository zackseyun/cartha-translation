source:
  edition: WLC
  text: וַ/תִּקְרַ֜בְנָה בְּנ֣וֹת צְלָפְחָ֗ד בֶּן חֵ֤פֶר בֶּן גִּלְעָד֙ בֶּן מָכִ֣יר בֶּן מְנַשֶּׁ֔ה לְ/מִשְׁפְּחֹ֖ת מְנַשֶּׁ֣ה בֶן יוֹסֵ֑ף וְ/אֵ֨לֶּה֙ שְׁמ֣וֹת בְּנֹתָ֔י/ו מַחְלָ֣ה נֹעָ֔ה וְ/חָגְלָ֥ה וּ/מִלְכָּ֖ה וְ/תִרְצָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/001.yaml
  text: 'Then the daughters of Zelophehad son of Hepher[a], son of Gilead, son of Machir, son of Manasseh, from the clans of Manasseh son of Joseph, came near. And these were the names of his daughters: Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.'
translation:
  language: hi
  text: 'तब सलोफहाद की बेटियाँ आगे आईं[a]। सलोफहाद हेपेर का पुत्र, हेपेर गिलाद का पुत्र, गिलाद माकीर का पुत्र और माकीर मनश्शे का पुत्र था। वे यूसुफ के पुत्र मनश्शे के कुलों में से थीं। सलोफहाद की बेटियों के नाम ये थे: महला, नोआ[b], होगला, मिल्का और तिर्सा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “निकट आईं”; “सामने आईं” या “पास आईं” भी संभव है। यह शब्दावली औपचारिक निवेदन के लिए आगे आने का संकेत दे सकती है, जिसका वर्णन अगले पदों में है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नोआ” सलोफहाद की एक बेटी का नाम है; यह उत्पत्ति की पुस्तक में आए पुरुष नूह का नाम नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּקְרַבְנָה
  choice: आगे आईं
  rationale: क्रिया קרב का मूल भाव निकट आने का है; इस कानूनी निवेदन के प्रसंग में “आगे आईं” स्वाभाविक हिन्दी है और बिना अनावश्यक विस्तार के अधिकार-प्राप्त लोगों के सामने उपस्थित होने का संकेत देती है।
- source_word: בְּנוֹת צְלָפְחָד
  choice: सलोफाद की बेटियाँ
  rationale: निर्मित संबंध यहाँ शाब्दिक पुत्रियों को दर्शाता है, जिसकी पुष्टि आगे नामों की सूची से होती है।
- source_word: בֶּן חֵפֶר בֶּן גִּלְעָד בֶּן מָכִיר בֶּן מְנַשֶּׁה
  choice: हेपेर का पुत्र, हेपेर गिलाद का पुत्र, गिलाद माकीर का पुत्र और माकीर मनश्शे का पुत्र
  rationale: वंशावली की हर कड़ी स्पष्ट रखी गई है, क्योंकि यह आगे आने वाले विरासत के दावे की पृष्ठभूमि है; हिन्दी में संदर्भ-स्पष्टता के लिए प्रत्येक पिता का नाम दोहराया गया है।
- source_word: לְמִשְׁפְּחֹת
  choice: कुलों में से
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर के सामाजिक-वंशीय समूह को दर्शाता है; हिन्दी बाइबलीय और सामान्य वंशावली भाषा में “कुल” उपयुक्त और सुबोध है।
- source_word: מְנַשֶּׁה בֶן יוֹסֵף
  choice: यूसुफ के पुत्र मनश्शे
  rationale: मनश्शे का यूसुफ से स्पष्ट वंश-संबंध मूल पाठ के अनुसार सुरक्षित रखा गया है।
- source_word: וְאֵלֶּה שְׁמוֹת בְּנֹתָיו
  choice: सलोफाद की बेटियों के नाम ये थे
  rationale: प्रत्यय का संदर्भ अस्पष्ट न रहे, इसलिए “उसकी” के स्थान पर सलोफाद का नाम दोहराया गया; नाम-सूची का सूत्र स्वाभाविक हिन्दी में रखा गया है।
- source_word: מַחְלָה נֹעָה וְחָגְלָה וּמִלְכָּה וְתִרְצָה
  choice: महला, नोआ, होगला, मिल्का और तिरसा
  rationale: व्यक्तिनामों को हिन्दी में प्रचलित ध्वन्यात्मक रूपों के निकट लिप्यंतरित किया गया है; נֹעָה को स्त्रीलिंग नाम “नोआ” रखा गया है।
