source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה עֲלֵ֛ה אֶל הַ֥ר הָ/עֲבָרִ֖ים הַ/זֶּ֑ה וּ/רְאֵה֙ אֶת הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֥י יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/012.yaml
  text: Then Yahweh said to Moses[b][a], “Go up to this mountain of the Abarim and see the land that I have given to the sons of Israel.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “अबारीम के इस पहाड़[a] पर चढ़ जा और उस देश को देख, जिसे मैंने इस्राएल के पुत्रों[b] को दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अबारीम के पहाड़”; इसका अनुवाद “अबारीम का पहाड़” या “अबारीम पर्वत” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से, “इस्राएल के पुत्रों को।” वैकल्पिक रूप: “इस्राएलियों को” या “इस्राएल के लोगों को।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲלֵה
  choice: चढ़ जा
  rationale: आज्ञार्थक क्रिया ऊपर जाने की वास्तविक गति बताती है; संबोधन एकवचन है, इसलिए ‘जा’ रखा गया है।
- source_word: הַר הָעֲבָרִים הַזֶּה
  choice: अबारीम के इस पहाड़
  rationale: रचना का निकट रूप ‘अबारीम का/के यह पहाड़’ है। हिन्दी में स्थान-नाम के साथ ‘अबारीम के इस पहाड़’ स्वाभाविक है और संकेतवाचक ‘इस’ भी सुरक्षित रहता है।
- source_word: וּרְאֵה
  choice: और ... देख
  rationale: दूसरे एकवचन आज्ञार्थक को सीधे और dignified आधुनिक हिन्दी में रखा गया है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: यहाँ אֶרֶץ प्रतिज्ञात भूभाग का संकेत करता है। ‘देश’ हिन्दी में इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है; ‘उस’ अगले संबंधवाचक उपवाक्य से जुड़ता है।
- source_word: נָתַתִּי
  choice: मैंने ... दिया है
  rationale: हिब्रू पूर्ण क्रिया स्थापित दान को व्यक्त करती है जिसका वर्तमान महत्त्व है; हिन्दी पूर्ण वर्तमान इसे बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों को
  rationale: यह स्थिर जातिवाचक पद पूरे इस्राएली समुदाय को सूचित करता है। ‘इस्राएलियों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: वाचा-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है; यह किसी व्याख्यात्मक अर्थ को पाठ में नहीं जोड़ता।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद मानक जातिवाचक अभिव्यक्ति के रूप में समस्त इस्राएली समुदाय को दर्शाता है। मुख्य पाठ में सहज सामुदायिक अर्थ रखा गया है और शाब्दिक पुरुषवाचक रूप पादटिप्पणी में सुरक्षित है।
- issue: נָתַתִּי में दान की कालगत बारीकी
  choice: दिया है
  alternative: दिया था
  rationale: पूर्ण क्रिया को स्थापित और वर्तमानतः प्रासंगिक दान के रूप में प्रस्तुत किया गया है, बिना भूमि पर तत्काल अधिकार या पूर्ण कब्जे की अलग धार्मिक व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। परमेश्वर द्वारा मूसा को दिए गए एकवचन आदेश में ‘चढ़ जा’ और ‘देख’ मूल के प्रत्यक्ष संबोधन को बनाए रखते हैं। स्थान-नाम ‘अबारीम’ का लिप्यंतरण किया गया है और दोनों वास्तविक वैकल्पिक अभिव्यक्तियाँ पादटिप्पणियों में दी गई हैं।
