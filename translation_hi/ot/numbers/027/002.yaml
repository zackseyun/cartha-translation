  rationale: The revision restores the source's repeated formal ‘before’ for Moses, Eleazar, the leaders, and the whole congregation. It also renders the standing as a completed narrative action before the introduction of the following direct speech, without adding substantive meaning. The lexical alternative note is retained with normalized Hindi quotation punctuation.
