source:
  edition: WLC
  text: וַֽ/תַּעֲמֹ֜דְנָה לִ/פְנֵ֣י מֹשֶׁ֗ה וְ/לִ/פְנֵי֙ אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/לִ/פְנֵ֥י הַ/נְּשִׂיאִ֖ם וְ/כָל הָ/עֵדָ֑ה פֶּ֥תַח אֹֽהֶל מוֹעֵ֖ד לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/002.yaml
  text: And they stood before Moses[a], before Eleazar the priest, before the leaders, and all the congregation, at the entrance of the tent of meeting, saying[b],
translation:
  language: hi
  text: 'और वे मूसा के सामने, याजक एलीआज़र के सामने, प्रधानों के सामने और सारी मंडली के सामने, मिलापवाले तंबू के द्वार पर खड़ी हुईं और कहने लगीं:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲמֹדְנָה
  choice: और वे ... खड़ी होकर
  rationale: क्रिया स्त्रीलिंग बहुवचन है और सलोफ़्हाद की बेटियों के औपचारिक रूप से उपस्थित होने को व्यक्त करती है। हिंदी में अगले कथन से स्वाभाविक संबंध के लिए ‘खड़ी होकर ... कहने लगीं’ रखा गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: बार-बार आए इस पदबंध का सीधा रूप रखा गया है, जिससे सार्वजनिक और न्यायिक उपस्थिति का भाव बना रहता है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़र याजक
  rationale: मूल में केवल ‘याजक’ है; इसलिए ‘महायाजक’ जोड़कर पद का विस्तार नहीं किया गया।
- source_word: הַנְּשִׂיאִם
  choice: प्रधानों
  rationale: यह समुदाय अथवा गोत्रों के आधिकारिक अगुओं को दर्शाता है। ‘प्रधान’ आधुनिक हिंदी में पद और अधिकार का भाव देता है; विकल्प फुटनोट में दिया गया है।
- source_word: כָל הָעֵדָה
  choice: सारी मंडली
  rationale: עֵדָה गिनती में एकत्रित वाचा-समुदाय को सूचित करता है। ‘मंडली’ उस सामुदायिक अर्थ को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: यह पवित्र तंबू के प्रवेश-स्थान को बताता है। ‘मिलापवाला तंबू’ हिंदी बाइबलीय प्रयोग में परिचित और अर्थपूर्ण पद है।
- source_word: לֵאמֹר
  choice: कहने लगीं,
  rationale: यह अगले पद में आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में स्त्रीलिंग बहुवचन कर्ता के साथ ‘कहने लगीं’ स्वाभाविक कथात्मक संयोजन है।
theological_decisions:
- issue: बेटियों की अपील का सार्वजनिक और न्यायिक परिवेश
  choice: मूसा, एलीआज़र, प्रधानों और सारी मंडली की पूरी सूची तथा ‘के सामने’ की पुनरावृत्ति सुरक्षित रखी गई।
  alternative: सूची को संक्षिप्त करके केवल अधिकारियों या सभा के सामने उपस्थित होना कहना।
  rationale: मूल पाठ उनकी अपील के खुले, औपचारिक और सामुदायिक स्वरूप पर बल देता है; सूची को संक्षिप्त करने से यह बल घट जाता।
- issue: עֵדָה का अनुवाद
  choice: मंडली
  alternative: सभा
  rationale: ‘मंडली’ केवल प्रक्रियात्मक सभा के बजाय एकत्रित समुदाय का भाव अधिक स्पष्ट रखता है, बिना कोई अतिरिक्त सांप्रदायिक अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज शैली। स्त्रीलिंग बहुवचन को ‘खड़ी होकर कहने लगीं’ में स्पष्ट रखा गया है। मूल की औपचारिक सूची और ‘के सामने’ की पुनरावृत्ति जानबूझकर सुरक्षित है।
