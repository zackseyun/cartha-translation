  yaml_path: translation/ot/numbers/027/008.yaml
  text: And you shall speak to the sons of Israel[a], saying, ‘If a man dies and has no son, then you shall transfer his inheritance to his daughter.’
translation:
  language: hi
  text: और इस्राएल के पुत्रों[a] को यह कहो, ‘यदि कोई पुरुष मर जाए और उसका कोई पुत्र न हो, तो तुम उसकी विरासत उसकी बेटी को सौंप देना।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों’ अथवा ‘इस्राएल की संतानों’। इब्रानी में शाब्दिक अर्थ ‘इस्राएल के पुत्रों’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל בְּנֵי יִשְׂרָאֵל
  choice: और ... इस्राएल के पुत्रों से
  rationale: शाब्दिक पारिवारिक और पुल्लिंग रूप को सुरक्षित रखा गया है; आधुनिक हिन्दी में ‘इस्राएली’ अधिक मुहावरेदार विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: תְּדַבֵּר לֵאמֹר
  choice: यह कहना
  rationale: यह मानक वचन-परिचय सूत्र है। ‘यह कहना’ हिन्दी में स्वाभाविक है और आगे आने वाले कथन का परिचय स्पष्ट करता है।
- source_word: אִישׁ כִּי יָמוּת
  choice: यदि कोई पुरुष मर जाए
  rationale: कानूनी उदाहरण में אִישׁ के पुल्लिंग एकवचन को ‘पुरुष’ और כִּי को शर्तसूचक ‘यदि’ से व्यक्त किया गया है।
- source_word: וּבֵן אֵין לוֹ
  choice: और उसका कोई पुत्र न हो
  rationale: हिब्रू के ‘उसके लिए पुत्र न हो’ का स्वाभाविक हिन्दी रूप है और पुरुष उत्तराधिकारी की अनुपस्थिति को बनाए रखता है।
- source_word: וְהַעֲבַרְתֶּם
  choice: तो तुम ... सौंप देना
  rationale: हिफ़ील रूप यहाँ संपत्ति-अधिकार को अगले पात्र तक पहुँचाने का कानूनी भाव रखता है; ‘सौंप देना’ सामान्य पाठक के लिए स्वाभाविक और स्पष्ट है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: नַחֲלָה यहाँ पैतृक संपत्ति अथवा उत्तराधिकार में मिली मिल्कियत को दर्शाता है; ‘विरासत’ संक्षिप्त और संदर्भानुकूल है।
- source_word: לְבִתּוֹ
  choice: उसकी बेटी को
  rationale: לְ प्राप्तकर्ता को चिह्नित करता है; ‘बेटी को’ इसका सीधा हिन्दी समतुल्य है।
