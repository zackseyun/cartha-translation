  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘आत्माओं के परमेश्वर’ जैसी विशिष्ट बाइबलीय उपाधि औपचारिक रूप में सुरक्षित है। ‘मण्डली पर’ नेतृत्व-अधिकार का भाव रखता है, और आदरसूचक ‘हैं/करें’ हिन्दी के स्वाभाविक धार्मिक प्रयोग के अनुरूप है।
