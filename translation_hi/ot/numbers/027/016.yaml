  text: “याहवे[a], समस्त मानवजाति[b] की आत्माओं के परमेश्वर, मण्डली[c] का अगुवा होने के लिए एक पुरुष नियुक्त करें।”
  philosophy: optimal-equivalence
  footnotes:
