theological_decisions:
- issue: प्रार्थनात्मक वाक्य में ईश्वरीय नाम
  choice: याहवे … नियुक्त करें
  alternative: यहोवा/प्रभु … नियुक्त करें
  rationale: मूल पाठ में יְהוָה व्यक्तिगत नाम के रूप में है। ‘याहवे’ उसे उपाधि से बदले बिना सुरक्षित रखता है; हिन्दी में आदरसूचक बहुवचन क्रिया स्वाभाविक गरिमा देती है।
- issue: אִישׁ का लिंग
  choice: एक पुरुष
  alternative: एक व्यक्ति/किसी को
  rationale: आगामी प्रसंग में नियुक्त उत्तराधिकारी यहोशू है और मूल संज्ञा स्पष्टतः पुल्लिंग है; अतः लिंग को तटस्थ नहीं किया गया।
- issue: ‘समस्त देह की आत्माओं’ का आशय
  choice: सभी प्राणियों की आत्माओं के परमेश्वर
  alternative: समस्त मानवजाति की आत्माओं के परमेश्वर
  rationale: व्यापक इब्रानी अभिव्यक्ति की सृष्ट-प्राणी संबंधी बनावट को बनाए रखा गया है, पर उसे केवल मानवजाति तक स्पष्ट करके मूल की संभावित व्यापकता को चुपचाप सीमित नहीं किया गया।
