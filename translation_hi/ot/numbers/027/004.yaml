  text: לָ֣/מָּה יִגָּרַ֤ע שֵׁם אָבִ֨י/נוּ֙ מִ/תּ֣וֹךְ מִשְׁפַּחְתּ֔/וֹ כִּ֛י אֵ֥ין ל֖/וֹ בֵּ֑ן תְּנָ/ה לָּ֣/נוּ אֲחֻזָּ֔ה בְּ/ת֖וֹךְ אֲחֵ֥י אָבִֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/004.yaml
  text: Why should our father's name be taken away from among his clan because he had no son? Give us a possession among our father's brothers[a][b].
translation:
  language: hi
  text: “हमारे पिता का नाम उनके कुल में से क्यों मिट जाए कि उनका कोई बेटा नहीं था? हमारे पिता के भाइयों के बीच हमें भूमि का एक हिस्सा दीजिए[a][b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मिट जाए” का अनुवाद “कम हो जाए” या “हटा दिया जाए” भी हो सकता है। इब्रानी प्रश्न यह है कि बेटा न होने के कारण पिता का “नाम” उनके कुल से क्यों लुप्त हो।
    reason: lexical_alternative
  - marker: b
    text: “भूमि का एक हिस्सा” कुल के भीतर अधिकार से प्राप्त भूमि अथवा विरासत में मिलने वाले भू-भाग को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: לָמָּה
  choice: क्यों
  rationale: यह प्रश्न एक अलंकारिक आपत्ति है; हिंदी में ‘क्यों ... जाए’ उस विरोधपूर्ण भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִגָּרַע
  choice: मिट जाए
  rationale: निफ़अल रूप यहाँ पिता के नाम के कुल से लुप्त या हटा दिए जाने का भाव देता है। ‘मिट जाए’ नाम और स्मृति के खो जाने की इब्रानी छवि को स्वाभाविक हिंदी में रखता है।
- source_word: שֵׁם
  choice: नाम
  rationale: मूल शब्द को सीधे रखा गया है; प्रसंग में यह कुल के भीतर पिता की वंशगत पहचान और स्मृति को भी सूचित करता है।
- source_word: מִתּוֹךְ מִשְׁפַּחְתּוֹ
  choice: उनके कुल में से
  rationale: भूमि-विभाजन के प्रसंग में מִשְׁפָּחָה विस्तृत परिवार से अधिक विशिष्ट वंश-समूह है; ‘कुल’ आधुनिक हिंदी में उपयुक्त है।
- source_word: כִּי אֵין לוֹ בֵּן
  choice: केवल इसलिए ... कि उनका कोई बेटा नहीं था
  rationale: ‘बेटा’ मूल के लिंग-विशिष्ट कानूनी संदर्भ को बनाए रखता है। कथा में पिता की मृत्यु हो चुकी है, इसलिए हिंदी में भूतकाल स्वाभाविक है; ‘केवल इसलिए’ विरोध की धार स्पष्ट करता है।
- source_word: תְּנָה לָּנוּ
  choice: हमें भी ... दीजिए
  rationale: आज्ञार्थक निवेदन को सम्मानसूचक बहुवचन में व्यक्त किया गया है। ‘भी’ प्रसंगानुकूल समावेशन का भाव देता है, बिना मांग की वस्तु बदले।
- source_word: אֲחֻזָּה
  choice: भूमि का एक हिस्सा
  rationale: यह कुल के भीतर स्थायी भूमि-अधिकार या विरासत में मिले भू-भाग का संकेत है। साधारण पाठक के लिए ‘भूमि का एक हिस्सा’ मात्र ‘सम्पत्ति’ से अधिक स्पष्ट है।
- source_word: בְּתוֹךְ אֲחֵי אָבִינוּ
  choice: हमारे पिता के भाइयों के बीच
  rationale: मूल में पुरुष-वाचक और विशिष्ट संबंध है; इसलिए इसे व्यापक ‘रिश्तेदारों’ में नहीं बदला गया।
theological_decisions:
- issue: उत्तराधिकार की लिंग-विशिष्ट भाषा
  choice: बेटा / पिता के भाई
  alternative: संतान / रिश्तेदार
  rationale: इब्रानी पाठ कानूनी प्रश्न के कारण स्पष्ट पुरुष-वाचक संज्ञाएँ प्रयोग करता है। उन्हें लिंग-निरपेक्ष करने से उस समय की उत्तराधिकार व्यवस्था और याचिका का तनाव धुंधला पड़ जाएगा।
- issue: पिता के ‘नाम’ का कुल से लुप्त होना
  choice: नाम ... मिट जाए
  alternative: नाम घट जाए / हटा दिया जाए
  rationale: ‘नाम’ को वंश, स्मृति या कानूनी दर्जे जैसे किसी एक अर्थ में सीमित नहीं किया गया; हिंदी मुहावरा इन परतों को साथ रहने देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। बेटियाँ मूसा और अगुओं से निवेदन कर रही हैं, इसलिए ‘दीजिए’ सम्मानसूचक है। ‘कुल’ और ‘भूमि का एक हिस्सा’ कानूनी-सांस्कृतिक संदर्भ को सामान्य हिंदी पाठक के लिए स्पष्ट करते हैं।
