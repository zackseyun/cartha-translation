base_translation:
  language: en
  yaml_path: translation/ot/numbers/027/020.yaml
  text: And you shall put some of your splendor on him[c][b][a], so that all the congregation of the sons of Israel may obey.
translation:
  language: hi
  text: तू अपने गौरव[a] में से कुछ उस पर रख, ताकि इस्राएलियों की सारी मण्डली उसकी बात माने[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने प्रताप में से कुछ” अथवा “अपने सम्मान में से कुछ।” इब्रानी शब्द पद के साथ जुड़ी गरिमा और अधिकार का भाव भी रख सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उसकी सुने।” इब्रानी क्रिया सुनने, ध्यान देने और आज्ञा मानने—तीनों का भाव रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּה
  choice: तू ... रख
  rationale: נתן का मूल अर्थ ‘देना’ है, पर עַל के साथ अभिषेक/नियुक्ति के इस प्रसंग में ‘उस पर रख’ प्रदान किए जाने की छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵהוֹדְךָ
  choice: अपने गौरव में से कुछ
  rationale: הוֹד गौरव, प्रताप, महिमा या पद से जुड़ी प्रतिष्ठा व्यक्त कर सकता है। מִן अंश का संकेत देता है; इसलिए ‘में से कुछ’ आंशिक प्रदान को स्पष्ट रखता है और केवल ‘अधिकार’ कहकर अर्थ को संकीर्ण नहीं करता।
- source_word: עָלָיו
  choice: उस पर
  rationale: עַל और पुरुषवाचक प्रत्यय का सीधा अनुवाद, जो प्रदान किए जाने की मूल छवि सुरक्षित रखता है।
- source_word: לְמַעַן
  choice: ताकि
  rationale: यह उद्देश्यसूचक अव्यय है; ‘ताकि’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: יִשְׁמְעוּ
  choice: उसकी बात माने
  rationale: שׁמע सुनने के साथ ध्यान देने और आज्ञापालन का अर्थ भी रखता है। नेतृत्व सौंपने के प्रसंग में ‘उसकी बात माने’ सुनने और मानने की अर्थ-छाया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל עֲדַת
  choice: सारी मण्डली
  rationale: עֵדָה इस्राएल के संगठित समुदाय को दर्शाता है; ‘मण्डली’ बाइबलीय हिन्दी में परिचित और यहाँ उपयुक्त है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यह सामुदायिक पद पूरे इस्राएली लोगों को सूचित करता है। ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
theological_decisions:
- issue: मूसा से यहोशू को प्रदान किए जाने वाले הוֹד का स्वरूप
  choice: ‘गौरव’ रखा गया है, साथ में टिप्पणी में ‘प्रताप/सम्मान’ और पदगत अधिकार की अर्थ-छाया बताई गई है।
  alternative: ‘अधिकार’ या ‘प्रताप’
  rationale: मूल शब्द केवल प्रशासनिक अधिकार नहीं, बल्कि गरिमा, प्रताप और सम्मान भी व्यक्त करता है। प्रसंग पदगत अधिकार की ओर संकेत करता है, पर मुख्य पाठ में ‘गौरव’ मूल की व्यापकता और तनाव को बेहतर सुरक्षित रखता है।
- issue: उद्देश्य-वाक्य में שׁמע का बल
  choice: ‘उसकी बात माने’
  alternative: ‘उसकी सुने’ या ‘उसकी आज्ञा माने’
  rationale: इब्रानी क्रिया सुनना, ध्यान देना और मानना—इन अर्थों को समेट सकती है। ‘बात माने’ नेतृत्व के प्रसंग में अपेक्षित आज्ञापालन बताता है, बिना क्रिया को अत्यधिक औपचारिक बनाने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानपूर्ण बाइबलीय शैली अपनाई गई है। परमेश्वर द्वारा मूसा को दिए गए एकवचन आदेश के लिए ‘तू’ रखा गया है। ‘इस्राएलियों’ सामुदायिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; मुख्य पाठ मूल के अस्पष्ट הוֹד को ‘गौरव’ के रूप में बनाए रखता है।
