translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त जनगणना-सूची की शैली रखी गई है। ‘अपने-अपने’ वितरणात्मक भाव को स्पष्ट करता है। अंग्रेज़ी परामर्श-पाठ में [a] बेला के बाद छपा है, पर उसकी टिप्पणी अहीराम के पाठांतर से संबंधित है; इसलिए स्रोत-साक्ष्य के अनुसार चिह्न अहीराम के बाद रखा गया है।
