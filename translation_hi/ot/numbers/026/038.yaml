  text: בְּנֵ֣י בִנְיָמִן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/בֶ֗לַע מִשְׁפַּ֨חַת֙ הַ/בַּלְעִ֔י לְ/אַשְׁבֵּ֕ל מִשְׁפַּ֖חַת הָֽ/אַשְׁבֵּלִ֑י לַ/אֲחִירָ֕ם מִשְׁפַּ֖חַת הָ/אֲחִירָמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/038.yaml
  text: 'The sons of Benjamin by their clans: of Bela[a], the clan of the Belaites; of Ashbel, the clan of the Ashbelites; of Ahiram, the clan of the Ahiramites.'
translation:
  language: hi
  text: 'बिन्यामीन के वंशज अपने-अपने कुलों के अनुसार ये थे: बेला से बेलाइयों का कुल; अशबेल से अशबेलियों का कुल; और अहीराम[a] से अहीरामियों का कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मासोरेटिक पाठ में यहाँ “अहीराम” है; कुछ अन्य पाठ-परंपराओं और अनुवादों में इसके अनुरूप नाम “अहीआम” मिलता है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशज
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर जनगणना की इस वंशावली में यह आगे की संतानों को भी समेटता है; ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्रीय उपसमूह या clan को दर्शाता है; ‘कुल’ सहज और गरिमापूर्ण हिन्दी है।
- source_word: לְבֶלַע ... מִשְׁפַּחַת הַבַּלְעִי
  choice: बेला से बेलाइयों का कुल
  rationale: לְ वंश-उद्गम बताता है और gentilic הַבַּלְעִי बेला से निकले कुल का नाम है; ‘से’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְאַשְׁבֵּל ... מִשְׁפַּחַת הָאַשְׁבֵּלִי
  choice: अशबेल से अशबेलियों का कुल
  rationale: नाम और उससे बने कुलनाम के बीच मूल पाठ का संबंध समानांतर हिन्दी संरचना में सुरक्षित रखा गया है।
- source_word: לַאֲחִירָם ... מִשְׁפַּחַת הָאֲחִירָמִי
  choice: अहीराम से अहीरामियों का कुल
  rationale: मुख्य पाठ में मासोरेटिक אֲחִירָם का अनुसरण किया गया है और उससे बने gentilic को ‘अहीरामियों’ के रूप में व्यक्त किया गया है।
