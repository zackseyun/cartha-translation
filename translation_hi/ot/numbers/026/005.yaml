  text: 'Reuben[a], the firstborn of Israel: the sons of Reuben: of Hanoch, the clan of the Hanochites; of Pallu, the clan of the Palluites.'
translation:
  language: hi
  text: 'रूबेन[क] इस्राएल का पहलौठा था। रूबेन के पुत्र: हनोक से हनोकी कुल; पल्लू से पल्लूई कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: 'या, अधिक शाब्दिक: “रूबेन के पुत्र: हनोक, हनोकी कुल; पल्लू, पल्लूई कुल।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּכֹר יִשְׂרָאֵל
  choice: इस्राएल का पहलौठा
  rationale: यह पदबंध रूबेन की पारिवारिक स्थिति बताता है। ‘पहलौठा’ आधुनिक हिन्दी में स्वाभाविक है और ‘पुत्र’ जोड़े बिना मूल का भाव रखता है।
- source_word: בְּנֵי רְאוּבֵן
  choice: रूबेन के पुत्रों में
  rationale: मूलतः इसका अर्थ ‘रूबेन के पुत्र’ है; ‘में’ आगे दी गई वंशगत सूची को हिन्दी में सहज ढंग से प्रस्तुत करता है।
- source_word: חֲנוֹךְ
  choice: हनोक
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: जनगणना के संदर्भ में यह गोत्र के भीतर वंशगत सामाजिक इकाई को दर्शाता है; हिन्दी में ‘कुल’ संक्षिप्त और उपयुक्त है।
- source_word: הַחֲנֹכִי
  choice: हनोकी
  rationale: यह हनोक से उत्पन्न वंशगत समूह का नाम है; प्रत्ययात्मक रूप को ‘हनोकी’ से सुरक्षित रखा गया है।
- source_word: לְפַלּוּא
  choice: पल्लू से
  rationale: यहाँ לְ सूची में कुल के पूर्वज को प्रस्तुत करता है; ‘से’ वंशोत्पत्ति का संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַפַּלֻּאִי
  choice: पल्लूई
  rationale: यह पल्लू से उत्पन्न वंशगत समूह का नाम है; हिन्दी में जातिवाचक रूप ‘पल्लूई’ रखा गया है।
