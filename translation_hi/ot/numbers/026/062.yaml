source:
  edition: WLC
  text: וַ/יִּהְי֣וּ פְקֻדֵי/הֶ֗ם שְׁלֹשָׁ֤ה וְ/עֶשְׂרִים֙ אֶ֔לֶף כָּל זָכָ֖ר מִ/בֶּן חֹ֣דֶשׁ וָ/מָ֑עְלָ/ה כִּ֣י לֹ֣א הָתְפָּקְד֗וּ בְּ/תוֹךְ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל כִּ֠י לֹא נִתַּ֤ן לָ/הֶם֙ נַחֲלָ֔ה בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/062.yaml
  text: And those counted from among them were twenty-three thousand[a], every male from a month old and upward, because they were not counted among the sons of Israel, because no inheritance was given to them among the sons of Israel.
translation:
  language: hi
  text: उनकी गिनती तेईस हज़ार थी—एक महीने या उससे अधिक आयु का हर पुरुष। उन्हें इस्राएल के पुत्रों[a] में नहीं गिना गया था, क्योंकि इस्राएल के पुत्रों में उन्हें कोई विरासत नहीं दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों।” “इस्राएल के पुत्रों” के दोनों प्रयोगों के लिए यही विकल्प समझें।
    reason: मूल בְּנֵי יִשְׂרָאֵל का शाब्दिक पारिवारिक रूप और उसका स्वाभाविक सामुदायिक अर्थ, दोनों पाठक के सामने रखने के लिए।
lexical_decisions:
- source_word: פְקֻדֵיהֶם
  choice: उनमें गिने गए पुरुषों की संख्या
  rationale: जनगणना के संदर्भ में פקד से गिने या दर्ज किए गए लोगों का बोध होता है। हिंदी में यह वाक्यांश स्वाभाविक ढंग से गणना का कुल परिणाम बताता है; अगले पदबंध ‘हर पुरुष’ से समूह भी स्पष्ट हो जाता है।
- source_word: שְׁלֹשָׁה וְעֶשְׂרִים אֶלֶף
  choice: तेईस हज़ार
  rationale: इब्रानी संख्या का मानक हिंदी रूप।
- source_word: כָּל זָכָר
  choice: हर पुरुष
  rationale: זָכָר पुरुष-लिंग के प्रत्येक व्यक्ति को दर्शाता है; इसमें एक महीने के शिशु भी सम्मिलित हैं, इसलिए ‘हर पुरुष’ को आयु-सूचक अगले पदबंध के साथ पढ़ा जाना चाहिए।
- source_word: מִבֶּן חֹדֶשׁ וָמָעְלָה
  choice: एक महीने और उससे अधिक आयु का
  rationale: आयु की निचली सीमा को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: הָתְפָּקְדוּ
  choice: नहीं गिना गया था
  rationale: उसी जनगणना-संबंधी मूल פקד की संगति बनाए रखता है और हिंदी में स्पष्ट है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के साथ / इस्राएल के पुत्रों के बीच
  rationale: בְּתוֹךְ का संबंध प्रसंग के अनुसार पहली बार संयुक्त जनगणना से और दूसरी बार विरासत के वितरण-समुदाय से है। ‘इस्राएल के पुत्र’ मूल की पारिवारिक-संधीय अभिव्यक्ति को बनाए रखता है।
- source_word: נִתַּן לָהֶם נַחֲלָה
  choice: उन्हें कोई विरासत नहीं दी गई थी
  rationale: इब्रानी के कर्मवाच्य को सुरक्षित रखता है। נַחֲלָה यहाँ भूमि-विभाजन में मिलने वाले वंशागत भाग को सूचित करता है, जिसके लिए ‘विरासत’ उपयुक्त है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल इब्रानी की पारिवारिक और वाचा-संबंधी अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है; अधिक संक्षिप्त सामुदायिक अर्थ ‘इस्राएली’ को पादटिप्पणी में विकल्प के रूप में दिया गया है।
- issue: लेवियों को विरासत न दिए जाने का कथन
  choice: उन्हें कोई विरासत नहीं दी गई थी
  alternative: उन्हें कोई भूमि का भाग नहीं दिया गया था
  rationale: נַחֲלָה की व्यापक धर्मवैधानिक धारणा को केवल भूमि तक सीमित किए बिना ‘विरासत’ से व्यक्त किया गया है, यद्यपि तत्काल प्रसंग भूमि-विभाजन का है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। जनगणना-संबंधी शब्दावली को सरल रखा गया है, जबकि ‘इस्राएल के पुत्र’ और ‘विरासत’ जैसे मूल-पाठ के महत्त्वपूर्ण पारिवारिक तथा धर्मवैधानिक शब्द सुरक्षित हैं।
