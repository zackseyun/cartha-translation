id: NUM.26.1
reference: Numbers 26:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל מֹשֶׁ֔ה וְ/אֶ֧ל אֶלְעָזָ֛ר בֶּן אַהֲרֹ֥ן הַ/כֹּהֵ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/001.yaml
  text: And Yahweh spoke to Moses and to Eleazar son of Aaron the priest[a], saying,
translation:
  language: hi
  text: और याहवे ने मूसा और हारून याजक के पुत्र एलआज़ार से कहा:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इब्रानी कथन-सूत्र है, “कहा ... यह कहते हुए।” हिंदी में इसे स्वाभाविक रूप से “कहा:” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने ... से कहा
  rationale: यह क्रिया सामान्यतः ‘कहा’ व्यक्त करती है। हिंदी में संबोधित व्यक्तियों के साथ ‘ने ... से कहा’ स्वाभाविक और स्रोत के अनुरूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का प्रचलित मानक हिंदी रूप।
- source_word: אֶלְעָזָר
  choice: एलआज़ार
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण, जिसमें मूल उच्चारण का दीर्घ स्वर सुरक्षित है।
- source_word: בֶּן אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के पुत्र
  rationale: संबंधसूचक पदबंध एलआज़ार की वंशावली बताता है और ‘याजक’ को हारून की निश्चित उपाधि के रूप में प्रस्तुत करता है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष अनुवाद के बजाय ‘कहा:’ में समाहित
  rationale: इब्रानी कथन-सूत्र में ‘कहा ... कहने को’ आता है; आधुनिक हिंदी में अगले कथन से पहले ‘कहा:’ उसका स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: स्रोत-पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: הַכֹּהֵן (‘याजक’) किसके साथ जुड़ता है
  choice: हारून याजक
  alternative: एलआज़ार याजक, जो हारून का पुत्र था
  rationale: इब्रानी पदक्रम और इस परिचय की स्वाभाविक वंशावली-संरचना उपाधि को निकटवर्ती ‘हारून’ से जोड़ती है; अनुवाद उसी संबंध को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। आरंभिक ‘और’ से पूर्ववर्ती कथा के साथ संबंध सुरक्षित है; अगले पद में आने वाले प्रत्यक्ष कथन के कारण अंत में द्विबिंदु रखा गया है।
