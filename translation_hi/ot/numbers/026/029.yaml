  text: בְּנֵ֣י מְנַשֶּׁ֗ה לְ/מָכִיר֙ מִשְׁפַּ֣חַת הַ/מָּכִירִ֔י וּ/מָכִ֖יר הוֹלִ֣יד אֶת גִּלְעָ֑ד לְ/גִלְעָ֕ד מִשְׁפַּ֖חַת הַ/גִּלְעָדִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/029.yaml
  text: 'The sons of Manasseh: of Machir, the clan of the Machirites; and Machir fathered Gilead; of Gilead, the clan of the Gileadites.'
translation:
  language: hi
  text: 'मनश्शे के वंशज ये थे: माकीर से माकीरी कुल निकला। माकीर ने गिलाद को जन्म दिया, और गिलाद से गिलादी कुल निकला।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशज
  rationale: शाब्दिक अर्थ ‘मनश्शे के पुत्र’ है, पर इस जनगणना और वंशावली के प्रसंग में यह व्यापक रूप से उसके वंशजों को सूचित करता है। हिंदी में ‘वंशज’ आशय को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לְמָכִיר ... לְגִלְעָד
  choice: माकीर से ... गिलाद से
  rationale: इस जनगणना-सूत्र में उपसर्ग לְ संबंधित वंश-शाखा का परिचय देता है। हिंदी का ‘से’ उस उद्गम या वंश-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: यहाँ शब्द इस्राएली गोत्र के भीतर की वंशगत इकाई को दर्शाता है। आधुनिक हिंदी में ‘कुल’ इस जनगणना-संदर्भ के लिए ‘परिवार’ से अधिक उपयुक्त है।
- source_word: הַמָּכִירִי ... הַגִּלְעָדִי
  choice: माकीरी ... गिलादी
  rationale: इन संबंधवाचक जाति-नामों को हिंदी में कुलनाम के विशेषण के रूप में रखना संक्षिप्त, स्पष्ट और मूल की संरचना के निकट है।
- source_word: וּמָכִיר הוֹלִיד אֶת גִּלְעָד
  choice: माकीर से गिलाद उत्पन्न हुआ
  rationale: हिफ़ील वंशावली में पिता बनने या संतान उत्पन्न करने का भाव देता है। यह हिंदी रूप पुरुष-वंश संबंध को स्पष्ट रखते हुए ‘जन्म दिया’ जैसी अस्वाभाविक अभिव्यक्ति से बचता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज जनगणना-शैली अपनाई गई है। दोहराव मूल के समानांतर वंश-सूत्र को बनाए रखता है; किसी अतिरिक्त धर्मवैज्ञानिक व्याख्या को नहीं जोड़ा गया।
