base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/021.yaml
  text: 'The sons of Perez were: of Hezron, the clan of the Hezronites; of Hamul, the clan of the Hamulites.'
translation:
  language: hi
  text: 'पेरेस के पुत्र ये थे: हेस्रोन से हेस्रोनियों का कुल, और हामूल से हामूलियों का कुल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ये थे
  rationale: वंशावली और जनगणना की इस सूची में यह क्रिया परिचयात्मक संयोजक के रूप में प्रयुक्त है; ‘ये थे’ स्वाभाविक हिन्दी में सूची आरम्भ करती है।
- source_word: בְנֵי
  choice: पुत्र
  rationale: यहाँ निकट पुरुष वंशजों और उनसे निकले कुलों का उल्लेख है; ‘पुत्र’ इब्रानी रूप और वंशावली के आशय दोनों को बनाए रखता है।
- source_word: פֶרֶץ
  choice: पेरेस
  rationale: इब्रानी उच्चारण के निकट आधुनिक हिन्दी लिप्यंतरण।
- source_word: לְחֶצְרֹן
  choice: हेसरोन से
  rationale: इस जनगणना-सूत्र में לְ वंश या कुल की उत्पत्ति सूचित करता है; हिन्दी में ‘से’ उस वंशगत संबंध को सहज रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: गिनती की जनगणना में यह गोत्र के भीतर की वंशगत सामाजिक इकाई को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में संक्षिप्त, प्रतिष्ठित और सुबोध है।
- source_word: הַחֶצְרֹנִי
  choice: हेसरोनियों
  rationale: यह वंश-सूचक रूप हेसरोन से निकले समूह को दर्शाता है; बहुवचन ‘हेसरोनियों’ उसी सामूहिक अर्थ को स्पष्ट करता है।
- source_word: לְחָמוּל
  choice: हामूल से
  rationale: यहाँ भी לְ कुल की वंशगत उत्पत्ति दर्शाता है, जिसे ‘से’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֶחָמוּלִי
  choice: हामूलियों
  rationale: वंश-सूचक रूप हामूल से निकले समूह का नाम है; ‘हामूलियों’ हिन्दी में उसका स्पष्ट बहुवचन रूप है।
