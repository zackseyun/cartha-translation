  rationale: बार-बार आया אֶת नामों को कर्म के रूप में चिह्नित करता है; हिन्दी में इसका स्वतंत्र समकक्ष आवश्यक नहीं है।
- source_word: נָדָב
  choice: नादाब
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲבִיהוּא
