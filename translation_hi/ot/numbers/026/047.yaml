  text: 'These are the clans of the sons of Asher according to those numbered of them: fifty-three thousand four hundred[a].'
translation:
  language: hi
  text: आशेर के पुत्रों के कुल ये थे; उनके गिने हुए लोगों की संख्या तिरपन हज़ार चार सौ थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “उनके गिने हुओं के अनुसार।” इब्रानी में यह जनगणना का पारिभाषिक प्रयोग है और उन लोगों की ओर संकेत करता है जिन्हें आधिकारिक रूप से दर्ज या गिना गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये थे
  rationale: बहुवचन संकेतवाचक शब्द इस जनगणना-सारांश का परिचय देता है; स्वाभाविक हिन्दी में भूतकालीन सहायक क्रिया जोड़ना उचित है।
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: यहाँ आशय एक गोत्र के भीतर के विस्तृत वंश-समूहों से है, न कि केवल एकल परिवारों से; ‘कुल’ आधुनिक हिन्दी में इस सामाजिक इकाई को सहज रूप से व्यक्त करता है।
- source_word: בְּנֵי אָשֵׁר
  choice: आशेर के पुत्रों
  rationale: ‘पुत्रों’ मूल इब्रानी वंशावली-संबंधी रूप को बनाए रखता है; प्रसंग में इससे आशेर के वंशज अभिप्रेत हैं।
- source_word: לִפְקֻדֵיהֶם
  choice: उनमें गिने गए लोगों की संख्या
  rationale: פקד का यह रूप जनगणना में आधिकारिक रूप से दर्ज या गिने गए लोगों को सूचित करता है। हिन्दी वाक्य-विन्यास में इसे संख्या-सूचक पदबंध के रूप में व्यक्त करने से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: שְׁלֹשָׁה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: तिरपन हज़ार चार सौ
  rationale: मूल की ठीक संख्या को आधुनिक मानक हिन्दी की सामान्य संख्या-शैली में प्रस्तुत किया गया है।
