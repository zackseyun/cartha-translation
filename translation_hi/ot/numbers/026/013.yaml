  text: לְ/זֶ֕רַח מִשְׁפַּ֖חַת הַ/זַּרְחִ֑י לְ/שָׁא֕וּל מִשְׁפַּ֖חַת הַ/שָּׁאוּלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/013.yaml
  text: of Zerah, the clan of the Zerahites; of Shaul, the clan of the Shaulites.
translation:
  language: hi
  text: जेरह से जेरहियों का कुल; शाऊल से शाऊलियों का कुल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/זֶרַח
  choice: जेरह से
  rationale: इस जनगणना-सूची में उपसर्ग לְ वंशगत संबंध दर्शाता है। हिंदी में ‘जेरह से’ यह स्पष्ट करता है कि आगे उल्लिखित कुल जेरह से निकला है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: जनजातीय जनगणना के संदर्भ में מִשְׁפָּחָה बड़े परिवार से अधिक एक वंशगत उपसमूह को दर्शाता है; आधुनिक हिंदी में ‘कुल’ इस संरचना को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַזַּרְחִי
  choice: जेरहियों
  rationale: यह संबंधवाचक रूप जेरह के वंशजों या उनसे बने समूह को सूचित करता है। ‘जेरही’ का बहुवचन संबंधकारक रूप ‘जेरहियों’ हिंदी वाक्य में यही अर्थ देता है।
- source_word: לְ/שָׁאוּל
  choice: शाऊल से
  rationale: पहले पदबंध की तरह यहाँ भी לְ वंशगत संबद्धता दर्शाता है; ‘शाऊल से’ सूची की समानांतर रचना बनाए रखता है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: दोहराए गए जनगणना-सूत्र में समान अर्थ और लय बनाए रखने के लिए ‘का कुल’ रखा गया है।
- source_word: הַשָּׁאוּלִי
  choice: शाऊलियों
  rationale: यह रूप शाऊल से उत्पन्न वंशगत समूह का नाम है। ‘शाऊली’ का बहुवचन संबंधकारक रूप ‘शाऊलियों’ स्रोत की संरचना को स्वाभाविक हिंदी में व्यक्त करता है।
