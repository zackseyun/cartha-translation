  text: To these the land shall be divided as an inheritance according to the number of names[a].
translation:
  language: hi
  text: इन लोगों को भूमि विरासत के रूप में नामों की गिनती के अनुसार बाँटी जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘व्यक्तियों की गिनती के अनुसार’; शाब्दिक: ‘नामों की गिनती के अनुसार।’'
    reason: lexical_alternative
lexical_decisions:
- source_word: לָאֵלֶּה
  choice: इन्हीं लोगों को
  rationale: लְ उपसर्ग प्राप्तकर्ताओं को सूचित करता है और אֵלֶּה पहले गिने गए लोगों की ओर संकेत करता है। हिंदी में ‘इन्हीं लोगों को’ इस संदर्भ और बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֵּחָלֵק
  choice: बाँटा जाए
  rationale: חלק का निफ़अल अपूर्ण रूप भूमि के बाँटे या वितरित किए जाने को व्यक्त करता है। आज्ञात्मक संदर्भ में हिंदी का ‘बाँटा जाए’ उपयुक्त है।
- source_word: הָאָרֶץ
  choice: वह देश
  rationale: यहाँ הָאָרֶץ इस्राएल को बाँटे जाने वाले विशिष्ट देश को सूचित करता है; ‘वह देश’ निश्चित संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: בְּנַחֲלָה
  choice: विरासत के रूप में
  rationale: נַחֲלָה वंशानुगत संपत्ति अथवा आवंटित अधिकार-भाग का बोध कराता है। ‘विरासत के रूप में’ इसके कानूनी और वाचा-संबंधी अर्थ को बनाए रखता है।
- source_word: בְּמִסְפַּר
  choice: की गिनती के अनुसार
  rationale: यहाँ בְּ मानक या माप का अर्थ देता है। ‘गिनती के अनुसार’ वितरण के जनसंख्या-आधारित मानदंड को सहज हिंदी में व्यक्त करता है।
- source_word: שֵׁמוֹת
  choice: नामों
  rationale: इब्रानी में शब्दशः ‘नाम’ है। मुख्य पाठ में इसे बनाए रखने से मूल की अभिव्यक्ति सुरक्षित रहती है; जनगणना के संदर्भ में इसका आशय व्यक्तियों से है, जिसे पादटिप्पणी स्पष्ट करती है।
