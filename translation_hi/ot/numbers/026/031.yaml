  text: וְ/אַ֨שְׂרִיאֵ֔ל מִשְׁפַּ֖חַת הָֽ/אַשְׂרִֽאֵלִ֑י וְ/שֶׁ֕כֶם מִשְׁפַּ֖חַת הַ/שִּׁכְמִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/031.yaml
  text: from Ashriel[a], the clan of the Ashrielites; and from Shechem, the clan of the Shechemites.
translation:
  language: hi
  text: अस्रीएल से अस्रीएलियों का कुल; और शकेम से शकेमियों का कुल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַשְׂרִיאֵל
  choice: अस्रीएल
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण; यहाँ שׂ की ध्वनि ‘स’ है, इसलिए ‘अश्रीएल’ के बजाय ‘अस्रीएल’ मूल पाठ के अधिक निकट है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: इस जनगणना और वंशावली-संदर्भ में यह गोत्र के भीतर की वंश-आधारित सामाजिक इकाई को सूचित करता है; आधुनिक हिन्दी बाइबिलीय शैली में ‘कुल’ स्वाभाविक और संक्षिप्त है।
- source_word: הָאַשְׂרִיאֵלִי
  choice: अस्रीएलियों
  rationale: निश्चित वंशज-समूह का सामूहिक नाम; हिन्दी बहुवचन ‘अस्रीएलियों’ सम्बन्धसूचक रचना में सहज है।
- source_word: שֶׁכֶם
  choice: शकेम
  rationale: व्यक्तिनाम का इब्रानी उच्चारणानुसार प्रचलित हिन्दी लिप्यंतरण; यहाँ यह स्थान नहीं, कुलपुरुष का नाम है।
- source_word: הַשִּׁכְמִי
  choice: शकेमियों
  rationale: शकेम से निकले वंशज-समूह के लिए स्वाभाविक हिन्दी सामूहिक बहुवचन।
- source_word: וְ
  choice: और
  rationale: सूची की दोनों प्रविष्टियों को जोड़ने वाला सामान्य समुच्चयबोधक।
