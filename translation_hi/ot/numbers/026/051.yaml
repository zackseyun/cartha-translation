  yaml_path: translation/ot/numbers/026/051.yaml
  text: 'These are the numbered men of the sons of Israel: six hundred one thousand seven hundred thirty[a][b].'
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] में से जो पुरुष गिने गए थे[b], उनकी कुल संख्या छह लाख एक हज़ार सात सौ तीस थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों में” अथवा “इस्राएल की सन्तानों में।” शाब्दिक अर्थ है “इस्राएल के पुत्रों में।”
    reason: lexical_alternative
  - marker: b
    text: या “गिने गए लोग”; इब्रानी पद जनगणना में दर्ज किए गए व्यक्तियों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये थे
  rationale: बहुवचन संकेतवाचक पद जनगणना के कुल परिणाम का परिचय देता है; स्वाभाविक हिन्दी में भूतकालीन संयोजक क्रिया जोड़ी गई है।
- source_word: פְּקוּדֵי
  choice: गिने गए पुरुष
  rationale: פקד से बना यह पद जनगणना में दर्ज और गिने गए व्यक्तियों को सूचित करता है। प्रसंग 20 वर्ष या उससे अधिक आयु के युद्ध-योग्य पुरुषों की गणना का है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में
  rationale: इब्रानी का पारिवारिक और पुरुषवाचक रूप सुरक्षित रखा गया है; 'में' हिन्दी में इस समूह के भीतर गिने गए पुरुषों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וָאָלֶף שְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: छः लाख एक हज़ार सात सौ तीस
  rationale: इब्रानी संख्या के सभी योगात्मक घटकों को मानक भारतीय संख्या-पद्धति में ठीक 601,730 के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों में
  alternative: इस्राएलियों में; इस्राएल की सन्तानों में
  rationale: मूल का शाब्दिक पारिवारिक और पुरुषवाचक पद बनाए रखा गया है, क्योंकि इस जनगणना में पुरुष गिने गए थे; साथ ही यह अभिव्यक्ति राष्ट्रीय समुदाय को भी सूचित करती है।
- issue: जनगणना के प्रसंग में פְּקוּדֵי का अर्थ
  choice: गिने गए पुरुष
  alternative: गिने गए लोग; जनगणना की कुल संख्या
  rationale: यह पद केवल अमूर्त कुल संख्या नहीं, बल्कि जनगणना में दर्ज व्यक्तियों को दर्शाता है। अध्याय के प्रसंग के कारण 'पुरुष' स्पष्ट और स्रोत-संगत है।
