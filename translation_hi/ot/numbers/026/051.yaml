  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। 'छः लाख' भारतीय पाठकों के लिए स्वाभाविक संख्या-रूप है। मुख्य पाठ में मूल की पारिवारिक अभिव्यक्ति रखी गई है और वैकल्पिक सहज रूप पादटिप्पणी में दिए गए हैं।
