base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/033.yaml
  text: Zelophehad son of Hepher had no sons[a], but only daughters; and the names of Zelophehad’s daughters were Mahlah, Noah, Hoglah, Milcah[b], and Tirzah.
translation:
  language: hi
  text: और हेपेर के पुत्र सलोफहाद के कोई पुत्र नहीं थे,[a] केवल बेटियाँ थीं। सलोफहाद की बेटियों के नाम महला, नोआ,[b] होग्ला, मिल्का और तिर्सा थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “उसके लिए पुत्र नहीं थे, केवल बेटियाँ थीं।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नोआ” सलोफहाद की एक बेटी का नाम है; यह जलप्रलय के वृत्तांत वाले नूह का नाम नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/צְלָפְחָד בֶּן חֵפֶר
  choice: और हेपेर के पुत्र सलोफाद
  rationale: आरंभिक ו को प्रसंग से जोड़ने वाले स्वाभाविक हिन्दी ‘और’ से व्यक्त किया गया है; בֶּן חֵפֶר वंश-संबंध को ‘हेपेर के पुत्र’ के रूप में सुरक्षित रखता है। नामों का देवनागरी लिप्यंतरण मूल इब्रानी उच्चारण के निकट रखा गया है।
- source_word: לֹא הָיוּ ל/וֹ בָּנִים כִּי אִם בָּנוֹת
  choice: के कोई पुत्र नहीं थे, केवल बेटियाँ थीं
  rationale: इब्रानी का शाब्दिक अस्तित्व-सूचक ढाँचा हिन्दी में स्वाभाविक अधिकार-सूचक वाक्य से व्यक्त किया गया है। ‘पुत्र’ और ‘बेटियाँ’ का स्पष्ट लैंगिक विरोध सुरक्षित है; כִּי אִם का अपवादात्मक बल ‘केवल’ से प्रकट होता है।
- source_word: וְ/שֵׁם בְּנוֹת צְלָפְחָד
  choice: सलोफाद की बेटियों के नाम ... थे
  rationale: इब्रानी שֵׁם व्याकरणतः एकवचन है, पर यहाँ बहुवचन बेटियों के नामों का सामूहिक परिचय देता है; इसलिए स्वाभाविक हिन्दी में ‘नाम ... थे’ रखा गया है।
- source_word: מַחְלָה וְ/נֹעָה חָגְלָה מִלְכָּה וְ/תִרְצָה
  choice: महला, नोआ, होगला, मिल्का और तिर्सा
  rationale: व्यक्तिनामों को इब्रानी रूपों के निकट देवनागरी में लिप्यंतरित किया गया है। ‘नोआ’ स्त्री का नाम है और जलप्रलय वाले नूह के हिन्दी नाम-रूप से अलग रखा गया है।
