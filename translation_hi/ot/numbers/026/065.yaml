- source_word: אָמַר ... לָהֶם
  choice: उनके विषय में कहा था
  rationale: संदर्भ में घोषणा उन लोगों के विषय में है; पूर्णभूत रूप इस घोषणा के जनगणना के परिणाम से पहले होने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מוֹת יָמֻתוּ
  choice: निश्चय ही मरेंगे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute मृत्यु की निश्चितता पर बल देता है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वन्य प्रदेश को दर्शाता है; पंचग्रन्थ के प्रसंग में 'जंगल' प्रचलित और सहज हिन्दी है।
- source_word: וְלֹא נוֹתַר מֵהֶם אִישׁ
  choice: और उनमें से ... एक भी पुरुष नहीं बचा
  rationale: אִישׁ के पुल्लिंग एकवचन और वितरणात्मक बल को रखते हुए हिन्दी में स्वाभाविक रूप से बताया गया है कि उस समूह का एक भी पुरुष शेष नहीं रहा।
- source_word: כִּי אִם
  choice: को छोड़
  rationale: यह नकारात्मक कथन के एकमात्र अपवादों को प्रस्तुत करने वाला मुहावरा है।
- source_word: כָּלֵב בֶּן יְפֻנֶּה
  choice: यपुन्ने के पुत्र कालेब
  rationale: व्यक्तिगत नामों का हिन्दी लिप्यंतरण और patronymic का स्वाभाविक अनुवाद किया गया है।
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: और नून के पुत्र यहोशू
  rationale: व्यक्तिगत नामों का प्रचलित हिन्दी लिप्यंतरण और patronymic का स्वाभाविक अनुवाद किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है; उसे उपाधि से बदलने के बजाय 'याहवे' के रूप में लिप्यंतरित किया गया है।
- issue: מוֹת יָמֻתוּ की बलात्मक रचना
  choice: निश्चय ही मरेंगे
  alternative: मरते हुए मरेंगे / अवश्य मर जाएँगे
  rationale: हिब्रू की बलात्मक infinitive absolute रचना को शाब्दिक रूप से अस्वाभाविक बनाने के बजाय उसकी निश्चितता स्पष्ट रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यवाणी की निश्चितता, अपवादात्मक संरचना और אִישׁ के पुरुषवाची रूप को सुरक्षित रखा गया है।
