base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/065.yaml
  text: For Yahweh had said of them[b][a], ‘They shall surely die in the wilderness,’ and not a man was left of them except Caleb son of Jephunneh and Joshua son of Nun.
translation:
  language: hi
  text: क्योंकि याहवे ने उनसे कहा था, “वे मरुभूमि में निश्चय ही मरेंगे।”[a] और उनमें से एक भी पुरुष नहीं बचा, केवल यपुन्ने का पुत्र कालेब और नून का पुत्र यहोशू।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “मरते हुए मरेंगे” है; यह बलात्मक रचना है, जिसका अर्थ है “निश्चय ही मरेंगे।”
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “और उनमें से कोई भी शेष नहीं रहा” भी हो सकता है; हिब्रू में शाब्दिक रूप से “और उनमें से एक पुरुष भी नहीं बचा” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
