  text: לְ/יָשׁ֕וּב מִשְׁפַּ֖חַת הַ/יָּשׁוּבִ֑י לְ/שִׁמְרֹ֕ן מִשְׁפַּ֖חַת הַ/שִּׁמְרֹנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/024.yaml
  text: of Jashub, the clan of the Jashubites; of Shimron, the clan of the Shimronites.
translation:
  language: hi
  text: याशूब से याशूबियों का कुल; शिम्रोन से शिम्रोनियों का कुल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יָשׁוּב
  choice: याशूब से
  rationale: वंशावली-संबंधी इस जनगणना-सूची में לְ उस पूर्वज का परिचय देता है जिससे कुल का नाम निकला है; हिन्दी में ‘से’ वंशगत उद्गम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: यहाँ מִשְׁפָּחָה गोत्र के भीतर वंशगत समूह को दर्शाता है। आधुनिक हिन्दी में ‘कुल’ इस संक्षिप्त सूची-सूत्र के लिए ‘परिवार’ से अधिक उपयुक्त है।
- source_word: הַ/יָּשׁוּבִי
  choice: याशूबियों
  rationale: यह संबंधवाचक समूह-नाम याशूब के वंशजों को दर्शाता है; ‘याशूबी’ का बहुवचन रूप हिन्दी में उस कुल-समुदाय को स्पष्ट करता है।
- source_word: לְ/שִׁמְרֹן
  choice: शिम्रोन से
  rationale: पहले खंड के समान לְ उस नामधारी पूर्वज को प्रस्तुत करता है जिससे कुल निकला है; समानांतर रचना बनाए रखने के लिए ‘से’ रखा गया है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: दूसरे कुल-सूत्र में भी वही वंशगत इकाई अभिप्रेत है; एकरूपता के लिए वही अनुवाद रखा गया है।
- source_word: הַ/שִּׁמְרֹנִי
  choice: शिम्रोनियों
  rationale: यह संबंधवाचक समूह-नाम शिम्रोन के वंशजों के कुल को सूचित करता है; हिन्दी बहुवचन समुदायगत अर्थ को स्वाभाविक रूप से व्यक्त करता है।
