  language: hi
  text: ये जबूलूनियों के कुल हैं; इन कुलों में गिने गए लोगों की संख्या साठ हज़ार पाँच सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये ... थे
  rationale: यह बहुवचन संकेतवाचक पद सारांश प्रस्तुत करता है; हिन्दी में गणना-वृत्तांत के संदर्भ में भूतकाल स्वाभाविक है।
- source_word: מִשְׁפְּחֹת
  choice: कुलों
  rationale: जनजातीय जनगणना के संदर्भ में यह निकट परिवारों से बड़े वंशगत समूहों को दर्शाता है; इसलिए ‘कुल’ उपयुक्त है।
- source_word: הַזְּבוּלֹנִי
  choice: जब्दूलूनियों
  rationale: लेखयुक्त जातिवाचक एकवचन यहाँ सामूहिक अर्थ में जब्दूलून के वंशजों के लिए प्रयुक्त है।
- source_word: לִפְקֻדֵיהֶם
  choice: में गिने गए लोगों की संख्या
  rationale: פקד के जनगणना-संबंधी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा कुलों को कुल गणना से जोड़ता है।
- source_word: שִׁשִּׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: साठ हज़ार पाँच सौ
  rationale: मूल की पूर्ण संख्या को मानक हिन्दी शब्दों में प्रस्तुत किया गया है।
