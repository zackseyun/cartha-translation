  yaml_path: translation/ot/numbers/026/028.yaml
  text: 'The sons of Joseph by their clans: Manasseh and Ephraim[a].'
translation:
  language: hi
  text: 'यूसुफ के पुत्र, उनके कुलों के अनुसार: मनश्शे और एप्रैम।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי
  choice: पुत्र
  rationale: यह בֵּן का संबंधवाचक बहुवचन है। वंशावली और जनगणना के संदर्भ में ‘पुत्र’ मूल की औपचारिक वंश-भाषा को स्पष्ट रूप से बनाए रखता है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: व्यक्तिवाचक नाम को हिन्दी बाइबल-परंपरा में प्रचलित रूप में प्रस्तुत किया गया है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: जनगणना और गोत्रीय व्यवस्था में מִשְׁפָּחָה निकट परिवार से व्यापक ‘कुल’ को दर्शाता है; उपसर्ग לְ वर्गीकरण का भाव देता है, जिसे ‘के अनुसार’ स्वाभाविक और औपचारिक रूप से व्यक्त करता है।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: व्यक्तिवाचक तथा गोत्रीय नाम का हिन्दी बाइबल-परंपरा में प्रचलित रूप।
- source_word: וְאֶפְרָיִם
  choice: और एप्रैम
  rationale: संयोजक וְ तथा व्यक्तिवाचक/गोत्रीय नाम को सीधे समन्वय के रूप में प्रस्तुत किया गया है।
