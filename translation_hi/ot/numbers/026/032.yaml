  text: וּ/שְׁמִידָ֕ע מִשְׁפַּ֖חַת הַ/שְּׁמִידָעִ֑י וְ/חֵ֕פֶר מִשְׁפַּ֖חַת הַֽ/חֶפְרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/032.yaml
  text: from Shemida, the clan of the Shemidaites; and from Hepher, the clan of the Hepherites.
translation:
  language: hi
  text: और शमीदा से शमीदाइयों का कुल; और हेपेर से हेपेरियों का कुल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּ/שְׁמִידָע
  choice: और शमीदा से
  rationale: गणना-सूची के इस संक्षिप्त सूत्र में इब्रानी संयोजक के साथ पूर्वपद का भाव निहित है; हिन्दी में वंश-उद्गम स्पष्ट करने के लिए ‘से’ स्वाभाविक है। नाम का लिप्यंतरण ‘शमीदा’ किया गया है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: जनगणना और गोत्रीय सूचियों में यह शब्द एक बड़े गोत्र के भीतर के वंश-समूह को दर्शाता है। आधुनिक हिन्दी में ‘कुल’ संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: הַ/שְּׁמִידָעִי
  choice: शमीदाइयों
  rationale: यह संबंधवाचक रूप शमीदा से जुड़े वंशज-समूह को दर्शाता है; हिन्दी बहुवचन ‘शमीदाइयों’ उस सामूहिक वंश-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְ/חֵפֶר
  choice: और हेपेर से
  rationale: संयोजक अगली समानांतर प्रविष्टि आरम्भ करता है। इब्रानी के लुप्त पूर्वपद को हिन्दी में ‘से’ द्वारा स्पष्ट किया गया है; नाम ‘हेपेर’ मूल व्यंजन-रूप के निकट लिप्यंतरित है।
- source_word: הַֽ/חֶפְרִי
  choice: हेपेरियों
  rationale: संबंधवाचक रूप हेपेर के वंशजों अथवा उनसे संबद्ध कुल को दर्शाता है; ‘हेपेरियों’ हिन्दी में इस सामूहिक अर्थ को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संक्षिप्त वंशावली-सूत्र के अनुरूप रखी गई है। समानांतर रचना और मूल का अर्धविराम-सदृश विभाजन सुरक्षित है; व्यक्तिनामों को देवनागरी में स्रोत-निकट रूप से लिप्यंतरित किया गया है।
