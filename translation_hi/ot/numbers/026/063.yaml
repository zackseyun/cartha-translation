source:
  edition: WLC
  text: אֵ֚לֶּה פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אֶלְעָזָ֖ר הַ/כֹּהֵ֑ן אֲשֶׁ֨ר פָּֽקְד֜וּ אֶת בְּנֵ֤י יִשְׂרָאֵל֙ בְּ/עַֽרְבֹ֣ת מוֹאָ֔ב עַ֖ל יַרְדֵּ֥ן יְרֵחֽוֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/063.yaml
  text: These are those counted by Moses and Eleazar the priest[b][a], who counted the sons of Israel in the plains of Moab by the Jordan at Jericho.
translation:
  language: hi
  text: ये वे लोग हैं जिन्हें मूसा और याजक एलिआज़ार ने गिना था, जिन्होंने मोआब के मैदानों में, यरीहो के पास यरदन के किनारे[b], इस्राएल के पुत्रों[a] की गिनती की थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली,” “इस्राएल की सन्तान,” अथवा “इस्राएल के लोग।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “यरीहो के सामने यरदन के किनारे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: वे लोग ... जिन्हें ... गिना था
  rationale: यह गणना-संदर्भ में जनगणना में गिने गए व्यक्तियों को दर्शाता है। हिन्दी में यह रूप स्वाभाविक है और अमूर्त ‘जनगणना’ के बजाय लोगों को केंद्र में रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: इब्रानी में केवल ‘याजक’ है; ‘महायाजक’ जोड़ने से मूल पाठ से अधिक कहा जाता।
- source_word: פָּקְדוּ
  choice: गिनती की थी
  rationale: यह उसी פקד धातु की पुनरावृत्ति है और यहाँ जनगणना के प्रसंग को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के वंश-सूचक, व्याकरणतः पुल्लिंग पदबंध को निकटता से बनाए रखता है; व्यापक सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: इस भौगोलिक पदबंध के लिए ‘मैदान’ स्पष्ट, प्रचलित और स्वाभाविक हिन्दी है।
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: यरीहो के पास यरदन के किनारे
  rationale: यह स्थान को यरदन के निकट और यरीहो के संबंध में बताता है। ‘यरीहो के सामने’ भी सम्भव है, इसलिए उसे पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का वंश-सूचक और पुल्लिंग रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की सन्तान; इस्राएल के लोग
  rationale: मूल पाठ की वंशावली-संबंधी अभिव्यक्ति और उसके पुल्लिंग रूप को मुख्य पाठ में सुरक्षित रखा गया है, जबकि उसके व्यापक सामुदायिक आशय को पादटिप्पणी स्पष्ट करती है।
- issue: एलिआज़ार की पदवी
  choice: याजक
  alternative: महायाजक
  rationale: मूल पाठ ‘याजक’ ही कहता है। प्रसंग के आधार पर अधिक विशिष्ट पदवी जोड़ना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज गद्य रखा गया है। पहले वाक्य में गिने गए लोगों को स्पष्ट किया गया है और दूसरे में मूसा तथा एलिआज़ार को कर्ता बनाकर इब्रानी बहुवचन क्रिया की अस्पष्टता दूर की गई है।
