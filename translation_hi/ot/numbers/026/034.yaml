  text: ये मनश्शे के कुल थे, और उनमें गिने गए लोगों[a] की संख्या बावन हज़ार सात सौ थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके गिने हुए लोग।” यहाँ इब्रानी में פקד से बना जनगणना का एक प्रचलित पद है, जिसका अर्थ गिने या सूची में दर्ज किए गए लोग है।
    reason: lexical_alternative
