source:
  edition: WLC
  text: וּ/בְ/אֵ֨לֶּה֙ לֹא הָ֣יָה אִ֔ישׁ מִ/פְּקוּדֵ֣י מֹשֶׁ֔ה וְ/אַהֲרֹ֖ן הַ/כֹּהֵ֑ן אֲשֶׁ֥ר פָּקְד֛וּ אֶת בְּנֵ֥י יִשְׂרָאֵ֖ל בְּ/מִדְבַּ֥ר סִינָֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/064.yaml
  text: But among these there was not a man from those counted by Moses and Aaron the priest[b][a], who counted the sons of Israel in the wilderness of Sinai.
translation:
  language: hi
  text: परन्तु इनमें एक भी पुरुष उन लोगों में से नहीं था जिन्हें मूसा और हारून याजक ने सीनै के निर्जन प्रदेश में इस्राएल के पुत्रों[a] की गिनती करते समय गिना था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों’; इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है, जो इस्राएल के लोगों के लिए पारम्परिक पारिवारिक नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְאֵלֶּה
  choice: परन्तु इनमें
  rationale: वाव का मूल अर्थ ‘और’ है, पर पिछले पद के साथ यहाँ स्पष्ट विरोध है; ‘परन्तु’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘इनमें’ स्थानवाचक अर्थ बनाए रखता है।
- source_word: לֹא הָיָה אִישׁ
  choice: एक भी पुरुष ऐसा नहीं था
  rationale: यह अभिव्यक्ति किसी एक भी व्यक्ति के न पाए जाने पर बल देती है। यहाँ पिछली जनगणना में गिने गए वयस्क पुरुषों की बात है, इसलिए ‘पुरुष’ प्रसंगानुकूल है।
- source_word: מִפְּקוּדֵי
  choice: उन लोगों में से हो जिनकी गिनती ... ने ... की थी
  rationale: פקד का यहाँ अर्थ जनगणना में गिनना है। हिन्दी में इस संबंधवाचक रचना से स्पष्ट होता है कि बात पहले गिने गए लोगों की है, किसी अमूर्त गणना की नहीं।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: इब्रानी पाठ में केवल ‘याजक’ है, ‘महायाजक’ नहीं; इसलिए अतिरिक्त पदवी नहीं जोड़ी गई।
- source_word: אֲשֶׁר פָּקְדוּ
  choice: जब उन्होंने ... गिनती की थी
  rationale: बहुवचन क्रिया का कर्ता मूसा और हारून हैं। हिन्दी में ‘जब उन्होंने’ पूर्व जनगणना की परिस्थिति को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह पारिवारिक-राष्ट्रीय इब्रानी पदबंध का निकट रूप है। ‘इस्राएली’ अधिक मुहावरेदार विकल्प है, पर मुख्य पाठ में स्रोत की पारिवारिक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: בְּמִדְבַּר סִינָי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से दूर शुष्क वन्य क्षेत्र को दर्शाता है। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में स्पष्ट है और केवल रेतीले मरुस्थल का अनावश्यक संकुचित अर्थ नहीं देता।
theological_decisions:
- issue: אִישׁ और בְּנֵי יִשְׂרָאֵל में लिंग-सूचक भाषा
  choice: ‘पुरुष’ और ‘इस्राएल के पुत्रों’ को बनाए रखा गया
  alternative: ‘व्यक्ति’ और ‘इस्राएलियों’
  rationale: प्रसंग पहले गिने गए युद्ध-योग्य पुरुषों की पीढ़ी से संबंधित है, और इब्रानी में स्पष्ट पुल्लिंग रूप हैं। इसलिए इन्हें लिंग-निरपेक्ष बनाकर ऐतिहासिक संदर्भ को धुँधला नहीं किया गया।
- issue: आरम्भिक וְ का संबंध
  choice: विरोधसूचक ‘परन्तु’
  alternative: जोड़सूचक ‘और’
  rationale: वाव स्वयं दोनों अर्थ-संबंधों में प्रयुक्त हो सकता है; पिछले पद में वर्तमान गणना के कुल के बाद अब पुरानी गणना से किसी के न होने का विरोध सामने आता है। हिन्दी में ‘परन्तु’ यह संबंध स्पष्ट करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘परन्तु’, ‘याजक’ और ‘निर्जन प्रदेश’ जैसे रूप बाइबलीय गरिमा रखते हुए भी वर्तमान मानक हिन्दी में सुबोध हैं।
