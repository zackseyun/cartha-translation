base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/055.yaml
  text: Only by lot shall the land be divided[a]; they shall inherit according to the names of the tribes of their fathers.
translation:
  language: hi
  text: भूमि का बँटवारा केवल चिट्ठी डालकर ही किया जाए; वे अपने पितरों के गोत्रों के नामों के अनुसार उस भूमि को विरासत में पाएँगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ
  choice: परन्तु...केवल
  rationale: אַךְ यहाँ पिछले निर्देश के साथ हल्का विरोध रखते हुए बँटवारे की विधि को सीमित करता है; हिंदी में ‘परन्तु...केवल’ दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּגוֹרָל
  choice: चिट्ठी डालकर
  rationale: गोֹרָל निर्णय अथवा बाँटने के लिए डाली गई चिट्ठी को दर्शाता है; ‘चिट्ठी डालकर’ आधुनिक हिंदी में साधन का भाव स्पष्ट करता है।
- source_word: יֵחָלֵק אֶת־הָאָרֶץ
  choice: देश का बँटवारा...किया जाए
  rationale: निफ़ाल रूप का निष्क्रिय और निर्देशात्मक भाव सुरक्षित रहता है; ‘देश’ यहाँ प्रतिज्ञात भूभाग के लिए स्वाभाविक है।
- source_word: לִשְׁמוֹת
  choice: नामों के अनुसार
  rationale: यहाँ ל मानक अथवा संदर्भ बताता है; ‘के अनुसार’ हिंदी में यही संबंध स्पष्ट करता है।
- source_word: מַטּוֹת
  choice: गोत्रों
  rationale: इस संदर्भ में शब्द छड़ी नहीं बल्कि इस्राएल की जनजातीय इकाइयों को दर्शाता है; बाइबिलीय हिंदी में ‘गोत्र’ उपयुक्त और परिचित है।
- source_word: אֲבֹתָם
  choice: अपने पितरों के
  rationale: इब्रानी का शाब्दिक अर्थ ‘उनके पिता’ है और यहाँ पितृवंशीय पूर्वज अभिप्रेत हैं; ‘पितरों’ से पूर्वजों और पुरुषवंश दोनों का संकेत मिलता है।
- source_word: יִנְחָלוּ
  choice: विरासत पाएँ
  rationale: נחל का अर्थ विरासत के रूप में पाना या अधिकार में लेना है; ‘विरासत पाएँ’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: אֲבֹתָם में पितृवंशीय भाषा
  choice: अपने पितरों के गोत्रों
  alternative: अपने पूर्वजों के गोत्रों
  rationale: मूल पाठ पुरुष पूर्वजों/पितृवंश को स्पष्ट रूप से रखता है। ‘पितरों’ इस विशिष्टता को बनाए रखता है, जबकि ‘पूर्वजों’ से यह लिंगगत और वंशगत संकेत मंद पड़ सकता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। ‘गोत्र’ और ‘पितर’ संदर्भानुकूल बाइबिलीय शब्द हैं; वाक्य में विधिक निर्देश का स्वर बनाए रखा गया है।
