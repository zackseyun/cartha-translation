    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के पुत्र
  rationale: वंशावली की सूची में בְּנֵי का सीधा और स्वाभाविक अर्थ ‘पुत्र’ है; इससे पुरुष-संतानों का आशय सुरक्षित रहता है।
- source_word: עֵר וְאוֹנָן
  choice: एर और ओनान
  rationale: दोनों व्यक्तिवाचक नामों का प्रचलित हिन्दी लिप्यंतरण किया गया है और संयोजक וְ को ‘और’ से व्यक्त किया गया है।
- source_word: וַיָּמָת
  choice: परन्तु ... मर गए
  rationale: मूल क्रिया מוּת मृत्यु को बताती है। आरम्भिक וַ को प्रसंग में विरोधसूचक ‘परन्तु’ से व्यक्त किया गया है, क्योंकि सूची में नाम लेने के बाद बताया जाता है कि ये दोनों कनान में ही मर गए थे।
- source_word: בְּאֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: भौगोलिक अभिव्यक्ति אֶרֶץ כְּנָעַן का स्वाभाविक आधुनिक हिन्दी रूप ‘कनान देश’ है; בְּ को ‘में’ से व्यक्त किया गया है।
