  text: אֵ֛לֶּה מִשְׁפְּחֹ֥ת נַפְתָּלִ֖י לְ/מִשְׁפְּחֹתָ֑/ם וּ/פְקֻ֣דֵי/הֶ֔ם חֲמִשָּׁ֧ה וְ/אַרְבָּעִ֛ים אֶ֖לֶף וְ/אַרְבַּ֥ע מֵאֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/050.yaml
  text: These are the clans of Naphtali by their clans[b][a], and those numbered of them were forty-five thousand four hundred.
translation:
  language: hi
  text: नप्ताली के कुल, अपने-अपने कुलों के अनुसार, ये थे; और उनमें गिने गए लोगों की संख्या पैंतालीस हज़ार चार सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵלֶּה
  choice: ये थे
  rationale: यह बहुवचन संकेतवाचक शब्द सारांशात्मक जनगणना-वाक्य को प्रस्तुत करता है; हिन्दी में वृतांत के संदर्भ के कारण भूतकाल स्वाभाविक है।
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: यहाँ शब्द किसी गोत्र के भीतर विस्तृत वंश-समूहों को दर्शाता है। ‘कुल’ आधुनिक हिन्दी में इस संबंध को संक्षेप और गरिमा के साथ व्यक्त करता है।
- source_word: נַפְתָּלִי
  choice: नप्ताली
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों के अनुसार
  rationale: उपसर्ग לְ यहाँ वर्गीकरण अथवा वितरण का भाव देता है; यह अनुवाद उस संगठनात्मक अर्थ को स्पष्ट रखता है।
- source_word: וּפְקֻדֵיהֶם
  choice: और उनमें गिने गए लोगों की संख्या
  rationale: פקד का रूप जनगणना में दर्ज और गिने गए व्यक्तियों को सूचित करता है। ‘लोगों’ कहना सामूहिक व्यक्तिगत संदर्भ को बनाए रखता है, जबकि मूल पद में निहित न होने के कारण ‘पुरुष’ नहीं जोड़ा गया।
- source_word: חֲמִשָּׁה וְאַרְבָּעִים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: पैंतालीस हज़ार चार सौ
  rationale: संख्या का सीधा और स्वाभाविक हिन्दी रूप।
theological_decisions: []
