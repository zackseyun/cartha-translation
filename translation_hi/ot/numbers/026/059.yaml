base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/059.yaml
  text: The name of Amram’s wife was Jochebed[a], the daughter of Levi, who was born to Levi in Egypt. She bore to Amram Aaron and Moses[b], and Miriam their sister.
translation:
  language: hi
  text: अम्राम की पत्नी का नाम योकेबेद था, जो लेवी की बेटी[a] थी और मिस्र में लेवी से जन्मी थी[b]। उसने अम्राम से हारून और मूसा को, और उनकी बहन मरियम को जन्म दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “लेवी की बेटी।” वंशावलियों में “बेटी” कभी-कभी किसी स्त्री वंशज के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से, “जिसे उसने मिस्र में लेवी को जन्म दिया।” क्रिया का कर्ता स्त्रीलिंग है, पर जन्म देने वाली स्त्री का नाम नहीं बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם אֵשֶׁת עַמְרָם
  choice: अम्राम की पत्नी का नाम
  rationale: हिब्रू संबंधवाचक रचना को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; आरम्भिक וְ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं है।
- source_word: יוֹכֶבֶד
  choice: योकेबेद
  rationale: हिब्रू व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בַּת לֵוִי
  choice: लेवी की बेटी
  rationale: शाब्दिक वंशावली-संबंध को मुख्य पाठ में बनाए रखा गया है; इसे व्याख्यात्मक रूप से ‘वंशज’ नहीं बनाया गया।
- source_word: אֲשֶׁר יָלְדָה אֹתָהּ לְלֵוִי בְּמִצְרָיִם
  choice: जो मिस्र में लेवी के यहाँ जन्मी थी
  rationale: हिब्रू में कर्ता स्त्रीलिंग है पर उसका स्पष्ट नाम नहीं दिया गया। हिन्दी का अकर्मक/भाववाचक रूप अनाम माता को जोड़े बिना अर्थ को स्वाभाविक ढंग से रखता है।
- source_word: וַתֵּלֶד לְעַמְרָם
  choice: उसने अम्राम से … को जन्म दिया
  rationale: לְ से व्यक्त पिता/पति-संबंध को सहज हिन्दी ‘अम्राम से’ द्वारा स्पष्ट किया गया है।
- source_word: אֶת אַהֲרֹן וְאֶת מֹשֶׁה וְאֵת מִרְיָם אֲחֹתָם
  choice: हारून और मूसा को, और उनकी बहन मरियम को
  rationale: नामों का प्रचलित हिन्दी बाइबलीय रूप रखा गया और ‘उनकी बहन’ का संबंध स्पष्ट बनाए रखते हुए मूल क्रम के निकट रहा गया है।
theological_decisions:
- issue: ‘लेवी की बेटी’ का वंशावलीगत अर्थ
  choice: मुख्य पाठ में ‘लेवी की बेटी’
  alternative: ‘लेवी की वंशज’
  rationale: हिब्रू के प्रत्यक्ष संबंधवाचक शब्द को कालक्रम या वंशावली की कठिनाई सुलझाने के लिए चुपचाप व्यापक नहीं किया गया; सम्भावित व्यापक अर्थ पादटिप्पणी में दिया गया है।
- issue: योकेबेद को जन्म देने वाली स्त्री की पहचान
  choice: अनाम कर्ता को मुख्य पाठ में न जोड़ते हुए ‘जन्मी थी’
  alternative: ‘जिसे उसकी पत्नी ने लेवी के लिए जन्म दिया था’
  rationale: हिब्रू क्रिया स्त्रीलिंग कर्ता का संकेत करती है, पर स्त्री की पहचान नहीं बताती। अनिश्चितता को सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। नामों के लिए हिन्दी बाइबल-पाठकों में प्रचलित रूप अपनाए गए हैं। वंशावलीगत और व्याकरणिक अस्पष्टताओं को मुख्य पाठ में अनावश्यक रूप से नहीं सुलझाया गया।
