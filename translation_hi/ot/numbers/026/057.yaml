base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/057.yaml
  text: 'And these were the numbered ones of Levi by their clans: of Gershon, the clan of the Gershonites; of Kohath, the clan of the Kohathites; of Merari, the clan of the Merarites.'
translation:
  language: hi
  text: 'और लेवी के गिने हुए लोग[a], उनके कुलों के अनुसार, ये थे: गेर्शोन का गेर्शोनी कुल; कहात का कहाती कुल; मरारी का मरारी कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जनगणना में दर्ज किए गए लोग।” इब्रानी शब्द केवल गिनने की क्रिया नहीं, बल्कि जनगणना में गिने या दर्ज किए गए लोगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְקוּדֵי
  choice: वे लोग, जिनकी गिनती ... की गई थी
  rationale: यह पद जनगणना में गिने अथवा दर्ज किए गए व्यक्तियों को दर्शाता है, केवल गिनती की अमूर्त प्रक्रिया को नहीं। हिंदी में यह संबंधवाचक रचना स्वाभाविक रहते हुए ठोस व्यक्तिगत अर्थ बनाए रखती है।
- source_word: הַלֵּוִי
  choice: लेवी के
  rationale: यहाँ सप्रत्यय एकवचन रूप वंश/गोत्र के पूर्वज और उससे संबद्ध जनसमूह को सूचित करता है। ‘लेवी के’ मूल की वंशपरक अभिव्यक्ति को बिना उसे सीधे बहुवचन ‘लेवीय’ में बदलने के सुरक्षित रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: जनगणना के प्रसंग में מִשְׁפָּחָה आधुनिक एकल परिवार नहीं, बल्कि वंशगत कुल को दर्शाता है; इसलिए ‘कुल’ उपयुक्त है।
- source_word: לְגֵרְשׁוֹן / לִקְהָת / לִמְרָרִי
  choice: गेर्शोन से / कहात से / मरारी से
  rationale: यहाँ לְ वंशगत संबद्धता बताता है। हिंदी में ‘से’ उन पूर्वजों से निकले कुलों का संबंध स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת הַגֵּרְשֻׁנִּי / הַקְּהָתִי / הַמְּרָרִי
  choice: गेर्शोनी कुल / कहाती कुल / मरारी कुल
  rationale: ये जातिवाचक रूप संबंधित वंशज-कुलों को सूचित करते हैं। हिंदी विशेषणात्मक रूप संक्षिप्त है और मूल की सूचीबद्ध संरचना बनाए रखता है।
- source_word: וְאֵלֶּה
  choice: और ... ये थे
  rationale: ‘और’ इस वचन को पूर्ववर्ती जनगणना-विवरण से जोड़ता है, जबकि ‘ये थे’ सूची का स्वाभाविक परिचय देता है।
