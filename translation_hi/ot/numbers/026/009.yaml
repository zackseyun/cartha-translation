id: NUM.26.9
reference: Numbers 26:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/בְנֵ֣י אֱלִיאָ֔ב נְמוּאֵ֖ל וְ/דָתָ֣ן וַ/אֲבִירָ֑ם הֽוּא דָתָ֨ן וַ/אֲבִירָ֜ם קרואי הָ/עֵדָ֗ה אֲשֶׁ֨ר הִצּ֜וּ עַל מֹשֶׁ֤ה וְ/עַֽל אַהֲרֹן֙ בַּ/עֲדַת קֹ֔רַח בְּ/הַצֹּתָ֖/ם עַל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/009.yaml
  text: 'And the sons of Eliab: Nemuel[a], and Dathan, and Abiram. These are that Dathan and Abiram, the called ones of the congregation, who contended against Moses and against Aaron in the company of Korah, when they contended against Yahweh.'
translation:
  language: hi
  text: 'और एलीआब के पुत्र थे: नमूएल, दातान और अबीराम। ये वही दातान और अबीराम थे, जो सभा के बुलाए हुए लोग[a] थे और जिन्होंने कोरह के दल में मूसा और हारून का विरोध किया था, जब उन्होंने याहवे का विरोध किया था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सभा के चुने हुए लोग।”
    reason: क़रूए हा-एदा का शाब्दिक अर्थ ‘सभा के बुलाए हुए’ है; संदर्भ में मान्य या चुने हुए प्रतिनिधियों का अर्थ भी संभव है।
lexical_decisions:
- source_word: וּבְנֵי אֱלִיאָב
  choice: और एलीआब के पुत्र थे
  rationale: वंशावली के संदर्भ में בְּנֵי का स्वाभाविक और सटीक अर्थ ‘पुत्र’ है; हिंदी वाक्य को पूर्ण बनाने के लिए ‘थे’ जोड़ा गया है।
- source_word: הוּא דָתָן וַאֲבִירָם
  choice: ये वही दातान और अबीराम थे
  rationale: एकवचन रूप הוּא यहाँ पहचान पर बल देने वाला पुनरारंभिक प्रयोग है; दो व्यक्तियों के कारण हिंदी में बहुवचन ‘ये वही ... थे’ स्वाभाविक है।
- source_word: קרואי הָעֵדָה
  choice: सभा के बुलाए हुए व्यक्ति
  rationale: निष्क्रिय कृदंत קרואי के मूल अर्थ ‘बुलाए हुए’ को बनाए रखता है और इसे बिना आवश्यकता ‘अधिकारी’ या ‘प्रधान’ नहीं बनाता। संभावित अर्थ ‘सभा के चुने हुए व्यक्ति’ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר הִצּוּ עַל
  choice: जिन्होंने ... का विरोध किया था
  rationale: נצה यहाँ संघर्ष या प्रतिरोध व्यक्त करता है। ‘विरोध किया’ आधुनिक हिंदी में स्पष्ट है और עַל के साथ adversarial अर्थ रखता है।
- source_word: בַּעֲדַת קֹרַח
  choice: कोरह के समुदाय में
  rationale: עֲדַת यहाँ कोरह से संबद्ध समूह को सूचित करता है। ‘समुदाय’ उस संगति को व्यक्त करता है और पूरे इस्राएली समुदाय से भाषिक भेद भी बनाए रखता है।
- source_word: בְּהַצֹּתָם
  choice: जब उन्होंने ... का विरोध किया
  rationale: בְּ के साथ infinitive construct को कालगत उपवाक्य ‘जब’ से व्यक्त किया गया है और पहले प्रयुक्त उसी इब्रानी मूल की पुनरावृत्ति भी रखी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में दिया गया है, न कि किसी उपाधि से प्रतिस्थापित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। आधुनिक हिंदी बाइबल-पाठकों के लिए व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ रखा गया है; ‘प्रभु’ करने से नाम उपाधि में बदल जाता।
- issue: קרואי הָעֵדָה का आशय
  choice: सभा के बुलाए हुए व्यक्ति
  alternative: सभा के चुने हुए व्यक्ति
  rationale: इब्रानी पद का शाब्दिक अर्थ बुलाए या आमंत्रित किए गए लोग हो सकता है, जबकि संदर्भ में मान्य या चुने हुए प्रतिनिधियों का आशय भी संभव है। मुख्य पाठ शाब्दिक अस्पष्टता रखता है और दूसरा अर्थ पादटिप्पणी में देता है।
- issue: दातान और अबीराम के संघर्ष का स्वरूप
  choice: विरोध किया
  alternative: झगड़ा किया
  rationale: נצה संघर्ष, विवाद या प्रतिरोध का संकेत देता है। ‘विरोध किया’ मूसा, हारून और यहोवा के विरुद्ध उनकी कार्रवाई को स्पष्ट करता है, पर इसे अधिक व्याख्यात्मक ‘विद्रोह किया’ नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। नामों के रूप हिंदी बाइबल परंपरा के अनुरूप हैं। ‘सभा’ और ‘समुदाय’ का चयन एक ही पद עֵדָה के संदर्भगत भिन्न प्रयोगों को स्वाभाविक हिंदी में अलग करता है।
