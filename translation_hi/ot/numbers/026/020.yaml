base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/020.yaml
  text: 'The sons of Judah by their clans were: of Shelah[a], the clan of the Shelanites; of Perez, the clan of the Perezites; of Zerah[b], the clan of the Zerahites.'
translation:
  language: hi
  text: 'यहूदा के वंशजों[a] के कुल ये थे: शेला से शेलानियों का कुल, पेरेस से पेरेसियों का कुल, और जेरह से जेरहियों का कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘यहूदा के पुत्र’; इस जनगणना में आशय यहूदा के पुरुष-वंश के वंशजों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: ये थे
  rationale: इस जनगणना-सूची में यह क्रिया कुलों का परिचय देती है; ‘ये थे’ हिंदी में स्वाभाविक और संक्षिप्त है।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर इस वंशावली और जनगणना के प्रसंग में यह पुरुष-वंश के व्यापक वंशजों को दर्शाता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: के कुल
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर की वंशगत इकाई है; ‘कुल’ आधुनिक हिंदी में ‘परिवार’ से अधिक सटीक है।
- source_word: לְשֵׁלָה ... לְפֶרֶץ ... לְזֶרַח
  choice: शेला से ... पेरेस से ... जेरह से
  rationale: हर नाम से पहले לְ उस पूर्वज से वंशगत संबंध बताता है; हिंदी में ‘से’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת הַשֵּׁלָנִי ... הַפַּרְצִי ... הַזַּרְחִי
  choice: शेलाइयों का कुल ... पेरेसियों का कुल ... जेरहियों का कुल
  rationale: इन जातिवाचक रूपों को संबंधित पूर्वज के नाम से बने वंश-समूहों के रूप में प्रस्तुत किया गया है और इब्रानी की दोहरावपूर्ण सूची-शैली रखी गई है।
