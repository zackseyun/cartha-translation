base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/016.yaml
  text: of Ozni[a], the clan of the Oznites; of Eri[b], the clan of the Erites.
translation:
  language: hi
  text: ओज़नी से ओज़नियों का कुल; एरी से एरियों का कुल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/אָזְנִי
  choice: ओज़नी से
  rationale: वंशावली-सूची में לְ पूर्वज और उससे निकले कुल का संबंध बताता है; हिन्दी में ‘से’ इस वंशगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: इस जनगणना और गोत्रीय संदर्भ में מִשְׁפָּחָה एक विस्तृत वंश-समूह को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में ‘परिवार’ से अधिक उपयुक्त है।
- source_word: הָ/אָזְנִי
  choice: ओज़नियों
  rationale: संज्ञा का यह रूप ओज़नी के वंशज-समूह को दर्शाता है; हिन्दी बहुवचन ‘ओज़नियों’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: לְ/עֵרִי
  choice: एरी से
  rationale: पहले खंड के समान, לְ यहाँ एरी से निकली वंश-रेखा का परिचय देता है; इसलिए ‘से’ चुना गया है।
- source_word: הָ/עֵרִי
  choice: एरियों
  rationale: यह जातिवाचक/वंशवाचक रूप एरी के वंशजों को दर्शाता है; हिन्दी में ‘एरियों’ उसका स्वाभाविक बहुवचन रूप है।
