  yaml_path: translation/ot/numbers/026/052.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-परिणामी के साथ यह क्रिया कथा को आगे बढ़ाती है। आधुनिक हिन्दी में ‘तब ... कहा’ स्वाभाविक है और अगले वचन का परिचय देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। हिन्दी बाइबल परंपरा में प्रचलित रूप ‘यहोवा’ नाम को उपाधि से बदलने के बजाय सुरक्षित रखता है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने की क्रिया के साथ אֶל संबोधित व्यक्ति को दर्शाता है; हिन्दी में इसका स्वाभाविक रूप ‘मूसा से’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आने वाले कथन का परिचय देता है। हिन्दी में ‘कहा’ यही कार्य स्वाभाविक ढंग से करता है; ‘यह कहते हुए’ यहाँ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘यहोवा’ आधुनिक हिन्दी पाठकों और हिन्दी बाइबल परंपरा में पहचाना जाने वाला नामरूप है; इससे नाम को ‘प्रभु’ जैसी उपाधि में बदलने से बचाया गया है।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिन्दी। मूल की वचन-परिचायक शैली को हिन्दी में स्वाभाविक एकल क्रिया ‘कहा’ द्वारा व्यक्त किया गया है।
