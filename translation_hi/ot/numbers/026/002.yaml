  text: שְׂא֞וּ אֶת רֹ֣אשׁ כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֗ל מִ/בֶּ֨ן עֶשְׂרִ֥ים שָׁנָ֛ה וָ/מַ֖עְלָ/ה לְ/בֵ֣ית אֲבֹתָ֑/ם כָּל יֹצֵ֥א צָבָ֖א בְּ/יִשְׂרָאֵֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/002.yaml
  text: Take a census of the whole congregation of the sons of Israel[a], from twenty years old and upward, by their fathers’ houses[c][b], everyone in Israel who goes out to war.
translation:
  language: hi
  text: “इस्राएलियों की सारी मंडली में से, उनके पितृकुलों के अनुसार, बीस वर्ष या उससे अधिक आयु के उन सभी पुरुषों की गिनती करो[a] जो इस्राएल में युद्ध के लिए निकलते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “सारी मंडली का सिर उठाओ”; यह लोगों की गिनती करने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂאוּ אֶת־רֹאשׁ
  choice: गिनती करो
  rationale: शाब्दिक अर्थ ‘सिर उठाओ’ है, पर यह लोगों की गणना करने का इब्रानी मुहावरा है। आधुनिक हिन्दी में ‘गिनती करो’ अर्थ को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: כָּל־עֲדַת בְּנֵי־יִשְׂרָאֵל
  choice: इस्राएलियों की सारी मंडली
  rationale: עֲדָה के सामुदायिक अर्थ को ‘मंडली’ बनाए रखता है; בְּנֵי יִשְׂרָאֵל को हिन्दी में स्वाभाविक सामूहिक नाम ‘इस्राएली’ से व्यक्त किया गया है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु के
  rationale: यह आयु-सीमा का सूत्र है; चयनित हिन्दी आधुनिक, संक्षिप्त और सटीक है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: यह पैतृक वंश पर आधारित सामाजिक इकाइयों के अनुसार गणना को दर्शाता है। ‘पितृकुल’ ‘पिताओं के घरानों’ की अपेक्षा वर्तमान हिन्दी में अधिक स्वाभाविक है।
- source_word: כָּל־יֹצֵא צָבָא בְּיִשְׂרָאֵל
  choice: उन सभी पुरुषों की ... जो इस्राएल में युद्ध के लिए सेना में जाते हैं
  rationale: יֹצֵא צָבָא सैन्य अभियान या सेवा के लिए निकलने वालों को सूचित करता है। ‘पुरुषों’ को आयु-सूत्र के בֶּן और सैन्य जनगणना के संदर्भ के आधार पर स्पष्ट किया गया है, जबकि ‘जाते हैं’ योग्यता मात्र के बजाय इब्रानी कृदंत की सक्रिय अभिव्यक्ति बनाए रखता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל की लिंगसूचक पारिवारिक अभिव्यक्ति
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: सामान्यतः यह पद जाति-समुदाय का प्रचलित नाम है, इसलिए ‘इस्राएली’ स्वाभाविक है। इस पद में गिने जाने वाले पुरुषों का दायरा आगे आयु-सूत्र और सैन्य-वाक्यांश से स्पष्ट किया गया है; अतः सामुदायिक नाम को अस्वाभाविक रूप से शाब्दिक बनाना आवश्यक नहीं।
- issue: כָּל־יֹצֵא צָבָא में सैन्य पात्रता अथवा वास्तविक सैन्य प्रस्थान
  choice: जो ... युद्ध के लिए सेना में जाते हैं
  alternative: जो सैनिक सेवा के योग्य हैं
  rationale: चयनित पाठ इब्रानी ‘सेना के लिए निकलने वाला’ की सक्रिय संरचना के निकट रहता है और केवल निहित पात्रता को मुख्य पाठ में निर्णायक रूप से नहीं जोड़ता।
- issue: गणना में पुरुषों की स्पष्टता
  choice: उन सभी पुरुषों की गिनती
  alternative: उन सभी की गिनती
  rationale: מִבֶּן का पुल्लिंग एकवचन सूत्र और सैन्य जनगणना का प्रसंग पुरुषों को निर्दिष्ट करता है। हिन्दी में इसे स्पष्ट करने से पाठ का वास्तविक दायरा सामने आता है, बिना किसी अतिरिक्त धार्मिक निष्कर्ष के।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘मंडली’ गरिमामय सामुदायिक पद है, ‘पितृकुल’ प्राचीन सामाजिक संरचना को संक्षेप में व्यक्त करता है, और वाक्य को हिन्दी में स्पष्ट बनाने के लिए आज्ञा के कर्म को एक सतत संरचना में रखा गया है।
