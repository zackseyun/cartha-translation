base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/061.yaml
  text: But Nadab and Abihu died when they offered strange fire before Yahweh[a].
translation:
  language: hi
  text: परन्तु नादाब और अबीहू उस समय मर गए जब उन्होंने यहोवा के सामने अनधिकृत आग चढ़ाई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पराई आग” या “अजनबी आग।” इब्रानी पद ऐसी आग को सूचित करता है जो यहोवा के सामने चढ़ाने के लिए अनुमत या निर्धारित नहीं थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת
  choice: मर गए
  rationale: एकवचन क्रिया संयुक्त कर्ता से पहले आई है, जो इब्रानी में सामान्य रचना है; हिन्दी में संयुक्त कर्ता के अनुसार बहुवचन स्वाभाविक है।
- source_word: נָדָב וַאֲבִיהוּא
  choice: नादाब और अबीहू
  rationale: व्यक्तिनामों का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: בְּהַקְרִיבָם
  choice: तब, जब उन्होंने ... चढ़ाई
  rationale: בְּ के साथ infinitive construct और प्रत्यय यहाँ कालवाचक है; बलि-संबंधी प्रसंग में 'चढ़ाई' स्वाभाविक है।
- source_word: אֵשׁ זָרָה
  choice: अनधिकृत आग
  rationale: यहाँ זָרָה ऐसी आग को सूचित करता है जिसका उपासना में उपयोग अनुमत या निर्धारित नहीं था; 'अनधिकृत' आधुनिक पाठक के लिए आशय स्पष्ट करता है, बिना यह बताने के कि आग अपने स्वभाव में विचित्र थी।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का स्थानिक और उपासना-संबंधी अर्थ 'के सामने' है; יהוה को उसके व्यक्तिगत वाचा-नाम 'यहोवा' से व्यक्त किया गया है।
- source_word: וַ
  choice: परन्तु
  rationale: यह संयोजक आसपास की वंशावली के बीच इन दोनों की असाधारण मृत्यु का विरोधात्मक संकेत देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप 'यहोवा' नाम को उपाधि 'प्रभु' में बदलने से बचाता है; 'याहवे' अधिक समीपस्थ वैकल्पिक लिप्यंतरण है।
- issue: אֵשׁ זָרָה के अपराध की प्रकृति
  choice: अनधिकृत आग
  alternative: अजनबी आग; पराई आग
  rationale: पद यह कहता है कि चढ़ाई गई आग उपासना के लिए स्वीकार्य या अधिकृत नहीं थी; अनुवाद मृत्यु के कारण या अपराध के विस्तृत स्वरूप को पाठ से आगे जाकर परिभाषित नहीं करता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। वाक्य में वंशावली से विरोध दर्शाने के लिए 'परन्तु' और बलि-संबंधी क्रिया के लिए 'चढ़ाई' प्रयुक्त है।
