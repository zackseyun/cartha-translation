  yaml_path: translation/ot/numbers/026/049.yaml
  text: of Iezer, the clan of the Iezerites; of Shillem, the clan of the Shillemites.
translation:
  language: hi
  text: येसेर से येसेरियों का कुल; शिल्लेम से शिल्लेमियों का कुल।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְ/יֵצֶר
  choice: येसेर से
  rationale: इस जनगणना-सूची में उपसर्ग ל वंश अथवा कुल के मूल पुरुष का परिचय देता है। हिंदी में ‘से’ वंश-उद्गम का संबंध स्वाभाविक रूप से व्यक्त करता है। नाम का लिप्यंतरण ‘येसेर’ किया गया है।
- source_word: מִשְׁפַּחַת
  choice: का कुल
  rationale: यह शब्द गोत्र के भीतर के व्यापक नातेदारी-समूह को दर्शाता है; आधुनिक छोटे परिवार की अपेक्षा ‘कुल’ इस संदर्भ में अधिक उपयुक्त और संक्षिप्त है।
- source_word: הַ/יִּצְרִי
  choice: येसेरियों
  rationale: यह येसेर से निकला वंश-सूचक रूप है। ‘येसेरी’ उस नाम से संबंध स्पष्ट रखता है और बहुवचन संबंधकारक रूप ‘येसेरियों का’ हिंदी में स्वाभाविक है।
- source_word: לְ/שִׁלֵּם
  choice: शिल्लेम से
  rationale: दोहराए गए जनगणना-सूत्र में ל को वंश-उद्गम दर्शाने वाले ‘से’ के रूप में रखा गया है। नाम का निकट लिप्यंतरण ‘शिल्लेम’ है।
- source_word: הַ/שִּׁלֵּמִי
  choice: शिल्लेमियों
  rationale: यह शिल्लेम से उत्पन्न कुल के सदस्यों का वंश-सूचक नाम है। ‘शिल्लेमियों का कुल’ मूल नाम और व्युत्पन्न समुदाय के बीच संबंध बनाए रखता है।
theological_decisions: []
