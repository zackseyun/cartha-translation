  register: संक्षिप्त जनगणना-सूत्र को आधुनिक, गरिमापूर्ण हिंदी में समानांतर संरचना के साथ प्रस्तुत किया गया है। ‘कुल’ सामाजिक-वंशीय इकाई को स्पष्ट करता है; नामों का अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
