base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/045.yaml
  text: 'For the sons of Beriah: from Heber, the clan of the Heberites; from Malkiel, the clan of the Malkielites.'
translation:
  language: hi
  text: 'बरीआ के पुत्र ये थे: हेबेर से हेबेरी कुल, और मल्कीएल से मल्कीएली कुल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לִ/בְנֵי בְרִיעָה
  choice: बरीआ के पुत्र ये थे
  rationale: जनगणना की वंशावली-सूची में לִבְנֵי किसी पूर्वज से निकली शाखाओं का परिचय देता है। ‘पुत्र’ मूल के בְנֵי को बनाए रखता है, और ‘ये थे’ हिन्दी में सूची का स्वाभाविक आरम्भ करता है।
- source_word: לְ/חֶבֶר
  choice: हेबेर से
  rationale: इस आवर्ती जनगणना-सूत्र में ל वंश या उद्गम का सम्बन्ध बताता है; हिन्दी ‘से’ उस सम्बन्ध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: यहाँ शब्द गोत्रीय/वंशीय उपसमूह को दर्शाता है। ‘कुल’ आधुनिक हिन्दी में ‘परिवार’ से अधिक उपयुक्त है और जनगणना के वंशगत संदर्भ को स्पष्ट रखता है।
- source_word: הַֽ/חֶבְרִי
  choice: हेबेरी
  rationale: यह हेबेर से निकले कुल का पितृनामिक रूप है; ‘हेबेरी कुल’ मूल की नाम-निर्माण पद्धति और वंशगत सम्बन्ध दोनों को बनाए रखता है।
- source_word: לְ/מַ֨לְכִּיאֵל
  choice: मल्कीएल से
  rationale: ל को वंशगत उद्गम के अर्थ में ‘से’ किया गया है, समानान्तर संरचना को बनाए रखते हुए।
- source_word: הַ/מַּלְכִּיאֵלִי
  choice: मल्कीएली
  rationale: यह मल्कीएल से निकले कुल का पितृनामिक रूप है; ‘मल्कीएली कुल’ हिब्रू की समानान्तर वंशावली-रचना को स्पष्ट रखता है।
