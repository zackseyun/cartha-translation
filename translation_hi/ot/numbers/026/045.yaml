  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद की जनगणना-सूची वाली समानान्तर संरचना सुरक्षित है। व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और מִשְׁפַּחַת के लिए ‘कुल’ चुना गया है।
