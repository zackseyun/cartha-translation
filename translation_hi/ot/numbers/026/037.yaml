base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/037.yaml
  text: 'These are the clans of the sons of Ephraim according to those numbered of them: thirty-two thousand and five hundred[a]. These are the sons of Joseph according to their clans.'
translation:
  language: hi
  text: एप्रैम के वंशजों के कुल ये थे; उनमें गिने गए लोगों की संख्या[a] बत्तीस हज़ार पाँच सौ थी। ये यूसुफ़ के वंशज थे, अपने-अपने कुलों के अनुसार।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ जनगणना में दर्ज और गिने गए लोगों से संबंधित भाषा है; इसका अनुवाद ‘उनके पंजीकरण के अनुसार’ या ‘जैसा वे गिने गए’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: जनगणना और गोत्र-संबंधी संदर्भ में यह शब्द एक गोत्र के भीतर के विस्तृत नातेदारी-समूह को दर्शाता है; आधुनिक हिन्दी में ‘कुल’ इस इकाई को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: בְּנֵי אֶפְרַיִם
  choice: एप्रैम के वंशज
  rationale: शाब्दिक अर्थ ‘एप्रैम के पुत्र’ है, पर जनगणना की इस वंशावली-सूची में दूर की पीढ़ियाँ भी सम्मिलित हैं; ‘वंशज’ आशय को स्पष्ट रखते हुए वंशगत संबंध को सुरक्षित रखता है।
- source_word: לִפְקֻדֵיהֶם
  choice: उनमें गिने गए लोगों की संख्या
  rationale: פקד की जनगणना-संबंधी भाषा उन लोगों की ओर संकेत करती है जो आधिकारिक रूप से दर्ज और गिने गए थे। यह अभिव्यक्ति उसी भाव को स्वाभाविक हिन्दी में देती है।
- source_word: שְׁנַיִם וּשְׁלֹשִׁים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: बत्तीस हज़ार पाँच सौ
  rationale: मूल संख्या को आधुनिक हिन्दी की सामान्य संख्या-रचना में ठीक-ठीक प्रस्तुत किया गया है।
- source_word: בְנֵי יוֹסֵף
  choice: यूसुफ़ के वंशज
  rationale: यहाँ ‘पुत्र’ वंशगत समुदायों को समेटता है; ‘वंशज’ जनगणना के संदर्भ में स्वाभाविक है और एप्रैम से यूसुफ़ तक की वंशावली-कड़ी बनाए रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों के अनुसार
  rationale: यह समापन सूत्र वंशजों के कुल-आधारित विभाजन को दर्शाता है; ‘अपने-अपने’ हिन्दी में वितरणात्मक भाव स्पष्ट करता है।
