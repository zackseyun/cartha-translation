  yaml_path: translation/ot/numbers/026/012.yaml
  text: 'The sons of Simeon by their clans: of Nemuel[a], the clan of the Nemuelites; of Jamin, the clan of the Jaminites; of Jachin[c][b], the clan of the Jachinites.'
translation:
  language: hi
  text: 'शिमोन के पुत्र[क], उनके कुलों के अनुसार: नमूएल से नमूएली कुल; यामीन से यामीनी कुल; याकीन से याकीनी कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: हिब्रू में शाब्दिक रूप से ‘शिमोन के पुत्र’ है। वंशावली के इस संदर्भ में इसका अर्थ ‘शिमोन के वंशज’ भी हो सकता है।
    reason: lexical_alternative
