- source_word: לִנְמוּאֵל
  choice: नमूएल से
  rationale: यहाँ לְ नामधारी पूर्वज से निकले कुल का परिचय देता है; हिन्दी में ‘से’ वंश-स्रोत को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִשְׁפַּחַת הַנְּמוּאֵלִי
  choice: नमूएली कुल
  rationale: समूहवाचक जातिवाचक रूप को हिन्दी में पूर्वज के नाम से बने विशेषण और ‘कुल’ द्वारा स्पष्ट रूप से व्यक्त किया गया है।
- source_word: לְיָמִין / מִשְׁפַּחַת הַיָּמִינִי
  choice: यामीन से यामीनी कुल
  rationale: हिब्रू नाम יָמִין का निकट देवनागरी लिप्यंतरण ‘यामीन’ है और उससे बने वंश-समूह के लिए ‘यामीनी कुल’ समानांतर संरचना बनाए रखता है।
- source_word: לְיָכִין / מִשְׁפַּחַת הַיָּכִינִי
  choice: याकीन से याकीनी कुल
  rationale: हिब्रू प्रारम्भिक yod को ‘य’ से लिप्यंतरित करना हिन्दी में स्रोत-उच्चारण के निकट है; वंश-समूह को ‘याकीनी कुल’ कहा गया है।
