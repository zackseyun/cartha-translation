- source_word: הַֽ/חֶצְרוֹנִי
  choice: हेस्रोनी कुल
  rationale: सम्बन्धवाचक रूप हेस्रोन से निकले सामूहिक वंश को दर्शाता है; हिन्दी में नाम से बना विशेषण ‘हेस्रोनी’ और साथ में ‘कुल’ सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: לְ/כַרְמִי
  choice: कर्मी से
  rationale: पहले खंड की तरह לְ यहाँ भी वंशगत उद्गम अथवा वर्गीकरण बताता है; समानांतरता बनाए रखने के लिए ‘से’ रखा गया है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: दोहराए गए जनगणना-सूचक पद का अनुवाद संगति और संरचनात्मक समानांतरता के लिए वही रखा गया है।
- source_word: הַ/כַּרְמִי
  choice: कर्मी कुल
  rationale: सम्बन्धवाचक रूप कर्मी से निकले सामूहिक वंश को सूचित करता है; हिन्दी में ‘कर्मी कुल’ संक्षिप्त और स्पष्ट है।
