  text: בְּנֵ֣י אָשֵׁר֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/יִמְנָ֗ה מִשְׁפַּ֨חַת֙ הַ/יִּמְנָ֔ה לְ/יִשְׁוִ֕י מִשְׁפַּ֖חַת הַ/יִּשְׁוִ֑י לִ/בְרִיעָ֕ה מִשְׁפַּ֖חַת הַ/בְּרִיעִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/044.yaml
  text: 'The sons of Asher by their clans: of Imnah[a], the clan of the Imnites; of Ishvi, the clan of the Ishvites; of Beriah[b], the clan of the Beriites.'
translation:
  language: hi
  text: 'आशेर के पुत्र, उनके कुलों के अनुसार: यिम्ना से यिम्नाइयों का कुल; यिश्वी से यिश्वियों का कुल; और बरीआ से बरीइयों का कुल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי אָשֵׁר
  choice: आशेर के पुत्र
  rationale: यह इब्रानी वंशावली-सूत्र का सीधा और स्वाभाविक रूप है; यहाँ नामित व्यक्ति आशेर के पुत्र और कुलों के पूर्वज हैं।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: गिनती की जनगणना-संबंधी भाषा में מִשְׁפָּחָה गोत्र के भीतर के कुल को सूचित करता है; आधुनिक हिन्दी में ‘कुल’ घरेलू ‘परिवार’ से अधिक उपयुक्त है।
- source_word: לְיִמְנָה ... מִשְׁפַּחַת הַיִּמְנָה
  choice: यिम्ना से यिम्नाइयों का कुल
  rationale: לְ वंश-स्रोत का परिचय देता है, इसलिए ‘से’ स्वाभाविक है; यिम्नाई पूर्वज के नाम से बना कुलनाम है।
- source_word: לְיִשְׁוִי ... מִשְׁפַּחַת הַיִּשְׁוִי
  choice: यिश्वी से यिश्वियों का कुल
  rationale: व्यक्तिनाम को मासोरेटिक व्यंजन-रूप के निकट लिप्यंतरित किया गया है और उससे बने समूहवाचक कुलनाम को हिन्दी बहुवचन में व्यक्त किया गया है।
- source_word: לִבְרִיעָה ... מִשְׁפַּחַת הַבְּרִיעִי
  choice: बरीआ से बरीइयों का कुल
  rationale: बरीआ व्यक्तिनाम का लिप्यंतरण है; ‘बरीइयों’ इब्रानी व्युत्पन्न कुलनाम בְּרִיעִי को व्यक्त करता है, बिना उसे केवल व्यक्तिनाम के रूप में दोहराए।
