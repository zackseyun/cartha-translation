  yaml_path: translation/ot/numbers/026/007.yaml
  text: These are the clans of the Reubenites[a], and those numbered from them were forty-three thousand seven hundred thirty.
translation:
  language: hi
  text: ये रूबेनियों के कुल थे, और उनमें गिने गए लोगों की संख्या तैंतालीस हज़ार सात सौ तीस थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִשְׁפְּחֹת
  choice: कुल
  rationale: गणना और गोत्रीय संदर्भ में यह शब्द किसी गोत्र के भीतर के वंश-आधारित सामाजिक समूहों को दर्शाता है; आधुनिक हिन्दी में ‘कुल’ संक्षिप्त, स्वाभाविक और उपयुक्त है।
- source_word: הָרֻאוּבֵנִי
  choice: रूबेनियों
  rationale: यह रूबेन के वंशजों अथवा उसके गोत्र के सदस्यों को सूचित करने वाला जातिवाचक रूप है; ‘रूबेनी’ का बहुवचन हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פְקֻדֵיהֶם
  choice: उनमें गिने गए लोगों
  rationale: गणना के प्रसंग में यह उन व्यक्तियों को दर्शाता है जिनकी जनगणना में गिनती हुई। ‘लोगों’ सहज हिन्दी देता है, जबकि इस पद में अलग से ‘पुरुष’ जोड़ने से बचता है।
- source_word: וַיִּהְיוּ
  choice: की संख्या ... थी
  rationale: संख्यात्मक विवरण में हिन्दी का यह स्वाभाविक विधान इब्रानी के साधारण संख्याबोधक कथन को स्पष्ट रूप से व्यक्त करता है।
- source_word: שְׁלֹשָׁה וְאַרְבָּעִים אֶלֶף וּשְׁבַע מֵאוֹת וּשְׁלֹשִׁים
  choice: तैंतालीस हज़ार सात सौ तीस
  rationale: इब्रानी संख्या को उसी क्रम में शब्दों द्वारा प्रस्तुत किया गया है, जिससे जनगणना-सूची की साहित्यिक शैली बनी रहती है।
