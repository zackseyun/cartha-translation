  text: בְּנֵ֣י גָד֮ לְ/מִשְׁפְּחֹתָ/ם֒ לִ/צְפ֗וֹן מִשְׁפַּ֨חַת֙ הַ/צְּפוֹנִ֔י לְ/חַגִּ֕י מִשְׁפַּ֖חַת הַֽ/חַגִּ֑י לְ/שׁוּנִ֕י מִשְׁפַּ֖חַת הַ/שּׁוּנִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/015.yaml
  text: 'The sons of Gad by their clans: of Zephon[a], the clan of the Zephonites; of Haggi, the clan of the Haggites; of Shuni, the clan of the Shunites.'
translation:
  language: hi
  text: 'गाद के वंशज उनके कुलों के अनुसार ये थे: सफोन से सफोनियों का कुल[a]; हाग्गी से हाग्गियों का कुल; और शूनी से शूनियों का कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ अनुवाद-परंपराएँ यहाँ “सिफोन” और “सिफोनियों” पढ़ती हैं (उत्पत्ति 46:16 से तुलना करें), पर इस पद के मसोरेटिक पाठ में “सफोन” (צפון) है; इसलिए मुख्य पाठ में “सफोन” रखा गया है।
    reason: textual_variant
lexical_decisions:
- source_word: בְּנֵי גָד
  choice: गाद के वंशज
  rationale: वंशावली और जनगणना के इस प्रसंग में בְּנֵי केवल प्रत्यक्ष पुत्रों तक सीमित नहीं, बल्कि गाद से निकले वंशजों को सूचित करता है; आधुनिक हिन्दी में यह अर्थ अधिक स्पष्ट है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: मִשְׁפָּחָה यहाँ गोत्र के भीतर के वंश-समूह के अर्थ में है। ‘कुल’ हिन्दी बाइबलीय वंश-सूचियों में स्वाभाविक और सुबोध है।
- source_word: לִצְפוֹן
  choice: सफोन से
  rationale: वंशावली-सूत्र में उपसर्ग לְ किसी पूर्वज से संबंधित अथवा उससे निकली शाखा को दर्शाता है; ‘से’ हिन्दी में वंश-स्रोत को सहज रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת הַצְּפוֹנִי
  choice: सफोनियों का कुल
  rationale: हिब्रू जातिवाचक रूप पूर्वज सफोन से निकले कुल-सदस्यों का नाम है; हिन्दी में ‘सफोनी’ का बहुवचन संबंधकारक ‘सफोनियों का’ समानांतरता बनाए रखता है।
- source_word: לְחַגִּי / מִשְׁפַּחַת הַחַגִּי
  choice: हाग्गी से हाग्गियों का कुल
  rationale: पूर्वज और उससे निकले कुल के बीच हिब्रू की समानांतर वंशावली संरचना को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: לְשׁוּנִי / מִשְׁפַּחַת הַשּׁוּנִי
  choice: शूनी से शूनियों का कुल
  rationale: नाम का दीर्घ स्वर और उससे बना कुलनाम लिप्यंतरित करते हुए पद की आवर्ती संरचना बनाए रखी गई है।
