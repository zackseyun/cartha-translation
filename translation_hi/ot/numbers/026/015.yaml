  register: भाषा आधुनिक, गरिमापूर्ण और जनगणना-सूची के अनुरूप संक्षिप्त रखी गई है। ‘पुत्र’ के बजाय प्रसंग-सापेक्ष ‘वंशज’ और clan के लिए ‘कुल’ चुना गया है। सभी नाम WLC के इस पद के स्वरांकन के आधार पर हिन्दी में लिप्यंतरित हैं।
