  text: All the families of the Shuhamites[a], according to those numbered among them, were sixty-four thousand four hundred.
translation:
  language: hi
  text: शूहामियों के सभी कुलों में गिने गए लोगों की संख्या चौंसठ हज़ार चार सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל מִשְׁפְּחֹת
  choice: सभी कुलों
  rationale: מִשְׁפָּחוֹת जनगणना और वंशावली के इस संदर्भ में विस्तृत पारिवारिक समूहों या कुलों को दर्शाता है; आधुनिक हिंदी में ‘कुल’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַשּׁוּחָמִי
  choice: शूहामियों के
  rationale: यह शूहाम से जुड़े वंशजों का सामूहिक जातिवाचक नाम है; हिंदी बहुवचन ‘शूहामियों’ से समूह की पहचान स्पष्ट होती है।
- source_word: לִפְקֻדֵיהֶם
  choice: उनकी गिनती के अनुसार
  rationale: פקד का यह रूप जनगणना में दर्ज या गिने गए लोगों को सूचित करता है; यह पद संख्या के आधार को व्यक्त करता है।
- source_word: אַרְבָּעָה וְשִׁשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: चौंसठ हज़ार चार सौ
  rationale: मूल पाठ की ठीक संख्या को वर्तमान मानक हिंदी संख्या-क्रम में प्रस्तुत किया गया है।
- source_word: '[implicit census subjects]'
  choice: पुरुष थे
  rationale: हिब्रू में संख्यित जनसमूह संदर्भ से समझा जाता है। पिछले जनगणना-निर्देशों के अनुसार गिने जाने वाले बीस वर्ष या उससे अधिक आयु के पुरुष हैं; हिंदी में पूर्ण और स्वाभाविक वाक्य के लिए इसे स्पष्ट किया गया है।
