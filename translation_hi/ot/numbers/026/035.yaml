  text: אֵ֣לֶּה בְנֵי אֶפְרַיִם֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/שׁוּתֶ֗לַח מִשְׁפַּ֨חַת֙ הַ/שֻּׁ֣תַלְחִ֔י לְ/בֶ֕כֶר מִשְׁפַּ֖חַת הַ/בַּכְרִ֑י לְ/תַ֕חַן מִשְׁפַּ֖חַת הַֽ/תַּחֲנִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/035.yaml
  text: 'These are the sons of Ephraim by their clans: of Shuthelah, the clan of the Shuthelahites; of Becher, the clan of the Becherites; of Tahan, the clan of the Tahanites.'
translation:
  language: hi
  text: 'एप्रैम के वंशज, उनके कुलों के अनुसार, ये थे: शूतेलह से शूतेलहियों का कुल; बेकेर से बेकेरियों का कुल; और तहन से तहनियों का कुल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशज
  rationale: यद्यपि शाब्दिक अर्थ ‘एप्रैम के पुत्र’ है, जनगणना और कुल-सूची के इस संदर्भ में आगे की पीढ़ियों के पुरुष वंशज अभिप्रेत हैं; ‘वंशज’ आधुनिक हिन्दी में अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: मִשְׁפָּחָה यहाँ गोत्र के भीतर की वंशगत इकाई को सूचित करता है। ‘कुल’ हिन्दी बाइबलीय वंशावलियों में स्वाभाविक है और ‘परिवार’ से व्यापक सामुदायिक अर्थ देता है।
- source_word: לְשׁוּתֶלַח ... לְבֶכֶר ... לְתַחַן
  choice: शूतेलह से ... बेकेर से ... तहन से
  rationale: इस वंशावली-सूत्र में לְ किसी पूर्वज से निकले कुल का संबंध बताता है। हिन्दी में ‘से’ वंश-उद्गम को संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
- source_word: מִשְׁפַּחַת הַשֻּׁתַלְחִי
  choice: शूतेलहियों का कुल
  rationale: हिब्रू जातिवाचक रूप उस पूर्वज से नामित सामूहिक कुल को दर्शाता है; हिन्दी बहुवचन ‘शूतेलहियों’ वही सामूहिक अर्थ देता है।
- source_word: מִשְׁפַּחַת הַבַּכְרִי
  choice: बेकेरियों का कुल
  rationale: जातिवाचक रूप को मूल व्यक्तिगत नाम बेकेर से पारदर्शी हिन्दी कुलनाम के रूप में प्रस्तुत किया गया है।
- source_word: מִשְׁפַּחַת הַתַּחֲנִי
  choice: तहनियों का कुल
  rationale: जातिवाचक हिब्रू रूप को सामूहिक हिन्दी बहुवचन में रखा गया है, जिससे समानांतर सूची-संरचना बनी रहती है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, dignified और जनगणना-सूची के अनुरूप औपचारिक रखी गई है। दोहराव मूल हिब्रू की वंशगत संरचना को स्पष्ट करने के लिए सुरक्षित रखा गया है; अंतिम पद से पहले ‘और’ हिन्दी प्रवाह के लिए जोड़ा गया है।
