  yaml_path: translation/ot/numbers/026/003.yaml
  text: Moses and Eleazar the priest spoke to them in the plains of Moab by the Jordan at Jericho[a], saying,
translation:
  language: hi
  text: मूसा और याजक एलीआज़ार ने मोआब के मैदानों में, यरीहो के पास यरदन के किनारे[a], उनसे कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यरीहो के सामने यरदन के किनारे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया आगे आने वाले प्रत्यक्ष कथन का परिचय देती है। हिन्दी में לֵאמֹר के साथ दोहराव से बचाते हुए ‘ने…कहा’ स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस व्यक्तिगत नाम का प्रचलित रूप।
- source_word: וְאֶלְעָזָר
  choice: और एलीआज़ार
  rationale: अर्थात ‘परमेश्वर ने सहायता की’; यहाँ मूसा के साथ संयुक्त कर्ता के रूप में नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: एलीआज़ार के पद को व्यक्त करता है; मूल में ‘महायाजक’ नहीं है, इसलिए वह पद नहीं जोड़ा गया।
- source_word: אֹתָם
  choice: उनसे
  rationale: דבר के संबोधित जनों को हिन्दी में स्वाभाविक रूप से ‘उनसे कहा’ द्वारा व्यक्त किया गया है।
- source_word: בְּעַרְבֹת מוֹאָב
  choice: मोआब के मैदानों में
  rationale: עַרְבוֹת समतल मैदानी अथवा स्तेपी क्षेत्र को दर्शाता है; ‘मैदानों’ साधारण पाठक के लिए सहज और भौगोलिक रूप से उपयुक्त है।
- source_word: עַל יַרְדֵּן יְרֵחוֹ
  choice: यरीहो के पास यरदन के किनारे
  rationale: यह वाक्यांश यरदन के निकट, यरीहो के संबंध में स्थान बताता है। मुख्य पाठ में सहज भौगोलिक अभिव्यक्ति रखी गई और ‘यरीहो के सामने’ की संभावना पादटिप्पणी में सुरक्षित की गई है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: अगले पद में आने वाली वाणी का परिचय देता है। हिन्दी में ‘बोले…कहते हुए’ की अपेक्षा संयुक्त ‘कहा’ अधिक स्वाभाविक है और मूल का कार्य बनाए रखता है।
