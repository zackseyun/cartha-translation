  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֵ֣לֶּה מִשְׁפְּחֹ֣ת לֵוִ֗י מִשְׁפַּ֨חַת הַ/לִּבְנִ֜י מִשְׁפַּ֤חַת הַֽ/חֶבְרֹנִי֙ מִשְׁפַּ֤חַת הַ/מַּחְלִי֙ מִשְׁפַּ֣חַת הַ/מּוּשִׁ֔י מִשְׁפַּ֖חַת הַ/קָּרְחִ֑י וּ/קְהָ֖ת הוֹלִ֥ד אֶת עַמְרָֽם׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/058.yaml
  text: 'These were the clans of Levi: the clan of the Libnite[a], the clan of the Hebronite, the clan of the Mahlite, the clan of the Mushite, the clan of the Korahite. And Kohath fathered Amram.'
translation:
  language: hi
  text: 'लेवी के कुल ये थे: लिब्नियों का कुल[a], हेब्रोनियों का कुल, महलियों का कुल, मूशियों का कुल और कोरहियों का कुल। और कहात से अम्राम उत्पन्न हुआ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वंश” अथवा “परिवार-समूह”; इब्रानी शब्द מִשְׁפָּחָה यहाँ गोत्र के भीतर रिश्तेदारी पर आधारित एक उपसमूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפְּחֹת / מִשְׁפַּחַת
  choice: कुल / का कुल
  rationale: गणना और गोत्र-संबंधी वंशावली के इस प्रसंग में यह शब्द एक गोत्र के भीतर के रिश्तेदारी-आधारित उपसमूह को दर्शाता है। आधुनिक हिन्दी में ‘कुल’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है तथा केवल एकल परिवार का अर्थ नहीं देता।
- source_word: לֵוִי
  choice: लेवी
  rationale: यह गोत्र के पूर्वज का व्यक्तिवाचक नाम है, इसलिए प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: הַלִּבְנִי / הַחֶבְרֹנִי / הַמַּחְלִי / הַמּוּשִׁי / הַקָּרְחִי
  choice: लिब्नियों / हेब्रोनियों / महलियों / मूशियों / कोरहियों
  rationale: इन संबंधवाचक रूपों से प्रत्येक नामित पूर्वज से निकला वंश-समूह अभिप्रेत है। हिन्दी बहुवचन संबंधसूचक रूप उस सामूहिक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּקְהָת
  choice: और कहात
  rationale: आरंभिक संयोजक को ‘और’ से बनाए रखा गया है; व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण किया गया है।
- source_word: הוֹלִד אֶת עַמְרָם
  choice: से अम्राम उत्पन्न हुआ
  rationale: हिफ़ील रूप वंशावली में पिता बनने या संतान उत्पन्न करने का बोध देता है। हिन्दी में ‘कहात से अम्राम उत्पन्न हुआ’ पुरुष वंश-संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, जबकि ‘जन्म दिया’ आधुनिक प्रयोग में प्रायः माता के लिए समझा जा सकता है।
- source_word: אֵלֶּה
  choice: ये थे
  rationale: इब्रानी वाक्य क्रियारहित है; पीछे मुड़कर की जा रही गणना के हिन्दी प्रसंग में ‘ये थे’ स्वाभाविक काल-संबंध प्रदान करता है।
