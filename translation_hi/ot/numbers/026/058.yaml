  register: भाषा आधुनिक मानक हिन्दी की है। वंशावली की सूची में समानांतर संरचना और नामों के सामूहिक रूप बनाए रखे गए हैं; शैली सरल, औपचारिक और सामान्य पाठक के लिए सुबोध है।
