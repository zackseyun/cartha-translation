source:
  edition: WLC
  text: בְּנֵ֣י זְבוּלֻן֮ לְ/מִשְׁפְּחֹתָ/ם֒ לְ/סֶ֗רֶד מִשְׁפַּ֨חַת֙ הַ/סַּרְדִּ֔י לְ/אֵל֕וֹן מִשְׁפַּ֖חַת הָ/אֵלֹנִ֑י לְ/יַ֨חְלְאֵ֔ל מִשְׁפַּ֖חַת הַ/יַּחְלְאֵלִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/026.yaml
  text: 'The sons of Zebulun by their clans: of Sered[a], the clan of the Sardites; of Elon, the clan of the Elonites; of Jahleel[b], the clan of the Jahleelites.'
translation:
  language: hi
  text: 'जबूलून के वंशज[a], अपने-अपने कुलों के अनुसार: सेरेद से सेरेदियों का कुल; एलोन से एलोनियों का कुल; और यहलेएल से यहलेएलियों का कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘पुत्र’; यहाँ जबूलून के जनजातीय वंशज अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי זְבוּלֻן
  choice: जबूलून के वंशज
  rationale: इब्रानी में शाब्दिक रूप से ‘जबूलून के पुत्र’ है, पर जनगणना के इस प्रसंग में उससे जबूलून के व्यापक जनजातीय वंशज अभिप्रेत हैं; ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट करता है, जबकि पाद-टिप्पणी मूल मुहावरे को सुरक्षित रखती है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: अपने-अपने कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ जनजाति के भीतर की वंश-आधारित कुल-इकाई है। वितरणसूचक לְ को ‘के अनुसार’ और बहुवचन-वितरण को ‘अपने-अपने’ से स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: לְסֶרֶד
  choice: सेरेद से
  rationale: सूची में לְ कुल के पूर्वज अथवा उससे निकली वंश-शाखा का संकेत देता है; हिन्दी में ‘से’ वंशोत्पत्ति का संबंध संक्षेप और स्पष्ट रूप से प्रकट करता है।
- source_word: מִשְׁפַּחַת הַסַּרְדִּי
  choice: सेरेदियों का कुल
  rationale: इब्रानी संबंधवाचक कुलनाम को हिन्दी के स्वाभाविक बहुवचन ‘सेरेदियों’ से व्यक्त किया गया है।
- source_word: לְאֵלֹן מִשְׁפַּחַת הָאֵלֹנִי
  choice: एलोन से एलोनियों का कुल
  rationale: दोहराए गए जनगणना-सूत्र और एलोन से व्युत्पन्न कुलनाम, दोनों को समान हिन्दी संरचना में रखा गया है।
- source_word: לְיַחְלְאֵל מִשְׁפַּחַת הַיַּחְלְאֵלִי
  choice: यहलेएल से यहलेएलियों का कुल
  rationale: व्यक्तिनाम और उससे बने कुलनाम को ध्वन्यात्मक रूप से अलग पहचान योग्य रखते हुए हिन्दी बहुवचन में प्रस्तुत किया गया है।
theological_decisions:
- issue: ‘पुत्र’ का दायरा
  choice: मुख्य पाठ में ‘वंशज’
  alternative: ‘पुत्र’
  rationale: यह पद तत्काल पुत्रों की साधारण सूची नहीं, बल्कि जनगणना में उनसे निकले जनजातीय कुलों का वर्गीकरण करता है। ‘वंशज’ प्रसंगगत अर्थ देता है और पाद-टिप्पणी शाब्दिक रूप बताती है; इससे कोई अतिरिक्त सांप्रदायिक व्याख्या नहीं जोड़ी जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और जनगणना-सूची के अनुरूप संक्षिप्त रखी गई है। ‘परिवार’ के बजाय ‘कुल’ चुना गया है, क्योंकि यहाँ विस्तृत वंश-समूह अभिप्रेत है। नामों के लिए हिन्दी में सहज ध्वन्यात्मक रूप अपनाए गए हैं और समानांतर इब्रानी संरचना को अर्धविरामों द्वारा स्पष्ट किया गया है।
