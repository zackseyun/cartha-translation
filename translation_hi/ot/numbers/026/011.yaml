lexical_decisions:
- source_word: וּ/בְנֵי
  choice: लेकिन ... के बेटे
  rationale: ו सामान्यतः “और” है, पर पिछले प्रसंग में हुई मौतों के साथ यहाँ स्पष्ट विरोध है; इसलिए मुख्य पाठ में “लेकिन” स्वाभाविक है। בְנֵי के लिए वंशावली-संदर्भ में सहज “बेटे” रखा गया है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לֹא
  choice: नहीं
  rationale: इब्रानी निषेध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֵתוּ
  choice: मरे
  rationale: מות के सामान्य अर्थ “मरना” को पूर्ण भूतकाल में व्यक्त करता है; “नाश हुए” जैसी अधिक व्याख्यात्मक अभिव्यक्ति आवश्यक नहीं है।
