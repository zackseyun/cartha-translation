  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। जनगणना और भूमि-वितरण का संदर्भ स्पष्ट किया गया है, पर मूल के वितरणात्मक एकवचन और ‘विरासत’ की धारणा को बनाए रखा गया है।
