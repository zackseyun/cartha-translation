  text: לָ/רַ֗ב תַּרְבֶּה֙ נַחֲלָת֔/וֹ וְ/לַ/מְעַ֕ט תַּמְעִ֖יט נַחֲלָת֑/וֹ אִ֚ישׁ לְ/פִ֣י פְקֻדָ֔י/ו יֻתַּ֖ן נַחֲלָתֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/054.yaml
  text: To the larger group you shall increase its inheritance[a], and to the smaller group you shall diminish its inheritance[b]; each man's inheritance shall be given according to those numbered from him.
translation:
  language: hi
  text: अधिक संख्या वाले समूह की विरासत बढ़ाना, और कम संख्या वाले समूह की विरासत घटाना; प्रत्येक की विरासत उसके गिने हुए लोगों की संख्या के अनुसार दी जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “प्रत्येक की विरासत उसके गिने हुओं के अनुसार दी जाए” है। “प्रत्येक” के लिए पुल्लिंग एकवचन वितरणात्मक रूप में है; संदर्भ में प्रत्येक समूह को उसकी जनगणना की संख्या के अनुपात में मिलने वाली भूमि का भाग अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרַב ... וְלַמְעַט
  choice: जिस समूह की संख्या अधिक हो ... जिस समूह की संख्या कम हो
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण जनगणना के संदर्भ में अधिक और कम जनसंख्या वाले कबीलाई समूहों को सूचित करते हैं। यह रूप हिन्दी में स्वाभाविक रहते हुए तुलना को स्पष्ट करता है।
- source_word: תַּרְבֶּה ... תַּמְעִיט
  choice: विरासत बढ़ाना ... विरासत घटाना
  rationale: दोनों हिफ़ील क्रियाओं का कारणवाचक भाव रखा गया है और विधिसूचक निर्देश को स्वाभाविक हिन्दी आज्ञार्थक रचना में व्यक्त किया गया है।
- source_word: נַחֲלָתוֹ
  choice: उसकी विरासत
  rationale: נַחֲלָה भूमि के रूप में दिए गए पैतृक/वैधानिक हिस्से को दर्शाता है। ‘विरासत’ मूल शब्द की धारणा और एकवचन सामूहिक प्रत्यय दोनों को बनाए रखती है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ पुल्लिंग एकवचन शब्द वितरणात्मक रूप से प्रयुक्त है। ‘हर एक’ उसके रूप को अनावश्यक रूप से व्यक्ति-विशेष तक सीमित किए बिना वितरणात्मक अर्थ बनाए रखता है।
- source_word: לְפִי פְקֻדָיו
  choice: उसमें गिने गए लोगों की संख्या के अनुसार
  rationale: यह संक्षिप्त इब्रानी पद प्रत्येक समूह के जनगणना-आधारित आँकड़े से भूमि-वितरण को जोड़ता है। हिन्दी में संबंध स्पष्ट करने के लिए ‘उसमें गिने गए लोगों’ कहा गया है, जबकि आनुपातिकता ‘के अनुसार’ से व्यक्त होती है।
- source_word: יֻתַּן
  choice: दी जाए
  rationale: נתן के निष्क्रिय रूप को सीधे निष्क्रिय विधिसूचक हिन्दी में रखा गया है।
