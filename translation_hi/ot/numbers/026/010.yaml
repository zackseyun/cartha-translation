source:
  edition: WLC
  text: וַ/תִּפְתַּ֨ח הָ/אָ֜רֶץ אֶת פִּ֗י/הָ וַ/תִּבְלַ֥ע אֹתָ֛/ם וְ/אֶת קֹ֖רַח בְּ/מ֣וֹת הָ/עֵדָ֑ה בַּ/אֲכֹ֣ל הָ/אֵ֗שׁ אֵ֣ת חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ וַ/יִּהְי֖וּ לְ/נֵֽס־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/010.yaml
  text: and the earth opened its mouth and swallowed them and Korah[a], when the congregation died, when the fire consumed two hundred fifty men[c][b]; and they became a warning sign.
translation:
  language: hi
  text: और धरती ने अपना मुँह खोला और उन्हें और कोरह को निगल लिया[a], जब वह समुदाय मर गया और जब आग ने ढाई सौ पुरुषों को भस्म कर दिया; और वे एक चिह्न बन गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “उन्हें और कोरह को।” यह पद कोरह को इसी प्रकार न्याय के वर्णन में सम्मिलित करता है; आसपास के विवरण के लिए गिनती 16 देखें।
    reason: cross_reference
  - marker: b
    text: या “वे एक संकेत बन गए।” इब्रानी शब्द का अर्थ चिह्न, संकेत या ध्वज हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: धरती ने अपना मुँह खोला
  rationale: אֶרֶץ का अर्थ ‘धरती’ या ‘भूमि’ हो सकता है; भूमि के मुँह खोलने की सजीव छवि के लिए ‘धरती’ और ‘मुँह’ को बनाए रखा गया है।
- source_word: וַתִּבְלַע
  choice: निगल लिया
  rationale: בלע का सीधा अर्थ ‘निगलना’ है; यह मूल की ठोस और सजीव छवि सुरक्षित रखता है।
- source_word: אֹתָם וְאֶת־קֹרַח
  choice: उन्हें और कोरह को
  rationale: इब्रानी पाठ ‘उन्हें’ और ‘कोरह’ को स्पष्ट रूप से जोड़ता है; दूसरे विवरणों से सामंजस्य बैठाने के लिए इसे बदला नहीं गया।
- source_word: בְּמוֹת הָעֵדָה
  choice: जब वह समुदाय मर गया
  rationale: ב के साथ מות का infinitive construct कालवाचक है, और עֵדָה यहाँ विद्रोही दल/समुदाय को सूचित करता है। ‘वह’ संदर्भित समुदाय को सामान्य इस्राएली समुदाय से अलग समझने में सहायता करता है।
- source_word: בַּאֲכֹל הָאֵשׁ
  choice: आग ने ... भस्म कर दिया
  rationale: אכל का मूल अर्थ ‘खाना’ है, पर आग के कर्ता होने पर हिंदी में ‘भस्म कर देना’ स्वाभाविक और अर्थ-सटीक है।
- source_word: חֲמִשִּׁים וּמָאתַיִם אִישׁ
  choice: ढाई सौ पुरुषों
  rationale: यह 250 का स्वाभाविक आधुनिक हिंदी रूप है; איש के कारण ‘पुरुषों’ रखा गया है।
- source_word: וַיִּהְיוּ לְנֵס
  choice: वे चेतावनी का चिह्न बन गए
  rationale: נֵס का अर्थ चिह्न, संकेत या ध्वज हो सकता है; न्याय के इस संदर्भ में ‘चेतावनी का चिह्न’ उसके प्रयोजन को स्पष्ट करता है, जबकि ‘वे’ की अस्पष्ट पूर्वसंदर्भता बनी रहती है।
theological_decisions:
- issue: अंतिम बहुवचन ‘वे’ का पूर्वसंदर्भ
  choice: ‘वे’ को बिना संकीर्ण व्याख्या के बनाए रखा गया
  alternative: इसे केवल ढाई सौ पुरुषों या पूरे न्याय-प्रसंग के रूप में स्पष्ट करना
  rationale: इब्रानी बहुवचन का पूर्वसंदर्भ कुछ अस्पष्ट है; अनुवाद इस तनाव को हल किए बिना सुरक्षित रखता है।
- issue: निगले जाने के न्याय में कोरह का संबंध
  choice: ‘उन्हें और कोरह को’
  alternative: कोरह को निगले गए लोगों से अलग दिखाने वाला व्याख्यात्मक अनुवाद
  rationale: तत्काल इब्रानी वाक्य-विन्यास को ज्यों का त्यों दर्शाया गया है और गिनती 16 के आधार पर मौन सामंजस्य नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘धरती’, ‘निगल लिया’, ‘ढाई सौ’ और ‘भस्म कर दिया’ सामान्य पाठक के लिए स्वाभाविक हैं। मूल के लंबे वाक्य को हिंदी की स्पष्टता के लिए दो वाक्यों में बाँटा गया है; घटनाओं का संबंध और अंतिम बहुवचन की अस्पष्टता सुरक्षित है।
