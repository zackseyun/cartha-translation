  yaml_path: translation/ot/numbers/026/004.yaml
  text: From twenty years old and upward[c][b][a], as Yahweh commanded Moses and the Israelites who came out of the land of Egypt.
translation:
  language: hi
  text: बीस वर्ष और उससे अधिक आयु वालों की[a]—जैसा याहवे ने मूसा और मिस्र देश से निकले इस्राएलियों[b] को आदेश दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह वाक्यांश पिछले पद की ‘गिनती’ से जुड़ता है; इब्रानी में इस पद के भीतर ‘गिनती’ या ‘गिनो’ दोहराया नहीं गया है।
    reason: textual_syntax
  - marker: b
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; यहाँ पूरे इस्राएली समुदाय के लिए प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמָעְלָה
  choice: बीस वर्ष और उससे अधिक आयु वालों की
  rationale: यह इब्रानी आयु-सीमा का मुहावरा है, जिसका शाब्दिक रूप ‘बीस वर्ष के पुत्र से और ऊपर’ है। हिन्दी में ‘बीस वर्ष और उससे अधिक आयु वाले’ उसका स्वाभाविक सामूहिक अर्थ देता है। संबंधसूचक ‘की’ पिछले पद की ‘गिनती’ से इस अपूर्ण वाक्यांश का संबंध बनाए रखता है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: जैसा ... आज्ञा दी थी
  rationale: כַּאֲשֶׁר तुलना/अनुरूपता बताता है और צִוָּה स्पष्ट आदेश को व्यक्त करता है। हिन्दी में पूर्व आदेश के संदर्भ के कारण पूर्ण भूतकाल स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम YHWH को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת निश्चित कर्म का चिह्न है; हिन्दी में उसका कार्य ‘को’ से व्यक्त होता है।
- source_word: וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ यहाँ पूरे जातीय समुदाय का मानक नाम है; आधुनिक हिन्दी में ‘इस्राएली’ स्पष्ट और स्वाभाविक है।
- source_word: הַיֹּצְאִים מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से निकले
  rationale: कर्तृवाचक कृदन्त निर्गमन करने वाले समुदाय की पहचान कराता है। ‘निकले’ घटना और सामूहिक पहचान दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना लिप्यंतरित करता है; किसी संप्रदायगत व्याख्या को नहीं जोड़ता।
- issue: पद की व्याकरणिक अपूर्णता
  choice: पिछले पद से संबंध दिखाते हुए वाक्यखंडों और दीर्घ विराम-चिह्नों को बनाए रखना
  alternative: ‘उनकी गिनती करो’ और ‘ये थे’ जैसे निहित शब्द जोड़कर पूरा वाक्य बनाना
  rationale: मसोराई पद अपने आप में व्याकरणिक रूप से खंडित है और आसपास के पदों पर निर्भर करता है। बिना चिह्नित पूरक शब्द जोड़ना मूल की वास्तविक असहजता और संरचनात्मक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। मूल पद की खंडित वाक्य-रचना को दीर्घ विराम-चिह्नों से स्पष्ट किया गया है, पर उसे बिना संकेत के पूर्ण वाक्य में नहीं बदला गया। ‘मिस्र देश’ भौगोलिक अभिव्यक्ति אֶרֶץ מִצְרָיִם को सुरक्षित रखता है।
