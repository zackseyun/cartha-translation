  yaml_path: translation/ot/numbers/026/023.yaml
  text: 'The sons of Issachar by their clans: of Tola[a], the clan of the Tolaites; of Puvah, the clan of the Punites.'
translation:
  language: hi
  text: 'इस्साकार के वंशज, उनके कुलों के अनुसार: तोला से तोलाइयों का कुल; पुव्वा[a] से पुनियों का कुल।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ संबंधित पदों और अनुवादों में पुव्वा नाम का रूप ‘पूआ’ मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשָּׂשכָר
  choice: इस्साकार के वंशज
  rationale: जनगणना की इस वंशावली में בְּנֵי केवल सीधे पुत्रों तक सीमित नहीं, बल्कि उनसे निकले वंशजों को सामूहिक रूप से दर्शाता है; इसलिए आधुनिक हिन्दी में ‘वंशज’ आशय को स्पष्ट करता है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्रीय उपसमूह या कुल को दर्शाता है; ‘कुल’ जनगणना-सूची के संदर्भ में स्वाभाविक और सटीक है।
- source_word: תּוֹלָע
  choice: तोला
  rationale: यह व्यक्ति का नाम है, इसलिए अर्थानुवाद न करके हिन्दी में लिप्यंतरण किया गया है।
- source_word: מִשְׁפַּחַת הַתּוֹלָעִי
  choice: तोलाइयों का कुल
  rationale: सम्बन्धवाचक रूप הַתּוֹלָעִי तोला से उत्पन्न वंश-समूह को दर्शाता है; हिन्दी बहुवचन ‘तोलाइयों’ से यह सामूहिक अर्थ स्पष्ट होता है।
- source_word: לְפֻוָה
  choice: पुव्वा से
  rationale: सूची में לְ प्रत्येक कुल के पूर्वज को प्रस्तुत करता है। मसोराई स्वरांकन פֻוָה के व्यंजन वाव को हिन्दी उच्चारण में स्पष्ट रखने के लिए ‘पुव्वा’ चुना गया है।
- source_word: מִשְׁפַּחַת הַפּוּנִי
  choice: पुनियों का कुल
  rationale: सम्बन्धवाचक הַפּוּנִי पुव्वा से निकले कुल का नाम है; ‘पुनियों’ स्रोत रूप के निकट और हिन्दी में सहज कुलनाम है।
