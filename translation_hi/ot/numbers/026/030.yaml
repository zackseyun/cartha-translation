  yaml_path: translation/ot/numbers/026/030.yaml
  text: 'These were the sons of Gilead: of Iezer[a], the clan of the Iezerites; of Helek, the clan of the Helekites.'
translation:
  language: hi
  text: 'गिलाद के वंशज ये थे: ईएजेर से ईएजेरी कुल और हेलेक से हेलेकी कुल।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “वंशज” के लिए इब्रानी में शाब्दिक रूप से “पुत्र” है; इस प्रसंग में इसका अर्थ पुरुष-वंश के वंशज या उनसे बने कुल भी हो सकता है, केवल सगे बेटे नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶּה בְּנֵי גִלְעָד
  choice: गिलाद के वंशज ये थे
  rationale: शाब्दिक रूप ‘गिलाद के पुत्र’ है, पर इस जनगणना और कुल-सूची के संदर्भ में בְּנֵי पुरुष-वंश के वंशजों या उनसे निकले कुलों को दर्शाता है; ‘वंशज’ आधुनिक हिन्दी में आशय स्पष्ट रखता है।
- source_word: אִיעֶזֶר
  choice: ईएजेर
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है; स्वर और व्यंजन-क्रम को यथासंभव सुरक्षित रखा गया है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: यहाँ शब्द गोत्र/वंश की जनजातीय उपशाखा को सूचित करता है; ‘कुल’ सामान्य आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: הָאִיעֶזְרִי
  choice: ईएजेरी कुल
  rationale: इब्रानी संबंधवाचक रूप उस कुल को दर्शाता है जो ईएजेर से निकला; हिन्दी में नाम के संबंधवाचक रूप के साथ ‘कुल’ अर्थ को स्पष्ट करता है।
- source_word: לְחֵלֶק
  choice: हेलेक से
  rationale: इस दोहराए जाने वाले जनगणना-सूत्र में לְ अगले कुल-पूर्वज से निकले वंश को प्रस्तुत करता है; हिन्दी में ‘से’ वंशगत संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַחֶלְקִי
  choice: हेलेकी कुल
  rationale: यह हेलेक से निकले कुल का संबंधवाचक नाम है; ‘हेलेकी कुल’ मूल रूप और अर्थ दोनों को बनाए रखता है।
