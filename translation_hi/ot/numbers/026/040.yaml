  register: भाषा आधुनिक, गरिमापूर्ण और जनगणना-वंशावली की संक्षिप्त शैली के अनुरूप रखी गई है। ‘कुल निकला’ हिन्दी में वंशगत उद्गम को स्वाभाविक बनाता है, जबकि मूल के दोनों समानांतर खंड सुरक्षित हैं।
