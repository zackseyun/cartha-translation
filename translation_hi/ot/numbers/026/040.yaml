  text: וַ/יִּהְי֥וּ בְנֵי בֶ֖לַע אַ֣רְדְּ וְ/נַעֲמָ֑ן מִשְׁפַּ֨חַת֙ הָֽ/אַרְדִּ֔י לְ/נַֽעֲמָ֔ן מִשְׁפַּ֖חַת הַֽ/נַּעֲמִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/040.yaml
  text: 'And the sons of Bela were Ard and Naaman: from Ard[a], the clan of the Ardite; from Naaman, the clan of the Naamite.'
translation:
  language: hi
  text: और बेला के पुत्र अर्द और नामान थे। अर्द से अर्दियों का कुल, और नामान से नामानियों का कुल निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: और ... थे
  rationale: यह रूप वंशावली की सूची के प्रवाह को बनाए रखते हुए हिब्रू कथात्मक संयोजन को सीधे व्यक्त करता है।
- source_word: בְנֵי בֶלַע
  choice: बेला के पुत्र
  rationale: בְנֵי का सीधा वंशावली-संबंधी अर्थ ‘पुत्र’ है; यहाँ अनावश्यक रूप से व्यापक ‘वंशज’ नहीं अपनाया गया।
- source_word: אַרְדְּ וְנַעֲמָן
  choice: अर्द और नामान
  rationale: व्यक्तिवाचक नामों का आधुनिक हिन्दी देवनागरी में स्रोत-रूप के निकट लिप्यंतरण किया गया है।
- source_word: מִשְׁפַּחַת
  choice: कुल
  rationale: गिनती की जनगणना-सूचियों में यह गोत्र के भीतर की वंशगत इकाई बताता है; आधुनिक हिन्दी में ‘कुल’ स्वाभाविक और संक्षिप्त है।
- source_word: הָאַרְדִּי
  choice: अर्दियों का
  rationale: हिब्रू संबंधवाचक जातिनाम को हिन्दी में अर्द से निकले समूह के बहुवचन नाम के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: לְנַעֲמָן ... הַנַּעֲמִי
  choice: नामान से नामानियों का कुल
  rationale: לְ वंशगत संबद्धता/उद्गम दर्शाता है और הַנַּעֲמִי नामान से बने कुलनाम को; हिन्दी रूप दोनों संबंध स्पष्ट रखता है।
