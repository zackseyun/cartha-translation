base_translation:
  language: en
  yaml_path: translation/ot/numbers/026/048.yaml
  text: 'The sons of Naphtali by their clans: of Jahzeel, the clan of the Jahzeelites; of Guni, the clan of the Gunites.'
translation:
  language: hi
  text: 'नप्ताली के पुत्र, उनके कुलों के अनुसार: यहसेल से यहसेलियों का कुल; गूनी से गूनियों का कुल।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי נַפְתָּלִי
  choice: नप्ताली के पुत्र
  rationale: इब्रानी रचना का सीधा अर्थ ‘नप्ताली के पुत्र’ है। वंशावली के संदर्भ में इसमें वंशज भी सम्मिलित हो सकते हैं, पर मूल अभिव्यक्ति को बनाए रखा गया है।
- source_word: לְמִשְׁפְּחֹתָם
  choice: उनके कुलों के अनुसार
  rationale: जनगणना और वंश-सूची के इस संदर्भ में מִשְׁפָּחָה के लिए ‘कुल’ स्वाभाविक है; לְ का वर्गीकरण-सूचक अर्थ ‘के अनुसार’ से व्यक्त होता है।
- source_word: לְיַחְצְאֵל
  choice: यहसेल से
  rationale: व्यक्तिनाम से पहले לְ यहाँ उस पूर्वज को सूचित करता है जिससे कुल की वंश-रेखा मानी जाती है; हिंदी में ‘से’ यह संबंध संक्षेप और स्वाभाविक रूप से बताता है।
- source_word: מִשְׁפַּחַת הַיַּחְצְאֵלִי
  choice: यहसेलियों का कुल
  rationale: जातिवाचक रूप הַיַּחְצְאֵלִי एक सामूहिक वंश-समूह को दर्शाता है; हिंदी बहुवचन ‘यहसेलियों’ से यह अर्थ स्पष्ट होता है।
- source_word: לְגוּנִי
  choice: गूनी से
  rationale: यह वही वंशावली-सूचक לְ है; ‘से’ गूनी से निकले कुल का संबंध दर्शाता है।
- source_word: מִשְׁפַּחַת הַגּוּנִי
  choice: गूनियों का कुल
  rationale: जातिवाचक संज्ञा को सामूहिक हिंदी बहुवचन में प्रस्तुत किया गया है, जिससे गूनी के वंशजों का कुल अभिप्रेत होता है।
