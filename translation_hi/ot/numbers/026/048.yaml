translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण वंशावली शैली अपनाई गई है। ‘कुल’ पूरे अध्याय के जनगणना-संदर्भ के अनुकूल है। व्यक्तिनामों का देवनागरी लिप्यंतरण सीधे इब्रानी उच्चारण के निकट रखा गया है।
