source:
  edition: WLC
  text: כִּֽי מֵ/רֹ֤אשׁ צֻרִים֙ אֶרְאֶ֔/נּוּ וּ/מִ/גְּבָע֖וֹת אֲשׁוּרֶ֑/נּוּ הֶן עָם֙ לְ/בָדָ֣ד יִשְׁכֹּ֔ן וּ/בַ/גּוֹיִ֖ם לֹ֥א יִתְחַשָּֽׁב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/009.yaml
  text: For from the top of the rocks I see him[a], and from the hills I behold him. Look, a people dwelling alone, and not reckoning itself among the nations.
translation:
  language: hi
  text: क्योंकि चट्टानों की चोटियों से मैं उसे देखता हूँ, और पहाड़ियों से उसे निहारता हूँ। देखो, एक प्रजा जो अलग बसी रहती है और अपने आपको अन्य जातियों में नहीं गिनती[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और राष्ट्रों में नहीं गिनी जाएगी।” हिब्रू क्रिया को निष्क्रिय अर्थ में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन की व्याख्या आरम्भ करता है; ‘क्योंकि’ उसके संयोजक और कारणसूचक बल को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵרֹאשׁ צֻרִים
  choice: चट्टानों की चोटियों से
  rationale: רֹאשׁ का स्थलाकृतिक अर्थ ‘चोटी’ है और צֻרִים चट्टानी ऊँचाइयों को दर्शाता है; बहुवचन व ऊँचे दृष्टि-बिंदु का बिंब सुरक्षित रखा गया है।
- source_word: אֶרְאֶנּוּ
  choice: मैं उसे देखता हूँ
  rationale: क्रिया में प्रथम पुरुष एकवचन और कर्म के लिए पुल्लिंग एकवचन प्रत्यय है; ‘उसे’ इस्राएल-प्रजा के सामूहिक एकवचन संकेत को बनाए रखता है।
- source_word: וּמִגְּבָעוֹת אֲשׁוּרֶנּוּ
  choice: और पहाड़ियों से उसे निहारता हूँ
  rationale: ‘पहाड़ियों’ समानांतर स्थल-बिंब को रखता है और ‘निहारता हूँ’ אֲשׁוּרֶנּוּ के ध्यानपूर्वक देखने के काव्यात्मक भाव को व्यक्त करता है।
- source_word: הֶן
  choice: देखो
  rationale: यह आगे के दृश्य की ओर ध्यान खींचने वाला संकेतक अव्यय है; ‘देखो’ आधुनिक और स्पष्ट है।
- source_word: עָם
  choice: प्रजा
  rationale: यहाँ עָם एक सामूहिक जातीय-राष्ट्रीय समुदाय है; ‘प्रजा’ काव्यात्मक गरिमा और सामूहिक पहचान दोनों व्यक्त करती है।
- source_word: לְבָדָד יִשְׁכֹּן
  choice: अलग बसी रहती है
  rationale: לְבָדָד पृथकता बताता है, जबकि अपूर्ण क्रिया विशेषता या निरंतर अवस्था प्रकट कर सकती है; यह हिन्दी वाक्यांश अनिवार्य सामाजिक एकाकीपन के बजाय विशिष्ट अलगाव को सहजता से रखता है।
- source_word: וּבַגּוֹיִם לֹא יִתְחַשָּׁב
  choice: और अपने आपको अन्य जातियों में नहीं गिनती
  rationale: हित्पएल रूप का आत्मवाचक/मध्य अर्थ सम्भव है। ‘अन्य जातियों’ से इस्राएल और जिन जातियों से उसकी तुलना है, उनका भेद हिन्दी में स्पष्ट होता है। निष्क्रिय अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: יִתְחַשָּׁב को आत्मवाचक/मध्य मानें या निष्क्रिय
  choice: अपने आपको अन्य जातियों में नहीं गिनती
  alternative: अन्य जातियों में नहीं गिनी जाएगी
  rationale: हित्पएल रूप आत्मवाचक अथवा मध्य अर्थ दे सकता है, इसलिए मुख्य पाठ में इस्राएल की पृथक सामूहिक पहचान का आत्मवाचक पक्ष रखा गया है। निष्क्रिय अर्थ भी व्याकरणतः सम्भव और अनुवाद-परम्परा में प्रचलित है, अतः उसे पादटिप्पणी में सुरक्षित रखा गया है; किसी जातीय श्रेष्ठता का दावा नहीं जोड़ा गया।
- issue: יִשְׁכֹּן का कालगत बल
  choice: बसी रहती है
  alternative: अलग बसेगी
  rationale: हिब्रू अपूर्ण रूप भविष्य या चारित्रिक अवस्था दोनों बता सकता है। इस वाणी में प्रजा की विशिष्ट स्थिति का वर्णन प्रमुख है; हिन्दी का वर्तमान-आदतन प्रयोग इस अस्पष्टता को अत्यधिक भविष्यसूचक बनाए बिना व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण काव्यात्मक शैली रखी गई है। ‘निहारता हूँ’ समानांतर पंक्ति में काव्यात्मक भेद देता है, जबकि ‘देखो’ और ‘बसी रहती है’ सामान्य पाठक के लिए सहज हैं। मुख्य पाठ का [a] पादटिप्पणी से ठीक प्रकार जुड़ा है।
