  yaml_path: translation/ot/numbers/023/025.yaml
  text: And Balak said to Balaam[a], “Neither curse him at all nor bless him at all!”
translation:
  language: hi
  text: और बालाक ने बिलाम से कहा, “उसे बिलकुल शाप मत दो, और उसे बिलकुल आशीर्वाद भी मत दो!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से अगले कथन का परिचय देता है।
- source_word: בָּלָק ... בִּלְעָם
  choice: बालाक ... बिलाम
  rationale: व्यक्तिनामों का हिन्दी बाइबल-परंपरा के अनुरूप लिप्यंतरण।
- source_word: גַּם ... גַּם
  choice: न तो ... न
  rationale: दो समानांतर निषेधों में दोनों क्रियाओं को अस्वीकार करने का स्वाभाविक हिन्दी रूप।
- source_word: קֹב לֹא תִקֳּבֶנּוּ
  choice: न तो उसे शाप ही देना
  rationale: धातु קבב को ‘शाप देना’ से व्यक्त किया गया है; infinitive absolute और finite verb के जोर को ‘ही’ सुरक्षित रखता है।
- source_word: בָּרֵךְ לֹא תְבָרֲכֶנּוּ
  choice: न उसे आशीर्वाद ही देना
  rationale: ברך का मानक अर्थ ‘आशीर्वाद देना’ है; समान व्याकरणिक जोर और काव्यात्मक संतुलन के लिए ‘ही’ दोहराया गया है।
