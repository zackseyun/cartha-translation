  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। समानांतर निषेध तथा दोनों infinitive absolute रचनाओं का प्रबल जोर ‘न तो ... ही, न ... ही’ से व्यक्त किया गया है।
