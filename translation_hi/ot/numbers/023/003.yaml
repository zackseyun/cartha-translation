  text: וַ/יֹּ֨אמֶר בִּלְעָ֜ם לְ/בָלָ֗ק הִתְיַצֵּב֮ עַל עֹלָתֶ/ךָ֒ וְ/אֵֽלְכָ֗ה אוּלַ֞י יִקָּרֵ֤ה יְהוָה֙ לִ/קְרָאתִ֔/י וּ/דְבַ֥ר מַה יַּרְאֵ֖/נִי וְ/הִגַּ֣דְתִּי לָ֑/ךְ וַ/יֵּ֖לֶךְ שֶֽׁפִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/003.yaml
  text: Then Balaam said to Balak[a], “Stand beside your burnt offering, and I will go. Perhaps Yahweh will come to meet me, and whatever he shows me I will tell you.” Then he went to a bare height.
translation:
  language: hi
  text: तब बिलाम ने बालाक से कहा, “अपनी होमबलि के पास खड़े रहो, और मैं जाता हूँ। शायद याहवे मुझसे मिलने आएँ; और जो कुछ वह मुझे दिखाएँगे, उसे मैं तुम्हें बता दूँगा।” फिर वह एक खुले, उजाड़ ऊँचे स्थान[a] पर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक नंगे ऊँचे स्थान’ अथवा ‘एक उजाड़ पहाड़ी पर।’ इब्रानी शब्द दुर्लभ है और संभवतः किसी खुले, वनस्पतिहीन ऊँचे स्थान को दर्शाता है।
    reason: दुर्लभ स्थलाकृतिक शब्द שֶׁפִי के अर्थ और वैकल्पिक अनुवाद स्पष्ट करना।
lexical_decisions:
- source_word: הִתְיַצֵּב עַל עֹלָתֶךָ
  choice: अपनी होमबलि के पास खड़े रहो
  rationale: हित्पाएल आज्ञार्थक रूप किसी स्थान पर दृढ़ता से खड़े रहने को कहता है। यहाँ עַל का स्थानिक अर्थ बलि के ‘पास’ है, न कि उसके ऊपर। עֹלָה को उसके विशिष्ट बलिदानी अर्थ में ‘होमबलि’ कहा गया है।
- source_word: וְאֵלְכָה
  choice: और मैं जाता हूँ
  rationale: प्रथम पुरुष कोहोर्टेटिव बिलाम के तत्काल इरादे को व्यक्त करता है। वर्तमानकालीन ‘मैं जाता हूँ’ स्वाभाविक हिन्दी में निकट भविष्य के संकल्प को दर्शाता है।
- source_word: אוּלַי יִקָּרֵה יְהוָה לִקְרָאתִי
  choice: शायद याहवे मुझसे मिलने आएँ
  rationale: אוּלַי की अनिश्चितता ‘शायद’ से बनी रहती है। נקרה לקראת के प्रसंगगत भाव को सहज हिन्दी में ‘मुझसे मिलने आएँ’ कहा गया है; इसमें आकस्मिक भेंट की संभावित छाया को अनावश्यक रूप से निश्चित नहीं बनाया गया।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में प्रयुक्त चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: וּדְבַר מַה יַּרְאֵנִי
  choice: और जो कुछ वह मुझे दिखाएँगे
  rationale: यह संक्षिप्त इब्रानी पदबंध प्रकाशन की विषय-वस्तु बताता है। ‘जो कुछ’ מַה की अनिर्दिष्ट व्यापकता और ‘दिखाएँगे’ ראה के हिफ़िल अर्थ को व्यक्त करता है।
- source_word: וְהִגַּדְתִּי לָךְ
  choice: उसे मैं तुम्हें बता दूँगा
  rationale: נגד के हिफ़िल का अर्थ बताना या सूचित करना है। ‘बता दूँगा’ अपेक्षित सूचना को बालाक तक पहुँचाने का आशय स्वाभाविक हिन्दी में देता है।
- source_word: שֶׁפִי
  choice: एक खुले, उजाड़ ऊँचे स्थान
  rationale: दुर्लभ शब्द संभवतः वनस्पतिहीन या खुली ऊँचाई को सूचित करता है। मुख्य पाठ में दोनों प्रमुख स्थलाकृतिक लक्षण रखे गए हैं, जबकि शब्द की अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ईश्वर के लिए हिन्दी क्रिया-वचन
  choice: आदरार्थक बहुवचन क्रियाएँ ‘आएँ/दिखाएँगे’
  alternative: व्याकरणिक एकवचन ‘आएगा/दिखाएगा’
  rationale: आधुनिक गरिमापूर्ण हिन्दी में परमेश्वर के लिए आदरार्थक क्रिया-रूप स्वाभाविक हैं; इससे मूल के एक ईश्वर के आशय में कोई संख्यात्मक परिवर्तन नहीं होता।
- issue: बिलाम की अपेक्षा की निश्चितता
  choice: ‘शायद’ द्वारा संभाव्यता बनाए रखना
  alternative: निश्चित कथन कि याहवे उससे मिलेंगे
  rationale: אוּלַי स्पष्ट रूप से अनिश्चितता व्यक्त करता है। पाठ बिलाम की आशा बताता है, सुनिश्चित ईश्वरीय प्रतिज्ञा नहीं।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होमबलि’ सामान्य हिन्दी बाइबलीय शब्दावली से परिचित पाठकों के लिए सटीक है। संबोधन में ‘तुम’ और ईश्वर के लिए आदरार्थक क्रिया-रूप अपनाए गए हैं। पादटिप्पणी-चिह्न उसी शब्दसमूह के बाद रखा गया है जिससे उसका संबंध है।
