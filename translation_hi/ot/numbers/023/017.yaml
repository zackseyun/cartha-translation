language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֣א אֵלָ֗י/ו וְ/הִנּ֤/וֹ נִצָּב֙ עַל עֹ֣לָת֔/וֹ וְ/שָׂרֵ֥י מוֹאָ֖ב אִתּ֑/וֹ וַ/יֹּ֤אמֶר ל/וֹ֙ בָּלָ֔ק מַה דִּבֶּ֖ר יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/017.yaml
  text: He came to him[a], and behold, he was standing by his burnt offering, with the princes of Moab with him. And Balak said to him, “What has Yahweh spoken?”
translation:
  language: hi
  text: बिलाम बालाक के पास आया। और देखो, बालाक अपनी होमबलि के पास खड़ा था, और मोआब के प्रधान[a] उसके साथ थे। बालाक ने उससे पूछा, “याहवे ने क्या कहा है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब के अधिकारी।”
    reason: שָׂרִים का अर्थ ‘प्रधान’, ‘शासक’ या ‘अधिकारी’ हो सकता है; यहाँ ‘अधिकारी’ एक उचित वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: וַיָּבֹא אֵלָיו
  choice: बिलाम उसके पास आया
  rationale: בוא का मूल अर्थ ‘आना’ है। प्रसंग में बिलाम लौटकर आ रहा है, फिर भी मूल पाठ केवल ‘उसके पास आया’ कहता है; इसलिए ‘लौट आया’ जैसी व्याख्यात्मक वृद्धि नहीं की गई। स्वाभाविक हिन्दी और स्पष्ट संदर्भ के लिए कर्ता का नाम ‘बिलाम’ रखा गया है।
- source_word: וְהִנּוֹ
  choice: और देखो
  rationale: यह ध्यान आकर्षित करने वाला कथात्मक संकेत है। ‘और देखो’ मूल की सजीवता और अचानक दृश्य पर ध्यान दिलाने वाले प्रभाव को बनाए रखता है।
- source_word: נִצָּב
  choice: खड़ा था
  rationale: कृदन्त उस समय जारी अवस्था को व्यक्त करता है; ‘खड़ा था’ आधुनिक हिन्दी में इसका स्वाभाविक रूप है।
- source_word: עַל עֹלָתוֹ
  choice: अपनी होमबलि के पास
  rationale: עַל यहाँ स्थान-संबंध में ‘के पास’ या ‘के निकट’ का अर्थ देता है। ‘होमबलि’ עֹלָה के लिए प्रचलित धार्मिक पद है, अर्थात पूरी तरह जलाई जाने वाली बलि।
- source_word: וְשָׂרֵי מוֹאָב אִתּוֹ
  choice: और मोआब के प्रधान उसके साथ थे
  rationale: שָׂרִים शासकों, प्रधानों या अधिकारियों को सूचित कर सकता है। ‘प्रधान’ दरबारी नेतृत्व की गरिमा बनाए रखता है, जबकि ‘अधिकारी’ को पादटिप्पणी में वैकल्पिक अर्थ के रूप में दिया गया है।
- source_word: מַה דִּבֶּר
  choice: क्या कहा है?
  rationale: דבר का अर्थ ‘बोलना/कहना’ है। प्रश्न में पूर्ण क्रिया के वर्तमान परिणाम को हिन्दी का ‘क्या कहा है?’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम सीधे प्रयुक्त है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे एक उपाधि से बदल देता।
- issue: सर्वनामों के संदर्भ की स्पष्टता
  choice: पहले कर्ता को ‘बिलाम’ और खड़े व्यक्ति को ‘बालाक’ के रूप में स्पष्ट किया गया
  alternative: वह उसके पास आया, और देखो, वह खड़ा था
  rationale: इब्रानी सर्वनामों के व्यक्ति प्रसंग से स्पष्ट हैं; हिन्दी में लगातार अस्पष्ट ‘वह/उसके’ रखने से ऐसी उलझन पैदा होती जो मूल श्रोताओं के लिए अभिप्रेत नहीं थी। नाम देना अर्थ को नहीं बदलता, बल्कि स्वाभाविक स्पष्टता देता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ मूल कथन की सजीवता बचाता है; ‘होमबलि’ बाइबिलीय बलिदान के लिए प्रचलित हिन्दी पद है। पादटिप्पणी-चिह्न उसी शब्द के बाद रखा गया है जिससे उसका संबंध है।
