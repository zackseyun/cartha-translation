source:
  edition: WLC
  text: הֶן עָם֙ כְּ/לָבִ֣יא יָק֔וּם וְ/כַ/אֲרִ֖י יִתְנַשָּׂ֑א לֹ֤א יִשְׁכַּב֙ עַד יֹ֣אכַל טֶ֔רֶף וְ/דַם חֲלָלִ֖ים יִשְׁתֶּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/024.yaml
  text: Look[a], a people rises like a lioness, and lifts itself up like a lion; it will not lie down until it eats the prey and drinks the blood of the slain.
translation:
  language: hi
  text: देखो, एक जनसमूह सिंहनी[a] के समान उठ खड़ा होगा और सिंह के समान अपने को ऊँचा उठाएगा; वह तब तक नहीं लेटेगा, जब तक शिकार को खा न ले और मारे हुओं का लहू न पी ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सिंह।” इब्रानी शब्द לָבִיא का अर्थ अधिक सामान्य रूप से “सिंह” भी हो सकता है; “सिंहनी” अनुवाद अगले इब्रानी शब्द אֲרִי (“सिंह”) से शब्दगत भेद बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֶן
  choice: देखो
  rationale: यह विस्मय और जोर के साथ ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: עָם
  choice: एक प्रजा
  rationale: यह इस्राएल के लोगों को एक सामूहिक इकाई के रूप में दर्शाता है; ‘प्रजा’ काव्यात्मक गरिमा रखते हुए व्यक्ति-समूह का भाव बनाए रखता है।
- source_word: כְּלָבִיא
  choice: सिंहनी
  rationale: לָבִיא का अर्थ सामान्यतः ‘सिंह’ भी हो सकता है, पर ‘सिंहनी’ अगले शब्द אֲרִי से शब्दगत भेद बनाए रखती है और काव्यात्मक पशु-चित्र को स्पष्ट करती है।
- source_word: יָקוּם
  choice: उठ खड़ी होती है
  rationale: קום का रूप यहाँ जागकर या बलपूर्वक उठने की सिंह-सदृश मुद्रा व्यक्त करता है; हिन्दी में यह वाक्यांश चित्र को स्वाभाविक ढंग से सामने लाता है।
- source_word: וְכַאֲרִי יִתְנַשָּׂא
  choice: और सिंह के समान तनकर खड़ी होती है
  rationale: התנשא यहाँ अपने को ऊपर उठाने और प्रभावशाली मुद्रा में खड़े होने का भाव देता है; ‘तनकर खड़ी होती है’ पशु-चित्र और प्रताप दोनों को बनाए रखता है।
- source_word: לֹא יִשְׁכַּב
  choice: वह तब तक नहीं लेटती
  rationale: यह ठोस सिंह-चित्र को बनाए रखता है। हिन्दी का वर्तमानकालीन रूप इस काव्यात्मक भविष्यवाणी में निश्चित और चरित्रगत क्रिया दोनों का स्वाभाविक बोध देता है।
- source_word: עַד יֹאכַל טֶרֶף
  choice: जब तक शिकार को खा न ले
  rationale: ‘खा न ले’ मूल क्रिया יֹאכַל के सीधे अर्थ को रखता है और ‘निगलने’ जैसे अतिरिक्त तीव्र अर्थ नहीं जोड़ता।
- source_word: וְדַם חֲלָלִים יִשְׁתֶּה
  choice: और मारे हुओं का लहू न पी ले
  rationale: חֲלָלִים युद्ध या हिंसा के प्रसंग में मारे गए लोगों को सूचित करता है। ‘लहू’ मूल की तीखी और ठोस विजय-छवि बनाए रखता है।
theological_decisions:
- issue: बिलाम की वाणी में हिंसक सिंह-छवि
  choice: शिकार खाने और मारे हुओं का लहू पीने की कठोर छवि को यथावत रखना
  alternative: इसे केवल सामान्य विजय या सामर्थ्य की भाषा में नरम कर देना
  rationale: इब्रानी पाठ जानबूझकर तीखी शिकारी और युद्ध-संबंधी छवि का प्रयोग करता है। यह इस्राएल की अजेय विजय को रूपक में दर्शाता है, न कि सचमुच लहू पीने का आदेश देता है; इसलिए मूल का तनाव कम नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। ‘तनकर खड़ी होती है’ और ‘लहू’ मूल की सजीव सिंह तथा युद्ध-छवि को साधारण पाठकों के लिए स्पष्ट रखते हैं।
