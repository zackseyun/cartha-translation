base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/029.yaml
  text: Then Balaam said to Balak, “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: hi
  text: तब बिलाम ने बालाक से कहा, “मेरे लिए यहाँ सात वेदियाँ बना, और मेरे लिए यहाँ सात बैल और सात मेढ़े तैयार कर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּלְעָם ... אֶל־בָּלָק
  choice: बिलाम ने बालाक से
  rationale: व्यक्तिनामों का मानक हिन्दी लिप्यंतरण किया गया है और אֶל के साथ कथन की स्वाभाविक हिन्दी रचना ‘से कहा’ अपनाई गई है।
- source_word: בְּנֵה לִי בָזֶה
  choice: मेरे लिए यहाँ ... बनवा
  rationale: לִי हितार्थक है और בָזֶה का स्वाभाविक अर्थ ‘यहाँ’ है। राजा बालाक से वेदियाँ निर्मित कराने की आज्ञा के संदर्भ में प्रेरणार्थक ‘बनवा’ सहज है।
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: सात वेदियाँ
  rationale: संख्या और संज्ञा का सीधा, प्रचलित हिन्दी रूप।
- source_word: וְהָכֵן לִי בָזֶה
  choice: और मेरे लिए यहाँ ... तैयार कर
  rationale: हिफ़ील आज्ञार्थक का अर्थ यहाँ बलि के पशुओं को प्रस्तुत/तैयार रखना है; ‘तैयार कर’ संक्षिप्त और स्वाभाविक है।
- source_word: שִׁבְעָה פָרִים
  choice: सात बैल
  rationale: פַּר बलिदान के संदर्भ में नर गोवंश को दर्शाता है; आयु को अनावश्यक रूप से निश्चित किए बिना ‘बैल’ स्पष्ट है।
- source_word: וְשִׁבְעָה אֵילִים
  choice: और सात मेढ़े
  rationale: אֵילִים नर भेड़ों के लिए प्रयुक्त है; आधुनिक मानक हिन्दी में ‘मेढ़े’ इसका सटीक और सुबोध रूप है।
