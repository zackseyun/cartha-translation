source:
  edition: WLC
  text: וַ/יַּ֣עַן בִּלְעָ֔ם וַ/יֹּ֖אמֶר אֶל בָּלָ֑ק הֲ/לֹ֗א דִּבַּ֤רְתִּי אֵלֶ֨י/ךָ֙ לֵ/אמֹ֔ר כֹּ֛ל אֲשֶׁר יְדַבֵּ֥ר יְהוָ֖ה אֹת֥/וֹ אֶֽעֱשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/026.yaml
  text: Balaam answered and said to Balak[a], “Did I not speak to you, saying, ‘All that Yahweh speaks, that I will do’?”
translation:
  language: hi
  text: बिलाम ने उत्तर में बालाक से कहा, “क्या मैंने तुमसे नहीं कहा था, ‘जो कुछ याहवे कहे, वही मैं करूँगा’?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर दिया
  rationale: हिब्रानी की दो-क्रियात्मक संवाद-भूमिका का स्वाभाविक हिन्दी रूप; ‘उत्तर देकर कहा’ अनावश्यक रूप से भारी होता।
- source_word: הֲלֹא דִּבַּרְתִּי אֵלֶיךָ לֵאמֹר
  choice: क्या मैंने तुमसे यह नहीं कहा था
  rationale: नकारात्मक आलंकारिक प्रश्न और पहले कही हुई बात का स्मरण—दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כֹּל אֲשֶׁר
  choice: जो कुछ
  rationale: अभिव्यक्ति की समग्रता को स्वाभाविक और निकट रूप में सुरक्षित रखता है।
- source_word: יְדַבֵּר יְהוָה
  choice: यहोवा कहेगा
  rationale: अपूर्ण क्रिया को प्रसंगानुसार भविष्य/परिस्थितिजन्य अर्थ में लिया गया है; हिन्दी में यह बिलाम के आगामी आचरण का आधार स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप में रखा गया है।
- source_word: אֹתוֹ אֶעֱשֶׂה
  choice: वही मैं करूँगा
  rationale: אֹתוֹ के पूर्ववर्ती कथन की ओर संकेत और हिब्रानी के बलयुक्त पुनरारंभ को ‘वही’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल का व्यक्तिगत नाम स्पष्ट रखा गया है; ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में अधिक पहचाना जाने वाला देवनागरी रूप है, जबकि ‘याहवे’ संभावित उच्चारण का वैकल्पिक लिप्यंतरण है।
- issue: बिलाम के कथन में बाध्यता या संकल्प
  choice: वही मैं करूँगा
  alternative: वही मुझे करना होगा
  rationale: हिब्रानी אֶעֱשֶׂה सीधे भविष्यकालीन कथन है; बाध्यता का भाव प्रसंग में हो सकता है, पर पद में अलग से ‘अवश्य/करना होगा’ जोड़ना व्याख्यात्मक होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद में अनावश्यक शाब्दिक दोहराव से बचते हुए आलंकारिक प्रश्न, समग्रता और ‘वही’ के बल को बनाए रखा गया है।
