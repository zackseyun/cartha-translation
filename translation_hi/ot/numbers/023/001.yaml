source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר בִּלְעָם֙ אֶל בָּלָ֔ק בְּנֵה לִ֥/י בָ/זֶ֖ה שִׁבְעָ֣ה מִזְבְּחֹ֑ת וְ/הָכֵ֥ן לִ/י֙ בָּ/זֶ֔ה שִׁבְעָ֥ה פָרִ֖ים וְ/שִׁבְעָ֥ה אֵילִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/001.yaml
  text: Then Balaam said to Balak[a], “Build seven altars for me here, and prepare seven bulls and seven rams for me here.”
translation:
  language: hi
  text: तब बिलाम ने बालाक से कहा, “मेरे लिए यहाँ सात वेदियाँ बनाओ, और मेरे लिए यहाँ सात बैल और सात मेढ़े तैयार करो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶל בָּלָק
  choice: बालाक से
  rationale: कथन के संबोधन को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है; बालाक व्यक्तिनाम का प्रचलित लिप्यंतरण है।
- source_word: בְּנֵה לִי בָזֶה
  choice: मेरे लिए यहाँ ... बनाओ
  rationale: आज्ञार्थक क्रिया, हितसूचक ‘मेरे लिए’ और स्थानसूचक ‘यहाँ’—तीनों को स्पष्ट और स्वाभाविक रूप से रखा गया है।
- source_word: שִׁבְעָה מִזְבְּחֹת
  choice: सात वेदियाँ
  rationale: बलिदान-संदर्भ में מִזְבֵּחַ के लिए ‘वेदी’ सटीक और प्रचलित हिन्दी शब्द है।
- source_word: וְהָכֵן
  choice: और ... तैयार करो
  rationale: हिफ़ील आज्ञार्थक का अर्थ यहाँ सामग्री को बलिदान के लिए तैयार रखना है; ‘तैयार करो’ स्पष्ट और सहज है।
- source_word: שִׁבְעָה פָרִים
  choice: सात बैल
  rationale: פַּר बलिदान के संदर्भ में नर गोवंश को सूचित करता है; मूल में आयु अलग से स्पष्ट न होने के कारण ‘जवान बैल’ नहीं जोड़ा गया।
- source_word: וְשִׁבְעָה אֵילִים
  choice: और सात मेढ़े
  rationale: אֵילִים नर भेड़ों को सूचित करता है; हिन्दी में ‘मेढ़े’ इसका सटीक सामान्य रूप है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल में בָזֶה की पुनरावृत्ति को दोनों बार ‘यहाँ’ रखकर स्थान पर दिए गए दोहरे बल को सुरक्षित रखा गया है; इसलिए पादटिप्पणी आवश्यक नहीं मानी गई।
