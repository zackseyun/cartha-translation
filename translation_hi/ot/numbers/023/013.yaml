source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר אֵלָ֜י/ו בָּלָ֗ק לך נָּ֨א אִתִּ֜/י אֶל מָק֤וֹם אַחֵר֙ אֲשֶׁ֣ר תִּרְאֶ֣/נּוּ מִ/שָּׁ֔ם אֶ֚פֶס קָצֵ֣/הוּ תִרְאֶ֔ה וְ/כֻלּ֖/וֹ לֹ֣א תִרְאֶ֑ה וְ/קָבְ/נוֹ לִ֖/י מִ/שָּֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/013.yaml
  text: Then Balak said to him, “Please come with me to another place, from where you may see him. You will see only the edge of him, and you will not see all of him; then curse him for me from there.”
translation:
  language: hi
  text: तब बालाक ने उससे कहा, “कृपया मेरे साथ किसी दूसरी जगह चलो, जहाँ से तुम उसे[b] देखोगे। तुम्हें केवल उसका एक छोर[a] दिखाई देगा, पर तुम उसे पूरा नहीं देखोगे। फिर वहीं से मेरे लिए उसे शाप दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ “उसका छोर” या “उसका अंतिम भाग” है; आशय यह है कि इस्राएल का केवल एक भाग दिखाई देगा।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में इस्राएल के लिए यहाँ और आगे एकवचन सर्वनाम हैं, क्योंकि पूरे जनसमुदाय को एक इकाई माना गया है; भावानुसार बहुवचन “उन्हें” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: לֶךְ־נָא אִתִּי
  choice: कृपया मेरे साथ ... चलो
  rationale: הלך के आदेश और विनय-सूचक נָא को स्वाभाविक आधुनिक हिन्दी में नम्र आग्रह के रूप में व्यक्त किया गया है; אִתִּי का साथ-संबंध स्पष्ट रखा गया है।
- source_word: אֶל־מָקוֹם אַחֵר
  choice: एक दूसरी जगह
  rationale: नए भौगोलिक स्थान का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר תִּרְאֶנּוּ מִשָּׁם
  choice: जहाँ से तुम उसे देख सको
  rationale: नए स्थान को देखने के संभावित दृष्टि-बिंदु के रूप में व्यक्त करता है और एकवचन कर्म-प्रत्यय को ‘उसे’ से बनाए रखता है।
- source_word: אֶפֶס קָצֵהוּ
  choice: केवल उसका एक छोर
  rationale: אֶפֶס यहाँ सीमा या प्रतिबंध बताता है और קָצֶה किनारे, छोर या अंतिम भाग को; यह रूप इस्राएल के केवल आंशिक दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכֻלּוֹ לֹא תִרְאֶה
  choice: वह पूरा दिखाई नहीं देगा
  rationale: आंशिक और संपूर्ण दृश्य के विरोध को स्पष्ट रखता है तथा इस्राएल के लिए मूल का सामूहिक एकवचन बनाए रखता है।
- source_word: וְקָבְנוֹ לִי מִשָּׁם
  choice: फिर वहीं से मेरे लिए उसे शाप दो
  rationale: קבב का प्रसंगानुकूल अर्थ ‘शाप देना’ है; ‘फिर’ क्रम को और ‘वहीं से’ नए दृष्टि-बिंदु से क्रिया करने की स्थानिक बात को व्यक्त करता है।
theological_decisions:
- issue: इस्राएल के लिए एकवचन सर्वनाम
  choice: मुख्य पाठ में ‘उसे/उसका/वह’ रखकर इस्राएल को एक सामूहिक एकवचन के रूप में प्रस्तुत किया गया है।
  alternative: हिन्दी में बहुवचन ‘उन्हें/उनका/वे’ किया जा सकता था।
  rationale: इब्रानी पाठ लगातार पुल्लिंग एकवचन प्रत्ययों का प्रयोग करता है। इसे बनाए रखने से इस्राएल को एक जनसमुदाय के रूप में एक इकाई देखने वाली मूल वाक्य-रचना और उसका तनाव सुरक्षित रहता है।
- issue: לֶךְ का दिशासूचक भाव
  choice: ‘मेरे साथ ... चलो’
  alternative: ‘मेरे साथ ... जाओ’
  rationale: वक्ता स्वयं साथ जाने का आग्रह कर रहा है, इसलिए हिन्दी में ‘चलो’ सहभागिता और गमन दोनों को अधिक स्वाभाविक ढंग से व्यक्त करता है, बिना अर्थ बदले।
translation_notes:
  register: आधुनिक मानक हिन्दी, संवाद में स्वाभाविक ‘तुम’ रूप, और साधारण पाठकों के लिए स्पष्ट किन्तु गरिमापूर्ण भाषा। ‘छोर’ मूल रूपक को बचाता है; फुटनोट उसके आंशिक दृश्य का आशय स्पष्ट करता है।
