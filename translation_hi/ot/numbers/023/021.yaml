source:
  edition: WLC
  text: לֹֽא הִבִּ֥יט אָ֨וֶן֙ בְּ/יַעֲקֹ֔ב וְ/לֹא רָאָ֥ה עָמָ֖ל בְּ/יִשְׂרָאֵ֑ל יְהוָ֤ה אֱלֹהָי/ו֙ עִמּ֔/וֹ וּ/תְרוּעַ֥ת מֶ֖לֶךְ בּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/021.yaml
  text: He has not looked on trouble in Jacob, nor has he seen misery in Israel. The Yahweh his God is with him, and the shout of a king is among them.
translation:
  language: hi
  text: उसने याकूब में विपत्ति पर ध्यान नहीं दिया, और इस्राएल में दुःख नहीं देखा।[a] याहवे, उसका परमेश्वर, उसके साथ है,[b] और राजा की जयजयकार उनके बीच है।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक रूप से: “उसने याकूब में अधर्म नहीं देखा, और इस्राएल में अनर्थ नहीं देखा।” इन इब्रानी शब्दों के नैतिक बुराई के साथ-साथ विपत्ति, कष्ट या दुःख के अर्थ भी हो सकते हैं।'
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “उसके साथ” है; इस पद में याकूब/इस्राएल को एक सामूहिक व्यक्ति के रूप में एकवचन में संबोधित किया गया है।
    reason: lexical_alternative
  - marker: c
    text: “राजा की जयजयकार” इस्राएल के बीच राजकीय अभिनंदन को दर्शा सकती है और संभवतः याहवे की राजकीय उपस्थिति की ओर संकेत करती है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִבִּיט
  choice: ध्यान नहीं दिया
  rationale: यह क्रिया ध्यानपूर्वक देखने या दृष्टि लगाने का भाव रखती है; हिन्दी में यह अभिव्यक्ति उस विशेष अर्थ को स्वाभाविक रूप से व्यक्त करती है और समानांतर רָאָה से भेद भी बनाए रखती है।
- source_word: אָוֶן
  choice: विपत्ति
  rationale: शब्द का अर्थ अनर्थ, संकट अथवा नैतिक बुराई हो सकता है। आशीर्वाद के प्रसंग में ‘विपत्ति’ उपयुक्त है, जबकि नैतिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: רָאָה
  choice: नहीं देखा
  rationale: सामान्य दृश्य क्रिया का सीधा और स्वाभाविक अनुवाद।
- source_word: עָמָל
  choice: दुःख
  rationale: यह शब्द कष्ट, क्लेश, श्रम या अनर्थ का अर्थ दे सकता है; ‘दुःख’ पहले समानांतर पद से भेद रखते हुए पीड़ा का भाव व्यक्त करता है।
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: याकूब में / इस्राएल में
  rationale: स्थानवाचक अर्थ और इब्रानी काव्यात्मक समानांतरता दोनों सुरक्षित रहते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, किसी पदवी से प्रतिस्थापित नहीं।
- source_word: אֱלֹהָיו עִמּוֹ
  choice: उसका परमेश्वर उसके साथ है
  rationale: एकवचन प्रत्ययों को सुरक्षित रखा गया है; याकूब/इस्राएल यहाँ सामूहिक एकवचन के रूप में व्यक्त है।
- source_word: תְרוּעַת מֶלֶךְ
  choice: राजा की जयजयकार
  rationale: תְרוּעָה ऊँची पुकार, युद्धघोष या राजकीय अभिनंदन हो सकता है। राजा के साथ ‘जयजयकार’ स्वाभाविक है, पर राजा की पहचान अनिर्धारित रहती है।
- source_word: בּוֹ
  choice: उनके बीच
  rationale: मूल रूप से ‘उसमें’ सामूहिक एकवचन इस्राएल की ओर संकेत करता है; हिन्दी में लोगों के समुदाय के लिए ‘उनके बीच’ अर्थ को स्वाभाविक बनाता है।
theological_decisions:
- issue: क्या पद इस्राएल को नैतिक रूप से निष्पाप घोषित करता है या उसके बीच कोई विपत्ति/दुःख न देखने की बात कहता है
  choice: मुख्य पाठ में विपत्ति और दुःख का अर्थ लिया गया है।
  alternative: उसने याकूब में अधर्म नहीं देखा, और इस्राएल में अनर्थ नहीं पाया।
  rationale: אָוֶן और עָמָל दोनों का नैतिक तथा कष्ट-संबंधी अर्थ संभव है। प्रसंग परमेश्वर की अनुकूल उपस्थिति और इस्राएल पर आशीष का है; फिर भी वास्तविक lexical ambiguity पादटिप्पणी में रखी गई है।
- issue: ‘राजा’ की पहचान
  choice: ‘राजा की जयजयकार’ कहकर पहचान खुली रखी गई है।
  alternative: राजा याहवे स्वयं है अथवा किसी राजा के लिए राजकीय अभिनंदन है।
  rationale: याहवे की उपस्थिति से दैवी राजत्व का संकेत संभव है, लेकिन इब्रानी वाक्यांश राजा की पहचान स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली। ‘याकूब’ और ‘इस्राएल’ की काव्यात्मक समानांतरता, सामूहिक एकवचन, तथा नैतिक बुराई बनाम विपत्ति की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
