  text: וַ/יֹּ֨אמֶר֙ אֶל בָּלָ֔ק הִתְיַצֵּ֥ב כֹּ֖ה עַל עֹלָתֶ֑/ךָ וְ/אָנֹכִ֖י אִקָּ֥רֶה כֹּֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/015.yaml
  text: And he said to Balak[a], “Stand here beside your burnt offering, and I will go to meet him over there.”
translation:
  language: hi
  text: और उसने बालाक से कहा, “अपनी होमबलि के पास यहीं खड़े रहो, और मैं वहाँ मिलने जाऊँगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं वहाँ मिलूँगा” अथवा “मेरा वहाँ सामना होगा।” हिब्रू क्रिया संक्षिप्त है; इस पद में जिससे भेंट या सामना होना है, उसका उल्लेख नहीं किया गया है।
    reason: शब्दार्थगत विकल्प और मूल में अनकहे कर्म की अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־בָּלָק
  choice: और उसने बालाक से कहा
  rationale: हिब्रू कथात्मक क्रम को सहज आधुनिक हिन्दी में बनाए रखता है; कर्ता पिछले संदर्भ से समझा जाता है।
- source_word: הִתְיַצֵּב
  choice: खड़ा रह
  rationale: हित्पएल आज्ञार्थक रूप किसी स्थान पर अपना स्थान लेने और वहीं ठहरे रहने का भाव देता है; प्रसंग में यह हिन्दी अभिव्यक्ति स्वाभाविक है।
- source_word: כֹּה ... כֹּה
  choice: यहीं ... वहाँ
  rationale: दोनों पद इस प्रसंग में स्थानसूचक हैं। ‘यहीं’ बालाक के स्थान और ‘वहाँ’ वक्ता के दूसरे स्थान के बीच का संकेतात्मक अंतर स्पष्ट करते हैं।
- source_word: עַל עֹלָתֶךָ
  choice: अपनी होमबलि के पास
  rationale: עַל यहाँ बलि के ऊपर खड़े होने के बजाय उसके निकट स्थान को दर्शाता है; עֹלָה के लिए प्रचलित और विशिष्ट शब्द ‘होमबलि’ रखा गया है।
- source_word: וְאָנֹכִי
  choice: और मैं
  rationale: स्पष्ट सर्वनाम वक्ता और बालाक की अलग-अलग क्रियाओं के बीच हल्का बल अथवा विरोध बनाए रखता है।
- source_word: אִקָּרֶה
  choice: उससे मिलने जाऊँगा
  rationale: निफ़अल रूप यहाँ अपेक्षित भेंट या सामना व्यक्त करता है। हिन्दी में यह रूप प्रसंगगत गमन और व्यक्तिगत भेंट को स्वाभाविक ढंग से व्यक्त करता है, जबकि मूल की संक्षिप्तता से उत्पन्न विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: बिलाम की अपेक्षित भेंट का अनकहा कर्म
  choice: ‘उससे’ जोड़कर व्यक्तिगत भेंट का भाव व्यक्त किया गया है, जिसका संदर्भ इस प्रसंग में यहोवा की ओर है।
  alternative: ‘मैं वहाँ मिलूँगा’ या ‘मेरा वहाँ सामना होगा’, जिसमें कर्म अनकहा रहे।
  rationale: हिब्रू इस पद में भेंट के व्यक्ति का नाम नहीं लेता, यद्यपि व्यापक प्रसंग दिव्य भेंट की ओर संकेत करता है। मुख्य पाठ में ‘उससे’ सहज हिन्दी देता है, पर उसे ‘यहोवा’ कहकर मूल से अधिक स्पष्ट नहीं करता; पादटिप्पणी मूल की वास्तविक संक्षिप्तता और अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘होमबलि’ बाइबलीय बलिदान का सटीक, प्रचलित पद है। बालाक को दी गई एकवचन आज्ञा के लिए ‘खड़ा रह’ रखा गया है; भाषा न अत्यधिक संस्कृतनिष्ठ है, न बोलचाल की अनौपचारिकता लिए हुए।
