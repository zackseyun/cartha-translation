base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/027.yaml
  text: Then Balak said to Balaam[a], “Please come, let me take you to another place. Perhaps it will be right in the eyes of God, and you shall curse him for me from there.”
translation:
  language: hi
  text: तब बालाक ने बिलाम से कहा, “कृपया आइए, मैं आपको एक दूसरी जगह ले चलूँ। शायद परमेश्वर की दृष्टि में यह ठीक[a] हो, और आप वहाँ से मेरे लिए उसे शाप दें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर को यह अच्छा लगे।” इब्रानी मुहावरे का अर्थ किसी की दृष्टि में “ठीक होना” या “अच्छा लगना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְכָה נָּא
  choice: कृपया आइए
  rationale: הלך का यह आज्ञार्थक रूप यहाँ निमंत्रण या आग्रह के रूप में प्रयुक्त है, और נָּא आग्रह को विनम्र बनाता है।
- source_word: אֶקָּחֲךָ
  choice: मैं आपको ... ले चलूँ
  rationale: रूप की दृष्टि से यह प्रथम पुरुष अपूर्ण क्रिया है, पर निमंत्रण के बाद प्रसंग में इच्छासूचक अर्थ देता है; यह हिंदी में स्वाभाविक रूप से ‘ले चलूँ’ है।
- source_word: מָקוֹם אַחֵר
  choice: एक दूसरी जगह
  rationale: स्थान बदलने के ठोस अर्थ को सरल और स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: אוּלַי
  choice: शायद
  rationale: बालाक की आशा और अनिश्चितता दोनों को बिना अधिक निश्चित बनाए व्यक्त करता है।
- source_word: יִישַׁר בְּעֵינֵי הָאֱלֹהִים
  choice: परमेश्वर की दृष्टि में यह ठीक हो
  rationale: इब्रानी मुहावरे ‘किसी की आँखों में ठीक/भला होना’ को पठनीय हिंदी में रखते हुए मूल बिंब को सुरक्षित करता है। क्रिया का स्पष्ट कर्ता नहीं है, इसलिए प्रस्तावित कार्य के लिए ‘यह’ जोड़ा गया है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: कथा-संदर्भ में संकेत उसी परमेश्वर की ओर है जिससे बिलाम निर्देश पाता है; हिंदी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक है।
- source_word: וְקַבֹּתוֹ לִי
  choice: और आप ... मेरे लिए उसे शाप दें
  rationale: קבב का अर्थ ‘शाप देना’ है। संबद्ध क्रियारूप बालाक के आग्रह को आगे बढ़ाता है। एकवचन कर्म-प्रत्यय इस्राएल को एक सामूहिक इकाई के रूप में सूचित करता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: नई जगह से शाप देने के स्थानिक अर्थ को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: बालाक के कथन में הָאֱלֹהִים का संदर्भ
  choice: परमेश्वर
  alternative: देवता / वह देवता
  rationale: निकटवर्ती कथा में बिलाम इस्राएल के परमेश्वर के अधीन है और बालाक आशा करता है कि जगह बदलने से परमेश्वर की अनुमति बदल सकती है। ‘परमेश्वर’ कथात्मक संदर्भ को व्यक्त करता है, बिना अनावश्यक बहुदेववादी अस्पष्टता जोड़े।
- issue: וְקַבֹּתוֹ में एकवचन कर्म का संदर्भ
  choice: उसे
  alternative: उन्हें / इस्राएल को
  rationale: मूल पाठ इस्राएल नामक जनसमूह को व्याकरणिक एकवचन के रूप में देखता है। ‘उसे’ इस विशेषता को सुरक्षित रखता है और संदर्भ इसे समझने योग्य बनाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, विनम्र संवाद और गरिमापूर्ण बाइबलीय शैली में है। बालाक और बिलाम के बीच संबोधन के लिए ‘आप’ चुना गया है। ‘दृष्टि में’ मूल इब्रानी मुहावरे को स्वाभाविक हिंदी में बनाए रखता है।
