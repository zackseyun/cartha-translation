  text: וַ/יֹּ֤אמֶר בָּלָק֙ אֶל בִּלְעָ֔ם מֶ֥ה עָשִׂ֖יתָ לִ֑/י לָ/קֹ֤ב אֹיְבַ/י֙ לְקַחְתִּ֔י/ךָ וְ/הִנֵּ֖ה בֵּרַ֥כְתָּ בָרֵֽךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/011.yaml
  text: Then Balak said to Balaam[a], “What have you done to me? I took you to curse my enemies, but look, you have done nothing but bless them!”
translation:
  language: hi
  text: तब बालाक ने बिलाम से कहा, “तुमने मेरे साथ यह क्या किया? मैं तुम्हें अपने शत्रुओं को शाप देने के लिए ले आया था, पर देखो, तुमने तो उन्हें आशीष ही दी है![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में समापिका क्रिया के साथ infinitive absolute का प्रयोग जोर देने के लिए हुआ है; इसका अनुवाद ‘तुमने सचमुच उन्हें आशीष दी है’ भी हो सकता है।
    reason: इब्रानी क्रिया-रचना से आने वाले बल और उसके वैकल्पिक अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֶה עָשִׂיתָ לִי
  choice: तुमने मेरे साथ यह क्या किया?
  rationale: यह प्रश्न बालाक की शिकायत और उसके विरुद्ध हुए कार्य का भाव व्यक्त करता है; ‘मेरे साथ’ हिन्दी में स्वाभाविक है।
- source_word: לָקֹב
  choice: शाप देने के लिए
  rationale: यहाँ קבב का अर्थ किसी पर शाप उच्चारित करना है; ‘शाप देना’ स्पष्ट और प्रचलित हिन्दी समतुल्य है।
- source_word: אֹיְבַי
  choice: अपने शत्रुओं
  rationale: प्रथम पुरुष स्वामित्व वाले बहुवचन का सीधा और स्वाभाविक अनुवाद; वाक्य में वक्ता बालाक होने के कारण ‘अपने’ उपयुक्त है।
- source_word: לְקַחְתִּיךָ
  choice: मैं तुम्हें ... ले आया था
  rationale: לקח का मूल अर्थ ‘लेना’ है; प्रसंग में बालाक बिलाम को उस स्थान पर लाया था, इसलिए ‘ले आया था’ अर्थ को बिना ‘भाड़े पर रखने’ का अतिरिक्त भाव जोड़े स्पष्ट करता है।
- source_word: וְהִנֵּה
  choice: पर देखो
  rationale: यह पद आश्चर्य और विरोधाभास पर ध्यान खींचता है; ‘पर देखो’ आधुनिक हिन्दी में दोनों भावों को बनाए रखता है।
- source_word: בֵּרַכְתָּ בָרֵךְ
  choice: तुमने तो उन्हें आशीष ही आशीष दी है
  rationale: समापिका क्रिया के साथ infinitive absolute क्रिया पर जोर देता है। ‘आशीष ही आशीष दी है’ उस प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है; ‘उन्हें’ प्रसंग से स्पष्ट निहित कर्म है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पर देखो’ आश्चर्यपूर्ण विरोध को स्वाभाविक रूप से व्यक्त करता है, जबकि ‘आशीष ही आशीष’ मूल इब्रानी के जोर को हिन्दी में बनाए रखता है।
