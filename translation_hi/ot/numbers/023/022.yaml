  text: אֵ֖ל מוֹצִיאָ֣/ם מִ/מִּצְרָ֑יִם כְּ/תוֹעֲפֹ֥ת רְאֵ֖ם לֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/022.yaml
  text: God brings them out of Egypt[b][a]; he has for him the horns of a wild ox.
translation:
  language: hi
  text: परमेश्वर उन्हें मिस्र से बाहर निकालता है; उसके पास जंगली बैल जैसे ऊँचे सींग हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पास जंगली बैल-सा सामर्थ्य है।” इब्रानी पद कठिन है; मुख्य पाठ अमूर्त ‘सामर्थ्य’ के बजाय जंगली बैल और उसके ऊँचे सींगों का बिम्ब बनाए रखता है। रְאֵם सम्भवतः जंगली बैल या ऑरॉक्स था, न कि परम्परागत ‘एकसिंगा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל वाक्य का कर्ता है। आधुनिक, गरिमापूर्ण हिन्दी में ‘परमेश्वर’ स्पष्ट है और ‘सामर्थी परमेश्वर’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: מוֹצִיאָם
  choice: उन्हें ... बाहर निकाल रहा है
  rationale: हिफ़ील कृदन्त और 3 पुं. बहु. प्रत्यय को वर्तमान-दृश्यात्मक रूप में रखा गया है। यह निर्गमन की घटना को सजीव करता है, बिना उसे केवल सामान्य वर्तमान या पूर्ण भूत में सीमित किए।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से बाहर
  rationale: गति-सूचक क्रिया के साथ यह स्वाभाविक हिन्दी है और मिस्र से निर्गमन को स्पष्ट रखती है।
- source_word: כְּתוֹעֲפֹת
  choice: के-से ऊँचे सींग
  rationale: यह कठिन बहुवचन संज्ञा सींगों, ऊँचाई या प्रबल उभार का बोध करा सकती है। ‘ऊँचे सींग’ पशु-बिम्ब को बनाए रखता है; केवल ‘सामर्थ्य’ कहना बिम्ब को अमूर्त कर देता।
- source_word: רְאֵם
  choice: जंगली बैल
  rationale: यह एक शक्तिशाली जंगली गोवंशी, सम्भवतः विलुप्त ऑरॉक्स, को सूचित करता है; पौराणिक ‘एकसिंगा’ को नहीं। ‘जंगली बैल’ सामान्य पाठक के लिए सुबोध है।
- source_word: לוֹ
  choice: उसके लिए
  rationale: मसोरा-पाठ के 3 पुं. एकवचन को सुरक्षित रखा गया है। पहले आए बहुवचन ‘उन्हें’ के बाद यह एकवचन सम्भवतः इस्राएल को सामूहिक इकाई मानता है; अनुवाद इस तनाव को ‘उनके’ बनाकर मिटाता नहीं।
theological_decisions:
- issue: רְאֵם का पशु-बिम्ब
  choice: जंगली बैल
  alternative: ऑरॉक्स; परम्परागत ‘एकसिंगा’
  rationale: आधुनिक शब्द-अध्ययन इसे शक्तिशाली जंगली गोवंशी मानता है। ‘जंगली बैल’ मूल पशु-बिम्ब और सामर्थ्य की धारणा दोनों रखता है, जबकि ‘एकसिंगा’ सम्भावित इब्रानी अर्थ को ठीक से व्यक्त नहीं करता।
- issue: बहुवचन מוֹצִיאָם और एकवचन לוֹ के बीच व्याकरणिक तनाव
  choice: ‘उन्हें’ और ‘उसके लिए’ दोनों रूप सुरक्षित
  alternative: एकरूपता के लिए ‘उनके’ कहना
  rationale: इब्रानी पाठ पहले बहुवचन और फिर एकवचन प्रयोग करता है। एकवचन इस्राएल के सामूहिक व्यक्तित्व को सूचित कर सकता है; इसे चुपचाप बहुवचन बनाना वास्तविक अस्पष्टता मिटा देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण काव्यात्मक लहजा। कठिन इब्रानी बिम्ब को सहज बनाने के लिए ‘ऊँचे सींग’ कहा गया है, पर एकवचन-बहुवचन का मूल तनाव सुरक्षित रखा गया है।
