  yaml_path: translation/ot/numbers/023/014.yaml
  text: So he took him to the Field of Zophim[a], to the top of Pisgah, and built seven altars and offered a bull and a ram on each altar.
translation:
  language: hi
  text: तब वह उसे सोपीम के मैदान[a] में, जो पिसगा की चोटी पर था, ले गया। उसने सात वेदियाँ बनाईं और हर वेदी पर एक बैल और एक मेढ़ा चढ़ाया।
  philosophy: optimal-equivalence
  footnotes:
