id: NUM.23.19
reference: Numbers 23:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹ֣א אִ֥ישׁ אֵל֙ וִֽ/יכַזֵּ֔ב וּ/בֶן אָדָ֖ם וְ/יִתְנֶחָ֑ם הַ/ה֤וּא אָמַר֙ וְ/לֹ֣א יַעֲשֶׂ֔ה וְ/דִבֶּ֖ר וְ/לֹ֥א יְקִימֶֽ/נָּה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/019.yaml
  text: God is not a man[a], that he should lie, or a son of man, that he should change his mind. Has he said, and will he not do it? Or has he spoken[c][b], and will he not establish it?
translation:
  language: hi
  text: परमेश्वर मनुष्य नहीं कि झूठ बोले, न वह मनुष्य का पुत्र[a] है कि अपना मन बदल ले[b]। क्या वह कहे और न करे? क्या वह बोले और उसे पूरा न करे[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘मनुष्य का पुत्र’ इब्रानी में एक मानव के लिए काव्यात्मक अभिव्यक्ति है; यहाँ यह कोई मसीही उपाधि नहीं है।
    reason: cultural_note
  - marker: b
    text: या ‘अपने निर्णय से हट जाए’; परंपरागत रूप से ‘पछताए।’ इब्रानी क्रिया मन बदलने या पीछे हटने का भाव दे सकती है; यहाँ बात परमेश्वर की विश्वसनीयता की है, नैतिक पश्चाताप की नहीं।
    reason: lexical_alternative
  - marker: c
    text: या ‘उसे स्थिर न करे।’ इब्रानी का शाब्दिक भाव है, ‘उसे खड़ा न करे।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ स्वाभाविक और संदर्भानुकूल है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यह शब्द परमेश्वर और नश्वर मानव के बीच विरोध दिखाता है; आधुनिक हिन्दी में ‘मनुष्य’ स्पष्ट और गरिमापूर्ण है।
- source_word: וִיכַזֵּב
  choice: कि झूठ बोले
  rationale: כזב का सामान्य अर्थ झूठ बोलना या मिथ्या सिद्ध होना है; यहाँ परमेश्वर की विश्वसनीयता पर बल है।
- source_word: בֶן אָדָם
  choice: मनुष्य का पुत्र
  rationale: यह अनुवाद इब्रानी काव्यात्मक समानांतरता और मूल अभिव्यक्ति बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि यहाँ इसका अर्थ साधारण मानव है।
- source_word: וְיִתְנֶחָם
  choice: कि अपना मन बदल ले
  rationale: נחם का हित्पएल रूप यहाँ इरादा बदलने या पीछे हटने का भाव दे सकता है; यह चयन नैतिक पश्चाताप का भ्रामक संकेत दिए बिना संदर्भ व्यक्त करता है।
- source_word: הַהוּא אָמַר
  choice: क्या वह कहे
  rationale: रूप कथन जैसा है, पर अगली नकारात्मक पंक्ति के साथ मिलकर अलंकारिक प्रश्न बनाता है; हिन्दी में यह संरचना उस बल को स्वाभाविक रूप से व्यक्त करती है।
- source_word: יַעֲשֶׂה
  choice: न करे
  rationale: עשה व्यापक क्रिया है; यहाँ कही हुई बात को कार्य में परिणत करने का निहित अर्थ है।
- source_word: וְדִבֶּר
  choice: क्या वह बोले
  rationale: यह पहले ‘कहे’ के समानांतर वचन देने या घोषित करने को दर्शाता है।
- source_word: יְקִימֶנָּה
  choice: उसे पूरा न करे
  rationale: קום के हिफ़ील का शाब्दिक भाव ‘खड़ा करना/स्थिर करना’ है, और इस संदर्भ में अपने वचन को पूरा करना स्वाभाविक हिन्दी है।
theological_decisions:
- issue: וְיִתְנֶחָם में परमेश्वर के मन बदलने की भाषा
  choice: अपना मन बदल ले
  alternative: पछताए; अपने निर्णय से हट जाए
  rationale: पद का केंद्र परमेश्वर की विश्वसनीयता और चंचल मानव से उसकी भिन्नता है। यह रूप मूल तनाव बनाए रखता है और परमेश्वर में नैतिक पश्चाताप की धारणा आरोपित नहीं करता।
- issue: בֶן אָדָם को मसीही उपाधि मानना या सामान्य मानव-सूचक मुहावरा
  choice: मूल रूप ‘मनुष्य का पुत्र’ रखते हुए पादटिप्पणी में सामान्य मानव का अर्थ स्पष्ट करना
  alternative: मनुष्य
  rationale: गिनती 23:19 में यह मानव के लिए इब्रानी काव्यात्मक अभिव्यक्ति है, मसीही उपाधि नहीं; मूल समानांतरता बनाए रखना और टिप्पणी द्वारा अर्थ स्पष्ट करना दोनों उचित हैं।
- issue: יְקִימֶנָּה में वचन की स्थापना या पूर्ति
  choice: उसे पूरा न करे
  alternative: उसे स्थिर न करे
  rationale: ‘पूरा करना’ आधुनिक हिन्दी में प्रतिज्ञा या कही हुई बात को कार्यान्वित करने का आशय साफ करता है, जबकि पादटिप्पणी मूल ‘खड़ा/स्थिर करना’ की छवि सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। काव्यात्मक समानांतरता को ‘मनुष्य/मनुष्य का पुत्र’ और ‘कहे/बोले’ द्वारा बनाए रखा गया है। अलंकारिक प्रश्नों को स्वाभाविक हिन्दी में रखा गया है।
