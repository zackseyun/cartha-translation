  yaml_path: translation/ot/numbers/023/006.yaml
  text: Then he returned to him, and behold, he was standing beside his burnt offering—he and all the princes of Moab.
translation:
  language: hi
  text: तब वह उसके पास लौट आया, और देखो, वह अपनी होमबलि के पास खड़ा था, और मोआब के सभी प्रधान उसके साथ खड़े थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּשָׁב אֵלָיו
  choice: तब वह उसके पास लौट आया
  rationale: इब्रानी क्रिया और दिशासूचक संबंध को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में ‘वह’ बिलाम और ‘उसके’ बालाक को सूचित करता है, पर मूल की सर्वनामात्मक शैली बनाए रखी गई है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: दृश्य की ओर आकस्मिक ध्यान खींचने वाले इब्रानी संकेतक का सीधा और प्रतिष्ठित रूप।
- source_word: נִצָּב עַל־עֹלָתוֹ
  choice: अपने होमबलि के पास ... खड़ा था
  rationale: נִצָּב की स्थिर खड़े होने की अवस्था तथा עַל की यहाँ स्थान-समीपता को व्यक्त करता है; ‘होमबलि’ עֹלָה का प्रचलित बाइबलीय हिन्दी रूप है।
- source_word: כָל־שָׂרֵי מוֹאָב
  choice: मोआब के सभी प्रधानों
  rationale: שָׂרִים उच्च पदस्थ अगुओं या अधिकारियों को दर्शाता है; ‘प्रधानों’ राजकीय संदर्भ में स्वाभाविक है और अनावश्यक रूप से उन्हें ‘राजकुमार’ नहीं ठहराता।
