source:
  edition: WLC
  text: וַ/יָּ֧שֶׂם יְהוָ֛ה דָּבָ֖ר בְּ/פִ֣י בִלְעָ֑ם וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/005.yaml
  text: Then Yahweh put a word in Balaam’s mouth and said[a], “Return to Balak, and thus you shall speak.”
translation:
  language: hi
  text: तब याहवे ने बिलाम के मुँह में एक वचन रखा और कहा, “बालाक के पास लौट जा और इस प्रकार बोलना[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और ऐसा कहना।”
    reason: כֹה (‘इस प्रकार/ऐसा’) और תְדַבֵּר (‘बोलना/कहना’) के लिए स्वाभाविक वैकल्पिक हिन्दी अभिव्यक्ति।
lexical_decisions:
- source_word: וַיָּשֶׂם
  choice: रखा
  rationale: שׂוּם का मूल अर्थ ‘रखना/स्थापित करना’ है। ‘मुँह में वचन रखना’ मूल इब्रानी बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: דָּבָר
  choice: एक वचन
  rationale: एकवचन דָּבָר यहाँ ईश्वर द्वारा दिए गए कथन या संदेश को सूचित करता है। ‘वचन’ संख्या और वाणी के बिंब को सुरक्षित रखता है, जबकि ‘संदेश’ अधिक व्याख्यात्मक होता।
- source_word: בְּפִי בִלְעָם
  choice: बिलाम के मुँह में
  rationale: यह मूल पाठ के ठोस मुहावरे को सीधे और समझने योग्य हिन्दी में सुरक्षित रखता है।
- source_word: שׁוּב אֶל בָּלָק
  choice: बालाक के पास लौट जा
  rationale: שׁוּב का आदेशात्मक अर्थ ‘लौटना’ है और אֶל व्यक्ति की ओर गमन बताता है; हिन्दी में ‘के पास लौट जा’ स्वाभाविक है।
- source_word: וְכֹה תְדַבֵּר
  choice: और तू इसी प्रकार बोलना
  rationale: כֹה का अर्थ ‘इस प्रकार/ऐसे’ और דּבר का अर्थ ‘बोलना’ है। हिन्दी का अनन्तरूप आदेश ‘बोलना’ निर्देश की दृढ़ता को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘याहवे’ उस नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: बिलाम को दिए गए वचन की प्रकृति
  choice: मुँह में एक वचन रखा
  alternative: एक संदेश दिया
  rationale: ठोस इब्रानी मुहावरे को बनाए रखने से परमेश्वर द्वारा बिलाम की वाणी प्रदान किए जाने का कथन सुरक्षित रहता है, बिना प्रेरणा की प्रक्रिया को अतिरिक्त रूप से परिभाषित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘वचन’ बाइबलीय प्रसंग में परिचित है, जबकि वाक्य-विन्यास आधुनिक हिन्दी का है।
