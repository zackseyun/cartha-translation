  text: וַ/יִּקַּ֥ח בָּלָ֖ק אֶת בִּלְעָ֑ם רֹ֣אשׁ הַ/פְּע֔וֹר הַ/נִּשְׁקָ֖ף עַל פְּנֵ֥י הַ/יְשִׁימֹֽן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/028.yaml
  text: Then Balak took Balaam to the top of Peor[a], which overlooks the face of the wasteland.
translation:
  language: hi
  text: तब बालाक बिलाम को पोर की चोटी पर ले गया, जहाँ से यशीमोन[a] दिखाई देता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उजाड़ प्रदेश” अथवा “रेगिस्तान।” इब्रानी शब्द “यशीमोन” को किसी स्थान का नाम या उजाड़ क्षेत्र का वर्णन—दोनों रूपों में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब ... ले गया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। स्थल की ओर किसी व्यक्ति को ले जाने के संदर्भ में हिन्दी में ‘तब ... ले गया’ स्वाभाविक है और לקח का आशय स्पष्ट करता है।
- source_word: בָּלָק
  choice: बालाक
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶת בִּלְעָם
  choice: बिलाम को
  rationale: אֶת कर्म-चिह्न है; हिन्दी में सजीव निश्चित कर्म के साथ ‘को’ लगाया गया है। नाम का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: רֹאשׁ הַפְּעוֹר
  choice: पोर की चोटी पर
  rationale: भौगोलिक संदर्भ में רֹאשׁ ऊँचे स्थान की चोटी को सूचित करता है। הַפְּעוֹר को स्थाननाम मानकर स्वाभाविक हिन्दी संबंध-रचना में रखा गया है।
- source_word: הַנִּשְׁקָף
  choice: जहाँ से ... दिखाई देता है
  rationale: שׁקף का निफ़अल कृदंत किसी ऊँचे स्थान से नीचे या दूर के क्षेत्र के दिखने/उस पर दृष्टि पड़ने का भाव देता है। यह रूप हिन्दी में स्थलाकृतिक संबंध को सहजता से व्यक्त करता है।
- source_word: עַל־פְּנֵי
  choice: जहाँ से ... दिखाई देता है
  rationale: शाब्दिक ‘के मुख पर’ आधुनिक हिन्दी में इस स्थल-वर्णन में अस्वाभाविक होगा। क्रिया के साथ मिलाकर उस क्षेत्र पर खुलने वाले दृश्य का अर्थ व्यक्त किया गया है।
- source_word: הַיְשִׁימֹן
  choice: यशीमोन
  rationale: निर्धारक लेख सहित यह रूप किसी विशिष्ट उजाड़ क्षेत्र के नाम के रूप में समझा जा सकता है। मूल की वास्तविक संदिग्धता बनाए रखने के लिए मुख्य पाठ में लिप्यंतरण और पादटिप्पणी में वर्णनात्मक अर्थ दिया गया है।
