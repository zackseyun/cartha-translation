    issue: ‘सीधे लोगों’ for יְשָׁרִים
    rationale: In modern standard Hindi, ‘सीधे लोग’ commonly means simple, guileless, or literally straight people, rather than reliably conveying the Hebrew moral-religious sense ‘upright.’ ‘सज्जन’ naturally conveys honorable/upright persons without imposing a technical doctrinal category.
