id: NUM.23.10
reference: Numbers 23:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י מָנָה֙ עֲפַ֣ר יַעֲקֹ֔ב וּ/מִסְפָּ֖ר אֶת רֹ֣בַע יִשְׂרָאֵ֑ל תָּמֹ֤ת נַפְשִׁ/י֙ מ֣וֹת יְשָׁרִ֔ים וּ/תְהִ֥י אַחֲרִיתִ֖/י כָּמֹֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/010.yaml
  text: Who can count the dust of Jacob[a], or number the fourth part of Israel? Let my soul die the death of the upright[c][b], and let my end be like his.
translation:
  language: hi
  text: 'याकूब की धूल को कौन गिन सकता है[a],

    या इस्राएल के चौथे भाग की भी गिनती कौन कर सकता है?

    मेरा प्राण सज्जनों की मृत्यु मरे[b],

    और मेरा अंत उसके समान हो[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल के भागों को कौन गिन सकता है?” अथवा अर्थ खोलकर, “इस्राएल के एक चौथाई को भी कौन गिन सकता है?”
    reason: lexical_alternative
  - marker: b
    text: या, “धर्मी लोगों की मृत्यु।”
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी में “उसके समान” एकवचन है; यह किसी प्रतिनिधि सज्जन की ओर संकेत कर सकता है, यद्यपि “सज्जन” यहाँ सामूहिक बहुवचन है।
    reason: grammatical_ambiguity
lexical_decisions:
- source_word: מִי מָנָה
  choice: कौन गिन सकता है
  rationale: प्रश्नवाचक מִי और गणना-सूचक מָנָה मिलकर असंभवता का भाव लिए आलंकारिक प्रश्न बनाते हैं; हिंदी में ‘सकता है’ इस निहित भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲפַר יַעֲקֹב
  choice: याकूब की धूल
  rationale: ‘धूल’ के मूल रूपक को सुरक्षित रखता है, जो धूल के समान असंख्य वंशजों की प्रतिज्ञा की ओर संकेत करता है; काव्यात्मक समानांतरता में ‘याकूब’ नाम भी बनाए रखा गया है।
- source_word: וּמִסְפָּר אֶת רֹבַע יִשְׂרָאֵל
  choice: या इस्राएल के चौथे भाग की भी गिनती
  rationale: מִסְפָּר को हिंदी में गणना-संबंधी वाक्यांश बनाया गया है। רֹבַע का प्राथमिक अर्थ ‘चौथा भाग’ सुरक्षित रखा गया है; ‘भी’ इस निहित अतिशयोक्ति को सहज करता है कि उसका एक चौथाई तक अगणनीय है, पर अर्थ को निर्णायक रूप से नहीं खोलता।
- source_word: תָּמֹת נַפְשִׁי
  choice: मेरा प्राण ... मरे
  rationale: नַפְשִׁי को लुप्त करके केवल ‘मैं मरूँ’ कहने के बजाय मूल की काव्यात्मक संरचना रखी गई है। ‘प्राण’ आधुनिक गरिमामय हिंदी में यहाँ ‘जीव/स्वयं’ का स्वाभाविक प्रतिनिधित्व करता है।
- source_word: מוֹת יְשָׁרִים
  choice: सीधे लोगों की मृत्यु
  rationale: יְשָׁרִים का मूल भाव नैतिक रूप से ‘सीधा’ होना है। यह ‘धर्मी’ की संभावित अधिक तकनीकी या न्यायिक धार्मिक ध्वनि को आरोपित किए बिना नैतिक-धार्मिक अर्थ बनाए रखता है।
- source_word: וּתְהִי אַחֲרִיתִי
  choice: और मेरा अंत ... हो
  rationale: אַחֲרִית यहाँ मृत्यु के समानांतर व्यक्ति के अंतिम परिणाम या अंत को सूचित करता है; ‘अंत’ संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: כָּמֹהוּ
  choice: उसके समान
  rationale: इब्रानी प्रत्यय पुल्लिंग एकवचन है। हिंदी में ‘उसके’ उस एकवचन को सुरक्षित रखता है, यद्यपि पहले आया יְשָׁרִים बहुवचन/सामूहिक है; इस तनाव को मुख्य पाठ में मिटाया नहीं गया।
theological_decisions:
- issue: יְשָׁרִים का अनुवाद
  choice: सीधे लोग
  alternative: धर्मी लोग
  rationale: ‘सीधे’ शब्द ישר के सीधेपन/खरेपन के मूल अर्थ को अधिक निकटता से रखता है और किसी व्यवस्थित धार्मिक-न्यायिक श्रेणी को अनावश्यक रूप से आरोपित नहीं करता। ‘धर्मी’ एक वैध विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
- issue: רֹבַע יִשְׂרָאֵל की व्याख्या
  choice: इस्राएल का चौथा भाग
  alternative: इस्राएल की विशाल भीड़ / इस्राएल के दल
  rationale: मुख्य पाठ शाब्दिक ‘चौथे भाग’ को बनाए रखता है और यह निर्णय नहीं करता कि आशय एक चौथाई जनसमूह, चार छावनी-दलों में से एक, या प्रसंगानुसार विशाल भीड़ है।
- issue: כָּמֹהוּ में एकवचन संकेत
  choice: उसके समान
  alternative: उनके समान
  rationale: मूल में प्रत्यय एकवचन है, जबकि ‘सीधे लोग’ बहुवचन सामूहिक है। व्याकरणिक तनाव को सहज बहुवचन बनाकर मिटाने के बजाय मूल का एकवचन रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमामय काव्यात्मक रजिस्टर अपनाया गया है। पंक्ति-विन्यास इब्रानी समानांतरता को स्पष्ट करता है। ‘धूल’, ‘प्राण’, ‘मृत्यु’ और ‘अंत’ जैसे मूल बिंब सुरक्षित हैं; जहाँ अर्थ संदिग्ध है वहाँ मुख्य पाठ ने अपेक्षाकृत औपचारिक रूप रखा और विकल्प पादटिप्पणियों में दिए हैं।
