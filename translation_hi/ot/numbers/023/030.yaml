  yaml_path: translation/ot/numbers/023/030.yaml
  text: So Balak did as Balaam had said, and he offered up a bull and a ram on the altar.
translation:
  language: hi
  text: तब बालाक ने वैसा ही किया जैसा बिलाम ने कहा था। उसने वेदी पर एक बैल और एक मेढ़ा चढ़ाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने...किया
  rationale: עשה यहाँ כַּאֲשֶׁר אָמַר के साथ मुहावरेदार ढंग से प्रयुक्त है और किसी के कहे के अनुसार करने को व्यक्त करता है।
- source_word: כַּאֲשֶׁר
  choice: वैसा ही...जैसा
  rationale: यह बालाक के कार्य को बिलाम के निर्देश के अनुरूप बताता है; यह हिंदी में स्वाभाविक तुलना-संरचना है।
- source_word: אָמַר
  choice: ने कहा था
  rationale: हिंदी का पूर्वकाल यह स्पष्ट करता है कि बिलाम का कहना बालाक के कार्य से पहले हुआ था।
- source_word: וַיַּעַל
  choice: चढ़ाया
  rationale: עלה का यह हिफ़ील रूप बलिदान-संदर्भ में वेदी पर अर्पित करने का अर्थ देता है; ‘चढ़ाया’ हिंदी में इस धार्मिक क्रिया का सहज और सटीक शब्द है।
- source_word: פָּר
  choice: एक बैल
  rationale: यह बलिदान के नर गोवंश के लिए स्पष्ट, आधुनिक और प्रचलित हिंदी शब्द है।
- source_word: אַיִל
  choice: एक मेढ़ा
  rationale: אַיִל के लिए ‘मेढ़ा’ सटीक और प्रचलित हिंदी पर्याय है।
- source_word: בַּמִּזְבֵּחַ
  choice: वेदी पर
  rationale: बलिदान-संदर्भ में בְּ उपसर्ग स्थान को दर्शाता है; आधुनिक हिंदी में ‘वेदी पर’ स्वाभाविक है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव कथा को पिछले निर्देश के परिणामस्वरूप आगे बढ़ाता है; ‘तब’ हिंदी में उस क्रम को सहज रूप से व्यक्त करता है।
