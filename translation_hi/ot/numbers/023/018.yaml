  register: भाषा आधुनिक मानक हिन्दी की है, पर पद्यात्मक संबोधन और दोहराव को बनाए रखने के लिए गरिमापूर्ण काव्यात्मक लय रखी गई है। ‘सुन’ और ‘ध्यान से सुन’ इब्रानी के समानांतर क्रियापदों के बीच बढ़ती हुई तीव्रता को व्यक्त करते हैं।
