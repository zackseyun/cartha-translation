base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/018.yaml
  text: 'Then he took up his discourse and said: “Rise[a], Balak, and hear; listen to me, son of Zippor.”'
translation:
  language: hi
  text: 'तब उसने अपना काव्य-वचन[a] कहा:


    “उठ, बालाक, और सुन;

    हे सिप्पोर के पुत्र, मेरी बात ध्यान से सुन।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपना नीतिवचन” अथवा “अपनी गंभीर उद्घोषणा।” इब्रानी מָשָׁל नीतिवचन-जैसे कथन या औपचारिक काव्यात्मक वचन को सूचित कर सकता है; यहाँ यह बिलाम की ऊँचे काव्यात्मक ढंग की घोषणा का परिचय देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: उसने अपना काव्य-वचन आरम्भ किया
  rationale: נשׂא के साथ מָשָׁל यहाँ किसी औपचारिक, ऊँचे काव्यात्मक कथन को बोलना आरम्भ करने का मुहावरा है। यह अनुवाद हिन्दी में स्वाभाविक रहते हुए उस गंभीर काव्यात्मक स्वर को बनाए रखता है।
- source_word: מְשָׁלוֹ
  choice: अपना काव्य-वचन
  rationale: מָשָׁל का अर्थ नीतिवचन, दृष्टांत-सदृश कथन या औपचारिक काव्यात्मक उद्घोषणा हो सकता है। बिलाम के भाषण के संदर्भ में ‘काव्य-वचन’ उसके रूप और गंभीरता को व्यक्त करता है, पर उसे अनिवार्य रूप से ‘भविष्यवाणी’ घोषित नहीं करता।
- source_word: קוּם
  choice: उठ
  rationale: बालाक को संबोधित एकवचन आज्ञार्थक रूप है। ‘उठ’ संक्षिप्त, स्वाभाविक और गंभीर स्वर के अनुकूल है।
- source_word: וּשֲׁמָע
  choice: और सुन
  rationale: שׁמע का सीधा अर्थ ‘सुनना’ है। अगले क्रियापद के साथ इसकी काव्यात्मक समानांतरता बनाए रखने के लिए इसे सरल रूप में रखा गया है।
- source_word: הַאֲזִינָה עָדַי
  choice: मेरी बात ध्यान से सुन
  rationale: האזין ध्यान लगाकर सुनने का भाव देता है, और עָדַי वक्ता की ओर ध्यान करने को दर्शाता है। यह हिन्दी प्रयोग उस तीव्रता को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּנוֹ צִפֹּר
  choice: हे सिप्पोर के पुत्र
  rationale: यह बालाक का पितृनाम के द्वारा सीधा संबोधन है। ‘हे’ संबोधन के काव्यात्मक और गंभीर स्वर को स्पष्ट करता है।
