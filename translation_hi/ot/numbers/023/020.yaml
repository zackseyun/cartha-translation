  text: הִנֵּ֥ה בָרֵ֖ךְ לָקָ֑חְתִּי וּ/בֵרֵ֖ךְ וְ/לֹ֥א אֲשִׁיבֶֽ/נָּה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/020.yaml
  text: Look[a], I have received to bless; he has blessed[c][b], and I cannot reverse it.
translation:
  language: hi
  text: देखो, मुझे आशीष देने के लिए कहा गया है[a]; उसने आशीष दी है[b], और मैं उसे वापस नहीं ले सकता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अधिक शाब्दिक अर्थ है, “मैंने आशीष देने के लिए प्राप्त किया है”; ‘प्राप्त किया’ का कर्म स्पष्ट नहीं किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘उसने’ का कर्ता अलग से व्यक्त नहीं है; प्रसंग परमेश्वर की ओर संकेत करता है।
    reason: alternative_reading
  - marker: c
    text: या, “मैं उसे निरस्त नहीं कर सकता” अथवा “मैं उसे वापस नहीं मोड़ सकता।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यह शब्द श्रोता का ध्यान आगे कही जाने वाली बात की ओर खींचता है। ‘देख’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका संकेतात्मक बल बनाए रखता है।
- source_word: בָרֵךְ לָקָחְתִּי
  choice: मुझे आशीष देने की आज्ञा मिली है
  rationale: शाब्दिक रचना में ‘मैंने आशीष देने को पाया है’ आता है, पर לָקַחְתִּי का कर्म निहित है। प्रसंग में बिलाम को प्राप्त ईश्वरीय निर्देश को स्पष्ट करने के लिए ‘आज्ञा मिली है’ स्वाभाविक हिन्दी है; पादटिप्पणी मूल की अपूर्णता सुरक्षित रखती है।
- source_word: וּבֵרֵךְ
  choice: उसने आशीष दे दी है
  rationale: क्रिया तृतीय पुरुष एकवचन पुल्लिंग है और उसका कर्ता अलग से व्यक्त नहीं है। ‘दे दी है’ पूरी हो चुकी आशीष और उसके वर्तमान परिणाम को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשִׁיבֶנָּה
  choice: मैं उसे पलट नहीं सकता
  rationale: שׁוב का हिफ़ील रूप यहाँ दी हुई आशीष को लौटा देने, निरस्त करने या उलट देने के अर्थ में है। ‘पलट नहीं सकता’ मूल रूपक और बिलाम की असमर्थता दोनों को बनाए रखता है।
theological_decisions:
- issue: ‘उसने आशीष दे दी है’ का निहित कर्ता
  choice: मुख्य पाठ में केवल ‘उसने’ रखा गया है; पादटिप्पणी में बताया गया है कि प्रसंग परमेश्वर की ओर संकेत करता है।
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘परमेश्वर ने आशीष दे दी है’ कहना, अथवा इसे अनिश्चित कर्ता के रूप में समझना।
  rationale: इब्रानी क्रिया कर्ता का नाम नहीं देती, यद्यपि निकटवर्ती प्रसंग दृढ़ता से परमेश्वर की ओर संकेत करता है। सर्वनाम रखने से मूल की संक्षिप्तता और निहितता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देख’ ध्यान आकर्षित करता है; ‘आशीष’ धार्मिक प्रसंग में प्रचलित और बोधगम्य है। मुख्य पाठ स्वाभाविक हिन्दी देता है, जबकि पादटिप्पणियाँ इब्रानी की निहित वस्तु, निहित कर्ता और अंतिम क्रिया के अर्थ-विकल्पों को सुरक्षित रखती हैं।
