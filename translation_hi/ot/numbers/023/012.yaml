  text: וַ/יַּ֖עַן וַ/יֹּאמַ֑ר הֲ/לֹ֗א אֵת֩ אֲשֶׁ֨ר יָשִׂ֤ים יְהוָה֙ בְּ/פִ֔/י אֹת֥/וֹ אֶשְׁמֹ֖ר לְ/דַבֵּֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/012.yaml
  text: He answered and said[a], “Must I not speak what Yahweh puts in my mouth?”
translation:
  language: hi
  text: उसने उत्तर दिया, “क्या मुझे वही बोलने का ध्यान नहीं रखना चाहिए[a] जो याहवे मेरे मुँह में डालता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “क्या मुझे उस बात को बोलने का ध्यान नहीं रखना चाहिए जो याहवे मेरे मुँह में डालता है?” यहाँ की क्रिया का अर्थ सावधानी से ध्यान रखना या दिए गए वचन के अनुसार ठीक-ठीक बोलना भी हो सकता है।
    reason: אֶשְׁמֹר לְדַבֵּר में ‘ध्यान रखना/सावधानीपूर्वक पालन करना’ के अर्थ-परास को स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּעַן וַיֹּאמַר
  choice: उसने उत्तर में कहा
  rationale: इब्रानी की प्रचलित कथात्मक जोड़ी ‘उसने उत्तर दिया और कहा’ को स्वाभाविक आधुनिक हिन्दी में संक्षेपित किया गया है; उत्तर देने और बोलने, दोनों का भाव बना रहता है।
- source_word: הֲלֹא
  choice: क्या मुझे ... नहीं रखना चाहिए
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है और दायित्व का भाव व्यक्त करता है।
- source_word: אֵת אֲשֶׁר ... אֹתוֹ
  choice: वही ... जो
  rationale: आरम्भिक कर्म और बाद में उसे दोहराने वाले सर्वनाम को हिन्दी में स्वाभाविक सम्बन्धवाचक रचना से व्यक्त किया गया है; ‘वही’ बोलने की सीमाबद्धता पर बल देता है।
- source_word: יָשִׂים
  choice: डालता है
  rationale: ‘मुँह में डालना’ वचन देने का इब्रानी मुहावरा है और हिन्दी में भी स्पष्ट तथा प्रभावी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בְּפִי
  choice: मेरे मुँह में
  rationale: मूल मुहावरे को सीधे रखा गया है, क्योंकि इसका अर्थ हिन्दी पाठक को सहज समझ आता है।
- source_word: אֶשְׁמֹר לְדַבֵּר
  choice: कहने का ध्यान ... रखना चाहिए
  rationale: שׁמר और क्रियार्थक रूप की रचना केवल बोलने से अधिक, दिए गए वचन का सावधानी से पालन करते हुए बोलने का भाव रख सकती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका सीधा और प्रचलित विद्वत्तापूर्ण लिप्यंतरण है, जबकि ‘प्रभु’ नाम को उपाधि से बदल देता है।
- issue: बिलाम के दायित्व अथवा बाध्यता की तीव्रता
  choice: क्या मुझे ... ध्यान नहीं रखना चाहिए
  alternative: क्या मुझे ... नहीं कहना चाहिए
  rationale: הֲלֹא दायित्वसूचक आलंकारिक प्रश्न है और אֶשְׁמֹר सावधान अनुपालन का भाव दे सकता है। यह रूप उसकी सीमित जिम्मेदारी दिखाता है, पर उसे यांत्रिक रूप से विवश बताने से बचता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘उत्तर में कहा’ इब्रानी कथात्मक दोहरे पद का स्वाभाविक हिन्दी समतुल्य है; ‘मुँह में डालता है’ मूल रूपक को बनाए रखता है।
