source:
  edition: WLC
  text: כִּ֤י לֹא נַ֨חַשׁ֙ בְּ/יַעֲקֹ֔ב וְ/לֹא קֶ֖סֶם בְּ/יִשְׂרָאֵ֑ל כָּ/עֵ֗ת יֵאָמֵ֤ר לְ/יַעֲקֹב֙ וּ/לְ/יִשְׂרָאֵ֔ל מַה פָּ֖עַל אֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/023.yaml
  text: For there is no divination in Jacob[a], and no sorcery in Israel; at the proper time it will be said to Jacob and to Israel[b], ‘What God has done!’
translation:
  language: hi
  text: क्योंकि न तो याकूब के विरुद्ध कोई शकुन-विचार कारगर है, न इस्राएल के विरुद्ध कोई जादू-टोना। उचित समय पर याकूब और इस्राएल से यह कहा जाएगा, ‘परमेश्वर ने क्या किया है!’[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न तो याकूब में कोई शकुन-विचार है, न इस्राएल में कोई जादू-टोना।” इब्रानी पूर्वसर्ग का अर्थ ‘में’ भी हो सकता है, यद्यपि प्रसंग ‘के विरुद्ध’ के अर्थ का समर्थन करता है। ‘याकूब और इस्राएल से’ का अनुवाद “याकूब और इस्राएल के विषय में” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נַחַשׁ
  choice: शकुन-विचार
  rationale: यह संज्ञा शकुनों के आधार पर भविष्य या परिणाम जानने की गुप्त विद्या को दर्शाती है। ‘शकुन-विचार’ आधुनिक हिन्दी में इस अर्थ को अपेक्षाकृत स्पष्ट रखता है।
- source_word: קֶסֶם
  choice: जादुई भविष्य-कथन
  rationale: यह गुप्त अथवा जादुई साधनों से भविष्य जानने या बताने की क्रिया है। यह पद נַחַשׁ से कुछ भेद भी बनाए रखता है।
- source_word: בְּיַעֲקֹב / בְּיִשְׂרָאֵל
  choice: याकूब के विरुद्ध / इस्राएल के विरुद्ध
  rationale: बलाम के वचन के प्रसंग में בְּ का आशय याकूब/इस्राएल के विरुद्ध प्रयुक्त गुप्त विद्याओं की निष्प्रभाविता से समझना उचित है। ‘कारगर नहीं होता’ इस प्रसंगगत आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: כָּעֵת
  choice: उचित समय पर
  rationale: वाक्यांश वर्तमान समय या उपयुक्त नियत अवसर का बोध करा सकता है; यहाँ ‘उचित समय पर’ उस समय को दर्शाता है जब परमेश्वर का कार्य प्रकट होकर घोषित किया जाएगा।
- source_word: יֵאָמֵר
  choice: कहा जाएगा
  rationale: निफ़ाल अपूर्ण रूप को भविष्यकालीन कर्मवाच्य के रूप में रखा गया है।
- source_word: לְיַעֲקֹב וּלְיִשְׂרָאֵל
  choice: याकूब और इस्राएल से
  rationale: לְ का सामान्य सम्प्रदानवाचक अर्थ सुरक्षित रखा गया है, यद्यपि इसका अर्थ ‘याकूब और इस्राएल के विषय में’ भी हो सकता है।
- source_word: מַה פָּעַל אֵל
  choice: देखो, परमेश्वर ने क्या किया है!
  rationale: מַה को विस्मयात्मक उद्घोष के रूप में समझा गया है। हिन्दी में ‘देखो’ जोड़ने से इसे प्रश्न समझे जाने की संभावना घटती है और मूल का विस्मय स्वाभाविक रूप से प्रकट होता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל सामान्य ईश्वरीय उपाधि है; ‘परमेश्वर’ dignified और प्रचलित हिन्दी समतुल्य है।
theological_decisions:
- issue: क्या पद इस्राएल के भीतर गुप्त विद्याओं की अनुपस्थिति बताता है या इस्राएल के विरुद्ध उनकी निष्प्रभाविता?
  choice: इस्राएल के विरुद्ध शकुन-विचार और जादुई भविष्य-कथन कारगर नहीं होते।
  alternative: याकूब में कोई शकुन-विचार और इस्राएल में कोई जादुई भविष्य-कथन नहीं है।
  rationale: बलाम के आशीर्वाद-वचन का प्रसंग इस्राएल को शाप देने और गुप्त साधनों से प्रभावित करने की विफलता पर केंद्रित है। फिर भी בְּ की वास्तविक भाषिक अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: क्या מַה פָּעַל אֵל प्रश्न है या विस्मयात्मक उद्घोष?
  choice: 'विस्मयात्मक उद्घोष: ‘देखो, परमेश्वर ने क्या किया है!’'
  alternative: 'प्रश्न: ‘परमेश्वर ने क्या किया है?’'
  rationale: वचन का चरमबिंदु परमेश्वर के सामर्थी कार्य की सार्वजनिक घोषणा है; इसलिए विस्मयात्मक अर्थ प्रसंग में अधिक उपयुक्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘शकुन-विचार’ और ‘जादुई भविष्य-कथन’ निकटवर्ती दोनों इब्रानी शब्दों का भेद बनाए रखते हैं। मुख्य पाठ प्रसंगगत अर्थ देता है और वास्तविक पूर्वसर्गीय अस्पष्टता पादटिप्पणियों में सुरक्षित रखता है।
