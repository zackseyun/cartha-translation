source:
  edition: WLC
  text: וַ/יִּקָּ֤ר יְהוָה֙ אֶל בִּלְעָ֔ם וַ/יָּ֥שֶׂם דָּבָ֖ר בְּ/פִ֑י/ו וַ/יֹּ֛אמֶר שׁ֥וּב אֶל בָּלָ֖ק וְ/כֹ֥ה תְדַבֵּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/016.yaml
  text: And Yahweh met Balaam and put a word in his mouth[a], and said, “Return to Balak, and thus you shall speak.”
translation:
  language: hi
  text: तब याहवे बिलाम से मिले[a] और बिलाम के मुँह में एक बात रखी। उन्होंने कहा, “बालाक के पास लौट जा और इस प्रकार कहना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बिलाम के सामने आए” अथवा “बिलाम से मिले।”
    reason: इब्रानी क्रिया קָרָה भेंट होने, सामने आने या सामना होने के अर्थ दे सकती है।
lexical_decisions:
- source_word: וַיִּקָּר
  choice: मिले
  rationale: קָרָה का यह रूप भेंट या सीधे सामना होने को व्यक्त करता है। ‘मिले’ स्वाभाविक हिन्दी है और किसी दर्शन या प्रकट होने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण दिया गया है।
- source_word: וַיָּשֶׂם דָּבָר בְּפִיו
  choice: उसके मुँह में एक वचन रखा
  rationale: यह परमेश्वर द्वारा बोलने के लिए वाणी दिए जाने का इब्रानी मुहावरा है। अनुवाद मूल के एकवचन דָּבָר और उसके चित्रात्मक ढंग को बनाए रखता है।
- source_word: דָּבָר
  choice: वचन
  rationale: यहाँ דָּבָר उस निश्चित कथन को दर्शाता है जो बिलाम को सुनाना था। ‘वचन’ भविष्यद्वाणी के प्रसंग में स्वाभाविक और मूल के निकट है।
- source_word: שׁוּב
  choice: लौट जा
  rationale: आज्ञार्थक क्रिया बिलाम को बालाक के पास वापस जाने का निर्देश देती है; ‘लौट जा’ स्पष्ट और स्वाभाविक है।
- source_word: וְכֹה תְדַבֵּר
  choice: और इस प्रकार बोलना
  rationale: כֹה आगामी कथन के ढंग या विषय को प्रस्तुत करता है। यह रूप भविष्यद्वाणी की औपचारिकता रखते हुए आधुनिक हिन्दी में समझने योग्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘उन्होंने कहा’ में आदरसूचक बहुवचन हिन्दी व्याकरण के अनुसार याहवे के लिए प्रयुक्त है; मूल इब्रानी में कर्ता एकवचन है। फुटनोट-चिह्न उस क्रिया के तुरंत बाद रखा गया है जिससे उसका संबंध है।
