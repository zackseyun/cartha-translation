  text: מָ֣ה אֶקֹּ֔ב לֹ֥א קַבֹּ֖/ה אֵ֑ל וּ/מָ֣ה אֶזְעֹ֔ם לֹ֥א זָעַ֖ם יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/008.yaml
  text: How can I curse whom God has not cursed? And how can I denounce whom Yahweh has not denounced?[a]
translation:
  language: hi
  text: 'जिसे परमेश्वर ने शाप नहीं दिया, उसे मैं कैसे शाप दूँ?


    और जिसे याहवे ने धिक्कारा नहीं, उसे मैं कैसे धिक्कारूँ?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस पर याहवे क्रोधित नहीं हुआ, उस पर मैं कैसे क्रोधित होऊँ?” दूसरी पंक्ति की इब्रानी क्रिया रोष या रोषपूर्ण निंदा, दोनों पर बल दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָה
  choice: कैसे
  rationale: अलंकारिक प्रश्न में यह शब्द जानकारी नहीं माँगता, बल्कि कार्य की असंभवता व्यक्त करता है; आधुनिक हिन्दी में ‘कैसे’ स्वाभाविक है।
- source_word: אֶקֹּב / קַבֹּה
  choice: शाप दूँ / शाप नहीं दिया
  rationale: दोनों रूप एक ही शाप देने की क्रिया को व्यक्त करते हैं; समान हिन्दी मूल रखने से काव्यात्मक संबंध स्पष्ट रहता है।
- source_word: אֵל
  choice: परमेश्वर
  rationale: यहाँ אֵל ईश्वर के लिए उपाधि है; ‘परमेश्वर’ सामान्य, प्रतिष्ठित और सहज हिन्दी रूप है।
- source_word: אֶזְעֹם / זָעַם
  choice: धिक्कारूँ / धिक्कारा नहीं
  rationale: זעם रोषपूर्ण निंदा या धिक्कार व्यक्त कर सकता है। ‘धिक्कारना’ वाणी से विरोध जताने का भाव रखता है और पहले पद के ‘शाप देना’ से इसका अंतर बनाए रखता है। रोष या क्रोध वाला अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: काव्यात्मक समानांतरता में אֵל और יְהוָה का अलग-अलग रूप
  choice: אֵל के लिए ‘परमेश्वर’ और יְהוָה के लिए ‘यहोवा’
  alternative: दोनों को ‘परमेश्वर’ कहना
  rationale: मूल पाठ एक सामान्य ईश्वरीय उपाधि और व्यक्तिगत नाम, दोनों का प्रयोग करता है; अलग हिन्दी रूप इस भेद को बनाए रखते हैं।
- issue: זעם को निंदा की क्रिया या क्रोध की अवस्था के रूप में समझना
  choice: मुख्य पाठ में ‘धिक्कारना’
  alternative: ‘जिस पर यहोवा क्रोधित नहीं हुआ, उस पर मैं कैसे क्रोधित होऊँ?’
  rationale: संदर्भ में बिलाम से विरोधी वाणी बुलवाई जा रही है, इसलिए ‘धिक्कारना’ उपयुक्त है; फिर भी मूल क्रिया में रोष या क्रोधित होने का वास्तविक अर्थ निहित है, जिसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दोनों पंक्तियों की प्रश्नात्मक समानांतरता और संबंधित क्रियाओं की पुनरावृत्ति बनाए रखी गई है।
