  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקָּ֥ר אֱלֹהִ֖ים אֶל בִּלְעָ֑ם וַ/יֹּ֣אמֶר אֵלָ֗י/ו אֶת שִׁבְעַ֤ת הַֽ/מִּזְבְּחֹת֙ עָרַ֔כְתִּי וָ/אַ֛עַל פָּ֥ר וָ/אַ֖יִל בַּ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/004.yaml
  text: And God met with Balaam[a], and he said to him, “I have arranged the seven altars and offered a bull and a ram on the altar.”
translation:
  language: hi
  text: परमेश्वर बिलाम से मिले[a]। तब बिलाम ने उनसे कहा, “मैंने सातों वेदियाँ तैयार की हैं और वेदी पर एक बैल और एक मेढ़ा चढ़ाया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर का बिलाम से सामना हुआ”; इब्रानी क्रिया किसी से मिलने या सामना होने को व्यक्त कर सकती है और कुछ संदर्भों में संयोग से मिल जाने का भाव भी रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּר
  choice: मिले
  rationale: यह क्रिया यहाँ परमेश्वर और बिलाम के वास्तविक आमने-सामने होने को व्यक्त करती है। ‘मिले’ स्वाभाविक हिन्दी है और इसे केवल आकस्मिक घटना नहीं बनाती; मूल क्रिया की व्यापक अर्थ-छाया पादटिप्पणी में रखी गई है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और संदर्भ के कारण यह एकमात्र परमेश्वर के लिए प्रयुक्त उपाधि है।
- source_word: בִּלְעָם
  choice: बिलाम
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: तब बिलाम ने उनसे कहा
  rationale: आगे के प्रथम पुरुष कथन से बोलने वाला बिलाम स्पष्ट है। हिन्दी में अस्पष्ट सर्वनाम से बचने के लिए उसका नाम दोहराया गया है और परमेश्वर के लिए आदरसूचक ‘उनसे’ रखा गया है।
- source_word: אֶת שִׁבְעַת הַמִּזְבְּחֹת
  choice: सातों वेदियाँ
  rationale: निश्चित पदबंध पहले से ज्ञात सभी सात वेदियों की ओर संकेत करता है; ‘सातों’ इसे सहज हिन्दी में व्यक्त करता है।
- source_word: עָרַכְתִּי
  choice: तैयार की हैं
  rationale: ערך का मूल भाव क्रम से लगाने या तैयार करने का है। इस संदर्भ में पूर्ण हो चुके और अभी प्रासंगिक कार्य के लिए यह स्वाभाविक अभिव्यक्ति है।
- source_word: וָאַעַל
  choice: चढ़ाया है
  rationale: बलिदान-संबंधी प्रयोग में עלה का अर्थ वेदी पर भेंट चढ़ाना है; ‘चढ़ाया’ हिन्दी धार्मिक संदर्भ में स्पष्ट और प्रचलित है।
- source_word: פָּר
  choice: एक बैल
  rationale: बलिदान के संदर्भ में פר का सामान्य और सटीक हिन्दी रूप ‘बैल’ है।
- source_word: וָאַיִל
  choice: एक मेढ़ा
  rationale: אַיִל के लिए बलिदान-संदर्भ में मानक हिन्दी शब्द ‘मेढ़ा’ है।
- source_word: בַּמִּזְבֵּחַ
  choice: वेदी पर
  rationale: मूल पाठ में संज्ञा निश्चित और एकवचन है। यद्यपि प्रसंग में इसका आशय प्रत्येक वेदी से हो सकता है, मुख्य पाठ में ‘हर वेदी पर’ जोड़कर उस वितरक अर्थ को अनिवार्य नहीं बनाया गया।
theological_decisions:
- issue: וַיִּקָּר में ईश्वरीय भेंट का स्वरूप
  choice: इसे परमेश्वर और बिलाम की वास्तविक भेंट के रूप में अनूदित किया गया
  alternative: ‘परमेश्वर का बिलाम से सामना हुआ’ या ऐसा रूप जिसमें संयोग का अधिक प्रबल भाव हो
  rationale: इस धातु में कुछ संदर्भों में आकस्मिक रूप से मिल जाने की अर्थ-छाया हो सकती है, पर यहाँ कथा परमेश्वर और बिलाम के सचेत संवाद को दिखाती है। मुख्य पाठ उस भेंट को स्पष्ट रखता है और मूल की संभावित अर्थ-छाया पादटिप्पणी में संरक्षित करता है।
- issue: בַּמִּזְבֵּחַ का एकवचन और संभावित वितरक अर्थ
  choice: मूल के अनुसार ‘वेदी पर’
  alternative: ‘हर वेदी पर’
  rationale: निकटवर्ती संदर्भ सात वेदियों के कारण वितरक अर्थ का समर्थन कर सकता है, फिर भी इस पद में इब्रानी पाठ स्पष्ट रूप से एकवचन रखता है। अनुवाद ने प्रसंग से अनुमानित विस्तार को मुख्य पाठ में नहीं जोड़ा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर के लिए आदरसूचक बहुवचन सर्वनाम का प्रयोग स्वाभाविक हिन्दी शिष्टाचार के अनुसार है; इससे मूल में अनेकता का संकेत नहीं दिया गया।
