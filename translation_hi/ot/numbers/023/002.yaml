  text: Balak did as Balaam had spoken[a], and Balak and Balaam offered a bull and a ram on the altar.
translation:
  language: hi
  text: बालाक ने वैसा ही किया जैसा बिलाम ने कहा था। फिर बालाक और बिलाम ने वेदी पर एक बैल और एक मेढ़ा चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: किया
  rationale: עשה כאשר דבר की अभिव्यक्ति में अर्थ कही गई बात को पूरा करना है; आधुनिक हिन्दी में ‘वैसा ही किया’ स्वाभाविक है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: जैसा ... ने कहा था
  rationale: यह वाक्यांश बिलाम के पहले दिए गए निर्देश के अनुरूप बालाक के कार्य को दिखाता है; ‘कहा था’ पूर्ववर्ती क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַל
  choice: चढ़ाया
  rationale: हिफ़ील रूप, बलि-पशुओं और वेदी के संदर्भ में, बलि अर्पित करने का पारिभाषिक भाव रखता है। ‘वेदी पर ... चढ़ाया’ हिन्दी में इस बलिदानी अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּלָק וּבִלְעָם
  choice: बालाक और बिलाम
  rationale: संयुक्त कर्ताओं को सीधे समान पदों के रूप में रखा गया है।
- source_word: פָּר
  choice: एक बैल
  rationale: פָּר बलिदानी संदर्भ में बैल को सूचित करता है; इस पद में आयु स्पष्ट न होने के कारण ‘बछड़ा’ या ‘जवान बैल’ से बचा गया है।
- source_word: וָאַיִל
  choice: और एक मेढ़ा
  rationale: אַיִל का मानक अर्थ नर भेड़, अर्थात ‘मेढ़ा’, है।
- source_word: בַּמִּזְבֵּחַ
  choice: वेदी पर
  rationale: बलिदानी संदर्भ में בְּ का स्थानगत भाव आधुनिक हिन्दी में ‘वेदी पर’ से स्वाभाविक रूप से व्यक्त होता है।
