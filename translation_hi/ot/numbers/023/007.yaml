base_translation:
  language: en
  yaml_path: translation/ot/numbers/023/007.yaml
  text: 'Then he took up his discourse and said: “From Aram Balak king of Moab has led me[a], from the mountains of the east: ‘Come, curse Jacob for me; yes, come[c][b], denounce Israel.’”'
translation:
  language: hi
  text: 'तब उसने अपना काव्य-वचन[a] सुनाया और कहा:


    “अराम से मोआब का राजा बालाक मुझे ले आया,


    पूरब के पहाड़ों से[b]:


    ‘आ, मेरे लिए याकूब को शाप दे;


    हाँ, आ, इस्राएल को धिक्कार[c]।’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “औपचारिक काव्य-उक्ति”; इब्रानी मुहावरे का शाब्दिक भाव है, “उसने अपना माशाल उठाया,” जो यहाँ एक औपचारिक काव्यात्मक कथन का परिचय देता है।
    reason: lexical_alternative
  - marker: b
    text: या “पूरबी पहाड़ों से”; यह इब्रानी पद सम्भवतः मोआब से पूरब की ओर स्थित क्षेत्र को भौगोलिक रूप से सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: यह क्रिया “शाप दे” से भिन्न है। इसका अनुवाद “इस्राएल की निन्दा कर” या “इस्राएल को कोस” भी किया जा सकता है; “धिक्कार” शत्रुतापूर्ण निन्दा का भाव रखते हुए इस भेद को बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׂא מְשָׁלוֹ
  choice: उसने अपना काव्य-वचन आरम्भ किया
  rationale: यह इब्रानी मुहावरा एक औपचारिक, काव्यात्मक उक्ति के आरम्भ को सूचित करता है। ‘काव्य-वचन’ मָשָׁל की यहाँ की व्यापकता को ‘नीतिवचन’ से बेहतर व्यक्त करता है, और ‘आरम्भ किया’ हिन्दी में स्वाभाविक है।
- source_word: מִן אֲרָם
  choice: अराम से
  rationale: अराम स्थान-नाम है; इसे बाद के राजनीतिक नाम ‘सीरिया’ से बदलना उचित नहीं।
- source_word: יַנְחֵנִי
  choice: मुझे ले आया
  rationale: हिफ़ील रूप निर्देशित गति, अर्थात ले आने या अगुवाई करने, को व्यक्त करता है। प्रसंग में बालाक द्वारा बिलाम को बुलाकर यहाँ लाना अभिप्रेत है।
- source_word: מֵהַרְרֵי קֶדֶם
  choice: पूरब के पहाड़ों से
  rationale: קֶדֶם को यहाँ अराम के समानांतर भौगोलिक अर्थ ‘पूरब’ में लेना सबसे उपयुक्त है।
- source_word: לְכָה
  choice: आ
  rationale: प्रत्यक्ष कथन में यह बुलावे का आज्ञार्थक रूप है; आधुनिक हिन्दी में ‘आ’ स्वाभाविक है।
- source_word: אָרָה
  choice: शाप दे
  rationale: क्रिया का सीधा अर्थ शाप देना है।
- source_word: לִּי
  choice: मेरे लिए
  rationale: यह बालाक के हित या उसकी ओर से किए जाने वाले कार्य को दर्शाता है।
- source_word: זֹעֲמָה
  choice: रोष प्रकट कर
  rationale: यह पहले प्रयुक्त ‘शाप दे’ वाली क्रिया से भिन्न है। मूल धातु रोष या प्रचंड अप्रसन्नता से जुड़ी है; यह अनुवाद भेद को बनाए रखता है और हिन्दी में बोधगम्य है।
- source_word: יַעֲקֹב / יִשְׂרָאֵל
  choice: याकूब / इस्राएल
  rationale: दोनों नामों को काव्यात्मक समानांतरता और उनके राष्ट्रीय-संधीय संकेतों सहित अलग रखा गया है।
theological_decisions:
- issue: बालाक के उद्धृत अनुरोध में याकूब और इस्राएल का संबंध
  choice: दोनों नामों को वाचा-समुदाय के समानांतर नामों के रूप में अलग-अलग रखा गया है।
  alternative: दोनों को मिलाकर केवल ‘इस्राएली’ कहना।
  rationale: इब्रानी पाठ जानबूझकर ‘याकूब’ और ‘इस्राएल’ की काव्यात्मक जोड़ी रखता है; इसे समतल करना साहित्यिक और धर्मवैचारिक प्रतिध्वनि खो देगा।
- issue: זֹעֲמָה में निहित भाव
  choice: ‘रोष प्रकट कर’ द्वारा पहले वाले ‘शाप दे’ से lexical भेद बनाए रखा गया है।
  alternative: दोनों क्रियाओं का अनुवाद ‘शाप दे’ करना।
  rationale: दो अलग इब्रानी क्रियाओं को एक ही हिन्दी पद में मिला देने से काव्यात्मक भेद मिट जाएगा; फिर भी वाक्य में किसी विशेष धार्मिक अनुष्ठान को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद्यात्मक समानांतरता के लिए पंक्ति-विभाजन रखा गया है। ‘काव्य-वचन’ कुछ साहित्यिक है, पर ‘नीतिवचन’ की अनावश्यक संकीर्णता और ‘भविष्यवाणी’ की अतिव्याख्या से बचता है।
