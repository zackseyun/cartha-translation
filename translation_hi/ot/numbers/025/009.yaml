  text: And those who died in the plague were twenty-four thousand.
translation:
  language: hi
  text: और उस महामारी में मरनेवालों की संख्या चौबीस हज़ार थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: की संख्या ... थी
  rationale: यहाँ היה का रूप कुल संख्या बताने वाले वाक्य में योजक क्रिया के रूप में प्रयुक्त है। स्वाभाविक आधुनिक हिन्दी में ‘की संख्या ... थी’ इस कार्य को स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: הַמֵּתִים
  choice: मरनेवालों
  rationale: מות के कृदन्त का अर्थ ‘मरे हुए लोग’ है। ‘मरनेवालों’ हिन्दी में संक्षिप्त और स्वाभाविक है तथा व्यक्तियों की ओर संकेत बनाए रखता है।
- source_word: בַּמַּגֵּפָה
  choice: उस महामारी में
  rationale: מַגֵּפָה किसी घातक महामारी या प्रकोप को दर्शाता है और ב घटना के भीतर मृत्यु होने का संबंध बताता है। प्रसंगगत निश्चित उपपद को हिन्दी में ‘उस’ से व्यक्त किया गया है।
- source_word: אַרְבָּעָה וְעֶשְׂרִים אָלֶף
  choice: चौबीस हज़ार
  rationale: इब्रानी अभिव्यक्ति का मानक आधुनिक हिन्दी संख्यात्मक रूप ‘चौबीस हज़ार’ है।
