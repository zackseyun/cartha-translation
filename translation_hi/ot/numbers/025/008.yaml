base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/008.yaml
  text: He went after the Israelite man into the chamber and pierced both of them—the Israelite man and the woman—through her belly[c][b][a]. Then the plague was stopped from upon the sons of Israel.
translation:
  language: hi
  text: वह उस इस्राएली पुरुष के पीछे भीतरी कक्ष[a] में गया और उसने उन दोनों को—उस इस्राएली पुरुष और उस स्त्री को—उसके पेट तक[b] बेध दिया। तब इस्राएल के पुत्रों[c] पर से महामारी थम गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तंबू का कक्ष,’ ‘अंतःकक्ष’ अथवा ‘मंडप’; इब्रानी शब्द दुर्लभ है और किसी अंदरूनी कक्ष या अलग किए हुए स्थान को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसके उदर में।’ इब्रानी शब्द विशेष रूप से पेट या उदर-गुहा को सूचित करता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; यह इस्राएल के लोगों के लिए प्रयुक्त एक मानक वाचा-संबंधी अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַקֻּבָּה
  choice: भीतरी कक्ष
  rationale: यह दुर्लभ संज्ञा किसी भीतर के कक्ष या अलग किए हुए निजी स्थान को सूचित करती है। ‘भीतरी कक्ष’ किसी विशेष वास्तु-रूप को अनावश्यक रूप से निश्चित किए बिना अर्थ स्पष्ट करता है।
- source_word: וַיִּדְקֹר
  choice: बेध दिया
  rationale: यह क्रिया किसी नुकीले हथियार से भेदने का हिंसक भाव रखती है; ‘बेध दिया’ उस भाव को स्वाभाविक और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों को
  rationale: द्विवचन-सदृश सामूहिक अभिव्यक्ति को सीधे रूप में रखता है और स्पष्ट करता है कि प्रहार दोनों पर हुआ।
- source_word: אֶל קֳבָתָהּ
  choice: उसके पेट के आर-पार
  rationale: קֳבָה पेट अथवा उदर-गुहा को सूचित करता है। प्रसंग में ‘आर-पार’ प्रहार की भेदनकारी दिशा को व्यक्त करता है, जबकि शरीर-संबंधी ठोस विवरण को नरम नहीं करता।
- source_word: וַתֵּעָצַר
  choice: रुक गई
  rationale: निफ़अल रूप महामारी के रोक दिए जाने या थम जाने का परिणाम बताता है; हिन्दी में ‘रुक गई’ स्पष्ट और स्वाभाविक है।
- source_word: הַמַּגֵּפָה
  choice: महामारी
  rationale: दैवी दंड के इस प्रसंग में מַגֵּפָה के लिए ‘महामारी’ प्रचलित और सहज हिन्दी शब्द है।
- source_word: מֵעַל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों पर
  rationale: यह चयन מֵעַל के स्थान-संबंधी भाव और בְּנֵי יִשְׂרָאֵל की मूल वाचा-संबंधी अभिव्यक्ति, दोनों को यथासंभव बनाए रखता है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएली पुरुष
  rationale: यह व्यक्ति के पुरुष होने और उसकी इस्राएली पहचान, दोनों को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त सामूहिक पद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली / इस्राएल के लोग
  rationale: मूल इब्रानी में मानक वाचा-संबंधी अभिव्यक्ति शाब्दिक रूप से ‘इस्राएल के पुत्र’ है। इसे मुख्य पाठ में रखा गया है और पादटिप्पणी में स्पष्ट किया गया है कि प्रसंग में यह समूचे समुदाय को सूचित करता है।
- issue: न्याय के दृश्य का स्पष्ट शारीरिक विवरण
  choice: उसके पेट के आर-पार
  alternative: उसके उदर में / उसके शरीर में
  rationale: मूल पाठ स्त्री के पेट अथवा उदर-गुहा का ठोस उल्लेख करता है। अनुवाद इस कठोर विवरण को न तो नरम करता है, न उसमें अतिरिक्त वीभत्सता जोड़ता है।
- issue: אֶל קֳבָתָהּ में स्त्रीलिंग प्रत्यय का संदर्भ
  choice: उसके पेट के आर-पार
  alternative: उनके पेटों के आर-पार
  rationale: प्रत्यय स्पष्ट रूप से स्त्रीलिंग एकवचन है, इसलिए ‘उसके’ का संदर्भ स्त्री से रखा गया है, भले ही वाक्य पहले दोनों को बेधने की बात कहता है। इस व्याकरणिक तनाव को सामंजस्य बैठाकर मिटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। हिंसक विवरण को मूल के अनुरूप ठोस रखा गया है, पर अनावश्यक रूप से वीभत्स नहीं बनाया गया। ‘भीतरी कक्ष’ दुर्लभ स्थानवाचक संज्ञा की अनिश्चितता को पादटिप्पणी सहित बनाए रखता है।
