source:
  edition: WLC
  text: וַ/יֵּ֥שֶׁב יִשְׂרָאֵ֖ל בַּ/שִּׁטִּ֑ים וַ/יָּ֣חֶל הָ/עָ֔ם לִ/זְנ֖וֹת אֶל בְּנ֥וֹת מוֹאָֽב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/001.yaml
  text: While Israel was staying at Shittim[a], the people began to prostitute themselves with the daughters of Moab.
translation:
  language: hi
  text: जब इस्राएल शित्तीम में ठहरा था, तब लोग मोआब की बेटियों के साथ यौन अनैतिकता करने लगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब की बेटियों के साथ वेश्या के समान आचरण करने लगे।” हिब्रू में शाब्दिक रूप से, “मोआब की बेटियों के साथ वेश्या के समान आचरण करना शुरू किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: ठहरा हुआ था
  rationale: यहाँ ישׁב इस्राएल के उस स्थान पर कुछ समय रहने या पड़ाव डालने को दर्शाता है; ‘ठहरा हुआ था’ स्थायी बसावट का अनावश्यक अर्थ नहीं देता।
- source_word: בַּשִּׁטִּים
  choice: शित्तीम में
  rationale: स्थाननाम का देवनागरी लिप्यंतरण किया गया है; हिन्दी में किसी स्थान पर निवास या पड़ाव के लिए ‘में’ स्वाभाविक है।
- source_word: וַיָּחֶל
  choice: करने लगे
  rationale: यह क्रिया यहाँ किसी कार्य के आरम्भ को व्यक्त करती है; संयुक्त रूप ‘वेश्यागमन करने लगे’ सहज आधुनिक हिन्दी है।
- source_word: הָעָם
  choice: लोग
  rationale: यह सामूहिक रूप से इस्राएल के लोगों को सूचित करता है; ‘लोग’ संक्षिप्त और स्वाभाविक है।
- source_word: לִזְנוֹת
  choice: वेश्यागमन करने
  rationale: זנה अवैध यौन आचरण को वेश्यावृत्ति के तीखे बिंब में व्यक्त करता है। ‘वेश्यागमन’ उस स्पष्टता और नैतिक तीव्रता को बनाए रखता है, जबकि सामान्य ‘व्यभिचार’ अर्थ को कुछ व्यापक कर सकता है।
- source_word: אֶל
  choice: के साथ
  rationale: זנה के साथ व्यक्ति-वाचक पूरक आने पर אֶל यौन संबंध में सहभागिता दर्शाता है; हिन्दी में ‘के साथ’ इसका स्वाभाविक रूप है।
- source_word: בְּנוֹת מוֹאָב
  choice: मोआब की बेटियों
  rationale: यह हिब्रू पदबंध का निकट अनुवाद है और हिन्दी में बोधगम्य है; आशय मोआबी स्त्रियों से है।
theological_decisions:
- issue: इस्राएल के पाप का स्वरूप
  choice: स्पष्ट वेश्यागमन-संबंधी भाषा
  alternative: ‘मोआबी स्त्रियों के साथ यौन अनैतिकता करने लगे’ अथवा ‘व्यभिचार करने लगे’
  rationale: मूल क्रिया זנה सामान्य नैतिक अमूर्तन से अधिक सजीव और तीखी है। चुना हुआ रूप पद में उपस्थित वास्तविक यौन पाप को स्पष्ट रखता है, पर इस एक पद से आगे कोई अतिरिक्त धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘शित्तीम’ और ‘मोआब’ पारंपरिक बाइबलीय स्थाननामों के रूप में रखे गए हैं। मुख्य पाठ में ‘वेश्यागमन’ मूल की तीक्ष्णता सुरक्षित रखता है; पादटिप्पणी अधिक सामान्य अर्थ और हिब्रू बिंब दोनों बताती है।
