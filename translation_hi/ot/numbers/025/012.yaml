base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/012.yaml
  text: Therefore say, ‘Look, I am giving him my covenant of peace.’
translation:
  language: hi
  text: इसलिए कह, ‘देख, मैं उसे अपनी शान्ति की वाचा देता हूँ।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पिछले प्रसंग के आधार पर निकलने वाले परिणाम को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: הִנְנִי
  choice: देख, मैं
  rationale: हिब्रू प्रस्तुतिकरण-सूचक अभिव्यक्ति की तत्परता और बल को बनाए रखता है; आधुनिक हिन्दी में ‘देख’ सहज है।
- source_word: נֹתֵן
  choice: देता हूँ
  rationale: हिब्रू कृदन्त यहाँ वर्तमान और सुनिश्चित दैवी घोषणा का भाव देता है; साधारण वर्तमान हिन्दी में स्वाभाविक है।
- source_word: בְּרִיתִי שָׁלוֹם
  choice: अपनी शान्ति की वाचा
  rationale: संबंधसूचक संरचना मूल की संक्षिप्तता और ‘शान्ति’ से संबंधित वाचा के अर्थगत खुलेपन को बनाए रखती है।
theological_decisions:
- issue: בְּרִיתִי שָׁלוֹם में संबंध का स्वरूप
  choice: अपनी शान्ति की वाचा
  alternative: अपनी शान्ति की वाचा अर्थात् स्थायी याजकपद
  rationale: पद 12 स्वयं केवल ‘शान्ति की वाचा’ कहता है; अगले पद की व्याख्या को इस पद में मिलाने से बचकर मूल की theological tension और क्रम को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक घोषणा के अनुरूप भाषा। ‘वाचा’ बाइबलीय covenant के लिए स्थापित हिन्दी शब्द है; ‘शान्ति’ में हिब्रू שָׁלוֹם की कल्याण और पूर्णता संबंधी व्यापकता पूरी तरह सीमित नहीं की गई है।
