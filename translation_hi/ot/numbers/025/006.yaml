source:
  edition: WLC
  text: וְ/הִנֵּ֡ה אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל בָּ֗א וַ/יַּקְרֵ֤ב אֶל אֶחָי/ו֙ אֶת הַ/מִּדְיָנִ֔ית לְ/עֵינֵ֣י מֹשֶׁ֔ה וּ/לְ/עֵינֵ֖י כָּל עֲדַ֣ת בְּנֵי יִשְׂרָאֵ֑ל וְ/הֵ֣מָּה בֹכִ֔ים פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/006.yaml
  text: And behold, a man from the sons of Israel came and brought near to his brothers a Midianite woman, before the eyes of Moses and before the eyes of all the congregation of the sons of Israel, while they were weeping at the entrance of the tent of meeting.
translation:
  language: hi
  text: और देखो, इस्राएल के पुत्रों में से एक आदमी आया और एक मिद्यानी स्त्री को अपने भाइयों[a] के पास ले आया, मूसा की आँखों के सामने और इस्राएल के पुत्रों की सारी मंडली की आँखों के सामने, जबकि वे मिलाप के तंबू के द्वार पर रो रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “अपने कुटुम्बियों” या “अपने संगी इस्राएलियों” के पास। इब्रानी में, “अपने भाइयों के पास।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह आकस्मिक ध्यान और चौंकाने वाले दृश्य की ओर संकेत करने वाले इब्रानी कथात्मक चिह्न को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों में से
  rationale: मूल के पुरुषवाची पारिवारिक वाचा-संबंधी पदबंध को सुरक्षित रखता है; केवल 'इस्राएलियों में से' कहना अधिक सहज होता, पर मूल रूपक को समतल कर देता।
- source_word: וַיַּקְרֵב
  choice: ले आया
  rationale: हिफ़ील क्रिया का प्रसंगगत अर्थ किसी को निकट लाना है। हिन्दी में 'अपने भाइयों के पास ... ले आया' स्थानिक दिशा और जानबूझकर किए गए सार्वजनिक कृत्य दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל אֶחָיו
  choice: अपने भाइयों के पास
  rationale: मूल का शाब्दिक पारिवारिक संबोधन सुरक्षित है; प्रसंग में इससे उसके संगी इस्राएली अभिप्रेत हैं।
- source_word: הַמִּדְיָנִית
  choice: एक मिद्यानी स्त्री
  rationale: स्त्रीलिंग विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है, इसलिए 'स्त्री' स्पष्ट किया गया है। कथा में उसके प्रथम परिचय के कारण हिन्दी में 'एक' स्वाभाविक है, यद्यपि इब्रानी रूप निश्चित है।
- source_word: לְעֵינֵי ... וּלְעֵינֵי
  choice: की आँखों के सामने ... की आँखों के सामने
  rationale: मूल की पुनरावृत्ति और कृत्य के निर्लज्ज सार्वजनिक स्वरूप को बनाए रखता है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की सारी मंडली
  rationale: עֵדָה के लिए 'मंडली' एक स्पष्ट और प्रचलित सामुदायिक पद है; 'सारी' पूरे एकत्र समुदाय को व्यक्त करता है।
- source_word: וְהֵמָּה בֹכִים
  choice: जब वे ... रो रहे थे
  rationale: सर्वनाम और कृदंत से व्यक्त चल रही पृष्ठभूमि की क्रिया को हिन्दी में समकालिक, अपूर्ण क्रिया के रूप में दर्शाता है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: पवित्रस्थान की विशिष्ट संज्ञा का प्रचलित हिन्दी रूप और उसके प्रवेश-स्थान का स्पष्ट वर्णन है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל और אֶחָיו में पुरुषवाची वाचा-संबंधी भाषा
  choice: '''इस्राएल के पुत्रों'' और ''अपने भाइयों'' को मुख्य पाठ में सुरक्षित रखा गया'
  alternative: '''इस्राएलियों'' और ''अपने संगी इस्राएलियों'''
  rationale: इब्रानी पाठ पुरुषवाची पारिवारिक शब्दों का प्रयोग करता है। इन्हें बनाए रखने से मूल की वाचा-संबंधी पारिवारिक भाषा सुरक्षित रहती है और प्रसंगगत अर्थ को बिना आवश्यकता तटस्थ नहीं बनाया जाता।
- issue: הַמִּדְיָנִית की निश्चितता
  choice: कथा के प्रथम परिचय के अनुरूप 'एक मिद्यानी स्त्री'
  alternative: '''वह मिद्यानी स्त्री'''
  rationale: इब्रानी विशेषण निश्चित रूप में है, पर हिन्दी कथा-प्रवाह में पहले से अज्ञात पात्र का परिचय 'एक' से स्वाभाविक है। इससे उसकी जातीय पहचान सुरक्षित रहती है और किसी पूर्व-उल्लिखित स्त्री का संकेत अनावश्यक रूप से नहीं बनता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। मूल की ध्यानाकर्षक शुरुआत, पारिवारिक वाचा-संबंधी पदावली, सार्वजनिकता पर बल देने वाली पुनरावृत्ति और चल रहे विलाप की पृष्ठभूमि सुरक्षित है। वाक्य को हिन्दी में बोझिल होने से बचाने के लिए दो वाक्यों में रखा गया है।
