base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/002.yaml
  text: And they invited the people to the sacrifices of their gods[a], and the people ate and bowed down to their gods.
translation:
  language: hi
  text: और उन स्त्रियों ने लोगों को अपने देवताओं के बलिदानों में बुलाया; तब लोगों ने खाया और उनके देवताओं के आगे दण्डवत किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके देवताओं की आराधना की।” इब्रानी क्रिया का शाब्दिक अर्थ स्वयं को झुकाना या दण्डवत करना है; यह प्रायः उपासना के कार्य के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרֶאןָ
  choice: उन स्त्रियों ने ... बुलाया
  rationale: क्रिया स्त्रीलिंग बहुवचन है और पिछले पद की मोआबी स्त्रियों की ओर संकेत करती है। לְ के साथ קרא यहाँ किसी आयोजन में बुलाने या निमंत्रित करने का भाव देता है। स्पष्टता के लिए हिन्दी में निहित कर्ता ‘उन स्त्रियों’ को व्यक्त किया गया है।
- source_word: לָעָם
  choice: लोगों को
  rationale: संज्ञा का शाब्दिक अर्थ ‘लोग/प्रजा’ है। संदर्भ में इस्राएली लोग अभिप्रेत हैं, पर मूल पाठ यहाँ ‘इस्राएल’ नहीं दोहराता।
- source_word: לְזִבְחֵי אֱלֹהֵיהֶן
  choice: अपने देवताओं के बलिदानों में
  rationale: זִבְחֵי बहुवचन संबंध-रूप है और उन देवताओं से जुड़े बलिदानों अथवा बलिदानी भोजों को दर्शाता है। हिन्दी में ‘बलिदानों में बुलाया’ अनुष्ठान/भोज में सम्मिलित होने का स्वाभाविक भाव देता है।
- source_word: וַיֹּאכַל
  choice: लोगों ने खाया
  rationale: मूल में सामूहिक एकवचन कर्ता ‘लोग’ के साथ साधारण कथात्मक क्रिया है। हिन्दी में ‘लोगों ने खाया’ सीधा और स्वाभाविक है।
- source_word: וַיִּשְׁתַּחֲווּ
  choice: दण्डवत किया
  rationale: क्रिया स्वयं को झुकाने या भूमि तक झुककर प्रणाम करने की ठोस शारीरिक क्रिया बताती है, जो यहाँ उपासना का कार्य है। ‘दण्डवत किया’ शारीरिक भाव बनाए रखता है; ‘आराधना की’ अधिक व्याख्यात्मक होगा।
- source_word: לֵאלֹהֵיהֶן
  choice: उनके देवताओं के आगे
  rationale: השתחוה के बाद לְ उस सत्ता को चिह्नित करता है जिसकी ओर दण्डवत किया गया। स्वाभाविक हिन्दी में ‘के आगे’ इस संबंध को स्पष्ट करता है।
theological_decisions:
- issue: וַיִּשְׁתַּחֲווּ द्वारा वर्णित मूर्तिपूजक कृत्य
  choice: उनके देवताओं के आगे दण्डवत किया
  alternative: उनके देवताओं की आराधना की
  rationale: मुख्य पाठ ठोस शारीरिक क्रिया को सुरक्षित रखता है और साथ ही ‘देवताओं के आगे’ से उसका उपासना-संबंधी आशय स्पष्ट होने देता है। विकल्प अर्थ की व्याख्या करता है, पर मूल की दृश्यात्मकता घटाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। स्त्रीलिंग बहुवचन कर्ता को संदर्भगत स्पष्टता के लिए ‘उन स्त्रियों’ कहकर व्यक्त किया गया है। ‘दण्डवत किया’ मूल क्रिया की शारीरिक छवि और उसके धार्मिक आशय के बीच का तनाव बनाए रखता है।
