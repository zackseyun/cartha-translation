  text: וַ/יַּ֗רְא פִּֽינְחָס֙ בֶּן אֶלְעָזָ֔ר בֶּֽן אַהֲרֹ֖ן הַ/כֹּהֵ֑ן וַ/יָּ֨קָם֙ מִ/תּ֣וֹךְ הָֽ/עֵדָ֔ה וַ/יִּקַּ֥ח רֹ֖מַח בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/007.yaml
  text: When Phinehas son of Eleazar[a], son of Aaron the priest, saw it[b], he rose up from the midst of the congregation and took a spear in his hand.
translation:
  language: hi
  text: जब याजक हारून के पोते और एलीआज़र के पुत्र पीनहास ने यह देखा[a], तो वह मंडली के बीच से[b] उठ खड़ा हुआ और अपने हाथ में एक भाला लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘देखा।’ हिब्रू में केवल ‘देखा’ है; क्या देखा, यह पिछले प्रसंग से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मंडली में से’ अथवा ‘सभा के बीच से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: यह देखा
  rationale: हिब्रू क्रिया का अर्थ केवल ‘देखा’ है और उसका कर्म पिछले प्रसंग से निहित है। सहज हिन्दी के लिए ‘यह’ जोड़ा गया है, पर घटना का कोई अतिरिक्त विवरण नहीं जोड़ा गया।
- source_word: פִּינְחָס
  choice: पीनहास
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के पोते, एलीआज़र के पुत्र
  rationale: वंश-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है। הַכֹּהֵן का अनुवाद ‘याजक’ किया गया है; मूल में ‘महायाजक’ नहीं है।
- source_word: וַיָּקָם
  choice: उठ खड़ा हुआ
  rationale: यह उठने अथवा खड़े होने की क्रिया और आगामी निर्णायक कार्य की कथात्मक गति, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִתּוֹךְ הָעֵדָה
  choice: मंडली के बीच से
  rationale: מִתּוֹךְ के ‘बीच में से’ और עֵדָה के एकत्र समुदाय के अर्थ को संक्षिप्त तथा स्वाभाविक रूप में रखा गया है।
- source_word: וַיִּקַּח
  choice: ले लिया
  rationale: सामान्य क्रिया ‘लेना’ मूल के अनुरूप है; ‘झपट लिया’ जैसे अधिक तीव्र विकल्प मूल से अधिक अर्थ जोड़ते।
- source_word: רֹמַח
  choice: एक भाला
  rationale: इस प्रकार के नोकदार हथियार के लिए ‘भाला’ स्पष्ट और सामान्य आधुनिक हिन्दी शब्द है।
- source_word: בְּיָדוֹ
  choice: हाथ में
  rationale: हिब्रू संबंधवाचक प्रत्यय कर्ता की ओर स्पष्ट संकेत करता है; हिन्दी में ‘उसने ... हाथ में लिया’ से स्वामित्व सहज रूप से समझ में आता है।
theological_decisions:
- issue: הָעֵדָה का अनुवाद
  choice: मंडली
  alternative: सभा; समुदाय
  rationale: ‘मंडली’ इस्राएल के एकत्र जनसमुदाय का सामूहिक भाव बनाए रखता है, बिना किसी बाद की विशिष्ट कलीसियाई संरचना को आरोपित किए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। वंशावली को हिन्दी की स्वाभाविक संबंध-रचना में रखा गया है और मूल में निहित कर्म तथा ‘मंडली’ के वैकल्पिक अर्थों को टिप्पणियों में स्पष्ट किया गया है।
