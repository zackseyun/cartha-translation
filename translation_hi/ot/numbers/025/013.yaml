  text: וְ/הָ֤יְתָה לּ/וֹ֙ וּ/לְ/זַרְע֣/וֹ אַחֲרָ֔י/ו בְּרִ֖ית כְּהֻנַּ֣ת עוֹלָ֑ם תַּ֗חַת אֲשֶׁ֤ר קִנֵּא֙ לֵֽ/אלֹהָ֔י/ו וַ/יְכַפֵּ֖ר עַל בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/013.yaml
  text: It shall be for him and for his offspring after him a covenant of a perpetual priesthood[c][b][a], because he was jealous for his God and made atonement for the sons of Israel.
translation:
  language: hi
  text: और यह उसके लिए और उसके बाद आने वाले उसके वंश के लिए सदा की याजकता की वाचा होगी, क्योंकि उसने अपने परमेश्वर के लिए जोश दिखाया[a] और इस्राएल के पुत्रों के लिए प्रायश्चित किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने परमेश्वर के लिए जलन दिखाई।” इब्रानी क्रिया वाचा-संबंधी जलन या उत्साही निष्ठा, दोनों का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल के पुत्र” पारम्परिक इब्रानी राष्ट्रीय पदवी है और यहाँ इस्राएल के लोगों को दर्शाती है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהָיְתָה
  choice: और ... होगी
  rationale: स्त्रीलिंग एकवचन क्रिया को आगे आने वाली ‘वाचा’ के साथ जोड़ा गया है; हिन्दी में आरम्भिक संयोजक को बनाए रखना स्वाभाविक और स्रोत-संगत है।
- source_word: לּוֹ וּלְזַרְעוֹ אַחֲרָיו
  choice: उसके लिए और उसके बाद उसके वंश के लिए
  rationale: ‘वंश’ זֶרַע के सामूहिक एकवचन भाव और उत्तराधिकार की निरन्तरता को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּרִית כְּהֻנַּת עוֹלָם
  choice: सदा की याजकता की वाचा
  rationale: ‘वाचा’ בְּרִית का मानक धर्मशास्त्रीय शब्द है; ‘सदा की’ עוֹלָם की संस्थागत और दीर्घस्थायी निरन्तरता व्यक्त करती है, बिना अनावश्यक दार्शनिक अर्थ थोपे।
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ पदबंध प्रतिज्ञा के आधार अथवा कारण को प्रस्तुत करता है; ‘क्योंकि’ संक्षिप्त और स्वाभाविक है।
- source_word: קִנֵּא לֵאלֹהָיו
  choice: उसने अपने परमेश्वर के लिए जलन दिखाई
  rationale: ‘जलन दिखाई’ क्रिया קנא में निहित वाचा-संबंधी ईर्ष्यापूर्ण निष्ठा को निकटता से रखती है; ‘जोश दिखाया’ सम्भव वैकल्पिक अर्थ है और पादटिप्पणी में दिया गया है।
- source_word: וַיְכַפֵּר
  choice: प्रायश्चित किया
  rationale: याजकीय संदर्भ में כפר के लिए यह प्रचलित, सुलभ और अर्थपूर्ण हिन्दी अभिव्यक्ति है।
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के लिए
  rationale: यह इब्रानी राष्ट्रीय पदवी का रूप-संगत अनुवाद है; इसका सामूहिक आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: קנא का अर्थ और पीनहास के कार्य का स्वरूप
  choice: अपने परमेश्वर के लिए जलन दिखाई
  alternative: अपने परमेश्वर के लिए जोश दिखाया
  rationale: इब्रानी क्रिया जलन और उत्साही निष्ठा दोनों व्यक्त कर सकती है। मुख्य पाठ वाचा-संबंधी विशिष्ट निष्ठा के भाव को सुरक्षित रखता है, जबकि अधिक मुहावरेदार विकल्प पादटिप्पणी में है।
- issue: याजकता की प्रतिज्ञा में עוֹלָם का बल
  choice: सदा की याजकता
  alternative: सर्वदा रहने वाली याजकता
  rationale: यह चयन स्थायी संस्थागत निरन्तरता व्यक्त करता है, पर इब्रानी से अधिक प्रबल अमूर्त या तत्त्वमीमांसक अनन्तता का दावा नहीं जोड़ता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक राष्ट्रीय अर्थ
  choice: इस्राएल के पुत्र
  alternative: इस्राएल के लोग
  rationale: मुख्य पाठ स्रोत के पुरुषवाची पारम्परिक राष्ट्रीय पदनाम को बनाए रखता है; पादटिप्पणी स्पष्ट करती है कि सन्दर्भ पूरे समुदाय से है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए बोधगम्य रूप अपनाया गया है। ‘वाचा’, ‘याजकता’ और ‘प्रायश्चित’ जैसे स्थापित बाइबिलीय शब्द संदर्भ की धर्मशास्त्रीय सटीकता के लिए रखे गए हैं।
