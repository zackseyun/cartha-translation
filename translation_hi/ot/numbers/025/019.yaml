  text: 'और महामारी के बाद ऐसा हुआ:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यहाँ हिब्रू कथात्मक रूप एक संक्रमण-सूत्र है। ‘और ऐसा हुआ’ उसके कथात्मक कार्य को बनाए रखते हुए आधुनिक, सहज और गरिमापूर्ण हिन्दी देता है।
- source_word: אַחֲרֵי
  choice: के बाद
  rationale: यह पद समय-क्रम बताता है; ‘के बाद’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַמַּגֵּפָה
  choice: उस महामारी
  rationale: מַגֵּפָה यहाँ घातक दैवी दण्ड के प्रसंग में महामारी को सूचित करता है। निश्चित उपपद को प्रसंगानुसार ‘उस’ से व्यक्त किया गया है, क्योंकि संकेत पूर्ववर्णित महामारी की ओर है।
theological_decisions:
- issue: कथात्मक संक्रमण-सूत्र को स्वतंत्र वाक्य के रूप में प्रस्तुत करना
  choice: इस संक्षिप्त उपवाक्य को स्वतंत्र संक्रमण-वाक्य के रूप में अनूदित किया गया है।
  alternative: इसे अगले वाक्य के आरम्भ से जोड़कर पढ़ना।
  rationale: मसोरेटिक पाठ में यह एक संक्षिप्त कथात्मक संक्रमण है और इसके बाद अनुच्छेद-विराम का चिह्न है। स्वतंत्र वाक्य स्रोत-पाठ की संरचना तथा संक्रमणकारी भूमिका दोनों को सुरक्षित रखता है; इससे कोई धर्मसिद्धान्त निर्धारित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘और ऐसा हुआ’ पारम्परिक बाइबिलीय सूत्र की पहचान बनाए रखता है, पर अत्यधिक पुरातन भाषा से बचता है।
