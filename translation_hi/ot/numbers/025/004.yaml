reference: Numbers 25:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה קַ֚ח אֶת כָּל רָאשֵׁ֣י הָ/עָ֔ם וְ/הוֹקַ֥ע אוֹתָ֛/ם לַ/יהוָ֖ה נֶ֣גֶד הַ/שָּׁ֑מֶשׁ וְ/יָשֹׁ֛ב חֲר֥וֹן אַף יְהוָ֖ה מִ/יִּשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/004.yaml
  text: And Yahweh said to Moses[a], “Take all the leaders of the people and impale them for Yahweh in broad daylight[b], so that the burning anger of Yahweh may turn away from Israel.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा[a], “लोगों के सभी अगुओं को पकड़ो और दिन-दहाड़े[b] यहोवा के लिए उन्हें सूली पर चढ़ा दो, ताकि यहोवा का धधकता क्रोध इस्राएल पर से हट जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “लोगों के सभी अगुओं को लो और उनसे कहो कि वे दोषियों को दिन-दहाड़े यहोवा के लिए मृत्युदंड दें।” हिब्रू में ‘उन्हें’ का सबसे सीधा संकेत अगुओं की ओर है, लेकिन कुछ लोग अगुओं को दंड पानेवाले नहीं, बल्कि दंड देनेवाले समझते हैं।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक अर्थ, “सूरज के सामने।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: קַח
  choice: पकड़ो
  rationale: इस दंडात्मक प्रसंग में क्रिया केवल साथ लेने की नहीं, संबंधित व्यक्तियों को अधिकारपूर्वक पकड़ने की ओर संकेत करती है; इसलिए आधुनिक हिन्दी में ‘पकड़ो’ स्वाभाविक है।
- source_word: כָּל רָאשֵׁי הָעָם
  choice: लोगों के सभी अगुओं
  rationale: शाब्दिक ‘लोगों के सिरों’ के बजाय ‘अगुओं’ से רָאשֵׁי का नेतृत्व-संबंधी अर्थ स्पष्ट और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: וְהוֹקַע אֹתָם
  choice: उन्हें सूली पर चढ़ा दो
  rationale: हिफ़ील क्रिया सार्वजनिक, कठोर मृत्युदंड और शव को प्रदर्शित करने का बोध करा सकती है। ‘सूली पर चढ़ा दो’ हिन्दी में उस सार्वजनिक दंड को व्यक्त करता है, यद्यपि दंड की ठीक विधि पूरी तरह निश्चित नहीं है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל यहाँ समर्पण अथवा यहोवा के न्याय की पूर्ति के लिए किए जाने का संबंध दर्शाता है; मूल में ‘यहोवा के सामने’ वाला सामान्य पदबंध नहीं है।
- source_word: נֶגֶד הַשָּׁמֶשׁ
  choice: दिन-दहाड़े
  rationale: शाब्दिक अर्थ ‘सूरज के सामने’ है; मुहावरे का आशय खुले रूप से दिन के प्रकाश में दंड देना है।
- source_word: חֲרוֹן אַף יְהוָה
  choice: यहोवा का धधकता क्रोध
  rationale: हिब्रू की तीव्र, जलते हुए क्रोध की छवि को ‘धधकता क्रोध’ स्वाभाविक और प्रभावशाली हिन्दी में बनाए रखता है।
- source_word: וְיָשֹׁב ... מִיִּשְׂרָאֵל
  choice: इस्राएल पर से हट जाए
  rationale: आज्ञा के उद्देश्य/परिणाम और מן के अलगाव-बोध को हिन्दी के स्वाभाविक पदबंध में व्यक्त किया गया है।
theological_decisions:
- issue: ‘उन्हें’ का संदर्भ
  choice: मुख्य पाठ में सर्वनाम को निकटतम बहुवचन पूर्वपद ‘लोगों के सभी अगुओं’ से जोड़ा गया है।
  alternative: अगुओं को आदेश दिया जाता है कि वे दोषी उपासकों को मृत्युदंड दें।
  rationale: वाक्य-विन्यास में אֹתָם का सबसे सीधा पूर्वपद ‘लोगों के सभी अगुए’ है, पर अगले पद में न्यायियों को दोषी पुरुषों को मार डालने की आज्ञा दिए जाने से वैकल्पिक समझ उत्पन्न होती है। वास्तविक व्याख्यात्मक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: לַיהוָה का संबंध
  choice: यहोवा के लिए
  alternative: यहोवा के सामने
  rationale: ל सामान्यतः ‘के लिए/को’ का संबंध दर्शाता है; यहाँ ‘के सामने’ के लिए अपेक्षित לִפְנֵי नहीं है। इसलिए समर्पण अथवा न्यायिक उद्देश्य को मुख्य पाठ में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण रूप अपनाया गया है। ‘अगुए,’ ‘दिन-दहाड़े,’ और ‘धधकता क्रोध’ सामान्य पाठक के लिए स्पष्ट हैं। मुख्य पाठ मूल के सीधे वाक्य-विन्यास का अनुसरण करता है, जबकि अगुओं और दोषियों से संबंधित वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
