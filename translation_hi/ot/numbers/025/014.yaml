  text: וְ/שֵׁם֩ אִ֨ישׁ יִשְׂרָאֵ֜ל הַ/מֻּכֶּ֗ה אֲשֶׁ֤ר הֻכָּה֙ אֶת הַ/מִּדְיָנִ֔ית זִמְרִ֖י בֶּן סָל֑וּא נְשִׂ֥יא בֵֽית אָ֖ב לַ/שִּׁמְעֹנִֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/014.yaml
  text: The name of the Israelite man who was struck down[a], who was struck down with the Midianite woman, was Zimri son of Salu[b], a leader of a father's house among the Simeonites.
translation:
  language: hi
  text: उस इस्राएली पुरुष का नाम, जिसे मार डाला गया था, जिसे मिद्यानी स्त्री के साथ मार डाला गया था, ज़िम्री था। वह सालू का पुत्र और शिमोनियों में एक पितृकुल[a] का प्रधान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “पितृकुल” से आशय किसी जनजाति के भीतर पिता की वंश-रेखा से पहचाने जाने वाले परिवार या कुल की इकाई से है।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/שֵׁם
  choice: उसका नाम
  rationale: वाक्य पिछले वृत्तांत से जुड़कर मारे गए पुरुष की पहचान बताता है; हिन्दी में मुख्य वाक्य के भीतर ‘उसका नाम’ स्वाभाविक है।
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएली पुरुष
  rationale: राष्ट्रीय पहचान और स्पष्ट पुल्लिंग एकवचन दोनों सुरक्षित रहते हैं।
- source_word: הַמֻּכֶּה ... אֲשֶׁר הֻכָּה
  choice: जिस ... को ... मार डाला गया था—जिसे मार डाला गया था
  rationale: नכה के दोनों कर्मवाच्य रूपों की जानबूझकर की गई पुनरावृत्ति को हिन्दी में भी बनाए रखा गया है; प्रसंग में ‘मार डाला’ हिंसक मृत्यु को स्पष्ट करता है।
- source_word: אֶת הַמִּדְיָנִית
  choice: मिद्यानी स्त्री के साथ
  rationale: यहाँ אֶת साथ मारे जाने का भाव देता है; स्त्रीलिंग विशेषण से ‘स्त्री’ स्पष्ट रूप से निहित है।
- source_word: זִמְרִי בֶּן סָלוּא
  choice: जिम्री ... सालू का पुत्र
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण और בן का स्वाभाविक हिन्दी संबंधसूचक रूप।
- source_word: נְשִׂיא
  choice: प्रधान
  rationale: यह कुलगत नेतृत्व-पद दर्शाता है; ‘प्रधान’ आधुनिक हिन्दी में स्पष्ट है और ‘राजकुमार’ जैसा अनावश्यक राजकीय अर्थ नहीं लाता।
- source_word: בֵית אָב
  choice: पितृकुल
  rationale: पितृवंशीय पारिवारिक अथवा कुलगत इकाई को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַשִּׁמְעֹנִי
  choice: शिमोनियों के बीच
  rationale: शिमोन गोत्र के भीतर उसकी कुलगत सदस्यता और नेतृत्व को व्यक्त करता है।
