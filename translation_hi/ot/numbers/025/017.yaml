  yaml_path: translation/ot/numbers/025/017.yaml
  text: Harass the Midianites and strike them down,[a]
translation:
  language: hi
  text: मिद्यानियों से शत्रुता रखो[a] और उन्हें मार गिराओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मिद्यानियों को सताओ।” इब्रानी क्रिया צָרוֹר में किसी के प्रति वैर दिखाने या उससे शत्रु जैसा व्यवहार करने का भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרוֹר
  choice: शत्रुता रखो
  rationale: צרר के काल आदेशात्मक रूप में किसी के प्रति शत्रुता रखने, उसे शत्रु मानकर व्यवहार करने या सताने का भाव हो सकता है। ‘शत्रुता रखो’ मूल के संबंधपरक और विरोधी भाव को स्पष्ट रखता है, पर किसी खास सैन्य युक्ति तक अर्थ को सीमित नहीं करता।
- source_word: הַמִּדְיָנִים
  choice: मिद्यानियों
  rationale: मिद्यान जाति के लोगों के लिए प्रचलित हिन्दी जातिनाम; परसर्ग ‘से’ के कारण तिर्यक रूप प्रयुक्त है।
- source_word: וְהִכִּיתֶם
  choice: और उन्हें मार गिराओ
  rationale: נכה का हिफ़ील रूप प्रहार करने, मार गिराने या पराजित करने का अर्थ दे सकता है। ‘मार गिराओ’ हिंसक और सैन्य बल को बनाए रखता है, पर क्रिया को अनिवार्य रूप से ‘जान से मार डालो’ तक सीमित नहीं करता।
- source_word: אוֹתָם
  choice: उन्हें
  rationale: यह प्रत्यक्ष कर्म सर्वनाम मिद्यानियों की ओर संकेत करता है।
- source_word: אֶת
  choice: '[अलग से अनूदित नहीं]'
  rationale: यह प्रत्यक्ष कर्म चिह्न है; हिन्दी में इसका कोई स्वतंत्र शब्दगत समकक्ष आवश्यक नहीं है।
theological_decisions:
- issue: परमेश्वर की ओर से दिए गए शत्रुता और हिंसक कार्रवाई के आदेश को न नरम करना, न बढ़ाना
  choice: मिद्यानियों से शत्रुता रखो और उन्हें मार गिराओ
  alternative: मिद्यानियों को सताओ और उन पर प्रहार करो
  rationale: इब्रानी पाठ में दो सीधे आदेश हैं—पहला विरोध या शत्रुता का, और दूसरा हिंसक प्रहार का। अनुवाद उनकी कठोरता बनाए रखता है, लेकिन इस पद में न दिए गए धार्मिक औचित्य या ‘सबको मार डालने’ जैसे अधिक विशिष्ट अर्थ नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सीधी और गरिमापूर्ण रखी गई है। ‘शत्रुता रखो’ सामान्य पाठक के लिए स्पष्ट है और मूल क्रिया की अर्थ-व्याप्ति को ‘सताओ’ जैसे अधिक संकीर्ण व्यवहार तक सीमित नहीं करता।
