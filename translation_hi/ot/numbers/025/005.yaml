source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה אֶל שֹׁפְטֵ֖י יִשְׂרָאֵ֑ל הִרְגוּ֙ אִ֣ישׁ אֲנָשָׁ֔י/ו הַ/נִּצְמָדִ֖ים לְ/בַ֥עַל פְּעֽוֹר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/005.yaml
  text: And Moses said to the judges of Israel[b][a], “Each of you must kill his men who have joined themselves to Baal Peor.”
translation:
  language: hi
  text: मूसा ने इस्राएल के न्यायियों से कहा, “तुममें से हर एक अपने उन आदमियों को मार डाले[b] जो बाल-पोर[a] से जुड़ गए हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पोर का बाल।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “मारो, हर एक अपने आदमियों को।” अर्थात हर न्यायी अपने अधिकार के अधीन उन पुरुषों को मार डाले जो बाल-पोर से जुड़ गए थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: שֹׁפְטֵי
  choice: न्यायियों
  rationale: यह शब्द इस्राएल में न्यायिक और शासकीय अधिकार रखनेवालों को दर्शाता है; ‘न्यायियों’ इसका सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: הִרְגוּ
  choice: मार डाले
  rationale: बहुवचन आज्ञार्थक क्रिया स्पष्ट रूप से प्राण लेने की आज्ञा देती है। ‘मार डाले’ मूल क्रिया की कठोरता बनाए रखता है, पर ‘मृत्युदंड दे’ जैसी अतिरिक्त न्यायिक व्याख्या नहीं जोड़ता।
- source_word: אִישׁ אֲנָשָׁיו
  choice: तुममें से हर एक अपने ... आदमियों को
  rationale: वितरणात्मक इब्रानी रचना प्रत्येक न्यायी को उसके अधिकार के अधीन संबंधित पुरुषों के विरुद्ध कार्रवाई करने को कहती है। यह हिंदी में अर्थ को स्वाभाविक ढंग से स्पष्ट करती है।
- source_word: הַנִּצְמָדִים
  choice: जो ... से जुड़ गए हैं
  rationale: צמד का निफ़अल कृदंत निकटता से जुड़ने या अपने को संबद्ध करने का भाव देता है। यह चयन स्वैच्छिक धार्मिक संलग्नता बताता है, बिना रूपक को आवश्यकता से अधिक खोलने के।
- source_word: לְבַעַל פְּעוֹר
  choice: पोर के बाल देवता से
  rationale: यह पद पोर से संबद्ध ‘बाल’ को सूचित करता है। हिंदी पाठक के लिए ‘बाल’ के देवता होने को स्पष्ट करते हुए संबंधसूचक रचना मूल वाक्यांश का अर्थ स्वाभाविक रूप से देती है।
theological_decisions:
- issue: आज्ञा में हत्या का स्वरूप
  choice: मूसा की आज्ञा को सीधे तौर पर उन दोषी पुरुषों को मार डालने की आज्ञा के रूप में प्रस्तुत किया गया है।
  alternative: ‘मृत्युदंड दे’ कहकर न्यायिक दंड को प्रमुख बनाना।
  rationale: पद में सीधी आज्ञा है, पर कानूनी प्रक्रिया या अनुष्ठानिक अर्थ स्पष्ट नहीं किया गया। इसलिए कठोरता को बनाए रखते हुए अतिरिक्त धार्मिक या विधिक व्याख्या नहीं जोड़ी गई।
- issue: אִישׁ אֲנָשָׁיו में पुरुषवाचक संदर्भ
  choice: ‘हर एक अपने ... आदमियों को’ द्वारा पुरुषवाचक संदर्भ बनाए रखा गया है।
  alternative: ‘हर व्यक्ति अपने अधीन लोगों को’ जैसा लिंग-निरपेक्ष अनुवाद।
  rationale: इब्रानी पद स्पष्टतः पुरुषवाचक है और प्रसंग में अपराधी पुरुषों की ओर संकेत करता है; इसलिए इसे लिंग-निरपेक्ष नहीं बनाया गया।
- issue: בעל की पहचान
  choice: ‘बाल देवता’ कहकर इसे पोर से संबद्ध देवता के रूप में स्पष्ट किया गया है।
  alternative: केवल ‘बाल-पोर’ नाम लिखना।
  rationale: ‘बाल’ हिंदी में सामान्य पाठक के लिए भ्रामक हो सकता है; ‘देवता’ जोड़ना निहित सांस्कृतिक अर्थ को स्पष्ट करता है, कोई सांप्रदायिक व्याख्या नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गंभीर, स्पष्ट और सहज शैली रखी गई है। ‘तब’ कथानक के क्रम को स्वाभाविक बनाता है; आज्ञा की कठोरता को नरम नहीं किया गया।
