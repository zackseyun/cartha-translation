source:
  edition: WLC
  text: פִּֽינְחָ֨ס בֶּן אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן הֵשִׁ֤יב אֶת חֲמָתִ/י֙ מֵ/עַ֣ל בְּנֵֽי יִשְׂרָאֵ֔ל בְּ/קַנְא֥/וֹ אֶת קִנְאָתִ֖/י בְּ/תוֹכָ֑/ם וְ/לֹא כִלִּ֥יתִי אֶת בְּנֵֽי יִשְׂרָאֵ֖ל בְּ/קִנְאָתִֽ/י־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/011.yaml
  text: Phinehas son of Eleazar[a], son of Aaron the priest, has turned back my wrath from upon the sons of Israel by being jealous with my jealousy among them, so that I did not consume the sons of Israel in my jealousy.
translation:
  language: hi
  text: पीनहास—एलीआज़र का पुत्र, हारून याजक का पोता—ने इस्राएलियों के बीच मेरे ही जैसा जोश दिखाकर[a] मेरा प्रकोप इस्राएलियों पर से हटा दिया, जिसके कारण मैंने अपने जोश में इस्राएलियों का सर्वनाश नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी जलन के अनुरूप जलन रखते हुए … अपनी जलन में।” इब्रानी में पीनहास की कार्रवाई और परमेश्वर की प्रतिक्रिया के लिए एक ही मूल से बने शब्द आए हैं।
    reason: कנא / קִנְאָה के लिए ‘जोश’ और ‘जलन’ दोनों अर्थ-छायाएँ संभव हैं; पादटिप्पणी मूल पाठ की सजातीय पुनरुक्ति तथा वैकल्पिक शाब्दिकता को दर्शाती है।
lexical_decisions:
- source_word: הֵשִׁיב אֶת־חֲמָתִי מֵעַל
  choice: मेरा प्रकोप उन पर से हटा दिया
  rationale: हिफ़ील रूप यहाँ प्रकोप को लौटाने या टाल देने का भाव देता है। ‘उन पर से’ מֵעַל की उस स्थानिक छवि को स्वाभाविक हिन्दी में बनाए रखता है जिसमें प्रकोप इस्राएल पर था।
- source_word: בֶּן אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: एलीआज़र का पुत्र और हारून याजक का पोता
  rationale: वंशावली में दो बार בֶּן प्रयुक्त है, पर हिन्दी में पीनहास का हारून से वास्तविक संबंध स्पष्ट करने के लिए दूसरी कड़ी को ‘पोता’ कहना अधिक स्वाभाविक और तथ्यतः सटीक है। ‘हारून याजक’ उपाधि को भी बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह स्थापित सामुदायिक नाम स्त्री-पुरुष सहित समूचे इस्राएली समुदाय को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; शाब्दिक ‘इस्राएल के पुत्र’ यहाँ अनावश्यक रूप से केवल पुरुषों का बोध करा सकता है।
- source_word: בְּקַנְאוֹ אֶת־קִנְאָתִי
  choice: मेरे ही जोश से जोशीला होकर
  rationale: क्रिया और संज्ञा के एक ही मूल קנא से होने को ‘जोश/जोशीला’ की पुनरुक्ति द्वारा दिखाया गया है। इस प्रसंग में यह अभिव्यक्ति परमेश्वर की अनन्य निष्ठा के लिए पीनहास की तीव्र तत्परता बताती है।
- source_word: בְּתוֹכָם
  choice: इस्राएलियों के बीच
  rationale: यह समुदाय के भीतर पीनहास की कार्रवाई का स्थान स्पष्ट और स्वाभाविक आधुनिक हिन्दी में बताता है।
- source_word: וְלֹא כִלִּיתִי
  choice: इसलिए मैंने ... सर्वनाश नहीं किया
  rationale: Piel रूप כּלה यहाँ पूरी तरह समाप्त या नष्ट कर देने का प्रबल अर्थ रखता है। ‘सर्वनाश’ उस पूर्णता को संक्षेप और गरिमा के साथ व्यक्त करता है; वाक्य-संबंध में וְ को परिणामसूचक ‘इसलिए’ किया गया है।
- source_word: בְּקִנְאָתִי
  choice: अपने जोश में
  rationale: पहले आए קִנְאָה के साथ एकरूपता बनाए रखी गई है, ताकि पीनहास की कार्रवाई और परमेश्वर की प्रतिक्रिया के बीच मूल पाठ का शब्द-संबंध दिखाई दे।
theological_decisions:
- issue: קנא / קִנְאָה को ‘जोश’ या ‘जलन’ के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘जोश/जोशीला’
  alternative: ‘जलन रखकर/अपनी जलन में’
  rationale: हिन्दी में ‘ईर्ष्या’ या ‘जलन’ प्रायः संकीर्ण और पापपूर्ण द्वेष का अर्थ देती है, जबकि यहाँ परमेश्वर की अनन्य वाचा-निष्ठा और उसके अनुरूप पीनहास की तीव्र कार्रवाई अभिप्रेत है। ‘जोश’ प्रसंगगत अर्थ को अधिक सहजता से देता है; वैकल्पिक ‘जलन’ और मूल के सजातीय रूपों की सूचना पादटिप्पणी में सुरक्षित है।
- issue: בֶּן אַהֲרֹן का संबंध
  choice: हारून का ‘पोता’
  alternative: हारून का ‘पुत्र’
  rationale: इब्रानी वंशावली में בֶּן दूर के पुरुष वंशज के लिए भी आता है। चूँकि एलीआज़र मध्यवर्ती पीढ़ी के रूप में स्पष्ट है, हिन्दी में ‘पोता’ संबंध को बिना विरोधाभास के सही रूप से बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘प्रकोप’, ‘जोश’ और ‘सर्वनाश’ तीव्रता को बनाए रखते हैं, जबकि पुरातन ‘जलजलाहट’ जैसे रूपों से बचा गया है।
