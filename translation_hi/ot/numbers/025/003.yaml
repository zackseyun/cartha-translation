  text: So Israel joined itself to Baal of Peor[a], and the anger of Yahweh burned against Israel.
translation:
  language: hi
  text: इस प्रकार इस्राएल बाल-पेओर से जुड़ गया[a], और इस्राएल पर याहवे का क्रोध भड़क उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाल-पेओर से लिपट गया”; अथवा “बाल-पेओर के जुए में जुत गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּצָּמֶד
  choice: से जुड़ गया
  rationale: निफ़अल रूप निकटता से जुड़ने या अपने को संबद्ध कर लेने का भाव देता है। यह चयन स्वाभाविक आधुनिक हिन्दी में मूर्तिपूजक लगाव को व्यक्त करता है, जबकि अधिक चित्रात्मक ‘जुए में जुत गया’ को पादटिप्पणी में रखा गया है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: राष्ट्र के नाम का हिन्दी में प्रचलित बाइबलीय रूप। सामूहिक एकवचन के कारण ‘जुड़ गया’ रखा गया है।
- source_word: לְבַעַל פְּעוֹר
  choice: पोर के बाल से
  rationale: निर्माण-संबंध को स्पष्ट रखते हुए बाल देवता के पोर से स्थानीय संबंध को व्यक्त करता है। ‘बाल-पोर’ भी संभव नामरूप है, इसलिए उसे पादटिप्पणी में दिया गया है।
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: इब्रानी ताप/जलने की रूपकात्मक तीव्रता को स्वाभाविक और वर्तमान हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय व्यक्तिगत ईश-नाम का हिन्दी पाठकों में स्थापित सीधा लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: क्रोध-सूचक मुहावरे के साथ ב क्रोध के लक्ष्य को चिह्नित करता है; हिन्दी में ‘पर’ स्वाभाविक है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश-नाम प्रत्यक्ष रूप से है। हिन्दी की व्यापक बाइबलीय परंपरा में पहचाने जाने वाले ‘यहोवा’ को रखा गया है, न कि ‘प्रभु’ जैसी प्रतिस्थापक उपाधि को।
- issue: צמד में निहित संबंध की प्रकृति
  choice: से जुड़ गया
  alternative: के जुए में जुत गया
  rationale: मूल क्रिया दृढ़ संबद्धता बताती है, पर अपने आप में ‘वाचा’ या किसी विशिष्ट अनुष्ठान का स्पष्ट उल्लेख नहीं करती। मुख्य पाठ व्यापक अर्थ को बचाता है और चित्रात्मक विकल्प पादटिप्पणी में देता है।
