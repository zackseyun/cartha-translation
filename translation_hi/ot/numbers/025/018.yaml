  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज रूप अपनाया गया है। लंबे इब्रानी वाक्य को स्पष्टता के लिए तीन वाक्यों में बाँटा गया है। ‘धूर्त चालों’ और ‘छल’ से सजातीय शब्दों का संबंध अर्थतः बनाए रखा गया है।
