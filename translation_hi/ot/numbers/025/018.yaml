base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/018.yaml
  text: For they are hostile to you through their schemes[a], by which they deceived you in the matter of Peor and in the matter of Cozbi, the daughter of a leader of Midian, their sister[c][b], who was struck down on the day of the plague because of the matter of Peor.
translation:
  language: hi
  text: क्योंकि वे अपनी धूर्त चालों से तुम्हारे प्रति शत्रुता रखते हैं। उन्हीं चालों से उन्होंने पोर के मामले में[a] और मिद्यान के एक प्रधान की बेटी कोज़बी के मामले में तुम्हारे साथ छल किया। वह उनकी बहन[b] थी, जिस पर पोर के मामले के कारण हुई महामारी के दिन प्रहार किया गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पोर से आशय इस अध्याय में पहले वर्णित बाल-पोर की घटना से है।
    reason: cross_reference
  - marker: b
    text: मूल इब्रानी में ‘उनकी बहन’; इसका अर्थ उनके अपने लोगों या कुल की स्त्री भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹרְרִים
  choice: तुम्हारे प्रति शत्रुता रखते हैं
  rationale: यह कृदन्त निरंतर विरोध या शत्रुता को व्यक्त करता है; यह अनुवाद अनावश्यक रूप से केवल सैनिक वैर का अर्थ नहीं थोपता।
- source_word: בְּנִכְלֵיהֶם
  choice: अपनी धूर्त चालों से
  rationale: संज्ञा कपटपूर्ण युक्तियों को और ב साधन को दर्शाता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נִכְלוּ
  choice: तुम्हारे साथ छल किया
  rationale: यह पूर्ववर्ती संज्ञा का सजातीय क्रिया-रूप है और इस्राएल के विरुद्ध कपटपूर्ण व्यवहार को व्यक्त करता है।
- source_word: עַל דְּבַר פְּעוֹר
  choice: पोर के मामले में / पोर के मामले के कारण
  rationale: पहली स्थितियों में प्रसंग-संबंधी अर्थ और अंतिम प्रयोग में महामारी के कारण का भाव स्वाभाविक है; दोनों एक ही इब्रानी मुहावरे की प्रसंगानुसार छायाएँ हैं।
- source_word: כָּזְבִּי
  choice: कोज़बी
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: בַת נְשִׂיא מִדְיָן
  choice: मिद्यान के एक प्रधान की बेटी
  rationale: נשיא किसी अगुवे या मुखिया को दर्शाता है; ‘प्रधान’ सम्मानित पद को व्यक्त करता है, पर राजवंशीय अर्थ नहीं जोड़ता।
- source_word: אֲחֹתָם
  choice: उनकी बहन
  rationale: शाब्दिक पारिवारिक भाषा सुरक्षित रखी गई है; संभव व्यापक जातीय या कुलगत अर्थ पादटिप्पणी में बताया गया है।
- source_word: הַמֻּכָּה
  choice: मार डाली गई थी
  rationale: נכה का निष्क्रिय कृदन्त ‘प्रहार करके मारने’ को दर्शाता है; हिन्दी में यह मृत्यु का प्रसंग स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְיוֹם הַמַּגֵּפָה
  choice: महामारी के दिन
  rationale: ठोस कालवाचक अभिव्यक्ति को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions:
- issue: ‘पोर’ का संकेत
  choice: मुख्य पाठ में केवल ‘पोर’ रखा गया
  alternative: ‘बाल-पोर’ लिखना
  rationale: इब्रानी पाठ में यहाँ केवल פְּעוֹר है। ‘बाल-पोर’ स्पष्टीकरण देता, पर मूल से अधिक कहता; पादटिप्पणी प्रसंग स्पष्ट करती है।
- issue: दोहराए गए עַל דְּבַר פְּעוֹר का बल
  choice: पहले प्रयोग में ‘के मामले में’ और अंतिम प्रयोग में ‘के मामले के कारण’
  alternative: दोनों स्थानों पर बिल्कुल समान वाक्यांश
  rationale: पहले प्रयोग में विषय या प्रसंग का और अंतिम प्रयोग में महामारी के कारण का भाव प्रमुख है; यह भिन्नता मूल मुहावरे की प्रसंगगत अर्थ-छाया को दर्शाती है।
- issue: אֲחֹתָם में संबंध
  choice: ‘उनकी बहन’
  alternative: ‘उनके कुल की स्त्री’ या ‘उनकी जाति की स्त्री’
  rationale: मूल की वास्तविक अस्पष्टता और पारिवारिक भाषा को बनाए रखा गया है; संभावित सामुदायिक अर्थ पादटिप्पणी में दिया गया है।
