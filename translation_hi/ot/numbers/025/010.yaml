    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है, इसलिए ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। דּבר के इस वाक्य-सूत्र में ‘कहा’ आधुनिक हिन्दी में स्वाभाविक है और अगले पद में आने वाली प्रत्यक्ष वाणी की भूमिका बाँधता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुराक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: इब्रानी में אֶל भाषण के संबोधित व्यक्ति को चिह्नित करता है। हिन्दी में ‘मूसा से कहा’ इसका स्वाभाविक समतुल्य है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह क्रियारूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में ‘कहा,’ यही कार्य स्वाभाविक रूप से करता है; अलग से ‘यह कहते हुए’ रखने पर अनावश्यक पुनरुक्ति होती।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम יהוה का प्रयोग करता है। ‘यहवे’ नाम को नाम ही रहने देता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता; ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। इब्रानी कथात्मक क्रम को ‘तब’ से व्यक्त किया गया है। לֵאמֹר का कार्य हिन्दी विराम-चिह्न और ‘कहा’ में समाहित है, जिससे अर्थ सुरक्षित रहते हुए कृत्रिम पुनरुक्ति से बचा गया है।
