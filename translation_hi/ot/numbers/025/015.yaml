- source_word: הַמֻּכָּה
  choice: जिसे मार डाला गया था
  rationale: נכה के निष्क्रिय कृदंत को प्रसंगानुसार मृत्यु का बोध कराने वाले स्वाभाविक हिंदी पदबंध से व्यक्त किया गया है।
- source_word: הַמִּדְיָנִית
  choice: मिद्यानी स्त्री
  rationale: जातीय विशेषण को स्त्री के साथ स्पष्ट और प्रचलित हिंदी रूप में रखा गया है।
- source_word: כָּזְבִּי
  choice: कोज़बी
  rationale: इब्रानी नाम का देवनागरी लिप्यंतरण।
- source_word: בַת צ֑וּר
  choice: सूर की बेटी
  rationale: वंश-संबंध बताने वाली रचना का सीधा और स्वाभाविक हिंदी अनुवाद।
- source_word: רֹאשׁ
  choice: प्रधान
  rationale: यहाँ רֹאשׁ नेतृत्व-पद का सूचक है; 'प्रधान' हिंदी में अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: אֻמּוֹת
  choice: कुल-समूहों
  rationale: शब्द का अर्थ 'जातियाँ/लोग' भी हो सकता है, पर בֵּית אָב के वंश-संबंधी संदर्भ में रिश्तेदारी पर आधारित समूह अभिप्रेत जान पड़ते हैं; अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית אָב
  choice: पितृकुल
  rationale: शाब्दिक 'पिता का घर' एक तकनीकी वंश-सामाजिक पद है; 'पितृकुल' आधुनिक हिंदी में संक्षिप्त और बोधगम्य समतुल्य है।
- source_word: בְּמִדְיָן
  choice: मिद्यान में
  rationale: पूर्वसर्ग का स्वाभाविक स्थानवाचक अनुवाद।
- source_word: הוּא
  choice: था
  rationale: सर्वनाम सूर को पुनः ग्रहण कर विधेयात्मक कार्य करता है; हिंदी में अलग वाक्य और 'था' से संदर्भ स्पष्ट किया गया है।
