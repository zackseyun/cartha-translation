base_translation:
  language: en
  yaml_path: translation/ot/numbers/025/015.yaml
  text: And the name of the Midianite woman who was struck down was Cozbi daughter of Zur[b][a], who was head of the clans of a father's house in Midian.
translation:
  language: hi
  text: और जिस मिद्यानी स्त्री को मार गिराया गया था, उसका नाम कोज़बी था। वह सूर की बेटी थी। सूर मिद्यान में एक पितृकुल[b] के कुल-समूहों[a] का प्रधान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों का।” इब्रानी शब्द का अर्थ “लोग” या “जातियाँ” भी हो सकता है; यहाँ वंश-संबंधी प्रसंग में यह कुल-समूहों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “पिता का घर”; यह विस्तृत परिवार या पूर्वज से जुड़े घराने के लिए प्रयुक्त वंश-संबंधी पद है।
    reason: cultural_note
lexical_decisions:
