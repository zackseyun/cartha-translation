  text: यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर … कहा
  rationale: वाव-क्रमिक रूप कथा में अगली घटना आरम्भ करता है। हिन्दी में ‘फिर … कहा’ सूत्रबद्ध दिव्य संबोधन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: אֶל
  choice: से
  rationale: ‘किसी से कहना’ आधुनिक हिन्दी में संबोधित व्यक्ति बताने की स्वाभाविक रचना है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का मानक और व्यापक रूप से समझा जाने वाला हिन्दी बाइबलीय रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी कथन-परिचय सूत्र का शब्दशः दोहराव हिन्दी में अस्वाभाविक होता; मुख्य क्रिया के साथ मिलाकर ‘कहा’ अगले प्रत्यक्ष कथन का सहज परिचय देता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘यहोवा’ हिन्दी पाठकों में स्थापित नाम-रूप है और इसे उपाधि में बदलने से बचाता है; ‘याहवे’ उच्चारण की एक अन्य विद्वतापूर्ण पुनर्रचना है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। संक्षिप्त इब्रानी कथन-सूत्र को हिन्दी की स्वाभाविक वाक्य-रचना में रखा गया है।
