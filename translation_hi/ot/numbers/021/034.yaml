id: NUM.21.34
reference: Numbers 21:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֤ה אֶל מֹשֶׁה֙ אַל תִּירָ֣א אֹת֔/וֹ כִּ֣י בְ/יָדְ/ךָ֞ נָתַ֧תִּי אֹת֛/וֹ וְ/אֶת כָּל עַמּ֖/וֹ וְ/אֶת אַרְצ֑/וֹ וְ/עָשִׂ֣יתָ לּ֔/וֹ כַּ/אֲשֶׁ֣ר עָשִׂ֗יתָ לְ/סִיחֹן֙ מֶ֣לֶךְ הָֽ/אֱמֹרִ֔י אֲשֶׁ֥ר יוֹשֵׁ֖ב בְּ/חֶשְׁבּֽוֹן־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/034.yaml
  text: And Yahweh said to Moses[a], “Do not fear him, for I have given him into your hand, along with all his people and his land. You shall do to him as you did to Sihon king of the Amorites[b], who lived in Heshbon.”
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा, “उससे मत डर, क्योंकि मैंने उसे, उसकी सारी प्रजा और उसके देश को तेरे हाथ में दे दिया है। तू उसके साथ वैसा ही करेगा जैसा तूने एमोरियों के राजा सीहोन के साथ किया था, जो हेशबोन में रहता था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी वाचा-नाम को सामान्य और व्यापक रूप से पहचाने जानेवाले हिन्दी रूप ‘यहोवा’ में रखा गया है, न कि उपाधि ‘प्रभु’ से बदला गया है।
- source_word: אַל תִּירָא אֹתוֹ
  choice: उससे मत डर
  rationale: यह निषेध आधुनिक हिन्दी में स्वाभाविक है और इब्रानी क्रिया ירא के सीधे अर्थ को बनाए रखता है।
- source_word: בְיָדְךָ נָתַתִּי אֹתוֹ
  choice: मैंने उसे ... तेरे हाथ में कर दिया है
  rationale: ‘हाथ में करना’ किसी को दूसरे के अधिकार में सौंपने का बोध देता है और इब्रानी बिंब को भी सुरक्षित रखता है; पूर्ण क्रिया की निश्चितता को ‘कर दिया है’ व्यक्त करता है।
- source_word: וְאֶת כָּל עַמּוֹ וְאֶת אַרְצוֹ
  choice: उसकी सारी प्रजा और उसके देश को
  rationale: तीनों कर्म—राजा, उसकी प्रजा और उसका देश—स्पष्ट रखे गए हैं; עַם के राजकीय-सामूहिक संदर्भ में ‘प्रजा’ स्वाभाविक है।
- source_word: וְעָשִׂיתָ לּוֹ כַּאֲשֶׁר עָשִׂיתָ
  choice: तू उसके साथ वैसा ही करेगा जैसा तूने ... के साथ किया था
  rationale: तुलनात्मक संरचना को स्वाभाविक हिन्दी में रखते हुए आगामी निश्चित कार्रवाई और पिछली कार्रवाई के बीच संबंध स्पष्ट किया गया है।
- source_word: לְסִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा सीहोन
  rationale: इब्रानी पदबंध का अर्थ स्पष्ट और प्रचलित हिन्दी बाइबलीय नाम-रूपों में दिया गया है।
- source_word: אֲשֶׁר יוֹשֵׁב בְּחֶשְׁבּוֹן
  choice: हेशबोन में रहनेवाले
  rationale: ישב का कृदन्त यहाँ निवास का वर्णन करता है; ‘रहनेवाले’ आधुनिक हिन्दी में सहज है और वर्तमान कृदन्त की वर्णनात्मक शक्ति बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय निजी नाम प्रत्यक्ष है। उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया; ‘यहोवा’ सामान्य हिन्दी पाठकों में व्यापक रूप से पहचाना जानेवाला पारंपरिक रूप है।
- issue: नָתַתִּי के पूर्ण रूप की प्रतिज्ञात्मक निश्चितता
  choice: कर दिया है
  alternative: कर दूँगा
  rationale: इब्रानी पूर्ण क्रिया भविष्य की विजय को परमेश्वर के कथन में निश्चित/संपन्न रूप में प्रस्तुत करती है। भविष्यकाल करने से यह भाषिक तनाव घट जाता, इसलिए पूर्णतासूचक रूप रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूसा को एकवचन निकट संबोधन के कारण ‘तू/तेरे’ प्रयोग किए गए हैं। इब्रानी मुहावरे ‘तेरे हाथ में’ को अर्थगम्य होने के कारण मुख्य पाठ में सुरक्षित रखा गया है।
