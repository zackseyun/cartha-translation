  text: כִּי אֵשׁ֙ יָֽצְאָ֣ה מֵֽ/חֶשְׁבּ֔וֹן לֶהָבָ֖ה מִ/קִּרְיַ֣ת סִיחֹ֑ן אָֽכְלָה֙ עָ֣ר מוֹאָ֔ב בַּעֲלֵ֖י בָּמ֥וֹת אַרְנֹֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/028.yaml
  text: For fire has gone out from Heshbon[a], a flame from the city of Sihon; it has consumed Ar of Moab[b], the lords of the high places of the Arnon.
translation:
  language: hi
  text: 'क्योंकि हेशबोन से आग निकली,

    सीहोन के नगर से एक ज्वाला;

    उसने मोआब के आर को

    और अर्नोन के ऊँचे स्थानों के स्वामियों[a] को भस्म कर दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्नोन की ऊँचाइयों के स्वामियों को।” इब्रानी पद ‘ऊँचे स्थानों’ अथवा अर्नोन क्षेत्र की ‘ऊँचाइयों’ का संकेत कर सकता है। ‘स्वामियों’ के लिए ‘अधिकारियों’ या ‘मालिकों’ का अर्थ भी संभव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले काव्य-वचन का कारण या स्पष्टीकरण प्रस्तुत करता है; इसलिए कारणसूचक अर्थ रखा गया है।
- source_word: אֵשׁ יָצְאָה
  choice: आग निकली
  rationale: आग के किसी स्थान से निकलने की सजीव काव्यात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֵחֶשְׁבּוֹן
  choice: हेशबोन से
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: לֶהָבָה
  choice: एक ज्वाला
  rationale: पहली पंक्ति की ‘आग’ के समानांतर ठोस अग्नि-बिंब को सुरक्षित रखता है।
- source_word: מִקִּרְיַת סִיחֹן
  choice: सीहोन के नगर से
  rationale: קִרְיָה को सामान्य संज्ञा ‘नगर’ और संबंधवाचक रचना को सहज हिन्दी में व्यक्त किया गया है।
- source_word: אָכְלָה
  choice: भस्म कर दिया
  rationale: आग द्वारा ‘खा जाने’ के इब्रानी रूपक का विनाशकारी आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָר מוֹאָב
  choice: मोआब के आर को
  rationale: עָר को यहाँ ज्ञात स्थान-नाम ‘आर’ माना गया है, न कि सामान्य संज्ञा ‘नगर’।
- source_word: בַּעֲלֵי
  choice: स्वामियों
  rationale: बहुवचन संबंध-रूप का सीधा अर्थ ‘स्वामी/अधिकारी’ है; ‘निवासियों’ जैसा व्याख्यात्मक अर्थ पाठ में नहीं जोड़ा गया।
- source_word: בָּמוֹת אַרְנֹן
  choice: अर्नोन के ऊँचे स्थानों
  rationale: בָּמוֹת में धार्मिक ‘ऊँचे स्थान’ और भौगोलिक ‘ऊँचाइयाँ’ दोनों की संभावना है; मुख्य पाठ में प्रचलित शब्दार्थ रखा और विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בַּעֲלֵי בָּמוֹת אַרְנֹן का आशय
  choice: अर्नोन के ऊँचे स्थानों के स्वामियों
  alternative: अर्नोन की ऊँचाइयों के निवासियों/अधिकारियों
  rationale: शाब्दिक संबंध-रचना और काव्यात्मक गरिमा को बनाए रखते हुए किसी विशिष्ट उपासना-पद्धति या जनसमूह की पहचान को निश्चित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी; समानांतर पंक्तियों और अग्नि-बिंब को बनाए रखा गया है।
