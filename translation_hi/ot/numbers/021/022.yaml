source:
  edition: WLC
  text: אֶעְבְּרָ֣ה בְ/אַרְצֶ֗/ךָ לֹ֤א נִטֶּה֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר בְּ/דֶ֤רֶךְ הַ/מֶּ֨לֶךְ֙ נֵלֵ֔ךְ עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבֻלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/022.yaml
  text: Let me pass through your land. We will not turn aside into field or vineyard[a], and we will not drink water from a well. We will go by the king’s road until we have passed through your territory.
translation:
  language: hi
  text: “कृपया मुझे अपने देश से होकर जाने दीजिए। हम न तो खेतों की ओर मुड़ेंगे, न अंगूर के बागों की ओर; और न किसी कुएँ का पानी पिएँगे। हम राजा के मार्ग[a] पर ही चलते जाएँगे, जब तक आपकी सीमा के पार न निकल जाएँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजमार्ग।”
    reason: דרך המלך के अधिक कार्यात्मक अनुवाद को दर्शाने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: אֶעְבְּרָה
  choice: मुझे ... होकर निकल जाने दे
  rationale: प्रथम पुरुष एकवचन के कोहोर्टेटिव रूप को निवेदन के रूप में रखा गया है; ‘निकल जाने’ से किसी भूभाग में प्रवेश करके उसके पार जाने का आशय स्पष्ट होता है।
- source_word: בְאַרְצְךָ
  choice: अपने देश से
  rationale: אֶרֶץ यहाँ राजा के अधीन भूभाग को दर्शाता है; आधुनिक हिन्दी में ‘देश’ इस राजनीतिक-भौगोलिक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: לֹא נִטֶּה
  choice: हम ... की ओर मुड़ेंगे
  rationale: यात्रा के प्रसंग में נטה निर्धारित मार्ग से हटकर दूसरी ओर मुड़ने को व्यक्त करता है।
- source_word: בְּשָׂדֶה וּבְכֶרֶם
  choice: किसी खेत या अंगूर के बाग की ओर
  rationale: एकवचन संज्ञाएँ यहाँ सामान्य अथवा वितरणात्मक अर्थ रखती हैं; ‘किसी’ और ‘या’ स्वाभाविक हिन्दी में आशय स्पष्ट करते हैं। כרם को केवल ‘बाग’ न कहकर ‘अंगूर का बाग’ कहा गया है।
- source_word: לֹא נִשְׁתֶּה מֵי בְאֵר
  choice: न किसी कुएँ का पानी पिएँगे
  rationale: इब्रानी संरचना का अर्थ स्थानीय कुएँ के जल का उपभोग न करना है; यह हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: בְּדֶרֶךְ הַמֶּלֶךְ
  choice: राजा के मार्ग पर
  rationale: शाब्दिक अर्थ ‘राजा का मार्ग’ है और संदर्भ में यह मुख्य राजकीय सड़क को सूचित करता है। ‘मार्ग’ गरिमापूर्ण होने के साथ आज भी बोधगम्य है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: נֵלֵךְ
  choice: हम ... चलते जाएँगे
  rationale: הלך का सामान्य गतिशील अर्थ रखा गया है; ‘चलते जाएँगे’ मार्ग पर निरंतर आगे बढ़ने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבֻלֶךָ
  choice: जब तक तेरी सीमा के पार न निकल जाएँ
  rationale: גְּבוּל का मूल अर्थ सीमा है। ‘सीमा के पार निकलना’ पूरे भूभाग से होकर बाहर पहुँचने का प्रसंगगत आशय स्पष्ट करता है, बिना संज्ञा को सीधे ‘प्रदेश’ में बदलने के।
