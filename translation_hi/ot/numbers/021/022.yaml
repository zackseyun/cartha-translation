translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। राजा को संबोधित मूल इब्रानी के एकवचन रूप के अनुरूप ‘दे/तेरी’ रखा गया है। वक्ता के एकवचन निवेदन (‘मुझे’) और उसके बाद समुदाय की बहुवचन प्रतिज्ञाओं (‘हम’) का अंतर सुरक्षित रखा गया है। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
