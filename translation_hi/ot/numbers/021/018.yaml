  text: בְּאֵ֞ר חֲפָר֣וּ/הָ שָׂרִ֗ים כָּר֨וּ/הָ֙ נְדִיבֵ֣י הָ/עָ֔ם בִּ/מְחֹקֵ֖ק בְּ/מִשְׁעֲנֹתָ֑/ם וּ/מִ/מִּדְבָּ֖ר מַתָּנָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/018.yaml
  text: the well that the princes dug[a], that the nobles of the people hollowed out with the ruler’s staff, with their staffs[b]. And from the wilderness they went to Mattanah.
translation:
  language: hi
  text: वह कुआँ, जिसे प्रधानों ने खोदा, जिसे प्रजा के कुलीनों ने शासक के राजदंड[a] से और अपनी लाठियों से खोदा। फिर वे मरुभूमि से मत्ताना गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विधिदाता के द्वारा”; इब्रानी शब्द का अर्थ शासक अथवा विधिदाता भी हो सकता है, हालाँकि यहाँ राजदंड का अर्थ अधिक संभावित है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में संक्षेप में “और मरुभूमि से मत्ताना” है; यात्रा-वृत्तांत के अनुसार आशय संभवतः “मरुभूमि से मत्ताना गए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּאֵר
  choice: वह कुआँ
  rationale: पिछले पद में गाए गए विशिष्ट कुएँ का उल्लेख है; इसलिए हिन्दी में संकेतवाचक प्रयोग संदर्भ को स्वाभाविक बनाता है।
- source_word: חֲפָרוּהָ
  choice: खोदा
  rationale: חפר का सामान्य अर्थ ‘खोदना’ है और स्त्रीलिंग कर्म-प्रत्यय कुएँ की ओर संकेत करता है।
- source_word: שָׂרִים
  choice: प्रधानों
  rationale: यहाँ उच्च पद वाले अगुओं का अर्थ है; ‘प्रधान’ काव्यात्मक गरिमा और सामाजिक पद दोनों व्यक्त करता है।
- source_word: כָּרוּהָ
  choice: खोद निकाला
  rationale: כרה भी खोदने का बोध देता है; ‘खोद निकाला’ समानांतर पंक्ति में हल्का शब्दगत भेद रखते हुए कुआँ तैयार करने का अर्थ व्यक्त करता है।
- source_word: נְדִיבֵי הָעָם
  choice: प्रजा के कुलीनों
  rationale: שָׂרִים के समानांतर यहाँ प्रतिष्ठित अथवा उच्च पद वाले लोगों का सामाजिक अर्थ सबसे उपयुक्त है।
- source_word: בִּמְחֹקֵק
  choice: शासक के राजदंड से
  rationale: מְחֹקֵק शासक, विधिदाता अथवा शासन-दंड को सूचित कर सकता है। ‘अपनी लाठियों से’ के समानांतर होने के कारण उपकरण का अर्थ अधिक संभावित है।
- source_word: בְּמִשְׁעֲנֹתָם
  choice: अपनी लाठियों से
  rationale: מִשְׁעֵנָה सहारे की छड़ी या लाठी है; बहुवचन को सहज आधुनिक हिन्दी में ‘लाठियों’ से व्यक्त किया गया है।
- source_word: וּמִמִּדְבָּר מַתָּנָה
  choice: फिर वे जंगल से मत्ताना गए
  rationale: अगले पदों में यात्रा-पड़ावों की सूची जारी रहती है। इब्रानी में ‘को’ स्पष्ट नहीं है, पर संदर्भ जंगल से मत्ताना की ओर यात्रा सूचित करता है।
theological_decisions:
- issue: בִּמְחֹקֵק का काव्यात्मक और बहुअर्थी प्रयोग
  choice: उपकरण के अर्थ में ‘शासक के राजदंड से’
  alternative: व्यक्ति के अर्थ में ‘विधिदाता के द्वारा’
  rationale: इसके तुरंत बाद ‘अपनी लाठियों से’ आता है, इसलिए समानांतर रचना उपकरण वाले अर्थ का समर्थन करती है; फिर भी व्यक्ति वाला अर्थ पाठगत रूप से संभव है और पादटिप्पणी में रखा गया है।
- issue: וּמִמִּדְבָּר מַתָּנָה का संबंध
  choice: 'यात्रा का संक्रमण: ‘जंगल से मत्ताना गए’'
  alternative: 'खंडित या नामसूचक वाक्यांश: ‘और जंगल से, मत्ताना’'
  rationale: गिनती 21:18–20 में लगातार यात्रा-पड़ाव दिए गए हैं, इसलिए गंतव्य का अर्थ संदर्भानुकूल है; इब्रानी की संक्षिप्तता पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और हल्का काव्यात्मक रूप रखा गया है। ‘प्रधान’, ‘कुलीन’ और ‘राजदंड’ पद-सामाजिक समानांतरता बनाए रखते हैं; यात्रा-वाक्य को सामान्य पाठक के लिए पूर्ण किया गया है, जबकि मूल की संक्षिप्तता पादटिप्पणी में सुरक्षित है।
