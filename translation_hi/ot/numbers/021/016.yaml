  edition: WLC
  text: וּ/מִ/שָּׁ֖ם בְּאֵ֑רָ/ה הִ֣וא הַ/בְּאֵ֗ר אֲשֶׁ֨ר אָמַ֤ר יְהוָה֙ לְ/מֹשֶׁ֔ה אֱסֹף֙ אֶת הָ/עָ֔ם וְ/אֶתְּנָ֥ה לָ/הֶ֖ם מָֽיִם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/016.yaml
  text: And from there they went to Beer[a]. That is the well about which Yahweh said to Moses, “Gather the people[b], and I will give them water.”
translation:
  language: hi
  text: फिर वहाँ से वे बेएर गए।[a] यह वह कुआँ है जिसके विषय में याहवे ने मूसा से कहा था, “लोगों को इकट्ठा करो, और मैं उन्हें पानी दूँगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बेएर’ इस स्थान का नाम है; इब्रानी में यह नाम ‘कुआँ’ के शब्द जैसा ही सुनाई देता है।
    reason: cultural_note
  - marker: b
    text: या, “ताकि मैं उन्हें पानी दूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִשָּׁם
  choice: फिर वहाँ से
  rationale: संयोजक और स्थानवाचक पद यात्रा-वृत्तांत की अगली कड़ी बताते हैं; आधुनिक हिन्दी में ‘फिर वहाँ से’ स्वाभाविक है।
- source_word: בְּאֵרָה
  choice: वे बेएर गए
  rationale: ‘बेएर’ स्थान-नाम है और दिशासूचक הָ उस ओर गति बताता है। इब्रानी में क्रिया निहित है; हिन्दी में स्पष्टता के लिए ‘वे … गए’ जोड़ा गया है।
- source_word: הִוא הַבְּאֵר
  choice: यह वही कुआँ है
  rationale: यह पहचान कराने वाला वाक्यांश है, जो बेएर स्थान को आगे वर्णित कुएँ से जोड़ता है। ‘वही’ उसके विशिष्ट संदर्भ को सहज हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר אָמַר יְהוָה לְמֹשֶׁה
  choice: जिसके विषय में याहवे ने मूसा से कहा था
  rationale: सम्बन्धवाचक उपवाक्य कुएँ को उसके विषय में कही गई ईश्वरीय बात से जोड़ता है; ‘के विषय में’ मूल सम्बन्ध को बिना अनावश्यक व्याख्या के रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसका निकट लिप्यंतरण रखा गया है।
- source_word: אֱסֹף אֶת־הָעָם
  choice: लोगों को इकट्ठा करो
  rationale: आज्ञार्थक क्रिया का सीधा और आधुनिक हिन्दी रूप; ‘लोग’ यहाँ इस्राएल समुदाय को सामूहिक रूप से दर्शाता है।
- source_word: וְאֶתְּנָה לָהֶם מָיִם
  choice: और मैं उन्हें पानी दूँगा
  rationale: आज्ञा के बाद आया प्रथम-पुरुष cohortative ईश्वरीय संकल्प अथवा अभिप्रेत परिणाम व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक प्रतिज्ञात्मक रूप रखा गया है और वैकल्पिक उद्देश्यात्मक अर्थ पाद-टिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी लिपि में प्रस्तुत करता है।
- issue: וְאֶתְּנָה में संकल्प और उद्देश्य का सम्बन्ध
  choice: और मैं उन्हें पानी दूँगा
  alternative: ताकि मैं उन्हें पानी दूँ
  rationale: cohortative रूप दोनों छायाएँ वहन कर सकता है। मुख्य पाठ में प्रतिज्ञा/संकल्प की स्वाभाविक हिन्दी रखी गई है, जबकि उद्देश्यात्मक सम्भावना को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। यात्रा-वृत्तांत की संक्षिप्तता बनाए रखते हुए इब्रानी में निहित गति-क्रिया को हिन्दी में स्पष्ट किया गया है। ईश्वरीय नाम का लिप्यंतरण ‘याहवे’ किया गया है और cohortative की वास्तविक अर्थगत गुंजाइश पाद-टिप्पणी में सुरक्षित रखी गई है।
