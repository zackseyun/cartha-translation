base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/002.yaml
  text: Then Israel made a vow to Yahweh and said[a], “If you indeed give this people into my hand[b], then I will devote their cities to destruction.”
translation:
  language: hi
  text: तब इस्राएल ने यहोवा से एक मन्नत मानी और कहा, “यदि तू सचमुच इन लोगों को मेरे हाथ में कर दे, तो मैं उनके नगरों को विनाश के लिए समर्पित कर दूँगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके नगरों को पूरी तरह नष्ट कर दूँगा,” अथवा “उनके नगरों को हेरम के अधीन कर दूँगा।” हिब्रू क्रिया का अर्थ किसी वस्तु को अपरिवर्तनीय रूप से विनाश के लिए समर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּדַּר ... נֶדֶר
  choice: एक मन्नत मानी
  rationale: सजातीय हिब्रू रचना ‘मन्नत मानी’ का अर्थ एक औपचारिक और गंभीर प्रतिज्ञा करना है; यह हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: मन्नत जिस परमेश्वर के प्रति बाँधी गई है, उसे स्वाभाविक हिंदी मुहावरे में ‘यहोवा से मन्नत मानी’ कहा गया है; ‘यहोवा’ मूल के व्यक्तिवाचक वाचा-नाम को स्पष्ट रखता है।
- source_word: אִם נָתֹן תִּתֵּן
  choice: यदि तू सचमुच ... कर दे
  rationale: क्रिया के साथ infinitive absolute द्वारा दिए गए बल को ‘सचमुच’ से व्यक्त किया गया है।
- source_word: הָעָם הַזֶּה
  choice: इन लोगों को
  rationale: עָם सामूहिक एकवचन है, पर आधुनिक हिंदी में प्रसंगानुसार ‘इन लोगों’ अधिक स्वाभाविक है और संदर्भित समूह को स्पष्ट करता है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: मूल के ‘हाथ’ वाले अधिकार और विजय के रूपक को बनाए रखा गया है; यह हिंदी में भी सुबोध बाइबलीय अभिव्यक्ति है।
- source_word: וְהַחֲרַמְתִּי
  choice: विनाश के लिए अर्पित कर दूँगा
  rationale: हिफ़ील रूप यहाँ किसी वस्तु को अपरिवर्तनीय रूप से חרם के अधीन, अर्थात विनाश के लिए समर्पित करने का भाव रखता है; केवल ‘नष्ट कर दूँगा’ उसके धार्मिक-व्रतीय आयाम को घटा देता।
- source_word: עָרֵיהֶם
  choice: उनके नगरों को
  rationale: עִיר का सीधा और प्रसंगानुकूल हिंदी रूप ‘नगर’ है।
theological_decisions:
- issue: युद्ध-संबंधी मन्नत में חרם का अर्थ
  choice: उनके नगरों को विनाश के लिए अर्पित कर दूँगा
  alternative: उनके नगरों का पूरी तरह नाश कर दूँगा; उनके नगरों को बहिष्कार के अधीन कर दूँगा
  rationale: चुना हुआ रूप सैन्य विनाश और औपचारिक धार्मिक समर्पण—दोनों आयामों को बनाए रखता है, बिना किसी बाद की धार्मिक व्याख्या या नैतिक समाधान को पाठ में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मन्नत मानी’ और ‘मेरे हाथ में’ सामान्य हिंदी में समझ आने वाली बाइबलीय अभिव्यक्तियाँ हैं। חרם की विशिष्टता मुख्य पाठ में स्पष्ट की गई है और उसका वैकल्पिक तकनीकी रूप पादटिप्पणी में दिया गया है।
