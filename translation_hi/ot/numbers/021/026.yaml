  text: כִּ֣י חֶשְׁבּ֔וֹן עִ֗יר סִיחֹ֛ן מֶ֥לֶךְ הָ/אֱמֹרִ֖י הִ֑וא וְ/ה֣וּא נִלְחַ֗ם בְּ/מֶ֤לֶךְ מוֹאָב֙ הָֽ/רִאשׁ֔וֹן וַ/יִּקַּ֧ח אֶת כָּל אַרְצ֛/וֹ מִ/יָּד֖/וֹ עַד אַרְנֹֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/026.yaml
  text: For Heshbon was the city of Sihon king of the Amorites[a], and he had fought against the former king of Moab and had taken all his land from his hand as far as the Arnon.
translation:
  language: hi
  text: क्योंकि हेशबोन एमोरियों के राजा सीहोन का नगर था; उसने मोआब के पूर्व राजा से युद्ध किया था और अर्नोन तक उस राजा का सारा देश उसके हाथ से ले लिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, उसके अधिकार से; इब्रानी मुहावरे का शाब्दिक अर्थ है ‘उसके हाथ से।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; हिन्दी में ‘क्योंकि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עִיר
  choice: नगर
  rationale: ‘नगर’ राजकीय केंद्र के रूप में हेशबोन के महत्त्व के अनुकूल, सहज और गरिमापूर्ण हिन्दी शब्द है।
- source_word: הִוא
  choice: था
  rationale: इब्रानी में यह क्रियारहित नामवाचक वाक्य है, पर ऐतिहासिक संदर्भ में हिन्दी भूतकाल की अपेक्षा करती है।
- source_word: נִלְחַם
  choice: युद्ध किया था
  rationale: निफ़अल रूप यहाँ किसी के विरुद्ध युद्ध करने को दर्शाता है; पूर्ण भूतकाल बताता है कि यह घटना वर्णित स्थिति से पहले हुई थी।
- source_word: הָרִאשׁוֹן
  choice: पहले के
  rationale: इस संदर्भ में यह मोआब के उस पूर्ववर्ती राजा को दर्शाता है जिससे सीहोन ने युद्ध किया था। ‘पहले के’ मूल के ‘पहला/पूर्व’ अर्थ को बिना अनावश्यक ऐतिहासिक निष्कर्ष के बनाए रखता है।
- source_word: וַיִּקַּח
  choice: छीन लिया था
  rationale: यह केवल प्राप्त करने के बजाय युद्ध द्वारा अधिकार में लेने को व्यक्त करता है और हिन्दी में ‘हाथ से’ वाले मूल मुहावरे के साथ स्वाभाविक है।
- source_word: כָּל אַרְצוֹ
  choice: उसका सारा देश
  rationale: यह मोआब के राजा के अधीन पूरे भूभाग को दर्शाता है; ‘देश’ सामान्य पाठक के लिए स्पष्ट और मूल के निकट है।
- source_word: מִיָּדוֹ
  choice: उसके हाथ से
  rationale: मूल इब्रानी बिंब को सुरक्षित रखता है; यहाँ ‘हाथ’ अधिकार या नियंत्रण का मुहावरा है।
- source_word: עַד אַרְנֹן
  choice: अर्नोन तक
  rationale: यह जीते गए भूभाग की सीमा बताता है और हिन्दी में संक्षिप्त तथा स्वाभाविक है।
