base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/005.yaml
  text: 'And the people spoke against God and against Moses: “Why have you brought us up out of Egypt to die in the wilderness? For there is no bread and no water[a], and we loathe this miserable bread.”'
translation:
  language: hi
  text: और लोगों ने परमेश्वर और मूसा के विरुद्ध कहा, “तुम हमें मिस्र से निकालकर ऊपर क्यों लाए कि हम जंगल में मर जाएँ? यहाँ न तो रोटी है, न पानी, और हमें इस तुच्छ रोटी से घृणा हो गई है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुच्छ रोटी” का अनुवाद “बेकार रोटी” या “घटिया रोटी” भी हो सकता है। इब्रानी विशेषण दुर्लभ है और परमेश्वर द्वारा दिए गए भोजन के प्रति लोगों का तिरस्कार प्रकट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר הָעָם בֵּאלֹהִים וּבְמֹשֶׁה
  choice: लोगों ने परमेश्वर और मूसा के विरुद्ध कहा
  rationale: דבר के साथ ב यहाँ आरोपपूर्ण कथन के कारण विरोधी भाव रखता है। ‘के विरुद्ध कहा’ इस भाव को स्पष्ट करता है, पर ‘निन्दा की’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: हमें मिस्र से निकालकर ऊपर लाए
  rationale: हिफ़ील रूप का मूल अर्थ ‘ऊपर लाना’ है। ‘निकालकर ऊपर लाए’ निर्गमन और दिशात्मक भाव दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לָמוּת בַּמִּדְבָּר
  choice: कि हम जंगल में मर जाएँ
  rationale: यह उद्देश्य अथवा आरोपित परिणाम का भाव व्यक्त करता है। מִדְבָּר के लिए ‘जंगल’ बाइबलीय हिन्दी में निर्जन वनप्रदेश का स्वाभाविक पद है।
- source_word: כִּי אֵין לֶחֶם וְאֵין מַיִם
  choice: यहाँ न तो रोटी है, न पानी
  rationale: לֶחֶם को ‘रोटी’ रखा गया है ताकि अगले खंड में उसी शब्द की पुनरावृत्ति बनी रहे। ‘यहाँ’ प्रसंगगत स्थान को हिन्दी में स्वाभाविक बनाता है।
- source_word: וְנַפְשֵׁנוּ קָצָה
  choice: हमें … से घृणा हो गई है
  rationale: शाब्दिक ‘हमारा प्राण ऊब/घृणा गया है’ हिन्दी में अस्वाभाविक है। यह रूप प्रबल वितृष्णा को सहज ढंग से व्यक्त करता है।
- source_word: בַּלֶּחֶם הַקְּלֹקֵל
  choice: इस तुच्छ रोटी
  rationale: दुर्लभ विशेषण קְלֹקֵל भोजन के प्रति तिरस्कार व्यक्त करता है। ‘तुच्छ’ उस अवमाननापूर्ण भाव को बनाए रखता है; ‘इस’ वर्तमान प्रावधान की ओर संकेत को हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर और मूसा के प्रति लोगों की वाणी का स्वर
  choice: ‘के विरुद्ध कहा’ के रूप में विरोधपूर्ण शिकायत
  alternative: ‘से कहा’ या ‘के विषय में कहा’
  rationale: इसके बाद का आरोप विद्रोही और दोषारोपण करने वाला है; इसलिए तटस्थ अनुवाद प्रसंग के भाव को कम कर देगा।
- issue: प्रदान किए गए भोजन का मूल्यांकन
  choice: लोगों के अपने तिरस्कारपूर्ण कथन के रूप में ‘तुच्छ रोटी’
  alternative: ‘घटिया रोटी’ या ‘बेकार रोटी’
  rationale: पाठ भोजन को वस्तुतः निकृष्ट घोषित नहीं करता, बल्कि लोगों की अपमानजनक शिकायत उद्धृत करता है। ‘तुच्छ’ इस कथनगत तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। वाक्य में आरोपपूर्ण स्वर और ‘रोटी’ की इब्रानी पुनरावृत्ति सुरक्षित रखी गई है। फुटनोट-चिह्न पूरे उद्धरण के बाद रखा गया है क्योंकि वह अंतिम पदबंध की व्याख्या करता है।
