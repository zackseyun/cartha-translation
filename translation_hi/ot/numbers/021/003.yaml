id: NUM.21.3
reference: Numbers 21:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֨ע יְהוָ֜ה בְּ/ק֣וֹל יִשְׂרָאֵ֗ל וַ/יִּתֵּן֙ אֶת הַֽ/כְּנַעֲנִ֔י וַ/יַּחֲרֵ֥ם אֶתְ/הֶ֖ם וְ/אֶת עָרֵי/הֶ֑ם וַ/יִּקְרָ֥א שֵׁם הַ/מָּק֖וֹם חָרְמָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/003.yaml
  text: And Yahweh heard the voice of Israel and gave the Canaanite over to them, and they devoted them and their cities to destruction. So the name of the place was called Hormah.
translation:
  language: hi
  text: याहवे ने इस्राएल की पुकार सुनी और कनानियों को इस्राएल के हाथ में सौंप दिया। तब इस्राएल ने उन्हें और उनके नगरों को विनाश के लिए समर्पित कर दिया। इसलिए उस स्थान का नाम होर्मा[a] पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘होर्मा’ नाम इब्रानी शब्द से संबंधित है, जिसका अर्थ ‘विनाश के लिए समर्पित करना’ या ‘प्रतिबंध के अधीन रखना’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיִּשְׁמַע ... בְּקוֹל
  choice: की पुकार सुनी
  rationale: इब्रानी मुहावरे का अर्थ यहाँ इस्राएल की विनती सुनकर उसका उत्तर देना है; आधुनिक हिन्दी में ‘पुकार सुनी’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: וַיִּתֵּן אֶת־הַכְּנַעֲנִי
  choice: कनानियों को उसके हाथ में कर दिया
  rationale: נתן यहाँ शत्रु को किसी के अधिकार में सौंपने का अर्थ देता है। इब्रानी एकवचन जातिवाचक संज्ञा का सामूहिक भाव हिन्दी में स्वाभाविक बहुवचन ‘कनानियों’ से व्यक्त किया गया है।
- source_word: וַיַּחֲרֵם
  choice: विनाश के लिए समर्पित कर दिया
  rationale: यह חרם के तकनीकी भाव—अपरिवर्तनीय रूप से विनाश के लिए अर्पित करने—को केवल ‘नष्ट किया’ कहने की अपेक्षा अधिक स्पष्ट रूप से सुरक्षित रखता है।
- source_word: אֶתְהֶם וְאֶת־עָרֵיהֶם
  choice: उन्हें और उनके नगरों को
  rationale: दोनों प्रत्यक्ष कर्मों का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיִּקְרָא שֵׁם הַמָּקוֹם
  choice: उस स्थान का नाम ... पड़ा
  rationale: इब्रानी में कर्ता स्पष्ट नहीं है। हिन्दी का यह निष्कर्तृक प्रयोग किसी विशेष कर्ता को आरोपित किए बिना नामकरण का परिणाम बताता है।
- source_word: חָרְמָה
  choice: होर्मा
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण; חרם के साथ उसका शब्द-संबंध पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: חרם से जुड़ी युद्ध-संज्ञा का अनुवाद
  choice: उन्हें और उनके नगरों को विनाश के लिए समर्पित कर दिया
  alternative: उन्हें और उनके नगरों को पूरी तरह नष्ट कर दिया / उन्हें और उनके नगरों को बहिष्कार के अधीन कर दिया
  rationale: चुना हुआ पाठ חרם की विशिष्ट धार्मिक-युद्ध संबंधी धारणा को बनाए रखता है, हिंसा को नरम नहीं करता, और आधुनिक पाठक के लिए अस्पष्ट तकनीकी भाषा से भी बचता है।
- issue: וַיַּחֲרֵם के निहित कर्ता
  choice: तब इस्राएल ने
  alternative: तब उन्होंने
  rationale: पिछली प्रतिज्ञा और प्रसंग के अनुसार कर्ता इस्राएल है। हिन्दी में स्पष्ट कर्ता जोड़ने से सर्वनामगत भ्रम दूर होता है, बिना कथ्य बदले।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। ‘याहवे’ से दिव्य नाम सुरक्षित रखा गया है; ‘होर्मा’ को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
