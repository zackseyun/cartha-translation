  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज यात्रा-विवरण। स्थान-नामों को हिंदी लिपि में रखा गया है। इब्रानी की भौगोलिक छवि को मुख्य पाठ में यथासंभव सुरक्षित रखते हुए कठिन मुहावरे को पाद-टिप्पणी में स्पष्ट किया गया है।
