base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/020.yaml
  text: and from Bamoth to the valley that is in the field of Moab[a], to the top of Pisgah[b], which overlooks the face of the wasteland.
translation:
  language: hi
  text: और बामोत से उस घाटी तक जो मोआब के मैदान में है, फिर पिसगा की चोटी तक, जो उजाड़ प्रदेश[a] की ओर देखती है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यशीमोन’; इब्रानी शब्द को उजाड़ प्रदेश के वर्णन के बजाय उस क्षेत्र का नाम माना जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘उजाड़ प्रदेश के मुख पर’; यह इब्रानी मुहावरा उस भूभाग की ओर देखने या उसके ऊपर दृष्टि डालने का भाव व्यक्त करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וּמִבָּמוֹת
  choice: और बामोत से
  rationale: בָּמוֹת इस यात्रा-विवरण में स्थान का नाम है; इसलिए इसका अर्थ ‘ऊँचे स्थान’ न करके लिप्यंतरण किया गया है। संयोजक और संबंधबोधक उपसर्गों को ‘और ... से’ के रूप में रखा गया है।
- source_word: הַגַּיְא
  choice: घाटी
  rationale: גַּיְא का अर्थ घाटी या सँकरी खड्ड हो सकता है। इस भौगोलिक यात्रा-विवरण में ‘घाटी’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: אֲשֶׁר בִּשְׂדֵה מוֹאָב
  choice: मोआब के मैदान में स्थित
  rationale: שָׂדֶה का मूल अर्थ ‘खेत’ है, पर भौगोलिक प्रयोग में यह खुला मैदान या क्षेत्र दर्शाता है। हिंदी में ‘मैदान’ इस स्थल-संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹאשׁ הַפִּסְגָּה
  choice: पिसगा की चोटी
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, किंतु पर्वतीय स्थल के लिए ‘चोटी’ स्वाभाविक है। פִּסְגָּה को स्थान-नाम मानकर ‘पिसगा’ लिखा गया है।
- source_word: וְנִשְׁקָפָה
  choice: जहाँ से ... दिखाई देता है
  rationale: यह रूप किसी ऊँचे स्थल से सामने के भूभाग को देखने या उस पर दृष्टि पड़ने का भाव देता है। हिंदी में स्थान-संबंधी उपवाक्य इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: עַל פְּנֵי
  choice: का सामने का भाग
  rationale: इब्रानी मुहावरे में פְּנֵי का मूल अर्थ ‘मुख/सामना’ है और यहाँ सामने फैले क्षेत्र का संकेत है। मुख्य पाठ में इसका चित्रात्मक भाव रखा गया है और पाद-टिप्पणी में अर्थ स्पष्ट किया गया है।
- source_word: הַיְשִׁימֹן
  choice: उजाड़ प्रदेश
  rationale: יְשִׁימוֹן निर्जन, बंजर भूभाग को दर्शाता है। यह किसी विशिष्ट क्षेत्र के नाम की तरह भी प्रयुक्त हो सकता है; उस संभावना को पाद-टिप्पणी में रखा गया है।
