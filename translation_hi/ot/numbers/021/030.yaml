source:
  edition: WLC
  text: וַ/נִּירָ֛/ם אָבַ֥ד חֶשְׁבּ֖וֹן עַד דִּיב֑וֹן וַ/נַּשִּׁ֣ים עַד נֹ֔פַח אֲשֶׁ֖רׄ עַד מֵֽידְבָֽא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/030.yaml
  text: And we shot at them[a]; Heshbon has perished as far as Dibon, and we laid waste as far as Nophah[b], which reaches to Medeba.
translation:
  language: hi
  text: हमने उन पर तीर चलाए[a]; हेशबोन दीबोन तक नष्ट हो गया, और हमने नोफ़ह तक तबाही मचा दी[b], जो मेदबा तक फैला है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'आरम्भिक इब्रानी वाक्यांश कठिन है। इसके अन्य सम्भव अर्थ हैं: “हमने उन्हें परास्त कर दिया” या “उनका प्रभुत्व नष्ट हो गया।”'
    reason: textual_variant
  - marker: b
    text: “हमने ... तबाही मचा दी” के लिए प्रयुक्त इब्रानी रूप भी अनिश्चित है। कुछ इसे अन्य प्रकार से समझते हैं, पर इस विजय-गीत के प्रसंग में विनाश बताने वाली क्रिया अधिक उपयुक्त लगती है।
    reason: textual_variant
lexical_decisions:
- source_word: וַנִּירָם
  choice: हमने उन पर तीर चलाए
  rationale: यह रूप अत्यंत कठिन है। उपलब्ध व्यंजन और युद्ध-विजय गीत का संदर्भ ירה से जुड़ी ‘तीर चलाने’ की छवि का समर्थन कर सकते हैं; अनिश्चितता और प्रमुख वैकल्पिक अर्थ पादटिप्पणी में रखे गए हैं।
- source_word: אָבַד
  choice: नष्ट हो गया
  rationale: क्रिया का अर्थ ‘नाश होना/मिट जाना’ है; हिन्दी में यह पूर्ण हुई तबाही को स्वाभाविक और स्पष्ट रूप में व्यक्त करता है।
- source_word: חֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम का मानक देवनागरी लिप्यंतरण।
- source_word: עַד דִּיבוֹן
  choice: दीबोन तक
  rationale: עַד भौगोलिक विस्तार की सीमा बताता है; ‘तक’ इसका सहज हिन्दी रूप है।
- source_word: וַנַּשִּׁים
  choice: हमने ... उजाड़ दिया
  rationale: रूप पाठगत और शब्दार्थ की दृष्टि से कठिन है, पर विजय-गीत के प्रसंग में प्रथम पुरुष बहुवचन की विनाश-सूचक क्रिया सबसे उपयुक्त प्रतीत होती है।
- source_word: עַד נֹפַח
  choice: नोफ़ह तक
  rationale: עַד सीमा या विस्तार बताता है; नोफ़ह स्थान-नाम के रूप में लिप्यंतरित है।
- source_word: אֲשֶׁר עַד מֵידְבָא
  choice: जो मेदबा तक फैला है
  rationale: सम्बन्धवाचक उपवाक्य को भौगोलिक विस्तार के रूप में समझते हुए स्वाभाविक हिन्दी दी गई है, बिना इसकी अंतर्निहित अस्पष्टता को पूरी तरह समाप्त किए।
- source_word: מֵידְבָא
  choice: मेदबा
  rationale: स्थान-नाम का मानक देवनागरी लिप्यंतरण।
