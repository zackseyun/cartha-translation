  text: וְ/אֶ֨שֶׁד֙ הַ/נְּחָלִ֔ים אֲשֶׁ֥ר נָטָ֖ה לְ/שֶׁ֣בֶת עָ֑ר וְ/נִשְׁעַ֖ן לִ/גְב֥וּל מוֹאָֽב׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/015.yaml
  text: and the slope of the wadis that extends to the site of Ar and leans against the border of Moab[a][b].
translation:
  language: hi
  text: और उन बरसाती नालों[a] की ढलान, जो आर के स्थान[b] तक फैली है और मोआब की सीमा से जा लगती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घाटियों” अथवा “खड्डों”; इब्रानी शब्द נְחָלִים प्रायः ऐसे नालों या जलधाराओं के पाटों को दर्शाता है जिनमें मौसम के अनुसार पानी बहता है।
    reason: lexical_alternative
  - marker: b
    text: या “आर के निवास-स्थान तक।” इब्रानी पदबंध कठिन है और आर की अवस्थिति या उसकी बस्ती की ओर संकेत कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶשֶׁד
  choice: ढलान
  rationale: यह संज्ञा घाटी या नाले से जुड़ी उतरती हुई भूमि को दर्शाती है; ‘ढलान’ आधुनिक हिन्दी में स्वाभाविक और स्थलाकृतिक संदर्भ के अनुकूल है।
- source_word: הַנְּחָלִים
  choice: उन बरसाती नालों
  rationale: נחל प्रायः ऐसे जलमार्ग या नाले को सूचित करता है जिसमें मौसम के अनुसार पानी बहता है। ‘बरसाती नाले’ साधारण हिन्दी पाठक के लिए ‘वाडी’ से अधिक स्पष्ट है।
- source_word: אֲשֶׁר נָטָה
  choice: जो ... तक फैली है
  rationale: נטה का अर्थ फैलना, बढ़ना या झुकना हो सकता है; स्थलाकृतिक वर्णन में ‘फैली है’ स्थानिक विस्तार को सहज रूप से व्यक्त करता है।
- source_word: לְשֶׁבֶת עָר
  choice: आर के स्थान तक
  rationale: कठिन इब्रानी पदबंध को यहाँ आर की अवस्थिति के संकेत के रूप में लिया गया है; अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: עָר
  choice: आर
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: וְנִשְׁעַן
  choice: और ... से जा लगती है
  rationale: שען का मूल बिंब ‘टिकना/सहारा लेना’ है; भूसीमा के संदर्भ में ‘से जा लगती है’ उसी संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לִגְבוּל מוֹאָב
  choice: मोआब की सीमा
  rationale: גבול यहाँ किसी भूभाग की सीमा या सरहद को सूचित करता है; ‘सीमा’ स्पष्ट और मानक हिन्दी है।
