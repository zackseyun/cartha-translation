  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘दूत’ को संदर्भ से मानवीय राजनयिक संदेशवाहक समझा जाता है। इब्रानी पदबंध מֶלֶךְ הָאֱמֹרִי का हिन्दी अनुवाद ‘एमोरियों के राजा’ स्वाभाविक है; अंग्रेज़ी में उपस्थित वैकल्पिक संरचना हिन्दी में अर्थपूर्ण भेद उत्पन्न नहीं करती, इसलिए पाद-टिप्पणी आवश्यक नहीं मानी गई।
