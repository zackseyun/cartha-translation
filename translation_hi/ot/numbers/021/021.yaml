  text: וַ/יִּשְׁלַ֤ח יִשְׂרָאֵל֙ מַלְאָכִ֔ים אֶל סִיחֹ֥ן מֶֽלֶךְ הָ/אֱמֹרִ֖י לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/021.yaml
  text: Then Israel sent messengers to Sihon king of the Amorites[a], saying,
translation:
  language: hi
  text: तब इस्राएल ने एमोरियों के राजा सीहोन के पास दूत भेजकर कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब … भेजकर कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ इस प्रगति को स्वाभाविक हिन्दी में व्यक्त करता है। अगले לֵאמֹר के साथ मिलकर ‘भेजकर कहा’ सहज वाक्य-विन्यास देता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यहाँ यह व्यक्तिवाचक नाम इस्राएली प्रजा के लिए सामूहिक रूप से प्रयुक्त है; मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजनयिक प्रसंग में यह शब्द मानवीय संदेशवाहकों को दर्शाता है, स्वर्गदूतों को नहीं। ‘दूत’ संक्षिप्त, गरिमापूर्ण और सामान्य हिन्दी में स्वाभाविक है।
- source_word: אֶל
  choice: के पास
  rationale: व्यक्तियों के संदर्भ में दिशासूचक अर्थ को हिन्दी में ‘के पास’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: סִיחֹן
  choice: सीहोन
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा
  rationale: संबंधसूचक इब्रानी पदबंध को जाति पर शासन करने वाले राजा के अर्थ में स्वाभाविक हिन्दी बहुवचन द्वारा व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगामी प्रत्यक्ष कथन का परिचय देता है। ‘दूत भेजकर कहा’ हिन्दी कथा-शैली में सहज है और अगली आयत के कथन की भूमिका बनाता है।
