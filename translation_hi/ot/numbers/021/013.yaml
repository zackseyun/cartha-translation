  text: מִ/שָּׁם֮ נָסָעוּ֒ וַֽ/יַּחֲנ֗וּ מֵ/עֵ֤בֶר אַרְנוֹן֙ אֲשֶׁ֣ר בַּ/מִּדְבָּ֔ר הַ/יֹּצֵ֖א מִ/גְּב֣וּל הָֽ/אֱמֹרִ֑י כִּ֤י אַרְנוֹן֙ גְּב֣וּל מוֹאָ֔ב בֵּ֥ין מוֹאָ֖ב וּ/בֵ֥ין הָ/אֱמֹרִֽי׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/013.yaml
  text: From there they set out and camped on the other side of the Arnon[a], which is in the wilderness that extends from the border of the Amorites, for the Arnon is the border of Moab[b], between Moab and the Amorites.
translation:
  language: hi
  text: वहाँ से वे प्रस्थान करके अर्नोन के उस पार उस वीराने में, जो एमोरियों की सीमा से फैला हुआ है[b], डेरा डाला[a]; क्योंकि अर्नोन मोआब की सीमा है, जो मोआब और एमोरियों के बीच है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अर्नोन से परे।” इब्रानी अभिव्यक्ति दृष्टिकोण के अनुसार किसी सीमा की दूसरी ओर या उसके पार के क्षेत्र को दर्शा सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जो एमोरियों की सीमा से निकलता है।” इसका अर्थ है कि वीराना एमोरियों की सीमा से आगे फैला हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשָּׁם נָסָעוּ
  choice: वहाँ से वे आगे चले
  rationale: यात्रा-वृत्तांत में נסע का अर्थ पिछला पड़ाव छोड़कर आगे बढ़ना है; यह अनुवाद कथात्मक क्रम और प्रस्थान—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּחֲנוּ
  choice: और ... डेरा डाला
  rationale: חנה किसी स्थान पर शिविर लगाने या पड़ाव डालने को दर्शाता है; ‘डेरा डाला’ सहज आधुनिक हिन्दी है।
- source_word: מֵעֵבֶר אַרְנוֹן
  choice: अर्नोन के उस पार
  rationale: עֵבֶר किसी सीमा या जलधारा की दूसरी ओर के क्षेत्र को दर्शाता है। ‘उस पार’ इब्रानी में निहित सापेक्ष दृष्टिकोण को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר בַּמִּדְבָּר
  choice: उस वीराने में
  rationale: מִדְבָּר यहाँ निर्जन, जंगल-जैसे भूभाग का बोध कराता है; ‘वीराना’ आधुनिक पाठक के लिए स्पष्ट है और घने वन का भ्रामक अर्थ नहीं देता।
- source_word: הַיֹּצֵא מִגְּבוּל הָאֱמֹרִי
  choice: जो एमोरियों की सीमा से फैला हुआ है
  rationale: יצא का शाब्दिक अर्थ ‘निकलना’ है, पर यहाँ भूभाग के सीमा से आगे फैलने का भौगोलिक भाव है; मुख्य पाठ में स्वाभाविक अर्थ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: גְּבוּל
  choice: सीमा
  rationale: दोनों प्रयोगों में यह प्रदेशों के बीच की भौगोलिक सीमा को दर्शाता है; ‘सीमा’ स्पष्ट और एकरूप है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: इब्रानी में रूप एकवचन है, पर यहाँ वह जाति के लिए सामूहिक अर्थ में प्रयुक्त है; हिन्दी में बहुवचन अधिक स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए स्थान-विवरण का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: בֵּין מוֹאָב וּבֵין הָאֱמֹרִי
  choice: मोआब और एमोरियों के बीच
  rationale: दोहराया गया בֵּין उन दोनों पक्षों को स्पष्ट करता है जिन्हें अर्नोन अलग करता था।
