base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/025.yaml
  text: Israel took all these cities[a], and Israel settled in all the cities of the Amorites, in Heshbon and in all its daughter towns.
translation:
  language: hi
  text: इस्राएल ने ये सभी नगर ले लिए, और इस्राएल अमोरियों के सभी नगरों में, अर्थात् हेशबोन और उसकी सभी आश्रित बस्तियों[a] में, बस गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसकी सभी बेटियों में।’ यह किसी बड़े नगर से संबद्ध छोटी या आश्रित बस्तियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: पर अधिकार कर लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; यहाँ युद्ध और नगर-विजय के संदर्भ में ‘पर अधिकार कर लिया’ स्वाभाविक हिंदी में आशय स्पष्ट करता है, बिना अनावश्यक हिंसात्मक विवरण जोड़े।
- source_word: כָּל הֶעָרִים הָאֵלֶּה
  choice: इन सभी नगरों
  rationale: עיר के लिए ‘नगर’ मानक और गरिमापूर्ण हिंदी है; ‘इन’ से इब्रानी संकेतवाचक הָאֵלֶּה सुरक्षित रहता है।
- source_word: וַיֵּשֶׁב
  choice: बस गया
  rationale: ישב यहाँ जीते हुए क्षेत्र में निवास स्थापित करने का भाव देता है; ‘बस गया’ आधुनिक हिंदी में इस संक्रमण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּכָל עָרֵי הָאֱמֹרִי
  choice: अमोरियों के सभी नगरों में
  rationale: रचना संबंधसूचक इब्रानी पदबंध को स्पष्ट रखती है। सामूहिक एकवचन הָאֱמֹרִי को हिंदी में समुदाय के लिए बहुवचन ‘अमोरियों’ कहना स्वाभाविक है।
- source_word: בְּחֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम का हिंदी में प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: וּבְכָל בְּנֹתֶיהָ
  choice: और उसके अधीन सभी बस्तियों में
  rationale: नगर की ‘बेटियाँ’ एक इब्रानी मुहावरा है, जिसका अर्थ उससे संबद्ध या उस पर निर्भर छोटी बस्तियाँ है। ‘अधीन बस्तियाँ’ अर्थ को सामान्य पाठक के लिए स्पष्ट करती हैं।
