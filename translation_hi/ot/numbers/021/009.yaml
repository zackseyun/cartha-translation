  text: וַ/יַּ֤עַשׂ מֹשֶׁה֙ נְחַ֣שׁ נְחֹ֔שֶׁת וַ/יְשִׂמֵ֖/הוּ עַל הַ/נֵּ֑ס וְ/הָיָ֗ה אִם נָשַׁ֤ךְ הַ/נָּחָשׁ֙ אֶת אִ֔ישׁ וְ/הִבִּ֛יט אֶל נְחַ֥שׁ הַ/נְּחֹ֖שֶׁת וָ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/009.yaml
  text: So Moses made a bronze serpent and set it on the pole[a]. And it happened that if the serpent bit a man, and he looked at the bronze serpent[d][c][b], he lived.
translation:
  language: hi
  text: मूसा ने काँसे का एक साँप बनाया और उसे खंभे पर लगा दिया।[a] और जब भी साँप किसी व्यक्ति को काटता, तो वह काँसे के साँप की ओर देखता और जीवित रहता।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘काँसे’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘ताँबा’ भी हो सकता है; और ‘खंभे’ के लिए प्रयुक्त शब्द का अर्थ ‘ध्वज-दंड’ या ‘निशान’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इस घटना का प्रतिरूपात्मक उल्लेख यूहन्ना 3:14–15 में मिलता है।
    reason: cross_reference
lexical_decisions:
- source_word: נְחַשׁ
  choice: साँप
  rationale: आधुनिक मानक हिन्दी में यह स्वाभाविक और स्पष्ट शब्द है; गढ़ी हुई आकृति और काटने वाले जीव—दोनों के लिए स्रोत की पुनरावृत्ति भी बनी रहती है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: धातु-संबंधी इस इब्रानी शब्द का सामान्य बाइबलीय संदर्भ काँसा है, यद्यपि यह ताँबे को भी सूचित कर सकता है; विकल्प पादटिप्पणी में रखा गया है।
- source_word: הַנֵּס
  choice: एक खंभा
  rationale: इस प्रसंग में वह ऊँची खड़ी वस्तु अभिप्रेत है जिस पर साँप लगाया गया था। इब्रानी शब्द के ‘ध्वज-दंड/निशान’ अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהָיָה
  choice: फिर ऐसा होता था
  rationale: यह आगे बताई गई बार-बार लागू होने वाली परिस्थिति और परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִם נָשַׁךְ הַנָּחָשׁ אֶת אִישׁ
  choice: यदि साँप किसी व्यक्ति को काट लेता
  rationale: אִישׁ का रूप पुल्लिंग एकवचन है, पर यहाँ उसका प्रतिनिधिक अर्थ किसी भी काटे गए व्यक्ति से है; ‘किसी व्यक्ति’ हिन्दी में उस अर्थ को स्पष्ट और सहज रखता है।
- source_word: וְהִבִּיט אֶל
  choice: उसकी ओर देखता
  rationale: ‘की ओर देखना’ אֶל की दिशात्मकता बनाए रखता है, पर वाक्य में ऐसी अतिरिक्त धार्मिक धारणा नहीं जोड़ता जो मूल पद में स्पष्ट नहीं है।
- source_word: וָחָי
  choice: जीवित रहता
  rationale: सशर्त और प्रचलित परिस्थिति में मिलने वाले परिणाम को व्यक्त करता है; ‘बच जाता’ संभव है, किंतु अधिक व्याख्यात्मक है।
theological_decisions:
- issue: אִישׁ में प्रतिनिधिक पुल्लिंग
  choice: किसी व्यक्ति
  alternative: किसी पुरुष को
  rationale: यहाँ व्याकरणिक पुल्लिंग किसी भी काटे गए व्यक्ति का प्रतिनिधित्व करता है। आधुनिक हिन्दी में ‘किसी व्यक्ति’ स्रोत का आशय बिना अनावश्यक लैंगिक सीमा लगाए व्यक्त करता है।
- issue: ‘देखने’ का बाद का प्रतिरूपात्मक महत्व
  choice: उसकी ओर देखता
  alternative: उस पर विश्वास से दृष्टि लगाता
  rationale: यूहन्ना 3:14–15 में इस घटना का प्रतिरूपात्मक उपयोग होता है, पर गिनती के इस पद में विश्वास संबंधी विस्तार जोड़ना मूल इब्रानी से आगे जाना होगा। संबंध पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘साँप’ सामान्य पाठक के लिए ‘सर्प’ से अधिक स्वाभाविक है। इब्रानी की सशर्त घटना को हिन्दी में ‘यदि… तो…’ और अभ्यस्त परिणामसूचक क्रियाओं से स्पष्ट किया गया है।
