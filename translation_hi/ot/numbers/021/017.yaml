translation:
  language: hi
  text: 'तब इस्राएल ने यह गीत गाया:


    “ऊपर आ, हे कुएँ![a]

    इसका उत्तर दो!”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप से, “उठ आ, हे कुएँ! इसे उत्तर दो!” हिब्रू पदावली सम्भवतः प्रतिउत्तर या प्रतिगान के रूप में गाए जाने वाले गीत को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָז
  choice: तब
  rationale: यह कालवाचक क्रियाविशेषण कथा के अगले कार्य को प्रस्तुत करता है; आधुनिक हिन्दी में “तब” स्वाभाविक है।
- source_word: יָשִׁיר
  choice: ने ... गाया
  rationale: रूपतः अपूर्ण काल होने पर भी אָז के साथ यह बीते हुए कथात्मक कार्य को व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: यह लोगों/राष्ट्र का व्यक्तिवाचक नाम है; प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
- source_word: הַשִּׁירָה הַזֹּאת
  choice: यह गीत
  rationale: निश्चित संज्ञा और संकेतवाचक का सीधा तथा स्वाभाविक हिन्दी अनुवाद।
- source_word: עֲלִי
  choice: उमड़ आ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप कुएँ को संबोधित है। जल के संदर्भ में “उमड़ आ” काव्यात्मक और स्वाभाविक है, जबकि मूल के सामान्य अर्थ “ऊपर आ” का भाव भी बनाए रखता है।
- source_word: בְאֵר
  choice: हे कुएँ
  rationale: आज्ञा सीधे कुएँ को दी गई है; “हे” संबोधन को स्पष्ट करता है।
- source_word: עֱנוּ לָהּ
  choice: इसके उत्तर में गाओ
  rationale: ענה का मूल भाव उत्तर देना है, और गीत के संदर्भ में यह सामूहिक या प्रतिगानात्मक प्रत्युत्तर का संकेत दे सकता है। यह अनुवाद ‘उत्तर’ और गायन-संदर्भ दोनों को बनाए रखता है।
