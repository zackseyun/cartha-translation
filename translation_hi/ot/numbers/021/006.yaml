source:
  edition: WLC
  text: וַ/יְשַׁלַּ֨ח יְהוָ֜ה בָּ/עָ֗ם אֵ֚ת הַ/נְּחָשִׁ֣ים הַ/שְּׂרָפִ֔ים וַֽ/יְנַשְּׁכ֖וּ אֶת הָ/עָ֑ם וַ/יָּ֥מָת עַם רָ֖ב מִ/יִּשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/006.yaml
  text: So Yahweh sent among the people the fiery serpents[a], and they bit the people, and many from Israel died.
translation:
  language: hi
  text: तब याहवे ने लोगों के बीच जलाने वाले साँप[a] भेजे। उन्होंने लोगों को डसा, और इस्राएल में से बहुत-से लोग मर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “विषैले साँप।” इब्रानी में शाब्दिक रूप से, “साँप, जलाने वाले [साँप]”; यह संभवतः उनके डसने से होने वाली जलन का संकेत है।
    reason: הַשְּׂרָפִים के शाब्दिक बिंब को मुख्य पाठ में रखते हुए इसके संभावित संदर्भगत अर्थ को पादटिप्पणी में दर्शाना।
lexical_decisions:
- source_word: וַיְשַׁלַּח
  choice: भेजे
  rationale: שׁלח का सामान्य अर्थ ‘भेजना’ है; हिन्दी में साँपों को लोगों के बीच भेजने के लिए यही सीधा और स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בָּעָם
  choice: लोगों के बीच
  rationale: यहाँ ב को स्थानसूचक मानकर उस क्षेत्र को व्यक्त किया गया है जहाँ साँप भेजे गए; ‘लोगों के विरुद्ध’ अधिक व्याख्यात्मक होता।
- source_word: הַנְּחָשִׁים הַשְּׂרָפִים
  choice: विषैले साँप
  rationale: נְחָשִׁים साँपों को और שְּׂרָפִים उनके जलाने वाले प्रभाव को सूचित करता है। आधुनिक हिन्दी में ‘विषैले साँप’ तत्काल बोधगम्य है, जबकि शाब्दिक चित्र को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיְנַשְּׁכוּ
  choice: उन्होंने ... डसा
  rationale: נשׁך का अर्थ काटना/डसना है; साँप के संदर्भ में हिन्दी का स्वाभाविक और सटीक क्रिया-रूप ‘डसना’ है।
- source_word: וַיָּמָת
  choice: मर गए
  rationale: מות का सीधा अर्थ ‘मरना’ है; बहुवचन कर्ता के अनुरूप हिन्दी रूप चुना गया है।
- source_word: עַם רָב מִיִּשְׂרָאֵל
  choice: इस्राएल के बहुत-से लोग
  rationale: यह वाक्यांश इस्राएल में से बड़ी संख्या में लोगों की मृत्यु बताता है; यह हिन्दी में स्वाभाविक रहते हुए מן के चयनात्मक भाव को व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: הַשְּׂרָפִים का संदर्भगत अर्थ
  choice: मुख्य पाठ में ‘विषैले’, पादटिप्पणी में ‘जलाने वाले’
  alternative: अग्निमय साँप; जलाने वाले साँप
  rationale: इब्रानी विशेषण का मूल भाव जलना/जलाना है और संभवतः डसने की जलन को दर्शाता है। मुख्य पाठ में स्पष्ट आधुनिक हिन्दी रखी गई है, पर शाब्दिक बिंब और वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। कथात्मक क्रम के लिए ‘तब’ और साँप के काटने के लिए स्वाभाविक हिन्दी ‘डसा’ प्रयुक्त है।
