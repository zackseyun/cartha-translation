source:
  edition: WLC
  text: אוֹי לְ/ךָ֣ מוֹאָ֔ב אָבַ֖דְתָּ עַם כְּמ֑וֹשׁ נָתַ֨ן בָּנָ֤י/ו פְּלֵיטִם֙ וּ/בְנֹתָ֣י/ו בַּ/שְּׁבִ֔ית לְ/מֶ֥לֶךְ אֱמֹרִ֖י סִיחֽוֹן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/029.yaml
  text: Woe to you[a], Moab! You are ruined, people of Chemosh! He has made his sons fugitives and his daughters captives to Sihon, king of the Amorites.
translation:
  language: hi
  text: हाय, मोआब! तू नष्ट हो गया, हे कमोश की प्रजा! उसने अपने बेटों को भगोड़ों के रूप में और अपनी बेटियों को बंदियों के रूप में एमोरियों के राजा सीहोन के हवाले कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मोआब के बेटों को भगोड़ों के रूप में और मोआब की बेटियों को बंदियों के रूप में,” यदि सर्वनाम-प्रत्ययों को कमोश के बजाय मोआब की ओर संकेत करने वाला माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: אוֹי לְךָ
  choice: हाय तुझ पर
  rationale: यह विपत्ति और विलाप का काव्यात्मक उद्गार है; यह सीधा संबोधन और विनाश-गीत का प्रभाव बनाए रखता है।
- source_word: אָבַדְתָּ
  choice: तू नष्ट हो गया
  rationale: पूर्ण क्रिया मोआब की विनाशकारी पराजय को प्रत्यक्ष संबोधन में व्यक्त करती है।
- source_word: עַם כְּמוֹשׁ
  choice: हे कमोश की प्रजा
  rationale: सम्बन्धवाचक रचना उस प्रजा को कमोश से जुड़ी हुई बताती है; संबोधन को स्पष्ट करने के लिए 'हे' स्वाभाविक है।
- source_word: נָתַן
  choice: बना दिया
  rationale: मूल अर्थ 'देना' है, पर यहाँ इसके बाद परिणामसूचक संज्ञाएँ हैं; 'बना दिया' हिंदी में उस परिणामी दशा और कर्तृत्व दोनों को सहज रूप से व्यक्त करता है।
- source_word: בָּנָיו ... וּבְנֹתָיו
  choice: अपने बेटों ... अपनी बेटियों
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम पूर्वपद कमोश है; 'अपने' उसी काव्यात्मक मानवीकरण को बनाए रखता है।
- source_word: פְּלֵיטִם
  choice: भगोड़े
  rationale: यह पराजय से बचकर भागने वालों को दर्शाता है और पलायन के भाव को बनाए रखता है।
- source_word: בַּשְּׁבִית
  choice: बंदिनी
  rationale: स्त्रीलिंग बहुवचन 'बेटियों' के साथ यह समानांतर परिणामसूचक संज्ञा के रूप में बंदी दशा को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְמֶלֶךְ אֱמֹרִי סִיחוֹן
  choice: एमोरियों के राजा सीहोन की
  rationale: यह सीहोन को प्राप्तकर्ता/अधीनकर्ता और एमोरियों के राजा के रूप में स्पष्ट करता है।
theological_decisions:
- issue: בָּנָיו और וּבְנֹתָיו के तृतीय पुरुष पुल्लिंग एकवचन प्रत्ययों का संदर्भ
  choice: 'प्रत्यय कमोश की ओर संकेत करते हैं: ''अपने बेटों'' और ''अपनी बेटियों''।'
  alternative: प्रत्यय मोआब को सामूहिक इकाई मानकर उसकी संतानों की ओर संकेत कर सकते हैं।
  rationale: निकटतम पूर्वपद कमोश है और कविता मोआब के देवता का मानवीकरण करती है; फिर भी व्याकरणिक-काव्यात्मक संदर्भ पूर्णतः निर्विवाद नहीं है, इसलिए विकल्प पाद-टिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक विनाश-गीत का गरिमापूर्ण स्वर रखा गया है। एकवचन 'तू' मूल इब्रानी के प्रत्यक्ष सामूहिक संबोधन को दर्शाता है; नामों के रूप 'मोआब', 'कमोश', 'एमोरी' और 'सीहोन' रखे गए हैं।
