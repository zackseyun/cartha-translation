base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/023.yaml
  text: But Sihon did not allow Israel to pass through his territory[a]. So Sihon gathered all his people and went out to meet Israel in the wilderness[c][b]. He came to Jahaz and fought against Israel.
translation:
  language: hi
  text: परन्तु सीहोन ने इस्राएल को अपने प्रदेश से होकर जाने की अनुमति नहीं दी।[a] तब सीहोन ने अपने सब लोगों को इकट्ठा किया[b] और इस्राएल का सामना करने के लिए निर्जन प्रदेश में निकल पड़ा। वह यहस पहुँचा[c] और इस्राएल से युद्ध किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी सीमा के भीतर से होकर जाने नहीं दिया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “अपने सब लोगों”; पाठ स्पष्ट रूप से “सेना” नहीं कहता, यद्यपि युद्ध का प्रसंग सशस्त्र दल का संकेत देता है।
    reason: lexical_alternative
  - marker: c
    text: यहस को कुछ लिप्यंतरणों में “यहसा” भी लिखा जाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: נָתַן ... עֲבֹר
  choice: से होकर जाने की अनुमति नहीं दी
  rationale: यहाँ נָתַן का शाब्दिक अर्थ ‘देना’ है, पर इस रचना में उसका मुहावरेदार अर्थ किसी को होकर जाने देना या अनुमति देना है।
- source_word: בִּגְבֻלוֹ
  choice: अपने प्रदेश से होकर
  rationale: גְּבוּל का अर्थ सीमा, सरहद या सीमाबद्ध प्रदेश हो सकता है। प्रसंग में इस्राएल सीहोन के देश से होकर जाना चाहता है, इसलिए ‘प्रदेश’ स्वाभाविक और स्पष्ट है।
- source_word: וַיֶּאֱסֹף ... אֶת כָּל עַמּוֹ
  choice: अपने सब लोगों को इकट्ठा किया
  rationale: इब्रानी पाठ में ‘उसकी सारी प्रजा/उसके सब लोग’ है, ‘सेना’ नहीं। युद्ध का प्रसंग सशस्त्र दल का संकेत देता है, फिर भी अनुवाद मूल शब्दावली को बनाए रखता है।
- source_word: לִקְרַאת יִשְׂרָאֵל
  choice: इस्राएल का सामना करने के लिए
  rationale: इस पदबंध का मूल भाव इस्राएल से मिलने या उसकी ओर जाकर आमना-सामना करने का है। निकटवर्ती युद्ध-संदर्भ के कारण ‘सामना करना’ स्वाभाविक है, जबकि बाद की क्रिया ही युद्ध को स्पष्ट करती है।
- source_word: הַמִּדְבָּרָה
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आवश्यक रूप से वन नहीं, बल्कि निर्जन या उजाड़ क्षेत्र है; दिशासूचक ה गति को उस क्षेत्र की ओर/उसमें दर्शाता है।
- source_word: יָהְצָה
  choice: यहस पहुँचा
  rationale: यह स्थान-नाम और दिशासूचक रूप है; हिन्दी में ‘यहस पहुँचा’ गंतव्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: इस्राएल से युद्ध किया
  rationale: לחם के साथ ב यहाँ विरोधी के विरुद्ध युद्ध करने का अर्थ देता है। हिन्दी में ‘से युद्ध किया’ स्पष्ट और स्वाभाविक है।
- source_word: וְלֹא
  choice: परन्तु ... नहीं
  rationale: संयोजक पिछले पद में माँगी गई राह की अनुमति के विपरीत सीहोन की प्रतिक्रिया प्रस्तुत करता है, इसलिए ‘परन्तु’ उपयुक्त है।
