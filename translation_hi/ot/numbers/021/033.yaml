  register: आधुनिक मानक हिंदी का स्पष्ट, गरिमापूर्ण कथात्मक रूप। मूल इब्रानी की तटस्थ ‘मिलने’ वाली अभिव्यक्ति को बनाए रखा गया है, जबकि ‘युद्ध करने के लिए’ प्रसंग की शत्रुता स्पष्ट करता है।
