source:
  edition: WLC
  text: וַ/יִּפְנוּ֙ וַֽ/יַּעֲל֔וּ דֶּ֖רֶךְ הַ/בָּשָׁ֑ן וַ/יֵּצֵ֣א עוֹג֩ מֶֽלֶךְ הַ/בָּשָׁ֨ן לִ/קְרָאתָ֜/ם ה֧וּא וְ/כָל עַמּ֛/וֹ לַ/מִּלְחָמָ֖ה אֶדְרֶֽעִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/033.yaml
  text: Then they turned and went up by the way of Bashan[a], and Og king of Bashan came out to meet them, he and all his people, for battle at Edrei.
translation:
  language: hi
  text: तब वे मुड़े और बाशान के मार्ग से ऊपर गए। बाशान का राजा ओग अपने सभी लोगों के साथ एद्रेई में युद्ध करने के लिए उनसे मिलने निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּפְנוּ
  choice: वे मुड़े
  rationale: פנה कथात्मक क्रम में दिशा बदलने को व्यक्त करता है; ‘मुड़े’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיַּעֲלוּ
  choice: ऊपर गए
  rationale: עלה का सामान्य अर्थ ‘ऊपर जाना’ है और इसमें निहित दिशात्मक अथवा स्थलाकृतिक भाव सुरक्षित रहता है।
- source_word: דֶּרֶךְ הַבָּשָׁן
  choice: बाशान के मार्ग से
  rationale: דרך और स्थान-नाम का मेल उस क्षेत्र की ओर या उससे संबद्ध मार्ग बताता है; यह हिंदी में निकट और सहज अभिव्यक्ति है।
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: बाशान का राजा ओग
  rationale: उपाधि और नाम को हिंदी के स्वाभाविक पदक्रम में रखा गया है।
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: יצא का मूल अर्थ ‘बाहर निकलना’ है; युद्ध का उद्देश्य आगे के वाक्यांश से स्पष्ट होता है, इसलिए ‘चढ़ आया’ जैसा अतिरिक्त सैन्य अर्थ नहीं जोड़ा गया।
- source_word: לִקְרָאתָם
  choice: उनसे मिलने
  rationale: अभिव्यक्ति का शाब्दिक और अपने-आप में तटस्थ अर्थ ‘मिलने/सामना करने’ है; לַמִּלְחָמָה यहाँ उसके शत्रुतापूर्ण उद्देश्य को स्पष्ट करता है।
- source_word: הוּא וְכָל־עַמּוֹ
  choice: अपनी सारी प्रजा के साथ
  rationale: עם का मूल अर्थ ‘लोग/प्रजा’ है; सैन्य प्रसंग के बावजूद ‘सेना’ कहकर पाठ को अधिक विशिष्ट नहीं बनाया गया।
- source_word: לַמִּלְחָמָה
  choice: युद्ध करने के लिए
  rationale: उद्देश्यसूचक לְ को स्पष्ट और स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֶדְרֶעִי
  choice: एद्रेई में
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; वाक्यांत का नाम युद्धस्थल बताता है, इसलिए हिंदी में ‘में’ स्वाभाविक है।
