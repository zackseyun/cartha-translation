reference: Numbers 21:24
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּכֵּ֥/הוּ יִשְׂרָאֵ֖ל לְ/פִי חָ֑רֶב וַ/יִּירַ֨שׁ אֶת אַרְצ֜/וֹ מֵֽ/אַרְנֹ֗ן עַד יַבֹּק֙ עַד בְּנֵ֣י עַמּ֔וֹן כִּ֣י עַ֔ז גְּב֖וּל בְּנֵ֥י עַמּֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/024.yaml
  text: Israel struck him with the edge of the sword and took possession of his land from the Arnon as far as the Jabbok[a], as far as the sons of Ammon, for the border of the sons of Ammon was strong.
translation:
  language: hi
  text: इस्राएल ने उसे तलवार की धार से मारा और अर्नोन से यब्बोक तक, अम्मोनियों तक, उसकी भूमि पर अधिकार कर लिया, क्योंकि अम्मोनियों की सीमा मजबूत थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּהוּ
  choice: उसे ... मारा
  rationale: נכה का सीधा अर्थ ‘मारना/प्रहार करना’ है। यह अनुवाद मृत्यु या पूर्ण पराजय को अनावश्यक रूप से स्पष्ट किए बिना मूल क्रिया का बल बनाए रखता है।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: हिब्रू मुहावरे का शाब्दिक बिंब ‘तलवार के मुँह/धार’ का है; हिन्दी में ‘तलवार की धार से’ स्वाभाविक और स्रोत-पारदर्शी है।
- source_word: וַיִּירַשׁ
  choice: अधिकार कर लिया
  rationale: ירש यहाँ सैन्य प्रसंग में भूमि को अपने अधिकार में लेने का भाव देता है; ‘विरासत में पाया’ इस संदर्भ में भ्रामक होगा।
- source_word: אַרְצוֹ
  choice: उसकी भूमि
  rationale: אֶרֶץ का सीधा और प्रसंगानुकूल हिन्दी रूप ‘भूमि’ है।
- source_word: מֵאַרְנֹן עַד יַבֹּק
  choice: अर्नोन से यब्बोक तक
  rationale: यह पदबंध जीते हुए क्षेत्र की भौगोलिक सीमा बताता है।
- source_word: עַד בְּנֵי עַמּוֹן
  choice: अर्थात अम्मोनियों तक
  rationale: בני עמון जातीय समुदाय को सूचित करता है। आधुनिक हिन्दी में ‘अम्मोनी’ इसका स्वाभाविक और सटीक सामुदायिक नाम है; ‘अर्थात’ यब्बोक और अम्मोनी सीमा के बीच पाठ में आए दूसरे עַד की व्याख्यात्मक/सीमासूचक भूमिका स्पष्ट करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ विजय की सीमा का कारण प्रस्तुत करता है।
- source_word: עַז
  choice: मजबूत
  rationale: עַז का व्यापक अर्थ ‘बलवान/मजबूत’ है; ‘किलेबंद’ कहना मूल से अधिक विशिष्ट होगा।
- source_word: גְּבוּל
  choice: सीमा
  rationale: क्षेत्रीय हद के लिए ‘सीमा’ आधुनिक हिन्दी का सहज शब्द है।
theological_decisions:
- issue: בְּנֵי עַמּוֹן का जातीय अर्थ
  choice: अम्मोनियों
  alternative: अम्मोन के पुत्रों
  rationale: हिब्रू का पुरुषवाचक वंश-सूचक पद यहाँ पूरे जातीय समुदाय का रूढ़ नाम है। हिन्दी में ‘अम्मोनियों’ अर्थ को स्वाभाविक और लिंग-संदर्भ की दृष्टि से सटीक रूप में व्यक्त करता है; पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘तलवार की धार’ मूल हिब्रू बिंब को बचाता है, जबकि जातीय पद को स्वाभाविक हिन्दी में प्रस्तुत किया गया है।
