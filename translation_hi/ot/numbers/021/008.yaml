  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה עֲשֵׂ֤ה לְ/ךָ֙ שָׂרָ֔ף וְ/שִׂ֥ים אֹת֖/וֹ עַל נֵ֑ס וְ/הָיָה֙ כָּל הַ/נָּשׁ֔וּךְ וְ/רָאָ֥ה אֹת֖/וֹ וָ/חָֽי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/008.yaml
  text: Then Yahweh said to Moses[a], “Make for yourself a fiery serpent and set it on a pole, and it shall be that everyone who is bitten, when he looks at it[b], shall live.”
translation:
  language: hi
  text: तब याहवे ने मूसा से कहा, “अपने लिए एक दहकता साँप[a] बना और उसे एक खंभे[b] पर लगा दे। और ऐसा होगा कि जिस किसी को काटा गया हो, वह उसे देखकर जीवित रहेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का शाब्दिक भाव “दहकता हुआ” है; इसका लिप्यंतरण “साराफ़” भी किया जा सकता है। इस प्रसंग में यह घातक साँप को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “ध्वज,” “निशान” या “संकेत-दंड” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को सामान्य उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: עֲשֵׂה לְךָ
  choice: अपने लिए ... बना
  rationale: आज्ञार्थक क्रिया और मूसा की ओर संकेत करने वाले संप्रदानवाचक सर्वनाम, दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: שָׂרָף
  choice: दहकता साँप
  rationale: शब्द के मूल ‘दहकने/जलने’ के बिंब और इस प्रसंग में साँप के अर्थ—दोनों को रखता है; ‘विषैला साँप’ अधिक व्याख्यात्मक होता और ‘साराफ़’ सामान्य पाठक के लिए अस्पष्ट होता।
- source_word: נֵס
  choice: खंभा
  rationale: इस प्रसंग में उस ऊँचे आधार को स्पष्ट करता है जिस पर साँप रखा जाना था, यद्यपि शब्द ध्वज, निशान या संकेत-दंड भी सूचित कर सकता है।
- source_word: הַנָּשׁוּךְ
  choice: जो कोई काटा गया हो
  rationale: संज्ञीकृत कर्मवाच्य कृदंत के सार्वत्रिक अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְרָאָה אֹתוֹ
  choice: वह उसे देखकर
  rationale: देखने की क्रिया को जीवन मिलने की शर्त के रूप में स्वाभाविक ढंग से व्यक्त करता है और ‘उसे’ के सर्वनाम को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: וָחָי
  choice: जीवित रहेगा
  rationale: जीवन अथवा प्राण बचे रहने के परिणाम को संक्षिप्त और गंभीर शैली में व्यक्त करता है।
theological_decisions:
- issue: שָׂרָף का अर्थ और बिंब
  choice: मुख्य पाठ में ‘दहकता साँप’
  alternative: ‘साराफ़’ या ‘विषैला साँप’
  rationale: कथा में यह घातक साँप का चित्र है। चुना हुआ रूप इब्रानी के दहकने वाले बिंब को बनाए रखता है, बाद की स्वर्गदूतीय धारणाएँ आरोपित नहीं करता और केवल विष की व्याख्या तक अर्थ को सीमित नहीं करता।
- issue: וְרָאָה אֹתוֹ में सर्वनाम का संदर्भ
  choice: ‘उसे’ को अस्पष्ट ही रखा गया
  alternative: ‘उस साँप को’
  rationale: इब्रानी में पुल्लिंग सर्वनाम है; निकटवर्ती संदर्भ साँप की ओर संकेत करता है, पर अनुवाद में संज्ञा जोड़ना स्रोत से अधिक स्पष्टता लाता। अगला पद संदर्भ को स्वयं स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञा की सीधी शैली बनी रहती है। ‘दहकता साँप’ स्रोत के बिंब को सुरक्षित रखता है, जबकि पादटिप्पणियाँ दुर्लभ शब्दों की वास्तविक अर्थ-सीमा बताती हैं।
