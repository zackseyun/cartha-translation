  text: וַ/יִּסְע֞וּ מֵ/הֹ֤ר הָ/הָר֙ דֶּ֣רֶךְ יַם ס֔וּף לִ/סְבֹ֖ב אֶת אֶ֣רֶץ אֱד֑וֹם וַ/תִּקְצַ֥ר נֶֽפֶשׁ הָ/עָ֖ם בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/004.yaml
  text: Then they set out from Mount Hor by the way of the Red Sea[a], to go around the land of Edom[b], and the people became impatient on the way.
translation:
  language: hi
  text: फिर वे होर पर्वत से लाल सागर के मार्ग से होकर एदोम देश का चक्कर लगाने के लिए निकले। मार्ग में लोग अधीर हो गए।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “सरकंडों के सागर की ओर जाने वाले मार्ग से।” हिब्रू: याम सूफ़।'
    reason: lexical_alternative
  - marker: b
    text: या “लोग हताश हो गए” अथवा “लोगों का मन टूट गया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... निकले
  rationale: जंगल की यात्रा-वर्णन शैली में נסע का अर्थ पड़ाव से आगे यात्रा पर निकलना है; ‘निकले’ स्वाभाविक हिन्दी में यही भाव देता है।
- source_word: מֵהֹר הָהָר
  choice: होर पर्वत से
  rationale: हिब्रू स्थान-नाम का प्रचलित और सहज हिन्दी रूप।
- source_word: דֶּרֶךְ יַם סוּף
  choice: लाल सागर के मार्ग से
  rationale: דֶּרֶךְ मार्ग को सूचित करता है और יַם־סוּף का पारंपरिक अनुवाद ‘लाल सागर’ है; शाब्दिक/वैकल्पिक नाम पादटिप्पणी में रखा गया है।
- source_word: לִסְבֹב
  choice: चक्कर लगाने के लिए
  rationale: उद्देश्यसूचक infinitive एदोम को चारों ओर से घूमकर पार करने या उसके इलाके से बचकर जाने को व्यक्त करता है।
- source_word: אֶת אֶרֶץ אֱדוֹם
  choice: एदोम देश
  rationale: אֶרֶץ यहाँ एदोम के भूभाग या देश को दर्शाता है।
- source_word: וַתִּקְצַר נֶפֶשׁ הָעָם
  choice: लोगों का धैर्य टूटने लगा
  rationale: शाब्दिक रूप से ‘लोगों का प्राण/मन छोटा हो गया’; यह मुहावरा अधीरता, हताशा या मन टूटने की दशा बताता है। हिन्दी अभिव्यक्ति भाव को स्वाभाविक रखती है और आरंभिक/विकासशील पहलू को भी व्यक्त करती है।
- source_word: בַּדָּרֶךְ
  choice: मार्ग में
  rationale: בְּ का सीधा स्थानवाचक अर्थ ‘मार्ग में’ है, यद्यपि प्रसंग में मार्ग के कारण होने की छाया भी संभव है।
