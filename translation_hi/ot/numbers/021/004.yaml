translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘लाल सागर’ परिचित पारंपरिक नाम है, जबकि मूल नाम की अनिश्चितता पादटिप्पणी में सुरक्षित है। קצר נפש के मुहावरे में अधीरता और हताशा दोनों की संभावना पादटिप्पणी द्वारा बनाए रखी गई है।
