base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/014.yaml
  text: Therefore it is said in the Book of the Wars of Yahweh[a], “Waheb in Suphah[b], and the wadis of the Arnon.”
translation:
  language: hi
  text: 'इसलिए “याहवे के युद्धों की पुस्तक” में कहा गया है:


    “सूफ़ा में वाहेब[a],


    और अरनोन की घाटियाँ।”[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस उद्धृत इब्रानी पंक्ति का अर्थ अस्पष्ट है; कुछ विद्वान “वाहेब” को स्थान-नाम के बजाय क्रियात्मक कथन का भाग समझते हैं।
    reason: lexical_alternative
  - marker: b
    text: यदि “सूफ़ा” को स्थान-नाम के बजाय सामान्य संज्ञा माना जाए, तो इसका अनुवाद “आँधी में वाहेब” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह निष्कर्ष अथवा स्पष्टीकरण प्रस्तुत करने वाला संबंधसूचक पद है; ‘इसलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: יֵאָמַר
  choice: कहा गया है
  rationale: निफ़अल रूप यहाँ भाववाचक ढंग से एक लिखित उद्धरण का परिचय देता है।
- source_word: בְּסֵפֶר מִלְחֲמֹת יְהוָה
  choice: “याहवे के युद्धों की पुस्तक” में
  rationale: रचना के ज्ञात शीर्षक का भाव बनाए रखते हुए construct chain को स्वाभाविक हिन्दी संबंध-रचना में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֶת וָהֵב
  choice: वाहेब
  rationale: अस्पष्ट काव्य-पंक्ति में इसे संभावित स्थान-नाम मानकर लिप्यंतरित करना किसी अनिश्चित क्रियात्मक अर्थ को थोपने से बचाता है।
- source_word: בְּסוּפָה
  choice: सूफ़ा में
  rationale: मुख्य पाठ में इसे संभावित स्थान-नाम माना गया है; ‘आँधी में’ वाला सामान्य-संज्ञा अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְאֶת הַנְּחָלִים
  choice: और … की घाटियाँ
  rationale: נחל इस भूगोल में जलधारा से कटी घाटी या मौसमी जलमार्ग को सूचित कर सकता है। ‘घाटियाँ’ सामान्य हिन्दी में पठनीय है और भौगोलिक विस्तार को व्यक्त करता है।
- source_word: אַרְנוֹן
  choice: अरनोन
  rationale: नदी और उसके क्षेत्र के पारंपरिक स्थान-नाम का सीधा हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल में प्रयुक्त व्यक्तिगत नाम को सुरक्षित रखा गया है; उसे किसी उपाधि से नहीं बदला गया।
- issue: उद्धृत काव्य-पंक्ति की अस्पष्टता
  choice: वाहेब और सूफ़ा को स्थान-नामों के रूप में रखना
  alternative: वाहेब को क्रियात्मक पद और סופה को ‘आँधी’ समझना
  rationale: इब्रानी पंक्ति अत्यंत कठिन है। मुख्य पाठ संभावित स्थान-नामों को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है और वैकल्पिक अर्थ पादटिप्पणियों में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। प्राचीन ग्रंथ के शीर्षक को उद्धरण-चिह्नों में रखा गया है। कठिन काव्य-पंक्ति की अनिश्चितता को मुख्य पाठ में स्थान-नामों के लिप्यंतरण तथा पादटिप्पणियों में वैकल्पिक अर्थ देकर सुरक्षित रखा गया है।
