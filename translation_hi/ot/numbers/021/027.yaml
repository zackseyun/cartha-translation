- source_word: וְתִכּוֹנֵן
  choice: और दृढ़ किया जाए
  rationale: כון यहाँ नगर को स्थापित, स्थिर या सुदृढ़ किए जाने का भाव देता है; ‘दृढ़ किया जाए’ पहले कर्मवाच्य के समानांतर है।
- source_word: עִיר סִיחוֹן
  choice: सीहोन का नगर
  rationale: इब्रानी संबंधसूचक पद-रचना को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
