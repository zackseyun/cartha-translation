  rationale: द्वितीय पुरुष बहुवचन आज्ञार्थ का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: חֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: תִּבָּנֶה
