base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/011.yaml
  text: They set out from Oboth and camped at Iye-abarim in the wilderness that is opposite Moab[a], toward the sunrise.
translation:
  language: hi
  text: वे ओबोत से चले और मोआब के सामने, सूर्योदय की दिशा में स्थित वीराने में इय्ये-अबारीम[a] पर डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इय्ये-अबारीम” का अर्थ “अबारीम के खंडहर” या “अबारीम के ढेर” भी समझा जा सकता है; यहाँ यह एक स्थान-नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: रवाना हुए
  rationale: जंगल-यात्रा के पड़ाव-वर्णन में נסע का अर्थ डेरा उठाकर आगे चलना है। ‘रवाना हुए’ आधुनिक और स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है।
- source_word: מֵאֹבֹת
  choice: ओबोत से
  rationale: यह स्थान-नाम है; इसलिए इसका अनुवाद न करके देवनागरी में लिप्यंतरण किया गया है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה का ठोस अर्थ पड़ाव डालना या शिविर लगाना है। ‘डेरा डाला’ सामान्य आधुनिक हिन्दी में सहज है।
- source_word: בְּעִיֵּי הָעֲבָרִים
  choice: इय्ये-अबारीम में
  rationale: यात्रा-वृत्तांत में यह पद स्थान-नाम के रूप में प्रयुक्त है, इसलिए मुख्य पाठ में लिप्यंतरण रखा गया है; नाम का शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन, शुष्क या कम आबाद भूभाग को सूचित करता है। ‘वीराना’ यहाँ स्वाभाविक हिन्दी में भौगोलिक वातावरण व्यक्त करता है, बिना इसे केवल रेतीला मरुस्थल मानने के।
- source_word: אֲשֶׁר עַל־פְּנֵי מוֹאָב
  choice: जो मोआब के सामने
  rationale: भौगोलिक प्रयोग में עַל־פְּנֵי का अर्थ ‘सामने’ या ‘सम्मुख’ है। ‘सामने’ मूल की स्थानिक अभिव्यक्ति और कुछ लचीलापन बनाए रखता है।
- source_word: מִמִּזְרַח הַשָּׁמֶשׁ
  choice: सूर्योदय की ओर
  rationale: मूल अभिव्यक्ति सूर्य के उदय से पूर्व दिशा बताती है। ‘सूर्योदय की ओर’ उस चित्रात्मक भाषा को बनाए रखते हुए आधुनिक हिन्दी में समझने योग्य है।
