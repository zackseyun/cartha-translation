- source_word: אֲשֶׁר שָׁם
  choice: वहाँ रहनेवाले
  rationale: यह पदबंध उस स्थान पर उपस्थित एमोरियों को सूचित करता है; हिन्दी में ‘वहाँ रहनेवाले’ सहज और स्पष्ट है।
