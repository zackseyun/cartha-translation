  language: hi
  text: तब मूसा ने याजेर की टोह लेने के लिए लोगों को भेजा। उन्होंने उसके अधीन गाँवों[a] पर अधिकार कर लिया, और उसने वहाँ रहनेवाले एमोरियों को बेदखल कर दिया।
  philosophy: optimal-equivalence
  footnotes:
