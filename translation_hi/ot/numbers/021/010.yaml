  text: וַ/יִּסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וַֽ/יַּחֲנ֖וּ בְּ/אֹבֹֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/010.yaml
  text: Then the sons of Israel set out and camped at Oboth[a].
translation:
  language: hi
  text: तब इस्राएलियों ने कूच किया और ओबोत में पड़ाव डाला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: कूच किया
  rationale: जंगल की यात्रा-सूची में נסע का अर्थ पड़ाव छोड़कर अगले स्थान के लिए निकलना है। ‘कूच किया’ इस क्रमिक यात्रा-भाव को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे जातीय समुदाय का प्रचलित सामूहिक नाम है। ‘इस्राएलियों’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से केवल पुरुषों का संकेत नहीं देता।
- source_word: וַיַּחֲנוּ
  choice: पड़ाव डाला
  rationale: חנה यात्रा के दौरान किसी स्थान पर शिविर लगाने या ठहरने का सामान्य क्रियापद है। ‘पड़ाव डाला’ यात्रा-वृत्तांत के संदर्भ में सहज और स्पष्ट है।
- source_word: בְּאֹבֹת
  choice: ओबोत में
  rationale: אֹבֹת एक स्थान-नाम है, इसलिए उसका अर्थानुवाद न करके देवनागरी में लिप्यंतरण किया गया है। उपसर्ग בְ को हिन्दी में स्थानवाचक ‘में’ से व्यक्त किया गया है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव कथानक की अगली घटना को आगे बढ़ाता है। ‘तब’ पूर्ववर्ती यात्रा-क्रम से इस पद का संबंध स्वाभाविक हिन्दी में स्पष्ट करता है।
