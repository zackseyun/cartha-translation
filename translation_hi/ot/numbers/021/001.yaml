language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁמַ֞ע הַ/כְּנַעֲנִ֤י מֶֽלֶךְ עֲרָד֙ יֹשֵׁ֣ב הַ/נֶּ֔גֶב כִּ֚י בָּ֣א יִשְׂרָאֵ֔ל דֶּ֖רֶךְ הָ/אֲתָרִ֑ים וַ/יִּלָּ֨חֶם֙ בְּ/יִשְׂרָאֵ֔ל וַ/יִּ֥שְׁבְּ מִמֶּ֖/נּוּ שֶֽׁבִי־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/001.yaml
  text: When the Canaanite king of Arad[a], who lived in the Negev, heard that Israel was coming by the way of Atharim, he fought against Israel and took some of them captive.
translation:
  language: hi
  text: जब नेगेव में रहने वाले अराद के कनानी राजा ने सुना कि इस्राएल अतारीम[a] के मार्ग से आ रहा है, तो उसने इस्राएल से युद्ध किया और उनमें से कुछ लोगों को बंदी बना लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “अतारीम के मार्ग से।” “अतारीम” शब्द का अर्थ अनिश्चित है। कुछ इसे किसी स्थान का नाम मानते हैं, जबकि कुछ प्राचीन अनुवादों के आधार पर इसका अर्थ “जासूसों” या “टोही लोगों” का मार्ग समझते हैं।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने सुना
  rationale: कथात्मक संदर्भ में שׁמע का सामान्य अर्थ समाचार सुनना है; ‘सुना’ कारण और प्रतिक्रिया का क्रम स्वाभाविक रूप से बनाए रखता है।
- source_word: הַכְּנַעֲנִי מֶלֶךְ עֲרָד
  choice: अराद के कनानी राजा
  rationale: पदबंध राजा की कनानी पहचान और अराद पर उसके शासन, दोनों को व्यक्त करता है; हिन्दी में यह शब्दक्रम सहज है।
- source_word: יֹשֵׁב הַנֶּגֶב
  choice: नेगेव में रहनेवाले
  rationale: कृदंत स्थायी निवास बताता है। नेगेव को भौगोलिक क्षेत्र के नाम के रूप में रखना ‘दक्षिण’ जैसे सामान्यीकरण से अधिक सटीक है।
- source_word: כִּי בָּא יִשְׂרָאֵל
  choice: कि इस्राएल ... आ रहा है
  rationale: כִּי सुनी गई सूचना का परिचय देता है और בָּא यहाँ इस्राएल के आते हुए आगे बढ़ने को दर्शाता है; हिन्दी वर्तमान अपूर्ण रूप इस परिप्रेक्ष्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: דֶּרֶךְ הָאֲתָרִים
  choice: अतारीम के मार्ग से
  rationale: דֶּרֶךְ मार्ग/रास्ता है। אֲתָרִים अनिश्चित शब्द है; मुख्य पाठ में संभावित स्थाननाम ‘अतारीम’ रखना मूल की अस्पष्टता को बिना सुलझाए सुरक्षित रखता है।
- source_word: וַיִּלָּחֶם בְּיִשְׂרָאֵל
  choice: उसने इस्राएल से युद्ध किया
  rationale: युद्ध-संबंधी क्रिया और בְּ विरोधी मुठभेड़ दर्शाते हैं। ‘युद्ध किया’ संघर्ष का पैमाना बढ़ाकर बताए बिना अर्थ देता है।
- source_word: וַיִּשְׁבְּ מִמֶּנּוּ שֶׁבִי
  choice: उनमें से कुछ लोगों को बंदी बना लिया
  rationale: שׁבה और שֶׁבִי युद्ध में बंदी बनाने का भाव देते हैं। सामूहिक ‘इस्राएल’ की ओर संकेत करने वाला מִמֶּנּוּ हिन्दी में स्वाभाविक अंशवाचक रूप ‘उनमें से कुछ लोगों को’ से व्यक्त होता है।
