  yaml_path: translation/ot/numbers/021/031.yaml
  text: So Israel lived in the land of the Amorites[a].
translation:
  language: hi
  text: इस प्रकार इस्राएल एमोरियों के देश में रहने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישׁב का अर्थ बैठना, रहना या बसना हो सकता है। इस कथात्मक निष्कर्ष में ‘रहने लगा’ स्वाभाविक हिन्दी में वहाँ निवास आरम्भ करने का भाव व्यक्त करता है, पर ‘बस गया’ जैसी अधिक स्थायी स्थापना का अनावश्यक संकेत नहीं देता।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: वाचा के लोगों और नाम के लिए प्रचलित हिन्दी लिप्यंतरण। यहाँ एकवचन क्रिया के साथ यह सामूहिक संज्ञा है।
- source_word: בְּאֶרֶץ
  choice: देश में
  rationale: אֶרֶץ यहाँ किसी निश्चित भूभाग या प्रदेश को दर्शाता है। ‘देश’ आधुनिक हिन्दी में स्वाभाविक है और अधिकार-क्षेत्र का अर्थ बनाए रखता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों के
  rationale: इब्रानी रूप एकवचन जातिवाचक है, पर यहाँ पूरी जाति और उसके भूभाग का सामूहिक उल्लेख है; इसलिए हिन्दी में बहुवचन ‘एमोरियों’ स्वाभाविक है।
