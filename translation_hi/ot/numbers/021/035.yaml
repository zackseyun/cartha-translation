  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण और सहज वाक्य-विन्यास रखा गया है। मूल पाठ की कठोर सैन्य भाषा को नरम नहीं किया गया, और ‘लोगों’ को केवल सैनिकों के अर्थ में सीमित नहीं किया गया है।
