  text: וַ/יַּכּ֨וּ אֹת֤/וֹ וְ/אֶת בָּנָי/ו֙ וְ/אֶת כָּל עַמּ֔/וֹ עַד בִּלְתִּ֥י הִשְׁאִֽיר ל֖/וֹ שָׂרִ֑יד וַ/יִּֽירְשׁ֖וּ אֶת אַרְצֽ/וֹ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/035.yaml
  text: So they struck him down[a], and his sons, and all his people, until he had no survivor left[b]; and they took possession of his land.
translation:
  language: hi
  text: इस प्रकार उन्होंने उसे, उसके पुत्रों और उसके सभी लोगों को मार गिराया, यहाँ तक कि उसका कोई भी जीवित व्यक्ति न बचा; और उन्होंने उसके देश पर अधिकार कर लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: सैन्य प्रसंग में נכה प्रहार करके पराजित करने, और प्रायः मार डालने, का बोध देता है। आगे किसी के जीवित न बचने की बात के कारण यहाँ ‘मार गिराया’ स्वाभाविक और संदर्भानुकूल है।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: בנים यहाँ पुल्लिंग बहुवचन है; इसलिए लिंग-सटीक ‘पुत्रों’ रखा गया है।
- source_word: כָּל עַמּוֹ
  choice: उसके सभी लोगों
  rationale: עם का सामान्य अर्थ ‘लोग/प्रजा’ है। इसे केवल सेना तक सीमित करना मूल पाठ से अधिक विशिष्ट होता।
- source_word: עַד בִּלְתִּי הִשְׁאִיר לוֹ שָׂרִיד
  choice: ऐसा ... कि उसका एक भी जीवित न बचा
  rationale: यह मुहावरा पराजय की पूर्णता व्यक्त करता है। हिंदी में यह रचना स्वाभाविक है और שָׂרִיד को युद्ध-संदर्भ में ‘जीवित’ के रूप में स्पष्ट करती है।
- source_word: וַיִּירְשׁוּ
  choice: अधिकार कर लिया
  rationale: ירשׁ यहाँ विजय के बाद भूमि को अपने कब्जे में लेने का अर्थ देता है; ‘विरासत में पाया’ इस सैन्य संदर्भ में भ्रामक होता।
- source_word: אַרְצוֹ
  choice: उसके देश
  rationale: אֶרֶץ यहाँ ओग के अधीन भूभाग को दर्शाता है। आधुनिक हिंदी में ‘देश’ इस राजनीतिक-भौगोलिक अर्थ को सहजता से व्यक्त करता है।
