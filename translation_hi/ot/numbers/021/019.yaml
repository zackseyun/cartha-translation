  text: וּ/מִ/מַּתָּנָ֖ה נַחֲלִיאֵ֑ל וּ/מִ/נַּחֲלִיאֵ֖ל בָּמֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/019.yaml
  text: And from Mattanah to Nahaliel[a], and from Nahaliel to Bamoth.
translation:
  language: hi
  text: और मत्ताना से नहलीएल, और नहलीएल से बामोत[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द “बामोत” का अर्थ “ऊँचाइयाँ” या “ऊँचे स्थान” भी हो सकता है, पर यहाँ यात्रा के पड़ावों की सूची में इसे किसी स्थान का नाम समझना अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּ/מִ/מַּתָּנָה
  choice: और मत्ताना से
  rationale: וּ को ‘और’ तथा מִן को ‘से’ के रूप में व्यक्त किया गया है। मत्ताना यात्रा-वृत्तांत में स्थान का नाम है, इसलिए उसका लिप्यंतरण किया गया है।
- source_word: נַחֲלִיאֵל
  choice: नहलीएल
  rationale: यहाँ पूर्वसर्ग नहीं लिखा है, पर यात्रा-सूची की संक्षिप्त शैली में अगले पड़ाव की ओर गति निहित है। हिन्दी में पहले ‘से’ के साथ ‘नहलीएल’ कहना स्वाभाविक रूप से गंतव्य को स्पष्ट करता है; अलग से ‘तक’ जोड़ना आवश्यक नहीं।
- source_word: וּ/מִ/נַּחֲלִיאֵל
  choice: और नहलीएल से
  rationale: וּ का अनुवाद ‘और’, מִן का ‘से’ किया गया है और स्थान-नाम का रूप एकसमान रखा गया है।
- source_word: בָּמֽוֹת
  choice: बामोत
  rationale: इस यात्रा-वृत्तांत में इसे स्थान-नाम मानकर लिप्यंतरित किया गया है। हिब्रू शब्द का सामान्य अर्थ ‘ऊँचाइयाँ’ या ‘ऊँचे स्थान’ भी हो सकता है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
