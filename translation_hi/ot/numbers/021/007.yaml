base_translation:
  language: en
  yaml_path: translation/ot/numbers/021/007.yaml
  text: Then the people came to Moses and said[a], “We have sinned, for we have spoken against Yahweh and against you. Pray to Yahweh, that he may take away the serpent from us.” So Moses prayed for the people.
translation:
  language: hi
  text: तब लोग मूसा के पास आए और कहा, “हमने पाप किया है, क्योंकि हमने यहोवा के विरुद्ध और आपके विरुद्ध बातें की हैं। यहोवा से प्रार्थना कीजिए कि वह साँप[a] को हम पर से हटा दे।” तब मूसा ने लोगों के लिए प्रार्थना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साँपों के प्रकोप को।” इब्रानी संज्ञा एकवचन है, पर संभव है कि वह सामूहिक रूप से साँपों के प्रकोप का संकेत करती हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא הָעָם
  choice: तब लोग ... आए
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; सामूहिक संज्ञा הָעָם को स्वाभाविक आधुनिक हिन्दी में बहुवचन ‘लोग’ से व्यक्त किया गया है।
- source_word: חָטָאנוּ
  choice: हमने पाप किया है
  rationale: पूर्ण क्रिया अतीत के कार्य और स्वीकारोक्ति के समय उसकी वर्तमान प्रासंगिकता दोनों व्यक्त करती है।
- source_word: דִבַּרְנוּ בַיהוָה וָבָךְ
  choice: हमने यहोवा के विरुद्ध और आपके विरुद्ध बातें की हैं
  rationale: דבר के साथ ב यहाँ विरोध में बोलने का अर्थ देता है; दोनों कर्मों के साथ ‘विरुद्ध’ दोहराने से समानांतरता स्पष्ट रहती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: הִתְפַּלֵּל אֶל יְהוָה
  choice: यहोवा से प्रार्थना कीजिए
  rationale: हित्पएल रूप का सीधा और स्वाभाविक अर्थ ‘प्रार्थना करना’ है; प्रसंग स्वयं मध्यस्थता का भाव स्पष्ट करता है।
- source_word: וְיָסֵר מֵעָלֵינוּ
  choice: कि वह ... हमारे बीच से हटा दे
  rationale: आज्ञार्थक ‘प्रार्थना कीजिए’ के बाद यह अनुरोध की विषयवस्तु व्यक्त करता है। ‘हमारे बीच से’ विपत्ति को समुदाय से दूर करने का स्वाभाविक हिन्दी रूप है।
- source_word: אֶת הַנָּחָשׁ
  choice: साँप
  rationale: נָחָשׁ का सामान्य, ठोस और आधुनिक हिन्दी पर्याय ‘साँप’ है। मूल का एकवचन मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: וַיִּתְפַּלֵּל מֹשֶׁה בְּעַד הָעָם
  choice: तब मूसा ने लोगों के लिए प्रार्थना की
  rationale: בְּעַד किसी के पक्ष में मध्यस्थ प्रार्थना को दर्शाता है; ‘लोगों के लिए प्रार्थना की’ स्पष्ट और सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: इब्रानी पाठ विशिष्ट नाम का प्रयोग करता है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ से नाम और उपाधि का भेद बना रहता है।
- issue: एकवचन הַנָּחָשׁ का आशय
  choice: साँप
  alternative: साँपों का प्रकोप
  rationale: मुख्य पाठ इब्रानी एकवचन को बनाए रखता है और यह निर्धारित नहीं करता कि संकेत किसी एक साँप की ओर है या साँपों के प्रकोप की ओर सामूहिक रूप से।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लोगों द्वारा मूसा को संबोधित करते समय आदरसूचक ‘आप’ और ‘कीजिए’ प्रयुक्त हैं। मूल का एकवचन ‘साँप’ बिना व्याख्यात्मक विस्तार के सुरक्षित है।
