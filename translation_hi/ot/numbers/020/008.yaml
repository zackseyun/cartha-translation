  text: קַ֣ח אֶת הַ/מַּטֶּ֗ה וְ/הַקְהֵ֤ל אֶת הָ/עֵדָה֙ אַתָּה֙ וְ/אַהֲרֹ֣ן אָחִ֔י/ךָ וְ/דִבַּרְתֶּ֧ם אֶל הַ/סֶּ֛לַע לְ/עֵינֵי/הֶ֖ם וְ/נָתַ֣ן מֵימָ֑י/ו וְ/הוֹצֵאתָ֨ לָ/הֶ֥ם מַ֨יִם֙ מִן הַ/סֶּ֔לַע וְ/הִשְׁקִיתָ֥ אֶת הָ/עֵדָ֖ה וְ/אֶת בְּעִירָֽ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/008.yaml
  text: Take the staff[a], and assemble the congregation, you and Aaron your brother, and speak to the rock before their eyes, and it will give its water[d][c][b]. Then you shall bring out water for them from the rock and give drink to the congregation and to their livestock.
translation:
  language: hi
  text: “लाठी[a] ले लो और तुम अपने भाई हारून के साथ समुदाय को इकट्ठा करो। उनकी आँखों के सामने चट्टान से बोलो, और वह अपना पानी देगी। तब तुम उनके लिए चट्टान से पानी निकालोगे और समुदाय तथा उनके पशुओं को पानी पिलाओगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छड़ी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּטֶּה
  choice: लाठी
  rationale: מַטֶּה यहाँ मूसा द्वारा ली जाने वाली छड़ी या लाठी को दर्शाता है। आधुनिक हिन्दी में ‘लाठी’ सहज और प्रसंगानुकूल है; ‘छड़ी’ भी सम्भव है।
- source_word: הָעֵדָה
  choice: समुदाय
  rationale: עֵדָה एकत्रित इस्राएली जनसमुदाय को दर्शाता है। ‘समुदाय’ आधुनिक पाठक के लिए स्पष्ट है और सामूहिक अर्थ को बनाए रखता है।
- source_word: וְדִבַּרְתֶּם אֶל הַסֶּלַע
  choice: चट्टान से कहो
  rationale: דבר אל का सामान्य अर्थ ‘से बोलना/कहना’ है। हिब्रू क्रिया बहुवचन है, जिसमें मूसा और हारून दोनों सम्मिलित हैं; हिन्दी में संयुक्त कर्ता और ‘कहो’ इसे स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: לְעֵינֵיהֶם
  choice: उनकी आँखों के सामने
  rationale: यह पदबंध सार्वजनिक दृश्यता पर बल देता है। शाब्दिक बिंब हिन्दी में भी स्वाभाविक है और कथानक के लिए महत्त्वपूर्ण है।
- source_word: וְנָתַן מֵימָיו
  choice: कि वह अपना पानी दे
  rationale: एकवचन क्रिया का कर्ता चट्टान है, और प्रत्यय ‘उसका/अपना पानी’ दर्शाता है। ‘अपना पानी दे’ इस असामान्य किंतु जानबूझकर प्रयुक्त अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וְהוֹצֵאתָ לָהֶם מַיִם מִן הַסֶּלַע
  choice: तब तुम उनके लिए चट्टान से पानी निकालोगे
  rationale: יצא का हिफ़ील रूप ‘बाहर निकालना’ है। ‘तब’ आज्ञाओं के क्रम को स्पष्ट करता है, जबकि भविष्यत् रूप यहाँ निर्देशात्मक बल रखता है।
- source_word: וְהִשְׁקִיתָ
  choice: पानी पिलाओगे
  rationale: שקה का हिफ़ील रूप किसी को पीने के लिए देना है। ‘पानी पिलाना’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: בְּעִירָם
  choice: उनके पशुओं
  rationale: בְּעִיר घरेलू पशुओं या भार ढोने वाले पशुओं के लिए व्यापक शब्द है। ‘पशु’ अनावश्यक संकीर्णता से बचता है।
- source_word: אַתָּה וְאַהֲרֹן אָחִיךָ
  choice: तुम और तुम्हारा भाई हारून
  rationale: मूल पाठ दोनों अगुओं को स्पष्ट रूप से निर्दिष्ट करता है। हिन्दी में सम्बन्ध और नाम का यह क्रम स्वाभाविक है।
theological_decisions:
- issue: चमत्कार की आज्ञा का सार्वजनिक स्वरूप
  choice: ‘उनकी आँखों के सामने’ कहकर सार्वजनिक दृश्यता को स्पष्ट रखा गया है।
  alternative: ‘उनके सामने’ या ‘उनके देखते हुए’
  rationale: לְעֵינֵיהֶם का आँखों वाला बिंब इस बात पर बल देता है कि चट्टान से कहना लोगों की दृष्टि में होना था; यह आगे के कथानक की नैतिक और धार्मिक गंभीरता से जुड़ा है।
- issue: चट्टान से बोलने की आज्ञा
  choice: मूसा और हारून दोनों को सम्मिलित करते हुए ‘चट्टान से कहो’ रखा गया है।
  alternative: केवल मूसा को संबोधित मानना या ‘चट्टान को आदेश दो’ कहना
  rationale: וְדִבַּרְתֶּם बहुवचन है और मूल पाठ केवल बोलने की बात कहता है; ‘आदेश दो’ अनावश्यक रूप से स्वर को अधिक कठोर बनाता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष वचन के भीतर आज्ञा और प्रतिज्ञा/परिणाम का क्रम सुरक्षित है। ‘समुदाय’, ‘चट्टान’ और ‘पशु’ सामान्य आधुनिक हिन्दी के स्पष्ट शब्द हैं; ‘उनकी आँखों के सामने’ मूल हिब्रू के सार्वजनिक-दृश्यता वाले बिंब को बनाए रखता है।
