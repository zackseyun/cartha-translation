  text: וְ/לָ/מָ֤ה הֶֽעֱלִיתֻ֨/נוּ֙ מִ/מִּצְרַ֔יִם לְ/הָבִ֣יא אֹתָ֔/נוּ אֶל הַ/מָּק֥וֹם הָ/רָ֖ע הַ/זֶּ֑ה לֹ֣א מְק֣וֹם זֶ֗רַע וּ/תְאֵנָ֤ה וְ/גֶ֨פֶן֙ וְ/רִמּ֔וֹן וּ/מַ֥יִם אַ֖יִן לִ/שְׁתּֽוֹת־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/005.yaml
  text: And why have you brought us up out of Egypt to bring us into this evil place? It is not a place of grain[a], or figs, or vines, or pomegranates[c][b], and there is no water to drink.
translation:
  language: hi
  text: और तुम हमें मिस्र से निकालकर ऊपर क्यों लाए, हमें इस बुरी जगह[b] में ले आने के लिए? यह बोआई के योग्य स्थान नहीं है; यहाँ अंजीर, अंगूर की बेलें या अनार भी नहीं हैं, और पीने के लिए पानी भी नहीं है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘बीज की जगह’ है; इसका अर्थ बोआई के योग्य भूमि या अनाज और दूसरी फसलें उपजाने वाली जगह हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘बुरी जगह’ का आशय यहाँ हानिकारक, खराब या अत्यंत अप्रिय जगह से है; यह आवश्यक नहीं कि नैतिक बुराई को दर्शाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָה
  choice: और ... क्यों
  rationale: संयोजक वाव को रखकर पिछले कथन से शिकायत का प्रवाह बनाए रखा गया है।
- source_word: הֶעֱלִיתֻנוּ מִמִּצְרַיִם
  choice: हमें मिस्र से निकालकर ऊपर ... लाए
  rationale: हिफ़ील रूप का अर्थ ‘ऊपर ले आना’ है; ‘निकालकर ऊपर लाए’ मिस्र से निर्गमन और मूल आरोहण-रूपक दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְהָבִיא אֹתָנוּ
  choice: क्या इसलिए कि हमें ... ले आओ
  rationale: उद्देश्यसूचक infinitive को शिकायत के स्वाभाविक हिन्दी प्रश्न में व्यक्त किया गया है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: אֶל־הַמָּקוֹם הָרָע הַזֶּה
  choice: इस बुरी जगह में
  rationale: רַע की तीव्र नकारात्मकता रखी गई है; यहाँ ‘बुरी’ जगह के हानिकारक या अत्यंत अप्रिय होने को बताता है, अनिवार्यतः नैतिक बुराई को नहीं।
- source_word: לֹא מְקוֹם זֶרַע
  choice: यह न तो बोआई के योग्य जगह है
  rationale: शाब्दिक ‘बीज की जगह नहीं’ कृषि-संदर्भ में ऐसी भूमि को सूचित करता है जो बोआई के योग्य नहीं; यह हिन्दी में स्पष्ट और स्वाभाविक है, जबकि अस्पष्टता पादटिप्पणी में सुरक्षित है।
- source_word: וּתְאֵנָה וְגֶפֶן וְרִמּוֹן
  choice: न यहाँ अंजीर, अंगूर की बेलें या अनार हैं
  rationale: एकवचन सामूहिक संज्ञाओं को हिन्दी में प्राकृतिक सूची के रूप में दिया गया है; גֶפֶן को स्पष्टतः ‘अंगूर की बेलें’ कहा गया है।
- source_word: וּמַיִם אַיִן לִשְׁתּוֹת
  choice: और पीने के लिए पानी भी नहीं है
  rationale: अस्तित्व-निषेध और प्रयोजनसूचक infinitive का सहज हिन्दी रूप; ‘भी’ शिकायत की समापनात्मक तीव्रता को स्वाभाविक रूप से दर्शाता है।
