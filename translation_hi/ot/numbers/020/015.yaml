  yaml_path: translation/ot/numbers/020/015.yaml
  text: And our fathers went down to Egypt[a], and we lived in Egypt many days[c][b], and the Egyptians treated us and our fathers badly.
translation:
  language: hi
  text: और हमारे पूर्वज[a] मिस्र गए, और हम मिस्र में बहुत दिनों तक रहे[b], और मिस्रियों ने हमारे साथ और हमारे पूर्वजों के साथ बुरा व्यवहार किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से “हमारे पिता”; यहाँ अर्थ “हमारे पूर्वज” है, और यही शब्द पद्य में दोनों बार आता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बहुत दिन”; इसका अर्थ एक लंबी अवधि है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “हमारे साथ और हमारे पूर्वजों के साथ दुर्व्यवहार किया” या “हमारे साथ और हमारे पूर्वजों के साथ बुराई की” भी हो सकता है।
    reason: lexical_alternative
