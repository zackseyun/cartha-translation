id: NUM.20.4
reference: Numbers 20:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָ/מָ֤ה הֲבֵאתֶם֙ אֶת קְהַ֣ל יְהוָ֔ה אֶל הַ/מִּדְבָּ֖ר הַ/זֶּ֑ה לָ/מ֣וּת שָׁ֔ם אֲנַ֖חְנוּ וּ/בְעִירֵֽ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/004.yaml
  text: And why have you brought the assembly of Yahweh into this wilderness[a], that we and our livestock should die there?
translation:
  language: hi
  text: और तुम याहवे की सभा[a] को इस वीराने में क्यों ले आए कि हम और हमारे पशुधन वहाँ मर जाएँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की मंडली।”
    reason: קהל के लिए निकट अर्थ वाला वैकल्पिक सामुदायिक पद।
lexical_decisions:
- source_word: וְלָמָה
  choice: और ... क्यों
  rationale: संयोजक वाव और प्रश्नवाचक अभिव्यक्ति दोनों को बनाए रखते हुए पिछले कथन से शिकायत का संबंध दिखाता है।
- source_word: הֲבֵאתֶם
  choice: तुम ... ले आए
  rationale: בוא के हिफ़ील रूप का अर्थ ‘ले आना’ है; हिन्दी में यह पूर्ण हुई क्रिया और उसके वर्तमान परिणाम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קְהַל יְהוָה
  choice: याहवे की सभा
  rationale: קהל इकट्ठे हुए समुदाय को दर्शाता है। ‘सभा’ आधुनिक, सहज और सामूहिक अर्थ को सुरक्षित रखने वाला शब्द है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶל הַמִּדְבָּר הַזֶּה
  choice: इस वीराने में
  rationale: מִדְבָּר निर्जन वन्य क्षेत्र या मरुभूमि को सूचित कर सकता है। ‘वीराना’ केवल रेतीले रेगिस्तान तक अर्थ सीमित नहीं करता और प्रसंग में स्वाभाविक है।
- source_word: לָמוּת שָׁם
  choice: यहाँ मर जाएँ
  rationale: स्थान वक्ताओं के वर्तमान दृष्टिकोण से वही वीराना है, इसलिए हिन्दी में ‘यहाँ’ स्वाभाविक है; infinitive को उद्देश्य अथवा परिणाम की आशंका के रूप में व्यक्त किया गया है।
- source_word: אֲנַחְנוּ וּבְעִירֵנוּ
  choice: हम और हमारे पशु
  rationale: בְּעִיר सामूहिक रूप से पालतू पशुधन को दर्शाता है; ‘हमारे पशु’ सामान्य पाठक के लिए स्पष्ट और सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: לָמוּת से व्यक्त उद्देश्य या परिणाम
  choice: ताकि हम और हमारे पशु यहाँ मर जाएँ
  alternative: जिससे हम और हमारे पशु यहाँ मर जाएँ
  rationale: यह शिकायत मूसा और हारून पर जानबूझकर मृत्यु के लिए लाने का आरोप जैसी सुनाई देती है, पर इब्रानी infinitive उद्देश्य और परिणाम दोनों की छाया रख सकता है। ‘ताकि’ आरोपात्मक स्वर को स्वाभाविक रूप से व्यक्त करता है, बिना उसे कथावाचक का तथ्य घोषित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक शिकायत के अनुकूल रखी गई है। ‘तुम’ बहुवचन रूप से मूसा और हारून को संबोधित करता है। ‘वीराना’ को ‘रेगिस्तान’ पर इसलिए वरीयता दी गई है कि मूल शब्द का भू-दृश्य केवल रेतीले मरुस्थल तक सीमित नहीं है।
