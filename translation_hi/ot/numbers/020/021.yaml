  yaml_path: translation/ot/numbers/020/021.yaml
  text: But Edom refused to let Israel pass through his territory[a], so Israel turned away from him.
translation:
  language: hi
  text: पर एदोम ने इस्राएल को अपने क्षेत्र से होकर जाने की अनुमति देने से इनकार कर दिया। इसलिए इस्राएल उससे हट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְמָאֵן
  choice: इनकार कर दिया
  rationale: מָאֵן यहाँ अनुमति देने से स्पष्ट मना करने को दर्शाता है; आधुनिक हिन्दी में ‘इनकार कर दिया’ स्वाभाविक और पर्याप्त रूप से दृढ़ है।
- source_word: אֱדוֹם
  choice: एदोम
  rationale: राष्ट्र और उसके प्रतिनिधि शासक/लोगों के लिए प्रयुक्त इब्रानी व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: נְתֹן
  choice: अनुमति देने
  rationale: מָאֵן के साथ נְתֹן यहाँ शाब्दिक ‘देने’ के बजाय किसी कार्य की अनुमति देने का मुहावरेदार अर्थ रखता है।
- source_word: עֲבֹר
  choice: से होकर जाने
  rationale: भूभाग के संदर्भ में עָבַר का आशय उस क्षेत्र के भीतर से पार होकर आगे जाना है।
- source_word: בִּגְבֻלוֹ
  choice: अपने इलाके से
  rationale: גְּבוּל का अर्थ सीमा भी हो सकता है, पर यहाँ माँगा गया मार्ग एदोम के भूभाग से होकर था; ‘इलाका’ साधारण आधुनिक हिन्दी में इस स्थानिक अर्थ को सहजता से व्यक्त करता है।
- source_word: וַיֵּט
  choice: दूर मुड़ गया
  rationale: נָטָה मार्ग बदलकर अलग हटने या मुड़ने को दर्शाता है; ‘दूर मुड़ गया’ अगले पद की दिशा और एदोम से दूरी—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעָלָיו
  choice: उससे दूर
  rationale: यह पदबंध एदोम के पास/सामने से हट जाने का संकेत देता है; हिन्दी में ‘उससे दूर’ गति की दिशा स्पष्ट करता है।
