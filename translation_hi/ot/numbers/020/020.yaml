  text: But he said[c][b][a], “You shall not pass through.” And Edom came out to meet him with a large force and with a strong hand.
translation:
  language: hi
  text: पर उसने कहा, “तुम यहाँ से होकर नहीं जाओगे।” तब एदोम एक बड़ी सेना[a] और बलवान हाथ[b] के साथ उससे मिलने[c] निकल आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “भारी लोगों के साथ”; यह मुहावरा एक बड़े या प्रभावशाली जनबल को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “प्रबल शक्ति के साथ।”
    reason: lexical_alternative
  - marker: c
    text: या “उसका सामना करने”; हिब्रू अभिव्यक्ति अपने आप में तटस्थ है, पर यहाँ प्रसंग स्पष्टतः शत्रुतापूर्ण है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर उसने कहा
  rationale: वाव-वर्णन क्रम को आगे बढ़ाता है, जबकि प्रसंग में इस्राएल के अनुरोध के विपरीत उत्तर होने के कारण ‘पर’ विरोध का भाव स्वाभाविक रूप से व्यक्त करता है। कर्ता को मूल की तरह संदर्भ से समझने के लिए ‘उसने’ रखा गया है।
- source_word: לֹא תַעֲבֹר
  choice: तुम यहाँ से होकर नहीं जाओगे
  rationale: अपूर्ण क्रिया यहाँ दृढ़ निषेध अथवा अनुमति न देने को व्यक्त करती है। ‘यहाँ से होकर’ किसी भूभाग को पार करने का आशय सहज हिन्दी में स्पष्ट करता है।
- source_word: וַיֵּצֵא אֱדוֹם
  choice: तब एदोम ... निकल आया
  rationale: יצא का मूल अर्थ निकलना है। ‘निकल आया’ सैन्य चढ़ाई का अर्थ अनावश्यक रूप से आरोपित किए बिना विरोध के लिए आगे आने को व्यक्त करता है।
- source_word: לִקְרָאתוֹ
  choice: उसका सामना करने
  rationale: לִקְרַאת अपने आप में मिलने या सामने आने का तटस्थ भाव रखता है, पर यहाँ स्पष्टतः शत्रुतापूर्ण प्रसंग है। ‘सामना करने’ हिन्दी में दोनों पहलुओं को पर्याप्त रूप से बनाए रखता है; पादटिप्पणी अधिक शाब्दिक विकल्प देती है।
- source_word: בְּעַם כָּבֵד
  choice: एक बड़ी सेना
  rationale: शाब्दिक अर्थ ‘भारी लोगों/जनसमूह के साथ’ है। प्रसंग में इसका आशय बड़ी और प्रभावशाली सैन्य टुकड़ी से है; ‘बड़ी सेना’ आधुनिक हिन्दी में मुहावरे का स्वाभाविक अर्थ देता है।
- source_word: וּבְיָד חֲזָקָה
  choice: और बलवन्त हाथ के साथ
  rationale: ‘बलवन्त हाथ’ हिब्रू के शक्ति-सूचक शारीरिक बिम्ब को बचाता है और दृढ़ सामर्थ्य या बल का अर्थ व्यक्त करता है।
