  text: וַ/יַּפְשֵׁט֩ מֹשֶׁ֨ה אֶֽת אַהֲרֹ֜ן אֶת בְּגָדָ֗י/ו וַ/יַּלְבֵּ֤שׁ אֹתָ/ם֙ אֶת אֶלְעָזָ֣ר בְּנ֔/וֹ וַ/יָּ֧מָת אַהֲרֹ֛ן שָׁ֖ם בְּ/רֹ֣אשׁ הָ/הָ֑ר וַ/יֵּ֧רֶד מֹשֶׁ֛ה וְ/אֶלְעָזָ֖ר מִן הָ/הָֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/028.yaml
  text: So Moses stripped Aaron of his garments and put them on Eleazar his son[a], and Aaron died there on the top of the mountain[b]. Then Moses and Eleazar came down from the mountain.
translation:
  language: hi
  text: तब मूसा ने हारून के वस्त्र उतारकर उन्हें उसके पुत्र एलआज़ार को पहना दिए[a]। और हारून वहीं पहाड़ की चोटी पर मर गया[b]। तब मूसा और एलआज़ार पहाड़ से नीचे उतर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् आसपास के प्रसंग के अनुसार, हारून के पद से जुड़े याजकीय वस्त्र उत्तराधिकार के रूप में एलआज़ार को सौंपे गए।
    reason: cultural_note
  - marker: b
    text: या “पहाड़ के शिखर पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּפְשֵׁט
  choice: वस्त्र उतारकर
  rationale: हिफ़ील रूप का अर्थ किसी के कपड़े उतारना है। यह चयन क्रिया को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בְּגָדָיו
  choice: उसके वस्त्र
  rationale: בגד सामान्यतः कपड़े या वस्त्र को दर्शाता है। 'वस्त्र' गरिमापूर्ण है और मूल पाठ में स्पष्ट रूप से न आए 'याजकीय' को मुख्य पाठ में नहीं जोड़ता।
- source_word: וַיַּלְבֵּשׁ אֹתָם אֶת אֶלְעָזָר בְּנוֹ
  choice: उसके पुत्र एलआज़ार को पहना दिए
  rationale: हिफ़ील לבש का अर्थ किसी को पहनाना है। हिंदी में यह संरचना स्वाभाविक है और 'उन्हें' की जगह पहले उल्लिखित वस्त्रों का आशय स्पष्ट रखती है।
- source_word: וַיָּמָת
  choice: मर गया
  rationale: מות मृत्यु के लिए सामान्य, सीधा क्रियापद है; व्यंजना या शिष्टोक्ति नहीं जोड़ी गई।
- source_word: שָׁם
  choice: वहीं
  rationale: स्थान-सूचक अव्यय को स्पष्ट रखा गया है; 'वहीं' पिछले संदर्भित स्थान पर बल को सहज हिंदी में व्यक्त करता है।
- source_word: בְּרֹאשׁ הָהָר
  choice: पहाड़ की चोटी पर
  rationale: רֹאשׁ का शाब्दिक अर्थ 'सिर' और स्थान-संबंधी अर्थ 'चोटी/शिखर' है। 'चोटी' सामान्य आधुनिक हिंदी में स्पष्ट है।
- source_word: וַיֵּרֶד
  choice: नीचे उतर आए
  rationale: ירד नीचे जाने या उतरने को दर्शाता है। कथा-दृष्टि में लौटने की गति के लिए 'उतर आए' स्वाभाविक है।
- source_word: מִן הָהָר
  choice: पहाड़ से
  rationale: מן के स्रोत-बोध को संक्षिप्त और सीधी हिंदी में व्यक्त किया गया है।
theological_decisions:
- issue: एलआज़ार को दिए गए हारून के वस्त्रों का स्वरूप
  choice: मुख्य पाठ में केवल 'वस्त्र' रखा गया
  alternative: '''याजकीय वस्त्र'' या ''महायाजकीय वस्त्र'''
  rationale: आसपास का प्रसंग इन्हें हारून के पद से जुड़े याजकीय वस्त्र बताता है, पर इस पद में सामान्य संज्ञा בְּגָדִים है। इसलिए मुख्य पाठ मूल की अभिव्यक्ति से आगे नहीं जाता; उत्तराधिकार का सांस्कृतिक-पदगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण कथात्मक शैली। 'वस्त्र', 'चोटी' और 'उतर आए' जैसे परिचित शब्द चुने गए हैं। मुख्य पाठ में मूल से अधिक पदगत विवरण नहीं जोड़ा गया, और दोनों पादटिप्पणी-चिह्न [a], [b] संबंधित स्थानों पर दिए गए हैं।
