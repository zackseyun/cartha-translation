reference: Numbers 20:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֥ח מֹשֶׁ֛ה אֶת הַ/מַּטֶּ֖ה מִ/לִּ/פְנֵ֣י יְהוָ֑ה כַּ/אֲשֶׁ֖ר צִוָּֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/009.yaml
  text: So Moses took the staff from before Yahweh[a], just as he had commanded him.
translation:
  language: hi
  text: तब मूसा ने याहवे के सामने से वह लाठी[a] ले ली, ठीक वैसे ही जैसे उसने उसे आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘छड़ी।’
    reason: מַטֶּה के लिए संदर्भानुकूल वैकल्पिक शब्द।
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले ली
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है। स्त्रीलिंग ‘ली’ का संबंध ‘लाठी’ से है; इससे मूल क्रिया में कोई अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस नाम का प्रचलित और सहज रूप ‘मूसा’ है।
- source_word: הַמַּטֶּה
  choice: वह लाठी
  rationale: מַטֶּה यहाँ किसी गोत्र के लिए नहीं, बल्कि एक भौतिक लाठी के लिए प्रयुक्त हुआ है। निश्चित उपपद को संदर्भसूचक ‘वह’ से व्यक्त किया गया है। ‘छड़ी’ भी संभव है और पादटिप्पणी में दी गई है।
- source_word: מִלִּפְנֵי
  choice: के सामने से
  rationale: यह स्थानसूचक पदबंध है, जिसका ठोस अर्थ ‘के सामने से’ है। इससे उपासना-स्थान का संदर्भ बना रहता है और ‘उपस्थिति’ जैसा विस्तार अनावश्यक रूप से नहीं जोड़ा जाता।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पद पहले दी गई आज्ञा के साथ पूर्ण अनुरूपता प्रकट करता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: צִוָּהוּ
  choice: उसने उसे आज्ञा दी थी
  rationale: क्रिया का अर्थ ‘उसने उसे आज्ञा दी’ है। हिन्दी का पूर्ण भूतकाल यह स्पष्ट करता है कि आज्ञा लाठी लेने से पहले दी गई थी, जबकि मूल के सर्वनाम बनाए रखे गए हैं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: צִוָּהוּ में कर्ता का संकेत
  choice: उसने उसे आज्ञा दी थी
  alternative: याहवे ने मूसा को आज्ञा दी थी
  rationale: संदर्भ में कर्ता याहवे और कर्म मूसा है, पर मूल पाठ दोनों को सर्वनामों से व्यक्त करता है। सर्वनाम बनाए रखने से मूल की अभिव्यक्ति और उसकी व्याकरणिक संक्षिप्तता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘के सामने से’ मूल के स्थानसूचक भाव को सुरक्षित रखता है, और वाक्य की कथात्मक गति के लिए आरंभ में ‘तब’ प्रयुक्त है।
