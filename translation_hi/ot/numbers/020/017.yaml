source:
  edition: WLC
  text: נַעְבְּרָה נָּ֣א בְ/אַרְצֶ֗/ךָ לֹ֤א נַעֲבֹר֙ בְּ/שָׂדֶ֣ה וּ/בְ/כֶ֔רֶם וְ/לֹ֥א נִשְׁתֶּ֖ה מֵ֣י בְאֵ֑ר דֶּ֧רֶךְ הַ/מֶּ֣לֶךְ נֵלֵ֗ךְ לֹ֤א נִטֶּה֙ יָמִ֣ין וּ/שְׂמֹ֔אול עַ֥ד אֲשֶֽׁר נַעֲבֹ֖ר גְּבוּלֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/017.yaml
  text: Please let us pass through your land[a]. We will not pass through field or vineyard, and we will not drink water from a well. We will go by the king’s road[b]; we will not turn to the right or to the left until we have passed through your border.
translation:
  language: hi
  text: कृपया हमें अपने देश से होकर जाने दें। हम किसी खेत या दाख की बारी से होकर नहीं जाएँगे और किसी कुएँ का पानी नहीं पिएँगे। हम राजमार्ग[a] पर ही चलेंगे और जब तक आपके देश की सीमा से बाहर न निकल जाएँ[b], तब तक न दाएँ मुड़ेंगे, न बाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “राजा का मार्ग।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “जब तक हम तुम्हारी सीमा पार न कर लें”; अर्थात् तुम्हारे भूभाग से बाहर निकल जाएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעְבְּרָה נָּא בְאַרְצֶךָ
  choice: कृपया हमें अपने देश से होकर जाने दें
  rationale: सहगामी रूप और נָא विनम्र अनुरोध व्यक्त करते हैं; עבר के साथ בְ यहाँ किसी भूभाग से होकर जाने का भाव देता है।
- source_word: לֹא נַעֲבֹר בְּשָׂדֶה וּבְכֶרֶם
  choice: हम किसी खेत या दाख की बारी से होकर नहीं जाएँगे
  rationale: एकवचन संज्ञाएँ सामान्य श्रेणियों के अर्थ में हैं; ‘किसी ... या ...’ आधुनिक हिन्दी में निषेध का आशय स्पष्ट करता है।
- source_word: וְלֹא נִשְׁתֶּה מֵי בְאֵר
  choice: और किसी कुएँ का पानी नहीं पिएँगे
  rationale: מֵי בְאֵר का सीधा अर्थ ‘कुएँ का पानी’ है; ‘किसी’ सामान्य निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דֶּרֶךְ הַמֶּלֶךְ נֵלֵךְ
  choice: हम राजमार्ग पर ही चलेंगे
  rationale: शाब्दिक रूप से ‘राजा का मार्ग’; प्रसंग में यह मान्य मुख्य शाही मार्ग है। ‘ही’ आगे आने वाले मार्ग से न हटने के आश्वासन को स्वाभाविक रूप से उभारता है।
- source_word: לֹא נִטֶּה יָמִין וּשְׂמֹאול
  choice: न दाएँ मुड़ेंगे, न बाएँ
  rationale: इब्रानी दिशात्मक युग्म को संक्षिप्त और मुहावरेदार हिन्दी में सुरक्षित रखा गया है।
- source_word: עַד אֲשֶׁר נַעֲבֹר גְּבוּלֶךָ
  choice: जब तक आपके देश की सीमा से बाहर न निकल जाएँ
  rationale: גְּבוּל ‘सीमा’ या ‘क्षेत्र’ हो सकता है। यहाँ आशय एदोम के भूभाग को पार करके उसकी सीमा के बाहर निकलना है; यह हिन्दी उस स्थानिक अर्थ को अस्पष्ट ‘सीमा से होकर’ की अपेक्षा स्पष्ट करती है।
