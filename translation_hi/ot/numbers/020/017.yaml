translation_notes:
  register: आधुनिक मानक हिन्दी; विनम्र राजनयिक अनुरोध और लगातार दिए गए आश्वासनों को सरल, गरिमापूर्ण भाषा में रखा गया है। ‘दाख की बारी’ बाइबिलीय कृषि-संदर्भ में परिचित और स्पष्ट है।
