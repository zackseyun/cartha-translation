  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר יְהוָה֮ אֶל מֹשֶׁ֣ה וְ/אֶֽל אַהֲרֹן֒ יַ֚עַן לֹא הֶאֱמַנְתֶּ֣ם בִּ֔/י לְ/הַ֨קְדִּישֵׁ֔/נִי לְ/עֵינֵ֖י בְּנֵ֣י יִשְׂרָאֵ֑ל לָ/כֵ֗ן לֹ֤א תָבִ֨יאוּ֙ אֶת הַ/קָּהָ֣ל הַ/זֶּ֔ה אֶל הָ/אָ֖רֶץ אֲשֶׁר נָתַ֥תִּי לָ/הֶֽם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/012.yaml
  text: And Yahweh said to Moses and to Aaron[a], “Because you did not believe me, to treat me as holy before the eyes of the sons of Israel[c][b], therefore you shall not bring this assembly into the land that I have given them.”
translation:
  language: hi
  text: और यहोवा ने मूसा और हारून से कहा, “क्योंकि तुमने मुझ पर विश्वास नहीं किया[a] और इस्राएल के पुत्रों के सामने मुझे पवित्र नहीं ठहराया[b], इसलिए तुम इस सभा को उस देश में नहीं ले जाओगे जिसे मैंने उन्हें दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमने मुझ पर भरोसा नहीं रखा।” हिब्रू क्रिया विश्वास करने और भरोसा रखने—दोनों अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या “मुझे पवित्र प्रकट नहीं किया” अथवा “मेरी पवित्रता को प्रतिष्ठित नहीं किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: הֶאֱמַנְתֶּם בִּי
  choice: तुमने मुझ पर विश्वास नहीं किया
  rationale: אמן के हिफ़ील रूप और בִּי का अर्थ विश्वास करना या भरोसा रखना हो सकता है; यह चयन मूल संरचना के निकट और स्वाभाविक हिन्दी है।
- source_word: לְהַקְדִּישֵׁנִי
  choice: मुझे पवित्र नहीं ठहराया
  rationale: 'קדש के कारक रूप का सार्वजनिक अर्थ सुरक्षित रहता है: लोगों के सामने परमेश्वर को पवित्र मानना और वैसा प्रकट करना। नकार को पूर्ववर्ती לֹא से समन्वित कर स्वाभाविक हिन्दी वाक्य बनाया गया है।'
- source_word: לְעֵינֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के सामने
  rationale: हिब्रू मुहावरे के सार्वजनिक आयाम को ‘के सामने’ स्पष्ट करता है, जबकि בְּנֵי יִשְׂרָאֵל की पितृवंशीय अभिव्यक्ति को बनाए रखता है।
- source_word: לָכֵן
  choice: इसलिए
  rationale: कारण के बाद आने वाले न्यायिक परिणाम को आधुनिक हिन्दी में स्पष्ट रूप से जोड़ता है।
- source_word: תָבִיאוּ אֶת הַקָּהָל הַזֶּה
  choice: तुम इस सभा को ... नहीं ले जाओगे
  rationale: בוא के हिफ़ील का अर्थ किसी को भीतर लाना या पहुँचाना है; गंतव्य के साथ ‘ले जाओगे’ हिन्दी में स्वाभाविक है और गंभीर निषेधात्मक घोषणा को व्यक्त करता है।
- source_word: הָאָרֶץ אֲשֶׁר נָתַתִּי לָהֶם
  choice: उस देश में ... जिसे मैंने उन्हें दिया है
  rationale: ‘देश’ प्रतिज्ञात भूभाग को स्वाभाविक हिन्दी में व्यक्त करता है; पूर्ण क्रिया ‘दिया है’ दान की निश्चितता और वाचागत बल बनाए रखती है।
theological_decisions:
- issue: मूसा और हारून की विफलता का स्वरूप
  choice: अविश्वास और परमेश्वर को सार्वजनिक रूप से पवित्र न ठहराना—दोनों आरोपों को साथ रखा गया है।
  alternative: इसे केवल आज्ञा न मानना, परमेश्वर का आदर न करना, या चट्टान पर प्रहार करने की विशिष्ट गलती के रूप में समझाना।
  rationale: पद स्वयं विश्वास की कमी और परमेश्वर को पवित्र न ठहराने की बात कहता है, पर इनके ठीक संबंध या कार्यविधि की व्याख्या नहीं करता; अनुवाद इस तनाव को खुला रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की सन्तान
  rationale: मुख्य पाठ में हिब्रू की शाब्दिक, व्याकरणतः पुल्लिंग जातीय अभिव्यक्ति सुरक्षित रखी गई है, बिना यह दावा किए कि उपस्थित समुदाय केवल पुरुषों का था।
- issue: प्रतिज्ञात देश के दान का कालगत स्वरूप
  choice: जिसे मैंने उन्हें दिया है
  alternative: जिसे मैं उन्हें दे रहा हूँ
  rationale: हिब्रू पूर्ण क्रिया को पूर्ण दान के रूप में व्यक्त कर वाचा की निश्चितता बनाए रखी गई है, बिना वास्तविक प्रवेश को पहले घटित मानने की व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘यहोवा’ व्यक्तिगत नाम को, ‘सभा’ קהל के सामुदायिक अर्थ को, और ‘इस्राएल के पुत्र’ मूल की औपचारिक अभिव्यक्ति को सुरक्षित रखते हैं।
