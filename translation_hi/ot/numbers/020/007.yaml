lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वाव-क्रमागत के साथ דבר का पिएल रूप कथानक को आगे बढ़ाने वाला प्रचलित वाक्य-विन्यास है। आधुनिक हिन्दी में अगले पद में आने वाले प्रत्यक्ष कथन से पहले ‘तब ... कहा’ स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: אֶל यहाँ वचन के संबोधित व्यक्ति को दर्शाता है; हिन्दी में ‘मूसा से कहा’ स्वाभाविक रूप से वही संबंध व्यक्त करता है।
- source_word: לֵּאמֹר
  choice: कहा
  rationale: यह infinitive construct आगामी वचन का परिचय देता है। हिन्दी में ‘कहा’ के बाद अगले पद का प्रत्यक्ष कथन इस सूत्र को सहज ढंग से व्यक्त करता है; अलग से ‘यह कहते हुए’ अनावश्यक रूप से बोझिल होता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, परमेश्वर का विशिष्ट नाम है। मुख्य पाठ में हिन्दी पाठकों के बीच अधिक परिचित ‘यहोवा’ रखा गया है, जबकि ‘याहवे’ को पाद-टिप्पणी में वैकल्पिक लिप्यंतरण के रूप में बताया गया है।
