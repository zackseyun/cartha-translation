source:
  edition: WLC
  text: וַ/נִּצְעַ֤ק אֶל יְהוָה֙ וַ/יִּשְׁמַ֣ע קֹלֵ֔/נוּ וַ/יִּשְׁלַ֣ח מַלְאָ֔ךְ וַ/יֹּצִאֵ֖/נוּ מִ/מִּצְרָ֑יִם וְ/הִנֵּה֙ אֲנַ֣חְנוּ בְ/קָדֵ֔שׁ עִ֖יר קְצֵ֥ה גְבוּלֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/016.yaml
  text: And we cried out to Yahweh[a], and he heard our voice and sent an angel and brought us out of Egypt. And look, we are in Kadesh, a city at the edge of your border.
translation:
  language: hi
  text: और हमने यहोवा को पुकारा, और उसने हमारी आवाज़ सुनी, एक दूत[a] भेजा और हमें मिस्र से बाहर निकाला। और देखिए, हम कादेश में हैं, जो आपकी सीमा के छोर पर एक नगर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एक स्वर्गदूत’। हिब्रू शब्द मानवीय या स्वर्गीय दूत, दोनों के लिए प्रयुक्त हो सकता है; इस प्रसंग में बहुत-से लोग इसे परमेश्वर द्वारा भेजा गया स्वर्गीय दूत समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַנִּצְעַק
  choice: हमने ... पुकारा
  rationale: צעק संकट में सहायता के लिए लगाई गई गुहार को व्यक्त करता है; ‘पुकारा’ आधुनिक हिन्दी में स्वाभाविक है और तात्कालिकता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַיִּשְׁמַע קֹלֵנוּ
  choice: उसने हमारी आवाज़ सुनी
  rationale: हिब्रू का स्पष्ट वाक्यांश ‘हमारी आवाज़ सुनी’ सुरक्षित रहता है और हिन्दी में भी स्वाभाविक रूप से उनकी गुहार सुनने का अर्थ देता है।
- source_word: מַלְאָךְ
  choice: एक दूत
  rationale: מַלְאָךְ का मूल अर्थ संदेशवाहक/दूत है और यह मानवीय अथवा स्वर्गीय दूत दोनों के लिए प्रयुक्त हो सकता है। ‘दूत’ इस वास्तविक अस्पष्टता को बनाए रखता है; स्वर्गदूत की सम्भावना पादटिप्पणी में दी गई है।
- source_word: וַיֹּצִאֵנוּ מִמִּצְרָיִם
  choice: हमें मिस्र से बाहर निकाला
  rationale: יצא के हिफ़ील रूप का सीधा और प्रचलित अर्थ ‘बाहर निकालना’ है; संयुक्त क्रिया ‘भेजकर ... निकाला’ हिब्रू घटनाक्रम को सहज हिन्दी में व्यक्त करती है।
- source_word: וְהִנֵּה
  choice: और देखिए, अब
  rationale: הִנֵּה वर्तमान स्थिति की ओर ध्यान खींचता है। ‘देखिए’ उस संकेतात्मक बल को आधुनिक, सम्मानपूर्ण हिन्दी में देता है और ‘अब’ वर्तमान परिस्थिति को स्पष्ट करता है।
- source_word: עִיר קְצֵה גְבוּלֶךָ
  choice: आपकी सीमा के छोर पर बसा एक नगर
  rationale: यह पदबंध कादेश को सीमा के अंतिम किनारे पर स्थित नगर बताता है। ‘बसा’ हिन्दी में स्थान-संबंध को स्वाभाविक बनाता है, बिना अतिरिक्त भौगोलिक दावा जोड़े।
theological_decisions:
- issue: निर्गमन के उल्लेख में מַלְאָךְ की पहचान
  choice: मुख्य पाठ में ‘एक दूत’ रखा गया और उसकी सटीक पहचान निर्दिष्ट नहीं की गई।
  alternative: ‘एक स्वर्गदूत’
  rationale: पद केवल इतना कहता है कि यहोवा ने מַלְאָךְ भेजा; वह उसकी प्रकृति या विशिष्ट पहचान स्पष्ट नहीं करता। ‘दूत’ हिब्रू की व्यापक अर्थ-सीमा और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है, जबकि ‘स्वर्गदूत’ की सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रूप अपनाया गया है। संबोधित एदोमी राजा के लिए आदरसूचक ‘आप’ रखा गया है। ‘देखिए’ ने पुरातन ‘देखो/निहारो’ से बचते हुए הִנֵּה का ध्यानाकर्षक बल बनाए रखा है।
