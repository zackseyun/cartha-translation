  text: וַ/יִּרְאוּ֙ כָּל הָ֣/עֵדָ֔ה כִּ֥י גָוַ֖ע אַהֲרֹ֑ן וַ/יִּבְכּ֤וּ אֶֽת אַהֲרֹן֙ שְׁלֹשִׁ֣ים י֔וֹם כֹּ֖ל בֵּ֥ית יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/029.yaml
  text: When all the congregation saw that Aaron had died[b][a], all the house of Israel wept for Aaron thirty days.
translation:
  language: hi
  text: जब सारी मण्डली ने देखा कि हारून मर गया था[a], तब इस्राएल के पूरे घराने[b] ने हारून के लिए तीस दिनों तक रोया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह जान लिया कि हारून मर गया था।” इब्रानी में शाब्दिक रूप से “देखा” है, पर इस क्रिया में किसी तथ्य को पहचान लेने या समझ लेने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “इस्राएल का पूरा घराना” पूरे इस्राएली जनसमुदाय के लिए प्रयुक्त एक सामूहिक अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है; यहाँ तथ्य को जान लेने या समझ लेने का भाव भी हो सकता है, इसलिए मूल अभिव्यक्ति को रखते हुए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה इस्राएल के संगठित समुदाय को दर्शाता है; ‘मण्डली’ पंचग्रन्थीय प्रसंग में प्रचलित, गरिमापूर्ण और सुबोध है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात की विषय-वस्तु प्रस्तुत करता है जिसे मण्डली ने देखा अथवा जान लिया।
- source_word: גָוַע
  choice: मृत्यु हो गई
  rationale: גוע प्राण त्यागने या मरने के लिए प्रयुक्त गरिमापूर्ण क्रिया है; यह चयन स्वाभाविक आधुनिक हिन्दी में उस भाव को व्यक्त करता है।
- source_word: וַיִּבְכּוּ
  choice: विलाप किया
  rationale: בכה रोने को व्यक्त करता है; मृत्यु के प्रसंग में ‘विलाप किया’ शोकपूर्ण रोने का भाव स्वाभाविक ढंग से देता है।
- source_word: אֶת אַהֲרֹן
  choice: हारून के लिए
  rationale: בכה के साथ चिह्नित कर्म उस व्यक्ति को बताता है जिसके लिए शोक में रोया गया।
- source_word: שְׁלֹשִׁים יוֹם
  choice: तीस दिन तक
  rationale: यह अवधि-सूचक प्रयोग है; हिन्दी में ‘तक’ अवधि को स्पष्ट और स्वाभाविक बनाता है।
- source_word: כֹּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के समूचे घराने
  rationale: בֵּית יִשְׂרָאֵל पूरे इस्राएली जनसमुदाय के लिए सामूहिक अभिव्यक्ति है; ‘घराना’ इसके पारिवारिक-सामुदायिक रूपक को बनाए रखता है।
