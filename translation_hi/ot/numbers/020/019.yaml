  text: וַ/יֹּאמְר֨וּ אֵלָ֥י/ו בְּנֵֽי יִשְׂרָאֵ֘ל בַּֽ/מְסִלָּ֣ה נַעֲלֶה֒ וְ/אִם מֵימֶ֤י/ךָ נִשְׁתֶּה֙ אֲנִ֣י וּ/מִקְנַ֔/י וְ/נָתַתִּ֖י מִכְרָ֑/ם רַ֥ק אֵין דָּבָ֖ר בְּ/רַגְלַ֥/י אֶֽעֱבֹֽרָה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/019.yaml
  text: And the sons of Israel said to him[a], “We will go up on the highway, and if I and my livestock drink your water, then I will pay its price. Let me only pass through on foot[c][b], nothing more.”
translation:
  language: hi
  text: और इस्राएल के पुत्रों[a] ने उससे कहा, “हम राजमार्ग[b] से होकर ऊपर जाएँगे। यदि मैं और मेरे पशु तुम्हारा पानी पीएँ, तो मैं उसका मूल्य चुका दूँगा। बस मुझे पैदल[c] पार निकलने दो—और कुछ नहीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “मुख्य मार्ग।” हिब्रू शब्द किसी निर्मित या ऊँचे राजमार्ग को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “मैं अपने पैरों से पार हो जाऊँ।” यह पैदल पार होने के भाव को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू की शाब्दिक अभिव्यक्ति और पुल्लिंग बहुवचन को सुरक्षित रखता है; आधुनिक पाठक के लिए ‘इस्राएली’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: בַּמְסִלָּה
  choice: राजमार्ग से होकर
  rationale: מְסִלָּה किसी निर्मित या ऊँचे मुख्य मार्ग को दर्शाता है। ‘राजमार्ग से होकर’ स्थापित मार्ग पर यात्रा का स्वाभाविक हिन्दी बोध देता है।
- source_word: נַעֲלֶה
  choice: ऊपर जाएँगे
  rationale: क्रिया के मूल अर्थ ‘ऊपर जाना/चढ़ना’ को बनाए रखता है, जबकि मार्ग से होकर यात्रा का प्रसंग भी स्पष्ट रहता है।
- source_word: מֵימֶיךָ
  choice: तेरा पानी
  rationale: हिब्रू में ‘पानी’ का बहुवचन रूप मुहावरेदार है; हिन्दी में एकवचन भाववाचक रूप स्वाभाविक है।
- source_word: נִשְׁתֶּה אֲנִי וּמִקְנַי
  choice: मैं और मेरे पशु तेरा पानी पिएँ
  rationale: एकवचन वक्ता पूरे समुदाय का प्रतिनिधित्व करता है; ‘पशु’ מִקְנֶה के सामूहिक और व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וְנָתַתִּי מִכְרָם
  choice: मैं उसका मूल्य चुका दूँगा
  rationale: מֶכֶר मूल्य या भुगतान को दर्शाता है; हिन्दी वाक्य स्पष्ट करता है कि पिए गए पानी का दाम दिया जाएगा।
- source_word: רַק אֵין דָּבָר
  choice: बस … और कुछ नहीं
  rationale: अनुरोध को सीमित करने और उसे न्यूनतम बताने वाली हिब्रू अभिव्यक्ति को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: בְּרַגְלַי אֶעֱבֹרָה
  choice: मुझे पैदल पार निकल जाने दे
  rationale: शाब्दिक ‘अपने पैरों से’ का मुहावरेदार अर्थ साधारण, अहानिकर आवागमन है; अनुरोधसूचक बल भी रखा गया है।
