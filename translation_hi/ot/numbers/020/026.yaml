  text: וְ/הַפְשֵׁ֤ט אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/הִלְבַּשְׁתָּ֖/ם אֶת אֶלְעָזָ֣ר בְּנ֑/וֹ וְ/אַהֲרֹ֥ן יֵאָסֵ֖ף וּ/מֵ֥ת שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/026.yaml
  text: Strip Aaron of his garments and put them on Eleazar his son[b][a]. Then Aaron will be gathered to his people and die there.
translation:
  language: hi
  text: हारून के वस्त्र[a] उतारो और उन्हें उसके पुत्र एलीआज़र को पहना दो। तब हारून को समेट लिया जाएगा[b] और वह वहीं मर जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्रसंग के अनुसार ये उसके याजकीय वस्त्र हैं; इब्रानी में केवल ‘उसके वस्त्र’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘समेट लिया जाएगा’ मृत्यु के लिए प्रयुक्त इब्रानी मुहावरा है। इस पद में केवल यह संक्षिप्त रूप है; ‘अपने लोगों में’ जैसे पूर्ण शब्द यहाँ नहीं हैं।
    reason: cross_reference
lexical_decisions:
- source_word: וְהַפְשֵׁט אֶת־אַהֲרֹן אֶת־בְּגָדָיו
  choice: हारून के वस्त्र उतारकर
  rationale: हिफ़इल आज्ञार्थक क्रिया किसी दूसरे के कपड़े उतारने का आदेश देती है। ‘वस्त्र उतारकर’ आधुनिक हिन्दी में स्वाभाविक है और आदेश की सीधाई बनाए रखता है।
- source_word: בְּגָדָיו
  choice: उसके वस्त्र
  rationale: בגד का सामान्य अर्थ वस्त्र या कपड़े है। प्रसंग में ये याजकीय वस्त्र हैं, पर मूल पद स्वयं केवल ‘उसके वस्त्र’ कहता है; इसलिए अधिक स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְהִלְבַּשְׁתָּם אֶת־אֶלְעָזָר בְּנוֹ
  choice: उन्हें उसके पुत्र एलआज़ार को पहना देना
  rationale: क्रिया का कारक भाव और बहुवचन कर्म-प्रत्यय ‘उन्हें’ दोनों सुरक्षित हैं। हिन्दी शब्दक्रम संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יֵאָסֵף
  choice: अपने लोगों में मिला लिया जाएगा
  rationale: यह मृत्यु के प्रसंग में प्रयुक्त इब्रानी मुहावरा है। इसी निकट प्रसंग में इसका पूर्ण रूप ‘अपने लोगों में मिला लिया जाएगा’ आता है; हिन्दी में केवल ‘इकट्ठा किया जाएगा’ भ्रामक और अस्वाभाविक होता। पादटिप्पणी बताती है कि इस पद में ‘अपने लोगों में’ शब्द प्रत्यक्ष रूप से नहीं हैं।
- source_word: וּמֵת שָׁם
  choice: और वहीं मर जाएगा
  rationale: संयोजित क्रिया भावी परिणाम को आगे बढ़ाती है; ‘वहीं मर जाएगा’ सरल, स्वाभाविक और स्थानवाचक שָׁם के प्रति सटीक है।
theological_decisions:
- issue: יֵאָסֵף में मृत्यु-संबंधी मुहावरा
  choice: अपने लोगों में मिला लिया जाएगा
  alternative: समेट लिया जाएगा / उठा लिया जाएगा / मर जाएगा
  rationale: केवल ‘मर जाएगा’ मुहावरे की साहित्यिक और धर्मवैचारिक गूँज मिटा देता, जबकि शाब्दिक ‘इकट्ठा किया जाएगा’ हिन्दी में गलत अर्थ दे सकता है। निकटवर्ती पद 24 में पूर्ण अभिव्यक्ति होने के कारण मुहावरे का आशय मुख्य पाठ में रखा गया है, पर मूल पद की संक्षिप्तता पादटिप्पणी में स्पष्ट की गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और मौखिक पठन के योग्य। ‘एलआज़ार’ नाम इब्रानी उच्चारण के निकट रखा गया है। आदेशात्मक वाक्य में ‘पहना देना’ सहज हिन्दी है, जबकि मृत्यु-मुहावरे की असामान्यता को अर्थपूर्ण रूप में बनाए रखकर पादटिप्पणी से स्रोत की संक्षिप्तता बताई गई है।
