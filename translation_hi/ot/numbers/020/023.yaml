source:
  edition: WLC
  text: וַ/יֹּ֧אמֶר יְהוָ֛ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן בְּ/הֹ֣ר הָ/הָ֑ר עַל גְּב֥וּל אֶֽרֶץ אֱד֖וֹם לֵ/אמֹֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/023.yaml
  text: And Yahweh spoke to Moses and to Aaron at Mount Hor[a], on the border of the land of Edom, saying,
translation:
  language: hi
  text: यहोवा ने होर पर्वत पर, एदोम देश की सीमा पर, मूसा और हारून से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר का सामान्य अर्थ ‘कहना’ है; यह अगले पद में आने वाले सीधे कथन का स्वाभाविक परिचय देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम יהוה का प्रचलित लिप्यंतरण ‘यहोवा’ है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: भाषण के संबोधित व्यक्तियों को आधुनिक और स्वाभाविक हिन्दी में व्यक्त करता है; दोहराए गए אֶל का अर्थ संयुक्त संरचना में सुरक्षित है।
- source_word: בְּהֹר הָהָר
  choice: होर पर्वत पर
  rationale: हिब्रू स्थाननाम और स्थानवाचक उपसर्ग का स्पष्ट तथा प्रचलित हिन्दी रूप।
- source_word: עַל גְּבוּל אֶרֶץ אֱדוֹם
  choice: एदोम देश की सीमा के पास
  rationale: עַל גְּבוּל इस स्थल-संदर्भ में सीमा पर या उसके निकट स्थिति बताता है; ‘के पास’ प्राकृतिक हिन्दी है और पर्वत को ठीक सीमा-रेखा पर रखने की अनावश्यक कठोरता से बचता है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: हिब्रू कथन-परिचायक का कार्य हिन्दी के ‘कहा’ और अंत के अल्पविराम में स्वाभाविक रूप से समाहित है; ‘यह कहते हुए’ यहाँ बोझिल होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबल-पाठकों के लिए ‘यहोवा’ अधिक परिचित लिप्यंतरण है, जबकि ‘याहवे’ विद्वत् पुनर्निर्मित उच्चारण को अधिक निकटता से दर्शाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण कथात्मक शैली। वाक्य अगले पद के प्रत्यक्ष कथन की ओर खुला रहता है।
