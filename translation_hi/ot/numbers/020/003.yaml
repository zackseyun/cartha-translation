source:
  edition: WLC
  text: וַ/יָּ֥רֶב הָ/עָ֖ם עִם מֹשֶׁ֑ה וַ/יֹּאמְר֣וּ לֵ/אמֹ֔ר וְ/ל֥וּ גָוַ֛עְנוּ בִּ/גְוַ֥ע אַחֵ֖י/נוּ לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/003.yaml
  text: And the people quarreled with Moses and said[a], “If only we had perished when our brothers perished before Yahweh!”
translation:
  language: hi
  text: लोगों ने मूसा से झगड़ा किया और कहा[a], “काश, हम भी उस समय मर गए होते जब हमारे भाई यहोवा के सामने मरे थे!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “काश, हम भी वैसे ही मर गए होते जैसे हमारे भाई यहोवा के सामने मरे!”
    reason: בִּגְוַע को कालगत ‘जब’ के बजाय तुलनात्मक ‘जैसे’ समझना भी संभव है।
lexical_decisions:
- source_word: וַיָּרֶב
  choice: झगड़ने लगे
  rationale: ריב यहाँ मूसा के साथ विरोधपूर्ण विवाद को दर्शाता है। ‘झगड़ने लगे’ आधुनिक हिन्दी में स्वाभाविक है और केवल शिकायत करने से अधिक प्रबल अर्थ रखता है।
- source_word: הָעָם
  choice: लोग
  rationale: עם इस प्रसंग में इस्राएली समुदाय को सामूहिक रूप से दर्शाता है; ‘लोग’ सरल और स्वाभाविक हिन्दी है।
- source_word: עִם מֹשֶׁה
  choice: मूसा से
  rationale: עִם का मूल अर्थ ‘साथ’ है, पर हिन्दी में ‘मूसा से झगड़ने’ से परस्पर किंतु विरोधपूर्ण क्रिया स्वाभाविक रूप से व्यक्त होती है।
- source_word: וַיֹּאמְרוּ לֵאמֹר
  choice: और कहने लगे
  rationale: यह सामान्य इब्रानी वचन-परिचय है। दोनों क्रियात्मक तत्वों को शब्दशः दोहराने के बजाय यह हिन्दी में प्रवाहपूर्ण अभिव्यक्ति है।
- source_word: וְלוּ
  choice: काश
  rationale: यह अव्यय तीव्र इच्छा अथवा विलाप व्यक्त करता है; ‘काश’ हिन्दी में उसी भाव को संक्षेप और स्वाभाविकता से रखता है।
- source_word: גָוַעְנוּ ... בִּגְוַע
  choice: मर गए ... मर गए
  rationale: दोनों रूप एक ही मूल גוע से हैं। ‘मर गए’ मूल की पुनरावृत्ति बनाए रखते हुए साधारण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אַחֵינוּ
  choice: हमारे भाई
  rationale: शब्द व्याकरणतः पुल्लिंग बहुवचन है और संभवतः पहले मरे साथी इस्राएलियों को दर्शाता है; ‘भाई’ उसके पारिवारिक-सामुदायिक भाव और लिंग-रूप को बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने/उपस्थिति में’ है। יְהוָה को एक उचित नाम के रूप में ‘यहोवा’ लिखा गया है, जो हिन्दी बाइबलीय प्रयोग में सुबोध है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय वाचा-नाम सीधे आया है। मुख्य पाठ में उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है; ‘याहवे’ अधिक संभावित प्राचीन उच्चारण को दर्शाता है, पर हिन्दी पाठकों में कम परिचित है।
- issue: אַחֵינוּ में लिंग और सामुदायिक अर्थ
  choice: हमारे भाई
  alternative: हमारे बंधु; हमारे भाई-बहन
  rationale: मूल रूप पुल्लिंग बहुवचन है। प्रसंग सभी मृत सहसमुदायियों को समाहित कर सकता है, पर मूल की लिंगगत अभिव्यक्ति को विस्तार देकर निश्चित करना उचित नहीं।
- issue: בִּגְוַע का कालगत अथवा तुलनात्मक संबंध
  choice: जब ... तब
  alternative: जैसे हमारे भाई ... मरे
  rationale: ב् के साथ infinitive construct परिस्थिति या समय व्यक्त कर सकता है। मुख्य पाठ कालगत सह-मृत्यु की इच्छा को स्पष्ट करता है, जबकि तुलनात्मक समझ भी व्याकरणतः संभव है और पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में समझ आने योग्य रखी गई है। ‘काश’ विलाप की तीव्रता देता है, और एक ही इब्रानी मूल גוע की पुनरावृत्ति हिन्दी में ‘मर गए’ दोहराकर सुरक्षित रखी गई है।
