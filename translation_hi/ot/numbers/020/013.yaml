source:
  edition: WLC
  text: הֵ֚מָּה מֵ֣י מְרִיבָ֔ה אֲשֶׁר רָב֥וּ בְנֵֽי יִשְׂרָאֵ֖ל אֶת יְהוָ֑ה וַ/יִּקָּדֵ֖שׁ בָּֽ/ם־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/013.yaml
  text: These are the waters of Meribah, where the sons of Israel quarreled with Yahweh, and he showed himself holy among them.
translation:
  language: hi
  text: ये मरीबा[a] के जल हैं, जहाँ इस्राएलियों ने यहोवा से झगड़ा किया, और वह उनके बीच पवित्र ठहरा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मरीबा” का अर्थ “झगड़ा” या “विवाद” है।
    reason: lexical_alternative
  - marker: b
    text: या, “और वह उनमें पवित्र ठहराया गया”; अथवा, “और उसने उनके द्वारा अपनी पवित्रता प्रकट की।”
    reason: alternative_reading
lexical_decisions:
- source_word: הֵמָּה
  choice: ये ... हैं
  rationale: पहचान कराने वाले इब्रानी वाक्यांश को हिन्दी की स्वाभाविक वर्तमानकालीन नामकरण-शैली में रखा गया है।
- source_word: מֵי מְרִיבָה
  choice: मरीबा के जल
  rationale: מְרִיבָה यहाँ स्थान-नाम के रूप में प्रयुक्त है; इसलिए मुख्य पाठ में लिप्यंतरण रखा गया और उसके शब्दार्थ को पादटिप्पणी में बताया गया है।
- source_word: רָבוּ
  choice: झगड़ा किया
  rationale: ריב विवाद या झगड़ा करने को व्यक्त करता है; यह आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह मानक जातिवाचक इब्रानी पद पूरे इस्राएली समुदाय को सूचित करता है; हिन्दी में ‘इस्राएली’ उसका स्वाभाविक और सटीक सामूहिक रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: וַיִּקָּדֵשׁ
  choice: वह ... पवित्र प्रकट हुआ
  rationale: קדש के निफ़अल रूप की यह अभिव्यक्ति इस बात को बताती है कि इस घटना में यहोवा की पवित्रता प्रकट हुई; इससे यह भ्रामक अर्थ नहीं निकलता कि मनुष्यों ने उसे पवित्र बनाया।
- source_word: בָּם
  choice: उनके बीच
  rationale: בָּם का प्रसंगानुकूल अर्थ इस्राएलियों के बीच या उनके संबंध में है; सम्भव अधिक शाब्दिक और साधनवाचक अर्थ पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: अंतिम उपवाक्य में यहोवा के पवित्र ठहरने का अर्थ
  choice: और वह उनके बीच पवित्र प्रकट हुआ
  alternative: और वह उनमें पवित्र ठहराया गया / और उनके द्वारा उसकी पवित्रता प्रमाणित हुई
  rationale: निफ़अल रूप में कर्मवाच्य तथा आत्मवाचक दोनों छायाएँ सम्भव हैं। मुख्य पाठ स्वाभाविक हिन्दी में पवित्रता के प्रकट होने को व्यक्त करता है, जबकि पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता बनाए रखती है।
- issue: בְנֵי יִשְׂרָאֵל का हिन्दी रूप
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों / इस्राएल की सन्तान
  rationale: इस स्थिर जातिवाचक अभिव्यक्ति का आशय सामूहिक इस्राएली समुदाय है। आधुनिक हिन्दी में ‘इस्राएली’ स्रोत का अर्थ बिना अस्वाभाविक शब्दशःपन के देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जल’ बाइबलीय गद्य की गरिमा बनाए रखता है, जबकि ‘झगड़ा किया’ वर्तमान हिन्दी में स्पष्ट है। अंतिम उपवाक्य की इब्रानी अस्पष्टता को मुख्य पाठ और पादटिप्पणी के संयोजन से सुरक्षित रखा गया है।
