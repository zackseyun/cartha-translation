source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּ/אֲשֶׁ֖ר צִוָּ֣ה יְהוָ֑ה וַֽ/יַּעֲלוּ֙ אֶל הֹ֣ר הָ/הָ֔ר לְ/עֵינֵ֖י כָּל הָ/עֵדָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/027.yaml
  text: Moses did as Yahweh commanded[a], and they went up Mount Hor before the eyes of all the congregation.
translation:
  language: hi
  text: मूसा ने वैसा ही किया जैसा याहवे ने आज्ञा दी थी। फिर वे सारी मण्डली के सामने[a] होर पर्वत पर चढ़ गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “सारी मण्डली की आँखों के सामने,” अर्थात् सबके देखते हुए।'
    reason: इब्रानी मुहावरे के शाब्दिक बिंब को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने…किया
  rationale: यह सामान्य कथात्मक क्रिया मूसा द्वारा पिछली आज्ञा का पालन किए जाने को बताती है; ‘किया’ सहज और स्रोत के निकट है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: वैसा ही…जैसा…आज्ञा दी थी
  rationale: यह रचना मूसा के कार्य और याहवे की आज्ञा के बीच सीधा अनुरूप संबंध बनाए रखती है तथा צוה की अधिकारपूर्णता को ‘आज्ञा’ से व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: וַיַּעֲלוּ
  choice: वे…चढ़ गए
  rationale: עלה पर्वत की ओर ऊपर जाने को दर्शाता है; ‘चढ़ गए’ आधुनिक हिन्दी में स्वाभाविक है और बहुवचन कर्ता को सुरक्षित रखता है।
- source_word: אֶל הֹר הָהָר
  choice: होर पर्वत पर
  rationale: होर स्थान-नाम है और הָהָר को हिन्दी के स्वाभाविक नाम-क्रम में ‘पर्वत’ से व्यक्त किया गया है।
- source_word: לְעֵינֵי כָּל הָעֵדָה
  choice: सारी मण्डली के सामने
  rationale: मुहावरे का अर्थ सार्वजनिक रूप से, पूरी एकत्रित मण्डली की दृष्टि में होना है; सहज हिन्दी मुख्य पाठ में अर्थ देती है और शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से उपस्थित है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘मण्डली’ गिनती की पुस्तक में एकत्रित इस्राएली समुदाय के लिए उपयुक्त पारंपरिक किंतु सामान्यतः समझ में आने वाला शब्द है। ‘फिर’ कथानक की अगली क्रिया को सहज ढंग से जोड़ता है।
