id: NUM.20.1
reference: Numbers 20:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹ֣אוּ בְנֵֽי יִ֠שְׂרָאֵל כָּל הָ֨/עֵדָ֤ה מִדְבַּר צִן֙ בַּ/חֹ֣דֶשׁ הָֽ/רִאשׁ֔וֹן וַ/יֵּ֥שֶׁב הָ/עָ֖ם בְּ/קָדֵ֑שׁ וַ/תָּ֤מָת שָׁם֙ מִרְיָ֔ם וַ/תִּקָּבֵ֖ר שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/001.yaml
  text: Then the sons of Israel[a], the whole congregation, came into the wilderness of Zin in the first month, and the people stayed at Kadesh[b]. Miriam died there and was buried there.
translation:
  language: hi
  text: फिर पहले महीने में इस्राएली[a]—पूरी मंडली[b]—सीन के वीराने में आए, और लोग कादेश में ठहरे। वहीं मिरयम की मृत्यु हुई और वहीं वह दफ़नाई गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्र’; इसका अर्थ ‘इस्राएल की संतान’ या ‘इस्राएली’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पूरा समुदाय’ अथवा ‘समूची सभा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह आधुनिक हिन्दी में इस राष्ट्रीय-समुदाय के लिए स्वाभाविक और समावेशी पद है; इब्रानी का शाब्दिक पारिवारिक रूप पाद-टिप्पणी में दिया गया है।
- source_word: כָּל הָעֵדָה
  choice: पूरी मंडली
  rationale: ‘मंडली’ एकत्रित वाचा-समुदाय का सामूहिक भाव व्यक्त करती है और כָּל का अर्थ ‘पूरी’ से सुरक्षित रहता है।
- source_word: מִדְבַּר צִן
  choice: सीन का वीराना
  rationale: מִדְבָּר निर्जन, कम आबाद भूभाग को सूचित करता है; ‘वीराना’ आधुनिक हिन्दी में सहज है और अनिवार्यतः रेतीले मरुस्थल का अर्थ नहीं थोपता।
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने में
  rationale: काल-सूचक इब्रानी पद का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיֵּשֶׁב
  choice: ठहरे
  rationale: संदर्भ में अस्थायी निवास या पड़ाव का भाव है; ‘बस गए’ स्थायी बसाव का अतिरिक्त संकेत दे सकता है।
- source_word: בְּקָדֵשׁ
  choice: कादेश में
  rationale: स्थान पर निवास व्यक्त करने के लिए हिन्दी में ‘में’ स्वाभाविक है।
- source_word: מִרְיָם
  choice: मिरयम
  rationale: नाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַתָּמָת
  choice: की मृत्यु हुई
  rationale: मृत्यु के स्पष्ट कथन को बिना नरम किए गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַתִּקָּבֵר
  choice: वह दफ़नाई गई
  rationale: इब्रानी के कर्मवाच्य रूप को सुरक्षित रखता है और दफ़नाने वाले किसी अनुल्लिखित कर्ता को नहीं जोड़ता।
- source_word: שָׁם ... שָׁם
  choice: वहीं ... वहीं
  rationale: मूल की पुनरावृत्ति और स्थान पर दिए गए बल को बनाए रखता है।
theological_decisions: []
