  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मुख्य पाठ में जातीय-समुदाय के लिए स्वाभाविक ‘इस्राएली’ चुना गया है, जबकि मूल का शाब्दिक पारिवारिक रूप पाद-टिप्पणी में सुरक्षित है। विराम-चिह्नों द्वारा ‘पूरी मंडली’ को ‘इस्राएली’ के समानाधिकरण के रूप में स्पष्ट किया गया है।
