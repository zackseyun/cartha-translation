  text: וַ/יִּסְע֖וּ מִ/קָּדֵ֑שׁ וַ/יָּבֹ֧אוּ בְנֵֽי יִשְׂרָאֵ֛ל כָּל הָ/עֵדָ֖ה הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/022.yaml
  text: And they set out from Kadesh[a], and the sons of Israel, the whole congregation[b], came to Mount Hor.
translation:
  language: hi
  text: तब वे कादेश से चल पड़े, और इस्राएली[a]—पूरी मंडली—होर पर्वत[b] पर पहुँचे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक इब्रानी: “इस्राएल के पुत्र।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक क्रम “होर, वह पर्वत” है; यह यहाँ स्थान-नाम के रूप में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... चल पड़े
  rationale: נסע का यह कथात्मक रूप पड़ाव से आगे यात्रा आरम्भ करने या डेरा उठाकर चलने को दर्शाता है; ‘चल पड़े’ आधुनिक हिन्दी में स्वाभाविक है और प्रस्थान का भाव बनाए रखता है।
- source_word: מִקָּדֵשׁ
  choice: कादेश से
  rationale: इब्रानी पाठ में केवल ‘कादेश’ है; यहाँ ‘कादेश-बर्ने’ जोड़ना मूल पाठ से आगे जाना होगा।
- source_word: וַיָּבֹאוּ
  choice: पहुँचे
  rationale: בוא का मूल अर्थ ‘आना/प्रवेश करना’ है; किसी गंतव्य पर्वत के साथ ‘पहुँचे’ स्वाभाविक हिन्दी में आगमन का अभिप्राय ठीक व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक इब्रानी मुहावरा ‘इस्राएल के पुत्र’ है। सामान्य आधुनिक हिन्दी में ‘इस्राएली’ उसी सामुदायिक पहचान को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כָּל הָעֵדָה
  choice: पूरी मंडली
  rationale: עֵדָה संगठित या एकत्रित समुदाय को दर्शाता है। ‘पूरी मंडली’ उसके सामूहिक भाव और כָּל की समग्रता दोनों को बनाए रखता है।
- source_word: הֹר הָהָר
  choice: होर पर्वत
  rationale: यह पदबंध स्थान-नाम के रूप में प्रयुक्त है। ‘होर पर्वत’ हिन्दी में स्वाभाविक नाम है, जबकि यांत्रिक रूप ‘होर, वह पर्वत’ भ्रामक और असहज होगा।
