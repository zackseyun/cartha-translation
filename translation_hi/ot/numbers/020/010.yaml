language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּקְהִ֜לוּ מֹשֶׁ֧ה וְ/אַהֲרֹ֛ן אֶת הַ/קָּהָ֖ל אֶל פְּנֵ֣י הַ/סָּ֑לַע וַ/יֹּ֣אמֶר לָ/הֶ֗ם שִׁמְעוּ נָא֙ הַ/מֹּרִ֔ים הֲ/מִן הַ/סֶּ֣לַע הַ/זֶּ֔ה נוֹצִ֥יא לָ/כֶ֖ם מָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/010.yaml
  text: 'Then Moses and Aaron assembled the assembly before the rock, and he said to them, “Listen now, you rebels: shall we bring out water for you from this rock?”'
translation:
  language: hi
  text: तब मूसा और हारून ने समुदाय को चट्टान के सामने इकट्ठा किया, और उसने उनसे कहा, “अब सुनो, विद्रोहियो! क्या हम तुम्हारे लिए इसी चट्टान से पानी निकालें?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְהִלוּ
  choice: इकट्ठा किया
  rationale: קהל के हिफ़ील रूप का अर्थ लोगों को एकत्र करना है। यह प्रयोग आधुनिक हिन्दी में स्वाभाविक है और कारक भाव को बनाए रखता है।
- source_word: הַקָּהָל
  choice: समुदाय
  rationale: यह शब्द एकत्र हुए जनसमूह या समुदाय को दर्शाता है। ‘समुदाय’ यहाँ सहज है और अनावश्यक धार्मिक-संस्थागत अर्थ नहीं जोड़ता।
- source_word: אֶל־פְּנֵי הַסָּלַע
  choice: चट्टान के सामने
  rationale: इब्रानी पदबंध स्थान को सूचित करता है; ‘के सामने’ उसका स्पष्ट और स्वाभाविक हिन्दी रूप है।
- source_word: וַיֹּאמֶר
  choice: उसने ... कहा
  rationale: इब्रानी क्रिया एकवचन है। संयुक्त कर्ता मूसा और हारून के बाद एकवचन को बनाए रखने से पाठ मूसा का नाम अपनी ओर से दोबारा नहीं जोड़ता।
- source_word: שִׁמְעוּ נָא
  choice: अब सुनो
  rationale: आज्ञार्थक שׁמע के साथ נָא यहाँ कथन में तात्कालिकता और जोर लाता है; ‘अब सुनो’ आधुनिक हिन्दी में वही प्रभाव देता है।
- source_word: הַמֹּרִים
  choice: विद्रोहियो
  rationale: מרה से बना यह संबोधन विद्रोही लोगों को सीधे फटकारता है। ‘विद्रोहियो’ उसका संक्षिप्त और प्रबल हिन्दी रूप है।
- source_word: הֲמִן הַסֶּלַע הַזֶּה
  choice: क्या ... इसी चट्टान से
  rationale: प्रश्नवाचक הֲ और स्रोतसूचक מִן को ‘क्या’ और ‘से’ द्वारा व्यक्त किया गया है; ‘इसी’ הַזֶּה के संकेत और प्रसंगगत जोर को स्वाभाविक रूप से प्रकट करता है।
- source_word: נוֹצִיא
  choice: हम ... निकालें
  rationale: יצא का हिफ़ील रूप ‘बाहर निकालना’ है। प्रश्न में ‘क्या हम ... निकालें?’ प्रथम पुरुष बहुवचन और आलंकारिक तनाव दोनों को सुरक्षित रखता है।
- source_word: מָיִם
  choice: पानी
  rationale: מַיִם का सामान्य, स्पष्ट और आधुनिक हिन्दी पर्याय ‘पानी’ है।
theological_decisions:
- issue: मूसा के प्रश्न में प्रथम पुरुष बहुवचन
  choice: क्या हम तुम्हारे लिए इसी चट्टान से पानी निकालें?
  alternative: क्या हमें तुम्हारे लिए इसी चट्टान से पानी निकालना होगा?
  rationale: נוֹצִיא स्पष्ट रूप से प्रथम पुरुष बहुवचन है। अनुवाद ‘हम’ को बनाए रखता है और मूसा-हारून की भूमिका तथा परमेश्वर की सामर्थ्य के बीच उत्पन्न धार्मिक तनाव को व्याख्या द्वारा दूर नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक फटकार के अनुरूप सीधी रखी गई है। ‘सभा को इकट्ठा किया’ की शब्द-पुनरावृत्ति से बचते हुए הַקָּהָל के लिए ‘समुदाय’ चुना गया है।
