  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֨רֶם מֹשֶׁ֜ה אֶת יָד֗/וֹ וַ/יַּ֧ךְ אֶת הַ/סֶּ֛לַע בְּ/מַטֵּ֖/הוּ פַּעֲמָ֑יִם וַ/יֵּצְאוּ֙ מַ֣יִם רַבִּ֔ים וַ/תֵּ֥שְׁתְּ הָ/עֵדָ֖ה וּ/בְעִירָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/011.yaml
  text: Then Moses raised his hand and struck the rock with his staff twice, and abundant water came out, and the congregation drank, along with their livestock.
translation:
  language: hi
  text: तब मूसा ने अपना हाथ उठाया और अपनी लाठी से चट्टान पर दो बार प्रहार किया। उसमें से बहुत पानी निकला, और मण्डली और उसके पशुओं ने पानी पिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּרֶם
  choice: उठाया
  rationale: हिफ़ील रूप यहाँ हाथ को ऊपर उठाने की प्रत्यक्ष क्रिया व्यक्त करता है; ‘उठाया’ स्वाभाविक और सटीक हिन्दी है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: हिन्दी में कर्ता के अपने अंग के लिए ‘अपना’ स्वाभाविक है और इब्रानी के तृतीय पुरुष एकवचन प्रत्यय का अर्थ सुरक्षित रखता है।
- source_word: וַיַּךְ
  choice: प्रहार किया
  rationale: נכה का अर्थ मारना या प्रहार करना है। ‘प्रहार किया’ गरिमापूर्ण कथात्मक शैली रखता है और क्रिया की स्पष्टता बनाए रखता है।
- source_word: הַסֶּלַע
  choice: चट्टान
  rationale: סֶלַע बड़ी चट्टान या शैल को दर्शाता है; इस प्रसंग में ‘चट्टान’ सामान्य, स्पष्ट और उपयुक्त है।
- source_word: בְּמַטֵּהוּ
  choice: अपनी लाठी से
  rationale: מַטֶּה यहाँ मूसा के हाथ में लिए जाने वाले दण्ड या लाठी को दर्शाता है। आधुनिक हिन्दी में ‘लाठी’ सहज है; ‘अपनी’ स्वत्व-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּעֲמָיִם
  choice: दो बार
  rationale: इब्रानी द्विवचन का यहाँ क्रियाविशेषणात्मक अर्थ ‘दो बार’ है।
- source_word: וַיֵּצְאוּ מַיִם רַבִּים
  choice: उसमें से बहुत पानी निकला
  rationale: מַיִם רַבִּים पानी की बड़ी मात्रा बताता है। हिन्दी में ‘बहुत पानी निकला’ सहज है; प्रसंगानुसार ‘उसमें से’ चट्टान से निकलने का स्रोत स्पष्ट करता है।
- source_word: הָעֵדָה
  choice: मण्डली
  rationale: עֵדָה इस्राएली समुदाय को एक सामूहिक इकाई के रूप में दर्शाता है। ‘मण्डली’ पंचग्रन्थीय संदर्भ में परिचित और गरिमापूर्ण है।
- source_word: וּבְעִירָם
  choice: तथा उनके पशुओं
  rationale: בְּעִירָם उनके पालतू पशुधन को व्यापक रूप से दर्शाता है। ‘पशुओं’ में अर्थ समाहित है और ‘मवेशी’ की संभावित संकीर्णता से बचता है।
theological_decisions:
- issue: चट्टान के प्रति मूसा की क्रिया का कथात्मक वर्णन
  choice: ‘अपनी लाठी से चट्टान पर दो बार प्रहार किया’ के रूप में घटना का सीधा वर्णन
  alternative: अनुवाद की पंक्ति में ही इस कार्य को अवज्ञा या अपराध कहकर व्याख्यायित करना
  rationale: यह पद मूसा के कार्य और उसके परिणाम का वर्णन करता है। व्यापक प्रसंग उसके कार्य का धार्मिक मूल्यांकन करता है, पर उसे इस वाक्य में जोड़ना मूल पाठ से अधिक कहना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण कथात्मक शैली। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है। ‘मण्डली’ और ‘लाठी’ जैसे प्रचलित शब्द पंचग्रन्थीय संदर्भ तथा सामान्य पाठक—दोनों के अनुकूल हैं।
