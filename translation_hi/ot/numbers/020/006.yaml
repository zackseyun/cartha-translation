id: NUM.20.6
reference: Numbers 20:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּבֹא֩ מֹשֶׁ֨ה וְ/אַהֲרֹ֜ן מִ/פְּנֵ֣י הַ/קָּהָ֗ל אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶ֑ם וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֲלֵי/הֶֽם־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/006.yaml
  text: Then Moses and Aaron came from before the assembly to the entrance of the tent of meeting and fell on their faces[c][b][a], and the glory of Yahweh appeared to them.
translation:
  language: hi
  text: तब मूसा और हारून सभा की उपस्थिति से हटकर मिलाप के तंबू के द्वार पर गए और मुँह के बल गिर पड़े; और याहवे की महिमा उन्हें दिखाई दी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: गए
  rationale: בוא का अर्थ दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ मूसा और हारून सभा से तंबू की ओर बढ़ते हैं, इसलिए हिन्दी में ‘गए’ स्वाभाविक है।
- source_word: מִפְּנֵי הַקָּהָל
  choice: सभा के सामने से
  rationale: यह इब्रानी स्थान-सूचक मुहावरे के निकट है और बताता है कि वे एकत्र लोगों की उपस्थिति से हटकर गए।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: פֶּתַח प्रवेश-द्वार को और אֹהֶל מוֹעֵד उस पवित्र तंबू को सूचित करता है जहाँ परमेश्वर इस्राएल से मिलता था; यह प्रचलित और सहज हिन्दी पदबंध है।
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: मुँह के बल गिर पड़े
  rationale: यह मूल शारीरिक मुद्रा को स्वाभाविक हिन्दी में स्पष्ट रखता है, बिना उसके उद्देश्य को केवल आराधना या विनती मानकर सीमित किए।
- source_word: כְבוֹד יְהוָה
  choice: यहोवा की महिमा
  rationale: כָּבוֹד यहाँ परमेश्वर की प्रकट महिमा को सूचित करता है और יְהוָה को हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיֵּרָא ... אֲלֵיהֶם
  choice: उन्हें दिखाई दी
  rationale: נראה का निफ़अल रूप दृश्य प्रकट होने को बताता है; ‘उन्हें दिखाई दी’ हिन्दी में स्वाभाविक है और मूल के अर्थ को बनाए रखता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय दिव्य नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: मुँह के बल गिरने की मुद्रा का आशय
  choice: मुद्रा का सीधा वर्णन
  alternative: उन्होंने दंडवत किया / प्रार्थना की
  rationale: पद स्वयं मुद्रा बताता है, पर उसके आशय को स्पष्ट रूप से केवल आराधना या प्रार्थना नहीं कहता; इसलिए निहित धार्मिक क्रिया को जोड़ना उचित नहीं है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘सभा’, ‘मिलापवाला तंबू’ और ‘यहोवा की महिमा’ परिचित बाइबलीय पद हैं; वाक्य-विन्यास हिन्दी कथात्मक प्रवाह के अनुरूप है।
