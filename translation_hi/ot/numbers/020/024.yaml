source:
  edition: WLC
  text: יֵאָסֵ֤ף אַהֲרֹן֙ אֶל עַמָּ֔י/ו כִּ֣י לֹ֤א יָבֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁ֥ר נָתַ֖תִּי לִ/בְנֵ֣י יִשְׂרָאֵ֑ל עַ֛ל אֲשֶׁר מְרִיתֶ֥ם אֶת פִּ֖/י לְ/מֵ֥י מְרִיבָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/024.yaml
  text: Aaron will be gathered to his people[a], because he will not enter the land that I have given to the sons of Israel[b], because you rebelled against my command at the waters of Meribah.
translation:
  language: hi
  text: हारून अपने लोगों में जा मिलेगा[a], क्योंकि वह उस भूमि में प्रवेश नहीं करेगा जो मैंने इस्राएल के पुत्रों को दी है; इस कारण कि तुम लोगों ने मरीबा के जल के निकट मेरी आज्ञा के विरुद्ध विद्रोह किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मृत्यु में अपने लोगों से जा मिलना।
    reason: मूल इब्रानी मृत्यु-सम्बन्धी मुहावरे का अर्थ स्पष्ट करना, बिना उसे केवल ‘मर जाएगा’ तक सीमित किए।
  - marker: b
    text: शाब्दिक रूप से, “मेरे मुँह के विरुद्ध”; अर्थात मेरे मुख से निकली आज्ञा के विरुद्ध।
    reason: इब्रानी मुहावरे का शाब्दिक रूप और ‘आज्ञा’ वाला अभिप्राय स्पष्ट करना।
lexical_decisions:
- source_word: יֵאָסֵף אֶל־עַמָּיו
  choice: अपने लोगों में मिला लिया जाएगा
  rationale: मृत्यु के लिए प्रयुक्त इब्रानी कर्मवाच्य मुहावरे को केवल ‘मर जाएगा’ कहकर सपाट करने के बजाय उसके गंभीर और पूर्वज-सम्बन्धी भाव को बनाए रखता है।
- source_word: יָבֹא אֶל־הָאָרֶץ
  choice: उस देश में प्रवेश नहीं करेगा
  rationale: गति-सूचक क्रिया और पूर्वसर्ग का स्वाभाविक हिन्दी रूप है; ‘देश’ सन्दर्भ में इस्राएल को दिए भूभाग को दर्शाता है।
- source_word: אֲשֶׁר נָתַתִּי
  choice: जिसे मैंने ... दिया है
  rationale: इब्रानी पूर्ण क्रिया परमेश्वर द्वारा किए गए निश्चित दान को वर्तमान प्रासंगिकता सहित व्यक्त करती है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों को
  rationale: सूत्रबद्ध इब्रानी पदबंध के पुरुषवाचक रूप को मुख्य पाठ में प्रत्यक्ष रूप से सुरक्षित रखा गया है।
- source_word: מְרִיתֶם
  choice: तुम लोगों ने ... विरोध किया था
  rationale: बहुवचन को स्पष्ट करते हुए מרה के अधिकार-विरोधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘बलवा किया’ की तुलना में यहाँ ‘आज्ञा का विरोध’ अधिक सहज है।
- source_word: אֶת־פִּי
  choice: मेरी आज्ञा का
  rationale: शाब्दिक अर्थ ‘मेरे मुँह का’ है, पर इस मुहावरे में आशय परमेश्वर के मुख से निकली आज्ञा से है।
- source_word: לְמֵי מְרִיבָה
  choice: मरीबा के जल के पास
  rationale: स्थान और घटना के संकेत को बनाए रखते हुए व्यक्तिवाचक नाम ‘मरीबा’ का अनुवाद नहीं किया गया।
theological_decisions:
- issue: ‘अपने लोगों में मिला लिया जाएगा’ मृत्यु-मुहावरे का अनुवाद
  choice: मुहावरे को मुख्य पाठ में सुरक्षित रखना
  alternative: ‘हारून मर जाएगा’
  rationale: मूल अभिव्यक्ति केवल शारीरिक मृत्यु की सूचना से अधिक, अपने लोगों से मृत्यु में जुड़ने का साहित्यिक भाव रखती है; इसे बनाए रखना परलोक के बारे में कोई विस्तृत सिद्धान्त आरोपित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का लिंग-सापेक्ष रूप
  choice: ‘इस्राएल के पुत्रों’
  alternative: ‘इस्राएलियों’ अथवा ‘इस्राएल के लोगों’
  rationale: मुख्य पाठ में मूल के सूत्रबद्ध पुरुषवाचक रूप को रखा गया है, जबकि पादटिप्पणी उसका अधिक प्रचलित सामूहिक हिन्दी रूप बताती है।
- issue: मूसा और हारून को सम्बोधित बहुवचन आरोप
  choice: ‘तुम लोगों ने’
  alternative: एकवचन ‘तुमने’
  rationale: מְרִיתֶם द्वितीय पुरुष पुल्लिंग बहुवचन है; हिन्दी में ‘तुम लोगों ने’ इस संख्या को स्पष्ट रखता है और दोनों अगुओं की उत्तरदायित्वपूर्ण संलग्नता को नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मिला लिया जाएगा’ मूल के कर्मवाच्य और गंभीर मृत्यु-मुहावरे को सुरक्षित करता है। ‘तुम लोगों ने’ इब्रानी बहुवचन को स्पष्ट करता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
