  text: וַ/יִּשְׁלַ֨ח מֹשֶׁ֧ה מַלְאָכִ֛ים מִ/קָּדֵ֖שׁ אֶל מֶ֣לֶךְ אֱד֑וֹם כֹּ֤ה אָמַר֙ אָחִ֣י/ךָ יִשְׂרָאֵ֔ל אַתָּ֣ה יָדַ֔עְתָּ אֵ֥ת כָּל הַ/תְּלָאָ֖ה אֲשֶׁ֥ר מְצָאָֽתְ/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/014.yaml
  text: 'Then Moses sent messengers from Kadesh to the king of Edom: “Thus says your brother Israel: You know all the hardship that has come upon us.”[a][b][c]'
translation:
  language: hi
  text: 'तब मूसा ने कादेश से एदोम के राजा के पास दूत भेजे: “आपका भाई इस्राएल यह कहता है: आप उस सारी कठिनाई को जानते हैं जो हम पर आ पड़ी है।”[a][b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आपका संबंधी इस्राएल।” इब्रानी में “आपका भाई इस्राएल” की पारिवारिक भाषा है, जो एदोम और इस्राएल के पूर्वजों के संबंध की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: या “सारे कष्ट” अथवा “सारी परेशानी।”
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ “जिसने हमें पाया”; अर्थात “जो हम पर आ पड़ी है” या “जो हमारे साथ घटी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजे
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: राजनयिक संदर्भ में यह मनुष्य संदेशवाहकों को दर्शाता है, स्वर्गदूतों को नहीं।
- source_word: מִקָּדֵשׁ
  choice: कादेश से
  rationale: इब्रानी पाठ में केवल ‘कादेश’ है; यहाँ ‘कादेश-बर्ने’ जोड़ना उचित नहीं।
- source_word: מֶלֶךְ אֱדוֹם
  choice: एदोम के राजा
  rationale: संबंधवाचक इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: כֹּה אָמַר
  choice: यह कहता है
  rationale: यह प्रचलित दूत-सूत्र है; वर्तमानकाल संदेश को उद्धृत करते समय स्वाभाविक है।
- source_word: אָחִיךָ יִשְׂרָאֵל
  choice: तेरा भाई इस्राएल
  rationale: यह एदोम और इस्राएल के पूर्वजगत संबंध को पारिवारिक भाषा में बनाए रखता है।
- source_word: אַתָּה יָדַעְתָּ
  choice: तू ... जानता है
  rationale: पूर्ण क्रिया यहाँ ज्ञान की वर्तमान अवस्था बताती है; स्पष्ट सर्वनाम का बल भी ‘तू’ से बना रहता है।
- source_word: כָּל הַתְּלָאָה
  choice: उस सारी कठिनाई
  rationale: संज्ञा कष्ट, परेशानी या विपत्ति के अनुभव को व्यक्त करती है; ‘कठिनाई’ स्पष्ट और व्यापक आधुनिक हिन्दी है।
- source_word: אֲשֶׁר מְצָאָתְנוּ
  choice: जो हम पर आ पड़ी है
  rationale: शाब्दिक अर्थ ‘जिसने हमें पाया’ है; ‘हम पर आ पड़ी’ हिन्दी में स्वाभाविक रूप से आकस्मिक कष्ट के आ पहुँचने का भाव रखता है।
theological_decisions:
- issue: इस्राएल और एदोम के बीच भाईचारे की भाषा
  choice: तेरा भाई इस्राएल
  alternative: तेरा संबंधी इस्राएल
  rationale: पद जानबूझकर याकूब और एसाव से जुड़े पूर्वजगत संबंध को प्रत्यक्ष पारिवारिक रूपक में रखता है; इसे सामान्य संबंध में नरम नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। राजा को संबोधन में एकवचन ‘तू/तेरा’ मूल इब्रानी के प्रत्यक्ष एकवचन और भाईचारे की अपील को सुरक्षित रखता है। ‘दूत’ राजनयिक मानव संदेशवाहकों के लिए प्रयुक्त है।
