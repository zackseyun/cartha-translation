  text: קַ֚ח אֶֽת אַהֲרֹ֔ן וְ/אֶת אֶלְעָזָ֖ר בְּנ֑/וֹ וְ/הַ֥עַל אֹתָ֖/ם הֹ֥ר הָ/הָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/020/025.yaml
  text: Take Aaron and Eleazar his son[a], and bring them up Mount Hor.
translation:
  language: hi
  text: हारून और उसके पुत्र एलआज़ार को ले और उन दोनों को होर पर्वत[a] पर चढ़ा ले जा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “होर, वह पर्वत।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח
  choice: ले
  rationale: לקח के काल आदेशात्मक रूप का सीधा अर्थ ‘ले’ है; यहाँ मूसा को हारून और एलआज़ार को साथ लेने की आज्ञा दी गई है।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी रूप।
- source_word: אֶלְעָזָר
  choice: एलआज़ार
  rationale: इब्रानी नाम की ध्वनि के निकट, आधुनिक देवनागरी लिप्यंतरण।
- source_word: בְּנוֹ
  choice: उसके पुत्र
  rationale: पुल्लिंग एकवचन प्रत्यय का स्वाभाविक संदर्भ हारून है; ‘उसके पुत्र एलआज़ार’ संबंध को स्पष्ट रखता है।
- source_word: וְהַעַל
  choice: चढ़ा ले जा
  rationale: עלה का हिफ़ील आदेशात्मक रूप कारणवाचक है—‘ऊपर चढ़ाना/ले जाना’; पर्वत के संदर्भ में ‘चढ़ा ले जा’ स्वाभाविक हिन्दी है और इस भाव को बनाए रखता है।
- source_word: אֹתָם
  choice: उन दोनों को
  rationale: बहुवचन कर्मवाचक सर्वनाम हारून और एलआज़ार दोनों की ओर संकेत करता है; हिन्दी में ‘दोनों’ संदर्भ को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: הֹר הָהָר
  choice: होर पर्वत
  rationale: इब्रानी पदबंध का रूपगत अर्थ ‘होर, वह पर्वत’ है, पर स्थान-नाम के रूप में हिन्दी में ‘होर पर्वत’ स्वाभाविक और परंपरागत है।
