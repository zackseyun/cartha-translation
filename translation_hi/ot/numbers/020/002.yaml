  text: There was no water for the congregation[a], and they assembled against Moses and against Aaron.
translation:
  language: hi
  text: मण्डली[a] के पास पानी नहीं था, और वे मूसा और हारून के विरुद्ध इकट्ठे हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सभा’ या ‘समुदाय’। हिब्रू עֵדָה इस्राएल के एकत्रित लोगों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/לֹא הָיָה
  choice: नहीं था
  rationale: היה के साथ निषेध यहाँ अस्तित्व का भाव व्यक्त करता है; हिन्दी में ‘पानी नहीं था’ स्वाभाविक और सटीक है। आरम्भिक וְ को अलग शब्द से व्यक्त करना आवश्यक नहीं, क्योंकि हिन्दी वाक्य-प्रवाह में संबंध स्पष्ट है।
- source_word: מַיִם
  choice: पानी
  rationale: हिब्रू का बहुवचन रूप पदार्थवाचक है; सामान्य आधुनिक हिन्दी में ‘पानी’ उपयुक्त है।
- source_word: לָ/עֵדָה
  choice: मण्डली के लिए
  rationale: עֵדָה इस्राएल के सामूहिक जनसमुदाय को सूचित करता है। ‘मण्डली’ उसके संगठित सामुदायिक भाव को बनाए रखता है।
- source_word: וַ/יִּקָּהֲלוּ
  choice: वे ... इकट्ठे हुए
  rationale: קהל का क्रियात्मक रूप समूह के रूप में एकत्र होने को दर्शाता है; ‘इकट्ठे हुए’ आधुनिक हिन्दी में सहज है।
- source_word: עַל מֹשֶׁה וְ/עַל אַהֲרֹן
  choice: मूसा और हारून के विरुद्ध
  rationale: आगामी विवाद के संदर्भ में עַל विरोध का भाव रखता है। हिन्दी में साझा ‘के विरुद्ध’ दोनों व्यक्तियों पर स्वाभाविक रूप से लागू होता है।
