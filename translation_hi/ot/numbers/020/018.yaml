  text: But Edom said to him[a], “You shall not pass through me[b], lest I come out against you with the sword.”
translation:
  language: hi
  text: लेकिन एदोम ने उससे कहा, “तू मेरे देश से होकर नहीं जाएगा[a], नहीं तो मैं तलवार लेकर तेरे विरुद्ध निकल आऊँगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तू मुझमें से होकर नहीं जाएगा।” एदोम यहाँ राष्ट्र और उसके भू-भाग के रूप में बोल रहा है।
    reason: lexical_alternative
  - marker: b
    text: या “तुझसे मिलने निकल आऊँगा।” इस प्रसंग में यह सशस्त्र विरोध में सामने आने का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו אֱדוֹם
  choice: पर एदोम ने उससे कहा
  rationale: वाक्य प्रसंग में विरोध दिखाता है; אֵלָיו का सीधा अर्थ ‘उससे’ है और אֱדוֹם राष्ट्र को मानवीकृत वक्ता के रूप में प्रस्तुत करता है।
- source_word: לֹא תַעֲבֹר בִּי
  choice: तू मेरे देश में से होकर नहीं जा सकता
  rationale: בִּי का शाब्दिक रूप ‘मुझमें/मेरे भीतर’ है, पर यहाँ एदोम राष्ट्र-प्रदेश के रूप में बोल रहा है; स्वाभाविक हिन्दी में आशय उसके देश से होकर जाने का है। निषेध को दृढ़ अनुमति-अस्वीकार के रूप में व्यक्त किया गया है।
- source_word: פֶּן
  choice: नहीं तो
  rationale: यह चेतावनी के परिणाम को आरम्भ करता है; आधुनिक हिन्दी में ‘नहीं तो’ धमकी का बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּחֶרֶב
  choice: तलवार लेकर
  rationale: हिब्रू पद सशस्त्र और शत्रुतापूर्ण कार्रवाई का संकेत देता है; ‘तलवार लेकर’ हिन्दी में स्वाभाविक है।
- source_word: אֵצֵא לִקְרָאתֶךָ
  choice: तेरा सामना करने निकलूँगा
  rationale: לִקְרָאתֶךָ मूलतः ‘तुझसे मिलने/तेरे सामने आने’ का अर्थ रखता है, पर इस सैन्य धमकी में मुठभेड़ का भाव है। ‘सामना करने’ उस शत्रुतापूर्ण अर्थ को व्यक्त करते हुए मूल क्रिया की छवि बचाता है।
