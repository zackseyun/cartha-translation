  text: בַּ/חֹ֨דֶשׁ הַ/שֵּׁנִ֜י בְּ/אַרְבָּעָ֨ה עָשָׂ֥ר י֛וֹם בֵּ֥ין הָ/עַרְבַּ֖יִם יַעֲשׂ֣וּ אֹת֑/וֹ עַל מַצּ֥וֹת וּ/מְרֹרִ֖ים יֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/011.yaml
  text: In the second month[a], on the fourteenth day at twilight, they shall keep it; they shall eat it with unleavened bread and bitter herbs.
translation:
  language: hi
  text: दूसरे महीने के चौदहवें दिन, साँझ के समय[a] वे इसे मनाएँ। वे इसे अख़मीरी रोटी और कड़वे साग के साथ खाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “दो साँझों के बीच”; यह सूर्यास्त के आसपास के समय के लिए प्रयुक्त इब्रानी मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּחֹדֶשׁ הַשֵּׁנִי
  choice: दूसरे महीने
  rationale: यहाँ חֹדֶשׁ का सामान्य पंचांगीय अर्थ ‘महीना’ है; पदबंध समय बताता है।
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם
  choice: चौदहवें दिन
  rationale: इब्रानी में संख्या और ‘दिन’ का यह प्रयोग तारीख बताता है; हिन्दी में क्रमवाचक रूप स्वाभाविक है।
- source_word: בֵּין הָעַרְבַּיִם
  choice: साँझ के समय
  rationale: शाब्दिक अर्थ ‘दो साँझों के बीच’ है और मुहावरा सूर्यास्त के आसपास के समय को सूचित करता है; स्पष्ट हिन्दी के लिए ‘साँझ के समय’ रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: वे इसे मनाएँ
  rationale: फसह के संदर्भ में עשה का अर्थ अनुष्ठान को करना या मनाना है; केवल ‘करें’ की अपेक्षा ‘मनाएँ’ अधिक स्वाभाविक और प्रसंगानुकूल है।
- source_word: עַל מַצּוֹת
  choice: अख़मीरी रोटी के साथ
  rationale: भोजन के इस संदर्भ में עַל साथ होने का भाव देता है; מַצּוֹת बिना ख़मीर की रोटी को सूचित करता है।
- source_word: וּמְרֹרִים
  choice: और कड़वे साग
  rationale: बहुवचन संज्ञा फसह के साथ खाए जाने वाले कड़वे वनस्पति-आहार को दर्शाती है; ‘कड़वे साग’ सहज और सटीक हिन्दी है।
- source_word: יֹאכְלֻהוּ
  choice: वे इसे खाएँ
  rationale: यह विधिक निर्देश में प्रयुक्त क्रिया है, जिसका कर्मवाचक प्रत्यय पहले उल्लिखित फसह को संदर्भित करता है।
