id: NUM.9.5
reference: Numbers 9:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲשׂ֣וּ אֶת הַ/פֶּ֡סַח בָּ/רִאשׁ֡וֹן בְּ/אַרְבָּעָה֩ עָשָׂ֨ר י֥וֹם לַ/חֹ֛דֶשׁ בֵּ֥ין הָ/עַרְבַּ֖יִם בְּ/מִדְבַּ֣ר סִינָ֑י כְּ֠/כֹל אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/005.yaml
  text: So they kept the Passover in the first month[a], on the fourteenth day of the month at twilight, in the wilderness of Sinai; according to all that Yahweh had commanded Moses, so the sons of Israel did.
translation:
  language: hi
  text: 'उन्होंने पहले महीने के चौदहवें दिन, साँझ के समय[a], सीनै के निर्जन प्रदेश में फसह मनाया। याहवे ने मूसा को जो कुछ आज्ञा दी थी, उसी के अनुसार इस्राएल के पुत्रों ने किया।


    [a] इब्रानी में शाब्दिक अर्थ “दो संध्याओं के बीच” है; यह साँझ के धुँधलके के समय को सूचित करने वाला मुहावरा है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “दो संध्याओं के बीच” है; यह साँझ के धुँधलके के समय को सूचित करने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ / עָשׂוּ
  choice: मनाया / किया
  rationale: פֶּסַח के साथ עשה फसह का अनुष्ठान मनाने का भाव देता है; अंतिम עָשׂוּ को ‘किया’ रखकर इब्रानी निष्कर्ष की पुनरुक्ति सुरक्षित रखी गई है।
- source_word: הַפֶּסַח
  choice: फसह
  rationale: संदर्भ में यह केवल बलि-पशु नहीं, बल्कि संपूर्ण फसह-अनुष्ठान को सूचित करता है।
- source_word: בָּרִאשׁוֹן
  choice: पहले महीने
  rationale: आगे आने वाली तिथि से स्पष्ट कालदर्शकीय संदर्भ के कारण हिन्दी में ‘महीने’ जोड़ना स्वाभाविक और स्पष्ट है।
- source_word: בְּאַרְבָּעָה עָשָׂר יוֹם לַחֹדֶשׁ
  choice: महीने के चौदहवें दिन
  rationale: यह इब्रानी की सामान्य तिथि-सूचक रचना का निकट और सहज हिन्दी रूप है।
- source_word: בֵּין הָעַרְבַּיִם
  choice: साँझ के समय
  rationale: शाब्दिक रूप ‘दो संध्याओं के बीच’ एक मुहावरा है, जो साँझ के धुँधलके को सूचित करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בְּמִדְבַּר סִינָי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר आबादी से दूर सूखे या निर्जन भूभाग को दर्शाता है; ‘निर्जन प्रदेश’ हिन्दी में इसके व्यापक अर्थ को व्यक्त करता है।
- source_word: כְּכֹל אֲשֶׁר
  choice: जो कुछ ... उसी के अनुसार
  rationale: यह रचना आज्ञा के साथ पूर्ण अनुरूपता पर बल देती है और हिन्दी में स्वाभाविक रूप से व्यक्त होती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: आज्ञा फसह मनाए जाने से पहले दी जा चुकी थी; हिन्दी का पूर्ण भूतकाल इस क्रम को स्पष्ट करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल का स्पष्ट पुत्रवाची और सामूहिक रूप सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम प्रत्यक्ष है; इसलिए उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक और लिंगसूचक रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल की संतान
  rationale: यहाँ मूल की व्याकरणिक रूप से पुल्लिंग, स्पष्ट पुत्रवाची अभिव्यक्ति को बनाए रखा गया है, जबकि संदर्भ में उसका सामूहिक आशय बना रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रूप। ‘फसह’ पारंपरिक बाइबलीय पद है; वाक्य-संरचना सहज रखते हुए मूल की आज्ञा-पालन संबंधी समग्रता और अंतिम ‘किया’ सुरक्षित रखी गई है।
