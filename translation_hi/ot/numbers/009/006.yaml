source:
  edition: WLC
  text: וַ/יְהִ֣י אֲנָשִׁ֗ים אֲשֶׁ֨ר הָי֤וּ טְמֵאִים֙ לְ/נֶ֣פֶשׁ אָדָ֔ם וְ/לֹא יָכְל֥וּ לַ/עֲשֹׂת הַ/פֶּ֖סַח בַּ/יּ֣וֹם הַ/ה֑וּא וַֽ/יִּקְרְב֞וּ לִ/פְנֵ֥י מֹשֶׁ֛ה וְ/לִ/פְנֵ֥י אַהֲרֹ֖ן בַּ/יּ֥וֹם הַ/הֽוּא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/006.yaml
  text: There were men who were unclean because of a human corpse[a], so they could not keep the Passover on that day; and they came near before Moses and before Aaron on that day.
translation:
  language: hi
  text: कुछ पुरुष एक मनुष्य के शव के कारण अशुद्ध थे[a], इसलिए वे उस दिन फसह का पालन नहीं कर सके; और उसी दिन वे मूसा और हारून के सामने आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मनुष्य के नेफ़ेश के लिए अशुद्ध।” यहाँ “नेफ़ेश” मानव शव से होने वाली अनुष्ठानिक अशुद्धता के लिए प्रयुक्त मुहावरे का भाग है।
    reason: इब्रानी मुहावरे की शाब्दिक संरचना तथा उसके अनुष्ठानिक अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיְהִי אֲנָשִׁים
  choice: कुछ पुरुष थे
  rationale: वाक्यांश नई कथात्मक परिस्थिति प्रस्तुत करता है। אֲנָשִׁים पुल्लिंग बहुवचन है, इसलिए ‘पुरुष’ स्रोत के अनुरूप है; ‘कुछ’ हिन्दी में अनिश्चित बहुवचन को स्वाभाविक बनाता है।
- source_word: טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: एक मनुष्य के शव के कारण अशुद्ध
  rationale: पुरोहितीय शुद्धता-विधान में यह मुहावरा मानव शव से उत्पन्न अनुष्ठानिक अशुद्धता बताता है, नैतिक दोष नहीं। ‘शव’ अर्थ को आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: וְלֹא יָכְלוּ
  choice: इसलिए वे ... नहीं मना सके
  rationale: अशुद्धता के परिणामस्वरूप असमर्थता व्यक्त होती है; ‘इसलिए’ इस संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: לַעֲשֹׂת הַפֶּסַח
  choice: फसह मनाना
  rationale: शाब्दिक ‘फसह करना’ हिन्दी में अस्वाभाविक है। यहाँ अर्थ निर्धारित विधि के अनुसार फसह का पालन करना है; ‘मनाना’ सामान्य पाठक के लिए सहज है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन / उसी दिन
  rationale: पहली बार ‘उस दिन’ सीधा काल-सूचक है; पुनरावृत्ति में ‘उसी दिन’ स्रोत के बल और हिन्दी की स्वाभाविकता दोनों को बनाए रखता है।
- source_word: וַיִּקְרְבוּ לִפְנֵי
  choice: सामने आए
  rationale: קרב और לִפְנֵי का संयुक्त भाव किसी के सम्मुख आने का है। यह औपचारिक उपस्थिति को व्यक्त करता है, पर इसे अनावश्यक रूप से कानूनी याचिका नहीं बनाता।
- source_word: מֹשֶׁה ... אַהֲרֹן
  choice: मूसा ... हारून
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पाठकों के लिए पहचाने जाने योग्य नाम-रूप।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: मानव शव के कारण हुई अनुष्ठानिक अशुद्धता
  alternative: ‘मनुष्य के प्राण के लिए अशुद्ध’ जैसा शब्दशः रूप
  rationale: गिनती और अन्य पंचग्रंथीय शुद्धता-विधानों में यह मृत्यु अथवा शव से जुड़ी धार्मिक-अनुष्ठानिक अशुद्धता का मुहावरा है। अनुवाद नैतिक पाप का अर्थ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘फसह’ पारंपरिक बाइबलीय पद है; ‘अशुद्ध’ अनुष्ठानिक संदर्भ बनाए रखता है। स्रोत में दो बार आए ‘उस दिन’ को हिन्दी में ‘उस दिन ... उसी दिन’ से संरक्षित किया गया है।
