id: NUM.9.18
reference: Numbers 9:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַל פִּ֣י יְהוָ֗ה יִסְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/עַל פִּ֥י יְהוָ֖ה יַחֲנ֑וּ כָּל יְמֵ֗י אֲשֶׁ֨ר יִשְׁכֹּ֧ן הֶ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יַחֲנֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/018.yaml
  text: At the command of Yahweh the sons of Israel set out[a], and at the command of Yahweh they camped. All the days that the cloud remained over the tabernacle, they remained camped.
translation:
  language: hi
  text: याहवे की आज्ञा पर[a] इस्राएली कूच करते थे, और याहवे की आज्ञा पर वे पड़ाव डालते थे। जितने दिन बादल निवासस्थान के ऊपर ठहरा रहता, उतने दिन वे पड़ाव डाले रहते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के मुँह के अनुसार”; यह इब्रानी मुहावरा “याहवे की आज्ञा पर” के अर्थ में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל פִּי יְהוָה
  choice: याहवे की आज्ञा पर
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘याहवे के मुँह के अनुसार’ है, पर यहाँ उसका आशय याहवे के आधिकारिक निर्देश से है। ‘आज्ञा पर’ आधुनिक हिन्दी में स्वाभाविक और अर्थ-सटीक है।
- source_word: יִסְעוּ
  choice: कूच करते थे
  rationale: נסע शिविर उखाड़कर आगे बढ़ने को व्यक्त करता है। प्रसंग की बार-बार होने वाली क्रिया को हिन्दी के अभ्यस्त भूतकाल से स्पष्ट किया गया है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ के स्थान पर ‘इस्राएली’ आधुनिक हिन्दी में स्वाभाविक है और पूरे समुदाय को स्पष्ट रूप से व्यक्त करता है।
- source_word: יַחֲנוּ
  choice: पड़ाव डालते थे / पड़ाव डाले रहते थे
  rationale: חנה का मूल अर्थ पड़ाव डालना है। अंतिम प्रयोग में अवधि-सूचक उपवाक्य के कारण जारी अवस्था को ‘पड़ाव डाले रहते थे’ से व्यक्त किया गया है।
- source_word: כָּל יְמֵי אֲשֶׁר
  choice: जितने दिन … उतने दिन
  rationale: यह हिन्दी संरचना मूल के पूरे समय तक जारी रहने वाले भाव को स्वाभाविक रूप से बनाए रखती है।
- source_word: יִשְׁכֹּן
  choice: ठहरा रहता
  rationale: שכן यहाँ बादल की निरंतर उपस्थिति बताता है। ‘ठहरा रहता’ अस्थायी जंगल-यात्रा के प्रसंग में ‘निवास करता’ से अधिक स्वाभाविक है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: दृश्य बादल के लिए सीधा और प्रचलित हिन्दी शब्द।
- source_word: הַמִּשְׁכָּן
  choice: निवासस्थान
  rationale: מִשְׁכָּן उस पवित्र स्थान को दर्शाता है जहाँ परमेश्वर अपनी प्रजा के बीच निवास करता था। ‘निवासस्थान’ शब्द के मूल भाव को बनाए रखता है और इसे אֹהֶל מוֹעֵד, ‘मिलापवाला तंबू’, से नहीं मिलाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसे हिन्दी लिपि में नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ कहने से नाम उपाधि में बदल जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण वर्णनात्मक रूप अपनाया गया है। प्रसंग में बार-बार होने वाली यात्रा और पड़ाव को ‘करते थे’ से, तथा बादल के ठहरे रहने तक जारी अवस्था को ‘डाले रहते थे’ से व्यक्त किया गया है।
