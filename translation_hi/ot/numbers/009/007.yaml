source:
  edition: WLC
  text: וַ֠/יֹּאמְרוּ הָ/אֲנָשִׁ֤ים הָ/הֵ֨מָּה֙ אֵלָ֔י/ו אֲנַ֥חְנוּ טְמֵאִ֖ים לְ/נֶ֣פֶשׁ אָדָ֑ם לָ֣/מָּה נִגָּרַ֗ע לְ/בִלְתִּ֨י הַקְרִ֜ב אֶת קָרְבַּ֤ן יְהוָה֙ בְּ/מֹ֣עֲד֔/וֹ בְּ/ת֖וֹךְ בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/007.yaml
  text: And those men said to him[a], “We are unclean by a human corpse[c][b]. Why should we be kept from presenting the offering of Yahweh at its appointed time among the sons of Israel?”
translation:
  language: hi
  text: तब उन पुरुषों ने उससे कहा, “हम किसी मनुष्य के शव के कारण अशुद्ध हैं। हमें इस्राएलियों के बीच नियत समय पर याहवे की भेंट चढ़ाने से क्यों वंचित रखा जाए?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמְרוּ הָאֲנָשִׁים הָהֵמָּה אֵלָיו
  choice: तब उन पुरुषों ने उससे कहा
  rationale: नैरेटिव wayyiqtol को स्वाभाविक हिन्दी में ‘तब ... कहा’ से व्यक्त किया गया है; ‘उन पुरुषों’ से संकेतवाचक संदर्भ बना रहता है।
- source_word: אֲנַחְנוּ טְמֵאִים לְנֶפֶשׁ אָדָם
  choice: हम किसी मनुष्य के शव के कारण अशुद्ध हैं
  rationale: लְנֶפֶשׁ אָדָם याजकीय सन्दर्भ में मानव शव से उत्पन्न अशुद्धता का मुहावरा है। ‘शव के कारण’ अर्थ स्पष्ट करता है, बिना पाठ से अधिक संपर्क-विवरण जोड़े।
- source_word: לָמָּה נִגָּרַע
  choice: हमें ... क्यों वंचित रखा जाए
  rationale: נגרע का निफ़अल यहाँ सहभागिता से रोके या अलग किए जाने का निष्क्रिय भाव देता है।
- source_word: לְבִלְתִּי הַקְרִב אֶת קָרְבַּן יְהוָה
  choice: यहोवा की भेंट चढ़ाने से
  rationale: बलिदानी प्रसंग में הקריב का स्वाभाविक हिन्दी रूप ‘चढ़ाना’ और קרבן का ‘भेंट’ है; יְהוָה को व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בְּמֹעֲדוֹ
  choice: नियत समय पर
  rationale: מוֹעֵד यहाँ विधिवत ठहराए गए निश्चित समय को सूचित करता है।
- source_word: בְּתוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के बीच
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ का प्रचलित जातीय अर्थ आधुनिक हिन्दी में ‘इस्राएलियों’ से स्पष्ट और स्वाभाविक रूप में व्यक्त होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को नाम के रूप में बनाए रखता है।
- issue: לְנֶפֶשׁ אָדָם में शव-अशुद्धता
  choice: किसी मनुष्य के शव के कारण अशुद्ध
  alternative: किसी मृत व्यक्ति के कारण अशुद्ध / किसी मनुष्य की देह से अशुद्ध
  rationale: यह वाक्यांश याजकीय विधि में मानव शव के कारण होने वाली अनुष्ठानिक अशुद्धता बताता है; अनुवाद इसे नैतिक अशुद्धता नहीं बनाता।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह स्थापित सामुदायिक जातिनाम है; यहाँ केवल पुरुष वंशजों पर बल नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सहज वाक्य-विन्यास। ‘अशुद्ध’, ‘भेंट’ और ‘नियत समय’ विधिक-उपासना संबंधी आशय को सामान्य पाठक के लिए स्पष्ट रखते हैं।
