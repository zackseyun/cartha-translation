  choice: इसी महीने के चौदहवें दिन
  rationale: इब्रानी तिथि-वाक्यांश को स्वाभाविक आधुनिक हिन्दी क्रम में रखा गया है और निश्चित तिथि की स्पष्टता बनाए रखी गई है।
- source_word: בֵּין הָעַרְבַּיִם
  choice: दोनों साँझों के बीच
  rationale: इब्रानी के द्विवचन और पारंपरिक अनुष्ठानिक समय-वाक्यांश को व्याख्यात्मक रूप से केवल ‘साँझ के समय’ कर देने के बजाय यथासंभव सुरक्षित रखा गया है; अर्थ-सहायता पादटिप्पणी में दी गई है।
- source_word: תַּעֲשׂוּ אֹתוֹ
  choice: तुम उसे ... मनाओ
  rationale: फसह के संदर्भ में עשה का अर्थ किसी उत्सव को करना या मनाना है। ‘मनाओ’ आधुनिक हिन्दी में स्वाभाविक है, और मूल की पुनरावृत्ति दोनों स्थानों पर रखी गई है।
- source_word: בְּמוֹעֲדוֹ
  choice: उसके नियत समय पर
  rationale: מוֹעֵד के निश्चित, ठहराए हुए अनुष्ठानिक समय का भाव ‘नियत समय’ से स्पष्ट और संक्षिप्त रूप में व्यक्त होता है।
- source_word: כְּכָל חֻקֹּתָיו
  choice: उसके सभी विधानों के अनुसार
  rationale: חֻקּוֹת के निर्धारित धार्मिक प्रावधानों के औपचारिक भाव के लिए ‘विधान’ चुना गया है।
- source_word: וּכְכָל מִשְׁפָּטָיו
  choice: और उसके सभी नियमों के अनुसार
  rationale: מִשְׁפָּטִים को ‘नियम’ कहने से सामान्य पाठक के लिए अर्थ स्पष्ट रहता है और ‘विधान’ से इसका शाब्दिक भेद भी बना रहता है।
