base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/003.yaml
  text: On the fourteenth day of this month[a], between the evenings, you shall keep it at its appointed time; according to all its statutes and according to all its ordinances you shall keep it.
translation:
  language: hi
  text: इस महीने के चौदहवें दिन, दोनों साँझों के बीच[a], तुम उसे उसके नियत समय पर मनाओ। उसके सभी विधानों और उसके सभी नियमों के अनुसार उसे मनाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘दोनों साँझों के बीच’; यह गोधूलि के आसपास के समय के लिए प्रयुक्त एक पारंपरिक इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
