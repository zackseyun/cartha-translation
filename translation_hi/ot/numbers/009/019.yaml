source:
  edition: WLC
  text: וּ/בְ/הַאֲרִ֧יךְ הֶֽ/עָנָ֛ן עַל הַ/מִּשְׁכָּ֖ן יָמִ֣ים רַבִּ֑ים וְ/שָׁמְר֧וּ בְנֵי יִשְׂרָאֵ֛ל אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֥א יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/019.yaml
  text: When the cloud remained over the tabernacle for many days[b][a], the sons of Israel kept the charge of Yahweh and did not set out.
translation:
  language: hi
  text: जब बादल बहुत दिनों तक पवित्र निवास-स्थान के ऊपर ठहरा रहता था, तब इस्राएल के पुत्र[a] याहवे की आज्ञा[b] का पालन करते थे और कूच नहीं करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली” अथवा “इस्राएल की संतान।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
  - marker: b
    text: या “याहवे का दायित्व,” “याहवे की सौंपी गई ज़िम्मेदारी,” अथवा “याहवे की अपेक्षा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַאֲרִיךְ הֶעָנָן
  choice: जब बादल ... ठहरा रहता
  rationale: בְ + infinitive construct यहाँ समयसूचक उपवाक्य बनाता है और אָרַךְ बादल के लंबे समय तक बने रहने को व्यक्त करता है। हिंदी में यह प्रयोग स्वाभाविक रूप से निरंतर अवधि बताता है।
- source_word: עַל הַמִּשְׁכָּן
  choice: पवित्र निवास के ऊपर
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और इस संदर्भ में यह जंगल के पवित्र तंबू को सूचित करता है। ‘पवित्र निवास’ अर्थ को स्पष्ट रखते हुए वर्तमान हिंदी में सहज है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह शब्दशः अवधि का संकेत देता है और हिंदी में दीर्घकाल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह हिब्रू की पारिवारिक-वाचक और व्याकरणतः पुल्लिंग अभिव्यक्ति को निकटता से सुरक्षित रखता है; पाठक की स्पष्टता के लिए वैकल्पिक सामूहिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶת מִשְׁמֶרֶת יְהוָה
  choice: याहवे की सौंपी हुई ज़िम्मेदारी
  rationale: מִשְׁמֶרֶת में सौंपी गई निगरानी, दायित्व या आज्ञा का पालन करने का भाव है। यह चयन केवल ‘आज्ञा’ कहकर अर्थ को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וְלֹא יִסָּעוּ
  choice: और कूच नहीं करते थे
  rationale: נסע जंगल-यात्रा के संदर्भ में पड़ाव छोड़कर आगे चलने को दर्शाता है; ‘कूच करना’ हिंदी में इस प्रसंग के लिए स्पष्ट और संक्षिप्त है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत नाम स्पष्ट रूप से मौजूद है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिंदी लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: בְנֵי יִשְׂרָאֵל की सामूहिक तथा लिंग-संबंधी अभिव्यक्ति
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल की संतान
  rationale: मुख्य पाठ हिब्रू की शाब्दिक पारिवारिक अभिव्यक्ति सुरक्षित रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि संदर्भ में यह समुदाय के सामूहिक नाम के रूप में भी समझा जा सकता है।
- issue: מִשְׁמֶרֶת का दायित्व-संबंधी अर्थ
  choice: सौंपी हुई ज़िम्मेदारी
  alternative: आदेश; रखवाली; दायित्व
  rationale: पद में इस्राएल का न चलना याहवे के निर्देश के प्रति निष्ठावान पालन है। चयन दायित्व और पालन दोनों को व्यक्त करता है, पर इसे किसी विशिष्ट धार्मिक विधान तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘पवित्र निवास’ सामान्य पाठक के लिए मִשְׁכָּן का अर्थ खोलता है; ‘कूच’ जंगल की सामुदायिक यात्रा के प्रसंग को संक्षेप में व्यक्त करता है। अपूर्ण भूतकालीन रूप ‘ठहरा रहता/निभाते रहते/नहीं करते थे’ उस बार-बार लागू होने वाली परिस्थिति और जारी अवधि को दर्शाते हैं।
