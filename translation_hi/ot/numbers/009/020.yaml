source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁ֨ר יִהְיֶ֧ה הֶֽ/עָנָ֛ן יָמִ֥ים מִסְפָּ֖ר עַל הַ/מִּשְׁכָּ֑ן עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּֽעוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/020.yaml
  text: Sometimes the cloud would remain over the tabernacle for a number of days; at the command of Yahweh they would camp[a], and at the command of Yahweh they would set out.
translation:
  language: hi
  text: कभी-कभी बादल कुछ दिनों तक पवित्र निवास के ऊपर ठहरा रहता था। याहवे की आज्ञा पर वे डेरा डालते[a], और याहवे की आज्ञा पर कूच करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “याहवे के मुँह के अनुसार”—अर्थात याहवे की आज्ञा के अनुसार।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: कभी-कभी
  rationale: यह पदबंध बदलती परिस्थितियों के क्रम में आने वाले एक प्रकार के अवसर का परिचय देता है; आधुनिक हिन्दी में ‘कभी-कभी’ इसका स्वाभाविक और संक्षिप्त रूप है।
- source_word: יִהְיֶה הֶעָנָן
  choice: बादल ... ठहरा रहता था
  rationale: यहाँ היה बादल के पवित्र निवास के ऊपर लगातार बने रहने को व्यक्त करता है, केवल उसके अस्तित्व को नहीं।
- source_word: יָמִים מִסְפָּר
  choice: कुछ दिनों तक
  rationale: शाब्दिक अर्थ ‘गिने हुए दिन’ है, अर्थात दिनों की एक सीमित संख्या; ‘कुछ दिनों तक’ सहज हिन्दी है और किसी निश्चित संख्या का संकेत नहीं देता।
- source_word: עַל הַמִּשְׁכָּן
  choice: पवित्र निवास के ऊपर
  rationale: מִשְׁכָּן का मूल भाव ‘निवास-स्थान’ है और इस प्रसंग में वह मरुभूमि के पवित्र तंबू-सदृश निवास को दर्शाता है; ‘पवित्र निवास’ इसे साधारण डेरे से अलग रखते हुए सहज हिन्दी देता है।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा की आज्ञा पर
  rationale: मुहावरे का शाब्दिक रूप ‘यहोवा के मुँह के अनुसार’ है, पर प्रसंग में इसका अर्थ उनके प्रामाणिक आदेश के अनुसार है; फुटनोट शाब्दिक चित्र को सुरक्षित रखता है।
- source_word: יַחֲנוּ
  choice: वे डेरा डाले रहते
  rationale: अपूर्ण क्रिया यहाँ बार-बार होने वाली प्रथा बताती है; बादल के ठहरे रहने की अवधि में लोग डेरा डाले रहते थे।
- source_word: יִסָּעוּ
  choice: कूच करते थे
  rationale: נסע इस यात्रा-वृत्तांत में डेरा समेटकर आगे चल पड़ने को दर्शाता है; ‘कूच करना’ हिन्दी में इस आशय को संक्षेप में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ से नाम और उपाधि का भेद बना रहता है; ‘प्रभु’ मूल के नाम को उपाधि में बदल देता।
- issue: इस्राएल की गति और ठहराव में ईश्वरीय आदेश
  choice: दोनों खंडों में ‘यहोवा की आज्ञा पर’ को स्पष्ट रूप से दोहराया गया
  alternative: दूसरे खंड में सर्वनाम या संक्षिप्त कथन
  rationale: इब्रानी पाठ दोनों क्रियाओं के साथ पूरे पदबंध को दोहराता है, जिससे डेरा डालना और कूच करना—दोनों—यहोवा के आदेश के अधीन होने पर समान बल पड़ता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘डेरा डाले रहते’ अवधि का भाव और ‘कूच करते थे’ बार-बार आगे बढ़ने की क्रिया व्यक्त करता है। फुटनोट का चिह्न मुख्य पाठ में उपस्थित है।
