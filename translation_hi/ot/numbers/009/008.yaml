  yaml_path: translation/ot/numbers/009/008.yaml
  text: And Moses said to them[a], “Wait, and I will hear what Yahweh commands concerning you.”
translation:
  language: hi
  text: तब मूसा ने उनसे कहा[a], “ठहरो, और मैं सुनूँ कि याहवे तुम्हारे विषय में क्या आज्ञा देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
