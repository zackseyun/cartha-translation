    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथन अगले घटनाक्रम को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक संबंध व्यक्त करता है।
- source_word: אֲלֵהֶם
  choice: उनसे
  rationale: पूर्वसर्ग और तृतीय पुरुष बहुवचन प्रत्यय का स्वाभाविक हिन्दी रूप।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: עִמְדוּ
  choice: ठहरो
  rationale: मूल अर्थ ‘खड़े रहो’ है, पर प्रसंग में वहीं रुककर उत्तर की प्रतीक्षा करने का भाव है; ‘ठहरो’ दोनों के निकट है।
- source_word: וְאֶשְׁמְעָה
  choice: और मैं सुनूँगा
  rationale: प्रथम पुरुष इच्छासूचक/संकल्पसूचक रूप को सुरक्षित रखता है और यह नहीं जोड़ता कि मूसा उत्तर किस माध्यम से पाएगा।
- source_word: מַה יְצַוֶּה
  choice: क्या आज्ञा देता है
  rationale: प्रश्नवाचक מַה और पिएल क्रिया צוה को सहज हिन्दी में व्यक्त करता है; वर्तमान रूप निकट अपेक्षित ईश्वरीय निर्देश के लिए स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय ईश-नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नामरूप में प्रस्तुत किया गया है, उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לָכֶם
  choice: तुम्हारे विषय में
  rationale: प्रसंग में आज्ञा इन व्यक्तियों की स्थिति के संबंध में है; यह रूप ‘तुम्हारे लिए’ की संभावित अस्पष्टता से बचते हुए आशय स्पष्ट करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश-नाम को ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिन्दी पाठकों में ‘यहोवा’ अधिक पहचाना जाने वाला लिप्यंतरण है; ‘याहवे’ संभावित वैकल्पिक उच्चारण है।
- issue: मूसा के ‘सुनने’ का स्वरूप
  choice: मैं सुनूँगा
  alternative: मैं पूछकर जानूँगा
  rationale: मूल क्रिया केवल ‘सुनना’ कहती है। विस्तृत वैकल्पिक रूप प्रक्रिया को स्पष्ट करता, पर मूल में निहित प्रत्यक्षता और संभावित अस्पष्टता घटा देता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘ठहरो’ सामान्य पाठक के लिए सहज है, जबकि पादटिप्पणी मूल क्रिया के शाब्दिक अर्थ को सुरक्षित रखती है।
