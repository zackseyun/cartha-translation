id: NUM.9.17
reference: Numbers 9:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/לְ/פִ֞י הֵעָלֹ֤ת הֶֽ/עָנָן֙ מֵ/עַ֣ל הָ/אֹ֔הֶל וְ/אַ֣חֲרֵי כֵ֔ן יִסְע֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל וּ/בִ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁכָּן שָׁם֙ הֶֽ/עָנָ֔ן שָׁ֥ם יַחֲנ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/017.yaml
  text: Whenever the cloud was lifted from over the tent[a], after that the sons of Israel would set out; and in the place where the cloud settled[b], there the sons of Israel would camp.
translation:
  language: hi
  text: जब भी बादल तंबू के ऊपर से उठाया जाता था[a], उसके बाद इस्राएल के पुत्र[b] कूच करते थे; और जिस स्थान पर बादल ठहरता था, वहीं इस्राएल के पुत्र डेरा डालते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र निवास के ऊपर से”; यहाँ “तंबू” से आशय पवित्र निवास के तंबू से है।
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएली।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्र” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְפִי הֵעָלֹת
  choice: जब भी ... उठाया जाता था
  rationale: לְפִי के साथ क्रियार्थक संज्ञा यहाँ बार-बार घटने वाली परिस्थिति और समय बताती है। “जब भी” इस आवर्ती प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है, और “उठाया जाता था” बादल के ऊपर से उठा लिए जाने के भाव को बनाए रखता है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: जंगल में मार्गदर्शन करने वाले बादल के लिए यह सीधा और सामान्य हिन्दी शब्द है।
- source_word: מֵעַל הָאֹהֶל
  choice: तंबू के ऊपर से
  rationale: מֵעַל का स्थान-संबंधी अर्थ “ऊपर से” है और אֹהֶל का मूल अर्थ “तंबू” है। संदर्भ पवित्र निवास के तंबू का है, जिसे पाद-टिप्पणी में स्पष्ट किया गया है।
- source_word: וְאַחֲרֵי כֵן
  choice: उसके बाद
  rationale: यह बादल उठने और लोगों के कूच करने के बीच स्पष्ट कालक्रम को सुरक्षित रखता है।
- source_word: יִסְעוּ
  choice: कूच करते थे
  rationale: अपूर्ण क्रिया का यहाँ आवर्ती, प्रथागत अर्थ है। “करते थे” उसे दर्शाता है और “कूच करना” शिविर से यात्रा के लिए निकलने का स्वाभाविक हिन्दी पद है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी पारिवारिक अभिव्यक्ति को औपचारिक रूप से सुरक्षित रखता है; अधिक सहज सामूहिक विकल्प “इस्राएली” पाद-टिप्पणी में दिया गया है।
- source_word: וּבִמְקוֹם אֲשֶׁר
  choice: और जिस स्थान पर
  rationale: यह मूल पाठ की स्थानवाचक संरचना को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִשְׁכָּן
  choice: ठहरता था
  rationale: שׁכן का अर्थ बसना या टिकना हो सकता है। बादल के किसी स्थान पर टिक जाने के संदर्भ में “ठहरना” स्वाभाविक है और अनावश्यक मानवीकरण से बचता है।
- source_word: שָׁם ... שָׁם
  choice: जिस स्थान पर ... वहीं
  rationale: “जिस स्थान पर ... वहीं” की सहसंबंधी हिन्दी रचना मूल के दोहरे שָׁם के बल और स्थान-संबंध को व्यक्त करती है।
- source_word: יַחֲנוּ
  choice: डेरा डालते थे
  rationale: यहाँ अपूर्ण क्रिया आवर्ती व्यवहार बताती है। “डेरा डालते थे” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
