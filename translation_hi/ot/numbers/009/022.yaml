base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/022.yaml
  text: Whether it was two days[a], or a month, or longer, when the cloud remained over the tabernacle, dwelling over it, the sons of Israel would camp and would not set out; but when it was lifted up, they would set out.
translation:
  language: hi
  text: जब बादल निवास-स्थान के ऊपर ठहरा रहता और निवास-स्थान पर वास करता रहता, तब उसकी अवधि चाहे दो दिन, एक महीना, या बहुत दिनों तक[a] होती, इस्राएली पड़ाव डाले रहते और आगे नहीं बढ़ते थे; पर जब वह ऊपर उठता, तब वे आगे बढ़ते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “दिन”; इस संदर्भ में इसका अर्थ संभवतः बहुत दिन या लंबी अवधि है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֽוֹ ... אוֹ ... אוֹ
  choice: चाहे ... या ... या
  rationale: दोहराया गया विकल्पसूचक अव्यय अलग-अलग संभावित अवधियों की शृंखला बनाता है; यह हिंदी में स्वाभाविक रूप से उसे बनाए रखता है।
