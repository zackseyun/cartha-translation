source:
  edition: WLC
  text: וְ/הָ/אִישׁ֩ אֲשֶׁר ה֨וּא טָה֜וֹר וּ/בְ/דֶ֣רֶךְ לֹא הָיָ֗ה וְ/חָדַל֙ לַ/עֲשׂ֣וֹת הַ/פֶּ֔סַח וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵֽ/עַמֶּ֑י/הָ כִּ֣י קָרְבַּ֣ן יְהוָ֗ה לֹ֤א הִקְרִיב֙ בְּ/מֹ֣עֲד֔/וֹ חֶטְא֥/וֹ יִשָּׂ֖א הָ/אִ֥ישׁ הַ/הֽוּא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/013.yaml
  text: But the man who is clean and is not on a journey[a], yet fails to keep the Passover—that person shall be cut off from his people, because he did not present Yahweh’s offering at its appointed time[b]; that man shall bear his sin.
translation:
  language: hi
  text: परन्तु जो पुरुष विधि के अनुसार शुद्ध है और यात्रा पर नहीं है, फिर भी फसह मनाने से चूकता है, वह व्यक्ति अपने लोगों में से काट दिया जाएगा[a], क्योंकि उसने याहवे की भेंट उसके नियत समय पर अर्पित नहीं की; वह पुरुष अपने पाप का भार उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह प्राणी अपने लोगों में से काट दिया जाएगा।” यह इब्रानी मुहावरा वाचा के अंतर्गत गम्भीर न्याय को दर्शा सकता है, पर यहाँ यह ठीक-ठीक नहीं बताया गया कि उसे कैसे कार्यान्वित किया जाएगा।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने दोष का भार उठाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: इस अनुष्ठानिक प्रसंग में यह शब्द नैतिक निष्पापता नहीं, बल्कि विधिगत शुद्धता को दर्शाता है; हिन्दी में ‘शुद्ध’ प्रसंग के भीतर इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּבְדֶרֶךְ לֹא הָיָה
  choice: यात्रा पर नहीं है
  rationale: यह आसपास के प्रसंग में यात्रा के कारण दूर रहने की छूट के विपरीत स्थिति को सरल और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְחָדַל לַעֲשׂוֹת הַפֶּסַח
  choice: फिर भी फसह मनाने से चूकता है
  rationale: חָדַל जानबूझकर रुकने, न करने या चूकने का अर्थ दे सकता है। ‘चूकता है’ दायित्व पूरा न करने को व्यक्त करता है, जबकि ‘फसह मनाना’ पूरे अनुष्ठान को समेटता है।
- source_word: הַפֶּסַח
  choice: फसह
  rationale: यहाँ शब्द फसह के बलिदान के साथ-साथ उसके व्यापक पर्व-अनुष्ठान को सूचित करता है; अगला वाक्य भेंट के पक्ष को अलग से स्पष्ट करता है।
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति ... काट दिया जाएगा
  rationale: נֶפֶשׁ यहाँ व्यक्ति को दर्शाता है। ‘काट दिया जाएगा’ वाचायी और न्यायिक मुहावरे को बनाए रखता है तथा दण्ड के ठीक स्वरूप को अनिर्णीत छोड़ता है।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: स्त्रीलिंग प्रत्यय व्याकरणतः נֶפֶשׁ से मेल खाता है, पर उसका संदर्भ उक्त पुरुष से है; ‘अपने लोगों में से’ हिन्दी में अर्थ को स्वाभाविक रूप से रखता है।
- source_word: קָרְבַּן יְהוָה
  choice: याहवे की भेंट
  rationale: קָרְבָּן परमेश्वर के निकट लाई जाने वाली भेंट का सामान्य शब्द है। ‘याहवे की भेंट’ सम्बन्ध और बलिदानी प्रसंग दोनों को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: בְּמֹעֲדוֹ
  choice: उसके नियत समय पर
  rationale: מוֹעֵד यहाँ निर्धारित और विधिवत ठहराए गए समय को दर्शाता है; ‘उसके नियत समय पर’ भेंट/फसह से उसका सम्बन्ध बनाए रखता है।
- source_word: חֶטְאוֹ יִשָּׂא
  choice: अपने पाप का भार उठाएगा
  rationale: यह उत्तरदायित्व और उसके परिणाम सहने का इब्रानी मुहावरा है। हिन्दी में ‘पाप का भार उठाना’ उसकी चित्रात्मकता बनाए रखता है; ‘दोष का भार’ सम्भव वैकल्पिक अर्थ है।
- source_word: הָאִישׁ הַהוּא
  choice: वह पुरुष
  rationale: इब्रानी पद स्पष्ट रूप से पुल्लिंग एकवचन है; इसलिए अन्तिम कथन में ‘पुरुष’ रखा गया है।
theological_decisions:
- issue: ‘काट दिया जाएगा’ दण्ड का अर्थ
  choice: मुहावरे को ज्यों का त्यों रखते हुए दण्ड के ठीक स्वरूप को निर्दिष्ट नहीं किया गया।
  alternative: समुदाय से निकाल दिया जाएगा; मार डाला जाएगा; परमेश्वर के न्याय से नष्ट किया जाएगा
  rationale: इस पद में इब्रानी अभिव्यक्ति गम्भीर वाचायी दण्ड बताती है, पर यह स्पष्ट नहीं करती कि उसे मृत्यु, बहिष्कार अथवा सीधे ईश्वरीय न्याय के रूप में कैसे कार्यान्वित किया जाएगा। अनुवाद इस वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: חֶטְאוֹ יִשָּׂא में पाप अथवा दोष
  choice: अपने पाप का भार उठाएगा
  alternative: अपने दोष का भार उठाएगा
  rationale: חֵטְא मूलतः ‘पाप’ है, जबकि पूरा मुहावरा दोष और दण्डनीय उत्तरदायित्व को भी समेट सकता है। मुख्य पाठ निकटतर शब्द ‘पाप’ रखता है और वैकल्पिक अर्थ पादटिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘फसह’, ‘भेंट’ और ‘पाप का भार उठाना’ जैसे बाइबलीय पदों को बनाए रखते हुए वाक्यरचना स्वाभाविक हिन्दी में दी गई है। पादटिप्पणी-चिह्न उन्हीं पदों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
