id: NUM.9.1
reference: Numbers 9:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֣ה אֶל מֹשֶׁ֣ה בְ/מִדְבַּר סִ֠ינַי בַּ/שָּׁנָ֨ה הַ/שֵּׁנִ֜ית לְ/צֵאתָ֨/ם מֵ/אֶ֧רֶץ מִצְרַ֛יִם בַּ/חֹ֥דֶשׁ הָ/רִאשׁ֖וֹן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/001.yaml
  text: And Yahweh spoke to Moses in the wilderness of Sinai[a], in the second year after they came out of the land of Egypt, in the first month, saying,
translation:
  language: hi
  text: 'उनके मिस्र देश से निकलने के बाद दूसरे वर्ष के पहले महीने में, सीनै के निर्जन प्रदेश[a] में याहवे ने मूसा से कहा:'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सीनै के मरुस्थल में।’
    reason: מִדְבָּר के लिए एक अधिक भूगोल-केंद्रित शाब्दिक विकल्प।
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने ... कहा
  rationale: यह क्रिया कथानक को आगे बढ़ाती है और यहाँ לֵאמֹר के साथ आने वाले वचन का परिचय देती है। हिंदी में ‘ने ... कहा’ इस रचना का स्वाभाविक और सटीक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: דבר के साथ אֶל वचन के संबोधित व्यक्ति को दर्शाता है; हिंदी में ‘मूसा से कहा’ स्वाभाविक है।
- source_word: בְּמִדְבַּר סִינַי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר बस्ती से दूर निर्जन या मरुस्थलीय भूभाग को दर्शा सकता है। ‘निर्जन प्रदेश’ अर्थ की व्यापकता बनाए रखते हुए सहज आधुनिक हिंदी है।
- source_word: בַּשָּׁנָה הַשֵּׁנִית
  choice: दूसरे वर्ष
  rationale: इब्रानी काल-सूचक पद का सीधा और स्वाभाविक हिंदी रूप।
- source_word: לְצֵאתָם מֵאֶרֶץ מִצְרַיִם
  choice: उनके मिस्र देश से निकलने के बाद
  rationale: सर्वनामिक प्रत्यय ‘उनके’ को बनाए रखा गया है और אֶרֶץ को ‘देश’ से व्यक्त किया गया है। यह पद निर्गमन के बाद का समय बताता है।
- source_word: בַּחֹדֶשׁ הָרִאשׁוֹן
  choice: पहले महीने में
  rationale: मूल के क्रमसूचक काल-वाक्यांश का सीधा हिंदी अनुवाद।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह अगले पद में आने वाले वचन का परिचय देता है। हिंदी में अलग से ‘यह कहते हुए’ जोड़ने के बजाय द्विबिंदु सहित ‘कहा:’ अधिक स्वाभाविक है और वही कार्य करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और मूल इब्रानी के संभावित उच्चारण के अधिक निकट है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। हिंदी की स्वाभाविक वाक्य-रचना के लिए काल-सूचक पद पहले रखा गया है। ‘उनके’ मूल के बहुवचन सर्वनाम को सुरक्षित रखता है और प्रसंग से उसका संदर्भ समझा जाता है।
