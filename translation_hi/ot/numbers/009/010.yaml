language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר אִ֣ישׁ אִ֣ישׁ כִּי יִהְיֶֽה טָמֵ֣א לָ/נֶ֡פֶשׁ אוֹ֩ בְ/דֶ֨רֶךְ רְחֹקָ֜הׄ לָ/כֶ֗ם א֚וֹ לְ/דֹרֹ֣תֵי/כֶ֔ם וְ/עָ֥שָׂה פֶ֖סַח לַ/יהוָֽה־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/010.yaml
  text: Speak to the sons of Israel[a], saying, ‘If any man becomes unclean by a dead body, or is on a distant journey, whether among you or among your generations[c][b], he shall still keep the Passover to Yahweh.
translation:
  language: hi
  text: “इस्राएल के पुत्रों से कह, ‘यदि कोई पुरुष किसी शव के कारण अशुद्ध हो या दूर की यात्रा पर हो, चाहे वह तुम लोगों में हो या तुम्हारी पीढ़ियों में, तो वह याहवे के लिए फसह मनाए।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पदबंध का औपचारिक और लिंग-सटीक रूप; यह सामूहिक रूप से इस्राएली समुदाय को संबोधित करता है।
- source_word: אִישׁ אִישׁ
  choice: कोई पुरुष
  rationale: दोहराव का वितरणात्मक भाव ‘कोई भी पुरुष’ है; सहज हिन्दी में ‘कोई पुरुष’ वही व्यक्तिगत कानूनी दायरा व्यक्त करता है।
- source_word: טָמֵא לָנֶפֶשׁ
  choice: किसी शव के कारण अशुद्ध
  rationale: याजकीय-कानूनी प्रसंग में נֶפֶשׁ यहाँ मृत व्यक्ति या शव से उत्पन्न धार्मिक अशुद्धता का संकेत देता है।
- source_word: בְדֶרֶךְ רְחֹקָה
  choice: दूर की यात्रा पर
  rationale: शाब्दिक ‘दूर के मार्ग में’ की अपेक्षा यह स्वाभाविक हिन्दी है और दूर होने की व्यावहारिक स्थिति स्पष्ट करती है।
- source_word: לָכֶם אוֹ לְדֹרֹתֵיכֶם
  choice: तुममें या तुम्हारी आनेवाली पीढ़ियों में
  rationale: वर्तमान समुदाय और भावी पीढ़ियों—दोनों पर इस नियम की लागू होने वाली सीमा को सहज हिन्दी में व्यक्त करता है।
- source_word: וְעָשָׂה פֶסַח
  choice: तो भी वह ... फसह मनाए
  rationale: עשה פֶסַח का अर्थ फसह का पालन/अनुष्ठान करना है। ‘तो भी’ वाक्य में दी गई बाधाओं के बावजूद दायित्व का भाव स्पष्ट करता है, यद्यपि इसका अलग शब्द मूल में नहीं है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ल उपसर्ग समर्पण/उद्देश्य बताता है; יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा का व्यक्तिवाचक नाम है; उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम ‘यहोवा’ से रखा गया है।
- issue: पुरुषवाचक वाचायी संबोधन
  choice: इस्राएल के पुत्रों / कोई पुरुष
  alternative: इस्राएलियों / कोई व्यक्ति
  rationale: मूल के पुरुषवाचक रूपों को सुरक्षित रखा गया है; पहले पदबंध का संदर्भ समूचे समुदाय से है, जबकि אִישׁ אִישׁ व्यक्तिगत कानूनी मामले को सामने रखता है।
- issue: וְעָשָׂה का विधिक बल
  choice: मनाए
  alternative: मना सकता है / मनाएगा
  rationale: यह रूप प्रसंग में निर्देश या दायित्व व्यक्त करता है; अगले पद में उसके समय का प्रावधान दिया जाता है। इसे केवल अनुमति बनाकर धर्मवैधानिक तनाव को हल्का नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-विन्यास को हिन्दी-सुलभ बनाने हेतु ‘तुममें या तुम्हारी आनेवाली पीढ़ियों में’ को शर्त के आरम्भ में जोड़ा गया है। कोई पादटिप्पणी आवश्यक नहीं समझी गई।
