language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/יֵ֞שׁ אֲשֶׁר יִהְיֶ֤ה הֶֽ/עָנָן֙ מֵ/עֶ֣רֶב עַד בֹּ֔קֶר וְ/נַעֲלָ֧ה הֶֽ/עָנָ֛ן בַּ/בֹּ֖קֶר וְ/נָסָ֑עוּ א֚וֹ יוֹמָ֣ם וָ/לַ֔יְלָה וְ/נַעֲלָ֥ה הֶ/עָנָ֖ן וְ/נָסָֽעוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/021.yaml
  text: And sometimes the cloud would remain from evening until morning; when the cloud was taken up in the morning[a], they would set out. Or if it remained for a day and a night, when the cloud was taken up, they would set out.
translation:
  language: hi
  text: और कभी-कभी बादल संध्या से भोर तक ठहरा रहता था; भोर में जब बादल ऊपर उठता, तब वे कूच करते थे। या बादल एक दिन और एक रात तक ठहरा रहता; जब बादल ऊपर उठता, तब वे कूच करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְיֵשׁ אֲשֶׁר
  choice: और कभी-कभी
  rationale: यह मुहावरा पहले बताए गए सामान्य क्रम के अंतर्गत कभी घटने वाली एक स्थिति प्रस्तुत करता है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: יִהְיֶה הֶעָנָן
  choice: बादल ... ठहरा रहता था
  rationale: कालावधि के साथ היה यहाँ केवल अस्तित्व नहीं, बल्कि निरंतर बने रहने का भाव देता है।
- source_word: מֵעֶרֶב עַד בֹּקֶר
  choice: संध्या से भोर तक
  rationale: मूल के आरंभ और अंतिम समय-बिंदु को सीधे तथा गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְנַעֲלָה הֶעָנָן
  choice: जब ... बादल ऊपर उठता
  rationale: עלה का मूल दृश्यगत अर्थ बादल का ऊपर उठना है; हिन्दी में सक्रिय रूप स्वाभाविक है और यह अनिर्दिष्ट रखता है कि उसे किसी ने उठाया या वह उठा।
- source_word: וְנָסָעוּ
  choice: तब वे कूच करते थे
  rationale: जंगल-यात्रा के संदर्भ में נסע शिविर से प्रस्थान करने को दर्शाता है; 'कूच करना' संक्षिप्त और सामान्यतः बोधगम्य है।
- source_word: יוֹמָם וָלַיְלָה
  choice: एक दिन और एक रात तक
  rationale: इस प्रसंग में यह वाक्यांश बादल के ठहरे रहने की अवधि बताता है, न कि केवल दिन और रात के समय को।
theological_decisions:
- issue: बादल के ऊपर उठने में कर्ता की अभिव्यक्ति
  choice: बादल ऊपर उठता
  alternative: बादल उठा लिया जाता
  rationale: हिब्रू क्रिया का रूप स्वयं बादल के ऊपर उठने को व्यक्त करता है और कर्ता निर्दिष्ट नहीं करता। चुना हुआ रूप इस अस्पष्टता को बनाए रखता है तथा प्रसंग में प्रस्थान-संकेत को स्पष्ट रहने देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक स्तर रखा गया है। 'संध्या', 'भोर' और 'कूच' सामान्य पाठक के लिए बोधगम्य हैं तथा मरुभूमि-यात्रा के प्रसंग के अनुकूल हैं।
