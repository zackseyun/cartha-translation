id: NUM.9.14
reference: Numbers 9:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִֽי יָג֨וּר אִתְּ/כֶ֜ם גֵּ֗ר וְ/עָ֤שָֽׂה פֶ֨סַח֙ לַֽ/יהוָ֔ה כְּ/חֻקַּ֥ת הַ/פֶּ֛סַח וּ/כְ/מִשְׁפָּט֖/וֹ כֵּ֣ן יַעֲשֶׂ֑ה חֻקָּ֤ה אַחַת֙ יִהְיֶ֣ה לָ/כֶ֔ם וְ/לַ/גֵּ֖ר וּ/לְ/אֶזְרַ֥ח הָ/אָֽרֶץ־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/014.yaml
  text: And if a sojourner is staying with you and would keep the Passover to Yahweh[a], he shall do it according to the statute of the Passover and according to its ordinance; so he shall do it. One statute shall be for you, for the sojourner[c][b], and for the native of the land.
translation:
  language: hi
  text: और यदि कोई परदेशी[a] तुम्हारे बीच निवास करे और याहवे के लिए फसह मनाए[b], तो वह फसह की विधि और उसके नियम के अनुसार ही ऐसा करे। तुम्हारे लिए, परदेशी के लिए और देश के मूल निवासी[c] के लिए एक ही विधि होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘परदेशी’ से आशय इस्राएलियों के बीच रहने वाले निवासी विदेशी से है, केवल थोड़े समय के लिए आए यात्री से नहीं।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘फसह करे/बनाए’; यह मुहावरा फसह का अनुष्ठान करने या उसे मनाने के अर्थ में है।
    reason: lexical_alternative
  - marker: c
    text: या ‘देश में जन्मा व्यक्ति’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: संयोजक और शर्त—दोनों को बनाए रखता है और इस विधान को पिछले प्रसंग से जोड़ता है।
- source_word: יָגוּר ... גֵּר
  choice: कोई परदेशी तुम्हारे बीच निवास करे
  rationale: גֵּר यहाँ केवल यात्री नहीं, बल्कि इस्राएलियों के बीच रहने वाला निवासी विदेशी है। ‘निवास करे’ इस स्थायी या दीर्घकालिक रहने के भाव को व्यक्त करता है।
- source_word: וְעָשָׂה פֶסַח
  choice: फसह मनाए
  rationale: शाब्दिक रूप से ‘फसह करे/बनाए’ एक इब्रानी मुहावरा है, जिसका अर्थ फसह का अनुष्ठान करना या उसे मनाना है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: לְ समर्पण या अभिमुखता दिखाता है; याहवे परमेश्वर के व्यक्तिगत वाचा-नाम को लिप्यंतरित करता है।
- source_word: כְּחֻקַּת הַפֶּסַח
  choice: फसह की विधि के अनुसार
  rationale: חֻקָּה निर्धारित और बाध्यकारी धार्मिक विधान को व्यक्त करता है; ‘विधि’ हिंदी में स्वाभाविक रहते हुए कानूनी-अनुष्ठानिक बल बनाए रखता है।
- source_word: וּכְמִשְׁפָּטוֹ
  choice: उसके नियम के अनुसार
  rationale: מִשְׁפָּט यहाँ फसह को संपन्न करने वाले नियत नियम या प्रक्रिया को दर्शाता है और חֻקָּה से अर्थगत निकटता के बावजूद कुछ भेद बनाए रखता है।
- source_word: כֵּן יַעֲשֶׂה
  choice: ही ऐसा करे
  rationale: निर्धारित रीति के ठीक अनुरूप कार्य करने पर दिए गए बल को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֻקָּה אַחַת יִהְיֶה
  choice: एक ही विधि होगी
  rationale: ‘ही’ दोनों समूहों पर लागू एकमात्र समान विधान पर बल देता है।
- source_word: וּלְאֶזְרַח הָאָרֶץ
  choice: और देश के मूल निवासी के लिए
  rationale: אֶזְרַח उस व्यक्ति को दर्शाता है जो देश का मूल या जन्मजात निवासी है, और उसका contrast גֵּר से है; यह आधुनिक नागरिकता की अवधारणा आरोपित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय लिप्यंतरित करता है।
- issue: फसह के विधान में इस्राएली और निवासी परदेशी की स्थिति
  choice: फसह मनाने वाले परदेशी और देश के मूल निवासी के लिए एक ही विधि
  alternative: परदेशी को केवल फसह मनाने की अनुमति दी गई है, समान विधान पर बल नहीं है
  rationale: मूल पाठ स्पष्ट रूप से ‘एक ही विधि’ को श्रोताओं, परदेशी और देश के मूल निवासी पर लागू करता है। यह समानता इसी फसह-विधान के संदर्भ तक सीमित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, कानूनी-अनुष्ठानिक शैली रखी गई है। ‘विधि’ और ‘नियम’ द्वारा חֻקָּה तथा מִשְׁפָּט के निकट लेकिन अलग पहलुओं को यथासंभव सुरक्षित रखा गया है; वाक्य को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
