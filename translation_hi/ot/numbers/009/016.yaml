base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/016.yaml
  text: 'So it was continually: the cloud would cover it[a], and the appearance of fire by night.'
translation:
  language: hi
  text: 'ऐसा ही निरंतर होता था: बादल उसे ढके रहता था और रात को आग-सा दृश्य होता था।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रात को आग का रूप दिखाई देता था।”
    reason: मूल इब्रानी पदबंध का अधिक शाब्दिक अनुवाद ‘आग का दृश्य रूप’ हो सकता है; मुख्य पाठ ‘आग-सा दृश्य’ के द्वारा उसके दृश्यात्मक और अनिर्णीत भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: כֵּן
  choice: ऐसा ही
  rationale: यह पिछले वर्णन में बताए गए नियमित क्रम का सार प्रस्तुत करता है; ‘ऐसा ही’ हिब्रू के संकेतवाचक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יִהְיֶה תָמִיד
  choice: निरन्तर होता था
  rationale: अपूर्ण क्रिया यहाँ बीते समय की नियमित और लगातार बनी रहने वाली स्थिति बताती है। यह पदबंध उस अभ्यस्त और सतत भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: संदर्भ में यह वही निश्चित बादल है जो पवित्र निवास पर छाया रहता था; हिन्दी में प्रसंग के कारण अलग निश्चित उपपद की आवश्यकता नहीं है।
- source_word: יְכַסֶּנּוּ
  choice: उसे ढके रहता था
  rationale: क्रिया का अर्थ ‘ढकना’ है और प्रत्यय का सबसे स्वाभाविक संदर्भ पिछले पदों का पवित्र निवास है। ‘ढके रहता था’ नियमित और जारी अवस्था को व्यक्त करता है।
- source_word: וּמַרְאֵה אֵשׁ
  choice: और आग का रूप दिखाई देता था
  rationale: מַרְאֶה दृश्य रूप या दिखाई देने वाली आकृति को सूचित करता है। यह अनुवाद इसे वास्तविक आग अथवा केवल आग-जैसा दृश्य मानकर अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לָיְלָה
  choice: रात को
  rationale: यह समयसूचक प्रयोग का स्वाभाविक और वर्तमान हिन्दी रूप है।
theological_decisions:
- issue: יְכַסֶּנּוּ में एकवचन पुल्लिंग प्रत्यय का संदर्भ
  choice: ‘उसे’, अर्थात संदर्भानुसार पवित्र निवास को
  alternative: ‘उसको’ किसी पुरुष-संदर्भ के रूप में समझना
  rationale: निकटवर्ती संदर्भ पवित्र निवास और तम्बू का है। हिन्दी का ‘उसे’ मूल प्रत्यय की सर्वनामिक संक्षिप्तता बनाए रखता है, जबकि संदर्भ उसके निर्जीव स्थान-संबंधी अर्थ को स्पष्ट करता है।
- issue: מַרְאֵה אֵשׁ में आग की वास्तविकता अथवा आग-जैसे दिखाई देने का प्रश्न
  choice: ‘आग का रूप’
  alternative: ‘वह आग जैसा दिखाई देता था’
  rationale: मूल पद दृश्य स्वरूप बताता है, पर यह स्पष्ट नहीं करता कि वह स्वयं आग थी या आग जैसी दिखने वाली अभिव्यक्ति। मुख्य पाठ इस तनाव को खुला रखता है और वैकल्पिक वाक्य-विन्यास पाद-टिप्पणी में दिया गया है।
