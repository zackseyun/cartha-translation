lexical_decisions:
- source_word: וְיַעֲשׂוּ
  choice: और ... मनाएँ
  rationale: पसह के साथ עשה का अर्थ मुहावरे के रूप में उसका अनुष्ठान करना या उसे मनाना है। प्रसंग में अपूर्ण क्रिया आज्ञार्थक भाव रखती है, इसलिए “मनाएँ” उपयुक्त है; आरम्भ का “और” वाव को दर्शाता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह हिब्रू पद का निकट, पारिवारिक और पुल्लिंग रूप है। अधिक स्वाभाविक विकल्प “इस्राएली” है, जिसे पादटिप्पणी में दिया गया है।
- source_word: הַפָּסַח
  choice: फसह
  rationale: यह पद यहाँ फसह के अनुष्ठान को व्यापक रूप से सूचित करता है। केवल बलिदान या केवल पर्व कहना अर्थ को अनावश्यक रूप से सीमित कर सकता है।
- source_word: בְּמוֹעֲדוֹ
  choice: उसके नियत समय पर
  rationale: מוֹעֵד यहाँ निर्धारित पर्व-समय को सूचित करता है और प्रत्यय फसह की ओर संकेत करता है; “उसके नियत समय पर” इस संबंध और समय की निश्चितता दोनों को बनाए रखता है।
