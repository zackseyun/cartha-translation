id: NUM.9.12
reference: Numbers 9:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לֹֽא יַשְׁאִ֤ירוּ מִמֶּ֨/נּוּ֙ עַד בֹּ֔קֶר וְ/עֶ֖צֶם לֹ֣א יִשְׁבְּרוּ ב֑/וֹ כְּ/כָל חֻקַּ֥ת הַ/פֶּ֖סַח יַעֲשׂ֥וּ אֹתֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/012.yaml
  text: They shall leave none of it until morning[a], and they shall not break a bone of it[b]; according to all the statute of the Passover they shall keep it.
translation:
  language: hi
  text: वे उसमें से कुछ भी सुबह तक बचा न रहने दें, और उसकी कोई हड्डी न तोड़ें। फसह के पूरे विधान के अनुसार वे उसे मनाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יַשְׁאִירוּ מִמֶּנּוּ עַד בֹּקֶר
  choice: वे उसमें से कुछ भी सुबह तक बचा न रहने दें
  rationale: हिफ़ील क्रिया का अर्थ ‘बचा रहने देना/शेष छोड़ना’ है। निषेध और अंशवाचक מִמֶּנּוּ को स्वाभाविक आधुनिक हिन्दी में ‘उसमें से कुछ भी’ व्यक्त करता है।
- source_word: וְעֶצֶם לֹא יִשְׁבְּרוּ בוֹ
  choice: और उसकी कोई हड्डी न तोड़ें
  rationale: एकवचन עֶצֶם यहाँ वितरणात्मक अर्थ रखता है। ‘उसकी कोई हड्डी’ हिन्दी में स्वाभाविक रहते हुए किसी भी हड्डी को न तोड़ने का आशय स्पष्ट करता है।
- source_word: כְּכָל חֻקַּת הַפֶּסַח
  choice: फसह के सारे विधान के अनुसार
  rationale: חֻקָּה निर्धारित नियम या विधान है; एकवचन के साथ כָּל पूरे निर्धारित विधान की सामूहिकता दर्शाता है।
- source_word: הַפֶּסַח
  choice: फसह
  rationale: यह पद पर्व, अनुष्ठान या भोज के व्यापक संदर्भ को धारण कर सकता है। ‘फसह’ उस व्यापकता को बनाए रखता है और अनावश्यक रूप से केवल बलि तक सीमित नहीं करता।
- source_word: יַעֲשׂוּ אֹתוֹ
  choice: वे उसे मनाएँ
  rationale: पर्व या धार्मिक अनुष्ठान के साथ עשה का अर्थ उसका पालन या आयोजन करना है। आधुनिक हिन्दी में ‘मनाएँ’ स्वाभाविक है और फसह के अनुष्ठानिक पालन को व्यक्त करता है।
theological_decisions:
- issue: हड्डी न तोड़ने की आज्ञा का बाद का अंतरपाठीय महत्त्व
  choice: मुख्य पाठ में इसे फसह के सीधे नियम के रूप में अनूदित किया गया है।
  alternative: शब्दावली को इस प्रकार ढालना कि बाद की मसीही पूर्ति प्रमुख हो जाए।
  rationale: इस प्रसंग में इब्रानी पाठ फसह मनाने का नियम देता है। बाद की धर्मवैचारिक प्रतिध्वनि को मुख्य पाठ में आरोपित किए बिना मूल कथन को सीधे रखना उचित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण रखी गई है। ‘फसह’ प्रचलित बाइबलीय नाम है; ‘विधान’ मूल की औपचारिक, निर्धारित व्यवस्था को व्यक्त करता है। अंग्रेज़ी परामर्श-पाठ में दिए गए पादटिप्पणी-चिह्नों का क्रम विषयवस्तु से असंगत दिखता है—पहली पादटिप्पणी हड्डी वाले वाक्यांश की lexical alternative है, न कि ‘सुबह तक’ की—इसलिए हिन्दी मुख्य पाठ में भ्रामक चिह्न नहीं जोड़े गए।
