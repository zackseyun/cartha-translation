lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है, इसलिए ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। דבר के साथ आगे לֵאמֹר आने पर हिन्दी में ‘कहा’ सहज और अर्थसंगत है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का निज नाम YHWH है। हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ नाम को किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- source_word: אֶל מֹשֶׁה
  choice: मूसा से
  rationale: अक्षरशः भाव ‘मूसा की ओर’ है; बोलने की क्रिया के साथ आधुनिक हिन्दी में संबोधित व्यक्ति के लिए ‘मूसा से’ स्वाभाविक प्रयोग है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाले वचन का परिचय देता है। हिन्दी में וַיְדַבֵּר ... לֵאמֹר की संयुक्त अभिव्यक्ति को ‘ने ... से कहा’ कहना स्वाभाविक है और अनावश्यक ‘यह कहते हुए’ से बचाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: यहाँ मूल पाठ में चार अक्षरों वाला निज नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और ‘प्रभु’ जैसी उपाधि रखकर नाम को छिपाता नहीं। स्वरांकन की ऐतिहासिक अनिश्चितता को पादटिप्पणी में स्पष्ट किया गया है।
