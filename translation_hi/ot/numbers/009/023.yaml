source:
  edition: WLC
  text: עַל פִּ֤י יְהוָה֙ יַחֲנ֔וּ וְ/עַל פִּ֥י יְהוָ֖ה יִסָּ֑עוּ אֶת מִשְׁמֶ֤רֶת יְהוָה֙ שָׁמָ֔רוּ עַל פִּ֥י יְהוָ֖ה בְּ/יַד מֹשֶֽׁה־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/023.yaml
  text: At the command of Yahweh they camped[a], and at the command of Yahweh they set out. They kept the charge of Yahweh at the command of Yahweh by the hand of Moses.
translation:
  language: hi
  text: याहवे की आज्ञा पर वे डेरा डालते थे, और याहवे की आज्ञा पर वे कूच करते थे। उन्होंने याहवे के सौंपे हुए दायित्व का पालन याहवे की उस आज्ञा के अनुसार किया जो मूसा के द्वारा[a] दी गई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप: ‘मूसा के हाथ से’; यह मुहावरा ‘मूसा के द्वारा’ या ‘मूसा को माध्यम बनाकर’ के अर्थ में है।'
    reason: इब्रानी मुहावरे की मूल छवि और उसके माध्यम-सूचक अर्थ को बताना।
lexical_decisions:
- source_word: עַל־פִּי
  choice: की आज्ञा पर / की आज्ञा के अनुसार
  rationale: इस मुहावरे का शाब्दिक अर्थ ‘के मुँह पर’ है, पर यहाँ यह अधिकारपूर्ण निर्देश के अनुसार कार्य करने को व्यक्त करता है। दोनों हिंदी रूप संदर्भ के अनुसार स्वाभाविक हैं और पद में याहवे की आज्ञा की पुनरावृत्ति बनाए रखते हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित ध्वन्यात्मक रूप में रखा गया है।
- source_word: יַחֲנוּ
  choice: वे डेरा डालते थे
  rationale: क्रिया शिविर लगाने या डेरा डालने को व्यक्त करती है। प्रसंग में आवर्ती व्यवहार होने के कारण हिंदी में अपूर्ण भूतकाल स्वाभाविक है।
- source_word: יִסָּעוּ
  choice: वे कूच करते थे
  rationale: जंगल की यात्रा के संदर्भ में यह पड़ाव से प्रस्थान करने को दर्शाता है। ‘कूच करना’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: מִשְׁמֶרֶת
  choice: सौंपा हुआ दायित्व
  rationale: संज्ञा ऐसी जिम्मेदारी या आदेश को दर्शाती है जिसे किसी को निभाने या सुरक्षित रखने के लिए सौंपा गया हो। यह रूप इसके दायित्व और आज्ञापालन—दोनों पहलुओं को व्यक्त करता है।
- source_word: שָׁמָרוּ
  choice: पालन किया
  rationale: यहाँ क्रिया ‘दायित्व’ के साथ प्रयुक्त है, इसलिए ‘पालन किया’ आधुनिक हिंदी में ‘रखा/माना/निभाया’ के आज्ञापरक भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक रूप ‘मूसा के हाथ से’ है। यह इब्रानी मुहावरा माध्यम या प्रतिनिधित्व बताता है; हिंदी में ‘मूसा के द्वारा’ उसका स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम चार बार आया है। उसे ‘प्रभु’ जैसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: מִשְׁמֶרֶת יְהוָה का अर्थ
  choice: याहवे का सौंपा हुआ दायित्व
  alternative: याहवे की चौकसी / याहवे की आज्ञा
  rationale: यह पद केवल पहरा देने की बात नहीं करता, बल्कि याहवे द्वारा सौंपी गई बात का निष्ठापूर्वक पालन बताता है। ‘दायित्व’ इस व्यापक अर्थ को बनाए रखता है, बिना उसे किसी विशेष धार्मिक अनुष्ठान तक सीमित किए।
- issue: בְּיַד מֹשֶׁה में मूसा की भूमिका
  choice: मूसा के द्वारा दी गई आज्ञा
  alternative: मूसा की आज्ञा
  rationale: वाक्य आज्ञा का स्रोत याहवे और उसका माध्यम मूसा बताता है। अनुवाद मूसा को आज्ञा का स्वतंत्र स्रोत नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले दो खंडों की समानांतर रचना तथा दिव्य आज्ञा की पुनरावृत्ति सुरक्षित है। आवर्ती जंगल-यात्रा के संदर्भ को व्यक्त करने के लिए ‘डेरा डालते थे’ और ‘कूच करते थे’ प्रयोग किए गए हैं।
