source:
  edition: WLC
  text: וּ/בְ/יוֹם֙ הָקִ֣ים אֶת הַ/מִּשְׁכָּ֔ן כִּסָּ֤ה הֶֽ/עָנָן֙ אֶת הַ/מִּשְׁכָּ֔ן לְ/אֹ֖הֶל הָ/עֵדֻ֑ת וּ/בָ/עֶ֜רֶב יִהְיֶ֧ה עַֽל הַ/מִּשְׁכָּ֛ן כְּ/מַרְאֵה אֵ֖שׁ עַד בֹּֽקֶר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/009/015.yaml
  text: On the day the tabernacle was set up[a], the cloud covered the tabernacle, the tent of the testimony; and in the evening it was over the tabernacle like the appearance of fire until morning.
translation:
  language: hi
  text: जिस दिन पवित्र निवास खड़ा किया गया, बादल ने पवित्र निवास को, अर्थात साक्ष्य के तंबू[a] को, ढक लिया। और शाम को वह पवित्र निवास के ऊपर सुबह तक आग के समान दिखाई देता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गवाही का तंबू।” इब्रानी पद का अर्थ “साक्ष्य का तंबू” या “गवाही का तंबू” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְיוֹם הָקִים
  choice: जिस दिन ... खड़ा किया गया, उस दिन
  rationale: इब्रानी कालवाचक रचना को स्वाभाविक हिन्दी में दोहरावयुक्त सहसंबंधी वाक्य के रूप में व्यक्त किया गया है; הָקִים का भाव यहाँ संरचना को खड़ा किए जाने का है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: מִשְׁכָּן मूलतः ‘निवास-स्थान’ है और यहाँ इस्राएल के चलायमान पवित्रस्थान का पारिभाषिक नाम है; ‘पवित्र निवास’ अर्थ को स्पष्ट और आधुनिक हिन्दी में सहज रखता है।
- source_word: כִּסָּה הֶעָנָן
  choice: बादल ने ... ढक लिया
  rationale: כסה का सीधा अर्थ ढकना है और निश्चित लेख वाला הֶעָנָן प्रसंग में पहले से परिचित विशिष्ट बादल को सूचित करता है।
- source_word: לְאֹהֶל הָעֵדֻת
  choice: अर्थात साक्षी के तंबू
  rationale: वाक्यांश को पवित्र निवास की समानाधिकरणात्मक पहचान माना गया है। עֵדוּת के लिए ‘साक्षी’ मूल के ‘गवाही/प्रमाण’ भाव को बनाए रखता है; वैकल्पिक पारंपरिक पद फुटनोट में दिया गया है।
- source_word: וּבָעֶרֶב יִהְיֶה
  choice: और शाम से ... वह ... दिखाई देता था
  rationale: अपूर्ण क्रिया यहाँ नियमित अथवा जारी अतीत की स्थिति बताती है। अगले पद के पुनरावृत्तिपरक संदर्भ से मेल खाते हुए हिन्दी का अभ्यस्त भूतकाल चुना गया है।
- source_word: כְּמַרְאֵה אֵשׁ
  choice: आग जैसा दिखाई देता था
  rationale: כְּ और מַרְאֶה दृश्य समानता बताते हैं, आग के साथ पूर्ण तादात्म्य नहीं; हिन्दी में यह तुलना सहज रूप से व्यक्त होती है।
- source_word: עַד בֹּקֶר
  choice: सुबह तक
  rationale: सरल काल-सीमा को सामान्य आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: ‘पवित्र निवास’ और ‘साक्षी के तंबू’ का संबंध
  choice: 'दूसरे पदबंध को पहले की समानाधिकरणात्मक पहचान के रूप में प्रस्तुत किया गया: ‘अर्थात साक्षी के तंबू’'
  alternative: לְ को अधिक स्थानवाचक या दिशावाचक मानकर ‘पवित्र निवास को, साक्षी के तंबू पर/की ओर’ कहना
  rationale: वाक्य-विन्यास में दूसरा पदबंध उसी पवित्र संरचना को और स्पष्ट करता है; उसे अलग स्थान या वस्तु बनाना प्रसंग को अनावश्यक रूप से जटिल करेगा।
- issue: रात में आग और बादल का संबंध
  choice: सर्वनाम ‘वह’ के द्वारा बादल को रात में आग जैसा दिखाई देने वाला बताया गया
  alternative: सर्वनाम को अनिर्दिष्ट रखकर केवल पवित्र निवास के ऊपर कोई आग-सदृश दृश्य मानना
  rationale: निकटतम व्याकरणिक कर्ता बादल है, पर पाठ पहचान के बजाय रूप-समानता कहता है; इसलिए ‘आग जैसा’ बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पवित्र निवास’ अर्थ-केंद्रित पारिभाषिक पद है; ‘अर्थात’ समानाधिकरण को स्पष्ट करता है। मुख्य पाठ में फुटनोट चिह्न [a] संबंधित पदबंध के तुरंत बाद रखा गया है।
