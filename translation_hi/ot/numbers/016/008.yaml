  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל קֹ֑רַח שִׁמְעוּ נָ֖א בְּנֵ֥י לֵוִֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/008.yaml
  text: Then Moses said to Korah[a], “Hear now, you sons of Levi.”
translation:
  language: hi
  text: तब मूसा ने कोरह से कहा, “हे लेवी के पुत्रों, अब सुनो!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל
  choice: से
  rationale: कहने की क्रिया के साथ सम्बोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: שִׁמְעוּ
  choice: सुनो
  rationale: यह שׁמע का बहुवचन आज्ञार्थक रूप है; ‘सुनो’ औपचारिक आह्वान और कथन पर ध्यान देने की माँग—दोनों को व्यक्त करता है।
- source_word: נָא
  choice: अब
  rationale: नָא आज्ञा में आग्रह या तत्परता जोड़ता है; टकराव के इस प्रसंग में ‘अब’ विनम्र ‘कृपया’ की अपेक्षा अधिक उपयुक्त है।
- source_word: בְּנֵי
  choice: पुत्रो
  rationale: यह ‘पुत्र’ का सम्बन्धवाचक बहुवचन है और यहाँ प्रत्यक्ष सम्बोधन में पुरुष लेवियों को संकेत करता है; सम्बोधन रूप ‘पुत्रो’ हिन्दी में स्वाभाविक है।
- source_word: לֵוִי
  choice: लेवी
  rationale: व्यक्ति और गोत्र का नाम मानक हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप रखा गया है।
theological_decisions:
- issue: प्रत्यक्ष सम्बोधन में लिंग-सूचक वंशवाचक पद
  choice: हे लेवी के पुत्रो
  alternative: हे लेवियो / हे लेवी की सन्तानो
  rationale: इब्रानी में पुल्लिंग बहुवचन ‘लेवी के पुत्र’ है। इसलिए सामान्य गोत्रनाम या लिंग-निरपेक्ष पद अपनाने के बजाय मूल का पुरुष-सूचक रूप बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक सम्बोधन के अनुकूल है। ‘हे’ प्रत्यक्ष सम्बोधन को स्पष्ट करता है, जबकि विस्मयादिबोधक चिह्न आग्रहपूर्ण स्वर दर्शाता है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘अब सुनो’ मूल के שִׁמְעוּ נָא को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
