base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/004.yaml
  text: When Moses heard it[a], he fell on his face.
translation:
  language: hi
  text: यह सुनकर मूसा मुँह के बल गिर पड़े[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने चेहरे के बल गिर पड़े।” इसका अनुवाद “मुँह के बल लेट गए” या “भूमि पर गिरकर दण्डवत् हुए” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: यह सुनकर
  rationale: क्रियापद שׁמע का यहाँ स्वाभाविक अर्थ ‘सुनना’ है। इब्रानी में कर्म निहित है; ‘यह’ पिछले पद में कही गई बात की ओर संकेत करता है और हिन्दी में वाक्य को सहज बनाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल परंपरा में इस नाम का प्रचलित और सर्वमान्य रूप ‘मूसा’ है।
- source_word: וַיִּפֹּל
  choice: गिर पड़े
  rationale: נפל का मूल अर्थ ‘गिरना’ है। ‘गिर पड़े’ इब्रानी की ठोस शारीरिक क्रिया को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: עַל פָּנָיו
  choice: मुँह के बल
  rationale: यह दण्डवत् मुद्रा के लिए प्रयुक्त इब्रानी मुहावरा है। ‘मुँह के बल’ शारीरिक मुद्रा को स्पष्ट करता है, पर उसके भाव—प्रार्थना, शोक, नम्रता या मध्यस्थता—को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: मूसा की मुद्रा का आशय
  choice: क्रिया को सीधे ‘मुँह के बल गिर पड़े’ कहा गया है, बिना यह निश्चित किए कि वह प्रार्थना, सदमा, नम्रता या मध्यस्थता थी।
  alternative: ‘प्रार्थना करने के लिए दण्डवत् हो गए’ अथवा ‘शोक में मुँह के बल गिर पड़े।’
  rationale: इब्रानी पाठ केवल शारीरिक क्रिया बताता है, उसका आशय स्पष्ट नहीं करता। ठोस चित्र को बनाए रखने से मूल की अर्थगत और धर्मवैचारिक खुली संभावना सुरक्षित रहती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। सम्मानसूचक बहुवचन ‘गिर पड़े’ हिन्दी में मूसा के लिए स्वाभाविक है; इससे इब्रानी के एकवचन कर्ता में कोई अर्थगत परिवर्तन नहीं होता।
