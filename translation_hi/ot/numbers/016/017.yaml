  text: וּ/קְח֣וּ אִ֣ישׁ מַחְתָּת֗/וֹ וּ/נְתַתֶּ֤ם עֲלֵי/הֶם֙ קְטֹ֔רֶת וְ/הִקְרַבְתֶּ֞ם לִ/פְנֵ֤י יְהוָה֙ אִ֣ישׁ מַחְתָּת֔/וֹ חֲמִשִּׁ֥ים וּ/מָאתַ֖יִם מַחְתֹּ֑ת וְ/אַתָּ֥ה וְ/אַהֲרֹ֖ן אִ֥ישׁ מַחְתָּתֽ/וֹ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/017.yaml
  text: And let each man take his firepan[a], and put incense on them, and bring before Yahweh each man his firepan—two hundred and fifty firepans—and you and Aaron[b], each his firepan.
translation:
  language: hi
  text: तुममें से हर पुरुष अपना धूपदान[a] ले, और अपने-अपने धूपदानों पर धूप रखो; फिर हर एक अपना धूपदान याहवे[b] के सामने ले आए—ढाई सौ धूपदान। तुम और हारून भी अपना-अपना धूपदान ले आना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अग्निपात्र”; यह अंगारों पर धूप जलाने के लिए इस्तेमाल किया जाने वाला पात्र था।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में परमेश्वर का नाम YHWH है। “याहवे” इसका प्रचलित लिप्यंतरण है, यद्यपि इसके प्राचीन उच्चारण के बारे में पूर्ण निश्चितता नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּקְחוּ אִישׁ
  choice: तुममें से हर एक पुरुष ... ले
  rationale: बहुवचन आज्ञा और वितरणसूचक אִישׁ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; पुल्लिंग एकवचन रूप भी सुरक्षित रहता है।
- source_word: מַחְתָּתוֹ / מַחְתֹּת
  choice: धूपदान / धूपदान
  rationale: यह अंगारे और धूप रखने का पात्र है। हिन्दी में ‘धूपदान’ स्पष्ट और प्रचलित है; ‘अग्निपात्र’ अधिक शाब्दिक पर कम सहज विकल्प है।
- source_word: וּנְתַתֶּם עֲלֵיהֶם קְטֹרֶת
  choice: उस पर धूप रखे
  rationale: עַל के ‘पर’ अर्थ को बनाए रखता है और हर पुरुष के एक धूपदान के साथ वितरणसूचक सामंजस्य स्थापित करता है।
- source_word: וְהִקְרַבְתֶּם לִפְנֵי יְהוָה
  choice: यहोवा के सामने ... ले आए
  rationale: हिफ़ील रूप के ‘निकट लाने/प्रस्तुत करने’ के धार्मिक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: חֲמִשִּׁים וּמָאתַיִם מַחְתֹּת
  choice: कुल ढाई सौ धूपदान
  rationale: हिब्रू संख्या 250 को सहज साहित्यिक हिन्दी में व्यक्त करता है; ‘कुल’ संख्या को समूह के धूपदानों से स्पष्टतः जोड़ता है।
- source_word: וְאַתָּה וְאַהֲרֹן אִישׁ מַחְתָּתוֹ
  choice: तुम और हारून भी अपना-अपना धूपदान लाना
  rationale: संक्षिप्त हिब्रू वितरणसूचक वाक्यांश को हिन्दी की स्वाभाविक आज्ञार्थक रचना में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबल-पाठकों में ‘यहोवा’ अधिक पहचाना जाने वाला लिप्यंतरण है; ‘याहवे’ स्रोत-उच्चारण का निकट विकल्प है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन में सहज रखी गई है। ‘अपना-अपना’ मूल के वितरणसूचक אִישׁ ... מַחְתָּתוֹ को स्पष्ट करता है। अंतिम खंड में हिन्दी की स्वाभाविकता के लिए आज्ञा ‘लाना’ दोहराई गई है।
