source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר מֹשֶׁה֙ אֶל קֹ֔רַח אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הֱי֖וּ לִ/פְנֵ֣י יְהוָ֑ה אַתָּ֥ה וָ/הֵ֛ם וְ/אַהֲרֹ֖ן מָחָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/016.yaml
  text: And Moses said to Korah[a], “You and all your congregation[b], be before Yahweh tomorrow—you and they and Aaron.”
translation:
  language: hi
  text: तब मूसा ने कोरह से कहा, “तुम और तुम्हारी सारी मंडली कल याहवे के सामने उपस्थित रहना[a]—तुम, वे और हारून[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कल याहवे की उपस्थिति में रहना।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में उपस्थित होने वाले पक्षों की स्पष्ट सूची है: “तुम और वे और हारून।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब मूसा ने ... कहा
  rationale: वाव-क्रमिक कथन अगले घटनाक्रम को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” स्वाभाविक कथा-प्रवाह देता है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אַתָּה וְכָל עֲדָתְךָ
  choice: तुम और तुम्हारी सारी मंडली
  rationale: עֵדָה यहाँ कोरह से जुड़े पूरे संगठित समुदाय या दल को दर्शाता है; “मंडली” सामूहिक अर्थ को बनाए रखता है।
- source_word: הֱיוּ לִפְנֵי
  choice: के सामने उपस्थित रहना
  rationale: היה का बहुवचन आज्ञार्थ शाब्दिक रूप से “होना” है, पर इस प्रसंग में नियत समय पर उपस्थिति की आज्ञा है; यह हिन्दी में स्पष्ट और स्रोत के निकट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय पवित्र नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: אַתָּה וָהֵם וְאַהֲרֹן
  choice: तुम, वे और हारून
  rationale: इब्रानी पाठ उपस्थित होने वाले तीनों पक्षों को दोहराकर स्पष्ट करता है; हिन्दी में अल्पविरामों के साथ यह जोर सुरक्षित रहता है।
- source_word: מָחָר
  choice: कल
  rationale: यह समयवाचक क्रियाविशेषण अगले दिन को दर्शाता है; “कल” प्रसंग में स्वाभाविक और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में निजी वाचा-नाम सीधे आया है। “याहवे” उसका आधुनिक विद्वत्तापरक लिप्यंतरण है और नाम को किसी उपाधि में नहीं बदलता।
- issue: לִפְנֵי יְהוָה में उपस्थिति का भाव
  choice: याहवे के सामने उपस्थित रहना
  alternative: याहवे की उपस्थिति में रहना
  rationale: לִפְנֵי में “के सामने” और “की उपस्थिति में” दोनों भाव संभव हैं; मुख्य पाठ स्वाभाविक हिन्दी रखते हुए स्थानिक और धार्मिक दोनों अर्थों को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। “उपस्थित रहना” आज्ञार्थ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
