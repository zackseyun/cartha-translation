language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֨רְד֜וּ הֵ֣ם וְ/כָל אֲשֶׁ֥ר לָ/הֶ֛ם חַיִּ֖ים שְׁאֹ֑לָ/ה וַ/תְּכַ֤ס עֲלֵי/הֶם֙ הָ/אָ֔רֶץ וַ/יֹּאבְד֖וּ מִ/תּ֥וֹךְ הַ/קָּהָֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/033.yaml
  text: So they went down alive into Sheol—they and all that belonged to them—and the earth covered them[a], and they perished from the midst of the assembly.
translation:
  language: hi
  text: इस प्रकार वे जीवित ही शिओल[a] में उतर गए—वे और वह सब जो उनका था। तब धरती ने उन्हें ढक लिया, और वे सभा के बीच से नष्ट हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “कब्र” अथवा “मृतकों का लोक।” इब्रानी: “शिओल।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: उतर गए
  rationale: ירד का सामान्य अर्थ नीचे जाना या उतरना है; यह चयन कथा की दिशा और स्वाभाविक हिन्दी दोनों को बनाए रखता है।
- source_word: הֵם וְכָל אֲשֶׁר לָהֶם
  choice: वे और वह सब जो उनका था
  rationale: इब्रानी वाक्यांश व्यक्तियों, आश्रितों और वस्तुओं में किसी एक तक अर्थ को सीमित नहीं करता; यह व्यापक हिन्दी अभिव्यक्ति उसी अस्पष्टता को बनाए रखती है।
- source_word: חַיִּים
  choice: जीवित ही
  rationale: यह विधेयात्मक प्रयोग इस बात पर बल देता है कि नीचे जाते समय वे जीवित थे; ‘ही’ उस जोर को सहज हिन्दी में व्यक्त करता है।
- source_word: שְׁאֹלָה
  choice: अधोलोक में
  rationale: दिशासूचक प्रत्यय को ‘में’ व्यक्त करता है। ‘अधोलोक’ मृतकों के लोक की व्यापक धारणा को रखता है और इसे केवल व्यक्तिगत कब्र तक सीमित नहीं करता।
- source_word: וַתְּכַס עֲלֵיהֶם הָאָרֶץ
  choice: धरती ने उन्हें ढक लिया
  rationale: כסה का सीधा अर्थ ढकना है और הָאָרֶץ यहाँ कर्ता है; यह रूप दृश्य को स्पष्ट तथा हिन्दी को स्वाभाविक रखता है।
- source_word: וַיֹּאבְדוּ
  choice: वे ... नष्ट हो गए
  rationale: אבד यहाँ नाश हो जाने या मिट जाने को दर्शाता है; यह कर्मवाच्य ‘नष्ट किए गए’ की अपेक्षा इब्रानी क्रिया के रूप के अधिक निकट है।
- source_word: מִתּוֹךְ הַקָּהָל
  choice: सभा के बीच से
  rationale: यह चयन מִתּוֹךְ की स्थानगत छवि और קהל के सामुदायिक अर्थ दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: שְׁאֹל का अनुवाद
  choice: अधोलोक
  alternative: कब्र; मृतकों का लोक; शिओल
  rationale: यह पद केवल भौतिक कब्र से व्यापक हो सकता है। ‘अधोलोक’ उस प्राचीन इब्रानी अवधारणा को व्यक्त करता है, पर उसे बाद की व्यवस्थित ‘नरक’ संबंधी धारणा से नहीं मिलाता; वैकल्पिक अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘वह सब जो उनका था’ मूल की व्यापकता को बनाए रखता है, और ‘अधोलोक’ के साथ पादटिप्पणी मूल शब्द की अर्थ-सीमा तथा धर्मवैचारिक तनाव को स्पष्ट करती है।
