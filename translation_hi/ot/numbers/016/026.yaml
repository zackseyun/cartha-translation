id: NUM.16.26
reference: Numbers 16:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל הָ/עֵדָ֜ה לֵ/אמֹ֗ר ס֣וּרוּ נָ֡א מֵ/עַל֩ אָהֳלֵ֨י הָ/אֲנָשִׁ֤ים הָֽ/רְשָׁעִים֙ הָ/אֵ֔לֶּה וְ/אַֽל תִּגְּע֖וּ בְּ/כָל אֲשֶׁ֣ר לָ/הֶ֑ם פֶּן תִּסָּפ֖וּ בְּ/כָל חַטֹּאתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/026.yaml
  text: And he spoke to the congregation[a], saying, “Please move away from the tents of these wicked men, and do not touch anything that belongs to them, lest you be swept away in all their sins.”
translation:
  language: hi
  text: उसने मंडली से कहा, “कृपया इन दुष्ट पुरुषों के तंबुओं से दूर हट जाओ और उनकी किसी भी वस्तु को मत छुओ, कहीं ऐसा न हो कि तुम भी उनके सब पापों के साथ मिटा दिए जाओ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कहीं उनके सब पापों के कारण तुम भी नष्ट न हो जाओ।” इब्रानी वाक्यांश को अधिक स्पष्ट कारणवाचक अर्थ में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעֵדָה
  choice: मंडली
  rationale: यह शब्द यहाँ एकत्र इस्राएली समुदाय को दर्शाता है; ‘मंडली’ उसके सामूहिक और सभागत भाव को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: סוּרוּ נָא
  choice: कृपया ... दूर हट जाओ
  rationale: आज्ञार्थक סוּר दूरी बनाने को कहता है, जबकि נָא आग्रह और तात्कालिकता जोड़ता है; ‘कृपया’ इस आग्रह को व्यक्त करता है।
- source_word: מֵעַל אָהֳלֵי
  choice: के तंबुओं से दूर
  rationale: מֵעַל यहाँ तंबुओं के निकट स्थान से हटने का भाव देता है; यह हिंदी प्रयोग प्रसंगानुकूल और स्पष्ट है।
- source_word: הָאֲנָשִׁים הָרְשָׁעִים הָאֵלֶּה
  choice: इन दुष्ट पुरुषों
  rationale: रूप विशिष्ट पुरुषों की ओर संकेत करता है, और רְשָׁעִים का नैतिक-न्यायिक अर्थ ‘दुष्ट’ से सुरक्षित रहता है।
- source_word: וְאַל תִּגְּעוּ
  choice: और ... मत छुओ
  rationale: निषेधात्मक आज्ञा को सीधे और बिना अतिरिक्त व्याख्या के व्यक्त किया गया है।
- source_word: בְּכָל אֲשֶׁר לָהֶם
  choice: उनकी किसी भी वस्तु को
  rationale: नकारात्मक वाक्य में यह अभिव्यक्ति उनकी समस्त संपत्ति के व्यापक संदर्भ को स्वाभाविक हिंदी में बताती है।
- source_word: פֶּן תִּסָּפוּ
  choice: कहीं ऐसा न हो कि तुम भी ... मिटा दिए जाओ
  rationale: निफ़ाल रूप आने वाले न्याय में नष्ट कर दिए जाने का कर्मवाच्य भाव रखता है; ‘भी’ दूसरों के साथ उसी विनाश में आ पड़ने का प्रसंगगत भाव स्पष्ट करता है।
- source_word: בְּכָל חַטֹּאתָם
  choice: उनके सब पापों के साथ
  rationale: בְּ को संगति/परिस्थिति के रूप में रखकर मूल की अस्पष्टता सुरक्षित की गई है; इसे मुख्य पाठ में केवल कारणवाचक नहीं बनाया गया।
theological_decisions:
- issue: दुष्टों से जुड़े रहने के कारण सामूहिक न्याय की चपेट में आना
  choice: लोगों को दुष्ट पुरुषों और उनकी वस्तुओं से अलग होने को कहा गया है, ताकि वे उनके पापों से जुड़े न्याय में उनके साथ न मिटें।
  alternative: 'अंतिम वाक्यांश को पूर्णतः कारणवाचक बनाया जा सकता है: ‘कहीं उनके सब पापों के कारण तुम भी नष्ट न हो जाओ।’'
  rationale: इब्रानी पाठ निकटता/संगति और पापों के कारण आने वाले न्याय के बीच तनाव बनाए रखता है; अनुवाद न तो आरोपित दोष का कोई विस्तृत सिद्धांत जोड़ता है, न संबंध को मात्र कारणवाचक बनाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सीधी और सामान्य पाठकों के लिए सुबोध शैली। ‘मंडली’, ‘दुष्ट पुरुषों’ और ‘मिटा दिए जाओ’ से पेंटाट्यूक की सामूहिक तथा न्याय-संबंधी भाषा सुरक्षित रखी गई है।
