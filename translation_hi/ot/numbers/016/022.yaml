id: NUM.16.22
reference: Numbers 16:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּפְּל֤וּ עַל פְּנֵי/הֶם֙ וַ/יֹּ֣אמְר֔וּ אֵ֕ל אֱלֹהֵ֥י הָ/רוּחֹ֖ת לְ/כָל בָּשָׂ֑ר הָ/אִ֤ישׁ אֶחָד֙ יֶחֱטָ֔א וְ/עַ֥ל כָּל הָ/עֵדָ֖ה תִּקְצֹֽף־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/022.yaml
  text: Then they fell on their faces and said[a], “God, the God of the spirits of all flesh, shall one man sin[b], and will you be angry with the whole congregation?”
translation:
  language: hi
  text: तब वे मुँह के बल गिर पड़े और बोले, “हे परमेश्वर, समस्त प्राणियों की आत्माओं के परमेश्वर[a], क्या एक मनुष्य पाप करे[b] और आप पूरी मण्डली पर क्रोधित हों?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त प्राणियों के श्वास के परमेश्वर”; इससे हर जीवित प्राणी को जीवन देने वाले परमेश्वर पर बल पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: '“एक मनुष्य” का प्रयोग प्रतिनिधिक अर्थ में हो सकता है: विनती यह है कि किसी एक के पाप के कारण पूरी मण्डली पर क्रोध न किया जाए।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְּלוּ עַל־פְּנֵיהֶם
  choice: वे मुँह के बल गिर पड़े
  rationale: यह इब्रानी मुहावरे की ठोस छवि तथा नम्रता, भय और विनती की मुद्रा को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֵל
  choice: हे परमेश्वर
  rationale: यह सम्बोधनात्मक प्रयोग है; ‘हे’ उसके सम्बोधन-भाव को स्पष्ट करता है।
- source_word: אֱלֹהֵי הָרוּחֹת לְכָל־בָּשָׂר
  choice: समस्त प्राणियों की आत्माओं के परमेश्वर
  rationale: ‘आत्माओं’ बहुवचन רוּחֹת को सुरक्षित रखता है और प्रसंग में प्रत्येक के भीतरी जीवन तथा दोष को जानने वाले परमेश्वर की ओर संकेत करता है। ‘समस्त प्राणी’ לְכָל־בָּשָׂר के व्यापक इब्रानी मुहावरे को हिन्दी में बोधगम्य बनाता है।
- source_word: הָאִישׁ אֶחָד
  choice: एक मनुष्य
  rationale: यह पुल्लिंग एकवचन को बनाए रखता है, जबकि ‘मनुष्य’ आधुनिक हिन्दी में गरिमापूर्ण और सहज है।
- source_word: יֶחֱטָא
  choice: पाप करे
  rationale: प्रश्न में प्रयुक्त अपूर्ण क्रिया के संभाव्य/शर्तात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל־הָעֵדָה
  choice: पूरी मण्डली
  rationale: इस्राएल के संगठित समुदाय के लिए עֵדָה का परिचित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: תִּקְצֹף
  choice: क्रोधित हों
  rationale: ईश्वरीय रोष को स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है, बिना अनावश्यक तीव्रता जोड़े।
theological_decisions:
- issue: ‘समस्त प्राणियों की आत्माओं के परमेश्वर’ का मानवशास्त्रीय अर्थ
  choice: ऐसी उपाधि जो हर प्राणी के भीतरी जीवन पर परमेश्वर के ज्ञान और अधिकार को सामने रखती है।
  alternative: ऐसी उपाधि जो सभी जीवित प्राणियों को श्वास और जीवन देने वाले परमेश्वर पर बल देती है।
  rationale: मूसा और हारून की विनती में व्यक्तिगत दोष और सामूहिक दण्ड के बीच भेद करने की परमेश्वर की क्षमता प्रासंगिक है; फिर भी ‘श्वास’ वाला अर्थ सम्भव है और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: הָאִישׁ אֶחָד का प्रतिनिधिक बल
  choice: मुख्य पाठ में ‘एक मनुष्य’, जो मूल के पुल्लिंग एकवचन को सुरक्षित रखता है।
  alternative: ‘एक व्यक्ति’, जो प्रतिनिधिक अर्थ को अधिक स्पष्ट पर लिंग-तटस्थ बनाता।
  rationale: मूल व्याकरणतः पुल्लिंग एकवचन है। प्रसंग में वह किसी एक व्यक्ति का प्रतिनिधिक उल्लेख हो सकता है; इस सम्भावना को पादटिप्पणी में रखा गया है।
- issue: व्यक्तिगत पाप और सामूहिक क्रोध का तनाव
  choice: प्रश्न को बिना समाधान जोड़े उसी तनाव के साथ रखा गया है।
  alternative: वाक्य में यह स्पष्ट कर देना कि पूरी मण्डली निर्दोष है या कि परमेश्वर उसे दण्ड नहीं देंगे।
  rationale: मूल पाठ एक विनतीपूर्ण प्रश्न करता है; वह मण्डली की निर्दोषता या उत्तर को स्पष्टतः घोषित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण बाइबलीय शैली अपनाई गई है। ‘मुँह के बल गिर पड़े’ मूल की ठोस मुद्रा रखता है; ‘मण्डली’ सामुदायिक प्रसंग को व्यक्त करती है। मुख्य पाठ में सम्भावित ‘आत्मा/श्वास’ अर्थ और व्यक्तिगत बनाम सामूहिक उत्तरदायित्व का तनाव अति-व्याख्या के बिना सुरक्षित है।
