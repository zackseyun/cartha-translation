language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִם כְּ/מ֤וֹת כָּל הָֽ/אָדָם֙ יְמֻת֣וּ/ן אֵ֔לֶּה וּ/פְקֻדַּת֙ כָּל הָ֣/אָדָ֔ם יִפָּקֵ֖ד עֲלֵי/הֶ֑ם לֹ֥א יְהוָ֖ה שְׁלָחָֽ/נִי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/029.yaml
  text: If these men die the death of all mankind[a], and the fate of all mankind is visited on them, then Yahweh has not sent me.
translation:
  language: hi
  text: यदि ये लोग वैसे ही मरें जैसे सब मनुष्य मरते हैं, और जो कुछ सब मनुष्यों के साथ होता है वही इनके साथ भी हो, तो याहवे ने मुझे नहीं भेजा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִם
  choice: यदि
  rationale: यह मूसा द्वारा रखी गई शर्त का आरम्भ करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और पर्याप्त है।
- source_word: כְּמוֹת כָּל הָאָדָם יְמֻתוּן אֵלֶּה
  choice: ये लोग वैसे ही मरें जैसे सब मनुष्य मरते हैं
  rationale: इब्रानी तुलनात्मक रचना सामान्य मानवीय मृत्यु से तुलना करती है। हिन्दी में यह रूप अर्थ और बल दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל הָאָדָם
  choice: सब मनुष्य
  rationale: אָדָם यहाँ सामूहिक और सामान्य अर्थ में समस्त मानवजाति को सूचित करता है, केवल पुरुषों को नहीं।
- source_word: וּפְקֻדַּת כָּל הָאָדָם יִפָּקֵד עֲלֵיהֶם
  choice: जो दशा सब मनुष्यों पर आती है वही इन पर भी आए
  rationale: פְּקֻדָּה और פקד की पुनरुक्ति किसी पर आने वाली नियत दशा, निरीक्षण अथवा दैवी कार्रवाई का संकेत दे सकती है। मुख्य पाठ में ‘दशा ... आए’ अर्थ को स्पष्ट रखता है, जबकि पादटिप्पणी मूल की व्यापकता बताती है।
- source_word: לֹא יְהוָה שְׁלָחָנִי
  choice: तो याहवे ने मुझे नहीं भेजा है
  rationale: निष्कर्ष मूसा के दैवी प्रेषण को नकारता है; ‘नहीं भेजा है’ पूर्ण हुई नियुक्ति की वर्तमान प्रासंगिकता व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को शीर्षक से प्रतिस्थापित करने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: אָדָם का सामान्य सामूहिक अर्थ
  choice: सब मनुष्य
  alternative: सारी मानवजाति
  rationale: सन्दर्भ सामान्य मानवीय मृत्यु और दशा का है, न कि केवल पुरुष लिंग का। ‘सब मनुष्य’ सरल और सामूहिक दोनों है।
- issue: פקד-शब्दमूल की अर्थगत व्यापकता
  choice: दशा ... आए
  alternative: देखरेख/दण्ड/नियत घटना उन पर आए
  rationale: सन्दर्भ असाधारण न्याय की तुलना सामान्य मानवीय परिणति से करता है, पर शब्द स्वयं केवल ‘दण्ड’ तक सीमित नहीं है; इसलिए मुख्य पाठ व्यापक रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। शर्त-वाक्य की संरचना और सामान्य मृत्यु बनाम असाधारण दैवी न्याय का तनाव सुरक्षित है।
