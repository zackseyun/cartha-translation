  text: וַ/תִּפְתַּ֤ח הָ/אָ֨רֶץ֙ אֶת פִּ֔י/הָ וַ/תִּבְלַ֥ע אֹתָ֖/ם וְ/אֶת בָּתֵּי/הֶ֑ם וְ/אֵ֤ת כָּל הָ/אָדָם֙ אֲשֶׁ֣ר לְ/קֹ֔רַח וְ/אֵ֖ת כָּל הָ/רֲכֽוּשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/032.yaml
  text: and the earth opened its mouth and swallowed them[a], their households, all the people who belonged to Korah[b], and all their possessions.
translation:
  language: hi
  text: और धरती ने अपना मुँह खोला और उन्हें, उनके घरानों को[a], कोरह से जुड़े सभी लोगों को[b], और उनकी सारी संपत्ति को निगल लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उनके घरों को’। इब्रानी शब्द भौतिक घरों को अथवा विस्तार से उनमें रहनेवाले घरानों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अधिक शाब्दिक रूप में, ‘हर वह मनुष्य जो कोरह से संबंधित था’। यहाँ ‘मनुष्य’ के लिए आया इब्रानी एकवचन शब्द सामूहिक अर्थ में प्रयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּפְתַּח הָאָרֶץ אֶת־פִּיהָ
  choice: धरती ने अपना मुँह खोला
  rationale: इब्रानी रूपक को सीधे और स्वाभाविक हिन्दी में बनाए रखता है; क्रिया פתח का सामान्य अर्थ ‘खोलना’ है, इसलिए ‘फट गई’ जैसी अतिरिक्त तीव्रता नहीं जोड़ी गई।
- source_word: וַתִּבְלַע
  choice: निगल लिया
  rationale: בלע का सीधा अर्थ ‘निगलना’ है और यह धरती के ‘मुँह’ वाले सजीव रूपक को सुरक्षित रखता है।
- source_word: בָּתֵּיהֶם
  choice: उनके घरानों
  rationale: शाब्दिक ‘उनके घरों’ के साथ-साथ यह शब्द घरेलू इकाइयों अथवा परिवारों को भी सूचित कर सकता है; प्रसंग में ‘घरानों’ से व्यापक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: כָּל־הָאָדָם אֲשֶׁר לְקֹרַח
  choice: कोरह से जुड़े सभी लोगों
  rationale: אָדָם यहाँ एकवचन सामूहिक प्रयोग में है और לְקֹרַח सम्बन्ध अथवा पक्षधरता दर्शाता है। यह चयन सामूहिक अर्थ तथा सम्बन्ध की कुछ व्यापकता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל־הָרֲכוּשׁ
  choice: उनकी सारी सम्पत्ति
  rationale: רְכוּשׁ चल-अचल माल, वस्तुओं या स्वामित्व की चीज़ों के व्यापक भाव में है; ‘सम्पत्ति’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: כָּל־הָאָדָם का सामूहिक और लिंग-सूचक रूप
  choice: सभी लोगों
  alternative: हर वह मनुष्य जो कोरह का था
  rationale: व्याकरण की दृष्टि से אָדָם पुल्लिंग एकवचन है, पर כָּל के साथ यहाँ समूह को सूचित करता है। मुख्य पाठ में सामूहिक भाव को स्पष्ट किया गया है और अधिक शाब्दिक रूप पादटिप्पणी में रखा गया है, ताकि किसी खास लिंग या समूह-सीमा को अनावश्यक रूप से निर्धारित न किया जाए।
- issue: לְקֹרַח में व्यक्त सम्बन्ध
  choice: कोरह से जुड़े
  alternative: कोरह के थे
  rationale: लामेद सम्बन्ध, संबद्धता या पक्षधरता व्यक्त कर सकता है। ‘से जुड़े’ इस अर्थ-व्याप्ति को बनाए रखता है और निजी स्वामित्व का अनुचित भाव नहीं देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘धरती ने अपना मुँह खोला’ और ‘निगल लिया’ मूल के सजीव मानवीकरण को सुरक्षित रखते हैं; ‘घरानों’ तथा ‘सभी लोगों’ से प्रसंग का सामूहिक भाव सहज हिन्दी में व्यक्त होता है।
