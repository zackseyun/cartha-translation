lexical_decisions:
- source_word: זֹאת עֲשׂוּ
  choice: यह करो
  rationale: आगे दिए जाने वाले निर्देश की ओर संकेत करने वाली आज्ञा का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: קְחוּ לָכֶם
  choice: अपने लिए ... ले लो
  rationale: बहुवचन आज्ञा और לָכֶם के आत्मवाचक भाव, दोनों को आधुनिक हिन्दी में स्पष्ट रखता है।
- source_word: מַחְתּוֹת
  choice: धूपदान
  rationale: यह शब्द जलते अंगारे रखने और विशेषतः धूप चढ़ाने में प्रयुक्त पात्रों को दर्शाता है; इस अनुष्ठानिक प्रसंग में ‘धूपदान’ सर्वाधिक स्पष्ट है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְכָל עֲדָתוֹ
  choice: और उसके पूरे समुदाय
  rationale: עֵדָה के एकत्र जनसमूह के भाव और एकवचन प्रत्यय ‘उसके’ को बनाए रखता है। सम्बोधन में ‘हे कोरह और उसके पूरे समुदाय’ हिन्दी में स्वाभाविक है।
