  text: וַ/יִּשְׁלַ֣ח מֹשֶׁ֔ה לִ/קְרֹ֛א לְ/דָתָ֥ן וְ/לַ/אֲבִירָ֖ם בְּנֵ֣י אֱלִיאָ֑ב וַ/יֹּאמְר֖וּ לֹ֥א נַעֲלֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/012.yaml
  text: Then Moses sent to summon Dathan and Abiram[a], the sons of Eliab, but they said, “We will not come up.”
translation:
  language: hi
  text: तब मूसा ने एलीआब के पुत्र दातान और अबीराम को बुलाने के लिए संदेश भेजा, पर उन्होंने कहा, “हम ऊपर नहीं आएँगे।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम ऊपर नहीं जाएँगे।” इब्रानी क्रिया का शाब्दिक अर्थ “ऊपर जाना/चढ़ना” है; इसका संकेत मूसा के स्थान पर जाने या बुलाए जाने पर उसके सामने उपस्थित होने से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: संदेश भेजा
  rationale: यहाँ שׁלח का अर्थ किसी को बुलवाने के लिए भेजना है। ‘संदेश भेजा’ स्वाभाविक हिन्दी है और किसी विशेष संदेशवाहक को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: לִקְרֹא
  choice: बुलाने के लिए
  rationale: इस रचना में קרא किसी व्यक्ति को अपने पास बुलाने या उपस्थित होने के लिए कहने का भाव रखता है। ‘बुलाने के लिए’ सामान्य पाठक के लिए सहज है और प्रसंग में आदेशात्मक बुलावे को व्यक्त करता है।
- source_word: דָתָן וְלַאֲבִירָם
  choice: दातान और अबीराम
  rationale: व्यक्तिनामों का मानक हिन्दी लिप्यंतरण किया गया है।
- source_word: בְּנֵי אֱלִיאָב
  choice: एलीआब के पुत्र
  rationale: मूल का सीधा वंश-सूचक परिचय बनाए रखा गया है।
- source_word: וַיֹּאמְרוּ
  choice: पर उन्होंने कहा
  rationale: वाव का मूल संयोजक अर्थ है, किंतु यहाँ मूसा के बुलावे के प्रतिकूल उत्तर होने के कारण ‘पर’ प्रसंगगत विरोध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֹא נַעֲלֶה
  choice: हम ऊपर नहीं आएँगे
  rationale: עלה का शाब्दिक अर्थ ‘ऊपर जाना/चढ़ना’ है। यहाँ अपूर्ण रूप दृढ़ अस्वीकार व्यक्त करता है; ‘ऊपर नहीं आएँगे’ दिशात्मक अर्थ को बनाए रखता है।
