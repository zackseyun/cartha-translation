  source_fidelity: इब्रानी वाक्य-विन्यास ‘और/तब याहवे ने मूसा से कहा, कहते हुए’ का अर्थ हिन्दी में स्वाभाविक सूत्रात्मक रूप ‘तब यहोवा ने मूसा से कहा,’ द्वारा ठीक व्यक्त होता है। ‘तब’ वय्यिक्तोल की कथानक-प्रगति को उचित रूप से दर्शाता है। ‘कहा’ इस सन्दर्भ में דִּבֵּר और לֵאמֹר के संयुक्त वचन-परिचय को स्वाभाविक ढंग से समेटता है और अगले पद के प्रत्यक्ष कथन के लिए वाक्य खुला रखता है।
  naturalness: ‘तब यहोवा ने मूसा से कहा,’ आधुनिक मानक हिन्दी में सहज, स्पष्ट और गरिमापूर्ण है। इस सूत्र में ‘बोला ... कहने के लिए’ जैसी शाब्दिक पुनरावृत्ति हिन्दी में अनावश्यक और कम स्वाभाविक होती।
  terminology: ‘यहोवा’ मूल के व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि में बदले बिना प्रस्तुत करता है और दिए गए हिन्दी परियोजना-निर्णय के अनुरूप है। ‘मूसा’ मानक हिन्दी व्यक्तिनाम है।
