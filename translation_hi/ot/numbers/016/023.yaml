  yaml_path: translation/ot/numbers/016/023.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ क्रमिकता को स्वाभाविक हिन्दी में व्यक्त करता है। इस प्रचलित वचन-परिचय में ‘कहा’ हिन्दी में सहज है और आगामी प्रत्यक्ष कथन की ओर संकेत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: דבר אל की हिन्दी वाक्य-रचना में स्वाभाविक अभिव्यक्ति ‘किसी से कहना’ है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का मानक और व्यापक रूप से पहचाना जाने वाला हिन्दी रूप।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: इब्रानी क्रियारूप आगामी प्रत्यक्ष कथन का परिचय देता है। हिन्दी में ‘कहा,’ इसी कार्य को स्वाभाविक रूप से निभाता है; ‘यह कहते हुए’ अनावश्यक रूप से कृत्रिम होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों के लिए प्रचलित नाम-रूप है और इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। सूत्रात्मक इब्रानी ‘बोला...कहते हुए’ को शब्दशः दोहराने के बजाय हिन्दी की स्वाभाविक वचन-परिचय शैली अपनाई गई है।
