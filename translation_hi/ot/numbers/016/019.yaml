reference: Numbers 16:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּקְהֵ֨ל עֲלֵי/הֶ֥ם קֹ֨רַח֙ אֶת כָּל הָ֣/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וַ/יֵּרָ֥א כְבוֹד יְהוָ֖ה אֶל כָּל הָ/עֵדָֽה־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/019.yaml
  text: And Korah assembled the whole congregation against them at the entrance to the tent of meeting[a], and the glory of Yahweh appeared to the whole congregation.
translation:
  language: hi
  text: तब कोरह ने उनके विरुद्ध पूरी मंडली को मिलापवाले तंबू के प्रवेश-द्वार पर इकट्ठा किया, और याहवे[a] की महिमा पूरी मंडली को दिखाई दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘YHWH’; परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: ईश्वरीय नाम के परंपरागत वैकल्पिक अनुवाद की जानकारी देना।
lexical_decisions:
- source_word: וַיַּקְהֵל
  choice: इकट्ठा किया
  rationale: हिफ़ील रूप का कारणवाचक अर्थ है कि कोरह ने मंडली को एकत्र किया; यह चयन उसकी सक्रिय अगुवाई को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲלֵיהֶם
  choice: उनके विरुद्ध
  rationale: विद्रोह के प्रसंग में עַל का भाव विरोधात्मक है; इसका संकेत मूसा और हारून के विरुद्ध जुटाई गई मंडली से है।
- source_word: כָּל הָעֵדָה
  choice: पूरी मंडली
  rationale: עֵדָה यहाँ इस्राएली समुदाय को एक संगठित समूह के रूप में दर्शाता है, और כָּל की समग्रता को ‘पूरी’ व्यक्त करता है।
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח तंबू के प्रवेश या द्वार को दर्शाता है। एकत्र होने की पूर्ण क्रिया के साथ हिन्दी में स्थान के लिए ‘पर’ स्वाभाविक है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पवित्र तंबू का प्रचलित हिन्दी नाम है और उस नियत स्थान को दर्शाता है जहाँ परमेश्वर इस्राएल से मिलता था।
- source_word: וַיֵּרָא
  choice: दिखाई दी
  rationale: נפעל रूप यहाँ दृश्य रूप में प्रकट होने का भाव देता है। ‘दिखाई दी’ उस प्रकटता को सहज हिन्दी में व्यक्त करता है और उसके स्वरूप के बारे में अतिरिक्त दावा नहीं करता।
- source_word: כְבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: כָּבוֹד इस प्रसंग में परमेश्वर की प्रत्यक्ष प्रकट उपस्थिति को दर्शाता है; ‘महिमा’ इस अर्थ का स्थापित और उपयुक्त हिन्दी रूप है।
- source_word: אֶל כָּל הָעֵדָה
  choice: पूरी मंडली को
  rationale: אֶל उस समुदाय को चिह्नित करता है जिसके सामने या जिसे यह प्रकटता दिखाई दी; ‘को दिखाई दी’ हिन्दी में दिशात्मक और अनुभवात्मक दोनों भाव स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे आया है। उसका लिप्यंतरण नाम को सुरक्षित रखता है, जबकि परंपरागत उपाधि को पाद-टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘मंडली’, ‘मिलापवाला तंबू’ और ‘महिमा’ जैसे परिचित बाइबिलीय पद रखे गए हैं, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए स्वाभाविक बनाया गया है।
