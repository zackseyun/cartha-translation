  text: לָ/כֵ֗ן אַתָּה֙ וְ/כָל עֲדָ֣תְ/ךָ֔ הַ/נֹּעָדִ֖ים עַל יְהוָ֑ה וְ/אַהֲרֹ֣ן מַה ה֔וּא כִּ֥י תלונו עָלָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/011.yaml
  text: Therefore[a], you and all your company who have assembled against Yahweh—and Aaron, what is he[c][b], that you grumble against him?
translation:
  language: hi
  text: इसलिए तुम और तुम्हारा सारा दल[a]—तुम सब याहवे[b] के विरुद्ध इकट्ठे हुए हो। और हारून कौन है कि तुम उसके विरुद्ध कुड़कुड़ाते हो?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारी सारी सभा” अथवा “तुम्हारी सारी मंडली।”
    reason: lexical_alternative
  - marker: b
    text: “याहवे” इब्रानी में परमेश्वर के नाम YHWH का रूप है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पद पिछले कथन से निकला निष्कर्ष प्रस्तुत करता है; ‘इसलिए’ उसके निष्कर्षसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲדָתְךָ
  choice: तुम्हारा सारा दल
  rationale: यहाँ शब्द कोरह के साथ जुटे समूह को सूचित करता है। ‘दल’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक ‘मंडली’ का अनावश्यक संस्थागत भाव नहीं जोड़ता।
- source_word: הַנֹּעָדִים
  choice: तुम सब जो ... इकट्ठे हुए हो
  rationale: निफ़अल कृदंत सहमति से एकत्र हुए लोगों को दर्शाता है। ‘तुम सब’ जोड़ने से इब्रानी के बहुवचन का हिन्दी में स्पष्ट और स्वाभाविक प्रतिनिधित्व होता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: विद्रोह और शिकायत के प्रसंग में इसका भाव विरोधात्मक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम YHWH है; उसका लिप्यंतरण नाम को सामान्य उपाधि से अलग रखता है।
- source_word: וְאַהֲרֹן מַה הוּא
  choice: और हारून है ही क्या
  rationale: यह स्वाभाविक हिन्दी में उस आलंकारिक प्रश्न और हारून की व्यक्तिगत महत्ता को गौण ठहराने वाले बल को बनाए रखता है।
- source_word: תלונו
  choice: कुड़कुड़ाते हो
  rationale: यह जंगल-वृत्तांतों में विद्रोही असंतोष और शिकायत के लिए प्रयुक्त क्रिया है; ‘कुड़कुड़ाना’ उसके नकारात्मक भाव को सामान्य ‘शिकायत करना’ से बेहतर व्यक्त करता है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: शिकायत हारून के विरुद्ध निर्देशित है; विरोधात्मक अर्थ प्रसंग और समान पूर्वसर्ग के पहले प्रयोग दोनों से मेल खाता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘याहवे’ उस नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
- issue: विद्रोह का वास्तविक लक्ष्य
  choice: दल को मुख्यतः याहवे के विरुद्ध इकट्ठा हुआ बताया गया है, फिर हारून की व्यक्तिगत हैसियत को आलंकारिक प्रश्न द्वारा गौण रखा गया है।
  alternative: दल याहवे और हारून दोनों के विरुद्ध समान रूप से इकट्ठा हुआ है।
  rationale: इब्रानी वाक्य पहले ‘याहवे के विरुद्ध’ सभा का वर्णन करता है और फिर ‘हारून है ही क्या’ पूछता है; इस क्रम और तनाव को अनुवाद में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ में सहज रखी गई है। ‘है ही क्या’ आलंकारिक तीखेपन को स्वाभाविक हिन्दी में व्यक्त करता है; ‘तुम सब’ मूल के बहुवचन कृदंत को स्पष्ट करता है।
