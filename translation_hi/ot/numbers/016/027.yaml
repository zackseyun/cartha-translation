source:
  edition: WLC
  text: וַ/יֵּעָל֗וּ מֵ/עַ֧ל מִשְׁכַּן קֹ֛רֶח דָּתָ֥ן וַ/אֲבִירָ֖ם מִ/סָּבִ֑יב וְ/דָתָ֨ן וַ/אֲבִירָ֜ם יָצְא֣וּ נִצָּבִ֗ים פֶּ֚תַח אָֽהֳלֵי/הֶ֔ם וּ/נְשֵׁי/הֶ֥ם וּ/בְנֵי/הֶ֖ם וְ/טַפָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/027.yaml
  text: So they moved away from around the dwelling of Korah[a], Dathan, and Abiram. And Dathan and Abiram came out, standing at the entrance of their tents, with their wives, their sons[b], and their little children.
translation:
  language: hi
  text: तब वे कोरह, दातान और अबीराम के निवासस्थान के आस-पास से हट गए।[a] दातान और अबीराम अपनी पत्नियों, अपने पुत्रों और अपने छोटे बच्चों समेत बाहर आए और अपने तंबुओं के द्वार पर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आस-पास से ऊपर चले गए।” यहाँ इब्रानी अभिव्यक्ति का अर्थ संभवतः उस स्थान से दूर हट जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּעָלוּ מֵעַל ... מִסָּבִיב
  choice: आस-पास से हट गए
  rationale: क्रिया का मूल अर्थ ‘ऊपर गए’ है, पर מֵעַל और מִסָּבִיב के साथ इस प्रसंग में क्षेत्र से दूर हटने का भाव है। स्वाभाविक हिन्दी में ‘हट गए’ इस स्थानिक अर्थ को स्पष्ट रखता है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִשְׁכַּן
  choice: निवासस्थान
  rationale: यहाँ शब्द यहोवा के पवित्र तंबू के लिए नहीं, बल्कि कोरह, दातान और अबीराम से जुड़े रहने या डेरा डालने के स्थान के लिए है। ‘निवासस्थान’ इस भेद को बनाए रखता है।
- source_word: יָצְאוּ נִצָּבִים
  choice: बाहर आए और ... खड़े हो गए
  rationale: יָצְאוּ बाहर निकलने और נִצָּבִים खड़े होने की मुद्रा बताता है। अनुवाद दोनों बातों को सहज हिन्दी क्रम में व्यक्त करता है और ‘डटकर खड़े हुए’ जैसा अतिरिक्त विरोधात्मक भाव नहीं जोड़ता।
- source_word: פֶּתַח אָֽהֳלֵיהֶם
  choice: अपने तंबुओं के द्वार पर
  rationale: बहुवचन אָֽהֳלֵיהֶם को ‘तंबुओं’ के रूप में सुरक्षित रखा गया है और פֶּתַח के लिए सहज, ठोस शब्द ‘द्वार’ चुना गया है।
- source_word: וּבְנֵיהֶם וְטַפָּם
  choice: अपने पुत्रों और अपने छोटे बच्चों
  rationale: בְנֵיהֶם को ‘पुत्रों’ और טַפָּם को ‘छोटे बच्चों’ के रूप में अलग रखा गया है, जिससे मूल पाठ का भेद और दृश्य की मार्मिकता दोनों बने रहते हैं।
theological_decisions:
- issue: מִשְׁכַּן का आशय
  choice: कोरह, दातान और अबीराम से जुड़ा ‘निवासस्थान’
  alternative: यहोवा का ‘पवित्र तंबू’
  rationale: नामों के साथ संबंध और निकटवर्ती प्रसंग इसे विद्रोहियों के निवास या छावनी का स्थान बताते हैं; इसे पवित्र तंबू कहना प्रसंग में एक धार्मिक अर्थ जोड़ देगा जो यहाँ अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘पत्नियों’, ‘पुत्रों’ और ‘छोटे बच्चों’ की अलग-अलग सूची मूल इब्रानी के पारिवारिक समूहों को सुरक्षित रखती है।
