source:
  edition: WLC
  text: הַ/מְעַ֗ט כִּ֤י הֶֽעֱלִיתָ֨/נוּ֙ מֵ/אֶ֨רֶץ זָבַ֤ת חָלָב֙ וּ/דְבַ֔שׁ לַ/הֲמִיתֵ֖/נוּ בַּ/מִּדְבָּ֑ר כִּֽי תִשְׂתָּרֵ֥ר עָלֵ֖י/נוּ גַּם הִשְׂתָּרֵֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/013.yaml
  text: Is it a small thing that you have brought us up out of a land flowing with milk and honey to kill us in the wilderness[b][a], that you should also make yourself a ruler over us?
translation:
  language: hi
  text: 'क्या यह छोटी बात है कि तू हमें दूध और मधु से बहनेवाले देश से निकाल लाया, ताकि हमें वीराने में मार डाले, और फिर हम पर प्रभुता भी जताए ही[a]?


    [a] बोलनेवाले व्यंग्यपूर्वक मिस्र को “दूध और मधु से बहनेवाला देश” कहते हैं; अन्यत्र यह भाषा प्रतिज्ञात देश के लिए प्रयुक्त होती है।

    [b] या, “हम पर हुकूमत ही चलाए?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: बोलनेवाले व्यंग्यपूर्वक मिस्र को “दूध और मधु से बहनेवाला देश” कहते हैं; अन्यत्र यह भाषा प्रतिज्ञात देश के लिए प्रयुक्त होती है।
    reason: cultural_note
  - marker: b
    text: या, “हम पर हुकूमत ही चलाए?”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: क्या यह छोटी बात है
  rationale: यह रोष और आरोप व्यक्त करने वाला आलंकारिक प्रश्न है; हिन्दी में यह अभिव्यक्ति उसके व्यंग्यपूर्ण बल को बनाए रखती है।
- source_word: הֶעֱלִיתָנוּ
  choice: तू हमें ... से निकाल लाया
  rationale: हिफ़ील रूप का मूल अर्थ ‘ऊपर ले आना’ है, पर मिस्र से निर्गमन के संदर्भ में स्वाभाविक हिन्दी ‘से निकाल लाया’ है; गति और मूसा पर लगाए गए आरोप दोनों सुरक्षित रहते हैं।
- source_word: מֵאֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: दूध और मधु की धाराएँ बहनेवाले देश से
  rationale: प्रचुरता का पारंपरिक बिंब ज्यों का त्यों रखा गया है। यहाँ इसे मिस्र के लिए कहना जानबूझकर व्यंग्यपूर्ण है।
- source_word: לַהֲמִיתֵנוּ
  choice: ताकि हमें ... मार डाले
  rationale: उद्देश्यसूचक infinitive को सीधे और आरोप की तीव्रता के अनुरूप व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר का अर्थ निर्जन, उजाड़ क्षेत्र है; ‘वीराना’ आधुनिक हिन्दी में स्वाभाविक है और केवल रेतीले मरुस्थल का अनावश्यक संकेत नहीं देता।
- source_word: תִשְׂתָּרֵר ... הִשְׂתָּרֵר
  choice: पूरी तरह प्रभुता भी जताएगा
  rationale: धातु शासन अथवा प्रभुत्व चलाने का भाव देती है। infinitive absolute की तीव्रता ‘पूरी तरह’ से व्यक्त की गई है, जबकि ‘प्रभुता जताना’ स्वयं को शासक मानकर व्यवहार करने के आरोप को संप्रेषित करता है।
- source_word: גַּם
  choice: भी
  rationale: यह पहले आरोप के साथ एक और शिकायत जोड़ता है।
theological_decisions:
- issue: मिस्र को ‘दूध और मधु की धाराएँ बहनेवाला देश’ कहना
  choice: मुख्य पाठ में इस वर्णन को अक्षरशः बनाए रखना
  alternative: मुख्य पाठ में स्पष्ट रूप से ‘व्यंग्य से’ अथवा ‘मानो’ जोड़ना
  rationale: व्यंग्य संदर्भ से प्रकट होता है; उसे पाठ में स्पष्ट करके जोड़ना मूल से अधिक व्याख्या करना होता और विद्रोहियों के विकृत आरोप की धार घटा देता।
- issue: שׂרר के दोहरे प्रयोग की तीव्रता
  choice: ‘पूरी तरह प्रभुता ... जताएगा’
  alternative: सिर्फ ‘हम पर शासन करेगा’
  rationale: finite verb के साथ infinitive absolute आरोप को तीव्र करता है; इसलिए साधारण शासन के कथन के बजाय बलयुक्त अभिव्यक्ति रखी गई है।
translation_notes:
  register: आरोप लगाने वाले व्यक्तियों के मूसा से सीधे और तिरस्कारपूर्ण संबोधन के अनुरूप एकवचन ‘तू’ रखा गया है। भाषा आधुनिक, स्पष्ट और गरिमापूर्ण है; ‘धाराएँ बहनेवाला’ बाइबलीय बिंब को स्वाभाविक हिन्दी में सुरक्षित रखता है।
