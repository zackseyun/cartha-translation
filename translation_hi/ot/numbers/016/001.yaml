source:
  edition: WLC
  text: וַ/יִּקַּ֣ח קֹ֔רַח בֶּן יִצְהָ֥ר בֶּן קְהָ֖ת בֶּן לֵוִ֑י וְ/דָתָ֨ן וַ/אֲבִירָ֜ם בְּנֵ֧י אֱלִיאָ֛ב וְ/א֥וֹן בֶּן פֶּ֖לֶת בְּנֵ֥י רְאוּבֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/001.yaml
  text: Korah son of Izhar[a], son of Kohath, son of Levi, along with Dathan and Abiram, sons of Eliab, and On son of Peleth, sons of Reuben, took men,
translation:
  language: hi
  text: लेवी के पुत्र कहात के पुत्र यिसहार का पुत्र कोरह, एलीआब के पुत्र दातान और अबीराम तथा पेलेत के पुत्र ओन—जो रूबेन के वंशज थे—के साथ लोगों को[a] ले लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप ‘और उसने लिया’ है; उसका कर्म नहीं बताया गया है। ‘लोगों को’ अगले पद के संदर्भ से स्पष्टता के लिए जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: कुछ लोगों को अपने साथ लिया
  rationale: मूल क्रिया का अर्थ ‘लेना’ है, पर उसका कर्म इब्रानी पाठ में व्यक्त नहीं है। अगले पद में उल्लिखित 250 पुरुषों के संदर्भ के आधार पर ‘कुछ लोगों को’ जोड़ा गया है; ‘अपने साथ लिया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल क्रिया के निकट है।
- source_word: קֹרַח
  choice: कोरह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן יִצְהָר בֶּן קְהָת בֶּן לֵוִי
  choice: लेवी के पुत्र कहात के पुत्र यिसहार के पुत्र
  rationale: वंशावली की क्रमिक शृंखला और इब्रानी में ‘पुत्र’ की पुनरावृत्ति को सुरक्षित रखा गया है। हिन्दी में संबंधों को स्पष्ट करने के लिए क्रम स्वाभाविक रूप से उलटता है।
- source_word: וְדָתָן וַאֲבִירָם בְּנֵי אֱלִיאָב
  choice: और ... एलीआब के पुत्र दातान और अबीराम
  rationale: दोनों व्यक्तियों को इस कार्य में कोरह के साथ सहभागी दिखाते हुए उनके पिता का संबंध स्पष्ट रखा गया है।
- source_word: וְאוֹן בֶּן פֶּלֶת
  choice: तथा पेलेत के पुत्र ओन
  rationale: व्यक्तिनामों और पिता-पुत्र संबंध का सीधा, स्वाभाविक हिन्दी रूप।
- source_word: בְּנֵי רְאוּבֵן
  choice: रूबेन के वंशज
  rationale: यह बहुवचन पद दातान, अबीराम और ओन को रूबेन की वंश-रेखा से जोड़ता है। यहाँ ‘वंशज’ हिन्दी में अधिक स्पष्ट है, क्योंकि वे रूबेन के प्रत्यक्ष पुत्र नहीं थे।
theological_decisions:
- issue: आरंभिक क्रिया का अव्यक्त कर्म
  choice: संदर्भ के आधार पर ‘कुछ लोगों को’ जोड़ना और इसे पादटिप्पणी से चिह्नित करना
  alternative: केवल ‘ले लिया’ कहना, अथवा अधिक व्याख्यात्मक रूप से ‘गुट बनाया/विद्रोह किया’ कहना
  rationale: इब्रानी पाठ कर्म को अनकहा छोड़ता है। पद 2 के पुरुष संभावित कर्म हैं, किंतु पाठ इसे स्पष्ट रूप से नहीं कहता; इसलिए सहज हिन्दी के लिए सीमित पूर्ति की गई है और वास्तविक अस्पष्टता पादटिप्पणी में बताई गई है। ‘विद्रोह किया’ कथानक की व्याख्या को क्रिया में ही जोड़ देता।
- issue: בְּנֵי רְאוּבֵן का संबंध
  choice: दातान, अबीराम और ओन को रूबेन के वंशज बताना
  alternative: ‘रूबेन के पुत्र’ का अक्षरशः रूप
  rationale: इब्रानी बहुवचन वंशगत पहचान बताता है। ‘वंशज’ आधुनिक पाठक को यह भ्रम होने से बचाता है कि ये तीनों रूबेन के प्रत्यक्ष पुत्र थे, जबकि वंश-संबंध का आशय सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। वंशावली का औपचारिक क्रम सुरक्षित है, जबकि वाक्य-विन्यास हिन्दी के अनुरूप बनाया गया है।
