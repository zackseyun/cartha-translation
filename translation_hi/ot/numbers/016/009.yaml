source:
  edition: WLC
  text: הַ/מְעַ֣ט מִ/כֶּ֗ם כִּֽי הִבְדִּיל֩ אֱלֹהֵ֨י יִשְׂרָאֵ֤ל אֶתְ/כֶם֙ מֵ/עֲדַ֣ת יִשְׂרָאֵ֔ל לְ/הַקְרִ֥יב אֶתְ/כֶ֖ם אֵלָ֑י/ו לַ/עֲבֹ֗ד אֶת עֲבֹדַת֙ מִשְׁכַּ֣ן יְהוָ֔ה וְ/לַ/עֲמֹ֛ד לִ/פְנֵ֥י הָ/עֵדָ֖ה לְ/שָׁרְתָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/009.yaml
  text: Is it too small a thing for you that the God of Israel has separated you from the congregation of Israel[a], to bring you near to himself, to serve in the service of the tabernacle of Yahweh, and to stand before the congregation to minister to them?
translation:
  language: hi
  text: क्या तुम्हारे लिए यह छोटी बात है[a] कि इस्राएल के परमेश्वर ने तुम्हें इस्राएल की मंडली से अलग किया है—तुम्हें अपने निकट लाने के लिए, याहवे के निवास-स्थान की सेवा करने के लिए, और मंडली के सामने खड़े होकर उनकी सेवा करने के लिए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या यह तुम्हारे लिए पर्याप्त नहीं है?” इब्रानी मुहावरे को दोनों प्रकार से व्यक्त किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְעַט
  choice: क्या तुम्हारी दृष्टि में यह छोटी बात है
  rationale: यह प्रश्नवाचक मुहावरा मिले हुए विशेषाधिकार को तुच्छ समझने पर उलाहना देता है। यह रूप इब्रानी की आलंकारिक शक्ति बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ यह सीधे कारण बताने के बजाय प्रश्न की विषय-वस्तु का परिचय देता है।
- source_word: הִבְדִּיל
  choice: अलग किया
  rationale: हिफ़ील रूप किसी को दूसरे समूह से पृथक करने का भाव देता है; यह अनावश्यक रूप से धार्मिक अर्थ जोड़े बिना सीधा अर्थ रखता है।
- source_word: עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की मंडली
  rationale: עֵדָה संगठित या एकत्र समुदाय को दर्शाता है; ‘मंडली’ सामुदायिक और उपासना-संबंधी दोनों संदर्भों में सुबोध है।
- source_word: לְהַקְרִיב אֶתְכֶם אֵלָיו
  choice: वह तुम्हें अपने निकट लाए
  rationale: קרב का यहाँ कर्म स्वयं लेवी हैं। ‘अपने निकट लाए’ संबंधपरक और पवित्र-सेवा संबंधी अर्थ को बचाता है, पर उन्हें बलि के रूप में प्रस्तुत नहीं करता।
- source_word: לַעֲבֹד אֶת עֲבֹדַת מִשְׁכַּן יְהוָה
  choice: याहवे के पवित्र निवास की सेवा का काम करो
  rationale: क्रिया עבד और उसी मूल की संज्ञा עֲבֹדָה के बल को ‘सेवा का काम’ से व्यक्त किया गया है। ‘पवित्र निवास’ जंगल के उपासना-स्थान के रूप में מִשְׁכָּן को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत नाम स्पष्ट रूप से आया है; हिन्दी लिप्यंतरण ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: וְלַעֲמֹד לִפְנֵי הָעֵדָה
  choice: मंडली के सामने खड़े होकर
  rationale: यह एकत्र समुदाय के समक्ष सेवा की औपचारिक स्थिति को सीधे रूप में व्यक्त करता है।
- source_word: לְשָׁרְתָם
  choice: उनकी सेवा करो
  rationale: שרת परिचर्या अथवा आधिकारिक सेवा को दर्शाता है। आधुनिक हिन्दी में ‘उनकी सेवा करो’ स्पष्ट है और बहुवचन प्रत्यय को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: लेवियों को परमेश्वर के निकट लाने का भाव
  choice: वह तुम्हें अपने निकट लाए
  alternative: वह तुम्हें अपने सामने अर्पित करे
  rationale: קרב का पवित्र-सेवा संबंधी अर्थ है, किंतु इस वाक्य में लेवी स्वयं कर्म हैं। चुना हुआ रूप निकटता और नियुक्ति का भाव रखता है, पर बलिदान का ऐसा अर्थ नहीं जोड़ता जो पाठ में अनिवार्य नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज शैली रखी गई है। ‘मंडली’, ‘पवित्र निवास’ और ‘सेवा का काम’ धार्मिक संदर्भ को स्पष्ट रखते हैं, जबकि अत्यधिक संस्कृतनिष्ठ भाषा से बचते हैं।
