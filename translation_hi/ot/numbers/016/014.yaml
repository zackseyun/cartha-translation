source:
  edition: WLC
  text: אַ֡ף לֹ֣א אֶל אֶרֶץ֩ זָבַ֨ת חָלָ֤ב וּ/דְבַשׁ֙ הֲבִ֣יאֹתָ֔/נוּ וַ/תִּ֨תֶּן לָ֔/נוּ נַחֲלַ֖ת שָׂדֶ֣ה וָ/כָ֑רֶם הַ/עֵינֵ֞י הָ/אֲנָשִׁ֥ים הָ/הֵ֛ם תְּנַקֵּ֖ר לֹ֥א נַעֲלֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/014.yaml
  text: Indeed[a], you have not brought us into a land flowing with milk and honey, nor have you given us an inheritance of fields and vineyards. Will you gouge out the eyes of these men? We will not come up.
translation:
  language: hi
  text: सच तो यह है कि तुम हमें न तो दूध और मधु की धाराएँ बहने वाले देश में लाए, न ही तुमने हमें खेतों और दाख की बारियों की विरासत दी। क्या तुम इन लोगों की आँखें फोड़ोगे[a]? हम ऊपर नहीं आएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम इन लोगों को अंधा कर दोगे?” इब्रानी में शाब्दिक अभिव्यक्ति “आँखें फोड़ना” है; इसका संकेत उन्हें ऐसा समझने या उनके साथ ऐसा व्यवहार करने की ओर भी हो सकता है मानो वे सच्चाई देख ही न सकते हों।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַף לֹא
  choice: सच तो यह है कि ... न तो
  rationale: यह पदबंध शिकायत को बल देता है। यह अनुवाद उसके जोर और निषेध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל אֶרֶץ זָבַת חָלָב וּדְבַשׁ
  choice: दूध और मधु की धाराएँ बहने वाले देश में
  rationale: यह इब्रानी मुहावरा देश की भरपूरी बताता है; हिन्दी में प्रचलित बाइबलीय अभिव्यक्ति को बनाए रखा गया है।
- source_word: הֲבִיאֹתָנוּ
  choice: तुम हमें ... नहीं लाए
  rationale: रूप प्रश्नसूचक है, पर शिकायत के भीतर इसका बल आरोपात्मक है; हिन्दी में कथनात्मक रूप वही आशय स्पष्ट करता है।
- source_word: וַתִּתֶּן לָנוּ נַחֲלַת שָׂדֶה וָכָרֶם
  choice: न ही तुमने हमें खेतों और दाख की बारियों का भाग दिया
  rationale: נַחֲלָה आवंटित या पैतृक अधिकार के भाग को दर्शाता है। सामूहिक एकवचन 'खेत और दाख की बारी' को स्वाभाविक हिन्दी में बहुवचन किया गया है।
- source_word: הַעֵינֵי הָאֲנָשִׁים הָהֵם תְּנַקֵּר
  choice: क्या तुम इन लोगों की आँखें फोड़ दोगे?
  rationale: נקר के पिएल रूप की ठोस और तीखी छवि को सुरक्षित रखा गया है; इसका आशय सचाई से अंधा कर देने या छलने का भी हो सकता है।
- source_word: לֹא נַעֲלֶה
  choice: हम ऊपर नहीं आएँगे
  rationale: עלה का मूल अर्थ ऊपर जाना/आना है। मूसा के बुलावे को अस्वीकार करते हुए वक्ताओं की दिशा-दृष्टि के अनुसार 'ऊपर नहीं आएँगे' उपयुक्त है।
