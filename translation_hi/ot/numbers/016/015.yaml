  text: וַ/יִּ֤חַר לְ/מֹשֶׁה֙ מְאֹ֔ד וַ/יֹּ֨אמֶר֙ אֶל יְהוָ֔ה אַל תֵּ֖פֶן אֶל מִנְחָתָ֑/ם לֹ֠א חֲמ֨וֹר אֶחָ֤ד מֵ/הֶם֙ נָשָׂ֔אתִי וְ/לֹ֥א הֲרֵעֹ֖תִי אֶת אַחַ֥ד מֵ/הֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/015.yaml
  text: Then Moses became very angry and said to Yahweh, “Do not turn toward their offering. I have not taken a single donkey from them, nor have I harmed any one of them.”
translation:
  language: hi
  text: तब मूसा को बहुत क्रोध आया और उसने याहवे से कहा, “उनकी भेंट की ओर ध्यान न देना।[a] मैंने उनसे एक गधा तक नहीं लिया और न उनमें से किसी को हानि पहुँचाई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उनकी भेंट की ओर न फिरना।” इसका अर्थ “उनकी भेंट पर कृपादृष्टि न करना” या “उनकी भेंट स्वीकार न करना” भी हो सकता है।'
    reason: मूल हिब्रू रूपक और उसके संभावित प्रार्थनात्मक अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּחַר לְמֹשֶׁה מְאֹד
  choice: मूसा को बहुत क्रोध आया
  rationale: यह हिब्रू मुहावरे में क्रोध भड़कने को व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से तीव्रता सहित अर्थ देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אַל תֵּפֶן אֶל מִנְחָתָם
  choice: उनकी भेंट की ओर ध्यान न देना
  rationale: पנה אל का मूल बिंब किसी ओर फिरने या ध्यान देने का है और यहाँ अनुकूल दृष्टि अथवा स्वीकार करने का भाव भी संभव है; हिंदी वाक्य मूल रूपक और प्रार्थनात्मक आशय दोनों को पर्याप्त खुला रखता है।
- source_word: מִנְחָתָם
  choice: उनकी भेंट
  rationale: מִנְחָה भेंट, चढ़ावा या उपहार हो सकता है; केवल ‘अन्नबलि’ कहना प्रसंग से अधिक विशिष्ट होगा।
- source_word: לֹא חֲמוֹר אֶחָד מֵהֶם נָשָׂאתִי
  choice: मैंने उनसे एक गधा तक नहीं लिया
  rationale: यह मूसा द्वारा किसी प्रकार के भौतिक शोषण से इनकार को ठोस और स्वाभाविक हिंदी में व्यक्त करता है; ‘तक’ एक भी गधा न लेने के बल को बनाए रखता है।
- source_word: וְלֹא הֲרֵעֹתִי אֶת אַחַד מֵהֶם
  choice: न उनमें से किसी का बुरा किया है
  rationale: רעע के हिफ़ील रूप का अर्थ किसी को हानि पहुँचाना या उसके साथ बुरा करना है; यह चयन नैतिक और व्यावहारिक दोनों प्रकार की हानि को समेटता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसका प्रत्यक्ष देवनागरी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: भेंट की ओर ध्यान न देने का अर्थ
  choice: उनकी भेंट की ओर ध्यान न देना
  alternative: उनकी भेंट स्वीकार न करना
  rationale: मूल अभिव्यक्ति में ‘ओर फिरने/ध्यान देने’ का रूपक है, जिससे अनुकूल दृष्टि या स्वीकार का आशय निकल सकता है। मुख्य पाठ व्यापक अर्थ रखता है और पादटिप्पणी संभावित अर्थ स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘एक गधा तक’ मूसा के स्पष्ट और ठोस आत्मपक्ष को प्रभावी ढंग से व्यक्त करता है; ईश्वरीय नाम ‘याहवे’ के रूप में रखा गया है।
