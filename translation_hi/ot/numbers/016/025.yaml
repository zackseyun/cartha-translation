  text: Then Moses rose and went to Dathan and Abiram[a], and the elders of Israel went after him.
translation:
  language: hi
  text: तब मूसा उठकर दातान और अबीराम के पास गया, और इस्राएल के बुज़ुर्ग उसके पीछे-पीछे गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठकर
  rationale: קום का क्रमिक कथात्मक रूप यहाँ किसी कार्य के लिए उठने को व्यक्त करता है; हिंदी में अगले क्रियापद के साथ ‘उठकर’ स्वाभाविक और संक्षिप्त है।
- source_word: וַיֵּלֶךְ
  choice: गया
  rationale: הלך का सामान्य अर्थ ‘जाना/चलना’ है; प्रसंग में ‘गया’ सहज कथात्मक रूप है और चलने की रीति को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: אֶל
  choice: के पास
  rationale: व्यक्तियों की ओर जाकर उनके निकट पहुँचने के भाव के लिए आधुनिक हिंदी में ‘के पास’ स्वाभाविक है।
- source_word: דָּתָן וַאֲבִירָם
  choice: दातान और अबीराम
  rationale: व्यक्तिवाचक नामों का मानक हिंदी लिप्यंतरण किया गया है।
- source_word: וַיֵּלְכוּ אַחֲרָיו
  choice: उसके पीछे-पीछे गए
  rationale: הלך और אַחֲרָיו दोनों को बनाए रखते हुए यह पदबंध मूसा के पीछे चलने का दृश्य स्वाभाविक हिंदी में व्यक्त करता है; केवल ‘उसके पीछे हो लिए’ की अपेक्षा यह इब्रानी संरचना के अधिक निकट है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनिये
  rationale: यह पद इस्राएल के मान्य वरिष्ठ अगुओं को सूचित करता है; ‘पुरनिये’ बाइबलीय संदर्भ में परिचित, संक्षिप्त और गरिमापूर्ण हिंदी पद है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव कथा की अगली क्रमिक घटना को आगे बढ़ाता है; ‘तब’ आधुनिक हिंदी में इस अनुक्रम को स्पष्ट करता है।
