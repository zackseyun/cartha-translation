lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है और यहाँ वाणी के आरम्भ का संकेत देता है। हिन्दी में ‘ने…कहा’ इस सूत्र का स्वाभाविक और स्पष्ट रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: मूसा से और हारून से
  rationale: दोनों व्यक्तियों के साथ दोहराए गए אֶל को ‘से’ दोहराकर रखा गया है, जिससे दोनों अलग-अलग संबोधित व्यक्तियों का समन्वय बना रहता है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: यह रूप आगे आने वाले प्रत्यक्ष कथन का पारंपरिक परिचायक है। हिन्दी में ‘कहा:’ वַיְדַבֵּר…לֵאמֹר की संयुक्त भूमिका को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता; पादटिप्पणी पाठक को इब्रानी वर्तनी और हिन्दी के वैकल्पिक पारंपरिक रूप से अवगत कराती है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दोहराए गए ‘से’ द्वारा इब्रानी समन्वय सुरक्षित है; अन्त का द्विबिंदु अगले पद में आने वाले प्रत्यक्ष कथन की ओर संकेत करता है।
