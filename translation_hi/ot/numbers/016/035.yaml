  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֵ֥שׁ יָצְאָ֖ה מֵ/אֵ֣ת יְהוָ֑ה וַ/תֹּ֗אכַל אֵ֣ת הַ/חֲמִשִּׁ֤ים וּ/מָאתַ֨יִם֙ אִ֔ישׁ מַקְרִיבֵ֖י הַ/קְּטֹֽרֶת׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/035.yaml
  text: And fire came out from Yahweh and consumed the two hundred and fifty men who were offering the incense[a].
translation:
  language: hi
  text: और याहवे की ओर से आग निकली, और उसने धूप चढ़ानेवाले उन दो सौ पचास पुरुषों को भस्म कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אֵשׁ
  choice: तब ... आग
  rationale: אֵשׁ का अर्थ ‘आग’ है। आरंभिक וְ कथानक की अगली घटना को जोड़ता है; आधुनिक हिन्दी में ‘तब’ क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָצְאָה
  choice: निकली
  rationale: יצא का अर्थ ‘निकलना’ है; स्त्रीलिंग कर्ता ‘आग’ के साथ ‘निकली’ स्वाभाविक है।
- source_word: מֵ/אֵת יְהוָה
  choice: यहोवा के सामने से
  rationale: מֵאֵת स्रोत के साथ उपस्थिति/सामने होने की छाया भी रख सकता है। ‘यहोवा के सामने से’ औपचारिक अर्थ को सुरक्षित रखता है और प्रसंग में दैवी उपस्थिति से आग निकलने को व्यक्त करता है।
- source_word: וַ/תֹּאכַל
  choice: और उसने ... भस्म कर दिया
  rationale: आग कर्ता होने पर אכל का मुहावरेदार अर्थ ‘भस्म कर देना/नष्ट कर देना’ है। ‘भस्म कर दिया’ हिन्दी में आग द्वारा पूर्ण विनाश को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: הַ/חֲמִשִּׁים וּ/מָאתַיִם אִישׁ
  choice: उन दो सौ पचास पुरुषों को
  rationale: यह पदबंध गिने हुए 250 पुरुषों को दर्शाता है। ‘उन’ प्रसंग में पहले से पहचाने गए समूह की निश्चितता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: מַקְרִיבֵי הַ/קְּטֹרֶת
  choice: धूप चढ़ानेवाले
  rationale: קרב का हिफ़ील कृदन्त यहाँ अर्पित करने की क्रिया बताता है और קְטֹרֶת धार्मिक धूप है। संयुक्त रूप हिन्दी में संक्षिप्त तथा स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है।
- issue: מֵאֵת में स्रोत और उपस्थिति की अर्थ-छाया
  choice: यहोवा के सामने से
  alternative: यहोवा की ओर से
  rationale: ‘के सामने से’ दैवी उपस्थिति से आग निकलने की अधिक औपचारिक अर्थ-छाया बचाता है; ‘की ओर से’ स्रोत/कर्ता को अधिक मुहावरेदार ढंग से व्यक्त करता, पर उपस्थिति की छाया घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण कथात्मक शैली। ‘धूप चढ़ानेवाले’ सामान्य पाठक के लिए सहज है और उपासना-संबंधी प्रसंग बनाए रखता है।
