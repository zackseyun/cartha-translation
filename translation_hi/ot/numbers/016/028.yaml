  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ מֹשֶׁה֒ בְּ/זֹאת֙ תֵּֽדְע֔וּ/ן כִּֽי יְהוָ֣ה שְׁלָחַ֔/נִי לַ/עֲשׂ֕וֹת אֵ֥ת כָּל הַֽ/מַּעֲשִׂ֖ים הָ/אֵ֑לֶּה כִּי לֹ֖א מִ/לִּבִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/028.yaml
  text: And Moses said[a], “By this you will know that Yahweh has sent me to do all these deeds[b], for it was not from my own heart.”
translation:
  language: hi
  text: तब मूसा ने कहा, “इससे तुम जान लोगे कि याहवे ने मुझे ये सब काम करने के लिए भेजा है, और कि मैंने ये सब काम अपने मन से नहीं किए हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר מֹשֶׁה
  choice: तब मूसा ने कहा
  rationale: कथात्मक वय्यिक्तोल को स्वाभाविक हिन्दी क्रम में व्यक्त करता है; ‘तब’ प्रसंग की प्रगति दिखाता है, बिना अनावश्यक अर्थ जोड़े।
- source_word: בְּזֹאת
  choice: इससे
  rationale: करणवाचक בְּ और आगे होनेवाली प्रमाणकारी घटना की ओर संकेत—दोनों को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: תֵּדְעוּן
  choice: तुम जान लोगे
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण क्रिया का प्रसंगानुकूल भविष्य अर्थ स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत करता है, न कि उपाधि से।
- source_word: שְׁלָחַנִי
  choice: ने मुझे ... भेजा है
  rationale: पूर्ण की गई नियुक्ति की वर्तमान प्रासंगिकता को हिन्दी पूर्ण वर्तमान से व्यक्त करता है।
- source_word: לַעֲשׂוֹת אֵת כָּל הַמַּעֲשִׂים הָאֵלֶּה
  choice: ये सब काम करने के लिए
  rationale: מַעֲשִׂים के कार्य/कृत्य संबंधी व्यापक अर्थ को साधारण और गरिमापूर्ण हिन्दी में रखता है।
- source_word: כִּי לֹא מִלִּבִּי
  choice: और यह कि यह मेरे अपने मन से नहीं हुआ
  rationale: दूसरे כִּי को ‘जान लोगे’ पर आश्रित अतिरिक्त विषय-वाक्य मानता है और ‘मेरे हृदय से नहीं’ मुहावरे का आशय स्वप्रेरणा या स्वयं के अधिकार से न होना बताता है, जबकि मूल की मानसिक-अंतःप्रेरणा वाली छवि को ‘मन’ में बनाए रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी बाइबल-पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम की विशिष्टता बनाए रखता है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: दूसरे כִּי का वाक्यगत संबंध
  choice: ‘और यह कि’—जानने की दूसरी विषयवस्तु
  alternative: ‘क्योंकि’—पिछले कथन का कारण
  rationale: इब्रानी दोनों संभावनाएँ सह सकता है। यहाँ समानांतर रूप से यह जाना जाएगा कि यहोवा ने मूसा को भेजा और ये कार्य मूसा के अपने मन से नहीं थे; यह रचना संदर्भ में स्पष्ट और स्वाभाविक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सीधी, मौखिक घोषणा की गरिमा बनाए रखी गई है। ‘काम’ सामान्य पाठक के लिए सहज है, और ‘अपने मन से’ मूल इब्रानी मुहावरे के आशय को प्राकृतिक हिन्दी में व्यक्त करता है।
