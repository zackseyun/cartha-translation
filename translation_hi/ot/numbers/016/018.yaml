base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/018.yaml
  text: So each man took his firepan[a], and they put fire in them and put incense on them, and they stood at the entrance of the tent of meeting, with Moses and Aaron.
translation:
  language: hi
  text: तब हर एक व्यक्ति ने अपना धूपदान[a] लिया। उन्होंने अपने-अपने धूपदानों में आग रखी और उन पर धूप डाली। फिर वे मूसा और हारून के साथ मिलाप के तंबू के प्रवेश-द्वार पर खड़े हो गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अग्निपात्र’। इब्रानी शब्द ऐसे पात्र को दर्शाता है जिसमें धूप चढ़ाने के लिए जलते अंगारे रखे जाते थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ מַחְתָּתוֹ
  choice: हर एक व्यक्ति ने अपना धूपदान
  rationale: אִישׁ यहाँ समूह के प्रत्येक सदस्य को अलग-अलग दर्शाता है और एकवचन संबंधसूचक रूप बताता है कि हर व्यक्ति अपना पात्र लाया। מַחְתָּה जलते अंगारे रखने और धूप चढ़ाने में प्रयुक्त पात्र है; ‘धूपदान’ आधुनिक हिन्दी में इसका सहज और परिचित नाम है।
- source_word: וַיִּתְּנוּ עֲלֵיהֶם אֵשׁ
  choice: उन्होंने अपने-अपने धूपदान में आग रखी
  rationale: עַל का शाब्दिक अर्थ ‘पर’ है, पर पात्र के संदर्भ में हिन्दी में ‘में आग रखी’ स्वाभाविक है। ‘अपने-अपने’ इब्रानी बहुवचन और प्रत्येक व्यक्ति के अलग पात्र को स्पष्ट करता है।
- source_word: וַיָּשִׂימוּ עֲלֵיהֶם קְטֹרֶת
  choice: और उस पर धूप डाली
  rationale: धूप जलते अंगारों पर रखी जाती थी; एकवचन ‘उस पर’ प्रत्येक धूपदान में रखी आग को वितरणात्मक रूप से व्यक्त करता है और क्रिया की स्वाभाविक हिन्दी देता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: आराधना में जलाई जाने वाली सुगंधित सामग्री के लिए यह मानक और सामान्य हिन्दी शब्द है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलाप के तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח का अर्थ खुला स्थान, द्वार या प्रवेश है। ‘प्रवेश-द्वार’ स्थान को स्पष्ट करता है, और ‘मिलाप का तंबू’ אֹהֶל מוֹעֵד के लिए परिचित धार्मिक पदावली को सहज आधुनिक रूप में प्रस्तुत करता है।
- source_word: וּמֹשֶׁה וְאַהֲרֹן
  choice: मूसा और हारून के साथ
  rationale: स्थानवाचक वाक्यांश के बाद जोड़ा गया यह पद स्वाभाविक रूप से बताता है कि मूसा और हारून भी उनके साथ वहीं खड़े थे। ‘के साथ’ हिन्दी में इस संबंध को स्पष्ट करता है।
