translation:
  language: hi
  text: जैसे ही उसने ये सारी बातें कहना समाप्त किया, उनके नीचे की भूमि फट गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלֹּתוֹ לְדַבֵּר
  choice: जैसे ही वह ... कह चुका
  rationale: यह रचना घटना के तुरंत बाद घटने का भाव देती है; ‘जैसे ही’ उस तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דְּבָרִים यहाँ मूसा द्वारा अभी कही गई बातों को सूचित करता है; ‘बातें’ प्रसंगानुकूल और सहज है।
- source_word: הָאֲדָמָה אֲשֶׁר תַּחְתֵּיהֶם
  choice: उनके नीचे की भूमि
  rationale: אֲדָמָה को ‘भूमि’ कहना गरिमापूर्ण और स्पष्ट है, और सम्बन्धवाचक पदबंध को संक्षिप्त स्वाभाविक हिन्दी में रखा गया है।
- source_word: וַתִּבָּקַע
  choice: फट गई
  rationale: निफ़अल रूप भूमि के स्वयं चिरकर खुल जाने को बताता है; ‘फट गई’ उसका सीधा और स्वाभाविक अनुवाद है।
