  text: וְ/אִם בְּרִיאָ֞ה יִבְרָ֣א יְהוָ֗ה וּ/פָצְתָ֨ה הָ/אֲדָמָ֤ה אֶת פִּ֨י/הָ֙ וּ/בָלְעָ֤ה אֹתָ/ם֙ וְ/אֶת כָּל אֲשֶׁ֣ר לָ/הֶ֔ם וְ/יָרְד֥וּ חַיִּ֖ים שְׁאֹ֑לָ/ה וִֽ/ידַעְתֶּ֕ם כִּ֧י נִֽאֲצ֛וּ הָ/אֲנָשִׁ֥ים הָ/אֵ֖לֶּה אֶת יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/030.yaml
  text: But if Yahweh creates something new[a], and the ground opens its mouth and swallows them and all that belongs to them, and they go down alive to Sheol[b], then you will know that these men have despised Yahweh.
translation:
  language: hi
  text: परन्तु यदि याहवे कोई अनोखा सृजन करे[a], और भूमि अपना मुँह खोलकर उन्हें और उनका सब कुछ निगल जाए, और वे जीवित ही शिओल में उतर जाएँ[b], तो तुम जान लोगे कि इन आदमियों ने याहवे का तिरस्कार किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई नई बात उत्पन्न करे” अथवा “एक सृष्टि रचे।” हिब्रू में एक ही मूल से बनी संज्ञा और क्रिया साथ प्रयुक्त हैं, जो परमेश्वर के असाधारण सृजनात्मक कार्य पर बल देती हैं।
    reason: lexical_alternative
  - marker: b
    text: “शिओल” मृतकों के लोक के लिए हिब्रू शब्द है; अधिक ठोस अर्थ में इसका अनुवाद “कब्र” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּרִיאָה יִבְרָא
  choice: कोई अनोखी सृष्टि करे
  rationale: संज्ञा और उसी मूल की क्रिया के हिब्रू शब्दालंकार को हिंदी में ‘सृष्टि करे’ द्वारा यथासंभव बनाए रखा गया है; ‘अनोखी’ इस प्रसंग में असाधारण और नई घटना का भाव व्यक्त करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
- source_word: וּפָצְתָה הָאֲדָמָה אֶת־פִּיהָ
  choice: भूमि अपना मुँह खोलकर
  rationale: אֲדָמָה के लिए ‘भूमि’ और मूल की मानवीकरणयुक्त छवि ‘अपना मुँह खोलना’ सुरक्षित रखी गई है।
- source_word: וּבָלְעָה
  choice: निगल जाए
  rationale: क्रिया בלע का सीधा और स्वाभाविक हिंदी अर्थ है, जो भूमि के मुँह की छवि के अनुरूप है।
- source_word: כָּל אֲשֶׁר לָהֶם
  choice: उनका सब कुछ
  rationale: मूल पदबंध के व्यापक आशय को बिना यह तय किए व्यक्त करता है कि इसमें केवल संपत्ति है या उससे अधिक।
- source_word: וְיָרְדוּ חַיִּים שְׁאֹלָה
  choice: वे जीवित ही अधोलोक में उतर जाएँ
  rationale: ‘जीवित ही’ मूल के जोर को बनाए रखता है; ‘अधोलोक’ मृतकों के लोक के व्यापक अर्थ को ‘कब्र’ की अपेक्षा बेहतर सुरक्षित रखता है।
- source_word: וִידַעְתֶּם
  choice: तो तुम जान लोगे
  rationale: शर्त और उसके निष्कर्ष का संबंध स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: נִאֲצוּ
  choice: तिरस्कार किया है
  rationale: נאץ में निहित अवमानना और घृणापूर्ण अस्वीकार का प्रबल भाव व्यक्त करता है।
- source_word: הָאֲנָשִׁים הָאֵלֶּה
  choice: इन पुरुषों
  rationale: हिब्रू के स्पष्ट पुल्लिंग बहुवचन को सामान्यीकृत किए बिना बनाए रखता है।
theological_decisions:
- issue: שְׁאוֹל का अनुवाद
  choice: अधोलोक
  alternative: शिओल; कब्र; मृतकों का लोक
  rationale: ‘अधोलोक’ हिंदी पाठक के लिए बोधगम्य रहते हुए किसी एक कब्र से अधिक व्यापक मृतक-लोक का संकेत देता है। पादटिप्पणी मूल हिब्रू शब्द और वैकल्पिक ठोस अर्थ को सुरक्षित रखती है।
- issue: בְּרִיאָה יִבְרָא में सृजनात्मक कार्य का स्वरूप
  choice: कोई अनोखी सृष्टि करे
  alternative: कोई नई बात उत्पन्न करे; एक सृष्टि रचे
  rationale: यह चयन संज्ञा-क्रिया की पुनरुक्ति और ईश्वरीय असाधारण कार्य—दोनों को यथासंभव बनाए रखता है, बिना घटना की प्रकृति को मूल से अधिक निश्चित किए।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। ‘परन्तु’, ‘भूमि’, ‘अधोलोक’ और ‘तिरस्कार’ औपचारिकता बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठकों के लिए स्पष्ट है।
