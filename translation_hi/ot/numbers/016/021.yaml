base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/021.yaml
  text: Separate yourselves from the midst of this congregation[b][a], that I may consume them in an instant.
translation:
  language: hi
  text: “इस मंडली के बीच से अलग हो जाओ[a], ताकि मैं इन्हें क्षण भर में[b] नष्ट कर दूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस सभा के बीच से अलग हो जाओ।”
    reason: lexical_alternative
  - marker: b
    text: या, “एक ही पल में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִבָּדְלוּ
  choice: अलग हो जाओ
  rationale: निफ़अल आज्ञार्थक बहुवचन यहाँ स्वयं को समूह से पृथक करने की आज्ञा देता है; यह चयन उस आत्मवाचक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִתּוֹךְ
  choice: के बीच से
  rationale: यह पद किसी समूह के भीतर से बाहर अलग होने का स्थानिक भाव रखता है; ‘के बीच से’ उस भाव को स्पष्ट और सहज रूप में बनाए रखता है।
- source_word: הָעֵדָה הַזֹּאת
  choice: इस मण्डली
  rationale: עֵדָה यहाँ एकत्र इस्राएली समुदाय को दर्शाता है। ‘मण्डली’ पंचग्रन्थीय सामुदायिक अर्थ के लिए उपयुक्त और आधुनिक हिन्दी में परिचित है।
- source_word: וַאֲכַלֶּה
  choice: ताकि मैं ... पूरी तरह नष्ट कर दूँ
  rationale: इस रूप में समाप्त कर देने या सर्वथा विनाश करने का प्रबल भाव है। ‘ताकि’ आज्ञा के बाद आने वाले अभिप्राय को और ‘पूरी तरह नष्ट कर दूँ’ न्याय की तीव्रता को व्यक्त करता है।
- source_word: אֹתָם
  choice: इन्हें
  rationale: निकट संदर्भ में उल्लिखित इसी मण्डली को प्रत्यक्ष कर्म के रूप में इंगित करता है।
- source_word: כְּרָגַע
  choice: क्षण भर में
  rationale: רֶגַע अत्यन्त थोड़े समय को दर्शाता है; ‘क्षण भर में’ विनाश की आकस्मिकता और शीघ्रता दोनों को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय न्याय की घोषणा का स्वरूप
  choice: मण्डली को शीघ्र और पूरी तरह नष्ट करने की वास्तविक घोषणा के रूप में अनुवाद
  alternative: इसे नरम करके ‘उनसे निपट लूँ’ या ‘उन्हें हटा दूँ’ कहना
  rationale: כלה का संदर्भगत अर्थ प्रबल और विनाशकारी है। अनुवाद घोषणा की गंभीरता को बनाए रखता है और आगे की कथा के आधार पर इसे पहले से नरम या पुनर्व्याख्यायित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मण्डली’ सामुदायिक-पंचग्रन्थीय अर्थ को बनाए रखता है, जबकि ‘पूरी तरह नष्ट कर दूँ’ मूल की कठोर न्याय-संबंधी शक्ति को बिना नरम किए स्पष्ट करता है।
