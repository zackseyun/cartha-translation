base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/007.yaml
  text: and put fire in them[a], and place incense on them before Yahweh tomorrow. Then the man whom Yahweh chooses—he is the holy one. You have gone too far, sons of Levi!
translation:
  language: hi
  text: कल याहवे के सामने उनमें आग रखो और उन पर धूप रखो। तब जिस व्यक्ति को याहवे चुनेंगे, वही पवित्र व्यक्ति होगा। हे लेवी के पुत्रों, तुम हद से आगे बढ़ गए हो![a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हे लेवी के पुत्रों, यह तुम्हारे लिए बहुत है!”
    reason: רַב לָכֶם का अधिक शाब्दिक अनुवाद; इब्रानी मुहावरे में फटकार का सटीक रूप कुछ हद तक खुला है।
lexical_decisions:
- source_word: וּתְנוּ בָהֵן אֵשׁ
  choice: और उनमें आग रखना
  rationale: נתן के साथ ב और पिछले पद में उल्लिखित धूपदानों का आशय उनमें आग रखना है; हिंदी में यह स्वाभाविक और स्पष्ट है।
- source_word: וְשִׂימוּ עֲלֵיהֶן קְטֹרֶת
  choice: और उन पर धूप डालना
  rationale: שים के साथ עַל धूपदानों में रखी आग पर धूप डालने को व्यक्त करता है; ‘उन पर’ मूल संबंध को बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह उपासना-संबंधी संदर्भ में याहवे की उपस्थिति में कार्य करने का सीधा और स्वाभाविक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מָחָר
  choice: कल
  rationale: समयवाचक क्रियाविशेषण का सीधा अर्थ।
- source_word: וְהָיָה
  choice: तब
  rationale: यह परीक्षा के परिणाम को प्रस्तुत करता है; ‘तब’ हिंदी में इस वाक्य-संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאִישׁ
  choice: जिस पुरुष को
  rationale: पुल्लिंग एकवचन संज्ञा को बनाए रखा गया है, क्योंकि संदर्भ विशिष्ट पुरुष दावेदारों का है।
- source_word: אֲשֶׁר יִבְחַר יְהוָה
  choice: जिस पुरुष को याहवे चुनेंगे
  rationale: अपूर्ण क्रिया यहाँ निकट भविष्य में होने वाले चयन को सूचित करती है; आदरसूचक बहुवचन हिंदी में परमेश्वर के लिए स्वाभाविक है।
- source_word: הוּא הַקָּדוֹשׁ
  choice: वही पवित्र जन होगा
  rationale: सर्वनाम की बलात्मकता और קָדוֹשׁ पर निश्चित पदचिह्न—अर्थात चुना हुआ व्यक्ति ही पवित्र ठहरेगा—दोनों सुरक्षित हैं।
- source_word: רַב לָכֶם
  choice: तुम बहुत आगे बढ़ गए हो
  rationale: शाब्दिक रूप ‘तुम्हारे लिए बहुत’ है, पर संदर्भ में यह अधिकार-सीमा लाँघने पर तीखी फटकार है; चयनित हिंदी उसी बल को सहज ढंग से व्यक्त करती है।
- source_word: בְּנֵי לֵוִי
  choice: हे लेवी के पुत्रो
  rationale: पारिवारिक संबोधन का इब्रानी रूप बनाए रखा गया है; संबोधन-चिह्न हिंदी में स्पष्टता देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: הוּא הַקָּדוֹשׁ में निश्चितता और बल
  choice: वही पवित्र जन होगा
  alternative: वही पवित्र है; वही पवित्र व्यक्ति है
  rationale: यह रूप चयन के आगामी परिणाम, बलात्मक ‘वही’, और निश्चित ‘पवित्र जन’—तीनों को रखता है, बिना यह तय किए कि पवित्रता का यहाँ व्यापक धर्मशास्त्रीय अर्थ क्या है।
- issue: रַב לָכֶם की फटकार का आशय
  choice: तुम बहुत आगे बढ़ गए हो
  alternative: यह तुम्हारे लिए बहुत है; बस, बहुत हुआ
  rationale: संदर्भ में वाक्यांश मात्र परिमाण नहीं, सीमा लाँघने की फटकार व्यक्त करता है। शाब्दिक संभावना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक निर्देश के अनुरूप रखी गई है। बहुवचन आज्ञाओं के लिए ‘रखना/डालना/करना’ वाला सामान्य हिंदी निर्देशात्मक रूप अपनाया गया है। पादटिप्पणी-चिह्न उसी विवादित वाक्यांश के बाद रखा गया है जिससे उसका संबंध है।
