  source_fidelity: The draft correctly conveys the fire, incense, Yahweh, the next-day test, divine choice, and the rebuke. However, the Hebrew has plural imperatives; the Hindi infinitives ‘रखना/डालना’ are not suitable direct commands here. ‘ऐसा करना’ is also an unnecessary addition not present in the source.
  naturalness: Modern Hindi is improved by using direct plural commands (‘रखो’) and by replacing the somewhat awkward ‘पवित्र जन’ with ‘पवित्र व्यक्ति.’ The vocative plural must be spelled ‘पुत्रों.’
  terminology: ‘याहवे’ appropriately represents יהוה. ‘धूप’ is a natural Hindi rendering of cultic incense. ‘वही पवित्र व्यक्ति होगा’ retains the emphatic pronoun and the definite designation in הוּא הַקָּדוֹשׁ without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The opening commands are rendered as infinitives rather than imperatives.
    rationale: וּתְנוּ and וְשִׂימוּ are plural imperative forms. Hindi should use direct plural commands, not ‘रखना/डालना।’
  - severity: low
    issue: ‘ऐसा करना’ adds content and obscures the syntactic connection of ‘कल याहवे के सामने.’
    rationale: The Hebrew directly modifies the commanded incense offering with ‘before Yahweh tomorrow’; it does not contain a separate ‘do so.’
  - severity: low
    issue: The direct-address plural is misspelled as ‘पुत्रो.’
    rationale: Standard modern Hindi plural vocative is ‘पुत्रों.’
