id: NUM.16.5
reference: Numbers 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֨ר אֶל קֹ֜רַח וְ/אֶֽל כָּל עֲדָת/וֹ֮ לֵ/אמֹר֒ בֹּ֠קֶר וְ/יֹדַ֨ע יְהוָ֧ה אֶת אֲשֶׁר ל֛/וֹ וְ/אֶת הַ/קָּד֖וֹשׁ וְ/הִקְרִ֣יב אֵלָ֑י/ו וְ/אֵ֛ת אֲשֶׁ֥ר יִבְחַר בּ֖/וֹ יַקְרִ֥יב אֵלָֽי/ו־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/005.yaml
  text: And he spoke to Korah and to all his congregation[a], saying, “In the morning Yahweh will make known who is his, and who is holy, and will bring him near to himself. The one whom he chooses[b], he will bring near to himself.”
translation:
  language: hi
  text: फिर उसने कोरह और उसकी सारी मंडली से कहा, “सुबह याहवे प्रकट कर देगा[a] कि कौन उसका है और कौन पवित्र है, और वह उसे अपने निकट लाएगा। जिसे वह चुनेगा, उसे वह अपने निकट लाएगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे जान लेगा कि कौन उसका है।” यहाँ “जानना” संभवतः सबके सामने पहचान प्रकट करने या प्रमाणित करने का भाव रखता है।
    reason: lexical_alternative
  - marker: b
    text: “अपने निकट लाना” याजकीय और उपासना-संबंधी भाषा है; इसका संकेत याहवे की उपस्थिति में पवित्र सेवा के लिए अधिकृत रूप से आने देने की ओर है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְדַבֵּר ... לֵאמֹר
  choice: उसने ... से कहा
  rationale: דבר के संबोधन और לֵאמֹר द्वारा आरम्भ प्रत्यक्ष कथन को स्वाभाविक आधुनिक हिन्दी में एक साथ व्यक्त किया गया है।
- source_word: עֲדָתוֹ
  choice: उसकी सारी मंडली
  rationale: עֵדָה यहाँ कोरह के साथ एकत्र समूह को दर्शाता है; ‘मंडली’ सामूहिक अर्थ और मरुभूमि-वृत्तांत की गरिमा दोनों बनाए रखता है।
- source_word: בֹּקֶר
  choice: सुबह
  rationale: यह संज्ञा यहाँ क्रियाविशेषण की तरह प्रयुक्त है; हिन्दी में ‘सुबह’ स्वाभाविक और संक्षिप्त है।
- source_word: וְיֹדַע יְהוָה
  choice: याहवे प्रकट कर देगा
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर इस प्रसंग में परिणाम सार्वजनिक पहचान या प्रदर्शन है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶת אֲשֶׁר לוֹ
  choice: कौन उसका है
  rationale: हिब्रू के संक्षिप्त स्वामित्व-सूचक वाक्यांश को बिना अनावश्यक व्याख्या के सुरक्षित रखा गया है।
- source_word: הַקָּדוֹשׁ
  choice: कौन पवित्र है
  rationale: संज्ञा के रूप में प्रयुक्त विशेषण का समानांतर और स्वाभाविक हिन्दी रूप है; यह पवित्र सेवा के लिए अलग किए जाने की धारणा को खुला रखता है।
- source_word: וְהִקְרִיב אֵלָיו / יַקְרִיב אֵלָיו
  choice: अपने निकट लाएगा
  rationale: קרב के हिफ़ील रूप में किसी को निकट लाने या अधिकृत रूप से पास आने देने का याजकीय भाव है। हिब्रू की पुनरावृत्ति दोनों स्थानों पर बनाए रखी गई है।
- source_word: אֲשֶׁר יִבְחַר בּוֹ
  choice: जिसे वह चुनेगा
  rationale: בחר के व्यक्तिगत चयन के अर्थ को सरल, औपचारिक और स्पष्ट हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: וְיֹדַע में ईश्वरीय ‘जानने’ और सार्वजनिक रूप से ‘प्रकट करने’ का संबंध
  choice: मुख्य पाठ में ‘प्रकट कर देगा’
  alternative: ‘जान लेगा’
  rationale: व्याकरणिक रूप साधारणतः ‘जानेगा’ है, किंतु प्रसंग अगले दिन सार्वजनिक रूप से वास्तविक चुने हुए व्यक्ति की पहचान सामने आने का है। पादटिप्पणी अधिक शाब्दिक अर्थ और उससे जुड़ी वास्तविक अस्पष्टता को बनाए रखती है।
- issue: יְהוָה का रूपान्तरण
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना निकटतम प्रचलित विद्वत् लिप्यंतरण देता है।
- issue: ‘अपने निकट लाने’ का आशय
  choice: रूपक को मुख्य पाठ में ज्यों का त्यों रखा
  alternative: ‘पवित्र सेवा के लिए नियुक्त करेगा’
  rationale: विस्तृत विकल्प आशय समझाता, पर मूल की याजकीय निकटता की छवि को सीमित कर देता। इसलिए व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और वाचनयोग्य रखी गई है। ‘मंडली’, ‘पवित्र’ और ‘अपने निकट लाना’ जैसे शब्द मूल के सामुदायिक तथा याजकीय स्वर को बनाए रखते हैं। सर्वनाम ‘उसने’ से कथावृत्त का प्रवाह सुरक्षित है और नाम को अनावश्यक रूप से दोहराया नहीं गया।
