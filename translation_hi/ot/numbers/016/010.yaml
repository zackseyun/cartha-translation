source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֹֽתְ/ךָ֔ וְ/אֶת כָּל אַחֶ֥י/ךָ בְנֵי לֵוִ֖י אִתָּ֑/ךְ וּ/בִקַּשְׁתֶּ֖ם גַּם כְּהֻנָּֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/010.yaml
  text: He has brought you near[a], and all your brothers, the sons of Levi, with you; yet you are seeking the priesthood as well.
translation:
  language: hi
  text: उसने तुझे और तेरे साथ तेरे सब भाइयों—लेवी के पुत्रों[a]—को निकट किया है; फिर भी तुम लोग याजकपद भी चाहते हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे सब भाइयों—लेवियों।”
    reason: ‘लेवी के पुत्रों’ का स्वाभाविक सामुदायिक अनुवाद ‘लेवियों’ भी हो सकता है।
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: अपने निकट आने दिया है
  rationale: हिफ़ील रूप किसी को निकट लाने या निकट आने का विशेष अधिकार देने का भाव रखता है। इस उपासना-संबंधी प्रसंग में यह स्थान और विशेषाधिकार, दोनों अर्थों को व्यक्त करता है।
- source_word: אֹתְךָ
  choice: तुझे
  rationale: यह पुल्लिंग एकवचन कर्म है और कोरह को व्यक्तिगत रूप से संबोधित करता है।
- source_word: וְאֶת כָּל אַחֶיךָ בְנֵי לֵוִי
  choice: तेरे सब भाइयों—लेवी के पुत्रों
  rationale: ‘तेरे भाई’ का निकट औपचारिक अर्थ रखा गया है और ‘लेवी के पुत्र’ को उनकी पहचान बताने वाले समानाधिकरण के रूप में प्रस्तुत किया गया है।
- source_word: אִתָּךְ
  choice: तेरे साथ
  rationale: संदर्भ में इसका आशय कोरह के साथ उसके साथी लेवियों को सम्मिलित करना है।
- source_word: וּבִקַּשְׁתֶּם
  choice: फिर भी तुम लोग ... चाहते हो?
  rationale: बहुवचन क्रिया को ‘तुम लोग’ से स्पष्ट किया गया है। प्रसंग में वाव का विरोधात्मक भाव ‘फिर भी’ से और मूसा की फटकार का प्रश्नात्मक बल प्रश्नचिह्न से व्यक्त हुआ है।
- source_word: גַּם
  choice: भी
  rationale: यह पहले से मिले लेवीय विशेषाधिकार के अतिरिक्त एक और पद चाहने का भाव व्यक्त करता है।
- source_word: כְּהֻנָּה
  choice: याजकपद
  rationale: यह सामान्य याजकीय कार्य नहीं, बल्कि याजक की संस्थागत हैसियत और पद को दर्शाता है; संक्षिप्त ‘याजकपद’ आधुनिक हिन्दी में स्वाभाविक है।
theological_decisions:
- issue: लेवियों और याजकों के उपासना-संबंधी पदों का भेद
  choice: याजकपद
  alternative: याजकीय सेवा
  rationale: प्रसंग में कोरह और उसके साथी पहले से मिली लेवीय सेवा से आगे हारूनवंशी याजकों का पद चाहते हैं। ‘याजकपद’ इस संस्थागत भेद को सुरक्षित रखता है।
- issue: निकट लाए जाने का धार्मिक विशेषाधिकार
  choice: अपने निकट आने दिया है
  alternative: निकट ले आया है
  rationale: यह वाक्यांश केवल भौतिक दूरी नहीं, परमेश्वर की सेवा के लिए दी गई पहुँच और विशेषाधिकार का भाव भी बनाए रखता है, पर अर्थ को किसी संकीर्ण धर्मवैधानिक व्याख्या तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और सहज हिन्दी अपनाई गई है। ‘तुझे’ से कोरह को एकवचन संबोधन और ‘तुम लोग’ से उसके पूरे दल को बहुवचन फटकार स्पष्ट होती है। प्रश्नात्मक विराम प्रसंग के आलंकारिक प्रश्न को व्यक्त करता है।
