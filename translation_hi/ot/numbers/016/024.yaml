  text: דַּבֵּ֥ר אֶל הָ/עֵדָ֖ה לֵ/אמֹ֑ר הֵֽעָלוּ֙ מִ/סָּבִ֔יב לְ/מִשְׁכַּן קֹ֖רַח דָּתָ֥ן וַ/אֲבִירָֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/024.yaml
  text: Speak to the congregation, saying, ‘Go up from around the dwelling of Korah, Dathan, and Abiram.’
translation:
  language: hi
  text: मण्डली से कहो, ‘कोरह, दातान और अबीराम के निवास के आस-पास से हट जाओ।’
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעֵדָה
  choice: मण्डली
  rationale: यहाँ इस्राएल के एकत्र समुदाय के लिए प्रयुक्त सामूहिक संज्ञा है; ‘मण्डली’ बाइबलीय संदर्भ में स्वाभाविक और व्यापक रूप से समझी जाती है।
- source_word: הֵעָלוּ
  choice: हट जाओ
  rationale: क्रिया का मूल अर्थ ‘ऊपर जाओ/चढ़ो’ है, पर इस प्रसंग में इसका व्यावहारिक आशय उनके निवास के आसपास से निकलकर दूर जाना है; शाब्दिक ‘ऊपर चले जाओ’ आधुनिक हिन्दी में दिशा के बारे में अनपेक्षित भ्रम पैदा करेगा।
- source_word: מִשְׁכַּן
  choice: निवास
  rationale: यह शब्द रहने के स्थान को दर्शाता है। यहाँ पवित्र तम्बू के तकनीकी अर्थ वाला ‘निवासस्थान’ अभिप्रेत नहीं, बल्कि कोरह, दातान और अबीराम से संबद्ध रहने का स्थान है।
- source_word: מִסָּבִיב לְ
  choice: के आस-पास से
  rationale: इब्रानी अभिव्यक्ति उस घेरे या निकटवर्ती क्षेत्र से दूर होने का बोध देती है और हिन्दी में सहज है।
theological_decisions:
- issue: कोरह, दातान और अबीराम के ‘निवास’ का वचनगत स्वरूप
  choice: एकवचन ‘निवास’ बनाए रखा
  alternative: ‘डेरों’ या ‘निवासों’
  rationale: मसोरेटिक पाठ में מִשְׁכַּן एकवचन है। अगली आयत में बहुवचन तम्बुओं का उल्लेख होने पर भी इस आयत के रूप को बहुवचन बनाकर तनाव को मिटाना उचित नहीं।
translation_notes:
  register: आज्ञार्थक, संक्षिप्त और गरिमापूर्ण आधुनिक मानक हिन्दी। प्रत्यक्ष कथन के भीतर स्वाभाविक ‘हट जाओ’ रखा गया है; किसी सांप्रदायिक शब्दावली या व्याख्यात्मक विस्तार को नहीं जोड़ा गया।
