  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּֽקָּהֲל֞וּ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֗ן וַ/יֹּאמְר֣וּ אֲלֵ/הֶם֮ רַב לָ/כֶם֒ כִּ֤י כָל הָֽ/עֵדָה֙ כֻּלָּ֣/ם קְדֹשִׁ֔ים וּ/בְ/תוֹכָ֖/ם יְהוָ֑ה וּ/מַדּ֥וּעַ תִּֽתְנַשְּׂא֖וּ עַל קְהַ֥ל יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/003.yaml
  text: They assembled against Moses and against Aaron and said to them[a], “You have gone too far! For all the congregation—all of them—are holy, and Yahweh is among them[b]. So why do you exalt yourselves above the assembly of Yahweh?”
translation:
  language: hi
  text: वे मूसा और हारून के विरुद्ध इकट्ठे हुए और उनसे कहा, “तुम हद से बढ़ गए हो![a] सारी मंडली—हर एक व्यक्ति—पवित्र है, और याहवे उनके बीच में है। फिर तुम अपने आप को याहवे की सभा से ऊपर क्यों उठाते हो?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अधिक शाब्दिक अर्थ “तुम्हारे लिए बहुत है” या “तुम्हें बहुत हुआ” हो सकता है; इसका भाव “बस, अब बहुत हुआ!” या “तुम हद से बढ़ गए हो!” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּהֲלוּ עַל
  choice: के विरुद्ध इकट्ठे हुए
  rationale: निफ़अल रूप सामूहिक रूप से इकट्ठा होने को व्यक्त करता है, और עַל इस टकरावपूर्ण प्रसंग में विरोध का भाव देता है।
- source_word: רַב לָכֶם
  choice: बस, बहुत हो चुका!
  rationale: यह तीखी फटकार का मुहावरा है। यह हिन्दी में स्वाभाविक है और शाब्दिक अर्थ की प्रमुख वैकल्पिक सम्भावनाएँ पाद-टिप्पणी में रखता है।
- source_word: כָל הָעֵדָה כֻּלָּם
  choice: सारी मंडली—उनमें से हर एक—
  rationale: כָל और כֻּלָּם की दोहरी सर्वसमावेशी बलाघात को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: קְדֹשִׁים
  choice: पवित्र
  rationale: यह קדושׁ का मानक, धर्मवैचारिक भार रखने वाला अनुवाद है और वक्ताओं के दावे को बिना टिप्पणी के प्रस्तुत करता है।
- source_word: וּבְתוֹכָם יְהוָה
  choice: और यहोवा उनके बीच में है
  rationale: समुदाय के मध्य परमेश्वर की उपस्थिति को स्पष्ट रूप से व्यक्त करता है और दिव्य नाम को नाम के रूप में रखता है।
- source_word: תִּתְנַשְּׂאוּ עַל
  choice: अपने आप को ... से ऊँचा ... उठाते हो
  rationale: हित्पएल की आत्मवाचकता और दूसरों के ऊपर स्वयं को ऊँचा करने के आरोप, दोनों को बनाए रखता है।
- source_word: קְהַל יְהוָה
  choice: यहोवा की सभा
  rationale: קהל के लिए ‘सभा’ उपयुक्त है और पहले आए עֵדָה के ‘मंडली’ से स्रोत-पाठ का हल्का शब्दभेद भी बचाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ शीर्षक ‘प्रभु’ से भिन्नता बनाए रखता है; अन्य सम्भव लिप्यंतरण को मान्यता दी जाती है।
- issue: ‘सारी मंडली ... पवित्र है’ कथन का स्वर
  choice: वक्ताओं के दावे को सीधे और बिना व्याख्यात्मक योग्यता के प्रस्तुत करना
  alternative: ‘पवित्र होने का दावा करती है’ जैसे शब्द जोड़ना
  rationale: पद वक्ताओं का दावा दर्ज करता है; उसका कथात्मक या धर्मवैचारिक मूल्यांकन अनुवाद में पहले से नहीं जोड़ा जाना चाहिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘मंडली’ और ‘सभा’ स्रोत के עֵדָה तथा קהל के शब्दभेद को स्वाभाविक हिन्दी में दर्शाते हैं।
