  text: וַ/יָּקֻ֨מוּ֙ לִ/פְנֵ֣י מֹשֶׁ֔ה וַ/אֲנָשִׁ֥ים מִ/בְּנֵֽי יִשְׂרָאֵ֖ל חֲמִשִּׁ֣ים וּ/מָאתָ֑יִם נְשִׂיאֵ֥י עֵדָ֛ה קְרִאֵ֥י מוֹעֵ֖ד אַנְשֵׁי שֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/002.yaml
  text: and rose up before Moses[a], with two hundred fifty men from the sons of Israel, leaders of the congregation, called to the assembly[b], men of renown.
translation:
  language: hi
  text: और वे मूसा के सामने उठ खड़े हुए, और उनके साथ इस्राएलियों में से ढाई सौ पुरुष भी उठ खड़े हुए—मंडली के प्रधान, सभा के लिए बुलाए गए[a], और प्रतिष्ठित पुरुष।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नियत सभा में बुलाए जानेवाले।” इब्रानी पदबंध उन पुरुषों की ओर संकेत कर सकता है जिन्हें समुदाय की आधिकारिक सभा के लिए बुलाया जाता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקֻמוּ לִפְנֵי מֹשֶׁה
  choice: वे मूसा के सामने उठ खड़े हुए
  rationale: यह अनुवाद קום की क्रिया और לִפְנֵי के स्थान-संबंधी अर्थ को बनाए रखता है। प्रसंग में विरोध का भाव है, पर क्रिया में ही ‘विद्रोह किया’ जोड़कर अर्थ को अधिक स्पष्ट नहीं किया गया।
- source_word: וַאֲנָשִׁים מִבְּנֵי יִשְׂרָאֵל חֲמִשִּׁים וּמָאתָיִם
  choice: उनके साथ इस्राएलियों में से ढाई सौ पुरुष थे
  rationale: इब्रानी वाक्य की संक्षिप्त समन्वयी रचना को स्वाभाविक हिन्दी में स्पष्ट किया गया है। מִבְּנֵי יִשְׂרָאֵל का अर्थ यहाँ समुदाय के पुरुष सदस्यों से है; ‘इस्राएलियों में से’ आधुनिक हिन्दी में सहज है।
- source_word: נְשִׂיאֵי עֵדָה
  choice: मंडली के प्रधान
  rationale: נְשִׂיאֵי नेतृत्व और प्रतिष्ठित पद को दर्शाता है, जबकि עֵדָה इस्राएली समुदाय अथवा मंडली को सूचित करता है।
- source_word: קְרִאֵי מוֹעֵד
  choice: सभा के लिए बुलाए गए
  rationale: पदबंध का निष्क्रिय अर्थ बनाए रखते हुए इसे उन लोगों के रूप में प्रस्तुत किया गया है जिन्हें सामुदायिक सभा में बुलाया जाता था; इसकी संभावित आधिकारिक बारीकी पादटिप्पणी में दी गई है।
- source_word: אַנְשֵׁי שֵׁם
  choice: प्रतिष्ठित पुरुष
  rationale: शाब्दिक ‘नाम वाले पुरुष’ प्रतिष्ठा और ख्याति का इब्रानी मुहावरा है; ‘प्रतिष्ठित पुरुष’ आधुनिक हिन्दी में उसका स्वाभाविक और गरिमापूर्ण रूप है।
theological_decisions:
- issue: मूसा के सामने खड़े होने में विरोध का निहितार्थ
  choice: सामने उठ खड़े हुए
  alternative: मूसा के विरुद्ध उठ खड़े हुए
  rationale: प्रसंग विरोध सूचित करता है, पर לִפְנֵי का मूल अर्थ ‘सामने/उपस्थिति में’ है। इसलिए विरोध को क्रिया में स्पष्ट रूप से जोड़ने के बजाय कथानक पर छोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली अपनाई गई है। ‘ढाई सौ’ सामान्य हिन्दी संख्या-प्रयोग है; ‘मंडली,’ ‘प्रधान’ और ‘प्रतिष्ठित’ मूल के सामुदायिक तथा पद-संबंधी भाव को स्पष्ट रखते हैं।
