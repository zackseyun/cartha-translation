  text: וְ/כָל יִשְׂרָאֵ֗ל אֲשֶׁ֛ר סְבִיבֹתֵי/הֶ֖ם נָ֣סוּ לְ/קֹלָ֑/ם כִּ֣י אָֽמְר֔וּ פֶּן תִּבְלָעֵ֖/נוּ הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/016/034.yaml
  text: And all Israel who were around them fled at their cry[a], for they said, “Lest the earth swallow us up!”
translation:
  language: hi
  text: और उनके आसपास के सभी इस्राएली उनकी आवाज़ सुनकर भाग गए[a], क्योंकि उन्होंने कहा, “कहीं ऐसा न हो कि धरती हमें निगल जाए!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनकी पुकार सुनकर।” इब्रानी शब्द का अर्थ “ध्वनि,” “आवाज़” या “पुकार” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל יִשְׂרָאֵל
  choice: तब ... सभी इस्राएली
  rationale: यह पद पिछले घटनाक्रम को आगे बढ़ाता है; सामूहिक ‘सारा इस्राएल’ की अपेक्षा प्रसंग में उपस्थित लोगों के लिए स्वाभाविक हिन्दी ‘सभी इस्राएली’ स्पष्ट है।
- source_word: אֲשֶׁר סְבִיבֹתֵי/הֶם
  choice: उनके चारों ओर के
  rationale: यह उन इस्राएलियों को सीमित करता है जो दण्डित लोगों के आसपास मौजूद थे।
- source_word: נָסוּ
  choice: भाग गए
  rationale: נוּס भय के कारण तत्काल पलायन को व्यक्त करता है; ‘भाग गए’ सहज और सजीव हिन्दी है।
- source_word: לְ/קֹלָם
  choice: उनकी आवाज़ सुनकर
  rationale: קוֹל ध्वनि, आवाज़ या पुकार का अर्थ दे सकता है। ‘आवाज़’ स्रोत की व्यापकता बनाए रखती है और לְ को प्रसंगानुसार प्रतिक्रिया के कारण के रूप में व्यक्त करती है।
- source_word: כִּי אָמְרוּ
  choice: क्योंकि उन्होंने कहा
  rationale: כִּי उनके भागने का कारण प्रस्तुत करता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित परिणाम को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִּבְלָעֵנוּ
  choice: हमें भी निगल जाए
  rationale: בלע का सजीव अर्थ ‘निगलना’ है। ‘भी’ हिन्दी में वक्ताओं की आशंका स्पष्ट करता है कि वही घटना उनके साथ न हो; यह प्रसंग से निहित है।
- source_word: הָ/אָרֶץ
  choice: धरती
  rationale: पिछले पद में धरती के मुँह खोलकर लोगों को निगलने से सीधा संबंध है; ‘धरती’ इस चित्र को स्वाभाविक हिन्दी में बनाए रखती है।
