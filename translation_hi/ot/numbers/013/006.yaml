  rationale: इब्रानी रचनात्मक संबंध तत्काल पितृवंशीय पहचान बताता है; हिन्दी में ‘का पुत्र’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: יְפֻנֶּה
  choice: यपुन्ने
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप, जो स्रोत नाम की पहचान बनाए रखता है।
