lexical_decisions:
- source_word: לְ/מַטֵּה
  choice: के गोत्र से
  rationale: לְ उपसर्ग और מַטֶּה इस सूची में किसी व्यक्ति की गोत्रीय संबद्धता और उस गोत्र से उसके प्रतिनिधित्व को बताते हैं; हिंदी सूची-शैली में ‘के गोत्र से’ स्वाभाविक और सटीक है।
- source_word: זְבוּלֻן
  choice: जबूलून
  rationale: गोत्र के नाम का मूल इब्रानी उच्चारण ध्यान में रखते हुए देवनागरी लिप्यंतरण किया गया है।
- source_word: גַּדִּיאֵל
  choice: गद्दीएल
  rationale: व्यक्तिगत नाम का इब्रानी से देवनागरी में लिप्यंतरण किया गया है; व्यंजन के द्वित्व को बनाए रखा गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: इब्रानी वंशसूचक रचना का हिंदी में संक्षिप्त और स्वाभाविक रूप; हिंदी शब्दक्रम के अनुसार पिता का नाम पहले रखा गया है।
- source_word: סוֹדִי
  choice: सोदी
  rationale: व्यक्तिगत नाम का इब्रानी स्वरूप के निकट देवनागरी लिप्यंतरण किया गया है।
