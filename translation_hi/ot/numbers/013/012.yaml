lexical_decisions:
- source_word: לְמַטֵּה
  choice: के गोत्र से
  rationale: प्रतिनिधियों की इस सूची में לְ किसी गोत्र से संबद्ध प्रतिनिधि को प्रस्तुत करता है, और מַטֶּה का अर्थ यहाँ शाब्दिक ‘लाठी’ नहीं बल्कि ‘गोत्र’ है। स्वाभाविक हिन्दी में ‘के गोत्र से’ सूची-सदस्यता को स्पष्ट करता है।
- source_word: דָן
  choice: दान
  rationale: इस्राएल के गोत्र का पारंपरिक और प्रचलित हिन्दी नाम।
- source_word: עַמִּיאֵל
  choice: अम्मीएल
  rationale: हिब्रू व्यंजन और स्वर-विन्यास के निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: हिब्रू वंश-सूचक रचना का संक्षिप्त और स्वाभाविक हिन्दी रूप। हिन्दी शब्दक्रम में पिता का नाम पहले रखकर ‘गमल्ली का पुत्र अम्मीएल’ कहा गया है।
- source_word: גְּמַלִּי
  choice: गमल्ली
  rationale: हिब्रू नाम का देवनागरी लिप्यंतरण; मध्य व्यंजन के द्वित्व को बनाए रखा गया है।
