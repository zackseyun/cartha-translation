base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/002.yaml
  text: Send for yourself men[a], and let them scout out the land of Canaan, which I am giving to the sons of Israel. You shall send one man from each tribe of his fathers[c][b], every one a leader among them.
translation:
  language: hi
  text: “अपने लिए पुरुषों को भेज, ताकि वे कनान देश की टोह लें[a], जिसे मैं इस्राएल के पुत्रों को दे रहा हूँ। प्रत्येक व्यक्ति को उसके पैतृक गोत्र से भेजना; हर एक उनमें प्रधान हो[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भेद लें” अथवा “खोजबीन करें।”
    reason: lexical_alternative
  - marker: b
    text: या “अगुवा” अथवा “मुखिया।” इब्रानी शब्द किसी गोत्रीय प्रधान या मान्य अगुवे को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁלַח לְךָ
  choice: अपने लिए ... भेज
  rationale: आज्ञार्थक क्रिया के साथ לְךָ को छोड़ा नहीं गया, ताकि इब्रानी की व्यक्तिगत बलाघात अथवा अनुमति की संभावित छाया बनी रहे।
- source_word: אֲנָשִׁים
  choice: पुरुषों
  rationale: यहाँ प्रत्येक गोत्र के पुरुष प्रतिनिधि अभिप्रेत हैं; इसलिए लिंग-विशिष्ट स्रोत रूप सुरक्षित रखा गया है।
- source_word: וְיָתֻרוּ
  choice: वे ... भेद लें
  rationale: תור भूमि की खोजबीन या टोह लेने को दर्शाता है। 'भेद लेना' प्रसंगानुकूल और स्वाभाविक हिंदी है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אֶרֶץ כְּנַעַן
  choice: कनान देश
  rationale: अर्थपूर्ण हिंदी में אֶרֶץ और स्थाननाम दोनों स्पष्ट रहते हैं।
- source_word: אֲשֶׁר אֲנִי נֹתֵן
  choice: जिसे मैं ... दे रहा हूँ
  rationale: वर्तमान कृदंत נֹתֵן की जारी अथवा आसन्न क्रिया को 'दे रहा हूँ' व्यक्त करता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों को
  rationale: मूल का पारिवारिक और वाचागत मुहावरा सुरक्षित रखा गया है; यह समूचे इस्राएली समुदाय का पारंपरिक संबोधन है।
- source_word: אִישׁ אֶחָד אִישׁ אֶחָד
  choice: एक-एक पुरुष
  rationale: दोहराव का वितरणात्मक बल संक्षिप्त और स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: לְמַטֵּה אֲבֹתָיו
  choice: उनके पितरों के हर गोत्र में से
  rationale: מַטֶּה को 'गोत्र' और אֲבֹתָיו को वंशगत 'पितरों' के रूप में रखा गया है; बहुवचन 'उनके' चुने जाने वाले लोगों की सामूहिक ओर संकेत करता है।
- source_word: תִּשְׁלָחוּ
  choice: भेजना
  rationale: आरंभिक आज्ञा के बाद निर्देशात्मक अपूर्ण क्रिया को हिंदी के स्पष्ट विधिसूचक रूप में प्रस्तुत किया गया है।
- source_word: כֹּל נָשִׂיא בָהֶם
  choice: उनमें से हर एक प्रधान हो
  rationale: נָשִׂיא मान्य गोत्रीय अगुवे या प्रधान को सूचित करता है; 'प्रधान' सामाजिक पद और स्रोत की गरिमा दोनों व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय आज्ञा में לְךָ की छाया
  choice: मुख्य पाठ में 'अपने लिए' रखा गया
  alternative: इसे मुहावरेगत मानकर छोड़ देना, या 'अपनी ओर से' कहना
  rationale: इससे यह खुला रहता है कि पद व्यक्तिगत बल, मूसा की भागीदारी या अनुमति में से किस बात पर संकेत करता है।
- issue: בני ישראל का रूप
  choice: '''इस्राएल के पुत्रों'''
  alternative: '''इस्राएलियों'' या ''इस्राएल की सन्तान'''
  rationale: मूल का पुरुषवाची पारिवारिक-वाचागत रूप सुरक्षित है, बिना यह संकेत दिए कि समुदाय की स्त्रियाँ बाहर हैं।
- issue: नָשִׂיא का पदगत अर्थ
  choice: '''प्रधान'''
  alternative: '''अगुवा'', ''मुखिया'' या ''राजकुमार'''
  rationale: यहाँ राजवंशीय उपाधि आवश्यक नहीं; शब्द प्रत्येक गोत्र के मान्य प्रतिनिधि की हैसियत बताता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य-पाठक-सुलभ शैली रखी गई है। परमेश्वर द्वारा मूसा को एकवचन संबोधन के कारण 'भेज' और फिर निर्देशात्मक 'भेजना' प्रयुक्त हैं। 'अपने लिए' जानबूझकर रखा गया है, यद्यपि सामान्य हिंदी में इसे छोड़ा जा सकता था।
