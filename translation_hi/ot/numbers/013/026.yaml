base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/026.yaml
  text: They went and came to Moses and Aaron and to all the congregation of the sons of Israel in the wilderness of Paran[a], at Kadesh. They brought back word to them and to all the congregation, and showed them the fruit of the land.
translation:
  language: hi
  text: वे जाकर मूसा और हारून के पास, और पारान के निर्जन प्रदेश में कादेश में इस्राएलियों की सारी मंडली के पास आए। उन्होंने उन्हें और सारी मंडली को समाचार दिया और उन्हें उस देश का फल दिखाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלְכוּ וַיָּבֹאוּ
  choice: वे चलकर ... आए
  rationale: दोनों समन्वित इब्रानी क्रियाओं—जाने और आ पहुँचने—को स्वाभाविक हिन्दी में क्रमबद्ध रूप से सुरक्षित रखता है।
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की सारी मण्डली
  rationale: עֲדָה को ‘मण्डली’ और בְּנֵי יִשְׂרָאֵל को प्रचलित सामुदायिक अर्थ ‘इस्राएली’ से व्यक्त करता है; हिन्दी में शाब्दिक ‘इस्राएल के पुत्र’ यहाँ अस्वाभाविक और अनावश्यक रूप से केवल पुरुषों तक सीमित सुनाई देता।
- source_word: מִדְבַּר פָּארָן
  choice: पारान का निर्जन प्रदेश
  rationale: מִדְבָּר के यात्रा-वृत्तांत वाले अर्थ को आधुनिक हिन्दी में स्पष्ट करता है; यह आवश्यक रूप से रेतीले ‘रेगिस्तान’ का संकेत नहीं देता।
- source_word: קָדֵשָׁה
  choice: कादेश में
  rationale: दिशासूचक ה locale गति का गंतव्य बताता है; आगमन की क्रिया के साथ हिन्दी में ‘कादेश में आए’ स्वाभाविक है।
- source_word: וַיָּשִׁיבוּ אוֹתָם דָּבָר
  choice: उन्होंने उन्हें ... समाचार दिया
  rationale: ‘वचन लौटाना’ जैसे इब्रानी मुहावरे का आशय लौटकर सूचना देना है; ‘समाचार दिया’ हिन्दी में स्वाभाविक रहते हुए דָּבָר की व्यापकता बनाए रखता है।
- source_word: וַיַּרְאוּם
  choice: उन्हें ... दिखाया
  rationale: ראה के हिफ़ील रूप का कारक अर्थ ‘दिखाना’ सीधे व्यक्त होता है।
- source_word: פְּרִי הָאָרֶץ
  choice: उस देश का फल
  rationale: ‘फल’ मूल की ठोस और दृश्य भाषा बनाए रखता है; निकट संदर्भ में निर्दिष्ट देश के कारण הָאָרֶץ को ‘उस देश’ कहा गया है।
