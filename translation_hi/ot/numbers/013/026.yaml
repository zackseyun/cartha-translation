translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘वे चलकर ... आए’ मूल की दोहरी गति-रचना को हिन्दी की स्वाभाविकता के साथ बचाता है। ‘मण्डली’ बाइबलीय सामुदायिक सभा के लिए परिचित है, जबकि ‘निर्जन प्रदेश’ מִדְבָּר को ‘रेगिस्तान’ से अधिक सटीक रूप में प्रस्तुत करता है।
