  edition: WLC
  text: וּ/מָ֣ה הָ֠/אָרֶץ הַ/שְּׁמֵנָ֨ה הִ֜וא אִם רָזָ֗ה הֲ/יֵֽשׁ בָּ֥/הּ עֵץ֙ אִם אַ֔יִן וְ/הִ֨תְחַזַּקְתֶּ֔ם וּ/לְקַחְתֶּ֖ם מִ/פְּרִ֣י הָ/אָ֑רֶץ וְ/הַ֨/יָּמִ֔ים יְמֵ֖י בִּכּוּרֵ֥י עֲנָבִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/020.yaml
  text: And whether the land is fertile or lean[a], whether there are trees in it or not. And be strong[b], and take some of the fruit of the land.” Now the days were the days of the first-ripe grapes.
translation:
  language: hi
  text: और यह भी देखो कि भूमि उपजाऊ है या कम उपजाऊ, और उसमें पेड़[क] हैं या नहीं। हिम्मत बाँधो और भूमि की उपज में से कुछ ले लो।” उस समय अंगूरों के आरंभिक पकने का समय था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: ‘पेड़’ के लिए इब्रानी शब्द का अर्थ ‘लकड़ी’ या ‘इमारती लकड़ी’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשְּׁמֵנָה ... רָזָה
  choice: उपजाऊ ... बंजर
  rationale: शाब्दिक अर्थ ‘मोटी ... दुबली’ है, पर भूमि के संदर्भ में यह उसकी उर्वरता और अनुपजाऊपन का स्वाभाविक हिन्दी विरोध व्यक्त करता है।
- source_word: הֲיֵשׁ בָּהּ עֵץ אִם אַיִן
  choice: उसमें पेड़ हैं या नहीं
  rationale: עֵץ का अर्थ ‘पेड़’ या ‘लकड़ी’ हो सकता है। यहाँ भूमि की दशा का निरीक्षण करने के संदर्भ में ‘पेड़’ सबसे सीधा अर्थ है।
- source_word: וְהִתְחַזַּקְתֶּם
  choice: हिम्मत बाँधो
  rationale: क्रिया का आत्मवाचक बल स्वयं को दृढ़ करने का आह्वान करता है; ‘हिम्मत बाँधो’ आधुनिक हिन्दी में साहसपूर्वक काम करने की आज्ञा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּלְקַחְתֶּם מִפְּרִי הָאָרֶץ
  choice: उस भूमि की उपज में से कुछ ले आओ
  rationale: מִן अंश का भाव देता है। व्यापक प्रसंग में नमूना शिविर में वापस लाना अभिप्रेत है, इसलिए हिन्दी में ‘ले आओ’ स्वाभाविक और प्रसंगसम्मत है।
- source_word: בִּכּוּרֵי עֲנָבִים
  choice: अंगूरों के पहले फल
  rationale: यह पद सबसे पहले पकने वाले अंगूरों और अंगूर की फसल के आरंभिक समय को सूचित करता है; यहाँ बाद की उपासना-संबंधी ‘पहली उपज’ की तकनीकी ध्वनि थोपने से बचा गया है।
- source_word: וְהַיָּמִים יְמֵי
  choice: उस समय ... पकने लगे थे
  rationale: इब्रानी की पुनरुक्त समय-सूचक रचना को सहज हिन्दी कथन में बदला गया है, जबकि आरंभिक अंगूर पकने के मौसम का अर्थ सुरक्षित है।
