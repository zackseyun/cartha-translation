  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भूमि के लिए शाब्दिक ‘मोटी/दुबली’ के बजाय अर्थानुकूल ‘उपजाऊ/बंजर’ और आदेश के लिए स्वाभाविक ‘हिम्मत बाँधो’ चुना गया है।
