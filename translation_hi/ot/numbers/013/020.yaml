- from: और यह भी देखो कि वह भूमि उपजाऊ है या बंजर, और उसमें पेड़ हैं या नहीं। हिम्मत बाँधो और उस भूमि की उपज में से कुछ ले आओ।” उस समय अंगूरों के पहले फल पकने लगे थे।
  to: और यह भी देखो कि भूमि उपजाऊ है या कम उपजाऊ, और उसमें पेड़[क] हैं या नहीं। हिम्मत बाँधो और भूमि की उपज में से कुछ ले लो।” उस समय अंगूरों के आरंभिक पकने का समय था।
  rationale: The revision avoids adding an explicit instruction to bring the fruit back, softens “barren” to match the Hebrew’s “lean/poor” agricultural sense, and renders the closing phrase as a season marker. A lexical note preserves the ambiguity of the word translated “trees.”
