  text: עֲמָלֵ֥ק יוֹשֵׁ֖ב בְּ/אֶ֣רֶץ הַ/נֶּ֑גֶב וְ֠/הַֽ/חִתִּי וְ/הַ/יְבוּסִ֤י וְ/הָֽ/אֱמֹרִי֙ יוֹשֵׁ֣ב בָּ/הָ֔ר וְ/הַֽ/כְּנַעֲנִי֙ יֹשֵׁ֣ב עַל הַ/יָּ֔ם וְ/עַ֖ל יַ֥ד הַ/יַּרְדֵּֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/029.yaml
  text: Amalek lives in the land of the Negev[a], and the Hittites, the Jebusites, and the Amorites live in the hill country[c][b], and the Canaanites live by the sea and along the Jordan.
translation:
  language: hi
  text: अमालेकी नेगेव प्रदेश[a] में रहते हैं; हित्ती, यबूसी और एमोरी पहाड़ी प्रदेश में रहते हैं; और कनानी समुद्र के पास और यरदन के किनारे रहते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नेगेव’ का अर्थ ‘दक्षिणी प्रदेश’ भी हो सकता है; यहाँ संभवतः कनान के विशिष्ट दक्षिणी भूभाग का नाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֲמָלֵק
  choice: अमालेकी
  rationale: यहाँ जाति-समूह के सामूहिक नाम के रूप में प्रयुक्त है; हिन्दी में ‘अमालेकी’ स्वाभाविक और प्रचलित जातिनाम है।
- source_word: יוֹשֵׁב / יֹשֵׁב
  choice: रहते हैं
  rationale: इब्रानी कृदन्त स्थायी निवास का भाव देता है; ‘रहते हैं’ आधुनिक हिन्दी में स्वाभाविक रूप से यह अर्थ व्यक्त करता है।
- source_word: בְּאֶרֶץ הַנֶּגֶב
  choice: नेगेव प्रदेश में
  rationale: נֶגֶב यहाँ कनान के विशिष्ट दक्षिणी भूभाग का भौगोलिक नाम है; ‘प्रदेश’ אֶרֶץ के स्थानगत भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הַחִתִּי / הַיְבוּסִי / הָאֱמֹרִי / הַכְּנַעֲנִי
  choice: हित्ती / यबूसी / एमोरी / कनानी
  rationale: इब्रानी में एकवचन रूप सामूहिक जातियों को सूचित करते हैं; हिन्दी के प्रचलित जातिनाम अपने रूप में ही समूहवाचक अर्थ देते हैं।
- source_word: בָּהָר
  choice: पहाड़ी प्रदेश में
  rationale: הַר इस संदर्भ में किसी एक पहाड़ के बजाय पर्वतीय अथवा पहाड़ी भूभाग को सूचित करता है।
- source_word: עַל הַיָּם
  choice: समुद्र के पास
  rationale: यह मूल पाठ के स्थानगत अर्थ को बनाए रखता है और ‘तट पर’ जैसी अपेक्षाकृत अधिक विशिष्ट व्याख्या से बचता है।
- source_word: עַל יַד הַיַּרְדֵּן
  choice: यरदन के किनारे
  rationale: शाब्दिक ‘यरदन के हाथ/बगल में’ एक स्थानगत मुहावरा है; नदी के संदर्भ में ‘किनारे’ स्वाभाविक हिन्दी है और निकटवर्ती पट्टी का भाव देता है।
