- source_word: לְמַטֵּה
  choice: के गोत्र से
  rationale: מַטֶּה का यहाँ अर्थ ‘गोत्र’ है। सूची के इस संदर्भ में לְ किसी गोत्र से चुने गए प्रतिनिधि को सूचित करता है; ‘के गोत्र से’ स्वाभाविक हिन्दी है।
- source_word: שִׁמְעוֹן
  choice: शिमोन
  rationale: गोत्र और पूर्वज का व्यक्तिवाचक नाम; प्रचलित हिन्दी बाइबलीय वर्तनी में लिप्यंतरित।
- source_word: שָׁפָט
  choice: शापात
  rationale: व्यक्तिवाचक नाम को हिब्रू उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: हिब्रू वंश-सूचक संबंध को हिन्दी की स्वाभाविक संबंध-रचना में व्यक्त करता है।
- source_word: חוֹרִי
  choice: होरी
  rationale: व्यक्तिवाचक नाम को हिब्रू रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
