lexical_decisions:
- source_word: לְמַטֵּה
  choice: के गोत्र में से
  rationale: प्रतिनिधियों की इस सूची में לְ जनजातीय संबद्धता बताता है; हिंदी में ‘के गोत्र में से’ स्वाभाविक और सटीक है।
- source_word: יוֹסֵף
  choice: यूसुफ
  rationale: हिब्रू व्यक्तिगत नाम का हिंदी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: לְמַטֵּה מְנַשֶּׁה
  choice: अर्थात मनश्शे के गोत्र में से
  rationale: हिब्रू में ‘गोत्र’ वाला पद दोहराया गया है और मनश्शे को यूसुफ की अभिप्रेत शाखा के रूप में स्पष्ट किया गया है; ‘अर्थात’ हिंदी में इस स्पष्टकारी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גַּדִּי
  choice: गद्दी
  rationale: हिब्रू व्यक्तिगत नाम का निकट लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-संबंध बताने वाला सामान्य और स्पष्ट हिंदी रूप।
- source_word: סוּסִי
  choice: सूसी
  rationale: हिब्रू व्यक्तिगत नाम का निकट लिप्यंतरण।
