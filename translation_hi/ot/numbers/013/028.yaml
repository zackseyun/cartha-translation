base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/028.yaml
  text: However[a], the people who dwell in the land are strong, and the cities are fortified and very large; and we also saw the descendants of Anak there.
translation:
  language: hi
  text: फिर भी, उस देश में रहने वाले लोग शक्तिशाली हैं, और नगर किलेबंद और बहुत बड़े हैं। हमने वहाँ अनाक के वंशजों को भी देखा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अनाक की संतान।’ इब्रानी पद अनाक से वंश-संबंध रखने वालों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶפֶס כִּי
  choice: फिर भी
  rationale: यह पद पिछले पद के अनुकूल समाचार पर एक प्रबल प्रतिकूल योग्यता लगाता है। ‘फिर भी’ आधुनिक हिन्दी में स्वाभाविक रूप से इस विरोधात्मक बल को व्यक्त करता है।
- source_word: עַז
  choice: शक्तिशाली
  rationale: यह देश के निवासियों की ताकत और भयप्रद सामर्थ्य बताता है; ‘शक्तिशाली’ स्पष्ट है और ‘भयंकर’ की तरह अनावश्यक शत्रुता नहीं जोड़ता।
- source_word: הַיֹּשֵׁב בָּאָרֶץ
  choice: उस देश में रहने वाले
  rationale: इब्रानी कृदन्तीय रचना को स्वाभाविक हिन्दी सम्बन्धवाचक पदबंध में व्यक्त किया गया है।
- source_word: בְּצֻרוֹת
  choice: किलेबंद
  rationale: यह नगरों के सैन्य सुरक्षा-प्रबंध को व्यक्त करता है और केवल दीवार होने की अपेक्षा अर्थ को अधिक पूर्ण रूप से दर्शाता है।
- source_word: גְּדֹלֹת מְאֹד
  choice: बहुत बड़े
  rationale: यह नगरों के बड़े आकार को और מְאֹד की तीव्रता को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְלִדֵי הָעֲנָק
  choice: अनाक के वंशजों
  rationale: शाब्दिक रूप से ‘अनाक की संतान’ सम्भव है, पर यहाँ वंश-सम्बन्ध अभिप्रेत है; ‘वंशज’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: רָאִינוּ שָׁם
  choice: हमने वहाँ ... देखा
  rationale: पूर्ण क्रिया को प्रत्यक्ष रिपोर्ट के सामान्य भूतकाल में रखा गया है और स्थानसूचक ‘वहाँ’ सुरक्षित है।
