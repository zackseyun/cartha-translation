base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/031.yaml
  text: But the men who had gone up with him said[a], “We are not able to go up against the people[b], because they are stronger than we are.”
translation:
  language: hi
  text: परन्तु जो पुरुष उसके साथ गए थे, उन्होंने कहा, “हम उन लोगों के विरुद्ध चढ़ाई नहीं कर सकते[a], क्योंकि वे हमसे अधिक शक्तिशाली हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “लोगों की ओर चढ़कर जाना”; इस प्रसंग में इसका आशय सैन्य रूप से उनके विरुद्ध बढ़ना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: परन्तु जो पुरुष
  rationale: वाव यहाँ पिछले पद में कालेब के कथन के साथ विरोध दिखाता है; इसलिए आधुनिक हिन्दी में ‘परन्तु’ उपयुक्त है। ‘पुरुष’ मूल के ठोस अर्थ को बनाए रखता है।
- source_word: אֲשֶׁר עָלוּ עִמּוֹ
  choice: उसके साथ गए थे
  rationale: यह उन पुरुषों की पहचान कराता है जो कालेब के साथ पहले देश में गए थे; ‘गए थे’ हिन्दी में उस पूर्ववर्ती घटना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֹא נוּכַל
  choice: हम ... नहीं कर सकते
  rationale: יכל सामर्थ्य या क्षमता को व्यक्त करता है; यह वाक्यांश उनकी कथित असमर्थता को सहज आधुनिक हिन्दी में रखता है।
- source_word: לַעֲלוֹת אֶל הָעָם
  choice: उस जाति पर चढ़ाई
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है, पर यहाँ सैन्य मुठभेड़ का प्रसंग है। ‘पर चढ़ाई करना’ इस प्रसंगगत अर्थ को स्पष्ट रखते हुए चढ़ने की छवि भी बचाता है।
- source_word: חָזָק הוּא מִמֶּנּוּ
  choice: वह हमसे अधिक शक्तिशाली है
  rationale: यह तुलना के अर्थ को बनाए रखता है। ‘वह’ सामूहिक एकवचन ‘जाति’ के अनुरूप है और मूल के एकवचन रूप को हिन्दी में भी सुरक्षित रखता है।
