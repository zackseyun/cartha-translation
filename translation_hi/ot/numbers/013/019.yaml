  text: וּ/מָ֣ה הָ/אָ֗רֶץ אֲשֶׁר הוּא֙ יֹשֵׁ֣ב בָּ֔/הּ הֲ/טוֹבָ֥ה הִ֖וא אִם רָעָ֑ה וּ/מָ֣ה הֶֽ/עָרִ֗ים אֲשֶׁר הוּא֙ יוֹשֵׁ֣ב בָּ/הֵ֔נָּה הַ/בְּ/מַֽחֲנִ֖ים אִ֥ם בְּ/מִבְצָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/019.yaml
  text: And what is the land like in which he lives? Is it good or bad? And what are the cities like in which he lives? Are they in camps or in fortifications?[a]
translation:
  language: hi
  text: और जिस देश में वे रहते हैं, वह कैसा है—अच्छा या बुरा? और जिन नगरों में वे रहते हैं, वे कैसे हैं—क्या वे छावनियों में हैं या गढ़ों में?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या वे छावनियों जैसे बसावों में हैं या गढ़बंद स्थानों में?” हिब्रू में छावनी-प्रकार के बसावों और गढ़बंद स्थानों का विरोध है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמָה הָאָרֶץ
  choice: और ... देश ... कैसा है
  rationale: यह प्रश्न देश की दशा और प्रकृति के विषय में है। आधुनिक हिन्दी में ‘देश कैसा है’ स्वाभाविक है और मूल की व्यापकता बनाए रखता है।
- source_word: אֲשֶׁר הוּא יֹשֵׁב בָּהּ
  choice: जिस देश में वे रहते हैं
  rationale: मूल में एकवचन सर्वनाम सामूहिक अर्थ में वहाँ के निवासियों को सूचित करता है। हिन्दी में आदरसूचक भ्रम से बचते हुए सामूहिक बहुवचन ‘वे’ अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֲטוֹבָה הִוא אִם רָעָה
  choice: वह ... अच्छा या बुरा
  rationale: ‘अच्छा या बुरा’ हिब्रू विशेषणों का व्यापक मूल्यांकन सुरक्षित रखता है; इसे केवल उपजाऊ या अनुपजाऊ तक सीमित नहीं किया गया।
- source_word: הֶעָרִים
  choice: नगरों
  rationale: ‘नगर’ עָרִים का मानक, गरिमापूर्ण और प्रसंगानुकूल हिन्दी रूप है।
- source_word: הַבְּמַחֲנִים
  choice: छावनियों जैसे खुले स्थानों में बसे
  rationale: מַחֲנִים का मूल अर्थ छावनियाँ या पड़ाव है। यहाँ गढ़बंद स्थानों के विपरीत खुले, असुरक्षित बसाव का भाव है; ‘जैसे’ जोड़कर नगरों को शाब्दिक छावनियाँ कहने के बजाय तुलना स्पष्ट की गई है।
- source_word: בְּמִבְצָרִים
  choice: गढ़बंद स्थानों में
  rationale: מִבְצָרִים रक्षित अथवा किलेबंद स्थानों को दर्शाता है। ‘गढ़बंद स्थान’ सैन्य-सुरक्षा का भाव स्पष्ट और संक्षिप्त रूप में देता है।
