  register: भाषा आधुनिक मानक हिन्दी में, सहज किंतु गरिमापूर्ण रखी गई है। मूल के सामूहिक एकवचन को हिन्दी में स्वाभाविक सामूहिक बहुवचन से व्यक्त किया गया है। प्रश्नों की समानांतर बनावट और खुले बनाम सुरक्षित बसाव का विरोध सुरक्षित रखा गया है।
