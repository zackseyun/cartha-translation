base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/030.yaml
  text: Then Caleb quieted the people before Moses and said[a], “Let us surely go up and take possession of it[c][b], for we are certainly able to do it.”
translation:
  language: hi
  text: तब कालेब ने मूसा के सामने लोगों को शांत किया[a] और कहा, “आओ, हम निश्चय ही चढ़ें[b] और उस देश पर अधिकार कर लें, क्योंकि हम निश्चय ही ऐसा कर सकते हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों को चुप कराया।” इब्रानी क्रिया का अर्थ शांत करना, स्थिर करना या चुप कराना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “निश्चय ही हम चढ़ें”—क्रिया पर बल देने वाली रचना है।
    reason: lexical_alternative
  - marker: c
    text: या “क्योंकि हम ऐसा करने में पूरी तरह समर्थ हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּהַס
  choice: शांत किया
  rationale: यह क्रिया भीड़ को चुप या शांत करने का भाव रखती है। ‘शांत किया’ प्रसंग में स्वाभाविक है और अनावश्यक रूप से कठोर दमन का संकेत नहीं देता।
- source_word: אֶת־הָעָם
  choice: लोगों को
  rationale: यहाँ עָם एकत्र इस्राएली समुदाय को सूचित करता है; आधुनिक हिन्दी में ‘लोगों’ सहज और स्पष्ट है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा के सामने
  rationale: אֶל का मूल भाव ‘की ओर’ है, पर इस प्रसंग में लोगों को मूसा की उपस्थिति में शांत करने का अर्थ है। ‘मूसा के सामने’ दृश्य को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עָלֹה נַעֲלֶה
  choice: हम निश्चय ही चढ़ें
  rationale: क्रिया के infinitive absolute और imperfect का मेल प्रबल आग्रह और निश्चितता व्यक्त करता है। ‘निश्चय ही’ उस बल को बनाए रखता है, जबकि मूल में न होने वाला ‘तुरन्त’ नहीं जोड़ता।
- source_word: וְיָרַשְׁנוּ אֹתָהּ
  choice: और उस देश पर अधिकार कर लें
  rationale: יָרַשׁ यहाँ कनान में प्रवेश करके उसे अपने अधिकार में लेने का भाव देता है। स्त्रीलिंग सर्वनाम का आशय देश/भूमि है, इसलिए हिन्दी में उसे स्पष्ट किया गया है।
- source_word: כִּי יָכוֹל נוּכַל
  choice: क्योंकि हम निश्चय ही ऐसा कर सकते हैं
  rationale: यह भी emphatic infinitive absolute construction है। ‘निश्चय ही’ कालेब के दृढ़ विश्वास को स्पष्ट, आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: לָהּ
  choice: ऐसा कर सकते हैं
  rationale: स्त्रीलिंग प्रत्यय भूमि की ओर संकेत करता है। हिन्दी में ‘ऐसा’ पिछले कार्य—देश पर अधिकार करने—को स्वाभाविक रूप से पुनः ग्रहण करता है, बिना ‘जीतने’ जैसी अधिक व्याख्यात्मक धारणा जोड़े।
