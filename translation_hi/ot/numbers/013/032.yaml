  text: וַ/יּוֹצִ֜יאוּ דִּבַּ֤ת הָ/אָ֨רֶץ֙ אֲשֶׁ֣ר תָּר֣וּ אֹתָ֔/הּ אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הָ/אָ֡רֶץ אֲשֶׁר֩ עָבַ֨רְנוּ בָ֜/הּ לָ/ת֣וּר אֹתָ֗/הּ אֶ֣רֶץ אֹכֶ֤לֶת יוֹשְׁבֶ֨י/הָ֙ הִ֔וא וְ/כָל הָ/עָ֛ם אֲשֶׁר רָאִ֥ינוּ בְ/תוֹכָ֖/הּ אַנְשֵׁ֥י מִדּֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/032.yaml
  text: So they brought out to the sons of Israel a bad report about the land that they had explored, saying, “The land through which we passed to explore it is a land that devours its inhabitants, and all the people whom we saw in it are men of great size.”
translation:
  language: hi
  text: तब उन्होंने इस्राएल के पुत्रों[c] को उस देश के विषय में, जिसकी उन्होंने छानबीन की थी[b], एक बुरी रिपोर्ट दी[a] और कहा, “जिस देश की छानबीन करने के लिए हम उसमें से होकर गुज़रे थे, वह ऐसा देश है जो अपने निवासियों को निगल जाता है;[d] और जितने लोगों को हमने उसमें देखा, वे सब बड़े कद-काठी वाले पुरुष थे।[e]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुरी रिपोर्ट फैलाई”; अधिक प्रबल अर्थ में, “देश को बदनाम किया।”
    reason: lexical_alternative
  - marker: b
    text: “छानबीन” का अनुवाद “टोह ली” या “जासूसी की” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी में “इस्राएल के पुत्र”; यह पूरे इस्राएली समुदाय के लिए प्रचलित सामूहिक पद है।
    reason: cultural_note
  - marker: d
    text: या “अपने निवासियों को खा जाने वाला देश।”
    reason: lexical_alternative
  - marker: e
    text: या “बड़े डील-डौल वाले पुरुष”; यहाँ अभिप्राय प्रभावशाली शारीरिक आकार से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹצִיאוּ דִּבַּת
  choice: बुरी ख़बर फैलाई
  rationale: यह संयुक्त अभिव्यक्ति किसी प्रतिकूल रिपोर्ट को लोगों के बीच निकालने या फैलाने का भाव देती है। हिंदी में ‘बुरी ख़बर फैलाई’ स्वाभाविक है और मुख्य पाठ में ‘बदनाम किया’ जैसे अधिक निर्णायक आरोप से बचती है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: इस प्रसंग में यह प्रतिज्ञात भौगोलिक भूभाग है। आधुनिक हिंदी में ‘देश’ सहज है और ‘भूमि’ की अपेक्षा कथात्मक संदर्भ में अधिक स्वाभाविक सुनाई देता है।
- source_word: תָּרוּ / לָתוּר
  choice: छानबीन की / छानबीन करने
  rationale: क्रिया किसी भूभाग को घूमकर देखने, जाँचने या टोह लेने को व्यक्त करती है। ‘छानबीन’ जाँच के भाव को रखती है, जबकि केवल गुप्तचरी का अर्थ आरोपित नहीं करती।
- source_word: אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच
  rationale: मूल का शाब्दिक सामूहिक पद ‘इस्राएल के पुत्र’ सुरक्षित रखा गया है। ‘के बीच’ रिपोर्ट फैलाने के हिंदी मुहावरे के साथ स्वाभाविक संबंध बनाता है।
- source_word: עָבַרְנוּ בָהּ
  choice: हम उसमें से होकर गए थे
  rationale: यह עבר और בְּ के गतिसूचक अर्थ को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶרֶץ אֹכֶלֶת יוֹשְׁבֶיהָ
  choice: ऐसा देश है जो अपने निवासियों को निगल जाता है
  rationale: ‘निगल जाता है’ मूल के सजीव और भयावह रूपक को बनाए रखता है; इसे सामान्य मृत्यु-दर या अकाल जैसी किसी एक व्याख्या तक सीमित नहीं करता।
- source_word: יוֹשְׁבֶיהָ
  choice: अपने निवासियों
  rationale: यह उस देश में रहने वालों के लिए स्वाभाविक आधुनिक हिंदी पद है और स्त्रीलिंग देश-संज्ञा से संबंध भी स्पष्ट करता है।
- source_word: וְכָל הָעָם אֲשֶׁר רָאִינוּ בְתוֹכָהּ
  choice: और जितने लोगों को हमने उसमें देखा, वे सब
  rationale: यह मूल के ‘सब लोग जिन्हें हमने उसके भीतर देखा’ को सहज हिंदी वाक्य-क्रम में व्यक्त करता है और कथन की सर्वसमावेशी अतिशयोक्ति बनाए रखता है।
- source_word: אַנְשֵׁי מִדּוֹת
  choice: बड़े डील-डौल वाले पुरुष
  rationale: मुहावरा प्रभावशाली शारीरिक आकार या कद-काठी बताता है। ‘डील-डौल’ सामाजिक प्रतिष्ठा के भ्रम से बचाकर शारीरिक अर्थ स्पष्ट करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का लिंगयुक्त सामूहिक पद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की संतान
  rationale: मूल का स्पष्ट रूप ‘इस्राएल के पुत्र’ है और यहाँ पूरे वाचा-समुदाय के लिए मानक नाम के रूप में प्रयुक्त है। रूप को मुख्य पाठ में सुरक्षित रखते हुए पादटिप्पणी उसके सामूहिक प्रयोग को स्पष्ट करती है।
- issue: देश द्वारा निवासियों को ‘निगलने’ का रूपक
  choice: रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखा
  alternative: ऐसा देश जहाँ लोग मर जाते हैं / जो अपने निवासियों का नाश करता है
  rationale: मूल कथन जानबूझकर सजीव किंतु कारण की दृष्टि से अस्पष्ट है। अनुवाद अकाल, युद्ध, रोग या किसी अन्य कारण का निर्णय नहीं करता।
- issue: दूतों की रिपोर्ट का नैतिक स्वरूप
  choice: बुरी ख़बर
  alternative: निंदा / झूठी बदनामी
  rationale: דִּבָּה प्रतिकूल और संभावित रूप से अपकीर्तिकारक रिपोर्ट है, पर मुख्य पाठ में उसे स्पष्टतः झूठ या कानूनी अर्थ में निंदा कहना मूल की अपेक्षा अधिक निर्णायक होगा।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप रखा गया है। ‘निगल जाता है’ मूल की तीखी आलंकारिक भाषा को सुरक्षित रखता है। ‘डील-डौल’ सामान्य पाठक के लिए शारीरिक आकार स्पष्ट करता है, और ‘इस्राएल के पुत्रों’ से स्रोत का वाचागत सामूहिक पद दिखाई देता है।
