base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/022.yaml
  text: They went up into the Negev, and he came as far as Hebron. Ahiman, Sheshai, and Talmai, the descendants of Anak, were there. Hebron had been built seven years before Zoan of Egypt.
translation:
  language: hi
  text: वे नेगेव में होकर ऊपर चढ़े, और वह हेब्रोन तक पहुँचा। वहाँ अहीमान, शेशै और तलमै, अनाक के वंशज, थे। हेब्रोन मिस्र के सोअन से सात वर्ष पहले बनाया गया था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַנֶּגֶב
  choice: नेगेव में
  rationale: यह दक्षिणी कनान के विशिष्ट भौगोलिक क्षेत्र का नाम है; केवल ‘दक्षिण’ कहने से स्थाननाम की पहचान खो सकती है।
- source_word: וַיָּבֹא
  choice: और वह ... पहुँचा
  rationale: मसोराई पाठ में क्रिया एकवचन है; इसे बहुवचन बनाकर पाठ की वास्तविक संख्या-असंगति को चुपचाप नहीं मिटाया गया।
- source_word: יְלִידֵי הָעֲנָק
  choice: अनाक की संतान
  rationale: वंशगत संबंध को स्वाभाविक हिंदी में व्यक्त करता है और अनाक को व्यक्तिवाचक नाम के रूप में सुरक्षित रखता है।
- source_word: נִבְנְתָה
  choice: बसाया गया था
  rationale: नगर के संबंध में हिब्रानी ‘बनाया गया’ का आशय नगर की स्थापना या बसावट भी हो सकता है; आधुनिक हिंदी में ‘बसाया गया’ अधिक स्वाभाविक है।
- source_word: צֹעַן מִצְרָיִם
  choice: मिस्र के सोअन
  rationale: स्थाननाम को लिप्यंतरित रखते हुए उसके मिस्र से संबंध को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
theological_decisions:
- issue: बहुवचन कर्ता के बाद एकवचन क्रिया
  choice: ‘वे ... चढ़े, और वह ... पहुँचा’
  alternative: ‘वे ... चढ़े और ... पहुँचे’
  rationale: मूल पाठ का बहुवचन से एकवचन में परिवर्तन संरक्षित है। इसका संदर्भ अस्पष्ट है, इसलिए किसी विशेष जासूस की पहचान नहीं जोड़ी गई और न ही व्याकरण को समतल किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्थाननाम प्रचलित बाइबलीय हिंदी रूपों में लिप्यंतरित हैं। मूल पाठ की असामान्य संख्या-असंगति जानबूझकर सुरक्षित रखी गई है।
