source:
  edition: WLC
  text: וּ/רְאִיתֶ֥ם אֶת הָ/אָ֖רֶץ מַה הִ֑וא וְ/אֶת הָ/עָם֙ הַ/יֹּשֵׁ֣ב עָלֶ֔י/הָ הֶ/חָזָ֥ק הוּא֙ הֲ/רָפֶ֔ה הַ/מְעַ֥ט ה֖וּא אִם רָֽב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/018.yaml
  text: See what the land is like[a], and whether the people who dwell in it are strong or weak[b], whether they are few or many.
translation:
  language: hi
  text: और देखो कि वह देश कैसा है,[a] और जो लोग उसमें रहते हैं वे बलवान हैं या निर्बल, थोड़े हैं या बहुत।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वह क्या है।” यहाँ आशय देश की दशा और विशेषताओं का आकलन करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: और देखो
  rationale: ראה का रूप संदर्भ में मूसा के निर्देश को आगे बढ़ाता है। ‘देखो’ निरीक्षण और आकलन—दोनों का स्वाभाविक भाव देता है।
- source_word: הָאָרֶץ מַה הִוא
  choice: वह देश कैसा है
  rationale: शाब्दिक रूप से ‘वह क्या है’; यहाँ प्रश्न देश की पहचान नहीं, बल्कि उसकी दशा और विशेषताओं के आकलन का है।
- source_word: הָעָם הַיֹּשֵׁב עָלֶיהָ
  choice: जो लोग उसमें रहते हैं
  rationale: עַל का शाब्दिक अर्थ ‘उस पर’ है, पर देश के निवासियों के लिए आधुनिक हिन्दी में ‘उसमें रहते हैं’ अधिक स्वाभाविक है।
- source_word: הֶחָזָק
  choice: बलवान
  rationale: חזק यहाँ लोगों की सामर्थ्य का संकेत देता है; ‘बलवान’ dignified और स्पष्ट हिन्दी है।
- source_word: הֲרָפֶה
  choice: निर्बल
  rationale: רפה यहाँ חזק के विपरीत शक्ति की कमी बताता है; ‘निर्बल’ उसी स्पष्ट विरोध को बनाए रखता है।
- source_word: הַמְעַט
  choice: थोड़े
  rationale: यह संख्या की अल्पता बताता है और רָב के साथ सीधा विरोध बनाता है।
- source_word: רָב
  choice: बहुत
  rationale: यह लोगों की बड़ी संख्या बताता है; ‘थोड़े ... या बहुत’ आधुनिक हिन्दी में सहज संख्यात्मक विरोध है।
- source_word: אִם
  choice: या
  rationale: इस अप्रत्यक्ष द्विकल्पी प्रश्न में हिन्दी का ‘या’ मूल के ‘थोड़े अथवा बहुत’ विकल्प को स्वाभाविक रूप से व्यक्त करता है।
