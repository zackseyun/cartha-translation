  yaml_path: translation/ot/numbers/013/016.yaml
  text: These are the names of the men whom Moses sent to scout out the land[c][b][a]. And Moses called Hoshea son of Nun Joshua.
translation:
  language: hi
  text: ये उन पुरुषों के नाम हैं जिन्हें मूसा ने देश की टोह लेने के लिए भेजा था।[a] और मूसा ने नून के पुत्र होशे का नाम यहोशू रखा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “देश की छानबीन करने के लिए” अथवा “देश का भेद लेने के लिए।” इब्रानी क्रिया निरीक्षण, खोजबीन या टोही जाँच का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: होशे इस व्यक्ति का पहले का नाम था; यहाँ मूसा उसका नाम यहोशू रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה שְׁמוֹת הָאֲנָשִׁים
  choice: ये उन पुरुषों के नाम हैं
  rationale: सूची का सार प्रस्तुत करने वाली इब्रानी अभिव्यक्ति को स्वाभाविक वर्तमानकालीन हिन्दी में रखा गया है; संदर्भ में पुरुष प्रतिनिधि ही अभिप्रेत हैं।
- source_word: לָתוּר אֶת־הָאָרֶץ
  choice: देश का भेद लेने के लिए
  rationale: תור यहाँ निरीक्षण और टोह लेने के अर्थ में है। ‘भेद लेना’ आधुनिक हिन्दी में टोही उद्देश्य को स्पष्ट करता है, पर केवल गुप्तचरी तक अर्थ को सीमित नहीं करता।
- source_word: וַיִּקְרָא ... יְהוֹשֻׁעַ
  choice: का नाम यहोशू रखा
  rationale: नाम देने की क्रिया को हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है, जबकि पद में होशे और यहोशू दोनों नाम सुरक्षित रहते हैं।
- source_word: לְהוֹשֵׁעַ בִּן־נוּן
  choice: नून के पुत्र होशे
  rationale: इब्रानी नामों का प्रचलित हिन्दी लिप्यंतरण और स्वाभाविक हिन्दी संबंध-रचना अपनाई गई है।
