    reason: alternative_reading
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब … ने … कहा
  rationale: वाव-क्रमागत रूप कथा में अगली घटना प्रस्तुत करता है। हिन्दी में ‘तब’ कथात्मक क्रम को स्वाभाविक बनाता है; ‘कहा’ यहाँ דבר और उसके बाद आने वाले לֵאמֹר के संयुक्त वाक्य-सूत्र का सहज रूप है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया जाता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अनन्त क्रियारूप प्रत्यक्ष वचन का परिचय देता है। शाब्दिक ‘यह कहते हुए’ की अपेक्षा ‘कहा’ आधुनिक हिन्दी में अधिक स्वाभाविक है और अगले पद के कथन की भूमिका बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला नाम-रूप है और इसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता; मूल उच्चारण की पूर्ण निश्चितता न होने के कारण ‘याहवे’ भी संभव लिप्यंतरण है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। मूल के ‘बोला … यह कहते हुए’ सूत्र को हिन्दी के स्वाभाविक ‘ने … से कहा’ में समेटा गया है।
