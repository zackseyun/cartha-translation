    rationale: The English audit trail deliberately uses ‘Yahweh,’ not ‘Jehovah.’ Hindi ‘याहवे’ is the corresponding transliteration. A note can acknowledge the familiar traditional form ‘यहोवा’ without treating it as the main rendering.
