  text: וְ/שָׁ֣ם רָאִ֗ינוּ אֶת הַ/נְּפִילִ֛ים בְּנֵ֥י עֲנָ֖ק מִן הַ/נְּפִלִ֑ים וַ/נְּהִ֤י בְ/עֵינֵ֨י/נוּ֙ כַּֽ/חֲגָבִ֔ים וְ/כֵ֥ן הָיִ֖ינוּ בְּ/עֵינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/033.yaml
  text: And there we saw the Nephilim—the sons of Anak[a], from the Nephilim—and we seemed in our own eyes like grasshoppers, and so we were in their eyes.
translation:
  language: hi
  text: और वहाँ हमने नफ़ीलीम[a] को देखा—अनाक के वंशज, जो नफ़ीलीम में से थे। हमें अपनी ही नज़रों में ऐसा लगा मानो हम टिड्डे हों, और उनकी नज़रों में भी हम ऐसे ही थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परंपरागत अनुवाद में ‘नफ़ीलीम’ के लिए ‘दैत्य’ भी मिलता है। इब्रानी शब्द का अर्थ अनिश्चित है, इसलिए मुख्य पाठ में उसका लिप्यंतरण किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנְּפִילִים
  choice: नफ़ीलीम
  rationale: इस इब्रानी पद का आशय और संकेतित समुदाय अनिश्चित है; इसलिए ‘दैत्य’ या ‘गिरे हुए’ जैसी व्याख्या आरोपित करने के बजाय लिप्यंतरण रखा गया है।
- source_word: בְּנֵי עֲנָק
  choice: अनाक के वंशज
  rationale: शाब्दिक ‘अनाक के पुत्र’ यहाँ कुल या वंश को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ वही अर्थ अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הַנְּפִלִים
  choice: जो नफ़ीलीम में से थे
  rationale: מִן संबंध, समूह-सदस्यता या उद्गम का संकेत दे सकता है। ‘में से थे’ वाक्य-संदर्भ में स्वाभाविक है और संबंध को जरूरत से अधिक निश्चित नहीं करता।
- source_word: וַנְּהִי בְעֵינֵינוּ
  choice: हमें अपनी ही नज़रों में ऐसा लगा
  rationale: यह मुहावरा वास्तविक रूपांतरण नहीं, बल्कि स्वयं के विषय में धारणा व्यक्त करता है।
- source_word: כַּחֲגָבִים
  choice: मानो हम टिड्डे हों
  rationale: חָגָב छोटे टिड्डे/ग्रासहॉपर जैसे कीट के लिए आता है; यहाँ छोटापन दिखाने वाली उपमा को ‘टिड्डे’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכֵן הָיִינוּ בְּעֵינֵיהֶם
  choice: और उनकी नज़रों में भी हम ऐसे ही थे
  rationale: यह पहले खंड की दृष्टि-संबंधी भाषा और अलंकारिक समानांतरता बनाए रखता है।
theological_decisions:
- issue: נְפִילִים का अर्थ
  choice: मुख्य पाठ में ‘नफ़ीलीम’ का लिप्यंतरण
  alternative: दैत्य; गिरे हुए
  rationale: उत्पत्ति 6:4 से जुड़ा यह पद विवादित और सांस्कृतिक रूप से अर्थभारित है। लिप्यंतरण मूल की अनिश्चितता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
- issue: בְּנֵי עֲנָק और מִן הַנְּפִלִים का पारस्परिक संबंध
  choice: ‘अनाक के वंशज, जो नफ़ीलीम में से थे’
  alternative: अनाक के पुत्र, नफ़ीलीम के वंशज
  rationale: इब्रानी रचना दोनों समूहों का संबंध बताती है, पर उसकी सटीक प्रकृति को पूरी तरह स्पष्ट नहीं करती। चुनी हुई भाषा समूह-संबंध बताती है, पर वंशावली को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘नज़रों में’ दोनों समानांतर वाक्यांशों में इब्रानी मुहावरे की पुनरावृत्ति बचाता है। ‘नफ़ीलीम’ को देवनागरी में लिप्यंतरित किया गया है और पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदबंध के बाद दिया गया है।
