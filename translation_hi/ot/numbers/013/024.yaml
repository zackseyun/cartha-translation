  text: That place was called the Valley of Eshcol because of the cluster that the sons of Israel cut from there[a][b][c].
translation:
  language: hi
  text: उस स्थान को एश्कोल की घाटी[a][b] कहा गया, क्योंकि इस्राएल के पुत्रों ने वहाँ से वह गुच्छा काटा था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘एश्कोल का नाला’ अथवा ‘एश्कोल की खड्ड’; इब्रानी नाख़ाल मौसमी जलधारा के तल या उससे जुड़ी घाटी को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘एश्कोल’ सुनने में ‘गुच्छा’ अर्थ वाले इब्रानी शब्द जैसा ही है। इस स्थान का यह नाम वहाँ काटे गए गुच्छे के कारण पड़ा।
    reason: cultural_note
  - marker: c
    text: या ‘इस्राएलियों ने’ अथवा ‘इस्राएल की सन्तानों ने’।
    reason: lexical_alternative
lexical_decisions:
- source_word: לַמָּקוֹם הַהוּא
  choice: उस स्थान
  rationale: निश्चित संकेतवाचक पद पहले बताए गए स्थल की ओर संकेत करता है; ‘उस स्थान’ स्वाभाविक और सटीक हिन्दी है।
- source_word: קָרָא
  choice: का नाम ... पड़ा
  rationale: इब्रानी में क्रिया एकवचन पुल्लिंग सक्रिय है, पर कर्ता अनिर्दिष्ट है और रचना नामकरण बताती है। हिन्दी में ‘नाम ... पड़ा’ इस भाव का स्वाभाविक अकर्मक रूप है और किसी अज्ञात ‘उसने’ को नहीं जोड़ता।
- source_word: נַחַל
  choice: घाटी
  rationale: נחל मौसमी जलधारा के तल, नाले या उससे जुड़ी घाटी को सूचित कर सकता है। स्थलनाम में ‘घाटी’ सहज है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: אֶשְׁכּוֹל
  choice: एश्कोल
  rationale: यहाँ यह स्थलनाम का अंग है, इसलिए अर्थानुवाद के बजाय देवनागरी लिप्यंतरण किया गया है।
- source_word: עַל אֹדוֹת
  choice: क्योंकि
  rationale: यह पद नामकरण का कारण बताता है; हिन्दी में ‘क्योंकि’ कारण-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאֶשְׁכּוֹל
  choice: वह गुच्छा
  rationale: संज्ञा का अर्थ ‘गुच्छा’ है और निश्चित उपपद पूर्वपद में बताए गुच्छे की ओर संकेत करता है। पिछले पद से अंगूर का संदर्भ स्पष्ट होने के कारण ‘अंगूरों का’ मुख्य पाठ में नहीं जोड़ा गया।
- source_word: אֲשֶׁר כָּרְתוּ
  choice: काटा था
  rationale: כרת का मूल भाव काटना या काट अलग करना है। फल के गुच्छे के संदर्भ में ‘काटा था’ संक्षिप्त और स्वाभाविक है; पूर्ण भूतकाल पूर्व घटना को स्पष्ट करता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: स्थान-सूचक भाव को बिना अनावश्यक विस्तार के बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पारिवारिक अभिव्यक्ति और उसके पुल्लिंग रूप को निकटता से सुरक्षित रखता है; आधुनिक सहज विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों / इस्राएल की सन्तानों
  rationale: यह मानक सामुदायिक नाम होते हुए भी शाब्दिक रूप से ‘इस्राएल के पुत्र’ है। मुख्य पाठ स्रोत की पारिवारिक और लिंग-सूचक बनावट रखता है, जबकि अधिक प्रचलित सामुदायिक विकल्प पादटिप्पणी में उपलब्ध हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘नाम ... पड़ा’ हिन्दी के स्वाभाविक नामकरण-वाक्य का प्रयोग है। ‘एश्कोल’ को प्रचलित बाइबलीय देवनागरी रूप में रखा गया है; शब्द-क्रीड़ा और נחל की भौगोलिक अस्पष्टता पादटिप्पणियों में सुरक्षित हैं।
