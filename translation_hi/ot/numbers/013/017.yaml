base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/017.yaml
  text: Moses sent them to scout out the land of Canaan[a], and he said to them, “Go up this way into the Negev[c][b], and go up into the hill country.”
translation:
  language: hi
  text: मूसा ने उन्हें कनान की भूमि की टोह लेने[a] भेजा और उनसे कहा, “इस ओर से नेगेव[b] में चढ़ जाओ, फिर पहाड़ी प्रदेश में चढ़ जाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जाँच-पड़ताल करने।”
    reason: lexical_alternative
  - marker: b
    text: नेगेव दक्षिण का शुष्क क्षेत्र था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: שׁלח के सामान्य कथात्मक अर्थ को सहज और औपचारिक हिन्दी में व्यक्त करता है।
- source_word: לָתוּר
  choice: भेद लेने
  rationale: यहाँ תור भूमि की जाँच-पड़ताल और टोह लेने को दर्शाता है; ‘भेद लेने’ से उद्देश्य स्पष्ट होता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֶרֶץ כְּנָעַן
  choice: कनान देश
  rationale: भौगोलिक नाम के साथ אֶרֶץ की पूर्ण अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עֲלוּ זֶה
  choice: इधर से ... चढ़ जाओ
  rationale: आज्ञार्थक עלה और क्रियाविशेषण-सदृश זֶה को मार्ग-सूचक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּנֶּגֶב
  choice: नेगेव में
  rationale: नेगेव को विशिष्ट दक्षिणी शुष्क भूभाग के भौगोलिक नाम के रूप में रखता है; בְּ के स्थानीय/दिशात्मक भाव को ‘में’ से व्यक्त किया गया है।
- source_word: וַעֲלִיתֶם
  choice: फिर ... चढ़ना
  rationale: वाव सहित पूर्ण क्रिया यहाँ पिछली आज्ञा को आगे बढ़ाती है; हिन्दी में ‘फिर’ और आज्ञार्थक ‘चढ़ना’ निर्देश-क्रम को सहज बनाते हैं।
- source_word: הָהָר
  choice: पहाड़ी प्रदेश
  rationale: संदर्भ में यह किसी एक पहाड़ के बजाय ऊँचे पहाड़ी भूभाग को सूचित करता है।
