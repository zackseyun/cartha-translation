  terminology: ‘नेगेव’ is appropriately retained as a geographic name. ‘पहाड़ी प्रदेश’ suitably conveys the contextual regional sense of הָהָר. The Negev note is adjusted to describe the region without unnecessarily narrowing the Hebrew wording.
