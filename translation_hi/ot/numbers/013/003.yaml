source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח אֹתָ֥/ם מֹשֶׁ֛ה מִ/מִּדְבַּ֥ר פָּארָ֖ן עַל פִּ֣י יְהוָ֑ה כֻּלָּ֣/ם אֲנָשִׁ֔ים רָאשֵׁ֥י בְנֵֽי יִשְׂרָאֵ֖ל הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/003.yaml
  text: So Moses sent them from the wilderness of Paran at the command of Yahweh[a]. All of them were men[b], heads of the sons of Israel.
translation:
  language: hi
  text: तब मूसा ने उन्हें यहोवा[a] की आज्ञा के अनुसार पारान के निर्जन प्रदेश से भेजा। वे सभी पुरुष थे—इस्राएलियों के प्रधान[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा के वचन के अनुसार।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “यहोवा के मुख के अनुसार।”
    reason: lexical_alternative
  - marker: b
    text: या, “इस्राएल के पुत्रों के प्रधान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח אֹתָם מֹשֶׁה
  choice: तब मूसा ने उन्हें ... भेजा
  rationale: वाव-क्रमिक क्रिया कथा को आगे बढ़ाती है; ‘तब’ और सामान्य भूतकाल हिंदी में स्वाभाविक कथात्मक प्रवाह देते हैं।
- source_word: מִמִּדְבַּר פָּארָן
  choice: पारान के निर्जन प्रदेश से
  rationale: מִדְבָּר अनिवार्यतः रेतीला मरुस्थल नहीं, बल्कि निर्जन या कम आबाद भूभाग भी दर्शाता है; ‘निर्जन प्रदेश’ अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: עַל פִּי יְהוָה
  choice: यहोवा की आज्ञा के अनुसार
  rationale: शाब्दिक मुहावरा ‘यहोवा के मुख पर/अनुसार’ यहाँ उनके निर्देश या आदेश के अनुरूप कार्य करने का अर्थ देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ मूल चार-अक्षरीय व्यक्तिगत नाम को उपाधि से अलग बनाए रखता है।
- source_word: כֻּלָּם אֲנָשִׁים
  choice: वे सभी पुरुष थे
  rationale: כֻּלָּם समूह की समग्रता पर बल देता है और אֲנָשִׁים इस प्रसंग में पुरुष प्रतिनिधियों को सूचित करता है।
- source_word: רָאשֵׁי בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के प्रधान
  rationale: רָאשֵׁי का नेतृत्व-सूचक अर्थ ‘प्रधान’ से व्यक्त होता है। ‘इस्राएली’ आधुनिक हिंदी में בְנֵי יִשְׂרָאֵל का सहज सामुदायिक रूप है; शाब्दिक पारिवारिक अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- source_word: הֵמָּה
  choice: वे ... थे
  rationale: स्वतंत्र सर्वनाम का बल ‘वे सभी’ में स्वाभाविक रूप से समाहित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम रखता है। ‘यहोवा’ हिंदी पाठकों में स्थापित नाम-रूप है और इसे केवल ‘प्रभु’ उपाधि से प्रतिस्थापित नहीं करता।
- issue: אֲנָשִׁים और בְנֵי יִשְׂרָאֵל में लिंग तथा सामुदायिक भाषा
  choice: पुरुष ... इस्राएलियों
  alternative: मनुष्य ... इस्राएल के पुत्रों
  rationale: प्रतिनिधि पुरुष थे, इसलिए ‘पुरुष’ रखा गया है। בְנֵי יִשְׂרָאֵל का जातीय-सामुदायिक अर्थ मुख्य पाठ में सहज ‘इस्राएलियों’ से दिया गया है, जबकि उसका शाब्दिक रूप पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘निर्जन प्रदेश’ मִדְבָּר की व्यापक भौगोलिक अर्थ-सीमा रखता है; ‘प्रधान’ नेतृत्व का संक्षिप्त और परिचित पद है।
