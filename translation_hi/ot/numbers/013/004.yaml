  text: 'And these were their names: from the tribe of Reuben, Shammua son of Zaccur.'
translation:
  language: hi
  text: 'और उनके नाम ये थे: रूबेन के गोत्र से, ज़क्कूर का पुत्र शम्मूआ।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और … ये
  rationale: וְ को सूची और पिछले कथन की निरंतरता दिखाने के लिए ‘और’ तथा אֵלֶּה को स्वाभाविक हिन्दी वाक्य-विन्यास में ‘ये’ किया गया है।
- source_word: שְׁמוֹתָם
  choice: उनके नाम … थे
  rationale: इब्रानी में शाब्दिक रूप से ‘उनके नाम’ है; हिन्दी में सूची की भूमिका स्वाभाविक ढंग से प्रस्तुत करने के लिए संयोजक क्रिया ‘थे’ जोड़ी गई है।
- source_word: לְמַטֵּה רְאוּבֵן
  choice: रूबेन के गोत्र से
  rationale: इस सूची में לְמַטֵּה किसी गोत्र से प्रतिनिधि के संबंध या चयन को बताता है; ‘के गोत्र से’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: שַׁמּוּעַ
  choice: शम्मूआ
  rationale: व्यक्तिवाचक नाम को उसके इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-संबंध बताने वाले בֶּן का स्वाभाविक और गरिमापूर्ण हिन्दी रूप ‘का पुत्र’ है।
- source_word: זַכּוּר
  choice: ज़क्कूर
  rationale: व्यक्तिवाचक नाम को इब्रानी ध्वनि के निकट देवनागरी में लिप्यंतरित किया गया है।
