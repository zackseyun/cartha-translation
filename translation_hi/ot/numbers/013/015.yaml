- source_word: גְּאוּאֵל
  choice: गूएल
  rationale: व्यक्तिनाम को इब्रानी उच्चारण के निकट देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֶּן
  choice: का पुत्र
  rationale: इब्रानी वंशसूचक रचना का स्वाभाविक हिन्दी रूप; नाम के साथ पिता-पुत्र संबंध स्पष्ट करता है।
- source_word: מָכִי
  choice: माकी
  rationale: व्यक्तिनाम को इब्रानी रूप के निकट देवनागरी में लिप्यंतरित किया गया है।
