base_translation:
  language: en
  yaml_path: translation/ot/numbers/013/023.yaml
  text: They came to the Valley of Eshcol[a], and from there they cut down a branch with a single cluster of grapes, and two of them carried it on a pole[b]; they also took some of the pomegranates and some of the figs.
translation:
  language: hi
  text: वे एशकोल की घाटी[a] तक पहुँचे। वहाँ से उन्होंने अंगूर की बेल की एक डाली काटी, जिस पर अंगूर का एक गुच्छा था; दो जनों ने उसे एक डंडे पर रखकर ले गए[b]। उन्होंने कुछ अनार और कुछ अंजीर भी लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एशकोल की खड्ड” अथवा “एशकोल की मौसमी जलधारा।” इब्रानी נַחַל किसी घाटी या खड्ड के साथ-साथ मौसमी जलधारा को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अंगूर की एक गुच्छी लगी दाखलता की डाली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נַחַל אֶשְׁכֹּל
  choice: एशकोल की घाटी
  rationale: נַחַל घाटी, खड्ड या मौसमी जलधारा का बोध करा सकता है। सामान्य पाठक के लिए ‘घाटी’ स्वाभाविक है; अन्य भौगोलिक संभावनाएँ पादटिप्पणी में रखी गई हैं।
- source_word: זְמוֹרָה
  choice: डाली
  rationale: यह शब्द विशेष रूप से दाखलता की डाली को सूचित करता है। अगले पदबंध में अंगूर स्पष्ट होने के कारण मुख्य पाठ में संक्षिप्त ‘डाली’ पर्याप्त और स्वाभाविक है।
- source_word: אֶשְׁכּוֹל עֲנָבִים אֶחָד
  choice: अंगूर की एक गुच्छी
  rationale: इब्रानी पदबंध का एकवचन और परिमाण स्पष्ट रखा गया है। आधुनिक मानक हिन्दी में अंगूर के समूह के लिए ‘गुच्छी’ सहज है।
- source_word: וַיִּשָּׂאֻהוּ
  choice: उसे ... दो जनों ने उठाया
  rationale: एकवचन कर्म-सर्वनाम को काटी गई डाली और उससे लगी गुच्छी के संयुक्त भार के रूप में रखा गया है। ‘उठाया’ में वहन का भाव प्रसंग से स्पष्ट है।
- source_word: בַמּוֹט
  choice: एक डंडे पर रखकर
  rationale: מוֹט वहन के लिए प्रयुक्त डंडे या बल्ले को दर्शाता है। ‘डंडे पर रखकर’ हिन्दी में परिवहन की छवि स्पष्ट करता है।
- source_word: בִּשְׁנָיִם
  choice: दो जनों ने
  rationale: शाब्दिक अर्थ ‘दो के द्वारा’ है। ‘दो जनों ने’ लिंग को अनावश्यक रूप से निर्दिष्ट किए बिना निहित कर्ताओं को स्पष्ट करता है।
- source_word: וּמִן הָרִמֹּנִים וּמִן הַתְּאֵנִים
  choice: कुछ अनार और कुछ अंजीर भी लिए
  rationale: इब्रानी में पहले क्रियाकलाप से ‘लेना’ निहित है; हिन्दी में इसे स्पष्ट करने से वाक्य स्वाभाविक बनता है और दोनों फलों के साथ מִן का आंशिक भाव ‘कुछ’ द्वारा सुरक्षित रहता है।
