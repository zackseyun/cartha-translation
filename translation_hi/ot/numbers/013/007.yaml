lexical_decisions:
- source_word: לְמַטֵּה
  choice: के गोत्र से
  rationale: प्रतिनिधियों की इस सूची में לְ उपसर्ग सहित מַטֶּה उस गोत्र को बताता है जिसका प्रतिनिधित्व नामित व्यक्ति करता है। हिंदी में ‘के गोत्र से’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: יִשָּׂשכָר
  choice: इस्साकार
  rationale: हिब्रू नाम का हिंदी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: יִגְאָל
  choice: यिगाल
  rationale: हिब्रू व्यंजन और उच्चारण के निकट देवनागरी लिप्यंतरण; यह नाम का अर्थानुवाद नहीं करता।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-सूचक परिचय में इसका सीधा अर्थ ‘पुत्र’ है; निकट संदर्भ में व्यापक ‘वंशज’ अर्थ लेने का कोई कारण नहीं है।
- source_word: יוֹסֵף
  choice: योसेफ
  rationale: हिब्रू व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
