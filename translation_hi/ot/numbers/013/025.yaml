- source_word: מִתּוּר
  choice: भेद लेकर
  rationale: תור यहाँ किसी क्षेत्र को देखकर और जाँचकर जानकारी जुटाने के अभियान को दर्शाता है। प्रसंग में ‘भेद लेना’ इस टोही अर्थ को साधारण, स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘जासूसी करना’ अनावश्यक रूप से अधिक नकारात्मक हो सकता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: אָרֶץ यहाँ जाँच किए जा रहे विशिष्ट भूभाग को दर्शाता है। पूर्व प्रसंग में बताए गए देश की ओर संकेत होने के कारण ‘उस देश’ स्वाभाविक है।
- source_word: מִקֵּץ
  choice: पूरे होने पर
  rationale: מִקֵּץ अवधि की समाप्ति या पूर्णता का बिंदु बताता है; ‘पूरे होने पर’ हिन्दी में यही अर्थ स्पष्ट और सहज रूप से देता है।
- source_word: אַרְבָּעִים יוֹם
  choice: चालीस दिन
  rationale: यह संख्या और समय-माप की सीधी अभिव्यक्ति है; हिन्दी में ‘चालीस दिन’ इसका स्वाभाविक रूप है।
