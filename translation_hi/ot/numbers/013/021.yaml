  yaml_path: translation/ot/numbers/013/021.yaml
  text: So they went up and spied out the land from the wilderness of Zin as far as Rehob[a], at Lebo-hamath.
translation:
  language: hi
  text: तब वे ऊपर गए और सीन की मरुभूमि से लेकर रहोब तक, लबो-हमात की ओर, देश की टोह ली।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: वे ऊपर गए
  rationale: עלה की दिशात्मक भावना को स्वाभाविक हिन्दी में बनाए रखता है; यात्रा-वर्णन में यह केवल ‘गए’ से अधिक सटीक है।
- source_word: וַיָּתֻרוּ
  choice: टोह लेते गए
  rationale: इस प्रसंग में תור नियुक्त लोगों द्वारा देश का निरीक्षण और सामरिक जानकारी लेना दर्शाता है; ‘टोह लेना’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: प्रसंग में संकेत कनान देश की ओर है; ‘उस देश’ हिन्दी कथानक में निश्चित संदर्भ को स्पष्ट और सहज रखता है।
- source_word: מִמִּדְבַּר צִן
  choice: सीन के निर्जन प्रदेश से
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं, बल्कि विरल आबादी वाला वन्य क्षेत्र भी हो सकता है; ‘निर्जन प्रदेश’ अर्थ-सीमा को उचित रूप से बनाए रखता है।
- source_word: עַד רְחֹב
  choice: रहोब तक
  rationale: עַד सर्वेक्षण की भौगोलिक सीमा बताता है; ‘तक’ संक्षिप्त और सटीक है।
- source_word: לְבֹא חֲמָת
  choice: लबो-हमात के पास
  rationale: व्यंजना को संभावित स्थान-नाम मानकर लिप्यंतरित किया गया है। לְ का स्थानगत संबंध ‘के पास’ से व्यक्त होता है, जबकि वर्णनात्मक पाठ की संभावना पादटिप्पणी में सुरक्षित है।
