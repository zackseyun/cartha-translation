  yaml_path: translation/ot/numbers/013/027.yaml
  text: They reported to him and said[a], “We came into the land to which you sent us. It truly flows with milk and honey, and this is its fruit.”
translation:
  language: hi
  text: उन्होंने उसे बताया और कहा, “हम उस देश में पहुँचे जहाँ तूने हमें भेजा था। वह सचमुच दूध और मधु की धाराओं से भरपूर है[a], और यह उसका फल है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और सचमुच वह दूध और मधु की धाराओं से भरपूर है।” हिब्रू में וְגַם देश की प्रचुरता के इस कथन पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסַפְּרוּ
  choice: उन्होंने उसे अपना हाल सुनाया
  rationale: पिएल रूप का अर्थ यहाँ जासूसों द्वारा अपना प्रतिवेदन सुनाना है; ‘अपना हाल सुनाया’ सामान्य पाठक के लिए स्वाभाविक है और औपचारिक रिपोर्ट का भाव भी रखता है।
- source_word: בָּאנוּ אֶל הָאָרֶץ
  choice: हम उस देश में पहुँचे
  rationale: בוא के आने/प्रवेश करने और אֶל के गंतव्य—दोनों भावों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְגַם
  choice: सचमुच
  rationale: यह संयोजन देश की समृद्धि के कथन पर बल देता है; ‘सचमुच’ उस पुष्टिकारक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זָבַת חָלָב וּדְבַשׁ
  choice: दूध और मधु की धाराएँ बहाने वाला देश
  rationale: हिब्रू मुहावरे की सजीव छवि और कृषि-समृद्धि का आशय दोनों बनाए रखता है।
- source_word: וְזֶה פִּרְיָהּ
  choice: और यह उसका फल है
  rationale: प्रदर्शनवाचक ‘यह’ सामने लाए गए फल को प्रत्यक्ष प्रमाण के रूप में प्रस्तुत करता है।
