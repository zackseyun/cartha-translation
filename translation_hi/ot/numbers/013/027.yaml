  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज रूप। मूसा के लिए मूल के एकवचन सर्वनाम के अनुरूप ‘उसे/तूने’ रखा गया है; दूध और मधु वाली हिब्रू छवि को संक्षिप्त व्याख्यात्मक मुहावरे में सुरक्षित रखा गया है।
