source:
  edition: WLC
  text: וְ/הִשְׁקָה֙ אֶת הָ֣/אִשָּׁ֔ה אֶת מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִ֑ים וּ/בָ֥אוּ בָ֛/הּ הַ/מַּ֥יִם הַֽ/מְאָרֲרִ֖ים לְ/מָרִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/024.yaml
  text: Then he shall make the woman drink the bitter water that brings a curse[b][a], and the curse-bringing water shall enter into her bitterly.
translation:
  language: hi
  text: फिर वह उस स्त्री को वह कड़वा जल पिलाएगा जो शाप लाता है[a]; और शाप लाने वाला जल उसके भीतर कड़वाहट के रूप में प्रवेश करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी अनुवाद किया जा सकता है: ‘कड़वाहट का वह जल जो शाप लाता है।’ इब्रानी में ‘जल’ बहुवचन रूप में है, जो जल के लिए एक सामान्य इब्रानी प्रयोग है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָה
  choice: फिर वह ... पिलाए
  rationale: שׁקה के हिफ़ईल रूप का अर्थ किसी को पीने देना या पिलाना है। हिन्दी में ‘पिलाए’ कारणवाचक अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री को
  rationale: निश्चित संज्ञा का सीधा अनुवाद; प्रसंग में पहले से उल्लिखित स्त्री के लिए ‘उस स्त्री’ स्वाभाविक है।
- source_word: מֵי הַמָּרִים
  choice: वह कड़वा जल
  rationale: शाब्दिक रूप से ‘कड़वाहट का जल’। द्रव्यवाचक ‘जल’ हिन्दी में स्वाभाविक है और ‘कड़वा’ उसके गुण को स्पष्ट रखता है।
- source_word: הַמְאָרֲרִים
  choice: जो शाप लाता है / शाप लाने वाला
  rationale: ארר से बना कृदन्त जल की शाप को प्रभावी करने या वहन करने वाली भूमिका बताता है; ‘शापित जल’ कहने से उत्पन्न होने वाली अस्पष्टता से बचते हुए मूल की क्रियात्मक शक्ति रखी गई है।
- source_word: וּבָאוּ בָהּ
  choice: उसके भीतर जाकर
  rationale: בוא के साथ ב उसके शरीर के भीतर प्रवेश को सूचित करता है। हिन्दी में ‘उसके भीतर जाकर’ स्वाभाविक है।
- source_word: לְמָרִים
  choice: कड़वाहट उत्पन्न करेगा
  rationale: לְמָרִים परिणाम या प्रभाव व्यक्त कर सकता है। यह अनुवाद हानिकारक कड़वाहट के परिणाम को बताता है, पर उसकी शारीरिक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: परीक्षा-विधि में शाप से जल का संबंध
  choice: जल को ‘शाप लाने वाला’ कहा गया है।
  alternative: ‘शापित जल’
  rationale: इब्रानी कृदन्त जल को केवल स्वयं शापित बताने के बजाय शाप के प्रभाव को लाने या कार्यान्वित करने वाला दर्शाता है। इससे पाठ की न्यायिक-विधिक शक्ति बनी रहती है और जादुई अर्थ आरोपित नहीं होता।
- issue: לְמָרִים में परिणाम की प्रकृति
  choice: ‘कड़वाहट उत्पन्न करेगा’
  alternative: ‘कड़वाहट के लिए’ या ‘कड़वे रूप में’
  rationale: मूल वाक्यांश परिणाम या प्रभाव के विषय में संक्षिप्त और कुछ हद तक अस्पष्ट है। हिन्दी में अर्थपूर्ण वाक्य बनाते हुए शारीरिक परिणाम को अधिक विशिष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण विधिक-वर्णनात्मक शैली रखी गई है। ‘जल’ ने बाइबलीय प्रसंग की गरिमा बनाए रखी है, जबकि वाक्य-संरचना सामान्य पाठक के लिए स्पष्ट है।
