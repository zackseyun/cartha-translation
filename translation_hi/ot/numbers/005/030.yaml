base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/030.yaml
  text: or when a spirit of jealousy comes over a man[a], and he is jealous of his wife, and he brings the woman before Yahweh[b], and the priest shall do to her all this law.
translation:
  language: hi
  text: या जब किसी पुरुष पर ईर्ष्या की आत्मा आ जाए[a] और वह अपनी पत्नी के विषय में ईर्ष्यालु हो, तब वह उस स्त्री को याहवे के सामने खड़ा करे, और याजक उसके लिए यह सारी व्यवस्था पूरी करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उस पर आ जाए”; शाब्दिक रूप से, “उसके ऊपर से गुज़रे।”
    reason: lexical_alternative
  - marker: b
    text: या, “यह सारा निर्देश,” “यह सारी विधि,” या “यह सारा अनुष्ठान।”
    reason: lexical_alternative
lexical_decisions:
- source_word: א֣וֹ
  choice: या उस पुरुष की दशा में
  rationale: यह पहले से चल रहे वाक्य में दूसरा विकल्प प्रस्तुत करता है। हिन्दी में यह रूप संबंधसूचक उपवाक्य के साथ स्वाभाविक है और ‘या’ का विकल्पसूचक बल बनाए रखता है।
- source_word: תַּעֲבֹר עָלָיו רוּחַ קִנְאָה
  choice: जिस पर ईर्ष्या की भावना छा जाए
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘ईर्ष्या की आत्मा/भावना उसके ऊपर से गुज़रे’ है। ‘छा जाए’ प्रबल प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘भावना’ इसे किसी निश्चित अलौकिक सत्ता के रूप में सीमित नहीं करती।
- source_word: רוּחַ
  choice: भावना
  rationale: यहाँ רוּחַ मनुष्य पर प्रभाव डालने वाली भीतरी प्रवृत्ति या आवेग का संकेत दे सकता है। ‘भावना’ आधुनिक हिन्दी में सहज है, पर पदटिप्पणी और वाक्य-विन्यास मूल मुहावरे के प्रबल प्रभाव को सुरक्षित रखते हैं।
- source_word: קִנְאָה / וְקִנֵּא
  choice: ईर्ष्या / ईर्ष्या करे
  rationale: वैवाहिक अविश्वास के संदेह के प्रसंग में ‘ईर्ष्या’ संज्ञा और सजातीय क्रिया—दोनों की पुनरावृत्ति को बनाए रखती है।
- source_word: וְהֶעֱמִיד אֶת הָאִשָּׁה לִפְנֵי יְהוָה
  choice: वह उस स्त्री को याहवे के सामने खड़ा करे
  rationale: हिफ़ील रूप का मूल अर्थ ‘खड़ा कराना/प्रस्तुत करना’ है। ‘सामने खड़ा करे’ अनुष्ठानिक प्रस्तुति को स्पष्ट और स्रोत के निकट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण दिया गया है।
- source_word: וְעָשָׂה לָהּ הַכֹּהֵן
  choice: तब याजक उस स्त्री के साथ … के अनुसार करे
  rationale: शाब्दिक ‘याजक उसके लिए/उसके साथ करे’ हिन्दी में अधूरा लगता है। ‘के अनुसार करे’ अगले पदबंध को क्रिया से स्वाभाविक रूप से जोड़ते हुए निर्धारित अनुष्ठानिक कार्यवाही का अर्थ देता है।
- source_word: כָּל הַתּוֹרָה הַזֹּאת
  choice: इस सारी व्यवस्था
  rationale: תּוֹרָה यहाँ अभी वर्णित निर्धारित विधान या प्रक्रिया को सूचित करता है। ‘व्यवस्था’ इसके विधिक स्वर को बनाए रखती है; अन्य संभावित अर्थ पदटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ‘ईर्ष्या की रूह/आत्मा’ का स्वरूप
  choice: ‘ईर्ष्या की भावना’ कहकर प्रबल भीतरी अवस्था व्यक्त की गई है, बिना उसके स्रोत को निश्चित किए।
  alternative: ‘ईर्ष्या की आत्मा’ या ‘ईर्ष्या का आवेग’
  rationale: इब्रानी רוּחַ קִנְאָה मनोवैज्ञानिक आवेग अथवा मनुष्य पर छा जाने वाली शक्ति—दोनों ढंग से समझा जा सकता है। अनुवाद इसे किसी दुष्टात्मा या दिव्य प्रेरणा के रूप में सिद्ध नहीं करता।
- issue: תּוֹרָה का अनुष्ठानिक अर्थ
  choice: ‘व्यवस्था’ मुख्य पाठ में, और ‘निर्देश/विधि’ पदटिप्पणी में
  alternative: केवल ‘अनुष्ठान’ या ‘प्रक्रिया’
  rationale: पद केवल कर्मकांड नहीं, अधिकृत निर्देश भी दर्शाता है; इसलिए उसके विधिक और निर्देशात्मक विस्तार को खुला रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पद पिछले वाक्य का वैकल्पिक खंड है, इसलिए आरम्भ में ‘या’ रखा गया है। ‘याहवे’ निजी दिव्य नाम का लिप्यंतरण है।
