source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/קְּנָאֹ֑ת אֲשֶׁ֨ר תִּשְׂטֶ֥ה אִשָּׁ֛ה תַּ֥חַת אִישָׁ֖/הּ וְ/נִטְמָֽאָה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/029.yaml
  text: This is the law of jealousy[a], when a wife goes astray under her husband and becomes defiled[c][b],
translation:
  language: hi
  text: ईर्ष्या की व्यवस्था यह है:[a] जब कोई पत्नी अपने पति के अधीन भटक जाए[b] और अशुद्ध हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “ईर्ष्याओं” बहुवचन है; सम्भवतः यह ईर्ष्या से संबंधित इस कानूनी प्रक्रिया का तकनीकी नाम है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपने पति के अधीन भटक जाए”; यह वैवाहिक बंधन के भीतर उससे विमुख होने का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: זֹאת תּוֹרַת הַקְּנָאֹת
  choice: ईर्ष्या के मामलों की व्यवस्था यह है
  rationale: תּוֹרָה को इस कानूनी प्रसंग में स्वाभाविक हिन्दी ‘व्यवस्था’ से व्यक्त किया गया है। קְנָאֹת का बहुवचन यहाँ इस प्रक्रिया का तकनीकी नाम जान पड़ता है; ‘ईर्ष्या के मामलों’ से उसका बहुवचन-संकेत और कानूनी आशय दोनों बने रहते हैं।
- source_word: אֲשֶׁר תִּשְׂטֶה אִשָּׁה
  choice: जब कोई पत्नी ... भटक जाए
  rationale: אֲשֶׁר परिस्थितिजन्य उपवाक्य आरम्भ करता है, इसलिए ‘जब’ स्वाभाविक है। שׂטה वैवाहिक निष्ठा से हटने का रूपक है; ‘भटक जाए’ उसे अनावश्यक रूप से ‘व्यभिचार करे’ बनाकर अधिक स्पष्ट नहीं करता।
- source_word: תַּחַת אִישָׁהּ
  choice: अपने पति के रहते
  rationale: शाब्दिक अर्थ ‘अपने पति के अधीन’ है, पर यहाँ वैवाहिक बंधन के भीतर होने का भाव है। ‘अपने पति के रहते’ आधुनिक हिन्दी में इस संबंधगत मुहावरे को सहज रूप से व्यक्त करता है, जबकि पादटिप्पणी शाब्दिक रूप बताती है।
- source_word: וְנִטְמָאָה
  choice: और अशुद्ध हो जाए
  rationale: טמא की अशुद्धता-संबंधी भाषा को बनाए रखा गया है। इससे पाठ को केवल अनुष्ठानिक अशुद्धता या सीधे ‘व्यभिचार’ तक सीमित नहीं किया जाता।
theological_decisions:
- issue: अशुद्धता की प्रकृति
  choice: अशुद्ध हो जाए
  alternative: अपवित्र हो जाए / व्यभिचार करे
  rationale: प्रसंग यौन अविश्वास से संबंधित है, पर इब्रानी पाठ טמא अर्थात अशुद्धता की भाषा प्रयोग करता है। चुना हुआ अनुवाद इस धार्मिक-नैतिक तनाव को खुला रखता है।
- issue: תַּחַת אִישָׁהּ में वैवाहिक संबंध और अधिकार
  choice: अपने पति के रहते
  alternative: अपने पति के अधीन
  rationale: इब्रानी अभिव्यक्ति में वैवाहिक बंधन या पति के अधिकार का भाव हो सकता है। मुख्य पाठ में सहज संबंधगत अर्थ रखा गया है और शाब्दिक रूप पादटिप्पणी में दिया गया है, ताकि किसी विशेष वैवाहिक सिद्धान्त को अनावश्यक रूप से न थोपा जाए।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। कानूनी सार-वाक्य को स्पष्ट रखा गया है तथा रूपक और अशुद्धता की मूल भाषा को सुरक्षित रखा गया है।
