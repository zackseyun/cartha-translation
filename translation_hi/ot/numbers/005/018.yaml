  text: וְ/הֶעֱמִ֨יד הַ/כֹּהֵ֥ן אֶֽת הָ/אִשָּׁה֮ לִ/פְנֵ֣י יְהוָה֒ וּ/פָרַע֙ אֶת רֹ֣אשׁ הָֽ/אִשָּׁ֔ה וְ/נָתַ֣ן עַל כַּפֶּ֗י/הָ אֵ֚ת מִנְחַ֣ת הַ/זִּכָּר֔וֹן מִנְחַ֥ת קְנָאֹ֖ת הִ֑וא וּ/בְ/יַ֤ד הַ/כֹּהֵן֙ יִהְי֔וּ מֵ֥י הַ/מָּרִ֖ים הַ/מְאָֽרֲרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/018.yaml
  text: Then the priest shall set the woman before Yahweh, loosen the woman's hair, and place in her hands the grain offering of remembrance—it is a grain offering of jealousy—while in the priest's hand are the bitter waters that bring a curse.
translation:
  language: hi
  text: तब याजक उस स्त्री को यहोवा के सामने खड़ा करे, उसके बाल खोल दे[a], और उसकी हथेलियों पर स्मरण की अन्नबलि रखे—यह ईर्ष्या की अन्नबलि है—और याजक के हाथ में वे कड़वे जल हों जो शाप लाते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस स्त्री का सिर उघाड़ दे” अथवा “उसके बाल खुले छोड़ दे।” इब्रानी मुहावरा शाब्दिक रूप से स्त्री के “सिर” को उघाड़ने या उसके बाल खोलने की बात करता है; संभवतः अनुष्ठान के लिए उसके बंधे बाल खोले जाते थे।
    reason: lexical_alternative
  - marker: b
    text: या “वे कड़वे जल जो शाप को प्रभावी करते हैं।” इब्रानी कृदन्त जल को शाप लाने या उसे कार्यान्वित करने वाला बता सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֶעֱמִיד
  choice: खड़ा करे
  rationale: עמד के हिफ़ील रूप का मूल भाव किसी को खड़ा करना है; अनुष्ठानिक संदर्भ में यह स्त्री को यहोवा के सामने उपस्थित करने की औपचारिक क्रिया बताता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह परमेश्वर की उपस्थिति के सामने होने का प्रचलित उपासना-संबंधी वाक्यांश है; יהוה को उसके वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וּפָרַע אֶת רֹאשׁ הָאִשָּׁה
  choice: उसके बाल खोल दे
  rationale: פרע ראש का मुहावरा सिर या बालों को बंधन से मुक्त करने की क्रिया दर्शा सकता है। इस अनुष्ठान में ‘बाल खोल दे’ स्वाभाविक है, जबकि शाब्दिक और वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְנָתַן עַל כַּפֶּיהָ
  choice: उसके हाथों पर ... रखे
  rationale: כפים मूलतः हथेलियाँ हैं। ‘हाथों पर रखे’ ठोस अनुष्ठानिक मुद्रा और על के स्थानिक भाव, दोनों को बनाए रखता है।
- source_word: מִנְחַת הַזִּכָּרוֹן
  choice: स्मरण का अन्नबलि
  rationale: याजकीय संदर्भ में מנחה अन्नबलि है और זכרון स्मरण या स्मारक का भाव रखता है। यह संक्षिप्त अनुवाद उद्देश्यगत अस्पष्टता को नहीं मिटाता।
- source_word: מִנְחַת קְנָאֹת הִוא
  choice: यह ईर्ष्या का अन्नबलि है
  rationale: קנאות रूप में बहुवचन है, पर यहाँ भाववाचक अर्थ देता है। ‘ईर्ष्या’ संदर्भ में पति की जलन और आरोप से जुड़ी धार्मिक तनावपूर्ण भाषा को बनाए रखती है।
- source_word: וּבְיַד הַכֹּהֵן יִהְיוּ
  choice: याजक के हाथ में ... हों
  rationale: इब्रानी के एकवचन ‘हाथ’ और विधिक शैली को निकटता से रखा गया है।
- source_word: מֵי הַמָּרִים
  choice: वे कड़वे जल
  rationale: इब्रानी में ‘जल’ बहुवचन रूप में है और מר का अर्थ कड़वा है; हिन्दी में ‘कड़वे जल’ अनुष्ठानिक और गरिमापूर्ण है।
- source_word: הַמְאָרֲרִים
  choice: जो शाप लाते हैं
  rationale: ארר का कृदन्त जल को शाप पहुँचाने या प्रभावी करने वाला बताता है। यह कारक अर्थ को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत वाचा-नाम सीधे उपस्थित है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नामत्व को बनाए रखता है, जबकि ‘प्रभु’ मूल में उपस्थित नाम को पदवी में बदल देता।
- issue: קְנָאֹת का धार्मिक-संदर्भित अर्थ
  choice: ईर्ष्या
  alternative: जलन / सन्देह
  rationale: ‘ईर्ष्या’ स्रोत के भाववाचक और बहुअर्थी स्वर को बनाए रखती है; केवल ‘सन्देह’ कहना पति की मनोदशा की ओर अर्थ को अधिक संकीर्ण कर देता।
- issue: शापकारी जल की क्रियाशीलता
  choice: जो शाप लाते हैं
  alternative: जिन पर शाप है / जो वह शाप लाते हैं
  rationale: कृदन्त का कारक भाव सुरक्षित रखा गया है, पर यह नहीं जोड़ा गया कि जल अपने आप जादुई शक्ति रखते हैं; अनुष्ठान में शाप का परिणाम परमेश्वर के न्याय पर निर्भर रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक-अनुष्ठानिक गरिमा रखी गई है। ‘याजक’, ‘अन्नबलि’ और ‘शाप’ जैसे परिचित बाइबलीय शब्द चुने गए हैं। वाक्य को हिन्दी में स्पष्टता के लिए दो वाक्यों में बाँटा गया है; सभी मूल उपवाक्य और उनका संबंध सुरक्षित हैं।
