  text: וְ/לָקַ֤ח הַ/כֹּהֵן֙ מִ/יַּ֣ד הָֽ/אִשָּׁ֔ה אֵ֖ת מִנְחַ֣ת הַ/קְּנָאֹ֑ת וְ/הֵנִ֤יף אֶת הַ/מִּנְחָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/הִקְרִ֥יב אֹתָ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/025.yaml
  text: Then the priest shall take from the woman’s hand the grain offering of jealousy, and he shall wave the grain offering before Yahweh and bring it near to the altar.
translation:
  language: hi
  text: तब याजक स्त्री के हाथ से ईर्ष्या की अन्न-बलि ले, उस अन्न-बलि को याहवे के सामने लहराए और उसे वेदी के निकट ले जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... ले
  rationale: वाव के साथ क़ातल रूप विधि की क्रमिक अगली कार्रवाई बताता है; ‘तब’ और विधिसूचक क्रिया इसे स्वाभाविक हिंदी में व्यक्त करते हैं।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-संबंधी अधिकारी के लिए प्रचलित और स्पष्ट हिंदी शब्द।
- source_word: מִיַּד הָאִשָּׁה
  choice: स्त्री के हाथ से
  rationale: इब्रानी संबंध-वाक्यांश का सीधा और स्वाभाविक रूप, जो स्त्री से प्रत्यक्ष ग्रहण करना दर्शाता है।
- source_word: מִנְחַת הַקְּנָאֹת
  choice: ईर्ष्या का अन्नबलि
  rationale: מִנְחָה की अन्न-आधारित बलि की विशिष्टता और קְנָאֹת के संबंधसूचक भाव दोनों सुरक्षित रहते हैं।
- source_word: וְהֵנִיף
  choice: हिलाए
  rationale: नוף के हिफ़ील रूप से सूचित अनुष्ठानिक हिलाने की क्रिया को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: הַמִּנְחָה
  choice: उस अन्नबलि को
  rationale: מִנְחָה की बलि-श्रेणी को दोहराता है; ‘उस’ पहले उल्लिखित अन्नबलि की ओर स्पष्ट संकेत करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: उपासना-संबंधी स्थिर अभिव्यक्ति का स्वाभाविक हिंदी रूप।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय परमेश्वर-नाम को हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְהִקְרִיב אֹתָהּ אֶל הַמִּזְבֵּחַ
  choice: और उसे वेदी के पास ले आए
  rationale: קרב के हिफ़ील का ‘निकट लाना’ भाव सुरक्षित रखता है और אֶל को ‘के पास’ से स्वाभाविक रूप देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे उपस्थित है; अनुवाद उसे उपाधि से नहीं बदलता। हिंदी पाठकों में ‘यहोवा’ अधिक प्रचलित और सहज पहचाना जाने वाला रूप है।
- issue: מִנְחַת הַקְּנָאֹת का संबंध
  choice: ईर्ष्या का अन्नबलि
  alternative: ईर्ष्या-बलि
  rationale: पूरा रूप अन्नबलि की विशिष्ट श्रेणी और ईर्ष्या से उसके संबंध दोनों को बनाए रखता है, बिना अनुष्ठान का अर्थ अतिरिक्त रूप से निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, विधिसूचक और सामान्य पाठक के लिए स्पष्ट शैली। ‘ले’, ‘हिलाए’ और ‘ले आए’ क्रमिक अनुष्ठानिक निर्देशों के रूप में प्रयुक्त हैं।
