base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/031.yaml
  text: Then the man will be free from guilt[b][a], but that woman will bear her guilt.
translation:
  language: hi
  text: तब वह पुरुष दोष से मुक्त होगा[a], पर वह स्त्री अपने दोष का भार उठाएगी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पति दोष से मुक्त होगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “अपना दोष उठाएगी”; इब्रानी अभिव्यक्ति में दोष के परिणाम भुगतने का अर्थ भी निहित हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִקָּה
  choice: मुक्त होगा
  rationale: निफ़अल रूप यहाँ दोष अथवा उत्तरदायित्व से मुक्त होने का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक है और न्यायिक अर्थ को बनाए रखता है।
- source_word: הָאִישׁ
  choice: वह पुरुष
  rationale: אִישׁ का औपचारिक अर्थ ‘पुरुष’ है; प्रसंग में वह पति है, पर मुख्य पाठ मूल की अभिव्यक्ति को रखता है।
- source_word: מֵעָוֺן
  choice: दोष से
  rationale: עָוֹן में अधर्म, दोष और उससे उत्पन्न दायित्व के अर्थ समाहित हो सकते हैं। נקה के साथ ‘दोष से मुक्त’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְהָאִשָּׁה הַהִוא
  choice: परन्तु वह स्त्री
  rationale: וְ सामान्यतः ‘और’ है, किन्तु यहाँ दोनों पक्षों के परिणामों में विरोध है; ‘परन्तु’ उस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। הַהִוא का संकेत ‘वह’ से सुरक्षित है।
- source_word: תִּשָּׂא אֶת עֲוֺנָהּ
  choice: अपने अधर्म का भार उठाएगी
  rationale: नשׂא עָוֹן की इब्रानी अभिव्यक्ति को हिन्दी में ‘अधर्म का भार उठाना’ कहने से अपराध और उसके परिणाम—दोनों की संभावित अर्थ-छाया बनी रहती है।
theological_decisions:
- issue: दोनों उपवाक्यों में עָוֹן का अर्थ
  choice: पहले उपवाक्य में ‘दोष’ और दूसरे में ‘अधर्म का भार’
  alternative: 'दोनों स्थानों पर ‘दोष’ रखकर: ‘दोष से मुक्त होगा ... अपना दोष उठाएगी’'
  rationale: हिन्दी में शाब्दिक पुनरावृत्ति दूसरी अभिव्यक्ति को अस्वाभाविक बना देती है। चुना हुआ रूप मूल की कानूनी-नैतिक समानता को बनाए रखते हुए נשׂא עָוֹן के मुहावरे और परिणाम-संबंधी अर्थ-छाया को भी सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ विरोध को स्पष्ट करता है; ‘अधर्म का भार उठाना’ मूल इब्रानी मुहावरे की नैतिक और परिणामगत अस्पष्टता को सुरक्षित रखता है।
