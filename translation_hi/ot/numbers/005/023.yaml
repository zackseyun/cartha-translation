  yaml_path: translation/ot/numbers/005/023.yaml
  text: Then the priest shall write these curses in the scroll and wash them off into the bitter water[a][b].
translation:
  language: hi
  text: तब याजक इन शापों[a] को लेखपत्र पर लिखे और उन लिखे हुए शापों को कड़वे जल में धोकर मिटा दे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘शपथ से जुड़े इन शापों’। इब्रानी शब्द शपथ के साथ लगाए गए शाप को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उन्हें पोंछ दे’ अथवा ‘मिटा दे’। इब्रानी क्रिया लिखे हुए शब्दों को पोंछकर या धोकर मिटाने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָתַב
  choice: तब ... लिखे
  rationale: अनुष्ठान-संबंधी विधि के क्रम में संयोजक सहित पूर्ण क्रिया अगले निर्देश का भाव देती है; इसलिए आधुनिक हिन्दी में क्रमसूचक ‘तब’ और विध्यर्थक ‘लिखे’ स्वाभाविक हैं।
- source_word: הָאָלֹת הָאֵלֶּה
  choice: इन शापों
  rationale: אָלָה शाप को दर्शाता है और प्रायः शपथ से जुड़े शाप के लिए आता है। प्रसंग में स्त्री पर उच्चारित दंडसूचक वचन अभिप्रेत हैं; शपथ-संबंधी अर्थ-पहलू पादटिप्पणी में रखा गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: इस अनुष्ठान को संपन्न करने वाले इस्राएली पुरोहित के लिए प्रचलित और गरिमापूर्ण हिन्दी पद।
- source_word: בַּסֵּפֶר
  choice: एक लेखपत्र पर
  rationale: סֵפֶר यहाँ आधुनिक जिल्दबंद पुस्तक नहीं, लिखने योग्य दस्तावेज़ अथवा लेख-सामग्री है। ‘लेखपत्र’ प्राचीन संदर्भ को स्पष्ट रखता है और हिन्दी में ‘पर लिखे’ स्वाभाविक है।
- source_word: וּמָחָה
  choice: धोकर मिटा दे
  rationale: מחה का अर्थ पोंछकर मिटाना या लोप करना है। यहाँ लिखे हुए शब्द जल में उतारे जा रहे हैं, इसलिए ‘धोकर मिटा दे’ भौतिक क्रिया और उसके परिणाम दोनों को स्पष्ट करता है।
- source_word: אֶל
  choice: में
  rationale: दिशासूचक אֶל यहाँ मिटाए गए लेख के कड़वे जल में चले जाने को बताता है; हिन्दी में ‘जल में धोकर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵי הַמָּרִים
  choice: कड़वे जल
  rationale: इब्रानी पद का शाब्दिक भाव ‘कड़वाहट का जल’ अथवा ‘कड़वा जल’ है। हिन्दी में द्रव्य के लिए एकवचन ‘जल’ सहज और प्रसंगानुकूल है।
