source:
  edition: WLC
  text: וְ/אִם לֹ֤א נִטְמְאָה֙ הָֽ/אִשָּׁ֔ה וּ/טְהֹרָ֖ה הִ֑וא וְ/נִקְּתָ֖ה וְ/נִזְרְעָ֥ה זָֽרַע־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/028.yaml
  text: But if the woman has not defiled herself and is clean[a], then she will be cleared and will conceive offspring.
translation:
  language: hi
  text: परन्तु यदि उस स्त्री ने अपने को अशुद्ध नहीं किया है और वह शुद्ध है, तो वह दोषमुक्त ठहरेगी और गर्भवती होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “बीज से बोई जाएगी”; यह गर्भधारण करने का हिब्रू मुहावरा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह शर्त पिछले पद में बताए दोषी परिणाम के विपरीत स्थिति प्रस्तुत करती है; इसलिए केवल ‘और यदि’ की अपेक्षा ‘परन्तु यदि’ संदर्भगत विरोध को स्पष्ट करता है।
- source_word: לֹא נִטְמְאָה
  choice: अपने को अशुद्ध नहीं किया है
  rationale: निफ़ाल रूप यहाँ अशुद्ध होने या अपने को अशुद्ध करने का भाव रखता है। व्यभिचार की जाँच के संदर्भ में यह नैतिक और यौन अशुद्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: निश्चित संज्ञा को प्रसंग में पहले से उल्लिखित स्त्री के रूप में व्यक्त किया गया है।
- source_word: וּטְהֹרָה הִוא
  choice: और वह शुद्ध है
  rationale: טָהוֹר का अर्थ स्वच्छ या शुद्ध है; यहाँ ‘शुद्ध’ अनुष्ठानिक और नैतिक दोनों आयामों को संक्षेप में बनाए रखता है।
- source_word: וְנִקְּתָה
  choice: तो वह दोषमुक्त ठहरेगी
  rationale: נקה के निफ़ाल का अर्थ मुक्त, निर्दोष या दोष से बरी ठहरना हो सकता है। ‘दोषमुक्त ठहरेगी’ जाँच में उसके निर्दोष सिद्ध होने का भाव देता है, पर आधुनिक न्यायालय की संकीर्ण शब्दावली नहीं थोपता।
- source_word: וְנִזְרְעָה זָרַע
  choice: और गर्भवती होगी
  rationale: शाब्दिक अभिव्यक्ति ‘बीज से बोई जाएगी’ गर्भधारण का हिब्रू मुहावरा है। ‘गर्भवती होगी’ इसे सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है तथा जन्म देने तक अर्थ का विस्तार नहीं करता।
theological_decisions:
- issue: दोषमुक्त स्त्री के लिए अंतिम परिणाम की प्रकृति
  choice: वचन सीधे कहता है कि वह गर्भवती होगी।
  alternative: उसे गर्भधारण करने की क्षमता होगी, अथवा उसकी सामान्य प्रजनन-क्षमता बनी रहेगी।
  rationale: हिब्रू וְנִזְרְעָה זָרַע गर्भधारण/सन्तानोत्पत्ति का मुहावरा है। पाठ में केवल क्षमता सूचक सहायक अभिव्यक्ति स्पष्ट नहीं है, इसलिए सीधे भविष्यसूचक कथन को मुख्य पाठ में रखा गया और शाब्दिक रूप पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘अशुद्ध’ और ‘शुद्ध’ की समानान्तर शब्दावली मूल पाठ के नैतिक-अनुष्ठानिक तनाव को बनाए रखती है।
