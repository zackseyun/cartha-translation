  text: וְ/הִשְׁבִּ֨יעַ הַ/כֹּהֵ֥ן אֶֽת הָֽ/אִשָּׁה֮ בִּ/שְׁבֻעַ֣ת הָ/אָלָה֒ וְ/אָמַ֤ר הַ/כֹּהֵן֙ לָֽ/אִשָּׁ֔ה יִתֵּ֨ן יְהוָ֥ה אוֹתָ֛/ךְ לְ/אָלָ֥ה וְ/לִ/שְׁבֻעָ֖ה בְּ/ת֣וֹךְ עַמֵּ֑/ךְ בְּ/תֵ֨ת יְהוָ֤ה אֶת יְרֵכֵ/ךְ֙ נֹפֶ֔לֶת וְ/אֶת בִּטְנֵ֖/ךְ צָבָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/021.yaml
  text: Then the priest shall make the woman swear with the oath of the curse[a], and the priest shall say to the woman, “May Yahweh make you a curse and an oath among your people[c][b], when Yahweh makes your thigh waste away and your abdomen swell.”
translation:
  language: hi
  text: तब याजक स्त्री को शाप वाली शपथ दिलाए[a] और उससे कहे, “याहवे तुम्हें तुम्हारे लोगों के बीच शाप और शपथ का उदाहरण बनाए[b], जब याहवे तुम्हारी जाँघ को क्षीण कर दे[c] और तुम्हारे पेट को फूल जाने दे[d]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “शाप की शपथ।” यह शाप के साथ जुड़ी हुई औपचारिक शपथ है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात लोग शाप देते या शपथ खाते समय उसका उदाहरण दें। इसे अधिक शब्दशः “तुम्हें शाप और शपथ बनाए” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: “जाँघ को क्षीण कर देना” एक कठिन इब्रानी अभिव्यक्ति का अर्थानुवाद है। शब्दशः इसमें जाँघ के “गिरने” का बिंब है; संभव है कि यह जननांगों या प्रजनन-क्षमता से संबंधित शिष्टोक्ति हो, पर ठीक प्रभाव निश्चित नहीं है।
    reason: textual_ambiguity
  - marker: d
    text: “पेट” का अर्थ “उदर” या कुछ संदर्भों में “गर्भ” भी हो सकता है। यहाँ बताए गए शारीरिक या प्रजनन-संबंधी प्रभाव पर मतभेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: शपथ दिलाए
  rationale: हिफ़ील रूप का कारणवाचक अर्थ है कि याजक स्त्री से शपथ लेने को कहता है; यह हिन्दी में स्वाभाविक और विधिक प्रसंग के अनुकूल है।
- source_word: בִּשְׁבֻעַת הָאָלָה
  choice: शाप वाली शपथ
  rationale: रचना में ‘शपथ’ और ‘शाप’ दोनों तत्व बने रहते हैं, जबकि हिन्दी में यह ‘शाप की शपथ’ की अपेक्षा अधिक सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: לְאָלָה וְלִשְׁבֻעָה
  choice: शाप और शपथ का उदाहरण
  rationale: यह स्त्री समुदाय में शाप देने और शपथ खाने के समय उद्धृत उदाहरण बनती है। ‘का उदाहरण’ जोड़ने से सूत्रात्मक सामाजिक अर्थ स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: בְּתוֹךְ עַמֵּךְ
  choice: तुम्हारे लोगों के बीच
  rationale: समुदाय के भीतर सार्वजनिक उदाहरण बनने का भाव सहज हिन्दी में सुरक्षित है।
- source_word: בְּתֵת
  choice: जब ... गल जाने दे ... और ... फूल जाने दे
  rationale: בְּ सहित क्रियार्थक संज्ञा शाप के पूरा होने की परिस्थिति बताती है। कारणवाचक हिन्दी वाक्यांश यह स्पष्ट करता है कि परिणाम याहवे की ओर से होता है।
- source_word: יְרֵכֵךְ נֹפֶלֶת
  choice: तुम्हारी जाँघ को गल जाने दे
  rationale: יָרֵךְ का मूल शारीरिक बिंब ‘जाँघ’ रखा गया है। नֹפֶלֶת का शब्दशः अर्थ ‘गिरना’ है, पर इस कठिन शाप-सूत्र में शरीर के अंग के क्षय या सिकुड़ने का भाव अधिक स्वाभाविक रूप से ‘गल जाना’ व्यक्त करता है।
- source_word: בִּטְנֵךְ צָבָה
  choice: तुम्हारे पेट को फूल जाने दे
  rationale: בֶּטֶן पेट, उदर या गर्भ का संकेत दे सकता है; ‘पेट’ सामान्य और अनिर्णायक है। צָבָה की सूजन का अर्थ ‘फूल जाना’ से स्पष्ट होता है।
theological_decisions:
- issue: शारीरिक शाप को कितनी चिकित्सकीय या प्रजनन-संबंधी विशिष्टता से व्यक्त किया जाए
  choice: मुख्य पाठ में ‘जाँघ’ और ‘पेट’ के ठोस परंतु व्यापक शारीरिक बिंब बनाए रखे गए हैं।
  alternative: इसे सीधे गर्भपात, बाँझपन, गर्भाशय के गिरने या जननांगों के क्षय के रूप में अनूदित करना।
  rationale: इब्रानी अभिव्यक्ति कठिन और विवादित है। मुख्य पाठ किसी निश्चित चिकित्सकीय निदान को आरोपित नहीं करता; संभावित प्रजनन-संबंधी आशय टिप्पणियों में बताया गया है।
- issue: לְאָלָה וְלִשְׁבֻעָה का सूत्रात्मक सामुदायिक अर्थ
  choice: ‘शाप और शपथ का उदाहरण’
  alternative: शब्दशः ‘शाप और शपथ’
  rationale: लְ उपसर्गों और सामुदायिक संदर्भ से किसी व्यक्ति का शाप अथवा शपथ में उदाहरण बनना अभिप्रेत है। ‘उदाहरण’ हिन्दी में इस आशय को व्यक्त करता है, जबकि दोनों मूल संज्ञाएँ भी सुरक्षित रहती हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक-अनुष्ठानिक स्वर के लिए ‘शपथ दिलाए’ और शाप-सूत्र के लिए भविष्याभिलाषी ‘बनाए/दे’ का प्रयोग हुआ है। कठिन शारीरिक भाषा को मुख्य पाठ में अनावश्यक चिकित्सकीय विशिष्टता दिए बिना रखा गया है।
