  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्यतः सुबोध रूप अपनाया गया है। ‘जल’ अनुष्ठानिक प्रसंग के अनुरूप है; ‘पेट’ और ‘जाँघ’ मूल के शारीरिक बिंबों को बनाए रखते हैं। कठिन इब्रानी पदों की अनिश्चितता पादटिप्पणियों में सुरक्षित रखी गई है।
