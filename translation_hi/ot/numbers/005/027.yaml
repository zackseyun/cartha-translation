  text: וְ/הִשְׁקָ֣/הּ אֶת הַ/מַּ֗יִם וְ/הָיְתָ֣ה אִֽם נִטְמְאָה֮ וַ/תִּמְעֹ֣ל מַ֣עַל בְּ/אִישָׁ/הּ֒ וּ/בָ֨אוּ בָ֜/הּ הַ/מַּ֤יִם הַ/מְאָֽרֲרִים֙ לְ/מָרִ֔ים וְ/צָבְתָ֣ה בִטְנָ֔/הּ וְ/נָפְלָ֖ה יְרֵכָ֑/הּ וְ/הָיְתָ֧ה הָ/אִשָּׁ֛ה לְ/אָלָ֖ה בְּ/קֶ֥רֶב עַמָּֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/027.yaml
  text: When he makes her drink the water[a], then if she has defiled herself and has acted unfaithfully against her husband, the water that brings the curse will enter her for bitterness, and her belly will swell and her thigh will waste away[b], and the woman will become a curse among her people.
translation:
  language: hi
  text: जब वह उसे वह जल पिला दे[a], तब यदि उसने अपने को अशुद्ध किया हो और अपने पति के प्रति विश्वासघात किया हो, तो शाप लाने वाला जल उसके भीतर प्रवेश करके कड़वाहट उत्पन्न करेगा; उसका पेट फूल जाएगा और उसकी जाँघ गल जाएगी[b], और वह स्त्री अपने लोगों के बीच शाप बन जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह उसे वह जल पिलाए।” इब्रानी वाक्य-क्रम को यहाँ परिणाम बताने वाली समयसूचक उपवाक्य-रचना में व्यक्त किया गया है। “कड़वाहट उत्पन्न करेगा” के स्थान पर यह भी समझा जा सकता है कि शाप लाने वाला जल उसके भीतर “कड़वे जल” के रूप में प्रवेश करेगा; इब्रानी पद का ठीक संबंध अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी जाँघ गिर जाएगी।” संभवतः यह उसके प्रजनन-अंगों को प्रभावित करने वाली किसी गंभीर शारीरिक व्याधि के लिए प्रयुक्त व्यंजना है, पर इसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִשְׁקָהּ אֶת־הַמַּיִם
  choice: जब वह उसे वह जल पिला दे
  rationale: हिफ़ील रूप का कारक अर्थ ‘पिलाना’ से स्पष्ट होता है; ‘जब’ आगे आने वाले परिणाम की समय-संबंधी भूमिका को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִטְמְאָה
  choice: उसने अपने को अशुद्ध किया हो
  rationale: यह प्रसंग नैतिक और अनुष्ठानिक अशुद्धता दोनों का संकेत देता है; आत्मवाचक रचना प्रसंगगत भाव को बनाए रखती है।
- source_word: וַתִּמְעֹל מַעַל בְּאִישָׁהּ
  choice: अपने पति के प्रति विश्वासघात किया हो
  rationale: सजातीय रचना מעל विश्वास तोड़ने या निष्ठाहीन होने का प्रबल भाव देती है; ‘विश्वासघात’ वैवाहिक संबंध के उल्लंघन को सहज हिन्दी में व्यक्त करता है।
- source_word: הַמַּיִם הַמְאָרֲרִים
  choice: शाप लाने वाला वह जल
  rationale: कृदंत जल को शाप पहुँचाने या कार्यान्वित करने वाला बताता है; यह चयन उस कारक भाव को बनाए रखता है।
- source_word: וּבָאוּ בָהּ ... לְמָרִים
  choice: उसके भीतर जाकर कड़वा प्रभाव डालेगा
  rationale: בוא ב शरीर में प्रवेश का भाव देता है, जबकि कठिन पद לְמָרִים को परिणामसूचक ‘कड़वा प्रभाव’ के रूप में रखा गया है, बिना किसी विशिष्ट चिकित्सकीय अर्थ के।
- source_word: וְצָבְתָה בִטְנָהּ
  choice: उसका पेट फूल जाएगा
  rationale: בטן का सीधा अर्थ पेट या उदर है; ‘गर्भ’ कहना मूल से अधिक विशिष्ट होता।
- source_word: וְנָפְלָה יְרֵכָהּ
  choice: उसकी जाँघ गल जाएगी
  rationale: शाब्दिक ‘जाँघ गिर जाएगी’ हिन्दी में अस्पष्ट और अस्वाभाविक है। ‘गल जाएगी’ गंभीर शारीरिक क्षय का बोध कराता है, जबकि ‘जाँघ’ रखकर अनिश्चित शारीरिक संकेत को सुरक्षित रखा गया है।
- source_word: וְהָיְתָה הָאִשָּׁה לְאָלָה בְּקֶרֶב עַמָּהּ
  choice: वह स्त्री अपने लोगों के बीच शाप का उदाहरण बन जाएगी
  rationale: ‘शाप बन जाएगी’ का अर्थ यहाँ समुदाय में शाप के दृष्टांत या कहावत बनना है; ‘शाप का उदाहरण’ सामान्य पाठक के लिए भाव स्पष्ट करता है।
theological_decisions:
- issue: दण्ड के शारीरिक स्वरूप को किसी निश्चित प्रजनन-संबंधी निदान के रूप में प्रस्तुत करना
  choice: ‘उसका पेट फूल जाएगा और उसकी जाँघ गल जाएगी’
  alternative: ‘उसका गर्भ गिर जाएगा और उसका पेट फूल जाएगा’ अथवा जननांगों के क्षय का स्पष्ट उल्लेख
  rationale: मूल इब्रानी भाषा ठोस किंतु आंशिक रूप से व्यंजनापूर्ण है और उसका ठीक शारीरिक आशय विवादित है। इसलिए मुख्य पाठ में पेट और जाँघ के मूल बिंब रखे गए हैं और अधिक विशिष्ट प्रजनन-संबंधी व्याख्या नहीं थोपी गई।
- issue: לְמָרִים के कठिन अर्थ को व्यक्त करना
  choice: ‘कड़वा प्रभाव डालेगा’
  alternative: ‘कड़वे जल के रूप में उसके भीतर जाएगा’
  rationale: यह पद जल की गुणवत्ता या उसके कटु परिणाम, दोनों की ओर संकेत कर सकता है। मुख्य पाठ परिणामसूचक अर्थ देता है और पादटिप्पणी वैकल्पिक समझ को सुरक्षित रखती है।
