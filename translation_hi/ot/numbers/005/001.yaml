lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक रूप यहाँ एक नई कथात्मक वाणी-घटना आरम्भ करता है। हिन्दी में अगले कथन का स्वाभाविक परिचय देने के लिए “ने…कहा” उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय दिव्य नाम YHWH को किसी उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण लिप्यंतरण “याहवे” द्वारा व्यक्त किया गया है।
- source_word: אֶל
  choice: से
  rationale: बोलने की क्रिया के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से “से” द्वारा व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम के लिए हिन्दी बाइबल-परंपरा में सुप्रचलित रूप “मूसा” रखा गया है।
- source_word: לֵאמֹר
  choice: 'कहा:'
  rationale: इस सामान्य इब्रानी वाणी-परिचय सूत्र को हिन्दी में अलग से “यह कहते हुए” दोहराने के बजाय उद्धरण-सूचक “कहा:” से स्वाभाविक और अर्थनिष्ठ रूप में व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम YHWH है। “याहवे” इस नाम को प्रत्यक्ष रखता है; पादटिप्पणी पारंपरिक प्रतिस्थापन और अन्य प्रचलित रूप की जानकारी देती है, बिना किसी संप्रदायगत निष्कर्ष को आरोपित किए।
