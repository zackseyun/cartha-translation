  text: וַ/יַּֽעֲשׂוּ כֵן֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יְשַׁלְּח֣וּ אוֹתָ֔/ם אֶל מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֨ר דִּבֶּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה כֵּ֥ן עָשׂ֖וּ בְּנֵ֥י יִשְׂרָאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/004.yaml
  text: And the sons of Israel did so[a], and sent them outside the camp; just as Yahweh had spoken to Moses, so the sons of Israel did.
translation:
  language: hi
  text: इस्राएलियों[a] ने वैसा ही किया और उन्हें छावनी से बाहर भेज दिया। जैसा याहवे ने मूसा से कहा था, इस्राएलियों ने वैसा ही किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल हिब्रू में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है; यहाँ इसका आशय सामूहिक रूप से इस्राएली समुदाय से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲשׂוּ כֵן
  choice: वैसा ही किया
  rationale: עשה + כן यहाँ पहले दी गई आज्ञा के अनुपालन को व्यक्त करता है। ‘वैसा ही किया’ स्वाभाविक हिन्दी है और मूल के बल को बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह हिब्रू पारिवारिक पदबंध शाब्दिक रूप से ‘इस्राएल के पुत्र’ है, पर यहाँ पूरे समुदाय के लिए प्रयुक्त हुआ है। ‘इस्राएलियों’ आधुनिक हिन्दी में उसका स्वाभाविक सामूहिक रूप है; शाब्दिक रूप को पाद-टिप्पणी में रखा गया है।
- source_word: וַיְשַׁלְּחוּ אֹתָם
  choice: उन्हें ... भेज दिया
  rationale: इस संदर्भ में שׁלח लोगों को निर्धारित स्थान से बाहर भेजने या हटाने का अर्थ देता है। गंतव्य-वाचक पदबंध के साथ ‘भेज दिया’ इसे स्पष्ट करता है।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी से बाहर
  rationale: यह स्थानिक बहिष्करण को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר דִּבֶּר
  choice: जैसा ... ने ... कहा था
  rationale: כַאֲשֶׁר कार्य और पहले कही गई ईश्वरीय आज्ञा के बीच ठीक अनुरूपता बताता है; ‘कहा था’ उस वचन की पूर्वता दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वतापूर्ण लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: כֵּן עָשׂוּ
  choice: वैसा ही किया
  rationale: पद के अंत में आई पुनरावृत्ति इस्राएल की आज्ञाकारिता पर बल देती है; इसलिए इसे हटाया नहीं गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है; ‘यहोवा’ हिन्दी में परिचित वैकल्पिक रूप है, पर मूल उच्चारण के पुनर्निर्माण से कम निकट माना जाता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: इस पद में अभिव्यक्ति राष्ट्र-समुदाय को सामूहिक रूप से सूचित करती है। स्वाभाविक हिन्दी के लिए ‘इस्राएलियों’ चुना गया है, जबकि मूल का पारिवारिक रूप पाद-टिप्पणी में बताया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल की दोहरी ‘वैसा ही किया’ संरचना को आज्ञाकारिता पर दिए गए बल के कारण सुरक्षित रखा गया है।
