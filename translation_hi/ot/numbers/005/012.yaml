base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/012.yaml
  text: 'Speak to the sons of Israel and say to them: If any man''s wife goes astray and commits a breach of faith against him[b][a],'
translation:
  language: hi
  text: '“इस्राएल के पुत्रों से बात कर और उनसे कह: यदि किसी पुरुष की पत्नी भटक जाए और उसके विरुद्ध विश्वासघात करे,[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विश्वासघात करे” के लिए हिब्रू में एक ही मूल से बनी क्रिया और संज्ञा साथ प्रयुक्त हैं, जो गंभीर निष्ठाभंग पर बल देती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: बात कर
  rationale: आज्ञार्थक क्रिया और मूसा को दिए गए निर्देश की सीधी, स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू के पुरुषवाचक पारिवारिक पद को मुख्य पाठ में औपचारिक रूप से सुरक्षित रखता है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: विधिक निर्देश के आरम्भिक सूत्र की समानांतर संरचना बनाए रखता है।
- source_word: אִישׁ אִישׁ
  choice: किसी पुरुष की
  rationale: दोहराव का वितरणात्मक अर्थ ‘कोई भी पुरुष’ है; पत्नी के उल्लेख के साथ हिन्दी में यह रूप स्वाभाविक है।
- source_word: כִּי
  choice: यदि
  rationale: यहाँ विधिक प्रसंग में एक संभावित मामले की शर्त प्रस्तुत की गई है।
- source_word: תִשְׂטֶה
  choice: भटक जाए
  rationale: मूल के ‘मार्ग से हटने’ वाले रूपक को बनाए रखता है और अगले कथन से पहले अपराध को अनावश्यक रूप से विशिष्ट नहीं करता।
- source_word: וּמָעֲלָה ... מָעַל
  choice: विश्वासघात करे
  rationale: सजातीय क्रिया-संज्ञा संरचना का स्वाभाविक हिन्दी सार संबंधपरक निष्ठाभंग और छल दोनों को व्यक्त करता है।
- source_word: בּוֹ
  choice: उसके विरुद्ध
  rationale: पति को उस विश्वासघात से आहत पक्ष के रूप में स्पष्ट करता है।
theological_decisions:
- issue: वाचाई समुदाय के लिए लिंगसूचक संबोधन
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मुख्य पाठ में हिब्रू की पुरुषवाचक पारिवारिक अभिव्यक्ति रखी गई है, यद्यपि प्रसंग में यह व्यापक इस्राएली समुदाय का प्रचलित संबोधन है।
- issue: מעל की संबंधपरक और वाचाई गंभीरता
  choice: उसके विरुद्ध विश्वासघात करे
  alternative: उससे बेवफ़ाई करे
  rationale: ‘विश्वासघात’ मूल की निष्ठाभंग और द्रोह-सदृश गंभीरता को बनाए रखता है; अधिक बोलचाल का विकल्प अर्थ को कुछ हल्का कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली। आज्ञाओं में निकट संबोधन के अनुरूप एकवचन ‘कर/कह’ रखा गया है। मुख्य पाठ स्रोत की संरचना और रूपक के निकट है, पर ‘विश्वासघात करे’ हिन्दी में स्वाभाविक रखा गया है।
