base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/017.yaml
  text: Then the priest shall take holy water in an earthen vessel[c][b][a], and the priest shall take some of the dust that is on the floor of the tabernacle and put it into the water.
translation:
  language: hi
  text: फिर याजक मिट्टी के एक पात्र में पवित्र जल[a] ले। वह मिलापवाले तम्बू की भूमि[b] पर पड़ी धूल में से कुछ लेकर जल में डाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात अनुष्ठान के लिए पवित्र ठहराया गया जल।
    reason: lexical_clarification
  - marker: b
    text: या, “मिलापवाले तम्बू के फर्श पर पड़ी धूल।” इब्रानी शब्द का अर्थ “भूमि” या “फर्श” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַיִם קְדֹשִׁים
  choice: पवित्र जल
  rationale: विशेषण קְדֹשִׁים का सीधा अर्थ ‘पवित्र’ है; यहाँ इससे अनुष्ठान के लिए अलग किए गए जल का बोध होता है।
- source_word: בִּכְלִי חָרֶשׂ
  choice: मिट्टी के एक पात्र में
  rationale: כְּלִי सामान्यतः पात्र है और חָרֶשׂ मिट्टी से बने बर्तन की सामग्री बताता है; यह हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: הֶעָפָר
  choice: धूल
  rationale: עָפָר धूल, सूखी मिट्टी या भुरभुरी भूमि को सूचित कर सकता है; इस अनुष्ठानिक प्रसंग में ‘धूल’ उपयुक्त है।
- source_word: בְּקַרְקַע הַמִּשְׁכָּן
  choice: मिलापवाले तम्बू की भूमि पर
  rationale: קַרְקַע का अर्थ भूमि या फर्श हो सकता है। तम्बू के संदर्भ में ‘भूमि’ प्राकृतिक सतह की संभावना बनाए रखता है और मूल की अस्पष्टता सुरक्षित रखता है।
- source_word: מִן הֶעָפָר
  choice: धूल में से कुछ
  rationale: מִן यहाँ अंशवाचक है; याजक सारी धूल नहीं, उसमें से कुछ लेता है।
- source_word: וְלָקַח ... יִקַּח ... וְנָתַן
  choice: ले ... लेकर ... डाल दे
  rationale: यह विधिसंबंधी निर्देशों की क्रमिक शृंखला है; हिन्दी में आज्ञार्थक-विधिक शैली इसे स्पष्ट और स्वाभाविक बनाती है।
- source_word: הַמָּיִם
  choice: जल
  rationale: अंतिम उल्लेख पहले बताए गए पवित्र जल की ओर लौटता है; हिन्दी में पुनः केवल ‘जल’ कहना सहज है।
