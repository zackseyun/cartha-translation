source:
  edition: WLC
  text: וְ/הֵבִ֨יא הָ/אִ֣ישׁ אֶת אִשְׁתּ/וֹ֮ אֶל הַ/כֹּהֵן֒ וְ/הֵבִ֤יא אֶת קָרְבָּנָ/הּ֙ עָלֶ֔י/הָ עֲשִׂירִ֥ת הָ/אֵיפָ֖ה קֶ֣מַח שְׂעֹרִ֑ים לֹֽא יִצֹ֨ק עָלָ֜י/ו שֶׁ֗מֶן וְ/לֹֽא יִתֵּ֤ן עָלָי/ו֙ לְבֹנָ֔ה כִּֽי מִנְחַ֤ת קְנָאֹת֙ ה֔וּא מִנְחַ֥ת זִכָּר֖וֹן מַזְכֶּ֥רֶת עָוֺֽן־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/015.yaml
  text: 'Then the man shall bring his wife to the priest[a], and he shall bring her offering for her: a tenth of an ephah of barley flour. He shall pour no oil on it and put no frankincense on it, because it is a grain offering of jealousy[b], a memorial offering that brings iniquity to remembrance.'
translation:
  language: hi
  text: 'तब वह पुरुष अपनी पत्नी को याजक के पास ले आए, और उसके लिए उसका चढ़ावा भी ले आए: एपा का दसवाँ भाग जौ का आटा। वह उस पर न तेल डाले और न लोबान रखे, क्योंकि यह ईर्ष्या की अन्नबलि है—स्मरण की अन्नबलि[a], जो अधर्म को स्मरण में लाती है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “स्मरण दिलाने वाली अन्नबलि”; इब्रानी पदबंध का अधिक शाब्दिक अनुवाद “स्मरण का चढ़ावा” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “दोष को स्मरण में लाती है”; इब्रानी עָוֹן का अर्थ अधर्म, दोष, या गलत काम से उत्पन्न दायित्व हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא הָאִישׁ אֶת אִשְׁתּוֹ אֶל הַכֹּהֵן
  choice: तब वह पुरुष अपनी पत्नी को याजक के पास ले आए
  rationale: विधिक संदर्भ में क्रिया का निर्देशात्मक बल रखा गया है। הָאִישׁ का मूल अर्थ ‘पुरुष’ है, जबकि ‘अपनी पत्नी’ से वैवाहिक संबंध स्पष्ट हो जाता है।
- source_word: וְהֵבִיא אֶת־קָרְבָּנָהּ עָלֶיהָ
  choice: और उसकी ओर से उसका चढ़ावा भी लाए
  rationale: קָרְבָּן के सामान्य बलिदानी अर्थ के लिए ‘चढ़ावा’ स्वाभाविक है; स्त्रीलिंग प्रत्यय और עָלֶיהָ के प्रतिनिधिक भाव, दोनों को स्पष्ट रखा गया है।
- source_word: עֲשִׂירִת הָאֵיפָה קֶמַח שְׂעֹרִים
  choice: एपा का दसवाँ भाग जौ का आटा
  rationale: प्राचीन माप ‘एपा’ को लिप्यंतरित किया गया है और קֶמַח שְׂעֹרִים को सहज आधुनिक हिन्दी में ‘जौ का आटा’ कहा गया है।
- source_word: לֹא־יִצֹק עָלָיו שֶׁמֶן וְלֹא־יִתֵּן עָלָיו לְבֹנָה
  choice: वह उस पर न तेल डाले और न लोबान रखे
  rationale: निषेधात्मक विधिक बल और दोनों क्रियाओं—‘डालना’ तथा ‘रखना’—को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: מִנְחַת קְנָאֹת
  choice: ईर्ष्या का अन्नबलि
  rationale: याजकीय संदर्भ में מִנְחָה के लिए ‘अन्नबलि’ उपयुक्त है। קְנָאֹת की व्यापकता को ‘ईर्ष्या’ से रखा गया है, बिना स्त्री के दोषी या निर्दोष होने का निष्कर्ष जोड़े।
- source_word: מִנְחַת זִכָּרוֹן מַזְכֶּרֶת עָוֹן
  choice: स्मरण का अन्नबलि, जो अधर्म को स्मरण में लाता है
  rationale: זִכָּרוֹן और מַזְכֶּרֶת की पुनरुक्त स्मरण-भाषा को जानबूझकर बनाए रखा गया है। עָוֹן का मुख्य नैतिक अर्थ ‘अधर्म’ है, जबकि उसकी ‘दोष’ संबंधी अर्थ-छाया पादटिप्पणी में दी गई है।
theological_decisions:
- issue: ईर्ष्या के अन्नबलि का न्यायिक और धार्मिक आशय
  choice: पद को वर्णनात्मक रखा गया है और स्त्री के दोषी होने का पूर्वनिर्णय नहीं जोड़ा गया।
  alternative: इसे स्त्री का दोष पहले से मान लेने वाला चढ़ावा कहना, अथवा इसे केवल प्रतीकात्मक और न्यायिक प्रभाव से रहित बताना।
  rationale: यह पद चढ़ावे की सामग्री और उसके स्मरण कराने वाले कार्य का वर्णन करता है, पर स्त्री की वास्तविक स्थिति का निर्णय इस पद में नहीं देता।
- issue: עָוֹן का अर्थ
  choice: मुख्य पाठ में ‘अधर्म’, पादटिप्पणी में ‘दोष’ अथवा ‘दोष का दायित्व’।
  alternative: मुख्य पाठ में केवल ‘दोष’ रखना।
  rationale: इब्रानी शब्द अपराधपूर्ण कृत्य, दोष और उससे उत्पन्न दायित्व—इन परस्पर संबंधित अर्थों को धारण कर सकता है; मुख्य पाठ और पादटिप्पणी मिलकर इस अर्थ-विस्तार को सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, निर्देशात्मक धार्मिक-विधिक रजिस्टर अपनाया गया है। ‘पुरुष’, ‘याजक’, ‘चढ़ावा’, ‘अन्नबलि’ और ‘लोबान’ सामान्य हिन्दी बाइबिल-पाठकों के लिए परिचित हैं। पादटिप्पणी-चिह्न उन्हीं वाक्यांशों के बाद रखे गए हैं जिनकी वे व्याख्या करते हैं।
