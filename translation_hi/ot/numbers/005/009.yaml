translation:
  language: hi
  text: इस्राएल के पुत्रों[a] की सभी पवित्र भेंटों[b] में से हर अर्पण, जिसे वे याजक के पास लाएँगे[c], उसी का होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली” या “इस्राएल की संतान।” हिब्रू में शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
  - marker: b
    text: या, “पवित्र वस्तुएँ” या “पवित्र चढ़ावे।”
    reason: lexical_alternative
  - marker: c
    text: बलि और भेंट के संदर्भ में इसका अनुवाद “प्रस्तुत करेंगे” भी हो सकता है; शाब्दिक अर्थ है, “निकट लाएँगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תְּרוּמָה
  choice: अंशदान
  rationale: यह शब्द अलग करके दी गई भेंट या याजक को मिलने वाले पवित्र अंश को दर्शाता है। ‘अंशदान’ उस दिए गए अंश का भाव व्यक्त करता है और अत्यधिक तकनीकी भाषा से बचता है।
- source_word: קָדְשֵׁי
  choice: पवित्र भेंटों
  rationale: यहाँ बहुवचन रूप उन वस्तुओं या भेंटों को सूचित करता है जो परमेश्वर के लिए पवित्र ठहराई गई हैं। संदर्भ में ‘पवित्र भेंटें’ स्वाभाविक और स्पष्ट है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: हिब्रू मुहावरे का शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर समुदाय के लिए आधुनिक हिन्दी में ‘इस्राएली’ स्वाभाविक है; शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יַקְרִיבוּ
  choice: पास लाएँगे
  rationale: קרב के हिफ़ील रूप में किसी वस्तु को निकट लाने अथवा धार्मिक संदर्भ में प्रस्तुत करने का भाव है। ‘पास लाएँगे’ मूल चित्र को बनाए रखता है।
- source_word: לַכֹּהֵן
  choice: याजक के पास
  rationale: पूर्वसर्ग यहाँ भेंट को याजक के निकट लाने और उसे सौंपने की दिशा बताता है।
- source_word: לוֹ יִהְיֶה
  choice: उसी का होगा
  rationale: यह हिब्रू विधिक मुहावरा स्वामित्व व्यक्त करता है। ‘उसी का होगा’ याजक को स्पष्ट पूर्वसंदर्भ बनाते हुए बल भी सुरक्षित रखता है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל द्वारा वाचा-समुदाय का नामकरण
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: यह पद समुदाय को सामूहिक रूप से संबोधित करता है। आधुनिक हिन्दी में ‘इस्राएलियों’ उसका स्वाभाविक जातीय-सामुदायिक पद है, जबकि हिब्रू का पारिवारिक और पुल्लिंग रूप पादटिप्पणी में दिया गया है; इससे कोई संप्रदायगत अर्थ आरोपित नहीं होता।
- issue: יַקְרִיבוּ का धार्मिक-सांस्कृतिक भाव
  choice: पास लाएँगे
  alternative: प्रस्तुत करेंगे
  rationale: चुना हुआ रूप ‘निकट लाने’ की मूल क्रिया-छवि को सुरक्षित रखता है, पर पादटिप्पणी यह स्पष्ट करती है कि बलि-संबंधी संदर्भ में इसका अर्थ ‘प्रस्तुत करना’ भी हो सकता है।
