source:
  edition: WLC
  text: וּ֠/בָאוּ הַ/מַּ֨יִם הַ/מְאָרְרִ֤ים הָ/אֵ֨לֶּה֙ בְּֽ/מֵעַ֔יִ/ךְ לַ/צְבּ֥וֹת בֶּ֖טֶן וְ/לַ/נְפִּ֣ל יָרֵ֑ךְ וְ/אָמְרָ֥ה הָ/אִשָּׁ֖ה אָמֵ֥ן אָמֵֽן׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/022.yaml
  text: and may these curse-bringing waters enter your inward parts[a], to make the belly swell and the thigh waste away. And the woman shall say, ‘Amen, amen.’
translation:
  language: hi
  text: और ये शाप लाने वाले जल तेरे भीतरी अंगों में प्रवेश करें, ताकि तेरा पेट फूल जाए और तेरी जाँघ गल जाए।[a] और स्त्री कहे, “आमीन, आमीन।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “पेट फुलाने और जाँघ गिराने के लिए।” इब्रानी अभिव्यक्ति कठिन है और संभवतः जनन-संबंधी विपत्ति के लिए प्रयुक्त एक शिष्टोक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָאוּ
  choice: प्रवेश करें
  rationale: शपथ और शाप के प्रसंग में क्रिया अभिशापसूचक कामना व्यक्त करती है; इसलिए केवल भविष्यकाल के बजाय ‘प्रवेश करें’ रखा गया है।
- source_word: הַמַּיִם הַמְאָרְרִים הָאֵלֶּה
  choice: ये शाप लाने वाले जल
  rationale: बहुवचन ‘जल’ अनुष्ठानिक शैली को बनाए रखता है और participle को ऐसे जल के रूप में व्यक्त करता है जो शाप को प्रभावी करते हैं।
- source_word: בְּמֵעַיִךְ
  choice: तेरे भीतरी अंगों में
  rationale: मूल शब्द शरीर के अंदरूनी भागों या अंगों को दर्शाता है; यह अनुवाद न अत्यधिक चिकित्सकीय है, न अर्थ को केवल पेट तक सीमित करता है।
- source_word: לַצְבּוֹת בֶּטֶן
  choice: ताकि तेरा पेट फूल जाए
  rationale: परिणामसूचक infinitive और בֶּטֶן के प्रत्यक्ष शारीरिक अर्थ को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וְלַנְפִּל יָרֵךְ
  choice: और तेरी जाँघ गल जाए
  rationale: ‘गिरना’ इसका अधिक शाब्दिक अर्थ है, पर इस कठिन मुहावरे में ‘गल जाए’ शारीरिक क्षय को समझने योग्य ढंग से बताता है और किसी निश्चित जनन-संबंधी चिकित्सकीय दशा को नहीं थोपता।
- source_word: וְאָמְרָה הָאִשָּׁה
  choice: तब स्त्री कहे
  rationale: यह विधिक-अनुष्ठानिक निर्देश को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אָמֵן אָמֵן
  choice: आमीन, आमीन
  rationale: दोहराव गंभीर स्वीकृति को दर्शाता है; परिचित अनुष्ठानिक शब्द को यथावत रखा गया है।
theological_decisions:
- issue: शाप के शारीरिक प्रभाव का सटीक स्वरूप
  choice: ‘पेट फूल जाए और जाँघ गल जाए’ के रूप में अपेक्षाकृत शाब्दिक, किंतु पठनीय भाषा
  alternative: ‘गर्भ गिर जाए’, ‘बाँझ हो जाए’ अथवा जननांगों का स्पष्ट उल्लेख
  rationale: इब्रानी अभिव्यक्ति कठिन और संभवतः जनन-संबंधी व्यंजना है, पर इस पद में कोई एक निश्चित चिकित्सकीय परिणाम स्पष्ट नहीं किया गया। इसलिए मुख्य पाठ मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और अनुष्ठानिक है। स्त्री को संबोधन होने के कारण ‘तेरे’ का प्रयोग किया गया है। कठिन शारीरिक अभिव्यक्ति को मुख्य पाठ में जानबूझकर अनिर्णीत रखा गया है।
