source:
  edition: WLC
  text: וְ/עָבַ֨ר עָלָ֧י/ו רֽוּחַ קִנְאָ֛ה וְ/קִנֵּ֥א אֶת אִשְׁתּ֖/וֹ וְ/הִ֣וא נִטְמָ֑אָה אוֹ עָבַ֨ר עָלָ֤י/ו רֽוּחַ קִנְאָה֙ וְ/קִנֵּ֣א אֶת אִשְׁתּ֔/וֹ וְ/הִ֖יא לֹ֥א נִטְמָֽאָה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/014.yaml
  text: and a spirit of jealousy comes over him[a], and he is jealous of his wife, and she has defiled herself; or if a spirit of jealousy comes over him, and he is jealous of his wife, though she has not defiled herself[b],
translation:
  language: hi
  text: और यदि ईर्ष्या की भावना उस पर छा जाए और वह अपनी पत्नी को लेकर ईर्ष्या करे, और पत्नी अशुद्ध हुई हो[a]; या यदि ईर्ष्या की भावना उस पर छा जाए और वह अपनी पत्नी को लेकर ईर्ष्या करे, जबकि पत्नी अशुद्ध न हुई हो[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसने अपने आपको अशुद्ध किया हो।’ इब्रानी में अशुद्धता की भाषा है; यहाँ इसका संबंध संदिग्ध यौन अविश्वास से है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और पत्नी अशुद्ध न हुई हो।’ यहाँ ‘जबकि’ वैकल्पिक कानूनी स्थिति में निहित विरोध को स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָבַר עָלָיו
  choice: उस पर … छा जाए
  rationale: रूआख़ के साथ यह मुहावरा किसी भावना या आवेग के व्यक्ति पर प्रभावी हो जाने को व्यक्त करता है। ‘छा जाए’ आधुनिक हिन्दी में स्वाभाविक है और आकस्मिक, प्रबल प्रभाव को बनाए रखता है।
- source_word: רוּחַ קִנְאָה
  choice: ईर्ष्या की भावना
  rationale: רוּחַ यहाँ हवा या किसी स्वतंत्र आत्मिक सत्ता के बजाय मन को चलाने वाली प्रवृत्ति या मनोदशा का संकेत देता है; קִנְאָה इस वैवाहिक प्रसंग में ईर्ष्या है।
- source_word: וְקִנֵּא אֶת אִשְׁתּוֹ
  choice: वह अपनी पत्नी के विषय में ईर्ष्या करने लगे
  rationale: क्रिया पति की ईर्ष्यापूर्ण प्रतिक्रिया बताती है। ‘करने लगे’ पूर्ववर्ती भावना के छा जाने के बाद की क्रिया-गतिशीलता दिखाता है, और ‘के विषय में’ हिन्दी में आशय को स्पष्ट रखता है।
- source_word: נִטְמָאָה
  choice: अपने आपको अशुद्ध किया हो
  rationale: इस व्यवस्था में शब्द अशुद्धता की भाषा का प्रयोग करता है, पर संदर्भ संदिग्ध यौन अविश्वास का है। ‘अशुद्ध किया’ मूल रूपक और नैतिक-अनुष्ठानिक अर्थक्षेत्र को सुरक्षित रखता है।
- source_word: אוֹ
  choice: या यदि
  rationale: אוֹ दूसरे वैकल्पिक कानूनी प्रसंग को आरम्भ करता है; हिन्दी में ‘या यदि’ उसकी शर्तात्मक भूमिका स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וְהִיא לֹא נִטְמָאָה
  choice: जबकि पत्नी ने अपने आपको अशुद्ध न किया हो
  rationale: मूल में साधारण संयोजक וְ है, पर दूसरी स्थिति पहली के विपरीत है। ‘जबकि’ इस प्रसंगगत विरोध को व्यक्त करता है, बिना कथन की वास्तविकता बदले।
theological_decisions:
- issue: संदिग्ध व्यभिचार की व्यवस्था में अशुद्धता की प्रकृति
  choice: נִטְמָאָה को ‘अपने आपको अशुद्ध किया हो’ कहना
  alternative: ‘अशुद्ध हो गई हो’ या ‘अपवित्र हुई हो’
  rationale: मूल शब्द अशुद्धता का व्यापक धार्मिक-नैतिक रूपक बनाए रखता है, जबकि संदर्भ उसे वैवाहिक यौन अविश्वास से जोड़ता है। यह अनुवाद इसे केवल अनुष्ठानिक अशुद्धता नहीं बनाता और न ही पाठ से आगे कोई सांप्रदायिक निष्कर्ष जोड़ता है।
- issue: दूसरी स्थिति में संयोजक का विरोधात्मक अर्थ
  choice: וְ को प्रसंगानुसार ‘जबकि’ कहना
  alternative: ‘और पत्नी ने अपने आपको अशुद्ध न किया हो’
  rationale: इब्रानी में संयोजक सामान्य ‘और’ है, किंतु कानूनी संरचना निराधार ईर्ष्या की विपरीत संभावना सामने रखती है। मुख्य पाठ में ‘जबकि’ स्वाभाविक हिन्दी देता है और पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी वाक्य की समानांतर संरचना सुरक्षित रखी गई है। ‘ईर्ष्या की भावना’ साधारण पाठक के लिए ‘ईर्ष्या की आत्मा’ से अधिक स्वाभाविक है, जबकि मूल के रुּחַ को मनोदशा/प्रेरक आवेग के रूप में व्यक्त करती है। संबद्ध पदों के साथ निरंतरता के लिए वाक्य अंत में अल्पविराम पर छोड़ा गया है।
