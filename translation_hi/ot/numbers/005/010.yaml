base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/010.yaml
  text: And each man's holy gifts shall be his[b][a]; whatever a man gives to the priest shall be his.
translation:
  language: hi
  text: हर पुरुष की पवित्र भेंटें[a] उसकी अपनी रहेंगी; जो कुछ कोई पुरुष याजक को देगा, वह याजक का होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “उसकी पवित्र वस्तुएँ”; अर्थात पवित्र अर्पण के रूप में अलग रखी गई वस्तुएँ।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: हर पुरुष / कोई पुरुष
  rationale: विधिक प्रसंग में व्याकरणिक पुल्लिंग एकवचन का वितरणात्मक भाव है। पहले प्रयोग में ‘हर पुरुष’ और दूसरे में सामान्य अनिश्चित भाव के लिए ‘कोई पुरुष’ स्वाभाविक है।
- source_word: קֳדָשָׁיו
  choice: उसकी पवित्र भेंटें
  rationale: קדשׁ का बहुवचन यहाँ पवित्र ठहराई गई वस्तुओं या अर्पणों को दर्शाता है। ‘पवित्र भेंटें’ उपासना-संबंधी अर्थ को सहज हिन्दी में व्यक्त करता है; अधिक शाब्दिक विकल्प फुटनोट में दिया गया है।
- source_word: לוֹ יִהְיוּ
  choice: उसकी अपनी रहेंगी
  rationale: यह रचना स्वामित्व बताती है। ‘अपनी’ पहले पुरुष को संदर्भित करती है और ‘रहेंगी’ उसके अधिकार में बने रहने का स्वाभाविक हिन्दी भाव देती है।
- source_word: אֲשֶׁר יִתֵּן לַכֹּהֵן
  choice: जो कुछ कोई पुरुष याजक को देगा
  rationale: सम्बन्धवाचक उपवाक्य का सामान्य और खुला विधिक भाव ‘जो कुछ’ से स्पष्ट होता है; לַכֹּהֵן के निश्चित एकवचन को ‘याजक को’ रखा गया है।
- source_word: לוֹ יִהְיֶה
  choice: वह याजक का होगा
  rationale: अन्तिम स्वामित्व-सूचक वाक्यांश में सर्वनाम का आशय प्रसंगतः याजक है। हिन्दी में केवल ‘उसका’ कहने से अनावश्यक अस्पष्टता हो सकती थी, इसलिए अभिप्रेत संदर्भ को स्पष्ट किया गया है।
