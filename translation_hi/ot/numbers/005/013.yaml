source:
  edition: WLC
  text: וְ/שָׁכַ֨ב אִ֣ישׁ אֹתָ/הּ֮ שִׁכְבַת זֶרַע֒ וְ/נֶעְלַם֙ מֵ/עֵינֵ֣י אִישָׁ֔/הּ וְ/נִסְתְּרָ֖ה וְ/הִ֣יא נִטְמָ֑אָה וְ/עֵד֙ אֵ֣ין בָּ֔/הּ וְ/הִ֖וא לֹ֥א נִתְפָּֽשָׂה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/013.yaml
  text: and a man lies with her[a], with an emission of seed, and it is hidden from the eyes of her husband, and she is concealed, and she has become unclean, and there is no witness against her[c][b], and she was not caught—
translation:
  language: hi
  text: और कोई पुरुष उसके साथ वीर्य-स्राव के साथ सहवास करे[a], और यह बात उसके पति की आँखों से छिपी रहे, और वह छिपी रही हो और अशुद्ध हो गई हो, पर उसके विरुद्ध कोई गवाह न हो[b], और वह पकड़ी न गई हो[c]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का शाब्दिक रूप “बीज का शयन” है; यहाँ आशय वीर्य-स्राव वाले यौन संबंध से है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसके विषय में कोई गवाह न हो।”
    reason: alternative_reading
  - marker: c
    text: या, “वह जकड़ी न गई हो”; कुछ लोग इसे इस अर्थ में समझते हैं कि उसके साथ बलपूर्वक संबंध नहीं बनाया गया था।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשָׁכַב אִישׁ אֹתָהּ
  choice: कोई पुरुष उसके साथ ... सहवास करे
  rationale: यौन प्रसंग में שׁכב עם/את का अर्थ किसी के साथ सहवास करना है। हिंदी में यह स्पष्ट, मर्यादित और विधिक प्रसंग के अनुकूल है।
- source_word: שִׁכְבַת זֶרַע
  choice: वीर्य-स्खलन सहित
  rationale: यह पद शाब्दिक रूप से ‘बीज का शयन’ जैसा है और यहाँ वीर्य-स्खलन वाले यौन संबंध को सूचित करता है। मुख्य पाठ में इसकी शारीरिक विशिष्टता बनाए रखी गई है।
- source_word: וְנֶעְלַם מֵעֵינֵי אִישָׁהּ
  choice: यह बात उसके पति की आँखों से छिपी रहे
  rationale: इब्रानी का निष्क्रिय भाव और ‘आँखों से’ मुहावरा सुरक्षित रखते हुए हिंदी में स्वाभाविक वाक्य बनाया गया है।
- source_word: וְנִסְתְּרָה
  choice: वह स्त्री गुप्त रूप से ऐसा करे
  rationale: निफ़अल रूप में छिपे रहने अथवा गुप्त रूप से कार्य करने का भाव है। हिंदी में कर्ता-संबंध स्पष्ट किया गया है, पर गोपनीयता का मूल भाव बना रहता है।
- source_word: וְהִיא נִטְמָאָה
  choice: अशुद्ध हो जाए
  rationale: טמא की शुद्धता-विधि संबंधी शब्दावली को ‘अशुद्ध’ ठीक प्रकार व्यक्त करता है और केवल भावनात्मक ‘कलंकित’ अर्थ थोपने से बचता है।
- source_word: וְעֵד אֵין בָּהּ
  choice: उसके विरुद्ध कोई गवाह न हो
  rationale: בָּהּ यहाँ स्त्री के विषय में या उसके विरुद्ध गवाही के अभाव को दर्शा सकता है। विधिक बल को स्वाभाविक हिंदी में व्यक्त किया गया है; व्यापक विकल्प पादटिप्पणी में है।
- source_word: וְהִוא לֹא נִתְפָּשָׂה
  choice: वह पकड़ी न गई हो
  rationale: प्रसंग में נתפשׂ का संभावित अर्थ रंगे हाथ या प्रमाण सहित पकड़ा जाना है। ‘पकड़ी’ इस अर्थ को संक्षेप में देता है; ‘जकड़ी/बलपूर्वक पकड़ी’ की संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: נִטְמָאָה की शुद्धता-संबंधी भाषा
  choice: अशुद्ध हो जाए
  alternative: अपवित्र हो जाए
  rationale: ‘अशुद्ध’ गिनती की विधिक और अनुष्ठानिक भाषा को बनाए रखता है, जबकि ‘अपवित्र’ हिंदी में अधिक व्यापक धार्मिक या नैतिक अर्थ ग्रहण कर सकता है।
- issue: לֹא נִתְפָּשָׂה का अर्थ
  choice: पकड़ी न गई हो
  alternative: उसे बलपूर्वक न पकड़ा गया हो
  rationale: निकट संदर्भ में गवाह और पति से बात छिपी होने का उल्लेख ‘पकड़े न जाने’ के अर्थ का समर्थन करता है। फिर भी क्रिया में ‘पकड़े/जकड़े जाने’ का अर्थ संभव है, जिससे कुछ लोग बलप्रयोग का संकेत समझते हैं; इसे टिप्पणी में रखा गया है।
- issue: וְנִסְתְּרָה की वाच्यगत अस्पष्टता
  choice: वह स्त्री गुप्त रूप से ऐसा करे
  alternative: और वह छिपी रहे
  rationale: इब्रानी रूप निष्क्रिय अथवा आत्मवाचक छाया रख सकता है। हिंदी मुख्य पाठ प्रसंगगत गोपनीय कर्म को स्पष्ट करता है, जबकि अर्थ को जानबूझकर किए गए छल तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में विधिक, गंभीर और मर्यादित शैली रखी गई है। ‘सहवास’ स्पष्ट किंतु अश्लील नहीं है; ‘वीर्य-स्खलन सहित’ मूल पद की असामान्य शारीरिक विशिष्टता को सुरक्षित रखता है। वाक्य अगले पद से जुड़ने वाली शर्तात्मक संरचना होने के कारण अंत में दीर्घ विराम-चिह्न रखा गया है।
