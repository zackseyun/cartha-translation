  text: याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: कहा
  rationale: दिव्य वाणी के इस प्रचलित परिचय में דבר का स्वाभाविक आधुनिक हिन्दी रूप ‘कहा’ है; इससे अगले पद में आने वाली वाणी का स्पष्ट संकेत मिलता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में निकट ध्वन्यात्मक रूप ‘याहवे’ रखा गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने के क्रियापद के साथ हिन्दी में संबोधित व्यक्ति को ‘से’ द्वारा व्यक्त करना स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: हिब्रू का वाणी-परिचायक सूत्र हिन्दी में अलग से ‘यह कहते हुए’ जोड़ने पर अनावश्यक पुनरुक्ति उत्पन्न करता; ‘कहा’ आगामी प्रत्यक्ष वचन को स्वाभाविक ढंग से प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और प्रचलित विद्वत्तापूर्ण उच्चारण के निकट है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। हिब्रू के शाब्दिक दोहरे वाणी-सूत्र (‘बोला… कहते हुए’) के स्थान पर स्वाभाविक हिन्दी ‘कहा’ चुना गया है।
