source:
  edition: WLC
  text: וְ/הִתְוַדּ֗וּ אֶֽת חַטָּאתָ/ם֮ אֲשֶׁ֣ר עָשׂוּ֒ וְ/הֵשִׁ֤יב אֶת אֲשָׁמ/וֹ֙ בְּ/רֹאשׁ֔/וֹ וַ/חֲמִישִׁת֖/וֹ יֹסֵ֣ף עָלָ֑י/ו וְ/נָתַ֕ן לַ/אֲשֶׁ֖ר אָשַׁ֥ם לֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/007.yaml
  text: then they shall confess the sin that they have committed[a], and he shall make full restitution for his guilt, adding a fifth to it[b], and give it to the one against whom he was guilty.
translation:
  language: hi
  text: तब वे अपने किए हुए पाप को स्वीकार करें और अपनी देनदारी की पूरी भरपाई करें; मूल राशि में एक-पाँचवाँ भाग और जोड़कर उसे उस व्यक्ति को दें जिसके प्रति वे दोषी हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִתְוַדּוּ
  choice: तब वे ... स्वीकार करें
  rationale: हित्पाएल रूप यहाँ किए हुए अपराध को खुलकर मान लेने का अर्थ देता है; संदर्भ में वाव का क्रमसूचक बल ‘तब’ से व्यक्त हुआ है।
- source_word: חַטָּאתָם אֲשֶׁר עָשׂוּ
  choice: अपने किए हुए पाप को
  rationale: חַטָּאת यहाँ स्वीकार किए जाने वाले पाप या अपराध को सूचित करता है; ‘किए हुए पाप’ आधुनिक हिन्दी में स्वाभाविक और स्रोत के निकट है।
- source_word: וְהֵשִׁיב אֶת־אֲשָׁמוֹ בְּרֹאשׁוֹ
  choice: अपनी देनदारी की पूरी भरपाई करें
  rationale: इस प्रतिपूर्ति-संदर्भ में שוב का हिफ़ील लौटाने या भरपाई करने और אָשָׁם का अर्थ दोष से उत्पन्न देनदारी है। בְּרֹאשׁוֹ मूल राशि की पूर्ण वापसी को दर्शाता है।
- source_word: וַחֲמִישִׁתוֹ יֹסֵף עָלָיו
  choice: उसमें उसका पाँचवाँ भाग और जोड़कर
  rationale: यह मूल राशि के ऊपर उसके पाँचवें भाग, अर्थात बीस प्रतिशत, की वृद्धि बताता है।
- source_word: וְנָתַן לַאֲשֶׁר אָשַׁם לוֹ
  choice: उस व्यक्ति को दें जिसके प्रति उन्होंने दोष किया है
  rationale: इब्रानी वाक्यांश उस व्यक्ति को पानेवाले के रूप में पहचानता है जिसके संबंध में अपराधी दोषी या उत्तरदायी हुआ। यह हिन्दी में अर्थ को स्पष्ट रखते हुए ‘जिसके प्रति’ की संबंधगत बारीकी बचाता है।
theological_decisions:
- issue: प्रतिपूर्ति के संदर्भ में אָשָׁם का अर्थ
  choice: दोष से उत्पन्न आर्थिक देनदारी
  alternative: दोषबलि
  rationale: निकटवर्ती प्रसंग पाप स्वीकार करने, मूल राशि लौटाने, पाँचवाँ भाग जोड़ने और पीड़ित व्यक्ति को भुगतान करने का है। इसलिए यहाँ बलिदान के बजाय प्रतिपूर्ति की देनदारी अभिप्रेत है।
- issue: बहुवचन और एकवचन क्रियारूपों का हिन्दी में निरूपण
  choice: आदरार्थक बहुवचन ‘वे/करें/दें’
  alternative: ‘वह ... करे/दे’
  rationale: इब्रानी में स्वीकार करने की क्रिया बहुवचन है, जबकि प्रतिपूर्ति की क्रियाएँ एकवचन हैं। प्रसंग स्त्री या पुरुष किसी भी अपराधी पर लागू है; आधुनिक सम्मानपूर्ण हिन्दी में ‘वे’ लिंग-समावेशी है, पर संख्या-परिवर्तन की मूल अस्पष्टता को सहज भाषा में समतल कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का विधिक किंतु सामान्य पाठक के लिए बोधगम्य रूप। ‘देनदारी की पूरी भरपाई’ ने मूल राशि की प्रतिपूर्ति को बलिदानी ‘दोषबलि’ से अलग रखा है। कोई पादटिप्पणी आवश्यक नहीं मानी गई।
