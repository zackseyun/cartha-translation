  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: צַ֚ו אֶת בְּנֵ֣י יִשְׂרָאֵ֔ל וִֽ/ישַׁלְּחוּ֙ מִן הַֽ/מַּחֲנֶ֔ה כָּל צָר֖וּעַ וְ/כָל זָ֑ב וְ/כֹ֖ל טָמֵ֥א לָ/נָֽפֶשׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/002.yaml
  text: Command the sons of Israel that they send out of the camp everyone with a skin disease[a], and everyone with a discharge[b], and everyone unclean by a dead body.
translation:
  language: hi
  text: इस्राएलियों को आज्ञा दे कि वे छावनी से हर उस व्यक्ति को बाहर भेज दें जिसे त्वचा की बीमारी हो[a], हर उस व्यक्ति को जिसका शारीरिक स्राव हो, और हर उस व्यक्ति को जो किसी शव के कारण अशुद्ध हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “हर कोढ़ी व्यक्ति को।” इब्रानी शब्द अनुष्ठानिक व्यवस्था के प्रसंगों में त्वचा-रोगों की व्यापक श्रेणी को दर्शाता है; यह आवश्यक नहीं कि आधुनिक कुष्ठरोग ही हो।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “किसी व्यक्ति/प्राण के कारण अशुद्ध।” यह इब्रानी मुहावरा किसी मृत मानव शरीर से होने वाली अशुद्धता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צַו
  choice: आज्ञा दे
  rationale: एकवचन आज्ञार्थक क्रिया मूसा को संबोधित है; यह पद निर्देश की स्पष्ट और अधिकारपूर्ण शक्ति बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह वाचा-समुदाय के लिए सामूहिक नाम है; आधुनिक हिन्दी में ‘इस्राएलियों’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: וִישַׁלְּחוּ מִן הַמַּחֲנֶה
  choice: वे छावनी से … बाहर भेज दें
  rationale: שלח यहाँ शिविर से बाहर भेजने को व्यक्त करता है; इस अनुवाद में गति स्पष्ट है और दंडात्मक ‘निकाल देना’ जैसा अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: כָּל צָרוּעַ
  choice: हर उस व्यक्ति को … जिसे गंभीर चर्मरोग हो
  rationale: यह विधिक शब्द केवल आधुनिक हैन्सन रोग तक सीमित नहीं, बल्कि अनुष्ठानिक व्यवस्था में गंभीर त्वचा-संबंधी व्याधियों की व्यापक श्रेणी बताता है। ‘गंभीर’ रोग की साधारणता का गलत आभास घटाता है।
- source_word: וְכָל זָב
  choice: हर उस व्यक्ति को जिसका शारीरिक स्राव हो
  rationale: זָב शुद्धता-विधि में असामान्य देह-स्राव वाले व्यक्ति को दर्शाता है; ‘शारीरिक स्राव’ संक्षिप्त और पर्याप्त रूप से स्पष्ट है।
- source_word: וְכֹל טָמֵא לָנָפֶשׁ
  choice: हर उस व्यक्ति को जो किसी शव के कारण अशुद्ध हो
  rationale: यह तोराह में मृत मानव शरीर से उत्पन्न अनुष्ठानिक अशुद्धता का मुहावरा है। ‘शव’ आशय को स्वाभाविक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: प्रसंग छावनी की पवित्रता और अनुष्ठानिक स्थिति का है, न कि अनिवार्य रूप से व्यक्तिगत पाप या नैतिक दोष का। ‘अशुद्ध’ טָמֵא के लिए स्पष्ट और प्रचलित समतुल्य है।
- issue: צָרוּעַ को आधुनिक रोग-निदान से जोड़ना
  choice: गंभीर चर्मरोग वाला व्यक्ति
  alternative: कोढ़ी व्यक्ति
  rationale: मूल विधिक पद का दायरा आधुनिक कुष्ठरोग से व्यापक हो सकता है; मुख्य पाठ में व्यापक अर्थ रखा गया और पारंपरिक विकल्प पादटिप्पणी में दिया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘छावनी’, ‘शारीरिक स्राव’ और ‘अशुद्ध’ जैसे शब्द विधिक-अनुष्ठानिक प्रसंग को बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में [b] का चिह्न ‘स्राव’ के बाद था, जबकि उसकी पादटिप्पणी शव-संबंधी अंतिम पद की व्याख्या करती है; स्रोत-साक्ष्य के अनुसार [b] को अंतिम पद के साथ रखा गया है।
