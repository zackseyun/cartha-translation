base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/026.yaml
  text: Then the priest shall take a handful from the grain offering[a], its memorial portion, and burn it on the altar; afterward he shall make the woman drink the water.
translation:
  language: hi
  text: फिर याजक अन्नबलि में से उसका स्मरण-भाग, अर्थात् एक मुट्ठी, ले और उसे वेदी पर जलाए; इसके बाद वह स्त्री को वह पानी[a] पिलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह कड़वा पानी”; व्यापक प्रसंग इस पानी को इसी तरह पहचानता है, पर इस पद में केवल “पानी” कहा गया है।
    reason: शाब्दिक विकल्प और प्रसंगगत स्पष्टीकरण
lexical_decisions:
- source_word: וְקָמַץ
  choice: एक मुट्ठी ले
  rationale: बलि-विधान के संदर्भ में קמץ का अर्थ भेंट में से एक मुट्ठी लेना है। यह अनुवाद अनुष्ठान की विशिष्ट क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: पुरोहितीय और बलि-संबंधी संदर्भ में כֹּהֵן के लिए प्रचलित और गरिमापूर्ण हिन्दी पद।
- source_word: מִן הַמִּנְחָה
  choice: अन्नबलि में से
  rationale: इस पुरोहितीय संदर्भ में מִנְחָה सामान्य भेंट नहीं, अनाज से चढ़ाई जाने वाली बलि है; ‘अन्नबलि’ संक्षिप्त और स्पष्ट है।
- source_word: אֶת אַזְכָּרָתָהּ
  choice: उसका स्मरण-भाग
  rationale: אַזְכָּרָה अन्नबलि के उस प्रतिनिधि भाग को सूचित करता है जो वेदी पर जलाया जाता था। ‘स्मरण-भाग’ तकनीकी अर्थ को बनाए रखता है, और स्त्रीलिंग प्रत्यय को ‘उसका’ द्वारा अन्नबलि से जोड़ा गया है।
- source_word: וְהִקְטִיר הַמִּזְבֵּחָה
  choice: उसे वेदी पर जलाए
  rationale: बलि-संबंधी प्रयोग में הקטיר का आशय किसी वस्तु को वेदी पर जलाकर चढ़ाना है। कर्म ‘उसे’ प्रसंग में स्मरण-भाग से स्पष्ट होता है।
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: यह पद अनुष्ठान की अगली क्रिया का समय-क्रम स्पष्ट करता है।
- source_word: יַשְׁקֶה
  choice: पिलाए
  rationale: שׁקה का हिफ़ील रूप कारक अर्थ रखता है—किसी को पीने देना या पिलाना। हिन्दी ‘पिलाए’ इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת הָאִשָּׁה
  choice: स्त्री को
  rationale: कारक क्रिया ‘पिलाए’ के साथ प्रत्यक्ष कर्म का सहज हिन्दी रूप।
- source_word: אֶת הַמָּיִם
  choice: वह पानी
  rationale: इब्रानी पाठ में यहाँ केवल ‘पानी’ है। ‘वह’ निश्चितता और पहले से उल्लिखित पानी का संकेत देता है, पर निकटवर्ती संदर्भ से ‘कड़वा’ विशेषण मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: क्या मुख्य पाठ में पानी को ‘कड़वा पानी’ कहा जाए
  choice: केवल ‘वह पानी’ रखा गया
  alternative: ‘वह कड़वा पानी’
  rationale: इस पद के इब्रानी पाठ में केवल הַמָּיִם (‘पानी’) है। ‘कड़वा’ निकटवर्ती प्रसंग से ज्ञात है, पर उसे यहाँ जोड़ने से मूल पद की अभिव्यक्ति से आगे बढ़ना होगा।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। विधिक निर्देश को हिन्दी के आज्ञार्थक ‘ले… जलाए… पिलाए’ क्रम में व्यक्त किया गया है। ‘स्मरण-भाग’ तकनीकी बलि-पद है; उसके अर्थ को वाक्य में ‘अर्थात् एक मुट्ठी’ से सहज बनाया गया है।
