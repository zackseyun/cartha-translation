source:
  edition: WLC
  text: מִ/זָּכָ֤ר עַד נְקֵבָה֙ תְּשַׁלֵּ֔חוּ אֶל מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה תְּשַׁלְּח֑וּ/ם וְ/לֹ֤א יְטַמְּאוּ֙ אֶת מַ֣חֲנֵי/הֶ֔ם אֲשֶׁ֥ר אֲנִ֖י שֹׁכֵ֥ן בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/003.yaml
  text: From male to female you shall send them outside the camp[a]; you shall send them out so that they may not defile their camp[b], in the midst of which I dwell.
translation:
  language: hi
  text: पुरुष से लेकर स्त्री तक सभी को छावनी से बाहर भेजो; उन्हें बाहर भेजो, ताकि वे अपनी छावनियों[a] को अशुद्ध न करें, जिनके बीच मैं निवास करता हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उनकी छावनियाँ’ बहुवचन है; यह छावनी के अलग-अलग विभागों या पड़ावों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: '‘जिनके बीच’ का संकेत छावनियों की ओर भी हो सकता है और उनसे संबद्ध लोगों की ओर भी। वैकल्पिक अनुवाद: ‘क्योंकि मैं उनके बीच निवास करता हूँ।’'
    reason: alternative_reading
lexical_decisions:
- source_word: מִזָּכָר עַד נְקֵבָה
  choice: पुरुष से लेकर स्त्री तक, सबको
  rationale: यह इब्रानी पदबंध दोनों लिंगों को समावेशी रूप से व्यक्त करता है। हिंदी में ‘सबको’ जोड़ने से इसका समावेशी अर्थ स्वाभाविक और स्पष्ट होता है।
- source_word: תְּשַׁלֵּחוּ / תְּשַׁלְּחוּם
  choice: बाहर भेज देना / उन्हें बाहर भेज देना
  rationale: שׁלח के पिएल रूप की पुनरावृत्ति को हिंदी में भी दोहराया गया है, ताकि मूल का बल बना रहे और दंडात्मक ‘निकाल देना’ से अधिक न कहा जाए।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी से बाहर
  rationale: यह छावनी की सीमा से बाहर भेजे जाने का स्थानिक अर्थ स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: יְטַמְּאוּ
  choice: अशुद्ध न करें
  rationale: याजकीय शुद्धता के संदर्भ में טמא धार्मिक अथवा अनुष्ठानिक अशुद्धता बताता है; ‘अशुद्ध करना’ हिंदी बाइबलीय संदर्भ में स्पष्ट और उपयुक्त है।
- source_word: מַחֲנֵיהֶם
  choice: अपनी छावनियों
  rationale: इब्रानी संज्ञा बहुवचन है और उसके साथ तृतीय पुरुष बहुवचन प्रत्यय है। ‘अपनी छावनियों’ उस व्याकरणिक बहुवचन को सुरक्षित रखता है, जो छावनी के विभिन्न विभागों अथवा पड़ावों की ओर संकेत कर सकता है।
- source_word: אֲשֶׁר אֲנִי שֹׁכֵן בְּתוֹכָם
  choice: जिनके बीच मैं निवास करता हूँ
  rationale: यह अनुवाद मूल के पुल्लिंग बहुवचन संबंध और परमेश्वर की उपस्थितिमय निवास-भावना को बनाए रखता है, साथ ही छावनियों और उनसे संबद्ध लोगों के बीच की संदर्भगत अस्पष्टता को पूरी तरह समाप्त नहीं करता।
theological_decisions:
- issue: אֲשֶׁר ... בְּתוֹכָם में संबंधवाचक उपवाक्य का संकेत
  choice: ‘जिनके बीच मैं निवास करता हूँ’—व्याकरणिक रूप से बहुवचन छावनियों से जुड़ा, पर सामुदायिक अर्थ के लिए खुला
  alternative: ‘जिनमें मैं निवास करता हूँ’ अथवा ‘जिन लोगों के बीच मैं निवास करता हूँ’
  rationale: इब्रानी בְּתוֹכָם का पुल्लिंग बहुवचन रूप छावनियों अथवा उनसे संबद्ध लोगों की ओर संकेत कर सकता है। चुनी हुई अभिव्यक्ति परमेश्वर के इस्राएल के बीच निवास पर बल देती है, पर संदर्भ को केवल स्थान या केवल लोगों तक सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। आज्ञार्थक भाव के लिए ‘भेज देना’ और याजकीय शुद्धता के लिए ‘अशुद्ध’ रखा गया है।
