lexical_decisions:
- source_word: וְהִקְרִיב אֹתָהּ
  choice: उस स्त्री को पास लाकर
  rationale: हिफ़ील क्रिया קרב का यहाँ स्थान-संबंधी अर्थ ‘पास लाना’ है। स्त्री का स्पष्ट उल्लेख हिंदी में संदर्भ को स्वाभाविक रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना और व्यवस्था के संदर्भ में כֹּהֵן का प्रचलित तथा उपयुक्त हिंदी रूप।
- source_word: וְהֶעֱמִדָהּ
  choice: खड़ा करे
  rationale: עמד के हिफ़ील रूप का कारणवाचक भाव सुरक्षित है; इस वाक्य में ‘खड़ा करे’ सहज आधुनिक हिंदी है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: किसी की उपस्थिति में स्थान ग्रहण कराने का सीधा और स्वाभाविक हिंदी प्रयोग।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय ईश्वरीय नाम को हिंदी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है; पादटिप्पणी मूल रूप स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, व्यक्तिगत ईश्वरीय नाम YHWH है। मुख्य पाठ में ‘यहोवा’ नाम को बनाए रखता है, जबकि पादटिप्पणी हिब्रू रूप और अन्य प्रचलित निरूपण बताती है।
