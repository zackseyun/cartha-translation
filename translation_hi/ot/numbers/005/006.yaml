source:
  edition: WLC
  text: דַּבֵּר֮ אֶל בְּנֵ֣י יִשְׂרָאֵל֒ אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּ֤י יַעֲשׂוּ֙ מִ/כָּל חַטֹּ֣את הָֽ/אָדָ֔ם לִ/מְעֹ֥ל מַ֖עַל בַּ/יהוָ֑ה וְ/אָֽשְׁמָ֖ה הַ/נֶּ֥פֶשׁ הַ/הִֽוא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/006.yaml
  text: 'Speak to the sons of Israel: When a man or a woman commits any of the sins of mankind[a], by acting unfaithfully against Yahweh, then that person is guilty,'
translation:
  language: hi
  text: 'इस्राएलियों से कहो: जब कोई पुरुष या स्त्री मनुष्यों के पापों में से कोई भी पाप करे और इस प्रकार यहोवा के विरुद्ध विश्वासघात करे, तो वह व्यक्ति दोषी होगा।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से कहो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में आदेशसूचक वाक्य है। ‘इस्राएल के पुत्रों’ की अपेक्षा ‘इस्राएलियों’ से वही समुदाय स्पष्ट और सहज रूप में व्यक्त होता है।
- source_word: אִישׁ אוֹ אִשָּׁה
  choice: कोई पुरुष या स्त्री
  rationale: इब्रानी में दिए गए दोनों लिंगों को स्पष्ट रूप से बनाए रखता है और व्यवस्था के प्रत्येक व्यक्ति पर लागू होने का भाव देता है।
- source_word: מִכָּל חַטֹּאת הָאָדָם
  choice: मनुष्यों के पापों में से कोई पाप
  rationale: הָאָדָם यहाँ किसी एक पुरुष का नहीं, मानवजाति का सामान्य बोध कराता है। यह रूप मूल की संरचना और समावेशी अर्थ दोनों को सुरक्षित रखता है।
- source_word: לִמְעֹל מַעַל
  choice: विश्वासघात करे
  rationale: क्रिया और सजातीय संज्ञा का संयोजन निष्ठा भंग करने पर बल देता है। ‘विश्वासघात’ वाचा-संबंधी बेवफाई को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּיהוָה
  choice: यहोवा के प्रति
  rationale: מעל के साथ ב उस व्यक्ति को दर्शाता है जिसके विरुद्ध अथवा जिसके प्रति विश्वासघात हुआ है। हिन्दी में ‘के प्रति’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאָשְׁמָה הַנֶּפֶשׁ הַהִוא
  choice: तो वह व्यक्ति दोषी ठहरेगा
  rationale: נפש यहाँ संपूर्ण व्यक्ति को सूचित करता है, तकनीकी अर्थ में ‘आत्मा’ को नहीं। क्रिया अपराध के फलस्वरूप दोषी अवस्था में आने का बोध देती है।
theological_decisions:
- issue: יהוה का रूपांतरण
  choice: यहोवा
  alternative: प्रभु
  rationale: हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यक्तिगत दिव्य नाम को स्पष्ट रूप से सुरक्षित रखता है; इसे केवल उपाधि में बदलने से मूल पाठ में उपस्थित नाम अस्पष्ट हो जाता।
- issue: הָאָדָם का सामान्य मानवीय अर्थ
  choice: मनुष्यों
  alternative: मनुष्य
  rationale: संदर्भ में यह शब्द पुरुष-विशेष नहीं बल्कि मानवजाति को सामान्य रूप से दर्शाता है। बहुवचन हिन्दी रूप उस अर्थ को स्पष्ट करता है, जबकि साथ का पदबंध मूल के ‘पापों में से कोई पाप’ को बनाए रखता है।
- issue: אָשֵׁם की परिणामी दोषावस्था
  choice: दोषी ठहरेगा
  alternative: दोषी होगा
  rationale: यह अनुवाद अपराध से उत्पन्न उत्तरदायित्व को व्यक्त करता है, बिना यह तय किए कि यहाँ औपचारिक न्यायिक घोषणा ही अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक संदर्भ के अनुरूप रखी गई है। ‘इस्राएलियों’ और ‘व्यक्ति’ जैसे सहज रूपों का प्रयोग किया गया है; साथ ही ‘पुरुष या स्त्री’, ‘विश्वासघात’ और ‘दोषी’ द्वारा मूल की स्पष्टता और नैतिक गंभीरता सुरक्षित है।
