  text: וְ/הִשְׁבִּ֨יעַ אֹתָ֜/הּ הַ/כֹּהֵ֗ן וְ/אָמַ֤ר אֶל הָֽ/אִשָּׁה֙ אִם לֹ֨א שָׁכַ֥ב אִישׁ֙ אֹתָ֔/ךְ וְ/אִם לֹ֥א שָׂטִ֛ית טֻמְאָ֖ה תַּ֣חַת אִישֵׁ֑/ךְ הִנָּקִ֕י מִ/מֵּ֛י הַ/מָּרִ֥ים הַֽ/מְאָרֲרִ֖ים הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/019.yaml
  text: Then the priest shall make her swear and shall say to the woman[a], ‘If no man has lain with you, and if you have not gone astray in uncleanness under your husband[c][b], be free from these bitter waters that bring a curse.’
translation:
  language: hi
  text: तब याजक उस स्त्री को शपथ दिलाकर उससे कहे, “यदि किसी पुरुष ने तुम्हारे साथ सहवास नहीं किया है, और यदि तुम अपने पति के अधीन रहते हुए अशुद्धता में नहीं भटकी हो, तो इन शाप लानेवाले कड़वे जलों से मुक्त रहो।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इन शाप लानेवाले कड़वे जलों के विषय में निर्दोष रहो।”
    reason: הִנָּקִי दोष से निर्दोष ठहरने और अनुष्ठान के दंडकारी प्रभाव से मुक्त रहने, दोनों का भाव दे सकता है।
lexical_decisions:
- source_word: וְהִשְׁבִּיעַ
  choice: शपथ दिलाकर
  rationale: हिफ़ील रूप का कारक अर्थ है—किसी को शपथ दिलाना या शपथ के अधीन करना। यह हिंदी में स्वाभाविक और विधिक प्रसंग के अनुकूल है।
- source_word: אִם לֹא שָׁכַב אִישׁ אֹתָךְ
  choice: यदि किसी पुरुष ने तुम्हारे साथ सहवास नहीं किया है
  rationale: שׁכב यहाँ यौन-संबंध के लिए शिष्टोक्ति है। ‘सहवास’ अर्थ स्पष्ट रखते हुए गरिमापूर्ण आधुनिक हिंदी देता है।
- source_word: שָׂטִית טֻמְאָה
  choice: अशुद्धता की ओर नहीं भटकी हो
  rationale: שׂטה के भटकने के रूपक और טֻמְאָה की नैतिक-अनुष्ठानिक अस्पष्टता, दोनों को बनाए रखता है; सीधे ‘व्यभिचार’ कहकर अर्थ को सीमित नहीं करता।
- source_word: תַּחַת אִישֵׁךְ
  choice: अपने पति के अधीन रहते हुए
  rationale: इब्रानी मुहावरा स्त्री की विवाहित स्थिति और विवाह-बंधन में उसके दायित्व को सूचित करता है। निकटवर्ती रूपांतरण सांस्कृतिक दूरी को बनाए रखता है, जिसे पादटिप्पणी स्पष्ट करती है।
- source_word: הִנָּקִי
  choice: तुम्हें कोई हानि न हो
  rationale: נקה यहाँ दोष अथवा दंडकारी प्रभाव से मुक्त रहने का भाव देता है। हिंदी में यह कामनार्थक/परिणामसूचक वाक्यांश अनुष्ठान के आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמֵּי הַמָּרִים הַמְאָרֲרִים הָאֵלֶּה
  choice: शाप लानेवाले इस कड़वे जल से
  rationale: ‘जल’ हिंदी में द्रव्यवाचक एकवचन के रूप में स्वाभाविक है, जबकि विशेषणात्मक कृदंत जल को शाप प्रभावी करनेवाला बताता है।
theological_decisions:
- issue: स्त्री के कथित अपराध की भाषा
  choice: ‘सहवास’, ‘अशुद्धता की ओर भटकना’ और वैवाहिक अधीनता की मूल छवियाँ बनाए रखना
  alternative: स्पष्टतः ‘व्यभिचार करना’ कहना
  rationale: प्रसंग वैवाहिक यौन अविश्वास का है, पर मूल पाठ उसे अलग-अलग विधिक और शुद्धता-संबंधी पदों में व्यक्त करता है। अधिक स्पष्ट शब्द मूल की अर्थगत परतों को अनावश्यक रूप से समेट देगा।
- issue: कड़वे जल का प्रभाव
  choice: ‘शाप लानेवाला’ और ‘कोई हानि न हो’
  alternative: ‘शाप देनेवाला जल’ अथवा ‘इस जल से निर्दोष ठहरो’
  rationale: कृदंत जल के शापकारी प्रभाव को व्यक्त करता है, जबकि הִנָּקִי निर्दोषता और उसके फलस्वरूप दंड से मुक्ति—दोनों की छाया रखता है। मुख्य पाठ परिणाम को स्वाभाविक हिंदी में देता है और पादटिप्पणी वैकल्पिक निकट अर्थ बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक-अनुष्ठानिक शैली रखी गई है। ‘सहवास’ स्पष्ट किंतु अशिष्ट नहीं है; ‘अशुद्धता’ मूल की नैतिक और अनुष्ठानिक अर्थ-सीमा को खुला रखती है।
