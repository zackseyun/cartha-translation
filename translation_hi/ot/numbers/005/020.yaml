id: NUM.5.20
reference: Numbers 5:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אַ֗תְּ כִּ֥י שָׂטִ֛ית תַּ֥חַת אִישֵׁ֖/ךְ וְ/כִ֣י נִטְמֵ֑את וַ/יִּתֵּ֨ן אִ֥ישׁ בָּ/ךְ֙ אֶת שְׁכָבְתּ֔/וֹ מִֽ/בַּלְעֲדֵ֖י אִישֵֽׁ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/020.yaml
  text: But if you have gone astray while under your husband[a], and if you have become defiled[c][b], and a man has lain with you besides your husband—
translation:
  language: hi
  text: परन्तु यदि तू अपने पति के अधीन रहते[a] भटक गई है, और अशुद्ध हो गई है, और तेरे पति के अतिरिक्त किसी पुरुष ने तेरे साथ यौन-सम्बन्ध किया है—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने पति के अधीन रहते”; यह इब्रानी मुहावरा स्त्री के वैवाहिक बन्धन में होने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׂטִית
  choice: उससे भटक गई है
  rationale: ‘भटकना’ मूल क्रिया के मार्ग से हटने वाले रूपक को बनाए रखता है; ‘उससे’ वैवाहिक निष्ठा के सन्दर्भ को हिन्दी में स्पष्ट और स्वाभाविक बनाता है।
- source_word: תַּחַת אִישֵׁךְ
  choice: अपने पति के रहते
  rationale: शाब्दिक अर्थ ‘अपने पति के अधीन’ है, पर यहाँ यह स्त्री के वैवाहिक बन्धन में होने को सूचित करता है। ‘अपने पति के रहते’ उस सम्बन्धगत भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: נִטְמֵאת
  choice: अपने को अशुद्ध कर लिया है
  rationale: यहाँ טמא का निफ़अल रूप यौन कृत्य से उत्पन्न विधिक-धार्मिक अशुद्धता को दर्शाता है। ‘अशुद्ध’ मूल पाठ की श्रेणी को बनाए रखता है।
- source_word: וַיִּתֵּן אִישׁ בָּךְ אֶת שְׁכָבְתּוֹ
  choice: किसी दूसरे पुरुष ने तेरे साथ यौन-सम्बन्ध बनाया है
  rationale: इब्रानी पदबंध शाब्दिक रूप से पुरुष द्वारा अपना ‘शयन’ स्त्री में देने का शिष्टोक्ति-प्रयोग है। स्पष्ट आधुनिक हिन्दी में इसका आशय यौन-सम्बन्ध है। ‘दूसरे’ को अगली बहिष्करणात्मक अभिव्यक्ति के अर्थ से लिया गया है।
- source_word: מִבַּלְעֲדֵי אִישֵׁךְ
  choice: तेरे पति को छोड़
  rationale: यह पद पति को अपवाद बनाते हुए किसी अन्य पुरुष को इंगित करता है; ‘तेरे पति को छोड़’ हिन्दी में उस बहिष्करण को स्पष्ट करता है।
theological_decisions:
- issue: वैवाहिक विश्वासघात के रूपक और यौन कृत्य की शिष्टोक्ति का अनुवाद
  choice: पहले खण्ड में ‘भटक गई’ रूपक को बनाए रखना और अगले खण्ड में ‘यौन-सम्बन्ध’ द्वारा आशय स्पष्ट करना
  alternative: पूरे वाक्य में सीधे ‘अपने पति से विश्वासघात किया’ कहना, अथवा ‘तेरे साथ सोया’ जैसी शिष्टोक्ति रखना
  rationale: मूल पद पहले वैवाहिक मार्ग से विचलन का रूपक और फिर यौन कृत्य की इब्रानी शिष्टोक्ति रखता है। यह अनुवाद पहले रूपक को बचाते हुए आधुनिक पाठक के लिए बाद वाले कृत्य को स्पष्ट करता है और मूल से अधिक नैतिक अथवा सम्प्रदायगत भाषा नहीं जोड़ता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। प्रसंग के विधिक सम्बोधन के अनुरूप एकवचन ‘तू/तेरे’ रखा गया है। वाक्य के अन्त का दीर्घ विराम अगले पद में जारी शपथ-वाक्य को दर्शाता है।
