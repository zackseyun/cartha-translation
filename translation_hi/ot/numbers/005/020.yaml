review_pass:
  verdict: revise
  source_fidelity: The draft conveys the marital-infidelity setting and the exclusion of the husband, but two renderings need adjustment. נִטְמֵאת is Niphal ('have become defiled/unclean'), not reflexive-active 'अपने को अशुद्ध कर लिया है.' Also, 'यौन-सम्बन्ध बनाया है' is less idiomatic and less precise for the Hebrew euphemism than 'तेरे साथ यौन-सम्बन्ध किया है.'
  naturalness: The revised wording is clear, dignified modern Hindi and retains the legal, second-person-singular register. 'अपने पति के अधीन रहते' is somewhat formal but accurately preserves the Hebrew marital idiom; the note makes its contextual force clear.
  terminology: '''अशुद्ध हो गई है'' preserves the ritual-legal category without adding a denominational interpretation. ''यौन-सम्बन्ध किया है'' communicates the sexual euphemism plainly. ''अपने पति के अतिरिक्त'' accurately represents the exclusion expressed by מִבַּלְעֲדֵי.'
  issues:
  - severity: medium
    issue: ‘अपने को अशुद्ध कर लिया है’ renders a Niphal form as a reflexive, self-caused action.
    rationale: נִטְמֵאת means ‘you have become defiled/unclean.’ The reflexive-active Hindi wording can imply an agency not stated by the Hebrew.
  - severity: low
    issue: ‘तेरे साथ यौन-सम्बन्ध बनाया है’ is not the most natural collocation here.
    rationale: The Hebrew denotes that a man has had sexual relations with her. In modern standard Hindi, ‘तेरे साथ यौन-सम्बन्ध किया है’ is clearer and more idiomatic.
  - severity: low
    issue: The main text’s ‘अपने पति के रहते उससे भटक गई है’ smooths over the Hebrew idiom ‘under your husband.’
    rationale: Although the footnote records the literal phrase, using ‘अपने पति के अधीन रहते’ in the text better preserves the source’s marital-legal idiom without making its interpretation overly explicit.
  revised_text: परन्तु यदि तू अपने पति के अधीन रहते[a] भटक गई है, और अशुद्ध हो गई है, और तेरे पति के अतिरिक्त किसी पुरुष ने तेरे साथ यौन-सम्बन्ध किया है—
