base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/011.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक रूप के साथ דבר यहाँ नई ईश्वरीय वाणी का परिचय देता है। आधुनिक हिन्दी में ‘मूसा से कहा’ इस सूत्र का स्वाभाविक और सटीक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण रखा गया है।
- source_word: אֶל
  choice: से
  rationale: कथन की क्रिया के साथ हिन्दी में संबोधित व्यक्ति को ‘से’ द्वारा स्वाभाविक रूप से व्यक्त किया जाता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: מֹשֶׁה नाम का हिन्दी में प्रचलित बाइबलीय रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह इन्फिनिटिव अगले कथन की भूमिका बाँधने वाले हिब्रू सूत्र का भाग है। हिन्दी में ‘ने…से कहा’ इस संयुक्त सूत्र को बिना अनावश्यक दोहराव के स्वाभाविक रूप देता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरीय व्यक्तिगत नाम יהוה सीधे प्रयुक्त है। ‘याहवे’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए स्वाभाविक। हिब्रू के लंबे वाणी-परिचय सूत्र को हिन्दी की स्वाभाविक रचना ‘ने…से कहा’ में व्यक्त किया गया है।
