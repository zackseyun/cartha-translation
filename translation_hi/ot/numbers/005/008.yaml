id: NUM.5.8
reference: Numbers 5:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִם אֵ֨ין לָ/אִ֜ישׁ גֹּאֵ֗ל לְ/הָשִׁ֤יב הָ/אָשָׁם֙ אֵלָ֔י/ו הָ/אָשָׁ֛ם הַ/מּוּשָׁ֥ב לַ/יהוָ֖ה לַ/כֹּהֵ֑ן מִ/לְּ/בַ֗ד אֵ֚יל הַ/כִּפֻּרִ֔ים אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ עָלָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/005/008.yaml
  text: But if the man has no kinsman-redeemer to whom restitution for the guilt may be returned[a], the restitution for the guilt that is returned to Yahweh belongs to the priest[b], besides the ram of atonement by which atonement is made for him.
translation:
  language: hi
  text: पर यदि उस मनुष्य का कोई छुड़ानेवाला निकट संबंधी न हो, जिसे दोष का हर्जाना लौटाया जा सके[a], तो दोष का वह हर्जाना, जो यहोवा को लौटाया जाता है, याजक का होगा[b]। यह प्रायश्चित के उस मेढ़े के अतिरिक्त होगा, जिसके द्वारा उस मनुष्य के लिए प्रायश्चित किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छुड़ानेवाला” अथवा “निकटतम संबंधी।” इब्रानी גֹּאֵל ऐसे पारिवारिक सदस्य को दर्शाता है जिस पर छुटकारे या प्रतिपूर्ति के मामलों में कानूनी दायित्व होता था।
    reason: lexical_alternative
  - marker: b
    text: यहाँ इब्रानी אָשָׁם दोष के कारण चुकाए जानेवाले हर्जाने या प्रतिपूर्ति को दर्शाता है, स्वयं मेढ़े को नहीं; मेढ़े का उल्लेख इसके बाद अलग से किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּאֵל
  choice: छुड़ानेवाला निकट संबंधी
  rationale: यह पद ऐसे पारिवारिक सदस्य को दर्शाता है जिस पर छुटकारे, संपत्ति अथवा प्रतिपूर्ति से जुड़ा कानूनी दायित्व होता था। संयुक्त अभिव्यक्ति इसके पारिवारिक और विधिक दोनों पक्षों को बनाए रखती है।
- source_word: הָאָשָׁם
  choice: दोष का हर्जाना
  rationale: इस प्रसंग में यह शब्द अपराध के कारण चुकाई जानेवाली प्रतिपूर्ति को दर्शाता है, न कि बलि के मेढ़े को; मेढ़े का उल्लेख आगे अलग से है।
- source_word: הָאָשָׁם הַמּוּשָׁב
  choice: दोष का वह हर्जाना, जो ... लौटाया जाता है
  rationale: שוב के कर्मवाच्य कृदंत में लौटाने या वापस चुकाने की कानूनी क्रिया स्पष्ट है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: व्यक्तिवाचक ईश्वरीय नाम יהוה को हिंदी में प्रचलित रूप 'यहोवा' से व्यक्त किया गया है; यहाँ हर्जाना उसे समर्पित होकर याजक को मिलता है।
- source_word: לַכֹּהֵן
  choice: याजक का होगा
  rationale: इब्रानी के संक्षिप्त संबंधवाचक विन्यास को स्वाभाविक हिंदी में कानूनी अधिकार के रूप में स्पष्ट किया गया है।
- source_word: מִלְּבַד
  choice: के अतिरिक्त
  rationale: यह बताता है कि प्रायश्चित का मेढ़ा हर्जाने से अलग और उसके साथ आवश्यक है।
- source_word: אֵיל הַכִּפֻּרִים
  choice: प्रायश्चित का मेढ़ा
  rationale: यह सहज हिंदी में पशु और उसके बलिदानी प्रयोजन, दोनों को सुरक्षित रखता है।
- source_word: יְכַפֶּר בּוֹ עָלָיו
  choice: जिसके द्वारा उस मनुष्य के लिए प्रायश्चित किया जाएगा
  rationale: कर्मवाच्य रूप मेढ़े को प्रायश्चित का साधन बताता है और वहाँ स्पष्ट कर्ता नहीं जोड़ता जहाँ इब्रानी में वह अंतर्निहित है।
- source_word: לָאִישׁ
  choice: उस मनुष्य
  rationale: मूल पाठ का पुल्लिंग एकवचन बनाए रखा गया है।
theological_decisions:
- issue: हर्जाने और बलिदान का परस्पर संबंध
  choice: आर्थिक प्रतिपूर्ति और प्रायश्चित का मेढ़ा दो अलग वस्तुएँ हैं; निकट संबंधी न होने पर भी दोनों की व्यवस्था रहती है।
  alternative: אָשָׁם को स्वयं दोषबलि समझना
  rationale: מִלְּבַד, 'के अतिरिक्त,' अगले मेढ़े को हर्जाने से स्पष्टतः अलग करता है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु; याहवे
  rationale: मूल का व्यक्तिगत ईश्वरीय नाम हिंदी में स्पष्ट रखा गया है; 'यहोवा' सामान्य पाठकों के लिए परिचित मानक रूप है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिंदी अपनाई गई है। कानूनी अर्थ के लिए 'हर्जाना' और पारिवारिक-विधिक भूमिका के लिए 'छुड़ानेवाला निकट संबंधी' रखा गया है। वाक्य को दो वाक्यों में बाँटकर मूल के संबंधों और बलिदान-प्रतिपूर्ति के भेद को स्पष्ट रखा गया है।
