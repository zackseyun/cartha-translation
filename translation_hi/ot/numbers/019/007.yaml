  text: וְ/כִבֶּ֨ס בְּגָדָ֜י/ו הַ/כֹּהֵ֗ן וְ/רָחַ֤ץ בְּשָׂר/וֹ֙ בַּ/מַּ֔יִם וְ/אַחַ֖ר יָב֣וֹא אֶל הַֽ/מַּחֲנֶ֑ה וְ/טָמֵ֥א הַ/כֹּהֵ֖ן עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/007.yaml
  text: Then the priest shall wash his clothes and bathe his body in water[a], and afterward he may come into the camp[b]; but the priest shall be unclean until evening.
translation:
  language: hi
  text: तब याजक अपने कपड़े धोए और अपने शरीर को पानी से धोए। इसके बाद वह छावनी में आ सकता है; पर याजक अशुद्ध[a] शाम तक रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “अशुद्ध” होने का अर्थ अनुष्ठानिक अशुद्धता है; इसका यह अर्थ आवश्यक नहीं कि याजक ने कोई व्यक्तिगत पाप या नैतिक अपराध किया था।
    reason: cultural_note
lexical_decisions:
- source_word: וְכִבֶּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: כּבס का पिएल रूप वस्त्र धोने को दर्शाता है। विधिक निर्देश के संदर्भ में हिंदी का विध्यर्थक रूप स्वाभाविक है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: याजकीय और अनुष्ठानिक संदर्भ में כֹּהֵן का मानक, प्रतिष्ठित हिंदी पर्याय।
- source_word: וְרָחַץ בְּשָׂרוֹ בַּמַּיִם
  choice: अपने शरीर को पानी से नहाए
  rationale: בָּשָׂר यहाँ पूरे शरीर को सूचित करता है; 'शरीर' आधुनिक हिंदी में 'मांस' से अधिक स्पष्ट है। רחץ को 'नहाए' कहना पहले आए 'धोए' से अनावश्यक पुनरावृत्ति बचाता है।
- source_word: וְאַחַר
  choice: इसके बाद
  rationale: अनुष्ठान की क्रमिकता को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: वह छावनी में आ सकता है
  rationale: यहाँ अपूर्ण क्रिया धुलाई के बाद प्रवेश की अनुमति के अर्थ में समझी जा सकती है; 'आ सकता है' उस भाव को व्यक्त करता है, जबकि मूल की संभावित विध्यर्थकता को निर्णयों में दर्ज रखा गया है।
- source_word: וְטָמֵא
  choice: अशुद्ध रहेगा
  rationale: विधिक प्रसंग में यह एक निश्चित, अस्थायी अनुष्ठानिक स्थिति बताता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: समय-सीमा का स्वाभाविक और सटीक आधुनिक हिंदी रूप।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: अनुष्ठानिक अशुद्धता
  alternative: नैतिक दोष या व्यक्तिगत पाप
  rationale: गिनती 19 में טמא शुद्धीकरण-विधि से जुड़ी अस्थायी धार्मिक-अनुष्ठानिक स्थिति है; इससे अपने-आप नैतिक अपराध सिद्ध नहीं होता।
- issue: छावनी में लौटने का क्रियाभाव
  choice: अनुमत पुनःप्रवेश—'आ सकता है'
  alternative: निर्देशात्मक/भविष्यसूचक—'छावनी में आएगा'
  rationale: יָבֹא रूप स्वयं स्पष्ट रूप से अनुमति-सूचक चिह्नित नहीं है, पर विधिक क्रम में धुलाई के बाद प्रवेश की अनुमति का अर्थ प्रसंगानुकूल है। इस वास्तविक अस्पष्टता को निर्णय में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'याजक', 'छावनी' और 'अशुद्ध' जैसे प्रचलित बाइबलीय शब्द अनुष्ठानिक संदर्भ की स्पष्टता बनाए रखते हैं।
