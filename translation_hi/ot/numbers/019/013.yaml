base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/013.yaml
  text: Everyone who touches a dead person[a], the body of a man who has died, and does not purify himself, has defiled the tabernacle of Yahweh, and that person shall be cut off from Israel. Because the water for impurity was not sprinkled on him, he shall be unclean; his uncleanness is still on him.
translation:
  language: hi
  text: जो कोई किसी मृत व्यक्ति को—अर्थात किसी मरे हुए मनुष्य के शव को—छूता है और अपने को शुद्ध नहीं करता, उसने याहवे के निवास-तंबू को अशुद्ध कर दिया है। उस व्यक्ति को इस्राएल में से काट दिया जाएगा। क्योंकि अशुद्धता का जल[a] उस पर नहीं छिड़का गया, इसलिए वह अशुद्ध रहेगा; उसकी अशुद्धता अब भी उस पर बनी हुई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धि का जल।” हिब्रू में शाब्दिक अर्थ “अशुद्धता का जल” है; आशय उस जल से है जिसका उपयोग शव-संपर्क से हुई अशुद्धता दूर करने के लिए किया जाता था।
    reason: मूल पद מֵי נִדָּה के शाब्दिक रूप और उसके प्रसंगगत कार्य, दोनों को स्पष्ट करना।
lexical_decisions:
- source_word: הַנֹּגֵעַ בְּמֵת
  choice: किसी मृत व्यक्ति को…छूता है
  rationale: נגע शारीरिक संपर्क को व्यक्त करता है; ‘छूता है’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בְּנֶפֶשׁ הָאָדָם אֲשֶׁר יָמוּת
  choice: अर्थात किसी मरे हुए मनुष्य के शव को
  rationale: शव से उत्पन्न अशुद्धता के इस प्रसंग में נֶפֶשׁ मृत देह को सूचित करता है। ‘अर्थात’ पहले पद के साथ इसके समानाधिकरण संबंध को स्पष्ट करता है, जबकि ‘मनुष्य’ אָדָם के सामान्य मानवीय अर्थ को रखता है।
- source_word: יִתְחַטָּא
  choice: अपने को शुद्ध नहीं करता
  rationale: यहाँ חטא का हित्पएल रूप नैतिक पश्चात्ताप नहीं, विधिवत शुद्ध होने की क्रिया बताता है।
- source_word: מִשְׁכַּן יְהוָה
  choice: याहवे के निवास-स्थान
  rationale: מִשְׁכָּן परमेश्वर के निवास अथवा पवित्र तम्बू को सूचित करता है; ‘निवास-स्थान’ अर्थ को सहज हिन्दी में रखता है और יְהוָה को उसके नाम ‘याहवे’ से प्रस्तुत करता है।
- source_word: טִמֵּא
  choice: अशुद्ध करता है
  rationale: पिएल रूप यहाँ पवित्र निवास को धार्मिक-विधि की दृष्टि से अपवित्र या अशुद्ध करने का भाव देता है। ‘अशुद्ध करता है’ प्रसंग की शब्दावली से संगति रखता है।
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא מִיִּשְׂרָאֵל
  choice: उस व्यक्ति को इस्राएल में से काट दिया जाएगा
  rationale: נֶפֶשׁ यहाँ व्यक्ति को दर्शाता है। ‘काट दिया जाएगा’ वाचा-संबंधी दंडसूत्र को बनाए रखता है और दंड की ठीक रीति को निर्धारित नहीं करता।
- source_word: מֵי נִדָּה
  choice: अशुद्धता का जल
  rationale: यह हिब्रू पद का निकट रूप है और शव-संपर्क की अशुद्धता दूर करने के लिए तैयार जल को दर्शाता है। अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: זֹרַק עָלָיו
  choice: उस पर नहीं छिड़का गया
  rationale: अनुष्ठान के प्रसंग में क्रिया का अर्थ जल छिड़कना है; निष्क्रिय हिन्दी रचना स्रोत के भाव को ठीक रखती है।
- source_word: טָמֵא יִהְיֶה
  choice: वह अशुद्ध रहेगा
  rationale: आगे की पंक्ति के साथ मिलकर यह उसकी अशुद्ध दशा के जारी रहने को बताता है; ‘रहेगा’ हिन्दी में इस निरंतरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עוֹד טֻמְאָתוֹ בוֹ
  choice: उसकी अशुद्धता अब भी उस पर बनी हुई है
  rationale: עוֹד निरंतरता बताता है और בּוֹ अशुद्धता के व्यक्ति पर बने रहने की छवि रखता है।
theological_decisions:
- issue: ‘काट दिया जाएगा’ दंडसूत्र का अर्थ
  choice: वाचा-संबंधी सूत्र को ‘इस्राएल में से काट दिया जाएगा’ के रूप में बनाए रखा गया।
  alternative: ‘मार डाला जाएगा’ या ‘समुदाय से निकाल दिया जाएगा’
  rationale: इस पद में दंड की सटीक रीति—मृत्यु, बहिष्कार या कोई ईश्वरीय दंड—स्पष्ट नहीं की गई है; किसी एक व्याख्या को चुनना मूल की वास्तविक अस्पष्टता मिटा देता।
- issue: शव-संपर्क से संबंधित अशुद्धता
  choice: इसे धार्मिक-विधि की अशुद्धता के रूप में व्यक्त किया गया, नैतिक पाप के रूप में नहीं।
  alternative: ‘पाप से शुद्ध होना’
  rationale: अध्याय का प्रसंग शव के संपर्क और निर्धारित शुद्धिकरण-विधि का है; יִתְחַטָּא यहाँ अनुष्ठानिक शुद्धि को सूचित करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी अपनाई गई है। धार्मिक-विधि की शब्दावली में ‘शुद्ध/अशुद्ध’ की पुनरावृत्ति जानबूझकर रखी गई है। समानाधिकरण वाक्यांश को दीर्घ विराम-चिह्नों से स्पष्ट किया गया है और अस्पष्ट दंडसूत्र को व्याख्यात्मक रूप से सीमित नहीं किया गया।
