  text: וְ/אָסַ֣ף אִ֣ישׁ טָה֗וֹר אֵ֚ת אֵ֣פֶר הַ/פָּרָ֔ה וְ/הִנִּ֛יחַ מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה בְּ/מָק֣וֹם טָה֑וֹר וְ֠/הָיְתָה לַ/עֲדַ֨ת בְּנֵֽי יִשְׂרָאֵ֧ל לְ/מִשְׁמֶ֛רֶת לְ/מֵ֥י נִדָּ֖ה חַטָּ֥את הִֽוא׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/009.yaml
  text: Then a clean man shall gather the ashes of the heifer and place them outside the camp in a clean place[a], and they shall be kept for the congregation of the sons of Israel for water for impurity[b]; it is a sin offering.
translation:
  language: hi
  text: तब कोई शुद्ध पुरुष बछिया की राख बटोरकर छावनी के बाहर किसी शुद्ध स्थान में रखे। वह राख इस्राएलियों की मण्डली के लिए अशुद्धता के जल हेतु सुरक्षित रखी जाए[a]; यह पापबलि है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अशुद्धता का जल”; अथवा, अधिक स्वाभाविक रूप में, “शुद्धिकरण का जल।”
    reason: lexical_alternative
  - marker: b
    text: अथवा, “यह शुद्धिकरण-बलि है।” इब्रानी חַטָּאת का अर्थ ‘पापबलि’ हो सकता है और याजकीय प्रसंगों में यह शुद्धिकरण के लिए चढ़ाई जाने वाली बलि को भी सूचित कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ טָהוֹר
  choice: कोई शुद्ध पुरुष
  rationale: אִישׁ पुल्लिंग एकवचन ‘पुरुष’ है और טָהוֹר इस विधि के संदर्भ में अनुष्ठानिक शुद्धता बताता है। ‘शुद्ध पुरुष’ संक्षिप्त है और संदर्भ से इसका विधिक अर्थ स्पष्ट होता है।
- source_word: אָסַף
  choice: बटोरकर
  rationale: क्रिया राख को एकत्र करने की क्रिया व्यक्त करती है। वाव-संयुक्त पूर्ण क्रिया यहाँ विधि के क्रम को आगे बढ़ाती है; हिन्दी में ‘बटोरकर ... रखे’ स्वाभाविक निर्देशात्मक क्रम देता है।
- source_word: אֵפֶר הַפָּרָה
  choice: बछिया की राख
  rationale: אֵפֶר सामूहिक अर्थ में ‘राख’ है और פָּרָה मादा गोवंश को दर्शाता है। अध्याय के बलिदानी संदर्भ में ‘बछिया’ अपेक्षित विशिष्टता बनाए रखता है।
- source_word: וְהִנִּיחַ
  choice: रखे
  rationale: मूल क्रिया का अर्थ रखना या जमा करना है। ‘रखे’ आधुनिक हिन्दी में सरल और विधिक निर्देश के अनुकूल है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यहाँ पदबंध स्थानसूचक है और राख रखे जाने का स्थान बताता है।
- source_word: בְּמָקוֹם טָהוֹר
  choice: किसी शुद्ध स्थान में
  rationale: טָהוֹר यहाँ अनुष्ठानिक रूप से शुद्ध स्थान का संकेत देता है। ‘शुद्ध स्थान’ सहज और पर्याप्त रूप से सटीक है।
- source_word: וְהָיְתָה ... לְמִשְׁמֶרֶת
  choice: वह राख ... सुरक्षित रखी जाए
  rationale: स्त्रीलिंग एकवचन क्रिया सामूहिक ‘राख’ की ओर लौटती है और לְמִשְׁמֶרֶת सुरक्षित रखे जाने का भाव देता है। हिन्दी में कर्ता को दोहराने से संदर्भ स्पष्ट रहता है।
- source_word: לַעֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की मण्डली के लिए
  rationale: עֲדָה विधिक-सामुदायिक संदर्भ में ‘मण्डली’ है। בְּנֵי יִשְׂרָאֵל का स्वाभाविक आधुनिक हिन्दी रूप ‘इस्राएली’ है, जो पूरे समुदाय को समेटता है।
- source_word: לְמֵי נִדָּה
  choice: अशुद्धता दूर करने का जल
  rationale: शाब्दिक संरचना ‘अशुद्धता का/के लिए जल’ हिन्दी में अस्पष्ट हो सकती है। अनुष्ठान में इस जल के शुद्धिकरणकारी प्रयोजन को स्वाभाविक हिन्दी में व्यक्त किया गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: חַטָּאת הִוא
  choice: यह पापबलि है
  rationale: חַטָּאת का अर्थ ‘पाप’, ‘पापबलि’ अथवा याजकीय संदर्भ में ‘शुद्धिकरण-बलि’ हो सकता है। मुख्य पाठ में पारंपरिक और शब्दार्थ की दृष्टि से मान्य ‘पापबलि’ रखा गया है तथा दूसरा अर्थ पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: शुद्धिकरण-विधि में חַטָּאת का अर्थ
  choice: यह पापबलि है
  alternative: यह शुद्धिकरण-बलि है
  rationale: इब्रानी शब्द अपराध और उससे संबंधित बलि दोनों को सूचित कर सकता है, जबकि याजकीय विधियों में उसका शुद्धिकरणकारी कार्य प्रमुख हो सकता है। मुख्य पाठ पारंपरिक पद रखता है, पर पादटिप्पणी वास्तविक अर्थगत तनाव को सुरक्षित रखती है।
- issue: לְמֵי נִדָּה में अशुद्धता और शुद्धिकरण का संबंध
  choice: अशुद्धता दूर करने का जल
  alternative: अशुद्धता का जल / शुद्धिकरण का जल
  rationale: נִדָּה सीधे अशुद्धता की ओर संकेत करता है, पर पूरा पदबंध उस जल के अनुष्ठानिक उपयोग को बताता है। हिन्दी मुख्य पाठ प्रयोजन स्पष्ट करता है और पादटिप्पणी अधिक औपचारिक विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मण्डली’, ‘छावनी’ और ‘पापबलि’ जैसे परिचित बाइबलीय पद विधिक-अनुष्ठानिक शैली बनाए रखते हैं। निर्देशात्मक क्रम को हिन्दी में ‘बटोरकर ... रखे’ और ‘सुरक्षित रखी जाए’ से स्वाभाविक बनाया गया है।
