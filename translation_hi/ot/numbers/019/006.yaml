reference: Numbers 19:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֣ח הַ/כֹּהֵ֗ן עֵ֥ץ אֶ֛רֶז וְ/אֵז֖וֹב וּ/שְׁנִ֣י תוֹלָ֑עַת וְ/הִשְׁלִ֕יךְ אֶל תּ֖וֹךְ שְׂרֵפַ֥ת הַ/פָּרָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/006.yaml
  text: Then the priest shall take cedar wood[a], hyssop, and scarlet yarn, and throw them into the midst of the burning of the cow.
translation:
  language: hi
  text: फिर याजक देवदार की लकड़ी, जूफ़ा और लाल रंग का सूत ले और उन्हें गाय के दहन के बीचों-बीच फेंक दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर ... ले
  rationale: वाव के साथ आया पूर्ण क्रियारूप अनुष्ठान की अगली निर्धारित क्रिया बताता है; ‘फिर’ क्रम को और ‘ले’ विधिक निर्देश को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना और बलिदान के प्रसंग में כֹּהֵן का प्रचलित, स्पष्ट हिन्दी पर्याय।
- source_word: עֵץ אֶרֶז
  choice: देवदार की लकड़ी
  rationale: रचना का शाब्दिक अर्थ ‘देवदार की लकड़ी’ है; यह पदार्थ को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: וְאֵזוֹב
  choice: जूफ़ा
  rationale: אֵזוֹב के लिए प्रचलित बाइबलीय हिन्दी नाम; पौधे की सटीक वनस्पति-पहचान अनिश्चित होने के कारण इससे अधिक विशिष्ट पहचान नहीं थोपी गई।
- source_word: וּשְׁנִי תוֹלָעַת
  choice: लाल रंग का सूत
  rationale: यह पद कृमि-जनित लाल रंग से रंगी सामग्री को सूचित करता है; अनुष्ठानिक वस्तु के प्रसंग में ‘लाल रंग का सूत’ स्पष्ट और सहज है।
- source_word: וְהִשְׁלִיךְ
  choice: और ... फेंक दे
  rationale: हिफ़ील क्रिया का अर्थ फेंकना या डालना है; ‘फेंक दे’ उसकी क्रियात्मक शक्ति को आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֶל תּוֹךְ
  choice: के बीचों-बीच
  rationale: यह अभिव्यक्ति केवल ‘में’ नहीं, बल्कि भीतर या मध्य में डालने पर बल देती है।
- source_word: שְׂרֵפַת הַפָּרָה
  choice: जलती हुई गाय
  rationale: संज्ञात्मक इब्रानी पद गाय के जलाए जाने की प्रक्रिया बताता है। ‘जलती हुई गाय’ उसी दृश्य को साधारण आधुनिक हिन्दी में स्पष्ट रखता है, बिना ‘आग’ जैसा अतिरिक्त शब्द जोड़ने के।
theological_decisions:
- issue: लाल गाय के शुद्धिकरण-विधान में פָּרָה का अनुवाद
  choice: गाय
  alternative: बछिया
  rationale: इब्रानी शब्द मादा गोवंश को दर्शाता है और यहाँ ‘गाय’ सीधा तथा सर्वसुलभ हिन्दी शब्द है। परंपरागत रूप से आयु पर बल देने वाला ‘बछिया’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अनुष्ठानिक निर्देश के अनुकूल रखी गई है। ‘ले ... फेंक दे’ हिन्दी में क्रमबद्ध विधिक आदेश को स्वाभाविक रूप से व्यक्त करता है। पादटिप्पणी-चिह्न उसी शब्द ‘गाय’ पर रखा गया है जिससे वैकल्पिक अनुवाद संबंधित है।
