source:
  edition: WLC
  text: וְ/כֹל֙ כְּלִ֣י פָת֔וּחַ אֲשֶׁ֛ר אֵין צָמִ֥יד פָּתִ֖יל עָלָ֑י/ו טָמֵ֖א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/015.yaml
  text: And every open vessel that does not have a tied cover on it is unclean.
translation:
  language: hi
  text: और हर खुला पात्र, जिस पर बँधा हुआ ढक्कन नहीं है,[a] अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कसकर लगाया हुआ ढक्कन” अथवा “मुहरबंद आवरण”; इब्रानी अभिव्यक्ति पात्र पर बाँधकर सुरक्षित किए गए आवरण की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל
  choice: और हर
  rationale: וְ इस नियम को पिछले प्रसंग से जोड़ता है, और एकवचन संज्ञा के साथ כֹל का वितरणात्मक अर्थ स्वाभाविक रूप से ‘हर’ है।
- source_word: כְּלִי
  choice: पात्र
  rationale: כְּלִי किसी वस्तु, उपकरण या बरतन के लिए व्यापक शब्द है; यहाँ खुला छोड़े जा सकने वाला पात्र अभिप्रेत है।
- source_word: פָתוּחַ
  choice: खुला
  rationale: यह विशेषण सीधे ‘खुला’ अर्थ देता है; आगे का उपवाक्य स्पष्ट करता है कि पात्र पर सुरक्षित आवरण नहीं है।
- source_word: אֲשֶׁר אֵין
  choice: जिस पर … नहीं है
  rationale: यह पात्र की स्थिति बताने वाला संबंधवाचक उपवाक्य है और हिंदी में स्वाभाविक रूप से उसके ऊपर ढक्कन के अभाव को व्यक्त करता है।
- source_word: צָמִיד פָּתִיל
  choice: बँधा हुआ ढक्कन
  rationale: यह दुर्लभ संयुक्त अभिव्यक्ति पात्र पर बाँधकर सुरक्षित किए गए आवरण को सूचित करती है। ‘बँधा हुआ ढक्कन’ ठोस बिंब को बनाए रखता है, पर प्राचीन बंद करने की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עָלָיו
  choice: जिस पर
  rationale: पूर्वसर्ग पात्र के ऊपर ढक्कन की स्थिति बताता है।
- source_word: טָמֵא הוּא
  choice: अशुद्ध है
  rationale: यह वाक्य पात्र की अशुद्धता की स्थिति घोषित करता है। ‘अशुद्ध’ मूल शब्द का सीधा अनुवाद है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: मुख्य पाठ में केवल ‘अशुद्ध’
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’
  rationale: प्रसंग शुद्धता-विधि का है, पर इब्रानी पाठ स्वयं केवल טָמֵא कहता है। इसलिए व्याख्यात्मक विशेषण जोड़ने के बजाय मूल कथन सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और विधिक प्रसंग के अनुरूप भाषा रखी गई है। ‘पात्र’ व्यापक और सामान्यतः समझा जाने वाला शब्द है; ‘अशुद्ध’ बाइबलीय शुद्धता-संबंधी शब्दावली को बिना अतिरिक्त व्याख्या के बनाए रखता है।
