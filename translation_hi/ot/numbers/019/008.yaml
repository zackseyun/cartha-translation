base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/008.yaml
  text: The one who burns it shall wash his clothes in water and bathe his body in water[b][a], and he shall be unclean until the evening.
translation:
  language: hi
  text: और जो उसे जलाए, वह अपने कपड़े पानी में धोए और पानी में स्नान करे,[a] और वह शाम तक अशुद्ध[b] रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर शाब्दिक अनुवाद ‘पानी में’ है; प्रसंगानुसार ‘पानी से’ भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘अशुद्ध’ होने का अर्थ कर्मकाण्डीय अशुद्धता है, नैतिक दोष होना आवश्यक नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: הַשֹּׂרֵף אֹתָהּ
  choice: जो व्यक्ति उसे जलाए
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदंत उस व्यक्ति को दर्शाता है जो बछिया को जलाता है; स्त्रीलिंग सर्वनाम का हिन्दी में स्वाभाविक संदर्भगत रूप ‘उसे’ है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: अपने कपड़े ... धोए
  rationale: כּבס कपड़ों को धोने के लिए प्रयुक्त है। विधिक प्रसंग में अपूर्ण क्रिया का आदेशात्मक भाव हिन्दी के ‘धोए’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: בַּמַּיִם
  choice: पानी में / पानी से
  rationale: हिब्रू में दोनों बार בְּ के साथ निश्चित रूप है, जिसका शाब्दिक अर्थ ‘पानी में’ है; शरीर के स्नान के लिए आधुनिक हिन्दी में ‘पानी से’ अधिक स्वाभाविक है। पादटिप्पणी शाब्दिक विकल्प सुरक्षित रखती है।
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: अपने शरीर को ... स्नान कराए
  rationale: רחץ शरीर धोने या स्नान करने को दर्शाता है और כּבס से lexical भेद बनाए रखता है; בשר यहाँ प्रसंगानुसार पूरे शरीर को सूचित करता है।
- source_word: וְטָמֵא
  choice: अशुद्ध रहे
  rationale: यहाँ טמא याजकीय विधि में कर्मकाण्डीय अशुद्ध अवस्था बताता है; ‘रहे’ परिणामस्वरूप बनी रहने वाली स्थिति को व्यक्त करता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह अशुद्धता की अवधि की सीमा बताता है; ‘शाम तक’ निकट, स्पष्ट और स्वाभाविक हिन्दी है।
theological_decisions:
- issue: कर्मकाण्डीय अशुद्धता का अनुवाद
  choice: अशुद्ध
  alternative: कर्मकाण्डीय रूप से अशुद्ध
  rationale: मुख्य पाठ में संक्षिप्त और परंपरागत शब्द रखा गया है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ नैतिक दोष अनिवार्यतः अभिप्रेत नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक गरिमा और सामान्य पाठक के लिए स्पष्टता रखी गई है। कपड़े धोने और शरीर स्नान करने वाली हिब्रू क्रियाओं का भेद यथासंभव सुरक्षित रखा गया है।
