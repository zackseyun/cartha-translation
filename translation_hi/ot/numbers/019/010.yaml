id: NUM.19.10
reference: Numbers 19:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/כִבֶּס הָ/אֹסֵ֨ף אֶת אֵ֤פֶר הַ/פָּרָה֙ אֶת בְּגָדָ֔י/ו וְ/טָמֵ֖א עַד הָ/עָ֑רֶב וְֽ/הָיְתָ֞ה לִ/בְנֵ֣י יִשְׂרָאֵ֗ל וְ/לַ/גֵּ֛ר הַ/גָּ֥ר בְּ/תוֹכָ֖/ם לְ/חֻקַּ֥ת עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/010.yaml
  text: And the one who gathers the ashes of the heifer shall wash his clothes[a], and he shall be unclean until the evening[b]. And this shall be for the sons of Israel and for the sojourner who sojourns among them as a permanent statute.
translation:
  language: hi
  text: और जो व्यक्ति गाय की राख इकट्ठी करता है, वह अपने कपड़े धोए और शाम तक अशुद्ध रहे। यह इस्राएलियों और उनके बीच रहने वाले परदेशी के लिए सदा की विधि होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאֹסֵף
  choice: जो व्यक्ति ... इकट्ठी करता है
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित क़ाल कृदंत को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और कार्य करने वाले व्यक्ति पर ध्यान बनाए रखता है।
- source_word: אֵפֶר הַפָּרָה
  choice: बछिया की राख
  rationale: אֵפֶר सामूहिक अर्थ में ‘राख’ है; פָּרָה मादा गोवंश को सूचित करता है, इसलिए अनुष्ठानिक संदर्भ में ‘बछिया’ सटीक और प्रचलित है।
- source_word: כִבֶּס ... אֶת בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: याजकीय शुद्धता-विधि में इसका आशय वस्त्र धोना है; विधिक निर्देश के लिए ‘धोए’ स्पष्ट और स्वाभाविक है।
- source_word: וְטָמֵא
  choice: अशुद्ध रहे
  rationale: यह नैतिक दोष नहीं, अनुष्ठानिक अशुद्धता की स्थिति बताता है; ‘रहे’ उस स्थिति की अवधि को सहज रूप से व्यक्त करता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: हिन्दी का स्वाभाविक और अर्थ-सटीक समय-सूचक वाक्यांश है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह सामूहिक वाचक वाचा-संबंधी पद है; आधुनिक हिन्दी में ‘इस्राएलियों’ पूरे समुदाय को स्पष्ट रूप से व्यक्त करता है, जबकि शाब्दिक ‘इस्राएल के पुत्रों’ से अनचाहा केवल-पुरुष अर्थ निकल सकता है।
- source_word: וְלַגֵּר הַגָּר בְּתוֹכָם
  choice: और उनके बीच रहने वाले परदेशी के लिए
  rationale: גֵּר इस्राएली समाज में रहने वाले गैर-मूल निवासी को दर्शाता है। ‘रहने वाले परदेशी’ संज्ञा और कृदंत दोनों का अर्थ सहज हिन्दी में रखता है।
- source_word: לְחֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: חֻקָּה स्थापित नियम या विधि है और עוֹלָם इस विधिक सूत्र में स्थायी/निरंतर अवधि दर्शाता है; ‘सदा की विधि’ संक्षिप्त, गरिमापूर्ण और स्वाभाविक है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: हिब्रू रूप व्याकरणतः पुल्लिंग बहुवचन है, पर यहाँ पूरे वाचा-समुदाय का पारंपरिक सामूहिक पद है। हिन्दी में ‘इस्राएलियों’ उसी व्यापक संदर्भ को बिना लिंगगत संकुचन के स्पष्ट करता है।
- issue: अनुष्ठानिक अशुद्धता की भाषा
  choice: अशुद्ध रहे
  alternative: अपवित्र रहे
  rationale: संदर्भ विधिक-अनुष्ठानिक स्थिति का है, नैतिक भ्रष्टता का नहीं। ‘अशुद्ध’ इस भेद को अपेक्षाकृत स्पष्ट रखता है।
- issue: עולם की अवधि
  choice: सदा की विधि
  alternative: चिरस्थायी विधि
  rationale: यह वाचा-विधि की स्थायी प्रकृति को व्यक्त करता है, बिना इस पद की दार्शनिक या कालातीत सीमा को आवश्यकता से अधिक निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-अनुष्ठानिक संदर्भ के अनुरूप गरिमापूर्ण किंतु सरल शैली। हिब्रू की पुनरुक्ति को जहाँ हिन्दी में बोझिलता आती, वहाँ अर्थ-सटीक स्वाभाविक संरचना अपनाई गई है।
