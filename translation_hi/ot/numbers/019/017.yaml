source:
  edition: WLC
  text: וְ/לָֽקְחוּ֙ לַ/טָּמֵ֔א מֵ/עֲפַ֖ר שְׂרֵפַ֣ת הַֽ/חַטָּ֑את וְ/נָתַ֥ן עָלָ֛י/ו מַ֥יִם חַיִּ֖ים אֶל כֶּֽלִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/017.yaml
  text: And for the unclean person they shall take some of the dust from the burning of the purification offering[b][a], and he shall put living water on it in a vessel.
translation:
  language: hi
  text: अशुद्ध व्यक्ति के लिए वे शुद्धिकरण-बलि को जलाने से बनी धूल में से कुछ लें[a], और कोई व्यक्ति उस पर एक पात्र में जीवित जल[b] डाले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'पारंपरिक रूप से: “पापबलि को जलाने से बनी राख।” हिब्रू में यहाँ “धूल” शब्द है, और חטאת का अर्थ याजकीय प्रसंगों में “पापबलि” अथवा उसके कार्य के अनुसार “शुद्धिकरण-बलि” हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “जीवित जल”; अर्थात ताज़े या बहते स्रोत का जल।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לַטָּמֵא
  choice: अशुद्ध व्यक्ति के लिए
  rationale: संज्ञीकृत विशेषण यहाँ अनुष्ठानिक अशुद्धता की अवस्था वाले व्यक्ति को दर्शाता है; यह अनुवाद प्रसंग को स्पष्ट और स्वाभाविक रखता है।
- source_word: מֵעֲפַר
  choice: धूल में से कुछ
  rationale: עָפָר का मूल अर्थ ‘धूल’ या महीन कण है, सामान्य हिब्रू शब्द ‘राख’ नहीं; מִן के अंशवाचक भाव को ‘में से कुछ’ व्यक्त करता है।
- source_word: שְׂרֵפַת הַחַטָּאת
  choice: शुद्धिकरण-बलि को जलाने से बनी
  rationale: यह वाक्यांश जलाने की क्रिया और חטאת के इस शुद्धता-विधि संबंधी कार्य, दोनों को व्यक्त करता है।
- source_word: וְנָתַן
  choice: और कोई व्यक्ति ... डाले
  rationale: हिब्रू में पहले बहुवचन और फिर एकवचन क्रिया आती है। ‘कोई व्यक्ति’ एकवचन को बनाए रखते हुए कर्ता की पहचान अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מַיִם חַיִּים
  choice: जीवित जल
  rationale: यह हिब्रू पद का निकट अनुवाद है और उसके बाइबिलीय शब्द-संबंध को सुरक्षित रखता है; पादटिप्पणी इसका व्यावहारिक अर्थ स्पष्ट करती है।
- source_word: אֶל כֶּלִי
  choice: एक पात्र में
  rationale: पात्र इस अनुष्ठानिक प्रसंग के लिए स्वाभाविक और गरिमापूर्ण शब्द है; परसर्ग जल और धूल को पात्र में मिलाने की स्थिति बताता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता के प्रसंग में חטאת का अनुवाद
  choice: शुद्धिकरण-बलि
  alternative: पापबलि
  rationale: लाल बछिया की यह विधि अनुष्ठानिक अशुद्धता दूर करने के लिए है। ‘शुद्धिकरण-बलि’ उसके कार्य को सामने लाता है, जबकि पारंपरिक और शाब्दिक रूप से संभव ‘पापबलि’ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: מַיִם חַיִּים के मुहावरे का अनुवाद
  choice: जीवित जल
  alternative: ताज़ा जल; बहता हुआ जल
  rationale: निकट शाब्दिक रूप मूल की अभिव्यक्ति और उसके व्यापक बाइबिलीय प्रतिध्वनि को बनाए रखता है; पादटिप्पणी बताती है कि यहाँ ताज़े या बहते स्रोत का जल अभिप्रेत है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण विधिक-अनुष्ठानिक रजिस्टर रखा गया है। हिब्रू में बहुवचन से एकवचन कर्ता की ओर होने वाले परिवर्तन को ‘वे ... लें’ और ‘कोई व्यक्ति ... डाले’ द्वारा सुरक्षित रखा गया है।
