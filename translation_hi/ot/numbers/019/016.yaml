reference: Numbers 19:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁר יִגַּ֜ע עַל פְּנֵ֣י הַ/שָּׂדֶ֗ה בַּֽ/חֲלַל חֶ֨רֶב֙ א֣וֹ בְ/מֵ֔ת אֽוֹ בְ/עֶ֥צֶם אָדָ֖ם א֣וֹ בְ/קָ֑בֶר יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/016.yaml
  text: And everyone who touches[a], in the open field, one slain by the sword, or a dead body, or a human bone, or a grave[c][b], shall be unclean seven days.
translation:
  language: hi
  text: और जो कोई खुले मैदान में तलवार से मारे गए किसी व्यक्ति को, किसी शव को, मनुष्य की किसी हड्डी को या किसी कब्र को छुए, वह सात दिन तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר יִגַּע
  choice: और जो कोई ... छुए
  rationale: כֹל के साथ संबंधवाचक उपवाक्य यहाँ सामान्य और वितरणात्मक विधान व्यक्त करता है; हिंदी में ‘जो कोई ... छुए’ इस विधिक-शर्तीय अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל פְּנֵי הַשָּׂדֶה
  choice: खुले मैदान में
  rationale: शाब्दिक अर्थ ‘मैदान के मुख पर’ है, पर यह मुहावरा खुले स्थान में होने का बोध देता है; ‘खुले मैदान में’ अर्थ और स्वाभाविकता दोनों बनाए रखता है।
- source_word: בַּחֲלַל חֶרֶב
  choice: तलवार से मारे गए किसी व्यक्ति को
  rationale: חָלָל तलवार से बेधे या मारे गए व्यक्ति को दर्शाता है। यह रूप व्यक्ति-संदर्भ और मृत्यु के साधन दोनों को स्पष्ट रखता है।
- source_word: אוֹ בְמֵת
  choice: किसी शव को
  rationale: מֵת यहाँ मृत व्यक्ति अथवा मृत देह को सूचित करता है; अशुद्धता के प्रसंग में ‘शव’ संक्षिप्त, सहज और सटीक है।
- source_word: אוֹ בְעֶצֶם אָדָם
  choice: मनुष्य की किसी हड्डी को
  rationale: עֶצֶם אָדָם का अर्थ किसी मानव की हड्डी है। ‘मनुष्य’ यहाँ पूरी मानव जाति के लिए सामान्य अर्थ में है, केवल पुरुष के लिए नहीं।
- source_word: אוֹ בְקָבֶר
  choice: किसी कब्र को
  rationale: קֶבֶר का सीधा अर्थ कब्र या दफनाने का स्थान है; इस प्रसंग में ‘कब्र’ सर्वाधिक सहज है।
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: वह सात दिन तक अशुद्ध रहेगा
  rationale: יִטְמָא पुरोहितीय व्यवस्था में अनुष्ठानिक अशुद्धता बताता है; ‘अशुद्ध रहेगा’ विधिक परिणाम और अवधि को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: אָדָם का सामान्य मानव-संदर्भ
  choice: मनुष्य
  alternative: पुरुष/आदमी
  rationale: यहाँ विधान मानव-अवशेषों के विषय में है और लिंग विशेष अभिप्रेत नहीं है; इसलिए सामान्य मानव-संदर्भ को सुरक्षित रखा गया है।
- issue: טמא का अनुष्ठानिक अर्थ
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: गिनती के शुद्धता-विधान में यह शब्द अनुष्ठानिक स्थिति बताता है, नैतिक दोष नहीं। ‘अशुद्ध’ उस विधिक श्रेणी को बिना अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य को विधिक-शर्तीय रूप में रखा गया है। स्रोत में वास्तविक पाठगत अस्पष्टता ऐसी नहीं है जिसके लिए पादटिप्पणी आवश्यक हो।
