id: NUM.19.20
reference: Numbers 19:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֤ישׁ אֲשֶׁר יִטְמָא֙ וְ/לֹ֣א יִתְחַטָּ֔א וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מִ/תּ֣וֹךְ הַ/קָּהָ֑ל כִּי֩ אֶת מִקְדַּ֨שׁ יְהוָ֜ה טִמֵּ֗א מֵ֥י נִדָּ֛ה לֹא זֹרַ֥ק עָלָ֖י/ו טָמֵ֥א הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/020.yaml
  text: But the man who becomes unclean and does not purify himself—that person shall be cut off from the midst of the assembly[a], because he has defiled the sanctuary of Yahweh. The water for impurity has not been sprinkled on him[b]; he is unclean.
translation:
  language: hi
  text: परन्तु जो मनुष्य अशुद्ध हो जाए और अपने को शुद्ध न करे, वह व्यक्ति सभा के बीच से काट दिया जाए[a], क्योंकि उसने यहोवा के पवित्रस्थान को अशुद्ध किया है। अशुद्धता दूर करने का जल उस पर नहीं छिड़का गया[b]; वह अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह आत्मा काट दी जाए।” इब्रानी कानूनी सूत्र में “आत्मा” पूरे व्यक्ति को सूचित कर सकता है, केवल देह से अलग आत्मा को नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अशुद्धता का जल”; परम्परागत अनुवाद, “अलगाव का जल।” यह पदबंध इस अध्याय में तैयार किए गए शुद्धिकरण के जल को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यहाँ पुल्लिंग एकवचन रूप किसी भी व्यक्तिगत इस्राएली के लिए प्रतिनिधिक रूप से प्रयुक्त है; ‘मनुष्य’ स्रोत-रूप को रखते हुए हिन्दी में स्वाभाविक है।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाए
  rationale: काल का रूप अनुष्ठानिक अशुद्धता की अवस्था में आने को दर्शाता है, न कि अनिवार्यतः नैतिक दोष को।
- source_word: יִתְחַטָּא
  choice: अपने को शुद्ध करे
  rationale: शुद्धिकरण-संदर्भ में हित्पएल रूप का अर्थ अशुद्धता से शुद्ध होना/करना है, सामान्य अर्थ में पाप करना नहीं।
- source_word: וְנִכְרְתָה הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति ... काट दिया जाए
  rationale: कानूनी सूत्र में נֶפֶשׁ पूरे व्यक्ति को सूचित कर सकता है। ‘काट दिया जाए’ दण्ड की निश्चित विधि बताए बिना वाचा-संबंधी मुहावरे को सुरक्षित रखता है।
- source_word: מִתּוֹךְ הַקָּהָל
  choice: सभा के बीच से
  rationale: קָהָל वाचा-समुदाय की सभा को दर्शाता है; यह पदबंध इब्रानी संरचना और सामुदायिक भाव दोनों को बनाए रखता है।
- source_word: מִקְדַּשׁ יְהוָה
  choice: यहोवा के पवित्रस्थान
  rationale: מִקְדָּשׁ पवित्र धाम अथवा पवित्र परिसर को दर्शाता है। יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: טִמֵּא
  choice: अशुद्ध किया है
  rationale: पिएल रूप यहाँ पवित्रस्थान को अनुष्ठानिक रूप से अशुद्ध करने का कारक भाव रखता है।
- source_word: מֵי נִדָּה
  choice: अशुद्धता दूर करने का जल
  rationale: यह अध्याय में तैयार किए गए उस जल को सूचित करता है जो शव-संबंधी अशुद्धता के शुद्धिकरण में काम आता है; कार्यगत अनुवाद हिन्दी में स्पष्ट है, जबकि वैकल्पिक शाब्दिक रूप टिप्पणी में रखा गया है।
- source_word: זֹרַק עָלָיו
  choice: उस पर नहीं छिड़का गया
  rationale: अनुष्ठानिक संदर्भ में זָרַק द्रव छिड़कने को दर्शाता है।
- source_word: טָמֵא הוּא
  choice: वह अशुद्ध है
  rationale: क्रियारहित उपवाक्य व्यक्ति की वर्तमान कानूनी-अनुष्ठानिक स्थिति घोषित करता है।
theological_decisions:
- issue: ‘काट दिया जाए’ में दण्ड का स्वरूप
  choice: मुहावरे को बिना व्याख्यात्मक विस्तार के बनाए रखा गया है।
  alternative: समुदाय से निकाल दिया जाए; मार डाला जाए; परमेश्वर के न्याय से नष्ट हो जाए
  rationale: इब्रानी वाचा-संबंधी सूत्र यहाँ दण्ड की विधि निश्चित नहीं करता। अस्पष्टता बनाए रखने से निर्वासन, मृत्युदण्ड या केवल प्रत्यक्ष ईश्वरीय न्याय में से कोई एक अर्थ आरोपित नहीं होता।
translation_notes:
  register: आधुनिक मानक हिन्दी में औपचारिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। अनुष्ठानिक शब्दावली में ‘अशुद्ध’, ‘शुद्ध’ और ‘पवित्रस्थान’ का सुसंगत प्रयोग किया गया है।
