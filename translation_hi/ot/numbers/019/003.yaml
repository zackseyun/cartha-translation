base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/003.yaml
  text: You shall give it to Eleazar the priest[a], and he shall bring it outside the camp[b], and it shall be slaughtered before him.
translation:
  language: hi
  text: 'तुम लोग उस बछिया को[a] एलआज़ार याजक को सौंप देना। वह उसे छावनी के बाहर ले जाए, और उसके सामने उसका वध किया जाए।[b]


    [a] हिब्रू में यहाँ स्त्रीलिंग सर्वनाम है, जो लाल बछिया की ओर संकेत करता है।


    [b] अंतिम क्रिया का कर्ता हिब्रू में स्पष्ट नहीं किया गया है। इसका अनुवाद यह भी हो सकता है: “और वह उसके सामने उसका वध करे,” जिसमें एलआज़ार को ही क्रिया का कर्ता समझा जाता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ स्त्रीलिंग सर्वनाम है, जो लाल बछिया की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: b
    text: 'अंतिम क्रिया का कर्ता हिब्रू में स्पष्ट नहीं किया गया है। इसका अनुवाद यह भी हो सकता है: “और वह उसके सामने उसका वध करे,” जिसमें एलआज़ार को ही क्रिया का कर्ता समझा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וּנְתַתֶּם
  choice: तुम लोग ... सौंप देना
  rationale: क्रिया बहुवचन संबोधन में है और विधिक निर्देश के रूप में आदेश व्यक्त करती है। ‘सौंप देना’ किसी व्यक्ति के अधिकार या देखरेख में देने के भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֹתָהּ
  choice: उस बछिया को / उसे
  rationale: स्त्रीलिंग एकवचन सर्वनाम पिछले पद की लाल बछिया की ओर संकेत करता है। हिंदी में पहले उल्लेख पर संज्ञा दोहराने से संदर्भ स्पष्ट रहता है और बाद में ‘उसे’ स्वाभाविक है।
- source_word: אֶל־אֶלְעָזָר הַכֹּהֵן
  choice: एलआज़ार याजक को
  rationale: व्यक्तिवाचक नाम का स्रोत-सन्निकट लिप्यंतरण किया गया है और כֹּהֵן के लिए प्रचलित, गरिमापूर्ण ‘याजक’ रखा गया है।
- source_word: וְהוֹצִיא
  choice: वह उसे ... ले जाए
  rationale: יצא के हिफ़ील रूप का कारक अर्थ ‘बाहर ले जाना’ है। ‘ले जाए’ हिंदी निर्देशात्मक शैली में सहज है।
- source_word: אֶל־מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह गंतव्य को दर्शाता है; ‘छावनी के बाहर’ शाब्दिक अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: וְשָׁחַט אֹתָהּ
  choice: उसका वध किया जाए
  rationale: हिब्रू क्रिया सक्रिय तृतीय पुरुष एकवचन है, पर उसका कर्ता व्यक्त नहीं है। हिंदी का कर्मवाच्य अनिर्दिष्ट कर्ता को खुला रखता है और किसी अन्य वधकर्ता को पाठ में स्पष्ट रूप से जोड़ने से बचता है।
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह पदबंध एलआज़ार की उपस्थिति में या उसके समक्ष होने का स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: अंतिम उपवाक्य में वध करने वाले की पहचान
  choice: मुख्य पाठ में अनिर्दिष्ट कर्ता को कर्मवाच्य ‘उसका वध किया जाए’ से सुरक्षित रखा गया है।
  alternative: “और वह उसके सामने उसका वध करे,” अर्थात एलआज़ार को अंतिम क्रिया का भी कर्ता माना जाए।
  rationale: וְשָׁחַט की क्रिया तृतीय पुरुष एकवचन है और उसका कर्ता अंतर्निहित है; वह पिछले कर्ता एलआज़ार हो सकता है। फिर भी לְפָנָיו (‘उसके सामने’) वधकर्ता और एलआज़ार के बीच भेद का संकेत भी दे सकता है। मुख्य पाठ किसी एक व्याख्या को निर्णायक नहीं बनाता और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
translation_notes:
  register: आधुनिक मानक हिंदी की स्पष्ट, गरिमापूर्ण निर्देशात्मक शैली अपनाई गई है। बहुवचन संबोधन को ‘तुम लोग’ से प्रकट किया गया है। ‘बछिया’, ‘याजक’, ‘छावनी’ और ‘वध’ सामान्य पाठक के लिए समझने योग्य रहते हुए अनुष्ठानिक संदर्भ के अनुरूप हैं।
