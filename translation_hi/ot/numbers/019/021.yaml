source:
  edition: WLC
  text: וְ/הָיְתָ֥ה לָּ/הֶ֖ם לְ/חֻקַּ֣ת עוֹלָ֑ם וּ/מַזֵּ֤ה מֵֽי הַ/נִּדָּה֙ יְכַבֵּ֣ס בְּגָדָ֔י/ו וְ/הַ/נֹּגֵ֨עַ֙ בְּ/מֵ֣י הַ/נִּדָּ֔ה יִטְמָ֖א עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/021.yaml
  text: 'And this shall be a permanent statute for them: the one who sprinkles the water for impurity shall wash his clothes[a], and the one who touches the water for impurity shall be unclean until evening.'
translation:
  language: hi
  text: 'और यह उनके लिए सदा की विधि होगी: जो अशुद्धता दूर करने का जल[a] छिड़कता है, वह अपने कपड़े धोए; और जो अशुद्धता दूर करने के जल को छूता है, वह शाम तक अशुद्ध रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अशुद्धता का जल”; परंपरागत अनुवाद, “अलगाव का जल।” यह शव-संपर्क से हुई रीति-संबंधी अशुद्धता दूर करने के लिए तैयार किया गया जल था।
    reason: मूल हिब्रू पदबंध का शाब्दिक रूप और परंपरागत विकल्प सुरक्षित रखते हुए प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וְהָיְתָה לָהֶם לְחֻקַּת עוֹלָם
  choice: और यह उनके लिए सदा की विधि होगी
  rationale: स्त्रीलिंग एकवचन क्रिया का संकेत प्रसंग में निहित ‘विधि’ की ओर है। ‘सदा की विधि’ नियम की निरंतर बाध्यता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמַזֵּה
  choice: जो … छिड़कता है
  rationale: हिब्रू कृदंत यहाँ व्यक्ति के लिए संज्ञा के समान प्रयुक्त है; हिन्दी में संबंधवाचक रचना स्वाभाविक है।
- source_word: מֵי הַנִּדָּה
  choice: अशुद्धता दूर करने का जल
  rationale: शाब्दिक अर्थ ‘अशुद्धता का जल’ है, पर गिनती 19 के प्रसंग में यह शव-संपर्क से हुई रीति-संबंधी अशुद्धता दूर करने के लिए तैयार जल है। मुख्य पाठ में उसका कार्य स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: यह वस्त्र धोने की अपेक्षित क्रिया को सरल, वर्तमान हिन्दी में व्यक्त करता है।
- source_word: וְהַנֹּגֵעַ
  choice: और जो … छूता है
  rationale: यह भी व्यक्ति के लिए प्रयुक्त कृदंत है और पहले खंड के समानांतर रखा गया है।
- source_word: יִטְמָא עַד הָעָרֶב
  choice: वह शाम तक अशुद्ध रहेगा
  rationale: ‘अशुद्ध’ रीति-संबंधी शुद्धता की मानक श्रेणी को व्यक्त करता है; ‘शाम तक’ अवधि की सीमा को स्वाभाविक हिन्दी में बताता है।
theological_decisions:
- issue: रीति-संबंधी अशुद्धता की शब्दावली
  choice: ‘अशुद्ध’ और ‘अशुद्धता दूर करने का जल’ को अनुष्ठानिक अर्थ में रखा गया
  alternative: ‘अलगाव का जल’ अथवा नैतिक दोष का संकेत देने वाली भाषा
  rationale: यह पद नैतिक अपराध नहीं, शव-संपर्क से जुड़ी रीति-संबंधी अशुद्धता पर चर्चा करता है। अनुवाद उसी श्रेणी को स्पष्ट रखता है और बाद की धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: מֵי הַנִּדָּה की संरचना
  choice: मुख्य पाठ में जल का शुद्धिकरण-संबंधी कार्य स्पष्ट करना
  alternative: शाब्दिक ‘अशुद्धता का जल’
  rationale: शाब्दिक पदबंध हिन्दी में ऐसा भ्रम दे सकता है मानो जल स्वयं अशुद्ध हो। प्रसंगगत अर्थ मुख्य पाठ में दिया गया है, जबकि मूल की शब्दरचना पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कानूनी लहजे के लिए ‘सदा की विधि होगी’ और अनुष्ठानिक श्रेणी के लिए ‘अशुद्ध’ का प्रयोग किया गया है।
