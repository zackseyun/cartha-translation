  text: זֹ֚את הַ/תּוֹרָ֔ה אָדָ֖ם כִּֽי יָמ֣וּת בְּ/אֹ֑הֶל כָּל הַ/בָּ֤א אֶל הָ/אֹ֨הֶל֙ וְ/כָל אֲשֶׁ֣ר בָּ/אֹ֔הֶל יִטְמָ֖א שִׁבְעַ֥ת יָמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/014.yaml
  text: 'This is the law: when a man dies in a tent[a], everyone who enters the tent and everyone who is in the tent shall be unclean seven days.'
translation:
  language: hi
  text: 'व्यवस्था यह है: जब कोई मनुष्य किसी तंबू में मर जाए, तो हर वह व्यक्ति जो उस तंबू में प्रवेश करे और हर वह व्यक्ति जो उस तंबू में हो,[a] सात दिन तक अशुद्ध रहेगा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और जो कुछ तंबू में हो।” हिब्रू अभिव्यक्ति का अर्थ अधिक व्यापक हो सकता है; यहाँ संदर्भ और पहले समानांतर पद के कारण इसे तंबू में उपस्थित व्यक्तियों के लिए समझा गया है, जबकि अगले पद में खुले पात्रों का अलग से उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: व्यवस्था यह है
  rationale: תּוֹרָה यहाँ शव से होने वाली अशुद्धता के लिए बाध्यकारी नियम प्रस्तुत करता है। ‘व्यवस्था’ विधिक और धार्मिक संदर्भ में स्वाभाविक तथा गरिमापूर्ण है।
- source_word: אָדָם כִּי יָמוּת
  choice: जब कोई मनुष्य ... मर जाए
  rationale: אָדָם यहाँ सामान्य अर्थ में किसी मनुष्य को दर्शाता है, और כִּי विधिक परिस्थिति प्रस्तुत करता है; ‘जब’ इस प्रसंग में सहज है।
- source_word: בְּאֹהֶל
  choice: किसी तंबू में
  rationale: पहली बार אֹהֶל अनिश्चित है, इसलिए ‘किसी तंबू में’ उस नई परिस्थिति को ठीक प्रकार प्रस्तुत करता है।
- source_word: כָּל הַבָּא אֶל הָאֹהֶל
  choice: हर वह व्यक्ति जो उस तंबू में प्रवेश करे
  rationale: सहभागी रूप הַבָּא सामान्यतः प्रवेश करने वाले प्रत्येक व्यक्ति को दर्शाता है; ‘प्रवेश करे’ विधिक शैली में स्वाभाविक है।
- source_word: וְכָל אֲשֶׁר בָּאֹהֶל
  choice: और हर वह व्यक्ति जो तंबू में हो
  rationale: निकटवर्ती समानांतर वाक्य और एकवचन क्रिया व्यक्तियों की ओर संकेत करते हैं, यद्यपि हिब्रू अभिव्यक्ति व्यापक अर्थ भी रख सकती है; इस अस्पष्टता को पादटिप्पणी में रखा गया है।
- source_word: יִטְמָא שִׁבְעַת יָמִים
  choice: सात दिन तक अशुद्ध रहेगा
  rationale: יִטְמָא अनुष्ठानिक अशुद्धता बताता है। ‘अशुद्ध रहेगा’ अवधि के साथ सहज है और विधिक परिणाम को स्पष्ट रूप से व्यक्त करता है।
