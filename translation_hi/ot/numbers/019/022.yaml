  yaml_path: translation/ot/numbers/019/022.yaml
  text: And everything that the unclean person touches shall become unclean[a], and the person who touches it shall be unclean until the evening.
translation:
  language: hi
  text: और अशुद्ध व्यक्ति जो कुछ भी छुए, वह अशुद्ध हो जाएगा; और जो व्यक्ति[a] उसे छुए, वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द नेफ़ेश का अर्थ ‘प्राण’ या ‘जीव’ भी हो सकता है, पर इस विधिक संदर्भ में यह ‘व्यक्ति’ को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכֹל אֲשֶׁר
  choice: और ... जिस किसी वस्तु को
  rationale: כֹל אֲשֶׁר का व्यापक अर्थ ‘जो कुछ भी’ है। संदर्भ में आगे एक व्यक्ति के उसे छूने की बात आने के कारण हिंदी में ‘जिस किसी वस्तु को’ स्वाभाविक और स्पष्ट है।
- source_word: יִגַּע בּוֹ
  choice: छुए
  rationale: נגע का मूल अर्थ छूना या संपर्क में आना है; בּוֹ का संबंध हिंदी में कर्म-विभक्ति ‘को’ द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַטָּמֵא
  choice: अशुद्ध व्यक्ति
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और विधिक-सांस्कारिक अशुद्धता की दशा में पड़े व्यक्ति को दर्शाता है।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगी
  rationale: क्रिया संपर्क के फलस्वरूप अशुद्ध दशा में आने को व्यक्त करती है। ‘हो जाएगी’ इस परिणामी भाव को स्पष्ट रखता है।
- source_word: וְהַנֶּפֶשׁ
  choice: और जो व्यक्ति
  rationale: נֶפֶשׁ का शाब्दिक अर्थ प्राण/जीव हो सकता है, पर विधिक संदर्भ में यह पूरे व्यक्ति को दर्शाता है। ‘व्यक्ति’ आधुनिक हिंदी में सबसे स्पष्ट है।
- source_word: הַנֹּגַעַת
  choice: उसे छुए
  rationale: स्त्रीलिंग कृदंत נֶפֶשׁ से सामंजस्य रखता है। ‘उसे’ का संकेत पिछली उपवाक्य की अशुद्ध हुई वस्तु की ओर है।
- source_word: תִּטְמָא עַד הָעָרֶב
  choice: शाम तक अशुद्ध रहेगा
  rationale: यह संपर्क करने वाले व्यक्ति की अशुद्ध दशा और उसकी समय-सीमा बताता है। ‘शाम तक’ सहज हिंदी है और עַד הָעָרֶב का ठीक अर्थ देता है।
theological_decisions:
- issue: טמא को सांस्कारिक या नैतिक अर्थ में समझना
  choice: अशुद्ध
  alternative: अपवित्र अथवा पापी
  rationale: यह प्रसंग संपर्क से फैलने वाली विधिक-सांस्कारिक अशुद्धता का है; पद स्वयं नैतिक दोष या पाप घोषित नहीं करता।
- issue: दूसरे उपवाक्य में छुई जाने वाली वस्तु का संदर्भ
  choice: ‘उसे’ को पहले उपवाक्य में अशुद्ध हुई वस्तु की ओर संकेत करने देना
  alternative: इसे किसी अन्य अप्रकट वस्तु या अशुद्ध व्यक्ति की ओर निश्चित रूप से जोड़ना
  rationale: हिब्रू में कर्म स्पष्ट रूप से दोहराया नहीं गया है। हिंदी का ‘उसे’ निकटतम संदर्भ को बनाए रखते हुए पाठ से अधिक निश्चितता नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण विधिक-सांस्कारिक रजिस्टर रखा गया है। ‘अशुद्ध’ शब्द को पूरे गिनती 19 के शुद्धता-विधान से संगत रखने के लिए चुना गया है; ‘जिस किसी वस्तु’ व्यापकता और स्वाभाविक हिंदी दोनों को बनाए रखता है।
