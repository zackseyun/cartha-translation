  text: וְ/לָקַ֨ח אֵז֜וֹב וְ/טָבַ֣ל בַּ/מַּיִם֮ אִ֣ישׁ טָהוֹר֒ וְ/הִזָּ֤ה עַל הָ/אֹ֨הֶל֙ וְ/עַל כָּל הַ/כֵּלִ֔ים וְ/עַל הַ/נְּפָשׁ֖וֹת אֲשֶׁ֣ר הָֽיוּ שָׁ֑ם וְ/עַל הַ/נֹּגֵ֗עַ בַּ/עֶ֨צֶם֙ א֣וֹ בֶֽ/חָלָ֔ל א֥וֹ בַ/מֵּ֖ת א֥וֹ בַ/קָּֽבֶר־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/018.yaml
  text: Then a clean man shall take hyssop and dip it in the water[a], and sprinkle it on the tent, on all the vessels, on the persons who were there, and on the one who touched the bone, or the slain body, or the dead person[b], or the grave.
translation:
  language: hi
  text: तब एक शुद्ध पुरुष[a] जूफ़ा लेकर उसे उस जल में डुबोए और तंबू पर, सभी पात्रों पर, वहाँ उपस्थित सभी व्यक्तियों पर, और उस व्यक्ति पर छिड़के जिसने किसी हड्डी, मारे गए व्यक्ति के शव[b], किसी मृत व्यक्ति या किसी कब्र को छुआ हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ऐसा पुरुष जो शुद्ध हो।” इब्रानी में यह एकवचन पुल्लिंग है।
    reason: lexical_alternative
  - marker: b
    text: या, “मारे गए व्यक्ति।” इब्रानी शब्द विशेष रूप से हिंसक रीति से मारे गए व्यक्ति को दर्शाता है और अगले सामान्य पद “मृत व्यक्ति” से अलग है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵזוֹב
  choice: जूफ़ा
  rationale: यह शुद्धिकरण-विधि में प्रयुक्त विशिष्ट पौधे का पारंपरिक हिन्दी नाम है; सामान्य ‘पौधा’ या ‘डाली’ मूल की विशिष्टता खो देगा।
- source_word: בַּמַּיִם
  choice: उस जल में
  rationale: इब्रानी में निश्चित उपपद है और संदर्भ पहले तैयार किए गए अशुद्धता दूर करने वाले जल की ओर संकेत करता है।
- source_word: אִישׁ טָהוֹר
  choice: कोई शुद्ध पुरुष
  rationale: ‘पुरुष’ इब्रानी के एकवचन पुल्लिंग को बनाए रखता है; यहाँ ‘शुद्ध’ अनुष्ठानिक दशा बताता है, नैतिक निष्कलंकता नहीं।
- source_word: וְהִזָּה
  choice: छिड़के
  rationale: शुद्धिकरण के जल को बूँदों के रूप में लगाने की विधिक क्रिया के लिए स्वाभाविक और स्थापित हिन्दी शब्द।
- source_word: הָאֹהֶל
  choice: तंबू
  rationale: संदर्भ उस तंबू का है जहाँ मृत्यु हुई थी, मिलापवाले तंबू का नहीं।
- source_word: הַכֵּלִים
  choice: पात्रों
  rationale: כְּלִי का अर्थ व्यापक रूप से सामान, उपकरण या पात्र हो सकता है; इस विधिक संदर्भ में ‘पात्र’ संक्षिप्त और स्वाभाविक है।
- source_word: הַנְּפָשׁוֹת
  choice: व्यक्तियों
  rationale: यहाँ נֶפֶשׁ तंबू में मौजूद मनुष्यों को दर्शाता है; ‘प्राणों’ या ‘आत्माओं’ से भ्रामक मानवशास्त्रीय अर्थ पैदा होता।
- source_word: הַנֹּגֵעַ
  choice: उस व्यक्ति ... जिसने ... छुआ हो
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत को हिन्दी में स्वाभाविक संबंधवाचक रचना से व्यक्त किया गया है।
- source_word: בָּעֶצֶם
  choice: किसी हड्डी
  rationale: संदर्भ में यह मनुष्य की हड्डी है; हिन्दी में वर्गगत अर्थ के लिए अनिश्चित ‘किसी’ अधिक स्वाभाविक है, यद्यपि इब्रानी में उपपद है।
- source_word: בֶחָלָל
  choice: मारे गए व्यक्ति के शव
  rationale: חָלָל हिंसक रूप से मारे गए व्यक्ति को दर्शाता है; ‘शव’ जोड़ने से स्पर्श और मृतदेह की अशुद्धता का आशय स्पष्ट होता है तथा अगले सामान्य מֵת से भेद बना रहता है।
- source_word: בַמֵּת
  choice: किसी मृत व्यक्ति
  rationale: यह חָלָל की अपेक्षा मृत्यु के लिए सामान्य शब्द है; अलग अनुवाद मूल का भेद सुरक्षित रखता है।
- source_word: בַקָּבֶר
  choice: किसी कब्र
  rationale: कब्र या दफ़नाने के स्थान के लिए सामान्य, आधुनिक हिन्दी शब्द।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता की शब्दावली
  choice: शुद्ध
  alternative: पवित्र / साफ़
  rationale: यह पद मृत्यु-संपर्क से उत्पन्न विधिक अशुद्धता से संबंधित है। ‘शुद्ध’ इस अनुष्ठानिक श्रेणी को व्यक्त करता है; ‘पवित्र’ अलग धार्मिक धारणा ला सकता है और ‘साफ़’ केवल भौतिक स्वच्छता का बोध करा सकता है।
- issue: אִישׁ का लिंग-सूचक रूप
  choice: पुरुष
  alternative: व्यक्ति
  rationale: मूल पाठ स्पष्ट रूप से एकवचन पुल्लिंग संज्ञा का प्रयोग करता है, इसलिए उसे सामान्यीकृत नहीं किया गया; भूमिका की मुख्य योग्यता फिर भी अनुष्ठानिक शुद्धता है।
- issue: חָלָל और מֵת के बीच भेद
  choice: मारे गए व्यक्ति का शव / मृत व्यक्ति
  alternative: दोनों के लिए ‘शव’
  rationale: पहला शब्द विशेषतः हिंसक रीति से मारे गए व्यक्ति का संकेत देता है, जबकि दूसरा मृत व्यक्ति के लिए अधिक सामान्य है; दोनों को एक ही शब्द से अनूदित करने पर मूल का तनाव और भेद मिट जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक लय बनाए रखने के लिए समानांतर ‘पर’ और स्पर्श की सूची को सुरक्षित रखा गया है। ‘उस जल’ पूर्वसंदर्भ की निश्चितता दिखाता है। मुख्य पाठ में दोनों पाद-टिप्पणी चिह्न उचित शब्दों के तुरंत बाद दिए गए हैं।
