reference: Numbers 19:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹ֚את חֻקַּ֣ת הַ/תּוֹרָ֔ה אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לֵ/אמֹ֑ר דַּבֵּ֣ר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל וְ/יִקְח֣וּ אֵלֶי/ךָ֩ פָרָ֨ה אֲדֻמָּ֜ה תְּמִימָ֗ה אֲשֶׁ֤ר אֵֽין בָּ/הּ֙ מ֔וּם אֲשֶׁ֛ר לֹא עָלָ֥ה עָלֶ֖י/הָ עֹֽל־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/002.yaml
  text: 'This is the statute of the law that the LORD has commanded, saying: Speak to the sons of Israel, that they bring to you a red heifer, whole, in which there is no defect, and on which no yoke has come.'
translation:
  language: hi
  text: '“यह उस व्यवस्था की विधि है जिसकी आज्ञा यहोवा ने दी है: इस्राएलियों से कहो कि वे तुम्हारे पास एक निर्दोष लाल बछिया लाएँ, जिसमें कोई दोष न हो और जिस पर कभी जुआ न रखा गया हो।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֻקַּת הַתּוֹרָה
  choice: व्यवस्था की ... विधि
  rationale: חֻקָּה किसी निर्धारित विधान या विधि को और תּוֹרָה यहाँ विधि-व्यवस्था को सूचित करता है; यह सहज हिन्दी में दोनों पदों का भेद बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को दर्शाता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ की अपेक्षा आधुनिक हिन्दी में समुदाय के लिए स्वाभाविक और समावेशी अभिव्यक्ति।
- source_word: פָרָה אֲדֻמָּה
  choice: लाल बछिया
  rationale: פָרָה स्त्रीलिंग गोवंश और אֲדֻמָּה उसके लाल रंग को स्पष्ट करते हैं; अनुष्ठानिक संदर्भ में ‘बछिया’ प्रचलित और सुबोध है।
- source_word: תְּמִימָה
  choice: निर्दोष
  rationale: यहाँ बलिदान योग्य पशु की पूर्णता और अक्षत दशा अभिप्रेत है; अगले वाक्यांश ‘कोई दोष न हो’ के साथ अर्थगत निकटता मूल में भी उपस्थित है।
- source_word: לֹא עָלָה עָלֶיהָ עֹל
  choice: जिस पर कभी जुआ न रखा गया हो
  rationale: मुहावरे का आशय है कि पशु को जुए के अधीन काम में नहीं लगाया गया; ‘कभी’ हिन्दी में पूर्ण निषेध का कालगत भाव स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में टेट्राग्रामटन יהוה है; व्यक्तिगत नाम को पाठ में प्रत्यक्ष रखना स्रोत के अधिक निकट है और किसी विशेष व्याख्यात्मक विस्तार को नहीं जोड़ता।
- issue: תְּמִימָה और מוּם के निकटार्थक विधान
  choice: ‘निर्दोष ... जिसमें कोई दोष न हो’ दोनों को बनाए रखा
  alternative: दोनों को मिलाकर केवल ‘बेदाग’
  rationale: मूल पाठ जानबूझकर दोनों अभिव्यक्तियाँ रखता है; उन्हें बनाए रखने से अनुष्ठानिक पात्रता की पूर्ण माँग और मूल की पुनरुक्ति सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-संरचना को हिन्दी के स्वाभाविक क्रम में रखा गया है, जबकि मूल की विधिक और अनुष्ठानिक शब्दावली सुरक्षित है।
