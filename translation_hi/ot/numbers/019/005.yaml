  text: וְ/שָׂרַ֥ף אֶת הַ/פָּרָ֖ה לְ/עֵינָ֑י/ו אֶת עֹרָ֤/הּ וְ/אֶת בְּשָׂרָ/הּ֙ וְ/אֶת דָּמָ֔/הּ עַל פִּרְשָׁ֖/הּ יִשְׂרֹֽף־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/005.yaml
  text: And he shall burn the cow before his eyes; its hide[a], its flesh, its blood, along with its dung, he shall burn.
translation:
  language: hi
  text: और वह उस गाय को उसकी आँखों के सामने जलाए; उसकी खाल, उसका मांस, उसका लहू और उसके गोबर समेत वह उसे जलाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְשָׂרַף
  choice: और वह ... जलाए
  rationale: वाव के साथ क़ातल यहाँ विधिक-प्रक्रियात्मक क्रम में निर्देश व्यक्त करता है; हिंदी में संभाव्य/आज्ञार्थक ‘जलाए’ स्वाभाविक है।
- source_word: הַפָּרָה
  choice: उस गाय को
  rationale: פָּרָה मादा गोवंश को दर्शाता है। निकट संदर्भ में पशु पहले से निर्दिष्ट है, इसलिए ‘उस गाय’ स्पष्ट और आधुनिक हिंदी है; शब्द स्वयं कम आयु पर अनिवार्य बल नहीं देता।
- source_word: לְעֵינָיו
  choice: उसकी आँखों के सामने
  rationale: शाब्दिक बिंब को रखते हुए यह मुहावरा उसके प्रत्यक्ष देखते हुए किए जाने का अर्थ स्वाभाविक हिंदी में देता है।
- source_word: עֹרָהּ
  choice: उसकी खाल
  rationale: पशु के बाहरी आवरण के लिए ‘खाल’ עוֹר का सटीक और प्रसंगानुकूल हिंदी रूप है।
- source_word: בְּשָׂרָהּ
  choice: उसका मांस
  rationale: בָּשָׂר के लिए ‘मांस’ सीधा, गरिमापूर्ण और बलि-विधान के प्रसंग में स्वाभाविक है।
- source_word: דָּמָהּ
  choice: उसका लहू
  rationale: דָּם का सीधा अनुवाद; ‘लहू’ धार्मिक-विधिक हिंदी में गरिमापूर्ण और सर्वबोध्य है।
- source_word: עַל פִּרְשָׁהּ
  choice: उसके गोबर समेत
  rationale: פֶּרֶשׁ यहाँ मल/गोबर को दर्शाता है और עַל सूची में समावेश का भाव देता है; ‘गोबर समेत’ सटीक और स्वाभाविक है।
- source_word: יִשְׂרֹף
  choice: वह उसे जलाए
  rationale: विधिक निर्देश में इम्परफेक्ट अपेक्षित कार्य बताता है। अंत में क्रिया की पुनरावृत्ति इब्रानी बलाघात को बनाए रखती है; ‘उसे’ पूरे पशु और सूचीबद्ध अंगों की ओर संकेत करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का औपचारिक किंतु सहज विधिक-वर्णनात्मक रजिस्टर अपनाया गया है। इब्रानी की आरंभ और अंत में आने वाली ‘जलाना’ क्रिया की पुनरावृत्ति तथा प्रत्यक्ष उपस्थिति का जीवंत मुहावरा सुरक्षित रखा गया है।
