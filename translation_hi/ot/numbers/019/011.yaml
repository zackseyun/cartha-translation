source:
  edition: WLC
  text: הַ/נֹּגֵ֥עַ בְּ/מֵ֖ת לְ/כָל נֶ֣פֶשׁ אָדָ֑ם וְ/טָמֵ֖א שִׁבְעַ֥ת יָמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/011.yaml
  text: Whoever touches a dead body of any person shall be unclean seven days[a][b].
translation:
  language: hi
  text: जो कोई किसी मनुष्य के शव को छुए, वह सात दिन तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: जो कोई ... छुए
  rationale: निश्चित उपपद के साथ कृदंत यहाँ संज्ञात्मक और सामान्य कानूनी अर्थ रखता है; यह रूप किसी भी ऐसे व्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּמֵת
  choice: शव को
  rationale: מֵת का आशय मृत मनुष्य अथवा उसका मृत शरीर है। स्पर्श के इस अनुष्ठानिक संदर्भ में ‘शव’ संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: לְכָל נֶפֶשׁ אָדָם
  choice: किसी मनुष्य के
  rationale: यह पदबंध किसी भी मानव व्यक्ति को निर्दिष्ट करता है। ‘मनुष्य’ यहाँ स्त्री और पुरुष दोनों के लिए जातिवाचक है और मृत शरीर को पशु के शव से अलग स्पष्ट करता है।
- source_word: וְטָמֵא
  choice: वह ... अशुद्ध रहेगा
  rationale: संयोजक के साथ पूर्ण क्रिया यहाँ परिणामसूचक कानूनी बल रखती है; ‘रहेगा’ सात दिनों तक जारी अनुष्ठानिक अशुद्धता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि को हिन्दी में स्पष्ट और मुहावरेदार ढंग से व्यक्त करने के लिए ‘तक’ जोड़ा गया है।
theological_decisions:
- issue: אָדָם का सामान्य कानूनी अर्थ
  choice: मनुष्य
  alternative: पुरुष; व्यक्ति; मानव-प्राणी
  rationale: यहाँ אָדָם किसी पुरुष-विशेष को नहीं, किसी भी मानव को दर्शाता है। ‘मनुष्य’ स्रोत के मानव-संदर्भ को बनाए रखते हुए हिन्दी में जातिवाचक रूप से उपयुक्त है।
- issue: טָמֵא की प्रकृति
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: गिनती 19 के विधान में यह अनुष्ठानिक स्थिति है; ‘अशुद्ध’ नैतिक दोष का अनावश्यक संकेत दिए बिना प्रचलित बाइबलीय-कानूनी अर्थ व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कानूनी विधान के अनुरूप। ‘शव’ साधारण पाठक के लिए स्पष्ट है, और वाक्य स्रोत के सामान्य नियम तथा सात दिन की अवधि दोनों को सुरक्षित रखता है।
