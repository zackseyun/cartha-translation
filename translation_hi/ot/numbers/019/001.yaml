id: NUM.19.1
reference: Numbers 19:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/001.yaml
  text: And Yahweh spoke to Moses and to Aaron, saying,
translation:
  language: hi
  text: याहवे ने मूसा और हारून से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक रूप यहाँ कथा में वाणी की नई घटना आरम्भ करता है। आधुनिक हिन्दी में अगले पद के प्रत्यक्ष कथन का स्वाभाविक परिचय ‘कहा’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: हिन्दी में ‘किसी से कहना’ स्वाभाविक प्रयोग है। एक ही परसर्ग ‘से’ दोनों संबोधित व्यक्तियों पर लागू होता है और मूल के दोनों संबोधनों को स्पष्ट रखता है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह मानक इब्रानी कथन-परिचय सूत्र है। हिन्दी में ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता; अल्पविराम अगले पद में आने वाले कथन से संबंध बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है; ‘यहोवा’ एक वैकल्पिक पारंपरिक स्वरूप है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। मूल के औपचारिक कथन-सूत्र को हिन्दी की स्वाभाविक वाक्य-रचना में संक्षिप्त रखा गया है।
