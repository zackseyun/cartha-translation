  yaml_path: translation/ot/numbers/019/004.yaml
  text: Then Eleazar the priest shall take some of its blood with his finger and sprinkle some of its blood seven times toward the front of the tent of meeting[a].
translation:
  language: hi
  text: तब एलीआज़र याजक अपनी उँगली से उसके लहू में से कुछ ले और उसके लहू में से मिलापवाले तंबू के सामने की ओर सात बार छिड़के[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मिलापवाले तंबू के सामने।” इब्रानी पदबंध तंबू के सामने वाले भाग की दिशा बताता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... ले
  rationale: विधिक अनुष्ठान के क्रम में वाव के साथ पूर्ण क्रिया अगले निर्देश को बताती है; हिंदी में “तब” क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़ार याजक
  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण और पदनाम का सीधा अनुवाद।
- source_word: מִדָּמָהּ בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से उसका कुछ लहू
  rationale: מִן का अंशवाचक भाव “कुछ” से और בְּ का साधनवाचक भाव “उँगली से” द्वारा व्यक्त होता है। स्त्रीलिंग प्रत्यय पिछली आयत की बछिया की ओर संकेत करता है।
- source_word: וְהִזָּה
  choice: छिड़के
  rationale: पुरोहितीय अनुष्ठान में נזה लहू या जल के विधिपूर्वक छिड़काव को दर्शाता है।
- source_word: אֶל נֹכַח פְּנֵי אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के सामने की ओर
  rationale: यह पदबंध तंबू के अग्रभाग की दिशा बताता है; “की ओर” दिशात्मकता को बनाए रखता है और तंबू के भीतर जाने का अर्थ नहीं देता।
- source_word: מִדָּמָהּ
  choice: उस लहू में से
  rationale: इब्रानी में लहू का उल्लेख दोहराया गया है; हिंदी में इसे बनाए रखने से अनुष्ठान के माध्यम पर बल रहता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: संख्या और आवृत्ति का सीधा, स्वाभाविक अनुवाद।
theological_decisions:
- issue: छिड़काव की स्थिति या दिशा
  choice: तंबू के सामने की ओर
  alternative: मिलापवाले तंबू के सामने
  rationale: אֶל और נֹכַח का संयुक्त प्रयोग दिशा की ओर संकेत करता है; अनुवाद यह तय नहीं करता कि याजक ठीक किस स्थान पर खड़ा था।
