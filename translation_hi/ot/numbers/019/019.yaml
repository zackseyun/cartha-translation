id: NUM.19.19
reference: Numbers 19:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִזָּ֤ה הַ/טָּהֹר֙ עַל הַ/טָּמֵ֔א בַּ/יּ֥וֹם הַ/שְּׁלִישִׁ֖י וּ/בַ/יּ֣וֹם הַ/שְּׁבִיעִ֑י וְ/חִטְּא/וֹ֙ בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֔י וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָהֵ֥ר בָּ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/019.yaml
  text: And the clean person shall sprinkle it on the unclean person on the third day and on the seventh day; thus he shall purify him on the seventh day. Then he shall wash his clothes and bathe in water[a], and he shall be clean at evening.
translation:
  language: hi
  text: शुद्ध व्यक्ति तीसरे दिन और सातवें दिन अशुद्ध व्यक्ति पर शुद्धिकरण का जल छिड़के। इस प्रकार वह सातवें दिन उसे शुद्ध करे[a]। तब अशुद्ध व्यक्ति अपने कपड़े धोए और जल से स्नान करे; शाम को वह शुद्ध हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया की जड़ प्रायः ‘पाप’ से जुड़ी भाषा में भी आती है; पर यहाँ इसका अर्थ विधिगत अशुद्धता दूर करके शुद्ध करना है।
    reason: शब्द के व्यापक अर्थ-क्षेत्र और इस प्रसंग में उसके विशेष विधिगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וְהִזָּה
  choice: छिड़के
  rationale: हिफ़ील रूप इस शुद्धिकरण-विधि में जल को किसी पर छिड़कने की क्रिया बताता है। हिंदी में ‘छिड़के’ स्वाभाविक और सटीक है।
- source_word: הַטָּהֹר / הַטָּמֵא
  choice: शुद्ध व्यक्ति / अशुद्ध व्यक्ति
  rationale: ये विशेषण संज्ञा के रूप में प्रयुक्त हैं और विधिगत शुद्धता-अशुद्धता बताते हैं। ‘व्यक्ति’ इनके प्रतिनिधिक अर्थ को बनाए रखता है।
- source_word: וְחִטְּאוֹ
  choice: उसे शुद्ध करे
  rationale: पिएल रूप यहाँ शव-संपर्क से हुई विधिगत अशुद्धता दूर करने को दर्शाता है, नैतिक पाप-क्षमा को नहीं।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: यह आधुनिक हिंदी में सीधा और स्वाभाविक है तथा वस्त्र धोने की विधिगत क्रिया को स्पष्ट रखता है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: जल से स्नान करे
  rationale: इस संदर्भ में क्रिया शरीर धोने का भाव देती है; ‘जल से स्नान करे’ हिंदी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְטָהֵר בָּעָרֶב
  choice: शाम को वह शुद्ध हो जाएगा
  rationale: यह धुलाई के बाद शाम के समय प्राप्त होने वाली विधिगत शुद्ध अवस्था को व्यक्त करता है।
theological_decisions:
- issue: חטא और טהר का अर्थ इस शुद्धिकरण-विधि में
  choice: विधिगत अशुद्धता से शुद्ध करना
  alternative: पाप से शुद्ध करना या प्रायश्चित करना
  rationale: प्रसंग शव-संपर्क से उत्पन्न अशुद्धता और शुद्धिकरण के जल का है; इसलिए नैतिक दोष या प्रायश्चित का अर्थ आरोपित नहीं किया गया।
- issue: הַטָּהֹר और הַטָּמֵא में व्याकरणिक लिंग
  choice: ‘व्यक्ति’ के द्वारा प्रतिनिधिक अर्थ व्यक्त करना
  alternative: ‘शुद्ध पुरुष’ और ‘अशुद्ध पुरुष’
  rationale: इब्रानी रूप पुल्लिंग एकवचन हैं, पर व्यवस्था-संबंधी इस कथन में वे सामान्य रूप से संबंधित व्यक्ति को सूचित करते हैं, न कि केवल पुरुष को।
- issue: कपड़े धोने और स्नान करने वाले कर्ता की पहचान
  choice: ‘अशुद्ध व्यक्ति’ को स्पष्ट कर्ता बनाया
  alternative: सर्वनाम ‘वह’ को अस्पष्ट रहने देना, जिससे शुद्ध व्यक्ति भी कर्ता समझा जा सके
  rationale: विधि का क्रम और अंतिम ‘शुद्ध हो जाएगा’ उस व्यक्ति की ओर संकेत करते हैं जिसे शुद्ध किया जा रहा है। हिंदी में केवल ‘वह’ रखने से अनावश्यक भ्रम पैदा होता।
translation_notes:
  register: आधुनिक मानक हिंदी में विधि-संबंधी, गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘शुद्धिकरण का जल’ निकटवर्ती प्रसंग से निहित कर्म को स्पष्ट करता है। अंतिम क्रियाओं में कर्ता को ‘अशुद्ध व्यक्ति’ कहकर दोहराया गया है ताकि हिंदी में सर्वनाम-संदेह न रहे।
