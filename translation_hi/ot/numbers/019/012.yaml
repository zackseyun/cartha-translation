  text: ה֣וּא יִתְחַטָּא ב֞/וֹ בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י יִטְהָ֑ר וְ/אִם לֹ֨א יִתְחַטָּ֜א בַּ/יּ֧וֹם הַ/שְּׁלִישִׁ֛י וּ/בַ/יּ֥וֹם הַ/שְּׁבִיעִ֖י לֹ֥א יִטְהָֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/019/012.yaml
  text: He shall purify himself with it on the third day and on the seventh day[a], and he will be clean; but if he does not purify himself on the third day and on the seventh day[b], he will not be clean.
translation:
  language: hi
  text: वह तीसरे दिन और सातवें दिन उस जल से अपने को शुद्ध करे[a], तब वह शुद्ध होगा; पर यदि वह तीसरे दिन और सातवें दिन अपने को शुद्ध न करे[b], तो वह शुद्ध नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् उस अशुद्धता दूर करने के जल से, जिसे इस अध्याय में पहले तैयार किया गया था।
    reason: cross_reference
  - marker: b
    text: या, “अपने को शुद्ध करे।” यहाँ प्रयुक्त इब्रानी क्रिया अनुष्ठान के द्वारा अशुद्धता से शुद्ध होने को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִתְחַטָּא
  choice: अपने को शुद्ध करे
  rationale: हित्पाएल रूप इस अनुष्ठानिक संदर्भ में अशुद्धता से शुद्ध होने की प्रक्रिया बताता है, पाप करने को नहीं। यह चयन आत्मवाची भाव और अनुष्ठानिक अर्थ दोनों रखता है।
- source_word: בּוֹ
  choice: उस जल से
  rationale: सर्वनाम का स्वाभाविक संकेत अध्याय में पहले तैयार किए गए अशुद्धता दूर करने वाले जल की ओर है। हिन्दी में केवल ‘उससे’ अस्पष्ट हो सकता था, इसलिए संदर्भित वस्तु को स्पष्ट किया गया है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: समय-सूचक पद का स्वाभाविक और निकट हिन्दी रूप।
- source_word: וּבַיּוֹם הַשְּׁבִיעִי
  choice: और सातवें दिन
  rationale: इब्रानी समन्वय और अनुष्ठान के दोनों निर्धारित दिनों को ज्यों का त्यों रखता है।
- source_word: יִטְהָר
  choice: वह शुद्ध होगा
  rationale: טהר अनुष्ठान के परिणामस्वरूप प्राप्त शुद्ध स्थिति बताता है; इसे प्रक्रिया-सूचक ‘अपने को शुद्ध करे’ से अलग रखा गया है।
- source_word: וְאִם לֹא
  choice: पर यदि ... न
  rationale: वाव यहाँ विरोधात्मक शर्त प्रस्तुत करता है; ‘पर यदि’ चेतावनी का बल स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: वह
  rationale: स्पष्ट पुल्लिंग एकवचन सर्वनाम को रखा गया है; प्रसंग में यह उस अशुद्ध व्यक्ति की ओर संकेत करता है।
theological_decisions:
- issue: गिनती 19 में शुद्धिकरण की प्रकृति
  choice: भाषा को अनुष्ठानिक शुद्धता और अशुद्धता के क्षेत्र में रखा गया है।
  alternative: इसे नैतिक क्षमा या भीतरी पवित्रीकरण की सामान्य आध्यात्मिक भाषा में व्यक्त करना।
  rationale: प्रसंग शव के संपर्क से हुई अशुद्धता और निर्धारित शुद्धिकरण-जल का है। इब्रानी क्रियाएँ अनुष्ठानिक स्थिति का वर्णन करती हैं; पद में नैतिक दोष या क्षमा का अर्थ जोड़ना उचित नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और अनुष्ठानिक संदर्भ के अनुरूप भाषा। ‘उस जल से’ हिन्दी पाठक के लिए सर्वनाम का संदर्भ स्पष्ट करता है, जबकि मुख्य वाक्य में अनावश्यक तकनीकी शब्दावली से बचा गया है।
