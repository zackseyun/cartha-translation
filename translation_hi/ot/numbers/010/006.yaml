  text: When you blow a second alarm, the camps that are encamped on the south side shall set out; they shall blow an alarm for their departures.
translation:
  language: hi
  text: जब तुम दूसरी बार चेतावनी की ध्वनि[a] फूँकोगे, तब दक्षिण में डेरा डाले छावनियाँ कूच करेंगी; उनके कूच के लिए चेतावनी की ध्वनि फूँकी जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकेत की ध्वनि” अथवा “विशेष तुरही-ध्वनि”; इब्रानी शब्द תְּרוּעָה यहाँ छावनियों को निर्देश देने वाली विशिष्ट तुरही-ध्वनि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: जब तुम ... फूँकोगे
  rationale: תקע यहाँ तुरही फूँकने के लिए प्रयुक्त है। द्वितीय पुरुष बहुवचन को बनाए रखते हुए ‘जब’ निर्देशों के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תְּרוּעָה
  choice: चेतावनी की ध्वनि
  rationale: इस प्रसंग में यह सामान्य शोर या जयघोष नहीं, बल्कि छावनियों को कूच का निर्देश देने वाली विशिष्ट तुरही-ध्वनि है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: क्रमसूचक अर्थ को सहज हिन्दी में व्यक्त करता है और दूसरी विशिष्ट ध्वनि का संकेत देता है।
- source_word: וְנָסְעוּ
  choice: कूच करेंगी
  rationale: נסע छावनी समेटकर यात्रा आरम्भ करने को दर्शाता है; सैन्य-छावनी के प्रसंग में ‘कूच करना’ सटीक और स्वाभाविक है।
- source_word: הַמַּחֲנוֹת הַחֹנִים
  choice: डेरा डाले हुए छावनियाँ
  rationale: बहुवचन संज्ञा और उसे विशेषित करने वाले कृदंत—दोनों को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: תֵּימָנָה
  choice: दक्षिण की ओर
  rationale: यहाँ शब्द दक्षिण में स्थित छावनियों को पहचानता है; हिन्दी में ‘दक्षिण की ओर डेरा डाले हुए’ स्थान-संबंधी अर्थ स्पष्ट करता है।
- source_word: תְּרוּעָה יִתְקְעוּ
  choice: चेतावनी की ध्वनि फूँकी जाएगी
  rationale: हिब्रू में क्रिया सक्रिय बहुवचन है, पर कर्ता व्यक्त नहीं है। हिन्दी का भाववाच्य अनिर्दिष्ट कर्ता को बनाए रखता है और छावनियों को स्वयं तुरही फूँकने वाला बताने की भ्रांति से बचाता है।
- source_word: לְמַסְעֵיהֶם
  choice: उनके कूच के लिए
  rationale: यह उनके पड़ाव से प्रस्थान करने के अवसरों/उद्देश्य को दर्शाता है; ‘कूच के लिए’ संक्षिप्त और प्रसंगानुकूल है।
