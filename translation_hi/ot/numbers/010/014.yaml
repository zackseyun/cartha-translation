base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/014.yaml
  text: The standard of the camp of the sons of Judah set out first[a], by their divisions[b]; and over its division was Nahshon son of Amminadab.
translation:
  language: hi
  text: यहूदा के पुत्रों की छावनी का ध्वज सबसे पहले कूच किया[a], अपने-अपने सैन्य दलों के अनुसार[b]; और उसके सैन्य दल का अगुआ अम्मीनादाब का पुत्र नहशोन था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ध्वज’ के लिए ‘झंडा’ भी संभव है। हिब्रू शब्द उस गोत्रीय चिह्न को बताता है जिसके अधीन छावनी-दल कूच करता था।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपने-अपने दलों के अनुसार।’ हिब्रू में सैन्य ढंग से व्यवस्थित गोत्रीय इकाइयों के लिए प्रयुक्त शब्द है।
    reason: lexical_alternative
