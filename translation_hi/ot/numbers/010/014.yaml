- source_word: בָּרִאשֹׁנָה
  choice: सबसे पहले
  rationale: यह कूच के क्रम को स्पष्ट करता है।
- source_word: לְצִבְאֹתָם
  choice: अपने-अपने सैन्य दलों के अनुसार
  rationale: צבא यहाँ युद्ध की कार्रवाई से अधिक जनगणना और कूच की संगठित इकाइयों को सूचित करता है। बहुवचन और वितरणात्मक भाव दोनों व्यक्त किए गए हैं।
- source_word: וְעַל צְבָאוֹ
  choice: और उसके सैन्य दल का प्रधान ... था
  rationale: על नेतृत्व या अधिकार का संकेत देता है। स्वाभाविक हिंदी के लिए निहित नेतृत्व-संबंध को ‘प्रधान’ से स्पष्ट किया गया है।
- source_word: נַחְשׁוֹן בֶּן עַמִּינָדָב
  choice: अम्मीनादाब का पुत्र नहशोन
  rationale: नामों का मानक हिंदी लिप्यंतरण और स्वाभाविक हिंदी वंशावली क्रम अपनाया गया है।
