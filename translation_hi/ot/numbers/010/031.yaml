id: NUM.10.31
reference: Numbers 10:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֕אמֶר אַל נָ֖א תַּעֲזֹ֣ב אֹתָ֑/נוּ כִּ֣י עַל כֵּ֣ן יָדַ֗עְתָּ חֲנֹתֵ֨/נוּ֙ בַּ/מִּדְבָּ֔ר וְ/הָיִ֥יתָ לָּ֖/נוּ לְ/עֵינָֽיִם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/031.yaml
  text: And he said[a], “Please do not leave us, for you know where we should camp in the wilderness, and you will be eyes for us.”
translation:
  language: hi
  text: उसने कहा, “कृपया हमें छोड़कर न जाइए, क्योंकि आप जानते हैं कि निर्जन प्रदेश में हमें कहाँ डेरा डालना है, और आप हमारी आँखें होंगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “आप हमारे लिए आँखें होंगे,” अर्थात निर्जन प्रदेश के अपने ज्ञान के कारण हमारे मार्गदर्शक होंगे। “हमें कहाँ डेरा डालना है” के स्थान पर अधिक शाब्दिक रूप “हमारा पड़ाव डालना” या “हमारे पड़ाव” भी संभव है।
    reason: मूल ‘आँखें’ रूपक तथा חֲנֹתֵנוּ के व्यापक अर्थ को स्पष्ट करता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी कथात्मक शैली को स्वाभाविक हिन्दी में रखता है; कर्ता का नाम इस पद में नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: אַל נָא
  choice: कृपया ... न जाइए
  rationale: אַל निषेध और נָא विनम्र आग्रह व्यक्त करता है। आदरसूचक रूप निवेदन की ध्वनि को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: תַּעֲזֹב אֹתָנוּ
  choice: हमें छोड़कर ... जाइए
  rationale: यात्रा के प्रसंग में עזב का अर्थ यहाँ ‘छोड़ना’ है; ‘त्यागना’ अनावश्यक रूप से अधिक भावात्मक या धर्मवैचारिक हो सकता है।
- source_word: כִּי עַל כֵּן
  choice: क्योंकि
  rationale: यह पदबंध आग्रह का कारण प्रस्तुत करता है; ‘क्योंकि’ उसका कारणवाचक बल स्पष्ट और सहज रूप से देता है।
- source_word: יָדַעְתָּ
  choice: आप जानते हैं
  rationale: पूर्ण क्रिया का वर्तमान में बना हुआ परिणाम है—होबाब का ज्ञान अभी उपयोगी है—इसलिए हिन्दी वर्तमान काल उपयुक्त है।
- source_word: חֲנֹתֵנוּ
  choice: हमें कहाँ डेरा डालना है
  rationale: शाब्दिक रूप से यह ‘हमारा डेरा डालना/हमारे पड़ाव’ है। प्रसंग में स्थान-ज्ञान अभिप्रेत जान पड़ता है, इसलिए अर्थ को सहज हिन्दी में व्यक्त किया गया, जबकि व्याकरण की संभावित व्यापकता टिप्पणी में स्वीकार की गई है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं है; ‘निर्जन प्रदेश’ वन का भ्रम पैदा किए बिना व्यापक भूभाग का अर्थ देता है।
- source_word: וְהָיִיתָ לָּנוּ לְעֵינָיִם
  choice: और आप हमारे लिए आँखों का काम करेंगे
  rationale: मूल रूपक ‘हमारे लिए आँखें होना’ सुरक्षित रहता है, साथ ही ‘काम करेंगे’ हिन्दी पाठक को मार्गदर्शन की भूमिका समझने में सहायता देता है।
theological_decisions:
- issue: मानवीय मार्गदर्शन और परमेश्वर के मार्गदर्शन के बीच संभावित तनाव
  choice: मूल पाठ की तरह होबाब की स्थानीय जानकारी और मार्गदर्शक भूमिका को स्पष्ट रखा गया।
  alternative: वाक्य को इस प्रकार नरम करना कि होबाब केवल सहायक हो और मार्गदर्शक न लगे।
  rationale: पद स्वयं मानवीय ज्ञान को उपयोगी बताता है; कथित धर्मवैचारिक तनाव को अनुवाद में हल करना या कम करना मूल पाठ से आगे जाना होगा।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। निवेदन में आदरसूचक ‘आप’ रखा गया है। ‘निर्जन प्रदेश’ מִדְבָּר को ‘जंगल’ या केवल रेतीले ‘मरुस्थल’ तक सीमित करने से बचाता है।
