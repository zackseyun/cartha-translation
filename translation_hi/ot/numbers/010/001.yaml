  yaml_path: translation/ot/numbers/010/001.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: याहवे ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: वाव-क्रमिक के साथ דבר यहाँ कथा में वाणी की नई घटना आरम्भ करता है। हिंदी में आगे לֵאמֹר के साथ प्रयुक्त इब्रानी सूत्र को स्वाभाविक रूप से एक ही क्रिया ‘कहा’ में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय उसके प्रचलित हिंदी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी की दिशा बताने वाले אֶל का स्वाभाविक आधुनिक हिंदी रूप ‘से’ है; מֹשֶׁה का मानक हिंदी नाम ‘मूसा’ रखा गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह infinitive construct आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। आधुनिक हिंदी में ‘यह कहते हुए कहा’ जैसी पुनरुक्ति से बचते हुए इसे मुख्य वाणी-क्रिया में समाहित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम יהוה का प्रयोग करता है। ‘याहवे’ नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता; स्वरांकन की प्राचीन अनिश्चितता के बावजूद यह व्यापक विद्वत् पुनर्निर्माण है।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण हिंदी। इब्रानी ‘बोला…कहते हुए’ सूत्र का शब्दशः पुनरुत्पादन हिंदी में अस्वाभाविक होता, इसलिए उसके आशय को संक्षिप्त वाक्य में रखा गया है।
