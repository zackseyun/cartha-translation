source:
  edition: WLC
  text: וּ/בְנֵ֤י אַהֲרֹן֙ הַ/כֹּ֣הֲנִ֔ים יִתְקְע֖וּ בַּֽ/חֲצֹצְר֑וֹת וְ/הָי֥וּ לָ/כֶ֛ם לְ/חֻקַּ֥ת עוֹלָ֖ם לְ/דֹרֹתֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/008.yaml
  text: And the sons of Aaron[a], the priests, shall blow the trumpets; and they shall be for you a permanent statute throughout your generations.
translation:
  language: hi
  text: और हारून के पुत्र, जो याजक हैं, तुरहियाँ फूँकें; और यह तुम्हारे लिए पीढ़ी-दर-पीढ़ी एक स्थायी विधि[a] होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युगों तक की विधि” अथवा “सदैव की विधि”।
    reason: עוֹלָם दीर्घकालीन स्थायित्व या निरंतरता को व्यक्त कर सकता है; ये विकल्प मूल की अर्थ-सीमा को दिखाते हैं।
lexical_decisions:
- source_word: וּבְנֵי אַהֲרֹן
  choice: और हारून के पुत्र
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है; पारिवारिक अभिव्यक्ति को बनाए रखते हुए हिन्दी की स्वाभाविक शब्द-रचना अपनाई गई है।
- source_word: הַכֹּהֲנִים
  choice: जो याजक हैं
  rationale: यह ‘हारून के पुत्रों’ की समानाधिकरण पहचान है। हिन्दी में संबंधवाचक उपवाक्य अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: יִתְקְעוּ בַּחֲצֹצְרֹת
  choice: तुरहियाँ फूँकें
  rationale: תקע का חֲצֹצְרוֹת के साथ अर्थ तुरही फूँकना है। विधिक निर्देश को हिन्दी के संभावनार्थक/आज्ञार्थक रूप ‘फूँकें’ से व्यक्त किया गया है। इस पद में ‘चाँदी की’ नहीं जोड़ा गया, यद्यपि निकट संदर्भ में तुरहियाँ चाँदी की हैं।
- source_word: וְהָיוּ לָכֶם
  choice: वे तुम्हारे लिए … होंगी
  rationale: स्रोत के बहुवचन क्रिया-रूप को बनाए रखा गया है। हिन्दी का स्त्रीलिंग बहुवचन ‘होंगी’ निकटतम पूर्वपद ‘तुरहियाँ’ से स्वाभाविक रूप से जुड़ता है, यद्यपि कथन पूरे विधान का भी सार प्रस्तुत कर सकता है।
- source_word: לְחֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: यह प्रचलित विधिक सूत्र निरंतर और स्थायी रूप से लागू विधान को व्यक्त करता है। ‘सदा की विधि’ सरल, गरिमापूर्ण और मूल के कालगत विस्तार के निकट है, पर עוֹלָם की सीमा को दार्शनिक रूप से अधिक स्पष्ट नहीं करती।
- source_word: לְדֹרֹתֵיכֶם
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह क्रमिक पीढ़ियों में निरंतर लागू रहने का स्वाभाविक आधुनिक हिन्दी रूप है।
theological_decisions:
- issue: חֻקַּת עוֹלָם में עוֹלָם का कालगत बल
  choice: सदा की विधि
  alternative: युगों तक की विधि; सदैव की विधि
  rationale: मूल पदबंध इस्राएल की पीढ़ियों में बने रहने वाले विधान को दर्शाता है। ‘सदा’ स्थायित्व को व्यक्त करता है, जबकि पादटिप्पणी उन विकल्पों को सुरक्षित रखती है जो दीर्घकाल अथवा अनंत निरंतरता के भिन्न बल दे सकते हैं।
- issue: וְהָיוּ के बहुवचन का संदर्भ
  choice: वे … होंगी
  alternative: यह … होगी
  rationale: बहुवचन को औपचारिक रूप से सुरक्षित रखा गया है और हिन्दी में उसका निकटतम संदर्भ ‘तुरहियाँ’ है। एकवचन ‘यह’ पूरे विधान का सार अधिक सहजता से देता, पर स्रोत की व्याकरणिक बहुवचनता को समतल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण विधिक शैली रखी गई है। ‘याजक’, ‘तुरही’ और ‘विधि’ सामान्य बाइबलीय शब्दावली के रूप में बोधगम्य हैं। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिससे उसका संबंध है।
