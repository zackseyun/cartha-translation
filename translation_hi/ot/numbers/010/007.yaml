  yaml_path: translation/ot/numbers/010/007.yaml
  text: But when assembling the congregation[a], you shall blow, and you shall not sound an alarm.
translation:
  language: hi
  text: पर जब तुम मण्डली को इकट्ठा करो, तब तुरहियाँ फूँको, पर चेतावनी का संकेत[a] न बजाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चेतावनी की विशेष ध्वनि।” इब्रानी में साधारण रूप से तुरही फूँकने और आसपास के संदर्भ में कूच के लिए बजाई जाने वाली विशिष्ट संकेत-ध्वनि के बीच भेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְהַקְהִיל
  choice: पर जब ... इकट्ठा करना हो
  rationale: वाव के साथ हिफ़ील infinitive construct यहाँ समय और पिछले निर्देश से विरोध—दोनों व्यक्त करता है। यह हिंदी में स्वाभाविक निर्देशात्मक रूप है।
- source_word: הַקָּהָל
  choice: मण्डली
  rationale: यह इस्राएल के एकत्र समुदाय को दर्शाता है; ‘मण्डली’ सामुदायिक और उपासना-संबंधी संदर्भ में सुबोध है।
- source_word: תִּתְקְעוּ
  choice: तुम तुरहियाँ फूँकना
  rationale: תקע यहाँ तुरहियाँ फूँकने के लिए प्रयुक्त है। मूल पद में कर्म दोहराया नहीं गया, किंतु हिंदी में अकेला ‘फूँकना’ अस्वाभाविक होगा; तुरहियों का उल्लेख निकट संदर्भ से स्पष्ट है।
- source_word: וְלֹא
  choice: पर ... न
  rationale: यह पहले प्रकार के फूँकने और निषिद्ध विशेष संकेत के बीच स्पष्ट विरोध प्रकट करता है।
- source_word: תָרִיעוּ
  choice: चेतावनी का संकेत न बजाना
  rationale: हिफ़ील रूप यहाँ साधारण तुरही-ध्वनि नहीं, बल्कि कूच से जुड़ी विशिष्ट तेज़ संकेत-ध्वनि को दर्शाता है। ‘संकेत बजाना’ इस तकनीकी भेद को सहज हिंदी में रखता है।
