source:
  edition: WLC
  text: וַ/יְהִ֞י בַּ/שָּׁנָ֧ה הַ/שֵּׁנִ֛ית בַּ/חֹ֥דֶשׁ הַ/שֵּׁנִ֖י בְּ/עֶשְׂרִ֣ים בַּ/חֹ֑דֶשׁ נַעֲלָה֙ הֶֽ/עָנָ֔ן מֵ/עַ֖ל מִשְׁכַּ֥ן הָ/עֵדֻֽת׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/011.yaml
  text: And it happened in the second year[a], in the second month, on the twentieth day of the month[b], that the cloud lifted from over the tabernacle of the testimony.
translation:
  language: hi
  text: दूसरे वर्ष के दूसरे महीने के बीसवें दिन ऐसा हुआ कि बादल साक्षी के निवास-स्थान[b] के ऊपर से उठ गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपर चला गया।”
    reason: עלה की वैकल्पिक शाब्दिक अभिव्यक्ति।
  - marker: b
    text: इब्रानी में “साक्षी का निवास-स्थान”; इसका अनुवाद “साक्षी का तम्बू” भी किया जाता है।
    reason: पवित्रस्थान के पदनाम का वैकल्पिक प्रचलित अनुवाद।
lexical_decisions:
- source_word: וַיְהִי
  choice: ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक क्रम में अगली घटना का परिचय देता है; यह हिंदी में स्वाभाविक रहते हुए घटना के घटित होने का भाव बनाए रखता है।
- source_word: בַּשָּׁנָה הַשֵּׁנִית בַּחֹדֶשׁ הַשֵּׁנִי בְּעֶשְׂרִים בַּחֹדֶשׁ
  choice: दूसरे वर्ष के दूसरे महीने के बीसवें दिन
  rationale: इब्रानी की तीनों काल-सूचनाएँ स्पष्ट और स्वाभाविक हिंदी क्रम में रखी गई हैं; ‘दिन’ अर्थ की स्पष्टता के लिए निहित रूप से जोड़ा गया है।
- source_word: נַעֲלָה
  choice: उठ गया
  rationale: עלה बादल की ऊपर की ओर गति और निवास-स्थान के ऊपर से उसके हटने को व्यक्त करता है; ‘उठ गया’ दोनों संदर्भों में स्वाभाविक हिंदी है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: निश्चित पद उस पहले से परिचित बादल की ओर संकेत करता है जो इस्राएल का मार्गदर्शन करता था; हिंदी में संदर्भ से निश्चितता स्पष्ट है।
- source_word: מֵעַל
  choice: के ऊपर से
  rationale: यह किसी वस्तु के ऊपर की स्थिति से दूर होने की गति को ठीक रूप से व्यक्त करता है।
- source_word: מִשְׁכַּן
  choice: निवास-स्थान
  rationale: मूल शब्द का आधारभूत अर्थ ‘निवास’ है और यहाँ वह जंगल के चलायमान पवित्र ढाँचे को दर्शाता है; यह चयन संबंधित इब्रानी शब्द אֹהֶל, ‘तम्बू,’ से भेद भी बनाए रखता है।
- source_word: הָעֵדֻת
  choice: साक्षी
  rationale: पंचग्रंथ की पवित्रस्थान-संबंधी भाषा में यह वाचा की लिखित साक्षी की ओर संकेत करता है; ‘साक्षी’ मूल की व्यापकता और पारस्परिक पाठ-संबंधों को सुरक्षित रखता है।
theological_decisions:
- issue: מִשְׁכַּן הָעֵדֻת का पवित्रस्थान-संबंधी पदनाम
  choice: साक्षी का निवास-स्थान
  alternative: साक्षी का तम्बू; वाचा का निवास-स्थान
  rationale: ‘निवास-स्थान’ מִשְׁכָּן का सीधा अर्थ सुरक्षित रखता है, जबकि ‘साक्षी’ עֵדוּת को बिना उसे व्याख्यात्मक रूप से ‘वाचा’ में बदलने के प्रस्तुत करता है। इससे पद की धार्मिक प्रतिध्वनि बनी रहती है और किसी विशेष सिद्धान्त को आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। काल-सूचना को हिंदी के स्वाभाविक क्रम में रखा गया है। मुख्य पाठ में ‘निवास-स्थान’ मूल מִשְׁכָּן के निकट है; पाठक-सहायता के लिए अधिक परिचित ‘तम्बू’ को पादटिप्पणी में दिया गया है।
