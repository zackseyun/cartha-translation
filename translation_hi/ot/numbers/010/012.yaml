source:
  edition: WLC
  text: וַ/יִּסְע֧וּ בְנֵֽי יִשְׂרָאֵ֛ל לְ/מַסְעֵי/הֶ֖ם מִ/מִּדְבַּ֣ר סִינָ֑י וַ/יִּשְׁכֹּ֥ן הֶ/עָנָ֖ן בְּ/מִדְבַּ֥ר פָּארָֽן־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/012.yaml
  text: And the sons of Israel set out by stages from the wilderness of Sinai[a], and the cloud settled in the wilderness of Paran.
translation:
  language: hi
  text: और इस्राएल के पुत्र[a] सीनै के निर्जन प्रदेश से पड़ाव-दर-पड़ाव रवाना हुए, और बादल पारान के निर्जन प्रदेश में ठहर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएली।” इब्रानी में “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: रवाना हुए
  rationale: यात्रा-वृत्तांत में क्रिया נסע का अर्थ डेरा उठाकर आगे चल पड़ना है; ‘रवाना हुए’ आधुनिक और स्वाभाविक हिन्दी में यही भाव व्यक्त करता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह इब्रानी के पुरुषवाचक पारिवारिक पदबंध का पारदर्शी अनुवाद है; अधिक मुहावरेदार सामूहिक रूप ‘इस्राएली’ को पादटिप्पणी में रखा गया है।
- source_word: לְמַסְעֵיהֶם
  choice: पड़ाव-दर-पड़ाव
  rationale: बहुवचन संज्ञा מַסַּע यहाँ यात्रा के क्रमिक चरणों अथवा पड़ावों को सूचित करती है; यह हिन्दी प्रयोग उसके वितरणात्मक भाव को सहज रूप से व्यक्त करता है।
- source_word: מִמִּדְבַּר סִינָי
  choice: सीनै के निर्जन प्रदेश से
  rationale: מִדְבָּר किसी अनाबाद या कम आबाद भूभाग को दर्शाता है, जो केवल रेतीली मरुभूमि तक सीमित नहीं; इसलिए ‘निर्जन प्रदेश’ उपयुक्त है।
- source_word: וַיִּשְׁכֹּן
  choice: ठहर गया
  rationale: बादल के किसी स्थान पर रुक जाने के संदर्भ में שכן का स्वाभाविक हिन्दी रूप ‘ठहर गया’ है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: यह जंगल-यात्रा में पहले से परिचित मार्गदर्शक बादल का निश्चित उल्लेख है।
- source_word: בְּמִדְבַּר פָּארָן
  choice: पारान के निर्जन प्रदेश में
  rationale: מִדְבָּר के लिए वही सुसंगत भौगोलिक पद रखा गया है और स्थान-नाम פָּארָן का लिप्यंतरण ‘पारान’ किया गया है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का अनुवाद
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मूल इब्रानी की पुरुषवाचक पारिवारिक अभिव्यक्ति को मुख्य पाठ में सुरक्षित रखा गया है, जबकि सहज सामूहिक विकल्प पादटिप्पणी में दिया गया है; इससे मूल की विशेषता बिना सांप्रदायिक व्याख्या जोड़े बनी रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली सरल, गरिमापूर्ण और कथात्मक है। ‘जंगल’ से आधुनिक पाठक को वन का भ्रामक बोध हो सकता है, इसलिए מִדְבָּר के लिए ‘निर्जन प्रदेश’ चुना गया है।
