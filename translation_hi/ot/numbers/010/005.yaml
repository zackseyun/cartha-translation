  text: When you blow an alarm blast, the camps that are encamped on the east side shall set out.
translation:
  language: hi
  text: जब तुम चेतावनी का बिगुल[a] बजाओ, तब पूर्व दिशा में डेरे डाले हुए छावनियाँ कूच करें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “संकेत का बिगुल।” यहाँ प्रयुक्त इब्रानी शब्द तुरहियों की उस विशिष्ट ध्वनि को दर्शाता है जो छावनियों को कूच करने का संकेत देती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּתְקַעְתֶּם
  choice: जब तुम ... फूँको
  rationale: תקע तुरही के संदर्भ में फूँकने या बजाने को दर्शाता है। संयोजक वाव सहित यह खंड अगले निर्देश की समय-परिस्थिति बताता है, इसलिए स्वाभाविक हिन्दी में ‘जब ... तब’ रखा गया है।
- source_word: תְּרוּעָה
  choice: चेतावनी की धुन
  rationale: तुरही-संकेत के इस संदर्भ में תְּרוּעָה साधारण ध्वनि नहीं, बल्कि छावनी को चलने का संकेत देने वाली विशिष्ट धुन है। ‘चेतावनी की धुन’ उसके संकेतात्मक और सचेत करने वाले भाव को व्यक्त करती है।
- source_word: וְנָסְעוּ
  choice: कूच करें
  rationale: נסע छावनी के संदर्भ में पड़ाव छोड़कर यात्रा आरम्भ करने को दर्शाता है। ‘कूच करें’ संक्षिप्त, स्वाभाविक और निर्देशात्मक है।
- source_word: הַמַּחֲנוֹת
  choice: दल
  rationale: बहुवचन संज्ञा यहाँ इस्राएल की व्यवस्थित छावनी के समूहों को दर्शाती है। हिन्दी में ‘दल’ चलने वाले इन शिविर-समूहों के लिए सहज है और वचन का भाव क्रिया से स्पष्ट रहता है।
- source_word: הַחֹנִים
  choice: डेरा डाले हुए
  rationale: कर्तृवाचक कृदन्त संबंधित दलों की वर्तमान शिविर-स्थिति बताता है; ‘डेरा डाले हुए’ इस स्थितिवाचक अर्थ को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: קֵדְמָה
  choice: पूरब की ओर
  rationale: यह रूप पूर्व दिशा को सूचित करता है। प्रसंग में इसका आशय छावनी की पूर्वी ओर स्थित दलों से है; ‘पूरब की ओर’ मूल की दिशात्मक अभिव्यक्ति को अनावश्यक रूप से अधिक निश्चित किए बिना रखता है।
