source:
  edition: WLC
  text: וַ/עֲנַ֧ן יְהוָ֛ה עֲלֵי/הֶ֖ם יוֹמָ֑ם בְּ/נָסְעָ֖/ם מִן הַֽ/מַּחֲנֶֽה־׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/034.yaml
  text: And the cloud of Yahweh was over them by day when they set out from the camp[a].
translation:
  language: hi
  text: और दिन में, जब वे छावनी से कूच करते थे, याहवे का बादल उनके ऊपर[a] रहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर।”
    reason: ‘ऊपर’ के लिए इब्रानी עַל का निकट स्थान-संबंधी विकल्प।
lexical_decisions:
- source_word: וַעֲנַן
  choice: और ... बादल
  rationale: עָנָן का अर्थ ‘बादल’ है; आरंभिक וַ पूर्ववर्ती वृत्तांत से संबंध बनाए रखने के लिए ‘और’ के रूप में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं।
- source_word: עֲלֵיהֶם
  choice: उनके ऊपर रहता था
  rationale: עַל यहाँ स्थान-संबंधी अर्थ ‘ऊपर’ देता है। इब्रानी में स्पष्ट क्रिया नहीं है; हिन्दी में स्वाभाविक वाक्य के लिए ‘रहता था’ जोड़ा गया है।
- source_word: יוֹמָם
  choice: दिन के समय
  rationale: यह क्रियाविशेषण ‘दिन में/दिन के समय’ का अर्थ देता है; चुना हुआ रूप आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּנָסְעָם
  choice: जब वे ... कूच करते थे
  rationale: נסע का यह रूप छावनी उखाड़कर आगे प्रस्थान करने को सूचित करता है; ‘कूच करते थे’ उस विशिष्ट गतिविधि को संक्षेप में व्यक्त करता है।
- source_word: מִן הַמַּחֲנֶה
  choice: छावनी से
  rationale: מַחֲנֶה इस प्रसंग में इस्राएल की छावनी है; हिन्दी में परसर्ग के साथ निश्चितता संदर्भ से स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: बादल की स्थिति का अर्थ
  choice: उनके ऊपर
  alternative: उन पर
  rationale: עַל दोनों प्रकार से व्यक्त हो सकता है। ‘ऊपर’ स्थान-संबंधी भाव को स्पष्ट रखता है और किसी अतिरिक्त धार्मिक अर्थ को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पदक्रम को स्वाभाविक हिन्दी के अनुरूप बदला गया है, जबकि समय, प्रस्थान और बादल की स्थिति संबंधी सभी मूल सूचनाएँ सुरक्षित हैं।
