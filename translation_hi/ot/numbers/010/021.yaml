  text: וְ/נָסְעוּ֙ הַ/קְּהָתִ֔ים נֹשְׂאֵ֖י הַ/מִּקְדָּ֑שׁ וְ/הֵקִ֥ימוּ אֶת הַ/מִּשְׁכָּ֖ן עַד בֹּאָֽ/ם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/021.yaml
  text: Then the Kohathites set out[a], carrying the holy things, and the tabernacle was set up before they arrived.
translation:
  language: hi
  text: फिर कहाती पवित्र वस्तुएँ ले जाते हुए आगे बढ़े[a], और उनके पहुँचने से पहले निवास-तम्बू खड़ा कर दिया गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “पवित्रस्थान को उठानेवाले” या “पवित्रस्थान के वाहक।” यहाँ यह पद उन पवित्र वस्तुओं और साज-सामग्री को दर्शाता है जिन्हें कहाती ले जाते थे; अगले उपवाक्य में निवास-तम्बू की संरचना अलग से उल्लिखित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסְעוּ
  choice: फिर ... आगे बढ़े
  rationale: क्रिया यात्रा-वृत्तांत में अगले दल के प्रस्थान को बताती है; ‘आगे बढ़े’ शिविर से कूच करने के प्रसंग में स्वाभाविक है और वाव का क्रमिक भाव ‘फिर’ से व्यक्त होता है।
- source_word: הַקְּהָתִים
  choice: कहाती
  rationale: यह कहात से निकले लेवीय कुल के सदस्यों का जातिवाचक बहुवचन नाम है; हिन्दी बाइबलीय नाम-रूप में ‘कहाती’ संक्षिप्त और स्पष्ट है।
- source_word: נֹשְׂאֵי הַמִּקְדָּשׁ
  choice: पवित्र वस्तुओं को उठाए हुए
  rationale: शाब्दिक अर्थ ‘पवित्रस्थान को उठानेवाले’ हो सकता है, पर प्रसंग में कहाती पवित्रस्थान की संरचना नहीं, उसकी पवित्र साज-सामग्री ढोते थे। यह अनुवाद उस आशय को स्पष्ट रखते हुए उठाकर ले जाने का भाव भी बनाए रखता है।
- source_word: הַמִּקְדָּשׁ
  choice: पवित्र वस्तुएँ
  rationale: यहाँ शब्द पवित्रस्थान से संबंधित पवित्र सामग्री के लिए लक्षणा के रूप में प्रयुक्त है, क्योंकि अगली उपवाक्य में निवास-तम्बू की संरचना अलग से आती है।
- source_word: וְהֵקִימוּ אֶת־הַמִּשְׁכָּן
  choice: निवास-तम्बू खड़ा कर दिया गया
  rationale: इब्रानी क्रिया कर्तृवाच्य बहुवचन है, पर उसका कर्ता व्यक्त नहीं है। प्रसंगानुसार आगे जा चुके लेवी उसे खड़ा करते थे, न कि उस समय पहुँच रहे कहाती। हिन्दी कर्मवाच्य अनिर्दिष्ट कर्ता को सुरक्षित रखता और गलत कर्तृत्व से बचाता है।
- source_word: הַמִּשְׁכָּן
  choice: निवास-तम्बू
  rationale: מִשְׁכָּן का मूल भाव ‘निवास’ है और जंगल के इस प्रसंग में वह पवित्र तम्बू को दर्शाता है; संयुक्त पद सामान्य पाठक के लिए अर्थ और वस्तु दोनों स्पष्ट करता है।
- source_word: עַד בֹּאָם
  choice: उनके पहुँचने से पहले
  rationale: भाव यह है कि कहातियों के पवित्र वस्तुओं सहित पहुँचने तक निवास-तम्बू तैयार हो जाता था; हिन्दी में ‘पहुँचने से पहले’ इस समय-संबंध को सहजता से व्यक्त करता है।
theological_decisions:
- issue: निवास-तम्बू खड़ा करनेवाले कर्ता की पहचान
  choice: अनिर्दिष्ट कर्ता को कर्मवाच्य में रखा गया
  alternative: ‘उन्होंने निवास-तम्बू खड़ा किया’
  rationale: इब्रानी में क्रिया का कर्ता स्पष्ट संज्ञा से नहीं दिया गया। निकटतम बहुवचन ‘कहाती’ को कर्ता मानने से वही लोग अपने पहुँचने से पहले तम्बू खड़ा करते दिखाई देंगे, जो प्रसंगगत असंगति उत्पन्न करता है। कर्मवाच्य मूल की कर्ता-अस्पष्टता और व्यापक यात्रा-क्रम दोनों को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी रखी गई है। ‘पवित्र वस्तुएँ’ प्रसंगगत लक्षणा को स्पष्ट करती हैं, जबकि पादटिप्पणी अधिक शाब्दिक रूप सुरक्षित रखती है। ‘निवास-तम्बू’ पारंपरिक धार्मिक संदर्भ और מִשְׁכָּן के मूल ‘निवास’ भाव के बीच संतुलन रखता है।
