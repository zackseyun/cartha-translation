- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल पारिवारिक अभिव्यक्ति ‘इस्राएल के पुत्र’ को बनाए रखा गया है; ‘इस्राएली’ अधिक मुहावरेदार विकल्प है, पर वह मूल रूपक को सामान्य जातिनाम बना देता है।
- source_word: לְצִבְאֹתָם
  choice: दल के अनुसार
  rationale: צבאות यहाँ युद्ध करने की क्रिया से अधिक, यात्रा के लिए व्यवस्थित समूहों को सूचित करता है। ‘दल’ सैन्य-संगठन का संकेत रखता है और अनावश्यक रूप से सक्रिय युद्ध का अर्थ नहीं देता।
- source_word: וַיִּסָּעוּ
  choice: और वे आगे बढ़े
  rationale: נסע का कथात्मक रूप पड़ाव से चल पड़ने को बताता है। ‘आगे बढ़े’ स्वाभाविक हिंदी है और संदर्भ में कूच आरंभ करने का अर्थ देता है।
