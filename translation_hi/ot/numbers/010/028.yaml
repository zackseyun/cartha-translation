  rationale: बहुवचन संकेतवाचक शब्द यहाँ पिछली यात्रा-व्यवस्था का सार प्रस्तुत करता है। इब्रानी में स्पष्ट संयोजक क्रिया नहीं है, पर हिंदी कथात्मक संदर्भ में ‘थे’ स्वाभाविक है।
- source_word: מַסְעֵי
