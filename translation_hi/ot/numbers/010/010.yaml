base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/010.yaml
  text: And on the day of your gladness[a], and at your appointed times, and at the beginnings of your months, you shall blow the trumpets over your burnt offerings and over the sacrifices of your peace offerings, and they shall be for you as a memorial before your God[b]. I am Yahweh your God.
translation:
  language: hi
  text: और अपनी प्रसन्नता के दिन, अपने नियत समयों पर और हर महीने के आरम्भ में[a], तुम अपनी होमबलियों और अपनी मेलबलियों[b] के ऊपर तुरहियाँ फूँको। वे तुम्हारे परमेश्वर के सामने तुम्हारे लिए स्मरण-चिह्न होंगी। मैं याहवे तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नए चाँद के दिनों में।’ इब्रानी में शाब्दिक रूप से ‘तुम्हारे महीनों के आरम्भ में।’
    reason: lexical_alternative
  - marker: b
    text: या ‘शान्ति-बलियाँ’ अथवा ‘सहभागिता-बलियाँ।’
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׂמְחַתְכֶם
  choice: अपनी प्रसन्नता
  rationale: संज्ञा आनन्द या प्रसन्नता को व्यक्त करती है। ‘प्रसन्नता’ आधुनिक हिन्दी में स्वाभाविक है और ‘अपनी प्रसन्नता के दिन’ मूल की सूची-संरचना को बनाए रखता है।
- source_word: מוֹעֲדֵיכֶם
  choice: अपने नियत समयों
  rationale: यह शब्द ठहराए हुए समय, सभा या पर्व का बोध करा सकता है। ‘नियत समय’ धार्मिक पर्वों के सन्दर्भ को समेटते हुए इसकी व्यापकता को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: רָאשֵׁי חָדְשֵׁיכֶם
  choice: अपने महीनों के आरम्भ
  rationale: मूल अभिव्यक्ति शाब्दिक रूप से ‘तुम्हारे महीनों के सिर/आरम्भ’ है। यह अनुवाद उसके पंचांगीय अर्थ को स्पष्ट रखता है; सन्दर्भतः इससे अमावस्या अथवा नए चाँद का दिन अभिप्रेत है।
- source_word: וּתְקַעְתֶּם
  choice: तुम ... तुरहियाँ फूँकना
  rationale: तुरहियों के साथ यह क्रिया उन्हें फूँकने या बजाने के अर्थ में है। आज्ञार्थक हिन्दी संरचना प्रसंग के निर्देशात्मक बल को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: חֲצֹצְרֹת
  choice: तुरहियाँ
  rationale: यह अध्याय में पहले बताई गई धार्मिक उपयोग की तुरहियों को दर्शाता है। यहाँ ‘चाँदी की’ मूल पद में दोहराया नहीं गया, इसलिए उसे पाठ में नहीं जोड़ा गया।
- source_word: עַל עֹלֹתֵיכֶם
  choice: अपनी होमबलियों ... के ऊपर
  rationale: עַל का मूल स्थानिक/सहचारी भाव ‘ऊपर’ से सुरक्षित रहता है और बलि चढ़ाते समय उसके ऊपर तुरही फूँकने का अनुष्ठानिक चित्र बना रहता है।
- source_word: זִבְחֵי שַׁלְמֵיכֶם
  choice: अपनी मेलबलियों
  rationale: זֶבַח שְׁלָמִים बलियों की उस श्रेणी का नाम है जिसका सम्बन्ध शान्ति, कुशल और सहभागिता से है। ‘मेलबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और समझने योग्य पारिभाषिक पद है।
- source_word: וְהָיוּ לָכֶם לְזִכָּרוֹן
  choice: वे ... तुम्हारे लिए स्मरण-चिह्न होंगी
  rationale: स्त्रीलिंग बहुवचन क्रिया सबसे स्वाभाविक रूप से तुरहियों की ओर लौटती है। ‘स्मरण-चिह्न’ परमेश्वर के सामने स्मरण कराने के धार्मिक आशय को बनाए रखता है, बिना यह तय किए कि स्मरण का प्रभाव केवल आराधकों पर है।
- source_word: לִפְנֵי אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर के सामने
  rationale: यह לִפְנֵי के ‘सामने/उपस्थिति में’ अर्थ का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यन्तरण ‘याहवे’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना सामने रखता है; ‘यहोवा’ एक वैकल्पिक पारम्परिक उच्चारण है।
- issue: שְׁלָמִים बलि-पद का अनुवाद
  choice: मेलबलियाँ
  alternative: शान्ति-बलियाँ; सहभागिता-बलियाँ
  rationale: इब्रानी पद में शान्ति/सम्पूर्ण कुशल और साझा भोज से जुड़ी सहभागिता—दोनों भाव सम्भव हैं। मुख्य पाठ में परिचित हिन्दी पद ‘मेलबलि’ रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में बताया गया है।
- issue: לְזִכָּרוֹן में स्मरण का धार्मिक आशय
  choice: परमेश्वर के सामने ... स्मरण-चिह्न
  alternative: परमेश्वर की उपस्थिति में तुम्हें स्मरण दिलानेवाली
  rationale: मूल वाक्य यह स्पष्ट नहीं करता कि स्मरण मुख्यतः परमेश्वर के समक्ष लोगों को स्मरण में लाने वाला है या उपासकों को स्मरण दिलाने वाला। ‘परमेश्वर के सामने ... स्मरण-चिह्न’ इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण धार्मिक शैली अपनाई गई है। सूची की इब्रानी समानान्तर संरचना सुरक्षित रखी गई है। ‘नियत समय’ मूल की व्यापकता बनाए रखता है, जबकि ‘होमबलि’, ‘मेलबलि’ और ‘स्मरण-चिह्न’ सन्दर्भानुकूल पारिभाषिक शब्द हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में सम्बद्ध पदों के तुरन्त बाद रखे गए हैं।
