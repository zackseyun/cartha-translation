language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָסַ֗ע דֶּ֚גֶל מַחֲנֵ֣ה בְנֵי דָ֔ן מְאַסֵּ֥ף לְ/כָל הַֽ/מַּחֲנֹ֖ת לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֲחִיעֶ֖זֶר בֶּן עַמִּישַׁדָּֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/025.yaml
  text: Then the banner of the camp of the sons of Dan set out[a], serving as the rear guard for all the camps by their divisions[c][b]; and over its company was Ahiezer the son of Ammishaddai.
translation:
  language: hi
  text: तब दान के वंशजों की छावनी का झंडा रवाना हुआ, जो सभी छावनियों के लिए, उनके दलों के अनुसार, पिछला रक्षक था[a]। और उसके दल का नेता अम्मीशद्दै का पुत्र अहीएजेर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह सभी छावनियों के सबसे पीछे चलता था।”
    reason: מְאַסֵּף के ‘पिछला रक्षक’ संबंधी अर्थ के साथ उसका अधिक शाब्दिक, स्थान-सूचक अनुवाद भी संभव है।
lexical_decisions:
- source_word: וְנָסַע
  choice: तब ... रवाना हुआ
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; यात्रा के प्रसंग में ‘रवाना हुआ’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: דֶּגֶל מַחֲנֵה
  choice: छावनी-दल का झंडा
  rationale: דֶּגֶל किसी गोत्रीय छावनी-दल की पहचान और उसके साथ चलने वाले झंडे को दर्शाता है; ‘झंडा’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: בְנֵי דָן
  choice: दान के वंशजों
  rationale: गोत्रीय सूत्र में בני दान की संतति अर्थात दानियों को सामूहिक रूप से सूचित करता है; ‘वंशजों’ इस आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: מְאַסֵּף לְכָל הַמַּחֲנֹת
  choice: सभी छावनियों के पीछे का रक्षक
  rationale: यात्रा-क्रम में यह पद सबसे पीछे चलकर पूरे समुदाय की पिछली ओर सुरक्षा करने वाले दल की भूमिका बताता है।
- source_word: לְצִבְאֹתָם
  choice: अपने दलों के अनुसार चलने वाली
  rationale: צְבָאוֹת यहाँ युद्धरत सेनाओं से अधिक व्यवस्थित गोत्रीय टुकड़ियों अथवा दलों को दर्शाता है।
- source_word: וְעַל צְבָאוֹ
  choice: उसके सैन्य-दल का अगुआ
  rationale: עַל किसी दल पर नियुक्त व्यक्ति को सूचित करता है; स्पष्ट हिन्दी के लिए निहित नेतृत्व-संबंध को ‘अगुआ’ से व्यक्त किया गया है।
- source_word: אֲחִיעֶזֶר בֶּן עַמִּישַׁדָּי
  choice: अम्मीशद्दै का पुत्र अहीएजेर
  rationale: व्यक्तिनामों का हिन्दी लिप्यंतरण किया गया और इब्रानी पितृनाम-सूत्र को सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘छावनी-दल’, ‘पीछे का रक्षक’ और ‘सैन्य-दल का अगुआ’ यात्रा की संगठित व्यवस्था को स्पष्ट करते हैं, बिना צבא को हर स्थान पर संकीर्ण अर्थ में ‘सेना’ बनाने के।
