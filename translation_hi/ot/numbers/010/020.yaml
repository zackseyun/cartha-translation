  yaml_path: translation/ot/numbers/010/020.yaml
  text: And over the company of the tribe of the sons of Gad was Eliasaph son of Deuel[a].
translation:
  language: hi
  text: और गाद के वंशजों के गोत्रीय दल का प्रधान देऊएल का पुत्र एल्यासाफ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “दल” के स्थान पर “सेना” या “टुकड़ी” भी हो सकता है; इब्रानी शब्द צְבָא में प्रायः सैनिक भाव होता है, पर यहाँ यह क्रमबद्ध रूप से कूच करने वाले गोत्रीय समूह को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/עַל
  choice: और … का प्रधान
  rationale: यह पद पिछले नेतृत्व-विवरण से जुड़ा है; עַל का पर्यवेक्षण या नेतृत्व का भाव स्वाभाविक हिन्दी में ‘का प्रधान’ से व्यक्त किया गया है।
- source_word: צְבָא
  choice: दल
  rationale: यहाँ शब्द इस्राएल के क्रमबद्ध रूप से कूच करने वाले गोत्रीय समूह को दर्शाता है। ‘दल’ संगठन का भाव रखता है और अनावश्यक रूप से केवल सैन्य अर्थ तक सीमित नहीं करता।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: इस प्रसंग में מַטֶּה का अर्थ छड़ी नहीं, बल्कि गोत्रीय इकाई है।
- source_word: בְנֵי גָד
  choice: गाद के वंशज
  rationale: शाब्दिक अर्थ ‘गाद के पुत्र’ है, पर आधुनिक हिन्दी में जनजातीय समुदाय के लिए ‘वंशज’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: אֶלְיָסָף
  choice: एल्यासाप
  rationale: इब्रानी नाम का देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: בֶּן דְּעוּאֵל
  choice: दऊएल का पुत्र
  rationale: इब्रानी वंशसूचक संरचना को सीधे और स्वाभाविक हिन्दी में रखा गया है।
