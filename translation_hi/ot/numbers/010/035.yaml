source:
  edition: WLC
  text: וַ/יְהִ֛י בִּ/נְסֹ֥עַ הָ/אָרֹ֖ן וַ/יֹּ֣אמֶר מֹשֶׁ֑ה קוּמָ֣/ה יְהוָ֗ה וְ/יָפֻ֨צוּ֙ אֹֽיְבֶ֔י/ךָ וְ/יָנֻ֥סוּ מְשַׂנְאֶ֖י/ךָ מִ/פָּנֶֽי/ךָ׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/035.yaml
  text: And whenever the ark set out[a], Moses said, “Rise up, O Yahweh, and let your enemies be scattered[b], and let those who hate you flee before you.”
translation:
  language: hi
  text: 'जब-जब संदूक आगे बढ़ता था[a], मूसा कहता था,


    “हे याहवे, उठ[b]!


    तेरे शत्रु तितर-बितर हो जाएँ,


    और तुझसे बैर रखनेवाले तेरे सामने से भाग जाएँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक अनुवाद: “और ऐसा हुआ कि जब संदूक आगे बढ़ता था।” यहाँ इब्रानी मुहावरे का आशय संभवतः बार-बार होने वाली घटना, अर्थात् “जब-जब संदूक आगे बढ़ता था,” है।'
    reason: lexical_alternative
  - marker: b
    text: “उठ” परमेश्वर से सामर्थ्यपूर्वक कार्य करने की विनती है; इसका अर्थ यह नहीं कि परमेश्वर सचमुच निष्क्रिय था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְהִי בִּנְסֹעַ
  choice: जब-जब ... चल पड़ता था
  rationale: यहाँ यह इब्रानी रचना बार-बार होने वाली परिस्थिति का परिचय देती है। ‘जब-जब’ उसके आवर्ती भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הָאָרֹן
  choice: संदूक
  rationale: मूल पाठ में केवल ‘संदूक’ है; ‘वाचा का संदूक’ जोड़ने से ऐसी जानकारी आ जाती जो इस पद में स्पष्ट रूप से नहीं है।
- source_word: קוּמָה
  choice: उठ
  rationale: याहवे को संबोधित यह आज्ञार्थक रूप सामर्थ्य के साथ कार्य करने की पुकार है। ‘उठ’ मूल के सजीव रूपक को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְיָפֻצוּ
  choice: तितर-बितर हो जाएँ
  rationale: आज्ञार्थक क्रिया के बाद आया यह अपूर्ण रूप इच्छार्थक/प्रार्थनात्मक भाव रखता है। ‘हो जाएँ’ उस भाव को स्पष्ट करता है।
- source_word: אֹיְבֶיךָ
  choice: तेरे शत्रु
  rationale: यह द्वितीय पुरुष एकवचन प्रत्यय सहित बहुवचन संज्ञा का सीधा और स्वाभाविक अनुवाद है।
- source_word: וְיָנֻסוּ
  choice: भाग जाएँ
  rationale: यह भी समानांतर इच्छार्थक प्रार्थना है; ‘भाग जाएँ’ उसके भाव और काव्यात्मक समानता को बनाए रखता है।
- source_word: מְשַׂנְאֶיךָ
  choice: तुझसे बैर रखनेवाले
  rationale: प्रतिभागी रूप लगातार विरोधी रुख को दर्शाता है। यह अनुवाद व्यक्तिगत शत्रुता का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: מִפָּנֶיךָ
  choice: तेरे सामने से
  rationale: इस युद्ध-संबंधी प्रार्थना में यह वाक्यांश याहवे की उपस्थिति के सामने से पीछे हटने या भागने का भाव देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण उच्चारण के निकट देवनागरी में प्रस्तुत करता है।
- issue: ‘उठ’ का आशय
  choice: परमेश्वर से सामर्थ्यपूर्वक कार्य करने की विनती
  alternative: परमेश्वर के शाब्दिक रूप से बैठे या निष्क्रिय होने का संकेत
  rationale: यह सैन्य-प्रार्थना की रूपकात्मक भाषा है। अनुवाद रूपक को बनाए रखता है और टिप्पणी उसका आशय स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कविता-सदृश समानांतर पंक्तियाँ सुरक्षित हैं। परमेश्वर को संबोधित मूल एकवचन रूप के अनुरूप ‘तेरे/तुझसे’ रखा गया है; इसे अनादर के बजाय निकट और प्रत्यक्ष प्रार्थना के रूप में समझा जाना चाहिए।
