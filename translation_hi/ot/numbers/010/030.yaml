  yaml_path: translation/ot/numbers/010/030.yaml
  text: But he said to him, “I will not go. Rather, I will go to my own land and to my own kindred.”
translation:
  language: hi
  text: पर उसने उससे कहा, “मैं नहीं जाऊँगा। बल्कि मैं अपने देश और अपने कुटुम्ब के पास जाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מוֹלַדְתִּי
  choice: अपने कुटुम्ब
  rationale: यह शब्द जन्म-सम्बन्धी समुदाय, रिश्तेदारी या कुल को सूचित करता है; संदर्भ में ‘कुटुम्ब’ स्वाभाविक है और केवल जन्मस्थान तक अर्थ को सीमित नहीं करता।
- source_word: כִּי אִם
  choice: बल्कि
  rationale: 'पूर्ववर्ती निषेध के बाद आने वाला यह संयोजन विरोधात्मक सुधार व्यक्त करता है: ‘नहीं... बल्कि...’।'
- source_word: אַרְצִי
  choice: अपने देश
  rationale: प्रथम पुरुष स्वामित्व के साथ ‘मेरे देश’ का अर्थ है; हिन्दी प्रत्यक्ष कथन में ‘अपने देश’ अधिक स्वाभाविक है।
