    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... का प्रधान
  rationale: शिविर और कूच की क्रमसूची में यह पदबंध उस व्यक्ति को प्रस्तुत करता है जो संबंधित गोत्रीय दल के ऊपर नियुक्त था। हिंदी में ‘का प्रधान’ इस संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: צְבָא
  choice: टुकड़ी
  rationale: यहाँ शब्द से कूच के लिए व्यवस्थित गोत्रीय दल अभिप्रेत है; ‘टुकड़ी’ सैन्य-संगठन का भाव रखती है, पर अनिवार्य रूप से युद्धरत सेना तक अर्थ को सीमित नहीं करती।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: गिनती की पुस्तक के इस प्रसंग में शब्द इस्राएल की गोत्रीय इकाई को सूचित करता है।
- source_word: בְּנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों
  rationale: शाब्दिक अर्थ ‘मनश्शे के पुत्र’ है, किंतु यहाँ पूरी वंशगत गोत्रीय इकाई अभिप्रेत है; आधुनिक हिंदी में ‘वंशजों’ अधिक स्वाभाविक और अर्थ-सटीक है।
- source_word: גַּמְלִיאֵל
  choice: गमलीएल
  rationale: हिब्रू व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: वंश-संबंध बताने वाला सामान्य हिब्रू पद; हिंदी वाक्यक्रम में स्वाभाविक रूप से ‘पदाहसूर का पुत्र’ किया गया है।
- source_word: פְּדָה צוּר
  choice: पदाहसूर
  rationale: मसोरेटी पाठ में अलग दिखाई देने वाले तत्व एक ही व्यक्तिगत नाम बनाते हैं; इसलिए इसे एक नाम के रूप में लिप्यंतरित किया गया है।
