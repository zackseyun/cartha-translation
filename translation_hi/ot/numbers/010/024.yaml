  yaml_path: translation/ot/numbers/010/024.yaml
  text: And over the company of the tribe of the sons of Benjamin was Abidan son of Gideoni[a].
translation:
  language: hi
  text: और बिन्यामीन के वंशजों के गोत्र के दल[a] का प्रधान गिदोनी का पुत्र अबीदान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेना” अथवा “टुकड़ी”; इब्रानी शब्द किसी संगठित सैन्य-शैली के दल को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַל
  choice: और ... का प्रधान
  rationale: संयोजक पिछले पदों की यात्रा-व्यवस्था की सूची को आगे बढ़ाता है। ‘का प्रधान’ प्रसंग में עַל के अधीन नेतृत्व या अधिकार के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צְבָא
  choice: दल
  rationale: यहाँ शब्द केवल युद्धरत सेना नहीं, बल्कि यात्रा के लिए व्यवस्थित कबीलाई समूह को दर्शाता है। ‘दल’ इस संगठित इकाई के अर्थ को सहज और संक्षिप्त रूप में रखता है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: इस जनगणना और यात्रा-व्यवस्था के प्रसंग में शब्द का अर्थ छड़ी नहीं, इस्राएल की एक गोत्रीय इकाई है।
- source_word: בְּנֵי בִנְיָמִן
  choice: बिन्यामीन के वंशजों
  rationale: यह हिन्दी में स्वाभाविक रहते हुए इब्रानी पदबंध के वंशगत और गोत्रीय भाव को सुरक्षित रखता है।
- source_word: אֲבִידָן
  choice: अबीदान
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן גִּדְעוֹנִי
  choice: गिदोनी का पुत्र
  rationale: वंशपरिचय देने वाले इब्रानी पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप।
