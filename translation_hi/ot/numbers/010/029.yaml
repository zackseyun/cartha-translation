source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר מֹשֶׁ֗ה לְ֠/חֹבָב בֶּן רְעוּאֵ֣ל הַ/מִּדְיָנִי֮ חֹתֵ֣ן מֹשֶׁה֒ נֹסְעִ֣ים אֲנַ֗חְנוּ אֶל הַ/מָּקוֹם֙ אֲשֶׁ֣ר אָמַ֣ר יְהוָ֔ה אֹת֖/וֹ אֶתֵּ֣ן לָ/כֶ֑ם לְכָ֤/ה אִתָּ֨/נוּ֙ וְ/הֵטַ֣בְנוּ לָ֔/ךְ כִּֽי יְהוָ֥ה דִּבֶּר ט֖וֹב עַל יִשְׂרָאֵֽל־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/029.yaml
  text: And Moses said to Hobab son of Reuel the Midianite[a], Moses’ father-in-law, “We are setting out for the place of which Yahweh said, ‘I will give it to you.’ Come with us, and we will do you good, for Yahweh has spoken good concerning Israel.”
translation:
  language: hi
  text: मूसा ने मिद्यानी रूएल के पुत्र होबाब[a], जो मूसा का ससुर था, से कहा, “हम उस स्थान की ओर चल पड़ रहे हैं जिसके बारे में याहवे ने कहा था, ‘मैं उसे तुम लोगों को दूँगा।’ हमारे साथ चलो, और हम तुम्हारा भला करेंगे, क्योंकि याहवे ने इस्राएल के लिए भलाई की बात कही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द חֹתֵן व्यापक अर्थ में विवाह के द्वारा बने किसी संबंधी को भी सूचित कर सकता है; इसलिए कुछ लोग यहाँ “मूसा का साला” या “मूसा का विवाह-संबंधी” समझते हैं, न कि “ससुर।”
    reason: शब्द की अर्थ-सीमा और होबाब के ठीक वैवाहिक संबंध से जुड़ी वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: חֹבָב
  choice: होबाब
  rationale: व्यक्तिवाचक नाम का प्रचलित ध्वन्यात्मक लिप्यंतरण।
- source_word: רְעוּאֵל
  choice: रूएल
  rationale: इब्रानी व्यक्तिवाचक नाम का स्वाभाविक हिन्दी लिप्यंतरण।
- source_word: הַמִּדְיָנִי
  choice: मिद्यानी
  rationale: सजातीय विशेषण को पहचानसूचक रूप में रखा गया है।
- source_word: חֹתֵן מֹשֶׁה
  choice: मूसा का ससुर
  rationale: חֹתֵן का सामान्य और प्रसंगानुकूल अर्थ ‘ससुर’ है; व्यापक वैवाहिक संबंध का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: נֹסְעִים אֲנַחְנוּ
  choice: हम ... चल पड़ रहे हैं
  rationale: कृदंत और सर्वनाम निकट भविष्य में आरम्भ हो रही यात्रा को व्यक्त करते हैं; यह हिन्दी में स्वाभाविक है।
- source_word: אֲשֶׁר אָמַר יְהוָה אֹתוֹ אֶתֵּן לָכֶם
  choice: जिसके विषय में यहोवा ने कहा था, ‘मैं उसे तुम लोगों को दूँगा’
  rationale: संबंधवाचक रचना और प्रत्यक्ष प्रतिज्ञा सुरक्षित हैं; ‘तुम लोगों’ से इब्रानी बहुवचन स्पष्ट होता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ रूप में लिप्यंतरित किया गया है, न कि किसी उपाधि से बदला गया है।
- source_word: לְכָה אִתָּנוּ
  choice: हमारे साथ चलो
  rationale: आमंत्रण का स्वाभाविक हिन्दी रूप, जो यात्रा के प्रसंग के अनुकूल है।
- source_word: וְהֵטַבְנוּ לָךְ
  choice: हम तुम्हारा भला करेंगे
  rationale: हितकारी कार्य करने के हिफ़ील अर्थ को सीधे और मुहावरेदार ढंग से व्यक्त करता है।
- source_word: דִּבֶּר טוֹב עַל יִשְׂרָאֵל
  choice: इस्राएल के लिए भलाई की बात कही है
  rationale: ‘कहा/बोला’ और ‘भलाई’ दोनों मूल शब्दों को बनाए रखता है; עַל को यहाँ हितसूचक ‘के लिए’ समझना प्रसंगानुकूल है, बिना इसे स्पष्टतः ‘प्रतिज्ञा’ में बदलने के।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों में स्थापित ‘यहोवा’ रूप नाम को उपाधि से प्रतिस्थापित किए बिना पहचानने योग्य रखता है।
- issue: חֹתֵן द्वारा व्यक्त वैवाहिक संबंध
  choice: ससुर
  alternative: विवाह-संबंधी अथवा साला
  rationale: मुख्य पाठ में सामान्य कोशगत अर्थ रखा गया है, जबकि शब्द की व्यापक अर्थ-सीमा और वंश-संबंधी अस्पष्टता पादटिप्पणी में स्पष्ट की गई है।
- issue: דִּבֶּר טוֹב עַל יִשְׂרָאֵל का आशय
  choice: इस्राएल के लिए भलाई की बात कही है
  alternative: इस्राएल से भलाई की प्रतिज्ञा की है
  rationale: ‘प्रतिज्ञा’ प्रसंग में संभव है, पर मूल क्रिया केवल ‘कहा/बोला’ है; चुना हुआ पाठ मूल की अभिव्यक्ति और उसके खुलेपन को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य-विन्यास मूल के निकट है, पर हिन्दी की स्वाभाविकता के लिए ‘से कहा’ और ‘की ओर चल पड़ रहे हैं’ जैसे रूप अपनाए गए हैं।
