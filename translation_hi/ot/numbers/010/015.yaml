  yaml_path: translation/ot/numbers/010/015.yaml
  text: And over the company of the tribe of the sons of Issachar was Nethanel the son of Zuar[a].
translation:
  language: hi
  text: और इस्साकार के वंशजों के गोत्रीय दल पर सूआर का पुत्र नतनेल नियुक्त था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: और ... का प्रधान
  rationale: संयोजक वाव इस पद को पिछली सूची से जोड़ता है, जबकि עַל यहाँ दल पर नियुक्त नेतृत्व को व्यक्त करता है। स्वाभाविक हिन्दी में इसे ‘का प्रधान’ से स्पष्ट किया गया है।
- source_word: צְבָא
  choice: दल
  rationale: इस प्रसंग में यह यात्रा-क्रम में संगठित जनसमूह है। ‘दल’ संगठन और क्रम का भाव रखता है, पर अनावश्यक रूप से इसे केवल सैन्य सेना नहीं बनाता।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: यहाँ शब्द का अर्थ छड़ी नहीं, इस्राएल की गोत्रीय इकाई है; हिन्दी बाइबलीय प्रयोग में ‘गोत्र’ सटीक और परिचित है।
- source_word: בְּנֵי יִשָׂשכָר
  choice: इस्साकार के वंशजों
  rationale: शाब्दिक अर्थ ‘इस्साकार के पुत्र’ है, पर गोत्रीय संदर्भ में ‘वंशजों’ आधुनिक हिन्दी में अभिप्रेत सामूहिक वंश-संबंध को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְתַנְאֵל
  choice: नतनेल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בֶּן צוּעָר
  choice: सूआर का पुत्र
  rationale: हिब्रू की पितृनामसूचक रचना को सीधे और स्वाभाविक हिन्दी में रखा गया है।
theological_decisions: []
