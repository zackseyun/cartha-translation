  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद की सूचीपरक संरचना बनाए रखते हुए हिन्दी में आवश्यक विधेय ‘प्रधान था’ लगाया गया है; पूर्ववर्ती प्रसंग से पदाधिकारी का आशय स्पष्ट होता है।
