  text: וְ/כִֽי תָבֹ֨אוּ מִלְחָמָ֜ה בְּ/אַרְצְ/כֶ֗ם עַל הַ/צַּר֙ הַ/צֹּרֵ֣ר אֶתְ/כֶ֔ם וַ/הֲרֵעֹתֶ֖ם בַּ/חֲצֹצְר֑וֹת וֲ/נִזְכַּרְתֶּ֗ם לִ/פְנֵי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם וְ/נוֹשַׁעְתֶּ֖ם מֵ/אֹיְבֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/009.yaml
  text: And when you go to war in your land against the enemy who oppresses you[a], then you shall sound an alarm with the trumpets, and you shall be remembered before Yahweh your God[c][b], and you shall be saved from your enemies.
translation:
  language: hi
  text: और जब तुम अपने देश में उस शत्रु के विरुद्ध युद्ध करने जाओ जो तुम पर अत्याचार करता है[a], तब तुम तुरहियों से चेतावनी का नाद करोगे। तब याहवे, तुम्हारे परमेश्वर, के सामने तुम्हारा स्मरण किया जाएगा[c][b], और तुम अपने शत्रुओं से बचाए जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यदि तुम अपने देश में युद्ध करने जाओ।” हिब्रू संयोजन परिस्थिति या शर्त—दोनों का परिचय दे सकता है।
    reason: alternative_reading
  - marker: b
    text: हिब्रू में ‘YHWH,’ परमेश्वर का दिव्य नाम।
    reason: lexical_alternative
  - marker: c
    text: या, “याहवे, तुम्हारे परमेश्वर, के सामने तुम्हारा स्मरण में लाया जाएगा”; अधिक व्याख्यात्मक रूप में, “याहवे, तुम्हारा परमेश्वर, तुम्हें स्मरण करेगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और जब
  rationale: यह संयोजन विधिक निर्देश में भावी परिस्थिति या शर्त प्रस्तुत कर सकता है। मुख्य पाठ में स्वाभाविक ‘और जब’ रखा गया है और ‘यदि’ को पादटिप्पणी में दिया गया है।
- source_word: תָבֹאוּ מִלְחָמָה
  choice: युद्ध करने जाओ
  rationale: हिब्रू मुहावरे का आशय युद्ध में उतरना या युद्ध करना है; हिंदी में यह रूप स्वाभाविक है।
- source_word: בְּאַרְצְכֶם
  choice: अपने देश में
  rationale: यह इस्राएलियों के अपने भूभाग को सूचित करता है। ‘देश’ आधुनिक हिंदी में स्पष्ट है और क्षेत्रीय अर्थ बनाए रखता है।
- source_word: עַל הַצַּר הַצֹּרֵר אֶתְכֶם
  choice: उस शत्रु के विरुद्ध जो तुम्हें सताता है
  rationale: संज्ञा और कृदंत दोनों को रखते हुए शत्रु की सक्रिय शत्रुता और दमन का भाव व्यक्त किया गया है।
- source_word: וַהֲרֵעֹתֶם בַּחֲצֹצְרֹת
  choice: तुरहियों से चेतावनी का नाद करना
  rationale: हिफ़ील क्रिया यहाँ सैन्य संकेत अथवा चेतावनी की विशेष ध्वनि निकालने को बताती है, केवल जोर से फूँकने को नहीं।
- source_word: וֲנִזְכַּרְתֶּם לִפְנֵי יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर यहोवा के सामने तुम्हें स्मरण किया जाएगा
  rationale: निफ़अल की निष्क्रिय अभिव्यक्ति को बनाए रखा गया है ताकि परमेश्वर को स्पष्ट कर्ता बनाकर अर्थ को आवश्यकता से अधिक न खोला जाए।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में दिव्य नाम YHWH का प्रचलित सीधा रूप ‘यहोवा’ है; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְנוֹשַׁעְתֶּם מֵאֹיְבֵיכֶם
  choice: तुम अपने शत्रुओं से बचाए जाओगे
  rationale: निफ़अल का निष्क्रिय रूप तथा सैन्य प्रसंग में उद्धार/छुटकारे का अर्थ दोनों सुरक्षित रहते हैं।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिंदी पाठक के लिए सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; पादटिप्पणी YHWH की पहचान स्पष्ट करती है।
- issue: וֲנִזְכַּרְתֶּם की वाच्यता
  choice: तुम्हें स्मरण किया जाएगा
  alternative: तुम्हारा परमेश्वर यहोवा तुम्हें स्मरण करेगा
  rationale: मुख्य पाठ में हिब्रू निष्क्रिय रचना और उसकी धर्मवैचारिक तनावपूर्ण अभिव्यक्ति को सुरक्षित रखा गया है; अधिक व्याख्यात्मक सक्रिय रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रूप। ‘तुरही’, ‘चेतावनी का नाद’ और निष्क्रिय ‘स्मरण किया जाएगा’ मूल के धार्मिक-सैन्य संदर्भ तथा व्याकरणिक स्वरूप को बनाए रखते हैं।
