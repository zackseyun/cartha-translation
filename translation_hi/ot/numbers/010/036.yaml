source:
  edition: WLC
  text: וּ/בְ/נֻחֹ֖/ה יֹאמַ֑ר שׁוּבָ֣/ה יְהוָ֔ה רִֽבְב֖וֹת אַלְפֵ֥י יִשְׂרָאֵֽל׃׆ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/036.yaml
  text: And when it came to rest[a], he would say, “Return, O Yahweh[b], to the myriads of the thousands of Israel.”
translation:
  language: hi
  text: और जब वह ठहरता था, तब मूसा कहा करता था, “हे याहवे[a], इस्राएल के हज़ारों के दस-दस हज़ारों के पास लौट आओ[b]!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में परमेश्वर का नाम יהוה (याहवे) है; इसे परंपरागत रूप से “यहोवा” भी लिखा जाता है और कई अनुवादों में “प्रभु” कहा जाता है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “इस्राएल के हज़ारों के दस-दस हज़ारों के पास”; यह इस्राएल की बहुत बड़ी संख्या पर बल देने वाली अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֻחֹה
  choice: और जब वह ठहरता था
  rationale: בְּ के साथ נוח का infinitive construct एक कालवाचक उपवाक्य बनाता है। स्त्रीलिंग प्रत्यय का संकेत पूर्वपद वाचा के सन्दूक की ओर है; हिन्दी में ‘सन्दूक’ पुल्लिंग होने के कारण ‘वह ठहरता था’ स्वाभाविक है।
- source_word: יֹאמַר
  choice: मूसा कहा करता था
  rationale: अपूर्ण क्रिया यहाँ बार-बार होने वाली प्रथा को व्यक्त करती है। प्रसंग से कर्ता मूसा है; उसका नाम जोड़ना हिन्दी में अस्पष्टता दूर करता है, जबकि अर्थ नहीं बदलता।
- source_word: שׁוּבָה
  choice: लौट आ
  rationale: שוב का आग्रहपूर्ण आज्ञार्थक रूप परमेश्वर से लौटने की सीधी विनती है। ‘लौट आ’ आधुनिक हिन्दी में स्वाभाविक और निकट संबोधन के अनुकूल है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापरक लिप्यंतरण है और किसी उपाधि से नाम को प्रतिस्थापित नहीं करता।
- source_word: רִבְבוֹת אַלְפֵי יִשְׂרָאֵל
  choice: इस्राएल के असंख्य हज़ारों
  rationale: दो बड़े संख्या-संज्ञाओं की संचित अभिव्यक्ति इस्राएल की विशाल जनसंख्या पर बल देती है। ‘असंख्य हज़ारों’ उस प्रभाव को स्वाभाविक हिन्दी में रखता है, और शाब्दिक बनावट पादटिप्पणी में दी गई है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल पाठ उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम देता है। ‘याहवे’ नाम को प्रत्यक्ष रखता है; पादटिप्पणी पाठकों को इसकी पहचान बताती है।
- issue: שׁוּבָה के साथ परमेश्वर के लौटने की भाषा
  choice: लौट आ
  alternative: फिर निवास कर; उनके बीच लौट आ
  rationale: मूल क्रिया ‘लौटना’ कहती है, पर लौटने का सटीक संबंध स्पष्ट नहीं करती। इसलिए ‘निवास’ या ‘बीच’ जैसी व्याख्यात्मक धारणाएँ मुख्य पाठ में नहीं जोड़ी गईं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और वाचिक है। ‘कहा करता था’ पुनरावृत्त क्रिया को स्पष्ट करता है। संबोधन में ‘हे’ और विनती में ‘लौट आ’ काव्यात्मक गंभीरता रखते हुए सामान्य पाठक के लिए सहज हैं।
