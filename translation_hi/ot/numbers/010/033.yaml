id: NUM.10.33
reference: Numbers 10:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּסְעוּ֙ מֵ/הַ֣ר יְהוָ֔ה דֶּ֖רֶךְ שְׁלֹ֣שֶׁת יָמִ֑ים וַ/אֲר֨וֹן בְּרִית יְהוָ֜ה נֹסֵ֣עַ לִ/פְנֵי/הֶ֗ם דֶּ֚רֶךְ שְׁלֹ֣שֶׁת יָמִ֔ים לָ/ת֥וּר לָ/הֶ֖ם מְנוּחָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/033.yaml
  text: So they set out from the mountain of Yahweh for a journey of three days[a], and the ark of the covenant of Yahweh set out before them for a journey of three days[b], to seek out a resting place for them.
translation:
  language: hi
  text: वे यहवे के पर्वत से तीन दिन की यात्रा पर निकल पड़े[a]। और यहवे की वाचा का संदूक उनके आगे-आगे तीन दिन की यात्रा भर चलता रहा[a], ताकि वह उनके लिए विश्राम की जगह ढूँढ़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, दोनों स्थानों पर: “तीन दिन का मार्ग।”'
    reason: दֶּרֶךְ שְׁלֹשֶׁת יָמִים यात्रा की अवधि मात्र नहीं, बल्कि तीन दिनों में तय होने वाली यात्रा की माप या विस्तार भी सूचित कर सकता है।
  - marker: b
    text: “ढूँढ़े” का अनुवाद “खोजे,” “पड़ताल करे,” या “टोह ले” भी हो सकता है।
    reason: תור में खोजने, पड़ताल करने, या टोह लेने का अर्थ हो सकता है।
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: वे ... निकल पड़े
  rationale: נסע शिविर से कूच करने या यात्रा पर निकलने को दर्शाता है; ‘निकल पड़े’ आधुनिक हिन्दी में स्वाभाविक रूप से इस गतिशील अर्थ को व्यक्त करता है।
- source_word: מֵהַר יְהוָה
  choice: यहवे के पर्वत से
  rationale: הַר का सीधा अर्थ ‘पर्वत’ है और יְהוָה को उसके व्यक्तिगत नाम ‘यहवे’ से व्यक्त किया गया है।
- source_word: דֶּרֶךְ שְׁלֹשֶׁת יָמִים
  choice: तीन दिन की यात्रा
  rationale: यह पदबंध केवल समयावधि नहीं, बल्कि तीन दिनों में तय की जाने वाली यात्रा की सीमा बताता है।
- source_word: וַאֲרוֹן בְּרִית יְהוָה
  choice: यहवे की वाचा का संदूक
  rationale: यह हिन्दी में स्वाभाविक रहते हुए मूल रचना में यहवे, वाचा और संदूक के संबंध को सुरक्षित रखता है।
- source_word: נֹסֵעַ לִפְנֵיהֶם
  choice: उनके आगे-आगे ... चलता रहा
  rationale: कृदंत ongoing attendant action दर्शाता है; ‘चलता रहा’ निरंतर गति और לִפְנֵיהֶם का स्थानिक अर्थ व्यक्त करता है।
- source_word: לָתוּר
  choice: ढूँढ़े
  rationale: תור यहाँ उपयुक्त पड़ाव की खोज या टोह लेने के अर्थ में है; ‘ढूँढ़े’ सैन्य अर्थ आरोपित किए बिना उद्देश्य स्पष्ट करता है।
- source_word: מְנוּחָה
  choice: विश्राम की जगह
  rationale: यात्रा के प्रसंग में यह अमूर्त विश्राम के बजाय ठहरने या डेरा डालने के उपयुक्त स्थान को सूचित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; ‘यहवे’ उसे किसी उपाधि से बदले बिना लिप्यंतरित करता है।
- issue: संदूक का खोज करना
  choice: ताकि वह उनके लिए विश्राम की जगह ढूँढ़े
  alternative: ताकि उसके आगे चलने के द्वारा उनके लिए विश्राम की जगह ढूँढ़ी जाए
  rationale: हिब्रू व्याकरण में לָתוּר का स्वाभाविक कर्ता निकटवर्ती ‘वाचा का संदूक’ है। पाठ की मानवीकरण जैसी अभिव्यक्ति को धर्मवैज्ञानिक स्पष्टीकरण देकर नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘आगे-आगे चलता रहा’ मूल कृदंत की निरंतरता को स्वाभाविक हिन्दी में व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
