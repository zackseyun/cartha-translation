source:
  edition: WLC
  text: וְ/הָיָ֖ה כִּי תֵלֵ֣ךְ עִמָּ֑/נוּ וְ/הָיָ֣ה הַ/טּ֣וֹב הַ/ה֗וּא אֲשֶׁ֨ר יֵיטִ֧יב יְהוָ֛ה עִמָּ֖/נוּ וְ/הֵטַ֥בְנוּ לָֽ/ךְ־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/032.yaml
  text: And if you go with us[a], then whatever good Yahweh does for us, we will do good to you.
translation:
  language: hi
  text: और यदि तुम हमारे साथ चलोगे, तो याहवे हमारे लिए जो भलाई करेगा, हम तुम्हारे लिए भी भलाई करेंगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “और ऐसा होगा कि वह भलाई, जो याहवे हमारे साथ करेगा, हम तुम्हारे लिए भलाई करेंगे।”'
    reason: हिब्रू की दोहरी וְהָיָה संरचना और עִמָּנוּ (‘हमारे साथ’) तथा הַטּוֹב הַהוּא की अधिक शब्दशः अभिव्यक्ति दिखाने के लिए।
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और यदि
  rationale: यह पदबंध शर्त प्रस्तुत करता है। ‘और यदि’ आधुनिक हिन्दी में स्वाभाविक है और ‘जब’ की अपेक्षा शर्त की अनिश्चितता को बनाए रखता है।
- source_word: תֵלֵךְ עִמָּנוּ
  choice: तुम हमारे साथ चलोगे
  rationale: הלך और עִם यहाँ यात्रा में साथ देने का भाव व्यक्त करते हैं; ‘हमारे साथ चलोगे’ प्रसंगानुकूल और सहज है।
- source_word: הַטּוֹב הַהוּא אֲשֶׁר יֵיטִיב
  choice: जो भलाई करेगा
  rationale: हिब्रू में संज्ञा טוֹב और उसी मूल के क्रियापद יטב का शब्द-संबंध है। हिन्दी में ‘भलाई...भलाई करेंगे’ इस पुनरावृत्ति को यथासंभव सुरक्षित रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण ‘याहवे’ के रूप में रखा गया है।
- source_word: עִמָּנוּ
  choice: हमारे साथ
  rationale: मूल पाठ का עִם शाब्दिक रूप से ‘साथ’ है। हिन्दी में यह थोड़ा असामान्य होते हुए भी समझने योग्य है और मूल अभिव्यक्ति को सुरक्षित रखता है।
- source_word: וְהֵטַבְנוּ לָךְ
  choice: हम तुम्हारे लिए भी भलाई करेंगे
  rationale: यह अनुवाद יטב की पिछली पुनरावृत्ति बनाए रखता है। ‘भी’ प्रतिफलात्मक समानांतरता स्पष्ट करता है, पर ‘वही भलाई’ कहकर स्रोत से अधिक निश्चित पहचान नहीं जोड़ता।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मुख्य पाठ में शर्त–परिणाम संरचना स्पष्ट है; ‘भलाई’ की पुनरावृत्ति मूल के शब्द-संबंध को बनाए रखती है।
