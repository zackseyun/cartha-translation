base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/022.yaml
  text: Then the banner of the camp of the sons of Ephraim set out by their divisions[b][a], and over its division was Elishama son of Ammihud.
translation:
  language: hi
  text: तब एप्रैम के वंशजों की छावनी का झंडा[a] अपनी टुकड़ियों के अनुसार आगे बढ़ा, और उसके सैन्य दल का प्रधान अम्मीहूद का पुत्र एलीशामा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ध्वज।” इब्रानी शब्द उस जनजातीय चिह्न को दर्शाता है जिसके अधीन छावनी आगे बढ़ती थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: तब ... आगे बढ़ा
  rationale: वाव के साथ पूर्ण क्रिया यहाँ यात्रा-वृत्तांत की अगली क्रमिक घटना बताती है; आधुनिक हिन्दी में ‘तब ... आगे बढ़ा’ स्वाभाविक है।
- source_word: דֶּגֶל
  choice: झंडा
  rationale: यह उस जनजातीय चिह्न को दर्शाता है जिसके अधीन छावनी-दल यात्रा करता था; ‘झंडा’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: מַחֲנֵה
  choice: छावनी-दल
  rationale: रचना में यह केवल स्थान नहीं, झंडे से संबद्ध संगठित छावनी-इकाई को सूचित करता है; संयुक्त पद उस अर्थ को स्पष्ट रखता है।
- source_word: בְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों
  rationale: जनजातीय पदनाम के रूप में בְנֵי का आशय एप्रैम के वंशजों से है; यह हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: לְצִבְאֹתָם
  choice: अपने-अपने सैन्य दलों के अनुसार
  rationale: צָבָא यहाँ युद्ध की कार्रवाई से अधिक यात्रा के लिए संगठित सैन्य-शैली की इकाइयों को दर्शाता है। बहुवचन और वितरणात्मक व्यवस्था दोनों बनाए गए हैं।
- source_word: וְעַל צְבָאוֹ
  choice: उसके सैन्य दल का प्रधान ... था
  rationale: עַל नेतृत्व या अधिकार का संबंध बताता है। हिन्दी में ‘प्रधान’ जोड़कर यह संबंध स्वाभाविक ढंग से व्यक्त होता है, जबकि एकवचन प्रत्यय भी सुरक्षित रहता है।
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: अम्मीहूद का पुत्र एलीशामा
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है और בן को सामान्य वंशसूचक हिन्दी ‘का पुत्र’ से व्यक्त किया गया है।
