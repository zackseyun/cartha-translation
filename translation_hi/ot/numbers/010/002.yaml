  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूसा को संबोधित एकवचन ‘तेरे’ और आज्ञार्थक शैली को सुरक्षित रखा गया है; ‘मण्डली,’ ‘तुरही,’ ‘छावनी’ और ‘कूच’ प्रसंगानुकूल प्रचलित शब्द हैं।
