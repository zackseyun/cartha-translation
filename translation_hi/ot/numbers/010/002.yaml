source:
  edition: WLC
  text: עֲשֵׂ֣ה לְ/ךָ֗ שְׁתֵּי֙ חֲצֽוֹצְרֹ֣ת כֶּ֔סֶף מִקְשָׁ֖ה תַּעֲשֶׂ֣ה אֹתָ֑/ם וְ/הָי֤וּ לְ/ךָ֙ לְ/מִקְרָ֣א הָֽ/עֵדָ֔ה וּ/לְ/מַסַּ֖ע אֶת הַֽ/מַּחֲנֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/002.yaml
  text: Make for yourself two silver trumpets[a]; you shall make them of hammered work[b], and they shall be for you for summoning the congregation and for setting out the camps.
translation:
  language: hi
  text: “अपने लिए चाँदी की दो तुरहियाँ बना। उन्हें पीटकर गढ़ना। वे मण्डली को बुलाने[a] और छावनियों को कूच कराने[b] के लिए तेरे काम आएँगी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मण्डली को एकत्र करने।”
    reason: מִקְרָא बुलावे के कार्य और उसके परिणामस्वरूप मण्डली के एकत्र होने, दोनों को सूचित कर सकता है।
  - marker: b
    text: या, “छावनियों के प्रस्थान के लिए।”
    reason: מַסַּע को कूच आरम्भ कराने की क्रिया या स्वयं प्रस्थान की घटना, दोनों रूपों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: עֲשֵׂה לְךָ
  choice: अपने लिए ... बना
  rationale: आज्ञार्थक क्रिया और לְךָ के उपयोग/दायित्व के भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: שְׁתֵּי חֲצֹצְרֹת כֶּסֶף
  choice: चाँदी की दो तुरहियाँ
  rationale: חֲצֹצְרָה सीधी धातु की तुरही है, मुड़ा हुआ नरसिंगा नहीं; हिन्दी में पदार्थ और संख्या का यह क्रम स्वाभाविक है।
- source_word: מִקְשָׁה
  choice: पीटकर गढ़ी हुई कारीगरी
  rationale: यह शब्द धातु को हथौड़े से पीटकर आकार देने की निर्माण-विधि बताता है; केवल ‘एक ही टुकड़े की’ कहना उससे अधिक निश्चित व्याख्या होगी।
- source_word: תַּעֲשֶׂה אֹתָם
  choice: उन्हें ... बनाना
  rationale: प्रारम्भिक आज्ञा के बाद आया अपूर्ण क्रियारूप निर्देश को दृढ़ करता है; हिन्दी का निर्देशात्मक ‘बनाना’ इसे सहज रूप से व्यक्त करता है।
- source_word: וְהָיוּ לְךָ
  choice: तेरे काम आएँगी
  rationale: यहाँ स्वामित्व से अधिक निर्दिष्ट उपयोग का भाव है; यह चयन उसी कार्यात्मक अर्थ को प्राकृतिक हिन्दी में व्यक्त करता है।
- source_word: לְמִקְרָא הָעֵדָה
  choice: मण्डली को बुलाने
  rationale: מִקְרָא यहाँ बुलावे या समवेत होने के लिए दिए गए संकेत को दर्शाता है और הָעֵדָה इस्राएल की सामुदायिक मण्डली है।
- source_word: וּלְמַסַּע אֶת הַמַּחֲנוֹת
  choice: छावनियों को कूच कराने
  rationale: מַסַּע प्रस्थान या यात्रा आरम्भ करने को दर्शाता है; इस प्रसंग में तुरहियाँ अलग-अलग छावनियों को आगे बढ़ने का संकेत देती हैं।
