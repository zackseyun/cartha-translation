  yaml_path: translation/ot/numbers/010/019.yaml
  text: And over the company of the tribe of the sons of Simeon was Shelumiel son of Zurishaddai[a].
translation:
  language: hi
  text: और शिमोन के वंशजों के गोत्र की टुकड़ी का प्रधान सूरीशद्दै का पुत्र शलूमीएल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/עַל
  choice: और ... का प्रधान
  rationale: इस यात्रा-क्रम में עַל उस व्यक्ति को सूचित करता है जिसे टुकड़ी के ऊपर नियुक्त किया गया था। स्वाभाविक हिन्दी में इस संबंध को ‘का प्रधान’ से स्पष्ट किया गया है।
- source_word: צְבָא
  choice: टुकड़ी
  rationale: यह शब्द यहाँ इस्राएल के व्यवस्थित गोत्रीय दल को दर्शाता है। ‘टुकड़ी’ संगठन और यात्रा-व्यवस्था का भाव रखती है, बिना अनावश्यक रूप से सक्रिय युद्ध का संकेत दिए।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: गणना और छावनी की व्यवस्था के प्रसंग में यह किसी गोत्रीय इकाई के लिए प्रचलित शब्द है।
- source_word: בְּנֵי שִׁמְעוֹן
  choice: शिमोन के वंशजों
  rationale: शाब्दिक अर्थ ‘शिमोन के पुत्र’ है, पर यहाँ यह पूरे गोत्र के लोगों का पारंपरिक वंशगत पद है; ‘वंशजों’ आधुनिक हिन्दी में आशय स्पष्ट करता है।
- source_word: שְׁלֻמִיאֵל
  choice: शलूमीएल
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: प्रत्यक्ष पितृनाम-संबंध में इसका सामान्य और स्पष्ट अर्थ ‘पुत्र’ है।
- source_word: צוּרִי שַׁדָּי
  choice: सूरीशद्दै
  rationale: इब्रानी व्यक्तिगत नाम को एक संयुक्त नाम के रूप में देवनागरी में लिप्यंतरित किया गया है।
