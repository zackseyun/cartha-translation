  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַל
  choice: और ... की कमान ... के हाथ में थी
  rationale: וְ पिछले कथन से इस खंड को जोड़ता है, जबकि עַל यहाँ निहित नेतृत्व या अधिकार व्यक्त करता है। यह हिंदी प्रयोग मूल के भाव को स्वाभाविक ढंग से प्रकट करता है।
- source_word: צְבָא
  choice: दल
  rationale: यात्रा के इस प्रसंग में यह शब्द क्रमबद्ध रूप से आगे बढ़ने वाले संगठित गोत्रीय समुदाय को दर्शाता है। ‘दल’ सहज आधुनिक हिंदी है और इसे स्थायी सेना बताने से बचता है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: यहाँ शब्द का अर्थ सामाजिक-वंशीय इकाई है, न कि उसका शाब्दिक अर्थ ‘लाठी’। इस्राएल के संदर्भ में ‘गोत्र’ प्रचलित और सटीक है।
- source_word: בְּנֵי זְבוּלֻן
  choice: जबूलून के वंशजों
  rationale: इब्रानी में शाब्दिक रूप से ‘जबूलून के पुत्र’ है, पर गोत्रीय सूत्र में इसका आशय जबूलून के वंशजों से है। ‘वंशजों’ आधुनिक हिंदी में इस सामूहिक वंशगत अर्थ को स्पष्ट रखता है।
- source_word: אֱלִיאָב
  choice: एलीआब
  rationale: व्यक्तिनाम का मानक हिंदी लिप्यंतरण।
- source_word: בֶּן חֵלֹן
  choice: हेलोन के पुत्र
  rationale: इब्रानी की सामान्य पितृनाम-संरचना का सीधा और स्वाभाविक हिंदी रूप।
