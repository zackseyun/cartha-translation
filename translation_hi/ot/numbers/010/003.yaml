  yaml_path: translation/ot/numbers/010/003.yaml
  text: When they blow them[a], all the congregation shall assemble before you at the entrance of the tent of meeting.
translation:
  language: hi
  text: जब वे उन दोनों को फूँकें,[a] तब सारी मंडली तुम्हारे पास मिलापवाले तंबू के द्वार पर इकट्ठी हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “और वे उन दोनों को फूँकें, और सारी मंडली तुम्हारे पास इकट्ठी हो जाए।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְתָקְעוּ
  choice: जब वे ... फूँकें
  rationale: निर्देशों के इस क्रम में वाव के साथ पूर्ण क्रिया का भाव समयसूचक/शर्तसूचक है; आधुनिक हिन्दी में ‘जब ... तब’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בָּהֵן
  choice: उन दोनों को
  rationale: स्त्रीलिंग बहुवचन सर्वनाम पिछले पद की दो चाँदी की तुरहियों की ओर संकेत करता है। ‘दोनों’ संदर्भ को स्पष्ट करता है, और हिन्दी में ‘तुरही फूँकना’ के अनुरूप ‘को’ स्वाभाविक है।
- source_word: וְנוֹעֲדוּ
  choice: इकट्ठी हो जाए
  rationale: निफ़अल रूप यहाँ बुलावे पर समुदाय के एक स्थान पर एकत्र होने का अर्थ देता है। स्त्रीलिंग एकवचन क्रिया ‘मंडली’ के साथ मेल खाती है।
- source_word: אֵלֶיךָ
  choice: तुम्हारे पास
  rationale: हिब्रू का मूल अर्थ ‘तुम्हारी ओर/तुम्हारे पास’ है। यह मूसा के पास मंडली के एकत्र होने को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כָּל הָעֵדָה
  choice: सारी मंडली
  rationale: עֵדָה इस्राएल के सामुदायिक निकाय को दर्शाता है; ‘सारी मंडली’ आधुनिक, स्पष्ट और गिनती की पुस्तक में उपयुक्त है।
- source_word: פֶּתַח
  choice: द्वार
  rationale: यह तंबू के प्रवेश-स्थान को दर्शाता है। धार्मिक-साहित्यिक प्रसंग में ‘द्वार’ संक्षिप्त, प्रतिष्ठित और सहज है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पदबंध उस पवित्र तंबू को दर्शाता है जहाँ नियत भेंट/मिलन होता है। ‘मिलापवाला तंबू’ हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला और अर्थपूर्ण पद है।
