base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/013.yaml
  text: So they set out for the first time at the command of Yahweh through Moses[a].
translation:
  language: hi
  text: तब उन्होंने पहली बार याहवे की आज्ञा के अनुसार मूसा के द्वारा प्रस्थान किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: “मूसा के हाथ से”; यह मुहावरा मूसा को माध्यम या प्रतिनिधि बताता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסְעוּ
  choice: उन्होंने ... प्रस्थान किया
  rationale: यात्रा-वृत्तांत में נסע का अर्थ पड़ाव उठाकर आगे चलना है; ‘प्रस्थान किया’ इस आरंभिक गति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: בָּרִאשֹׁנָה
  choice: पहली बार
  rationale: यह क्रियाविशेषण यहाँ सीनै से क्रमबद्ध यात्रा के प्रथम प्रस्थान को सूचित करता है।
- source_word: עַל פִּי
  choice: की आज्ञा के अनुसार
  rationale: शाब्दिक अर्थ ‘के मुँह पर’ है, पर यह मुहावरा किसी आदेश या निर्देश के अनुसार कार्य करने को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ के द्वारा इब्रानी चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक ‘मूसा के हाथ से’ एजेंसी अथवा मध्यस्थता का इब्रानी मुहावरा है; ‘मूसा के द्वारा’ आधुनिक हिन्दी में वही भूमिका स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए सुस्थापित नामरूप ‘यहोवा’ इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: मूसा की भूमिका
  choice: मूसा के द्वारा
  alternative: मूसा के हाथ से
  rationale: यह अभिव्यक्ति मूसा को आज्ञा का स्रोत नहीं, बल्कि यहोवा के निर्देश का माध्यम या प्रतिनिधि दिखाती है; शाब्दिक मुहावरा पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘प्रस्थान किया’ यात्रा-वृत्तांत के अनुकूल है और ‘आज्ञा के अनुसार’ मूल मुहावरे का स्वाभाविक हिन्दी अर्थ देता है।
