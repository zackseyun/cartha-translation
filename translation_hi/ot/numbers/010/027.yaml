- source_word: בְּנֵי נַפְתָּלִי
  choice: नप्ताली के वंशजों
  rationale: शाब्दिक अर्थ ‘नप्ताली के पुत्र’ है, पर गोत्रीय सूत्र में यह उसके वंशजों को सामूहिक रूप से बताता है; आधुनिक हिन्दी में ‘वंशजों’ अर्थ को स्वाभाविक और सटीक रखता है।
- source_word: אֲחִירַע
  choice: अहीरा
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן עֵינָן
  choice: एनान का पुत्र
  rationale: इब्रानी पितृनाम-सूत्र का सीधा और स्वाभाविक हिन्दी रूप।
