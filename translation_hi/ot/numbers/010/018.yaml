  text: וְ/נָסַ֗ע דֶּ֛גֶל מַחֲנֵ֥ה רְאוּבֵ֖ן לְ/צִבְאֹתָ֑/ם וְ/עַל צְבָא֔/וֹ אֱלִיצ֖וּר בֶּן שְׁדֵיאֽוּר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/018.yaml
  text: Then the banner of the camp of Reuben set out by their divisions[b][a], and over its company was Elizur son of Shedeur.
translation:
  language: hi
  text: तब रूबेन की छावनी का झंडा[a] अपने दलों[b] के अनुसार आगे बढ़ा। उसके दल का प्रधान शदेऊर का पुत्र एलीसूर था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ध्वज’।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपनी टुकड़ियों के अनुसार’; इब्रानी शब्द में संगठित, सैन्य-शैली के समूहों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָסַע
  choice: तब ... आगे बढ़ा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; यात्रा और छावनी के प्रस्थान के प्रसंग में ‘आगे बढ़ा’ स्वाभाविक है और मूल क्रिया में निहित गति को व्यक्त करता है।
- source_word: דֶּגֶל
  choice: झंडा
  rationale: यह उस जनजातीय चिह्न को दर्शाता है जिसके अधीन छावनी-दल यात्रा करता था। ‘झंडा’ आधुनिक हिन्दी में स्पष्ट और सहज है; ‘ध्वज’ एक संभव अधिक औपचारिक विकल्प है।
- source_word: מַחֲנֵה רְאוּבֵן
  choice: रूबेन के छावनी-दल
  rationale: संदर्भ में מַחֲנֶה केवल स्थान नहीं, बल्कि यात्रा करने वाला संगठित शिविर-समुदाय है; ‘छावनी-दल’ इस अर्थ को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְצִבְאֹתָם
  choice: अपने दलों के अनुसार
  rationale: צְבָאוֹת संगठित समूहों या टुकड़ियों को सूचित करता है। ‘दलों के अनुसार’ क्रमबद्ध संगठन बनाए रखता है, पर अनावश्यक रूप से युद्ध का भाव नहीं जोड़ता।
- source_word: וְעַל צְבָאוֹ
  choice: उसके दल का प्रधान ... था
  rationale: עַל यहाँ अधिकार या नेतृत्व दर्शाता है। हिन्दी में शाब्दिक ‘उसके दल के ऊपर’ अस्वाभाविक होता; ‘दल का प्रधान’ वही संबंध स्पष्ट करता है, यद्यपि ‘प्रधान’ वाक्य में पूरित है।
- source_word: אֱלִיצוּר
  choice: एलीसूर
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय उच्चारणानुकूल लिप्यंतरण।
- source_word: בֶּן שְׁדֵיאוּר
  choice: शदेऊर का पुत्र
  rationale: इब्रानी पितृनाम-संबंध को स्वाभाविक हिन्दी में व्यक्त किया गया है और नाम का लिप्यंतरण किया गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पहले ‘दल’ से पूरे छावनी-समूह और बहुवचन ‘दलों’ से उसके संगठित उपसमूहों का संकेत मिलता है। नामों के रूप हिन्दी बाइबल परंपरा के निकट रखे गए हैं।
