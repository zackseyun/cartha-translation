base_translation:
  language: en
  yaml_path: translation/ot/numbers/010/017.yaml
  text: Then the tabernacle was taken down[a], and the sons of Gershon and the sons of Merari set out[b], carrying the tabernacle.
translation:
  language: hi
  text: तब निवास-तंबू उतारा गया[a], और गेर्शोन के पुत्र तथा मरारी के पुत्र, जो निवास-तंबू को ले जाने वाले थे, चल पड़े[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'वैकल्पिक: ‘गेर्शोनी और मरारीवंशी।’ हिब्रू में शाब्दिक रूप से ‘गेर्शोन के पुत्र और मरारी के पुत्र’ है।'
    reason: lexical_alternative
  - marker: b
    text: अर्थात् निवास-तंबू उतारे जाने के बाद वे उसे ले गए। हिब्रू में ‘उसके भागों’ नहीं, बल्कि फिर से ‘निवास-तंबू’ ही कहा गया है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהוּרַד
  choice: उतारा गया
  rationale: होफ़ाल रूप यहाँ खड़े किए गए पवित्र-निवास को नीचे उतारने का कर्मवाच्य अर्थ देता है। ‘खोला गया’ प्रसंगानुकूल हो सकता है, पर मूल में बताई गई क्रिया-विधि से अधिक स्पष्टता जोड़ता।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र-निवास
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है और गिनती में यह इस्राएल के पवित्र तंबू के लिए निश्चित पारिभाषिक शब्द है। ‘पवित्र-निवास’ आधुनिक पाठक के लिए अर्थ स्पष्ट रखते हुए धार्मिक संदर्भ भी व्यक्त करता है।
- source_word: וְנָסְעוּ
  choice: चल पड़े
  rationale: यात्रा के प्रसंग में נסע का अर्थ पड़ाव से आगे यात्रा आरंभ करना है; ‘चल पड़े’ स्वाभाविक आधुनिक हिन्दी में यही भाव देता है।
- source_word: בְנֵי גֵרְשׁוֹן
  choice: गेर्शोन के पुत्र
  rationale: मूल का शाब्दिक वंशीय पदबंध सुरक्षित रखा गया है; प्रसंग में इसका आशय गेर्शोनवंशियों से है।
- source_word: וּבְנֵי מְרָרִי
  choice: मरारी के पुत्र
  rationale: मूल के समानांतर वंशीय पदबंध ‘पुत्र’ के साथ सुरक्षित रखा गया है; प्रसंग में इसका आशय मरारीवंशियों से है।
- source_word: נֹשְׂאֵי
  choice: उठाकर ले जाने वाले
  rationale: यह कृदंत यात्रा के दौरान उनकी भूमिका बताता है। हिन्दी में यह ‘ढोने वाले’ से अधिक गरिमापूर्ण और ‘वहन करने वाले’ से अधिक सहज है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र-निवास
  rationale: दूसरी बार भी मूल वही संज्ञा दोहराता है। प्रसंग से उसके अलग किए गए अंग अभिप्रेत हैं, पर मुख्य पाठ में ‘भाग’ जोड़ना मूल से अधिक स्पष्टता देना होता।
