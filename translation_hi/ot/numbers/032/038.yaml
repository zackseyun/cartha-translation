base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/038.yaml
  text: and Nebo[a], and Baal-meon, their names having been changed, and Sibmah. And they gave names to the cities that they had built.
translation:
  language: hi
  text: और नबो, बाल-मओन—जिनके नाम बदल दिए गए थे[a]—और सिबमा को भी। उन्होंने उन नगरों के नाम रखे जिन्हें उन्होंने बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “बदले हुए नामों वाले” या “जिनके नाम बदल दिए गए थे” भी हो सकता है। इब्रानी वाक्यांश संभवतः बताता है कि नबो और बाल-मओन के नाम बदल दिए गए थे।
    reason: इब्रानी वाक्यांश की रचना और उसके संबंध-क्षेत्र में कुछ अस्पष्टता है।
lexical_decisions:
- source_word: נְבוֹ
  choice: नबो
  rationale: स्थानवाचक नाम का उसके इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: בַּעַל מְעוֹן
  choice: बाल-मओन
  rationale: संयुक्त स्थानवाचक नाम के दोनों घटकों को स्पष्ट रखने के लिए योजक-चिह्न सहित लिप्यंतरण।
- source_word: מוּסַבֹּת שֵׁם
  choice: जिनके नाम बदल दिए गए थे
  rationale: निष्क्रिय परिणामसूचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है। बहुवचन रूप का सबसे निकट संबंध नबो और बाल-मओन से माना गया है, पर वैकल्पिक समझ पाद-टिप्पणी में रखी गई है।
- source_word: שִׂבְמָה
  choice: सिबमा
  rationale: स्थानवाचक नाम का सरल देवनागरी लिप्यंतरण।
- source_word: וַיִּקְרְאוּ בְשֵׁמוֹת אֶת שְׁמוֹת הֶעָרִים
  choice: उन्होंने ... नगरों के नाम रखे
  rationale: इब्रानी नामकरण-वाक्यांश का स्वाभाविक हिन्दी रूप, जिसमें नगरों को नाम दिए जाने का अर्थ सुरक्षित है।
- source_word: אֲשֶׁר בָּנוּ
  choice: अपने बनाए हुए
  rationale: בנה के सामान्य अर्थ ‘बनाना’ को रखा गया है; संदर्भ के आधार पर ‘फिर से बसाना’ या ‘पुनर्निर्माण करना’ नहीं जोड़ा गया।
