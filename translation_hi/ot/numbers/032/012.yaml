  yaml_path: translation/ot/numbers/032/012.yaml
  text: except Caleb son of Jephunneh the Kenizzite[a], and Joshua son of Nun, because they fully followed Yahweh.
translation:
  language: hi
  text: यपुन्ने के पुत्र कालेब कनिज्जी और नून के पुत्र यहोशू को छोड़कर, क्योंकि उन्होंने याहवे का पूरी निष्ठा से अनुसरण किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने याहवे का पूरे मन से अनुसरण किया।” इब्रानी मुहावरा शब्दशः “याहवे के पीछे भरना” है और पूर्ण निष्ठा का भाव व्यक्त करता है।
    reason: मूल इब्रानी मुहावरे के वैकल्पिक अनुवाद और उसके शाब्दिक बिंब को स्पष्ट करना।
lexical_decisions:
- source_word: בִּלְתִּי
  choice: केवल … को छोड़कर
  rationale: यह पद पिछले कथन के अपवादों को बताता है। हिन्दी में ‘केवल … को छोड़कर’ दो व्यक्तियों को एकमात्र अपवाद के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּלֵב בֶּן יְפֻנֶּה הַקְּנִזִּי
  choice: यपुन्ने के पुत्र कालेब कनिज्जी
  rationale: वंश-सूचक בֶּן को ‘के पुत्र’ और הַקְּנִזִּי को कालेब की कुलीय या जातीय पहचान ‘कनिज्जी’ के रूप में रखा गया है।
- source_word: וִיהוֹשֻׁעַ בִּן נוּן
  choice: और नून के पुत्र यहोशू
  rationale: संयोजक को ‘और’, בִּן को ‘के पुत्र’, तथा नामों को प्रचलित हिन्दी बाइबलीय रूपों में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह शब्द कालेब और यहोशू को अपवाद ठहराए जाने का कारण बताता है।
- source_word: מִלְאוּ אַחֲרֵי
  choice: पूरी निष्ठा से … के पीछे चले
  rationale: इस इब्रानी मुहावरे का आशय पूर्ण निष्ठा और समर्पण के साथ अनुसरण करना है। यह हिन्दी रूप गति-चित्र ‘पीछे चले’ को भी बनाए रखता है और मुहावरे का भाव भी स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מִלְאוּ אַחֲרֵי में पूर्ण निष्ठा का भाव
  choice: पूरी निष्ठा से याहवे के पीछे चले
  alternative: याहवे का पूरी तरह अनुसरण किया
  rationale: चुना हुआ रूप पूर्ण समर्पण का अर्थ व्यक्त करते हुए मूल के ‘पीछे’ चलने वाले बिंब को बनाए रखता है और आज्ञाकारिता से आगे किसी संप्रदायगत अर्थ को नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले वाक्य पर निर्भर अपवाद-वाक्यांश है, इसलिए हिन्दी में भी उसकी आरंभिक संरचना बनाए रखी गई है।
