base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/033.yaml
  text: So Moses gave to the sons of Gad[a], to the sons of Reuben, and to the half-tribe of Manasseh son of Joseph, the kingdom of Sihon king of the Amorites and the kingdom of Og king of Bashan—the land with its cities in their territories, the cities of the surrounding land.
translation:
  language: hi
  text: तब मूसा ने गाद के वंशजों को, रूबेन के वंशजों को और यूसुफ के पुत्र मनश्शे के आधे गोत्र को एमोरियों के राजा सीहोन का राज्य और बाशान के राजा ओग का राज्य दिया—वह देश और उसके नगर, उनकी सीमाओं सहित—चारों ओर के देश के नगर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह देश और उसके नगर उनकी सीमाओं में—चारों ओर के देश के नगर।” अंतिम इब्रानी पदबंध वाक्य-विन्यास की दृष्टि से संक्षिप्त और अस्पष्ट है; इसके कई निकटवर्ती अनुवाद संभव हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן यहाँ भूभाग सौंपने या देने को दर्शाता है; ‘दे दिया’ सरल हिंदी में कथात्मक पूर्णता व्यक्त करता है।
- source_word: לִבְנֵי גָד ... וְלִבְנֵי רְאוּבֵן
  choice: गाद के वंशजों को ... रूबेन के वंशजों को
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर जनजातीय समूह के लिए आधुनिक हिंदी में ‘वंशज’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: וְלַחֲצִי שֵׁבֶט מְנַשֶּׁה
  choice: मनश्शे के आधे गोत्र को
  rationale: यह इब्रानी रचना को निकटता से रखते हुए स्वाभाविक हिंदी देती है और स्पष्ट करती है कि गोत्र का आधा भाग अभिप्रेत है।
- source_word: בֶן יוֹסֵף
  choice: यूसुफ के पुत्र
  rationale: मनश्शे की वंशावली-संबंधी पहचान को मूल पाठ के अनुसार बनाए रखा गया है।
- source_word: מַמְלֶכֶת
  choice: राज्य
  rationale: ממלכה के राजकीय भूभाग के अर्थ के लिए ‘राज्य’ सीधा और प्रचलित विकल्प है।
- source_word: סִיחֹן מֶלֶךְ הָאֱמֹרִי
  choice: एमोरियों के राजा सीहोन
  rationale: इब्रानी पदबंध का अर्थ स्पष्ट रखते हुए हिंदी की स्वाभाविक संबंधवाचक संरचना अपनाई गई है।
- source_word: עוֹג מֶלֶךְ הַבָּשָׁן
  choice: बाशान के राजा ओग
  rationale: नाम और पदवी को स्वाभाविक हिंदी क्रम में प्रस्तुत किया गया है।
- source_word: הָאָרֶץ
  choice: वह देश
  rationale: संदर्भ में यह अभी उल्लिखित राजकीय भूभाग को सूचित करता है; ‘वह देश’ संकेतार्थ को बनाए रखता है।
- source_word: לְעָרֶיהָ ... בִּגְבֻלֹת עָרֵי הָאָרֶץ סָבִיב
  choice: उसके नगर और उनकी सीमाओं के भीतर चारों ओर के नगर
  rationale: अंतिम इब्रानी वाक्यांश संक्षिप्त और वाक्य-विन्यास की दृष्टि से कठिन है। मुख्य पाठ एक पठनीय संभावित अर्थ देता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता दर्ज करती है।
