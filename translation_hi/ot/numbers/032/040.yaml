  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सहज कथात्मक शैली रखी गई है। ‘बस गया’ निवास स्थापित करने का प्रसंगगत भाव व्यक्त करता है; अलग पाद-टिप्पणी आवश्यक नहीं मानी गई।
