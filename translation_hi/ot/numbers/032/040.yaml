base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/040.yaml
  text: So Moses gave Gilead to Machir son of Manasseh[a], and he settled in it.
translation:
  language: hi
  text: तब मूसा ने गिलाद मनश्शे के पुत्र माकीर को दे दिया, और वह उसमें बस गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दे दिया
  rationale: נתן का सामान्य अर्थ ‘देना’ है; भूमि दिए जाने के इस प्रसंग में ‘दे दिया’ सहज है और ‘सौंपा’ जैसे अतिरिक्त प्रशासनिक भाव से बचता है।
- source_word: הַגִּלְעָד
  choice: गिलाद
  rationale: यह स्थापित स्थान-नाम है; हिन्दी में इब्रानी निश्चित उपपद का अलग अनुवाद आवश्यक नहीं है।
- source_word: לְמָכִיר
  choice: माकीर को
  rationale: לְ यहाँ प्राप्तकर्ता को चिह्नित करता है, जिसे हिन्दी में ‘को’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בֶּן מְנַשֶּׁה
  choice: मनश्शे के पुत्र
  rationale: בֶּן का सीधा अर्थ ‘पुत्र’ है; इस पद में इसे व्यापक ‘वंशज’ मानने की आवश्यकता नहीं है।
- source_word: וַיֵּשֶׁב
  choice: बस गया
  rationale: ישׁב यहाँ किसी क्षेत्र में निवास स्थापित करने को व्यक्त करता है; भूमि-वितरण के प्रसंग में ‘बस गया’ स्वाभाविक और अर्थानुकूल है।
- source_word: בָּהּ
  choice: उसमें
  rationale: स्त्रीलिंग एकवचन प्रत्यय पहले उल्लिखित गिलाद-भूमि की ओर संकेत करता है; हिन्दी में ‘उसमें’ इस संबंध को स्पष्ट रखता है।
theological_decisions: []
