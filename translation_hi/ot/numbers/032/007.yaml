source:
  edition: WLC
  text: וְ/לָ֣/מָּה תנואו/ן אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל מֵֽ/עֲבֹר֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/007.yaml
  text: And why do you discourage the hearts of the sons of Israel from crossing over into the land that Yahweh has given them?[a][b]
translation:
  language: hi
  text: और तुम इस्राएल के पुत्रों को उस देश में पार जाने से क्यों हतोत्साहित करते हो जिसे याहवे ने उन्हें दिया है?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों के हृदय को ... पार जाने से निरुत्साहित करते हो।” भावार्थ, “उनका साहस या संकल्प क्यों कमज़ोर करते हो?”
    reason: lexical_alternative
  - marker: b
    text: अर्थात “इस्राएलियों” या “इस्राएल की सन्तानों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: और ... क्यों
  rationale: संयोजक वाव और प्रश्नवाचक अभिव्यक्ति दोनों को रखता है तथा प्रश्न को पिछले कथन से जोड़ता है।
- source_word: תנואון אֶת לֵב
  choice: मन क्यों तोड़ते हो
  rationale: हिफ़ील क्रिया यहाँ किसी का साहस या संकल्प दुर्बल करने का भाव देती है। ‘मन तोड़ना’ आधुनिक हिन्दी में स्वाभाविक है और ‘हृदय’ की इब्रानी छवि के निकट भी रहता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के पारिवारिक-राष्ट्रीय पदबंध को औपचारिक रूप से सुरक्षित रखता है; अधिक सहज विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מֵעֲבֹר אֶל הָאָרֶץ
  choice: कि वे उस देश में पार न जाएँ
  rationale: מִן के निरोधात्मक भाव को हिन्दी की निषेधात्मक उपवाक्य-रचना से व्यक्त किया गया है और עבר के पार जाने के अर्थ को सुरक्षित रखा गया है।
- source_word: אֲשֶׁר נָתַן לָהֶם
  choice: जिसे ... ने उन्हें दिया है
  rationale: 'पूर्ण क्रिया को वर्तमान प्रासंगिकता वाले पूर्ण पक्ष में प्रस्तुत करता है: देश का दान हो चुका है और उसका प्रभाव बना हुआ है।'
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चतुरक्षरी व्यक्तिगत नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का राष्ट्रीय-पारिवारिक पदबंध
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों; इस्राएल की सन्तानों
  rationale: मुख्य पाठ में मूल के पुल्लिंग बहुवचन पारिवारिक रूप को रखा गया है, बिना यह दावा किए कि प्रसंग में राष्ट्र के अन्य सदस्य विचार से बाहर हैं।
- issue: ‘हृदय’ के मुहावरे का अर्थ
  choice: मन तोड़ते हो
  alternative: हतोत्साहित करते हो; संकल्प कमज़ोर करते हो
  rationale: यह साहस अथवा संकल्प घटाने का प्रसंगगत अर्थ व्यक्त करता है, पर पादटिप्पणी मूल की शाब्दिक ‘हृदय/मन’ छवि और अर्थ-विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘मन तोड़ना’ बोलचाल में परिचित होते हुए भी पर्याप्त औपचारिक है। ‘कि वे ... न जाएँ’ हिन्दी में निरोध के परिणाम को स्वाभाविक ढंग से व्यक्त करता है और मूल के आशय को अनावश्यक रूप से ‘रोकना’ क्रिया जोड़कर नहीं समझाता।
