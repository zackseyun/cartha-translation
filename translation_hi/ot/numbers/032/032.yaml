id: NUM.32.32
reference: Numbers 32:32
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: נַ֣חְנוּ נַעֲבֹ֧ר חֲלוּצִ֛ים לִ/פְנֵ֥י יְהוָ֖ה אֶ֣רֶץ כְּנָ֑עַן וְ/אִתָּ֨/נוּ֙ אֲחֻזַּ֣ת נַחֲלָתֵ֔/נוּ מֵ/עֵ֖בֶר לַ/יַּרְדֵּֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/032.yaml
  text: We ourselves will cross over, armed, before Yahweh into the land of Canaan, and with us will be the possession of our inheritance on this side of the Jordan.
translation:
  language: hi
  text: हम स्वयं हथियारबंद होकर याहवे के सामने कनान देश में प्रवेश करने के लिए पार जाएँगे, और हमारी विरासत की संपत्ति यरदन के इसी पार[a] हमारे पास रहेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यरदन के उस पार” अथवा “यरदन के पार”; इब्रानी अभिव्यक्ति का अर्थ बोलने वाले के दृष्टिकोण पर निर्भर है। यहाँ “इसी पार” वक्ताओं के नदी के पूर्व में होने को दर्शाता है।
    reason: दृष्टिकोण-निर्भर भौगोलिक अभिव्यक्ति के वैकल्पिक अनुवाद बताना।
lexical_decisions:
- source_word: נַחְנוּ
  choice: हम स्वयं
  rationale: स्वतंत्र सर्वनाम क्रिया में निहित ‘हम’ पर अतिरिक्त बल देता है; ‘हम स्वयं’ उस बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נַעֲבֹר
  choice: पार जाएँगे
  rationale: यहाँ क्रिया यरदन पार करके कनान में जाने की भावी प्रतिज्ञा व्यक्त करती है।
- source_word: חֲלוּצִים
  choice: हथियारबंद होकर
  rationale: सैन्य प्रसंग में यह युद्ध के लिए सुसज्जित और तैयार होने का बोध देता है; यह हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्थानिक-संबंधपरक अर्थ ‘के सामने’ है, और इसमें याहवे की उपस्थिति तथा उनके प्रति दायित्व का भाव बना रहता है।
- source_word: אֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: मूल में अलग संबंधबोधक नहीं है, पर गति-सूचक क्रिया के साथ हिन्दी में गंतव्य स्पष्ट करने के लिए ‘में’ स्वाभाविक है।
- source_word: וְאִתָּנוּ
  choice: हमारे पास रहेगी
  rationale: इब्रानी वाक्यांश क्रियारहित है; भावी प्रतिज्ञा और पूर्वी भूभाग पर अधिकार बने रहने के प्रसंग को हिन्दी में स्वाभाविक रूप से व्यक्त करने के लिए ‘रहेगी’ जोड़ा गया है।
- source_word: אֲחֻזַּת נַחֲלָתֵנוּ
  choice: हमारी विरासत की संपत्ति
  rationale: यह चयन अधिकार में मिली संपत्ति और विरासत—दोनों अवधारणाओं को एक ही पद में समेटे बिना यथासंभव बनाए रखता है।
- source_word: מֵעֵבֶר לַיַּרְדֵּן
  choice: यरदन के इसी पार
  rationale: यह दृष्टिकोण-निर्भर अभिव्यक्ति है। वक्ता यरदन के पूर्वी भाग में खड़े होकर वहीं अपनी विरासत रखने की बात कर रहे हैं, इसलिए ‘इसी पार’ प्रसंगगत दृष्टिकोण स्पष्ट करता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला वाचा-संबंधी ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित निकट लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: לִפְנֵי יְהוָה में संबंध का स्वरूप
  choice: याहवे के सामने
  alternative: याहवे की उपस्थिति में; याहवे के आगे
  rationale: ‘के सामने’ मूल की स्थानिक और वाचा-संबंधी दोनों संभावनाएँ खुली रखता है; इसे केवल सैन्य क्रम या केवल अमूर्त धार्मिक उपस्थिति तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण वचन। ‘हम स्वयं’ प्रतिज्ञा के बल को, ‘हथियारबंद होकर’ सैन्य तैयारी को और ‘हमारे पास रहेगी’ पूर्वी भूभाग पर स्थायी अधिकार के प्रसंग को स्पष्ट करता है।
