  text: וְ/אִם לֹ֤א תַעֲשׂוּ/ן֙ כֵּ֔ן הִנֵּ֥ה חֲטָאתֶ֖ם לַ/יהוָ֑ה וּ/דְעוּ֙ חַטַּאתְ/כֶ֔ם אֲשֶׁ֥ר תִּמְצָ֖א אֶתְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/023.yaml
  text: But if you do not do so[a], behold, you have sinned against Yahweh, and know that your sin will find you out.
translation:
  language: hi
  text: पर यदि तुम ऐसा न करोगे, तो देखो, तुमने याहवे के विरुद्ध पाप किया है; और यह जान लो कि तुम्हारा पाप तुम्हें आ पकड़ेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा पाप तुम्हें ढूँढ़ निकालेगा” अथवा “तुम्हारा दोष तुम्हें आ घेरेगा।” हिब्रू मुहावरा पाप के अनिवार्य रूप से प्रकट होने और उसका परिणाम दोषी तक पहुँचने का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: पूर्ववर्ती आदेश के विपरीत स्थिति प्रस्तुत करने वाले शर्तवाचक और विरोधसूचक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תַעֲשׂוּן כֵּן
  choice: तुम ऐसा न करोगे
  rationale: पूर्व प्रसंग में बताई गई प्रतिज्ञाबद्ध कार्रवाई की ओर संकेत करने वाला संक्षिप्त और स्वाभाविक रूप।
- source_word: הִנֵּה
  choice: तो देखो
  rationale: हिब्रू अव्यय के चेतावनीपूर्ण और बलाघाती स्वर को बनाए रखता है।
- source_word: חֲטָאתֶם
  choice: तुमने ... पाप किया है
  rationale: शर्त पूरी न करने पर उत्पन्न हो चुकी दोषपूर्ण स्थिति को हिब्रू पूर्ण पक्ष के अनुरूप व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के विरुद्ध
  rationale: חטא के साथ ל उस व्यक्ति को बताता है जिसके विरुद्ध पाप किया गया; יהוה को उसके प्रचलित हिन्दी नाम-रूप में रखा गया है।
- source_word: וּדְעוּ
  choice: और यह जान लो
  rationale: बहुवचन आज्ञार्थक की प्रत्यक्षता और निश्चितता पर दिए गए बल को सहज हिन्दी में व्यक्त करता है।
- source_word: חַטַּאתְכֶם
  choice: तुम्हारा पाप
  rationale: मूल संज्ञा का सीधा नैतिक अर्थ रखता है; यहाँ 'दोष' भी संभव है, पर 'पाप' निकटवर्ती क्रिया से संबंध स्पष्ट करता है।
- source_word: אֲשֶׁר תִּמְצָא אֶתְכֶם
  choice: तुम्हें आ पकड़ेगा
  rationale: शाब्दिक 'तुम्हें पाएगा' की अपेक्षा हिन्दी में पाप के अनिवार्य रूप से दोषी तक पहुँचने और परिणाम लाने की सजीवता को अधिक स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम है, सामान्य उपाधि 'प्रभु' नहीं। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाने जाने योग्य नाम-रूप 'यहोवा' चुना गया; 'याहवे' अधिक प्रत्यक्ष लिप्यंतरण का विकल्प है।
- issue: पाप के 'पकड़ने' का आशय
  choice: व्यक्ति-सदृश रूपक को बनाए रखना
  alternative: तुम्हारे पाप का भेद खुल जाएगा / तुम्हें उसका दण्ड मिलेगा
  rationale: मूल कथन जानबूझकर पाप को कर्ता बनाता है और अनिवार्य खोज, प्रकट होने तथा परिणाम की संयुक्त धारणा रखता है; किसी एक व्याख्या तक इसे सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और चेतावनीपूर्ण रखी गई है। 'तो देखो' मूल के बलाघात को सँभालता है, जबकि 'आ पकड़ेगा' सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल रूपक को सुरक्षित रखता है।
