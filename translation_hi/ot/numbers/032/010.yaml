base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/010.yaml
  text: So Yahweh’s anger burned on that day[a], and he swore, saying,
translation:
  language: hi
  text: उस दिन याहवे[a] का क्रोध भड़क उठा, और उसने शपथ खाकर कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; इसे “यहोवा” भी लिखा जाता है।'
    reason: ईश्वरीय नाम के मूल इब्रानी व्यंजनरूप और एक पारंपरिक वैकल्पिक हिन्दी लिप्यंतरण को बताना।
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह इब्रानी मुहावरा क्रोध के गरम होने या जल उठने का भाव व्यक्त करता है। ‘क्रोध भड़क उठा’ आधुनिक हिन्दी में स्वाभाविक रहते हुए मूल रूपक को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘यहोवा’ नाम को किसी उपाधि से बदलने के बजाय उसे स्पष्ट रूप से प्रस्तुत करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: वर्णनात्मक प्रसंग में यह समय-सूचक पदबंध का सहज और सटीक हिन्दी रूप है।
- source_word: וַיִּשָּׁבַע
  choice: उसने शपथ खाकर
  rationale: निफ़अल क्रिया का अर्थ शपथ लेना है। ‘शपथ खाकर’ आगे आने वाली कथन-क्रिया के साथ हिन्दी में स्वाभाविक संबंध बनाता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अगले पद में आने वाली शपथ की विषय-वस्तु का परिचय देता है। ‘कहा’ हिन्दी में स्वाभाविक रूप से उस उद्धरण की ओर ले जाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पद में YHWH नाम स्वयं उपस्थित है। ‘यहोवा’ आधुनिक हिन्दी के सामान्य पाठकों के लिए अधिक परिचित नामरूप है; पादटिप्पणी ‘याहवे’ विकल्प और इब्रानी व्यंजनरूप को स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य के अंत में अल्पविराम इसलिए है कि शपथ की विषय-वस्तु अगले पद में जारी रहती है।
