  text: And the sons of Reuben built Heshbon[a], Elealeh, and Kiriathaim.
translation:
  language: hi
  text: और रूबेन के पुत्रों ने हेशबोन[a], एलआले और किर्यातैम का निर्माण किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रूबेनियों ने हेशबोन, एलआले और किर्यातैम का निर्माण किया।”
    reason: वंशसूचक ‘रूबेन के पुत्रों’ का स्वाभाविक सामुदायिक अनुवाद ‘रूबेनियों’ भी हो सकता है।
lexical_decisions:
- source_word: וּ/בְנֵי רְאוּבֵן
  choice: और रूबेन के पुत्रों ने
  rationale: בְנֵי का शाब्दिक अर्थ ‘पुत्र’ है; गोत्रनाम के साथ यह रूबेन के वंशजों को सूचित करता है। यह रूप मूल की वंशावली-संबंधी अभिव्यक्ति को बनाए रखता है।
- source_word: בָּנוּ
  choice: बनाया
  rationale: בנה के काल रूप का सामान्य अर्थ ‘बनाया’ है। प्रसंग में नगरों को फिर से बसाना या पुनर्निर्मित करना निहित हो सकता है, पर मूल क्रिया स्वयं इसे स्पष्ट नहीं करती।
- source_word: אֶת
  choice: को
  rationale: हिब्रू का निश्चित कर्म-सूचक हिन्दी में अलग शब्द के रूप में अनिवार्य नहीं है; यहाँ नगरों की सूची के बाद ‘को’ स्वाभाविक रूप से कर्म-संबंध दर्शाता है।
- source_word: חֶשְׁבּוֹן
  choice: हेशबोन
  rationale: मसोरेटिक हिब्रू रूप के निकट देवनागरी लिप्यंतरण।
- source_word: אֶלְעָלֵא
  choice: एलआले
  rationale: मसोरेटिक स्वरांकन אֶלְעָלֵא को निकटता से दर्शाने वाला देवनागरी लिप्यंतरण।
- source_word: קִרְיָתָיִם
  choice: किर्यातैम
  rationale: हिब्रू स्थाननाम का देवनागरी में पारदर्शी लिप्यंतरण।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मूल के निकट वाक्य-विन्यास रखा गया है। ‘रूबेन के पुत्रों’ को मुख्य पाठ में रखकर हिब्रू की वंशसूचक संरचना सुरक्षित की गई है; अधिक मुहावरेदार ‘रूबेनियों’ को पादटिप्पणी में दिया गया है।
