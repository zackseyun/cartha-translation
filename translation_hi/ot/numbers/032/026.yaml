  text: טַפֵּ֣/נוּ נָשֵׁ֔י/נוּ מִקְנֵ֖/נוּ וְ/כָל בְּהֶמְתֵּ֑/נוּ יִֽהְיוּ שָׁ֖ם בְּ/עָרֵ֥י הַ/גִּלְעָֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/026.yaml
  text: Our little children[a], our wives, our livestock[b], and all our animals will remain there in the cities of Gilead.
translation:
  language: hi
  text: हमारे छोटे बच्चे[a], हमारी पत्नियाँ, हमारा पशुधन और हमारे सभी पालतू पशु गिलाद के नगरों में वहीं रहेंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे बच्चे।’ इब्रानी शब्द טַף प्रायः विशेष रूप से छोटे या आश्रित बच्चों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘वहाँ होंगे।’ प्रसंग में इसका आशय है कि जब दूसरे लोग युद्ध-अभियान पर जाएँगे, तब ये वहीं रहेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: טַפֵּנוּ
  choice: हमारे छोटे बच्चे
  rationale: טַף प्रायः छोटे या आश्रित बच्चों को दर्शाता है; प्रसंग में ये युद्ध में न जाने वाले परिवार के बच्चे हैं।
- source_word: נָשֵׁינוּ
  choice: हमारी पत्नियाँ
  rationale: पारिवारिक और कबीलाई प्रसंग में बहुवचन נָשִׁים का स्वाभाविक अर्थ वक्ताओं की पत्नियाँ है।
- source_word: מִקְנֵנוּ
  choice: हमारा पशुधन
  rationale: מִקְנֶה झुंडों और रेवड़ों सहित संपत्ति के रूप में रखे जाने वाले पशुओं का सामूहिक बोध देता है; ‘पशुधन’ इसका स्वाभाविक आधुनिक हिन्दी पर्याय है।
- source_word: וְכָל בְּהֶמְתֵּנוּ
  choice: और हमारे सभी पालतू पशु
  rationale: בְּהֵמָה व्यापक रूप से पशुओं, विशेषकर मनुष्य के अधीन घरेलू पशुओं, को दर्शाता है। ‘पालतू पशु’ पूर्ववर्ती ‘पशुधन’ से कुछ भेद बनाए रखता है और व्यापकता को व्यक्त करता है।
- source_word: יִהְיוּ שָׁם
  choice: वहीं रहेंगे
  rationale: क्रिया का शाब्दिक अर्थ ‘वहाँ होंगे’ है, पर प्रसंग में पुरुषों के अभियान पर जाने के दौरान पीछे बने रहने का भाव है; ‘वहीं रहेंगे’ इस प्रसंगगत अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּעָרֵי הַגִּלְעָד
  choice: गिलाद के नगरों में
  rationale: यह संबंधवाचक संरचना और स्थान-सूचक उपसर्ग का सीधा तथा स्वाभाविक हिन्दी रूप है।
