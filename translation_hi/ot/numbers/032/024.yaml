  register: भाषा आधुनिक मानक हिंदी की है। ‘बाल-बच्चों’ और ‘भेड़-बकरियों’ से मूल के सामूहिक शब्द सहज रूप में व्यक्त किए गए हैं। अंतिम खंड में मूल का ‘मुँह से निकलना’ मुहावरा मुख्य पाठ में सुरक्षित रखा गया है, जबकि ‘पूरा करो’ लक्ष्य-भाषा में उसका स्वाभाविक आशय देता है।
