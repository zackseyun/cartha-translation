  text: בְּנֽוּ לָ/כֶ֤ם עָרִים֙ לְ/טַפְּ/כֶ֔ם וּ/גְדֵרֹ֖ת לְ/צֹנַאֲ/כֶ֑ם וְ/הַ/יֹּצֵ֥א מִ/פִּי/כֶ֖ם תַּעֲשֽׂוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/024.yaml
  text: Build for yourselves cities for your little ones[a], and enclosures for your flocks[b], and do what has gone out from your mouth.
translation:
  language: hi
  text: अपने छोटे बच्चों[a] के लिए नगर बनाओ और अपनी भेड़-बकरियों के लिए बाड़े[b] बनाओ; और जो तुम्हारे मुँह से निकला है, उसे पूरा करो।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बाल-बच्चों’। इब्रानी शब्द मुख्यतः छोटे बच्चों को सूचित करता है और कभी-कभी घराने के अन्य आश्रित सदस्यों को भी समेट सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात पशुओं को रखने के लिए घिरे हुए स्थान; इसे ‘घेरे’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘और जो तुम्हारे मुँह से निकला है, उसे करो।’ यह अपने बोले हुए वचन या किए हुए वादे को निभाने का इब्रानी मुहावरा है।
    reason: idiom_explanation
lexical_decisions:
- source_word: בְּנוּ
  choice: बनाओ
  rationale: यह בנה का बहुवचन आज्ञार्थक रूप है। हिंदी में ‘बनाओ’ सीधा, स्वाभाविक और प्रसंगानुकूल आदेश है।
- source_word: לָכֶם
  choice: अपने
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित לְ यहाँ उन लोगों के अपने परिवारों और पशुधन के हित का भाव देता है; हिंदी में ‘अपने/अपनी’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עָרִים
  choice: नगर
  rationale: עִיר का अर्थ नगर या बस्ती हो सकता है। यहाँ बसावट के प्रसंग में ‘नगर’ मानक और गरिमापूर्ण चयन है।
- source_word: לְטַפְּכֶם
  choice: अपने बाल-बच्चों के लिए
  rationale: טַף मुख्यतः छोटे बच्चों तथा प्रसंगानुसार घराने के असहाय सदस्यों को सूचित करता है। ‘बाल-बच्चे’ आधुनिक हिंदी में इस सामूहिक पारिवारिक भाव को सहजता से व्यक्त करता है।
- source_word: וּגְדֵרֹת
  choice: और ... बाड़े
  rationale: גְּדֵרוֹת पशुओं को रखने के लिए घिरे हुए स्थान हैं। ‘बाड़े’ पशुपालन के संदर्भ में स्पष्ट और स्वाभाविक है।
- source_word: לְצֹנַאֲכֶם
  choice: अपनी भेड़-बकरियों के लिए
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, का सामूहिक शब्द है। ‘भेड़-बकरियाँ’ हिंदी पाठक के लिए अर्थ को ठीक और स्पष्ट रूप से सामने लाता है।
- source_word: וְהַיֹּצֵא מִפִּיכֶם
  choice: और जो बात तुम्हारे मुँह से निकली है
  rationale: मूल का शाब्दिक मुहावरा बनाए रखा गया है; यह उनके पहले बोले हुए वचन या किए हुए वादे की ओर संकेत करता है। ‘बात’ जोड़ने से हिंदी वाक्य स्वाभाविक होता है।
- source_word: תַּעֲשׂוּ
  choice: उसे पूरा करो
  rationale: शाब्दिक अर्थ ‘उसे करो’ है, किंतु बोले हुए वचन के साथ हिंदी में ‘पूरा करो’ मुहावरे का आशय स्वाभाविक रूप से व्यक्त करता है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
