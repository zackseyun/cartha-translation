  yaml_path: translation/ot/numbers/032/019.yaml
  text: For we will not inherit with them beyond the Jordan and farther on[a], because our inheritance has come to us on this side of the Jordan, to the east.
translation:
  language: hi
  text: क्योंकि हम यरदन के उस पार और आगे उनके साथ विरासत नहीं पाएँगे, क्योंकि हमारी विरासत यरदन के इस पार, पूर्व की ओर, हमें मिल चुकी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमारी विरासत यरदन के पूर्वी पार हमें मिली है।”
    reason: इब्रानी בָאָה (‘आ/पड़ गई है’) तथा מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה के लिए अंग्रेज़ी POB audit trail में दर्ज lexical alternative को सुरक्षित रखता है।
lexical_decisions:
- source_word: נִנְחַל
  choice: हम ... विरासत नहीं पाएँगे
  rationale: नחל के क़ाल रूप में भूमि को विरासत या हिस्से के रूप में पाने का भाव है; भविष्यकाल प्रसंगानुकूल है।
- source_word: אִתָּם
  choice: उनके साथ
  rationale: यह पश्चिमी गोत्रों के साथ साझा रूप से विरासत पाने की बात स्पष्ट करता है।
- source_word: מֵעֵבֶר לַיַּרְדֵּן וָהָלְאָה
  choice: यरदन के उस पार और आगे
  rationale: यह वक्ताओं की दृष्टि से नदी के पार के क्षेत्र और उससे आगे का स्थानिक भाव बनाए रखता है।
- source_word: בָאָה ... אֵלֵינוּ
  choice: हमें मिल चुकी है
  rationale: शाब्दिक 'हमारे पास आ चुकी है' का स्वाभाविक हिन्दी रूप है और पूर्ण हो चुके प्राप्ति-भाव को व्यक्त करता है।
- source_word: נַחֲלָתֵנוּ
  choice: हमारी विरासत
  rationale: भूमि-विभाजन के प्रसंग में נחלה के पैतृक/नियत हिस्से के अर्थ को सुरक्षित रखता है।
- source_word: מֵעֵבֶר הַיַּרְדֵּן מִזְרָחָה
  choice: यरदन के इस पार, पूर्व की ओर
  rationale: वक्ताओं के पूर्वी स्थान को हिन्दी में स्पष्ट करता है और מִזְרָחָה का दिशात्मक अर्थ बनाए रखता है।
