source:
  edition: WLC
  text: כִּ֤י תְשׁוּבֻ/ן֙ מֵֽ/אַחֲרָ֔י/ו וְ/יָסַ֣ף ע֔וֹד לְ/הַנִּיח֖/וֹ בַּ/מִּדְבָּ֑ר וְ/שִֽׁחַתֶּ֖ם לְ/כָל הָ/עָ֥ם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/015.yaml
  text: For if you turn back from following him[a], he will again leave him in the wilderness[b], and you will bring ruin on all this people.
translation:
  language: hi
  text: क्योंकि यदि तुम उसके पीछे चलना छोड़ दोगे[a], तो वह उसे फिर जंगल में ही रहने देगा[b], और तुम इस सारी प्रजा को बरबादी में डाल दोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ है, “उसके पीछे से फिरोगे”; यह उसके पीछे चलना छोड़ देने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उसे फिर जंगल में रहने देगा” है। यहाँ एकवचन “उसे” संभवतः इस्राएल अथवा पूरी प्रजा के लिए सामूहिक रूप से प्रयुक्त हुआ है। कुछ अनुवाद इसे “उन्हें” या “इस्राएल को” करके स्पष्ट करते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि यदि
  rationale: यह पिछले कथन से कारणात्मक संबंध रखते हुए शर्त प्रस्तुत करता है; इसलिए दोनों अर्थ-छटाएँ रखी गई हैं।
- source_word: תְשׁוּבֻן מֵאַחֲרָיו
  choice: तुम उसके पीछे चलने से फिर जाओगे
  rationale: שׁוב के लौटने या फिर जाने के भाव और מֵאַחֲרָיו के किसी के पीछे चलने से हटने वाले मुहावरे—दोनों को व्यक्त करता है।
- source_word: וְיָסַף עוֹד
  choice: वह ... फिर
  rationale: यह संयुक्त अभिव्यक्ति किसी कार्य को दोबारा करने का भाव देती है।
- source_word: לְהַנִּיחוֹ
  choice: उसे ... पड़ा रहने देगा
  rationale: हिफ़ील रूप यहाँ किसी को उसी दशा या स्थान में रहने देने का अर्थ देता है। एकवचन प्रत्यय को ‘उसे’ के रूप में सुरक्षित रखा गया है।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: गिनती की पुस्तक के प्रसंग में מִדְבָּר निर्जन वन-प्रदेश को सूचित करता है; हिंदी बाइबलीय प्रयोग में ‘जंगल’ स्वाभाविक और परिचित है।
- source_word: וְשִׁחַתֶּם
  choice: तुम ... बरबादी में डाल दोगे
  rationale: यह विनाशकारी परिणाम का कारण बनने का भाव व्यक्त करता है और केवल तत्काल शारीरिक संहार तक अर्थ को सीमित नहीं करता।
- source_word: לְכָל הָעָם הַזֶּה
  choice: इस सारी प्रजा को
  rationale: ‘प्रजा’ सामूहिक एकवचन הָעָם को स्वाभाविक हिंदी में व्यक्त करती है, जबकि ‘सारी’ כָּל की व्यापकता बनाए रखता है।
theological_decisions:
- issue: לְהַנִּיחוֹ में एकवचन प्रत्यय का संदर्भ
  choice: ‘उसे’ रखकर इस्राएल/प्रजा के सामूहिक संदर्भ को सुरक्षित रखा गया है।
  alternative: ‘उन्हें’ या स्पष्ट रूप से ‘इस्राएल को’ कहना।
  rationale: इब्रानी पाठ में प्रत्यय एकवचन है। हिंदी में ‘उसे’ सामूहिक इकाई के लिए संभव है; पादटिप्पणी अस्पष्टता को स्पष्ट करती है, बिना मुख्य पाठ में उसे बहुवचन बनाकर समतल किए।
- issue: וְשִׁחַתֶּם में विनाश का स्वरूप
  choice: ‘बरबादी में डाल दोगे’
  alternative: ‘नाश कर दोगे’ या ‘सर्वनाश कर दोगे’।
  rationale: यह अनाज्ञाकारिता के कारण पूरी प्रजा पर आने वाले विनाशकारी न्याय और दोषी उत्तरदायित्व को व्यक्त करता है, पर अर्थ को केवल प्रत्यक्ष वध तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गंभीर और चेतावनीपूर्ण लहजा रखा गया है। ‘प्रजा’, ‘जंगल’ और ‘बरबादी में डाल देना’ सामान्य पाठक के लिए बोधगम्य हैं और मूल पाठ की सामूहिक तथा कारणात्मक अर्थ-छटाओं को बनाए रखते हैं।
