  text: וַ/יֹּ֣אמֶר מֹשֶׁ֔ה לִ/בְנֵי גָ֖ד וְ/לִ/בְנֵ֣י רְאוּבֵ֑ן הַ/אַֽחֵי/כֶ֗ם יָבֹ֨אוּ֙ לַ/מִּלְחָמָ֔ה וְ/אַתֶּ֖ם תֵּ֥שְׁבוּ פֹֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/006.yaml
  text: But Moses said to the sons of Gad and to the sons of Reuben[b][a], “Shall your brothers go to war while you sit here?”
translation:
  language: hi
  text: तब मूसा ने गाद के वंशजों और रूबेन के वंशजों से कहा, “क्या तुम्हारे भाई[a] युद्ध के लिए जाएंगे[b] और तुम यहाँ बैठे रहोगे?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तुम्हारे भाई” से आशय दूसरे गोत्रों के उनके साथी इस्राएलियों से है।
    reason: cultural_note
  - marker: b
    text: या “युद्ध में जाएंगे।” इब्रानी में “युद्ध के लिए जाना” एक सामान्य मुहावरा है, जिसका अर्थ सैन्य संघर्ष में जाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है। आधुनिक हिन्दी में ‘तब’ इस क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִבְנֵי גָד וְלִבְנֵי רְאוּבֵן
  choice: गाद के वंशजों और रूबेन के वंशजों से
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ जनजातीय वंश-समूह अभिप्रेत हैं; ‘वंशज’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַאַחֵיכֶם
  choice: तुम्हारे भाई
  rationale: मूल का पारिवारिक और पुरुषवाची रूप बनाए रखा गया है; प्रसंग में यह अन्य इस्राएली गोत्रों के पुरुषों को सूचित करता है।
- source_word: יָבֹאוּ לַמִּלְחָמָה
  choice: युद्ध करने जाएंगे
  rationale: इस सामान्य इब्रानी मुहावरे का अर्थ सैन्य संघर्ष में जाना/प्रवेश करना है। प्रश्न में भविष्य रूप मूसा की फटकारपूर्ण अलंकारिक चुनौती को व्यक्त करता है।
- source_word: וְאַתֶּם תֵּשְׁבוּ פֹה
  choice: और तुम यहाँ बैठे रहोगे
  rationale: ישב की ठोस छवि ‘बैठना’ और युद्ध में जाने वालों के साथ तीखा विरोध दोनों सुरक्षित रहते हैं।
