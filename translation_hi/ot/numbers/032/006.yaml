  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पठन के अनुकूल रखी गई है। ‘वंशज’ जनजातीय בני को स्पष्ट करता है, जबकि ‘बैठे रहोगे’ मूल प्रश्न की तीखी फटकार बनाए रखता है।
