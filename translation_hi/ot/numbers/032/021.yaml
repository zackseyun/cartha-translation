id: NUM.32.21
reference: Numbers 32:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עָבַ֨ר לָ/כֶ֧ם כָּל חָל֛וּץ אֶת הַ/יַּרְדֵּ֖ן לִ/פְנֵ֣י יְהוָ֑ה עַ֧ד הוֹרִישׁ֛/וֹ אֶת אֹיְבָ֖י/ו מִ/פָּנָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/021.yaml
  text: and every armed man among you crosses the Jordan before Yahweh[a], until he has driven out his enemies from before him[b],
translation:
  language: hi
  text: और तुममें से हर युद्ध-सज्जित पुरुष याहवे के सामने यरदन पार करे, जब तक वह[b] अपने शत्रुओं को अपने सामने से निकाल न दे[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक वह अपने शत्रुओं को अपने सामने से बेदखल न कर दे।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ “निकाल देना” या “बेदखल करना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “वह,” “अपने शत्रुओं” और “अपने सामने” का संकेत सबसे स्वाभाविक रूप से याहवे की ओर है; किंतु कुछ लोग इन्हें इस्राएल या उसकी युद्ध-सज्जित सेना के संदर्भ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְעָבַר
  choice: और ... पार करे
  rationale: पूर्ववर्ती शर्त के क्रम में यह क्रिया भविष्य की अपेक्षित कार्रवाई बताती है। हिंदी में ‘पार करे’ शर्त/निर्देश का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: לָכֶם כָּל חָלוּץ
  choice: तुममें से हर युद्ध-सज्जित पुरुष
  rationale: לָכֶם को संबंधसूचक ‘तुममें से’ और חָלוּץ को युद्ध के लिए सुसज्जित व्यक्ति के रूप में व्यक्त किया गया है; ‘हर’ मूल के वितरणात्मक एकवचन को बनाए रखता है।
- source_word: אֶת הַיַּרְדֵּן
  choice: यरदन
  rationale: नदी के पार जाने का संदर्भ स्पष्ट है; हिंदी बाइबलीय भूगोल में प्रचलित नाम ‘यरदन’ पर्याप्त और स्वाभाविक है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי की उपस्थिति/सामने होने की धारणा को सीधे रखा गया है और יהוה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ से व्यक्त किया गया है।
- source_word: עַד
  choice: जब तक
  rationale: यह क्रिया की समय-सीमा बताने वाला सीधा और स्वाभाविक हिंदी संयोजक है।
- source_word: הוֹרִישׁוֹ
  choice: वह ... निकाल न दे
  rationale: यहाँ ירשׁ के हिफ़ील रूप का अर्थ शत्रुओं को हटाना अथवा बेदखल करना है। ‘निकाल न दे’ आधुनिक हिंदी में स्पष्ट है, जबकि वैकल्पिक ‘बेदखल’ को टिप्पणी में सुरक्षित रखा गया है।
- source_word: אֹיְבָיו מִפָּנָיו
  choice: अपने शत्रुओं को अपने सामने से
  rationale: दोनों तृतीय-पुरुष एकवचन प्रत्ययों की पारस्परिक कड़ी रखी गई है। ‘अपने’ हिंदी में उसी कर्ता की ओर लौटता है, जबकि ‘वह’ के पूर्वपद की संभावित अस्पष्टता बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उस वाचा-नाम को पदवी में बदले बिना प्रस्तुत करता है।
- issue: הוֹרִישׁוֹ / אֹיְבָיו / מִפָּנָיו में तृतीय-पुरुष एकवचन का संदर्भ
  choice: मुख्यतः याहवे की ओर संकेत, किंतु मुख्य पाठ में व्याकरणिक अस्पष्टता सुरक्षित
  alternative: इस्राएल अथवा उसकी युद्ध-सज्जित सेना की ओर संकेत
  rationale: निकटतम स्पष्ट एकवचन संदर्भ ‘याहवे’ है और विजय-वर्णन की व्यापक शैली भी उसी को समर्थन देती है। फिर भी इब्रानी सर्वनाम स्वयं नाम दोहराते नहीं, इसलिए वैकल्पिक समझ को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। ‘युद्ध-सज्जित’ सैन्य अर्थ को ‘योद्धा’ से अधिक निकटता से व्यक्त करता है। पद पूर्ववर्ती शर्त का अधूरा वाक्यांश है, इसलिए अंत में अल्पविराम रखा गया है।
