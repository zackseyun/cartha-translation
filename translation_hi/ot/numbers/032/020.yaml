base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/020.yaml
  text: And Moses said to them, “If you will do this thing, if you will arm yourselves before Yahweh for the war,”
translation:
  language: hi
  text: तब मूसा ने उनसे कहा, “यदि तुम यह काम करोगे, यदि तुम युद्ध के लिए याहवे के सामने हथियारबंद होगे[a],”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हथियारों से सुसज्जित होगे,” अथवा “युद्ध के लिए तैयार होगे।” हिब्रू क्रिया का यहाँ सैनिक अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֲלֵיהֶם מֹשֶׁה
  choice: तब मूसा ने उनसे कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; אֲלֵיהֶם का अर्थ ‘उनसे’ है।
- source_word: אִם תַּעֲשׂוּן אֶת הַדָּבָר הַזֶּה
  choice: यदि तुम यह काम करोगे
  rationale: דָּבָר यहाँ पहले रखे गए प्रस्ताव या प्रतिबद्धता को सूचित करता है; ‘काम’ हिन्दी में स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: אִם תֵּחָלְצוּ
  choice: यदि तुम ... हथियार बाँधोगे
  rationale: חלץ का निफ़ाल रूप इस सैनिक प्रसंग में युद्ध के लिए हथियारबंद या सुसज्जित होने का भाव देता है। ‘हथियार बाँधोगे’ उस सैन्य अर्थ को स्पष्ट रखते हुए कर्मवाच्य की अपेक्षा अधिक स्वाभाविक हिन्दी है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का मूल भाव ‘के सामने/उपस्थिति में’ है। यह सैनिक कार्यवाही को यहोवा की उपस्थिति और अधिकार के अधीन दिखाता है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: מִלְחָמָה युद्ध या लड़ाई को सूचित करता है; यहाँ ‘युद्ध के लिए’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से अलग बनाए रखता है।
- issue: לִפְנֵי יְהוָה का आशय
  choice: यहोवा के सामने
  alternative: यहोवा की उपस्थिति में
  rationale: शाब्दिक स्थानिक/उपस्थितिगत भाषा को बनाए रखा गया है और इसे केवल ‘उसकी ओर से’ या किसी अधिक विशिष्ट धर्मवैज्ञानिक अर्थ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। पद अगले वाक्य में जारी रहने वाली शर्त है, इसलिए अंत में अल्पविराम रखा गया है।
