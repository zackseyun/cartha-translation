  verdict: revise
  source_fidelity: Draft incorrectly construes כָּל־חָלוּץ לַמִּלְחָמָה ('every armed man for battle') as someone accompanying the Gadites and Reubenites ('...हर पुरुष के साथ'). In Hebrew it identifies the members of those tribes who cross, and the phrase לִפְנֵי יְהוָה applies to their military crossing. The revision restores this scope and retains the conditional structure and passive sense of וְנִכְבְּשָׁה.
  naturalness: The revised sentence is idiomatic modern standard Hindi while retaining the formal, narrative register. 'वश में कर लिया जाए' naturally expresses the passive/resultative sense of the Hebrew without implying destruction.
  terminology: ‘गाद’ and ‘रूबेन’ are retained as tribal names. ‘याहवे’ follows the English POB audit trail’s rendering of the Tetragrammaton as ‘Yahweh.’ ‘अधिकार में’ clearly conveys אֲחֻזָּה, land held as a possession.
  issues:
  - severity: high
    issue: ‘युद्ध के लिए हथियारबंद हर पुरुष के साथ’ misassigns the role of every armed man.
    rationale: 'כָּל חָלוּץ is in apposition to ‘the sons of Gad and the sons of Reuben’: all who cross are armed men for battle; it is not a separate group with whom they travel.'
  - severity: medium
    issue: ‘यहोवा के सामने जाएँ’ attaches ‘before Yahweh’ awkwardly to an added verb ‘जाएँ.’
    rationale: The Hebrew describes crossing the Jordan with Israel as armed men before Yahweh. Recasting the phrase before ‘यरदन पार करें’ preserves its military and theological scope more directly.
  - severity: low
    issue: ‘दे देना’ can sound imperative in Hindi.
    rationale: The Hebrew apodosis is a plural imperfect (‘you shall/will give’). ‘तब तुम ... दोगे’ maintains the stated consequence more closely.
  revised_text: तब मूसा ने उनसे कहा, “यदि गाद के वंशज और रूबेन के वंशज, अर्थात् युद्ध के लिए हथियारबंद प्रत्येक पुरुष, याहवे के सामने तुम्हारे साथ यरदन पार करें, और देश तुम्हारे सामने वश में कर लिया जाए, तब तुम गिलाद का देश उन्हें उनके अधिकार में दे दोगे।”
