id: NUM.32.29
reference: Numbers 32:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֲלֵ/הֶ֗ם אִם יַעַבְר֣וּ בְנֵי גָ֣ד וּ/בְנֵי רְאוּבֵ֣ן אִ֠תְּ/כֶם אֶֽת הַ/יַּרְדֵּ֞ן כָּל חָל֤וּץ לַ/מִּלְחָמָה֙ לִ/פְנֵ֣י יְהוָ֔ה וְ/נִכְבְּשָׁ֥ה הָ/אָ֖רֶץ לִ/פְנֵי/כֶ֑ם וּ/נְתַתֶּ֥ם לָ/הֶ֛ם אֶת אֶ֥רֶץ הַ/גִּלְעָ֖ד לַ/אֲחֻזָּֽה־־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/029.yaml
  text: And Moses said to them, “If the sons of Gad and the sons of Reuben cross the Jordan with you, every armed man for battle before Yahweh, and the land is subdued before you, then you shall give them the land of Gilead as a possession.”
translation:
  language: hi
  text: तब मूसा ने उनसे कहा, “यदि गाद के वंशज और रूबेन के वंशज, अर्थात् युद्ध के लिए हथियारबंद प्रत्येक पुरुष, याहवे के सामने तुम्हारे साथ यरदन पार करें, और देश तुम्हारे सामने वश में कर लिया जाए, तब तुम गिलाद का देश उन्हें उनके अधिकार में दे दोगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: हिब्रू कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘तब’ प्रसंगगत क्रम दिखाता है, पर अनावश्यक कारणात्मक अर्थ नहीं जोड़ता।
- source_word: אִם
  choice: यदि
  rationale: भूमि दिए जाने की वास्तविक शर्त को स्पष्ट रूप से बनाए रखता है।
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: गाद के वंशज और रूबेन के वंशज
  rationale: शाब्दिक ‘पुत्र’ की अपेक्षा हिन्दी में जनजातीय पहचान का स्वाभाविक और स्पष्ट बोध कराता है, जबकि मूल के वंश-संबंध को सुरक्षित रखता है।
- source_word: יַעַבְרוּ ... אֶת הַיַּרְדֵּן
  choice: यरदन पार करके ... जाएँ
  rationale: עבר के पार जाने के अर्थ को सहज हिन्दी में व्यक्त करता है; ‘जाएँ’ अगले पदबंध ‘यहोवा के सामने’ से वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: כָּל חָלוּץ לַמִּלְחָמָה
  choice: युद्ध के लिए हथियारबंद हर पुरुष
  rationale: सैन्य प्रसंग में חָלוּץ का अर्थ सुसज्जित या हथियारबंद योद्धा है; यह अनुवाद संख्या और युद्ध-तैयारी दोनों को स्पष्ट रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: מִפְנֵי/לִפְנֵי की उपस्थिति और जवाबदेही की धार्मिक छाया को बनाए रखते हुए दिव्य नाम को प्रत्यक्ष रूप से प्रस्तुत करता है।
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: और देश ... अधीन कर दिया जाए
  rationale: כבש के निफ़अल रूप की कर्मवाच्य तथा अधीन किए जाने की धारणा को सुरक्षित रखता है; ‘नष्ट’ जैसे अधिक तीव्र अर्थ से बचता है।
- source_word: לִפְנֵיכֶם
  choice: तुम्हारे सामने
  rationale: मूल स्थानिक-संबंधी मुहावरे को बनाए रखता है और इस्राएल की आगे बढ़ती सेना के संदर्भ में स्वाभाविक है।
- source_word: וּנְתַתֶּם ... לַאֲחֻזָּה
  choice: तो तुम ... निज-भूमि के रूप में दे देना
  rationale: ‘तो’ शर्त के परिणाम को हिन्दी में स्पष्ट करता है; אֲחֻזָּה का आशय स्थायी अधिकार में मिली भू-संपत्ति से है, जिसे ‘निज-भूमि’ सामान्य पाठक के लिए संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है, इसलिए उसे ‘प्रभु’ पदवी से नहीं बदला गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; ‘याहवे’ मूल उच्चारण के निकट माने जाने वाला विकल्प है।
- issue: לִפְנֵי יְהוָה का धार्मिक-सैन्य आशय
  choice: यहोवा के सामने
  alternative: यहोवा की उपस्थिति में
  rationale: ‘के सामने’ मूल मुहावरे की ठोस भाषा और इस अभियान के परमेश्वर के समक्ष किए जाने का भाव दोनों सुरक्षित रखता है; इसे केवल मानवीय सैन्य कार्रवाई बनाकर नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। जनजातीय पदबंधों में ‘वंशज’ अपनाया गया है। सैन्य और भूमि-अधिकार संबंधी शब्दावली को स्पष्ट रखते हुए मूल की शर्तात्मक संरचना तथा कर्मवाच्य तनाव सुरक्षित रखा गया है।
