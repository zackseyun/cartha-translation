  text: וַ/אֲנַ֜חְנוּ נֵחָלֵ֣ץ חֻשִׁ֗ים לִ/פְנֵי֙ בְּנֵ֣י יִשְׂרָאֵ֔ל עַ֛ד אֲשֶׁ֥ר אִם הֲבִֽיאֹנֻ֖/ם אֶל מְקוֹמָ֑/ם וְ/יָשַׁ֤ב טַפֵּ֨/נוּ֙ בְּ/עָרֵ֣י הַ/מִּבְצָ֔ר מִ/פְּנֵ֖י יֹשְׁבֵ֥י הָ/אָֽרֶץ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/017.yaml
  text: But we ourselves will arm ourselves quickly before the sons of Israel[a], until we have brought them to their place[b]; and our little ones will remain in the fortified cities because of the inhabitants of the land.
translation:
  language: hi
  text: पर हम स्वयं फुर्ती से हथियारबंद होकर इस्राएलियों के आगे[a] चलेंगे, जब तक कि हम उन्हें उनके स्थान तक न पहुँचा दें। और हमारे बाल-बच्चे[b] देश के निवासियों से बचाव के लिए गढ़वाले नगरों में रहेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल वाक्यांश का शाब्दिक अर्थ “इस्राएल के पुत्रों के सामने” है; यहाँ संभवतः आशय युद्ध में इस्राएलियों के आगे चलने से है।
    reason: lexical_alternative
  - marker: b
    text: “बाल-बच्चे” में बच्चे और आश्रित परिवारजन दोनों शामिल हो सकते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: נֵחָלֵץ
  choice: हथियार बाँधकर ... चलेंगे
  rationale: 'निफ़अल रूप यहाँ प्रसंगानुसार आत्मवाचक/मध्य अर्थ देता है: वक्ता युद्ध के लिए स्वयं को सुसज्जित करके आगे चलने की प्रतिज्ञा करते हैं।'
- source_word: חֻשִׁים
  choice: फुर्ती से
  rationale: यह क्रियाविशेषण तत्परता और शीघ्रता का भाव देता है। हथियार बाँधने का अर्थ पहले ही נֵחָלֵץ में व्यक्त है, इसलिए अनावश्यक पुनरुक्ति से बचते हुए इसे क्रियाविशेषण रूप में रखा गया है।
- source_word: לִפְנֵי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के आगे
  rationale: शाब्दिक रूप से 'इस्राएल के पुत्रों के सामने/आगे'। सैनिक प्रसंग में आशय उनके आगे युद्ध के लिए चलना है; आधुनिक हिन्दी में 'इस्राएलियों के आगे' स्वाभाविक और स्पष्ट है।
- source_word: עַד אֲשֶׁר אִם
  choice: जब तक कि
  rationale: यह संयुक्त पद कार्य की समय-सीमा बताता है; हिन्दी में 'जब तक कि' उसका सहज समतुल्य है।
- source_word: הֲבִיאֹנֻם אֶל מְקוֹמָם
  choice: हम उन्हें उनके स्थान तक न पहुँचा दें
  rationale: हिफ़इल בוא का अर्थ 'पहुँचाना/ले आना' है। 'उनके स्थान' मूल की व्यापकता बनाए रखता है और नियत बसाहट को संकेतित कर सकता है।
- source_word: טַפֵּנוּ
  choice: हमारे बाल-बच्चे
  rationale: טַף एक सामूहिक संज्ञा है जो छोटे बच्चों और आश्रित परिवारजनों को समेट सकती है। 'बाल-बच्चे' साधारण आधुनिक हिन्दी में व्यापक पारिवारिक अर्थ व्यक्त करता है।
- source_word: בְּעָרֵי הַמִּבְצָר
  choice: गढ़वाले नगरों में
  rationale: पद का अर्थ किलेबंदी से सुरक्षित नगर है; 'गढ़वाले नगर' स्पष्ट, संक्षिप्त और गरिमापूर्ण हिन्दी है।
- source_word: מִפְּנֵי יֹשְׁבֵי הָאָרֶץ
  choice: उस देश के निवासियों से सुरक्षित रहने के लिए
  rationale: מִפְּנֵי यहाँ उन निवासियों से उत्पन्न खतरे का भाव देता है। गढ़वाले नगरों का उल्लेख सुरक्षा के उद्देश्य को स्पष्ट करता है; हिन्दी में यह कारण/रक्षा-संबंध स्वाभाविक रूप से व्यक्त किया गया है।
