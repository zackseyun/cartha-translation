  text: הָ/אָ֗רֶץ אֲשֶׁ֨ר הִכָּ֤ה יְהוָה֙ לִ/פְנֵי֙ עֲדַ֣ת יִשְׂרָאֵ֔ל אֶ֥רֶץ מִקְנֶ֖ה הִ֑וא וְ/לַֽ/עֲבָדֶ֖י/ךָ מִקְנֶֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/004.yaml
  text: The land that Yahweh struck before the congregation of Israel is a land for livestock[b][a], and your servants have livestock.
translation:
  language: hi
  text: जिस देश को याहवे ने इस्राएल की मंडली[a] के सामने हराया था, वह पशुधन के लिए उपयुक्त भूमि[b] है, और आपके सेवकों के पास पशुधन है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल की सभा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “पशुधन की भूमि”; अर्थात पशुधन के लिए उपयुक्त भूमि।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָרֶץ
  choice: जिस देश को
  rationale: אֶרֶץ यहाँ भौगोलिक क्षेत्र को दर्शाता है; हिन्दी में सापेक्ष उपवाक्य के साथ ‘जिस देश को’ स्वाभाविक है।
- source_word: הִכָּה
  choice: मारा था
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है और प्रसंग में सैन्य पराजय निहित हो सकती है; ‘मारा था’ उस बल को बनाए रखता है, बिना केवल ‘पराजित किया’ तक अर्थ सीमित किए।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को शीर्षक से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह पदबंध यहाँ इस्राएल की मंडली की उपस्थिति अथवा दृष्टि में हुई कार्रवाई को व्यक्त करता है।
- source_word: עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की मंडली
  rationale: עֵדָה संगठित या एकत्रित समुदाय का बोध कराता है; ‘मंडली’ पंचग्रंथीय संदर्भ में सुबोध और गरिमापूर्ण है।
- source_word: אֶרֶץ מִקְנֶה
  choice: पशुओं के लिए उपयुक्त भूमि
  rationale: हिब्रू अभिव्यक्ति भूमि की पशुपालन-योग्यता दर्शाती है; ‘उपयुक्त’ हिन्दी में इस संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְלַעֲבָדֶיךָ מִקְנֶה
  choice: और आपके दासों के पास पशु हैं
  rationale: ל־ द्वारा व्यक्त स्वामित्व को हिन्दी की स्वाभाविक रचना ‘के पास’ से व्यक्त किया गया है; ‘दास’ वक्ताओं की विनम्र आत्म-संज्ञा को बनाए रखता है।
- source_word: מִקְנֶה
  choice: पशु
  rationale: यह शब्द व्यापक रूप से पाले जाने वाले पशुधन को दर्शाता है, केवल गाय-बैलों को नहीं; सामान्य पाठक के लिए ‘पशु’ सहज है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिन्दी बाइबलीय प्रयोग में परिचित ‘यहोवा’ उसे शीर्षक ‘प्रभु’ से प्रतिस्थापित किए बिना स्पष्ट रूप से प्रस्तुत करता है।
- issue: הִכָּה में दिव्य कार्रवाई की प्रकृति
  choice: मारा था
  alternative: पराजित किया था
  rationale: सैन्य पराजय प्रसंग में निहित है, पर मूल क्रिया ‘मारना/प्रहार करना’ अधिक प्रत्यक्ष है; चुना हुआ पाठ मूल की शब्दगत शक्ति और संभावित व्यापकता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘आपके दास’ मूल के सम्मानसूचक आत्म-उल्लेख को रखता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में संबंधित पदों के तुरंत बाद दिए गए हैं।
