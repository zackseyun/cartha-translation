id: NUM.32.28
reference: Numbers 32:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְצַ֤ו לָ/הֶם֙ מֹשֶׁ֔ה אֵ֚ת אֶלְעָזָ֣ר הַ/כֹּהֵ֔ן וְ/אֵ֖ת יְהוֹשֻׁ֣עַ בִּן נ֑וּן וְ/אֶת רָאשֵׁ֛י אֲב֥וֹת הַ/מַּטּ֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/028.yaml
  text: So Moses commanded Eleazar the priest[a], Joshua son of Nun[b], and the heads of the fathers’ houses of the tribes of the sons of Israel concerning them.
translation:
  language: hi
  text: तब मूसा ने उनके विषय में[a] एलीआज़र याजक, नून के पुत्र यहोशू और इस्राएलियों के गोत्रों के पितृकुलों के मुखियाओं[b] को आदेश दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें आदेश दिया”; इस स्थिति में “उन्हें” से आशय इसी पद में आगे नामित अगुओं से होगा, न कि पिछले प्रसंग में उल्लिखित गोत्रों से।
    reason: lexical_alternative
  - marker: b
    text: यह इस्राएल के कुलों और गोत्रों के अगुओं के लिए प्रयुक्त एक प्रशासनिक पदबंध है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיְצַו
  choice: आदेश दिया
  rationale: צוה अधिकारपूर्वक आज्ञा या निर्देश देने को व्यक्त करता है। ‘आदेश दिया’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसके प्राधिकारपूर्ण भाव को बनाए रखता है।
- source_word: לָהֶם
  choice: उनके विषय में
  rationale: निकटवर्ती प्रसंग में सर्वनाम का संकेत रूबेनियों और गादियों की ओर होना सबसे स्वाभाविक है; नामित अगुओं को आदेश दिया गया कि वे उनके विषय में व्यवस्था लागू करें। फिर भी ‘उन्हें’ अर्थ की व्याकरणिक सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֵת אֶלְעָזָר הַכֹּהֵן
  choice: एलीआज़र याजक ... को
  rationale: אֵת यहाँ צוה के साथ आदेश पाने वाले व्यक्ति को चिह्नित करता है। हिन्दी में ‘को’ लगाकर यह सम्बन्ध स्पष्ट और स्वाभाविक होता है।
- source_word: יְהוֹשֻׁעַ בִּן נוּן
  choice: नून के पुत्र यहोशू
  rationale: इब्रानी पितृनाम की संरचना को स्पष्ट, प्रचलित हिन्दी रूप में व्यक्त किया गया है।
- source_word: רָאשֵׁי אֲבוֹת הַמַּטּוֹת
  choice: गोत्रों के पितृकुलों के मुखिया
  rationale: यह संक्षिप्त प्रशासनिक पदबंध गोत्रों के भीतर वंशाधारित कुलों के अगुओं को दर्शाता है। ‘पितृकुल’ स्रोत की वंशगत संरचना को ‘घरानों’ से अधिक स्पष्ट रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के
  rationale: शाब्दिक ‘इस्राएल के पुत्रों के’ की अपेक्षा ‘इस्राएलियों के’ आधुनिक हिन्दी में अधिक सहज है और यहाँ सामुदायिक-गोत्रीय अर्थ को पर्याप्त रूप से व्यक्त करता है।
theological_decisions:
- issue: לָהֶם का सम्बन्ध
  choice: ‘उनके विषय में’—सर्वनाम को पिछले प्रसंग के रूबेनी और गादी समुदायों से जोड़ा गया
  alternative: ‘उन्हें’—सर्वनाम को इसी पद में नामित अगुओं की ओर संकेत मानना
  rationale: वाक्य में אֵת के साथ एलीआज़र, यहोशू और मुखिया आदेश के प्रत्यक्ष प्राप्तकर्ता हैं; इसलिए לָהֶם को उन समुदायों के विषय में समझना प्रसंग और वाक्य-संरचना के अनुकूल है। वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘आदेश दिया’ प्रशासनिक प्रसंग और क्रिया के अधिकारपूर्ण बल दोनों को व्यक्त करता है; ‘पितृकुल’ गोत्रीय-वंशगत व्यवस्था को संक्षेप में सुरक्षित रखता है।
