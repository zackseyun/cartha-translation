  yaml_path: translation/ot/numbers/032/025.yaml
  text: Then the sons of Gad and the sons of Reuben said to Moses, saying, “Your servants will do just as my lord commands.”
translation:
  language: hi
  text: तब गाद के वंशजों और रूबेन के वंशजों ने मूसा से कहा, “आपके दास वैसा ही करेंगे जैसा मेरे स्वामी आज्ञा देते हैं।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי גָד וּבְנֵי רְאוּבֵן
  choice: गाद के वंशजों और रूबेन के वंशजों
  rationale: यहाँ בְּנֵי जनजातीय समूहों को दर्शाता है; आधुनिक हिन्दी में ‘वंशज’ स्वाभाविक और अर्थ-सटीक है।
- source_word: עֲבָדֶיךָ
  choice: तेरे दास
  rationale: वक्ता अपने समूह के लिए विनम्र आत्म-संबोधन करते हैं; एकवचन प्रत्यय मूसा को संबोधित करता है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह मूसा के लिए सम्मानसूचक संबोधन है, परमेश्वर का नाम नहीं; एकवचन रूप ‘मेरे’ को बनाए रखा गया है।
- source_word: מְצַוֶּה
  choice: ने आज्ञा दी है
  rationale: हिब्रू कृदन्त प्रसंग में वर्तमान निर्देश को सूचित करता है; हिन्दी पूर्ण वर्तमान उस दी हुई और अब भी लागू आज्ञा को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: אֲדֹנִי का संदर्भ
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: संदर्भ में संबोधन मूसा के लिए है। ‘प्रभु’ सम्मानसूचक अर्थ रखता है, पर इसे परमेश्वर के विशेष नाम के रूप में नहीं दिखाया गया।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। हिब्रू के לֵאמֹר (‘यह कहते हुए’) को अलग से दोहराना हिन्दी में अनावश्यक और अस्वाभाविक होता, इसलिए प्रत्यक्ष कथन की स्वाभाविक रचना में समाहित किया गया है।
