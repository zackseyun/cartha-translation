  text: וַֽ/יַּעֲל֞וּ עַד נַ֣חַל אֶשְׁכּ֗וֹל וַ/יִּרְאוּ֙ אֶת הָ/אָ֔רֶץ וַ/יָּנִ֕יאוּ אֶת לֵ֖ב בְּנֵ֣י יִשְׂרָאֵ֑ל לְ/בִלְתִּי בֹא֙ אֶל הָ/אָ֔רֶץ אֲשֶׁר נָתַ֥ן לָ/הֶ֖ם יְהוָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/009.yaml
  text: They went up as far as the Valley of Eshcol and saw the land[c][b][a], and they discouraged the heart of the sons of Israel from going into the land that Yahweh had given them.
translation:
  language: hi
  text: वे एश्कोल की घाटी तक चढ़ गए और उन्होंने उस देश को देखा। फिर उन्होंने इस्राएलियों का साहस तोड़ दिया, जिससे वे उस देश में न जाएँ जिसे याहवे[a] ने उन्हें दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ईश्वरीय नाम יהוה (YHWH) है; इसे यहाँ ‘याहवे’ लिखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: वे ... गए
  rationale: עלה में ऊपर जाने का भाव है, पर हिंदी में इस यात्रा के लिए केवल ‘गए’ अधिक स्वाभाविक है; ‘तक’ गंतव्य की सीमा को स्पष्ट करता है।
- source_word: עַד נַחַל אֶשְׁכּוֹל
  choice: एश्कोल की घाटी तक
  rationale: נחל यहाँ जलधारा वाली घाटी या वादी को सूचित कर सकता है। ‘घाटी’ सामान्य हिंदी पाठक के लिए सहज है और עַד का अर्थ ‘तक’ से व्यक्त होता है।
- source_word: וַיִּרְאוּ אֶת הָאָרֶץ
  choice: उन्होंने उस देश को देखा
  rationale: ראה का सीधा अर्थ ‘देखना’ है। निश्चित पद הָאָרֶץ को प्रसंगानुसार ‘उस देश’ कहा गया है।
- source_word: וַיָּנִיאוּ אֶת לֵב בְּנֵי יִשְׂרָאֵל
  choice: उन्होंने इस्राएलियों का मन ऐसा तोड़ दिया
  rationale: हिफ़ील क्रिया यहाँ पीछे हटने के लिए हतोत्साहित करने का कारण बनने को दर्शाती है। ‘मन तोड़ दिया’ साहस और संकल्प के टूटने को स्वाभाविक हिंदी में व्यक्त करता है; सामूहिक एकवचन לֵב भी ‘मन’ में बना रहता है।
- source_word: לְבִלְתִּי בֹא אֶל הָאָרֶץ
  choice: कि वे उस देश में न जाएँ
  rationale: לְבִלְתִּי और क्रियार्थक रूप निषेधात्मक परिणाम या रोक को व्यक्त करते हैं। ‘ऐसा ... कि ... न जाएँ’ कारण और परिणाम को स्पष्ट रखता है।
- source_word: אֲשֶׁר נָתַן לָהֶם יְהוָה
  choice: जिसे यहोवा ने उन्हें दिया था
  rationale: पूर्ण क्रिया נתן को पूर्वकालिक संदर्भ में ‘दिया था’ और יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना प्रस्तुत करता है; संभावित उच्चारण ‘याहवे’ को पादटिप्पणी में रखा गया है।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: यह मानक राष्ट्रीय और वाचागत पद है। ‘इस्राएली’ आधुनिक हिंदी में स्वाभाविक है और किसी केवल पुरुष समूह का अनावश्यक संकेत नहीं देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है। ‘मन ऐसा तोड़ दिया’ स्रोत के सामूहिक ‘हृदय’ और हतोत्साह के कारण बने परिणाम, दोनों को स्वाभाविक हिंदी में सँजोता है।
