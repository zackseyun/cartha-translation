base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/039.yaml
  text: The sons of Machir son of Manasseh went to Gilead and captured it[b][a], and dispossessed the Amorites who were in it.
translation:
  language: hi
  text: मनश्शे के पुत्र माकीर के वंशज गिलाद गए और उसे जीत लिया; फिर उसने[a] वहाँ रहने वाले एमोरियों[b] को बेदखल कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पिछली बहुवचन क्रियाओं के बाद इब्रानी पाठ में यहाँ एकवचन क्रिया, “उसने बेदखल किया,” है। संभव है कि माकीर के वंश को एक सामूहिक इकाई माना गया हो, अथवा यह पाठगत या शैलीगत बदलाव हो। कुछ अनुवाद इसे बहुवचन, “उन्होंने बेदखल किया,” करते हैं।
    reason: textual_variant
  - marker: b
    text: इब्रानी में जातिनाम “एमोरी” एकवचन रूप में है, पर यहाँ वह सामूहिक रूप से एमोरी निवासियों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלְכוּ
  choice: गए
  rationale: यहाँ הלך सामान्य कथात्मक अर्थ ‘जाना’ देता है; मूल पाठ चढ़ने या कूच करने पर विशेष बल नहीं देता।
- source_word: בְּנֵי מָכִיר בֶּן מְנַשֶּׁה
  choice: मनश्शे के पुत्र माकीर के वंशज
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ अनेक लोगों के समूह के लिए यह वंशजों को सूचित करता है। हिंदी में ‘माकीर के पुत्र’ उसके प्रत्यक्ष बेटों का भ्रामक अर्थ दे सकता है, इसलिए वंशगत संबंध स्पष्ट किया गया है।
- source_word: גִּלְעָדָה
  choice: गिलाद गए
  rationale: दिशासूचक ה स्थान की ओर गति बताता है; स्वाभाविक हिंदी में ‘गिलाद गए’ पर्याप्त है।
- source_word: וַיִּלְכְּדֻהָ
  choice: उस पर अधिकार कर लिया
  rationale: לכד किसी स्थान को सैन्य रूप से पकड़ने या जीत लेने को दर्शाता है। ‘अधिकार कर लिया’ वर्तमान हिंदी में सहज है और स्त्रीलिंग प्रत्यय का संदर्भ गिलाद से जोड़ता है।
- source_word: וַיּוֹרֶשׁ
  choice: उसने ... बेदखल कर दिया
  rationale: मसोरेटी पाठ का क्रियारूप एकवचन पुल्लिंग है। ‘उसने’ उस असामान्य एकवचन को सुरक्षित रखता है; ירש के हिफ़ील में किसी को उसके भूभाग से वंचित करने का अर्थ ‘बेदखल करना’ उपयुक्त रूप से व्यक्त होता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: मूल में जातिनाम व्याकरणतः एकवचन है, किंतु सामूहिक अर्थ रखता है; हिंदी बहुवचन निवासियों के समूह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר בָּהּ
  choice: वहाँ रहने वाले
  rationale: संबंधवाचक वाक्यांश गिलाद में उपस्थित एमोरी निवासियों को सूचित करता है; ‘वहाँ रहने वाले’ स्वाभाविक और अर्थतः सटीक हिंदी है।
