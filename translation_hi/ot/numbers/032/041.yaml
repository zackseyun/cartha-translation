  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पर अधिकार कर लिया’ विजय के प्रसंग को स्पष्ट करता है, जबकि ‘बस्तियाँ’ छोटे ग्राम-समूहों के अर्थ को सामान्य पाठक के लिए स्वाभाविक रखता है।
