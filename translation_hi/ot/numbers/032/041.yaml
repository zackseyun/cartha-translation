source:
  edition: WLC
  text: וְ/יָאִ֤יר בֶּן מְנַשֶּׁה֙ הָלַ֔ךְ וַ/יִּלְכֹּ֖ד אֶת חַוֺּתֵי/הֶ֑ם וַ/יִּקְרָ֥א אֶתְ/הֶ֖ן חַוֺּ֥ת יָאִֽיר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/041.yaml
  text: And Jair son of Manasseh went and captured their villages[a], and he called them Havvoth-jair.
translation:
  language: hi
  text: और मनश्शे का पुत्र याईर गया और उसने उनकी बस्तियों[a] पर अधिकार कर लिया, और उनका नाम हव्वोत-याईर रखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हव्वोत-याईर” का अर्थ “याईर की बस्तियाँ” या “याईर के गाँव” है।
    reason: स्थाननाम के मूल इब्रानी अर्थ और उसकी शब्दगत पुनरावृत्ति को स्पष्ट करना।
lexical_decisions:
- source_word: יָאִיר
  choice: याईर
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; नाम का अनुवाद नहीं किया गया है।
- source_word: בֶּן מְנַשֶּׁה
  choice: मनश्शे का पुत्र
  rationale: इब्रानी रचना का सीधा अर्थ सुरक्षित रखा गया है; यद्यपि वंशावली के संदर्भ में इसका अर्थ वंशज भी हो सकता है।
- source_word: הָלַךְ
  choice: गया
  rationale: कथात्मक क्रम में सरल और स्वाभाविक हिन्दी रूप, दिशा या उद्देश्य जोड़े बिना।
- source_word: וַיִּלְכֹּד
  choice: पर अधिकार कर लिया
  rationale: लכד सैन्य अथवा क्षेत्रीय संदर्भ में पकड़ने या अपने अधिकार में लेने को दर्शाता है; बस्तियों के लिए यह हिन्दी में स्वाभाविक है।
- source_word: חַוֺּתֵיהֶם
  choice: उनकी बस्तियों
  rationale: חַוּוֹת छोटी, संभवतः अरक्षित ग्राम-बस्तियों को सूचित करता है; ‘बस्तियाँ’ अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְרָא אֶתְהֶן
  choice: उनका नाम ... रखा
  rationale: वस्तुओं या स्थानों के नामकरण के संदर्भ में קרא का स्वाभाविक हिन्दी रूप।
- source_word: חַוֺּת יָאִיר
  choice: हव्वोत-याईर
  rationale: यह स्थाननाम है, इसलिए मुख्य पाठ में उसका लिप्यंतरण रखा गया है और अर्थ पादटिप्पणी में दिया गया है।
