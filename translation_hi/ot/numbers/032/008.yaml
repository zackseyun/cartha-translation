  register: आधुनिक, गरिमापूर्ण और सहज मानक हिंदी। वाक्यक्रम हिंदी की स्वाभाविक कालवाचक संरचना के अनुसार बदला गया है। “पुरखाओं” सामान्य पाठकों के लिए “पितरों” से अधिक सहज है; “देखने” स्रोत की शब्दगत व्यापकता बनाए रखता है।
