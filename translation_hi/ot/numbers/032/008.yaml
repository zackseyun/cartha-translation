base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/008.yaml
  text: This is what your fathers did when I sent them from Kadesh-barnea to see the land:[a]
translation:
  language: hi
  text: तुम्हारे पुरखों ने भी ऐसा ही किया था—जब मैंने उन्हें कादेश-बर्नेआ से उस देश को देखने[a] के लिए भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उस देश का जायज़ा लेने” अथवा “उस देश की टोह लेने।” इब्रानी क्रिया का शाब्दिक अर्थ “देखना” है, पर इस प्रसंग में उसका आशय देश का निरीक्षण करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה עָשׂוּ
  choice: उन्होंने भी ऐसा ही किया था
  rationale: כֹּה तुलना करते हुए पहले के व्यवहार की ओर संकेत करता है। हिंदी में “भी ऐसा ही” वर्तमान प्रसंग और पिछली पीढ़ी के समान आचरण को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखाओं
  rationale: यह संबोधित लोगों से पहले की पीढ़ी को दर्शाता है। “पुरखाओं” स्रोत के पितृ/पूर्वज संबंधी भाव को वर्तमान हिंदी में सहज रूप से रखता है।
- source_word: בְּשָׁלְחִי אֹתָם
  choice: जब मैंने ... उन्हें भेजा था
  rationale: בְּ + infinitive construct और प्रथम पुरुष प्रत्यय का यहाँ कालवाचक अर्थ है; “जब मैंने ... भेजा था” उसका स्वाभाविक हिंदी रूप है। हिंदी में अस्पष्ट “उन्हें” के बदले उसी उपवाक्य में “पुरखाओं को” रखा गया है।
- source_word: מִקָּדֵשׁ בַּרְנֵעַ
  choice: कादेश-बर्ने से
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और מן का स्रोत-बिंदु “से” द्वारा व्यक्त है।
- source_word: לִרְאוֹת
  choice: देखने
  rationale: ראה का मूल अर्थ “देखना” है। प्रसंग में भूमि का जायज़ा लेना निहित है, पर मुख्य पाठ में अधिक विशिष्ट व्याख्या थोपे बिना मूल शब्द रखा गया है।
- source_word: אֶת הָאָרֶץ
  choice: उस देश को
  rationale: הָאָרֶץ निश्चित भूभाग की ओर संकेत करता है। प्रसंग में पहले से ज्ञात प्रतिज्ञात भूभाग होने के कारण हिंदी में “उस देश” स्वाभाविक है, जबकि इसे मुख्य पाठ में स्पष्टतः “प्रतिज्ञात देश” कहना स्रोत से अधिक व्याख्यात्मक होता।
