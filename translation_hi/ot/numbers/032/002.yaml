  rationale: यहाँ בְּנֵי संबंधित गोत्रों के सदस्यों को सूचित करता है; आधुनिक हिन्दी में ‘वंशज’ शाब्दिक ‘पुत्रों’ से अधिक स्वाभाविक और प्रसंगानुकूल है।
