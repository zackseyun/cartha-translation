  text: וּ/מִקְנֶ֣ה רַ֗ב הָיָ֞ה לִ/בְנֵ֧י רְאוּבֵ֛ן וְ/לִ/בְנֵי גָ֖ד עָצ֣וּם מְאֹ֑ד וַ/יִּרְא֞וּ אֶת אֶ֤רֶץ יַעְזֵר֙ וְ/אֶת אֶ֣רֶץ גִּלְעָ֔ד וְ/הִנֵּ֥ה הַ/מָּק֖וֹם מְק֥וֹם מִקְנֶֽה׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/001.yaml
  text: The sons of Reuben and the sons of Gad had a very great amount of livestock[a], and they saw the land of Jazer and the land of Gilead, and behold[b], the place was a place for livestock.
translation:
  language: hi
  text: रूबेन के पुत्रों और गाद के पुत्रों के पास बहुत ही अधिक पशुधन[a] था। उन्होंने याज़ेर की भूमि और गिलाद की भूमि को देखा, और देखो, वह स्थान पशुधन के लिए उपयुक्त स्थान था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रूबेनियों और गादियों के पास बहुत अधिक पशुधन था।” इब्रानी में शाब्दिक रूप से “रूबेन के पुत्रों और गाद के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: या “वह स्थान पशुधन के लिए एक स्थान था।” इब्रानी में बल देने के लिए “स्थान” शब्द दोहराया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִקְנֶה רַב ... עָצוּם מְאֹד
  choice: बहुत बड़ी संख्या में पशुधन
  rationale: מִקְנֶה व्यापक रूप से पाले जाने वाले पशुओं को दर्शाता है, इसलिए संकीर्ण ‘मवेशी’ के बजाय ‘पशुधन’ चुना गया। רַב और עָצוּם מְאֹד मिलकर अत्यधिक बहुतायत पर बल देते हैं, जिसे स्वाभाविक हिन्दी में ‘बहुत बड़ी संख्या’ व्यक्त करती है।
- source_word: לִבְנֵי רְאוּבֵן וְלִבְנֵי גָד
  choice: रूबेन के पुत्रों और गाद के पुत्रों
  rationale: मूल इब्रानी दोनों गोत्रनामों के साथ בְּנֵי को दोहराता है। ‘पुत्रों’ इस संरचना को स्पष्ट रखता है; प्रसंग में इसका अर्थ गोत्रीय वंशजों से है।
- source_word: וַיִּרְאוּ
  choice: उन्होंने ... देखा
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है। साधारण समन्वित कथन मूल में अनकहे कालगत या कारणगत संबंध को जोड़ने से बचता है।
- source_word: אֶרֶץ יַעְזֵר וְאֶרֶץ גִּלְעָד
  choice: याज़ेर की भूमि और गिलाद की भूमि
  rationale: אֶרֶץ की पुनरावृत्ति को ‘भूमि’ की पुनरावृत्ति से सुरक्षित रखा गया है; यह ‘प्रदेश’ या ‘क्षेत्र’ की अपेक्षा अधिक सीधा समतुल्य है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: हִנֵּה खोजी गई बात की ओर पाठक का ध्यान खींचता है। ‘देखो’ उसकी दृश्य और आलंकारिक तत्क्षणता को आधुनिक हिन्दी में बनाए रखता है।
- source_word: הַמָּקוֹם מְקוֹם מִקְנֶה
  choice: वह स्थान पशुधन के लिए उपयुक्त स्थान था
  rationale: ‘स्थान’ की पुनरावृत्ति मूल के बल को बनाए रखती है, जबकि ‘पशुधन के लिए उपयुक्त’ हिन्दी में आशय को स्वाभाविक रूप से व्यक्त करता है और इसे विशेष रूप से ‘चरागाह’ तक सीमित नहीं करता।
