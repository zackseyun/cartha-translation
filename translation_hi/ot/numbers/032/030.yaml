base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/030.yaml
  text: But if they do not cross over armed with you[a], then they shall receive property among you in the land of Canaan.
translation:
  language: hi
  text: परन्तु यदि वे हथियारबन्द होकर तुम्हारे साथ पार न जाएँ, तो उन्हें कनान देश में तुम्हारे बीच सम्पत्ति मिलेगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो वे कनान देश में तुम्हारे बीच बसाए जाएँगे।” इब्रानी क्रिया केवल सम्पत्ति मिलने का कार्य ही नहीं, बल्कि अधिकार में स्थापित किए जाने का भाव भी व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אִם
  choice: परन्तु यदि
  rationale: यह पिछले पद की शर्त के विपरीत सम्भावना प्रस्तुत करता है; इसलिए केवल ‘यदि’ की अपेक्षा ‘परन्तु यदि’ सन्दर्भगत विरोध को स्पष्ट करता है।
- source_word: יַעַבְרוּ
  choice: पार न जाएँ
  rationale: עבר यहाँ यरदन पार करके कनान जाने के भौगोलिक अर्थ में है; हिन्दी में ‘पार जाएँ’ स्वाभाविक है।
- source_word: חֲלוּצִים
  choice: हथियार बाँधकर
  rationale: शब्द युद्ध के लिए सुसज्जित और तैयार होने को दर्शाता है। ‘हथियार बाँधकर’ संक्षिप्त, सहज और सैन्य सन्दर्भ के अनुकूल है।
- source_word: אִתְּ/כֶם
  choice: तुम्हारे साथ
  rationale: यह शेष इस्राएल के साथ मिलकर पार जाने का भाव सीधे व्यक्त करता है।
- source_word: וְ/נֹאחֲזוּ
  choice: तो उन्हें ... सम्पत्ति मिलेगी
  rationale: निफ़अल रूप भूमि में अधिकार या स्थापित भाग प्राप्त होने का निष्क्रिय-परिणामी भाव देता है। यह अनुवाद भूमि-विभाजन के सन्दर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְ/תֹכְ/כֶם
  choice: तुम्हारे बीच
  rationale: यह समुदाय के भीतर स्थान या सहभागिता का अर्थ देता है।
- source_word: בְּ/אֶרֶץ כְּנָעַן
  choice: कनान देश में
  rationale: मूल के पूरे भौगोलिक पदबंध को स्पष्ट और प्रचलित हिन्दी में रखा गया है।
