source:
  edition: WLC
  text: וַ/עֲבָדֶ֨י/ךָ יַֽעַבְר֜וּ כָּל חֲל֥וּץ צָבָ֛א לִ/פְנֵ֥י יְהוָ֖ה לַ/מִּלְחָמָ֑ה כַּ/אֲשֶׁ֥ר אֲדֹנִ֖/י דֹּבֵֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/027.yaml
  text: But your servants will cross over[a], every man armed for battle, before Yahweh for the war[c][b], just as my lord says.
translation:
  language: hi
  text: परन्तु आपके सेवक, हर एक जो युद्ध के लिए सशस्त्र है, याहवे के सामने युद्ध के लिए पार जाएँगे, जैसा मेरे प्रभु कहते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַעֲבָדֶיךָ
  choice: परन्तु आपके सेवक
  rationale: वक्ता मूसा को आदरपूर्वक संबोधित करते हुए अपने लोगों को 'सेवक' कहते हैं; वाव यहाँ पिछले कथन के संदर्भ में हल्का विरोध प्रकट करता है।
- source_word: יַעַבְרוּ
  choice: पार जाएँगे
  rationale: עבר यहाँ सीमा अथवा यरदन पार करके सैन्य अभियान में जाने को सूचित करता है।
- source_word: כָּל חֲלוּץ צָבָא
  choice: हर युद्ध-सज्जित पुरुष
  rationale: כָּל के साथ एकवचन रूप वितरणात्मक अर्थ देता है, और חֲלוּץ צָבָא युद्ध के लिए हथियारों सहित तैयार प्रत्येक व्यक्ति को दर्शाता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्थानिक और उपस्थिति-संबंधी अर्थ सुरक्षित रहता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम 'याहवे' से प्रस्तुत किया गया है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: लामेद यहाँ उद्देश्य की दिशा बताता है; स्वाभाविक हिन्दी में 'युद्ध के लिए' इस प्रयोजन को स्पष्ट रखता है।
- source_word: כַּאֲשֶׁר אֲדֹנִי דֹּבֵר
  choice: जैसा मेरे प्रभु ने कहा है
  rationale: אֲדֹנִי मूसा के लिए आदरसूचक मानवीय संबोधन है; हिन्दी पूर्ण पक्ष वर्तमान प्रसंग में दिए गए निर्देश का स्वाभाविक उल्लेख करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम है; लिप्यंतरण नाम को सामान्य उपाधि से अलग और प्रत्यक्ष बनाए रखता है।
- issue: לִפְנֵי יְהוָה का आशय
  choice: याहवे के सामने
  alternative: याहवे की उपस्थिति में / याहवे के अधिकार में
  rationale: शाब्दिक वाक्यांश उपस्थिति और अधिकार दोनों निहितार्थों के लिए खुला रहता है; किसी एक व्याख्या को मुख्य पाठ में सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज स्वर रखा गया है। 'आपके' और 'मेरे प्रभु' मूसा के प्रति वक्ताओं का आदर दिखाते हैं। डैश जटिल सैन्य पदबंध को स्पष्ट करता है, जबकि मूल वाक्य का क्रम पर्याप्त रूप से सुरक्षित रहता है।
