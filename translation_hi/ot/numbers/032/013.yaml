source:
  edition: WLC
  text: וַ/יִּֽחַר אַ֤ף יְהוָה֙ בְּ/יִשְׂרָאֵ֔ל וַ/יְנִעֵ/ם֙ בַּ/מִּדְבָּ֔ר אַרְבָּעִ֖ים שָׁנָ֑ה עַד תֹּם֙ כָּל הַ/דּ֔וֹר הָ/עֹשֶׂ֥ה הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/013.yaml
  text: So Yahweh’s anger burned against Israel[a], and he made them wander in the wilderness forty years[b], until all the generation that had done evil in the sight of Yahweh had come to an end.
translation:
  language: hi
  text: इसलिए यहोवा का क्रोध इस्राएल पर भड़क उठा[a], और उसने उन्हें चालीस वर्ष तक वीराने में भटकाया[b], जब तक कि सारी पीढ़ी, जिसने यहोवा की दृष्टि में बुरा किया था, समाप्त न हो गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा इस्राएल पर क्रोधित हुआ।” हिब्रू में शाब्दिक रूप से, “यहोवा की नाक जल उठी”; यह क्रोध का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसने उन्हें वीराने में भटकने को विवश किया।” मूल क्रिया कारणवाचक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר אַף
  choice: क्रोध भड़क उठा
  rationale: यह हिब्रू के ‘क्रोध जलने’ वाले सजीव मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; केवल ‘क्रोधित हुआ’ मूल बिंब को सपाट कर देता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: क्रोध के लक्ष्य को हिन्दी में स्वाभाविक रीति से व्यक्त करता है।
- source_word: וַיְנִעֵם
  choice: उसने उन्हें ... भटकाया
  rationale: 'हिफ़ील रूप का कारणवाचक बल बनाए रखता है: यह केवल उनके भटकने की नहीं, बल्कि यहोवा द्वारा उन्हें भटकाए जाने की बात है।'
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: निर्गमन-प्रसंग के निर्जन, अनाबाद क्षेत्र का अर्थ देता है और ‘रेगिस्तान’ की अपेक्षा भूगोल को अनावश्यक रूप से संकीर्ण नहीं करता।
- source_word: עַד תֹּם כָּל הַדּוֹר
  choice: जब तक वह पूरी पीढ़ी समाप्त न हो गई
  rationale: תֹּם के पूर्णतः अंत हो जाने के भाव और כָּל की समग्रता को सहज हिन्दी में सुरक्षित रखता है।
- source_word: הָעֹשֶׂה הָרַע
  choice: जिसने वह किया था जो ... बुरा था
  rationale: सामूहिक एकवचन ‘पीढ़ी’ के अनुरूप एकवचन संबंधवाचक वाक्य रखा गया है और הָרַע के नैतिक मूल्यांकन को स्पष्ट किया गया है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: हिब्रू के मूल्यांकनसूचक मुहावरे का स्वाभाविक और प्रतिष्ठित हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: ईश्वरीय क्रोध का चित्रण
  choice: यहोवा का क्रोध भड़क उठा
  alternative: यहोवा इस्राएल पर क्रोधित हुआ
  rationale: चुना गया रूप मूल के जलते/भड़कते क्रोध के रूपक और न्याय की तीव्रता को बनाए रखता है, बिना कोई अतिरिक्त धर्मवैज्ञानिक व्याख्या जोड़े।
- issue: वीराने में भटकने का कर्ता और कारण
  choice: उसने उन्हें ... भटकाया
  alternative: वे ... भटकते रहे
  rationale: हिब्रू का कारणवाचक क्रियारूप इस घटना को यहोवा के न्यायपूर्ण कार्य के रूप में प्रस्तुत करता है; उसे केवल मानवीय भटकाव में नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भड़क उठा’ मूल की सजीवता बचाता है; ‘वीराना’ מִדְבָּר को केवल बालू वाले रेगिस्तान तक सीमित नहीं करता। वाक्य की ऐतिहासिक-न्यायात्मक गंभीरता बनाए रखी गई है।
