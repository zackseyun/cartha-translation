  text: और बेत-निम्रा और बेत-हारान, किलेबंद नगर और भेड़ों के बाड़े बनाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בֵּית נִמְרָה
  choice: बेत-निम्रा
  rationale: यह स्थान-नाम है; בֵּית को अलग से ‘घर’ अनुवाद करने के बजाय नाम के अंग ‘बेत’ के रूप में लिप्यंतरित किया गया है।
- source_word: בֵּית הָרָן
  choice: बेत-हारान
  rationale: यह स्थापित नगर-नाम है, इसलिए अर्थानुवाद ‘हारान का घर’ के बजाय लिप्यंतरण किया गया है।
- source_word: עָרֵי מִבְצָר
  choice: गढ़वाले नगर
  rationale: यह पदबंध सुरक्षा के लिए सुदृढ़ किए गए नगरों को दर्शाता है; ‘गढ़वाले नगर’ स्वाभाविक और संक्षिप्त हिन्दी है।
- source_word: גִדְרֹת צֹאן
  choice: भेड़-बकरियों के बाड़े
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, का सामूहिक सूचक हो सकता है; यह अनुवाद उसके दायरे और चरवाही के संदर्भ को स्पष्ट रखता है।
- source_word: וְאֶת ... וְאֶת ... וְ
  choice: और ... और ... और
  rationale: दोहराया गया संयोजक पिछले पद से चली आ रही सूची को आगे बढ़ाता है; אֵת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: '[ellipsis from preceding verbal clause]'
  choice: बनाए
  rationale: हिब्रू में क्रिया पिछले पद ‘उन्होंने बनाया’ से यहाँ भी लागू होती है; स्वतंत्र हिन्दी पद के रूप में अर्थ पूर्ण करने के लिए इसे अंत में व्यक्त किया गया है।
