source:
  edition: WLC
  text: וְ/הִנֵּ֣ה קַמְתֶּ֗ם תַּ֚חַת אֲבֹ֣תֵי/כֶ֔ם תַּרְבּ֖וּת אֲנָשִׁ֣ים חַטָּאִ֑ים לִ/סְפּ֣וֹת ע֗וֹד עַ֛ל חֲר֥וֹן אַף יְהוָ֖ה אֶל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/014.yaml
  text: And behold[a], you have risen up in your fathers’ place, a brood of sinful men[b], to add still more to the burning anger of Yahweh against Israel.
translation:
  language: hi
  text: और देखो, तुम अपने पुरखाओं के स्थान पर उठ खड़े हुए हो—पापी पुरुषों की संतान[a]—जिससे इस्राएल के विरुद्ध याहवे का धधकता क्रोध[b] और भी बढ़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पापी पुरुषों की बढ़ती हुई टोली” अथवा “पापी पुरुषों की उपज।” इब्रानी शब्द वृद्धि और संतान/वंश, दोनों का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “याहवे की नाक की धधक पर”; यह तीव्र क्रोध के लिए इब्रानी मुहावरा है। वाक्य में आशय है कि उस क्रोध में और वृद्धि हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह पद के आरम्भ में मूसा की जोरदार चेतावनी और ध्यान खींचने वाले भाव को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: קַמְתֶּם תַּחַת אֲבֹתֵיכֶם
  choice: तुम अपने पुरखाओं के स्थान पर उठ खड़े हुए हो
  rationale: קום के उठने वाले बिंब और תחת के पीढ़ीगत उत्तराधिकार, दोनों को सुरक्षित रखता है; साथ ही आरोपपूर्ण स्वर भी बना रहता है।
- source_word: תַּרְבּוּת אֲנָשִׁים חַטָּאִים
  choice: पापी पुरुषों की संतान
  rationale: תַּרְבּוּת का अर्थ वृद्धि, वंश या उत्पन्न समूह हो सकता है। ‘संतान’ पीढ़ीगत संदर्भ में स्वाभाविक है और अस्पष्टता को अनावश्यक रूप से किसी अधिक अपमानसूचक शब्द से सीमित नहीं करती। אֲנָשִׁים का पुरुषवाची भाव भी रखा गया है।
- source_word: לִסְפּוֹת עוֹד
  choice: और भी बढ़ाओ
  rationale: पहले से विद्यमान क्रोध में आगे वृद्धि करने का भाव संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: חֲרוֹן אַף
  choice: धधकते क्रोध
  rationale: यह इब्रानी मुहावरे के तीव्र, जलते हुए क्रोध के बिंब को बनाए रखता है, यद्यपि ‘नाक’ का शाब्दिक अंग हिन्दी में स्वाभाविक नहीं होगा।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: אֶל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: क्रोध से जुड़े प्रयोग में אֶל उस समुदाय को सूचित करता है जिसकी ओर क्रोध निर्देशित है; ‘के विरुद्ध’ हिन्दी में यह संबंध स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी विशिष्ट सांप्रदायिक व्याख्या को जोड़े बिना प्रस्तुत करता है।
- issue: אֲנָשִׁים חַטָּאִים में लिंगसूचक भाषा
  choice: पापी पुरुषों
  alternative: पापी लोग अथवा पापी जन
  rationale: मूल में स्पष्ट रूप से पुरुषवाची बहुवचन है और संबोधन गोत्रों के पुरुष अगुओं से है; इसलिए ‘पुरुषों’ मूल की विशेषता को सुरक्षित रखता है।
- issue: תַּרְבּוּת का नकारात्मक पीढ़ीगत अर्थ
  choice: संतान
  alternative: बढ़ती हुई टोली अथवा झुंड
  rationale: शब्द वृद्धि और उत्पत्ति/वंश दोनों का संकेत दे सकता है। ‘संतान’ पीढ़ीगत आरोप को बनाए रखती है, जबकि निंदा का स्वर आसपास के ‘पापी’ और पूरे वाक्य से स्पष्ट रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से सहज रखी गई है। ‘पुरखाओं’ से पीढ़ीगत संदर्भ स्वाभाविक बनता है; ‘उठ खड़े हुए’ मूल बिंब और आरोपपूर्ण लहजे को बचाता है। विराम-चिह्नों द्वारा ‘पापी पुरुषों की संतान’ को व्याख्यात्मक आरोप के रूप में स्पष्ट किया गया है।
