base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/022.yaml
  text: and the land is subdued before Yahweh[a], then afterward you may return and be free of obligation to Yahweh and to Israel[b], and this land shall be yours as a possession before Yahweh.
translation:
  language: hi
  text: और जब यह भूमि याहवे[a] के सामने वश में कर ली जाए, तब उसके बाद तुम लौट सकोगे और याहवे तथा इस्राएल के प्रति दायित्व से मुक्त[b] होगे; और यह भूमि याहवे के सामने तुम्हारी संपत्ति होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘याहवे’ परमेश्वर के नाम יהוה (YHWH) का लिप्यंतरण है।
    reason: divine_name
  - marker: b
    text: या, ‘याहवे और इस्राएल के सामने निर्दोष।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנִכְבְּשָׁה הָאָרֶץ
  choice: और जब देश ... अधीन कर लिया जाए
  rationale: निफ़अल रूप देश के अधीन किए जाने की निष्क्रिय/परिणामी धारणा व्यक्त करता है। प्रसंग की शर्तात्मक क्रमबद्धता को हिन्दी में ‘जब ... जाए’ से स्वाभाविक रूप दिया गया है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का मूल अर्थ ‘के सामने/उपस्थिति में’ है; यह वाचा और जवाबदेही की छाया को बनाए रखता है। יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: וְאַחַר תָּשֻׁבוּ
  choice: तब उसके बाद तुम लौट सकोगे
  rationale: यह पहले दायित्व पूरा होने के बाद होने वाली वापसी को बताता है। ‘लौट सकोगे’ भावी अनुमति/संभावना को सहज आधुनिक हिन्दी में व्यक्त करता है, बिना इसे कठोर आज्ञा बनाने के।
- source_word: וִהְיִיתֶם נְקִיִּים מֵיְהוָה וּמִיִּשְׂרָאֵל
  choice: याहवे तथा इस्राएल के प्रति अपने दायित्व से मुक्त होगे
  rationale: נָקִי का अर्थ निर्दोष होने के साथ किसी दायित्व या उत्तरदायित्व से मुक्त होना भी हो सकता है। यहाँ सैन्य प्रतिज्ञा पूरी करने का प्रसंग होने से दायित्व का भाव प्रमुख है; विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַאֲחֻזָּה
  choice: अधिकार की भूमि
  rationale: אֲחֻזָּה स्थायी भू-स्वामित्व या भू-अधिकार को दर्शाता है। ‘अधिकार की भूमि’ सामान्य पाठक के लिए स्पष्ट है और ‘वंशानुगत’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका निकट प्रचलित हिन्दी लिप्यंतरण है; पादटिप्पणी इसकी पहचान स्पष्ट करती है।
- issue: वाचा-संबंधी प्रसंग में נְקִיִּים का अर्थ
  choice: दायित्व से मुक्त
  alternative: निर्दोष; दोषमुक्त
  rationale: मूसा प्रतिज्ञाबद्ध दायित्व पूरा करने के बाद परमेश्वर और इस्राएल के प्रति उत्तरदायित्व समाप्त होने की बात कर रहा है। फिर भी शब्द का नैतिक/न्यायिक अर्थ संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अधीन कर लिया जाए’ मूल के निष्क्रिय भाव को, ‘दायित्व से मुक्त’ प्रसंगगत जवाबदेही को और ‘अधिकार की भूमि’ भू-स्वामित्व के अर्थ को व्यक्त करता है।
