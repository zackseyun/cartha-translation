  yaml_path: translation/ot/numbers/032/016.yaml
  text: Then they came near to him and said[a], “We will build sheepfolds here for our livestock, and cities for our little ones.”
translation:
  language: hi
  text: तब वे उसके पास आए और बोले, “हम यहाँ अपने पशुधन के लिए भेड़ों के बाड़े और अपने बाल-बच्चों[a] के लिए नगर बनाएँगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बच्चों के लिए।” इब्रानी शब्द טַף छोटे बच्चों या आश्रितों को दर्शाता है और प्रायः समुदाय के असुरक्षित सदस्यों पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּגְּשׁוּ אֵלָיו
  choice: वे उसके पास आकर
  rationale: נגשׁ शारीरिक रूप से निकट आने को व्यक्त करता है; ‘उसके पास आकर’ आधुनिक हिन्दी में स्वाभाविक है और इब्रानी गति को बनाए रखता है।
- source_word: וַיֹּאמְרוּ
  choice: बोले
  rationale: प्रत्यक्ष कथन के परिचय में ‘बोले’ सहज हिन्दी कथात्मक प्रयोग है।
- source_word: גִּדְרֹת צֹאן
  choice: बाड़े
  rationale: यह पद झुंड के लिए घिरे हुए स्थानों को दर्शाता है। पशुओं का उल्लेख अगले पदांश में स्पष्ट होने के कारण ‘बाड़े’ संक्षिप्त और स्वाभाविक है।
- source_word: נִבְנֶה
  choice: हम ... बनाएँगे
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ वक्ताओं की मंशा या प्रस्ताव व्यक्त करती है; ‘बनाएँगे’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: לְמִקְנֵנוּ
  choice: अपने पशुओं के लिए
  rationale: מִקְנֶה व्यापक अर्थ में पाले हुए पशुधन को दर्शाता है; ‘पशुओं’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: פֹּה
  choice: यहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी समतुल्य।
- source_word: וְעָרִים
  choice: और ... नगर
  rationale: עָרִים का सीधा बहुवचन अर्थ ‘नगर’ है; आकार के विषय में अनावश्यक विशिष्टीकरण नहीं किया गया।
- source_word: לְטַפֵּנוּ
  choice: अपने बाल-बच्चों के लिए
  rationale: טַף छोटे बच्चों अथवा आश्रित और असुरक्षित घरेलू सदस्यों पर बल दे सकता है। ‘बाल-बच्चों’ में पारिवारिक और छोटे सदस्यों का भाव स्वाभाविक हिन्दी में बना रहता है।
