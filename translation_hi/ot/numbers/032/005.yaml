base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/005.yaml
  text: And they said[a], “If we have found favor in your sight, let this land be given to your servants as a possession. Do not make us cross the Jordan.”
translation:
  language: hi
  text: उन्होंने कहा, “यदि हम आपकी दृष्टि में अनुग्रह पाए हों, तो यह भूमि आपके सेवकों को अधिकार के लिए दी जाए। हमें यरदन के पार न ले जाइए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमें यरदन पार न कराइए।” इब्रानी क्रिया कारणवाचक है और इन दोनों निकट अर्थों में अनूदित की जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מָצָאנוּ חֵן בְּעֵינֶיךָ
  choice: यदि हम पर आपकी कृपा हुई हो
  rationale: यह इब्रानी विनम्र निवेदन का मुहावरा है। हिंदी में यह रूप अनुकूल दृष्टि पाने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֻתַּן
  choice: दे दिया जाए
  rationale: निष्क्रिय क्रिया का विनम्र निवेदनात्मक भाव बनाए रखता है।
- source_word: הָאָרֶץ הַזֹּאת
  choice: यह देश
  rationale: इस प्रसंग में אֶרֶץ निर्दिष्ट भूभाग को दर्शाता है; ‘देश’ आधुनिक हिंदी में सीधा और स्वाभाविक है।
- source_word: לַעֲבָדֶיךָ
  choice: आपके सेवकों को
  rationale: यह मूसा के सामने निवेदकों का विनम्र आत्म-संबोधन है, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: לַאֲחֻזָּה
  choice: उनकी संपत्ति के रूप में
  rationale: אֲחֻזָּה स्थायी भू-अधिकार या धारण की हुई संपत्ति बताता है; यह अनुवाद उस अर्थ को स्पष्ट रखता है।
- source_word: אַל תַּעֲבִרֵנוּ אֶת הַיַּרְדֵּן
  choice: हमें यरदन के पार न ले जाइए
  rationale: עבר का हिफ़ील रूप कारणवाचक है। ‘पार न ले जाइए’ हिंदी में स्वाभाविक है और किसी के द्वारा पार कराए जाने का भाव सुरक्षित रखता है।
