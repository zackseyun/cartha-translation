  text: לֹ֥א נָשׁ֖וּב אֶל בָּתֵּ֑י/נוּ עַ֗ד הִתְנַחֵל֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אִ֖ישׁ נַחֲלָתֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/018.yaml
  text: We will not return to our houses until the sons of Israel have each taken possession of his inheritance[a].
translation:
  language: hi
  text: हम अपने घरों को नहीं लौटेंगे, जब तक इस्राएल के पुत्रों[a] में से हर एक अपना विरासती भाग प्राप्त न कर ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएली।” इब्रानी में, “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא נָשׁוּב
  choice: हम ... नहीं लौटेंगे
  rationale: निषेध के साथ प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ भविष्य के दृढ़ संकल्प को व्यक्त करती है।
- source_word: אֶל בָּתֵּינוּ
  choice: अपने घरों को
  rationale: दिशासूचक संबंध और 'हमारे घर' का भाव स्वाभाविक आधुनिक हिन्दी में इस रूप से व्यक्त होता है।
- source_word: עַד
  choice: जब तक ... तब तक
  rationale: यह उनके न लौटने की समय-सीमा बताता है; हिन्दी में सहसंबंधी रचना वाक्य को स्पष्ट और सहज बनाती है।
- source_word: הִתְנַחֵל
  choice: अधिकारी न हो जाए
  rationale: हित्पएल रूप यहाँ आवंटित पैतृक भूभाग को प्राप्त कर उस पर अधिकार पाने का भाव देता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी की पुरुषवाचक पारिवारिक वाचा-संबंधी अभिव्यक्ति को सीधे सुरक्षित रखता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: इस वितरणात्मक प्रयोग में אִישׁ का अर्थ प्रत्येक व्यक्ति है; 'हर एक' हिन्दी में स्वाभाविक है।
- source_word: נַחֲלָתוֹ
  choice: अपने निज भाग
  rationale: यह प्रत्येक व्यक्ति को मिले विरासती भूमि-भाग का संकेत करता है; 'निज भाग' वितरण और स्वामित्व दोनों को संक्षेप में व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל में लिंगयुक्त वाचा-संबंधी अभिव्यक्ति
  choice: इस्राएल के पुत्र
  alternative: इस्राएली
  rationale: मुख्य पाठ इब्रानी की पारिवारिक और व्याकरणतः पुरुषवाचक अभिव्यक्ति को बनाए रखता है; अधिक प्रचलित सामूहिक रूप को पादटिप्पणी में दिया गया है।
- issue: נחלה का भूमि-विरासत संबंधी अर्थ
  choice: निज भाग
  alternative: विरासत
  rationale: संदर्भ में आशय केवल उत्तराधिकार की अमूर्त धारणा नहीं, बल्कि आवंटित भूभाग है; इसलिए ऐसा पद चुना गया है जो हिस्से और अधिकार दोनों को दर्शाए।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। 'अधिकारी होना' भूमि पर अधिकार पाने का भाव देता है, जबकि 'निज भाग' आवंटित विरासती भूभाग को स्पष्ट करता है।
