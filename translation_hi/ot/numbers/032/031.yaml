id: NUM.32.31
reference: Numbers 32:31
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּֽעֲנ֧וּ בְנֵי גָ֛ד וּ/בְנֵ֥י רְאוּבֵ֖ן לֵ/אמֹ֑ר אֵת֩ אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה אֶל עֲבָדֶ֖י/ךָ כֵּ֥ן נַעֲשֶֽׂה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/031.yaml
  text: Then the sons of Gad and the sons of Reuben answered[a], saying, “As Yahweh has spoken to your servants, so we will do.”
translation:
  language: hi
  text: तब गाद के वंशजों और रूबेन के वंशजों ने उत्तर दिया, “याहवे ने आपके सेवकों से जैसा कहा है, हम वैसा ही करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲנוּ
  choice: उत्तर दिया
  rationale: कथात्मक संदर्भ में ענה बोले गए प्रत्युत्तर का परिचय देता है; ‘उत्तर दिया’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: בְנֵי גָד וּבְנֵי רְאוּבֵן
  choice: गाद के वंशजों और रूबेन के वंशजों
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ दोनों गोत्रों के लोगों का सामूहिक उल्लेख है; ‘वंशज’ अर्थ को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष अलग अनुवाद नहीं
  rationale: उत्तर देने के बाद आने वाला यह वचन-परिचायक हिन्दी के उद्धरण-चिह्नों से स्वाभाविक रूप से व्यक्त हो जाता है; ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता।
- source_word: אֵת אֲשֶׁר ... כֵּן
  choice: जैसा ... वैसा ही
  rationale: यह जोड़ी इब्रानी के सहसंबंधी ढाँचे और आज्ञा के अनुरूप कार्य करने के भाव को स्पष्ट एवं स्वाभाविक हिन्दी में सुरक्षित रखती है।
- source_word: דִּבֶּר
  choice: कहा है
  rationale: पूर्ण क्रिया निकट पूर्ववर्ती वचन को सूचित करती है, जिसकी वर्तमान प्रासंगिकता बनी हुई है; हिन्दी का पूर्ण वर्तमान यहाँ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֶל עֲבָדֶיךָ
  choice: आपके सेवकों से
  rationale: वक्ता मूसा के प्रति विनम्र आत्म-संदर्भ कर रहे हैं; ‘सेवक’ प्रसंगानुकूल है और ‘दास’ से उत्पन्न अनावश्यक बंधुआ स्थिति का संकेत नहीं देता। हिन्दी में ‘किसी से कहना’ स्वाभाविक कारक-प्रयोग है।
- source_word: נַעֲשֶׂה
  choice: हम ... करेंगे
  rationale: עשה यहाँ कही गई बात को पूरा करने का व्यापक अर्थ रखता है; ‘करेंगे’ संक्षिप्त है और स्रोत में निहित न होने वाला अलग कर्म नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसका निकट आधुनिक लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। गोत्रीय समूहों के लिए ‘वंशज’ सामान्य पाठक को ‘पुत्रों’ से अधिक स्पष्ट है। उद्धरण-परिचायक לֵאמֹר को अलग शब्दों में न देकर हिन्दी विराम-चिह्नों और वाक्य-विन्यास में समाहित किया गया है।
