source:
  edition: WLC
  text: אִם יִרְא֨וּ הָ/אֲנָשִׁ֜ים הָ/עֹלִ֣ים מִ/מִּצְרַ֗יִם מִ/בֶּ֨ן עֶשְׂרִ֤ים שָׁנָה֙ וָ/מַ֔עְלָ/ה אֵ֚ת הָ/אֲדָמָ֔ה אֲשֶׁ֥ר נִשְׁבַּ֛עְתִּי לְ/אַבְרָהָ֥ם לְ/יִצְחָ֖ק וּֽ/לְ/יַעֲקֹ֑ב כִּ֥י לֹא מִלְא֖וּ אַחֲרָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/032/011.yaml
  text: Surely none of the men who came up from Egypt[a], from twenty years old and upward, shall see the land that I swore to Abraham, to Isaac, and to Jacob[b], because they have not fully followed me.
translation:
  language: hi
  text: मिस्र से निकलकर आए बीस वर्ष या उससे अधिक आयु के पुरुषों में से कोई भी उस देश को निश्चय ही नहीं देखेगा[a], जिसे देने की शपथ मैंने अब्राहम, इसहाक और याकूब से खाई थी, क्योंकि उन्होंने पूरी तरह मेरा अनुसरण नहीं किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शपथ का सूत्र शाब्दिक रूप से “यदि वे पुरुष ... उस देश को देखेंगे” है; इसका निहित अर्थ प्रबल निषेध है: “उनमें से कोई भी उस देश को निश्चय ही नहीं देखेगा।”'
    reason: lexical_alternative
  - marker: b
    text: या “क्योंकि वे पूरी तरह मेरे पीछे नहीं चले।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם
  choice: कोई भी ... निश्चय ही नहीं देखेगा
  rationale: यहाँ אִם एक अपूर्ण नकारात्मक शपथ-वाक्य का आरम्भ करता है; हिन्दी में प्रबल निषेध के द्वारा इसका आशय स्वाभाविक और स्पष्ट रूप से व्यक्त होता है।
- source_word: יִרְאוּ
  choice: देखेगा
  rationale: यहाँ 'देखना' उस देश तक पहुँचने और उसका अनुभव करने के अर्थ में है; मूल क्रिया की संक्षिप्तता बनाए रखी गई है।
- source_word: הָאֲנָשִׁים
  choice: पुरुष
  rationale: इब्रानी शब्द विशेष रूप से पुल्लिंग बहुवचन है और बीस वर्ष से ऊपर की जनगणना तथा युद्ध-योग्य आयु के संदर्भ से मेल खाता है।
- source_word: הָעֹלִים מִמִּצְרַיִם
  choice: मिस्र से निकलकर आए
  rationale: निर्गमन के संदर्भ में עלה מן का अर्थ मिस्र से ऊपर आना या निकलकर आना है; यह हिन्दी में स्वाभाविक रहते हुए ऐतिहासिक गति को व्यक्त करता है।
- source_word: מִבֶּן עֶשְׂרִים שָׁנָה וָמַעְלָה
  choice: बीस वर्ष या उससे अधिक आयु का
  rationale: यह आयु-सीमा बताने वाला प्रचलित सूत्र है; आधुनिक हिन्दी में स्पष्ट और सहज रूप दिया गया है।
- source_word: הָאֲדָמָה
  choice: देश
  rationale: इस वाचा-संबंधी प्रसंग में शब्द मिट्टी नहीं, प्रतिज्ञात भू-प्रदेश को दर्शाता है।
- source_word: נִשְׁבַּעְתִּי
  choice: शपथ मैंने ... खाई थी
  rationale: यह परमेश्वर के गंभीर वचन का मानक शपथ-सूत्र है; हिन्दी का प्रचलित मुहावरा मूल अर्थ और गंभीरता को रखता है।
- source_word: לְאַבְרָהָם לְיִצְחָק וּלְיַעֲקֹב
  choice: अब्राहम, इसहाक और याकूब से
  rationale: שבע के साथ לְ शपथ के लाभार्थी या संबद्ध व्यक्ति को दर्शाता है; हिन्दी में 'से शपथ खाना' स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह न्यायपूर्ण घोषणा का कारण प्रस्तुत करता है।
- source_word: לֹא מִלְאוּ אַחֲרַי
  choice: उन्होंने पूरी तरह मेरा अनुसरण नहीं किया
  rationale: מלא אחרי का मुहावरा किसी के पीछे पूर्ण रूप से चलने या उसका पूरी तरह अनुसरण करने को दर्शाता है; अमूर्त 'विश्वासयोग्य' जैसे विस्तार से बचा गया है।
theological_decisions:
- issue: אִם से आरम्भ होने वाले शपथ-सूत्र का अनुवाद
  choice: कोई भी ... निश्चय ही नहीं देखेगा
  alternative: यदि वे पुरुष ... देश को देखेंगे
  rationale: इब्रानी में यह प्रबल नकार निहित रखने वाला अपूर्ण शपथ-सूत्र है। शाब्दिक 'यदि' हिन्दी में अर्थ को अस्पष्ट या उलटा कर सकता है; चुना हुआ पाठ उसकी गंभीरता और नकारात्मक निर्णय दोनों सुरक्षित रखता है।
- issue: לֹא מִלְאוּ אַחֲרַי के मुहावरे की सीमा
  choice: उन्होंने पूरी तरह मेरा अनुसरण नहीं किया
  alternative: वे मेरे प्रति पूरी तरह विश्वासयोग्य नहीं रहे
  rationale: मूल पाठ अनुसरण करने की संबंधपरक छवि रखता है। चुना हुआ अनुवाद उसी छवि को बचाता है और उससे व्यापक धर्मवैज्ञानिक धारणा नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'देश' वाचा के भू-प्रदेश को व्यक्त करता है; 'पुरुष' मूल के लिंग-विशिष्ट अर्थ और जनगणना-संदर्भ को बनाए रखता है।
