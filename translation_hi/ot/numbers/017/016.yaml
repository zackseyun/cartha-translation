  text: 'तब याहवे ने मूसा से कहा:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... ने ... कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है। हिन्दी में ‘फिर’ इस प्रगति को स्वाभाविक ढंग से व्यक्त करता है; דבר और उसके बाद לֵאמֹר वाले सूत्र को अनावश्यक दोहराव से बचाते हुए ‘कहा’ में समेटा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में परमेश्वर के व्यक्तिगत नाम के प्रचलित और आसानी से पहचाने जाने वाले रूप ‘यहोवा’ का प्रयोग किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को आधुनिक हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अव्ययीभाव प्रत्यक्ष वचन का परिचय देता है। हिन्दी में ‘यह कहते हुए’ की अपेक्षा ‘कहा’ अधिक स्वाभाविक है, विशेषकर जब अगली आयत में कथन आता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला ईश्वरीय नाम है। हिन्दी पाठकों में स्थापित रूप ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है; ‘याहवे’ विद्वानों में प्रचलित वैकल्पिक लिप्यंतरण है।
translation_notes:
