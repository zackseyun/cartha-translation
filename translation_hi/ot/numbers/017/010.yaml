source:
  edition: WLC
  text: הֵרֹ֗מּוּ מִ/תּוֹךְ֙ הָ/עֵדָ֣ה הַ/זֹּ֔את וַ/אֲכַלֶּ֥ה אֹתָ֖/ם כְּ/רָ֑גַע וַֽ/יִּפְּל֖וּ עַל פְּנֵי/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/010.yaml
  text: Rise up from the midst of this congregation[a], so that I may consume them in a moment[b]. And they fell on their faces.
translation:
  language: hi
  text: “इस मंडली के बीच से हट जाओ[a], ताकि मैं इन्हें एक ही पल में मिटा डालूँ[b]।” तब वे मुँह के बल गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस सभा के बीच से अलग हो जाओ।”
    reason: lexical_alternative
  - marker: b
    text: या, “ताकि मैं इन्हें एक क्षण में नष्ट कर दूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הֵרֹמּוּ
  choice: हट जाओ
  rationale: निफ़ाल बहुवचन आज्ञार्थक यहाँ मंडली के बीच से अलग हो जाने की तात्कालिक आज्ञा के रूप में प्रयुक्त है। शाब्दिक ‘ऊपर उठ जाओ’ हिन्दी में आशय स्पष्ट नहीं करता; ‘हट जाओ’ क्रिया की प्रसंगगत शक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִתּוֹךְ
  choice: के बीच से
  rationale: यह समूह के भीतर से बाहर होने या अलग होने का भाव व्यक्त करता है और हिब्रू संरचना के निकट है।
- source_word: הָעֵדָה הַזֹּאת
  choice: इस मंडली
  rationale: עֵדָה इस्राएल के एकत्र समुदाय को दर्शाता है। ‘मंडली’ आधुनिक हिन्दी में सामूहिक अर्थ रखता है और अनावश्यक रूप से केवल उपासना-सभा तक सीमित नहीं करता।
- source_word: וַאֲכַלֶּה
  choice: ताकि मैं ... मिटा डालूँ
  rationale: पिएल रूप पूर्णतः समाप्त कर देने या नष्ट कर देने का प्रबल भाव रखता है। ‘मिटा डालूँ’ आसन्न और सम्पूर्ण विनाश की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֹתָם
  choice: इन्हें
  rationale: निकट उल्लिखित मंडली को प्रत्यक्ष कर्म के रूप में सूचित करता है; हिन्दी में ‘इन्हें’ प्रसंगानुकूल है।
- source_word: כְּרָגַע
  choice: एक ही पल में
  rationale: अत्यन्त थोड़े समय और निर्णय की तात्कालिकता को व्यक्त करता है।
- source_word: וַיִּפְּלוּ
  choice: तब वे ... गिर पड़े
  rationale: वय्यिक्तोल कथात्मक क्रम में अगली प्रतिक्रिया बताता है; ‘तब’ हिन्दी में घटनाक्रम को सहज बनाता है।
- source_word: עַל פְּנֵיהֶם
  choice: मुँह के बल
  rationale: भूमि पर दण्डवत गिरने के हिब्रू मुहावरे को प्राकृतिक आधुनिक हिन्दी में व्यक्त करता है, बिना भय, विनती या उपासना में से किसी एक उद्देश्य को आरोपित किए।
theological_decisions:
- issue: मूसा और हारून को दी गई ईश्वरीय आज्ञा का स्वरूप
  choice: मंडली के बीच से तत्काल हट जाने की आज्ञा और उसके बाद आसन्न सम्पूर्ण विनाश की घोषणा
  alternative: ‘ऊपर उठ जाओ’ या अपेक्षाकृत हल्का ‘एक ओर हो जाओ’
  rationale: हिब्रू आज्ञा प्रसंग में अलग हो जाने को कहती है, और अगला उपवाक्य न्याय की कठोरता तथा तात्कालिकता स्पष्ट करता है। अनुवाद धमकी को नरम नहीं करता और दण्डवत गिरने के उद्देश्य को भी निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘हट जाओ’ प्रसंगगत आज्ञा को स्वाभाविक बनाता है; पादटिप्पणी अधिक स्पष्ट ‘अलग हो जाओ’ विकल्प सुरक्षित रखती है। ‘मुँह के बल’ दण्डवत मुद्रा बताता है, पर उसके धार्मिक या भावनात्मक उद्देश्य को अनिर्णीत छोड़ता है।
