- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी पदबंध का शाब्दिक और वाचाई रूप सुरक्षित रखा गया है; पाठक की सुविधा के लिए ‘इस्राएली’ विकल्प पादटिप्पणी में दिया गया है।
- source_word: נְשִׂיאֵיהֶם
  choice: उनके सभी प्रधानों
