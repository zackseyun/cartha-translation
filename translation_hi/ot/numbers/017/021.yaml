- source_word: מַטֶּה
  choice: छड़ी
  rationale: यहाँ शब्द उस भौतिक दंड/छड़ी के लिए है जिसे प्रतिनिधि चिह्न के रूप में सौंपा गया; ‘छड़ी’ आधुनिक हिन्दी में सहज है।
- source_word: מַטֶּה לְנָשִׂיא אֶחָד ... מַטֶּה לְנָשִׂיא אֶחָד
