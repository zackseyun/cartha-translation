- source_word: לְבֵית אֲבֹתָם
  choice: उसके पितृकुल के अनुसार
  rationale: यह पदबंध पैतृक वंश पर आधारित कुलीय प्रतिनिधित्व बताता है; ‘पितृकुल’ संक्षिप्त और अर्थ-सटीक है।
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: कुल बारह छड़ियाँ
  rationale: संख्या को स्पष्ट किया गया है और מַטֶּה के अनुवाद में एकरूपता रखी गई है।
- source_word: וּמַטֵּה אַהֲרֹן בְּתוֹךְ מַטּוֹתָם
  choice: और हारून की छड़ी भी उनकी छड़ियों के बीच थी
  rationale: इब्रानी के क्रियारहित उपवाक्य के लिए हिन्दी में ‘थी’ जोड़ा गया; בְּתוֹךְ का ‘बीच’ समावेश की स्थिति को बनाए रखता है।
