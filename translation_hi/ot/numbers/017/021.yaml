base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/021.yaml
  text: So Moses spoke to the sons of Israel[a], and all their leaders gave him a staff, one staff for each leader according to their fathers’ houses, twelve staffs; and Aaron’s staff was among their staffs.
translation:
  language: hi
  text: तब मूसा ने इस्राएल के पुत्रों[a] से कहा, और उनके सभी प्रधानों ने उसे एक-एक छड़ी दी—अपने-अपने पितृकुल के अनुसार हर प्रधान की एक छड़ी—कुल बारह छड़ियाँ; और हारून की छड़ी उनकी छड़ियों के बीच थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है, जो इस्राएल की प्रजा के लिए वाचा से जुड़ा एक प्रचलित पदनाम है।
    reason: lexical_alternative
