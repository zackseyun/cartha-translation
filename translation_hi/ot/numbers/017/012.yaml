source:
  edition: WLC
  text: וַ/יִּקַּ֨ח אַהֲרֹ֜ן כַּ/אֲשֶׁ֣ר דִּבֶּ֣ר מֹשֶׁ֗ה וַ/יָּ֨רָץ֙ אֶל תּ֣וֹך הַ/קָּהָ֔ל וְ/הִנֵּ֛ה הֵחֵ֥ל הַ/נֶּ֖גֶף בָּ/עָ֑ם וַ/יִּתֵּן֙ אֶֽת הַ/קְּטֹ֔רֶת וַ/יְכַפֵּ֖ר עַל הָ/עָֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/012.yaml
  text: So Aaron took it[a], just as Moses had spoken, and ran into the midst of the assembly. And behold, the plague had begun among the people[b], so he put the incense on and made atonement for the people.
translation:
  language: hi
  text: तब हारून ने उसे लिया[a], ठीक वैसे ही जैसे मूसा ने कहा था, और सभा के बीच दौड़कर गया। और देखो, लोगों के बीच महामारी आरम्भ हो चुकी थी; तब उसने धूप डाली[b] और लोगों के लिए प्रायश्चित किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘लिया’ का कर्म स्पष्ट रूप से नहीं दिया गया है; वह पिछले पद के संदर्भ से समझा जाता है।
    reason: implicit_object
  - marker: b
    text: या, “धूप रखी”; इब्रानी का शाब्दिक भाव है, “धूप दी/रखी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: उसने उसे लिया
  rationale: क्रिया का मूल अर्थ ‘लेना’ है। कर्म पिछले पद के संदर्भ से समझा जाता है; स्वाभाविक हिन्दी के लिए ‘उसे’ जोड़ा गया है, बिना यह तय किए कि संकेत केवल धूपदान की ओर है या पूरी तैयार वस्तु की ओर।
- source_word: כַּאֲשֶׁר דִּבֶּר מֹשֶׁה
  choice: ठीक वैसे ही जैसे मूसा ने कहा था
  rationale: דבר का अर्थ ‘कहना/बोलना’ है। संदर्भ में बात आदेशात्मक है, पर अनुवाद में ‘आज्ञा दी’ कहकर अर्थ को अधिक विशिष्ट नहीं किया गया।
- source_word: וַיָּרָץ אֶל־תּוֹךְ הַקָּהָל
  choice: सभा के बीच दौड़कर गया
  rationale: רוץ को स्पष्ट रूप से ‘दौड़ना’ और קהל को इस्राएल के एकत्र समुदाय के अर्थ में सहज आधुनिक हिन्दी ‘सभा’ से व्यक्त किया गया है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הנה दृश्य की आकस्मिकता और पाठक का ध्यान खींचने वाला बल रखता है; ‘और देखो’ इसे आधुनिक, गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: הֵחֵל הַנֶּגֶף בָּעָם
  choice: लोगों के बीच महामारी आरम्भ हो चुकी थी
  rationale: נגף यहाँ दैवी दंड के रूप में फैली महामारी है। ‘आरम्भ हो चुकी थी’ कथा में उस समय तक क्रिया शुरू हो जाने का भाव देता है।
- source_word: וַיִּתֵּן אֶת־הַקְּטֹרֶת
  choice: उसने धूप डाली
  rationale: נתן का मूल भाव ‘देना/रखना/डालना’ है। अनुष्ठानिक संदर्भ में ‘धूप डाली’ ठोस क्रिया को सहज हिन्दी में व्यक्त करता है और ‘अर्पित की’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: וַיְכַפֵּר עַל־הָעָם
  choice: लोगों के लिए प्रायश्चित किया
  rationale: याजकीय संदर्भ में כפר के लिए ‘प्रायश्चित करना’ स्थापित और अर्थपूर्ण हिन्दी पद है; यह क्रिया का धार्मिक भार बनाए रखता है, पर उसकी विधि को पाठ से आगे जाकर परिभाषित नहीं करता।
theological_decisions:
- issue: याजकीय क्रिया כפר का अनुवाद
  choice: लोगों के लिए प्रायश्चित किया
  alternative: लोगों का दोष-निवारण किया
  rationale: ‘प्रायश्चित किया’ हिन्दी बाइबलीय प्रयोग में परिचित है और याजकीय मध्यस्थता तथा दैवी दंड के रुकने से जुड़े धार्मिक भार को सुरक्षित रखता है। ‘दोष-निवारण’ अधिक तकनीकी और तंत्र को अधिक निश्चित करने वाला हो सकता है।
- issue: קָהָל का अनुवाद
  choice: सभा
  alternative: मण्डली
  rationale: ‘सभा’ एकत्र इस्राएली समुदाय को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और आधुनिक कलीसियाई संस्था का अनावश्यक संकेत नहीं देता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘और देखो’ से मूल की दृश्यात्मक आकस्मिकता, ‘महामारी’ से प्रसंगगत נגף, और ‘प्रायश्चित’ से याजकीय धार्मिक अर्थ सुरक्षित रखा गया है।
