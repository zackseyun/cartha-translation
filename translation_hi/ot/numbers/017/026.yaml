base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/026.yaml
  text: And Moses did just as Yahweh commanded him; so he did.
translation:
  language: hi
  text: और मूसा ने ठीक वैसा ही किया जैसा याहवे ने उसे आज्ञा दी थी; उसने वैसा ही किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने...किया
  rationale: עשה का अर्थ व्यापक रूप से ‘करना/बनाना’ है; आज्ञापालन के इस प्रसंग में ‘किया’ स्वाभाविक है और अंतिम क्रिया की पुनरावृत्ति भी बनाए रखता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का मानक और प्रचलित हिन्दी रूप।
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसा ही...जैसा
  rationale: यह आज्ञा के अनुरूप कार्य करने का भाव व्यक्त करता है; ‘ठीक वैसा ही’ सटीक अनुरूपता पर बल देता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: צוה अधिकारपूर्वक आदेश देने को दर्शाता है; ‘आज्ञा दी’ हिन्दी में इसके बल और गरिमा को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी बाइबल-परंपरा में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: אֹתוֹ
  choice: उसे
  rationale: प्रत्यक्ष कर्मचिह्न के साथ तृतीय पुरुष एकवचन पुल्लिंग प्रत्यय मूसा की ओर संकेत करता है; हिन्दी में स्वाभाविक रूप ‘उसे’ है।
- source_word: כֵּן
  choice: वैसा ही
  rationale: यह पूर्ववर्ती अनुरूपता को फिर से पुष्ट और बल देता है; ‘वैसा ही’ हिन्दी में उस संदर्भ को स्पष्ट रूप से ग्रहण करता है।
- source_word: עָשָׂה
  choice: उसने...किया
  rationale: मूल पाठ में עשה की जानबूझकर की गई पुनरावृत्ति मूसा के पूर्ण आज्ञापालन पर बल देती है; हिन्दी में क्रिया दोहराकर यह बल सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए ‘प्रभु’ जैसी उपाधि के स्थान पर नाम का लिप्यंतरण रखा गया। हिन्दी पाठकों में ‘यहोवा’ अधिक स्थापित और तुरंत पहचाना जाने वाला रूप है, यद्यपि ‘याहवे’ को विद्वत्तापूर्ण पुनर्निर्माण के अधिक निकट माना जाता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। मूल इब्रानी में ‘किया’ की पुनरावृत्ति को अनावश्यक समझकर हटाया नहीं गया, क्योंकि वही वाक्य का आज्ञापालन-संबंधी बल है।
