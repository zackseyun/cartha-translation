  edition: WLC
  text: וַ/יַּעֲמֹ֥ד בֵּֽין הַ/מֵּתִ֖ים וּ/בֵ֣ין הַֽ/חַיִּ֑ים וַ/תֵּעָצַ֖ר הַ/מַּגֵּפָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/013.yaml
  text: And he stood between the dead and the living, and the plague was stopped.
translation:
  language: hi
  text: और वह मरे हुओं और जीवितों के बीच खड़ा हो गया, और महामारी रुक गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: और वह ... खड़ा हो गया
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ या ‘अपना स्थान लेना’ है। कथात्मक क्रम में ‘खड़ा हो गया’ स्वाभाविक है और किसी अतिरिक्त सैनिक या प्रतीकात्मक अर्थ को नहीं जोड़ता।
- source_word: בֵּין ... וּבֵין
  choice: '... और ... के बीच'
  rationale: दोनों सम्बद्ध पूर्वसर्ग दो समूहों के बीच स्थान को स्पष्ट करते हैं; हिन्दी में यह सीधा और स्वाभाविक समतुल्य है।
- source_word: הַמֵּתִים
  choice: मरे हुओं
  rationale: यह रूप उन लोगों को सूचित करता है जो मर चुके थे। ‘मरे हुओं’ हिन्दी में स्वाभाविक है और ‘जीवितों’ के साथ तीखा विरोध बनाए रखता है।
- source_word: הַחַיִּים
  choice: जीवितों
  rationale: विशेषण का संज्ञा के रूप में प्रयोग उन लोगों के लिए है जो जीवित थे। ‘जीवितों’ संक्षिप्त, प्रतिष्ठित और स्पष्ट है।
- source_word: וַתֵּעָצַר
  choice: और ... रुक गई
  rationale: עצר यहाँ निष्क्रिय/परिणामसूचक अर्थ में महामारी के आगे बढ़ने के थम जाने को बताता है। ‘रुक गई’ स्पष्ट आधुनिक हिन्दी है और निष्क्रिय परिणाम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַמַּגֵּפָה
  choice: महामारी
  rationale: מגפה इस प्रसंग में घातक दैवी प्रकोप को सूचित करता है। ‘महामारी’ सामान्य आधुनिक हिन्दी में व्यापक, जानलेवा रोग-प्रकोप का उपयुक्त शब्द है और पाठ से परे व्याख्या नहीं जोड़ता।
theological_decisions:
- issue: न्याय के इस प्रसंग में מַגֵּפָה का स्वरूप
  choice: महामारी
  alternative: विपत्ति / प्रकोप
  rationale: निकटवर्ती प्रसंग में यह मृत्यु लाने वाले दैवी प्रकोप का द्योतक है। ‘महामारी’ उसकी घातक और फैलती हुई प्रकृति को संक्षेप में व्यक्त करती है, जबकि उसके कारण या माध्यम के बारे में पाठ से अधिक नहीं कहती।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘मरे हुओं और जीवितों’ का समानांतर विन्यास मूल इब्रानी के स्पष्ट विरोध को सुरक्षित रखता है।
