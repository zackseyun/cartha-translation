base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/011.yaml
  text: Then Moses said to Aaron[a], “Take the censer, and put fire from the altar in it, and put incense on it, and go quickly to the congregation and make atonement for them, because wrath has gone out from before Yahweh[b]; the plague has begun.”
translation:
  language: hi
  text: तब मूसा ने हारून से कहा, “धूपदान[a] लो, उसमें वेदी पर से आग रखो और उसमें धूप डालो। फिर जल्दी से मण्डली के पास जाओ और उनके लिए प्रायश्चित करो, क्योंकि याहवे के सम्मुख से क्रोध निकल पड़ा है[b]; महामारी शुरू हो गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अग्निपात्र।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “याहवे के सम्मुख से,” अर्थात उसकी उपस्थिति से।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּחְתָּה
  choice: धूपदान
  rationale: याजकीय सेवा में अंगारे और धूप ले जाने वाले पात्र के लिए यह स्वाभाविक और प्रचलित हिन्दी शब्द है; ‘अग्निपात्र’ भी सम्भव है।
- source_word: וְתֶן עָלֶיהָ אֵשׁ מֵעַל הַמִּזְבֵּחַ
  choice: उसमें वेदी पर से आग रखो
  rationale: पात्र के भीतर वेदी से लिए हुए अंगारे रखने का भाव स्वाभाविक हिन्दी में व्यक्त करता है और מֵעַל की स्थान-स्रोत संबंधी छवि भी बनाए रखता है।
- source_word: קְטֹרֶת
  choice: धूप
  rationale: उपासना-विधि में जलाए जाने वाले सुगन्धित पदार्थ के लिए मानक हिन्दी पद।
- source_word: וְהוֹלֵךְ מְהֵרָה
  choice: जल्दी से ... जाओ
  rationale: गति की आज्ञा और तात्कालिकता, दोनों को स्पष्ट एवं सहज रूप से व्यक्त करता है।
- source_word: הָעֵדָה
  choice: मण्डली
  rationale: गिनती में औपचारिक रूप से एकत्र इस्राएली जनसमुदाय का सामूहिक अर्थ बनाए रखता है।
- source_word: וְכַפֵּר עֲלֵיהֶם
  choice: उनके लिए प्रायश्चित करो
  rationale: याजकीय अनुष्ठान के संदर्भ में כפר का पारंपरिक और सुबोध हिन्दी प्रतिरूप है; यह किसी विशिष्ट प्रायश्चित-सिद्धांत को अनावश्यक रूप से नहीं जोड़ता।
- source_word: הַקֶּצֶף
  choice: क्रोध
  rationale: यहाँ ईश्वरीय न्यायात्मक रोष को दर्शाता है; आधुनिक हिन्दी में ‘क्रोध’ गंभीर और स्वाभाविक है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: यहोवा के सम्मुख से
  rationale: शाब्दिक ‘यहोवा के मुख/उपस्थिति के सामने से’ की स्थानिक और उपस्थिति-संबंधी छवि को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी वाचा-नाम יהוה को हिन्दी में उसके व्यापक रूप से पहचाने जाने वाले व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הֵחֵל הַנָּגֶף
  choice: महामारी शुरू हो गई है
  rationale: संदर्भ में נֶגֶף लोगों के बीच आरम्भ हुई घातक दैवी मार है; ‘महामारी’ उसका सहज और सन्दर्भानुकूल हिन्दी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में टेट्राग्राम प्रत्यक्ष रूप से है। हिन्दी पाठकों के लिए परिचित व्यक्तिगत नाम ‘यहोवा’ को चुना गया है; ‘याहवे’ अधिक संभावित विद्वत् उच्चारण है, पर मूल स्वरांकन निश्चित नहीं है।
- issue: याजकीय संदर्भ में כפר
  choice: उनके लिए प्रायश्चित करो
  alternative: उनके लिए दोष-निवारण करो
  rationale: ‘प्रायश्चित करो’ याजकीय अनुष्ठान और ईश्वरीय न्याय को रोकने की पाठगत भूमिका बनाए रखता है, बिना क्रिया की कार्यविधि पर कोई संकीर्ण मत आरोपित किए।
- issue: מִלִּפְנֵי יְהוָה में ईश्वरीय उपस्थिति की छवि
  choice: यहोवा के सम्मुख से
  alternative: यहोवा की ओर से
  rationale: ‘सम्मुख से’ मूल की उपस्थिति/मुख-संबंधी छवि और यह तनाव सुरक्षित रखता है कि क्रोध यहोवा की उपस्थिति से निकलता है; केवल ‘ओर से’ कहने पर यह छवि मिट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। छोटे आज्ञार्थक वाक्यों से मूल की तात्कालिकता बनी रहती है। ‘मण्डली,’ ‘वेदी,’ ‘धूप’ और ‘प्रायश्चित’ जैसे स्थापित उपासना-संबंधी पद संदर्भ की याजकीय गंभीरता बनाए रखते हैं।
