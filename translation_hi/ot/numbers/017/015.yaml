id: NUM.17.15
reference: Numbers 17:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֤שָׁב אַהֲרֹן֙ אֶל מֹשֶׁ֔ה אֶל פֶּ֖תַח אֹ֣הֶל מוֹעֵ֑ד וְ/הַ/מַּגֵּפָ֖ה נֶעֱצָֽרָה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/015.yaml
  text: Then Aaron returned to Moses at the entrance of the tent of meeting[a], and the plague was stopped.
translation:
  language: hi
  text: तब हारून मिलाप के तंबू के द्वार पर मूसा के पास लौट आया, और महामारी रोक दी गई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “महामारी थम गई” अथवा “महामारी काबू में आ गई।”
    reason: נֶעֱצָרָה के लिए सम्भव स्वाभाविक हिन्दी विकल्प; ये रुकने या काबू में आने के भाव को अलग-अलग ढंग से व्यक्त करते हैं।
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: तब ... लौट आया
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है और שׁוּב यहाँ स्थानगत अर्थ में ‘लौटना’ है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל מֹשֶׁה
  choice: मूसा के पास
  rationale: אֶל मूसा की ओर गति बताता है; हिन्दी में व्यक्ति के संदर्भ में ‘के पास’ स्वाभाविक है।
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलाप के तंबू के द्वार पर
  rationale: פֶּתַח प्रवेश-द्वार या खुलने की जगह है। पहले ही ‘मूसा के पास’ से दिशा व्यक्त हो चुकी है, इसलिए ‘द्वार पर’ स्थान को सहज ढंग से बताता है। אֹהֶל מוֹעֵד के लिए ‘मिलाप का तंबू’ परिचित और अर्थपूर्ण पद है।
- source_word: הַמַּגֵּפָה
  choice: महामारी
  rationale: מַגֵּפָה यहाँ व्यापक रूप से प्राण लेने वाली दैवी मार को सूचित करता है; ‘महामारी’ साधारण आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: נֶעֱצָרָה
  choice: रोक दी गई
  rationale: עצר का निफ़अल रूप बताता है कि महामारी को थाम दिया गया। कर्मवाच्य हिन्दी मूल के रूप को सुरक्षित रखती है और कर्ता को स्पष्ट रूप से नहीं जोड़ती।
theological_decisions:
- issue: महामारी को रोकने वाले का निहित दैवी कर्तृत्व
  choice: ‘महामारी रोक दी गई’—कर्ता को अनकहा रखते हुए कर्मवाच्य
  alternative: ‘यहोवा ने महामारी रोक दी’ अथवा ‘महामारी थम गई’
  rationale: निकटवर्ती प्रसंग में परमेश्वर का कर्तृत्व समझ में आता है, पर इस उपवाक्य में इब्रानी पाठ कर्ता का नाम नहीं लेता। कर्मवाच्य उसी संयम और निहितार्थ को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलाप का तंबू’ बाइबलीय संदर्भ में परिचित पद है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक रखा गया है।
