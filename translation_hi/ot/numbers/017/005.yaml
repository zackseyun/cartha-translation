  text: זִכָּר֞וֹן לִ/בְנֵ֣י יִשְׂרָאֵ֗ל לְ֠מַעַן אֲשֶׁ֨ר לֹֽא יִקְרַ֜ב אִ֣ישׁ זָ֗ר אֲ֠שֶׁר לֹ֣א מִ/זֶּ֤רַע אַהֲרֹן֙ ה֔וּא לְ/הַקְטִ֥יר קְטֹ֖רֶת לִ/פְנֵ֣י יְהוָ֑ה וְ/לֹֽא יִהְיֶ֤ה כְ/קֹ֨רַח֙ וְ/כַ֣/עֲדָת֔/וֹ כַּ/אֲשֶׁ֨ר דִּבֶּ֧ר יְהוָ֛ה בְּ/יַד מֹשֶׁ֖ה לֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/005.yaml
  text: as a reminder for the children of Israel[a], so that no outsider, who is not from the offspring of Aaron, may come near to burn incense before Yahweh, and so that he may not become like Korah and like his company[d][c][b], just as Yahweh spoke by the hand of Moses to him.
translation:
  language: hi
  text: यह इस्राएलियों के लिए एक स्मारक[a] हो, ताकि कोई अनधिकृत व्यक्ति[b], जो हारून के वंश का न हो, यहोवा के सामने धूप चढ़ाने के लिए पास न आए, और कोरह और उसके समुदाय के समान न हो—जैसा यहोवा ने मूसा के द्वारा[c] उससे कहा था।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याद दिलाने वाली वस्तु” अथवा “स्मरण-चिह्न।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अनधिकृत व्यक्ति” का अर्थ याजकीय सेवा का अधिकार न रखने वाला व्यक्ति है, न कि अनिवार्य रूप से किसी दूसरी जाति का विदेशी।
    reason: cultural_note
  - marker: c
    text: इब्रानी में शाब्दिक रूप से “मूसा के हाथ से”; यह मुहावरा “मूसा के द्वारा” के अर्थ में है।
    reason: lexical_alternative
  - marker: d
    text: अंतिम “उससे” सम्भवतः हारून की ओर संकेत करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: זִכָּרוֹן
  choice: स्मरण का चिह्न
  rationale: यह संज्ञा ऐसी वस्तु को दर्शाती है जो याद दिलाने या स्मारक का काम करे; यह पद के चेतावनीपरक संदर्भ में स्वाभाविक और अर्थपूर्ण है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के लिए
  rationale: आधुनिक हिन्दी में पूरे समुदाय के लिए सहज और समावेशी अभिव्यक्ति।
- source_word: אִישׁ זָר
  choice: अनधिकृत व्यक्ति
  rationale: याजकीय संदर्भ में זָר जातीय विदेशी को नहीं, बल्कि याजकीय सेवा का अधिकार न रखने वाले व्यक्ति को दर्शाता है।
- source_word: מִזֶּרַע אַהֲרֹן
  choice: हारून के वंश का
  rationale: वंशगत पात्रता के अर्थ को प्राकृतिक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: धूप जलाने
  rationale: याजकीय क्रिया का स्पष्ट और प्रचलित हिन्दी रूप।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: स्थानिक और उपासना-संबंधी अर्थ को बनाए रखते हुए परमेश्वर के व्यक्तिगत नाम को सीधे प्रस्तुत करता है।
- source_word: וְלֹא יִהְיֶה כְקֹרַח וְכַעֲדָתוֹ
  choice: और कोरह और उसके समुदाय के समान न हो
  rationale: चेतावनी को उसके उदाहरण और परिणाम दोनों की ओर संकेत करते हुए रखता है; עֲדָה के लिए 'समुदाय' सहज है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के द्वारा
  rationale: शाब्दिक 'मूसा के हाथ से' मध्यस्थता का इब्रानी मुहावरा है; हिन्दी में 'मूसा के द्वारा' उसका स्वाभाविक अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले 'यहोवा' से इसे उपाधि में बदले बिना प्रस्तुत किया गया है।
- issue: זָר का याजकीय अर्थ
  choice: अनधिकृत व्यक्ति
  alternative: बाहरी व्यक्ति
  rationale: प्रतिबंध जातीय पहचान पर नहीं, हारून के वंश से बाहर और याजकीय सेवा के लिए अधिकारहीन होने पर केंद्रित है।
- issue: अंतिम सर्वनाम לוֹ का संदर्भ
  choice: उससे
  alternative: हारून से
  rationale: इब्रानी में सर्वनाम का पूर्वपद स्पष्ट रूप से दोहराया नहीं गया; सम्भावित संदर्भ हारून है, पर मुख्य पाठ में मूल अस्पष्टता रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमामय पर सामान्य पाठक के लिए स्पष्ट। वाक्य की विधिक-चेतावनी शैली तथा अंतिम सर्वनाम की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
