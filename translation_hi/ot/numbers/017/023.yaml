  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּבֹ֤א מֹשֶׁה֙ אֶל אֹ֣הֶל הָ/עֵד֔וּת וְ/הִנֵּ֛ה פָּרַ֥ח מַטֵּֽה אַהֲרֹ֖ן לְ/בֵ֣ית לֵוִ֑י וַ/יֹּ֤צֵֽא פֶ֨רַח֙ וַ/יָּ֣צֵֽץ צִ֔יץ וַ/יִּגְמֹ֖ל שְׁקֵדִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/023.yaml
  text: 'And it happened on the next day that Moses went into the tent of the testimony, and behold, Aaron’s staff for the house of Levi had budded: it brought forth blossoms, produced flowers, and ripened almonds.'
translation:
  language: hi
  text: अगले दिन मूसा साक्षी के तम्बू[a] में गया। और देखो, लेवी के घराने की ओर से हारून की लाठी[b] में कोंपलें फूट चुकी थीं; उसमें फूल आए, वे खिले और बादाम पक गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गवाही का तम्बू।”
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह लाठी जो लेवी के गोत्र का प्रतिनिधित्व करती थी।
    reason: cultural_note
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह स्वाभाविक आधुनिक हिन्दी में अगले दिन के कालक्रम को स्पष्ट रूप से व्यक्त करता है।
- source_word: אֹהֶל הָעֵדוּת
  choice: साक्षी का तम्बू
  rationale: עֵדוּת के साक्ष्य/गवाही-संबंधी कानूनी और वाचा-संबंधी भाव को बनाए रखता है; हिन्दी में स्थापित बाइबलीय पदबंध भी है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: कथानक में आश्चर्य और चमत्कार की ओर ध्यान खींचने वाली इब्रानी अभिव्यक्ति की जीवंतता बनाए रखता है।
- source_word: פָּרַח
  choice: कोंपलें फूट चुकी थीं
  rationale: लाठी में आरम्भिक वनस्पतिक वृद्धि को व्यक्त करता है और आगे आने वाली कलियों, फूलों तथा फल की क्रमिक प्रगति से अलग रहता है।
- source_word: מַטֵּה
  choice: लाठी
  rationale: नेता की छड़ी/दण्ड के लिए सरल और स्वाभाविक आधुनिक हिन्दी शब्द है।
- source_word: לְבֵית לֵוִי
  choice: लेवी के घराने की ओर से
  rationale: לְ के प्रतिनिधित्व-संबंधी भाव को स्पष्ट करता है और בֵּית की पारिवारिक/वंशीय छवि को सुरक्षित रखता है।
- source_word: וַיֹּצֵא פֶרַח
  choice: उसमें कलियाँ निकलीं
  rationale: फूल खिलने से पहले की वृद्धि-अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है और पद के क्रमिक चमत्कार को बनाए रखता है।
- source_word: וַיָּצֵץ צִיץ
  choice: फूल खिले
  rationale: वनस्पतिक क्रम में पूर्ण पुष्पन को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּגְמֹל שְׁקֵדִים
  choice: बादाम पक गए थे
  rationale: גמל के फल के परिपक्व होने के अर्थ को बनाए रखता है, केवल फल लगने का अर्थ नहीं देता।
theological_decisions:
- issue: עֵדוּת का तम्बू-संबंधी अर्थ
  choice: साक्षी का तम्बू
  alternative: गवाही का तम्बू / वाचा का तम्बू
  rationale: स्रोत के कानूनी-वाचा संबंधी बहुअर्थी भाव को सीधे रखता है और 'वाचा' जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- issue: हारून की लाठी और लेवी का संबंध
  choice: लेवी के घराने की ओर से हारून की लाठी
  alternative: लेवी के घराने की हारून की लाठी
  rationale: यह स्पष्ट करता है कि लाठी लेवी का प्रतिनिधित्व करती थी, बिना किसी विशिष्ट धार्मिक सिद्धान्त को पाठ में जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वनस्पतिक क्रम—कोंपलें, कलियाँ, फूल और पके बादाम—को स्पष्ट रखा गया है; कथात्मक וְהִנֵּה को “और देखो” द्वारा सुरक्षित किया गया है।
