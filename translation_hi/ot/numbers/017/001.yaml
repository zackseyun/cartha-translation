  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; हिंदी में ‘फिर’ क्रम को स्वाभाविक रूप से व्यक्त करता है। דִּבֵּר के साथ आगे לֵאמֹר होने पर ‘कहा’ सहज हिंदी है और वाक्य को अनावश्यक रूप से भारी नहीं बनाता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: भाषण की हिंदी अभिव्यक्ति में ‘मूसा से कहा’ स्वाभाविक है और संबोधन की दिशा को ठीक प्रकार व्यक्त करती है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रिया का अनंत रूप आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिंदी में ‘कहा’ इस सूत्र का स्वाभाविक समतुल्य है; ‘यह कहते हुए’ यहाँ अनावश्यक पुनरुक्ति पैदा करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम יהוה का प्रयोग करता है। इसलिए उपाधि ‘प्रभु’ के बदले नाम का हिंदी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण ‘यहोवा’ रखा गया है।
