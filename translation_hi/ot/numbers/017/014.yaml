  edition: WLC
  text: וַ/יִּהְי֗וּ הַ/מֵּתִים֙ בַּ/מַּגֵּפָ֔ה אַרְבָּעָ֥ה עָשָׂ֛ר אֶ֖לֶף וּ/שְׁבַ֣ע מֵא֑וֹת מִ/לְּ/בַ֥ד הַ/מֵּתִ֖ים עַל דְּבַר קֹֽרַח־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/014.yaml
  text: Those who died in the plague were fourteen thousand seven hundred[a], besides those who died on account of Korah.
translation:
  language: hi
  text: महामारी में मरने वालों की संख्या चौदह हज़ार सात सौ थी, कोरह के मामले में मरने वालों[a] को छोड़कर।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो कोरह के कारण मरे थे।” मूल पदबंध का अर्थ “कोरह के कारण” या “कोरह के मामले में” हो सकता है। यह कोरह के विद्रोह से संबंधित पहले मर चुके लोगों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּהְיוּ
  choice: की संख्या ... थी
  rationale: यह कथात्मक क्रम में परिणामस्वरूप कुल संख्या बताता है। हिन्दी में अलग से ‘और’ या ‘अब’ जोड़ने के बजाय संख्या-वाचक वाक्य स्वाभाविक है।
- source_word: הַמֵּתִים בַּמַּגֵּפָה
  choice: महामारी में मरनेवालों
  rationale: मूल participle का अर्थ ‘मृत लोग’ भी हो सकता है, पर गिनती के साथ ‘मरनेवाले’ अधिक स्वाभाविक है। בַּמַּגֵּפָה को निकटता से ‘महामारी में’ प्रस्तुत किया गया है।
- source_word: אַרְבָּעָה עָשָׂר אֶלֶף וּשְׁבַע מֵאוֹת
  choice: चौदह हज़ार सात सौ
  rationale: मूल संख्या का सीधा और प्रचलित हिन्दी रूप।
- source_word: מִלְּבַד
  choice: इनके अलावा
  rationale: यह बताता है कि आगे उल्लिखित मृतक 14,700 की संख्या में सम्मिलित नहीं थे। ‘इनके अलावा’ इस संख्यात्मक भेद को स्पष्ट और सहज रखता है।
- source_word: עַל דְּבַר קֹרַח
  choice: कोरह के मामले में
  rationale: यह मूल पदबंध के ‘कोरह से संबंधित मामले/प्रसंग में’ अर्थ को सुरक्षित रखता है और कोरह को अनिवार्य रूप से प्रत्यक्ष कारण ठहराने से बचता है। कारणवाचक सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: कोरह से संबंधित मृतकों का दायरा
  choice: मुख्य पाठ 14,700 महामारी-मृतकों और कोरह के मामले से जुड़े पहले के मृतकों में भेद करता है, पर उनकी श्रेणियाँ और अधिक निश्चित नहीं करता।
  alternative: ‘जो कोरह के कारण मरे थे’
  rationale: עַל דְּבַר קֹרַח कारण अथवा किसी मामले से संबंध, दोनों व्यक्त कर सकता है। संदर्भ पहले के न्याय की ओर संकेत करता है, पर मूल पाठ यहाँ विस्तृत वर्गीकरण नहीं देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली। ‘महामारी’ सामान्य पाठक के लिए स्पष्ट है; ‘मरनेवालों की संख्या’ संख्यात्मक वाक्य को स्वाभाविक बनाता है। पादटिप्पणी-चिह्न उसी पदबंध के बाद रखा गया है जिसकी अर्थ-सम्भावनाएँ वह समझाता है।
