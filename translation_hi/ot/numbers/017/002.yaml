source:
  edition: WLC
  text: אֱמֹ֨ר אֶל אֶלְעָזָ֜ר בֶּן אַהֲרֹ֣ן הַ/כֹּהֵ֗ן וְ/יָרֵ֤ם אֶת הַ/מַּחְתֹּת֙ מִ/בֵּ֣ין הַ/שְּׂרֵפָ֔ה וְ/אֶת הָ/אֵ֖שׁ זְרֵה הָ֑לְאָה כִּ֖י קָדֵֽשׁוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/002.yaml
  text: Tell Eleazar son of Aaron the priest to lift the censers out from among the burning[a], and scatter the fire farther away[b], for they have become holy.
translation:
  language: hi
  text: “हारून याजक के पुत्र एलआज़ार से कह कि वह आग के बीच से धूपदानों[a] को उठा ले और आग को वहाँ से दूर बिखेर दे, क्योंकि वे पवित्र हो गए हैं।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अग्निपात्र”; इब्रानी शब्द अंगारे और धूप ले जाने वाले पात्र के लिए प्रयुक्त होता है।
    reason: lexical_alternative
  - marker: b
    text: 'या “क्योंकि वे पवित्र हैं।” इब्रानी पूर्ण क्रिया यहाँ परिणामी अवस्था पर बल दे सकती है: “पवित्र हो गए हैं।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: אֱמֹר
  choice: से कह
  rationale: आज्ञार्थक क्रिया है; ‘से कह’ आधुनिक हिन्दी में निर्देश देने का स्वाभाविक रूप है।
- source_word: אֶלְעָזָר בֶּן אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक के पुत्र एलआज़ार
  rationale: इब्रानी पदबंध में ‘याजक’ सबसे स्वाभाविक रूप से हारून को विशेषित करता है; नामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְיָרֵם
  choice: कि वह ... उठा ले
  rationale: आज्ञार्थक क्रिया के बाद आया इच्छार्थक रूप एलआज़ार को दिए जाने वाले निर्देश की विषयवस्तु बताता है।
- source_word: הַמַּחְתֹּת
  choice: धूपदानों
  rationale: यह अंगारे और धूप ले जाने वाले पात्रों के लिए प्रयुक्त शब्द है; उपासना-संदर्भ में ‘धूपदान’ स्पष्ट और प्रचलित है।
- source_word: מִבֵּין הַשְּׂרֵפָה
  choice: धधकती आग के बीच से
  rationale: שׂרפה जलने की घटना, ज्वाला या जला हुआ क्षेत्र सूचित कर सकता है; यह अनुवाद दृश्य को ठोस रखता है और ‘जले हुए अवशेष’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: וְאֶת הָאֵשׁ זְרֵה הָלְאָה
  choice: और आग को दूर बिखेर दे
  rationale: זרה का अर्थ बिखेरना और הָלְאָה का अर्थ दूर/आगे है; ‘आग’ को मूल के अनुसार रखा गया है, यद्यपि व्यवहार में अंगारे अभिप्रेत हो सकते हैं।
- source_word: כִּי קָדֵשׁוּ
  choice: क्योंकि वे पवित्र हो गए हैं
  rationale: बहुवचन पूर्ण क्रिया का निकटतम उपयुक्त पूर्वपद धूपदान हैं; हिन्दी का पूर्णतासूचक रूप प्राप्त हुई पवित्र अवस्था को व्यक्त करता है।
theological_decisions:
- issue: כִּי קָדֵשׁוּ में बहुवचन क्रिया का संदर्भ
  choice: ‘वे’ धूपदानों को संदर्भित करता है
  alternative: ‘वे’ धूपदानों और आग से जुड़ी वस्तुओं को सामूहिक रूप से संदर्भित करता है
  rationale: निकटतम उपयुक्त बहुवचन संज्ञा ‘धूपदान’ है और आगे की कथा में इन्हीं को सुरक्षित रखने का कारण उनका पवित्र हो जाना है; आग को इसके विपरीत दूर बिखेरना है।
- issue: קָדֵשׁוּ का कालगत भाव
  choice: ‘पवित्र हो गए हैं’—परिणामी अवस्था
  alternative: ‘पवित्र हैं’—वर्तमान अवस्था
  rationale: इब्रानी पूर्ण रूप पूर्व घटना के फलस्वरूप बनी वर्तमान अवस्था पर बल दे सकता है; मुख्य पाठ में परिवर्तन की परिणति रखी गई है और वैकल्पिक स्थिर-अवस्था अनुवाद पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘धधकती आग’ मूल के שׂרפה की ठोस छवि को व्यक्त करता है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
