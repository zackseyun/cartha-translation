lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: और … ने … कहा
  rationale: यह वाव-क्रमयुक्त क्रिया कथा को आगे बढ़ाती है। हिन्दी में ‘ने … कहा’ इस प्रचलित वचन-परिचय सूत्र का स्वाभाविक और स्पष्ट रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण उच्चारण के अनुसार देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: वाणी के संबोधित व्यक्ति को हिन्दी में स्वाभाविक रूप से ‘से’ द्वारा व्यक्त किया गया है; מֹשֶׁה का मानक हिन्दी रूप ‘मूसा’ है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह अगले प्रत्यक्ष कथन का परिचय देने वाला पारंपरिक हिब्रू सूत्र है। हिन्दी में मुख्य क्रिया के साथ ‘कहा’ और उसके बाद अल्पविराम इसका स्वाभाविक समतुल्य है; ‘यह कहते हुए’ अनावश्यक रूप से भारी होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ उसे उपाधि में बदले बिना सुरक्षित रखता है; पाठकों के लिए अन्य परिचित रूप पादटिप्पणी में दिया गया है।
