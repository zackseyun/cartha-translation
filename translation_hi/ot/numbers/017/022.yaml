base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/022.yaml
  text: So Moses placed the staffs before Yahweh in the tent of the testimony[a][b].
translation:
  language: hi
  text: तब मूसा ने उन लाठियों को याहवे के सामने गवाही के तंबू[a] में रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गवाही के निवासस्थान में।” शाब्दिक रूप से, “गवाही के तंबू में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּנַּח
  choice: रख दिया
  rationale: हिफ़ील कथात्मक रूप यहाँ किसी वस्तु को किसी स्थान पर रखने का ठोस कार्य व्यक्त करता है; ‘रख दिया’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: הַמַּטֹּת
  choice: उन लाठियों
  rationale: מַטֶּה का अर्थ लाठी, छड़ी या गोत्र हो सकता है; प्रसंग में ये गोत्रों का प्रतिनिधित्व करने वाली वास्तविक लाठियाँ हैं। ‘उन’ पूर्वोक्त वस्तुओं की ओर संकेत करता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: यह स्थानगत रूप से सामने होने के साथ यहवे की उपस्थिति में रखे जाने का भाव भी बनाए रखता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בְּאֹהֶל
  choice: तंबू में
  rationale: אֹהֶל का सीधा अर्थ ‘तंबू’ है; यह मूल इब्रानी बिंब को ‘निवासस्थान’ जैसे अधिक व्याख्यात्मक विकल्प की अपेक्षा स्पष्ट रखता है।
- source_word: הָעֵדֻת
  choice: साक्षी
  rationale: עֵדוּת वाचा की साक्षी, विशेषतः पटियाओं से संबद्ध साक्ष्य, को सूचित करता है; ‘साक्षी का तंबू’ मूल संरचना को संक्षेप में बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना आधुनिक हिन्दी में प्रस्तुत करता है।
- issue: הָעֵדֻת का आशय
  choice: साक्षी
  alternative: गवाही; वाचा का दस्तावेज़
  rationale: पद में शब्द को उसकी संक्षिप्त, कुछ हद तक बहुअर्थी धार्मिक संज्ञा के रूप में रखा गया है; इसे केवल दस्तावेज़ बताकर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘लाठियाँ’ ठोस वस्तुओं को स्पष्ट करता है और ‘साक्षी का तंबू’ मूल इब्रानी पदबंध को निकटता से सुरक्षित रखता है।
