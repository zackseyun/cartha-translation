  yaml_path: translation/ot/numbers/017/018.yaml
  text: And you shall write Aaron’s name on the staff of Levi[a], for there shall be one staff for the head of their fathers’ house.
translation:
  language: hi
  text: और लेवी की लाठी पर हारून का नाम लिखना, क्योंकि उनके पितृकुल के प्रधान के लिए एक लाठी होगी।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “उनके पितृकुल के प्रत्येक प्रधान के लिए एक लाठी होगी।” इब्रानी वाक्यांश को वितरणार्थक रूप में समझा जा सकता है; अर्थात हर पितृकुल-प्रधान का प्रतिनिधित्व एक लाठी करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: और
  rationale: וְ पिछले पद में दिए गए निर्देश को आगे बढ़ाता है; אֵת कर्म-चिह्न है और हिन्दी में अलग से अनूदित नहीं होता।
- source_word: שֵׁם אַהֲרֹן
  choice: हारून का नाम
  rationale: व्यक्तिगत नाम को हिन्दी बाइबलीय परंपरा के प्रचलित रूप ‘हारून’ में रखा गया है।
- source_word: תִּכְתֹּב
  choice: लिखना
  rationale: निर्देशात्मक अपूर्ण क्रिया को मूसा को संबोधित स्वाभाविक हिन्दी आज्ञार्थक शैली में प्रस्तुत किया गया है।
- source_word: עַל מַטֵּה לֵוִי
  choice: लेवी की लाठी पर
  rationale: מַטֶּה यहाँ वास्तविक प्रतिनिधि लाठी है; ‘लाठी’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है, और लेवी का संबंध भी बनाए रखती है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह हारून का नाम लेवी की लाठी पर लिखने का कारण प्रस्तुत करता है।
- source_word: מַטֶּה אֶחָד
  choice: एक ही लाठी
  rationale: אֶחָד की एकमात्र प्रतिनिधि लाठी वाली शक्ति को ‘एक ही’ से स्पष्ट किया गया है।
- source_word: לְ/רֹאשׁ בֵּית אֲבוֹתָם
  choice: उनके पितृकुल के प्रत्येक प्रधान के लिए
  rationale: לְרֹאשׁ को प्रसंगानुसार वितरणार्थक समझा गया है; ‘पितृकुल’ בֵּית אָבוֹת के वंशाधारित सामाजिक समूह को संक्षेप और गरिमा से व्यक्त करता है।
theological_decisions:
- issue: לְרֹאשׁ का वितरणार्थक या एकवचनात्मक अर्थ
  choice: ‘प्रत्येक प्रधान के लिए’—वितरणार्थक अर्थ
  alternative: ‘उनके पितृकुल के प्रधान के लिए’
  rationale: पिछले पद में अलग-अलग पितृकुल-प्रधानों से लाठियाँ लेने का निर्देश इस एकवचन को वितरणार्थक रूप से समझने का मजबूत प्रसंग देता है; यह चयन किसी अतिरिक्त धार्मिक निष्कर्ष को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; आज्ञा के लिए सहज ‘लिखना’ प्रयोग किया गया है। ‘पितृकुल’ सामान्य ‘घराने’ से कुछ अधिक औपचारिक है, पर मूल के वंश-सामाजिक अर्थ को सटीक और संक्षिप्त रूप से रखता है।
