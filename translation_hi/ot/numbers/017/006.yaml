source:
  edition: WLC
  text: וַ/יִּלֹּ֜נוּ כָּל עֲדַ֤ת בְּנֵֽי יִשְׂרָאֵל֙ מִֽ/מָּחֳרָ֔ת עַל מֹשֶׁ֥ה וְ/עַֽל אַהֲרֹ֖ן לֵ/אמֹ֑ר אַתֶּ֥ם הֲמִתֶּ֖ם אֶת עַ֥ם יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/006.yaml
  text: But on the next day all the congregation of the sons of Israel grumbled against Moses and against Aaron[a], saying[b], “You have killed the people of Yahweh.”
translation:
  language: hi
  text: लेकिन अगले दिन इस्राएलियों की सारी मण्डली मूसा और हारून के विरुद्ध कुड़कुड़ाई और कहने लगी, “तुमने यहोवा के लोगों को मार डाला है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּלֹּנוּ
  choice: कुड़कुड़ाने लगी
  rationale: लון का यह रूप जंगल-वृत्तांतों में अगुवों के विरुद्ध सामूहिक, असंतुष्ट शिकायत व्यक्त करता है। ‘कुड़कुड़ाना’ आधुनिक हिन्दी में इस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की पूरी मण्डली
  rationale: עֵדָה सामुदायिक सभा या मण्डली है। בְּנֵי יִשְׂרָאֵל यहाँ समूचे जातीय-वैधानिक समुदाय का प्रचलित पद है; हिन्दी में ‘इस्राएली’ अर्थ को स्वाभाविक और समावेशी ढंग से देता है, जबकि शाब्दिक ‘इस्राएल के पुत्र’ सामान्य पाठक को केवल पुरुषों तक सीमित प्रतीत हो सकता है।
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह पद पूर्ववर्ती घटना के बाद वाले दिन को सूचित करता है; ‘अगले दिन’ सहज आधुनिक हिन्दी है।
- source_word: עַל מֹשֶׁה וְעַל אַהֲרֹן
  choice: मूसा और हारून के विरुद्ध
  rationale: दोनों बार आए עַל का विरोधात्मक अर्थ ‘के विरुद्ध’ से स्पष्ट होता है। हिन्दी में एक ही परसर्ग दोनों नामों को स्वाभाविक रूप से सम्बद्ध करता है।
- source_word: לֵאמֹר
  choice: उन्होंने कहा
  rationale: प्रत्यक्ष कथन आरम्भ कराने वाले हिब्रू infinitive को हिन्दी कथात्मक शैली में स्वतंत्र क्रिया बनाना अधिक स्वाभाविक है।
- source_word: אַתֶּם הֲמִתֶּם
  choice: तुमने ... मार डाला है
  rationale: हिफ़ील रूप कारणकारी है और यहाँ सीधा आरोप लगाता है कि मूसा और हारून ने प्रजा की मृत्यु कराई। हिन्दी का पूर्ण वर्तमान उस पूरी घटना की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: עַם יְהוָה
  choice: यहोवा की प्रजा
  rationale: עַם वाचा से सम्बद्ध जनसमुदाय को दर्शाता है; ‘प्रजा’ इस सम्बन्ध और गम्भीर शैली को संक्षेप में व्यक्त करती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में आए दिव्य नाम YHWH को सामान्य हिन्दी बाइबलीय रूप ‘यहोवा’ में प्रत्यक्ष रखा गया है, न कि उपाधि ‘प्रभु’ से बदला गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ वाचा का निज नाम सीधे प्रयोग करता है। ‘यहोवा’ हिन्दी पाठकों के लिए सुविख्यात प्रत्यक्ष नाम है और नाम को उपाधि में नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक आशय
  choice: इस्राएली
  alternative: इस्राएल के पुत्र
  rationale: इस सन्दर्भ में पद पूरी मण्डली—समूचे समुदाय—का रूढ़ जातीय नाम है। ‘इस्राएली’ वास्तविक सामुदायिक विस्तार को व्यक्त करता है; शाब्दिक विकल्प हिन्दी में अनावश्यक रूप से केवल पुरुषों का बोध करा सकता है।
- issue: הֲמִתֶּם में कारणकारी आरोप
  choice: तुमने ... मार डाला है
  alternative: तुमने ... मरवा डाला है / तुम ... की मृत्यु का कारण बने
  rationale: आरोप की तीव्रता और सीधापन सुरक्षित रखा गया है। वाक्य यह प्रमाणित नहीं करता कि आरोप सत्य था; इसे मण्डली के कथन के रूप में ही प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘मण्डली’, ‘कुड़कुड़ाना’ और ‘प्रजा’ बाइबलीय प्रसंग का सामुदायिक तथा वाचाई स्वर बनाए रखते हैं, पर वाक्य-संरचना अनावश्यक रूप से शाब्दिक नहीं है।
