  text: So Eleazar the priest took the bronze censers that the burned men had offered[c][b][a], and they were hammered out as a covering for the altar.
translation:
  language: hi
  text: तब एलीआज़ार याजक ने काँसे के वे धूपदान लिए, जिन्हें आग में भस्म हुए लोगों ने चढ़ाए थे, और उन्हें पीटकर वेदी के लिए धातु का आवरण बनाया गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: धूपदान
  rationale: ये जलते अंगारों और धूप के लिए प्रयुक्त पात्र थे; उपासना-संदर्भ में ‘धूपदान’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַנְּחֹשֶׁת
  choice: काँसे के
  rationale: נְחֹשֶׁת ताँबे या काँसे को सूचित कर सकता है; पवित्र-स्थान की वस्तुओं के संदर्भ में ‘काँसा’ प्रचलित और संदर्भानुकूल है।
- source_word: הִקְרִיבוּ
  choice: चढ़ाया था
  rationale: हिफ़ील रूप उपासना-संदर्भ में अर्पित करने का अर्थ देता है; ‘था’ पिछली घटना से इसका संबंध स्पष्ट करता है।
- source_word: הַשְּׂרֻפִים
  choice: आग में भस्म हुए लोगों
  rationale: निष्क्रिय कृदंत का ठोस अर्थ बनाए रखता है और पूर्ववर्ती वृत्तांत में आग से नष्ट हुए व्यक्तियों की ओर संकेत करता है।
- source_word: וַיְרַקְּעוּם
  choice: उन्हें पीटकर ... बनाया गया
  rationale: रूप में बहुवचन कर्ता और बहुवचन कर्म-प्रत्यय है, पर कर्ता निर्दिष्ट नहीं है; हिन्दी का कर्मवाच्य इस अनिश्चितता को बनाए रखते हुए धूपदानों को स्पष्ट कर्म बनाता है।
- source_word: צִפּוּי
  choice: मढ़ाव
  rationale: धातु की वह परत जो किसी वस्तु पर चढ़ाई जाए; ‘मढ़ाव’ यहाँ सामान्य ‘आवरण’ से अधिक सटीक है।
- source_word: לַמִּזְבֵּחַ
  choice: वेदी के लिए
  rationale: 'लामेद यहाँ प्रयोजन या परिणति दर्शाता है: पीटी हुई धातु वेदी पर चढ़ाने के लिए मढ़ाव बनी।'
