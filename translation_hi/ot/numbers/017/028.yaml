source:
  edition: WLC
  text: כֹּ֣ל הַ/קָּרֵ֧ב הַ/קָּרֵ֛ב אֶל מִשְׁכַּ֥ן יְהוָ֖ה יָמ֑וּת הַ/אִ֥ם תַּ֖מְנוּ לִ/גְוֺֽעַ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/028.yaml
  text: Everyone who comes near[a], who comes near to the tabernacle of Yahweh, will die. Are we all to perish?
translation:
  language: hi
  text: हर कोई जो निकट आता है—जो याहवे के तम्बू के निकट आता है—मर जाएगा। क्या हम सब नाश हो जाएँगे?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या हम सब मर जाएँगे?” यहाँ इब्रानी में “मर जाएगा” के लिए प्रयुक्त क्रिया से भिन्न क्रिया-शब्द हैं; वे केवल उसी क्रिया को दोहराने के बजाय नष्ट या समाप्त हो जाने का भाव दे सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּל
  choice: जो कोई
  rationale: यहाँ यह शब्द किसी भी निकट आने वाले व्यक्ति को समेटने वाला सार्वभौमिक कथन आरम्भ करता है; ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַקָּרֵב הַקָּרֵב
  choice: जो ... निकट आता है—जो ... निकट आता है
  rationale: मूल की दोहराई हुई कृदन्त रचना को बनाए रखा गया है, क्योंकि यह लोगों की घबराहट और कथन के जोर को प्रकट करती है।
- source_word: מִשְׁכַּן
  choice: निवास-तम्बू
  rationale: מִשְׁכָּן का मूल अर्थ ‘निवास’ है, पर यहाँ जंगल के पवित्र तम्बू का विशेष सन्दर्भ है; संयुक्त पद दोनों बातों को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यन्तरण में प्रस्तुत किया गया है।
- source_word: יָמוּת
  choice: मर जाएगा
  rationale: अपूर्ण क्रिया यहाँ निकट आने के निश्चित परिणाम को व्यक्त करती है; यह आधुनिक हिन्दी में सीधा और स्पष्ट है।
- source_word: תַּמְנוּ לִגְוֹעַ
  choice: क्या हम मरते-मरते पूरी तरह समाप्त हो जाएँगे?
  rationale: תמם के ‘समाप्त हो जाना’ और גוע के ‘मरना/प्राण छोड़ना’—दोनों अर्थों को रखा गया है। इससे मूल का असामान्य और भयपूर्ण प्रश्न केवल ‘क्या हम मरेंगे?’ बनकर सपाट नहीं होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यन्तरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: अन्तिम प्रश्न में सम्पूर्ण विनाश का भाव
  choice: मरते-मरते पूरी तरह समाप्त हो जाएँगे
  alternative: हम सब नाश हो जाएँगे
  rationale: תמם और גוע की संयुक्त, कुछ असामान्य अभिव्यक्ति को खुला रखा गया है; यह मृत्यु, समाप्ति और सामूहिक विनाश के भय को व्यक्त करती है, बिना दोनों क्रियात्मक धारणाओं को एक ही सामान्य शब्द में मिला देने के।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। मूल की जोरदार पुनरावृत्ति को डैश के सहारे स्वाभाविक हिन्दी में बनाए रखा गया है। ‘निवास-तम्बू’ सामान्य पाठक को वस्तु और उसके धार्मिक अर्थ दोनों समझाता है।
