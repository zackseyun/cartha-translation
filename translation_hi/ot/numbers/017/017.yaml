base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/017.yaml
  text: Speak to the sons of Israel[a], and take from them one staff for each father's house, from all their leaders according to their fathers' houses, twelve staffs[b]. Each man's name you shall write on his staff.
translation:
  language: hi
  text: इस्राएल के पुत्रों[a] से कह, और उनसे, अर्थात् उनके पितृकुलों के अनुसार उनके सभी प्रधानों से, हर पितृकुल के लिए एक-एक लाठी ले—कुल बारह लाठियाँ[b]। हर व्यक्ति का नाम उसकी लाठी पर लिख।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएलियों।” इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: या, “छड़ियाँ।” इब्रानी מַטֶּה का अर्थ लाठी या छड़ी हो सकता है; यहाँ भौतिक लाठी अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: इब्रानी मुहावरे को औपचारिक रूप से सुरक्षित रखता है; सहज सामूहिक विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: מַטֶּה
  choice: लाठी
  rationale: यहाँ नाम लिखी जाने वाली और आगे अंकुरित होने वाली भौतिक छड़ी अभिप्रेत है; आधुनिक हिन्दी में ‘लाठी’ स्पष्ट और स्वाभाविक है।
- source_word: מַטֶּה מַטֶּה לְבֵית אָב
  choice: हर पितृकुल के लिए एक-एक लाठी
  rationale: दोहराव की वितरणात्मक शक्ति को ‘एक-एक’ से व्यक्त किया गया है और בֵית אָב के वंशाधारित सामाजिक अर्थ के लिए ‘पितृकुल’ चुना गया है।
- source_word: נְשִׂיאֵיהֶם
  choice: उनके सब प्रधानों
  rationale: जनजातीय प्रतिनिधियों या मुखियाओं के लिए ‘प्रधान’ राजकीय अर्थ वाले ‘राजकुमार’ की अपेक्षा प्रसंगानुकूल है।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: लाठियों और प्रधानों की वंशगत-कुल व्यवस्था को स्पष्ट रूप से बनाए रखता है।
- source_word: שְׁנֵים עָשָׂר מַטּוֹת
  choice: कुल बारह लाठियाँ
  rationale: संख्या को स्पष्ट करता है और पहले प्रयुक्त संज्ञा से संगति रखता है।
- source_word: אִישׁ אֶת שְׁמוֹ תִּכְתֹּב
  choice: हर व्यक्ति का नाम ... लिख
  rationale: אִישׁ की वितरणात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है; आज्ञा का एकवचन रूप भी सुरक्षित है।
- source_word: עַל מַטֵּהוּ
  choice: उसकी लाठी पर
  rationale: हर प्रधान के नाम और उसकी संबद्ध लाठी के बीच संबंध को सीधे व्यक्त करता है।
