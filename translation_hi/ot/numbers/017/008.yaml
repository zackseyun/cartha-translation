    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: तब ... आए
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; एकवचन क्रिया संयुक्त कर्ता से पहले आने के कारण स्वाभाविक हिब्रू प्रयोग है। हिंदी में संयुक्त कर्ता के अनुसार बहुवचन ‘आए’ उचित है। ‘भीतर गए’ अनावश्यक रूप से प्रवेश का अर्थ जोड़ता।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिंदी बाइबल परंपरा में इस व्यक्तिनाम का प्रचलित रूप।
- source_word: וְאַהֲרֹן
  choice: और हारून
  rationale: संयोजक सहित व्यक्तिनाम का हिंदी में प्रचलित रूप।
- source_word: אֶל־פְּנֵי
  choice: के सामने
  rationale: शाब्दिक अर्थ ‘के मुख की ओर’ है; प्रसंग में किसी स्थान के आगे या सामने आने का स्वाभाविक हिंदी रूप ‘के सामने’ है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: निर्मित पवित्र तंबू के लिए परिचित हिंदी पद, जो אֹהֶל और מוֹעֵד के संबंध को बनाए रखता है।
