source:
  edition: WLC
  text: וַ/יְהִ֗י בְּ/הִקָּהֵ֤ל הָֽ/עֵדָה֙ עַל מֹשֶׁ֣ה וְ/עַֽל אַהֲרֹ֔ן וַ/יִּפְנוּ֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וְ/הִנֵּ֥ה כִסָּ֖ה/וּ הֶ/עָנָ֑ן וַ/יֵּרָ֖א כְּב֥וֹד יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/007.yaml
  text: And it happened[a], when the congregation assembled against Moses and against Aaron, that they turned toward the tent of meeting, and behold, the cloud covered it, and the glory of Yahweh appeared.
translation:
  language: hi
  text: और ऐसा हुआ कि जब समुदाय मूसा और हारून के विरुद्ध इकट्ठा हुआ, तब वे मिलाप के तंबू की ओर मुड़े, और देखो, बादल ने उसे[a] ढक लिया, और याहवे की महिमा प्रकट हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसे’ है; इस सर्वनाम का सबसे स्वाभाविक संकेत ‘मिलाप के तंबू’ की ओर है।
    reason: सर्वनाम के संदर्भ को स्पष्ट करना और मूल की सम्भावित अस्पष्टता बनाए रखना।
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ कि
  rationale: यह इब्रानी कथा में अगली घटना का परिचय देता है; यह रूप उसके कथात्मक प्रवाह को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּהִקָּהֵל הָעֵדָה
  choice: जब समुदाय ... इकट्ठा हुआ
  rationale: בְּ के साथ infinitive construct समयसूचक परिस्थिति बताता है, और עֵדָה यहाँ इस्राएली समुदाय को सामूहिक रूप में दर्शाता है।
- source_word: עַל
  choice: के विरुद्ध
  rationale: संदर्भ में समुदाय का एकत्र होना विरोधपूर्ण है, इसलिए केवल दिशा या विषय के बजाय ‘के विरुद्ध’ उपयुक्त है।
- source_word: וַיִּפְנוּ
  choice: वे ... की ओर मुड़े
  rationale: यह פנה के शारीरिक रूप से दिशा बदलने के अर्थ को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह जंगल के पवित्र तंबू के प्रचलित हिन्दी नाम को बनाए रखते हुए इब्रानी पद के दोनों घटकों को व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह आकस्मिक और महत्त्वपूर्ण दृश्य की ओर ध्यान खींचने वाली इब्रानी अभिव्यक्ति का स्वाभाविक, गरिमापूर्ण रूप है।
- source_word: כִסָּהוּ
  choice: उसे ढक लिया
  rationale: क्रिया के तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय को ‘उसे’ द्वारा स्पष्ट किया गया है, पर उसके संदर्भ की व्याकरणिक सम्भावना को मुख्य पाठ में खुला रखा गया है।
- source_word: הֶעָנָן
  choice: बादल
  rationale: मूल पाठ केवल ‘बादल’ कहता है; दिव्य उपस्थिति से उसका संबंध संदर्भ से स्पष्ट होता है, इसलिए अनावश्यक विस्तार नहीं जोड़ा गया।
- source_word: וַיֵּרָא
  choice: प्रकट हुई
  rationale: ראה का निफ़अल रूप यहाँ दृश्य रूप में प्रकट होने का भाव देता है।
- source_word: כְּבוֹד יְהוָה
  choice: याहवे की महिमा
  rationale: यह पद दिव्य महिमा की दृश्य अभिव्यक्ति को दर्शाता है और इब्रानी संबंध-रचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत दिव्य नाम सीधे प्रयुक्त है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: כִסָּהוּ में प्रत्यय का संदर्भ
  choice: मुख्य पाठ में ‘उसे’, जिसका सबसे स्वाभाविक संदर्भ मिलापवाला तंबू है
  alternative: समुदाय या पूरे दृश्य को ढकना
  rationale: पुल्लिंग एकवचन प्रत्यय का निकटतम पुल्लिंग एकवचन पूर्वपद אֹהֶל (‘तंबू’) है और पवित्र तंबू को बादल से ढकने का कथात्मक प्रतिरूप भी इसका समर्थन करता है; फिर भी टिप्पणी में वैकल्पिक समझ की सम्भावना बताई गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘और देखो’ मूल की ध्यानाकर्षक शक्ति को बनाए रखता है; ‘याहवे’ दिव्य नाम का देवनागरी लिप्यंतरण है।
