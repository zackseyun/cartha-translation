  text: וַ/יֹּצֵ֨א מֹשֶׁ֤ה אֶת כָּל הַ/מַּטֹּת֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה אֶֽל כָּל בְּנֵ֖י יִשְׂרָאֵ֑ל וַ/יִּרְא֥וּ וַ/יִּקְח֖וּ אִ֥ישׁ מַטֵּֽ/הוּ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/024.yaml
  text: So Moses brought out all the staffs from before Yahweh to all the sons of Israel[a], and they saw[b], and each man took his staff.
translation:
  language: hi
  text: तब मूसा सभी लाठियों को याहवे के सामने से निकालकर सभी इस्राएलियों[a] के पास ले आया। उन्होंने उन्हें देखा[b], और हर एक पुरुष ने अपनी लाठी ले ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “इस्राएल के सभी पुत्रों के पास।”
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने देखा।” मूल इब्रानी में कर्म व्यक्त नहीं किया गया है।
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיֹּצֵא
  choice: निकालकर ... ले आया
  rationale: יצא का हिफ़ील रूप किसी वस्तु को बाहर लाने का कारणवाचक अर्थ देता है। यह हिंदी अभिव्यक्ति उस अर्थ और इस्राएलियों के पास प्रस्तुत करने की गति—दोनों को स्वाभाविक रूप से व्यक्त करती है।
- source_word: הַמַּטֹּת
  choice: लाठियों
  rationale: מַטֶּה यहाँ गोत्र नहीं, यहोवा के सामने रखी गई भौतिक लाठियों को सूचित करता है। 'लाठी' आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: यहोवा के सामने से
  rationale: यह पदबंध इब्रानी के स्थानवाचक मुहावरे 'यहोवा के सम्मुख से' को सहज हिंदी में बनाए रखता है।
- source_word: אֶל כָּל בְּנֵי יִשְׂרָאֵל
  choice: सभी इस्राएलियों के पास
  rationale: בְּנֵי יִשְׂרָאֵל राष्ट्र-समुदाय का प्रचलित पद है। 'इस्राएली' हिंदी में स्वाभाविक है; शाब्दिक रूप फुटनोट में दिया गया है।
- source_word: וַיִּרְאוּ
  choice: उन्होंने उन्हें देखा
  rationale: ראה का मूल अर्थ 'देखना' है। कर्म 'उन्हें' प्रसंग से स्पष्ट रूप से लाठियों की ओर संकेत करता है और हिंदी में अपूर्णता से बचाता है, बिना निरीक्षण या पहचानने का अतिरिक्त भाव जोड़ने के।
- source_word: וַיִּקְחוּ אִישׁ מַטֵּהוּ
  choice: हर एक पुरुष ने अपनी लाठी ले ली
  rationale: אִישׁ यहाँ वितरणात्मक एकवचन है। 'हर एक पुरुष' उसके व्याकरणिक रूप को दर्शाता है, और 'अपनी' से מַטֵּהוּ का स्वामित्व स्पष्ट होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का विशिष्ट नाम सीधे आया है। हिंदी बाइबलीय परंपरा में परिचित 'यहोवा' पाठकों के लिए सुबोध है और इसे सामान्य उपाधि 'प्रभु' से अलग बनाए रखता है; 'याहवे' संभावित उच्चारण-आधारित विकल्प है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। वाक्य को स्वाभाविक हिंदी प्रवाह के लिए दो भागों में बाँटा गया है। 'लाठी' पूरे पद में एकरूप रखा गया है और इब्रानी की संक्षिप्त क्रमिक क्रियाओं को स्पष्ट किंतु अनावश्यक व्याख्या के बिना प्रस्तुत किया गया है।
