source:
  edition: WLC
  text: וְ/הִנַּחְתָּ֖/ם בְּ/אֹ֣הֶל מוֹעֵ֑ד לִ/פְנֵי֙ הָֽ/עֵד֔וּת אֲשֶׁ֛ר אִוָּעֵ֥ד לָ/כֶ֖ם שָֽׁמָּ/ה׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/019.yaml
  text: And you shall place them in the tent of meeting before the testimony[b][a], where I meet with you.
translation:
  language: hi
  text: और तुम उन्हें मिलाप के तंबू में, गवाही[a] के सामने, जहाँ मैं तुमसे मिलता हूँ[b], रख देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वाचा की गवाही’। यहाँ ‘गवाही’ संभवतः पवित्रस्थान में रखी वाचा की पटियाओं से जुड़ी गवाही को सूचित करती है, पर मूल पाठ ठीक-ठीक यह नहीं बताता कि संकेत पटियाओं, संदूक या वाचा-साक्ष्य की ओर है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘जहाँ मैं तुमसे मिलने के लिए ठहरता हूँ’; मूल क्रिया में नियुक्त या ठहराए हुए मिलन का भाव हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִנַּחְתָּם
  choice: और तुम उन्हें ... रख देना
  rationale: हिफ़ील रूप वस्तुओं को किसी स्थान पर रखने का निर्देश देता है। ‘रख देना’ आधुनिक हिन्दी में स्वाभाविक है और आदेशात्मक भाव बनाए रखता है।
- source_word: בְּאֹהֶל מוֹעֵד
  choice: मिलाप के तंबू में
  rationale: यह पवित्रस्थान के लिए प्रचलित पद है। ‘मिलाप के तंबू’ से אֹהֶל और מוֹעֵד, दोनों का अर्थ पारदर्शी और सहज रूप में व्यक्त होता है।
- source_word: לִפְנֵי הָעֵדוּת
  choice: गवाही के सामने
  rationale: לִפְנֵי का अर्थ ‘के सामने’ है। הָעֵדוּת को ‘गवाही’ कहना मूल की व्यापकता बनाए रखता है और मुख्य पाठ में उसे केवल पटियाओं, संदूक या किसी दस्तावेज़ तक सीमित नहीं करता।
- source_word: אֲשֶׁר אִוָּעֵד
  choice: जहाँ मैं ... मिलता हूँ
  rationale: यहाँ יעד का निफ़अल रूप ठहराए हुए मिलन का भाव रखता है। אֲשֶׁר और שָׁמָּה के स्थानवाचक मेल को हिन्दी के स्वाभाविक ‘जहाँ’ में व्यक्त किया गया है।
- source_word: לָכֶם
  choice: तुमसे
  rationale: यद्यपि לְ का मूल अर्थ ‘को/के लिए’ हो सकता है, יעד के साथ यह किसी से मिलने का मुहावरेदार भाव देता है; इसलिए हिन्दी में ‘तुमसे’ स्वाभाविक है।
- source_word: שָׁמָּה
  choice: ‘जहाँ’ में समाहित
  rationale: अलग से ‘वहाँ’ जोड़ने पर हिन्दी में अनावश्यक पुनरुक्ति होती। स्थानवाचक अर्थ ‘जहाँ’ में पूर्ण रूप से सुरक्षित है।
theological_decisions:
- issue: ‘गवाही’ का संकेत किसकी ओर है
  choice: मुख्य पाठ में केवल ‘गवाही’ रखा गया है।
  alternative: ‘वाचा की गवाही’, ‘गवाही की पटियाएँ’ या ‘गवाही का संदूक’
  rationale: इब्रानी पद इस वचन में यह स्पष्ट नहीं करता कि आशय सीधे पटियाओं, संदूक या व्यापक वाचा-साक्ष्य से है। अस्पष्टता को बनाए रखना किसी एक व्याख्या को पाठ में आरोपित करने से बेहतर है।
- issue: परमेश्वर के मिलने का भाव
  choice: ‘जहाँ मैं तुमसे मिलता हूँ’
  alternative: ‘जहाँ मैं तुमसे मिलने के लिए ठहरता हूँ’ या ‘जहाँ मैं तुमसे मिलने का स्थान नियुक्त करता हूँ’
  rationale: मूल क्रिया में साधारण मिलन के साथ नियुक्त या ठहराए हुए मिलन का भाव भी है। मुख्य पाठ स्वाभाविक हिन्दी रखता है और पादटिप्पणी में उस अतिरिक्त छाया को बताता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मिलाप के तंबू’ परिचित धार्मिक पद होते हुए भी अर्थ में पारदर्शी है। ‘गवाही’ की जानबूझकर बनी हुई अस्पष्टता को पादटिप्पणी में समझाया गया है; मुख्य पाठ में किसी विशिष्ट संदूक या पटिया का उल्लेख नहीं जोड़ा गया।
