base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/025.yaml
  text: And Yahweh said to Moses, “Put Aaron’s staff back before the testimony, to be kept as a sign for the sons of rebellion, so that you may put an end to their grumblings against me, and they may not die.”
translation:
  language: hi
  text: याहवे ने मूसा से कहा, “हारून की लाठी साक्ष्य[b] के सामने वापस रख दो, ताकि वह विद्रोह के पुत्रों[a] के लिए एक चिह्न के रूप में सुरक्षित रखी जाए, जिससे तुम मेरे विरुद्ध उनकी बड़बड़ाहट समाप्त कर दो और वे न मरें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “विद्रोह के पुत्रों”; अर्थात विद्रोही लोग या विद्रोही समुदाय।
    reason: lexical_alternative
  - marker: b
    text: “साक्ष्य” सम्भवतः वाचा-साक्ष्य की ओर संकेत करता है, जो सन्दूक से संबद्ध था; इब्रानी में अभिव्यक्ति संक्षिप्त है।
    reason: cultural_note
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के वाचा-संबंधी व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הָשֵׁב
  choice: वापस रख दो
  rationale: हिफ़ील आज्ञार्थ यहाँ लाठी को उसके पहले के स्थान पर फिर रखने का निर्देश देता है; यह हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: מַטֵּה
  choice: लाठी
  rationale: यह उस पुरोहितीय/गोत्रीय दण्ड को दर्शाता है जो चिह्न के रूप में प्रयुक्त हुआ; आधुनिक हिन्दी में ‘लाठी’ सहज है।
- source_word: לִפְנֵי הָעֵדוּת
  choice: साक्ष्य के सामने
  rationale: इब्रानी पद को जानबूझकर संक्षिप्त रखा गया है और उसमें ‘सन्दूक’ जैसा शब्द नहीं जोड़ा गया।
- source_word: לְמִשְׁמֶרֶת
  choice: सुरक्षित रखी जाए
  rationale: यह किसी वस्तु को आगे के लिए सँभालकर रखने या अभिरक्षा में रखने का उद्देश्य व्यक्त करता है।
- source_word: לְאוֹת
  choice: एक चिह्न के रूप में
  rationale: אוֹת का सामान्य अर्थ किसी याद दिलाने वाले प्रमाण या चिह्न से है।
- source_word: לִבְנֵי מֶרִי
  choice: विद्रोही लोगों
  rationale: शाब्दिक इब्रानी मुहावरा ‘विद्रोह के पुत्र’ हिन्दी में अस्वाभाविक और भ्रामक हो सकता है; अर्थ को मुख्य पाठ में सहज रूप से दिया और शाब्दिक रूप पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וּתְכַל
  choice: इस प्रकार तुम ... अन्त कर दोगे
  rationale: כלה का हिफ़ील रूप किसी बात को समाप्त करने या रुकवा देने का भाव देता है; प्रसंग में लाठी को चिह्न बनाकर रखने का अपेक्षित परिणाम बताया गया है।
- source_word: תְּלוּנֹּתָם
  choice: उनकी कुड़कुड़ाहट
  rationale: यह शब्द जंगल-वृत्तांत में बार-बार आने वाली असन्तुष्ट शिकायत या बड़बड़ाहट को व्यक्त करता है; ‘कुड़कुड़ाहट’ उस विशेष भाव को बनाए रखता है।
- source_word: מֵעָלַי
  choice: मेरे विरुद्ध
  rationale: शिकायतों के साथ यह पद बताता है कि उनकी कुड़कुड़ाहट याहवे के विरुद्ध थी।
- source_word: וְלֹא יָמֻתוּ
  choice: और वे नहीं मरेंगे
  rationale: 'इब्रानी समन्वय और अपेक्षित परिणाम दोनों को बनाए रखा गया है: शिकायतों के रुकने पर वे मृत्यु से बचेंगे।'
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; उसे सामान्य उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: לִבְנֵי מֶרִי का पुत्र-संबंधी इब्रानी मुहावरा
  choice: विद्रोही लोगों
  alternative: विद्रोह के पुत्रों
  rationale: मुहावरे का आशय विद्रोही समुदाय है, जैविक पुत्रत्व नहीं। मुख्य पाठ को स्वाभाविक हिन्दी में रखा गया है, जबकि शाब्दिक बनावट पादटिप्पणी में दी गई है।
- issue: וּתְכַל में आदेश, उद्देश्य और परिणाम का संबंध
  choice: इस प्रकार तुम ... अन्त कर दोगे
  alternative: ताकि तुम ... अन्त कर दो
  rationale: रूप को केवल आज्ञा या केवल उद्देश्य मानकर तनाव समाप्त नहीं किया गया; हिन्दी वाक्य इसे लाठी सँभालकर रखने के फलस्वरूप होने वाला परिणाम व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘साक्ष्य’ जैसे प्रसंग-विशेष शब्द को मूल की संक्षिप्तता बनाए रखने के लिए रखा गया है और पादटिप्पणी में स्पष्ट किया गया है।
