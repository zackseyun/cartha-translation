  text: אֵ֡ת מַחְתּוֹת֩ הַֽ/חַטָּאִ֨ים הָ/אֵ֜לֶּה בְּ/נַפְשֹׁתָ֗/ם וְ/עָשׂ֨וּ אֹתָ֜/ם רִקֻּעֵ֤י פַחִים֙ צִפּ֣וּי לַ/מִּזְבֵּ֔חַ כִּֽי הִקְרִיבֻ֥/ם לִ/פְנֵֽי יְהוָ֖ה וַ/יִּקְדָּ֑שׁוּ וְ/יִֽהְי֥וּ לְ/א֖וֹת לִ/בְנֵ֥י יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/003.yaml
  text: As for the censers of these men who sinned at the cost of their lives[a], let them make them into hammered plates as a covering for the altar, because they presented them before Yahweh and they became holy[e][d][c][b]; and they shall be a sign to the sons of Israel.
translation:
  language: hi
  text: इन पाप करनेवालों की धूपदानियों को, जिन्होंने अपने प्राणों की कीमत पर पाप किया[a], पीटकर वेदी को मढ़ने के लिए धातु की पतली चादरें[b] बनाओ; क्योंकि उन्होंने उन्हें यहोवा के सामने अर्पित किया था, इसलिए वे पवित्र हो गईं[c]। वे इस्राएलियों के लिए एक चिह्न होंगी[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने प्राणों के साथ/अपने प्राणों में”; इसका आशय यह भी हो सकता है, “जिन्होंने अपने ही प्राणों के विरुद्ध पाप किया।”
    reason: मूल इब्रानी पदबंध की संक्षिप्तता और संभावित अर्थभेद सुरक्षित रखना।
  - marker: b
    text: या “पीटी हुई धातु की पट्टियाँ।”
    reason: רִקֻּעֵי פַחִים के वैकल्पिक स्वाभाविक रूप को देना।
  - marker: c
    text: या “वे पवित्र ठहराई गईं।” सबसे स्वाभाविक रूप से इसका संकेत धूपदानियों की ओर है।
    reason: क्रिया के परिणामात्मक अथवा कर्मवाच्य भाव और उसके संदर्भ को स्पष्ट करना।
  - marker: d
    text: शाब्दिक रूप से, “इस्राएल के पुत्रों के लिए।”
    reason: सामुदायिक पदनाम का अधिक शाब्दिक विकल्प देना।
lexical_decisions:
- source_word: מַחְתּוֹת
  choice: धूपदानियाँ
  rationale: विद्रोह की कथा में ये धूप चढ़ाने के पात्र हैं; आधुनिक हिन्दी में ‘धूपदानी’ स्पष्ट और स्वाभाविक है।
- source_word: הַחַטָּאִים הָאֵלֶּה בְּנַפְשֹׁתָם
  choice: इन पाप करनेवालों की…जिनके पाप के कारण उनके प्राण गए
  rationale: कृदंत को घटना-सूचक रूप में रखा गया है और בְּנַפְשֹׁתָם का प्रसंगगत अर्थ उनके पाप के प्राणघातक परिणाम के रूप में व्यक्त किया गया है।
- source_word: רִקֻּעֵי פַחִים
  choice: पीटकर धातु की पतली चादरें
  rationale: यह धातु को पीटकर चपटी और पतली परतों में बदलने को सूचित करता है; ‘धातु’ मूल में निहित वस्तु को स्पष्ट करता है।
- source_word: צִפּוּי לַמִּזְבֵּחַ
  choice: ताकि उनसे वेदी मढ़ी जाए
  rationale: यह धातु की चादरों के प्रयोजन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי הִקְרִיבֻם לִפְנֵי יְהוָה
  choice: क्योंकि उन्होंने उन्हें यहोवा के सामने अर्पित किया था
  rationale: הקריב का उपासना-संबंधी अर्थ ‘अर्पित करना’ है; दोहरे सर्वनाम की अस्पष्टता मूल के अनुरूप रहने दी गई है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम-रूप से चतुराक्षरीय दिव्य नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: וַיִּקְדָּשׁוּ
  choice: वे पवित्र हो गईं
  rationale: स्त्रीलिंग बहुवचन हिन्दी सर्वनाम निकटतम और प्रसंगगत कर्ता ‘धूपदानियाँ’ की ओर संकेत करता है; परिणाम को बिना अतिरिक्त कर्ता निर्धारित किए रखा गया है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के लिए
  rationale: शाब्दिक ‘इस्राएल के पुत्रों’ का स्वाभाविक, समावेशी और सामुदायिक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: पवित्र होनेवाली वस्तुओं का संदर्भ
  choice: धूपदानियाँ पवित्र हो गईं क्योंकि उन्हें यहोवा के सामने अर्पित किया गया था।
  alternative: पाप करनेवाले पुरुष किसी सीमित उपासना-संबंधी अर्थ में पवित्र हुए।
  rationale: निकटतम बहुवचन पूर्वपद धूपदानियाँ हैं और यही अर्थ बताता है कि उनका उपयोग केवल वेदी की पवित्र मढ़ाई के लिए क्यों किया गया। पापियों से जुड़ी वस्तुओं के पवित्र हो जाने का पाठगत तनाव बनाए रखा गया है।
- issue: בְּנַפְשֹׁתָם का आशय
  choice: उनके पाप का परिणाम उनके अपने प्राणों की हानि था।
  alternative: उन्होंने अपने प्राणों के विरुद्ध पाप किया या अपनी आत्माओं के संबंध में पाप किया।
  rationale: तात्कालिक कथा में विद्रोह उनकी मृत्यु पर समाप्त हुआ; इसलिए यह अनुवाद किसी विकसित आत्मा-शरीर भेद को आरोपित किए बिना प्रसंगगत अर्थ देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। उपासना-संबंधी शब्दों में ‘धूपदानी’, ‘वेदी’, ‘अर्पित’ और ‘पवित्र’ जैसे स्थापित हिन्दी रूप लिए गए हैं। मूल की सर्वनामगत और धर्मवैचारिक जटिलता को अनावश्यक रूप से नहीं सुलझाया गया।
