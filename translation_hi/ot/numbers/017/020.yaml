  text: וְ/הָיָ֗ה הָ/אִ֛ישׁ אֲשֶׁ֥ר אֶבְחַר בּ֖/וֹ מַטֵּ֣/הוּ יִפְרָ֑ח וַ/הֲשִׁכֹּתִ֣י מֵֽ/עָלַ֗/י אֶת תְּלֻנּוֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֛ר הֵ֥ם מַלִּינִ֖ם עֲלֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/020.yaml
  text: And it shall be that the staff of the man whom I choose will bud[a], and I will put an end to the complaints of the sons of Israel, which they are grumbling against you.
translation:
  language: hi
  text: और ऐसा होगा कि जिस पुरुष को मैं चुनूँगा, उसकी लाठी में कलियाँ फूटेंगी; और मैं इस्राएल के पुत्रों[a] की उन शिकायतों को, जो वे तुम लोगों के विरुद्ध करते रहते हैं, अपने पास से दूर कर दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “इस्राएलियों” अथवा “इस्राएल के लोगों।” इब्रानी में: “इस्राएल के पुत्रों।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा कि
  rationale: भविष्यसूचक इब्रानी सूत्र को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: הָאִישׁ אֲשֶׁר אֶבְחַר בּוֹ
  choice: जिस पुरुष को मैं चुनूँगा
  rationale: सन्दर्भ में गोत्र का पुरुष प्रधान अभिप्रेत है; भविष्यकाल और परमेश्वर के चयन, दोनों को स्पष्ट रखता है।
- source_word: מַטֵּהוּ
  choice: उसकी लाठी
  rationale: प्रत्यय का अर्थ स्पष्ट रखते हुए מַטֶּה के सन्दर्भगत अर्थ ‘लाठी’ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִפְרָח
  choice: में कलियाँ फूटेंगी
  rationale: क्रिया अंकुरित होने या फूलने का अर्थ दे सकती है; अगले पद में आगे के विकास का वर्णन होने के कारण यहाँ आरम्भिक प्रस्फुटन उपयुक्त है।
- source_word: וַהֲשִׁכֹּתִי
  choice: शांत कर दूँगा
  rationale: हिफ़ील रूप का किसी बात को थमा देने या शांत करने का कारक अर्थ बनाए रखता है।
- source_word: מֵעָלַי
  choice: अपने ऊपर से
  rationale: अधिक व्याख्यात्मक ‘अपने विरुद्ध’ के बजाय इब्रानी स्थानवाचक रूपक को सुरक्षित रखता है।
- source_word: תְּלֻנּוֹת
  choice: शिकायतें
  rationale: आधुनिक हिन्दी में स्पष्ट शब्द है और असन्तोषपूर्ण कुड़कुड़ाहट का सन्दर्भ वहन करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक और वाचाई पदबंध को औपचारिक रूप से सुरक्षित रखता है; सामूहिक अर्थ पादटिप्पणी में स्पष्ट है।
- source_word: מַלִּינִם עֲלֵיכֶם
  choice: तुम लोगों के विरुद्ध करते रहते हैं
  rationale: कृदन्त की जारी रहनेवाली क्रिया और עַל के विरोधात्मक भाव को व्यक्त करता है।
theological_decisions:
- issue: מֵעָלַי और עֲלֵיכֶם के बीच सम्बन्ध
  choice: उन्हें मैं अपने ऊपर से शांत कर दूँगा ... तुम लोगों के विरुद्ध
  alternative: मेरे विरुद्ध की जानेवाली शिकायतों को समाप्त कर दूँगा
  rationale: मूल पाठ शिकायतों को परमेश्वर के ‘ऊपर से’ शांत करने और लोगों के मूसा तथा हारून के ‘विरुद्ध’ शिकायत करने—दोनों अभिव्यक्तियों को साथ रखता है। अनुवाद इस तनाव को किसी एक दिशा में समतल नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मूल के स्पष्ट पारिवारिक पदबंध को मुख्य पाठ में रखा गया है, जबकि उसका सामूहिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। ‘लाठी में कलियाँ फूटेंगी’ सामान्य पाठक के लिए सजीव और स्वाभाविक है। ‘अपने ऊपर से शांत कर दूँगा’ कुछ औपचारिक है, पर यह मूल इब्रानी के असामान्य रूपक और उसके धर्मवैचारिक तनाव को जानबूझकर सुरक्षित रखता है।
