review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the speaker, addressee, alarm particle, and the emphatic final totality. However, its two renderings of אָבַדְנוּ as “नाश हो गए” read as completed past events in Hindi, whereas in this fearful outcry the Hebrew perfects are most naturally represented as present, imminent destruction, parallel to “हम मर रहे हैं.”
  naturalness: “इस्राएलियों,” “मूसा,” and “देखो” are natural modern standard Hindi. Repeating “नाश हो रहे हैं” is idiomatic enough in this alarmed speech and preserves the Hebrew repetition better than varying the wording.
  terminology: “इस्राएली” is an appropriate modern corporate rendering of בְּנֵי יִשְׂרָאֵל. “मर रहे हैं” distinguishes גוע from אבד; “नाश हो रहे हैं” suitably renders the latter without imposing a theological interpretation.
  issues:
  - severity: medium
    issue: The repeated phrase “नाश हो गए” uses completed perfect aspect.
    rationale: 'This can imply that the people have already been destroyed. The context and English audit trail support an ongoing/imminent sense: “we are perishing.” A present-progressive Hindi form preserves the panicked outcry and aligns with the first clause.'
