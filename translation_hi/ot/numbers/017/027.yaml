  text: וַ/יֹּֽאמְרוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל אֶל מֹשֶׁ֖ה לֵ/אמֹ֑ר הֵ֥ן גָּוַ֛עְנוּ אָבַ֖דְנוּ כֻּלָּ֥/נוּ אָבָֽדְנוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/017/027.yaml
  text: And the sons of Israel said to Moses[a], saying, “Look[c][b], we perish! We are undone! All of us are undone!”
translation:
  language: hi
  text: तब इस्राएलियों ने मूसा से कहा, “देखो, हम मर रहे हैं! हम नाश हो रहे हैं! हम सब-के-सब नाश हो रहे हैं!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह हिब्रानी सामूहिक पहचान का आधुनिक, स्वाभाविक और स्पष्ट हिन्दी रूप है; शाब्दिक ‘इस्राएल के पुत्र’ यहाँ अनावश्यक रूप से कृत्रिम लगेगा।
- source_word: וַיֹּאמְרוּ ... לֵאמֹר
  choice: ने ... कहा
  rationale: प्रत्यक्ष कथन के परिचय में आधुनिक हिन्दी में ‘कहा’ ही दोनों हिब्रानी पदों का कार्य स्वाभाविक रूप से व्यक्त करता है; अलग से ‘यह कहते हुए’ अनावश्यक है।
- source_word: הֵן
  choice: देखो
  rationale: यह ध्यान खींचने और घबराहट प्रकट करने वाला उद्गार है; ‘देखो’ वर्तमान हिन्दी में उसकी तात्कालिकता बनाए रखता है।
- source_word: גָּוַעְנוּ
  choice: हम मर रहे हैं
  rationale: क्रिया प्राण निकलने या मरने को दर्शाती है। घबराहट भरी पुकार में वर्तमान प्रगतिशील रूप आसन्न मृत्यु का भाव स्पष्ट करता है।
- source_word: אָבַדְנוּ
  choice: हम नाश हो गए
  rationale: אבד विनाश या मिट जाने की दशा बताता है और גוע से भिन्न शब्द है; ‘नाश हो गए’ उस तीव्र भय को बनाए रखते हुए दोनों क्रियाओं को एक ही हिन्दी शब्द में नहीं मिलाता।
- source_word: כֻּלָּנוּ אָבָדְנוּ
  choice: हम सब-के-सब नाश हो गए
  rationale: ‘सब-के-सब’ समूचे समुदाय पर हिब्रानी बल को स्वाभाविक हिन्दी में सामने लाता है, और ‘नाश हो गए’ की पुनरावृत्ति मूल की घबराई हुई वाक्शैली बनाए रखती है।
