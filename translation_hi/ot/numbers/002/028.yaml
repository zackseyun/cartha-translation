lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: और उसका दल
  rationale: गणना और छावनी की व्यवस्था के इस प्रसंग में צָבָא एक संगठित जन-दल या सैन्य टुकड़ी को दर्शाता है। आधुनिक हिन्दी में ‘दल’ स्वाभाविक है और सक्रिय युद्ध का अर्थ अनावश्यक रूप से नहीं जोड़ता। एकवचन प्रत्यय को ‘उसका’ से व्यक्त किया गया है।
- source_word: וּפְקֻדֵיהֶם
  choice: उनमें से गिने गए लोग
  rationale: यह פקד से बना गणना-संबंधी पद है और उन व्यक्तियों को दर्शाता है जिनकी गिनती या भरती हुई। ‘लोग’ हिन्दी में वाक्य को स्वाभाविक बनाता है; व्यापक प्रसंग में ये युद्ध के योग्य पुरुष हैं, पर इस खंड में ‘पुरुष’ स्पष्ट रूप से नहीं है।
- source_word: אֶחָד וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: इकतालीस हज़ार पाँच सौ
  rationale: इब्रानी संख्या को अर्थ बदले बिना आधुनिक हिन्दी की सामान्य संख्या-रचना में प्रस्तुत किया गया है।
