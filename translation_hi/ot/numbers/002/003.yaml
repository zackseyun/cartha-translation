  yaml_path: translation/ot/numbers/002/003.yaml
  text: Those who camp on the east side, toward the sunrise, shall be the banner of the camp of Judah by their divisions; and the leader of the sons of Judah shall be Nahshon son of Amminadab.
translation:
  language: hi
  text: पूर्व की ओर, सूर्योदय की दिशा में, यहूदा की छावनी का ध्वज अपनी-अपनी टुकड़ियों के अनुसार होगा; और यहूदा के वंशजों का प्रधान अम्मीनादाब का पुत्र नहशोन होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דֶּגֶל
  choice: ध्वज
  rationale: यह शब्द किसी छावनी-दल के पहचान-चिह्न अथवा उसके अधीन संगठित समूह को सूचित करता है; ‘ध्वज’ प्रसंग में स्वाभाविक और स्पष्ट है।
- source_word: לְצִבְאֹתָם
  choice: अपने-अपने सैन्य-दलों के अनुसार
  rationale: צבא का बहुवचन यहाँ संगठित सैन्य टुकड़ियों/दल-विभागों का बोध कराता है; संबंधसूचक प्रत्यय को ‘अपने-अपने’ से व्यक्त किया गया है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: गोत्रीय नेतृत्व के पद के लिए आधुनिक, गरिमापूर्ण और संप्रदाय-निरपेक्ष शब्द।
- source_word: קֵדְמָה מִזְרָחָה
  choice: पूर्व की ओर, सूर्योदय की दिशा में
  rationale: दोनों दिशासूचक पदों की पुनरुक्ति को बनाए रखा गया है, क्योंकि दूसरा पद पहले को स्पष्ट और बल देता है।
- source_word: בְנֵי יְהוּדָה
  choice: यहूदा के वंशज
  rationale: यहाँ בני गोत्रीय समुदाय को दर्शाता है; ‘वंशज’ आधुनिक हिन्दी में आशय को स्पष्ट करता है।
