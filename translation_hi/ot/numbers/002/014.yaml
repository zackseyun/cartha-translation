  text: 'And the tribe of Gad[a], and the leader of the sons of Gad: Eliasaph son of Reuel.'
translation:
  language: hi
  text: और गाद का गोत्र[a]; और गाद के वंशजों का प्रधान रूएल का पुत्र एल्यासाप था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ पांडुलिपियों या समानांतर पदों में उसके पिता का नाम ‘दूएल’ मिलता है (देखें गिनती 1:14)।
    reason: textual_variant
lexical_decisions:
- source_word: וְ/מַטֵּה
  choice: और ... का गोत्र
  rationale: गिनती 2 की छावनी-व्यवस्था में מַטֶּה का अर्थ शाब्दिक ‘लाठी’ नहीं, बल्कि इस्राएल का जनजातीय विभाग है; आधुनिक हिन्दी में ‘गोत्र’ इस सूची के संदर्भ में स्वाभाविक है। संयोजक וְ को ‘और’ से रखा गया है।
- source_word: גָּד
  choice: गाद
  rationale: गोत्र और पूर्वज का व्यक्तिवाचक नाम; हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: וְ/נָשִׂיא
  choice: और ... प्रधान
  rationale: इस प्रशासनिक संदर्भ में נָשִׂיא मान्य जनजातीय अगुआ को दर्शाता है। ‘प्रधान’ गरिमापूर्ण और स्पष्ट है तथा ‘राजकुमार’ जैसा वंशानुगत राजकीय अर्थ नहीं जोड़ता।
- source_word: לִ/בְנֵי
  choice: के वंशजों का
  rationale: בְּנֵי यहाँ व्यापक जनजातीय समुदाय को सूचित करता है; ‘वंशज’ आधुनिक हिन्दी में ‘पुत्रों’ की अपेक्षा अभिप्राय अधिक स्पष्ट करता है, जबकि संबंधसूचक לִ को ‘का’ से व्यक्त किया गया है।
- source_word: אֶלְיָסָף
  choice: एल्यासाप
  rationale: व्यक्तिवाचक नाम का स्रोतानुसार हिन्दी लिप्यंतरण।
- source_word: בֶּן
  choice: का पुत्र
  rationale: प्रत्यक्ष पितृनाम-सूत्र को सामान्य और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רְעוּאֵל
  choice: रूएल
  rationale: WLC/मसोरेटिक पाठ में यहाँ רְעוּאֵל है; इसे समानांतर पद के ‘दूएल’ से मुख्य पाठ में नहीं मिलाया गया।
