base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/005.yaml
  text: Those camping next to it are the tribe of Issachar[a], and the leader of the sons of Issachar is Nethanel son of Zuar.
translation:
  language: hi
  text: उसके पास डेरा डालनेवालों में इस्साकार का गोत्र होगा, और इस्साकार के वंशजों[a] का प्रधान सूआर का पुत्र नतनेल होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में वाक्यांश का शाब्दिक रूप “इस्साकार के पुत्र” है। यह गोत्र का प्रचलित पदनाम है और इस्साकार के वंशजों या गोत्र के सदस्यों को दर्शाता है, केवल पुरुष व्यक्तियों को नहीं।
    reason: lexical_alternative
