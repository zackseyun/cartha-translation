  philosophy: optimal-equivalence
lexical_decisions:
- source_word: צְבָאוֹ
  choice: उसके दल में
  rationale: गिनती और छावनी के इस प्रसंग में צָבָא एक व्यवस्थित जनजातीय सैन्य-दल को दर्शाता है। ‘दल’ आधुनिक हिन्दी में स्वाभाविक है और सक्रिय युद्ध का अनावश्यक भाव जोड़े बिना संगठनात्मक अर्थ बनाए रखता है।
- source_word: פְקֻדָיו
  choice: गिने गए पुरुष
  rationale: פקד यहाँ जनगणना में गिने या नामांकित किए गए लोगों के लिए है। हिन्दी में ‘गिने गए पुरुष’ जनगणना-संबंधी अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שִׁשָּׁה וְאַרְבָּעִים אֶלֶף וַחֲמֵשׁ מֵאוֹת
  choice: छियालीस हज़ार पाँच सौ
  rationale: इब्रानी संख्या-क्रम को मानक आधुनिक हिन्दी संख्या-प्रयोग में व्यक्त किया गया है; कुल संख्या यथावत रखी गई है।
