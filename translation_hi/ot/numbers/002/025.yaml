base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/025.yaml
  text: The banner of the camp of Dan shall be on the north by their divisions[a]; and the leader of the sons of Dan shall be Ahiezer son of Ammishaddai.
translation:
  language: hi
  text: दान की छावनी का झंडा उत्तर की ओर होगा, उनके दलों के अनुसार[a]; और दान के पुत्रों का प्रधान अम्मीशद्दै का पुत्र अहीएजेर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनकी टुकड़ियों के अनुसार’ अथवा ‘उनकी सेनाओं के अनुसार।’
    reason: मूल צְבָאוֹת शब्द संगठित दलों, टुकड़ियों या सेनाओं के अर्थ की गुंजाइश रखता है।
lexical_decisions:
- source_word: דֶּגֶל
  choice: झंडा
  rationale: यह उस जनजातीय चिह्न अथवा ध्वज को दर्शाता है जिसके अधीन छावनी व्यवस्थित होती थी; ‘झंडा’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מַחֲנֵה דָן
  choice: दान का छावनी-दल
  rationale: यह केवल स्थान के रूप में छावनी नहीं, बल्कि दान के झंडे के अधीन संगठित शिविर-समूह को दर्शाता है; ‘छावनी-दल’ इस सूत्रगत प्रसंग में दोनों पहलुओं को व्यक्त करता है।
- source_word: צָפֹנָה
  choice: उत्तर की ओर
  rationale: दिशासूचक रूप पवित्र निवास के सापेक्ष उत्तर दिशा में स्थिति बताता है।
- source_word: לְצִבְאֹתָם
  choice: उनके सैन्य-दलों के अनुसार
  rationale: צָבָא यहाँ संगठित, सैन्य-शैली के समूहों को दर्शाता है; यह अनुवाद उस व्यवस्था को स्पष्ट करता है, जबकि पाठ की वैकल्पिक व्यापकता पादटिप्पणी में सुरक्षित है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: जनजातीय प्रशासनिक संदर्भ में यह मान्य अगुवा या मुखिया है; ‘प्रधान’ राजतंत्रीय अर्थ दिए बिना गरिमापूर्ण और संक्षिप्त है।
- source_word: לִבְנֵי דָן
  choice: दान के पुत्रों का
  rationale: हिब्रू के औपचारिक, पुल्लिंग जनजातीय पदनाम को यथासंभव निकटता से बनाए रखता है।
- source_word: אֲחִיעֶזֶר
  choice: अहीएजेर
  rationale: हिब्रू नाम का देवनागरी लिप्यंतरण।
- source_word: בֶּן עַמִּישַׁדָּי
  choice: अम्मीशद्दै का पुत्र
  rationale: पितृनाम-सूचक रचना को सीधे रूप में प्रस्तुत किया गया है और नाम का लिप्यंतरण किया गया है।
theological_decisions:
- issue: בְנֵי का लिंग-सूचक जनजातीय पदनाम
  choice: दान के पुत्रों
  alternative: दान के लोगों / दान के वंशजों
  rationale: मूल पाठ का शाब्दिक औपचारिक पदनाम ‘पुत्रों’ है; इसे मुख्य पाठ में रखा गया है ताकि जनजातीय सूत्र और व्याकरणिक रूप सुरक्षित रहें।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और सूत्रगत गद्य। ‘छावनी-दल’ और ‘सैन्य-दल’ से गिनती 2 के संगठित शिविर तथा सैन्य व्यवस्था का संदर्भ स्पष्ट किया गया है; नाम मूल हिब्रू के निकट देवनागरी में लिखे गए हैं।
