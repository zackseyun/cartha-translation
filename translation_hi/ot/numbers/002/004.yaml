  text: 'and his division[b][a], those numbered from them: seventy-four thousand six hundred.'
translation:
  language: hi
  text: और उसके दल में[a] गिने गए लोग[b] चौहत्तर हज़ार छह सौ थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेना” अथवा “सैन्य दल”; इब्रानी शब्द का सैन्य अर्थ हो सकता है, पर यहाँ वह छावनी में व्यवस्थित जनजातीय दल को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “नाम लिखकर गिने गए लोग”; इब्रानी में जनगणना के लिए दर्ज किए जाने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: और उसके दल में
  rationale: צָבָא सैन्य दल या सेना को सूचित कर सकता है; गिनती 2 में छावनी की व्यवस्थित जनजातीय टुकड़ी अभिप्रेत है। हिंदी में ‘दल’ संगठनात्मक और सैन्य दोनों संकेतों को सहज रूप से बनाए रखता है। ‘में’ हिंदी वाक्य को स्वाभाविक बनाता है और अगली गणना को उसी दल से जोड़ता है।
- source_word: וּפְקֻדֵיהֶם
  choice: गिने गए लोग
  rationale: פקד का यह रूप जनगणना में दर्ज या गिने गए व्यक्तियों को सूचित करता है। ‘गिने गए लोग’ इस गणना-संबंधी अर्थ को स्पष्ट रखता है; व्यापक प्रसंग में युद्ध-योग्य पुरुष होने पर भी इस उपवाक्य में ‘पुरुष’ जोड़ना आवश्यक नहीं है। बहुवचन प्रत्यय का संबंध दल के लोगों से स्वाभाविक हिंदी रचना द्वारा व्यक्त होता है।
- source_word: אַרְבָּעָה וְשִׁבְעִים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: चौहत्तर हज़ार छह सौ
  rationale: मूल संख्या 74,600 को आधुनिक मानक हिंदी के स्वाभाविक संख्या-क्रम में ठीक-ठीक व्यक्त किया गया है।
