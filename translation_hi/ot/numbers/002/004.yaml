  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण शैली। वाक्य को हिंदी में पूर्ण और स्वाभाविक बनाने के लिए ‘थे’ जोड़ा गया है। ‘दल’ सक्रिय युद्ध की अपेक्षा छावनी की संगठित जनजातीय इकाई पर बल देता है, जबकि पादटिप्पणी सैन्य विकल्प सुरक्षित रखती है।
