translation:
  language: hi
  text: दान की छावनी के गिने गए लोगों की कुल संख्या 1,57,600 थी। वे अपने-अपने ध्वजों के अनुसार सबसे पीछे कूच करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: गिने गए सभी लोगों की कुल संख्या
  rationale: निष्क्रिय कृदंत जनगणना में दर्ज किए गए लोगों को सूचित करता है। हिंदी में संख्या-वाक्य के साथ यह अभिव्यक्ति स्वाभाविक है और किसी अनकहे संज्ञा को अनावश्यक रूप से नहीं जोड़ती।
- source_word: לְמַחֲנֵה דָן
  choice: दान के छावनी-दल में
  rationale: यह पद दान से संबद्ध संगठित छावनी-समूह को दर्शाता है; ‘छावनी-दल’ सैन्य और शिविरगत दोनों भावों को स्पष्ट रखता है।
- source_word: מְאַת אֶלֶף וְשִׁבְעָה וַחֲמִשִּׁים אֶלֶף וְשֵׁשׁ מֵאוֹת
  choice: 1,57,600
  rationale: मूल की ठीक संख्या को आधुनिक भारतीय अंक-विभाजन के अनुसार प्रस्तुत किया गया है।
- source_word: לָאַחֲרֹנָה
  choice: सबसे पीछे
  rationale: यह क्रियाविशेषण यात्रा-क्रम में अंतिम स्थान को दर्शाता है; संदर्भ में ‘सबसे पीछे’ ‘अंत में’ से अधिक स्थानगत और स्पष्ट है।
- source_word: יִסְעוּ
  choice: चलेंगे
  rationale: निर्गमन और यात्रा के प्रसंग में נסע का अर्थ पड़ाव से आगे यात्रा करना है। ‘चलेंगे’ सहज हिंदी में यात्रा-क्रम को व्यक्त करता है।
- source_word: לְדִגְלֵיהֶם
  choice: अपने-अपने झंडों के अनुसार
  rationale: דגל छावनी की जनजातीय सैन्य पहचान और उसके अधीन व्यवस्थित दल, दोनों का संकेत दे सकता है। ‘झंडों के अनुसार’ दृश्य प्रतीक और संगठनात्मक क्रम को बनाए रखता है।
