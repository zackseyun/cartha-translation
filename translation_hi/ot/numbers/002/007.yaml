    reason: lexical_alternative
lexical_decisions:
- source_word: מַטֵּה
  choice: गोत्र
  rationale: गिनती में जनगणना और छावनी की व्यवस्था के संदर्भ में यह शब्द लाठी नहीं, बल्कि इस्राएल के एक वंशगत जनसमूह को दर्शाता है; हिन्दी में ‘गोत्र’ इस प्रशासनिक-वंशगत अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זְבוּלֻן
  choice: जबलून
  rationale: इब्रानी व्यक्तिवाचक और गोत्रीय नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְנָשִׂיא
  choice: और ... प्रधान
  rationale: इस प्रशासनिक संदर्भ में נָשִׂיא गोत्र के मान्य मुखिया को दर्शाता है। ‘प्रधान’ स्पष्ट और गरिमापूर्ण है तथा ‘राजकुमार’ जैसा अनावश्यक राजतंत्रीय अर्थ नहीं लाता।
- source_word: לִבְנֵי זְבוּלֻן
  choice: जबलून के पुत्रों का
  rationale: לְ यहाँ गोत्रीय सदस्यों के साथ संबंध व्यक्त करता है। ‘पुत्रों’ से इब्रानी वंशगत मुहावरा बना रहता है, जबकि संबंधसूचक अर्थ के निकटवर्ती विकल्प को पाद-टिप्पणी में रखा गया है।
- source_word: אֱלִיאָב
  choice: एलीआब
  rationale: व्यक्तिवाचक नाम को अर्थानुवाद के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: בֶּן חֵלֹן
  choice: हेलोन का पुत्र
  rationale: इब्रानी पितृनाम-सूचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
