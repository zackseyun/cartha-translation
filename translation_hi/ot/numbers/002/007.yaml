  text: 'The tribe of Zebulun[a], and the leader of the sons of Zebulun: Eliab son of Helon.'
translation:
  language: hi
  text: 'जबलून का गोत्र, और जबलून के पुत्रों[a] का प्रधान: हेलोन का पुत्र एलीआब।'
