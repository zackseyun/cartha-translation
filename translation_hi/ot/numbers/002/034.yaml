id: NUM.2.34
reference: Numbers 2:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַֽ/יַּעֲשׂ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל כְּ֠/כֹל אֲשֶׁר צִוָּ֨ה יְהוָ֜ה אֶת מֹשֶׁ֗ה כֵּֽן חָנ֤וּ לְ/דִגְלֵי/הֶם֙ וְ/כֵ֣ן נָסָ֔עוּ אִ֥ישׁ לְ/מִשְׁפְּחֹתָ֖י/ו עַל בֵּ֥ית אֲבֹתָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/034.yaml
  text: 'So the sons of Israel did according to all that Yahweh had commanded Moses: so they camped by their standards[a], and so they set out, each by his clans[c][b], according to his fathers’ house.'
translation:
  language: hi
  text: इस्राएलियों ने वह सब ठीक वैसे ही किया, जैसा यहोवा ने मूसा को आज्ञा दी थी। उन्होंने अपने-अपने ध्वजों के अनुसार डेरा डाला और कूच किया—हर एक अपने कुलों के अनुसार, अपने पितृकुल के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ בְּנֵי יִשְׂרָאֵל
  choice: इस प्रकार इस्राएलियों ने ... किया
  rationale: בְּנֵי יִשְׂרָאֵל राष्ट्र के लिए प्रचलित सामूहिक पद है; आधुनिक हिन्दी में ‘इस्राएली’ स्वाभाविक और समावेशी है, जबकि ‘इस्राएल के पुत्र’ यहाँ अनावश्यक रूप से शाब्दिक लगेगा।
- source_word: כְּכֹל אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: वह सब ... जिसकी आज्ञा यहोवा ने मूसा को दी थी
  rationale: כְּכֹל אֲשֶׁר की व्यापकता ‘वह सब’ से बनी रहती है; ‘दी थी’ उस पूर्व आज्ञा को स्वाभाविक हिन्दी कथा-क्रम में रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में चतुराक्षरीय ईश-नाम का परिचित नामरूप ‘यहोवा’ है; इसे पदवी ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- source_word: כֵּן חָנוּ לְדִגְלֵיהֶם וְכֵן נָסָעוּ
  choice: वे अपने-अपने झंडों के अनुसार डेरा डालते और कूच करते थे
  rationale: दोहराया गया כֵּן आज्ञा के अनुरूप दोनों क्रियाओं को जोड़ता है। हिन्दी में संयुक्त संरचना इस समानांतरता को स्वाभाविक ढंग से व्यक्त करती है। דֶּגֶל शिविर की पहचान और व्यवस्था बताने वाला झंडा/ध्वज है।
- source_word: אִישׁ לְמִשְׁפְּחֹתָיו
  choice: हर एक अपने कुलों ... के अनुसार
  rationale: אִישׁ यहाँ वितरणात्मक है, इसलिए ‘हर एक’; מִשְׁפָּחוֹת जनजातीय उपसमूहों को बताता है, जिनके लिए ‘कुल’ उपयुक्त है।
- source_word: עַל בֵּית אֲבֹתָיו
  choice: अपने पितृकुल के अनुसार
  rationale: בֵּית אָבוֹת पैतृक/वंशगत गृह-समूह का तकनीकी सामाजिक पद है। ‘पितृकुल’ संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवेह; प्रभु
  rationale: मूल में निजी वाचा-नाम स्पष्टतः उपस्थित है। हिन्दी पाठकों के लिए स्थापित रूप ‘यहोवा’ नाम को नाम के रूप में बनाए रखता है; ‘प्रभु’ मूल के नाम और पदवी के भेद को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘डेरा डालते’ और ‘कूच करते’ इस सार-वाक्य की पुनरावृत्त/नियमित क्रिया को व्यक्त करते हैं। ‘झंडा’, ‘कुल’ और ‘पितृकुल’ शिविर की क्रमबद्ध जनजातीय संरचना को बिना अतिरिक्त व्याख्या के स्पष्ट करते हैं।
