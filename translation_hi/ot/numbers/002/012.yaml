  text: וְ/הַ/חוֹנִ֥ם עָלָ֖י/ו מַטֵּ֣ה שִׁמְע֑וֹן וְ/נָשִׂיא֙ לִ/בְנֵ֣י שִׁמְע֔וֹן שְׁלֻמִיאֵ֖ל בֶּן צוּרִֽי שַׁדָּֽי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/012.yaml
  text: Those camping next to him are the tribe of Simeon[a], and the leader of the sons of Simeon is Shelumiel son of Zurishaddai.
translation:
  language: hi
  text: और उसके पास शिमोन का गोत्र पड़ाव डाले हुए है[a]; शिमोन के पुत्रों का प्रधान सूरीशद्दै का पुत्र शलूमीएल है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके बगल में।” इब्रानी पूर्वसर्ग यहाँ छावनी की व्यवस्था में निकटता का भाव देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַחֹנִם
  choice: और ... पड़ाव डालेगा
  rationale: חנה के बहुवचन कृदन्त को छावनी की व्यवस्था बताने वाले प्रसंग में गोत्र को कर्ता बनाकर स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: עָלָיו
  choice: उसके पास
  rationale: यहाँ עַל स्थानिक निकटता व्यक्त करता है, न कि शाब्दिक रूप से ‘उसके ऊपर’। हिन्दी का ‘उसके’ पुल्लिंग एकवचन संकेत को बनाए रखता है और संदर्भ की सम्भावित अस्पष्टता को अनावश्यक रूप से नहीं सुलझाता।
- source_word: מַטֵּה שִׁמְעוֹן
  choice: शिमोन का गोत्र
  rationale: गिनती और छावनी के प्रसंग में מַטֶּה का अर्थ छड़ी नहीं, बल्कि गोत्रीय इकाई है।
- source_word: וְנָשִׂיא
  choice: प्रधान
  rationale: נָשִׂיא यहाँ गोत्र के मान्य मुखिया को दर्शाता है; ‘प्रधान’ आधुनिक हिन्दी में स्पष्ट है और ‘राजकुमार’ के राजकीय अर्थ से बचता है।
- source_word: לִבְנֵי שִׁמְעוֹן
  choice: शिमोन के पुत्रों का
  rationale: इब्रानी की पुत्र-संबंधी अभिव्यक्ति को लिंग-सटीक और औपचारिक रूप से सुरक्षित रखा गया है।
- source_word: שְׁלֻמִיאֵל
  choice: शलूमीएल
  rationale: व्यक्तिनाम का देवनागरी लिप्यन्तरण किया गया है।
- source_word: בֶּן צוּרִי שַׁדָּי
  choice: सूरीशद्दै का पुत्र
  rationale: पितृनाम-सूचक रचना को स्वाभाविक हिन्दी शब्दक्रम में रखा गया और नाम का लिप्यन्तरण किया गया है।
theological_decisions:
- issue: לִבְנֵי שִׁמְעוֹן में लिंगयुक्त वंश-संबंधी भाषा
  choice: शिमोन के पुत्रों का
  alternative: शिमोन के वंशजों का / शिमोन के लोगों का
  rationale: मूल में ‘पुत्रों’ का पुल्लिंग बहुवचन है। यहाँ उसे बनाए रखने से अर्थ स्पष्ट रहता है और मूल की वंश-संबंधी भाषा अनावश्यक रूप से समतल नहीं होती।
- issue: עָלָיו के पुल्लिंग एकवचन संकेत का संदर्भ
  choice: उसके पास
  alternative: उसके बगल में / उसके पास ही
  rationale: इब्रानी रूप पुल्लिंग एकवचन है, पर छावनी-विन्यास में उसका सटीक संदर्भ व्यक्ति, गोत्रीय दल या पहले उल्लिखित मानक से जुड़ा समझा जा सकता है। मुख्य पाठ इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। ‘पड़ाव डालेगा’ प्रसंग की निर्देशात्मक छावनी-व्यवस्था के अनुकूल है; अर्धविराम दोनों निकट जुड़े उपवाक्यों को स्पष्ट करता है।
