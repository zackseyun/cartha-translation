translation:
  language: hi
  text: और उसके दल के गिने हुए लोगों की संख्या उनसठ हज़ार तीन सौ थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: और उसके दल में
  rationale: गिनती और छावनी की व्यवस्था के इस संदर्भ में צָבָא एक गोत्रीय सैन्य टुकड़ी या संगठित दल को दर्शाता है। आधुनिक हिंदी में ‘दल’ स्वाभाविक है और ‘सेना’ की अपेक्षा संदर्भगत संगठनात्मक अर्थ को बेहतर ढंग से व्यक्त करता है।
- source_word: וּפְקֻדֵיהֶם
  choice: गिने गए लोगों की संख्या
  rationale: פקד का यह रूप जनगणना में गिने गए व्यक्तियों को सूचित करता है। हिंदी वाक्य में कुल संख्या से सहज संबंध बैठाने के लिए इसे ‘गिने गए लोगों की संख्या’ कहा गया है; ‘सैनिक’ जोड़कर मूल पद से अधिक स्पष्टता आरोपित नहीं की गई।
- source_word: תִּשְׁעָה וַחֲמִשִּׁים אֶלֶף
  choice: उनसठ हज़ार
  rationale: इब्रानी में संख्या का क्रम शाब्दिक रूप से ‘नौ और पचास हज़ार’ है, किंतु आधुनिक मानक हिंदी में ठीक वही मान स्वाभाविक क्रम ‘उनसठ हज़ार’ में व्यक्त होता है।
- source_word: וּשְׁלֹשׁ מֵאוֹת
  choice: तीन सौ
  rationale: यह जनगणना के कुल योग को पूरा करता है। आधुनिक हिंदी में बड़ी संख्या के भीतर अलग संयोजक लगाए बिना ‘उनसठ हज़ार तीन सौ’ स्वाभाविक है।
