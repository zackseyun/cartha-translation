  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पूर्ववर्ती पद से जुड़े खंड को हिंदी में पूर्ण और स्वाभाविक वाक्य बनाने के लिए ‘संख्या ... थी’ का प्रयोग किया गया है।
