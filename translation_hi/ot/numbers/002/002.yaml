  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य में डैश वितरणात्मक निर्देश को स्पष्ट करते हैं। ‘पितृकुल’ वंश-आधारित सामाजिक संरचना को संक्षेप में व्यक्त करता है; ‘घरानों’ की अपेक्षा यह थोड़ा औपचारिक है, पर बाइबलीय संदर्भ में स्पष्ट और प्रचलित है।
