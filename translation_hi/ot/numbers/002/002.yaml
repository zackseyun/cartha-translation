  text: אִ֣ישׁ עַל דִּגְל֤/וֹ בְ/אֹתֹת֙ לְ/בֵ֣ית אֲבֹתָ֔/ם יַחֲנ֖וּ בְּנֵ֣י יִשְׂרָאֵ֑ל מִ/נֶּ֕גֶד סָבִ֥יב לְ/אֹֽהֶל מוֹעֵ֖ד יַחֲנֽוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/002.yaml
  text: The sons of Israel shall camp[a], each man by his banner, according to the signs of their fathers’ houses; they shall camp facing the tent of meeting[c][b], all around it.
translation:
  language: hi
  text: इस्राएल के पुत्र[b]—हर एक पुरुष अपने झंडे[a] के पास, अपने पितृकुल के चिह्नों के अनुसार—डेरा डालें। वे मिलाप के तंबू[c] से कुछ दूरी पर, उसके चारों ओर डेरा डालें[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘झंडे’ के लिए ‘ध्वज’ भी सम्भव है। हिब्रू शब्द किसी गोत्र या सैन्य दल की पहचान कराने वाले झंडे को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ‘इस्राएली’। ‘इस्राएल के पुत्र’ हिब्रू के पारिवारिक मुहावरे का अधिक शाब्दिक रूप है।
    reason: lexical_alternative
  - marker: c
    text: इस पदबंध का अनुवाद ‘मिलापवाला तंबू’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: d
    text: या ‘मिलाप के तंबू के सामने, उसके चारों ओर’। हिब्रू पद तंबू के सम्मुख अथवा उससे अलग स्थित होकर, उसके चारों ओर शिविर लगाने का भाव देता है।
    reason: ambiguity
lexical_decisions:
- source_word: אִישׁ
  choice: हर एक पुरुष
  rationale: एकवचन का प्रयोग यहाँ समुदाय के प्रत्येक पुरुष के लिए वितरणात्मक अर्थ में हुआ है; हिन्दी में ‘हर एक पुरुष’ इस बल को स्पष्ट रखता है।
- source_word: דִּגְלוֹ
  choice: अपने झंडे के पास
  rationale: דֶּגֶל किसी गोत्र या सैन्य दल की पहचान कराने वाले ध्वज को दर्शाता है। ‘झंडा’ आधुनिक हिन्दी में सहज है, और עַל को शिविर-व्यवस्था के संदर्भ में ‘के पास’ कहा गया है।
- source_word: בְאֹתֹת
  choice: चिह्नों के अनुसार
  rationale: אוֹת यहाँ पितृकुलों की पहचान बताने वाले चिह्नों को सूचित करता है। ‘के अनुसार’ शिविर लगाने की व्यवस्था से उसका संबंध स्वाभाविक रूप से व्यक्त करता है, बिना चिह्नों के स्वरूप को अनावश्यक रूप से निश्चित किए।
- source_word: לְבֵית אֲבֹתָם
  choice: अपने पितृकुल के
  rationale: यह पदबंध पैतृक घराने अथवा वंश-समूह को दर्शाता है। ‘पितृकुल’ मूल की सामाजिक और वंशगत धारणा को संक्षेप में सुरक्षित रखता है।
- source_word: יַחֲנוּ
  choice: डेरा डालें
  rationale: निर्देशात्मक संदर्भ में अपूर्ण क्रिया आदेशित व्यवस्था व्यक्त करती है; ‘डेरा डालें’ आधुनिक हिन्दी में स्पष्ट निर्देश है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह अनुवाद मूल के पारिवारिक पदबंध को बनाए रखता है; अर्थ की स्पष्टता के लिए पादटिप्पणी में ‘इस्राएली’ दिया गया है।
- source_word: מִנֶּגֶד
  choice: के सामने
  rationale: यह शब्द सामने, विपरीत दिशा में, अथवा कुछ दूरी पर होने का भाव दे सकता है। मुख्य पाठ में स्थान-संबंधी सामान्य अर्थ रखा गया है और दूरी की सम्भावना पादटिप्पणी में दी गई है।
- source_word: סָבִיב
  choice: उसके चारों ओर
  rationale: यह तंबू को सभी ओर से घेरे हुए शिविर-विन्यास को व्यक्त करता है; हिन्दी में संदर्भसूचक ‘उसके’ संबंध स्पष्ट करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह हिब्रू पदबंध के ‘तंबू’ और नियत भेंट/मिलाप के भाव को पारदर्शी ढंग से रखता है तथा केवल पारंपरिक धार्मिक शब्दावली पर निर्भर नहीं रहता।
theological_decisions:
- issue: लिंगसूचक और पारिवारिक सामूहिक भाषा
  choice: हर एक पुरुष / इस्राएल के पुत्र
  alternative: हर एक व्यक्ति / इस्राएली
  rationale: אִישׁ स्पष्ट रूप से पुल्लिंग एकवचन में वितरणात्मक है और בְּנֵי יִשְׂרָאֵל पारिवारिक सामूहिक मुहावरा है। मुख्य पाठ मूल रूप को सुरक्षित रखता है, जबकि पादटिप्पणी सामूहिक अर्थ स्पष्ट करती है।
- issue: पवित्र तंबू के पद का अनुवाद
  choice: मिलापवाला तंबू
  alternative: मिलाप का तंबू / तंबू-निवास
  rationale: אֹהֶל מוֹעֵד का सीधा और समझने योग्य अनुवाद चुना गया है; इससे बाद की स्थापत्य धारणाएँ मूल पदबंध पर आरोपित नहीं होतीं।
- issue: מִנֶּגֶד में स्थान और दूरी का संबंध
  choice: के सामने
  alternative: कुछ दूरी पर
  rationale: शब्द सामने या विपरीत स्थिति के साथ दूरी का भाव भी दे सकता है। मुख्य पाठ स्थानिक संबंध रखता है और वास्तविक शब्दार्थगत अस्पष्टता को पादटिप्पणी में सुरक्षित किया गया है।
