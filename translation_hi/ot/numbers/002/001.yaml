- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: אֶל־מֹשֶׁה וְאֶל־אַהֲרֹן
  choice: मूसा और हारून से
  rationale: हिन्दी में ‘से कहा’ दोनों संबोधित व्यक्तियों को स्वाभाविक और स्पष्ट रूप से जोड़ता है; इब्रानी में दोहराया गया אֶל दोनों को अलग-अलग संबोधित करता है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी वचन-परिचायक सूत्र को हिन्दी में अलग ‘यह कहते हुए’ जोड़ने के बजाय मुख्य क्रिया ‘कहा’ और आगे आने वाले कथन से स्वाभाविक रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। ‘याहवे’ नाम को सुरक्षित रखता है और उसे किसी उपाधि से नहीं बदलता।
