  yaml_path: translation/ot/numbers/002/027.yaml
  text: 'Those camping next to it: the tribe of Asher[a], and the leader of the sons of Asher, Pagiel son of Ocran.'
translation:
  language: hi
  text: और उसके पास डेरे डालनेवालों में आशेर का गोत्र होगा; आशेर के वंशजों का प्रधान ओक्रान का पुत्र पगीएल होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֹנִים
  choice: छावनी डालनेवाले
  rationale: वर्तमान कृदंत का समूहवाचक अर्थ बनाए रखता है और छावनी की व्यवस्था के संदर्भ में स्वाभाविक हिंदी है।
- source_word: עָלָיו
  choice: उसके पास
  rationale: यहाँ עַל स्थानिक निकटता दर्शाता है, न कि किसी वस्तु के ऊपर होने का भाव; ‘उसके पास’ शिविर-विन्यास में साथ की स्थिति स्पष्ट करता है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: गिनती की जनगणना और छावनी-व्यवस्था में यह इस्राएल के गोत्रीय विभाग का मानक अर्थ है।
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह गोत्र के मान्य मुखिया को दर्शाता है; ‘प्रधान’ सहज और गैर-राजवंशीय शब्द है।
- source_word: לִבְנֵי אָשֵׁר
  choice: आशेर के वंशजों का
  rationale: शाब्दिक ‘आशेर के पुत्रों’ के वंशगत सामुदायिक अर्थ को आधुनिक हिंदी में स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: פַּגְעִיאֵל
  choice: पगीएल
  rationale: इब्रानी नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בֶּן עָכְרָן
  choice: ओक्रान का पुत्र
  rationale: प्रत्यक्ष पितृनाम-संबंध को स्वाभाविक हिंदी क्रम में व्यक्त करता है।
