  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सहज बाइबलीय गद्य। पद की सूची-सदृश संरचना को अर्धविराम से स्पष्ट किया गया है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि ‘उसके पास’ संदर्भगत स्थानिक अर्थ को पर्याप्त रूप से व्यक्त करता है।
