  text: All those counted for the camp of Reuben were 151,450 by their companies[b][a]. They shall set out second.
translation:
  language: hi
  text: रूबेन की छावनी से संबंधित, उनकी सैन्य टुकड़ियों के अनुसार गिने गए सभी लोगों की कुल संख्या 1,51,450 थी। वे दूसरे क्रम में कूच करेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: गिने गए लोगों की कुल संख्या
  rationale: यह पदबंध जनगणना में दर्ज सभी लोगों का कुल योग प्रस्तुत करता है। हिंदी में यह रूप व्यापकता और गणना—दोनों को स्वाभाविक ढंग से व्यक्त करता है; पद में स्पष्ट न होने के कारण ‘पुरुष’ नहीं जोड़ा गया।
- source_word: לְמַחֲנֵה רְאוּבֵן
  choice: रूबेन के छावनी-दल में
  rationale: מַחֲנֶה यहाँ रूबेन से संबद्ध संगठित छावनी-समूह को दर्शाता है; ‘छावनी-दल’ संदर्भ के सैन्य और पड़ाव-संबंधी दोनों पहलुओं को व्यक्त करता है।
- source_word: מְאַת אֶלֶף וְאֶחָד וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת וַחֲמִשִּׁים
  choice: 1,51,450
  rationale: इब्रानी संख्या का ठीक योग है। भारतीय अंक-विभाजन आधुनिक हिंदी पाठकों के लिए सहज है।
- source_word: לְצִבְאֹתָם
  choice: अपने-अपने सैन्य दलों के अनुसार संगठित थे
  rationale: צְבָאוֹת संगठित सैन्य टुकड़ियों या दलों को सूचित करता है। इस रूप से गणना का उनके सैन्य दलों के अनुसार होना स्पष्ट होता है और हिंदी वाक्य स्वाभाविक रहता है।
- source_word: וּשְׁנִיִּם יִסָּעוּ
  choice: वे दूसरे क्रम में कूच करेंगे
  rationale: शाब्दिक संरचना ‘और दूसरे वे प्रस्थान करेंगे’ यात्रा-क्रम में इस छावनी का दूसरा स्थान बताती है। ‘कूच करेंगे’ सैन्य छावनी के चल पड़ने के संदर्भ में स्वाभाविक है।
