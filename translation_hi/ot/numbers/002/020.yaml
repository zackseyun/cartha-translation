  text: And next to him was the tribe of Manasseh[a], and the leader of the sons of Manasseh was Gamaliel son of Pedahzur.
translation:
  language: hi
  text: और उसके बगल में मनश्शे का गोत्र था। मनश्शे के वंशजों का प्रधान पदासूर का पुत्र गमलीएल था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָלָיו
  choice: और उसके पास ... था
  rationale: गिनती 2 में छावनी की व्यवस्था के संदर्भ में עַל और सर्वनाम-प्रत्यय स्थानिक निकटता बताते हैं, अधिकार नहीं। हिंदी में ‘उसके पास’ यह निकटवर्ती स्थान स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַטֵּה
  choice: गोत्र
  rationale: जनगणना और छावनी की व्यवस्था के संदर्भ में מַטֶּה एक इस्राएली गोत्र को दर्शाता है, न कि छड़ी को।
- source_word: מְנַשֶּׁה
  choice: मनश्शे
  rationale: इब्रानी व्यक्ति और गोत्र के नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: וְנָשִׂיא
  choice: प्रधान
  rationale: गिनती में נָשִׂיא नियुक्त गोत्रीय मुखिया को दर्शाता है। ‘प्रधान’ आधुनिक, स्पष्ट और गरिमापूर्ण है तथा राजवंशीय ‘राजकुमार’ का भ्रामक अर्थ नहीं देता।
- source_word: לִבְנֵי מְנַשֶּׁה
  choice: मनश्शे के वंशजों का
  rationale: בְּנֵי वंशगत समुदाय को दर्शाता है। सहज हिंदी में ‘वंशजों’ से आशय स्पष्ट रहता है और केवल मनश्शे के प्रत्यक्ष पुत्रों का अर्थ नहीं निकलता।
- source_word: גַּמְלִיאֵל
  choice: गमलीएल
  rationale: इब्रानी नाम का हिंदी लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंशसूचक patronymic रचना का सीधा और स्वाभाविक हिंदी रूप।
- source_word: פְּדָהצוּר
  choice: पदासूर
  rationale: इब्रानी नाम का हिंदी लिप्यंतरण।
