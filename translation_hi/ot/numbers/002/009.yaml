  yaml_path: translation/ot/numbers/002/009.yaml
  text: All those counted for the camp of Judah were 186,400 by their divisions[c][b][a]. They shall set out first.
translation:
  language: hi
  text: यहूदा के शिविर के लिए गिने गए[a] सभी लोगों की कुल संख्या, उनके दलों[b] के अनुसार, 1,86,400 थी। वे सबसे पहले कूच करेंगे।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिनती में दर्ज किए गए’।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनकी टुकड़ियों के अनुसार’ अथवा ‘उनकी सेनाओं के अनुसार’।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘वे सबसे पहले प्रस्थान करेंगे’; शिविर के संदर्भ में इसका अर्थ ‘वे सबसे पहले पड़ाव उठाएँगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל הַפְּקֻדִים
  choice: गिने गए सभी लोगों की कुल संख्या
  rationale: הַפְּקֻדִים जनगणना अथवा सैनिक गिनती में दर्ज किए गए लोगों को दर्शाता है। हिंदी में ‘गिने गए सभी लोगों की कुल संख्या’ इस सारांश-वाक्य को स्वाभाविक बनाते हुए כָּל की समग्रता को बनाए रखता है।
- source_word: לְמַחֲנֵה יְהוּדָה
  choice: यहूदा के पड़ाव में
  rationale: מַחֲנֶה यहाँ यहूदा के नेतृत्व वाले व्यवस्थित शिविर-समूह को दर्शाता है। ‘पड़ाव’ निर्गमन-यात्रा के संदर्भ में सहज है और केवल आधुनिक सैन्य छावनी का बोध नहीं कराता।
- source_word: מְאַת אֶלֶף וּשְׁמֹנִים אֶלֶף וְשֵׁשֶׁת אֲלָפִים וְאַרְבַּע מֵאוֹת
  choice: 1,86,400
  rationale: मूल संख्या ठीक 186,400 है। भारतीय अंक-विभाजन के अनुसार लिखी संख्या हिंदी पाठकों के लिए स्पष्ट और सुगम है।
- source_word: לְצִבְאֹתָם
  choice: उनके दलों के अनुसार
  rationale: צָבָא का अर्थ सेना, समुदाय अथवा संगठित सैन्य दल हो सकता है। यहाँ ‘दल’ शिविर की व्यवस्थित टुकड़ियों का भाव रखता है, पर आधुनिक स्थायी सेनाओं का अनावश्यक अर्थ नहीं थोपता।
- source_word: רִאשֹׁנָה
  choice: सबसे पहले
  rationale: यह क्रियाविशेषण यात्रा आरंभ करने के क्रम को बताता है।
- source_word: יִסָּעוּ
  choice: कूच करेंगे
  rationale: נסע इस मरुभूमि-पड़ाव के संदर्भ में पड़ाव से आगे चलने को व्यक्त करता है। ‘कूच करेंगे’ संक्षिप्त, स्वाभाविक और यहाँ के संगठित यात्रा-क्रम के अनुरूप है।
