  yaml_path: translation/ot/numbers/002/032.yaml
  text: These are the numbered men of the sons of Israel by their fathers’ houses[c][b][a]. All the numbered men of the camps by their divisions were six hundred three thousand five hundred fifty.
translation:
  language: hi
  text: ये इस्राएल के पुत्रों के, उनके पितृकुलों के अनुसार, गिने गए पुरुष[a] थे[b]। छावनियों के, उनके-अपने दलों[c] के अनुसार, गिने गए सभी पुरुषों की संख्या छह लाख तीन हज़ार पाँच सौ पचास थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गिने गए लोग’ अथवा ‘दर्ज किए गए पुरुष’।
    reason: lexical_alternative
  - marker: b
    text: 'या ‘इस्राएली’। शाब्दिक अर्थ: ‘इस्राएल के पुत्र’।'
    reason: lexical_alternative
  - marker: c
    text: या ‘अपनी-अपनी टुकड़ियों’ अथवा ‘अपनी-अपनी सेनाओं’।
    reason: lexical_alternative
lexical_decisions:
- source_word: פְּקוּדֵי
  choice: गिने गए पुरुष
  rationale: यह रूप जनगणना में दर्ज किए गए लोगों को सूचित करता है। गिनती का प्रसंग युद्ध-सेवा के योग्य पुरुषों का है, इसलिए संदर्भगत रूप से ‘पुरुष’ जोड़ा गया है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: यह चयन इब्रानी की पारिवारिक और वाचागत अभिव्यक्ति को बनाए रखता है; ‘इस्राएली’ अधिक सहज विकल्प है, पर मूल रूपक को स्पष्ट नहीं करता।
- source_word: לְבֵית אֲבֹתָם
  choice: उनके पितृकुलों के अनुसार
  rationale: यह जनगणना के संदर्भ में पितृवंश पर आधारित कुल-इकाइयों को स्वाभाविक और सटीक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַמַּחֲנֹת
  choice: छावनियाँ
  rationale: यह मिलापवाले तंबू के चारों ओर व्यवस्थित गोत्रीय शिविरों के लिए स्पष्ट और गरिमापूर्ण हिन्दी शब्द है।
- source_word: לְצִבְאֹתָם
  choice: अपने-अपने दलों के अनुसार
  rationale: यह संगठित सैन्य-सदृश समूहों का भाव देता है, पर सक्रिय युद्ध का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: שֵׁשׁ מֵאוֹת אֶלֶף וּשְׁלֹשֶׁת אֲלָפִים וַחֲמֵשׁ מֵאוֹת וַחֲמִשִּׁים
  choice: छः लाख तीन हज़ार पाँच सौ पचास
  rationale: 603,550 को भारतीय संख्या-पद्धति के अनुसार शब्दों में स्वाभाविक हिन्दी रूप दिया गया है।
theological_decisions:
- issue: जनगणना की लिंग-सूचक भाषा
  choice: ‘गिने गए पुरुष’
  alternative: ‘गिने गए लोग’ अथवा ‘दर्ज किए गए जन’
  rationale: यद्यपि इस पद में ‘पुरुष’ के लिए अलग शब्द नहीं है, गिनती 1–2 का निकट संदर्भ युद्ध-सेवा के योग्य वयस्क पुरुषों को परिभाषित करता है। इसलिए लिंग-संदर्भ को अस्पष्ट नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘पितृकुल’, ‘छावनी’ और ‘दल’ जनगणना तथा छावनी-विन्यास की औपचारिकता को बनाए रखते हैं; संख्या भारतीय प्रचलन के अनुसार व्यक्त की गई है।
