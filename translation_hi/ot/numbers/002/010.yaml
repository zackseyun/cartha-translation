  text: रूबेन के पड़ाव का झंडा दक्षिण की ओर, उनके दलों[a] के अनुसार होगा; और रूबेन के वंशजों का प्रधान शदेऊर का पुत्र एलीसूर होगा।
  philosophy: optimal-equivalence
  footnotes:
