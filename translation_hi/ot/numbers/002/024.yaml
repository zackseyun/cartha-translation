  rationale: לְ यहाँ इस छावनी-समूह से संबंध बताता है; ‘छावनी-दल’ संगठित पड़ाव और दल, दोनों भावों को स्पष्ट करता है।
- source_word: מְאַת אֶלֶף וּשְׁמֹנַת אֲלָפִים וּמֵאָה
  choice: 1,08,100
  rationale: इब्रानी संख्या का ठीक मान भारतीय अंक-विभाजन के परिचित आधुनिक रूप में दिया गया है।
- source_word: לְצִבְאֹתָם
  choice: उनकी टुकड़ियों के अनुसार
  rationale: צָבָא यहाँ संगठित सैन्य दलों या कंपनियों को सूचित करता है; ‘टुकड़ियाँ’ आधुनिक पाठक के लिए स्वाभाविक और संदर्भानुकूल है।
- source_word: וּשְׁלִשִׁים יִסָּעוּ
  choice: वे तीसरे क्रम में कूच करें
  rationale: क्रमवाचक अर्थ और छावनी से प्रस्थान के सैन्य-संगठित संदर्भ, दोनों को स्पष्ट तथा संक्षिप्त रूप से व्यक्त करता है।
