id: NUM.2.33
reference: Numbers 2:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ֨/לְוִיִּ֔ם לֹ֣א הָתְפָּקְד֔וּ בְּ/ת֖וֹךְ בְּנֵ֣י יִשְׂרָאֵ֑ל כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/033.yaml
  text: But the Levites were not counted among the sons of Israel[a], as Yahweh had commanded Moses.
translation:
  language: hi
  text: पर लेवियों की गिनती इस्राएल के पुत्रों[a] के बीच नहीं की गई, जैसा यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों”; परम्परागत रूप से “इस्राएल की सन्तानों।” हिब्रू में शाब्दिक रूप से “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/לְוִיִּם
  choice: पर लेवियों
  rationale: וְ यहाँ पिछली जनगणना के कुल योग से विरोध दर्शाता है; इसलिए आधुनिक हिन्दी में ‘पर’ स्वाभाविक है। ‘लेवी’ से बहुवचन ‘लेवियों’ मानक रूप है।
- source_word: הָתְפָּקְדוּ
  choice: गिनती ... नहीं की गई
  rationale: פקד का हितपएल रूप इस जनगणना-संदर्भ में दर्ज किए जाने या गिने जाने को बताता है; हिन्दी का कर्मवाच्य मूल रूप और सन्दर्भ दोनों को स्पष्ट रखता है।
- source_word: בְּ/תוֹךְ בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों के बीच
  rationale: ‘के बीच’ समूह में सम्मिलित होकर गिने जाने का भाव देता है, और ‘इस्राएल के पुत्र’ हिब्रू בני ישראל की औपचारिक बनावट को सुरक्षित रखता है।
- source_word: כַּ/אֲשֶׁר צִוָּה
  choice: जैसा ... आज्ञा दी थी
  rationale: כַּאֲשֶׁר तुलना/अनुरूपता व्यक्त करता है। पूर्ण क्रिया पूर्व में दी गई आज्ञा की ओर संकेत करती है, जिसे ‘दी थी’ स्वाभाविक रूप से दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में यह चतुरक्षरीय दिव्य नाम का स्थापित लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: प्रत्यक्ष कर्मचिह्न के साथ व्यक्तिवाचक नाम को हिन्दी में क्रिया ‘आज्ञा देना’ के अनुरूप ‘मूसा को’ कहा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में निजी दिव्य नाम है; हिन्दी पाठकों के लिए प्रचलित ‘यहोवा’ उसे उपाधि ‘प्रभु’ से बदले बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘गिनती ... की गई’ जनगणना के प्रसंग को स्पष्ट करता है, जबकि मुख्य पाठ में हिब्रू की लैंगिक रूप से विशिष्ट अभिव्यक्ति ‘इस्राएल के पुत्रों’ सुरक्षित है; अधिक मुहावरेदार विकल्प पाद-टिप्पणी में दिए गए हैं।
