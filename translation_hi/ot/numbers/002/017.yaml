  text: וְ/נָסַ֧ע אֹֽהֶל מוֹעֵ֛ד מַחֲנֵ֥ה הַ/לְוִיִּ֖ם בְּ/ת֣וֹךְ הַֽ/מַּחֲנֹ֑ת כַּ/אֲשֶׁ֤ר יַחֲנוּ֙ כֵּ֣ן יִסָּ֔עוּ אִ֥ישׁ עַל יָד֖/וֹ לְ/דִגְלֵי/הֶֽם־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/017.yaml
  text: Then the tent of meeting shall set out[a], with the camp of the Levites in the midst of the camps. Just as they camp, so they shall set out[b], each in his place by their banners.
translation:
  language: hi
  text: तब मिलापवाला तम्बू, लेवियों के पड़ाव के साथ, दूसरे पड़ावों के बीच में कूच करेगा। जिस क्रम में वे पड़ाव डालते हैं, उसी क्रम में वे कूच करेंगे—हर एक अपने निर्धारित स्थान पर, अपने-अपने झंडों के अनुसार।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָסַע
  choice: तब ... कूच करेगा
  rationale: शिविर की यात्रा के प्रसंग में נָסַע का अर्थ पड़ाव उठाकर आगे बढ़ना है। ‘कूच करना’ संगठित यात्रा और क्रमबद्ध प्रस्थान दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; וְ को प्रसंगानुसार ‘तब’ कहा गया है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह पदनाम तम्बू की ठोस वस्तु और परमेश्वर से भेंट/मिलाप के कार्य, दोनों को बनाए रखता है तथा पेंटाट्यूक में प्रचलित हिन्दी बाइबलीय भाषा से मेल खाता है।
- source_word: מַחֲנֵה הַלְוִיִּם
  choice: लेवियों का पड़ाव
  rationale: इब्रानी संबंध-रचना का सीधा और सहज अनुवाद है; ‘लेवी’ वंश के लोगों के लिए ‘लेवियों’ रखा गया है।
- source_word: בְּתוֹךְ הַמַּחֲנֹת
  choice: दूसरे पड़ावों के बीच
  rationale: בְּתוֹךְ केंद्रीय/मध्य स्थिति बताता है। प्रसंग में लेवियों का पड़ाव अन्य गोत्रीय पड़ावों के मध्य चलता है; ‘दूसरे’ हिन्दी में संबंध स्पष्ट करता है, बिना किसी नए समूह को जोड़े।
- source_word: כַּאֲשֶׁר יַחֲנוּ כֵּן יִסָּעוּ
  choice: जिस क्रम में वे पड़ाव डालते हैं, उसी क्रम में वे कूच करेंगे
  rationale: मूल समानांतरता पड़ाव की व्यवस्था और कूच की व्यवस्था के अनुरूप होने की बात कहती है। ‘क्रम’ प्रसंग में निहित संगठन को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में प्रत्येक व्यक्ति या दल को सूचित करता है। ‘हर एक’ इस बल को सहज हिन्दी में रखता है।
- source_word: עַל יָדוֹ
  choice: अपने निर्धारित स्थान पर
  rationale: शाब्दिक रूप से ‘उसके हाथ/बगल पर’ वाला यह मुहावरा यहाँ कूच के क्रम में नियत स्थिति को दर्शाता है। ‘निर्धारित स्थान’ संगठनात्मक अर्थ को स्पष्ट करता है।
- source_word: לְדִגְלֵיהֶם
  choice: अपने-अपने झंडों के अनुसार
  rationale: דֶּגֶל गोत्रीय दल की पहचान और व्यवस्था बताने वाले झंडे/ध्वज को दर्शाता है। ‘के अनुसार’ कूच की व्यवस्था से उसका संबंध स्पष्ट करता है।
