- source_word: וּפְקֻדֵיהֶם
  choice: उनमें से गिने गए लोगों की संख्या
  rationale: פקד से बना यह रूप इस प्रसंग में जनगणना में गिने गए व्यक्तियों और उनके कुल अंक को सूचित करता है। हिन्दी वाक्य में संख्या आगे आने के कारण यह रूप स्पष्ट और स्वाभाविक है तथा बहुवचन प्रत्यय ‘उनमें से’ में सुरक्षित है।
- source_word: שְׁנַיִם וְשִׁשִּׁים אֶלֶף וּשְׁבַע מֵאוֹת
  choice: बासठ हज़ार सात सौ
  rationale: इब्रानी की संख्या को बिना परिवर्तन के आधुनिक हिन्दी के प्रचलित क्रम में प्रस्तुत किया गया है।
