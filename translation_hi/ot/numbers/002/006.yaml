translation:
  language: hi
  text: 'और उसका सैन्य-दल[a], और उसमें गिने गए लोग: चौवन हज़ार चार सौ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “और उसकी सेना, और उसमें गिने गए लोग: चौवन हज़ार चार सौ।”'
    reason: צָבָא का अर्थ ‘सेना’ भी हो सकता है; मुख्य पाठ में ‘सैन्य-दल’ छावनी के भीतर व्यवस्थित गोत्रीय इकाई को अधिक स्पष्ट करता है।
lexical_decisions:
- source_word: וּצְבָאוֹ
  choice: और उसका सैन्य-दल
  rationale: צָבָא यहाँ छावनी की व्यवस्था में गोत्र के संगठित सैन्य दल को सूचित करता है। ‘सैन्य-दल’ आधुनिक हिन्दी में इस संगठनात्मक और सैनिक भाव को स्वाभाविक रूप से व्यक्त करता है; आरम्भिक וּ और पुंलिंग एकवचन संबंधसूचक प्रत्यय भी सुरक्षित हैं।
- source_word: וּפְקֻדָיו
  choice: और उसमें गिने गए पुरुष
  rationale: פקד का यह रूप जनगणना में दर्ज किए गए लोगों को सूचित करता है। संदर्भ युद्ध के योग्य पुरुषों की गणना का है, इसलिए ‘पुरुष’ स्पष्ट करता है कि संख्या व्यक्तियों की है; ‘उसमें’ प्रत्यय को पहले आए सैन्य-दल से जोड़ता है।
- source_word: אַרְבָּעָה וַחֲמִשִּׁים אֶלֶף וְאַרְבַּע מֵאוֹת
  choice: चौवन हज़ार चार सौ
  rationale: हिब्रू संख्या का ठीक परिमाण मानक आधुनिक हिन्दी संख्या-क्रम में प्रस्तुत किया गया है।
