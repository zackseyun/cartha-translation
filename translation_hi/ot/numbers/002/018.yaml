base_translation:
  language: en
  yaml_path: translation/ot/numbers/002/018.yaml
  text: The banner of the camp of Ephraim[a], by their divisions, shall be on the west[c][b]; and the leader of the sons of Ephraim shall be Elishama son of Ammihud.
translation:
  language: hi
  text: एप्रैम की छावनी का झंडा[a], अपनी टुकड़ियों के अनुसार[b], पश्चिम की ओर होगा; और एप्रैम के वंशजों का प्रधान अम्मीहूद का पुत्र एलीशामा होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ध्वज।”
    reason: lexical_alternative
  - marker: b
    text: या “अपनी सेनाओं के अनुसार।” यहाँ इब्रानी शब्द क्रमबद्ध सैनिक अथवा संगठनात्मक दलों का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דֶּגֶל
  choice: झंडा
  rationale: यह छावनी-दल की पहचान कराने वाले जनजातीय अथवा सैनिक ध्वज को दर्शाता है। आधुनिक हिन्दी में ‘झंडा’ सहज और स्पष्ट है।
- source_word: מַחֲנֵה
  choice: छावनी-दल
  rationale: यह केवल रहने की जगह नहीं, बल्कि व्यवस्थित जनजातीय छावनी-समूह को दर्शाता है; ‘छावनी-दल’ इस संगठनात्मक अर्थ को स्पष्ट करता है।
- source_word: לְצִבְאֹתָם
  choice: उनकी टुकड़ियों के अनुसार
  rationale: צָבָא का यहाँ क्रमबद्ध सैन्य-संगठनात्मक अर्थ है। ‘टुकड़ियों के अनुसार’ सक्रिय युद्ध का भाव बढ़ाए बिना उस व्यवस्था को बनाए रखता है।
- source_word: יָמָּה
  choice: पश्चिम की ओर
  rationale: शाब्दिक रूप से दिशा ‘समुद्र की ओर’ है, जो इस्राएली भौगोलिक प्रयोग में पश्चिम को सूचित करती है।
- source_word: וְנָשִׂיא
  choice: और ... प्रधान
  rationale: נָשִׂיא यहाँ जनजातीय मुखिया या अगुआ है। ‘प्रधान’ पद की गरिमा और नेतृत्व दोनों व्यक्त करता है, बिना राजवंशीय अर्थ जोड़े।
- source_word: לִבְנֵי אֶפְרַיִם
  choice: एप्रैम के वंशजों का
  rationale: ‘पुत्रों’ का हिब्रू मुहावरा यहाँ एप्रैम से उत्पन्न जनजातीय समुदाय को दर्शाता है; ‘वंशजों’ से यह अर्थ स्वाभाविक आधुनिक हिन्दी में स्पष्ट होता है।
- source_word: אֱלִישָׁמָע בֶּן עַמִּיהוּד
  choice: एलीशामा, अम्मीहूद का पुत्र
  rationale: व्यक्तिनामों का देवनागरी लिप्यंतरण किया गया है और בֶּן का सीधा अर्थ ‘पुत्र’ रखा गया है।
