  text: וְ/אִם הֵנִ֨יא אָבִ֣י/הָ אֹתָ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛י/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם וַֽ/יהוָה֙ יִֽסְלַח לָ֔/הּ כִּי הֵנִ֥יא אָבִ֖י/הָ אֹתָֽ/הּ־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/006.yaml
  text: But if her father forbids her on the day he hears of it[a], none of her vows or her binding obligations by which she has bound herself shall stand; and Yahweh will forgive her[b], because her father forbade her.
translation:
  language: hi
  text: परन्तु यदि उसका पिता जिस दिन उसके विषय में सुने, उसी दिन उस पर रोक लगा दे, तो उसकी कोई भी मन्नत या अपने ऊपर लिया हुआ कोई भी बन्धन प्रभावी नहीं रहेगा[a]; और यहोवा उसे क्षमा करेगा, क्योंकि उसके पिता ने उस पर रोक लगा दी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “खड़ा न रहेगा”; अर्थात वह बाध्यकारी या प्रभावी नहीं रहेगा। ‘बन्धन’ का अर्थ यहाँ अपने ऊपर ली गई बाध्यकारी प्रतिज्ञा या दायित्व है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले प्रसंग से भिन्न कानूनी स्थिति प्रस्तुत करने वाली शर्त है; ‘परन्तु यदि’ इस सम्बन्ध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הֵנִיא
  choice: रोक दे
  rationale: हिब्रू क्रिया का सीधा कर्म स्त्री है और प्रसंग में इसका अर्थ उसकी मन्नत को प्रभावी होने से रोकना है। ‘उसे रोक दे’ मूल वाक्य-विन्यास को बनाए रखते हुए कानूनी आशय व्यक्त करता है।
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: सुनने के दिन ही
  rationale: मूल पाठ की समय-सीमा—पिता के सुनने का वही दिन—कानूनी शर्त के लिए महत्त्वपूर्ण है; ‘ही’ इसे स्पष्ट करता है।
- source_word: כָּל נְדָרֶיהָ
  choice: उसकी कोई भी मन्नत
  rationale: हिब्रू में ‘उसकी सब मन्नतें’ है, पर नकार के साथ स्वाभाविक हिन्दी में ‘कोई भी मन्नत ... बना न रहेगा’ अर्थ को ठीक व्यक्त करता है।
- source_word: וֶאֱסָרֶיהָ אֲשֶׁר אָסְרָה עַל־נַפְשָׁהּ
  choice: वह बन्धन, जो उसने अपने ऊपर बाँधा है
  rationale: संज्ञा और उसी मूल की क्रिया के शब्द-साम्य को ‘बन्धन/बाँधा’ द्वारा सुरक्षित रखा गया है; यह स्वयं पर ली गई बाध्यकारी प्रतिज्ञा को दर्शाता है।
- source_word: לֹא יָקוּם
  choice: बना न रहेगा
  rationale: शाब्दिक अर्थ ‘खड़ा न रहेगा’ है; कानूनी प्रसंग में आशय है कि मन्नत वैध और बाध्यकारी नहीं रहेगी।
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: יִסְלַח לָהּ
  choice: उसे क्षमा करेगा
  rationale: यह סלח का सीधा और प्रचलित हिन्दी समतुल्य है; पाठ जिस क्षमा की बात करता है उसे बिना अतिरिक्त doctrinal व्याख्या के बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिता द्वारा रोक दिए जाने को क्षमा के कथन का कारण बताता है।
theological_decisions:
- issue: निरस्त मन्नत के प्रसंग में परमेश्वर की क्षमा का अर्थ
  choice: पाठ के अनुसार यहोवा स्त्री को क्षमा करता है क्योंकि उसके पिता ने समय रहते उसे रोक दिया।
  alternative: इसे अधूरी मन्नत से उत्पन्न हर सम्भावित पाप के लिए व्यापक क्षमा के कथन के रूप में समझा जा सकता है।
  rationale: निकटवर्ती प्रसंग मन्नत की बाध्यकारी वैधता से सम्बन्धित है। अनुवाद ‘क्षमा करेगा’ को ज्यों का त्यों रखता है, पर अपराध की प्रकृति या क्षमा की सीमा को पाठ से आगे जाकर निर्धारित नहीं करता।
- issue: पिता के कार्य का लक्ष्य
  choice: मूल वाक्य-विन्यास के अनुसार ‘उसे रोक दे’ रखा गया है, जबकि प्रसंग से उसकी मन्नतों का प्रभाव रुकना स्पष्ट है।
  alternative: ‘उसकी मन्नत को रद्द कर दे’ कहकर कानूनी परिणाम को प्रत्यक्ष बनाया जा सकता है।
  rationale: हिब्रू में क्रिया का सीधा कर्म स्त्री है, मन्नत नहीं। चुना हुआ रूप इस सूक्ष्मता को सुरक्षित रखता है और अगले खण्ड में कानूनी परिणाम स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुरूप रखी गई है। ‘मन्नत’, ‘बन्धन’ और ‘क्षमा’ सामान्य हिन्दी पाठकों के लिए परिचित धार्मिक-कानूनी शब्द हैं। मूल में ‘बन्धन’ और ‘बाँधा’ के शब्द-साम्य को जानबूझकर सुरक्षित रखा गया है।
