source:
  edition: WLC
  text: אֵ֣לֶּה הַֽ/חֻקִּ֗ים אֲשֶׁ֨ר צִוָּ֤ה יְהוָה֙ אֶת מֹשֶׁ֔ה בֵּ֥ין אִ֖ישׁ לְ/אִשְׁתּ֑/וֹ בֵּֽין אָ֣ב לְ/בִתּ֔/וֹ בִּ/נְעֻרֶ֖י/הָ בֵּ֥ית אָבִֽי/הָ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/017.yaml
  text: These are the statutes that Yahweh commanded Moses concerning a man and his wife[b][a], and concerning a father and his daughter in her youth in her father's house.
translation:
  language: hi
  text: ये वे विधियाँ हैं जिनकी आज्ञा याहवे ने मूसा को पुरुष और उसकी पत्नी के बीच[a], तथा पिता और उसकी बेटी के बीच दी थी, जब बेटी अपनी युवावस्था में अपने पिता के घर में रहती हो[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज रूप में: “पुरुष और उसकी पत्नी के विषय में।”'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप में: “उसकी युवावस्था में, उसके पिता के घर में।” यह अभिव्यक्ति उस समय की ओर संकेत करती है जब बेटी अभी अपने पिता के घर में रहती थी।'
    reason: cultural_note
lexical_decisions:
- source_word: אֵלֶּה הַחֻקִּים
  choice: ये वे विधियाँ हैं
  rationale: यह पद पहले दिए गए नियमों का सार प्रस्तुत करता है। ‘विधियाँ’ חֻקִּים के निर्धारित कानूनी नियमों के भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: जिन्हें यहोवा ने मूसा को ... आज्ञा दी थी
  rationale: צוה का आज्ञा देने का अर्थ और मूसा को प्रत्यक्ष कर्म के रूप में रखा गया है; हिन्दी वाक्य-विन्यास में संबंधवाचक उपवाक्य स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בֵּין אִישׁ לְאִשְׁתּוֹ
  choice: पुरुष और उसकी पत्नी के बीच
  rationale: בין के मूल ‘बीच’ संबंध को बनाए रखता है और אִישׁ तथा אִשְׁתּוֹ के लिंग-विशिष्ट पारिवारिक संबंध को स्पष्ट करता है।
- source_word: בֵּין אָב לְבִתּוֹ
  choice: पिता और उसकी बेटी के बीच
  rationale: पहले בין-वाक्यांश के समानांतर संरचना और कानूनी संबंध दोनों सुरक्षित रखे गए हैं।
- source_word: בִּנְעֻרֶיהָ בֵּית אָבִיהָ
  choice: जब वह युवावस्था में अपने पिता के घर में रहती है
  rationale: शाब्दिक तत्व ‘उसकी युवावस्था में’ और ‘उसके पिता के घर’ सुरक्षित हैं; ‘रहती है’ प्रसंग में निवास-संबंध को सहज हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों में स्थापित बाइबलीय रूप ‘यहोवा’ नाम को नाम ही रहने देता है, ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: בין संबंध-सूचक पदबंधों का अर्थ
  choice: पुरुष और उसकी पत्नी के बीच ... पिता और उसकी बेटी के बीच
  alternative: पुरुष और उसकी पत्नी के विषय में ... पिता और उसकी बेटी के विषय में
  rationale: ‘बीच’ मूल की औपचारिक समानांतरता और संबंधपरक कानूनी दायरे को बनाए रखता है; वाक्य के अंत में ‘के विषय में’ जोड़कर हिन्दी अर्थ स्पष्ट किया गया है।
- issue: बेटी की युवावस्था और पिता के घर का संबंध
  choice: जब वह युवावस्था में अपने पिता के घर में रहती है
  alternative: उसकी युवावस्था में, उसके पिता के घर में
  rationale: इसे केवल आयु या केवल कानूनी अधिकार का तकनीकी सूत्र मानकर तनाव को समाप्त नहीं किया गया; पाठ में युवावस्था और पिता के घर में निवास दोनों तत्व रखे गए हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। कानूनी सार-वाक्य का स्वर बनाए रखा गया है। ‘पुरुष’ को ‘पति’ में बदलकर मूल אִישׁ की संभावित व्यापकता सीमित नहीं की गई, जबकि ‘उसकी पत्नी’ वैवाहिक संबंध स्पष्ट करती है। सभी पाद-टिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
