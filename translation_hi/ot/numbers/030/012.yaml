source:
  edition: WLC
  text: וְ/שָׁמַ֤ע אִישָׁ/הּ֙ וְ/הֶחֱרִ֣שׁ לָ֔/הּ לֹ֥א הֵנִ֖יא אֹתָ֑/הּ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/012.yaml
  text: And if her husband hears and says nothing to her[a], and does not nullify her vow, then all her vows shall stand, and every binding obligation that she has bound on herself shall stand.
translation:
  language: hi
  text: और यदि उसका पति यह सुनकर उससे कुछ न कहे[a] और उसकी मन्नत को रद्द न करे, तो उसकी सभी मन्नतें मान्य रहेंगी, और हर बंधन, जिससे उसने अपने आपको बाँधा है, मान्य रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसके प्रति चुप रहे।” अर्थात, वह उससे कुछ न कहे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע אִישָׁהּ
  choice: और यदि उसका पति यह सुनकर
  rationale: कानूनी शर्तसूचक प्रसंग में וְשָׁמַע को ‘यदि ... सुने’ के अर्थ में लिया गया है; אִישָׁהּ यहाँ विवाहित स्त्री के ‘पति’ को दर्शाता है। ‘यह’ पूर्ववर्ती मन्नत या बंधन की ओर स्वाभाविक संकेत करता है।
- source_word: וְהֶחֱרִשׁ לָהּ
  choice: उससे कुछ न कहे
  rationale: यह मुहावरा सुनने के बाद मौन रहने को व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और उस मौन के कानूनी प्रभाव को बनाए रखता है।
- source_word: לֹא הֵנִיא אֹתָהּ
  choice: उसकी मन्नत को रद्द न करे
  rationale: हिफ़ील क्रिया यहाँ स्त्री की प्रतिज्ञा या बाध्यता को निष्प्रभावी करने के अर्थ में है। हिब्रू में प्रत्यक्ष कर्म स्त्रीवाचक सर्वनाम है, पर प्रसंगानुसार आशय मन्नत को रद्द करना है; हिन्दी में इसे स्पष्ट किया गया है।
- source_word: כָּל נְדָרֶיהָ
  choice: उसकी सभी मन्नतें
  rationale: נֶדֶר के लिए ‘मन्नत’ प्रचलित और प्रसंगानुकूल धार्मिक-कानूनी शब्द है।
- source_word: וְכָל אִסָּר אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: और हर बंधन, जिससे उसने अपने आपको बाँधा है
  rationale: אִסָּר और אָסְרָה की एक ही धातु से बनी शब्द-क्रीड़ा को ‘बंधन/बाँधा’ द्वारा सुरक्षित रखा गया है। यह स्वयं पर ली गई बाध्यता या रोक को व्यक्त करता है।
- source_word: וְקָמוּ ... יָקוּם
  choice: मान्य रहेंगी ... मान्य रहेगा
  rationale: कानूनी प्रसंग में קום का अर्थ प्रभावी या वैध बने रहना है। ‘मान्य रहना’ आधुनिक हिन्दी में स्पष्ट है और दोनों खंडों की समानांतर पुनरावृत्ति बनाए रखता है।
