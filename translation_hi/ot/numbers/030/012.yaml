  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कानूनी-धार्मिक स्वर रखा गया है। ‘मन्नत’, ‘बंधन’ और ‘मान्य रहना’ सामान्य पाठक के लिए बोधगम्य हैं; हिब्रू की शर्त, कानूनी प्रभाव और ‘बाँधने’ की रूपकात्मक भाषा सुरक्षित रखी गई है।
