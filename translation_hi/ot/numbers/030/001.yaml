base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/001.yaml
  text: Moses spoke to the sons of Israel according to all that Yahweh had commanded Moses[a].
translation:
  language: hi
  text: मूसा ने इस्राएलियों[a] से ठीक वही सब कहा, जिसकी आज्ञा याहवे ने मूसा को दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘इस्राएल के पुत्रों’; यह पूरे इस्राएली समुदाय के लिए प्रयुक्त एक प्रचलित वाचागत पदनाम है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने…कहा
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहा’ है। यहाँ प्रत्यक्ष उद्धरण नहीं, बल्कि मूसा द्वारा इस्राएलियों तक आदेश पहुँचाने का सार दिया गया है; इसलिए हिंदी में ‘से…कहा’ स्वाभाविक और सटीक है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यह एक स्थापित सामुदायिक/वाचागत पदनाम के रूप में पूरे इस्राएली समुदाय को सूचित करता है। आधुनिक हिंदी में ‘इस्राएलियों’ उसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: כְּכֹל אֲשֶׁר
  choice: ठीक वही सब
  rationale: उपसर्ग כְּ अनुरूपता या पूर्ण समानता का भाव देता है। ‘ठीक वही सब’ यह स्पष्ट करता है कि मूसा ने याहवे की आज्ञा के अनुसार ही संदेश पहुँचाया।
- source_word: צִוָּה
  choice: आज्ञा…दी थी
  rationale: हिंदी में ‘आज्ञा देना’ स्वाभाविक है, और ‘दी थी’ यह क्रम स्पष्ट करता है कि याहवे की आज्ञा मूसा के बोलने से पहले दी जा चुकी थी।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसे किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित निकट लिप्यंतरण ‘याहवे’ रखा गया है।
- source_word: אֶת מֹשֶׁה
  choice: मूसा को
  rationale: אֶת मूसा को צִוָּה का कर्म चिह्नित करता है। हिंदी में ‘मूसा को आज्ञा दी’ स्वाभाविक वाक्य-विन्यास है और मूल में नाम की पुनरावृत्ति को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका निकट लिप्यंतरण है और वाचा-नाम को स्पष्ट रूप से सुरक्षित रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों; इस्राएल की सन्तान
  rationale: यहाँ पदबंध राष्ट्र/वाचा-समुदाय का स्थापित नाम है, न कि केवल जैविक रूप से पुरुष सदस्यों का सीमित उल्लेख। सहज हिंदी मुख्य पाठ में सामुदायिक आशय व्यक्त करती है, जबकि मूल का शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ठीक वही सब’ मूल की अनुरूपता पर बल देता है, जबकि ‘मूसा’ की पुनरावृत्ति स्रोत-पाठ के विन्यास को बनाए रखती है।
