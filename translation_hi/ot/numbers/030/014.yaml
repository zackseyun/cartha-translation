  yaml_path: translation/ot/numbers/030/014.yaml
  text: Every vow and every binding oath to afflict the soul—her husband may confirm it[a], or her husband may annul it.
translation:
  language: hi
  text: हर मन्नत और अपने को कष्ट देने के लिए ली गई हर बंधनकारी शपथ को उसका पति मान्य ठहरा सकता है[a], या उसका पति उसे रद्द कर सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने को वंचित रखने” अथवा “अपने को नम्र करने।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “प्राण को पीड़ित करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵדֶר
  choice: मन्नत
  rationale: गिनती 30 के धार्मिक-विधिक सन्दर्भ में यह परमेश्वर के सामने ली गई प्रतिज्ञा को दर्शाता है; आधुनिक हिन्दी में ‘मन्नत’ स्वाभाविक और व्यापक रूप से समझी जाती है।
- source_word: שְׁבֻעַת אִסָּר
  choice: बन्धनकारी शपथ
  rationale: यह पदबंध शपथ और उससे उत्पन्न रोक अथवा बाध्यता, दोनों को व्यक्त करता है।
- source_word: לְעַנֹּת נָפֶשׁ
  choice: अपने प्राण को दुःख देने की
  rationale: इब्रानी मुहावरे के रूप और उसकी अर्थगत खुली प्रकृति को बनाए रखता है; इसका आशय अपने को वंचित रखने या दीन करने से भी हो सकता है।
- source_word: נָפֶשׁ
  choice: प्राण
  rationale: यहाँ נֶפֶשׁ मुहावरे का अंग है; ‘प्राण’ इब्रानी अभिव्यक्ति की मानव-विषयक बनावट को बनाए रखता है, जबकि पादटिप्पणी व्यावहारिक अर्थ स्पष्ट करती है।
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: विवाह-संबंधी इस विधिक प्रसंग में यही स्पष्ट और स्वाभाविक अर्थ है।
- source_word: יְקִימֶנּוּ
  choice: मान्य रख सकता है
  rationale: हिफ़ील रूप का अर्थ मन्नत या शपथ को स्थिर और प्रभावी रहने देना है; यह हिन्दी विधिक प्रयोग में सहज है।
- source_word: יְפֵרֶנּוּ
  choice: रद्द कर सकता है
  rationale: हिफ़ील रूप यहाँ मन्नत या शपथ को अमान्य करने का विधिक अर्थ देता है।
- source_word: כָּל ... וְכָל
  choice: हर ... और ... हर
  rationale: दोनों श्रेणियों पर लागू व्यापक और वितरणात्मक बल को बनाए रखता है।
