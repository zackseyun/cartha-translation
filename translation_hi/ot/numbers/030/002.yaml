id: NUM.30.2
reference: Numbers 30:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְדַבֵּ֤ר מֹשֶׁה֙ אֶל רָאשֵׁ֣י הַ/מַּטּ֔וֹת לִ/בְנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁ֖ר צִוָּ֥ה יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/002.yaml
  text: Then Moses spoke to the heads of the tribes of the sons of Israel[a], saying[b], “This is the word that Yahweh has commanded:”
translation:
  language: hi
  text: तब मूसा ने इस्राएल के पुत्रों[a] के गोत्रों के मुखियाओं से कहा, “यह वह वचन है जिसकी आज्ञा याहवे ने दी है:[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक मुहावरेदार रूप में, “इस्राएलियों।” इब्रानी में “इस्राएल के पुत्रों” है।
    reason: lexical_alternative
  - marker: b
    text: या, “याहवे ने यही आज्ञा दी है।” इब्रानी में शाब्दिक रूप से, “यह वह वचन है जिसकी आज्ञा याहवे ने दी है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब मूसा ने … कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक भाव को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है। प्रत्यक्ष कथन के परिचय में ‘कहा’ सहज है।
- source_word: רָאשֵׁי הַמַּטּוֹת
  choice: गोत्रों के मुखियाओं
  rationale: רָאשֵׁי का मूल अर्थ ‘मुखिया/प्रधान’ और מַטּוֹת का इस प्रसंग में अर्थ इस्राएल के गोत्र हैं। यह अनुवाद सामाजिक संरचना और मूल रूपक दोनों को बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी के पारिवारिक और वाचागत पदबंध ‘इस्राएल के पुत्र’ को औपचारिक रूप से सुरक्षित रखता है; अधिक मुहावरेदार विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियारूप प्रत्यक्ष वचन का परिचय देता है। हिन्दी में मुख्य क्रिया के साथ ‘कहा’ ही स्वाभाविक है; अलग से ‘यह कहते हुए’ अनावश्यक रूप से बोझिल होता।
- source_word: זֶה הַדָּבָר
  choice: यह वह वचन है
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ यह परमेश्वर की आधिकारिक आज्ञा का परिचय देता है, इसलिए ‘वचन’ मूल की औपचारिक शक्ति बनाए रखता है।
- source_word: צִוָּה
  choice: आज्ञा … दी है
  rationale: पूर्ण क्रिया पहले दी जा चुकी उस आज्ञा को बताती है जिसे मूसा अब सुना रहा है। हिन्दी का पूर्ण वर्तमान ‘दी है’ उसकी वर्तमान प्रासंगिकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चार अक्षरों वाला परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसका लिप्यंतरण करता है, न कि उसके स्थान पर ‘प्रभु’ जैसी उपाधि रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है और उपाधि से प्रतिस्थापित नहीं करता।
- issue: בְנֵי יִשְׂרָאֵל का पारिवारिक वाचागत रूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएलियों
  rationale: मूल का व्याकरणिक रूप पुल्लिंग और पारिवारिक है। मुख्य पाठ इसे बनाए रखता है, जबकि अधिक सहज सामूहिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गोत्रों के मुखिया’ और ‘वचन’ जैसे पद मूल की औपचारिकता बनाए रखते हैं; वाक्य-विन्यास को स्वाभाविक हिन्दी के अनुसार ढाला गया है। अंतिम द्विबिंदु अगले पद में आने वाली आज्ञा का संकेत करता है।
