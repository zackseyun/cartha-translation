source:
  edition: WLC
  text: וְ/שָׁמַ֨ע אָבִ֜י/הָ אֶת נִדְרָ֗/הּ וֶֽ/אֱסָרָ/הּ֙ אֲשֶׁ֣ר אָֽסְרָ֣ה עַל נַפְשָׁ֔/הּ וְ/הֶחֱרִ֥ישׁ לָ֖/הּ אָבִ֑י/הָ וְ/קָ֨מוּ֙ כָּל נְדָרֶ֔י/הָ וְ/כָל אִסָּ֛ר אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֽוּם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/005.yaml
  text: And if her father hears her vow[a], or her binding obligation by which she has bound herself, and her father says nothing to her, then all her vows shall stand[b], and every binding obligation by which she has bound herself shall stand.
translation:
  language: hi
  text: और यदि उसका पिता उसकी मन्नत और उस बंधन को सुन ले, जिससे उसने अपने आपको बाँधा है, और उसका पिता उससे कुछ न कहे[a], तो उसकी सभी मन्नतें मान्य रहेंगी[b], और हर बंधन, जिससे उसने अपने आपको बाँधा है, मान्य रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “उसका पिता उसके प्रति चुप रहे।” इस संदर्भ में उसकी चुप्पी आपत्ति न करने को दर्शाती है।'
    reason: मूल इब्रानी अभिव्यक्ति और उसकी विधिक भूमिका स्पष्ट करना।
  - marker: b
    text: 'शाब्दिक अर्थ: “स्थिर रहेंगी।” यहाँ आशय है कि वे प्रभावी और बाध्यकारी बनी रहेंगी।'
    reason: קום की मूल छवि और इस विधिक संदर्भ में उसके अर्थ को बताना।
lexical_decisions:
- source_word: נִדְרָהּ / נְדָרֶיהָ
  choice: उसकी मन्नत / उसकी सभी मन्नतें
  rationale: नדר धार्मिक और विधिक संदर्भ में परमेश्वर के सामने की गई प्रतिज्ञा को दर्शाता है। हिंदी बाइबल-परंपरा और सामान्य धार्मिक प्रयोग में ‘मन्नत’ इसका स्पष्ट और स्वाभाविक समतुल्य है।
- source_word: אִסָּר / וֶאֱסָרָהּ
  choice: बंधन
  rationale: אִסָּר स्वयं पर लगाया गया प्रतिबंध या बाध्यकारी दायित्व है और ‘मन्नत’ से संबंधित होते हुए भी अलग पद है। ‘बंधन’ मूल की बाँधने वाली छवि और दोनों पदों का अंतर बनाए रखता है।
- source_word: אָסְרָה עַל־נַפְשָׁהּ
  choice: जिससे उसने अपने आपको बाँधा है
  rationale: यह चयन इब्रानी मुहावरे की आत्म-बाध्यकारी और प्रतिवर्ती प्रकृति को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: וְהֶחֱרִישׁ לָהּ אָבִיהָ
  choice: उसका पिता उसके सामने चुप रहे
  rationale: क्रिया का मूल अर्थ चुप रहना है। ‘उसके सामने’ לָהּ के संबंध को व्यक्त करता है, जबकि चुप्पी के विधिक अर्थ को पाठक के लिए पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְקָמוּ ... יָקוּם
  choice: मान्य रहेंगी / मान्य रहेगा
  rationale: इस विधिक संदर्भ में קום का आशय प्रभावी या वैध बने रहना है। ‘मान्य रहना’ आधुनिक हिंदी में विधिक बल को ‘खड़ी रहेंगी’ की अपेक्षा अधिक स्पष्टता से व्यक्त करता है।
- source_word: כָּל
  choice: सभी / हर
  rationale: बहुवचन ‘मन्नतें’ के साथ ‘सभी’ और एकवचन ‘बंधन’ के साथ ‘हर’ हिंदी में स्वाभाविक ढंग से इसके व्यापक और वितरणात्मक बल को व्यक्त करते हैं।
theological_decisions:
- issue: पिता की चुप्पी का विधिक प्रभाव
  choice: मुख्य पाठ में ‘चुप रहे’ और परिणाम में ‘मान्य रहेंगी/रहेगा’
  alternative: चुप्पी को मुख्य पाठ में ही ‘आपत्ति न करे’ कहना
  rationale: मूल पाठ स्पष्ट रूप से चुप रहने की बात करता है और फिर दायित्वों के स्थिर रहने का परिणाम बताता है। अनकही आपत्ति को मुख्य पाठ में जोड़ने के बजाय पादटिप्पणी में विधिक निहितार्थ समझाया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक संदर्भ के अनुरूप रखी गई है। ‘मन्नत’ और ‘बंधन’ अलग-अलग रखकर נדר और אִסָּר का शब्दगत भेद सुरक्षित किया गया है; स्त्रीलिंग और पुल्लिंग क्रिया-सामंजस्य हिंदी में स्पष्ट है।
