source:
  edition: WLC
  text: וְ/אִם הָפֵ֥ר יָפֵ֛ר אֹתָ֖/ם אַחֲרֵ֣י שָׁמְע֑/וֹ וְ/נָשָׂ֖א אֶת עֲוֺנָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/016.yaml
  text: But if he does indeed nullify them after he has heard of them[b][a], then he shall bear her guilt.
translation:
  language: hi
  text: परन्तु यदि वह उनके विषय में सुनने के बाद उन्हें सचमुच रद्द कर देता है[a], तो वह उसके दोष का भार उठाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्हें अवश्य रद्द कर देता है” अथवा “उन्हें पूरी तरह रद्द कर देता है।” इब्रानी में बल देने के लिए क्रिया के अनन्त निरपेक्ष रूप के साथ उसी क्रिया का सीमित रूप आया है।
    reason: lexical_alternative
  - marker: b
    text: “उसके दोष का भार उठाएगा” का अर्थ “उसके अपराध का दायित्व उठाएगा” या “उसके दोष के कारण मिलने वाला दण्ड भोगेगा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले कथन के विपरीत स्थिति प्रस्तुत करने वाली शर्त है; इसलिए केवल ‘और यदि’ की अपेक्षा ‘परन्तु यदि’ प्रसंग के विरोधात्मक बल को अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָפֵר יָפֵר
  choice: सचमुच रद्द कर देता है
  rationale: धातु के अनन्त निरपेक्ष रूप के साथ उसी धातु का सीमित क्रियारूप क्रिया पर बल देता है। ‘सचमुच’ उस बल को स्वाभाविक हिन्दी में रखता है, और ‘रद्द करना’ मन्नत को अमान्य करने के इस विधिक प्रसंग के अनुकूल है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: बहुवचन सर्वनाम पिछले प्रसंग में स्त्री की मन्नतों और बन्धनों की ओर संकेत करता है; उसका बहुवचन रूप बनाए रखा गया है।
- source_word: אַחֲרֵי שָׁמְעוֹ
  choice: उनके विषय में सुनने के बाद
  rationale: यह पदबंध उसके सुन लेने के बाद की क्रिया बताता है। इब्रानी में कर्म प्रत्यक्ष रूप से व्यक्त नहीं है, पर प्रसंग में मन्नतें अभिप्रेत हैं; ‘उनके विषय में सुनने’ से पूर्व जानकारी का भाव स्पष्ट और स्वाभाविक रहता है।
- source_word: וְנָשָׂא
  choice: तो वह … का भार उठाएगा
  rationale: शर्त के परिणाम को हिन्दी में ‘तो’ से स्पष्ट किया गया है। נשׂא עון एक विधिक-नैतिक मुहावरा है, जिसका शाब्दिक चित्र ‘दोष का भार उठाना’ है।
- source_word: עֲוֺנָהּ
  choice: उसके दोष
  rationale: स्त्रीलिंग प्रत्यय को ‘उसके’ से रखा गया है। ‘दोष का भार उठाना’ अपराध, दायित्व अथवा उसके परिणाम—इन संभावित अर्थों को बिना अनावश्यक रूप से किसी एक तक सीमित किए सुरक्षित रखता है।
theological_decisions:
- issue: विधिक प्रसंग में किसी का עָוֹן उठाने का अर्थ
  choice: पति उसके दोष का भार उठाता है।
  alternative: पति उसके अपराध का दायित्व उठाता है, अथवा उसके दोष के कारण मिलने वाला दण्ड भोगता है।
  rationale: נשׂא עון दोष, दोष-दायित्व या दोष के परिणाम को उठाने का अर्थ दे सकता है। मुख्य पाठ में इब्रानी मुहावरे का चित्र बनाए रखने से यह वास्तविक अर्थगत तनाव सुरक्षित रहता है और दण्ड की प्रक्रिया को आवश्यकता से अधिक निश्चित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और गरिमापूर्ण, पर सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘मन्नत’ को पद में जोड़कर सर्वनाम का अर्थ नहीं खोला गया, ताकि मूल के ‘उन्हें’ की संदर्भगत प्रकृति बनी रहे। सर्वनाम ‘उसके’ संदर्भानुसार पत्नी/स्त्री की ओर संकेत करता है।
