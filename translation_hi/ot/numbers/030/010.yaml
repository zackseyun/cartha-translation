  text: וְ/נֵ֥דֶר אַלְמָנָ֖ה וּ/גְרוּשָׁ֑ה כֹּ֛ל אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָק֥וּם עָלֶֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/010.yaml
  text: And the vow of a widow or of a divorced woman—everything by which she has bound herself—shall stand against her[a].
translation:
  language: hi
  text: और विधवा या तलाकशुदा स्त्री की मन्नत—हर वह बंधन जिससे उसने अपने आपको बाँधा है—उस पर कायम रहेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसके लिए बाध्यकारी रहेगा।”
    reason: यָקוּם עָלֶיהָ के कानूनी अर्थ ‘स्थिर/वैध रहना’ का स्पष्ट वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: נֵדֶר
  choice: मन्नत
  rationale: व्यवस्था और उपासना के संदर्भ में यह परमेश्वर से की गई गंभीर प्रतिज्ञा को दर्शाता है; आधुनिक हिन्दी बाइबल-प्रयोग में ‘मन्नत’ स्वाभाविक और स्पष्ट है।
- source_word: אַלְמָנָה
  choice: विधवा
  rationale: उस स्त्री के लिए सीधा और मानक हिन्दी शब्द जिसका पति मर चुका हो।
- source_word: גְרוּשָׁה
  choice: तलाकशुदा स्त्री
  rationale: निष्क्रिय कृदंत उस स्त्री को दर्शाता है जिसे विवाह-विच्छेद देकर अलग किया गया हो; यह आधुनिक हिन्दी में स्पष्ट है।
- source_word: כֹּל אֲשֶׁר
  choice: हर वह बंधन जिससे
  rationale: यह आरंभिक ‘मन्नत’ से आगे सभी आत्मारोपित बाध्यताओं को समेटता है और अगले क्रियापद के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: אָסְרָה
  choice: बाँधा है
  rationale: मूल ‘बाँधने’ के रूपक और उससे व्यक्त कानूनी बाध्यता, दोनों को बनाए रखता है।
- source_word: עַל נַפְשָׁהּ
  choice: अपने आपको
  rationale: शाब्दिक ‘अपने प्राण/स्वयं पर’ का सहज हिन्दी प्रतिवाची है और स्वयं ग्रहण की गई बाध्यता स्पष्ट करता है।
- source_word: יָקוּם
  choice: बना रहेगा
  rationale: कानूनी संदर्भ में इसका अर्थ प्रभावी अथवा वैध बने रहना है; ‘बना रहेगा’ मूल के स्थायित्व-भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: यह उस स्त्री पर टिके दायित्व को व्यक्त करता है, बिना ‘विरुद्ध’ जैसे अनावश्यक प्रतिकूल अर्थ को प्रमुख बनाए।
theological_decisions:
- issue: यָקוּם עָלֶיהָ में दायित्व की कानूनी शक्ति
  choice: उस पर बना रहेगा
  alternative: उसके लिए बाध्यकारी होगा
  rationale: चुना गया पाठ मूल के ‘खड़ा/स्थिर रहना’ रूपक की कुछ छाया बचाता है और साथ ही बताता है कि दायित्व उसी स्त्री पर लागू रहता है; कोई अतिरिक्त धर्मवैधानिक निष्कर्ष नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी प्रसंग के अनुरूप है। ‘मन्नत’ तथा ‘बंधन’ के भेद से पद में मन्नत से व्यापक आत्मारोपित दायित्व का संकेत सुरक्षित रहता है।
