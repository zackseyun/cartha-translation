  text: וְ/אִם בֵּ֥ית אִישָׁ֖/הּ נָדָ֑רָה אֽוֹ אָסְרָ֥ה אִסָּ֛ר עַל נַפְשָׁ֖/הּ בִּ/שְׁבֻעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/011.yaml
  text: And if in her husband's house she made a vow[a], or bound herself by an obligation with an oath,
translation:
  language: hi
  text: और यदि उसने अपने पति के घर में कोई मन्नत मानी हो, या शपथ के द्वारा अपने ऊपर कोई बाध्यकारी बंधन बाँधा हो,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह पद कानूनी स्थितियों की क्रमिक शृंखला में अगली शर्त प्रस्तुत करता है; ‘और यदि’ संबंध और शर्त दोनों को बनाए रखता है।
- source_word: בֵּית אִישָׁהּ
  choice: अपने पति के घर में
  rationale: यह इब्रानी रचना का स्वाभाविक हिन्दी रूप है और विवाह-संबंधी घरेलू परिस्थिति को स्पष्ट रखता है।
- source_word: נָדָרָה
  choice: कोई मन्नत मानी हो
  rationale: נדר धार्मिक अथवा औपचारिक मन्नत मानने को व्यक्त करता है; हिन्दी बाइबलीय और सामान्य प्रयोग में ‘मन्नत मानना’ सहज और स्पष्ट है।
- source_word: אוֹ
  choice: या
  rationale: यह दो निकट-संबंधित कानूनी संभावनाओं को अलग करता है।
- source_word: אָסְרָה אִסָּר
  choice: कोई बंधन रखा हो
  rationale: सजातीय क्रिया-संज्ञा की रचना स्वयं को बाध्यकारी प्रतिबंध के अधीन करने पर बल देती है; ‘बंधन रखा’ उस कानूनी भाव को संक्षेप में व्यक्त करता है।
- source_word: עַל נַפְשָׁהּ
  choice: अपने ऊपर
  rationale: यहाँ נֶפֶשׁ का अर्थ संकीर्ण रूप से ‘आत्मा’ नहीं, बल्कि स्वयं व्यक्ति है; ‘अपने ऊपर’ आत्म-बाध्यता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּשְׁבֻעָה
  choice: शपथ खाकर
  rationale: पूर्वसर्ग साधन अथवा साथ की परिस्थिति दर्शाता है; ‘शपथ खाकर’ बाध्यता के शपथपूर्वक लिए जाने को स्पष्ट करता है।
