  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कानूनी शैली रखी गई है। ‘मन्नत’ और ‘बंधन’ के बीच मूल का भेद सुरक्षित है; पद के आगे जारी रहने को दिखाने के लिए अंत में अल्पविराम रखा गया है।
