  text: וְ/אִשָּׁ֕ה כִּֽי תִדֹּ֥ר נֶ֖דֶר לַ/יהוָ֑ה וְ/אָסְרָ֥ה אִסָּ֛ר בְּ/בֵ֥ית אָבִ֖י/הָ בִּ/נְעֻרֶֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/004.yaml
  text: And if a woman vows a vow to Yahweh[a], and binds herself by an obligation in her father's house in her youth[b],
translation:
  language: hi
  text: और यदि कोई स्त्री याहवे के लिए मन्नत माने[a] और अपने ऊपर कोई बाध्यकारी बंधन ले[b], अपने पिता के घर में, अपनी युवावस्था में,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मन्नत की मन्नत माने’ जैसी सजातीय क्रिया-संज्ञा रचना है, जो मन्नत मानने के औपचारिक कार्य पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘अपने आपको किसी बाध्यकारी प्रतिज्ञा के अधीन करे।’ इब्रानी में संबंधित क्रिया और संज्ञा के द्वारा अपने ऊपर बाध्यकारी दायित्व लेने का भाव व्यक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה כִּי
  choice: और यदि कोई स्त्री
  rationale: यह वाक्य व्यवस्था के अंतर्गत एक नई संभावित स्थिति प्रस्तुत करता है। ‘यदि’ כִּי के शर्तसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִדֹּר נֶדֶר
  choice: मन्नत माने
  rationale: हिन्दी का प्रचलित धार्मिक-कानूनी मुहावरा है। इब्रानी की सजातीय क्रिया-संज्ञा रचना को शब्दशः दोहराना अस्वाभाविक होता, इसलिए उसकी औपचारिक बलवत्ता पादटिप्पणी में स्पष्ट की गई है।
- source_word: לַיהוָה
  choice: याहवे से
  rationale: याहवे परमेश्वर के निज नाम को लिप्यंतरित करता है; ‘से मन्नत मानना’ लक्ष्य भाषा में स्वाभाविक प्रयोग है और मन्नत के संबोधन को बताता है।
- source_word: וְאָסְרָה אִסָּר
  choice: और अपने आपको किसी बंधन में बाँध ले
  rationale: यह क्रिया और उससे संबंधित संज्ञा, अपने ऊपर बाध्यकारी प्रतिज्ञा या प्रतिबंध लेने का भाव रखती हैं। हिन्दी में ‘बंधन में बाँधना’ उसकी सजातीय अभिव्यक्ति और कानूनी बल दोनों को पर्याप्त रूप से बनाए रखता है।
- source_word: בְּבֵית אָבִיהָ
  choice: अपने पिता के घर में रहते हुए
  rationale: केवल स्थान नहीं, उस समय पिता के घराने के अंतर्गत रहने की परिस्थिति भी अभिप्रेत है; ‘रहते हुए’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּנְעֻרֶיהָ
  choice: अपनी युवावस्था में
  rationale: यह मूल पद के आयु-काल संबंधी अर्थ को बिना ‘अविवाहित’ जैसी अंतर्निहित सामाजिक स्थिति को मुख्य पाठ में जोड़कर व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का निज वाचा-नाम सीधे आया है। ‘याहवे’ उसका आधुनिक हिन्दी लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: युवावस्था और पिता के घर का कानूनी आशय
  choice: मूल के वर्णनात्मक शब्दों को बनाए रखा गया
  alternative: ‘अविवाहित और पिता के अधिकार में’
  rationale: संदर्भ में पिता के अधिकार के अंतर्गत अविवाहित अवस्था निहित हो सकती है, पर ये शब्द इस पद में स्पष्ट रूप से नहीं हैं; इसलिए व्याख्यात्मक विस्तार मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। पद अगले वाक्य में जारी रहता है, इसलिए अंत में अल्पविराम रखा गया है। ‘मन्नत’ और ‘बंधन’ को अलग रखकर נֶדֶר तथा אִסָּר के बीच का शब्दगत भेद सुरक्षित किया गया है।
