source:
  edition: WLC
  text: וְ/אִם הָפֵר֩ יָפֵ֨ר אֹתָ֥/ם אִישָׁ/הּ֮ בְּ/י֣וֹם שָׁמְע/וֹ֒ כָּל מוֹצָ֨א שְׂפָתֶ֧י/הָ לִ/נְדָרֶ֛י/הָ וּ/לְ/אִסַּ֥ר נַפְשָׁ֖/הּ לֹ֣א יָק֑וּם אִישָׁ֣/הּ הֲפֵרָ֔/ם וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/013.yaml
  text: But if her husband indeed annuls them on the day he hears[a], then nothing that came from her lips—whether her vows or her binding obligation upon herself—shall stand. Her husband has annulled them[c][b], and Yahweh will forgive her.
translation:
  language: hi
  text: परन्तु यदि उसका पति जिस दिन सुने, उसी दिन उन्हें अवश्य रद्द कर दे, तो उसके होंठों से निकली हुई कोई भी बात—चाहे उसकी मन्नतें हों या अपने ऊपर लगाया हुआ बंधन—मान्य नहीं रहेगी। उसके पति ने उन्हें रद्द कर दिया है, और यहोवा उसे क्षमा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले प्रसंग से भिन्न वैधानिक स्थिति प्रस्तुत करता है; इसलिए संयोजक और विरोधात्मक भाव दोनों सुरक्षित रहते हैं।
- source_word: הָפֵר יָפֵר
  choice: अवश्य रद्द कर दे
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: वैवाहिक और वैधानिक प्रसंग में यही सटीक अर्थ है।
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: सुनने के दिन ही
  rationale: पति के सुनने वाले दिन की कानूनी समय-सीमा को स्पष्ट रखते हुए בְּיוֹם का औपचारिक भाव सुरक्षित करता है।
- source_word: כָּל מוֹצָא שְׂפָתֶיהָ
  choice: उसके मुँह से निकली कोई भी बात
  rationale: शाब्दिक रूप से ‘उसके होंठों से निकलने वाली हर बात’; निषेधात्मक वाक्य में यह सभी मौखिक प्रतिबद्धताओं को स्वाभाविक हिन्दी में समेटता है।
- source_word: לִנְדָרֶיהָ
  choice: उसकी मन्नतें
  rationale: नדר के धार्मिक-वैधानिक अर्थ के लिए प्रचलित और सुबोध हिन्दी पद।
- source_word: וּלְאִסַּר נַפְשָׁהּ
  choice: अपने ऊपर लिया हुआ बन्धन
  rationale: स्वयं को किसी दायित्व से बाँधने के प्रतिवर्ती अर्थ को सहज हिन्दी में बनाए रखता है।
- source_word: לֹא יָקוּם
  choice: मान्य न रहेगी
  rationale: यह कानूनी मुहावरा किसी प्रतिज्ञा के प्रभावी या लागू बने रहने को बताता है।
- source_word: הֲפֵרָם
  choice: उन्हें रद्द कर दिया है
  rationale: पूर्ण क्रिया के निर्णायक कार्य और उसके वर्तमान वैधानिक परिणाम को व्यक्त करता है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम יהוה को नाम के रूप में प्रत्यक्ष प्रस्तुत करता है।
- source_word: יִסְלַח לָהּ
  choice: उसे क्षमा करेगा
  rationale: סלח का सीधा अर्थ रखता है और क्षमा के कारण या विस्तार को पाठ से आगे बढ़ाकर परिभाषित नहीं करता।
theological_decisions:
- issue: रद्द की गई मन्नतों के बाद ईश्वरीय क्षमा का आशय
  choice: पति द्वारा मन्नतें रद्द किए जाने, उनके अमान्य होने और यहोवा द्वारा स्त्री को क्षमा किए जाने का पाठगत क्रम जस का तस रखा गया है।
  alternative: क्षमा को केवल उतावलेपन का प्रायश्चित मानना, या इसे नैतिक उत्तरदायित्व से रहित मात्र विधिक सूत्र समझना।
  rationale: मूल पद क्षमा का कारण या दोष का स्वरूप विस्तार से नहीं समझाता; अतः अनुवाद उस धर्मवैज्ञानिक तनाव को अनिर्णीत रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और वैधानिक लहजा रखा गया है। ‘रद्द’, ‘मान्य’ और ‘बन्धन’ सामान्य पाठक के लिए सुबोध रहते हुए मूल के कानूनी बल को व्यक्त करते हैं।
