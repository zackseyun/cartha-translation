id: NUM.30.9
reference: Numbers 30:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/אִם בְּ/י֨וֹם שְׁמֹ֣עַ אִישָׁ/הּ֮ יָנִ֣יא אוֹתָ/הּ֒ וְ/הֵפֵ֗ר אֶת נִדְרָ/הּ֙ אֲשֶׁ֣ר עָלֶ֔י/הָ וְ/אֵת֙ מִבְטָ֣א שְׂפָתֶ֔י/הָ אֲשֶׁ֥ר אָסְרָ֖ה עַל נַפְשָׁ֑/הּ וַ/יהוָ֖ה יִֽסְלַֽח לָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/009.yaml
  text: But if[a], on the day her husband hears of it, he forbids her and annuls her vow that is upon her, or the rash utterance of her lips by which she bound herself, then Yahweh will forgive her.
translation:
  language: hi
  text: परन्तु यदि उसका पति जिस दिन यह बात सुने, उसी दिन उसे मना कर दे और उसकी उस मन्नत को, जो उस पर बंधनकारी है, या उसके होंठों के उस कथन को, जिसके द्वारा उसने अपने आपको बाँध लिया है, रद्द कर दे, तो याहवे उसे क्षमा करेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले प्रसंग के विपरीत एक शर्त प्रस्तुत करता है; ‘परन्तु यदि’ संयोजक और प्रसंगगत विरोध—दोनों को व्यक्त करता है।
- source_word: בְּיוֹם שְׁמֹעַ
  choice: जिस दिन यह बात सुने, उसी दिन
  rationale: यह इब्रानी मुहावरा पति के जानने के समय को बताता है। ‘उसी दिन’ निर्णय की तात्कालिकता स्पष्ट करता है।
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: इस वैवाहिक-कानूनी प्रसंग में אִישָׁהּ का अर्थ सामान्यतः ‘उसका पुरुष’ नहीं, बल्कि ‘उसका पति’ है।
- source_word: יָנִיא אֹתָהּ
  choice: उसे रोक दे
  rationale: व्रत के प्रसंग में נוא का हिफ़ील रूप उसे उस प्रतिज्ञा को पूरा करने से रोकने अथवा उसकी अनुमति न देने का भाव रखता है।
- source_word: וְהֵפֵר
  choice: रद्द कर दे
  rationale: यहाँ הפר किसी चीज़ को शारीरिक रूप से तोड़ने के बजाय मन्नत के कानूनी प्रभाव को निरस्त करने का अर्थ देता है।
- source_word: נִדְרָהּ אֲשֶׁר עָלֶיהָ
  choice: उसकी उस मन्नत को, जो उस पर बंधनकारी है
  rationale: ‘उस पर’ की इब्रानी छवि को स्वाभाविक हिन्दी में रखते हुए दायित्व का कानूनी भाव स्पष्ट किया गया है।
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: उसके होंठों से निकली उस उतावली बात
  rationale: מִבְטָא कथन या उच्चारण को दर्शाता है और इस प्रसंग में संभवतः आवेग में बोले गए आत्म-दायित्व का संकेत देता है; अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: जिसके द्वारा उसने अपने आपको बाँध लिया है
  rationale: אָסַר עַל נֶפֶשׁ अपने ऊपर दायित्व लेने का मुहावरा है; यह अनुवाद उसके आत्म-बाध्यकारी और कानूनी भाव को बनाए रखता है।
- source_word: וַיהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יהוה है; उसका नामात्मक रूप हिन्दी लिपि में रखा गया है।
- source_word: יִסְלַח לָהּ
  choice: उसे क्षमा करेगा
  rationale: סלח का अर्थ यहाँ उस स्त्री को मन्नत पूरी न कर पाने के दोष से क्षमा करना है।
theological_decisions:
- issue: יהוה के दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में टेट्राग्राम יהוה प्रत्यक्ष रूप से आया है। ‘याहवे’ वाचा-नाम को उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מִבְטָא שְׂפָתֶיהָ का भाव
  choice: उसके होंठों से निकली उस उतावली बात
  alternative: उसके होंठों से निकली बात / उसके होंठों से निकली बंधनकारी बात
  rationale: शब्द मूलतः बोले गए कथन को दर्शाता है और प्रसंग आवेगपूर्ण आत्म-दायित्व का संकेत दे सकता है, पर ‘उतावली’ का भाव पूरी तरह निर्विवाद नहीं है; इसलिए विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण है। कानूनी प्रसंग के लिए ‘बंधनकारी’ और ‘रद्द’ जैसे स्पष्ट शब्द लिए गए हैं। मूल की शर्तीय रचना, पति द्वारा उसी दिन निर्णय लेने का भाव और स्त्री के अपने ऊपर दायित्व लेने की छवि सुरक्षित रखी गई है।
