source:
  edition: WLC
  text: וְ/שָׁמַ֥ע אִישָׁ֛/הּ בְּ/י֥וֹם שָׁמְע֖/וֹ וְ/הֶחֱרִ֣ישׁ לָ֑/הּ וְ/קָ֣מוּ נְדָרֶ֗י/הָ וֶֽ/אֱסָרֶ֛/הָ אֲשֶׁר אָסְרָ֥ה עַל נַפְשָׁ֖/הּ יָקֻֽמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/008.yaml
  text: And if her husband hears of it on the day he hears[a], and is silent toward her, then her vows shall stand[b], and her binding obligations that she bound on herself shall stand.
translation:
  language: hi
  text: और यदि उसका पति जिस दिन यह सुने, उसी दिन उससे कुछ न कहे[a], तो उसकी मन्नतें कायम रहेंगी, और वे बंधन भी कायम रहेंगे जो उसने अपने ऊपर बाँधे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके प्रति मौन रहे।’ इब्रानी मुहावरे का अर्थ है कि पति कोई आपत्ति नहीं करता; इसलिए मन्नत वैध रहती है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उसके बाध्यकारी दायित्व।’ इब्रानी शब्द उन संकल्पों या प्रतिबंधों को दर्शाता है जिन्हें उसने अपने ऊपर बाँधा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁמַע
  choice: और यदि ... सुने
  rationale: विधिक प्रसंग में यह क्रियारूप पूर्ववर्ती शर्तात्मक क्रम को आगे बढ़ाता है; इसलिए साधारण भूतकाल के बजाय शर्तसूचक अनुवाद स्वाभाविक है।
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: विवाह-संबंधी इस प्रसंग में אִישָׁהּ का अर्थ सामान्य ‘उसका पुरुष’ नहीं, बल्कि ‘उसका पति’ है।
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: जिस दिन ... सुने, उस दिन
  rationale: यह वाक्यांश सुनने के विधिक रूप से निर्णायक दिन पर बल देता है और इब्रानी की काल-संबंधी संरचना को स्पष्ट हिंदी में सुरक्षित रखता है।
- source_word: וְהֶחֱרִישׁ לָהּ
  choice: उसके प्रति चुप रहे
  rationale: मूल मुहावरा पति के आपत्ति न करने को व्यक्त करता है। मुख्य पाठ में ‘चुप रहे’ मूल बिंब को बनाए रखता है, जबकि पादटिप्पणी व्यावहारिक आशय स्पष्ट करती है।
- source_word: וְקָמוּ / יָקֻמוּ
  choice: कायम रहेंगी / कायम रहेंगे
  rationale: विधिक संदर्भ में קום का अर्थ प्रभावी या मान्य बने रहना है। दोनों occurrences में ‘कायम रहना’ रखने से मूल की पुनरावृत्ति और कानूनी बल सुरक्षित रहता है।
- source_word: נְדָרֶיהָ
  choice: उसकी मन्नतें
  rationale: परमेश्वर के सामने किए गए वचन के लिए ‘मन्नत’ आधुनिक हिंदी बाइबलीय और सामान्य धार्मिक प्रयोग में सुबोध है।
- source_word: וֶאֱסָרֶהָ
  choice: उसके बंधन
  rationale: यह संज्ञा अपने ऊपर रखे गए बाध्यकारी संकल्प या प्रतिबंध को दर्शाती है। ‘बंधन’ मूल धातु के बाँधने वाले रूपक को सुरक्षित रखता है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: अपने ऊपर लिए हुए
  rationale: यह स्वेच्छा से अपने को बाध्य करने का हिंदी में स्वाभाविक विधान है; נֶפֶשׁ यहाँ ‘प्राण’ या ‘आत्मा’ नहीं, बल्कि स्वयं व्यक्ति को सूचित करता है।
theological_decisions:
- issue: पति के मौन का विधिक अर्थ
  choice: मुख्य पाठ में ‘उसके प्रति चुप रहे’
  alternative: ‘उस पर कोई आपत्ति न करे’
  rationale: मूल पाठ मौन की भाषा का प्रयोग करता है, जिसके फलस्वरूप मन्नत मान्य रहती है। अनुवाद ने परिणाम तो सुरक्षित रखा है, पर मुख्य पाठ में मौन को सीधे ‘अनुमोदन’ कहकर उससे अधिक नहीं कहा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मन्नतें’ और ‘बंधन’ मूल के दो संबंधित किंतु अलग विधिक शब्दों को अलग रखते हैं। ‘कायम रहना’ की पुनरावृत्ति मूल इब्रानी के कानूनी जोर को प्रतिबिंबित करती है।
