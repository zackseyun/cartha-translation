base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/007.yaml
  text: But if she belongs to a husband[a], and her vows are upon her, or a rash utterance of her lips by which she has bound herself[b],
translation:
  language: hi
  text: परन्तु यदि वह किसी पुरुष की पत्नी हो जाए, और उसकी मन्नतें उस पर हों, या उसके होंठों की कोई उतावली बात हो, जिसके द्वारा उसने स्वयं को बाँध लिया हो,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उतावली बात” का अनुवाद “उसके होंठों की बात” भी हो सकता है। यह संभवतः औपचारिक मन्नत से अलग, बोलकर अपने ऊपर लिया गया दायित्व है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह संयोजन पिछले विधान से जुड़ी हुई, किंतु कुछ भिन्न वैवाहिक परिस्थिति प्रस्तुत करता है।
- source_word: הָיוֹ תִהְיֶה לְאִישׁ
  choice: वह किसी पुरुष की पत्नी हो
  rationale: היה + לְאִישׁ विवाह-संबंध में होने या आने का इब्रानी मुहावरा है। हिंदी में यह रूप कानूनी-संबंधपरक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּנְדָרֶיהָ עָלֶיהָ
  choice: उसकी मन्नतें उस पर हों
  rationale: ‘उस पर’ दायित्व के उस पर स्थित होने की इब्रानी छवि को बनाए रखता है और यह पहले से तय नहीं करता कि वे अंतिम रूप से वैध ठहर चुकी हैं।
- source_word: מִבְטָא שְׂפָתֶיהָ
  choice: उसके होंठों से निकली कोई उतावली बात
  rationale: מִבְטָא कही गई बात को दर्शाता है; मन्नत से समानांतर इस कानूनी संदर्भ में ‘उतावली’ आवेग में लिए गए मौखिक आत्म-दायित्व की संभावित छाया व्यक्त करता है, जबकि इसे औपचारिक मन्नत नहीं बनाता।
- source_word: אֲשֶׁר אָסְרָה עַל נַפְשָׁהּ
  choice: जिसके द्वारा उसने अपने आपको बाँध लिया हो
  rationale: אָסַר दायित्व से बाँधने को और נֶפֶשׁ यहाँ स्वयं उस व्यक्ति को सूचित करता है; यह रूप कानूनी रूपक और आत्म-दायित्व दोनों बनाए रखता है।
theological_decisions:
- issue: कानूनी मन्नत के संदर्भ में נֶפֶשׁ का अनुवाद
  choice: अपने आपको
  alternative: अपने प्राण को
  rationale: यहाँ विषय स्वयं पर दायित्व लेने का है, मनुष्य की आत्मा या प्राण के स्वरूप का नहीं। ‘अपने आपको’ इब्रानी के आत्मवाचक प्रयोग को बिना मानव-स्वभाव संबंधी कोई धर्मवैज्ञानिक धारणा जोड़े स्पष्ट करता है।
- issue: הָיוֹ תִהְיֶה לְאִישׁ में वैवाहिक संबंध
  choice: किसी पुरुष की पत्नी हो
  alternative: किसी पति की हो जाए
  rationale: चुना हुआ पाठ विवाह का कानूनी-संबंधपरक अर्थ बताता है, पर स्वामित्व का अनावश्यक आधुनिक अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। ‘मन्नत’, ‘उस पर’ और ‘बाँध लिया’ कानूनी-वाचा संबंधी शब्दावली तथा मूल इब्रानी की दायित्व वाली छवि को बनाए रखते हैं।
