  text: וְ/אִם הַחֲרֵשׁ֩ יַחֲרִ֨ישׁ לָ֥/הּ אִישָׁ/הּ֮ מִ/יּ֣וֹם אֶל יוֹם֒ וְ/הֵקִים֙ אֶת כָּל נְדָרֶ֔י/הָ א֥וֹ אֶת כָּל אֱסָרֶ֖י/הָ אֲשֶׁ֣ר עָלֶ֑י/הָ הֵקִ֣ים אֹתָ֔/ם כִּי הֶחֱרִ֥שׁ לָ֖/הּ בְּ/י֥וֹם שָׁמְעֽ/וֹ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/015.yaml
  text: But if her husband indeed keeps silent from day to day[a], then he confirms all her vows or all her obligations that are upon her; he has confirmed them, because he kept silent on the day he heard.
translation:
  language: hi
  text: परन्तु यदि उसका पति दिन-प्रतिदिन चुप ही रहे, तो वह उसकी सभी मन्नतों या उस पर लागू सभी बन्धनकारी प्रतिज्ञाओं[a] को मान्य ठहराता है। उसने उन्हें मान्य ठहराया है, क्योंकि जिस दिन उसने सुना, उस दिन वह चुप रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे बाँधने वाली सभी प्रतिज्ञाएँ।” इब्रानी शब्द ऐसी प्रतिबद्धताओं को दर्शाता है जो उन्हें करने वाले व्यक्ति पर बन्धनकारी होती हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַחֲרֵשׁ יַחֲרִישׁ
  choice: चुप ही रहे
  rationale: धातु के infinitive absolute और finite verb का मेल क्रिया पर बल देता है। ‘चुप ही रहे’ इस बल और कानूनी प्रसंग में आपत्ति न करने के भाव, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישָׁהּ
  choice: उसका पति
  rationale: यहाँ वैवाहिक कानूनी प्रसंग में אִישׁ का यही स्वाभाविक और सटीक अर्थ है।
- source_word: מִיּוֹם אֶל יוֹם
  choice: दिन-प्रतिदिन
  rationale: यह पदबंध लगातार बीतते दिनों तक चुप रहने को दर्शाता है और इब्रानी मुहावरे के निकट है।
- source_word: וְהֵקִים
  choice: तो वह ... मान्य ठहराता है
  rationale: קום का हिफ़ील रूप यहाँ किसी मन्नत या बन्धन को कानूनी रूप से कायम रखने का अर्थ देता है। ‘मान्य ठहराता है’ आधुनिक हिन्दी में उस कानूनी प्रभाव को स्पष्ट करता है।
- source_word: נְדָרֶיהָ
  choice: उसकी सभी मन्नतों
  rationale: נדר के लिए विधिक और उपासना-संबंधी प्रसंग में ‘मन्नत’ मानक हिन्दी शब्द है।
- source_word: אֱסָרֶיהָ אֲשֶׁר עָלֶיהָ
  choice: उसके ऊपर बन्धन डालने वाली सभी प्रतिज्ञाओं
  rationale: אֱסָר उस व्यक्ति को बाँधने वाली स्वीकृत प्रतिबद्धता को दर्शाता है। इस रूप में ‘उसके ऊपर’ की इब्रानी उपमा और स्वयं पर लागू होने वाला बन्धन दोनों सुरक्षित रहते हैं।
- source_word: הֵקִים אֹתָם
  choice: उसने उन्हें मान्य ठहराया है
  rationale: इब्रानी पूर्ण क्रिया उसके पहले के मौन से उत्पन्न वर्तमान कानूनी परिणाम का सार देती है; हिन्दी पूर्ण वर्तमान उस परिणामी स्थिति को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ यह उसके द्वारा प्रतिज्ञाओं को मान्य ठहराए जाने का कारण बताता है।
- source_word: הֶחֱרִשׁ לָהּ
  choice: वह चुप रहा
  rationale: स्वाभाविक हिन्दी में मौन रहने का कानूनी भाव व्यक्त होता है; स्त्री की ओर संकेत प्रसंग से स्पष्ट है।
- source_word: בְּיוֹם שָׁמְעוֹ
  choice: जिस दिन उसने उनके विषय में सुना
  rationale: यह अध्याय में बार-बार आने वाली कानूनी समय-सीमा को बनाए रखता है। ‘उनके विषय में’ हिन्दी में कर्म को स्पष्ट करता है, जो इब्रानी प्रसंग में निहित है।
