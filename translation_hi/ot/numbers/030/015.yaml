  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठकों के लिए स्पष्ट कानूनी-वर्णनात्मक रजिस्टर अपनाया गया है। ‘मान्य ठहराता है’ मौन से उत्पन्न विधिक पुष्टि को व्यक्त करता है; ‘मन्नत’ और ‘प्रतिज्ञा’ का भेद मूल शब्दावली के अनुरूप रखा गया है।
