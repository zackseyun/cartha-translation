source:
  edition: WLC
  text: אִישׁ֩ כִּֽי יִדֹּ֨ר נֶ֜דֶר לַֽ/יהוָ֗ה אֽוֹ הִשָּׁ֤בַע שְׁבֻעָה֙ לֶ/אְסֹ֤ר אִסָּר֙ עַל נַפְשׁ֔/וֹ לֹ֥א יַחֵ֖ל דְּבָר֑/וֹ כְּ/כָל הַ/יֹּצֵ֥א מִ/פִּ֖י/ו יַעֲשֶֽׂה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/numbers/030/003.yaml
  text: If a man makes a vow to Yahweh, or swears an oath to bind himself by a pledge, he shall not break his word; he shall do according to all that has gone out from his mouth.
translation:
  language: hi
  text: यदि कोई पुरुष याहवे के लिए मन्नत माने, या अपने ऊपर बाध्यकारी दायित्व लेने के लिए शपथ खाए, तो वह अपने वचन को न तोड़े[a]; जो कुछ उसके मुँह से निकला है, वह उसके अनुसार करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह अपने वचन को अपवित्र न करे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी में स्पष्ट पुल्लिंग एकवचन संज्ञा है; कानूनी प्रसंग में स्रोत का लिंग बनाए रखा गया है।
- source_word: כִּי
  choice: यदि
  rationale: यह कानूनी शर्त प्रस्तुत करता है; आधुनिक हिन्दी में ‘यदि’ स्वाभाविक और स्पष्ट है।
- source_word: יִדֹּר נֶדֶר
  choice: मन्नत माने
  rationale: सजातीय क्रिया-संज्ञा रचना को हिन्दी के प्रचलित और अर्थसटीक मुहावरे में व्यक्त किया गया है।
- source_word: לַיהוָה
  choice: यहोवा से
  rationale: लְ यहाँ मन्नत के सम्बोधन/प्राप्तकर्ता को सूचित करता है। हिन्दी में ‘यहोवा से मन्नत मानना’ स्वाभाविक है और दिव्य नाम को नाम के रूप में रखता है।
- source_word: הִשָּׁבַע שְׁבֻעָה
  choice: शपथ खाए
  rationale: सजातीय इब्रानी रचना के लिए यह सामान्य, गरिमापूर्ण हिन्दी प्रयोग है।
- source_word: לֶאְסֹר אִסָּר עַל נַפְשׁוֹ
  choice: अपने ऊपर कोई बंधन रखने के लिए
  rationale: वाक्यांश का भाव स्वयं को किसी बाध्यकारी दायित्व के अधीन करना है। ‘बंधन’ मूल की ठोस छवि को बचाता है, जबकि वाक्य हिन्दी में बोधगम्य रहता है।
- source_word: לֹא יַחֵל דְּבָרוֹ
  choice: अपने वचन को न तोड़े
  rationale: חלל के हिफ़ील रूप का शाब्दिक भाव वचन को अपवित्र करना है, पर इस कानूनी प्रसंग में उसका स्वाभाविक अर्थ वचन का उल्लंघन करना है।
- source_word: כְּכָל הַיֹּצֵא מִפִּיו יַעֲשֶׂה
  choice: जो कुछ उसके मुँह से निकला है, वह उसके अनुसार करे
  rationale: मुँह से निकलने की मूल इब्रानी छवि और कानूनी अनिवार्यता दोनों सुरक्षित रखी गई हैं।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों में प्रचलित नामरूप ‘यहोवा’ उसे उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ संभावित उच्चारण के अधिक निकट विकल्प है।
- issue: לֹא יַחֵל में पवित्रता-संबंधी अर्थछाया
  choice: वचन को न तोड़े
  alternative: अपने वचन को अपवित्र न करे
  rationale: मुख्य पाठ में कानूनी आशय स्पष्ट किया गया है, पर मूल क्रिया की पवित्र/अपवित्र अर्थछाया को पादटिप्पणी में बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली अपनाई गई है। ‘मन्नत मानना’ और ‘शपथ खाना’ सामान्य धार्मिक-कानूनी मुहावरे हैं। स्रोत की ठोस अभिव्यक्ति ‘मुँह से निकला’ सुरक्षित रखी गई है।
