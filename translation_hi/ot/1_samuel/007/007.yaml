source:
  edition: WLC
  text: וַ/יִּשְׁמְע֣וּ פְלִשְׁתִּ֗ים כִּֽי הִתְקַבְּצ֤וּ בְנֵֽי יִשְׂרָאֵל֙ הַ/מִּצְפָּ֔תָ/ה וַ/יַּעֲל֥וּ סַרְנֵֽי פְלִשְׁתִּ֖ים אֶל יִשְׂרָאֵ֑ל וַֽ/יִּשְׁמְעוּ֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/יִּֽרְא֖וּ מִ/פְּנֵ֥י פְלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/007.yaml
  text: When the Philistines heard that the sons of Israel had gathered at Mizpah[a], the rulers of the Philistines went up against Israel. When the sons of Israel heard it[b], they were afraid because of the Philistines.
translation:
  language: hi
  text: जब पलिश्तियों ने सुना कि इस्राएली मिस्पा में[a] इकट्ठे हुए थे, तब पलिश्तियों के शासक[b] इस्राएल के विरुद्ध चढ़ आए। यह सुनकर इस्राएली पलिश्तियों से डर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘मिस्पा को’ या ‘मिस्पा की ओर।’ हिब्रू नाम के साथ दिशासूचक प्रत्यय लगा है, यद्यपि संदर्भ बताता है कि लोग वहाँ इकट्ठे थे।
    reason: lexical_alternative
  - marker: b
    text: या ‘पलिश्तियों के सरदार।’ हिब्रू शब्द पलिश्तियों के मान्य राजनीतिक और सैनिक अधिपतियों की पदवी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמְעוּ
  choice: सुना / यह सुनकर
  rationale: कथात्मक संदर्भ में שׁמע का सामान्य अर्थ समाचार सुनना है। दोनों occurrences में सुनने का भाव रखा गया है; दूसरी बार निहित विषय—पलिश्ती शासकों का चढ़ आना—‘यह’ से स्वाभाविक रूप में व्यक्त हुआ है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जनसमूह के नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: הִתְקַבְּצוּ
  choice: इकट्ठे हुए हैं
  rationale: हित्पएल रूप का परस्पर/सामूहिक रूप से एकत्र होने का भाव सहज हिन्दी में व्यक्त करता है। समाचार की विषयवस्तु में हिन्दी का पूर्ण वर्तमान यहाँ स्वाभाविक है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: यह सामूहिक जातिनाम आधुनिक हिन्दी में स्वाभाविक है और यहाँ स्त्री-पुरुष पूरे समुदाय को सूचित करता है; ‘इस्राएल के पुत्र’ इस संदर्भ में अनावश्यक रूप से शाब्दिक और कम स्वाभाविक होता।
- source_word: הַמִּצְפָּתָה
  choice: मिस्पा में
  rationale: हिब्रू में दिशासूचक प्रत्यय है, पर संदर्भ लोगों के वहाँ एकत्र हो चुके होने का है; इसलिए मुख्य पाठ में स्थानसूचक ‘में’ अर्थ को स्पष्ट करता है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיַּעֲלוּ
  choice: चढ़ आए
  rationale: עלה के ऊपर जाने/सैन्य रूप से आगे बढ़ने के मुहावरे को हिन्दी के स्वाभाविक सैन्य कथन में बनाए रखता है।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के शासक
  rationale: סרן पलिश्तियों के मान्य राजनीतिक-सैन्य अधिपतियों की पदवी है। ‘शासक’ आधुनिक पाठक के लिए स्पष्ट है; वैकल्पिक पारंपरिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֶל יִשְׂרָאֵל
  choice: इस्राएल के विरुद्ध
  rationale: אֶל का मूल अर्थ ‘की ओर’ है, पर सैन्य प्रसंग में आगे बढ़ने का लक्ष्य शत्रुतापूर्ण है; ‘के विरुद्ध’ हिन्दी में यही संबंध स्वाभाविक रूप से बताता है।
- source_word: וַיִּירְאוּ מִפְּנֵי פְלִשְׁתִּים
  choice: पलिश्तियों से डर गए
  rationale: מִפְּנֵי के साथ ירא का हिन्दी समतुल्य ‘से डरना’ है। ‘डर गए’ घटना के क्रम में भय उत्पन्न होने को सहज रूप से व्यक्त करता है।
