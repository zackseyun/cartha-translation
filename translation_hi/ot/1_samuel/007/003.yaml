source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל אֶל כָּל בֵּ֣ית יִשְׂרָאֵל֮ לֵ/אמֹר֒ אִם בְּ/כָל לְבַבְ/כֶ֗ם אַתֶּ֤ם שָׁבִים֙ אֶל יְהוָ֔ה הָסִ֜ירוּ אֶת אֱלֹהֵ֧י הַ/נֵּכָ֛ר מִ/תּוֹכְ/כֶ֖ם וְ/הָ/עַשְׁתָּר֑וֹת וְ/הָכִ֨ינוּ לְבַבְ/כֶ֤ם אֶל יְהוָה֙ וְ/עִבְדֻ֣/הוּ לְ/בַדּ֔/וֹ וְ/יַצֵּ֥ל אֶתְ/כֶ֖ם מִ/יַּ֥ד פְּלִשְׁתִּֽים־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/003.yaml
  text: Then Samuel said to all the house of Israel[a], “If you are returning to Yahweh with all your heart, remove the foreign gods and the Ashtaroths from among you, and direct your heart to Yahweh and serve him alone[d][c][b], and he will deliver you from the hand of the Philistines.”
translation:
  language: hi
  text: तब शमूएल ने इस्राएल के सारे घराने से कहा, “यदि तुम अपने पूरे मन से याहवे की ओर लौट रहे हो, तो अपने बीच से पराए देवताओं और अश्तारोत को दूर कर दो[a]। अपने मन को याहवे की ओर स्थिर करो[b] और केवल उसी की सेवा करो; और वह तुम्हें पलिश्तियों के हाथ से छुड़ाएगा[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “अश्तारोत” इब्रानी में बहुवचन है। सम्भवतः यह देवी अश्तोरेत/अस्तार्ते से जुड़े उसके रूपों, प्रतिमाओं या उपासना-रूपों को दर्शाता है।
    reason: cultural_note
  - marker: b
    text: या “अपने मन को याहवे के लिए तैयार करो।”
    reason: lexical_alternative
  - marker: c
    text: “पलिश्तियों के हाथ से” एक इब्रानी मुहावरा है, जिसका अर्थ है उनकी सत्ता या नियंत्रण से छुड़ाना।
    reason: idiom_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब शमूएल ने ... कहा
  rationale: वाव-क्रम कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल के सारे घराने
  rationale: ‘घराना’ सामूहिक और वाचा-समुदाय के भाव को बनाए रखता है, जबकि हिन्दी में बोधगम्य भी है।
- source_word: אִם בְּכָל לְבַבְכֶם אַתֶּם שָׁבִים אֶל יְהוָה
  choice: यदि तुम अपने पूरे मन से याहवे की ओर लौट रहे हो
  rationale: ‘लौट रहे हो’ कृदन्त रूप और वाचा की निष्ठा की ओर वापसी—दोनों को व्यक्त करता है; ‘पूरे मन से’ सम्पूर्ण समर्पण का इब्रानी मुहावरा है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֱלֹהֵי הַנֵּכָר
  choice: पराए देवताओं
  rationale: यह पद इस्राएल के वाचा-समुदाय से बाहर के देवताओं को दर्शाता है; ‘पराए’ हिन्दी में इस विरोध को स्पष्ट रखता है।
- source_word: וְהָעַשְׁתָּרֹת
  choice: और अश्तारोत
  rationale: इब्रानी बहुवचन का लिप्यंतरण उसकी सांस्कृतिक और संदर्भगत अनिश्चितता को बनाए रखता है; इसे केवल मूर्तियाँ कहकर सीमित नहीं किया गया।
- source_word: וְהָכִינוּ לְבַבְכֶם אֶל יְהוָה
  choice: अपने मन को याहवे की ओर स्थिर करो
  rationale: כּוּן के स्थापित, तैयार या दृढ़तापूर्वक उन्मुख करने के अर्थ को ‘स्थिर करो’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְעִבְדֻהוּ לְבַדּוֹ
  choice: केवल उसी की सेवा करो
  rationale: ‘सेवा’ उपासना के साथ आज्ञाकारिता और निष्ठा का व्यापक अर्थ भी बनाए रखती है; ‘केवल उसी’ विशिष्ट निष्ठा पर बल देता है।
- source_word: וְיַצֵּל אֶתְכֶם
  choice: और वह तुम्हें ... छुड़ाएगा
  rationale: हिफ़ील रूप उद्धार या बचाव को सूचित करता है; भविष्यकाल शर्त के अपेक्षित परिणाम को स्वाभाविक रूप से बताता है, जबकि ‘और’ मूल संयोजक को बनाए रखता है।
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ से
  rationale: मूल का ठोस मुहावरा सुरक्षित रखा गया है; यहाँ ‘हाथ’ सत्ता और नियंत्रण का बोध कराता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; लिप्यंतरण नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: שָׁבִים में इस्राएल की प्रतिक्रिया का स्वरूप
  choice: याहवे की ओर लौट रहे हो
  alternative: याहवे की ओर फिर रहे हो
  rationale: ‘लौटना’ पश्चात्ताप और वाचा की निष्ठा की पुनर्स्थापना का भाव रखता है, पर बाद की किसी विशिष्ट धर्मवैज्ञानिक व्यवस्था को पाठ में नहीं जोड़ता।
- issue: עבד का अर्थ
  choice: केवल उसी की सेवा करो
  alternative: केवल उसी की उपासना करो
  rationale: ‘सेवा’ इब्रानी शब्द के व्यापक अर्थ—उपासना, आज्ञाकारिता और निष्ठा—को सुरक्षित रखती है।
- issue: וְיַצֵּל का शर्त से संबंध
  choice: और वह ... छुड़ाएगा
  alternative: ताकि वह ... छुड़ाए
  rationale: वाक्य-क्रम इसे आज्ञाओं के बाद अपेक्षित परिणाम के रूप में पढ़ने देता है; ‘और’ मूल की संरचना को रखता है तथा उद्देश्य का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘घराना’, ‘स्थिर करो’ और ‘हाथ से छुड़ाएगा’ जैसे पद मूल की सामूहिक, वाचागत और मुहावरेदार बनावट को सुरक्षित रखते हैं। विराम-चिह्नों से आदेशों और प्रतिज्ञात परिणाम का संबंध स्पष्ट किया गया है।
