source:
  edition: WLC
  text: וַ/יְהִ֤י שְׁמוּאֵל֙ מַעֲלֶ֣ה הָ/עוֹלָ֔ה וּ/פְלִשְׁתִּ֣ים נִגְּשׁ֔וּ לַ/מִּלְחָמָ֖ה בְּ/יִשְׂרָאֵ֑ל וַ/יַּרְעֵ֣ם יְהוָ֣ה בְּ/קוֹל גָּ֠דוֹל בַּ/יּ֨וֹם הַ/ה֤וּא עַל פְּלִשְׁתִּים֙ וַ/יְהֻמֵּ֔/ם וַ/יִּנָּגְפ֖וּ לִ/פְנֵ֥י יִשְׂרָאֵֽל׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/010.yaml
  text: And as Samuel was offering up the burnt offering[a], the Philistines drew near for battle against Israel. But Yahweh thundered with a great sound on that day against the Philistines and threw them into confusion, and they were defeated before Israel.
translation:
  language: hi
  text: जब शमूएल होमबलि चढ़ा रहा था, तब पलिश्ती इस्राएल से युद्ध करने के लिए निकट आ गए। पर उसी दिन याहवे ने पलिश्तियों के विरुद्ध बड़ी गर्जना की[a] और उनमें खलबली मचा दी; वे इस्राएल के सामने हार गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बड़ी आवाज़ के साथ” अथवा “भारी शोर के साथ।” इब्रानी में शाब्दिक अर्थ है “बड़ी आवाज़ के साथ।”
    reason: בְּקוֹל גָּדוֹל के शाब्दिक अर्थ और प्रसंगानुकूल वैकल्पिक अनुवादों को सुरक्षित रखना।
lexical_decisions:
- source_word: מַעֲלֶה הָעוֹלָה
  choice: होमबलि चढ़ा ही रहा था
  rationale: हिफ़ील कृदंत चल रही बलिदान-क्रिया को व्यक्त करता है। ‘चढ़ा ही रहा था’ उसके जारी रहने और उसी समय पलिश्तियों के निकट आने—दोनों को स्वाभाविक हिन्दी में दिखाता है। עֹלָה के लिए प्रचलित बलिदानी शब्द ‘होमबलि’ रखा गया है।
- source_word: נִגְּשׁוּ לַמִּלְחָמָה בְּיִשְׂרָאֵל
  choice: इस्राएल से युद्ध करने के लिए निकट आ गए
  rationale: נגשׁ का निकट आने का भाव और सैन्य प्रसंग में לַמִּלְחָמָה तथा בְּיִשְׂרָאֵל का विरोधात्मक अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: וַיַּרְעֵם
  choice: गरजा
  rationale: רעם बादल के गरजने अथवा गर्जन करने का शब्द है। ‘गरजा’ परमेश्वर को कर्ता रखते हुए प्रत्यक्ष और मुहावरेदार हिन्दी देता है।
- source_word: בְּקוֹל גָּדוֹל
  choice: बड़ी आवाज़ के साथ
  rationale: यह चयन קוֹל के व्यापक अर्थ ‘आवाज़/ध्वनि’ को बनाए रखता है और उसे केवल ‘गर्जन’ मानकर अनावश्यक रूप से सीमित नहीं करता; प्रसंग में ‘गरजा’ उसके स्वरूप को पर्याप्त रूप से इंगित करता है।
- source_word: וַיְהֻמֵּם
  choice: उसने उनमें खलबली मचा दी
  rationale: המם का हिफ़ील युद्ध में घबराहट, भ्रम और अव्यवस्था उत्पन्न करने का भाव देता है। ‘खलबली मचा दी’ आधुनिक हिन्दी में इस कारक अर्थ को सहजता से व्यक्त करता है।
- source_word: וַיִּנָּגְפוּ לִפְנֵי יִשְׂרָאֵל
  choice: वे इस्राएल के सामने हार गए
  rationale: निफ़ाल נָגַף सैन्य प्रसंग में पराजित होने को दर्शाता है। ‘इस्राएल के सामने हार गए’ परिणाम को व्यक्त करता है, पर पूर्ण संहार का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका मान्य आधुनिक लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: ईश्वरीय गर्जन और ‘बड़ी आवाज़’ का संबंध
  choice: बड़ी आवाज़ के साथ गरजा
  alternative: भयंकर गर्जन किया
  rationale: क्रिया स्पष्टतः गर्जन बताती है, जबकि בְּקוֹל גָּדוֹל शाब्दिक रूप से ‘बड़ी आवाज़ के साथ’ है। मुख्य पाठ दोनों तत्वों को अलग रखकर मूल की अभिव्यक्ति और उसकी संभावित व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होमबलि’ बाइबलीय बलिदान की स्थापित हिन्दी संज्ञा है। छोटे समन्वित वाक्य मूल की तीव्र युद्ध-कथा की गति बनाए रखते हैं।
