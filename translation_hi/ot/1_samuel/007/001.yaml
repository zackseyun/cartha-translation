source:
  edition: WLC
  text: וַ/יָּבֹ֜אוּ אַנְשֵׁ֣י קִרְיַ֣ת יְעָרִ֗ים וַֽ/יַּעֲלוּ֙ אֶת אֲר֣וֹן יְהוָ֔ה וַ/יָּבִ֣אוּ אֹת֔/וֹ אֶל בֵּ֥ית אֲבִינָדָ֖ב בַּ/גִּבְעָ֑ה וְ/אֶת אֶלְעָזָ֤ר בְּנ/וֹ֙ קִדְּשׁ֔וּ לִ/שְׁמֹ֖ר אֶת אֲר֥וֹן יְהוָֽה׀־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/001.yaml
  text: Then the men of Kiriath-jearim came and brought up the ark of Yahweh[a], and they brought it into the house of Abinadab on the hill[b]. And they consecrated Eleazar his son to keep the ark of Yahweh.
translation:
  language: hi
  text: तब किर्यत-यारीम के पुरुष आए और याहवे[a] का संदूक ऊपर ले गए। वे उसे पहाड़ी[b] पर स्थित अबीनादाब के घर में ले आए। उन्होंने उसके पुत्र एलआज़ार को याहवे के संदूक की रखवाली करने के लिए पवित्र ठहराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में परमेश्वर का विशिष्ट नाम יהוה (YHWH) है; यहाँ उसे “याहवे” लिखा गया है।
    reason: lexical_alternative
  - marker: b
    text: या सम्भवतः, “गिबा में,” यदि בַּגִּבְעָה को सामान्य संज्ञा “पहाड़ी” के बजाय स्थान-नाम माना जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब … आए
  rationale: यह कथात्मक वय्यिक्तोल क्रम को स्वाभाविक हिन्दी में आगे बढ़ाता है; क्रिया בוא का सामान्य अर्थ ‘आना’ है।
- source_word: אַנְשֵׁי קִרְיַת יְעָרִים
  choice: किर्यत-यारीम के पुरुष
  rationale: אַנְשֵׁי का विशिष्ट अर्थ ‘पुरुष’ है; स्थान-नाम का लिप्यंतरण मूल उच्चारण के निकट रखा गया है।
- source_word: וַיַּעֲלוּ
  choice: ऊपर ले गए
  rationale: עלה की दिशात्मक भावना ‘ऊपर ले जाना’ सुरक्षित रहती है; केवल ‘ले गए’ कहने से यह भाव खो जाता।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: אֲרוֹן के लिए इस पवित्र वस्तु के संदर्भ में प्रचलित और स्पष्ट शब्द ‘संदूक’ है; יהוה को नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: וַיָּבִאוּ אֹתוֹ אֶל בֵּית אֲבִינָדָב
  choice: वे उसे … अबीनादाब के घर में ले आए
  rationale: ביא सकर्मक रूप में ‘ले आना’ है और אֶל गंतव्य बताता है; हिन्दी में ‘घर में ले आए’ भीतर पहुँचाने का भाव स्वाभाविक रूप से देता है।
- source_word: בַּגִּבְעָה
  choice: पहाड़ी पर स्थित
  rationale: सव्यंजन लेख के साथ גִּבְעָה का सीधा अर्थ ‘उस/वह पहाड़ी’ है। घर और पहाड़ी का संबंध हिन्दी में स्पष्ट करने के लिए ‘पर स्थित’ जोड़ा गया है, जबकि स्थान-नाम की सम्भावना पाद-टिप्पणी में रखी गई है।
- source_word: וְאֶת אֶלְעָזָר בְּנוֹ
  choice: उन्होंने उसके पुत्र एलआज़ार को
  rationale: अग्रस्थ कर्म को स्वाभाविक हिन्दी क्रम में रखा गया है; निकटतम पूर्वपद के कारण ‘उसके’ का संकेत अबीनादाब की ओर सबसे स्वाभाविक है।
- source_word: קִדְּשׁוּ
  choice: पवित्र ठहराया
  rationale: קדשׁ यहाँ किसी व्यक्ति को पवित्र सेवा के लिए अलग नियुक्त करने का भाव रखता है; ‘पवित्र ठहराया’ धार्मिक अर्थ बनाए रखते हुए समझने योग्य है।
- source_word: לִשְׁמֹר
  choice: रखवाली करने के लिए
  rationale: שׁמר का यहाँ अर्थ संदूक की निगरानी और सुरक्षा करना है; ‘रखवाली’ हिन्दी में इस दायित्व को ‘रखने’ से अधिक स्पष्ट करती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में और सम्भावित प्राचीन उच्चारण के निकट प्रस्तुत करता है; पाठक-सहायता के लिए पाद-टिप्पणी दी गई है।
- issue: בַּגִּבְעָה सामान्य संज्ञा है या स्थान-नाम
  choice: पहाड़ी पर
  alternative: गिबा में
  rationale: लेखयुक्त रूप का सबसे सीधा अर्थ सामान्य संज्ञा ‘पहाड़ी’ है। फिर भी ‘गिबा’ स्थान-नाम के रूप में समझना सम्भव है, इसलिए उस वास्तविक अस्पष्टता को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: एलआज़ार को पवित्र ठहराने का आशय
  choice: पवित्र सेवा के लिए अलग नियुक्त करने का धार्मिक भाव बनाए रखा
  alternative: केवल ‘नियुक्त किया’ या ‘अलग किया’
  rationale: קדשׁ में साधारण प्रशासनिक नियुक्ति से अधिक पवित्रता/समर्पण का भाव है; अनुवाद उसके पद या पुरोहितीय अधिकार के विषय में मूल से अधिक दावा नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘संदूक,’ ‘रखवाली’ और ‘पवित्र ठहराया’ जैसे शब्द सामान्य पाठक के लिए स्पष्ट हैं और मूल के धार्मिक तथा दिशात्मक अर्थों को बनाए रखते हैं। पाद-टिप्पणी चिह्न पाठ में अपने सही विषय—ईश्वरीय नाम और ‘पहाड़ी/गिबा’ की अस्पष्टता—के साथ लगाए गए हैं।
