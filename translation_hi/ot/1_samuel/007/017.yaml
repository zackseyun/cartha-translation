  text: וּ/תְשֻׁבָת֤/וֹ הָ/רָמָ֨תָ/ה֙ כִּֽי שָׁ֣ם בֵּית֔/וֹ וְ/שָׁ֖ם שָׁפָ֣ט אֶת יִשְׂרָאֵ֑ל וַ/יִּֽבֶן שָׁ֥ם מִזְבֵּ֖חַ לַֽ/יהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/017.yaml
  text: Then he would return to Ramah[a], for his house was there, and there he judged Israel. He built there an altar to Yahweh.
translation:
  language: hi
  text: फिर वह रामा[a] लौट आता था, क्योंकि उसका घर वहीं था; और वहीं वह इस्राएल का न्याय करता था। उसने वहाँ यहोवा के लिए एक वेदी बनाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “और उसकी वापसी रामा की ओर थी।”
    reason: मूल में क्रिया के बजाय ‘उसकी वापसी’ संज्ञात्मक अभिव्यक्ति है; मुख्य पाठ में प्रसंगानुसार इसे स्वाभाविक हिन्दी क्रिया के रूप में व्यक्त किया गया है।
lexical_decisions:
- source_word: וּתְשֻׁבָתוֹ
  choice: फिर वह ... लौट आता था
  rationale: शाब्दिक अर्थ ‘और उसकी वापसी’ है। पिछले पद में वर्णित नियमित दौरे के संदर्भ में हिन्दी की स्वाभाविक अभिव्यक्ति के लिए इसे क्रियात्मक और आदतन रूप में रखा गया है; ‘फिर’ वाव से जुड़ी कथात्मक निरंतरता दर्शाता है।
- source_word: הָרָמָתָה
  choice: रामा
  rationale: स्थान-नाम के साथ लगा दिशासूचक ה रामाह की ओर गति बताता है; हिन्दी में ‘रामा लौट आता था’ स्वाभाविक रूप से ‘रामा को/की ओर’ का अर्थ देता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शमूएल के रामा लौटने का कारण प्रस्तुत करता है।
- source_word: בֵּיתוֹ
  choice: उसका घर
  rationale: בַּיִת का ठोस स्थानवाचक अर्थ यहाँ प्रमुख है; ‘घर’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְשָׁם
  choice: और वहीं
  rationale: मूल के दोहराए गए שָׁם को बनाए रखते हुए रामा को शमूएल की गतिविधि के स्थायी केंद्र के रूप में उभारा गया है।
- source_word: שָׁפַט אֶת־יִשְׂרָאֵל
  choice: वह इस्राएल का न्याय करता था
  rationale: שׁפט शमूएल की न्यायी की भूमिका को दर्शाता है, जो केवल अदालती निर्णय से व्यापक हो सकती है; पारंपरिक और सटीक पदावली ‘न्याय करता था’ इस अर्थ को खुला रखती है।
- source_word: וַיִּבֶן
  choice: उसने ... बनाई
  rationale: वाव-क्रमिक रूप अगली कथात्मक क्रिया बताता है। मूल में स्पष्ट ‘भी’ नहीं है, इसलिए उसे नहीं जोड़ा गया।
- source_word: מִזְבֵּחַ
  choice: एक वेदी
  rationale: מִזְבֵּחַ का मानक और संदर्भानुकूल हिन्दी अनुवाद।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: ל समर्पण या उद्देश्य दर्शाता है; हिन्दी में ‘के लिए’ स्वाभाविक है और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ चतुराक्षरी व्यक्तिगत नाम יהוה का प्रयोग करता है। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला रूप है और नाम को सामान्य उपाधि में बदलने के बजाय उसकी नाम-संबंधी प्रकृति बनाए रखता है।
- issue: שׁפט में न्याय और शासन का व्यापक अर्थ
  choice: इस्राएल का न्याय करता था
  alternative: इस्राएल पर शासन करता था
  rationale: ‘न्याय करता था’ शमूएल की स्थापित न्यायी-भूमिका को सुरक्षित रखता है और क्रिया को केवल राजनीतिक शासन तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। नियमित क्रिया दिखाने के लिए ‘लौट आता था’ और ‘न्याय करता था’ रखा गया है। ‘वहीं’ की पुनरावृत्ति-सदृश संरचना मूल में स्थान पर दिए गए बल को बनाए रखती है।
