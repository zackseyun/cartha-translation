base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/006.yaml
  text: So they gathered at Mizpah[a], drew water, and poured it out before Yahweh. They fasted on that day and said there[c][b], “We have sinned against Yahweh.” And Samuel judged the sons of Israel at Mizpah.
translation:
  language: hi
  text: तब वे मिस्पा में[a] इकट्ठे हुए। उन्होंने पानी निकाला और उसे याहवे के सामने उंडेल दिया।[b] उस दिन उन्होंने उपवास किया और वहाँ कहा, “हमने याहवे के विरुद्ध पाप किया है।” शमूएल ने मिस्पा में इस्राएलियों का न्याय किया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: पहली बार आए इब्रानी रूप में दिशा सूचित करने वाला अंत है; इसलिए इसका अनुवाद “मिस्पा को” या “मिस्पा की ओर” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: याहवे के सामने पानी उंडेलना पश्चात्ताप या विलाप से जुड़ा एक रस्मी कार्य हो सकता है, पर पाठ उसके प्रतीकात्मक अर्थ को स्पष्ट नहीं करता।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से, “इस्राएल के पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּבְצוּ
  choice: वे ... इकट्ठे हुए
  rationale: निफ़ाल रूप यहाँ लोगों के एकत्र होने को व्यक्त करता है; यह सहज हिन्दी है और किसी बाहरी कर्ता को नहीं जोड़ता।
- source_word: הַמִּצְפָּתָה / בַּמִּצְפָּה
  choice: मिस्पा में
  rationale: पहले रूप में दिशासूचक प्रत्यय है, पर ‘इकट्ठे हुए’ के साथ हिन्दी में स्थानवाचक ‘में’ स्वाभाविक है; दिशासूचक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וַיִּשְׁאֲבוּ מַיִם
  choice: पानी निकाला
  rationale: שׁאב का सामान्य अर्थ कुएँ या जलस्रोत से पानी निकालना है; ‘पानी निकाला’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: וַיִּשְׁפְּכוּ לִפְנֵי יְהוָה
  choice: उसे याहवे के सामने उंडेल दिया
  rationale: क्रिया पानी को बहाकर डालने का बोध देती है; ‘उसे’ पूर्वोक्त पानी से स्पष्ट रूप से जुड़ता है और לִפְנֵי का अर्थ ‘के सामने’ रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का देवनागरी लिप्यंतरण किया गया है, शीर्षक से उसका प्रतिस्थापन नहीं किया गया।
- source_word: וַיָּצוּמוּ
  choice: उन्होंने उपवास किया
  rationale: צום के उपवास करने के सामान्य अर्थ को सीधे और स्वाभाविक रूप में व्यक्त करता है।
- source_word: חָטָאנוּ לַיהוָה
  choice: हमने याहवे के विरुद्ध पाप किया है
  rationale: ל के साथ חטא किसी के विरुद्ध पाप का अर्थ देता है; पूर्ण क्रिया को ऐसी हिन्दी में रखा गया है जो बीते अपराध और वर्तमान स्वीकारोक्ति दोनों को व्यक्त करती है।
- source_word: וַיִּשְׁפֹּט
  choice: न्याय किया
  rationale: שׁפט न्याय करने, न्यायाधीश की भूमिका निभाने या शासन करने तक अर्थ दे सकता है; ‘न्याय किया’ इस व्यापक बाइबलीय पद-भाव को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֶת־בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों का
  rationale: शाब्दिक पद ‘इस्राएल के पुत्रों’ का सामूहिक आशय इस्राएल के लोगों से है; ‘इस्राएलियों’ सहज और समावेशी आधुनिक हिन्दी है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: याहवे के सामने पानी उंडेलने की रस्म का अर्थ
  choice: मुख्य पाठ में केवल क्रिया का वर्णन, उसके प्रतीकात्मक अर्थ की व्याख्या नहीं
  alternative: पश्चात्ताप, विलाप, आत्म-समर्पण या अर्घ्य का स्पष्ट प्रतीक
  rationale: पाठ इस कार्य का अर्थ स्वयं नहीं बताता। इसलिए किसी एक धार्मिक व्याख्या को मुख्य पाठ में आरोपित न करके संभावित सांस्कृतिक संदर्भ केवल पादटिप्पणी में सावधानी से बताया गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को नाम के रूप में बनाए रखने के लिए उसका निकट देवनागरी लिप्यंतरण किया गया है।
- issue: शमूएल की न्यायिक भूमिका का विस्तार
  choice: न्याय किया
  alternative: शासन किया; न्यायाधीश के रूप में सेवा की
  rationale: इब्रानी क्रिया में न्याय और नेतृत्व दोनों की संभावना है; संक्षिप्त शब्दावली मूल की व्यापकता और संभावित तनाव को बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट किया गया है। ‘याहवे’ को व्यक्तिगत नाम के रूप में रखा गया है; ‘इस्राएलियों’ सामूहिक जनसमुदाय के लिए स्वाभाविक हिन्दी है। सभी पादटिप्पणी चिह्न संबंधित पदों के तुरंत बाद लगाए गए हैं।
