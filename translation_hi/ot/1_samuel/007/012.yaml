  yaml_path: translation/ot/1_samuel/007/012.yaml
  text: Then Samuel took one stone and set it between Mizpah and Shen, and he called its name Ebenezer, for he said, “Up to this point the LORD has helped us.”
translation:
  language: hi
  text: तब शमूएल ने एक पत्थर लिया और उसे मिस्पा और शेन के बीच स्थापित किया। उसने उसका नाम एबनेज़र[a] रखा, क्योंकि उसने कहा, “यहाँ तक यहोवा ने हमारी सहायता की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एबनेज़र का अर्थ है “सहायता का पत्थर।”
    reason: इब्रानी नाम אֶבֶן הָעָזֶר की अर्थवत्ता अगली उक्ति से जुड़ी है और हिंदी पाठक के लिए लिप्यंतरण मात्र से स्पष्ट नहीं होगी।
lexical_decisions:
- source_word: אֶבֶן אַחַת
  choice: एक पत्थर
  rationale: मूल पाठ में संख्या ‘एक’ स्पष्ट है; इसलिए उसे अनूदित किया गया है।
- source_word: וַיָּשֶׂם
  choice: खड़ा किया
  rationale: स्मारक के रूप में पत्थर स्थापित करने के संदर्भ में यह स्वाभाविक हिंदी है।
- source_word: אֶבֶן הָעָזֶר
  choice: एबनेज़र
  rationale: स्थान/स्मारक का पारंपरिक नाम लिप्यंतरित रखा गया है; उसके अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: עַד הֵנָּה
  choice: यहाँ तक
  rationale: यह अभिव्यक्ति स्थान अथवा अब तक की प्रगति—दोनों का संकेत दे सकती है; ‘यहाँ तक’ मूल की संक्षिप्तता और संभावित द्विअर्थता बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दैवी नाम को सामान्य हिंदी बाइबलीय लिप्यंतरण में व्यक्त किया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
theological_decisions:
- issue: ‘यहाँ तक’ का स्थानिक या कालिक अर्थ
  choice: यहाँ तक
  alternative: अब तक
  rationale: मूल עַד הֵנָּה प्रसंग में स्थानिक सीमा और उस समय तक मिली सहायता, दोनों की प्रतिध्वनि रख सकता है; चयन इस तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी; कथा की सरल गति बनाए रखी गई है। ‘मिस्पा’, ‘शेन’ और ‘एबनेज़र’ को नामों के रूप में लिप्यंतरित किया गया है।
