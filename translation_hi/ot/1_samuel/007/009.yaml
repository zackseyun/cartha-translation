source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שְׁמוּאֵ֗ל טְלֵ֤ה חָלָב֙ אֶחָ֔ד ו/יעלה עוֹלָ֛ה כָּלִ֖יל לַֽ/יהוָ֑ה וַ/יִּזְעַ֨ק שְׁמוּאֵ֤ל אֶל יְהוָה֙ בְּעַ֣ד יִשְׂרָאֵ֔ל וַֽ/יַּעֲנֵ֖/הוּ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/009.yaml
  text: So Samuel took one nursing lamb and offered it as a whole burnt offering to Yahweh. And Samuel cried out to Yahweh on behalf of Israel[a], and Yahweh answered him.
translation:
  language: hi
  text: तब शमूएल ने दूध पीता हुआ एक मेमना[a] लिया और उसे याहवे के लिए पूरी तरह होम-बलि के रूप में चढ़ाया। शमूएल ने इस्राएल की ओर से याहवे को पुकारा, और याहवे ने उसे उत्तर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “दूधमुंहा एक मेमना।” इब्रानी पदबंध उस मेमने को सूचित करता है जो अभी दूध पर पल रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: טְלֵה חָלָב אֶחָד
  choice: दूध पीता हुआ एक मेमना
  rationale: यह पदबंध ऐसे छोटे मेमने को दर्शाता है जो अभी दूध पीता है; यह हिन्दी में स्वाभाविक रहते हुए उसकी अवस्था स्पष्ट करता है।
- source_word: וַיַּעֲלֵה עוֹלָה כָּלִיל
  choice: उसे पूरी तरह होम-बलि के रूप में चढ़ाया
  rationale: हिफ़ईल क्रिया बलि चढ़ाने को, עוֹלָה होम-बलि को और כָּלִיל उसके पूर्णतः अर्पित किए जाने को व्यक्त करता है।
- source_word: לַיהוָה / אֶל־יְהוָה
  choice: यहोवा के लिए / यहोवा की
  rationale: व्यक्तिगत दिव्य नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וַיִּזְעַק
  choice: दुहाई दी
  rationale: זעק संकट में सहायता के लिए की गई तीव्र पुकार है; ‘दुहाई दी’ इस आग्रह और गंभीरता को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּעַד יִשְׂרָאֵל
  choice: इस्राएल की ओर से
  rationale: בְּעַד यहाँ प्रतिनिधिक मध्यस्थता या किसी के पक्ष में पुकारने का भाव देता है।
- source_word: וַיַּעֲנֵהוּ יְהוָה
  choice: यहोवा ने उसकी सुन ली
  rationale: शाब्दिक अर्थ ‘यहोवा ने उसे उत्तर दिया’ है; प्रार्थना की दुहाई के प्रसंग में ‘उसकी सुन ली’ सहज हिन्दी में उसी प्रत्युत्तर को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। हिन्दी पाठकों के लिए ‘यहोवा’ इसका सुस्थापित और पहचाना हुआ रूप है; इसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: शमूएल की पुकार का स्वरूप
  choice: इस्राएल की ओर से यहोवा की दुहाई दी
  alternative: इस्राएल के लिए यहोवा से प्रार्थना की
  rationale: ‘दुहाई दी’ मूल क्रिया की तीव्रता बचाती है और ‘की ओर से’ בְּעַד के मध्यस्थतापरक भाव को व्यक्त करता है, बिना किसी विस्तृत धार्मिक सिद्धान्त को जोड़ने के।
- issue: यहोवा के उत्तर का स्वरूप
  choice: उसकी सुन ली
  alternative: उसे उत्तर दिया
  rationale: प्रसंग में यह मुहावरा स्वीकारात्मक प्रत्युत्तर का संकेत देता है, पर उत्तर किस रूप में आया इसे अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होम-बलि’ स्थापित बाइबलीय बलिदानी शब्दावली है; ‘पूरी तरह’ כָּלִיל का स्पष्ट अर्थ देता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
