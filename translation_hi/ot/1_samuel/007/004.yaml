base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/004.yaml
  text: So the sons of Israel removed the Baals and the Ashtaroths[a], and they served Yahweh alone.
translation:
  language: hi
  text: तब इस्राएलियों ने बाल-देवताओं और अश्तारोत को दूर कर दिया, और केवल याहवे की सेवा की।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “केवल याहवे की उपासना की।” जब परमेश्वर इस इब्रानी क्रिया का कर्म हो, तो इसका अर्थ सेवा करना और उपासना करना—दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּסִירוּ
  choice: दूर कर दिया
  rationale: हिफ़ील रूप का अर्थ यहाँ हटाना या त्याग देना है। यह अभिव्यक्ति मूर्तिपूजक वस्तुओं से वास्तविक रूप से छुटकारा पाने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे समुदाय का प्रचलित जातीय नाम है; ‘इस्राएलियों’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הַבְּעָלִים
  choice: बाल-देवताओं
  rationale: इब्रानी में ‘बाल’ बहुवचन में है और विभिन्न स्थानीय रूपों या उनकी उपासना से जुड़ी प्रतिमाओं का संकेत दे सकता है। ‘बाल-देवताओं’ बहुवचन बनाए रखता है, बिना इसे केवल प्रतिमाओं तक सीमित किए।
- source_word: הָעַשְׁתָּרֹת
  choice: अश्तारोत
  rationale: विशिष्ट कनानी उपासना-संबंधी नाम के इब्रानी बहुवचन रूप का लिप्यंतरण रखा गया है; इसे सामान्य ‘देवियाँ’ कहकर विशिष्ट संदर्भ नहीं मिटाया गया।
- source_word: וַיַּעַבְדוּ
  choice: सेवा की
  rationale: עבד का मूल अर्थ सेवा करना है और परमेश्वर के कर्म-विषय होने पर इसमें उपासना तथा निष्ठा दोनों सम्मिलित हो सकते हैं। ‘सेवा की’ व्यापक वाचा-संबंधी भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לְבַדּוֹ
  choice: केवल
  rationale: यहाँ शब्द अनन्य निष्ठा व्यक्त करता है—उन्होंने किसी अन्य देवता की नहीं, केवल याहवे की सेवा की।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: עבד को ‘सेवा’ या ‘उपासना’ के रूप में प्रस्तुत करना
  choice: केवल याहवे की सेवा की
  alternative: केवल याहवे की उपासना की
  rationale: ‘सेवा’ क्रिया के व्यापक अर्थ—उपासना, आज्ञाकारिता और निष्ठा—को बनाए रखती है। प्रसंग में ‘उपासना’ भी वैध अर्थ है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। ‘बाल-देवताओं’ से इब्रानी बहुवचन स्पष्ट होता है; ‘अश्तारोत’ विशिष्ट नाम के रूप में रखा गया है। पादटिप्पणी का संकेत उसी क्रिया के बाद लगाया गया है जिससे वह संबंधित है।
