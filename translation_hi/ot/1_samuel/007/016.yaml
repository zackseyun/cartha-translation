  text: וְ/הָלַ֗ךְ מִ/דֵּ֤י שָׁנָה֙ בְּ/שָׁנָ֔ה וְ/סָבַב֙ בֵּֽית אֵ֔ל וְ/הַ/גִּלְגָּ֖ל וְ/הַ/מִּצְפָּ֑ה וְ/שָׁפַט֙ אֶת יִשְׂרָאֵ֔ל אֵ֥ת כָּל הַ/מְּקוֹמ֖וֹת הָ/אֵֽלֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/016.yaml
  text: And he would go year by year and make the circuit of Bethel[a], Gilgal, and Mizpah[b], and he judged Israel in all these places.
translation:
  language: hi
  text: वह प्रतिवर्ष[a] बेतेल, गिलगाल और मिस्पा का चक्कर लगाता था[b], और इन सभी स्थानों में इस्राएल का न्याय करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “साल-दर-साल” अथवा “हर साल”।
    reason: lexical_alternative
  - marker: b
    text: या “इन स्थानों का दौरा करता था”; इब्रानी इन नगरों के बीच नियमित परिपथ पर जाने का संकेत देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָלַךְ
  choice: वह ... करता था
  rationale: समय-सूचक वार्षिक अभिव्यक्ति के साथ यह क्रिया शमूएल की बीती हुई नियमित प्रथा बताती है; हिंदी में ‘करता था’ इस अभ्यस्त भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִדֵּי שָׁנָה בְּשָׁנָה
  choice: प्रतिवर्ष
  rationale: यह इब्रानी मुहावरा हर वर्ष नियमित रूप से होने वाली क्रिया को दर्शाता है; ‘प्रतिवर्ष’ संक्षिप्त, वर्तमान और गरिमापूर्ण हिंदी है।
- source_word: וְסָבַב
  choice: दौरा करता था
  rationale: यहाँ क्रिया कई नगरों के बीच नियमित परिपथ पर जाने का संकेत देती है; ‘दौरा करना’ उस स्थापित यात्रा-क्रम को सहज हिंदी में व्यक्त करता है।
- source_word: בֵּית אֵל
  choice: बेतेल
  rationale: स्थान-नाम का हिंदी बाइबलीय प्रचलन के अनुरूप लिप्यंतरण।
- source_word: הַגִּלְגָּל
  choice: गिलगाल
  rationale: स्थान-नाम का स्रोत के निकट और हिंदी में प्रचलित लिप्यंतरण।
- source_word: הַמִּצְפָּה
  choice: मिस्पा
  rationale: स्थान-नाम का हिंदी में परिचित लिप्यंतरण।
- source_word: וְשָׁפַט
  choice: न्याय करता था
  rationale: שׁפט में न्यायिक नेतृत्व का भाव है। ‘न्याय करता था’ मूल शब्द से औपचारिक संबंध बनाए रखते हुए उसके व्यापक नेतृत्वार्थ को संदर्भ पर छोड़ता है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: यहाँ इस्राएल लोगों अथवा राष्ट्र को सूचित करता है, जिनके लिए शमूएल न्याय करता था।
- source_word: אֵת כָּל הַמְּקוֹמוֹת הָאֵלֶּה
  choice: इन सभी स्थानों में
  rationale: यद्यपि इब्रानी में אֵת है, यह पदबंध यहाँ न्याय करने के स्थानों को क्रियाविशेषणात्मक ढंग से बताता है; ‘इन सभी स्थानों में’ स्वाभाविक हिंदी है।
