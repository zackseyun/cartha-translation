source:
  edition: WLC
  text: וַ/תָּשֹׁ֣בְנָה הֶ/עָרִ֡ים אֲשֶׁ֣ר לָֽקְחוּ פְלִשְׁתִּים֩ מֵ/אֵ֨ת יִשְׂרָאֵ֤ל לְ/יִשְׂרָאֵל֙ מֵ/עֶקְר֣וֹן וְ/עַד גַּ֔ת וְ/אֶ֨ת גְּבוּלָ֔/ן הִצִּ֥יל יִשְׂרָאֵ֖ל מִ/יַּ֣ד פְּלִשְׁתִּ֑ים וַ/יְהִ֣י שָׁל֔וֹם בֵּ֥ין יִשְׂרָאֵ֖ל וּ/בֵ֥ין הָ/אֱמֹרִֽי־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/014.yaml
  text: And the cities that the Philistines had taken from Israel were restored to Israel[a], from Ekron to Gath; and Israel delivered its territory from the hand of the Philistines. And there was peace between Israel and the Amorites.
translation:
  language: hi
  text: और जो नगर पलिश्तियों ने इस्राएल से ले लिए थे, वे एक्रोन से लेकर गत तक फिर इस्राएल को मिल गए; और इस्राएल ने उनका इलाका पलिश्तियों के हाथ से छुड़ा लिया। इस्राएल और एमोरियों[a] के बीच शान्ति रही।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “कनानियों”; यदि यहाँ “एमोरी” देश के निवासियों के लिए व्यापक नाम के रूप में प्रयुक्त हुआ है।
    reason: एमोरी जातिनाम के सम्भव व्यापक अर्थ को बिना मुख्य पाठ में निर्णीत किए सुरक्षित रखना।
lexical_decisions:
- source_word: וַתָּשֹׁבְנָה
  choice: फिर ... मिल गए
  rationale: शוב का स्त्रीलिंग बहुवचन रूप नगरों के फिर इस्राएल के अधिकार में आने को बताता है। यह हिन्दी में स्वाभाविक है और अनावश्यक कर्मवाच्य से बचता है।
- source_word: הֶעָרִים
  choice: नगर
  rationale: ערים के लिए मानक और इस भू-राजनीतिक प्रसंग के अनुकूल शब्द।
- source_word: לָקְחוּ
  choice: ले लिए थे
  rationale: पलिश्तियों द्वारा नगरों को पहले अपने अधिकार में लेने की क्रिया को पूर्वकालिक रूप में व्यक्त करता है।
- source_word: מֵאֵת יִשְׂרָאֵל ... לְיִשְׂרָאֵל
  choice: इस्राएल से ... इस्राएल को
  rationale: मूल की पुनरुक्ति और राष्ट्रीय-भौगोलिक अर्थ दोनों बनाए रखता है।
- source_word: מֵעֶקְרוֹן וְעַד גַּת
  choice: एक्रोन से लेकर गत तक
  rationale: भौगोलिक विस्तार को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאֶת גְּבוּלָן
  choice: उनका इलाका
  rationale: स्त्रीलिंग बहुवचन प्रत्यय नगरों की ओर संकेत करता है; גבול यहाँ केवल सीमा-रेखा नहीं, उन नगरों से जुड़ा भूभाग भी दर्शाता है।
- source_word: הִצִּיל
  choice: छुड़ा लिया
  rationale: נצל के हिफ़ील रूप में शत्रु के अधिकार से बचा लेने या वापस छुड़ाने का सक्रिय भाव है।
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ से
  rationale: मूल इब्रानी मुहावरे को सुरक्षित रखता है; हिन्दी में भी यह शत्रु के अधिकार का बोध कराता है।
- source_word: וַיְהִי שָׁלוֹם
  choice: शान्ति रही
  rationale: शत्रुता के अभाव और स्थिर शांतिपूर्ण संबंध को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָאֱמֹרִי
  choice: एमोरियों
  rationale: मूल पाठ के विशिष्ट जातिनाम को मुख्य पाठ में बनाए रखता है; एकवचन सामूहिक संज्ञा को हिन्दी में स्वाभाविक बहुवचन से व्यक्त किया गया है।
theological_decisions:
- issue: पद के अंत में जातिनाम הָאֱמֹרִי
  choice: एमोरियों
  alternative: कनानियों
  rationale: इब्रानी पाठ विशेष रूप से ‘एमोरी’ कहता है, इसलिए मुख्य पाठ उसी जातिनाम को रखता है। सम्भव व्यापक भौगोलिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘नगर’, ‘इलाका’, ‘छुड़ा लिया’ और ‘शान्ति रही’ सामान्य पाठक के लिए स्पष्ट हैं, जबकि ‘हाथ से’ मूल इब्रानी की ठोस उपमा को बनाए रखता है।
