base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/008.yaml
  text: Then the sons of Israel said to Samuel[a], “Do not be silent for us from crying out to Yahweh our God, that he may save us from the hand of the Philistines.”
translation:
  language: hi
  text: तब इस्राएलियों ने शमूएल से कहा, “हमारी ओर से याहवे, हमारे परमेश्वर, को पुकारना बंद न करना[a], ताकि वह हमें पलिश्तियों के हाथ से बचाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “हमारी ओर से याहवे, हमारे परमेश्वर, को पुकारने से चुप न रहना।”'
    reason: मूल इब्रानी के ‘चुप रहना’ वाले बिंब और असामान्य वाक्य-विन्यास को सुरक्षित रखना।
lexical_decisions:
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर आधुनिक हिन्दी में पूरे समुदाय के लिए ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है।
- source_word: אַל תַּחֲרֵשׁ מִמֶּנּוּ מִזְּעֹק
  choice: हमारे लिए ... पुकारना बंद न करना
  rationale: חרשׁ का मूल बिंब चुप रहने का है, पर מן और זעק के साथ यहाँ आशय है कि शमूएल उनकी ओर से सहायता के लिए पुकारना न छोड़े। मुख्य पाठ स्वाभाविक हिन्दी में अर्थ देता है और शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: אֱלֹהֵינוּ
  choice: हमारे परमेश्वर
  rationale: सम्बन्धसूचक रूप और इस्राएल की वाचा-संबंधी अपील दोनों को सीधे व्यक्त करता है।
- source_word: וְיֹשִׁעֵנוּ
  choice: ताकि वह हमें ... बचाए
  rationale: यहाँ वाव सहित अपूर्ण क्रिया प्रार्थना के उद्देश्य अथवा अपेक्षित परिणाम को व्यक्त करती है।
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ से
  rationale: ‘हाथ से’ प्रभुत्व अथवा शक्ति से छुटकारे का इब्रानी मुहावरा है; हिन्दी में भी यह बिंब समझने योग्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: शमूएल की मध्यस्थ पुकार की निरंतरता
  choice: पुकारना बंद न करना
  alternative: पुकारने से चुप न रहना
  rationale: वाक्य का आशय यह है कि शमूएल इस्राएल की ओर से परमेश्वर से सहायता माँगना जारी रखे; फिर भी मूल का ‘चुप रहना’ वाला बिंब पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। अनुरोध में सम्मानसूचक बहुवचन के बजाय एकवचन आज्ञार्थक रखा गया है, क्योंकि इस्राएली शमूएल को सामूहिक रूप से संबोधित कर रहे हैं और मूल इब्रानी भी एकवचन है।
