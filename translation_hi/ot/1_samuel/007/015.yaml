lexical_decisions:
- source_word: וַיִּשְׁפֹּט
  choice: न्याय करता रहा
  rationale: שׁפט का क़ाल रूप न्याय करने के साथ-साथ न्यायी के रूप में शासन या अगुवाई करने का अर्थ भी दे सकता है। यहाँ अपूर्ण क्रिया और पूरे जीवन की समयावधि को हिन्दी में स्वाभाविक ढंग से व्यक्त करने के लिए ‘न्याय करता रहा’ चुना गया है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल का
  rationale: हिब्रू में इस्राएल प्रत्यक्ष कर्म है; हिन्दी में ‘न्याय करना’ के साथ संबंधकारक ‘का’ स्वाभाविक है।
- source_word: כֹּל יְמֵי חַיָּיו
  choice: जीवन भर
  rationale: शाब्दिक अर्थ ‘उसके जीवन के सब दिन’ है। ‘जीवन भर’ उसी संपूर्ण अवधि को आधुनिक, सहज और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शमूएल की भूमिका में न्यायिक और शासकीय अर्थ
  choice: मुख्य पाठ में ‘न्याय करता रहा’
  alternative: ‘इस्राएल पर शासन करता रहा’ अथवा ‘न्यायी के रूप में इस्राएल की अगुवाई करता रहा’
  rationale: ‘न्याय’ मूल धातु के न्यायिक और न्यायियों के काल से जुड़े अर्थ को बनाए रखता है; पादटिप्पणी उसके व्यापक शासकीय अर्थ को स्पष्ट करती है, बिना किसी एक अर्थ को अनावश्यक रूप से निर्णायक बनाए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, सहज और गरिमापूर्ण। ‘जीवन भर’ हिब्रू कालवाचक मुहावरे का स्वाभाविक हिन्दी रूप है, जबकि पादटिप्पणी שׁפט की वास्तविक अर्थ-व्याप्ति सुरक्षित रखती है।
