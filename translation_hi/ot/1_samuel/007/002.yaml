- source_word: וַיִּרְבּוּ הַיָּמִים
  choice: दिन बहुत बढ़ गए
  rationale: यह मूल के ‘दिन बहुत हो गए/बढ़ गए’ बिम्ब को बनाए रखता है; अधिक सहज विकल्प ‘बहुत दिन बीत गए’ पादटिप्पणी में दिया गया है।
- source_word: וַיִּהְיוּ עֶשְׂרִים שָׁנָה
  choice: वे बीस वर्ष हुए
  rationale: बहुवचन क्रिया को पहले आए ‘दिन’ से जोड़ते हुए अवधि के बीस वर्ष होने की मूल संरचना सुरक्षित रखी गई है।
- source_word: וַיִּנָּהוּ
  choice: विलाप करने लगा
  rationale: נהה शोक या विलाप व्यक्त करता है। सामूहिक कर्ता ‘सारा घराना’ के साथ एकवचन ‘लगा’ स्वाभाविक है और पश्चात्ताप को मूल से अधिक स्पष्ट नहीं बनाता।
- source_word: כָּל בֵּית יִשְׂרָאֵל
  choice: इस्राएल का सारा घराना
  rationale: ‘घराना’ मूल के सामूहिक और वाचागत ‘घर’ को केवल ‘सारा इस्राएल’ कहने की अपेक्षा अधिक निकटता से सुरक्षित रखता है।
- source_word: אַחֲרֵי יְהוָה
  choice: याहवे के पीछे
  rationale: אַחֲרֵי का मूल स्थानिक रूप ‘पीछे’ सुरक्षित रखा गया है, यद्यपि पूरे मुहावरे का आशय याहवे की ओर फिरना या उसके लिए तरसना भी हो सकता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम का हिन्दी लिप्यंतरण किया गया है; इसे ‘प्रभु’ जैसे पदनाम से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: וַיִּנָּהוּ ... אַחֲרֵי יְהוָה में इस्राएल की प्रतिक्रिया का आशय
  choice: ‘याहवे के पीछे विलाप’ की असामान्य लेकिन स्रोत-निकट अभिव्यक्ति रखी गई है, जो शोक और उसकी ओर मुड़ने—दोनों की सम्भावना खुली रखती है।
