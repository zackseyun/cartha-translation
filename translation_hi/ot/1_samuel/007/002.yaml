  rationale: सन्दर्भ पश्चात्ताप की दिशा सुझा सकता है, पर इस पद में पूर्ण पश्चात्ताप का स्पष्ट सूत्र नहीं है। इसलिए अनुवाद उस धार्मिक तनाव को निर्णायक रूप से हल नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्रोत-निकट शैली अपनाई गई है। ‘दिन बहुत बढ़ गए’ और ‘याहवे के पीछे विलाप’ जानबूझकर कुछ औपचारिक रखे गए हैं ताकि इब्रानी बिम्ब तथा अर्थगत अस्पष्टता बनी रहे; सहज अर्थ पादटिप्पणियों में दिए गए हैं।
