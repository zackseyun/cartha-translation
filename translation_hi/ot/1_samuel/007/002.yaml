base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/002.yaml
  text: From the day the ark remained at Kiriath-jearim[a], the days became many, and they were twenty years[b]; and all the house of Israel lamented after Yahweh.
translation:
  language: hi
  text: जिस दिन से सन्दूक किर्यत-यारीम में रहा, बहुत दिन बीत गए[a]—बीस वर्ष—और इस्राएल के सारे घराने ने याहवे के लिए विलाप किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दिन बहुत हो गए/बढ़ गए।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “याहवे के पीछे विलाप किया।” यह मुहावरा “याहवे के लिए तरसने” या “याहवे की ओर मुड़कर शोक करने” का भाव भी व्यक्त कर सकता है।
    reason: alternative_reading
