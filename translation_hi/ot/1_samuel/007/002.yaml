  choice: रखा रहा
  rationale: ישׁב का यह रूप सन्दूक के किसी स्थान पर लगातार बने रहने को दर्शाता है। ‘रखा रहा’ निर्जीव वस्तु के लिए स्वाभाविक हिन्दी है और ‘बैठा’ जैसी अतिशाब्दिक अभिव्यक्ति से बचता है।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: मूल में केवल ‘सन्दूक’ है; इस पद में ‘परमेश्वर का’ या ‘वाचा का’ जोड़ना मूल से अधिक स्पष्टता लाना होता।
- source_word: בְּקִרְיַת יְעָרִים
