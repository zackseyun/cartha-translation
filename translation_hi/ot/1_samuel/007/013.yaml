base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/013.yaml
  text: So the Philistines were subdued and did not again come into the territory of Israel[a]. And the hand of Yahweh was against the Philistines all the days of Samuel.
translation:
  language: hi
  text: इस प्रकार पलिश्ती अधीन कर दिए गए और फिर इस्राएल के क्षेत्र में नहीं आए। और यहोवा का हाथ[a] शमूएल के जीवन-भर पलिश्तियों के विरुद्ध रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यहोवा का हाथ” यहोवा की सक्रिय सामर्थ्य का इब्रानी मुहावरा है; यहाँ वह सामर्थ्य पलिश्तियों के विरुद्ध काम कर रही थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּכָּנְעוּ
  choice: दबा दिए गए
  rationale: निफ़अल रूप यहाँ पराजय के बाद अधीन कर दिए जाने की परिणामात्मक और कर्मवाच्य धारणा व्यक्त करता है; यह सैन्य-राजनीतिक संदर्भ में स्वाभाविक है।
- source_word: הַפְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जातीय नाम का प्रचलित आधुनिक हिन्दी रूप।
- source_word: וְלֹא יָסְפוּ עוֹד לָבוֹא
  choice: फिर ... नहीं आए
  rationale: יסף और עוד का संयुक्त प्रयोग किसी क्रिया के दोबारा न होने को दर्शाता है।
- source_word: בִּגְבוּל יִשְׂרָאֵל
  choice: इस्राएल के क्षेत्र में
  rationale: גְּבוּל का अर्थ सीमा-रेखा के साथ-साथ भू-क्षेत्र भी है; यहाँ भीतर आने के संदर्भ में 'क्षेत्र' अधिक स्वाभाविक है।
- source_word: וַתְּהִי יַד יְהוָה
  choice: यहोवा का हाथ ... रहा
  rationale: मूल इब्रानी रूपक को बनाए रखता है; यहाँ 'हाथ' यहोवा की सक्रिय सामर्थ्य और दबाव को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה का हिन्दी में स्थापित लिप्यंतरण।
- source_word: בַּפְּלִשְׁתִּים
  choice: पलिश्तियों के विरुद्ध
  rationale: संदर्भ में בְּ के साथ 'हाथ' का मुहावरा विरोधी अथवा दंडात्मक कार्रवाई बताता है।
- source_word: כֹּל יְמֵי שְׁמוּאֵל
  choice: शमूएल के जीवन-भर
  rationale: शाब्दिक 'शमूएल के सब दिनों' का सहज हिन्दी रूप, जो उसके जीवनकाल की अवधि व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि 'प्रभु' से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण 'यहोवा' रखा गया है।
- issue: '''यहोवा का हाथ पलिश्तियों पर था'' मुहावरे का भाव'
  choice: पलिश्तियों के विरुद्ध
  alternative: पलिश्तियों पर
  rationale: सैन्य पराजय के संदर्भ में यह मुहावरा स्पष्टतः यहोवा की विरोधी सक्रियता व्यक्त करता है; मुख्य पाठ में भाव स्पष्ट है, जबकि पादटिप्पणी मूल रूपक समझाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली। इब्रानी रूपक 'यहोवा का हाथ' सुरक्षित रखा गया है और उसका प्रसंगगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
