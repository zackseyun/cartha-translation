base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/011.yaml
  text: Then the men of Israel went out from Mizpah[a], pursued the Philistines[b], and struck them down as far as below Beth-car.
translation:
  language: hi
  text: तब इस्राएल के पुरुष मिस्पा से निकले, पलिश्तियों का पीछा किया और उन पर बेत-कार के नीचे तक प्रहार करते रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּצְאוּ
  choice: निकले
  rationale: יצא का सामान्य कथात्मक अर्थ ‘निकलना’ है; प्रसंग में यह मिस्पा से युद्ध के लिए आगे बढ़ने को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: इस्राएल के पुरुष
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुरुष’ है और यहाँ युद्ध में भाग लेने वाले पुरुषों का संकेत सुरक्षित रहता है।
- source_word: מִן הַמִּצְפָּה
  choice: मिस्पा से
  rationale: यह स्थान-नाम है; इसलिए इसका प्रचलित देवनागरी लिप्यंतरण रखा गया है।
- source_word: וַיִּרְדְּפוּ אֶת פְּלִשְׁתִּים
  choice: पलिश्तियों का पीछा किया
  rationale: רדף सैन्य प्रसंग में पीछा करने या खदेड़ते हुए पीछे जाने को दर्शाता है।
- source_word: וַיַּכּוּם
  choice: उन्हें मारते हुए
  rationale: נכה युद्ध में प्रहार करने, मार गिराने या पराजित करने का अर्थ दे सकता है। ‘मारते हुए’ पीछा जारी रहने और युद्धात्मक प्रहार दोनों को व्यक्त करता है, बिना यह दावा किए कि हर व्यक्ति मारा गया।
- source_word: עַד מִתַּחַת לְבֵית כָּר
  choice: बेत-कार के नीचे तक पहुँचे
  rationale: עַד सीमा और מִתַּחַת स्थलाकृतिक रूप से नीचे की जगह बताते हैं। हिन्दी में ‘नीचे तक पहुँचे’ पीछा और प्रहार की भौगोलिक सीमा स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। स्थान-नाम ‘मिस्पा’ और ‘बेत-कार’ तथा जाति-नाम ‘पलिश्ती’ के प्रचलित हिन्दी बाइबलीय रूप अपनाए गए हैं। मूल पाठ की सैन्य क्रियाओं को स्पष्ट रखा गया है, पर נכה को अनावश्यक रूप से केवल ‘हत्या करना’ नहीं बनाया गया।
