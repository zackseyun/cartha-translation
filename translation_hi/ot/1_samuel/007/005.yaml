  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל קִבְצ֥וּ אֶת כָּל יִשְׂרָאֵ֖ל הַ/מִּצְפָּ֑תָ/ה וְ/אֶתְפַּלֵּ֥ל בַּעַדְ/כֶ֖ם אֶל יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/007/005.yaml
  text: Then Samuel said[a], “Gather all Israel to Mizpah, and I will pray to Yahweh on your behalf.”
translation:
  language: hi
  text: तब शमूएल ने कहा, “सारे इस्राएल को मिस्पा में इकट्ठा करो, और मैं तुम्हारी ओर से याहवे से प्रार्थना करूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इसके अनुक्रमिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: इस इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी रूप।
- source_word: קִבְצוּ
  choice: इकट्ठा करो
  rationale: यह बहुवचन आज्ञार्थक क्रिया है; लोगों को एक स्थान पर एकत्र करने के आह्वान के लिए यह सहज और स्पष्ट हिन्दी है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल को
  rationale: इस्राएल के संपूर्ण समुदाय का सामूहिक अर्थ बनाए रखता है।
- source_word: הַמִּצְפָּתָה
  choice: मिस्पा में
  rationale: इब्रानी दिशासूचक प्रत्यय मिस्पा की ओर जाने का भाव देता है; हिन्दी में ‘मिस्पा में इकट्ठा करो’ गंतव्य और सभा-स्थान दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאֶתְפַּלֵּל
  choice: और मैं ... प्रार्थना करूँगा
  rationale: आज्ञा के बाद प्रथम पुरुष की आगामी अभिप्रेत क्रिया को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בַּעַדְכֶם
  choice: तुम्हारी ओर से
  rationale: यह चयन केवल ‘तुम्हारे लिए’ कहने की अपेक्षा मध्यस्थतापूर्ण प्रार्थना का भाव अधिक स्पष्ट रखता है।
- source_word: אֶל יְהוָה
  choice: याहवे से
  rationale: हिन्दी में ‘से प्रार्थना करना’ स्वाभाविक प्रयोग है; परमेश्वर के विशिष्ट इब्रानी नाम יהוה को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरीय विशिष्ट नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और नाम को किसी उपाधि में बदलकर मूल की विशिष्टता नहीं मिटाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सारे इस्राएल’ राष्ट्रीय समुदाय का सामूहिक भाव देता है, और ‘तुम्हारी ओर से’ शमूएल की मध्यस्थ प्रार्थना को स्पष्ट करता है।
