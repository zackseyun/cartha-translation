reference: 1 Samuel 15:23
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֤י חַטַּאת קֶ֨סֶם֙ מֶ֔רִי וְ/אָ֥וֶן וּ/תְרָפִ֖ים הַפְצַ֑ר יַ֗עַן מָאַ֨סְתָּ֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֖ מִ/מֶּֽלֶךְ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/023.yaml
  text: For rebellion is like the sin of divination[a], and stubbornness is like wickedness and household idols. Because you have rejected the word of Yahweh[c][b], he has also rejected you from being king.
translation:
  language: hi
  text: क्योंकि विद्रोह भविष्य-विद्या के पाप के समान है[a], और हठ दुष्टता और घरेलू उपासना-मूर्तियों के समान है[b]। चूँकि तुमने याहवे के वचन को ठुकरा दिया है, इसलिए उसने भी तुम्हें राजा के रूप में ठुकरा दिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “टोना-टोटका करने का पाप।” इब्रानी शब्द קֶסֶם निषिद्ध साधनों से भविष्य या छिपी हुई बातों का ज्ञान पाने के प्रयास को व्यापक रूप से दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी תְּרָפִים (तराफीम): घर में रखी जाने वाली उपासना-मूर्तियाँ या घरेलू पंथ-मूर्तियाँ।'
    reason: lexical_alternative
  - marker: c
    text: या “उसने भी तुम्हें राजपद से हटा दिया है।”
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का आधार बताता है; आगे आने वाले יַעַן के अधिक विशिष्ट कारणवाचक खंड से भेद रखते हुए हिन्दी में स्वाभाविक संबंध बनाता है।
- source_word: חַטַּאת קֶסֶם
  choice: शकुन-विचार का पाप
  rationale: קֶסֶם निषिद्ध साधनों से भविष्य या छिपी बात जानने की व्यापक प्रथा को सूचित करता है; ‘शकुन-विचार’ आधुनिक हिन्दी में ‘जादू-टोना’ से अधिक सटीक है।
- source_word: מֶרִי
  choice: विद्रोह करना
  rationale: यह अधिकार के विरुद्ध जानबूझकर अवज्ञा को व्यक्त करता है; प्रसंग में शाऊल द्वारा यहोवा की आज्ञा न मानना अभिप्रेत है।
- source_word: וְאָוֶן
  choice: दुष्टता
  rationale: תְרָפִים के साथ इस समानांतर प्रयोग में यह नैतिक बुराई का बोध देता है, केवल दुःख या व्यर्थता का नहीं।
- source_word: וּתְרָפִים
  choice: कुलदेव-मूर्तियाँ
  rationale: תְרָפִים घरेलू या कुल-आधारित उपासना में प्रयुक्त पंथ-मूर्तियाँ थीं; यह चयन सामान्य पाठक के लिए वस्तु का स्वरूप स्पष्ट करता है।
- source_word: הַפְצַר
  choice: हठ करना
  rationale: यह अड़ियल आग्रह या न झुकने की मनोवृत्ति बताता है; क्रियात्मक हिन्दी प्रसंग में सहज और प्रभावशाली है।
- source_word: יַעַן
  choice: चूँकि
  rationale: यह शाऊल पर आए न्याय का स्पष्ट कारण प्रस्तुत करता है और आरम्भिक כִּי से हिन्दी में उपयोगी शैलीगत भेद रखता है।
- source_word: מָאַסְתָּ אֶת דְּבַר יְהוָה
  choice: तुमने यहोवा के वचन को ठुकरा दिया है
  rationale: ‘ठुकराना’ מָאַס के अस्वीकार और तिरस्कार, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है तथा अगले खंड में उसी क्रिया की पुनरावृत्ति सम्भव बनाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप द्वारा प्रस्तुत किया गया है।
- source_word: וַיִּמְאָסְךָ מִמֶּלֶךְ
  choice: उसने भी तुम्हें राजा बने रहने से ठुकरा दिया है
  rationale: मूल की מָאַס पुनरावृत्ति बनाए रखी गई है और מִמֶּלֶךְ को राजपद से हटाए जाने के अर्थ में स्पष्ट किया गया है।
theological_decisions:
- issue: पहले दो खंडों की तुलना-संरचना
  choice: विद्रोह को शकुन-विचार के पाप के समान और हठ को दुष्टता तथा कुलदेव-मूर्तियों के समान बताया गया है।
  alternative: विद्रोह स्वयं शकुन-विचार का पाप है, और हठ स्वयं दुष्टता तथा कुलदेव-मूर्तियाँ है।
  rationale: इब्रानी में ‘समान’ स्पष्ट रूप से नहीं है, पर समानांतर काव्य-संरचना तुलनात्मक बल का समर्थन करती है। हिन्दी में इसे व्यक्त करने से अर्थ स्वाभाविक रहता है, जबकि शमूएल द्वारा स्थापित कठोर नैतिक समतुल्यता भी बनी रहती है।
- issue: מִמֶּלֶךְ में राजत्व से अस्वीकृति का स्वरूप
  choice: राजा बने रहने से ठुकराया जाना
  alternative: राजा के रूप में ठुकराया जाना
  rationale: מן राजपद से हटाए जाने या उससे वंचित किए जाने का भाव दे सकता है। मुख्य पाठ में निरंतर राजत्व खोने का भाव स्पष्ट किया गया है, जबकि संक्षिप्त विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘शकुन-विचार’ निषिद्ध भविष्य-कथन की व्यापक धारणा व्यक्त करता है; ‘कुलदेव-मूर्तियाँ’ तकनीकी वस्तु को बिना केवल लिप्यंतरण पर निर्भर हुए समझाता है। क्रिया ‘ठुकराना’ की पुनरावृत्ति मूल इब्रानी की शब्दगत और न्यायात्मक समरूपता बनाए रखती है।
