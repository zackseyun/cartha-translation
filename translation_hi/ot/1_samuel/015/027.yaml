  yaml_path: translation/ot/1_samuel/015/027.yaml
  text: As Samuel turned to go[a], he seized the edge of his robe, and it tore.
translation:
  language: hi
  text: जब शमूएल जाने के लिए मुड़ा, तब उसने उसके चोगे का किनारा[a] पकड़ लिया, और वह फट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके चोगे का कोना” अथवा “उसके चोगे का छोर।” इब्रानी शब्द वस्त्र के अंतिम भाग को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: मुड़ा
  rationale: यह क्रिया यहाँ प्रस्थान करने के लिए मुड़ने की क्रिया बताती है; अगले पदबंध से उद्देश्य स्पष्ट हो जाता है।
- source_word: לָלֶכֶת
  choice: जाने के लिए
  rationale: इनफिनिटिव शमूएल के चले जाने के इरादे को व्यक्त करता है; यह सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַיַּחֲזֵק
  choice: पकड़ लिया
  rationale: हिफ़ील रूप दृढ़ता से थामने या पकड़ लेने का अर्थ देता है; हिन्दी में यह आकस्मिक क्रिया को सहज ढंग से व्यक्त करता है।
- source_word: בִּכְנַף
  choice: किनारा
  rationale: כָּנָף वस्त्र के छोर, कोने या किनारे को सूचित कर सकता है। 'किनारा' अर्थ की व्यापकता बनाए रखता है।
- source_word: מְעִילוֹ
  choice: उसके चोगे
  rationale: מְעִיל एक बाहरी वस्त्र है। 'चोगा' आधुनिक पाठक के लिए स्पष्ट है। सर्वनाम मूल इब्रानी के अनुसार शमूएल के चोगे की ओर संकेत करता है।
- source_word: וַיִּקָּרַע
  choice: और वह फट गया
  rationale: निफ़अल रूप अकर्मक/कर्मवाच्य घटना बताता है। 'वह' निकटवर्ती वस्त्र के किनारे की ओर संकेत करता है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
