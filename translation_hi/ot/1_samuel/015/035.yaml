source:
  edition: WLC
  text: וְ/לֹא יָסַ֨ף שְׁמוּאֵ֜ל לִ/רְא֤וֹת אֶת שָׁאוּל֙ עַד י֣וֹם מוֹת֔/וֹ כִּֽי הִתְאַבֵּ֥ל שְׁמוּאֵ֖ל אֶל שָׁא֑וּל וַ/יהוָ֣ה נִחָ֔ם כִּֽי הִמְלִ֥יךְ אֶת שָׁא֖וּל עַל יִשְׂרָאֵֽל־־־־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/035.yaml
  text: And Samuel did not see Saul again until the day of his death[a], for Samuel mourned over Saul. And Yahweh regretted that he had made Saul king over Israel.
translation:
  language: hi
  text: शमूएल ने शाऊल को अपने मरने के दिन तक फिर कभी नहीं देखा, क्योंकि शमूएल शाऊल के लिए शोक करता था। और याहवे को इस बात का पछतावा हुआ[a] कि उसने शाऊल को इस्राएल का राजा बनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी क्रिया का अर्थ प्रसंग के अनुसार ‘खेद हुआ’ या ‘अपना इरादा बदला’ भी हो सकता है; यहाँ यह शाऊल को राजा बनाने पर याहवे के गहरे खेद को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָסַף ... לִרְאוֹת
  choice: फिर ... कभी नहीं देखा
  rationale: निषेध के साथ यह इब्रानी मुहावरा किसी काम को दोबारा न करने का भाव देता है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: לִרְאוֹת אֶת שָׁאוּל
  choice: शाऊल को ... देखा
  rationale: ראה का मूल अर्थ ‘देखना’ है। प्रसंग में व्यक्तिगत भेंट का संकेत है, पर अनुवाद मूल क्रिया की व्यापकता बनाए रखता है।
- source_word: עַד יוֹם מוֹתוֹ
  choice: उसकी मृत्यु के दिन तक
  rationale: सर्वनाम का निकटतम और प्रसंगानुकूल संदर्भ शाऊल है; वाक्यांश की गंभीर शैली भी बनी रहती है।
- source_word: הִתְאַבֵּל ... אֶל שָׁאוּל
  choice: शाऊल के लिए शोक करता रहा
  rationale: क्रिया गहरा शोक व्यक्त करती है और אֶל यहाँ शोक के विषय को बताता है। ‘करता रहा’ उस निरंतर भाव को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: נִחָם
  choice: पछतावा हुआ
  rationale: राजा बनाने वाली उपवाक्य-रचना के साथ यह चयन ईश्वरीय खेद/दुःख का प्रसंगानुकूल भाव देता है और मूल की धर्मवैचारिक तनावपूर्ण भाषा को नरम नहीं करता।
- source_word: הִמְלִיךְ
  choice: राजा बनाया था
  rationale: हिफ़ील रूप का सीधा अर्थ किसी को राजा बनाना है; पूर्वकालिक संबंध के लिए ‘था’ रखा गया है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: शाब्दिक रूप ‘इस्राएल पर राजा’ है, किंतु ‘इस्राएल का राजा’ आधुनिक हिंदी में राजकीय अधिकार का स्वाभाविक समतुल्य है।
theological_decisions:
- issue: नִחָם में परमेश्वर के लिए मानवीय भाव-सदृश भाषा
  choice: पछतावा हुआ
  alternative: दुःख हुआ; अपना निर्णय बदला
  rationale: मूल पाठ याहवे के खेद को स्पष्ट रूप से व्यक्त करता है। ‘पछतावा हुआ’ उस कथन और उसके धर्मवैचारिक तनाव को बनाए रखता है; अनुवाद इसे केवल प्रशासनिक निर्णय-परिवर्तन बनाकर नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ में मूल व्यक्तिगत नाम सुरक्षित है। पदचिह्न [a] को उसी विवादित शब्द ‘पछतावा’ के साथ रखा गया है जिससे उसका संबंध है।
