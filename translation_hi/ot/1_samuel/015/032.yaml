base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/032.yaml
  text: Then Samuel said[a], “Bring Agag king of Amalek to me.” And Agag came to him trembling, and Agag said, “Surely the bitterness of death has turned aside.”
translation:
  language: hi
  text: तब शमूएल ने कहा, “अमालेक के राजा अगाग को मेरे पास लाओ।” अगाग उसके पास आया[a]। अगाग ने कहा, “निश्चय ही मृत्यु की कड़वाहट टल गई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द מַעֲדַנֹּת का सटीक अर्थ अनिश्चित है। इसका अनुवाद “नज़ाकत से,” “आत्मविश्वास से” या “काँपते हुए” किया गया है; एक भिन्न समझ के अनुसार, “बेड़ियों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּישׁוּ
  choice: मेरे पास लाओ
  rationale: नגשׁ के हिफ़ील बहुवचन आज्ञार्थक का भाव सेवकों को अगाग को शमूएल के सामने लाने की आज्ञा देना है। ‘मेरे पास लाओ’ आधुनिक हिन्दी में स्वाभाविक और निर्देशात्मक है।
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: अमालेक के राजा अगाग
  rationale: सम्बन्धसूचक इब्रानी पदबंध अगाग के राजकीय पद और अमालेक पर उसके शासन को बताता है; हिन्दी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: וַיֵּלֶךְ אֵלָיו
  choice: उसके पास आया
  rationale: क्रिया का मूल अर्थ ‘गया’ है, पर शमूएल को केंद्र बनाकर पिछले ‘मेरे पास’ के अनुरूप हिन्दी में ‘उसके पास आया’ कथानक को स्वाभाविक रखता है।
- source_word: מַעֲדַנֹּת
  choice: काँपता हुआ
  rationale: यह दुर्लभ इब्रानी रूप अनिश्चित है। प्राचीन व्याख्यात्मक परंपरा में भय से काँपने का अर्थ मिलता है, जो प्रसंग में सहज है; अन्य सम्भावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: אָכֵן
  choice: निश्चय ही
  rationale: यह अगाग के दृढ़ निष्कर्ष अथवा आश्वस्त कथन को सूचित करता है।
- source_word: סָר
  choice: टल गई है
  rationale: סור के पूर्ण रूप का अर्थ हट जाना या दूर हो जाना है। खतरे के लिए ‘टल गई है’ हिन्दी का स्वाभाविक रूप है और पूर्ण क्रिया का भाव बनाए रखता है।
- source_word: מַר הַמָּוֶת
  choice: मृत्यु की कड़वाहट
  rationale: यह मृत्यु से जुड़ी कटु पीड़ा या उसके भय को व्यक्त करता है। शाब्दिक रूप से निकट यह अभिव्यक्ति मूल रूपक को बनाए रखती है।
