base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/003.yaml
  text: Now go and strike Amalek[a], and devote to destruction all that belongs to him. Do not spare him, but put to death from man to woman, from child to nursing infant, from ox to sheep[b], from camel to donkey.
translation:
  language: hi
  text: अब जा और अमालेक[a] पर आक्रमण कर, और जो कुछ उसका है, उसे सब विनाश के लिए समर्पित कर दे[b]। उस पर दया न करना, बल्कि पुरुष से लेकर स्त्री तक, बच्चे से लेकर दूध-पीते शिशु तक, बैल से लेकर भेड़-बकरी तक, और ऊँट से लेकर गधे तक—सबको मार डालना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अमालेक” और पूरे पद में उसके लिए एकवचन सर्वनाम हैं; यहाँ यह अमालेकी लोगों के लिए एक सामूहिक इकाई के रूप में प्रयुक्त है।
    reason: corporate_singular
  - marker: b
    text: या “पूरी तरह नष्ट कर दे” अथवा “प्रतिबंध के अधीन कर दे।” इब्रानी क्रिया का अर्थ किसी को ईश्वरीय न्याय के अंतर्गत अपरिवर्तनीय रूप से विनाश के लिए समर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַתָּה לֵךְ
  choice: अब जा
  rationale: काल-सूचक अव्यय और सीधे आदेश की संक्षिप्तता बनाए रखता है।
- source_word: וְהִכִּיתָה אֶת־עֲמָלֵק
  choice: अमालेक पर आक्रमण कर
  rationale: נכה का युद्ध-संदर्भ में स्वाभाविक हिन्दी अर्थ देता है; ‘मार’ अगले मृत्यु-आदेश के साथ अनावश्यक रूप से घुल जाता।
- source_word: וְהַחֲרַמְתֶּם
  choice: विनाश के लिए अर्पित कर दे
  rationale: חרם के साधारण नाश से अधिक, ईश्वरीय न्याय के अधीन अपरिवर्तनीय रूप से विनाश को समर्पित करने के धार्मिक अर्थ को बचाता है।
- source_word: כָּל־אֲשֶׁר לוֹ
  choice: जो कुछ उसका है, उस सबको
  rationale: अमालेक को सामूहिक एकवचन मानते हुए उसकी समस्त संपत्ति और उससे संबंधित सब कुछ समेटता है।
- source_word: וְלֹא תַחְמֹל עָלָיו
  choice: उस पर दया करके उसे मत छोड़ना
  rationale: חמל में दया करने और फलतः छोड़ देने, दोनों का भाव है; हिन्दी वाक्य दोनों आयाम स्पष्ट करता है।
- source_word: וְהֵמַתָּה
  choice: मार डालना
  rationale: हिफ़ील रूप ‘मृत्यु देना’ का सीधा, गंभीर और आधुनिक हिन्दी रूप है।
- source_word: מֵאִישׁ עַד־אִשָּׁה
  choice: पुरुष से लेकर स्त्री तक
  rationale: מִן...עַד की समग्रतासूचक रचना और स्पष्ट नर-नारी युग्म को बनाए रखता है।
- source_word: מֵעֹלֵל וְעַד־יוֹנֵק
  choice: बच्चे से लेकर दूध-पीते शिशु तक
  rationale: עולל और יונק के आयु-भेद को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִשּׁוֹר וְעַד־שֶׂה
  choice: बैल से लेकर भेड़-बकरी तक
  rationale: שׂה भेड़ या बकरी, दोनों प्रकार के छोटे पालतू पशु को सूचित कर सकता है; संयुक्त पद वास्तविक शाब्दिक विस्तार बचाता है।
- source_word: מִגָּמָל וְעַד־חֲמוֹר
  choice: ऊँट से लेकर गधे तक
  rationale: मूल की अंतिम समग्रतासूचक पशु-जोड़ी को निकटता से रखता है।
theological_decisions:
- issue: חרם की युद्ध और न्याय संबंधी भाषा
  choice: विनाश के लिए अर्पित कर दे
  alternative: पूरी तरह नष्ट कर दे; प्रतिबंध के अधीन कर दे
  rationale: चुना हुआ रूप क्रिया के धार्मिक-न्यायिक भार को रखता है और उसे केवल सामान्य सैनिक विनाश तक सीमित नहीं करता।
- issue: अमालेक का सामूहिक एकवचन
  choice: अमालेक ... उसका ... उस पर ... उसे
  alternative: अमालेकियों ... उनका ... उन पर ... उन्हें
  rationale: इब्रानी में जाति/समुदाय को एक सामूहिक इकाई मानकर एकवचन प्रयुक्त है; हिन्दी में इसे समझने योग्य रूप में सुरक्षित रखा गया है।
- issue: मानवीय युग्म और समग्रता
  choice: पुरुष से लेकर स्त्री तक
  alternative: पुरुष और स्त्री; सभी लोग
  rationale: मूल के स्पष्ट लैंगिक युग्म तथा מִן...עַד द्वारा व्यक्त पूर्ण विस्तार को बिना निरपेक्ष किए बनाए रखता है।
translation_notes:
  register: आदेशात्मक, गंभीर और गरिमापूर्ण आधुनिक मानक हिन्दी। मूल के सामूहिक एकवचन तथा चार बार आने वाली ‘से लेकर ... तक’ समग्रतासूचक रचना को सुरक्षित रखा गया है। ‘भेड़-बकरी’ שֶׂה की वास्तविक अर्थ-सीमा को ‘भेड़’ मात्र से अधिक ठीक व्यक्त करता है।
