  text: וַ/יֹּ֤אמֶר אֵלָי/ו֙ שְׁמוּאֵ֔ל קָרַ֨ע יְהוָ֜ה אֶֽת מַמְלְכ֧וּת יִשְׂרָאֵ֛ל מֵ/עָלֶ֖י/ךָ הַ/יּ֑וֹם וּ/נְתָנָ֕/הּ לְ/רֵעֲ/ךָ֖ הַ/טּ֥וֹב מִמֶּֽ/ךָּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/028.yaml
  text: And Samuel said to him[a], “Yahweh has torn the kingdom of Israel away from you today and has given it to your neighbor[b], who is better than you.”
translation:
  language: hi
  text: तब शमूएल ने उससे कहा, “याहवे ने आज इस्राएल का राज्य तुमसे फाड़कर छीन लिया है और उसे तुम्हारे एक साथी[a] को दे दिया है, जो तुमसे बेहतर[b] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे पड़ोसी” अथवा “तुम्हारे संगी”।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “तुमसे बेहतर” है; यह उस व्यक्ति का वर्णन करता है जिसे राज्य दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר אֵלָיו שְׁמוּאֵל
  choice: तब शमूएल ने उससे कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ स्वाभाविक रूप से इस प्रगति को व्यक्त करता है।
- source_word: קָרַע
  choice: फाड़कर छीन लिया है
  rationale: ‘फाड़ना’ मूल बिंब और पिछले पद में वस्त्र फटने की प्रतिध्वनि को बनाए रखता है, जबकि ‘छीन लिया’ शाऊल से राजसत्ता हटाए जाने का आशय स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: हिब्रू के व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: מַמְלְכוּת יִשְׂרָאֵל
  choice: इस्राएल का राज्य
  rationale: מַמְלְכוּת का अर्थ राज्य अथवा राजत्व हो सकता है; यहाँ दूसरे व्यक्ति को दिए जाने वाली राजकीय सत्ता को सामान्य और सहज हिन्दी में ‘इस्राएल का राज्य’ कहा गया है।
- source_word: מֵעָלֶיךָ
  choice: तुमसे
  rationale: यह शाऊल के अधिकार से राज्य हटाए जाने को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: निर्णय की तात्कालिकता को आधुनिक हिन्दी में सीधे बनाए रखता है।
- source_word: וּנְתָנָהּ
  choice: और उसे ... दे दिया है
  rationale: हिब्रू पूर्ण रूप इस न्यायादेश को निर्णायक रूप से संपन्न ठहराता है; हिन्दी पूर्ण वर्तमान उस निश्चितता को बनाए रखता है, भले उसका ऐतिहासिक क्रियान्वयन बाद में पूरा हो।
- source_word: לְרֵעֲךָ
  choice: तुम्हारे एक साथी
  rationale: רֵעַ का अर्थ पड़ोसी, साथी या सहचर हो सकता है। प्रसंग में यह शाऊल से संबंधित किसी दूसरे व्यक्ति की ओर संकेत करता है; ‘एक साथी’ अनिश्चितता को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: הַטּוֹב מִמֶּךָּ
  choice: जो तुमसे बेहतर है
  rationale: विशेषण और तुलनात्मक מן का सीधा अर्थ ‘तुमसे बेहतर’ है; ‘जो’ स्पष्ट करता है कि यह वर्णन उस व्यक्ति का है जिसे राज्य दिया गया है।
theological_decisions:
- issue: दिव्य न्याय को पूर्ण हुआ मानकर व्यक्त करना या भविष्य की घटना के रूप में
  choice: 'पूर्ण/निर्णीत: ‘छीन लिया है ... दे दिया है’'
  alternative: 'भविष्याभिमुख: ‘छीन लेगा ... दे देगा’'
  rationale: हिब्रू के पूर्ण क्रियारूप भविष्य में पूरी तरह प्रकट होने वाले परिणाम के बावजूद परमेश्वर के निर्णय को निश्चित और निर्णायक कार्य के रूप में प्रस्तुत करते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘फाड़कर’ निकट प्रसंग के प्रतीकात्मक बिंब को सुरक्षित रखता है; ‘बेहतर’ नैतिक योग्यता से अधिक कुछ तय किए बिना हिब्रू की व्यापक तुलना को बनाए रखता है।
