base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/013.yaml
  text: Then Samuel came to Saul[a], and Saul said to him, “Blessed are you to Yahweh[b]; I have carried out the word of Yahweh.”
translation:
  language: hi
  text: तब शमूएल शाऊल के पास आया, और शाऊल ने उससे कहा, “याहवे की ओर से तुम धन्य हो![a] मैंने याहवे के वचन को पूरा किया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम याहवे के द्वारा आशीषित हो।”
    reason: lexical_alternative
  - marker: b
    text: या “मैंने याहवे के वचन को कार्यान्वित किया है” अथवा “उसका पालन किया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का यह कथात्मक रूप शाऊल के पास पहुँचने की सामान्य गति बताता है; ‘आया’ स्वाभाविक हिन्दी है।
- source_word: בָּרוּךְ אַתָּה לַיהוָה
  choice: याहवे तुम्हें आशीष दे!
  rationale: यह अभिवादन के रूप में प्रयुक्त आशीर्वाद-सूत्र है। शाब्दिक ‘तुम याहवे के लिए धन्य हो’ आधुनिक हिन्दी में भ्रामक होगा; इच्छासूचक रूप आशय को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הֲקִימֹתִי
  choice: मैंने ... पूरा किया है
  rationale: קום के हिफ़ील रूप का यहाँ अर्थ वचन को प्रभावी करना अथवा उसका पालन पूरा करना है; यह अनुवाद शाऊल के दावे को स्वाभाविक हिन्दी में रखता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: דָּבָר यहाँ आदेश के संदर्भ में है, फिर भी ‘वचन’ मूल अभिव्यक्ति की व्यापकता और धार्मिक अनुगूँज सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम प्रत्यक्ष रूप से आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है।
- issue: शाऊल के आज्ञापालन के दावे का स्वर
  choice: मैंने याहवे का वचन पूरा किया है
  alternative: मैंने याहवे की आज्ञा मानी है
  rationale: ‘वचन पूरा किया’ मूल דְּבַר और הֲקִימֹתִי दोनों को निकटता से रखता है और शाऊल के दावे को सत्य ठहराए बिना केवल उद्धृत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। अभिवादन को स्वाभाविक इच्छासूचक वाक्य में दिया गया है; शाऊल के दावे की कथात्मक विडंबना को बिना व्याख्या जोड़े सुरक्षित रखा गया है।
