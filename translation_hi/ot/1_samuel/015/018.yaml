base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/018.yaml
  text: And Yahweh sent you on a mission and said[a], ‘Go and devote the sinners, the Amalekites, to destruction[b], and fight against them until they are consumed.’
translation:
  language: hi
  text: और यहोवा ने तुझे एक अभियान पर भेजा और कहा, “जा, उन पापियों—अमालेकियों—को विनाश के लिए समर्पित कर दे[a], और उनके विरुद्ध युद्ध कर, जब तक तू उनका अन्त न कर दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी तरह नष्ट कर दे”; इब्रानी क्रिया का अर्थ किसी को प्रतिबंध के अधीन विनाश के लिए समर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלָחֲךָ יְהוָה בְּדָרֶךְ
  choice: यहोवा ने तुझे एक काम पर भेजकर
  rationale: שלח का सीधा अर्थ ‘भेजना’ है; בְּדָרֶךְ यहाँ केवल मार्ग या यात्रा नहीं, सौंपे गए अभियान/कार्य की ओर संकेत करता है। ‘एक काम पर’ आधुनिक हिन्दी में स्वाभाविक है और अर्थ को अनावश्यक सैन्य तकनीकी भाषा से नहीं बाँधता।
- source_word: לֵךְ
  choice: जा
  rationale: एकवचन पुल्लिंग आज्ञार्थक का सीधा और प्रसंगानुकूल हिन्दी रूप।
- source_word: וְהַחֲרַמְתָּה
  choice: विनाश के लिए अर्पित कर दे
  rationale: हिफ़ील חרם किसी व्यक्ति या वस्तु को प्रतिबंध के अधीन विनाश के लिए समर्पित करने का तकनीकी भाव रखता है। यह अनुवाद समर्पण और विनाश, दोनों पहलुओं को बनाए रखता है।
- source_word: הַחַטָּאִים אֶת עֲמָלֵק
  choice: उन पापियों—अमालेकियों—को
  rationale: इब्रानी में ‘पापियों’ के बाद ‘अमालेक’ समानाधिकरण में उनकी पहचान करता है। हिन्दी में डैश इस संबंध को स्पष्ट रखते हैं; सामूहिक ‘अमालेक’ को लोगों के अर्थ में स्वाभाविक रूप से ‘अमालेकियों’ कहा गया है।
- source_word: וְנִלְחַמְתָּ בוֹ
  choice: उनके विरुद्ध ... युद्ध कर
  rationale: בוֹ व्याकरणतः एकवचन है, पर सामूहिक ‘अमालेक’ को संदर्भित करता है; हिन्दी में जनसमूह के लिए बहुवचन ‘उनके’ स्वाभाविक है।
- source_word: עַד כַּלּוֹתָם אֹתָם
  choice: जब तक वे मिट न जाएँ
  rationale: כלה यहाँ अंत हो जाने अथवा पूर्णतः समाप्त हो जाने का भाव देता है। यह रूप स्रोत की परिणाम-केंद्रित अभिव्यक्ति को रखता है और पिछले חרם का अनावश्यक शब्दशः दोहराव नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और इसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है; ‘याहवे’ अधिक संभावित विद्वत्तापरक उच्चारण है।
- issue: חרם में समर्पण और विनाश का संबंध
  choice: विनाश के लिए अर्पित कर दे
  alternative: पूरी तरह नष्ट कर दे
  rationale: चुना गया रूप केवल सैन्य संहार नहीं कहता, बल्कि प्रतिबंध के अधीन विनाश के लिए समर्पित करने की धार्मिक-तकनीकी धारणा भी सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण हिन्दी; शमूएल का शाऊल से सीधा एकवचन संबोधन बनाए रखने के लिए ‘तुझे/जा/कर’ प्रयुक्त हैं। समानाधिकरण को डैश से दिखाया गया है, और हिंसक आदेश की तीव्रता को नरम नहीं किया गया।
