  text: Moreover[a], the Glory of Israel will not lie, nor will he relent, for he is not a man[b], that he should relent.
translation:
  language: hi
  text: और इस्राएल की महिमा[a] न तो झूठ बोलेगा, न अपना निर्णय बदलेगा[b], क्योंकि वह मनुष्य नहीं है कि अपना निर्णय बदले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल का सनातन,” “इस्राएल का सामर्थ्य,” अथवा “इस्राएल की विजय।” इब्रानी उपाधि का अर्थ-क्षेत्र व्यापक है।
    reason: lexical_alternative
  - marker: b
    text: या “न अपना मन बदलेगा,” “न पछताएगा,” अथवा “न अपने किए पर खेद करेगा।” इसी इब्रानी क्रिया का प्रयोग वाक्य के अन्त में फिर हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: और
  rationale: संदर्भ में यह पिछले कथन से एक अतिरिक्त, बलपूर्ण बात जोड़ता है; आधुनिक हिन्दी में ‘और’ सहज है।
- source_word: נֵצַח יִשְׂרָאֵל
  choice: इस्राएल की महिमा
  rationale: נֵצַח का अर्थ-क्षेत्र महिमा, स्थायित्व, सामर्थ्य और विजय तक फैला है। ‘महिमा’ यहाँ गरिमापूर्ण ईश्वरीय उपाधि को बनाए रखती है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: יְשַׁקֵּר
  choice: झूठ बोलेगी
  rationale: पिएल रूप का सीधा अर्थ ‘झूठ बोलना’ या ‘मिथ्या ठहरना’ है। स्त्रीलिंग क्रिया उपाधि ‘महिमा’ के हिन्दी व्याकरण के अनुरूप है।
- source_word: וְלֹא יִנָּחֵם
  choice: न अपना निर्णय बदलेगी
  rationale: निफ़ाल נחם यहाँ किए हुए न्यायिक निर्णय से फिरने या पछताने का भाव रखता है। ‘अपना निर्णय बदलना’ तत्काल प्रसंग में स्पष्ट है और ‘तरस खाना’ जैसा अलग भाव नहीं लाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है।
- source_word: לֹא אָדָם הוּא
  choice: वह मनुष्य नहीं
  rationale: यह परमेश्वर और सामान्य मानव की अस्थिरता के बीच सीधा विरोध व्यक्त करता है; स्रोत का एकवचन बना रहता है।
- source_word: לְהִנָּחֵם
  choice: कि अपना निर्णय बदले
  rationale: पहले आए נחם से शब्दगत संगति रखी गई है; विधेय उपवाक्य हिन्दी में स्वाभाविक ढंग से तुलना पूरी करता है।
theological_decisions:
- issue: परमेश्वर के न बदलने की भाषा को संदर्भ से अधिक दार्शनिक न बनाना
  choice: ‘न अपना निर्णय बदलेगी ... कि अपना निर्णय बदले’
  alternative: ‘न पछताएगी ... कि पछताए’ अथवा ‘न मानेगी’
  rationale: यह पद शाऊल को अस्वीकार करने के घोषित निर्णय की विश्वसनीयता और अपरिवर्तनीयता पर बल देता है। अनुवाद उसी संदर्भ को स्पष्ट करता है, पर परमेश्वर के विषय में पाठ से व्यापक कोई अमूर्त दार्शनिक दावा नहीं जोड़ता।
- issue: נצח ישראל ईश्वरीय उपाधि का बहुअर्थी स्वरूप
  choice: ‘इस्राएल की महिमा’ मुख्य पाठ में, अन्य सम्भावनाएँ पादटिप्पणी में
  alternative: ‘इस्राएल का सनातन’, ‘इस्राएल का सामर्थ्य’, या ‘इस्राएल की विजय’
  rationale: इब्रानी संज्ञा का अर्थ-क्षेत्र विवादित और व्यापक है। मुख्य पाठ में गरिमापूर्ण उपाधि रखकर तथा विकल्प देकर वास्तविक अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज बाइबलीय गद्य। ईश्वरीय उपाधि ‘महिमा’ हिन्दी में स्त्रीलिंग है, इसलिए पहले खंड में ‘बोलेगी/बदलेगी’; बाद में सर्वनाम ‘वह’ परमेश्वर को सूचित करता है, फिर भी विधेय क्रिया का रूप प्रसंगानुसार स्वाभाविक रखा गया है।
