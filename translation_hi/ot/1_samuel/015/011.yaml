source:
  edition: WLC
  text: נִחַ֗מְתִּי כִּֽי הִמְלַ֤כְתִּי אֶת שָׁאוּל֙ לְ/מֶ֔לֶךְ כִּֽי שָׁב֙ מֵ/אַֽחֲרַ֔/י וְ/אֶת דְּבָרַ֖/י לֹ֣א הֵקִ֑ים וַ/יִּ֨חַר֙ לִ/שְׁמוּאֵ֔ל וַ/יִּזְעַ֥ק אֶל יְהוָ֖ה כָּל הַ/לָּֽיְלָה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/011.yaml
  text: I regret that I made Saul king[a], because he has turned back from following me and has not carried out my words. And Samuel burned with anger[d][c][b], and he cried out to Yahweh all night.
translation:
  language: hi
  text: “मुझे खेद है[a] कि मैंने शाऊल को राजा बनाया, क्योंकि वह मेरे पीछे चलने से मुड़ गया है[b] और उसने मेरे वचनों को पूरा नहीं किया है[c]।” तब शमूएल क्रोध से जल उठा[d] और सारी रात याहवे को पुकारता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मुझे दुःख है” अथवा “मैं अपने निर्णय से फिरा हूँ।” इब्रानी शब्द याहवे के गहरे खेद और दुःख को व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वह मेरे पीछे से लौट गया है”; यह याहवे का अनुसरण छोड़ देने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या, “उसने मेरे वचनों को कार्यान्वित नहीं किया” अथवा “मेरे वचनों का पालन नहीं किया।”
    reason: lexical_alternative
  - marker: d
    text: इब्रानी मुहावरा शाब्दिक रूप से शमूएल के क्रोध के जल उठने का भाव देता है। प्रसंग को देखते हुए कुछ लोग इसे गहरे दुःख या अप्रसन्नता के अर्थ में समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: נִחַמְתִּי
  choice: मुझे खेद है
  rationale: निफ़अल रूप यहाँ शाऊल को राजा बनाने पर याहवे के वास्तविक दुःख और खेद को व्यक्त करता है। यह आधुनिक हिन्दी में स्वाभाविक है और परमेश्वर द्वारा नैतिक भूल किए जाने का अनावश्यक संकेत नहीं देता।
- source_word: הִמְלַכְתִּי אֶת־שָׁאוּל לְמֶלֶךְ
  choice: मैंने शाऊल को राजा बनाया
  rationale: हिफ़इल रूप किसी को राजा ठहराने या राजपद पर स्थापित करने का भाव देता है; चुना हुआ अनुवाद सरल और सटीक है।
- source_word: שָׁב מֵאַחֲרַי
  choice: वह मेरे पीछे चलने से मुड़ गया है
  rationale: इब्रानी मुहावरा किसी का अनुसरण छोड़ देने को व्यक्त करता है। यह रूप मूल के ‘पीछे’ वाले चित्र और निष्ठा से विमुख होने, दोनों को सुरक्षित रखता है।
- source_word: וְאֶת־דְּבָרַי לֹא הֵקִים
  choice: उसने मेरे वचनों को पूरा नहीं किया है
  rationale: ‘वचनों’ के साथ קום का हिफ़इल उन्हें कार्यान्वित या पूरा करने का अर्थ देता है। ‘पूरा नहीं किया’ केवल सुनने की अवज्ञा से आगे, आदेश को अमल में न लाने का भाव रखता है।
- source_word: וַיִּחַר לִשְׁמוּאֵל
  choice: शमूएल क्रोध से जल उठा
  rationale: חרה का मुहावरा जलते क्रोध को व्यक्त करता है। सजीव रूपक को हिन्दी में बनाए रखा गया है, जबकि प्रसंगगत दुःख की सम्भावना पादटिप्पणी में दी गई है।
- source_word: וַיִּזְעַק אֶל־יְהוָה
  choice: याहवे को पुकारता रहा
  rationale: זעק तीव्र और व्याकुल पुकार का बोध कराता है। ‘पुकारता रहा’ अगली कालावधि के साथ रात भर चली विनती को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: כָּל־הַלַּיְלָה
  choice: सारी रात
  rationale: यह पूरे रात भर की अवधि को आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के विषय में נִחַמְתִּי का अर्थ
  choice: मुझे खेद है
  alternative: मैं पछताया हूँ; मुझे दुःख है; मैं अपने निर्णय से फिरा हूँ
  rationale: यह पाठ में मौजूद ईश्वरीय खेद और दुःख की वास्तविक भाषा को बनाए रखता है, पर यह नहीं जोड़ता कि परमेश्वर ने कोई नैतिक पाप किया या अज्ञानवश भूल की। इस प्रकार मूल का धर्मवैचारिक तनाव अनसुलझा ही सुरक्षित रहता है।
- issue: וַיִּחַר לִשְׁמוּאֵל में शमूएल की भावनात्मक प्रतिक्रिया
  choice: शमूएल क्रोध से जल उठा
  alternative: शमूएल बहुत दुःखी हुआ; शमूएल बहुत अप्रसन्न हुआ
  rationale: मुहावरे का प्राथमिक शब्दार्थ क्रोध है। प्रसंग में दुःख भी सम्भव है, इसलिए उसे मुख्य पाठ में प्रतिस्थापित करने के बजाय पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। मूल के सजीव मुहावरों—‘मेरे पीछे चलना’ और ‘क्रोध से जल उठना’—को समझने योग्य रूप में बचाया गया है। प्रत्यक्ष वचन के बाद ‘तब’ कथा-प्रवाह को स्वाभाविक बनाता है; ‘पुकारता रहा’ रात भर जारी क्रिया को स्पष्ट करता है।
