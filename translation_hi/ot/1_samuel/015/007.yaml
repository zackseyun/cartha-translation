- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इस व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עֲמָלֵק
  choice: अमालेकियों
  rationale: एकवचन पूर्वज-नाम यहाँ सामूहिक रूप से उस जाति को दर्शाता है; हिन्दी में बहुवचन जातिनाम अधिक स्वाभाविक और स्पष्ट है।
- source_word: מֵחֲוִילָה
  choice: हवीला से लेकर
  rationale: מִן भौगोलिक विस्तार का आरम्भ-बिंदु बताता है; आगामी सीमा के साथ ‘से लेकर’ स्वाभाविक हिन्दी है।
- source_word: בּוֹאֲךָ שׁוּר
  choice: शूर जाने के मार्ग तक
  rationale: בּוֹאֲךָ एक भौगोलिक मुहावरा है, जिसका अर्थ ‘शूर की ओर जाते हुए’ या ‘शूर के मार्ग में’ है। यहाँ सीमा-सूचक रचना में ‘मार्ग तक’ उसका सहज अर्थ देता है।
- source_word: אֲשֶׁר עַל־פְּנֵי מִצְרָיִם
  choice: मिस्र के सामने स्थित
  rationale: עַל־פְּנֵי में ‘सामने/सम्मुख’ का स्थान-संबंध है; इसे केवल ‘पूर्व में’ कहना सम्भावित दिशा को आवश्यकता से अधिक निश्चित कर देगा।
