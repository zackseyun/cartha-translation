  footnotes:
  - marker: a
    text: या, “नाले में घात लगाई।” यहाँ प्रयुक्त इब्रानी क्रिया कठिन है; इसका अर्थ “विवाद किया” या “संघर्ष किया” भी समझा गया है, पर प्रसंग घात लगाने के अर्थ का समर्थन करता है।
    reason: lexical_alternative
  - marker: b
    text: “नाला” से आशय ऐसी वाडी, जलधारा का तल, या खड्ड से है जिसमें वर्षा के समय पानी बह सकता है और जो अन्य समय सूखी रह सकती है।
    reason: cultural_note
  - marker: c
    text: या, “अमालेकियों का नगर।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא का अर्थ प्रसंगानुसार आना, जाना या पहुँचना हो सकता है। यहाँ लक्ष्य तक सैन्य बढ़त को स्वाभाविक हिन्दी में ‘पहुँचा’ व्यक्त करता है।
- source_word: עַד
  choice: तक
  rationale: עַד गंतव्य के साथ ‘तक’ या ‘जहाँ तक’ का अर्थ देता है; ‘नगर तक पहुँचा’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: עִיר עֲמָלֵק
  choice: अमालेक के नगर
  rationale: यह रचना-संबंधी पदबंध का निकट अनुवाद है। अमालेक से उस नाम का जनसमूह भी अभिप्रेत हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיָּרֶב
  choice: घात लगाकर बैठ गया
  rationale: मसोराई पाठ का यह क्रियारूप कठिन है और सामान्यतः ‘झगड़ा किया’ भी समझा जा सकता है; पर सैन्य प्रसंग और प्राचीन व्याख्यात्मक परंपरा घात लगाने के भाव का समर्थन करती है। मुख्य पाठ में प्रसंग-संगत अर्थ रखा गया और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: בַּנָּחַל
  choice: घाटी में
  rationale: נחל मौसमी जलधारा की घाटी, नाला या खड्ड दर्शा सकता है। साधारण हिन्दी पाठक के लिए ‘घाटी’ सहज है; भौगोलिक विशेषता पादटिप्पणी में स्पष्ट की गई है।
