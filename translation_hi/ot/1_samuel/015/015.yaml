base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/015.yaml
  text: And Saul said[a], “They brought them from the Amalekites, because the people spared the best of the sheep and the cattle, in order to sacrifice them to Yahweh your God; but the rest we devoted to destruction.”
translation:
  language: hi
  text: शाऊल ने कहा, “वे उन्हें अमालेकियों से ले आए हैं, क्योंकि लोगों ने भेड़ों और गाय-बैलों में से जो सबसे अच्छे थे, उन्हें बचा लिया, ताकि उन्हें तुम्हारे परमेश्वर याहवे के लिए बलि चढ़ाएँ; लेकिन बाकी सबको हमने विनाश के लिए समर्पित कर दिया[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हमने पूरी तरह नष्ट कर दिया।” यहाँ इब्रानी में חָרַם का एक रूप है, जो किसी वस्तु को विनाश के लिए समर्पित करने के तकनीकी अर्थ में प्रयुक्त होता है।
    reason: חרם के तकनीकी अर्थ और उसके अधिक सरल क्रियात्मक अनुवाद, दोनों को सामने रखना।
lexical_decisions:
- source_word: הֱבִיאוּם
  choice: वे उन्हें ... लाए हैं
  rationale: हिफ़ील रूप और बहुवचन कर्ता को स्पष्ट रखता है; हिन्दी में पूर्ण वर्तमान शाऊल के सामने मौजूद पशुओं की व्याख्या के प्रसंग में स्वाभाविक है।
- source_word: מֵעֲמָלֵקִי
  choice: अमालेकियों के यहाँ से
  rationale: जातिवाचक इब्रानी रूप अमालेकी लोगों को सूचित करता है, केवल अमालेक नामक भूभाग को नहीं।
- source_word: חָמַל ... עַל
  choice: बचा रखा
  rationale: इस युद्ध-संदर्भ में इसका अर्थ विनाश न करना है; यह केवल भावनात्मक दया दिखाने की अपेक्षा ठोस कार्रवाई को व्यक्त करता है।
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: भेड़-बकरियों और गाय-बैलों में से सबसे अच्छे पशु
  rationale: מֵיטַב श्रेष्ठ भाग को दर्शाता है; सामूहिक पशु-श्रेणियों को आधुनिक हिन्दी में स्पष्ट और सहज रूप से व्यक्त किया गया है।
- source_word: לְמַעַן זְבֹחַ
  choice: ताकि उन्हें ... बलि चढ़ाएँ
  rationale: לְמַעַן उद्देश्य बताता है; ‘उन्हें’ पशुओं को बलि की वस्तु के रूप में स्पष्ट करता है, जो इब्रानी में निहित है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत वाचा-नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय सुरक्षित है; शाऊल का शमूएल से ‘तुम्हारे परमेश्वर’ कहना प्रसंग की महत्वपूर्ण भाषिक दूरी बनाए रखता है।
- source_word: הַיּוֹתֵר
  choice: बाकी सबको
  rationale: बचाए गए श्रेष्ठ पशुओं से अलग शेष वस्तुओं या प्राणियों को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֶחֱרַמְנוּ
  choice: हमने विनाश के लिए समर्पित कर दिया
  rationale: חרם के हिफ़ील रूप का सामान्य विनाश से बढ़कर दैवी प्रतिबंध के अधीन विनाशार्थ समर्पण का तकनीकी भाव सुरक्षित रहता है।
theological_decisions:
- issue: पवित्र युद्ध अथवा न्याय के प्रसंग में חרם का अनुवाद
  choice: विनाश के लिए समर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया
  rationale: मुख्य पाठ का रूप दैवी प्रतिबंध के अधीन विनाशार्थ अलग किए जाने का धार्मिक-तकनीकी भाव बनाए रखता है; पादटिप्पणी सरल क्रियात्मक विकल्प देती है।
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है, उपाधि में नहीं बदला गया।
- issue: शाऊल का ‘तुम्हारे परमेश्वर’ कहना
  choice: तुम्हारे परमेश्वर
  alternative: हमारे परमेश्वर
  rationale: मूल के द्वितीय पुरुष एकवचन को बिना सामान्यीकृत किए सुरक्षित रखा गया है, ताकि शाऊल की कथनगत दूरी बनी रहे।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भेड़-बकरियाँ’ और ‘गाय-बैल’ सामूहिक इब्रानी पशु-श्रेणियों को स्पष्ट करते हैं। ‘याहवे’ वाचा-नाम का देवनागरी लिप्यंतरण है।
