  text: וְ/לָ֥/מָּה לֹא שָׁמַ֖עְתָּ בְּ/ק֣וֹל יְהוָ֑ה וַ/תַּ֨עַט֙ אֶל הַ/שָּׁלָ֔ל וַ/תַּ֥עַשׂ הָ/רַ֖ע בְּ/עֵינֵ֥י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/019.yaml
  text: Why then did you not obey the voice of Yahweh[a], but rush upon the spoil and do what was evil in the eyes of Yahweh?
translation:
  language: hi
  text: फिर तुमने याहवे की वाणी क्यों नहीं मानी, बल्कि लूट के माल पर झपट पड़े और याहवे की दृष्टि में बुरा काम किया?[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “झपट पड़े” का अनुवाद “लूट पर टूट पड़े” या “लूट की ओर लालच से बढ़े” भी हो सकता है; हिब्रू क्रिया युद्ध की लूट की ओर उत्सुकतापूर्वक और हथियाने की मंशा से बढ़ने का संकेत देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָמָּה
  choice: फिर…क्यों
  rationale: संदर्भ में וְ प्रश्न को पिछली बात से जोड़ता है; ‘फिर…क्यों’ शमूएल की फटकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שָׁמַעְתָּ בְּקוֹל
  choice: वाणी…मानी
  rationale: यहाँ שׁמע בְּקוֹל केवल सुनने नहीं, आदेश मानने का बोध देता है; ‘वाणी मानना’ आज्ञापालन और मूल रूपक दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुर्वर्णीय निज नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַתַּעַט אֶל
  choice: झपट पड़े
  rationale: क्रिया लूट की ओर उत्सुक, लालची और आकस्मिक गति का संकेत देती है; ‘झपट पड़े’ यह तीव्रता स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַשָּׁלָל
  choice: लूट का माल
  rationale: युद्ध में प्राप्त वस्तुओं के लिए यह सामान्य और स्पष्ट आधुनिक हिन्दी अभिव्यक्ति है।
- source_word: וַתַּעַשׂ הָרַע
  choice: वह काम…किया…जो…बुरा था
  rationale: हिब्रू मुहावरे का आशय बुरा कार्य करना है; यह रूप निश्चित लेख की सूक्ष्मता को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: यह हिब्रू मूल्यांकनात्मक मुहावरे का स्वाभाविक हिन्दी समतुल्य है और ‘आँखों में’ की अपेक्षा अधिक सहज है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में निज नाम सीधे प्रयुक्त है, इसलिए ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। आधुनिक हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ अधिक पहचाना जाने वाला रूप है; ‘याहवे’ अधिक निकट वैकल्पिक लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। प्रश्नों की पुनरावृत्ति हिन्दी में फटकार की शक्ति और वाक्य की स्वाभाविकता बढ़ाती है; मूल के क्रम और अर्थ को सुरक्षित रखा गया है।
