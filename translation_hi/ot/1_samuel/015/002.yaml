  yaml_path: translation/ot/1_samuel/015/002.yaml
  text: 'Thus says Yahweh of hosts: ‘I have taken note of what Amalek did to Israel[c][b][a], how he opposed him on the way when he came up from Egypt.’'
translation:
  language: hi
  text: 'सेनाओं का यहोवा यों कहता है: “अमालेक ने इस्राएल के साथ जो किया, उस पर मैंने ध्यान दिया है[a]—जब इस्राएल मिस्र से निकलकर आ रहा था, तब मार्ग में अमालेक ने उसका विरोध किया था[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने स्मरण रखा है कि अमालेक ने इस्राएल के साथ क्या किया,” अथवा, “अमालेक ने इस्राएल के साथ जो किया, उसके लिए मैंने उसे दण्ड देने का निश्चय किया है।” हिब्रू क्रिया का अर्थ ध्यान देना, स्मरण करना, या न्याय के लिए संज्ञान लेना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: संभवतः, “उसने मार्ग में उसके लिए घात लगाई थी।” यह हिब्रू अभिव्यक्ति निर्गमन की यात्रा के समय इस्राएल के विरुद्ध अमालेक की शत्रुतापूर्ण कार्रवाई बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह भविष्यद्वक्ताओं और संदेशवाहकों की प्रचलित उद्घोषणा-शैली को स्वाभाविक तथा गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं का यहोवा
  rationale: यहोवा व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है, जबकि सेनाओं व्यापक सामर्थ्य और सैन्य समूहों वाले शीर्षक को अनावश्यक रूप से केवल मानवीय या स्वर्गीय सेनाओं तक सीमित नहीं करता।
- source_word: פָּקַדְתִּי
  choice: उसका मैंने लेखा लिया है
  rationale: यह अभिव्यक्ति ध्यान देने, स्मरण रखने और न्याय के लिए संज्ञान लेने के अर्थों को साथ रखती है; आने वाले दण्ड को इसी क्रिया में पूर्णतः स्पष्ट नहीं करती।
- source_word: אֵת אֲשֶׁר עָשָׂה עֲמָלֵק לְיִשְׂרָאֵל
  choice: अमालेक ने इस्राएल के साथ जो किया
  rationale: मूल के व्यापक संबंधसूचक वाक्य को सहज हिन्दी में व्यक्त करता है और शत्रुतापूर्ण कार्य की ठीक प्रकृति को इस खंड में जरूरत से अधिक नहीं खोलता।
- source_word: אֲשֶׁר שָׂם לוֹ בַּדֶּרֶךְ
  choice: मार्ग में अमालेक ने उसका विरोध किया था
  rationale: संक्षिप्त हिब्रू मुहावरे के शत्रुतापूर्ण आशय को स्पष्ट करता है, पर मुख्य पाठ में घात लगाने जैसी अधिक संकीर्ण रणनीति आरोपित नहीं करता।
- source_word: לוֹ / בַּעֲלֹתוֹ
  choice: उसका / इस्राएल ... आ रहा था
  rationale: हिब्रू में इस्राएल के लिए सामूहिक एकवचन है। हिन्दी में पहले स्पष्ट संज्ञा दोहराकर और फिर एकवचन संबंधसूचक सर्वनाम रखकर संदर्भ को स्वाभाविक तथा स्पष्ट बनाया गया है।
- source_word: מִמִּצְרָיִם
  choice: मिस्र से निकलकर ऊपर
  rationale: עלה के दिशात्मक भाव को ‘ऊपर’ से सुरक्षित रखते हुए हिन्दी में ‘निकलकर’ जोड़ना मिस्र-निर्गमन के संदर्भ को स्वाभाविक बनाता है।
theological_decisions:
- issue: יְהוָה צְבָאוֹת का अनुवाद
  choice: सेनाओं का यहोवा
  alternative: सेनाओं का प्रभु / सर्वशक्तिमान यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम और शीर्षक की व्यापक सैन्य छवि दोनों सुरक्षित हैं; ‘सर्वशक्तिमान’ जैसा व्याख्यात्मक अर्थ मूल शीर्षक का स्थान नहीं लेता।
- issue: פָּקַדְתִּי में स्मरण और न्याय का संबंध
  choice: उसका मैंने लेखा लिया है
  alternative: मैंने स्मरण किया है / मैं दण्ड दूँगा
  rationale: प्रसंग में स्मरण निष्क्रिय नहीं बल्कि आगामी न्याय की ओर उन्मुख है। चुना हुआ पाठ इस तनाव को बनाए रखता है और अगले पद के दण्डादेश को पहले से इस क्रिया में नहीं मिला देता।
- issue: इस्राएल का सामूहिक एकवचन
  choice: इस्राएल ... उसका
  alternative: वे ... उनका
  rationale: मूल की सामूहिक एकवचन अवधारणा बनाए रखते हुए हिन्दी में अस्पष्ट ‘वह’ से बचा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण बाइबलीय शैली के लिए ‘यों कहता है’ और ‘यहोवा’ रखा गया है। लंबे सामूहिक सर्वनाम-क्रम से उत्पन्न अस्पष्टता दूर करने के लिए दूसरे खंड में ‘इस्राएल’ और ‘अमालेक’ दोहराए गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
