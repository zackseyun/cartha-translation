  text: Now please forgive my sin[a], and return with me[b], so that I may bow down to Yahweh.
translation:
  language: hi
  text: अब कृपा करके मेरे पाप को क्षमा कर[a] और मेरे साथ लौट चल, ताकि मैं याहवे को दण्डवत् प्रणाम करूँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘मेरे पाप को उठा ले’; यह ‘मेरे पाप को क्षमा कर’ के अर्थ का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ‘मैं याहवे की आराधना करूँ’; इब्रानी क्रिया का शाब्दिक अर्थ झुकना या भूमि पर झुककर प्रणाम करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह शमूएल की फटकार के उत्तर में शाऊल की तत्काल विनती का परिचय देता है; हिन्दी में ‘अब’ स्वाभाविक है।
- source_word: שָׂא נָא
  choice: कृपा करके … क्षमा कर
  rationale: נָשָׂא का मूल अर्थ ‘उठाना/ले जाना’ है, पर חַטָּאת के साथ यह पाप क्षमा करने का मुहावरा है। נָא विनम्र आग्रह प्रकट करता है।
- source_word: אֶת־חַטָּאתִי
  choice: मेरे पाप को
  rationale: संदर्भ में חַטָּאתִי शाऊल के अपने स्वीकार किए हुए पाप को सूचित करता है, न कि पापबलि को।
- source_word: וְשׁוּב עִמִּי
  choice: और मेरे साथ लौट चल
  rationale: שׁוּב का अर्थ ‘लौटना’ है; ‘लौट चल’ आधुनिक हिन्दी में साथ वापस जाने के आग्रह को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאֶשְׁתַּחֲוֶה
  choice: ताकि मैं … दण्डवत् करूँ
  rationale: क्रिया शारीरिक रूप से झुकने या भूमि पर गिरकर प्रणाम करने को दर्शाती है। आज्ञार्थक क्रिया के बाद आया यह रूप यहाँ उद्देश्य का भाव स्वाभाविक रूप से देता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: पूर्वसर्ग ל उस सत्ता को चिह्नित करता है जिसके सामने दण्डवत् किया जाता है; יהוה को उसके विशिष्ट वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को सामान्य उपाधि में नहीं बदलता।
- issue: וְאֶשְׁתַּחֲוֶה में शारीरिक मुद्रा और आराधना का संबंध
  choice: दण्डवत् करूँ
  alternative: आराधना करूँ
  rationale: मूल क्रिया झुकने या साष्टांग होने की ठोस क्रिया बताती है, जबकि याहवे उसका लक्ष्य होने के कारण आराधना का भाव निहित है। अनुवाद ने ठोस अर्थ रखा और व्यापक अर्थ को पाद-टिप्पणी में बताया।
translation_notes:
  register: भाषा आधुनिक, सहज और आदरपूर्ण रखी गई है। शाऊल से शमूएल के प्रत्यक्ष एकवचन संबोधन को ‘कर’ और ‘लौट चल’ से सुरक्षित रखा गया है; ‘कृपा करके’ विनती की नम्रता व्यक्त करता है।
