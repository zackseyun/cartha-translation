base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/016.yaml
  text: Then Samuel said to Saul[a], “Stop, and I will tell you what Yahweh said to me last night.” And he said to him, “Speak.”
translation:
  language: hi
  text: तब शमूएल ने शाऊल से कहा, “बस करो! मैं तुम्हें बताऊँगा कि याहवे ने पिछली रात मुझसे क्या कहा था।” शाऊल ने शमूएल से कहा,[a] “कहिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी के लिखित रूप में ‘उन्होंने उससे कहा’ है; पर प्रसंग बताता है कि बोलने वाला शाऊल है, इसलिए अर्थ एकवचन है: ‘उसने उससे कहा।’'
    reason: textual_variant
lexical_decisions:
- source_word: הֶרֶף
  choice: बस करो!
  rationale: यहाँ רפה का आदेश शाऊल को बोलना बंद करने या अपनी बात से रुकने के लिए दी गई तीखी आज्ञा है। ‘बस करो!’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और डाँट के भाव के अनुरूप है।
- source_word: וְאַגִּידָה לְּךָ
  choice: मैं तुम्हें बताता हूँ
  rationale: נגד के हिफ़ील रूप का अर्थ ‘बताना/घोषित करना’ है। आदेश के बाद यह शमूएल की तत्काल मंशा व्यक्त करता है; वर्तमानकालीन हिन्दी यहाँ स्वाभाविक है।
- source_word: אֵת אֲשֶׁר דִּבֶּר
  choice: क्या कहा था
  rationale: यह रचना ईश्वरीय वचन की विषयवस्तु प्रस्तुत करती है। ‘क्या कहा था’ हिन्दी में सहज है और भूतकालीन क्रम स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: הַלָּיְלָה
  choice: पिछली रात
  rationale: पूर्ववर्ती पूर्ण क्रिया और कथा-संदर्भ में यह तत्काल बीती हुई रात को सूचित करता है।
- source_word: וַיֹּאמְרוּ לוֹ
  choice: उसने उससे कहा
  rationale: लिखित व्यंजनात्मक रूप बहुवचन है, पर प्रसंग में उत्तर देने वाला शाऊल अकेला है; अर्थ की संगति के लिए एकवचन मुख्य पाठ में रखा गया और लिखित भिन्नता पादटिप्पणी में बताई गई है।
- source_word: דַּבֵּר
  choice: कहिए
  rationale: यह शमूएल को बोलने के लिए संक्षिप्त आदेश है। शाऊल द्वारा वृद्ध नबी को संबोधन में ‘कहिए’ स्वाभाविक और सम्मानसूचक हिन्दी है, जबकि मूल की संक्षिप्तता भी बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में आए व्यक्तिगत नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला नामरूप है; इससे पाठ से आगे कोई सांप्रदायिक दावा नहीं जोड़ा जाता।
- issue: וַיֹּאמְרוּ לוֹ का वचन
  choice: प्रसंगानुसार एकवचन—‘उसने उससे कहा’
  alternative: लिखित रूपानुसार बहुवचन—‘उन्होंने उससे कहा’
  rationale: बहुवचन को मुख्य पाठ में रखने पर अज्ञात बहुवचन वक्ता उत्पन्न होता है, जबकि कथा में शाऊल ही शमूएल को उत्तर देता है। वास्तविक पाठगत तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। शमूएल की तीखी रोक को ‘बस करो!’ से और शाऊल के संक्षिप्त उत्तर को सम्मानसूचक ‘कहिए’ से व्यक्त किया गया है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जहाँ पाठगत भिन्नता आती है।
