id: 1SA.15.17
reference: 1 Samuel 15:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל הֲ/ל֗וֹא אִם קָטֹ֤ן אַתָּה֙ בְּ/עֵינֶ֔י/ךָ רֹ֛אשׁ שִׁבְטֵ֥י יִשְׂרָאֵ֖ל אָ֑תָּה וַ/יִּמְשָׁחֲ/ךָ֧ יְהוָ֛ה לְ/מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/017.yaml
  text: And Samuel said[a], “Though you were small in your own eyes, were you not the head of the tribes of Israel? And Yahweh anointed you king over Israel.”
translation:
  language: hi
  text: शमूएल ने कहा, “भले ही तुम अपनी दृष्टि में छोटे थे[a], क्या तुम इस्राएल के गोत्रों के प्रधान नहीं थे? और याहवे ने इस्राएल पर राजा के रूप में तुम्हारा अभिषेक किया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम अपनी दृष्टि में छोटे थे।” इब्रानी वाक्यांश के भाव को थोड़ा अलग ढंग से भी समझा जा सकता है; आशय यह है कि शाऊल कभी अपने आपको छोटा या महत्वहीन समझता था।
    reason: इब्रानी रचना אִם קָטֹן में रियायती और शर्तसूचक अर्थ की सूक्ष्म अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं थे?
  rationale: यह प्रश्नवाचक पद ऐसे आलंकारिक प्रश्न का परिचय देता है जिसमें सहमति अपेक्षित है; हिन्दी में ‘क्या ... नहीं थे?’ यही बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִם קָטֹן אַתָּה בְּעֵינֶיךָ
  choice: भले ही तुम अपनी दृष्टि में छोटे थे
  rationale: यह वाक्यांश शाऊल की अपनी पूर्व दृष्टि में उसकी छोटी हैसियत को स्मरण कराता है। ‘भले ही’ प्रसंग के रियायती भाव को व्यक्त करता है, जबकि इब्रानी की थोड़ी अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: קָטֹן
  choice: छोटे
  rationale: ‘छोटे’ मूल रूपक को बनाए रखता है और इसे केवल नम्रता, मनोवैज्ञानिक हीनता या सामाजिक नगण्यता तक सीमित नहीं करता।
- source_word: בְּעֵינֶיךָ
  choice: अपनी दृष्टि में
  rationale: यह स्व-मूल्यांकन का इब्रानी मुहावरा है; आधुनिक हिन्दी में ‘अपनी दृष्टि में’ उसका स्पष्ट और स्वाभाविक रूप है।
- source_word: רֹאשׁ שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के गोत्रों के प्रधान
  rationale: ‘प्रधान’ רֹאשׁ के नेतृत्व और सर्वोच्च स्थान के रूपक को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּמְשָׁחֲךָ
  choice: तुम्हारा अभिषेक किया
  rationale: मूल क्रिया विशेष रूप से अभिषेक के राजकीय और धार्मिक कार्य को बताती है; केवल ‘नियुक्त किया’ कहना इस अर्थ को कम कर देता।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में प्रतिलिपित किया गया है।
- source_word: לְמֶלֶךְ עַל יִשְׂרָאֵל
  choice: इस्राएल पर राजा के रूप में
  rationale: यह अभिषेक के राजकीय पद और उसके अधिकार-क्षेत्र को संक्षिप्त, स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: शाऊल की पूर्व आत्म-दृष्टि और उसके पद के बीच संबंध
  choice: रियायती अर्थ—‘भले ही ... छोटे थे’
  alternative: ‘यदि तुम अपनी दृष्टि में छोटे थे’ या ‘जब तुम अपनी दृष्टि में छोटे थे’
  rationale: אִם सहित इब्रानी रचना में सूक्ष्म अर्थगत अनिश्चितता है। प्रसंग रियायती अर्थ का समर्थन करता है, पर वैकल्पिक सूक्ष्मता पादटिप्पणी में रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। प्रत्यक्ष संबोधन में ‘तुम’ प्रयोग हुआ है, जिससे ‘तू’ की संभावित रूक्षता और ‘आप’ की अत्यधिक औपचारिकता दोनों से बचा गया है।
