base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/033.yaml
  text: Samuel said[a], “As your sword has made women childless[b], so your mother will be childless among women.” And Samuel hacked Agag to pieces before Yahweh at Gilgal.
translation:
  language: hi
  text: शमूएल ने कहा, “जैसे तेरी तलवार ने स्त्रियों को उनके बच्चों से वंचित किया है, वैसे ही तेरी माँ भी स्त्रियों में अपने बच्चों से वंचित होगी।”[a] तब शमूएल ने गिलगाल में याहवे के सामने अगाग को टुकड़े-टुकड़े कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जैसे तेरी तलवार ने स्त्रियों को संतान-विहीन किया है, वैसे ही तेरी माँ भी स्त्रियों में संतान-विहीन होगी।” इब्रानी में दोनों उपवाक्यों में एक ही क्रिया है, जो नाप-तोलकर दिए गए प्रतिफल पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: या, “अगाग को काटकर टुकड़े कर दिया”; परंपरागत रूप से, “अगाग को चीर डाला।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁכְּלָה / תִּשְׁכַּל
  choice: निःसंतान किया है / निःसंतान होगी
  rationale: दोनों उपवाक्यों में एक ही इब्रानी मूल का प्रयोग है और यह संतान खोने के कारण हुए वियोग को व्यक्त करता है। समान हिंदी शब्दावली नाप-तोलकर दिए गए प्रतिफल की समानांतरता बनाए रखती है।
- source_word: חַרְבֶּךָ
  choice: तेरी तलवार
  rationale: यह सीधा अनुवाद है; तलवार अगाग के हिंसक कार्यों का लक्षणात्मक प्रतिनिधित्व करती है, जिसे हिंदी में भी स्वाभाविक रूप से समझा जा सकता है।
- source_word: מִנָּשִׁים
  choice: स्त्रियों में
  rationale: यहाँ מן तुलनात्मक अभिव्यक्ति में ‘के बीच/में’ का भाव देता है; ‘स्त्रियों में’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיְשַׁסֵּף
  choice: टुकड़े-टुकड़े कर दिए
  rationale: यह क्रिया काटकर टुकड़े करने की प्रबल और हिंसक क्रिया बताती है। चुना हुआ रूप मूल की कठोरता को न तो नरम करता है, न अतिरिक्त सनसनी जोड़ता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्वाभाविक अर्थ ‘के सामने/उपस्थिति में’ है; यह कर्म के याहवे की उपस्थिति में होने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को नाम के रूप में सुरक्षित रखा गया है।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: घटना के स्थान को आधुनिक हिंदी में स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: हिंसक दंड-विधान को न नरम करना, न सनसनीखेज बनाना
  choice: शमूएल ने स्वयं अगाग के टुकड़े-टुकड़े कर दिए
  alternative: शमूएल ने अगाग को काट डाला / मार डाला
  rationale: मूल पाठ कर्ता के रूप में शमूएल का स्पष्ट नाम लेता है और तीव्र क्रिया का प्रयोग करता है। ‘मार डाला’ उस तीव्रता को घटाता है, जबकि चुना हुआ रूप क्रिया का अर्थ स्पष्ट रखता है।
- issue: परमेश्वर के नाम का रूप
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में चतुरक्षरीय विशिष्ट नाम יְהוָה है; उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। प्रत्यक्ष कथन में ‘तेरी’ मूल के एकवचन संबोधन को सुरक्षित रखता है। हिंसा का वर्णन मूल की तीव्रता के अनुरूप स्पष्ट है, पर उसमें कोई अतिरिक्त विवरण या धार्मिक औचित्य नहीं जोड़ा गया।
