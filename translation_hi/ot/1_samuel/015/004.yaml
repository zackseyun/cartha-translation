  text: 'So Saul summoned the people and mustered them at Telaim: two hundred thousand foot soldiers[a], and ten thousand men of Judah.'
translation:
  language: hi
  text: 'तब शाऊल ने लोगों को बुलाया और तलाइम[a] में उन्हें गिना: दो लाख पैदल सैनिक और यहूदा के दस हज़ार पुरुष।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “मेमनों के साथ,” यदि בַּטְּלָאִים को स्थान-नाम ‘तलाइम’ के बजाय उसके शाब्दिक अर्थ में लिया जाए।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: लोगों को बुलाया
  rationale: हिफ़ील रूप यहाँ सैन्य अभियान के लिए लोगों को एकत्र होने को बुलाने के अर्थ में है; यह शाब्दिक ‘सुनवाया’ की अपेक्षा स्वाभाविक और प्रसंगानुकूल है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल शब्द का अर्थ ‘लोग’ है। प्रसंग में ये युद्ध के लिए बुलाए गए लोग हैं, फिर भी ‘सेना’ कहने के बजाय मूल की व्यापक अभिव्यक्ति रखी गई है।
- source_word: וַיִּפְקְדֵם
  choice: उनकी गिनती की
  rationale: सैन्य प्रसंग में क्रिया का अर्थ सैनिकों की गणना अथवा जमाव का निरीक्षण करना है। सामान्य हिन्दी में ‘गिनती की’ स्पष्ट है और आगे दी गई संख्याओं से सहज जुड़ती है।
- source_word: בַּטְּלָאִים
  choice: तलाइम में
  rationale: मुख्य पाठ में इसे सैन्य जमाव के स्थान का नाम माना गया है। स्वरूप का शाब्दिक अर्थ ‘मेढ़ों/मेमनों के साथ’ भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מָאתַיִם אֶלֶף רַגְלִי
  choice: दो लाख पैदल सैनिक
  rationale: संख्या का सीधा अनुवाद किया गया है और רַגְלִי को सैन्य संदर्भ में पैदल लड़ने वाले सैनिकों के रूप में व्यक्त किया गया है।
- source_word: וַעֲשֶׂרֶת אֲלָפִים אֶת אִישׁ יְהוּדָה
  choice: और यहूदा के दस हज़ार पुरुष
  rationale: אִישׁ יְהוּדָה सामूहिक रूप से यहूदा के पुरुषों को दर्शाता है; हिन्दी में जनजातीय पहचान और अलग संख्या दोनों स्पष्ट रखे गए हैं।
