revisions:
- from: तब शाऊल ने केनी लोगों से कहा, “जाओ, हट जाओ, अमालेकियों के बीच से निकल जाओ, कहीं ऐसा न हो कि मैं तुम्हें भी उनके साथ मिटा दूँ। क्योंकि जब इस्राएली मिस्र से निकलकर ऊपर आए थे, तब तुमने उन सब पर कृपा की थी।” तब केनी लोग अमालेकियों के बीच से हट गए।
  to: तब शाऊल ने केनी लोगों से कहा, “जाओ, अलग हो जाओ, अमालेकियों के बीच से नीचे उतर जाओ; कहीं मैं तुम्हें उनके साथ नाश न कर दूँ। क्योंकि जब इस्राएली मिस्र से ऊपर आए थे, तब तुमने इस्राएल के सभी लोगों के साथ भलाई की थी।” तब केनी लोग अमालेकियों के बीच से अलग हो गए।
