source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֣וּל אֶֽל הַ/קֵּינִ֡י לְכוּ֩ סֻּ֨רוּ רְד֜וּ מִ/תּ֣וֹךְ עֲמָלֵקִ֗י פֶּן אֹֽסִפְ/ךָ֙ עִמּ֔/וֹ וְ/אַתָּ֞ה עָשִׂ֤יתָה חֶ֨סֶד֙ עִם כָּל בְּנֵ֣י יִשְׂרָאֵ֔ל בַּ/עֲלוֹתָ֖/ם מִ/מִּצְרָ֑יִם וַ/יָּ֥סַר קֵינִ֖י מִ/תּ֥וֹךְ עֲמָלֵֽק־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/006.yaml
  text: Then Saul said to the Kenite[a], “Go, turn aside, go down from among the Amalekites, lest I sweep you away with them[c][b]. For you showed kindness to all the sons of Israel when they came up from Egypt.” So the Kenite turned aside from among the Amalekites.
translation:
  language: hi
  text: तब शाऊल ने केनी लोगों से कहा, “जाओ, अलग हो जाओ, अमालेकियों के बीच से नीचे उतर जाओ; कहीं मैं तुम्हें उनके साथ नाश न कर दूँ। क्योंकि जब इस्राएली मिस्र से ऊपर आए थे, तब तुमने इस्राएल के सभी लोगों के साथ भलाई की थी।” तब केनी लोग अमालेकियों के बीच से अलग हो गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַקֵּינִי / קֵינִי
  choice: केनी लोग
  rationale: हिब्रू में एकवचन जातिवाचक रूप सामूहिक अर्थ में प्रयुक्त है; हिन्दी में पूरे समुदाय को संबोधित करने वाले बहुवचन आदेशों और अंतिम क्रिया के साथ ‘केनी लोग’ स्वाभाविक और स्पष्ट है।
- source_word: לְכוּ סֻּרוּ רְדוּ
  choice: जाओ, हट जाओ, ... निकल जाओ
  rationale: तीनों बहुवचन आदेशों की तात्कालिकता और अलग होने की गति को वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त किया गया है; ‘निकल जाओ’ בתוך के साथ अभिप्रेत समुदाय के बीच से प्रस्थान स्पष्ट करता है।
- source_word: מִתּוֹךְ עֲמָלֵקִי / מִתּוֹךְ עֲמָלֵק
  choice: अमालेकियों के बीच से
  rationale: पहला जातिवाचक और अंतिम सामूहिक नाम दोनों यहाँ अमालेकी समुदाय को सूचित करते हैं; एक ही हिन्दी रूप प्रसंग की स्पष्टता और पुनरावृत्ति बनाए रखता है।
- source_word: פֶּן אֹסִפְךָ עִמּוֹ
  choice: कहीं ऐसा न हो कि मैं तुम्हें भी उनके साथ मिटा दूँ
  rationale: न्याय के प्रसंग में אסף केवल ‘इकट्ठा करना’ नहीं, साथ में हटा या नष्ट कर देना व्यक्त कर सकता है। ‘मिटा दूँ’ चेतावनी का आशय स्पष्ट करता है, जबकि ‘कहीं ऐसा न हो’ פן की आशंकात्मक शक्ति रखता है।
- source_word: חֶסֶד
  choice: कृपा
  rationale: इस मानवीय ऐतिहासिक प्रसंग में חסד हितकारी दया और निष्ठापूर्ण भलाई को दर्शाता है। ‘कृपा’ हिन्दी में गरिमापूर्ण और सहज है तथा किसी औपचारिक वाचा-संबंध को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: כָּל בְּנֵי יִשְׂרָאֵל
  choice: उन सब [इस्राएलियों]
  rationale: בני ישראל एक प्रचलित राष्ट्रीय पद है। हिन्दी में ‘इस्राएली’ पूरे समुदाय का स्वाभाविक और समावेशी नाम है; ‘उन सब’ כל को सुरक्षित रखता है और अनावश्यक शाब्दिक कठोरता से बचता है।
- source_word: בַּעֲלוֹתָם מִמִּצְרָיִם
  choice: जब इस्राएली मिस्र से निकलकर ऊपर आए थे
  rationale: עלה की ऊपर आने की ठोस दिशा को रखा गया है और ‘निकलकर’ निर्गमन-संदर्भ को हिन्दी पाठक के लिए स्पष्ट बनाता है।
- source_word: וַיָּסַר
  choice: हट गए
  rationale: यह उसी סור धातु को दोहराता है जो आदेश में आई है; ‘हट जाओ/हट गए’ से आदेश और उसके पालन का शब्दगत संबंध बना रहता है।
theological_decisions:
- issue: חֶסֶד का अर्थ
  choice: कृपा
  alternative: दयालुता; निष्ठा; वाचा की निष्ठा
  rationale: यहाँ केनियों द्वारा इस्राएल के प्रति किए गए ऐतिहासिक उपकार की बात है। ‘कृपा’ शब्द अर्थ की नैतिक और संबंधपरक गरिमा रखता है, पर पाठ में स्पष्ट न की गई औपचारिक वाचा को नहीं जोड़ता।
- issue: בְּנֵי יִשְׂרָאֵל का राष्ट्रीय प्रयोग
  choice: इस्राएली
  alternative: इस्राएल के पुत्र; इस्राएल के सब लोग
  rationale: यह पद पूरे राष्ट्र के लिए रूढ़ जातीय अभिव्यक्ति है, केवल पुरुष वंशजों के लिए नहीं। ‘इस्राएली’ मूल के सामूहिक आशय को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
- issue: אָסַף का न्याय-संदर्भ
  choice: मिटा दूँ
  alternative: समेट लूँ; बहा ले जाऊँ; नष्ट कर दूँ
  rationale: संदर्भ अमालेक पर आने वाले संहार का है। ‘मिटा दूँ’ उनके साथ उसी दण्ड में पड़ जाने का भाव देता है, यद्यपि मूल क्रिया में हटाए या समेटे जाने का बिंब भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। सामूहिक एकवचन जातिवाचक रूप को हिन्दी में ‘केनी लोग’ किया गया है क्योंकि मूल के बहुवचन आदेश पूरे समुदाय को संबोधित करते हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई; मूल की प्रमुख अर्थगत संभावनाएँ अनुवाद-निर्णयों में दर्ज हैं।
