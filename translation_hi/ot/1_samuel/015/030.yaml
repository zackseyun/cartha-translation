source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר חָטָ֔אתִי עַתָּ֗ה כַּבְּדֵ֥/נִי נָ֛א נֶ֥גֶד זִקְנֵֽי עַמִּ֖/י וְ/נֶ֣גֶד יִשְׂרָאֵ֑ל וְ/שׁ֣וּב עִמִּ֔/י וְ/הִֽשְׁתַּחֲוֵ֖יתִי לַֽ/יהוָ֥ה אֱלֹהֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/030.yaml
  text: And he said[a], “I have sinned. Now please honor me before the elders of my people and before Israel, and return with me, so that I may bow down to Yahweh your God.”
translation:
  language: hi
  text: उसने कहा, “मैंने पाप किया है। अब कृपा करके मेरी प्रजा के बुज़ुर्गों और इस्राएल के सामने मुझे सम्मान दीजिए और मेरे साथ लौटिए, ताकि मैं आपके परमेश्वर याहवे को दण्डवत करूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और मैं आपके परमेश्वर याहवे को दण्डवत करूँगा।” हिब्रू रूप को साधारण क्रम (“और मैं ... करूँगा”) या पिछले निवेदन के उद्देश्य (“ताकि मैं ... करूँ”) के रूप में समझा जा सकता है।
    reason: वाक्यगत और अर्थगत विकल्प
lexical_decisions:
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: काल पूर्ण किए गए पाप को दर्शाता है जिसकी वर्तमान स्थिति में सीधी प्रासंगिकता है; हिन्दी पूर्ण वर्तमान स्वाभाविक स्वीकारोक्ति देता है।
- source_word: כַּבְּדֵנִי נָא
  choice: कृपा करके ... मेरा सम्मान कीजिए
  rationale: पिएल आज्ञार्थक यहाँ सार्वजनिक सामाजिक सम्मान की माँग करता है; נָא को विनम्र निवेदन ‘कृपा करके’ से व्यक्त किया गया है।
- source_word: נֶגֶד זִקְנֵי עַמִּי וְנֶגֶד יִשְׂרָאֵל
  choice: मेरी प्रजा के पुरनियों और इस्राएल के सामने
  rationale: נֶגֶד सार्वजनिक उपस्थिति और दृष्टि का भाव देता है। ‘मेरी प्रजा’ में शाऊल का मूल स्वत्वबोध सुरक्षित है, और ‘सब’ नहीं जोड़ा गया।
- source_word: וְשׁוּב עִמִּי
  choice: और मेरे साथ लौटिए
  rationale: שׁוב का मूल भाव लौटना है; निवेदन का संबोधन सम्मानसूचक बहुवचन क्रिया से स्वाभाविक हिन्दी में व्यक्त हुआ है।
- source_word: וְהִשְׁתַּחֲוֵיתִי
  choice: ताकि मैं ... दण्डवत करूँ
  rationale: क्रिया शारीरिक रूप से झुकने या दण्डवत करने को बताती है और इस प्रसंग में आराधना भी निहित है। ‘दण्डवत’ उस शारीरिक अभिव्यक्ति को बनाए रखता है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: आपके परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को स्पष्ट रूप से सुरक्षित रखा गया है; शाऊल इसे ‘हमारे परमेश्वर’ नहीं कहता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे उपस्थित है; लिप्यंतरण उसे सामान्य उपाधि में बदलने से बचाता है।
- issue: אֱלֹהֶיךָ में ‘आपके परमेश्वर’
  choice: आपके परमेश्वर
  alternative: हमारे परमेश्वर; परमेश्वर
  rationale: द्वितीय पुरुष प्रत्यय शाऊल की भाषा में विद्यमान कथात्मक और धर्मवैज्ञानिक तनाव को बनाए रखता है।
- issue: וְהִשְׁתַּחֲוֵיתִי का वाक्यगत संबंध
  choice: उद्देश्य—‘ताकि मैं ... दण्डवत करूँ’
  alternative: सरल क्रम—‘और मैं ... दण्डवत करूँगा’
  rationale: पूर्ववर्ती आज्ञार्थक निवेदन के बाद यह रूप उद्देश्य व्यक्त कर सकता है; चूँकि हिब्रू साधारण क्रम भी स्वीकार करता है, विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पुरनियों’ बाइबलीय-सामुदायिक पद को संक्षेप में व्यक्त करता है; ‘दण्डवत’ शारीरिक झुकाव और आराधना, दोनों का प्रसंगानुकूल भाव सुरक्षित रखता है।
