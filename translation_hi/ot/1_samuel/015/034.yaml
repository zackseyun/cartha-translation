translation:
  language: hi
  text: तब शमूएल रामा चला गया, और शाऊल चढ़कर अपने घर चला गया, जो शाऊल के गिबा में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: कथात्मक क्रम में הלך का सामान्य अर्थ ‘जाना’ है; ‘चला गया’ आधुनिक हिन्दी में प्रस्थान का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָרָמָתָה
  choice: रामा
  rationale: स्थान-नाम से जुड़ा दिशासूचक ה गति को रामा की ओर दर्शाता है; हिन्दी में क्रिया ‘चला गया’ के साथ बिना परसर्ग के ‘रामा’ स्वाभाविक रूप से गंतव्य बताता है।
- source_word: עָלָה
  choice: चढ़कर … गया
  rationale: עלה में ‘ऊपर जाना/चढ़ना’ का स्थलाकृतिक भाव हो सकता है। ‘चढ़कर … गया’ उस भाव को बनाए रखते हुए हिन्दी वाक्य को स्वाभाविक रखता है।
- source_word: בֵּיתוֹ
  choice: अपने घर
  rationale: בַּיִת पर तृतीय पुरुष एकवचन प्रत्यय का अर्थ ‘उसका घर’ है; वाक्य के कर्ता शाऊल की ओर संकेत करने के लिए हिन्दी में ‘अपने घर’ अधिक स्वाभाविक है।
- source_word: גִּבְעַת שָׁאוּל
  choice: शाऊल के गिबा
  rationale: इब्रानी संबंधवाचक संरचना को बनाए रखते हुए स्थान-नाम का लिप्यंतरण किया गया है। यह अभिव्यक्ति इस अस्पष्टता को नहीं मिटाती कि यह स्वामित्वसूचक वर्णन है या स्थापित स्थान-नाम।
