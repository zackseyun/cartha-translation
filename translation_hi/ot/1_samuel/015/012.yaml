  text: Samuel rose early in the morning to meet Saul[a], and it was reported to Samuel, saying, “Saul came to Carmel, and look, he has set up a monument for himself; then he turned and passed on and went down to Gilgal.”
translation:
  language: hi
  text: शमूएल सुबह तड़के शाऊल से मिलने के लिए उठा। तब शमूएल को यह समाचार दिया गया, “शाऊल कर्मेल आया था और देखो, उसने अपने लिए एक स्मारक खड़ा किया है[a]। फिर वह मुड़कर आगे बढ़ा और गिलगाल की ओर नीचे उतर गया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “अपने लिए एक हाथ।” यहाँ “हाथ” एक यादगार चिह्न या स्मारक के अर्थ में मुहावरे के रूप में प्रयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם ... בַּבֹּקֶר
  choice: सवेरे जल्दी उठा
  rationale: हिफ़ील क्रिया और कालवाचक पद मिलकर भोर में जल्दी उठने पर बल देते हैं; यह हिंदी में स्वाभाविक और अर्थनिष्ठ है।
- source_word: לִקְרַאת שָׁאוּל
  choice: शाऊल से मिलने चला
  rationale: ल उपसर्ग उद्देश्य व्यक्त करता है। केवल ‘मिलने’ की अपेक्षा ‘मिलने चला’ यात्रा के आशय को हिंदी में सहज बनाता है।
- source_word: וַיֻּגַּד לִשְׁמוּאֵל
  choice: शमूएल को यह समाचार दिया गया
  rationale: मूल का कर्मवाच्य समाचार देने वाले को अनिर्दिष्ट रखता है; हिंदी अनुवाद भी किसी कर्ता को नहीं जोड़ता।
- source_word: וְהִנֵּה מַצִּיב
  choice: और देखो, उसने ... खड़ा किया है
  rationale: ‘देखो’ ध्यान आकर्षित करने वाले कण की शक्ति रखता है, और पूर्ण वर्तमान कृदंत से व्यक्त परिणामी स्थिति को स्वाभाविक हिंदी में सामने लाता है।
- source_word: יָד
  choice: स्मारक
  rationale: शाब्दिक अर्थ ‘हाथ’ है, पर यहाँ इसका मुहावरेदार अर्थ किसी यादगार चिह्न या स्मारक से है।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: प्रसंग में यह शाऊल के स्वयं अपने लिए स्मारक बनवाने का आत्मवाची भाव व्यक्त करता है।
- source_word: וַיִּסֹּב וַיַּעֲבֹר
  choice: फिर वह मुड़कर आगे बढ़ा
  rationale: दोनों यात्रा-क्रियाओं का क्रम सुरक्षित रखते हुए हिंदी में सहज गति व्यक्त की गई है।
- source_word: וַיֵּרֶד הַגִּלְגָּל
  choice: गिलगाल को उतर गया
  rationale: ‘उतर गया’ स्थलाकृतिक अधोगमन को बनाए रखता है; ‘को’ गंतव्य को स्पष्ट करता है।
