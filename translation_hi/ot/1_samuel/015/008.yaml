  yaml_path: translation/ot/1_samuel/015/008.yaml
  text: He captured Agag king of Amalek alive[a], and devoted all the people to destruction with the edge of the sword.
translation:
  language: hi
  text: उसने अमालेक के राजा अगाग को जीवित पकड़ लिया, और समस्त लोगों को तलवार की धार से विनाश के लिए समर्पित कर दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “समस्त लोगों को पूरी तरह नष्ट कर दिया।” यहाँ प्रयुक्त इब्रानी क्रिया किसी व्यक्ति या वस्तु को प्रतिबंध के अधीन विनाश के लिए समर्पित करने का भाव रखती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפֹּשׂ
  choice: पकड़ लिया
  rationale: यह क्रिया किसी को अपने अधिकार में लेने या पकड़ने को दर्शाती है; युद्ध के प्रसंग में यह सहज और सटीक है।
- source_word: אֲגַג
  choice: अगाग
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: מֶלֶךְ עֲמָלֵק
  choice: अमालेक के राजा
  rationale: इब्रानी संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: חָי
  choice: जीवित
  rationale: यह स्पष्ट करता है कि अगाग मारा नहीं गया, बल्कि जीवित पकड़ा गया।
- source_word: כָּל הָעָם
  choice: समस्त लोगों
  rationale: עָם का व्यापक अर्थ ‘लोग/जन’ है। युद्ध के संदर्भ के बावजूद ‘सेना’ जैसे अधिक विशिष्ट अर्थ को पाठ पर आरोपित नहीं किया गया।
- source_word: הֶחֱרִים
  choice: विनाश के लिए समर्पित कर दिया
  rationale: हिफ़ील रूप חרם के उस भाव को बनाए रखता है जिसमें किसी को प्रतिबंध के अधीन विनाश के लिए ठहराया जाता है; केवल ‘नष्ट कर दिया’ कहने से इसका धार्मिक-संधिगत आयाम दब सकता है।
- source_word: לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: शाब्दिक मुहावरा ‘तलवार के मुँह से’ है; ‘तलवार की धार से’ हिन्दी में स्वाभाविक रहते हुए मूल बिंब को सुरक्षित रखता है।
theological_decisions:
- issue: חרם से जुड़ी युद्ध-विषयक भाषा
  choice: विनाश के लिए समर्पित कर दिया
  alternative: पूरी तरह नष्ट कर दिया; विनाश के प्रतिबंध के अधीन कर दिया
  rationale: चुना हुआ रूप मूल शब्द की धार्मिक और युद्ध-संबंधी गंभीरता को बनाए रखता है, पर अत्यधिक तकनीकी ‘प्रतिबंध’ भाषा से बचता है। पादटिप्पणी अधिक सहज वैकल्पिक अर्थ बताती है।
- issue: अगाग और अन्य लोगों के बीच विरोध
  choice: पर
  alternative: और
  rationale: मूल וְ सामान्यतः ‘और’ है, किंतु अगाग को जीवित रखने और शेष लोगों को विनाश के लिए समर्पित करने के अर्थगत विरोध को हिन्दी में ‘पर’ स्वाभाविक रूप से स्पष्ट करता है, बिना घटना की विषयवस्तु बदले।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘तलवार की धार’ मूल मुहावरे का बिंब बचाती है, जबकि ‘विनाश के लिए समर्पित’ חרם की विशिष्ट अर्थ-छाया को पूरी तरह साधारण सैन्य हत्या में नहीं बदलता।
