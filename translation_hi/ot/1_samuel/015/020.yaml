  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל שְׁמוּאֵ֗ל אֲשֶׁ֤ר שָׁמַ֨עְתִּי֙ בְּ/ק֣וֹל יְהוָ֔ה וָ/אֵלֵ֕ךְ בַּ/דֶּ֖רֶךְ אֲשֶׁר שְׁלָחַ֣/נִי יְהוָ֑ה וָ/אָבִ֗יא אֶת אֲגַג֙ מֶ֣לֶךְ עֲמָלֵ֔ק וְ/אֶת עֲמָלֵ֖ק הֶחֱרַֽמְתִּי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/020.yaml
  text: Saul said to Samuel[a], “But I did obey the voice of Yahweh, and I went on the way that Yahweh sent me, and I brought Agag king of Amalek[b], and I devoted Amalek to destruction.”
translation:
  language: hi
  text: शाऊल ने शमूएल से कहा, “परन्तु मैंने तो याहवे की वाणी मानी[a] और उस मार्ग पर चला, जिस पर याहवे ने मुझे भेजा था। मैं अमालेक के राजा अगाग को ले आया, और अमालेक को विनाश के लिए समर्पित कर दिया[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे की वाणी सुनी।” इस हिब्रू मुहावरे का अर्थ उसकी आज्ञा मानना है।
    reason: lexical_alternative
  - marker: b
    text: या, “अमालेक का पूरी तरह विनाश कर दिया,” अथवा “अमालेक को प्रतिबंध के अधीन कर दिया।” हिब्रू क्रिया में किसी वस्तु या जनसमूह को विनाश के लिए समर्पित करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁמַעְתִּי בְּקוֹל
  choice: मैंने तो ... की वाणी मानी
  rationale: שׁמע בקול का अर्थ किसी की वाणी सुनकर उसका कहना मानना है। ‘तो’ प्रसंग में शाऊल के प्रतिवाद और आत्मरक्षा के बल को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वाणी मानी’ मूल मुहावरे को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित विद्वतापूर्ण उच्चारण का लिप्यंतरण किया गया है।
- source_word: וָאֵלֵךְ בַּדֶּרֶךְ
  choice: उस मार्ग पर चला
  rationale: मूल का मार्ग-संबंधी रूपक सुरक्षित है और यह आधुनिक हिन्दी में सहज है; ‘अभियान पूरा किया’ अधिक व्याख्यात्मक होता।
- source_word: אֲשֶׁר שְׁלָחַנִי יְהוָה
  choice: जिस पर याहवे ने मुझे भेजा था
  rationale: सम्बन्धवाचक उपवाक्य को ‘मार्ग’ से स्पष्ट रूप से जोड़ा गया है और भेजे जाने का भाव अक्षुण्ण रखा गया है।
- source_word: וָאָבִיא
  choice: मैं ... ले आया
  rationale: בוא के हिफ़ील रूप का सीधा अर्थ किसी को लाना है। प्रसंग और हिन्दी की स्वाभाविक दिशा के अनुसार ‘ले आया’ उपयुक्त है, बिना ‘वापस’ जैसा अनुल्लिखित तत्व जोड़े।
- source_word: אֲגַג מֶלֶךְ עֲמָלֵק
  choice: अमालेक के राजा अगाग
  rationale: हिब्रू के समानाधिकरण को हिन्दी की स्वाभाविक संबंध-रचना में व्यक्त किया गया है।
- source_word: הֶחֱרַמְתִּי
  choice: विनाश के लिए समर्पित कर दिया
  rationale: חרם के हिफ़ील रूप में प्रतिबंध के अधीन करके विनाश हेतु अर्पित करने का न्यायिक-धार्मिक भाव है। यह अनुवाद केवल ‘नष्ट किया’ की तुलना में उस विशेष अर्थ को अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: וְאֶת עֲמָלֵק
  choice: अमालेक
  rationale: मूल में एकवचन जातिनाम है, जो सामूहिक रूप से लोगों या राष्ट्र का बोध कराता है; इसलिए उसे ‘अमालेकी’ में विस्तार नहीं दिया गया।
theological_decisions:
- issue: पवित्र युद्ध के प्रसंग में חרם का अनुवाद
  choice: अमालेक को विनाश के लिए समर्पित कर दिया
  alternative: अमालेक का पूरी तरह विनाश कर दिया; अमालेक को प्रतिबंध के अधीन कर दिया
  rationale: चुना हुआ रूप विनाश की सम्पूर्णता के साथ חרם के समर्पण/प्रतिबंध वाले धार्मिक-न्यायिक आयाम को भी रखता है, पर मुख्य पाठ में अतिरिक्त धर्मवैज्ञानिक व्याख्या नहीं जोड़ता।
- issue: शाऊल के आत्मरक्षात्मक प्रतिवाद का बल
  choice: नहीं, मैंने तो ... वाणी मानी
  alternative: मैंने ... की वाणी मानी; सचमुच मैंने ... की वाणी मानी
  rationale: प्रसंग में शाऊल शमूएल के आरोप का विरोध कर रहा है। ‘नहीं’ और ‘तो’ उस प्रतिवादी बल को स्वाभाविक हिन्दी में प्रकट करते हैं, जबकि उसके दावे को कथावाचक की पुष्टि के रूप में प्रस्तुत नहीं करते।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। ‘याहवे’ व्यक्तिगत नाम का लिप्यंतरण है। ‘नहीं, मैंने तो’ शाऊल के रक्षात्मक प्रतिवाद को दर्शाता है, पर उसके कथन की सत्यता पर कथावाचकीय निर्णय नहीं देता। सभी पाद-टिप्पणी चिह्न संबंधित पदबंधों के तुरंत बाद रखे गए हैं।
