lexical_decisions:
- source_word: וַיְהִי
  choice: तब ... पहुँचा
  rationale: वाव-क्रमिक रूप कथा में अगली घटना प्रस्तुत करता है; आधुनिक हिन्दी में यह संरचना क्रम और आगमन दोनों को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: דְּבַר
  choice: वचन
  rationale: भविष्यद्वाणी-सूत्र में यह परमेश्वर से प्राप्त कथन या संदेश को दर्शाता है; ‘वचन’ मूल पद से औपचारिक संबंध बनाए रखता है और हिन्दी बाइबलीय भाषा में परिचित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है; इसे केवल किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֶל
  choice: के पास
  rationale: यहाँ पूर्वसर्ग दिव्य वचन के प्राप्तकर्ता को बताता है; ‘शमूएल के पास पहुँचा’ स्वाभाविक हिन्दी है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप रखा गया है।
- source_word: לֵאמֹר
  choice: '[अगले कथन को आरम्भ करने वाला विराम-चिह्न]'
  rationale: यह रूप आने वाली प्रत्यक्ष वाणी का परिचय देता है। अकेले पद में हिन्दी का द्विबिंदु ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक है और उसी कार्य को निभाता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का स्पष्ट प्रयोग करता है। हिन्दी पाठकों के लिए स्थापित नामरूप ‘यहोवा’ व्यक्तिगत नाम को सुरक्षित रखता है; पादटिप्पणी मूल व्यंजनरूप YHWH और पारंपरिक ‘प्रभु’ प्रस्तुति स्पष्ट करती है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘वचन’ भविष्यद्वाणी-सूत्र की औपचारिकता बनाए रखता है, जबकि ‘के पास पहुँचा’ अप्रचलित ‘ऐसा हुआ कि’ से बचता है।
