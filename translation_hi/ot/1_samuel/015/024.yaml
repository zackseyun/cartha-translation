  yaml_path: translation/ot/1_samuel/015/024.yaml
  text: Then Saul said to Samuel[a], “I have sinned, for I transgressed the command of Yahweh and your words[b], for I feared the people and listened to their voice.”
translation:
  language: hi
  text: तब शाऊल ने शमूएल से कहा, “मैंने पाप किया है, क्योंकि मैंने यहोवा की आज्ञा[a] और आपकी बातों का उल्लंघन किया, और क्योंकि मैं लोगों से डर गया और उनकी बात मान ली[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “यहोवा का मुख।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उनकी आवाज़ सुनी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: इब्रानी पूर्ण क्रिया बीते हुए अपराध की वर्तमान स्वीकारोक्ति व्यक्त करती है; यह हिंदी रूप उस भाव को स्वाभाविक ढंग से रखता है।
- source_word: עָבַרְתִּי
  choice: उल्लंघन किया
  rationale: मूल क्रिया का अर्थ सीमा या आदेश को पार करना है; यहाँ यह परमेश्वर के निर्देश का नैतिक उल्लंघन बताती है।
- source_word: פִּי יְהוָה
  choice: यहोवा की आज्ञा
  rationale: शाब्दिक अर्थ ‘यहोवा का मुँह’ है, पर प्रसंग में यह उसके मुख से दी गई आज्ञा का इब्रानी मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को प्रचलित और गरिमापूर्ण हिंदी रूप ‘यहोवा’ में रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דְּבָרֶיךָ
  choice: आपकी बातों
  rationale: बहुवचन और द्वितीय पुरुष एकवचन का सम्मानसूचक हिंदी रूप मूल व्याकरण तथा शमूएल को संबोधन दोनों को सुरक्षित रखता है।
- source_word: יָרֵאתִי אֶת הָעָם
  choice: मैं लोगों से डर गया
  rationale: यह सहज आधुनिक हिंदी में भय की क्रिया और उसके लक्ष्य को स्पष्ट रखता है; ‘लोग’ मूल के व्यापक הָעָם के अनुरूप है।
- source_word: וָאֶשְׁמַע בְּקוֹלָם
  choice: और उनकी बात मान ली
  rationale: शाब्दिक ‘उनकी आवाज़ सुनी’ यहाँ आज्ञापालन का मुहावरा है। मुख्य पाठ में स्वाभाविक हिंदी दी गई है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम ही बनाए रखता है; प्राचीन उच्चारण पूर्णतः निश्चित नहीं है।
- issue: פִּי יְהוָה का मुहावरा
  choice: यहोवा की आज्ञा
  alternative: यहोवा का मुँह / यहोवा का वचन
  rationale: प्रसंग एक विशिष्ट दैवी आदेश के उल्लंघन का है। ‘आज्ञा’ मुहावरे का अभिप्राय स्पष्ट करती है, जबकि शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: וָאֶשְׁמַע בְּקוֹלָם में सुनने और मानने का संबंध
  choice: उनकी बात मान ली
  alternative: उनकी आवाज़ सुनी
  rationale: इब्रानी में किसी की आवाज़ सुनना प्रायः उसकी बात मानने को व्यक्त करता है। हिंदी में अर्थ-स्पष्ट रूप चुना गया, पर मूल बिंब पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप। शाऊल द्वारा शमूएल को संबोधित करते समय ‘आपकी’ सम्मानसूचक है। दोनों כִּי खंडों को हिंदी प्रवाह के अनुसार ‘क्योंकि’ और अगले स्वतंत्र स्पष्टीकरण में बिना अनावश्यक पुनरावृत्ति के व्यक्त किया गया है।
