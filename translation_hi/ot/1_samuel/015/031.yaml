  text: So Samuel went back after Saul[a], and Saul bowed down to Yahweh.
translation:
  language: hi
  text: तब शमूएल शाऊल के पीछे-पीछे लौट गया, और शाऊल ने यहोवा को दण्डवत किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की आराधना की।” इब्रानी क्रिया प्रसंग के अनुसार दण्डवत करने या आराधना करने का अर्थ दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשָׁב
  choice: लौट गया
  rationale: שׁוב यहाँ कथा-क्रम में लौटने की क्रिया व्यक्त करता है और पद 26 में शमूएल के इनकार के बाद उसके निर्णय के उलटने को बनाए रखता है।
- source_word: אַחֲרֵי
  choice: के पीछे-पीछे
  rationale: मूल अर्थ ‘पीछे/के बाद’ है। इस प्रसंग में यह बताता है कि शमूएल शाऊल के पीछे गया और उसके साथ वापस हुआ; ‘पीछे-पीछे’ इस गति को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַיִּשְׁתַּחוּ
  choice: झुककर दण्डवत किया
  rationale: שׁחה शरीर झुकाने या भूमि पर दण्डवत करने की क्रिया बताता है और प्रसंगानुसार आराधना भी व्यक्त कर सकता है। मुख्य पाठ में ठोस शारीरिक क्रिया रखी गई है, जबकि आराधना का अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: ל उपसर्ग क्रिया की दिशा या जिसके प्रति दण्डवत किया गया उसे दर्शाता है। हिन्दी में ‘के सामने’ श्रद्धापूर्वक झुकने की दिशा को स्वाभाविक रूप से व्यक्त करता है; יהוה को ‘यहोवा’ लिखा गया है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: हिन्दी में प्रचलित नाम-रूप, जो इब्रानी उच्चारण के निकट है।
theological_decisions:
- issue: क्या וַיִּשְׁתַּחוּ को स्पष्ट रूप से ‘आराधना की’ कहा जाए या शारीरिक क्रिया के रूप में अनूदित किया जाए
  choice: मुख्य पाठ में ‘झुककर दण्डवत किया’
  alternative: ‘यहोवा की आराधना की’
  rationale: क्रिया झुकने या दण्डवत करने के साथ-साथ प्रसंग में आराधना का अर्थ भी दे सकती है। यहोवा इस क्रिया का लक्ष्य है, इसलिए आराधना निहित है; फिर भी मुख्य पाठ शारीरिक क्रिया को सामने रखकर मूल की अर्थगत व्यापकता बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पीछे-पीछे लौट गया’ कथा की गति को स्वाभाविक हिन्दी में व्यक्त करता है, और ‘झुककर दण्डवत किया’ मूल क्रिया के शारीरिक तथा धार्मिक दोनों आयामों के लिए स्थान छोड़ता है।
