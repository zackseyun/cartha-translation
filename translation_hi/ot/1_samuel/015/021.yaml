base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/021.yaml
  text: But the people took from the spoil sheep and cattle[a], the best of what had been devoted to destruction[c][b], to sacrifice to Yahweh your God at Gilgal.
translation:
  language: hi
  text: परन्तु लोगों ने लूट[a] में से भेड़-बकरियाँ और गाय-बैल लिए—विनाश के लिए समर्पित पशुओं में से सबसे अच्छे[b]—ताकि वे उन्हें गिलगाल में यहोवा, तुम्हारे परमेश्वर के लिए बलि चढ़ाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात युद्ध में प्राप्त लूटी हुई संपत्ति।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “विनाश के लिए समर्पित वस्तुओं का पहला/उत्तम भाग।” ये पशु विनाश के अधीन थे और इन्हें बचाकर नहीं रखना था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: परन्तु ... ले लिए
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। आरम्भिक וַ को प्रसंग में शाऊल के पिछले दावे के विपरीत उत्तर के रूप में ‘परन्तु’ से व्यक्त किया गया है। सामूहिक कर्ता ‘लोगों’ के अनुसार हिन्दी में बहुवचन क्रिया स्वाभाविक है।
- source_word: הָעָם
  choice: लोगों
  rationale: עם का मूल अर्थ ‘लोग’ है। यहाँ इससे शाऊल के सैनिक अभिप्रेत हैं, पर ‘लोगों’ रखने से दोष उन्हीं पर डालने की उसकी बयानबाजी सुरक्षित रहती है।
- source_word: מֵהַשָּׁלָל
  choice: लूट में से
  rationale: שׁלל युद्ध में प्राप्त लूटी हुई संपत्ति को दर्शाता है। ‘लूट’ आधुनिक हिन्दी में स्पष्ट और संक्षिप्त है।
- source_word: צֹאן וּבָקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: यह युग्म छोटे और बड़े पालतू पशुओं को दर्शाता है। हिन्दी में ये सामूहिक जोड़े सामान्य पाठक को पशुओं की दोनों श्रेणियाँ स्पष्ट करते हैं।
- source_word: רֵאשִׁית
  choice: सबसे उत्तम पशु
  rationale: רֵאשִׁית का मूल अर्थ ‘पहला/आरम्भिक भाग’ हो सकता है, किन्तु लूट के पशुओं के इस प्रसंग में इसका भाव चुनिंदा या उत्तम भाग है। पादटिप्पणी मूल शब्द की अर्थ-व्याप्ति सुरक्षित रखती है।
- source_word: הַחֵרֶם
  choice: विनाश के लिए समर्पित वस्तुएँ
  rationale: חֵרֶם उन व्यक्तियों या वस्तुओं को सूचित करता है जो परमेश्वर के लिए अलग करके विनाश के अधीन रखे गए हों। यह रूप सामान्य पाठक के लिए अर्थ खोलता है और केवल तकनीकी शब्द ‘प्रतिबंध’ पर निर्भर नहीं रहता।
- source_word: לִזְבֹּחַ
  choice: ताकि ... बलि चढ़ाएँ
  rationale: यह उद्देश्यसूचक क्रियार्थक रूप है; ‘ताकि ... बलि चढ़ाएँ’ हिन्दी में उद्देश्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से दिया गया है; पादटिप्पणी इसकी पहचान स्पष्ट करती है।
- source_word: אֱלֹהֶיךָ
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय को ठीक-ठीक रखा गया है। शाऊल का शमूएल से ‘तुम्हारे परमेश्वर’ कहना संभावित दूरी का भाव रखता है, पर अनुवाद उस भाव की व्याख्या नहीं जोड़ता।
- source_word: בַּגִּלְגָּל
  choice: गिलगाल में
  rationale: स्थानवाचक בְּ को हिन्दी में स्वाभाविक ‘में’ से व्यक्त किया गया है।
theological_decisions:
- issue: पवित्र युद्ध के प्रसंग में חֵרֶם का अनुवाद
  choice: विनाश के लिए समर्पित वस्तुएँ
  alternative: विनाश के अधीन रखी गई वस्तुएँ; प्रतिबंधित वस्तुएँ
  rationale: 'पाठ का तनाव यह है कि पशु सामान्य लूट नहीं थे: वे परमेश्वर के लिए अलग किए जाने के कारण विनाश के अधीन थे, फिर भी उन्हें बलि के लिए बचा लिया गया। चुना हुआ रूप इस तनाव को बिना नरम किए समझने योग्य बनाता है।'
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठ में परिचित ‘यहोवा’ नाम को रखा गया है और पादटिप्पणी में मूल चार अक्षरों वाले नाम से उसका संबंध बताया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भेड़-बकरियाँ और गाय-बैल’ ठोस पशु-श्रेणियाँ बताता है; ‘विनाश के लिए समर्पित’ חֵרֶם की धार्मिक गंभीरता और कथात्मक विडंबना दोनों बनाए रखता है।
