  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל אֹתִ֨/י שָׁלַ֤ח יְהוָה֙ לִ/מְשָׁחֳ/ךָ֣ לְ/מֶ֔לֶךְ עַל עַמּ֖/וֹ עַל יִשְׂרָאֵ֑ל וְ/עַתָּ֣ה שְׁמַ֔ע לְ/ק֖וֹל דִּבְרֵ֥י יְהוָֽה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/001.yaml
  text: Then Samuel said to Saul[a], “Yahweh sent me to anoint you as king over his people, over Israel. So now, listen to the words of Yahweh.”
translation:
  language: hi
  text: तब शमूएल ने शाऊल से कहा, “याहवे ने मुझे तुम्हारा अभिषेक करने के लिए भेजा था, ताकि तुम उसकी प्रजा, इस्राएल, के ऊपर राजा बनो। इसलिए अब याहवे के वचनों को सुनो[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “याहवे के वचनों की आवाज़ सुनो।” हिब्रू अभिव्यक्ति में केवल सुनना ही नहीं, बल्कि ध्यान देकर मानना भी निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: שְׁמוּאֵל ... שָׁאוּל
  choice: शमूएल ... शाऊल
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित और मूल उच्चारण के निकट नाम-रूप।
- source_word: אֹתִי שָׁלַח יְהוָה
  choice: याहवे ने मुझे भेजा था
  rationale: मूल में ‘मुझे’ पर बल है; हिन्दी वाक्य-विन्यास अर्थ को स्वाभाविक रखता है। पूर्ण हुई पिछली नियुक्ति के संदर्भ में ‘भेजा था’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: לִמְשָׁחֳךָ
  choice: तुम्हारा अभिषेक करूँ
  rationale: משׁח राजकीय पद पर नियुक्ति हेतु तेल से अभिषेक को दर्शाता है; ‘अभिषेक’ स्थापित और अर्थपूर्ण हिन्दी शब्द है।
- source_word: לְמֶלֶךְ עַל עַמּוֹ עַל יִשְׂרָאֵל
  choice: अपनी प्रजा इस्राएल पर राजा होने के लिए
  rationale: राजकीय भूमिका और प्रजा पर शासन का अर्थ सुरक्षित है; ‘इस्राएल’ को ‘अपनी प्रजा’ की समानाधिकरणात्मक पहचान के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: पिछली नियुक्ति से वर्तमान आदेश की ओर संक्रमण और निष्कर्षात्मक बल दोनों व्यक्त होते हैं।
- source_word: שְׁמַע לְקוֹל דִּבְרֵי יְהוָה
  choice: याहवे के वचनों पर ध्यान दो
  rationale: मुहावरे का आशय केवल सुनना नहीं, बल्कि ध्यान देकर मानना है। यह हिन्दी में सहज है, जबकि अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: שׁמע में सुनने और आज्ञापालन का संबंध
  choice: ध्यान दो
  alternative: सुनो / वचनों की आवाज़ सुनो
  rationale: हिब्रू आदेश में सुनने के साथ मानने का निहित आह्वान है। ‘ध्यान दो’ इस व्यावहारिक बल को व्यक्त करता है, जबकि शाब्दिक संरचना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज। ‘प्रजा’, ‘राजा’, ‘अभिषेक’ और ‘वचन’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। मूल की पुनरुक्ति ‘अपनी प्रजा, इस्राएल पर’ को हिन्दी में समानाधिकरण द्वारा सहज बनाया गया है।
