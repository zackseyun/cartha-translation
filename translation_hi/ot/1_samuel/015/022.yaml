source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֗ל הַ/חֵ֤פֶץ לַֽ/יהוָה֙ בְּ/עֹל֣וֹת וּ/זְבָחִ֔ים כִּ/שְׁמֹ֖עַ בְּ/ק֣וֹל יְהוָ֑ה הִנֵּ֤ה שְׁמֹ֨עַ֙ מִ/זֶּ֣בַח ט֔וֹב לְ/הַקְשִׁ֖יב מֵ/חֵ֥לֶב אֵילִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/022.yaml
  text: And Samuel said, “Does the LORD delight in burnt offerings and sacrifices as much as in obeying the voice of the LORD? Look, to obey is better than sacrifice, and to listen than the fat of rams.”
translation:
  language: hi
  text: तब शमूएल ने कहा, “क्या यहोवा होमबलियों और बलिदानों से उतना प्रसन्न होता है, जितना यहोवा की वाणी का पालन करने से? देखो, आज्ञा मानना बलिदान से, और ध्यान से सुनना मेढ़ों की चर्बी से उत्तम है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַחֵפֶץ
  choice: क्या ... प्रसन्न होता है
  rationale: यह प्रश्नवाचक रूप में यहोवा की प्रसन्नता या अभिलाषा की तुलना करता है; आधुनिक हिन्दी में ‘प्रसन्न होता है’ स्वाभाविक और स्पष्ट है।
- source_word: עֹלוֹת וּזְבָחִים
  choice: होमबलियों और बलिदानों
  rationale: עֹלוֹת का विशिष्ट अर्थ पूर्णतः जलाई जाने वाली होमबलियाँ है, जबकि זְבָחִים यहाँ व्यापक रूप से बलिदानों को दर्शाता है।
- source_word: שְׁמֹעַ בְּקוֹל
  choice: वाणी मानने
  rationale: इस मुहावरे का आशय केवल सुनना नहीं, बल्कि कही हुई बात के अनुसार चलना है; ‘वाणी मानना’ सुनने और आज्ञापालन दोनों को बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह आगे आने वाले निर्णायक कथन पर ध्यान खींचने वाला संकेतक है।
- source_word: שְׁמֹעַ
  choice: आज्ञा मानना
  rationale: इस प्रसंग में शाऊल की अवज्ञा के विपरीत आज्ञापालन अभिप्रेत है; इसलिए स्वतंत्र प्रयोग में इसका व्यावहारिक अर्थ स्पष्ट किया गया है।
- source_word: לְהַקְשִׁיב
  choice: ध्यान देना
  rationale: यह ध्यानपूर्वक सुनने और ग्रहण करने को व्यक्त करता है तथा समानांतर पंक्ति में שְׁמֹעַ से हल्का शब्दगत भेद बनाए रखता है।
- source_word: חֵלֶב אֵילִים
  choice: मेढ़ों की चर्बी
  rationale: बलिदान में चढ़ाई जाने वाली उत्तम चर्बी का ठोस चित्र मूल के अनुसार सुरक्षित रखा गया है।
theological_decisions:
- issue: बलिदान और आज्ञापालन के बीच संबंध
  choice: तुलना को ‘आज्ञा मानना ... उत्तम है’ के रूप में रखा गया
  alternative: इसे बलिदान-व्यवस्था का पूर्ण निषेध मानकर अनुवाद करना
  rationale: मूल कथन अनुष्ठानिक बलिदान की तुलना आज्ञापालन से करता और आज्ञापालन को श्रेष्ठ बताता है; वह अपने आप में सभी बलिदानों को निरर्थक घोषित नहीं करता।
- issue: दिव्य नाम יהוה
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रत्यक्ष रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के लिए सहज रखी गई है। प्रश्न और उसके उत्तर की काव्यात्मक समानांतरता बनाए रखते हुए ‘वाणी मानने’, ‘आज्ञा मानना’ और ‘ध्यान देना’ से שמע/קשב के अर्थक्षेत्र को स्वाभाविक हिन्दी में व्यक्त किया गया है।
