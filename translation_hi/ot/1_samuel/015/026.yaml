id: 1SA.15.26
reference: 1 Samuel 15:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל שָׁא֔וּל לֹ֥א אָשׁ֖וּב עִמָּ֑/ךְ כִּ֤י מָאַ֨סְתָּה֙ אֶת דְּבַ֣ר יְהוָ֔ה וַ/יִּמְאָסְ/ךָ֣ יְהוָ֔ה מִ/הְי֥וֹת מֶ֖לֶךְ עַל יִשְׂרָאֵֽל־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/026.yaml
  text: And Samuel said to Saul, “I will not return with you, because you have rejected the word of Yahweh, and Yahweh has rejected you from being king over Israel.”
translation:
  language: hi
  text: तब शमूएल ने शाऊल से कहा, “मैं तुम्हारे साथ वापस नहीं जाऊँगा, क्योंकि तुमने याहवे के वचन को अस्वीकार कर दिया है, और याहवे ने तुम्हें इस्राएल पर राजा के रूप में अस्वीकार कर दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथन में ‘तब’ स्वाभाविक है।
- source_word: לֹא אָשׁוּב עִמָּךְ
  choice: मैं तुम्हारे साथ वापस नहीं जाऊँगा
  rationale: שׁוּב का अर्थ लौटना है; हिन्दी में किसी के साथ जाने से इनकार के संदर्भ में यह अभिव्यक्ति स्वाभाविक और स्पष्ट है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शमूएल के इनकार का कारण प्रस्तुत करता है।
- source_word: מָאַסְתָּה / וַיִּמְאָסְךָ
  choice: ठुकरा दिया ... ठुकरा दिया
  rationale: दोनों स्थानों पर एक ही इब्रानी मूल מאס है। समान हिन्दी क्रिया उसकी जानबूझकर की गई पारस्परिकता बनाए रखती है और तिरस्कार सहित अस्वीकार करने का भाव देती है।
- source_word: דְּבַר יְהוָה
  choice: यहोवा के वचन
  rationale: דָּבָר यहाँ परमेश्वर द्वारा दिए गए आदेश/संदेश को दर्शाता है; ‘वचन’ स्रोत की व्यापकता और परिचित बाइबलीय अभिव्यक्ति दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में दिव्य नाम की स्थापित लिप्यंतरण-परंपरा ‘यहोवा’ है; यह उपाधि से बदलने के बजाय मूल पाठ में आए व्यक्तिगत नाम को व्यक्त करती है।
- source_word: מֵהְיוֹת מֶלֶךְ עַל יִשְׂרָאֵל
  choice: इस्राएल पर राजा बने रहने से
  rationale: מִן के साथ היה का क्रियार्थक रूप राजकीय स्थिति से हटाए जाने का भाव देता है। प्रसंग में शाऊल पहले से राजा है, इसलिए ‘बने रहने से’ हिन्दी में आशय स्पष्ट करता है; עַל को ‘पर’ से सुरक्षित रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। हिन्दी पाठकों के लिए प्रचलित और गरिमापूर्ण रूप ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसी स्थानापन्न उपाधि।
- issue: מאס की पारस्परिक पुनरावृत्ति
  choice: दोनों उपवाक्यों में ‘ठुकरा दिया’
  alternative: पहले ‘अवहेलना की’ और फिर ‘अस्वीकार किया’
  rationale: 'एक ही क्रिया की पुनरावृत्ति उस गंभीर पारस्परिकता को उभारती है: शाऊल ने यहोवा का वचन ठुकराया और यहोवा ने शाऊल को राजपद पर बने रहने से ठुकराया।'
- issue: מֵהְיוֹת में पद से निष्कासन का अर्थ
  choice: राजा बने रहने से
  alternative: राजा होने से
  rationale: शाऊल उस समय पहले से राजा था। ‘बने रहने से’ हटाए जाने के अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना यह कहे कि निष्कासन उसी क्षण पूरी तरह क्रियान्वित हो गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण है। ‘तुम’ शमूएल द्वारा शाऊल को किए गए सीधे संबोधन के अनुरूप है। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
