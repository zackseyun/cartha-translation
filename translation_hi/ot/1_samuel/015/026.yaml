  to: तब शमूएल ने शाऊल से कहा, “मैं तुम्हारे साथ वापस नहीं जाऊँगा, क्योंकि तुमने याहवे के वचन को अस्वीकार कर दिया है, और याहवे ने तुम्हें इस्राएल पर राजा के रूप में अस्वीकार कर दिया है।”
