base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/015/009.yaml
  text: But Saul and the people spared Agag and the best of the sheep and cattle[a], and the fattened calves, and the lambs, and all that was good, and they were not willing to devote them to destruction[b]. But every despised and worthless thing they devoted to destruction.
translation:
  language: hi
  text: पर शाऊल और लोगों ने अगाग को, और सबसे अच्छी भेड़-बकरियों, गाय-बैलों, मोटे पशुओं[a], मेढ़ों और हर अच्छी वस्तु को बचा लिया। वे उन्हें विनाश के लिए समर्पित करने को तैयार नहीं हुए[b]। लेकिन हर तुच्छ और बेकार वस्तु को उन्होंने विनाश के लिए समर्पित कर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ अनिश्चित है; इसका अनुवाद ‘दूसरे दर्जे के पशु’ या परंपरागत रूप से ‘मोटे पशु’ भी किया गया है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यह एक तकनीकी पद है, जिसका अर्थ किसी व्यक्ति या वस्तु को विनाश के लिए अलग ठहराना या समर्पित करना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּחְמֹל
  choice: छोड़ दिया
  rationale: यहाँ क्रिया केवल मन में दया अनुभव करने की नहीं, बल्कि आज्ञा के अनुसार नष्ट न करने की वास्तविक कार्रवाई बताती है। ‘छोड़ दिया’ इस परिणाम को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵיטַב הַצֹּאן וְהַבָּקָר
  choice: सबसे अच्छी भेड़-बकरियों, गाय-बैलों
  rationale: מֵיטַב पशुधन के सर्वोत्तम भाग को सूचित करता है। צֹאן छोटे पालतू पशुओं के झुंड और בָּקָר गौवंश को दर्शाता है; हिन्दी के प्रचलित सामूहिक पद इनका स्वाभाविक भेद बनाए रखते हैं।
- source_word: הַמִּשְׁנִים
  choice: मोटे पशुओं
  rationale: यह दुर्लभ और कठिन पशुधन-संबंधी शब्द है। संदर्भ में अच्छे पशुओं की सूची होने के कारण ‘मोटे पशुओं’ को मुख्य पाठ में रखा गया है, जबकि इसकी अनिश्चितता और वैकल्पिक समझ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הַכָּרִים
  choice: मेढ़ों
  rationale: यह शब्द सामान्यतः नर भेड़ों या नर मेमनों का बोध कराता है; ‘मेढ़ों’ पशुधन की सूची में सटीक और सहज है।
- source_word: לֹא אָבוּ
  choice: तैयार नहीं हुए
  rationale: क्रिया इच्छा या सहमति की कमी बताती है। यह अनिच्छा को स्पष्ट करती है और उसे असमर्थता नहीं बनने देती।
- source_word: הַחֲרִימָם / הֶחֱרִימוּ
  choice: विनाश के लिए अर्पित करना / विनाश के लिए अर्पित कर दिया
  rationale: חרם युद्ध के इस प्रसंग में किसी व्यक्ति या वस्तु को प्रतिबंध के अधीन विनाश के लिए अलग करने का तकनीकी भाव रखता है। यह अनुवाद केवल ‘नष्ट करना’ कहने की अपेक्षा उस समर्पण और विनाश, दोनों पक्षों को सुरक्षित रखता है।
- source_word: כָל־הַמְּלָאכָה נְמִבְזָה וְנָמֵס
  choice: जो कुछ घटिया और बेकार था
  rationale: מְלָאכָה यहाँ काम नहीं, बल्कि लूट में मिली वस्तुओं या संपत्ति का सामूहिक संकेत है। दोनों विशेषण उनके तुच्छ और मूल्यहीन समझे जाने को बताते हैं।
theological_decisions:
- issue: חרם का पवित्र युद्ध के संदर्भ में अनुवाद
  choice: विनाश के लिए अर्पित करना
  alternative: पूरी तरह नष्ट करना; विनाश के प्रतिबंध के अधीन करना
  rationale: पद का तनाव इस बात में है कि शाऊल ने उन वस्तुओं को बचाया जिन्हें חרם के अधीन किया जाना था। चुनी हुई अभिव्यक्ति न्यायिक/धार्मिक समर्पण और वास्तविक विनाश दोनों को बनाए रखती है, बिना इसकी कठोरता कम किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। पशुधन के लिए परिचित सामूहिक शब्द रखे गए हैं और कठिन तकनीकी पद חרם को मुख्य पाठ में समझने योग्य रखते हुए पादटिप्पणी में स्पष्ट किया गया है।
