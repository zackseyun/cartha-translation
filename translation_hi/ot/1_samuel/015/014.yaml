  terminology: ‘शमूएल,’ ‘भेड़-बकरियाँ,’ ‘गाय-बैल,’ and ‘आवाज़’ are appropriate modern Hindi renderings. ‘भेड़-बकरियाँ’ appropriately preserves the collective breadth of צֹאן, and ‘गाय-बैल’ is a suitable collective rendering of בָּקָר.
  issues:
