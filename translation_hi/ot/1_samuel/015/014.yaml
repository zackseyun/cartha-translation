  yaml_path: translation/ot/1_samuel/015/014.yaml
  text: But Samuel said[a], “Then what is this sound of sheep in my ears, and the sound of cattle that I hear?”
translation:
  language: hi
  text: पर शमूएल ने कहा, “तो फिर भेड़-बकरियों की यह कैसी आवाज़ मेरे कानों में पड़ रही है, और गाय-बैलों की वह आवाज़ कैसी है जो मैं सुन रहा हूँ?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर शमूएल ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, किंतु प्रसंग में शाऊल के आज्ञापालन के दावे के विरुद्ध शमूएल की चुनौती है; इसलिए ‘पर’ स्वाभाविक रूप से विरोधसूचक बल व्यक्त करता है।
- source_word: וּמֶה
  choice: तो फिर ... यह कैसी
  rationale: प्रश्न स्पष्टीकरण की माँग करते हुए शाऊल के दावे को चुनौती देता है। ‘तो फिर’ संयोजक और तर्कात्मक बल को सहज हिन्दी में रखता है।
- source_word: קוֹל
  choice: आवाज़
  rationale: קוֹל का अर्थ ‘स्वर/आवाज़/ध्वनि’ हो सकता है; यहाँ पशुओं की सुनाई देने वाली आवाज़ अभिप्रेत है, इसलिए ‘आवाज़’ सामान्य और स्वाभाविक हिन्दी है।
- source_word: הַצֹּאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, का सामूहिक पद है। केवल ‘भेड़ें’ कहने की अपेक्षा ‘भेड़-बकरियाँ’ स्रोत की व्यापकता अधिक स्पष्ट रखता है।
- source_word: הַזֶּה
  choice: यह
  rationale: यह संकेतवाचक शब्द उसी समय सुनाई दे रही आवाज़ की ओर इंगित करता है।
- source_word: בְּאָזְנָי
  choice: मेरे कानों में पड़ रही है
  rationale: मूल का ‘मेरे कानों में’ बिंब सुरक्षित रखते हुए हिन्दी में स्वाभाविक श्रवण-अभिव्यक्ति दी गई है।
- source_word: וְקוֹל הַבָּקָר
  choice: और गाय-बैलों की यह कैसी आवाज़
  rationale: בָּקָר गोवंश अथवा बड़े पालतू पशुओं का सामूहिक पद है। ‘गाय-बैल’ आधुनिक हिन्दी में इसका स्वाभाविक और पर्याप्त व्यापक रूप है; दूसरी बार जोड़ा गया ‘यह कैसी’ हिन्दी वाक्य में समानांतर प्रश्न को स्पष्ट करता है।
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: जो मैं सुन रहा हूँ
  rationale: संबंधवाचक उपवाक्य प्रत्यक्ष श्रव्य प्रमाण को रेखांकित करता है। ‘मैं सुन रहा हूँ’ जारी क्रिया और אָנֹכִי के व्यक्त बल को सहज ढंग से व्यक्त करता है।
