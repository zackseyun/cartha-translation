  text: וְ/הִנֵּ֣ה שָׁא֗וּל בָּ֣א אַחֲרֵ֤י הַ/בָּקָר֙ מִן הַ/שָּׂדֶ֔ה וַ/יֹּ֣אמֶר שָׁא֔וּל מַה לָּ/עָ֖ם כִּ֣י יִבְכּ֑וּ וַ/יְסַ֨פְּרוּ ל֔/וֹ אֶת דִּבְרֵ֖י אַנְשֵׁ֥י יָבֵֽישׁ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/005.yaml
  text: And behold[a], Saul was coming from the field behind the cattle, and Saul said, “What is wrong with the people[b], that they are weeping?” And they told him the words of the men of Jabesh.
translation:
  language: hi
  text: और देखो, शाऊल मवेशियों के पीछे-पीछे खेत से आ रहा था। शाऊल ने पूछा, “लोगों को क्या हुआ है कि वे रो रहे हैं?” तब लोगों ने उसे याबेश के पुरुषों की बातें[a] बताईं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याबेश के पुरुषों का संदेश।” इसका शाब्दिक अर्थ “याबेश के पुरुषों की बातें” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह दृश्य-परिवर्तन और कथा की सजीवता को बनाए रखता है; इसे केवल ‘तब’ कहकर समतल नहीं किया गया।
- source_word: בָּא
  choice: आ रहा था
  rationale: इब्रानी कृदंत चल रही पृष्ठभूमि-क्रिया दर्शाता है, जिसे हिन्दी का अपूर्ण भूत स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַחֲרֵי הַבָּקָר
  choice: मवेशियों के पीछे-पीछे
  rationale: אַחֲרֵי का स्थानगत अर्थ ‘पीछे’ है और בָּקָר गोवंश के लिए व्यापक शब्द है; ‘मवेशी’ अनावश्यक रूप से केवल बैलों तक अर्थ सीमित नहीं करता।
- source_word: מִן הַשָּׂדֶה
  choice: खेत से
  rationale: यह शाऊल के आने के आरंभ-बिंदु को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַה לָעָם
  choice: लोगों को क्या हुआ है
  rationale: यह हिन्दी में उस मुहावरे का सहज समतुल्य है जिसमें किसी की परेशानी या अवस्था पूछी जाती है।
- source_word: כִּי יִבְכּוּ
  choice: कि वे रो रहे हैं
  rationale: כִּי प्रश्न के कारण अथवा आशय को जोड़ता है और अपूर्ण क्रिया जारी रोने को दर्शाती है।
- source_word: וַיְסַפְּרוּ לוֹ
  choice: तब लोगों ने उसे ... बताईं
  rationale: ‘बताईं’ प्रसंग में सरल और स्वाभाविक कथात्मक अनुवाद है; कर्ता को हिन्दी में स्पष्ट करने के लिए ‘लोगों ने’ जोड़ा गया है।
- source_word: דִּבְרֵי אַנְשֵׁי יָבֵישׁ
  choice: याबेश के पुरुषों की बातें
  rationale: ‘बातें’ דִּבְרֵי के शाब्दिक ‘वचन/बातें’ को सुरक्षित रखता है, जबकि ‘पुरुषों’ से אַנְשֵׁי का लिंग-सूचक आशय बना रहता है।
