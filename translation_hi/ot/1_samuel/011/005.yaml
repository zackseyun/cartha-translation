  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘और देखो’ से मूल का दृश्य-सूचक बल, ‘आ रहा था’ से जारी पृष्ठभूमि-क्रिया, और ‘पीछे-पीछे’ से स्थानगत चित्र सुरक्षित रखा गया है। मुख्य पाठ के सभी पादटिप्पणी-चिह्न संगत स्थान पर दिए गए हैं।
