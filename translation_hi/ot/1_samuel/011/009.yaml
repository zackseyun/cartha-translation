base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/009.yaml
  text: 'They said to the messengers who were coming[a], “Thus you shall say to the men of Jabesh-gilead: Tomorrow, by the heat of the sun, you will have deliverance.” So the messengers came and told the men of Jabesh[b], and they rejoiced.'
translation:
  language: hi
  text: 'उन्होंने आए हुए दूतों से कहा, “तुम याबेश-गिलाद के लोगों[a] से यह कहना: ‘कल, जब धूप तेज़ होगी[b], तब तुम्हारा छुटकारा होगा।’” तब दूत आए और उन्होंने याबेश के लोगों को यह बात बताई, और वे आनन्दित हुए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से “याबेश-गिलाद के मनुष्य” एकवचन में है; यहाँ यह नगर के निवासियों के लिए सामूहिक रूप से प्रयुक्त हुआ है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “सूरज की गर्मी में”; अर्थात दिन के उस समय जब धूप तेज़ हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים הַבָּאִים
  choice: आए हुए दूतों
  rationale: इस प्रसंग में מַלְאָכִים मनुष्य-संदेशवाहकों को दर्शाता है। הַבָּאִים कृदन्त है और यहाँ उन दूतों की पहचान कराता है जो याबेश से आ पहुँचे थे; ‘आए हुए’ स्वाभाविक हिन्दी में यही भाव देता है।
- source_word: כֹּה תֹאמְרוּן
  choice: तुम ... यह कहना
  rationale: यह इब्रानी सूत्र सीधे कथन का परिचय देता है। यह हिन्दी रूप अर्थ के निकट और बोलचाल में स्वाभाविक है।
- source_word: לְאִישׁ יָבֵישׁ גִּלְעָד
  choice: याबेश-गिलाद के लोगों
  rationale: אִישׁ व्याकरण की दृष्टि से एकवचन है, पर प्रसंग में नगर के निवासियों के लिए सामूहिक अर्थ रखता है; आगे आया बहुवचन भी इसकी पुष्टि करता है।
- source_word: תִּהְיֶה לָכֶם תְּשׁוּעָה
  choice: तुम्हारा छुटकारा होगा
  rationale: תְּשׁוּעָה यहाँ शत्रु के सैन्य संकट से बचाव या उद्धार को दर्शाता है। ‘छुटकारा’ ठोस ऐतिहासिक अर्थ को स्पष्ट रखता है और अनावश्यक रूप से बाद की धर्मवैज्ञानिक शब्दावली नहीं थोपता।
- source_word: בְּחֹם הַשָּׁמֶשׁ
  choice: जब धूप तेज़ होगी
  rationale: शाब्दिक भाव ‘सूरज की गर्मी में’ है और वाक्यांश दिन के उस समय की ओर संकेत करता है जब सूर्य तप रहा हो। चुना हुआ रूप हिन्दी में स्वाभाविक रहते हुए मूल बिंब बनाए रखता है।
- source_word: וַיַּגִּידוּ
  choice: यह बात बताई
  rationale: क्रिया संदेश को ज्ञात कराने का सामान्य कथात्मक भाव रखती है; यह हिन्दी रूप स्पष्ट और स्वाभाविक है।
- source_word: וַיִּשְׂמָחוּ
  choice: वे आनन्दित हुए
  rationale: यह रूप मूल क्रिया के हर्ष और प्रसन्नता के भाव को गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
