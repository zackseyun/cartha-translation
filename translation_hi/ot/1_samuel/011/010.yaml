  source_fidelity: The draft correctly renders the narrative sequence, the men of Jabesh, ‘tomorrow,’ and the non-explicit nature of submission. However, ‘हम तुम्हारे पास बाहर आएँगे’ is not idiomatic Hindi and makes the spatial sense sound unnatural. ‘निकल आएँगे’ naturally conveys going/coming out toward the addressed party without adding ‘surrender.’
