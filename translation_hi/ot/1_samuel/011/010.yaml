base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/010.yaml
  text: So the men of Jabesh said[a], “Tomorrow we will come out to you, and you may do to us whatever seems good in your eyes.”
translation:
  language: hi
  text: तब याबेश के पुरुषों ने कहा[a], “कल हम तुम्हारे पास निकल आएँगे, और जो कुछ तुम्हारी दृष्टि में अच्छा हो, वह हमारे साथ करना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम तुम्हारी ओर निकलेंगे”; इब्रानी में ‘आत्मसमर्पण’ स्पष्ट रूप से नहीं कहा गया है, यद्यपि प्रसंग में अधीन होने का भाव निहित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम और प्रसंगगत परिणाम दोनों व्यक्त करता है।
- source_word: אַנְשֵׁי יָבֵישׁ
  choice: याबेश के पुरुषों
  rationale: अन्शेई का अर्थ विशेष रूप से ‘पुरुष’ है। इस पद में स्थान का नाम केवल ‘याबेश’ है, इसलिए प्रसंग से ‘याबेश-गिलाद’ नहीं जोड़ा गया।
- source_word: מָחָר
  choice: कल
  rationale: यह अगले दिन को सूचित करने वाला सामान्य कालवाचक क्रियाविशेषण है।
- source_word: נֵצֵא אֲלֵיכֶם
  choice: हम तुम्हारे पास बाहर आएँगे
  rationale: यत्सा का मूल अर्थ ‘बाहर निकलना’ है। ‘आत्मसमर्पण करेंगे’ प्रसंग से निहित हो सकता है, पर इब्रानी में स्पष्ट नहीं है; इसलिए मूल अस्पष्टता रखी गई।
- source_word: וַעֲשִׂיתֶם לָּנוּ
  choice: और तुम हमारे साथ वही करना
  rationale: यहाँ कथन अनुमति अथवा सामने वाले को मनचाहा करने देने का भाव रखता है। स्वाभाविक हिन्दी में ‘करना’ उस भाव को व्यक्त करता है, बिना इसे कठोर आज्ञा बनाने के।
- source_word: כְּכָל הַטּוֹב בְּעֵינֵיכֶם
  choice: वही ... जो तुम्हारी दृष्टि में अच्छा हो
  rationale: यह चयन या निर्णय को ‘आँखों में अच्छा’ होने के इब्रानी मुहावरे से व्यक्त करता है। ‘दृष्टि में अच्छा’ हिन्दी में गरिमापूर्ण और निकट समतुल्य है।
