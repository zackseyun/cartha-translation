  yaml_path: translation/ot/1_samuel/011/004.yaml
  text: When the messengers came to Gibeah of Saul and spoke these words in the hearing of the people[a], all the people lifted up their voices and wept.
translation:
  language: hi
  text: जब दूत शाऊल के गिबा में पहुँचे और उन्होंने लोगों को ये बातें सुनाईं, तो सब लोगों ने ऊँची आवाज़ में रोना शुरू कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: दूत
  rationale: यहाँ मनुष्य-संदेशवाहक अभिप्रेत हैं, स्वर्गदूत नहीं; ‘दूत’ संक्षिप्त और संदर्भानुकूल है।
- source_word: גִּבְעַת שָׁאוּל
  choice: शाऊल का गिबा
  rationale: सम्बन्धवाचक इब्रानी पदबंध नगर को शाऊल से संबद्ध करता है; हिन्दी में यह स्वाभाविक रूप है।
- source_word: וַיְדַבְּרוּ הַדְּבָרִים בְּאָזְנֵי הָעָם
  choice: उन्होंने लोगों को ये बातें सुनाईं
  rationale: ‘लोगों के कानों में बातें कहीं’ का अर्थ लोगों को संदेश सुनाना है; यह हिन्दी में स्वाभाविक रहते हुए श्रवण-संबंधी भाव बनाए रखता है।
- source_word: וַיִּשְׂאוּ כָל־הָעָם אֶת־קוֹלָם וַיִּבְכּוּ
  choice: सब लोग फूट-फूटकर रोने लगे
  rationale: ‘अपनी आवाज़ उठाकर रोए’ शोकपूर्ण ऊँचे विलाप का इब्रानी मुहावरा है; चुना हुआ हिन्दी मुहावरा उसकी तीव्रता और सामूहिक विलाप को सहज रूप में व्यक्त करता है।
