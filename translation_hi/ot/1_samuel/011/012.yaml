base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/012.yaml
  text: Then the people said to Samuel[a], “Who is it that said, ‘Shall Saul reign over us?’ Hand over the men, and we will put them to death.”
translation:
  language: hi
  text: तब लोगों ने शमूएल से कहा, “वह कौन है जिसने कहा, ‘क्या शाऊल हम पर राज करेगा?’[a] उन आदमियों को हमारे हवाले कर दो, और हम उन्हें मार डालेंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शाऊल हम पर राज करेगा।” हिब्रू की अपूर्ण क्रिया को भविष्यसूचक प्रश्न या—यहाँ कम सम्भावित रूप से—कथन के रूप में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: यहाँ सामूहिक रूप से उपस्थित इस्राएली जनसमुदाय का सामान्य और सहज हिन्दी रूप।
- source_word: אֶל שְׁמוּאֵל
  choice: शमूएल से
  rationale: बोलने की दिशा को हिन्दी में स्वाभाविक ‘से कहा’ संरचना द्वारा व्यक्त किया गया है।
- source_word: מִי הָאֹמֵר
  choice: वह कौन था जिसने कहा था
  rationale: लेखयुक्त कृदन्त ‘कहने वाला’ की पहचान पूछता है; सन्दर्भ में पहले कही गई आपत्ति की ओर संकेत होने के कारण भूतकाल हिन्दी में स्वाभाविक है।
- source_word: שָׁאוּל יִמְלֹךְ עָלֵינוּ
  choice: क्या शाऊल हम पर राज करेगा?
  rationale: अपूर्ण क्रिया को सन्दर्भानुसार भविष्यसूचक प्रश्न माना गया है; ‘राज करेगा’ מלך के राजकीय अर्थ को सुरक्षित रखता है।
- source_word: תְּנוּ הָאֲנָשִׁים
  choice: उन आदमियों को हमारे हवाले कर दो
  rationale: आज्ञार्थक क्रिया यहाँ दण्ड के लिए दोषियों को सौंपने की माँग करती है; ‘हवाले कर दो’ इसी व्यावहारिक बल को स्पष्ट करता है।
- source_word: וּנְמִיתֵם
  choice: और हम उन्हें मार डालेंगे
  rationale: מות के हिफ़ील का अर्थ ‘मृत्यु देना’ है; ‘मार डालेंगे’ आधुनिक सामान्य हिन्दी में परिणाम और दृढ़ संकल्प दोनों व्यक्त करता है।
theological_decisions:
- issue: שָׁאוּל יִמְלֹךְ עָלֵינוּ में अपूर्ण क्रिया का वाक्य-बल
  choice: 'प्रश्न: “क्या शाऊल हम पर राज करेगा?”'
  alternative: “शाऊल हम पर राज करेगा।” अथवा “क्या शाऊल हम पर राज करेगा?” के निकट भविष्यसूचक प्रश्न
  rationale: पहले के विरोध को उद्धृत करने वाले प्रसंग में प्रश्न सबसे उपयुक्त है, पर हिब्रू अपूर्ण क्रिया अपने आप प्रश्नचिह्न निर्धारित नहीं करती; इसलिए वैकल्पिक कथन को टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथा-शैली। ‘शमूएल’ और ‘शाऊल’ प्रचलित हिन्दी बाइबलीय नामरूप हैं। पादटिप्पणी-चिह्न को मुख्य पाठ के अन्त में रखा गया है, क्योंकि वह उद्धृत वाक्य की व्याकरणिक अस्पष्टता से सम्बन्धित है।
