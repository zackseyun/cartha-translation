language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּאמְר֨וּ אֵלָ֜י/ו זִקְנֵ֣י יָבֵ֗ישׁ הֶ֤רֶף לָ֨/נוּ֙ שִׁבְעַ֣ת יָמִ֔ים וְ/נִשְׁלְחָה֙ מַלְאָכִ֔ים בְּ/כֹ֖ל גְּב֣וּל יִשְׂרָאֵ֑ל וְ/אִם אֵ֥ין מוֹשִׁ֛יעַ אֹתָ֖/נוּ וְ/יָצָ֥אנוּ אֵלֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/003.yaml
  text: The elders of Jabesh said to him, “Leave us alone for seven days, and we will send messengers throughout all the territory of Israel. Then, if there is no one to save us, we will come out to you.”
translation:
  language: hi
  text: याबेश के बुज़ुर्गों ने उससे कहा, “हमें सात दिन की मोहलत दे। हम इस्राएल के पूरे क्षेत्र में दूत भेजेंगे। फिर यदि हमें बचाने वाला कोई न मिला, तो हम निकलकर तेरे पास आ जाएँगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֶרֶף לָנוּ
  choice: हमें ... मोहलत दे
  rationale: यह मुहावरा यहाँ आक्रमण रोककर कुछ समय देने का निवेदन है; ‘मोहलत दे’ प्रसंगानुकूल और स्वाभाविक हिंदी है।
- source_word: בְּכֹל גְּבוּל יִשְׂרָאֵל
  choice: इस्राएल के सारे क्षेत्र में
  rationale: גְּבוּל यहाँ केवल सीमा-रेखा नहीं, बल्कि इस्राएल के समूचे भू-क्षेत्र को दर्शाता है।
- source_word: מוֹשִׁיעַ
  choice: बचाने वाला
  rationale: हिफ़ील कृदंत किसी उद्धार या सहायता पहुँचाने वाले व्यक्ति को सूचित करता है; सामान्य अर्थ रखा गया है, बिना अतिरिक्त धार्मिक विशेषार्थ जोड़े।
- source_word: וְיָצָאנוּ אֵלֶיךָ
  choice: हम निकलकर तेरे पास आ जाएँगे
  rationale: शहर से बाहर निकलकर नाहाश के सामने आने—अर्थात उसकी शर्त स्वीकार करने—की ठोस क्रिया को बनाए रखता है।
theological_decisions:
- issue: מוֹשִׁיעַ का धार्मिक अर्थ
  choice: बचाने वाला
  alternative: उद्धारकर्ता
  rationale: इस सैन्य-संकट के प्रसंग में शब्द किसी भी छुड़ाने वाले व्यक्ति के लिए है; ‘उद्धारकर्ता’ अनावश्यक रूप से विशिष्ट धर्मवैज्ञानिक अर्थ जगा सकता है।
- issue: וְיָצָאנוּ אֵלֶיךָ में आत्मसमर्पण का निहितार्थ
  choice: शाब्दिक क्रिया ‘निकलकर तेरे पास आ जाएँगे’ रखी गई
  alternative: हम तेरे सामने आत्मसमर्पण कर देंगे
  rationale: आत्मसमर्पण प्रसंग से निहित है, पर मूल पाठ उसे स्पष्ट शब्दों में नहीं कहता; इसलिए मूल की संयमित अभिव्यक्ति सुरक्षित रखी गई।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सहज। संवाद में प्राचीन प्रसंग के अनुरूप एकवचन ‘तेरे’ रखा गया है; ‘पुरनियों’ बाइबिलीय पदनाम के रूप में समझने योग्य है।
