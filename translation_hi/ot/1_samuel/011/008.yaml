  text: וַֽ/יִּפְקְדֵ֖/ם בְּ/בָ֑זֶק וַ/יִּהְי֤וּ בְנֵֽי יִשְׂרָאֵל֙ שְׁלֹ֣שׁ מֵא֣וֹת אֶ֔לֶף וְ/אִ֥ישׁ יְהוּדָ֖ה שְׁלֹשִׁ֥ים אָֽלֶף־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/008.yaml
  text: He mustered them at Bezek[a], and the sons of Israel were three hundred thousand, and the men of Judah thirty thousand.
translation:
  language: hi
  text: उसने बेजेक में उनकी सैनिक-गणना की। इस्राएल के पुत्र[a] तीन लाख और यहूदा के पुरुष तीस हज़ार थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, इस्राएली; इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’।
    reason: मूल इब्रानी की पारिवारिक अभिव्यक्ति का सामूहिक आशय स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּפְקְדֵם
  choice: उसने उनकी सैनिक-गणना की
  rationale: सैन्य प्रसंग में פקד का अर्थ केवल सामान्य गिनती करना नहीं, बल्कि युद्ध के लिए एकत्र लोगों की गणना अथवा नामावली लेना है। ‘सैनिक-गणना’ इस प्रसंग को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּבָזֶק
  choice: बेजेक में
  rationale: בָזֶק स्थान का नाम है; हिंदी में उसका लिप्यंतरण ‘बेजेक’ किया गया है। उपसर्ग בְּ यहाँ गणना के स्थान को बताता है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्र
  rationale: मूल इब्रानी के पारिवारिक और पुल्लिंग सामूहिक पद को सुरक्षित रखा गया है। यहाँ यह यहूदा के पुरुषों से अलग इस्राएली दल का सामूहिक नाम है।
- source_word: שְׁלֹשׁ מֵאוֹת אֶלֶף
  choice: तीन लाख
  rationale: हिंदी संख्या-पद्धति में 300,000 का स्वाभाविक और सटीक रूप ‘तीन लाख’ है।
- source_word: וְאִישׁ יְהוּדָה
  choice: यहूदा के पुरुष
  rationale: एकवचन रूप אִישׁ यहाँ सामूहिक अर्थ में यहूदा के पुरुषों को सूचित करता है; हिंदी में बहुवचन इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁלֹשִׁים אָלֶף
  choice: तीस हज़ार
  rationale: यह 30,000 का सीधा और प्रचलित हिंदी रूप है।
theological_decisions:
- issue: בְנֵי יִשְׂרָאֵל का सामूहिक और पुल्लिंग पारिवारिक रूप
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के पुरुष
  rationale: इसमें कोई विशेष सिद्धान्तगत निर्णय निहित नहीं है। मूल पद की पारिवारिक अभिव्यक्ति और इस्राएल तथा यहूदा के बीच साहित्यिक भेद को बनाए रखने के लिए ‘इस्राएल के पुत्र’ रखा गया है; उसका सामूहिक आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सैनिक-गणना’ युद्ध-संदर्भ को स्पष्ट करती है, जबकि ‘इस्राएल के पुत्र’ मूल अभिव्यक्ति को सुरक्षित रखता है। पादटिप्पणी-चिह्न उसी संबंधित पद के बाद रखा गया है।
