source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֲלֵי/הֶ֗ם נָחָשׁ֙ הָ/עַמּוֹנִ֔י בְּ/זֹאת֙ אֶכְרֹ֣ת לָ/כֶ֔ם בִּ/נְק֥וֹר לָ/כֶ֖ם כָּל עֵ֣ין יָמִ֑ין וְ/שַׂמְתִּ֥י/הָ חֶרְפָּ֖ה עַל כָּל יִשְׂרָאֵֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/002.yaml
  text: 'Nahash the Ammonite said to them, “On this condition I will make a treaty with you: that every right eye of yours be gouged out, and I will make it a disgrace upon all Israel.”'
translation:
  language: hi
  text: अम्मोनी नाहाश ने उनसे कहा, “मैं तुमसे इसी शर्त पर वाचा बाँधूँगा कि मैं तुम सबकी दाहिनी आँख फोड़ दूँ और इस प्रकार सारे इस्राएल का अपमान करूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֶכְרֹת לָכֶם
  choice: तुमसे ... वाचा बाँधूँगा
  rationale: शाब्दिक रूप से ‘तुम्हारे लिए काटूँगा’; वाचा के संदर्भ में यह प्रचलित इब्रानी मुहावरा ‘वाचा बाँधना’ है।
- source_word: בִּנְקוֹר לָכֶם כָּל־עֵין יָמִין
  choice: मैं तुम सबकी दाहिनी आँख फोड़ दूँ
  rationale: בִּנְקוֹר क्रियार्थक infinitive है और प्रत्येक व्यक्ति की दाहिनी आँख नष्ट करने की कठोर शर्त व्यक्त करता है; स्वाभाविक हिन्दी में कर्तृवाच्य रखा गया है।
- source_word: חֶרְפָּה
  choice: अपमान
  rationale: यहाँ शब्द सार्वजनिक लज्जा, निंदा और बेइज्जती का भाव रखता है; ‘अपमान’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: עַל כָּל־יִשְׂרָאֵל
  choice: सारे इस्राएल का
  rationale: हिन्दी में ‘इस्राएल पर अपमान रखना’ अस्वाभाविक है; सम्बन्धकारक रूप वही आशय स्पष्ट करता है कि यह पूरे इस्राएल की बदनामी होगी।
theological_decisions:
- issue: दूसरे खंड में क्रिया का कर्ता
  choice: ‘मैं ... फोड़ दूँ और ... अपमान करूँ’—दोनों क्रियाओं का कर्ता नाहाश
  alternative: ‘तुम सबकी दाहिनी आँख फोड़ दी जाए, और मैं...’
  rationale: मसोरेटी पाठ के בִּנְקוֹר ... וְשַׂמְתִּיהָ में नाहाश की प्रत्यक्ष एजेंसी स्वाभाविक रूप से बनी रहती है; अंग्रेज़ी consultation layer का passive अनिवार्य नहीं है।
- issue: वाचा की शर्त और उद्देश्य/परिणाम का संबंध
  choice: ‘कि ... और इस प्रकार ...’
  alternative: दो स्वतंत्र समानांतर शर्तों के रूप में ‘कि ... और मैं...’
  rationale: בְּזֹאת शर्त प्रस्तुत करता है, जबकि दाहिनी आँख फोड़ना पूरे इस्राएल के अपमान का साधन/परिणाम है; ‘इस प्रकार’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है, बिना अतिरिक्त धार्मिक अर्थ जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। हिंसक क्रिया को मूल पाठ की प्रत्यक्षता के अनुरूप रखा गया है; कोई व्याख्यात्मक या सांप्रदायिक विस्तार नहीं जोड़ा गया।
