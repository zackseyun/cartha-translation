  text: जब शाऊल ने ये बातें सुनीं, तब परमेश्वर का आत्मा सामर्थ्य के साथ उस पर आ गया[a], और उसका क्रोध बहुत भड़क उठा[b]।
  philosophy: optimal-equivalence
  footnotes:
