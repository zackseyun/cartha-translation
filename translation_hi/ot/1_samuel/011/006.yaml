    text: या, “प्रबलता से उस पर आया।” हिब्रू क्रिया किसी व्यक्ति पर आत्मा के बलपूर्वक आने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसकी नाक बहुत जल उठी”—यह तीव्र क्रोध के लिए एक हिब्रू मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּצְלַח
  choice: प्रबलता से उतरा
  rationale: यह क्रिया यहाँ आत्मा के अचानक और सामर्थ्यपूर्ण रूप से किसी व्यक्ति पर आने तथा उसे कार्य के लिए प्रेरित-सक्षम करने का भाव रखती है। ‘प्रबलता से उतरा’ उस बलपूर्ण आगमन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: यह रचना सीधे परमेश्वर के आत्मा को सूचित करती है और इस प्रसंग में शाऊल को नेतृत्व तथा छुटकारे के कार्य के लिए सामर्थ्य देने वाले दिव्य आत्मा का बोध कराती है।
- source_word: עַל
  choice: उस पर
  rationale: आत्मा के किसी व्यक्ति पर आने के हिब्रू प्रयोग को हिन्दी में स्पष्ट और स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: בְּשָׁמְעוֹ
  choice: जब शाऊल ने ... सुनीं
  rationale: पूर्वसर्ग के साथ क्रियार्थक संज्ञा और प्रत्यय यहाँ कालवाचक हैं। संज्ञा ‘शाऊल’ का प्रयोग हिन्दी में कर्ता को स्पष्ट रखता है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים का अर्थ ‘शब्द’, ‘बातें’ या ‘मामले’ हो सकता है। यहाँ सुने गए समाचार के संदर्भ में ‘ये बातें’ सहज है और अर्थ की व्यापकता बनाए रखता है।
- source_word: וַיִּחַר אַפּוֹ
  choice: उसका क्रोध ... भड़क उठा
  rationale: हिब्रू मुहावरे में क्रोध को जलने के रूप में व्यक्त किया गया है। ‘क्रोध भड़क उठा’ अग्नि-रूपक को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह शब्द क्रोध की तीव्रता बढ़ाता है; ‘बहुत भड़क उठा’ उस बल को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस कथा में רוּחַ אֱלֹהִים का स्वरूप
  choice: परमेश्वर का आत्मा शाऊल पर सामर्थ्य के साथ आया
  alternative: परमेश्वर की ओर से कोई आत्मा शाऊल पर आया
  rationale: निकटवर्ती कथा में यह वाक्यांश शाऊल को छुटकारे के लिए नेतृत्व और साहस देने वाले परमेश्वर के आत्मा को सूचित करता है। अनुवाद दिव्य सामर्थ्य के भाव को रखता है, पर आत्मा के कार्य की विधि के बारे में पाठ से अधिक नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप अपनाया गया है। ‘प्रबलता से उतरा’ दिव्य आत्मा के बलपूर्ण आगमन को व्यक्त करता है, जबकि ‘क्रोध भड़क उठा’ मूल अग्नि-रूपक को स्वाभाविक हिन्दी में बनाए रखता है।
