  text: וַ/יַּ֗עַל נָחָשׁ֙ הָֽ/עַמּוֹנִ֔י וַ/יִּ֖חַן עַל יָבֵ֣שׁ גִּלְעָ֑ד וַ/יֹּ֨אמְר֜וּ כָּל אַנְשֵׁ֤י יָבֵישׁ֙ אֶל נָחָ֔שׁ כְּרָת לָ֥/נוּ בְרִ֖ית וְ/נַעַבְדֶֽ/ךָּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/001.yaml
  text: Then Nahash the Ammonite went up and encamped against Jabesh-gilead. And all the men of Jabesh said to Nahash[a], “Make a covenant with us, and we will serve you.”
translation:
  language: hi
  text: तब अम्मोनी नाहाश चढ़ आया और याबेश-गिलआद के विरुद्ध डेरा डाला। याबेश के सब पुरुषों ने नाहाश से कहा, “हमसे वाचा कर, और हम तेरी सेवा करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़ आया
  rationale: עלה का मूल आरोहण-संबंधी भाव बना रहता है और इस सैनिक प्रसंग में यह स्वाभाविक हिन्दी है; ‘चढ़ाई की’ क्रिया में निहित बात से अधिक स्पष्ट सैन्य आक्रमण का अर्थ जोड़ सकता है।
- source_word: נָחָשׁ הָעַמּוֹנִי
  choice: अम्मोनी नाहाश
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और जातिसूचक विशेषण को सहज हिन्दी क्रम में रखा गया है।
- source_word: וַיִּחַן עַל
  choice: के विरुद्ध डेरा डाला
  rationale: חנה עם עַל सैनिक संदर्भ में किसी के सामने या विरुद्ध पड़ाव डालने को दर्शाता है। यह अनुवाद ‘घेर लिया’ जैसी अधिक प्रबल और अनिवार्यतः सिद्ध न होने वाली धारणा से बचता है।
- source_word: יָבֵשׁ גִּלְעָד
  choice: याबेश-गिलआद
  rationale: संयुक्त स्थाननाम को स्पष्ट और प्रचलित देवनागरी लिप्यंतरण में रखा गया है।
- source_word: כָּל אַנְשֵׁי יָבֵישׁ
  choice: याबेश के सब पुरुष
  rationale: אַנְשֵׁי का स्पष्ट पुरुषवाचक अर्थ सुरक्षित रखा गया है, जो इस नागरिक-सैनिक वार्ता के प्रसंग में उचित है।
- source_word: כְּרָת לָנוּ בְרִית
  choice: हमारे साथ वाचा बाँध
  rationale: हिब्रू मुहावरे ‘वाचा काट’ को स्वाभाविक हिन्दी ‘वाचा बाँध’ से व्यक्त किया गया है; ‘संधि कर’ संभव है, पर उससे בְּרִית का वाचागत शब्द-संबंध कमजोर हो जाता है।
- source_word: וְנַעַבְדֶךָּ
  choice: और हम तेरी सेवा करेंगे
  rationale: עבד के व्यक्तिगत कर्म के साथ सीधे अर्थ ‘सेवा करना’ को रखा गया है; ‘अधीन हो जाएँगे’ अधिक व्याख्यात्मक होता।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। संवाद में एकवचन संबोधन ‘तेरी’ मूल हिब्रू के दूसरे पुरुष एकवचन को सुरक्षित रखता है।
