  text: וַ/יֵּלְכ֨וּ כָל הָ/עָ֜ם הַ/גִּלְגָּ֗ל וַ/יַּמְלִכוּ֩ שָׁ֨ם אֶת שָׁא֜וּל לִ/פְנֵ֤י יְהוָה֙ בַּ/גִּלְגָּ֔ל וַ/יִּזְבְּחוּ שָׁ֛ם זְבָחִ֥ים שְׁלָמִ֖ים לִ/פְנֵ֣י יְהוָ֑ה וַ/יִּשְׂמַ֨ח שָׁ֥ם שָׁא֛וּל וְ/כָל אַנְשֵׁ֥י יִשְׂרָאֵ֖ל עַד מְאֹֽד־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/015.yaml
  text: So all the people went to Gilgal[a], and there they made Saul king before Yahweh at Gilgal. There they sacrificed peace offerings before Yahweh, and there Saul and all the men of Israel rejoiced greatly.
translation:
  language: hi
  text: तब सभी लोग गिलगाल गए और वहाँ गिलगाल में उन्होंने यहोवा के सामने शाऊल को राजा बनाया। वहाँ उन्होंने यहोवा के सामने मेलबलियाँ[a] चढ़ाईं, और शाऊल तथा इस्राएल के सभी पुरुष वहाँ बहुत आनन्दित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शान्ति-बलि,” “सहभागिता-बलि,” अथवा “कुशल-मंगल की बलि।” इब्रानी शब्द ऐसी सामुदायिक बलियों की एक श्रेणी को दर्शाता है जो शान्ति, संपूर्ण कुशल और मिलकर उत्सव मनाने से जुड़ी थीं।
    reason: שְׁלָמִים के व्यापक अर्थक्षेत्र और सम्भव अनुवादों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֵּלְכוּ כָל הָעָם
  choice: तब सभी लोग ... गए
  rationale: הלך का सामान्य आख्यानात्मक अर्थ ‘जाना’ है; כָל הָעָם पूरे एकत्रित जनसमुदाय को दर्शाता है। ‘तब’ wayyiqtol क्रम को स्वाभाविक हिन्दी आख्यान में व्यक्त करता है।
- source_word: הַגִּלְגָּל / בַּגִּלְגָּל
  choice: गिलगाल / गिलगाल में
  rationale: स्थानवाचक नाम का मानक हिन्दी लिप्यंतरण किया गया है और मूल की पुनरावृत्ति बनाए रखी गई है।
- source_word: וַיַּמְלִכוּ ... אֶת שָׁאוּל
  choice: उन्होंने ... शाऊल को राजा बनाया
  rationale: מלך के हिफ़ील रूप का अर्थ किसी को राजा बनाना या राज्याधिकार देना है। ‘अभिषेक किया’ नहीं रखा गया, क्योंकि इस पद में उसका उल्लेख नहीं है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह अभिव्यक्ति परमेश्वर की उपस्थिति में किए गए सार्वजनिक और उपासना-संबंधी कार्य को दर्शाती है।
- source_word: וַיִּזְבְּחוּ ... זְבָחִים שְׁלָמִים
  choice: मेलबलि चढ़ाए
  rationale: זבח के बलिदानी संदर्भ को स्वाभाविक हिन्दी ‘चढ़ाए’ से व्यक्त किया गया है; שְׁלָמִים के लिए परिचित और संक्षिप्त तकनीकी शब्द ‘मेलबलि’ चुना गया है।
- source_word: וַיִּשְׂמַח ... עַד מְאֹד
  choice: बहुत आनन्द मनाया
  rationale: שמח और तीव्रतासूचक עַד מְאֹד का अर्थ स्वाभाविक आधुनिक हिन्दी में सामूहिक उत्सव और अत्यधिक प्रसन्नता के रूप में व्यक्त होता है।
- source_word: וְכָל אַנְשֵׁי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरुषों
  rationale: אַנְשֵׁי का स्पष्ट पुल्लिंग अर्थ ‘पुरुष’ बनाए रखा गया है; इसे सामान्य ‘इस्राएलियों’ में नहीं बदला गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। आधुनिक हिन्दी बाइबल पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ द्वारा इसे उपाधि ‘प्रभु’ से प्रतिस्थापित किए बिना सुरक्षित रखा गया है।
- issue: שְׁלָמִים बलियों का अर्थक्षेत्र
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि / कुशल-मंगल की बलि
  rationale: शब्द शान्ति, संपूर्ण कुशल और साझा भोज से जुड़ी बलियों की श्रेणी दर्शाता है। मुख्य पाठ में संक्षिप्त पारंपरिक पद रखा गया है और अर्थक्षेत्र पादटिप्पणी में सुरक्षित है।
- issue: אַנְשֵׁי יִשְׂרָאֵל में लिंग-सूचना
  choice: इस्राएल के सभी पुरुषों
  alternative: सभी इस्राएलियों
  rationale: मूल पद स्पष्ट रूप से पुल्लिंग ‘इस्राएल के पुरुष’ कहता है; इसलिए उसे लिंग-निरपेक्ष सामूहिक संज्ञा में नहीं बदला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज आख्यान शैली रखी गई है। मूल की गिलगाल-वाली पुनरावृत्ति और ‘वहाँ’ की स्थानगत प्रमुखता सुरक्षित है। ‘मेलबलि’ धार्मिक तकनीकी पद है, जिसे पादटिप्पणी स्पष्ट करती है।
