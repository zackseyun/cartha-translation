source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שָׁא֔וּל לֹֽא יוּמַ֥ת אִ֖ישׁ בַּ/יּ֣וֹם הַ/זֶּ֑ה כִּ֥י הַ/יּ֛וֹם עָשָֽׂה יְהוָ֥ה תְּשׁוּעָ֖ה בְּ/יִשְׂרָאֵֽל־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/013.yaml
  text: But Saul said[a], “Not a man shall be put to death on this day, for today Yahweh has brought salvation in Israel.”
translation:
  language: hi
  text: पर शाऊल ने कहा, “इस दिन किसी को मृत्युदंड नहीं दिया जाएगा, क्योंकि आज याहवे ने इस्राएल में उद्धार का कार्य किया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज याहवे ने इस्राएल में छुटकारा दिलाया है”; अथवा, “आज याहवे ने इस्राएल को विजय दी है।”
    reason: עשה תשועה का अर्थ उद्धार या छुटकारा कार्यान्वित करना है। सैन्य प्रसंग में ‘विजय दी है’ भी संभव है; बְּיִשְׂרָאֵל का सीधा अर्थ ‘इस्राएल में’ है, यद्यपि ‘इस्राएल को’ लाभार्थी भाव में समझा जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर शाऊल ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर पिछले पद में लोगों के प्रस्ताव के साथ विरोध के कारण ‘पर’ प्रसंगानुकूल है।
- source_word: לֹא יוּמַת אִישׁ
  choice: किसी को मृत्युदंड नहीं दिया जाएगा
  rationale: יוּמַת מות का होफ़अल रूप है और किसी को दंडस्वरूप मरवा डालने का विधिक भाव रखता है; ‘मृत्युदंड’ आधुनिक हिन्दी में इसे स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בַּיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक अर्थ ‘इस दिन’ है, पर आधुनिक हिन्दी में ‘आज’ अधिक स्वाभाविक है; इसी दिन पर दिया गया बल वाक्य में पुनरावृत्ति से बना रहता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शाऊल के निषेध का कारण प्रस्तुत करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: प्रत्यक्ष काल-सूचक अर्थ को स्वाभाविक हिन्दी में बनाए रखता है और मूल की पुनरावृत्ति सुरक्षित रखता है।
- source_word: עָשָׂה יְהוָה תְּשׁוּעָה
  choice: यहोवा ने उद्धार किया है
  rationale: עשה תשועה का अर्थ बचाव या छुटकारा सम्पन्न करना है। ‘उद्धार किया है’ ईश्वरीय कर्तृत्व और תְּשׁוּעָה की व्यापकता रखता है, जबकि सैन्य विजय का प्रसंग भी बना रहता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय प्रयोग में प्रचलित रूप ‘यहोवा’ दिव्य व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: ב का सीधा स्थानवाचक अर्थ सुरक्षित है; ‘इस्राएल के लिए’ भी प्रसंगगत रूप से संभव है, पर वह लाभार्थी अर्थ को अधिक स्पष्ट कर देता।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरीय दिव्य नाम सीधे प्रयुक्त है। हिन्दी के सामान्य बाइबलीय पाठकों के लिए परिचित नामरूप ‘यहोवा’ चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: सैन्य प्रसंग में תְּשׁוּעָה
  choice: उद्धार
  alternative: छुटकारा; विजय
  rationale: प्रसंग सैन्य बचाव का है, इसलिए ‘विजय’ संभव है; फिर भी ‘उद्धार’ मूल शब्द की व्यापक धर्मवैचारिक और बचाव-संबंधी अर्थछाया को सुरक्षित रखता है।
- issue: בְּיִשְׂרָאֵל का संबंध
  choice: इस्राएल में
  alternative: इस्राएल के लिए
  rationale: स्थानवाचक रूप मूल की संरचना के सबसे निकट है। लाभार्थी अर्थ संभव है, इसलिए उसे टिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण कथात्मक शैली। ‘मृत्युदंड’ विधिक भाव को स्पष्ट करता है; ‘आज’ की पुनरावृत्ति मूल का जोर बनाए रखती है। प्रत्येक टिप्पणी-चिह्न मुख्य पाठ में रखा गया है।
