id: 1SA.11.14
reference: 1 Samuel 11:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל הָ/עָ֔ם לְכ֖וּ וְ/נֵלְכָ֣ה הַ/גִּלְגָּ֑ל וּ/נְחַדֵּ֥שׁ שָׁ֖ם הַ/מְּלוּכָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/014.yaml
  text: Then Samuel said to the people[a], “Come, let us go to Gilgal, and there renew the kingship.”
translation:
  language: hi
  text: तब शमूएल ने लोगों से कहा, “आओ, हम गिलगाल चलें और वहाँ राजसत्ता का नवीनीकरण करें[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजसत्ता को दृढ़ करें” अथवा “राज्य का नवीनीकरण करें।”
    reason: इब्रानी क्रिया और संज्ञा का मेल राजकीय पद की पुनर्पुष्टि तथा राज्य/राजतंत्र के नवीनीकरण—दोनों अर्थों की गुंजाइश रखता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: इस व्यक्तिगत नाम का प्रचलित हिन्दी बाइबलीय रूप।
- source_word: אֶל הָעָם
  choice: लोगों से
  rationale: עָם यहाँ एकत्र इस्राएली लोगों को सूचित करता है; ‘लोगों’ इसका सहज प्रसंगानुकूल अर्थ है।
- source_word: לְכוּ וְנֵלְכָה
  choice: आओ, हम ... चलें
  rationale: आज्ञार्थक और प्रथम पुरुष बहुवचन इच्छार्थक का यह मेल संयुक्त यात्रा का निमंत्रण है; हिन्दी में यह अभिव्यक्ति स्वाभाविक है।
- source_word: הַגִּלְגָּל
  choice: गिलगाल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שָׁם
  choice: वहाँ
  rationale: गिलगाल की ओर संकेत करने वाले स्थानवाचक क्रियाविशेषण का सीधा अनुवाद।
- source_word: וּנְחַדֵּשׁ
  choice: नवीनीकरण करें
  rationale: पिएल रूप का मूल भाव किसी वस्तु को फिर नया करने या पुनः दृढ़ करने का है; ‘नवीनीकरण’ उस अर्थ को बिना किसी विशिष्ट अनुष्ठान का अनुमान लगाए बनाए रखता है।
- source_word: הַמְּלוּכָה
  choice: राजसत्ता
  rationale: מְלוּכָה यहाँ मुख्यतः राजा के पद और शासनाधिकार को सूचित करता है; ‘राजसत्ता’ केवल भौगोलिक राज्य की अपेक्षा इस भाव को अधिक स्पष्ट रखता है।
theological_decisions:
- issue: הַמְּלוּכָה के नवीनीकरण का आशय
  choice: राजसत्ता का नवीनीकरण
  alternative: राजसत्ता को दृढ़ करना; राज्य का नवीनीकरण
  rationale: प्रसंग शाऊल की विजय के बाद उसके राजकीय अधिकार की सार्वजनिक पुनर्पुष्टि की ओर संकेत करता है। फिर भी इब्रानी पद व्यापक है, इसलिए अनुवाद किसी निश्चित राज्याभिषेक-विधि या केवल संस्थागत अर्थ को अनिवार्य नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘आओ, हम ... चलें’ सामान्य पाठक के लिए सहज है, जबकि ‘राजसत्ता का नवीनीकरण’ मूल की अर्थगत व्यापकता और औपचारिक प्रसंग को सुरक्षित रखता है।
