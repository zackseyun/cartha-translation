source:
  edition: WLC
  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/יָּ֨שֶׂם שָׁא֣וּל אֶת הָ/עָם֮ שְׁלֹשָׁ֣ה רָאשִׁים֒ וַ/יָּבֹ֤אוּ בְ/תוֹךְ הַֽ/מַּחֲנֶה֙ בְּ/אַשְׁמֹ֣רֶת הַ/בֹּ֔קֶר וַ/יַּכּ֥וּ אֶת עַמּ֖וֹן עַד חֹ֣ם הַ/יּ֑וֹם וַ/יְהִ֤י הַ/נִּשְׁאָרִים֙ וַ/יָּפֻ֔צוּ וְ/לֹ֥א נִשְׁאֲרוּ בָ֖/ם שְׁנַ֥יִם יָֽחַד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/011/011.yaml
  text: And it happened on the next day that Saul set the people in three groups[a], and they came into the midst of the camp during the morning watch and struck Ammon until the heat of the day. And it happened that the survivors were scattered[c][b], so that no two of them were left together.
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि शाऊल ने लोगों को तीन दलों[a] में बाँट दिया। वे भोर के पहर[b] छावनी के बीच में घुस गए और दिन चढ़ने तक[c] अम्मोनियों को मारते रहे। जो बच गए, वे ऐसे तितर-बितर हुए कि उनमें से दो भी एक साथ न रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘तीन सिर’; यह तीन सैन्य दलों या टुकड़ियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात भोर के समय की सैनिक निगरानी-अवधि।
    reason: cultural_note
  - marker: c
    text: शाब्दिक अर्थ ‘दिन की गर्मी तक,’ संभवतः दोपहर के निकट तक।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह पदबंध पिछली घटनाओं के बाद वाले दिन को सूचित करता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: וַיָּשֶׂם ... שְׁלֹשָׁה רָאשִׁים
  choice: लोगों को तीन दलों में बाँट दिया
  rationale: शाब्दिक रूप से ‘तीन सिर’ एक सैन्य मुहावरा है, जिसका आशय तीन टुकड़ियों या दलों से है।
- source_word: בְתוֹךְ הַמַּחֲנֶה
  choice: छावनी के बीच में घुस गए
  rationale: पूर्वसर्ग और क्रिया मिलकर शत्रु की छावनी के भीतर प्रवेश करने का भाव देते हैं; ‘घुस गए’ आक्रमण की गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּאַשְׁמֹרֶת הַבֹּקֶר
  choice: भोर के पहर
  rationale: यह भोर के समय की सैनिक निगरानी-अवधि को दर्शाता है; ‘पहर’ प्राचीन समय-विभाजन का बोध बनाए रखता है।
- source_word: וַיַּכּוּ אֶת עַמּוֹן
  choice: अम्मोनियों को मारते रहे
  rationale: ‘अम्मोन’ यहाँ सामूहिक रूप से अम्मोनी सेना के लिए प्रयुक्त है। क्रिया युद्ध में प्रहार करके मारने का अर्थ देती है।
- source_word: עַד חֹם הַיּוֹם
  choice: दिन चढ़ने तक
  rationale: शाब्दिक भाव ‘दिन की गर्मी तक’ है। ‘दिन चढ़ने तक’ आधुनिक हिन्दी में देर सुबह, जब गर्मी बढ़ती है, का स्वाभाविक संकेत देता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: הַנִּשְׁאָרִים וַיָּפֻצוּ
  choice: जो बच गए, वे ऐसे तितर-बितर हुए
  rationale: सैन्य पराजय के बाद बचे लोगों के पूरी तरह बिखर जाने का भाव स्पष्ट और मुहावरेदार हिन्दी में व्यक्त होता है।
- source_word: וְלֹא נִשְׁאֲרוּ בָם שְׁנַיִם יָחַד
  choice: उनमें से दो भी एक साथ न रहे
  rationale: यह शत्रु-दल के पूर्ण विघटन पर बल देने वाली इब्रानी अभिव्यक्ति को संक्षिप्त और सजीव रूप में बनाए रखता है।
- source_word: וַיְהִי ... וַיְהִי
  choice: अगले दिन ऐसा हुआ कि ... जो बच गए
  rationale: पहले कथात्मक सूत्र को बनाए रखा गया है, पर दूसरे को हिन्दी प्रवाह के लिए स्वतंत्र वाक्यांश में समाहित किया गया है; घटनाक्रम का अर्थ अपरिवर्तित रहता है।
