  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, कथात्मक और सामान्य पाठकों के लिए सहज शैली रखी गई है। ‘पहर’ ऐतिहासिक-सैनिक समय-संदर्भ को संक्षेप में बनाए रखता है, जबकि पादटिप्पणी उसका अर्थ स्पष्ट करती है।
