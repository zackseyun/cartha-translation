  rationale: शाब्दिक ‘मृत्यु के पुत्र’ हिन्दी में अस्पष्ट हो सकता है। प्रसंग में यह मृत्यु के दण्ड के योग्य होने का न्यायिक मुहावरा है; बहुवचन ‘तुम सब’ मूल के אתם को स्पष्ट करता है।
