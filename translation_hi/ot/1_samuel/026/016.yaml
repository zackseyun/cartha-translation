- source_word: חֲנִית הַמֶּלֶךְ
  choice: राजा का भाला
  rationale: संबंधवाचक रचना और חֲנִית का सामान्य अर्थ स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: צַפַּחַת הַמַּיִם אֲשֶׁר מְרַאֲשֹׁתוֹ
  choice: पानी की वह सुराही ... जो उसके सिरहाने रखी थी
  rationale: पानी रखने के छोटे पात्र और राजा के सिर के पास उसकी स्थिति को सहज हिन्दी में व्यक्त करता है। संयुक्त कर्ताओं के कारण मुख्य पाठ में ‘रखी थीं’ रखा गया है।
theological_decisions:
