base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/016.yaml
  text: This thing that you have done is not good. As Yahweh lives[a], you are sons of death, because you did not keep watch over your master, over Yahweh’s anointed. And now, look—where are the king’s spear and the water jar that were by his head?
translation:
  language: hi
  text: तूने जो यह काम किया है, वह अच्छा नहीं है। जीवित याहवे की शपथ, तुम सब मृत्यु-दण्ड के योग्य हो[a], क्योंकि तुमने अपने स्वामी की—याहवे के अभिषिक्त जन की—रखवाली नहीं की। अब देखो, राजा का भाला और पानी की वह सुराही कहाँ हैं, जो उसके सिरहाने रखी थीं?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से ‘तुम मृत्यु के पुत्र हो’; यह मुहावरा मृत्यु-दण्ड के योग्य होने को व्यक्त करता है।
    reason: मूल हिब्रू मुहावरे के शाब्दिक रूप और न्यायिक अर्थ को सुरक्षित करना।
lexical_decisions:
