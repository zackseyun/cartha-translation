- source_word: אֲדֹנֵיכֶם
  choice: अपने स्वामी
  rationale: यह शाऊल के लिए मानवीय अधिकार-संबंधी पद है; ‘प्रभु’ से होने वाली दैवी उपाधि की संभावित उलझन से बचाया गया है।
- source_word: מְשִׁיחַ יְהוָה
  choice: याहवे के अभिषिक्त जन
