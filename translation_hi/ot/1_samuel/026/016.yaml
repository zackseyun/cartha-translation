- issue: בְנֵי מָוֶת की न्यायिक तीव्रता
  choice: मृत्यु-दण्ड के योग्य
  alternative: मृत्यु के पुत्र
  rationale: मुहावरे का आशय स्पष्ट किया गया है, जबकि शाब्दिक रूप और उसकी तीव्रता पादटिप्पणी में सुरक्षित हैं।
