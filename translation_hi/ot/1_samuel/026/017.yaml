  text: וַ/יַּכֵּ֤ר שָׁאוּל֙ אֶת ק֣וֹל דָּוִ֔ד וַ/יֹּ֕אמֶר הֲ/קוֹלְ/ךָ֥ זֶ֖ה בְּנִ֣/י דָוִ֑ד וַ/יֹּ֣אמֶר דָּוִ֔ד קוֹלִ֖/י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/017.yaml
  text: Then Saul recognized David’s voice and said, “Is this your voice, my son David?” And David said, “It is my voice, my lord the king.”
translation:
  language: hi
  text: तब शाऊल ने दाऊद की आवाज़ पहचान ली और कहा, “क्या यह तुम्हारी आवाज़ है, मेरे बेटे दाऊद?” दाऊद ने कहा, “यह मेरी आवाज़ है, मेरे प्रभु, महाराज।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּכֵּר
  choice: पहचान ली
  rationale: यहाँ נכר का अर्थ सुनकर किसी की पहचान करना है; स्त्रीलिंग क्रिया ‘ली’ का संबंध ‘आवाज़’ से है।
- source_word: קוֹל
  choice: आवाज़
  rationale: प्रसंग में वक्ता की पहचानी जाने वाली मानवीय वाणी अभिप्रेत है, इसलिए ‘आवाज़’ स्वाभाविक और सटीक है।
- source_word: הֲקוֹלְךָ זֶה
  choice: क्या यह तुम्हारी आवाज़ है?
  rationale: प्रश्नवाचक הֲ और संकेतवाचक זֶה को सीधे तथा स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בְּנִי
  choice: हे मेरे बेटे
  rationale: पुत्र-संबंधी संबोधन और कथा में निहित तनाव बनाए रखता है; ‘हे’ हिन्दी में प्रत्यक्ष संबोधन को स्पष्ट करता है।
- source_word: קוֹלִי
  choice: यह मेरी ही आवाज़ है
  rationale: मूल का संक्षिप्त नाममात्र उत्तर ‘मेरी आवाज़’ है। हिन्दी में निहित संयोजक क्रिया जोड़कर वाक्य स्वाभाविक बनाया गया है; ‘ही’ उत्तर की पुष्टि को व्यक्त करता है, बिना ‘मैं ही हूँ’ में बदलकर आवाज़ का बिंब खोए।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे प्रभु राजा
  rationale: यहाँ אֲדֹנִי किसी मनुष्य के लिए आदरसूचक संबोधन है। ‘प्रभु’ और ‘राजा’ दोनों पदों को बनाए रखते हुए हिन्दी संबोधन स्वाभाविक रखा गया है।
- source_word: דָּוִד / שָׁאוּל
  choice: दाऊद / शाऊल
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नामरूप अपनाए गए हैं।
theological_decisions:
- issue: शाऊल द्वारा दाऊद के लिए संबंधसूचक संबोधन בְּנִי
  choice: हे मेरे बेटे
  alternative: मेरे बच्चे
  rationale: शत्रुता के बीच शाऊल का पुत्रवत संबोधन कथा का संबंधात्मक तनाव बनाए रखता है और पुल्लिंग संज्ञा को अनावश्यक रूप से सामान्य नहीं करता।
- issue: אֲדֹנִי का संदर्भ
  choice: मेरे प्रभु
  alternative: मेरे स्वामी
  rationale: यह दाऊद द्वारा मानव राजा के प्रति आदरसूचक संबोधन है, परमेश्वर का नाम या दिव्य उपाधि नहीं। ‘प्रभु’ हिन्दी में राजकीय सम्मान व्यक्त करता है, पर प्रसंग उसका मानवीय संदर्भ स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली। संवाद में ‘तुम्हारी’ और ‘मेरे बेटे’ मूल की आत्मीयता तथा तनाव को रखते हैं; दाऊद का उत्तर औपचारिक और सम्मानसूचक है।
