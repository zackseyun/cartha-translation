base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/008.yaml
  text: Then Abishai said to David[a], “God has delivered your enemy into your hand today. So now, please let me pin him to the earth with the spear in one blow[c][b], and I will not strike him a second time.”
translation:
  language: hi
  text: तब अबीशै ने दाऊद से कहा, “आज परमेश्वर ने आपके शत्रु को आपके हाथ में कर दिया है। इसलिए अब मुझे उसे भाले से एक ही वार में धरती में गाड़ देने दीजिए[a]; मैं उस पर दूसरी बार वार नहीं करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं उसे भाले से और धरती में, एक बार मारूँ”; आशय है कि अबीशै उसे भाले से एक ही प्रहार में धरती में जड़ देने का प्रस्ताव करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סִגַּר
  choice: हाथ में कर दिया है
  rationale: इस प्रसंग में क्रिया का अर्थ किसी को दूसरे के अधिकार या वश में कर देना है। यह चयन साथ आए בְּיָדֶךָ के हाथ वाले इब्रानी बिंब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया और प्रसंग इस्राएल के परमेश्वर की ओर संकेत करते हैं; आधुनिक हिन्दी बाइबलीय शैली में ‘परमेश्वर’ स्वाभाविक और गरिमापूर्ण है।
- source_word: אוֹיִבְךָ
  choice: आपके शत्रु
  rationale: संज्ञा और द्वितीय पुरुष एकवचन प्रत्यय का सीधा अर्थ है; दाऊद के प्रति अबीशै के संबोधन को आदरसूचक हिन्दी में व्यक्त किया गया है।
- source_word: בְּיָדֶךָ
  choice: आपके हाथ में
  rationale: यह मुहावरा अधिकार या वश में होने का अर्थ देता है, पर ‘हाथ’ का मूल बिंब हिन्दी में भी स्पष्ट और स्वाभाविक है।
- source_word: אַכֶּנּוּ נָא
  choice: मुझे उसे ... कर देने दीजिए
  rationale: सहभावी रूप और נָא अबीशै की विनती तथा स्वयं कार्य करने की इच्छा व्यक्त करते हैं; हिन्दी में यह विनम्र अनुरोध स्वाभाविक है।
- source_word: בַּחֲנִית וּבָאָרֶץ
  choice: भाले से धरती में आर-पार
  rationale: शाब्दिक संरचना ‘भाले से और धरती में’ है। प्रसंग में आशय एक ही प्रहार से शाऊल को भेदकर धरती तक पहुँचा देने का है; मुख्य पाठ अर्थ स्पष्ट करता है और पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: פַּעַם אַחַת
  choice: एक ही वार में
  rationale: यहाँ वाक्यांश प्रहार की संख्या और ढंग बताता है; ‘एक ही वार में’ अबीशै के इस दावे को स्पष्ट करता है कि दूसरा प्रहार आवश्यक नहीं होगा।
- source_word: וְלֹא אֶשְׁנֶה לוֹ
  choice: मुझे उस पर दूसरी बार वार नहीं करना पड़ेगा
  rationale: क्रिया का मूल अर्थ ‘दोहराना/दूसरी बार करना’ है और प्रहार प्रसंग से अध्याहृत है। यह हिन्दी में स्वाभाविक रूप से अबीशै के दावे को व्यक्त करता है।
- source_word: וַיֹּאמֶר ... אֶל
  choice: तब ... ने ... से कहा
  rationale: कथात्मक वाव घटनाक्रम को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रम को सहज ढंग से व्यक्त करता है।
theological_decisions:
- issue: शाऊल की असुरक्षित अवस्था में परमेश्वर की भूमिका
  choice: आज परमेश्वर ने आपके शत्रु को आपके हाथ में कर दिया है
  alternative: आज परमेश्वर ने आपके शत्रु को आपके वश में कर दिया है
  rationale: यह अबीशै द्वारा परिस्थिति की धार्मिक व्याख्या है, कथावाचक की ओर से हत्या की स्वीकृति नहीं। अनुवाद परमेश्वर की भूमिका संबंधी कथन और अबीशै के प्रस्ताव के बीच मूल पाठ का तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली अपनाई गई है। अबीशै दाऊद को आदरसूचक ‘आप’ कहता है। ‘धरती में आर-पार’ हिंसक क्रिया को अनावश्यक विस्तार दिए बिना इब्रानी वाक्यांश का आशय स्पष्ट करता है; शाब्दिक असामान्यता पादटिप्पणी में सुरक्षित है।
