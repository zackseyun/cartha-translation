  text: וַ/יִּקַּח֩ דָּוִ֨ד אֶֽת הַ/חֲנִ֜ית וְ/אֶת צַפַּ֤חַת הַ/מַּ֨יִם֙ מֵרַאֲשֹׁתֵ֣י שָׁא֔וּל וַ/יֵּלְכ֖וּ לָ/הֶ֑ם וְ/אֵ֣ין רֹאֶה֩ וְ/אֵ֨ין יוֹדֵ֜עַ וְ/אֵ֣ין מֵקִ֗יץ כִּ֤י כֻלָּ/ם֙ יְשֵׁנִ֔ים כִּ֚י תַּרְדֵּמַ֣ת יְהוָ֔ה נָפְלָ֖ה עֲלֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/012.yaml
  text: So David took the spear and the jar of water from beside Saul’s head[a], and they went away. No one saw it, and no one knew it, and no one awoke, for they were all sleeping[b], because a deep sleep from Yahweh had fallen on them.
translation:
  language: hi
  text: तब दाऊद ने शाऊल के सिरहाने से भाला और पानी की सुराही ले लिए[a], और वे वहाँ से चले गए। न किसी ने देखा, न किसी को पता चला, और न कोई जागा, क्योंकि वे सब सो रहे थे; यहोवा की ओर से गहरी नींद उन पर छा गई थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: शाऊल के सिर के पास की जगह से।'
    reason: इब्रानी मुहावरे की स्थान-संबंधी बारीकी स्पष्ट करना।
  - marker: b
    text: इसका अनुवाद ‘यहोवा की गहरी नींद उन पर आ पड़ी थी’ भी किया जा सकता है; भाव यह है कि यह नींद यहोवा की ओर से आई थी।
    reason: संबंधवाचक इब्रानी पदबंध की औपचारिक वैकल्पिक अभिव्यक्ति और दैवी अभिकरण सुरक्षित रखना।
lexical_decisions:
- source_word: הַחֲנִית
  choice: भाला
  rationale: यह सामान्य सैनिक हथियार के लिए स्वाभाविक और सटीक आधुनिक हिन्दी शब्द है।
- source_word: צַפַּחַת הַמַּיִם
  choice: पानी की सुराही
  rationale: צַפַּחַת पानी रखने के छोटे पात्र को दर्शाता है; ‘सुराही’ कथा-संदर्भ में सहज और ठोस है।
- source_word: מֵרַאֲשֹׁתֵי שָׁאוּל
  choice: शाऊल के सिरहाने से
  rationale: इब्रानी पद शाऊल के लेटे होने पर उसके सिर के पास की जगह बताता है; ‘सिरहाने से’ वस्तुओं को स्वयं सिर पर रखे होने का भ्रम टालता है।
- source_word: וַיֵּלְכוּ לָהֶם
  choice: और वे वहाँ से चले गए
  rationale: बहुवचन दाऊद और अबीशै के प्रस्थान को बताता है; ‘वहाँ से चले गए’ हिन्दी में स्वाभाविक है।
- source_word: וְאֵין רֹאֶה וְאֵין יוֹדֵעַ וְאֵין מֵקִיץ
  choice: न किसी ने देखा, न किसी को पता चला, और न कोई जागा
  rationale: तीन समानान्तर नकारात्मक खंडों को स्पष्ट, लयात्मक और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: כִּי כֻלָּם יְשֵׁנִים
  choice: क्योंकि वे सब सो रहे थे
  rationale: यह उनके अनदेखे निकल जाने का तत्काल कारण बताता है और जारी अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תַּרְדֵּמַת יְהוָה
  choice: यहोवा की ओर से गहरी नींद
  rationale: תַּרְדֵּמָה असाधारण गहरी नींद है; ‘की ओर से’ संबंध को स्रोत या दैवी कार्य के रूप में व्यक्त करता है, मात्र स्वामित्व के रूप में नहीं।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को शीर्षक से बदलने के बजाय सुरक्षित रखता है।
- source_word: נָפְלָה עֲלֵיהֶם
  choice: उन पर छा गई थी
  rationale: शाब्दिक ‘उन पर गिर पड़ी थी’ की अपेक्षा यह नींद के आ पड़ने का स्वाभाविक हिन्दी मुहावरा है और पूर्ववर्ती अवस्था को भी दर्शाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ नाम को बनाए रखता है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: תַּרְדֵּמַת יְהוָה में दैवी अभिकरण
  choice: यहोवा की ओर से गहरी नींद उन पर छा गई थी
  alternative: यहोवा ने उन्हें गहरी नींद में डाल दिया था / यहोवा की गहरी नींद उन पर आ पड़ी थी
  rationale: निर्माण में संबंधवाचक प्रयोग है जो स्रोत या कारण सूचित करता है। चुना हुआ पाठ दैवी अभिकरण स्पष्ट करता है, पर मूल की संज्ञात्मक अभिव्यक्ति को प्रत्यक्ष सकर्मक कथन में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक स्तर अपनाया गया है। समानान्तर नकारात्मक वाक्यांशों की लय रखी गई है। ‘सिरहाने’, ‘सुराही’ और ‘छा गई थी’ सामान्य पाठक के लिए स्वाभाविक हैं; अनावश्यक पुरातन या अत्यधिक संस्कृतनिष्ठ शब्दावली से बचा गया है।
