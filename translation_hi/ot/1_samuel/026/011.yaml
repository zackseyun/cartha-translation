source:
  edition: WLC
  text: חָלִ֤ילָ/ה לִּ/י֙ מֵֽ/יהוָ֔ה מִ/שְּׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֣יחַ יְהוָ֑ה וְ֠/עַתָּה קַח נָ֨א אֶֽת הַ/חֲנִ֜ית אֲשֶׁ֧ר מראשת/ו וְ/אֶת צַפַּ֥חַת הַ/מַּ֖יִם וְ/נֵ֥לֲכָה לָּֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/011.yaml
  text: Far be it from me[a], by Yahweh, to stretch out my hand against Yahweh’s anointed. But now, please take the spear that is at his head, and the jar of water[c][b], and let us go.
translation:
  language: hi
  text: याहवे के सामने यह मुझसे कदापि न हो कि मैं याहवे के अभिषिक्त पर हाथ उठाऊँ![a] अब वह भाला, जो उसके सिरहाने है, और पानी की सुराही ले लो, और हम चलें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी मुहावरे का अर्थ तीव्र अस्वीकार है। इसका अनुवाद यह भी हो सकता है: “याहवे की शपथ, यह मुझसे कदापि न हो कि मैं याहवे के अभिषिक्त पर हाथ उठाऊँ!”'
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיהוָה
  choice: याहवे के सामने यह मुझसे कदापि न हो
  rationale: यह मुहावरा तीव्र अस्वीकार और धार्मिक भय व्यक्त करता है। מֵיְהוָה का शाब्दिक संबंध ‘याहवे से’ है, पर पूरे वाक्य में आशय यह है कि ऐसा करना याहवे की दृष्टि में अकल्पनीय है; हिंदी में ‘याहवे के सामने’ इस गंभीरता को स्वाभाविक रूप से व्यक्त करता है, जबकि वैकल्पिक शपथ-सदृश अर्थ पादटिप्पणी में रखा गया है।
- source_word: מִשְּׁלֹחַ יָדִי
  choice: मैं ... हाथ उठाऊँ
  rationale: शाब्दिक रूप ‘अपना हाथ बढ़ाना’ है, किंतु यहाँ किसी के विरुद्ध हिंसक कार्रवाई करने का मुहावरा है। ‘हाथ उठाना’ आधुनिक हिंदी में यही अर्थ स्पष्ट और संक्षेप में देता है।
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: याहवे के अभिषिक्त पर
  rationale: מָשִׁיחַ यहाँ शाऊल को याहवे द्वारा अभिषिक्त राजा के रूप में बताता है। ‘अभिषिक्त’ मूल शब्द से संबंध बनाए रखता है, पर इसे सीधे भावी ‘मसीह’ की उपाधि नहीं बनाता।
- source_word: קַח נָא
  choice: ले लो
  rationale: आज्ञार्थक रूप के साथ נָא अनुरोध को नरम करता है। संदर्भ में अबीशै से परिचित संबोधन होने के कारण ‘ले लो’ स्वाभाविक हिंदी है और अनावश्यक कठोरता से बचता है।
- source_word: הַחֲנִית אֲשֶׁר מראשתו
  choice: वह भाला, जो उसके सिरहाने है
  rationale: מראשתו सोए हुए शाऊल के सिर के पास की जगह बताता है। ‘सिरहाने’ इस स्थान को साधारण और सटीक हिंदी में व्यक्त करता है।
- source_word: צַפַּחַת הַמַּיִם
  choice: पानी की सुराही
  rationale: צַפַּחַת पानी रखने का छोटा पात्र है। ‘सुराही’ हिंदी पाठक के लिए सहज है और सामान्य पानी के पात्र का बोध कराती है।
- source_word: וְנֵלֲכָה לָּנוּ
  choice: और हम चलें
  rationale: प्रथम पुरुष बहुवचन का यह cohortative प्रस्थान का प्रस्ताव व्यक्त करता है; ‘हम चलें’ हिंदी में उसी आमंत्रक भाव को स्वाभाविक रूप से रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को नाम के रूप में रखा गया है, न कि उपाधि से बदला गया है। ‘याहवे’ मूल चार-अक्षरी नाम के प्रचलित विद्वत पुनर्निर्माण का हिंदी रूप है।
- issue: מָשִׁיחַ का इस राजकीय प्रसंग में अर्थ
  choice: अभिषिक्त
  alternative: मसीह
  rationale: यहाँ शब्द विशेष रूप से शाऊल के लिए है, जिसे राजा के रूप में अभिषेक मिला था। ‘मसीह’ लिखने से बाद की विशिष्ट उपाधि का अर्थ इस कथा में अनावश्यक रूप से आरोपित हो सकता है।
- issue: מֵיְהוָה का संबंध
  choice: याहवे के सामने
  alternative: याहवे की शपथ; याहवे की ओर से
  rationale: इब्रानी रचना संक्षिप्त और मुहावरेदार है तथा इसे याहवे के कारण/दृष्टि में निषिद्ध या शपथ-सदृश अपील के रूप में समझा जा सकता है। मुख्य पाठ में स्वाभाविक हिंदी रखते हुए विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘कदापि न हो’ मूल के तीव्र निषेध को व्यक्त करता है; ‘हाथ उठाऊँ,’ ‘सिरहाने,’ ‘ले लो’ और ‘हम चलें’ साधारण पाठकों के लिए सहज हैं। पद में केवल एक पादटिप्पणी रखी गई है और उसका चिह्न [a] मुख्य पाठ में उपस्थित है।
