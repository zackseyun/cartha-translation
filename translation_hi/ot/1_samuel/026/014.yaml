  text: Then David called to the troops and to Abner son of Ner, saying, “Will you not answer, Abner?” Abner answered and said, “Who are you, calling to the king?”
translation:
  language: hi
  text: तब दाऊद ने सैनिकों और नेर के पुत्र अब्नेर को पुकारकर कहा, “अब्नेर, क्या तुम उत्तर नहीं दोगे?” अब्नेर ने उत्तर दिया, “तुम कौन हो, जो राजा को पुकार रहे हो?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָעָם
  choice: सैनिकों
  rationale: संज्ञा का सामान्य अर्थ ‘लोग’ है, पर इस प्रसंग में शाऊल के साथ छावनी में उपस्थित सैन्य दल अभिप्रेत है; इसलिए ‘सैनिकों’ से संदर्भ स्वाभाविक और स्पष्ट रहता है।
- source_word: קָרָאתָ אֶל הַמֶּלֶךְ
  choice: राजा को पुकार रहे हो
  rationale: पूर्ववर्ती पुकार की वर्तमान प्रासंगिकता को स्वाभाविक हिन्दी में व्यक्त करता है और אֶל के लक्ष्य-संबंध को बनाए रखता है।
- source_word: הֲלוֹא תַעֲנֶה
  choice: क्या तुम उत्तर नहीं दोगे?
  rationale: नकारात्मक प्रश्न की चुनौतीपूर्ण अपेक्षा को सीधे और सहज हिन्दी में सुरक्षित रखता है।
