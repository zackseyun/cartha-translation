  text: And now[a], please let my lord the king hear the words of his servant. If Yahweh has stirred you up against me, may he accept an offering; but if it is men, they are cursed before Yahweh, because they have driven me out today from having a share in Yahweh’s inheritance, saying, ‘Go[b], serve other gods.’
translation:
  language: hi
  text: और अब, मेरे स्वामी राजा, कृपया अपने सेवक की बातें सुनें। यदि यहोवा ने आपको मेरे विरुद्ध उकसाया है, तो वह भेंट स्वीकार करे[a]; पर यदि मनुष्यों ने ऐसा किया है, तो वे यहोवा के सामने शापित हैं, क्योंकि उन्होंने आज मुझे यहोवा की विरासत में सम्मिलित रहने से निकाल दिया है, यह कहते हुए, “जा, दूसरे देवताओं की उपासना कर!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
