theological_decisions:
- issue: यहोवा द्वारा शाऊल को दाऊद के विरुद्ध उकसाने का उल्लेख
  choice: 'सशर्त कथन को उसी रूप में रखा गया है: ‘यदि यहोवा ने ... उकसाया है।’'
