  rationale: इब्रानी पाठ दैवी कारण और मानवीय उत्तरदायित्व का संबंध नहीं समझाता; अनुवाद इस तनाव को खुला रखता है।
- issue: ‘यहोवा की विरासत’ से निष्कासन का अर्थ
  choice: ‘विरासत से जुड़े रहने’ का व्यापक पदबंध रखा गया है।
  alternative: इसे केवल भौगोलिक देश, केवल आराधनास्थल तक पहुँच, या केवल वाचा-समुदाय की सदस्यता तक सीमित करना।
  rationale: प्रसंग में देश, प्रजा और धार्मिक जीवन एक-दूसरे से जुड़े हैं; व्यापक भाषा मूल की बहुआयामिता बचाती है।
- issue: दूसरे देवताओं की उपासना करने की आज्ञा
  choice: विरोधियों के निष्कासन का निहित संदेश बताने के लिए ‘मानो वे कह रहे हों’ रखा गया है।
  alternative: यह मानना कि उन्होंने यही वाक्य अक्षरशः कहा था।
  rationale: לֵאמֹר प्रत्यक्ष कथन भी ला सकता है, पर यहाँ दाऊद उनके कार्य के धार्मिक परिणाम को कथन के रूप में व्यक्त कर सकता है; अनुवाद उस संभावना को संकेतित करता है।
