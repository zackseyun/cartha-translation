  text: וְ/עַתָּ֗ה אַל יִפֹּ֤ל דָּֽמִ/י֙ אַ֔רְצָ/ה מִ/נֶּ֖גֶד פְּנֵ֣י יְהוָ֑ה כִּֽי יָצָ֞א מֶ֣לֶךְ יִשְׂרָאֵ֗ל לְ/בַקֵּשׁ֙ אֶת פַּרְעֹ֣שׁ אֶחָ֔ד כַּ/אֲשֶׁ֛ר יִרְדֹּ֥ף הַ/קֹּרֵ֖א בֶּ/הָרִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/020.yaml
  text: So now[a], do not let my blood fall to the ground away from the presence of Yahweh, for the king of Israel has come out to seek a single flea[b], as one hunts a partridge in the mountains.
translation:
  language: hi
  text: अब याहवे की उपस्थिति से दूर मेरा खून धरती पर न गिरे, क्योंकि इस्राएल का राजा एक पिस्सू को ढूँढ़ने निकला है, जैसे कोई पहाड़ों में तीतर[a] का पीछा करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी शब्द की पहचान निश्चित नहीं है; परंपरागत रूप से इसका अर्थ ‘तीतर’ समझा गया है।
    reason: lexical_uncertainty
lexical_decisions:
- source_word: דָּמִי
  choice: मेरा खून
  rationale: शाब्दिक और सजीव बिंब को बनाए रखता है; यहाँ हिंसक मृत्यु और रक्तपात का भाव है, जिसे ‘मेरा जीवन’ कहने से दबा दिया जाता।
- source_word: אַל יִפֹּל ... אַרְצָה
  choice: धरती पर न गिरे
  rationale: खून के धरती पर गिरने का ठोस इब्रानी बिंब स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: מִנֶּגֶד פְּנֵי יְהוָה
  choice: याहवे की उपस्थिति से दूर
  rationale: פְּנֵי का प्रसंगानुकूल अर्थ ‘उपस्थिति’ है; यह वाक्य दाऊद के याहवे की उपस्थिति से दूर मारे जाने की आशंका व्यक्त करता है और असहज शब्दशः अनुवाद से बचता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: לְבַקֵּשׁ אֶת פַּרְעֹשׁ אֶחָד
  choice: एक पिस्सू को ढूँढ़ने
  rationale: दाऊद की आत्म-लघुता और אֶחָד का बल बनाए रखता है; ‘शिकार करने’ जैसा अधिक व्याख्यात्मक अर्थ नहीं जोड़ा गया।
- source_word: הַקֹּרֵא
  choice: तीतर
  rationale: पारंपरिक और प्रसंगानुकूल पहचान ‘तीतर’ है, पर पक्षी की सटीक पहचान अनिश्चित होने के कारण पादटिप्पणी दी गई है।
- source_word: יִרְדֹּף ... בֶּהָרִים
  choice: पहाड़ों में ... का पीछा करता है
  rationale: क्रिया ‘पीछा करना’ और पर्वतीय परिवेश दोनों को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מִנֶּגֶד פְּנֵי יְהוָה का स्थानिक और धार्मिक भाव
  choice: याहवे की उपस्थिति से दूर
  alternative: याहवे के मुख के सामने से दूर
  rationale: ‘उपस्थिति’ इब्रानी मुहावरे का स्वाभाविक अर्थ देता है, जबकि ‘दूर’ उसके स्थानिक तनाव को बनाए रखता है; निर्वासन या पवित्रस्थान का कोई अतिरिक्त अर्थ मुख्य पाठ में निश्चित रूप से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘मेरा खून ... धरती पर न गिरे’ मूल के ठोस बिंब को बनाए रखता है, और तीतर के पीछे पहाड़ों में दौड़ने की उपमा बिना अनावश्यक व्याख्या के प्रस्तुत की गई है।
