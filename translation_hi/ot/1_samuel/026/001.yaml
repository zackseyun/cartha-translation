  text: Then the Ziphites came to Saul at Gibeah[a], saying, “Is not David hiding on the hill of Hachilah, which is before the wasteland?”
translation:
  language: hi
  text: तब ज़ीफ़ के निवासी शाऊल के पास गिबा में आए और बोले, “क्या दाऊद हकीला की पहाड़ी पर, उजाड़ प्रदेश[a] के सामने छिपा नहीं है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यशीमोन के सामने।” इब्रानी शब्द का अर्थ ‘उजाड़ प्रदेश/मरुभूमि’ हो सकता है, या वह क्षेत्र का नाम ‘यशीमोन’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: तब ... आकर
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक क्रम व्यक्त करता है और ‘आकर’ मूल गति-क्रिया को बनाए रखता है।
- source_word: הַזִּפִים
  choice: ज़ीफ़ के निवासी
  rationale: यह बहुवचन निवासी-सूचक रूप ज़ीफ़ के लोगों को दर्शाता है; हिन्दी में स्थान-नाम से बना कृत्रिम जातिवाचक शब्द रखने के बजाय यह स्पष्ट और स्वाभाविक है।
- source_word: הַגִּבְעָתָה
  choice: गिबा में ... के पास
  rationale: स्थान-नाम के साथ दिशासूचक ה गिबा की ओर गति बताता है; हिन्दी वाक्य में ‘गिबा में शाऊल के पास आकर’ गंतव्य और शाऊल का स्थान दोनों सहज रूप से व्यक्त करता है।
- source_word: לֵאמֹר
  choice: कहने लगे
  rationale: यह रूप प्रत्यक्ष कथन का परिचय देता है; ‘कहने लगे’ हिन्दी कथात्मक शैली में स्वाभाविक है, बिना कथन की विषयवस्तु बढ़ाए।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह पुष्टि की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी संरचना ‘क्या ... नहीं’ उसी बल को बनाए रखती है।
- source_word: מִסְתַּתֵּר
  choice: छिपा ... है
  rationale: हितपएल कृदन्त स्वयं को छिपाए रखने की जारी अवस्था दर्शाता है; ‘छिपा है’ स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: हकीला की पहाड़ी पर
  rationale: גבעה सामान्यतः ‘पहाड़ी’ है और בְּ यहाँ स्थल-संबंध में ‘पर’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: עַל פְּנֵי הַיְשִׁימֹן
  choice: उजाड़ प्रदेश के सामने
  rationale: עַל־פְּנֵי का ‘सामने/सम्मुख’ संबंध सीधे रखा गया है; הַיְשִׁימֹן को यहाँ सामान्य संज्ञा के रूप में ‘उजाड़ प्रदेश’ समझा गया है, बिना अनिश्चित दिशात्मक अर्थ ‘पूर्व में’ जोड़ने के।
