  text: Then Saul said to David[a], “Blessed are you, my son David. You will surely do, and you will surely prevail.” Then David went on his way, and Saul returned to his place.
translation:
  language: hi
  text: तब शाऊल ने दाविद से कहा, “तुम धन्य हो, मेरे पुत्र दाविद। तुम निश्चय ही कार्य करोगे और निश्चय ही सफल होगे।” फिर दाविद अपने मार्ग पर चला गया, और शाऊल अपने स्थान पर लौट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בָּרוּךְ אַתָּה
  choice: तुम धन्य हो
  rationale: प्रत्यक्ष संबोधन में प्रयुक्त निष्क्रिय कृदन्तीय आशीर्वाद-वाक्य का घोषणात्मक भाव बनाए रखता है; इसे केवल कामना के रूप में नहीं बदलता।
- source_word: בְּנִי דָוִד
  choice: हे मेरे पुत्र दाविद
  rationale: शाऊल के पारिवारिक अथवा संरक्षक-सदृश संबोधन को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: גַּם עָשֹׂה תַעֲשֶׂה
  choice: तुम निश्चय ही कार्य करोगे
  rationale: धातु עשה के सामान्य अर्थ को बिना ‘महान काम’ जैसी अनुल्लिखित वस्तु जोड़े रखता है; ‘निश्चय ही’ infinitive absolute और imperfect की बलाघाती रचना व्यक्त करता है।
- source_word: וְגַם יָכֹל תּוּכָל
  choice: और निश्चय ही सफल होगे
  rationale: יכל की मूल ‘सक्षम होना’ धारणा को प्रसंगानुसार परिणामकारी सफलता के रूप में स्वाभाविक हिन्दी में व्यक्त करता है और बलाघात बनाए रखता है।
- source_word: וַיֵּלֶךְ דָּוִד לְדַרְכּוֹ
  choice: फिर दाविद अपने मार्ग पर चला गया
  rationale: विदा होकर अपने रास्ते चले जाने के हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप है।
- source_word: וְשָׁאוּל שָׁב לִמְקוֹמוֹ
  choice: और शाऊल अपने स्थान को लौट गया
  rationale: ‘अपने स्थान’ को ‘घर’ न बनाकर मूल पाठ की अनिश्चितता सुरक्षित रखता है।
