revisions:
- from: तब शाऊल ने दाविद से कहा, “हे मेरे पुत्र दाविद, तुम धन्य हो! तुम निश्चय ही कार्य करोगे और निश्चय ही सफल होगे।” फिर दाविद अपने मार्ग पर चला गया, और शाऊल अपने स्थान को लौट गया।
  to: तब शाऊल ने दाविद से कहा, “तुम धन्य हो, मेरे पुत्र दाविद। तुम निश्चय ही कार्य करोगे और निश्चय ही सफल होगे।” फिर दाविद अपने मार्ग पर चला गया, और शाऊल अपने स्थान पर लौट गया।
  rationale: 'The only necessary correction is the postposition in the final clause: “अपने स्थान पर लौट गया.” The blessing and paternal form of address are also reordered to reflect the Hebrew clause sequence more directly. No footnote is required in Hindi, since both emphatic infinitive-absolute constructions are already represented by repeated “निश्चय ही,” and no ambiguity is concealed.'
