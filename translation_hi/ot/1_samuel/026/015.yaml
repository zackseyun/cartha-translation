base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/015.yaml
  text: David said to Abner[b][a], “Are you not a man? And who is like you in Israel? Why then have you not kept watch over your lord the king? For one of the people came to destroy the king your lord.”
translation:
  language: hi
  text: दाऊद ने अब्नेर से कहा, “क्या तू आदमी नहीं है? और इस्राएल में तेरे समान कौन है?[a] फिर तूने अपने स्वामी, राजा की रखवाली क्यों नहीं की? क्योंकि लोगों में से एक व्यक्ति[b] राजा, तेरे स्वामी का नाश करने आया था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इस्राएल में तेरी बराबरी का कौन है?”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “लोगों में से एक”; अर्थात छावनी में उपस्थित लोगों में से एक व्यक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא אִישׁ אַתָּה
  choice: क्या तू पुरुष नहीं है?
  rationale: אִישׁ का मूल अर्थ ‘पुरुष’ है। प्रसंग में यह अब्नेर की प्रतिष्ठा और सैनिक उत्तरदायित्व को चुनौती देता है, पर मूल पाठ में ‘वीर’ जैसा विशेषण नहीं है; इसलिए उसे नहीं जोड़ा गया।
- source_word: וּמִי כָמוֹךָ בְּיִשְׂרָאֵל
  choice: और इस्राएल में तेरे समान कौन है?
  rationale: यह अनुवाद כָמוֹךָ की प्रत्यक्ष तुलनात्मक अभिव्यक्ति को बनाए रखता है और हिंदी में भी स्वाभाविक अलंकारिक प्रश्न है।
- source_word: וְלָמָּה לֹא שָׁמַרְתָּ אֶל
  choice: फिर तूने ... की रखवाली क्यों नहीं की?
  rationale: שׁמר यहाँ राजा की सुरक्षा के लिए सतर्क निगरानी और रक्षा का भाव रखता है। ‘रखवाली’ सैनिक प्रसंग में दोनों पक्षों को सहज हिंदी में व्यक्त करती है।
- source_word: אֲדֹנֶיךָ הַמֶּלֶךְ
  choice: अपने स्वामी राजा
  rationale: אֲדֹנֶיךָ पदानुक्रम और निष्ठा का संबंध दिखाता है। ‘स्वामी राजा’ इस संबंध को बनाए रखता है और ‘अपने’ हिंदी में संबंध को स्पष्ट करता है।
- source_word: כִּי בָא אַחַד הָעָם
  choice: क्योंकि लोगों में से एक व्यक्ति आया था
  rationale: אַחַד הָעָם का शाब्दिक भाव ‘लोगों में से एक’ है। ‘व्यक्ति’ जोड़ने से आधुनिक हिंदी में वाक्य स्पष्ट होता है, बिना उसे सैनिक या किसी खास व्यक्ति के रूप में सीमित किए।
- source_word: לְהַשְׁחִית
  choice: नाश करने
  rationale: שׁחת के हिफ़ील रूप का सामान्य अर्थ ‘नाश करना’ है। प्रसंग में आशय राजा को मार डालना है, फिर भी व्यापक मूल शब्द को मुख्य पाठ में सुरक्षित रखा गया है।
- source_word: הַמֶּלֶךְ אֲדֹנֶיךָ
  choice: तेरे स्वामी राजा
  rationale: मूल पाठ के दोहराव और बदले हुए शब्दक्रम से अब्नेर की जवाबदेही पर बल पड़ता है। हिंदी में ‘तेरे स्वामी राजा’ उस पुनरुक्ति और आरोपात्मक बल को बनाए रखता है।
