base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/005.yaml
  text: Then David arose and came to the place where Saul had camped[a], and David saw the place where Saul lay, and Abner son of Ner, the commander of his army. Saul was lying within the encampment, and the people were camped around him.
translation:
  language: hi
  text: तब दाऊद उठकर उस स्थान पर गया जहाँ शाऊल ने पड़ाव डाला था। दाऊद ने वह जगह देखी जहाँ शाऊल लेटा था, और नेर के पुत्र अब्नेर को भी देखा, जो शाऊल की सेना का प्रधान था। शाऊल छावनी के घेरे के भीतर[a] लेटा हुआ था और लोग उसके चारों ओर डेरा डाले हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसका अधिक शाब्दिक अर्थ “घेरे में” है; संभवतः आशय छावनी के गोलाकार घेरे के भीतरी भाग या मध्य स्थान से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַיָּבֹא אֶל־הַמָּקוֹם
  choice: तब दाऊद उठकर उस स्थान पर गया
  rationale: Narrative sequence is expressed naturally in Hindi with ‘तब’ and the paired action ‘उठकर…गया’; this conveys movement to the location without unnecessary formality.
- source_word: חָנָה
  choice: पड़ाव डाला था
  rationale: The qatal in the relative clause refers to Saul’s prior encampment. ‘पड़ाव डाला था’ is clear, contemporary Hindi and preserves the prior-time sense.
- source_word: וַיַּרְא ... אֶת־הַמָּקוֹם
  choice: वह जगह देखी
  rationale: ‘देखी’ directly represents ראה, while ‘जगह’ is natural Hindi for the particular spot David observed.
- source_word: שָׁכַב ... שֹׁכֵב
  choice: लेटा था ... लेटा हुआ था
  rationale: The first phrase identifies Saul’s sleeping place, while the participial second phrase describes his current posture. The two Hindi forms retain this slight aspectual distinction.
- source_word: וְאַבְנֵר בֶּן־נֵר שַׂר צְבָאוֹ
  choice: और नेर का पुत्र अब्नेर, जो उसकी सेना का प्रधान था, भी था
  rationale: The Hebrew coordination is elliptical. This rendering keeps Abner as a separately noticed person at the location without adding a more specific posture than the syntax explicitly supplies. ‘सेना का प्रधान’ is dignified and readily understandable.
- source_word: בַּמַּעְגָּל
  choice: छावनी के घेरे के भीतर
  rationale: מַעְגָּל denotes a circle or circular camp arrangement here. ‘छावनी के घेरे के भीतर’ conveys both the camp setting and the spatial image while the footnote preserves the literal nuance.
- source_word: חֹנִים סְבִיבֹתָיו
  choice: उसके चारों ओर डेरा डाले हुए थे
  rationale: This naturally represents the participial state of the troops encamped around Saul and retains the spatial emphasis of סביבתיו.
