  edition: WLC
  text: וַ/יֹּ֕אמֶר לָ֥/מָּה זֶּ֛ה אֲדֹנִ֥/י רֹדֵ֖ף אַחֲרֵ֣י עַבְדּ֑/וֹ כִּ֚י מֶ֣ה עָשִׂ֔יתִי וּ/מַה בְּ/יָדִ֖/י רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/018.yaml
  text: And he said[a], “Why is my lord pursuing his servant like this? For what have I done[b], and what evil is in my hand?”
translation:
  language: hi
  text: और उसने कहा, “मेरे प्रभु इस प्रकार अपने सेवक का पीछा क्यों कर रहे हैं? मैंने क्या किया है, और मेरे हाथ में कौन-सी बुराई है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: इब्रानी कथात्मक क्रम को सहज हिन्दी में बनाए रखता है और वक्ता दाऊद का संकेत करता है।
- source_word: לָמָּה זֶּה
  choice: इस प्रकार ... क्यों
  rationale: प्रश्न की बलात्मकता और ‘ऐसा/इस प्रकार क्यों’ का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह शाऊल जैसे मानवीय वरिष्ठ के लिए आदरसूचक संबोधन है; यहाँ ईश्वरीय उपाधि नहीं।
- source_word: רֹדֵף אַחֲרֵי
  choice: पीछा कर रहे हैं
  rationale: सक्रिय और प्रतिकूल पीछा करने का भाव स्पष्ट करता है, बिना ‘सताने’ जैसी अधिक व्याख्यात्मक भाषा अपनाए।
- source_word: עַבְדּוֹ
  choice: अपने सेवक
  rationale: मसोरेटिक पाठ के तृतीय-पुरुष एकवचन संबंधसूचक प्रत्यय को हिन्दी के आदरसूचक प्रत्यक्ष संबोधन में स्वाभाविक रूप से सुरक्षित रखता है।
- source_word: כִּי מֶה עָשִׂיתִי
  choice: मैंने क्या किया है
  rationale: כִּי यहाँ अगले व्याख्यात्मक आलंकारिक प्रश्न को प्रस्तुत करता है; हिन्दी में अलग प्रश्न-वाक्य बिना कृत्रिम ‘क्योंकि’ के वही संबंध व्यक्त करता है।
- source_word: וּמַה בְּיָדִי רָעָה
  choice: और मेरे हाथ में कौन-सी बुराई है
  rationale: ‘हाथ में’ की इब्रानी छवि तथा רָעָה की प्रबल नैतिक शब्दावली दोनों को सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थक बहुवचन क्रिया (‘कर रहे हैं’) शाऊल के प्रति दाऊद के सम्मान को दर्शाती है। ‘अपने सेवक’ तृतीय-पुरुष इब्रानी रूप को स्वाभाविक हिन्दी में बनाए रखता है। ‘मेरे हाथ में बुराई’ मूल रूपक को जानबूझकर सुरक्षित रखता है; संदर्भ में इसका अर्थ दोष, हानि की मंशा, या बुरा काम करने की सामर्थ्य हो सकता है।
