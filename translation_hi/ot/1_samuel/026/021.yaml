  edition: WLC
  text: וַ/יֹּאמֶר֩ שָׁא֨וּל חָטָ֜אתִי שׁ֣וּב בְּנִֽ/י דָוִ֗ד כִּ֠י לֹֽא אָרַ֤ע לְ/ךָ֙ ע֔וֹד תַּ֠חַת אֲשֶׁ֨ר יָקְרָ֥ה נַפְשִׁ֛/י בְּ/עֵינֶ֖י/ךָ הַ/יּ֣וֹם הַ/זֶּ֑ה הִנֵּ֥ה הִסְכַּ֛לְתִּי וָ/אֶשְׁגֶּ֖ה הַרְבֵּ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/021.yaml
  text: Then Saul said[a], “I have sinned. Return, my son David, for I will not harm you again, because my life was precious in your eyes this day. Look[b], I have acted foolishly and have gone badly astray.”
translation:
  language: hi
  text: तब शाऊल ने कहा, “मैंने पाप किया है। मेरे बेटे दाऊद, लौट आओ! अब मैं तुम्हें हानि नहीं पहुँचाऊँगा, क्योंकि आज मेरा जीवन[a] तुम्हारी दृष्टि में बहुमूल्य था। देखो, मैंने मूर्खता की है और मैं बहुत बुरी तरह भटक गया हूँ[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरा प्राण तुम्हारी दृष्टि में बहुमूल्य था।” यहाँ “प्राण” (נֶפֶשׁ) से आशय प्रसंग में शाऊल के जीवन या स्वयं उसके व्यक्ति से है।
    reason: lexical_alternative
  - marker: b
    text: या, “और मैंने बहुत बड़ी भूल की है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חָטָאתִי
  choice: मैंने पाप किया है
  rationale: काल पूर्ण रूप तत्काल स्वीकारोक्ति व्यक्त करता है; हिन्दी में पूर्ण वर्तमान इस संदर्भ में स्वाभाविक है और नैतिक-धार्मिक अर्थ को स्पष्ट रखता है।
- source_word: שׁוּב
  choice: लौट आओ
  rationale: आज्ञार्थक रूप को आधुनिक हिन्दी में सीधे और स्वाभाविक ढंग से व्यक्त करता है, बिना लौटने के गंतव्य को अनावश्यक रूप से निश्चित किए।
- source_word: בְּנִי דָוִד
  choice: मेरे बेटे दाऊद
  rationale: सम्बोधन में शाऊल की संबंधसूचक भाषा और दाऊद का नाम, दोनों सुरक्षित रहते हैं।
- source_word: לֹא אָרַע לְךָ עוֹד
  choice: अब मैं फिर तुम्हें हानि नहीं पहुँचाऊँगा
  rationale: यहाँ क्रिया किसी के साथ बुरा करने या उसे हानि पहुँचाने के अर्थ में है; यह हिन्दी प्रयोग स्पष्ट और स्वाभाविक है।
- source_word: תַּחַת אֲשֶׁר
  choice: क्योंकि
  rationale: इस प्रसंग में पदबंध शाऊल की प्रतिज्ञा का कारण बताता है।
- source_word: יָקְרָה נַפְשִׁי בְּעֵינֶיךָ
  choice: मेरा जीवन तुम्हारी दृष्टि में बहुमूल्य था
  rationale: दाऊद ने शाऊल को जीवित छोड़ा है, इसलिए נֶפֶשׁ यहाँ उसके जीवन या स्वयं उसके व्यक्ति की ओर संकेत करता है; ‘तुम्हारी दृष्टि में बहुमूल्य’ इब्रानी मुहावरे को सुरक्षित रखता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: इब्रानी ‘इस दिन’ का आधुनिक हिन्दी में सहज और पूरा अर्थ देता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला कथन-सूचक है; ‘देखो’ गरिमापूर्ण और वर्तमान हिन्दी में स्वाभाविक है।
- source_word: הִסְכַּלְתִּי
  choice: मैंने मूर्खता की है
  rationale: यह केवल बुद्धि के अभाव नहीं, बल्कि मूर्खतापूर्ण आचरण को व्यक्त करता है।
- source_word: וָאֶשְׁגֶּה הַרְבֵּה מְאֹד
  choice: मैं बहुत बुरी तरह भटक गया हूँ
  rationale: שגה के भटकने या गंभीर रूप से चूकने के रूपक को बनाए रखते हुए הַרְבֵּה מְאֹד की तीव्रता भी व्यक्त होती है।
theological_decisions:
- issue: נֶפֶשׁ का प्रसंगगत अर्थ
  choice: मेरा जीवन
  alternative: मेरा प्राण / मेरा प्राणी-स्वरूप
  rationale: वर्णन में दाऊद ने शाऊल का शारीरिक जीवन बचाया है। इसलिए पद किसी पृथक अभौतिक ‘आत्मा’ के विषय में सिद्धान्त नहीं देता, बल्कि शाऊल के जीवन अथवा स्वयं उसके व्यक्ति को दर्शाता है।
- issue: שגה में निहित रूपक
  choice: भटक गया हूँ
  alternative: बहुत बड़ी भूल की है
  rationale: ‘भटकना’ मूल क्रिया की रूपकात्मक छवि और शाऊल की गंभीर स्वीकारोक्ति, दोनों को बनाए रखता है; इसे केवल साधारण गलती तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘लौट आओ’, ‘हानि नहीं पहुँचाऊँगा’ और ‘मूर्खता की है’ सामान्य पाठक के लिए स्पष्ट हैं। इब्रानी मुहावरों की अर्थवत्ता बचाते हुए अस्वाभाविक शब्दशः संरचना से बचा गया है।
