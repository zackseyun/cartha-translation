    issue: '"एक पहाड़ की चोटी" does not reflect the definite noun in Hebrew.'
    rationale: הָהָר means "the mountain." Hindi can naturally express this as "उस पहाड़," preserving the narrative referent more closely.
  - severity: medium
    issue: The word order in "दूर एक पहाड़ की चोटी पर खड़ा हो गया" is awkward.
    rationale: Moving "दूर" after the location gives a natural Hindi sentence while retaining מֵרָחֹק as a distinct distance marker.
  revised_text: तब दाऊद दूसरी ओर पार गया और उस पहाड़ की चोटी पर दूर खड़ा हुआ; उनके बीच बहुत दूरी थी।
