  text: Then David crossed over to the other side and stood on the top of the mountain at a distance[a]; there was a great space between them.
translation:
  language: hi
  text: तब दाऊद दूसरी ओर पार गया और उस पहाड़ की चोटी पर दूर खड़ा हुआ; उनके बीच बहुत दूरी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֹר
  choice: चला गया
  rationale: עבר का मूल भाव एक ओर से दूसरी ओर जाना या पार होना है। यहाँ הָעֵבֶר के साथ ‘दूसरी ओर चला गया’ आधुनिक हिन्दी में स्वाभाविक है और दिशात्मक अर्थ बनाए रखता है।
- source_word: הָעֵבֶר
  choice: दूसरी ओर
  rationale: संज्ञा यहाँ सामने या विपरीत ओर का संकेत करती है; ‘दूसरी ओर’ प्रसंगानुकूल और सहज है।
- source_word: וַיַּעֲמֹד
  choice: खड़ा हो गया
  rationale: עמד का सामान्य अर्थ ‘खड़ा होना’ है। हिन्दी में कथात्मक क्रम के लिए ‘खड़ा हो गया’ स्वाभाविक है और अनावश्यक सैन्य भाव नहीं जोड़ता।
- source_word: עַל רֹאשׁ הָהָר
  choice: एक पहाड़ की चोटी पर
  rationale: भौगोलिक प्रयोग में רֹאשׁ का अर्थ ‘चोटी’ है। निश्चित उपपद का हिन्दी में अनिवार्य रूप से ‘उस’ अनुवाद करना आवश्यक नहीं; अनिर्दिष्ट ‘एक पहाड़’ हिन्दी कथन में स्वाभाविक है।
- source_word: מֵרָחֹק
  choice: दूर
  rationale: यह स्थानगत दूरी बताता है। ‘दूर’ आधुनिक हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: רַב הַמָּקוֹם
  choice: बहुत दूरी थी
  rationale: शाब्दिक संरचना ‘स्थान बड़ा था’ है, पर प्रसंग में מָקוֹם दोनों पक्षों के बीच विस्तृत अंतर को दर्शाता है। ‘बहुत दूरी थी’ अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: בֵּינֵיהֶם
  choice: उनके बीच
  rationale: यह दाऊद और सामने के लोगों के बीच की स्थानगत दूरी को सीधे व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। मूल के दो दूरी-सूचकों—מֵרָחֹק और רַב הַמָּקוֹם בֵּינֵיהֶם—को क्रमशः ‘दूर’ और ‘उनके बीच बहुत दूरी थी’ के रूप में अलग-अलग बनाए रखा गया है।
