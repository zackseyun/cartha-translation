source:
  edition: WLC
  text: וְ/הִנֵּ֗ה כַּ/אֲשֶׁ֨ר גָּדְלָ֧ה נַפְשְׁ/ךָ֛ הַ/יּ֥וֹם הַ/זֶּ֖ה בְּ/עֵינָ֑/י כֵּ֣ן תִּגְדַּ֤ל נַפְשִׁ/י֙ בְּ/עֵינֵ֣י יְהוָ֔ה וְ/יַצִּלֵ֖/נִי מִ/כָּל צָרָֽה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/024.yaml
  text: And look[a], just as your life was precious in my eyes this day, so may my life be precious in the eyes of Yahweh, and may he deliver me from all distress.
translation:
  language: hi
  text: और देखो, जैसे आज तुम्हारा जीवन मेरी दृष्टि में बहुमूल्य था, वैसे ही मेरा जीवन याहवे की दृष्टि में बहुमूल्य हो, और वह मुझे हर संकट से छुड़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह आगे कही जाने वाली बात पर विशेष ध्यान दिलाता है; आधुनिक हिन्दी में स्वाभाविक रहते हुए इब्रानी के बल को बनाए रखता है।
- source_word: גָּדְלָה ... נַפְשְׁךָ ... בְּעֵינַי
  choice: तुम्हारा जीवन मेरी दृष्टि में बहुमूल्य था
  rationale: शाब्दिक रूप से ‘बड़ा था’ वाला इब्रानी मुहावरा यहाँ ऊँचे मूल्य या बहुमूल्यता को व्यक्त करता है; प्रसंग में दाऊद द्वारा शाऊल का जीवन बख्शना अभिप्रेत है।
- source_word: נֶפֶשׁ
  choice: जीवन
  rationale: दोनों स्थानों पर शब्द संकट में प्राण या जीवन के अर्थ में है, न कि अमूर्त ‘आत्मा’ के अर्थ में।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: समय पर दिए गए इब्रानी बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תִּגְדַּל ... נַפְשִׁי ... בְּעֵינֵי יְהוָה
  choice: मेरा जीवन यहोवा की दृष्टि में बहुमूल्य हो
  rationale: अपूर्ण क्रिया यहाँ कामना या प्रार्थना व्यक्त करती है; ‘बहुमूल्य हो’ पहले खंड के साथ तुलना को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְיַצִּלֵנִי
  choice: और वह मुझे ... छुड़ाए
  rationale: हिफ़ील रूप बचाने या छुड़ाने का अर्थ देता है; यहाँ कामना का भाव समानांतर क्रिया के साथ बना रहता है।
- source_word: מִכָּל צָרָה
  choice: हर संकट से
  rationale: צָרָה विपत्ति, क्लेश या संकट को सूचित करता है; ‘हर संकट’ व्यापकता और गंभीरता दोनों को स्वाभाविक हिन्दी में रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में उपाधि नहीं बल्कि चतुरक्षरीय विशिष्ट नाम है। हिन्दी पाठकों के लिए परिचित ‘यहोवा’ चुना गया, जबकि ‘याहवे’ सम्भावित वैकल्पिक लिप्यंतरण है।
- issue: दाऊद के कथन में प्रतिफल और प्रार्थना का संबंध
  choice: कामना के रूप में ‘बहुमूल्य हो ... छुड़ाए’
  alternative: निश्चित प्रतिज्ञा के रूप में ‘बहुमूल्य होगा ... छुड़ाएगा’
  rationale: इब्रानी अपूर्ण क्रियाएँ इस प्रसंग में आशा या प्रार्थना को स्वाभाविक रूप से व्यक्त कर सकती हैं। अनुवाद यह दावा नहीं जोड़ता कि दाऊद अपने आचरण के आधार पर परमेश्वर पर प्रतिफल देने का दायित्व रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मेरी दृष्टि में/यहोवा की दृष्टि में’ तुलना की इब्रानी संरचना सुरक्षित है; ‘बहुमूल्य’ ने शाब्दिक ‘बड़ा’ के मुहावरेदार अर्थ को व्यक्त किया है।
