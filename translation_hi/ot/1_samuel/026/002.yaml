  yaml_path: translation/ot/1_samuel/026/002.yaml
  text: Then Saul arose and went down to the wilderness of Ziph[a], and with him were three thousand chosen men of Israel, to seek David in the wilderness of Ziph.
translation:
  language: hi
  text: तब शाऊल उठा और इस्राएल के तीन हज़ार चुने हुए पुरुषों को अपने साथ लेकर ज़ीफ़ के उजाड़ प्रदेश में उतरा, दाऊद को ज़ीफ़ के उजाड़ प्रदेश में खोजने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: यह कथात्मक प्रयोग निर्णायक कार्रवाई के आरम्भ को दिखाता है; ‘उठा’ मूल मुहावरे को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וַיֵּרֶד
  choice: उतर गया
  rationale: मूल क्रिया में नीचे जाने की दिशात्मक धारणा है, जिसे ‘उतर गया’ स्पष्ट रूप से व्यक्त करता है।
- source_word: מִדְבַּר זִיף
  choice: ज़ीफ़ का उजाड़ प्रदेश
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं, बल्कि कम आबादी वाला खुला और निर्जन भूभाग भी हो सकता है; ‘उजाड़ प्रदेश’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: וְאִתּוֹ
  choice: उसके साथ
  rationale: यह साथ होने का सीधा अर्थ देता है और अगले संज्ञा-समूह के साथ स्वाभाविक हिंदी वाक्य बनाता है।
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ
  choice: तीन हज़ार ... पुरुष
  rationale: मूल में शाब्दिक रूप से ‘तीन हज़ार पुरुष’ है; सैन्य संदर्भ होने पर भी ‘सैनिक’ जोड़ने के बजाय मूल की सामान्य संज्ञा रखी गई है।
- source_word: בְּחוּרֵי יִשְׂרָאֵל
  choice: इस्राएल के ... चुने हुए पुरुष
  rationale: यह पद चुने या चुनिंदा लोगों को सूचित करता है; ‘चुने हुए’ उसके मूल शब्दार्थ को बनाए रखता है।
- source_word: לְבַקֵּשׁ אֶת דָּוִד
  choice: दाऊद को खोजने
  rationale: पीछा करने के प्रसंग में בקש का अर्थ किसी व्यक्ति को ढूँढ़ना या उसकी खोज करना है; ‘खोजने’ संक्षिप्त और स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी में स्थानवाचक पद की पुनरावृत्ति को बनाए रखा गया है। लंबे इब्रानी वाक्य को स्पष्ट हिंदी के लिए तीन वाक्यों में विभाजित किया गया है; अंतिम उद्देश्यवाचक खंड का आशय सुरक्षित है।
