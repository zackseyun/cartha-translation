  yaml_path: translation/ot/1_samuel/026/006.yaml
  text: Then David answered and said to Ahimelech the Hittite and to Abishai son of Zeruiah[a], Joab’s brother, “Who will go down with me to Saul, to the camp?” And Abishai said, “I will go down with you.”
translation:
  language: hi
  text: तब दाऊद ने उत्तर देकर हित्ती अहीमेलेक और सरूयाह के पुत्र, योआब के भाई अबीशै से कहा, “कौन मेरे साथ नीचे शाऊल के पास, छावनी में जाएगा?”[a] अबीशै ने कहा, “मैं तुम्हारे साथ नीचे जाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मेरे साथ शाऊल के पास, छावनी की ओर।” ‘शाऊल’ और ‘छावनी’ दोनों से पहले इब्रानी पूर्वसर्ग אֶל (‘की ओर/के पास’) आया है।
    reason: मूल इब्रानी की दोहरी אֶל-संरचना को दिखाना, जिसे मुख्य पाठ में स्वाभाविक हिन्दी के लिए ‘शाऊल के पास, छावनी में’ किया गया है।
lexical_decisions:
- source_word: וַיַּעַן דָּוִד וַיֹּאמֶר
  choice: तब दाऊद ने उत्तर देकर ... कहा
  rationale: इब्रानी कथात्मक सूत्र में ‘उत्तर दिया’ और ‘कहा’ दोनों क्रियाएँ हैं। ‘उत्तर देकर ... कहा’ उन्हें स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֲחִימֶלֶךְ הַחִתִּי
  choice: हित्ती अहीमेलेक
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण किया गया है और जातीय विशेषण को हिन्दी के प्रचलित रूप ‘हित्ती’ में रखा गया है।
- source_word: אֲבִישַׁי בֶּן צְרוּיָה אֲחִי יוֹאָב
  choice: सरूयाह के पुत्र, योआब के भाई अबीशै
  rationale: दोनों पारिवारिक पहचानों को सुरक्षित रखते हुए हिन्दी में स्पष्ट और स्वाभाविक क्रम अपनाया गया है।
- source_word: מִי יֵרֵד אִתִּי
  choice: कौन मेरे साथ नीचे ... जाएगा
  rationale: יָרַד का दिशासूचक अर्थ ‘नीचे जाना/उतरना’ सुरक्षित रखा गया है; प्रश्न में ‘नीचे जाएगा’ प्रसंगानुकूल और सहज है।
- source_word: אֶל שָׁאוּל אֶל הַמַּחֲנֶה
  choice: छावनी में शाऊल के पास
  rationale: इब्रानी में ‘शाऊल’ और ‘छावनी’ दोनों से पहले אֶל है। हिन्दी में शब्दशः दोहराव असहज होने के कारण आशय को स्वाभाविक रूप में व्यक्त किया गया है और संरचनात्मक अंतर पादटिप्पणी में बताया गया है।
- source_word: הַמַּחֲנֶה
  choice: छावनी
  rationale: מַחֲנֶה के सैन्य संदर्भ के लिए ‘छावनी’ सामान्य, स्पष्ट और आधुनिक हिन्दी शब्द है।
- source_word: אֲנִי אֵרֵד עִמָּךְ
  choice: मैं तुम्हारे साथ नीचे जाऊँगा
  rationale: दाऊद के प्रश्न की दिशासूचक क्रिया को उत्तर में भी दोहराया गया है, जिससे मूल का कथात्मक सामंजस्य बना रहता है।
