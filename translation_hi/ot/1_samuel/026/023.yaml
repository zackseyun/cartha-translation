source:
  edition: WLC
  text: וַֽ/יהוָה֙ יָשִׁ֣יב לָ/אִ֔ישׁ אֶת צִדְקָת֖/וֹ וְ/אֶת אֱמֻנָת֑/וֹ אֲשֶׁר֩ נְתָנְ/ךָ֨ יְהוָ֤ה הַ/יּוֹם֙ בְּ/יָ֔ד וְ/לֹ֣א אָבִ֔יתִי לִ/שְׁלֹ֥חַ יָדִ֖/י בִּ/מְשִׁ֥יחַ יְהוָֽה־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/023.yaml
  text: And Yahweh will repay each man for his righteousness and his faithfulness[a], because Yahweh gave you into my hand today[b], but I was not willing to stretch out my hand against Yahweh’s anointed.
translation:
  language: hi
  text: और यहोवा हर एक मनुष्य को उसकी धार्मिकता और उसकी विश्वासयोग्यता का प्रतिफल देगा[a], क्योंकि आज यहोवा ने तुम्हें मेरे हाथ में दे दिया, फिर भी मैंने यहोवा के अभिषिक्त[b] पर हाथ उठाना नहीं चाहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और यहोवा हर एक मनुष्य को उसकी धार्मिकता और उसकी विश्वासयोग्यता लौटा देगा।”
    reason: יָשִׁיב के मूल ‘लौटाना’ भाव और प्रतिफल देने वाले प्रसंगगत अर्थ—दोनों को सुरक्षित रखना।
  - marker: b
    text: “यहोवा का अभिषिक्त” अर्थात यहोवा द्वारा अभिषिक्त राजा; यहाँ शाऊल।
    reason: प्राचीन इस्राएली राजकीय पदवी का सांस्कृतिक और प्रसंगगत अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: वाव को प्रसंग-संबंधी ‘और’ से तथा वाचा के नाम יהוה को ‘यहोवा’ से व्यक्त किया गया है।
- source_word: יָשִׁיב לָאִישׁ
  choice: हर एक मनुष्य को ... प्रतिफल देगा
  rationale: हिफ़ील יָשִׁיב यहाँ आचरण के अनुरूप लौटाने या बदला देने के अर्थ में है; ‘प्रतिफल देगा’ आधुनिक हिन्दी में स्वाभाविक है। לָאִישׁ की सामान्य, प्रतिनिधिक पुल्लिंग एकवचन शक्ति ‘हर एक मनुष्य’ में बनी रहती है।
- source_word: צִדְקָתוֹ
  choice: उसकी धार्मिकता
  rationale: यहाँ शब्द नैतिक खराई और उचित आचरण को दर्शाता है; ‘धार्मिकता’ इसका प्रचलित और अर्थपूर्ण हिन्दी समतुल्य है।
- source_word: וְאֶת אֱמֻנָתוֹ
  choice: और उसकी विश्वासयोग्यता
  rationale: אֱמוּנָה यहाँ विश्वास करने की क्रिया से अधिक निष्ठा, भरोसेमंदी और आचरणगत वफ़ादारी को दर्शाता है।
- source_word: אֲשֶׁר נְתָנְךָ יְהוָה הַיּוֹם בְּיָד
  choice: क्योंकि आज यहोवा ने तुम्हें मेरे हाथ में दे दिया था
  rationale: सापेक्ष उपवाक्य दाऊद की धार्मिकता और विश्वासयोग्यता प्रकट होने की परिस्थिति स्पष्ट करता है। प्रसंग से निहित प्रथम पुरुष ‘मेरे’ जोड़ा गया है।
- source_word: וְלֹא אָבִיתִי
  choice: फिर भी मैंने ... नहीं चाहा
  rationale: אבה इच्छा या तत्परता बताता है। अवसर मिलने और संयम बरतने का विरोध ‘फिर भी’ से स्पष्ट होता है, जबकि ‘नहीं चाहा’ मूल की सूक्ष्मता बनाए रखता है।
- source_word: לִשְׁלֹחַ יָדִי
  choice: हाथ उठाना
  rationale: शाब्दिक ‘अपना हाथ बढ़ाना’ हिंसक कार्रवाई का मुहावरा है; हिन्दी का ‘हाथ उठाना’ वही चित्र और आशय स्वाभाविक रूप में देता है।
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: यहोवा के अभिषिक्त पर
  rationale: מָשִׁיחַ यहाँ यहोवा द्वारा अभिषिक्त राजा शाऊल की पदवी है; ‘अभिषिक्त’ बाद की मसीही विशिष्टता आरोपित किए बिना मूल अर्थ रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम है। हिन्दी बाइबलीय परंपरा में परिचित ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: אִישׁ का सामान्य पुल्लिंग प्रयोग
  choice: हर एक मनुष्य
  alternative: हर व्यक्ति
  rationale: इब्रानी का प्रतिनिधिक पुल्लिंग एकवचन बनाए रखा गया है, पर हिन्दी में कथन सार्वभौमिक रूप से समझ में आता है।
- issue: शाऊल के लिए מְשִׁיחַ
  choice: यहोवा का अभिषिक्त
  alternative: यहोवा का मसीह
  rationale: ऐतिहासिक प्रसंग में यह यहोवा द्वारा अभिषिक्त राजा शाऊल का संकेत है, कोई प्रत्यक्ष अंतिम-मसीही पदवी नहीं।
- issue: אֲשֶׁר उपवाक्य का संबंध
  choice: क्योंकि
  alternative: जबकि; यद्यपि
  rationale: इसे दाऊद की धार्मिकता और विश्वासयोग्यता का ठोस कारण/प्रमाण बताने वाला माना गया है; अन्य संबंध संभव हैं, इसलिए अनुवाद प्रसंगानुकूल व्याख्यात्मक है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। ‘प्रतिफल देगा’ अर्थ को स्वाभाविक बनाता है, जबकि पादटिप्पणी शाब्दिक ‘लौटा देगा’ को सुरक्षित रखती है। ‘हाथ उठाना’ हिंसक कार्रवाई के इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है।
