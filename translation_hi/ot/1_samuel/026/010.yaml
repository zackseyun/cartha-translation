source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר דָּוִד֙ חַי יְהוָ֔ה כִּ֥י אִם יְהוָ֖ה יִגָּפֶ֑/נּוּ אֽוֹ יוֹמ֤/וֹ יָבוֹא֙ וָ/מֵ֔ת א֧וֹ בַ/מִּלְחָמָ֛ה יֵרֵ֖ד וְ/נִסְפָּֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/010.yaml
  text: And David said[a], “As Yahweh lives, surely Yahweh will strike him, or his day will come to die[c][b], or he will go down into battle and perish.”
translation:
  language: hi
  text: दाऊद ने कहा, “याहवे के जीवन की शपथ, निश्चय ही याहवे उस पर प्रहार करेगा; या उसका दिन आएगा और वह मर जाएगा; या वह युद्ध में उतरेगा और नष्ट हो जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חַי יְהוָה
  choice: जीवित याहवे की शपथ
  rationale: यह इब्रानी की प्रचलित शपथ-विधि है। यह हिंदी में स्वाभाविक रूप से उसकी गंभीर और दृढ़ प्रतिज्ञात्मक शक्ति व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित करने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: כִּי אִם
  choice: निश्चय ही
  rationale: शपथ के इस प्रसंग में यह पदबंध दाऊद के कथन पर बल देता है; यहाँ इसे अपवादसूचक अर्थ में लेना कम स्वाभाविक है।
- source_word: יִגָּפֶנּוּ
  choice: उसे मार गिराएगा
  rationale: नָגַף यहाँ याहवे द्वारा निर्णायक प्रहार किए जाने को व्यक्त करता है। प्रसंग मृत्यु के संभावित ढंगों का है, इसलिए यह हिंदी में स्वाभाविक है, यद्यपि मूल क्रिया प्रहार के ठीक साधन को खुला छोड़ती है।
- source_word: יוֹמוֹ יָבוֹא
  choice: उसका दिन आएगा
  rationale: मूल का अशुभ और संकेतात्मक मुहावरा बनाए रखा गया है; आशय उसकी मृत्यु का समय आने से है।
- source_word: וָמֵת
  choice: और वह मर जाएगा
  rationale: इब्रानी क्रियाक्रम को स्पष्ट, स्वाभाविक हिंदी में व्यक्त किया गया है और मृत्यु को प्रत्यक्ष रखा गया है।
- source_word: בַמִּלְחָמָה יֵרֵד
  choice: वह युद्ध में उतरेगा
  rationale: यָרַד के ‘उतरना’ भाव को सुरक्षित रखते हुए हिंदी के स्वाभाविक सैनिक प्रयोग का उपयोग किया गया है।
- source_word: וְנִסְפָּה
  choice: और नष्ट हो जाएगा
  rationale: סָפָה यहाँ युद्ध में मिट जाने या मारे जाने का भाव रखता है। ‘नष्ट हो जाएगा’ पहले प्रयुक्त ‘मर जाएगा’ से शब्दगत भिन्नता भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम प्रत्यक्ष रूप से आया है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: दाऊद के कथन में परमेश्वर की कार्रवाई और मृत्यु के अन्य संभावित ढंग
  choice: तीन विकल्पों को समानांतर और अनिर्णीत रखा गया है
  alternative: पहले खंड को बाद के दोनों विकल्पों का सामान्य सार मानना
  rationale: אוֹ…אוֹ की रचना तीन संभावनाएँ प्रस्तुत करती है। अनुवाद यह निश्चित नहीं करता कि याहवे का प्रहार किस साधन से होगा।
translation_notes:
  register: आधुनिक मानक हिंदी; भाषा गंभीर, मौखिक रूप से सहज और सामान्य पाठक के लिए स्पष्ट रखी गई है। शपथ-विधि और तीन समानांतर संभावनाओं की संरचना सुरक्षित है।
