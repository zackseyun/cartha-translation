base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/009.yaml
  text: But David said to Abishai[a], “Do not destroy him, for who can stretch out his hand against Yahweh’s anointed and remain guiltless?”
translation:
  language: hi
  text: पर दाऊद ने अबीशै से कहा, “उसे नष्ट मत कर; क्योंकि कौन यहोवा के अभिषिक्त[a] के विरुद्ध हाथ बढ़ाकर निर्दोष रह सकता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “अभिषिक्त” उसी शब्द-परिवार का शब्द है जिससे बाद में “मसीह” शब्द जुड़ा है। यहाँ यह शाऊल के लिए है, जिसका यहोवा ने राजा के रूप में अभिषेक किया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: पर दाऊद ने ... कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, पर प्रसंग में दाऊद अबीशै के घातक प्रस्ताव का विरोध कर रहा है; इसलिए ‘पर’ विरोधसूचक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אַל תַּשְׁחִיתֵהוּ
  choice: उसे नष्ट मत कर
  rationale: שׁחת के हिफ़ील रूप का अर्थ नष्ट करना या बरबाद करना हो सकता है। यहाँ आशय प्राण लेने से है, फिर भी ‘नष्ट मत कर’ मूल क्रिया की व्यापकता बनाए रखता है।
- source_word: שָׁלַח יָדוֹ
  choice: हाथ बढ़ाकर
  rationale: यह इब्रानी मुहावरा किसी के विरुद्ध, प्रायः हिंसक, कार्रवाई करने को दर्शाता है। ‘हाथ बढ़ाना’ मूल बिंब को हिन्दी में सुरक्षित रखता है।
- source_word: בִּמְשִׁיחַ יְהוָה
  choice: यहोवा के अभिषिक्त के विरुद्ध
  rationale: מָשִׁיחַ का अर्थ ‘अभिषिक्त जन’ है और इस ऐतिहासिक प्रसंग में यह यहोवा द्वारा अभिषिक्त राजा शाऊल को सूचित करता है। בְּ को इस मुहावरे में ‘के विरुद्ध’ कहना उचित है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय नाम के लिए हिन्दी में प्रचलित और स्पष्ट लिप्यंतरण ‘यहोवा’ चुना गया है।
- source_word: וְנִקָּה
  choice: निर्दोष रह सकता है
  rationale: נקה यहाँ दोष या दायित्व से मुक्त होने का भाव देता है। प्रश्न की आलंकारिक शक्ति को स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘निर्दोष रह सकता है’ उपयुक्त है।
theological_decisions:
- issue: शाऊल के लिए מְשִׁיחַ का अनुवाद
  choice: अभिषिक्त
  alternative: मसीह
  rationale: यहाँ शब्द शाऊल को यहोवा द्वारा अभिषिक्त राजा के रूप में बताता है। ‘मसीह’ कहने से इस प्रसंग में अनपेक्षित विशिष्ट मसीहाई दावा सुनाई दे सकता है; ‘अभिषिक्त’ ऐतिहासिक अर्थ बचाता है, जबकि शब्द-संबंध पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। मूल के आलंकारिक प्रश्न और ‘हाथ बढ़ाने’ के इब्रानी बिंब को बनाए रखा गया है।
