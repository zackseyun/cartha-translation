base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/007.yaml
  text: So David and Abishai came to the troops by night[a], and behold, Saul was lying asleep within the encampment, with his spear stuck in the ground at his head, and Abner and the troops were lying around him.
translation:
  language: hi
  text: तब दाऊद और अबीशै रात को सैनिकों के पास पहुँचे। और देखो, शाऊल छावनी के घेरे[a] के भीतर लेटा सो रहा था। उसका भाला उसके सिरहाने भूमि में गड़ा हुआ था, और अब्नेर तथा सैनिक उसके चारों ओर लेटे हुए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घेरे में”—इब्रानी शब्द संभवतः छावनी की गोलाकार व्यवस्था को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָעָם
  choice: सैनिकों
  rationale: इस सैन्य प्रसंग में यह शब्द सामान्य जनता नहीं, बल्कि शाऊल के साथ उपस्थित सैन्य दल को दर्शाता है।
- source_word: לַיְלָה
  choice: रात को
  rationale: समय सूचित करने वाले इस प्रयोग का आधुनिक और स्वाभाविक हिन्दी रूप।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: इब्रानी कथन में दृश्य को अचानक और सजीव ढंग से सामने लाने वाली अभिव्यक्ति को बनाए रखता है।
- source_word: שֹׁכֵב יָשֵׁן
  choice: लेटा सो रहा था
  rationale: मूल के अनुसार शाऊल की मुद्रा और निद्रा, दोनों को व्यक्त करता है।
- source_word: בַּמַּעְגָּל
  choice: छावनी के घेरे के भीतर
  rationale: यहाँ शब्द संभवतः गोलाकार सैन्य पड़ाव या उसके सुरक्षित घेरे को सूचित करता है; अनुवाद स्थान और विन्यास दोनों को सहज रूप से व्यक्त करता है।
- source_word: חֲנִיתוֹ
  choice: उसका भाला
  rationale: शाऊल की कथाओं में उल्लिखित हथियार के लिए प्रचलित और स्पष्ट हिन्दी शब्द।
- source_word: מְעוּכָה בָאָרֶץ
  choice: भूमि में गड़ा हुआ था
  rationale: भाले के दबाकर या धँसाकर भूमि में स्थिर किए जाने की अवस्था को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מראשתו
  choice: उसके सिरहाने
  rationale: यह इब्रानी मुहावरा सिर की ओर स्थित स्थान को दर्शाता है; ‘सिरहाने’ इसका सहज हिन्दी रूप है।
- source_word: סביבתו
  choice: उसके चारों ओर
  rationale: अब्नेर और सैनिकों की शाऊल को घेरे हुए स्थानिक व्यवस्था को स्पष्ट करता है।
