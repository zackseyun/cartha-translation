base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/026/003.yaml
  text: And Saul camped on the hill of Hachilah[a], which is opposite Jeshimon, by the road. But David was staying in the wilderness, and he saw that Saul had come after him into the wilderness.
translation:
  language: hi
  text: शाऊल ने सड़क के पास हकीला की पहाड़ी पर डेरा डाला, जो यशीमोन[a] के सामने है। पर दाऊद निर्जन प्रदेश में ठहरा हुआ था, और उसने देखा कि शाऊल उसके पीछे निर्जन प्रदेश में आ पहुँचा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “यशीमोन” को सामान्य अर्थ में “उजाड़ प्रदेश” या “मरुस्थल” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַן
  choice: डेरा डाला
  rationale: सैनिक और यात्रा-संदर्भ में חנה का अर्थ पड़ाव डालना है; ‘डेरा डाला’ स्वाभाविक और ठोस हिन्दी अभिव्यक्ति है।
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: हकीला की पहाड़ी पर
  rationale: גִּבְעָה सामान्य संज्ञा ‘पहाड़ी’ है और חֲכִילָה स्थान-नाम है; यह रूप भू-आकृति और नाम दोनों को स्पष्ट रखता है।
- source_word: אֲשֶׁר עַל פְּנֵי הַיְשִׁימֹן
  choice: जो यशीमोन के सामने है
  rationale: עַל־פְּנֵי यहाँ आमने-सामने अथवा सामने स्थित होने का बोध देता है। הַיְשִׁימֹן को भौगोलिक नाम मानकर लिप्यंतरित किया गया है, जबकि उसका सामान्य अर्थ पादटिप्पणी में रखा गया है।
- source_word: עַל הַדָּרֶךְ
  choice: सड़क के पास
  rationale: स्थान-वर्णन में עַל निकटता बता सकता है; ‘के पास’ से सड़क के ठीक ऊपर डेरा होने का अनावश्यक अर्थ नहीं निकलता।
- source_word: יֹשֵׁב
  choice: ठहरा हुआ था
  rationale: ישב बैठने, रहने या ठहरे रहने का अर्थ दे सकता है। यहाँ कृदंत की जारी अवस्था को ‘ठहरा हुआ था’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि अनाबादी वन्य भूभाग भी हो सकता है; ‘निर्जन प्रदेश’ इस व्यापक अर्थ को रखता है।
- source_word: וַיַּרְא כִּי בָא שָׁאוּל אַחֲרָיו
  choice: और उसने देखा कि शाऊल उसके पीछे ... आ गया है
  rationale: यह दाऊद के जान लेने को व्यक्त करता है कि शाऊल उसके पीछे आया था। ‘पीछे ... आ गया’ गति और पीछा करने के संकेत को रखता है, पर उसे अधिक तकनीकी सैन्य शब्द नहीं बनाता।
- source_word: הַמִּדְבָּרָה
  choice: निर्जन प्रदेश में
  rationale: अंत का दिशासूचक ה गति को उस प्रदेश की ओर या उसके भीतर बताता है। हिन्दी में ‘आ गया है’ के साथ ‘में’ उस प्रवेश-भाव को स्वाभाविक ढंग से व्यक्त करता है।
