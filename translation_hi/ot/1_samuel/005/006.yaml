base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/006.yaml
  text: And the hand of Yahweh was heavy against the people of Ashdod[a], and he devastated them and struck them with tumors, Ashdod and its territory.
translation:
  language: hi
  text: और यहोवा का हाथ अशदोद के निवासियों पर भारी पड़ा। उसने उन्हें तबाह किया और सूजनों से पीड़ित किया—अशदोद और उसके क्षेत्र को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתִּכְבַּד יַד יְהוָה
  choice: यहोवा का हाथ ... भारी पड़ा
  rationale: इब्रानी के ठोस रूपक को बनाए रखते हुए परमेश्वर की प्रबल दंडात्मक कार्रवाई व्यक्त होती है; यह हिंदी में भी स्वाभाविक मुहावरा है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: אֶל הָאַשְׁדּוֹדִים
  choice: अशदोद के निवासियों पर
  rationale: यह रूप नगर मात्र नहीं, अशदोद के लोगों को सूचित करता है; प्रसंग में אֶל विरोधी दिशा व्यक्त करता है।
- source_word: וַיְשִׁמֵּם
  choice: उसने उन्हें उजाड़ दिया
  rationale: क्रिया विनाश और तबाही की दशा में पहुँचा देने का भाव रखती है; 'उजाड़ दिया' सशक्त और सहज हिंदी है।
- source_word: וַיַּךְ אֹתָם
  choice: लोगों को ... से मारा
  rationale: सामान्य दंडात्मक क्रिया का सीधा और आधुनिक हिंदी रूप, जिससे रोग द्वारा प्रहार का भाव बना रहता है।
- source_word: בַּעֳפָלִים
  choice: गाँठों
  rationale: शारीरिक सूजन या गाँठों के व्यापक अर्थ को मुख्य पाठ में रखा गया है; अधिक विशिष्ट पारंपरिक व्याख्या को पादटिप्पणी में दिया गया है।
- source_word: אֶת אַשְׁדּוֹד וְאֶת גְּבוּלֶיהָ
  choice: अशदोद तथा उसके पूरे इलाके के लोगों को
  rationale: यह पदबंध प्रकोप का विस्तार नगर और उसके अधीन क्षेत्र तक बताता है। हिंदी में स्पष्टता के लिए निहित मानव कर्म को 'लोगों' से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है; उसे केवल उपाधि में बदलने के बजाय हिंदी पाठकों के बीच स्थापित रूप 'यहोवा' रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। इब्रानी का 'हाथ भारी पड़ा' रूपक सुरक्षित है। अंतिम पदबंध को सहज हिंदी में इस तरह खोला गया है कि दंड का विस्तार अशदोद नगर और उसके समूचे इलाके के लोगों तक स्पष्ट हो।
