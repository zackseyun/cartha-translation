base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/002.yaml
  text: So the Philistines took the ark of God and brought it into the house of Dagon[a], and set it beside Dagon.
translation:
  language: hi
  text: तब पलिश्तियों ने परमेश्वर का सन्दूक लिया और उसे दागोन के घर[a] में ले आए और दागोन के पास रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दागोन का मन्दिर।” शाब्दिक रूप से, “दागोन का घर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְחוּ
  choice: लिया
  rationale: यहाँ לָקַח कथा-क्रम में सामान्य रूप से ‘लेना’ दर्शाता है; ‘छीन लिया’ जैसे शब्द मूल से अधिक बल जोड़ते।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस प्राचीन जाति के नाम का प्रचलित हिन्दी रूप।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: אֲרוֹן के लिए पवित्र सन्दूक के अर्थ में स्थापित हिन्दी पद रखा गया है। הָאֱלֹהִים का अनुवाद ‘परमेश्वर’ किया गया है; इस पद में YHWH नाम नहीं है।
- source_word: וַיָּבִיאוּ אֹתוֹ
  choice: उसे … ले आए
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘लाना’ है। सर्वनाम सन्दूक की ओर संकेत करता है।
- source_word: בֵּית דָּגוֹן
  choice: दागोन के भवन
  rationale: בַּיִת का मूल अर्थ ‘घर/भवन’ है और यहाँ देवता के उपासना-स्थल को दर्शाता है। ‘भवन’ मूल रूपक बनाए रखता है; प्रसंगगत अर्थ ‘मन्दिर’ पादटिप्पणी में दिया गया है।
- source_word: וַיַּצִּיגוּ אֹתוֹ
  choice: रख दिया
  rationale: हिफ़ील में יָצַג का अर्थ किसी वस्तु को नियत स्थान पर रखना या स्थापित करना है; सहज हिन्दी में ‘रख दिया’ उपयुक्त है।
- source_word: אֵצֶל דָּגוֹן
  choice: दागोन के पास
  rationale: אֵצֶל निकट स्थान, अर्थात ‘पास/बगल में’, बताता है। सम्भवतः आशय दागोन की मूर्ति से है, पर मूल केवल ‘दागोन’ कहता है, इसलिए अनुवाद उसे स्पष्ट करके तनाव समाप्त नहीं करता।
theological_decisions:
- issue: ‘परमेश्वर का सन्दूक’ में ईश्वरीय पदनाम
  choice: परमेश्वर
  alternative: यहोवा
  rationale: इब्रानी पाठ में הָאֱלֹהִים है, יהוה नहीं; इसलिए पदनाम को मूल के अनुसार रखा गया है।
- issue: अन्तिम ‘दागोन’ का सन्दर्भ
  choice: दागोन
  alternative: दागोन की मूर्ति
  rationale: मन्दिर के प्रसंग में मूर्ति सम्भावित है, किन्तु इब्रानी पाठ स्पष्ट रूप से ‘मूर्ति’ नहीं कहता; अतः वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथा-क्रम के लिए आरम्भ में ‘तब’ और आगे ‘और’ का प्रयोग किया गया है। ‘सन्दूक’ पवित्र वाचा-सन्दूक के लिए परिचित हिन्दी शब्द है।
