  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: पलिश्तियों ने
  rationale: वाव यहाँ कथा को आगे बढ़ाने वाला संयोजक है; हिन्दी में अलग से ‘और’ या ‘अब’ लगाए बिना प्रसंग का स्वाभाविक संक्रमण बना रहता है। जाति-नाम का प्रचलित हिन्दी रूप ‘पलिश्ती’ रखा गया है।
- source_word: לָקְחוּ
  choice: ले लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है। पूर्ण क्रिया को सरल भूतकाल में रखना हिन्दी कथा-शैली में स्वाभाविक है और पूर्व प्रसंग से संबंध भी स्पष्ट रहता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: इब्रानी संबंध-वाक्यांश को निकट और प्रचलित हिन्दी रूप में रखा गया है। ‘सन्दूक’ वाचा के पवित्र सन्दूक के लिए स्थापित बाइबलीय शब्द है।
- source_word: וַיְבִאֻהוּ
  choice: और उसे … ले आए
  rationale: בוא के हिफ़ील रूप का अर्थ ‘लाना’ है और पुरुषवाचक एकवचन प्रत्यय सन्दूक की ओर संकेत करता है। गंतव्य की दृष्टि से ‘ले आए’ हिन्दी में स्वाभाविक कथा-वर्णन है।
- source_word: מֵאֶבֶן הָעֵזֶר
  choice: एबेन-एजेर से
  rationale: מִן को ‘से’ और स्थान-नाम אֶבֶן הָעֵזֶר को ध्वन्यात्मक रूप ‘एबेन-एजेर’ में प्रस्तुत किया गया है।
- source_word: אַשְׁדּוֹדָה
  choice: अशदोद
  rationale: स्थान-नाम पर लगा दिशासूचक ה गति की दिशा बताता है; हिन्दी में ‘ले आए’ के साथ गंतव्य बिना अलग ‘को’ के स्वाभाविक रूप से व्यक्त होता है।
