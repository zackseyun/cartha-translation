base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/005.yaml
  text: Therefore, to this day the priests of Dagon and all who enter Dagon's temple in Ashdod do not step on Dagon's threshold[a][b].
translation:
  language: hi
  text: इसी कारण आज तक दागोन के याजक और वे सभी जो अशदोद में दागोन के मन्दिर में प्रवेश करते हैं, दागोन की देहरी पर पैर नहीं रखते।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “दागोन की देहरी को नहीं रौंदते।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “दागोन का घर”; यहाँ मूर्तिपूजा के उपासना-स्थल के अर्थ में “मन्दिर” किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह पिछले प्रसंग के परिणाम को व्यक्त करता है और इब्रानी के कारणसूचक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יִדְרְכוּ
  choice: पैर नहीं रखते
  rationale: דרך का अर्थ ‘पैर रखना/रौंदना’ है; देहरी के प्रसंग में ‘पैर नहीं रखते’ आधुनिक हिन्दी में स्वाभाविक है और प्रचलित रीति को दर्शाता है।
- source_word: כֹהֲנֵי דָגוֹן
  choice: दागोन के याजक
  rationale: संबंधसूचक इब्रानी रचना का सीधा और स्पष्ट अनुवाद।
- source_word: וְכָל הַבָּאִים בֵּית דָּגוֹן
  choice: और वे सभी जो ... दागोन के मन्दिर में प्रवेश करते हैं
  rationale: בוא और בית का यह प्रयोग उपासना-स्थल में प्रवेश को बताता है; प्रसंग के कारण ‘मन्दिर’ साधारण पाठक के लिए ‘भवन’ की अपेक्षा अधिक स्पष्ट है।
- source_word: עַל מִפְתַּן דָּגוֹן
  choice: दागोन की देहरी पर
  rationale: מִפְתָּן के लिए ‘देहरी’ सटीक और प्रचलित हिन्दी शब्द है; संबंधसूचक रूप को स्वाभाविक हिन्दी में रखा गया है।
- source_word: בְּאַשְׁדּוֹד
  choice: अशदोद में
  rationale: स्थानसूचक उपसर्ग का सीधा अनुवाद।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: वर्णनकर्ता के समय तक जारी प्रथा को व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा।
