base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/008.yaml
  text: So they sent and gathered all the lords of the Philistines to themselves[a], and said, “What shall we do with the ark of the God of Israel?” And they said, “Let the ark of the God of Israel be brought around to Gath.” So they brought the ark of the God of Israel around.
translation:
  language: hi
  text: तब उन्होंने संदेश भेजकर पलिश्तियों के सभी सरदारों को अपने पास इकट्ठा किया और पूछा, “हम इस्राएल के परमेश्वर के सन्दूक का क्या करें?” उन्होंने उत्तर दिया, “इस्राएल के परमेश्वर का सन्दूक गात भेज दिया जाए।”[a] इसलिए उन्होंने इस्राएल के परमेश्वर का सन्दूक भिजवा दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएल के परमेश्वर का सन्दूक घूमकर गात जाए।” मूल क्रिया गति या स्थानांतरण पर बल देती है, लेकिन ले जाने का ठीक तरीका नहीं बताती।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: उन्होंने संदेश भेजकर
  rationale: שׁלח का सीधा अर्थ ‘भेजना’ है; यहाँ अगले क्रिया-पद से स्पष्ट है कि सरदारों को बुलाने के लिए संदेश या दूत भेजे गए। हिन्दी में ‘संदेश भेजकर’ आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּאַסְפוּ
  choice: इकट्ठा किया
  rationale: אָסף का सामान्य अर्थ इकट्ठा या एकत्र करना है; यहाँ यह परामर्श के लिए शासकों को एक स्थान पर बुलाने को दर्शाता है।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सभी सरदारों
  rationale: סֶרֶן पलिश्ती नगर-शासकों की विशिष्ट उपाधि है। ‘सरदार’ प्रतिष्ठा और शासकीय भूमिका दोनों को सामान्य हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲלֵיהֶם
  choice: अपने पास
  rationale: यह पद वक्ताओं के स्थान या उपस्थिति में बुलाए जाने को दर्शाता है; ‘अपने पास’ हिन्दी में इसके प्रतिवर्ती भाव का स्वाभाविक रूप है।
- source_word: מַה נַּעֲשֶׂה לַאֲרוֹן
  choice: सन्दूक का क्या करें
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया विचार-विमर्श का भाव रखती है। ל का हिन्दी में स्वाभाविक निर्वाह ‘का क्या करें’ से होता है।
- source_word: אֲרוֹן
  choice: सन्दूक
  rationale: इस प्रसंग में אָרוֹן वाचा के पवित्र सन्दूक को सूचित करता है। ‘सन्दूक’ स्थापित, गरिमापूर्ण और सामान्यतः बोधगम्य हिन्दी पद है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: सम्बन्धवाची इब्रानी पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: גַּת
  choice: गात
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण।
- source_word: יִסֹּב
  choice: गात भेज दिया जाए
  rationale: סבב यहाँ घूमने/दूसरी ओर ले जाने की गति बताता है और कथानक में सन्दूक को दूसरे नगर स्थानांतरित करने का आशय है। ‘भेज दिया जाए’ प्राकृतिक हिन्दी है; गति की व्यापक शाब्दिक सम्भावना पाद-टिप्पणी में सुरक्षित है।
- source_word: וַיַּסֵּבּוּ
  choice: वहाँ भिजवा दिया
  rationale: हिफ़ील रूप कारणवाचक है—उन्होंने सन्दूक को स्थानांतरित कराया। ‘भिजवा दिया’ इस कारणवाचकता और पूर्ववर्ती आदेश के क्रियान्वयन को स्वाभाविक हिन्दी में व्यक्त करता है।
