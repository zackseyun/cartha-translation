lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: और जो पुरुष
  rationale: אֲנָשִׁים का सामान्य अर्थ ‘पुरुष’ है; यहाँ पाठ का लिंग-सूचक रूप बनाए रखा गया है।
- source_word: אֲשֶׁר לֹא מֵתוּ
  choice: नहीं मरे थे
  rationale: यह उन बचे हुए पुरुषों को उन लोगों से अलग करता है जो मर चुके थे; हिंदी में पूर्ण भूतकाल प्रसंगानुकूल है।
- source_word: הֻכּוּ
  choice: पीड़ित किए गए
  rationale: נכה के होफ़ाल निष्क्रिय रूप का अर्थ यहाँ किसी विपत्ति से ग्रस्त या पीड़ित किया जाना है; शाब्दिक ‘मारे गए’ मृत्यु का गलत संकेत दे सकता है।
- source_word: בָעֳפָלִים
  choice: गाँठों
  rationale: यह शब्द शरीर की सूजन या गाँठ को दर्शाता है; ‘गाँठों’ सहज हिंदी है और किसी निश्चित चिकित्सीय निदान को अनावश्यक रूप से नहीं थोपता।
- source_word: וַתַּעַל שַׁוְעַת הָעִיר
  choice: और नगर की दुहाई ... पहुँची
  rationale: שַׁוְעָה संकट में सहायता के लिए उठी पुकार है; ‘दुहाई’ इस भाव को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: הַשָּׁמָיִם
  choice: आकाश तक
  rationale: שָׁמַיִם औपचारिक रूप से बहुवचन है, पर इस मुहावरे में हिंदी का ‘आकाश तक’ स्वाभाविक है और ऊपर उठती पुकार की छवि बनाए रखता है।
