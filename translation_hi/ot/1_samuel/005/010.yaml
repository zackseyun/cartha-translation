source:
  edition: WLC
  text: וַֽ/יְשַׁלְּח֛וּ אֶת אֲר֥וֹן הָ/אֱלֹהִ֖ים עֶקְר֑וֹן וַ/יְהִ֗י כְּ/ב֨וֹא אֲר֤וֹן הָ/אֱלֹהִים֙ עֶקְר֔וֹן וַ/יִּזְעֲק֨וּ הָֽ/עֶקְרֹנִ֜ים לֵ/אמֹ֗ר הֵסַ֤בּוּ אֵלַ/י֙ אֶת אֲרוֹן֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל לַ/הֲמִיתֵ֖/נִי וְ/אֶת עַמִּֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/010.yaml
  text: So they sent the ark of God to Ekron. But when the ark of God came to Ekron, the Ekronites cried out, saying, “They have brought around to me the ark of the God of Israel, to kill me and my people!”
translation:
  language: hi
  text: तब उन्होंने परमेश्वर का संदूक एक्रोन भेज दिया। पर जब परमेश्वर का संदूक एक्रोन पहुँचा, तो एक्रोनवासी चिल्ला उठे, “वे इस्राएल के परमेश्वर का संदूक मेरे पास ले आए हैं, ताकि मुझे और मेरी प्रजा को मार डालें!”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: ‘संदूक’ ארון का स्वाभाविक और सटीक हिंदी रूप है; संबंधवाचक पदबंध मूल के ‘परमेश्वर का संदूक’ को सीधे बनाए रखता है।
- source_word: עֶקְרוֹן / הָעֶקְרֹנִים
  choice: एक्रोन / एक्रोनवासी
  rationale: स्थान-नाम का लिप्यंतरण और उसके निवासियों के लिए प्रचलित, सहज हिंदी प्रत्यय चुना गया है।
- source_word: הֵסַבּוּ אֵלַי
  choice: वे ... मेरे पास ले आए हैं
  rationale: हेफ़ील क्रिया में किसी वस्तु को इधर/चारों ओर से ले आने का भाव है; संदर्भ में ‘मेरे पास ले आए’ स्वाभाविक है और एकवचन אֵלַי को सुरक्षित रखता है।
- source_word: לַהֲמִיתֵנִי וְאֶת־עַמִּי
  choice: ताकि मुझे और मेरी प्रजा को मार डालें
  rationale: उद्देश्यसूचक ל और एकवचन प्रत्यय ‘मुझे’ तथा ‘मेरी प्रजा’ को यथावत रखा गया है; ‘मार डालें’ causative מות का स्पष्ट हिंदी रूप है।
theological_decisions:
- issue: एक्रोनवासियों की सामूहिक पुकार में व्याकरणिक एकवचन
  choice: ‘मेरे पास’, ‘मुझे’, और ‘मेरी प्रजा’
  alternative: ‘हमारे पास’, ‘हमें’, और ‘हमारी प्रजा’
  rationale: इब्रानी पाठ में אֵלַי, הֲמִיתֵנִי और עַמִּי स्पष्ट रूप से प्रथम पुरुष एकवचन हैं। यह संभवतः नगर या उसके प्रतिनिधि की सामूहिक वाणी है; अनुवाद ने इस वास्तविक तनाव को बहुवचन बनाकर समाप्त नहीं किया।
- issue: אֱלֹהֵי יִשְׂרָאֵל की पहचान
  choice: इस्राएल के परमेश्वर
  alternative: इस्राएल के देवता
  rationale: संबंधवाचक इब्रानी पदबंध का सीधा रूप रखा गया है और कथावाचक संदर्भ के अनुरूप ‘परमेश्वर’ चुना गया है, बिना कोई अतिरिक्त सांप्रदायिक व्याख्या जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली। ‘चिल्ला उठे’ וַיִּזְעֲקוּ की तीव्र सामूहिक प्रतिक्रिया को स्वाभाविक रूप से व्यक्त करता है। मूल पाठ के असामान्य सामूहिक-वक्ता एकवचन को जानबूझकर सुरक्षित रखा गया है।
