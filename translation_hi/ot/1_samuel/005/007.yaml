  text: וַ/יִּרְא֥וּ אַנְשֵֽׁי אַשְׁדּ֖וֹד כִּֽי כֵ֑ן וְ/אָמְר֗וּ לֹֽא יֵשֵׁ֞ב אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ עִמָּ֔/נוּ כִּֽי קָשְׁתָ֤ה יָד/וֹ֙ עָלֵ֔י/נוּ וְ/עַ֖ל דָּג֥וֹן אֱלֹהֵֽי/נוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/007.yaml
  text: When the men of Ashdod saw that it was so[a], they said, “The ark of the God of Israel must not remain with us[b], because his hand is heavy against us and against Dagon our god.”
translation:
  language: hi
  text: जब अशदोद के लोगों ने देखा कि बात ऐसी ही है, तो उन्होंने कहा, “इस्राएल के परमेश्वर का सन्दूक हमारे यहाँ नहीं रहना चाहिए[a], क्योंकि उसका हाथ हम पर और हमारे देवता दागोन पर भारी पड़ा है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारे यहाँ नहीं ठहरना चाहिए।” हिब्रू क्रिया का अर्थ “बैठना,” “बसना” या “रहना” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उसका हाथ हम पर और हमारे देवता दागोन पर भारी पड़ा है।” यह हिब्रू मुहावरा कठोर दैवी दबाव या न्याय को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרְאוּ אַנְשֵׁי אַשְׁדּוֹד
  choice: जब अशदोद के लोगों ने देखा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है और यहाँ अगली प्रतिक्रिया की समयगत भूमिका बनाता है। אַנְשֵׁי नगर के निवासियों या प्रतिनिधियों के लिए सामूहिक रूप से प्रयुक्त हो सकता है; इसलिए आधुनिक हिन्दी में स्वाभाविक ‘लोगों’ चुना गया है।
- source_word: כִּי כֵן
  choice: कि ऐसी ही दशा है
  rationale: यह पदबंध पिछले प्रसंग में वर्णित विपत्ति की ओर संकेत करता है। ‘ऐसी ही दशा है’ उस संदर्भसूचक अर्थ को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא יֵשֵׁב ... עִמָּנוּ
  choice: हमारे यहाँ नहीं रहना चाहिए
  rationale: יָשַׁב का अर्थ ‘बैठना, बसना, रहना’ हो सकता है। सन्दूक के स्थान पर बने रहने के संदर्भ में ‘रहना’ उपयुक्त है; ‘नहीं ... चाहिए’ वक्ताओं के निषेधात्मक निर्णय को व्यक्त करता है।
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर का सन्दूक
  rationale: यह निकट, स्पष्ट अनुवाद पद के औपचारिक संबंध और आगे आने वाले ‘हमारे देवता दागोन’ के साथ विरोध को सुरक्षित रखता है।
- source_word: קָשְׁתָה יָדוֹ עָלֵינוּ
  choice: उसका हाथ हम पर ... भारी पड़ा है
  rationale: हिब्रू रूपक को व्याख्यात्मक वाक्य से बदलने के बजाय सुरक्षित रखा गया है। ‘भारी पड़ा है’ आधुनिक हिन्दी में दैवी दबाव और न्याय की तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְעַל דָּגוֹן אֱלֹהֵינוּ
  choice: और हमारे देवता दागोन पर
  rationale: यह पलिश्ती वक्ताओं का अपना कथन ज्यों का त्यों रखता है और बिना अतिरिक्त मूल्यांकन जोड़े लोगों तथा दागोन दोनों पर इस्राएल के परमेश्वर के प्रहार को समानांतर रूप में दिखाता है।
theological_decisions:
- issue: קָשְׁתָה יָדוֹ में दैवी न्याय का रूपक
  choice: उसका हाथ ... भारी पड़ा है
  alternative: उसने हमें कठोर दण्ड दिया है
  rationale: मुख्य पाठ परमेश्वर के ‘हाथ’ का मूल मानवरूपी रूपक बनाए रखता है और उसे केवल उसके व्याख्यात्मक अर्थ में नहीं बदलता। इससे इस्राएल के परमेश्वर की सक्रिय सामर्थ्य और न्याय का कथात्मक तनाव बना रहता है।
- issue: दागोन के लिए ‘हमारे देवता’
  choice: वक्ताओं की दृष्टि से ‘हमारे देवता दागोन’ बनाए रखना
  alternative: हमारी मूर्ति दागोन
  rationale: हिब्रू में पलिश्ती स्वयं दागोन को ‘हमारा देवता’ कहते हैं। अनुवाद उनकी दृष्टि प्रस्तुत करता है, उसे स्वीकार नहीं करता; ‘मूर्ति’ जोड़ना मूल से अधिक स्पष्ट धार्मिक मूल्यांकन होता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘सन्दूक’ पारंपरिक बाइबलीय पद है; ‘हमारे यहाँ’ स्थानगत עִמָּנוּ को स्वाभाविक हिन्दी में व्यक्त करता है। मूल का ‘हाथ भारी पड़ना’ रूपक जानबूझकर सुरक्षित रखा गया है।
