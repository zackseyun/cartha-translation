base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/011.yaml
  text: So they sent and gathered all the lords of the Philistines[a], and they said, “Send away the ark of the God of Israel, and let it return to its place, so that it may not kill us and our people.” For there was a deadly panic throughout the whole city[b]; the hand of God was very heavy there.
translation:
  language: hi
  text: तब उन्होंने पलिश्तियों के सभी सरदारों को बुलाकर इकट्ठा किया और कहा, “इस्राएल के परमेश्वर के सन्दूक को यहाँ से भेज दो, और वह अपने स्थान पर लौट जाए, ताकि वह मुझे और मेरी प्रजा को मार न डाले।” क्योंकि पूरे नगर में मौत का आतंक[a] छा गया था; वहाँ परमेश्वर का हाथ अत्यन्त भारी था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘मृत्यु की भगदड़,’ ‘मौत का कोलाहल’ या ‘घातक खलबली’ भी हो सकता है।
    reason: मूल इब्रानी पद מְהוּמַת מָוֶת आतंक, भ्रम, कोलाहल और मृत्यु—इनसे जुड़ा सघन तथा कुछ अस्पष्ट अर्थ रखता है।
  - marker: b
    text: ‘परमेश्वर का हाथ अत्यन्त भारी था’ दैवी सामर्थ्य से आए कठोर न्याय का रूपक है।
    reason: आधुनिक पाठक के लिए शाब्दिक बाइबलीय रूपक का आशय स्पष्ट करना।
lexical_decisions:
- source_word: סַרְנֵי
  choice: सरदारों
  rationale: यह शब्द पलिश्तियों के मान्य शासकों की विशिष्ट पदवी बताता है; ‘सरदार’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उनके राजनीतिक पद को व्यक्त करता है।
- source_word: שַׁלְּחוּ
  choice: यहाँ से भेज दो
  rationale: आज्ञा का आशय सन्दूक को नगर से हटा देने का है; ‘यहाँ से’ निष्कासन के प्रसंग को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर का सन्दूक
  rationale: यह मूल सम्बन्धवाचक संरचना और इस बात को सुरक्षित रखता है कि सन्दूक इस्राएल के परमेश्वर से सम्बद्ध है।
- source_word: וְיָשֹׁב לִמְקֹמוֹ
  choice: और वह अपने स्थान पर लौट जाए
  rationale: आज्ञा के बाद प्रयुक्त इच्छार्थक भाव को ‘लौट जाए’ ठीक प्रकार व्यक्त करता है।
- source_word: וְלֹא יָמִית אֹתִי וְאֶת עַמִּי
  choice: ताकि वह मुझे और मेरी प्रजा को मार न डाले
  rationale: मूल में एकवचन ‘मुझे’ और ‘मेरी प्रजा’ है, सम्भवतः नगर के प्रतिनिधि शासक की वाणी; इसे बहुवचन बनाकर समतल नहीं किया गया।
- source_word: מְהוּמַת מָוֶת
  choice: मौत का आतंक
  rationale: यह असामान्य और सघन इब्रानी पद मृत्यु, घबराहट और घातक उथल-पुथल का भाव रखता है; ‘मौत का आतंक’ उसकी तीव्रता और कुछ अस्पष्टता बनाए रखता है।
- source_word: בְּכָל הָעִיר
  choice: पूरे नगर में
  rationale: यह मूल के व्यापक, समस्त नगर को घेरने वाले भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: כָּבְדָה מְאֹד יַד הָאֱלֹהִים
  choice: परमेश्वर का हाथ अत्यन्त भारी था
  rationale: ‘हाथ’ के बाइबलीय रूपक को बनाए रखते हुए כָּבְדָה מְאֹד की तीव्रता को ‘अत्यन्त भारी’ से व्यक्त किया गया है।
theological_decisions:
- issue: ‘परमेश्वर का हाथ’ रूपक को बनाए रखना या उसका अर्थ खोलकर दैवी दण्ड कहना
  choice: वहाँ परमेश्वर का हाथ अत्यन्त भारी था
  alternative: वहाँ परमेश्वर ने उन्हें बहुत कठोर दण्ड दिया
  rationale: मूल पाठ स्पष्टतः ‘हाथ’ का रूपक प्रयोग करता है। इसे सुरक्षित रखने से दैवी सक्रियता और न्याय का बाइबलीय भाषिक ताना-बाना बना रहता है।
- issue: बहुवचन वक्ताओं के बीच एकवचन ‘मुझे और मेरी प्रजा’
  choice: मुझे और मेरी प्रजा
  alternative: हमें और हमारी प्रजा
  rationale: इब्रानी प्रत्यय एकवचन हैं और सम्भवतः नगर के प्रतिनिधि की वाणी दर्शाते हैं। सन्दर्भानुसार बहुवचन करना मूल की उल्लेखनीय विशेषता मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सुबोध रखी गई है। ‘सन्दूक,’ ‘प्रजा’ और ‘परमेश्वर का हाथ’ जैसे बाइबलीय पद प्रसंग तथा अन्तरपाठीय सम्बन्ध बनाए रखते हैं। मुख्य पाठ में सभी पादटिप्पणी-चिह्न उपस्थित हैं।
