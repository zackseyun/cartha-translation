  text: וַ/יַּשְׁכִּ֤מוּ אַשְׁדּוֹדִים֙ מִֽ/מָּחֳרָ֔ת וְ/הִנֵּ֣ה דָג֗וֹן נֹפֵ֤ל לְ/פָנָי/ו֙ אַ֔רְצָ/ה לִ/פְנֵ֖י אֲר֣וֹן יְהוָ֑ה וַ/יִּקְחוּ֙ אֶת דָּג֔וֹן וַ/יָּשִׁ֥בוּ אֹת֖/וֹ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/003.yaml
  text: When the Ashdodites rose early the next day, behold, Dagon had fallen facedown on the ground before the ark of Yahweh. So they took Dagon and put him back in his place.
translation:
  language: hi
  text: अगले दिन अशदोद के लोग तड़के उठे, और देखो, दागोन याहवे के सन्दूक के सामने भूमि पर मुँह के बल गिरा पड़ा था। तब उन्होंने दागोन को लेकर उसे फिर उसके स्थान पर रख दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: तड़के उठे
  rationale: हिफ़िल रूप का अर्थ प्रातः जल्दी उठना है; यह स्वाभाविक हिन्दी में समय के बल को बनाए रखता है।
- source_word: אַשְׁדּוֹדִים
  choice: अशदोद के लोग
  rationale: यह जातिवाचक बहुवचन अशदोद के निवासियों को दर्शाता है; हिन्दी में यह रूप स्पष्ट और सहज है।
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह अभिव्यक्ति इसके बाद वाले दिन को बताती है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: הִנֵּה अचानक दिखाई पड़ी चौंकाने वाली बात की ओर ध्यान खींचता है; 'और देखो' उसके कथात्मक प्रभाव को सुरक्षित रखता है।
- source_word: נֹפֵל
  choice: गिरा पड़ा था
  rationale: कर्ता रूप यहाँ पहले घट चुकी क्रिया से उत्पन्न, देखी गई अवस्था बताता है; हिन्दी में 'गिरा पड़ा था' उस स्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְפָנָיו אַרְצָה
  choice: भूमि पर मुँह के बल
  rationale: यह पदबंध धरती की ओर मुँह किए औंधी दशा का चित्र देता है और दागोन के अपमानजनक पतन को स्पष्ट रखता है।
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: यहोवा के सन्दूक के सामने
  rationale: לִפְנֵי यहाँ स्थान-संबंधी है; 'के सामने' आधुनिक हिन्दी में स्पष्ट है। אֲרוֹן को प्रसंगानुसार पवित्र सन्दूक के रूप में प्रस्तुत किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण 'यहोवा' से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיִּקְחוּ אֶת־דָּגוֹן
  choice: उन्होंने दागोन को उठाकर
  rationale: לקח का मूल अर्थ 'लेना' है, पर गिरी हुई मूर्ति को पुनः रखने के प्रसंग में हिन्दी का 'उठाकर' निहित शारीरिक क्रिया को सहज और स्पष्ट करता है।
- source_word: וַיָּשִׁבוּ אֹתוֹ לִמְקוֹמוֹ
  choice: फिर उसके स्थान पर रख दिया
  rationale: शׁוב का हिफ़िल रूप वापस पहुँचाने या पूर्व स्थिति में रखने को बताता है; यह हिन्दी वाक्यांश उसी पुनर्स्थापन को स्वाभाविक रूप में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। हिन्दी पाठकों के लिए सुपरिचित लिप्यंतरण 'यहोवा' नाम को नाम ही बनाए रखता है; 'याहवे' अधिक समीपी वैकल्पिक विद्वत्तापूर्ण लिप्यंतरण है।
- issue: दागोन के पतन की मुद्रा
  choice: भूमि पर मुँह के बल
  alternative: भूमि की ओर अपने मुँह पर
  rationale: मूल की ठोस शारीरिक छवि और यहोवा के सन्दूक के सामने दागोन की दीन मुद्रा सुरक्षित रखी गई है, बिना इसे स्पष्ट रूप से 'दण्डवत्' कहकर इच्छित उपासना के रूप में व्याख्यायित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण पर सामान्य पाठक के लिए सहज है। 'सन्दूक' बाइबलीय धार्मिक संदर्भ को बनाए रखता है। दागोन के लिए व्याकरणिक एकवचन सर्वनाम रखा गया है, पर पाठ यह तय नहीं करता कि संकेत देवता की ओर है या उसकी मूर्ति की ओर।
