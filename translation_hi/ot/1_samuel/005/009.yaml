id: 1SA.5.9
reference: 1 Samuel 5:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יְהִ֞י אַחֲרֵ֣י הֵסַ֣בּוּ אֹת֗/וֹ וַ/תְּהִ֨י יַד יְהוָ֤ה בָּ/עִיר֙ מְהוּמָה֙ גְּדוֹלָ֣ה מְאֹ֔ד וַ/יַּךְ֙ אֶת אַנְשֵׁ֣י הָ/עִ֔יר מִ/קָּטֹ֖ן וְ/עַד גָּד֑וֹל וַ/יִּשָּׂתְר֥וּ לָ/הֶ֖ם עפלים׀־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/009.yaml
  text: And after they had moved it around[a], the hand of Yahweh was against the city, causing a very great panic; and he struck the men of the city, from small to great, and tumors broke out on them.
translation:
  language: hi
  text: जब वे उसे दूसरी जगह ले गए, तब याहवे का हाथ उस नगर पर पड़ा और वहाँ अत्यन्त बड़ी घबराहट मच गई। उसने नगर के पुरुषों को छोटे से बड़े तक मारा, और उनके शरीर पर सूजी हुई गाँठें निकल आईं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन पर सूजनें फूट निकलीं।” इब्रानी अभिव्यक्ति शरीर पर सूजी हुई गाँठों के उभरने या फूट निकलने का वर्णन करती है।
    reason: दुर्लभ इब्रानी अभिव्यक्ति की शाब्दिक छवि और सम्भव वैकल्पिक अनुवाद बताने के लिए।
lexical_decisions:
- source_word: הֵסַבּוּ אֹתוֹ
  choice: वे उसे दूसरी जगह ले गए
  rationale: हिफ़ील रूप यहाँ सन्दूक को स्थानांतरित करने का भाव देता है। यह अनुवाद दिशा या ठीक स्थान जोड़े बिना उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יַד יְהוָה
  choice: याहवे का हाथ ... पर पड़ा
  rationale: यह ईश्वरीय सामर्थ्य और दण्ड का इब्रानी रूपक है। हिन्दी मुहावरा ‘हाथ ... पर पड़ा’ रूपक और न्याय की तीव्रता दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम है; इसलिए इसे उपाधि से नहीं बदला गया।
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: अत्यन्त बड़ी घबराहट
  rationale: מְהוּמָה दहशत, खलबली या घबराहट बता सकता है। यहाँ दैवी प्रहार के प्रसंग में ‘घबराहट’ स्पष्ट और स्वाभाविक है।
- source_word: וַיַּךְ
  choice: उसने ... मारा
  rationale: एकवचन क्रिया का कर्ता याहवे है। ‘मारा’ मूल क्रिया की ठोस शक्ति बनाए रखता है, बिना मृत्यु को अनिवार्य अर्थ बनाए।
- source_word: אַנְשֵׁי הָעִיר
  choice: नगर के पुरुषों
  rationale: इब्रानी में सामान्य ‘लोग’ नहीं बल्कि पुरुषवाचक संज्ञा है, इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से बड़े तक
  rationale: मूल मुहावरे के समान यह आयु, पद या सामाजिक महत्त्व में से किसी एक अर्थ को निश्चित नहीं करता।
- source_word: וַיִּשָּׂתְרוּ לָהֶם עפלים
  choice: उनके शरीर पर सूजी हुई गाँठें निकल आईं
  rationale: दुर्लभ क्रिया और संज्ञा शरीर पर उभरने या फूट निकलने वाली सूजनों को दर्शाती हैं। ‘सूजी हुई गाँठें’ आधुनिक हिन्दी में स्पष्ट है और किसी निश्चित चिकित्सीय निदान को आरोपित नहीं करता।
theological_decisions:
- issue: יהוה के दिव्य नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: पद में चतुरक्षरीय वाचा-नाम सीधे आया है। ‘याहवे’ उसे व्यक्तिगत नाम के रूप में सुरक्षित रखता है और उसे केवल उपाधि में नहीं बदलता।
- issue: दैवी प्रहार का कर्ता
  choice: ‘उसने’ का संकेत याहवे की ओर रखा गया
  alternative: 'निष्क्रिय रूप: ‘पुरुष मारे गए’'
  rationale: मूल की एकवचन क्रिया पिछले कर्ता याहवे को दण्ड का सक्रिय कर्ता बताती है; निष्क्रिय अनुवाद इस धर्मवैचारिक बल को कम कर देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथ ... पर पड़ा’ स्वाभाविक हिन्दी होते हुए मूल इब्रानी रूपक को सुरक्षित रखता है। ‘छोटे से बड़े तक’ जानबूझकर अस्पष्ट रखा गया है, क्योंकि मूल आयु और सामाजिक पद में भेद निश्चित नहीं करता। पादटिप्पणी का चिह्न उसी वाक्यांश पर रखा गया है जिससे वह वास्तव में सम्बन्धित है।
