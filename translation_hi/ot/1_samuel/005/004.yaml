base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/005/004.yaml
  text: When they rose early the next morning[a], behold, Dagon had fallen facedown on the ground before the ark of Yahweh, and the head of Dagon and both the palms of his hands were cut off on the threshold; only Dagon was left on him.
translation:
  language: hi
  text: अगले दिन जब वे तड़के उठे, तो देखा कि दागोन याहवे के सन्दूक के सामने भूमि पर मुँह के बल गिरा पड़ा था। दागोन का सिर और उसके दोनों हाथों की हथेलियाँ कटकर देहरी पर पड़ी थीं; केवल दागोन ही शेष रह गया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “केवल दागोन ही उस पर रह गया था।” यह वाक्यांश कठिन है; सम्भवतः आशय यह है कि सिर और हथेलियाँ कट जाने के बाद मूर्ति का केवल धड़ बचा था।
    reason: मूल इब्रानी का अंतिम वाक्यांश कठिन और अस्पष्ट है। पाद-टिप्पणी शाब्दिक रूप और सम्भावित अर्थ देती है, पर मुख्य पाठ में ‘धड़’ जोड़कर अर्थ को निश्चित नहीं करती।
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר מִמָּחֳרָת
  choice: अगले दिन जब वे तड़के उठे
  rationale: क्रिया के ‘सवेरे जल्दी उठने’ के अर्थ और अगले दिन के काल-संकेत को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: दृश्य के अचानक सामने आने और उससे उत्पन्न आश्चर्य को स्वाभाविक हिन्दी कथन में बनाए रखता है।
- source_word: נֹפֵל לְפָנָיו אַרְצָה
  choice: भूमि पर मुँह के बल गिरा पड़ा था
  rationale: सामने मिली हुई अवस्था, भूमि पर पड़े होने और मुँह के बल होने—तीनों भावों को व्यक्त करता है।
- source_word: לִפְנֵי אֲרוֹן יְהוָה
  choice: यहोवा के सन्दूक के सामने
  rationale: स्थान-संबंध को स्पष्ट रखता है और परमेश्वर के विशिष्ट नाम को लिप्यंतरित रूप में प्रस्तुत करता है।
- source_word: וּשְׁתֵּי כַּפּוֹת יָדָיו
  choice: उसके दोनों हाथों की हथेलियाँ
  rationale: כַּפּוֹת की शारीरिक विशिष्टता और द्विवचन दोनों सुरक्षित रहते हैं।
- source_word: כְּרֻתוֹת אֶל הַמִּפְתָּן
  choice: कटकर देहरी पर पड़ी थीं
  rationale: कटे होने की परिणामी अवस्था और देहरी पर उनकी स्थिति को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רַק דָּגוֹן נִשְׁאַר עָלָיו
  choice: केवल दागोन ही उस पर बचा रह गया था
  rationale: कठिन और संभवतः मुहावरेदार इब्रानी को जानबूझकर निकटता से रखता है; ‘धड़’ जोड़कर अर्थ को मुख्य पाठ में निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को किसी उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले लिप्यंतरण से प्रस्तुत किया गया है।
- issue: अंतिम वाक्यांश में दागोन के बचे हुए भाग की पहचान
  choice: केवल दागोन ही उस पर बचा रह गया था
  alternative: केवल दागोन का धड़ बचा रह गया था
  rationale: सिर और हथेलियाँ कट जाने के प्रसंग में ‘धड़’ संभावित आशय है, पर मूल में धड़ के लिए स्पष्ट संज्ञा नहीं है; इसलिए अस्पष्टता मुख्य पाठ में सुरक्षित रखी गई है और व्याख्या पाद-टिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रूप अपनाया गया है। ‘सन्दूक’, ‘देहरी’ और ‘मुँह के बल गिरा पड़ा’ सामान्य पाठकों के लिए बोधगम्य हैं। कठिन अंतिम उपवाक्य की वास्तविक अस्पष्टता सुरक्षित रखी गई है।
