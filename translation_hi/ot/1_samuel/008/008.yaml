source:
  edition: WLC
  text: כְּ/כָֽל הַ/מַּעֲשִׂ֣ים אֲשֶׁר עָשׂ֗וּ מִ/יּוֹם֩ הַעֲלֹתִ֨/י אֹתָ֤/ם מִ/מִּצְרַ֨יִם֙ וְ/עַד הַ/יּ֣וֹם הַ/זֶּ֔ה וַ/יַּ֣עַזְבֻ֔/נִי וַ/יַּעַבְד֖וּ אֱלֹהִ֣ים אֲחֵרִ֑ים כֵּ֛ן הֵ֥מָּה עֹשִׂ֖ים גַּם לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/008.yaml
  text: According to all the deeds that they have done from the day I brought them up out of Egypt to this day[a], forsaking me and serving other gods[b], so they are also doing to you.
translation:
  language: hi
  text: जिस दिन से मैं उन्हें मिस्र से निकाल लाया, उस दिन से आज तक वे जो कुछ करते आए हैं—मुझे छोड़ते और दूसरे देवताओं की सेवा करते हुए—उसी तरह वे तुम्हारे साथ भी कर रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּכָל הַמַּעֲשִׂים אֲשֶׁר עָשׂוּ
  choice: जैसे-जैसे काम किए हैं
  rationale: כְּכָל यहाँ इस्राएल के पुराने आचरण और शमूएल के प्रति वर्तमान आचरण की तुलना आरम्भ करता है। यह हिंदी प्रयोग तुलना और पूरे ऐतिहासिक व्यवहार, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִיּוֹם הַעֲלֹתִי אֹתָם מִמִּצְרַיִם
  choice: जिस दिन से मैं उन्हें मिस्र से निकाल लाया
  rationale: हिफ़ील הַעֲלֹתִי निर्गमन के प्रसंग में उन्हें मिस्र से बाहर ले आने को दर्शाता है; ‘निकाल लाया’ स्वाभाविक हिंदी में स्रोत का आशय रखता है।
- source_word: וְעַד הַיּוֹם הַזֶּה
  choice: उस दिन से लेकर आज तक
  rationale: आरम्भ से वर्तमान दिन तक फैली समयावधि को स्पष्ट और मुहावरेदार हिंदी में व्यक्त करता है।
- source_word: וַיַּעַזְבֻנִי
  choice: मुझे छोड़कर
  rationale: क्रिया में त्याग और निष्ठा छोड़ने का भाव है; ‘मुझे छोड़कर’ बिना अतिरिक्त व्याख्या के इसे व्यक्त करता है।
- source_word: וַיַּעַבְדוּ אֱלֹהִים אֲחֵרִים
  choice: दूसरे देवताओं की सेवा की है
  rationale: עבד का मूल अर्थ ‘सेवा करना’ है और देवताओं के संदर्भ में उपासना तथा धार्मिक निष्ठा भी समाहित है; मुख्य पाठ मूल शब्द के निकट रहता है।
- source_word: כֵּן הֵמָּה עֹשִׂים גַּם לָךְ
  choice: वैसा ही वे तुम्हारे साथ भी कर रहे हैं
  rationale: כֵּן तुलना का उत्तरपक्ष है और גַּם को ‘भी’ से रखा गया है। ‘कर रहे हैं’ वर्तमान जारी व्यवहार को व्यक्त करता है, जबकि उसकी सटीक प्रकृति को मूल की तरह खुला छोड़ता है।
theological_decisions:
- issue: यहोवा को छोड़ने और शमूएल के प्रति लोगों के व्यवहार के बीच संबंध
  choice: लोगों के पुराने कामों और शमूएल के साथ उनके वर्तमान व्यवहार के बीच तुलना रखी गई है।
  alternative: ‘जैसे उन्होंने मेरे विरुद्ध विद्रोह किया, वैसे ही तुम्हारे विरुद्ध भी कर रहे हैं।’
  rationale: मूल पाठ निरंतर विश्वासघात की तुलना करता है, पर शमूएल के संदर्भ में ‘विद्रोह’ शब्द स्पष्ट रूप से नहीं जोड़ता। अनुवाद इस धार्मिक तनाव और मूल की खुली अभिव्यक्ति को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। तुलना को स्वाभाविक बनाने के लिए ‘जैसे-जैसे…वैसा ही’ संरचना और व्याख्यात्मक खंड के लिए दीर्घ विराम-चिह्न प्रयुक्त हैं।
