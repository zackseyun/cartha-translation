revisions:
- from: उन्होंने जिस दिन से मैं उन्हें मिस्र से निकाल लाया, उस दिन से लेकर आज तक जैसे-जैसे काम किए हैं—मुझे छोड़कर दूसरे देवताओं की सेवा की है[a]—वैसा ही वे तुम्हारे साथ भी कर रहे हैं।
  to: जिस दिन से मैं उन्हें मिस्र से निकाल लाया, उस दिन से आज तक वे जो कुछ करते आए हैं—मुझे छोड़ते और दूसरे देवताओं की सेवा करते हुए—उसी तरह वे तुम्हारे साथ भी कर रहे हैं।
  rationale: Recast the sentence to correct Hindi grammar and to render the Hebrew comparison without the unintended progressive sense of “जैसे-जैसे.” “जो कुछ...उसी तरह” preserves the comprehensive comparison, while “मुझे छोड़ते और दूसरे देवताओं की सेवा करते हुए” retains the two closely related actions as the characterization of Israel's conduct. “तुम्हारे साथ भी कर रहे हैं” preserves the source's open-ended description of their treatment of Samuel.
  reviewer_model: gpt-5.6-terra
  timestamp: '2026-07-15T10:22:04Z'
review_pass:
  verdict: revise
  source_fidelity: The draft correctly identifies the comparison, the Exodus-to-present time span, Israel's forsaking of the LORD, service of other gods, and the deliberately open-ended statement about Samuel. However, its opening clause is syntactically malformed in Hindi, and “जैसे-जैसे” can imply a progressive or step-by-step development not expressed by כְּכָל.
  naturalness: The sequence “उन्होंने जिस दिन से मैं...” is ungrammatical. A recast sentence is needed for clear, modern standard Hindi while retaining the source's comparison and ellipsis.
  terminology: “दूसरे देवताओं” and “सेवा” are suitable. The footnote appropriately notes “उपासना” as a contextual alternative without replacing the more literal main-text wording.
  issues:
  - severity: high
    issue: Opening-clause syntax is invalid
    rationale: “उन्होंने जिस दिन से मैं उन्हें...” improperly combines the subject “उन्होंने” with the first-person verb “मैं...लाया.” The temporal clause must begin “जिस दिन से मैं...” and the people's actions must be introduced separately.
  - severity: medium
    issue: “जैसे-जैसे” introduces an unwarranted progressive nuance
    rationale: The Hebrew כְּכָל introduces the extent/basis of the comparison (“just as/according to all the deeds”), not a step-by-step progression. “जो कुछ...उसी तरह” conveys the comparison more neutrally.
  revised_text: जिस दिन से मैं उन्हें मिस्र से निकाल लाया, उस दिन से आज तक वे जो कुछ करते आए हैं—मुझे छोड़ते और दूसरे देवताओं की सेवा करते हुए—उसी तरह वे तुम्हारे साथ भी कर रहे हैं।
  revised_footnotes:
  - marker: a
    text: “दूसरे देवताओं की सेवा” का अनुवाद “दूसरे देवताओं की उपासना” भी हो सकता है; इब्रानी क्रिया का शाब्दिक अर्थ “सेवा करना” है।
    reason: lexical_alternative
  revision_rationale: Recast the sentence to correct Hindi grammar and to render the Hebrew comparison without the unintended progressive sense of “जैसे-जैसे.” “जो कुछ...उसी तरह” preserves the comprehensive comparison, while “मुझे छोड़ते और दूसरे देवताओं की सेवा करते हुए” retains the two closely related actions as the characterization of Israel's conduct. “तुम्हारे साथ भी कर रहे हैं” preserves the source's open-ended description of their treatment of Samuel.
