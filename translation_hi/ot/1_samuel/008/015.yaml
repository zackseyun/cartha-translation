  text: וְ/זַרְעֵי/כֶ֥ם וְ/כַרְמֵי/כֶ֖ם יַעְשֹׂ֑ר וְ/נָתַ֥ן לְ/סָרִיסָ֖י/ו וְ/לַ/עֲבָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/015.yaml
  text: He will take a tenth of your seed and your vineyards and give it to his officials and his servants[a].
translation:
  language: hi
  text: वह तुम्हारे बीज और तुम्हारी दाख की बारियों का दसवाँ भाग लेगा और उसे अपने अधिकारियों[a] और सेवकों को देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नपुंसकों”; इब्रानी शब्द סָרִיסָיו का अर्थ नपुंसक अथवा अधिक व्यापक रूप से राजदरबार के अधिकारी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זַרְעֵיכֶם
  choice: तुम्हारे बीज
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है और यहाँ यह बोई गई उपज को भी सूचित कर सकता है। ‘बीज’ इब्रानी की ठोस अभिव्यक्ति को बनाए रखता है और कृषि-संदर्भ में स्वाभाविक रूप से समझ आता है।
- source_word: כַרְמֵיכֶם
  choice: तुम्हारी दाख की बारियाँ
  rationale: כֶּרֶם का सामान्य अर्थ दाख की बारी है। दसवाँ भाग लेने की बात से उसकी उपज का आशय संदर्भ में स्पष्ट रहता है।
- source_word: יַעְשֹׂר
  choice: दसवाँ भाग लेगा
  rationale: हिफ़ील रूप यहाँ किसी से दसवाँ भाग वसूल करने या लेने को व्यक्त करता है। यह अनुवाद चेतावनी के संदर्भ को स्पष्ट रखता है और धार्मिक अर्थवाले ‘दशमांश देगा’ से बचता है।
- source_word: וְנָתַן
  choice: और उसे ... देगा
  rationale: क्रमसूचक वाव के साथ पूर्ण क्रिया पहले भविष्यकालीन कथन को आगे बढ़ाती है; हिन्दी में ‘और उसे ... देगा’ स्वाभाविक है। ‘उसे’ दसवें भाग को स्पष्ट रूप से संदर्भित करता है।
- source_word: לְסָרִיסָיו
  choice: अपने अधिकारियों
  rationale: סָרִיס राजदरबार के अधिकारी को सूचित कर सकता है, यद्यपि इसका अर्थ ‘नपुंसक’ भी हो सकता है। प्रशासनिक संदर्भ में ‘अधिकारियों’ उपयुक्त है; दूसरा अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלַעֲבָדָיו
  choice: सेवकों
  rationale: עֶבֶד संदर्भ के अनुसार सेवक या दास हो सकता है। यहाँ राजा के अधीन कर्मियों के व्यापक अर्थ में ‘सेवकों’ स्वाभाविक है और अनावश्यक रूप से उनकी कानूनी स्थिति निश्चित नहीं करता।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष शैली रखी गई है। ‘दाख की बारियाँ’ कृषि-संदर्भ को स्पष्ट करती है, और ‘दसवाँ भाग लेगा’ राजकीय वसूली के चेतावनीपूर्ण भाव को बनाए रखता है।
