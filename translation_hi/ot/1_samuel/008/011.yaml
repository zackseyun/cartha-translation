  yaml_path: translation/ot/1_samuel/008/011.yaml
  text: 'He said[a], “This will be the custom of the king who will reign over you: he will take your sons and assign them to his chariots and among his horsemen[c][b], and they will run before his chariots.”'
translation:
  language: hi
  text: 'उसने कहा, “जो राजा तुम पर राज करेगा, उसकी रीति[a] यह होगी: वह तुम्हारे बेटों[b] को लेगा और उन्हें अपने रथों और घुड़सवारों की सेवा में लगाएगा; और वे उसके रथ[c] के आगे दौड़ेंगे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “राजा का कानूनी अधिकार।” इब्रानी מִשְׁפָּט प्रचलित व्यवहार, कानूनी दावा या न्यायिक मानक को दर्शा सकता है; यहाँ यह बताता है कि राजा लोगों के साथ किस प्रकार व्यवहार करेगा।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “तुम्हारे बेटे”; यहाँ पुरुष संतानों की बात है, जो राजकीय सैन्य सेवा के संदर्भ के अनुकूल है।
    reason: cultural_note
  - marker: c
    text: इब्रानी में एकवचन, “उसका रथ”; इसे सामूहिक अर्थ में “उसके रथों” के रूप में भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
