  choice: तौर-तरीका
  rationale: यहाँ शब्द न्यायिक निर्णय से अधिक राजा के व्यवहार और प्रचलित ढंग को बताता है। ‘तौर-तरीका’ चेतावनी के संदर्भ में स्वाभाविक है और राजकीय दावे को स्वतः वैध नहीं ठहराता।
- source_word: הַמֶּלֶךְ אֲשֶׁר יִמְלֹךְ עֲלֵיכֶם
  choice: जो राजा तुम पर राज करेगा
  rationale: यह מלך के राजकीय अर्थ और עַל के ‘पर’ संबंध को सुरक्षित रखता है।
- source_word: אֶת־בְּנֵיכֶם יִקָּח
  choice: वह तुम्हारे बेटों को लेगा
  rationale: בְּנֵיכֶם यहाँ विशेष रूप से पुरुष संतानों को दर्शाता है, जो राजकीय सैन्य सेवा के संदर्भ के अनुकूल है।
- source_word: וְשָׂם לוֹ
  choice: उन्हें ... नियुक्त करेगा
  rationale: שׂים और לוֹ मिलकर राजा द्वारा उन्हें अपनी सेवा में लगाने का भाव देते हैं; ‘नियुक्त करेगा’ आधुनिक हिन्दी में इसे स्पष्ट करता है।
- source_word: בְּמֶרְכַּבְתּוֹ
  choice: अपने रथों
  rationale: एकवचन रूप यहाँ सामूहिक अर्थ में समझा जा सकता है; राजकीय रथ-दल के संदर्भ में बहुवचन स्वाभाविक है।
- source_word: וּבְפָרָשָׁיו
  choice: घुड़सवारों के बीच
  rationale: פָרָשָׁיו राजा के घुड़सवार सैनिकों को दर्शाता है; ‘के बीच’ בְּ के समूह-संबंधी भाव को व्यक्त करता है।
- source_word: וְרָצוּ לִפְנֵי מֶרְכַּבְתּוֹ
  choice: वे उसके रथ के आगे-आगे दौड़ेंगे
  rationale: अंतिम מֶרְכַּבְתּוֹ को उसके व्याकरणिक एकवचन में रखा गया है और לִפְנֵי को स्वाभाविक हिन्दी ‘आगे-आगे’ से व्यक्त किया गया है।
theological_decisions:
- issue: מִשְׁפַּט को वैध राजकीय अधिकार या वर्णनात्मक व्यवहार समझना
  choice: मुख्य पाठ में वर्णनात्मक ‘तौर-तरीका’
  alternative: ‘राजा का कानूनी अधिकार’ या ‘राजा का नियम’
  rationale: प्रसंग राजा द्वारा लोगों से की जाने वाली माँगों की चेतावनी देता है। इसलिए मुख्य पाठ उसके व्यवहार का वर्णन करता है, जबकि वैध अधिकार का संभावित अर्थ टिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तौर-तरीका’ सामान्य पाठक के लिए बोधगम्य है, जबकि फुटनोट מִשְׁפַּט की कानूनी और मानक-संबंधी अर्थ-सीमा को सुरक्षित रखता है। ‘बेटों’ से मूल का लिंग-विशिष्ट आशय बना रहता है।
