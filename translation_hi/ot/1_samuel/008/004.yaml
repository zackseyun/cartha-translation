lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ
  choice: इकट्ठे हुए
  rationale: हित्पएल रूप सामूहिक रूप से एकत्र होने का भाव व्यक्त करता है; आधुनिक हिन्दी में ‘इकट्ठे हुए’ स्वाभाविक और स्पष्ट है।
- source_word: כֹּל זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरनिये
  rationale: כֹּל समूह की समग्रता बताता है, और זִקְנֵי יִשְׂרָאֵל इस्राएल के मान्य वरिष्ठ अगुओं की सामाजिक-राजनीतिक उपाधि है। ‘पुरनिये’ बाइबलीय गरिमा रखते हुए हिन्दी पाठकों के लिए परिचित पद है।
- source_word: וַיָּבֹאוּ אֶל שְׁמוּאֵל
  choice: शमूएल के पास आए
  rationale: בוא के साथ אֶל का आशय किसी व्यक्ति के पास पहुँचने से है; ‘के पास आए’ हिन्दी कथन में सहज है।
- source_word: הָרָמָתָה
  choice: रामा में
  rationale: स्थान-नाम के साथ दिशासूचक ה गति की दिशा ‘रामा को/रामा तक’ दर्शाता है, पर पूरे वाक्य में गंतव्य शमूएल का स्थान भी है। हिन्दी में ‘रामा में शमूएल के पास आए’ गंतव्य और स्थान दोनों को स्वाभाविक रूप से व्यक्त करता है।
