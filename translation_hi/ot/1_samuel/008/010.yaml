base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/010.yaml
  text: So Samuel spoke all the words of Yahweh to the people who were asking him for a king[a].
translation:
  language: hi
  text: तब शमूएल ने याहवे के सभी वचन उन लोगों को सुनाए, जो उससे एक राजा माँग रहे थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिन्होंने उससे एक राजा माँगा था।” हिब्रू कृदंत जारी क्रिया का, अथवा ऐसे लोगों का वर्णन कर सकता है जो इस माँग से पहचाने जाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: कहीं
  rationale: मूल क्रिया का सामान्य अर्थ ‘कहा’ है; ‘सारी बातें’ के साथ हिंदी में बहुवचन ‘कहीं’ स्वाभाविक है और कथन का भाव सुरक्षित रखता है।
- source_word: אֵת כָּל דִּבְרֵי יְהוָה
  choice: याहवे की सारी बातें
  rationale: यह अभिव्यक्ति संदेश की संपूर्णता पर बल देती है और मूल के ‘सभी वचन/बातें’ को सहज आधुनिक हिंदी में व्यक्त करती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्रामटन को उपाधि से बदलने के बजाय उसके व्यक्तिगत नाम के प्रचलित हिंदी लिप्यंतरण से व्यक्त किया गया है।
- source_word: אֶל הָעָם
  choice: उन लोगों से
  rationale: संदर्भ में निश्चित समुदाय पहले से पहचाना हुआ है; कथन-संबंधी क्रिया के साथ हिंदी में ‘लोगों से कहीं’ स्वाभाविक है।
- source_word: הַשֹּׁאֲלִים מֵאִתּוֹ מֶלֶךְ
  choice: जो उससे अपने लिए एक राजा माँग रहे थे
  rationale: कृदंत की जारी अथवा चरित्रगत क्रिया को ‘माँग रहे थे’ से रखा गया है; ‘उससे’ अनुरोध के शमूएल की ओर निर्देशित होने को और ‘अपने लिए’ राजा की माँग को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना आधुनिक हिंदी में लिप्यंतरित करता है।
- issue: הַשֹּׁאֲלִים कृदंत का कालगत भाव
  choice: माँग रहे थे
  alternative: माँगा था
  rationale: हिब्रू कृदंत जारी माँग या इस माँग से पहचाने जाने वाले लोगों—दोनों का संकेत दे सकता है; मुख्य पाठ में जारी क्रिया रखी गई और दूसरा संभव अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ कथानक की हिब्रू वाव-श्रृंखला को स्वाभाविक हिंदी में आगे बढ़ाता है; ‘याहवे’ व्यक्तिगत ईश्वरीय नाम को स्पष्ट बनाए रखता है।
