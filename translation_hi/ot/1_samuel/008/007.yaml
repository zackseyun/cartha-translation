source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר יְהוָה֙ אֶל שְׁמוּאֵ֔ל שְׁמַע֙ בְּ/ק֣וֹל הָ/עָ֔ם לְ/כֹ֥ל אֲשֶׁר יֹאמְר֖וּ אֵלֶ֑י/ךָ כִּ֣י לֹ֤א אֹֽתְ/ךָ֙ מָאָ֔סוּ כִּֽי אֹתִ֥/י מָאֲס֖וּ מִ/מְּלֹ֥ךְ עֲלֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/007.yaml
  text: And Yahweh said to Samuel[a], “Listen to the voice of the people in all that they say to you, for they have not rejected you, but they have rejected me from being king over them.”
translation:
  language: hi
  text: और यहोवा ने शमूएल से कहा, “लोग तुमसे जो कुछ कहते हैं, उस सब में उनकी बात सुनो; क्योंकि उन्होंने तुम्हें नहीं, बल्कि मुझे अपने ऊपर राजा के रूप में अस्वीकार किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שְׁמַע בְּקוֹל הָעָם
  choice: लोगों की बात मानो
  rationale: इस इब्रानी मुहावरे का अर्थ केवल सुनना नहीं, बल्कि कही हुई बात पर ध्यान देकर उसके अनुसार करना है; आधुनिक हिन्दी में ‘बात मानो’ संदर्भानुकूल और स्वाभाविक है।
- source_word: לְכֹל אֲשֶׁר יֹאמְרוּ אֵלֶיךָ
  choice: लोग तुमसे जो कुछ कहते हैं, उस सब में
  rationale: यह उनकी माँग को व्यापक रूप से स्वीकार करने की आज्ञा व्यक्त करता है और मूल के ‘सब/जो कुछ’ को बनाए रखता है।
- source_word: מָאַס
  choice: अस्वीकार किया
  rationale: क्रिया किसी व्यक्ति या उसके अधिकार को ठुकराने का भाव रखती है; दोनों प्रयोगों में एक ही हिन्दी क्रिया रखने से मूल का विरोध स्पष्ट रहता है।
- source_word: מִמְּלֹךְ עֲלֵיהֶם
  choice: ताकि मैं उन पर राजा न रहूँ
  rationale: מִן और infinitive construct यहाँ उनके अस्वीकार का परिणाम/अभिप्राय व्यक्त करते हैं। यह रूप ‘उन पर राज्य करने से’ की अपेक्षा स्वाभाविक हिन्दी में व्यक्तिगत राजत्व पर बल बनाए रखता है।
theological_decisions:
- issue: मानवीय राजा की माँग और यहोवा के राजत्व का अस्वीकार
  choice: जनता ने शमूएल को ही नहीं, स्वयं यहोवा को अपने ऊपर राजा मानने से अस्वीकार किया।
  alternative: जनता ने केवल शमूएल के नेतृत्व को अस्वीकार किया।
  rationale: इब्रानी पाठ शमूएल और यहोवा के बीच स्पष्ट विरोध स्थापित करता है और अंतिम पदबंध इस अस्वीकार को यहोवा के राजत्व से जोड़ता है; अनुवाद इससे आगे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ता।
- issue: מִמְּלֹךְ עֲלֵיהֶם का संबंध
  choice: ‘ताकि मैं उन पर राजा न रहूँ’—अस्वीकार के आशय या परिणाम को व्यक्त करता है।
  alternative: ‘मुझे उन पर राज्य करने से अस्वीकार किया’—रूप की दृष्टि से अधिक निकट, पर हिन्दी में अस्वाभाविक।
  rationale: मूल की व्याकरणिक संक्षिप्तता हिन्दी में हूबहू रखने पर अर्थ अस्पष्ट होता; चुना हुआ रूप वही राजत्व-संबंधी तनाव स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘बात मानो’ इब्रानी श्रवण-आज्ञापालन मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है। पद में कोई पादटिप्पणी आवश्यक नहीं मानी गई; उपलब्ध अंग्रेज़ी पादटिप्पणी का चिह्न और विषय परस्पर असंगत प्रतीत होते हैं।
