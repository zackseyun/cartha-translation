  yaml_path: translation/ot/1_samuel/008/017.yaml
  text: He will take a tenth of your flocks[a], and you will become his servants.
translation:
  language: hi
  text: वह तुम्हारी भेड़-बकरियों का दसवाँ भाग लेगा, और तुम उसके दास[a] बन जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक।” इब्रानी शब्द सेवा करने वालों अथवा पराधीन दासों, दोनों के लिए प्रयुक्त हो सकता है; यहाँ राजकीय वसूली और स्वतंत्रता खोने का संदर्भ “दास” अर्थ का समर्थन करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צֹאנְכֶם
  choice: तुम्हारी भेड़-बकरियों
  rationale: צֹאן छोटे पालतू पशुओं, विशेषकर भेड़ों और बकरियों, को सामूहिक रूप से दर्शाता है। ‘भेड़-बकरियों’ से हिन्दी में यह सामूहिक अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: יַעְשֹׂר
  choice: दसवाँ भाग लेगा
  rationale: यहाँ क्रिया का अर्थ दसवाँ हिस्सा लेना है। राजकीय वसूली की चेतावनी के संदर्भ में ‘लेगा’ अनिवार्य अधिग्रहण को स्पष्ट करता है और धार्मिक अथवा स्वैच्छिक दशमांश का भ्रम नहीं पैदा करता।
- source_word: וְאַתֶּם תִּהְיוּ לוֹ
  choice: और तुम उसके ... बन जाओगे
  rationale: मूल क्रिया सामान्यतः ‘होना’ है, पर प्रसंग में यह राजा की माँगों के परिणामस्वरूप आने वाली नई अधीन दशा बताती है; इसलिए ‘बन जाओगे’ स्वाभाविक हिन्दी में परिणामी भाव व्यक्त करता है।
- source_word: לַעֲבָדִים
  choice: दास
  rationale: עֲבָדִים सेवा करने वालों से लेकर पराधीन दासों तक को सूचित कर सकता है। यहाँ राजकीय शोषण और स्वतंत्रता खोने की चेतावनी के कारण ‘दास’ संदर्भ की कठोरता को ‘सेवक’ से बेहतर व्यक्त करता है।
theological_decisions:
- issue: राजकीय अधीनता के संदर्भ में עֲבָדִים का अनुवाद
  choice: दास
  alternative: सेवक
  rationale: पद इस चेतावनी की पराकाष्ठा बताता है कि राजा लोगों को अपने अधीन कर लेगा। ‘दास’ इस बाध्यकारी पराधीनता को बनाए रखता है, जबकि पादटिप्पणी मूल शब्द की व्यापक अर्थ-सीमा को स्वीकार करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज हिन्दी में रखी गई है। ‘भेड़-बकरियों’ ग्रामीण-पशुपालन संदर्भ में स्पष्ट है; ‘दसवाँ भाग लेगा’ धार्मिक पारिभाषिकता से बचते हुए जबरन राजकीय वसूली व्यक्त करता है। पादटिप्पणी का चिह्न उसी विवादित शब्द ‘दास’ के बाद रखा गया है।
