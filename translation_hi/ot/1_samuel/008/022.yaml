base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/022.yaml
  text: And Yahweh said to Samuel[a], “Listen to their voice and make a king for them.” Then Samuel said to the men of Israel, “Go[b], each man to his city.”
translation:
  language: hi
  text: तब याहवे ने शमूएल से कहा, “उनकी बात मानो[a] और उनके लिए एक राजा नियुक्त करो।” फिर शमूएल ने इस्राएल के पुरुषों[b] से कहा, “तुम में से हर पुरुष अपने नगर को चला जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनकी आवाज़ सुनो”; इस इब्रानी मुहावरे का अर्थ उनकी बात पर ध्यान देना या उनकी माँग मान लेना भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “इस्राएल के पुरुषों”; यह पद एकत्र हुए इस्राएलियों के लिए प्रतिनिधिक रूप से प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: שְׁמַע בְּקוֹלָם
  choice: उनकी बात मानो
  rationale: इस इब्रानी मुहावरे का आशय यहाँ उनकी माँग सुनकर उसके अनुसार करना है; स्वाभाविक हिन्दी में ‘बात मानो’ यही अनुपालन व्यक्त करता है।
- source_word: וְהִמְלַכְתָּ לָהֶם מֶלֶךְ
  choice: उनके लिए एक राजा नियुक्त करो
  rationale: हिफ़ील रूप किसी को राजा के पद पर स्थापित करने का कारणवाचक अर्थ देता है; ‘राजा नियुक्त करो’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: इस्राएल के पुरुषों
  rationale: मूल पाठ के स्पष्ट पुल्लिंग बहुवचन को बनाए रखा गया है; संदर्भ में ये एकत्र हुए इस्राएलियों का प्रतिनिधित्व कर सकते हैं।
- source_word: אִישׁ לְעִירוֹ
  choice: तुम में से हर एक अपने नगर को चला जाए
  rationale: אִישׁ यहाँ वितरणात्मक है। ‘हर एक’ हिन्दी में स्वाभाविक है और ‘अपने नगर’ मूल के प्रत्येक व्यक्ति के नगर की ओर लौटने का भाव रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया; ‘यहवे’ स्रोत-रूप के निकट लिप्यंतरण है।
- issue: שְׁמַע בְּקוֹלָם में सुनने और अनुपालन के बीच अर्थ-तनाव
  choice: मुख्य पाठ में ‘उनकी बात मानो’, पादटिप्पणी में शाब्दिक रूप
  alternative: ‘उनकी आवाज़ सुनो’
  rationale: संदर्भ अनुपालन की माँग करता है, पर इब्रानी मुहावरे का शाब्दिक रूप और उसकी अर्थ-छाया पादटिप्पणी में सुरक्षित रखी गई है।
- issue: אַנְשֵׁי יִשְׂרָאֵל का लिंग-सूचक रूप
  choice: इस्राएल के पुरुषों
  alternative: इस्राएलियों; इस्राएल के लोगों
  rationale: मूल के स्पष्ट पुल्लिंग रूप को समतल करके लिंग-निरपेक्ष नहीं बनाया गया, यद्यपि इसका प्रयोग सभा के प्रतिनिधियों के लिए हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक रजिस्टर अपनाया गया है। ‘कहा’, ‘बात मानो’ और ‘नियुक्त करो’ सामान्य पाठकों के लिए स्पष्ट हैं; मूल के पुरुषवाचक पद और ईश्वरीय व्यक्तिगत नाम सुरक्षित रखे गए हैं।
