  naturalness: ‘उत्तम जवानों’ is understandable but is not idiomatic modern standard Hindi; ‘जवान’ can also evoke soldiers. ‘श्रेष्ठ युवकों’ naturally conveys both the young male referent and their select quality. The rest is clear and appropriately dignified.
  terminology: ‘दासों’ and ‘दासियों’ preserve the gendered parallel in the Hebrew. ‘गधों’ is the ordinary equivalent of ‘donkeys,’ and ‘अपना काम कराएगा’ suitably applies collectively to people and animals conscripted for royal labor. The footnote should give both corresponding alternative gendered terms.
