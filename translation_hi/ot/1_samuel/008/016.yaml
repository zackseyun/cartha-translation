    issue: ‘उत्तम जवानों’ is stylistically awkward and may suggest military जवानों.
    rationale: בַּחוּרֵיכֶם denotes young men, not specifically soldiers; ‘श्रेष्ठ युवकों’ is more natural and precise in modern Hindi.
  - severity: low
    issue: The lexical-alternative footnote names only ‘सेवकों,’ although the anchored expression is paired in the verse with female slaves.
    rationale: Giving ‘सेवकों ... सेविकाओं’ better preserves the Hebrew’s male/female parallel without changing the translation’s contextual choice.
