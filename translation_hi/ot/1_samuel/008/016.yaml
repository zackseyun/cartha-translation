lexical_decisions:
- source_word: עַבְדֵיכֶם
  choice: तुम्हारे दासों
  rationale: עֶבֶד का अर्थ दास या सेवक हो सकता है। राजा द्वारा जबरन ले लिए जाने के इस प्रसंग में ‘दास’ उपयुक्त है, जबकि पादटिप्पणी व्यापक अर्थ ‘सेवक’ को सुरक्षित रखती है।
- source_word: שִׁפְחוֹתֵיכֶם
  choice: तुम्हारी दासियों
  rationale: שִׁפְחָה स्त्री दासी या सेविका को दर्शाता है; ‘दासियों’ पिछले पद के लिंग-भेद और संभावित बंधुआ स्थिति दोनों को बनाए रखता है।
- source_word: בַּחוּרֵיכֶם הַטּוֹבִים
  choice: तुम्हारे उत्तम जवानों
  rationale: בָּחוּר जीवन के उत्कर्ष में जवान पुरुष को और הַטּוֹבִים उनमें श्रेष्ठ या उत्तम होने को दर्शाता है।
- source_word: חֲמוֹרֵיכֶם
  choice: तुम्हारे गधों
  rationale: חֲמוֹר का सामान्य आधुनिक हिन्दी समतुल्य ‘गधा’ है।
- source_word: יִקָּח
  choice: ले लेगा
  rationale: לקח का मूल अर्थ ‘लेना’ है; चेतावनी के भविष्यसूचक क्रम में भविष्यकाल स्वाभाविक है, और ‘ले लेगा’ अधिग्रहण की तीव्रता भी व्यक्त करता है।
- source_word: וְעָשָׂה לִמְלַאכְתּוֹ
  choice: और उनसे अपना काम कराएगा
  rationale: शाब्दिक संरचना ‘और वह अपने काम के लिए करेगा/लगाएगा’ है। हिन्दी में यह रूप मनुष्यों और पशुओं, दोनों को राजा के काम में लगाए जाने का अर्थ स्वाभाविक ढंग से देता है।
