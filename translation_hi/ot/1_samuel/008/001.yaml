  text: When Samuel grew old[a], he appointed his sons as judges over Israel.
translation:
  language: hi
  text: जब शमूएल बूढ़ा हो गया, तब उसने अपने पुत्रों को इस्राएल पर न्यायी नियुक्त किया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने पुत्रों को इस्राएल के लिए न्यायी नियुक्त किया।’ इब्रानी क्रिया का शाब्दिक अर्थ ‘रखा/ठहराया’ है, और ‘इस्राएल’ से पहले का पूर्वसर्ग प्रसंग के अनुसार ‘के लिए’ या अधिकार-क्षेत्र के अर्थ में ‘पर’ समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כַּאֲשֶׁר
  choice: जब...तब
  rationale: इब्रानी कथा-सूत्र यहाँ समयगत परिस्थिति प्रस्तुत करता है; आधुनिक हिन्दी में ‘जब...तब’ उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: זָקֵן
  choice: बूढ़ा हो गया
  rationale: क्रिया वृद्ध होने या वृद्धावस्था में पहुँचने का भाव देती है, न कि केवल स्थिर अवस्था का।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: यह हिन्दी बाइबल परंपरा में प्रचलित नाम-रूप है।
- source_word: וַיָּשֶׂם
  choice: नियुक्त किया
  rationale: मूल अर्थ ‘रखा/ठहराया’ है, पर पद या दायित्व सौंपने के इस प्रसंग में ‘नियुक्त किया’ स्वाभाविक और सटीक है।
- source_word: אֶת בָּנָיו
  choice: अपने पुत्रों को
  rationale: मूल पाठ स्पष्ट रूप से उसके पुरुष वंशजों, अर्थात पुत्रों, का उल्लेख करता है।
- source_word: שֹׁפְטִים
  choice: न्यायी
  rationale: यह शब्द न्याय करने वाले पदाधिकारियों को दर्शाता है; ‘न्यायी’ शमूएल की पुस्तक के ऐतिहासिक-शासकीय संदर्भ को बनाए रखता है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: לְ संबंध या हित-क्षेत्र को व्यक्त कर सकता है। ‘के लिए’ मूल की व्यापकता को सुरक्षित रखता है और अनावश्यक रूप से ‘पर’ वाले अधिकार-संबंध को निश्चित नहीं करता।
theological_decisions:
- issue: לְיִשְׂרָאֵל में नियुक्ति के संबंध का अर्थ
  choice: इस्राएल के लिए
  alternative: इस्राएल पर
  rationale: पूर्वसर्ग לְ ‘के लिए’ या प्रसंगानुसार अधिकार-क्षेत्र के अर्थ में ‘पर’ समझा जा सकता है। मुख्य पाठ में अधिक सीधा ‘के लिए’ रखा गया है; इससे किसी विशेष शासन-सिद्धांत को पाठ में आरोपित नहीं किया जाता।
