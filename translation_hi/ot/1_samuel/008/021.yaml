  yaml_path: translation/ot/1_samuel/008/021.yaml
  text: Samuel heard all the words of the people[b][a], and he spoke them in the ears of Yahweh.
translation:
  language: hi
  text: शमूएल ने लोगों की सारी बातें सुनीं और याहवे[a] के सामने वे सारी बातें कहीं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है। इसे परंपरागत रूप से ‘यहोवा’ कहा गया है या ‘प्रभु’ से प्रतिस्थापित किया गया है; यहाँ ‘याहवे’ दिया गया है।
    reason: alternative_reading
  - marker: b
    text: शाब्दिक रूप से, “याहवे के कानों में [वे बातें] कहीं,” अर्थात याहवे की सुनवाई में या उसके सामने कहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुनीं
  rationale: שׁמע यहाँ सामान्य कथात्मक अर्थ में लोगों की कही बातें सुनने को व्यक्त करता है। हिंदी में स्त्रीलिंग बहुवचन ‘बातें’ के अनुसार ‘सुनीं’ स्वाभाविक है।
- source_word: כָּל דִּבְרֵי הָעָם
  choice: लोगों की सारी बातें
  rationale: यह अनुवाद כָּל की समग्रता और דִּבְרֵי के ‘बातों/वचनों’ वाले अर्थ को स्पष्ट, सहज आधुनिक हिंदी में बनाए रखता है।
- source_word: וַיְדַבְּרֵם
  choice: उन्हें दोहराया
  rationale: प्रत्यय ‘उन्हें’ लोगों की बातों की ओर लौटता है। ‘दोहराया’ प्रसंग में इस भाव को स्वाभाविक रूप से व्यक्त करता है कि शमूएल ने वही बातें परमेश्वर के सामने कहीं; ‘सूचित किया’ से अधिक औपचारिक अर्थ जोड़ने से बचा गया है।
- source_word: בְּאָזְנֵי
  choice: के सामने
  rationale: शाब्दिक अर्थ ‘के कानों में’ है, पर हिंदी में इससे फुसफुसाने का भ्रामक भाव आ सकता है। ‘के सामने’ किसी की सुनवाई या उपस्थिति में कहने का इब्रानी मुहावरे का आशय देता है; शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चार-अक्षरीय व्यक्तिगत नाम YHWH को उपाधि से बदलने के बजाय प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिगत नाम का मानक हिंदी बाइबिलीय लिप्यंतरण।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘याहवे’ उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और YHWH के संभावित प्राचीन उच्चारण का निकट लिप्यंतरण है; उच्चारण की ऐतिहासिक अनिश्चितता पादटिप्पणी में बताई गई है।
- issue: बातों को परमेश्वर के सामने कहने का वर्णन
  choice: याहवे के सामने उन्हें दोहराया
  alternative: याहवे के कानों में उन्हें कहा
  rationale: ‘के सामने’ इब्रानी मुहावरे का अर्थ स्पष्ट करता है, जबकि ‘दोहराया’ यह बताता है कि शमूएल ने लोगों की वही बातें कहीं। इससे प्रार्थना या प्रतिवेदन की विधा को मूल से अधिक निश्चित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लोगों की सारी बातें’ मूल की पूर्णता को बनाए रखता है। इब्रानी मुहावरे का शाब्दिक हिंदी रूप फुसफुसाने का अनचाहा अर्थ दे सकता था, इसलिए मुख्य पाठ में अर्थ-संगत ‘के सामने’ और पादटिप्पणी में मूल बिंब दिया गया है।
