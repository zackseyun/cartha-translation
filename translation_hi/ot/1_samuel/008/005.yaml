base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/005.yaml
  text: They said to him[a], “Look, you have grown old, and your sons have not walked in your ways. Now appoint for us a king to judge us, like all the nations.”
translation:
  language: hi
  text: उन्होंने उससे कहा, “देखिए, आप बूढ़े हो गए हैं, और आपके बेटे आपके मार्गों पर नहीं चले। अब हमारे लिए एक राजा नियुक्त कर दीजिए, जो सभी जातियों की तरह हमारा न्याय करे[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हम पर शासन करे” अथवा “हम पर राज करे”; इस संदर्भ में ‘न्याय करना’ वाली हिब्रू क्रिया में व्यापक शासकीय अधिकार भी शामिल हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह आधुनिक और स्वाभाविक संबोधन है, जो हिब्रू के ध्यान आकर्षित करने वाले बल को बनाए रखता है।
- source_word: זָקַנְתָּ
  choice: आप बूढ़े हो गए हैं
  rationale: पूर्ण क्रिया से व्यक्त प्रक्रिया और वर्तमान परिणामी अवस्था—दोनों को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: הָלְכוּ בִּדְרָכֶיךָ
  choice: आपके मार्गों पर नहीं चले
  rationale: हिब्रू के नैतिक रूपक ‘मार्गों पर चलना’ को बनाए रखता है और हिन्दी में समझने योग्य है।
- source_word: שִׂימָה לָּנוּ
  choice: हमारे लिए भी एक राजा नियुक्त कर दीजिए
  rationale: राजकीय नेतृत्व स्थापित करने के संदर्भ में ‘नियुक्त’ क्रिया का आशय स्पष्ट करती है; ‘भी’ आसपास की जातियों से तुलना को स्वाभाविक रूप से जोड़ता है।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: राजा के लिए प्रयुक्त सामान्य हिब्रू संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: לְשָׁפְטֵנוּ
  choice: जो हमारा न्याय करे
  rationale: שׁפט के मूल न्यायिक अर्थ को मुख्य पाठ में सुरक्षित रखता है, जबकि संदर्भ में निहित व्यापक शासन-अर्थ को पादटिप्पणी में बताया गया है।
- source_word: כְּכָל הַגּוֹיִם
  choice: दूसरी सभी जातियों की तरह
  rationale: आसपास के अन्य लोगों की राजनैतिक व्यवस्था से तुलना व्यक्त करता है; ‘गैर-यहूदी’ जैसा बाद के युगों से जुड़ा पद नहीं लाता।
theological_decisions:
- issue: आसपास की जातियों के समान राजतंत्र की माँग
  choice: दूसरी सभी जातियों की तरह
  alternative: सभी गैर-यहूदियों की तरह
  rationale: ‘जातियाँ’ तत्कालीन राजनैतिक-सामुदायिक तुलना को सुरक्षित रखता है और बाद के धार्मिक-जातीय प्रयोग को अनावश्यक रूप से पाठ में नहीं लाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सम्मानसूचक ‘आप’ और अनुरोधात्मक ‘कर दीजिए’ का प्रयोग किया गया है। भाषा साधारण पाठक के लिए स्पष्ट और गरिमापूर्ण है; ‘मार्गों पर चलना’ जैसे प्रमुख बाइबलीय रूपक को सुरक्षित रखा गया है।
