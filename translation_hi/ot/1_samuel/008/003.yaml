  yaml_path: translation/ot/1_samuel/008/003.yaml
  text: But his sons did not walk in his ways[a]; they turned aside after dishonest gain, took bribes[b], and perverted justice.
translation:
  language: hi
  text: पर उसके बेटे उसकी राह पर नहीं चले। वे बेईमानी की कमाई के पीछे पड़ गए[a], घूस लेते थे और न्याय को तोड़-मरोड़ देते थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनुचित लाभ के पीछे पड़ गए’ अथवा ‘लालच के पीछे पड़ गए।’ इब्रानी शब्द ऐसे लाभ को दर्शाता है जिसे गलत या शोषणपूर्ण ढंग से पाने की कोशिश की जाए।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘न्याय को मोड़ दिया।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הָלְכוּ ... בִדְרָכוֹ
  choice: उसकी राह पर नहीं चले
  rationale: यह इब्रानी मुहावरा किसी के आचरण या जीवन-पद्धति का अनुसरण करने को दर्शाता है। ‘राह पर चलना’ मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में सहज है।
- source_word: וַיִּטּוּ אַחֲרֵי הַבָּצַע
  choice: बेईमानी की कमाई के पीछे लग गए
  rationale: נטה यहाँ सही मार्ग से हटने का भाव देता है, और בצע ऐसे लाभ को सूचित करता है जिसे अनुचित, लालची या शोषणपूर्ण ढंग से पाया जाए। हिन्दी वाक्यांश दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּקְחוּ שֹׁחַד
  choice: घूस लेने लगे
  rationale: שֹׁחַד न्यायिक संदर्भ में रिश्वत या घूस है। वर्णन उनकी लगातार चलने वाली प्रथा का है, इसलिए ‘लेने लगे’ प्रसंग में स्वाभाविक है।
- source_word: וַיַּטּוּ מִשְׁפָּט
  choice: न्याय को तोड़-मरोड़ दिया
  rationale: यह कानूनी मुहावरा न्याय अथवा निर्णय को पक्षपात से विकृत करने का अर्थ देता है। यह रूप कानूनी गंभीरता बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: इब्रानी शब्द पुल्लिंग बहुवचन है और प्रसंग में शमूएल के बेटों को सूचित करता है।
theological_decisions:
- issue: शमूएल के बेटों के आचरण का नैतिक-कानूनी वर्णन
  choice: अनुचित कमाई, घूस और न्याय-विकृति—तीनों कानूनी भ्रष्टाचार के तत्व स्पष्ट रखे गए हैं।
  alternative: केवल सामान्य भाषा में कहना कि वे लालची थे या अन्याय करते थे।
  rationale: मूल पाठ न्यायिक भ्रष्टाचार से जुड़े पदों को क्रमशः जोड़ता है। सामान्य नैतिक भाषा इस विशिष्ट कानूनी आरोप को कमजोर कर देती।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज किंतु गरिमापूर्ण है। ‘राह पर चलना’ मूल इब्रानी रूपक को बनाए रखता है, जबकि ‘बेईमानी की कमाई’, ‘घूस’ और ‘न्याय को तोड़-मरोड़ दिया’ न्यायिक भ्रष्टाचार को सामान्य पाठक के लिए स्पष्ट करते हैं।
