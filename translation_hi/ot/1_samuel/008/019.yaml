translation:
  language: hi
  text: परन्तु लोगों ने शमूएल की बात सुनने से इनकार किया[a] और कहा, “नहीं, बल्कि हम पर एक राजा होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमूएल की बात मानने से इनकार किया।” इब्रानी मुहावरे का अर्थ किसी की बात पर ध्यान देना या उसकी आज्ञा मानना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמָאֲנוּ
  choice: इनकार कर दिया
  rationale: क्रिया מאן सक्रिय अस्वीकृति या अनिच्छा व्यक्त करती है; ‘इनकार कर दिया’ आधुनिक हिन्दी में इसके कथात्मक बल को स्वाभाविक रूप से रखता है।
- source_word: הָעָם
  choice: लोगों
  rationale: עם यहाँ राजा माँगने वाले इस्राएली समुदाय को सामूहिक रूप से दर्शाता है; ‘लोग’ सहज और मानक हिन्दी है।
- source_word: לִשְׁמֹעַ בְּקוֹל שְׁמוּאֵל
  choice: शमूएल की बात मानने
  rationale: שמע בקול एक इब्रानी मुहावरा है जिसका अर्थ केवल सुनना नहीं, बल्कि ध्यान देना या आज्ञा मानना भी हो सकता है। प्रसंग में लोगों द्वारा शमूएल की चेतावनी न मानना प्रमुख है; ‘बात मानने’ हिन्दी में दोनों भावों को स्वाभाविक रूप से समेटता है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: नाम को हिन्दी बाइबलीय परंपरा और इब्रानी उच्चारण के अनुरूप लिप्यंतरित किया गया है।
- source_word: וַיֹּאמְרוּ
  choice: और कहा
  rationale: אמר सामान्य कथन-सूचक क्रिया है; बहुवचन कर्ता ‘लोगों’ के साथ हिन्दी में ‘कहा’ स्वाभाविक है।
- source_word: לֹא
  choice: नहीं!
  rationale: अलग खड़ा निषेध शमूएल की बात का जोरदार प्रतिवाद है; विस्मयादिबोधक चिह्न संवाद में उसका बल स्पष्ट करता है।
- source_word: כִּי אִם
  choice: '[अलग संयोजक के बजाय अगले कथन के बल में समाहित]'
  rationale: לֹא כִּי אִם का संयुक्त अर्थ ‘नहीं, बल्कि/इसके विपरीत’ है। हिन्दी में ‘नहीं! हम पर... अवश्य’ अधिक स्वाभाविक है और तीखा विरोध बनाए रखता है।
- source_word: מֶלֶךְ יִהְיֶה עָלֵינוּ
  choice: हम पर एक राजा अवश्य होगा
  rationale: यह लोगों की दृढ़ माँग व्यक्त करता है। ‘हम पर’ राजकीय अधिकार का संबंध सुरक्षित रखता है, और ‘अवश्य होगा’ अपूर्ण क्रिया के संदर्भगत निश्चय तथा आग्रह को व्यक्त करता है।
