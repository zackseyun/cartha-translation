  text: उसके पहलौठे पुत्र का नाम योएल और उसके दूसरे पुत्र का नाम अबिय्याह था; वे बेर्शेबा में न्यायाधीश थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי שֶׁם
  choice: नाम ... था
  rationale: नामकरण-सूत्र में וַיְהִי साधारण संबंधसूचक अर्थ देता है; हिंदी में ‘नाम ... था’ स्वाभाविक और स्रोत के निकट है।
- source_word: בְּנוֹ
  choice: उसके
  rationale: सर्वनाम का संबंध पिछले संदर्भ के शमूएल से है। हिंदी में ‘पहलौठे’ के साथ पुत्रत्व निहित है, इसलिए अनावश्यक रूप से ‘पुत्र’ नहीं जोड़ा गया।
- source_word: הַבְּכוֹר
  choice: पहलौठे
  rationale: यह जन्मक्रम में प्रथम संतान, यहाँ पुत्र, को ठीक-ठीक व्यक्त करता है और केवल ‘बड़े’ की अपेक्षा मूल शब्द के अधिक निकट है।
- source_word: יוֹאֵל
  choice: योएल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: מִשְׁנֵהוּ
  choice: दूसरे
  rationale: जन्मक्रम में दूसरे को व्यक्त करता है; समानांतर वाक्यरचना में ‘पुत्र’ संदर्भ से स्पष्ट है।
- source_word: אֲבִיָּה
  choice: अबिय्याह
  rationale: इब्रानी व्यक्तिगत नाम का ध्वन्यात्मक हिंदी लिप्यंतरण।
- source_word: שֹׁפְטִים
  choice: वे ... न्यायी थे
  rationale: बहुवचन कृदंत दोनों पुत्रों की निरंतर भूमिका अथवा पद को दर्शाता है; ‘न्यायी थे’ संक्षिप्त और गरिमापूर्ण है।
- source_word: בִּבְאֵר שָׁבַע
  choice: बेर्शेबा में
  rationale: स्थानवाचक उपसर्ग בְּ को ‘में’ से और स्थाननाम को प्रचलित हिंदी रूप में व्यक्त किया गया है।
