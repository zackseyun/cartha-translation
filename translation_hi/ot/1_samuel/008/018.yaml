  text: וּ/זְעַקְתֶּם֙ בַּ/יּ֣וֹם הַ/ה֔וּא מִ/לִּ/פְנֵ֣י מַלְכְּ/כֶ֔ם אֲשֶׁ֥ר בְּחַרְתֶּ֖ם לָ/כֶ֑ם וְ/לֹֽא יַעֲנֶ֧ה יְהוָ֛ה אֶתְ/כֶ֖ם בַּ/יּ֥וֹם הַ/הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/018.yaml
  text: And in that day you will cry out because of your king, whom you have chosen for yourselves, but Yahweh will not answer you in that day.
translation:
  language: hi
  text: उस दिन तुम अपने राजा के कारण, जिसे तुमने अपने लिए चुना है, पुकारोगे; परन्तु याहवे उस दिन तुम्हें उत्तर नहीं देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּזְעַקְתֶּם
  choice: सहायता के लिए पुकारोगे
  rationale: זעק संकट में तीव्र पुकार या सहायता की गुहार को व्यक्त करता है। हिंदी में यह प्रयोग प्रसंगगत आशय को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक कालवाचक अभिव्यक्ति है। पद में इसकी पुनरावृत्ति को बनाए रखा गया है।
- source_word: מִלִּפְנֵי
  choice: के कारण
  rationale: शाब्दिक अर्थ 'के सामने से/उपस्थिति के कारण' हो सकता है, पर यहाँ राजा से उत्पन्न संकट का कारणवाचक भाव प्रमुख है।
- source_word: מַלְכְּכֶם
  choice: तुम्हारे उस राजा
  rationale: संबंधसूचक रूप 'तुम्हारे राजा' को रखा गया है; 'उस' सापेक्ष उपवाक्य से हिंदी वाक्य को स्वाभाविक रूप से जोड़ता है।
- source_word: אֲשֶׁר בְּחַרְתֶּם לָכֶם
  choice: जिसे तुमने अपने लिए चुना है
  rationale: यह इस्राएल की अपनी पसंद और उसके वर्तमान परिणाम पर बल देता है; לָכֶם का आत्मसंबंधी भाव 'अपने लिए' से सुरक्षित है।
- source_word: וְלֹא יַעֲנֶה
  choice: परन्तु ... उत्तर नहीं देगा
  rationale: वाव यहाँ उनकी पुकार और यहोवा के उत्तर न देने के बीच विरोध व्यक्त करता है; 'परन्तु' हिंदी में इसे स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित प्रत्यक्ष नामरूप 'यहोवा' चतुरक्षरीय ईश्वरीय नाम को किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- source_word: אֶתְכֶם
  choice: तुम्हें
  rationale: ענה के साथ हिंदी की स्वाभाविक रचना 'तुम्हें उत्तर देना' है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में ईश्वर का निजी वाचा-नाम सीधे आया है। आधुनिक हिंदी पाठकों में पहचाने जाने वाले प्रत्यक्ष नामरूप 'यहोवा' को अपनाया गया है, न कि 'प्रभु' जैसी उपाधि को।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। मूल की दोनों कालवाचक अभिव्यक्तियाँ 'उस दिन' के रूप में सुरक्षित हैं, और इस्राएल की अपनी चुनी हुई राजसत्ता के लिए जिम्मेदारी स्पष्ट बनी रहती है।
