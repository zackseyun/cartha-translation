base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/006.yaml
  text: But the matter was displeasing in Samuel’s eyes when they said[b][a], “Give us a king to judge us.” And Samuel prayed to Yahweh.
translation:
  language: hi
  text: लेकिन जब उन्होंने कहा, “हमें हमारा न्याय करने के लिए एक राजा दे,” तो यह बात शमूएल की दृष्टि में बुरी थी।[a] तब शमूएल ने यहोवा से प्रार्थना की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह बात शमूएल की दृष्टि में बुरी थी।” यह शमूएल के प्रबल नकारात्मक मूल्यांकन को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּרַע
  choice: बुरी लगी
  rationale: यह רעע के नैतिक-मूल्यांकन वाले बल को बनाए रखता है और हिन्दी में स्वाभाविक भी है; केवल ‘अच्छी नहीं लगी’ कहने से इसकी तीव्रता घट जाती।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דבר यहाँ पहले कही गई मांग की ओर संकेत करता है; ‘यह बात’ सहज हिन्दी है और अर्थ को अनावश्यक रूप से ‘निवेदन’ तक सीमित नहीं करता।
- source_word: בְּעֵינֵי שְׁמוּאֵל
  choice: शमूएल की दृष्टि में
  rationale: यह इब्रानी मुहावरे के दृष्टिकोण और मूल्यांकन—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר אָמְרוּ
  choice: जब उन्होंने कहा
  rationale: כַּאֲשֶׁר को यहाँ कालवाचक रूप में समझना कथा-प्रवाह के अनुकूल है और कारण-संबंध को आवश्यकता से अधिक स्पष्ट नहीं करता।
- source_word: תְּנָה לָּנוּ
  choice: हमें ... दे
  rationale: נתן के आज्ञार्थक रूप की सीधी और स्वाभाविक अभिव्यक्ति है।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: संदर्भ में מֶלֶךְ का मानक और स्पष्ट हिन्दी रूप।
- source_word: לְשָׁפְטֵנוּ
  choice: हमारा न्याय करने के लिए
  rationale: שׁפט का मूल अर्थ और पुस्तक में न्यायियों तथा शमूएल की भूमिका से शब्दगत संबंध सुरक्षित रहता है; यहाँ शासन करने का व्यापक भाव भी निहित हो सकता है।
- source_word: וַיִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: פלל के हित्पएल का सामान्य और स्वाभाविक अर्थ; ‘मध्यस्थता की’ क्रिया से अधिक विशिष्ट होता।
- source_word: אֶל יְהוָה
  choice: यहोवा से
  rationale: प्रार्थना के साथ हिन्दी में ‘से’ स्वाभाविक है, और יהוה को परियोजना की परंपरा के अनुरूप ‘यहोवा’ लिखा गया है।
theological_decisions:
- issue: וַיֵּרַע में शमूएल के नकारात्मक मूल्यांकन की तीव्रता
  choice: शमूएल की दृष्टि में बुरी लगी
  alternative: शमूएल को यह बात अप्रिय लगी
  rationale: चुना हुआ पाठ इब्रानी के नैतिक-मूल्यांकन वाले बल और शमूएल के दृष्टिकोण—दोनों को रखता है, बिना यह घोषित किए कि कथावाचक ने सीधे उस मांग को बुरा कहा है।
- issue: לְשָׁפְטֵנוּ का न्यायिक अथवा शासकीय विस्तार
  choice: हमारा न्याय करने के लिए
  alternative: हम पर शासन करने के लिए
  rationale: ‘न्याय करने’ से मूल धातु और न्यायियों की पुस्तकगत पृष्ठभूमि बनी रहती है; साथ ही इस संदर्भ में शासन का व्यापक अर्थ संभव है।
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में परिचित और गरिमापूर्ण रूप चुना गया है; यह नाम को सामान्य उपाधि ‘प्रभु’ में नहीं बदलता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘शमूएल की दृष्टि में’ मूल मुहावरे की छवि और दृष्टिकोण को रखता है। मुख्य पाठ में केवल आवश्यक टिप्पणी [a] दी गई है।
