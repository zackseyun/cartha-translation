base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/009.yaml
  text: So now[a], listen to their voice; only, you must solemnly warn them and tell them the justice of the king who will reign over them.
translation:
  language: hi
  text: अब उनकी बात मान; पर उन्हें अवश्य चेतावनी दे और उन्हें उस राजा की रीति[a] बता जो उन पर राज करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा का अधिकार” अथवा “राजा का ढंग।” इब्रानी शब्द מִשְׁפָּט का अर्थ न्याय, वैधानिक अधिकार या प्रचलित रीति भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁמַע בְּקוֹלָם
  choice: उनकी बात मान
  rationale: यह इब्रानी मुहावरा किसी की बात सुनने और उसके अनुरोध के अनुसार करने का अर्थ देता है। यहाँ परमेश्वर शमूएल से प्रजा का अनुरोध स्वीकार करने को कहते हैं; ‘बात मान’ आधुनिक हिन्दी में इस आशय को स्वाभाविक रूप से व्यक्त करता है, बिना उनके आग्रह का समर्थन सूचित किए।
- source_word: אַךְ כִּי
  choice: फिर भी
  rationale: यह पिछले आदेश पर एक प्रबल योग्यता या विरोधात्मक सीमा लगाता है। ‘फिर भी’ राजा देने के आदेश और चेतावनी देने की आवश्यकता के बीच का तनाव स्पष्ट रखता है।
- source_word: הָעֵד תָּעִיד
  choice: गंभीरता से चेतावनी दे
  rationale: क्रिया के साथ infinitive absolute चेतावनी की तीव्रता बढ़ाता है; मूल धातु में औपचारिक साक्ष्य अथवा चेतावनी का भाव भी है। ‘गंभीरता से चेतावनी दे’ तीव्रता और औपचारिक गंभीरता दोनों व्यक्त करता है।
- source_word: בָּהֶם
  choice: उन्हें
  rationale: इस क्रिया-संरचना में चेतावनी उन्हीं लोगों की ओर निर्देशित है। सहज हिन्दी में ‘उन्हें चेतावनी दे’ स्पष्ट है; ‘उनके विरुद्ध’ यहाँ अनावश्यक रूप से कठोर और अस्वाभाविक होता।
- source_word: וְהִגַּדְתָּ לָהֶם
  choice: और उन्हें ... बता
  rationale: नגד के हिफ़ील रूप का अर्थ बताना, घोषित करना या प्रकट करना है। ‘बता’ वर्तमान मानक हिन्दी में सीधा और स्वाभाविक है।
- source_word: מִשְׁפַּט הַמֶּלֶךְ
  choice: उस राजा की रीति
  rationale: מִשְׁפָּט के अर्थ-क्षेत्र में न्याय, अधिकार, निर्धारित व्यवहार और प्रचलित रीति शामिल हैं। अगले पद राजा के दावों और कामों का वर्णन करते हैं; ‘रीति’ वर्णनात्मक चेतावनी को बनाए रखती है और इन कामों को स्वतः नैतिक या दैवी वैधता नहीं देती। संदिग्ध अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֲשֶׁר יִמְלֹךְ עֲלֵיהֶם
  choice: जो उन पर राज करेगा
  rationale: מלך का क़ाल रूप राजा के रूप में शासन करने को दर्शाता है। ‘राज करेगा’ सामान्य हिन्दी में राजकीय अर्थ को स्पष्ट रूप से बनाए रखता है।
theological_decisions:
- issue: מִשְׁפַּט הַמֶּלֶךְ को राजा के वैध अधिकार के रूप में प्रस्तुत किया जाए या उसके व्यवहार/रीति के वर्णन के रूप में
  choice: मुख्य पाठ में ‘राजा की रीति’ रखा गया है, जो आगामी राजकीय व्यवहार और दावों का वर्णन करता है।
  alternative: ‘राजा का अधिकार’, ‘राजा का न्याय’ या ‘राजा का विधान’
  rationale: अगले पद बोझिल राजकीय माँगों का वर्णन करते हैं। ‘अधिकार’ या ‘न्याय’ उन्हें अनावश्यक रूप से नैतिक अथवा दैवी अनुमोदन दे सकता है। ‘रीति’ चेतावनी का स्वर और पाठ का धर्मवैचारिक तनाव बनाए रखती है, जबकि पादटिप्पणी अन्य वास्तविक अर्थ-संभावनाएँ बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण आदेशात्मक रूप अपनाया गया है। ‘उनकी बात मान’ इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है; ‘गंभीरता से चेतावनी दे’ मूल की तीव्र और औपचारिक चेतावनी को व्यक्त करता है। एकवचन अनौपचारिक आदेश-रूप निकटवर्ती प्रत्यक्ष संबोधन के अनुरूप है।
