  text: וְ/לָ/שׂ֣וּם ל֔/וֹ שָׂרֵ֥י אֲלָפִ֖ים וְ/שָׂרֵ֣י חֲמִשִּׁ֑ים וְ/לַ/חֲרֹ֤שׁ חֲרִישׁ/וֹ֙ וְ/לִ/קְצֹ֣ר קְצִיר֔/וֹ וְ/לַ/עֲשׂ֥וֹת כְּלֵֽי מִלְחַמְתּ֖/וֹ וּ/כְלֵ֥י רִכְבּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/008/012.yaml
  text: He will appoint for himself commanders of thousands and commanders of fifties[a], and some to plow his ground and reap his harvest[c][b], and to make his weapons of war and the equipment of his chariots.
translation:
  language: hi
  text: वह अपने लिए हज़ारों और पचासों के सेनापति नियुक्त करेगा[a]। वह कुछ लोगों को अपनी भूमि जोतने, अपनी फसल काटने[b], और अपने युद्ध के हथियार तथा अपने रथों का साज़-सामान बनाने[c] में लगाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “हज़ारों के सरदार और पचासों के सरदार।”
    reason: मूल इब्रानी सैन्य-दलों को संख्याओं के आधार पर संक्षेप में व्यक्त करता है।
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उसकी जुताई जोतने और उसकी कटनी काटने।” यह रचना राजा के लिए किए जाने वाले श्रम पर बल देती है।
    reason: इब्रानी की संज्ञातीय रचनाओं का अधिक शाब्दिक रूप बताना।
  - marker: c
    text: अथवा, “अपने युद्ध के उपकरण और अपने रथों के उपकरण बनाने।”
    reason: כְּלֵי का अर्थ केवल हथियार नहीं, व्यापक रूप से उपकरण या साज़-सामान भी हो सकता है।
lexical_decisions:
- source_word: וְלָשׂוּם לוֹ
  choice: वह अपने लिए ... नियुक्त करेगा
  rationale: संयोजक उपसर्ग सहित infinitive construct पिछले पद से राजा के कार्यों की सूची को आगे बढ़ाता है। पद को स्वतंत्र और स्वाभाविक हिन्दी वाक्य बनाने के लिए भविष्यकाल की स्पष्ट क्रिया रखी गई; ‘अपने लिए’ राजा के लाभ और सेवा का भाव सुरक्षित रखता है।
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי חֲמִשִּׁים
  choice: हज़ार-हज़ार सैनिकों और पचास-पचास सैनिकों पर सेनापति
  rationale: שַׂר सैन्य प्रसंग में अधिकारी या सेनापति है। संख्याएँ सैनिक-दलों के आकार को दर्शाती हैं; ‘पर सेनापति’ आधुनिक हिन्दी में पद और अधीन दल का संबंध स्पष्ट करता है।
- source_word: וְלַחֲרֹשׁ חֲרִישׁוֹ
  choice: कुछ लोगों को अपनी भूमि जोतने ... में लगाएगा
  rationale: मूल में संज्ञातीय रचना का शाब्दिक रूप ‘उसकी जुताई जोतना’ है। हिन्दी में ‘अपनी भूमि जोतने’ उसका स्वाभाविक अर्थ देता है, और ‘में लगाएगा’ पिछले पद से जारी राजकीय सेवा के संदर्भ को व्यक्त करता है।
- source_word: וְלִקְצֹר קְצִירוֹ
  choice: अपनी फसल काटने
  rationale: ‘उसकी कटनी काटना’ जैसी संज्ञातीय रचना को स्वाभाविक हिन्दी में ‘अपनी फसल काटने’ कहा गया है; राजा के लाभ के लिए कराया गया श्रम बना रहता है।
- source_word: וְלַעֲשׂוֹת כְּלֵי מִלְחַמְתּוֹ
  choice: अपने युद्ध के हथियार ... बनाने
  rationale: כְּלֵי व्यापक रूप से साधन या उपकरण कह सकता है, पर युद्ध के साथ यहाँ ‘हथियार’ प्रसंगानुकूल और सामान्य पाठक के लिए स्पष्ट है। व्यापक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וּכְלֵי רִכְבּוֹ
  choice: रथों का साज़-सामान
  rationale: רֶכֶב रथ या रथ-दल का बोध करा सकता है और כְּלֵי उससे संबंधित उपकरणों का। ‘रथों का साज़-सामान’ हिन्दी में सहज रहते हुए इस व्यापक अर्थ को सुरक्षित रखता है।
