  text: so that we too may be like all the nations[b][a], and our king may judge us and go out before us and fight our battles.
translation:
  language: hi
  text: ताकि हम भी सभी राष्ट्रों के समान हो जाएँ,[a] और हमारा राजा हमारा न्याय करे,[b] हमारे आगे-आगे निकले और हमारी लड़ाइयाँ लड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और हम भी सभी राष्ट्रों के समान हो जाएँगे।” इब्रानी रूप को भावी क्रम के रूप में अधिक शाब्दिक ढंग से भी अनूदित किया जा सकता है; यहाँ संभवतः यह राजा माँगने का उद्देश्य बताता है।
    reason: lexical_alternative
  - marker: b
    text: “हमारा न्याय करे” का व्यापक अर्थ “हम पर शासन करे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיִינוּ גַם אֲנַחְנוּ
  choice: ताकि हम भी ... हो जाएँ
  rationale: संदर्भ में यह रूप राजा माँगने के उद्देश्य या अपेक्षित परिणाम को आगे बढ़ाता है। ‘हम भी’ גַם אֲנַחְנוּ के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: כְּכָל הַגּוֹיִם
  choice: सब जातियों के समान
  rationale: यहाँ גּוֹיִם आसपास के अन्य जनसमूहों या राष्ट्रों को दर्शाता है। ‘जातियाँ’ बाइबलीय हिन्दी में इस सामूहिक अर्थ को व्यक्त करती है और बाद के तकनीकी अर्थ को अनावश्यक रूप से नहीं थोपती।
- source_word: וּשְׁפָטָנוּ
  choice: हमारा न्याय करे
  rationale: שׁפט में न्याय करने के साथ शासन या प्रशासन करने का व्यापक भाव भी हो सकता है। मुख्य पाठ में ‘न्याय करे’ पुस्तक के न्यायी-नेतृत्व से शब्दगत संबंध बनाए रखता है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: מַלְכֵּנוּ
  choice: हमारा राजा
  rationale: संबंधसूचक संज्ञा का सीधा और स्वाभाविक अनुवाद, जो लोगों द्वारा चाही गई राजकीय व्यवस्था को स्पष्ट रखता है।
- source_word: וְיָצָא לְפָנֵינוּ
  choice: हमारे आगे-आगे निकले
  rationale: इब्रानी चित्र को सुरक्षित रखते हुए पुनरुक्त ‘आगे-आगे’ सैन्य नेतृत्व और लोगों के सामने चलने का स्वाभाविक हिन्दी बोध देता है।
- source_word: וְנִלְחַם אֶת מִלְחֲמֹתֵינוּ
  choice: हमारी लड़ाइयाँ लड़े
  rationale: मूल की सजातीय रचना का हिन्दी में सहज समानांतर है और तत्कालीन सैन्य संदर्भ को स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: इस्राएल की राजतंत्र की माँग में הַגּוֹיִם का अर्थ
  choice: जातियाँ
  alternative: अन्यजातियाँ / राष्ट्र
  rationale: संदर्भ राजनीतिक और सामाजिक समानता की इच्छा पर केंद्रित है। ‘जातियाँ’ तनाव को बनाए रखता है कि इस्राएल अपने आसपास के लोगों जैसा होना चाहता था, बिना बाद की धार्मिक तकनीकी श्रेणी को आरोपित किए।
- issue: राजा के कार्य के रूप में שׁפט
  choice: न्याय करे
  alternative: शासन करे
  rationale: ‘न्याय करे’ मूल क्रिया और शमूएल की पुस्तक में न्यायी नेतृत्व की प्रतिध्वनि को बचाता है; ‘शासन करे’ का व्यापक अर्थ संभव है, इसलिए उसे पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘आगे-आगे निकले’ मूल सैन्य-नेतृत्व के चित्र को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
