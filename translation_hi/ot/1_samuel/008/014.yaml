  text: He will take your fields[a], your vineyards, and your best olive groves[b], and give them to his servants.
translation:
  language: hi
  text: वह तुम्हारे खेत, तुम्हारी दाख की बारियाँ और तुम्हारे सबसे अच्छे जैतून के बाग[a] ले लेगा और उन्हें अपने सेवकों[b] को दे देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जैतून के पेड़’ अथवा ‘जैतून की बाग़ात’; इब्रानी में आशय संभवतः कृषि-संपत्ति के रूप में लगाए गए जैतून के वृक्षों से है।
    reason: lexical_alternative
  - marker: b
    text: या ‘दासों’; इब्रानी शब्द का अर्थ प्रसंग के अनुसार सेवक या दास हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂדֹתֵיכֶם
  choice: तुम्हारे खेत
  rationale: שָׂדֶה खेती की भूमि या खेत को दर्शाता है; कृषि-संपत्तियों की इस सूची में ‘खेत’ सीधा और स्वाभाविक है।
- source_word: כַּרְמֵיכֶם
  choice: तुम्हारी दाख की बारियाँ
  rationale: כֶּרֶם का सामान्य अर्थ अंगूर की खेती वाला बाग है; ‘दाख की बारियाँ’ आधुनिक हिन्दी में स्पष्ट और प्रचलित बाइबलीय अभिव्यक्ति है।
- source_word: זֵיתֵיכֶם הַטּוֹבִים
  choice: तुम्हारे सबसे अच्छे जैतून के बाग
  rationale: זַיִת यहाँ खेतों और दाख की बारियों के समानांतर कृषि-संपत्ति के रूप में जैतून के वृक्षों के समूह या बाग को दर्शाता है। הַטּוֹבִים इस संपत्ति के उत्तम भागों की ओर संकेत करता है, इसलिए ‘सबसे अच्छे’ उपयुक्त है।
- source_word: יִקָּח
  choice: ले लेगा
  rationale: לָקַח का मूल अर्थ ‘लेना’ है। ‘ले लेगा’ प्रसंग में अधिकारपूर्वक छीन लेने का भाव आने देता है, बिना मूल क्रिया से अधिक तीखा शब्द जोड़ने के।
- source_word: וְנָתַן
  choice: और ... दे देगा
  rationale: נָתַן का सीधा अर्थ ‘देना’ है; भविष्यसूचक चेतावनी के प्रवाह में ‘दे देगा’ स्वाभाविक हिन्दी है।
- source_word: לַעֲבָדָיו
  choice: अपने सेवकों को
  rationale: עֶבֶד का अर्थ प्रसंग के अनुसार सेवक या दास हो सकता है। यहाँ राजा से जुड़े अधिकारियों या आश्रितों के लिए ‘सेवक’ अधिक स्वाभाविक है, जबकि ‘दास’ को पादटिप्पणी में विकल्प के रूप में सुरक्षित रखा गया है।
