reference: 1 Samuel 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֵ֣יךְ אֵלֵ֔ךְ וְ/שָׁמַ֥ע שָׁא֖וּל וַ/הֲרָגָ֑/נִי וַ/יֹּ֣אמֶר יְהוָ֗ה עֶגְלַ֤ת בָּקָר֙ תִּקַּ֣ח בְּ/יָדֶ֔/ךָ וְ/אָ֣מַרְתָּ֔ לִ/זְבֹּ֥חַ לַֽ/יהוָ֖ה בָּֽאתִיס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/002.yaml
  text: Samuel said[a], “How can I go? If Saul hears, he will kill me.” And Yahweh said, “Take a heifer with you and say, ‘I have come to sacrifice to Yahweh.’”
translation:
  language: hi
  text: शमूएल ने कहा, “मैं कैसे जाऊँ? अगर शाऊल ने सुन लिया, तो वह मुझे मार डालेगा।” तब याहवे ने कहा, “एक बछिया[a] अपने साथ ले जा और कहना, ‘मैं याहवे को बलि चढ़ाने आया हूँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक जवान गाय।”
    reason: עֶגְלַת בָּקָר का अधिक व्याख्यात्मक किन्तु समानार्थी अनुवाद।
lexical_decisions:
- source_word: אֵיךְ אֵלֵךְ
  choice: मैं कैसे जाऊँ?
  rationale: प्रश्न यात्रा के तरीके से अधिक उसकी व्यावहारिक सम्भावना व्यक्त करता है। यह हिन्दी में स्वाभाविक रहते हुए शमूएल की आशंका बनाए रखता है।
- source_word: וְשָׁמַע שָׁאוּל
  choice: अगर शाऊल ने सुन लिया
  rationale: यद्यपि इब्रानी में संयोजक के साथ क्रिया है, सन्दर्भ में इसका भाव शर्तसूचक है; ‘अगर’ उस निहित शर्त को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וַהֲרָגַנִי
  choice: तो वह मुझे मार डालेगा
  rationale: यह शाऊल के सुन लेने के सम्भावित और अपेक्षित परिणाम को व्यक्त करता है; ‘मार डालेगा’ खतरे की तीव्रता और भावी परिणाम दोनों को संप्रेषित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यन्तरित किया गया है।
- source_word: עֶגְלַת בָּקָר
  choice: एक बछिया
  rationale: यह पद एक जवान मादा गोवंश को सूचित करता है। ‘बछिया’ संक्षिप्त, सहज और अर्थ की दृष्टि से सटीक है।
- source_word: תִּקַּח בְּיָדֶךָ
  choice: अपने साथ ले जा
  rationale: शाब्दिक ‘अपने हाथ में ले’ इब्रानी मुहावरा है; हिन्दी में ‘अपने साथ ले जा’ उसके आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִזְבֹּחַ לַיהוָה
  choice: याहवे के लिए बलि चढ़ाने
  rationale: यह अनुष्ठानिक बलि देने की क्रिया को स्पष्ट करता है, पर मूल से अधिक विधि-विवरण नहीं जोड़ता।
- source_word: בָּאתִי
  choice: मैं ... आया हूँ
  rationale: पूर्ण क्रिया आगमन के वर्तमान परिणाम को व्यक्त करती है; हिन्दी का पूर्ण वर्तमान यहाँ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: याहवे द्वारा शमूएल को दिया गया कथन
  choice: मूल के अनुसार सीधे प्रस्तुत किया गया, बिना उसकी नैतिक या रणनीतिक व्याख्या जोड़े
  alternative: इसे बहाना, छल अथवा सम्पूर्ण उद्देश्य के कथन के रूप में व्याख्यायित करना
  rationale: पद स्वयं यह नहीं बताता कि यह कथन मिशन के पूरे उद्देश्य का वर्णन है या केवल उसके एक वास्तविक पक्ष का; अनुवाद उस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। संवाद में ‘अगर’ और ‘मार डालेगा’ स्वाभाविक बोलचाल देते हैं, जबकि ‘बलि चढ़ाने’ धार्मिक सन्दर्भ की गरिमा बनाए रखता है। पादटिप्पणी-चिह्न को अंग्रेज़ी परामर्श-पाठ की असंगत स्थिति के बजाय सम्बद्ध शब्द ‘बछिया’ के बाद रखा गया है।
