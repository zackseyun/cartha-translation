base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/020.yaml
  text: So Jesse took a donkey[a], bread, a skin of wine, and one young goat[b], and sent them by the hand of David his son to Saul.
translation:
  language: hi
  text: तब यिशै ने रोटियों से लदा एक गधा[a], दाखमधु की एक मशक और बकरी का एक बच्चा लिया और उन्हें अपने पुत्र दाऊद के हाथ शाऊल के पास भेज दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “एक गधा, रोटी”; अर्थात सम्भवतः रोटियों से लदा या उन्हें ढोता हुआ गधा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब यिशै ने ... लिया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथात्मक क्रम व्यक्त करता है।
- source_word: חֲמוֹר לֶחֶם
  choice: रोटियों से लदा एक गधा
  rationale: इब्रानी में ‘गधा’ और ‘रोटी’ साथ रखे गए हैं और उनका संबंध स्पष्ट नहीं किया गया। प्रसंग में गधा सामग्री ढोने वाला पशु है; हिन्दी में संबंध स्पष्ट करने के लिए ‘से लदा’ स्वाभाविक है, जबकि पादटिप्पणी शाब्दिक अस्पष्टता बताती है।
- source_word: נֹאד יַיִן
  choice: दाखमधु की एक मशक
  rationale: נֹאד चमड़े की तरल-पात्र मशक है। ‘दाखमधु की एक मशक’ आधुनिक पाठक के लिए स्पष्ट और ऐतिहासिक परिवेश के अनुकूल है।
- source_word: גְּדִי עִזִּים אֶחָד
  choice: बकरी का एक बच्चा
  rationale: यह पदबंध एक ही कम उम्र की बकरी को दर्शाता है; इस रूप में संख्या और आयु दोनों सुरक्षित हैं।
- source_word: וַיִּשְׁלַח
  choice: और उन्हें ... भेज दिया
  rationale: क्रिया का कर्म पूर्वोक्त भेंट-सामग्री से निहित है; हिन्दी में ‘उन्हें’ जोड़ने से वाक्य स्वाभाविक और स्पष्ट बनता है।
- source_word: בְּיַד דָּוִד בְּנוֹ
  choice: अपने पुत्र दाऊद के हाथ
  rationale: ‘के हाथ’ इब्रानी अभिकरण/सुपुर्दगी के मुहावरे को सुरक्षित रखता है और हिन्दी में भी समझने योग्य है।
- source_word: אֶל שָׁאוּל
  choice: शाऊल के पास
  rationale: गंतव्य व्यक्त करने के लिए आधुनिक हिन्दी में ‘के पास’ स्वाभाविक है।
