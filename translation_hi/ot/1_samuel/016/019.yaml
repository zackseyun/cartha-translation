source:
  edition: WLC
  text: וַ/יִּשְׁלַ֥ח שָׁא֛וּל מַלְאָכִ֖ים אֶל יִשָׁ֑י וַ/יֹּ֕אמֶר שִׁלְחָ֥/ה אֵלַ֛/י אֶת דָּוִ֥ד בִּנְ/ךָ֖ אֲשֶׁ֥ר בַּ/צֹּֽאן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/019.yaml
  text: So Saul sent messengers to Jesse and said[a], “Send me your son David, who is with the flock.”
translation:
  language: hi
  text: तब शाऊल ने यिशै के पास दूत भेजकर कहा, “अपने बेटे दाऊद को, जो भेड़-बकरियों के साथ है[a], मेरे पास भेज दे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो भेड़-बकरियों के झुंड के बीच है।”
    reason: इब्रानी בַּצֹּאן का स्थानगत संबंध ‘झुंड के साथ’ अथवा ‘झुंड के बीच’ समझा जा सकता है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजे
  rationale: कथात्मक wayyiqtol यहाँ भूतकाल की सीधी क्रिया बताता है; संयुक्त अभिव्यक्ति ‘दूत भेजकर कहा’ स्वाभाविक हिन्दी क्रम देती है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: मानवीय संदेशवाहकों के लिए ‘दूत’ स्पष्ट और गरिमापूर्ण है; यहाँ स्वर्गदूत का अर्थ नहीं है।
- source_word: אֶל יִשָׁי
  choice: यिशै के पास
  rationale: अभिमुखता बताने वाले אֶל का स्वाभाविक हिन्दी रूप है और संदेश भेजने के प्रसंग में उपयुक्त है।
- source_word: וַיֹּאמֶר
  choice: कहा
  rationale: אמר प्रत्यक्ष कथन का परिचय देता है; ‘कहा’ स्रोत की संरचना सुरक्षित रखता है।
- source_word: שִׁלְחָה אֵלַי
  choice: मेरे पास भेज दे
  rationale: आज्ञार्थक रूप और אֵלַי की दिशा दोनों को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶת דָּוִד בִּנְךָ
  choice: अपने बेटे दाऊद को
  rationale: בִּנְךָ यिशै से दाऊद का संबंध बताता है; ‘अपने बेटे’ हिन्दी में संबोधित व्यक्ति के संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשֶׁר בַּצֹּאן
  choice: जो भेड़-बकरियों के साथ है
  rationale: צֹאן छोटे पालतू पशुओं के झुंड, सामान्यतः भेड़-बकरियों, को सूचित करता है। בְּ का स्थानगत अर्थ ‘के साथ’ से व्यक्त होता है, जबकि ‘के बीच’ भी संभव है और पाद-टिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, कथात्मक और गरिमापूर्ण शैली रखी गई है। ‘भेड़-बकरियाँ’ צֹאן की व्यापकता को केवल ‘भेड़ें’ की अपेक्षा बेहतर व्यक्त करता है; आज्ञा के लिए ‘भेज दे’ प्रसंगानुकूल सीधा है, पर असभ्य नहीं।
