base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/014.yaml
  text: The Spirit of Yahweh had departed from Saul[a], and an evil spirit from Yahweh terrified him.
translation:
  language: hi
  text: यहोवा का आत्मा शाऊल से हट गया था, और यहोवा की ओर से एक दुष्ट आत्मा[a] उसे आतंकित करती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हानिकारक आत्मा” अथवा “कष्टदायक आत्मा।” इब्रानी विशेषण का अर्थ “दुष्ट” के साथ-साथ “हानिकारक” या “विपत्तिकारी” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרוּחַ יְהוָה
  choice: यहोवा का आत्मा
  rationale: רוּחַ यहाँ शाऊल को सामर्थ्य देने वाली परमेश्वर की उपस्थिति को दर्शाता है, इसलिए ‘आत्मा’ स्वाभाविक है। יְהוָה को उसके नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: סָרָה מֵעִם
  choice: पर से हट गया था
  rationale: סוּר का अर्थ हटना या अलग हो जाना है; מֵעִם के साथ यह शाऊल के साथ से उस उपस्थिति के हट जाने को व्यक्त करता है। पूर्वकालिक संदर्भ को ‘गया था’ से स्वाभाविक हिन्दी में रखा गया है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וּבִעֲתַתּוּ
  choice: उसे आतंकित करने लगी
  rationale: בעת तीव्र भय या दहशत उत्पन्न करने को दर्शाता है। ‘आतंकित करने लगी’ इस भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּחַ רָעָה
  choice: एक दुष्ट आत्मा
  rationale: רָעָה का सीधा अर्थ ‘दुष्ट’ हो सकता है, पर यह हानिकारक या संकटकारी प्रभाव भी बता सकता है; मुख्य पाठ में सीधा अर्थ रखा गया और अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: מֵאֵת יְהוָה
  choice: यहोवा की ओर से आई
  rationale: מֵאֵת स्रोत या उद्गम बताता है। ‘की ओर से आई’ स्रोत को स्पष्ट करता है, पर ‘यहोवा ने भेजी’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
theological_decisions:
- issue: कष्ट देने वाली आत्मा का यहोवा से आना
  choice: यहोवा की ओर से आई एक दुष्ट आत्मा
  alternative: यहोवा की ओर से आई एक हानिकारक अथवा कष्ट देने वाली आत्मा
  rationale: इब्रानी पाठ आत्मा के स्रोत को स्पष्ट रूप से यहोवा से जोड़ता है। अनुवाद इस धर्मवैज्ञानिक तनाव को नरम या समाप्त नहीं करता। साथ ही רָעָה के नैतिक और हानिकारक—दोनों संभावित अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आतंकित करने लगी’ तीव्र भय का अर्थ बनाए रखता है। पादटिप्पणी-चिह्न को ‘दुष्ट आत्मा’ के बाद रखा गया है, क्योंकि टिप्पणी उसी पदबंध के अर्थ से संबंधित है।
