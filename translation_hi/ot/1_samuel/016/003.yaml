  text: Invite Jesse to the sacrifice[a], and I will make known to you what you shall do[c][b]; and you shall anoint for me the one whom I tell you.
translation:
  language: hi
  text: और यिशै को बलिदान के लिए बुलाना[a]। मैं तुम्हें बताऊँगा कि तुम्हें क्या करना है[b]; फिर जिसे मैं तुम्हें बताऊँ, उसका मेरे लिए अभिषेक करना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यिशै को बलिदान में बुलाना।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैं तुम्हें ज्ञात कराऊँगा कि तुम क्या करोगे।”
    reason: literal_rendering
  - marker: c
    text: या, “और जिस व्यक्ति के बारे में मैं तुमसे कहूँ, उसका मेरे लिए अभिषेक करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְקָרָאתָ לְיִשַׁי בַּזָּבַח
  choice: और यिशै को बलिदान में बुलाना
  rationale: कרא का अर्थ यहाँ किसी को बलिदान के अवसर में सम्मिलित होने के लिए बुलाना है। हिंदी में ‘बलिदान में बुलाना’ आमंत्रण और निर्देश—दोनों भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאָנֹכִי אוֹדִיעֲךָ
  choice: मैं तुम्हें बताऊँगा
  rationale: ידע के हिफ़ील रूप का अर्थ ‘ज्ञात कराना’ है; आधुनिक सहज हिंदी में ‘बताऊँगा’ वही आशय स्पष्टता से देता है। स्वतंत्र सर्वनाम אָנֹכִי के कारण कर्ता ‘मैं’ स्पष्ट रखा गया है।
- source_word: אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: कि तुम्हें क्या करना है
  rationale: यह भावी निर्देश को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है, बिना अनावश्यक रूप से बाध्यता की तीव्रता बढ़ाए।
- source_word: וּמָשַׁחְתָּ לִי
  choice: उसका मेरे लिए अभिषेक करना
  rationale: משׁח के धार्मिक और राजकीय संस्कार-संबंधी अर्थ को ‘अभिषेक करना’ सुरक्षित रखता है। לִי को ‘मेरे लिए’ कहना दर्शाता है कि कार्य परमेश्वर की ओर से और उसके उद्देश्य के लिए किया जाना है।
- source_word: אֵת אֲשֶׁר אֹמַר אֵלֶיךָ
  choice: जिसका नाम मैं तुमसे कहूँ
  rationale: शाब्दिक रूप से वाक्यांश ‘जिसे मैं तुमसे कहूँ’ है, पर हिंदी में व्यक्ति की पहचान बताए जाने का भाव ‘जिसका नाम ... कहूँ’ से स्पष्ट और स्वाभाविक होता है; इसे विकल्प-सूचक पादटिप्पणी में भी स्पष्ट किया गया है।
theological_decisions:
- issue: अभिषेक का स्वरूप
  choice: केवल ‘अभिषेक’ कहा गया है; पद में राजपद स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘राजा के रूप में अभिषेक करना’
  rationale: संदर्भ राजकीय अभिषेक की ओर संकेत करता है, पर इस पद के हिब्रू पाठ में पद या कार्यालय का नाम नहीं है; इसलिए कथानक को स्वयं यह बात प्रकट करने दी गई है।
- issue: אֲשֶׁר אֹמַר אֵלֶיךָ में पहचाने जाने वाले व्यक्ति की अभिव्यक्ति
  choice: ‘जिसका नाम मैं तुमसे कहूँ’
  alternative: ‘जिसे मैं तुमसे कहूँ’ या ‘जिसकी ओर मैं संकेत करूँ’
  rationale: मूल में व्यक्ति का उल्लेख सापेक्ष वाक्य द्वारा है और אמר सामान्यतः ‘कहना’ है। मुख्य पाठ सहज हिंदी देता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिंदी में परमेश्वर द्वारा शमूएल को दिए गए निर्देश के लिए स्वाभाविक ‘करना’ शैली अपनाई गई है। भाषा सरल पर गरिमापूर्ण है। ‘यिशै’ हिब्रू नाम יִשַׁי का स्रोत-सापेक्ष देवनागरी लिप्यंतरण है।
