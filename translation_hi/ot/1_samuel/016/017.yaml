    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עֶבֶד का मूल अर्थ ‘सेवक’ है। राजदरबार के संदर्भ में ये परिचारक भी हो सकते हैं, पर ‘सेवक’ स्रोत के अधिक निकट और सहज है।
- source_word: רְאוּ נָא
  choice: कृपया ... ढूँढ़ो
  rationale: ראה का बहुवचन आज्ञार्थक रूप נָא के साथ यहाँ विनम्र अनुरोध के रूप में किसी योग्य व्यक्ति को खोजने का भाव देता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यह संबंधवाचक पूर्वसर्ग शाऊल के हित या उपयोग का संकेत देता है।
- source_word: אִישׁ
  choice: एक ऐसा आदमी
  rationale: हिब्रू में संज्ञा एकवचन पुल्लिंग है; ‘आदमी’ इस विशिष्टता को बनाए रखता है। ‘ऐसा’ आगे आने वाली योग्यता से इसे स्वाभाविक हिन्दी में जोड़ता है।
- source_word: מֵיטִיב לְנַגֵּן
  choice: जो कुशलता से वाद्य बजाता हो
  rationale: शाब्दिक भाव ‘बजाने में अच्छा करने वाला’ है। נגן संगीत या वाद्य बजाने को सूचित करता है; ‘वाद्य’ जोड़ने से हिन्दी में आशय स्पष्ट होता है, जबकि किसी खास वाद्य का नाम नहीं जोड़ा गया।
- source_word: וַהֲבִיאוֹתֶם אֵלָי
  choice: और उसे मेरे पास ले आओ
  rationale: यह सेवकों को दिया गया बहुवचन आदेश है; एकवचन कर्म उस पहले बताए आदमी को संदर्भित करता है।
