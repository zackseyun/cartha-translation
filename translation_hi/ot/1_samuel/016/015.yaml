base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/015.yaml
  text: And Saul’s servants said to him[a], “Look now, an evil spirit from God is terrifying you.”
translation:
  language: hi
  text: तब शाऊल के सेवकों ने उससे कहा, “देखिए, परमेश्वर की ओर से एक दुष्ट आत्मा[a] आपको भयभीत कर रही है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की ओर से एक हानिकारक आत्मा” अथवा “परमेश्वर की ओर से एक कष्ट देने वाली आत्मा।” इब्रानी विशेषण आत्मा को दुष्ट बता सकता है या उसे हानि अथवा कष्ट पहुँचाने वाली।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” स्वाभाविक रूप से घटनाक्रम का संकेत देता है।
- source_word: עַבְדֵי שָׁאוּל
  choice: शाऊल के सेवकों
  rationale: राजदरबार के संदर्भ में עֶבֶד के लिए “सेवक” स्वाभाविक और गरिमापूर्ण है।
- source_word: אֵלָיו
  choice: उससे
  rationale: कहने की क्रिया के साथ हिन्दी में “उससे कहा” सहज रूप है।
- source_word: הִנֵּה נָא
  choice: देखिए
  rationale: यह ध्यान खींचने और तात्कालिकता जताने वाले पद-युग्म का आधुनिक, आदरसूचक हिन्दी रूप है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर की ओर से एक ... आत्मा
  rationale: संदर्भ में यह वाक्यांश आत्मा का स्रोत अथवा प्रेषण परमेश्वर से जोड़ता है; “की ओर से” उसे परमेश्वर के अपने आत्मा के समान ठहराए बिना यह संबंध बनाए रखता है।
- source_word: רָעָה
  choice: दुष्ट
  rationale: רָעָה का सीधा अर्थ “दुष्ट/बुरी” हो सकता है, पर यह हानिकारक या कष्ट देने वाली भी सूचित कर सकता है; यह विकल्प पादटिप्पणी में रखा गया है।
- source_word: מְבַעִתֶּךָ
  choice: आपको आतंकित कर रही है
  rationale: कृदन्त चल रही क्रिया व्यक्त करता है और धातु तीव्र भय या आतंक उत्पन्न करने का भाव रखती है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה में परमेश्वर और दुष्ट आत्मा के संबंध को कैसे व्यक्त किया जाए
  choice: परमेश्वर की ओर से एक दुष्ट आत्मा
  alternative: परमेश्वर की ओर से एक हानिकारक/कष्ट देने वाली आत्मा
  rationale: इब्रानी पाठ आत्मा को किसी अर्थ में परमेश्वर से संबद्ध करता है; “की ओर से” उस तनाव को बनाए रखता है, पर उसे परमेश्वर का अपना आत्मा घोषित नहीं करता। רָעָה की नैतिक और हानिकारक दोनों संभावनाएँ पादटिप्पणी द्वारा सुरक्षित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी; सेवक राजा शाऊल को संबोधित कर रहे हैं, इसलिए “देखिए” और “आपको” जैसे आदरसूचक रूप प्रयुक्त हुए हैं। भाषा सहज किंतु गरिमापूर्ण रखी गई है।
