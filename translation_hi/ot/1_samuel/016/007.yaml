source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל אַל תַּבֵּ֧ט אֶל מַרְאֵ֛/הוּ וְ/אֶל גְּבֹ֥הַּ קוֹמָת֖/וֹ כִּ֣י מְאַסְתִּ֑י/הוּ כִּ֣י לֹ֗א אֲשֶׁ֤ר יִרְאֶה֙ הָ/אָדָ֔ם כִּ֤י הָֽ/אָדָם֙ יִרְאֶ֣ה לַ/עֵינַ֔יִם וַ/יהוָ֖ה יִרְאֶ֥ה לַ/לֵּבָֽב־־־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/007.yaml
  text: But Yahweh said to Samuel[a], “Do not look at his appearance or at the height of his stature, because I have rejected him. For not as man sees does God see, for man sees what is before the eyes[c][b], but Yahweh sees the heart.”
translation:
  language: hi
  text: 'परन्तु याहवे ने शमूएल से कहा, “उसके रूप पर ध्यान मत दे और न उसके ऊँचे कद पर, क्योंकि मैंने उसे अस्वीकार कर दिया है। क्योंकि याहवे वैसा नहीं देखता जैसा मनुष्य देखता है[a]: मनुष्य आँखों के सामने जो है उसे देखता है[b], परन्तु याहवे हृदय को देखता है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश संक्षिप्त है; शाब्दिक रूप से, “क्योंकि वह नहीं जो मनुष्य देखता है।” संदर्भ में अर्थ है कि याहवे मनुष्य के समान नहीं देखता।
    reason: मूल की लुप्तपदीय रचना और संदर्भ से आवश्यक स्पष्ट विस्तार बताना।
  - marker: b
    text: “मनुष्य” यहाँ जातिवाचक है, अर्थात सामान्य रूप से सभी मनुष्य।
    reason: यह स्पष्ट करना कि एकवचन शब्द सभी मनुष्यों को सूचित करता है।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका स्थान नहीं लिया गया।
- source_word: תַּבֵּט
  choice: ध्यान दे
  rationale: यहाँ क्रिया का आशय बाहरी विशेषताओं को देखकर उन्हीं पर ध्यान केंद्रित करना है; निषेध के साथ यह स्वाभाविक हिन्दी है।
- source_word: מַרְאֵהוּ
  choice: उसके रूप
  rationale: यह दृश्य रूप-रंग या बाहरी स्वरूप को व्यक्त करता है और अगले शारीरिक गुण, कद, के साथ सहज बैठता है।
- source_word: גְּבֹהַּ קוֹמָתוֹ
  choice: उसके ऊँचे कद
  rationale: मूल पदबंध शारीरिक लंबाई पर बल देता है; यह स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: מְאַסְתִּיהוּ
  choice: मैंने उसे अस्वीकार कर दिया है
  rationale: चयन के प्रसंग में מאס का अर्थ अनुपयुक्त ठहराकर अस्वीकार करना है, न कि केवल घृणा करना।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: एकवचन यहाँ जातिवाचक है और सामान्य मानवीय दृष्टि को दर्शाता है।
- source_word: לֹא אֲשֶׁר יִרְאֶה הָאָדָם
  choice: बात वैसी नहीं है जैसी मनुष्य देखता है
  rationale: इब्रानी वाक्यांश संक्षिप्त और कुछ लुप्तपदीय है; यह अनुवाद उसकी अस्पष्ट संरचना को पूरी तरह किसी एक स्पष्ट विस्तार में नहीं बाँधता, फिर भी हिन्दी में अर्थगम्य रहता है।
- source_word: לַעֵינַיִם
  choice: आँखों के सामने की वस्तु
  rationale: शाब्दिक नेत्र-चित्र को बनाए रखता है और केवल व्याख्यात्मक ‘बाहरी रूप’ तक अर्थ को सीमित नहीं करता।
- source_word: לַלֵּבָב
  choice: हृदय
  rationale: यह मनुष्य के भीतरी विचार, इच्छा और स्वभाव के केंद्र को सूचित करता है; ‘हृदय’ स्रोत की प्रमुख उपमा को सुरक्षित रखता है।
theological_decisions:
- issue: मानवीय और याहवे की दृष्टि के बीच तुलना
  choice: बात वैसी नहीं है जैसी मनुष्य देखता है … मनुष्य आँखों के सामने की वस्तु देखता है, परन्तु याहवे हृदय को देखता है
  alternative: याहवे वैसा नहीं देखता जैसा मनुष्य देखता है
  rationale: मूल का पहला तुलना-वाक्य लुप्तपदीय है और उसमें याहवे को स्पष्ट कर्ता के रूप में दोबारा नहीं लिखा गया। चुना हुआ रूप उस तनाव को बनाए रखता है, जबकि अगली दो धाराएँ विरोध को स्पष्ट कर देती हैं।
- issue: אָדָם का जातिवाचक अर्थ
  choice: मनुष्य
  alternative: लोग / मानवजाति
  rationale: एकवचन जातिवाचक रूप को रखा गया है; इसका आशय सभी मनुष्यों से है, केवल पुरुषों से नहीं।
- issue: ईश्वरीय नाम का प्रस्तुतीकरण
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम को हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य पाठक के लिए सुबोध रूप। ‘न तो…न…’, ‘ऊँचा कद’ और ‘ध्यान दे’ स्वाभाविक हिन्दी देते हैं; ‘आँखों के सामने’ तथा ‘हृदय’ मूल की ठोस उपमाएँ सुरक्षित रखते हैं।
