base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/005.yaml
  text: He said[a], “Peace. I have come to sacrifice to Yahweh. Consecrate yourselves, and come with me to the sacrifice.” And he consecrated Jesse and his sons and invited them to the sacrifice.
translation:
  language: hi
  text: उसने कहा, “शांति है।[a] मैं यहोवा के लिए बलिदान चढ़ाने आया हूँ। अपने आप को पवित्र करो और मेरे साथ बलिदान के लिए आओ।” फिर उसने यिशै और उसके पुत्रों को पवित्र किया और उन्हें बलिदान के लिए बुलाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सब कुशल है” अथवा “मैं शांति से आया हूँ।” इब्रानी में केवल “शांति” है, जो आश्वासन देता है कि शमूएल का आना शत्रुतापूर्ण नहीं था।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁלוֹם
  choice: शांति है
  rationale: पिछले पद में पूछे गए प्रश्न के उत्तर में यह अकेला संज्ञा-पद शमूएल के शांतिपूर्ण उद्देश्य का आश्वासन देता है। ‘शांति है’ इब्रानी की संक्षिप्तता और अर्थ-व्याप्ति को बनाए रखता है।
- source_word: לִזְבֹּחַ לַיהוָה
  choice: यहोवा के लिए बलिदान चढ़ाने
  rationale: लामेद सहित क्रिया का infinitive शमूएल के आने का उद्देश्य बताता है। ‘बलिदान चढ़ाना’ आधुनिक हिन्दी में स्वाभाविक धार्मिक अभिव्यक्ति है।
- source_word: הִתְקַדְּשׁוּ
  choice: अपने आप को पवित्र करो
  rationale: हित्पाएल रूप बलिदान में भाग लेने से पहले धार्मिक रीति से स्वयं को तैयार और अलग करने का संकेत देता है; यह केवल शारीरिक शुद्धि तक सीमित नहीं है।
- source_word: וּבָאתֶם אִתִּי בַּזָּבַח
  choice: मेरे साथ बलिदान में आओ
  rationale: वाक्यक्रम यहाँ निर्देश अथवा निमंत्रण का भाव रखता है। यह अनुवाद בוא की आने की दिशा और निश्चित बलिदानी अवसर दोनों को सुरक्षित रखता है।
- source_word: וַיְקַדֵּשׁ
  choice: उसने ... पवित्र किया
  rationale: पिएल रूप बताता है कि शमूएल ने यिशै और उसके पुत्रों को बलिदानी अवसर के लिए धार्मिक रीति से तैयार अथवा अलग किया।
- source_word: וַיִּקְרָא לָהֶם לַזָּבַח
  choice: उन्हें बलिदान में बुलाया
  rationale: קרא + ל बुलाने या आमंत्रित करने का अर्थ दे सकता है। ‘बुलाया’ मूल की व्यापकता और संभावित औपचारिकता को बनाए रखता है।
- source_word: יִשַׁי
  choice: यिशै
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में निकट और प्रचलित लिप्यंतरण।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: मूल स्पष्ट रूप से पुरुष संतानों का उल्लेख करता है, जो इस कथा में महत्वपूर्ण है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय वाचा-नाम सीधे आया है। हिन्दी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदलने के बजाय व्यक्तिगत ईश्वरीय नाम के रूप में रखता है।
- issue: קדשׁ का धार्मिक अर्थ
  choice: पवित्र करो / पवित्र किया
  alternative: शुद्ध करो / शुद्ध किया
  rationale: यहाँ शब्द बलिदानी भागीदारी की तैयारी और पवित्र प्रयोजन के लिए अलग किए जाने को दर्शाता है; ‘शुद्ध’ कहने से अर्थ केवल शोधन तक संकुचित हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और धार्मिक प्रसंग के अनुरूप भाषा रखी गई है। ‘पवित्र करो’ सामान्य पाठक के लिए ‘अभिषिक्त/संस्कारित करो’ से अधिक स्पष्ट है, जबकि पादटिप्पणी שָׁלוֹם की वास्तविक संक्षिप्तता और विकल्पों को सुरक्षित रखती है।
