base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/008.yaml
  text: Then Jesse called Abinadab and made him pass before Samuel. And he said[a], “Yahweh has not chosen this one either.”
translation:
  language: hi
  text: तब यिशै ने अबीनादाब को बुलाया और उसे शमूएल के सामने से गुज़रवाया। और शमूएल ने कहा, “याहवे ने इसे भी नहीं चुना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא יִשַׁי אֶל אֲבִינָדָב
  choice: तब यिशै ने अबीनादाब को बुलाया
  rationale: קרא का अर्थ यहाँ किसी को बुलाना है। हिन्दी में ‘को बुलाया’ स्वाभाविक है और אֶל को शब्दशः दोहराए बिना उसका संबंध स्पष्ट करता है।
- source_word: וַיַּעֲבִרֵהוּ לִפְנֵי שְׁמוּאֵל
  choice: उसे शमूएल के सामने से गुज़ारा
  rationale: 'עבר का हिफ़ील रूप सकर्मक-कारक अर्थ देता है: यिशै ने अबीनादाब को शमूएल के सामने से गुज़रवाया। ‘गुज़ारा’ इस कारणवाचक भाव को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।'
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: इब्रानी में कर्ता केवल पुल्लिंग एकवचन क्रियारूप में निहित है; नाम स्पष्ट रूप से नहीं दिया गया। ‘उसने’ मूल की इस अभिव्यक्ति को बनाए रखता है।
- source_word: גַּם בָּזֶה
  choice: इसे भी
  rationale: नकारात्मक वाक्य में גַּם का योगात्मक अर्थ हिन्दी के ‘भी’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לֹא בָחַר
  choice: नहीं चुना है
  rationale: पूर्ण क्रिया यहाँ चयन के वर्तमान परिणाम को व्यक्त करती है; हिन्दी का पूर्ण वर्तमान ‘नहीं चुना है’ इस प्रसंग में उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण के रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है, इसलिए उपाधि ‘प्रभु’ से उसका स्थानापन्न नहीं किया गया। ‘याहवे’ उपलब्ध भाषावैज्ञानिक प्रमाण के निकट आधुनिक लिप्यंतरण है।
- issue: וַיֹּאמֶר के अनुल्लिखित कर्ता की पहचान
  choice: उसने
  alternative: शमूएल ने
  rationale: संदर्भ से वक्ता शमूएल समझ में आता है, पर इब्रानी वाक्य में उसका नाम नहीं दोहराया गया। मुख्य पाठ में सर्वनाम रखने से मूल की संक्षिप्तता और सीमित अस्पष्टता सुरक्षित रहती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सामने से गुज़ारा’ मूल के कारणवाचक कथन को बनाए रखता है, जबकि ‘इसे भी नहीं चुना है’ हिन्दी में योगात्मक नकार को स्वाभाविक ढंग से व्यक्त करता है।
