id: 1SA.16.10
reference: 1 Samuel 16:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּעֲבֵ֥ר יִשַׁ֛י שִׁבְעַ֥ת בָּנָ֖י/ו לִ/פְנֵ֣י שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ אֶל יִשַׁ֔י לֹא בָחַ֥ר יְהוָ֖ה בָּ/אֵֽלֶּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/010.yaml
  text: So Jesse had seven of his sons pass before Samuel, and Samuel said to Jesse, “Yahweh has not chosen any of these.”
translation:
  language: hi
  text: इस प्रकार यिशै ने अपने सात बेटों को शमूएल के सामने से गुज़ारा। तब शमूएल ने यिशै से कहा, “याहवे ने इनमें से किसी को नहीं चुना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: सामने से गुज़ारा
  rationale: 'हिफ़ील रूप का कारक अर्थ सुरक्षित है: यिशै ने अपने बेटों को एक-एक करके शमूएल के सामने से गुज़रवाया। हिंदी में ‘गुज़ारा’ इसे स्वाभाविक और संक्षिप्त ढंग से व्यक्त करता है।'
- source_word: שִׁבְעַת בָּנָיו
  choice: अपने सात बेटों को
  rationale: इब्रानी रचना का सीधा अर्थ यिशै के सात बेटों से है। प्रसंग में यह दाऊद को सम्मिलित किए बिना प्रस्तुत किए गए सात पुत्रों को दर्शाता है।
- source_word: לִפְנֵי
  choice: के सामने से
  rationale: यहाँ स्थान और प्रस्तुति—दोनों का भाव है; ‘के सामने से’ बेटों के क्रमशः शमूएल के सामने आने को स्पष्ट करता है।
- source_word: לֹא בָחַר
  choice: नहीं चुना है
  rationale: בחר का मूल अर्थ ‘चुनना’ है। पूर्ण पक्ष को हिंदी का वर्तमान पूर्ण ‘नहीं चुना है’ अभी-अभी प्रस्तुत उम्मीदवारों पर शमूएल के निष्कर्ष के रूप में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में सीधे लिप्यंतरित किया गया है।
- source_word: בָּאֵלֶּה
  choice: इनमें से किसी को
  rationale: בְּ के साथ संकेतवाचक पद का प्रसंगगत अर्थ प्रस्तुत समूह में से किसी व्यक्ति को चुनने का है; निषेध के साथ ‘इनमें से किसी को नहीं’ स्वाभाविक हिंदी में वही अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘बेटों’ सामान्य पाठक के लिए सहज है, और ‘इस प्रकार… तब’ घटनाक्रम तथा निष्कर्ष के संबंध को स्पष्ट रखता है।
