base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/023.yaml
  text: And whenever the spirit of God came upon Saul[a], David would take the lyre and play it with his hand; then Saul found relief, and it was well with him[c][b], and the harmful spirit departed from him.
translation:
  language: hi
  text: जब कभी परमेश्वर का आत्मा शाऊल पर आता था, तब दाऊद लाइर[a] लेकर अपने हाथ से उसे बजाता था। इससे शाऊल को राहत मिलती और उसकी दशा सुधर जाती; तब हानिकारक आत्मा[b] उसके ऊपर से हट जाता था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वीणा।” इब्रानी किन्नोर एक प्राचीन तार-वाद्य था, जो आधुनिक भारतीय वीणा के ठीक समान नहीं था; सम्भवतः वह लाइर जैसा था।
    reason: lexical_alternative
  - marker: b
    text: या, “दुष्ट आत्मा।” यहाँ प्रयुक्त इब्रानी शब्द का अर्थ नैतिक रूप से “बुरा” अथवा प्रभाव में “हानिकारक, कष्टदायक”—दोनों हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: पहले खंड में इब्रानी पाठ “परमेश्वर का आत्मा” कहता है, जबकि अंतिम खंड में “हानिकारक आत्मा।” अनुवाद ने दोनों अभिव्यक्तियों को एक जैसा बनाकर उनके बीच का अंतर मिटाया नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה בִּהְיוֹת
  choice: जब कभी ... आता था
  rationale: यह रचना बार-बार होने वाली परिस्थिति बताती है। ‘जब कभी’ और अपूर्ण भूतकाल का प्रयोग इस आवर्ती भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: इब्रानी में यहाँ सीधे ‘परमेश्वर का आत्मा’ है; पहले खंड में ‘हानिकारक’ या ‘दुष्ट’ जोड़ना निकटवर्ती संदर्भ से व्याख्या आयात करना होगा।
- source_word: אֶל שָׁאוּל
  choice: शाऊल पर आता था
  rationale: इस प्रसंग में אֶל आत्मा के शाऊल को प्रभावित करने के लिए उस पर आने का भाव देता है।
- source_word: הַכִּנּוֹר
  choice: वीणा
  rationale: כִּנּוֹר प्राचीन तार-वाद्य था। सामान्य हिन्दी पाठक के लिए ‘वीणा’ संक्षिप्त और परिचित है, जबकि पादटिप्पणी आधुनिक भारतीय वीणा से इसकी पूर्ण समानता मानने से रोकती है।
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: अपने हाथ से उसे बजाता था
  rationale: נגן तार-वाद्य बजाने को दर्शाता है। ‘उसे’ पूर्वोक्त वाद्य से स्वाभाविक रूप से पूरा किया गया है और ‘अपने हाथ से’ इब्रानी अभिव्यक्ति को बनाए रखता है।
- source_word: וְרָוַח לְשָׁאוּל
  choice: शाऊल को राहत मिलती
  rationale: रूप का अर्थ राहत या चैन मिलना है; यह अनावश्यक चिकित्सीय व्याख्या किए बिना शाऊल के अनुभव को व्यक्त करता है।
- source_word: וְטוֹב לוֹ
  choice: उसकी दशा सुधर जाती
  rationale: शाब्दिक ‘उसके लिए अच्छा होता’ हिन्दी में अस्वाभाविक है। चुना हुआ रूप उसके बेहतर होने की दशा बताता है, पर किसी विशेष शारीरिक या मानसिक निदान का दावा नहीं करता।
- source_word: רוּחַ הָרָעָה
  choice: हानि पहुँचाने वाला आत्मा
  rationale: רָעָה नैतिक बुराई के साथ-साथ हानिकारक या कष्टदायक प्रभाव भी बता सकता है। प्रसंग में यह अनुवाद प्रभाव पर जोर देता है और आत्मा के नैतिक स्वरूप को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: וְסָרָה מֵעָלָיו
  choice: उसके ऊपर से हट जाता था
  rationale: यह मूल के מֵעָלָיו, ‘उसके ऊपर से’, और סור के हटने या चले जाने के भाव दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: पहले खंड के רוּחַ אֱלֹהִים और अंतिम खंड के רוּחַ הָרָעָה के संबंध को कैसे प्रस्तुत किया जाए
  choice: पहले को ‘परमेश्वर का आत्मा’ और बाद वाले को ‘हानि पहुँचाने वाला आत्मा’ कहा गया है।
  alternative: पहले को संदर्भ के आधार पर ‘परमेश्वर की ओर से आया हानि पहुँचाने वाला आत्मा’ कहना, अथवा बाद वाले को ‘दुष्ट आत्मा’ कहना।
  rationale: इब्रानी पाठ दोनों स्थानों पर अलग अभिव्यक्तियाँ प्रयोग करता है। उन्हें अलग रखते हुए अनुवाद करना पाठ की वास्तविक अस्पष्टता और धार्मिक तनाव को सुरक्षित रखता है, और पहले खंड में निकटवर्ती पदों की भाषा नहीं मिलाता।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। आवर्ती क्रिया के लिए ‘जब कभी’ और ‘था’ का प्रयोग किया गया है। ‘वीणा’ पाठ में पठनीयता बनाए रखती है, जबकि पादटिप्पणी प्राचीन वाद्य की ऐतिहासिक भिन्नता स्पष्ट करती है।
