translation:
  language: hi
  text: 'तब शाऊल ने यिशै के पास यह संदेश भेजा: “कृपया दाऊद को मेरे सामने खड़ा रहने दो,[a] क्योंकि वह मुझे भा गया है।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “दाऊद को मेरे सामने बना रहने दो।” राजदरबार के प्रसंग में इसका अर्थ शाऊल की उपस्थिति में उसकी सेवा करते रहना हो सकता है।
    reason: इब्रानी ‘मेरे सामने खड़ा रहे’ की शाब्दिक दरबारी छवि को रखते हुए ‘बना रहे’ के प्रसंगगत विकल्प को सुरक्षित करता है।
lexical_decisions:
- source_word: וַיִּשְׁלַח שָׁאוּל אֶל יִשַׁי לֵאמֹר
  choice: तब शाऊल ने यिशै के पास यह संदेश भेजा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है, इसलिए ‘तब’ स्वाभाविक है। हिन्दी में ‘कहते हुए भेजा’ की अपेक्षा ‘यह संदेश भेजा’ उद्धरण का अधिक सहज परिचय देता है।
- source_word: יַעֲמָד נָא דָוִד לְפָנַי
  choice: कृपया दाऊद को मेरी सेवा में रहने दो
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर राजदरबार के इस प्रसंग में לפני ‘मेरे सामने’ के साथ इसका आशय राजा की उपस्थिति में सेवक के रूप में बने रहना है। ‘कृपया’ נָא के विनम्र अनुरोध को व्यक्त करता है।
- source_word: כִּי מָצָא חֵן בְּעֵינָי
  choice: क्योंकि वह मेरी दृष्टि में अनुग्रह पा चुका है
  rationale: מצא חן בעיני स्वीकृति या कृपापात्र होने का प्रचलित इब्रानी मुहावरा है। ‘मेरी दृष्टि में अनुग्रह पाना’ मूल बिंब और दरबारी भाव दोनों को बनाए रखता है।
- source_word: דָוִד / שָׁאוּל / יִשַׁי
  choice: दाऊद / शाऊल / यिशै
  rationale: नामों को मानक हिन्दी बाइबलीय लिप्यंतरण में प्रस्तुत किया गया है।
