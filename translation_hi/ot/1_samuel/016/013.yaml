  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת קֶ֣רֶן הַ/שֶּׁ֗מֶן וַ/יִּמְשַׁ֣ח אֹת/וֹ֮ בְּ/קֶ֣רֶב אֶחָי/ו֒ וַ/תִּצְלַ֤ח רֽוּחַ יְהוָה֙ אֶל דָּוִ֔ד מֵ/הַ/יּ֥וֹם הַ/ה֖וּא וָ/מָ֑עְלָ/ה וַ/יָּ֣קָם שְׁמוּאֵ֔ל וַ/יֵּ֖לֶךְ הָ/רָמָֽתָ/ה־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/013.yaml
  text: Then Samuel took the horn of oil and anointed him in the midst of his brothers[a]. And the Spirit of Yahweh rushed upon David from that day onward[b]. Then Samuel rose and went to Ramah.
translation:
  language: hi
  text: तब शमूएल ने तेल से भरा सींग[a] लिया और दाऊद के भाइयों के बीच उसका अभिषेक किया। उस दिन से याहवे की आत्मा दाऊद पर सामर्थ्य के साथ उतर आई[b]। फिर शमूएल उठा और रामा चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात तेल रखने के लिए प्रयुक्त पशु का सींग।
    reason: cultural_clarification
  - marker: b
    text: या “दाऊद पर सामर्थ्य के साथ आई।” इब्रानी क्रिया आत्मा के बलपूर्वक और सामर्थ्य प्रदान करते हुए आने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קֶרֶן הַשֶּׁמֶן
  choice: तेल का सींग
  rationale: קֶרֶן का मूल अर्थ पशु का ‘सींग’ है, जो यहाँ तेल रखने के पात्र के रूप में प्रयुक्त हुआ है। ठोस बिंब और शाऊल के अभिषेक में प्रयुक्त दूसरे प्रकार के पात्र से अंतर बनाए रखने के लिए ‘सींग’ रखा गया है।
- source_word: וַיִּמְשַׁח
  choice: अभिषेक किया
  rationale: משׁח तेल लगाने की धार्मिक क्रिया के लिए मानक क्रिया है। ‘अभिषेक किया’ भौतिक कार्य और उसके राजकीय-धार्मिक महत्त्व दोनों को सुरक्षित रखता है।
- source_word: בְּקֶרֶב אֶחָיו
  choice: दाऊद के भाइयों के बीच
  rationale: בְּקֶרֶב का अर्थ ‘बीच में’ है और אֶחָיו दाऊद के पुरुष सहोदरों को सूचित करता है। सर्वनाम की संभावित अस्पष्टता दूर करने के लिए हिंदी में ‘दाऊद’ स्पष्ट किया गया है।
- source_word: וַתִּצְלַח רוּחַ יְהוָה אֶל דָּוִד
  choice: याहवे का आत्मा दाऊद पर प्रबलता से छा गया
  rationale: צלח, विशेषकर רוּחַ יְהוָה के साथ, आत्मा के बलशाली और प्रभावकारी रूप से आने को व्यक्त करता है। ‘प्रबलता से छा गया’ हिंदी में इस आकस्मिक और सामर्थ्यदायी गति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: उस दिन से आगे
  rationale: यह पदबंध उस दिन आरम्भ हुई और आगे जारी रहने वाली अवस्था को दर्शाता है।
- source_word: וַיָּקָם שְׁמוּאֵל וַיֵּלֶךְ הָרָמָתָה
  choice: फिर शमूएल उठकर रामा चला गया
  rationale: इब्रानी कथात्मक क्रम को संक्षिप्त और स्वाभाविक आधुनिक हिंदी में रखा गया है; स्थानवाचक दिशासूचक रूप का अर्थ ‘रामा को/की ओर’ है।
theological_decisions:
- issue: רוּחַ יְהוָה का अर्थ
  choice: याहवे का आत्मा
  alternative: याहवे की ओर से आई आत्मिक शक्ति/वायु
  rationale: इस कथानक में यह पदबंध परमेश्वर की सामर्थ्यदायी उपस्थिति को दर्शाता है। हिंदी में ‘आत्मा’ उपयुक्त है, पर मूल इब्रानी में बड़े-छोटे अक्षरों का भेद नहीं होता और רוּחַ का अर्थ-क्षेत्र ‘आत्मा, श्वास, वायु’ तक फैला है; अनुवाद इससे आगे कोई विस्तृत धर्मसैद्धांतिक परिभाषा नहीं जोड़ता।
- issue: दाऊद के अभिषेक का पारिवारिक परिवेश
  choice: दाऊद के भाइयों के बीच
  alternative: उसके परिवार के बीच निजी रूप से
  rationale: मूल पाठ स्पष्ट रूप से भाइयों के बीच अभिषेक होने की बात कहता है। इससे व्यापक सार्वजनिक मान्यता या पूर्ण गोपनीयता का कोई निष्कर्ष अनुवाद में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, सहज किंतु गरिमापूर्ण रखी गई है। ‘अभिषेक’, ‘आत्मा’ और ‘याहवे’ जैसे प्रमुख बाइबलीय शब्द बनाए गए हैं; वाक्यरचना को अनावश्यक रूप से पुरातन नहीं बनाया गया।
