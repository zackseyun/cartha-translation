source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל שְׁמוּאֵ֗ל עַד מָתַי֙ אַתָּה֙ מִתְאַבֵּ֣ל אֶל שָׁא֔וּל וַ/אֲנִ֣י מְאַסְתִּ֔י/ו מִ/מְּלֹ֖ךְ עַל יִשְׂרָאֵ֑ל מַלֵּ֨א קַרְנְ/ךָ֜ שֶׁ֗מֶן וְ/לֵ֤ךְ אֶֽשְׁלָחֲ/ךָ֙ אֶל יִשַׁ֣י בֵּֽית הַלַּחְמִ֔י כִּֽי רָאִ֧יתִי בְּ/בָנָ֛י/ו לִ֖/י מֶֽלֶךְ־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/001.yaml
  text: And Yahweh said to Samuel[a], “How long will you grieve over Saul, since I have rejected him from being king over Israel? Fill your horn with oil and go; I am sending you to Jesse the Bethlehemite, for I have provided for myself a king among his sons.”
translation:
  language: hi
  text: और यहोवा ने शमूएल से कहा, “तू कब तक शाऊल के लिए शोक करता रहेगा? मैंने उसे इस्राएल पर राजा होने के लिए अस्वीकार कर दिया है। अपना सींग तेल से भर और जा। मैं तुझे बेतलेहेमवासी यिशै के पास भेज रहा हूँ, क्योंकि मैंने उसके पुत्रों में से अपने लिए एक राजा देख लिया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि मैंने उसके पुत्रों में से अपने लिए एक राजा चुन लिया है” अथवा “ठहरा रखा है।” इब्रानी क्रिया का शाब्दिक अर्थ “देखा है” है, पर यहाँ उसमें चुनने या उपलब्ध कराने का भाव भी हो सकता है।
    reason: रָאִיתִי के शाब्दिक अर्थ और प्रसंगगत अर्थ के बीच की वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: מִתְאַבֵּל אֶל־שָׁאוּל
  choice: शाऊल के लिए शोक करता रहेगा
  rationale: क्रिया निरंतर शोक मनाने का भाव देती है; प्रश्न में עַד־מָתַי के साथ ‘कब तक ... करता रहेगा’ स्वाभाविक हिन्दी है।
- source_word: מְאַסְתִּיו מִמְּלֹךְ עַל־יִשְׂרָאֵל
  choice: मैंने उसे इस्राएल पर राजा बने रहने से अस्वीकार कर दिया है
  rationale: अस्वीकृति को उसके राजपद तक सीमित रखा गया है; इससे पद का व्यापक धर्मवैज्ञानिक अर्थ नहीं जोड़ा जाता।
- source_word: מַלֵּא קַרְנְךָ שֶׁמֶן
  choice: अपना सींग तेल से भर
  rationale: कֶרֶן का ठोस ऐतिहासिक बिंब ‘सींग’ के रूप में सुरक्षित है; उसे सामान्य पात्र नहीं बनाया गया।
- source_word: אֶשְׁלָחֲךָ
  choice: मैं तुझे ... भेज रहा हूँ
  rationale: यह रूप निकट और निश्चित ईश्वरीय प्रेषण व्यक्त करता है।
- source_word: יִשַׁי בֵּית הַלַּחְמִי
  choice: बेतलेहेमवासी यिशै
  rationale: विशेषणात्मक जातिवाचक रूप को संक्षिप्त और स्वाभाविक हिन्दी में स्थान-संबंधी पहचान के रूप में व्यक्त किया गया है।
- source_word: רָאִיתִי ... לִי מֶלֶךְ
  choice: मैंने ... अपने लिए एक राजा देख लिया है
  rationale: ראה के मूल ‘देखना’ बिंब तथा לִי के व्यक्तिगत हित/चयन दोनों को सुरक्षित रखा गया है; सन्दर्भ में निहित चयन या प्रबंध को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְּבָנָיו
  choice: उसके पुत्रों में से
  rationale: ב यहाँ समूह के भीतर से पहचाने गए व्यक्ति का भाव देता है; हिन्दी में ‘में से’ इसे स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: शाऊल की ईश्वरीय अस्वीकृति का दायरा
  choice: मैंने उसे इस्राएल पर राजा बने रहने से अस्वीकार कर दिया है
  alternative: मैंने शाऊल को अस्वीकार कर दिया है
  rationale: मूल पाठ अस्वीकृति को इस्राएल पर उसके राज्य करने से जोड़ता है; अनुवाद इसे शाऊल की अंतिम आत्मिक दशा पर व्यापक कथन नहीं बनाता।
- issue: रָאִיתִי לִי में देखने, चुनने और उपलब्ध कराने का संबंध
  choice: मैंने ... अपने लिए एक राजा देख लिया है
  alternative: मैंने ... अपने लिए एक राजा चुन लिया है / ठहरा लिया है
  rationale: मुख्य पाठ में ‘देखने’ का इब्रानी बिंब और उसकी वास्तविक अस्पष्टता सुरक्षित है; प्रसंगगत चयन या प्रबंध का अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ईश्वरीय प्रत्यक्ष वचन में एकवचन ‘तू/तुझे’ मूल के एकवचन संबोधन को स्वाभाविक बाइबलीय हिन्दी में दर्शाता है। ‘यहोवा’, ‘शमूएल’, ‘शाऊल’, ‘इस्राएल’, ‘बेतलेहेम’ और ‘यिशै’ जैसे रूप हिन्दी बाइबल-पाठकों के लिए परिचित लिप्यंतरण हैं।
