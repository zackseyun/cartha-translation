base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/006.yaml
  text: When they came in[a], he saw Eliab and said, “Surely Yahweh’s anointed is before Yahweh.”
translation:
  language: hi
  text: जब वे भीतर आए, तब उसने एलीआब को देखा और कहा, “निश्चय ही याहवे का अभिषिक्त[a] याहवे के सामने है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “याहवे का मसीह याहवे के सामने है।” यहाँ जिस इब्रानी शब्द का अनुवाद “अभिषिक्त” किया गया है, वही शब्द बाद में “मसीह” के लिए भी प्रयुक्त होता है। इस प्रसंग में यह उस व्यक्ति को सूचित करता है जिसे शमूएल याहवे का चुना हुआ और अभिषिक्त राजा मान रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבוֹאָם
  choice: जब वे भीतर आए, तब
  rationale: यह कथात्मक सूत्र आने की घटना को अगली क्रिया की समय-भूमिका बनाता है। आधुनिक हिन्दी में यह स्वाभाविक है और प्रसंगानुसार प्रवेश का भाव भी व्यक्त करता है।
- source_word: וַיַּרְא אֶת אֱלִיאָב
  choice: उसने एलीआब को देखा
  rationale: साधारण दृष्टि-क्रिया और व्यक्तिवाचक नाम को सीधे रूप में रखा गया है; ‘ध्यान से देखा’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
- source_word: וַיֹּאמֶר
  choice: और कहा
  rationale: इब्रानी क्रिया का सामान्य अर्थ ‘कहा’ है। कथन मन में हुआ हो सकता है, पर मूल पाठ ऐसा स्पष्ट नहीं करता, इसलिए ‘मन में कहा’ नहीं जोड़ा गया।
- source_word: אַךְ
  choice: निश्चय ही
  rationale: यहाँ यह शब्द एलीआब को देखकर शमूएल के दृढ़, किंतु आगे चलकर गलत सिद्ध होने वाले अनुमान को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מְשִׁיחוֹ
  choice: याहवे का अभिषिक्त
  rationale: प्रत्यय का आशय याहवे से है। इस राजकीय चयन के प्रसंग में ‘अभिषिक्त’ तत्काल ऐतिहासिक अर्थ स्पष्ट करता है, जबकि ‘मसीह’ से इसका शब्दगत संबंध पादटिप्पणी में सुरक्षित है।
- source_word: נֶגֶד יְהוָה
  choice: याहवे के सामने
  rationale: נֶגֶד का स्थानवाचक अर्थ ‘के सामने/की उपस्थिति में’ है। याहवे का नाम दोहराने से मूल पाठ की स्पष्टता बनी रहती है और हिन्दी सर्वनाम की संभावित संदिग्धता से बचा जाता है।
theological_decisions:
- issue: राजकीय प्रसंग में מְשִׁיחוֹ का अनुवाद
  choice: याहवे का अभिषिक्त
  alternative: याहवे का मसीह
  rationale: यहाँ शमूएल उस व्यक्ति की बात कर रहा है जिसे वह याहवे द्वारा राजा चुना और अभिषिक्त किया जाने वाला समझता है। ‘अभिषिक्त’ तत्काल प्रसंग को बिना बाद की मसीही विशिष्टता आरोपित किए व्यक्त करता है; वैकल्पिक शब्दगत संबंध पादटिप्पणी में दिया गया है।
- issue: נֶגֶד יְהוָה की संबंधगत अस्पष्टता
  choice: याहवे के सामने
  alternative: उसके सामने
  rationale: मूल पाठ में יְהוָה स्पष्ट रूप से उपस्थित है। नाम को दोहराना औपचारिक संबंध बनाए रखता है और ‘उसके’ का संदर्भ एलीआब या शमूएल समझे जाने की संभावना दूर करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी में रखी गई है। ‘एलीआब’ और ‘याहवे’ नामों का लिप्यंतरण किया गया है। वाक्य में मूल की संक्षिप्तता और शमूएल के दृढ़ अनुमान का स्वर सुरक्षित रखा गया है।
