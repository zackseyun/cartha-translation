reference: 1 Samuel 16:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יֹאמַר נָ֤א אֲדֹנֵ֨/נוּ֙ עֲבָדֶ֣י/ךָ לְ/פָנֶ֔י/ךָ יְבַקְשׁ֕וּ אִ֕ישׁ יֹדֵ֖עַ מְנַגֵּ֣ן בַּ/כִּנּ֑וֹר וְ/הָיָ֗ה בִּֽ/הְי֨וֹת עָלֶ֤י/ךָ רֽוּחַ אֱלֹהִים֙ רָעָ֔ה וְ/נִגֵּ֥ן בְּ/יָד֖/וֹ וְ/ט֥וֹב לָֽ/ךְ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/016.yaml
  text: Please let our lord say to your servants before you that they should seek out a man who knows how to play the lyre; and when a harmful spirit from God is upon you[a], he will play with his hand, and it will be well for you.
translation:
  language: hi
  text: हमारे स्वामी कृपया अपने सामने उपस्थित सेवकों से कहें कि वे किसी ऐसे व्यक्ति को ढूँढ़ें जो किन्नोर नाम का तार-वाद्य बजाना जानता हो। जब परमेश्वर की ओर से हानिकारक आत्मा आप पर आएगी[a], तब वह अपने हाथ से बजाएगा और आपका भला होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, ‘परमेश्वर की ओर से दुष्ट आत्मा।’ इब्रानी: ‘परमेश्वर की बुरी/हानिकारक आत्मा’; संबंध का अर्थ ‘परमेश्वर की’ या ‘परमेश्वर की ओर से’ हो सकता है।'
    reason: रָעָה का अर्थ ‘दुष्ट/बुरी’ अथवा ‘हानिकारक’ हो सकता है, और אֱלֹהִים के साथ संबंध को ‘की’ अथवा ‘की ओर से’ समझा जा सकता है।
lexical_decisions:
- source_word: יֹאמַר נָא
  choice: आज्ञा दे
  rationale: नָא के विनम्र निवेदन और राजदरबार में सेवकों द्वारा शाऊल से कुछ कहने/निर्देश देने के अनुरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲדֹנֵינוּ
  choice: हमारा स्वामी
  rationale: यहाँ शाऊल के लिए आदरसूचक दरबारी संबोधन है; ‘स्वामी’ इसे परमेश्वर के नाम या उपाधि से अलग रखता है।
- source_word: עֲבָדֶיךָ לְפָנֶיךָ
  choice: अपने सामने उपस्थित सेवकों को
  rationale: स्थानवाचक इब्रानी मुहावरे और राजा की सेवा में उपस्थित दरबारियों—दोनों अर्थों को स्पष्ट करता है।
- source_word: יְבַקְשׁוּ אִישׁ
  choice: वे किसी ऐसे व्यक्ति को ढूँढ़ें
  rationale: जानबूझकर उपयुक्त व्यक्ति की खोज करने के प्रस्ताव को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יֹדֵעַ מְנַגֵּן
  choice: बजाना जानता हो
  rationale: यह रचना वाद्य बजाने की योग्यता या कौशल बताती है।
- source_word: כִּנּוֹר
  choice: किन्नोर
  rationale: यह प्राचीन तार-वाद्य आधुनिक वीणा या हार्प से ठीक-ठीक समान नहीं था; लिप्यंतरण ऐतिहासिक वस्तु की विशिष्टता बचाता है।
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: परमेश्वर की ओर से हानि पहुँचाने वाली आत्मा
  rationale: ‘की ओर से’ स्रोत-संबंध को और ‘हानि पहुँचाने वाली’ רָעָה के अनिष्टकारी प्रभाव को व्यक्त करता है, जबकि नैतिक अर्थ की सम्भावना पादटिप्पणी में सुरक्षित रहती है।
- source_word: עָלֶיךָ
  choice: आप पर आएगी
  rationale: आत्मा के शाऊल पर आ पड़ने या उसे प्रभावित करने का प्रसंगानुकूल अर्थ देता है।
- source_word: וְנִגֵּן בְּיָדוֹ
  choice: वह अपने हाथ से बजाएगा
  rationale: इब्रानी की ठोस अभिव्यक्ति ‘अपने हाथ से’ को बनाए रखता है।
- source_word: וְטוֹב לָךְ
  choice: आपको आराम मिलेगा
  rationale: इस प्रसंग में वादन से शाऊल को होने वाली राहत को स्वाभाविक हिन्दी में व्यक्त करता है, यद्यपि इब्रानी का शाब्दिक अर्थ व्यापक रूप से ‘आपका भला होगा’ है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה में आत्मा, परमेश्वर और רָעָה के संबंध को कैसे व्यक्त किया जाए
  choice: परमेश्वर की ओर से हानि पहुँचाने वाली आत्मा
  alternative: परमेश्वर की ओर से दुष्ट आत्मा; परमेश्वर की बुरी/हानिकारक आत्मा
  rationale: मूल पाठ आत्मा को परमेश्वर से जोड़ता है और רָעָה नैतिक बुराई अथवा हानिकारक प्रभाव, दोनों का बोध करा सकता है। मुख्य पाठ में हानिकारक प्रभाव रखा गया है और वैकल्पिक नैतिक अर्थ पादटिप्पणी में, ताकि पाठ का कठिन ईश्वर-संबंध मिटे नहीं और किसी एक धर्मवैज्ञानिक समाधान को थोपा न जाए।
translation_notes:
  register: आधुनिक, आदरपूर्ण और सहज हिन्दी। शाऊल के लिए ‘आप’ तथा दरबारी संबोधन ‘हमारा स्वामी’ रखा गया है। प्राचीन वाद्य के लिए अनिश्चित आधुनिक समतुल्य थोपने के बजाय ‘किन्नोर’ अपनाया गया है।
