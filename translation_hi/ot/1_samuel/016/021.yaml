lexical_decisions:
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא के साथ אֶל שָׁאוּל गति को शाऊल की ओर व्यक्त करता है; ‘शाऊल के पास आया’ स्वाभाविक और स्रोत के निकट है।
- source_word: וַיַּעֲמֹד לְפָנָיו
  choice: उसके सामने सेवा में खड़ा रहने लगा
  rationale: עמד לפני का शाब्दिक चित्र ‘सामने खड़ा होना’ है, जबकि प्रसंग में यह किसी श्रेष्ठ अधिकारी की सेवा में उपस्थित रहने का भाव भी रखता है; अनुवाद दोनों पहलुओं को बनाए रखता है।
- source_word: וַיֶּאֱהָבֵהוּ מְאֹד
  choice: शाऊल उससे बहुत प्रेम करने लगा
  rationale: संदर्भ से क्रिया का कर्ता शाऊल है। אהב और מְאֹד के प्रबल स्नेह/अनुग्रह को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וַיְהִי לוֹ
  choice: उसका ... बन गया
  rationale: यह रचना परिणामी अवस्था या नियुक्ति बताती है; ‘बन गया’ हिन्दी में स्वाभाविक है।
- source_word: נֹשֵׂא כֵלִים
  choice: शस्त्रवाहक
  rationale: शाब्दिक अर्थ सैन्य साज-सामान उठाने वाला है। ‘शस्त्रवाहक’ संक्षिप्त, प्रतिष्ठित और इस दरबारी-सैनिक भूमिका के लिए प्रचलित हिन्दी पद है।
