  yaml_path: translation/ot/1_samuel/016/011.yaml
  text: Then Samuel said to Jesse[a], “Are these all the young men?” And he said, “The youngest still remains, and behold, he is shepherding the flock.” Then Samuel said to Jesse, “Send and bring him[b], for we will not sit down until he comes here.”
translation:
  language: hi
  text: तब शमूएल ने यिशै से पूछा, “क्या यही सारे युवक हैं?” उसने कहा, “अभी एक रह गया है—सबसे छोटा; देखिए, वह भेड़-बकरियों के झुंड को चरा रहा है।” तब शमूएल ने यिशै से कहा, “किसी को भेजकर उसे ले आओ, क्योंकि जब तक वह यहाँ नहीं आ जाता, हम नहीं बैठेंगे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हम नहीं बैठेंगे” या “हम अपनी जगह नहीं लेंगे।” सम्भवतः आशय है कि उसके आने तक वे भोजन या औपचारिक सभा आरम्भ नहीं करेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲתַמּוּ הַנְּעָרִים
  choice: क्या ये ही सब जवान हैं?
  rationale: תמם पूर्ण संख्या के उपस्थित होने का प्रश्न करता है; हिन्दी में यह स्वाभाविक रूप से पूछता है कि क्या प्रस्तुत किए गए पुत्रों की संख्या पूरी है। נְעָרִים के लिए ‘जवान’ उम्र और प्रसंग के अनुकूल है।
- source_word: עוֹד שָׁאַר הַקָּטָן
  choice: सबसे छोटा अभी बाकी है
  rationale: पारिवारिक प्रसंग में הַקָּטָן सबसे छोटे पुत्र को सूचित करता है, और עוֹד שָׁאַר उसके अब तक उपस्थित न किए जाने पर बल देता है।
- source_word: וְהִנֵּה
  choice: देखिए
  rationale: הִנֵּה अगली सूचना की ओर ध्यान खींचता है; ‘देखिए’ आधुनिक, सम्मानपूर्ण हिन्दी में इस कथनगत बल को व्यक्त करता है।
- source_word: רֹעֶה בַּצֹּאן
  choice: वह भेड़-बकरियाँ चरा रहा है
  rationale: רֹעֶה वर्तमान में जारी चराने और देखभाल करने की क्रिया बताता है। צֹאן छोटे पालतू पशुओं का सामूहिक शब्द है और इसमें भेड़ तथा बकरियाँ दोनों आ सकती हैं।
- source_word: שִׁלְחָה וְקָחֶנּוּ
  choice: किसी को भेजकर उसे बुलवा लो
  rationale: आदेश का आशय किसी को भेजकर अनुपस्थित पुत्र को वहाँ मँगवाना है; यह हिन्दी में स्वाभाविक है और दोनों क्रियाओं का संयुक्त बल रखता है।
- source_word: לֹא נָסֹב
  choice: हम भोजन के लिए नहीं बैठेंगे
  rationale: प्रसंग में סבב का दुर्लभ प्रयोग अपनी जगह लेने या बैठने की ओर संकेत करता है, सम्भवतः बलिदानी भोजन आरम्भ करने के लिए। मुख्य पाठ प्रसंगगत अर्थ देता है और पादटिप्पणी शाब्दिक अनिश्चितता सुरक्षित रखती है।
- source_word: עַד בֹּאוֹ פֹה
  choice: जब तक वह यहाँ नहीं आ जाता
  rationale: यह आगमन तक की स्पष्ट समय-सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
