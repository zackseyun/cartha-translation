base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/009.yaml
  text: Then Jesse made Shammah pass by, and he said, “Yahweh has not chosen this one either.”
translation:
  language: hi
  text: तब यिशै ने शम्मा को शमूएल के सामने से गुज़ारा, और उसने कहा, “याहवे ने इसे भी नहीं चुना है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲבֵר
  choice: सामने से गुज़ारा
  rationale: 'עבר के हिफ़ील रूप का कारणवाचक अर्थ सुरक्षित है: यिशै ने शम्मा को शमूएल के सामने से गुज़रने दिया। संदर्भ से स्पष्ट ‘सामने’ स्वाभाविक हिंदी में दृश्य को व्यक्त करता है।'
- source_word: יִשַׁי
  choice: यिशै
  rationale: हिब्रू व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: שַׁמָּה
  choice: शम्मा
  rationale: हिब्रू व्यक्तिगत नाम का निकट देवनागरी लिप्यंतरण।
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: हिब्रू में कर्ता सर्वनाम से ही निहित है। संदर्भ में वक्ता शमूएल है, पर मूल पाठ की तरह नाम को स्पष्ट रूप से जोड़ने के बजाय सर्वनाम रखा गया है।
- source_word: גַּם בָּזֶה
  choice: इसे भी
  rationale: नकारात्मक कथन में גַּם का योगात्मक बल ‘भी’ से और בָּזֶה का संकेत वर्तमान पुत्र की ओर ‘इसे’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: לֹא בָחַר
  choice: नहीं चुना है
  rationale: בחר का मूल अर्थ ‘चुनना’ है। पूर्ण क्रिया का परिणाम वर्तमान विचार-विमर्श में लागू है, इसलिए ‘नहीं चुना है’ उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुरक्षरीय परमेश्वर-नाम का हिंदी में प्रत्यक्ष लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत परमेश्वर-नाम का प्रयोग करता है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उपाधि से प्रतिस्थापन होगा।
- issue: וַיֹּאמֶר के वक्ता की पहचान
  choice: उसने कहा
  alternative: शमूएल ने कहा
  rationale: संदर्भ वक्ता को शमूएल बताता है, पर इस पद का हिब्रू पाठ नाम नहीं दोहराता। सर्वनाम मूल की संक्षिप्तता और संदर्भगत स्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। कारणवाचक क्रिया और मूल पाठ के सर्वनाम को सुरक्षित रखा गया है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
