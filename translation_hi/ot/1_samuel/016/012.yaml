base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/012.yaml
  text: So he sent and brought him in. Now he was ruddy[a], with beautiful eyes and a handsome appearance. And Yahweh said, “Rise, anoint him, for this is he.”
translation:
  language: hi
  text: तब उसने उसे बुलवाया और उसे भीतर ले आया। वह लालिमा लिए हुए था, उसकी आँखें सुंदर थीं और उसका रूप मनोहर था। तब याहवे ने कहा, “उठ, इसका अभिषेक कर, क्योंकि यही वह है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח וַיְבִיאֵהוּ
  choice: तब उसने दूत भेजकर उसे बुलवा लिया
  rationale: क्रमिक कथन को स्वाभाविक हिन्दी में व्यक्त करता है। हिफ़िल וַיְבִיאֵהוּ का कारक भाव यहाँ ‘उसे बुलवा लिया’ से स्पष्ट होता है; इससे यह अनावश्यक अर्थ नहीं निकलता कि यिशै स्वयं दाऊद को भीतर लाया।
- source_word: אַדְמוֹנִי
  choice: लालिमा लिए हुए
  rationale: यह त्वचा या सामान्य रंगत की लालिमा को खुला रखता है और इसे विशेष रूप से लाल बालों तक सीमित नहीं करता।
- source_word: עִם יְפֵה עֵינַיִם
  choice: उसकी आँखें सुंदर थीं
  rationale: इब्रानी के शारीरिक वर्णन को सहज और स्पष्ट आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: וְטוֹב רֹאִי
  choice: उसका रूप मनोहर था
  rationale: देखने में आकर्षक या सुन्दर होने का भाव व्यक्त करता है, बिना कोई नैतिक गुण जोड़े।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ के रूप में प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: קוּם מְשָׁחֵהוּ
  choice: उठ, इसका अभिषेक कर
  rationale: दोनों आज्ञार्थक क्रियाओं को संक्षिप्त और गरिमापूर्ण रूप में रखता है; ‘अभिषेक’ राजकीय चयन के प्रसंग में सटीक है।
- source_word: כִּי זֶה הוּא
  choice: क्योंकि यही वह है
  rationale: मूल की संक्षिप्त और बलयुक्त पहचान को बनाए रखता है तथा ‘चुना हुआ’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
theological_decisions:
- issue: יְהוָה परमेश्वर-नाम का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत परमेश्वर-नाम है। हिन्दी पाठकों के लिए सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता।
- issue: दाऊद के बाहरी रूप का वर्णन
  choice: शारीरिक वर्णन को बिना प्रतीकात्मक या नैतिक व्याख्या के बनाए रखना
  alternative: אַדְמוֹנִי को विशेष रूप से लाल बालों वाला बताना या वर्णन में चरित्रगत गुण जोड़ना
  rationale: मूल केवल उसकी रंगत, आँखों और रूप का वर्णन करता है। अनुवाद को संदर्भ की उस तनावपूर्ण संगति को बनाए रखना चाहिए जिसमें बाहरी रूप का उल्लेख है, पर परमेश्वर का चुनाव मात्र बाहरी रूप पर आधारित नहीं बताया जाता।
- issue: כִּי זֶה הוּא की पहचान
  choice: क्योंकि यही वह है
  alternative: क्योंकि यही चुना हुआ है
  rationale: मूल में ‘चुना हुआ’ शब्द स्पष्ट रूप से नहीं है। संक्षिप्त पहचान को ज्यों का त्यों रखना धार्मिक व्याख्या जोड़ने से बचाता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। वाक्य सामान्य पाठकों के लिए स्वाभाविक रखा गया है; शारीरिक वर्णन में मूल की अस्पष्टता सुरक्षित है।
