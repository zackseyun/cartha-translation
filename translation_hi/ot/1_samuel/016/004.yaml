  text: וַ/יַּ֣עַשׂ שְׁמוּאֵ֗ל אֵ֚ת אֲשֶׁ֣ר דִּבֶּ֣ר יְהוָ֔ה וַ/יָּבֹ֖א בֵּ֣ית לָ֑חֶם וַ/יֶּחֶרְד֞וּ זִקְנֵ֤י הָ/עִיר֙ לִ/קְרָאת֔/וֹ וַ/יֹּ֖אמֶר שָׁלֹ֥ם בּוֹאֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/004.yaml
  text: So Samuel did what Yahweh had spoken and came to Bethlehem. The elders of the city trembled at his coming and said[a], “Do you come in peace?”
translation:
  language: hi
  text: तब शमूएल ने वही किया जो याहवे ने कहा था, और वह बेतलेहेम आया। उसके आने पर नगर के बुज़ुर्ग उससे मिलने पर काँप उठे[a] और बोले, “क्या आप शांति से आए हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर के बुज़ुर्ग काँपते हुए उससे मिलने आए।”
    reason: וַיֶּחֶרְדוּ और לִקְרָאתוֹ के संबंध को ‘उससे मिलने पर काँप उठे’ अथवा ‘काँपते हुए उससे मिलने आए’ के रूप में स्वाभाविक ढंग से समझा जा सकता है।
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने वही किया
  rationale: कथात्मक क्रम में עשה का सीधा और स्वाभाविक अर्थ; यह शमूएल की आज्ञाकारिता व्यक्त करता है, बिना ‘आज्ञा पूरी की’ जैसा अतिरिक्त अर्थ जोड़े।
- source_word: אֵת אֲשֶׁר דִּבֶּר יְהוָה
  choice: जो यहोवा ने कहा था
  rationale: דבר के मूल अर्थ ‘कहा/बोला’ को रखता है और पूर्व में दिए गए निर्देश के कारण पूर्ण भूतकाल स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिब्रू चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַיָּבֹא בֵּית לָחֶם
  choice: वह बेतलेहेम आया
  rationale: בוא के सामान्य कथात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֶּחֶרְדוּ
  choice: काँपते हुए आए
  rationale: חרד की भयजनित कंपकंपी और לִקְרָאתוֹ के मिलने के लिए आगे आने—दोनों को स्वाभाविक हिन्दी वाक्य में बनाए रखता है।
- source_word: זִקְנֵי הָעִיר
  choice: नगर के पुरनिए
  rationale: यह नगर के मान्य वरिष्ठ अगुओं के सामाजिक पद को संक्षिप्त और बाइबिलीय हिन्दी में व्यक्त करता है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने के लिए
  rationale: पूर्वसर्गीय पद का सीधा अर्थ है उसकी ओर उससे मिलने जाना; इसे मुख्य पाठ में स्पष्ट रखा गया है।
- source_word: שָׁלוֹם בּוֹאֶךָ
  choice: क्या आपका आना कुशल-मंगल का है?
  rationale: खंडित हिब्रू अभिव्यक्ति की शांति और कल्याण—दोनों अर्थछायाएँ बनाए रखते हुए इसे प्रश्न के रूप में स्वाभाविक हिन्दी देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; हिन्दी पाठकों में पहचाने जाने वाले पारंपरिक लिप्यंतरण ‘यहोवा’ को रखा गया है, न कि ‘प्रभु’ जैसी उपाधि को।
- issue: पुरनियों के काँपने और मिलने के लिए आने का संबंध
  choice: वे उससे मिलने के लिए काँपते हुए आए
  alternative: उसके आने पर नगर के पुरनिए काँप उठे
  rationale: हिब्रू וַיֶּחֶרְדוּ ... לִקְרָאתוֹ यह संकेत दे सकता है कि वे भय से काँपते हुए उससे मिलने निकले; वैकल्पिक पाठ परिस्थिति को उसके आगमन पर भयभीत होने के रूप में समझता है। मुख्य पाठ संरचना के निकट रहता है और पादटिप्पणी दूसरी स्वाभाविक समझ सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘पुरनिए’ सामाजिक पद के लिए परिचित बाइबिलीय शब्द है; प्रश्न में आदरसूचक ‘आपका’ शमूएल की प्रतिष्ठा और बहुवचन वक्ताओं के संबोधन के अनुरूप है।
