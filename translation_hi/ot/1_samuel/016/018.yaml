  text: וַ/יַּעַן֩ אֶחָ֨ד מֵ/הַ/נְּעָרִ֜ים וַ/יֹּ֗אמֶר הִנֵּ֨ה רָאִ֜יתִי בֵּ֣ן לְ/יִשַׁי֮ בֵּ֣ית הַלַּחְמִי֒ יֹדֵ֣עַ נַ֠גֵּן וְ/גִבּ֨וֹר חַ֜יִל וְ/אִ֧ישׁ מִלְחָמָ֛ה וּ/נְב֥וֹן דָּבָ֖ר וְ/אִ֣ישׁ תֹּ֑אַר וַ/יהוָ֖ה עִמּֽ/וֹ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/016/018.yaml
  text: Then one of the young men answered and said[a], “Look, I have seen a son of Jesse the Bethlehemite who is skillful in playing, a mighty man of valor, a man of war, prudent in speech, and a handsome man[d][c][b], and Yahweh is with him.”
translation:
  language: hi
  text: तब जवानों में से एक ने उत्तर दिया, “देखिए, मैंने बैतलहम के रहनेवाले यिशै के एक पुत्र को देखा है, जो बजाने में निपुण, पराक्रमी, योद्धा, बात करने में समझदार और सुंदर रूपवाला है; और यहोवा उसके साथ है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן אֶחָד מֵהַנְּעָרִים
  choice: तब जवानों में से एक ने उत्तर दिया
  rationale: ענה संवाद में ‘उत्तर देना’ है। נְעָרִים का मूल अर्थ जवान/युवक है; दरबारी संदर्भ में सेवक संभव है, पर पद स्वयं भूमिका को स्पष्ट नहीं करता।
- source_word: הִנֵּה רָאִיתִי
  choice: देखिए, मैंने ... देखा है
  rationale: הִנֵּה ध्यान आकर्षित करने वाला अव्यय है; आदरसूचक ‘देखिए’ शाऊल से संबोधन के संदर्भ में स्वाभाविक है। पूर्ण क्रिया को वर्तमान सिफारिश से जुड़े पूर्व अनुभव के रूप में ‘देखा है’ किया गया।
- source_word: בֵּן לְיִשַׁי בֵּית הַלַּחְמִי
  choice: बैतलहम के रहनेवाले यिशै के एक पुत्र
  rationale: जातिवाचक בֵּית הַלַּחְמִי यहाँ निकटतम नाम यिशै को विशेषित करता है। हिन्दी में ‘बैतलहम के रहनेवाले’ अर्थ को सहज रूप से व्यक्त करता है।
- source_word: יֹדֵעַ נַגֵּן
  choice: बजाने में निपुण
  rationale: मुहावरे का आशय वाद्य बजाने की दक्षता है। इस पद में वाद्य का नाम न होने के कारण कोई विशिष्ट वाद्य नहीं जोड़ा गया।
- source_word: גִּבּוֹר חַיִל
  choice: वीर और पराक्रमी
  rationale: यह प्रचलित पदबंध वीरता, सामर्थ्य और योग्यता सूचित कर सकता है। अगला पद स्पष्ट रूप से युद्धक है, इसलिए ऐसा रूप चुना गया जो इसे केवल ‘योद्धा’ में सीमित न करे।
- source_word: אִישׁ מִלְחָמָה
  choice: योद्धा
  rationale: शाब्दिक ‘युद्ध का पुरुष’ की अपेक्षा ‘योद्धा’ आधुनिक हिन्दी में स्वाभाविक और अर्थतः सटीक है।
- source_word: נְבוֹן דָּבָר
  choice: बात करने में समझदार
  rationale: यह पद वाणी में विवेक अथवा मामलों की समझ—दोनों की ओर संकेत कर सकता है। ‘बात करने में समझदार’ דָּבָר के वाचिक पक्ष को रखता है और केवल वाक्पटुता नहीं जोड़ता।
- source_word: אִישׁ תֹּאַר
  choice: सुंदर पुरुष
  rationale: תֹּאַר आकार-रूप या बाहरी स्वरूप को दर्शाता है; प्रशंसात्मक संदर्भ में ‘सुंदर’ सहज हिन्दी है।
- source_word: וַיהוָה עִמּוֹ
  choice: और यहोवा उसके साथ है
  rationale: व्यक्तिगत दिव्य नाम יהוה को ‘यहोवा’ के रूप में रखा गया और नामरहित वाक्य का वर्तमान भाव सुरक्षित किया गया।
theological_decisions:
- issue: दिव्य नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे उपस्थित है। हिन्दी बाइबल परंपरा में परिचित ‘यहोवा’ उसे सामान्य उपाधि ‘प्रभु’ से अलग रखता है; उच्चारण का ‘याहवे’ रूप भी संभव है।
- issue: ‘यहोवा उसके साथ है’ का आशय
  choice: कथन को बिना व्याख्यात्मक विस्तार के रखा गया
  alternative: यहोवा उसे सफलता देता है / उस पर अनुग्रह करता है
  rationale: मूल संक्षिप्त दिव्य-संगति कथन है; इसे सफलता, अनुमोदन या अनुग्रह की किसी एक व्याख्या तक सीमित नहीं किया गया।
translation_notes:
  register: आधुनिक, आदरसूचक और गरिमापूर्ण हिन्दी अपनाई गई है। गुणों की सूची को स्वाभाविक समानांतरता दी गई है, पर मूल के अर्थगत क्रम और उसकी संभावित व्यापकता को बनाए रखा गया है।
