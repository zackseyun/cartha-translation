  text: וַ/יִּגְדַּ֖ל שְׁמוּאֵ֑ל וַֽ/יהוָה֙ הָיָ֣ה עִמּ֔/וֹ וְ/לֹֽא הִפִּ֥יל מִ/כָּל דְּבָרָ֖י/ו אָֽרְצָ/ה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/019.yaml
  text: And Samuel grew[a], and Yahweh was with him and let none of his words fall to the ground.
translation:
  language: hi
  text: शमूएल बड़ा होता गया। याहवे उसके साथ था और उसने उसकी कोई भी बात धरती पर गिरने नहीं दी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी कोई भी बात विफल नहीं होने दी।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “उसकी कोई भी बात धरती पर गिरने नहीं दी।”
    reason: मुहावरे का अर्थ और अधिक स्वाभाविक वैकल्पिक अनुवाद बताना।
lexical_decisions:
- source_word: וַיִּגְדַּל
  choice: बड़ा होता गया
  rationale: גדל यहाँ शमूएल के बढ़ने और परिपक्व होने को दर्शाता है। ‘बड़ा होता गया’ शारीरिक वृद्धि तक अर्थ को सीमित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिनाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का देवनागरी लिप्यंतरण; इसे किसी उपाधि से प्रतिस्थापित नहीं किया गया है।
- source_word: הָיָה עִמּוֹ
  choice: उसके साथ था
  rationale: यह सीधा अनुवाद याहवे की उपस्थिति और अनुग्रह का इब्रानी कथन बनाए रखता है।
- source_word: וְלֹא הִפִּיל
  choice: गिरने नहीं दी
  rationale: 'नकार के साथ נפל के हिफ़ील रूप का कारणवाचक भाव सुरक्षित रहता है: याहवे ने ऐसा होने नहीं दिया।'
- source_word: מִכָּל דְּבָרָיו
  choice: उसकी कोई भी बात
  rationale: शाब्दिक ‘उसकी सब बातों में से’ का स्वाभाविक हिन्दी अर्थ ‘उसकी कोई भी बात’ है। ‘बात’ मूल शब्द की व्यापकता बनाए रखती है और इसे केवल भविष्यवाणियों तक सीमित नहीं करती।
- source_word: אָרְצָה
  choice: धरती पर
  rationale: दिशासूचक रूप का अर्थ ‘धरती की ओर/धरती पर’ है और यह ‘बात का धरती पर गिरना’ वाले सजीव इब्रानी मुहावरे को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका लिप्यंतरण करता है, उपाधि रखकर नाम को छिपाता नहीं।
- issue: ‘उसकी कोई भी बात धरती पर गिरने नहीं दी’ का मुहावरेदार अर्थ
  choice: मुख्य पाठ में इब्रानी मुहावरा बनाए रखा गया
  alternative: उसकी कोई भी बात विफल नहीं होने दी
  rationale: संदर्भ शमूएल के नबी के रूप में विश्वसनीय सिद्ध होने की ओर संकेत करता है, पर मूल पाठ सजीव और कुछ हद तक व्यापक मुहावरा इस्तेमाल करता है। इसे बनाए रखने से अर्थ को केवल भविष्यवाणियों की पूर्ति तक सीमित नहीं किया जाता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। छोटे वाक्य कथात्मक प्रवाह को स्पष्ट रखते हैं; मुख्य पाठ में मूल इब्रानी मुहावरे की साहित्यिक छवि सुरक्षित है।
