  edition: WLC
  text: וַ/יֹּ֣סֶף יְהוָ֗ה קְרֹ֣א עוֹד֮ שְׁמוּאֵל֒ וַ/יָּ֤קָם שְׁמוּאֵל֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יֹּ֛אמֶר לֹֽא קָרָ֥אתִי בְנִ֖/י שׁ֥וּב שְׁכָֽב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/006.yaml
  text: Then the LORD called Samuel again. Samuel got up and went to Eli and said, “Here I am, because you called me.” But he said, “I did not call, my son. Go back; lie down.”
translation:
  language: hi
  text: तब यहोवा ने फिर पुकारा, “शमूएल!” शमूएल उठकर एली के पास गया और बोला, “मैं यहाँ हूँ, क्योंकि आपने मुझे बुलाया।” पर एली ने कहा, “मेरे बेटे, मैंने नहीं बुलाया। वापस जाकर लेट जाओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף יְהוָה קְרֹא עוֹד שְׁמוּאֵל
  choice: तब यहोवा ने फिर पुकारा, “शमूएल!”
  rationale: इब्रानी में ‘फिर/दोबारा पुकारा’ का भाव है और ‘शमूएल’ पुकार की विषयवस्तु के रूप में स्वाभाविक रूप से प्रत्यक्ष संबोधन है।
- source_word: הִנְנִי
  choice: मैं यहाँ हूँ
  rationale: यह उपस्थित और उत्तर देने को तत्पर होने की प्रचलित इब्रानी अभिव्यक्ति है।
- source_word: כִּי קָרָאתָ לִי
  choice: क्योंकि आपने मुझे बुलाया
  rationale: כִּי का कारणवाचक अर्थ सुरक्षित रखा गया है; एली के प्रति सम्मानसूचक ‘आपने’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: בְנִי
  choice: मेरे बेटे
  rationale: स्नेहपूर्ण संबोधन का सीधा और स्वाभाविक हिंदी रूप।
- source_word: שׁוּב שְׁכָב
  choice: वापस जाकर लेट जाओ
  rationale: शाब्दिक ‘लौट, लेट जा’ को वर्तमान प्रसंग में सहज हिंदी आदेश के रूप में व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में विशिष्ट ईश्वरीय नाम है; हिंदी बाइबिल परंपरा में पहचाने जाने वाले ‘यहोवा’ से नाम की विशिष्टता बनी रहती है, जबकि इसे सामान्य उपाधि में नहीं बदला गया।
- issue: पुकारने वाले की पहचान
  choice: वर्णन में यहोवा को स्पष्ट रखा गया, पर शमूएल के कथन में उसकी तत्काल गलत समझ भी बनी रही
  alternative: शमूएल को उसी समय यह जानता हुआ दिखाना कि यहोवा ने पुकारा
  rationale: कथावाचक और पात्र के ज्ञान के बीच मूल कथा का तनाव सुरक्षित रहना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सरल। संवाद में एली के लिए सम्मानसूचक ‘आप’ और एली की ओर से आत्मीय ‘मेरे बेटे’ रखा गया है।
