reference: 1 Samuel 3:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨סֶף יְהוָ֥ה קְרֹא שְׁמוּאֵל֮ בַּ/שְּׁלִשִׁית֒ וַ/יָּ֨קָם֙ וַ/יֵּ֣לֶךְ אֶל עֵלִ֔י וַ/יֹּ֣אמֶר הִנְ/נִ֔י כִּ֥י קָרָ֖אתָ לִ֑/י וַ/יָּ֣בֶן עֵלִ֔י כִּ֥י יְהוָ֖ה קֹרֵ֥א לַ/נָּֽעַר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/008.yaml
  text: And Yahweh called Samuel again a third time. So he got up and went to Eli and said, “Here I am, for you called me.” Then Eli understood that Yahweh was calling the boy.
translation:
  language: hi
  text: याहवे ने तीसरी बार शमूएल को पुकारा। तब वह उठा और एली के पास जाकर बोला, “मैं यहाँ हूँ, क्योंकि आपने मुझे पुकारा।” तब एली समझ गया कि याहवे उस लड़के को पुकार रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּסֶף ... קְרֹא
  choice: फिर ... पुकारा
  rationale: יָסַף + infinitive यहाँ क्रिया की पुनरावृत्ति बताता है। ‘फिर ... पुकारा’ स्वाभाविक हिन्दी में वही अर्थ देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: בַּשְּׁלִשִׁית
  choice: तीसरी बार
  rationale: यह पदबंध पुकारे जाने की तीसरी घटना को स्पष्ट रूप से दर्शाता है।
- source_word: וַיָּקָם
  choice: वह उठा
  rationale: कथात्मक संदर्भ में यह आधुनिक, संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: וַיֵּלֶךְ אֶל־עֵלִי
  choice: एली के पास जाकर
  rationale: यह एली की ओर जाने की गति को सहज हिन्दी कथन में व्यक्त करता है।
- source_word: הִנֶּנִּי
  choice: मैं यहाँ हूँ
  rationale: पुकार के उत्तर में तत्पर उपस्थिति व्यक्त करने वाला स्वाभाविक हिन्दी मुहावरा है।
- source_word: כִּי קָרָאתָ לִי
  choice: क्योंकि आपने मुझे पुकारा
  rationale: כִּי यहाँ शमूएल के आने का कारण देता है; एली के प्रति आदरसूचक ‘आपने’ हिन्दी संदर्भ में उचित है।
- source_word: וַיָּבֶן
  choice: समझ गया
  rationale: בין यहाँ परिस्थिति को पहचान लेने या समझने का बोध देता है; ‘समझ गया’ सरल और सटीक है।
- source_word: קֹרֵא
  choice: पुकार रहे हैं
  rationale: इब्रानी कृदंत जारी या उस समय घट रही क्रिया का भाव रखता है; हिन्दी का प्रगतिशील रूप इसे बनाए रखता है।
- source_word: לַנָּעַר
  choice: उस लड़के को
  rationale: נַעַר की आयु-सीमा संदर्भ पर निर्भर है; यहाँ एली की देखरेख में सेवक शमूएल के लिए ‘लड़का’ उपयुक्त है। ‘उस’ से पहले उल्लिखित शमूएल स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है। उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन सरल किंतु गरिमापूर्ण है। एली के लिए संवाद में आदरसूचक ‘आप’ और याहवे के लिए आदरसूचक बहुवचन क्रियारूप ‘पुकार रहे हैं’ रखा गया है।
