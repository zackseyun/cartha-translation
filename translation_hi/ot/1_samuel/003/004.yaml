  footnotes:
  - marker: a
    text: 'हिब्रू: YHWH; इसे ‘यहोवा’ भी लिखा जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: पुकारा
  rationale: קרא का क़ाल वय्यिक्तोल कथात्मक क्रम में श्रव्य पुकार को व्यक्त करता है; हिंदी में ‘पुकारा’ स्वाभाविक है और प्रसंग के अनुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को शीर्षक से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से लिप्यंतरित किया गया है।
- source_word: אֶל
  choice: को
  rationale: यह संबंधबोधक पुकार के संबोधित व्यक्ति को चिह्नित करता है; ‘शमूएल को पुकारा’ स्वाभाविक हिंदी है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिवाचक नाम का हिंदी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: וַיֹּאמֶר
  choice: और उसने कहा
  rationale: אמר के कथात्मक वय्यिक्तोल का सीधा अनुवाद; संदर्भ से निहित कर्ता शमूएल है, पर मूल की तरह सर्वनाम से हल्की संदर्भगत अस्पष्टता बनी रहती है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: उपस्थिति और तत्परता जताने वाला रूढ़ उत्तर; यह आधुनिक हिंदी में सहज है और ‘देख, मैं’ जैसे अतिशाब्दिक रूप से अधिक स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम है। हिंदी पाठकों के लिए प्रतिष्ठित और पहचाना हुआ लिप्यंतरण ‘यहोवा’ रखा गया; ‘याहवे’ संभावित वैकल्पिक उच्चारण है।
- issue: וַיֹּאמֶר के निहित कर्ता की पहचान
  choice: उसने
  alternative: शमूएल ने
  rationale: प्रसंग में बोलने वाला शमूएल है, किंतु मूल पाठ उसका नाम दोबारा नहीं कहता। ‘उसने’ मूल की अभिव्यक्ति और संदर्भगत तनाव को अधिक निकटता से सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली। शब्दावली सामान्य पाठक के लिए सहज रखी गई है; ईश्वरीय नाम को उपाधि से प्रतिस्थापित नहीं किया गया।
