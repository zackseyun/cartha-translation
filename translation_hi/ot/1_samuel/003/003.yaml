  text: וְ/נֵ֤ר אֱלֹהִים֙ טֶ֣רֶם יִכְבֶּ֔ה וּ/שְׁמוּאֵ֖ל שֹׁכֵ֑ב בְּ/הֵיכַ֣ל יְהוָ֔ה אֲשֶׁר שָׁ֖ם אֲר֥וֹן אֱלֹהִֽים־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/003.yaml
  text: And the lamp of God had not yet gone out[a], and Samuel was lying down in the temple of Yahweh, where the ark of God was.
translation:
  language: hi
  text: और परमेश्वर का दीपक अभी बुझा नहीं था, और शमूएल याहवे के मंदिर[a] में लेटा हुआ था, जहाँ परमेश्वर का संदूक था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के पवित्रस्थान में।” इब्रानी הֵיכָל का अर्थ ‘मंदिर’ या ‘पवित्रस्थान’ हो सकता है; यहाँ इससे शीलो में याहवे के निवास-स्थान का बोध होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֵר אֱלֹהִים
  choice: परमेश्वर का दीपक
  rationale: נֵר का ठोस अर्थ ‘दीपक’ है, केवल सामान्य ‘ज्योति’ नहीं। संबंधवाचक रचना को स्वाभाविक हिन्दी में ‘परमेश्वर का दीपक’ रखा गया है; प्रसंग में यह उपासना-स्थान का दीपक है।
- source_word: טֶרֶם יִכְבֶּה
  choice: अभी बुझा नहीं था
  rationale: טֶרֶם किसी क्रिया के अब तक घटित न होने का बोध कराता है, और दीपक के साथ כבה का स्वाभाविक हिन्दी रूप ‘बुझना’ है। यह अनुवाद कर्तृवाच्य की सहजता और समय-संबंध दोनों बनाए रखता है।
- source_word: שֹׁכֵב
  choice: लेटा हुआ था
  rationale: यह कृदन्त शमूएल की लेटी हुई अवस्था बताता है। ‘सो रहा था’ कहना मूल से अधिक अर्थ जोड़ता, इसलिए तटस्थ ‘लेटा हुआ था’ चुना गया है।
- source_word: הֵיכַל יְהוָה
  choice: याहवे के मंदिर
  rationale: הֵיכָל का अर्थ मंदिर, राजमहल या पवित्रस्थान हो सकता है। इस उपासना-संबंधी प्रसंग में ‘मंदिर’ सहज है, जबकि शीलो के तंबू-आधारित उपासना-स्थान को देखते हुए ‘पवित्रस्थान’ की वैकल्पिक सम्भावना पादटिप्पणी में रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: אֲשֶׁר שָׁם אֲרוֹן אֱלֹהִים
  choice: जहाँ परमेश्वर का संदूक था
  rationale: यह संबंधवाचक उपवाक्य उस स्थान की पहचान वहाँ परमेश्वर का संदूक होने से कराता है। मूल में ‘वाचा’ शब्द नहीं है, इसलिए उसे जोड़ा नहीं गया।
theological_decisions:
- issue: राजतंत्र-पूर्व शीलो के उपासना-स्थान में הֵיכַל יְהוָה का अनुवाद
  choice: याहवे के मंदिर
  alternative: याहवे के पवित्रस्थान
  rationale: ‘मंदिर’ הֵיכָל का वैध और सामान्य अर्थ है, पर यह सुलेमान के बाद के मंदिर का संकेत आवश्यक रूप से नहीं देता। ऐतिहासिक परिवेश के कारण ‘पवित्रस्थान’ भी वास्तविक सम्भावना है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- issue: שֹׁכֵב से शमूएल के सोने का निष्कर्ष
  choice: लेटा हुआ था
  alternative: सो रहा था
  rationale: मूल शब्द लेटी हुई अवस्था स्पष्ट करता है, पर अपने आप में नींद को अनिवार्य नहीं बनाता। अनुवाद इस अस्पष्टता को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और स्रोत-सन्निकट शैली रखी गई है। वाक्य के जुड़े हुए उपवाक्य इब्रानी कथन-प्रवाह को बनाए रखते हैं। ‘परमेश्वर का संदूक’ मूल की रचना को सुरक्षित रखता है और ‘वाचा’ जैसा अनुपस्थित स्पष्टीकरण नहीं जोड़ता।
