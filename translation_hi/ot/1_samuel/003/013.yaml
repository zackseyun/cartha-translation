source:
  edition: WLC
  text: וְ/הִגַּ֣דְתִּי ל֔/וֹ כִּֽי שֹׁפֵ֥ט אֲנִ֛י אֶת בֵּית֖/וֹ עַד עוֹלָ֑ם בַּ/עֲוֺ֣ן אֲשֶׁר יָדַ֗ע כִּֽי מְקַֽלְלִ֤ים לָ/הֶם֙ בָּנָ֔י/ו וְ/לֹ֥א כִהָ֖ה בָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/013.yaml
  text: And I have declared to him that I am judging his house forever for the iniquity that he knew[a], because his sons were cursing God, and he did not restrain them.
translation:
  language: hi
  text: मैंने उसे बता दिया है कि जिस अधर्म को वह जानता था, उसके कारण मैं उसके घराने का न्याय सदा के लिए कर रहा हूँ, क्योंकि उसके बेटे अपने ही ऊपर शाप ला रहे थे[a], और उसने उन्हें नहीं रोका।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'कुछ प्राचीन साक्षियों और अनेक अनुवादों में वैकल्पिक पाठ है: “उसके बेटे परमेश्वर को शाप दे रहे थे,” या “परमेश्वर की निन्दा कर रहे थे।”'
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִגַּדְתִּי
  choice: मैंने उसे बता दिया है
  rationale: हिफ़ील रूप किसी बात को प्रकट करने या बता देने का भाव देता है; पूर्ण क्रिया को वर्तमान प्रसंग में प्रभावी पूर्व घोषणा के रूप में व्यक्त किया गया है।
- source_word: שֹׁפֵט אֲנִי
  choice: मैं ... न्याय ... कर रहा हूँ
  rationale: कृदन्त के साथ स्पष्ट सर्वनाम चल रहे या निकटस्थ निर्णायक कार्य की गंभीरता प्रकट करता है; इसे केवल साधारण भविष्यकाल नहीं बनाया गया।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: ‘घराना’ हिन्दी में परिवार, वंश और कुल—इन सबकी व्यापकता को समेटता है और इब्रानी मुहावरे को अनावश्यक रूप से संकुचित नहीं करता।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी और अपरिवर्तनीय अवधि की गंभीरता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּעֲוֺן
  choice: अधर्म के कारण
  rationale: עָוֹן नैतिक कुटिलता, पाप और उससे जुड़ी दोषिता का भाव रखता है; ‘अधर्म’ इस गंभीरता को बनाए रखता है।
- source_word: יָדַע
  choice: वह जानता था
  rationale: यह एली की जानकारी और इसलिए उसकी उत्तरदायित्वपूर्ण दोषिता को सीधे रूप में व्यक्त करता है।
- source_word: מְקַלְלִים לָהֶם
  choice: अपने ही ऊपर शाप ला रहे थे
  rationale: मसोरेटी व्यंजन-पाठ का स्वाभाविक अर्थ स्वयं पर शाप लाने का है। ‘ही’ आत्मवाचक बल को स्पष्ट करता है, जबकि वैकल्पिक प्राचीन पाठ को पादटिप्पणी में रखा गया है।
- source_word: וְלֹא כִהָה בָּם
  choice: और उसने उन्हें नहीं रोका
  rationale: क्रिया का मूल भाव कुंठित, निर्बल या नियंत्रित करना है; प्रसंग में ‘नहीं रोका’ एली द्वारा अपने बेटों पर अंकुश न लगाने को स्पष्ट और स्वाभाविक ढंग से बताता है।
theological_decisions:
- issue: बेटों के अपराध के विषय में मसोरेटी पाठ और कुछ प्राचीन साक्षियों में सुरक्षित वैकल्पिक पाठ
  choice: मुख्य पाठ में ‘अपने ही ऊपर शाप ला रहे थे’
  alternative: ‘परमेश्वर को शाप दे रहे थे’ अथवा ‘परमेश्वर की निन्दा कर रहे थे’
  rationale: उपलब्ध मसोरेटी व्यंजन-पाठ आत्मवाचक अर्थ का समर्थन करता है, जबकि कुछ प्राचीन साक्षी और अनेक अनुवाद परमेश्वर को शाप देने का पाठ दर्शाते हैं। मूल-पाठ की प्रधानता और वास्तविक पाठगत तनाव बनाए रखने के लिए मसोरेटी अर्थ मुख्य पाठ में और विकल्प पादटिप्पणी में रखा गया है।
- issue: ‘उसके घर’ पर न्याय का दायरा
  choice: ‘उसके घराने’—दायरा जानबूझकर व्यापक रखा गया
  alternative: ‘उसके परिवार’ या ‘उसके वंश’
  rationale: इब्रानी ‘घर’ निकट परिवार और आगे चलने वाले वंश दोनों को समेट सकता है; ‘घराना’ किसी एक अर्थ को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गंभीर पर सामान्य पाठक के लिए सुबोध रखी गई है। ‘घराना’, ‘अधर्म’ और ‘न्याय करना’ बाइबलीय गरिमा बनाए रखते हैं। पादटिप्पणी-चिह्न उसी विवादित वाक्यांश के तुरंत बाद रखा गया है जिससे उसका संबंध स्पष्ट रहे।
