  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר עֵלִ֣י לִ/שְׁמוּאֵל֮ לֵ֣ךְ שְׁכָב֒ וְ/הָיָה֙ אִם יִקְרָ֣א אֵלֶ֔י/ךָ וְ/אָֽמַרְתָּ֙ דַּבֵּ֣ר יְהוָ֔ה כִּ֥י שֹׁמֵ֖עַ עַבְדֶּ֑/ךָ וַ/יֵּ֣לֶךְ שְׁמוּאֵ֔ל וַ/יִּשְׁכַּ֖ב בִּ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/009.yaml
  text: Then Eli said to Samuel[a], “Go, lie down, and if he calls to you, you shall say, ‘Speak, Yahweh, for your servant is listening.’” So Samuel went and lay down in his place.
translation:
  language: hi
  text: तब एली ने शमूएल से कहा, “जा, लेट जा। और यदि वह तुझे पुकारे, तो कहना, ‘बोल, याहवे[a], क्योंकि तेरा सेवक सुन रहा है।’” तब शमूएल जाकर अपने स्थान पर लेट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है। इसे कुछ हिन्दी अनुवादों में “यहोवा” और कुछ में “प्रभु” लिखा जाता है।
    reason: ईश्वरीय नाम के वैकल्पिक पारंपरिक निरूपण स्पष्ट करना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब एली ने ... कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לֵךְ שְׁכָב
  choice: जा, लेट जा
  rationale: दोनों आज्ञार्थक क्रियाओं की सीधी अभिव्यक्ति रखी गई है; मूल में स्पष्ट रूप से न होने के कारण ‘सो जा’ नहीं जोड़ा गया।
- source_word: וְהָיָה אִם
  choice: और यदि
  rationale: यह शर्त सूचित करता है; ‘जब’ कहने से मूल की अपेक्षा निश्चितता बढ़ जाती।
- source_word: יִקְרָא אֵלֶיךָ
  choice: वह तुझे पुकारे
  rationale: क्रिया का कर्ता मूल में व्यक्त नहीं है, पर निकटवर्ती संदर्भ में एली पुकारने वाले को याहवे समझ चुका है; ‘वह’ इसी निहित कर्ता को बनाए रखता है।
- source_word: וְאָמַרְתָּ
  choice: तो कहना
  rationale: शर्त के परिणामस्वरूप दी गई आज्ञा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דַּבֵּר
  choice: बोल
  rationale: सरल आज्ञार्थक रूप मूल की प्रत्यक्षता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह बोलने के अनुरोध का कारण प्रस्तुत करता है।
- source_word: שֹׁמֵעַ
  choice: सुन रहा है
  rationale: कृदन्त का जारी और सजग श्रवण का भाव व्यक्त होता है।
- source_word: עַבְדֶּךָ
  choice: तेरा सेवक
  rationale: यहाँ עבד विनम्र आत्म-संबोधन है; ‘सेवक’ प्रसंगानुकूल है और दासत्व पर अनावश्यक बल नहीं देता।
- source_word: וַיֵּלֶךְ ... וַיִּשְׁכַּב
  choice: तब शमूएल जाकर ... लेट गया
  rationale: क्रमिक क्रियाएँ एली के निर्देश के बाद शमूएल की कार्रवाई को आगे बढ़ाती हैं।
- source_word: בִּמְקוֹמוֹ
  choice: अपने स्थान पर
  rationale: मूल के निर्दिष्ट स्थान के भाव को बिना ‘सामान्य’ जैसी अतिरिक्त व्याख्या जोड़े व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है; ‘प्रभु’ नाम को उपाधि से बदल देता, जबकि ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
- issue: יִקְרָא का अव्यक्त कर्ता
  choice: वह तुझे पुकारे
  alternative: कोई तुझे पुकारे
  rationale: इब्रानी में कर्ता अव्यक्त है, किंतु तत्काल संदर्भ बताता है कि एली ने पुकारने वाले को याहवे के रूप में पहचाना है। ‘वह’ इस संदर्भगत निष्कर्ष को रखता है, फिर भी इस उपवाक्य में नाम नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण कथात्मक शैली रखी गई है। एली और शमूएल के परिचित वरिष्ठ-कनिष्ठ संबंध तथा परमेश्वर के प्रति सेवक-संबोधन के अनुरूप एकवचन ‘तू’ के रूप (‘जा’, ‘तुझे’, ‘तेरा’) प्रयुक्त हैं।
