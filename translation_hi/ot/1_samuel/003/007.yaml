    text: या, “शमूएल ने अभी तक याहवे को पहचाना नहीं था”; इब्रानी में “जानना” व्यक्तिगत, अनुभवजन्य या संबंधपरक ज्ञान को भी व्यक्त कर सकता है, विशेषकर ईश्वरीय प्रकाशन के संदर्भ में।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH; परंपरागत रूप से इसका अनुवाद “प्रभु” किया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: טֶרֶם
  choice: अभी तक नहीं
  rationale: यह पद में उस अवस्था को दर्शाता है जो उस समय तक घटित नहीं हुई थी; आधुनिक हिन्दी में ‘अभी तक नहीं’ स्वाभाविक और कालगत अर्थ के अनुरूप है।
- source_word: יָדַע אֶת־יְהוָה
  choice: याहवे को जानता था
  rationale: יָדַע यहाँ केवल तथ्यात्मक जानकारी नहीं, बल्कि व्यक्तिगत या अनुभवजन्य पहचान का भाव भी रख सकता है। ‘जानता था’ मूल की व्यापकता और संदर्भगत तनाव को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी व्यक्तिगत नाम YHWH का निकट लिप्यंतरण है; इसे किसी उपाधि से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: יִגָּלֶה
  choice: प्रकट नहीं हुआ था
  rationale: נפעל रूप का प्रकट होने या उद्घाटित होने का भाव सुरक्षित रहता है; पूर्वपूर्ण भूतकाल कथात्मक पृष्ठभूमि के अनुकूल है।
- source_word: אֵלָיו
  choice: उस पर
  rationale: दिव्य वचन के किसी व्यक्ति पर प्रकट होने के लिए यह स्वाभाविक हिन्दी प्रयोग है और इब्रानी संबंध को व्यक्त करता है।
- source_word: דְּבַר יְהוָה
  choice: याहवे का वचन
  rationale: यह मानक भविष्यद्वाणी-संबंधी पदबंध है; ‘वचन’ मूल बाइबलीय मुहावरे और उसके धार्मिक भार को बनाए रखता है।
- source_word: וּשְׁמוּאֵל
  choice: शमूएल
  rationale: आरम्भिक ו यहाँ व्याख्यात्मक कथन को जोड़ता है; हिन्दी में अलग संयोजक जोड़े बिना नाम से आरम्भ करना स्वाभाविक है और स्रोत में निहित न होने वाला ‘अब’ नहीं जोड़ता।
theological_decisions:
- issue: ‘शमूएल अभी तक याहवे को नहीं जानता था’ का अर्थ
  choice: ‘जानता था’ को व्यापक और संदर्भ-निर्धारित रखा गया है; अगला खंड संकेत देता है कि बात प्रत्यक्ष भविष्यद्वाणी-संबंधी प्रकाशन या पहचान की हो सकती है।
  alternative: इसे शमूएल की परमेश्वर के विषय में पूर्ण अज्ञानता या उसके आत्मिक परिवर्तन के अभाव का स्पष्ट कथन मानना।
  rationale: मूल क्रिया संबंधपरक या अनुभवजन्य ज्ञान का अर्थ दे सकती है, पर पद स्वयं किसी व्यवस्थित धर्मसैद्धांतिक निष्कर्ष को स्पष्ट नहीं करता। इसलिए अनुवाद अस्पष्टता और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘याहवे का वचन’ बाइबलीय मुहावरा सुरक्षित रखता है, जबकि ‘उस पर प्रकट हुआ’ सामान्य पाठक के लिए स्वाभाविक है।
