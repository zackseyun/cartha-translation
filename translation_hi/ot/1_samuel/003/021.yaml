source:
  edition: WLC
  text: וַ/יֹּ֥סֶף יְהוָ֖ה לְ/הֵרָאֹ֣ה בְ/שִׁלֹ֑ה כִּֽי נִגְלָ֨ה יְהוָ֧ה אֶל שְׁמוּאֵ֛ל בְּ/שִׁל֖וֹ בִּ/דְבַ֥ר יְהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/021.yaml
  text: And Yahweh continued to appear at Shiloh[a], for Yahweh revealed himself to Samuel at Shiloh by the word of Yahweh.
translation:
  language: hi
  text: और याहवे शीलो में फिर प्रकट होते रहे, क्योंकि याहवे ने शीलो में शमूएल को याहवे के वचन के द्वारा[a] अपने आप को प्रकट किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के वचन के माध्यम से।”
    reason: इब्रानी पूर्वसर्ग ב यहाँ साधन का भाव देता है; ‘के द्वारा’ और ‘के माध्यम से’ दोनों स्वाभाविक हिंदी रूप हैं।
lexical_decisions:
- source_word: וַיֹּסֶף
  choice: फिर ... होते रहे
  rationale: יָסַף के साथ infinitive यहाँ पुनरावृत्ति और निरंतरता दोनों व्यक्त करता है; यह हिंदी प्रयोग दोनों भावों को स्वाभाविक रूप से रखता है।
- source_word: לְהֵרָאֹה
  choice: प्रकट होते रहे
  rationale: ראה के Niphal रूप का आशय दिखाई देने या स्वयं को प्रकट करने से है; संदर्भ में यह ईश्वरीय प्रकटन के लिए स्वाभाविक हिंदी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- source_word: בְשִׁלֹה / בְשִׁלוֹ
  choice: शीलो में
  rationale: ב यहाँ स्थानवाचक है; हिंदी में नगर अथवा पवित्रस्थान के लिए ‘शीलो में’ स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है।
- source_word: נִגְלָה
  choice: अपने आपको ... प्रकट किया
  rationale: גלה का Niphal यहाँ आत्म-प्रकाशन व्यक्त करता है। इससे पहले प्रयुक्त ראה के प्रकटन-संबंधी भाव से संबंध भी बना रहता है, पर दोनों इब्रानी क्रियाएँ एक ही ढंग से नहीं मिटाई जातीं।
- source_word: אֶל שְׁמוּאֵל
  choice: शमूएल पर
  rationale: נִגְלָה אֶל की दिशा-सूचक रचना को हिंदी में ‘किसी पर अपने आपको प्रकट करना’ स्वाभाविक और अर्थानुकूल रूप से व्यक्त करता है।
- source_word: בִּדְבַר יְהוָה
  choice: याहवे के वचन के द्वारा
  rationale: ב को साधनवाचक समझते हुए यह बताता है कि प्रकटन याहवे के वचन के माध्यम से हुआ; याहवे नाम की मूल पुनरावृत्ति बनाए रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा प्रभु
  rationale: मूल में व्यक्तिगत नाम स्पष्ट रूप से है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल उपाधि में नहीं बदलता।
- issue: ईश्वरीय प्रकटन का स्वरूप
  choice: प्रकट होते रहे / अपने आपको प्रकट किया
  alternative: इसे केवल दर्शन या देहधारी प्रत्यक्ष उपस्थिति के रूप में स्पष्ट करना
  rationale: पद वास्तविक ईश्वरीय आत्म-प्रकाशन की बात करता है और उसे याहवे के वचन से जोड़ता है, पर उसके दृश्य, स्वप्नगत या देहधारी माध्यम को निश्चित नहीं करता; अनुवाद इस अनिर्धारितता को बनाए रखता है।
- issue: בִּדְבַר יְהוָה में ב का संबंध
  choice: वचन के द्वारा
  alternative: वचन में
  rationale: संदर्भ में साधनवाचक अर्थ सबसे संभावित है, पर इब्रानी संबंध को स्थान/क्षेत्रसूचक रूप में समझने की संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ और ‘शीलो’ जैसे नाम देवनागरी में सीधे दिए गए हैं। मूल की याहवे-नाम वाली पुनरावृत्ति जानबूझकर बनाए रखी गई है, भले हिंदी में वह कुछ अधिक औपचारिक लगे।
