source:
  edition: WLC
  text: וְ/הַ/נַּ֧עַר שְׁמוּאֵ֛ל מְשָׁרֵ֥ת אֶת יְהוָ֖ה לִ/פְנֵ֣י עֵלִ֑י וּ/דְבַר יְהוָ֗ה הָיָ֤ה יָקָר֙ בַּ/יָּמִ֣ים הָ/הֵ֔ם אֵ֥ין חָז֖וֹן נִפְרָֽץ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/001.yaml
  text: The boy Samuel was ministering to Yahweh before Eli[a], and the word of Yahweh was rare in those days; visions were not widespread.
translation:
  language: hi
  text: बालक शमूएल एली के सामने यहोवा की सेवा कर रहा था। उन दिनों यहोवा का वचन दुर्लभ था; दर्शन प्रायः नहीं होते थे[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई दर्शन बार-बार नहीं होता था,” अथवा अधिक शब्दशः, “दर्शन फूटकर नहीं निकलता था।” इब्रानी मुहावरे का आशय है कि प्रकाशनात्मक दर्शन विरले थे और व्यापक रूप से प्रकट नहीं हो रहे थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: बालक
  rationale: הַנַּעַר का अर्थ बालक/किशोर है; कथा में शमूएल की अवस्था को देखते हुए ‘बालक’ स्वाभाविक है। आरंभिक וְ को हिंदी में अनावश्यक ‘और’ से नहीं दर्शाया गया।
- source_word: מְשָׁרֵת אֶת יְהוָה
  choice: यहोवा की सेवा कर रहा था
  rationale: कृदंत निरंतर चल रही सेवा दर्शाता है। हिंदी में ‘सेवा कर रहा था’ इस कालगत अर्थ और धार्मिक सेवा के भाव दोनों को सहज रूप से व्यक्त करता है।
- source_word: לִפְנֵי עֵלִי
  choice: एली के सामने
  rationale: לִפְנֵי का मूल अर्थ ‘के सामने/उपस्थिति में’ है। यह अनुवाद शब्दार्थ बनाए रखता है और प्रसंग में एली की देखरेख का संकेत भी रहने देता है।
- source_word: וּ/דְבַר יְהוָה
  choice: यहोवा का वचन
  rationale: यह ईश्वरीय प्रकाशन के लिए प्रयुक्त इब्रानी पदबंध का पारदर्शी और प्रचलित हिंदी रूप है।
- source_word: יָקָר
  choice: दुर्लभ
  rationale: यद्यपि शब्द का अर्थ ‘बहुमूल्य’ भी हो सकता है, यहाँ अगले उपवाक्य के समानांतर प्रकाशन के कम मिलने का अर्थ अभिप्रेत है।
- source_word: אֵין חָזוֹן נִפְרָץ
  choice: दर्शन प्रायः नहीं होते थे
  rationale: मुहावरे का आशय है कि प्रकाशनात्मक दर्शन सामान्य या बार-बार प्रकट नहीं हो रहे थे। यह सहज हिंदी में उसी आशय को रखता है, जबकि ‘फूट निकलना’ जैसा शब्दशः रूप अस्पष्ट होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी पाठकों के लिए परिचित रूप ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से अलग रखते हुए प्रस्तुत करता है।
- issue: חָזוֹן को एकवचन या सामूहिक अर्थ में लेना
  choice: दर्शन
  alternative: कोई दर्शन
  rationale: यहाँ एकवचन संज्ञा सामूहिक रूप से प्रकाशनात्मक दर्शनों की उपलब्धता बताती है; हिंदी का ‘दर्शन’ संदर्भानुसार बहुवचन भाव व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक शैली। ‘यहोवा का वचन’ और ‘दर्शन’ जैसे बाइबलीय पद बनाए गए हैं, पर अंतिम उपवाक्य को अपारदर्शी शब्दशः मुहावरे के बजाय सहज हिंदी में व्यक्त किया गया है।
