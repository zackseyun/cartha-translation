  edition: WLC
  text: וַ/יֵּ֨דַע֙ כָּל יִשְׂרָאֵ֔ל מִ/דָּ֖ן וְ/עַד בְּאֵ֣ר שָׁ֑בַע כִּ֚י נֶאֱמָ֣ן שְׁמוּאֵ֔ל לְ/נָבִ֖יא לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/020.yaml
  text: And all Israel from Dan to Beer-sheba knew that Samuel was established as a prophet of Yahweh[a].
translation:
  language: hi
  text: और दान से लेकर बेर्शेबा तक समस्त इस्राएल जान गया कि शमूएल यहोवा का भविष्यद्वक्ता प्रमाणित हुआ था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमूएल यहोवा का भविष्यद्वक्ता स्थापित हुआ था।” इब्रानी शब्द का अर्थ स्थापित, प्रमाणित, या विश्वसनीय सिद्ध होना हो सकता है।
    reason: נֶאֱמָן की अर्थ-व्याप्ति सुरक्षित रखता है और ‘विश्वसनीय’ को पद/भूमिका की सार्वजनिक पुष्टि के संदर्भ में रखता है।
lexical_decisions:
- source_word: וַיֵּדַע
  choice: जान गया
  rationale: यहाँ क्रिया उस सार्वजनिक पहचान को व्यक्त करती है जिस पर पूरा इस्राएल पहुँचा; ‘जान गया’ स्वाभाविक हिन्दी है और कथानक की परिणति भी दिखाता है।
- source_word: כָּל יִשְׂרָאֵל
  choice: समस्त इस्राएल
  rationale: यह सामूहिक राष्ट्रीय अभिव्यक्ति को बनाए रखता है और गरिमापूर्ण आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִדָּן וְעַד בְּאֵר שָׁבַע
  choice: दान से लेकर बेर्शेबा तक
  rationale: मूल भौगोलिक युग्म पूरे देश की सीमा का संकेत देता है; स्थान-नाम बनाए रखने से मूल मुहावरे की ठोस छवि सुरक्षित रहती है।
- source_word: נֶאֱמָן
  choice: ठहराया गया
  rationale: निफ़अल रूप यहाँ शमूएल के विश्वसनीय या प्रमाणित भविष्यद्वक्ता के रूप में स्थापित होने का भाव देता है। ‘ठहराया गया’ उस सार्वजनिक पुष्टि को व्यक्त करता है, यद्यपि ‘विश्वसनीय सिद्ध हुआ’ भी संभव है।
- source_word: לְנָבִיא
  choice: भविष्यद्वक्ता
  rationale: लाम भूमिका या हैसियत दर्शाता है; हिन्दी वाक्य-विन्यास में ‘यहोवा का भविष्यद्वक्ता ठहराया गया’ इसे सहज रूप से व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा का
  rationale: लाम यहाँ संबंध या संबद्धता बताता है—शमूएल यहोवा की ओर से नियुक्त और उससे संबंधित भविष्यद्वक्ता है। दिव्य नाम को ‘यहोवा’ के रूप में स्पष्ट रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ से उसे उपाधि में बदले बिना सुरक्षित रखा जाता है।
- issue: נֶאֱמָן द्वारा शमूएल की भविष्यद्वक्ताई की पुष्टि
  choice: भविष्यद्वक्ता ठहराया गया
  alternative: भविष्यद्वक्ता के रूप में विश्वसनीय सिद्ध हुआ / प्रमाणित हुआ
  rationale: निकटवर्ती संदर्भ में शमूएल के वचनों का पूरा होना उसकी भविष्यद्वक्ताई को सार्वजनिक रूप से स्थापित करता है। मुख्य पाठ नियुक्ति की किसी बाद की तकनीकी धारणा को जोड़े बिना यह भाव देता है; पादटिप्पणी मूल की अर्थ-व्याप्ति सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य हिन्दी। ‘समस्त इस्राएल’ सामूहिक अभिव्यक्ति को बनाए रखता है; ‘दान से लेकर बेर्शेबा तक’ मूल भौगोलिक मुहावरे को बिना अनावश्यक व्याख्या के सुरक्षित रखता है।
