source:
  edition: WLC
  text: וַ/יַּגֶּד ל֤/וֹ שְׁמוּאֵל֙ אֶת כָּל הַ/דְּבָרִ֔ים וְ/לֹ֥א כִחֵ֖ד מִמֶּ֑/נּוּ וַ/יֹּאמַ֕ר יְהוָ֣ה ה֔וּא הַ/טּ֥וֹב בְּ/עֵינָ֖/ו יַעֲשֶֽׂה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/018.yaml
  text: So Samuel told him all the words and hid nothing from him[a]. And he said, “He is Yahweh[b]; let him do what is good in his eyes.”
translation:
  language: hi
  text: तब शमूएल ने उसे सारी बातें बता दीं और उससे कुछ भी न छिपाया। उसने कहा, “वह याहवे ही है; वह करे[b] जो उसकी दृष्टि में अच्छा है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जो उसकी आँखों में अच्छा है”; यह मुहावरा उसके अपने निर्णय के अनुसार अच्छा या उचित होने को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह करेगा।” हिब्रू अपूर्ण क्रिया को अधीन स्वीकृति—“वह करे”—या साधारण भविष्य, दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּגֶּד לוֹ שְׁמוּאֵל
  choice: तब शमूएल ने उसे ... बता दीं
  rationale: नגד के हिफ़ील रूप का अर्थ यहाँ किसी को बात बताना या प्रकट करना है। ‘बता दीं’ सहज आधुनिक हिन्दी है और पूर्ण सूचना देने का भाव व्यक्त करता है।
- source_word: אֶת כָּל הַדְּבָרִים
  choice: सारी बातें
  rationale: דְּבָרִים का अर्थ ‘बातें/वचन/विषय’ हो सकता है। इस प्रसंग में ‘सारी बातें’ मूल की व्यापकता बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: וְלֹא כִחֵד מִמֶּנּוּ
  choice: और उससे कुछ भी न छिपाया
  rationale: כחד का अर्थ छिपाना या रोक रखना है। यह अनुवाद शमूएल द्वारा कुछ भी न छिपाने के जोर को सुरक्षित रखता है।
- source_word: יְהוָה הוּא
  choice: वह याहवे है
  rationale: मूल में स्वतंत्र सर्वनाम הוּא और परमेश्वर का व्यक्तिगत नाम יְהוָה है। यह रूप पहचान और अधिकार पर दिए गए जोर को संक्षिप्त, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הַטּוֹב בְּעֵינָיו
  choice: जो उसकी दृष्टि में अच्छा है
  rationale: शाब्दिक मुहावरा ‘उसकी आँखों में’ किसी के अपने मूल्यांकन में अच्छा होने को दर्शाता है। ‘उसकी दृष्टि में’ हिन्दी में स्वाभाविक रहते हुए वही दृष्टिकोण सुरक्षित रखता है।
- source_word: יַעֲשֶׂה
  choice: वह करे
  rationale: अपूर्ण क्रिया को प्रसंग में एली की अधीन स्वीकृति व्यक्त करने वाले इच्छार्थक भाव में समझा गया है। फिर भी साधारण भविष्य की सम्भावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: एली के अंतिम कथन में יַעֲשֶׂה का भाव
  choice: 'अधीन स्वीकृति: ‘वह करे’'
  alternative: 'साधारण भविष्य: ‘वह करेगा’'
  rationale: न्याय-संदेश के प्रति एली की प्रतिक्रिया इच्छार्थक या अनुमति-सदृश अधीनता के रूप में स्वाभाविक है, पर हिब्रू अपूर्ण क्रिया भविष्यवाचक भी समझी जा सकती है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: הַטּוֹב בְּעֵינָיו में दैवी मूल्यांकन
  choice: जो उसकी दृष्टि में अच्छा है
  alternative: जो उसे उचित लगे
  rationale: चुना हुआ रूप मूल मुहावरे और दैवी निर्णयाधिकार दोनों को बनाए रखता है, बिना ‘अच्छा’ को केवल ‘उचित’ के रूप में व्याख्यायित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और स्रोत-सन्निकट शैली अपनाई गई है। ‘सारी बातें’ बोलचाल की स्पष्टता और मूल की समग्रता दोनों रखता है। कथावाचक के ‘उसने कहा’ को मूल की सर्वनामगत अभिव्यक्ति के अनुरूप रखा गया है; संदर्भ में वक्ता एली है।
