base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/015.yaml
  text: Samuel lay down until morning; then he opened the doors of the house of Yahweh[a]. But Samuel was afraid to tell the vision to Eli.
translation:
  language: hi
  text: शमूएल सुबह तक लेटा रहा। फिर उसने यहोवा के भवन के द्वार खोले। पर शमूएल एली को वह दर्शन[a] बताने से डरता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘प्रकट रूप’। इब्रानी शब्द मַरְאָה किसी दिखाई देने वाले प्रकट रूप या दर्शन में मिले प्रकाशन को सूचित कर सकता है। यहाँ शमूएल को रात में मिले प्रकाशन के प्रसंग में ‘दर्शन’ अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכַּב
  choice: लेटा रहा
  rationale: שׁכב का मूल अर्थ ‘लेटना’ है। पाठ स्पष्ट रूप से यह नहीं कहता कि शमूएल सो गया, इसलिए ‘सोता रहा’ की अपेक्षा ‘लेटा रहा’ अधिक सटीक है।
- source_word: עַד הַבֹּקֶר
  choice: सुबह तक
  rationale: यह समय-सूचक इब्रानी पदबंध का स्वाभाविक और सटीक हिन्दी रूप है।
- source_word: וַיִּפְתַּח אֶת דַּלְתוֹת
  choice: द्वार खोले
  rationale: बहुवचन דַּלְתוֹת को सहज हिन्दी में ‘द्वार’ कहा गया है; क्रिया में निहित साधारण कथात्मक क्रम को ‘फिर’ से व्यक्त किया गया है।
- source_word: בֵּית יְהוָה
  choice: यहोवा के भवन
  rationale: בַּיִת का सीधा अर्थ ‘भवन/घर’ है। ‘मन्दिर’ यहाँ आवश्यकता से अधिक विशिष्ट और संभावित रूप से काल-विसंगत होगा।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है, न कि उपाधि ‘प्रभु’ से।
- source_word: יָרֵא מֵהַגִּיד
  choice: बताने से डरता था
  rationale: ירא के साथ מִן और धातुरूप हिन्दी में स्वाभाविक रूप से ‘कुछ करने से डरना’ बनता है।
- source_word: הַמַּרְאָה
  choice: दर्शन
  rationale: מַרְאָה का अर्थ ‘दिखाई देना/प्रकट रूप’ अथवा दर्शनीय प्रकाशन हो सकता है। रात में मिले ईश्वरीय संदेश के प्रसंग में ‘दर्शन’ उपयुक्त है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: אֶל עֵלִי
  choice: एली को
  rationale: הגיד के साथ אֶל यहाँ संदेश के प्राप्तकर्ता को सूचित करता है; हिन्दी में ‘एली को बताना’ स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त हुआ है। उसे उपाधि से बदलने के बजाय हिन्दी पाठकों में परिचित नामरूप ‘यहोवा’ रखा गया है।
- issue: מַרְאָה की प्रकृति
  choice: दर्शन
  alternative: प्रकट रूप; दिखाई देना
  rationale: प्रसंग इसे शमूएल को रात में मिले प्रकाशन से जोड़ता है, इसलिए ‘दर्शन’ सबसे सहज है; फिर भी शब्द की दृश्य ‘प्रकट रूप’ वाली अर्थ-सम्भावना को पादटिप्पणी में स्वीकार किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘लेटा रहा’ पाठ में नींद का अनावश्यक निष्कर्ष जोड़ने से बचाता है; ‘भवन’ उस समय के पवित्रस्थान के लिए ‘मन्दिर’ से कम विशिष्ट है।
