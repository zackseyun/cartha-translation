base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/011.yaml
  text: Then the LORD said to Samuel, "Look, I am about to do a thing in Israel that will make both ears of everyone who hears of it tingle."
translation:
  language: hi
  text: तब यहोवा ने शमूएल से कहा, “देखो, मैं इस्राएल में ऐसा काम करने वाला हूँ कि जिसके विषय में सुनने वाले हर व्यक्ति के दोनों कान झनझना उठेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित और पहचाने जाने योग्य रूप में रखा गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: ध्यान आकर्षित करने वाले हिब्रू उद्गार की सीधी, स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: אָנֹכִי עֹשֶׂה
  choice: मैं ... करने जा रहा हूँ
  rationale: हिब्रू कृदंत यहाँ निकट भविष्य में होने वाली निश्चित कार्रवाई व्यक्त करता है।
- source_word: דָבָר
  choice: काम
  rationale: संदर्भ में इसका अर्थ कही हुई 'बात' नहीं, बल्कि यहोवा द्वारा किया जाने वाला कार्य या घटना है।
- source_word: תְּצִלֶּינָה שְׁתֵּי אָזְנָיו
  choice: उसके दोनों कान झनझना उठेंगे
  rationale: चौंका देने वाली खबर के तीव्र प्रभाव को व्यक्त करने वाले मूल मुहावरे की सजीवता बनाए रखी गई है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है; इसलिए नाम को नाम के रूप में प्रस्तुत किया गया है।
- issue: आगामी न्याय को स्पष्ट करना
  choice: तटस्थ 'काम'
  alternative: भयानक काम या न्याय
  rationale: इस पद में कार्य का स्वरूप स्पष्ट शब्दों में नहीं बताया गया; आगे के संदर्भ से मिलने वाली व्याख्या को इस वाक्य में जोड़कर अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल के श्रवण-संबंधी मुहावरे को हिन्दी में स्वाभाविक 'कान झनझना उठेंगे' द्वारा सुरक्षित रखा गया है।
