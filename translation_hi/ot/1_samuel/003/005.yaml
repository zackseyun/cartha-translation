  text: He ran to Eli and said, “Here I am, because you called me.” But he said, “I did not call. Go back; lie down.” So he went and lay down.
translation:
  language: hi
  text: वह एली के पास दौड़कर गया और बोला, “मैं यहाँ हूँ, क्योंकि आपने मुझे बुलाया था।” लेकिन एली ने कहा, “मैंने नहीं बुलाया। वापस जाकर लेट जाओ।” तब वह जाकर लेट गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנְנִי
  choice: मैं यहाँ हूँ
  rationale: उपस्थिति और तत्परता बताने वाले इब्रानी कथन का सहज, सीधा हिन्दी रूप।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ शमूएल के एली के पास आने का कारण बताता है; स्रोत की कारणवाचकता सुरक्षित रहती है।
- source_word: שׁוּב שְׁכָב
  choice: वापस जाकर लेट जाओ
  rationale: 'दोनों आज्ञाओं का आशय स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है: लौटना और फिर लेटना।'
theological_decisions:
- issue: पुकारने वाले की पहचान
  choice: शमूएल के कथन में एली को ही पुकारने वाला समझाया गया है
  alternative: यह स्पष्ट करना कि वास्तव में परमेश्वर ने पुकारा था
  rationale: इस पद में शमूएल की तत्काल समझ प्रस्तुत है; कथानक का रहस्य समय से पहले नहीं खोला गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; आदरसूचक ‘आपने’ एली की वरिष्ठता के अनुरूप है। संवाद सरल, स्वाभाविक और गरिमापूर्ण रखा गया है।
