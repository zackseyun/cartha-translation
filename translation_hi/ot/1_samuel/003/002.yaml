translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘अपने स्थान पर’ मूल की अनिश्चितता बनाए रखता है और अनावश्यक रूप से ‘अपने कमरे में’ नहीं कहता। पादटिप्पणी-चिह्न को ‘आँखें’ के बाद रखा गया है, क्योंकि वही उससे संबंधित पाठगत/व्याकरणिक विकल्प है।
