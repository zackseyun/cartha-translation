base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/002.yaml
  text: On that day[a], Eli was lying down in his place, and his eyes had begun to grow dim; he could not see.
translation:
  language: hi
  text: उस दिन एली अपने स्थान पर लेटा हुआ था। उसकी आँखें[a] धुँधली होने लगी थीं; वह देख नहीं सकता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी आँख।” इब्रानी रूप एकवचन पढ़ा जा सकता है, पर यहाँ वह दृष्टि के लिए सामूहिक अर्थ में भी समझा जा सकता है; साथ की क्रिया बहुवचन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह कथात्मक सूत्र उस समय की परिस्थिति सामने रखता है। ‘उस दिन’ בַּיּוֹם הַהוּא का सीधा और स्वाभाविक हिन्दी रूप है; अलग से ‘और ऐसा हुआ’ जोड़ना हिन्दी में अनावश्यक रूप से भारी होता।
- source_word: שֹׁכֵב
  choice: लेटा हुआ था
  rationale: कृदन्त एली की उस समय जारी अवस्था दर्शाता है; ‘लेटा हुआ था’ इस स्थायित्व को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בִּמְקֹמוֹ
  choice: अपने स्थान पर
  rationale: מָקוֹם का अर्थ ‘स्थान’ है। पाठ इसे ‘कमरा’ नहीं कहता, इसलिए स्थान को अधिक विशिष्ट नहीं बनाया गया।
- source_word: וְעֵינוֹ
  choice: उसकी आँखें
  rationale: लिखित/स्वरांकित रूप एकवचन ‘उसकी आँख’ जैसा दिखाई देता है, पर इसके साथ बहुवचन क्रिया הֵחֵלּוּ है और प्रसंग सामान्य दृष्टि का है। इसलिए मुख्य पाठ में स्वाभाविक सामूहिक अर्थ ‘आँखें’ रखा गया और रूपगत अस्पष्टता पादटिप्पणी में बताई गई।
- source_word: הֵחֵלּוּ כֵהוֹת
  choice: धुँधली होने लगी थीं
  rationale: הֵחֵלּוּ आरम्भ को और כֵהוֹת दृष्टि के मंद पड़ने को व्यक्त करता है। यह रूप प्रक्रिया की शुरुआत को बनाए रखता है, न कि उसे पहले ही पूरा हुआ बताता है।
- source_word: לֹא יוּכַל לִרְאוֹת
  choice: वह देख नहीं सकता था
  rationale: यह एली की क्षीण होती दृष्टि का व्यावहारिक परिणाम सीधे और सहज ढंग से व्यक्त करता है।
