  text: וַ/יָּבֹ֤א יְהוָה֙ וַ/יִּתְיַצַּ֔ב וַ/יִּקְרָ֥א כְ/פַֽעַם בְּ/פַ֖עַם שְׁמוּאֵ֣ל שְׁמוּאֵ֑ל וַ/יֹּ֤אמֶר שְׁמוּאֵל֙ דַּבֵּ֔ר כִּ֥י שֹׁמֵ֖עַ עַבְדֶּֽ/ךָ־׀׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/010.yaml
  text: Then Yahweh came and stood there[a], and called as at the other times, “Samuel, Samuel!” And Samuel said, “Speak, for your servant is listening.”
translation:
  language: hi
  text: तब यहोवा आया और वहाँ खड़ा हुआ। उसने पहले की तरह पुकारा, “शमूएल, शमूएल!” शमूएल ने कहा, “बोलिए, क्योंकि आपका सेवक सुन रहा है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप; यह सामान्य उपाधि से अलग परमेश्वर के व्यक्तिगत नाम को दर्शाता है।
- source_word: וַיָּבֹא
  choice: आया
  rationale: בוא का सीधा और स्वाभाविक कथात्मक अनुवाद।
- source_word: וַיִּתְיַצַּב
  choice: वहाँ खड़ा हुआ
  rationale: हित्पएल रूप किसी स्थान पर खड़े होने या अपना स्थान लेने का ठोस भाव देता है; 'वहाँ' दृश्य की स्थानिक उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְרָא
  choice: पुकारा
  rationale: इस प्रसंग में קרא का अर्थ शमूएल को आवाज़ देकर संबोधित करना है; 'पुकारा' स्वर की तीव्रता को अनावश्यक रूप से नहीं बढ़ाता।
- source_word: כְפַעַם בְּפַעַם
  choice: पहले की तरह
  rationale: यह इब्रानी मुहावरा इस पुकार की तुलना पिछली पुकारों से करता है; हिन्दी में यह संक्षिप्त, स्पष्ट और स्वाभाविक है।
- source_word: שְׁמוּאֵל שְׁמוּאֵל
  choice: शमूएल! शमूएल!
  rationale: नाम की पुनरावृत्ति को ज्यों का त्यों रखकर व्यक्तिगत और ज़ोरदार बुलाहट व्यक्त की गई है।
- source_word: דַּבֵּר
  choice: बोल
  rationale: एकवचन पुल्लिंग आज्ञार्थक का सीधा अनुवाद; संबोधन के निकट और व्यक्तिगत स्वर के अनुरूप अनौपचारिक एकवचन रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי शमूएल की तत्परता का कारण प्रस्तुत करता है।
- source_word: שֹׁמֵעַ
  choice: सुन रहा है
  rationale: कृदन्त निरंतर और सजग सुनने की मुद्रा व्यक्त करता है; हिन्दी में यह सक्रिय ध्यान का स्वाभाविक रूप है।
- source_word: עַבְדֶּךָ
  choice: तेरा सेवक
  rationale: संबोधन में यह विनम्र सेवा और अधीनता का पारंपरिक भाव रखता है; इस प्रसंग में 'दास' की अपेक्षा 'सेवक' अधिक सहज और उपयुक्त है।
theological_decisions:
- issue: यहोवा के आगमन और खड़े होने का मानवरूपी वर्णन
  choice: ठोस कथात्मक भाषा ‘आया और वहाँ खड़ा हुआ’ बनाए रखी गई
  alternative: ‘प्रकट हुआ’ या ‘अपनी उपस्थिति प्रकट की’
  rationale: इब्रानी पाठ परमेश्वर की क्रिया को सजीव और व्यक्तिगत रूप में प्रस्तुत करता है। अनुवाद इसे धर्मवैज्ञानिक असुविधा के कारण अमूर्त नहीं करता।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: ‘यहोवा’ आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला विशिष्ट नाम है और मूल पाठ में सामान्य उपाधि के बजाय उपस्थित नाम को बनाए रखता है।
- issue: שֹׁמֵעַ में सुनने और आज्ञापालन का संभावित संबंध
  choice: मुख्य पाठ में ‘सुन रहा है’
  alternative: ‘आज्ञा मानने को तैयार है’
  rationale: שמע कभी-कभी आज्ञापालन तक विस्तृत अर्थ रखता है, पर यहाँ तत्काल संदर्भ वाणी सुनने की तत्परता पर केंद्रित है। निहित आज्ञाकारिता को स्पष्ट जोड़कर अर्थ का अति-निर्धारण नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शमूएल के सीधे व्यक्तिगत संबोधन में ‘तेरा/बोल’ का एकवचन रूप मूल इब्रानी के व्याकरण और निकटता को दर्शाता है। छोटे वाक्य और प्रत्यक्ष कथन मौखिक पठन के लिए स्पष्ट हैं।
