review_pass:
  verdict: revise
  source_fidelity: Draft conveys the central sense, including Eli's oath formula and the warning not to withhold any part of the divine communication. However, it reverses the Hebrew oath-formula order by placing the conditional clause first, and ‘क्या बात’ can idiomatically suggest ‘what is the matter?’ rather than asking for the content of the speech.
  naturalness: The Hindi is generally clear and dignified. ‘कौन-सी बात’ is more precise and natural in this context, and explicitly supplying ‘उसे’ prevents the object of ‘मत छिपाओ’ from being needlessly elliptical. Retaining the oath before the conditional clause is also fully natural in Hindi.
  terminology: ‘परमेश्वर’ is appropriate for אֱלֹהִים in this Israelite oath formula. ‘बात’ is a suitable modern-Hindi rendering of דָּבָר here. ‘उस सारी बात में से कोई भी बात’ preserves the source emphasis that no portion may be concealed without imposing an unnaturally literal repetition.
  issues:
  - severity: medium
    issue: Conditional clause is moved ahead of the oath formula.
    rationale: The Hebrew reads the imprecatory formula first, followed by ‘if you hide...’. The draft’s ‘यदि ... तो परमेश्वर...’ retains the broad meaning but weakens the formal rhetorical shape of the oath.
  - severity: low
    issue: ‘उसने तुमसे क्या बात कही?’ is potentially idiomatic in an unintended sense.
    rationale: In modern Hindi, ‘क्या बात?’ can mean ‘what is the matter?’ or express admiration. ‘कौन-सी बात’ unambiguously asks what was said.
  revised_text: उसने कहा, “उसने तुमसे कौन-सी बात कही? कृपया उसे मुझसे मत छिपाओ। परमेश्वर तुम्हारे साथ ऐसा ही करे, और उससे भी अधिक करे, यदि तुम उस सारी बात में से कोई भी बात मुझसे छिपाओ जो उसने तुमसे कही है।”
  revised_footnotes: []
  revision_rationale: The revision restores the Hebrew sequence of solemn oath formula followed by the conditional warning, clarifies the opening question in idiomatic modern Hindi, and expresses the final ‘a word from all the word’ as withholding no part of the whole communication. No footnote is needed, since the Hindi wording conveys the sense naturally without concealing a material ambiguity.
