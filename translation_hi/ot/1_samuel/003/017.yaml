reference: 1 Samuel 3:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֗אמֶר מָ֤ה הַ/דָּבָר֙ אֲשֶׁ֣ר דִּבֶּ֣ר אֵלֶ֔י/ךָ אַל נָ֥א תְכַחֵ֖ד מִמֶּ֑/נִּי כֹּ֣ה יַעֲשֶׂה לְּ/ךָ֤ אֱלֹהִים֙ וְ/כֹ֣ה יוֹסִ֔יף אִם תְּכַחֵ֤ד מִמֶּ֨/נִּי֙ דָּבָ֔ר מִ/כָּל הַ/דָּבָ֖ר אֲשֶׁר דִּבֶּ֥ר אֵלֶֽי/ךָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/003/017.yaml
  text: And he said[a], “What is the word that he spoke to you? Please do not hide it from me. May God do so to you, and more also, if you hide from me a word of all the word that he spoke to you.”
translation:
  language: hi
  text: उसने कहा, “उसने तुमसे कौन-सी बात कही? कृपया उसे मुझसे मत छिपाओ। परमेश्वर तुम्हारे साथ ऐसा ही करे, और उससे भी अधिक करे, यदि तुम उस सारी बात में से कोई भी बात मुझसे छिपाओ जो उसने तुमसे कही है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָה הַדָּבָר
  choice: क्या बात
  rationale: דָּבָר का अर्थ ‘वचन, बात, संदेश’ हो सकता है। यहाँ ‘क्या बात’ स्वाभाविक हिन्दी है और पूछी जा रही दिव्य वाणी की विषयवस्तु को व्यक्त करती है।
- source_word: דִּבֶּר אֵלֶיךָ
  choice: उसने तुमसे ... कही
  rationale: דבר के ‘कहना/बोलना’ अर्थ को हिन्दी के स्वाभाविक संयोग ‘बात कहना’ से व्यक्त किया गया है।
- source_word: אַל נָא תְכַחֵד מִמֶּנִּי
  choice: कृपया मुझसे मत छिपाओ
  rationale: נָא की विनयात्मक छाया ‘कृपया’ से और כחד का अर्थ ‘छिपाना’ से व्यक्त होता है; कर्म पूर्ववर्ती ‘बात’ से समझा जाता है।
- source_word: כֹּה יַעֲשֶׂה לְּךָ אֱלֹהִים וְכֹה יוֹסִיף
  choice: तो परमेश्वर तुम्हारे साथ ऐसा ही करे, वरन् उससे भी अधिक करे
  rationale: यह शापयुक्त शपथ का रूढ़ सूत्र है। हिन्दी रूप उसके गंभीर शर्तात्मक और अभिशापात्मक बल को स्पष्ट रखते हुए स्वाभाविक है।
- source_word: אִם
  choice: यदि
  rationale: शपथ-सूत्र में אִם शर्त आरम्भ करता है; हिन्दी में ‘यदि ... तो’ से अंतर्निहित परिणाम स्पष्ट और स्वाभाविक होता है।
- source_word: תְּכַחֵד מִמֶּנִּי דָּבָר מִכָּל הַדָּבָר
  choice: उसने तुमसे जो कुछ कहा है, उसमें से तुम मुझसे कुछ भी छिपाओ
  rationale: शाब्दिक पुनरावृत्ति ‘बात ... सारी बात में से एक बात’ हिन्दी में कृत्रिम होती। ‘जो कुछ ... उसमें से ... कुछ भी’ स्रोत का आशय—प्रकाशित वाणी का कोई अंश न छिपाना—बिना घटाए व्यक्त करता है।
theological_decisions:
- issue: शपथ-सूत्र में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: देवता
  rationale: सन्दर्भ में एली इस्राएल के परमेश्वर को रूढ़ शपथ-सूत्र में पुकारता है। व्याकरणिक रूप के बावजूद यहाँ बहुदेववादी अर्थ अभिप्रेत नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘वरन्’ शपथ-सूत्र की गंभीरता बनाए रखता है; वाक्य-विन्यास हिन्दी की स्वाभाविक शर्तात्मक रचना के अनुसार है।
