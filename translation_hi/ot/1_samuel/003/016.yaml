  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא
  choice: बुलाकर
  rationale: कרא यहाँ किसी को आवाज़ देकर बुलाने के अर्थ में है। ‘बुलाकर कहा’ हिन्दी कथा-शैली में स्वाभाविक है और अगले וַיֹּאמֶר के साथ क्रिया-क्रम को स्पष्ट रखता है।
- source_word: עֵלִי
  choice: एली
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; कर्मसूचक אֶת का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: וַיֹּאמֶר
  choice: कहा / उत्तर दिया
  rationale: पहले प्रयोग में אמר का सामान्य अर्थ ‘कहा’ है। दूसरे प्रयोग में वही क्रिया प्रत्युत्तर प्रस्तुत करती है, इसलिए स्वाभाविक हिन्दी में ‘उत्तर दिया’ प्रयुक्त है।
- source_word: שְׁמוּאֵל בְּנִי
  choice: शमूएल, मेरे बेटे!
  rationale: בְּנִי का शाब्दिक और संबंधपरक भाव ‘मेरे बेटे’ है; यह एली के स्नेहपूर्ण संबोधन को बनाए रखता है।
- source_word: הִנֵּנִי
  choice: मैं यहाँ हूँ
  rationale: यह इब्रानी का पारंपरिक प्रत्युत्तर है, जो उपस्थित होने और तत्परता का संकेत देता है। ‘मैं यहाँ हूँ’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וַ
  choice: तब
  rationale: आरंभिक वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिन्दी में व्यक्त करता है।
