  language: en
  yaml_path: translation/ot/1_samuel/003/014.yaml
  text: 'Therefore I have sworn to the house of Eli: the iniquity of Eli’s house shall never be atoned for by sacrifice or offering[a][b].'
translation:
  language: hi
  text: 'इसलिए मैंने एली के घराने के विषय में शपथ खाई है: एली के घराने के अधर्म का बलिदान और अन्नबलि के द्वारा कभी प्रायश्चित नहीं होगा[a][b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एली के घराने के अधर्म का निश्चय ही प्रायश्चित नहीं होगा।” इब्रानी में “मैंने शपथ खाई है” के बाद “यदि” वाला शपथ-सूत्र प्रबल निषेध व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: “अन्नबलि” के लिए इब्रानी शब्द मिन्खा है, जिसका अर्थ भेंट भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָכֵן
  choice: इसलिए
  rationale: यह पिछले न्याय-वचन के परिणाम को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: נִשְׁבַּעְתִּי
  choice: मैंने ... शपथ खाई है
  rationale: पूर्ण हो चुकी, पर वर्तमान में प्रभावी दिव्य शपथ की गंभीरता बनाए रखता है।
- source_word: לְבֵית עֵלִי
  choice: एली के घराने के विषय में
  rationale: लामेद को शपथ के लक्ष्य अथवा विषय के रूप में व्यक्त करता है; हिन्दी में यह 'घराने से शपथ खाई' जैसी संभावित गलतफहमी से बचाता है।
- source_word: אִם
  choice: कभी भी ... नहीं
  rationale: शपथ के बाद אִם प्रबल निषेध का सूत्र है; इसे शाब्दिक 'यदि' कहना हिन्दी में आशय अस्पष्ट कर देगा।
- source_word: יִתְכַּפֵּר
  choice: प्रायश्चित नहीं किया जाएगा
  rationale: कफ़र के निष्क्रिय अर्थ को बलिदानी संदर्भ में प्रचलित और बोधगम्य हिन्दी से व्यक्त करता है।
- source_word: עֲוֺן
  choice: अधर्म
  rationale: यह अपराध और उससे जुड़ी दोषिता की गंभीरता को बनाए रखता है, यद्यपि स्रोत शब्द में दोनों अर्थ-छायाएँ उपस्थित हैं।
- source_word: בֵּית עֵלִי
  choice: एली का घराना
  rationale: वंश और परिवार-समुदाय के अर्थ को आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּזֶבַח
  choice: बलिदान से
  rationale: 'बेथ को साधन के अर्थ में व्यक्त करता है: ऐसा बलिदान इस दोष का प्रायश्चित नहीं कर सकता।'
- source_word: וּבְמִנְחָה
  choice: या अन्नबलि से
  rationale: इस उपासना-संबंधी संदर्भ में מִנְחָה का अधिक विशिष्ट अर्थ 'अन्नबलि' उपयुक्त है; समन्वयक वाव को स्वाभाविक हिन्दी में 'या' किया गया है।
- source_word: עַד עוֹלָם
  choice: कभी भी नहीं
  rationale: नकारात्मक शपथ के साथ स्थायी निषेध को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एली के घराने पर न्याय का स्वरूप
  choice: पद यह घोषित करता है कि बलिदान और अन्नबलि इस अधर्म का प्रायश्चित कभी नहीं करेंगे।
  alternative: इसे हर सम्भव प्रकार की ईश्वरीय क्षमा के पूर्ण निषेध के रूप में विस्तारित किया जा सकता है।
  rationale: मूल पाठ विशेष रूप से बलिदान और मिन्खा जैसे उपासना-संबंधी साधनों का उल्लेख करता है। अनुवाद उसी दावे को रखता है और पाठ से परे जाकर परमेश्वर की दया के विषय में व्यापक सिद्धान्त नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, सार्वजनिक-पाठ योग्य रूप अपनाया गया है। 'घराना', 'अधर्म', 'बलिदान', 'अन्नबलि' और 'प्रायश्चित' बाइबलीय संदर्भ में परिचित हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं।
