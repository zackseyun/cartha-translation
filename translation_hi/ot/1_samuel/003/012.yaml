  text: On that day I will carry out against Eli all that I have spoken concerning his house[b][a], from beginning to end.
translation:
  language: hi
  text: उस दिन मैं एली के विरुद्ध वह सब पूरा करूँगा जो मैंने उसके घराने[a] के विषय में कहा था—आरम्भ से अन्त तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घराना’ से उसका परिवार, वंश या याजकीय कुल अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह पदबंध भविष्य के एक निश्चित समय की ओर संकेत करता है; आधुनिक हिन्दी में ‘उस दिन’ स्वाभाविक और सटीक है।
- source_word: אָקִים
  choice: पूरा करूँगा
  rationale: यहाँ हिफ़ील रूप का अर्थ कही हुई बात को स्थिर करना, अर्थात उसे घटित या पूरा करना है। ‘पूरा करूँगा’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶל עֵלִי
  choice: एली के विरुद्ध
  rationale: אֶל सामान्यतः ‘की ओर/से’ हो सकता है, पर न्याय की इस घोषणा के प्रसंग में प्रतिकूल दिशा स्पष्ट करने के लिए ‘के विरुद्ध’ उपयुक्त है।
- source_word: אֵת כָּל אֲשֶׁר דִּבַּרְתִּי
  choice: वह सब ... जो मैंने ... कहा था
  rationale: यह चयन כָּל אֲשֶׁר की समग्रता और पहले कही गई दिव्य वाणी दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אֶל בֵּיתוֹ
  choice: उसके घराने के विषय में
  rationale: דבר के साथ אֶל यहाँ वाणी के विषय को दर्शा सकता है। ‘के विषय में’ मूल की अपेक्षाकृत खुली दिशा को रखता है और अनावश्यक रूप से दूसरा ‘विरुद्ध’ नहीं जोड़ता।
- source_word: בֵּיתוֹ
  choice: उसके घराने
  rationale: हिन्दी में ‘घराना’ केवल भवन नहीं, बल्कि परिवार, वंश और उससे जुड़ी प्रतिष्ठित/याजकीय परम्परा तक का संकेत दे सकता है; इसीलिए यह ‘घर’ से अधिक स्पष्ट, फिर भी पर्याप्त व्यापक है।
- source_word: הָחֵל וְכַלֵּה
  choice: आरम्भ से अन्त तक
  rationale: यह युग्म घोषित बात के पूर्ण निष्पादन का भाव देता है; ‘आरम्भ से अन्त तक’ हिन्दी में स्वाभाविक रूप से सम्पूर्णता व्यक्त करता है।
theological_decisions:
- issue: एली और उसके בית पर न्याय का दायरा
  choice: मुख्य पाठ में ‘घराना’ रखा गया है, ताकि परिवार, वंश और प्रसंगानुसार याजकीय कुल की सम्भावित व्यापकता बनी रहे।
  alternative: इसे केवल ‘परिवार’ या व्यापक ‘याजक संस्था’ कहना।
  rationale: मूल בֵּיתוֹ दायरे को इनमें से किसी एक अर्थ तक सीमित नहीं करता; अतः अनुवाद उस तनाव को खुला रखता है।
- issue: אֶל עֵלִי की प्रतिकूल अथवा तटस्थ दिशा
  choice: ‘एली के विरुद्ध’
  alternative: ‘एली के लिए’ अथवा ‘एली पर’
  rationale: पूर्वघोषित न्याय के प्रसंग में प्रतिकूल अर्थ प्रमुख है, यद्यपि मूल संबंधसूचक अव्यय अपने आप में अधिक व्यापक है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘आरम्भ’ और ‘अन्त’ औपचारिक किंतु सामान्यतः समझे जाने वाले शब्द हैं।
