source:
  edition: WLC
  text: וַ/תֵּ֤רֶא הָֽ/אִשָּׁה֙ אֶת שְׁמוּאֵ֔ל וַ/תִּזְעַ֖ק בְּ/ק֣וֹל גָּד֑וֹל וַ/תֹּאמֶר֩ הָ/אִשָּׁ֨ה אֶל שָׁא֧וּל לֵ/אמֹ֛ר לָ֥/מָּה רִמִּיתָ֖/נִי וְ/אַתָּ֥ה שָׁאֽוּל־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/012.yaml
  text: When the woman saw Samuel[a], she cried out with a loud voice, and the woman said to Saul, “Why have you deceived me? You are Saul!”
translation:
  language: hi
  text: जब उस स्त्री ने शमूएल[a] को देखा, तो वह ऊँचे स्वर से चिल्ला उठी। उस स्त्री ने शाऊल से कहा, “तुमने मुझे धोखा क्यों दिया? तुम तो शाऊल हो!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो शमूएल जैसा दिखाई दिया।” इब्रानी पाठ केवल “शमूएल” कहता है और इस प्रकट रूप की प्रकृति नहीं समझाता।
    reason: वैकल्पिक व्याख्यात्मक अनुवाद; घटना की प्रकृति के विषय में मूल पाठ की अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: देखा
  rationale: ראה का कथात्मक रूप यहाँ प्रत्यक्ष देखने को बताता है; ‘आभास हुआ’ कहना अनावश्यक व्याख्या जोड़ता।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: इब्रानी में सामान्य संज्ञा ‘स्त्री’ है। प्रसंग में उसकी भूमिका ज्ञात है, पर इस पद में ‘ओझा’ जोड़ना मूल शब्दावली से आगे जाता। हिंदी कथानक में निश्चितता के लिए ‘उस’ स्वाभाविक है।
- source_word: אֶת שְׁמוּאֵל
  choice: शमूएल
  rationale: मूल पाठ सीधे शमूएल को देखे गए व्यक्ति के रूप में प्रस्तुत करता है; मुख्य पाठ में ‘प्रेत’ या ‘शमूएल जैसा रूप’ जोड़ना विवादित घटना की प्रकृति तय कर देता।
- source_word: וַתִּזְעַק בְּקוֹל גָּדוֹל
  choice: ऊँचे स्वर से चिल्ला उठी
  rationale: זעק तीव्र पुकार व्यक्त करता है और בְּקוֹל גָּדוֹל उसकी ऊँची आवाज़ पर बल देता है। यह हिंदी में स्वाभाविक रहते हुए दोनों तत्वों को सुरक्षित रखता है।
- source_word: וַתֹּאמֶר ... לֵאמֹר
  choice: कहा
  rationale: हिंदी में ‘कहा, यह कहते हुए’ जैसी पुनरुक्ति अस्वाभाविक है; एक ही ‘कहा’ पूरा अर्थ संप्रेषित करता है।
- source_word: רִמִּיתָנִי
  choice: मुझे धोखा क्यों दिया
  rationale: पिएल रूप छल या धोखा देने का अर्थ रखता है। ‘धोखा दिया’ आधुनिक हिंदी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וְאַתָּה שָׁאוּל
  choice: तुम तो शाऊल हो!
  rationale: स्वतंत्र सर्वनाम אַתָּה का बल हिंदी के ‘तो’ से स्वाभाविक ढंग से व्यक्त होता है; विस्मयादिबोधक चिह्न पहचान के आकस्मिक उद्घाटन को दर्शाता है।
theological_decisions:
- issue: क्या मुख्य पाठ में ‘शमूएल’ को प्रेत, आत्मा अथवा केवल शमूएल-जैसा दिखाई देने वाला रूप कहा जाए
  choice: मूल पाठ की सीधी अभिव्यक्ति ‘शमूएल’ बनाए रखना
  alternative: ‘शमूएल का प्रेत,’ ‘शमूएल की आत्मा,’ अथवा ‘जो शमूएल जैसा दिखाई दिया’
  rationale: इब्रानी कथन केवल यह कहता है कि स्त्री ने शमूएल को देखा; वह इस पद में प्रकट रूप की प्रकृति नहीं समझाता। मुख्य पाठ में कोई विशेषण जोड़ना धर्मवैचारिक तनाव को समय से पहले सुलझा देगा।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप। ‘ऊँचे स्वर से चिल्ला उठी’ तीव्रता बनाए रखता है, और ‘तुम तो शाऊल हो’ मूल के सर्वनाम-बल को सामान्य पाठक के लिए स्वाभाविक रूप में व्यक्त करता है।
