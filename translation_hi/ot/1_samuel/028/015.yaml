  naturalness: The Hindi is generally clear, dignified, and natural. Removing ‘है’ after ‘किया’ and ‘बुलाया’ makes the dialogue more idiomatic in this narrative setting. ‘परेशान किया’ is a more usual modern-Hindi rendering for causing disturbance than ‘व्याकुल किया,’ while retaining the source’s nontechnical sense.
  terminology: Names, ‘परमेश्वर,’ ‘पलिश्ती,’ ‘नबी,’ and ‘स्वप्न’ are suitable and consistent. The footnote correctly explains the Hebrew idiom ‘by the hand of the prophets.’ The translation does not prejudge debated questions concerning the nature of Samuel’s appearance.
