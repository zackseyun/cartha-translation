base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/015.yaml
  text: Then Samuel said to Saul[a], “Why have you disturbed me by bringing me up?” Saul answered, “I am in great distress. The Philistines are fighting against me, and God has turned away from me and no longer answers me, either by prophets or by dreams[b]. So I have called you to tell me what I should do.”
translation:
  language: hi
  text: तब शमूएल ने शाऊल से कहा, “तुमने मुझे ऊपर बुलाकर क्यों परेशान किया?[a]” शाऊल ने उत्तर दिया, “मैं घोर संकट में हूँ। पलिश्ती मेरे विरुद्ध लड़ रहे हैं, और परमेश्वर मुझसे दूर हो गया है। वह अब मुझे उत्तर नहीं देता—न नबियों के द्वारा[b], न स्वप्नों के द्वारा। इसलिए मैंने आपको बुलाया कि आप मुझे बताएँ कि मैं क्या करूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुमने मुझे ऊपर बुलाकर क्यों अशांत किया?’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘नबियों के हाथ से’; यह ‘नबियों के माध्यम से’ के अर्थ में प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִרְגַּזְתַּנִי
  choice: मुझे ... व्याकुल किया है
  rationale: רגז के हिफ़ील रूप में किसी को अशांत, विचलित या परेशान करने का भाव है। ‘व्याकुल किया’ प्रसंग में स्वाभाविक है और घटना की विधि के बारे में अतिरिक्त निष्कर्ष नहीं जोड़ता।
- source_word: לְהַעֲלוֹת אֹתִי
  choice: मुझे ऊपर बुलाकर
  rationale: עלה की ‘ऊपर लाने’ की स्थानिक छवि को बनाए रखते हुए ‘बुलाकर’ इस प्रसंग में किए गए आह्वान को सहज हिन्दी में व्यक्त करता है; इसे पुनरुत्थान कहना पाठ से अधिक होता।
- source_word: צַר לִי מְאֹד
  choice: मैं घोर संकट में हूँ
  rationale: यह वाक्यांश अत्यधिक व्यक्तिगत क्लेश और दबाव व्यक्त करता है। ‘घोर संकट’ संक्षिप्त, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: נִלְחָמִים בִּי
  choice: मेरे विरुद्ध लड़ रहे हैं
  rationale: לחם के साथ ב यहाँ शाऊल के विरुद्ध की जा रही युद्धात्मक कार्रवाई दर्शाता है।
- source_word: וֵאלֹהִים סָר מֵעָלַי
  choice: परमेश्वर मुझसे दूर हो गया है
  rationale: סור מעל पीछे हटने या दूर हो जाने का भाव देता है। यह अनुवाद संबंध-विच्छेद की गंभीरता व्यक्त करता है, पर परमेश्वर की उपस्थिति के स्वरूप पर पाठ से आगे कोई दावा नहीं करता।
- source_word: וְלֹא עָנָנִי עוֹד
  choice: वह अब मुझे उत्तर नहीं देता
  rationale: ענה का अर्थ यहाँ उत्तर देना है और עוד के साथ पहले मिलने वाले उत्तर के अब बंद हो जाने का भाव आता है।
- source_word: גַּם בְּיַד הַנְּבִיאִם גַּם בַּחֲלֹמוֹת
  choice: न नबियों के द्वारा, न स्वप्नों के द्वारा
  rationale: दोनों גם को हिन्दी की स्वाभाविक सहसंबंधी रचना ‘न...न...’ से व्यक्त किया गया है। ביד का शाब्दिक अर्थ ‘हाथ से’ है, पर यहाँ वह माध्यम या अभिकरण का मुहावरा है।
- source_word: וָאֶקְרָאֶה לְךָ
  choice: इसलिए मैंने आपको बुलाया है
  rationale: קרא ל का अर्थ पुकारना या बुलाना हो सकता है। प्रसंग में ‘बुलाया’ आह्वान का अर्थ देता है, पर ऐसा तकनीकी तांत्रिक शब्द नहीं जोड़ता जो इब्रानी में नहीं है।
- source_word: לְהוֹדִיעֵנִי מָה אֶעֱשֶׂה
  choice: कि आप मुझे बताएँ कि मैं क्या करूँ
  rationale: ידע के हिफ़ील का अर्थ ‘ज्ञात कराना’ है; हिन्दी में ‘बताएँ’ और उसके बाद का प्रश्न मिलकर अर्थ को स्वाभाविक रूप से पूरा व्यक्त करते हैं।
theological_decisions:
- issue: मृतकों से संपर्क की इस कथा में शमूएल की पहचान और स्थिति
  choice: कथा के सीधे कथन के अनुसार ‘शमूएल ने शाऊल से कहा’ अनूदित किया गया है।
  alternative: उस व्यक्ति को ‘कथित शमूएल’, ‘प्रेत’ या माध्यम की केवल अनुभूति बताना।
  rationale: इब्रानी पाठ वक्ता को बिना किसी व्याख्यात्मक विशेषण के शमूएल कहता है। अनुवाद कथा की प्रस्तुति को बनाए रखता है और घटना की आध्यात्मिक कार्यविधि से जुड़ा व्यापक धर्मवैचारिक विवाद स्वयं तय नहीं करता।
- issue: שָׁאוּל और שְׁמוּאֵל के बीच संबोधन का स्तर
  choice: शमूएल की ओर से ‘तुम’ और शाऊल की ओर से आदरसूचक ‘आप’।
  alternative: दोनों ओर समान ‘तुम’ या अधिक अनौपचारिक ‘तू’।
  rationale: इब्रानी द्वितीय पुरुष एकवचन आदर-स्तर निर्धारित नहीं करता। हिन्दी में यह चयन शमूएल की अधिकारपूर्ण वाणी और मार्गदर्शन माँगते शाऊल के सम्मान को स्वाभाविक रूप से दर्शाता है, बिना कोई अलग धर्मसिद्धान्त जोड़े।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध शैली रखी गई है। संवाद में शमूएल का संबोधन अधिकारपूर्ण किंतु अनावश्यक रूप से रूखा नहीं है, जबकि शाऊल का ‘आप’ मार्गदर्शन माँगने की मुद्रा के अनुरूप है। ‘ऊपर बुलाकर’ मूल की स्थानिक छवि को सुरक्षित रखता है।
