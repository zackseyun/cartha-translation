  yaml_path: translation/ot/1_samuel/028/025.yaml
  text: Then she brought it before Saul and before his servants[a], and they ate. Then they rose and went away that night.
translation:
  language: hi
  text: तब उसने भोजन शाऊल और उसके सेवकों के सामने परोस दिया[a], और उन्होंने खाया। फिर वे उठे और उसी रात चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “उसने शाऊल और उसके सेवकों के सामने [उसे] रख दिया।” कर्म पिछले प्रसंग से समझ में आता है—तैयार किया हुआ भोजन।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּגֵּשׁ
  choice: तब उसने भोजन ... परोस दिया
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी वस्तु को पास लाना अथवा किसी के सामने रखना है। पिछले प्रसंग में तैयार भोजन स्पष्ट है; इसलिए स्वाभाविक हिन्दी में निहित कर्म को ‘भोजन’ के रूप में व्यक्त किया गया है। ‘परोस दिया’ भोजन के संदर्भ में सहज और अर्थानुकूल है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: इसका मूल अर्थ ‘के सामने’ या ‘की उपस्थिति में’ है। यहाँ भोजन परोसने के संदर्भ में ‘के सामने’ स्वाभाविक है।
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: עבד का अर्थ प्रसंगानुसार दास, सेवक या परिचारक हो सकता है। यहाँ शाऊल के साथ आए राजकीय सेवक अभिप्रेत हैं; ‘सेवक’ सीधा और अनावश्यक सामाजिक निष्कर्ष से मुक्त अनुवाद है।
- source_word: וַיֹּאכֵלוּ
  choice: और उन्होंने खाया
  rationale: इब्रानी क्रिया में कर्म व्यक्त नहीं है और वह प्रसंग से समझ में आता है; हिन्दी में भी ‘उन्होंने खाया’ स्वाभाविक है।
- source_word: וַיָּקֻמוּ
  choice: फिर वे उठे
  rationale: यह क्रमिक कथन को बनाए रखता है और आधुनिक हिन्दी में सहज है।
- source_word: וַיֵּלְכוּ
  choice: चले गए
  rationale: הלך का मूल अर्थ जाना/चलना है। यहाँ उठने के बाद वहाँ से प्रस्थान करना अभिप्रेत है; ‘चले गए’ स्वाभाविक हिन्दी है।
- source_word: בַּלַּיְלָה הַהוּא
  choice: उसी रात
  rationale: शाब्दिक अर्थ ‘उस रात में’ है। ‘उसी रात’ हिन्दी में स्वाभाविक है और तत्काल उसी रात प्रस्थान करने के कालगत बल को बनाए रखता है।
