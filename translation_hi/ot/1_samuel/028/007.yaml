base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/007.yaml
  text: Then Saul said to his servants, “Find for me a woman who is a medium, so that I may go to her and inquire through her.” And his servants said to him, “Look, there is a woman who is a medium at En-dor.”
translation:
  language: hi
  text: तब शाऊल ने अपने सेवकों से कहा, “मेरे लिए किसी ऐसी स्त्री को ढूँढ़ो जो प्रेत-साधना करती हो, ताकि मैं उसके पास जाकर उसके माध्यम से पूछूँ।” उसके सेवकों ने उससे कहा, “देखिए, एन-दोर में एक स्त्री है जो प्रेत-साधना करती है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֵשֶׁת בַּעֲלַת אוֹב
  choice: ऐसी स्त्री जो प्रेत-साधना करती हो
  rationale: शाब्दिक रूप से यह ‘ओव की स्वामिनी स्त्री’ जैसा है; संदर्भ में उस स्त्री की मृतात्मा/प्रेत से संपर्क कराने वाली भूमिका व्यक्त होती है। ‘प्रेत-साधना’ आधुनिक पाठक के लिए स्वाभाविक है और क्रिया-व्यवहार को स्पष्ट करती है, बिना उसके दावे की सत्यता पर निर्णय दिए।
- source_word: וְאֶדְרְשָׁה בָּהּ
  choice: उसके माध्यम से पूछताछ करूँ
  rationale: בָּהּ का साधनार्थक भाव यहाँ ‘उसके माध्यम से’ उपयुक्त है; इससे स्पष्ट होता है कि शाऊल उस स्त्री को पूछताछ का माध्यम बनाना चाहता था, केवल उसी से सामान्य जानकारी नहीं माँग रहा था।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह उपलब्ध व्यक्ति की ओर ध्यान खींचने वाला प्रस्तुतीकरण है; सेवकों द्वारा राजा को संबोधन होने के कारण आदरसूचक ‘देखिए’ स्वाभाविक है।
- source_word: עֵין דּוֹר
  choice: एन-दोर
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
theological_decisions:
- issue: אוֹב रखने वाली स्त्री की पहचान
  choice: प्रेत-साधना करने वाली स्त्री
  alternative: ओझा / भूत-सिद्धि रखने वाली स्त्री / माध्यम स्त्री
  rationale: अनुवाद उस प्राचीन प्रथा और स्त्री की सामाजिक भूमिका बताता है, पर यह निर्धारित नहीं करता कि वास्तव में मृतक की आत्मा उसी की शक्ति से प्रकट हुई थी।
- issue: शाऊल की पूछताछ का संबंध
  choice: उसके माध्यम से पूछताछ
  alternative: उससे पूछताछ
  rationale: हिब्रू בָּהּ साधन का भाव दे सकता है और कथा के आशय में शाऊल स्त्री के द्वारा अलौकिक परामर्श चाहता है; इसलिए ‘माध्यम से’ मूल संबंध को बेहतर सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। राजा के प्रति सेवकों के उत्तर में आदरसूचक ‘देखिए’ और ‘उससे’ रखा गया है; शाऊल द्वारा सेवकों को निर्देश सामान्य बहुवचन में है।
