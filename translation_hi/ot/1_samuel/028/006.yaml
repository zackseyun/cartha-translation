  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בַּֽ/יהוָ֔ה וְ/לֹ֥א עָנָ֖/הוּ יְהוָ֑ה גַּ֧ם בַּ/חֲלֹמ֛וֹת גַּ֥ם בָּ/אוּרִ֖ים גַּ֥ם בַּ/נְּבִיאִֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/006.yaml
  text: Saul inquired of Yahweh[a], but Yahweh did not answer him[b], either by dreams or by the Urim or by the prophets.
translation:
  language: hi
  text: शाऊल ने यहोवा से मार्गदर्शन माँगा, पर यहोवा ने उसे उत्तर नहीं दिया—न सपनों के द्वारा, न ऊरीम[b] के द्वारा, और न नबियों के द्वारा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ऊरीम याजकों से जुड़ा एक पवित्र साधन था, जिसके द्वारा परमेश्वर का मार्गदर्शन जानने का प्रयास किया जाता था।
    reason: आधुनिक पाठकों के लिए प्राचीन इस्राएली धार्मिक प्रथा का संक्षिप्त सांस्कृतिक स्पष्टीकरण आवश्यक है।
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: यहोवा से मार्गदर्शन माँगा
  rationale: שׁאל के साथ ב और परमेश्वर का नाम यहाँ सामान्य प्रश्न पूछने के बजाय ईश्वरीय निर्देश जानने के लिए पूछताछ करने का भाव देता है। यह हिन्दी में उसी आशय को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में प्रयुक्त विशिष्ट ईश्वरीय नाम को सामान्य उपाधि से बदलने के बजाय हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְלֹא עָנָהוּ
  choice: पर यहोवा ने उसे उत्तर नहीं दिया
  rationale: ענה यहाँ शाऊल की ईश्वरीय पूछताछ के प्रत्युत्तर को सूचित करता है; सीधा हिन्दी रूप मूल कथन की स्पष्टता और तनाव बनाए रखता है।
- source_word: גַּם ... גַּם ... גַּם
  choice: न ... न ... और न
  rationale: नकारात्मक मुख्य वाक्य के बाद बार-बार आए גַּם का वितरणात्मक बल हिन्दी में इस समांतर नकारात्मक क्रम से स्वाभाविक रूप में व्यक्त होता है।
- source_word: בַּחֲלֹמוֹת
  choice: सपनों के द्वारा
  rationale: यह ईश्वरीय उत्तर मिलने के एक माध्यम को दर्शाता है; ‘के द्वारा’ सूची के अन्य साधनों के साथ समानांतरता रखता है।
- source_word: בָּאוּרִים
  choice: ऊरीम के द्वारा
  rationale: אוּרִים याजकीय रीति से ईश्वरीय मार्गदर्शन जानने से जुड़ा पारिभाषिक नाम है। अनुमानपूर्ण अर्थानुवाद के बजाय उसका लिप्यंतरण रखा गया है।
- source_word: בַּנְּבִיאִם
  choice: भविष्यद्वक्ताओं के द्वारा
  rationale: यह उन मानवीय माध्यमों को दर्शाता है जिनके द्वारा ईश्वरीय वचन मिल सकता था; हिन्दी का प्रचलित बाइबलीय पद रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में वाचा का विशिष्ट नाम सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में पहचाना जाने वाला रूप है और नाम को उपाधि में नहीं बदलता।
- issue: शाऊल को उत्तर न मिलने का कारण
  choice: केवल यह कहा गया है कि सूचीबद्ध किसी माध्यम से उसे उत्तर नहीं मिला
  alternative: उसके अस्वीकार या पाप को इस पद में उत्तर न मिलने का स्पष्ट कारण बताना
  rationale: यह पद कारण नहीं बताता; इसलिए अनुवाद उस धार्मिक तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: בַּיהוָה और बाद के בְּ-युक्त पदों का संबंध
  choice: मुख्य पाठ में यहोवा से मार्गदर्शन माँगना और उत्तर के तीन माध्यम बताना
  alternative: शाऊल ने सपनों, ऊरीम और भविष्यद्वक्ताओं के द्वारा यहोवा से पूछा
  rationale: दोनों संरचनात्मक समझ संभव हैं। मुख्य पाठ हिन्दी में अधिक स्वाभाविक उत्तर-माध्यम वाली समझ देता है, जबकि वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मार्गदर्शन माँगा’ साधारण प्रश्न से अधिक, ईश्वरीय निर्णय जानने की क्रिया को व्यक्त करता है। समानांतर ‘न ... न ... और न’ मूल सूची की लय और पूर्ण निषेध को बनाए रखता है।
