base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/008.yaml
  text: So Saul disguised himself and put on other clothes[a], and he went, he and two men with him. They came to the woman by night, and he said, “Please divine for me by a medium, and bring up for me the one whom I name to you.”
translation:
  language: hi
  text: तब शाऊल ने अपना भेष बदला और दूसरे कपड़े पहन लिए। वह अपने साथ दो आदमियों को लेकर चला। वे रात में उस स्त्री के पास पहुँचे। शाऊल ने कहा, “कृपया ओब के द्वारा मेरे लिए शकुन-विचार करो[a], और जिसे मैं तुमसे कहूँ, उसे मेरे लिए ऊपर बुला दो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ओब” इब्रानी शब्द है, जो मृतात्माओं से परामर्श करने की प्रथा, उससे जुड़ी आत्मा, या ऐसा परामर्श कराने वाले माध्यम को सूचित कर सकता है।
    reason: אוֹב की वास्तविक शब्दार्थगत अस्पष्टता और मृतात्मा-संबंधी प्रसंग को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּתְחַפֵּשׂ
  choice: अपना भेष बदला
  rationale: हित्पएल रूप शाऊल द्वारा अपनी पहचान छिपाने के लिए स्वयं अपना रूप बदलने को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: בְּגָדִים אֲחֵרִים
  choice: दूसरे कपड़े पहन लिए
  rationale: यह भेष बदलने के अंग के रूप में अन्य वस्त्र पहनने का सीधा अर्थ सुरक्षित रखता है।
- source_word: וַיֵּלֶךְ הוּא וּשְׁנֵי אֲנָשִׁים עִמּוֹ
  choice: वह अपने साथ दो आदमियों को लेकर चला
  rationale: शाऊल और उसके साथ गए दो पुरुषों—दोनों को स्पष्ट रखते हुए हिन्दी में सहज वाक्य-विन्यास अपनाया गया है।
- source_word: לָיְלָה
  choice: रात में
  rationale: रात्रिकालीन और गुप्त यात्रा के प्रसंग को सरल, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קָסֳמִי נָא לִי
  choice: कृपया ... मेरे लिए शकुन-विचार करो
  rationale: קסם दैवी अथवा गुप्त साधनों से भविष्य या छिपी बात जानने की क्रिया को सूचित करता है; נָא की विनती को ‘कृपया’ से व्यक्त किया गया है।
- source_word: בָּאוֹב
  choice: ओब की विद्या से
  rationale: दुर्लभ और अर्थगत रूप से जटिल אוֹב को लिप्यंतरित कर उसकी मृतात्मा-संबंधी परामर्श की पृष्ठभूमि फुटनोट में स्पष्ट की गई है; इससे ‘स्त्री’ और प्रयुक्त माध्यम के बीच का व्याकरणिक भेद भी बना रहता है।
- source_word: וְהַעֲלִי לִי
  choice: उसे मेरे लिए ऊपर बुला दो
  rationale: हिफ़ील रूप में निहित ‘ऊपर लाने’ की कथात्मक छवि को सुरक्षित रखता है और क्रिया की वास्तविकता पर अतिरिक्त निर्णय नहीं देता।
- source_word: אֵת אֲשֶׁר אֹמַר אֵלָיִךְ
  choice: जिसे मैं तुमसे कहूँ
  rationale: यह उस व्यक्ति को सूचित करता है जिसका नाम या परिचय शाऊल स्त्री को बताएगा; हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: मृतात्मा-संबंधी परामर्श की भाषा को उसकी प्रभावशीलता पर निर्णय दिए बिना प्रस्तुत करना
  choice: शाऊल की माँग को सीधे कथात्मक शब्दों—‘शकुन-विचार करो’ और ‘ऊपर बुला दो’—में व्यक्त किया गया है।
  alternative: ‘बुलाने का ढोंग करो’ जैसे संशयवादी शब्द अथवा ‘मृत आत्मा से संपर्क कराओ’ जैसी अधिक व्याख्यात्मक भाषा।
  rationale: इब्रानी पाठ शाऊल की माँग को उसके वैचारिक संसार की भाषा में प्रस्तुत करता है। अनुवाद को न तो इस क्रिया की प्रभावशीलता सिद्ध करनी चाहिए, न उसका खंडन; मूल की धर्मवैचारिक तनावपूर्णता बनी रहनी चाहिए।
- issue: אוֹב की बहुअर्थी पहचान
  choice: मुख्य पाठ में ‘ओब की विद्या’ और फुटनोट में संभावित अर्थों की व्याख्या।
  alternative: केवल ‘माध्यम बनकर’, ‘परिचित आत्मा के द्वारा’ या ‘मृतात्मा बुलाने की विद्या से’।
  rationale: אוֹב किसी मृतात्मा, उससे जुड़ी साधना, अथवा उस साधना के माध्यम/व्यक्ति को सूचित कर सकता है। लिप्यंतरण और संक्षिप्त टिप्पणी इस वास्तविक अस्पष्टता को समय से पहले समाप्त नहीं करते।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। संवाद में स्त्री के लिए एकवचन निकट संबोधन मूल के स्त्रीलिंग एकवचन रूपों के अनुरूप है। ‘ओब’ जैसा अपरिचित पद फुटनोट के सहारे रखा गया है, ताकि मूल की अस्पष्टता न मिटे।
