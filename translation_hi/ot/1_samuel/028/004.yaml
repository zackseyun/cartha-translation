  text: पलिश्ती इकट्ठे हुए, आए और शूनेम में छावनी डाली[a]। शाऊल ने सारे इस्राएल को इकट्ठा किया, और उन्होंने गिलबोआ में[b] छावनी डाली।
  philosophy: optimal-equivalence
  footnotes:
