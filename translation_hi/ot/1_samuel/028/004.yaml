- source_word: וַיִּקְבֹּץ
  choice: इकट्ठा किया
  rationale: पहली क्रिया के समान קבץ धातु का शब्दगत संबंध बनाए रखा गया है, जबकि सकर्मक रूप भी स्पष्ट है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: मूल का सामूहिक पद यथासंभव सुरक्षित है। इसे केवल ‘इस्राएली पुरुषों’ या ‘सेना’ तक सीमित नहीं किया गया, क्योंकि वे शब्द मूल में स्पष्टतः नहीं हैं।
- source_word: בַּגִּלְבֹּעַ
  choice: गिलबोआ में
  rationale: मूल पाठ केवल स्थान का नाम देता है, ‘पर्वत’ शब्द नहीं। ‘में’ स्वाभाविक हिन्दी है, यद्यपि भौगोलिक संदर्भ में ‘गिलबोआ पर’ भी संभव है।
