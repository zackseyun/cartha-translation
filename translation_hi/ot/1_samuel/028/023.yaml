  rationale: निषेध के साथ अपूर्ण क्रिया शाऊल के दृढ़ निश्चययुक्त इनकार को व्यक्त करती है; हिन्दी भविष्यत् रूप इसे स्वाभाविक ढंग से रखता है।
- source_word: וַיִּפְרְצוּ בוֹ
