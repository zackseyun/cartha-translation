- source_word: עֲבָדָיו
  choice: उसके सेवक
  rationale: राजकीय प्रसंग में यह शाऊल की सेवा में उपस्थित लोगों को सूचित करता है; उनकी बंधुआ स्थिति पर बल देना यहाँ आवश्यक नहीं है।
- source_word: וְגַם הָאִשָּׁה
  choice: और उस स्त्री ने
  rationale: וְגַם सेवकों के साथ उस स्त्री को भी आग्रह करने वालों में जोड़ता है; हिन्दी संयुक्त कर्ता इस योगात्मक अर्थ को सहजता से व्यक्त करता है।
- source_word: וַיִּשְׁמַע לְקֹלָם
  choice: उसने उनकी बात मान ली
  rationale: शाब्दिक मुहावरा ‘उनकी आवाज़ सुनी’ है, पर प्रसंग में इसका अर्थ उनके आग्रह को स्वीकार करना है; ‘बात मान ली’ आधुनिक हिन्दी में स्वाभाविक है और परिणामी प्रतिक्रिया व्यक्त करता है।
- source_word: מֵהָאָרֶץ
  choice: भूमि पर से
  rationale: यह उस स्थान को सूचित करता है जहाँ शाऊल पड़ा था; ‘भूमि पर से’ स्रोत की अभिव्यक्ति और कथात्मक गरिमा दोनों रखता है।
- source_word: וַיֵּשֶׁב אֶל הַמִּטָּה
  choice: पलंग पर बैठ गया
  rationale: מִטָּה पलंग, चौकी या दीवान जैसे लेटने-बैठने के घरेलू आसन को सूचित कर सकता है; ‘पलंग’ सामान्य और प्रसंगानुकूल हिन्दी है।
