  text: But he refused and said[a], “I will not eat.” Yet his servants, along with the woman, urged him, and he listened to their voice[c][b]. So he rose from the ground and sat on the bed.
translation:
  language: hi
  text: पर उसने इनकार किया और कहा, “मैं नहीं खाऊँगा।” फिर भी उसके सेवकों और उस स्त्री ने उस पर बहुत ज़ोर डाला,[a] और उसने उनकी बात सुनी।[b] तब वह ज़मीन से उठा और पलंग पर बैठ गया।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अर्थ है कि उन्होंने उस पर आग्रहपूर्वक बहुत दबाव डाला।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसने उनकी आवाज़ सुनी।”'
    reason: lexical_alternative
  - marker: c
    text: “पलंग” से यहाँ चौकी या दीवान जैसा बैठने और लेटने का आसन भी अभिप्रेत हो सकता है।
    reason: cultural_note
