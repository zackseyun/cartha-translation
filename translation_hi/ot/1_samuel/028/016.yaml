reference: 1 Samuel 28:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר שְׁמוּאֵ֔ל וְ/לָ֖/מָּה תִּשְׁאָלֵ֑/נִי וַ/יהוָ֛ה סָ֥ר מֵ/עָלֶ֖י/ךָ וַ/יְהִ֥י עָרֶֽ/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/016.yaml
  text: And Samuel said[a], “Why then do you ask me, since Yahweh has turned away from you and has become your adversary?”
translation:
  language: hi
  text: तब शमूएल ने कहा, “फिर तुम मुझसे क्यों पूछते हो, जब यहोवा तुमसे दूर हो गया है और तुम्हारा विरोधी बन गया है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל
  choice: तब शमूएल ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से इस प्रवाह को व्यक्त करता है।
- source_word: וְלָמָּה תִּשְׁאָלֵנִי
  choice: फिर तुम मुझसे क्यों पूछते हो
  rationale: ‘फिर’ संयोजक और प्रश्न की तीक्ष्णता दोनों को व्यक्त करता है; שאל का सीधा और सहज अर्थ यहाँ ‘पूछना’ है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: סָר מֵעָלֶיךָ
  choice: तुमसे दूर हो गया है
  rationale: यह पदबंध किसी से हट जाने या दूर हो जाने का संबंधपरक भाव रखता है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיְהִי עָרֶךָ
  choice: तुम्हारा विरोधी बन गया है
  rationale: עָר का अर्थ विरोधी या शत्रु है। ‘विरोधी’ गंभीर दैवी प्रतिकूलता को बनाए रखता है और अनावश्यक रूप से अर्थ को अधिक कठोर नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित न करके व्यक्तिगत नाम के रूप में रखा गया है; ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक और सामान्य पाठकों के लिए परिचित है।
- issue: यहोवा का शाऊल का עָר होना
  choice: तुम्हारा विरोधी बन गया है
  alternative: तुम्हारा शत्रु बन गया है
  rationale: मूल की कठोर धार्मिक बात—परमेश्वर का शाऊल के विरुद्ध हो जाना—बिना नरम किए सुरक्षित रखी गई है; ‘विरोधी’ शब्द עָר की अर्थ-सीमा को उपयुक्त रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। शमूएल के प्रश्न की तीक्ष्णता तथा शाऊल के प्रति दैवी विरोध की गंभीरता दोनों संरक्षित हैं।
