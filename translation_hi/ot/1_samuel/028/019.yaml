  text: וְ/יִתֵּ֣ן יְ֠הוָה גַּ֣ם אֶת יִשְׂרָאֵ֤ל עִמְּ/ךָ֙ בְּ/יַד פְּלִשְׁתִּ֔ים וּ/מָחָ֕ר אַתָּ֥ה וּ/בָנֶ֖י/ךָ עִמִּ֑/י גַּ֚ם אֶת מַחֲנֵ֣ה יִשְׂרָאֵ֔ל יִתֵּ֥ן יְהוָ֖ה בְּ/יַד פְּלִשְׁתִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/019.yaml
  text: And Yahweh will also give Israel with you into the hand of the Philistines[a], and tomorrow you and your sons will be with me[b]. Yahweh will also give the camp of Israel into the hand of the Philistines.
translation:
  language: hi
  text: और याहवे इस्राएल को भी तुम्हारे साथ पलिश्तियों के हाथ में दे देगा। कल तुम और तुम्हारे बेटे मेरे साथ होंगे[a]। याहवे इस्राएल की छावनी[b] को भी पलिश्तियों के हाथ में दे देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मृत्यु में मेरे साथ,” अथवा “मृतकों के लोक में मेरे साथ।” इब्रानी में केवल “मेरे साथ” है।
    reason: alternative_reading
  - marker: b
    text: या, “सेना।” इब्रानी शब्द का अर्थ “छावनी” या प्रसंग के अनुसार “सेना” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय नाम יהוה को उपाधि से बदलने के बजाय आधुनिक हिन्दी में निकट लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וְיִתֵּן / יִתֵּן
  choice: हाथ में कर देगा
  rationale: נתן के साथ בְּיַד किसी को दूसरे के अधिकार में देने का भाव रखता है; यह प्रयोग मूल की ‘हाथ’ वाली छवि को बनाए रखता है।
- source_word: גַּם
  choice: भी
  rationale: दोनों कथनों में जोड़ और बल के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עִמְּךָ
  choice: तुम्हारे साथ-साथ
  rationale: इससे स्पष्ट होता है कि इस्राएल भी शाऊल के साथ वही पराजय भोगेगा, जबकि मूल का ‘साथ’ बना रहता है।
- source_word: בְיַד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ में
  rationale: दूसरे के नियंत्रण या अधिकार में दिए जाने की इब्रानी मुहावरेदार छवि सुरक्षित रखी गई है।
- source_word: וּמָחָר
  choice: कल
  rationale: समय-सूचक कथन को संक्षिप्त और स्वाभाविक हिन्दी में रखा गया है; वाक्य-विभाजन हिन्दी में गंभीरता और स्पष्टता देता है।
- source_word: וּבָנֶיךָ
  choice: और तुम्हारे बेटे
  rationale: בנים यहाँ पुत्रों के लिए है, इसलिए व्यापक ‘बच्चे’ के बजाय ‘बेटे’ चुना गया है।
- source_word: עִמִּי
  choice: मेरे साथ
  rationale: मूल कथन संक्षिप्त है और मृत्यु अथवा मृतकों के लोक को स्पष्टतः नहीं कहता; अनुवाद उसी अर्थगत खुलेपन को बनाए रखता है।
- source_word: מַחֲנֵה יִשְׂרָאֵל
  choice: इस्राएल की छावनी
  rationale: מַחֲנֶה का मूल अर्थ छावनी है और युद्ध-संदर्भ में इससे वहाँ स्थित सेना भी अभिप्रेत हो सकती है; मुख्य पाठ में निकट अर्थ तथा पादटिप्पणी में विकल्प दिया गया है।
theological_decisions:
- issue: ‘कल तुम और तुम्हारे बेटे मेरे साथ होंगे’ का आशय
  choice: ‘मेरे साथ’ को बिना अतिरिक्त व्याख्या के रखा गया है।
  alternative: ‘मृत्यु में मेरे साथ’ अथवा ‘मृतकों के लोक में मेरे साथ’
  rationale: संदर्भ आने वाली मृत्यु की ओर संकेत करता है, पर इब्रानी पाठ केवल ‘मेरे साथ’ कहता है। किसी निश्चित परलोक-सिद्धांत को पाठ में जोड़ने से बचने के लिए मूल की संक्षिप्तता और धर्मवैचारिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गंभीर और सामान्य पाठक के लिए सुबोध रखी गई है। ‘हाथ में कर देगा’ मूल इब्रानी की छवि को सुरक्षित रखने वाला बाइबलीय किन्तु समझने योग्य प्रयोग है। पादटिप्पणी-चिह्न उसी पदांश पर लगाए गए हैं जिससे प्रत्येक टिप्पणी संबंधित है।
