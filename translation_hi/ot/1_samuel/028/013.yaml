  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֥/הּ הַ/מֶּ֛לֶךְ אַל תִּֽירְאִ֖י כִּ֣י מָ֣ה רָאִ֑ית וַ/תֹּ֤אמֶר הָֽ/אִשָּׁה֙ אֶל שָׁא֔וּל אֱלֹהִ֥ים רָאִ֖יתִי עֹלִ֥ים מִן הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/013.yaml
  text: The king said to her[a], “Do not be afraid. What do you see?” And the woman said to Saul[b], “I see a divine being coming up from the earth.”
translation:
  language: hi
  text: राजा ने उससे कहा, “डरो मत। तुमने क्या देखा है?[a]” उस स्त्री ने शाऊल से कहा, “मैं एक दिव्य प्राणी को धरती से ऊपर आते देख रही हूँ।[b]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी क्रिया पूर्ण रूप में है: शाब्दिक रूप से, “तुमने क्या देखा?” तत्काल दर्शन के संदर्भ में इसका अर्थ “तुम्हें क्या दिखाई दे रहा है?” भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी אֱלֹהִים रूप में बहुवचन है, और यहाँ ‘ऊपर आते’ वाला इब्रानी कृदंत भी बहुवचन है; इसलिए अनुवाद “मैं देवताओं [या दिव्य प्राणियों] को धरती से ऊपर आते देख रही हूँ” भी सम्भव है। आगे का वर्णन एक आकृति पर केंद्रित है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल पाठ में व्यक्तिवाचक नाम नहीं, बल्कि निश्चित पद ‘राजा’ है; अगली पंक्ति में शाऊल का नाम आता है।
- source_word: אַל תִּירְאִי
  choice: डरो मत
  rationale: यह स्त्रीलिंग एकवचन को संबोधित निषेधात्मक आज्ञा है। ‘डरो मत’ स्वाभाविक आधुनिक हिन्दी है और अनावश्यक रूप से ‘तू’ या ‘तुम’ का सामाजिक स्तर निर्धारित नहीं करता।
- source_word: כִּי מָה רָאִית
  choice: तुमने क्या देखा है?
  rationale: רָאִית पूर्ण रूप है, इसलिए ‘देखा है’ उसके रूप को बनाए रखता है; तत्काल दर्शन के संदर्भ में वर्तमान अर्थ ‘क्या दिखाई दे रहा है?’ भी सम्भव है। כִּי यहाँ प्रश्न की भूमिका को उभारता है, पर हिन्दी में अलग से ‘क्योंकि’ कहना अस्वाभाविक होगा।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: इब्रानी में केवल ‘स्त्री’ कहा गया है। ‘ओझा’ या ‘माध्यम’ कहने से इस पद में ऐसा व्याख्यात्मक परिचय जुड़ जाता जो मूल में नहीं है।
- source_word: אֱלֹהִים
  choice: एक दिव्य प्राणी
  rationale: शब्द रूप की दृष्टि से बहुवचन है, और उसके साथ बहुवचन कृदंत है; फिर भी अगले संदर्भ में दिखाई देने वाली आकृति का वर्णन एकवचन में होता है। ‘एक दिव्य प्राणी’ अलौकिक अर्थ को व्यक्त करता है, पर उसे स्वयं परमेश्वर नहीं ठहराता; बहुवचन सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: עֹלִים
  choice: ऊपर आते
  rationale: עלה का कृदंत नीचे से ऊपर की ओर गति बताता है। हिन्दी में ‘ऊपर आते’ दृश्य को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִן הָאָרֶץ
  choice: धरती से
  rationale: यह मूल के व्यापक ‘धरती/भूमि’ अर्थ और नीचे से उभरने की छवि को बनाए रखता है; ‘ज़मीन के भीतर से’ कहना मूल से अधिक स्पष्ट व्याख्या जोड़ता।
theological_decisions:
- issue: स्त्री के कथन में אֱלֹהִים की पहचान और वचन
  choice: एक दिव्य प्राणी
  alternative: देवताओं/दिव्य प्राणियों को
  rationale: यह स्त्री की अनुभूति का कथन है, कथावाचक की ओर से उस आकृति की दैवी पहचान का सिद्धान्तगत अनुमोदन नहीं। मुख्य पाठ का एकवचन निकटवर्ती कथा के अनुरूप है, जबकि इब्रानी संज्ञा और कृदंत का बहुवचन पादटिप्पणी में स्पष्ट रखकर पाठ की वास्तविक अस्पष्टता को सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। संवाद में ‘डरो मत’ स्वाभाविक है; ‘तुमने’ सामान्य और समझने योग्य संबोधन देता है। ‘दिव्य प्राणी’ जानबूझकर ऐसा संयमित पद है जो न बहुदेववाद आरोपित करता है, न उस आकृति को परमेश्वर के रूप में पहचानता है।
