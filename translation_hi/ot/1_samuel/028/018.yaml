source:
  edition: WLC
  text: כַּ/אֲשֶׁ֤ר לֹֽא שָׁמַ֨עְתָּ֙ בְּ/ק֣וֹל יְהוָ֔ה וְ/לֹֽא עָשִׂ֥יתָ חֲרוֹן אַפּ֖/וֹ בַּ/עֲמָלֵ֑ק עַל כֵּן֙ הַ/דָּבָ֣ר הַ/זֶּ֔ה עָשָֽׂה לְ/ךָ֥ יְהוָ֖ה הַ/יּ֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/018.yaml
  text: Because you did not obey the voice of Yahweh and did not carry out his burning anger against Amalek[a], therefore Yahweh has done this thing to you today.
translation:
  language: hi
  text: क्योंकि तुमने यहोवा की बात नहीं मानी और अमालेक पर उसके भड़कते क्रोध को कार्य में नहीं लाया[a], इसलिए यहोवा ने आज तुम्हारे साथ यह किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अमालेक पर उसका प्रचंड क्रोध नहीं उतारा।”
    reason: עָשָׂה חֲרוֹן אַפּוֹ की कठिन इब्रानी अभिव्यक्ति का अधिक मुहावरेदार हिन्दी विकल्प।
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: क्योंकि
  rationale: यहाँ यह शब्द शाऊल पर आए न्याय का कारण बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इसका कारणसूचक बल स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁמַעְתָּ בְּקוֹל יְהוָה
  choice: यहोवा की बात नहीं मानी
  rationale: שׁמע בקול का अर्थ केवल सुनना नहीं, बल्कि आज्ञा मानना है। ‘बात मानी’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है।
- source_word: עָשִׂיתָ חֲרוֹן אַפּוֹ
  choice: उसके भड़कते क्रोध को कार्यान्वित नहीं किया
  rationale: शाब्दिक चित्र ‘उसके क्रोध की जलन को करना’ है और प्रसंग अमालेक के विरुद्ध दिए गए दंडादेश को पूरा करने का है। ‘कार्यान्वित’ आज्ञात दंड को अमल में लाने का अर्थ सुरक्षित रखता है।
- source_word: חֲרוֹן אַפּוֹ
  choice: उसके भड़कते क्रोध
  rationale: חֲרוֹן אַף में क्रोध की गर्मी या जलन का सजीव चित्र है। ‘भड़कता क्रोध’ उस तीव्रता और चित्रात्मकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַּעֲמָלֵק
  choice: अमालेक पर
  rationale: यह क्रोधजनित दंड के लक्ष्य को दर्शाता है; हिन्दी में ‘अमालेक पर’ संक्षिप्त और स्वाभाविक है।
- source_word: עַל כֵּן
  choice: इसलिए
  rationale: यह शाऊल की अवज्ञा से निकलने वाले परिणाम को स्पष्ट रूप से जोड़ता है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह
  rationale: דבר यहाँ वर्तमान न्यायकारी घटना या परिणाम को संदर्भित करता है; हिन्दी में ‘यह किया है’ अनावश्यक ‘बात/काम’ जोड़े बिना स्वाभाविक है।
- source_word: עָשָׂה לְךָ יְהוָה
  choice: यहोवा ने तुम्हारे साथ यह किया है
  rationale: לְךָ का न्यायकारी संबंध हिन्दी में ‘तुम्हारे साथ’ से स्वाभाविक रूप में व्यक्त होता है; पूर्ण क्रिया के वर्तमान परिणाम को ‘किया है’ सुरक्षित रखता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: यह आधुनिक हिन्दी में ‘इसी दिन’ का सीधा और स्वाभाविक समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों में पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से नाम को नाम के रूप में रखा गया है।
- issue: अमालेक के विरुद्ध क्रोध को ‘करने’ का अर्थ
  choice: उसके भड़कते क्रोध को कार्यान्वित करना
  alternative: उसका प्रचंड क्रोध अमालेक पर उतारना
  rationale: अभिव्यक्ति परमेश्वर के क्रोध से जुड़े दंडादेश को पूरा करने की ओर संकेत करती है। मुख्य पाठ इब्रानी रूपक और आज्ञा के क्रियान्वयन दोनों को रखता है; पादटिप्पणी अधिक मुहावरेदार विकल्प देती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘भड़कते क्रोध’ मूल के ताप-संबंधी चित्र को बचाता है, जबकि ‘कार्यान्वित’ प्रसंग में दिए गए ईश्वरीय दंडादेश को पूरा करने का भाव स्पष्ट करता है।
