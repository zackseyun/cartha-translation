base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/017.yaml
  text: 'And Yahweh has done for you just as he spoke by my hand: Yahweh has torn the kingdom out of your hand and given it to your neighbor[b][a], to David.'
translation:
  language: hi
  text: 'और यहोवा ने अपने लिए[a] वैसा ही किया है, जैसा उसने मेरे द्वारा[b] कहा था: यहोवा ने राज्य को तेरे हाथ से फाड़कर छीन लिया और उसे तेरे साथी दाऊद को दे दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘उसके लिए/अपने लिए’ है। संदर्भ के कारण कई अनुवाद ‘तेरे लिए’ या ‘तेरे साथ’ पढ़ते हैं।
    reason: alternative_reading
  - marker: b
    text: 'शाब्दिक: “मेरे हाथ से।” अर्थात्, “मेरे द्वारा।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट नाम YHWH का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וַיַּעַשׂ ... לוֹ
  choice: अपने लिए ... किया है
  rationale: मसोरेटिक पाठ के לוֹ (‘उसके लिए/अपने लिए’) को बिना לְךָ (‘तेरे लिए’) मानकर बदले प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר דִּבֶּר בְּיָדִי
  choice: जैसा उसने मेरे हाथ से कहा था
  rationale: בְּיַדִי के शाब्दिक मध्यस्थता-वाचक बिंब को बनाए रखता है; स्वाभाविक विकल्प ‘मेरे द्वारा’ पादटिप्पणी में दिया गया है।
- source_word: וַיִּקְרַע
  choice: छीन लिया
  rationale: קרע का मूल अर्थ ‘फाड़ना’ है, पर राज्य को किसी के हाथ से हटाने के इस प्रसंग में ‘छीन लिया’ हिन्दी में सजीव और स्वाभाविक है तथा बलपूर्वक अलग किए जाने का भाव रखता है।
- source_word: הַמַּמְלָכָה
  choice: राज्य
  rationale: शाऊल के राजकीय शासन और अधिकार के लिए सामान्य, स्पष्ट हिन्दी पद।
- source_word: מִיָּדֶךָ
  choice: तेरे हाथ से
  rationale: अधिकार अथवा नियंत्रण से हटाए जाने का इब्रानी बिंब बनाए रखता है।
- source_word: וַיִּתְּנָהּ
  choice: उसे ... दे दिया
  rationale: स्त्रीलिंग संज्ञा ‘राज्य’ की ओर संकेत करता है और पूर्ण किए गए हस्तांतरण को व्यक्त करता है।
- source_word: לְרֵעֲךָ
  choice: तेरे साथी को
  rationale: רֵעַ के ‘साथी/निकटवर्ती व्यक्ति’ अर्थ को यहाँ ‘पड़ोसी’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है; अगले पदबंध में दाऊद की स्पष्ट पहचान है।
- source_word: לְדָוִד
  choice: दाऊद को
  rationale: व्यक्तिवाचक नाम का स्थापित हिन्दी रूप।
theological_decisions:
- issue: पहले उपवाक्य में मसोरेटिक पाठ לוֹ
  choice: ‘अपने लिए’ के रूप में अनुवाद
  alternative: ‘तेरे लिए’ अथवा ‘तेरे साथ’
  rationale: दिया हुआ इब्रानी पाठ स्पष्ट रूप से לוֹ पढ़ता है, לְךָ नहीं। संदर्भ के कारण उत्पन्न असहजता को चुपचाप दूर करने के बजाय पाठगत तनाव सुरक्षित रखा गया है।
- issue: בְּיָדִי में भविष्यद्वक्ता की मध्यस्थता
  choice: ‘मेरे हाथ से’
  alternative: ‘मेरे द्वारा’
  rationale: इब्रानी मुहावरे का बिंब मुख्य पाठ में रखा गया है, जबकि उसका स्वाभाविक आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली। शाऊल को संबोधन में एकवचन ‘तेरे’ रखा गया है। मुख्य पाठ में मसोरेटिक לוֹ की वास्तविक अस्पष्टता/असहजता सुरक्षित है; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
