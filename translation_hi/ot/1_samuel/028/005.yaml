  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। इब्रानी की हृदय-संबंधी ठोस छवि को परिभाषात्मक भावार्थ में बदलने के बजाय मुख्य पाठ में सुरक्षित रखा गया है।
