  text: וַ/יַּ֥רְא שָׁא֖וּל אֶת מַחֲנֵ֣ה פְלִשְׁתִּ֑ים וַ/יִּרָ֕א וַ/יֶּחֱרַ֥ד לִבּ֖/וֹ מְאֹֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/005.yaml
  text: When Saul saw the camp of the Philistines[a], he was afraid, and his heart trembled greatly.
translation:
  language: hi
  text: जब शाऊल ने पलिश्तियों की छावनी देखी, तो वह डर गया और उसका हृदय बहुत काँप उठा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखी
  rationale: ראה का सामान्य अर्थ यहाँ प्रत्यक्ष रूप से देखना है; हिंदी में स्त्रीलिंग संज्ञा ‘छावनी’ के साथ ‘देखी’ स्वाभाविक है।
- source_word: מַחֲנֵה
  choice: छावनी
  rationale: מַחֲנֶה सैन्य पड़ाव या शिविर को दर्शाता है। ‘छावनी’ ठोस सैन्य परिवेश को बनाए रखती है और केवल ‘सेना’ कहकर अर्थ का विस्तार नहीं करती।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस प्राचीन जाति के नाम का प्रचलित हिंदी बाइबलीय रूप है।
- source_word: וַיִּרָא
  choice: वह डर गया
  rationale: ירא यहाँ भयभीत होने को व्यक्त करता है; ‘डर गया’ दृश्य देखने के बाद उत्पन्न भय को सहज आधुनिक हिंदी में बताता है।
- source_word: וַיֶּחֱרַד
  choice: काँप उठा
  rationale: חרד में काँपने, थरथराने और तीव्र घबराहट का भाव है; ‘काँप उठा’ कथात्मक क्रम और अचानक आंतरिक प्रतिक्रिया दोनों को व्यक्त करता है।
- source_word: לִבּוֹ
  choice: उसका हृदय
  rationale: मूल पाठ स्पष्ट रूप से ‘उसका हृदय’ कहता है। इसे बनाए रखने से भीतरी भय के केंद्र के रूप में हृदय की इब्रानी छवि सुरक्षित रहती है।
- source_word: מְאֹד
  choice: बहुत
  rationale: מְאֹד तीव्रता बताता है; ‘बहुत काँप उठा’ साधारण पाठक के लिए स्पष्ट और स्वाभाविक है।
theological_decisions: []
