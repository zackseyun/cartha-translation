base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/024.yaml
  text: The woman had a fattened calf in the house[a], and she hurried and slaughtered it. Then she took flour, kneaded it[c][b], and baked unleavened bread.
translation:
  language: hi
  text: उस स्त्री के घर में एक मोटा किया हुआ बछड़ा था[a]। उसने जल्दी की और उसका वध किया[b]। फिर उसने आटा लिया, उसे गूँधा और बेखमीर रोटियाँ[c] सेंकीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बाड़े में पालकर मोटा किया हुआ बछड़ा।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त क्रिया कुछ प्रसंगों में बलि के लिए वध करने के अर्थ में आती है, लेकिन यहाँ पशु को भोजन के लिए मारने की बात है।
    reason: lexical_alternative
  - marker: c
    text: या “बेखमीर टिकियाँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: עֵגֶל מַרְבֵּק
  choice: मोटा किया हुआ बछड़ा
  rationale: עֵגֶל एक कम उम्र के गोवंश को और מַרְבֵּק भोजन देकर मोटा किए गए, सम्भवतः बाड़े में पाले गए पशु को दर्शाता है। यह रूप अर्थ को स्पष्ट और सामान्य हिन्दी में रखता है।
- source_word: בַּבַּיִת
  choice: घर में
  rationale: यह ठोस स्थानवाचक अर्थ को सीधे व्यक्त करता है।
- source_word: וַתְּמַהֵר
  choice: उसने जल्दी से
  rationale: क्रिया तैयारी में तत्परता और शीघ्रता व्यक्त करती है; यह हिन्दी में स्वाभाविक कथात्मक रूप है।
- source_word: וַתִּזְבָּחֵהוּ
  choice: उसे काट डाला
  rationale: क्रिया कुछ प्रसंगों में बलि के लिए वध को दर्शा सकती है, पर यहाँ पशु को भोजन के लिए काटना अभिप्रेत है। यह अनुवाद अनावश्यक अनुष्ठानिक अर्थ नहीं जोड़ता।
- source_word: קֶמַח
  choice: आटा
  rationale: यह पकाने के लिए प्रयुक्त flour को दर्शाता है; आधुनिक हिन्दी में ‘आटा’ सबसे सहज समतुल्य है।
- source_word: וַתָּלָשׁ
  choice: उसे गूँधा
  rationale: क्रिया आटे को गूँधने की प्रक्रिया को स्पष्ट रूप से दर्शाती है।
- source_word: וַתֹּפֵהוּ מַצּוֹת
  choice: बेखमीर रोटियाँ सेंकीं
  rationale: מַצּוֹת खमीर के बिना बनी रोटियों का बहुवचन है। ‘सेंकीं’ हिन्दी में रोटियों को पकाने का स्वाभाविक क्रियापद है और मूल की क्रिया-श्रृंखला को बनाए रखता है।
theological_decisions:
- issue: וַתִּזְבָּחֵהוּ का अनुष्ठानिक या सामान्य वध-संबंधी अर्थ
  choice: भोजन तैयार करने के लिए पशु को काटना
  alternative: बलि चढ़ाना
  rationale: निकटवर्ती प्रसंग भोजन की तैयारी का है और किसी उपासना-विधि का उल्लेख नहीं करता; इसलिए बलिदान का धार्मिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। वाक्य की इब्रानी कथात्मक श्रृंखला को स्वाभाविक हिन्दी वाक्यों में व्यक्त किया गया है। ‘बेखमीर रोटियाँ’ सामान्य पाठक के लिए स्पष्ट है और मूल के बहुवचन को सुरक्षित रखता है।
