base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/014.yaml
  text: He said to her[a], “What is his appearance?” And she said, “An old man is coming up, and he is wrapped in a robe.” Then Saul knew that it was Samuel[c][b], and he bowed with his face to the ground and prostrated himself.
translation:
  language: hi
  text: उसने उस स्त्री से पूछा, “उसका रूप कैसा है?” उसने कहा, “एक बूढ़ा आदमी ऊपर आ रहा है[a], और वह एक चोगा ओढ़े हुए है[b]।” तब शाऊल ने जान लिया कि वह शमूएल है। उसने मुँह भूमि की ओर झुकाया और दण्डवत किया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ऊपर उठ रहा है।” हिब्रू कृदन्त ऊपर की ओर जारी गति पर बल देता है।
    reason: lexical_alternative
  - marker: b
    text: या “चोगे में लिपटा हुआ है।” हिब्रू में केवल वस्त्र पहनने के बजाय उसे ओढ़ने या उससे ढके होने का अधिक सजीव भाव है।
    reason: lexical_alternative
  - marker: c
    text: अन्तिम क्रिया का अनुवाद “झुक गया” या कुछ प्रसंगों में “आराधना की” भी हो सकता है; यहाँ यह शमूएल के रूप में पहचाने गए व्यक्ति के सामने गहरे दण्डवत की मुद्रा बताती है।
    reason: alternative_reading
lexical_decisions:
- source_word: תָּאֳרוֹ
  choice: उसका रूप कैसा है
  rationale: תֹּאַר दृश्य रूप या बाहरी स्वरूप को सूचित करता है। प्रश्न के रूप में यह आधुनिक हिन्दी में स्वाभाविक है और पहचान के लिए माँगे गए वर्णन को स्पष्ट रखता है।
- source_word: אִישׁ זָקֵן
  choice: एक बूढ़ा आदमी
  rationale: यह पदबंध सीधे अधिक आयु वाले पुरुष को दर्शाता है; यह सरल और सामान्य आधुनिक हिन्दी है।
- source_word: עֹלֶה
  choice: ऊपर आ रहा है
  rationale: हिब्रू कृदन्त चल रही क्रिया और ऊपर की दिशा—दोनों को व्यक्त करता है।
- source_word: עֹטֶה מְעִיל
  choice: एक चोगा ओढ़े हुए है
  rationale: עֹטֶה केवल पहनने से अधिक ओढ़ने या अपने को वस्त्र से ढकने का भाव देता है; מְעִיל के लिए ‘चोगा’ विशिष्ट बाहरी वस्त्र का स्वाभाविक हिन्दी शब्द है।
- source_word: וַיֵּדַע
  choice: शाऊल ने जान लिया
  rationale: ידע का मूल अर्थ ‘जानना’ है; प्रसंग में वर्णन के आधार पर पहचान लेने का अर्थ निहित है, जिसे ‘जान लिया’ सहज रूप से व्यक्त करता है।
- source_word: כִּי שְׁמוּאֵל הוּא
  choice: कि वह शमूएल है
  rationale: यह हिब्रू के पुरुषवाचक सर्वनाम को बनाए रखता है और हिन्दी में स्वाभाविक पहचान-वाक्य है।
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: उसने भूमि की ओर मुँह करके झुककर
  rationale: यह शरीर को इस प्रकार झुकाने की मुद्रा बताता है कि चेहरा भूमि की ओर हो; अनुवाद उस दृश्य मुद्रा को स्पष्ट रखता है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत किया
  rationale: यह गहरे आदर से भूमि तक झुकने या स्वयं को भूमि पर डालने की क्रिया व्यक्त करता है। ‘दण्डवत किया’ पूर्ववर्ती झुकने से इसकी तीव्रता अलग रखता है, पर अनिवार्य रूप से उपासना का अर्थ नहीं थोपता।
theological_decisions:
- issue: शमूएल के सामने शाऊल की मुद्रा को स्पष्ट रूप से ‘आराधना’ कहना या न कहना
  choice: ‘दण्डवत किया’
  alternative: ‘आराधना की’ / ‘झुक गया’ / ‘श्रद्धा से प्रणाम किया’
  rationale: שׁחה प्रसंगानुसार आराधना या गहरे आदर की शारीरिक मुद्रा दोनों को व्यक्त कर सकता है। यहाँ पाठ शारीरिक दण्डवत का वर्णन करता है, पर ‘आराधना की’ कहना धार्मिक उपासना का निष्कर्ष आवश्यकता से अधिक स्पष्ट कर देगा।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सरल और गरिमापूर्ण रखी गई है। ‘भूमि’, ‘चोगा’ और ‘दण्डवत’ जैसे शब्द प्रसंग की गंभीरता बनाए रखते हैं, फिर भी सामान्य पाठक के लिए बोधगम्य हैं। पादटिप्पणी-चिह्न उन्हीं शब्दों के बाद रखे गए हैं जिनसे वे संबंधित हैं।
