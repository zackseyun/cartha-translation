base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/001.yaml
  text: In those days the Philistines gathered their camps for war[a], to fight against Israel. And Achish said to David, “You surely know that you and your men must go out with me in the camp.”
translation:
  language: hi
  text: उन दिनों पलिश्तियों ने इस्राएल से युद्ध करने को अपनी छावनियाँ लड़ाई के लिए इकट्ठी कीं। तब आकीश ने दाऊद से कहा, “तुम भली-भाँति जानते हो कि तुम्हें और तुम्हारे आदमियों को मेरे साथ सेना में[a] निकलना होगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे साथ छावनी में।” इब्रानी शब्द का अर्थ छावनी भी हो सकता है और विस्तार से सैन्य दल या सेना भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַּיָּמִים הָהֵם
  choice: उन दिनों
  rationale: यह इब्रानी कथात्मक सूत्र नए प्रसंग का आरंभ करता है। ‘उन दिनों’ आधुनिक हिन्दी में स्वाभाविक है और अनावश्यक रूप से ‘और ऐसा हुआ’ नहीं जोड़ता।
- source_word: וַיִּקְבְּצוּ פְלִשְׁתִּים אֶת מַחֲנֵיהֶם לַצָּבָא
  choice: पलिश्तियों ने ... अपनी छावनियाँ युद्ध के लिए इकट्ठी कीं
  rationale: מַחֲנֶה का मूल अर्थ ‘छावनी’ है; बहुवचन को बनाए रखा गया है। לַצָּבָא सैन्य उद्देश्य बताता है, इसलिए ‘युद्ध के लिए’ रखा गया है।
- source_word: לְהִלָּחֵם בְּיִשְׂרָאֵל
  choice: इस्राएल से युद्ध करने के लिए
  rationale: हिन्दी में ‘से युद्ध करना’ विरोधी पक्ष के विरुद्ध लड़ने का स्वाभाविक और स्पष्ट प्रयोग है।
- source_word: יָדֹעַ תֵּדַע
  choice: तुम यह निश्चित रूप से जानते हो
  rationale: धातु के infinitive absolute और finite verb का संयोजन कथन को बल देता है; ‘निश्चित रूप से’ उस जोर को व्यक्त करता है।
- source_word: אִתִּי תֵּצֵא
  choice: तुम्हें ... मेरे साथ ... निकलना होगा
  rationale: रूपतः भविष्यवाचक कथन है, पर प्रसंग में आकीश की दृढ़ अपेक्षा या आदेश निहित है; ‘निकलना होगा’ इस व्यावहारिक बल को व्यक्त करता है।
- source_word: בַּמַּחֲנֶה
  choice: सेना में
  rationale: מַחֲנֶה का शाब्दिक अर्थ ‘छावनी’ है, पर यहाँ बाहर निकलने वाली सैन्य टुकड़ी या सेना अभिप्रेत हो सकती है। प्रवाहपूर्ण हिन्दी के लिए ‘सेना में’ चुना गया है।
- source_word: אַתָּה וַאֲנָשֶׁיךָ
  choice: तुम्हें और तुम्हारे आदमियों को
  rationale: स्पष्ट सर्वनाम दाऊद पर व्यक्तिगत जोर देता है; हिन्दी में उसे उसके लोगों के साथ स्पष्ट रूप से रखा गया है।
theological_decisions:
- issue: आकीश के कथन में भविष्यवाणी बनाम बाध्यता
  choice: निकलना होगा
  alternative: निकलोगे
  rationale: इब्रानी व्याकरण दोनों के बीच व्यावहारिक तनाव रखता है; प्रसंग में यह दृढ़ अपेक्षा है। हिन्दी में ‘होगा’ उस बल को व्यक्त करता है, यद्यपि यह पूर्णतः औपचारिक आज्ञा नहीं है।
