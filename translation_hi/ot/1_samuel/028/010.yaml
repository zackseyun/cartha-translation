base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/010.yaml
  text: So Saul swore to her by Yahweh[a], saying, “As Yahweh lives, no punishment will come upon you in this matter.”
translation:
  language: hi
  text: तब शाऊल ने उस स्त्री से यहोवा की शपथ खाकर कहा, “यहोवा के जीवन की शपथ, इस मामले में तुम पर कोई दण्ड नहीं आएगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस मामले में तुम पर कोई दोष नहीं आएगा।” इब्रानी शब्द का अर्थ “अधर्म,” “दोष,” या दोष के फलस्वरूप मिलने वाला “दण्ड” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर
  rationale: निफ़अल रूप यहाँ शपथ खाने का अर्थ देता है; यह स्वाभाविक और गंभीर हिंदी अभिव्यक्ति है।
- source_word: לָהּ
  choice: उस स्त्री से
  rationale: हिंदी में शपथपूर्वक किसी को आश्वासन देने के लिए ‘से’ स्वाभाविक है; संदर्भ से स्त्री स्पष्ट है।
- source_word: בַּיהוָה
  choice: यहोवा की शपथ
  rationale: पूर्वसर्ग בְּ शपथ में यहोवा के नाम को आधार या साक्षी बनाने को व्यक्त करता है।
- source_word: חַי יְהוָה
  choice: जीवित यहोवा की शपथ
  rationale: हिब्रू के प्रचलित शपथ-सूत्र का स्वाभाविक हिंदी समतुल्य, जो उसकी गंभीरता बनाए रखता है।
- source_word: אִם
  choice: नहीं
  rationale: शपथ-सूत्र में אִם लुप्त शापवचन के साथ प्रबल निषेध का कार्य करता है; हिंदी में केवल ‘यदि’ अर्थ को अस्पष्ट कर देता।
- source_word: יִקְּרֵךְ
  choice: तुम पर ... आएगा
  rationale: קרא यहाँ किसी परिणाम के घटित होने या किसी पर आने के अर्थ में है।
- source_word: עָוֺן
  choice: दण्ड
  rationale: עָוֹן अपराध, दोष अथवा दोष के फलस्वरूप दण्ड का अर्थ दे सकता है; इस कानूनी प्रसंग में शाऊल स्त्री को दण्ड से सुरक्षा का आश्वासन देता है।
- source_word: בַּדָּבָר הַזֶּה
  choice: इस बात के कारण
  rationale: यह उस कार्य को संदर्भित करता है जिसकी चर्चा हो रही है और हिंदी में दण्ड के कारण को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम है; हिंदी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ नाम को पदवी ‘प्रभु’ से अलग रखता है।
- issue: עָוֺן का संदर्भगत अर्थ
  choice: दण्ड
  alternative: दोष / अधर्म
  rationale: शाऊल उस कार्य को नैतिक रूप से निर्दोष घोषित नहीं कर रहा, बल्कि स्त्री को उसके कारण होने वाले दण्ड से बचाने की शपथ खा रहा है। फिर भी शब्द की वास्तविक अर्थ-व्याप्ति पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और मौखिक शपथ की गंभीरता के अनुरूप। ‘जीवित यहोवा की शपथ’ को हिंदी में अर्थ-स्पष्ट रखने के लिए सूत्रात्मक ढंग से प्रस्तुत किया गया है।
