base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/021.yaml
  text: The woman came to Saul[a], and when she saw that he was very terrified, she said to him, “Behold, your servant has obeyed your voice[b], and I have put my life in my hand and listened to your words that you spoke to me.”
translation:
  language: hi
  text: वह स्त्री शाऊल के पास आई, और जब उसने देखा कि वह बहुत घबराया हुआ था, तो उसने उससे कहा, “देखिए, आपकी दासी ने आपकी बात मानी है[a], और मैंने अपनी जान हथेली पर रखी[b] और आपकी वे बातें सुनी हैं जो आपने मुझसे कही थीं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “आपकी दासी ने आपकी आवाज़ सुनी है।” यह हिब्रू अभिव्यक्ति किसी की बात मानने या उसकी आज्ञा मानने का अर्थ देती है।'
    reason: lexical_alternative
  - marker: b
    text: “अपनी जान हथेली पर रखना” अर्थात अपनी जान जोखिम में डालना।
    reason: idiom_explanation
lexical_decisions:
- source_word: וַתָּבוֹא הָאִשָּׁה אֶל־שָׁאוּל
  choice: वह स्त्री शाऊल के पास आई
  rationale: कथानक की अगली घटना को सरल और स्वाभाविक हिन्दी में व्यक्त करता है; इस पद में הָאִשָּׁה का अनुवाद केवल ‘वह स्त्री’ किया गया है, संदर्भ से ‘ओझा’ जैसा पद नहीं जोड़ा गया।
- source_word: וַתֵּרֶא כִּי נִבְהַל מְאֹד
  choice: जब उसने देखा कि वह बहुत घबराया हुआ था
  rationale: נבהל भय, व्याकुलता या घबराहट की तीव्र दशा बताता है और מְאֹד उसकी तीव्रता बढ़ाता है। ‘जब उसने देखा’ हिब्रू घटनाक्रम को स्वाभाविक हिन्दी में रखता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह सामने वाले का ध्यान अपनी विनती की ओर खींचने वाला संवाद-सूचक है। शाऊल के प्रति स्त्री के आदरसूचक संबोधन के अनुरूप ‘देखिए’ स्वाभाविक है।
- source_word: שָׁמְעָה שִׁפְחָתְךָ בְּקוֹלֶךָ
  choice: आपकी दासी ने आपकी बात मानी है
  rationale: שִׁפְחָה स्त्रीलिंग सेविका/दासी है, इसलिए ‘दासी’ लिंग और विनम्र आत्म-संदर्भ दोनों सुरक्षित रखता है। שׁמע בְּקוֹל एक मुहावरा है जिसका अर्थ किसी की बात मानना है।
- source_word: וָאָשִׂים נַפְשִׁי בְּכַפִּי
  choice: मैंने अपनी जान हथेली पर रखी
  rationale: हिब्रू का सजीव मुहावरा लगभग उसी रूप में हिन्दी में भी स्वाभाविक और अर्थगम्य है; इसका आशय जान जोखिम में डालना है।
- source_word: וָאֶשְׁמַע אֶת־דְּבָרֶיךָ אֲשֶׁר דִּבַּרְתָּ אֵלָי
  choice: और जो बातें आपने मुझसे कहीं, उन्हें माना है
  rationale: यहाँ שׁמע संदर्भ में केवल सुनने से आगे बढ़कर अनुपालन का भाव देता है। हिन्दी में उलटा वाक्य-विन्यास पुनरुक्ति घटाकर आशय स्पष्ट करता है।
