base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/002.yaml
  text: David said to Achish[a], “Then you yourself will know what your servant can do.” And Achish said to David, “Very well[b], I will make you my bodyguard for all your days.”
translation:
  language: hi
  text: दाऊद ने आकीश से कहा, “तो आप स्वयं जान लेंगे कि आपका सेवक क्या कर सकता है।” तब आकीश ने दाऊद से कहा, “तो फिर, मैं तुम्हें जीवन भर अपना अंगरक्षक[a] नियुक्त करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “मेरे सिर के लिए रक्षक।” इसका आशय निजी रक्षक या अंगरक्षक से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכֵן
  choice: तो
  rationale: दाऊद के उत्तर में यह पिछले कथन से निष्कर्ष निकालने वाला संवाद-सूचक है; ‘तो’ स्वाभाविक और संक्षिप्त है।
- source_word: אַתָּה תֵדַע
  choice: आप स्वयं जान लेंगे
  rationale: क्रिया में निहित कर्ता के साथ अलग से आए אַתָּה का बल ‘स्वयं’ से व्यक्त होता है; आकीश के प्रति आदरसूचक ‘आप’ दरबारी प्रसंग के अनुकूल है।
- source_word: אֵת אֲשֶׁר יַעֲשֶׂה
  choice: क्या कर सकता है
  rationale: शाब्दिक अर्थ ‘क्या करेगा’ है, पर प्रसंग में दाऊद की जानबूझकर अस्पष्ट बात उसकी क्षमता और आगामी आचरण दोनों की ओर संकेत कर सकती है; हिंदी में ‘क्या कर सकता है’ इस व्यावहारिक अर्थ को स्वाभाविक रूप से रखता है।
- source_word: עַבְדֶּךָ
  choice: आपका सेवक
  rationale: यह दरबारी विनम्र आत्म-संबोधन है, बंधुआ स्थिति का कथन नहीं; इसलिए ‘सेवक’ उपयुक्त है।
- source_word: לָכֵן
  choice: तो फिर
  rationale: आकीश के उत्तर में यह दाऊद की बात पर सहमति से निकला निष्कर्ष बताता है; ‘तो फिर’ हिंदी संवाद में सहज है।
- source_word: שֹׁמֵר לְרֹאשִׁי
  choice: अपना अंगरक्षक
  rationale: शाब्दिक रूप ‘मेरे सिर के लिए रक्षक’ है; यह व्यक्ति की सुरक्षा करने वाले निजी रक्षक का मुहावरा है, जिसे ‘अंगरक्षक’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֲשִׂימְךָ
  choice: नियुक्त करूँगा
  rationale: שׂים यहाँ किसी पद या भूमिका में ठहराने का अर्थ देता है; ‘नियुक्त करूँगा’ सटीक है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक ‘सारे दिन’ इस प्रसंग में स्थायी या आजीवन नियुक्ति का भाव देता है; ‘जीवन भर’ आधुनिक हिंदी में स्वाभाविक है।
theological_decisions:
- issue: दाऊद के कथन की अस्पष्टता
  choice: ‘क्या कर सकता है’ रखकर उसकी क्षमता और संभावित कार्य के बीच संकेतात्मक अस्पष्टता बनाए रखी गई।
  alternative: ‘क्या करेगा’
  rationale: हिब्रू रूप भविष्यकालीन कार्य को सीधे व्यक्त कर सकता है, किंतु कथा-संदर्भ में दाऊद अपने वास्तविक इरादे को स्पष्ट नहीं करता। चुना हुआ रूप उस तनाव को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
translation_notes:
  register: आदरपूर्ण, सहज आधुनिक मानक हिंदी। दाऊद आकीश को ‘आप’ कहता है, जबकि राजा आकीश दाऊद को ‘तुम’ कहता है; इससे सामाजिक संबंध स्वाभाविक रूप से व्यक्त होता है।
