base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/003.yaml
  text: Samuel had died[a], and all Israel had mourned for him and buried him in Ramah, in his own city. And Saul had removed the mediums and the spiritists from the land.
translation:
  language: hi
  text: शमूएल मर चुका था। सारे इस्राएल ने उसके लिए शोक मनाया था और उसे रामा में, उसके अपने नगर में, दफनाया था। शाऊल ने मृतकों से संपर्क कराने वालों और आत्मा-साधकों[a] को देश से निकाल दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन दोनों इब्रानी शब्दों के बीच का ठीक भेद निश्चित नहीं है। इन्हें ‘माध्यम और गूढ़-विद्या करने वाले’ भी समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֵת
  choice: मर चुका था
  rationale: पूर्व घटित परिस्थिति को पृष्ठभूमि के रूप में प्रस्तुत करने के लिए पूर्णभूतकाल रखा गया है; प्रसंग में शमूएल की मृत्यु मुख्य कथा से पहले हो चुकी थी।
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: उसके लिए शोक मनाया था
  rationale: ספד सार्वजनिक, विशेषकर अंत्येष्टि-संबंधी शोक को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक और अर्थानुकूल है।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: मूल के सामूहिक राष्ट्रीय पदबंध को बनाए रखता है, बिना उसे प्रत्येक व्यक्ति के बारे में कठोर सार्वभौमिक कथन बनाए।
- source_word: וַיִּקְבְּרֻהוּ
  choice: उसे … दफ़नाया था
  rationale: קבר का सीधा और स्वाभाविक हिन्दी अनुवाद; यह भी पूर्व परिस्थिति के सारांश का भाग है।
- source_word: בָרָמָה וּבְעִירוֹ
  choice: रामा में, उसके अपने नगर में
  rationale: दूसरा पदबंध रामा की व्याख्यात्मक समानाधिकरण सूचना है; ‘अपने’ प्रत्ययगत संबंध को स्वाभाविक हिन्दी में उभारता है।
- source_word: הֵסִיר
  choice: निकाल दिया था
  rationale: यह देश से हटाने या निष्कासित करने का स्वाभाविक हिन्दी रूप है, जबकि कार्रवाई की ठीक विधि अनिर्धारित रहती है।
- source_word: הָאֹבוֹת
  choice: मृतात्माओं से संपर्क करानेवाले
  rationale: אוֹב ऐसे साधकों के लिए प्रयुक्त है जो मृतकों की आत्माओं से संपर्क कराने का दावा करते थे; यह ‘माध्यम’ जैसे अस्पष्ट आधुनिक उधार-शब्द से अधिक स्पष्ट है।
- source_word: הַיִּדְּעֹנִים
  choice: प्रेत-साधक
  rationale: यह संबद्ध गूढ़-विद्या साधकों के लिए संक्षिप्त, समझने योग्य हिन्दी पद है; मूल में दोनों श्रेणियों का ठीक भेद पूरी तरह निश्चित नहीं है।
- source_word: מֵהָאָרֶץ
  choice: देश से
  rationale: राष्ट्रीय-भौगोलिक प्रसंग में הָאָרֶץ का स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: गूढ़-विद्या करनेवालों के दो इब्रानी पदों का वर्गीकरण
  choice: मृतात्माओं से संपर्क करानेवाले और प्रेत-साधक
  alternative: ओझे और तांत्रिक; मृतात्माओं के माध्यम और भविष्य बतानेवाले
  rationale: मूल दो निषिद्ध प्रकार के साधकों का उल्लेख करता है, पर उनके बीच का सटीक भेद अनिश्चित है। चुना हुआ रूप मूल आशय को स्पष्ट करता है और आधुनिक काल्पनिक साहित्य या किसी विशेष धार्मिक परंपरा की श्रेणियाँ आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पृष्ठभूमि-सूचक पूर्णभूतकाल हिन्दी में ‘था’ के द्वारा व्यक्त किया गया है। occult संबंधी पदों में मूल की अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
