base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/009.yaml
  text: But the woman said to him[a], “Look, you yourself know what Saul has done, that he has cut off the mediums and the spiritists from the land. So why are you laying a snare for my life, to put me to death?”
translation:
  language: hi
  text: परन्तु स्त्री ने उससे कहा, “देख, तू स्वयं जानता है कि शाऊल ने क्या किया है—उसने आत्माओं से संपर्क करानेवालों और गुप्त ज्ञान का दावा करनेवालों[a] को देश से उखाड़ फेंका है। फिर तू मेरी जान के लिए जाल क्यों बिछा रहा है, ताकि मुझे मरवा डाले?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन शब्दों का अनुवाद “माध्यमों और गुप्तविदों” अथवा अधिक पारंपरिक रूप में “परिचित आत्माओं वालों और गुप्त ज्ञान जाननेवालों” भी किया जा सकता है।
    reason: हिब्रू אֹבוֹת और יִּדְּעֹנִים निषिद्ध गुप्तविद्या-संबंधी साधकों के पद हैं, पर उनकी सटीक व्यावहारिक भूमिका और दोनों के बीच का भेद निश्चित नहीं है।
lexical_decisions:
- source_word: וַתֹּאמֶר הָאִשָּׁה אֵלָיו
  choice: परन्तु स्त्री ने उससे कहा
  rationale: वाव कथानक को आगे बढ़ाता है, पर प्रसंग में स्त्री की सावधान आपत्ति के कारण ‘परन्तु’ विरोध का भाव स्वाभाविक रूप से व्यक्त करता है।
- source_word: הִנֵּה אַתָּה יָדַעְתָּ
  choice: देख, तू स्वयं जानता है
  rationale: הִנֵּה ध्यान दिलाता है और स्वतंत्र सर्वनाम אַתָּה कर्ता पर बल देता है; ‘स्वयं’ उस बल को सुरक्षित रखता है।
- source_word: הִכְרִית ... מִן הָאָרֶץ
  choice: देश से उखाड़ फेंका है
  rationale: यह खंड देश में से कठोरतापूर्वक हटाने या मिटाने का भाव रखता है। ‘उखाड़ फेंका’ हिब्रू की तीव्रता और रूपकात्मकता रखता है, पर यह अनिवार्य रूप से प्रत्येक व्यक्ति की हत्या का दावा नहीं करता।
- source_word: הָאֹבוֹת
  choice: मृतात्माओं से संपर्क करानेवालों
  rationale: यहाँ बहुवचन उन व्यक्तियों को सूचित करता है जो मृतकों या आत्माओं से संपर्क कराने का दावा करते थे। वर्णनात्मक हिन्दी ‘ओझा’ जैसे अधिक व्यापक और संभावित रूप से भ्रामक लोक-शब्द से बचती है।
- source_word: הַיִּדְּעֹנִי
  choice: प्रेत-साधकों
  rationale: शब्द गुप्त या आत्मिक ज्ञान का दावा करनेवाले निषिद्ध साधकों को सूचित करता है। यह चयन आधुनिक हिन्दी में समझने योग्य है और उनकी कथित शक्तियों की वास्तविकता पर निर्णय नहीं देता।
- source_word: מִתְנַקֵּשׁ בְּנַפְשִׁי
  choice: मेरे प्राण लेने के लिए फंदा ... लगा रहा है
  rationale: मूल में फंदा लगाने का रूपक और स्त्री के जीवन को निशाना बनाने का भाव दोनों हैं; हिन्दी में यह संयोजन स्वाभाविक और स्पष्ट है।
- source_word: לַהֲמִיתֵנִי
  choice: ताकि मुझे मरवा डाले
  rationale: हिफ़ील रूप का मृत्यु दिलाने या दंड द्वारा मरवा देने का कारणात्मक भाव सुरक्षित रहता है, जो शाऊल की राजकीय मनाही के प्रसंग में उपयुक्त है।
theological_decisions:
- issue: गुप्तविद्या से जुड़े पदों का अनुवाद, बिना उनके कार्य करने के ढंग पर धार्मिक निर्णय दिए
  choice: मृतात्माओं से संपर्क करानेवालों और प्रेत-साधकों
  alternative: ओझों और तांत्रिकों; परिचित आत्माएँ रखनेवालों और जादूगरों
  rationale: चुना हुआ पाठ निषिद्ध साधकों की भूमिका को सामान्य पाठक के लिए स्पष्ट करता है, पर न तो उनके दावों को सत्य ठहराता है और न बाद की लोककथाओं या किसी संप्रदाय की व्याख्या को मूल में जोड़ता है।
- issue: הִכְרִית की कठोरता और उसके परिणाम की सीमा
  choice: देश से उखाड़ फेंका है
  alternative: देश से निकाल दिया है; देश से मिटा दिया है
  rationale: ‘उखाड़ फेंका’ कठोर निष्कासन या उन्मूलन की वास्तविक अस्पष्टता बनाए रखता है। ‘निकाल दिया’ कुछ नरम है, जबकि ‘मिटा दिया’ केवल हत्या का अनावश्यक संकेत दे सकता है।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। संबोधन में एकवचन ‘तू’ प्रसंग के प्रत्यक्ष और दबावपूर्ण संवाद के अनुरूप है। ‘देख’ हिब्रू के ध्यानाकर्षक संकेत का स्वाभाविक आधुनिक रूप है।
