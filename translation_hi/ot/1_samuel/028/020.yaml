base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/020.yaml
  text: Saul immediately fell full length to the ground[a], and he was very afraid because of Samuel’s words. There was no strength in him either, because he had eaten no bread all that day and all that night.
translation:
  language: hi
  text: शाऊल तुरन्त भूमि पर पूरा लम्बा गिर पड़ा और शमूएल की बातों के कारण बहुत डर गया। उसमें शक्ति भी नहीं थी, क्योंकि उसने उस पूरे दिन और पूरी रात रोटी[a] नहीं खाई थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘रोटी’ शब्द का अर्थ व्यापक रूप से ‘भोजन’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְמַהֵר
  choice: तुरन्त
  rationale: क्रिया का मूल अर्थ शीघ्रता करना है; यहाँ यह शाऊल के अचानक गिर पड़ने की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּפֹּל מְלֹא קוֹמָתוֹ אַרְצָה
  choice: अपनी पूरी लंबाई के बल भूमि पर गिर पड़ा
  rationale: यह वाक्यांश बताता है कि शाऊल केवल लड़खड़ाया नहीं, बल्कि पूरी देह की लंबाई के साथ भूमि पर गिरा; अनावश्यक रूप से ‘मूर्छित होकर ढह पड़ा’ जैसा अर्थ नहीं जोड़ा गया।
- source_word: וַיִּרָא מְאֹד
  choice: बहुत डर गया
  rationale: यह तीव्र भय को सरल और वर्तमान मानक हिन्दी में व्यक्त करता है।
- source_word: מִדִּבְרֵי שְׁמוּאֵל
  choice: शमूएल की बातों के कारण
  rationale: यहाँ מִן कारण का बोध कराता है; हिन्दी में ‘के कारण’ इस संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: גַּם כֹּחַ לֹא הָיָה בוֹ
  choice: उसमें शक्ति भी नहीं थी
  rationale: ‘भी’ additive גַּם को दर्शाता है और ‘शक्ति नहीं थी’ स्रोत के सीधे कथन को बिना ‘शेष’ जैसा अतिरिक्त अर्थ जोड़े सुरक्षित रखता है।
- source_word: לֹא אָכַל לֶחֶם
  choice: रोटी नहीं खाई थी
  rationale: לֶחֶם का शाब्दिक अर्थ ‘रोटी’ है, यद्यपि यह व्यापक रूप से भोजन को भी सूचित कर सकता है; मुख्य पाठ में स्रोत की ठोस शब्दावली रखी गई है।
- source_word: כָּל הַיּוֹם וְכָל הַלָּיְלָה
  choice: उस पूरे दिन और पूरी रात
  rationale: यह दोनों समयावधियों की संपूर्णता और कथा में उल्लिखित विशेष दिन-रात को स्वाभाविक हिन्दी में व्यक्त करता है।
