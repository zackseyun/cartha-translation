  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘भूमि’ और ‘शक्ति’ औपचारिक किंतु सामान्यतः बोधगम्य शब्द हैं। पादटिप्पणी-चिह्न को उसी शब्द ‘रोटी’ के साथ रखा गया है जिसकी अर्थ-सीमा वह स्पष्ट करता है।
