  yaml_path: translation/ot/1_samuel/028/011.yaml
  text: Then the woman said[a], “Whom shall I bring up for you?” And he said, “Bring up Samuel for me.”
translation:
  language: hi
  text: तब उस स्त्री ने कहा, “मैं तुम्हारे लिए किसे ऊपर ले आऊँ[a]?” उसने कहा, “मेरे लिए शमूएल को ऊपर ले आओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुलाकर ऊपर लाऊँ।” हिब्रू क्रिया का शाब्दिक अर्थ “ऊपर ले आना” या “ऊपर आने के लिए बुलाना” है; यहाँ यह मृतकों को बुलाने के संदर्भ की अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब ... ने कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में क्रमिक प्रगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָאִשָּׁה
  choice: उस स्त्री
  rationale: संदर्भ में यह एन-दोर की स्त्री को सूचित करता है; हिन्दी में ‘उस स्त्री’ पूर्वोल्लिखित पात्र को स्वाभाविक रूप से पहचानाता है।
- source_word: אֶת מִי
  choice: किसे
  rationale: प्रत्यक्ष कर्म-सूचक אֶת के साथ प्रश्नवाचक מִי यहाँ कर्म है; ‘किसे’ उसका ठीक हिन्दी रूप है।
- source_word: אַעֲלֶה
  choice: मैं ... ऊपर ले आऊँ
  rationale: עלה का हिफ़ील रूप ‘ऊपर ले आना/चढ़ा लाना’ है। यह अनुष्ठानिक संदर्भ की मूल स्थानिक छवि को बनाए रखता है और घटना की प्रक्रिया की व्याख्या नहीं थोपता।
- source_word: לָּךְ
  choice: तुम्हारे लिए
  rationale: यहाँ ל हितार्थक है और शाऊल के लिए किए जाने वाले कार्य को दर्शाता है।
- source_word: וַיֹּאמֶר
  choice: उसने कहा
  rationale: संवाद में कर्ता शाऊल संदर्भ से स्पष्ट है; ‘उसने कहा’ हिन्दी में सहज है और हिब्रू के कथात्मक क्रम को रखता है।
- source_word: אֶת שְׁמוּאֵל
  choice: शमूएल को
  rationale: אֶת का हिन्दी में कर्म-चिह्न ‘को’ है; שְׁמוּאֵל का प्रचलित हिन्दी बाइबलीय नाम ‘शमूएल’ रखा गया है।
- source_word: הַעֲלִי
  choice: ऊपर ले आओ
  rationale: यह עלה का हिफ़ील, स्त्रीलिंग एकवचन आज्ञार्थक रूप है। पहले प्रयोग के समान अनुवाद से शब्दगत संगति और मूल छवि बनी रहती है।
- source_word: לִי
  choice: मेरे लिए
  rationale: पहले לָּךְ की तरह यह भी हितार्थक प्रयोग है।
theological_decisions:
- issue: मृतक को बुलाने के संदर्भ में עלה का अनुवाद
  choice: ऊपर ले आना
  alternative: बुलाना / प्रकट करना
  rationale: हिब्रू का सामान्य अर्थ ‘ऊपर लाना’ है। इसे बनाए रखने से पाठ की अपनी छवि और धार्मिक तनाव सुरक्षित रहते हैं तथा घटना कैसे हुई, इस पर कोई अतिरिक्त निष्कर्ष नहीं थोपा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण संवाद। ‘ऊपर ले आना’ को दोनों स्थानों पर रखकर हिब्रू की पुनरावृत्ति और स्थानिक रूपक सुरक्षित किए गए हैं।
