translation_notes:
  register: आधुनिक मानक हिन्दी का आदरसूचक, विनम्र और कथात्मक रजिस्टर अपनाया गया है। शाऊल को संबोधित करते हुए ‘आप’ और ‘-इए’ रूप स्त्री की आग्रहपूर्ण विनम्रता व्यक्त करते हैं। इब्रानी के शब्दशः ‘अपनी दासी की आवाज़ सुनिए’ के स्थान पर स्वाभाविक हिन्दी मुहावरा ‘मेरी भी सुनिए’ रखा गया है; इससे वक्ता का स्त्रीलिंग और पारस्परिक ‘भी’ दोनों सुरक्षित रहते हैं।
