source:
  edition: WLC
  text: וְ/עַתָּ֗ה שְׁמַֽע נָ֤א גַם אַתָּה֙ בְּ/ק֣וֹל שִׁפְחָתֶ֔/ךָ וְ/אָשִׂ֧מָה לְ/פָנֶ֛י/ךָ פַּת לֶ֖חֶם וֶ/אֱכ֑וֹל וִ/יהִ֤י בְ/ךָ֙ כֹּ֔חַ כִּ֥י תֵלֵ֖ךְ בַּ/דָּֽרֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/028/022.yaml
  text: Now then[a], please listen, you also, to the voice of your female servant, and let me set a piece of bread before you. Eat, so that there may be strength in you[c][b], because you must go on your way.
translation:
  language: hi
  text: अब, कृपया आप भी अपनी सेविका की बात मानिए। मुझे आपके सामने रोटी का एक टुकड़ा रखने दीजिए। उसे खा लीजिए, ताकि आपमें शक्ति हो, क्योंकि आप यात्रा पर जाने वाले हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह प्रसंग में समय-सूचक होने के साथ स्त्री की पिछली बात से निकली विनती को आगे बढ़ाता है; ‘इसलिए अब’ दोनों बलों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׁמַע נָא גַם אַתָּה בְּקוֹל שִׁפְחָתֶךָ
  choice: मेरी भी सुनिए
  rationale: נָא विनम्र आग्रह है, जिसे आदरसूचक ‘सुनिए’ व्यक्त करता है; גַם אַתָּה का पारस्परिक बल ‘भी’ में सुरक्षित है। ‘आवाज़ सुनना’ यहाँ किसी की बात मानने का इब्रानी मुहावरा है, इसलिए सरल ‘मेरी सुनिए’ स्वाभाविक है। वक्ता स्त्री है, अतः हिन्दी में ‘मेरी’ से उसका लिंग स्पष्ट रहता है।
- source_word: וְאָשִׂמָה לְפָנֶיךָ
  choice: मुझे आपके सामने ... रखने दीजिए
  rationale: प्रथम-पुरुष cohortative अनुमति माँगते हुए प्रस्ताव प्रकट करता है; यह हिन्दी रूप उस विनम्र इच्छार्थक भाव को बनाए रखता है।
- source_word: פַּת לֶחֶם
  choice: रोटी का एक टुकड़ा
  rationale: פַּת किसी टुकड़े या कौर को दर्शाता है; ‘रोटी का एक टुकड़ा’ सटीक और सामान्य आधुनिक हिन्दी है।
- source_word: וֶאֱכֹל
  choice: उसे खा लीजिए
  rationale: आज्ञार्थक को आदरसूचक और प्रसंगानुकूल आग्रह के रूप में व्यक्त किया गया है; ‘उसे’ पिछली रोटी से संबंध स्पष्ट करता है।
- source_word: וִיהִי בְךָ כֹּחַ
  choice: ताकि आपमें ... शक्ति रहे
  rationale: यह इच्छित परिणाम अथवा उद्देश्य व्यक्त करने वाला jussive है। ‘ताकि’ प्रयोजन को और ‘शक्ति रहे’ निकटवर्ती यात्रा के लिए आवश्यक सामर्थ्य को सहज हिन्दी में व्यक्त करता है।
- source_word: כִּי תֵלֵךְ בַּדָּרֶךְ
  choice: रास्ते पर जाने
  rationale: כִּי भोजन करने का कारण देता है और imperfect निकट भविष्य में प्रस्थान की ओर संकेत करता है। हिन्दी उद्देश्य-रचना में कारण स्वाभाविक रूप से समाहित है; ‘रास्ते पर जाने’ मूल मुहावरे के निकट है और ‘अवश्य’ जैसा अतिरिक्त बाध्यता-भाव नहीं जोड़ता।
