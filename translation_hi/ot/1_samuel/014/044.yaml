  text: And Saul said[a], “May God do so and more also, for you shall surely die, Jonathan.”
translation:
  language: hi
  text: तब शाऊल ने कहा[a], “परमेश्वर ऐसा ही करे, और इससे भी अधिक करे; क्योंकि तू निश्चय ही मरेगा, योनातान।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह हिब्रू शपथ का सूत्र है; शाब्दिक अर्थ है, “परमेश्वर ऐसा करे, और इससे भी अधिक करे।” हिब्रू में यह नहीं बताया गया कि इस दंडात्मक कार्य का पात्र कौन है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथात्मक रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक क्रम व्यक्त करता है, बिना अर्थ में अनावश्यक विस्तार किए।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: כֹּה יַעֲשֶׂה אֱלֹהִים וְכֹה יוֹסִף
  choice: परमेश्वर ऐसा ही करे, और इससे भी अधिक करे
  rationale: यह शपथ तथा शाप का रूढ़ हिब्रू सूत्र है। यह अनुवाद उसकी शापात्मक गंभीरता बनाए रखता है और उस कर्म का पात्र नहीं जोड़ता जिसे हिब्रू में अनकहा छोड़ा गया है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शाऊल की शपथ में आहूत एकमात्र ईश्वर अभिप्रेत है; ‘परमेश्वर’ गरिमापूर्ण और सामान्य हिन्दी रूप है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शपथ-सूत्र को उसके बाद की मृत्युदंड-घोषणा के आधार अथवा विषय से जोड़ता है।
- source_word: מוֹת תָּמוּת
  choice: तू निश्चय मर जाएगा
  rationale: क्रिया के साथ infinitive absolute मृत्यु की निश्चितता पर बल देता है; ‘निश्चय’ उस प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יוֹנָתָן
  choice: योनातान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: शपथ-सूत्र में अनकहे कर्म-पात्र को जोड़ना या न जोड़ना
  choice: परमेश्वर ऐसा ही करे, और इससे भी अधिक करे
  alternative: परमेश्वर मेरे साथ ऐसा ही करे, और इससे भी अधिक करे
  rationale: हिब्रू में दंडात्मक कार्य का पात्र स्पष्ट नहीं किया गया है। ‘मेरे साथ’ जोड़ना संभव पारंपरिक समझ है, पर स्रोत में व्यक्त नहीं; इसलिए वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। शाऊल का संबोधन एकवचन ‘तू’ में है, जो प्रसंग में पिता द्वारा पुत्र को दी गई कठोर और प्रत्यक्ष घोषणा के अनुकूल है।
