translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। दुर्लभ तकनीकी शब्द ‘शस्त्रवाहक’ के स्थान पर सहज ‘हथियार ढोनेवाला’ और ‘कूंड’ के स्थान पर समझने योग्य ‘हल-रेखा’ चुना गया है। मूल के दो अनुमानसूचक כְּ दोनों जगह ‘लगभग’ से सुरक्षित हैं।
