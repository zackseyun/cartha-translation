  text: וַ/תְּהִ֞י הַ/מַּכָּ֣ה הָ/רִאשֹׁנָ֗ה אֲשֶׁ֨ר הִכָּ֧ה יוֹנָתָ֛ן וְ/נֹשֵׂ֥א כֵלָ֖י/ו כְּ/עֶשְׂרִ֣ים אִ֑ישׁ כְּ/בַ/חֲצִ֥י מַעֲנָ֖ה צֶ֥מֶד שָׂדֶֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/014.yaml
  text: That first slaughter[a], which Jonathan and his armor-bearer made, was about twenty men within about half a furrow in an acre of a field.
translation:
  language: hi
  text: योनातान और उसके हथियार उठानेवाले ने अपने पहले प्रहार में लगभग बीस पुरुषों को मार गिराया। यह खेत के उस भूभाग में लगभग आधी हल-रेखा के भीतर हुआ, जिसे बैलों की एक जोड़ी जोत सकती थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, ‘लगभग आधी हल-रेखा, खेत की एक जोड़ी [का भूभाग]।’ ‘जोड़ी’ बैलों की जोड़ी/जुए को सूचित करती है और संभवतः उस भूमि-क्षेत्र का माप है जिसे ऐसी जोड़ी जोत सकती थी। इस माप का सटीक परिमाण और ‘आधी हल-रेखा’ के साथ उसका संबंध अनिश्चित है।
    reason: मूल कृषि-माप और हिब्रू वाक्यांश की संरचना अनिश्चित है; पादटिप्पणी बिना किसी निश्चित आधुनिक माप को थोपे इस अस्पष्टता को सुरक्षित रखती है।
lexical_decisions:
- source_word: הַמַּכָּה הָרִאשֹׁנָה
  choice: यह पहला संहार
  rationale: सैनिक प्रसंग में מַכָּה घातक प्रहार और उससे हुई हत्या को दर्शाता है। ‘संहार’ परिणाम की गंभीरता व्यक्त करता है, जबकि ‘पहला’ הָרִאשֹׁנָה का सीधा अर्थ रखता है।
- source_word: אֲשֶׁר הִכָּה יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: योनातान और उसके हथियार ढोनेवाले के ... में ... मारे गए
  rationale: हिब्रू में ‘जो प्रहार/संहार उन्होंने किया’ का मुहावरा है। हिंदी में वाक्य को स्वाभाविक बनाने के लिए परिणाम को ‘मारे गए’ से व्यक्त किया गया है, और दोनों व्यक्तियों की संयुक्त भूमिका सुरक्षित रखी गई है।
- source_word: נֹשֵׂא כֵלָיו
  choice: उसके हथियार ढोनेवाला
  rationale: शाब्दिक अर्थ ‘उसके हथियार/सामान उठानेवाला’ है। यह सामान्य हिंदी पाठक के लिए ‘शस्त्रवाहक’ से अधिक स्पष्ट है और सैनिक सहायक की भूमिका बताता है।
- source_word: כְּעֶשְׂרִים אִישׁ
  choice: लगभग बीस पुरुष
  rationale: उपसर्ग כְּ संख्या को अनुमानित बनाता है; ‘लगभग’ इस अनिश्चितता को स्पष्ट रूप से सुरक्षित रखता है।
- source_word: כְּבַחֲצִי מַעֲנָה
  choice: लगभग आधी हल-रेखा की दूरी के भीतर
  rationale: מַעֲנָה जुताई से बनी रेखा या furrow को सूचित करता है। ‘हल-रेखा’ कृषि-चित्र को बनाए रखता है और दूसरा כְּ भी ‘लगभग’ से व्यक्त होता है।
- source_word: צֶמֶד שָׂדֶה
  choice: खेत का वह क्षेत्र, जिसे बैलों की एक जोड़ी जोत सकती थी
  rationale: צֶמֶד मूलतः जोड़ी या जुआ है और यहाँ संभवतः बैलों की एक जोड़ी द्वारा जोते जा सकने वाले भूमि-क्षेत्र का पुराना माप बताता है। आधुनिक निश्चित इकाई थोपने के बजाय कृषि-आधारित अर्थ रखा गया है।
