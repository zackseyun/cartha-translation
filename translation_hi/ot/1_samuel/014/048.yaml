- source_word: וַיַּצֵּל
  choice: छुड़ाया
  rationale: हिफ़ील रूप का अर्थ किसी के अधिकार या संकट से बचाकर निकालना है; ‘छुड़ाया’ इस क्रियात्मक भाव को सहज हिंदी में रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: स्रोत का ‘हाथ से’ मुहावरा अधिकार या नियंत्रण दर्शाता है और हिंदी में भी स्वाभाविक तथा बोधगम्य है।
- source_word: שֹׁסֵהוּ
  choice: उसके लूटनेवालों
  rationale: रूप व्याकरणतः एकवचन (‘उसका लूटनेवाला’) है, पर ‘इस्राएल’ सामूहिक संज्ञा है और कृदंत भी सामूहिक अर्थ दे सकता है; हिंदी में बहुवचन स्वाभाविक है।
