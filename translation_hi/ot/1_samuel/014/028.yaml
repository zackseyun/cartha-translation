base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/028.yaml
  text: Then one of the people answered and said[a], “Your father strictly put the people under oath, saying[b], ‘Cursed is the man who eats food today.’ So the people were faint.”
translation:
  language: hi
  text: तब लोगों में से एक ने उत्तर दिया, “तुम्हारे पिता ने लोगों को यह कहकर कड़ी शपथ दिलाई, ‘जो मनुष्य आज भोजन करे, वह शापित हो!’” और लोग थककर निढाल हो गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोग थक गए” अथवा “लोग दुर्बल हो गए।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן אִישׁ מֵהָעָם
  choice: तब लोगों में से एक ने उत्तर दिया
  rationale: यह अनिर्दिष्ट एक व्यक्ति को दर्शाता है और उत्तर देने के सामान्य इब्रानी कथात्मक मुहावरे को स्वाभाविक हिन्दी में रखता है।
- source_word: הַשְׁבֵּעַ הִשְׁבִּיעַ
  choice: कड़ी शपथ दिलाते हुए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute की तीव्रता तथा हिफ़िल के कारणवाचक अर्थ—लोगों को शपथ के अधीन करना—दोनों को व्यक्त करता है।
- source_word: אָבִיךָ
  choice: तुम्हारे पिता
  rationale: वचन योनातान को संबोधित है; दूसरा पुरुष एकवचन स्वामित्व को सीधे व्यक्त किया गया है।
- source_word: אָרוּר
  choice: शापित
  rationale: शाप-सूत्र की गंभीर और न्यायिक ध्वनि को स्पष्ट, प्रचलित हिन्दी में बनाए रखता है।
- source_word: הָאִישׁ אֲשֶׁר יֹאכַל
  choice: जो मनुष्य ... करे
  rationale: पुल्लिंग एकवचन में व्यक्त प्रतिनिधिक निषेध को स्रोत के निकट रखते हुए हिन्दी में स्वाभाविक बनाया गया है।
- source_word: לֶחֶם
  choice: भोजन
  rationale: शाब्दिक अर्थ ‘रोटी’ है, पर इस प्रसंग में यह सामान्यतः खाने की वस्तु या आहार को दर्शाता है; आगे योनातान शहद खाता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: प्रत्यक्ष कथन में समय-सूचक शब्द का स्वाभाविक आधुनिक हिन्दी समतुल्य है।
- source_word: וַיָּעַף הָעָם
  choice: लोग थककर निढाल हो गए
  rationale: क्रिया थकावट, दुर्बलता या निढाल होने की दशा दर्शाती है; उपवास और युद्ध के संदर्भ में यह अर्थ स्पष्ट है।
- source_word: הָעָם
  choice: लोग
  rationale: स्रोत का सामान्य शब्द रखा गया है, यद्यपि प्रसंग में इससे युद्धरत जन या सैनिक अभिप्रेत हैं।
