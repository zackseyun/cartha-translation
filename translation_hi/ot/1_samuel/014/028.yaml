  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। शपथ की तीव्रता को ‘कड़ी शपथ’ और अंतिम क्रिया की शारीरिक दुर्बलता को ‘थककर निढाल’ से व्यक्त किया गया है। ‘भोजन’ प्रसंगगत व्यापक अर्थ देता है; इसलिए ‘रोटी’ के लिए अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
