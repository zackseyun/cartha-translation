theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। हिन्दी पाठकों के लिए प्रतिष्ठित रूप ‘यहोवा’ उस नाम को उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: אֹתוֹ הֵחֵל לִבְנוֹת की व्याख्या
  choice: यह पहली वेदी थी जो उसने यहोवा के लिए बनाई थी
  alternative: उसी को उसने यहोवा के लिए वेदी के रूप में बनाना आरम्भ किया
  rationale: वाक्य-विन्यास को सामान्यतः शाऊल की पहली वेदी बताने वाला मुहावरा माना जाता है। फिर भी क्रिया הֵחֵל का सीधा अर्थ ‘आरम्भ किया’ है, इसलिए वास्तविक भाषिक अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वेदी’ धार्मिक संदर्भ में सर्वमान्य हिन्दी शब्द है। दूसरे खंड में मुहावरेदार अर्थ मुख्य पाठ में स्पष्ट किया गया है, जबकि स्रोत की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
