translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘योनातान’ और ‘पलिश्ती’ प्रचलित हिन्दी बाइबलीय नामरूप हैं। सैन्य पद के लिए भारी या पुरातन शब्दावली के बजाय सामान्य पाठक को समझ आनेवाला ‘चौकी’ चुना गया है।
