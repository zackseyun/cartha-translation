base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/001.yaml
  text: One day Jonathan son of Saul said to the young man who carried his armor[a], “Come[b], let us cross over to the Philistine garrison that is on the other side.” But he did not tell his father.
translation:
  language: hi
  text: एक दिन शाऊल के पुत्र योनातान ने अपने हथियार ढोनेवाले जवान से कहा, “आओ, हम उस पार पलिश्तियों की चौकी तक चलें।” पर उसने अपने पिता को यह बात नहीं बताई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: एक दिन
  rationale: यह इब्रानी कथात्मक मुहावरा समय का स्वाभाविक परिचय देता है; आधुनिक हिन्दी में ‘एक दिन’ सहज और पर्याप्त है।
- source_word: הַנַּעַר נֹשֵׂא כֵלָיו
  choice: अपने हथियार ढोनेवाले जवान
  rationale: נַעַר यहाँ सैनिक सेवा के योग्य युवक को दर्शाता है और נֹשֵׂא כֵלָיו का शाब्दिक भाव उसके सैन्य साज-सामान या हथियार उठानेवाले व्यक्ति का है। यह रूप ‘लड़का’ से अधिक प्रसंगानुकूल है।
- source_word: לְכָה וְנַעְבְּרָה
  choice: आओ, हम ... उस पार ... चलें
  rationale: לְכָה आग्रहसूचक ‘आओ’ है और cohortative रूप संयुक्त प्रस्ताव ‘हम चलें/पार जाएँ’ व्यक्त करता है। हिन्दी वाक्यक्रम में गंतव्य को बीच में रखकर स्वाभाविकता बनाए रखी गई है।
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: पलिश्तियों की चौकी
  rationale: מַצָּב सैन्य संदर्भ में तैनात दल या उसकी चौकी को सूचित कर सकता है। ‘चौकी’ आधुनिक हिन्दी में स्वाभाविक है और स्थान/तैनाती की मूल अस्पष्टता को बहुत अधिक नहीं बाँधती।
- source_word: אֲשֶׁר מֵעֵבֶר הַלָּז
  choice: उस पार
  rationale: इब्रानी पदबंध संकेतात्मक रूप से दूसरी ओर स्थित स्थान को दर्शाता है। पाठ में ‘दर्रा’ स्पष्ट नहीं है, इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
- source_word: וּלְאָבִיו לֹא הִגִּיד
  choice: पर उसने अपने पिता को यह बात नहीं बताई
  rationale: ו यहाँ प्रसंग में विरोधात्मक मोड़ देता है; ‘पर’ स्वाभाविक है। ‘यह बात’ हिन्दी में ‘बताई’ के साथ आवश्यक स्पष्टता देता है।
