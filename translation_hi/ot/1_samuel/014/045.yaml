  text: וַ/יֹּ֨אמֶר הָ/עָ֜ם אֶל שָׁא֗וּל הֲֽ/יוֹנָתָ֤ן יָמוּת֙ אֲשֶׁ֣ר עָ֠שָׂה הַ/יְשׁוּעָ֨ה הַ/גְּדוֹלָ֣ה הַ/זֹּאת֮ בְּ/יִשְׂרָאֵל֒ חָלִ֗ילָ/ה חַי יְהוָה֙ אִם יִפֹּ֞ל מִ/שַּׂעֲרַ֤ת רֹאשׁ/וֹ֙ אַ֔רְצָ/ה כִּֽי עִם אֱלֹהִ֥ים עָשָׂ֖ה הַ/יּ֣וֹם הַ/זֶּ֑ה וַ/יִּפְדּ֥וּ הָ/עָ֛ם אֶת יוֹנָתָ֖ן וְ/לֹא מֵֽת־׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/045.yaml
  text: But the people said to Saul[a], “Should Jonathan die, who has brought about this great deliverance in Israel? Far from it! As Yahweh lives, not one hair of his head shall fall to the ground, for he has worked with God this day.” So the people redeemed Jonathan[d][c][b], and he did not die.
translation:
  language: hi
  text: पर लोगों ने शाऊल से कहा, “क्या योनातान मर जाए, जिसने इस्राएल में यह महान छुटकारा[a] दिलाया है? ऐसा कभी न हो![b] यहोवा के जीवन की शपथ, उसके सिर का एक बाल भी भूमि पर नहीं गिरेगा, क्योंकि आज उसने परमेश्वर के साथ मिलकर काम किया है।”[c] इस प्रकार लोगों ने योनातान को छुड़ा लिया[d], और वह नहीं मरा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यह बड़ी विजय” अथवा “यह बड़ा उद्धार।” इब्रानी शब्द יְשׁוּעָה प्रसंग के अनुसार छुटकारा, उद्धार या विजय का अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “यह बात दूर रहे!” यह किसी बात को पूरी दृढ़ता से अस्वीकार करने की अभिव्यक्ति है।'
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, “क्योंकि आज उसने परमेश्वर के साथ काम किया है।” यह वाक्य योनातान के कार्य को परमेश्वर की संगति, सहायता या अनुग्रह में हुआ बताता है, पर उस संबंध को और अधिक स्पष्ट नहीं करता।
    reason: preserve_ambiguity
  - marker: d
    text: या “योनातान को दंड से मुक्त कराया।” इब्रानी क्रिया का अर्थ किसी दावे या दंड से छुड़ाना भी हो सकता है; यहाँ किसी मूल्य के चुकाए जाने का उल्लेख नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיוֹנָתָן יָמוּת
  choice: क्या योनातान मार डाला जाए
  rationale: प्रश्नवाचक הֲ और अपूर्ण क्रिया यहाँ रोषपूर्ण आलंकारिक प्रश्न बनाते हैं। प्रसंग न्यायिक मृत्युदंड का है, इसलिए कर्मवाच्य हिन्दी स्वाभाविक और स्पष्ट है।
- source_word: הַיְשׁוּעָה הַגְּדוֹלָה הַזֹּאת
  choice: यह बड़ी विजय
  rationale: יְשׁוּעָה का अर्थ छुटकारा, उद्धार या विजय हो सकता है। तत्काल सैनिक प्रसंग में ‘विजय’ सहज है; पादटिप्पणी व्यापक अर्थ सुरक्षित रखती है।
- source_word: בְּיִשְׂרָאֵל
  choice: इस्राएल में
  rationale: בְּ का स्थानीय/क्षेत्रगत भाव सीधे रखा गया है और यह बताता है कि विजय इस्राएल के बीच घटी।
- source_word: חָלִילָה
  choice: ऐसा कभी न हो!
  rationale: यह तीव्र अस्वीकृति का मुहावरा है। चयन मूल में न आया हुआ ईश-नाम जोड़े बिना उसका बल बनाए रखता है।
- source_word: חַי יְהוָה
  choice: जीवित यहोवा की शपथ
  rationale: यह मानक शपथ-सूत्र का स्वाभाविक हिन्दी रूप है और יהוה को उसके व्यक्तिवाचक नाम ‘यहोवा’ से प्रस्तुत करता है।
- source_word: אִם יִפֹּל מִשַּׂעֲרַת רֹאשׁוֹ אַרְצָה
  choice: उसके सिर का एक बाल भी भूमि पर नहीं गिरेगा
  rationale: शपथ-सूत्र के बाद אִם संदर्भतः प्रबल निषेध व्यक्त करता है। हिन्दी मुहावरा पूर्ण सुरक्षा का आशय साफ रखता है।
- source_word: כִּי עִם אֱלֹהִים עָשָׂה
  choice: क्योंकि आज उसने परमेश्वर के साथ मिलकर यह काम किया है
  rationale: עִם का मूल अर्थ ‘साथ’ सुरक्षित रखा गया है। ‘साथ मिलकर’ प्राकृतिक हिन्दी है और दैवी सहायता अथवा सहभागिता को उससे अधिक परिभाषित नहीं करता जितना इब्रानी करती है।
- source_word: וַיִּפְדּוּ הָעָם אֶת יוֹנָתָן
  choice: इस प्रकार लोगों ने योनातान को छुड़ा लिया
  rationale: פדה किसी दावे या दंड से मुक्त कराने का भाव रखता है। यहाँ किसी भुगतान का उल्लेख नहीं है, इसलिए ‘छुड़ा लिया’ आधुनिक पाठक के लिए स्वाभाविक रहते हुए प्रसंगगत अर्थ देता है।
- source_word: וְלֹא מֵת
  choice: और वह नहीं मारा गया
  rationale: शाब्दिक अर्थ ‘और वह नहीं मरा’ है, पर मृत्युदंड के संदर्भ में कर्मवाच्य हिन्दी अभिप्राय स्पष्ट करती है और पूर्ववर्ती प्रश्न से संगति रखती है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिवाचक नाम सीधे आया है। हिन्दी में प्रचलित बाइबलीय रूप ‘यहोवा’ नामत्व को बनाए रखता है; ‘याहवे’ ध्वन्यात्मक विकल्प है।
- issue: עִם אֱלֹהִים में योनातान और परमेश्वर के संबंध की प्रकृति
  choice: परमेश्वर के साथ मिलकर
  alternative: परमेश्वर की सहायता से
  rationale: ‘साथ’ मूल पूर्वसर्ग की वास्तविक अस्पष्टता और धर्मवैचारिक तनाव सुरक्षित रखता है; केवल ‘सहायता से’ कहना संबंध को अनावश्यक रूप से एक दिशा में समझाता।
- issue: פדה का छुटकारा-संबंधी भाव
  choice: छुड़ा लिया
  alternative: दाम देकर छुड़ा लिया
  rationale: क्रिया छुटकारा दिलाने का भाव रखती है, पर पद किसी दाम या विनिमय को स्पष्ट नहीं करता। अतः भुगतान को मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘भूमि’ और शपथ-सूत्र पद की गंभीरता रखते हैं, जबकि ‘छुड़ा लिया’ सामान्य पाठक के लिए स्वाभाविक है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में क्रम से उपस्थित हैं।
