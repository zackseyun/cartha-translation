  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली रखी गई है। पुनरावृत्त क्रियाओं के लिए ‘जब भी’ और ‘लेता था’ का प्रयोग किया गया है।
