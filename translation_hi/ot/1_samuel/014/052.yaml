  text: וַ/תְּהִ֤י הַ/מִּלְחָמָה֙ חֲזָקָ֣ה עַל פְּלִשְׁתִּ֔ים כֹּ֖ל יְמֵ֣י שָׁא֑וּל וְ/רָאָ֨ה שָׁא֜וּל כָּל אִ֤ישׁ גִּבּוֹר֙ וְ/כָל בֶּן חַ֔יִל וַ/יַּאַסְפֵ֖/הוּ אֵלָֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/052.yaml
  text: And the war against the Philistines was severe all the days of Saul[a]. Whenever Saul saw any mighty man or any valiant man[c][b], he gathered him to himself.
translation:
  language: hi
  text: शाऊल के जीवन भर पलिश्तियों के विरुद्ध घोर युद्ध होता रहा।[a] जब भी शाऊल किसी वीर पुरुष या किसी पराक्रमी पुरुष[b] को देखता, तो उसे अपने साथ जोड़ लेता था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रचंड युद्ध” अथवा “कठिन युद्ध।” हिब्रू विशेषण का शाब्दिक अर्थ “बलवान” है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “कोई वीर पुरुष या कोई पराक्रम-पुत्र।”
    reason: lexical_alternative
  - marker: c
    text: अर्थात शाऊल ऐसे पुरुषों को अपनी सेवा में भर्ती कर लेता था।
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּהִי הַמִּלְחָמָה חֲזָקָה
  choice: घोर युद्ध होता रहा
  rationale: यहाँ היה और חזק युद्ध की निरंतर तथा प्रबल स्थिति बताते हैं। ‘होता रहा’ जारी संघर्ष को और ‘घोर’ उसकी तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל פְּלִשְׁתִּים
  choice: पलिश्तियों के विरुद्ध
  rationale: מלחמה के साथ על संघर्ष के विरोधी पक्ष को चिह्नित करता है।
- source_word: כֹּל יְמֵי שָׁאוּל
  choice: शाऊल के जीवन भर
  rationale: हिब्रू मुहावरा शाऊल के जीवनकाल अथवा शासनकाल की पूरी अवधि को सूचित करता है; ‘जीवन भर’ आधुनिक हिन्दी में स्पष्ट और सहज है।
- source_word: וְרָאָה
  choice: जब भी ... देखता
  rationale: संदर्भ में यह बार-बार होने वाली प्रथागत क्रिया है, इसलिए पुनरावृत्त अर्थ को स्पष्ट किया गया है।
- source_word: כָּל אִישׁ גִּבּוֹר
  choice: किसी वीर योद्धा
  rationale: גבור में सामर्थ्य और युद्ध-कौशल का भाव है; ‘वीर योद्धा’ सैन्य संदर्भ को स्पष्ट रखता है।
- source_word: וְכָל בֶּן חַיִל
  choice: या किसी शूरवीर
  rationale: בן חיל का शाब्दिक रूप ‘पराक्रम का पुत्र’ है, पर यह पराक्रमी, योग्य या साहसी पुरुष का मुहावरा है; सैन्य संदर्भ में ‘शूरवीर’ उपयुक्त है।
- source_word: וַיַּאַסְפֵהוּ אֵלָיו
  choice: उसे अपने पास रख लेता था
  rationale: शाब्दिक अर्थ ‘उसे अपने पास इकट्ठा/सम्मिलित कर लेता’ है। हिन्दी वाक्यांश भर्ती या निजी सैन्य सेवा में लेने का आशय देता है, जबकि मूल क्रिया की व्यापकता बनाए रखता है।
