  text: וְ/שֵׁם֙ אֵ֣שֶׁת שָׁא֔וּל אֲחִינֹ֖עַם בַּת אֲחִימָ֑עַץ וְ/שֵׁ֤ם שַׂר צְבָא/וֹ֙ אֲבִינֵ֔ר בֶּן נֵ֖ר דּ֥וֹד שָׁאֽוּל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/050.yaml
  text: The name of Saul’s wife was Ahinoam daughter of Ahimaaz[a], and the name of the commander of his army was Abner son of Ner, Saul’s uncle.
translation:
  language: hi
  text: शाऊल की पत्नी का नाम अहीनोअम था, जो अहीमास की बेटी थी; और शाऊल की सेना के सेनापति का नाम अब्नेर था, जो नेर का बेटा और शाऊल का चाचा[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाऊल का निकट संबंधी।” इब्रानी शब्द व्यापक अर्थ में किसी निकट संबंधी को भी दर्शा सकता है, हालाँकि वंशावली के संदर्भ में “चाचा” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשֵׁם
  choice: नाम ... था
  rationale: इब्रानी नामवाचक रचना परिचयात्मक जानकारी देती है; हिंदी में ‘नाम ... था’ स्वाभाविक और सूत्रात्मक दोनों है।
- source_word: אֵשֶׁת
  choice: पत्नी
  rationale: शाऊल के साथ संबंधसूचक प्रयोग में यह स्पष्ट रूप से वैवाहिक संबंध बताता है।
- source_word: בַּת
  choice: बेटी
  rationale: यह मानक वंशावली-संबंध है; हिंदी वाक्य में ‘जो ... की बेटी थी’ स्पष्ट और स्वाभाविक है।
- source_word: שַׂר צְבָאוֹ
  choice: उसकी सेना का सेनापति
  rationale: सैन्य संदर्भ में שַׂר नेतृत्व-पद और צָבָא सैन्य बल को दर्शाता है; ‘सेनापति’ संक्षिप्त, प्रतिष्ठित और आधुनिक हिंदी में बोधगम्य है।
- source_word: בֶּן
  choice: बेटा
  rationale: मानक पितृवंशीय संबंध; ‘जो नेर का बेटा ... था’ हिंदी में सहज है।
- source_word: דּוֹד
  choice: चाचा
  rationale: वंशावली के इस संदर्भ में पुरुष पारिवारिक संबंध ‘चाचा’ सबसे संभावित है, यद्यपि शब्द व्यापक निकट पुरुष संबंधी को भी सूचित कर सकता है।
theological_decisions:
- issue: शाऊल की वंशावली में דּוֹד का अर्थ
  choice: शाऊल का चाचा
  alternative: शाऊल का निकट पुरुष संबंधी
  rationale: यह मुख्यतः वंशावली और शब्दार्थ का प्रश्न है। इस प्रसंग में ‘चाचा’ सर्वाधिक संभावित अर्थ है, पर व्यापक संबंधी का अर्थ संभव होने के कारण उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संबंधों को स्पष्ट करने के लिए समन्वित इब्रानी रचना को स्वाभाविक हिंदी उपवाक्यों में व्यक्त किया गया है।
