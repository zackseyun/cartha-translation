base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/008.yaml
  text: Jonathan said[a], “Look, we are crossing over to the men, and we will show ourselves to them.”
translation:
  language: hi
  text: योनातान ने कहा, “देखो, हम उन आदमियों की ओर जा रहे हैं और अपने आपको उनके सामने प्रकट करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר का यह कथात्मक रूप प्रत्यक्ष वचन का सामान्य परिचय है; आधुनिक हिन्दी में ‘ने कहा’ स्वाभाविक है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करके आगे की योजना बताता है; ‘देखो’ आधुनिक और सहज है।
- source_word: אֲנַחְנוּ עֹבְרִים
  choice: हम ... जा रहे हैं
  rationale: स्पष्ट बहुवचन सर्वनाम का बल बनाए रखते हुए कृदन्त से व्यक्त निकट या आरम्भ होने वाली गतिविधि को स्वाभाविक हिन्दी में रखा गया है।
- source_word: אֶל הָאֲנָשִׁים
  choice: उन आदमियों की ओर
  rationale: संदर्भ में दिखाई दे रहे पलिश्ती चौकी के पुरुषों की ओर गति व्यक्त होती है; हिन्दी में ‘उन’ संदर्भगत निश्चितता स्पष्ट करता है।
- source_word: וְנִגְלִינוּ
  choice: और अपने आपको ... प्रकट करेंगे
  rationale: גלה के निफ़अल रूप में यहाँ जानबूझकर अपने को दिखाई देना या प्रकट करना अभिप्रेत है; ‘प्रकट करेंगे’ इस अर्थ को गरिमापूर्ण और स्पष्ट ढंग से रखता है।
- source_word: אֲלֵיהֶם
  choice: उनके सामने
  rationale: लक्षित व्यक्तियों के समक्ष दिखाई देने का भाव हिन्दी में ‘उनके सामने’ से स्वाभाविक रूप से व्यक्त होता है।
