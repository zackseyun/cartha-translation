base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/015.yaml
  text: And there was trembling in the camp[a], in the field, and among all the people; the garrison and the raiding party also trembled. And the earth quaked, so that it became a trembling from God.
translation:
  language: hi
  text: तब छावनी में, मैदान में और सब लोगों में थरथराहट हुई; चौकी के सैनिक और छापा मारने वाला दल भी थरथराने लगे। धरती काँप उठी, और परमेश्वर की ओर से आई थरथराहट हुई।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बहुत बड़ी थरथराहट” अथवा “ईश्वरीय आतंक।” इब्रानी वाक्यांश स्रोत (“परमेश्वर की ओर से”) या अत्यधिक तीव्रता—दोनों में से किसी को व्यक्त कर सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: חֲרָדָה / חָרְדוּ / חֶרְדַּת
  choice: थरथराहट / थरथराने लगे
  rationale: भय के कारण काँपने का ठोस बिंब और पद में एक ही इब्रानी मूल की पुनरावृत्ति यथासंभव बनाए रखता है।
- source_word: בַמַּחֲנֶה בַשָּׂדֶה וּבְכָל הָעָם
  choice: छावनी में, मैदान में और सब लोगों के बीच
  rationale: तीनों स्थानगत वाक्यांशों का सीधा और स्वाभाविक हिन्दी रूप; עָם के व्यापक अर्थ को ‘लोगों’ से सुरक्षित रखा गया है।
- source_word: הַמַּצָּב
  choice: चौकी के सैनिक
  rationale: सैन्य संदर्भ में तैनात चौकी अथवा वहाँ के सैनिक अभिप्रेत हैं; हिन्दी में यह पद को केवल निर्जीव स्थान समझे जाने से बचाता है।
- source_word: הַמַּשְׁחִית
  choice: लुटेरा दल
  rationale: हिफ़ील कृदंत यहाँ सामूहिक सैन्य इकाई, अर्थात छापा मारकर लूटने वाले दल, को सूचित करता है।
- source_word: וַתִּרְגַּז הָאָרֶץ
  choice: धरती भी काँप उठी
  rationale: मानवीय भय से धरती के वास्तविक हिलने तक की तीव्रता को सहज और सजीव हिन्दी में व्यक्त करता है।
- source_word: לְחֶרְדַּת אֱלֹהִים
  choice: परमेश्वर की ओर से आई थरथराहट
  rationale: אֱלֹהִים को स्रोत-सूचक संबंध के रूप में व्यक्त करता है, साथ ही वैकल्पिक तीव्रतासूचक अर्थ को पादटिप्पणी में सुरक्षित रखता है।
theological_decisions:
- issue: לְחֶרְדַּת אֱלֹהִים का अर्थ
  choice: परमेश्वर की ओर से आई थरथराहट
  alternative: बहुत बड़ी थरथराहट; ईश्वरीय आतंक
  rationale: इब्रानी संबंध को परमेश्वर से उत्पन्न भय के रूप में समझा जा सकता है, पर यह अत्यधिक तीव्रता बताने वाला प्रयोग भी हो सकता है। मुख्य पाठ स्रोत-संबंध रखता है और दूसरी वास्तविक संभावना पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप। ‘थरथराहट/थरथराने’ की पुनरावृत्ति इब्रानी शब्द-क्रीड़ा को सुनाई देती रहने देती है; ‘भी’ से גַּם और धरती तक बढ़ती घटना का बल व्यक्त होता है।
