  text: וַ/יִּשְׁאַ֤ל שָׁאוּל֙ בֵּֽ/אלֹהִ֔ים הַֽ/אֵרֵד֙ אַחֲרֵ֣י פְלִשְׁתִּ֔ים הֲ/תִתְּנֵ֖/ם בְּ/יַ֣ד יִשְׂרָאֵ֑ל וְ/לֹ֥א עָנָ֖/הוּ בַּ/יּ֥וֹם הַ/הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/037.yaml
  text: Then Saul inquired of God[a], “Should I go down after the Philistines? Will you give them into the hand of Israel?” But he did not answer him that day.
translation:
  language: hi
  text: तब शाऊल ने परमेश्वर से पूछा, “क्या मैं पलिश्तियों का पीछा करने नीचे उतरूँ? क्या तू उन्हें इस्राएल के हाथ में दे देगा?” पर उस दिन उसने उसे उत्तर नहीं दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל שָׁאוּל בֵּאלֹהִים
  choice: शाऊल ने परमेश्वर से पूछा
  rationale: שׁאל के साथ בֵּאלֹהִים यहाँ साधारण प्रश्न नहीं, बल्कि परमेश्वर से मार्गदर्शन लेना दर्शाता है। हिंदी में ‘परमेश्वर से पूछा’ स्वाभाविक है और प्रसंग इस औपचारिक परामर्श को स्पष्ट करता है।
- source_word: הַאֵרֵד
  choice: क्या मैं ... नीचे जाऊँ?
  rationale: प्रश्नवाचक ה और प्रथम पुरुष अपूर्ण क्रिया मार्गदर्शन माँगने वाला विचार-विमर्श व्यक्त करते हैं; ‘नीचे जाऊँ’ ירד की दिशात्मकता भी बनाए रखता है।
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: पलिश्तियों के पीछे
  rationale: אַחֲרֵי का सीधा अर्थ ‘पीछे’ है; सैनिक प्रसंग में पीछा करने का भाव स्वतः स्पष्ट है, इसलिए उसे अधिक व्याख्यात्मक ‘पीछा करने’ में नहीं बदला गया।
- source_word: הֲתִתְּנֵם בְּיַד יִשְׂרָאֵל
  choice: क्या तू उन्हें इस्राएल के हाथ में कर देगा?
  rationale: נתן और ‘हाथ में’ का युद्ध-संदर्भित मुहावरा शत्रु को किसी के अधिकार में कर देने का अर्थ देता है। ‘हाथ में कर देगा’ मूल रूपक को रखते हुए सहज हिंदी है।
- source_word: וְלֹא עָנָהוּ
  choice: परन्तु ... उसने उसे उत्तर नहीं दिया
  rationale: וְ यहाँ अपेक्षा के विपरीत परिणाम लाता है, इसलिए ‘परन्तु’ उपयुक्त है। हिब्रू की तरह कर्ता को सर्वनाम ही रखा गया है; निकट प्रसंग से उसका संकेत परमेश्वर की ओर है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह समय-सूचक पद का सीधा और स्वाभाविक आधुनिक हिंदी रूप है।
theological_decisions:
- issue: उत्तर न देने वाले का अप्रकट कर्ता
  choice: ‘उसने’ द्वारा हिब्रू के अप्रकट कर्ता को बनाए रखा गया
  alternative: ‘परमेश्वर ने उसे उत्तर नहीं दिया’ कहकर कर्ता स्पष्ट करना
  rationale: प्रसंग से परमेश्वर कर्ता समझे जाते हैं, पर मूल पाठ उसे दोबारा स्पष्ट नाम से नहीं कहता। सर्वनाम पाठ की संक्षिप्तता और हल्की अस्पष्टता दोनों बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। परमेश्वर के लिए आदरसूचक किन्तु बाइबिलीय एकवचन ‘तू’ प्रयुक्त हुआ है। ‘पलिश्ती’ और ‘इस्राएल’ प्रचलित हिंदी बाइबिलीय नाम-रूप हैं।
