  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֣י חַי יְהוָ֗ה הַ/מּוֹשִׁ֨יעַ֙ אֶת יִשְׂרָאֵ֔ל כִּ֧י אִם יֶשְׁנ֛/וֹ בְּ/יוֹנָתָ֥ן בְּנִ֖/י כִּ֣י מ֣וֹת יָמ֑וּת וְ/אֵ֥ין עֹנֵ֖/הוּ מִ/כָּל הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/039.yaml
  text: For as Yahweh lives[a], who saves Israel, even if it is in Jonathan my son, he shall surely die.” But not one of all the people answered him.
translation:
  language: hi
  text: “क्योंकि इस्राएल को बचाने वाले यहोवा के जीवन की शपथ, यदि वह मेरे पुत्र योनातान में भी हो[a], तो वह अवश्य मरेगा।” परन्तु सारे लोगों में से किसी ने उसे उत्तर नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘यदि वह मेरे पुत्र योनातान में हो’; ‘वह’ किसे सूचित करता है, यह नहीं कहा गया है। प्रसंग से जाँच के अधीन दोष या अपराध समझ में आता है।
    reason: मूल पाठ की जानबूझकर छोड़ी गई वस्तु और उससे उत्पन्न वास्तविक अस्पष्टता स्पष्ट करना।
lexical_decisions:
- source_word: חַי יְהוָה
  choice: यहोवा के जीवन की शपथ
  rationale: यह इब्रानी की प्रचलित शपथ-विधि है। हिन्दी में यह रूप शपथ का आशय और कथन की गंभीरता स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिवाचक नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַמּוֹשִׁיעַ אֶת יִשְׂרָאֵל
  choice: इस्राएल को बचाने वाले
  rationale: संज्ञीकृत कृदन्त यहोवा का निरंतर परिचय देता है; ‘बचाने वाले’ इस गुणात्मक और वर्तमान अर्थ को बनाए रखता है।
- source_word: כִּי אִם
  choice: यदि ... भी
  rationale: शपथ के प्रसंग में यह एक चरम संभावित स्थिति प्रस्तुत करता है; हिन्दी में ‘यदि ... भी’ उसका बल स्वाभाविक रूप से दर्शाता है।
- source_word: יֶשְׁנוֹ בְּיוֹנָתָן בְּנִי
  choice: वह मेरे पुत्र योनातान में ... हो
  rationale: मूल पाठ में ‘वह’ किस वस्तु को सूचित करता है, यह स्पष्ट नहीं कहा गया; अनुवाद उसी अपूर्णता को बनाए रखता है और दोष को मुख्य पाठ में जोड़कर अर्थ सीमित नहीं करता।
- source_word: מוֹת יָמוּת
  choice: वह अवश्य मरेगा
  rationale: क्रिया के साथ उसी धातु का infinitive absolute मृत्यु की निश्चितता पर बल देता है। ‘अवश्य मरेगा’ उस बल को व्यक्त करता है, बिना मूल में निहित न होने वाली कर्मवाच्य अभिव्यक्ति जोड़ने के।
- source_word: וְאֵין עֹנֵהוּ מִכָּל הָעָם
  choice: परन्तु सारे लोगों में से किसी ने उसे उत्तर नहीं दिया
  rationale: ‘सारे लोगों में से’ विभाजक अर्थ को और ‘परन्तु’ शाऊल की घोषणा तथा लोगों की चुप्पी के बीच विरोध को स्पष्ट करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: आम हिन्दी बाइबलीय प्रयोग में पहचाने जाने वाले व्यक्तिवाचक रूप ‘यहोवा’ को रखा गया है; इसे सामान्य उपाधि से बदलकर मूल के नाम-संबंधी अर्थ को नहीं मिटाया गया।
- issue: योनातान में क्या पाए जाने की बात है
  choice: सर्वनामात्मक अस्पष्टता बनाए रखी गई—‘वह ... में हो’
  alternative: ‘दोष योनातान में पाया जाए’
  rationale: इब्रानी पाठ वस्तु को स्पष्ट नहीं करता। प्रसंग से दोष या अपराध समझ में आता है, पर उसे मुख्य पाठ में जोड़ना वास्तविक अस्पष्टता को समाप्त कर देता।
- issue: מוֹת יָמוּת में मृत्यु का स्वरूप
  choice: ‘अवश्य मरेगा’
  alternative: ‘अवश्य मार डाला जाएगा’
  rationale: प्रसंग न्यायिक दण्ड की ओर संकेत करता है, पर इब्रानी रूप स्वयं कर्मवाच्य नहीं है। इसलिए निश्चित मृत्यु का बल रखा गया और दण्ड देने वाले को स्पष्ट रूप से नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। शपथ की गंभीरता के लिए ‘यहोवा के जीवन की शपथ’ और निश्चितता के लिए ‘अवश्य’ का प्रयोग किया गया है। ‘वह ... में हो’ कुछ असामान्य होते हुए भी मूल की अर्थपूर्ण अपूर्णता को सुरक्षित रखता है; फुटनोट पाठक को प्रसंगगत संकेत देता है।
