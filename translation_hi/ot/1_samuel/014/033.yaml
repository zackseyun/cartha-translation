base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/033.yaml
  text: Then they told Saul[a], saying, “Look, the people are sinning against Yahweh by eating over the blood.” And he said, “You have acted treacherously. Roll a large stone to me today.”
translation:
  language: hi
  text: तब उन्होंने शाऊल को बताया, “देखिए, लोग लहू समेत मांस खाकर[a] याहवे के विरुद्ध पाप कर रहे हैं।” उसने कहा, “तुम लोगों ने विश्वासघात किया है। आज एक बड़ा पत्थर मेरे पास लुढ़काकर लाओ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लहू पर/के साथ खाकर।” यह इब्रानी मुहावरा ऐसे मांस को खाने को दर्शाता है जिसका लहू ठीक से निकाला नहीं गया था।
    reason: मूल मुहावरे की शाब्दिक बनावट और प्रसंगगत अर्थ दोनों स्पष्ट करना।
lexical_decisions:
- source_word: וַיַּגִּידוּ לְשָׁאוּל לֵאמֹר
  choice: तब उन्होंने शाऊल को बताया
  rationale: बहुवचन क्रिया और शाऊल को दिए गए समाचार को स्पष्ट रखते हुए हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त किया गया है; לֵאמֹר को अलग से ‘यह कहते हुए’ कहना आवश्यक नहीं है क्योंकि प्रत्यक्ष कथन तुरंत आता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान खींचने वाला कथन-कण है; ‘देखिए’ आधुनिक हिन्दी में उसके संवादात्मक बल को बनाए रखता है।
- source_word: הָעָם
  choice: लोग
  rationale: यह निश्चित सामूहिक संज्ञा संदर्भ में शाऊल के साथ के लोगों अथवा सैनिकों को दर्शाती है; ‘लोग’ अनावश्यक व्याख्या जोड़े बिना स्वाभाविक है।
- source_word: חֹטִאים לַיהוָה
  choice: याहवे के विरुद्ध पाप कर रहे हैं
  rationale: חטא के साथ ל यहाँ परमेश्वर के विरुद्ध अपराध का संबंध व्यक्त करता है। जारी क्रिया को ‘कर रहे हैं’ से दिखाया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित ध्वन्यात्मक रूप से प्रस्तुत किया गया है।
- source_word: לֶאֱכֹל עַל־הַדָּם
  choice: लहू समेत मांस खाकर
  rationale: शाब्दिक रूप ‘लहू पर/के साथ खाना’ है, पर संदर्भ में यह ठीक से लहू न निकाले गए मांस को खाने का मुहावरा है। ‘मांस’ को स्पष्ट करने से आधुनिक पाठक आशय समझता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: בְּגַדְתֶּם
  choice: तुम लोगों ने विश्वासघात किया है
  rationale: בגד केवल सामान्य नियम-भंग नहीं, बल्कि निष्ठाहीन या विश्वासघाती आचरण का गंभीर आरोप है; बहुवचन संबोधन ‘तुम लोगों’ से स्पष्ट किया गया है।
- source_word: גֹּלּוּ אֵלַי ... אֶבֶן גְּדוֹלָה
  choice: एक बड़ा पत्थर लुढ़काकर मेरे पास लाओ
  rationale: גלל का ठोस अर्थ ‘लुढ़काना’ है। हिन्दी में गंतव्य और अपेक्षित परिणाम को सहज बनाने के लिए ‘लाओ’ जोड़ा गया है।
- source_word: הַיּוֹם
  choice: आज ही
  rationale: मूल का समय-सूचक अर्थ ‘आज’ बनाए रखते हुए ‘ही’ आदेश की प्रसंगगत तत्परता व्यक्त करता है, उसे केवल ‘अभी’ में नहीं बदलता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला विशिष्ट वाचा-नाम सीधे आया है। ‘याहवे’ नाम को बनाए रखता है और उसे सामान्य उपाधि में नहीं बदलता।
- issue: लहू के साथ मांस खाने का अपराध
  choice: लहू समेत मांस खाकर
  alternative: लहू के ऊपर खाकर
  rationale: मूल की असामान्य पूर्वसर्गीय अभिव्यक्ति को हिन्दी में शब्दशः रखने पर अर्थ भ्रामक हो सकता है। संदर्भ मांस से लहू ठीक से निकाले बिना उसे खाने का है; पादटिप्पणी मूल की शाब्दिक बनावट और मुहावरे दोनों बताती है।
- issue: בגד के आरोप की नैतिक तीव्रता
  choice: विश्वासघात किया है
  alternative: अपराध किया है
  rationale: ‘विश्वासघात’ मूल में निहित निष्ठाहीनता की गंभीरता को सुरक्षित रखता है, जबकि अधिक सामान्य विकल्प इस तनाव को कम कर देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और बोलचाल में सहज रखी गई है। प्रत्यक्ष कथन में ‘देखिए’ सम्मानसूचक है, जैसा कि राजा को दी जा रही सूचना के लिए स्वाभाविक है। शाऊल के बहुवचन आरोप और आदेश को ‘तुम लोगों’ तथा बहुवचन-संगत आशय से स्पष्ट किया गया है।
