source:
  edition: WLC
  text: וַ/יַּכּ֞וּ בַּ/יּ֤וֹם הַ/הוּא֙ בַּ/פְּלִשְׁתִּ֔ים מִ/מִּכְמָ֖שׂ אַיָּלֹ֑נָ/ה וַ/יָּ֥עַף הָ/עָ֖ם מְאֹֽד׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/031.yaml
  text: That day they struck down the Philistines from Mikmash to Aijalon[a], and the people were very weary.
translation:
  language: hi
  text: उस दिन उन्होंने मिकमाश[a] से अय्यालोन तक पलिश्तियों को मार गिराया, और लोग बहुत थक गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस स्थान के नाम को ‘मिकमश’ भी लिखा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכּוּ
  choice: उन्होंने…मार गिराया
  rationale: नָכָה का यह कथात्मक भूतकालीन रूप युद्ध में प्रहार करके गिराने का भाव देता है। ‘मार गिराया’ सैन्य संदर्भ को स्पष्ट रखता है, पर इसे केवल ‘पराजित किया’ कहकर परिणाम को अधिक व्यापक नहीं बनाता।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह इब्रानी कालवाचक पद का स्वाभाविक और सीधा आधुनिक हिन्दी रूप है।
- source_word: בַּפְּלִשְׁתִּים
  choice: पलिश्तियों को
  rationale: यहाँ पूर्वसर्ग शत्रुतापूर्ण आक्रमण के लक्ष्य को दर्शाता है; हिन्दी में कर्मचिह्न ‘को’ इसी संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמִּכְמָשׂ אַיָּלֹנָה
  choice: मिकमाश से अय्यालोन तक
  rationale: מִן आरंभ-बिंदु बताता है और אַיָּלֹנָה में दिशासूचक प्रत्यय गंतव्य की ओर गति दर्शाता है; हिन्दी में ‘से…तक’ भौगोलिक विस्तार को सहज रूप से व्यक्त करता है।
- source_word: וַיָּעַף
  choice: थक गए
  rationale: यह क्रिया निर्बल या थका हुआ हो जाने का भाव रखती है। कथानक में अवस्था के विकसित होने को ‘थक गए’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעָם
  choice: लोग
  rationale: इब्रानी में यह सामूहिक एकवचन है। इस संदर्भ में ‘लोग’ सामान्य जनसमूह अथवा युद्ध में साथ आए लोगों को दर्शाता है, बिना इसे व्याख्यात्मक रूप से ‘सेना’ बनाने के।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह सामान्य तीव्रतासूचक क्रियाविशेषण है; ‘बहुत’ इसका सीधा और वर्तमान हिन्दी में स्वाभाविक समतुल्य है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य क्रिया के लिए ‘मार गिराया’ और सामूहिक הָעָם के लिए गैर-व्याख्यात्मक ‘लोग’ चुना गया है। स्थान-नामों का देवनागरी लिप्यंतरण इब्रानी उच्चारण के निकट रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी का चिह्न ‘Aijalon’ के बाद है, पर उसकी सामग्री स्पष्टतः ‘Mikmash/Michmash’ के वैकल्पिक रूप से संबंधित है; इसलिए हिन्दी में चिह्न ‘मिकमाश’ के बाद रखा गया है।
