  text: וּ/בֵ֣ין הַֽ/מַּעְבְּר֗וֹת אֲשֶׁ֨ר בִּקֵּ֤שׁ יֽוֹנָתָן֙ לַֽ/עֲבֹר֙ עַל מַצַּ֣ב פְּלִשְׁתִּ֔ים שֵׁן הַ/סֶּ֤לַע מֵ/הָ/עֵ֨בֶר֙ מִ/זֶּ֔ה וְ/שֵׁן הַ/סֶּ֥לַע מֵ/הָ/עֵ֖בֶר מִ/זֶּ֑ה וְ/שֵׁ֤ם הָֽ/אֶחָד֙ בּוֹצֵ֔ץ וְ/שֵׁ֥ם הָ/אֶחָ֖ד סֶֽנֶּה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/004.yaml
  text: Between the passes by which Jonathan sought to cross over to the Philistine garrison[a], there was a crag of rock on one side and a crag of rock on the other side; and the name of the one was Bozez, and the name of the other Seneh.
translation:
  language: hi
  text: योनातान ने पलिश्तियों की चौकी तक जाने के लिए जिन दर्रों से होकर पार जाना चाहा, उनके बीच एक ओर चट्टान की नुकीली कगार[a] थी और दूसरी ओर भी चट्टान की नुकीली कगार थी। एक का नाम बोसेस और दूसरी का नाम सेने था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “चट्टान का दाँत”; अर्थात चट्टान का तीखा, बाहर निकला हुआ भाग।
    reason: मूल हिब्रू के सजीव रूपक को सुरक्षित रखते हुए मुख्य पाठ के अर्थपरक अनुवाद की जानकारी देना।
lexical_decisions:
- source_word: הַמַּעְבְּרוֹת
  choice: दर्रों
  rationale: यह शब्द पार जाने के स्थानों या मार्गों को दर्शाता है। चट्टानी भूभाग के इस संदर्भ में ‘दर्रे’ स्वाभाविक है और जल-पार मार्ग का अनावश्यक संकेत नहीं देता।
- source_word: בִּקֵּשׁ ... לַעֲבֹר
  choice: पार जाना चाहा
  rationale: בקשׁ के साथ क्रिया का infinitive उद्देश्य या प्रयत्न व्यक्त करता है। ‘पार जाना चाहा’ योनातान के सोद्देश्य इरादे को सहज आधुनिक हिन्दी में रखता है, बिना यह निश्चित किए कि प्रयास आरम्भ हो चुका था।
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: पलिश्तियों की चौकी
  rationale: सैनिक प्रसंग में מַצָּב तैनात सैनिक दल या उसकी चौकी को सूचित करता है। ‘चौकी’ यहाँ स्थान और सैनिक उपस्थिति दोनों के लिए सरल और उपयुक्त है।
- source_word: שֵׁן הַסֶּלַע
  choice: चट्टान की नुकीली कगार
  rationale: शाब्दिक अर्थ ‘चट्टान का दाँत’ है; यह किसी तीखे, बाहर निकले चट्टानी भाग का बिंब है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक बिंब पादटिप्पणी में सुरक्षित है।
- source_word: מֵהָעֵבֶר מִזֶּה ... מֵהָעֵבֶר מִזֶּה
  choice: एक ओर ... दूसरी ओर
  rationale: दोहराया गया वाक्यांश मार्ग की आमने-सामने की दोनों दिशाओं को बताता है। यह हिन्दी में स्पष्ट और स्वाभाविक रूप है।
- source_word: שֵׁם הָאֶחָד ... וְשֵׁם הָאֶחָד
  choice: एक का नाम ... और दूसरी का नाम
  rationale: हिब्रू की नामकरण-संरचना को बनाए रखते हुए हिन्दी में कगार के स्त्रीलिंग के अनुसार ‘एक’ और ‘दूसरी’ का प्रयोग किया गया है।
- source_word: בּוֹצֵץ
  choice: बोसेस
  rationale: हिब्रू व्यक्तिवाचक स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: סֶנֶּה
  choice: सेने
  rationale: हिब्रू व्यक्तिवाचक स्थान-नाम का देवनागरी लिप्यंतरण।
- source_word: וּבֵין
  choice: उनके बीच
  rationale: आरम्भिक וְ कथा से संबंध जोड़ता है, जबकि בֵּין स्थानगत संबंध व्यक्त करता है। हिन्दी वाक्य-विन्यास में ‘उनके बीच’ इस संबंध को स्पष्ट करता है; अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
