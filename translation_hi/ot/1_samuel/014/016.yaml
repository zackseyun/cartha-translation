  text: And Saul’s watchmen in Gibeah of Benjamin looked[a], and behold, the multitude was melting away, and it went here and there.
translation:
  language: hi
  text: बिन्यामीन के गिबा में शाऊल के पहरेदारों ने देखा, और देखो, भीड़ बिखरती जा रही थी और इधर-उधर जा रही थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी के अंतिम शब्द बहुत संक्षिप्त हैं; अधिक शाब्दिक रूप में, “वह जा रही थी—इधर।” प्रसंग में यह पलिश्तियों की दिखाई देने वाली अव्यवस्था और अलग-अलग दिशाओं में उनकी गति को दर्शाता है।
    reason: मूल इब्रानी की संक्षिप्त और कुछ अस्पष्ट शब्दावली तथा अनुवाद में अपनाए गए ‘इधर-उधर’ का आधार बताना।
lexical_decisions:
- source_word: הַצֹּפִים
  choice: पहरेदारों
  rationale: צפה का कृदन्त रूप उन सैनिकों को दर्शाता है जिन्हें निगरानी के लिए तैनात किया गया था। ‘पहरेदार’ आधुनिक हिन्दी में स्वाभाविक है और उनकी नियुक्त भूमिका को स्पष्ट रखता है।
- source_word: לְשָׁאוּל
  choice: शाऊल के
  rationale: यहाँ לְ संबंध या संबद्धता बताता है—ये शाऊल से जुड़े हुए पहरेदार थे। हिन्दी का संबंधकारक ‘शाऊल के’ इसे सहज रूप से व्यक्त करता है।
- source_word: בְּגִבְעַת בִּנְיָמִן
  choice: बिन्यामीन के गिबा में
  rationale: यह स्थान का नाम और उसका क्षेत्रीय संबंध बताता है। ‘बिन्यामीन के गिबा में’ स्पष्ट और प्रचलित हिन्दी संरचना है।
- source_word: וְהִנֵּה
  choice: और क्या देखते हैं कि
  rationale: הִנֵּה अचानक सामने आए दृश्य की ओर ध्यान खींचता है। ‘क्या देखते हैं कि’ हिन्दी कथन में उसी जीवंत खोज और आश्चर्य को स्वाभाविक ढंग से रखता है।
- source_word: הֶהָמוֹן
  choice: वह भीड़
  rationale: הָמוֹן भीड़, जनसमूह या कोलाहलपूर्ण विशाल दल को सूचित कर सकता है। युद्ध-संदर्भ में ‘वह भीड़’ पलिश्ती दल के सामूहिक रूप को बनाए रखता है, बिना उसे मूल से अधिक निश्चित रूप से ‘सेना’ कहे।
- source_word: נָמוֹג
  choice: पिघलती जा रही थी
  rationale: מוג का मूल बिंब ‘पिघलना’ है और यहाँ वह दल के साहस या एकता टूटने को चित्रित करता है। हिन्दी में यह रूपक समझ में आता है और मूल की सजीवता को बचाता है।
- source_word: וַיֵּלֶךְ
  choice: जा रही थी
  rationale: एकवचन क्रिया का कर्ता सामूहिक संज्ञा ‘भीड़’ है। स्त्रीलिंग एकवचन हिन्दी क्रिया उसी सामूहिक कर्ता के साथ स्वाभाविक मेल रखती है।
- source_word: וַהֲלֹם
  choice: इधर-उधर
  rationale: הֲלֹם सामान्यतः ‘इधर/यहाँ की ओर’ है, पर इस संक्षिप्त संयोजन और युद्ध की अव्यवस्था में विभिन्न दिशाओं की गति अभिप्रेत जान पड़ती है। ‘इधर-उधर’ इस दृश्य को सहज हिन्दी में व्यक्त करता है।
