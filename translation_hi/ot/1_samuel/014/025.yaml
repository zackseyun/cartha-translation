  text: וְ/כָל הָ/אָ֖רֶץ בָּ֣אוּ בַ/יָּ֑עַר וַ/יְהִ֥י דְבַ֖שׁ עַל פְּנֵ֥י הַ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/025.yaml
  text: And all the people of the land entered the forest[b][a], and there was honey on the surface of the ground.
translation:
  language: hi
  text: और देश के सब लोग जंगल में पहुँचे[a], और ज़मीन की सतह पर शहद था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “सारा देश जंगल में पहुँचा।” यहाँ “देश” से सम्भवतः वहाँ उपस्थित लोग अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: b
    text: या “खेत की सतह पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל־הָאָרֶץ
  choice: और देश के सब लोग
  rationale: इब्रानी में शाब्दिक रूप से ‘और सारा देश’ है, पर बहुवचन क्रिया और प्रसंग से यहाँ ‘देश’ वहाँ उपस्थित लोगों के लिए सामूहिक लक्षणा है। स्वाभाविक हिन्दी में आशय स्पष्ट किया गया है, जबकि शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בָּאוּ בַיַּעַר
  choice: जंगल में पहुँचे
  rationale: בוא का अर्थ ‘आना, जाना, प्रवेश करना, पहुँचना’ हो सकता है। प्रसंग में ‘जंगल में पहुँचे’ सहज हिन्दी है और दिशा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: דְבַשׁ
  choice: शहद
  rationale: דבש का सामान्य अर्थ ‘शहद’ है। जंगल का प्रसंग जंगली शहद का संकेत दे सकता है, पर मूल पाठ में ‘जंगली’ स्पष्ट रूप से नहीं कहा गया।
- source_word: עַל־פְּנֵי הַשָּׂדֶה
  choice: ज़मीन की सतह पर
  rationale: עַל־פְּנֵי का अर्थ ‘की सतह पर’ है। שדה सामान्यतः ‘खेत’ या खुली भूमि हो सकता है, लेकिन जंगल के इस प्रसंग में ‘ज़मीन’ दृश्य धरातल का स्वाभाविक अर्थ देता है; ‘खेत’ का अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
