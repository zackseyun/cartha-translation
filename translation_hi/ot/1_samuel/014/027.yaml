base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/027.yaml
  text: But Jonathan had not heard when his father put the people under oath[a], so he stretched out the tip of the staff that was in his hand and dipped it into the honeycomb, and he brought his hand to his mouth[b], and his eyes brightened.
translation:
  language: hi
  text: पर योनातान ने यह नहीं सुना था कि उसके पिता ने लोगों से शपथ दिलाई थी। तब उसने अपने हाथ की लाठी का सिरा आगे बढ़ाकर उसे मधु के छत्ते[a] में डुबोया और अपना हाथ मुँह तक ले गया। उसकी आँखों में चमक आ गई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “मधु के वन/झुरमुट में”; हिब्रू अभिव्यक्ति संभवतः मधु के छत्ते या मधु के घने पिंड की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: “आँखों में चमक आ गई” एक हिब्रू मुहावरा है, जो खाने के बाद शक्ति या सजगता आने को दर्शाता है।
    reason: cultural_note
lexical_decisions:
- source_word: שָׁמַע
  choice: नहीं सुना था
  rationale: संदर्भ में इसका अर्थ आदेश न मानना नहीं, बल्कि शाऊल की शपथ की जानकारी न होना है; पूर्ण भूतकाल पूर्ववर्ती घटना को स्पष्ट करता है।
- source_word: בְּהַשְׁבִּיעַ
  choice: शपथ के अधीन किया है
  rationale: हिफ़ील रूप लोगों को शपथ दिलाने या शपथ से बाँधने का भाव देता है; यह विधिक गंभीरता को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: וַיִּשְׁלַח
  choice: आगे बढ़ाकर
  rationale: लाठी के सिरे के साथ क्रिया का आशय उसे फैलाना या आगे करना है, न कि भेजना।
- source_word: קְצֵה הַמַּטֶּה
  choice: लाठी का सिरा
  rationale: यह हाथ में पकड़ी लाठी के उस छोर को सहज और ठीक प्रकार से व्यक्त करता है जिसे मधु में डुबोया गया।
- source_word: וַיִּטְבֹּל אוֹתָהּ
  choice: उसे ... में डुबोया
  rationale: स्त्रीलिंग सर्वनाम लाठी के सिरे की ओर संकेत करता है; हिन्दी में यही संरचना स्पष्ट और स्वाभाविक है।
- source_word: בְּיַעְרַת הַדְּבָשׁ
  choice: मधु के छत्ते
  rationale: शाब्दिक बिंब 'मधु का वन/झुरमुट' असामान्य है; संदर्भ में मधु के घने पिंड या छत्ते का अर्थ संभावित है, इसलिए मुख्य पाठ में प्रासंगिक अर्थ और पादटिप्पणी में शाब्दिक विकल्प रखा गया है।
- source_word: וַיָּשֶׁב יָדוֹ אֶל פִּיו
  choice: अपना हाथ मुँह तक ले गया
  rationale: हिब्रू वाक्यांश खाने के लिए हाथ को मुँह तक लाने की क्रिया बताता है; अनावश्यक विवरण जोड़े बिना इसे निकटता से व्यक्त किया गया है।
- source_word: וַתָּרְאֶנָה עֵינָיו
  choice: उसकी आँखों में चमक लौट आई
  rationale: यह हिब्रू मुहावरा खाने के बाद नई शक्ति और सजगता आने का संकेत देता है; हिन्दी रूप मूल बिंब को बनाए रखता है।
