base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/019.yaml
  text: And it happened[a], while Saul was speaking to the priest, that the tumult in the camp of the Philistines kept increasing more and more. So Saul said to the priest, “Withdraw your hand.”
translation:
  language: hi
  text: जब तक शाऊल याजक से बात कर रहा था, तब तक पलिश्तियों की छावनी में कोलाहल बढ़ता ही जा रहा था। तब शाऊल ने याजक से कहा, “अपना हाथ समेट लो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपना हाथ इकट्ठा कर लो।” शाऊल याजक से वह क्रिया रोकने को कहता है जो वह कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי עַד דִּבֶּר
  choice: जब तक ... बात कर रहा था, तब तक
  rationale: यह रचना उस जारी बातचीत के दौरान समानांतर रूप से बढ़ती हलचल और अंततः उसके रुकने की ओर संकेत करती है। हिंदी में ‘जब तक ... तब तक’ समय-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: כהן का प्रचलित, गरिमापूर्ण और संदर्भानुकूल हिंदी रूप; निश्चित याजक प्रसंग में पहले से पहचाना गया है।
- source_word: הֶהָמוֹן
  choice: कोलाहल
  rationale: यहाँ शब्द केवल आवाज़ नहीं, बल्कि छावनी की शोरभरी अव्यवस्था और हलचल को दर्शाता है; ‘कोलाहल’ दोनों पक्ष समेटता है।
- source_word: בְּמַחֲנֵה פְלִשְׁתִּים
  choice: पलिश्तियों की छावनी में
  rationale: इब्रानी संबंधवाचक पदबंध का स्पष्ट और स्वाभाविक हिंदी अनुवाद।
- source_word: וַיֵּלֶךְ הָלוֹךְ וָרָב
  choice: बढ़ता ही जा रहा था
  rationale: क्रिया और infinitive absolute की रचना लगातार तीव्र होती वृद्धि बताती है; यह हिंदी मुहावरा उस प्रगतिशील बल को सहजता से व्यक्त करता है।
- source_word: אֱסֹף יָדֶךָ
  choice: अपना हाथ समेट लो
  rationale: शाब्दिक बिंब ‘अपना हाथ इकट्ठा/समेट’ को बनाए रखता है और संदर्भ में याजक को चल रही क्रिया रोकने की आज्ञा देता है। अर्थ को केवल ‘रुक जाओ’ बनाकर बिंब हटाया नहीं गया।
theological_decisions:
- issue: याजक के हाथ की क्रिया की सटीक पहचान
  choice: मुख्य पाठ में इब्रानी बिंब ‘अपना हाथ समेट लो’ रखा गया
  alternative: ‘पूछना बंद करो’ या किसी विशेष अनुष्ठान का नाम देना
  rationale: पद स्वयं यह स्पष्ट नहीं करता कि याजक ठीक कौन-सी क्रिया कर रहा था। किसी खास भविष्यवाणी-विधि या वस्तु को जोड़ना पाठ की वास्तविक अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘कोलाहल’ और ‘छावनी’ सामान्य बोधगम्यता के साथ बाइबलीय प्रसंग की गंभीरता बनाए रखते हैं।
