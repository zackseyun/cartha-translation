  text: And the men of the garrison answered Jonathan and his armor-bearer and said[a], “Come up to us, and we will tell you something.” Then Jonathan said to his armor-bearer, “Come up after me[d][c][b], for Yahweh has given them into the hand of Israel.”
translation:
  language: hi
  text: चौकी पर तैनात सैनिकों ने योनातान और उसके हथियार उठानेवाले को उत्तर दिया, “हमारे पास ऊपर आओ, तब हम तुम्हें एक बात बताएँगे।” योनातान ने अपने हथियार उठानेवाले से कहा, “मेरे पीछे-पीछे ऊपर आ, क्योंकि याहवे ने उन्हें इस्राएल के हाथ में दे दिया है।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “इस्राएल के हाथ में दे दिया है” का अर्थ है “इस्राएल के अधिकार में दे दिया है।”
    reason: इब्रानी मुहावरे का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: אַנְשֵׁי הַמַּצָּבָה
  choice: चौकी पर तैनात सैनिक
  rationale: सैन्य प्रसंग में מַצָּבָה किसी तैनात चौकी या सैन्य स्थान को दर्शाता है; यह अनुवाद स्थान और वहाँ तैनात लोगों दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֹשֵׂא כֵלָיו
  choice: उसका हथियार ढोनेवाला
  rationale: शाब्दिक अर्थ उसके हथियार या सैन्य सामान उठानेवाला व्यक्ति है। ‘हथियार ढोनेवाला’ आधुनिक पाठक के लिए स्पष्ट है और केवल कवच तक अर्थ सीमित नहीं करता।
- source_word: עֲלוּ אֵלֵינוּ
  choice: हमारे पास ऊपर आओ
  rationale: עלה ऊँचे स्थान की ओर गति को और אֵלֵינוּ वक्ताओं की ओर आने को व्यक्त करता है।
- source_word: וְנוֹדִיעָה אֶתְכֶם דָּבָר
  choice: तब हम तुम्हें एक बात बताएँगे
  rationale: ידע का हिफ़ील रूप ‘ज्ञात कराना/बताना’ है और דָּבָר यहाँ जानबूझकर अनिश्चित ‘एक बात’ है।
- source_word: עֲלֵה אַחֲרַי
  choice: मेरे पीछे ऊपर आ
  rationale: एकवचन आज्ञा और ऊपर चढ़ते हुए पीछे आने, दोनों भाव सुरक्षित रखे गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है; उसका लिप्यंतरण किया गया है, किसी उपाधि से प्रतिस्थापित नहीं।
- source_word: בְּיַד יִשְׂרָאֵל
  choice: इस्राएल के हाथ में
  rationale: ‘हाथ में देना’ शत्रु को किसी के अधिकार में कर देने का इब्रानी मुहावरा है और हिन्दी में भी बोधगम्य है।
theological_decisions:
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत दिव्य नाम प्रत्यक्ष रूप से है; ‘याहवे’ मूल नाम का निकट लिप्यंतरण है।
- issue: योनातान के विश्वासपूर्ण कथन का काल और आशय
  choice: ने उन्हें इस्राएल के हाथ में कर दिया है
  alternative: उन्हें इस्राएल के हाथ में कर देगा
  rationale: मूल में נתן पूर्ण रूप है। कथन आगामी विजय को इतना निश्चित मानकर कहता है मानो वह दे दी गई हो; इसे भविष्यकाल में बदलकर उस तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य शब्दावली को सामान्य पाठक के लिए स्पष्ट बनाया गया है, जबकि ऊपर चढ़ने की भौगोलिक गति, एकवचन-बहुवचन का अंतर और मूल का विजय-संबंधी मुहावरा सुरक्षित रखा गया है।
