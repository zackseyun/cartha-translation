  text: וַ/יָּבֹ֤א הָ/עָם֙ אֶל הַ/יַּ֔עַר וְ/הִנֵּ֖ה הֵ֣לֶךְ דְּבָ֑שׁ וְ/אֵין מַשִּׂ֤יג יָד/וֹ֙ אֶל פִּ֔י/ו כִּֽי יָרֵ֥א הָ/עָ֖ם אֶת הַ/שְּׁבֻעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/026.yaml
  text: When the people came into the forest[a], behold, there was a flow of honey, but no one put his hand to his mouth[c][b], because the people feared the oath.
translation:
  language: hi
  text: जब लोग जंगल में पहुँचे, तो देखा कि शहद बह रहा था[a]; पर किसी ने अपना हाथ मुँह तक नहीं पहुँचाया[b], क्योंकि लोग उस शपथ से डरते थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शहद की धारा बह रही थी।” इब्रानी अभिव्यक्ति का शाब्दिक अर्थ “शहद का बहाव” है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “किसी ने अपना हाथ अपने मुँह तक नहीं पहुँचाया”; अर्थात किसी ने उस शहद में से नहीं खाया।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “शपथ” है। प्रसंग में यह शाऊल की पहले दिलाई हुई शपथ को दर्शाता है, जिसके साथ शाम से पहले खाने वाले पर श्राप की घोषणा जुड़ी थी (देखें 1 शमूएल 14:24)।
    reason: cross_reference
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचे
  rationale: यहाँ בוא लोगों के जंगल में आने को बताता है। हिंदी में बहुवचन कर्ता के साथ ‘पहुँचे’ स्वाभाविक और स्पष्ट है।
- source_word: הָעָם
  choice: लोग
  rationale: עם का सामान्य अर्थ ‘लोग’ है। प्रसंग में वे सैनिक हैं, फिर भी मूल शब्द की व्यापकता बनाए रखने के लिए ‘लोग’ रखा गया है।
- source_word: הַיַּעַר
  choice: जंगल
  rationale: יער पेड़ों से भरे क्षेत्र या वन को दर्शाता है। आधुनिक सामान्य हिंदी में ‘जंगल’ सबसे सहज है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: הנה अचानक सामने आए दृश्य की ओर ध्यान खींचता है। ‘तो देखा कि’ हिंदी कथन में इसकी दृश्यात्मकता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֵלֶךְ דְּבָשׁ
  choice: शहद बह रहा था
  rationale: इस असामान्य इब्रानी पदबंध का आशय शहद के बहने से है। क्रियात्मक हिंदी अनुवाद मूल अर्थ को स्पष्ट रखता है, जबकि ‘शहद की धारा’ कुछ अधिक व्याख्यात्मक हो सकता है।
- source_word: וְאֵין מַשִּׂיג יָדוֹ אֶל פִּיו
  choice: पर किसी ने अपना हाथ मुँह तक नहीं पहुँचाया
  rationale: यह मूल की ठोस अभिव्यक्ति को बनाए रखता है; प्रसंग में इसका अर्थ है कि किसी ने शहद नहीं खाया।
- source_word: כִּי יָרֵא הָעָם אֶת הַשְּׁבֻעָה
  choice: क्योंकि लोग उस शपथ से डरते थे
  rationale: כי कारण बताता है, और ירא यहाँ शपथ तोड़ने के परिणाम के भय को व्यक्त करता है। שבועה का सीधा अर्थ ‘शपथ’ है, इसलिए ‘श्राप’ को मुख्य पाठ में नहीं रखा गया।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और कथात्मक रखी गई है। ‘जंगल’ और ‘शहद’ सामान्य पाठकों के लिए स्वाभाविक शब्द हैं। मूल इब्रानी मुहावरे की ठोस छवि मुख्य पाठ में सुरक्षित है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
