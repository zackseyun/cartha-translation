base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/002.yaml
  text: Saul was staying at the outskirts of Gibeah[a], under the pomegranate tree that is at Migron[b], and the people who were with him were about six hundred men.
translation:
  language: hi
  text: शाऊल गिबा के छोर पर[a], मिग्रोन में अनार के पेड़ के नीचे ठहरा हुआ था, और उसके साथ जो लोग थे, वे लगभग छह सौ पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिबा के छोर पर बैठा हुआ था।” इब्रानी कृदन्त का अर्थ किसी स्थान पर बैठना या वहाँ ठहरे रहना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹשֵׁב
  choice: ठहरा हुआ था
  rationale: ישׁב का कृदन्त बैठने, रहने या किसी स्थान पर ठहरे रहने का अर्थ दे सकता है। सैन्य कथा के इस प्रसंग में यह अनुवाद शाऊल के वहाँ बने रहने को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि केवल उसकी शारीरिक मुद्रा तय नहीं करता।
- source_word: בִּקְצֵה
  choice: के छोर पर
  rationale: קָצֶה का मूल स्थानिक अर्थ किनारा, सिरा या छोर है। ‘के छोर पर’ इस अर्थ को बनाए रखता है और यह अनावश्यक रूप से तय नहीं करता कि स्थान नगर-सीमा था या बाहरी इलाका।
- source_word: הַגִּבְעָה
  choice: गिबा
  rationale: संदर्भ में यह शाऊल से जुड़ा स्थाननाम है; इसलिए इसे सामान्य संज्ञा ‘पहाड़ी’ के बजाय लिप्यंतरित किया गया है।
- source_word: תַּחַת הָרִמּוֹן
  choice: अनार के पेड़ के नीचे
  rationale: रिम्मोन का शाब्दिक अर्थ ‘अनार’ है, पर इस स्थानसूचक प्रयोग में आशय अनार के पेड़ से है। स्पष्ट और स्वाभाविक हिन्दी के लिए ‘पेड़’ जोड़ा गया है।
- source_word: אֲשֶׁר בְּמִגְרוֹן
  choice: मिग्रोन में
  rationale: सम्बन्धवाचक उपवाक्य अनार के पेड़ का स्थान बताता है। हिन्दी में संक्षिप्त स्थानसूचक पद स्वाभाविक है और वही सम्बन्ध बनाए रखता है।
- source_word: וְהָעָם אֲשֶׁר עִמּוֹ
  choice: और उसके साथ ... पुरुष थे
  rationale: עָם का व्यापक अर्थ ‘लोग’ है, पर अगले पद में संख्या के साथ אִישׁ ‘पुरुष’ आता है। हिन्दी में पुनरुक्ति से बचते हुए साथ उपस्थित समूह को ‘पुरुष’ से व्यक्त किया गया है; इसे अधिक विशिष्ट ‘सैनिक’ नहीं बनाया गया।
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: लगभग छः सौ पुरुष
  rationale: उपसर्ग כְּ यहाँ अनुमान प्रकट करता है, इसलिए ‘लगभग’ आवश्यक है; संख्या के बाद אִישׁ को स्वाभाविक हिन्दी में ‘पुरुष’ कहा गया है।
