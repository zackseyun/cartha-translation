  yaml_path: translation/ot/1_samuel/014/011.yaml
  text: When the two of them revealed themselves to the Philistine garrison[a], the Philistines said, “Look[b], the Hebrews are coming out of the holes where they had hidden themselves.”
translation:
  language: hi
  text: जब उन दोनों ने पलिश्तियों की चौकी[a] के सामने अपने आपको प्रकट किया, तब पलिश्तियों ने कहा, “देखो, इब्री[b] उन बिलों से बाहर निकल रहे हैं, जहाँ वे छिपे हुए थे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्तियों की चौकी के सामने प्रकट हुए।”
    reason: lexical_alternative
  - marker: b
    text: “इब्री” पलिश्तियों द्वारा इस्राएलियों के लिए इस्तेमाल किया गया जातीय नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּגָּלוּ
  choice: अपने आप को प्रकट किया
  rationale: निफ़अल रूप यहाँ संदर्भ में जानबूझकर स्वयं को दिखाई देने देने का भाव रखता है; यह अनावश्यक निष्क्रियता से बचते हुए मूल की प्रतिवर्ती छाया बनाए रखता है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों ने
  rationale: योनातान और उसके हथियार ढोनेवाले, दोनों पर स्पष्ट बल बनाए रखता है और स्वाभाविक हिन्दी है।
- source_word: מַצַּב פְּלִשְׁתִּים
  choice: पलिश्तियों की चौकी
  rationale: सैन्य प्रसंग में מַצָּב तैनात दल या उसकी चौकी को सूचित कर सकता है; ‘चौकी’ आधुनिक पाठकों के लिए स्पष्ट है और स्थान तथा तैनाती दोनों का संकेत देती है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले विस्मयात्मक संकेत को सहज, आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עִבְרִים
  choice: इब्री
  rationale: पलिश्तियों द्वारा इस्राएलियों के लिए प्रयुक्त बाहरी जातीय नाम को ‘इस्राएली’ में बदलने के बजाय सुरक्षित रखता है।
- source_word: יֹצְאִים
  choice: बाहर निकल रहे हैं
  rationale: कृदंत पलिश्तियों की दृष्टि से जारी क्रिया को व्यक्त करता है; यह हिन्दी में स्वाभाविक और दृश्यात्मक है।
- source_word: מִן הַחֹרִים
  choice: उन गड्ढों से
  rationale: חֹרִים छेदों, खोहों या गड्ढों जैसे खोखले स्थानों को दर्शाता है; ‘गड्ढों’ से ठोस और संभवतः तिरस्कारपूर्ण शब्दावली बनी रहती है, बिना इसे विशेष रूप से ‘गुफाएँ’ कहे।
- source_word: אֲשֶׁר הִתְחַבְּאוּ שָׁם
  choice: जहाँ वे छिपे हुए थे
  rationale: स्थान-संबंधी उपवाक्य और पूर्व से चली आ रही छिपने की अवस्था को सहज हिन्दी में व्यक्त करता है; मूल का हित्पअेल आत्म-संबंधी भाव क्रिया ‘छिपना’ में स्वाभाविक रूप से निहित है।
