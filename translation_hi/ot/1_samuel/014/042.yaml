  yaml_path: translation/ot/1_samuel/014/042.yaml
  text: Then Saul said[a], “Cast lots between me and Jonathan my son.” And Jonathan was taken.
translation:
  language: hi
  text: तब शाऊल ने कहा, “मेरे और मेरे पुत्र योनातान के बीच चिट्ठी डालो।” और योनातान चुना गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, “योनातान पकड़ा गया”; चिट्ठी डालने के इस प्रसंग में अर्थ है कि चिट्ठी से योनातान चुना या चिन्हित हुआ।
    reason: ‘पकड़ा गया’ के शाब्दिक अर्थ को सुरक्षित रखते हुए चिट्ठी द्वारा चयन का प्रसंगगत अर्थ स्पष्ट करता है।
lexical_decisions:
- source_word: הַפִּילוּ
  choice: चिट्ठी डालो
  rationale: यह נפל के हिफ़ील बहुवचन आज्ञार्थक का प्रसंगानुकूल मुहावरेदार अर्थ है। आसपास का वर्णन चिट्ठी द्वारा निर्णय का है; इसलिए हिन्दी में निहित साधन को स्पष्ट करना स्वाभाविक है।
- source_word: בֵּינִי וּבֵין
  choice: मेरे और ... के बीच
  rationale: दो पक्षों के बीच चयन या भेद को व्यक्त करने वाली युग्मित पूर्वसर्गीय रचना का स्वाभाविक हिन्दी रूप।
- source_word: בְּנִי
  choice: मेरे पुत्र
  rationale: בן पर प्रथम पुरुष एकवचन प्रत्यय स्पष्ट रूप से पुत्र-संबंध बताता है। ‘पुत्र’ कथात्मक गरिमा बनाए रखते हुए आधुनिक हिन्दी में सुबोध है।
- source_word: וַיִּלָּכֵד
  choice: पकड़ा गया
  rationale: לכד के निफ़अल रूप का मूल अर्थ ‘पकड़ा गया’ है। यहाँ चिट्ठी के प्रसंग में आशय चुने या निर्दिष्ट किए जाने का है; मुख्य पाठ मूल की संक्षिप्तता और अर्थ-तनाव को बनाए रखता है, जबकि पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- source_word: יוֹנָתָן
  choice: योनातान
  rationale: हिब्रू नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: וַיֹּאמֶר
  choice: तब शाऊल ने कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
