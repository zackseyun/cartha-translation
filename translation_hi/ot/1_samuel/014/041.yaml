base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/041.yaml
  text: Then Saul said to Yahweh[a], the God of Israel, “Give a perfect lot.” And Jonathan and Saul were taken, but the people escaped.
translation:
  language: hi
  text: तब शाऊल ने इस्राएल के परमेश्वर यहोवा से कहा, “निर्दोष निर्णय दे।”[a] चिट्ठी डालने में योनातान और शाऊल चुने गए, और लोग बच निकले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “निर्दोष/सम्पूर्ण दे।” सम्भवतः आशय चिट्ठी के द्वारा ऐसा निर्णय माँगना है जिस पर कोई संदेह न हो। प्राचीन यूनानी अनुवाद में यहाँ एक लम्बा पाठ मिलता है: “आज तूने अपने दास को उत्तर क्यों नहीं दिया? यदि यह दोष मुझमें या मेरे पुत्र योनातान में है, तो हे इस्राएल के परमेश्वर यहोवा, ऊरीम दे; पर यदि यह दोष तेरी प्रजा इस्राएल में है, तो तुम्मीम दे।”'
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, न कि उसके स्थान पर कोई उपाधि।
- source_word: הָבָה
  choice: दे
  rationale: परमेश्वर से की गई सीधी विनती को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: תָמִים
  choice: निर्दोष निर्णय
  rationale: शब्द का मूल भाव ‘सम्पूर्ण, खरा, निर्दोष’ है। चिट्ठी डालने के प्रसंग में यह ऐसे निर्णय की माँग जान पड़ता है जिस पर दोष या संदेह न हो; ‘चिट्ठी’ को सीधे वाक्य में जोड़ने के बजाय कठिन और संक्षिप्त इब्रानी को कुछ हद तक बनाए रखा गया है।
- source_word: וַיִּלָּכֵד
  choice: चिट्ठी में ... पकड़े गए
  rationale: לכד का निष्क्रिय भाव ‘पकड़ा/चुना जाना’ है। ‘चिट्ठी में’ प्रसंग स्पष्ट करता है और ‘पकड़े गए’ मूल मुहावरे की न्यायिक तीव्रता बनाए रखता है।
- source_word: יָצָאוּ
  choice: छूट गए
  rationale: शाब्दिक ‘निकल गए’ यहाँ पकड़े जाने के विपरीत है; ‘छूट गए’ स्पष्ट करता है कि लोग चिट्ठी द्वारा दोषी पक्ष के रूप में नहीं चुने गए।
theological_decisions:
- issue: शाऊल की प्रार्थना का पाठ-रूप
  choice: मुख्य पाठ में मसोराई इब्रानी का संक्षिप्त और कठिन पाठ, ‘निर्दोष निर्णय दे,’ रखा गया है।
  alternative: प्राचीन यूनानी पाठ में विस्तृत प्रार्थना है, जिसमें ऊरीम और तुम्मीम माँगे जाते हैं।
  rationale: प्रदत्त मूल स्रोत WLC है; इसलिए उसके कठिन पाठ को चुपचाप विस्तृत पाठ से नहीं बदला गया। प्राचीन वैकल्पिक पाठ को पाठक के लिए पादटिप्पणी में पारदर्शी रूप से सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निर्दोष निर्णय’ मूल के असामान्य संक्षिप्त रूप और प्रसंगगत अर्थ के बीच संतुलन रखता है; पाठांतर को मुख्य पाठ में मिलाने के बजाय पादटिप्पणी में दिया गया है।
