base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/047.yaml
  text: 'Saul had secured the kingship over Israel[a], and he fought against all his enemies on every side: against Moab, against the Ammonites, against Edom, against the kings of Zobah, and against the Philistines. Wherever he turned, he inflicted punishment.'
translation:
  language: hi
  text: शाऊल ने इस्राएल पर राजसत्ता हासिल कर ली और वह चारों ओर अपने सभी शत्रुओं से लड़ा—मोआब से, अम्मोनियों से, एदोम से, सोबा के राजाओं से और पलिश्तियों से। वह जिधर भी मुड़ा, वहाँ उन्हें दंडित करता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक रूप में, “उन्हें दोषी ठहराता।” इब्रानी क्रिया का अर्थ दोषी घोषित करना हो सकता है; यहाँ संभवतः आशय शत्रुओं को दंडात्मक पराजय देने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לָכַד הַמְּלוּכָה עַל יִשְׂרָאֵל
  choice: इस्राएल पर अपना राजपद दृढ़ कर लिया
  rationale: לכד का मूल भाव पकड़ने या अधिकार में लेने का है, किंतु इस प्रसंग में הַמְּלוּכָה अमूर्त राजपद/राजसत्ता को दर्शाता है। यह अनुवाद शाऊल द्वारा अपने शासन को सुदृढ़ करने का भाव देता है, बिना इसे अनुचित सत्ता-हरण ठहराए।
- source_word: וַיִּלָּחֶם סָבִיב בְּכָל אֹיְבָיו
  choice: वह चारों ओर अपने सभी शत्रुओं से लड़ा
  rationale: לחם के साथ ב विरोधी पक्ष को सूचित करता है; आधुनिक हिन्दी में ‘से लड़ा’ स्वाभाविक है। סָבִיב का ‘चारों ओर’ आसपास के सभी मोर्चों का अर्थ स्पष्ट करता है।
- source_word: בְּמוֹאָב וּבִבְנֵי עַמּוֹן וּבֶאֱדוֹם וּבְמַלְכֵי צוֹבָה וּבַפְּלִשְׁתִּים
  choice: मोआब से, अम्मोनियों से, एदोम से, सोबा के राजाओं से और पलिश्तियों से
  rationale: बार-बार आए ב को ‘से’ द्वारा रखा गया है। בְּנֵי עַמּוֹן का स्वाभाविक जातिवाचक रूप ‘अम्मोनी’ है और מַלְכֵי का बहुवचन ‘राजाओं’ के रूप में सुरक्षित है।
- source_word: וּבְכֹל אֲשֶׁר יִפְנֶה
  choice: वह जिधर भी मुड़ा
  rationale: यह हिन्दी में בכל אשר के वितरणात्मक भाव और פנה के दिशा बदलने के अर्थ को संक्षिप्त तथा स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַרְשִׁיעַ
  choice: उधर दंड देता गया
  rationale: רשע के हिफ़ईल रूप का यहाँ अर्थ कठिन है; युद्ध-संदर्भ में यह दोषी ठहराने अथवा दंडात्मक पराजय देने का संकेत देता है। ‘दंड देता गया’ न्यायात्मक और सैन्य दोनों रंगों को यथासंभव बनाए रखता है।
theological_decisions:
- issue: יַרְשִׁיעַ में न्यायिक और सैन्य अर्थ का तनाव
  choice: दंड देता गया
  alternative: दोषी ठहराता गया / पराजित करता गया
  rationale: केवल ‘पराजित करता गया’ न्यायिक अर्थ को मिटा देता, जबकि केवल ‘दोषी ठहराता गया’ युद्ध में हुए वास्तविक प्रतिकूल परिणाम को कम स्पष्ट करता। मुख्य पाठ में व्यापक ‘दंड’ और पादटिप्पणी में अधिक शाब्दिक विकल्प दोनों अर्थ-छायाओं को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘राजपद’ संस्था/पद के अर्थ को ‘राज्य’ की भौगोलिक संभावित भ्रांति से बचाता है। युद्ध-सूची की पुनरावृत्ति और सोबा के ‘राजाओं’ का मूल बहुवचन सुरक्षित रखा गया है।
