  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ לַֽ/אֲחִיָּ֔ה הַגִּ֖ישָׁ/ה אֲר֣וֹן הָ/אֱלֹהִ֑ים כִּֽי הָיָ֞ה אֲר֧וֹן הָ/אֱלֹהִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא וּ/בְנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/018.yaml
  text: Then Saul said to Ahijah[b][a], “Bring the ark of God here,” for the ark of God was that day with the sons of Israel.
translation:
  language: hi
  text: तब शाऊल ने अहिय्याह से कहा, “परमेश्वर का संदूक यहाँ ले आओ,”[a] क्योंकि उस दिन परमेश्वर का संदूक इस्राएलियों के साथ था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन पाठ-परंपराएँ और व्याख्याकार यहाँ “परमेश्वर का संदूक यहाँ ले आओ” के स्थान पर “एपोद यहाँ ले आओ” पढ़ते हैं। यहाँ दिए गए इब्रानी पाठ में “परमेश्वर का संदूक” है।
    reason: textual_variant
  - marker: b
    text: 'इसका अनुवाद यह भी हो सकता है: “उस दिन वहाँ इस्राएलियों के साथ था।”'
    reason: previous_rendering
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַאֲחִיָּה
  choice: अहिय्याह से
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण किया गया है; हिन्दी में ‘कहा’ के साथ ‘से’ स्वाभाविक है।
- source_word: הַגִּישָׁה
  choice: यहाँ ले आओ
  rationale: हिफ़ील आज्ञार्थक का अर्थ पास लाना या प्रस्तुत करना है; प्रसंग में यह वाक्यांश सहज और स्पष्ट है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: इब्रानी पाठ ठीक ‘परमेश्वर का संदूक’ कहता है; ‘वाचा का संदूक’ जोड़ना इस पद के शब्दों से आगे जाना होगा।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कथावाचक की व्याख्यात्मक उपवाक्य-भूमिका को स्पष्ट रूप से व्यक्त करता है।
- source_word: הָיָה ... וּבְנֵי יִשְׂרָאֵל
  choice: इस्राएलियों के साथ था
  rationale: स्थिति/उपस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है और בְּ की ‘साथ’ वाली शक्ति बनाए रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: काल-सूचक इब्रानी पदबंध का सीधा और प्रचलित हिन्दी रूप है।
- source_word: בְנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक ‘इस्राएल के पुत्र’ के बजाय आधुनिक हिन्दी का स्वाभाविक सामुदायिक नाम चुना गया है, जिसका आशय समस्त इस्राएली समुदाय है।
theological_decisions:
- issue: ‘परमेश्वर का संदूक’ बनाम पाठ-परंपरा में प्रस्तावित ‘एपोद’
  choice: परमेश्वर का संदूक
  alternative: एपोद
  rationale: प्रदत्त WLC इब्रानी पाठ में दोनों बार אֲרוֹן הָאֱלֹהִים है। इसलिए मुख्य पाठ उसी का अनुवाद करता है और वैकल्पिक पाठ को पादटिप्पणी में सुरक्षित रखता है।
- issue: अंतिम उपवाक्य में संदूक की उपस्थिति का अर्थ
  choice: उस दिन ... इस्राएलियों के साथ था
  alternative: उस दिन वहाँ इस्राएलियों के साथ था
  rationale: मूल पाठ में पृथक ‘वहाँ’ नहीं है; ‘इस्राएलियों के साथ’ स्थान/संगति का पर्याप्त संकेत देता है। वैकल्पिक समझ पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘संदूक’ बाइबिलीय वस्तु के लिए परिचित पद है; ‘इस्राएली’ शाब्दिक ‘इस्राएल के पुत्र’ की तुलना में आज की हिन्दी में अधिक स्वाभाविक और समावेशी सामुदायिक अभिव्यक्ति है।
