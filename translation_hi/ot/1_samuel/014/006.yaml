base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/006.yaml
  text: Then Jonathan said to the young man who carried his armor[a], “Come, let us cross over to the garrison of these uncircumcised men. Perhaps Yahweh will act for us[c][b], for nothing can hinder Yahweh from saving by many or by few.”
translation:
  language: hi
  text: तब योनातान ने उस जवान से, जो उसके हथियार उठाता था, कहा, “आओ, हम पार जाकर इन खतनारहित लोगों[b] की चौकी[a] की ओर चलें। क्या जाने, याहवे हमारे लिए कुछ करे, क्योंकि याहवे को बहुतों या थोड़े लोगों के द्वारा बचाने से कोई नहीं रोक सकता।”[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सैन्य ठिकाने।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “इन खतनारहितों”; यह वाचा से जुड़ी तिरस्कारपूर्ण अभिव्यक्ति है।
    reason: cultural_note
  - marker: c
    text: शाब्दिक रूप से “क्योंकि याहवे के लिए बचाने में कोई रोक नहीं—चाहे बहुतों के द्वारा हो या थोड़े लोगों के द्वारा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: अपने हथियार ढोनेवाले जवान
  rationale: इब्रानी पदबंध का शाब्दिक अर्थ उसके साज-सामान या हथियार उठानेवाला है। यह अनुवाद सैन्य भूमिका को स्पष्ट रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְכָה וְנַעְבְּרָה
  choice: आओ, हम ... के पास चलें
  rationale: आज्ञार्थक और इच्छार्थक क्रियाओं का मेल आमंत्रण तथा दृढ़ निश्चय व्यक्त करता है। स्थल की ओर बढ़ने का भाव हिन्दी में स्वाभाविक रूप से रखा गया है।
- source_word: מַצַּב
  choice: चौकी
  rationale: इस सैन्य प्रसंग में यह पलिश्ती सैन्य ठिकाने या अग्रिम चौकी को सूचित करता है। 'चौकी' सामान्य हिन्दी में संक्षिप्त और स्पष्ट है।
- source_word: הָעֲרֵלִים
  choice: उन खतनारहित लोगों
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रयुक्त है और वाचा से जुड़ा तिरस्कारपूर्ण भाव रखता है। जातीय नाम जोड़ने के बजाय मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: אוּלַי
  choice: क्या जाने
  rationale: योनातान आशा व्यक्त करता है, निश्चित दावा नहीं। 'क्या जाने' आधुनिक हिन्दी में स्वाभाविक ढंग से यही अनिश्चितता बनाए रखता है।
- source_word: יַעֲשֶׂה יְהוָה לָנוּ
  choice: याहवे हमारे लिए कुछ करे
  rationale: मूल क्रिया 'करना' व्यापक है और किसी निर्णायक हस्तक्षेप की ओर संकेत करती है। अनुवाद उसकी अनिर्दिष्टता को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: מַעְצוֹר
  choice: कोई नहीं रोक सकता
  rationale: संज्ञा का अर्थ रोक, बाधा या प्रतिबंध है। हिन्दी में क्रियात्मक रूप मूल कथन का अर्थ स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְהוֹשִׁיעַ
  choice: बचाने
  rationale: यह क्रिया इस प्रसंग में सैन्य छुटकारे का बोध देती है, पर इसका व्यापक बाइबलीय अर्थ भी है; 'बचाना' दोनों को समेटता है।
- source_word: בְּרַב אוֹ בִמְעָט
  choice: बहुत लोगों के द्वारा या थोड़े लोगों के द्वारा
  rationale: यह वाक्यांश संख्या और साधन के विपरीत पक्षों को सामने रखता है। 'के द्वारा' याहवे द्वारा उपयोग किए जानेवाले मानवीय साधनों का भाव बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। 'याहवे' उसे उपाधि में बदले बिना हिन्दी लिपि में प्रस्तुत करता है।
- issue: योनातान की आशा और अनिश्चितता
  choice: क्या जाने, याहवे हमारे लिए कुछ करे
  alternative: शायद याहवे हमारे लिए कार्य करेगा
  rationale: אוּלַי संभावना प्रकट करता है, भविष्य की निश्चित प्रतिज्ञा नहीं। साथ ही יַעֲשֶׂה की व्यापकता को किसी विशेष चमत्कार या विजय के रूप में सीमित नहीं किया गया।
- issue: याहवे की बचाने की सामर्थ्य
  choice: याहवे को ... बचाने से कोई नहीं रोक सकता
  alternative: याहवे के लिए बचाने में कोई बाधा नहीं है
  rationale: दोनों रूप मूल के 'कोई रोक/बाधा नहीं' वाले कथन को व्यक्त करते हैं। चुना गया रूप आधुनिक हिन्दी में स्पष्ट है और यह तनाव बनाए रखता है कि बचाव बहुतों अथवा थोड़े लोगों, दोनों के द्वारा हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल कथात्मक रजिस्टर रखा गया है। सैन्य शब्दावली सामान्य पाठक के लिए सुबोध है; वाचा-संबंधी तीखे मूल पद को नरम किए बिना संक्षिप्त टिप्पणी दी गई है।
