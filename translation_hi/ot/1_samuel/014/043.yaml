base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/043.yaml
  text: Then Saul said to Jonathan[a], “Tell me what you have done.” And Jonathan told him and said, “I indeed tasted a little honey on the tip of the staff that was in my hand, and here I am, about to die.”
translation:
  language: hi
  text: तब शाऊल ने योनातान से कहा, “मुझे बता, तूने क्या किया है?” योनातान ने उसे बताया और कहा, “मैंने अपने हाथ में पकड़ी हुई लाठी की नोक से थोड़ा-सा मधु तो चखा था, और देखो, मैं मरने वाला हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “मैंने अपने हाथ में पकड़ी हुई लाठी की नोक से थोड़ा-सा मधु तो चखा था—और अब क्या मुझे मरना होगा?” इब्रानी में ‘चखा’ क्रिया पर विशेष बल है, और अंतिम वाक्य विवश कथन या विरोध-भरे आलंकारिक प्रश्न—दोनों रूपों में सुना जा सकता है।'
    reason: इब्रानी infinitive absolute की बलात्मकता तथा הִנְנִי אָמוּת की कथन/आलंकारिक-प्रश्न संबंधी वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: मुझे बता
  rationale: नגד के आदेशात्मक रूप और प्रथम पुरुष संप्रदान को सीधी, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; एकवचन ‘तू’ राजा की अपने पुत्र से कठोर सीधी पूछताछ के अनुकूल है।
- source_word: מֶה עָשִׂיתָה
  choice: तूने क्या किया है
  rationale: पूर्ण हो चुके काम के वर्तमान परिणाम पर बल देने वाली स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: וַיַּגֶּד לוֹ
  choice: योनातान ने उसे बताया
  rationale: नגד की पुनरावृत्ति को ‘बता’/‘बताया’ से बनाए रखता है और कथात्मक हिन्दी में सहज है।
- source_word: טָעֹם טָעַמְתִּי
  choice: मैंने … चखा ही था
  rationale: क्रिया के infinitive absolute और finite verb के मेल से आने वाले पुष्टिकरण/बल को ‘ही’ व्यक्त करता है, बिना इसे केवल मात्रा-सीमित अर्थ में बदलने के।
- source_word: בִּקְצֵה הַמַּטֶּה אֲשֶׁר בְּיָדִי
  choice: अपने हाथ की लाठी की नोक से
  rationale: कצה को ‘नोक’ और מטה को इस प्रसंग में ‘लाठी’ कहना स्वाभाविक है; ‘से’ उस साधनगत भाव को स्पष्ट करता है जिसके द्वारा मधु चखा गया।
- source_word: מְעַט דְּבַשׁ
  choice: थोड़ा-सा मधु
  rationale: मात्रा को सरलता से व्यक्त करता है; ‘मधु’ गरिमापूर्ण और सामान्य बाइबलीय हिन्दी में बोधगम्य है।
- source_word: הִנְנִי אָמוּת
  choice: और अब देख, मैं मरने वाला हूँ
  rationale: הנני की तात्कालिक, संकेतात्मक शक्ति को ‘अब देख’ तथा imperfect की आसन्न मृत्यु वाली भावना को ‘मरने वाला हूँ’ से व्यक्त किया गया है।
theological_decisions:
- issue: योनातान के अंतिम कथन का भाव
  choice: 'आसन्न मृत्यु के प्रति कटु अथवा विवश कथन: ‘और अब देख, मैं मरने वाला हूँ।’'
  alternative: 'आलंकारिक विरोध-प्रश्न: ‘और अब क्या मुझे मरना होगा?’'
  rationale: व्यंजनरहित पाठ और प्रसंग दोनों कथन तथा विरोध-प्रश्न की संभावना देते हैं। मुख्य पाठ कथनात्मक संरचना को निकटता से रखता है, जबकि पादटिप्पणी वास्तविक अस्पष्टता को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; भाषा सीधी, गरिमापूर्ण और कथात्मक है। संवाद में शाऊल का कठोर पारिवारिक एकवचन ‘तू’ रखा गया है। ‘लाठी’ सामान्य पाठक के लिए ‘दण्ड’ की अपेक्षा अधिक स्वाभाविक है, जबकि ‘मधु’ बाइबलीय गरिमा बनाए रखता है।
