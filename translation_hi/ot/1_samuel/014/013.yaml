  yaml_path: translation/ot/1_samuel/014/013.yaml
  text: Then Jonathan climbed up on his hands and feet[a], with his armor-bearer behind him. They fell before Jonathan, and his armor-bearer killed them after him.
translation:
  language: hi
  text: तब योनातान अपने हाथों और पैरों के बल ऊपर चढ़ गया, और उसका हथियार उठानेवाला उसके पीछे था। वे योनातान के सामने गिर पड़े, और उसका हथियार उठानेवाला उसके पीछे-पीछे उन्हें मारता गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें मार रहा था।” इब्रानी कृदंत बार-बार होने वाली कार्रवाई की अपेक्षा जारी कार्रवाई पर बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर चढ़ गया
  rationale: क्रिया עלה का मूल अर्थ ऊपर जाना है; खड़ी चढ़ाई पर हाथ-पैर के सहारे बढ़ने के प्रसंग में ‘ऊपर चढ़ गया’ स्वाभाविक और सटीक है।
- source_word: עַל יָדָיו וְעַל רַגְלָיו
  choice: अपने हाथों और पैरों के बल
  rationale: यह शरीर की मुद्रा का सजीव वर्णन बनाए रखता है और ‘चारों हाथ-पैरों पर’ जैसे अधिक व्याख्यात्मक मुहावरे से बचता है।
- source_word: נֹשֵׂא כֵלָיו
  choice: उसका हथियार ढोनेवाला
  rationale: शाब्दिक भूमिका—योद्धा के हथियार या युद्ध-सामग्री उठानेवाला सेवक—को सामान्य आधुनिक हिन्दी में स्पष्ट करता है।
- source_word: אַחֲרָיו
  choice: उसके पीछे
  rationale: यहाँ स्थान और क्रम दोनों का भाव है; ‘उसके पीछे’ हिन्दी में सहज है और पद में इसकी पुनरावृत्ति भी सुरक्षित रखी गई है।
- source_word: וַיִּפְּלוּ לִפְנֵי יוֹנָתָן
  choice: वे योनातान के सामने गिरते गए
  rationale: נפל לפני युद्ध में किसी के सामने परास्त होकर गिरने का अर्थ दे सकता है। ‘गिरते गए’ घटनाक्रम की क्रमिकता व्यक्त करता है, बिना यह तय किए कि प्रत्येक व्यक्ति ठीक किस प्रकार गिरा।
- source_word: מְמוֹתֵת
  choice: उन्हें मारता गया
  rationale: पील कृदंत चलती या क्रमिक घातक कार्रवाई का संकेत देता है; ‘मारता गया’ इस पहलू को स्वाभाविक हिन्दी में व्यक्त करता है।
