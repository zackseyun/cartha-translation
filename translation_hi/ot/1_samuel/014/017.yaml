  text: וַ/יֹּ֣אמֶר שָׁא֗וּל לָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ פִּקְדוּ נָ֣א וּ/רְא֔וּ מִ֖י הָלַ֣ךְ מֵ/עִמָּ֑/נוּ וַֽ/יִּפְקְד֔וּ וְ/הִנֵּ֛ה אֵ֥ין יוֹנָתָ֖ן וְ/נֹשֵׂ֥א כֵלָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/017.yaml
  text: Then Saul said to the people who were with him[a], “Please take a count and see who has gone from among us.” So they took a count, and behold, Jonathan and his armor-bearer were not there.
translation:
  language: hi
  text: तब शाऊल ने अपने साथ के लोगों से कहा, “कृपया गिनती करके देखो कि हमारे बीच से कौन चला गया है।” उन्होंने गिनती की, और देखा कि योनातान और उसका हथियार ढोनेवाला वहाँ नहीं थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּקְדוּ נָא
  choice: कृपया गिनती करके
  rationale: इस प्रसंग में פקד उपस्थित लोगों की जाँच या गणना करने को दर्शाता है, और נָא आज्ञा को विनम्र अनुरोध बनाता है।
- source_word: וּרְאוּ
  choice: और ... देखो
  rationale: यह मूल क्रियाओं के क्रम को बनाए रखता है और यहाँ पता लगाने का स्वाभाविक भाव देता है।
- source_word: מִי הָלַךְ מֵעִמָּנוּ
  choice: हमारे बीच से कौन चला गया है
  rationale: यह समूह में से किसी के चले जाने के सामुदायिक भाव को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּפְקְדוּ
  choice: उन्होंने गिनती की
  rationale: पहले प्रयुक्त פקד के अनुरूप समान अर्थ रखा गया है।
- source_word: וְהִנֵּה
  choice: और देखा कि
  rationale: हिन्दी कथा-शैली में यह उल्लेखनीय खोज का भाव स्वाभाविक ढंग से व्यक्त करता है, बिना कृत्रिम 'देखो' या 'निहारो' के।
- source_word: נֹשֵׂא כֵלָיו
  choice: उसका हथियार ढोनेवाला
  rationale: यह पद के शाब्दिक अर्थ को सहज आधुनिक हिन्दी में रखता है; 'शस्त्रवाहक' की तुलना में सामान्य पाठक के लिए अधिक स्पष्ट है।
- source_word: אֵין יוֹנָתָן וְנֹשֵׂא כֵלָיו
  choice: योनातान और उसका हथियार ढोनेवाला वहाँ नहीं थे
  rationale: यह इब्रानी में व्यक्त अनुपस्थिति को स्वाभाविक हिन्दी में स्पष्ट करता है।
