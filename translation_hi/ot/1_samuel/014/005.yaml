- source_word: הַשֵּׁן
  choice: चट्टानी शिखर
  rationale: इसका शाब्दिक अर्थ ‘दाँत’ है, पर यहाँ यह दाँत जैसी नुकीली चट्टानी उभार या चोटी के लिए प्रयुक्त रूपक है। ‘चट्टानी शिखर’ स्थलाकृति और रूपक के आशय को सहज हिन्दी में व्यक्त करता है।
- source_word: הָאֶחָד ... וְהָאֶחָד
  choice: एक ... और दूसरा
  rationale: दो चट्टानी शिखरों को अलग-अलग बताने वाली वितरक संरचना का यह स्वाभाविक हिन्दी रूप है।
- source_word: מָצוּק
  choice: था
  rationale: इस स्थल-वर्णन में शब्द चट्टानी संरचना की स्थिर, उभरी या खड़ी स्थिति का संकेत देता है; हिन्दी में ‘था’ के साथ ‘चट्टानी शिखर’ उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִצָּפוֹן
  choice: उत्तर की ओर
  rationale: यह दर्रे के सापेक्ष उत्तरी दिशा या ओर को बताता है।
- source_word: מוּל
  choice: के सामने
  rationale: यह आमने-सामने या सम्मुख स्थित होने का स्थानिक संबंध व्यक्त करता है।
- source_word: מִכְמָשׂ
  choice: मिकमाश
  rationale: इब्रानी स्थान-नाम का हिन्दी लिप्यंतरण।
- source_word: מִנֶּגֶב
  choice: दक्षिण की ओर
  rationale: उत्तर के समानांतर विरोध में यह दक्षिणी दिशा या ओर को दर्शाता है।
- source_word: גָּבַע
  choice: गेबा
  rationale: इब्रानी रूप और भौगोलिक संदर्भ ‘गेबा’ स्थान-नाम का समर्थन करते हैं, ‘गिबा’ का नहीं।
