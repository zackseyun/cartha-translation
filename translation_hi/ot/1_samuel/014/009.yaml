- source_word: וְלֹא נַעֲלֶה אֲלֵיהֶם
  choice: और उनके पास ऊपर नहीं जाएँगे
  rationale: עלה ऊँची जगह पर स्थित पलिश्तियों की ओर चढ़ने का स्थलाकृतिक भाव रखता है; ‘ऊपर नहीं जाएँगे’ इस भाव को आक्रमण के अर्थ तक सीमित किए बिना बचाए रखता है।
