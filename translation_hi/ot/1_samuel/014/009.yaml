  text: If they say to us like this[b][a], ‘Stay there until we come to you,’ then we will stand where we are and will not go up to them.
translation:
  language: hi
  text: यदि वे हमसे इस तरह कहें, ‘जब तक हम तुम्हारे पास न आएँ, वहीं ठहरे रहो[a],’ तो हम अपनी जगह पर ही खड़े रहेंगे[b] और उनके पास ऊपर नहीं जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
