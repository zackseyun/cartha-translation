    text: या “शान्त खड़े रहो” अथवा “प्रतीक्षा करो”; इब्रानी आज्ञा अपने स्थान पर स्थिर या चुप रहने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हम अपने नीचे खड़े रहेंगे”; यह अपने ही स्थान पर बने रहने का इब्रानी मुहावरा है।
    reason: lexical_alternative
