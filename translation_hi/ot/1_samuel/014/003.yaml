source:
  edition: WLC
  text: וַ/אֲחִיָּ֣ה בֶן אֲחִט֡וּב אֲחִ֡י אִיכָב֣וֹד בֶּן פִּינְחָ֨ס בֶּן עֵלִ֜י כֹּהֵ֧ן יְהוָ֛ה בְּ/שִׁל֖וֹ נֹשֵׂ֣א אֵפ֑וֹד וְ/הָ/עָם֙ לֹ֣א יָדַ֔ע כִּ֥י הָלַ֖ךְ יוֹנָתָֽן־׀־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/003.yaml
  text: Ahijah son of Ahitub[a], brother of Ichabod, son of Phinehas, son of Eli, priest of Yahweh at Shiloh, was carrying an ephod. And the people did not know that Jonathan had gone.
translation:
  language: hi
  text: अहीयाह, अहीतूब का पुत्र—अहीतूब ईकाबोद का भाई, पीनहास का पुत्र और एली का पुत्र था—शीलो में यहोवा का याजक था और एपोद लिए हुए था।[a] लोगों को पता नहीं था कि योनातान चला गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एपोद पहने हुए था।” इब्रानी में शाब्दिक रूप से “एपोद उठाए/लिए हुए” है।
    reason: नֹשֵׂא का अर्थ उठाना, ले जाना, या धारण करना हो सकता है; याजकीय संदर्भ में ‘पहनना’ भी संभव है।
lexical_decisions:
- source_word: וַ/אֲחִיָּה
  choice: अहीयाह
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण; आरंभिक वाव कथा को आगे बढ़ाता है, इसलिए अलग से ‘अब’ जोड़ना आवश्यक नहीं।
- source_word: בֶן אֲחִטוּב אֲחִי אִיכָבוֹד בֶּן פִּינְחָס בֶּן עֵלִי
  choice: जो अहीतूब का पुत्र, ईकाबोद का भाई, पीनहास का पुत्र और एली का पोता था
  rationale: वंशावली-संबंधों को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है। अंतिम ‘एली का पोता’ स्रोत की क्रमिक पुत्रता—पीनहास, एली का पुत्र—का अर्थ स्पष्ट करता है।
- source_word: כֹּהֵן יְהוָה בְּ/שִׁלוֹ
  choice: शीलो में यहोवा का याजक
  rationale: כֹּהֵן के लिए ‘याजक’, स्थानवाचक ב के लिए ‘में’, और परमेश्वर के व्यक्तिगत नाम के लिए ‘यहोवा’ लिया गया है।
- source_word: נֹשֵׂא אֵפוֹד
  choice: एपोद उठाए हुए था
  rationale: נשא का मूल अर्थ उठाना/ढोना/धारण करना है। यह अनुवाद जानबूझकर यह तय नहीं करता कि एपोद पहना गया था या हाथ में ले जाया जा रहा था।
- source_word: וְ/הָעָם לֹא יָדַע
  choice: लोगों को मालूम नहीं था
  rationale: समूहवाचक एकवचन के अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: כִּי הָלַךְ יוֹנָתָן
  choice: कि योनातान चला गया है
  rationale: כִּי ज्ञान की विषयवस्तु बताता है; पूर्ण क्रिया पूर्ववर्ती प्रस्थान को दर्शाती है। हिन्दी में ‘चला गया है’ उस परिणामी अवस्था को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है, इसलिए ‘प्रभु’ जैसे पदनाम से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला रूप है।
- issue: נֹשֵׂא אֵפוֹד में एपोद धारण करने की रीति
  choice: एपोद उठाए हुए था
  alternative: एपोद पहने हुए था
  rationale: मूल क्रिया ‘उठाना/ढोना/धारण करना’ कहती है और यह स्पष्ट नहीं करती कि एपोद पहना हुआ था या किसी अन्य रीति से साथ रखा गया था; मुख्य पाठ में इस अस्पष्टता को सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। लंबे वंशावली-वाक्य को डैश से सीमांकित किया गया है ताकि कर्ता और मुख्य क्रिया स्पष्ट रहें।
