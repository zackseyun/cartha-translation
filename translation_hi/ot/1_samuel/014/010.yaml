source:
  edition: WLC
  text: וְ/אִם כֹּ֨ה יֹאמְר֜וּ עֲל֤וּ עָלֵ֨י/נוּ֙ וְ/עָלִ֔ינוּ כִּֽי נְתָנָ֥/ם יְהוָ֖ה בְּ/יָדֵ֑/נוּ וְ/זֶה לָּ֖/נוּ הָ/אֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/010.yaml
  text: But if they say this[a], ‘Come up to us,’ then we will go up, for Yahweh has given them into our hand[b], and this will be the sign for us.
translation:
  language: hi
  text: लेकिन यदि वे ऐसा कहें[a], “हमारे पास ऊपर आओ,” तो हम ऊपर जाएँगे, क्योंकि याहवे ने उन्हें हमारे हाथ में दे दिया है[b]। यही हमारे लिए चिन्ह होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हम पर चढ़ आओ।” इब्रानी शब्द ऊँचे स्थान पर पलिश्तियों की ओर आने पर बल दे सकते हैं; प्रसंग में शत्रुतापूर्ण चुनौती निहित है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हमारे हाथ में”; यह किसी को हमारे वश या अधिकार में कर देने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: लेकिन यदि
  rationale: यह पिछले पद की पहली सम्भावना के विपरीत दूसरी शर्त प्रस्तुत करता है; ‘लेकिन यदि’ इस विरोध और सम्बन्ध दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֹּה יֹאמְרוּ
  choice: वे ऐसा कहें
  rationale: כֹּה प्रत्यक्ष कथन का परिचय देता है और अपूर्ण क्रिया शर्त के भीतर सम्भावित कथन को व्यक्त करती है; ‘ऐसा कहें’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עֲלוּ עָלֵינוּ
  choice: हमारे पास ऊपर आओ
  rationale: עלה ऊँचे स्थान की ओर चढ़ने को और עַל यहाँ वक्ताओं की स्थिति की ओर आने को सूचित कर सकता है। सैन्य सन्दर्भ में ‘हम पर चढ़ आओ’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְעָלִינוּ
  choice: तो हम ऊपर जाएँगे
  rationale: शर्त के परिणाम को व्यक्त करने वाला वाव यहाँ हिन्दी में ‘तो’ से स्पष्ट और स्वाभाविक बनता है।
- source_word: כִּי נְתָנָם
  choice: क्योंकि ... ने उन्हें ... कर दिया है
  rationale: כִּי कारण बताता है और पूर्ण क्रिया उस विजय को विश्वासपूर्वक निश्चित मानती है; वर्तमान पूर्ण भाव ‘कर दिया है’ से व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; प्रचलित हिन्दी बाइबिलीय रूप ‘यहोवा’ नाम को किसी उपाधि से प्रतिस्थापित किए बिना व्यक्त करता है।
- source_word: בְּיָדֵנוּ
  choice: हमारे हाथ में
  rationale: इब्रानी का एकवचन मुहावरा अधिकार या वश में किए जाने का बिम्ब रखता है; हिन्दी में भी ‘हाथ में कर देना’ समझ में आने वाला मुहावरा है।
- source_word: וְזֶה לָּנוּ הָאוֹת
  choice: यही हमारे लिए चिन्ह होगा
  rationale: भावी पुष्टि को स्वाभाविक हिन्दी में ‘होगा’ से व्यक्त किया गया है; ‘यही’ उस निश्चित घटना पर बल देता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: पाठ में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए व्यापक रूप से परिचित ‘यहोवा’ चुना गया है, जबकि इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: נְתָנָם के पूर्ण रूप का कालगत भाव
  choice: ने उन्हें हमारे हाथ में कर दिया है
  alternative: उन्हें हमारे हाथ में कर देगा
  rationale: योनातान संकेत मिलने पर होने वाली विजय को पहले से निश्चित दैवी कार्य की तरह कहता है। पूर्ण भाव को बनाए रखने से उसके विश्वास की तीव्रता और पाठ का धर्मवैचारिक तनाव सुरक्षित रहता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘ऊपर आओ/ऊपर जाएँगे’ से स्थलाकृतिक चढ़ाई का मूल बिम्ब बचाया गया है। ‘चिन्ह’ परिचित बाइबिलीय शब्द है और यहाँ पुष्टि देने वाले संकेत के अर्थ में सहज है।
