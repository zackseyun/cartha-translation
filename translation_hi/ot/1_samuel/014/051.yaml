  yaml_path: translation/ot/1_samuel/014/051.yaml
  text: Kish was the father of Saul[a], and Ner was the father of Abner, the son of Abiel.
translation:
  language: hi
  text: कीश शाऊल का पिता था, और नेर अब्नेर का पिता था, जो अबीएल का बेटा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक क्रम है: “कीश, शाऊल का पिता; और नेर, अब्नेर का पिता, अबीएल का बेटा।” अंतिम “अबीएल का बेटा” पदबंध निकटवर्ती अब्नेर से जुड़ सकता है; वंशावली-संदर्भ में इसे नेर से जुड़ा हुआ भी समझा गया है।'
    reason: व्याकरणिक अस्पष्टता
lexical_decisions:
- source_word: וְ/קִישׁ
  choice: कीश
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण; आरंभिक וְ को हिन्दी वाक्य-प्रवाह में अलग से व्यक्त करना आवश्यक नहीं।
- source_word: אֲבִי שָׁאוּל
  choice: शाऊल का पिता था
  rationale: इब्रानी में क्रियारहित वंशावली-वाक्यांश है; स्वाभाविक हिन्दी पूर्ण वाक्य के लिए ‘था’ जोड़ा गया है।
- source_word: וְ/נֵר
  choice: और नेर
  rationale: संयोजक וְ को ‘और’ तथा नाम को प्रचलित हिन्दी रूप ‘नेर’ में दिया गया है।
- source_word: אֲבִי אַבְנֵר
  choice: अब्नेर का पिता था
  rationale: पहले खंड के समान क्रियारहित संबंध को स्पष्ट, समानांतर हिन्दी विधान में व्यक्त किया गया है।
- source_word: בֶּן אֲבִיאֵל
  choice: वे अबीएल के बेटे थे
  rationale: एकवचन בֶּן के बावजूद पद की वाक्यरचना और 1 इतिहास 9:39 के समानांतर वंशवृत्त के प्रकाश में इसे कीश और नेर—दोनों के अबीएल के पुत्र होने के कथन के रूप में व्यक्त किया गया है; सर्वनाम अस्पष्टता घटाता है।
theological_decisions:
- issue: בֶּן אֲבִיאֵל का संबंध किससे है
  choice: इसे कीश और नेर दोनों से संबंधित मानकर ‘वे अबीएल के बेटे थे’
  alternative: इसे निकटतम नाम अब्नेर से जोड़कर ‘अब्नेर, अबीएल का बेटा’
  rationale: मसोरेटिक पाठ का एकवचन रूप सतही तौर पर अब्नेर से जुड़ सकता है, पर वंशावली-संरचना तथा 1 इतिहास 9:39 का समानांतर पाठ कीश और नेर को अबीएल के पुत्र बताता है। वास्तविक पाठगत/व्याकरणिक तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिन्दी। नामों के प्रचलित बाइबलीय रूप रखे गए हैं। मुख्य पाठ वंशावली-संबंध को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि पादटिप्पणी इब्रानी की वास्तविक अस्पष्टता को सुरक्षित रखती है।
