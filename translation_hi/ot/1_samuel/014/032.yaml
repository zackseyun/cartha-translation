  text: Then the people rushed upon the spoil and took sheep and cattle and calves[a], and they slaughtered them on the ground[b], and the people ate with the blood.
translation:
  language: hi
  text: तब लोग लूट के माल पर टूट पड़े[a]। उन्होंने भेड़ें, गाय-बैल और बछड़े लिए, और उन्हें ज़मीन पर काट डाला। फिर लोगों ने मांस को खून समेत खाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी अभिव्यक्ति का अर्थ ‘लूट का माल लेने के लिए झपट पड़े’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, उन्होंने पशुओं का खून ठीक से बहाए बिना उनका मांस खाया।
    reason: interpretive_clarification
lexical_decisions:
- source_word: וַיַּעַשׂ ... אֶל שָׁלָל
  choice: लूट के माल पर टूट पड़े
  rationale: संदर्भ में यह असामान्य इब्रानी प्रयोग युद्ध की लूट की ओर लोगों के अचानक और अनियंत्रित ढंग से बढ़ने को व्यक्त करता है। ‘टूट पड़े’ आधुनिक हिन्दी में इस तीव्रता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שָׁלָל
  choice: लूट का माल
  rationale: यह युद्ध में प्राप्त पशुओं और अन्य वस्तुओं के लिए सहज तथा स्पष्ट आधुनिक हिन्दी सैन्य पद है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: यह इब्रानी शब्द छोटे पालतू पशुओं के झुंड, विशेषकर भेड़ और बकरियों, को समेट सकता है; हिन्दी में संयुक्त पद अर्थ की व्यापकता बनाए रखता है।
- source_word: בָּקָר
  choice: गाय-बैल
  rationale: यह बड़े गोवंशीय पशुओं का व्यापक वर्ग है। ‘गाय-बैल’ हिन्दी में लिंग-समावेशी और सामान्य पाठक के लिए स्पष्ट है।
- source_word: בְּנֵי בָקָר
  choice: बछड़े
  rationale: शाब्दिक अर्थ ‘गोवंश के बच्चे’ है; ‘बछड़े’ इसका स्वाभाविक हिन्दी रूप है।
- source_word: וַיִּשְׁחֲטוּ אָרְצָה
  choice: उन्हें वहीं भूमि पर काट डाला
  rationale: आदेशगत प्रत्यय भूमि की ओर या भूमि पर वध किए जाने का संकेत देता है। ‘वहीं भूमि पर’ घटना की असावधान तात्कालिकता व्यक्त करता है, जबकि रक्त न निकालने का निष्कर्ष मुख्य पाठ में नहीं जोड़ा गया।
- source_word: עַל־הַדָּם
  choice: खून समेत
  rationale: इब्रानी पद संक्षिप्त है और मांस को उसके रक्त के साथ खाने का बोध देता है। ‘खून समेत’ निकट, स्पष्ट और स्वाभाविक हिन्दी है; विधिसंबंधी आशय पादटिप्पणी में समझाया गया है।
theological_decisions:
- issue: עַל־הַדָּם में रक्त-संबंधी अपराध को कितना स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘खून समेत’
  alternative: ‘जिसमें से खून ठीक से निकाला नहीं गया था’
  rationale: इब्रानी मूल की संक्षिप्तता और धार्मिक तनाव को बनाए रखने के लिए मुख्य पाठ में व्याख्या नहीं मिलाई गई। पादटिप्पणी संभावित आशय स्पष्ट करती है कि वध के बाद रक्त ठीक से बहाए बिना मांस खाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रजिस्टर अपनाया गया है। ‘लूट के माल पर टूट पड़े’ लोगों की भूख और उतावलेपन को व्यक्त करता है; ‘खून समेत’ मूल की संक्षिप्तता को सुरक्षित रखता है।
