base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/024.yaml
  text: The men of Israel were hard-pressed that day[a], and Saul put the people under an oath, saying, “Cursed is the man who eats food before evening, before I have avenged myself on my enemies.” So none of the people tasted food.
translation:
  language: hi
  text: उस दिन इस्राएल के लोग बहुत दबाव में थे। शाऊल ने लोगों को शपथ दिलाई और कहा, “जो व्यक्ति शाम से पहले—मेरे शत्रुओं से अपना बदला ले चुकने से पहले—भोजन[a] करे, वह शापित हो।” इसलिए लोगों में से किसी ने भोजन नहीं चखा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में दोनों स्थानों पर शाब्दिक अर्थ “रोटी” है; यहाँ उससे सामान्यतः भोजन अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִגַּשׂ
  choice: बहुत दबाव में थे
  rationale: निफ़अल रूप को इस युद्ध-संदर्भ में स्थानिक ‘निकट आए’ के बजाय संकट या दबाव में होने के अर्थ में लिया गया है। एकवचन रूप सामूहिक ‘इस्राएल के लोग’ के साथ प्रयुक्त है।
- source_word: וַיֹּאֶל ... אֶת־הָעָם
  choice: लोगों को शपथ से बाँधते हुए
  rationale: आगे आने वाली शाप-घोषणा दिखाती है कि शाऊल ने लोगों पर बाध्यकारी शपथ लगाई। यह प्रयोग उसकी इच्छा या आरंभ मात्र बताने के बजाय उस बाध्यता को स्पष्ट करता है।
- source_word: הָעָם
  choice: लोगों
  rationale: मूल का सामान्य शब्द सुरक्षित रखा गया है; प्रसंग में ये युद्ध में सम्मिलित इस्राएली लोग हैं।
- source_word: אָרוּר הָאִישׁ
  choice: जो व्यक्ति ... वह शापित हो
  rationale: हिन्दी में स्वाभाविक शाप-घोषणा के रूप में अनूदित है। הָאִישׁ का एकवचन यहाँ सामान्य रूप से किसी भी व्यक्ति पर लागू होता है।
- source_word: יֹאכַל לֶחֶם
  choice: भोजन करे
  rationale: לֶחֶם का मूल अर्थ ‘रोटी’ है, पर यहाँ वह सामान्यतः खाने या भोजन के लिए प्रयुक्त है।
- source_word: עַד הָעֶרֶב
  choice: शाम से पहले
  rationale: शपथ में खाने की मनाही की समय-सीमा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִקַּמְתִּי מֵאֹיְבַי
  choice: मेरे शत्रुओं से अपना बदला ले चुकने से पहले
  rationale: शाऊल के प्रथम-पुरुष और निजी प्रतिशोध के स्वर को बनाए रखते हुए खाने से पहले पूरे किए जाने वाले लक्ष्य को स्पष्ट करता है।
- source_word: וְלֹא טָעַם כָּל־הָעָם לָחֶם
  choice: लोगों में से किसी ने भोजन नहीं चखा
  rationale: नकारात्मक सामूहिक कथन को स्वाभाविक हिन्दी में रखा गया है और मूल की सजीव क्रिया ‘चखा’ को सुरक्षित रखा गया है।
theological_decisions:
- issue: शाऊल की शपथ और प्रतिशोध के कथन का नैतिक मूल्यांकन
  choice: वचन केवल शाऊल की बाध्यकारी शपथ और ‘अपना बदला’ लेने की उसकी भाषा को प्रस्तुत करता है
  alternative: अनुवाद में शपथ को स्पष्टतः मूर्खतापूर्ण या प्रतिशोध को दैवी न्याय कहना
  rationale: मूल पद यहाँ प्रत्यक्ष नैतिक टिप्पणी नहीं जोड़ता; कथानक के तनाव को बिना व्याख्यात्मक निर्णय थोपे सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘शपथ से बाँधते हुए’ बाध्यता को व्यक्त करता है, जबकि उद्धरण में डैश शाऊल के प्रतिशोध वाले उद्देश्य को स्पष्ट और पठनीय ढंग से जोड़ता है।
