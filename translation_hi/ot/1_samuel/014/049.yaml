base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/049.yaml
  text: 'Saul’s sons were Jonathan[a], Ishvi, and Malchi-shua; and the names of his two daughters were these: the name of the firstborn was Merab[b], and the name of the younger was Michal.'
translation:
  language: hi
  text: 'शाऊल के बेटे योनातान, यिश्वी और मल्की-शूअ थे। उसकी दोनों बेटियों के नाम[a] ये थे: बड़ी बेटी का नाम मेरब था और छोटी बेटी का नाम मीकल था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उसकी दोनों बेटियों का नाम’ है।
    reason: lexical_alternative
