  text: וַ/יֹּ֣אמֶר שָׁא֣וּל פֻּ֣צוּ בָ/עָ֡ם וַ/אֲמַרְתֶּ֣ם לָ/הֶ֡ם הַגִּ֣ישׁוּ אֵלַ/י֩ אִ֨ישׁ שׁוֹר֜/וֹ וְ/אִ֣ישׁ שְׂיֵ֗/הוּ וּ/שְׁחַטְתֶּ֤ם בָּ/זֶה֙ וַ/אֲכַלְתֶּ֔ם וְ/לֹֽא תֶחֶטְא֥וּ לַֽ/יהוָ֖ה לֶ/אֱכֹ֣ל אֶל הַ/דָּ֑ם וַ/יַּגִּ֨שׁוּ כָל הָ/עָ֜ם אִ֣ישׁ שׁוֹר֧/וֹ בְ/יָד֛/וֹ הַ/לַּ֖יְלָה וַ/יִּשְׁחֲטוּ שָֽׁם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/034.yaml
  text: And Saul said[a], “Spread out among the people and tell them, ‘Each man must bring me his ox and each man his sheep, and you must slaughter them here and eat, so that you may not sin against Yahweh by eating with the blood.’” So all the people brought, each man his ox in his hand that night[b], and they slaughtered them there.
translation:
  language: hi
  text: तब शाऊल ने कहा, “लोगों के बीच फैल जाओ और उनसे कहो, ‘हर व्यक्ति अपना बैल और अपनी भेड़ मेरे पास ले आए। तुम उन्हें यहीं बलि करना और खाना, ताकि लहू समेत खाकर[a] यहोवा के विरुद्ध पाप न करो।’” तब सब लोग उसी रात अपने-अपने बैल हाथ से पकड़कर[b] ले आए और उन्होंने उन्हें वहीं बलि किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “लहू के साथ/ऊपर खाकर”; आशय ऐसा मांस खाने से है जिसका लहू ठीक से नहीं निकाला गया था।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने-अपने बैल को हाथ से हाँकते हुए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֻּצוּ בָעָם
  choice: लोगों के बीच फैल जाओ
  rationale: פוץ का बहुवचन आदेश लोगों के बीच अलग-अलग दिशाओं में जाने को कहता है; यह हिंदी में स्वाभाविक रहते हुए मूल की ठोस छवि बचाता है।
- source_word: הַגִּישׁוּ אֵלַי
  choice: मेरे पास ले आए
  rationale: हिफ़ील रूप का अर्थ पास लाना या प्रस्तुत करना है; प्रसंग में ‘मेरे पास ले आए’ सहज है।
- source_word: אִישׁ שׁוֹרוֹ וְאִישׁ שְׂיֵהוּ
  choice: हर व्यक्ति अपना बैल और अपनी भेड़
  rationale: दोहराया गया אִישׁ वितरणात्मक अर्थ देता है। שֶׂה भेड़ या बकरी जैसे छोटे पशु को सूचित कर सकता है; मुख्य पाठ में प्रचलित ‘भेड़’ रखा गया है।
- source_word: וּשְׁחַטְתֶּם בָּזֶה
  choice: उन्हें यहीं बलि करना
  rationale: שׁחט भोजन के लिए विधिपूर्वक पशु काटने का विशिष्ट शब्द है और בָּזֶה स्थानसूचक है। हिंदी में ‘बलि करना’ इस प्रसंग में सामान्य ‘मारना’ से अधिक उपयुक्त है।
- source_word: וְלֹא תֶחֶטְאוּ לַיהוָה
  choice: ताकि ... यहोवा के विरुद्ध पाप न करो
  rationale: आज्ञा का निवारक उद्देश्य व्यक्त होता है और לַיהוָה का नैतिक दिशार्थ ‘यहोवा के विरुद्ध’ से स्पष्ट होता है।
- source_word: לֶאֱכֹל אֶל־הַדָּם
  choice: लहू समेत खाकर
  rationale: अभिव्यक्ति शाब्दिक रूप से लहू के साथ/ऊपर खाने की है; प्रसंग में ऐसे मांस को खाना अभिप्रेत है जिसका लहू ठीक से नहीं निकला था। संक्षिप्त अर्थ मुख्य पाठ में और विवरण पादटिप्पणी में दिया गया है।
- source_word: אִישׁ שׁוֹרוֹ בְיָדוֹ
  choice: अपने-अपने बैल हाथ से पकड़कर
  rationale: शाब्दिक ‘उसका बैल उसके हाथ में’ हिंदी में अस्वाभाविक होगा; ‘हाथ से पकड़कर’ पशु को स्वयं साथ लाने या हाँककर लाने की संभावित छवि सुरक्षित रखता है।
- source_word: הַלַּיְלָה
  choice: उसी रात
  rationale: कालवाचक प्रयोग को स्वाभाविक हिंदी कथा-शैली में व्यक्त करता है।
- source_word: וַיִּשְׁחֲטוּ שָׁם
  choice: उन्होंने उन्हें वहीं बलि किया
  rationale: पशुओं का कर्म प्रसंग से स्पष्ट है और हिंदी में स्वाभाविकता के लिए व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का विशिष्ट नाम है। आधुनिक हिंदी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और इसे उपाधि ‘प्रभु’ से बदलने के बजाय नाम के रूप में रखा गया है।
- issue: שׁחט का धार्मिक या सामान्य अर्थ
  choice: बलि करना
  alternative: वध करना / काटना
  rationale: यहाँ पशु खाने के लिए विधिपूर्वक काटे जाते हैं; पाठ स्पष्ट रूप से वेदी पर चढ़ाए गए बलिदान की बात नहीं कहता। ‘बलि करना’ हिंदी में इस विधिपूर्वक पशुवध को व्यक्त करता है, पर इसे प्रायश्चित्त-बलिदान के रूप में नहीं समझा जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथा-शैली। वितरणात्मक भाव के लिए ‘अपने-अपने’ और आदेश की स्पष्टता के लिए सहज हिंदी क्रियारूप प्रयुक्त किए गए हैं।
