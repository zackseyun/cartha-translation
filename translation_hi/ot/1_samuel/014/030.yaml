base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/030.yaml
  text: How much more if the people had eaten today from the spoil of their enemies that they found! For then the slaughter among the Philistines would have been much greater[a].
translation:
  language: hi
  text: यदि लोगों ने आज अपने शत्रुओं से पाई हुई लूट में से खाया होता, तो क्या पलिश्तियों पर कहीं अधिक भारी प्रहार न हुआ होता[a]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सचमुच, यदि लोगों ने आज अपने शत्रुओं से पाई हुई लूट में से खाया होता, तो पलिश्तियों पर प्रहार और भी बड़ा होता!”
    reason: आरंभिक אַף כִּי לוּא को ‘सचमुच, यदि’ और מַכָּה को ‘प्रहार’ के रूप में लेकर नकारयुक्त अलंकारिक प्रश्न को कथन के रूप में भी अनुवादित किया जा सकता है।
lexical_decisions:
- source_word: אַף כִּי לוּא
  choice: तो कितना अधिक अच्छा होता!
  rationale: यह पदबंध एक तीव्र प्रतिकल्पित संभावना व्यक्त करता है। हिंदी में यह वाक्यांश योनातान के इस तर्क को स्वाभाविक रूप से सामने लाता है कि भोजन करने पर परिणाम और बड़ा होता।
- source_word: אָכֹל אָכַל
  choice: भरपेट खाया होता
  rationale: क्रिया के साथ infinitive absolute खाने की क्रिया पर बल देता है। प्रसंग में सेना को सामान्य रूप से खाने से रोका गया था, इसलिए ‘भरपेट’ बल को सहज हिंदी में व्यक्त करता है, बिना ‘स्वतंत्र रूप से’ जैसा अतिरिक्त विचार जोड़े।
- source_word: מִשְּׁלַל אֹיְבָיו
  choice: अपने शत्रुओं से मिली लूट में से
  rationale: שָׁלָל युद्ध में प्राप्त लूट है। एकवचन रूप वाले सर्वनाम का संबंध सामूहिक संज्ञा ‘लोगों’ से है; हिंदी में ‘अपने शत्रुओं’ स्वाभाविक सामूहिक अर्थ देता है।
- source_word: אֲשֶׁר מָצָא
  choice: मिली
  rationale: इब्रानी में क्रिया एकवचन है क्योंकि ‘लोग’ सामूहिक संज्ञा है। हिंदी में संबंधवाचक उपवाक्य को ‘मिली लूट’ के रूप में संक्षिप्त करना अर्थ को स्वाभाविक और स्पष्ट रखता है।
- source_word: מַכָּה
  choice: संहार
  rationale: युद्ध-संदर्भ में מַכָּה मार, भारी क्षति या संहार को सूचित कर सकता है। यहाँ पलिश्तियों की जनहानि की मात्रा की बात होने के कारण ‘संहार’ उपयुक्त है।
- source_word: לֹא רָבְתָה
  choice: कहीं अधिक हुआ होता
  rationale: नकारयुक्त इब्रानी वाक्यांश को संदर्भ में प्रतिकल्पित, अलंकारिक कथन के रूप में लिया गया है। ‘कहीं अधिक हुआ होता’ अपेक्षित किंतु न हो सकने वाले परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: בַּפְּלִשְׁתִּים
  choice: पलिश्तियों का
  rationale: ב यहाँ आघात के लक्ष्य अथवा जिनके बीच हानि हुई उस समूह को दर्शाता है। ‘पलिश्तियों का संहार’ हिंदी में इस सैन्य अर्थ को सहज रूप से व्यक्त करता है।
