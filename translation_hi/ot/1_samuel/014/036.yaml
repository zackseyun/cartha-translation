  text: וַ/יֹּ֣אמֶר שָׁא֡וּל נֵרְדָ֣ה אַחֲרֵי֩ פְלִשְׁתִּ֨ים לַ֜יְלָה וְֽ/נָבֹ֥זָה בָ/הֶ֣ם עַד א֣וֹר הַ/בֹּ֗קֶר וְ/לֹֽא נַשְׁאֵ֤ר בָּ/הֶם֙ אִ֔ישׁ וַ/יֹּ֣אמְר֔וּ כָּל הַ/טּ֥וֹב בְּ/עֵינֶ֖י/ךָ עֲשֵׂ֑ה וַ/יֹּ֨אמֶר֙ הַ/כֹּהֵ֔ן נִקְרְבָ֥ה הֲלֹ֖ם אֶל הָ/אֱלֹהִֽים׀׀־־־ס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/036.yaml
  text: Then Saul said[a], “Let us go down after the Philistines by night and plunder them until the light of the morning, and let us not leave a man among them.” And they said, “Do whatever seems good in your eyes.” But the priest said, “Let us draw near here to God.”
translation:
  language: hi
  text: तब शाऊल ने कहा, “आओ, हम रात में पलिश्तियों के पीछे उतर चलें और भोर का उजाला होने तक उन्हें लूटें; हम उनमें से एक भी आदमी न छोड़ें।” उन्होंने कहा, “जो कुछ आपकी दृष्टि में अच्छा हो, वही कीजिए।” पर याजक ने कहा, “आओ, हम यहाँ परमेश्वर के निकट जाएँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका भाव यह भी हो सकता है, “आओ, हम यहाँ परमेश्वर से पूछें।” याजक के शब्द सम्भवतः आगे बढ़ने से पहले परमेश्वर का मार्गदर्शन लेने की ओर संकेत करते हैं।
    reason: मूल क्रिया का शाब्दिक अर्थ ‘निकट जाना’ है, जबकि प्रसंग में परमेश्वर से पूछने का आशय निहित हो सकता है।
lexical_decisions:
- source_word: נֵרְדָה
  choice: आओ, हम ... उतर चलें
  rationale: प्रथम पुरुष बहुवचन के आग्रहसूचक रूप को ‘आओ, हम’ से व्यक्त किया गया है और ירד की दिशात्मकता ‘उतर चलें’ में सुरक्षित है।
- source_word: אַחֲרֵי פְלִשְׁתִּים
  choice: पलिश्तियों के पीछे
  rationale: אַחֲרֵי का मूल अर्थ ‘पीछे’ है; सैनिक प्रसंग में इससे पीछा करने का भाव स्वाभाविक रूप से प्रकट होता है।
- source_word: לַיְלָה
  choice: रात में
  rationale: यह प्रस्तावित कार्रवाई का समय बताने वाला क्रियाविशेषण है; पाठ में स्पष्ट न होने के कारण ‘आज रात’ नहीं जोड़ा गया।
- source_word: וְנָבֹזָה בָהֶם
  choice: उन्हें लूटते रहें
  rationale: בזז का अर्थ लूटना है। ‘लूटते रहें’ भोर तक चलने वाली कार्रवाई को सहज हिन्दी में व्यक्त करता है, जबकि בָהֶם के लक्ष्य को ‘उन्हें’ से दर्शाता है।
- source_word: עַד אוֹר הַבֹּקֶר
  choice: भोर का उजाला होने तक
  rationale: मूल पाठ में सुबह के प्रकाश की छवि को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी प्रयोग चुना गया है।
- source_word: וְלֹא נַשְׁאֵר בָּהֶם אִישׁ
  choice: हम उनमें से एक भी पुरुष को न छोड़ें
  rationale: आग्रहसूचक क्रम को बनाए रखा गया है। אִישׁ के एकवचन पुल्लिंग और पूर्ण विनाश के आशय को ‘एक भी पुरुष’ व्यक्त करता है; मूल में स्पष्ट न होने के कारण ‘जीवित’ नहीं जोड़ा गया।
- source_word: כָּל הַטּוֹב בְּעֵינֶיךָ עֲשֵׂה
  choice: जो कुछ आपकी दृष्टि में अच्छा हो, वही कीजिए
  rationale: हिब्रू की ‘आँखों में अच्छा’ वाली छवि को हिन्दी के स्वाभाविक और आदरपूर्ण रूप ‘आपकी दृष्टि में अच्छा’ में सुरक्षित रखा गया है।
- source_word: נִקְרְבָה הֲלֹם אֶל הָאֱלֹהִים
  choice: आओ, हम यहाँ परमेश्वर के निकट जाएँ
  rationale: קרב के ‘निकट आने’ और הֲלֹם के ‘यहाँ’ दोनों तत्व सुरक्षित हैं। परमेश्वर से मार्गदर्शन माँगने का प्रसंगगत आशय सम्भव है, पर उसे मुख्य पाठ में स्पष्ट क्रिया के रूप में नहीं जोड़ा गया।
theological_decisions:
- issue: युद्ध से पहले परमेश्वर से परामर्श करने का निहितार्थ
  choice: याजक के शब्दों को ‘परमेश्वर के निकट जाएँ’ के रूप में रखा गया है।
  alternative: ‘हम यहाँ परमेश्वर से पूछें’ या ‘परमेश्वर से परामर्श करें।’
  rationale: हिब्रू में निकट आने की क्रिया है, पूछने या परामर्श करने की नहीं। प्रसंग में ईश्वरीय मार्गदर्शन माँगना सम्भवतः निहित है, पर मुख्य अनुवाद किसी विशिष्ट याजकीय प्रक्रिया को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। शाऊल के प्रस्ताव में सामूहिक आग्रह के लिए ‘आओ, हम’ तथा लोगों के उत्तर में राजा के प्रति आदर दिखाने के लिए ‘आपकी/कीजिए’ का प्रयोग किया गया है।
