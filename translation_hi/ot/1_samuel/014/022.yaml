base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/022.yaml
  text: And every man of Israel who had hidden themselves in the hill country of Ephraim heard that the Philistines had fled[a], and they too joined the pursuit in the battle.
translation:
  language: hi
  text: और इस्राएल के वे सब पुरुष, जो एप्रैम के पहाड़ी प्रदेश में छिपे हुए थे, उन्होंने सुना कि पलिश्ती भाग गए थे, और वे भी युद्ध में उनके पीछे लग गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכֹל אִישׁ יִשְׂרָאֵל
  choice: और इस्राएल के वे सब पुरुष
  rationale: כֹל אִישׁ का सामूहिक अर्थ संदर्भ में अनेक इस्राएली पुरुषों से है। हिंदी में ‘वे सब पुरुष’ आगे के बहुवचन कृदंत और क्रियाओं के साथ स्वाभाविक सामंजस्य रखता है और स्रोत के स्पष्ट पुरुषवाचक शब्द को बनाए रखता है।
- source_word: הַמִּתְחַבְּאִים
  choice: जो ... छिपे हुए थे
  rationale: कृदंत उन पुरुषों की जारी अवस्था बताता है जिन्होंने अपने को छिपा रखा था; ‘छिपे हुए थे’ इसे सहज कथात्मक हिंदी में व्यक्त करता है।
- source_word: בְּהַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: यहाँ הַר किसी एक पर्वत-शिखर के बजाय एप्रैम के ऊँचे पहाड़ी भूभाग का भौगोलिक नाम है।
- source_word: שָׁמְעוּ כִּי נָסוּ פְּלִשְׁתִּים
  choice: जब उन्होंने सुना कि पलिश्ती भाग गए हैं
  rationale: सुनने की घटना और प्राप्त समाचार का क्रम स्पष्ट रहता है; हिंदी की अप्रत्यक्ष कथन-शैली में ‘भाग गए हैं’ उस समय प्राप्त खबर को स्वाभाविक रूप से दर्शाता है।
- source_word: וַיַּדְבְּקוּ ... אַחֲרֵיהֶם
  choice: उनके पीछे लग गए
  rationale: דבק के मूल ‘चिपके रहना/लगे रहना’ और אחרי के साथ उसके सैन्य मुहावरे—पीछा करना—दोनों को हिंदी का स्वाभाविक मुहावरा ‘पीछे लग गए’ अच्छी तरह व्यक्त करता है।
- source_word: גַם הֵמָּה
  choice: वे भी
  rationale: यह उन पहले छिपे हुए इस्राएलियों के अब अन्य लोगों के साथ युद्ध में सम्मिलित होने पर बल देता है।
- source_word: בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: यह चल रही लड़ाई में उनकी भागीदारी का संकेत देता है; ‘युद्ध में’ संक्षिप्त, स्पष्ट और स्रोत-संगत है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी; सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘पीछे लग गए’ ने इब्रानी सैन्य मुहावरे को पर्याप्त निकटता और स्वाभाविकता से व्यक्त किया है, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
