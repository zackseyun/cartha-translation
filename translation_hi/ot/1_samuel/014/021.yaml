  text: וְ/הָ/עִבְרִ֗ים הָי֤וּ לַ/פְּלִשְׁתִּים֙ כְּ/אֶתְמ֣וֹל שִׁלְשׁ֔וֹם אֲשֶׁ֨ר עָל֥וּ עִמָּ֛/ם בַּֽ/מַּחֲנֶ֖ה סָבִ֑יב וְ/גַם הֵ֗מָּה לִֽ/הְיוֹת֙ עִם יִשְׂרָאֵ֔ל אֲשֶׁ֥ר עִם שָׁא֖וּל וְ/יוֹנָתָֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/021.yaml
  text: The Hebrews who had previously been with the Philistines[a], who had gone up with them into the camp all around—even they also came to be with Israel[c][b], who were with Saul and Jonathan.
translation:
  language: hi
  text: जो इब्री पहले पलिश्तियों के साथ थे[a] और उनके साथ चारों ओर की छावनी में चढ़ आए थे[b], वे भी उस इस्राएल के साथ हो गए जो शाऊल और योनातान के साथ था[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘कल और उससे पहले के दिन की तरह’; यह ‘पहले’ या ‘पूर्व समय में’ के अर्थ का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘चारों ओर की छावनी’ वाला इब्रानी वाक्यांश कठिन है। संभवतः इसका आशय आसपास के क्षेत्र में फैली पलिश्ती छावनी से है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘इस्राएल के साथ होने लगे।’ इससे उनके संबंध या पक्ष में बदलाव का संकेत मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָעִבְרִים
  choice: जो इब्री
  rationale: עִבְרִים को ‘इब्री’ रखा गया है, न कि सामान्यीकृत करके ‘इस्राएली’, क्योंकि पद स्वयं आगे ‘इस्राएल’ से उनका संबंध बताता है और यह नाम सामाजिक अथवा बाहरी दृष्टिकोण सूचित कर सकता है।
- source_word: הָיוּ לַפְּלִשְׁתִּים כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: पहले पलिश्तियों के साथ थे
  rationale: לַפְּלִשְׁתִּים यहाँ संबंध या पक्ष को व्यक्त करता है, स्वामित्व को नहीं। כְּאֶתְמוֹל שִׁלְשׁוֹם का शाब्दिक भाव ‘कल और परसों की तरह’ है, पर यह पूर्व समय के लिए मुहावरा है।
- source_word: אֲשֶׁר עָלוּ עִמָּם
  choice: उनके साथ ... आए थे
  rationale: עלה का मूल दिशात्मक भाव ऊपर जाने/आने का है; हिन्दी कथा में ‘आए थे’ स्वाभाविक है और पलिश्तियों के साथ उनके आने को स्पष्ट रखता है।
- source_word: בַּמַּחֲנֶה סָבִיב
  choice: चारों ओर फैली छावनी में
  rationale: वाक्यांश कठिन है। यह अनुवाद סָבִיב के स्थानिक भाव को रखता है और संभवतः आसपास फैली पलिश्ती छावनी को सूचित करता है, पर इस समझ को पादटिप्पणी में अनिश्चित बताया गया है।
- source_word: וְגַם הֵמָּה
  choice: वे भी
  rationale: संयुक्त पद का जोर हिन्दी के स्वाभाविक ‘वे भी’ से व्यक्त होता है; ‘यहाँ तक कि वे भी’ संभव है, पर अपेक्षाकृत भारी है।
- source_word: לִהְיוֹת עִם יִשְׂרָאֵל
  choice: इस्राएलियों के साथ हो गए
  rationale: शाब्दिक रूप ‘इस्राएल के साथ होना’ है। प्रसंग में स्थिति या पक्ष के बदलने का संकेत है; ‘साथ हो गए’ इसे व्यक्त करता है, जबकि ‘पक्ष में आ गए’ से अधिक व्याख्या नहीं जोड़ता।
- source_word: אֲשֶׁר עִם שָׁאוּל וְיוֹנָתָן
  choice: शाऊल और योनातान के साथ रहनेवाले इस्राएलियों
  rationale: संबंधवाचक उपवाक्य सामूहिक ‘इस्राएल’ को सीमित करता है—अर्थात वे इस्राएली जो शाऊल और योनातान के साथ थे। हिन्दी में वाक्य की अस्पष्टता घटाने के लिए इसे संज्ञा-समूह के भीतर रखा गया है।
theological_decisions:
- issue: लִהְיוֹת עִם יִשְׂרָאֵל में निष्ठा-परिवर्तन का संकेत
  choice: इस्राएलियों के साथ हो गए
  alternative: इस्राएलियों के पक्ष में आ गए / इस्राएलियों के साथ थे
  rationale: इब्रानी केवल ‘साथ होना’ कहता है, किंतु वाक्य-विन्यास पूर्व संगति से नई संगति की ओर बदलाव सूचित करता है। चुना हुआ रूप बदलाव बनाए रखता है, पर औपचारिक सैन्य या धार्मिक निष्ठा की धारणा नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘इब्री’ और ‘इस्राएली’ का भेद जानबूझकर रखा गया है। वाक्य को हिन्दी में स्वाभाविक बनाने हेतु संबंधवाचक उपवाक्यों का क्रम बदला गया, बिना आशय बदलने के।
