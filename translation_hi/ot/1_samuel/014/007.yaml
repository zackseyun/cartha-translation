  yaml_path: translation/ot/1_samuel/014/007.yaml
  text: His armor-bearer said to him, “Do all that is in your heart. Go on; here I am with you, according to your heart.”
translation:
  language: hi
  text: उसके हथियार ढोनेवाले ने उससे कहा, “जो कुछ तेरे मन में है, कर। आगे बढ़; देख, मैं तेरे साथ हूँ—जैसा तेरा मन चाहे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: उसके हथियार ढोनेवाले
  rationale: यह पद सैनिक सहायक को दर्शाता है जो योद्धा के हथियार उठाता था; यह सहज हिंदी में मूल भूमिका को स्पष्ट रखता है।
- source_word: עֲשֵׂה כָּל אֲשֶׁר בִּלְבָבֶךָ
  choice: जो कुछ तेरे मन में है, कर
  rationale: हिब्रू मुहावरे में לֵב इच्छा, विचार और संकल्प का केंद्र है; ‘मन’ हिंदी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: נְטֵה לָךְ
  choice: आगे बढ़
  rationale: संदर्भ में यह आगे जाने या अपने चुने मार्ग पर बढ़ने का प्रोत्साहन है; शाब्दिक ‘अपनी ओर मुड़’ हिंदी में अस्पष्ट और अस्वाभाविक होता।
- source_word: הִנְנִי עִמְּךָ
  choice: देख, मैं तेरे साथ हूँ
  rationale: הִנְנִי की तत्पर उपस्थिति पर ‘देख’ ध्यान दिलाता है और साथ देने की दृढ़ता बनाए रखता है।
- source_word: כִּלְבָבֶךָ
  choice: जैसा तेरा मन चाहे
  rationale: खंडित हिब्रू अभिव्यक्ति का आशय हथियार ढोनेवाले की योनातान के संकल्प से पूर्ण सहमति है; यह अनुवाद मूल के ‘हृदय/मन’ रूपक को बनाए रखते हुए सहज हिंदी देता है।
