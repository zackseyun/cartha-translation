base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/029.yaml
  text: Then Jonathan said[a], “My father has troubled the land. See, please, how my eyes have brightened because I tasted a little of this honey.”
translation:
  language: hi
  text: तब योनातान ने कहा, “मेरे पिता ने देश को संकट में डाल दिया है। ज़रा देखो, इस शहद में से थोड़ा-सा चखने के कारण मेरी आँखें कैसी चमक उठी हैं![a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरा “मेरी आँखें चमक उठी हैं” खाने के बाद लौटी हुई शक्ति या सजगता को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָכַר
  choice: संकट में डाल दिया है
  rationale: क्रिया का अर्थ परेशानी या विपत्ति में डालना है; यह स्वाभाविक हिन्दी में उसके कारक भाव को बनाए रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ शब्द उस भूभाग और उससे जुड़े लोगों की सामूहिक स्थिति की ओर संकेत कर सकता है; ‘देश’ आधुनिक हिन्दी में सहज और संदर्भानुकूल है।
- source_word: רְאוּ נָא
  choice: ज़रा देखो
  rationale: बहुवचन आज्ञार्थ के साथ נָא के विनम्र आग्रह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹרוּ עֵינַי
  choice: मेरी आँखें कैसी चमक उठी हैं
  rationale: मूल के नेत्र-संबंधी मुहावरे को बनाए रखते हुए भोजन से लौटी स्फूर्ति और सजगता व्यक्त होती है।
- source_word: טָעַמְתִּי
  choice: चखने
  rationale: यह क्रिया विशेष रूप से स्वाद लेने या चखने को दर्शाती है और खाई गई थोड़ी मात्रा पर दिए गए बल को सुरक्षित रखती है।
- source_word: מְעַט דְּבַשׁ הַזֶּה
  choice: इस शहद में से थोड़ा-सा
  rationale: मात्रा और संकेतवाचक दोनों को स्पष्ट, स्वाभाविक हिन्दी में व्यक्त करता है; मूल में मधुछत्ता स्पष्ट नहीं है।
