  text: तब शाऊल ने पलिश्तियों का पीछा करना बंद कर दिया, और पलिश्ती अपने स्थान पर चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: लौट गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है, पर מֵאַחֲרֵי के साथ इस सैनिक प्रसंग में यह पीछा छोड़कर हटने या लौटने का भाव देता है। हिंदी में ‘लौट गया’ स्वाभाविक है, जबकि शाब्दिक ‘ऊपर गया’ यहाँ भ्रामक हो सकता है।
- source_word: מֵאַחֲרֵי
  choice: का पीछा छोड़कर
  rationale: इसका शाब्दिक अर्थ ‘के पीछे से’ है; युद्ध के संदर्भ में आशय पीछा करना बंद करने से है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जातीय नाम का प्रचलित मानक हिंदी रूप।
- source_word: הָלְכוּ
  choice: चले गए
  rationale: הלך का सीधा और प्रसंगानुकूल अर्थ ‘जाना/चलना’ है; ‘लौट गए’ संभव है, किंतु क्रिया स्वयं लौटने का अर्थ अनिवार्य नहीं करती।
- source_word: לִמְקוֹמָם
  choice: अपने स्थान को
  rationale: מָקוֹם का अर्थ ‘स्थान’ और प्रत्यय का अर्थ ‘उनका/अपने’ है। ‘घर’ कहना मूल से अधिक विशिष्ट होता।
