source:
  edition: WLC
  text: וַ/יִּזָּעֵ֣ק שָׁא֗וּל וְ/כָל הָ/עָם֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד הַ/מִּלְחָמָ֑ה וְ/הִנֵּ֨ה הָיְתָ֜ה חֶ֤רֶב אִישׁ֙ בְּ/רֵעֵ֔/הוּ מְהוּמָ֖ה גְּדוֹלָ֥ה מְאֹֽד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/020.yaml
  text: Then Saul and all the people who were with him were summoned, and they came to the battle[a]. And behold, every man's sword was against his companion[b], with very great confusion.
translation:
  language: hi
  text: तब शाऊल और उसके साथ के सभी लोगों को इकट्ठा होने के लिए बुलाया गया,[a] और वे युद्धस्थल तक पहुँचे। और देखो, हर एक की तलवार उसके साथी के विरुद्ध थी; वहाँ बहुत बड़ी अफरा-तफरी मची हुई थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तब शाऊल और उसके साथ के सभी लोग पुकार उठे,” अथवा “इकट्ठे हुए।” यहाँ इब्रानी क्रिया को एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वहाँ बहुत बड़ी घबराहट” अथवा “बहुत बड़ा कोलाहल था।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּזָּעֵק
  choice: इकट्ठा होने के लिए बुलाया गया
  rationale: 'निफ़ाल रूप को प्रसंग में कर्मवाच्य अर्थ में लिया गया है: शाऊल और उसके साथ के लोग युद्ध के लिए बुलाकर इकट्ठे किए गए। मूल धातु के कारण ‘पुकार उठे’ भी संभव है, इसलिए विकल्प पादटिप्पणी में रखा गया है।'
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: उसके साथ के सभी लोग
  rationale: यह עָם की सामान्यता बनाए रखता है; सैनिक प्रसंग स्पष्ट है, पर ‘सेना’ जोड़कर अर्थ को अनावश्यक रूप से संकीर्ण नहीं किया गया।
- source_word: וַיָּבֹאוּ עַד הַמִּלְחָמָה
  choice: वे युद्धस्थल तक पहुँचे
  rationale: בוא + עד यहाँ युद्ध के स्थान तक पहुँचने की गति व्यक्त करता है। ‘युद्ध में उतर गए’ प्रत्यक्ष भागीदारी को मूल से अधिक स्पष्ट कर देता।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह अचानक दिखाई देने वाले दृश्य की कथात्मक सजीवता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: חֶרֶב אִישׁ בְּרֵעֵהוּ
  choice: हर एक की तलवार उसके साथी के विरुद्ध थी
  rationale: मूल की संरचना और आपसी युद्ध का चित्र सुरक्षित रखा गया है। ‘साथी’ רֵעַ का तटस्थ अर्थ देता है, बिना ‘मित्र’ की अतिरिक्त आत्मीयता जोड़े।
- source_word: מְהוּמָה גְּדוֹלָה מְאֹד
  choice: बहुत बड़ी अफरा-तफरी
  rationale: מְהוּמָה में भ्रम, घबराहट और कोलाहल के परस्पर जुड़े भाव हैं। ‘अफरा-तफरी’ इस अराजक दृश्य को सहज आधुनिक हिन्दी में व्यक्त करती है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘युद्धस्थल’ से स्थान तक पहुँचने का भाव स्पष्ट होता है, और ‘अफरा-तफरी’ सामान्य पाठक के लिए स्वाभाविक रहते हुए मूल की व्यापक अर्थ-सीमा को व्यक्त करती है।
