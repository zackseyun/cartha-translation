  text: וַ/יּ֧וֹשַׁע יְהוָ֛ה בַּ/יּ֥וֹם הַ/ה֖וּא אֶת יִשְׂרָאֵ֑ל וְ/הַ֨/מִּלְחָמָ֔ה עָבְרָ֖ה אֶת בֵּ֥ית אָֽוֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/023.yaml
  text: So Yahweh saved Israel that day[a], and the battle passed beyond Beth-aven.
translation:
  language: hi
  text: उस दिन याहवे ने इस्राएल को बचाया, और लड़ाई बेत-आवेन के पार निकल गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹשַׁע
  choice: बचाया
  rationale: हिफ़ील रूप में ישׁע का अर्थ बचाना या छुटकारा देना है। ‘बचाया’ संक्षिप्त है और यहोवा को कार्यकर्ता बनाए रखते हुए मूल का धार्मिक भार सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह हिब्रू कालवाचक पदबंध का स्वाभाविक और स्पष्ट हिन्दी रूप है।
- source_word: אֶת יִשְׂרָאֵל
  choice: इस्राएल को
  rationale: प्रत्यक्ष कर्म के रूप में राष्ट्रीय नाम है; प्रसंग में यह सामूहिक रूप से इस्राएली लोगों या सेना को दर्शाता है।
- source_word: וְהַמִּלְחָמָה
  choice: और लड़ाई
  rationale: מִלְחָמָה युद्ध या लड़ाई हो सकता है; यहाँ चल रही विशेष मुठभेड़ के लिए ‘लड़ाई’ अधिक स्वाभाविक है।
- source_word: עָבְרָה אֶת בֵּית אָוֶן
  choice: बेत-आवेन के पार तक फैल गई
  rationale: עבר स्थान के आगे या पार जाने को व्यक्त करता है। हिन्दी में लड़ाई के भौगोलिक विस्तार को स्वाभाविक रूप से बताने के लिए ‘पार तक फैल गई’ चुना गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; इसलिए उसे उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित रूप ‘यहोवा’ रखा गया।
- issue: इस्राएल के उद्धार का कर्ता
  choice: यहोवा ने इस्राएल को बचाया
  alternative: इस्राएल को विजय मिली
  rationale: मूल का हिफ़ील क्रिया-रूप स्पष्ट रूप से यहोवा को उद्धार का कर्ता बताता है; केवल विजय का वर्णन करना इस धार्मिक बल को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और कथात्मक शैली रखी गई है। ‘इस प्रकार’ पिछले प्रसंग के परिणाम से इस कथन का संबंध दिखाता है। स्थान-नाम को ‘बेत-आवेन’ रूप में लिप्यंतरित किया गया है।
