base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/040.yaml
  text: Then he said to all Israel[a], “You be on one side, and I and Jonathan my son will be on the other side.” And the people said to Saul, “Do what seems good in your eyes.”
translation:
  language: hi
  text: तब उसने सारे इस्राएल से कहा, “तुम एक ओर रहो, और मैं और मेरा पुत्र योनातान दूसरी ओर रहेंगे।” तब लोगों ने शाऊल से कहा, “जो तुझे अच्छा लगे, वही कर।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְעֵבֶר אֶחָד
  choice: एक ओर / दूसरी ओर
  rationale: עֵבֶר यहाँ दो पक्षों के स्थानगत विभाजन को दर्शाता है। हिंदी में ‘एक ओर … दूसरी ओर’ इस समानांतर विरोध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תִּהְיוּ / נִהְיֶה
  choice: रहो / रहेंगे
  rationale: היה का मूल अर्थ ‘होना’ है; इस प्रसंग में ‘एक ओर रहना’ अपनी-अपनी ओर स्थान लेने का भाव देता है, बिना ‘खड़े होना’ जैसी अतिरिक्त मुद्रा जोड़े।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: यह उपस्थित समुदाय के लिए सामूहिक पद है; ‘सारे इस्राएल’ आधुनिक हिंदी में स्वाभाविक रहते हुए व्यापकता बनाए रखता है।
- source_word: בְּנִי
  choice: मेरा पुत्र
  rationale: मूल का पुत्र-संबंध स्पष्ट रूप से सुरक्षित है; ‘पुत्र’ कथात्मक और गरिमापूर्ण शैली के अनुकूल है।
- source_word: הַטּוֹב בְּעֵינֶיךָ
  choice: जो तुझे अच्छा लगे
  rationale: शाब्दिक मुहावरा ‘जो तेरी आँखों में अच्छा हो’ हिंदी में अस्वाभाविक है। यह चयन व्यक्ति को उचित या अच्छा प्रतीत होने का वही अर्थ सहज हिंदी में देता है।
- source_word: עֲשֵׂה
  choice: वही कर
  rationale: सरल आज्ञार्थक क्रिया को पूर्ववर्ती संबंधवाचक वाक्य के साथ स्वाभाविक हिंदी में जोड़ा गया है।
- source_word: וַיֹּאמֶר / וַיֹּאמְרוּ
  choice: तब उसने कहा / तब लोगों ने कहा
  rationale: वाव-परिणामी की कथात्मक प्रगति को हिंदी में ‘तब’ से सहज ढंग से व्यक्त किया गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘एक ओर … दूसरी ओर’ से चिट्ठी डालने के लिए बने दो पक्षों का विरोध स्पष्ट है। सर्वनाम ‘तुम’ और ‘तुझे’ मूल के संबोधन और ऐतिहासिक हिंदी बाइबिल-शैली के अनुरूप रखे गए हैं।
