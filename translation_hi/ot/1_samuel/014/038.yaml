  text: וַ/יֹּ֣אמֶר שָׁא֔וּל גֹּ֣שֽׁוּ הֲלֹ֔ם כֹּ֖ל פִּנּ֣וֹת הָ/עָ֑ם וּ/דְע֣וּ וּ/רְא֔וּ בַּ/מָּ֗ה הָֽיְתָ֛ה הַ/חַטָּ֥את הַ/זֹּ֖את הַ/יּֽוֹם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/014/038.yaml
  text: Then Saul said[a], “Come here, all you chiefs of the people, and know and see by what this sin has happened today.”
translation:
  language: hi
  text: तब शाऊल ने कहा, “प्रजा के सभी अगुवों[a], यहाँ आओ और जानो और देखो कि आज यह पाप कैसे हुआ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘प्रजा के सभी कोने’; यह प्रजा के अगुवों या प्रतिनिधियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גֹּשׁוּ הֲלֹם
  choice: यहाँ पास आओ
  rationale: बहुवचन आज्ञार्थक क्रिया और स्थानवाचक הֲלֹם मिलकर शाऊल के पास आने का आह्वान करते हैं। यह हिंदी में स्वाभाविक है और निकट आने का भाव बनाए रखता है।
- source_word: כֹּל פִּנּוֹת הָעָם
  choice: प्रजा के सभी अगुवो
  rationale: शाब्दिक रूप से ‘प्रजा के सभी कोने’ एक इब्रानी मुहावरा है, जो प्रजा के प्रमुखों या प्रतिनिधियों को सूचित करता है। संबोधन के कारण ‘अगुवो’ रूप रखा गया है।
- source_word: וּדְעוּ וּרְאוּ
  choice: और जानो और देखो
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग-अलग रखकर जाँचने और पहचानने पर इब्रानी बल सुरक्षित रखा गया है।
- source_word: בַּמָּה
  choice: किस बात में
  rationale: ב + מה यहाँ उस बात, रीति या पहलू की पूछताछ करता है जिसमें अपराध हुआ। ‘किस बात में’ इस खुलापन को बनाए रखता है और केवल कारण या साधन तक अर्थ को सीमित नहीं करता।
- source_word: הָיְתָה
  choice: हुआ है
  rationale: क्रिया का मूल भाव ‘होना/घटित होना’ है। हिंदी का पूर्ण वर्तमान प्रसंग में सामने आए पाप की जाँच को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַחַטָּאת הַזֹּאת
  choice: यह पाप
  rationale: חטאת यहाँ परमेश्वर के सम्मुख हुए अपराधपूर्ण कार्य को सूचित करता है; ‘पाप’ इसका सीधा और धर्मवैज्ञानिक भार बनाए रखने वाला अनुवाद है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह सामान्य कालवाचक अर्थ का सरल आधुनिक हिंदी रूप है।
theological_decisions:
- issue: ‘प्रजा के सभी कोने’ मुहावरे का आशय
  choice: प्रजा के सभी अगुवो
  alternative: प्रजा के सभी कोनो; प्रजा के सभी प्रधानो; प्रजा के सभी प्रतिनिधियो
  rationale: शाब्दिक ‘कोने’ हिंदी में आशय अस्पष्ट कर देगा। प्रसंग में प्रजा के प्रमुख या प्रतिनिधि बुलाए जा रहे हैं; ‘अगुवो’ अर्थ को स्पष्ट रखते हुए किसी विशिष्ट प्रशासनिक पद को अनावश्यक रूप से निर्धारित नहीं करता।
- issue: חטאת का नैतिक और धर्मवैज्ञानिक बल
  choice: पाप
  alternative: अपराध; गलत काम; दोष
  rationale: कथा में विषय परमेश्वर के सम्मुख हुए उल्लंघन का है। ‘पाप’ मूल शब्द का नैतिक और धर्मवैज्ञानिक भार सुरक्षित रखता है, पर अपराधी की पहचान या अपराध के स्वरूप को पहले से तय नहीं करता।
- issue: בַּמָּה की पूछताछ का दायरा
  choice: किस बात में
  alternative: कैसे; किसके द्वारा; किस कारण
  rationale: मूल पद रीति, साधन या उस बात की ओर संकेत कर सकता है जिसमें पाप हुआ। ‘किस बात में’ इस वास्तविक अस्पष्टता को बनाए रखता है और किसी व्यक्ति, कारण या साधन को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण किंतु सहज कथात्मक रूप रखा गया है। ‘जानो और देखो’ सामान्य हिंदी में कुछ असामान्य लग सकता है, पर मूल की दोहरी आज्ञा और उसके बल को सुरक्षित रखने के लिए इसे जानबूझकर बनाए रखा गया है।
