  yaml_path: translation/ot/1_samuel/027/006.yaml
  text: So Achish gave him Ziklag that day[b][a]. Therefore Ziklag has belonged to the kings of Judah to this day.
translation:
  language: hi
  text: आकीश ने उसी दिन उसे सिकलग दे दिया। इस कारण सिकलग आज तक यहूदा के राजाओं के अधिकार में रहा है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֶּן
  choice: दे दिया
  rationale: इस कथात्मक प्रसंग में נתן का सामान्य अर्थ ‘देना’ है; ‘दे दिया’ घटना की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לּוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन प्रत्यय निकटवर्ती प्रसंग में दाऊद की ओर संकेत करता है।
- source_word: אָכִישׁ
  choice: आकीश
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: हिब्रू कालवाचक पद का स्वाभाविक हिन्दी रूप, जो उस निर्दिष्ट दिन पर बल बनाए रखता है।
- source_word: צִקְלָג
  choice: सिकलग
  rationale: स्थाननाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: לָכֵן
  choice: इस कारण
  rationale: आकीश द्वारा नगर दिए जाने और उसके बाद के स्वामित्व के बीच परिणामसूचक संबंध स्पष्ट करता है।
- source_word: הָיְתָה ... לְמַלְכֵי יְהוּדָה
  choice: यहूदा के राजाओं का रहा है
  rationale: शाब्दिक ‘रहा/हुआ’ और संबंधसूचक לְ को मिलाकर निरंतर राजकीय स्वामित्व का अर्थ स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: वर्णनकर्ता के वर्तमान समय तक जारी स्थिति बताने वाला मानक हिन्दी मुहावरा।
theological_decisions:
- issue: ‘आज तक’ और ‘यहूदा के राजाओं’ से सूचित ऐतिहासिक दृष्टिकोण
  choice: वर्णनकर्ता की पश्चदृष्टि-संबंधी टिप्पणी को बिना विस्तार या सामंजस्य के यथावत रखना
  alternative: इसे स्पष्ट रूप से बाद के यहूदी राजकीय काल की संपादकीय टिप्पणी कहना
  rationale: हिब्रू पाठ केवल निरंतर स्वामित्व का ऐतिहासिक तथ्य बताता है; अनुवाद में रचनाकाल या संपादन का कोई सिद्धांत नहीं जोड़ा जाना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। ‘यहूदा के राजाओं का रहा है’ मूल की संबंध/स्वामित्व-सूचक संरचना और ‘आज तक’ की निरंतरता दोनों को सुरक्षित रखता है।
