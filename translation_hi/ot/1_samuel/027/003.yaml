base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/003.yaml
  text: So David stayed with Achish in Gath[a], he and his men, each man with his household—David with his two wives, Ahinoam the Jezreelite and Abigail[b], the wife of Nabal the Carmelite.
translation:
  language: hi
  text: दाऊद गत में आकीश के साथ रहा[a], वह और उसके आदमी, हर एक अपने घराने के साथ[b]। दाऊद अपनी दो पत्नियों—यिज्रेल की अहीनोअम और कर्मेल की निवासी, नाबाल की पत्नी अबीगैल—के साथ था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रहता था।” इब्रानी क्रिया का अर्थ किसी स्थान पर निवास करना या कुछ समय तक वहाँ ठहरे रहना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “हर एक आदमी और उसका घराना।” यह वितरणात्मक अभिव्यक्ति है, जिसका अर्थ है कि हर आदमी अपने घराने के लोगों के साथ था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישׁב यहाँ आकीश के पास कुछ समय निवास करने को दर्शाता है। ‘रहने लगा’ स्वाभाविक हिन्दी है और स्थायी बसावट का अनावश्यक संकेत नहीं देता।
- source_word: עִם אָכִישׁ בְּגַת
  choice: गत में आकीश के साथ
  rationale: עִם संगति और בְּ नगर के भीतर स्थान को व्यक्त करता है; यह क्रम हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הוּא וַאֲנָשָׁיו
  choice: अपने आदमियों समेत
  rationale: אֲנָשָׁיו का शाब्दिक अर्थ ‘उसके आदमी’ है। ये दाऊद के सशस्त्र अनुयायी हैं, पर ‘आदमी’ मूल की व्यापकता बनाए रखता है।
- source_word: אִישׁ וּבֵיתוֹ
  choice: हर एक आदमी अपने घराने के साथ
  rationale: אִישׁ यहाँ वितरणात्मक अर्थ में ‘हर एक’ है और בֵּיתוֹ भवन नहीं, उसके घराने के लोगों को सूचित करता है।
- source_word: וּשְׁתֵּי נָשָׁיו
  choice: अपनी दोनों पत्नियों ... के साथ
  rationale: यह दाऊद के अपने घराने का विवरण देता है; ‘के साथ’ हिन्दी में संबंध को स्पष्ट करता है।
- source_word: הַיִּזְרְעֵאלִית
  choice: यिज्रेली
  rationale: स्त्रीलिंग जातिवाचक विशेषण अहीनोअम का यिज्रेल से संबंध बताता है; ‘यिज्रेली’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: אֵשֶׁת נָבָל הַכַּרְמְלִית
  choice: कर्मेली नाबाल की पत्नी
  rationale: मूल में अबीगैल को नाबाल की पत्नी कहा गया है और הַכַּרְמְלִית कर्मेल से संबंध सूचित करता है। ‘कर्मेली नाबाल’ हिन्दी में इस संबंध को सहज रूप से व्यक्त करता है।
