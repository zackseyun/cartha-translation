base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/010.yaml
  text: Then Achish said[a], “Where have you made a raid today?” And David said, “Against the Negev of Judah, against the Negev of the Jerahmeelites[b], and against the Negev of the Kenites.”
translation:
  language: hi
  text: तब आकीश ने पूछा,[a] “आज तुमने कहाँ छापा मारा?” दाऊद ने कहा, “यहूदा के नेगेव[b] पर, यरहमेएलियों के नेगेव पर और केनियों के नेगेव पर।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ का शब्दशः अर्थ लगभग यह है, “क्या तुमने आज छापा नहीं मारा?” लेकिन संदर्भ में प्रश्न का आशय है, “आज तुमने कहाँ छापा मारा?”
    reason: textual_variant
  - marker: b
    text: या, “यहूदा के दक्षिणी भाग पर, यरहमेएलियों के दक्षिणी भाग पर और केनियों के दक्षिणी भाग पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל פְּשַׁטְתֶּם הַיּוֹם
  choice: आज तुमने कहाँ छापा मारा?
  rationale: व्यंजनात्मक इब्रानी पाठ में אַל सामान्यतः निषेध व्यक्त करता है, पर प्राचीन अनुवादों और कथानक के संदर्भ से यहाँ स्थान पूछने वाला प्रश्न अभिप्रेत है। פּשט सैन्य छापे या लूटमार के लिए प्रयुक्त है; ‘छापा मारा’ आधुनिक हिंदी में स्वाभाविक और सटीक है।
- source_word: נֶגֶב
  choice: नेगेव
  rationale: यह शब्द ‘दक्षिण’ भी कह सकता है और दक्षिण के शुष्क भूभाग ‘नेगेव’ का भौगोलिक नाम भी हो सकता है। यहाँ समुदायों और क्षेत्र के नामों के साथ बार-बार आने के कारण भौगोलिक नाम रखा गया है; विकल्प पादटिप्पणी में दिया गया है।
- source_word: עַל
  choice: पर
  rationale: छापा मारने के कथित लक्ष्यों के साथ यह विरोधी दिशा या लक्ष्य सूचित करता है। हिंदी में ‘नेगेव पर [छापा मारा]’ स्वाभाविक रूप से शत्रुतापूर्ण कार्रवाई व्यक्त करता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: गोत्र और भूभाग के नाम का हिंदी बाइबलीय रूप।
- source_word: הַיַּרְחְמְאֵלִי
  choice: यरहमेएलियों
  rationale: जातिवाचक रूप यरहमेएल के वंश या कुल के लोगों को दर्शाता है; हिंदी बहुवचन संबंधसूचक रूप संदर्भ में स्वाभाविक है।
- source_word: הַקֵּינִי
  choice: केनियों
  rationale: जातिवाचक रूप केनी समुदाय को दर्शाता है; हिंदी बहुवचन संबंधसूचक रूप रखा गया है।
- source_word: וַיֹּאמֶר
  choice: ने पूछा / ने कहा
  rationale: मूल क्रिया सामान्यतः ‘कहा’ है। आकीश का कथन स्पष्टतः प्रश्न होने के कारण हिंदी में ‘पूछा’ स्वाभाविक है, जबकि दाऊद के उत्तर में ‘कहा’ रखा गया है।
