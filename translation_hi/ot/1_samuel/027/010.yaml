translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘नेगेव’ द्वारा मूल की भौगोलिक अस्पष्टता और विशिष्टता सुरक्षित रहती है; ‘दक्षिणी भाग’ की lexical संभावना को समझाने के लिए अलग पादटिप्पणी नहीं जोड़ी गई, क्योंकि उपलब्ध [b] टिप्पणी का चिह्न मुख्य पाठ में स्वाभाविक स्थान पर तीन बार लगाने से पाठ भारी होता; फिर भी प्रकाशन में आवश्यक हो तो ‘नेगेव’ पर संयुक्त टिप्पणी जोड़ी जा सकती है।
