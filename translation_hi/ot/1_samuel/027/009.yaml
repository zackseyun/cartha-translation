id: 1SA.27.9
reference: 1 Samuel 27:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִכָּ֤ה דָוִד֙ אֶת הָ/אָ֔רֶץ וְ/לֹ֥א יְחַיֶּ֖ה אִ֣ישׁ וְ/אִשָּׁ֑ה וְ/לָקַח֩ צֹ֨אן וּ/בָקָ֜ר וַ/חֲמֹרִ֤ים וּ/גְמַלִּים֙ וּ/בְגָדִ֔ים וַ/יָּ֖שָׁב וַ/יָּבֹ֥א אֶל אָכִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/009.yaml
  text: David struck the land and left alive neither man nor woman[a], and he took sheep, cattle, donkeys, camels, and clothing. Then he returned and came to Achish.
translation:
  language: hi
  text: दाऊद ने उस देश पर आक्रमण किया और किसी पुरुष या स्त्री को जीवित नहीं छोड़ा[a]। वह भेड़-बकरियाँ, गाय-बैल, गधे, ऊँट और कपड़े ले गया। फिर वह लौटकर आकीश के पास आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी पुरुष या स्त्री को जीने नहीं दिया।”
    reason: חיה के हिफ़ील रूप का निकटतर शाब्दिक विकल्प देना।
lexical_decisions:
- source_word: וְהִכָּה
  choice: आक्रमण किया
  rationale: हिफ़ील रूप यहाँ किसी क्षेत्र और उसके निवासियों पर हिंसक चढ़ाई करने का भाव देता है। ‘आक्रमण किया’ आधुनिक हिन्दी में स्वाभाविक है और मूल से अधिक विवरण नहीं जोड़ता।
- source_word: הָאָרֶץ
  choice: उस देश
  rationale: यहाँ אֶרֶץ पृथ्वी नहीं, लक्षित लोगों के बसे हुए भूभाग को दर्शाता है। प्रसंगसूचक ‘उस देश’ हिन्दी में सहज है।
- source_word: וְלֹא יְחַיֶּה אִישׁ וְאִשָּׁה
  choice: किसी पुरुष या स्त्री को जीवित नहीं छोड़ा
  rationale: חיה का हिफ़ील ‘जीवित रखना/जीने देना’ है। यह अनुवाद किसी को न बख्शने का स्पष्ट अर्थ रखता है और पुरुष तथा स्त्री दोनों का मूल उल्लेख बनाए रखता है।
- source_word: וְלָקַח
  choice: ले गया
  rationale: לקח का मूल अर्थ ‘लेना’ है; लूट के प्रसंग में ‘ले गया’ स्वाभाविक हिन्दी है और अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: צֹאן छोटे पालतू पशुओं का सामूहिक पद है, जिसमें भेड़ और बकरियाँ दोनों आ सकती हैं; हिन्दी में ‘भेड़-बकरियाँ’ इसका स्पष्ट और प्रचलित समतुल्य है।
- source_word: בָקָר
  choice: गाय-बैल
  rationale: בקר गोवंश का सामूहिक पद है। ‘गाय-बैल’ सामान्य पाठक के लिए प्राकृतिक और लिंग-समावेशी पशु-वर्ग सूचक है।
- source_word: חֲמֹרִים
  choice: गधे
  rationale: यह आधुनिक हिन्दी का सीधा और स्पष्ट समतुल्य है।
- source_word: גְמַלִּים
  choice: ऊँट
  rationale: यह स्रोत शब्द का सीधा हिन्दी समतुल्य है।
- source_word: בְגָדִים
  choice: कपड़े
  rationale: लूटी गई वस्तुओं की सूची में ‘कपड़े’ आधुनिक, सहज और अर्थानुकूल है।
- source_word: וַיָּשָׁב וַיָּבֹא
  choice: फिर वह लौटकर ... आया
  rationale: इससे दोनों क्रमिक क्रियाओं—लौटना और आना—का कथात्मक प्रवाह स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: אָכִישׁ
  choice: आकीश
  rationale: व्यक्तिनाम को हिन्दी में ध्वन्यात्मक रूप से लिप्यंतरित किया गया है।
theological_decisions:
- issue: हिंसक कार्रवाई का वर्णन
  choice: दाऊद की घातक चढ़ाई और किसी पुरुष या स्त्री को जीवित न छोड़ने की बात स्पष्ट रूप में रखी गई है।
  alternative: हिंसा को हल्का करने वाली भाषा, अथवा मूल से आगे बढ़कर अत्यधिक सनसनीखेज विवरण।
  rationale: मूल पाठ नैतिक रूप से कठिन घटना को कठोर और संक्षिप्त भाषा में बताता है। अनुवाद को न इसे ढकना चाहिए, न इसमें अतिरिक्त भयावहता जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा सरल, गरिमापूर्ण और कथात्मक है। पशु-वर्गों के लिए सामान्य हिन्दी सामूहिक पद चुने गए हैं। हिंसा का वर्णन बिना शमन या विस्तार के स्पष्ट रखा गया है।
