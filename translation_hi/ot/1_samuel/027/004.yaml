  language: hi
  text: जब शाऊल को बताया गया कि दाऊद गत भाग गया था, तब उसने उसकी खोज करना जारी नहीं रखा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד לְשָׁאוּל
  choice: शाऊल को बताया गया
  rationale: निफ़अल का कर्मवाच्य रूप सूचना देने वाले को अनिर्दिष्ट रखता है; हिन्दी में यह स्वाभाविक कर्मवाच्य उसी विशेषता को बनाए रखता है।
- source_word: בָרַח דָּוִד גַּת
  choice: दाऊद भागकर गत चला गया था
  rationale: בָרַח का मूल अर्थ ‘भागना’ है और गात गंतव्य है। ‘भागकर ... चला गया था’ रिपोर्ट मिलने से पहले घटित पलायन को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְלֹא יֹסֶף עוֹד
  choice: फिर ... जारी नहीं रखी
  rationale: יסף और עוד का संयुक्त प्रयोग किसी काम को आगे या दोबारा न करने का भाव देता है; ‘फिर ... जारी नहीं रखी’ इस समाप्ति और निरंतरता—दोनों पहलुओं को बनाए रखता है।
- source_word: לְבַקְשׁוֹ
  choice: उसकी खोज
  rationale: בקש का व्यापक अर्थ ‘ढूँढ़ना/खोज करना’ है। प्रसंग में इसका उद्देश्य दाऊद को ढूँढ़ना है; ‘खोज’ अनावश्यक रूप से ‘पीछा’ या ‘पकड़ने’ का अर्थ नहीं जोड़ता।
