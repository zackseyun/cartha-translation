translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘गत’ हिन्दी बाइबल परंपरा में प्रचलित स्थान-नाम है; वाक्य में स्पष्टता के लिए ‘तब’ जोड़ा गया है, जबकि अर्थगत संबंध मूल के וְ से समर्थित है।
