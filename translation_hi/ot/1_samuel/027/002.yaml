  yaml_path: translation/ot/1_samuel/027/002.yaml
  text: So David arose and crossed over, he and the six hundred men who were with him, to Achish son of Maoch, king of Gath.
translation:
  language: hi
  text: तब दाऊद उठा और अपने साथ के छह सौ पुरुषों सहित गात के राजा माओक के पुत्र आकीश के पास पार चला गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: क़ूम का यह रूप निर्णायक कार्य के आरम्भ को बताने वाला इब्रानी कथात्मक मुहावरा है; ‘उठा’ उसे संक्षेप और स्वाभाविक रूप से बनाए रखता है।
- source_word: וַיַּעֲבֹר
  choice: चला गया
  rationale: आवर का मूल भाव पार होकर दूसरी ओर जाने का है। यहाँ किसी निश्चित नदी या सीमा का उल्लेख नहीं है, इसलिए आधुनिक हिन्दी में ‘चला गया’ स्वाभाविक है और गात की ओर स्थानांतरण स्पष्ट करता है।
- source_word: הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר עִמּוֹ
  choice: अपने साथ के छः सौ पुरुषों को लेकर
  rationale: मूल में दाऊद और उसके साथ के छः सौ पुरुष संयुक्त कर्ता हैं। हिन्दी का यह प्रयोग उसी सहभागिता को सहज ढंग से व्यक्त करता है, यद्यपि व्याकरणिक रचना परिवर्तित होती है।
- source_word: אֶל אָכִישׁ
  choice: आकीश के पास
  rationale: אֶל व्यक्ति की ओर गमन दर्शाता है; हिन्दी में किसी शासक के निवास या संरक्षण में जाने के लिए ‘के पास’ स्वाभाविक है।
- source_word: בֶּן מָעוֹךְ
  choice: माओक के पुत्र
  rationale: इब्रानी पितृनाम-संबंध को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: מֶלֶךְ גַּת
  choice: गात के राजा
  rationale: संबंधवाचक इब्रानी पदबंध को हिन्दी की स्वाभाविक संरचना में प्रस्तुत किया गया है।
