    issue: The verb वַיַּעֲבֹר is rendered only as ‘चला गया’.
    rationale: The Hebrew specifically says that David crossed over. Adding ‘पार’ preserves this element without asserting an unnamed geographical feature or route.
  revised_text: तब दाऊद उठा और अपने साथ के छह सौ पुरुषों सहित गात के राजा माओक के पुत्र आकीश के पास पार चला गया।
