lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: अवधि का सार बताने वाले इस वाक्य में सरल भूतकालीन रूप स्वाभाविक है और इब्रानी कथात्मक सूत्र का अर्थ बनाए रखता है।
- source_word: מִסְפַּר הַיָּמִים
  choice: जितने समय तक ... वह
  rationale: शाब्दिक ‘दिनों की संख्या’ हिंदी में बोझिल लगती है; यह रचना अवधि का अर्थ स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
- source_word: אֲשֶׁר יָשַׁב
  choice: रहा
  rationale: यहाँ ישב का अर्थ बैठना नहीं, किसी स्थान में निवास करना या ठहरना है; ‘रहा’ प्रसंग और आधुनिक हिंदी दोनों के अनुकूल है।
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: पलिश्तियों के प्रदेश में
  rationale: שׂדה का शाब्दिक अर्थ ‘मैदान/खेत’ हो सकता है, पर यहाँ वह किसी जाति के भू-क्षेत्र को दर्शाता है; ‘प्रदेश’ भ्रामक शाब्दिकता से बचाता है।
- source_word: יָמִים וְאַרְבָּעָה חֳדָשִׁים
  choice: एक वर्ष और चार महीने
  rationale: अवधि-सूचक प्रयोग में יָמִים मुहावरे के रूप में ‘एक वर्ष’ दर्शाता है; मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पाद-टिप्पणी में सुरक्षित है।
