base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/011.yaml
  text: David left alive neither man nor woman to bring to Gath[a], saying, “Otherwise they might report about us, saying, ‘This is what David did[b], and this was his practice all the days that he lived in the country of the Philistines.’”
translation:
  language: hi
  text: दाऊद किसी पुरुष या स्त्री को जीवित नहीं छोड़ता था कि वे गत ले जाए जा सकें। वह कहता था, “कहीं वे हमारे विषय में खबर न दे दें, ‘दाऊद ने ऐसा किया है, और जितने समय वह पलिश्तियों के प्रदेश[a] में रहा, उसकी यही रीति[b] रही है।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “पलिश्तियों के मैदान में”; यहाँ इसका अर्थ पलिश्तियों का प्रदेश या देहाती भूभाग है।'
    reason: cultural_note
  - marker: b
    text: या “उसका यही दस्तूर” अथवा “उसका यही व्यवहार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ וְאִשָּׁה
  choice: किसी भी पुरुष या स्त्री को
  rationale: एकवचन युग्म का प्रयोग वितरणात्मक है और हर सम्भावित जीवित बचे व्यक्ति को समेटता है। यह स्वाभाविक हिन्दी में उसकी सम्पूर्णता बनाए रखता है।
- source_word: לֹא יְחַיֶּה
  choice: जीवित नहीं छोड़ता था
  rationale: חיה के पिएल रूप का अर्थ यहाँ किसी को जीवित बचाए रखना या छोड़ देना है। अपूर्ण क्रिया और प्रसंग में बार-बार की जाने वाली कार्रवाई को हिन्दी का ‘छोड़ता था’ स्पष्ट करता है।
- source_word: לְהָבִיא גַת
  choice: कि उसे गत ले जाया जा सके
  rationale: उद्देश्यसूचक क्रियारूप यह बताता है कि कोई जीवित व्यक्ति गत न पहुँचाया जाए। कर्म मूल पाठ में निहित है; हिन्दी में ‘उसे’ जोड़ना अर्थ को स्पष्ट करता है, और कर्मवाच्य सम्भावना प्रसंग के अनुरूप है।
- source_word: לֵאמֹר
  choice: वह कहता था
  rationale: पहला לֵאמֹר दाऊद के तर्क को प्रत्यक्ष कथन के रूप में प्रस्तुत करता है। ‘वह कहता था’ इस इब्रानी कथन-रचना को बिना उसे केवल मन के विचार में बदल दिए बनाए रखता है।
- source_word: פֶּן
  choice: कहीं ... न
  rationale: यह अवांछित परिणाम को रोकने की आशंका व्यक्त करता है; ‘कहीं ... न’ आधुनिक हिन्दी में इसका सहज और सटीक रूप है।
- source_word: יַגִּדוּ עָלֵינוּ
  choice: वे हमारे विषय में यह न बता दें
  rationale: נגד का हिफ़ील रूप बताने या सूचना देने का अर्थ रखता है और עַל दाऊद तथा उसके लोगों के विषय में सूचना देने को सूचित करता है।
- source_word: כֹּה עָשָׂה דָוִד
  choice: दाऊद ने ऐसा किया है
  rationale: כֹּה का संकेतात्मक बल ‘ऐसा’ से व्यक्त होता है। पूर्ण क्रिया को भावी सूचना के भीतर हिन्दी के पूर्ण पक्ष ‘किया है’ से रखा गया है।
- source_word: וְכֹה מִשְׁפָּטוֹ
  choice: उसकी यही रीति रही है
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय के बजाय स्थापित ढंग, रीति या व्यवहार को दर्शाता है। ‘रीति’ मूल शब्द की कुछ व्यापकता बनाए रखते हुए प्रसंग में स्वाभाविक है।
- source_word: כָּל הַיָּמִים אֲשֶׁר יָשַׁב
  choice: जितने समय वह ... रहा
  rationale: यह दाऊद के निवास की पूरी अवधि बताता है। शब्दशः ‘सारे दिन’ के स्थान पर यह आधुनिक हिन्दी में वही कालगत अर्थ स्पष्ट करता है।
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: पलिश्तियों के प्रदेश में
  rationale: שָׂדֶה का मूल अर्थ ‘मैदान/खेत’ है, पर यहाँ वह पलिश्ती भूभाग या खुले देश के लिए प्रयुक्त भौगोलिक मुहावरा है।
