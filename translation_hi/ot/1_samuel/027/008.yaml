base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/008.yaml
  text: Then David and his men went up and made raids against the Geshurites[a], the Girzites, and the Amalekites, for these were the inhabitants of the land from ancient times, as you go to Shur[b], even to the land of Egypt.
translation:
  language: hi
  text: तब दाऊद और उसके लोग चढ़ गए और गशूरी लोगों, गिरजी लोगों[a] और अमालेकी लोगों पर छापा मारा, क्योंकि वे प्राचीन काल से उस देश के निवासी थे, शूर की ओर जाते हुए मिस्र देश तक।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “गेजरी लोगों।” यहाँ जाति-नाम का पाठ और उसका लिप्यंतरण अनिश्चित है; मुख्य पाठ प्रदत्त हिब्रू व्यंजन-रूप के निकट है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַל
  choice: चढ़कर
  rationale: क्रिया עלה का मूल दिशात्मक अर्थ बनाए रखा गया है; प्रसंग में इसे केवल ‘निकलकर’ कहना स्रोत की विशिष्ट क्रिया को समतल कर देता।
- source_word: וַיִּפְשְׁטוּ אֶל
  choice: पर छापे मारते थे
  rationale: सैनिक प्रसंग में פשט लूटमार वाले धावे या छापे को सूचित करता है। बहुवचन कर्ता और इस अवधि में बार-बार की गई कार्रवाई को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: הַגְּשׁוּרִי
  choice: गशूरियों
  rationale: इसे जाति-समूह के नाम के रूप में हिन्दी बहुवचन में रखा गया है।
- source_word: הגרזי
  choice: गिरजियों
  rationale: प्रदत्त व्यंजन-पाठ גרזי के निकट लिप्यंतरण अपनाया गया है; नाम की पाठगत और पारंपरिक अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: הָעֲמָלֵקִי
  choice: अमालेकियों
  rationale: अमालेक से संबद्ध जाति-समूह के लिए प्रचलित हिन्दी रूप।
- source_word: כִּי הֵנָּה יֹשְׁבוֹת הָאָרֶץ
  choice: क्योंकि ... वे ही उस देश के निवासी थे
  rationale: स्त्रीलिंग बहुवचन सर्वनाम और कृदंत संभवतः पहले उल्लिखित जातियों को सामूहिक समूहों के रूप में संदर्भित करते हैं। ‘वे ही’ हिब्रू के स्पष्ट संकेतात्मक बल को व्यक्त करता है।
- source_word: מֵעוֹלָם
  choice: प्राचीन काल से
  rationale: यहाँ עוֹלָם का आशय अतीत की दीर्घ अवधि या पुरातन समय है, अनंतकाल नहीं।
- source_word: בּוֹאֲךָ שׁוּרָה
  choice: शूर की ओर जाते हुए
  rationale: द्वितीय पुरुष प्रत्यय वाला यह भौगोलिक मुहावरा सामान्य दिशा ‘जब कोई शूर की ओर जाए’ बताता है; हिन्दी में अनावश्यक प्रत्यक्ष ‘तुम’ से बचते हुए अर्थ रखा गया है।
- source_word: וְעַד אֶרֶץ מִצְרָיִם
  choice: मिस्र देश तक
  rationale: क्षेत्र की सीमा या विस्तार को सरल और सटीक हिन्दी में व्यक्त करता है।
