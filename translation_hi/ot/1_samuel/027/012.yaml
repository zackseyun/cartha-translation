base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/012.yaml
  text: And Achish trusted David[a], saying, “He has surely made himself stink among his people in Israel[b], so he will be my servant forever.”
translation:
  language: hi
  text: और आकीश ने दाऊद पर भरोसा किया और कहा, “उसने इस्राएल में अपने लोगों के बीच अपने को निश्चय ही घृणित बना लिया है,[a] इसलिए वह सदा के लिए मेरा सेवक रहेगा।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने इस्राएल में अपने लोगों के बीच अपने को निश्चय ही बदबूदार बना लिया है।” यह इब्रानी मुहावरा लोगों की दृष्टि में अत्यन्त घृणित हो जाने का अर्थ देता है।
    reason: lexical_alternative
  - marker: b
    text: “सेवक” का अनुवाद “दास” भी किया जा सकता है; यहाँ आशय आकीश के अधीन स्थायी सेवा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּאֲמֵן ... בְּדָוִד
  choice: दाऊद पर भरोसा किया
  rationale: אמן के हिफ़ील रूप के साथ ב किसी व्यक्ति पर विश्वास या भरोसा रखने को व्यक्त करता है; आधुनिक हिन्दी में ‘पर भरोसा किया’ स्वाभाविक और संबंधपरक अर्थ को स्पष्ट करता है।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: यह उद्धरण आरम्भ करने वाला सामान्य इब्रानी रूप है। प्रसंग में यह आकीश का कथन अथवा मन का निष्कर्ष हो सकता है, पर पाठ के ‘कहने’ वाले रूप को मुख्य अनुवाद में बनाए रखा गया है।
- source_word: הַבְאֵשׁ הִבְאִישׁ
  choice: अपने आपको निश्चय ही घृणा का पात्र बना लिया है
  rationale: धातु באש का मूल बिंब ‘दुर्गंधित होना/करना’ है और यहाँ वह लोगों की दृष्टि में घृणित हो जाने का मुहावरा है। infinitive absolute और finite verb की पुनरुक्ति का बल ‘निश्चय ही’ से व्यक्त किया गया है; मूल बिंब पादटिप्पणी में सुरक्षित है।
- source_word: בְּעַמּוֹ בְיִשְׂרָאֵל
  choice: अपने लोगों—इस्राएलियों—के बीच
  rationale: यह आकीश की दृष्टि में दाऊद के अपने ही लोगों के बीच सामाजिक रूप से घृणित हो जाने को व्यक्त करता है। ‘इस्राएलियों’ को व्याख्यात्मक समानाधिकरण के रूप में रखना हिन्दी में स्वाभाविक है और दोनों इब्रानी पदों को समेटता है।
- source_word: וְהָיָה לִי
  choice: इसलिए वह ... मेरा ... रहेगा
  rationale: वाव यहाँ आकीश के निष्कर्ष या अपेक्षित परिणाम को जोड़ता है; ‘इसलिए’ इस परिणामसूचक संबंध को हिन्दी में स्पष्ट करता है।
- source_word: לְעֶבֶד
  choice: सेवक
  rationale: עֶבֶד का अर्थ ‘सेवक’ या ‘दास’ दोनों हो सकता है। यहाँ आकीश दाऊद की स्थायी अधीनता और सेवा की अपेक्षा कर रहा है; ‘सेवक’ प्रसंगानुकूल है, जबकि दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घकालिक अथवा अनिश्चित भविष्य तक बने रहने की अपेक्षा व्यक्त करता है; आकीश के कथन में ‘सदा के लिए’ स्वाभाविक हिन्दी है।
theological_decisions:
- issue: दाऊद की स्थिति को स्वतंत्र कथाकार-वर्णन या आकीश की धारणा मानना
  choice: कथन को स्पष्ट रूप से आकीश के उद्धृत निष्कर्ष के भीतर रखा गया है
  alternative: इसे दाऊद की वास्तविक स्थिति के बारे में कथाकार का सीधा निर्णय समझना
  rationale: לֵאמֹר के बाद आने वाला पूरा कथन आकीश के भरोसे और उसके निष्कर्ष को प्रस्तुत करता है; अनुवाद इस दृष्टिकोण को बदले बिना रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज कथात्मक रूप अपनाया गया है। ‘घृणा का पात्र’ मूल मुहावरे का स्वाभाविक अर्थ देता है, जबकि ‘दुर्गंधित’ का ठोस इब्रानी बिंब पादटिप्पणी में रखा गया है।
