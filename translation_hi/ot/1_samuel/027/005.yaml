source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ אִם נָא֩ מָצָ֨אתִי חֵ֤ן בְּ/עֵינֶ֨י/ךָ֙ יִתְּנוּ לִ֣/י מָק֗וֹם בְּ/אַחַ֛ת עָרֵ֥י הַ/שָּׂדֶ֖ה וְ/אֵ֣שְׁבָה שָּׁ֑ם וְ/לָ֨/מָּה יֵשֵׁ֧ב עַבְדְּ/ךָ֛ בְּ/עִ֥יר הַ/מַּמְלָכָ֖ה עִמָּֽ/ךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/027/005.yaml
  text: Then David said to Achish[a], “If I have now found favor in your eyes, let them give me a place in one of the towns in the countryside, so that I may live there[c][b]. For why should your servant live with you in the royal city?”
translation:
  language: hi
  text: तब दाऊद ने आकीश से कहा, “यदि मुझ पर आपकी कृपादृष्टि हुई हो, तो मुझे देहात के नगरों में से किसी एक में जगह दी जाए, ताकि मैं वहाँ रहूँ। आपका सेवक आपके साथ राजनगर में क्यों रहे?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: मुझ पर आपकी कृपादृष्टि हुई हो
  rationale: यह आधुनिक हिंदी में स्वाभाविक आदरसूचक मुहावरा है और स्वीकृति/अनुग्रह पाने के इब्रानी भाव को व्यक्त करता है।
- source_word: נָא
  choice: विनम्र अनुरोध के भाव में निहित
  rationale: यह अव्यय अनुरोध को नम्र बनाता है; हिंदी में शर्तिया आदरसूचक वाक्य और कर्मवाच्य अनुरोध उसी विनम्रता को स्वाभाविक रूप से व्यक्त करते हैं, इसलिए अलग से ‘कृपया’ जोड़ना आवश्यक नहीं।
- source_word: יִתְּנוּ לִי מָקוֹם
  choice: मुझे ... जगह दी जाए
  rationale: इब्रानी का अनिश्चित बहुवचन आज्ञार्थक अनुरोध आकीश के अधीन लोगों द्वारा स्थान दिए जाने का संकेत देता है। हिंदी कर्मवाच्य इस अनिर्दिष्ट कर्ता और विनम्र अनुरोध को सहज रूप से रखता है।
- source_word: בְּאַחַת עָרֵי הַשָּׂדֶה
  choice: देहात के नगरों में से किसी एक में
  rationale: शाब्दिक ‘मैदान/प्रदेश के नगरों’ का आशय राजनगर के विपरीत ग्रामीण क्षेत्र के नगरों से है; ‘देहात के नगर’ स्पष्ट और सामान्य आधुनिक हिंदी है।
- source_word: וְאֵשְׁבָה שָּׁם
  choice: ताकि मैं वहाँ रहूँ
  rationale: ישב यहाँ निवास करने के अर्थ में है; ‘ताकि’ प्रसंग में अनुरोध के उद्देश्य को स्पष्ट करता है, जबकि साधारण समन्वयी अर्थ भी मूलतः बना रहता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: यह राजकीय वार्तालाप में दाऊद का विनम्र आत्म-संदर्भ है, न कि यहाँ दासत्व पर विशेष बल।
- source_word: בְּעִיר הַמַּמְלָכָה
  choice: राजनगर में
  rationale: शाब्दिक अर्थ ‘राज्य/राजसत्ता का नगर’ है। ‘राजनगर’ राजकीय निवास वाले नगर का भाव देता है और ‘राजधानी’ कहकर आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: עִמָּךְ
  choice: आपके साथ
  rationale: आकीश के प्रति आदरसूचक हिंदी रखते हुए निकट सह-निवास का सीधा अर्थ सुरक्षित है।
