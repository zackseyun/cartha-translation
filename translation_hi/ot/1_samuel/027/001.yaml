  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण शैली। आंतरिक वचन के लिए ‘अपने मन में कहा’ और शक्ति/पकड़ के मुहावरे के लिए ‘हाथ से’ रखा गया है। पद में कोई ऐसी पाठगत या धर्मवैचारिक अस्पष्टता नहीं मिली जिसके लिए प्रकाशन-पादटिप्पणी आवश्यक हो।
