base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/021.yaml
  text: Then the man Elkanah went up with all his household to sacrifice to Yahweh the yearly sacrifice and his vow[a].
translation:
  language: hi
  text: तब एल्काना अपने सारे घराने के साथ यहोवा को वार्षिक बलि चढ़ाने और अपनी मन्नत पूरी करने के लिए ऊपर गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: עלה का मूल अर्थ ‘ऊपर जाना’ है; शीलो के पवित्रस्थान की यात्रा के प्रसंग में यह तीर्थयात्रा और भौगोलिक दिशा, दोनों को सुरक्षित रखता है।
- source_word: הָאִישׁ אֶלְקָנָה
  choice: वह पुरुष, एल्काना
  rationale: אִישׁ का सीधा अर्थ ‘पुरुष’ है। ‘पति’ प्रसंगानुकूल हो सकता है, पर मूल पाठ से अधिक व्याख्यात्मक होगा।
- source_word: וְכָל־בֵּיתוֹ
  choice: अपने पूरे घराने के साथ
  rationale: בַּיִת यहाँ भवन नहीं, घराने के सदस्यों को दर्शाता है; ‘घराना’ इसका स्वाभाविक और सामूहिक अर्थ देता है।
- source_word: לִזְבֹּחַ לַיהוָה
  choice: यहोवा के लिए ... चढ़ाने
  rationale: זבח बलि चढ़ाने को सूचित करता है। हिंदी में ‘बलि ... चढ़ाने’ स्वाभाविक धार्मिक अभिव्यक्ति है; יהוה को उसके व्यक्तिवाचक वाचायी नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: זֶבַח הַיָּמִים
  choice: वार्षिक बलि
  rationale: शाब्दिक ‘दिनों की बलि’ प्रसंग में नियमित रूप से प्रति वर्ष चढ़ाई जाने वाली बलि का मुहावरा है; ‘वार्षिक बलि’ संक्षेप में वही अर्थ देता है।
- source_word: וְאֶת־נִדְרוֹ
  choice: और अपनी मन्नत की भेंट
  rationale: निश्चयवाचक कर्मचिह्न אֵת के साथ ‘उसकी मन्नत’ पूर्ववर्ती לִזְבֹּחַ पर आश्रित दूसरा कर्म है। ‘मन्नत की भेंट’ हिंदी में बलि चढ़ाने योग्य वस्तु का भाव व्यक्त करती है, जबकि पद की संक्षिप्तता और संभावित दीर्घवृत्तता पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक वाचा-नाम יהוה है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और सामान्य उपाधि ‘प्रभु’ के स्थान पर नाम को नाम के रूप में सुरक्षित रखता है; ‘याहवे’ अधिक संभावित प्राचीन उच्चारण को दर्शाता है।
- issue: נִדְרוֹ और לִזְבֹּחַ के बीच संबंध
  choice: मन्नत की भेंट चढ़ाना
  alternative: मन्नत पूरी करना
  rationale: हिब्रू में क्रिया को दूसरी बार स्पष्ट नहीं किया गया और את נדרו को समन्वित कर्म के रूप में रखा गया है। मुख्य पाठ में चढ़ाई जाने वाली मन्नत-संबंधी भेंट का भाव दिया गया है; अधिक व्यापक ‘मन्नत पूरी करना’ संभव अर्थ है, पर मूल की बलि-संबंधी रचना को कुछ हद तक स्पष्ट करके हल कर देता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘ऊपर गया’, ‘घराना’, ‘वार्षिक बलि’ और ‘मन्नत’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; विरामचिह्न द्वारा ‘एल्काना’ को ‘वह पुरुष’ के समानाधिकरण के रूप में स्पष्ट किया गया है।
