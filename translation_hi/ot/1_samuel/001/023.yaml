base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/023.yaml
  text: And Elqanah her husband said to her[a], “Do what seems good in your eyes. Stay until you have weaned him; only may Yahweh establish his word.” So the woman stayed and nursed her son until she had weaned him.
translation:
  language: hi
  text: 'तब उसके पति एलकाना ने उससे कहा, “जो तुम्हारी दृष्टि में अच्छा हो, वही करो। जब तक तुम उसका दूध न छुड़ा दो, रहो। बस यहोवा अपने वचन को पूरा करे।”[क]


    तब वह स्त्री रही और अपने बेटे को तब तक दूध पिलाती रही, जब तक उसका दूध न छुड़ा दिया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, ‘अपने वचन को स्थिर करे’ या ‘पुष्ट करे।’ ‘अपने वचन’ का अर्थ यहोवा की प्रतिज्ञा भी हो सकता है या संदर्भ में कही गई बात भी।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישָׁהּ
  choice: उसके पति
  rationale: संदर्भ में אִישׁ प्रत्यय सहित हन्ना के वैवाहिक संबंध को बताता है; आधुनिक हिन्दी में ‘उसके पति’ स्वाभाविक और सटीक है।
- source_word: עֲשִׂי הַטּוֹב בְּעֵינַיִךְ
  choice: जो तुम्हारी दृष्टि में अच्छा हो, वही करो
  rationale: यह इब्रानी मुहावरा व्यक्तिगत निर्णय या जिसे कोई उचित समझे, उसे व्यक्त करता है; हिन्दी में स्रोत की ‘दृष्टि’ वाली छवि भी बनी रहती है।
- source_word: שְׁבִי
  choice: यहीं रहो
  rationale: यहाँ क्रिया का अर्थ शारीरिक रूप से बैठना नहीं, बल्कि वर्तमान स्थान पर बने रहना है; ‘यहीं रहो’ संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד גָּמְלֵךְ אֹתוֹ / עַד גָּמְלָהּ אֹתוֹ
  choice: जब तक तुम उसका दूध न छुड़ा दो / जब तक उसने उसका दूध न छुड़ा दिया
  rationale: बाल-पालन के इस संदर्भ में גמל का स्पष्ट अर्थ बच्चे का दूध छुड़ाना है।
- source_word: אַךְ
  choice: केवल
  rationale: यह शब्द पिछली अनुमति के साथ एक योग्यता या सीमित करने वाला कथन जोड़ता है; ‘केवल’ उसके प्रवचनात्मक कार्य को बनाए रखता है।
- source_word: יָקֵם
  choice: पूरा करे
  rationale: हिफ़ील रूप यहाँ इच्छा या प्रार्थना का भाव रखता है। वचन के संबंध में ‘पूरा करे’ आधुनिक हिन्दी में स्वाभाविक है और उसे कार्यान्वित/स्थापित करने का भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय निजी नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: דְּבָרוֹ
  choice: अपने वचन को
  rationale: דבר का अर्थ वचन, बात या प्रतिज्ञा हो सकता है। ‘अपने वचन को’ यहोवा की ओर संकेत स्पष्ट रखता है, पर यह तय नहीं करता कि संदर्भ किसी प्रतिज्ञा का है या अभी कही गई बात का।
- source_word: וַתֵּינֶק
  choice: दूध पिलाती रही
  rationale: क्रिया बच्चे को स्तनपान कराने को दर्शाती है; ‘दूध पिलाती रही’ सामान्य, स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: הָאִשָּׁה
  choice: वह स्त्री
  rationale: इब्रानी पाठ यहाँ हन्ना का नाम नहीं, निश्चित लेख सहित सामान्य संज्ञा प्रयोग करता है; ‘वह स्त्री’ स्रोत के रूप को बनाए रखता है।
theological_decisions:
- issue: एलकाना के कथन में ‘अपने वचन’ का संदर्भ
  choice: ‘अपने वचन’ रखा गया, बिना यह निश्चित किए कि वह यहोवा की प्रतिज्ञा है या संदर्भ में अभी कही गई बात।
  alternative: ‘अपनी प्रतिज्ञा’ अथवा ‘बालक के विषय का वचन’
  rationale: इब्रानी דְּבָרוֹ शाब्दिक रूप से ‘उसका/अपने वचन’ है और संदर्भ कुछ अस्पष्ट है। अनुवाद व्याख्यात्मक रूप से इस तनाव को हल नहीं करता।
- issue: יָקֵם का भाव
  choice: इच्छा/प्रार्थना के रूप में ‘पूरा करे’
  alternative: ‘स्थिर करे’ या ‘सिद्ध करे’
  rationale: क्रिया का रूप एलकाना की कामना व्यक्त कर सकता है। ‘पूरा करे’ हिन्दी में वचन के साथ स्वाभाविक है, जबकि वैकल्पिक अर्थ टिप्पणी में संकेतित हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘तुम’ पति-पत्नी के निकट संबोधन और स्त्रीलिंग क्रियारूप के अनुकूल है। स्रोत की पुनरावृत्ति और ‘वह स्त्री’ को यथासंभव बनाए रखा गया है।
