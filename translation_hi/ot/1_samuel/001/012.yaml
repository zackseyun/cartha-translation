source:
  edition: WLC
  text: וְ/הָיָה֙ כִּ֣י הִרְבְּתָ֔ה לְ/הִתְפַּלֵּ֖ל לִ/פְנֵ֣י יְהוָ֑ה וְ/עֵלִ֖י שֹׁמֵ֥ר אֶת פִּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/012.yaml
  text: And as she continued praying before Yahweh[a], Eli was watching her mouth.
translation:
  language: hi
  text: जब वह यहोवा के सामने बहुत देर तक प्रार्थना करती रही, तब एली उसके मुँह को ध्यान से देख रहा था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: जब...तब
  rationale: इब्रानी कथात्मक सूत्र यहाँ अगली क्रिया की परिस्थिति और समय बताता है। हिन्दी में ‘जब...तब’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: הִרְבְּתָה לְהִתְפַּלֵּל
  choice: बहुत देर तक प्रार्थना करती रही
  rationale: רבה का हिफ़ील रूप और उसके बाद प्रार्थना का क्रियारूप मिलकर प्रार्थना के लंबे समय तक जारी रहने का भाव देते हैं।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह वाक्यांश यहोवा की उपस्थिति में की गई प्रार्थना को व्यक्त करता है; ‘के सामने’ हिन्दी में मूल बिंब को सहज रूप से बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम है; हिन्दी में प्रचलित प्रत्यक्ष लिप्यंतरण ‘यहोवा’ इसे सामान्य उपाधि में बदलने से बचाता है।
- source_word: שֹׁמֵר
  choice: ध्यान से देख रहा था
  rationale: कालवाचक कृदंत लगातार निरीक्षण का भाव देता है। प्रसंग में एली हन्ना के मुँह की गतिविधि पर ध्यान लगाए हुए था।
- source_word: אֶת־פִּיהָ
  choice: उसके मुँह को
  rationale: मूल संज्ञा का सीधा अर्थ ‘मुँह’ है। अगले पद में होंठों का अलग उल्लेख होने के कारण यहाँ ‘मुँह’ रखना पाठगत भेद को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चार अक्षरों वाला विशिष्ट ईश्वरीय नाम सीधे प्रयुक्त है। ‘यहोवा’ उसे नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि के रूप में प्रस्तुत करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘बहुत देर तक...करती रही’ प्रार्थना की दीर्घता और निरंतरता दोनों व्यक्त करता है; ‘ध्यान से’ एली के जारी निरीक्षण को स्वाभाविक हिन्दी में स्पष्ट करता है।
