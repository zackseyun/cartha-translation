  yaml_path: translation/ot/1_samuel/001/018.yaml
  text: She said[a], “May your servant find favor in your eyes.” Then the woman went on her way and ate[b], and her face was no longer downcast.
translation:
  language: hi
  text: उसने कहा,[a] “आपकी दासी आपकी दृष्टि में अनुग्रह पाए।” तब वह स्त्री अपने रास्ते चली गई और उसने भोजन किया। उसके चेहरे पर पहले जैसी उदासी नहीं रही।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “आपकी दासी आपकी दृष्टि में अनुग्रह पाए।”'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “उसका चेहरा फिर उसके लिए नहीं था।” यह एक मुहावरेदार अभिव्यक्ति है, जिसका आशय है कि उसके चेहरे पर अब पहले जैसा शोक दिखाई नहीं देता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּמְצָא
  choice: बनी रहे
  rationale: यह रूप विनम्र इच्छा या अनुरोध व्यक्त करता है। हिंदी में ‘कृपादृष्टि बनी रहे’ आदरसूचक संबोधन में स्वाभाविक ढंग से यही भाव प्रकट करता है।
- source_word: שִׁפְחָתְךָ
  choice: आपकी दासी
  rationale: शब्द स्त्रीलिंग सेविका या दासी को सूचित करता है और यहाँ हन्ना द्वारा एली के सामने विनम्र आत्म-संबोधन है। ‘आपकी दासी’ लिंग और आदर, दोनों को सुरक्षित रखता है।
- source_word: חֵן בְּעֵינֶיךָ
  choice: आपकी कृपादृष्टि
  rationale: इब्रानी मुहावरे का अर्थ किसी की अनुकूल दृष्टि या कृपा पाना है। ‘कृपादृष्टि’ मूल की दृष्टि-संबंधी छवि को संक्षिप्त और स्वाभाविक हिंदी में बनाए रखता है।
- source_word: לְדַרְכָּהּ
  choice: अपने रास्ते चली गई
  rationale: यह प्रस्थान करके अपने मार्ग पर आगे जाने का मुहावरा है। यह हिंदी अभिव्यक्ति अर्थ को सहजता से व्यक्त करती है।
- source_word: וַתֹּאכַל
  choice: उसने भोजन किया
  rationale: साधारण कथात्मक क्रिया अगले कार्य को बताती है। ‘भोजन किया’ आधुनिक गरिमापूर्ण हिंदी में स्वाभाविक है और उसके सामान्य अवस्था में लौटने को संदर्भानुसार दर्शाता है।
- source_word: וּפָנֶיהָ לֹא הָיוּ לָהּ עוֹד
  choice: फिर उसका चेहरा पहले जैसा उदास नहीं रहा
  rationale: मूल वाक्यांश संक्षिप्त और कुछ हद तक अपूर्ण मुहावरेदार अभिव्यक्ति है—शाब्दिक रूप से उसका चेहरा अब उसके लिए वैसा नहीं था। संदर्भ में यह उसके शोकपूर्ण भाव के बदलने को बताता है; ‘पहले जैसा उदास नहीं रहा’ अर्थ स्पष्ट करता है, जबकि पादटिप्पणी मूल की अस्पष्टता दर्ज करती है।
