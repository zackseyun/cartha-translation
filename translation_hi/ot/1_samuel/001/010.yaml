    reason: lexical_alternative
lexical_decisions:
- source_word: מָרַת נָפֶשׁ
  choice: मन से बहुत व्याकुल
  rationale: शाब्दिक अर्थ ‘प्राण/मन में कड़वी’ है। यहाँ यह इब्रानी मुहावरा गहरी भीतरी पीड़ा और व्याकुलता व्यक्त करता है; स्वाभाविक आधुनिक हिन्दी में अर्थ स्पष्ट रखते हुए रूपक की जानकारी पादटिप्पणी में दी गई है।
- source_word: וַתִּתְפַּלֵּל
  choice: उसने ... प्रार्थना की
  rationale: हित्पएल रूप यहाँ सीधे प्रार्थना करने का अर्थ देता है; उसकी तीव्रता आसपास के वर्णन से स्पष्ट है, इसलिए क्रिया में ‘मन लगाकर’ जैसा अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: עַל יְהוָה
  choice: यहोवा से
  rationale: प्रार्थना के साथ עַל यहाँ प्रार्थना को यहोवा की ओर निर्देशित करने का भाव देता है। हिन्दी में ‘यहोवा से प्रार्थना की’ स्वाभाविक और स्पष्ट है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וּבָכֹה תִבְכֶּה
  choice: फूट-फूटकर रोती रही
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया की पुनरुक्त रचना रोने की तीव्रता और प्रवाह पर बल देती है। यह हिन्दी अभिव्यक्ति उस बल को स्वाभाविक ढंग से व्यक्त करती है, जबकि ‘रोती रही’ संभावित निरंतरता को भी बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है। हिन्दी पाठकों के लिए स्थापित और सुबोध रूप ‘यहोवा’ चुना गया; उच्चारण का ठीक प्राचीन रूप निश्चित न होने के कारण ‘याहवे’ भी संभव है।
- issue: חנה की व्यथा का स्वरूप
  choice: मन से बहुत व्याकुल
  alternative: मन में कड़वाहट से भरी
  rationale: मुहावरे को किसी नैतिक कटुता या परमेश्वर के प्रति रोष के रूप में निश्चित नहीं किया गया; संदर्भानुसार इसे गहरी अंतःपीड़ा के रूप में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक रूप से सहज शैली। ‘मन से बहुत व्याकुल’ मुहावरे का अर्थ स्पष्ट करता है, और पादटिप्पणी मूल की रूपकात्मक अभिव्यक्ति सुरक्षित रखती है।
