- source_word: תִּשְׁתַּכָּרִין
  choice: नशे में रहोगी
  rationale: हित्पएल अपूर्ण क्रिया यहाँ नशे में होने अथवा नशे की अवस्था में आते रहने का आरोप व्यक्त कर सकती है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और अर्थगत विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: הָסִירִי
  choice: दूर कर दो
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप किसी वस्तु को अपने से हटाने की आज्ञा देता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֶת יֵינֵךְ
  choice: अपनी दाखमधु
  rationale: יֵין का अर्थ अंगूरी मदिरा है। ‘दाखमधु’ गरिमापूर्ण और बाइबलीय संदर्भ में स्पष्ट है तथा स्त्रीलिंग प्रत्यय को ‘अपनी’ व्यक्त करता है।
- source_word: מֵעָלָיִךְ
  choice: अपने से
  rationale: शाब्दिक चित्र ‘अपने ऊपर से’ है; मुख्य पाठ में अर्थ को स्वाभाविक हिन्दी में दिया गया है और मूल बिंब पादटिप्पणी में रखा गया है।
