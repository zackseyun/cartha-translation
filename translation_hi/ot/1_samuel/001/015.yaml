  yaml_path: translation/ot/1_samuel/001/015.yaml
  text: But Hannah answered and said[a], “No, my lord. I am a woman troubled in spirit. I have drunk neither wine nor strong drink[b], but I have poured out my soul before Yahweh.”
translation:
  language: hi
  text: परन्तु हन्ना ने उत्तर दिया, “नहीं, मेरे स्वामी! मैं ऐसी स्त्री हूँ जिसका मन बहुत व्यथित है।[a] मैंने न दाखमधु पिया है, न कोई मादक पेय; बल्कि मैंने याहवे के सामने अपना प्राण उंडेल दिया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं दुःखी मन वाली स्त्री हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעַן חַנָּה וַתֹּאמֶר
  choice: परन्तु हन्ना ने उत्तर दिया
  rationale: हिब्रू के युग्मित कथन-सूत्र का स्वाभाविक हिन्दी रूप रखा गया है; प्रसंग में एली के आरोप का प्रतिवाद होने के कारण ‘परन्तु’ उचित है।
- source_word: לֹא אֲדֹנִי
  choice: नहीं, मेरे प्रभु
  rationale: यह एली के लिए आदरसूचक संबोधन है, परमेश्वर की उपाधि नहीं। ‘मेरे प्रभु’ एकवचन संबंध और सामाजिक आदर दोनों को बनाए रखता है।
- source_word: אִשָּׁה קְשַׁת רוּחַ
  choice: मैं मन से व्यथित स्त्री हूँ
  rationale: यह पदबंध हठीले स्वभाव के बजाय भीतरी दुःख और मानसिक क्लेश को व्यक्त करता है। ‘मन से व्यथित’ आधुनिक हिन्दी में सहज है और רוּחַ के आंतरिक जीवन संबंधी भाव को सुरक्षित रखता है।
- source_word: וְיַיִן וְשֵׁכָר לֹא שָׁתִיתִי
  choice: मैंने न दाखमधु पिया है, न कोई नशीला पेय
  rationale: שֵׁכָר दाखमधु से अलग किसी मादक पेय का व्यापक संकेत है; ‘नशीला पेय’ प्राचीन पेय का प्रकार अनावश्यक रूप से निश्चित किए बिना भेद स्पष्ट करता है।
- source_word: וָאֶשְׁפֹּךְ אֶת נַפְשִׁי
  choice: मैंने अपना प्राण उंडेल दिया है
  rationale: ‘प्राण उंडेलना’ נֶפֶשׁ और क्रिया के सशक्त रूपक को बनाए रखता है तथा गहन प्रार्थनापूर्ण आत्म-अभिव्यक्ति बताता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי को ‘के सामने’ और יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिवाचक ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसे सामान्य उपाधि में बदलने के बजाय नाम के रूप में बनाए रखता है।
- issue: נֶפֶשׁ के रूपक का निर्वाह
  choice: अपना प्राण उंडेल दिया
  alternative: अपने मन की बात कह दी
  rationale: अधिक व्याख्यात्मक विकल्प केवल बोलने का अर्थ दे सकता है; चुना गया रूप हन्ना की संपूर्ण आंतरिक सत्ता को परमेश्वर के सामने उंडेलने की तीव्रता और धर्मवैचारिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘दाखमधु’, ‘याहवे’ और ‘प्राण उंडेलना’ मूल के सांस्कृतिक तथा रूपकात्मक रंग को बनाए रखते हैं। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री का मेल नहीं था; हिन्दी मसौदे में वैकल्पिक अर्थ का चिह्न संबंधित पदबंध के बाद रखा गया है।
