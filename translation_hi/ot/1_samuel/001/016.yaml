base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/016.yaml
  text: Do not regard your servant as a worthless woman[b][a], for out of the abundance of my complaint and my vexation I have spoken until now.
translation:
  language: hi
  text: अपनी दासी को दुष्ट स्त्री[a] न समझिए, क्योंकि मैं अपनी अत्यधिक व्यथा और खीझ के कारण अब तक बोलती रही हूँ।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “निकम्मेपन की बेटी”; यह नैतिक रूप से दुष्ट, नीच या बदनाम स्त्री के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं अपनी बड़ी व्यथा और खीझ में अब तक बोलती रही हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּתֵּן ... לִפְנֵי
  choice: न समझिए
  rationale: इस मुहावरे में נתן और לִפְנֵי का संयुक्त अर्थ किसी को किसी रूप में मानना या समझना है; स्थानवाचक शाब्दिक अनुवाद यहाँ भ्रामक होगा।
- source_word: אֲמָתְךָ
  choice: अपनी दासी को
  rationale: हन्ना का विनम्र आत्म-संबोधन और शब्द का स्त्रीलिंग दोनों स्पष्ट रूप से बने रहते हैं।
- source_word: בַּת בְּלִיָּעַל
  choice: निकम्मी स्त्री
  rationale: शाब्दिक रूप 'निकम्मेपन की बेटी' एक इब्रानी मुहावरा है, जो नैतिक रूप से नीच या बदनाम स्त्री को सूचित करता है। 'निकम्मी स्त्री' उसकी तीखी निंदात्मक शक्ति को सहज हिन्दी में रखता है।
- source_word: מֵרֹב שִׂיחִי
  choice: अपनी बहुत-सी व्यथा के कारण
  rationale: שִׂיחִי संदर्भ में व्यथित मन की शिकायत या दुखभरी अभिव्यक्ति है; מֵרֹב उसकी अधिकता और कारण दोनों सूचित करता है।
- source_word: וְכַעְסִי
  choice: और खीझ
  rationale: כעס यहाँ भीतर की झुंझलाहट, संताप या क्षोभ को दर्शाता है। 'खीझ' इसे किसी दूसरे को उकसाने के अर्थ से अलग रखती है, यद्यपि शब्द के भाव-क्षेत्र में संताप भी है।
- source_word: דִּבַּרְתִּי עַד הֵנָּה
  choice: अब तक बोलती रही हूँ
  rationale: यह रूप वर्तमान क्षण तक चली आ रही क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है; हन्ना अपनी प्रार्थना में बोलने की व्याख्या कर रही है।
