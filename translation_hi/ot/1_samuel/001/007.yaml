  text: וְ/כֵ֨ן יַעֲשֶׂ֜ה שָׁנָ֣ה בְ/שָׁנָ֗ה מִ/דֵּ֤י עֲלֹתָ/הּ֙ בְּ/בֵ֣ית יְהוָ֔ה כֵּ֖ן תַּכְעִסֶ֑/נָּה וַ/תִּבְכֶּ֖ה וְ/לֹ֥א תֹאכַֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/007.yaml
  text: 'And so it happened year after year: whenever she went up to the house of Yahweh[a], Peninnah would provoke her[b], and she would weep and not eat.'
translation:
  language: hi
  text: 'और ऐसा हर साल होता था: जब-जब वह यहोवा के भवन जाती, तब पनिन्ना उसे चिढ़ाती थी; और वह रोती और खाना नहीं खाती थी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और वह हर साल ऐसा ही करता था।” इब्रानी क्रिया शाब्दिक रूप से पुल्लिंग एकवचन है और उसका संकेत एल्काना की ओर हो सकता है; लेकिन यह हर साल दोहराने वाली पूरी स्थिति का सार भी हो सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְכֵן יַעֲשֶׂה
  choice: और ऐसा ... होता था
  rationale: יַעֲשֶׂה व्याकरण की दृष्टि से पुल्लिंग एकवचन है—शाब्दिक रूप से ‘वह ऐसा करता था’—पर प्रसंग में यह हर साल दोहराने वाली स्थिति का सार भी व्यक्त कर सकता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘ऐसा होता था’ रखी गई है और वैकल्पिक कर्ता पादटिप्पणी में दिया गया है।
- source_word: שָׁנָה בְשָׁנָה
  choice: हर साल
  rationale: यह वितरणात्मक पद वार्षिक पुनरावृत्ति बताता है; ‘हर साल’ सहज आधुनिक हिन्दी में उसी भाव को स्पष्ट करता है।
- source_word: מִדֵּי עֲלֹתָהּ
  choice: जब-जब वह ... जाती
  rationale: מִדֵּי और स्त्रीलिंग प्रत्यययुक्त क्रिया-संज्ञा बार-बार आने वाले अवसर, ‘जब कभी/जब-जब वह चढ़कर जाती,’ को सूचित करते हैं और हन्ना की ओर संकेत करते हैं।
- source_word: בְּבֵית יְהוָה
  choice: यहोवा के भवन को
  rationale: בְ का मूल अर्थ ‘में/पर’ है, लेकिन ‘चढ़कर जाना’ के साथ यहाँ गंतव्य का भाव है। हिन्दी में ‘भवन को जाती’ इस गत्यर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ द्वारा परमेश्वर का व्यक्तिगत वाचा-नाम सीधे रखा गया है, न कि उपाधि से बदला गया है।
- source_word: תַּכְעִסֶנָּה
  choice: उसे चिढ़ाती थी
  rationale: כעס के हिफ़ील रूप में जानबूझकर खिझाने, सताने या उत्तेजित करने का भाव है। ‘चिढ़ाती थी’ संबंधगत विरोध और उसके भावनात्मक परिणाम दोनों को सामान्य हिन्दी में व्यक्त करता है।
- source_word: וַתִּבְכֶּה וְלֹא תֹאכַל
  choice: और वह रोती और खाना नहीं खाती थी
  rationale: यद्यपि पहले क्रियारूप का रूपात्मक ढाँचा कथात्मक है, पूरे वाक्य का पुनरावृत्त प्रसंग आदतन परिणाम बताता है; इसलिए हिन्दी में अपूर्ण भूतकाल रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। हिन्दी पाठकों के लिए प्रतिष्ठित और पहचानने योग्य लिप्यंतरण ‘यहोवा’ चुना गया है; ‘याहवे’ अधिक पुनर्निर्मित उच्चारण वाला विकल्प है।
- issue: יַעֲשֶׂה का निहित कर्ता
  choice: स्थिति-सूचक ‘ऐसा होता था’
  alternative: 'एल्काना कर्ता: ‘वह ऐसा करता था’'
  rationale: पुल्लिंग एकवचन रूप एल्काना को कर्ता मानने की अनुमति देता है, पर वाक्यांश पूरी वार्षिक परिस्थिति का मुहावरेदार सार भी हो सकता है। अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आदतन भूतकाल के लिए ‘होता था/जाती/चिढ़ाती/रोती/खाती थी’ का प्रयोग किया गया है। केवल वास्तविक पाठगत अस्पष्टता पर पादटिप्पणी दी गई है।
