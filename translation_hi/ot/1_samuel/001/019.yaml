base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/019.yaml
  text: They rose early in the morning and bowed down before Yahweh[a]. Then they returned and came to their house at Ramah, and Elkanah knew Hannah his wife[b], and Yahweh remembered her.
translation:
  language: hi
  text: वे सुबह तड़के उठे और याहवे के सामने दण्डवत् प्रणाम किया। फिर वे लौटकर रामा में अपने घर आए। एल्काना ने अपनी पत्नी हन्ना से दाम्पत्य सम्बन्ध बनाए[a], और याहवे ने उसे याद किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘जानना’ है; यह वैवाहिक यौन सम्बन्ध के लिए प्रयुक्त शिष्टोक्ति है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘याद करना’ प्रायः केवल मन में स्मरण करने से बढ़कर है; इसका अर्थ किसी की ओर विश्वासयोग्य और प्रभावकारी रीति से ध्यान देना भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ בַבֹּקֶר
  choice: वे सुबह तड़के उठे
  rationale: हिफ़िल क्रिया שׁכם और בַבֹּקֶר मिलकर बहुत सुबह उठने का भाव देते हैं; ‘सुबह तड़के’ आधुनिक हिन्दी में स्वाभाविक रूप से समय का बल बनाए रखता है।
- source_word: וַיִּשְׁתַּחֲווּ לִפְנֵי יְהוָה
  choice: याहवे के सामने दण्डवत् किया
  rationale: השתחוה झुकने अथवा भूमि तक प्रणाम करने की ठोस शारीरिक क्रिया बताता है। ‘दण्डवत् किया’ उपासना के संदर्भ में उस क्रिया को ‘आराधना की’ की अपेक्षा अधिक स्पष्टता से सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ रूप में लिप्यंतरित किया गया है।
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ אֶל־בֵּיתָם הָרָמָתָה
  choice: फिर वे लौटकर रामा में अपने घर आए
  rationale: שׁוב लौटने और בוא पहुँचने की क्रमिक गति व्यक्त करते हैं। दिशासूचक הָרָמָתָה का आशय रामा की ओर/रामा में उनके घर पहुँचने से है; हिन्दी में यह क्रम स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וַיֵּדַע אֶלְקָנָה אֶת־חַנָּה אִשְׁתּוֹ
  choice: एल्काना ने अपनी पत्नी हन्ना से दाम्पत्य सम्बन्ध बनाए
  rationale: ידע का मूल अर्थ ‘जानना’ है, पर यहाँ यह वैवाहिक यौन सम्बन्ध का प्रचलित शिष्टोक्ति-प्रयोग है। हिन्दी में केवल ‘जाना’ अर्थ संप्रेषित नहीं करेगा, इसलिए मर्यादित और स्पष्ट ‘दाम्पत्य सम्बन्ध बनाए’ चुना गया तथा मूल शिष्टोक्ति पादटिप्पणी में बताई गई है।
- source_word: וַיִּזְכְּרֶהָ יְהוָה
  choice: याहवे ने उसे याद किया
  rationale: זכר का सीधा अर्थ ‘याद करना’ है। यह इब्रानी कथा में प्रायः प्रभावकारी अनुग्रहपूर्ण ध्यान का संकेत देता है, पर इस पद में परिणाम को पहले से स्पष्ट नहीं किया गया; इसलिए मूल रूपक को सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: ידע की वैवाहिक शिष्टोक्ति
  choice: मुख्य पाठ में ‘दाम्पत्य सम्बन्ध बनाए’, साथ में मूल शाब्दिक प्रयोग की पादटिप्पणी
  alternative: ‘जाना’ को मुख्य पाठ में ज्यों का त्यों रखना
  rationale: हिन्दी में ‘अपनी पत्नी को जाना’ इस अर्थ की स्थापित और सहज शिष्टोक्ति नहीं है। चुना हुआ रूप मूल की मर्यादा बनाए रखते हुए सामान्य पाठक को अर्थ स्पष्ट करता है।
- issue: ‘याहवे ने उसे याद किया’ का आशय
  choice: ‘याद किया’ को बनाए रखना
  alternative: ‘उसकी सुधि ली’ / ‘उसकी प्रार्थना पूरी की’
  rationale: यहाँ दिव्य स्मरण केवल मानसिक पुनःस्मृति से अधिक, प्रभावकारी ध्यान का संकेत दे सकता है; फिर भी ‘प्रार्थना पूरी की’ आगामी परिणाम को इस पद में आयात कर देगा। मूल की अर्थ-गहनता और कथात्मक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘दण्डवत्’, ‘दाम्पत्य सम्बन्ध’ और ‘याद किया’ क्रमशः शारीरिक उपासना, मर्यादित वैवाहिक निकटता और इब्रानी दिव्य-स्मरण की अर्थ-गहनता को व्यक्त करते हैं।
