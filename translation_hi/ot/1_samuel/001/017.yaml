base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/017.yaml
  text: Then Eli answered and said[a], “Go in peace, and may the God of Israel grant your petition that you have asked from him.”
translation:
  language: hi
  text: तब एली ने उत्तर दिया, “कुशल से जाओ। इस्राएल का परमेश्वर तुम्हारी वह याचना[a] पूरी करे, जो तुमने उससे की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी माँग।” इब्रानी शब्द प्रार्थना में माँगी गई बात को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर दिया
  rationale: दोनों क्रियाएँ मिलकर संवाद में उत्तर देने का सामान्य इब्रानी सूत्र बनाती हैं। हिंदी में ‘उत्तर दिया’ स्वाभाविक है और अनावश्यक दोहराव से बचता है।
- source_word: לְכִי לְשָׁלוֹם
  choice: कुशल से जाओ
  rationale: यह विदाई के समय भलाई और सकुशलता की कामना करने वाला मुहावरा है। ‘कुशल से जाओ’ आधुनिक हिंदी में इसके आशय को सहजता से व्यक्त करता है।
- source_word: וֵאלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: यह संबंधवाचक पदबंध इस्राएल के परमेश्वर को नामित करता है; हिंदी में एकवचन संबंध के लिए ‘का’ स्वाभाविक है।
- source_word: יִתֵּן
  choice: पूरी करे
  rationale: मूल अर्थ ‘दे’ है, पर याचना के साथ हिंदी में ‘याचना पूरी करे’ वरदान या शुभकामना की भाववाचक शक्ति को अधिक स्वाभाविक ढंग से प्रकट करता है।
- source_word: שֵׁלָתֵךְ
  choice: तुम्हारी वह याचना
  rationale: यहाँ संज्ञा प्रार्थना में माँगी गई बात को दर्शाती है। ‘याचना’ प्रसंग की गंभीरता और प्रार्थनात्मक भाव बनाए रखती है।
- source_word: אֲשֶׁר שָׁאַלְתְּ מֵעִמּוֹ
  choice: जो तुमने उससे की है
  rationale: संबंधवाचक उपवाक्य याचना को स्पष्ट करता है। ‘उससे’ मूल के सर्वनाम को बनाए रखता है और संदर्भ में उसका संकेत परमेश्वर की ओर है।
theological_decisions:
- issue: מֵעִמּוֹ में सर्वनाम का संदर्भ
  choice: ‘उससे’—संदर्भतः परमेश्वर
  alternative: सर्वनाम को एली की ओर संकेत करने वाला समझना
  rationale: पिछले संदर्भ में हन्ना ने यहोवा के सामने अपना मन उंडेलने की बात कही है और इसी वाक्य का कर्ता ‘इस्राएल का परमेश्वर’ है। फिर भी मूल की सर्वनामात्मक अभिव्यक्ति बनाए रखने के लिए नाम दोबारा नहीं जोड़ा गया।
- issue: יִתֵּן का भाव
  choice: कामनासूचक—‘पूरी करे’
  alternative: निश्चयात्मक—‘पूरी करेगा’
  rationale: एली के कथन का रूप आशीर्वचन या शुभकामना के रूप में पढ़ना प्रसंग और इब्रानी प्रयोग के अनुकूल है; इसे निश्चित भविष्यवाणी के रूप में अधिक प्रबल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। स्त्रीलिंग एकवचन आज्ञार्थक रूप का हिंदी में अलग बाहरी चिह्न नहीं है, पर प्रसंग से संबोधन हन्ना के प्रति स्पष्ट है।
