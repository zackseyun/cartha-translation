source:
  edition: WLC
  text: וְ/עָלָה֩ הָ/אִ֨ישׁ הַ/ה֤וּא מֵֽ/עִיר/וֹ֙ מִ/יָּמִ֣ים יָמִ֔ימָ/ה לְ/הִֽשְׁתַּחֲוֺ֧ת וְ/לִ/זְבֹּ֛חַ לַ/יהוָ֥ה צְבָא֖וֹת בְּ/שִׁלֹ֑ה וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י חָפְנִי֙ וּ/פִ֣נְחָ֔ס כֹּהֲנִ֖ים לַ/יהוָֽה׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/003.yaml
  text: That man used to go up from his city year after year to worship and to sacrifice to Yahweh of Armies at Shiloh. And the two sons of Eli[a], Hophni and Phinehas, were there as priests of Yahweh.
translation:
  language: hi
  text: वह व्यक्ति अपने नगर से प्रति वर्ष शीलो जाता था, सेनाओं के यहोवा[a] की आराधना करने और बलिदान चढ़ाने के लिए। वहाँ एली के दोनों पुत्र, होप्नी और पीनहास, यहोवा के याजक थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: परम्परागत रूप से, “सेनाओं का प्रभु।”
    reason: यְהוָה צְבָאוֹת उपाधि के पारम्परिक हिन्दी विकल्प को दर्शाने के लिए।
lexical_decisions:
- source_word: וְעָלָה
  choice: जाता था
  rationale: इस आख्यान-संदर्भ में यह रूप बीते समय की नियमित क्रिया बताता है; ‘जाता था’ स्वाभाविक हिन्दी में उस आदतन तीर्थयात्रा को व्यक्त करता है।
- source_word: הָאִישׁ הַהוּא
  choice: वह पुरुष
  rationale: संकेतवाचक पद पहले परिचित कराए गए एलकाना की ओर स्पष्ट रूप से लौटता है; ‘वह पुरुष’ उसकी विशिष्टता बनाए रखता है।
- source_word: מֵעִירוֹ
  choice: अपने नगर से
  rationale: עִיר का सीधा अर्थ नगर/नगर-बस्ती है; ‘अपने नगर से’ सम्बन्धवाचक प्रत्यय को सहज हिन्दी में व्यक्त करता है।
- source_word: מִיָּמִים יָמִימָה
  choice: प्रति वर्ष
  rationale: यह मुहावरा वर्ष-दर-वर्ष नियमित पुनरावृत्ति दर्शाता है; ‘प्रति वर्ष’ संक्षिप्त और स्वाभाविक हिन्दी है।
- source_word: לְהִשְׁתַּחֲוֺת
  choice: दण्डवत् करे
  rationale: मूल क्रिया झुकने अथवा भूमि पर गिरकर प्रणाम करने की शारीरिक क्रिया बताती है। उपासना-संदर्भ स्पष्ट रहते हुए ‘दण्डवत् करे’ इस ठोस अर्थ को सुरक्षित रखता है।
- source_word: וְלִזְבֹּחַ
  choice: बलिदान चढ़ाए
  rationale: यह क्रिया उपासना में बलि अर्पित करने को दर्शाती है; हिन्दी बाइबलीय प्रयोग में ‘बलिदान चढ़ाना’ स्पष्ट और स्वाभाविक है।
- source_word: לַיהוָה צְבָאוֹת
  choice: सेनाओं के यहोवा
  rationale: यְהוָה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से और צְבָאוֹת को पारदर्शी रूप से ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: בְּשִׁלֹה
  choice: शीलो
  rationale: गंतव्य-सूचक हिन्दी क्रिया ‘जाता था’ के साथ स्थाननाम बिना परसर्ग के स्वाभाविक रूप से आता है।
- source_word: וְשָׁם
  choice: वहाँ
  rationale: स्थानवाचक अव्यय को सीधे और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שְׁנֵי בְנֵי עֵלִי
  choice: एली के दोनों पुत्र
  rationale: यह हिन्दी में स्वाभाविक सम्बन्ध-रचना है और पुत्रों की निश्चित जोड़ी पर मूल का बल बनाए रखती है।
- source_word: חָפְנִי וּפִנְחָס
  choice: होप्नी और पीनहास
  rationale: नामों का देवनागरी लिप्यंतरण प्रचलित हिन्दी बाइबल रूपों और हिब्रू उच्चारण के निकट रखा गया है।
- source_word: כֹּהֲנִים לַיהוָה
  choice: यहोवा के याजक
  rationale: לַיהוָה यहाँ सेवा/सम्बन्ध सूचित करता है; ‘यहोवा के याजक’ संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम है। ‘यहोवा’ हिन्दी पाठक के लिए स्थापित रूप है और नाम को सामान्य उपाधि में परिवर्तित नहीं करता।
- issue: יְהוָה צְבָאוֹת उपाधि का अनुवाद
  choice: सेनाओं के यहोवा
  alternative: सेनाओं का प्रभु / सर्वशक्तिमान यहोवा
  rationale: ‘सेनाओं’ से צְבָאוֹת का मूल बहुवचन और सैन्य/स्वर्गीय दलों से जुड़ी वास्तविक अर्थ-छवि बचती है; ‘सर्वशक्तिमान’ अर्थपरक व्याख्या है, सीधा शब्दार्थ नहीं।
- issue: לְהִשְׁתַּחֲוֺת में बाहरी क्रिया और उपासना का सम्बन्ध
  choice: दण्डवत् करे
  alternative: आराधना करे
  rationale: संदर्भ निस्संदेह आराधना का है, पर मूल क्रिया का झुकने/भूमि पर गिरने वाला ठोस अर्थ भी है। चुना हुआ रूप उस अर्थ को बिना धार्मिक आशय खोए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सामान्य पाठक के लिए स्पष्ट शैली। ‘दण्डवत्’ और ‘याजक’ जैसे स्थापित धार्मिक शब्द संदर्भ की ऐतिहासिक-सांस्कृतिक विशिष्टता बनाए रखते हैं; वाक्य-विन्यास हिन्दी के स्वाभाविक क्रम में रखा गया है।
