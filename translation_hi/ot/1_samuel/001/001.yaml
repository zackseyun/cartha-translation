source:
  edition: WLC
  text: וַ/יְהִי֩ אִ֨ישׁ אֶחָ֜ד מִן הָ/רָמָתַ֛יִם צוֹפִ֖ים מֵ/הַ֣ר אֶפְרָ֑יִם וּ/שְׁמ֡/וֹ אֶ֠לְקָנָה בֶּן יְרֹחָ֧ם בֶּן אֱלִיה֛וּא בֶּן תֹּ֥חוּ בֶן צ֖וּף אֶפְרָתִֽי־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/001.yaml
  text: There was a certain man from Ramathaim-zophim[a], from the hill country of Ephraim, and his name was Elkanah son of Jeroham, son of Elihu, son of Tohu, son of Zuph, an Ephraimite.
translation:
  language: hi
  text: एप्रैम के पहाड़ी प्रदेश में स्थित रामातैम-सोपीम का एक व्यक्ति था। उसका नाम एल्काना था। वह यरोहाम का पुत्र था; यरोहाम एलीहू का पुत्र था, एलीहू तोहू का पुत्र था, और तोहू सूफ का पुत्र था। वह एक एप्राती[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, संभवतः, “एक एप्रैमी।” इब्रानी में “एप्राती” है, जो यहाँ एप्रैम से जुड़ा क्षेत्रीय नाम हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: कथारंभ में היה का wayyiqtol किसी व्यक्ति के अस्तित्व का परिचय देता है; स्वाभाविक हिन्दी में वाक्य के अंत का ‘था’ यही कार्य करता है, बिना स्रोत में अनुपस्थित ‘अब’ जोड़ने के।
- source_word: אִישׁ אֶחָד
  choice: एक व्यक्ति
  rationale: यह पद कथा में किसी विशेष, अभी तक अनाम व्यक्ति का परिचय देता है। ‘एक व्यक्ति’ आधुनिक हिन्दी में स्वाभाविक है और ‘एक निश्चित व्यक्ति’ की कृत्रिमता से बचता है।
- source_word: מִן הָרָמָתַיִם צוֹפִים
  choice: रामातैम-सोपीम का
  rationale: इसे संयुक्त स्थान-नाम मानकर लिप्यंतरित किया गया है; नाम के घटकों का अर्थ लगाकर अनिश्चित भौगोलिक व्याख्या नहीं थोपी गई।
- source_word: מֵהַר אֶפְרָיִם
  choice: एप्रैम के पहाड़ी प्रदेश में
  rationale: क्षेत्रीय प्रयोग में הַר एक अकेले पर्वत के बजाय पहाड़ी भूभाग को दर्शाता है। यहाँ ‘में’ हिन्दी में व्यक्ति के नगर की व्यापक भौगोलिक स्थिति स्वाभाविक रूप से बताता है।
- source_word: וּשְׁמוֹ
  choice: उसका नाम ... था
  rationale: हिब्रू के समन्वयी परिचय को स्पष्ट और स्वाभाविक हिन्दी वाक्य में रखा गया है।
- source_word: אֶלְקָנָה
  choice: एल्काना
  rationale: व्यक्तिवाचक नाम का हिन्दी ध्वन्यात्मक लिप्यंतरण।
- source_word: בֶּן יְרֹחָם בֶּן אֱלִיהוּא בֶּן תֹּחוּ בֶן צוּף
  choice: यरोहाम का पुत्र, एलीहू का पोता, तोहू का परपोता और सूफ का वंशज
  rationale: हिन्दी में लगातार ‘का पुत्र’ दोहराने से संबंध अस्पष्ट हो सकता है; क्रमिक पीढ़ियों को पुत्र, पोता और परपोता से स्पष्ट किया गया है। अंतिम संबंध में वंशावलियों के संभावित पीढ़ी-संक्षेप को ध्यान में रखते हुए ‘वंशज’ रखा गया है।
- source_word: אֶפְרָתִי
  choice: एक एप्राती
  rationale: मसोरेटिक पाठ के औपचारिक जातीय/भौगोलिक विशेषण ‘एप्राती’ को मुख्य पाठ में सुरक्षित रखा गया है; प्रसंगगत ‘एप्रैमी’ अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: אֶפְרָתִי की जातीय अथवा भौगोलिक पहचान
  choice: एप्राती
  alternative: एप्रैमी
  rationale: शब्द का प्रत्यक्ष रूप ‘एप्राती’ है, जबकि पहले आया ‘एप्रैम का पहाड़ी प्रदेश’ प्रसंग में इसे एप्रैम-निवासी के अर्थ में समझने का आधार देता है। मूल रूप को मुख्य पाठ में और प्रसंगगत विकल्प को पादटिप्पणी में रखकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्थान और व्यक्तियों के नाम हिन्दी में लिप्यंतरित हैं। लंबी हिब्रू वंशावली को हिन्दी में संबंध-सूचक शब्दों से स्पष्ट किया गया है, और विवादित क्षेत्रीय पद की अस्पष्टता पादटिप्पणी में सुरक्षित है।
