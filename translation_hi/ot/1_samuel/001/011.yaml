  text: וַ/תִּדֹּ֨ר נֶ֜דֶר וַ/תֹּאמַ֗ר יְהוָ֨ה צְבָא֜וֹת אִם רָאֹ֥ה תִרְאֶ֣ה בָּ/עֳנִ֣י אֲמָתֶ֗/ךָ וּ/זְכַרְתַּ֨/נִי֙ וְ/לֹֽא תִשְׁכַּ֣ח אֶת אֲמָתֶ֔/ךָ וְ/נָתַתָּ֥ה לַ/אֲמָתְ/ךָ֖ זֶ֣רַע אֲנָשִׁ֑ים וּ/נְתַתִּ֤י/ו לַֽ/יהוָה֙ כָּל יְמֵ֣י חַיָּ֔י/ו וּ/מוֹרָ֖ה לֹא יַעֲלֶ֥ה עַל רֹאשֽׁ/וֹ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/011.yaml
  text: She made a vow and said[a], “O Yahweh of hosts, if you will indeed look on the affliction of your female servant, and remember me, and not forget your female servant, but give your female servant a male child, then I will give him to Yahweh all the days of his life[b], and no razor shall come upon his head.”
translation:
  language: hi
  text: 'उसने मन्नत मानी और कहा: “हे सेनाओं के याहवे, यदि तू सचमुच तेरी दासी के दुःख पर दृष्टि करे, मुझे स्मरण करे और तेरी दासी को न भूले, बल्कि तेरी दासी को एक पुत्र[a] दे, तो मैं उसे उसके जीवन भर याहवे को दे दूँगी, और उसके सिर पर कभी उस्तरा नहीं फिरेगा[b]।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अभिव्यक्ति ‘पुरुषों का बीज/वंश’ है, जो यहाँ एक नर संतान, अर्थात् पुत्र, के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: ‘उसके सिर पर उस्तरा नहीं फिरेगा’ विशेष समर्पण से जुड़े नाज़ीर-व्रत की भाषा की याद दिलाता है; पर यहाँ पाठ ‘नाज़ीर’ की संज्ञा दिए बिना बाल न काटने की शर्त को स्पष्ट रूप से बताता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתִּדֹּר נֶדֶר
  choice: उसने यह मन्नत मानी
  rationale: इब्रानी में सजातीय कर्म के द्वारा मन्नत की औपचारिकता और बल व्यक्त होता है; स्वाभाविक हिन्दी में ‘मन्नत मानी’ वही अर्थ देता है।
- source_word: יְהוָה צְבָאוֹת
  choice: हे सेनाओं के यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को ‘यहोवा’ और צְבָאוֹת को ‘सेनाओं’ के रूप में रखा गया है, ताकि उपाधि की सैन्य/ब्रह्मांडीय व्यापकता बनी रहे।
- source_word: אִם רָאֹה תִרְאֶה
  choice: यदि तू सचमुच ... दृष्टि करे
  rationale: धातु के infinitive absolute और finite verb का संयोजन क्रिया पर बल देता है; ‘सचमुच’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָּעֳנִי
  choice: दुःख
  rationale: शब्द क्लेश, दीन दशा और अपमानजनक पीड़ा को समेट सकता है; ‘दुःख’ प्रसंग में सहज है और अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אֲמָתֶךָ / לַאֲמָתְךָ
  choice: अपनी दासी / अपनी दासी को
  rationale: यह स्त्रीलिंग सेविका के लिए प्रयुक्त शब्द है; ‘दासी’ लिंग और प्रार्थनापूर्ण आत्म-विनय दोनों को बनाए रखता है।
- source_word: וּזְכַרְתַּנִי
  choice: मुझे स्मरण रखे
  rationale: यह प्रार्थना और वाचा-संबंधी भाषा का सीधा तथा स्वाभाविक अनुवाद है।
- source_word: וְלֹא תִשְׁכַּח אֶת אֲמָתֶךָ
  choice: और अपनी दासी को न भूले
  rationale: ‘स्मरण’ और ‘न भूलने’ की समानांतर, संचयी विनती सुरक्षित रखी गई है।
- source_word: וְנָתַתָּה לַאֲמָתְךָ זֶרַע אֲנָשִׁים
  choice: अपनी दासी को एक पुत्र दे
  rationale: शाब्दिक पदबंध ‘पुरुषों का बीज/वंश’ इस प्रसंग में नर संतान का मुहावरा है; आधुनिक हिन्दी में ‘एक पुत्र’ स्पष्ट और स्वाभाविक है, जबकि पादटिप्पणी मूल अभिव्यक्ति बताती है।
- source_word: וּנְתַתִּיו לַיהוָה
  choice: मैं उसे ... यहोवा को अर्पित कर दूँगी
  rationale: मूल क्रिया का आधारभूत अर्थ ‘देना’ है; मन्नत के प्रसंग में हिन्दी ‘अर्पित कर दूँगी’ उस समर्पण को स्पष्ट करती है, बिना नाज़ीर की संज्ञा जोड़े।
- source_word: כָּל יְמֵי חַיָּיו
  choice: उसके जीवन-भर
  rationale: यह पूरे जीवन की अवधि और मन्नत की आजीवन प्रकृति को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמוֹרָה לֹא יַעֲלֶה עַל רֹאשׁוֹ
  choice: उसके सिर पर कभी उस्तरा नहीं फिरेगा
  rationale: यह बाल न काटने के इब्रानी चित्र को हिन्दी के प्रचलित मुहावरे में रखता है; ‘उस्तरा’ מוֹרָה का प्रसंगानुकूल अर्थ है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। हिन्दी में व्यापक रूप से पहचाना जाने वाला रूप ‘यहोवा’ नाम को सामान्य उपाधि में बदलने के बजाय उसकी विशिष्टता बनाए रखता है।
- issue: उस्तरा न फिरने में नाज़ीर-व्रत का संभावित संकेत
  choice: मुख्य पाठ में केवल ठोस व्रत-वचन रखना
  alternative: बालक को स्पष्ट रूप से ‘नाज़ीर’ कहना
  rationale: भाषा विशेष अभिषेक और नाज़ीर-व्रत की याद दिलाती है, पर यह पद स्वयं ‘नाज़ीर’ की संज्ञा नहीं देता। इसलिए संज्ञा को मुख्य पाठ में नहीं जोड़ा गया और सांस्कृतिक संबंध पादटिप्पणी में बताया गया।
- issue: וּנְתַתִּיו का अर्थ
  choice: अर्पित कर दूँगी
  alternative: दे दूँगी
  rationale: मूलतः क्रिया ‘देना’ है, किंतु यहोवा को जीवन-भर देने की मन्नत के प्रसंग में ‘अर्पित’ लक्ष्यगत अर्थ को प्राकृतिक हिन्दी में प्रकट करता है; इसके द्वारा किसी विशिष्ट धार्मिक पद या संस्था का दावा नहीं जोड़ा जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रार्थना-शैली रखी गई है। परमेश्वर को संबोधन में एकवचन ‘तू’ बाइबिलीय निकटता और पारंपरिक प्रार्थना-प्रयोग को व्यक्त करता है, असम्मान को नहीं। वाक्य की संचयी याचना और उसके बाद मन्नत की संरचना सुरक्षित रखी गई है।
