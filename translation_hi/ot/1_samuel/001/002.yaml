base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/002.yaml
  text: He had two wives. The name of one was Hannah[a], and the name of the second was Peninnah. Peninnah had children, but Hannah had no children.
translation:
  language: hi
  text: उसकी दो पत्नियाँ थीं[a]। एक का नाम हन्ना था और दूसरी का नाम पनिन्ना था। पनिन्ना के बच्चे थे, लेकिन हन्ना की कोई संतान नहीं थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “और उसकी दो पत्नियाँ थीं।”'
    reason: इब्रानी וְלֹו में आरंभिक संयोजक और संबंधसूचक अधिकार-रचना को दिखाने वाला औपचारिक विकल्प।
lexical_decisions:
- source_word: וְלֹו שְׁתֵּי נָשִׁים
  choice: उसकी दो पत्नियाँ थीं
  rationale: इब्रानी में संबंधसूचक לְ के द्वारा अधिकार व्यक्त किया गया है, जिसका स्वाभाविक हिन्दी रूप ‘उसकी ... थीं’ है। वैवाहिक संदर्भ में נָשִׁים का अर्थ स्पष्टतः ‘पत्नियाँ’ है।
- source_word: שֵׁם אַחַת ... וְשֵׁם הַשֵּׁנִית
  choice: एक का नाम ... और दूसरी का नाम ... था
  rationale: यह रूप इब्रानी की समानांतर नामकरण-संरचना और ‘नाम’ की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: חַנָּה
  choice: हन्ना
  rationale: व्यक्तिनाम का देवनागरी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: פְּנִנָּה
  choice: पनिन्ना
  rationale: व्यक्तिनाम का इब्रानी उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: וַיְהִי לִפְנִנָּה יְלָדִים
  choice: पनिन्ना के बच्चे थे
  rationale: इब्रानी अस्तित्ववाचक-अधिकारसूचक वाक्य का यह स्वाभाविक हिन्दी रूप है। יְלָדִים यहाँ सामान्य अर्थ में ‘बच्चे’ है।
- source_word: וּלְחַנָּה אֵין יְלָדִים
  choice: लेकिन हन्ना की कोई संतान नहीं थी
  rationale: אֵין अभाव व्यक्त करता है। ‘लेकिन’ दोनों स्त्रियों की स्थिति के बीच निहित विरोध को स्पष्ट करता है; ‘कोई संतान नहीं थी’ आधुनिक हिन्दी में स्वाभाविक है और बच्चे के लिंग को निर्दिष्ट नहीं करता।
theological_decisions:
- issue: बहुपत्नी परिवार का उल्लेख
  choice: ‘दो पत्नियाँ’ कहकर स्थिति को सीधे प्रस्तुत किया गया है
  alternative: विवरण को नरम करना या केवल ‘दो स्त्रियाँ’ कहना
  rationale: इब्रानी पाठ वैवाहिक संबंध को तथ्य के रूप में बताता है; अनुवाद न तो उसका अनुमोदन जोड़ता है, न उसे छिपाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। नामकरण-वाक्य में मूल पाठ की समानांतरता बचाई गई है, जबकि अधिकार और अभाव की इब्रानी रचनाओं को स्वाभाविक हिन्दी में व्यक्त किया गया है।
