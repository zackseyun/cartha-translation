source:
  edition: WLC
  text: אֶל הַ/נַּ֥עַר הַ/זֶּ֖ה הִתְפַּלָּ֑לְתִּי וַ/יִּתֵּ֨ן יְהוָ֥ה לִ/י֙ אֶת שְׁאֵ֣לָתִ֔/י אֲשֶׁ֥ר שָׁאַ֖לְתִּי מֵ/עִמּֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/027.yaml
  text: For this boy I prayed[b][a], and Yahweh has given me my petition that I asked from him.
translation:
  language: hi
  text: इस बालक के लिए मैंने प्रार्थना की थी,[a] और याहवे ने मेरी वह विनती पूरी की है जो मैंने उससे की थी।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस बालक के विषय में मैंने प्रार्थना की थी।” हिब्रू पूर्वसर्ग प्रार्थना के विषय को भी सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “याहवे ने मुझे मेरी वह विनती दी जो मैंने उससे माँगी थी।”
    reason: literal_rendering
lexical_decisions:
- source_word: אֶל הַנַּעַר הַזֶּה
  choice: इस बालक के लिए
  rationale: אֶל यहाँ प्रार्थना के विषय या अभिप्रेत व्यक्ति को सूचित करता है। हिंदी में ‘इस बालक के लिए’ स्वाभाविक है और हन्ना की प्रार्थना का आशय स्पष्ट रखता है; ‘इस बालक के विषय में’ भी संभव है। נַעַר के लिए प्रसंगानुकूल ‘बालक’ चुना गया।
- source_word: הִתְפַּלָּלְתִּי
  choice: मैंने प्रार्थना की थी
  rationale: हिब्रू पूर्ण क्रिया बीते हुए कार्य को बताती है। हिंदी का पूर्ण भूतकाल वर्तमान दृश्य से पहले की प्रार्थना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּתֵּן
  choice: ने ... पूरी की
  rationale: शाब्दिक अर्थ ‘दिया’ है, पर हिंदी में विनती के साथ ‘विनती पूरी की’ स्वाभाविक है और दिए जाने के परिणाम को व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुराक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: שְׁאֵלָתִי
  choice: मेरी वह विनती
  rationale: स्त्रीलिंग एकवचन प्रत्यय ‘मेरी’ को सुरक्षित रखा गया है। ‘विनती’ प्रार्थना के प्रसंग में स्वाभाविक है; ‘निवेदन’ भी संभव है।
- source_word: אֲשֶׁר שָׁאַלְתִּי מֵעִמּוֹ
  choice: जो मैंने उससे की थी
  rationale: यह संबंधवाचक उपवाक्य विनती को स्पष्ट करता है। हिंदी में ‘विनती करना’ स्वाभाविक है; ‘उससे’ מֵעִמּוֹ के स्रोत/समक्ष संबंध को व्यक्त करता है। मूल में שׁאל की शब्द-पुनरावृत्ति हिंदी मुहावरे में ‘विनती ... की’ द्वारा आंशिक रूप से बनी रहती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिंदी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है; ‘याहवे’ अधिक प्रत्यक्ष विद्वत्तापूर्ण लिप्यंतरण है।
- issue: प्रार्थना और उत्तर के संबंध की अभिव्यक्ति
  choice: विनती पूरी की
  alternative: विनती दे दी
  rationale: מַתָּן की क्रिया का शाब्दिक भाव ‘देना’ है, पर यहाँ दी गई वस्तु विनती का उत्तर है। ‘पूरी की’ हिंदी में यही संबंध स्वाभाविक रूप से बताता है और यह दावा नहीं जोड़ता कि हर प्रार्थना इसी रीति से पूरी होती है।
translation_notes:
  register: आधुनिक मानक हिंदी, सहज किंतु गरिमापूर्ण। ‘बालक’, ‘प्रार्थना’ और ‘विनती’ सामान्य पाठकों के लिए स्पष्ट हैं। मुख्य पाठ में हिंदी मुहावरे को प्राथमिकता दी गई है, जबकि पादटिप्पणियाँ संबंधबोधक शब्द की वास्तविक अस्पष्टता और ‘देना/माँगना’ की हिब्रू संरचना सुरक्षित रखती हैं।
