base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/020.yaml
  text: And in due time Hannah conceived and bore a son[a], and she called his name Samuel, for she said[b], “I asked for him from Yahweh.”
translation:
  language: hi
  text: उचित समय पर हन्ना गर्भवती हुई और उसने एक पुत्र को जन्म दिया।[a] उसने उसका नाम शमूएल रखा, क्योंकि उसने कहा, “मैंने उसे यहोवा से माँगा था।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “दिनों के चक्र के आने पर”; यह उचित या नियत समय आ पहुँचने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: 'यहाँ “शमूएल” नाम को इब्रानी क्रिया שׁאל (शाअल), अर्थात् “माँगना,” से जोड़कर शब्द-क्रीड़ा की गई है: “मैंने उसे यहोवा से माँगा था।” नाम की ठीक व्युत्पत्ति निश्चित नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: לִתְקֻפוֹת הַיָּמִים
  choice: समय पूरा होने पर
  rationale: यह इब्रानी मुहावरा दिनों के चक्र या नियत समय के आ पहुँचने को व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से गर्भावधि पूरी होने का संकेत देता है।
- source_word: וַתַּהַר
  choice: गर्भवती हुई
  rationale: हरे क्रिया का स्पष्ट और आधुनिक हिन्दी रूप, जो जन्म-वृत्तांत के क्रम में स्वाभाविक है।
- source_word: וַתֵּלֶד בֵּן
  choice: एक पुत्र को जन्म दिया
  rationale: इब्रानी अभिव्यक्ति का सटीक, सहज और गरिमापूर्ण हिन्दी अनुवाद।
- source_word: וַתִּקְרָא אֶת־שְׁמוֹ
  choice: उसने उसका नाम ... रखा
  rationale: इब्रानी नामकरण-सूत्र का हिन्दी में स्वाभाविक रूप।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी बाइबलीय परंपरा में प्रचलित लिप्यंतरण।
- source_word: כִּי מֵיְהוָה שְׁאִלְתִּיו
  choice: क्योंकि उसने कहा, “मैंने इसे यहोवा से माँगा था”
  rationale: यह रूप निवेदन के भाव और बालक को यहोवा से माँगे जाने—दोनों को बनाए रखता है। ‘उसने कहा’ इब्रानी में निहित नामकरण-व्याख्या को हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में स्थापित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम सीधे आया है। हिन्दी पाठकों के लिए सुस्थापित रूप ‘यहोवा’ नाम की विशिष्टता को बनाए रखता है।
- issue: शमूएल नाम और שׁאל (‘माँगना’) के बीच शब्द-क्रीड़ा
  choice: मुख्य पाठ में ‘माँगा’ को बनाए रखकर शब्द-क्रीड़ा को पादटिप्पणी में समझाना
  alternative: नाम का निश्चित शाब्दिक अर्थ मुख्य पाठ में जोड़ना
  rationale: पद नाम को ‘माँगना’ क्रिया से जोड़ता है, पर ‘शमूएल’ की ठीक व्युत्पत्ति विवादित है। इसलिए पाठ के संबंध को बनाए रखते हुए किसी अनिश्चित व्युत्पत्ति को निश्चित नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथा-शैली अपनाई गई है। ‘पुत्र’ और ‘जन्म दिया’ जैसे व्यापक रूप से समझे जाने वाले शब्द रखे गए हैं। मूल की व्युत्पत्तिगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
