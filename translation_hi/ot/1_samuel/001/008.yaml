source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר לָ֜/הּ אֶלְקָנָ֣ה אִישָׁ֗/הּ חַנָּה֙ לָ֣/מֶה תִבְכִּ֗י וְ/לָ֨/מֶה֙ לֹ֣א תֹֽאכְלִ֔י וְ/לָ֖/מֶה יֵרַ֣ע לְבָבֵ֑/ךְ הֲ/ל֤וֹא אָֽנֹכִי֙ ט֣וֹב לָ֔/ךְ מֵ/עֲשָׂרָ֖ה בָּנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/008.yaml
  text: Then Elkanah her husband said to her[a], “Hannah, why are you weeping? And why do you not eat? And why is your heart troubled? Am I not better to you than ten sons?”
translation:
  language: hi
  text: तब उसके पति एल्काना ने उससे कहा, “हन्ना, तुम क्यों रो रही हो? तुम खाना क्यों नहीं खाती? और तुम्हारा मन क्यों उदास है?[a] क्या मैं तुम्हारे लिए दस बेटों से बढ़कर नहीं हूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “तुम्हारा हृदय क्यों दुःखी है?” शाब्दिक अर्थ: “तुम्हारा हृदय क्यों बुरा है?”'
    reason: इब्रानी मुहावरे के शाब्दिक रूप और सम्भव वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ हिन्दी में स्वाभाविक रूप से क्रम व्यक्त करता है।
- source_word: אֶלְקָנָה אִישָׁהּ
  choice: उसके पति एल्काना
  rationale: पति के संबंध और एल्काना की पहचान—दोनों को स्पष्ट तथा स्वाभाविक हिन्दी में रखता है।
- source_word: לָמֶה
  choice: क्यों
  rationale: तीनों प्रश्नों में आए प्रश्नवाचक शब्द का अर्थ सुरक्षित रखा गया है; हिन्दी की स्वाभाविकता के लिए दूसरे प्रश्न में क्रम बदला गया है।
- source_word: תִבְכִּי
  choice: तुम क्यों रो रही हो
  rationale: स्त्रीलिंग वर्तमान प्रगतिशील रूप हन्ना के जारी रोने को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תֹאכְלִי
  choice: तुम खाना क्यों नहीं खाती
  rationale: वर्तमान स्थिति में भोजन न करने का प्रश्न व्यक्त होता है, बिना अनिच्छा का अतिरिक्त भाव जोड़े।
- source_word: יֵרַע לְבָבֵךְ
  choice: तुम्हारा मन क्यों उदास है
  rationale: शाब्दिक रूप ‘तुम्हारा हृदय क्यों बुरा है’ हिन्दी में भ्रामक होगा; प्रसंग में यह भीतर के दुःख को दर्शाता है। ‘मन’ आधुनिक हिन्दी में इस भाव का स्वाभाविक वाहक है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं हूँ
  rationale: यह ऐसा नकारात्मक आलंकारिक प्रश्न है जो सकारात्मक उत्तर की अपेक्षा करता है।
- source_word: טוֹב לָךְ
  choice: तुम्हारे लिए ... से बढ़कर
  rationale: तुलनात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है और एल्काना के अपने मूल्य के दावे को बनाए रखता है।
- source_word: מֵעֲשָׂרָה בָּנִים
  choice: दस बेटों से
  rationale: मूल में स्पष्ट रूप से ‘बेटे’ हैं; संख्या और लिंग-विशिष्ट संज्ञा दोनों सुरक्षित रखे गए हैं।
theological_decisions:
- issue: בָּנִים की लिंग-विशिष्टता
  choice: बेटों
  alternative: बच्चों
  rationale: इब्रानी संज्ञा पुल्लिंग बहुवचन है और प्रसंग में पुत्रों को निर्दिष्ट करती है; लिंग-तटस्थ रूप मूल की सांस्कृतिक और भाषिक विशिष्टता को धुंधला कर देगा।
- issue: לְבָבֵךְ में ‘हृदय’ की छवि
  choice: मन
  alternative: हृदय
  rationale: यहाँ ‘हृदय बुरा होना’ नैतिक बुराई नहीं, भीतर का दुःख है। आधुनिक हिन्दी में ‘मन उदास होना’ उसी भाव को स्पष्ट और स्वाभाविक रूप से पहुँचाता है; पादटिप्पणी शाब्दिक संरचना बताती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। संबोधन में ‘तुम’ वैवाहिक निकटता और प्रसंग की स्वाभाविकता के अनुरूप है। प्रश्नों की पुनरावृत्ति रखी गई है, जबकि शब्दक्रम हिन्दी के अनुसार सहज बनाया गया है।
