source:
  edition: WLC
  text: וְ/חַנָּ֖ה לֹ֣א עָלָ֑תָה כִּֽי אָמְרָ֣ה לְ/אִישָׁ֗/הּ עַ֣ד יִגָּמֵ֤ל הַ/נַּ֨עַר֙ וַ/הֲבִאֹתִ֗י/ו וְ/נִרְאָה֙ אֶת פְּנֵ֣י יְהוָ֔ה וְ/יָ֥שַׁב שָׁ֖ם עַד עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/022.yaml
  text: But Hannah did not go up[a], for she said to her husband, “Not until the boy is weaned will I bring him[b], so that he may appear before Yahweh and stay there forever.”
translation:
  language: hi
  text: पर हन्ना ऊपर नहीं गई, क्योंकि उसने अपने पति से कहा, “बालक का दूध छूट जाने तक मैं उसे नहीं ले जाऊँगी; फिर मैं उसे ले आऊँगी, और वह याहवे के सामने उपस्थित होगा[a] और सदा वहीं रहेगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, एक अन्य पाठ-विन्यास अथवा पाठ-परंपरा के अनुसार: “और मैं याहवे के सामने उपस्थित होऊँगी, और वह सदा वहीं रहेगा।”'
    reason: alternative_reading
  - marker: b
    text: यहाँ “सदा” से आशय शमूएल का याहवे की सेवा के लिए स्थायी समर्पण, अर्थात उसके शेष जीवनभर, है।
    reason: cultural_note
lexical_decisions:
- source_word: עָלָתָה
  choice: ऊपर नहीं गई
  rationale: עלה का सामान्य अर्थ ‘ऊपर जाना’ है; प्रसंग में यह शीलो के पवित्रस्थान की यात्रा को दर्शाता है और मूल मुहावरे को बनाए रखता है।
- source_word: כִּי אָמְרָה לְאִישָׁהּ
  choice: क्योंकि उसने अपने पति से कहा
  rationale: כִּי यहाँ हन्ना के न जाने का कारण बताता है, और אִישָׁהּ का प्रसंगानुकूल अर्थ ‘उसका पति’ है।
- source_word: עַד יִגָּמֵל הַנַּעַר
  choice: जब तक बालक का दूध न छुड़ाया जाए
  rationale: यह पदबंध उस समय तक की प्रतीक्षा व्यक्त करता है जब बालक का दूध छुड़ा दिया जाएगा; निषेधात्मक ‘जब तक…न’ हिंदी में इस सीमा को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַהֲבִאֹתִיו
  choice: तब तक मैं उसे नहीं ले जाऊँगी। फिर
  rationale: हिब्रू वाक्य का आशय है कि हन्ना बालक को दूध छुड़ाए जाने से पहले नहीं लाएगी और उसके बाद उसे पवित्रस्थान ले जाएगी। हिंदी में वाक्य-विन्यास बदलकर यह क्रम स्पष्ट और स्वाभाविक रखा गया है।
- source_word: וְנִרְאָה אֶת־פְּנֵי יְהוָה
  choice: वह याहवे के सामने उपस्थित होगा
  rationale: निफ़अल रूप और उपासना-संबंधी मुहावरा ‘सामने उपस्थित होना’ दर्शाते हैं। मसोराई स्वरांकन के अनुसार कर्ता बालक है, यद्यपि एक अन्य पाठ/व्याख्या संभव है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: וְיָשַׁב שָׁם עַד עוֹלָם
  choice: और सदा वहीं रहेगा
  rationale: ישב यहाँ लगातार निवास/ठहराव को और עַד עוֹלָם स्थायी समर्पण को व्यक्त करता है; प्रसंग में इसका व्यावहारिक अर्थ जीवनभर है।
theological_decisions:
- issue: ‘उपस्थित होगा’ का कर्ता
  choice: 'बालक शमूएल कर्ता है: ‘वह…उपस्थित होगा और…रहेगा।’'
  alternative: 'एक अन्य पाठगत/व्याख्यात्मक परंपरा: ‘मैं याहवे के सामने उपस्थित होऊँगी, और वह सदा वहीं रहेगा।’'
  rationale: וַהֲבִאֹתִיו के बाद बालक को अगले एकवचन क्रियापदों का कर्ता मानना वाक्यक्रम और शमूएल के पवित्रस्थान में समर्पण के प्रसंग से मेल खाता है। फिर भी सार्थक वैकल्पिक परंपरा को पाद-टिप्पणी में सुरक्षित रखा गया है।
- issue: ‘सदा’ की अवधि
  choice: मुख्य पाठ में ‘सदा’, जिसका प्रसंगगत अर्थ शमूएल का जीवनभर समर्पण है।
  alternative: ‘जीवनभर’
  rationale: עַד עוֹלָם का औपचारिक बल ‘सदा’ से सुरक्षित रहता है, जबकि पाद-टिप्पणी प्रसंगगत अवधि स्पष्ट करती है और शब्द के अर्थ को चुपचाप सीमित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘ऊपर गई’ मूल इब्रानी यात्रा-मुहावरे को बचाता है; ‘बालक’ और ‘उपस्थित होगा’ सामान्य पाठक के लिए स्पष्ट हैं। याहवे नाम को देवनागरी में रखा गया है।
