  yaml_path: translation/ot/1_samuel/001/013.yaml
  text: Hannah was speaking in her heart; only her lips were moving[a], but her voice was not heard. So Eli thought she was drunk.
translation:
  language: hi
  text: हन्ना अपने मन में बोल रही थी; केवल उसके होंठ हिल रहे थे[a], पर उसकी आवाज़ सुनाई नहीं दे रही थी। इसलिए एली ने समझा कि वह नशे में थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह अपने आप से बोल रही थी” अथवा “वह मन-ही-मन प्रार्थना कर रही थी।” इब्रानी में शाब्दिक रूप से “अपने हृदय में बोल रही थी” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְדַבֶּרֶת עַל לִבָּהּ
  choice: अपने मन में बोल रही थी
  rationale: इब्रानी अभिव्यक्ति का शाब्दिक चित्र ‘अपने हृदय पर/में बोलना’ है और प्रसंग में बिना आवाज़ के भीतर बोलने को दर्शाता है। आधुनिक हिन्दी में ‘अपने मन में बोल रही थी’ इस चित्र और अर्थ दोनों को स्वाभाविक रूप से रखता है।
- source_word: רַק
  choice: केवल
  rationale: यह सीमाबोधक शब्द बताता है कि बाहर से केवल होंठों की गति दिखाई दे रही थी।
- source_word: שְׂפָתֶיהָ נָּעוֹת
  choice: उसके होंठ हिल रहे थे
  rationale: נוּעַ यहाँ गति को दर्शाता है; कृदन्तीय रूप की जारी क्रिया को ‘हिल रहे थे’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְקוֹלָהּ לֹא יִשָּׁמֵעַ
  choice: पर उसकी आवाज़ सुनाई नहीं दे रही थी
  rationale: निफ़अल रूप निष्क्रिय/श्रव्य न होने का भाव देता है। ‘पर’ होंठों के हिलने और आवाज़ न सुनाई देने के विरोध को स्पष्ट करता है।
- source_word: וַיַּחְשְׁבֶהָ
  choice: एली ने समझा कि वह
  rationale: חשב यहाँ किसी को किसी अवस्था में मानने या समझने का अर्थ देता है; यह हिन्दी में स्पष्ट और सहज है।
- source_word: לְשִׁכֹּרָה
  choice: नशे में है
  rationale: स्त्रीलिंग विशेषण का अर्थ ‘मतवाली/नशे में’ है। आधुनिक सामान्य हिन्दी में ‘नशे में है’ सहज विधेय है और मूल का आशय बनाए रखता है।
- source_word: וְחַנָּה הִיא
  choice: हन्ना
  rationale: הִיא विषय पर बल देता है। हिन्दी में नाम को सीधे आरम्भ में रखने से विषय स्पष्ट रहता है; ऐसा कोई अतिरिक्त कालसूचक संयोजक नहीं जोड़ा गया जो स्रोत में नहीं है।
