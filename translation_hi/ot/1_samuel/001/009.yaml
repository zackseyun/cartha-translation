id: 1SA.1.9
reference: 1 Samuel 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תָּ֣קָם חַנָּ֔ה אַחֲרֵ֛י אָכְלָ֥ה בְ/שִׁלֹ֖ה וְ/אַחֲרֵ֣י שָׁתֹ֑ה וְ/עֵלִ֣י הַ/כֹּהֵ֗ן יֹשֵׁב֙ עַל הַ/כִּסֵּ֔א עַל מְזוּזַ֖ת הֵיכַ֥ל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/009.yaml
  text: After they had eaten in Shiloh[a], and after they had drunk, Hannah rose. Now Eli the priest was sitting on the seat by the doorpost of the temple of Yahweh.
translation:
  language: hi
  text: शीलो में खाने-पीने के बाद हन्ना उठी। उस समय एली याजक याहवे के मन्दिर[a] के द्वार की चौखट के पास आसन पर बैठा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्रस्थान।”
    reason: הֵיכַל के लिए प्रसंगानुकूल वैकल्पिक अर्थ।
lexical_decisions:
- source_word: וַתָּקָם חַנָּה
  choice: हन्ना उठी
  rationale: קום का क़ाल कथात्मक रूप हन्ना के उठने और आगे की कार्रवाई आरम्भ करने को व्यक्त करता है; ‘उठी’ स्वाभाविक और संक्षिप्त है।
- source_word: אַחֲרֵי אָכְלָה בְשִׁלֹה וְאַחֲרֵי שָׁתֹה
  choice: शीलो में खाने-पीने के बाद
  rationale: दोनों समानान्तर कालसूचक वाक्यांशों को सहज हिन्दी में संयुक्त किया गया है। इस विषय-निरपेक्ष रचना से यह अनावश्यक रूप से निश्चित नहीं किया जाता कि केवल हन्ना ने या पूरे परिवार ने खाया-पिया।
- source_word: וְעֵלִי הַכֹּהֵן יֹשֵׁב
  choice: उस समय एली याजक ... बैठा था
  rationale: संबंधसूचक וְ और कृदन्त יֹשֵׁב यहाँ पृष्ठभूमि की चल रही स्थिति बताते हैं; ‘उस समय ... बैठा था’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עַל הַכִּסֵּא
  choice: आसन पर
  rationale: כִּסֵּא का अर्थ सीट, कुर्सी या सिंहासन हो सकता है। इस प्रसंग में सामान्य और गरिमापूर्ण ‘आसन’ राजकीय अर्थ थोपे बिना उपयुक्त है।
- source_word: עַל מְזוּזַת
  choice: द्वार की चौखट के पास
  rationale: מְזוּזָה द्वार की चौखट अथवा खम्भे को दर्शाता है और यहाँ עַל स्थान-संबंधी अर्थ में ‘के पास’ है।
- source_word: הֵיכַל
  choice: मन्दिर
  rationale: यह शब्द किसी बड़े पवित्र भवन या मन्दिर को दर्शा सकता है। ‘मन्दिर’ मुख्य पाठ में स्पष्ट और प्रचलित है; शीलो के पूर्व-सुलैमानी प्रसंग के कारण ‘पवित्रस्थान’ को पाद-टिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी लिपि में ‘याहवे’ के रूप में लिप्यन्तरित किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: ‘याहवे’ मूल व्यक्तिगत नाम का व्यापक रूप से मान्य लिप्यन्तरण है और स्रोत में उपस्थित नाम को बनाए रखता है।
- issue: शीलो में הֵיכַל का अर्थ
  choice: मन्दिर
  alternative: पवित्रस्थान
  rationale: शब्द दोनों अर्थों की गुंजाइश रखता है। मुख्य पाठ में सहज ‘मन्दिर’ रखा गया है, जबकि ऐतिहासिक परिवेश के अनुरूप विकल्प पाद-टिप्पणी में सुरक्षित है।
- issue: खाने और पीने वाले का व्याकरणिक कर्ता
  choice: विषय-निरपेक्ष ‘खाने-पीने के बाद’
  alternative: ‘उसके खाने-पीने के बाद’ अथवा ‘उनके खाने-पीने के बाद’
  rationale: इब्रानी रूप और प्रसंग हन्ना-केंद्रित तथा सामूहिक भोजन—दोनों समझों को जन्म दे सकते हैं। हिन्दी में विषय-निरपेक्ष रचना मूल की इस अनिश्चितता को बिना अस्वाभाविकता के बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘खाने-पीने के बाद’ कर्ता की वास्तविक अस्पष्टता बनाए रखता है; ‘आसन’ न तो अत्यधिक बोलचाल का है, न राजसत्ता का अर्थ थोपता है।
