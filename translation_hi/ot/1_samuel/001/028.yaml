base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/028.yaml
  text: So I also have given him to Yahweh[a]; all the days that he lives[b], he is given to Yahweh.” And he worshiped Yahweh there.
translation:
  language: hi
  text: और मैं भी उसे याहवे को सौंपती हूँ[a]; जब तक वह जीवित रहेगा, वह याहवे को सौंपा हुआ रहेगा।” और उसने वहाँ याहवे को दण्डवत किया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं भी उसे याहवे को उधार देती हूँ” अथवा “समर्पित करती हूँ।” इब्रानी में यहाँ उसी शब्द-मूल का प्रयोग हुआ है जिसका प्रयोग इस अध्याय में पहले ‘माँगने’ के लिए हुआ है।
    reason: lexical_alternative
  - marker: b
    text: या, “उन्होंने वहाँ याहवे को दण्डवत किया।” कर्ता का उल्लेख स्पष्ट नहीं है, और अनुवाद-परंपरा में इस रूप को अलग-अलग ढंग से समझा गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁאִלְתִּהוּ
  choice: इसे ... सौंपती हूँ
  rationale: שׁאל के हिफ़ील रूप का आशय बालक को याहवे के अधिकार और सेवा में देना है। ‘सौंपती हूँ’ आधुनिक हिन्दी में स्वाभाविक है और समर्पण के भाव को स्पष्ट करता है; मूल में ‘माँगने/उधार देने’ से जुड़ी शब्द-क्रीड़ा को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: לְ यहाँ दिशा/समर्पण का भाव व्यक्त करता है। יהוה को उसके covenant नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: כָּל הַיָּמִים אֲשֶׁר הָיָה
  choice: जब तक यह जीवित रहेगा
  rationale: यह जीवन-भर की अवधि बताने वाली इब्रानी अभिव्यक्ति है; हिन्दी में यह उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: שָׁאוּל
  choice: सौंपा हुआ रहेगा
  rationale: यह שׁאל से बना निष्क्रिय रूप है और पहले क्रियारूप को दोहराता है। हिन्दी में ‘सौंपा हुआ’ समर्पण की स्थायी स्थिति व्यक्त करता है, जबकि मूल की शब्द-क्रीड़ा पादटिप्पणी में बताई गई है।
- source_word: וַיִּשְׁתַּחוּ
  choice: उसने ... दण्डवत किया
  rationale: मसोरेटिक स्वरांकन के अनुसार क्रिया एकवचन है और उपासना में झुकने/भूमि पर दण्डवत करने का शारीरिक भाव रखती है। ‘दण्डवत किया’ इस क्रिया को ‘आराधना की’ की अपेक्षा अधिक मूर्त रूप में व्यक्त करता है।
- source_word: שָׁם
  choice: वहाँ
  rationale: स्थानवाचक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी पर्याय।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ covenant नाम יהוה का प्रयोग करता है; ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: וַיִּשְׁתַּחוּ का कर्ता
  choice: उसने वहाँ याहवे को दण्डवत किया
  alternative: उन्होंने वहाँ याहवे को दण्डवत किया
  rationale: मसोरेटिक पाठ का स्वरांकित रूप एकवचन समझा जाता है, पर निकट संदर्भ में कर्ता स्पष्ट रूप से नामित नहीं है और अनुवाद-परंपरा में बहुवचन भी मिलता है; इसलिए विकल्प पादटिप्पणी में रखा गया है।
- issue: हनाह द्वारा शमूएल को देने की प्रकृति
  choice: याहवे को सौंपती हूँ
  alternative: याहवे को उधार देती हूँ / याहवे को समर्पित करती हूँ
  rationale: पाठ שׁאל मूल को दोहराकर हनाह के माँगने और अब बालक को याहवे के लिए देने के बीच तनावपूर्ण शब्द-क्रीड़ा बनाता है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और शाब्दिक विकल्प को पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘इसे/यह’ बालक के लिए संदर्भानुकूल है। ‘दण्डवत किया’ उपासना में झुकने के मूल शारीरिक अर्थ को बचाता है, जबकि दोनों वास्तविक पाठगत/शाब्दिक विकल्प पादटिप्पणियों में दिए गए हैं।
