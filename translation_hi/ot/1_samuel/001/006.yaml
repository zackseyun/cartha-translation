source:
  edition: WLC
  text: וְ/כִֽעֲסַ֤תָּ/ה צָֽרָתָ/הּ֙ גַּם כַּ֔עַס בַּ/עֲב֖וּר הַרְּעִמָ֑/הּ כִּֽי סָגַ֥ר יְהוָ֖ה בְּעַ֥ד רַחְמָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/006.yaml
  text: And her rival would provoke her bitterly in order to irritate her[a], because Yahweh had closed her womb.
translation:
  language: hi
  text: उसकी सौत उसे बहुत चिढ़ाती थी, ताकि वह व्याकुल हो जाए, क्योंकि याहवे ने उसकी कोख बंद कर रखी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְכִעֲסַתָּה
  choice: चिढ़ाती थी
  rationale: पिएल रूप यहाँ किसी को खिझाने या उकसाने का कारणात्मक भाव देता है; प्रसंग में यह बार-बार होने वाला व्यवहार है, इसलिए अपूर्ण भूतकालीन अभिव्यक्ति चुनी गई।
- source_word: צָרָתָהּ
  choice: उसकी सौत
  rationale: यह शब्द इस प्रसंग में उसी पति की दूसरी पत्नी और घरेलू प्रतिद्वंद्वी पनिन्ना को सूचित करता है। आधुनिक हिंदी में ‘सौत’ इस संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: גַּם כַּעַס
  choice: बहुत
  rationale: संज्ञात्मक पुनरुक्ति चिढ़ाने की तीव्रता बढ़ाती है; हिंदी में ‘बहुत चिढ़ाती’ उसका स्वाभाविक समतुल्य है।
- source_word: בַּעֲבוּר
  choice: ताकि
  rationale: 'यहाँ उद्देश्य का भाव है: चिढ़ाने का लक्ष्य हन्ना को व्यथित करना था।'
- source_word: הַרְּעִמָהּ
  choice: उसे दुखी करे
  rationale: दुर्लभ हिफ़ील रूप का आशय उसे उद्विग्न, व्याकुल या दुखी करना है। ‘दुखी करे’ प्रसंगानुकूल है और अनिश्चित व्युत्पत्तिगत चित्र को अनावश्यक रूप से शाब्दिक नहीं बनाता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह उस परिस्थिति का कारण प्रस्तुत करता है जिसका लाभ सौत उसे सताने के लिए उठाती थी।
- source_word: סָגַר
  choice: बंद कर रखी थी
  rationale: सामान्य अर्थ ‘बंद करना’ है; हिंदी का संयुक्त रूप पूर्व से चली आ रही परिणामी अवस्था को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित प्रतिलेखन ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: בְּעַד רַחְמָהּ
  choice: उसकी कोख
  rationale: סגר בְּעַד के साथ רֶחֶם का मुहावरा गर्भधारण रोक दिए जाने को दर्शाता है; ‘कोख बंद करना’ हिंदी में मूल चित्र को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम सीधे आया है। हिंदी पाठकों के लिए प्रतिष्ठित और पहचाना हुआ रूप ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: बांझपन के संबंध में ईश्वरीय कर्तृत्व
  choice: यहोवा ने उसकी कोख बंद कर रखी थी
  alternative: वह गर्भवती नहीं हो पा रही थी
  rationale: मूल पाठ स्पष्ट रूप से यहोवा को कर्ता बताता है। धार्मिक तनाव को नरम करने या प्राकृतिक कारण में बदलने के बजाय उसे ज्यों का त्यों रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सहज रखी गई है। ‘सौत’ सांस्कृतिक संबंध को ठीक-ठीक बताता है; ‘चिढ़ाती थी’ पुनरावृत्त व्यवहार व्यक्त करता है।
