  text: וַ/תַּעֲלֵ֨/הוּ עִמָּ֜/הּ כַּ/אֲשֶׁ֣ר גְּמָלַ֗תּ/וּ בְּ/פָרִ֤ים שְׁלֹשָׁה֙ וְ/אֵיפָ֨ה אַחַ֥ת קֶ֨מַח֙ וְ/נֵ֣בֶל יַ֔יִן וַ/תְּבִאֵ֥/הוּ בֵית יְהוָ֖ה שִׁל֑וֹ וְ/הַ/נַּ֖עַר נָֽעַר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/024.yaml
  text: When she had weaned him[a], she took him up with her, with three bulls, one ephah of flour, and a skin of wine, and brought him to the house of Yahweh at Shiloh. Now the boy was young.
translation:
  language: hi
  text: जब उसने उसका दूध छुड़ा दिया, तब वह उसे अपने साथ तीन बैलों[a], एक एपा आटा और दाखमधु की एक मशक लेकर ऊपर गई। वह उसे शीलो में याहवे के भवन में ले आई। बालक अभी छोटा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी पाठ: “तीन बैल”; कुछ प्राचीन साक्षियों और व्याख्याकारों के अनुसार: “तीन वर्ष का एक बैल।”'
    reason: textual_variant
lexical_decisions:
- source_word: וַתַּעֲלֵהוּ עִמָּהּ
  choice: वह उसे अपने साथ … लेकर ऊपर गई
  rationale: עלה के चढ़कर जाने के दिशात्मक भाव को तीर्थस्थान की यात्रा के संदर्भ में रखा गया है और עִמָּהּ का ‘अपने साथ’ स्पष्ट रूप से व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר גְּמָלַתּוּ
  choice: जब उसने उसका दूध छुड़ा दिया
  rationale: इस प्रसंग में גמל बच्चे का दूध छुड़ाने को दर्शाता है; कालगत उपवाक्य को सहज आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בְּפָרִים שְׁלֹשָׁה
  choice: तीन बैलों
  rationale: मसोरेटिक पाठ का सीधा अर्थ ‘तीन बैल’ है; प्राचीन साक्षियों में पाए जाने वाले वैकल्पिक पाठ को पादटिप्पणी में रखा गया है।
- source_word: וְאֵיפָה אַחַת קֶמַח
  choice: एक एपा मैदा
  rationale: प्राचीन माप אֵיפָה को अनुमानित आधुनिक मात्रा में बदलने के बजाय ‘एपा’ के रूप में लिप्यंतरित किया गया है; קֶמַח के लिए सहज ‘मैदा’ चुना गया है।
- source_word: וְנֵבֶל יַיִן
  choice: दाखमधु की एक मशक
  rationale: נֵבֶל यहाँ तरल रखने की चमड़े की मशक है; יַיִן को गरिमापूर्ण और प्रचलित बाइबलीय हिन्दी ‘दाखमधु’ से व्यक्त किया गया है।
- source_word: וַתְּבִאֵהוּ
  choice: वह उसे … ले आई
  rationale: हिफ़ील रूप का मूल अर्थ ‘ले आना’ है और यह गंतव्य पर पहुँचने को स्पष्ट करता है।
- source_word: בֵית יְהוָה שִׁלוֹ
  choice: शीलो में याहवे के भवन में
  rationale: स्थान और पवित्रस्थान दोनों स्पष्ट रखे गए हैं; יהוה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत किया गया है।
- source_word: וְהַנַּעַר נָעַר
  choice: बालक अभी बहुत छोटा था
  rationale: इब्रानी की जानबूझकर की गई נער-पुनरावृत्ति को शब्दशः असहज दोहराने के बजाय बालक की अत्यल्प आयु पर दिए गए बल से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चतुरक्षरी व्यक्तिगत नाम है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: भेंट के पशुओं की संख्या और आयु
  choice: मुख्य पाठ में ‘तीन बैल’
  alternative: ‘तीन वर्ष का एक बैल’
  rationale: WLC के मसोरेटिक पाठ בְּפָרִים שְׁלֹשָׁה का स्वाभाविक अर्थ ‘तीन बैल’ है। कुछ प्राचीन साक्ष्य तथा पद 25 के संदर्भ से दूसरा पाठ संभव माना गया है, पर उसे मुख्य पाठ में चुपचाप अपनाना उचित नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक शैली रखी गई है। प्राचीन माप ‘एपा’ और ईश्वरीय नाम ‘याहवे’ को लिप्यंतरित किया गया है। पादटिप्पणी-चिह्न को ‘तीन बैलों’ के बाद रखा गया है, क्योंकि पाठांतर उसी पदबंध से संबंधित है।
