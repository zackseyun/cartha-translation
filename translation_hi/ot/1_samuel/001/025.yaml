  text: Then they slaughtered the bull and brought the boy to Eli[a][b].
translation:
  language: hi
  text: तब उन्होंने बैल का वध किया[a] और बालक[b] को एली के पास ले आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मार डाला।” इब्रानी क्रिया का अधिक सामान्य अनुवाद भी सम्भव है, पर यहाँ बलिदान के प्रसंग में “वध किया” अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: या, “बच्चा” या “लड़का।” इब्रानी शब्द का अर्थ संदर्भ के अनुसार बालक, लड़का या युवक हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחֲטוּ
  choice: तब उन्होंने ... का वध किया
  rationale: वय्यिक्तोल कथा के अगले क्रम को आगे बढ़ाता है; ‘वध किया’ बलिदान के प्रसंग को स्वाभाविक रूप से व्यक्त करता है और सामान्य ‘मार डाला’ से अधिक उपयुक्त है।
- source_word: הַפָּר
  choice: बैल
  rationale: פַּר प्रायः बैल को, विशेषकर बलिदान के संदर्भ में, दर्शाता है। इस पद में संज्ञा एकवचन और निश्चित है, इसलिए ‘बैल’ उपयुक्त है।
- source_word: וַיָּבִיאוּ
  choice: और ... ले आए
  rationale: यह अगली क्रमिक क्रिया है। व्यक्ति को किसी के पास पहुँचाने के लिए आधुनिक हिन्दी में ‘ले आए’ स्वाभाविक है।
- source_word: הַנַּעַר
  choice: बालक
  rationale: נַעַר का अर्थ संदर्भानुसार बालक, लड़का या युवक हो सकता है। यहाँ शमूएल की कम आयु के कारण ‘बालक’ उपयुक्त है, जबकि शब्द की व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: אֶל עֵלִי
  choice: एली के पास
  rationale: אֶל एली की ओर गति या पहुँच को दर्शाता है; ‘एली के पास’ सहज और सटीक आधुनिक हिन्दी है।
theological_decisions:
- issue: पशु-वध का बलिदान-संबंधी भाव
  choice: ‘वध किया’ द्वारा संभावित बलिदान-संदर्भ को बनाए रखा गया है, पर मूल में निहित न होने वाली व्याख्या नहीं जोड़ी गई।
  alternative: अधिक सामान्य ‘मार डाला’
  rationale: निकटवर्ती प्रसंग शीलो में आराधना और भेंट से जुड़ा है। ‘वध किया’ इब्रानी क्रिया का सीधा अनुवाद रहते हुए इस धार्मिक-सांस्कृतिक संदर्भ को बेहतर व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘वध’ बलिदान-संदर्भ के अनुकूल और सामान्य पाठक के लिए परिचित है; ‘बालक’ शमूएल की आयु के अनुरूप है।
