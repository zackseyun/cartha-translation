source:
  edition: WLC
  text: וּ/לְ/חַנָּ֕ה יִתֵּ֛ן מָנָ֥ה אַחַ֖ת אַפָּ֑יִם כִּ֤י אֶת חַנָּה֙ אָהֵ֔ב וַֽ/יהוָ֖ה סָגַ֥ר רַחְמָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/005.yaml
  text: But to Hannah he would give a double portion[a], because he loved Hannah, though Yahweh had closed her womb.
translation:
  language: hi
  text: पर हन्ना को वह दुगुना भाग[a] देता था, क्योंकि वह हन्ना से प्रेम करता था, और यहोवा ने उसकी कोख बंद कर दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “दो मुखों/नथुनों का एक भाग।” यह कठिन अभिव्यक्ति “दुगुना भाग” या “विशेष भाग” के अर्थ में समझी जा सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּלְחַנָּה
  choice: पर हन्ना को
  rationale: संयोजक और संबंधसूचक पद पिछले पद में पनिन्ना और उसके बच्चों को दिए गए भागों के साथ विरोध दिखाते हैं; आधुनिक हिन्दी में ‘पर’ यह संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִתֵּן
  choice: देता था
  rationale: अपूर्ण क्रिया यहाँ भूतकालीन अभ्यस्त कार्य को सूचित करती है—बलि-भोज के अवसर पर एल्काना का नियमित व्यवहार।
- source_word: מָנָה
  choice: भाग
  rationale: यह बलि-भोज में बाँटे गए हिस्से को दर्शाता है; ‘भाग’ सामान्य, स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: אַחַת אַפָּיִם
  choice: दुगुना भाग
  rationale: शाब्दिक अभिव्यक्ति कठिन है (‘दो मुखों/नथुनों का एक भाग’); सम्भावित अर्थ दुगुना या विशेष भाग है। मुख्य पाठ में प्रचलित सम्भावित अर्थ रखा गया और अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: כִּי אֶת־חַנָּה אָהֵב
  choice: क्योंकि वह हन्ना से प्रेम करता था
  rationale: כִּי कारण प्रस्तुत करता है और אָהֵב एल्काना के हन्ना के प्रति प्रेम को सीधे व्यक्त करता है।
- source_word: יהוה
  choice: यहोवा
  rationale: मूल में परमेश्वर का व्यक्तिगत वाचा-नाम स्पष्ट रूप से आया है; हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ उसका नाम बनाए रखता है।
- source_word: סָגַר רַחְמָהּ
  choice: उसकी कोख बंद कर रखी थी
  rationale: क्रिया का अर्थ बंद करना है और प्रसंग में यह हन्ना की पहले से चली आ रही निःसंतान अवस्था की पृष्ठभूमि बताती है। ‘कोख’ साधारण आधुनिक हिन्दी में प्रजनन-अर्थ स्पष्ट रखती है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: हिब्रू पाठ में वाचा-नाम है। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और मूल के व्यक्तिगत नाम को सामान्य उपाधि में नहीं बदलता।
- issue: अंतिम उपवाक्य का संबंध
  choice: यद्यपि यहोवा ने उसकी कोख बंद कर रखी थी
  alternative: और यहोवा ने उसकी कोख बंद कर रखी थी
  rationale: हिब्रू וְ स्वयं ‘और’ है, पर सन्निकट कथनों में निहित विरोध—एल्काना का प्रेम, हन्ना की निःसंतानता के बावजूद—हिन्दी में ‘यद्यपि’ से स्वाभाविक रूप से व्यक्त होता है। साथ ही, यह कथन ज्यों का त्यों रहता है कि उसकी कोख यहोवा ने बंद की थी।
translation_notes:
  register: आधुनिक मानक हिन्दी; सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘देता था’ अभ्यस्त भूतकाल को और ‘बंद कर रखी थी’ पूर्ववर्ती जारी अवस्था को व्यक्त करता है।
