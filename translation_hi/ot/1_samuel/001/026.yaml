base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/001/026.yaml
  text: And she said[a], “Please, my lord, as surely as you live, my lord, I am the woman who stood here beside you, praying to Yahweh.
translation:
  language: hi
  text: तब उसने कहा, “कृपा करके, मेरे प्रभु, आपके जीवन की शपथ,[a] मेरे प्रभु, मैं वही स्त्री हूँ जो यहाँ आपके पास खड़ी होकर यहोवा से प्रार्थना कर रही थी।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “आपके प्राण के जीवित रहने की शपथ।” यह गंभीर आग्रह व्यक्त करने वाली शपथ-सूक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּי
  choice: कृपया सुनिए
  rationale: प्रत्यक्ष संबोधन में यह विनम्र और आग्रहपूर्ण निवेदन का सूचक है; ‘कृपया सुनिए’ प्रसंग में स्वाभाविक हिंदी है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह एली के लिए आदरसूचक मानवीय संबोधन है, ईश्वर की उपाधि नहीं; ‘मेरे प्रभु’ मूल की सामाजिक विनम्रता बनाए रखता है।
- source_word: חֵי נַפְשְׁךָ
  choice: आपके जीवन की शपथ
  rationale: यह संबोधित व्यक्ति के जीवन को साक्षी बनाकर कही गई शपथ-सूक्ति है; यह हिंदी में उसके गंभीर और आग्रहपूर्ण बल को स्पष्ट रखता है।
- source_word: הָאִשָּׁה
  choice: वही स्त्री
  rationale: निश्चित पद पहले देखी गई विशिष्ट स्त्री की पहचान कराता है; हिंदी में ‘वही स्त्री’ इस पुनर्पहचान को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַנִּצֶּבֶת
  choice: खड़ी होकर ... कर रही थी
  rationale: स्त्रीलिंग कृदंत उस समय की स्थिति को दिखाता है; हिंदी में यह रचना पूर्वकालीन दृश्य और जारी क्रिया दोनों को सहजता से व्यक्त करती है।
- source_word: עִמְּכָה
  choice: आपके पास
  rationale: यहाँ पूर्वसर्ग संगति से अधिक स्थानिक निकटता बताता है; ‘आपके पास’ आधुनिक हिंदी में स्वाभाविक है।
- source_word: בָּזֶה
  choice: यहाँ
  rationale: पूर्व घटना के उसी स्थान की ओर संकेत है; ‘यहाँ’ संक्षिप्त और स्पष्ट समतुल्य है।
- source_word: לְהִתְפַּלֵּל
  choice: प्रार्थना कर रही थी
  rationale: उद्देश्य/गतिविधि सूचक क्रिया को हिंदी में चल रही पूर्वकालीन क्रिया के रूप में देना प्रसंगानुकूल और स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी बाइबलीय प्रयोग में प्रचलित नामरूप ‘यहोवा’ टेट्राग्राम को किसी सामान्य उपाधि से बदलने के बजाय व्यक्तिगत नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में टेट्राग्राम सीधे आया है। हिंदी पाठकों में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ व्यक्तिगत ईश्वरीय नाम को सुरक्षित रखता है; ‘याहवे’ अधिक निकट आधुनिक लिप्यंतरण है, पर हिंदी बाइबलीय परंपरा में कम सहज है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज और आदरसूचक शैली। हन्ना के आग्रह, एली के प्रति सम्मान और शपथ-सूक्ति की गंभीरता को बनाए रखा गया है।
