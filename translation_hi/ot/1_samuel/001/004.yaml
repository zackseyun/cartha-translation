  yaml_path: translation/ot/1_samuel/001/004.yaml
  text: And when the day came[a], Elkanah sacrificed and gave portions to Peninnah his wife and to all her sons and daughters.
translation:
  language: hi
  text: और जिस दिन एलकाना बलि चढ़ाता था, वह अपनी पत्नी पनिन्ना और उसके सभी बेटे-बेटियों को बलि के भाग देता था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי הַיּוֹם
  choice: और जिस दिन
  rationale: यह इब्रानी कथात्मक समय-सूचक पदबंध है। संदर्भ में यह प्रति वर्ष होने वाली घटना की ओर ले जाता है; हिंदी में ‘और जिस दिन’ स्वाभाविक है और अनावश्यक रूप से किसी विशेष पर्व-दिन की पहचान नहीं करता।
- source_word: וַיִּזְבַּח
  choice: बलि चढ़ाता था
  rationale: זבח बलि के लिए पशु वध करने अथवा बलि अर्पित करने को दर्शाता है। ‘बलि चढ़ाता था’ आधुनिक हिंदी में धार्मिक संदर्भ को स्पष्ट रखता है और आसपास के पदों में वर्णित नियमित वार्षिक प्रथा के अनुकूल है।
- source_word: וְנָתַן
  choice: देता था
  rationale: रूप को साधारण भूतकाल ‘दिया’ भी समझा जा सकता है, पर व्यापक संदर्भ एलकाना की बार-बार होने वाली वार्षिक रीति बताता है। हिंदी का अपूर्ण भूत ‘देता था’ इस अभ्यस्त क्रिया को सहजता से व्यक्त करता है।
- source_word: לִפְנִנָּה אִשְׁתּוֹ
  choice: अपनी पत्नी पनिन्ना को
  rationale: यह हिंदी में स्वाभाविक क्रम है और पनिन्ना का एलकाना की पत्नी होना स्पष्ट करता है।
- source_word: וּלְכָל בָּנֶיהָ וּבְנוֹתֶיהָ
  choice: और उसके सभी बेटे-बेटियों को
  rationale: मूल पाठ बेटे और बेटियाँ दोनों को स्पष्ट रूप से नामित करता है; ‘बच्चों’ कहकर उस विशिष्टता को समेटा नहीं गया।
- source_word: מָנוֹת
  choice: बलि के भाग
  rationale: מָנוֹת बाँटे गए हिस्सों को दर्शाता है और यहाँ वे बलि-भोज के हिस्से हैं। केवल ‘भाग’ की अपेक्षा ‘बलि के भाग’ आधुनिक पाठक के लिए आशय स्पष्ट करता है।
