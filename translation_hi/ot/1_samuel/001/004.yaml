translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आसपास के वर्णन में वार्षिक उपासना और बलि-भोज की पुनरावृत्ति के कारण ‘चढ़ाता था’ और ‘देता था’ चुने गए हैं। किसी संप्रदायगत व्याख्या को नहीं जोड़ा गया है।
