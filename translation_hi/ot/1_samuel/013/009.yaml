base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/009.yaml
  text: So Saul said[b][a], “Bring near to me the burnt offering and the peace offerings.” And he offered up the burnt offering.
translation:
  language: hi
  text: तब शाऊल ने कहा, “होमबलि और मेलबलियों[a] को मेरे पास ले आओ।” और उसने होमबलि चढ़ाई।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सहभागिता की बलियों।” इब्रानी शब्द शान्ति, कुशल या साझा सहभागिता से जुड़ी बलियों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: अन्तिम वाक्य का सबसे स्वाभाविक अर्थ है कि शाऊल ने स्वयं होमबलि चढ़ाई; कुछ लोग इसका अर्थ अधिक परोक्ष रूप से लेते हैं कि उसने बलि चढ़वाई।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब शाऊल ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַגִּישׁוּ אֵלַי
  choice: मेरे पास ले आओ
  rationale: हिफ़ईल आज्ञार्थक का अर्थ पास लाना अथवा प्रस्तुत करना है; यह हिन्दी में स्वाभाविक रहते हुए बलि को शाऊल के सामने लाने का भाव रखता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: यह उस बलि का मानक हिन्दी नाम है जो पूरी तरह वेदी पर जलाई जाती थी।
- source_word: וְהַשְּׁלָמִים
  choice: और मेलबलियों
  rationale: शब्द बहुवचन है और शान्ति, कुशल तथा सहभागी भोज से जुड़ी बलियों को सूचित करता है; ‘मेलबलि’ संक्षिप्त और प्रचलित धार्मिक पद है, जबकि विकल्प पादटिप्पणी में दिया गया है।
- source_word: וַיַּעַל
  choice: उसने ... चढ़ाई
  rationale: बलिदानी प्रसंग में עלה का स्वाभाविक अर्थ बलि चढ़ाना है; निकटतम पूर्ववर्ती कर्ता शाऊल है।
theological_decisions:
- issue: अन्तिम उपवाक्य में कर्ता और उसकी भूमिका
  choice: शाऊल ने स्वयं होमबलि चढ़ाई
  alternative: शाऊल ने होमबलि चढ़वाई या प्रस्तुत करवाई
  rationale: एकवचन क्रिया का सीधा कर्ता पूर्ववर्ती शाऊल है और आगे आने वाली फटकार भी प्रत्यक्ष कर्तृत्व के अनुकूल है; फिर भी बलिदानी प्रयोग में परोक्ष/कारक अर्थ की सम्भावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होमबलि’ तथा ‘मेलबलि’ जैसे परिचित बलिदानी पद मूल की संक्षिप्तता बनाए रखते हैं; वास्तविक अर्थगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
