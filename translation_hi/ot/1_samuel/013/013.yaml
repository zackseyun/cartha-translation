base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/013.yaml
  text: And Samuel said to Saul[a], “You have acted foolishly. You have not kept the command of Yahweh your God, which he commanded you; for now Yahweh would have established your kingdom over Israel forever.”
translation:
  language: hi
  text: शमूएल ने शाऊल से कहा, “तुमने मूर्खता की है।[a] तुमने याहवे, अपने परमेश्वर, की उस आज्ञा का पालन नहीं किया, जो उसने तुम्हें दी थी। क्योंकि अब तक याहवे इस्राएल पर तुम्हारे राज्य को सदा के लिए स्थिर कर चुका होता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुमने मूर्खतापूर्ण काम किया है।”
    reason: נִסְכָּלְתָּ का वैकल्पिक, आचरण-केंद्रित अनुवाद।
lexical_decisions:
- source_word: נִסְכָּלְתָּ
  choice: तुमने मूर्खता की है
  rationale: निफ़अल रूप यहाँ केवल मानसिक अवस्था नहीं, बल्कि शाऊल के मूर्खतापूर्ण आचरण का नैतिक मूल्यांकन व्यक्त करता है। यह हिंदी में स्वाभाविक और सीधा है।
- source_word: שָׁמַרְתָּ
  choice: पालन नहीं किया
  rationale: शׁמר का मूल भाव ‘रखना/मानना/पालन करना’ है; आज्ञा के साथ ‘पालन करना’ आधुनिक हिंदी में स्वाभाविक है और आज्ञाकारिता के आशय को स्पष्ट रखता है।
- source_word: מִצְוַת
  choice: उस आज्ञा
  rationale: एक विशिष्ट आज्ञा का उल्लेख है; ‘उस’ संदर्भित विशिष्टता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले ईश्वरीय निजी नाम को उपाधि से बदलने के बजाय हिंदी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष संबंधसूचक अर्थ को स्वाभाविक हिंदी में ‘अपने परमेश्वर’ से व्यक्त किया गया है।
- source_word: צִוָּךְ
  choice: जो उसने तुम्हें दी थी
  rationale: हिंदी में ‘आज्ञा देना’ स्वाभाविक सहप्रयोग है; इससे मूल क्रिया צוה का आदेशात्मक अर्थ बना रहता है।
- source_word: כִּי עַתָּה
  choice: क्योंकि तब
  rationale: वाक्य के प्रतिकल्पित संदर्भ में ‘तब’ उस परिणाम की ओर संकेत करता है जो आज्ञापालन करने पर होता; ‘क्योंकि’ व्याख्यात्मक संबंध को बनाए रखता है।
- source_word: הֵכִין
  choice: स्थिर कर देता
  rationale: हिफ़ील रूप का अर्थ दृढ़ या स्थापित करना है। संदर्भगत प्रतिकल्पना को हिंदी की क्रिया ‘कर देता’ स्वाभाविक ढंग से व्यक्त करती है।
- source_word: מַמְלַכְתְּךָ
  choice: तुम्हारे राज्य
  rationale: ממלכה के राजकीय क्षेत्र और सत्ता दोनों के सामान्य अर्थ के लिए ‘राज्य’ सीधा और व्यापक विकल्प है।
- source_word: אֶל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: राज्य स्थापित करने के प्रसंग में אֶל का संबंध शासन के क्षेत्र से है; हिंदी में ‘इस्राएल पर’ स्वाभाविक है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह दीर्घस्थायी, निरंतर अवधि का मानक और स्वाभाविक हिंदी रूप है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में निजी ईश्वरीय नाम उपस्थित है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना दर्शाता है।
- issue: כִּי עַתָּה הֵכִין की प्रतिकल्पित शक्ति
  choice: क्योंकि तब याहवे ... स्थिर कर देता
  alternative: क्योंकि अब याहवे ने ... स्थिर कर दिया था
  rationale: आसपास का कथानक इसे शाऊल की अवज्ञा के कारण खोए हुए परिणाम के रूप में प्रस्तुत करता है। हिंदी प्रतिकल्पित रचना इस प्रसंगगत अर्थ को स्पष्ट करती है, बिना यह कहे कि राज्य वास्तव में सदा के लिए स्थापित हो चुका था।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल। ‘आज्ञा का पालन’ तथा ‘राज्य को स्थिर करना’ जैसे परिचित पद मूल अर्थ और स्वाभाविक हिंदी के बीच संतुलन रखते हैं।
