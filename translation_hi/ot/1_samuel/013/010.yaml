base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/010.yaml
  text: And it happened[a], as soon as he had finished offering up the burnt offering, that behold, Samuel came. And Saul went out to meet him, to bless him.
translation:
  language: hi
  text: और ऐसा हुआ कि जैसे ही उसने होमबलि चढ़ाना समाप्त किया, तभी शमूएल आ पहुँचा। तब शाऊल उससे मिलने और उसे आशीर्वाद देने[a] बाहर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका अभिवादन करने।” इब्रानी क्रिया का शाब्दिक अर्थ “आशीर्वाद देना” है, पर यहाँ भेंट के प्रसंग में यह औपचारिक अभिवादन के अर्थ में प्रयुक्त हो सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यह कथा में अगली घटना आरम्भ करने वाला रूप है; हिंदी में स्वाभाविक रहते हुए इब्रानी कथात्मक प्रवाह को बनाए रखता है।
- source_word: כְּכַלֹּתוֹ
  choice: जैसे ही उसने ... समाप्त किया
  rationale: כְּ के साथ infinitive construct क्रिया पूरी होने के समय को बताता है; प्रसंग में तत्काल क्रम का भाव है।
- source_word: לְהַעֲלוֹת הָעֹלָה
  choice: होमबलि चढ़ाना
  rationale: עלה का हिफ़ील बलिदान के संदर्भ में ‘चढ़ाना’ और עֹלָה विशेष प्रकार की पूर्णतः जलाई जाने वाली बलि को दर्शाता है; ‘होमबलि’ प्रचलित और संक्षिप्त धार्मिक पद है।
- source_word: וְהִנֵּה
  choice: तभी
  rationale: הִנֵּה शमूएल के अचानक और ध्यान खींचने वाले आगमन को दिखाता है; आधुनिक हिंदी में ‘तभी’ इस प्रभाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּא
  choice: आ पहुँचा
  rationale: ‘आ पहुँचा’ आगमन की पूर्ण घटना और दृश्य की तात्कालिकता को स्पष्ट करता है।
- source_word: וַיֵּצֵא
  choice: बाहर गया
  rationale: मूल क्रिया में बाहर की ओर जाने का स्थानिक भाव है, जिसे स्पष्ट रूप से रखा गया है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने
  rationale: यह इब्रानी मुहावरा किसी के स्वागत या भेंट के लिए उसकी ओर जाने को दर्शाता है।
- source_word: לְבָרֲכוֹ
  choice: उसे आशीर्वाद देने
  rationale: ברך का मूल अर्थ ‘आशीर्वाद देना’ है। भेंट के प्रसंग में इसका अर्थ औपचारिक अभिवादन करना भी हो सकता है; मुख्य पाठ में शाब्दिक अर्थ और पादटिप्पणी में प्रसंगगत विकल्प रखा गया है।
