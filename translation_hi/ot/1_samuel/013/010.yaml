  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। ‘होमबलि’ तकनीकी बलिदानी पद के रूप में बरकरार है। הִנֵּה के लिए पुरातन या कृत्रिम ‘देखो’ के बजाय प्रसंगानुकूल ‘तभी’ चुना गया है।
