  rationale: אֵת खोदने या गुड़ाई करने के कृषि-औज़ार का बोध कराता है।
- source_word: קַרְדֻּמּוֹ
  choice: कुल्हाड़ी
  rationale: यह कुल्हाड़ी जैसे काटने वाले औज़ार का सामान्य अर्थ है।
- source_word: מַחֲרֵשָׁתוֹ
  choice: हँसिया
  rationale: औज़ारों की सूची में सम्भावित अर्थ लिया गया है, पर शब्द की पहचान अनिश्चित होने के कारण पादटिप्पणी दी गई है।
