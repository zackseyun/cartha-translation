  text: And raiders came out from the camp of the Philistines in three companies[a]. One company turned toward the road to Ophrah[b], toward the land of Shual.
translation:
  language: hi
  text: पलिश्तियों की छावनी से छापामार दल[a] तीन टुकड़ियों[b] में निकला। एक टुकड़ी ओप्रा जाने वाले मार्ग की ओर, शूआल के क्षेत्र की ओर मुड़ी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ ‘नाश करने वाला’ या ‘नाश करने वाला दल’ है; यहाँ आशय पलिश्तियों की छावनी से निकले छापामार दल से है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से ‘तीन सिर’ और आगे ‘एक सिर’ है; यह सैनिक दलों या टुकड़ियों के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
