  text: וְ/הָיָה֙ בְּ/י֣וֹם מִלְחֶ֔מֶת וְ/לֹ֨א נִמְצָ֜א חֶ֤רֶב וַ/חֲנִית֙ בְּ/יַ֣ד כָּל הָ/עָ֔ם אֲשֶׁ֥ר אֶת שָׁא֖וּל וְ/אֶת יוֹנָתָ֑ן וַ/תִּמָּצֵ֣א לְ/שָׁא֔וּל וּ/לְ/יוֹנָתָ֖ן בְּנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/022.yaml
  text: So on the day of battle[a], not a sword or spear was found in the hand of any of the people who were with Saul and Jonathan; but Saul and his son Jonathan had them.
translation:
  language: hi
  text: इस प्रकार युद्ध के दिन[a] जो लोग शाऊल और योनातान के साथ थे, उनमें से किसी के हाथ में तलवार या भाला नहीं पाया गया; पर वे शाऊल और उसके पुत्र योनातान के पास थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “सब लोगों के हाथ में तलवार और भाला नहीं पाए गए।” इब्रानी अभिव्यक्ति का आशय है कि सैनिकों में से किसी के पास भी ऐसे हथियार नहीं थे।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: इस प्रकार
  rationale: यह पिछले प्रसंग के परिणाम को आगे की घटना से जोड़ता है और इब्रानी कथात्मक प्रवाह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּיוֹם מִלְחֶמֶת
  choice: युद्ध के दिन
  rationale: בְּ के कालवाचक प्रयोग और יוֹם की ठोस अभिव्यक्ति को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: לֹא נִמְצָא
  choice: न तो ... थी, न
  rationale: निफ़अल के निषेधात्मक भाव को हिन्दी में स्वाभाविक अस्तित्व/उपलब्धता की रचना द्वारा व्यक्त किया गया है।
- source_word: חֶרֶב וַחֲנִית
  choice: न तो तलवार ... न भाला
  rationale: इब्रानी में संयोजक 'और' है, पर निषेध के दायरे में हिन्दी की 'न तो...न' रचना स्पष्ट करती है कि दोनों प्रकार के हथियार किसी के पास नहीं थे।
- source_word: בְּיַד
  choice: हाथ में
  rationale: यह अधिकार या उपलब्धता का इब्रानी मुहावरा है; 'हाथ में' हिन्दी में भी समझने योग्य है और मूल बिंब को सुरक्षित रखता है।
- source_word: כָּל הָעָם
  choice: लोगों में से किसी
  rationale: 'निषेध के अंतर्गत כָּל का वितरणात्मक अर्थ है: साथ के लोगों में किसी के पास भी ये हथियार नहीं थे।'
- source_word: אֲשֶׁר אֶת־שָׁאוּל וְאֶת־יוֹנָתָן
  choice: शाऊल और योनातान के साथ के
  rationale: यहाँ אֶת संगति या साथ होने का संकेत देता है; हिन्दी वाक्यांश मूल की दीर्घवृत्तीय रचना को स्पष्ट रूप से व्यक्त करता है।
- source_word: וַתִּמָּצֵא
  choice: पर ... के पास ये हथियार थे
  rationale: स्त्रीलिंग एकवचन क्रिया पहले आए हथियारों को सामूहिक रूप से फिर ग्रहण करती है। हिन्दी में स्पष्ट संज्ञा-संदर्भ और विरोधसूचक 'पर' स्वाभाविक है।
- source_word: לְשָׁאוּל וּלְיוֹנָתָן בְּנוֹ
  choice: शाऊल और उसके पुत्र योनातान के पास
  rationale: לְ उपलब्धता या अधिकार दर्शाता है, और בְּנוֹ योनातान को शाऊल के पुत्र के रूप में पहचानता है।
