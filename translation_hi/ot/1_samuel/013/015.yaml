  text: וַ/יָּ֣קָם שְׁמוּאֵ֗ל וַ/יַּ֛עַל מִן הַ/גִּלְגָּ֖ל גִּבְעַ֣ת בִּנְיָמִ֑ן וַ/יִּפְקֹ֣ד שָׁא֗וּל אֶת הָ/עָם֙ הַ/נִּמְצְאִ֣ים עִמּ֔/וֹ כְּ/שֵׁ֥שׁ מֵא֖וֹת אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/015.yaml
  text: Then Samuel arose and went up from Gilgal to Gibeah of Benjamin[a], and Saul counted the people who were present with him, about six hundred men.
translation:
  language: hi
  text: तब शमूएल उठा और गिलगाल से बिन्यामीन के गिबा[a] को ऊपर गया। शाऊल ने अपने साथ उपस्थित लोगों की गिनती की; वे लगभग छह सौ पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ प्राचीन साक्षी और अनुवाद “बिन्यामीन के गिबा” के स्थान पर “बिन्यामीन के गेबा” पढ़ते हैं। यहाँ इब्रानी पाठ में “बिन्यामीन के गिबा” है।
    reason: textual_variant
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: क़ूम का सामान्य कथात्मक अर्थ ‘उठना’ है; यह आगे प्रस्थान की क्रिया से अलग रहते हुए घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיַּעַל
  choice: चला गया
  rationale: आला में ऊपर जाने का दिशात्मक भाव हो सकता है, पर आधुनिक हिन्दी में इस यात्रा-वर्णन के लिए ‘चला गया’ अधिक स्वाभाविक है; गिलगाल से पहाड़ी क्षेत्र की ओर गति संदर्भ में निहित रहती है।
- source_word: מִן הַגִּלְגָּל
  choice: गिलगाल से
  rationale: यह प्रस्थान-स्थान बताने वाला सीधा पूर्वसर्गीय पद है।
- source_word: גִּבְעַת בִּנְיָמִן
  choice: बिन्यामीन के गिबा को
  rationale: मसोरेटिक स्वरांकन स्थान-नाम ‘गिबा’ का समर्थन करता है। ‘बिन्यामीन के’ उस स्थान की क्षेत्रीय पहचान को स्वाभाविक हिन्दी में व्यक्त करता है; वैकल्पिक पाठ ‘गेबा’ पादटिप्पणी में रखा गया है।
- source_word: וַיִּפְקֹד
  choice: गिनती की
  rationale: पाक़द सैन्य संदर्भ में गिनने या संख्या जानने को व्यक्त करता है। ‘गिनती की’ स्पष्ट है और औपचारिक सैन्य जमावड़े का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: הָעָם
  choice: लोगों
  rationale: आम का मूल अर्थ ‘लोग’ है। यद्यपि संदर्भ सैन्य है, अनुवाद इसे अनावश्यक रूप से ‘सैनिकों’ तक सीमित नहीं करता।
- source_word: הַנִּמְצְאִים עִמּוֹ
  choice: अपने साथ उपस्थित
  rationale: मत्सा का निफ़अल कृदंत शाब्दिक रूप से ‘पाए गए’ है, पर यहाँ मुहावरेदार अर्थ शाऊल के साथ उस समय उपस्थित लोगों का है।
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: लगभग छः सौ पुरुष
  rationale: उपसर्ग כְּ अनुमान सूचित करता है। אִישׁ की गणना सैन्य संदर्भ में वयस्क पुरुषों की ओर संकेत करती है।
