- source_word: קַּרְדֻּמִּים
  choice: कुल्हाड़ियों
  rationale: यह काटने के औज़ारों का सामान्य अर्थ देता है; कुछ संदर्भों में बसूले जैसे औज़ार भी अभिप्रेत हो सकते हैं।
- source_word: לְהַצִּיב הַדָּרְבָן
  choice: अंकुशों को ठीक करवाने
  rationale: क्रिया का अर्थ व्यवस्थित करना, दुरुस्त करना या फिर से जड़ना हो सकता है। 'ठीक करवाने' से केवल धार लगाने का अनावश्यक रूप से निश्चित दावा नहीं होता।
