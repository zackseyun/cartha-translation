base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/021.yaml
  text: And the charge was a pim for the plowshares[a], for the mattocks, for the three-pronged forks, and for the axes[b], and for setting the goads.
translation:
  language: hi
  text: और हल की फालों, कुदालों, तीन दाँतों वाले काँटों और कुल्हाड़ियों पर काम कराने, तथा अंकुशों को ठीक करवाने की फीस एक पीम[a] थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एक पीम संभवतः छोटे वजन या भुगतान की एक इकाई थी, जिसे प्रायः लगभग दो-तिहाई शेकेल माना जाता है। इब्रानी वाक्य कठिन है; इसका अर्थ यह भी हो सकता है कि यहाँ ‘पीम’ धार लगाने या घिसाई के लिए प्रयुक्त शब्द है, न कि उस काम की फीस।
    reason: cultural_note_and_alternative_reading
