source:
  edition: WLC
  text: וְ/אִ֨ישׁ יִשְׂרָאֵ֤ל רָאוּ֙ כִּ֣י צַר ל֔/וֹ כִּ֥י נִגַּ֖שׂ הָ/עָ֑ם וַ/יִּֽתְחַבְּא֣וּ הָ/עָ֗ם בַּ/מְּעָר֤וֹת וּ/בַֽ/חֲוָחִים֙ וּ/בַ/סְּלָעִ֔ים וּ/בַ/צְּרִחִ֖ים וּ/בַ/בֹּרֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/006.yaml
  text: When the men of Israel saw that they were in trouble[a], because the people were hard pressed, the people hid themselves in caves, in thickets, among rocks, in strongholds[c][b], and in pits.
translation:
  language: hi
  text: जब इस्राएल के पुरुषों ने देखा कि वे संकट में हैं, क्योंकि लोग बहुत दबाव में थे, तब लोग गुफाओं, काँटेदार झाड़ियों[a], चट्टानों, भूमिगत कोठरियों[b] और गड्ढों[c] में जा छिपे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “झाड़-झंखाड़ में”; इब्रानी शब्द दुर्लभ है और संभवतः विशेष रूप से काँटेदार झाड़ियों को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “तहखानों में,” “बिलों में” या “गढ़ों में”; इस इब्रानी शब्द का अर्थ अनिश्चित है और संभवतः भूमिगत छिपने के स्थानों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: या “जलकुंडों में।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: इस्राएल के पुरुषों
  rationale: एकवचन रूप אִישׁ यहाँ बहुवचन क्रिया के साथ सामूहिक अर्थ रखता है। यह अनुवाद सामूहिक और पुरुषवाचक दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רָאוּ
  choice: देखा
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ है; प्रसंग में स्थिति को समझ लेने का भाव भी इसी से स्पष्ट होता है।
- source_word: כִּי צַר לוֹ
  choice: कि वे संकट में हैं
  rationale: इब्रानी वाक्यांश संक्षिप्त है और सामूहिक कर्ता के बाद एकवचन सर्वनाम रखता है। हिन्दी में बहुवचन सामूहिक अर्थ स्वाभाविक है।
- source_word: כִּי נִגַּשׂ הָעָם
  choice: क्योंकि लोग बहुत दबाव में थे
  rationale: निफ़अल रूप दबाए या बुरी तरह घिरे होने का भाव देता है। ‘बहुत दबाव में’ सैन्य संकट को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיִּתְחַבְּאוּ
  choice: जा छिपे
  rationale: हितपएल रूप आत्मवाचक ढंग से छिपने को दर्शाता है; ‘जा छिपे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בַּמְּעָרוֹת
  choice: गुफाओं
  rationale: מְעָרָה का सीधा और सामान्य अर्थ ‘गुफा’ है।
- source_word: וּבַחֲוָחִים
  choice: काँटेदार झाड़ियों
  rationale: दुर्लभ शब्द संभवतः काँटेदार झाड़-झंखाड़ को दर्शाता है। मुख्य पाठ में विशिष्ट लेकिन सहज अर्थ रखा गया है और व्यापक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וּבַסְּלָעִים
  choice: चट्टानों
  rationale: סֶלַע चट्टान, शैल या कगार को दर्शाता है। सूची में ‘चट्टानों’ स्वाभाविक है और अनावश्यक भौगोलिक विशिष्टता नहीं जोड़ता।
- source_word: וּבַצְּרִחִים
  choice: भूमिगत कोठरियों
  rationale: यह दुर्लभ और अनिश्चित शब्द संभवतः तहखानों, भूमिगत भंडार-कक्षों या छिपने के गड्ढेनुमा स्थानों को दर्शाता है। ‘भूमिगत कोठरियाँ’ अगले शब्द ‘गड्ढों’ से भेद बनाए रखता है।
- source_word: וּבַבֹּרוֹת
  choice: गड्ढों
  rationale: בּוֹר का अर्थ गड्ढा, जलकुंड या कुएँ जैसा खोदा हुआ स्थान हो सकता है। ‘गड्ढों’ सबसे व्यापक और प्रसंगानुकूल चयन है।
