  text: וַ/יִּבְחַר ל֨/וֹ שָׁא֜וּל שְׁלֹ֣שֶׁת אֲלָפִים֮ מִ/יִּשְׂרָאֵל֒ וַ/יִּהְי֨וּ עִם שָׁא֜וּל אַלְפַּ֗יִם בְּ/מִכְמָשׂ֙ וּ/בְ/הַ֣ר בֵּֽית אֵ֔ל וְ/אֶ֗לֶף הָיוּ֙ עִם י֣וֹנָתָ֔ן בְּ/גִבְעַ֖ת בִּנְיָמִ֑ין וְ/יֶ֣תֶר הָ/עָ֔ם שִׁלַּ֖ח אִ֥ישׁ לְ/אֹהָלָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/002.yaml
  text: And Saul chose for himself three thousand men from Israel[a]. Two thousand were with Saul at Michmash and in the hill country of Bethel, and a thousand were with Jonathan at Gibeah of Benjamin. The rest of the people he sent away[b], each man to his tent.
translation:
  language: hi
  text: शाऊल ने इस्राएल में से अपने लिए तीन हज़ार पुरुष चुने। उनमें से दो हज़ार मिकमाश और बेतेल के पहाड़ी प्रदेश[a] में शाऊल के साथ थे, और एक हज़ार बिन्यामीन के गिबा में योनातान के साथ थे। बाकी लोगों को उसने भेज दिया—हर एक को अपने-अपने तम्बुओं को[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बेतेल की पहाड़ी पर।” इब्रानी पद किसी एक पहाड़ी अथवा बेतेल के आसपास के पहाड़ी प्रदेश, दोनों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: “हर एक को अपने-अपने तम्बुओं को” लोगों को उनके अपने निवास पर वापस भेजने का एक सामान्य इब्रानी मुहावरा है।
    reason: idiom_clarification
lexical_decisions:
- source_word: וַיִּבְחַר לוֹ
  choice: अपने लिए चुने
  rationale: בחר का मूल अर्थ ‘चुनना’ है और לוֹ व्यक्तिगत हित अथवा चयन को व्यक्त करता है; इसलिए ‘अपने लिए’ को स्पष्ट रूप से रखा गया है।
- source_word: שְׁלֹשֶׁת אֲלָפִים מִיִּשְׂרָאֵל
  choice: इस्राएल में से ... तीन हज़ार पुरुष
  rationale: מִן स्रोत या समूह में से चयन को दर्शाता है। सैनिक संदर्भ के कारण हिंदी में ‘पुरुष’ जोड़ा गया है, पर संख्या और स्रोत यथावत हैं।
- source_word: וַיִּהְיוּ עִם שָׁאוּל
  choice: शाऊल के साथ थे
  rationale: यह सैनिकों की तैनाती बताने वाला सीधा कथन है; ‘रहे’ जैसी अतिरिक्त निरंतरता नहीं जोड़ी गई।
- source_word: בְּמִכְמָשׂ
  choice: मिकमाश में
  rationale: स्थानसूचक בְּ का स्वाभाविक हिंदी रूप ‘में’ है।
- source_word: וּבְהַר בֵּית אֵל
  choice: और बेतेल के पहाड़ी प्रदेश में
  rationale: הַר किसी पर्वत/पहाड़ी के साथ व्यापक पहाड़ी क्षेत्र को भी सूचित कर सकता है। प्रसंग में क्षेत्रीय अर्थ स्वाभाविक है, जबकि विशिष्ट पहाड़ी का विकल्प टिप्पणी में सुरक्षित है।
- source_word: בְּגִבְעַת בִּנְיָמִין
  choice: बिन्यामीन के गिबा में
  rationale: मसोरेटिक स्वरांकन גִבְעַת यहाँ ‘गिबा’ का समर्थन करता है; संबंधसूचक संरचना को सहज हिंदी क्रम में रखा गया है।
- source_word: וְיֶתֶר הָעָם
  choice: बाकी लोगों को
  rationale: עָם का शाब्दिक अर्थ ‘लोग’ है। सैन्य संदर्भ होने पर भी ‘सैनिक’ जोड़ने के बजाय स्रोत की व्यापक अभिव्यक्ति रखी गई है।
- source_word: שִׁלַּח
  choice: विदा कर दिया
  rationale: यहाँ क्रिया शेष लोगों को सक्रिय दल से वापस भेजने का भाव रखती है; ‘विदा कर दिया’ आधुनिक हिंदी में उस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אִישׁ לְאֹהָלָיו
  choice: हर एक को उसके तम्बू में
  rationale: इब्रानी मुहावरे की ठोस छवि को ‘तम्बू’ के साथ सुरक्षित रखा गया है; इसका व्यावहारिक अर्थ अपने निवास को लौटना है।
