- source_word: נְצִיב פְּלִשְׁתִּים
  choice: पलिश्तियों की छावनी
  rationale: נְצִיב अधिकारी, तैनात चौकी या सैन्य दल का सूचक हो सकता है। निकटवर्ती सैन्य संदर्भ में 'छावनी' सर्वाधिक उपयुक्त है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: נִבְאַשׁ
  choice: दुर्गन्ध-समान हो गया है
  rationale: क्रिया का शाब्दिक बिंब दुर्गन्ध उत्पन्न होने का है और लाक्षणिक अर्थ घृणित होना है। हिन्दी रूप मूल बिंब और आशय दोनों को बनाए रखता है।
- source_word: בַּפְּלִשְׁתִּים
  choice: पलिश्तियों के लिए
  rationale: यह संबंध उन पलिश्तियों से है जिनकी दृष्टि में इस्राएल घृणित हो गया; 'के लिए' इसे संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּצָּעֲקוּ
  choice: एकत्र होने के लिए बुलाया गया
  rationale: यद्यपि मूल धातु प्रायः पुकारने के लिए आती है, यहाँ सैन्य जुटान के संदर्भ में लोगों को बुलाए जाने का भाव है।
- source_word: אַחֲרֵי שָׁאוּל
  choice: शाऊल के पीछे
  rationale: शाब्दिक स्थानिक-सैन्य अभिव्यक्ति को सुरक्षित रखा गया है; इसका आशय शाऊल का अनुसरण करते हुए उसके नेतृत्व में जुटना है।
- source_word: הַגִּלְגָּל
  choice: गिलगाल में
  rationale: यहाँ गिलगाल सभा-स्थान है; हिन्दी में 'में' स्वाभाविक स्थानवाचक रूप है।
