  yaml_path: translation/ot/1_samuel/013/004.yaml
  text: And all Israel heard it said[a], “Saul has struck down the Philistine garrison[c][b], and Israel has also become odious to the Philistines.” Then the people were called out to join Saul at Gilgal.
translation:
  language: hi
  text: 'और समस्त इस्राएल ने यह समाचार सुना: “शाऊल ने पलिश्तियों की छावनी[a] को मार गिराया है, और इस्राएल पलिश्तियों की नज़र में घृणित[b] हो गया है।” तब लोगों को गिलगाल में शाऊल के पीछे एकत्र होने के लिए बुलाया गया[c]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्तियों के अधिकारी” अथवा “पलिश्तियों की चौकी।” इब्रानी शब्द किसी अधिकारी या तैनात सैन्य चौकी/दल को सूचित कर सकता है; यहाँ सैन्य संदर्भ “छावनी” के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “इस्राएल पलिश्तियों के लिए दुर्गन्ध बन गया था”; यह उनके लिए अत्यन्त घृणित हो जाने का मुहावरा है।'
    reason: lexical_alternative
  - marker: c
    text: या “लोगों को गिलगाल में शाऊल के पीछे इकट्ठा किया गया।” इब्रानी अभिव्यक्ति सम्भवतः युद्ध के लिए शाऊल के नेतृत्व में लोगों को जुटाने की ओर संकेत करती है।
    reason: lexical_alternative
