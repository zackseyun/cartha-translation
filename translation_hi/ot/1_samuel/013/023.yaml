lexical_decisions:
- source_word: וַיֵּצֵא
  choice: निकल गई
  rationale: יצא के सामान्य गतिसूचक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; सैन्य चढ़ाई का अतिरिक्त भाव नहीं जोड़ता।
- source_word: מַצַּב
  choice: चौकी
  rationale: इस सैन्य प्रसंग में यह किसी तैनात सैनिक दल या उसकी चौकी को सूचित कर सकता है। हिन्दी में ‘चौकी’ संक्षिप्त और सहज है, जबकि ‘सैनिक-दल’ सम्भव वैकल्पिक अर्थ है।
- source_word: פְּלִשְׁתִּים
  choice: पलिश्तियों की
  rationale: जनसमूह के नाम का प्रचलित हिन्दी रूप और इब्रानी संबंध-रचना का स्वाभाविक निरूपण।
- source_word: אֶל
  choice: की ओर
  rationale: दिशा को व्यक्त करता है और इब्रानी में लक्ष्य तक पहुँचने की अपेक्षा केवल दिशा होने की सम्भावना को बनाए रखता है।
- source_word: מַעֲבַר
  choice: दर्रे
  rationale: भूगोल और सैन्य प्रसंग में मार्ग या सँकरे पारगमन-स्थान का स्वाभाविक हिन्दी रूप; ‘पार जाने की जगह’ भी सम्भव है।
- source_word: מִכְמָשׂ
  choice: मिकमाश
  rationale: स्थान-नाम का स्रोत-निकट और हिन्दी में सुबोध लिप्यंतरण।
