  text: Saul was one year old when he became king[a], and he reigned two years over Israel.
translation:
  language: hi
  text: जब शाऊल राजा बना, तब वह एक वर्ष का था[a], और उसने इस्राएल पर दो वर्ष तक राज किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी पाठ कठिन है और संभवतः उसमें कुछ शब्द या अंक लुप्त हैं। शाब्दिक रूप से यह कहता है, “शाऊल अपने राजा बनने के समय एक वर्ष का पुत्र था, और उसने इस्राएल पर दो वर्ष राज किया।” कुछ प्राचीन पाठ-साक्ष्य और बाद के प्रस्ताव बड़ी संख्याएँ जोड़ते हैं—जैसे शाऊल की आयु के लिए “तीस” और उसके शासनकाल के लिए “बयालीस।”
    reason: textual_variant
lexical_decisions:
- source_word: בֶּן שָׁנָה
  choice: वह एक वर्ष का था
  rationale: यह इब्रानी मुहावरे का सामान्य और स्वाभाविक हिन्दी अर्थ है। यद्यपि यहाँ इससे ऐतिहासिक कठिनाई उत्पन्न होती है, मुख्य पाठ में मसोरेटी शब्दावली सुरक्षित रखी गई है और समस्या पादटिप्पणी में स्पष्ट की गई है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का हिन्दी बाइबल परंपरा में प्रचलित लिप्यंतरण।
- source_word: בְּמָלְכוֹ
  choice: जब शाऊल राजा बना
  rationale: पूर्वसर्ग सहित यह रूप राजगद्दी पर बैठने के समय को व्यक्त करता है; यह हिन्दी में स्वाभाविक और प्रसंगानुकूल अनुवाद है।
- source_word: וּשְׁתֵּי שָׁנִים
  choice: और ... दो वर्ष तक
  rationale: मसोरेटी पाठ में दिए शासनकाल को सीधे व्यक्त करता है; ‘तक’ अवधि को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: מָלַךְ
  choice: राज किया
  rationale: क्रिया का सामान्य अर्थ ‘राज करना’ है और राजकीय सूत्र में यही सहज हिन्दी प्रयोग है।
- source_word: עַל יִשְׂרָאֵל
  choice: इस्राएल पर
  rationale: शासन-सूचक क्रिया के साथ עַל का स्वाभाविक हिन्दी रूप ‘पर’ है।
theological_decisions:
- issue: मसोरेटी पाठ में कठिन या अपूर्ण प्रतीत होने वाला राजकीय सूत्र
  choice: मुख्य पाठ में उपलब्ध मसोरेटी शब्दों और संख्याओं को बिना अनुमानित पूर्ति के रखना
  alternative: शाऊल की आयु ‘तीस वर्ष’ और उसके शासनकाल को ‘बयालीस वर्ष’ करना, अथवा पाठ में संख्याओं के लुप्त होने का संकेत मुख्य पाठ में देना
  rationale: प्रदत्त मूल स्रोत WLC का मसोरेटी पाठ है। इसलिए अनुमान या सामंजस्य के आधार पर संख्याएँ जोड़ने के बजाय वर्तमान इब्रानी पाठ को मुख्य पाठ में रखा गया है और महत्वपूर्ण पाठालोचनात्मक कठिनाई पादटिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। मुख्य पाठ में इब्रानी मुहावरे का स्वाभाविक अर्थ दिया गया है, जबकि पाठ की स्पष्ट कठिनाई और संभावित वैकल्पिक संख्याएँ पादटिप्पणी में पारदर्शी ढंग से रखी गई हैं।
