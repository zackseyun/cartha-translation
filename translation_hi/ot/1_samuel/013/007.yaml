source:
  edition: WLC
  text: וְ/עִבְרִ֗ים עָֽבְרוּ֙ אֶת הַ/יַּרְדֵּ֔ן אֶ֥רֶץ גָּ֖ד וְ/גִלְעָ֑ד וְ/שָׁאוּל֙ עוֹדֶ֣/נּוּ בַ/גִּלְגָּ֔ל וְ/כָל הָ/עָ֖ם חָרְד֥וּ אַחֲרָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/007.yaml
  text: And Hebrews crossed over the Jordan into the land of Gad and Gilead[a]. But Saul was still at Gilgal[b], and all the people trembled behind him.
translation:
  language: hi
  text: और इब्री लोग यरदन को पार करके गाद और गिलाद के प्रदेश में चले गए। पर शाऊल अब भी गिलगाल में था, और सभी लोग उसके पीछे डर से काँप रहे थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עִבְרִים
  choice: इब्री लोग
  rationale: यह मूल शब्द का सीधा जातीय नाम है। इसे ‘इस्राएली’ कहने से संदर्भ में निहित संभावित विशिष्ट या बाहरी संबोधन का अर्थ पहले ही तय हो जाता।
- source_word: עָבְרוּ אֶת הַיַּרְדֵּן
  choice: यरदन पार करके
  rationale: हिन्दी में नदी पार करने की क्रिया को स्वाभाविक रूप से व्यक्त करता है और עבר की गति का भाव बनाए रखता है।
- source_word: אֶרֶץ גָּד וְגִלְעָד
  choice: गाद और गिलाद के प्रदेश में
  rationale: אֶרֶץ यहाँ भौगोलिक भूभाग या क्षेत्र को दर्शाता है; ‘प्रदेश’ आधुनिक हिन्दी में इस अर्थ को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: עוֹדֶנּוּ
  choice: अब भी ... था
  rationale: यह रूप किसी स्थान पर स्थिति के जारी रहने का भाव देता है।
- source_word: בַגִּלְגָּל
  choice: गिलगाल में
  rationale: हिन्दी में नगर या छावनी-जैसे स्थान के साथ ‘में’ स्वाभाविक है।
- source_word: חָרְדוּ
  choice: डर से काँप रहे थे
  rationale: क्रिया भयजनित शारीरिक कंपकंपी का सजीव भाव रखती है; ‘डर से’ प्रसंगगत कारण स्पष्ट करता है।
- source_word: אַחֲרָיו
  choice: उसके पीछे के
  rationale: स्थानगत ‘पीछे’ और किसी नेता के साथ लगे रहने—दोनों संभावित भावों को यथासंभव बनाए रखता है।
theological_decisions:
- issue: עִבְרִים की पहचान
  choice: इब्री लोग
  alternative: इस्राएली
  rationale: मूल पाठ ‘इब्री’ पद का प्रयोग करता है; इसे ‘इस्राएली’ में बदलना संभावित कथात्मक या सामाजिक भेद को मिटा सकता है।
- issue: אַחֲרָיו का संबंधगत अर्थ
  choice: उसके पीछे के
  alternative: उसके पीछे चलनेवाले
  rationale: चुना हुआ रूप मूल की स्थानगत छवि को रखता है और साथ चलने के अर्थ को पूरी तरह बंद नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘इब्री’ मूल की चिह्नित जातीय संज्ञा को सुरक्षित रखता है; ‘डर से काँप रहे थे’ भय की तीव्रता को स्वाभाविक हिन्दी में व्यक्त करता है।
