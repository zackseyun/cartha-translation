  yaml_path: translation/ot/1_samuel/013/019.yaml
  text: No blacksmith could be found in all the land of Israel[a], because the Philistines said, “Otherwise the Hebrews will make swords or spears.”
translation:
  language: hi
  text: इस्राएल के पूरे देश में कोई लोहार नहीं मिलता था, क्योंकि पलिश्तियों ने कहा था, “कहीं ऐसा न हो कि इब्री लोग तलवार या भाला[a] बना लें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में “तलवार” और “भाला” एकवचन में हैं, पर यहाँ वे सामान्य रूप से तलवारों और भालों की श्रेणी का बोध करा सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָרָשׁ
  choice: लोहार
  rationale: सैन्य प्रसंग और अगले पदों में हथियारों तथा औज़ारों की धार तेज़ करने के उल्लेख के कारण यहाँ सामान्य कारीगर नहीं, धातु का काम करने वाला लोहार अभिप्रेत है।
- source_word: יִמָּצֵא
  choice: नहीं मिलता था
  rationale: निफ़अल रूप किसी के पाए जाने या उपस्थित होने का भाव देता है; यह हिंदी कथात्मक शैली में उसकी प्रभावी अनुपस्थिति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּכֹל אֶרֶץ יִשְׂרָאֵל
  choice: इस्राएल के पूरे देश में
  rationale: यह मूल के व्यापक भौगोलिक कथन को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लोहारों की अनुपस्थिति का कारण प्रस्तुत करता है।
- source_word: אמר
  choice: कहा था
  rationale: पूर्वकालिक हिंदी रूप स्पष्ट करता है कि पलिश्तियों की यह नीति उस स्थिति के पीछे थी; इससे मूल कथन का कारणात्मक संबंध स्वाभाविक बनता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह रोकथाम से जुड़ी आशंका को व्यक्त करने वाला स्वाभाविक हिंदी प्रयोग है और मूल के ‘ऐसा न हो कि’ भाव को बनाए रखता है।
- source_word: הָעִבְרִים
  choice: इब्री लोग
  rationale: मूल में विशिष्ट जातीय पद ‘इब्री’ है, जिसे ‘इस्राएली’ बनाकर समरूप नहीं किया गया।
- source_word: יַעֲשׂוּ
  choice: बना लें
  rationale: פֶּן के साथ यह आशंकित और रोके जाने वाले संभावित परिणाम को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: חֶרֶב אוֹ חֲנִית
  choice: तलवार या भाला
  rationale: मूल के एकवचन संज्ञा-रूप और ‘या’ संबंध को मुख्य पाठ में सुरक्षित रखा गया है; ये संज्ञाएँ सामान्य श्रेणी का बोध भी करा सकती हैं।
