  yaml_path: translation/ot/1_samuel/013/016.yaml
  text: Saul and Jonathan his son[a], and the people who were with them, were staying in Geba of Benjamin[b], while the Philistines had encamped at Michmash.
translation:
  language: hi
  text: शाऊल, उसका पुत्र योनातान और उनके साथ मौजूद लोग[a] बिन्यामीन के गेबा[b] में ठहरे हुए थे, जबकि पलिश्तियों ने मिकमाश में पड़ाव डाल रखा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वे लोग जो उनके साथ पाए गए”; आशय सम्भवतः उन लोगों से है जो दूसरों के तितर-बितर हो जाने के बाद भी शाऊल और योनातान के साथ रह गए थे।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी स्थाननाम “गेबा” है, “गिबा” नहीं। इस प्रसंग में ये आपस में सम्बन्धित, पर अलग-अलग स्थान हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יֹשְׁבִים
  choice: ठहरे हुए थे
  rationale: यहाँ ישׁב का कृदन्त किसी स्थान पर बने रहने या ठहरने का भाव देता है; केवल शारीरिक रूप से ‘बैठने’ का नहीं।
- source_word: הַנִּמְצָא עִמָּם
  choice: उनके साथ मौजूद लोग
  rationale: शाब्दिक अर्थ ‘जो उनके साथ पाया गया’ है। आधुनिक हिन्दी में ‘मौजूद लोग’ स्वाभाविक है और उन लोगों की ओर संकेत करता है जो उस समय शाऊल और योनातान के साथ थे; शाब्दिक बारीकी पादटिप्पणी में रखी गई है।
- source_word: בְּגֶבַע בִּנְיָמִן
  choice: बिन्यामीन के गेबा में
  rationale: मसोरेटिक पाठ का स्थाननाम גֶּבַע ‘गेबा’ है, ‘गिबा’ नहीं। सम्बन्धसूचक हिन्दी रचना ‘बिन्यामीन के गेबा’ स्थान की क्षेत्रीय पहचान स्पष्ट करती है।
- source_word: חָנוּ
  choice: पड़ाव डाल रखा था
  rationale: חנה सैन्य दल के डेरा या पड़ाव डालने के लिए प्रयुक्त सामान्य क्रिया है। यह रूप पलिश्तियों की स्थापित सैन्य स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְמִכְמָשׂ
  choice: मिकमाश में
  rationale: स्थाननाम को लिप्यंतरित किया गया है; हिन्दी में किसी स्थान पर सैन्य पड़ाव के लिए ‘में’ स्वाभाविक है।
- source_word: וְ
  choice: और / जबकि
  rationale: आरम्भिक וְ को नाम-समूहों के बीच ‘और’ से व्यक्त किया गया है; अंतिम खंड के प्रसंगगत समानांतर-विरोध को ‘जबकि’ स्पष्ट करता है। कोई अस्रोत ‘अब’ नहीं जोड़ा गया।
