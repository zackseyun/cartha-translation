  text: וָ/אֹמַ֗ר עַ֠תָּה יֵרְד֨וּ פְלִשְׁתִּ֤ים אֵלַ/י֙ הַ/גִּלְגָּ֔ל וּ/פְנֵ֥י יְהוָ֖ה לֹ֣א חִלִּ֑יתִי וָֽ/אֶתְאַפַּ֔ק וָ/אַעֲלֶ֖ה הָ/עֹלָֽה׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/012.yaml
  text: So I said[a], ‘Now the Philistines will come down against me at Gilgal[b], and I have not sought the favor of Yahweh.’ So I forced myself and offered up the burnt offering.
translation:
  language: hi
  text: तब मैंने कहा, “अब पलिश्ती गिलगाल में मेरे विरुद्ध उतर आएँगे, और मैंने याहवे की कृपा पाने के लिए उससे विनती नहीं की है[a]।” इसलिए मैंने अपने आपको विवश किया[b] और होमबलि चढ़ाई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में यहाँ ‘याहवे के मुख’ का मुहावरा है: “मैंने याहवे के मुख/सम्मुख अनुनय नहीं किया।” इसका अर्थ उसकी कृपा पाने के लिए विनती करना है।'
    reason: lexical_alternative
  - marker: b
    text: या, “मैंने अपने आपको रोका।” इब्रानी क्रिया का अर्थ स्वयं को रोकना या अपने ऊपर नियंत्रण रखना भी हो सकता है; यहाँ सम्भवतः भाव है कि शाऊल ने स्वयं को यह कदम उठाने के लिए विवश किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: तब मैंने कहा
  rationale: वाव-क्रमिक रूप शाऊल के स्पष्टीकरण को कथा-क्रम में आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יֵרְדוּ פְלִשְׁתִּים אֵלַי
  choice: पलिश्ती मेरे विरुद्ध उतर आएँगे
  rationale: ירד के उतरने वाले दिशात्मक अर्थ को रखा गया है, जबकि אֵלַי को सैन्य प्रसंग के अनुसार ‘मेरे विरुद्ध’ कहा गया है।
- source_word: הַגִּלְגָּל
  choice: गिलगाल में
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; प्रसंग में वहीं संभावित मुठभेड़ होने का भाव है।
- source_word: וּפְנֵי יְהוָה לֹא חִלִּיתִי
  choice: मैंने याहवे की कृपा पाने के लिए उससे विनती नहीं की है
  rationale: ‘मुख’ और חלה से बना इब्रानी मुहावरा किसी की कृपा पाने के लिए उससे अनुनय-विनय करने का अर्थ देता है। अर्थ मुख्य पाठ में स्पष्ट किया गया और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम יהוה को शीर्षक से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: וָאֶתְאַפַּק
  choice: मैंने अपने आपको विवश किया
  rationale: हित्पएल रूप यहाँ दबाव या अनिच्छा के बावजूद स्वयं को कार्य करने के लिए बाध्य करने का भाव दे सकता है। ‘अपने आपको रोका’ सम्भव वैकल्पिक अर्थ है, जिसे पादटिप्पणी में रखा गया है।
- source_word: וָאַעֲלֶה הָעֹלָה
  choice: होमबलि चढ़ाई
  rationale: עלה और עֹלָה का संयुक्त प्रयोग बलिदान चढ़ाने की पारिभाषिक अभिव्यक्ति है; ‘होमबलि चढ़ाई’ हिन्दी में संक्षिप्त और परिचित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त हुआ है। ‘याहवे’ उसे उपाधि में बदले बिना निकट लिप्यंतरण के रूप में सुरक्षित रखता है।
- issue: शाऊल के कथन में स्वयं को विवश करने का भाव
  choice: मैंने अपने आपको विवश किया
  alternative: मैंने अपने आपको रोका/संयमित किया
  rationale: प्रसंग में शाऊल अपने किए हुए बलिदान को दबाव में उठाया गया कदम बताकर उचित ठहरा रहा है। फिर भी क्रिया में आत्म-संयम का सम्भव अर्थ है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। सैन्य दिशा के लिए ‘उतर आएँगे’, उपासना-संबंधी क्रिया के लिए ‘होमबलि चढ़ाई’, और ईश्वरीय नाम के लिए ‘याहवे’ प्रयुक्त है। दोनों पादटिप्पणी-चिह्न संबंधित पदों के तुरंत बाद रखे गए हैं।
