source:
  edition: WLC
  text: וַ/יַּ֣ךְ יוֹנָתָ֗ן אֵ֣ת נְצִ֤יב פְּלִשְׁתִּים֙ אֲשֶׁ֣ר בְּ/גֶ֔בַע וַֽ/יִּשְׁמְע֖וּ פְּלִשְׁתִּ֑ים וְ/שָׁאוּל֩ תָּקַ֨ע בַּ/שּׁוֹפָ֤ר בְּ/כָל הָ/אָ֨רֶץ֙ לֵ/אמֹ֔ר יִשְׁמְע֖וּ הָ/עִבְרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/003.yaml
  text: Jonathan struck down the Philistine garrison that was at Geba[a], and the Philistines heard of it. Then Saul blew the ram's horn throughout all the land, saying[b], “Let the Hebrews hear!”
translation:
  language: hi
  text: योनातान ने गेबा में पलिश्तियों की चौकी[a] पर प्रहार किया, और पलिश्तियों ने यह बात सुन ली। तब शाऊल ने सारे देश में नरसिंगा[b] फूँका और कहा, “इब्रानी लोग सुन लें!”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पलिश्तियों के अधिकारी/हाकिम।” इब्रानी शब्द किसी नियुक्त अधिकारी अथवा सैनिक चौकी—दोनों के लिए प्रयुक्त हो सकता है; यहाँ युद्ध के प्रसंग में “चौकी” अधिक उपयुक्त जान पड़ता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द शोफार उस वाद्य को दर्शाता है जो पशु के सींग से, प्रायः मेढ़े के सींग से, बनाया जाता था; इसे सामान्य रूप से “तुरही” भी कहा जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּךְ
  choice: प्रहार किया
  rationale: नכה का मूल भाव मारना या प्रहार करना है। यहाँ लक्ष्य किसी व्यक्ति के साथ-साथ सैनिक चौकी भी हो सकता है, इसलिए ‘प्रहार किया’ सैन्य कार्रवाई को व्यक्त करता है, पर अनावश्यक रूप से यह तय नहीं करता कि सब मारे गए या चौकी पूरी तरह नष्ट हुई।
- source_word: נְצִיב פְּלִשְׁתִּים
  choice: पलिश्तियों की चौकी
  rationale: नְצִיב किसी नियुक्त अधिकारी अथवा स्थापित सैनिक चौकी को सूचित कर सकता है। युद्ध-संदर्भ में ‘चौकी’ स्वाभाविक है, जबकि दूसरी सम्भावना पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בְּגֶבַע
  choice: गेबा में
  rationale: गेबा स्थान-नाम है; हिन्दी में किसी बस्ती या क्षेत्र के भीतर स्थित सैनिक चौकी के लिए ‘में’ सहज है।
- source_word: וַיִּשְׁמְעוּ פְלִשְׁתִּים
  choice: पलिश्तियों ने यह बात सुन ली
  rationale: इब्रानी में कर्म व्यक्त नहीं है, पर प्रसंग से योनातान की कार्रवाई का समाचार अभिप्रेत है। ‘यह बात’ उसी निहित संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करती है।
- source_word: תָּקַע בַּשּׁוֹפָר
  choice: नरसिंगा फूँका
  rationale: שׁוֹפָר धातु की तुरही नहीं, सींग से बना वाद्य है। ‘नरसिंगा’ हिन्दी में इस सांस्कृतिक वस्तु का संक्षिप्त और परिचित नाम है; अधिक जानकारी पादटिप्पणी में दी गई है।
- source_word: בְּכָל הָאָרֶץ
  choice: सारे देश में
  rationale: यहाँ הָאָרֶץ का अर्थ पूरी पृथ्वी नहीं, संबंधित देश या भूभाग है। ‘सारे देश में’ व्यापक सार्वजनिक घोषणा का भाव देता है।
- source_word: לֵאמֹר
  choice: और कहा
  rationale: प्रत्यक्ष कथन का परिचय देने वाले इब्रानी प्रयोग को सहज हिन्दी वाक्य-रचना में व्यक्त किया गया है।
- source_word: יִשְׁמְעוּ הָעִבְרִים
  choice: इब्रानी लोग सुन लें!
  rationale: अपूर्ण क्रिया यहाँ आदेशात्मक या आह्वानात्मक बल रखती है। ‘सुन लें’ सार्वजनिक घोषणा का भाव बनाए रखता है, और הָעִבְרִים के लिए ‘इब्रानी लोग’ रखा गया है, न कि व्याख्यात्मक रूप से ‘इस्राएली’।
