  register: आधुनिक मानक हिन्दी में संक्षिप्त, कथात्मक और गरिमापूर्ण शैली अपनाई गई है। सैन्य रचना के लिए ‘दल’, स्थल-नामों के लिए देवनागरी लिप्यंतरण, और दिशासूचक प्रत्यय के लिए ‘की ओर’ रखा गया है।
