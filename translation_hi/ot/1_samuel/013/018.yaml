  text: וְ/הָ/רֹ֤אשׁ אֶחָד֙ יִפְנֶ֔ה דֶּ֖רֶךְ בֵּ֣ית חֹר֑וֹן וְ/הָ/רֹ֨אשׁ אֶחָ֤ד יִפְנֶה֙ דֶּ֣רֶךְ הַ/גְּב֔וּל הַ/נִּשְׁקָ֛ף עַל גֵּ֥י הַצְּבֹעִ֖ים הַ/מִּדְבָּֽרָ/ה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/018.yaml
  text: and one company turned toward the road to Beth-horon[a], and one company turned toward the road of the border that overlooks the Valley of Zeboim[b], toward the wilderness.
translation:
  language: hi
  text: और एक दल बेथ-होरोन के मार्ग की ओर मुड़ा, और एक दल उस सीमा के मार्ग की ओर मुड़ा, जो सबोईम की घाटी के ऊपर से मरुभूमि की ओर देखती है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָרֹאשׁ אֶחָד
  choice: एक दल
  rationale: רֹאשׁ का शाब्दिक अर्थ ‘सिर’ है, पर यहाँ पिछले पद में बताए गए लुटेरे दल की सैन्य टुकड़ियों में से एक भाग अभिप्रेत है। ‘एक दल’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: יִפְנֶה
  choice: की ओर मुड़ा
  rationale: פנה दिशा बदलने या किसी ओर मुड़ने को व्यक्त करता है; सैन्य गतिविधि के प्रसंग में यह अनुवाद दिशागत गति को सहज रूप से प्रकट करता है।
- source_word: דֶּרֶךְ
  choice: मार्ग
  rationale: דֶּרֶךְ यहाँ यात्रा के वास्तविक रास्ते को दर्शाता है; ‘मार्ग’ स्पष्ट और गरिमापूर्ण हिन्दी है।
- source_word: בֵּית חֹרוֹן
  choice: बेथ-होरोन
  rationale: स्थान-नाम को ध्वन्यात्मक रूप से देवनागरी में लिखा गया है।
- source_word: הַגְּבוּל
  choice: सीमा
  rationale: גְּבוּל किसी भूभाग की सीमा या सरहद को दर्शाता है; यहाँ स्थलाकृतिक वर्णन में ‘सीमा’ उपयुक्त है।
- source_word: הַנִּשְׁקָף
  choice: जो ... के ऊपर से दिखाई देती है
  rationale: שׁקף का निफ़अल कृदंत किसी ऊँचे स्थान से नीचे की ओर खुलने या दिखाई देने का भाव देता है। हिन्दी में यह वाक्यांश भू-दृश्य को स्वाभाविक ढंग से व्यक्त करता है और यह तय नहीं करता कि कर्ता कोई पहाड़ी धार है या व्यापक सीमा-क्षेत्र।
- source_word: גֵּי הַצְּבֹעִים
  choice: सबोईम की तराई
  rationale: यह मुख्यतः स्थान-नाम प्रतीत होता है, इसलिए צְבֹעִים को लिप्यंतरित किया गया है। גֵּי के लिए ‘तराई’ स्थलाकृतिक घाटी का सरल हिन्दी रूप है।
- source_word: הַמִּדְבָּרָה
  choice: मरुभूमि की ओर
  rationale: מִדְבָּר पर लगा दिशासूचक प्रत्यय गति की दिशा बताता है; ‘की ओर’ इस बारीकी को स्पष्ट रखता है।
