base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/008.yaml
  text: He waited seven days[a], until the appointed time that Samuel had set, but Samuel did not come to Gilgal[b], and the people were scattering from him.
translation:
  language: hi
  text: वह सात दिन तक—उस नियत समय तक, जो शमूएल ने ठहराया था[a]—प्रतीक्षा करता रहा। पर शमूएल गिलगाल नहीं आया, और लोग उसके पास से छिटकते जा रहे थे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी संबंधवाचक वाक्यांश संक्षिप्त है; इसे इस प्रकार भी व्यक्त किया जा सकता है: “उस नियत समय तक, जिसे शमूएल ने निर्धारित किया था।”'
    reason: lexical_alternative
  - marker: b
    text: अर्थात लोग शाऊल को छोड़कर जा रहे थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּיחֶל
  choice: प्रतीक्षा करता रहा
  rationale: संदर्भ में क्रिया किसी अवधि तक प्रतीक्षा करने को व्यक्त करती है; अपूर्णतासूचक हिंदी रूप लगातार प्रतीक्षा का स्वाभाविक बोध देता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह शाऊल की प्रतीक्षा की अवधि बताने वाला सीधा संख्यावाचक पद है।
- source_word: לַמּוֹעֵד
  choice: उस नियत समय तक
  rationale: מוֹעֵד पहले से निर्धारित समय को दर्शाता है; इस प्रसंग में לַ का कालगत अर्थ लक्ष्य-सीमा, अर्थात ‘तक’, है।
- source_word: אֲשֶׁר שְׁמוּאֵל
  choice: जो शमूएल ने ठहराया था
  rationale: इब्रानी संबंधवाचक उपवाक्य संक्षिप्त और अंडाकार है; पूर्व प्रसंग के आधार पर नियत समय ठहराने की निहित क्रिया हिंदी में स्पष्ट करनी पड़ती है।
- source_word: וְלֹא בָא שְׁמוּאֵל הַגִּלְגָּל
  choice: पर शमूएल गिलगाल नहीं आया
  rationale: वाव यहाँ अपेक्षित आगमन और वास्तविक स्थिति का विरोध प्रकट करता है; ‘पर’ आधुनिक हिंदी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּפֶץ הָעָם
  choice: और लोग ... तितर-बितर हो रहे थे
  rationale: क्रिया लोगों के बिखरने या दल छोड़ने की प्रक्रिया बताती है; ‘हो रहे थे’ उस जारी प्रक्रिया को सुरक्षित रखता है।
- source_word: מֵעָלָיו
  choice: उसके पास से
  rationale: सर्वनाम का स्वाभाविक संकेत शाऊल की ओर है। ‘उसके पास से’ इब्रानी संबंध को बनाए रखते हुए बताता है कि लोग उसे छोड़कर जा रहे थे।
