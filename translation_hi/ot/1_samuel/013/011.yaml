    text: शाब्दिक रूप से, “दिनों के नियत समय पर”; सम्भवतः पहले से निश्चित अवधि की ओर संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “एकत्र हो रहे हैं।”
    reason: lexical_alternative
