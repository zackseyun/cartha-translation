  text: तब शमूएल ने कहा, “तुमने यह क्या किया?” शाऊल ने कहा, “क्योंकि मैंने देखा कि लोग मुझसे दूर तितर-बितर हो रहे हैं, तुम नियत समय[a] पर नहीं आए, और पलिश्ती मिकमाश में इकट्ठे हो रहे हैं[b],”
