  text: וּ/פְלִשְׁתִּ֞ים נֶאֶסְפ֣וּ לְ/הִלָּחֵ֣ם עִם יִשְׂרָאֵ֗ל שְׁלֹשִׁ֨ים אֶ֤לֶף רֶ֨כֶב֙ וְ/שֵׁ֤שֶׁת אֲלָפִים֙ פָּרָשִׁ֔ים וְ/עָ֕ם כַּ/ח֛וֹל אֲשֶׁ֥ר עַל שְׂפַֽת הַ/יָּ֖ם לָ/רֹ֑ב וַֽ/יַּעֲלוּ֙ וַ/יַּחֲנ֣וּ בְ/מִכְמָ֔שׂ קִדְמַ֖ת בֵּ֥ית אָֽוֶן׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/005.yaml
  text: 'And the Philistines gathered to fight against Israel: thirty thousand chariots[a], and six thousand horsemen, and troops as numerous as the sand that is on the seashore. They went up and camped at Mikmash, east of Beth-aven.'
translation:
  language: hi
  text: 'और पलिश्ती इस्राएल से लड़ने के लिए इकट्ठे हुए: तीस हज़ार रथ[a], छह हज़ार घुड़सवार, और समुद्र के तट की रेत के समान असंख्य सैनिक। वे ऊपर चढ़े और मिकमाश में, बेत-आवेन के पूर्व में, छावनी डाली।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में “तीस हज़ार रथ” है। प्रसंग में इतनी बड़ी संख्या असामान्य लगने के कारण कुछ व्याख्याकारों और प्राचीन पाठ-साक्ष्यों ने “तीन हज़ार” जैसी छोटी संख्या सुझाई है; फिर भी मुख्य पाठ मसोरेटिक इब्रानी का अनुसरण करता है।
    reason: textual_variant
lexical_decisions:
- source_word: נֶאֶסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़अल रूप यहाँ युद्ध के लिए एकत्र होने को व्यक्त करता है; यह सहज और अर्थनिष्ठ हिंदी है।
- source_word: לְהִלָּחֵם עִם
  choice: से लड़ने के लिए
  rationale: इस प्रसंग में לְהִלָּחֵם और עִם विरोधी युद्ध-संबंध व्यक्त करते हैं; हिंदी में ‘से लड़ने के लिए’ स्वाभाविक है।
- source_word: שְׁלֹשִׁים אֶלֶף רֶכֶב
  choice: तीस हज़ार रथ
  rationale: यह मसोराई इब्रानी पाठ का सीधा अर्थ है। संख्या पर पाठालोचनात्मक प्रश्न को मुख्य पाठ में बदले बिना पादटिप्पणी में रखा गया है।
- source_word: שֵׁשֶׁת אֲלָפִים פָּרָשִׁים
  choice: छह हज़ार घुड़सवार
  rationale: פָּרָשִׁים सवार सैन्यबल को दर्शाता है; ‘घुड़सवार’ आधुनिक हिंदी में स्पष्ट और सटीक है।
- source_word: וְעָם
  choice: सैनिक
  rationale: शाब्दिक अर्थ ‘लोग’ है, पर युद्ध के प्रसंग में यह लड़ाकू जनसमूह को दर्शाता है; ‘सैनिक’ प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: כַּחוֹל אֲשֶׁר עַל שְׂפַת הַיָּם לָרֹב
  choice: समुद्र के किनारे की रेत के समान असंख्य
  rationale: यह इब्रानी की विपुलता-सूचक उपमा और उसके चित्र को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: וַיַּעֲלוּ
  choice: वे ऊपर चढ़े
  rationale: עלה की दिशात्मक भाषा को बनाए रखा गया है; केवल ‘आगे बढ़े’ कहना अधिक व्याख्यात्मक होता।
- source_word: וַיַּחֲנוּ
  choice: छावनी डाली
  rationale: חנה के सैन्य प्रसंग में यह स्वाभाविक आधुनिक हिंदी अभिव्यक्ति है।
- source_word: בְמִכְמָשׂ
  choice: मिकमाश में
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है और בְ को प्रसंगानुसार ‘में’ कहा गया है।
- source_word: קִדְמַת בֵּית אָוֶן
  choice: बेत-आवेन के पूर्व में
  rationale: קִדְמַת यहाँ स्थान की पूर्व दिशा बताता है; यह स्पष्ट और संक्षिप्त हिंदी है।
