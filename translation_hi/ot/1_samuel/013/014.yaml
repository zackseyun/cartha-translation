id: 1SA.13.14
reference: 1 Samuel 13:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/עַתָּ֖ה מַמְלַכְתְּ/ךָ֣ לֹא תָק֑וּם בִּקֵּשׁ֩ יְהוָ֨ה ל֜/וֹ אִ֣ישׁ כִּ/לְבָב֗/וֹ וַ/יְצַוֵּ֨/הוּ יְהוָ֤ה לְ/נָגִיד֙ עַל עַמּ֔/וֹ כִּ֚י לֹ֣א שָׁמַ֔רְתָּ אֵ֥ת אֲשֶֽׁר צִוְּ/ךָ֖ יְהוָֽה־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/013/014.yaml
  text: But now your kingdom will not endure[a]. Yahweh has sought for himself a man according to his own heart, and Yahweh has appointed him ruler over his people[c][b], because you have not kept what Yahweh commanded you.
translation:
  language: hi
  text: पर अब तुम्हारा राज्य स्थिर नहीं रहेगा। यहोवा ने अपने लिए अपने मन के अनुसार एक पुरुष ढूँढ़ लिया है[a], और यहोवा ने उसे अपनी प्रजा पर अगुआ नियुक्त किया है, क्योंकि तुमने यहोवा की दी हुई आज्ञा का पालन नहीं किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने हृदय के अनुसार।” यहाँ “अपने” का सबसे स्वाभाविक संदर्भ यहोवा है।
    reason: मूल इब्रानी मुहावरे और सर्वनाम के संदर्भ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: पर अब
  rationale: सन्दर्भ में शाऊल की पिछली सम्भावना से घोषित दण्ड की ओर तीखा विरोधात्मक परिवर्तन है।
- source_word: מַמְלַכְתְּךָ לֹא תָקוּם
  choice: तुम्हारा राज्य स्थिर नहीं रहेगा
  rationale: תקום का मूल भाव ‘खड़ा होना’ है, पर यहाँ राजसत्ता के कायम या स्थापित रहने की बात है; ‘स्थिर नहीं रहेगा’ अर्थ और रूपक दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: בִּקֵּשׁ יְהוָה לוֹ
  choice: यहोवा ने अपने लिए ... ढूँढ़ लिया है
  rationale: לוֹ का आत्मसंबंधी बल सुरक्षित रहता है और सिद्ध क्रिया चयन की पूर्णता दर्शाती है।
- source_word: אִישׁ כִּלְבָבוֹ
  choice: अपने मन के अनुसार एक पुरुष
  rationale: ‘मन’ हिन्दी में हृदय, इच्छा और अभिप्राय के इस मुहावरे को स्वाभाविक ढंग से व्यक्त करता है; सर्वनाम को यहोवा से जोड़ा गया है, पर पद का विस्तार कर कोई अतिरिक्त नैतिक दावा नहीं जोड़ा गया।
- source_word: וַיְצַוֵּהוּ יְהוָה לְנָגִיד
  choice: यहोवा ने उसे ... अगुआ नियुक्त किया है
  rationale: इस पदबंध में צוה केवल आज्ञा देना नहीं, पद पर ठहराना या नियुक्त करना व्यक्त करता है; נָגִיד के लिए ‘अगुआ’ अधिकारपूर्ण नेतृत्व बताता है, बिना बाद की उपाधियाँ आरोपित किए।
- source_word: עַל עַמּוֹ
  choice: अपनी प्रजा पर
  rationale: प्रत्यय यहोवा की ओर संकेत करता है; ‘अपनी प्रजा’ हिन्दी में संदर्भ स्पष्ट रखते हुए मूल सर्वनाम का संबंध सुरक्षित करता है।
- source_word: לֹא שָׁמַרְתָּ אֵת אֲשֶׁר צִוְּךָ יְהוָה
  choice: तुमने यहोवा की दी हुई आज्ञा का पालन नहीं किया
  rationale: शाब्दिक ‘जो यहोवा ने तुम्हें आज्ञा दी उसे नहीं रखा’ की अपेक्षा यह स्वाभाविक हिन्दी है और שׁמר के आज्ञापालन-संबंधी आशय को स्पष्ट करती है।
theological_decisions:
- issue: כִּלְבָבוֹ में सर्वनाम का संदर्भ
  choice: ‘अपने मन’ को यहोवा के मन के रूप में समझाया गया है।
  alternative: सर्वनाम को बिना स्पष्ट संदर्भ के ‘उसके मन के अनुसार’ रखा जा सकता है।
  rationale: वाक्य-विन्यास और कथा-संदर्भ में यहोवा सबसे स्वाभाविक संदर्भ है; फिर भी फुटनोट मूल वाक्यांश की संक्षिप्तता और संभावित अस्पष्टता दर्शाता है।
- issue: נָגִיד का पदगत अर्थ
  choice: अगुआ
  alternative: शासक; प्रधान
  rationale: यहाँ यह नियुक्त नेतृत्व का पद है; अनुवाद में इसे वंशगत, मसीही या किसी बाद की तकनीकी उपाधि का अर्थ नहीं दिया गया।
- issue: मַמְלַכְתְּךָ का विस्तार
  choice: राज्य
  alternative: राजत्व; राजवंश
  rationale: ‘राज्य’ मूल संज्ञा का सामान्य और गरिमापूर्ण रूप है। कथा में इसके राजवंशीय परिणाम हो सकते हैं, पर उन्हें मुख्य पाठ में स्पष्ट जोड़कर तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी और गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘यहोवा’ में परियोजना के अनुसार ईश्वरीय नाम रखा गया है। शब्दावली सामान्य पाठक के लिए सहज है, जबकि राजकीय और धर्मवैचारिक अर्थों को अनावश्यक रूप से विस्तृत नहीं किया गया।
