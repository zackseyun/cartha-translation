base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/017.yaml
  text: When Samuel saw Saul[a], Yahweh answered him, “Look, this is the man of whom I spoke to you. This one shall rule over my people.”
translation:
  language: hi
  text: जब शमूएल ने शाऊल को देखा, तब याहवे ने उसे उत्तर दिया, “देखो, यह वही व्यक्ति है जिसके बारे में मैंने तुमसे कहा था। यही मेरी प्रजा पर शासन करेगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “यही मेरी प्रजा को रोकेगा” या “नियंत्रण में रखेगा।” इब्रानी क्रिया का अर्थ रोकना, नियंत्रण में रखना या शासन करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: देखा
  rationale: यहाँ क्रिया सामान्य दृश्य-बोध बताती है; कथात्मक क्रम में ‘देखा’ स्वाभाविक और सीधा है।
- source_word: וַיהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; हिंदी में प्रचलित रूप ‘यहोवा’ उसे सामान्य उपाधि में बदले बिना व्यक्त करता है।
- source_word: עָנָהוּ
  choice: उसे उत्तर दिया
  rationale: ענה का मूल अर्थ ‘उत्तर देना/प्रत्युत्तर देना’ है। तत्काल कोई प्रश्न दर्ज न होने पर भी यह अनुवाद मूल क्रिया को सुरक्षित रखता है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला निर्देशसूचक अव्यय है; ‘देख’ आधुनिक हिंदी में उसका बल बनाए रखता है।
- source_word: הָאִישׁ אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: वही व्यक्ति है जिसके विषय में मैंने तुझसे कहा था
  rationale: यह पूर्व ईश्वरीय कथन की ओर संकेत करता है; ‘जिसके विषय में’ संबंधवाचक संरचना को स्पष्ट और स्वाभाविक रखता है।
- source_word: זֶה
  choice: यही
  rationale: निर्देशवाचक शब्द का बल स्पष्ट करने के लिए ‘यही’ चुना गया है।
- source_word: יַעְצֹר בְּעַמִּי
  choice: मेरी प्रजा पर शासन करेगा
  rationale: עצר में रोकने, नियंत्रण में रखने और शासन करने की अर्थ-सीमा है। शाऊल के भावी नेतृत्व के संदर्भ में ‘शासन करेगा’ अर्थ को स्वाभाविक ढंग से व्यक्त करता है; अधिक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम है। आधुनिक मानक हिंदी में व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ चुना गया, न कि ‘प्रभु’ जैसी उपाधि।
- issue: יַעְצֹר का राजकीय संदर्भ में अर्थ
  choice: मेरी प्रजा पर शासन करेगा
  alternative: मेरी प्रजा को रोकेगा / नियंत्रण में रखेगा
  rationale: संदर्भ शाऊल को नियुक्त शासक के रूप में पहचानता है, इसलिए शासन का भाव मुख्य पाठ में उचित है; फिर भी क्रिया के ‘रोकने/नियंत्रित रखने’ वाले वास्तविक शाब्दिक तनाव को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिंदी; संबोधन में एकवचन ‘तू’ का रूप ‘तुझसे’ रखा गया है, जो यहाँ परमेश्वर और शमूएल के सीधे संवाद के अनुरूप है।
