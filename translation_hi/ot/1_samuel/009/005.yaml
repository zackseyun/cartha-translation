translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘लौट चलें’ बोलचाल की स्वाभाविकता के साथ मूल के आग्रह को बनाए रखता है। ‘युवक’ मूल शब्द की आयु-संबंधी व्यापकता को सुरक्षित रखता है और उसे निश्चित रूप से ‘सेवक’ नहीं बनाता।
