base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/005.yaml
  text: When they came into the land of Zuph[a], Saul said to his young man who was with him, “Come, let us return[b], lest my father stop caring about the donkeys and become anxious about us.”
translation:
  language: hi
  text: जब वे सूफ़ के प्रदेश में पहुँचे, तब शाऊल ने उस युवक से जो उसके साथ था कहा, “आओ, हम लौट चलें, कहीं ऐसा न हो कि मेरे पिता गधियों की चिंता करना छोड़कर[a] हमारे लिए व्याकुल होने लगें[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गधियों की चिंता छोड़ दें।” इब्रानी में शाब्दिक रूप से “गधियों से विरत हो जाएँ” है, जिसका अर्थ है कि वे उनके विषय में लगे रहना छोड़ दें।
    reason: lexical_alternative
  - marker: b
    text: या, “हमारी चिंता करने लगें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בָּאוּ בְּאֶרֶץ צוּף
  choice: सूफ़ के प्रदेश में पहुँचे
  rationale: בוא के साथ ב यहाँ किसी भूभाग में पहुँचने का भाव देता है। ‘प्रदेश’ אֶרֶץ के भौगोलिक अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, और ‘सूफ़’ स्थान-नाम का लिप्यंतरण है।
- source_word: נַעֲרוֹ אֲשֶׁר עִמּוֹ
  choice: अपने साथ के युवक
  rationale: נַעַר का मूल अर्थ युवक/जवान है; यद्यपि प्रसंग में वह सहायक या सेवक हो सकता है, ‘युवक’ सामाजिक दर्जा अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְכָה וְנָשׁוּבָה
  choice: आओ, हम लौट चलें
  rationale: आज्ञार्थक לְכָה और प्रेरणार्थक cohortative וְנָשׁוּבָה मिलकर साथ लौटने का आग्रह व्यक्त करते हैं।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: פֶּן आशंकित नकारात्मक परिणाम प्रस्तुत करता है; यह हिन्दी में उसका स्वाभाविक और स्पष्ट रूप है।
- source_word: יֶחְדַּל ... מִן הָאֲתֹנוֹת
  choice: गदहियों की चिंता करना छोड़कर
  rationale: חדל מן का शाब्दिक भाव ‘से विरत होना’ है। प्रसंग में इसका अर्थ गदहियों के विषय में लगे रहना या उनकी चिंता करना छोड़ देना है। אֲתֹנוֹת स्त्रीलिंग बहुवचन है, इसलिए ‘गदहियों’ रखा गया है।
- source_word: וְדָאַג לָנוּ
  choice: हमारे लिए व्याकुल होने लगें
  rationale: דאג चिंता या व्याकुलता व्यक्त करता है और यहाँ ध्यान के गदहियों से शाऊल तथा उसके साथी की ओर मुड़ने का भाव है। ‘होने लगें’ इस परिणामी परिवर्तन को सहज हिन्दी में प्रकट करता है।
