source:
  edition: WLC
  text: וַ/תַּעֲנֶ֧ינָה אוֹתָ֛/ם וַ/תֹּאמַ֥רְנָה יֵּ֖שׁ הִנֵּ֣ה לְ/פָנֶ֑י/ךָ מַהֵ֣ר עַתָּ֗ה כִּ֤י הַ/יּוֹם֙ בָּ֣א לָ/עִ֔יר כִּ֣י זֶ֧בַח הַ/יּ֛וֹם לָ/עָ֖ם בַּ/בָּמָֽה׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/012.yaml
  text: They answered them and said[a], “Yes, look—he is just ahead of you. Hurry now, because he came to the city today[b], because today there is a sacrifice for the people at the high place.”
translation:
  language: hi
  text: उन्होंने उन्हें उत्तर दिया, “हाँ, देखो, वह तुम्हारे आगे है। अब जल्दी करो, क्योंकि वह आज नगर में आया है और आज ऊँचे स्थान[a] पर लोगों के लिए बलिदान है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ऊँचा स्थान’ किसी ऊँचाई पर स्थित स्थानीय उपासना-स्थल था, जहाँ बलिदान चढ़ाए जाते थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַתַּעֲנֶינָה אוֹתָם וַתֹּאמַרְנָה
  choice: उन्होंने उन्हें उत्तर दिया
  rationale: दोनों क्रियाएँ स्त्रीलिंग बहुवचन हैं और युवतियों के उत्तर को सूचित करती हैं। हिन्दी में ‘उत्तर दिया और कहा’ अनावश्यक रूप से भारी होता; ‘उत्तर दिया’ संवाद-सूत्र का स्वाभाविक समतुल्य है।
- source_word: יֵשׁ הִנֵּה
  choice: हाँ, देखो
  rationale: יֵשׁ पिछले प्रश्न के उत्तर में स्वीकारात्मक ‘हाँ’ का काम करता है, और הִנֵּה सामने की ओर ध्यान खींचता है।
- source_word: לְפָנֶיךָ
  choice: तुम्हारे आगे ही
  rationale: शाब्दिक अर्थ ‘तुम्हारे सामने/आगे’ है; यात्रा के प्रसंग में ‘आगे ही’ निकटता और दिशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַהֵר עַתָּה
  choice: अब जल्दी करो
  rationale: आज्ञार्थक तात्कालिकता को सरल आधुनिक हिन्दी में सुरक्षित रखता है।
- source_word: כִּי הַיּוֹם בָּא לָעִיר
  choice: क्योंकि वह आज ही नगर में आया है
  rationale: पूर्ण क्रिया आज हुई आगमन-घटना को दर्शाती है जिसका वर्तमान प्रसंग से संबंध बना हुआ है; हिन्दी पूर्ण वर्तमान यहाँ सहज है।
- source_word: זֶבַח
  choice: बलिदान
  rationale: यह मूल संज्ञा का सीधा धार्मिक अर्थ है; इस पद में भोज का भाव स्पष्ट न होने के कारण ‘बलिदानी भोज’ नहीं जोड़ा गया।
- source_word: לָעָם
  choice: लोगों के लिए
  rationale: עם यहाँ सहभागी समुदाय को सूचित करता है; ‘लोगों’ सामान्य और प्रसंगानुकूल है।
- source_word: בַּבָּמָה
  choice: ऊँचे स्थान पर
  rationale: במה स्थानीय उपासना और बलिदान के लिए प्रयुक्त ऊँचे स्थल का तकनीकी-सांस्कृतिक पद है; हिन्दी में इसका पारंपरिक और पारदर्शी समतुल्य रखा गया है।
theological_decisions:
- issue: राजतंत्र-पूर्व बलिदानी प्रसंग में במה का अर्थ
  choice: ऊँचे स्थान पर
  alternative: पहाड़ी उपासना-स्थल पर
  rationale: ‘ऊँचा स्थान’ मूल पद की स्थानिक और धार्मिक ऐतिहासिक बनावट को बनाए रखता है, बिना बाद के नकारात्मक धार्मिक मूल्यांकन को इस पद में आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; संवाद स्वाभाविक और तात्कालिक रखा गया है। कथन गरिमापूर्ण है, पर ‘उत्तर दिया और कहा’ जैसी हिब्रू संरचना की कृत्रिम नकल से बचा गया है।
