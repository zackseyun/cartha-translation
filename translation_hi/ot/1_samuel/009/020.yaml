  text: וְ/לָ/אֲתֹנ֞וֹת הָ/אֹבְד֣וֹת לְ/ךָ֗ הַ/יּוֹם֙ שְׁלֹ֣שֶׁת הַ/יָּמִ֔ים אַל תָּ֧שֶׂם אֶֽת לִבְּ/ךָ֛ לָ/הֶ֖ם כִּ֣י נִמְצָ֑אוּ וּ/לְ/מִי֙ כָּל חֶמְדַּ֣ת יִשְׂרָאֵ֔ל הֲ/ל֣וֹא לְ/ךָ֔ וּ/לְ/כֹ֖ל בֵּ֥ית אָבִֽי/ךָ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/020.yaml
  text: And as for the donkeys that were lost to you three days ago[a], do not set your heart on them, for they have been found[b]. And for whom is all the desire of Israel? Is it not for you and for all your father's house?
translation:
  language: hi
  text: और तुम्हारी जो गधियाँ तीन दिन पहले खो गई थीं, उनकी चिंता मत करो, क्योंकि वे मिल गई हैं। और इस्राएल की सारी अभिलाषा किसके लिए है?[a] क्या वह तुम्हारे लिए और तुम्हारे पिता के सारे घराने के लिए नहीं है?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और इस्राएल की सारी वांछनीय वस्तुएँ किसकी हैं?” इब्रानी पदबंध का अर्थ या तो वह हो सकता है जिसकी इस्राएल अभिलाषा करता है, या वह जो इस्राएल में वांछनीय अथवा बहुमूल्य है।
    reason: lexical_alternative
  - marker: b
    text: “पिता का घराना” तत्काल परिवार से व्यापक पैतृक गृह या कुल को दर्शाने वाली अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: אֲתֹנוֹת
  choice: गदहियाँ
  rationale: इब्रानी संज्ञा विशेष रूप से मादा गधियों को दर्शाती है; हिंदी में ‘गदहियाँ’ स्वाभाविक ढंग से यह अर्थ सुरक्षित रखता है।
- source_word: הָאֹבְדוֹת
  choice: जो ... खो गई थीं
  rationale: कृदंत पशुओं की खोई हुई अवस्था बताता है; हिंदी भूतकालीन संदर्भ में यह स्पष्ट और सहज है।
- source_word: הַיּוֹם שְׁלֹשֶׁת הַיָּמִים
  choice: तीन दिन पहले
  rationale: इब्रानी काल-सूचक मुहावरे का स्वाभाविक हिंदी अर्थ यही है।
- source_word: אַל תָּשֶׂם אֶת־לִבְּךָ לָהֶם
  choice: उनकी चिंता मत करो
  rationale: शाब्दिक रूप से ‘अपना हृदय उन पर मत लगा’; इस संदर्भ में इसका आशय उनके विषय में चिंतित न होना है। हिंदी में शाब्दिक ‘मन मत लगाओ’ गलत आसक्ति का भाव दे सकता है।
- source_word: נִמְצָאוּ
  choice: वे मिल गई हैं
  rationale: 'निफ़अल पूर्ण रूप निष्क्रिय-परिणामी अर्थ देता है: खोई हुई गदहियाँ अब मिल चुकी हैं।'
- source_word: וּלְמִי כָּל חֶמְדַּת יִשְׂרָאֵל
  choice: इस्राएल की सारी अभिलाषा किसकी ओर है?
  rationale: חֶמְדַּת में ‘अभिलाषा’ और ‘वांछनीय/बहुमूल्य वस्तु’ दोनों अर्थ संभव हैं। मुख्य पाठ में अभिलाषा वाला अर्थ रखा गया है और वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं है?
  rationale: यह सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न को सुरक्षित रखता है।
- source_word: לְךָ וּלְכֹל בֵּית אָבִיךָ
  choice: तुम्हारी और तुम्हारे पिता के सारे घराने की ओर
  rationale: ‘पिता का घराना’ तत्काल परिवार से व्यापक पैतृक गृह/कुल की सामाजिक इकाई है; ‘घराना’ इस सांस्कृतिक अर्थ को सामान्य हिंदी में बनाए रखता है।
theological_decisions:
- issue: ‘इस्राएल की सारी अभिलाषा’ का आशय
  choice: शाऊल और उसके पैतृक घराने की ओर इस्राएल की अभिलाषा संकेतित है, पर ‘राजपद’ को स्पष्ट रूप से पाठ में नहीं जोड़ा गया।
  alternative: ‘इस्राएल की सारी वांछनीय वस्तुएँ किसकी हैं?’ अर्थात देश की बहुमूल्य वस्तुएँ शाऊल के घराने की होंगी।
  rationale: इब्रानी वाक्य संक्षिप्त और अर्थ की दृष्टि से खुला है। निकटवर्ती प्रसंग शाऊल की भावी नियुक्ति की ओर संकेत करता है, किंतु पद स्वयं ‘राजपद’ नहीं कहता; इसलिए उस निष्कर्ष को अनुवाद में आयात नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध। ‘गदहियाँ’ से मूल का स्त्रीलिंग अर्थ सुरक्षित है; ‘चिंता मत करो’ हिंदी में प्रसंगगत मुहावरे का स्वाभाविक रूप है। मुख्य पाठ की आलंकारिक प्रश्न-रचना और अर्थगत अस्पष्टता यथासंभव बनाए रखी गई है।
