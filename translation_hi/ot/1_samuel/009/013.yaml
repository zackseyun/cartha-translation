base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/013.yaml
  text: As soon as you enter the city[a], you will find him, before he goes up to the high place to eat. For the people will not eat until he comes, because he is the one who blesses the sacrifice; afterward those who are invited eat. So go up now[c][b], for today you will find him.
translation:
  language: hi
  text: जैसे ही तुम नगर में प्रवेश करोगे, वह तुम्हें मिल जाएगा, इससे पहले कि वह भोजन करने के लिए ऊँचे स्थान[a] पर चढ़े। क्योंकि उसके आने तक लोग भोजन नहीं करेंगे, क्योंकि बलिदान पर आशीष वही देता है[b]; उसके बाद आमंत्रित लोग भोजन करते हैं। अब ऊपर जाओ, क्योंकि आज वह तुम्हें अवश्य मिल जाएगा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ऊँचा स्थान” किसी ऊँचाई पर स्थित उपासना-स्थल था, जहाँ बलिदान चढ़ाए जाते और उनसे जुड़ा भोज किया जाता था।
    reason: cultural_note
  - marker: b
    text: “बलिदान पर आशीष देता है” का आशय संभवतः बलिदानी भोज से पहले उससे जुड़ी आशीष बोलना है।
    reason: cultural_note
  - marker: c
    text: या “लगभग इसी समय”; इब्रानी כְהַיּוֹם यहाँ केवल कैलेंडर के दिन के बजाय तात्कालिकता पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּבֹאֲכֶם הָעִיר
  choice: जैसे ही तुम नगर में प्रवेश करोगे
  rationale: כְּ के साथ infinitive construct यहाँ कालवाचक है। ‘जैसे ही’ प्रसंग की तात्कालिकता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כֵּן תִּמְצְאוּן אֹתוֹ
  choice: तुम उसे पा लोगे
  rationale: כֵּן परिणाम की निश्चितता और तात्कालिकता को बल देता है; हिन्दी में ‘पा लोगे’ इसे स्वाभाविक रूप से व्यक्त करता है, बिना अनावश्यक ‘तब’ जोड़े।
- source_word: בְּטֶרֶם יַעֲלֶה הַבָּמָתָה
  choice: इससे पहले कि वह ... ऊँचे स्थान पर चढ़े
  rationale: בְּטֶרֶם पूर्वकालिक संबंध बताता है और עלה की ऊपर जाने की दिशा ‘चढ़े’ में सुरक्षित रहती है। במה का सीधा, पारंपरिक अर्थ ‘ऊँचा स्थान’ रखा गया है।
- source_word: לֹא יֹאכַל הָעָם עַד בֹּאוֹ
  choice: उसके आने तक लोग भोजन नहीं करेंगे
  rationale: अपूर्ण क्रिया प्रसंग में भावी घटना बताती है; עד בואו को स्वाभाविक कालवाचक उपवाक्य में प्रस्तुत किया गया है।
- source_word: כִּי הוּא יְבָרֵךְ הַזֶּבַח
  choice: क्योंकि बलिदान पर आशीष वही देता है
  rationale: स्पष्ट सर्वनाम הוּא के बलाघात को ‘वही’ सुरक्षित रखता है। ברך का रूप भावी संदर्भ में कार्यगत/प्रथागत अर्थ रखता है; हिन्दी में ‘आशीष देता है’ सहज है। ‘पर’ यह स्पष्ट करता है कि आशीष बलिदान के संबंध में बोली जाती है।
- source_word: הַקְּרֻאִים
  choice: आमंत्रित लोग
  rationale: קרא का passive participle शाब्दिक रूप से ‘बुलाए/आमंत्रित किए गए लोग’ है; ‘आमंत्रित लोग’ संक्षिप्त और स्पष्ट है।
- source_word: וְעַתָּה עֲלוּ
  choice: अब चढ़ जाओ
  rationale: עלה की दिशात्मक धारणा को ‘चढ़ जाओ’ में रखा गया है और ועתה को सरल ‘अब’ से व्यक्त किया गया है।
- source_word: כִּי אֹתוֹ כְהַיּוֹם תִּמְצְאוּן אֹתוֹ
  choice: क्योंकि इसी समय तुम उसे पा लोगे
  rationale: कठिन अभिव्यक्ति כְהַיּוֹם को प्रसंगानुसार तात्कालिक अर्थ ‘इसी समय’ दिया गया है। ‘आज’ भी संभव है, इसलिए विकल्प को पादटिप्पणी में रखा गया है। दोहराए गए אֹתוֹ का बल हिन्दी के स्वाभाविक वाक्य में अलग से नहीं दोहराया गया।
theological_decisions:
- issue: יְבָרֵךְ הַזֶּבַח में आशीष का आशय
  choice: बलिदान पर आशीष वही देता है
  alternative: वह बलिदान को आशीष देता है / वह बलिदानी भोज की आशीष बोलता है
  rationale: मूल पाठ केवल ‘बलिदान को/पर आशीष देना’ कहता है। मुख्य पाठ में इसी को रखा गया है; अनुष्ठान की अधिक विशिष्ट व्याख्या पादटिप्पणी में दी गई है, ताकि अर्थ को संप्रदायगत या आवश्यकता से अधिक निश्चित न बनाया जाए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘नगर’, ‘बलिदान’, ‘आशीष’ और ‘आमंत्रित’ सामान्य बाइबलीय-साहित्यिक शब्दावली के अनुरूप हैं। במה के लिए व्याख्यात्मक ‘पूजा-स्थल’ को मुख्य पाठ में न रखकर ‘ऊँचा स्थान’ रखा गया है और सांस्कृतिक अर्थ पादटिप्पणी में स्पष्ट किया गया है।
