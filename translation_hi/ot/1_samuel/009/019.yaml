language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַן שְׁמוּאֵ֜ל אֶת שָׁא֗וּל וַ/יֹּ֨אמֶר֙ אָנֹכִ֣י הָ/רֹאֶ֔ה עֲלֵ֤ה לְ/פָנַ/י֙ הַ/בָּמָ֔ה וַ/אֲכַלְתֶּ֥ם עִמִּ֖/י הַ/יּ֑וֹם וְ/שִׁלַּחְתִּ֣י/ךָ בַ/בֹּ֔קֶר וְ/כֹ֛ל אֲשֶׁ֥ר בִּֽ/לְבָבְ/ךָ֖ אַגִּ֥יד לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/019.yaml
  text: Samuel answered Saul and said[a], “I am the seer. Go up before me to the high place, and eat with me today. In the morning I will send you on your way[b], and I will tell you all that is in your heart.”
translation:
  language: hi
  text: शमूएल ने शाऊल को उत्तर दिया, “द्रष्टा[a] मैं ही हूँ। मुझसे पहले ऊँचे स्थान पर चढ़ जाओ, और तुम लोग आज मेरे साथ भोजन करना।[b] सुबह मैं तुम्हें विदा कर दूँगा, और जो कुछ तुम्हारे मन में है, वह सब तुम्हें बता दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भविष्यद्वक्ता।” इब्रानी में यहाँ पुराना पद “द्रष्टा” है, जिसे 1 शमूएल 9:9 भविष्यद्वक्ता का पहले प्रचलित नाम बताता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी में “तुम लोग भोजन करना” बहुवचन है; इसमें संभवतः शाऊल के साथ उसका सेवक भी शामिल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרֹאֶה
  choice: द्रष्टा
  rationale: इस संज्ञा का शाब्दिक अर्थ ‘देखने वाला’ है और यहाँ यह भविष्यद्वक्ता के लिए प्रयुक्त पुराना पद है (तुलना 1 शमूएल 9:9)। ‘द्रष्टा’ मूल पद और कथा के ऐतिहासिक परिवेश दोनों को सुरक्षित रखता है।
- source_word: הַבָּמָה
  choice: ऊँचा स्थान
  rationale: यह शब्द सामान्यतः ऊँचाई पर स्थित उपासना अथवा बलिदान के स्थान को दर्शाता है। ‘ऊँचा स्थान’ इब्रानी स्थानिक बिंब को बनाए रखता है और ‘मंदिर’ या ‘देवस्थान’ जैसी अधिक व्याख्यात्मक अभिव्यक्तियों से बचता है।
- source_word: עֲלֵה לְפָנַי
  choice: मुझसे पहले ऊँचे स्थान पर चढ़ जाओ
  rationale: यह अनुवाद ऊपर जाने की गति और शमूएल से आगे चलने के भाव, दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַאֲכַלְתֶּם עִמִּי הַיּוֹם
  choice: तुम लोग आज मेरे साथ भोजन करना
  rationale: क्रिया द्वितीय पुरुष पुल्लिंग बहुवचन में है; ‘तुम लोग’ इस बहुवचन को स्पष्ट करता है, जबकि आज्ञार्थक ‘भोजन करना’ प्रसंग में स्वाभाविक निमंत्रण व्यक्त करता है।
- source_word: וְשִׁלַּחְתִּיךָ
  choice: मैं तुम्हें विदा कर दूँगा
  rationale: प्रसंग में क्रिया का अर्थ अगली सुबह शाऊल को आगे की यात्रा के लिए जाने देना है। ‘विदा कर दूँगा’ अस्वीकृति का अनावश्यक भाव लाए बिना इसे सहज हिन्दी में व्यक्त करता है।
- source_word: בַבֹּקֶר
  choice: सुबह
  rationale: मूल पाठ केवल ‘सुबह’ कहता है। ‘कल सुबह’ अर्थ की दृष्टि से संभव है, पर मूल से अधिक स्पष्ट होगा।
- source_word: וְכֹל אֲשֶׁר בִּלְבָבְךָ
  choice: जो कुछ तुम्हारे मन में है, वह सब
  rationale: לבב विचारों, चिंताओं और अभिप्रायों सहित भीतरी व्यक्ति को सूचित कर सकता है। इस संदर्भ में ‘मन में’ आधुनिक हिन्दी में स्वाभाविक है और आशय को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אַגִּיד לָךְ
  choice: तुम्हें बता दूँगा
  rationale: हिफ़ील रूप किसी बात को ज्ञात कराने का भाव देता है; संवाद के इस प्रसंग में ‘बता दूँगा’ स्वाभाविक और अर्थानुकूल है।
theological_decisions:
- issue: הָרֹאֶה को ऐतिहासिक पद के रूप में प्रस्तुत करना
  choice: द्रष्टा
  alternative: भविष्यद्वक्ता
  rationale: 1 शमूएल 9:9 स्वयं ‘द्रष्टा’ को भविष्यद्वक्ता के लिए प्रयुक्त पुराना पद बताता है। इसलिए सामान्यीकृत पद के स्थान पर मूल का ऐतिहासिक भेद सुरक्षित रखा गया है।
- issue: בִּלְבָבְךָ में ‘हृदय’ का रूपक
  choice: तुम्हारे मन में
  alternative: तुम्हारे हृदय में
  rationale: यहाँ कथन शाऊल के भीतर के विचारों या चिंताओं की ओर संकेत करता है। ‘मन में’ आधुनिक हिन्दी में वही व्यापक भाव स्वाभाविक ढंग से देता है; इसे केवल भावना अथवा किसी विशिष्ट आध्यात्मिक अर्थ तक सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम’ का प्रयोग निकट और सामान्य संबोधन के अनुरूप है। एकवचन ‘चढ़ जाओ’ और बहुवचन ‘तुम लोग…भोजन करना’ का अंतर जानबूझकर सुरक्षित रखा गया है।
