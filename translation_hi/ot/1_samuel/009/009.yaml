id: 1SA.9.9
reference: 1 Samuel 9:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/פָנִ֣ים בְּ/יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר הָ/אִישׁ֙ בְּ/לֶכְתּ/וֹ֙ לִ/דְר֣וֹשׁ אֱלֹהִ֔ים לְכ֥וּ וְ/נֵלְכָ֖ה עַד הָ/רֹאֶ֑ה כִּ֤י לַ/נָּבִיא֙ הַ/יּ֔וֹם יִקָּרֵ֥א לְ/פָנִ֖ים הָ/רֹאֶֽה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/009.yaml
  text: Formerly in Israel[a], when a man went to inquire of God, he would say, “Come, and let us go to the seer,” for the prophet of today was formerly called the seer.
translation:
  language: hi
  text: पहले इस्राएल में[a], जब कोई पुरुष परमेश्वर से पूछने जाता था, तो वह कहता था, “आओ, हम द्रष्टा के पास चलें”; क्योंकि जिसे आज नबी कहा जाता है, उसे पहले द्रष्टा कहा जाता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पुराने समय में इस्राएल में, जब कोई पुरुष परमेश्वर को खोजने जाता था, तो वह कहता था, ‘आओ, हम द्रष्टा के पास चलें।’”
    reason: לְפָנִים और לִדְרֹשׁ אֱלֹהִים के क्रमशः ‘पुराने समय में’ तथा व्यापक ‘परमेश्वर को खोजने’ अर्थों को दिखाने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: לְפָנִים
  choice: पहले
  rationale: दोनों स्थानों पर यह कालवाचक क्रियाविशेषण पुराने समय को वर्तमान कथावाचक के समय से अलग करता है; सरल आधुनिक हिन्दी में ‘पहले’ स्वाभाविक है।
- source_word: כֹּה אָמַר
  choice: वह कहता था
  rationale: शाब्दिक रूप ‘इस प्रकार कहा’ है, पर प्रसंग अतीत की प्रचलित रीति बताता है; अपूर्ण भूतकाल उस आदतन कथन को स्पष्ट करता है।
- source_word: הָאִישׁ
  choice: कोई पुरुष
  rationale: यह निश्चित व्यक्ति नहीं, बल्कि सामान्य अर्थ में प्रयुक्त पुल्लिंग एकवचन है। ‘कोई पुरुष’ मूल के व्याकरणिक रूप को बनाए रखते हुए हिन्दी में स्वाभाविक है।
- source_word: לִדְרֹשׁ אֱלֹהִים
  choice: परमेश्वर से पूछने
  rationale: इस संदर्भ में क्रिया का अर्थ भविष्यद्वक्ता-सदृश मध्यस्थ के पास जाकर परमेश्वर की इच्छा या मार्गदर्शन जानना है; ‘पूछने’ इस परामर्शात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: לְכוּ וְנֵלְכָה
  choice: आओ, हम ... चलें
  rationale: आज्ञार्थक ‘आओ’ और सामूहिक आग्रह ‘हम चलें’—दोनों को सुरक्षित रखा गया है।
- source_word: הָרֹאֶה
  choice: द्रष्टा
  rationale: यह ראה से बना पुराना पदनाम है, जिसका आशय दर्शन पाने या देखने वाले भविष्यसूचक व्यक्ति से है। ‘द्रष्टा’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और विशिष्ट है।
- source_word: לַנָּבִיא
  choice: नबी
  rationale: נביא का प्रचलित, स्पष्ट और आधुनिक हिन्दी रूप ‘नबी’ है; वाक्य-रचना ‘जिसे ... नबी कहा जाता है’ हिब्रू के निश्चित पदनाम का भाव रखती है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह कथावाचक के वर्तमान और पुराने समय के बीच स्पष्ट विरोध स्थापित करता है।
- source_word: יִקָּרֵא
  choice: कहा जाता है / कहा जाता था
  rationale: निफ़अल रूप पदनाम दिए जाने को व्यक्त करता है। पहले खंड में ‘आज ... कहा जाता है’ और दूसरे में ‘पहले ... कहा जाता था’ हिन्दी में कालगत विरोध को स्पष्ट करते हैं।
theological_decisions:
- issue: לִדְרֹשׁ אֱלֹהִים का अर्थ
  choice: परमेश्वर से पूछने
  alternative: परमेश्वर को खोजने
  rationale: निकट प्रसंग में व्यक्ति द्रष्टा के पास जा रहा है, इसलिए यहाँ सामान्य आध्यात्मिक खोज से अधिक परमेश्वर से मार्गदर्शन पूछने का अर्थ प्रमुख है; इससे भविष्यवाणी की प्रकृति पर कोई अतिरिक्त धर्मशास्त्रीय दावा नहीं जोड़ा जाता।
- issue: הָאִישׁ का सामान्य पुल्लिंग प्रयोग
  choice: कोई पुरुष
  alternative: कोई व्यक्ति
  rationale: मूल में व्याकरणिक रूप से पुल्लिंग एकवचन है। अनावश्यक रूप से लिंग-निरपेक्ष किए बिना इसके सामान्य उदाहरणात्मक अर्थ को ‘कोई’ से दिखाया गया है।
- issue: נָבִיא और רֹאֶה का संबंध
  choice: दो ऐतिहासिक पदनामों के रूप में ‘नबी’ और ‘द्रष्टा’
  alternative: दोनों को एक ही शब्द ‘भविष्यद्वक्ता’ से व्यक्त करना
  rationale: पद स्वयं पुराने और बाद के नाम के बीच भेद समझाता है; इसलिए अलग शब्द रखना कथावाचक की ऐतिहासिक टिप्पणी और उसकी अंतर्निहित सूक्ष्मता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण गद्य। ‘नबी’ और ‘द्रष्टा’ को अलग तकनीकी पदनामों के रूप में रखा गया है। अर्धविराम व्याख्यात्मक अंतिम खंड को मुख्य कथन से जोड़ता है; उद्धरण में बोलचाल की सहज सामूहिक प्रेरणा ‘आओ, हम ... चलें’ प्रयुक्त है।
