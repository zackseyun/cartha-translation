base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/026.yaml
  text: They rose early[a], and when the dawn was breaking, Samuel called to Saul on the roof, saying, “Get up, and I will send you on your way.” So Saul got up, and the two of them, he and Samuel[b], went outside.
translation:
  language: hi
  text: वे तड़के उठे। जब पौ फटने लगी[a], तब शमूएल ने छत पर शाऊल को पुकारकर कहा, “उठो, मैं तुम्हें विदा करूँगा[b]।” तब शाऊल उठा, और वे दोनों—शाऊल और शमूएल—बाहर गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “भोर के उगते समय।”
    reason: lexical_alternative
  - marker: b
    text: या “मैं तुम्हें रवाना करूँगा।” इब्रानी क्रिया का अर्थ किसी को विदा करना, रवाना करना या जाने देना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכִּמוּ
  choice: वे तड़के उठे
  rationale: हिफ़ील रूप दिन में बहुत जल्दी उठने या काम आरम्भ करने का भाव देता है। ‘तड़के उठे’ इस समय-संबंधी बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּעֲלוֹת הַשַּׁחַר
  choice: जब पौ फटने लगी
  rationale: शाब्दिक अर्थ ‘जब भोर ऊपर उठ रही थी’ है। ‘पौ फटने लगी’ भोर के आरम्भ की छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַגָּג
  choice: छत पर
  rationale: यह घर की समतल छत को सूचित करता है, जहाँ पिछले संदर्भ में शाऊल ठहरा था।
- source_word: קוּמָה
  choice: उठो
  rationale: आज्ञार्थक रूप को सीधी, समकालीन और स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: וַאֲשַׁלְּחֶךָּ
  choice: मैं तुम्हें विदा करूँगा
  rationale: यहाँ क्रिया किसी को रवाना करने अथवा जाने की अनुमति देने का भाव रखती है। ‘विदा करूँगा’ कठोर ‘दूर भेज दूँगा’ की अपेक्षा प्रसंगानुकूल है और मूल अर्थ की व्यापकता बनाए रखता है।
- source_word: וַיֵּצְאוּ ... הַחוּצָה
  choice: बाहर गए
  rationale: क्रिया और दिशासूचक पद मिलकर बाहर जाने का अर्थ देते हैं; गली या किसी अन्य निश्चित गंतव्य को जोड़ना मूल से अधिक विशिष्ट होता।
- source_word: שְׁנֵיהֶם הוּא וּשְׁמוּאֵל
  choice: वे दोनों—शाऊल और शमूएल—
  rationale: मूल में ‘वे दोनों, वह और शमूएल’ जैसा बलयुक्त समानाधिकरण है। हिन्दी में संदर्भित सर्वनाम को ‘शाऊल’ से स्पष्ट करके उस बल को डैश के माध्यम से बनाए रखा गया है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण रखी गई है। ‘पौ फटना’ प्रचलित साहित्यिक-लोकप्रचलित अभिव्यक्ति है; प्रत्यक्ष वचन में ‘उठो’ स्वाभाविक है। मूल के बलयुक्त ‘वे दोनों’ को सुरक्षित रखा गया है, जबकि अस्पष्ट सर्वनाम को संदर्भानुसार शाऊल के नाम से स्पष्ट किया गया है।
