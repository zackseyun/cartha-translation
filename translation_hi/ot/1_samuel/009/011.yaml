base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/011.yaml
  text: As they were going up the ascent to the city[a], they found young women coming out to draw water, and they said to them, “Is the seer here?”
translation:
  language: hi
  text: जब वे नगर को जाने वाली चढ़ाई पर चढ़ रहे थे, तब उन्हें पानी भरने के लिए बाहर निकलती हुई युवतियाँ मिलीं। उन्होंने उनसे पूछा, “क्या दर्शी[a] यहाँ हैं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भविष्यद्वक्ता।” इब्रानी में यहाँ विशेष रूप से “दर्शी” कहा गया है; यह उस व्यक्ति के लिए प्रयुक्त पुराना पद था जिसे बाद में भविष्यद्वक्ता कहा जाने लगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֹלִים
  choice: चढ़ रहे थे
  rationale: सर्वनाम के साथ प्रयुक्त कृदंत चल रही क्रिया व्यक्त करता है; यह हिन्दी में स्वाभाविक रूप से प्रगतिशील भूतकाल है।
- source_word: בְּמַעֲלֵה הָעִיר
  choice: नगर की चढ़ाई पर
  rationale: מַעֲלֶה नगर की ओर जाने वाली चढ़ाई अथवा ढलानदार मार्ग को दर्शाता है; चुना गया रूप ठोस स्थलाकृतिक अर्थ बनाए रखता है।
- source_word: מָצְאוּ
  choice: मिलीं
  rationale: मूल अर्थ ‘पाया’ है, पर व्यक्तियों से मार्ग में सामना होने के संदर्भ में हिन्दी का ‘उन्हें ... मिलीं’ अधिक स्वाभाविक है और अर्थ सुरक्षित रखता है।
- source_word: נְעָרוֹת
  choice: युवतियाँ
  rationale: यह स्त्रीलिंग युवा व्यक्तियों को दर्शाता है; ‘युवतियाँ’ आधुनिक, सम्मानपूर्ण और आयु के विषय में अनावश्यक संकीर्णता से मुक्त है।
- source_word: יֹצְאוֹת לִשְׁאֹב מָיִם
  choice: पानी भरने के लिए बाहर आती हुई
  rationale: कृदंत और उद्देश्यसूचक infinitive बाहर आने की जारी क्रिया तथा पानी भरने का उद्देश्य दोनों व्यक्त करते हैं।
- source_word: הֲיֵשׁ בָּזֶה
  choice: क्या ... यहाँ हैं?
  rationale: यह मुहावरा किसी व्यक्ति की उस स्थान पर उपस्थिति पूछता है; हिन्दी में ‘यहाँ’ संक्षिप्त और स्वाभाविक है।
- source_word: הָרֹאֶה
  choice: दर्शी
  rationale: इब्रानी शब्द का शाब्दिक और ऐतिहासिक पद ‘देखने वाला/दर्शी’ है, जो आगे के वर्णन में ‘भविष्यद्वक्ता’ से संबद्ध पुराने पद को सुरक्षित रखता है।
theological_decisions:
- issue: הָרֹאֶה का पदनाम
  choice: मुख्य पाठ में ‘दर्शी’
  alternative: ‘भविष्यद्वक्ता’
  rationale: मूल पाठ यहाँ विशिष्ट पुराने पद ‘दर्शी’ का प्रयोग करता है। इसे ‘भविष्यद्वक्ता’ से बदलना अगले पद में दी गई ऐतिहासिक व्याख्या को पहले ही समतल कर देता; इसलिए विकल्प पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। ‘नगर,’ ‘युवतियाँ’ और ‘दर्शी’ मूल की शैली तथा ऐतिहासिक शब्दावली को बनाए रखते हैं; आदरसूचक बहुवचन ‘हैं’ हिन्दी में अज्ञात धार्मिक पदाधिकारी के प्रति स्वाभाविक सम्मान व्यक्त करता है।
