source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר ל֗/וֹ הִנֵּה נָ֤א אִישׁ אֱלֹהִים֙ בָּ/עִ֣יר הַ/זֹּ֔את וְ/הָ/אִ֣ישׁ נִכְבָּ֔ד כֹּ֥ל אֲשֶׁר יְדַבֵּ֖ר בּ֣וֹא יָב֑וֹא עַתָּה֙ נֵ֣לֲכָה שָּׁ֔ם אוּלַי֙ יַגִּ֣יד לָ֔/נוּ אֶת דַּרְכֵּ֖/נוּ אֲשֶׁר הָלַ֥כְנוּ עָלֶֽי/הָ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/006.yaml
  text: He said to him, “Look now, there is a man of God in this city, and the man is held in honor; everything that he says surely comes to pass. Now let us go there. Perhaps he will tell us the way we should go.”
translation:
  language: hi
  text: उसने उससे कहा, “देखिए, इस नगर में परमेश्वर का एक जन है। वह बहुत आदरणीय है; वह जो कुछ कहता है, वह अवश्य पूरा होता है। अब हम वहीं चलें। शायद वह हमें बताए कि हमें किस रास्ते पर जाना चाहिए।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: परमेश्वर का एक जन
  rationale: यह इब्रानी पद किसी नबी या परमेश्वर के अधिकृत सेवक के लिए प्रयुक्त सम्मानसूचक पद है; ‘परमेश्वर का जन’ उसका स्वाभाविक और पारंपरिक हिन्दी रूप है।
- source_word: נִכְבָּד
  choice: बहुत आदरणीय
  rationale: शब्द का भाव सम्मानित और प्रतिष्ठित होने का है; ‘बहुत’ वाक्य में निहित बल को सहज हिन्दी में व्यक्त करता है।
- source_word: בּוֹא יָבוֹא
  choice: अवश्य पूरा होता है
  rationale: क्रिया की पुनरुक्त संरचना कथन के निश्चित रूप से घटित होने पर बल देती है; भविष्यवाणी के संदर्भ में ‘पूरा होता है’ स्वाभाविक है।
- source_word: אֶת דַּרְכֵּנוּ אֲשֶׁר הָלַכְנוּ עָלֶיהָ
  choice: कि हमें किस रास्ते जाना चाहिए
  rationale: शाब्दिक रूप असामान्य है (‘हमारा मार्ग जिस पर हम चले हैं’), पर प्रसंग में सेवक आगे के उचित मार्ग के विषय में मार्गदर्शन चाहता है; हिन्दी रूप इसी अभिप्राय को स्पष्ट और स्वाभाविक ढंग से रखता है।
theological_decisions:
- issue: ‘परमेश्वर का जन’ की पहचान
  choice: सामान्य उपाधि को बनाए रखा गया
  alternative: ‘नबी’
  rationale: यद्यपि प्रसंग में यह शमूएल के लिए है, मूल पाठ यहाँ ‘नबी’ नहीं बल्कि ‘परमेश्वर का जन’ कहता है; उपाधि बदलना अनावश्यक व्याख्या जोड़ता।
- issue: उसकी कही बात का पूरा होना
  choice: ‘वह जो कुछ कहता है, वह अवश्य पूरा होता है’
  alternative: ‘उसकी हर भविष्यवाणी सच निकलती है’
  rationale: चुना हुआ रूप मूल की व्यापक भाषा और ईश्वरीय वाणी की प्रभावशीलता बनाए रखता है, बिना ‘भविष्यवाणी’ शब्द को स्पष्ट रूप से जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और कथात्मक शैली। शाऊल के प्रति सेवक के संबोधन में ‘देखिए’ और ‘हमें’ का प्रयोग स्वाभाविक सामाजिक सम्मान व्यक्त करता है।
