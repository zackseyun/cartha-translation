base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/003.yaml
  text: The donkeys belonging to Kish[a], Saul’s father, were lost. So Kish said to Saul his son, “Please take with you one of the young men, and get up, go[b], seek the donkeys.”
translation:
  language: hi
  text: शाऊल के पिता कीश की गधियाँ[a] खो गईं। तब कीश ने अपने बेटे शाऊल से कहा, “कृपया जवानों में से किसी एक[b] को अपने साथ ले और उठकर जा, गधियों को ढूँढ़।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में विशेष रूप से मादा गधियों का उल्लेख है।
    reason: lexical_clarification
  - marker: b
    text: या “सेवकों में से किसी एक को” अथवा “परिचरों में से किसी एक को”; इब्रानी शब्द के ये अर्थ भी हो सकते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֹּאבַדְנָה
  choice: खो गईं
  rationale: यहाँ אבד का अर्थ पशुओं का लापता हो जाना है, न कि उनका मर जाना। ‘खो गईं’ स्वाभाविक और अर्थानुकूल है।
- source_word: הָאֲתֹנוֹת
  choice: गदहियाँ
  rationale: इब्रानी संज्ञा विशेष रूप से मादा गधियों को दर्शाती है; हिन्दी में ‘गदहियाँ’ इस जानकारी को सहज रूप से बनाए रखता है।
- source_word: לְקִישׁ אֲבִי שָׁאוּל
  choice: शाऊल के पिता कीश की
  rationale: לְ यहाँ स्वामित्व बताता है, और हिन्दी की संबंधसूचक रचना स्रोत के दोनों संबंधों को स्पष्ट तथा स्वाभाविक रखती है।
- source_word: קַח נָא אִתְּךָ
  choice: कृपया ... अपने साथ ले
  rationale: נָא आज्ञा को विनम्र बनाता है; ‘कृपया’ उसी भाव को व्यक्त करता है और אִתְּךָ का अर्थ ‘अपने साथ’ से सुरक्षित रहता है।
- source_word: אַחַד מֵהַנְּעָרִים
  choice: किसी एक जवान
  rationale: נַעַר युवक, सेवक या परिचर के लिए प्रयुक्त हो सकता है। ‘जवान’ मूल की आयु-संबंधी धारणा रखता है और सामाजिक भूमिका को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְקוּם לֵךְ
  choice: उठकर जा
  rationale: दोनों आदेशों को हिन्दी में स्वाभाविक संयुक्त क्रिया के रूप में रखा गया है और तत्काल प्रस्थान का भाव बना रहता है।
- source_word: בַּקֵּשׁ
  choice: ढूँढ़
  rationale: व्यावहारिक खोज के इस प्रसंग में ‘ढूँढ़’ आधुनिक हिन्दी का सहज और सटीक शब्द है।
