base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/024.yaml
  text: So the cook took up the leg and what was on it and set it before Saul[a]. And he said, “Look, what has been kept is set before you. Eat, because it was kept for you for the appointed time, from when I said[d][c][b], ‘I have invited the people.’” So Saul ate with Samuel that day.
translation:
  language: hi
  text: तब रसोइए ने जाँघ[क] और उसके ऊपर जो कुछ था[ख], उसे उठाकर शाऊल के सामने रख दिया। शमूएल ने कहा, “देखो, जो भाग बचाकर रखा गया था[ग], वह तुम्हारे सामने रखा हुआ है। खाओ, क्योंकि उसे नियत समय के लिए तुम्हारे लिए बचाकर रखा गया था, जब मैंने कहा था[घ], ‘मैंने लोगों को आमंत्रित किया है।’” तब उस दिन शाऊल ने शमूएल के साथ भोजन किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “टाँग।” इब्रानी शब्द पशु के पैर के मांस वाले भाग को दर्शाता है।
    reason: lexical_alternative
  - marker: ख
    text: इब्रानी में शाब्दिक रूप से, “और जो उसके ऊपर था।” साथ का भाग स्पष्ट रूप से पहचाना नहीं गया है।
    reason: lexical_alternative
  - marker: ग
    text: या, “जो बचा रह गया था।” प्रसंग से यह भी संकेत मिलता है कि यह भाग शाऊल के लिए अलग रख छोड़ा गया था।
    reason: alternative_reading
  - marker: घ
    text: या, “मैंने लोगों को बुलाया है।” भोज के प्रसंग में “आमंत्रित किया है” संभावित अर्थ को स्पष्ट करता है।
    reason: lexical_alternative
