- source_word: וְהֶעָלֶיהָ
  choice: और उस पर जो कुछ था
  rationale: इब्रानी पद साथ रखे अंश को स्पष्ट रूप से पहचानता नहीं; अतः किसी विशेष चर्बी या पूँछ का अनुमान लगाए बिना अस्पष्टता सुरक्षित रखी गई है।
- source_word: הַנִּשְׁאָר
  choice: जो भाग बचाकर रखा गया था
  rationale: शब्द का अर्थ ‘जो बचा है’ भी हो सकता है, पर अगला वाक्य बताता है कि यह भाग शाऊल के लिए जानबूझकर सुरक्षित रखा गया था।
- source_word: לַמּוֹעֵד
  choice: नियत समय के लिए
  rationale: यह अभिव्यक्ति पहले से ठहराए गए समय या अवसर को दर्शाती है; इसे किसी तकनीकी पर्व-संज्ञा तक सीमित नहीं किया गया।
- source_word: לֵאמֹר הָעָם קָרָאתִי
  choice: जब मैंने कहा था, ‘मैंने लोगों को आमंत्रित किया है’
  rationale: भोज के प्रसंग में קרא का अर्थ ‘आमंत्रित करना’ स्वाभाविक है। संक्षिप्त इब्रानी रचना को पठनीय हिन्दी में व्यक्त किया गया है।
- source_word: עִם שְׁמוּאֵל
  choice: शमूएल के साथ
  rationale: यह साझा भोजन को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
