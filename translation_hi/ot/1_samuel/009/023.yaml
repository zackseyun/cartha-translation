  yaml_path: translation/ot/1_samuel/009/023.yaml
  text: Then Samuel said to the cook[a], “Bring the portion that I gave you, of which I said to you, ‘Set it aside with you.’”
translation:
  language: hi
  text: तब शमूएल ने रसोइए से कहा, “वह हिस्सा ले आ, जो मैंने तुझे दिया था और जिसके विषय में मैंने तुझसे कहा था, ‘इसे अपने पास अलग रख देना।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: טַּבָּח
  choice: रसोइए
  rationale: भोज के संदर्भ में यह उस व्यक्ति को सूचित करता है जो मांस या भोजन तैयार करने और परोसने के लिए उत्तरदायी था; इसलिए ‘रसोइया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תְּנָה
  choice: ले आ
  rationale: क्रिया का मूल अर्थ ‘दे’ है, पर यहाँ सुरक्षित रखे हुए हिस्से को प्रस्तुत करने की आज्ञा है; ‘ले आ’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: מָּנָה
  choice: हिस्सा
  rationale: यह भोज में किसी के लिए निर्धारित भोजन-भाग को दर्शाता है; ‘हिस्सा’ स्पष्ट, सहज और स्रोत के निकट है।
- source_word: אֲשֶׁר נָתַתִּי לָךְ
  choice: जो मैंने तुझे दिया था
  rationale: यह पहले किए गए कार्य का सीधा उल्लेख है और נָתַתִּי के सामान्य अर्थ ‘दिया’ को बनाए रखता है।
- source_word: אֲשֶׁר אָמַרְתִּי אֵלֶיךָ
  choice: जिसके विषय में मैंने तुझसे कहा था
  rationale: यह पुनरावृत्त संबंधवाचक उपवाक्य को स्पष्ट रूप से सुरक्षित रखता है और हिन्दी में गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: שִׂים אֹתָהּ עִמָּךְ
  choice: इसे अपने पास अलग रख देना
  rationale: शाब्दिक ‘इसे अपने पास रखना’ में प्रसंगानुसार सुरक्षित रखने का भाव है; ‘अलग रख देना’ आरक्षित भाग का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
