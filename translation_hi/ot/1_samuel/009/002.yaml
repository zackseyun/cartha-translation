base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/002.yaml
  text: And he had a son whose name was Saul[a], a young man and handsome. There was not a man among the sons of Israel more handsome than he[b]; from his shoulders upward he was taller than all the people.
translation:
  language: hi
  text: उसका एक पुत्र था, जिसका नाम शाऊल था। वह जवान और सुंदर[a] था। इस्राएलियों में उससे अधिक सुंदर कोई पुरुष नहीं था। वह कंधों से ऊपर तक सब लोगों से ऊँचा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘देखने में अच्छा’।
    reason: हिब्रू טוֹב का यहां प्रसंगानुकूल वैकल्पिक अर्थ शारीरिक आकर्षण/अच्छे रूप-रंग का है।
lexical_decisions:
- source_word: בֵן
  choice: पुत्र
  rationale: यहाँ कीश की संतान के लिए सीधा पारिवारिक अर्थ है; गरिमापूर्ण आधुनिक हिन्दी में ‘पुत्र’ स्वाभाविक है।
- source_word: וּשְׁמוֹ שָׁאוּל
  choice: जिसका नाम शाऊल था
  rationale: यह हिब्रू के पहचानसूचक उपवाक्य को सहज हिन्दी में व्यक्त करता है; नाम का मानक हिन्दी लिप्यंतरण ‘शाऊल’ रखा गया है।
- source_word: בָּחוּר
  choice: जवान
  rationale: संदर्भ में यह युवावस्था के पुरुष को दर्शाता है; ‘जवान’ सामान्य आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: טוֹב / וָטוֹב
  choice: सुंदर
  rationale: טוֹב का मूल अर्थ व्यापक रूप से ‘अच्छा/उत्तम’ है, पर यहाँ व्यक्ति के रूप-रंग और अगले वाक्य में कद के वर्णन के कारण शारीरिक आकर्षण अभिप्रेत है।
- source_word: וְאֵין אִישׁ מִבְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों में ... कोई पुरुष नहीं था
  rationale: यह अस्तित्वसूचक निषेध और אִישׁ के पुरुष-सूचक अर्थ को बनाए रखते हुए ‘इस्राएल के पुत्रों’ को सहज सामुदायिक हिन्दी ‘इस्राएलियों’ में व्यक्त करता है।
- source_word: טוֹב מִמֶּנּוּ
  choice: उससे अधिक सुंदर
  rationale: तुलनात्मक מִן को स्पष्ट हिन्दी तुलना में व्यक्त किया गया है और पहले आए טוֹב का शारीरिक-वर्णन वाला अर्थ बनाए रखा गया है।
- source_word: מִשִּׁכְמוֹ וָמַעְלָה
  choice: कंधों से ऊपर तक
  rationale: यह शाऊल की असाधारण ऊँचाई बताने वाले हिब्रू मुहावरे की शारीरिक छवि को अधिक व्याख्यात्मक विस्तार के बिना बनाए रखता है।
- source_word: גָּבֹהַּ מִכָּל הָעָם
  choice: सब लोगों से ऊँचा था
  rationale: तुलनात्मक संदर्भ में גָּבֹהַּ कद को दर्शाता है; ‘ऊँचा’ स्रोत की शब्दावली के निकट रहते हुए हिन्दी में समझने योग्य है।
