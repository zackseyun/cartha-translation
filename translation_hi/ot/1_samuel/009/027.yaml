  yaml_path: translation/ot/1_samuel/009/027.yaml
  text: As they were going down to the edge of the city[a], Samuel said to Saul, “Tell the young man to go on ahead of us.” And he went on ahead. “But you, stand here now[b], and I will let you hear the word of God.”
translation:
  language: hi
  text: जब वे नगर के छोर की ओर उतर रहे थे, तब शमूएल ने शाऊल से कहा, “अपने सेवक से कहो कि वह हमसे आगे चला जाए।” और वह आगे चला गया। “पर तुम अभी यहीं ठहरो[a], और मैं तुम्हें परमेश्वर का वचन सुनाऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अभी खड़े रहो”; इब्रानी अभिव्यक्ति का आशय इस समय रुककर वहीं ठहरे रहना है। ‘सेवक’ के लिए प्रयुक्त इब्रानी शब्द जवान, परिचारक या सेवक का अर्थ भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹרְדִים
  choice: उतर रहे थे
  rationale: इब्रानी कृदंत चल रही क्रिया को व्यक्त करता है; प्रसंग में नगर के ऊँचे भाग से छोर की ओर जाने का भाव स्वाभाविक है।
- source_word: בִּקְצֵה הָעִיר
  choice: नगर के छोर पर
  rationale: קָצֶה का मूल अर्थ सीमा, सिरा या छोर है; यह ‘नगर के बाहरी भाग’ की अपेक्षा कम व्याख्यात्मक है।
- source_word: הַנַּעַר
  choice: जवान
  rationale: נַעַר का अर्थ जवान, सेवक या परिचारक हो सकता है। यहाँ शाऊल के साथ आया सेवक अभिप्रेत है, पर ‘जवान’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: וְיַעֲבֹר לְפָנֵינוּ
  choice: वह हमसे आगे चला जाए
  rationale: עבר के साथ לִפְנֵי किसी के आगे बढ़ जाने का भाव देता है; यह आधुनिक हिन्दी में सहज है।
- source_word: עֲמֹד כַּיּוֹם
  choice: अभी यहीं ठहरो
  rationale: शाब्दिक अभिव्यक्ति ‘इस समय के समान/अभी’ मुहावरेदार है; प्रसंग में शाऊल को फिलहाल उसी स्थान पर रुकने की आज्ञा दी गई है। ‘यहीं’ प्रसंग से स्पष्ट स्थानिक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַשְׁמִיעֲךָ
  choice: मैं तुम्हें ... सुनाऊँगा
  rationale: שׁמע का हिफ़ील रूप ‘सुनने देना/सुनाना’ का कारक अर्थ रखता है; ‘सुनाऊँगा’ हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: דְּבַר אֱלֹהִים
  choice: परमेश्वर का वचन
  rationale: यह अनुवाद भविष्यद्वाणी-संबंधी अभिव्यक्ति का धार्मिक भार बनाए रखता है और ‘संदेश’ की अपेक्षा मूल के अधिक निकट है।
theological_decisions:
- issue: דְּבַר אֱלֹהִים का प्रकाशन-संबंधी अर्थ
  choice: परमेश्वर का वचन
  alternative: परमेश्वर का संदेश
  rationale: ‘वचन’ आगामी ईश्वरीय प्रकाशन की भविष्यद्वाणी-संबंधी गूँज को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
