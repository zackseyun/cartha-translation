  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘शाऊल’, ‘शमूएल’ और ‘परमेश्वर का वचन’ जैसे प्रचलित बाइबलीय रूप बनाए गए हैं।
