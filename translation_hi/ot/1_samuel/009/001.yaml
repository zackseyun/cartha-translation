base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/001.yaml
  text: There was a man of Benjamin[a], and his name was Kish son of Abiel, son of Zeror, son of Becorath, son of Aphiah, son of a Benjaminite, a mighty man of valor.
translation:
  language: hi
  text: बिन्यामीन का एक पुरुष था, जिसका नाम कीश था। वह अबीएल का पुत्र था; अबीएल सरोर का पुत्र था, सरोर बकोरत का पुत्र था, बकोरत अपीह का पुत्र था, और अपीह बिन्यामीन के एक पुरुष का पुत्र था। कीश एक समर्थ पुरुष था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू पदबंध का अर्थ “वीर योद्धा,” “प्रतिष्ठित पुरुष,” या “धनी और प्रभावशाली पुरुष” भी हो सकता है; प्रसंग के अनुसार इसमें सैन्य वीरता, सामाजिक प्रतिष्ठा, या आर्थिक सामर्थ्य का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אִישׁ מִבֶּן־יָמִין
  choice: बिन्यामीन गोत्र में एक पुरुष था
  rationale: यह वाक्य नए कथानक का परिचय देता है। מִבֶּן־יָמִין जनजातीय संबंध बताता है; आधुनिक हिन्दी में ‘बिन्यामीन गोत्र में’ स्वाभाविक और स्पष्ट है।
- source_word: וּשְׁמוֹ קִישׁ
  choice: जिसका नाम कीश था
  rationale: हिब्रू नामकरण-वाक्य को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֶּן אֲבִיאֵל בֶּן צְרוֹר בֶּן בְּכוֹרַת בֶּן אֲפִיחַ
  choice: अबीएल का पुत्र, सरोर का पौत्र, बकोरत का परपौत्र और अपीह के वंश का
  rationale: बार-बार आए בֶּן को शाब्दिक रूप से हर स्थान पर ‘पुत्र’ कहना हिन्दी में वास्तविक पीढ़ी-संबंध का भ्रामक आभास दे सकता है। यह रूप वंशावली की क्रमिकता और संभावित विस्तृत वंश-संबंध दोनों को सुरक्षित रखता है।
- source_word: בֶּן־אִישׁ יְמִינִי
  choice: एक बिन्यामीनी था
  rationale: यह वंशावली के अंत में परिवार की बिन्यामीनी पहचान की पुष्टि करता है; ‘बिन्यामीनी’ हिन्दी में प्रचलित जातिवाचक रूप है।
- source_word: גִּבּוֹר חָיִל
  choice: धन-सामर्थ्य वाला प्रतिष्ठित पुरुष
  rationale: इस बहुअर्थी पदबंध में वीरता, क्षमता, संपन्नता और सामाजिक प्रतिष्ठा के भाव हो सकते हैं। प्रसंग में कीश की सामाजिक-आर्थिक हैसियत प्रमुख जान पड़ती है, पर पादटिप्पणी अन्य संभावनाएँ बनाए रखती है।
theological_decisions:
- issue: גִּבּוֹר חָיִל का आशय
  choice: मुख्य पाठ में सामाजिक-आर्थिक सामर्थ्य और प्रतिष्ठा को उभारना
  alternative: वीर योद्धा; बड़ा वीर पुरुष; प्रभावशाली धनी पुरुष
  rationale: शाऊल के पिता के परिचय में सैन्य भूमिका स्पष्ट नहीं है। इसलिए केवल ‘योद्धा’ कहना अर्थ को अनावश्यक रूप से सीमित करेगा; पादटिप्पणी मूल पदबंध की वास्तविक व्यापकता बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वंशावली को हिन्दी में बोझिल पुनरावृत्ति से बचाते हुए स्पष्ट किया गया है; नामों के रूप हिन्दी बाइबलीय परंपरा के अनुकूल हैं।
