  - severity: low
    issue: The construction ‘उन्हें न पा सके’ is somewhat literary and less fluid than standard contemporary negative word order.
    rationale: ‘उन्हें नहीं पा सके’ retains precisely the same meaning and better fits the requested modern standard Hindi register.
