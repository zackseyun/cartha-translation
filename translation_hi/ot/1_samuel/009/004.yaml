  text: וַ/יַּעֲבֹ֧ר בְּ/הַר אֶפְרַ֛יִם וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ שָׁלִ֖שָׁה וְ/לֹ֣א מָצָ֑אוּ וַ/יַּעַבְר֤וּ בְ/אֶֽרֶץ שַׁעֲלִים֙ וָ/אַ֔יִן וַ/יַּעֲבֹ֥ר בְּ/אֶֽרֶץ יְמִינִ֖י וְ/לֹ֥א מָצָֽאוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/004.yaml
  text: He passed through the hill country of Ephraim and passed through the land of Shalishah[a], but they did not find them. Then they passed through the land of Shaalim, but they were not there. Then he passed through the land of Benjamin[b], but they did not find them.
translation:
  language: hi
  text: वह एप्रैम के पहाड़ी प्रदेश से होकर गया और शालीशा के क्षेत्र से होकर गया, पर वे उन्हें[a] नहीं पा सके। फिर वे शालीम के क्षेत्र से होकर गए, पर वे वहाँ नहीं थीं[b]। इसके बाद वह बिन्यामीन के क्षेत्र से होकर गया, पर वे उन्हें नहीं पा सके।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में कर्म व्यक्त नहीं किया गया है; ‘उन्हें’ का संकेत पिछले प्रसंग में खोई हुई गधियों की ओर है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘और नहीं था’ या ‘और कुछ नहीं था’ है; यह संक्षिप्त कथन बताता है कि गधियाँ वहाँ नहीं थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲבֹר / וַיַּעַבְרוּ
  choice: से होकर निकला / से होकर गए
  rationale: עבר के साथ בְ किसी भूभाग में से होकर आगे बढ़ने का बोध देता है। हिन्दी में ये प्रयोग यात्रा की क्रमिक गति को स्वाभाविक ढंग से व्यक्त करते हैं और एकवचन तथा बहुवचन क्रियाओं का भेद बनाए रखते हैं।
- source_word: בְּהַר אֶפְרַיִם
  choice: एप्रैम के पहाड़ी प्रदेश
  rationale: इस भौगोलिक पद में הַר किसी एक पहाड़ के बजाय पहाड़ी भूभाग को सूचित करता है।
- source_word: אֶרֶץ שָׁלִשָׁה
  choice: शालीशा के क्षेत्र
  rationale: אֶרֶץ यहाँ नामित भूभाग है। ‘क्षेत्र’ आधुनिक हिन्दी में स्वाभाविक है और उसके राजनीतिक दर्जे के बारे में अनावश्यक निष्कर्ष नहीं निकालता।
- source_word: וְלֹא מָצָאוּ
  choice: पर वे उन्हें न पा सके
  rationale: बहुवचन क्रिया शाऊल और उसके सेवक को साथ रखती है। इब्रानी में कर्म निहित है; हिन्दी में ‘उन्हें’ जोड़ा गया है, जिसका संदर्भ पिछले पद की खोई हुई गधियों से है।
- source_word: אֶרֶץ שַׁעֲלִים
  choice: शालीम के क्षेत्र
  rationale: स्थान-नाम को लिप्यंतरित करते हुए אֶרֶץ को भूभाग-सूचक ‘क्षेत्र’ कहा गया है।
- source_word: וָאַיִן
  choice: पर वे वहाँ नहीं थीं
  rationale: इब्रानी का संक्षिप्त पद शाब्दिक रूप से ‘और नहीं था/कुछ नहीं था’ है। प्रसंग में यह खोजी जा रही गधियों की अनुपस्थिति को सूचित करता है; स्त्रीलिंग ‘थीं’ उस संदर्भ को स्पष्ट करता है।
- source_word: אֶרֶץ יְמִינִי
  choice: बिन्यामीन के क्षेत्र
  rationale: יְמִינִי बिन्यामीन से संबंधित जातिवाचक/विशेषण रूप है; भौगोलिक प्रसंग में ‘बिन्यामीन का क्षेत्र’ सर्वाधिक स्पष्ट है।
