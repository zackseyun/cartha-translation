  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। यात्रा की क्रमिकता तथा इब्रानी में एकवचन ‘वह’ और बहुवचन ‘वे’ के परिवर्तन को सुरक्षित रखा गया है। स्थान-नामों का प्रचलित हिन्दी लिप्यंतरण किया गया है।
