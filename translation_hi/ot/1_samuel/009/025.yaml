  text: When they came down from the high place into the city[a], he spoke with Saul on the roof.
translation:
  language: hi
  text: जब वे ऊँचे स्थान से उतरकर नगर में आए, तब उसने शाऊल से छत पर बातचीत की।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֵּרְדוּ
  choice: जब वे ... उतरकर ... आए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है। अगले एकवचन क्रियापद से स्वाभाविक संबंध बनाने के लिए कालवाचक उपवाक्य रखा गया है, जबकि ירד के उतरने के भाव को सुरक्षित रखा गया है।
- source_word: מֵהַבָּמָה
  choice: ऊँचे स्थान से
  rationale: בָּמָה यहाँ बलिदान और उपासना से जुड़े ऊँचे स्थान का सामान्य पद है; यह अनुवाद स्थल के धार्मिक स्वरूप को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: הָעִיר
  choice: नगर में
  rationale: गति-सूचक क्रिया और पहले आए מן के साथ यह ऊँचे स्थान से नगर के भीतर आने का स्वाभाविक हिन्दी रूप है।
- source_word: וַיְדַבֵּר
  choice: उसने ... बातचीत की
  rationale: एकवचन क्रिया के कर्ता को संदर्भानुसार शमूएल बताए बिना ‘उसने’ रखा गया है। עִם के साथ דּבר परस्पर संवाद का संकेत देता है, इसलिए ‘बातचीत की’ स्वाभाविक है।
- source_word: עִם שָׁאוּל
  choice: शाऊल से
  rationale: हिन्दी में ‘किसी से बातचीत करना’ עִם के सहचर्य और संवादात्मक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל הַגָּג
  choice: छत पर
  rationale: גָּג समतल मकान की छत को दर्शाता है; ‘छत पर’ आधुनिक हिन्दी में स्पष्ट और सहज है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ऊँचा स्थान’ धार्मिक स्थल की तकनीकी पहचान बनाए रखता है; ‘बातचीत की’ मूल के עִם-सहित प्रयोग को स्वाभाविक हिन्दी में दर्शाता है।
