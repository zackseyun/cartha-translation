base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/010.yaml
  text: Then Saul said to his young man[a], “Your word is good. Come[b], let us go.” So they went to the city where the man of God was.
translation:
  language: hi
  text: तब शाऊल ने अपने सेवक से कहा, “तुम्हारी बात अच्छी है। आओ, हम चलें।” तब वे उस नगर की ओर चल पड़े जहाँ परमेश्वर का जन था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “परमेश्वर का जन” इब्रानी भाषा की एक उपाधि है, जो प्रायः किसी भविष्यद्वक्ता या परमेश्वर की ओर से बोलने वाले व्यक्ति के लिए प्रयुक्त होती है।
    reason: cultural_note
lexical_decisions:
- source_word: נַעַר
  choice: सेवक
  rationale: यह शब्द मूलतः युवक को सूचित कर सकता है, पर इस प्रसंग में वह शाऊल के साथ चलने वाला अधीनस्थ परिचर है; आधुनिक हिन्दी में ‘सेवक’ उसका प्रसंगगत संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: טוֹב דְּבָרְךָ
  choice: तुम्हारी बात अच्छी है
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘प्रस्ताव’ हो सकता है। शाऊल पिछले पद में दिए सुझाव को स्वीकार कर रहा है; ‘तुम्हारी बात अच्छी है’ निकट और स्वाभाविक हिन्दी है।
- source_word: לְכָה נֵלֵכָה
  choice: आओ, हम चलें
  rationale: आज्ञार्थक रूप और कोहोर्टेटिव का मेल साथ चलने के निमंत्रण या निश्चय को व्यक्त करता है।
- source_word: הָעִיר
  choice: उस नगर
  rationale: עִיר नगर या शहर हो सकता है। यहाँ पहले से उल्लिखित स्थान के लिए निश्चित रूप है; हिन्दी में ‘उस नगर’ कथानक के संदर्भ को स्पष्ट और स्वाभाविक रखता है।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह इब्रानी उपाधि परमेश्वर के प्रतिनिधि या भविष्यद्वक्ता के लिए प्रयुक्त होती है। प्रत्यक्ष अनुवाद मूल पाठ की अपनी धार्मिक शब्दावली को बनाए रखता है।
- source_word: אֲשֶׁר שָׁם
  choice: जहाँ ... था
  rationale: संबंधवाचक पद और स्थानवाचक क्रियाविशेषण का हिन्दी में स्वाभाविक रूप ‘जहाँ’ है।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים उपाधि का अनुवाद
  choice: परमेश्वर का जन
  alternative: भविष्यद्वक्ता
  rationale: प्रसंग में वह भविष्यद्वक्ता है, फिर भी इब्रानी पाठ विशिष्ट उपाधि ‘परमेश्वर का जन’ प्रयोग करता है। उसी को रखना अनावश्यक व्याख्यात्मक प्रतिस्थापन से बचाता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद में ‘तुम्हारी बात अच्छी है’ सामान्य हिन्दी में सुझाव की स्वीकृति व्यक्त करता है; कथावाचन में सरल भूतकालीन शैली अपनाई गई है।
