base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/007.yaml
  text: Then Saul said to his young man[a], “But look, if we go, what will we bring to the man? For the bread is gone from our bags, and there is no gift to bring to the man of God[b]. What do we have?”
translation:
  language: hi
  text: तब शाऊल ने अपने जवान सेवक से कहा, “लेकिन देखो, यदि हम जाएँ, तो उस व्यक्ति के पास क्या ले जाएँगे? क्योंकि हमारी थैलियों में रखी रोटी समाप्त हो गई है[a], और परमेश्वर के जन के पास ले जाने के लिए कोई भेंट[b] नहीं है। हमारे पास क्या है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे पात्रों में से रोटी चुक गई है।” यहाँ “पात्र” यात्रा में भोजन-सामग्री रखने वाली थैलियों या डिब्बों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या “उपहार।” मूल शब्द किसी सम्मानित व्यक्ति के पास ले जाई जाने वाली वस्तु को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעַר
  choice: जवान सेवक
  rationale: यह शब्द युवक या युवा परिचर को सूचित कर सकता है। कथा में वह शाऊल का परिचर है; ‘जवान सेवक’ आयु और भूमिका दोनों को व्यक्त करता है, बिना उसे दास ठहराए।
- source_word: וְהִנֵּה
  choice: लेकिन देखो
  rationale: यह पद ध्यान खींचते हुए शाऊल की व्यावहारिक आपत्ति प्रस्तुत करता है। ‘लेकिन देखो’ दोनों भावों को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: נֵלֵךְ
  choice: यदि हम जाएँ
  rationale: यहाँ अपूर्ण क्रिया शर्त-सदृश कथन में है; हिन्दी में ‘यदि हम जाएँ’ उस अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: נָּבִיא
  choice: ले जाएँगे
  rationale: בוא का हिफ़ील रूप यहाँ किसी व्यक्ति के लिए कुछ साथ ले जाने या पहुँचाने के अर्थ में है। प्रश्न के प्रसंग में ‘ले जाएँगे’ स्वाभाविक है।
- source_word: לָאִישׁ
  choice: उस पुरुष के लिए
  rationale: इब्रानी पद एक निश्चित पुरुष, अर्थात् आगे बताए गए परमेश्वर के जन, की ओर संकेत करता है।
- source_word: לֶחֶם
  choice: रोटी
  rationale: मूल शब्द का ठोस अर्थ ‘रोटी’ है। यद्यपि यह व्यापक रूप से भोजन-सामग्री का भी संकेत दे सकता है, मुख्य पाठ ठोस शब्द को बनाए रखता है।
- source_word: אָזַל
  choice: समाप्त हो गई है
  rationale: क्रिया किसी वस्तु के चुक जाने या पूरी तरह खर्च हो जाने को व्यक्त करती है।
- source_word: כְּלִי
  choice: थैलियाँ
  rationale: शब्द का सामान्य अर्थ पात्र या सामान रखने का साधन है। यात्रा के इस प्रसंग में ‘थैलियाँ’ स्पष्ट और स्वाभाविक ठोस समतुल्य है।
- source_word: תְּשׁוּרָה
  choice: भेंट
  rationale: यह किसी सम्मानित व्यक्ति के पास ले जाई जाने वाली भेंट या उपहार है। ‘भेंट’ प्रसंग के सामाजिक सम्मान को व्यक्त करता है, पर इसे अनुष्ठानिक चढ़ावा नहीं बनाता।
- source_word: אִישׁ הָאֱלֹהִים
  choice: परमेश्वर का जन
  rationale: यह ईश्वर द्वारा नियुक्त व्यक्ति की स्थापित इब्रानी उपाधि है। इसका शाब्दिक रूप बनाए रखने से इसे केवल ‘भविष्यद्वक्ता’ में सीमित नहीं किया जाता।
- source_word: מָה אִתָּנוּ
  choice: हमारे पास क्या है?
  rationale: इब्रानी मुहावरा पूछता है कि उनके पास साथ में क्या उपलब्ध है; यह उसका स्वाभाविक हिन्दी रूप है।
theological_decisions:
- issue: אִישׁ הָאֱלֹהִים की उपाधि
  choice: परमेश्वर का जन
  alternative: भविष्यद्वक्ता
  rationale: मूल पाठ विशिष्ट उपाधि ‘परमेश्वर का जन’ प्रयोग करता है। ‘भविष्यद्वक्ता’ प्रसंगतः उचित हो सकता है, पर मूल अभिव्यक्ति को बदलकर उसकी अर्थ-सीमा संकुचित कर देगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली अपनाई गई है। संवाद की व्यावहारिक चिंता और मूल के ठोस शब्द ‘रोटी’ को बनाए रखा गया है; अप्रचलित ‘देखो/निहारो’ जैसे अत्यधिक पुरातन विकल्पों से बचा गया है।
