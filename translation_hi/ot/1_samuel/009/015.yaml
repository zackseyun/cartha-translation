lexical_decisions:
- source_word: וַיהוָה
  choice: यहोवा ने
  rationale: प्रत्यक्ष ईश्वरीय नाम יהוה को ‘यहोवा’ के रूप में रखा गया है। आरंभिक וַ कथानक को आगे बढ़ाता है; हिंदी में अलग से ‘अब’ जोड़ना आवश्यक नहीं है।
- source_word: גָּלָה אֶת־אֹזֶן שְׁמוּאֵל
  choice: शमूएल को यह प्रकट कर दिया था
  rationale: शाब्दिक मुहावरा ‘शमूएल का कान खोलना/उघाड़ना’ किसी बात को उस पर प्रकट करने या उसे बताने का अर्थ देता है। मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और मूल बिंब पादटिप्पणी में दिया गया है। ‘यह’ अगली आयत में आने वाली वाणी की ओर संकेत करता है।
- source_word: יוֹם אֶחָד לִפְנֵי בּוֹא שָׁאוּל
  choice: शाऊल के आने से एक दिन पहले
  rationale: समय-संबंधी पदबंध का सीधा और स्वाभाविक हिंदी रूप; ‘एक दिन’ और ‘पहले’ दोनों तत्व सुरक्षित हैं।
- source_word: לֵאמֹר
  choice: ':'
  rationale: यह रूप अगले पद के प्रत्यक्ष कथन का परिचय देता है। हिंदी में द्विबिंदु ‘यह कहते हुए’ की अपेक्षा अधिक स्वाभाविक ढंग से उसी कार्य को पूरा करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יהוה आया है; उसे सामान्य उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। भूतपूर्व पूर्णता के लिए ‘कर दिया था’ रखा गया है, क्योंकि यह प्रकाशन शाऊल के आने से एक दिन पहले हो चुका था।
