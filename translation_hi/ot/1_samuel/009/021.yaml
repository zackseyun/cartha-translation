  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֨עַן שָׁא֜וּל וַ/יֹּ֗אמֶר הֲ/ל֨וֹא בֶן יְמִינִ֤י אָ֨נֹכִי֙ מִ/קַּטַנֵּי֙ שִׁבְטֵ֣י יִשְׂרָאֵ֔ל וּ/מִשְׁפַּחְתִּ/י֙ הַ/צְּעִרָ֔ה מִ/כָּֽל מִשְׁפְּח֖וֹת שִׁבְטֵ֣י בִנְיָמִ֑ן וְ/לָ֨/מָּה֙ דִּבַּ֣רְתָּ אֵלַ֔/י כַּ/דָּבָ֖ר הַ/זֶּֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/021.yaml
  text: Saul answered and said[a], “Am I not a Benjaminite, from the smallest of the tribes of Israel? And is not my clan the least of all the clans of the tribe of Benjamin? So why have you spoken to me in this way?”
translation:
  language: hi
  text: शाऊल ने उत्तर दिया, “क्या मैं बिन्यामीन गोत्र का नहीं हूँ, जो इस्राएल के सबसे छोटे गोत्रों में से एक है? और क्या मेरा कुल बिन्यामीन गोत्र के सभी कुलों में सबसे छोटा नहीं है? फिर आपने मुझसे ऐसी बात क्यों कही?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן שָׁאוּל וַיֹּאמֶר
  choice: शाऊल ने उत्तर दिया
  rationale: हिब्रू का शाब्दिक दोहराव ‘उत्तर दिया और कहा’ आधुनिक हिन्दी में अनावश्यक है; ‘उत्तर दिया’ दोनों क्रियाओं का स्वाभाविक अर्थ व्यक्त करता है।
- source_word: הֲלוֹא בֶן־יְמִינִי אָנֹכִי
  choice: क्या मैं बिन्यामीनी नहीं हूँ
  rationale: הֲלוֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। בֶן־יְמִינִי यहाँ गोत्र-संबंधी पहचान बताता है, इसलिए ‘बिन्यामीनी’ उपयुक्त है।
- source_word: מִקְּטַנֵּי שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सबसे छोटे गोत्रों में से एक का
  rationale: बहुवचन-संरचना का अर्थ छोटे/तुच्छ माने जाने वाले गोत्रों में सदस्यता है। ‘में से एक’ हिन्दी में इस रचना को स्पष्ट करता है, जबकि ‘सबसे छोटा गोत्र’ मूल के बहुवचन को अनावश्यक रूप से एक निश्चित सर्वोच्चता में बदल देता।
- source_word: וּמִשְׁפַּחְתִּי
  choice: और क्या मेरा कुल
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर का व्यापक नातेदारी-समूह है; आधुनिक हिन्दी में ‘कुल’ इस सामाजिक इकाई को ‘परिवार’ से अधिक ठीक व्यक्त करता है। दूसरे आलंकारिक प्रश्न को हिन्दी में स्पष्ट करने के लिए ‘क्या’ जोड़ा गया है।
- source_word: הַצְּעִרָה
  choice: सबसे छोटा
  rationale: शब्द आकार, पद या महत्त्व में छोटा/तुच्छ होने का भाव दे सकता है। ‘सबसे छोटा’ मूल की तुलनात्मक-सर्वोच्च अभिव्यक्ति को बनाए रखता है और शाऊल की विनम्र आत्म-स्थिति को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: מִכָּל מִשְׁפְּחוֹת שִׁבְטֵי בִנְיָמִן
  choice: बिन्यामीन गोत्र के सब कुलों में
  rationale: व्यंजन-पाठ में שִׁבְטֵי का रूप बहुवचन-संबंधसूचक दिखता है, पर प्रसंग बिन्यामीन के एक ही गोत्र के अंतर्गत कुलों की तुलना करता है; हिन्दी में ‘बिन्यामीन गोत्र के’ यही आशय स्वाभाविक और स्पष्ट रखता है।
- source_word: וְלָמָּה דִּבַּרְתָּ אֵלַי כַּדָּבָר הַזֶּה
  choice: फिर आपने मुझसे ऐसी बात क्यों कही?
  rationale: וְלָמָּה पिछले कथनों से निष्कर्षात्मक प्रश्न जोड़ता है, इसलिए ‘फिर ... क्यों’ स्वाभाविक है। כַּדָּבָר הַזֶּה कथन की विषय-वस्तु की ओर संकेत करता है; ‘ऐसी बात’ ‘इस प्रकार’ की अपेक्षा यहाँ अधिक प्रत्यक्ष है।
