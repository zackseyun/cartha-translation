translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘गोत्र’ और ‘कुल’ बाइबिलीय सामाजिक संरचना के परिचित तथा भिन्न स्तरों को स्पष्ट रखते हैं। मूल के आलंकारिक प्रश्न और शाऊल की विनम्रता सुरक्षित हैं।
