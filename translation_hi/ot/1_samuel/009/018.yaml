- source_word: הַגִּידָה נָּא לִי
  choice: कृपया मुझे बताइए
  rationale: आज्ञार्थक रूप के साथ נָא विनम्र अनुरोध व्यक्त करता है; आदरसूचक ‘बताइए’ संवाद के संदर्भ में स्वाभाविक है।
- source_word: אֵי זֶה
  choice: कहाँ है
  rationale: संदर्भ में यह पद किसी स्थान की पहचान पूछता है; हिन्दी में ‘कहाँ है’ इसका सहज समतुल्य है।
- source_word: בֵּית הָרֹאֶה
  choice: दर्शी का घर
  rationale: רֹאֶה का मूल संबंध ‘देखने’ से है और अध्याय में यह भविष्यद्वक्ता के लिए पुराना पद बताया गया है। ‘दर्शी’ उस ऐतिहासिक भेद को बनाए रखता है, जबकि संबंधकारक रचना हिन्दी में स्वाभाविक है।
