  text: וַ/יִּקַּ֤ח שְׁמוּאֵל֙ אֶת שָׁא֣וּל וְ/אֶֽת נַעֲר֔/וֹ וַ/יְבִיאֵ֖/ם לִשְׁכָּ֑תָ/ה וַ/יִּתֵּ֨ן לָ/הֶ֤ם מָקוֹם֙ בְּ/רֹ֣אשׁ הַ/קְּרוּאִ֔ים וְ/הֵ֖מָּה כִּ/שְׁלֹשִׁ֥ים אִֽישׁ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/022.yaml
  text: Then Samuel took Saul and his young man and brought them into the hall[a], and gave them a place at the head of those who had been invited[c][b]; and they were about thirty men.
translation:
  language: hi
  text: तब शमूएल शाऊल और उसके सेवक[a] को लेकर उन्हें भोज-कक्ष[b] में ले गया। उसने उन्हें आमंत्रित लोगों में सबसे आगे स्थान दिया; वे लगभग तीस पुरुष थे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके युवक” अथवा “उसके सहायक”।
    reason: lexical_alternative
  - marker: b
    text: या “कक्ष में।” इब्रानी शब्द किसी कमरे या कक्ष को सूचित कर सकता है; यहाँ भोज का स्थान अभिप्रेत है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में, “और वे लगभग तीस पुरुष थे।” सम्भवतः यह आमंत्रित लोगों की संख्या बताता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: נַעֲרוֹ
  choice: उसके सेवक
  rationale: נַעַר का अर्थ युवक, सेवक या सहायक हो सकता है। कथा-संदर्भ में यह शाऊल के साथ चल रहे अधीनस्थ सहायक को सूचित करता है; आधुनिक हिन्दी में ‘सेवक’ स्वाभाविक और स्पष्ट है, जबकि पादटिप्पणी अन्य सम्भावना सुरक्षित रखती है।
- source_word: לִשְׁכָּתָה
  choice: भोज-कक्ष में
  rationale: לִשְׁכָּה कक्ष, कमरा या सभागार को सूचित कर सकता है। यहाँ भोजन और अतिथियों के संदर्भ में ‘भोज-कक्ष’ स्थान के प्रयोजन को स्वाभाविक ढंग से व्यक्त करता है, बिना उसे अनावश्यक रूप से विशाल सभागार मानने के।
- source_word: מָקוֹם
  choice: स्थान
  rationale: מָקוֹם का मूल अर्थ ‘स्थान’ है। भोज के संदर्भ में बैठने की जगह निहित है, पर ‘स्थान’ इब्रानी की व्यापकता बनाए रखता है।
- source_word: בְּרֹאשׁ
  choice: सबसे आगे
  rationale: शाब्दिक रूप से ‘सिर पर/अग्रभाग में’; यहाँ सम्मान और प्रमुखता का स्थान अभिप्रेत है। ‘सबसे आगे’ आधुनिक हिन्दी में स्वाभाविक रहते हुए स्थानगत रूपक बचाता है।
- source_word: הַקְּרוּאִים
  choice: आमंत्रित लोग
  rationale: קרא का यह कर्मवाच्य कृदन्त ‘बुलाए हुए’ लोगों को दर्शाता है; भोज-संदर्भ में ‘आमंत्रित लोग’ स्पष्ट और सटीक है।
- source_word: וְהֵמָּה כִּשְׁלֹשִׁים אִישׁ
  choice: वे लगभग तीस पुरुष थे
  rationale: यह उपवाक्य निकटतम बहुवचन समूह, अर्थात आमंत्रित लोगों, की संख्या बताता प्रतीत होता है। אִישׁ के कारण ‘पुरुष’ रखा गया है; संदर्भगत सम्बन्ध की सम्भावित अस्पष्टता पादटिप्पणी में बताई गई है।
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का सामान्य अर्थ ‘लेना’ है। क्रमिक हिन्दी वाक्य में ‘को लेकर ... ले गया’ क्रिया-क्रम को सहज रूप से व्यक्त करता है।
- source_word: וַיְבִיאֵם
  choice: उन्हें ... में ले गया
  rationale: בוא के हिफ़ील रूप का अर्थ भीतर लाना या ले जाना है। गन्तव्य के साथ ‘में ले गया’ आधुनिक हिन्दी में स्वाभाविक है।
