base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/008.yaml
  text: The young man answered Saul again and said[a], “Look, I have in my hand a quarter shekel of silver. I will give it to the man of God, and he will tell us our way.”
translation:
  language: hi
  text: उस युवक ने शाऊल को फिर उत्तर दिया और कहा, “देखिए, मेरे हाथ में चाँदी का एक चौथाई शेकेल है। मैं इसे परमेश्वर के जन को दे दूँगा, और वह हमें हमारा मार्ग बता देगा[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमें बता देगा कि हमें किस मार्ग पर जाना चाहिए।” हिब्रू में शाब्दिक रूप से “हमारा मार्ग” है, जिसका अर्थ आगे का रास्ता या अपनाया जाने वाला उपाय हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּסֶף ... לַעֲנוֹת
  choice: फिर उत्तर दिया
  rationale: יסף + infinitive की पुनरावृत्तिमूलक अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַנַּעַר
  choice: उस जवान
  rationale: נער यहाँ युवक अथवा सेवक दोनों का संकेत दे सकता है; ‘जवान’ आयु-संबंधी मूल अर्थ को रखता है और भूमिका को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הִנֵּה
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले विस्मयादिबोधक का आधुनिक और प्रसंगानुकूल आदरसूचक रूप है।
- source_word: נִמְצָא בְיָדִי
  choice: मेरे हाथ में ... है
  rationale: हिब्रू की शाब्दिक ‘मेरे हाथ में पाया जाता है’ संरचना का स्वाभाविक हिन्दी रूप, जो वास्तविक धारण को भी बनाए रखता है।
- source_word: רֶבַע שֶׁקֶל כָּסֶף
  choice: चाँदी का एक चौथाई शेकेल
  rationale: मूल भार-आधारित मूल्य को बिना आधुनिक मुद्रा में बदले ठीक-ठीक व्यक्त करता है।
- source_word: וְנָתַתִּי
  choice: मैं इसे ... दे दूँगा
  rationale: इस प्रसंग में पूर्ण क्रिया वक्ता के भावी इरादे को व्यक्त करती है; ‘इसे’ चाँदी की राशि का स्वाभाविक संदर्भ देता है।
- source_word: לְאִישׁ הָאֱלֹהִים
  choice: परमेश्वर के जन को
  rationale: ईश्वरीय रूप से नियुक्त व्यक्ति के लिए प्रचलित, गरिमापूर्ण और स्पष्ट हिन्दी पद है।
- source_word: וְהִגִּיד לָנוּ
  choice: वह हमें ... बता देगा
  rationale: Hiphil נגד के ‘बताने/ज्ञात कराने’ के अर्थ को कथानक में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת דַּרְכֵּנוּ
  choice: हमारा मार्ग
  rationale: हिब्रू की जानबूझकर खुली अभिव्यक्ति को बनाए रखता है, जो आगे के रास्ते या अपनाए जाने वाले उपाय दोनों की ओर संकेत कर सकती है।
