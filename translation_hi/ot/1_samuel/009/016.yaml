base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/009/016.yaml
  text: About this time tomorrow I will send to you a man from the land of Benjamin[a], and you shall anoint him as ruler over my people Israel. He will save my people from the hand of the Philistines, for I have seen my people[b], because their cry has come to me.
translation:
  language: hi
  text: कल लगभग इसी समय मैं तुम्हारे पास बिन्यामीन के प्रदेश से एक पुरुष भेजूँगा। तुम उसे मेरी प्रजा इस्राएल पर शासक[a] के रूप में अभिषेक करना। वह मेरी प्रजा को पलिश्तियों के हाथ से छुड़ाएगा, क्योंकि मैंने अपनी प्रजा को देखा है; क्योंकि उसकी पुकार मेरे पास पहुँची है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: ‘नागीद’; इसके अर्थ ‘अगुआ’ या ‘प्रधान’ भी हो सकते हैं, और पारंपरिक अनुवाद ‘राजकुमार’ है। यह शब्द शासन के लिए नियुक्त व्यक्ति को दर्शाता है, केवल किसी औपचारिक पदधारी को नहीं।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘उसकी पुकार’ है; एकवचन प्रत्यय सामूहिक संज्ञा ‘मेरी प्रजा’ की ओर संकेत करता है।
    reason: source_form
lexical_decisions:
- source_word: כָּעֵת מָחָר
  choice: कल लगभग इसी समय
  rationale: यह समयसूचक मुहावरा अगले दिन के लगभग इसी समय को दर्शाता है; यह रूप स्वाभाविक हिन्दी में उसकी निकटता और समयगत विशिष्टता दोनों बनाए रखता है।
- source_word: אֶשְׁלַח אֵלֶיךָ
  choice: मैं तुम्हारे पास ... भेजूँगा
  rationale: אֶל की दिशात्मकता को ‘तुम्हारे पास’ से स्पष्ट रखा गया है।
- source_word: אִישׁ
  choice: एक पुरुष
  rationale: संज्ञा एक विशिष्ट पुरुष व्यक्ति को सूचित करती है; ‘व्यक्ति’ की अपेक्षा ‘पुरुष’ मूल की लैंगिक विशिष्टता बनाए रखता है।
- source_word: מֵאֶרֶץ בִּנְיָמִן
  choice: बिन्यामीन के प्रदेश से
  rationale: אֶרֶץ यहाँ गोत्र से जुड़े भूभाग या प्रदेश को दर्शाता है; ‘प्रदेश’ आधुनिक हिन्दी में सहज और भौगोलिक रूप से स्पष्ट है।
- source_word: וּמְשַׁחְתּוֹ
  choice: उसका अभिषेक करना
  rationale: वाव-संयुक्त पूर्ण क्रिया यहाँ शमूएल को दिए गए भावी निर्देश का कार्य करती है; हिन्दी का आज्ञार्थक रूप इसे स्पष्ट करता है।
- source_word: לְנָגִיד
  choice: शासक के रूप में
  rationale: נָגִיד नियुक्त शासनकर्ता या अगुआ को दर्शाता है, पर यहाँ सीधे ‘राजा’ कहना मूल से अधिक विशिष्ट होगा। ‘शासक’ राजनीतिक अधिकार बनाए रखता है।
- source_word: וְהוֹשִׁיעַ
  choice: वह ... छुड़ाएगा
  rationale: यָשַׁע से बनी क्रिया संकट और शत्रु के अधिकार से बचाने या छुड़ाने का भाव रखती है; प्रसंग में ‘छुड़ाएगा’ स्वाभाविक है।
- source_word: מִיַּד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथ से
  rationale: ‘हाथ’ शक्ति या नियंत्रण का इब्रानी मुहावरा है और हिन्दी में भी बोधगम्य है, इसलिए मूल बिंब सुरक्षित रखा गया है।
- source_word: כִּי רָאִיתִי אֶת עַמִּי
  choice: क्योंकि मैंने अपनी प्रजा को देखा है
  rationale: सीधे कथन को बनाए रखा गया है; ‘ध्यान दिया’ अर्थ स्पष्ट कर सकता था, पर वह मूल की खुली अर्थ-छाया को सीमित कर देता।
- source_word: כִּי בָּאָה צַעֲקָתוֹ אֵלָי
  choice: उसकी पुकार मेरे पास पहुँची है
  rationale: एकवचन प्रत्यय सामूहिक एकवचन ‘मेरी प्रजा’ की ओर लौटता है। हिन्दी में ‘उसकी’ इस व्याकरणिक और सामूहिक संबंध को स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: शाऊल के पद के लिए נָגִיד का अनुवाद
  choice: शासक
  alternative: अगुआ; प्रधान; पारंपरिक रूप से राजकुमार
  rationale: यह शब्द परमेश्वर द्वारा नियुक्त शासनकारी अधिकार बताता है, किंतु इस पद में मूल पाठ उसे מֶלֶךְ, अर्थात् ‘राजा’, नहीं कहता। ‘शासक’ अधिकार को व्यक्त करते हुए अनावश्यक राजकीय विशिष्टता नहीं जोड़ता।
- issue: צַעֲקָתוֹ में सामूहिक संज्ञा की ओर संकेत करता एकवचन प्रत्यय
  choice: उसकी पुकार
  alternative: उनकी पुकार
  rationale: मूल इब्रानी में प्रत्यय एकवचन है और उसका पूर्वपद सामूहिक एकवचन ‘मेरी प्रजा’ है। हिन्दी में ‘प्रजा ... उसकी’ स्वाभाविक है और मूल की सामूहिक एकता बनाए रखती है।
- issue: रָאִיתִי में परमेश्वर के ‘देखने’ का भाव
  choice: मैंने अपनी प्रजा को देखा है
  alternative: मैंने अपनी प्रजा की दशा पर ध्यान दिया है
  rationale: ‘देखना’ यहाँ दयापूर्ण संज्ञान का संकेत दे सकता है, पर अनुवाद में उसका अर्थ पूरी तरह व्याख्यायित न करके मूल की संक्षिप्तता और धर्मवैचारिक प्रतिध्वनि सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। परमेश्वर द्वारा शमूएल को एकवचन संबोधन के लिए ‘तुम’ चुना गया है। ‘अभिषेक’, ‘प्रजा’ और ‘पलिश्तियों के हाथ से’ जैसे स्थापित बाइबलीय पद प्रसंग की गरिमा और मूल बिंब बनाए रखते हैं।
