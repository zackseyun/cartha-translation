base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/012.yaml
  text: And the servants of Achish said to him[a], “Is this not David, the king of the land? Is this not the one of whom they sang in the dances, saying, ‘Saul has struck down his thousands[b], and David his ten thousands’?”
translation:
  language: hi
  text: 'तब आकीश के सेवकों ने उससे कहा, “क्या यह दाऊद, इस देश का राजा नहीं है? क्या यह वही नहीं है जिसके विषय में वे नाचते हुए गाते थे[a],


    ‘शाऊल ने हज़ारों को मार गिराया,


    और दाऊद ने दस हज़ारों को[b]’?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वे नृत्यों में एक-दूसरे को उत्तर देते हुए गाते थे”; अर्थात नाचते समय प्रत्युत्तर में गाया जाता था।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके दस हज़ार”; “दस हज़ारों” का अनुवाद “अयूतों” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַבְדֵי
  choice: सेवकों
  rationale: यह शब्द आकीश के घराने या दरबार से जुड़े लोगों को सूचित करता है। ‘सेवकों’ इसका सीधा और पर्याप्त व्यापक अनुवाद है; ‘अधिकारियों’ कहने से अर्थ अनावश्यक रूप से संकुचित हो जाता।
- source_word: הֲלוֹא
  choice: क्या ... नहीं है?
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। हिन्दी में प्रश्नात्मक रूप बनाए रखने से मूल का बल सुरक्षित रहता है।
- source_word: מֶלֶךְ הָאָרֶץ
  choice: इस देश का राजा
  rationale: यह मूल अभिव्यक्ति का निकट और स्वाभाविक हिन्दी रूप है। सेवक इसे औपचारिक उपाधि, लोकप्रिय धारणा या अतिशयोक्ति के रूप में कह रहे हैं—अनुवाद इसका निर्णय नहीं करता।
- source_word: יַעֲנוּ
  choice: गाते थे
  rationale: नृत्य और विजय-गान के प्रसंग में क्रिया का आशय गाना, विशेषतः उत्तर-प्रत्युत्तर में गाना, है। मुख्य पाठ में सहज अर्थ रखा गया है और प्रत्युत्तरात्मक भाव पादटिप्पणी में दिया गया है।
- source_word: בַמְּחֹלוֹת
  choice: नाचते हुए
  rationale: संज्ञा नृत्य या नृत्य-समारोह को दर्शाती है। ‘नाचते हुए’ आधुनिक हिन्दी में प्रसंग को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הִכָּה
  choice: मार गिराया
  rationale: विजय-गान के युद्ध-संदर्भ में क्रिया का अर्थ प्रहार करके मार डालना है। ‘मार गिराया’ स्पष्ट, सजीव और गैर-पुरातन है।
- source_word: באלפו
  choice: हज़ारों को
  rationale: यहाँ संख्या शाऊल के नाम माने गए युद्ध-वधों की गिनती बताती है। हिन्दी में स्वामित्वसूचक पद जोड़ने पर यह भ्रम हो सकता है कि उसने अपने ही लोगों को मारा; अतः अर्थ को स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: ברבבתו
  choice: दसियों हज़ारों को
  rationale: רבבה का अर्थ दस हज़ार या व्यापक रूप में बहुत-से दस हज़ार हो सकता है। ‘दसियों हज़ारों’ विजय-गान की संख्यात्मक समानांतरता और बहुलता को स्वाभाविक हिन्दी में बनाए रखता है।
theological_decisions:
- issue: दाऊद को ‘देश का राजा’ कहना वस्तुगत उपाधि है या पलिश्ती सेवकों की धारणा
  choice: इस देश का राजा
  alternative: इस देश में प्रमुख व्यक्ति / इस देश का माना जाने वाला राजा
  rationale: इब्रानी पाठ सेवकों के कथन को बिना व्याख्या के प्रस्तुत करता है। इसलिए अनुवाद न तो दाऊद के तत्काल औपचारिक राजत्व की पुष्टि करता है, न कथन को केवल अतिशयोक्ति घोषित करता है; मूल का तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। गीत को अलग पंक्तियों में रखकर उसकी काव्यात्मक समानांतरता दिखाई गई है। ‘दसियों हज़ारों’ सामान्य पाठक के लिए स्वाभाविक है, जबकि शाब्दिक संख्यात्मक विकल्प पादटिप्पणी में सुरक्षित है।
