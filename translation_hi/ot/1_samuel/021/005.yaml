base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/005.yaml
  text: The priest answered David and said[a], “There is no ordinary bread on hand, but there is holy bread—if the young men have kept themselves from women.”
translation:
  language: hi
  text: याजक ने दाऊद को उत्तर दिया, “मेरे पास साधारण रोटी नहीं है, पर पवित्र रोटी है—यदि उन युवकों ने कम-से-कम स्त्रियों से अपने आपको दूर रखा हो।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी स्त्री से दूर रहे हों,” अर्थात अनुष्ठानिक शुद्धता के लिए यौन संबंधों से परहेज़ किया हो।
    reason: אִשָּׁה का एकवचन ‘किसी स्त्री’ या सामूहिक रूप से ‘स्त्रियों’ का बोध करा सकता है; प्रसंग में दूर रहने का आशय यौन संबंधों से परहेज़ है।
lexical_decisions:
- source_word: לֶחֶם חֹל
  choice: साधारण रोटी
  rationale: חֹל यहाँ קֹדֶשׁ के विपरीत गैर-पवित्र या सामान्य उपयोग की रोटी को दर्शाता है; ‘साधारण’ इस धार्मिक-विधिक अंतर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל תַּחַת יָדִי
  choice: मेरे पास
  rationale: शाब्दिक रूप ‘मेरे हाथ के नीचे’ उपलब्धता या अधिकार में होने का मुहावरा है; ‘मेरे पास’ आधुनिक हिन्दी में उसका स्पष्ट अर्थ देता है।
- source_word: כִּי אִם
  choice: केवल
  rationale: यह सामान्य रोटी न होने के बाद उपलब्ध अपवाद को प्रस्तुत करता है; हिन्दी में ‘केवल पवित्र रोटी है’ इस विरोध को सहजता से व्यक्त करता है।
- source_word: לֶחֶם קֹדֶשׁ
  choice: पवित्र रोटी
  rationale: यह उपासना के लिए अलग की गई रोटी है; ‘पवित्र रोटी’ सीधा, सुबोध और धार्मिक-विधिक अर्थ के अनुरूप है।
- source_word: אִם נִשְׁמְרוּ
  choice: बशर्ते ... अपने आपको ... दूर रखा हो
  rationale: שׁמר का निफ़अल रूप यहाँ किसी वस्तु से स्वयं को बचाए या अलग रखे होने को व्यक्त करता है; ‘बशर्ते’ वास्तविक शर्त को स्पष्ट रखता है।
- source_word: הַנְּעָרִים
  choice: उन जवानों
  rationale: נְעָרִים युवक, सेवक या साथ के जवान पुरुषों को सूचित कर सकता है; प्रसंग में ‘उन जवानों’ दाऊद के साथियों की ओर संकेत करते हुए अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: אַךְ מֵאִשָּׁה
  choice: स्त्रियों से दूर
  rationale: אַךְ शर्त को विशेषतः इसी विषय तक सीमित करता है और אִשָּׁה का एकवचन यहाँ सामूहिक अर्थ ले सकता है। मुख्य पाठ मूल की संक्षिप्त अभिव्यक्ति बनाए रखता है; आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: पवित्र रोटी पाने के लिए धार्मिक शुद्धता की शर्त
  choice: याजक पवित्र रोटी देने की शर्त के रूप में जवानों का स्त्रियों से दूर रहना बताता है, और मुख्य पाठ इब्रानी की संक्षिप्तता बनाए रखता है।
  alternative: इसे मुख्य पाठ में स्पष्ट रूप से ‘स्त्रियों के साथ यौन संबंधों से दूर रहे हों’ कहा जा सकता है।
  rationale: प्रसंग धार्मिक-विधिक शुद्धता का है, न कि स्त्रियों या वैवाहिक यौन संबंधों के विषय में कोई सामान्य नैतिक निर्णय। पादटिप्पणी आशय स्पष्ट करती है, बिना मुख्य पाठ में व्याख्या मिला दिए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक,’ ‘पवित्र रोटी’ और ‘धार्मिक शुद्धता’ जैसे शब्द प्रसंग की उपासना-संबंधी श्रेणियों को स्पष्ट रखते हैं।
