  text: וַ/יְשַׁנּ֤/וֹ אֶת טַעְמ/וֹ֙ בְּ/עֵ֣ינֵי/הֶ֔ם וַ/יִּתְהֹלֵ֖ל בְּ/יָדָ֑/ם ו/יתו עַל דַּלְת֣וֹת הַ/שַּׁ֔עַר וַ/יּ֥וֹרֶד רִיר֖/וֹ אֶל זְקָנֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/014.yaml
  text: So he changed his behavior before their eyes and acted like a madman in their hands[b][a]; he made marks on the doors of the gate and let his saliva run down onto his beard.
translation:
  language: hi
  text: तब उसने उनके सामने अपना व्यवहार बदल लिया और उनकी पकड़ में रहते हुए पागल जैसा व्यवहार किया[a]। उसने फाटक के किवाड़ों पर निशान बनाए[b] और अपनी लार अपनी दाढ़ी पर बहने दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पागलपन का ढोंग किया”; इब्रानी क्रिया उन्मत्त ढंग से व्यवहार करने का वर्णन करती है, और प्रसंग संकेत देता है कि दाऊद ने ऐसा जानबूझकर किया।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया कठिन है; इसका अर्थ किवाड़ों पर “खरोंचें लगाईं,” “लकीरें खींचीं” या “कुछ लिखा” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיְשַׁנּוֹ אֶת־טַעְמוֹ
  choice: उसने ... अपना व्यवहार बदल लिया
  rationale: טַעַם का मूल अर्थ स्वाद और लाक्षणिक अर्थ समझ-विवेक हो सकता है, पर इस कथात्मक प्रसंग में दृश्य रूप से बदले हुए आचरण या ढंग की बात है। ‘व्यवहार’ आंतरिक मानसिक दशा को अनावश्यक रूप से निश्चित किए बिना प्रसंग स्पष्ट करता है।
- source_word: בְּעֵינֵיהֶם
  choice: उनके सामने
  rationale: शाब्दिक बिंब ‘उनकी आँखों में’ है, जिसका स्वाभाविक हिन्दी अर्थ ‘उनके सामने/उनकी दृष्टि में’ है।
- source_word: וַיִּתְהֹלֵל
  choice: पागल जैसा व्यवहार किया
  rationale: यह रूप उन्मत्त या विक्षिप्त ढंग से आचरण करने को व्यक्त करता है। ‘जैसा’ से बाहरी प्रदर्शन का भाव आता है, जबकि जानबूझकर किए गए ढोंग की बात प्रसंग पर छोड़ी जाती है।
- source_word: בְּיָדָם
  choice: उनकी पकड़ में रहते हुए
  rationale: शाब्दिक ‘उनके हाथ में’ यहाँ उनके अधिकार या नियंत्रण में होने का मुहावरा है। ‘पकड़ में’ हिन्दी में स्वाभाविक है और मूल बिंब भी बनाए रखता है।
- source_word: ויתו
  choice: लकीरें खींचीं
  rationale: यह कठिन और विरल क्रियारूप है। प्रसंग में फाटक के किवाड़ों पर खरोंचने, लिखने या निशान बनाने जैसी क्रिया अभिप्रेत है; ‘लकीरें खींचीं’ अपेक्षाकृत सतर्क और दृश्य हिन्दी है।
- source_word: דַּלְתוֹת הַשַּׁעַר
  choice: फाटक के किवाड़ों
  rationale: यह फाटक के दरवाज़े के पटों को सूचित करता है; ‘किवाड़’ उस ठोस वस्तु के लिए संक्षिप्त और स्वाभाविक शब्द है।
- source_word: וַיּוֹרֶד רִירוֹ אֶל־זְקָנוֹ
  choice: अपनी लार अपनी दाढ़ी पर बहने दी
  rationale: कारणवाचक अभिव्यक्ति को स्वाभाविक हिन्दी में प्रस्तुत किया गया है और नीचे दाढ़ी तक बहने का दृश्य सुरक्षित रखा गया है।
theological_decisions:
- issue: दाऊद के उन्मत्त व्यवहार का जानबूझकर अभिनय होना
  choice: मुख्य पाठ में ‘पागल जैसा व्यवहार किया’
  alternative: ‘पागलपन का ढोंग किया’
  rationale: आसपास का प्रसंग इसे सोची-समझी युक्ति बताता है, पर क्रिया स्वयं मुख्यतः उन्मत्त ढंग से व्यवहार करने का वर्णन करती है। चुना गया अनुवाद क्रिया का अर्थ और प्रसंगगत अभिनय—दोनों को रखता है, बिना ‘ढोंग’ को मूल क्रिया में अनिवार्य रूप से जोड़ने के।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘उनकी पकड़ में’ और ‘लार ... बहने दी’ सामान्य पाठक के लिए सहज हैं; कठिन इब्रानी क्रिया की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
