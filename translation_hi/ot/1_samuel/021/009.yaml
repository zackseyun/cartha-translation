base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/009.yaml
  text: And David said to Ahimelech[a], “Is there not here under your hand a spear or a sword? For I did not take my sword or my weapons in my hand[c][b], because the king’s matter was urgent.”
translation:
  language: hi
  text: दाऊद ने अहीमेलेक से कहा, “क्या यहाँ आपके पास[a] कोई भाला या तलवार नहीं है? क्योंकि मैं अपनी तलवार और अपना साज-सामान[b] साथ नहीं लाया; राजा का मामला[c] अत्यावश्यक था।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “आपके हाथ के नीचे”; इसका अर्थ “आपके अधिकार में” या “आपके पास” हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने हथियार” अथवा “अपने उपकरण”; इब्रानी शब्द सामान और उपकरणों के लिए व्यापक रूप से प्रयुक्त हो सकता है, और यहाँ संभवतः हथियार अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: या “राजा की बात,” “राजा का काम” अथवा “राजा की आज्ञा”; इब्रानी शब्द का अर्थ इनमें से कोई भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד לַאֲחִימֶלֶךְ
  choice: दाऊद ने अहीमेलेक से कहा
  rationale: इब्रानी कथात्मक शैली को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है; व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: וְאִין יֶשׁ פֹּה
  choice: क्या यहाँ ... नहीं है?
  rationale: दोहरी अस्तित्ववाचक अभिव्यक्ति को हिन्दी के स्वाभाविक नकारात्मक प्रश्न के रूप में दिया गया है।
- source_word: תַחַת יָדְךָ
  choice: आपके पास
  rationale: शाब्दिक अर्थ ‘आपके हाथ के नीचे’ है, पर इसका मुहावरेदार आशय किसी के अधिकार या उपलब्धता में होना है; ‘आपके पास’ हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: חֲנִית אוֹ חָרֶב
  choice: कोई भाला या तलवार
  rationale: दोनों एकवचन हथियारों का सीधा और स्वाभाविक अनुवाद।
- source_word: גַם חַרְבִּי וְגַם כֵּלַי
  choice: अपनी तलवार और अपना साज-सामान
  rationale: כְּלִי व्यापक शब्द है, जिसका अर्थ वस्तु, उपकरण, सामान या हथियार हो सकता है। ‘साज-सामान’ इस व्यापकता को बनाए रखता है, जबकि प्रसंग सैन्य सामग्री की ओर संकेत करता है।
- source_word: לֹא לָקַחְתִּי בְיָדִי
  choice: साथ नहीं लाया
  rationale: शाब्दिक ‘अपने हाथ में नहीं लिया’ का स्वाभाविक हिन्दी अर्थ यहाँ ‘साथ नहीं लाया’ है।
- source_word: דְבַר הַמֶּלֶךְ
  choice: राजा का काम
  rationale: דָּבָר का अर्थ ‘बात, वचन, मामला, काम’ हो सकता है। प्रसंग में ‘काम’ सहज है, पर अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: נָחוּץ
  choice: बहुत ज़रूरी
  rationale: यह शब्द किसी अत्यावश्यक या शीघ्र किए जाने वाले विषय को दर्शाता है; यह चयन साधारण आधुनिक हिन्दी में स्पष्ट है।
