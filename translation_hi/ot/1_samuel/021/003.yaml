base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/003.yaml
  text: David said to Ahimelech the priest[a], “The king has charged me with a matter and said to me[b], ‘Let no man know anything about the matter for which I am sending you and with which I have charged you.’ And I have directed the young men to a certain place.”
translation:
  language: hi
  text: दाऊद ने याजक अहीमेलेक से कहा, “राजा ने मुझे एक काम सौंपा है और मुझसे कहा है, ‘जिस काम के लिए मैं तुझे भेज रहा हूँ और जिसके विषय में मैंने तुझे आज्ञा दी है, उसके बारे में कोई व्यक्ति[a] कुछ भी न जाने।’ और मैंने युवकों को अमुक स्थान पर जाने का निर्देश दिया है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “कोई पुरुष कुछ भी न जाने।” यहाँ निषेधात्मक प्रयोग में इसका अर्थ “कोई व्यक्ति कुछ भी न जाने” है।
    reason: lexical_alternative
  - marker: b
    text: “अमुक स्थान” के लिए इब्रानी में एक मुहावरा है जिसका अर्थ कोई अनिर्दिष्ट या प्रकट न किया गया स्थान है। “निर्देश दिया है” का अधिक शाब्दिक अर्थ “ज्ञात करा दिया है” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צִוַּנִי דָבָר
  choice: मुझे एक काम की आज्ञा देकर
  rationale: צוה का अर्थ ‘आज्ञा देना/दायित्व सौंपना’ और דָבָר का अर्थ यहाँ मिशन या काम है। यह रूप राजकीय आदेश का बल बनाए रखता है और हिंदी में स्वाभाविक है।
- source_word: אִישׁ אַל יֵדַע מְאוּמָה
  choice: कोई व्यक्ति कुछ भी न जाने
  rationale: אִישׁ का शाब्दिक अर्थ ‘पुरुष’ है, पर निषेधात्मक वाक्य में इसका आशय सामान्यतः ‘कोई व्यक्ति’ है। आधुनिक हिंदी में यह अर्थ स्पष्ट और स्वाभाविक है।
- source_word: הַדָּבָר
  choice: काम
  rationale: דָבָר यहाँ केवल ‘बात’ नहीं, बल्कि राजा द्वारा सौंपे गए कार्य या मामले को दर्शाता है। ‘काम’ इस संदर्भ में सहज है।
- source_word: אֲשֶׁר אָנֹכִי שֹׁלֵחֲךָ
  choice: जिस काम से मैं तुझे भेज रहा हूँ
  rationale: यह संबंधवाचक उपवाक्य उस काम को स्पष्ट करता है जिसके लिए दाऊद को भेजा गया था; हिंदी में ‘जिस काम से’ स्रोत का संबंध बनाए रखता है।
- source_word: וַאֲשֶׁר צִוִּיתִךָ
  choice: और जिसकी आज्ञा मैंने तुझे दी है
  rationale: दोहराए गए צוה को ‘आज्ञा’ से व्यक्त किया गया है, जिससे राजकीय निर्देश की पुनरुक्ति बनी रहती है।
- source_word: וְאֶת־הַנְּעָרִים
  choice: और मैंने जवानों को
  rationale: נְעָרִים युवकों, सेवकों या साथियों को सूचित कर सकता है। ‘जवानों’ से मूल का सीधा अर्थ रहता है और उनकी सामाजिक भूमिका अनावश्यक रूप से निश्चित नहीं होती।
- source_word: יוֹדַעְתִּי
  choice: निर्देश दिया है
  rationale: ידע के हिफ़ील रूप का मूल भाव ‘ज्ञात कराना’ है, पर स्थान के साथ इस रचना में किसी निर्धारित जगह की ओर निर्देशित करना अभिप्रेत प्रतीत होता है। ‘निर्देश दिया है’ व्यावहारिक अर्थ देता है, जबकि पदटिप्पणी संभावित अधिक शाब्दिक अर्थ बताती है।
- source_word: אֶל־מְקוֹם פְּלֹנִי אַלְמוֹנִי
  choice: अमुक स्थान पर
  rationale: פְּלֹנִי אַלְמוֹנִי किसी अनिर्दिष्ट या जानबूझकर न बताए गए स्थान के लिए मुहावरा है। ‘अमुक स्थान’ आधुनिक हिंदी में इसी अस्पष्टता को स्वाभाविक रूप से बनाए रखता है।
