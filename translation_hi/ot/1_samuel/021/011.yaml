translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आरंभिक ‘तब’ इब्रानी कथात्मक וַ־ शृंखला को हिन्दी में स्वाभाविक रूप से आगे बढ़ाता है। किसी पादटिप्पणी की आवश्यकता नहीं है।
