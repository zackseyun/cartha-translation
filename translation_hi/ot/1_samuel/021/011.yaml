translation:
  language: hi
  text: तब दाऊद उठा और उस दिन शाऊल से भागकर गत के राजा आकीश के पास गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का मूल अर्थ ‘उठना’ है। ‘उठा’ इब्रानी कथात्मक क्रम को बनाए रखते हुए स्वाभाविक हिन्दी है।
- source_word: וַיִּבְרַח
  choice: भागकर
  rationale: ברח का सीधा अर्थ ‘भागना’ या ‘पलायन करना’ है। यहाँ ‘भागकर’ दाऊद की तात्कालिक कार्रवाई और अगले क्रियापद से उसका संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह मानक कालवाचक पदबंध है; ‘उस दिन’ इसकी समय-संबंधी विशिष्टता को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: מִפְּנֵי שָׁאוּל
  choice: शाऊल से
  rationale: शाब्दिक रूप से ‘शाऊल के सामने/उपस्थिति से’; प्रसंग में आशय शाऊल से बचकर भागने का है। ‘शाऊल से’ संक्षिप्त और अर्थनिष्ठ है।
- source_word: וַיָּבֹא אֶל
  choice: के पास गया
  rationale: בוא के साथ אֶל किसी व्यक्ति के पास जाने या आने को व्यक्त करता है। हिन्दी कथन-दृष्टि में ‘के पास गया’ अधिक स्वाभाविक है और गंतव्य को स्पष्ट करता है।
- source_word: אָכִישׁ
  choice: आकीश
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय लिप्यंतरण के अनुरूप रखा गया है।
- source_word: מֶלֶךְ גַּת
  choice: गत के राजा
  rationale: इब्रानी संबंधवाचक संरचना का स्वाभाविक हिन्दी रूप ‘गत के राजा’ है; इसे आकीश की पदवी के रूप में रखा गया है।
