lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथात्मक रूप को स्वाभाविक हिन्दी कथा-प्रवाह में व्यक्त करता है; ‘तब’ प्रसंग को जोड़े रखता है, पर कारणात्मक संबंध नहीं जोड़ता।
- source_word: אָכִישׁ
  choice: आकीश
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: राजदरबार के संदर्भ में राजा की सेवा में रहने वाले व्यक्तियों के लिए सीधा और सहज पद।
- source_word: הִנֵּה תִרְאוּ
  choice: देखो, तुम देख रहे हो
  rationale: הִנֵּה का ध्यान आकर्षित करने वाला बल और बहुवचन תִרְאוּ, दोनों स्पष्ट रूप से सुरक्षित हैं।
- source_word: אִישׁ
  choice: यह आदमी
  rationale: मूल के ‘आदमी’ को बनाए रखता है; हिन्दी वाक्य में संकेतात्मक ‘यह’ सामने उपस्थित व्यक्ति को स्वाभाविक रूप से दर्शाता है।
- source_word: מִשְׁתַּגֵּעַ
  choice: पागल जैसा व्यवहार कर रहा है
  rationale: हित्पएल कृदंत के चल रहे व्यवहारगत अर्थ को व्यक्त करता है और वास्तविक पागलपन तथा पागलपन का अभिनय—दोनों संभावनाओं को खुला रखता है।
- source_word: לָמָּה תָּבִיאוּ אֹתוֹ אֵלָי
  choice: तुम इसे मेरे पास क्यों लाते हो?
  rationale: प्रश्नवाचक और अपूर्ण रूप को सीधे, वर्तमानकालीन हिन्दी में रखा गया है; यह तत्काल परिस्थिति में सेवकों के कार्य पर आपत्ति व्यक्त करता है।
