lexical_decisions:
- source_word: וַיָּקָם
  choice: तब वह उठकर
  rationale: קום के कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘तब’ घटनाक्रम की अगली कड़ी दिखाता है।
- source_word: וַיֵּלַךְ
  choice: चला गया
  rationale: הלך का सामान्य अर्थ ‘जाना/चलना’ है; प्रसंग में विदा होकर जाने का भाव ‘चला गया’ से स्वाभाविक रूप से व्यक्त होता है।
- source_word: וִיהוֹנָתָן
  choice: और योनातान
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखा गया है।
- source_word: בָּא
  choice: आया
  rationale: בוא का मूल दिशासूचक अर्थ ‘आना’ सुरक्षित रखा गया है; इसे ‘गया’ या केवल ‘प्रवेश किया’ करके स्रोत की दृष्टि को चुपचाप नहीं बदला गया।
- source_word: הָעִיר
  choice: नगर में
  rationale: निर्दिष्ट עיר के लिए ‘नगर’ गरिमापूर्ण और सहज हिन्दी है; בוא के साथ हिन्दी में गंतव्य को ‘में’ से व्यक्त करना स्वाभाविक है।
