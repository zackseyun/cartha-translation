  choice: तुम्हारे पास क्या उपलब्ध है?
  rationale: शाब्दिक ‘तुम्हारे हाथ के नीचे क्या है?’ उपलब्धता या अधिकार में होने का इब्रानी मुहावरा है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक है।
- source_word: חֲמִשָּׁה לֶחֶם
  choice: पाँच रोटियाँ
  rationale: לֶחֶם यहाँ गिनी जाने वाली रोटियों के लिए सामूहिक रूप में आया है; हिन्दी में ‘पाँच रोटियाँ’ ठोस और स्वाभाविक अभिव्यक्ति है।
- source_word: תְּנָה בְיָדִי
  choice: मेरे हाथ में दे दो
  rationale: यह रूप मूल के ‘मेरे हाथ में दे’ को बनाए रखता है और हिन्दी में भी सहज है।
- source_word: אוֹ הַנִּמְצָא
  choice: या जो कुछ मिल सके
  rationale: מצא का निष्क्रिय कृदन्त उस वस्तु को दर्शाता है जो मिलती या उपलब्ध होती है; यह अनिश्चितता मूल के अनुरूप रखता है।
