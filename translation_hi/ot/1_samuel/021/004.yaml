- source_word: וְעַתָּה
  choice: तो अब
  rationale: यह पद पिछले संवाद से तत्काल व्यावहारिक अनुरोध की ओर संक्रमण करता है; ‘तो अब’ समय और संवाद-संबंध दोनों व्यक्त करता है।
