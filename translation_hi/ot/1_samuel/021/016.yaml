  text: חֲסַ֤ר מְשֻׁגָּעִים֙ אָ֔נִי כִּי הֲבֵאתֶ֣ם אֶת זֶ֔ה לְ/הִשְׁתַּגֵּ֖עַ עָלָ֑/י הֲ/זֶ֖ה יָב֥וֹא אֶל בֵּיתִֽ/י־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/016.yaml
  text: Do I lack madmen[a], that you have brought this one to act like a madman before me? Shall this one come into my house?
translation:
  language: hi
  text: क्या मेरे यहाँ पागलों की कमी है कि तुम इस आदमी को मेरे सामने पागलों जैसा व्यवहार करने के लिए ले आए हो?[a] क्या यह आदमी मेरे घर में आएगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरी उपस्थिति में पागलों जैसा व्यवहार करने के लिए।” इब्रानी क्रिया सामान्य रूप से पागलपन का व्यवहार करने के अर्थ में भी ली जा सकती है; प्रसंग संकेत देता है कि दाऊद जानबूझकर पागलपन का अभिनय कर रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲסַר מְשֻׁגָּעִים אֲנִי
  choice: क्या मेरे यहाँ पागलों की कमी है
  rationale: विधेय विशेषण और बहुवचन संज्ञा से बने तीखे आलंकारिक प्रश्न को स्वाभाविक आधुनिक हिन्दी में रखता है और आकीश का व्यंग्य बनाए रखता है।
- source_word: הֲבֵאתֶם אֶת־זֶה
  choice: तुम इस आदमी को ... ले आए हो
  rationale: बहुवचन संबोधन ‘तुम’ और पूर्ण हो चुकी क्रिया को स्पष्ट रखता है। केवल ‘इसे’ की अपेक्षा ‘इस आदमी को’ हिन्दी में सहज है, फिर भी संकेतवाचक की तिरस्कारपूर्ण दूरी बनी रहती है।
- source_word: לְהִשְׁתַּגֵּעַ
  choice: पागलों जैसा व्यवहार करने के लिए
  rationale: हित्पाएल रूप यहाँ पागलपन का व्यवहार करने को व्यक्त करता है; यह अनुवाद संदर्भ में अभिनय की संभावना को दर्शाता है, पर उसे मूल क्रिया से अधिक निश्चित नहीं बनाता।
- source_word: עָלָי
  choice: मेरे सामने
  rationale: शाब्दिक ‘मुझ पर’ के बजाय इस प्रसंग में राजा की उपस्थिति में उसके सामने किए गए व्यवहार का स्वाभाविक हिन्दी रूप है।
- source_word: הֲזֶה יָבוֹא אֶל־בֵּיתִי
  choice: क्या यह आदमी मेरे घर में आएगा?
  rationale: दोहराए गए संकेतवाचक और आलंकारिक प्रश्न को सुरक्षित रखता है; ‘घर में’ प्रवेश या राजकीय गृह-परिसर में स्वीकार किए जाने का भाव देता है।
