lexical_decisions:
- source_word: וַיָּשֶׂם ... בִּלְבָבוֹ
  choice: मन में बिठा लिया
  rationale: यह स्वाभाविक हिन्दी मुहावरा इब्रानी के शाब्दिक चित्र ‘अपने हृदय में रखा’ को बनाए रखते हुए बात को गंभीरता से ग्रहण करने और भीतर विचार करने का भाव व्यक्त करता है।
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: इन बातों को
  rationale: דְּבָרִים का अर्थ ‘शब्द’, ‘बातें’ या ‘मामले’ हो सकता है। यहाँ पिछले पद में कही गई बातों का संदर्भ है; हिन्दी में ‘इन बातों’ से कथन और उसका आशय दोनों स्वाभाविक रूप से समाहित होते हैं।
- source_word: וַיִּרָא מְאֹד
  choice: बहुत डर गया
  rationale: यह आधुनिक हिन्दी में भय की तीव्रता को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: מִפְּנֵי
  choice: से
  rationale: भय के साथ हिन्दी में ‘से डरना’ स्वाभाविक प्रयोग है और इब्रानी संबंध का अर्थ ठीक से देता है।
- source_word: אָכִישׁ
  choice: आकीश
  rationale: व्यक्तिनाम का देवनागरी में स्रोत-निकट लिप्यंतरण किया गया है।
- source_word: מֶלֶךְ גַּת
  choice: गत के राजा
  rationale: इब्रानी संबंध-रचना को स्वाभाविक हिन्दी में स्थान के राजा के रूप में व्यक्त किया गया है।
