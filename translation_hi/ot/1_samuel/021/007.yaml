  text: וַ/יִּתֶּן ל֥/וֹ הַ/כֹּהֵ֖ן קֹ֑דֶשׁ כִּי֩ לֹא הָ֨יָה שָׁ֜ם לֶ֗חֶם כִּֽי אִם לֶ֤חֶם הַ/פָּנִים֙ הַ/מּֽוּסָרִים֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה לָ/שׂוּם֙ לֶ֣חֶם חֹ֔ם בְּ/י֖וֹם הִלָּקְחֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/007.yaml
  text: So the priest gave him holy bread[a], for there was no bread there except the bread of the Presence, which had been removed from before Yahweh, to put hot bread there on the day it was taken away.
translation:
  language: hi
  text: तब याजक ने उसे पवित्र रोटी दी, क्योंकि वहाँ उपस्थिति की रोटियों[a] के सिवा कोई रोटी नहीं थी। वे याहवे के सामने से हटा ली गई थीं, ताकि उनके हटाए जाने के दिन वहाँ गरम रोटियाँ रखी जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उपस्थिति की रोटी”; पारंपरिक रूप से, “दर्शनीय रोटी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קֹדֶשׁ
  choice: पवित्र रोटी
  rationale: शब्द का मूल अर्थ ‘पवित्र वस्तु’ है, पर प्रसंग में वह विशेष रूप से समर्पित रोटी को सूचित करता है; इसलिए संदर्भ को स्पष्ट करते हुए ‘पवित्र रोटी’ स्वाभाविक है।
- source_word: לֶחֶם הַפָּנִים
  choice: याहवे के सम्मुख रखी जाने वाली रोटियाँ
  rationale: इब्रानी पद का शाब्दिक अर्थ ‘उपस्थिति/मुख की रोटी’ है और यह याहवे के सामने रखी जाने वाली पवित्र रोटियों का पारिभाषिक नाम है। मुख्य पाठ में कार्य को स्पष्ट करने वाला रूप आधुनिक पाठक के लिए सहज है; शाब्दिक और पारंपरिक विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: הַמּוּסָרִים
  choice: हटा ली गई थीं
  rationale: पुल्लिंग बहुवचन निष्क्रिय कृदंत अलग-अलग रोटियों के हटाए जाने को दर्शाता है; हिन्दी में बहुवचन वाक्य इस व्याकरणिक संकेत को बनाए रखता है।
- source_word: מִלִּפְנֵי יְהוָה
  choice: याहवे के सामने से
  rationale: यह स्थानसूचक और उपासना-संबंधी मुहावरे ‘याहवे के सम्मुख से’ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: לֶחֶם חֹם
  choice: गरम रोटियाँ
  rationale: חֹם का प्रत्यक्ष अर्थ ‘गरम’ है। ‘ताज़ी’ सम्भावित आशय है, पर मूल शब्द की ठोस छवि बनाए रखने के लिए ‘गरम’ चुना गया है।
- source_word: בְּיוֹם הִלָּקְחוֹ
  choice: जिस दिन वे हटाई जाएँ, उसी दिन
  rationale: यह रूप हटाने और नई रोटियाँ रखने के एक ही दिन होने का काल-संबंध स्पष्ट करता है और इब्रानी के निष्क्रिय भाव को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है; ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: לֶחֶם הַפָּנִים की उपासना-संबंधी संज्ञा
  choice: याहवे के सम्मुख रखी जाने वाली रोटियाँ
  alternative: उपस्थिति की रोटी / दर्शनीय रोटी / भेंट की रोटी
  rationale: चयन रोटियों के याहवे के सामने रखे होने का मूल संबंध स्पष्ट करता है, पर किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ता; पारंपरिक और शाब्दिक रूप पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘रोटी’ पहले सामूहिक एकवचन और फिर वास्तविक रोटियों के लिए बहुवचन में आती है, जो इब्रानी पाठ के एकवचन संज्ञा तथा बहुवचन कृदंत के तनाव को हिन्दी में यथासंभव दर्शाता है।
