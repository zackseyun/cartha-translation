  text: And the priest said[a], “The sword of Goliath the Philistine, whom you struck down in the Valley of Elah—behold, it is wrapped in a cloth behind the ephod. If you will take that for yourself, take it, for there is no other here except it.” And David said, “There is none like it; give it to me.”
translation:
  language: hi
  text: याजक ने कहा, “पलिश्ती गोलियत की तलवार, जिसे तुमने एला की घाटी में मार गिराया था—देखो, वह एपोद के पीछे एक वस्त्र[a] में लिपटी हुई है। यदि तुम उसे अपने लिए लेना चाहते हो, तो ले लो, क्योंकि यहाँ उसके सिवा दूसरी कोई तलवार नहीं है।” दाऊद ने कहा, “उसके समान कोई तलवार नहीं; वह मुझे दे दीजिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस इब्रानी शब्द का अर्थ “बाहरी वस्त्र” या “चोगा” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: पलिश्ती गोलियत की तलवार
  rationale: सम्बन्धवाचक रचना और गोलियत की जातीय पहचान दोनों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִכִּיתָ
  choice: मार गिराया था
  rationale: युद्ध के प्रसंग में נכה के प्रहार करके परास्त या वध करने के भाव को व्यक्त करता है, पर केवल सामान्य ‘मार डाला’ की अपेक्षा मूल क्रिया की व्यापकता भी बनाए रखता है।
- source_word: בְּעֵמֶק הָאֵלָה
  choice: एला की घाटी में
  rationale: स्थान-नाम को लिप्यंतरित करते हुए עֵמֶק का आधुनिक और सहज हिन्दी रूप दिया गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: वस्तु की ओर ध्यान खींचने वाले इस निपात का स्वाभाविक आधुनिक हिन्दी संवादात्मक रूप है।
- source_word: לוּטָה בַשִּׂמְלָה
  choice: एक वस्त्र में लिपटी हुई
  rationale: לוּטָה का निष्क्रिय भाव और שׂמלה का वस्त्र/ओढ़ने के बाहरी कपड़े का अर्थ सुरक्षित रहता है।
- source_word: אַחֲרֵי הָאֵפוֹד
  choice: एपोद के पीछे
  rationale: यहाँ אַחֲרֵי स्थानवाचक है; ‘पीछे’ हिन्दी में स्पष्ट और सहज है।
- source_word: אִם אֹתָהּ תִּקַּח לְךָ קָח
  choice: यदि तुम उसे अपने लिए लेना चाहते हो, तो ले लो
  rationale: शर्त और अनुमति के भाव को शब्दशः कठोरता के बिना स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כִּי אֵין אַחֶרֶת זוּלָתָהּ בָּזֶה
  choice: क्योंकि यहाँ उसके सिवा दूसरी कोई तलवार नहीं है
  rationale: स्त्रीलिंग संकेत का आशय स्पष्ट करने के लिए ‘तलवार’ दोहराया गया है और בָּזֶה का प्रसंगानुसार स्थानवाचक अर्थ ‘यहाँ’ रखा गया है।
- source_word: אֵין כָּמוֹהָ
  choice: उसके समान कोई तलवार नहीं
  rationale: तलवार की अद्वितीयता या श्रेष्ठता का कथन सुरक्षित रखता है और स्त्रीलिंग संदर्भ स्पष्ट करता है।
- source_word: תְּנֶנָּה לִּי
  choice: वह मुझे दे दीजिए
  rationale: आज्ञार्थक अर्थ को रखते हुए याजक से दाऊद की बातचीत के लिए स्वाभाविक सम्मानसूचक हिन्दी अपनाई गई है।
