base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/002.yaml
  text: David came to Nob, to Ahimelech the priest. Ahimelech trembled when he met David and said to him, “Why are you alone, and no man is with you?”
translation:
  language: hi
  text: दाऊद नोब में अहीमेलेक याजक के पास आया। अहीमेलेक दाऊद से मिलने पर काँप उठा और उससे पूछा, “तुम अकेले क्यों हो? तुम्हारे साथ कोई आदमी क्यों नहीं है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֶּחֱרַד
  choice: काँप उठा
  rationale: यह क्रिया भय, घबराहट या तीव्र आशंका से काँपने का भाव व्यक्त करती है; ‘काँप उठा’ मूल की तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לִקְרַאת דָּוִד
  choice: दाऊद से मिलने पर
  rationale: लִקְרַאת का अर्थ किसी से मिलने/उसकी अगवानी के लिए सामने जाना है; प्रसंग में ‘मिलने पर’ सहज है और अनावश्यक औपचारिकता नहीं जोड़ता।
- source_word: וְאִישׁ אֵין אִתָּךְ
  choice: तुम्हारे साथ कोई आदमी क्यों नहीं है?
  rationale: אִישׁ का ठोस अर्थ ‘आदमी’ है। प्रश्नवाचक ‘क्यों’ पिछले מַדּוּעַ से दोनों समन्वित खंडों पर लागू होता है।
