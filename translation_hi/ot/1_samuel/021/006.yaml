base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/006.yaml
  text: David answered the priest and said to him[a], “Indeed, women have been kept from us as before, when I went out, and the young men’s vessels are holy, though it is an ordinary journey[d][c][b]. How much more today will it be made holy in the vessel.”
translation:
  language: hi
  text: दाऊद ने याजक को उत्तर दिया, “निश्चय ही, जब मैं निकला था, तब भी पिछली बारों की तरह स्त्रियाँ हमसे दूर रखी गई थीं[a]। जवानों के पात्र[c] पवित्र हैं, यद्यपि यह यात्रा साधारण है[b][d]। फिर आज तो वह पात्र में पवित्र किया जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक स्त्री हमसे दूर रखी गई है,” अथवा “हम स्त्रियों से दूर रहे हैं।” इब्रानी अभिव्यक्ति पवित्र वस्तुओं को सँभालने की तैयारी में यौन-संयम की ओर संकेत करती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “कल और परसों के समान।” यह इब्रानी मुहावरा बीते दिनों की ओर संकेत करता है; कुछ इसे अधिक निश्चित रूप से “लगभग तीन दिनों से” समझते हैं।
    reason: lexical_alternative
  - marker: c
    text: “पात्र” से जवानों का सामान या उपकरण अभिप्रेत हो सकता है; कुछ इसे उनके शरीरों या स्वयं उन व्यक्तियों के लिए व्यंजना मानते हैं।
    reason: lexical_alternative
  - marker: d
    text: 'अंतिम उपवाक्य का इब्रानी पाठ कठिन है। इसका अर्थ इस प्रकार भी समझा जा सकता है: “यद्यपि यात्रा साधारण है, फिर भी आज वह पात्र/सामान के संबंध में पवित्र होगा,” या इससे मिलता-जुलता अर्थ।'
    reason: alternative_reading
lexical_decisions:
- source_word: אִשָּׁה עֲצֻרָה לָנוּ
  choice: स्त्रियाँ हमसे दूर रखी गई हैं
  rationale: यह यौन-संयम द्वारा अनुष्ठानिक तैयारी को सूचित करता है। इब्रानी में संज्ञा एकवचन होते हुए भी जातिवाचक हो सकती है; हिन्दी में बहुवचन संदर्भ को स्वाभाविक बनाता है और कर्मवाच्य मूल रचना को बनाए रखता है।
- source_word: כִּתְמוֹל שִׁלְשֹׁם
  choice: पहले की तरह
  rationale: शाब्दिक मुहावरा बीते दिनों की ओर संकेत करता है, पर उसकी ठीक अवधि अनिश्चित है। यह चयन समयगत भाव रखता है और लगभग तीन दिन का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בְּצֵאתִי
  choice: जब से मैं निकला हूँ
  rationale: पूर्वसर्ग सहित क्रियारूप प्रस्थान के समय को दर्शाता है। हिन्दी वाक्य में यह जारी संयम की अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְלֵי הַנְּעָרִים
  choice: जवानों के पात्र
  rationale: כְּלִי का अर्थ पात्र, सामान या उपकरण हो सकता है और यहाँ शरीर/व्यक्ति के लिए व्यंजना भी संभव है। ‘पात्र’ मूल की अस्पष्टता और आगे בַּכֶּלִי से शब्दगत संबंध बनाए रखता है।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: शब्द सामान्य या अपवित्र के विपरीत संस्कारित स्थिति बताता है; ‘शुद्ध’ इसे केवल अनुष्ठानिक स्वच्छता तक सीमित कर देता।
- source_word: וְהוּא דֶּרֶךְ חֹל
  choice: यद्यपि यह यात्रा साधारण है
  rationale: חֹל यहाँ नैतिक बुराई नहीं, पवित्र के विपरीत सामान्य स्थिति दर्शाता है; דֶּרֶךְ को प्रसंगानुसार ‘यात्रा’ कहा गया है।
- source_word: וְאַף כִּי
  choice: फिर ... तो ... और भी
  rationale: यह संक्षिप्त और विवादित वाक्यांश तर्क को बल देता है; हिन्दी संरचना ‘how much more’ की तीव्रता व्यक्त करती है।
- source_word: הַיּוֹם יִקְדַּשׁ
  choice: आज ... और भी पवित्र ठहरेगा
  rationale: अपूर्ण क्रिया का निष्क्रिय/प्रतिबिंबित भाव रखते हुए हिन्दी में स्वाभाविक वाक्य बनाया गया है; इसे केवल स्थिर विशेषण नहीं बनाया गया।
- source_word: בַּכֶּלִי
  choice: पात्र में
  rationale: यह अत्यंत कठिन पदबंध है। ‘पात्र’ पहले आए כְלֵי से शब्दगत निरंतरता रखता और सामान, शरीर अथवा किसी संस्कार-संबंधी वस्तु में से किसी एक अर्थ को निर्णायक नहीं बनाता।
theological_decisions:
- issue: पवित्र रोटी के संदर्भ में संयम और अनुष्ठानिक पवित्रता
  choice: पद को अनुष्ठानिक पवित्रता की भाषा में रखा गया है, बाद की धर्मसैद्धांतिक श्रेणियाँ जोड़े बिना।
  alternative: इसे मुख्यतः नैतिक शुद्धता या केवल व्यावहारिक स्वच्छता के रूप में समझना।
  rationale: संदर्भ पवित्र रोटी ग्रहण करने की पात्रता का है। इब्रानी पवित्र और साधारण स्थिति का विरोध करता है और संभवतः यौन-संयम द्वारा अनुष्ठानिक तैयारी की ओर संकेत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। ‘याजक’, ‘पवित्र’ और ‘साधारण’ से उपासना-संबंधी विरोध स्पष्ट रहता है। मूल इब्रानी की कठिनता को मुख्य पाठ में अत्यधिक अस्वाभाविक बनाए बिना पादटिप्पणियों में संरक्षित किया गया है।
