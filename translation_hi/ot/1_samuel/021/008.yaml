  text: וְ/שָׁ֡ם אִישׁ֩ מֵ/עַבְדֵ֨י שָׁא֜וּל בַּ/יּ֣וֹם הַ/ה֗וּא נֶעְצָר֙ לִ/פְנֵ֣י יְהוָ֔ה וּ/שְׁמ֖/וֹ דֹּאֵ֣ג הָ/אֲדֹמִ֑י אַבִּ֥יר הָ/רֹעִ֖ים אֲשֶׁ֥ר לְ/שָׁאֽוּל׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/021/008.yaml
  text: A man of Saul’s servants was there that day[a], detained before Yahweh; his name was Doeg the Edomite, the chief of Saul’s shepherds.
translation:
  language: hi
  text: शाऊल के सेवकों में से एक आदमी उस दिन वहाँ था[a], जिसे याहवे के सामने रोका गया था। उसका नाम एदोमी दोएग था; वह शाऊल के चरवाहों का प्रधान था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के सामने ठहराया गया था” अथवा “याहवे के सामने रोक लिया गया था।” इब्रानी पाठ यह नहीं बताता कि दोएग को क्यों रोका गया था।
    reason: नֶעְצָר לִפְנֵי יְהוָה के ‘रोके/ठहराए जाने’ के अर्थ और उसके अनिर्दिष्ट कारण को बनाए रखता है।
lexical_decisions:
- source_word: וְשָׁם אִישׁ מֵעַבְדֵי שָׁאוּל
  choice: शाऊल के सेवकों में से एक पुरुष वहाँ था
  rationale: מִן का अंशवाची भाव ‘में से’ द्वारा व्यक्त किया गया है। אִישׁ के लिए ‘पुरुष’ मूल के पुरुषवाचक संकेत को बनाए रखता है, और שָׁם का सीधा अर्थ ‘वहाँ’ है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह प्रचलित और स्वाभाविक हिन्दी काल-सूचक अभिव्यक्ति है।
- source_word: נֶעְצָר לִפְנֵי יְהוָה
  choice: जिसे यहोवा के सामने रोक रखा गया था
  rationale: निफ़अल रूप किसी के रोके या ठहराए जाने को सूचित करता है। यह अनुवाद कारण बताए बिना मूल की अनिश्चितता बनाए रखता है।
- source_word: וּשְׁמוֹ דֹּאֵג הָאֲדֹמִי
  choice: उसका नाम एदोमी दोएग था
  rationale: नामकरण सूत्र को स्वाभाविक हिन्दी क्रम में रखा गया है और הָאֲדֹמִי को जातीय पहचान ‘एदोमी’ के रूप में व्यक्त किया गया है।
- source_word: אַבִּיר הָרֹעִים אֲשֶׁר לְשָׁאוּל
  choice: वह शाऊल के चरवाहों का प्रधान था
  rationale: इस प्रशासनिक प्रसंग में אַבִּיר शारीरिक बल की अपेक्षा प्रमुख पद या अधिकार का द्योतक जान पड़ता है; इसलिए ‘प्रधान’ उपयुक्त है। सम्बन्धवाचक खंड को स्वाभाविक रूप से ‘शाऊल के चरवाहों’ में समाहित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबल-पाठकों में प्रचलित व्यक्तिगत नाम ‘यहोवा’ शीर्षक ‘प्रभु’ से भिन्न होकर मूल में आए परमेश्वर के नाम को बनाए रखता है।
- issue: נֶעְצָר לִפְנֵי יְהוָה का आशय
  choice: यहोवा के सामने रोक रखा गया था
  alternative: यहोवा के सामने ठहराया गया था
  rationale: मूल पाठ यह नहीं बताता कि दोएग किस कारण या किस रीति से रोका गया था। चुना हुआ पाठ किसी विशेष धार्मिक अनुष्ठान या परिस्थिति को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। वाक्य को दो भागों में बाँटकर विवरण स्पष्ट किया गया है और मूल की अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
