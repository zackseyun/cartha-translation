  yaml_path: translation/ot/1_samuel/018/003.yaml
  text: Then Jonathan made a covenant with David[b][a], because he loved him as his own soul.
translation:
  language: hi
  text: तब योनातान ने दाऊद के साथ वाचा बाँधी[a], क्योंकि वह उससे अपने प्राण के समान प्रेम करता था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वाचा काटी।”
    reason: lexical_alternative
  - marker: b
    text: या, “उसके प्रति अपने प्रेम में”; इब्रानी सर्वनामों का रूप अपने आप में अस्पष्ट है, पर संदर्भ इस अर्थ का समर्थन करता है कि योनातान दाऊद से अपने प्राण के समान प्रेम करता था।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרֹת
  choice: बाँधी
  rationale: כרת ברית का शाब्दिक रूप ‘वाचा काटना’ है, पर आधुनिक स्वाभाविक हिन्दी में ‘वाचा बाँधना’ इस स्थापित मुहावरे का गंभीर और बंधनकारी अर्थ स्पष्ट रूप से व्यक्त करता है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण।
- source_word: וְדָוִד
  choice: दाऊद के साथ
  rationale: एकवचन क्रिया का कर्ता योनातान है; וְדָוִד वाचा के दूसरे सहभागी को बताता है, इसलिए हिन्दी में ‘दाऊद के साथ’ अर्थ और वाक्य-संबंध स्पष्ट करता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: यह शब्द औपचारिक और बाध्यकारी संबंध या प्रतिज्ञाबद्ध समझौते को दर्शाता है; ‘वाचा’ इसकी गंभीरता और संबंधपरक शक्ति को बनाए रखता है।
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: क्योंकि वह उससे ... प्रेम करता था
  rationale: यहाँ בְּ को संदर्भानुसार कारणसूचक समझा गया है। सर्वनामों का आशय संदर्भ से योनातान और दाऊद है, यद्यपि इब्रानी रूप अपने आप में औपचारिक रूप से अस्पष्ट हैं।
- source_word: כְּנַפְשׁוֹ
  choice: अपने प्राण के समान
  rationale: נֶפֶשׁ यहाँ व्यक्ति के अपने प्राण, जीवन या स्वयं को सूचित करता है। ‘अपने प्राण के समान’ इब्रानी बिंब को सुरक्षित रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
theological_decisions:
- issue: प्रेमवाचक उपवाक्य में तीसरे पुरुष के सर्वनामों का संदर्भ
  choice: योनातान दाऊद से अपने प्राण के समान प्रेम करता था
  alternative: दाऊद योनातान से अपने प्राण के समान प्रेम करता था; अथवा केवल रूप की दृष्टि से वाक्य को अस्पष्ट रखा जाए
  rationale: इब्रानी सर्वनाम अलग से देखने पर औपचारिक रूप से अस्पष्ट हैं, पर 18:1 और इसी पद में योनातान के कर्ता होने का निकट संदर्भ इस अर्थ का प्रबल समर्थन करता है। पादटिप्पणी वास्तविक व्याकरणिक अस्पष्टता को दर्ज करती है और संबंध के स्वरूप पर कोई अतिरिक्त धार्मिक दावा नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। ‘वाचा बाँधी’ हिन्दी के स्वाभाविक धार्मिक मुहावरे को अपनाता है, जबकि पादटिप्पणी इब्रानी के शाब्दिक मुहावरे को सुरक्षित रखती है।
