  yaml_path: translation/ot/1_samuel/018/021.yaml
  text: Then Saul said[a], “I will give her to him, so that she may become a snare to him and the hand of the Philistines may be against him.” So Saul said to David, “By the second one you may become my son-in-law today.”
translation:
  language: hi
  text: तब शाऊल ने कहा, “मैं उसे दाऊद को दे दूँगा, ताकि वह उसके लिए फंदा बन जाए और पलिश्तियों का हाथ उसके विरुद्ध हो।” फिर शाऊल ने दाऊद से कहा, “आज दूसरी के द्वारा[a] तुम मेरे दामाद बन सकते हो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आज दूसरी बार तुम मेरे दामाद बन सकते हो।” इब्रानी पदबंध लुप्तपदीय है और उसका संकेत या तो शाऊल की दूसरी बेटी की ओर हो सकता है या शाऊल के परिवार में विवाह करने के दूसरे अवसर की ओर।
    reason: alternative_reading
lexical_decisions:
- source_word: אֶתְּנֶנָּה לּוֹ
  choice: मैं उसे दाऊद को दे दूँगा
  rationale: विवाह के प्रसंग में अर्थ बेटी को विवाह में देने का है। सर्वनाम के संभावित भ्रम को दूर करने के लिए अप्रत्यक्ष कर्म को ‘दाऊद’ के रूप में स्पष्ट किया गया है।
- source_word: וּתְהִי לוֹ לְמוֹקֵשׁ
  choice: ताकि वह उसके लिए फंदा बन जाए
  rationale: לְמוֹקֵשׁ का रूपक ‘फंदा’ से सुरक्षित रहता है; प्रसंग शाऊल के उद्देश्य को दिखाता है, इसलिए क्रिया को प्रयोजनार्थक रूप में व्यक्त किया गया है।
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: और पलिश्तियों का हाथ उसके विरुद्ध उठे
  rationale: ‘हाथ’ की इब्रानी छवि बनाए रखते हुए ‘विरुद्ध उठे’ शत्रुतापूर्ण शक्ति या आक्रमण का स्वाभाविक हिन्दी अर्थ देता है।
- source_word: בִּשְׁתַּיִם
  choice: दूसरी के द्वारा
  rationale: यह कठिन और लुप्तपदीय पदबंध सम्भवतः शाऊल की दूसरी बेटी के माध्यम से विवाह-संबंध बनने की ओर संकेत करता है। वैकल्पिक अर्थ ‘दूसरी बार’ पादटिप्पणी में रखा गया है।
- source_word: תִּתְחַתֵּן בִּי
  choice: तुम मेरे दामाद बन सकते हो
  rationale: हित्पएल रूप किसी के साथ वैवाहिक संबंध में प्रवेश करने को दर्शाता है; यहाँ दाऊद का शाऊल का दामाद बनना प्रसंगानुकूल और स्वाभाविक हिन्दी है।
- source_word: הַיּוֹם
  choice: आज
  rationale: मूल शब्द का सामान्य कालवाचक अर्थ और कथन की तात्कालिकता दोनों सुरक्षित रहते हैं।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: तब शाऊल ने मन में कहा ... फिर शाऊल ने दाऊद से कहा
  rationale: दो अलग कथनों की संरचना रखी गई है। पहले कथन को आंतरिक योजना के रूप में स्पष्ट करना प्रसंग से समर्थित है, जबकि दूसरे में दाऊद स्पष्ट संबोधित व्यक्ति है।
theological_decisions:
- issue: בִּשְׁתַּיִם की अस्पष्टता
  choice: मुख्य पाठ में ‘दूसरी के द्वारा’, अर्थात दूसरी बेटी के माध्यम से
  alternative: ‘दूसरी बार’, अर्थात विवाह-संबंध का दूसरा अवसर
  rationale: निकटवर्ती प्रसंग मीकल को शाऊल की दूसरी बेटी के रूप में सामने लाता है, पर इब्रानी पदबंध लुप्तपदीय है और पुनः अवसर का अर्थ भी सम्भव है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘फंदा’ और ‘पलिश्तियों का हाथ’ जैसी मूल रूपकात्मक छवियाँ रखी गई हैं; कठिन अंतिम पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में दी गई है।
