base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/027.yaml
  text: So David arose and went[a], he and his men, and struck down two hundred Philistine men. Then David brought their foreskins, and they counted them out in full to the king, so that he might become the king’s son-in-law. And Saul gave him Michal his daughter as a wife.
translation:
  language: hi
  text: तब दाऊद उठा और वह अपने आदमियों के साथ गया। उसने दो सौ पलिश्ती पुरुषों को मार गिराया। फिर दाऊद उनके अग्रचर्म लाया, और उन्होंने उन्हें पूरी संख्या में राजा के सामने प्रस्तुत किया[a], ताकि वह राजा का दामाद बन सके। तब शाऊल ने अपनी बेटी मीकल उसे पत्नी के रूप में दे दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्होंने उन्हें राजा के लिए पूरी संख्या में गिन दिया।” हिब्रू क्रिया कठिन है; इसका अर्थ राजा के सामने उन्हें गिनकर प्रस्तुत करना, या अपेक्षित संख्या पूरी करके राजा के सामने प्रस्तुत करना, हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: कथात्मक हिब्रू में קום निर्णायक कार्य आरम्भ करने को दर्शाता है; ‘उठा’ इस मुहावरे और गति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיֵּלֶךְ הוּא וַאֲנָשָׁיו
  choice: अपने आदमियों के साथ गया
  rationale: स्पष्ट सर्वनाम הוּא और साथियों का उल्लेख सुरक्षित रखते हुए यह आधुनिक हिन्दी में स्वाभाविक वाक्य-विन्यास देता है।
- source_word: וַיַּךְ בַּפְּלִשְׁתִּים מָאתַיִם אִישׁ
  choice: दो सौ पलिश्ती पुरुषों को मार गिराया
  rationale: सैनिक प्रसंग में נכה का अर्थ घातक प्रहार करना है; अगला वाक्य मृत्यु की पुष्टि करता है। ‘पुरुषों’ से אִישׁ भी व्यक्त होता है।
- source_word: עָרְלֹתֵיהֶם
  choice: उनकी खलड़ियाँ
  rationale: यह शरीर-विज्ञान का सीधा हिन्दी शब्द है और मूल पाठ के स्पष्ट, कठोर आशय को शिष्टोक्ति से नहीं छिपाता।
- source_word: וַיְמַלְאוּם לַמֶּלֶךְ
  choice: राजा के सामने उनकी पूरी गिनती प्रस्तुत की गई
  rationale: क्रिया और प्रत्यय का विन्यास कठिन है। यह अनुवाद अपेक्षित संख्या पूरी होने तथा राजा के समक्ष प्रमाण प्रस्तुत किए जाने—दोनों प्रासंगिक भावों को समेटता है।
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: ताकि वह राजा का दामाद बन सके
  rationale: हित्पएल रूप विवाह द्वारा राजपरिवार से संबंध स्थापित करने को दर्शाता है; इस प्रसंग में ‘दामाद बनना’ सबसे सटीक और सहज है।
- source_word: וַיִּתֶּן לוֹ שָׁאוּל אֶת מִיכַל בִּתּוֹ לְאִשָּׁה
  choice: तब शाऊल ने अपनी बेटी मीकल उसे पत्नी के रूप में दे दी
  rationale: विवाह-संबंधी मूल अभिव्यक्ति को आधुनिक, गरिमापूर्ण हिन्दी में स्पष्ट रूप से रखा गया है।
