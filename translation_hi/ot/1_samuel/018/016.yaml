- source_word: אֹהֵב
  choice: प्रेम करते थे
  rationale: एकवचन कृदन्त संयुक्त सामूहिक कर्ता की निरन्तर या सामान्य अवस्था बताता है; हिन्दी में बहुवचन ‘करते थे’ स्वाभाविक है और उस स्थायी भाव को व्यक्त करता है।
- source_word: אֶת דָּוִד
  choice: दाऊद से
  rationale: हिब्रू के प्रत्यक्ष कर्म-चिह्न का अलग अनुवाद नहीं होता; हिन्दी में ‘प्रेम करना’ के साथ ‘से’ स्वाभाविक कारक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह लोगों के प्रेम का कारण प्रस्तुत करता है; ‘क्योंकि’ कारणात्मक बल को स्पष्ट रखता है।
- source_word: הוּא
  choice: वह
  rationale: स्वतंत्र सर्वनाम को स्पष्ट कर्ता के रूप में बनाए रखा गया है।
- source_word: יוֹצֵא וָ/בָא
  choice: बाहर जाता और भीतर आता था
  rationale: शाब्दिक क्रियायुग्म को सुरक्षित रखा गया है, क्योंकि मूल पाठ में ‘उन्हें’ जैसा कोई व्यक्त कर्म नहीं है। नेतृत्व का सम्भावित मुहावरेदार अर्थ पादटिप्पणी में दिया गया है।
- source_word: לִ/פְנֵי/הֶם
  choice: उनके आगे
  rationale: यह לִפְנֵיהֶם का निकट और स्वाभाविक हिन्दी रूप है; इससे दृश्य उपस्थिति और अगुवाई—दोनों सम्भावनाएँ खुली रहती हैं।
