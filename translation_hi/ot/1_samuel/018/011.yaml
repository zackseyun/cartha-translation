translation:
  language: hi
  text: शाऊल ने भाला फेंका और कहा, “मैं दाऊद को दीवार में गाड़ दूँगा।”[a] लेकिन दाऊद दो बार उसके सामने से बचकर हट गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इसका अधिक शाब्दिक रूप है, “मैं दाऊद को और दीवार को मारूँगा।” यह निर्माण असामान्य है; इसका आशय संभवतः दाऊद को भाले से दीवार में गाड़ देना है।
    reason: मूल इब्रानी की असामान्य और कुछ हद तक अस्पष्ट संरचना को अधिक स्वाभाविक हिन्दी में स्पष्ट करते हुए बनाए रखना।
lexical_decisions:
