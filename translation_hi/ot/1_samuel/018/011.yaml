  choice: फेंका
  rationale: क्रिया का अर्थ किसी वस्तु को जोर से फेंकना है; प्रसंग में भाला लक्ष्य करके फेंका गया।
- source_word: אַכֶּה בְדָוִד וּבַקִּיר
  choice: मैं दाऊद को दीवार में गाड़ दूँगा
  rationale: शाब्दिक संरचना असामान्य है, पर आशय भाले से दाऊद को मारकर दीवार तक पहुँचा देने या उसमें जड़ देने का है। यह हिन्दी में स्वाभाविक ढंग से उस हिंसक मंशा को व्यक्त करता है।
- source_word: וַיִּסֹּב דָּוִד מִפָּנָיו
  choice: दाऊद उसके सामने से बचकर हट गया
  rationale: סוב का मूल भाव मुड़ने या एक ओर हटने का है; प्रसंग में दाऊद का वार से बचकर हटना अभिप्रेत है।
- source_word: פַּעֲמָיִם
  choice: दो बार
  rationale: द्विवचन रूप स्पष्ट रूप से घटना के दो बार होने को बताता है।
