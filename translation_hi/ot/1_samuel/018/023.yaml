base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/023.yaml
  text: So Saul’s servants spoke these words in David’s hearing[a], and David said, “Does it seem to you a small thing to become the king’s son-in-law, when I am a poor and lightly regarded man?”
translation:
  language: hi
  text: तब शाऊल के सेवकों ने ये बातें दाऊद के सुनते हुए कहीं। दाऊद ने कहा, “क्या तुम्हारी दृष्टि में राजा का दामाद बनना कोई छोटी बात है[a]? मैं तो एक गरीब और तुच्छ समझा जाने वाला व्यक्ति हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुम राजा के साथ वैवाहिक संबंध स्थापित करना तुच्छ समझते हो?”
    reason: हिब्रू הִתְחַתֵּן का व्यापक वैवाहिक-संबंध वाला अर्थ; मुख्य पाठ में संदर्भानुसार ‘राजा का दामाद बनना’ रखा गया है।
lexical_decisions:
- source_word: וַיְדַבְּרוּ
  choice: ने … सुनाईं
  rationale: कथात्मक प्रसंग में דּבר का सामान्य वाचिक अर्थ है; ‘सुनाईं’ बְּאָזְנֵי के साथ मिलकर स्वाभाविक हिन्दी में बताता है कि सेवकों ने बातें दाऊद तक पहुँचाईं।
- source_word: בְּאָזְנֵי דָוִד
  choice: दाऊद को सुनाईं
  rationale: शाब्दिक रूप ‘दाऊद के कानों में’ हिन्दी में अस्वाभाविक है; यह चयन उसी श्रवण-संबंधी मुहावरे का स्वाभाविक अर्थ देता है।
- source_word: אֶת־הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: तात्कालिक संदेश के संदर्भ में דְּבָרִים का सरल और स्वाभाविक हिन्दी समतुल्य।
- source_word: הַנְקַלָּה בְעֵינֵיכֶם
  choice: क्या तुम्हारी दृष्टि में … कोई छोटी बात है?
  rationale: मूल के आलंकारिक प्रश्न और ‘तुम्हारी आँखों में’ मूल्यांकन-सूचक मुहावरे को स्पष्ट, गरिमामय हिन्दी में बनाए रखता है।
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: राजा का दामाद बनना
  rationale: संदर्भ में क्रिया का आशय राजा की बेटी से विवाह करके उसका दामाद बनने से है; हिन्दी में यही सबसे स्पष्ट और स्वाभाविक अभिव्यक्ति है।
- source_word: רָשׁ
  choice: गरीब
  rationale: दाऊद की आर्थिक और सामाजिक निम्नता को व्यक्त करने वाला सीधा आधुनिक हिन्दी शब्द।
- source_word: וְנִקְלֶה
  choice: तुच्छ समझा जानेवाला
  rationale: यह सामाजिक रूप से कम आँके या हल्का समझे जाने का भाव देता है और ‘छोटी बात’ वाले पूर्ववर्ती קלל-मूल से अर्थगत संबंध भी बनाए रखता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: दाऊद अपने विषय में बोल रहा है; ‘मनुष्य’ यहाँ स्वाभाविक है और उसकी विनम्र आत्म-पहचान को व्यक्त करता है।
