base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/006.yaml
  text: And it happened[a], as they were coming in, when David returned from striking down the Philistine, that the women came out from all the cities of Israel, singing and dancing, to meet King Saul with tambourines, with joy, and with three-stringed instruments.
translation:
  language: hi
  text: जब वे आ रहे थे और दाऊद उस फ़िलिस्ती को मार गिराकर लौट रहा था, तब इस्राएल के सभी नगरों से स्त्रियाँ गाती और नाचती हुई, डफों के साथ, आनन्द के साथ और शालीशीम[a] के साथ राजा शाऊल से मिलने निकलीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द शालीशीम का अर्थ निश्चित नहीं है। यह सम्भवतः तीन तारों वाले वाद्यों, वीणा-सदृश वाद्यों, या किसी अन्य संगीत-संगत को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: जब
  rationale: यहाँ यह कथात्मक सूत्र नए दृश्य और समय-संबंध को प्रस्तुत करता है; हिन्दी में अलग से ‘और ऐसा हुआ’ जोड़ने की अपेक्षा ‘जब’ से संयुक्त वाक्य अधिक स्वाभाविक है।
- source_word: בְּבוֹאָם
  choice: जब वे आ रहे थे
  rationale: בְּ के साथ infinitive construct और 3 पुरुष बहुवचन प्रत्यय समयसूचक उपवाक्य बनाते हैं। अस्पष्ट बहुवचन कर्ता को ‘वे’ के रूप में बनाए रखा गया है।
- source_word: בְּשׁוּב דָּוִד
  choice: जब दाऊद ... लौट रहा था
  rationale: समयसूचक infinitive construct है जिसका स्पष्ट कर्ता दाऊद है। अपूर्णतासूचक हिन्दी रूप साथ-साथ घट रही पृष्ठभूमि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵהַכּוֹת אֶת־הַפְּלִשְׁתִּי
  choice: उस फ़िलिस्ती को मार गिराकर
  rationale: נכה यहाँ पराजित करने अथवा घातक रूप से मारने का अर्थ देता है; तत्काल प्रसंग में एकवचन ‘उस फ़िलिस्ती’ पहले उल्लिखित योद्धा की ओर संकेत करता है।
- source_word: וַתֵּצֶאנָה הַנָּשִׁים
  choice: स्त्रियाँ ... निकलीं
  rationale: יצא नगरों से बाहर आकर स्वागत के लिए जाने को दर्शाता है; ‘निकलीं’ आधुनिक हिन्दी में सहज है।
- source_word: מִכָּל עָרֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी नगरों से
  rationale: मूल के सामूहिक-वितरणात्मक अर्थ को सीधे और स्वाभाविक रूप में रखा गया है।
- source_word: לָשׁוּר וְהַמְּחֹלוֹת
  choice: गाती और नाचती हुई
  rationale: गति के बाद उद्देश्य/सहवर्ती क्रिया और संज्ञा ‘नृत्य’ की जोड़ी को हिन्दी की स्वाभाविक समानांतर क्रियाओं में व्यक्त किया गया है।
- source_word: לִקְרַאת שָׁאוּל הַמֶּלֶךְ
  choice: राजा शाऊल से मिलने
  rationale: לִקְרַאת किसी की ओर जाकर उससे मिलने को दर्शाता है; उपाधि और नाम का क्रम स्वाभाविक हिन्दी के अनुसार है।
- source_word: בְּתֻפִּים
  choice: डफ बजाती
  rationale: תֹּף हाथ से बजाया जाने वाला चौखटे वाला ढोल है; ‘डफ’ आधुनिक हिन्दी में संक्षिप्त और समझने योग्य निकटतम शब्द है। क्रिया ‘बजाती’ प्रसंग से स्पष्ट की गई है।
- source_word: בְּשִׂמְחָה
  choice: आनन्द मनाती
  rationale: संज्ञा हर्ष और उल्लास को व्यक्त करती है। हिन्दी में क्रियात्मक रूप उत्सवी दृश्य को स्वाभाविक बनाता है।
- source_word: וּבְשָׁלִשִׁים
  choice: शालीशीम
  rationale: इस दुर्लभ शब्द का अर्थ अनिश्चित है। मुख्य पाठ में लिप्यंतरण वास्तविक अनिश्चितता को सुरक्षित रखता है; संभावित अर्थ पादटिप्पणी में दिए गए हैं।
