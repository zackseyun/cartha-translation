  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל דָּוִ֗ד הִנֵּה֩ בִתִּ֨/י הַ/גְּדוֹלָ֤ה מֵרַב֙ אֹתָ/הּ֙ אֶתֶּן לְ/ךָ֣ לְ/אִשָּׁ֔ה אַ֚ךְ הֱיֵה לִּ֣/י לְ/בֶן חַ֔יִל וְ/הִלָּחֵ֖ם מִלְחֲמ֣וֹת יְהוָ֑ה וְ/שָׁא֣וּל אָמַ֗ר אַל תְּהִ֤י יָדִ/י֙ בּ֔/וֹ וּ/תְהִי ב֖/וֹ יַד פְּלִשְׁתִּֽים־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/017.yaml
  text: Then Saul said to David, “Look, my older daughter Merab—I will give her to you as a wife. Only be a valiant man for me, and fight the LORD’s battles.” For Saul said, “Let not my hand be against him, but let the hand of the Philistines be against him.”
translation:
  language: hi
  text: तब शाऊल ने दाऊद से कहा, “देखो, मेरी बड़ी बेटी मेरब; मैं उसे तुम्हें पत्नी के रूप में दूँगा। केवल मेरे लिए वीर बनो और यहोवा के युद्ध लड़ो।” क्योंकि शाऊल ने कहा, “मेरा हाथ उस पर न उठे, बल्कि पलिश्तियों का हाथ उस पर उठे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू संकेतक को स्वाभाविक और प्रत्यक्ष हिन्दी में रखा गया है।
- source_word: בִתִּי הַגְּדוֹלָה
  choice: मेरी बड़ी बेटी
  rationale: यहाँ विशेषण बेटी की आयु/वरिष्ठता बताता है; ‘बड़ी बेटी’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: לְבֶן־חַיִל
  choice: वीर पुरुष
  rationale: संदर्भ युद्ध का है, इसलिए सामर्थ्य, साहस और सैन्य पराक्रम का भाव व्यक्त किया गया है।
- source_word: מִלְחֲמוֹת יְהוָה
  choice: यहोवा के युद्ध
  rationale: दिव्य नाम יהוה को ‘यहोवा’ से स्पष्ट रूप में प्रस्तुत किया गया है और मूल का धार्मिक-सैन्य वाक्यांश बनाए रखा गया है।
- source_word: אַל־תְּהִי יָדִי בּוֹ
  choice: मेरा हाथ उस पर न उठे
  rationale: शाब्दिक ‘मेरा हाथ उस पर न हो’ का आशय हिंसा/हत्या है; हिन्दी मुहावरा वही अर्थ स्वाभाविक रूप से देता है।
- source_word: וּתְהִי בוֹ יַד פְּלִשְׁתִּים
  choice: पलिश्तियों का ही हाथ उस पर उठे
  rationale: पहले अर्धवाक्य की समानांतर संरचना और शाऊल की परोक्ष हत्या की मंशा सुरक्षित रखी गई है।
theological_decisions:
- issue: ‘यहोवा के युद्ध’ और शाऊल की गुप्त मंशा के बीच नैतिक तनाव
  choice: दोनों कथनों को बिना व्याख्यात्मक सामंजस्य के साथ रखा गया है
  alternative: शाऊल के कथन को स्पष्ट रूप से छलपूर्ण कहकर अनुवाद करना
  rationale: मूल पाठ शाऊल के बोले हुए धार्मिक औचित्य और उसके मन के घातक उद्देश्य को साथ रखता है; अनुवाद पाठक के लिए इस तनाव को स्वयं प्रकट होने देता है।
- issue: וְשָׁאוּל אָמַר में आंतरिक कथन का स्वरूप
  choice: शाऊल ने मन में कहा
  alternative: शाऊल ने कहा
  rationale: अगला कथन उसकी छिपी योजना प्रकट करता है; हिन्दी में ‘मन में’ कथात्मक आशय स्पष्ट करता है, बिना योजना की सामग्री बदले।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण है। संवाद प्रत्यक्ष और कथावाचन संक्षिप्त रखा गया है। ‘पत्नी के रूप में दूँगा’ मूल संबंधसूचक अभिव्यक्ति को स्पष्ट रखता है; ‘वीर पुरुष’ युद्ध-संदर्भ की औपचारिक गरिमा बनाए रखता है।
