  yaml_path: translation/ot/1_samuel/018/004.yaml
  text: Then Jonathan stripped off the robe that was on him and gave it to David[a], along with his armor, and even his sword, his bow, and his belt.
translation:
  language: hi
  text: तब योनातान ने वह चोगा जो उसने पहन रखा था उतारकर दाऊद को दे दिया, और अपनी युद्ध-पोशाक[a], यहाँ तक कि अपनी तलवार, अपना धनुष और अपना कमरबंद भी उसे दे दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने वस्त्र” अथवा “अपनी सैनिक पोशाक”; इब्रानी शब्द सामान्य वस्त्रों के साथ-साथ पद-सूचक या सैनिक पहनावे के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתְפַּשֵּׁט
  choice: उतारकर
  rationale: हित्पएल रूप स्वयं अपने शरीर से वस्त्र उतारने की क्रिया बताता है। हिंदी में ‘अपना ... उतारकर’ यह आत्मवाचक अर्थ स्वाभाविक रूप से व्यक्त करता है और पूर्ण निर्वस्त्र होने का अनुचित संकेत नहीं देता।
- source_word: הַמְּעִיל אֲשֶׁר עָלָיו
  choice: अपना पहना हुआ अंगरखा
  rationale: מְעִיל बाहरी लंबा वस्त्र या चोगा है। ‘अंगरखा’ आधुनिक पाठक के लिए गरिमापूर्ण और सुबोध है; ‘पहना हुआ’ संबंधवाचक उपवाक्य का अर्थ सहज हिंदी में रखता है।
- source_word: וַיִּתְּנֵהוּ לְדָוִד
  choice: दाऊद को दे दिया
  rationale: सरल कथात्मक נתן का सीधा अनुवाद है; कर्म का संदर्भ पहले उल्लिखित अंगरखे से स्पष्ट है।
- source_word: וּמַדָּיו
  choice: अपनी युद्ध-पोशाक
  rationale: מַדִּים वस्त्र, विशेषतः पद-सूचक या सैनिक पहनावा, बता सकता है। निकटवर्ती तलवार, धनुष और कमरबंद के कारण ‘युद्ध-पोशाक’ सैनिक संदर्भ को व्यक्त करती है, जबकि कठोर अर्थ में केवल धातु-कवच मानने से बचती है।
- source_word: וְעַד ... וְעַד ... וְעַד
  choice: यहाँ तक कि ... और ... भी
  rationale: बार-बार आया עַד सूची के विस्तार और चरम को दिखाता है। हिंदी में ‘यहाँ तक कि ... भी’ इस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חַרְבּוֹ
  choice: अपनी तलवार
  rationale: इस संदर्भ में חֶרֶב का मानक और स्पष्ट हिंदी पर्याय।
- source_word: קַשְׁתּוֹ
  choice: अपना धनुष
  rationale: इस संदर्भ में קֶשֶׁת का मानक हिंदी पर्याय।
- source_word: חֲגֹרוֹ
  choice: अपना कमरबंद
  rationale: חֲגוֹר कमर में बाँधी जाने वाली वस्तु है। ‘कमरबंद’ आधुनिक, स्पष्ट और प्रसंगानुकूल है।
theological_decisions:
- issue: योनातान के उपहारों का कथात्मक महत्व
  choice: पद में केवल योनातान के ठोस कार्यों का वर्णन किया गया है; उनके प्रतीकात्मक अर्थ को स्पष्ट नहीं किया गया।
  alternative: इन उपहारों को दाऊद के भावी राजत्व की स्वीकृति, राजकीय अधिकार के हस्तांतरण, या केवल वाचा-मित्रता के चिह्न के रूप में स्पष्ट करना।
  rationale: इब्रानी पद इन वस्तुओं के दिए जाने की सूचना देता है, पर इसी पद में उनका प्रतीकात्मक अर्थ नहीं बताता। वर्णनात्मक अनुवाद मित्रता, वाचा और राजकीय संकेतों के बीच मौजूद कथात्मक-धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘अंगरखा’, ‘युद्ध-पोशाक’ और ‘कमरबंद’ सहज किंतु प्रसंगानुकूल शब्द हैं। मुख्य पाठ में [a] चिह्न संबंधित पद के तुरंत बाद रखा गया है।
