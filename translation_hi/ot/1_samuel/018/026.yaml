  text: וַ/יַּגִּ֨דוּ עֲבָדָ֤י/ו לְ/דָוִד֙ אֶת הַ/דְּבָרִ֣ים הָ/אֵ֔לֶּה וַ/יִּשַׁ֤ר הַ/דָּבָר֙ בְּ/עֵינֵ֣י דָוִ֔ד לְ/הִתְחַתֵּ֖ן בַּ/מֶּ֑לֶךְ וְ/לֹ֥א מָלְא֖וּ הַ/יָּמִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/026.yaml
  text: So his servants told David these words[a], and the matter seemed right in David’s eyes, to become the king’s son-in-law[c][b]; and the days had not yet been fulfilled.
translation:
  language: hi
  text: तब उसके सेवकों ने दाऊद को ये बातें बताईं। राजा का दामाद बनने की बात दाऊद को अच्छी लगी।[a][b] और नियत समय अभी पूरा नहीं हुआ था।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यह बात दाऊद की दृष्टि में ठीक थी।” इस हिब्रू मुहावरे का अर्थ है कि बात उसे अच्छी या स्वीकार्य लगी।
    reason: lexical_alternative
  - marker: b
    text: या, “राजा के परिवार से विवाह-संबंध जोड़ने की।” हिब्रू अभिव्यक्ति का शाब्दिक भाव राजा के साथ विवाह के द्वारा संबंध स्थापित करना है।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में शाब्दिक रूप से, “दिन अभी पूरे नहीं हुए थे”; अर्थात् तय की गई अवधि अभी समाप्त नहीं हुई थी।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּגִּדוּ עֲבָדָיו
  choice: उसके सेवकों ने ... बताईं
  rationale: הִגִּיד के हिफ़ील रूप का अर्थ यहाँ किसी बात को बता देना है। राजदरबार के संदर्भ में עֲבָדָיו के लिए ‘उसके सेवक’ सीधा और स्वाभाविक है; संदर्भ में ‘उसके’ का संकेत शाऊल की ओर है।
- source_word: הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים का अर्थ ‘शब्द’ या ‘बातें’ दोनों हो सकता है। यहाँ शाऊल का संदेश सुनाया जा रहा है, इसलिए ‘ये बातें’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दोनों पहलुओं को समेटता है।
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינֵי דָוִד
  choice: यह बात दाऊद को अच्छी लगी
  rationale: हिब्रू मुहावरे का शाब्दिक अर्थ ‘वह बात दाऊद की दृष्टि में ठीक थी’ है। ‘अच्छी लगी’ स्वीकार्यता और प्रसन्नता का भाव स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לְהִתְחַתֵּן בַּמֶּלֶךְ
  choice: राजा का दामाद बनने
  rationale: התחתן विवाह के द्वारा संबंध स्थापित करने को दर्शाता है। कथा में दाऊद राजा की बेटी से विवाह करके उसका दामाद बनने वाला है, इसलिए यह स्पष्ट और संदर्भानुकूल अनुवाद है; व्यापक शाब्दिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְלֹא מָלְאוּ הַיָּמִים
  choice: और वे दिन अभी पूरे नहीं हुए थे
  rationale: मूल पाठ ‘दिनों’ के पूरे होने की अभिव्यक्ति रखता है। ‘अभी’ उस निहित भाव को व्यक्त करता है कि निश्चित अवधि समाप्त नहीं हुई थी, जबकि ‘वे दिन’ हिब्रू रूपक को बनाए रखता है।
