base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/008.yaml
  text: Then Saul became very angry[a], and this matter displeased him. He said, “They have given David ten thousands, but to me they have given the thousands[b]; what more can he have but the kingdom?”
translation:
  language: hi
  text: तब शाऊल बहुत क्रोधित हुआ[a], और यह बात उसे बुरी लगी। उसने कहा, “उन्होंने दाऊद को दसियों हज़ार का श्रेय दिया है, पर मुझे हज़ारों का[b]। अब उसके लिए राज्य के सिवा और क्या रह गया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक भाव: “शाऊल का क्रोध बहुत भड़क उठा।”'
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में संख्यात्मक समानांतरता है: “उन्होंने दाऊद को दस-हज़ारों [का श्रेय] दिया है, और मुझे हज़ारों [का]।” अंतिम खंड संक्षिप्त है: “और उसके लिए अब केवल राज्य।” यहाँ ‘राज्य’ का अर्थ ‘राजत्व’ या ‘राजसत्ता’ भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּחַר לְשָׁאוּל מְאֹד
  choice: शाऊल बहुत क्रोधित हुआ
  rationale: क्रिया में भड़कते क्रोध का भाव है और מְאֹד तीव्रता बताता है; आधुनिक हिन्दी में यह स्वाभाविक और गरिमापूर्ण है।
- source_word: וַיֵּרַע בְּעֵינָיו
  choice: उसे बहुत बुरी लगी
  rationale: इब्रानी मुहावरे ‘उसकी दृष्टि में बुरा था’ का स्वाभाविक हिन्दी रूप; यहाँ ‘बहुत’ क्रोध की तीव्रता और समूची प्रतिक्रिया के प्रवाह को व्यक्त करता है, यद्यपि स्रोत में इस खंड के साथ अलग intensifier नहीं है।
- source_word: הַדָּבָר הַזֶּה
  choice: यह बात
  rationale: संदर्भ में यह पहले गाए गए कथन की ओर संकेत करता है; ‘बात’ हिन्दी में व्यापकता और संदर्भ दोनों बनाए रखती है।
- source_word: נָתְנוּ
  choice: श्रेय दिया है
  rationale: मूल अर्थ ‘दिया’ है, पर गीत में युद्ध-विजयों को किसी के खाते में रखने या उसका श्रेय देने का भाव है; हिन्दी में ‘श्रेय दिया’ संदर्भ स्पष्ट करता है।
- source_word: רְבָבוֹת
  choice: दस हज़ारों
  rationale: बहुवचन की संख्यात्मक और काव्यात्मक समानांतरता को ‘हज़ारों’ के साथ बनाए रखता है।
- source_word: הָאֲלָפִים
  choice: हज़ारों
  rationale: दाऊद को दिए गए ‘दस हज़ारों’ के विपरीत शाऊल की शिकायत में संख्यात्मक विरोध सुरक्षित रहता है।
- source_word: וְעוֹד לוֹ אַךְ הַמְּלוּכָה
  choice: अब उसके लिए राज्य के सिवा और क्या रह गया है?
  rationale: संक्षिप्त इब्रानी वाक्य का आशय और आलंकारिक प्रश्न का भाव स्वाभाविक हिन्दी में व्यक्त करता है, बिना इस तनाव को मिटाए कि ‘राज्य’ राजसत्ता/राजपद का भी संकेत हो सकता है।
- source_word: הַמְּלוּכָה
  choice: राज्य
  rationale: शब्द राज्य, राजत्व या राजसत्ता का बोध करा सकता है; ‘राज्य’ सामान्य पाठक के लिए सहज है और प्रसंग में सत्ता प्राप्त करने के भय को व्यक्त करता है।
theological_decisions:
- issue: הַמְּלוּכָה का अर्थ-क्षेत्र
  choice: राज्य
  alternative: राजत्व / राजसत्ता
  rationale: शाऊल का भय केवल भूभाग से नहीं, दाऊद के शासन प्राप्त करने से जुड़ा है। मुख्य पाठ में प्रचलित ‘राज्य’ रखा गया और वैकल्पिक अर्थ पादटिप्पणी में बताया गया है।
