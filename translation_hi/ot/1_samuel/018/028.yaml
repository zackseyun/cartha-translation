reference: 1 Samuel 18:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֤רְא שָׁאוּל֙ וַ/יֵּ֔דַע כִּ֥י יְהוָ֖ה עִם דָּוִ֑ד וּ/מִיכַ֥ל בַּת שָׁא֖וּל אֲהֵבַֽתְ/הוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/028.yaml
  text: Saul saw and knew that Yahweh was with David[a], and that Michal the daughter of Saul loved him.
translation:
  language: hi
  text: तब शाऊल ने देखा और जान लिया कि यहवे दाऊद के साथ था और शाऊल की बेटी मीकल[a] उससे प्रेम करती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शब्दशः: “मीकल, शाऊल की बेटी।”'
    reason: मूल पदबंध की संरचना बताने के लिए।
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: सामान्य क्रिया ראה का सीधा अर्थ ‘देखना’ है; अगली क्रिया के साथ यह अवलोकन से निष्कर्ष तक की प्रगति बनाए रखता है।
- source_word: וַיֵּדַע
  choice: जान लिया
  rationale: ידע यहाँ शाऊल की पक्की पहचान या समझ को व्यक्त करता है। ‘जान लिया’ हिन्दी कथा में स्वाभाविक है और ‘देखा’ से अलग संज्ञानात्मक चरण को सुरक्षित रखता है।
- source_word: כִּי
  choice: कि
  rationale: यह शाऊल ने जो जाना उसकी विषय-वस्तु बताने वाला उपवाक्य आरम्भ करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
- source_word: עִם דָּוִד
  choice: दाऊद के साथ था
  rationale: עִם उपस्थिति और संगति को व्यक्त करता है; यह अनुवाद दिव्य सहायता या अनुग्रह की व्याख्या को आवश्यकता से अधिक स्पष्ट किए बिना मूल कथन को बनाए रखता है।
- source_word: וּמִיכַל בַּת שָׁאוּל
  choice: और शाऊल की बेटी मीकल
  rationale: हिब्रू संरचना का अर्थ स्वाभाविक आधुनिक हिन्दी संबंधकारक पदबंध से व्यक्त किया गया है। दूसरा ‘कि’ मूल में नहीं है और हिन्दी में इसके बिना वाक्य स्पष्ट रहता है।
- source_word: אֲהֵבַתְהוּ
  choice: उससे प्रेम करती थी
  rationale: कृदन्त रूप जारी अवस्था को दर्शाता है। ‘प्रेम करती थी’ स्वाभाविक हिन्दी में उसी सतत भाव को व्यक्त करता है; ‘उससे प्रेम हो गया था’ मूल से अधिक कहता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे प्रयुक्त है। ‘यहवे’ उसे उपाधि में बदले बिना नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘देखा और जान लिया’ मूल की क्रमिक दो क्रियाओं को बनाए रखता है; नामों के मानक हिन्दी बाइबलीय रूप प्रयुक्त हैं।
