translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। राजदरबार के संबोधन को स्पष्ट रखा गया है। בַּלָּט की गोपनीयता और הִתְחַתֵּן की विवाह-संबंधी व्यापक अभिव्यक्ति को क्रमशः मुख्य पाठ और पादटिप्पणी में सुरक्षित रखा गया है।
