  text: וַ/יְצַ֨ו שָׁא֜וּל אֶת עֲבָדָ֗/ו דַּבְּר֨וּ אֶל דָּוִ֤ד בַּ/לָּט֙ לֵ/אמֹ֔ר הִנֵּ֨ה חָפֵ֤ץ בְּ/ךָ֙ הַ/מֶּ֔לֶךְ וְ/כָל עֲבָדָ֖י/ו אֲהֵב֑וּ/ךָ וְ/עַתָּ֖ה הִתְחַתֵּ֥ן בַּ/מֶּֽלֶךְ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/022.yaml
  text: So Saul commanded his servants[a], “Speak to David privately, saying, ‘Look, the king delights in you, and all his servants love you[b]. So now become the king’s son-in-law.’”
translation:
  language: hi
  text: तब शाऊल ने अपने सेवकों को आज्ञा दी, “दाऊद से चुपके से कहो, ‘देखो, राजा तुमसे प्रसन्न है और उसके सभी सेवक तुमसे प्रेम करते हैं। इसलिए अब राजा का दामाद[a] बन जाओ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “राजा के साथ विवाह-संबंध स्थापित करो।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְצַו
  choice: आज्ञा दी
  rationale: צוה निर्देश देने या आदेश करने का भाव रखता है; प्रसंग में ‘आज्ञा दी’ इसकी शक्ति को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: अपने सेवकों
  rationale: עבד का अर्थ सेवक, परिचारक या राजकीय अधिकारी हो सकता है। ‘सेवकों’ मूल शब्द की व्यापकता बनाए रखता है और राजदरबार के प्रसंग में स्वाभाविक है।
- source_word: בַּלָּט
  choice: चुपके से
  rationale: בַּלָּט गोपनीय या दूसरों की जानकारी से परे ढंग से बोलने का संकेत देता है। ‘चुपके से’ आधुनिक हिन्दी में सहज है; ‘एकांत में’ भी संभव है, पर गोपनीयता का भाव कुछ कम स्पष्ट करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: הנה श्रोता का ध्यान आगामी कथन की ओर खींचता है; ‘देखो’ आधुनिक हिन्दी में इसका सीधा और स्वाभाविक रूप है।
- source_word: חָפֵץ בְּךָ
  choice: तुमसे प्रसन्न है
  rationale: חפץ ב किसी में प्रसन्न होने, उससे आनंदित होने या उसे चाहने का भाव दे सकता है। यहाँ राजकीय अनुग्रह के संदर्भ में ‘तुमसे प्रसन्न है’ स्वाभाविक है और अनावश्यक रोमानी अर्थ से बचाता है।
- source_word: אֲהֵבוּךָ
  choice: तुमसे प्रेम करते हैं
  rationale: אהב का सीधा अर्थ ‘प्रेम करना’ है। दरबारी संदर्भ में यह स्नेह या अनुकूलता भी दर्शा सकता है, फिर भी ‘प्रेम करते हैं’ मूल की अभिव्यक्ति को सुरक्षित रखता है।
- source_word: הִתְחַתֵּן בַּמֶּלֶךְ
  choice: राजा का दामाद बन जाओ
  rationale: חתן का हित्पएल रूप विवाह द्वारा संबंध स्थापित करने को दर्शाता है। इस प्रसंग में दाऊद से राजा की बेटी से विवाह करने को कहा जा रहा है, इसलिए हिन्दी का स्वाभाविक रूप ‘राजा का दामाद बन जाओ’ है।
