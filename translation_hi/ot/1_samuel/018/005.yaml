  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּצֵ֨א דָוִ֜ד בְּ/כֹל֩ אֲשֶׁ֨ר יִשְׁלָחֶ֤/נּוּ שָׁאוּל֙ יַשְׂכִּ֔יל וַ/יְשִׂמֵ֣/הוּ שָׁא֔וּל עַ֖ל אַנְשֵׁ֣י הַ/מִּלְחָמָ֑ה וַ/יִּיטַב֙ בְּ/עֵינֵ֣י כָל הָ/עָ֔ם וְ/גַ֕ם בְּ/עֵינֵ֖י עַבְדֵ֥י שָׁאֽוּל־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/005.yaml
  text: David went out wherever Saul sent him[a], and he acted wisely. So Saul appointed him over the men of war[b], and this was good in the eyes of all the people and also in the eyes of Saul’s servants.
translation:
  language: hi
  text: दाऊद जहाँ कहीं शाऊल उसे भेजता था, वहाँ जाता और सूझ-बूझ से काम करता था[a]। तब शाऊल ने उसे सैनिकों का अधिकारी नियुक्त कर दिया। यह बात सब लोगों की दृष्टि में, और शाऊल के सेवकों की दृष्टि में भी, अच्छी थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सफल होता था।” हिब्रू क्रिया में सूझ-बूझ से काम करने और उसके फलस्वरूप सफल होने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “इससे सब लोग और शाऊल के सेवक भी प्रसन्न थे।” हिब्रू में संकेत दाऊद स्वयं, उसकी नियुक्ति, या अभी बताई गई पूरी स्थिति की ओर हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּצֵא
  choice: जाता
  rationale: मूल क्रिया का अर्थ ‘बाहर जाना/जाना’ है। प्रसंग में यह शाऊल द्वारा सौंपे गए अभियानों पर दाऊद के जाने को व्यक्त करती है; हिन्दी में ‘जाता’ स्वाभाविक है।
- source_word: בְּכֹל אֲשֶׁר יִשְׁלָחֶנּוּ שָׁאוּל
  choice: जहाँ कहीं शाऊल उसे भेजता था
  rationale: वाक्यांश का वितरणात्मक और बार-बार होने वाला भाव आधुनिक हिन्दी में स्वाभाविक ढंग से व्यक्त होता है। ‘जो कुछ करने भेजता था’ भी सम्भव है, पर सैन्य प्रसंग में स्थानगत अभिव्यक्ति अधिक सहज है।
- source_word: יַשְׂכִּיל
  choice: सूझ-बूझ से काम करता था
  rationale: हिफ़ील रूप विवेकपूर्ण आचरण और उससे मिलने वाली सफलता—दोनों का भाव दे सकता है। मुख्य पाठ में बुद्धिमानी का मूल अर्थ रखा गया है और सफलता का सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיְשִׂמֵהוּ
  choice: अधिकारी नियुक्त कर दिया
  rationale: שׂים का मूल अर्थ ‘रखना’ है, पर עַל के साथ इस प्रशासनिक प्रसंग में किसी को दूसरों के ऊपर नियुक्त करना अभिप्रेत है।
- source_word: עַל אַנְשֵׁי הַמִּלְחָמָה
  choice: सैनिकों का अधिकारी
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुषों के ऊपर’ है। ‘सैनिकों का अधिकारी’ आधुनिक पाठक के लिए स्पष्ट रूप से सैन्य नेतृत्व व्यक्त करता है।
- source_word: וַיִּיטַב בְּעֵינֵי
  choice: दृष्टि में…अच्छी थी
  rationale: हिब्रू मुहावरे का अर्थ किसी व्यक्ति के मूल्यांकन में अच्छा या स्वीकार्य होना है। ‘दृष्टि में अच्छी थी’ मूल मुहावरे की छवि बनाए रखता है।
- source_word: עַבְדֵי שָׁאוּל
  choice: शाऊल के सेवकों
  rationale: עבדים राजकीय परिचारकों या अधिकारियों को भी सूचित कर सकता है। ‘सेवक’ सबसे सीधा और अर्थ की सीमा को न सँकरा करने वाला विकल्प है।
theological_decisions:
- issue: וַיִּיטַב के कर्ता अथवा संकेत का निर्धारण
  choice: ‘यह बात’ कहकर पिछले पूरे प्रसंग की ओर सामान्य संकेत रखा गया
  alternative: इसे विशेष रूप से दाऊद, उसकी नियुक्ति, या उसके आचरण के लिए ‘वह सबको प्रिय लगा’ कहना
  rationale: हिब्रू में संकेत का विषय स्पष्ट रूप से निर्धारित नहीं है। अनुवाद किसी एक व्याख्या को अंतिम न बनाकर मूल की वास्तविक अस्पष्टता सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सूझ-बूझ से काम करता था’ सामान्य पाठक के लिए स्पष्ट है; ‘दृष्टि में…अच्छी थी’ हिब्रू मुहावरे की बनावट को बनाए रखता है। अपूर्ण क्रियाओं द्वारा शाऊल के बार-बार भेजने और दाऊद के निरंतर आचरण का भाव व्यक्त किया गया है।
