  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל שָׁא֗וּל מִ֤י אָֽנֹכִי֙ וּ/מִ֣י חַיַּ֔/י מִשְׁפַּ֥חַת אָבִ֖/י בְּ/יִשְׂרָאֵ֑ל כִּֽי אֶהְיֶ֥ה חָתָ֖ן לַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/018.yaml
  text: And David said to Saul[a], “Who am I, and what is my life, or my father’s family in Israel, that I should become the king’s son-in-law?”
translation:
  language: hi
  text: तब दाऊद ने शाऊल से कहा, “मैं कौन हूँ, और मेरी हैसियत ही क्या है[a]—इस्राएल में मेरे पिता का कुल ही क्या है—कि मैं राजा का दामाद बनूँ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “और मेरा जीवन क्या है?” यह कठिन अभिव्यक्ति दाऊद की नगण्य हैसियत पर बल दे सकती है; सम्भव है कि यह उसके परिजनों या कुल की स्थिति की ओर संकेत करती हो।
    reason: मूल इब्रानी की वास्तविक शाब्दिक और अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: तब दाऊद ने शाऊल से कहा
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से इस प्रवाह को व्यक्त करता है।
- source_word: מִי אָנֹכִי
  choice: मैं कौन हूँ
  rationale: मूल का सीधा, आत्मविनम्रतापूर्ण आलंकारिक प्रश्न हिन्दी में भी स्वाभाविक है।
- source_word: וּמִי חַיַּי
  choice: और मेरी हैसियत ही क्या है
  rationale: शाब्दिक शब्दावली कठिन और संदिग्ध है (‘मेरा जीवन क्या है’ अथवा परिजनों/सामाजिक स्थिति का संकेत)। प्रसंग में दाऊद अपनी नगण्य स्थिति व्यक्त कर रहा है; ‘हैसियत’ इसे स्वाभाविक हिन्दी में रखती है, जबकि पादटिप्पणी मूल की अस्पष्टता सुरक्षित रखती है।
- source_word: מִשְׁפַּחַת אָבִי בְּיִשְׂרָאֵל
  choice: इस्राएल में मेरे पिता का कुल ही क्या है
  rationale: מִשְׁפָּחָה यहाँ विस्तृत परिवार अथवा कुल को दर्शाता है। ‘कुल’ पितृवंशीय और सामाजिक अर्थ को संक्षेप में व्यक्त करता है।
- source_word: כִּי אֶהְיֶה חָתָן לַמֶּלֶךְ
  choice: कि मैं राजा का दामाद बनूँ
  rationale: חָתָן इस प्रसंग में राजा की बेटी से विवाह करके उसका दामाद बनने वाले पुरुष को दर्शाता है; सम्भावनार्थक ‘बनूँ’ दाऊद की विनम्र विस्मय-भावना को बनाए रखता है।
