  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘ही क्या है’ दाऊद की आत्मविनम्र आलंकारिक शैली व्यक्त करता है; डैश निकटवर्ती ‘पिता का कुल’ वाक्यांश को उसकी हैसियत की व्याख्या के रूप में जोड़ते हैं।
