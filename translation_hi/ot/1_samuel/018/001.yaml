source:
  edition: WLC
  text: וַ/יְהִ֗י כְּ/כַלֹּת/וֹ֙ לְ/דַבֵּ֣ר אֶל שָׁא֔וּל וְ/נֶ֨פֶשׁ֙ יְה֣וֹנָתָ֔ן נִקְשְׁרָ֖ה בְּ/נֶ֣פֶשׁ דָּוִ֑ד ו/יאהבו יְהוֹנָתָ֖ן כְּ/נַפְשֽׁ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/001.yaml
  text: And it happened[a], when he had finished speaking to Saul, that Jonathan’s soul was bound to David’s soul[b], and Jonathan loved him as his own soul.
translation:
  language: hi
  text: जब वह शाऊल से बात करके समाप्त हुआ, तब ऐसा हुआ कि योनातान का प्राण दाऊद के प्राण से बँध गया[a], और योनातान ने दाऊद से अपने प्राण के समान प्रेम किया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योनातान का प्राण दाऊद के प्राण से जुड़ गया।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में इस पद में “प्राण” (नेफ़ेश) शब्द तीन बार आया है: “योनातान का प्राण ... दाऊद के प्राण ... अपने प्राण।”'
    reason: lexical_repetition
lexical_decisions:
- source_word: וַיְהִי
  choice: तब ऐसा हुआ कि
  rationale: यह इब्रानी कथात्मक सूत्र नए घटनाक्रम को प्रस्तुत करता है। यह रूप उसके कथात्मक प्रभाव को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: כְּכַלֹּתוֹ לְדַבֵּר אֶל שָׁאוּל
  choice: जब वह शाऊल से बात कर चुका
  rationale: כְ के साथ infinitive construct घटना के पूरा होने के बाद अगली घटना का समय बताता है। इब्रानी में कर्ता सर्वनाम से व्यक्त है; प्रसंग से वह दाऊद है, पर मुख्य पाठ मूल की सर्वनामात्मक अभिव्यक्ति को बनाए रखता है।
- source_word: נֶפֶשׁ
  choice: प्राण
  rationale: इस पद में נֶפֶשׁ तीन बार आता है। ‘प्राण’ व्यक्ति के आंतरिक जीवन और स्वयं को व्यक्त करते हुए इस महत्वपूर्ण पुनरावृत्ति को स्वाभाविक एवं गरिमापूर्ण हिन्दी में सुरक्षित रखता है।
- source_word: נִקְשְׁרָה
  choice: बँध गया
  rationale: קשר का मूल अर्थ बाँधना या जोड़ना है। ‘बँध गया’ गहरे व्यक्तिगत लगाव के रूपक को बिना व्याख्यात्मक विस्तार के बनाए रखता है।
- source_word: וַיֶּאֱהָבוֹ
  choice: योनातान दाऊद से ... प्रेम करने लगा
  rationale: क्रिया אהב और उसके तृतीय पुरुष एकवचन कर्म-प्रत्यय से स्पष्ट है कि योनातान कर्ता और दाऊद कर्म है। हिन्दी में नामों को दोहराने से संदर्भ स्पष्ट रहता है; ‘प्रेम करने लगा’ कथानक में आरम्भ हुए संबंध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כְּנַפְשׁוֹ
  choice: अपने प्राण के समान
  rationale: यह चयन נֶפֶשׁ की तीसरी आवृत्ति और तुलना की तीव्रता को बनाए रखता है; ‘अपने समान’ अधिक मुहावरेदार होता, पर मूल की शब्दगत पुनरावृत्ति मिटा देता।
theological_decisions:
- issue: योनातान के दाऊद के प्रति प्रेम का स्वरूप
  choice: गहरे व्यक्तिगत प्रेम और लगाव की भाषा को उसी तीव्रता से प्रस्तुत किया गया है, पर उसे यौन, रोमानी अथवा केवल राजनीतिक संबंध के रूप में परिभाषित नहीं किया गया।
  alternative: इसे मुख्यतः राजनीतिक गठबंधन अथवा रोमानी/यौन प्रेम के रूप में स्पष्ट करना।
  rationale: נפשׁ और אהב प्रबल व्यक्तिगत बंधन और स्नेह व्यक्त करते हैं, किंतु यह पद स्वयं उस प्रेम को यौन या केवल राजनीतिक नहीं बताता। अनुवाद को न तो संबंध की गहराई घटानी चाहिए, न मूल से आगे बढ़कर उसका स्वरूप तय करना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘प्राण’ की पुनरावृत्ति जानबूझकर रखी गई है ताकि मूल इब्रानी की शब्दगत संरचना और संबंध की तीव्रता बनी रहे।
