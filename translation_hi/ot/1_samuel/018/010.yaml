  text: וַ/יְהִ֣י מִֽ/מָּחֳרָ֗ת וַ/תִּצְלַ֣ח רוּחַ֩ אֱלֹהִ֨ים רָעָ֤ה אֶל שָׁאוּל֙ וַ/יִּתְנַבֵּ֣א בְ/תוֹךְ הַ/בַּ֔יִת וְ/דָוִ֛ד מְנַגֵּ֥ן בְּ/יָד֖/וֹ כְּ/י֣וֹם בְּ/י֑וֹם וְ/הַ/חֲנִ֖ית בְּ/יַד שָׁאֽוּל׀׀־־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/010.yaml
  text: And it happened on the next day that an evil spirit from God rushed upon Saul[a], and he prophesied within the house while David was playing with his hand, as day by day[d][c][b]; and the spear was in Saul’s hand.
translation:
  language: hi
  text: अगले दिन ऐसा हुआ कि परमेश्वर की ओर से एक बुरी आत्मा[a] शाऊल पर बलपूर्वक आ पड़ी। वह घर के भीतर भविष्यवाणी करने लगा[b], जबकि दाऊद हर दिन की तरह अपने हाथ से संगीत बजा रहा था[c]। उस समय शाऊल के हाथ में भाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की ओर से एक हानि पहुँचानेवाली आत्मा”; इब्रानी में शाब्दिक अर्थ “परमेश्वर की एक बुरी आत्मा” है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ “भविष्यवाणी करना” है, लेकिन यह उन्मत्त या आवेशपूर्ण व्यवहार को भी सूचित कर सकती है; इस प्रसंग में शाऊल का विक्षुब्ध व्यवहार अभिप्रेत हो सकता है।
    reason: alternative_reading
  - marker: c
    text: इस पद में वाद्य का नाम नहीं बताया गया है, यद्यपि आसपास के प्रसंग में उसकी पहचान दी गई है।
    reason: cross_reference
lexical_decisions:
- source_word: מִמָּחֳרָת
  choice: अगले दिन
  rationale: यह स्वाभाविक हिन्दी में पिछली घटनाओं के ठीक बाद वाले दिन का संकेत देता है।
- source_word: וַתִּצְלַח
  choice: बलपूर्वक आ पड़ी
  rationale: रूआख़ के साथ यह क्रिया अचानक और प्रबल रूप से किसी पर आने का भाव देती है; स्त्रीलिंग क्रिया ‘आत्मा’ के अनुरूप है।
- source_word: רוּחַ אֱלֹהִים רָעָה
  choice: परमेश्वर की ओर से एक बुरी आत्मा
  rationale: ‘की ओर से’ स्रोत अथवा भेजे जाने का संबंध व्यक्त करता है, और ‘बुरी’ רָעָה का सीधा अर्थ बनाए रखता है। वैकल्पिक ‘हानि पहुँचानेवाली’ अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וַיִּתְנַבֵּא
  choice: भविष्यद्वाणी करने लगा
  rationale: यह क्रिया के मूल भविष्यद्वाणी-संबंधी अर्थ को बनाए रखता है और प्रसंगगत उन्मत्त व्यवहार की संभावना को पादटिप्पणी में खुला छोड़ता है।
- source_word: בְּתוֹךְ הַבַּיִת
  choice: घर के भीतर
  rationale: स्थानसूचक वाक्यांश का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מְנַגֵּן בְּיָדוֹ
  choice: अपने हाथ से संगीत बजा रहा था
  rationale: क्रिया संगीत बजाने को सूचित करती है और ‘अपने हाथ से’ मूल पाठ को सुरक्षित रखता है; इस पद में वाद्य का नाम नहीं जोड़ा गया।
- source_word: כְּיוֹם בְּיוֹם
  choice: हर दिन की तरह
  rationale: इब्रानी मुहावरे की नियमित, प्रतिदिन की प्रथा का अर्थ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַחֲנִית
  choice: भाला
  rationale: इस हथियार के लिए मानक और सहज हिन्दी शब्द।
- source_word: בְּיַד שָׁאוּל
  choice: शाऊल के हाथ में
  rationale: स्थान और स्वामित्व दोनों को स्वाभाविक हिन्दी में व्यक्त करता है तथा अगले पद के लिए अशुभ विवरण बनाए रखता है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים רָעָה में परमेश्वर और बुरी आत्मा के संबंध को कैसे व्यक्त किया जाए
  choice: परमेश्वर की ओर से एक बुरी आत्मा
  alternative: परमेश्वर की एक बुरी आत्मा; परमेश्वर की ओर से हानि पहुँचानेवाली आत्मा
  rationale: इब्रानी पाठ आत्मा का परमेश्वर से संबंध स्पष्ट रूप से जोड़ता है। ‘की ओर से’ इस संबंध और परमेश्वर की प्रभुता को बनाए रखता है, पर यह नहीं कहता कि बुराई परमेश्वर का नैतिक गुण है।
- issue: וַיִּתְנַבֵּא को सच्ची भविष्यद्वाणी या उन्मत्त व्यवहार के रूप में प्रस्तुत करना
  choice: भविष्यद्वाणी करने लगा
  alternative: उन्मत्त होकर बड़बड़ाने लगा; भविष्यद्वाणी के उन्माद में आ गया
  rationale: मूल क्रिया भविष्यद्वाणी-संबंधी है, जबकि प्रसंग विक्षुब्ध या उन्मत्त व्यवहार सुझा सकता है। मुख्य पाठ मूल शब्द को बनाए रखता है और प्रसंगगत अर्थ पादटिप्पणी में देता है, ताकि तनाव को निर्णायक ढंग से न सुलझाया जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। कथन की गति बनाए रखने के लिए इब्रानी आरंभिक सूत्र को ‘अगले दिन ऐसा हुआ कि’ से व्यक्त किया गया है। ‘हर दिन की तरह’ मुहावरे का स्वाभाविक हिन्दी रूप है। मुख्य पाठ में वाद्य का नाम नहीं जोड़ा गया और कठिन धर्मवैचारिक तथा अर्थगत अस्पष्टताएँ पादटिप्पणियों में सुरक्षित रखी गई हैं।
