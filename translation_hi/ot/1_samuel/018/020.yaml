translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। इब्रानी वाक्य के क्रमिक वावों को हिंदी में यांत्रिक रूप से बार-बार ‘और’ न देकर दो स्वाभाविक वाक्यों तथा ‘जब’ की रचना में व्यक्त किया गया है। कोई आरंभिक ‘अब’ नहीं जोड़ा गया, क्योंकि मूल में उसका स्पष्ट शब्द नहीं है।
