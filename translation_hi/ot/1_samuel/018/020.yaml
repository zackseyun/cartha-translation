  yaml_path: translation/ot/1_samuel/018/020.yaml
  text: Michal[a], Saul's daughter, loved David, and they told Saul, and the matter pleased him.
translation:
  language: hi
  text: शाऊल की बेटी मीकल दाऊद से प्रेम करती थी, और लोगों ने यह बात शाऊल को बताई, और यह बात शाऊल को अच्छी लगी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “वह बात उसकी आँखों में सीधी/अच्छी थी।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֶּאֱהַב
  choice: प्रेम करती थी
  rationale: אהב का सीधा अर्थ प्रेम करना है। अपूर्ण भूतकालीन अभिव्यक्ति प्रसंग में मीकल की उस समय की भावना को स्वाभाविक हिंदी में व्यक्त करती है; ‘प्रेम हो गया’ क्रिया में स्पष्ट न होने वाला आरंभिक भाव जोड़ देता।
- source_word: מִיכַל
  choice: मीकल
  rationale: इब्रानी व्यक्तिगत नाम का हिंदी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: בַּת שָׁאוּל
  choice: शाऊल की बेटी
  rationale: इब्रानी संबंध-रचना को स्वाभाविक आधुनिक हिंदी में संबंधकारक के साथ व्यक्त किया गया है।
- source_word: אֶת דָּוִד
  choice: दाऊद से
  rationale: אֶת कर्तृवाच्य सकर्मक रचना में कर्म चिह्नित करता है; हिंदी में ‘प्रेम करना’ के साथ व्यक्ति सामान्यतः ‘से’ द्वारा व्यक्त होता है।
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: जब लोगों ने यह बात शाऊल को बताई
  rationale: नגד हिफ़ील का अर्थ ‘बताना/सूचित करना’ है। इब्रानी बहुवचन कर्ता अनिर्दिष्ट है; हिंदी में ‘लोगों ने’ इस अनिर्दिष्ट मानवीय कर्ता को स्वाभाविक रूप से रखता है। ‘जब’ घटनाओं का प्रसंगगत संबंध स्पष्ट करता है, बिना कोई नया काल-सूचक ‘अब’ जोड़े।
- source_word: וַיִּשַׁר הַדָּבָר בְּעֵינָיו
  choice: यह बात उसे अच्छी लगी
  rationale: शाब्दिक मुहावरा ‘यह बात उसकी आँखों में सीधी/अच्छी थी’ शाऊल की अनुकूल प्रतिक्रिया या मूल्यांकन बताता है। ‘उसे अच्छी लगी’ आधुनिक हिंदी में इसी भाव को सहज और संक्षिप्त रूप से व्यक्त करता है।
- source_word: הַדָּבָר
  choice: यह बात
  rationale: דבר यहाँ कही गई सूचना अथवा परिस्थिति की ओर संकेत करता है; ‘यह बात’ हिंदी में ‘वह मामला’ की अपेक्षा अधिक स्वाभाविक है।
