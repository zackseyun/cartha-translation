  text: So Saul removed him from his presence and appointed him commander of a thousand[a], and he went out and came in before the people.
translation:
  language: hi
  text: तब शाऊल ने दाऊद को अपने पास से हटा दिया और उसे एक हज़ार का सेनापति नियुक्त किया। वह लोगों के सामने आता-जाता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह लोगों के सामने बाहर जाता और भीतर आता था।” यह इब्रानी मुहावरा सार्वजनिक या सैनिक गतिविधि करने का संकेत दे सकता है, और सम्भवतः लोगों की अगुवाई करने का भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְסִרֵהוּ
  choice: उसे ... हटा दिया
  rationale: हिफ़ील रूप का अर्थ किसी को दूर करना या हटा देना है; यह शाऊल की कार्रवाई को व्यक्त करता है, उसके उद्देश्य की अनावश्यक व्याख्या नहीं करता।
- source_word: מֵעִמּוֹ
  choice: अपने पास से
  rationale: शाब्दिक अर्थ ‘अपने साथ से’ है; आधुनिक हिन्दी में ‘अपने पास से’ दरबारी और निकट उपस्थिति के भाव को स्वाभाविक ढंग से रखता है।
- source_word: וַיְשִׂמֵהוּ לוֹ
  choice: उसे ... नियुक्त किया
  rationale: यहाँ שׂוּם पद या दायित्व सौंपने को व्यक्त करता है; ‘नियुक्त किया’ औपचारिक भूमिका को स्पष्ट और स्वाभाविक बनाता है।
- source_word: שַׂר אָלֶף
  choice: एक हज़ार सैनिकों का सेनापति
  rationale: שַׂר सैन्य अधिकारी है और אָלֶף उसकी इकाई की संख्या बताता है; ‘सैनिकों’ की पूर्ति हिन्दी में आशय स्पष्ट करती है।
- source_word: וַיֵּצֵא וַיָּבֹא
  choice: आते-जाते हुए ... नेतृत्व करता था
  rationale: शाब्दिक ‘निकलता और आता था’ यहाँ नियमित सार्वजनिक या सैन्य गतिविधि का मुहावरा है; सन्दर्भ में लोगों के आगे चलना नेतृत्व सूचित करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: לִפְנֵי הָעָם
  choice: लोगों के आगे
  rationale: לִפְנֵי का मूल अर्थ ‘सामने/आगे’ है; इस प्रसंग में यह दृश्य उपस्थिति और अगुवाई, दोनों के लिए खुला रहता है।
