translation:
  language: hi
  text: उस दिन शाऊल ने उसे अपने पास रख लिया और उसे उसके पिता के घर लौटने नहीं दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे लौटने की अनुमति नहीं दी।” इब्रानी में शाब्दिक रूप से “उसे लौटने के लिए नहीं दिया” है; यहाँ “देना” अनुमति के अर्थ में प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקָּחֵהוּ
  choice: उसे अपने पास रख लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है; इस प्रसंग में शाऊल दाऊद को अपने राजकीय परिवेश में अपने पास रख लेता है। यह हिंदी में स्वाभाविक है और प्रसंगगत आशय व्यक्त करता है, बिना ‘सेवा में नियुक्त किया’ जैसी अतिरिक्त स्पष्टता जोड़े।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: इब्रानी नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: समय-सूचक इब्रानी पदबंध का सीधा और स्वाभाविक हिंदी रूप।
- source_word: וְלֹא נְתָנוֹ לָשׁוּב
  choice: उसे ... लौटने नहीं दिया
  rationale: נתן के साथ क्रियारूप यहाँ अनुमति देने के अर्थ में प्रयुक्त मुहावरा है; शाब्दिक ‘लौटने के लिए नहीं दिया’ हिंदी में अस्वाभाविक और अस्पष्ट होगा।
- source_word: בֵּית אָבִיו
  choice: उसके पिता के घर
  rationale: इब्रानी पदबंध पिता के घराने अथवा पैतृक घर को दर्शाता है; ‘पिता के घर’ मूल अभिव्यक्ति को स्पष्ट और स्वाभाविक रूप में बनाए रखता है।
