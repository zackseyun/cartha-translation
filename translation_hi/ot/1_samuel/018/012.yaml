  text: וַ/יִּרָ֥א שָׁא֖וּל מִ/לִּ/פְנֵ֣י דָוִ֑ד כִּֽי הָיָ֤ה יְהוָה֙ עִמּ֔/וֹ וּ/מֵ/עִ֥ם שָׁא֖וּל סָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/012.yaml
  text: Saul was afraid of David[a], because Yahweh was with him and had departed from Saul.
translation:
  language: hi
  text: शाऊल दाऊद से डरता था,[a] क्योंकि यहोवा उसके साथ था और शाऊल से हट गया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाऊल दाऊद से भयभीत था।” इब्रानी में शाब्दिक रूप से “शाऊल दाऊद के सामने से डरता था” है; यह मुहावरा बताता है कि दाऊद शाऊल के भय का विषय या कारण था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּרָא
  choice: डरता था
  rationale: यह ירא के भय-संबंधी अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और यहाँ शाऊल की जारी मनःस्थिति के अनुकूल है।
- source_word: מִלִּפְנֵי
  choice: से
  rationale: शाब्दिक रूप से ‘के सामने से/उपस्थिति से’ है, पर ירא के साथ यह दाऊद को शाऊल के भय का कारण अथवा विषय बताने वाला मुहावरा है; हिन्दी में ‘दाऊद से डरता था’ स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शाऊल के भय का कारण प्रस्तुत करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रतिलिप्यंतरण द्वारा परमेश्वर के व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना रखा गया है।
- source_word: עִמּוֹ
  choice: उसके साथ
  rationale: सर्वनाम का स्वाभाविक संदर्भ दाऊद है; हिन्दी में मूल का सर्वनाम सुरक्षित रखा गया है।
- source_word: וּמֵעִם שָׁאוּל סָר
  choice: और शाऊल को छोड़ चुका था
  rationale: סור यहाँ अलग हो जाने अथवा साथ छोड़ देने का भाव देता है। पूर्ण हो चुकी पूर्ववर्ती स्थिति को ‘छोड़ चुका था’ स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम है। हिन्दी पाठकों के लिए सुस्थापित ‘यहोवा’ नाम को नाम के रूप में ही सुरक्षित रखता है, न कि उसे ‘प्रभु’ जैसी उपाधि से बदलता है।
- issue: यहोवा का शाऊल को छोड़ना
  choice: पद के संक्षिप्त कथन को ज्यों का त्यों रखना
  alternative: ‘यहोवा का आत्मा शाऊल को छोड़ चुका था’ अथवा ‘यहोवा की कृपा शाऊल से हट गई थी’
  rationale: इस पद में न ‘आत्मा’ कहा गया है, न ‘कृपा’। निकटवर्ती प्रसंग की भाषा जोड़ने के बजाय मूल कथन और उसका धर्मवैज्ञानिक तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली। ‘डरता था’ सामान्य पाठक के लिए स्वाभाविक है; पादटिप्पणी अधिक औपचारिक ‘भय खाता था’ और इब्रानी मुहावरे को दर्ज करती है।
