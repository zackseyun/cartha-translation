lexical_decisions:
- source_word: וַיַּרְא
  choice: जब शाऊल ने देखा
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘जब’ पहली घटना को दूसरी की परिणति के रूप में स्वाभाविक हिंदी में जोड़ता है।
- source_word: אֲשֶׁר הוּא
  choice: कि वह
  rationale: यह शाऊल के देखने की विषय-वस्तु प्रस्तुत करता है और इब्रानी अधीन संबंध को सहज हिंदी में बनाए रखता है।
- source_word: מַשְׂכִּיל
  choice: सूझ-बूझ से सफल हो रहा है
  rationale: שׂכל का हिफ़ील रूप विवेकपूर्ण आचरण और उससे मिलने वाली सफलता—दोनों का बोध करा सकता है। संयुक्त अभिव्यक्ति इस अर्थ-विस्तार को बिना किसी एक पक्ष को मिटाए व्यक्त करती है।
- source_word: מְאֹד
  choice: बहुत
  rationale: यह तीव्रता बताने वाला सामान्य क्रियाविशेषण है; ‘बहुत’ स्पष्ट और स्वाभाविक आधुनिक हिंदी है।
- source_word: וַיָּגָר
  choice: डरने लगा
  rationale: यहाँ גור शाऊल के दाऊद के प्रति भय को व्यक्त करता है। प्रसंग में ‘डरने लगा’ परिणामी और टिकाऊ भय को सहज हिंदी में दर्शाता है।
- source_word: מִפָּנָיו
  choice: उससे
  rationale: शाब्दिक अर्थ ‘उसके सामने से’ है, पर भय के साथ यह इब्रानी मुहावरा किसी व्यक्ति से डरने का अर्थ देता है; हिंदी में ‘उससे’ स्वाभाविक है।
