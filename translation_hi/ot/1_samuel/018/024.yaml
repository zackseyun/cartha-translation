  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: बताया
  rationale: नגד के हिफ़ील रूप का सामान्य अर्थ ‘बताना’ या ‘सूचित करना’ है; यहाँ ‘बताया’ सहज और प्रसंगानुकूल है।
- source_word: עַבְדֵי שָׁאוּל
  choice: शाऊल के सेवकों
  rationale: עבד का अर्थ सेवक, परिचारक या अधिकारी हो सकता है। ‘सेवक’ राजदरबार के संदर्भ में व्यापक अर्थ को सुरक्षित रखता है और पद को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לוֹ
  choice: उसे
  rationale: सर्वनाम का संकेत शाऊल की ओर है; ‘उसे बताया’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष उद्धरण द्वारा व्यक्त
  rationale: यह रूप कथन की विषयवस्तु प्रस्तुत करता है। हिन्दी में उद्धरण-चिह्न पर्याप्त और अधिक स्वाभाविक हैं, इसलिए अलग से ‘कहते हुए’ जोड़ना आवश्यक नहीं है।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ऐसी ही बातें
  rationale: כְּ उपसर्ग यहाँ ‘इन बातों के अनुसार/इन जैसी’ का भाव देता है। ‘ऐसी ही बातें’ समानता और कथन के सार—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: דִּבֶּר
  choice: कही हैं
  rationale: דבר का मूल भाव ‘बोलना’ है, किंतु ‘बातें कही हैं’ हिन्दी में ‘बातें बोली हैं’ से अधिक स्वाभाविक है। पूर्णतासूचक ‘कही हैं’ सेवकों की वर्तमान रिपोर्ट के अनुरूप है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
