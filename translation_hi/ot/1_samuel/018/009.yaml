- source_word: וַיְהִי
  choice: लगा
  rationale: यहाँ היה का कथात्मक रूप अगले कृदंत के साथ मिलकर एक आरम्भ हुई और जारी रहने वाली मनोवृत्ति व्यक्त करता है; हिंदी में ‘नज़र रखने लगा’ इसे स्वाभाविक रूप से दर्शाता है।
- source_word: שָׁאוּל
