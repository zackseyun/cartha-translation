  rationale: व्यक्तिनाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: עון
  choice: नज़र रखने
  rationale: दुर्लभ रूप का अर्थ इस प्रसंग में केवल देखना नहीं, बल्कि शत्रुतापूर्ण, ईर्ष्यापूर्ण या संदेहभरी दृष्टि से देखते रहना है। मुख्य पाठ में ‘नज़र रखने’ से मूल की कुछ अस्पष्टता बनी रहती है, जबकि पादटिप्पणी प्रसंगगत भाव स्पष्ट करती है।
- source_word: אֶת דָּוִד
  choice: दाऊद पर
  rationale: אֶת कर्म-चिह्न है; चुने गए हिंदी मुहावरे ‘पर नज़र रखना’ के अनुसार ‘पर’ प्रयुक्त हुआ है। दाऊद व्यक्तिनाम का प्रचलित हिंदी रूप है।
- source_word: מֵהַיּוֹם הַהוּא וָהָלְאָה
  choice: उस दिन से
  rationale: यह समय-वाक्यांश उसी दिन से आगे लगातार बनी रहने वाली स्थिति बताता है। हिंदी में आरम्भसूचक ‘लगा’ के साथ ‘उस दिन से’ स्वाभाविक रूप से ‘उस दिन से आगे’ का निरंतर भाव देता है।
