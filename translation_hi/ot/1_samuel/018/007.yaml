  text: And the women who were celebrating sang responsively[a], saying, “Saul has struck down his thousands[c][b], and David his tens of thousands.”
translation:
  language: hi
  text: 'तब उत्सव मना रही स्त्रियाँ एक-दूसरे को प्रत्युत्तर में गाईं[a]:


    “शाऊल ने हज़ारों को मार डाला[c],


    और दाऊद ने दस हज़ारों को।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “एक-दूसरे को उत्तर दिया”; यहाँ आशय सम्भवतः समूहों में बारी-बारी से, या प्रत्युत्तर में, गाने का है।
    reason: lexical_alternative
  - marker: c
    text: या “मारा”; इब्रानी क्रिया का शाब्दिक अर्थ “प्रहार करना” है, पर यहाँ इसका प्रयोग युद्ध के संदर्भ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתַּעֲנֶינָה
  choice: एक-दूसरी के उत्तर में गाने लगीं
  rationale: गीत और उत्सव के संदर्भ में ענה केवल बोलकर उत्तर देने के बजाय प्रत्युत्तरात्मक या समूहों में बारी-बारी से गाने का संकेत देता है।
- source_word: הַנָּשִׁים הַמְשַׂחֲקוֹת
  choice: उत्सव मनाती हुई स्त्रियाँ
  rationale: שׂחק का कृदंत यहाँ हर्षोल्लास, नृत्य या खेलपूर्ण उत्सव को सूचित कर सकता है; व्यापक और स्वाभाविक हिन्दी अभिव्यक्ति अनावश्यक रूप से किसी एक गतिविधि को निश्चित नहीं करती।
- source_word: וַתֹּאמַרְןָ
  choice: गाने लगीं
  rationale: पूर्ववर्ती प्रत्युत्तरात्मक क्रिया और आगे दिए गए काव्यात्मक बोलों के साथ हिन्दी में इसे स्वाभाविक रूप से जोड़ा गया है; 'कहती हुई' जोड़ना अनावश्यक पुनरुक्ति होता।
- source_word: הִכָּה
  choice: मारा
  rationale: נכה का मूल अर्थ प्रहार करना है और इस सैनिक संदर्भ में मार गिराने या वध करने का भाव है। 'मारा' मूल की व्यापकता और युद्ध-संदर्भ दोनों को बनाए रखता है।
- source_word: באלפו
  choice: अपने हज़ारों को
  rationale: पूर्वसर्ग सहित संख्या यहाँ युद्ध में मारे या पराजित किए गए लोगों की गिनती व्यक्त करती है; सम्बन्धसूचक प्रत्यय को 'अपने' से दर्शाया गया है।
- source_word: בְּרִבְבֹתָיו
  choice: अपने दस हज़ारों को
  rationale: רבבה का अर्थ दस हज़ार है; बहुवचन और सम्बन्धसूचक प्रत्यय को रखते हुए शाऊल के 'हज़ारों' के साथ काव्यात्मक तुलना सुरक्षित रहती है।
