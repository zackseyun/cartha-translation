lexical_decisions:
- source_word: וַיְהִי
  choice: था
  rationale: यहाँ क्रिया दाऊद के लगातार दिखाई देने वाले आचरण का परिचय देती है; हिंदी में अपूर्ण भूतकाल स्वाभाविक है।
- source_word: דָוִד
  choice: दाऊद
  rationale: हिंदी बाइबल परंपरा में इस नाम का प्रचलित और सहज रूप।
- source_word: לְכָל דָּרְכָו
  choice: अपने सभी कामों में
  rationale: शाब्दिक अर्थ ‘उसके सब मार्गों में’ है, पर इस प्रसंग में अभिप्राय उसके आचरण और कार्यों से है; यह रूप आधुनिक हिंदी में स्वाभाविक है।
- source_word: מַשְׂכִּיל
  choice: बुद्धिमानी से चलता
  rationale: शब्द सूझ-बूझ से आचरण करने और उससे प्राप्त सफलता—दोनों अर्थ दे सकता है। मुख्य पाठ में विवेकपूर्ण आचरण रखा गया है और परिणामसूचक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וַיהוָה
  choice: और यहोवा
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को नाम के रूप में प्रस्तुत किया गया है।
- source_word: עִמּוֹ
  choice: उसके साथ था
  rationale: यह उपस्थिति और साथ का सीधा, स्वाभाविक हिंदी रूप है; प्रसंग में ईश्वरीय सहायता का भाव भी निहित रह सकता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में प्रयुक्त विशिष्ट वाचा-नाम को सामान्य उपाधि से बदलने के बजाय हिंदी में व्यापक रूप से पहचाने जाने वाले नाम-रूप ‘यहोवा’ से रखा गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। ‘बुद्धिमानी से चलता था’ इब्रानी मुहावरे के आचरण-संबंधी अर्थ को बनाए रखता है, जबकि पादटिप्पणी सफलता या उन्नति की वास्तविक अर्थ-संभावना को सुरक्षित रखती है।
