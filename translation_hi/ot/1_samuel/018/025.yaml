base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/025.yaml
  text: Then Saul said[a], “Thus you shall say to David, ‘The king has no desire for a bride-price except a hundred Philistine foreskins[c][b], to take vengeance on the king’s enemies.’” Now Saul intended to make David fall by the hand of the Philistines.
translation:
  language: hi
  text: 'तब शाऊल ने कहा, “तुम दाऊद से यह कहना: ‘राजा को विवाह-मूल्य[a] में पलिश्तियों की सौ खलड़ियों के सिवा और कुछ नहीं चाहिए, ताकि राजा अपने शत्रुओं से बदला ले।’” शाऊल की मंशा थी कि वह दाऊद को पलिश्तियों के हाथों गिरा दे[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विवाह-मूल्य” उस भुगतान को दर्शाता है जो विवाह के संबंध में सामान्यतः वर या उसके परिवार की ओर से वधू के परिवार को दिया जाता था; यह आधुनिक अर्थ के “दहेज” से अलग है।
    reason: cultural_note
  - marker: b
    text: यहाँ “गिरा दे” का अभिप्राय संभवतः दाऊद की मृत्यु करवाना है, पर इब्रानी अभिव्यक्ति इसे कम स्पष्ट रूप में कहती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מֹהַר
  choice: विवाह-मूल्य
  rationale: यह वर या उसके परिवार द्वारा विवाह के संबंध में वधू के परिवार को दिए जाने वाले भुगतान को दर्शाता है; आधुनिक अर्थ में ‘दहेज’ कहना भ्रामक होगा।
- source_word: אֵין חֵפֶץ לַמֶּלֶךְ
  choice: राजा को ... और कुछ नहीं चाहिए
  rationale: हिंदी में यह माँगे गए विवाह-मूल्य के संदर्भ में इच्छा/चाह का स्वाभाविक और स्पष्ट रूप है।
- source_word: בְּמֵאָה עָרְלוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की सौ खलड़ियों के सिवा
  rationale: यह इब्रानी की चौंकाने वाली ठोस माँग को बिना नरम किए सीधे व्यक्त करता है।
- source_word: לְהִנָּקֵם
  choice: बदला ले
  rationale: निफ़अल रूप यहाँ प्रतिशोध लेने/चुकाने के उद्देश्य को व्यक्त करता है; स्वाभाविक हिंदी में सक्रिय प्रयोग अधिक स्पष्ट है।
- source_word: חָשַׁב
  choice: मंशा थी
  rationale: संदर्भ में यह केवल विचार नहीं, बल्कि शाऊल का सोचा-समझा इरादा दर्शाता है।
- source_word: לְהַפִּיל אֶת דָּוִד
  choice: दाऊद ... मारा जाए
  rationale: संदर्भ में ‘गिराना’ दाऊद की मृत्यु करवाने का संकेत देता है; मुख्य पाठ में स्वाभाविक हिंदी रखी गई है और रूपक का शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: בְּיַד פְּלִשְׁתִּים
  choice: पलिश्तियों के हाथों
  rationale: यह एजेंसी व्यक्त करने वाले इब्रानी मुहावरे का स्वाभाविक हिंदी समतुल्य है।
theological_decisions:
- issue: לְהַפִּיל में मृत्यु या व्यापक पतन
  choice: मुख्य पाठ में ‘मारा जाए’
  alternative: ‘गिर पड़े’ या ‘उसका पतन हो’
  rationale: तात्कालिक योजना दाऊद को पलिश्तियों से मरवाने की है, पर इब्रानी की कम स्पष्ट अभिव्यक्ति को पादटिप्पणी में दर्ज किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सहज। ‘दहेज’ से बचकर सांस्कृतिक रूप से सटीक ‘विवाह-मूल्य’ चुना गया है। प्रत्यक्ष भाषण की राजकीय आत्म-संदर्भ शैली और मूल की कठोर शारीरिक भाषा बनाए रखी गई है।
