base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/030.yaml
  text: Then the commanders of the Philistines went out[a], and as often as they went out, David acted more wisely than all the servants of Saul[c][b], so that his name was highly esteemed.
translation:
  language: hi
  text: तब पलिश्तियों के सेनापति निकले; और जितनी बार वे निकलते थे, दाऊद शाऊल के सभी सेवकों से अधिक समझदारी से काम करता था[a]। इस प्रकार उसका नाम बहुत सम्मानित हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “दाऊद को शाऊल के सभी सेवकों से अधिक सफलता मिली” भी हो सकता है। इब्रानी क्रिया समझदारी से किए गए ऐसे काम को भी व्यक्त कर सकती है जिससे सफलता मिलती है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक अर्थ: “उसका नाम बहुत बहुमूल्य/आदरणीय हो गया,” अर्थात उसकी प्रतिष्ठा बहुत बढ़ गई।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सेनापति
  rationale: युद्ध के प्रसंग में שָׂרִים अधिकारियों अथवा सैन्य अगुओं को सूचित करता है; ‘सेनापति’ स्वाभाविक और प्रसंगानुकूल है।
- source_word: וַיֵּצְאוּ / מִדֵּי צֵאתָם
  choice: युद्ध के लिए निकलते रहे / जितनी बार वे निकले
  rationale: יצא निकलने को और מִדֵּי वाला विन्यास बार-बार होने वाली घटना को व्यक्त करता है। ‘युद्ध के लिए’ सैन्य प्रसंग को स्पष्ट करता है, यद्यपि मूल क्रिया केवल ‘निकले’ कहती है।
- source_word: שָׂכַל
  choice: बुद्धिमानी और सफलता से काम किया
  rationale: क्रिया में समझ-बूझ से आचरण करने और उसके फलस्वरूप सफल होने—दोनों अर्थछायाएँ हैं; संयुक्त अभिव्यक्ति किसी एक पक्ष को दबाए बिना हिंदी में अर्थ पहुँचाती है।
- source_word: מִכֹּל עַבְדֵי שָׁאוּל
  choice: शाऊल के सभी सेवकों से बढ़कर
  rationale: עֲבָדִים राजकीय सेवा में लगे लोगों के लिए व्यापक शब्द है; ‘सेवक’ मूल की व्यापकता बनाए रखता है।
- source_word: וַיִּיקַר שְׁמוֹ מְאֹד
  choice: उसका नाम बहुत आदर का माना जाने लगा
  rationale: शाब्दिक रूप से उसका ‘नाम’ बहुत मूल्यवान अथवा आदरणीय हुआ; हिंदी अभिव्यक्ति नाम और प्रतिष्ठा के संबंध को बनाए रखती है।
