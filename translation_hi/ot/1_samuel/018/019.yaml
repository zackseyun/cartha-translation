base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/018/019.yaml
  text: But when the time came to give Merab[a], Saul’s daughter, to David, she was given to Adriel the Meholathite as a wife.
translation:
  language: hi
  text: पर जब शाऊल की बेटी मेरब को दाऊद को देने का समय आया, तो उसे पत्नी के रूप में महोलावासी अद्रीएल को दे दिया गया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसे पत्नी के रूप में महोलावासी अद्रीएल को दे दिया गया।”
    reason: हिब्रू וְ को प्रसंग में परिणाम अथवा साधारण संयोजन के रूप में समझा जा सकता है; मुख्य पाठ स्वाभाविक हिन्दी में विरोधाभासी मोड़ को उभारता है, जबकि यह विकल्प अधिक शाब्दिक संयोजन देता है।
lexical_decisions:
- source_word: וַיְהִי בְּעֵת
  choice: पर जब ... समय आया
  rationale: यह कथा में आए मोड़ और समय-सूचक वाक्यांश—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है; ‘पर’ पिछली अपेक्षा के विपरीत परिणाम की ओर संकेत करता है।
- source_word: תֵּת
  choice: देने
  rationale: נתן के इनफिनिटिव का सीधा अर्थ रखा गया है और विवाह की व्यवस्था के प्रसंग में यह स्वाभाविक है।
- source_word: אֶת מֵרַב בַּת שָׁאוּל
  choice: शाऊल की बेटी मेरब को
  rationale: हिब्रू के संबंध-सूचक पदबंध और कर्म-भूमिका को स्पष्ट, सहज हिन्दी क्रम में रखा गया है।
- source_word: לְדָוִד
  choice: दाऊद को
  rationale: पूर्वसर्ग ל यहाँ विवाह के लिए नियत प्राप्तकर्ता को दर्शाता है; ‘दाऊद को’ इसका सीधा अनुवाद है।
- source_word: וְהִיא נִתְּנָה
  choice: तो उसे ... दे दिया गया
  rationale: हिब्रू के कर्मवाच्य और मेरब पर दिए गए बल को बनाए रखते हुए हिन्दी में अप्रत्याशित परिणाम स्पष्ट किया गया है।
- source_word: לְעַדְרִיאֵל הַמְּחֹלָתִי
  choice: महोलावासी अद्रीएल को
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण किया गया है और जातिवाचक/स्थान-संबंधी विशेषण को सहज हिन्दी ‘महोलावासी’ से व्यक्त किया गया है।
- source_word: לְאִשָּׁה
  choice: पत्नी के रूप में
  rationale: यह हिब्रू विवाह-संबंधी मुहावरे का स्पष्ट और अर्थनिष्ठ हिन्दी रूप है।
