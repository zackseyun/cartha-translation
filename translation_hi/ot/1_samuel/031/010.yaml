base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/010.yaml
  text: They put his armor in the house of the Ashtaroths[c][b][a], and they fastened his body to the wall of Beth-shan.
translation:
  language: hi
  text: उन्होंने उसका युद्ध-साज[a] अश्तारोत के मंदिर[b] में रख दिया, और उसके शव को बेत-शान की नगर-दीवार पर जड़ दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके हथियार” या “उसका कवच”; हिब्रू शब्द का अर्थ अधिक व्यापक रूप से सैन्य उपकरण या युद्ध-सामान भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “अश्तारोत का घर।” यहाँ “घर” से आशय मंदिर या देवस्थान है।
    reason: lexical_alternative
  - marker: c
    text: या “उसके शव को बेत-शान की नगर-दीवार पर ठोंक दिया।” हिब्रू क्रिया का अर्थ ठोकना, गाड़ना या मजबूती से लगाना हो सकता है; शव को किस ठीक तरीके से प्रदर्शित किया गया था, यह स्पष्ट नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: उन्होंने ... रख दिए
  rationale: שׂוּם का सामान्य अर्थ ‘रखना/स्थापित करना’ है; यहाँ वस्तुओं को मंदिर में रखने के लिए यह स्वाभाविक हिन्दी है।
- source_word: כֵּלָיו
  choice: उसके हथियार
  rationale: כְּלִי का अर्थ व्यापक रूप से सामान या युद्ध-साज हो सकता है। प्रसंग में शाऊल से उतारे गए युद्ध-सामान के लिए ‘हथियार’ सहज है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית עַשְׁתָּרוֹת
  choice: अश्तारोत के मंदिर
  rationale: בֵּית का शाब्दिक अर्थ ‘घर’ है, पर देवता के नाम के साथ इस उपासना-संबंधी प्रसंग में ‘मंदिर’ अभिप्रेत है। עַשְׁתָּרוֹת के हिब्रू रूप को ‘अश्तारोत’ के रूप में लिप्यंतरित किया गया है।
- source_word: גְּוִיָּתוֹ
  choice: उसके शव
  rationale: यह संज्ञा शरीर, विशेषकर मृत शरीर, को दर्शाती है। प्रसंग में मृत्यु स्पष्ट है, इसलिए ‘शव’ संक्षिप्त और सटीक है।
- source_word: תָּקְעוּ
  choice: जड़ दिया
  rationale: תקע में ठोकने, गाड़ने या मजबूती से लगाने का भाव है। ‘जड़ दिया’ प्रदर्शन के लिए शव को दीवार पर लगाने का परिणाम बताता है, पर उसकी ठीक विधि निश्चित नहीं करता।
- source_word: בְּחוֹמַת
  choice: शहरपनाह पर
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है। ‘शहरपनाह’ आधुनिक हिन्दी में समझ आने वाला गरिमापूर्ण पद है और साधारण भवन की दीवार से भेद स्पष्ट करता है।
- source_word: בֵּית שָׁן
  choice: बेत-शान
  rationale: स्थान-नाम का हिब्रू उच्चारण-सन्निकट देवनागरी लिप्यंतरण किया गया है।
