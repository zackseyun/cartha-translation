  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘मंदिर’ उपासना-संबंधी संदर्भ को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि उसका शाब्दिक रूप पादटिप्पणी में दिया गया है। क्रिया ‘जड़ दिया’ मूल की कठोरता को बनाए रखते हुए प्रदर्शन की विधि को अनावश्यक रूप से निश्चित नहीं करती।
