source:
  edition: WLC
  text: וַ/תִּכְבַּ֤ד הַ/מִּלְחָמָה֙ אֶל שָׁא֔וּל וַ/יִּמְצָאֻ֥/הוּ הַ/מּוֹרִ֖ים אֲנָשִׁ֣ים בַּ/קָּ֑שֶׁת וַ/יָּ֥חֶל מְאֹ֖ד מֵ/הַ/מּוֹרִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/003.yaml
  text: And the battle grew heavy against Saul[a], and the archers found him[b], and he was greatly wounded by the archers.
translation:
  language: hi
  text: युद्ध शाऊल पर भारी पड़ने लगा, और धनुर्धारियों ने उसे पा लिया[a]। धनुर्धारियों के कारण वह बुरी तरह घायल हो गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तीर चलानेवाले—धनुषवाले पुरुष—उसे पा गए।”
    reason: मूल इब्रानी की विस्तृत समानाधिकरण रचना को दर्ज करना।
  - marker: b
    text: या “धनुर्धारियों के कारण वह बहुत व्याकुल हो उठा।” इब्रानी क्रिया कठिन है और घोर पीड़ा, काँपने या व्याकुलता का भाव भी दे सकती है; यह आवश्यक नहीं कि वह स्पष्ट रूप से शारीरिक घाव ही बताए।
    reason: महत्त्वपूर्ण शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַתִּכְבַּד הַמִּלְחָמָה אֶל שָׁאוּל
  choice: युद्ध शाऊल पर भारी पड़ने लगा
  rationale: यह अनुवाद ‘भारी होना’ के मूल इब्रानी बिंब को बनाए रखते हुए युद्ध के शाऊल के विरुद्ध तीव्र हो जाने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּמְצָאֻהוּ
  choice: उसे पा लिया
  rationale: मूल क्रिया का सामान्य अर्थ ‘पाना/खोज लेना’ है। युद्ध के प्रसंग में इसका आशय धनुर्धारियों का शाऊल तक पहुँच जाना है; ‘पा लिया’ मूल अभिव्यक्ति के निकट और हिन्दी में सहज है।
- source_word: הַמּוֹרִים אֲנָשִׁים בַּקָּשֶׁת
  choice: धनुर्धारियों
  rationale: इब्रानी में ‘तीर चलानेवाले, धनुषवाले पुरुष’ समानाधिकरण द्वारा स्पष्ट किया गया है। हिन्दी में ‘धनुर्धारी’ दोनों तत्वों को संक्षेप और स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיָּחֶל מְאֹד
  choice: वह बुरी तरह घायल हो गया
  rationale: प्रसंग और 1 इतिहास 10:3 का समानांतर वर्णन शारीरिक चोट के अर्थ का समर्थन करते हैं। फिर भी इब्रानी क्रिया कठिन है और घोर पीड़ा, व्याकुलता या काँपने का भाव भी दे सकती है; इसलिए यह अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: מֵהַמּוֹרִים
  choice: धनुर्धारियों के कारण
  rationale: पूर्वसर्ग स्रोत, कारण या कर्ता का भाव दे सकता है। ‘के कारण’ शारीरिक चोट और मानसिक व्याकुलता—दोनों सम्भव अर्थों के लिए उपयुक्त है और मूल की अस्पष्टता को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: शाऊल की दशा शारीरिक घाव थी या घोर व्याकुलता
  choice: मुख्य पाठ में ‘बुरी तरह घायल हो गया’
  alternative: ‘धनुर्धारियों के कारण बहुत व्याकुल हो उठा’ या ‘बहुत काँप उठा’
  rationale: निकटवर्ती युद्ध-प्रसंग शारीरिक घाव की ओर संकेत करता है, पर कठिन इब्रानी क्रिया अन्य अर्थों की अनुमति देती है। किसी धर्मवैज्ञानिक निष्कर्ष को थोपे बिना विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘भारी पड़ने लगा’ मूल इब्रानी बिंब और स्वाभाविक हिन्दी मुहावरे—दोनों को बनाए रखता है।
