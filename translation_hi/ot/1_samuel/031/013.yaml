  yaml_path: translation/ot/1_samuel/031/013.yaml
  text: They took their bones and buried them under the tamarisk tree in Jabesh[b][a], and they fasted seven days.
translation:
  language: hi
  text: उन्होंने उनकी हड्डियाँ लेकर उन्हें याबेश[a] में झाऊ के पेड़[b] के नीचे दफना दिया, और सात दिन तक उपवास किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘याबेश’ पिछले संदर्भ में आए ‘याबेश-गिलाद’ का संक्षिप्त नाम है।
    reason: cross_reference
  - marker: b
    text: इब्रानी में पेड़ की जाति का विशेष नाम है; इसका अनुवाद ‘टैमरिस्क’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַצְמֹתֵיהֶם
  choice: उनकी हड्डियाँ
  rationale: עֶצֶם का ठोस और सीधा अर्थ ‘हड्डी’ है; पद 12 में शव जलाए जाने के बाद यहाँ सामान्य ‘अवशेष’ के बजाय यही अर्थ उपयुक्त है।
- source_word: וַיִּקְבְּרוּ
  choice: दफना दिया
  rationale: קבר दफनाने के लिए प्रयुक्त सामान्य क्रिया है; यह आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: תַחַת
  choice: के नीचे
  rationale: תַחַת का सामान्य स्थानवाचक अर्थ ‘नीचे’ है।
- source_word: הָאֶשֶׁל
  choice: झाऊ के पेड़
  rationale: אֶשֶׁל एक विशिष्ट वृक्ष, अर्थात् टैमरिस्क/झाऊ, को सूचित करता है; ‘पेड़’ जोड़ने से सामान्य पाठक के लिए आशय स्पष्ट होता है।
- source_word: בְּיָבֵשָׁה
  choice: याबेश में
  rationale: यह स्थाननाम याबेश है और निकटवर्ती संदर्भ में याबेश-गिलाद का संक्षिप्त उल्लेख है; בְּ का स्वाभाविक स्थानवाचक अनुवाद ‘में’ है।
- source_word: וַיָּצֻמוּ
  choice: उपवास किया
  rationale: צום का सीधा अर्थ ‘उपवास करना’ है; सरल क्रियात्मक रूप इब्रानी कथन-क्रम के अनुरूप है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अवधि सात दिनों की है; हिन्दी में ‘तक’ अवधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּקְחוּ
  choice: उन्होंने … लेकर
  rationale: לקח का अर्थ ‘लेना’ है; संयुक्त हिन्दी वाक्य में ‘लेकर’ कथात्मक क्रियाओं के क्रम को सहज रूप से बनाए रखता है।
