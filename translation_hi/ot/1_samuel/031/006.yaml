  yaml_path: translation/ot/1_samuel/031/006.yaml
  text: So Saul died[a], and his three sons, and his armor-bearer, and all his men[b], together on that day.
translation:
  language: hi
  text: इस प्रकार शाऊल मर गया, और उसके तीन बेटे, उसका हथियार-बढ़ानेवाला, और उसके सभी आदमी भी उस दिन एक साथ मर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּמָת
  choice: इस प्रकार ... मर गए
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है और पिछले वर्णन का परिणाम प्रस्तुत करता है। हिन्दी में संयुक्त कर्ताओं के कारण क्रिया का बहुवचन स्वाभाविक है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: हिन्दी बाइबल परंपरा में प्रचलित नामरूप।
- source_word: וּשְׁלֹשֶׁת בָּנָיו
  choice: उसके तीनों बेटे
  rationale: मूल के ‘उसके तीन बेटे’ का सहज हिन्दी रूप; ‘तीनों’ इन तीनों को समष्टि के रूप में व्यक्त करता है।
- source_word: וְנֹשֵׂא כֵלָיו
  choice: उसका हथियार ढोनेवाला
  rationale: शाब्दिक अर्थ ‘उसके हथियारों/साज-सामान को उठानेवाला’ है। यह रूप सैनिक भूमिका को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: גַּם
  choice: और ... वे सब
  rationale: सूची की अंतिम इकाई को जोड़ने और समूचे समूह पर बल देने का भाव हिन्दी में संयोजन तथा ‘वे सब’ से व्यक्त किया गया है।
- source_word: כָּל אֲנָשָׁיו
  choice: उसके सभी आदमी
  rationale: मूल का व्यापक किंतु संदर्भतः सैनिक अर्थ वाला पद सुरक्षित रखा गया है; ‘सैनिक’ अधिक व्याख्यात्मक होता।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: समय-सूचक इब्रानी पद का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: יַחְדָּו
  choice: एक साथ
  rationale: यह बताता है कि ये सभी उसी दिन साथ-साथ मरे।
