revisions:
- from: इस प्रकार शाऊल, उसके तीनों बेटे, उसका हथियार ढोनेवाला और उसके सभी आदमी[a][b]—वे सब उस दिन एक साथ मर गए।
  to: इस प्रकार शाऊल मर गया, और उसके तीन बेटे, उसका हथियार-बढ़ानेवाला, और उसके सभी आदमी भी उस दिन एक साथ मर गए।
  rationale: 'The revision preserves the Hebrew syntactic progression by stating first that Saul died and then that the others died, retains גַּם with ‘भी,’ removes the redundant collective resumption, and uses a more natural role term. Footnote anchors remain on ‘उसके सभी आदमी’: a marks the lexical alternative and b the textual variant.'
