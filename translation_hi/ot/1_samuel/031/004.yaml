base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/004.yaml
  text: Then Saul said to his armor-bearer[a], “Draw your sword and thrust me through with it, lest these uncircumcised men come and thrust me through and mistreat me.” But his armor-bearer was not willing, because he was very afraid. So Saul took the sword and fell on it.
translation:
  language: hi
  text: तब शाऊल ने अपने हथियार उठानेवाले से कहा, “अपनी तलवार खींचकर मुझे उससे भेद दे, कहीं ऐसा न हो कि ये खतनारहित लोग आकर मुझे भेदें और मेरे साथ दुर्व्यवहार करें।”[a] लेकिन उसका हथियार उठानेवाला राज़ी न हुआ, क्योंकि वह बहुत डर गया था। तब शाऊल ने तलवार ली और उस पर गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरा तमाशा बनाएँ,” “मेरे साथ अपमानजनक व्यवहार करें,” अथवा “मुझे लज्जित करें।”
    reason: התעלל अपमानपूर्ण दुर्व्यवहार, किसी का तमाशा बनाने, या लज्जित करने का भाव दे सकता है; मूल उसके सटीक रूप को स्पष्ट नहीं करता।
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: उसका हथियार ढोनेवाला
  rationale: यह राजकीय योद्धा के हथियार और सैन्य-सामग्री उठानेवाले सेवक का पदसूचक वाक्यांश है। यह हिन्दी में अर्थ स्पष्ट रखता है और ‘शस्त्रवाहक’ की अपेक्षा सामान्य पाठक के लिए अधिक सहज है।
- source_word: שְׁלֹף חַרְבְּךָ
  choice: अपनी तलवार खींच
  rationale: आज्ञार्थक क्रिया का आशय म्यान से तलवार निकालना है; ‘तलवार खींच’ स्वाभाविक सैन्य अभिव्यक्ति है।
- source_word: וְדָקְרֵנִי בָהּ / וּדְקָרֻנִי
  choice: उससे मुझे आर-पार कर दे / मुझे आर-पार कर दें
  rationale: דקר हथियार से भेदने को दर्शाता है। दोनों occurrences में समान अभिव्यक्ति रखकर मूल की पुनरावृत्ति और घातक आशय सुरक्षित रखा गया है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह आशंकित परिणाम को प्रस्तुत करता है और आधुनिक हिन्दी में चेतावनी अथवा भय का स्वाभाविक ढंग है।
- source_word: הָעֲרֵלִים הָאֵלֶּה
  choice: ये खतनारहित लोग
  rationale: मूल का अपमानसूचक और वाचा-संबंधी वर्णन सीधे रखा गया है; संदर्भगत ‘पलिश्ती’ जोड़कर अर्थ को सीमित नहीं किया गया।
- source_word: וְהִתְעַלְּלוּ בִי
  choice: मेरे साथ अपमानजनक व्यवहार करें
  rationale: यह अनादरपूर्ण, क्रूर या खिलवाड़-जैसे दुर्व्यवहार को सूचित कर सकता है। चुनी हुई अभिव्यक्ति गंभीरता बनाए रखते हुए उसके सटीक रूप को अनिर्धारित छोड़ती है।
- source_word: וְלֹא אָבָה
  choice: इसके लिए तैयार नहीं हुआ
  rationale: यह सेवक की अनिच्छा अथवा इनकार व्यक्त करता है; हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: כִּי יָרֵא מְאֹד
  choice: क्योंकि वह बहुत डर गया था
  rationale: कारण और מְאֹד की तीव्रता दोनों सीधे व्यक्त होते हैं।
- source_word: וַיִּפֹּל עָלֶיהָ
  choice: उस पर गिर पड़ा
  rationale: मूलतः ‘उसके ऊपर गिरा’ का निकट और हिन्दी में सुबोध रूप है; आत्महत्या की क्रिया को अनावश्यक विस्तार देकर नहीं बताया गया।
theological_decisions:
- issue: शाऊल को जिस दुर्व्यवहार का भय था, उसकी प्रकृति
  choice: मेरे साथ अपमानजनक व्यवहार करें
  alternative: मेरा उपहास करें; मेरे साथ दुर्व्यवहार करें; मुझे यातना दें
  rationale: התעלל यहाँ अपमान, क्रूर दुर्व्यवहार या किसी को तमाशा बनाने का भाव दे सकता है, पर घटना का ठीक स्वरूप निर्दिष्ट नहीं करता। इसलिए अनुवाद न तो केवल उपहास तक सीमित करता है, न यातना या यौन हिंसा जैसी विशिष्टता जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सामान्य-पाठक-सुलभ रूप अपनाया गया है। सैन्य प्रसंग के लिए ‘तलवार खींच’ और ‘आर-पार कर दे’ जैसे स्वाभाविक पद रखे गए हैं। फुटनोट चिह्न संबंधित अस्पष्ट वाक्यांश के तुरंत बाद रखा गया है।
