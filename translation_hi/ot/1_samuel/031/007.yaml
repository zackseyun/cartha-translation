  text: וַ/יִּרְא֣וּ אַנְשֵֽׁי יִ֠שְׂרָאֵל אֲשֶׁר בְּ/עֵ֨בֶר הָ/עֵ֜מֶק וַ/אֲשֶׁ֣ר בְּ/עֵ֣בֶר הַ/יַּרְדֵּ֗ן כִּֽי נָ֨סוּ֙ אַנְשֵׁ֣י יִשְׂרָאֵ֔ל וְ/כִי מֵ֖תוּ שָׁא֣וּל וּ/בָנָ֑י/ו וַ/יַּעַזְב֤וּ אֶת הֶֽ/עָרִים֙ וַ/יָּנֻ֔סוּ וַ/יָּבֹ֣אוּ פְלִשְׁתִּ֔ים וַ/יֵּֽשְׁב֖וּ בָּ/הֶֽן־־׀־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/007.yaml
  text: When the men of Israel who were on the other side of the valley[a], and those on the other side of the Jordan, saw that the men of Israel had fled and that Saul and his sons were dead, they abandoned the cities and fled[b]; and the Philistines came and lived in them.
translation:
  language: hi
  text: जब घाटी के उस पार और यरदन के उस पार के इस्राएली पुरुषों ने देखा कि इस्राएली पुरुष भाग गए थे और शाऊल तथा उसके बेटे मर गए थे, तब वे नगरों को छोड़कर भाग गए। फिर पलिश्ती आए और उनमें बस गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּרְאוּ
  choice: देखा
  rationale: ראה का मूल अर्थ ‘देखना’ है; यहाँ प्रत्यक्ष घटनाओं से हुई जानकारी को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: इस्राएली पुरुष
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुरुष’ है। सैन्य और क्षेत्रीय संदर्भ में स्वाभाविक आधुनिक हिन्दी के लिए ‘इस्राएली पुरुष’ चुना गया।
- source_word: בְּעֵבֶר הָעֵמֶק
  choice: घाटी के पार रहनेवाले
  rationale: עֵבֶר दूसरी ओर या पार के भूभाग को सूचित करता है। ‘घाटी के पार’ स्थानिक अर्थ को स्पष्ट रखता है; ‘रहनेवाले’ हिन्दी में अधूरे स्थानवाचक वाक्यांश को स्वाभाविक बनाता है।
- source_word: בְּעֵבֶר הַיַּרְדֵּן
  choice: यरदन के पार रहनेवालों
  rationale: मूल में वही स्थानवाचक अभिव्यक्ति दोहराई गई है। ‘के पार’ उस समानता और भौगोलिक अर्थ को बनाए रखता है।
- source_word: כִּי נָסוּ
  choice: कि ... भाग गए हैं
  rationale: यह उन्होंने जो देखा, उसकी विषयवस्तु बताता है। हिन्दी का पूर्ण भूत वर्तमान परिणाम और उनके देखने से पहले पूरी हुई क्रिया दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֵתוּ
  choice: मर गए हैं
  rationale: מות मृत्यु को बताता है, मृत्यु की रीति को नहीं; इसलिए ‘मारे गए’ जोड़ना उचित नहीं।
- source_word: וּבָנָיו
  choice: तथा उसके बेटे
  rationale: सरल समन्वय को बनाए रखता है और शाऊल के साथ उसके बेटों की मृत्यु भी स्पष्ट करता है।
- source_word: וַיַּעַזְבוּ אֶת־הֶעָרִים
  choice: वे नगरों को छोड़कर
  rationale: עזב का अर्थ पीछे छोड़ना या त्याग देना है। ‘नगरों को छोड़कर’ आगामी ‘भाग गए’ के साथ सहज और तात्कालिक पलायन के अनुकूल है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוס का सामान्य अर्थ भागना है; यह संक्षिप्त और कथात्मक हिन्दी है।
- source_word: וַיָּבֹאוּ פְלִשְׁתִּים
  choice: फिर पलिश्ती आए
  rationale: בוא का सामान्य अर्थ आना या प्रवेश करना है। अगले खंड में नगरों में बसना स्पष्ट होने के कारण ‘आए’ पर्याप्त है।
- source_word: וַיֵּשְׁבוּ בָּהֶן
  choice: उनमें बस गए
  rationale: ישב बैठने, रहने या बसने का अर्थ दे सकता है। खाली नगरों पर अधिकार कर निवास करने के संदर्भ में ‘बस गए’ सर्वाधिक स्वाभाविक है।
