  text: When his armor-bearer saw that Saul was dead[a], he too fell on his sword and died with him.
translation:
  language: hi
  text: जब उसके हथियार ढोनेवाले ने देखा कि शाऊल मर चुका था[a], तो वह भी अपनी तलवार पर गिर पड़ा और उसके साथ मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मरा हुआ था।” इब्रानी में इसे शाऊल की मृत अवस्था के वर्णन या उसकी मृत्यु पूरी हो चुकी होने के रूप में समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹשֵׂא כֵלָיו
  choice: उसके हथियार ढोनेवाले
  rationale: यह पद शाऊल के हथियार या सैनिक साज-सामान उठानेवाले सेवक को दर्शाता है। यह अनुवाद भूमिका को स्पष्ट और सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात का परिचय देता है जिसे हथियार ढोनेवाले ने देखा।
- source_word: מֵת
  choice: मर चुका था
  rationale: यह रूप शाऊल की मृत्यु को हथियार ढोनेवाले की अगली कार्रवाई से पहले पूर्ण हुई घटना के रूप में स्वाभाविक हिन्दी में व्यक्त करता है; ‘मरा हुआ था’ भी सम्भव है।
- source_word: גַּם הוּא
  choice: वह भी
  rationale: यह शाऊल के समान हथियार ढोनेवाले की कार्रवाई पर योगात्मक बल को बनाए रखता है।
- source_word: עַל חַרְבּוֹ
  choice: अपनी तलवार पर
  rationale: यह इब्रानी पूर्वसर्ग और आत्महत्या की वर्णित क्रिया को सीधे तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: וַיָּמָת עִמּוֹ
  choice: और उसके साथ मर गया
  rationale: यह साथ हुई मृत्यु को व्यक्त करता है और अनावश्यक स्थानिक अर्थ नहीं जोड़ता।
- source_word: וַיַּרְא
  choice: जब ... ने देखा
  rationale: ‘जब’ निरीक्षण और उसके परिणामस्वरूप हुई अगली कार्रवाई के कालिक संबंध को स्वाभाविक हिन्दी कथा-प्रवाह में प्रकट करता है।
