base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/012.yaml
  text: Then all the valiant men arose and went all night[a], and they took the body of Saul and the bodies of his sons from the wall of Beth-shan[b], and they came to Jabesh and burned them there.
translation:
  language: hi
  text: तब सभी वीर पुरुष उठे और रात भर यात्रा की। उन्होंने बेत-शान की शहरपनाह से शाऊल का शव[a] और उसके पुत्रों के शव ले लिए। फिर वे याबेश[b] आए और वहाँ उन्हें जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मृत देह’ और ‘मृत देहें।’ इब्रानी शब्द विशेष रूप से मृत शरीरों को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘याबेश’ से आशय व्यापक प्रसंग में याबेश-गिलाद है।
    reason: cross_reference
lexical_decisions:
- source_word: כָּל אִישׁ חַיִל
  choice: सभी वीर पुरुष
  rationale: यह इब्रानी मुहावरा इस सैनिक प्रसंग में साहसी और युद्ध-सक्षम पुरुषों को दर्शाता है; अनुवाद स्रोत की पुरुषवाचक विशिष्टता बनाए रखता है।
- source_word: וַיָּק֜וּמוּ
  choice: उठे
  rationale: क्रिया का सीधा अर्थ ‘उठना’ है और यह कथानक की क्रमिक गति को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַיֵּלְכ֣וּ כָל הַלַּיְלָה
  choice: रात भर चलते रहे
  rationale: यह पूरी रात निरंतर यात्रा करने का भाव देता है, बिना यात्रा के साधन को अनावश्यक रूप से निश्चित किए।
- source_word: גְּוִיַּת ... גְּוִיֹּת
  choice: शव ... शवों
  rationale: גְּוִיָּה विशेष रूप से मृत देह को दर्शाता है; ‘शव’ आधुनिक हिन्दी में सटीक, गरिमापूर्ण और स्पष्ट है।
- source_word: מֵחוֹמַת
  choice: शहरपनाह से उतारे
  rationale: חוֹמָה नगर की रक्षात्मक दीवार है। प्रसंगानुसार शव दीवार पर लटकाए गए थे, इसलिए ‘से उतारे’ हिन्दी में क्रिया की दिशा को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: בֵּית שָׁן
  choice: बेत-शान
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण रखा गया है।
- source_word: יָבֵשָׁה
  choice: याबेश आए
  rationale: दिशासूचक प्रत्यय याबेश की ओर गति बताता है; मुख्य पाठ इब्रानी की तरह संक्षिप्त नाम ही रखता है।
- source_word: וַיִּשְׂרְפ֥וּ אֹתָ֖ם שָׁם
  choice: वहाँ उन शवों को जला दिया
  rationale: क्रिया का सीधा अर्थ ‘जलाना’ है। सर्वनाम का संकेत स्पष्ट करने के लिए हिन्दी में ‘उन शवों को’ कहा गया है, पर दाह-संस्कार जैसी अतिरिक्त व्याख्या नहीं जोड़ी गई।
theological_decisions:
- issue: उद्धार-दल के लिए पुरुषवाचक सामूहिक पद का अनुवाद
  choice: सभी वीर पुरुष
  alternative: सभी वीर लोग; सभी वीर योद्धा
  rationale: इब्रानी में पुरुषवाचक रूप है और सैनिक प्रसंग पुरुष योद्धाओं की ओर संकेत करता है; लिंग-निरपेक्ष अनुवाद स्रोत की विशिष्टता को धुंधला कर देता।
- issue: शवों को जलाने की क्रिया का स्वरूप
  choice: जला दिया
  alternative: उनका दाह-संस्कार किया
  rationale: मूल पाठ केवल जलाने की बात कहता है; इसे औपचारिक दाह-संस्कार कहना धार्मिक या रीति-संबंधी आशय को आवश्यकता से अधिक निश्चित कर देगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘शहरपनाह’ नगर की किलेबंद दीवार के लिए सटीक शब्द है; ‘शव’ मृत देह के अर्थ को स्पष्ट रखता है। वाक्यों को हिन्दी की स्वाभाविक पठनीयता के लिए विभाजित किया गया है।
