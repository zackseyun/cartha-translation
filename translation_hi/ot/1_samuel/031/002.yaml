  yaml_path: translation/ot/1_samuel/031/002.yaml
  text: The Philistines overtook Saul and his sons[a], and the Philistines struck down Jonathan, Abinadab, and Malchi-shua[b], the sons of Saul.
translation:
  language: hi
  text: पलिश्तियों ने शाऊल और उसके बेटों को जा पकड़ा[a], और उन्होंने शाऊल के बेटों योनातान, अबीनादाब और मल्कीशूअ को मार गिराया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शाऊल और उसके बेटों तक जा पहुँचे” अथवा “शाऊल और उसके बेटों का बहुत निकट से पीछा किया।” इब्रानी क्रिया ऐसे निकट पीछा करने का भाव देती है जो लक्ष्य तक पहुँच जाता है।
    reason: lexical_alternative
  - marker: b
    text: या “योनातान, अबीनादाब और मल्कीशूअ को मार डाला।” इब्रानी क्रिया का मूल अर्थ “प्रहार करना” है, पर युद्ध के इस प्रसंग में उससे सम्भवतः उनकी मृत्यु अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּדְבְּקוּ
