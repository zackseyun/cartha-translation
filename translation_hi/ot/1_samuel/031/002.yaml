  rationale: इस प्राचीन जाति के लिए हिन्दी बाइबलीय प्रयोग में प्रचलित नाम।
- source_word: אֶת שָׁאוּל וְאֶת בָּנָיו
  choice: शाऊल और उसके बेटों को
