  rationale: דבק यहाँ युद्ध में निकट पीछा करते हुए लक्ष्य तक पहुँच जाने का भाव देता है। ‘जा पकड़ा’ आधुनिक हिन्दी में पीछा करके पकड़ लेने का परिणाम स्वाभाविक रूप से व्यक्त करता है।
