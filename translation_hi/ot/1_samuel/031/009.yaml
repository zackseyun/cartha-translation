  text: וַֽ/יִּכְרְתוּ֙ אֶת רֹאשׁ֔/וֹ וַ/יַּפְשִׁ֖יטוּ אֶת כֵּלָ֑י/ו וַ/יְשַׁלְּח֨וּ בְ/אֶֽרֶץ פְּלִשְׁתִּ֜ים סָבִ֗יב לְ/בַשֵּׂ֛ר בֵּ֥ית עֲצַבֵּי/הֶ֖ם וְ/אֶת הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/009.yaml
  text: They cut off his head and stripped off his armor[a], and sent messengers throughout the land of the Philistines all around[b], to proclaim the good news to the house of their idols and to the people.
translation:
  language: hi
  text: उन्होंने उसका सिर काट दिया और उसकी युद्ध-सामग्री उतार ली। फिर उन्होंने पलिश्तियों के पूरे देश में चारों ओर दूत भेजे, ताकि वे उनकी देवमूर्तियों के भवन और लोगों को यह शुभ समाचार सुनाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּכְרְתוּ אֶת־רֹאשׁוֹ
  choice: उन्होंने उसका सिर काट दिया
  rationale: रֹאשׁוֹ के साथ כרת का अर्थ सिर को धड़ से अलग करना है; आधुनिक हिन्दी में ‘सिर काट दिया’ स्वाभाविक और सटीक है।
- source_word: וַיַּפְשִׁיטוּ אֶת־כֵּלָיו
  choice: उसके हथियार उतार लिए
  rationale: כֵּלִים का अर्थ हथियार, कवच या व्यापक युद्ध-सामग्री हो सकता है। युद्ध के संदर्भ में ‘हथियार’ सहज है, जबकि पादटिप्पणी व्यापक अर्थ सुरक्षित रखती है।
- source_word: וַיְשַׁלְּחוּ
  choice: दूत भेजे
  rationale: मूल क्रिया केवल ‘भेजा’ कहती है और उसका कर्म व्यक्त नहीं करती। अगले उद्देश्यवाचक खंड में समाचार सुनाने का उल्लेख होने के कारण दूत भेजना संदर्भानुकूल निहितार्थ है; इस पूर्ति को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: בְאֶרֶץ פְּלִשְׁתִּים סָבִיב
  choice: पलिश्तियों के सारे देश में चारों ओर
  rationale: यह अनुवाद בְאֶרֶץ की क्षेत्रगत भावना और סָבִיב की व्यापक, चारों ओर की वितरणात्मक भावना दोनों व्यक्त करता है।
- source_word: לְבַשֵּׂר
  choice: यह शुभ समाचार सुनाया जाए
  rationale: בשר यहाँ विजय के सुखद समाचार की घोषणा करना है—पलिश्तियों के दृष्टिकोण से ‘शुभ समाचार’; अनुवाद उनकी नैतिक या धार्मिक दृष्टि का अनुमोदन नहीं करता।
- source_word: בֵּית עֲצַבֵּיהֶם
  choice: उनकी देवमूर्तियों के भवन में
  rationale: בֵּית का मूल अर्थ ‘भवन/घर’ है, पर उपासना-संदर्भ में मंदिर भी हो सकता है। עֲצַבִּים को ‘देवमूर्तियाँ’ कहना आधुनिक हिन्दी में स्पष्ट है और उन देवताओं की वास्तविकता स्वीकार नहीं करता।
- source_word: וְאֶת־הָעָם
  choice: और लोगों को
  rationale: אֵת से ‘लोग’ घोषणा के दूसरे लक्ष्य के रूप में आते हैं। हिन्दी में ‘लोगों को समाचार सुनाया जाए’ इस संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पलिश्ती उपासना-स्थल और पूजित प्रतिमाओं का वर्णन
  choice: देवमूर्तियों के भवन
  alternative: देवमूर्तियों के मंदिर
  rationale: यह चयन בֵּית का शाब्दिक रूप बनाए रखता है और עֲצַבִּים को वास्तविक देवताओं की स्वीकृति दिए बिना व्यक्त करता है; ‘मंदिर’ संदर्भतः सम्भव है और पादटिप्पणी में दिया गया है।
- issue: בשר को ‘शुभ समाचार’ कहना
  choice: शुभ समाचार
  alternative: समाचार
  rationale: यह विजय-संदेश पलिश्तियों के लिए आनंद का समाचार था। ‘शुभ’ कथावाचक की धार्मिक स्वीकृति नहीं, बल्कि समाचार पाने वालों की दृष्टि व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पलिश्ती’, ‘देवमूर्ति’ और ‘शुभ समाचार’ सामान्य हिन्दी पाठक के लिए स्पष्ट हैं। हिंसक क्रिया को मूल के अनुरूप सीधे कहा गया है, पर अनावश्यक विस्तार नहीं जोड़ा गया।
