source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֖ים נִלְחָמִ֣ים בְּ/יִשְׂרָאֵ֑ל וַ/יָּנֻ֜סוּ אַנְשֵׁ֤י יִשְׂרָאֵל֙ מִ/פְּנֵ֣י פְלִשְׁתִּ֔ים וַ/יִּפְּל֥וּ חֲלָלִ֖ים בְּ/הַ֥ר הַ/גִּלְבֹּֽעַ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/031/001.yaml
  text: The Philistines were fighting against Israel[a], and the men of Israel fled from before the Philistines and fell slain on Mount Gilboa.
translation:
  language: hi
  text: पलिश्ती इस्राएल से युद्ध कर रहे थे, और इस्राएल के पुरुष पलिश्तियों के सामने से[a] भाग गए और गिलबोआ पर्वत पर मारे गए और गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पलिश्तियों के सामने से।”
    reason: इब्रानी מִפְּנֵי के स्थानिक मुहावरे का अधिक शाब्दिक विकल्प स्पष्ट करता है।
lexical_decisions:
- source_word: וּ/פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: लोगों के इस समूह के नाम का प्रचलित हिन्दी रूप; आरम्भिक וּ को अगले संयुक्त वाक्य में ‘और’ से व्यक्त किया गया है, बिना कोई अनावश्यक कालसूचक शब्द जोड़े।
- source_word: נִלְחָמִים בְּ/יִשְׂרָאֵל
  choice: इस्राएल से युद्ध कर रहे थे
  rationale: कृदन्त रूप जारी या पृष्ठभूमिगत युद्ध को दर्शाता है; ‘युद्ध कर रहे थे’ इस पक्ष को बनाए रखता है। इस क्रिया के साथ בְּ विरोधी संबंध व्यक्त करता है।
- source_word: וַ/יָּנֻסוּ
  choice: भाग गए
  rationale: सैनिक पराजय के प्रसंग में נוּס का स्वाभाविक आधुनिक हिन्दी अर्थ, जिसमें युद्धभूमि से पलायन का भाव स्पष्ट है।
- source_word: אַנְשֵׁי יִשְׂרָאֵל
  choice: इस्राएल के पुरुष
  rationale: אַנְשֵׁי के स्पष्ट पुल्लिंग अर्थ को बनाए रखता है और केवल सामान्य ‘इस्राएली’ कहकर उसे निष्प्रभ नहीं करता।
- source_word: מִ/פְּנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सामने से
  rationale: इब्रानी मुहावरे के स्थानिक चित्र को बनाए रखते हुए हिन्दी में शत्रुओं के सामने से पलायन का अर्थ देता है।
- source_word: וַ/יִּפְּלוּ חֲלָלִים
  choice: मारे जाकर गिर पड़े
  rationale: ‘गिरने’ और युद्ध में ‘मारे जाने’ दोनों तत्वों को स्वाभाविक तथा सजीव हिन्दी में सुरक्षित रखता है।
- source_word: בְּ/הַר הַ/גִּלְבֹּעַ
  choice: गिलबोआ पर्वत पर
  rationale: הַר के साथ स्थाननाम का स्वाभाविक हिन्दी रूप और उचित स्थानवाचक परसर्ग।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। युद्ध-वर्णन की संक्षिप्तता और क्रम सुरक्षित हैं; अनावश्यक व्याख्यात्मक विस्तार नहीं जोड़ा गया।
