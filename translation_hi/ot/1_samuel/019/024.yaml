base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/024.yaml
  text: He too stripped off his clothes[a], and he too prophesied before Samuel. He lay naked all that day and all that night. Therefore they say[b], “Is Saul also among the prophets?”
translation:
  language: hi
  text: उसने भी अपने कपड़े उतार दिए और वह भी शमूएल के सामने भविष्यवाणी की। वह उस पूरे दिन और पूरी रात नंगा[a] पड़ा रहा। इसी कारण लोग कहते हैं, “क्या शाऊल भी नबियों में है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नंगा’ का अर्थ पूरी तरह निर्वस्त्र होना भी हो सकता है, या केवल बाहरी वस्त्र उतरे होना; इब्रानी पाठ इससे अधिक स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּפְשַׁט ... בְּגָדָיו
  choice: अपने कपड़े उतार दिए
  rationale: פשט के साथ בגדים का अर्थ कपड़े उतारना है। यह आधुनिक हिन्दी में सहज है और क्रिया के सीधे अर्थ को बनाए रखता है।
- source_word: גַּם הוּא
  choice: उसने भी / वह भी
  rationale: दोहराव शाऊल पर बल देता है कि दूतों की तरह वह स्वयं भी इस अनुभव में आया; हिन्दी में दोनों स्थानों पर ‘भी’ इस बल को सुरक्षित रखता है।
- source_word: וַיִּתְנַבֵּא
  choice: भविष्यवाणी करने लगा
  rationale: यह मानक हिन्दी बाइबलीय अभिव्यक्ति है और भविष्यसूचक गतिविधि के ठीक स्वरूप—वाणी, आवेशपूर्ण व्यवहार, या दोनों—का अनावश्यक निर्णय नहीं करती।
- source_word: לִפְנֵי שְׁמוּאֵל
  choice: शमूएल के सामने
  rationale: לפני यहाँ उपस्थिति का बोध कराता है; ‘के सामने’ स्वाभाविक और सटीक है।
- source_word: וַיִּפֹּל עָרֹם
  choice: नंगा पड़ा रहा
  rationale: נפל का शाब्दिक अर्थ ‘गिरा’ है, पर पूरे दिन और रात की अवधि के कारण हिन्दी में ‘पड़ा रहा’ स्वाभाविक है। עָרֹם को बिना नरम किए ‘नंगा’ अनूदित किया गया है।
- source_word: כָּל הַיּוֹם הַהוּא וְכָל הַלָּיְלָה
  choice: उस पूरे दिन और पूरी रात
  rationale: यह अवधि की सम्पूर्णता और मूल के दोहरे बल को सहज हिन्दी में व्यक्त करता है।
- source_word: עַל כֵּן יֹאמְרוּ
  choice: इसी कारण लोग कहते हैं
  rationale: यह कहावत जैसे प्रश्न की उत्पत्ति बताता है। ‘लोग’ हिन्दी में अनिर्दिष्ट बहुवचन को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִם
  choice: क्या शाऊल भी नबियों में है?
  rationale: यह मूल के प्रश्न और ‘नबियों में’ के सीधे अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: शाऊल की निर्वस्त्र अवस्था (עָרֹם) का अर्थ
  choice: मुख्य पाठ में ‘नंगा’
  alternative: केवल बाहरी वस्त्र उतरे हुए या कुछ हद तक निर्वस्त्र
  rationale: इब्रानी विशेषण सामान्यतः नग्नता बताता है, पर संदर्भ यह स्पष्ट नहीं करता कि नग्नता पूर्ण थी या बाहरी वस्त्र उतरने तक सीमित। मुख्य पाठ स्पष्ट अर्थ रखता है और पादटिप्पणी वास्तविक अस्पष्टता बताती है।
- issue: शाऊल की भविष्यसूचक गतिविधि का स्वरूप
  choice: ‘भविष्यवाणी करने लगा’
  alternative: भविष्यसूचक आवेश में आ गया / नबी जैसा व्यवहार करने लगा
  rationale: पद गतिविधि के सटीक स्वरूप को परिभाषित नहीं करता। मानक क्रिया भविष्यसूचक वाणी, आवेशपूर्ण व्यवहार या दोनों की सम्भावना खुली रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। ‘कपड़े’, ‘नंगा पड़ा रहा’ और ‘लोग कहते हैं’ सामान्य पाठक के लिए सहज हैं; ‘भविष्यवाणी’ और ‘नबी’ स्थापित बाइबलीय शब्दावली हैं। मुख्य पाठ का [a] पादटिप्पणी से मेल खाता है।
