  - severity: low
    issue: The footnote marker follows “कपड़े उतार दिए,” while the footnote explains “नंगा.”
    rationale: The note concerns the scope of Saul's nakedness, not the lexical meaning of removing clothes. Its anchor should immediately follow “नंगा.”
