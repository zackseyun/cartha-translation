  edition: WLC
  text: וַ/יֹּ֨אמֶר שָׁא֜וּל אֶל מִיכַ֗ל לָ֤/מָּה כָּ֨כָה֙ רִמִּיתִ֔/נִי וַ/תְּשַׁלְּחִ֥י אֶת אֹיְבִ֖/י וַ/יִּמָּלֵ֑ט וַ/תֹּ֤אמֶר מִיכַל֙ אֶל שָׁא֔וּל הוּא אָמַ֥ר אֵלַ֛/י שַׁלְּחִ֖/נִי לָ/מָ֥ה אֲמִיתֵֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/017.yaml
  text: Then Saul said to Michal[a], “Why have you deceived me like this and sent away my enemy, so that he escaped?” And Michal said to Saul, “He said to me, ‘Let me go. Why should I kill you?’”
translation:
  language: hi
  text: तब शाऊल ने मीकल से कहा, “तुमने मुझे इस तरह धोखा क्यों दिया और मेरे शत्रु को क्यों विदा कर दिया कि वह बच निकला?” मीकल ने शाऊल से कहा, “उसने मुझसे कहा था, ‘मुझे जाने दो। मैं तुम्हें क्यों मार डालूँ?’”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक व्याख्यात्मक रूप में, “मुझे जाने दो, नहीं तो मैं तुम्हें मार डालूँगा।” इब्रानी में शाब्दिक रूप से है, “मुझे जाने दो। मैं तुम्हें क्यों मार डालूँ?”
    reason: alternative_reading
lexical_decisions:
- source_word: רִמִּיתִנִי
  choice: मुझे ... धोखा दिया
  rationale: यह क्रिया छलपूर्ण व्यवहार को दर्शाती है। ‘धोखा दिया’ आधुनिक हिन्दी में स्वाभाविक है और ‘विश्वासघात’ जैसा अधिक प्रबल अर्थ नहीं जोड़ता।
- source_word: כָּכָה
  choice: इस तरह
  rationale: यह रीति या ढंग को सूचित करता है; ‘इस तरह’ सहज आधुनिक हिन्दी है।
- source_word: וַתְּשַׁלְּחִי
  choice: विदा कर दिया
  rationale: שלח का मूल अर्थ भेजना या विदा करना है। यहाँ मीकल ने दाऊद के निकल जाने में सहायता की; ‘विदा कर दिया’ उस सक्रिय भूमिका को बनाए रखता है और केवल ‘जाने दिया’ से अधिक निकट है।
- source_word: אֹיְבִי
  choice: मेरे शत्रु
  rationale: शाऊल द्वारा दाऊद को ‘मेरा शत्रु’ कहने की शत्रुता और कथात्मक विडंबना को यथावत रखा गया है।
- source_word: וַיִּמָּלֵט
  choice: वह बच निकला
  rationale: מלט के निफ़ाल रूप का अर्थ बच निकलना है। हिन्दी में यह प्रसंगानुकूल और स्वाभाविक है।
- source_word: שַׁלְּחִנִי
  choice: मुझे जाने दो
  rationale: यद्यपि क्रिया का शाब्दिक अर्थ ‘मुझे विदा करो’ है, धमकी के रूप में उद्धृत प्रत्यक्ष वचन में ‘मुझे जाने दो’ अधिक स्वाभाविक हिन्दी है और अर्थ को ठीक रखता है।
- source_word: לָמָה אֲמִיתֵךְ
  choice: मैं तुम्हें क्यों मार डालूँ?
  rationale: इब्रानी का सीधा रूप प्रश्नात्मक है। ‘मार डालूँ’ मृत्यु कारित करने वाले हिफ़ील रूप को स्पष्ट करता है और मूल की अस्पष्ट धमकी को बनाए रखता है।
- source_word: מִיכַל
  choice: मीकल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
theological_decisions:
- issue: मीकल द्वारा दाऊद को आरोपित कथन में निहित धमकी
  choice: 'प्रत्यक्ष प्रश्न के रूप को बनाए रखा: ‘मुझे जाने दो। मैं तुम्हें क्यों मार डालूँ?’'
  alternative: ‘मुझे जाने दो, नहीं तो मैं तुम्हें मार डालूँगा।’
  rationale: इब्रानी में आज्ञा के बाद למה वाला प्रश्न है; उसमें ‘नहीं तो’ स्पष्ट रूप से नहीं है। मुख्य पाठ मूल शब्दों की अस्पष्टता और निहित धमकी दोनों को सुरक्षित रखता है, जबकि अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। शाऊल के आरोप में ‘विदा कर दिया’ सक्रिय क्रिया को बनाए रखता है; मीकल के उद्धृत वचन में प्राकृतिक संवाद के लिए ‘जाने दो’ रखा गया है। पादटिप्पणी-चिह्न [a] संबंधित उद्धरण के तुरंत बाद दिया गया है।
