  text: וַ/יָּבֹ֨אוּ֙ הַ/מַּלְאָכִ֔ים וְ/הִנֵּ֥ה הַ/תְּרָפִ֖ים אֶל הַ/מִּטָּ֑ה וּ/כְבִ֥יר הָ/עִזִּ֖ים מְרַאֲשֹׁתָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/016.yaml
  text: When the messengers came in[a], behold, the teraphim was in the bed[b], with the quilt of goats’ hair at its head.
translation:
  language: hi
  text: जब दूत भीतर आए, तो उन्होंने देखा कि बिछौने पर तराफीम[a] था और उसके सिरहाने बकरी के बालों का बुना हुआ आवरण[b] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तराफीम” घरेलू उपासना में प्रयुक्त किसी मूर्ति या प्रतिमा के लिए हिब्रू शब्द है।
    reason: lexical_alternative
  - marker: b
    text: “बुना हुआ आवरण” के लिए आया हिब्रू शब्द दुर्लभ है। इसका ठीक स्वरूप अनिश्चित है; यहाँ संभवतः बकरी के बालों से बनी कोई ढकने की वस्तु अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּלְאָכִים
  choice: दूत
  rationale: यहाँ शाऊल द्वारा भेजे गए मनुष्य अभिप्रेत हैं। ‘दूत’ मूल शब्द के व्यापक मानवीय अर्थ को संक्षेप और गरिमा के साथ व्यक्त करता है; प्रसंग इसे स्वर्गदूत समझने की संभावना दूर करता है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: हिब्रू कथन में अचानक सामने आए दृश्य और खोज का भाव है। आधुनिक हिन्दी में ‘तो देखा कि’ उसी जीवंत खोज को ‘देखो’ की अपेक्षा अधिक स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַתְּרָפִים
  choice: तराफीम
  rationale: यह घरेलू उपासना से जुड़ी विशिष्ट सांस्कृतिक वस्तु का हिब्रू नाम है। लिप्यंतरण उसके आकार, ठीक कार्य या स्वरूप को अनावश्यक रूप से निश्चित नहीं करता। प्रसंग में एक प्रतिरूप के रूप में रखी वस्तु होने के कारण हिन्दी में एकवचन क्रिया ‘था’ रखी गई है।
- source_word: אֶל הַמִּטָּה
  choice: बिछौने पर
  rationale: אֶל सामान्यतः दिशा सूचित करता है, पर यहाँ खोजे गए प्रतिरूप की स्थिति बताता है। हिन्दी में शरीर के स्थान पर रखी वस्तु के लिए ‘बिछौने पर’ स्वाभाविक है और हिब्रू की स्थानगत अभिव्यक्ति को ठीक से संप्रेषित करता है।
- source_word: וּכְבִיר הָעִזִּים
  choice: बकरी के बालों का बुना हुआ आवरण
  rationale: כְבִיר दुर्लभ शब्द है और संभवतः किसी बुनी हुई ढकने की वस्तु को दर्शाता है। ‘आवरण’ उसकी ठीक बनावट या आधुनिक प्रकार को निश्चित किए बिना कार्य बताता है; ‘बकरी के बालों का’ पदार्थ के संभावित आशय को स्पष्ट करता है।
- source_word: מְרַאֲשֹׁתָיו
  choice: उसके सिरहाने
  rationale: शब्द का अर्थ सिर की जगह या सिर के पास है। ‘उसके सिरहाने’ प्रतिरूप के सिर वाले भाग की स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, बिना यह मान लिए कि वहाँ सचमुच कोई मनुष्य था।
theological_decisions:
- issue: घरेलू उपासना या मूर्तिपूजा से जुड़ी वस्तु תְּרָפִים का अनुवाद
  choice: तराफीम
  alternative: कुलदेवता की मूर्ति; घरेलू मूर्ति; प्रतिमा
  rationale: पद वस्तु का नाम देता है, पर उस पर स्पष्ट धार्मिक टिप्पणी नहीं करता। लिप्यंतरण सांस्कृतिक विशिष्टता और वस्तु के स्वरूप से जुड़ी अनिश्चितता बनाए रखता है; पादटिप्पणी उसका संभावित अर्थ समझाती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर बाइबलीय कथन की गरिमा बनाए रखती है। ‘तो देखा कि’ अकस्मात खोज का कथात्मक प्रभाव देता है। सांस्कृतिक शब्द ‘तराफीम’ को पादटिप्पणी सहित रखा गया है, और दुर्लभ כְבִיר को उसके संभावित कार्य के आधार पर अनुवादित करते हुए अनिश्चितता स्पष्ट की गई है।
