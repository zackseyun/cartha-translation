  text: וַ/תִּקַּ֨ח מִיכַ֜ל אֶת הַ/תְּרָפִ֗ים וַ/תָּ֨שֶׂם֙ אֶל הַ/מִּטָּ֔ה וְ/אֵת֙ כְּבִ֣יר הָֽ/עִזִּ֔ים שָׂ֖מָה מְרַֽאֲשֹׁתָ֑י/ו וַ/תְּכַ֖ס בַּ/בָּֽגֶד־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/013.yaml
  text: Then Michal took the household idol and laid it on the bed[b][a], and she put a cushion of goats’ hair at its head and covered it with the garment.
translation:
  language: hi
  text: तब मीकल ने घरेलू देव-मूर्ति[a] लेकर उसे पलंग पर रख दिया। उसने उसके सिरहाने बकरी के बालों से बनी एक गद्दी[b] रखी और उसे वस्त्र से ढक दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तराफीम,” “घरेलू देवताओं की मूर्ति,” अथवा “प्रतिमा।” इब्रानी शब्द घरेलू उपासना में प्रयुक्त वस्तुओं के लिए आता है; यहाँ वह पलंग पर रखी एक आकृति के रूप में काम करता है।
    reason: lexical_alternative
  - marker: b
    text: इस इब्रानी पद का ठीक अर्थ अनिश्चित है। इसका आशय बकरी के बालों से बनी कोई बुनी हुई चादर, जाली, तकिया या ऐसी ही सिरहाने रखी जाने वाली वस्तु हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַתְּרָפִים
  choice: घरेलू देव-मूर्ति
  rationale: यह शब्द घरेलू उपासना में प्रयुक्त मूर्ति या पूज्य वस्तु को दर्शाता है। यद्यपि इब्रानी रूप व्याकरणतः बहुवचन है, प्रसंग में उसे पलंग पर रखी एक आकृति के रूप में प्रस्तुत किया गया है; इसलिए हिंदी में एकवचन स्वाभाविक है।
- source_word: אֶל הַמִּטָּה
  choice: पलंग पर
  rationale: שׂוּם के साथ यहाँ אֶל उस वस्तु को छल की तैयारी में पलंग पर रखने का भाव देता है।
- source_word: כְּבִיר הָעִזִּים
  choice: बकरी के बालों से बनी एक गद्दी
  rationale: כְּבִיר का सटीक अर्थ अनिश्चित है। प्रसंग में यह बकरी के बालों से बनी, सिरहाने रखी जाने वाली कोई बुनी या मोटी वस्तु है। 'गद्दी' पठनीय है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: מְרַאֲשֹׁתָיו
  choice: उसके सिरहाने
  rationale: यह सिर या सिरहाने की जगह को सूचित करता है। 'उसके' का निकटतम संदर्भ पलंग पर रखी देव-मूर्ति है, यद्यपि दृश्य में वह दाऊद का स्थान ले रही है।
- source_word: בַּבָּגֶד
  choice: वस्त्र से
  rationale: בֶּגֶד वस्त्र या कपड़े के लिए सामान्य शब्द है। निश्चित उपपद किसी पहचाने हुए वस्त्र की ओर संकेत करता है, पर हिंदी में इस वाक्य में 'वस्त्र से' अधिक स्वाभाविक है।
- source_word: וַתְּכַס
  choice: ढक दिया
  rationale: כסה की ठोस क्रिया 'ढकना' है; यह छल के दृश्य की कार्रवाई को स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
