  yaml_path: translation/ot/1_samuel/019/010.yaml
  text: Saul sought to pin David to the wall with the spear, but he slipped away from Saul’s presence, and he drove the spear into the wall. Then David fled and escaped that night.
translation:
  language: hi
  text: शाऊल ने भाले से दाऊद को दीवार में बेध देने की कोशिश की, पर दाऊद शाऊल से बचकर निकल गया, और शाऊल ने भाला दीवार में दे मारा। तब दाऊद भाग गया और उस रात बच निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְהַכּוֹת בַּחֲנִית בְּדָוִד וּבַקִּיר
  choice: भाले से दाऊद को दीवार में बेध देने
  rationale: शाब्दिक संरचना ‘भाले से दाऊद और दीवार पर प्रहार करना’ लक्ष्य और दीवार के संबंध को कुछ अस्पष्ट रखती है; प्रसंग में शाऊल का आशय भाले से दाऊद को दीवार में बेधना है। यह चयन मूल की हिंसक क्रिया और दोनों अवयवों को स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּפְטַר מִפְּנֵי שָׁאוּל
  choice: दाऊद उसके सामने से बच निकला
  rationale: क्रिया का भाव स्वयं को छुड़ाकर निकल जाने का है; ‘बच निकला’ आधुनिक हिन्दी में गति और संकट से मुक्ति दोनों व्यक्त करता है।
- source_word: וַיַּךְ אֶת־הַחֲנִית בַּקִּיר
  choice: भाला दीवार में जा धँसा
  rationale: इब्रानी में शाब्दिक रूप से ‘उसने भाले को दीवार में मारा’ है और कर्ता व्याकरणतः शाऊल है। हिन्दी में परिणाम-केंद्रित वाक्य स्वाभाविक है और यह स्पष्ट करता है कि चूका हुआ भाला दीवार में लगा, बिना अनावश्यक पुनरुक्ति के।
- source_word: נָס וַיִּמָּלֵט
  choice: भाग गया और ... बच निकला
  rationale: 'दोनों क्रमिक क्रियाओं को अलग रखा गया है: पहली पलायन और दूसरी सफलतापूर्वक बच जाने को बताती है।'
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, संक्षिप्त और गरिमापूर्ण शैली। ‘बेध देने’ से घातक आशय स्पष्ट होता है, जबकि ‘कोशिश की’ ויבקש के प्रयत्न-सूचक भाव को व्यक्त करता है।
