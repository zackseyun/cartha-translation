  yaml_path: translation/ot/1_samuel/019/007.yaml
  text: So Jonathan called David and told him all these things. Then Jonathan brought David to Saul[a], and he was in his presence as before.
translation:
  language: hi
  text: तब योनातान ने दाऊद को बुलाया और उसे ये सारी बातें बताईं। फिर योनातान दाऊद को शाऊल के पास ले आया, और दाऊद पहले की तरह शाऊल के सामने रहने लगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक, ‘कल और परसों के समान।’ यह हिब्रानी मुहावरा ‘पहले की तरह’ या ‘पूर्ववत्’ का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... לְדָוִד
  choice: दाऊद को बुलाया
  rationale: קרא के साथ לְ किसी व्यक्ति को बुलाने का सामान्य अर्थ देता है। ‘बुलाया’ स्वाभाविक है और यह अनिर्णीत रहने देता है कि बुलावा औपचारिक था या अनौपचारिक।
- source_word: וַיַּגֶּד לוֹ
  choice: उसे ... बताईं
  rationale: נגד के हिफ़ईल रूप का अर्थ किसी बात को ज्ञात कराना या बताना है। स्त्रीलिंग बहुवचन क्रिया ‘बताईं’ हिन्दी में ‘बातें’ के अनुरूप है।
- source_word: כָּל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דבר का अर्थ ‘शब्द’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ योनातान शाऊल के साथ हुई बातचीत का पूरा वृत्तांत दाऊद को बताता है, इसलिए ‘ये सारी बातें’ अर्थ की व्यापकता और स्वाभाविक हिन्दी दोनों बनाए रखता है।
- source_word: וַיָּבֵא ... אֶל
  choice: '... के पास ले आया'
  rationale: בוא का हिफ़ईल रूप ‘लाना’ व्यक्त करता है। प्रसंग में ‘के पास ले आया’ गंतव्य और कारक अर्थ दोनों को स्वाभाविक ढंग से प्रकट करता है।
- source_word: וַיְהִי לְפָנָיו
  choice: उसकी उपस्थिति में रहने लगा
  rationale: शाब्दिक अर्थ ‘उसके सामने हुआ/रहा’ है और यह किसी शासक की उपस्थिति या सेवा में रहने को सूचित कर सकता है। ‘उपस्थिति में रहने लगा’ दरबार में लौटने का भाव देता है, पर किसी विशिष्ट पद को आरोपित नहीं करता।
- source_word: כְּאֶתְמוֹל שִׁלְשׁוֹם
  choice: पहले की तरह
  rationale: यह हिब्रानी कालगत मुहावरा पूर्ववर्ती समय या पुरानी स्थिति को सूचित करता है। ‘पहले की तरह’ आधुनिक हिन्दी में इसका स्वाभाविक अर्थ व्यक्त करता है।
