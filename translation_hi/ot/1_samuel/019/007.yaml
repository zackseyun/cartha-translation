  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। दूसरे वाक्य में ‘दाऊद’ दोहराकर हिब्रानी के अस्पष्ट हो सकने वाले सर्वनाम का स्वाभाविक हिन्दी में संदर्भ स्पष्ट किया गया है; इससे कोई अतिरिक्त धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
