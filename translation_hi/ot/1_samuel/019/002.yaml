source:
  edition: WLC
  text: וַ/יַּגֵּ֤ד יְהוֹנָתָן֙ לְ/דָוִ֣ד לֵ/אמֹ֔ר מְבַקֵּ֛שׁ שָׁא֥וּל אָבִ֖/י לַ/הֲמִיתֶ֑/ךָ וְ/עַתָּה֙ הִשָּֽׁמֶר נָ֣א בַ/בֹּ֔קֶר וְ/יָשַׁבְתָּ֥ בַ/סֵּ֖תֶר וְ/נַחְבֵּֽאתָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/002.yaml
  text: Jonathan told David[a], saying, “Saul my father is seeking to kill you. So now, please be on your guard in the morning, and stay in a secret place and hide yourself.”
translation:
  language: hi
  text: योनातान ने दाऊद से कहा, “मेरा पिता शाऊल तुम्हें मार डालना चाहता है। इसलिए अब, कृपया सुबह सावधान रहना, किसी गुप्त स्थान में ठहरना[a] और अपने को छिपा लेना।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छिपकर रहना।” इब्रानी में “ठहरना” के साथ ऐसा संज्ञा-पद है जिसका अर्थ “गुप्तता,” “ओट” या “छिपने का स्थान” हो सकता है; इसके बाद “अपने को छिपा लेना” कहकर निर्देश पर बल दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגֵּד ... לֵאמֹר
  choice: से कहा
  rationale: इब्रानी में ‘बताया’ और ‘कहते हुए’ का वाक्य-विन्यास है। हिन्दी में प्रत्यक्ष कथन से पहले ‘से कहा’ स्वाभाविक है और सूचना देने का भाव भी संदर्भ से स्पष्ट रहता है।
- source_word: מְבַקֵּשׁ
  choice: चाहता है
  rationale: वर्तमान कृदन्त शाऊल की जारी मंशा को व्यक्त करता है। हिन्दी में ‘चाहता है’ इसे सहज रूप से बताता है; ‘कोशिश कर रहा है’ वास्तविक प्रयास को आवश्यकता से अधिक स्पष्ट कर देता।
- source_word: לַהֲמִיתֶךָ
  choice: तुम्हें मार डालना
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी को मृत्यु देना अर्थात मार डालना है। यह अनौपचारिक हत्या के संदर्भ में ‘मृत्युदण्ड देना’ से अधिक सटीक है।
- source_word: הִשָּׁמֶר נָא
  choice: कृपया ... सावधान रहना
  rationale: आज्ञार्थक रूप आत्मरक्षात्मक सावधानी का निर्देश देता है और נָא अनुरोध का भाव जोड़ता है, जिसे ‘कृपया’ से व्यक्त किया गया है।
- source_word: בַבֹּקֶר
  choice: सुबह
  rationale: मूल पद का सीधा अर्थ ‘सुबह’ है। संदर्भतः अगली सुबह सम्भव है, पर मूल में ‘कल’ स्पष्ट नहीं है।
- source_word: וְיָשַׁבְתָּ בַסֵּתֶר
  choice: किसी गुप्त स्थान में ठहरना
  rationale: ישׁב का शाब्दिक अर्थ बैठना भी हो सकता है, पर यहाँ छिपे स्थान में बने रहने का भाव है। סֵתֶר स्थान, ओट या गुप्तता सूचित कर सकता है।
- source_word: וְנַחְבֵּאתָ
  choice: अपने को छिपा लेना
  rationale: यह क्रिया स्वयं को छिपाने का स्पष्ट भाव रखती है। पूर्ववर्ती पद के साथ इसका प्रयोग निर्देश पर बल देता है।
- source_word: יְהוֹנָתָן ... דָוִד ... שָׁאוּל
  choice: योनातान ... दाऊद ... शाऊल
  rationale: व्यक्तिनामों के प्रचलित आधुनिक हिन्दी बाइबलीय रूप अपनाए गए हैं।
