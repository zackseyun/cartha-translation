  register: आधुनिक मानक हिन्दी; भाषा सहज, गरिमापूर्ण और कथात्मक है। ‘योनातान की बात मानी’ इब्रानी मुहावरे का अर्थपूर्ण समतुल्य है। ‘मृत्युदण्ड’ होफ़अल क्रिया की कारक-निष्क्रिय शक्ति को स्पष्ट करता है।
