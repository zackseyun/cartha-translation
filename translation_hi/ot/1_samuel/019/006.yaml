  text: Saul listened to Jonathan’s voice[a], and Saul swore, “As Yahweh lives, he shall not be put to death.”
translation:
  language: hi
  text: शाऊल ने योनातान की बात मानी, और शाऊल ने शपथ खाकर कहा, “याहवे के जीवन की शपथ, उसे मृत्युदंड नहीं दिया जाएगा।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी शपथ-विधि का शाब्दिक रूप: “याहवे जीवित है, यदि उसे मृत्युदंड दिया जाए ...।” यहाँ ‘यदि’ के साथ परिणाम-वाक्य लुप्त है और यह प्रबल निषेध व्यक्त करता है: “उसे निश्चित ही मृत्युदंड नहीं दिया जाएगा।”'
    reason: इब्रानी अंडाकार शपथ-विधि אִם יוּמָת का अर्थ स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וַיִּשְׁמַע ... בְּקוֹל יְהוֹנָתָן
  choice: योनातान की बात मानी
  rationale: שׁמע בקול यहाँ केवल सुनने नहीं, बल्कि योनातान की विनती मानने का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक रूप से वही प्रत्युत्तरात्मक अर्थ व्यक्त करता है।
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाकर कहा
  rationale: क्रिया का अर्थ शपथ लेना है; प्रत्यक्ष कथन से पहले यह हिन्दी में सहज और गंभीर अभिव्यक्ति है।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह इब्रानी की प्रचलित शपथ-विधि है। यह रूप उसकी शपथात्मक शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ के विशिष्ट ईश्वरीय नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אִם יוּמָת
  choice: दाऊद को मृत्युदण्ड नहीं दिया जाएगा
  rationale: शपथ-वाक्य में אִם अधूरी शर्त के रूप में प्रबल निषेध व्यक्त करता है, और מות का होफ़अल रूप ‘मार डाला जाना/मृत्युदण्ड दिया जाना’ है। प्रसंग से सर्वनाम का संकेत दाऊद की ओर है, इसलिए हिन्दी में नाम स्पष्ट किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: यहाँ मूल में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का निकट हिन्दी लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: अधूरे शपथ-वाक्य אִם יוּמָת का अर्थ
  choice: 'प्रबल निषेध: दाऊद को मृत्युदण्ड नहीं दिया जाएगा'
  alternative: 'शाब्दिक अधूरा रूप: यदि उसे मृत्युदण्ड दिया जाए...'
  rationale: इब्रानी शपथ-प्रयोग में परिणाम-वाक्य लुप्त है; वक्ता अपने ऊपर दण्ड आने की निहित बात के द्वारा घटना का दृढ़ निषेध करता है। स्पष्ट हिन्दी अर्थ दिया गया है, बिना शपथ की गंभीरता घटाए।
