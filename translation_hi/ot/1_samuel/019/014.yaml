  yaml_path: translation/ot/1_samuel/019/014.yaml
  text: Then Saul sent messengers to seize David[a], and she said, “He is sick.”
translation:
  language: hi
  text: तब शाऊल ने दाऊद को पकड़ने के लिए दूत भेजे, और उसने[a] कहा, “वह बीमार है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में केवल “और उसने कहा” है; स्त्रीलिंग कर्ता को संदर्भ से मीकल समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: तब ... भेजे
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यहाँ शाऊल द्वारा भेजे गए मनुष्य अभिप्रेत हैं, स्वर्गदूत नहीं; ‘दूत’ संक्षिप्त और सन्दर्भानुकूल है।
- source_word: לָקַחַת
  choice: पकड़ने के लिए
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है, पर इस सन्दर्भ में दाऊद को हिरासत में लेने का आशय है; ‘पकड़ने’ से यह स्वाभाविक हिन्दी में स्पष्ट होता है।
- source_word: וַתֹּאמֶר
  choice: और उसने कहा
  rationale: मूल में साधारण संयोजक और स्त्रीलिंग एकवचन क्रिया है। ‘और’ अनावश्यक विरोधाभास जोड़े बिना इब्रानी क्रम को सुरक्षित रखता है; स्त्री कर्ता सन्दर्भ से मीकल है।
- source_word: חֹלֶה הוּא
  choice: वह बीमार है
  rationale: विधेय विशेषण और सर्वनाम का सीधा, स्वाभाविक आधुनिक हिन्दी रूप।
