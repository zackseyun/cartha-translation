  text: मैं बाहर जाकर उस खेत में, जहाँ तुम हो, अपने पिता के पास खड़ा रहूँगा और तुम्हारे विषय में अपने पिता से बात करूँगा। फिर मैं देखूँगा कि क्या होता है[a] और तुम्हें बता दूँगा।
