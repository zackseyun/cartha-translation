  yaml_path: translation/ot/1_samuel/019/011.yaml
  text: Then Saul sent messengers to David’s house to watch him and to kill him in the morning. And Michal his wife told David[a], saying, “If you do not save your life tonight, tomorrow you will be put to death.”
translation:
  language: hi
  text: तब शाऊल ने दाऊद के घर पर दूत भेजे कि वे उस पर नज़र रखें और सुबह उसे मार डालें। और उसकी पत्नी मीकल ने दाऊद से कहा, “यदि तुम आज रात अपनी जान नहीं बचाओगे[a], तो कल तुम्हें मार डाला जाएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम आज रात अपनी जान लेकर नहीं बच निकलते, तो कल तुम्हें मार डाला जाएगा।”
    reason: मְמַלֵּט אֶת־נַפְשְׁךָ का शाब्दिक मुहावरा ‘अपनी जान बचाना’ अथवा ‘अपनी जान लेकर बच निकलना’ दोनों रूपों में व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: מַלְאָכִים
  choice: दूत
  rationale: इस प्रसंग में ये शाऊल द्वारा भेजे गए मनुष्य हैं, स्वर्गदूत नहीं; ‘दूत’ संक्षिप्त और मानक हिन्दी है।
- source_word: לְשָׁמְרוֹ
  choice: उस पर नज़र रखें
  rationale: यहाँ שׁמר का आशय दाऊद की रक्षा करना नहीं, बल्कि उसके घर की hostile निगरानी करना है; यह हिन्दी अभिव्यक्ति उस अर्थ को स्वाभाविक रूप से बताती है।
- source_word: וְלַהֲמִיתוֹ
  choice: उसे मार डालें
  rationale: מות के हिफ़ील रूप का सीधा कारणवाचक अर्थ ‘मारना’ है; ‘मार डालें’ षड्यंत्र की स्पष्टता और तीव्रता बनाए रखता है।
- source_word: בַּבֹּקֶר
  choice: सुबह
  rationale: यह हत्या के लिए निर्धारित समय बताता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַתַּגֵּד
  choice: चेतावनी दी
  rationale: मूल क्रिया का आधारभूत अर्थ ‘बताया’ है, पर आगामी कथन घातक संकट की स्पष्ट चेतावनी है; प्रसंगानुकूल हिन्दी में ‘चेतावनी दी’ अधिक स्वाभाविक है।
- source_word: מִיכַל אִשְׁתּוֹ
  choice: दाऊद की पत्नी मीकल
  rationale: सम्बन्ध को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: מְמַלֵּט אֶת־נַפְשְׁךָ
  choice: अपनी जान नहीं बचाओगे
  rationale: נפש यहाँ व्यक्ति के जीवन को सूचित करता है और מלט बच निकलने अथवा प्राण बचाने का भाव देता है; मुख्य पाठ में प्रचलित हिन्दी मुहावरा रखा गया है।
- source_word: הַלַּיְלָה
  choice: आज रात
  rationale: यह वर्तमान रात को सूचित करता है; ‘आज रात’ आधुनिक हिन्दी का सहज रूप है।
- source_word: מוּמָת
  choice: तुम्हें मार डाला जाएगा
  rationale: यह מות का निष्क्रिय रूप है और प्रसंग में शाऊल के दूतों के हाथों दाऊद की हत्या को सूचित करता है; निष्क्रियता और मानवीय कर्तृत्व दोनों स्पष्ट रहते हैं।
