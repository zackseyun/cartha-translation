    rationale: In modern Hindi this can denote being pleased with David’s conduct or result, rather than Jonathan’s sustained, intense favorable disposition toward him. “दाऊद को बहुत पसंद करता था” better communicates the source expression’s sense in natural Hindi.
  - severity: low
    issue: “से ... बात कही” is slightly less idiomatic than “से ... बात की.”
    rationale: Both are intelligible, but the latter is the standard natural Hindi phrasing for speaking with persons about a matter.
