  text: וַ/יְדַבֵּ֣ר שָׁא֗וּל אֶל יוֹנָתָ֤ן בְּנ/וֹ֙ וְ/אֶל כָּל עֲבָדָ֔י/ו לְ/הָמִ֖ית אֶת דָּוִ֑ד וִ/יהֽוֹנָתָן֙ בֶּן שָׁא֔וּל חָפֵ֥ץ בְּ/דָוִ֖ד מְאֹֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/001.yaml
  text: Saul spoke to Jonathan his son and to all his servants to put David to death[b][a], but Jonathan son of Saul delighted greatly in David.
translation:
  language: hi
  text: शाऊल ने अपने पुत्र योनातान और अपने सभी सेवकों से दाऊद को मार डालने की बात की[a], पर शाऊल का पुत्र योनातान दाऊद को बहुत पसंद करता था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद को मरवा देने की बात की।” इब्रानी क्रिया कारक रूप में है और किसी को मृत्यु दिलाने का भाव भी दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाऊद से बहुत प्रसन्न था” या “दाऊद को बहुत चाहता था।” इब्रानी में दाऊद में बहुत प्रसन्न होने या उसमें बहुत आनंद लेने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: बात कही
  rationale: דבר का अर्थ यहाँ बोलना है; इसके बाद आया उद्देश्यसूचक वाक्यांश बताता है कि बातचीत दाऊद को मार डालने के विषय में थी। हिंदी में ‘बात कही’ इस रचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֲבָדָיו
  choice: अपने सभी सेवकों
  rationale: राजकीय संदर्भ में עבד सेवक, दरबारी या अधिकारी को सूचित कर सकता है। ‘सेवकों’ मूल शब्द के प्रति पारदर्शी है और आधुनिक हिंदी में सहज है।
- source_word: לְהָמִית אֶת דָּוִד
  choice: दाऊद को मार डालने की
  rationale: המית हिफ़ील रूप में किसी को मृत्यु दिलाने अथवा मार डालने का भाव रखता है। לְ के साथ यह शाऊल की बात का विषय या उद्देश्य हो सकता है; ‘मार डालने की बात कही’ हिंदी में दोनों के बीच की निकटता बनाए रखता है।
- source_word: וִיהוֹנָתָן
  choice: पर ... योनातान
  rationale: वाव यहाँ शाऊल के घातक इरादे और योनातान के दाऊद के प्रति अनुकूल भाव के बीच विरोध प्रकट करता है, इसलिए ‘पर’ उपयुक्त है।
- source_word: חָפֵץ בְּדָוִד מְאֹד
  choice: दाऊद से बहुत प्रसन्न था
  rationale: חפץ किसी में प्रसन्न होने, उससे आनंदित होने या उसे बहुत चाहने का भाव देता है। ‘बहुत प्रसन्न था’ सकारात्मक लगाव को व्यक्त करता है, पर मूल में न आए אהב के स्पष्ट ‘प्रेम’ को यहाँ आयात नहीं करता।
- source_word: בְּנוֹ / בֶּן שָׁאוּל
  choice: अपने पुत्र / शाऊल का पुत्र
  rationale: दोनों पुत्र-संबंधी अभिव्यक्तियाँ मूल की पुनरुक्ति और कथात्मक स्पष्टता बनाए रखने के लिए रखी गई हैं।
