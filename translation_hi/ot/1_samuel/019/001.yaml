  naturalness: The draft is generally clear and suitably formal. “बात कही” is understandable, but “बात की” is the more idiomatic collocation with “से” in this context.
  terminology: Names and kinship terms are appropriate. “सेवकों” preserves the broad court term עֲבָדָיו. The revised wording maintains the distinction between delight/favorable regard and explicit love.
