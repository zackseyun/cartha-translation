translation:
  language: hi
  text: 'शाऊल को यह समाचार दिया गया: “देखिए, दाऊद रामा के नायोत में है।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: यह समाचार दिया गया
  rationale: निष्क्रिय क्रिया का भाव सुरक्षित रहता है और सूचना देने वाले व्यक्ति को अनिर्दिष्ट रखा जाता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: לְשָׁאוּל
  choice: शाऊल को
  rationale: अप्रत्यक्ष कर्म को स्वाभाविक हिन्दी परसर्ग ‘को’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: उद्धरण आरम्भ करने वाला विराम-चिह्न
  rationale: हिब्रू का प्रचलित उद्धरण-सूचक रूप हिन्दी में अलग से ‘यह कहते हुए’ रखने की अपेक्षा द्विबिंदु और प्रत्यक्ष कथन से अधिक स्वाभाविक ढंग से व्यक्त होता है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान आकर्षित करने और सूचना की तात्कालिकता दिखाने वाला वर्तमान हिन्दी रूप है।
- source_word: דָוִד
  choice: दाऊद
  rationale: व्यक्तिनाम का हिन्दी बाइबलीय परंपरा में प्रचलित रूप।
- source_word: בְנוית
  choice: नायोत में
  rationale: स्थाननाम को लिप्यंतरित करते हुए בְ के स्थानवाचक अर्थ को ‘में’ से व्यक्त किया गया है।
- source_word: בָּרָמָה
  choice: रामा के
  rationale: नायोत का व्यापक स्थान रामा है; संयुक्त हिन्दी पद ‘रामा के नायोत में’ दोनों स्थानवाचक संबंधों को स्वाभाविक रूप से व्यक्त करता है।
