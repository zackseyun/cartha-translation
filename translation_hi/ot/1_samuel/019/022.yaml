  text: וַ/יֵּ֨לֶךְ גַּם ה֜וּא הָ/רָמָ֗תָ/ה וַ/יָּבֹא֙ עַד בּ֤וֹר הַ/גָּדוֹל֙ אֲשֶׁ֣ר בַּ/שֶּׂ֔כוּ וַ/יִּשְׁאַ֣ל וַ/יֹּ֔אמֶר אֵיפֹ֥ה שְׁמוּאֵ֖ל וְ/דָוִ֑ד וַ/יֹּ֕אמֶר הִנֵּ֖ה ב/נוית בָּ/רָמָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/022.yaml
  text: He too went to Ramah[a], and he came as far as the great well that is at Seku. He asked and said, “Where are Samuel and David?” And one said, “Look[b], they are at Naioth in Ramah.”
translation:
  language: hi
  text: वह भी रामा[a] की ओर गया और सेकू में स्थित बड़े कुएँ[b] तक पहुँचा। उसने पूछा, “शमूएल और दाऊद कहाँ हैं?” किसी ने उत्तर दिया, “देखो[c], वे रामा के नायोत में हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रामा की ओर’—हिब्रू रूप रामा की दिशा में गति बताता है; इसका अनुवाद ‘रामा को’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “बड़े जलकुंड” अथवा “बड़े गड्ढे।” हिब्रू शब्द בּוֹר के ये सभी अर्थ हो सकते हैं।
    reason: lexical_alternative
  - marker: c
    text: हिब्रू में इसके बाद शाब्दिक रूप से “और उसने कहा” है; उत्तर देने वाला कौन था, यह नहीं बताया गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָרָמָתָה
  choice: रामा की ओर
  rationale: स्थानवाचक दिशासूचक ה गति को रामा की दिशा में व्यक्त करता है; ‘रामा की ओर गया’ हिन्दी में स्वाभाविक है और गंतव्य की ओर गति को स्पष्ट रखता है।
- source_word: בּוֹר הַגָּדוֹל
  choice: बड़ा कुआँ
  rationale: בּוֹר गड्ढे, जलकुंड/हौद या कुएँ को सूचित कर सकता है। यहाँ यह मार्ग के एक परिचित स्थल-चिह्न के रूप में आया है; ‘बड़ा कुआँ’ प्रसंग में स्वाभाविक है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: בַּשֶּׂכוּ
  choice: सेकू में स्थित
  rationale: सेकू स्थान-नाम है; उपसर्ग ב को यहाँ स्थानीय अर्थ में सहज हिन्दी द्वारा व्यक्त किया गया है।
- source_word: וַיִּשְׁאַל וַיֹּאמֶר
  choice: उसने पूछा
  rationale: दोनों हिब्रू क्रियाएँ प्रश्न के बाद प्रत्यक्ष कथन का परिचय देती हैं। हिन्दी में ‘उसने पूछा’ इस कार्य को स्वाभाविक रूप से पूरा करता है; ‘पूछा और कहा’ अनावश्यक रूप से कठोर लगता है।
- source_word: אֵיפֹה
  choice: कहाँ हैं
  rationale: प्रश्नवाचक शब्द का अर्थ ‘कहाँ’ है; संयुक्त कर्ता शमूएल और दाऊद के कारण हिन्दी में बहुवचन ‘हैं’ उचित है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह उत्तर की ओर ध्यान खींचता है। ‘देखो’ आधुनिक, सुबोध हिन्दी में इसके संकेतात्मक बल को बनाए रखता है।
- source_word: בנוית
  choice: नायोत में
  rationale: स्थान-नाम का लिप्यंतरण किया गया है; हिन्दी में स्थान के लिए ‘में’ स्वाभाविक है।
- source_word: בָּרָמָה
  choice: रामा के
  rationale: यह वाक्यांश नायोत को रामा से संबद्ध/रामा में स्थित बताता है। संयुक्त स्थान-नाम ‘रामा के नायोत में’ हिन्दी में अधिक सहज है।
- source_word: וַיֹּאמֶר
  choice: किसी ने उत्तर दिया
  rationale: हिब्रू में क्रिया एकवचन है पर उत्तर देने वाला स्पष्ट नहीं है। हिन्दी में अनिर्दिष्ट कर्ता ‘किसी ने’ जोड़ना आवश्यक स्पष्टता देता है; ‘उत्तर दिया’ संवाद में क्रिया की भूमिका को स्वाभाविक रूप से बताता है।
