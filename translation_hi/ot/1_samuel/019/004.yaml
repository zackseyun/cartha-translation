translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर रखा गया है। योनातान द्वारा शाऊल को तीसरे पुरुष में ‘राजा’ कहने का सम्मानपूर्ण दरबारी स्वर सुरक्षित है, जबकि आगे ‘आपके’ से प्रत्यक्ष सम्बोधन स्वाभाविक बनाया गया है।
