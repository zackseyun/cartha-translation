base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/004.yaml
  text: Jonathan spoke well of David to Saul his father[a], and said to him, “Let not the king sin against his servant David, because he has not sinned against you[b], and because his deeds have been very good for you.”
translation:
  language: hi
  text: योनातान ने अपने पिता शाऊल से दाऊद के पक्ष में बात की[a] और उससे कहा, “राजा अपने सेवक दाऊद के विरुद्ध पाप न करे[b], क्योंकि उसने आपके विरुद्ध पाप नहीं किया है और उसके काम आपके लिए बहुत अच्छे रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद के विषय में अच्छा कहा।” इब्रानी मुहावरे का शाब्दिक अर्थ है, “दाऊद के विषय में भली बात कही।”
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी में बल देने के लिए ‘दाऊद’ के साथ पूर्वसर्ग दोहराया गया है: “अपने सेवक के विरुद्ध, दाऊद के विरुद्ध।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר ... בְּדָוִד טוֹב
  choice: दाऊद के पक्ष में बातें कीं
  rationale: यह इब्रानी मुहावरा दाऊद के विषय में अनुकूल ढंग से बोलने और उसकी पैरवी करने को व्यक्त करता है। ‘पक्ष में बातें कीं’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग का आशय स्पष्ट रखता है।
- source_word: אֶל שָׁאוּל אָבִיו
  choice: अपने पिता शाऊल से
  rationale: यह सम्बन्ध और सम्बोधन की दिशा दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַל יֶחֱטָא הַמֶּלֶךְ
  choice: राजा ... पाप न करे
  rationale: אַל के साथ जुस्सिव निषेध व्यक्त करता है। तीसरे पुरुष में ‘राजा’ कहना मूल के सम्मानपूर्ण दरबारी स्वर को बनाए रखता है।
- source_word: בְּעַבְדּוֹ בְדָוִד
  choice: अपने सेवक दाऊद के विरुद्ध
  rationale: חטא के साथ ב का अर्थ किसी के विरुद्ध पाप करना है। हिन्दी में नाम को ‘सेवक’ के साथ रखकर आशय स्वाभाविक बनाया गया है; मूल की पुनरुक्ति पादटिप्पणी में दी गई है।
- source_word: כִּי לֹא חָטָא לָךְ
  choice: क्योंकि उसने आपके विरुद्ध पाप नहीं किया है
  rationale: पहले प्रयुक्त ‘पाप’ को दोहराने से शाऊल के सम्भावित पाप और दाऊद की निर्दोषता के बीच मूल का वाग्मितापूर्ण विरोध बना रहता है। ‘आपके’ सम्मानपूर्ण प्रत्यक्ष सम्बोधन को दर्शाता है।
- source_word: וְכִי מַעֲשָׂיו טוֹב לְךָ מְאֹד
  choice: और उसके काम आपके लिए बहुत अच्छे रहे हैं
  rationale: यह दूसरा कारण प्रस्तुत करता है और दाऊद के कार्यों से शाऊल को हुए बड़े लाभ को मूल के निकट रहते हुए सहज हिन्दी में व्यक्त करता है।
