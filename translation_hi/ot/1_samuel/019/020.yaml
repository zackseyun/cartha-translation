source:
  edition: WLC
  text: וַ/יִּשְׁלַ֨ח שָׁא֣וּל מַלְאָכִים֮ לָ/קַ֣חַת אֶת דָּוִד֒ וַ/יַּ֗רְא אֶֽת לַהֲקַ֤ת הַ/נְּבִיאִים֙ נִבְּאִ֔ים וּ/שְׁמוּאֵ֕ל עֹמֵ֥ד נִצָּ֖ב עֲלֵי/הֶ֑ם וַ/תְּהִ֞י עַֽל מַלְאֲכֵ֤י שָׁאוּל֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּֽתְנַבְּא֖וּ גַּם הֵֽמָּה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/020.yaml
  text: Then Saul sent messengers to seize David[a]. When they saw the company of prophets prophesying, with Samuel standing over them, the Spirit of God came upon Saul’s messengers[b], and they also prophesied.
translation:
  language: hi
  text: तब शाऊल ने दाऊद को पकड़ने के लिए दूत भेजे। जब उन्होंने नबियों के दल[a] को भविष्यवाणी करते देखा और शमूएल को उनके ऊपर खड़े देखा[b], तब परमेश्वर का आत्मा शाऊल के दूतों पर आ गया, और वे भी भविष्यवाणी करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘नबियों के समूह’। इब्रानी शब्द किसी एकत्र दल या मंडली को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उनके बीच खड़े देखा’। इब्रानी अभिव्यक्ति यह भी संकेत दे सकती है कि शमूएल उनके ऊपर अगुवे या पर्यवेक्षक की स्थिति में थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַלְאָכִים / מַלְאֲכֵי
  choice: दूत
  rationale: इस प्रसंग में ये शाऊल द्वारा भेजे गए मनुष्य हैं, स्वर्गदूत नहीं; ‘दूत’ संक्षिप्त और स्वाभाविक है।
- source_word: לָקַחַת
  choice: पकड़ने के लिए
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है, पर यहाँ उद्देश्य दाऊद को हिरासत में लेना है; ‘पकड़ना’ शत्रुतापूर्ण प्रसंग को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַהֲקַת הַנְּבִיאִים
  choice: नबियों के दल
  rationale: לַהֲקָה एकत्र समूह को सूचित करता है; ‘दल’ आधुनिक हिन्दी में स्पष्ट है और किसी औपचारिक संस्था का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: נִבְּאִים
  choice: भविष्यवाणी करते
  rationale: कृदन्त जारी भविष्यसूचक गतिविधि बताता है; यह चुनाव क्रिया के बल को बनाए रखता है।
- source_word: עֹמֵד נִצָּב עֲלֵיהֶם
  choice: उनके ऊपर खड़े
  rationale: शब्दावली शमूएल की स्थिर स्थिति को व्यक्त करती है और संभवतः उनकी अगुवाई या देखरेख का संकेत देती है; मुख्य पाठ स्थानगत अस्पष्टता को बनाए रखता है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: वाक्यांश यहाँ भविष्यवाणी कराने वाली परमेश्वर की सक्रिय उपस्थिति को सूचित करता है; यह अनुवाद मूल की ईश्वरीय कर्तृता बनाए रखता है।
- source_word: וַתְּהִי עַל
  choice: पर आ गया
  rationale: यह मुहावरा किसी विशेष कार्य के लिए आत्मा के व्यक्ति या समूह पर आने को व्यक्त करता है; हिन्दी में यह घटनात्मक बल को स्वाभाविक ढंग से देता है।
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: वे भी भविष्यवाणी करने लगे
  rationale: ‘भी’ גַּם के आश्चर्यपूर्ण समावेश को रखता है, और ‘करने लगे’ कथा में आरम्भ हुई गतिविधि को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: इस कथा में רוּחַ אֱלֹהִים का स्वरूप
  choice: ‘परमेश्वर का आत्मा’—भविष्यवाणी कराने वाली ईश्वरीय सक्रिय उपस्थिति
  alternative: ‘परमेश्वर की ओर से एक आत्मा’
  rationale: इब्रानी वाक्यांश बिना अनिश्चित उपपद के है और शमूएल की पुस्तकों में सामान्यतः परमेश्वर के आत्मा की सामर्थी क्रिया को व्यक्त करता है। यह चुनाव बाद की व्यवस्थित धर्मशास्त्रीय परिभाषाएँ पाठ पर आरोपित किए बिना ईश्वरीय कर्तृता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘नबी’, ‘भविष्यवाणी’ और ‘परमेश्वर का आत्मा’ जैसे परिचित बाइबलीय पद बनाए गए हैं। पादटिप्पणी चिह्न संबंधित पदों—‘दल’ और ‘उनके ऊपर खड़े’—के तुरंत बाद रखे गए हैं।
