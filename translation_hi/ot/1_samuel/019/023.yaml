base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/023.yaml
  text: So he went there[a], to Naioth in Ramah, and the Spirit of God came upon him also; and he went on, prophesying[b], until he came to Naioth in Ramah.
translation:
  language: hi
  text: तब वह वहाँ रामा में नायोत[a] गया। परमेश्वर की आत्मा उस पर भी आ गई, और वह चलता गया और भविष्यवाणी करता रहा, जब तक कि वह रामा में नायोत पहुँच गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रामा के नायोत।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נוית בָּרָמָה
  choice: रामा के नायोत
  rationale: स्थान-नामों का लिप्यंतरण किया गया है। בָּרָמָה में उपसर्ग ב स्थान-संबंध बताता है; हिंदी में ‘रामा के नायोत’ स्वाभाविक है और नायोत को रामा से संबद्ध स्थान के रूप में व्यक्त करता है।
- source_word: וַתְּהִי עָלָיו ... רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा उस पर भी आया
  rationale: היה על के साथ רוּחַ का प्रयोग किसी पर दैवी आत्मा के आने को दर्शाता है। यह हिंदी में स्वाभाविक रहते हुए मूल मुहावरे का अर्थ सुरक्षित रखता है।
- source_word: גַּם הוּא
  choice: उस पर भी
  rationale: ‘भी’ इस बात को बनाए रखता है कि शाऊल ने भी वही अनुभव किया जो पहले उसके दूतों ने किया था।
- source_word: וַיֵּלֶךְ הָלוֹךְ
  choice: आगे बढ़ता गया
  rationale: क्रिया के साथ infinitive absolute क्रिया की निरंतरता पर बल देता है; ‘आगे बढ़ता गया’ इस दीर्घ/क्रमिक भाव को सहज हिंदी में व्यक्त करता है।
- source_word: וַיִּתְנַבֵּא
  choice: भविष्यवाणी करता हुआ
  rationale: हित्पएल रूप यहाँ दैवी प्रभाव में नबूवत-संबंधी क्रिया को बताता है। यह अनुवाद उस क्रिया के सटीक स्वरूप को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עַד בֹּאוֹ
  choice: जब तक ... नहीं पहुँचा
  rationale: सर्वनाम-प्रत्यययुक्त infinitive construct को हिंदी की स्वाभाविक कालवाचक संरचना में व्यक्त किया गया है।
- source_word: שָׁם
  choice: वहाँ से
  rationale: यह पिछले संदर्भ में बताए गए स्थान की ओर संकेत करता है। हिंदी में गमन की आरंभिक स्थिति के साथ ‘वहाँ से’ सहज है, यद्यपि मूल में केवल ‘वहाँ’ है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים को व्यक्तिगत दैवी आत्मा या सामान्य प्रभाव के रूप में व्यक्त करना
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर की ओर से एक आत्मा
  rationale: इस कथा-संदर्भ में पदबंध परमेश्वर के सामर्थ्य देने वाले आत्मा की ओर संकेत करता है। ‘परमेश्वर का आत्मा’ संभावित अभिप्राय को व्यक्त करता है, बिना बाद की सिद्धांतगत भाषा जोड़े।
- issue: शाऊल की नबूवत-संबंधी गतिविधि का स्वरूप
  choice: भविष्यवाणी करता हुआ
  alternative: नबी जैसा व्यवहार करता हुआ
  rationale: मूल पाठ गतिविधि को וַיִּתְנַבֵּא कहता है, पर उसके मनोवैज्ञानिक, उन्मादी या उपासना-संबंधी स्वरूप को स्पष्ट नहीं करता। सामान्य क्रियापद उस अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘आगे बढ़ता गया’ मूल की निरंतर क्रिया को सामान्य पाठक के लिए सहज रूप में व्यक्त करता है; धार्मिक तकनीकी शब्दावली को न्यूनतम रखा गया है।
