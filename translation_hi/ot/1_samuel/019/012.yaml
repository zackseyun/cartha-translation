  text: तब मीकल ने दाऊद को खिड़की से नीचे उतार दिया। वह चला गया, भागा और बच निकला।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּרֶד
  choice: नीचे उतार दिया
  rationale: हिफ़ईल क्रिया का प्रेरणार्थक अर्थ है—मीकल ने दाऊद को खिड़की से नीचे पहुँचाया। यह ‘जाने दिया’ की अपेक्षा मूल क्रिया की दिशा और क्रिया-प्रकृति को अधिक स्पष्ट रखता है।
- source_word: בְּעַד הַחַלּוֹן
  choice: खिड़की से
  rationale: इस प्रसंग में בְּעַד किसी खुले मार्ग से होकर बाहर निकलने का भाव देता है; सहज हिंदी में ‘खिड़की से’ पर्याप्त और स्वाभाविक है।
- source_word: וַיֵּלֶךְ וַיִּבְרַח וַיִּמָּלֵט
  choice: वह वहाँ से चला गया, भागा और बच निकला
  rationale: तीनों क्रमिक क्रियाओं को बनाए रखा गया है। ‘वहाँ से’ हिंदी में ‘चला गया’ का प्रसंगगत भाव स्पष्ट करता है, जबकि ‘भागा’ और ‘बच निकला’ पलायन तथा सफल बचाव की अलग-अलग अवस्थाएँ व्यक्त करते हैं।
