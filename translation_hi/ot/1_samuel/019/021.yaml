  text: When they told Saul[a], he sent other messengers, and they also prophesied. Then Saul again sent a third group of messengers[b], and they also prophesied.
translation:
  language: hi
  text: जब उन्होंने शाऊल को यह बताया, तो उसने दूसरे दूत भेजे, और वे भी भविष्यवाणी करने लगे। तब शाऊल ने तीसरी बार दूत भेजे[a], और वे भी भविष्यवाणी करने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘तीसरे [दल]’; अर्थात शाऊल ने तीसरी बार दूत भेजे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּגִּדוּ לְשָׁאוּל
  choice: जब शाऊल को यह समाचार मिला
  rationale: नגד के हिफ़ील रूप का अर्थ बताना या समाचार देना है। प्रसंग में अनिर्दिष्ट बहुवचन कर्ता को हिन्दी में स्वाभाविक भाववाच्य से व्यक्त किया गया है और वाव-क्रम की कालगत कड़ी को ‘जब’ से दिखाया गया है।
- source_word: מַלְאָכִים אֲחֵרִים
  choice: दूसरे दूत
  rationale: מַלְאָךְ यहाँ मनुष्य-दूतों के लिए है, स्वर्गदूतों के लिए नहीं; אֲחֵרִים बहुवचन विशेषण ‘दूसरे’ है।
- source_word: וַיִּתְנַבְּאוּ גַּם הֵמָּה
  choice: और वे भी भविष्यवाणी करने लगे
  rationale: नבא का हित्पएल रूप भविष्यवाणी की अवस्था या क्रिया बताता है। ‘करने लगे’ घटना के आरम्भ को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘वे भी’ पहले दल के समान इनके साथ भी यही होने पर बल बनाए रखता है।
- source_word: וַיֹּסֶף שָׁאוּל וַיִּשְׁלַח
  choice: तब शाऊल ने ... भेजे
  rationale: יסף पुनरावृत्ति का भाव देता है; अगले शब्द שְׁלִשִׁים के साथ मिलकर इसे ‘तीसरी बार’ में स्पष्ट किया गया है, इसलिए अलग से ‘फिर’ जोड़ना अनावश्यक है।
- source_word: מַלְאָכִים שְׁלִשִׁים
  choice: तीसरी बार दूत
  rationale: שְׁלִשִׁים यहाँ प्रसंगानुसार क्रमसूचक अर्थ में तीसरे प्रेषण को दर्शाता है, न कि संख्या ‘तीस’। हिन्दी में ‘तीसरी बार दूत भेजे’ अर्थ को स्पष्ट और सहज रखता है।
theological_decisions:
- issue: शाऊल के दूतों की भविष्यवाणी का स्वरूप
  choice: ‘भविष्यवाणी करने लगे’—व्यापक और तटस्थ अभिव्यक्ति
  alternative: ‘उन्मत्त भाव में बोलने लगे’ या ‘नबियों जैसा व्यवहार करने लगे’
  rationale: पद आत्मा से उत्पन्न भविष्यवाणी-संबंधी घटना बताता है, पर उसके ठीक स्वरूप—उत्कट वाणी, स्तुति या अन्य व्यवहार—को परिभाषित नहीं करता। व्यापक शब्द मूल की अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण कथात्मक शैली। ‘दूत’ मानव संदेशवाहकों के अर्थ में है। मुख्य पाठ में सभी पादटिप्पणी-चिह्न सम्मिलित हैं।
