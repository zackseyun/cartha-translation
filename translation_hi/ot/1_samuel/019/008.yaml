  text: And the war broke out again[a], and David went out and fought against the Philistines and struck them with a great blow, so that they fled before him.
translation:
  language: hi
  text: फिर युद्ध छिड़ गया[a]। दाऊद निकलकर पलिश्तियों से लड़ा और उसने उन्हें बुरी तरह पराजित किया; वे उसके सामने से भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध चलता रहा”; हिब्रू मुहावरे का शाब्दिक अर्थ है, “युद्ध फिर होने लगा,” जो युद्ध के फिर छिड़ने या जारी रहने—दोनों का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתּוֹסֶף הַמִּלְחָמָה לִהְיוֹת
  choice: फिर युद्ध छिड़ गया
  rationale: यह हिब्रू मुहावरा युद्ध के फिर से होने या जारी रहने का भाव देता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘फिर युद्ध छिड़ गया’ रखी गई है और निरंतरता की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: וַיֵּצֵא דָוִד
  choice: दाऊद निकलकर
  rationale: क्रिया का मूल अर्थ ‘निकलना’ है। सैन्य उद्देश्य प्रसंग से स्पष्ट है, इसलिए ‘युद्ध करने निकला’ जोड़कर अर्थ को अनावश्यक रूप से स्पष्ट नहीं किया गया।
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: पलिश्तियों से लड़ा
  rationale: हिन्दी में ‘से लड़ा’ शत्रुतापूर्ण युद्ध को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: उसने उन्हें बुरी तरह पराजित किया
  rationale: नכה और מַכָּה का संयुक्त प्रयोग भारी आघात या करारी पराजय देने का संकेत करता है। यह हिन्दी रूप मूल आशय को स्वाभाविक ढंग से व्यक्त करता है, बिना जनहानि की मात्रा निर्धारित किए।
- source_word: וַיָּנֻסוּ מִפָּנָיו
  choice: वे उसके सामने से भाग गए
  rationale: यह रूप מִפָּנָיו के स्थानिक मुहावरे को बनाए रखते हुए हिन्दी में स्वाभाविक है और दाऊद के सामने से शत्रुओं के पीछे हटने का भाव देता है।
