base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/009.yaml
  text: And an evil spirit from Yahweh came upon Saul while he was sitting in his house with his spear in his hand[b][a], and David was playing the lyre with his hand.
translation:
  language: hi
  text: तब यहोवा की ओर से एक दुष्ट आत्मा[a] शाऊल पर आई। उस समय वह अपने घर में बैठा था और उसका भाला उसके हाथ में था; दाऊद हाथ से वाद्य बजा रहा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा की ओर से एक हानिकारक आत्मा” अथवा “पीड़ादायक आत्मा।” इब्रानी विशेषण का अर्थ “दुष्ट” और “हानिकारक/पीड़ादायक,” दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “हाथ से बजा रहा था।” इस पद में वाद्य का नाम नहीं है, यद्यपि निकटवर्ती प्रसंग से स्पष्ट है कि दाऊद संगीत बजा रहा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתְּהִי
  choice: तब ... आई
  rationale: स्त्रीलिंग רוּחַ के साथ घटना के आरंभ को स्वाभाविक हिन्दी कथन में व्यक्त करता है; אֶל שָׁאוּל के कारण केवल ‘थी’ की अपेक्षा आगमन का भाव उचित है।
- source_word: רוּחַ יְהוָה רָעָה
  choice: यहोवा की ओर से एक दुष्ट आत्मा
  rationale: רוּחַ का अर्थ ‘आत्मा’ और רָעָה का सीधा अर्थ ‘दुष्ट’ है। ‘की ओर से’ सम्बन्ध को स्रोत/प्रेषण के रूप में व्यक्त करता है और यह संकेत नहीं देता कि दुष्टता स्वयं यहोवा का गुण है।
- source_word: אֶל שָׁאוּל
  choice: शाऊल पर
  rationale: पीड़ादायक शक्ति के आ पड़ने के प्रसंग में אֶל का स्वाभाविक हिन्दी रूप ‘पर’ है।
- source_word: בְּבֵיתוֹ יוֹשֵׁב
  choice: अपने घर में बैठा था
  rationale: कृदन्त יוֹשֵׁב की जारी पृष्ठभूमि-क्रिया को सामान्य आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַחֲנִיתוֹ בְּיָדוֹ
  choice: उसका भाला उसके हाथ में था
  rationale: इब्रानी के क्रियारहित उपवाक्य और स्पष्ट सर्वनाम-संबंध को निकटता से सुरक्षित रखता है।
- source_word: מְנַגֵּן בְּיָד
  choice: हाथ से वाद्य बजा रहा था
  rationale: מְנַגֵּן वाद्य बजाने का संकेत देता है, जबकि इस पद में वाद्य का नाम नहीं दिया गया। ‘हाथ से’ בְּיָד को सुरक्षित रखता है और ‘वाद्य’ जोड़ने से हिन्दी वाक्य स्वाभाविक बनता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और मूल पाठ के व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: רוּחַ יְהוָה רָעָה में सम्बन्ध और नैतिक तनाव
  choice: यहोवा की ओर से एक दुष्ट आत्मा
  alternative: यहोवा की ओर से एक हानिकारक आत्मा
  rationale: ‘की ओर से’ आत्मा के स्रोत/प्रेषण का भाव बनाए रखता है। ‘दुष्ट’ רָעָה का सीधा अर्थ सुरक्षित रखता है; वैकल्पिक ‘हानिकारक/पीड़ादायक’ अर्थ पादटिप्पणी में दिया गया है ताकि पाठ का धर्मवैज्ञानिक तनाव मिटाया न जाए।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। कथानक की पृष्ठभूमि को छोटे वाक्यों में स्पष्ट किया गया है। वाद्य का विशिष्ट नाम नहीं जोड़ा गया, क्योंकि मूल पद में वह अनुपस्थित है; फिर भी נגן के वाद्य-संबंधी अर्थ के कारण ‘वाद्य बजा रहा था’ कहा गया है।
