base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/018.yaml
  text: David fled and escaped[a], and he came to Samuel at Ramah and told him all that Saul had done to him. Then he and Samuel went and stayed at Naioth.
translation:
  language: hi
  text: दाऊद भागा और बच निकला। वह रामा में शमूएल के पास आया और उसे वह सब बताया जो शाऊल ने उसके साथ किया था। फिर वह और शमूएल गए और नायोत[a] में ठहरे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: नायोत एक स्थान का नाम है। संभवतः यह रामा से संबद्ध निवास-स्थानों या बस्ती को सूचित करता है।
    reason: स्थाननाम की संभावित सांस्कृतिक और व्युत्पत्तिगत पृष्ठभूमि बताना, बिना अनिश्चित अर्थ को निश्चित किए।
lexical_decisions:
- source_word: בָּרַח וַיִּמָּלֵט
  choice: भागा और बच निकला
  rationale: 'दोनों क्रमिक क्रियाओं को बनाए रखा गया है: पहली खतरे से भागने और दूसरी सफलतापूर्वक बच निकलने को व्यक्त करती है।'
- source_word: הָרָמָתָה
  choice: रामा में
  rationale: दिशासूचक रूप रामा की ओर गति बताता है; हिंदी वाक्य में शमूएल के स्थान के रूप में ‘रामा में शमूएल के पास आया’ स्वाभाविक और अर्थसंगत है।
- source_word: וַיַּגֶּד לוֹ
  choice: उसे ... बताया
  rationale: हिफ़ील रूप यहाँ किसी बात की सूचना देने या बताने के सामान्य कथात्मक अर्थ में है।
- source_word: אֵת כָּל אֲשֶׁר עָשָׂה לוֹ שָׁאוּל
  choice: वह सब ... जो शाऊल ने उसके साथ किया था
  rationale: כָּל की व्यापकता तथा दाऊद पर किए गए शाऊल के व्यवहार, दोनों को स्पष्ट और स्वाभाविक हिंदी में रखा गया है।
- source_word: וַיֵּלֶךְ הוּא וּשְׁמוּאֵל
  choice: फिर वह और शमूएल गए
  rationale: स्पष्ट सर्वनाम और शमूएल के संयुक्त कर्ता को बनाए रखते हुए क्रमिक कथानक को ‘फिर’ से स्वाभाविक बनाया गया है।
- source_word: וַיֵּשְׁבוּ
  choice: रहने लगे
  rationale: ישׁב का यहाँ आशय बैठने मात्र से नहीं, बल्कि उस स्थान पर ठहरने या निवास करने से है।
- source_word: בְנוית
  choice: नायोत में
  rationale: इसे स्थाननाम मानकर लिप्यंतरित किया गया है; संबंधबोधक בְ को ‘में’ से व्यक्त किया गया है।
