source:
  edition: WLC
  text: וַ/יָּשֶׂם֩ אֶת נַפְשׁ֨/וֹ בְ/כַפּ֜/וֹ וַ/יַּ֣ךְ אֶת הַ/פְּלִשְׁתִּ֗י וַ/יַּ֨עַשׂ יְהוָ֜ה תְּשׁוּעָ֤ה גְדוֹלָה֙ לְ/כָל יִשְׂרָאֵ֔ל רָאִ֖יתָ וַ/תִּשְׂמָ֑ח וְ/לָ֤/מָּה תֶֽחֱטָא֙ בְּ/דָ֣ם נָקִ֔י לְ/הָמִ֥ית אֶת דָּוִ֖ד חִנָּֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/019/005.yaml
  text: For he put his life in his hand and struck down the Philistine[a], and Yahweh brought about a great salvation for all Israel. You saw it and rejoiced[c][b]. So why should you sin against innocent blood by putting David to death for no reason?
translation:
  language: hi
  text: क्योंकि उसने अपनी जान अपनी हथेली पर रख दी[a] और उस पलिश्ती को मार गिराया। याहवे ने सारे इस्राएल के लिए बड़ा उद्धार किया[b]। तूने यह देखा और आनंदित हुआ। फिर तू दाऊद को अकारण[c] मार डालकर निर्दोष खून बहाने का पाप क्यों करेगा?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने अपनी जान अपनी हथेली पर रख दी”; अर्थात, उसने अपनी जान जोखिम में डाली।
    reason: lexical_alternative
  - marker: b
    text: “बड़ा उद्धार” का अनुवाद “बड़ी विजय” या “बड़ा छुटकारा” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “बिना किसी कारण के।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשֶׂם אֶת־נַפְשׁוֹ בְכַפּוֹ
  choice: उसने अपनी जान हथेली पर रख दी
  rationale: इब्रानी मुहावरे के सजीव चित्र को सुरक्षित रखते हुए इसका आशय जान जोखिम में डालना है; हिन्दी में भी यह अभिव्यक्ति समझ में आती है।
- source_word: וַיַּךְ אֶת־הַפְּלִשְׁתִּי
  choice: उस पलिश्ती को मार गिराया
  rationale: यहाँ נכה गोलियत को घातक रूप से परास्त करने को दर्शाता है; ‘मार गिराया’ क्रिया की तीव्रता और परिणाम दोनों व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: תְּשׁוּעָה גְדוֹלָה
  choice: महान उद्धार
  rationale: सैनिक प्रसंग में इसका अर्थ बड़ी विजय या छुटकारा भी हो सकता है, पर ‘उद्धार’ शब्द की व्यापक अर्थ-छाया को बनाए रखता है।
- source_word: רָאִיתָ וַתִּשְׂמָח
  choice: तूने यह देखा और आनन्दित हुआ
  rationale: शाऊल को किया गया सीधा एकवचन सम्बोधन सुरक्षित है; ‘यह’ प्रसंग से मिलने वाले कर्म को स्पष्ट करता है।
- source_word: בְּדָם נָקִי
  choice: निर्दोष खून बहाने का पाप
  rationale: इब्रानी पद निर्दोष रक्त के विरुद्ध पाप और उससे उत्पन्न रक्त-दोष को सूचित करता है; हिन्दी में यह रूप नैतिक-कानूनी आशय स्पष्ट करता है।
- source_word: לְהָמִית אֶת־דָּוִד חִנָּם
  choice: दाऊद को अकारण मार डालकर
  rationale: लְהָמִית पाप किए जाने का ढंग स्पष्ट करता है और חִנָּם बताता है कि दाऊद को मारने का कोई उचित कारण नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: सैनिक प्रसंग में תְּשׁוּעָה
  choice: महान उद्धार
  alternative: बड़ी विजय; बड़ा छुटकारा
  rationale: तात्कालिक घटना युद्ध में विजय है, फिर भी मूल शब्द केवल सैनिक सफलता से व्यापक उद्धार का भाव रख सकता है; मुख्य पाठ उस तनाव को बनाए रखता है।
- issue: בְּדָם נָקִי में रक्त-दोष
  choice: निर्दोष खून बहाने का पाप
  alternative: निर्दोष खून के विरुद्ध पाप
  rationale: चुना हुआ रूप स्वाभाविक हिन्दी में रक्त-दोष का आशय स्पष्ट करता है, जबकि अधिक शाब्दिक विकल्प भी व्याकरणतः सम्भव है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली रखी गई है। शाऊल के लिए मूल का सीधा एकवचन सम्बोधन ‘तू’ बनाए रखा गया है। ‘खून’ सामान्य पाठक के लिए ‘रक्त’ से अधिक स्वाभाविक है, जबकि वाक्य का नैतिक और न्यायिक भार सुरक्षित है।
