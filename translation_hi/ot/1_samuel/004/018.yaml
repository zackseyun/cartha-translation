base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/018.yaml
  text: And it happened[a], when he mentioned the ark of God, that Eli fell backward from the seat by the side of the gate, and his neck was broken and he died, for the man was old and heavy[b]. And he had judged Israel forty years.
translation:
  language: hi
  text: जब उसने परमेश्वर के संदूक का उल्लेख किया, तब एली फाटक के पास आसन से पीछे की ओर गिर पड़ा। उसकी गरदन टूट गई और वह मर गया, क्योंकि वह बूढ़ा और भारी[a] था। उसने चालीस वर्ष तक इस्राएल का न्याय किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “भारी” है। इस शब्द से यह संकेत हो सकता है कि उसकी वृद्धावस्था के साथ उसके शरीर के भार ने भी गिरने को घातक बनाया।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּהַזְכִּירוֹ
  choice: जब उसने ... का उल्लेख किया
  rationale: हिफ़ील रूप का अर्थ यहाँ किसी वस्तु का उल्लेख करना है; यह अनुवाद כְּ के कालवाचक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर की वाचा का संदूक
  rationale: संदर्भ में यह इस्राएल के परमेश्वर से जुड़ा पवित्र संदूक है। हिन्दी में प्रचलित बाइबलीय पद 'वाचा का संदूक' वस्तु की पहचान स्पष्ट करता है, यद्यपि यहाँ इब्रानी में 'वाचा' शब्द प्रत्यक्षतः नहीं है।
- source_word: וַיִּפֹּל ... אֲחֹרַנִּית
  choice: पीछे की ओर गिर पड़ा
  rationale: अव्यय אֲחֹרַנִּית का दिशासूचक अर्थ सीधे और स्वाभाविक ढंग से व्यक्त होता है।
- source_word: הַכִּסֵּא
  choice: चौकी
  rationale: राजसिंहासन का संदर्भ न होने के कारण बैठने के साधारण आसन के लिए 'चौकी' सहज है और फाटक के पास बैठे वृद्ध एली के दृश्य के अनुकूल है।
- source_word: בְּעַד יַד הַשַּׁעַר
  choice: फाटक के पास
  rationale: शाब्दिक मुहावरा 'फाटक के हाथ/बगल में' स्थान का बोध कराता है; 'फाटक के पास' स्पष्ट और स्वाभाविक हिन्दी है।
- source_word: וַתִּשָּׁבֵר מַפְרַקְתּוֹ
  choice: उसकी गरदन टूट गई
  rationale: מַפְרֶקֶת गरदन या गर्दन के पिछले भाग को सूचित करता है; परिणाम को हिन्दी में स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: כִּי זָקֵן הָאִישׁ וְכָבֵד
  choice: क्योंकि वह बूढ़ा और भारी था
  rationale: כָבֵד का मूल अर्थ 'भारी' सुरक्षित रखा गया है; 'मोटा' या 'अधिक वजन वाला' कहना अधिक व्याख्यात्मक होता।
- source_word: שָׁפַט אֶת יִשְׂרָאֵל
  choice: उसने ... इस्राएल का न्याय किया था
  rationale: यहाँ क्रिया एली के पूर्ण हो चुके न्यायी-कार्यकाल का सार देती है; हिन्दी का पूर्ण भूतकाल उस दृष्टिकोण को व्यक्त करता है।
- source_word: אַרְבָּעִים שָׁנָה
  choice: चालीस वर्ष तक
  rationale: समयावधि को सीधी और स्वाभाविक हिन्दी में व्यक्त किया गया है।
