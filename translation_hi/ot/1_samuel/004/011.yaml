  text: And the ark of God was captured, and the two sons of Eli died, Hophni and Phinehas.
translation:
  language: hi
  text: और परमेश्वर का संदूक छीन लिया गया, और एली के दोनों पुत्र, होप्नी और पीनहास, मर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֲרוֹן אֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: इब्रानी संबंधवाचक पदबंध को स्वाभाविक हिन्दी में व्यक्त करता है और संदूक का परमेश्वर से संबंध स्पष्ट रखता है।
- source_word: נִלְקָח
  choice: पकड़ लिया गया
  rationale: לקח के निफ़अल रूप का निष्क्रिय अर्थ सुरक्षित है; युद्ध के प्रसंग में यह शत्रु द्वारा अपने अधिकार में लिए जाने को दर्शाता है।
- source_word: וּשְׁנֵי בְנֵי עֵלִי
  choice: और एली के दोनों पुत्र
  rationale: שְׁנֵי की निश्चित, ज्ञात जोड़ी को ‘दोनों’ से और संबंधवाचक रचना को स्वाभाविक हिन्दी में व्यक्त किया गया है।
- source_word: מֵתוּ
  choice: मर गए
  rationale: מות के काल रूप की सीधी घटना-वर्णनात्मक अभिव्यक्ति है; मूल में निहित न होने वाली अतिरिक्त युद्ध-छवि नहीं जोड़ी गई।
- source_word: חָפְנִי וּפִינְחָס
  choice: होप्नी और पीनहास
  rationale: व्यक्तिनामों का हिन्दी बाइबलीय परंपरा के अनुरूप लिप्यंतरण किया गया है और उन्हें ‘दोनों पुत्र’ के समानाधिकरण के रूप में रखा गया है।
