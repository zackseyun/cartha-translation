base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/002.yaml
  text: The Philistines drew up to meet Israel[a], and the battle spread out, and Israel was defeated before the Philistines; and they struck down about four thousand men in the battle line in the field.
translation:
  language: hi
  text: पलिश्तियों ने इस्राएल का सामना करने के लिए मोर्चा बाँधा। फिर युद्ध फैल गया[a], और इस्राएली पलिश्तियों के सामने हार गए। पलिश्तियों ने मैदान में युद्ध-पंक्ति में लगभग चार हज़ार पुरुषों को मार गिराया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध छिड़ गया।” हिब्रू क्रिया युद्ध के आरम्भ होने या भिड़ंत के फैल जाने का वर्णन कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַרְכוּ
  choice: मोर्चा बाँधा
  rationale: सैन्य प्रसंग में ערך सेना को युद्ध के लिए पंक्तिबद्ध या व्यवस्थित करने का भाव देता है। ‘मोर्चा बाँधा’ आधुनिक और सहज हिन्दी में इस सैन्य अर्थ को व्यक्त करता है।
- source_word: לִקְרַאת
  choice: सामना करने के लिए
  rationale: यहाँ यह विरोधी सेना से मुठभेड़ के लिए आगे आने का अर्थ देता है; युद्ध का प्रसंग शत्रुता को पहले ही स्पष्ट करता है।
- source_word: וַתִּטֹּשׁ הַמִּלְחָמָה
  choice: युद्ध फैल गया
  rationale: इस दुर्लभ प्रयोग में נטש युद्ध के फैलने या पूरी तरह आरम्भ होकर भिड़ंत में बदलने का संकेत दे सकता है। मुख्य पाठ हिब्रू बिंब के निकट रहता है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וַיִּנָּגֶף
  choice: हार गए
  rationale: निफ़अल रूप सैन्य पराजय बताता है। ‘हार गए’ अगली उपवाक्य में बताई गई जनहानि से इसे अलग रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: לִפְנֵי
  choice: के सामने
  rationale: हिब्रू सैन्य मुहावरे को निकटता से सुरक्षित रखता है और प्रसंग में शत्रु के हाथों पराजय का भाव स्पष्ट है।
- source_word: וַיַּכּוּ
  choice: मार गिराया
  rationale: युद्ध के प्रसंग में נכה घातक प्रहार को सूचित करता है। बहुवचन कर्ता प्रसंगानुसार पलिश्ती हैं, इसलिए उन्हें स्पष्ट रूप से दोहराया गया है।
- source_word: בַמַּעֲרָכָה
  choice: युद्ध-पंक्ति में
  rationale: מַעֲרָכָה यहाँ युद्ध के लिए व्यवस्थित पंक्ति या मोर्चे को बताता है; ‘युद्ध-पंक्ति’ इसका संक्षिप्त और स्पष्ट सैन्य अनुवाद है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: यह שׂדה का सीधा और स्वाभाविक अनुवाद है; ‘खुले’ जैसा अतिरिक्त विशेषण जोड़ना आवश्यक नहीं है।
- source_word: כְּאַרְבַּעַת אֲלָפִים אִישׁ
  choice: लगभग चार हज़ार पुरुषों को
  rationale: संख्या से पहले כְּ अनुमान का भाव देता है। युद्ध के प्रसंग में אִישׁ पुरुष योद्धाओं की गणना करता है, इसलिए ‘पुरुषों’ उपयुक्त है।
