  yaml_path: translation/ot/1_samuel/004/012.yaml
  text: Then a man of Benjamin ran from the battle line and came to Shiloh that same day[b][a], with his clothes torn and dirt on his head.
translation:
  language: hi
  text: तब बिन्यामीन गोत्र का एक आदमी युद्ध-पंक्ति[a] से दौड़कर उसी दिन शीलो पहुँचा। उसके कपड़े फटे हुए थे और उसके सिर पर मिट्टी थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युद्ध से” अथवा “सैनिक-पंक्तियों से”; इब्रानी शब्द विशेष रूप से युद्ध-व्यूह या आमने-सामने की युद्ध-पंक्ति को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: कपड़े फाड़ना और सिर पर मिट्टी डालना शोक, घोर संकट या विपत्ति के प्रचलित चिह्न थे।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּרָץ
  choice: दौड़कर
  rationale: रוץ तीव्र गति से दौड़ने को व्यक्त करता है; इससे उसके भागने का उद्देश्य नहीं जोड़ा गया।
- source_word: אִישׁ בִּנְיָמִן
  choice: बिन्यामीन गोत्र का एक आदमी
  rationale: यह पद व्यक्ति की गोत्रीय पहचान बताता है; आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: מֵהַמַּעֲרָכָה
  choice: युद्ध-पंक्ति
  rationale: מַעֲרָכָה यहाँ व्यवस्थित सैन्य मोर्चे अथवा युद्ध-व्यूह की पंक्ति को सूचित करता है, केवल सामान्य अर्थ में युद्ध को नहीं।
- source_word: וַיָּבֹא שִׁלֹה
  choice: शीलो पहुँचा
  rationale: בוא गंतव्य तक आने या पहुँचने का सामान्य क्रियापद है; हिन्दी कथा में ‘पहुँचा’ स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: शाब्दिक अर्थ ‘उस दिन’ है; प्रसंग में ‘उसी दिन’ घटनाओं की तात्कालिक कालगत कड़ी स्पष्ट करता है।
- source_word: וּמַדָּיו קְרֻעִים
  choice: उसके कपड़े फटे हुए थे
  rationale: מַדִּים बहुवचन में वस्त्रों को और קְרֻעִים उनकी फटी अवस्था को व्यक्त करता है।
- source_word: וַאֲדָמָה עַל רֹאשׁוֹ
  choice: और उसके सिर पर मिट्टी थी
  rationale: אֲדָמָה का मूल अर्थ भूमि या मिट्टी है; ‘मिट्टी’ विशिष्ट ‘धूल’ की अपेक्षा स्रोत के अधिक निकट है।
