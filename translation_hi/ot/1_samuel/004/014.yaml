source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע עֵלִי֙ אֶת ק֣וֹל הַ/צְּעָקָ֔ה וַ/יֹּ֕אמֶר מֶ֛ה ק֥וֹל הֶ/הָמ֖וֹן הַ/זֶּ֑ה וְ/הָ/אִ֣ישׁ מִהַ֔ר וַ/יָּבֹ֖א וַ/יַּגֵּ֥ד לְ/עֵלִֽי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/014.yaml
  text: When Eli heard the sound of the outcry[a], he said, “What is this sound of the uproar?” And the man hurried and came and told Eli.
translation:
  language: hi
  text: जब एली ने चीख-पुकार[a] की आवाज़ सुनी, तो उसने पूछा, “यह कोलाहल कैसा है?” तब वह आदमी जल्दी से आया और उसने एली को बताया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पुकार” अथवा “चीख।”
    reason: צְעָקָה के वैकल्पिक अर्थों को दर्शाता है; संदर्भ में यह संकट से उठी सामूहिक ऊँची पुकार है।
lexical_decisions:
- source_word: קוֹל
  choice: आवाज़
  rationale: यहाँ קוֹל सुनाई देने वाली ध्वनि को सूचित करता है और ‘चीख-पुकार’ तथा ‘कोलाहल’ दोनों के साथ स्वाभाविक हिंदी बनाता है।
- source_word: הַצְּעָקָה
  choice: चीख-पुकार
  rationale: यह शब्द संकट और व्याकुलता से उठी सामूहिक ऊँची पुकार को व्यक्त करता है; ‘चीख-पुकार’ आधुनिक हिंदी में उसकी ध्वनि और भावात्मक तीव्रता दोनों रखता है।
- source_word: מֶה קוֹל הֶהָמוֹן הַזֶּה
  choice: यह कोलाहल कैसा है?
  rationale: शाब्दिक संरचना ‘यह कोलाहल की आवाज़ क्या है?’ हिंदी में असहज होती; यह रूप प्रश्न के आशय—शोर का कारण या स्वरूप जानना—को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הֶהָמוֹן
  choice: कोलाहल
  rationale: संदर्भ में यह भीड़ से उठे प्रबल शोर या हलचल को दर्शाता है; ‘कोलाहल’ गरिमापूर्ण और प्रचलित हिंदी विकल्प है।
- source_word: וְהָאִישׁ
  choice: तब वह आदमी
  rationale: मूल में केवल ‘आदमी’ है, ‘दूत’ नहीं; संदर्भगत निश्चितता दिखाने के लिए ‘वह’ रखा गया और कथाक्रम हेतु वाव का स्वाभाविक अनुवाद ‘तब’ किया गया।
- source_word: מִהַר וַיָּבֹא
  choice: जल्दी से आया
  rationale: दोनों क्रियात्मक तत्वों—जल्दी करना और आना—को संक्षिप्त, स्वाभाविक आधुनिक हिंदी में बनाए रखता है।
- source_word: וַיַּגֵּד לְעֵלִי
  choice: उसने एली को सब बता दिया
  rationale: נגד हिफ़ील में समाचार बताने या सूचना देने का अर्थ रखता है। हिंदी में ‘सब बता दिया’ पूर्ण समाचार सुनाने के प्रसंग को स्वाभाविक बनाता है, यद्यपि ‘सब’ मूल में अलग शब्द के रूप में नहीं है।
- source_word: עֵלִי
  choice: एली
  rationale: व्यक्तिनाम का मानक हिंदी लिप्यंतरण।
