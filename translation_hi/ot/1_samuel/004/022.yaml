lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: तब उसने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी कथाशैली में ‘तब उसने कहा’ स्वाभाविक है।
- source_word: גָּלָה
  choice: चली गई है
  rationale: क्रिया में चले जाने, हटा दिए जाने या निर्वासन में जाने का भाव हो सकता है। ‘चली गई है’ महिमा के विषय में स्वाभाविक हिन्दी है और मूल की व्यापकता बनाए रखती है।
- source_word: כָבוֹד
  choice: महिमा
  rationale: यहाँ शब्द परमेश्वर की उपस्थिति से जुड़ी गरिमा और महिमा का बोध कराता है; ‘महिमा’ परिचित और धर्मवैचारिक रूप से अनावश्यक अति-व्याख्या से मुक्त है।
- source_word: מִיִּשְׂרָאֵל
  choice: इस्राएल से
  rationale: מִן अलगाव या हटने का संकेत देता है; ‘इस्राएल से’ इसका सीधा और स्वाभाविक अनुवाद है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ स्पष्ट है।
- source_word: נִלְקַח
  choice: उठा लिया गया है
  rationale: לקח के निफ़अल रूप का निष्क्रिय अर्थ ‘ले लिया गया’ है। संदूक के लिए ‘उठा लिया गया’ स्वाभाविक है और ‘कब्ज़े में कर लिया’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का संदूक
  rationale: यह संबंधवाचक पदबंध का सीधा अनुवाद है और मूल में न पाए जाने वाले बाद के तकनीकी पद को नहीं जोड़ता।
theological_decisions:
- issue: ‘महिमा’ का इस्राएल और संदूक से संबंध
  choice: वाक्य को परमेश्वर से जुड़ी महिमा के इस्राएल से चले जाने के रूप में रखा गया है, बिना यह निश्चित किए कि संदूक स्वयं परमेश्वर की उपस्थिति था।
  alternative: ‘महिमा’ को केवल इस्राएल का राष्ट्रीय सम्मान मानना, या इसे सीधे परमेश्वर के स्वयं चले जाने के समान ठहराना।
  rationale: निकट संदर्भ महिमा के चले जाने को परमेश्वर के संदूक के उठा लिए जाने से जोड़ता है, पर कोई सुव्यवस्थित तत्त्वमीमांसात्मक परिभाषा नहीं देता। इसलिए अनुवाद मूल धर्मवैचारिक तनाव बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध। ‘संदूक’ को औपचारिक बाइबलीय पद के रूप में रखा गया है और मूल की अस्पष्टता पादटिप्पणियों में सुरक्षित है।
