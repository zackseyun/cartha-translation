  yaml_path: translation/ot/1_samuel/004/016.yaml
  text: The man said to Eli[a], “I am the one who came from the battle line, and I fled from the battle line today.” And he said, “What happened, my son?”
translation:
  language: hi
  text: उस आदमी ने एली से कहा, “मैं ही युद्ध-पंक्ति[a] से आया हूँ; मैं आज युद्ध-पंक्ति से भागकर आया हूँ।” एली ने पूछा, “मेरे बेटे, क्या हुआ?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युद्ध,” “सेना की पंक्तियों” अथवा “छावनी”; इब्रानी शब्द सैनिकों की युद्ध-व्यूहबद्ध पंक्ति या मोर्चे को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאִישׁ
  choice: उस आदमी
  rationale: यह सामान्य संज्ञा ‘आदमी’ है; संदर्भ में वह समाचार लाने वाला है, पर मूल पाठ यहाँ ‘दूत’ जैसा विशिष्ट शब्द नहीं रखता।
- source_word: הַבָּא
  choice: मैं ही ... से आया हूँ
  rationale: सर्वनाम के साथ कृदंत वक्ता की पहचान पर बल देता है। हिन्दी में ‘मैं ही ... से आया हूँ’ पूर्ण हो चुके आगमन और बल, दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִן הַמַּעֲרָכָה
  choice: युद्ध-पंक्ति से
  rationale: מַעֲרָכָה सैनिकों की युद्ध-व्यूहबद्ध पंक्ति या मोर्चे को दर्शा सकता है। ‘युद्ध-पंक्ति’ गठन के इस ठोस भाव को सुरक्षित रखता है।
- source_word: נַסְתִּי
  choice: भागकर आया हूँ
  rationale: נוּס का सीधा अर्थ भागना या पलायन करना है। हिन्दी में गंतव्य तक पहुँच चुके वक्ता के कथन में ‘भागकर आया हूँ’ स्वाभाविक है और ‘बच निकला’ जैसा अतिरिक्त परिणाम नहीं जोड़ता।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह पलायन का समय बताता है और आधुनिक हिन्दी में इसका सीधा समतुल्य ‘आज’ है।
- source_word: מֶה הָיָה הַדָּבָר
  choice: क्या हुआ?
  rationale: शाब्दिक भाव ‘क्या बात/घटना हुई?’ है; प्रसंग में ‘क्या हुआ?’ संक्षिप्त, स्वाभाविक और अर्थ-सटीक है।
- source_word: בְּנִי
  choice: मेरे बेटे
  rationale: मूल में प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय स्पष्ट है। यह छोटे व्यक्ति के लिए स्नेहपूर्ण या विनम्र संबोधन है।
