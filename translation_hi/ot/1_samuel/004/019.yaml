  yaml_path: translation/ot/1_samuel/004/019.yaml
  text: His daughter-in-law[a], the wife of Phinehas, was pregnant, about to give birth. When she heard the report that the ark of God had been taken, and that her father-in-law and her husband were dead, she bowed down and gave birth[c][b], because her labor pains came upon her.
translation:
  language: hi
  text: उसकी बहू, पीनहास की पत्नी, गर्भवती थी और जन्म देने ही वाली थी। जब उसने यह समाचार सुना कि परमेश्वर का संदूक छीन लिया गया था[a] और उसका ससुर और उसका पति मर गए थे[b], तो वह झुक गई और उसने बच्चे को जन्म दिया, क्योंकि उसकी प्रसव-पीड़ाएँ उस पर आ पड़ीं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर के संदूक के छीन लिए जाने का समाचार।” हिब्रू रचना को समाचार की विषयवस्तु या उसके विषय—दोनों रूपों में व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “उसका ससुर और उसका पति मृत थे।” हिब्रू रूप को अवस्था या पहले घट चुकी घटना के रूप में व्यक्त किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: शब्दशः, “उसकी पीड़ाएँ उस पर पलट पड़ीं”; यह प्रसव-पीड़ाओं के उस पर आ पड़ने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכַלָּתוֹ
  choice: उसकी बहू
  rationale: כַּלָּה का अर्थ यहाँ ‘बहू’ है। आरंभिक וְ कथा की निरंतरता दिखाता है; हिंदी में अलग संयोजक जोड़े बिना भी यह संबंध स्वाभाविक रूप से बना रहता है।
- source_word: אֵשֶׁת פִּינְחָס
  choice: पीनहास की पत्नी
  rationale: यह समानाधिकरण पद पहले बताए गए संबंध को अधिक स्पष्ट रूप से पहचानता है और हिब्रू संरचना को स्वाभाविक हिंदी में रखता है।
- source_word: הָרָה לָלַת
  choice: गर्भवती थी और जन्म देने ही वाली थी
  rationale: הָרָה गर्भावस्था बताता है और לָלַת निकट प्रसव का भाव देता है। ‘ही वाली थी’ उस आसन्नता को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: וַתִּשְׁמַע אֶת־הַשְּׁמֻעָה
  choice: जब उसने यह समाचार सुना
  rationale: שְׁמוּעָה का अर्थ ‘समाचार/खबर’ है। ‘समाचार’ कथा की गरिमा बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: कि परमेश्वर का संदूक छीन लिया गया है
  rationale: हिब्रू वाक्यांश समाचार की विषयवस्तु बताता है। הִלָּקַח का निष्क्रिय अर्थ ‘ले लिया जाना/छीन लिया जाना’ है; युद्ध के संदर्भ में ‘छीन लिया गया’ अधिक सटीक है।
- source_word: וּמֵת חָמִיהָ וְאִישָׁהּ
  choice: और उसका ससुर और उसका पति मर गए हैं
  rationale: מֵת को परिणामकारी अवस्था (‘मृत हैं’) या घटित घटना (‘मर गए हैं’) के रूप में व्यक्त किया जा सकता है। यहाँ ‘मर गए हैं’ समाचार की समानांतर विषयवस्तु के रूप में स्वाभाविक है।
- source_word: וַתִּכְרַע
  choice: वह झुक गई
  rationale: כרע का मूल भाव झुकना या नीचे होना है। प्रसव के प्रसंग में ‘झुक गई’ संयत है और ‘गिर पड़ी’ जैसी अधिक व्याख्यात्मक भाषा से बचता है।
- source_word: וַתֵּלֶד
  choice: उसने बच्चे को जन्म दिया
  rationale: Qal रूप में ילד स्त्री के लिए ‘जन्म देना’ दर्शाता है। हिंदी में ‘बच्चे को’ जोड़ना क्रिया को स्वाभाविक और पूर्ण बनाता है, बिना बच्चे के लिंग का अनुमान लगाए।
- source_word: כִּי נֶהֶפְכוּ עָלֶיהָ צִרֶיהָ
  choice: क्योंकि उसकी प्रसव-पीड़ाएँ उस पर आ पड़ी थीं
  rationale: צִרֶיהָ यहाँ प्रसव-वेदना को दर्शाता है। נֶהֶפְכוּ עָלֶיהָ का शब्दशः रूप असहज होगा; ‘उस पर आ पड़ी थीं’ अचानक और प्रबल रूप से पीड़ाओं के आने का मुहावरेदार भाव सुरक्षित रखता है।
