- source_word: וְ
  choice: और
  rationale: खंडों के संयोजन को सामान्य हिन्दी समुच्चयबोधक से व्यक्त किया गया है; कोई अतिरिक्त काल-सूचक शब्द नहीं जोड़ा गया।
