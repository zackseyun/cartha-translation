  text: וַ/יִּשְׁלַ֤ח הָ/עָם֙ שִׁלֹ֔ה וַ/יִּשְׂא֣וּ מִ/שָּׁ֗ם אֵ֣ת אֲר֧וֹן בְּרִית יְהוָ֛ה צְבָא֖וֹת יֹשֵׁ֣ב הַ/כְּרֻבִ֑ים וְ/שָׁ֞ם שְׁנֵ֣י בְנֵֽי עֵלִ֗י עִם אֲרוֹן֙ בְּרִ֣ית הָ/אֱלֹהִ֔ים חָפְנִ֖י וּ/פִֽינְחָֽס־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/004.yaml
  text: So the people sent to Shiloh[a], and they carried from there the ark of the covenant of Yahweh of hosts, who is enthroned above the cherubim. And the two sons of Eli, Hophni and Phinehas[b], were there with the ark of the covenant of God.
translation:
  language: hi
  text: तब लोगों ने शीलो में दूत भेजे, और वे वहाँ से सेनाओं के यहवे की वाचा का संदूक ले आए—उस यहवे का, जो करूबों के ऊपर विराजमान है। एली के दोनों पुत्र, होप्नी और पीनहास, परमेश्वर की वाचा के संदूक के साथ वहाँ थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁלַח הָעָם שִׁלֹה
  choice: तब लोगों ने शीलो में संदेश भेजा
  rationale: हिब्रू में भेजे गए व्यक्तियों का उल्लेख स्पष्ट नहीं है। ‘संदेश भेजा’ स्वाभाविक हिन्दी में इस लोप को बनाए रखता है और अनावश्यक रूप से ‘आदमी’ नहीं जोड़ता।
- source_word: וַיִּשְׂאוּ מִשָּׁם
  choice: और वे वहाँ से ... उठा लाए
  rationale: נשא संदूक को उठाकर ले आने की भौतिक क्रिया बताता है; हिन्दी ‘उठा लाए’ दिशा और क्रिया दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲרוֹן בְּרִית
  choice: वाचा का संदूक
  rationale: यह प्रचलित, स्पष्ट और मूल समास-संबंध के निकट हिन्दी रूप है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के यहवे
  rationale: יְהוָה को उसके व्यक्तिगत नाम ‘यहवे’ से और צְבָאוֹת को व्यापक किंतु सुबोध ‘सेनाओं’ से व्यक्त किया गया है।
- source_word: יֹשֵׁב הַכְּרֻבִים
  choice: जो करूबों के ऊपर विराजमान है
  rationale: יֹשֵׁב के राजकीय-सिंहासनगत भाव के लिए ‘विराजमान’ उपयुक्त है। ‘ऊपर’ संदूक की करूब-मूर्तियों से संबद्ध दिव्य उपस्थिति को व्यक्त करता है, पर ‘बीच में’ जैसी अधिक विशिष्ट स्थानगत व्याख्या नहीं थोपता।
- source_word: עִם אֲרוֹן בְּרִית הָאֱלֹהִים
  choice: परमेश्वर की वाचा के संदूक के साथ
  rationale: עִם का सामान्य अर्थ ‘साथ’ सुरक्षित रखा गया है; इससे अनावश्यक रूप से कोई अधिक निश्चित स्थानगत संबंध नहीं बनाया जाता।
- source_word: חָפְנִי וּפִינְחָס
  choice: होप्नी और पीनहास
  rationale: व्यक्तिनामों का हिन्दी ध्वन्यात्मक लिप्यंतरण।
theological_decisions:
- issue: יְהוָה צְבָאוֹת में ईश्वरीय नाम और उपाधि
  choice: सेनाओं के यहवे
  alternative: सेनाओं का यहोवा / सेनाओं का प्रभु
  rationale: मूल पाठ व्यक्तिगत नाम יְהוָה का प्रयोग करता है, इसलिए उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘सेनाओं’ से צְבָאוֹת का सैन्य और स्वर्गीय समूहों तक विस्तृत अर्थ खुला रहता है।
- issue: יֹשֵׁב הַכְּרֻבִים का सिंहासनारूढ़ता-सूत्र
  choice: जो करूबों के ऊपर विराजमान है
  alternative: जो करूबों के बीच सिंहासन पर विराजमान है
  rationale: ‘विराजमान’ दिव्य राजत्व का भाव रखता है, जबकि ‘ऊपर’ मूल की स्थानगत अस्पष्टता को ‘बीच में’ कहकर अत्यधिक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य-विन्यास को हिन्दी के अनुरूप बनाया गया है, और मूल में निहित कर्ता/कर्म से अधिक विवरण नहीं जोड़ा गया।
