- source_word: וַיַּחֲנוּ
  choice: उन्होंने ... पड़ाव डाला
  rationale: सैन्य दल के डेरा लगाने के लिए ‘पड़ाव डाला’ आधुनिक और प्रसंगानुकूल हिन्दी है।
- source_word: עַל הָאֶבֶן הָעֵזֶר
