  choice: शमूएल का वचन सारे इस्राएल तक पहुँचा
  alternative: शमूएल के विषय में खबर सारे इस्राएल में फैल गई
  rationale: अध्याय 3 के निकट साहित्यिक संदर्भ में शमूएल के माध्यम से प्रकट हुए यहोवा के वचन पर बल है। फिर भी मूल पदबंध में कुछ अस्पष्टता है, इसलिए मुख्य पाठ में ‘वचन’ रखा और वैकल्पिक अर्थ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल किंतु गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘पड़ाव डाला’ सैन्य प्रसंग में सहज है। ‘इस्राएली’ सामूहिक राष्ट्र के लोगों को स्पष्ट करता है, जबकि नामों के लिए प्रचलित हिन्दी लिप्यंतरण रखा गया है।
