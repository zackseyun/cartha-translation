  yaml_path: translation/ot/1_samuel/004/001.yaml
  text: And the word of Samuel came to all Israel[a]. Then Israel went out to meet the Philistines in battle, and they camped at Ebenezer[b], while the Philistines camped at Aphek.
translation:
  language: hi
  text: और शमूएल का वचन सारे इस्राएल तक पहुँचा।[a] तब इस्राएल पलिश्तियों से युद्ध करने के लिए निकला। उसने एबनेज़र[b] में पड़ाव डाला, और पलिश्तियों ने अपेक में पड़ाव डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शमूएल के विषय में खबर सारे इस्राएल में फैल गई।” इब्रानी पदबंध का अर्थ शमूएल का वचन या संदेश भी हो सकता है और उसके विषय में फैली खबर भी; निकट संदर्भ में संभवतः उसका भविष्यसूचक वचन अभिप्रेत है।
    reason: alternative_reading
  - marker: b
    text: एबनेज़र का अर्थ है “सहायता का पत्थर।” यहाँ यह एक स्थान का नाम है।
    reason: lexical_alternative
