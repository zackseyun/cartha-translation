base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/005.yaml
  text: When the ark of the covenant of Yahweh came into the camp[a], all Israel shouted with a great shout, and the earth resounded.
translation:
  language: hi
  text: जब याहवे की वाचा का संदूक छावनी में आया, तब समस्त इस्राएल ने बड़ी ज़ोरदार पुकार लगाई, और धरती गूँज उठी[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘धरती काँप उठी।’ इब्रानी क्रिया शोर या हलचल, अथवा काँपने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי כְּבוֹא
  choice: जब ... आया
  rationale: यह रचना कथा में समय बताने वाला उपवाक्य प्रस्तुत करती है। ‘जब ... आया’ आधुनिक हिन्दी में स्वाभाविक है और मूल का कालगत संबंध बनाए रखता है।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: यह पदबंध इब्रानी की संबंधवाचक श्रृंखला को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचागत नाम है; इसलिए उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: הַמַּחֲנֶה
  choice: छावनी
  rationale: सैनिक प्रसंग में ‘छावनी’ स्पष्ट, सटीक और सामान्य आधुनिक हिन्दी है।
- source_word: וַיָּרִעוּ תְּרוּעָה גְדוֹלָה
  choice: बड़े ज़ोर से जयजयकार किया
  rationale: क्रिया और उसी मूल से बनी संज्ञा का मेल पुकार की तीव्रता बढ़ाता है। ‘बड़े ज़ोर से जयजयकार किया’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे निश्चित रूप से युद्धघोष ठहराए।
- source_word: וַתֵּהֹם
  choice: गूँज उठी
  rationale: क्रिया शोर, हलचल या काँपने का भाव दे सकती है। इस प्रसंग में ‘गूँज उठी’ जयजयकार के व्यापक प्रभाव को व्यक्त करती है, पर किसी निश्चित भूकंप का अर्थ नहीं थोपती।
- source_word: הָאָרֶץ
  choice: धरती
  rationale: यहाँ ‘धरती’ शोर से प्रभावित भूमि/जमीन के भाव को स्वाभाविक ढंग से व्यक्त करती है; राजनीतिक भूभाग का अर्थ अपेक्षित नहीं है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सहज रखी गई है। ‘समस्त इस्राएल’ पूरे इस्राएली दल के लिए मूल पाठ की सामूहिक अभिव्यक्ति को बनाए रखता है। अल्पप्रचलित ‘सन्दूक’ के स्थान पर मानक आधुनिक वर्तनी ‘संदूक’ अपनाई गई है।
