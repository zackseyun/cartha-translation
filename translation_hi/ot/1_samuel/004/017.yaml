  edition: WLC
  text: וַ/יַּ֨עַן הַֽ/מְבַשֵּׂ֜ר וַ/יֹּ֗אמֶר נָ֤ס יִשְׂרָאֵל֙ לִ/פְנֵ֣י פְלִשְׁתִּ֔ים וְ/גַ֛ם מַגֵּפָ֥ה גְדוֹלָ֖ה הָיְתָ֣ה בָ/עָ֑ם וְ/גַם שְׁנֵ֨י בָנֶ֜י/ךָ מֵ֗תוּ חָפְנִי֙ וּ/פִ֣ינְחָ֔ס וַ/אֲר֥וֹן הָ/אֱלֹהִ֖ים נִלְקָֽחָה־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/017.yaml
  text: The messenger answered and said[a], “Israel has fled before the Philistines, and there has also been a great slaughter among the people; and your two sons also are dead, Hophni and Phinehas[b]; and the ark of God has been taken.”
translation:
  language: hi
  text: समाचार लानेवाले ने उत्तर देकर कहा, “इस्राएल पलिश्तियों के सामने से भाग गया है। लोगों में भारी मारकाट हुई है[a]। तुम्हारे दोनों बेटे, होप्नी और पीनहास, भी मर गए हैं; और परमेश्वर का सन्दूक ले लिया गया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों को भारी पराजय का सामना करना पड़ा।” इब्रानी शब्द का अर्थ भीषण प्रहार, महामारी या मारकाट हो सकता है; यहाँ युद्ध का प्रसंग ‘मारकाट’ के पक्ष में है।
    reason: lexical_alternative
  - marker: b
    text: या, “परमेश्वर का सन्दूक शत्रु के कब्ज़े में चला गया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמְבַשֵּׂר
  choice: समाचार लानेवाला
  rationale: यह कृदन्त उस व्यक्ति को दर्शाता है जो समाचार लेकर आया था। ‘समाचार लानेवाला’ आधुनिक हिन्दी में स्पष्ट है और प्रसंग के अनुरूप है।
- source_word: נָס
  choice: भाग गया है
  rationale: मूल क्रिया का सीधा अर्थ ‘भागना’ है। पूर्ण वर्तमान निकट अतीत की अभी दी जा रही सूचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सामने से
  rationale: यह शत्रु के सामने से युद्धभूमि छोड़कर भागने का इब्रानी मुहावरा है; हिन्दी अभिव्यक्ति दिशा और पराजय की स्थिति दोनों स्पष्ट करती है।
- source_word: מַגֵּפָה גְדוֹלָה
  choice: भारी मारकाट
  rationale: युद्ध के इस प्रसंग में पद एक भीषण प्रहार अथवा व्यापक जनहानि बताता है। ‘भारी मारकाट’ रोग का अर्थ थोपे बिना सैन्य विनाश को सहज हिन्दी में व्यक्त करता है।
- source_word: בָעָם
  choice: लोगों में
  rationale: मूल पाठ में ‘लोग’ है। प्रसंग में ये इस्राएली सैनिक हैं, फिर भी ‘लोगों में’ स्रोत की व्यापक अभिव्यक्ति को बनाए रखता है।
- source_word: שְׁנֵי בָנֶיךָ
  choice: तुम्हारे दोनों बेटे
  rationale: यह दो निर्दिष्ट बेटों पर बल देनेवाला स्वाभाविक हिन्दी अनुवाद है।
- source_word: מֵתוּ
  choice: मर गए हैं
  rationale: पूर्ण क्रिया घट चुकी मृत्यु की सूचना देती है; ‘मर गए हैं’ समाचार सुनाने के प्रसंग में स्वाभाविक और स्रोत के निकट है।
- source_word: חָפְנִי וּפִינְחָס
  choice: होप्नी और पीनहास
  rationale: व्यक्तिनामों का प्रचलित हिन्दी लिप्यंतरण अपनाया गया है।
- source_word: אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर का सन्दूक
  rationale: यह इब्रानी संबंधवाचक पदबंध का सीधा और हिन्दी बाइबलीय संदर्भ में सुबोध अनुवाद है।
- source_word: נִלְקָחָה
  choice: ले लिया गया है
  rationale: निष्क्रिय रूप को बनाए रखते हुए यह अनुवाद अभी-अभी घटी घटना की सूचना व्यक्त करता है; ‘कब्ज़े में कर लिया गया’ प्रसंगानुकूल पर कुछ अधिक व्याख्यात्मक है।
