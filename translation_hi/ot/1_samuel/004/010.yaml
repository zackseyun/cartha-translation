base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/010.yaml
  text: So the Philistines fought[a], and Israel was defeated, and each man fled to his tent. The slaughter was very great[b], and thirty thousand foot soldiers from Israel fell.
translation:
  language: hi
  text: तब पलिश्ती लड़े, और इस्राएल हार गया। हर व्यक्ति अपने तंबू[a] की ओर भाग गया। मार-काट बहुत भयंकर हुई[b], और इस्राएल के तीस हज़ार पैदल सैनिक मारे गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने घर की ओर।” इब्रानी में शाब्दिक रूप से “अपने तंबू की ओर” है; यह अभिव्यक्ति किसी के निवास-स्थान के लिए मुहावरे के रूप में भी प्रयुक्त हो सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “पराजय बहुत भारी थी।” इब्रानी में शाब्दिक भाव “प्रहार बहुत बड़ा था” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּלָּחֲמוּ פְלִשְׁתִּים
  choice: तब पलिश्ती लड़े
  rationale: לחם का यह रूप सीधे युद्ध करने की क्रिया बताता है। ‘लड़े’ संक्षिप्त और स्वाभाविक है; ‘तब’ कथात्मक क्रम को व्यक्त करता है।
- source_word: וַיִּנָּגֶף יִשְׂרָאֵל
  choice: इस्राएल हार गया
  rationale: युद्ध के संदर्भ में נגף पराजित होने का भाव देता है। यह अनुवाद अगली पंक्ति में वर्णित पलायन को पहले से उसमें मिलाए बिना परिणाम स्पष्ट करता है।
- source_word: וַיָּנֻסוּ אִישׁ לְאֹהָלָיו
  choice: हर एक पुरुष अपने तंबू की ओर भाग गया
  rationale: איש यहाँ वितरणात्मक अर्थ में ‘हर एक पुरुष’ है। אהל का ठोस अर्थ ‘तंबू’ रखा गया है, जबकि ‘घर’ की मुहावरेदार संभावना पादटिप्पणी में दी गई है।
- source_word: וַתְּהִי הַמַּכָּה גְּדוֹלָה מְאֹד
  choice: मार-काट बहुत भयंकर हुई
  rationale: מכה का मूल भाव प्रहार है, पर युद्ध और उसके बाद दी गई मृतक-संख्या के संदर्भ में यह भारी जनहानि या मार-काट को सूचित करता है। ‘भयंकर’ आधुनिक हिन्दी में उसकी तीव्रता स्वाभाविक रूप से बताता है।
- source_word: וַיִּפֹּל מִיִּשְׂרָאֵל
  choice: इस्राएल के … मारे गए
  rationale: युद्ध में व्यक्तियों के लिए נפל का अर्थ प्राण गंवाना है। हिन्दी में ‘मारे गए’ इस आशय को ‘गिर पड़े’ से अधिक स्पष्ट और स्वाभाविक बनाता है।
- source_word: שְׁלֹשִׁים אֶלֶף רַגְלִי
  choice: तीस हज़ार पैदल सैनिक
  rationale: संख्या का सीधा अनुवाद किया गया है और רגלי को घुड़सवारों के विपरीत पैदल लड़ने वाले सैनिकों के रूप में व्यक्त किया गया है।
