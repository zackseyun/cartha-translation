source:
  edition: WLC
  text: א֣וֹי לָ֔/נוּ מִ֣י יַצִּילֵ֔/נוּ מִ/יַּ֛ד הָ/אֱלֹהִ֥ים הָ/אַדִּירִ֖ים הָ/אֵ֑לֶּה אֵ֧לֶּה הֵ֣ם הָ/אֱלֹהִ֗ים הַ/מַּכִּ֧ים אֶת מִצְרַ֛יִם בְּ/כָל מַכָּ֖ה בַּ/מִּדְבָּֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/008.yaml
  text: Woe to us! Who can deliver us from the hand of these mighty gods? These are the gods who struck Egypt with every plague in the wilderness[a][b].
translation:
  language: hi
  text: हाय, हम पर विपत्ति! इन शक्तिशाली देवताओं के हाथ से हमें कौन छुड़ाएगा? ये वे देवता हैं जिन्होंने जंगल में मिस्र को हर विपत्ति से मारा था।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस शक्तिशाली परमेश्वर के हाथ से।” पलिश्ती बहुवचन में बोल रहे हैं, जो इस्राएल के परमेश्वर के विषय में उनकी बहुदेववादी समझ को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “जंगल में।” प्रसंग में यह वाक्यांश कठिन है, क्योंकि मिस्र पर विपत्तियाँ इस्राएल की जंगल-यात्रा से पहले आई थीं। अनुवाद मसोरेटिक पाठ को जैसा लिखा है वैसा ही रखता है।
    reason: textual_variant
lexical_decisions:
- source_word: א֣וֹי לָ֔נוּ
  choice: हाय हम पर!
  rationale: यह संकट और आसन्न विनाश की तीव्र पुकार है; यह हिन्दी अभिव्यक्ति मूल की गंभीरता और संक्षिप्तता बनाए रखती है।
- source_word: מִ֣י יַצִּילֵ֔נוּ
  choice: हमें कौन छुड़ाएगा?
  rationale: हिफ़ील क्रिया נצל का अर्थ बचाना या अधिकार से छुड़ाना है; प्रश्न निराशा से भरा आलंकारिक प्रश्न है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: मूल का 'हाथ' वाला रूपक शक्ति और नियंत्रण को व्यक्त करता है तथा हिन्दी में स्वाभाविक है।
- source_word: הָאֱלֹהִים הָאַדִּירִים הָאֵלֶּה
  choice: इन सामर्थी देवताओं
  rationale: बहुवचन विशेषण और संकेतवाचक रूप पलिश्तियों की बहुदेववादी समझ के अनुसार बहुवचन का समर्थन करते हैं; 'सामर्थी' गरिमापूर्ण और स्पष्ट है।
- source_word: אֵלֶּה הֵם הָאֱלֹהִים
  choice: ये वही देवता हैं
  rationale: '''वही'' पहचान पर दिए गए इब्रानी बल को स्वाभाविक हिन्दी में व्यक्त करता है।'
- source_word: הַמַּכִּים אֶת־מִצְרַיִם
  choice: जिन्होंने मिस्र को ... मारा था
  rationale: बहुवचन कृदंत को ज्ञात भूतकालीन घटना बताने वाले सम्बन्धवाचक उपवाक्य के रूप में प्रस्तुत किया गया है; मिस्र देश और उसके लोगों को सामूहिक रूप से दर्शाता है।
- source_word: בְּכָל מַכָּה
  choice: हर प्रकार की विपत्ति से
  rationale: מַכָּה का अर्थ प्रहार, मार या विपत्ति हो सकता है। 'हर प्रकार की विपत्ति' व्यापकता को स्वाभाविक हिन्दी में व्यक्त करता है और इसे केवल निर्गमन की दस महामारियों तक व्याख्यात्मक रूप से सीमित नहीं करता।
- source_word: בַּמִּדְבָּר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन वनप्रदेश को सूचित करता है; 'जंगल' आधुनिक हिन्दी बाइबलीय प्रयोग में स्वाभाविक है। कठिन ऐतिहासिक क्रम को मूलपाठ के अनुसार ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: पलिश्तियों के कथन में אֱלֹהִים का वचन
  choice: देवताओं
  alternative: परमेश्वर / सामर्थी परमेश्वर
  rationale: इस पद के बहुवचन विशेषण और कृदंत पलिश्तियों की बहुदेववादी दृष्टि को स्पष्ट करते हैं। अनुवाद वक्ताओं की गलत समझ को एकेश्वरवादी स्वीकारोक्ति में नहीं बदलता।
- issue: בַּמִּדְבָּר का ऐतिहासिक रूप से कठिन स्थान
  choice: जंगल में
  alternative: वाक्यांश का लोप या उसे मिस्र से अलग जोड़कर सामंजस्य बैठाना
  rationale: मसोरेटिक पाठ स्पष्ट रूप से 'जंगल में' पढ़ता है। मिस्र की विपत्तियों और जंगल-यात्रा के क्रम से उत्पन्न तनाव को बिना संशोधन सुरक्षित रखा गया है और टिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली अपनाई गई है। पलिश्तियों की घबराहट के लिए आरम्भिक विस्मय और आलंकारिक प्रश्न को संक्षिप्त रखा गया है। 'देवताओं' का बहुवचन वक्ताओं की दृष्टि दर्शाता है, अनुवादक की धार्मिक पुष्टि नहीं।
