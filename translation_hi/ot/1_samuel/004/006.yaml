  text: וַ/יִּשְׁמְע֤וּ פְלִשְׁתִּים֙ אֶת ק֣וֹל הַ/תְּרוּעָ֔ה וַ/יֹּ֣אמְר֔וּ מֶ֠ה ק֣וֹל הַ/תְּרוּעָ֧ה הַ/גְּדוֹלָ֛ה הַ/זֹּ֖את בְּ/מַחֲנֵ֣ה הָ/עִבְרִ֑ים וַ/יֵּ֣דְע֔וּ כִּ֚י אֲר֣וֹן יְהוָ֔ה בָּ֖א אֶל הַֽ/מַּחֲנֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/006.yaml
  text: When the Philistines heard the sound of the shouting[a], they said[b], “What is this great sound of shouting in the camp of the Hebrews?” And they knew that the ark of Yahweh had come into the camp.
translation:
  language: hi
  text: जब पलिश्तियों ने जयघोष की आवाज़ सुनी, तो उन्होंने कहा, “इब्रानियों की छावनी में यह इतना बड़ा जयघोष कैसा है?” तब उन्हें पता चला कि याहवे का संदूक छावनी में आ चुका था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: קוֹל
  choice: आवाज़
  rationale: यहाँ शब्द किसी व्यक्ति की वाणी नहीं, बल्कि इस्राएलियों के सामूहिक जयघोष से उत्पन्न सुनाई देने वाली आवाज़ को दर्शाता है।
- source_word: תְּרוּעָה
  choice: जयघोष
  rationale: पद 5 के निकट संदर्भ में यह संदूक के आने पर उठे हर्षपूर्ण ऊँचे सामूहिक घोष को दर्शाता है। ‘जयघोष’ इस प्रसंग को स्वाभाविक रूप से व्यक्त करता है, बिना इसे अनिवार्य रूप से सैन्य संकेत मानने के।
- source_word: מֶה ... הַזֹּאת
  choice: यह ... कैसा है?
  rationale: यह प्रश्न उस आवाज़ के स्वरूप और कारण के बारे में है; आधुनिक हिन्दी में यह संरचना सीधी और स्वाभाविक है।
- source_word: הַגְּדוֹלָה
  choice: इतना बड़ा
  rationale: मूल विशेषण का अर्थ ‘बड़ा/महान’ है और यहाँ वह जयघोष की प्रबलता को बताता है; ‘इतना बड़ा’ प्रश्न में स्वाभाविक हिन्दी है।
- source_word: מַחֲנֶה
  choice: छावनी
  rationale: कथा का संदर्भ सैन्य पड़ाव का है, इसलिए ‘छावनी’ सामान्य ‘डेरे’ की अपेक्षा अधिक सटीक है।
- source_word: הָעִבְרִים
  choice: इब्रानियों
  rationale: पलिश्ती वक्ताओं द्वारा प्रयुक्त जातिनाम को ‘इस्राएलियों’ में सामान्यीकृत न करके उनके दृष्टिकोण और मूल कथन को सुरक्षित रखा गया है।
- source_word: וַיֵּדְעוּ
  choice: तब उन्हें पता चला
  rationale: क्रिया यहाँ नई सूचना जान लेने को व्यक्त करती है। ‘उन्हें पता चला’ इस आरंभिक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: אֲרוֹן के लिए प्रचलित और बोधगम्य ‘संदूक’ चुना गया है तथा व्यक्तिगत ईश्वरीय नाम יְהוָה को उपाधि में बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: בָּא
  choice: आ गया है
  rationale: मूल में क्रिया उस पूर्ण घटना को बताती है जिसकी जानकारी पलिश्तियों को अब मिली; हिन्दी परोक्ष कथन में ‘आ गया है’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में सामान्य उपाधि नहीं बल्कि परमेश्वर का व्यक्तिगत नाम है। ‘याहवे’ उसे नाम के रूप में बनाए रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ बाद की पारंपरिक स्वर-रचना पर आधारित रूप है।
- issue: संदूक के आने का निहितार्थ
  choice: केवल घटना का कथन
  alternative: परमेश्वर स्वयं छावनी में आए
  rationale: मूल पाठ स्पष्ट रूप से कहता है कि याहवे का संदूक आया था। अनुवाद इसे परमेश्वर की वास्तविक उपस्थिति या अनुपस्थिति के विषय में अतिरिक्त धार्मिक निष्कर्ष में नहीं बदलता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज किंतु गरिमापूर्ण है। ‘पलिश्ती’, ‘इब्रानी’, ‘छावनी’ और ‘संदूक’ कथा के प्राचीन सैन्य-सांस्कृतिक संदर्भ को स्पष्ट रखते हैं। ‘जयघोष’ हर्षपूर्ण सामूहिक पुकार और संभावित युद्ध-घोष—दोनों के अर्थक्षेत्र को पर्याप्त रूप से खुला रखता है।
