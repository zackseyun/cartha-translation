  text: וַ/יִּֽרְאוּ֙ הַ/פְּלִשְׁתִּ֔ים כִּ֣י אָמְר֔וּ בָּ֥א אֱלֹהִ֖ים אֶל הַֽ/מַּחֲנֶ֑ה וַ/יֹּאמְרוּ֙ א֣וֹי לָ֔/נוּ כִּ֣י לֹ֥א הָיְתָ֛ה כָּ/זֹ֖את אֶתְמ֥וֹל שִׁלְשֹֽׁם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/007.yaml
  text: The Philistines were afraid[a], for they said, “God has come into the camp.” And they said, “Woe to us! For nothing like this has happened before.”
translation:
  language: hi
  text: पलिश्ती डर गए,[a] क्योंकि उन्होंने कहा, “परमेश्वर छावनी में आ गया है।” उन्होंने कहा, “हाय! हम पर विपत्ति आ पड़ी है, क्योंकि इससे पहले ऐसा कभी नहीं हुआ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कोई देवता छावनी में आ गया है।” हिब्रू में “परमेश्वर” के लिए प्रयुक्त संज्ञा का रूप बहुवचन है, लेकिन उसके साथ आई क्रिया एकवचन है; इसलिए मुख्य पाठ में “परमेश्वर” रखा गया है।
    reason: वैकल्पिक पाठ और हिब्रू व्याकरण की वास्तविक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיִּֽרְאוּ
  choice: डर गए
  rationale: ירא का कथात्मक रूप पलिश्तियों की तत्काल भयपूर्ण प्रतिक्रिया व्यक्त करता है; ‘डर गए’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: הַפְּלִשְׁתִּים
  choice: पलिश्ती
  rationale: इस जाति-समूह के लिए प्रचलित हिन्दी बाइबलीय नाम।
- source_word: כִּי
  choice: क्योंकि
  rationale: उनके डरने का कारण प्रस्तुत करता है।
- source_word: בָּא אֱלֹהִים
  choice: परमेश्वर ... आ गया है
  rationale: אֱלֹהִים रूप की दृष्टि से बहुवचन है, पर בָּא एकवचन है; इसलिए मुख्य पाठ में एकवचन अर्थ रखा गया है। पूर्ण हो चुकी आगमन-घटना के वर्तमान परिणाम को हिन्दी में ‘आ गया है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל הַמַּחֲנֶה
  choice: छावनी में
  rationale: यह इस्राएली सैन्य शिविर के भीतर आने की गति को सहज हिन्दी में व्यक्त करता है।
- source_word: אוֹי לָנוּ
  choice: हाय हम पर!
  rationale: विनाश की आशंका से निकली गंभीर व्यथा-पुकार को निकटता से व्यक्त करता है।
- source_word: לֹא הָיְתָה כָּזֹאת
  choice: ऐसा कभी नहीं हुआ
  rationale: हिब्रू अभिव्यक्ति का आशय घटना के अभूतपूर्व होने से है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֶתְמוֹל שִׁלְשֹׁם
  choice: इससे पहले
  rationale: शाब्दिक ‘कल-परसों’ यहाँ पूर्वकाल अथवा पहले कभी का मुहावरा है; ‘इससे पहले’ उसी भाव को व्यक्त करता है।
theological_decisions:
- issue: पलिश्तियों के कथन में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: कोई देवता; देवता
  rationale: साथ का क्रिया-रूप בָּא एकवचन है, इसलिए एकवचन अभिप्राय प्रबल है। फिर भी यह पलिश्तियों का कथन है और אֱלֹהִים आकारतः बहुवचन है; अतः सम्भव वैकल्पिक समझ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण कथात्मक शैली। ‘फिर वे कहने लगे’ दूसरे וַיֹּאמְרוּ को स्वाभाविक हिन्दी में अलग करता है। पाद-टिप्पणी चिह्न [a] मुख्य पाठ में उपस्थित है।
