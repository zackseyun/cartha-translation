id: 1SA.4.9
reference: 1 Samuel 4:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִֽתְחַזְּק֞וּ וִֽ/הְי֤וּ לַֽ/אֲנָשִׁים֙ פְּלִשְׁתִּ֔ים פֶּ֚ן תַּעַבְד֣וּ לָ/עִבְרִ֔ים כַּ/אֲשֶׁ֥ר עָבְד֖וּ לָ/כֶ֑ם וִ/הְיִיתֶ֥ם לַ/אֲנָשִׁ֖ים וְ/נִלְחַמְתֶּֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/009.yaml
  text: Be strong and be men[a], O Philistines, lest you become servants to the Hebrews as they have been to you[b]. Be men and fight!
translation:
  language: hi
  text: हे पलिश्तियो, हिम्मत बाँधो और मर्दों जैसा साहस दिखाओ[a], कहीं ऐसा न हो कि तुम इब्रानियों के दास बन जाओ, जैसे वे तुम्हारे दास रहे हैं[b]। मर्दों जैसा साहस दिखाओ और लड़ो!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “पुरुष बनो।” यह पुरुष योद्धाओं को साहस दिखाने का युद्ध-संबंधी मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “जैसे वे तुम्हारी सेवा करते रहे हैं।” यहाँ इब्रानी क्रिया का अर्थ ‘सेवा करना’ या ‘दास होकर सेवा करना’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִתְחַזְּקוּ
  choice: हिम्मत बाँधो
  rationale: हित्पाएल बहुवचन आज्ञार्थक युद्ध के सामने स्वयं को दृढ़ करने और साहस रखने का आह्वान करता है। ‘हिम्मत बाँधो’ आधुनिक हिन्दी में स्वाभाविक और प्रभावशाली है।
- source_word: וִהְיוּ לַאֲנָשִׁים / וִהְיִיתֶם לַאֲנָשִׁים
  choice: मर्दों जैसा साहस दिखाओ
  rationale: शाब्दिक रूप से ‘पुरुष बनो’ वाला यह लिंग-चिह्नित युद्ध-संबंधी मुहावरा पुरुष योद्धाओं को साहस दिखाने का आह्वान है। हिन्दी रूप मूल की पुरुष-संबंधी छवि और आशय दोनों रखता है; पुनरावृत्ति भी सुरक्षित है।
- source_word: פְּלִשְׁתִּים
  choice: हे पलिश्तियो
  rationale: यह प्रत्यक्ष संबोधन है; ‘हे’ हिन्दी में संबोधन को स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: פֶּן
  choice: कहीं ऐसा न हो कि
  rationale: यह अवांछित परिणाम की चेतावनी प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: תַּעַבְדוּ
  choice: दास बन जाओ
  rationale: עבד सेवा करने या दासत्व में आने, दोनों का बोध करा सकता है। युद्ध में पराजय और अधीनता के संदर्भ में ‘दास बन जाओ’ निहित बँधी हुई स्थिति को स्पष्ट करता है।
- source_word: לָעִבְרִים
  choice: इब्रानियों के
  rationale: मूल में ‘इब्रानी’ है, जो प्रायः बाहरी लोगों द्वारा इस्राएलियों के लिए प्रयुक्त नाम है; इसे ‘इस्राएली’ बनाकर समरूप नहीं किया गया।
- source_word: כַּאֲשֶׁר עָבְדוּ לָכֶם
  choice: जैसे वे तुम्हारे दास रहे हैं
  rationale: यह पलिश्तियों के अधीन इब्रानियों की पिछली स्थिति से तुलना करता है। ‘दास रहे हैं’ सैन्य-राजनीतिक अधीनता को व्यक्त करता है, जबकि क्रिया की व्यापक ‘सेवा’ वाली संभावना पादटिप्पणी में रखी गई है।
- source_word: וְנִלְחַמְתֶּם
  choice: और लड़ो
  rationale: संदर्भ में यह आज्ञार्थक बल वाला सीधा युद्ध-आह्वान है; ‘लड़ो’ संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: लिंग-चिह्नित आह्वान לַאֲנָשִׁים
  choice: मर्दों जैसा साहस दिखाओ
  alternative: मर्द बनो; पुरुष बनो; साहस दिखाओ
  rationale: यह पुरुष पलिश्ती योद्धाओं को संबोधित लिंग-चिह्नित युद्ध-मुहावरा है। केवल ‘साहसी बनो’ कहने से मूल की पुरुष-संबंधी अलंकारिक शक्ति मिट जाती, जबकि शाब्दिक ‘मर्द बनो’ हिन्दी में अनावश्यक रूप से कठोर या बोलचाल का लग सकता है।
- issue: सैन्य अधीनता में עבד का बल
  choice: दास बन जाओ / दास रहे हैं
  alternative: सेवा करो / सेवा करते रहे हैं; अधीन हो जाओ
  rationale: संदर्भ स्वैच्छिक सेवा का नहीं, युद्ध में हारकर पराधीन होने का है। ‘दास’ इस धमकी की बँधी हुई और अपमानजनक स्थिति को स्पष्ट रखता है, पर शब्द की शाब्दिक व्यापकता पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सीधी और युद्ध-आह्वान के अनुरूप जोरदार रखी गई है। ‘हे पलिश्तियो’ गरिमापूर्ण प्रत्यक्ष संबोधन है। ‘मर्दों जैसा साहस दिखाओ’ मूल के लिंग-चिह्नित मुहावरे को सामान्य पाठक के लिए अर्थपूर्ण बनाता है, और दोनों स्थानों पर इसकी पुनरावृत्ति मूल की वक्तृता बनाए रखती है।
