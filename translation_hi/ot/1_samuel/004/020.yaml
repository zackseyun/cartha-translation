  register: भाषा आधुनिक मानक हिन्दी की, सहज किंतु गरिमापूर्ण रखी गई है। सम्बोधन में एकवचन “तू” मूल के स्त्रीलिंग एकवचन रूप को स्पष्ट करता है और निकट उपस्थित स्त्रियों की सीधी वाणी के अनुकूल है।
