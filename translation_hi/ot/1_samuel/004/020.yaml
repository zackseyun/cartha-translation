base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/020.yaml
  text: And about the time of her death[a], the women standing by her said, “Do not fear, for you have borne a son.” But she did not answer, nor did she take it to heart.
translation:
  language: hi
  text: उसके मरने के समय, उसके पास खड़ी स्त्रियों ने उससे कहा, “डरो मत, क्योंकि तुमने बेटे को जन्म दिया है।” पर उसने न उत्तर दिया, न उस बात पर ध्यान दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उस बात को मन में नहीं रखा।”
    reason: इब्रानी मुहावरा शाब्दिक रूप से ‘अपने मन/हृदय को उस पर रखना’ है; इसका अर्थ उस बात पर ध्यान देना या उसे मन में लेना है।
lexical_decisions:
- source_word: וּכְעֵת מוּתָהּ
  choice: जब वह मरने वाली थी
  rationale: यह पदबंध उसके मरने के समय की परिस्थिति बताता है। चुना हुआ अनुवाद आधुनिक हिन्दी में स्वाभाविक है और मृत्यु की प्रक्रिया/निकटता को किसी अतिरिक्त धर्मवैज्ञानिक निष्कर्ष के बिना व्यक्त करता है।
- source_word: וַתְּדַבֵּרְנָה הַנִּצָּבוֹת עָלֶיהָ
  choice: उसके पास खड़ी स्त्रियों ने उससे कहा
  rationale: स्त्रीलिंग बहुवचन क्रिया और कृदन्त उन स्त्रियों की ओर संकेत करते हैं जो प्रसव के समय उसके पास उपस्थित थीं। “पास खड़ी” मूल के ठोस चित्र को बनाए रखता है।
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: यह स्त्रीलिंग एकवचन में सीधा निषेधात्मक सम्बोधन है; “मत डर” वर्तमान हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: כִּי בֵן יָלָדְתְּ
  choice: क्योंकि तूने एक बेटे को जन्म दिया है
  rationale: כִּי आश्वासन का कारण देता है और ילד प्रसव को व्यक्त करता है। “जन्म दिया है” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: וְלֹא עָנְתָה
  choice: उसने न उत्तर दिया
  rationale: ענה का यहाँ सीधा अर्थ उत्तर देना या प्रतिक्रिया देना है।
- source_word: וְלֹא שָׁתָה לִבָּהּ
  choice: न इस बात पर मन लगाया
  rationale: यह हृदय/मन लगाने का इब्रानी मुहावरा है, जिसका आशय कही गई बात पर ध्यान देना या उसे मन में ग्रहण करना है। हिन्दी में “मन लगाया” मूल की हृदय-सम्बन्धी छवि और अर्थगत खुलापन दोनों बनाए रखता है।
