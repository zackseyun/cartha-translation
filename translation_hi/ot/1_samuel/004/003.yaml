source:
  edition: WLC
  text: וַ/יָּבֹ֣א הָ/עָם֮ אֶל הַֽ/מַּחֲנֶה֒ וַ/יֹּֽאמְרוּ֙ זִקְנֵ֣י יִשְׂרָאֵ֔ל לָ֣/מָּה נְגָפָ֧/נוּ יְהוָ֛ה הַ/יּ֖וֹם לִ/פְנֵ֣י פְלִשְׁתִּ֑ים נִקְחָ֧ה אֵלֵ֣י/נוּ מִ/שִּׁלֹ֗ה אֶת אֲרוֹן֙ בְּרִ֣ית יְהוָ֔ה וְ/יָבֹ֣א בְ/קִרְבֵּ֔/נוּ וְ/יֹשִׁעֵ֖/נוּ מִ/כַּ֥ף אֹיְבֵֽי/נוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/003.yaml
  text: When the people came into the camp[a], the elders of Israel said, “Why has Yahweh struck us down today before the Philistines? Let us bring here from Shiloh the ark of the covenant of Yahweh, so that it may come into our midst and save us from the hand of our enemies.”
translation:
  language: hi
  text: जब लोग छावनी में आए, तब इस्राएल के पुरनियों ने कहा, “याहवे ने आज हमें पलिश्तियों के सामने क्यों परास्त किया? आओ, हम शीलो से याहवे की वाचा का संदूक यहाँ ले आएँ, ताकि वह हमारे बीच आए और हमें हमारे शत्रुओं के हाथ से बचाए।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू की एकवचन क्रियाओं का निकटतम व्याकरणिक कर्ता ‘संदूक’ है; फिर भी इन्हें संदूक से संबद्ध याहवे की उपस्थिति के लिए भी समझा जा सकता है। हिन्दी में ‘वह’ दोनों संभावनाओं को खुला रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הָעָם
  choice: लोग
  rationale: मूल अर्थ ‘लोग/जन’ है; प्रसंग से स्पष्ट है कि ये युद्ध से छावनी में आने वाले इस्राएली हैं, इसलिए अनावश्यक रूप से ‘सैनिक’ नहीं जोड़ा गया।
- source_word: הַמַּחֲנֶה
  choice: छावनी
  rationale: सैन्य प्रसंग में यह स्वाभाविक और सटीक हिन्दी शब्द है।
- source_word: זִקְנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुरनिये
  rationale: यह इस्राएल के मान्य वरिष्ठ अगुओं के लिए प्रचलित बाइबलीय पद है।
- source_word: נְגָפָנוּ
  choice: हमें परास्त किया
  rationale: यहाँ क्रिया युद्ध में चोट खाकर हारने का भाव देती है। ‘परास्त किया’ सैन्य हार और याहवे की प्रत्यक्ष कर्तृता दोनों को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यंतरित किया गया है।
- source_word: לִפְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सामने
  rationale: यह मूल के ‘सामने’ वाले स्थानिक मुहावरे को बनाए रखता है और युद्ध में उनके सम्मुख हुई हार को व्यक्त करता है।
- source_word: נִקְחָה אֵלֵינוּ
  choice: आओ, हम ... यहाँ ले आएँ
  rationale: यह प्रथम पुरुष प्रस्ताव और संदूक को शीलो से अपनी छावनी तक लाने की दिशा को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִשִּׁלֹה
  choice: शीलो से
  rationale: स्थान-नाम का मानक हिन्दी लिप्यंतरण।
- source_word: אֲרוֹן בְּרִית יְהוָה
  choice: याहवे की वाचा का संदूक
  rationale: यह हिब्रू संबंध-श्रृंखला और संदूक के वाचा-संबंधी महत्त्व को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְיָבֹא בְקִרְבֵּנוּ
  choice: ताकि वह हमारे बीच आए
  rationale: एकवचन क्रिया का निकटतम व्याकरणिक कर्ता संदूक है। हिन्दी में ‘संदूक’ पुल्लिंग होने के कारण ‘वह’ मूल में निहित संदूक/याहवे की उपस्थिति के तनाव को स्वाभाविक रूप से खुला रखता है।
- source_word: וְיֹשִׁעֵנוּ
  choice: और हमें ... बचाए
  rationale: हिफ़ील क्रिया का सामान्य अर्थ बचाना या छुड़ाना है; अगला वाक्यांश बताता है कि बचाव शत्रुओं की शक्ति से है।
- source_word: מִכַּף אֹיְבֵינוּ
  choice: हमारे शत्रुओं के हाथ से
  rationale: ‘हाथ’ शक्ति या नियंत्रण का हिब्रू मुहावरा है और हिन्दी में भी सहज तथा बाइबलीय है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में वाचा-नाम सीधे प्रयुक्त है; ‘याहवे’ उसका निकट लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וְיָבֹא ... וְיֹשִׁעֵנוּ में एकवचन कर्ता
  choice: ताकि वह हमारे बीच आए और हमें बचाए
  alternative: ताकि याहवे हमारे बीच आए और हमें बचाए
  rationale: निकटतम व्याकरणिक पूर्वपद ‘संदूक’ है, पर संदूक से जुड़ी याहवे की उपस्थिति के कारण कथन याहवे की ओर भी संकेत कर सकता है। मुख्य पाठ किसी एक व्याख्या को अनावश्यक रूप से निश्चित नहीं करता; पादटिप्पणी वैकल्पिक समझ बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरनिये,’ ‘वाचा का संदूक’ और ‘शत्रुओं के हाथ से’ जैसे परिचित बाइबलीय पद मूल की सांस्कृतिक बनावट बनाए रखते हैं। पादटिप्पणी-चिह्न उस पूरे विवादित कथन के बाद रखा गया है जिससे वह संबंधित है।
