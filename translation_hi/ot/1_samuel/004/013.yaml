base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/013.yaml
  text: When he came[a], behold, Eli was sitting on the seat by the road, watching, because his heart trembled for the ark of God. And the man came to report it in the city[b], and the whole city cried out.
translation:
  language: hi
  text: जब वह आया, तो वहाँ एली सड़क के किनारे आसन पर बैठा राह देख रहा था, क्योंकि परमेश्वर के संदूक को लेकर उसका मन काँप रहा था[b]। उस आदमी ने नगर में आकर समाचार सुनाया, और सारा नगर चिल्ला उठा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: या, ‘उसका मन परमेश्वर के संदूक के विषय में व्याकुल था।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא וְהִנֵּה
  choice: जब वह आया, तो देखा कि
  rationale: वाक्य कथा को आगे बढ़ाता है और הִנֵּה सामने उपस्थित दृश्य की ओर ध्यान खींचता है। यह हिंदी प्रयोग दृश्य की आकस्मिकता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יֹשֵׁב עַל־הַכִּסֵּא
  choice: अपने आसन पर बैठा
  rationale: כִּסֵּא के लिए ‘आसन’ गरिमापूर्ण और तटस्थ है; ‘अपने’ हिंदी में स्वाभाविक संबंध स्पष्ट करता है, बिना किसी विशेष प्रकार की कुर्सी मान लिए।
- source_word: יַד דֶּרֶךְ
  choice: सड़क के किनारे
  rationale: शाब्दिक रूप से ‘मार्ग के हाथ/बगल’ वाला इब्रानी मुहावरा मार्ग के पास स्थित होने का अर्थ देता है।
- source_word: מְצַפֶּה
  choice: बाट जोह रहा था
  rationale: यह कृदंत चौकन्नी और प्रतीक्षापूर्ण दृष्टि रखने का भाव व्यक्त करता है; प्रसंग में एली समाचार की व्याकुल प्रतीक्षा कर रहा है।
- source_word: כִּי הָיָה לִבּוֹ חָרֵד
  choice: क्योंकि ... उसका मन काँप रहा था
  rationale: חָרֵד में काँपने, भय और व्याकुलता का अर्थक्षेत्र है। ‘मन काँप रहा था’ मूल के ठोस भाव और उसकी भावनात्मक तीव्रता को बनाए रखता है।
- source_word: עַל אֲרוֹן הָאֱלֹהִים
  choice: परमेश्वर के संदूक के लिए
  rationale: עַל यहाँ चिंता के विषय को बताता है। ‘के लिए’ एली की संदूक-संबंधी गहरी चिंता को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְהַגִּיד בָּעִיר
  choice: नगर में आकर समाचार सुनाया
  rationale: הגיד सूचना देने या समाचार सुनाने का अर्थ रखता है और בָּעִיר घटना का स्थान बताता है। ‘आकर’ हिंदी में दूत के नगर पहुँचकर सूचना देने की क्रमबद्धता स्पष्ट करता है।
- source_word: וַתִּזְעַק כָּל־הָעִיר
  choice: और सारा नगर चिल्ला उठा
  rationale: זעק संकट, भय या शोक की सामूहिक पुकार को व्यक्त करता है। ‘चिल्ला उठा’ अचानक फूट पड़े नगरव्यापी हाहाकार को संक्षेप में रखता है।
theological_decisions:
- issue: एली की प्रतिक्रिया का स्वरूप
  choice: उसका मन काँप रहा था
  alternative: वह चिंतित था
  rationale: मूल पाठ का ‘हृदय/मन काँपना’ केवल सामान्य चिंता से अधिक तीव्र है। ठोस रूपक बनाए रखने से एली की भयपूर्ण व्याकुलता सुरक्षित रहती है, पर उसका कारण संदूक के विषय में चिंता से आगे नहीं समझाया जाता।
translation_notes:
  register: आधुनिक मानक हिंदी का सहज किंतु गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘आसन’, ‘बाट जोहना’ और ‘संदूक’ सामान्य पाठक के लिए बोधगम्य रहते हुए बाइबलीय प्रसंग की गंभीरता बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में अपने संबद्ध पदांशों के बाद रखे गए हैं।
