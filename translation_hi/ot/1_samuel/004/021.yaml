  text: וַ/תִּקְרָ֣א לַ/נַּ֗עַר אִֽי כָבוֹד֙ לֵ/אמֹ֔ר גָּלָ֥ה כָב֖וֹד מִ/יִּשְׂרָאֵ֑ל אֶל הִלָּקַח֙ אֲר֣וֹן הָ/אֱלֹהִ֔ים וְ/אֶל חָמִ֖י/הָ וְ/אִישָֽׁ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/004/021.yaml
  text: And she named the boy Ichabod[a], saying, “The glory has departed from Israel,” because the ark of God had been taken, and because of her father-in-law and her husband.
translation:
  language: hi
  text: उसने उस बालक का नाम ईकाबोद[a] रखा और कहा, “इस्राएल से महिमा चली गई है,” क्योंकि परमेश्वर का संदूक ले लिया गया था, और उसके ससुर और पति के कारण भी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “ईकाबोद” नाम उन इब्रानी शब्दों से बना जान पड़ता है जिनका अर्थ “महिमा नहीं” या संभवतः “महिमा कहाँ है?” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּקְרָא לַנַּעַר
  choice: उसने उस बालक का नाम ... रखा
  rationale: नामकरण के प्रसंग में קרא ל का स्वाभाविक आधुनिक हिन्दी रूप ‘नाम ... रखा’ है; נַעַר नवजात पुत्र को सूचित करता है, इसलिए ‘बालक’ उपयुक्त है।
- source_word: אִי כָבוֹד
  choice: ईकाबोद
  rationale: व्यक्तिनाम को मुख्य पाठ में लिप्यंतरित किया गया है; उसकी अनिश्चित शब्द-व्युत्पत्ति को पादटिप्पणी में रखा गया है।
- source_word: גָּלָה כָבוֹד מִיִּשְׂרָאֵל
  choice: इस्राएल से महिमा चली गई है
  rationale: גלה यहाँ अलग हो जाने या चले जाने का भाव देता है। ‘महिमा’ כָבוֹד की धार्मिक और राष्ट्रीय दोनों प्रतिध्वनियों को खुला रखती है।
- source_word: אֶל הִלָּקַח אֲרוֹן הָאֱלֹהִים
  choice: क्योंकि परमेश्वर का संदूक उठा लिया गया था
  rationale: प्रसंग में אֶל कारणसूचक है और הִלָּקַח का निष्क्रिय भाव ‘उठा लिया गया था’ से व्यक्त होता है।
- source_word: וְאֶל חָמִיהָ וְאִישָׁהּ
  choice: और उसके ससुर और पति के कारण भी
  rationale: दोहराया गया אֶל पहले कारणसूचक प्रयोग को आगे बढ़ाता है; ‘भी’ हिन्दी में इस अतिरिक्त आधार को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: इस्राएल के संबंध में ‘महिमा’ का आशय
  choice: ‘महिमा’ को बिना किसी व्याख्यात्मक विस्तार के रखा गया है।
  alternative: ‘परमेश्वर की महिमा’ अथवा ‘सम्मान’
  rationale: इब्रानी कथन यह खुला रखता है कि संकेत परमेश्वर की प्रकट उपस्थिति, इस्राएल के गौरव, या दोनों की ओर है। संदूक के छिनने और एली के घराने की मृत्यु के प्रसंग में दोनों अर्थ गूँजते हैं।
- issue: ससुर और पति की मृत्यु का नामकरण से संबंध
  choice: ‘के कारण भी’
  alternative: ‘के विषय में’ अथवा केवल संदूक के उठाए जाने को कारण मानना
  rationale: दोनों स्थानों पर אֶל का समानांतर प्रयोग कारणसूचक अर्थ का समर्थन करता है, यद्यपि उसकी वाक्यरचना असामान्य है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘परमेश्वर का संदूक’ पारदर्शी बाइबलीय पद है। ‘महिमा’ की जानबूझकर रखी गई अर्थगत व्यापकता मूल पाठ की धार्मिक और राष्ट्रीय प्रतिध्वनि को सुरक्षित रखती है।
