source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר דָּוִ֖ד לַ/אֲבִיגַ֑ל בָּר֤וּךְ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֧ר שְׁלָחֵ֛/ךְ הַ/יּ֥וֹם הַ/זֶּ֖ה לִ/קְרָאתִֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/032.yaml
  text: David said to Abigail[a], “Blessed be Yahweh, the God of Israel, who sent you this day to meet me.”
translation:
  language: hi
  text: दाऊद ने अबीगैल से कहा, “धन्य है याहवे, इस्राएल का परमेश्वर, जिसने आज[a] तुम्हें मुझसे मिलने के लिए भेजा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “इस दिन”; अथवा, “आज।”'
    reason: इब्रानी הַיּוֹם הַזֶּה के शाब्दिक रूप और स्वाभाविक हिन्दी विकल्प दोनों बताने के लिए।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने…कहा
  rationale: वाव-क्रमिक क्रिया कथा की अगली घटना आरम्भ करती है। आधुनिक हिन्दी में बार-बार ‘और’ जोड़ना आवश्यक नहीं है।
- source_word: לַאֲבִיגַל
  choice: अबीगैल से
  rationale: भाषण की क्रिया के साथ ל सम्बोधित व्यक्ति को दर्शाता है; हिन्दी में ‘अबीगैल से कहा’ स्वाभाविक प्रयोग है।
- source_word: בָּרוּךְ
  choice: धन्य है
  rationale: यह कृदन्त स्तुतिपरक आशीर्वाद-सूत्र के रूप में प्रयुक्त है। ‘धन्य है’ उसके कथनात्मक और गरिमामय स्वर को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह चतुरक्षरीय व्यक्तिगत ईश्वरीय नाम का देवनागरी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल का परमेश्वर
  rationale: सम्बन्धवाचक रचना याहवे की पहचान इस्राएल के परमेश्वर के रूप में कराती है।
- source_word: אֲשֶׁר שְׁלָחֵךְ
  choice: जिसने…तुम्हें…भेजा
  rationale: सम्बन्धवाचक अव्यय याहवे की पूर्ण हुई क्रिया का परिचय देता है; स्त्रीलिंग एकवचन प्रत्यय अबीगैल को सम्बोधित ‘तुम्हें’ दर्शाता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज के दिन
  rationale: यह चुनाव इब्रानी के शाब्दिक ‘इस दिन’ को स्वाभाविक हिन्दी काल-सूचक वाक्यांश में व्यक्त करता है और प्रसंग की तात्कालिकता बनाए रखता है।
- source_word: לִקְרָאתִי
  choice: मुझसे मिलने के लिए
  rationale: ל के साथ infinitive उद्देश्य को व्यक्त करता है; प्रसंग में अबीगैल का दाऊद के सामने आना एक नियोजित भेंट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: בָּרוּךְ की स्तुतिपरक शक्ति
  choice: धन्य है
  alternative: की स्तुति हो; धन्य हो
  rationale: मूल में निष्क्रिय कृदन्त वाला कथनात्मक स्तुति-सूत्र है। ‘धन्य है’ उसके रूप और धार्मिक तनाव को किसी प्रार्थनात्मक इच्छा में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमामय कथात्मक शैली रखी गई है। ‘धन्य है’ और ‘याहवे’ मूल की स्तुतिपरक संरचना तथा व्यक्तिगत ईश्वरीय नाम को स्पष्ट रखते हैं।
