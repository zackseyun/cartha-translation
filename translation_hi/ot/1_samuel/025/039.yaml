base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/039.yaml
  text: When David heard that Nabal was dead[a], he said, “Blessed be Yahweh, who has pleaded the case of my reproach from the hand of Nabal, and has kept his servant back from evil. Yahweh has returned Nabal’s evil on his own head.” Then David sent and spoke to Abigail[e][d][c][b], to take her as his wife.
translation:
  language: hi
  text: जब दाऊद ने सुना कि नाबाल मर गया है, तो उसने कहा, “याहवे धन्य हैं, जिन्होंने नाबाल के हाथों हुए मेरे अपमान का मुक़दमा लड़ा[a] और अपने सेवक को बुराई करने से रोका[b]। याहवे ने नाबाल की बुराई उसी के सिर पर लौटा दी है[c]।” तब दाऊद ने संदेश भेजकर अबीगैल से उसे अपनी पत्नी बनाने के विषय में बात की[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरे अपमान का न्याय किया” अथवा “मेरे अपमान का बदला लिया।” इब्रानी में कानूनी विवाद या मुक़दमे की भाषा है।
    reason: lexical_alternative
  - marker: b
    text: या “अपने सेवक को अनिष्ट करने से रोका।”
    reason: lexical_alternative
  - marker: c
    text: “उसी के सिर पर लौटा दी” प्रतिफल का इब्रानी मुहावरा है—अर्थात उसके किए का परिणाम उसी पर आ पड़ा।
    reason: cultural_note
  - marker: d
    text: शाब्दिक रूप से, “उसे अपने लिए पत्नी बनाने के लिए।” यह विवाह के लिए प्रयुक्त इब्रानी अभिव्यक्ति है।
    reason: clarification
lexical_decisions:
- source_word: בָּרוּךְ יְהוָה
  choice: याहवे धन्य हैं
  rationale: यह इब्रानी आशीर्वाद और स्तुति का पारंपरिक सूत्र है। यह रूप परमेश्वर के व्यक्तिगत नाम को बनाए रखते हुए स्वाभाविक और गरिमापूर्ण हिन्दी देता है।
- source_word: רָב אֶת רִיב חֶרְפָּתִי
  choice: मेरे अपमान का मुक़दमा लड़ा
  rationale: क्रिया और संज्ञा दोनों में निहित कानूनी विवाद की छवि को ‘मुक़दमा लड़ा’ से सुरक्षित रखा गया है; חֶרְפָּה को प्रसंगानुकूल ‘अपमान’ कहा गया है।
- source_word: מִיַּד נָבָל
  choice: नाबाल के हाथों हुए
  rationale: इब्रानी ‘हाथ से’ व्यक्ति की कर्तृता या स्रोत को बताता है। हिन्दी का ‘के हाथों’ वही बिंब स्वाभाविक ढंग से रखता है।
- source_word: וְאֶת עַבְדּוֹ חָשַׂךְ מֵרָעָה
  choice: अपने सेवक को बुराई करने से रोका
  rationale: חָשַׂךְ में रोकने या पीछे रखने का भाव है। प्रसंग में दाऊद उस हिंसक प्रतिशोध को नैतिक बुराई मानता है जिसे करने से वह रोका गया।
- source_word: וְאֵת רָעַת נָבָל הֵשִׁיב יְהוָה בְּרֹאשׁוֹ
  choice: याहवे ने नाबाल की बुराई उसी के सिर पर लौटा दी है
  rationale: प्रतिफल के इब्रानी मुहावरे और उसके सजीव ‘सिर पर’ बिंब दोनों को बनाए रखा गया है।
- source_word: וַיִּשְׁלַח דָּוִד וַיְדַבֵּר בַּאֲבִיגַיִל
  choice: दाऊद ने अबीगैल के पास दूत भेजे ... और उससे बात की
  rationale: मूल के ‘भेजा’ और ‘बात की’ दोनों क्रियात्मक तत्व सुरक्षित हैं। दूतों का उल्लेख भेजने और दूर से संवाद करने के प्रसंग में निहित माध्यम को स्पष्ट करता है।
- source_word: לְקַחְתָּהּ לוֹ לְאִשָּׁה
  choice: उसे अपनी पत्नी बनाने के लिए
  rationale: यह विवाह के लिए प्रयुक्त मानक इब्रानी अभिव्यक्ति है। हिन्दी रूप मूल के ‘पत्नी के रूप में लेना’ के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: नाबाल की मृत्यु में ईश्वरीय न्याय और विधान
  choice: दाऊद के कथन के अनुसार याहवे ने उसके अपमान का मुक़दमा लड़ा और नाबाल की बुराई उसी के सिर पर लौटा दी।
  alternative: इसे अधिक स्पष्ट करके कहना कि याहवे ने स्वयं नाबाल को मृत्युदंड दिया।
  rationale: मूल पाठ प्रतिशोधात्मक न्याय का श्रेय याहवे को देता है, पर इस वाक्य में मृत्यु की प्रक्रिया पर अतिरिक्त दार्शनिक या धर्मसैद्धांतिक व्याख्या नहीं जोड़ता।
- issue: दाऊद को רָעָה से रोका जाना
  choice: अपने सेवक को बुराई करने से रोका
  alternative: अपने सेवक को हानि पहुँचाने से रोका
  rationale: רָעָה हानि के साथ नैतिक बुराई भी सूचित कर सकता है। निकट प्रसंग में दाऊद निजी प्रतिशोध और निर्दोष रक्त बहाने से रोका गया था, इसलिए नैतिक बल बनाए रखा गया है।
- issue: अबीगैल से विवाह का संवाद
  choice: दूत भेजे और उसे अपनी पत्नी बनाने के लिए उससे बात की
  alternative: अबीगैल को विवाह का प्रस्ताव भेजा
  rationale: वैकल्पिक रूप प्रसंग का अर्थ स्पष्ट करता है, पर ‘प्रस्ताव’ मूल क्रिया דּבר से अधिक व्याख्यात्मक है। चुना गया रूप मूल की क्रियाओं और विवाह-वाचक उद्देश्य दोनों को रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है और स्वर कथात्मक, गरिमापूर्ण तथा सामान्य पाठक के लिए सुबोध रखा गया है। ‘मुक़दमा लड़ा’ कानूनी रूपक को बचाता है; ‘बुराई’ नैतिक तनाव बनाए रखता है; और ‘उसी के सिर पर’ मूल मुहावरे की सजीवता सुरक्षित रखता है।
