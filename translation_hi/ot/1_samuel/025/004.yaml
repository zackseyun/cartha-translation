  text: David heard in the wilderness that Nabal was shearing his sheep[a].
translation:
  language: hi
  text: दाऊद ने निर्जन प्रदेश में सुना कि नाबाल अपनी भेड़ों[a] की ऊन कतर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्यापक अर्थ में, “अपने झुंड की ऊन।” इब्रानी शब्द छोटे पालतू पशुओं के पूरे झुंड, जैसे भेड़-बकरियों, के लिए हो सकता है; फिर भी ऊन कतरने के प्रसंग में “भेड़ों” अधिक उपयुक्त है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: सुना
  rationale: यहाँ क्रिया कथा में एक साधारण भूतकालीन घटना बताती है; ‘सुना’ सीधा और स्वाभाविक अनुवाद है।
- source_word: בַּמִּדְבָּר
  choice: वीराने में
  rationale: מִדְבָּר निर्जन या खुले वन्य प्रदेश को दर्शाता है, अनिवार्यतः रेतीले मरुस्थल को नहीं; ‘वीराना’ आधुनिक हिन्दी में इस परिवेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי दाऊद ने जो समाचार सुना उसकी विषय-वस्तु प्रस्तुत करता है।
- source_word: גֹזֵז
  choice: ऊन कतरवा रहा है
  rationale: कृदन्त चल रही गतिविधि को व्यक्त करता है। प्रसंग में नाबाल पशुओं का स्वामी है और कटाई सेवकों द्वारा कराई जा सकती है; हिन्दी का प्रयोजक रूप इस स्वाभाविक अर्थ को व्यक्त करता है, जबकि कर्ता के व्यक्तिगत रूप से कतरने का अनावश्यक संकेत नहीं देता।
- source_word: נָבָל
  choice: नाबाल
  rationale: व्यक्तिवाचक नाम का हिन्दी लिप्यंतरण।
- source_word: אֶת צֹאנוֹ
  choice: अपनी भेड़ों
  rationale: צֹאן सामूहिक रूप से छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, के झुंड को दर्शा सकता है; ऊन कतरने के प्रसंग में ‘भेड़ें’ सर्वाधिक स्वाभाविक और विशिष्ट है।
