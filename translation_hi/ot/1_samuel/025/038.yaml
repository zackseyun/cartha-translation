  yaml_path: translation/ot/1_samuel/025/038.yaml
  text: And about ten days later[a], Yahweh struck Nabal, and he died.
translation:
  language: hi
  text: लगभग दस दिन बाद[a], याहवे ने नाबाल पर प्रहार किया, और वह मर गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लगभग दस दिन बीतने पर।” इब्रानी अभिव्यक्ति लगभग दस दिन की अवधि बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי
  choice: बाद
  rationale: यह कथात्मक क्रम में अगली घटना का समय बताता है; हिंदी में अलग से ‘और ऐसा हुआ’ कहना अनावश्यक और अस्वाभाविक होगा।
- source_word: כַּעֲשֶׂרֶת הַיָּמִים
  choice: लगभग दस दिन बाद
  rationale: संख्या के साथ लगा כְּ अनुमान का भाव देता है; यह अनुवाद अवधि की अनिश्चितता और घटनाओं के कालक्रम, दोनों को स्वाभाविक हिंदी में रखता है।
- source_word: וַיִּגֹּף
  choice: ने ... को मारा
  rationale: नָגַף किसी पर प्रहार करने या उसे मारने का सीधा अर्थ देता है। ‘मारा’ क्रिया की तीव्रता बनाए रखता है, पर मृत्यु की प्रक्रिया को उससे अधिक विशिष्ट नहीं बनाता जितना मूल पाठ करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम के चार इब्रानी व्यंजनों को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: נָבָל
  choice: नाबाल
  rationale: व्यक्तिवाचक नाम को प्रचलित हिंदी बाइबलीय रूप में लिप्यंतरित किया गया है; אֶת केवल निश्चित कर्म का चिह्न है और उसका अलग अनुवाद नहीं होता।
- source_word: וַיָּמֹת
  choice: और वह मर गया
  rationale: यह अगली सरल कथात्मक क्रिया है। अलग उपवाक्य हिब्रानी के क्रम को सुरक्षित रखता है और इसे ‘मार डाला’ में समेटकर कारण-परिणाम को अनावश्यक रूप से अधिक स्पष्ट नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसका लिप्यंतरण नाम और उपाधि के भेद को बनाए रखता है।
- issue: नाबाल की मृत्यु में ईश्वरीय कारण की अभिव्यक्ति
  choice: याहवे ने नाबाल को मारा, और वह मर गया
  alternative: याहवे ने नाबाल को मार डाला
  rationale: मूल में ‘मारा’ और ‘मर गया’ दो क्रमिक क्रियाएँ हैं। चुना हुआ रूप ईश्वरीय न्याय के स्पष्ट कथन को बनाए रखते हुए दोनों क्रियाओं को एक अधिक व्याख्यात्मक मुहावरे में नहीं मिलाता।
translation_notes:
  register: सरल, वर्तमान और गरिमापूर्ण मानक हिंदी अपनाई गई है। ‘मारा’ सामान्य पाठक के लिए स्पष्ट है और मूल क्रिया की सीधाई बनाए रखता है।
