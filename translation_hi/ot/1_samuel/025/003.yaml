  text: וְ/שֵׁ֤ם הָ/אִישׁ֙ נָבָ֔ל וְ/שֵׁ֥ם אִשְׁתּ֖/וֹ אֲבִגָ֑יִל וְ/הָ/אִשָּׁ֤ה טֽוֹבַת שֶׂ֨כֶל֙ וִ֣/יפַת תֹּ֔אַר וְ/הָ/אִ֥ישׁ קָשֶׁ֛ה וְ/רַ֥ע מַעֲלָלִ֖ים וְ/ה֥וּא כ/לב/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/003.yaml
  text: The man's name was Nabal[a], and his wife's name was Abigail. The woman was intelligent and beautiful in appearance, but the man was harsh and evil in his dealings; he was a Calebite.
translation:
  language: hi
  text: उस पुरुष का नाम नाबाल और उसकी पत्नी का नाम अबीगैल था। वह स्त्री समझदार और रूपवती थी, लेकिन वह पुरुष कठोर और बुरे काम करने वाला था; वह कालेबी[a] था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का अर्थ संभवतः “कालेबी,” अर्थात कालेब के कुल का सदस्य है। इसका लिखित रूप असामान्य है, और कुछ विद्वान इसे दूसरी तरह पढ़े जाने की संभावना भी मानते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: נָבָל
  choice: नाबाल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण; नाम के संभावित अर्थ को मुख्य पाठ में व्याख्यायित नहीं किया गया।
- source_word: אֲבִגָיִל
  choice: अबीगैल
  rationale: व्यक्तिवाचक नाम का स्वाभाविक और प्रचलित हिंदी लिप्यंतरण।
- source_word: טוֹבַת שֶׂכֶל
  choice: समझदार
  rationale: शाब्दिक भाव ‘अच्छी समझ वाली’ है; ‘समझदार’ आधुनिक हिंदी में संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: וִיפַת תֹּאַר
  choice: रूपवती
  rationale: यह पद शारीरिक रूप-सौंदर्य को व्यक्त करता है; ‘रूपवती’ गरिमापूर्ण और सहज हिंदी है।
- source_word: קָשֶׁה
  choice: कठोर
  rationale: यह नाबाल के सख्त और अप्रिय स्वभाव को दर्शाता है; ‘कठोर’ मूल अर्थ को स्पष्ट रखता है।
- source_word: רַע מַעֲלָלִים
  choice: बुरे काम करनेवाला
  rationale: מַעֲלָלִים कर्मों और आचरण को सूचित करता है; यह अनुवाद नैतिक नकारात्मकता को बिना अनावश्यक व्याख्या के व्यक्त करता है।
- source_word: כלבו
  choice: कलबी
  rationale: परंपरागत पठन इसे कालेब के कुल से संबंधित जातिवाचक पद मानता है। असामान्य लिखित रूप के कारण दूसरी संभावनाओं को पाद-टिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: וְהוּא כלבו का पठन और अर्थ
  choice: वह कलबी था
  alternative: वह कालेब के घराने का था; असामान्य लिखित रूप को दूसरी तरह भी पढ़ा जा सकता है
  rationale: यह मुख्यतः पाठालोचनात्मक और शब्दार्थ-संबंधी प्रश्न है। पारंपरिक पठन प्रसंग में कुल-संबंधी पहचान देता है, पर लिखित रूप की वास्तविक असामान्यता पाद-टिप्पणी में बताई गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। स्त्री और पुरुष के चरित्रगत विरोध को ‘लेकिन’ से स्पष्ट किया गया है। पाठ में ऐसा कोई आरंभिक कालसूचक शब्द नहीं जोड़ा गया जो इब्रानी स्रोत में नहीं है।
