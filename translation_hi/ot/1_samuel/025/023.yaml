base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/023.yaml
  text: When Abigail saw David[a], she hurried and got down from the donkey, and fell before David on her face and bowed to the ground.
translation:
  language: hi
  text: जब अबीगैल ने दाऊद को देखा, तो वह जल्दी से गधे पर से उतर गई और दाऊद के सामने मुँह के बल गिर पड़ी; उसने भूमि पर झुककर प्रणाम किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि पर दण्डवत हुई।” हिब्रू क्रिया गहरे झुकने या साष्टांग होने का अर्थ दे सकती है; यहाँ यह दाऊद के सामने सम्मान और विनय का कार्य है, आवश्यक नहीं कि आराधना।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתֵּרֶא
  choice: देखा
  rationale: ראה का यहाँ सामान्य अर्थ ‘देखना’ है; ‘देखा’ सहज और प्रसंगानुकूल है।
- source_word: וַתְּמַהֵר
  choice: फुर्ती की
  rationale: מהר तत्काल और शीघ्रता से किए गए कार्य को व्यक्त करता है; यह पद की कथात्मक गति बनाए रखता है।
- source_word: וַתֵּרֶד מֵעַל הַחֲמוֹר
  choice: गधे पर से उतर गई
  rationale: सवारी से नीचे आने की क्रिया को आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַתִּפֹּל לְאַפֵּי דָוִד עַל־פָּנֶיהָ
  choice: दाऊद के सामने मुँह के बल गिर पड़ी
  rationale: ‘सामने’ मूल के संबंधसूचक भाव को और ‘मुँह के बल’ शारीरिक मुद्रा को बिना ‘पाँवों पर’ जोड़ने के सुरक्षित रखता है।
- source_word: וַתִּשְׁתַּחוּ אָרֶץ
  choice: भूमि तक झुककर प्रणाम किया
  rationale: שׁחה यहाँ किसी मनुष्य के प्रति गहरे सम्मान और अधीनता की शारीरिक मुद्रा है; ‘प्रणाम किया’ हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है, जबकि ‘भूमि तक झुककर’ उसकी गहराई बनाए रखता है।
theological_decisions:
- issue: मनुष्य के सामने שׁחה का अर्थ
  choice: भूमि तक झुककर प्रणाम किया
  alternative: भूमि पर दण्डवत हुई / आराधना की
  rationale: यह क्रिया दाऊद के सामने सम्मान और विनय का संकेत है, इसलिए इसे ईश्वरीय आराधना कहना प्रसंग में अनावश्यक धार्मिक अर्थ जोड़ता। ‘दण्डवत’ सम्भव है, पर मुख्य पाठ में ‘प्रणाम’ अधिक सामान्य और स्पष्ट है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथात्मक, गरिमापूर्ण और सामान्य पाठक के लिए सहज। क्रमिक हिब्रू क्रियाओं को दो वाक्यों में बाँटकर प्रवाह सुधारा गया है, जबकि क्रियाओं का क्रम और अबीगैल की विनम्र मुद्रा सुरक्षित रखी गई है।
