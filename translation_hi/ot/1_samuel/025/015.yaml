  text: וְ/הָ֣/אֲנָשִׁ֔ים טֹבִ֥ים לָ֖/נוּ מְאֹ֑ד וְ/לֹ֤א הָכְלַ֨מְנוּ֙ וְ/לֹֽא פָקַ֣דְנוּ מְא֔וּמָה כָּל יְמֵי֙ הִתְהַלַּ֣כְנוּ אִתָּ֔/ם בִּֽ/הְיוֹתֵ֖/נוּ בַּ/שָּׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/015.yaml
  text: Yet the men were very good to us[a], and we were not mistreated[b], nor did we miss anything all the days we went about with them while we were in the field.
translation:
  language: hi
  text: फिर भी वे लोग हमारे साथ बहुत अच्छे रहे; उन्होंने हमारा अपमान नहीं किया[a], और जब तक हम खुले मैदान में उनके साथ घूमते-फिरते रहे, हमारी कोई भी चीज़ गुम नहीं हुई[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उन्होंने हमें लज्जित नहीं किया” अथवा “हमारा निरादर नहीं किया।”
    reason: lexical_alternative
  - marker: b
    text: या “हमारी किसी भी चीज़ की कमी नहीं हुई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָאֲנָשִׁים
  choice: फिर भी वे लोग
  rationale: אֲנָשִׁים का अर्थ ‘लोग/पुरुष’ है। प्रसंग में नाबाल के विरोधी आकलन के विपरीत गवाही होने के कारण waw को ‘फिर भी’ से व्यक्त किया गया है।
- source_word: טֹבִים לָנוּ מְאֹד
  choice: हमारे साथ बहुत अच्छे रहे
  rationale: טוֹבִים לָנוּ यहाँ उनके हितकारी और भले व्यवहार को दर्शाता है; यह सरल इब्रानी अभिव्यक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וְלֹא הָכְלַמְנוּ
  choice: उन्होंने हमारा अपमान नहीं किया
  rationale: כלם के होफाल रूप का मूल भाव लज्जित या अपमानित किया जाना है। सक्रिय हिन्दी वाक्य अधिक स्वाभाविक है और अर्थ को स्पष्ट रखता है।
- source_word: וְלֹא פָקַדְנוּ מְאוּמָה
  choice: हमारी कोई भी चीज़ नहीं खोई
  rationale: नकार के साथ פקד और מְאוּמָה इस प्रसंग में किसी वस्तु के गायब या कम न होने का अर्थ देते हैं।
- source_word: כָּל יְמֵי הִתְהַלַּכְנוּ אִתָּם
  choice: जितने दिन हम ... उनके साथ घूमते-फिरते रहे
  rationale: ‘जितने दिन’ पूरी अवधि और Hitpael הִתְהַלַּכְנוּ निरंतर साथ आने-जाने का भाव व्यक्त करता है।
- source_word: בִּהְיוֹתֵנוּ בַּשָּׂדֶה
  choice: हम मैदान में
  rationale: यह कालसूचक खंड उस समय को खुले चरागाही क्षेत्र में स्थित करता है; ‘मैदान में’ आधुनिक हिन्दी में सहज है।
