  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट शैली। मूल के सरल कथन और उसकी शब्दार्थगत संभावनाओं को पादटिप्पणियों में सुरक्षित रखा गया है।
