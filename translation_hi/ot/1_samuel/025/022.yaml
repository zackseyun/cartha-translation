base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/022.yaml
  text: May God do so to David’s enemies[a], and more also[b], if by morning I leave so much as one male of all who belong to him.
translation:
  language: hi
  text: परमेश्वर दाऊद के शत्रुओं[a] के साथ ऐसा ही करे, और उससे भी अधिक करे, यदि मैं भोर तक उसके लोगों में से एक भी पुरुष[b] को छोड़ दूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ व्याख्याकार ‘दाऊद के शत्रुओं’ को ‘दाऊद’ या ‘मुझ’ के स्थान पर आया हुआ लिपिकीय सौम्यकरण मानते हैं, क्योंकि ऐसे शपथ-सूत्र में बोलने वाला सामान्यतः अपने ही ऊपर शाप बुलाता है।
    reason: textual_variant
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “दीवार के विरुद्ध पेशाब करने वाला”; यह ‘पुरुष’ के लिए प्रयुक्त एक भद्दा मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּה ... וְכֹה יֹסִיף
  choice: ऐसा ही करे, वरन् इससे भी अधिक करे
  rationale: यह इब्रानी शपथ और शाप का प्रचलित सूत्र है। यह हिन्दी रूप उसकी अभिशापात्मक शक्ति को स्वाभाविक और गरिमापूर्ण भाषा में बनाए रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: क्रिया एकवचन है और यहाँ शपथ में एकमात्र परमेश्वर का बोध है।
- source_word: לְאֹיְבֵי דָוִד
  choice: दाऊद के शत्रुओं के साथ
  rationale: मसोरेटिक पाठ की कठिन किन्तु प्रत्यक्ष शब्दावली को मुख्य पाठ में सुरक्षित रखा गया है; अपेक्षित आत्म-अभिशाप वाला अर्थ पादटिप्पणी में दिया गया है।
- source_word: אִם אַשְׁאִיר
  choice: यदि मैं ... जीवित छोड़ूँ
  rationale: אִם शपथ की शर्त प्रस्तुत करता है और שׁאר के हिफ़ील रूप का अर्थ किसी को शेष रहने देना है। हिंसक प्रसंग में ‘जीवित छोड़ूँ’ आशय को स्वाभाविक ढंग से स्पष्ट करता है।
- source_word: מִכָּל אֲשֶׁר לוֹ
  choice: उसके सब लोगों में से
  rationale: शाब्दिक अर्थ ‘जो कुछ उसका है’ है, पर अगला पुरुष-सूचक मुहावरा यहाँ उसके अधीन या उससे संबंधित लोगों की ओर संकेत करता है।
- source_word: עַד הַבֹּקֶר
  choice: भोर तक
  rationale: यह समय-सीमा को संक्षिप्त और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַשְׁתִּין בְּקִיר
  choice: एक भी पुरुष
  rationale: शाब्दिक रूप से यह एक भद्दा पुरुष-सूचक मुहावरा है, ‘दीवार पर पेशाब करने वाला।’ मुख्य पाठ में उसका आशय स्पष्ट रखा गया और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: शपथ-सूत्र में मसोरेटिक पाठ ‘दाऊद के शत्रुओं’
  choice: मुख्य पाठ में ‘दाऊद के शत्रुओं’ को बनाए रखना
  alternative: इसे ‘दाऊद’ या ‘मेरे साथ’ समझना
  rationale: प्रदत्त WLC पाठ को बिना मौन संशोधन के अनूदित किया गया है। सामान्य शपथ-सूत्र के अनुसार कठिनाई वास्तविक है, इसलिए संभावित लेखककीय विनम्रोक्ति या पाठगत परिवर्तन की व्याख्या पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्वाभाविक, गरिमापूर्ण कथात्मक स्तर अपनाया गया है। शपथ की कठोरता बनाए रखी गई है, जबकि अशिष्ट इब्रानी मुहावरे का स्पष्ट अर्थ मुख्य पाठ में और उसका शाब्दिक रूप पादटिप्पणी में दिया गया है।
