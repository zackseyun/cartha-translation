  text: וַ/יִּקַּ֤ח דָּוִד֙ מִ/יָּדָ֔/הּ אֵ֥ת אֲשֶׁר הֵבִ֖יאָה ל֑/וֹ וְ/לָ֣/הּ אָמַ֗ר עֲלִ֤י לְ/שָׁלוֹם֙ לְ/בֵיתֵ֔/ךְ רְאִי֙ שָׁמַ֣עְתִּי בְ/קוֹלֵ֔/ךְ וָ/אֶשָּׂ֖א פָּנָֽיִ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/035.yaml
  text: So David took from her hand what she had brought him[a], and he said to her, “Go up in peace to your house. See, I have listened to your voice and accepted you.”
translation:
  language: hi
  text: तब दाऊद ने उसके हाथ से वह लिया जो वह उसके लिए लाई थी, और उससे कहा, “शान्ति से अपने घर जाओ। देखो, मैंने तुम्हारी बात मान ली है और तुम पर अनुग्रह किया है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारी विनती स्वीकार की है”; इब्रानी में शाब्दिक रूप से, “तुम्हारा मुख उठाया है।”
    reason: इब्रानी मुहावरा अनुकूलता दिखाने और किसी की विनती स्वीकार करने—दोनों भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַיִּקַּח דָּוִד מִיָּדָהּ
  choice: दाऊद ने उसके हाथ से ... ले लिया
  rationale: ‘लेना’ मूल क्रिया לקח का सीधा अर्थ है, और ‘उसके हाथ से’ इब्रानी की सजीव अभिव्यक्ति को बनाए रखता है।
- source_word: אֵת אֲשֶׁר הֵבִיאָה לוֹ
  choice: वह सब ... जो वह उसके लिए लाई थी
  rationale: यह अबीगैल द्वारा दाऊद के लिए लाई गई सामग्री को स्वाभाविक हिन्दी में व्यक्त करता है; ‘वह सब’ प्रसंग में सामूहिक भेंट-सामग्री के अर्थ को स्पष्ट करता है।
- source_word: עֲלִי לְשָׁלוֹם לְבֵיתֵךְ
  choice: शान्ति से अपने घर लौट जाओ
  rationale: עלה का शाब्दिक अर्थ ‘ऊपर जाना’ है, पर यहाँ विदाई और घर वापस जाने का भाव प्रमुख है। ‘लौट जाओ’ आधुनिक हिन्दी में स्वाभाविक है और לְשָׁלוֹם को ‘शान्ति से’ सुरक्षित रखता है।
- source_word: רְאִי
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला स्त्रीलिंग एकवचन आदेश है; ‘देखो’ वर्तमान हिन्दी में सहज और गरिमापूर्ण है।
- source_word: שָׁמַעְתִּי בְקוֹלֵךְ
  choice: मैंने तुम्हारी बात मान ली है
  rationale: शाब्दिक रूप ‘मैंने तुम्हारी आवाज़ सुनी’ है, किन्तु इस प्रसंग में इसका आशय अबीगैल की विनती पर ध्यान देकर उसे मान लेना है। हिन्दी मुहावरा ‘बात मानना’ अर्थ को ठीक और स्वाभाविक ढंग से पहुँचाता है।
- source_word: וָאֶשָּׂא פָּנָיִךְ
  choice: तुम पर अनुग्रह किया है
  rationale: शाब्दिक मुहावरा ‘तुम्हारा मुख उठाया’ किसी की विनती स्वीकार करने या उस पर कृपा/अनुग्रह करने को दर्शाता है। मुख्य पाठ में अर्थ दिया गया है और शाब्दिक चित्र फुटनोट में सुरक्षित है।
theological_decisions:
- issue: וָאֶשָּׂא פָּנָיִךְ में कृपा अथवा स्वीकार किए जाने का मुहावरा
  choice: तुम पर अनुग्रह किया है
  alternative: तुम्हारी विनती स्वीकार की है; शाब्दिक रूप से, तुम्हारा मुख उठाया है
  rationale: यहाँ दाऊद अबीगैल की विनती मानकर उसके प्रति अनुकूलता दिखाता है। ‘अनुग्रह किया’ व्यक्तिगत कृपा का भाव बनाए रखता है, जबकि फुटनोट मुहावरे की वास्तविक बहुअर्थता और उसका शाब्दिक चित्र बताता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। संवाद में ‘तुम’ स्त्रीलिंग एकवचन संबोधन के अनुरूप है। ‘शान्ति’ की पारंपरिक वर्तनी अपनाई गई है; भाषा को अनावश्यक रूप से संस्कृतनिष्ठ नहीं बनाया गया।
