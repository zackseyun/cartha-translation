  text: She fell at his feet and said[a], “On me, my lord, be the guilt. Please let your servant speak in your hearing[b], and hear the words of your servant.”
translation:
  language: hi
  text: वह उसके पैरों पर गिर पड़ी और बोली[a], “मेरे स्वामी, दोष मुझ पर हो। कृपया अपनी दासी को बोलने दीजिए और अपनी दासी की बातें सुनिए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे स्वामी, दोष मेरा है।” इब्रानी में यह अपने ऊपर दोष लेने का संक्षिप्त मुहावरा है; इसका शाब्दिक रूप है, “मुझ पर, मेरे स्वामी, दोष।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּפֹּל עַל רַגְלָיו
  choice: वह उसके पैरों पर गिर पड़ी
  rationale: यह इब्रानी मुहावरा विनती और अधीनता की शारीरिक मुद्रा व्यक्त करता है। यह अनुवाद मूल चित्र को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בִּי אֲנִי אֲדֹנִי הֶעָוֹן
  choice: मेरे स्वामी, दोष मुझ पर ही हो
  rationale: मूल का संक्षिप्त वाक्यांश अपने ऊपर दोष लेने का विनम्र मुहावरा है। ‘मुझ पर ही हो’ इब्रानी पूर्वसर्गीय बल को बनाए रखता है, जबकि ‘दोष’ कथात्मक प्रसंग में सहज और स्पष्ट है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यहाँ अबीगैल दाऊद को आदरपूर्वक संबोधित करती है; यह परमेश्वर के लिए प्रयुक्त उपाधि नहीं है। ‘मेरे स्वामी’ सामाजिक आदर और औपचारिकता दोनों को व्यक्त करता है।
- source_word: וּתְדַבֶּר נָא
  choice: कृपया ... कुछ कहने दें
  rationale: नָא के साथ यह रूप विनम्र निवेदन है। हिन्दी में अनुमति माँगने की स्वाभाविक अभिव्यक्ति के रूप में ‘कृपया ... कहने दें’ चुना गया है।
- source_word: אֲמָתְךָ / אֲמָתֶךָ
  choice: अपनी दासी
  rationale: इब्रानी संज्ञा विशेष रूप से स्त्री सेविका को सूचित करती है। ‘दासी’ आधुनिक हिन्दी में संक्षिप्त, स्वाभाविक और वक्ता की आत्म-विनम्रता के अनुरूप है; मूल की पुनरावृत्ति भी रखी गई है।
- source_word: בְּאָזְנֶיךָ
  choice: आपसे कुछ कहने
  rationale: शाब्दिक अर्थ ‘आपके कानों में’ है, पर यह किसी को सुनाई देने योग्य ढंग से बोलने का मुहावरा है। ‘आपसे कुछ कहने’ हिन्दी संवाद में अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּשְׁמַע אֵת דִּבְרֵי
  choice: और ... की बात सुनें
  rationale: ‘बात सुनें’ हिन्दी में ‘शब्दों को सुनें’ की अपेक्षा अधिक स्वाभाविक है और ध्यान देकर सुनने के आग्रह को स्पष्ट रखता है।
