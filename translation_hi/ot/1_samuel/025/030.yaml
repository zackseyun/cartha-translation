  yaml_path: translation/ot/1_samuel/025/030.yaml
  text: And when Yahweh has done for my lord according to all the good that he spoke concerning you[a], and has appointed you ruler over Israel[b],
translation:
  language: hi
  text: और जब यहोवा मेरे प्रभु के लिए वह सारी भलाई कर चुका होगा जो उसने आपके विषय में कही है[a], और आपको इस्राएल पर शासक नियुक्त कर चुका होगा[b],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह भलाई जिसकी उसने आपसे प्रतिज्ञा की थी।” इब्रानी में शाब्दिक रूप से उस “भलाई” की बात है जो यहोवा ने दाऊद के विषय में कही थी।
    reason: lexical_alternative
  - marker: b
    text: या, “आपको इस्राएल का अगुआ होने की आज्ञा दे चुका होगा।” यहाँ प्रयुक्त क्रिया का सामान्य अर्थ “आज्ञा देना” है, पर इस संदर्भ में इसका भाव शासन के लिए नियुक्त या अधिकृत करना भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: और जब
  rationale: यह इब्रानी मुहावरा भविष्य की परिस्थिति का परिचय देता है; ‘और जब’ आधुनिक हिन्दी में स्वाभाविक रहते हुए उसका भाव सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: לַאדֹנִי
  choice: मेरे प्रभु के लिए
  rationale: अबigail दाऊद को आदरपूर्वक संबोधित करती है। ‘मेरे प्रभु’ सामाजिक और कथात्मक संदर्भ में स्वाभाविक है; לְ का संबंध यहोवा द्वारा दाऊद के हित में किए जाने वाले कार्य से है।
- source_word: כְּכֹל אֲשֶׁר דִּבֶּר אֶת הַטּוֹבָה עָלֶיךָ
  choice: वह सारी भलाई ... जिसके विषय में उसने आपसे कहा था
  rationale: דבר के सामान्य अर्थ ‘कहना/बोलना’ को रखा गया है और ‘प्रतिज्ञा’ को मुख्य पाठ में जोड़कर आशय को अनावश्यक रूप से निश्चित नहीं किया गया। עָלֶיךָ का संदर्भगत अर्थ ‘आपके विषय में/आपसे संबंधित’ है।
- source_word: וְצִוְּךָ
  choice: और आपको ... नियुक्त कर चुका होगा
  rationale: צוה प्रायः ‘आज्ञा देना’ है, पर לְנָגִיד के साथ यहाँ किसी पद के लिए अधिकारपूर्वक ठहराने या नियुक्त करने का भाव है।
- source_word: לְנָגִיד עַל יִשְׂרָאֵל
  choice: इस्राएल पर शासक
  rationale: נָגִיד अधिकार प्राप्त अगुए या शासक को दर्शाता है, और עַל यहाँ इस्राएल पर अधिकार का संबंध व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में ईश्वरीय नाम प्रत्यक्ष रूप से है। हिन्दी पाठकों में परिचित ‘यहोवा’ नाम को रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: דבר द्वारा कही गई ‘भलाई’ का स्वरूप
  choice: जिसके विषय में उसने आपसे कहा था
  alternative: जिसकी उसने आपसे प्रतिज्ञा की थी
  rationale: संदर्भ में यह प्रतिज्ञा का भाव रख सकता है, किंतु मूल क्रिया केवल ‘कहना/बोलना’ है; इसलिए मुख्य पाठ मूल की व्यापकता बनाए रखता है और प्रतिज्ञा वाला अर्थ पादटिप्पणी में दिया गया है।
- issue: צוה का पद-स्थापन संबंधी अर्थ
  choice: नियुक्त कर चुका होगा
  alternative: आपको इस्राएल का अगुआ होने की आज्ञा दे चुका होगा
  rationale: क्रिया का मूल अर्थ ‘आज्ञा देना’ हो सकता है, किंतु לְנָגִיד के साथ प्रसंग में दाऊद को शासन के लिए ठहराने या नियुक्त करने का अर्थ अधिक स्वाभाविक है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और कथात्मक है। अबीगैल द्वारा दाऊद के लिए प्रयुक्त सम्मानसूचक संबोधन के अनुरूप ‘आप’ और ‘मेरे प्रभु’ रखा गया है। पद अगले वाक्यांश की ओर बढ़ता है, इसलिए अंत में अल्पविराम रखा गया है।
