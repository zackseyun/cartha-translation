base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/014.yaml
  text: But one of the young men told Abigail[a], Nabal’s wife, saying, “Look, David sent messengers from the wilderness to greet our master[b], and he shouted at them.”
translation:
  language: hi
  text: पर नाबाल की पत्नी अबीगैल को जवानों में से एक ने बताया, “देखिए, दाऊद ने जंगल से हमारे स्वामी का कुशल-मंगल पूछने[a] के लिए दूत भेजे थे, और वह उन पर बरस पड़ा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “हमारे स्वामी को आशीर्वाद देने।” यहाँ अर्थ संभवतः आदरपूर्वक अभिवादन करना या कुशल-मंगल पूछना है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह उन पर झपट पड़ा” या “उन पर चिल्लाया।” इब्रानी क्रिया तीखे और आक्रामक प्रकोप का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲבִיגַיִל
  choice: पर ... अबीगैल को
  rationale: वाव कथा को आगे बढ़ाते हुए पिछले प्रसंग के विपरीत मोड़ को दिखाता है; हिंदी में ‘पर’ यह संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: נַעַר אֶחָד מֵהַנְּעָרִים
  choice: जवानों में से एक
  rationale: यह मूल पदबंध के व्यापक अर्थ को बनाए रखता है; घरेलू संदर्भ में वे सेवक हैं, पर मूल शब्द केवल ‘सेवक’ तक सीमित नहीं है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: ध्यान आकर्षित करने वाले निपात का आधुनिक, आदरसूचक और स्वाभाविक हिंदी रूप।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यहाँ मनुष्य द्वारा भेजे गए संदेशवाहक अभिप्रेत हैं; ‘दूत’ संक्षिप्त और संदर्भानुकूल है।
- source_word: מֵהַמִּדְבָּר
  choice: जंगल से
  rationale: इस संदर्भ में מִדְבָּר निर्जन वन-प्रदेश को सूचित करता है; हिंदी बाइबलीय कथन में ‘जंगल’ सहज और बोधगम्य है।
- source_word: לְבָרֵךְ
  choice: कुशल-मंगल पूछने
  rationale: ברך का मूल अर्थ ‘आशीर्वाद देना’ है, पर सामाजिक भेंट के इस संदर्भ में यह आदरपूर्ण अभिवादन और कुशलक्षेम पूछने का भाव देता है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: אֶת אֲדֹנֵינוּ
  choice: हमारे स्वामी का
  rationale: यह घराने के सेवकों द्वारा नाबाल के लिए प्रयुक्त सामाजिक संबोधन है, कोई ईश्वरीय उपाधि नहीं।
- source_word: וַיָּעַט בָּהֶם
  choice: पर उन्होंने उन पर झल्लाकर कठोर बातें कहीं
  rationale: दुर्लभ क्रिया עוט यहाँ तीखे, आक्रामक प्रकोप का संकेत देती है। संदर्भ मौखिक दुर्व्यवहार का है; यह हिंदी रूप उसकी जीवंतता बनाए रखते हुए अनिश्चित बिंब को अति-शाब्दिक नहीं बनाता।
