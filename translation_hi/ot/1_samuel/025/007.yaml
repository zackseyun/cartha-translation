  text: וְ/עַתָּ֣ה שָׁמַ֔עְתִּי כִּ֥י גֹזְזִ֖ים לָ֑/ךְ עַתָּ֗ה הָ/רֹעִ֤ים אֲשֶׁר לְ/ךָ֙ הָי֣וּ עִמָּ֔/נוּ לֹ֣א הֶכְלַמְנ֗וּ/ם וְ/לֹֽא נִפְקַ֤ד לָ/הֶם֙ מְא֔וּמָה כָּל יְמֵ֖י הֱיוֹתָ֥/ם בַּ/כַּרְמֶֽל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/007.yaml
  text: And now I have heard that you have shearers. Now your shepherds[a], who were with us, we did not mistreat, and nothing of theirs was missing all the days they were in Carmel.
translation:
  language: hi
  text: और अब मैंने सुना है कि तुम्हारी भेड़ों की ऊन कतरी जा रही है। अब तुम्हारे जो चरवाहे हमारे साथ रहे, उनके साथ हमने दुर्व्यवहार नहीं किया[a], और जितने दिन वे कर्मेल में रहे, उनकी कोई भी चीज़ गायब नहीं हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “हमने उन्हें लज्जित नहीं किया।” इब्रानी क्रिया किसी को अपमानित या लज्जित करने का अर्थ दे सकती है; इस प्रसंग में आशय चरवाहों को हानि न पहुँचाने या उनके साथ बुरा व्यवहार न करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה שָׁמַעְתִּי
  choice: और अब मैंने सुना है
  rationale: संयोजक और वर्तमान प्रसंग की ओर संक्रमण—दोनों को बनाए रखता है; पूर्ण क्रिया का वर्तमान से संबंध हिन्दी के ‘सुना है’ में स्वाभाविक रूप से व्यक्त होता है।
- source_word: כִּי גֹזְזִים לָךְ
  choice: कि तुम्हारी भेड़ों की ऊन कतरी जा रही है
  rationale: इब्रानी कृदन्त और हितसूचक सर्वनाम नाबाल के यहाँ चल रहे ऊन-कतराई के अवसर को सूचित करते हैं। हिन्दी में यह रूप ‘तुम्हारे लिए कतरनेवाले हैं’ से अधिक स्पष्ट और स्वाभाविक है।
- source_word: עַתָּה
  choice: अब
  rationale: मूल में दूसरी बार आए विमर्श-सूचक ‘अब’ को वक्तव्य की अलंकारिक संरचना बनाए रखने के लिए रखा गया है।
- source_word: הָרֹעִים אֲשֶׁר לְךָ הָיוּ עִמָּנוּ
  choice: तुम्हारे जो चरवाहे हमारे साथ रहे
  rationale: स्वामित्व और ‘हमारे साथ’ के संबंध को बिना अतिरिक्त व्याख्या के सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא הֶכְלַמְנוּם
  choice: उनके साथ हमने दुर्व्यवहार नहीं किया
  rationale: हिफ़ील रूप का मूल अर्थ लज्जित या अपमानित करना हो सकता है, पर इस पशुपालकीय सुरक्षा-प्रसंग में इसमें हानि पहुँचाने और बुरा व्यवहार करने का व्यावहारिक भाव है। मुख्य पाठ में ‘दुर्व्यवहार’ संदर्भानुकूल है और अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְלֹא נִפְקַד לָהֶם מְאוּמָה
  choice: उनकी कोई भी चीज़ गायब नहीं हुई
  rationale: निफ़ाल रूप किसी वस्तु के न मिलने या हिसाब से गायब होने को दर्शाता है। स्वामित्वसूचक हिन्दी अभिव्यक्ति स्पष्ट करती है कि चरवाहों की कोई संपत्ति नहीं खोई।
- source_word: כָּל יְמֵי הֱיוֹתָם בַּכַּרְמֶל
  choice: जितने दिन वे कर्मेल में रहे
  rationale: मूल की संपूर्ण अवधि को स्वाभाविक हिन्दी में व्यक्त करता है और कर्मेल को यहूदा के स्थान-नाम के रूप में रखता है।
