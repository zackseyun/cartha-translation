  yaml_path: translation/ot/1_samuel/025/033.yaml
  text: And blessed be your judgment[a], and blessed be you[c][b], who have kept me this day from coming into bloodshed and from saving myself by my own hand.
translation:
  language: hi
  text: और धन्य है तुम्हारा विवेक[a], और धन्य हो तुम, जिसने आज मुझे रक्तपात में पड़ने[b] और अपने ही हाथ से अपने को बचाने[c] से रोक लिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘तुम्हारी सूझ-बूझ’ अथवा ‘तुम्हारी परख’।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से ‘रक्तों में आने’; इसका अर्थ ‘रक्तदोष में पड़ने’ का भाव भी दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अपने ही हाथ से अपना बदला लेने’। हिब्रू में अपने हाथ से अपने लिए बचाव या छुटकारा हासिल करने का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָרוּךְ טַעְמֵךְ
  choice: और धन्य है तुम्हारा विवेक
  rationale: טַעַם यहाँ अबीगैल की समझ, परख और विवेकपूर्ण सलाह को दर्शाता है। ‘विवेक’ आधुनिक हिन्दी में स्वाभाविक है और प्रसंग के नैतिक तथा व्यावहारिक दोनों पक्षों को समेटता है।
- source_word: וּבְרוּכָה אָתְּ
  choice: और धन्य हो तुम
  rationale: स्त्रीलिंग संबोधन को स्पष्ट रखते हुए यह आशीर्वचन की ऊँची, किंतु स्वाभाविक हिन्दी शैली बनाए रखता है।
- source_word: כְּלִתִנִי הַיּוֹם הַזֶּה
  choice: जिसने आज मुझे ... से रोक लिया है
  rationale: क्रिया यहाँ रोकने या निरुद्ध करने का भाव देती है। ‘आज’ हिब्रू काल-सूचक पद का सहज आधुनिक हिन्दी रूप है।
- source_word: מִבּוֹא בְדָמִים
  choice: खून बहाने
  rationale: शाब्दिक रूप ‘रक्तों में आने’ है, पर हिब्रू बहुवचन דָּמִים इस प्रसंग में हिंसक रक्तपात को सूचित करता है। ‘खून बहाने’ ठोस और सामान्य पाठक के लिए स्पष्ट है; रक्तदोष की संभव छाया पादटिप्पणी में रखी गई है।
- source_word: וְהֹשֵׁעַ יָדִי לִי
  choice: और अपने ही हाथ से अपना बदला लेने
  rationale: शाब्दिक संरचना में अपने हाथ से अपने लिए बचाव या छुटकारा हासिल करने का भाव है, पर कथा-संदर्भ में यह निजी प्रतिशोध द्वारा स्वयं न्याय करने को सूचित करता है। ‘अपना बदला लेने’ प्रसंगगत अर्थ स्पष्ट करता है, जबकि शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: דָמִים में रक्तपात और रक्तदोष के बीच अर्थ-छाया
  choice: मुख्य पाठ में ‘खून बहाने’
  alternative: ‘रक्तदोष में पड़ने’
  rationale: दाऊद जिस हिंसक कार्य को करने जा रहा था, वह तत्काल कथात्मक केंद्र है; फिर भी मूल बहुवचन उससे उपजने वाले रक्तदोष की ओर भी संकेत कर सकता है, इसलिए उस अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וְהֹשֵׁעַ יָדִי לִי में आत्मरक्षा/छुटकारे और निजी प्रतिशोध का तनाव
  choice: मुख्य पाठ में ‘अपने ही हाथ से अपना बदला लेने’
  alternative: ‘अपने ही हाथ से अपने लिए छुटकारा पाने’ अथवा ‘अपने को बचाने’
  rationale: संदर्भ निजी प्रतिशोध का है, पर ישׁע का मूल अर्थ बचाना या छुड़ाना है। मुख्य पाठ कथा का आशय देता है और पादटिप्पणी मूल की शब्दगत अस्पष्टता को बनाए रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली रखी गई है। ‘धन्य’ आशीर्वचन की बाइबिलीय ऊँचाई बनाए रखता है, जबकि ‘विवेक’, ‘खून बहाने’ और ‘बदला लेने’ सामान्य पाठकों के लिए तुरंत बोधगम्य हैं।
