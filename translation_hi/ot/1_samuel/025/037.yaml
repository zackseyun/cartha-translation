  text: וַ/יְהִ֣י בַ/בֹּ֗קֶר בְּ/צֵ֤את הַ/יַּ֨יִן֙ מִ/נָּבָ֔ל וַ/תַּגֶּד ל֣/וֹ אִשְׁתּ֔/וֹ אֶת הַ/דְּבָרִ֖ים הָ/אֵ֑לֶּה וַ/יָּ֤מָת לִבּ/וֹ֙ בְּ/קִרְבּ֔/וֹ וְ/ה֖וּא הָיָ֥ה לְ/אָֽבֶן־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/037.yaml
  text: And in the morning[a], when the wine had gone out of Nabal, his wife told him these things, and his heart died within him[b], and he became like a stone.
translation:
  language: hi
  text: सुबह, जब नाबाल का नशा उतर गया, उसकी पत्नी ने उसे ये बातें बताईं। तब उसका हृदय उसके भीतर मर गया, और वह पत्थर-सा हो गया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַבֹּקֶר
  choice: सुबह
  rationale: यह सामान्य कालवाचक अभिव्यक्ति है; ‘सुबह’ स्वाभाविक, संक्षिप्त और मूल के निकट है।
- source_word: בְּצֵאת הַיַּיִן מִנָּבָל
  choice: जब नाबाल पर से दाखमधु का नशा उतर गया था
  rationale: शाब्दिक चित्र ‘जब दाखमधु नाबाल से निकल गया’ है। हिन्दी में उस चित्र का आशय स्पष्ट और स्वाभाविक रूप से बताने के लिए ‘नशा उतर गया’ चुना गया है; पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
- source_word: וַתַּגֶּד לוֹ אִשְׁתּוֹ
  choice: उसकी पत्नी ने उसे ... बताईं
  rationale: हिफ़िल रूप का सामान्य अर्थ ‘बताना/सूचित करना’ है। ‘बताईं’ आधुनिक कथात्मक हिन्दी में सहज है।
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דברים का अर्थ ‘बातें, विषय, घटनाएँ’ हो सकता है। प्रसंग में अबीगैल पिछली घटनाएँ सुना रही है; ‘ये सारी बातें’ उसका व्यापक अर्थ व्यक्त करता है।
- source_word: וַיָּמָת לִבּוֹ בְּקִרְבּוֹ
  choice: उसका हृदय उसके भीतर मानो मर गया
  rationale: मूल की सजीव छवि को बनाए रखा गया है। ‘मानो’ हिन्दी में इसे चिकित्सकीय मृत्यु के शाब्दिक दावे के बजाय उपमा-सदृश वर्णन के रूप में स्वाभाविक बनाता है, जबकि हृदय के ‘मर जाने’ की मूल अभिव्यक्ति सुरक्षित रहती है।
- source_word: וְהוּא הָיָה לְאָבֶן
  choice: वह पत्थर-सा हो गया
  rationale: यह मूल के ‘पत्थर हो गया/पत्थर के समान हो गया’ का स्वाभाविक हिन्दी रूप है और उसकी दशा का कोई निश्चित चिकित्सकीय निदान नहीं करता।
theological_decisions:
- issue: नाबाल की अवस्था को किसी निश्चित चिकित्सकीय घटना के रूप में समझाना या मूल की चित्रात्मक भाषा बनाए रखना
  choice: ‘उसका हृदय उसके भीतर मानो मर गया, और वह पत्थर-सा हो गया’—मूल की चित्रात्मक भाषा सुरक्षित रखी गई।
  alternative: उसे दिल का दौरा पड़ा; उसे लकवा मार गया; उसका हृदय काम करना बंद कर गया।
  rationale: इब्रानी पाठ सजीव कथात्मक बिंब देता है, तकनीकी चिकित्सकीय निदान नहीं। इसलिए अनुवाद सदमा, हृदयाघात, पक्षाघात या किसी अन्य अवस्था को निश्चित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक स्तर रखा गया है। ‘दाखमधु’ बाइबलीय प्रसंग के अनुरूप है, जबकि ‘नशा उतर गया’ साधारण पाठक के लिए तत्काल बोधगम्य है। मूल की चिकित्सकीय रूप से अनिश्चित चित्रात्मक भाषा को पादटिप्पणी सहित सुरक्षित रखा गया है।
