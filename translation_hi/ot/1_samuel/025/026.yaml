source:
  edition: WLC
  text: וְ/עַתָּ֣ה אֲדֹנִ֗/י חַי יְהוָ֤ה וְ/חֵֽי נַפְשְׁ/ךָ֙ אֲשֶׁ֨ר מְנָעֲ/ךָ֤ יְהוָה֙ מִ/בּ֣וֹא בְ/דָמִ֔ים וְ/הוֹשֵׁ֥עַ יָדְ/ךָ֖ לָ֑/ךְ וְ/עַתָּ֗ה יִֽהְי֤וּ כְ/נָבָל֙ אֹיְבֶ֔י/ךָ וְ/הַֽ/מְבַקְשִׁ֥ים אֶל אֲדֹנִ֖/י רָעָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/026.yaml
  text: '[A], my lord, as Yahweh lives and as you yourself live, since Yahweh has kept you from bloodguilt and from saving yourself by your own hand[b], now let your enemies and those who seek evil against my lord be like Nabal.'
translation:
  language: hi
  text: अब, मेरे प्रभु, याहवे के जीवन की और आपके जीवन की शपथ, याहवे ने आपको रक्तपात का दोष अपने ऊपर लेने और अपने ही हाथ से अपने लिए उद्धार करने[a] से रोका है। अब आपके शत्रु और मेरे प्रभु के विरुद्ध बुराई चाहने वाले नाबाल[b] के समान हो जाएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'प्रसंग में इसका अधिक स्पष्ट अर्थ हो सकता है: “अपने ही हाथ से अपना बदला लेने।”'
    reason: lexical_alternative
  - marker: b
    text: यहाँ “नाबाल” मुख्यतः उस व्यक्ति का नाम है; इब्रानी में यह नाम “मूर्ख” के लिए प्रयुक्त शब्द की भी याद दिलाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब / इसलिए अब
  rationale: पद में यह अभिव्यक्ति दो बार आती है। पहली बार यह अबीगैल की बात के इस निर्णायक चरण को आरम्भ करती है; दूसरी बार परिणाम या कामना की ओर बढ़ते हुए ‘इसलिए अब’ स्वाभाविक हिन्दी में उसका संबंध स्पष्ट करता है।
- source_word: אֲדֹנִי
  choice: मेरे प्रभु
  rationale: अबीगैल दाऊद को आदरपूर्वक संबोधित करती है। ‘मेरे प्रभु’ सम्मानसूचक मानवीय संबोधन को बनाए रखता है और यहाँ ईश्वरीय उपाधि नहीं है।
- source_word: חַי יְהוָה וְחֵי נַפְשְׁךָ
  choice: जीवित याहवे की और आपके जीवन की शपथ
  rationale: यह याहवे और संबोधित व्यक्ति के जीवन को साक्षी मानने वाला शपथ-सूत्र है। यह हिन्दी रूप अर्थ को स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करता है; נֶפֶשׁ यहाँ पूरे व्यक्ति के जीवन को सूचित करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम के लिप्यंतरण को सुरक्षित रखा गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: מְנָעֲךָ
  choice: आपको ... से रोका है
  rationale: क्रिया का अर्थ किसी को कार्य करने से रोकना या विरत रखना है; यह रूप आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: מִבּוֹא בְדָמִים
  choice: खून का दोष मोल लेने
  rationale: शाब्दिक रूप ‘खूनों में आने’ का प्रसंगगत आशय केवल रक्तपात नहीं, बल्कि अनुचित रक्त बहाकर उसका नैतिक दोष अपने ऊपर लेना है।
- source_word: וְהוֹשֵׁעַ יָדְךָ לָךְ
  choice: अपने ही हाथ से अपना उद्धार करने
  rationale: कठिन इब्रानी मुहावरे में ישׁע का मूल भाव बचाने या छुड़ाने का है और ‘हाथ’ स्वयं की कार्रवाई को सूचित करता है। मुख्य पाठ इस शब्दार्थ को बनाए रखता है; प्रतिशोध का प्रसंगगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: יִהְיוּ כְנָבָל
  choice: नाबाल के समान हो जाएँ
  rationale: तत्काल प्रसंग में נָבָל अबीगैल के पति का नाम है, इसलिए नाम को मुख्य पाठ में रखा गया है; ‘मूर्ख’ का शब्द-संकेत पादटिप्पणी में सुरक्षित है।
- source_word: אֹיְבֶיךָ וְהַמְבַקְשִׁים אֶל אֲדֹנִי רָעָה
  choice: आपके शत्रु और मेरे प्रभु का बुरा चाहनेवाले
  rationale: यह उन लोगों के लिए स्वाभाविक हिन्दी अभिव्यक्ति है जो किसी की हानि या बुराई चाहते हैं, और רָעָה के ‘बुरा’ अर्थ को बनाए रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को लिप्यंतरित करना नाम और उपाधि के बीच का भेद बनाए रखता है।
- issue: दाऊद को रोके गए कार्य का आशय
  choice: खून का दोष मोल लेना और अपने हाथ से अपना उद्धार करना
  alternative: खून बहाना और अपने हाथ से बदला लेना
  rationale: मुख्य पाठ रक्तपात के नैतिक दोष तथा ישׁע के बचाने/छुड़ाने वाले मूल अर्थ को बनाए रखता है। साथ ही प्रसंग में निजी हिंसक प्रतिशोध का आशय वास्तविक है, इसलिए उसे पादटिप्पणी में स्पष्ट किया गया है, न कि मूल की कठिनता को चुपचाप समाप्त किया गया है।
- issue: नाबाल नाम में निहित शब्द-संकेत
  choice: मुख्य पाठ में व्यक्ति का नाम ‘नाबाल’
  alternative: ‘मूर्ख’
  rationale: यहाँ प्राथमिक निर्देश अबीगैल के पति नाबाल की ओर है, पर नाम का ‘मूर्ख’ से संबंध अर्थपूर्ण है और पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, आदरपूर्ण और कथात्मक है। दाऊद के लिए बहुवचन-आदर ‘आप’ रखा गया है। शपथ-सूत्र को शाब्दिक रूप से अस्वाभाविक ‘जैसे ... जीवित है’ कहने के बजाय हिन्दी के स्वाभाविक ‘जीवन की शपथ’ रूप में व्यक्त किया गया है। कठिन प्रतिशोध/उद्धार मुहावरे और नाबाल नाम के शब्द-संकेत को पादटिप्पणियों सहित सुरक्षित रखा गया है।
