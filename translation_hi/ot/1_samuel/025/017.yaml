source:
  edition: WLC
  text: וְ/עַתָּ֗ה דְּעִ֤י וּ/רְאִי֙ מַֽה תַּעֲשִׂ֔י כִּֽי כָלְתָ֧ה הָ/רָעָ֛ה אֶל אֲדֹנֵ֖י/נוּ וְ/עַ֣ל כָּל בֵּית֑/וֹ וְ/הוּא֙ בֶּן בְּלִיַּ֔עַל מִ/דַּבֵּ֖ר אֵלָֽי/ו־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/017.yaml
  text: Now know this and consider what you should do[a], for disaster has been determined against our master and against all his household, and he is such a worthless man that one cannot speak to him.
translation:
  language: hi
  text: अब यह जान लो और विचार करो कि तुम्हें क्या करना चाहिए, क्योंकि हमारे स्वामी और उसके सारे घराने के विरुद्ध विपत्ति निश्चित हो चुकी है। वह ऐसा नीच आदमी[a] है कि कोई उससे बात नहीं कर सकता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ, “निकम्मेपन का पुत्र”; परंपरागत रूप से, “बिलियाल का पुत्र।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह सेवक की बात में तत्काल और अत्यावश्यक मोड़ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: דְּעִי וּרְאִי
  choice: यह जान लो और विचार करो
  rationale: दोनों स्त्रीलिंग एकवचन आज्ञार्थक क्रियाओं को बनाए रखा गया है। इस प्रसंग में ראה का आशय केवल देखना नहीं, बल्कि परिस्थिति पर विचार करना है।
- source_word: מַה תַּעֲשִׂי
  choice: कि तुम्हें क्या करना चाहिए
  rationale: यह विचाराधीन भावी कार्य और सेवक की तत्काल व्यावहारिक अपील को व्यक्त करता है, बिना इसे मूल से अधिक कठोर आदेश बनाए।
- source_word: כָלְתָה הָרָעָה
  choice: विपत्ति आ पड़ना तय हो चुका है
  rationale: यह इब्रानी मुहावरा आसन्न हानि के निश्चित या ठहर चुके होने का भाव देता है; प्रसंग में 'विपत्ति' नैतिक 'बुराई' से अधिक स्पष्ट है।
- source_word: אֶל אֲדֹנֵינוּ וְעַל כָּל בֵּיתוֹ
  choice: हमारे स्वामी और उसके सारे घराने पर
  rationale: '''स्वामी'' घरेलू अधिकार-संबंध के लिए उपयुक्त है और ''घराना'' यहाँ भवन के बजाय उससे जुड़े लोगों और संपत्ति को समेटता है।'
- source_word: בֶּן בְּלִיַּעַל
  choice: निकम्मा आदमी
  rationale: यहाँ इब्रानी पद एक अधम, अनुपयोगी और हठी व्यक्ति के लिए मुहावरा है; इसे किसी दुष्ट आत्मा के व्यक्तिनाम के रूप में समझना आवश्यक नहीं है।
- source_word: מִדַּבֵּר אֵלָיו
  choice: कि उससे कोई बात नहीं कर सकता
  rationale: यह स्वाभाविक हिन्दी में उस परिणाम को व्यक्त करता है कि उसका स्वभाव किसी को उससे समझदारी की बात करने नहीं देता।
theological_decisions:
- issue: בְּלִיַּעַל का मुहावरेदार अर्थ
  choice: निकम्मा आदमी
  alternative: बिलियाल का पुत्र / निकम्मेपन का पुत्र
  rationale: इस प्रसंग में यह नैतिक रूप से अधम और बात न मानने वाले मनुष्य का वर्णन है। 'बिलियाल' को व्यक्तिनाम बनाने से ऐसा विकसित दानवी अर्थ आ सकता है जिसकी यहाँ आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। 'जान लो और विचार करो' मूल के दो आदेशों को बनाए रखता है, जबकि 'आ पड़ना तय हो चुका है' आसन्न संकट की निश्चितता को सामान्य पाठक के लिए स्पष्ट करता है।
