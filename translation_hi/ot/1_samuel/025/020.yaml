base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/020.yaml
  text: And as she was riding on the donkey and going down under cover of the mountain[a], behold, David and his men were coming down to meet her, and she met them.
translation:
  language: hi
  text: जब वह गधे पर सवार होकर पहाड़ की ओट में उतर रही थी[a], तभी दाऊद और उसके लोग उससे मिलने के लिए नीचे उतर रहे थे, और वह उनसे मिली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पहाड़ के छिपे हुए हिस्से से।” इब्रानी वाक्यांश पहाड़ की किसी छिपी हुई या ओट वाली जगह को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה הִיא
  choice: जब वह... रही थी
  rationale: यह कथात्मक संरचना चल रही परिस्थिति की पृष्ठभूमि देती है; हिंदी में ‘जब वह... रही थी’ इसका कालगत संबंध स्वाभाविक रूप से व्यक्त करता है।
- source_word: רֹכֶבֶת עַל הַחֲמוֹר
  choice: गधे पर सवार होकर
  rationale: רכב और חמור का सीधा, वर्तमान हिंदी में स्वाभाविक अर्थ सुरक्षित रहता है।
- source_word: וְיֹרֶדֶת
  choice: उतर रही थी
  rationale: स्त्रीलिंग कृदंत निरंतर चल रही क्रिया बताता है; अपूर्ण भूतकालीन हिंदी रूप उसी पक्ष को व्यक्त करता है।
- source_word: בְּסֵתֶר הָהָר
  choice: पहाड़ की ओट में
  rationale: סתר में छिपाव, आड़ या आश्रय का भाव है। ‘ओट में’ स्थलाकृतिक संदर्भ में संक्षिप्त और स्वाभाविक है, जबकि वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
- source_word: וְהִנֵּה
  choice: तभी
  rationale: הנה अचानक सामने आए घटनाक्रम की ओर ध्यान खींचता है। आधुनिक हिंदी कथा में ‘तभी’ इसका जीवंत संक्रमण स्वाभाविक ढंग से देता है।
- source_word: יֹרְדִים לִקְרָאתָהּ
  choice: उसकी ओर उतरते हुए आ रहे थे
  rationale: ירד के नीचे उतरने और לקראת के सामने/ओर आने के स्थानिक भाव को रखता है, बिना यह अनावश्यक रूप से तय किए कि उनका उद्देश्य उससे मिलना ही था।
- source_word: וַתִּפְגֹּשׁ אֹתָם
  choice: वह उनसे जा मिली
  rationale: פגש का अर्थ मिलना या सामना होना है। ‘जा मिली’ गति के बाद हुई भेंट को सहज हिंदी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘देखो’ जैसे अधिक शाब्दिक विस्मयादिबोधक के स्थान पर ‘तभी’ चुना गया है, जिससे הנה का ध्यानाकर्षक प्रभाव बना रहता है और हिंदी वाक्य स्वाभाविक सुनाई देता है।
