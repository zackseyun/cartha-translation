  text: וַ/יָּ֤קָם אָדָם֙ לִ/רְדָפְ/ךָ֔ וּ/לְ/בַקֵּ֖שׁ אֶת נַפְשֶׁ֑/ךָ וְֽ/הָיְתָה֩ נֶ֨פֶשׁ אֲדֹנִ֜/י צְרוּרָ֣ה בִּ/צְר֣וֹר הַ/חַיִּ֗ים אֵ֚ת יְהוָ֣ה אֱלֹהֶ֔י/ךָ וְ/אֵ֨ת נֶ֤פֶשׁ אֹיְבֶ֨י/ךָ֙ יְקַלְּעֶ֔/נָּה בְּ/ת֖וֹךְ כַּ֥ף הַ/קָּֽלַע־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/029.yaml
  text: Though a man has risen to pursue you and to seek your life[a], yet the life of my lord shall be bound in the bundle of the living with Yahweh your God[b], and the lives of your enemies he shall sling out from the hollow of the sling.
translation:
  language: hi
  text: यद्यपि एक मनुष्य आपका पीछा करने और आपके प्राण लेने के लिए उठ खड़ा हुआ है, फिर भी मेरे स्वामी का प्राण जीवितों की गठरी में आपके परमेश्वर याहवे के साथ बँधा रहेगा[a]; लेकिन आपके शत्रुओं के प्राणों को वह गोफन की थैली में से दूर उछाल देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘जीवन की गठरी में बँधा रहेगा।’ इब्रानी चित्र किसी वस्तु को सुरक्षित रखने के लिए गठरी में कसकर बाँधने का है।
    reason: lexical_alternative
  - marker: b
    text: या ‘गोफन से दूर फेंक देगा।’ इब्रानी क्रिया विशेष रूप से गोफन चलाने की क्रिया दर्शाती है और ‘जीवितों की गठरी में बँधे’ रहने के साथ जानबूझकर विरोध रचती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם אָדָם
  choice: यद्यपि कोई मनुष्य ... उठ खड़ा हुआ है
  rationale: वाव + क़ातल को अबीगैल के कथन में रियायती परिस्थिति के रूप में लिया गया है। אָדָם यहाँ किसी ठोस पुरुष विरोधी की ओर संकेत करता है।
- source_word: לִרְדָפְךָ
  choice: आपका पीछा करने
  rationale: רדף शत्रुतापूर्ण संदर्भ में लगातार पीछा करने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: וּלְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: और आपके प्राण लेने
  rationale: इस संदर्भ में נֶפֶשׁ व्यक्ति के जीवन को दर्शाता है। शब्दशः ‘आपके प्राण खोजने’ की अपेक्षा ‘प्राण लेने’ हिन्दी में घातक अभिप्राय को स्पष्ट करता है।
- source_word: נֶפֶשׁ אֲדֹנִי
  choice: मेरे स्वामी का प्राण
  rationale: אֲדֹנִי अबीगैल का दाऊद के लिए आदरपूर्ण संबोधन है, और נֶפֶשׁ यहाँ जीवन/व्यक्ति को दर्शाता है।
- source_word: צְרוּרָה בִּצְרוֹר הַחַיִּים
  choice: जीवितों की गठरी में सुरक्षित बँधा रहेगा
  rationale: ‘गठरी’ और ‘बँधा’ मूल के ठोस रूपक को बनाए रखते हैं; ‘सुरक्षित’ इस बँधे होने के संरक्षणात्मक आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֵת יְהוָה אֱלֹהֶיךָ
  choice: आपके परमेश्वर याहवे के पास
  rationale: אֵת यहाँ संगति या निकटता का भाव देता है। ‘के पास’ दैवी संरक्षण को बिना रूपक खोए स्वाभाविक हिन्दी में व्यक्त करता है; יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וְאֵת נֶפֶשׁ אֹיְבֶיךָ
  choice: लेकिन आपके शत्रुओं के प्राणों को
  rationale: वाव यहाँ दाऊद के सुरक्षित जीवन और शत्रुओं के विनाश के बीच स्पष्ट विरोध दिखाता है। एकवचन נֶפֶשׁ का बहुवचन शत्रुओं के साथ सामूहिक अर्थ है, जिसे हिन्दी में ‘प्राणों’ से स्वाभाविक रूप मिला है।
- source_word: יְקַלְּעֶנָּה
  choice: वह ... दूर उछाल देगा
  rationale: קלע विशेष रूप से गोफन चलाने की क्रिया जगाता है। ‘उछाल देगा’ उस गति को रखता है और साथ के ‘गोफन’ से अर्थ स्पष्ट होता है।
- source_word: בְּתוֹךְ כַּף הַקָּלַע
  choice: गोफन की थैली में से
  rationale: כַּף का मूल भाव हथेली/खोखला भाग है; गोफन के संदर्भ में यह पत्थर रखने वाली थैली या खाँचे को दर्शाता है।
theological_decisions:
- issue: दाऊद की सुरक्षा और उसके शत्रुओं के हटाए जाने के बीच रूपकीय विरोध
  choice: ‘गठरी में बँधा’ और ‘गोफन ... उछाल देगा’—दोनों ठोस चित्रों को बनाए रखा गया है।
  alternative: दोनों चित्रों को सामान्य ‘सुरक्षित रखेगा’ और ‘नष्ट करेगा’ में बदल देना।
  rationale: मूल पाठ दैवी संरक्षण और शत्रुओं के हिंसक निष्कासन को विपरीत चित्रों से व्यक्त करता है; इसे परलोक या अनन्त जीवन की विकसित शिक्षा के रूप में नहीं समझाया गया।
- issue: אָדָם का लिंग-सटीक अनुवाद
  choice: मनुष्य
  alternative: व्यक्ति या कोई
  rationale: मूल शब्द व्याकरणतः पुल्लिंग एकवचन है और प्रसंग में एक ठोस पुरुष विरोधी की ओर संकेत करता है।
translation_notes:
  register: भाषा आधुनिक, आदरपूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘मेरे स्वामी’ अबीगैल के सम्मानसूचक संबोधन को बनाए रखता है। दुर्लभ किन्तु बोधगम्य ‘गोफन’ को उसके ठोस बाइबलीय चित्र के कारण रखा गया है।
