  text: Abigail quickly got up and rode on the donkey, with five of her young women going after her; she went after David's messengers and became his wife.
translation:
  language: hi
  text: अबीगैल ने फुर्ती से उठकर गधे पर सवारी की। उसकी पाँच युवतियाँ उसके पीछे-पीछे चलीं। वह दाऊद के दूतों के पीछे गई और उसकी पत्नी बन गई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתְּמַהֵר וַתָּקָם
  choice: फुर्ती से उठकर
  rationale: दोनों क्रियाओं—शीघ्रता करना और उठना—का स्वाभाविक तथा संक्षिप्त हिन्दी रूप।
- source_word: נַעֲרֹתֶיהָ
  choice: उसकी पाँच युवतियाँ
  rationale: नַעֲרוֹת स्त्रीलिंग बहुवचन है और यहाँ अबीगैल की साथ चलने वाली युवतियों/सेविकाओं को दर्शाता है; ‘युवतियाँ’ मूल की आयु-संबंधी व्यापकता बनाए रखता है।
- source_word: הַהֹלְכוֹת לְרַגְלָהּ
  choice: उसके पीछे-पीछे चलीं
  rationale: शाब्दिक भाव ‘उसके पाँवों पर/पीछे चलना’ है; वर्तमान हिन्दी में साथ पीछे चलने का अर्थ स्वाभाविक रूप से व्यक्त किया गया है।
- source_word: וַתֵּלֶךְ אַחֲרֵי מַלְאֲכֵי דָוִד
  choice: वह दाऊद के दूतों के पीछे गई
  rationale: אַחֲרֵי की पुनरावृत्ति और कथानक में दूतों का अनुसरण करने का स्पष्ट भाव सुरक्षित रखा गया है।
- source_word: וַתְּהִי לוֹ לְאִשָּׁה
  choice: उसकी पत्नी बन गई
  rationale: हिब्रू वैवाहिक सूत्र का सहज आधुनिक हिन्दी रूप; ‘उसकी’ का निकटतम और कथानक-संगत पूर्वपद दाऊद है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। मूल के क्रम और दो अलग-अलग ‘पीछे’ संबंधों को बनाए रखा गया है, जबकि अनावश्यक रूप से प्राचीन भाषा से बचा गया है।
