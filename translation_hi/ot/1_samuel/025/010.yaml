source:
  edition: WLC
  text: וַ/יַּ֨עַן נָבָ֜ל אֶת עַבְדֵ֤י דָוִד֙ וַ/יֹּ֔אמֶר מִ֥י דָוִ֖ד וּ/מִ֣י בֶן יִשָׁ֑י הַ/יּוֹם֙ רַבּ֣וּ עֲבָדִ֔ים הַ/מִּתְפָּ֣רְצִ֔ים אִ֖ישׁ מִ/פְּנֵ֥י אֲדֹנָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/010.yaml
  text: Nabal answered David’s servants and said[a], “Who is David? And who is the son of Jesse? These days many servants are breaking away, each man from before his master.”
translation:
  language: hi
  text: नाबाल ने दाऊद के सेवकों को उत्तर देते हुए कहा, “दाऊद कौन है? और यिशै का पुत्र कौन है? आजकल बहुत-से सेवक अपने-अपने स्वामी से अलग होकर निकल जा रहे हैं।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आजकल ऐसे सेवक बहुत बढ़ गए हैं, जो अपने-अपने स्वामी के यहाँ से निकल भागते हैं।”
    reason: רַבּוּ के अधिक शाब्दिक ‘बहुत बढ़ गए हैं’ और הַמִּתְפָּרְצִים के अधिक प्रबल ‘निकल भागते हैं’ अर्थों को सुरक्षित रखने वाला वैकल्पिक अनुवाद।
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर देते हुए कहा
  rationale: इब्रानी के दोहरे कथन-सूत्र ‘उत्तर दिया और कहा’ का अर्थ बनाए रखते हुए इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवक
  rationale: עבד का मूल सामाजिक अर्थ ‘सेवक’ है; इस प्रसंग में ये दाऊद के संदेशवाहक अथवा अधीनस्थ जन हैं, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: מִי דָוִד וּמִי בֶן־יִשָׁי
  choice: दाऊद कौन है? और यिशै का पुत्र कौन है?
  rationale: दोहराए गए प्रश्न की तिरस्कारपूर्ण शैली और ‘यिशै का पुत्र’ वाली इब्रानी अभिव्यक्ति दोनों सुरक्षित रहती हैं।
- source_word: הַיּוֹם
  choice: आजकल
  rationale: यहाँ शब्द केवल एक दिन का संकेत नहीं, बल्कि वर्तमान समय के बारे में सामान्य टिप्पणी करता है; आधुनिक हिन्दी में ‘आजकल’ इसका स्वाभाविक रूप है।
- source_word: רַבּוּ עֲבָדִים
  choice: बहुत-से सेवक
  rationale: רבה के ‘बहुत हो जाना/बढ़ जाना’ वाले परिमाणात्मक भाव को मुख्य पाठ में सहज हिन्दी से व्यक्त किया गया है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: הַמִּתְפָּרְצִים
  choice: अलग होकर निकल जा रहे हैं
  rationale: प्रसंग में हित्पएल कृदंत अपने अधिकारी से बंधन तोड़कर निकलने का भाव देता है। यह अनुवाद ‘विद्रोह’ जैसा अधिक निश्चित अर्थ आरोपित किए बिना उस अलगाव को व्यक्त करता है।
- source_word: אִישׁ מִפְּנֵי אֲדֹנָיו
  choice: अपने-अपने स्वामी से
  rationale: אישׁ का वितरणात्मक भाव ‘अपने-अपने’ से और מִפְּנֵי का प्रस्थान-सूचक मुहावरा ‘से’ द्वारा स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: אֲדֹנָיו
  choice: स्वामी
  rationale: यहाँ אדון किसी मानवीय अधिकारी या मालिक को सूचित करता है; ‘स्वामी’ गरिमापूर्ण और प्रसंगानुकूल है तथा इसे परमेश्वर-संबंधी उपाधि नहीं बनाता।
