base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/036.yaml
  text: When Abigail came to Nabal[a], behold, he was holding a feast in his house like the feast of a king, and Nabal’s heart was merry within him, and he was very drunk. So she told him nothing at all, small or great[b], until the light of morning.
translation:
  language: hi
  text: जब अबीगैल नाबाल के पास पहुँची, तो देखा कि वह अपने घर में राजा के भोज जैसी दावत दे रहा था। नाबाल का मन प्रसन्न था, और वह बहुत नशे में था। इसलिए उसने भोर होने तक उसे कोई भी बात—छोटी या बड़ी[a]—नहीं बताई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘छोटी या बड़ी कोई बात नहीं’; इसका अर्थ है ‘बिलकुल कुछ भी नहीं।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתָּבֹא אֲבִיגַיִל אֶל נָבָל
  choice: जब अबीगैल नाबाल के पास पहुँची
  rationale: वाव-क्रम कथानक को आगे बढ़ाता है; ‘जब’ अगले दृश्य से स्वाभाविक कालगत संबंध बनाता है। אֶל को यहाँ व्यक्ति के पास पहुँचने के अर्थ में प्रस्तुत किया गया है।
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: हिब्रू के दृश्य-उद्घाटक और ध्यान आकर्षित करने वाले बल को आधुनिक, स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מִשְׁתֶּה בְּבֵיתוֹ
  choice: अपने घर में ... दावत
  rationale: מִשְׁתֶּה भोज अथवा दावत को दर्शाता है, जिसमें मदिरापान भी हो सकता है; आगे मतवालेपन का स्पष्ट उल्लेख होने से उसे यहाँ जोड़ना अनावश्यक है।
- source_word: כְּמִשְׁתֵּה הַמֶּלֶךְ
  choice: राजा जैसी दावत
  rationale: राजसी भव्यता की उपमा को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְלֵב נָבָל טוֹב עָלָיו
  choice: नाबाल मन ही मन बहुत प्रसन्न था
  rationale: ‘उसका हृदय उस पर अच्छा था’ नामक हिब्रू मुहावरे का सहज हिन्दी अर्थ देता है और आंतरिक मनोदशा का संकेत बनाए रखता है।
- source_word: וְהוּא שִׁכֹּר עַד מְאֹד
  choice: वह बुरी तरह मतवाला था
  rationale: עַד מְאֹד की तीव्रता स्पष्ट करता है; ‘मतवाला’ गरिमापूर्ण किंतु सामान्य आधुनिक हिन्दी है।
- source_word: דָּבָר קָטֹן וְגָדוֹל
  choice: कोई भी बात—छोटी या बड़ी
  rationale: निषेध के साथ प्रयुक्त हिब्रू समावेशी युग्म का अर्थ ‘कुछ भी नहीं’ है; साथ ही मूल की ‘छोटी या बड़ी’ अभिव्यक्ति को बनाए रखा गया है।
- source_word: עַד אוֹר הַבֹּקֶר
  choice: भोर होने तक
  rationale: शाब्दिक ‘सुबह के प्रकाश तक’ का स्वाभाविक हिन्दी रूप, जो दिन निकलने के समय को व्यक्त करता है।
