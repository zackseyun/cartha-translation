base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/019.yaml
  text: She said to her young men[a], “Go on ahead of me. Look, I am coming behind you.” But she did not tell her husband Nabal.
translation:
  language: hi
  text: उसने अपने जवान सेवकों से कहा, “तुम मुझसे आगे चलो। देखो, मैं तुम्हारे पीछे आ रही हूँ।” लेकिन उसने अपने पति नाबाल को कुछ नहीं बताया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתֹּאמֶר
  choice: उसने ... कहा
  rationale: वय्यिक्तोल कथा की अगली क्रिया बताता है; हिन्दी में क्रम प्रसंग से स्पष्ट है, इसलिए अलग संयोजक आवश्यक नहीं।
- source_word: לִנְעָרֶיהָ
  choice: अपने जवान सेवकों से
  rationale: נַעַר का अर्थ जवान पुरुष, सेवक या परिचारक हो सकता है। यहाँ वे सामान लेकर आगे जाने वाले सेवक हैं; ‘जवान सेवक’ उम्र और भूमिका दोनों को बनाए रखता है।
- source_word: עִבְרוּ לְפָנַי
  choice: तुम मुझसे आगे चलो
  rationale: यहाँ עבר और לְפָנַי मिलकर अबीगैल से आगे बढ़ने का स्थानिक निर्देश देते हैं।
- source_word: הִנְנִי
  choice: देखो
  rationale: यह प्रथम-पुरुष संकेतवाचक अभिव्यक्ति वक्ता की आगामी क्रिया की ओर ध्यान खींचती है; आधुनिक हिन्दी में ‘देखो’ इसका स्वाभाविक समतुल्य है।
- source_word: אַחֲרֵיכֶם בָּאָה
  choice: मैं तुम्हारे पीछे आ रही हूँ
  rationale: स्त्रीलिंग कृदंत בָּאָה जारी/निकट क्रिया व्यक्त करता है और אַחֲרֵיכֶם स्थानिक रूप से उनके पीछे आने को बताता है।
- source_word: וּלְאִישָׁהּ
  choice: लेकिन ... अपने पति
  rationale: प्रसंग में אִישָׁהּ का अर्थ ‘उसका पति’ है। वाव यहाँ सेवकों को बताने और पति से बात छिपाने के बीच विरोध दर्शाता है।
- source_word: נָבָל
  choice: नाबाल
  rationale: व्यक्तिनाम का देवनागरी लिप्यंतरण।
- source_word: לֹא הִגִּידָה
  choice: कुछ नहीं बताया
  rationale: हिफ़ील रूप का अर्थ बताना या सूचित करना है। हिन्दी में ‘कुछ नहीं बताया’ घरेलू कथानक के अनुरूप स्वाभाविक है और आशय को स्पष्ट करता है।
