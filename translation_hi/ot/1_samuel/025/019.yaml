  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली। ‘जवान सेवक’ मूल शब्द की आयु-संबंधी और सेवकीय दोनों संभावनाओं को साथ रखता है। किसी पादटिप्पणी की आवश्यकता नहीं पड़ी।
