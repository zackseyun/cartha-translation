  choice: उसके पास तीन हज़ार भेड़ें और एक हज़ार बकरियाँ थीं
  rationale: स्वामित्व और संख्याओं को सहज आधुनिक हिन्दी में सीधे व्यक्त करता है।
- source_word: וַיְהִי בִּגְזֹז אֶת־צֹאנוֹ
  choice: उस समय वह ... अपनी भेड़ों की ऊन कतरवा रहा था
  rationale: पशुधन का धनी स्वामी स्वयं आवश्यक रूप से ऊन नहीं कतरता; हिन्दी का प्रेरणार्थक रूप चल रही भेड़-कतराई के प्रसंग को स्वाभाविक रूप से व्यक्त करता है, और ‘उस समय’ कथात्मक परिस्थिति को दर्शाता है।
