base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/002.yaml
  text: There was a man in Maon whose business was in Carmel[a]. The man was very wealthy, and he had three thousand sheep and a thousand goats[b]. He was shearing his sheep in Carmel.
translation:
  language: hi
  text: माओन में एक आदमी था, जिसका काम-धंधा कर्मेल में था[a]। वह आदमी बहुत धनवान था[b]; उसके पास तीन हज़ार भेड़ें और एक हज़ार बकरियाँ थीं। वह कर्मेल में अपनी भेड़ों की ऊन कतर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जिसकी संपत्ति कर्मेल में थी।” इब्रानी शब्द काम, कारोबार या संपत्ति के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “वह मनुष्य बहुत बड़ा था,” अर्थात वह आर्थिक या सामाजिक दृष्टि से प्रतिष्ठित था।
    reason: lexical_alternative
