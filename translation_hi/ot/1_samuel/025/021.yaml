  edition: WLC
  text: וְ/דָוִ֣ד אָמַ֗ר אַךְ֩ לַ/שֶּׁ֨קֶר שָׁמַ֜רְתִּי אֶֽת כָּל אֲשֶׁ֤ר לָ/זֶה֙ בַּ/מִּדְבָּ֔ר וְ/לֹא נִפְקַ֥ד מִ/כָּל אֲשֶׁר ל֖/וֹ מְא֑וּמָה וַ/יָּֽשֶׁב לִ֥/י רָעָ֖ה תַּ֥חַת טוֹבָֽה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/021.yaml
  text: David had said, “Surely I have guarded all that belongs to this man in the wilderness for nothing, so that not a thing of all that belonged to him was missing; and he has repaid me evil for good.”
translation:
  language: hi
  text: दाऊद ने कहा था, “निश्चय ही मैंने जंगल में इस मनुष्य की हर चीज़ की व्यर्थ ही रखवाली की, और उसकी किसी भी चीज़ की कोई कमी नहीं हुई; फिर भी उसने भलाई के बदले मेरे साथ बुराई की।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַךְ לַשֶּׁקֶר
  choice: निश्चय ही ... व्यर्थ ही
  rationale: אַךְ कथन पर बल देता है और לַשֶּׁקֶר यहाँ निष्फलता या बिना लाभ के किए गए काम को व्यक्त करता है; संयुक्त अनुवाद दाऊद की कटु निराशा को स्वाभाविक हिन्दी में रखता है।
- source_word: שָׁמַרְתִּי אֶת כָּל אֲשֶׁר לָזֶה
  choice: मैंने इस मनुष्य की हर वस्तु की ... रखवाली की
  rationale: שׁמר का मूल अर्थ रक्षा या रखवाली करना है; כָּל אֲשֶׁר לָזֶה उस व्यक्ति की समस्त संपत्ति को समेटता है।
- source_word: וְלֹא נִפְקַד ... מְאוּמָה
  choice: कुछ भी कम न हो
  rationale: निफ़अल נפקד इस प्रसंग में किसी वस्तु के गायब या अनुपस्थित पाए जाने का भाव देता है; हिन्दी में 'कुछ भी कम न हो' संपत्ति की पूर्ण सुरक्षा को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: וַיָּשֶׁב לִי רָעָה תַּחַת טוֹבָה
  choice: फिर भी उसने भलाई के बदले मेरे साथ बुराई की है
  rationale: मुहावरे का प्रतिफल वाला विरोध—भलाई के बदले बुराई—ज्यों का त्यों रखा गया है; לִי को स्वाभाविक हिन्दी में 'मेरे साथ' से व्यक्त किया गया है।
theological_decisions:
- issue: दाऊद के कथन का नैतिक मूल्यांकन
  choice: कथन को दाऊद की अपनी शिकायत के रूप में बिना संपादकीय समर्थन के प्रस्तुत किया गया है।
  alternative: दाऊद की शिकायत को कथावाचक का वस्तुनिष्ठ नैतिक निर्णय मानकर अधिक निर्णायक भाषा देना।
  rationale: इब्रानी पाठ केवल बताता है कि दाऊद ने ऐसा कहा था; वह इस पद में उसके निष्कर्ष का अनुमोदन नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथा-संदर्भ के अनुरूप गरिमापूर्ण किंतु सरल भाषा। 'इस मनुष्य' दाऊद की दूरी और रोष को बनाए रखता है।
