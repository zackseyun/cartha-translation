source:
  edition: WLC
  text: אַל נָ֣א יָשִׂ֣ים אֲדֹנִ֣/י אֶת לִבּ֡/וֹ אֶל אִישׁ֩ הַ/בְּלִיַּ֨עַל הַ/זֶּ֜ה עַל נָבָ֗ל כִּ֤י כִ/שְׁמ/וֹ֙ כֶּן ה֔וּא נָבָ֣ל שְׁמ֔/וֹ וּ/נְבָלָ֖ה עִמּ֑/וֹ וַֽ/אֲנִי֙ אֲמָ֣תְ/ךָ֔ לֹ֥א רָאִ֛יתִי אֶת נַעֲרֵ֥י אֲדֹנִ֖/י אֲשֶׁ֥ר שָׁלָֽחְתָּ־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/025.yaml
  text: 'Please[a], my lord, do not set your heart on this worthless man, on Nabal, for as his name is, so is he: Nabal is his name, and folly is with him. But I, your servant, did not see the young men of my lord whom you sent.'
translation:
  language: hi
  text: हे मेरे स्वामी, कृपया इस निकम्मे मनुष्य, नाबाल[a], पर ध्यान न दें, क्योंकि जैसा उसका नाम है, वैसा ही वह भी है। नाबाल उसका नाम है, और मूर्खता उसके साथ है। पर मैं, आपकी दासी, ने मेरे स्वामी के उन युवकों को नहीं देखा जिन्हें आपने भेजा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नाबाल’ नाम इब्रानी में ‘मूर्ख’ के अर्थ वाले शब्द से जुड़ा है, और ‘मूर्खता’ के लिए प्रयुक्त शब्द भी उसी शब्द-परिवार का है। अबीगैल यहाँ जानबूझकर शब्दों का खेल करती है।
    reason: नाम ‘नाबाल’ और נְבָלָה (‘मूर्खता’) के बीच के इब्रानी शब्दालंकार को हिन्दी में पूरी तरह प्रत्यक्ष करना संभव नहीं है।
lexical_decisions:
- source_word: יָשִׂים אֶת־לִבּוֹ אֶל
  choice: पर ध्यान न दे
  rationale: हिब्रू मुहावरे का आशय किसी को गंभीर महत्त्व या विचार देना है। स्वाभाविक आधुनिक हिन्दी में ‘ध्यान न दे’ यही अर्थ स्पष्ट करता है।
- source_word: אִישׁ הַבְּלִיַּעַל
  choice: निकम्मे मनुष्य
  rationale: यहाँ בְּלִיַּעַל व्यक्तिवाचक नाम नहीं, बल्कि नैतिक निकृष्टता और अनुपयोगिता सूचित करने वाला वर्णन है। ‘निकम्मे’ अपमान की तीव्रता को सहज हिन्दी में बनाए रखता है।
- source_word: נָבָל
  choice: नाबाल
  rationale: व्यक्तिगत नाम को लिप्यंतरित किया गया है; नाम और मूर्खता के बीच का हिब्रू शब्दालंकार मुख्य पाठ तथा पादटिप्पणी में सुरक्षित है।
- source_word: כִּי כִשְׁמוֹ כֶּן הוּא
  choice: क्योंकि जैसा उसका नाम है, वैसा ही वह है
  rationale: यह चयन मूल की कहावत-सदृश समानांतर संरचना और नाम-चरित्र के स्पष्ट संबंध को बनाए रखता है।
- source_word: וּנְבָלָה עִמּוֹ
  choice: और मूर्खता उसके साथ है
  rationale: נְבָלָה मूर्खता या लज्जाजनक आचरण बता सकता है; निकटवर्ती ‘नाबाल’ के साथ शब्दालंकार के कारण यहाँ ‘मूर्खता’ सर्वाधिक उपयुक्त है।
- source_word: אֲמָתְךָ
  choice: मुझ आपकी दासी
  rationale: यह स्त्रीलिंग सेविका के लिए प्रयुक्त विनम्र आत्म-संबोधन है। ‘आपकी दासी’ लिंग और विनय दोनों को स्वाभाविक हिन्दी में रखता है।
- source_word: נַעֲרֵי
  choice: जवानों
  rationale: शब्द युवा पुरुषों या सेवकों का द्योतक हो सकता है। इस प्रसंग में ‘जवानों’ मूल के आयु-संबंधी अर्थ को बनाए रखते हुए सहज है।
- source_word: אֲדֹנִי
  choice: मेरा स्वामी / मेरे स्वामी
  rationale: अबीगैल दाऊद को सम्मानसूचक रूप से संबोधित करती है। हिन्दी में विभक्ति के अनुसार ‘मेरा/मेरे स्वामी’ सामाजिक आदर और संबंध दोनों व्यक्त करता है।
