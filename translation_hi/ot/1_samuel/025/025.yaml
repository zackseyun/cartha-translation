  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज कथात्मक स्तर अपनाया गया है। सम्मानसूचक ‘आप’ और विनम्र ‘दासी’ प्रसंग के सामाजिक संबंध को स्पष्ट रखते हैं; अत्यधिक संस्कृतनिष्ठ या पुरातन शब्दावली से बचा गया है।
