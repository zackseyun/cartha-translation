translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। तलवार बाँधने की ठोस क्रिया को दोहराकर मूल की कथात्मक पुनरावृत्ति बनाए रखी गई है। ‘पीछे-पीछे चढ़ गए’ दिशात्मकता और अनुसरण, दोनों को व्यक्त करता है। फुटनोट चिह्न संबंधित पद ‘सामान के पास’ पर रखा गया है।
