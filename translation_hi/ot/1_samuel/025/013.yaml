base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/013.yaml
  text: Then David said to his men[a], “Each man strap on his sword.” So each man strapped on his sword, and David also strapped on his sword. About four hundred men went up after David, while two hundred stayed with the supplies.
translation:
  language: hi
  text: तब दाऊद ने अपने आदमियों से कहा, “हर एक अपनी तलवार कमर से बाँध ले।” तब हर एक ने अपनी तलवार कमर से बाँध ली, और दाऊद ने भी अपनी तलवार कमर से बाँध ली। लगभग चार सौ आदमी दाऊद के पीछे-पीछे चढ़ गए, जबकि दो सौ सामान के पास[a] रह गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “साज-सामान के पास” अथवा “सामान के साथ।”
    reason: כֵּלִים और उसके साथ प्रयुक्त עַל के कारण ‘सामान’, ‘साज-सामान’ तथा ‘के पास/के साथ’ जैसे निकटवर्ती अर्थ संभव हैं।
lexical_decisions:
- source_word: חִגְרוּ / וַיַּחְגְּרוּ / וַיַּחְגֹּר
  choice: कमर से बाँध ले / कमर से बाँध ली
  rationale: חגר का सैन्य प्रसंग में अर्थ हथियार को कमर से बाँधना है। यह हिंदी में स्वाभाविक है और मूल क्रिया की ठोस देहगत छवि को बनाए रखता है।
- source_word: אִישׁ ... אֶת־חַרְבּוֹ
  choice: हर एक अपनी तलवार
  rationale: यह मूल के वितरणात्मक भाव—प्रत्येक व्यक्ति द्वारा अपनी तलवार बाँधने—को सहज आधुनिक हिंदी में व्यक्त करता है।
- source_word: חֶרֶב
  choice: तलवार
  rationale: यह शब्द सामान्य हथियार नहीं, विशेष रूप से तलवार को सूचित करता है।
- source_word: גַּם
  choice: भी
  rationale: यह दाऊद की स्वयं की सहभागिता पर मूल पाठ के सीधे बल को बनाए रखता है।
- source_word: וַיַּעֲלוּ אַחֲרֵי דָוִד
  choice: दाऊद के पीछे-पीछे चढ़ गए
  rationale: ‘चढ़ गए’ עלה की ऊपर जाने की दिशात्मकता और ‘पीछे-पीछे’ אַחֲרֵי के अनुसरण के भाव, दोनों को बनाए रखता है।
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: लगभग चार सौ आदमी
  rationale: संख्या से पहले लगा כְּ यहाँ अनुमान का भाव दे सकता है; ‘लगभग’ उस सूक्ष्मता को स्पष्ट रखता है।
- source_word: יָשְׁבוּ
  choice: रह गए
  rationale: इस आख्यान में क्रिया का आशय शाब्दिक रूप से ‘बैठे’ होने के बजाय आगे न जाकर वहीं ठहरने से है।
- source_word: עַל־הַכֵּלִים
  choice: सामान के पास
  rationale: כֵּלִים का अर्थ व्यापक रूप से वस्तुएँ, उपकरण या यात्रा-सामग्री हो सकता है। सैन्य यात्रा के प्रसंग में ‘सामान’ स्पष्ट है, जबकि עַל के स्थानगत भाव को ‘के पास’ बनाए रखता है।
- source_word: לַאֲנָשָׁיו
  choice: अपने आदमियों से
  rationale: इस सैन्य प्रसंग में אֲנָשִׁים दाऊद के साथ के पुरुषों, विशेषतः उसके लड़ाकों, को दर्शाता है; ‘आदमियों’ से मूल की सामान्य संज्ञा अनावश्यक व्याख्या के बिना बनी रहती है।
