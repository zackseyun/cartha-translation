base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/008.yaml
  text: Ask your young men[a], and they will tell you. So let the young men find favor in your eyes, for we have come on a festive day[b]. Please give whatever your hand finds to your servants and to your son David.
translation:
  language: hi
  text: अपने जवानों से पूछिए, और वे आपको बताएँगे। ये जवान आपकी दृष्टि में अनुग्रह पाएँ, क्योंकि हम उत्सव के दिन[a] आए हैं। कृपया आपके हाथ में जो कुछ हो[b], वह आपके सेवकों और आपके पुत्र दाऊद को दीजिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अच्छे दिन”; यहाँ भेड़ें कतरने से जुड़ा उत्सवपूर्ण अवसर अभिप्रेत है।
    reason: cultural_note
  - marker: b
    text: अर्थात्, “जो कुछ आप दे सकें”; शाब्दिक रूप से, “जो कुछ आपका हाथ पाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁאַל אֶת־נְעָרֶיךָ
  choice: अपने जवानों से पूछ
  rationale: שְׁאַל प्रत्यक्ष आज्ञा है और נְעָרֶיךָ नाबाल के उन जवानों या सेवकों को सूचित करता है जो दाऊद के लोगों के आचरण की पुष्टि कर सकते थे। ‘जवानों’ से आगे आने वाले הַנְּעָרִים के साथ शब्द-संबंध बना रहता है।
- source_word: וְיַגִּידוּ לָךְ
  choice: और वे तुझे बताएँगे
  rationale: נגד का हिफ़ील रूप यहाँ सूचना देने या बताने के सामान्य अर्थ में है; हिन्दी में यह सरल और स्वाभाविक है।
- source_word: וְיִמְצְאוּ הַנְּעָרִים חֵן בְּעֵינֶיךָ
  choice: इसलिए इन जवानों को तेरी दृष्टि में कृपा मिले
  rationale: מצא חן בעיני की इब्रानी छवि को बनाए रखते हुए इच्छा/विनती का भाव व्यक्त किया गया है। आरम्भ का ‘इसलिए’ वाव के प्रसंगगत निष्कर्षात्मक संबंध को दर्शाता है।
- source_word: כִּי עַל־יוֹם טוֹב בָּאנוּ
  choice: क्योंकि हम उत्सव के दिन आए हैं
  rationale: יוֹם טוֹב का शाब्दिक अर्थ ‘अच्छा दिन’ है, पर भेड़ों की ऊन कतरने के उत्सवी प्रसंग में ‘उत्सव का दिन’ अभिप्रेत अवसर को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: תְּנָה־נָּא
  choice: कृपया ... दे
  rationale: आज्ञार्थक क्रिया के साथ נָא विनम्र अनुरोध प्रकट करता है, जिसे ‘कृपया’ स्पष्ट रूप से व्यक्त करता है।
- source_word: אֵת אֲשֶׁר תִּמְצָא יָדְךָ
  choice: जो कुछ तेरे हाथ लगे
  rationale: ‘जो तेरा हाथ पाए’ वाली मूल छवि को स्वाभाविक हिन्दी मुहावरे में रखा गया है; आशय उपलब्ध वस्तु या सामर्थ्य के अनुसार देने से है।
- source_word: לַעֲבָדֶיךָ
  choice: अपने सेवकों
  rationale: עֶבֶד यहाँ दाऊद की विनम्र आत्म-प्रस्तुति का अंग है; ‘सेवक’ सामाजिक और अलंकारिक संदर्भ के अनुकूल है।
- source_word: וּלְבִנְךָ לְדָוִד
  choice: और अपने बेटे दाऊद को
  rationale: दाऊद स्वयं को नाबाल का ‘बेटा’ कहकर विनम्रता दिखाता है; यह वास्तविक पारिवारिक संबंध का दावा नहीं है। मूल की विनम्र शब्दावली को स्पष्ट रखा गया है।
theological_decisions:
- issue: दाऊद का स्वयं को नाबाल का ‘बेटा’ कहना
  choice: अपने बेटे दाऊद
  alternative: अपने सेवक दाऊद
  rationale: בִנְךָ को उसके प्रत्यक्ष अर्थ ‘तेरा बेटा’ में रखा गया है। यह प्रसंग में आदरसूचक और विनम्र आत्म-संबोधन है; इसे ‘सेवक’ कर देने से मूल की अलग अलंकारिक अभिव्यक्ति मिट जाती।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। नाबाल के लिए एकवचन ‘तू/तेरा’ रखा गया है, जो इब्रानी के दूसरे पुरुष एकवचन रूपों से मेल खाता है और असम्मान के बजाय बाइबलीय प्रत्यक्ष संबोधन को दर्शाता है। ‘जवानों’ शब्द से נַעַר की दोनों आवृत्तियों का संबंध सुरक्षित रखा गया है।
