  text: 'And this will not be a cause of grief to you or a stumbling block of heart to my lord: either that you have shed blood without cause or that my lord has avenged himself[a]. And when Yahweh has dealt well with my lord[d][c][b], then remember your servant.'
translation:
  language: hi
  text: और यह मेरे प्रभु के लिए न तो पछतावे का कारण बनेगा, न मन में ठोकर—कि मेरे प्रभु ने अकारण रक्त बहाया हो और मेरे प्रभु ने अपने लिए उद्धार किया हो[a][b]। और जब यहोवा मेरे प्रभु का भला करे, तब अपनी दासी को याद कीजिए[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “हृदय की ठोकर”; आशय अंतःकरण की बाधा, पीड़ा, या नैतिक ठोकर हो सकता है। पहले पद का दुर्लभ इब्रानी शब्द भी बाद में होने वाले पीड़ादायक पछतावे या ठेस का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “मेरे प्रभु ने अपने लिए बदला लिया हो।” इब्रानी में शाब्दिक भाव “अपने लिए उद्धार किया हो” है; प्रसंग में इसका संकेत अपने हाथ से प्रतिशोध लेने की ओर हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में “तेरी दासी”; यह अबीगैल का विनम्र स्त्रीलिंग आत्म-संबोधन है।
    reason: lexical_clarification
lexical_decisions:
- source_word: לְפוּקָה
  choice: पछतावे का कारण
  rationale: यह दुर्लभ संज्ञा ठोकर, आघात या बाद में होने वाले पीड़ादायक खेद का संकेत देती है। प्रसंग में अबीगैल दाऊद को भावी नैतिक पछतावे से सावधान करती है।
- source_word: מִכְשׁוֹל לֵב
  choice: मन की ठोकर
  rationale: शाब्दिक रूप से 'हृदय की ठोकर'। 'मन की ठोकर' मूल रूपक को बनाए रखते हुए आधुनिक हिन्दी में अंतःकरण की बाधा या कसक का भाव देता है।
- source_word: לַאדֹנִי / אֲדֹנִי
  choice: मेरे प्रभु
  rationale: यह दाऊद के लिए अबीगैल का आदरसूचक संबोधन है; यहाँ 'प्रभु' उपाधि है, ईश्वरत्व का संकेत नहीं।
- source_word: לִשְׁפָּךְ דָּם חִנָּם
  choice: अकारण खून बहाया
  rationale: חִנָּם का अर्थ यहाँ बिना उचित कारण या निर्दोष रूप से रक्त बहाना है। यह अभिव्यक्ति सहज और नैतिक आशय में स्पष्ट है।
- source_word: לְהוֹשִׁיעַ ... לוֹ
  choice: अपने ही हाथों अपना उद्धार किया
  rationale: मूल क्रिया का सामान्य अर्थ 'बचाना/उद्धार करना' है। प्रसंग में इसका आशय अपने बल पर न्याय या प्रतिशोध लेना हो सकता है; मुख्य पाठ में मूल शब्दार्थ और उसकी तनावपूर्ण अस्पष्टता रखी गई है।
- source_word: וְהֵיטִב יְהוָה
  choice: जब यहोवा ... का भला करे
  rationale: वाव के साथ पूर्ण क्रिया यहाँ भविष्य की ओर संकेत करने वाली कालवाचक उपवाक्य के रूप में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप 'यहोवा' के द्वारा चतुरक्षरीय व्यक्तिगत नाम को उपाधि से प्रतिस्थापित किए बिना प्रस्तुत किया गया है।
- source_word: אֲמָתֶךָ
  choice: अपनी दासी
  rationale: शब्द स्पष्ट रूप से स्त्रीलिंग है और अबीगैल के विनम्र आत्म-संबोधन को दर्शाता है; हिन्दी में 'दासी' इसे स्वाभाविक रूप से सुरक्षित रखता है।
theological_decisions:
- issue: לְהוֹשִׁיעַ ... לוֹ का आत्म-उद्धार अथवा प्रतिशोध संबंधी अर्थ
  choice: मुख्य पाठ में 'अपने ही हाथों अपना उद्धार किया'
  alternative: अपने लिए बदला लिया
  rationale: क्रिया का मूल अर्थ 'उद्धार करना' है, जबकि कथा-संदर्भ दाऊद द्वारा अपने हाथ से प्रतिशोध लेने की ओर संकेत करता है। मुख्य पाठ मूल शब्दावली बचाता है और पादटिप्पणी प्रसंगगत अर्थ स्पष्ट करती है।
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम को 'प्रभु' जैसी उपाधि से नहीं बदला गया; आधुनिक हिन्दी पाठकों के लिए व्यापक रूप से पहचाना जाने वाला लिप्यंतरण चुना गया है।
