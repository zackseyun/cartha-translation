    reason: ‘घर’ के वंशगत रूपक और נֶאֱמָן के ‘स्थिर/विश्वसनीय’ अर्थ को स्पष्ट करने वाला शाब्दिक विकल्प।
  revision_rationale: A limited idiomatic revision changes ‘घराना बनाएगा’ to ‘घराना स्थापित करेगा,’ which is the normal Hindi expression for the establishment of a lasting lineage. ‘इस दासी’ improves clarity in Abigail’s deferential self-reference. The footnote remains correctly anchored and preserves the literal alternative and dynastic explanation.
