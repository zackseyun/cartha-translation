reference: 1 Samuel 25:28
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שָׂ֥א נָ֖א לְ/פֶ֣שַׁע אֲמָתֶ֑/ךָ כִּ֣י עָשֹֽׂה יַעֲשֶׂה֩ יְהוָ֨ה לַֽ/אדֹנִ֜/י בַּ֣יִת נֶאֱמָ֗ן כִּי מִלְחֲמ֤וֹת יְהוָה֙ אֲדֹנִ֣/י נִלְחָ֔ם וְ/רָעָ֛ה לֹא תִמָּצֵ֥א בְ/ךָ֖ מִ/יָּמֶֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/028.yaml
  text: Please forgive the transgression of your servant[a], for Yahweh will surely make my lord a lasting house, because my lord fights Yahweh’s battles, and evil will not be found in you all your days.
translation:
  language: hi
  text: कृपया इस दासी का अपराध क्षमा कर दीजिए, क्योंकि याहवे मेरे स्वामी के लिए निश्चय ही एक स्थायी घराना स्थापित करेगा[a], क्योंकि मेरे स्वामी याहवे के युद्ध लड़ते हैं, और जीवन भर आप में कोई बुराई नहीं पाई जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक अटल घर।” यहाँ “घराना” से आशय केवल परिवार या मकान नहीं, बल्कि स्थिर वंश अथवा राजघराने से है।
    reason: ‘घर’ के वंशगत रूपक और נֶאֱמָן के ‘स्थिर/विश्वसनीय’ अर्थ को स्पष्ट करने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: שָׂא נָא לְפֶשַׁע
  choice: कृपया ... का अपराध क्षमा कर दीजिए
  rationale: शाब्दिक रूप से ‘अपराध को उठा लेना/सहन करना’ यहाँ क्षमा करने का मुहावरा है। ‘कृपया’ נָא की विनती को व्यक्त करता है।
- source_word: אֲמָתֶךָ
  choice: अपनी दासी
  rationale: אמה स्त्रीलिंग सेविका के लिए है। ‘दासी’ अबीगैल की विनम्र, स्त्रीलिंग आत्म-संज्ञा को संक्षेप और गरिमा के साथ सुरक्षित रखता है।
- source_word: עָשֹׂה יַעֲשֶׂה
  choice: निश्चय ही ... बनाएगा
  rationale: क्रिया के साथ infinitive absolute निश्चितता और बल प्रकट करता है; ‘निश्चय ही’ उसी जोर को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לַאדֹנִי
  choice: मेरे स्वामी के लिए
  rationale: यह दाऊद के लिए आदरपूर्ण मानवीय संबोधन है। ‘स्वामी’ इसे परमेश्वर के नाम या उपाधि से अलग रखते हुए सम्मान प्रकट करता है।
- source_word: בַּיִת נֶאֱמָן
  choice: एक स्थायी घराना
  rationale: בַּיִת यहाँ भवन नहीं, बल्कि दाऊद के टिकाऊ वंश अथवा राजघराने की ओर संकेत करता है। ‘घराना’ रूपक और वंशगत अर्थ दोनों को सहज हिन्दी में रखता है; נֶאֱמָן का आशय यहाँ स्थिर और टिकाऊ है।
- source_word: מִלְחֲמוֹת יְהוָה
  choice: याहवे के युद्ध
  rationale: यह वाक्यांश याहवे के उद्देश्य के लिए लड़े जाने वाले युद्धों को दर्शाता है।
- source_word: נִלְחָם
  choice: लड़ते हैं
  rationale: इब्रानी participle दाऊद की निरंतर अथवा विशिष्ट गतिविधि को बताता है; सामान्य वर्तमान काल हिन्दी में इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְרָעָה לֹא תִמָּצֵא בְךָ
  choice: आप में कोई बुराई नहीं पाई जाएगी
  rationale: רָעָה में नैतिक बुराई के साथ हानि या विपत्ति का अर्थ भी संभव है। ‘बुराई’ व्यापक नैतिक अर्थ को बनाए रखती है और निष्क्रिय क्रिया को भी सुरक्षित रखती है।
- source_word: מִיָּמֶיךָ
  choice: जीवन भर
  rationale: शाब्दिक ‘तुम्हारे दिनों में’ का मुहावरेदार आशय पूरे जीवनकाल से है; ‘जीवन भर’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: अबीगैल के आशीर्वचन में ‘घर’ का वंशगत अर्थ
  choice: एक स्थायी घराना
  alternative: एक अटल घर; एक चिरस्थायी राजवंश
  rationale: संदर्भ दाऊद के स्थिर वंश या राजघराने की ओर संकेत करता है। ‘घराना’ मूल रूपक को पूरी तरह तकनीकी शब्द ‘राजवंश’ में बदलने से बचाता है, पर आधुनिक पाठक के लिए उसका आशय स्पष्ट करता है।
- issue: רָעָה का नैतिक बुराई अथवा विपत्ति का अर्थ
  choice: बुराई
  alternative: अनिष्ट; विपत्ति; दुष्टता
  rationale: संदर्भ दाऊद के आचरण पर अबीगैल की बात को प्रमुख बनाता है, इसलिए ‘बुराई’ उपयुक्त है; फिर भी मूल शब्द की अर्थ-सीमा हानि या विपत्ति तक भी जा सकती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, आदरपूर्ण और सहज रखी गई है। अबीगैल के लिए स्त्रीलिंग ‘दासी’ और दाऊद के लिए आदरसूचक बहुवचन क्रिया तथा ‘आप’ प्रयुक्त हैं। अर्धविराम कारणसूचक खंडों को स्पष्ट करता है।
