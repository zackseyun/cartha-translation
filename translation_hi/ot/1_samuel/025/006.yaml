id: 1SA.25.6
reference: 1 Samuel 25:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/אֲמַרְתֶּ֥ם כֹּ֖ה לֶ/חָ֑י וְ/אַתָּ֤ה שָׁלוֹם֙ וּ/בֵיתְ/ךָ֣ שָׁל֔וֹם וְ/כֹ֥ל אֲשֶׁר לְ/ךָ֖ שָׁלֽוֹם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/006.yaml
  text: 'And say this: ‘To the living one: Peace to you[a], peace to your house[b], and peace to all that is yours.’'
translation:
  language: hi
  text: 'और उससे यह कहना: “आप चिरायु हों![a] आपका कुशल-मंगल हो, आपके घर का कुशल-मंगल हो,[b] और जो कुछ आपका है, उस सबका कुशल-मंगल हो।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक रूप लगभग “जीवन के लिए” या “जीवित जन के लिए” है। संभवतः यह अभिवादन या आशीर्वाद का मुहावरा है; इसलिए यहाँ “आप चिरायु हों” किया गया है। इसे “नमस्कार” भी समझा गया है।
    reason: alternative_reading
  - marker: b
    text: यहाँ “कुशल-मंगल” के लिए इब्रानी शब्द शालोम है, जिसमें शांति के साथ सकुशलता, संपूर्ण भलाई और समृद्धि का भाव भी हो सकता है। “घर” से घराना या परिवार भी अभिप्रेत हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲמַרְתֶּם
  choice: और उससे यह कहना
  rationale: वाव के साथ पूर्ण क्रिया यहाँ दाऊद के निर्देश को आगे बढ़ाती है और आदेश जैसा बल रखती है। हिन्दी में “कहना” इस निरंतर निर्देश को स्वाभाविक ढंग से व्यक्त करता है; एकवचन पुरुष संबोधन के संदर्भ में “उससे” निहित श्रोता को स्पष्ट करता है।
- source_word: כֹּה
  choice: यह
  rationale: यह शब्द आगे आने वाले संदेश का परिचय देता है; “यह” आधुनिक हिन्दी में सहज है।
- source_word: לֶחָי
  choice: आप चिरायु हों
  rationale: शाब्दिक रूप “जीवन के लिए/जीवित जन के लिए” यहाँ कठिन और संभवतः अभिवादन अथवा आशीर्वाद का मुहावरा है। “आप चिरायु हों” जीवन की कामना को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि वैकल्पिक समझ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַתָּה שָׁלוֹם
  choice: आपका कुशल-मंगल हो
  rationale: क्रियारहित इब्रानी वाक्य आशीर्वाद या शुभकामना व्यक्त करता है। “कुशल-मंगल” शांति के साथ सकुशलता और भलाई का भाव भी संप्रेषित करता है।
- source_word: וּבֵיתְךָ שָׁלוֹם
  choice: आपके घर का कुशल-मंगल हो
  rationale: इब्रानी “घर” भवन के साथ घराने या परिवार को भी समेट सकता है। हिन्दी में “घर” इस व्यापक घरेलू अर्थ को स्वाभाविक रूप से वहन करता है।
- source_word: וְכֹל אֲשֶׁר לְךָ שָׁלוֹם
  choice: और जो कुछ आपका है, उस सबका कुशल-मंगल हो
  rationale: यह आशीर्वाद उस व्यक्ति की सारी संपत्ति, आश्रितों और उसके अधिकार में आने वाली प्रत्येक वस्तु तक फैलाता है।
- source_word: שָׁלוֹם
  choice: कुशल-मंगल
  rationale: यहाँ שָׁלוֹם केवल संघर्ष की अनुपस्थिति नहीं, बल्कि सकुशलता, संपूर्ण भलाई और समृद्धि का भाव रखता है। अभिवादन-संदर्भ में “कुशल-मंगल” इस विस्तार को सामान्य आधुनिक हिन्दी में बेहतर व्यक्त करता है।
theological_decisions:
- issue: לֶחָי का अनिश्चित अभिवादनात्मक अर्थ
  choice: मुख्य पाठ में इसे जीवन की कामना, “आप चिरायु हों,” के रूप में व्यक्त किया गया है।
  alternative: “जीवित जन से,” “जीवन के लिए,” अथवा सामान्य “नमस्कार।”
  rationale: संदर्भ इसे नाबाल को संबोधित अभिवादन या आशीर्वाद बनाता है, पर इब्रानी पदबंध असामान्य और अर्थ की दृष्टि से अनिश्चित है। इसलिए मुख्य पाठ में संभावित मुहावरेदार अर्थ दिया गया है और अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं; इससे किसी धर्मसैद्धांतिक निष्कर्ष को आरोपित नहीं किया जाता।
translation_notes:
  register: भाषा आधुनिक, सम्मानसूचक और गरिमापूर्ण रखी गई है। “कुशल-मंगल” सामान्य हिन्दी के अभिवादन और शुभकामना की भाषा में स्वाभाविक है तथा तीन बार आए שָׁלוֹם की आवृत्ति को बनाए रखता है। उद्धरण में नाबाल के लिए एकवचन सम्मानसूचक “आप” प्रयुक्त है।
