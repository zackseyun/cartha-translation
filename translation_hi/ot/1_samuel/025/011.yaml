source:
  edition: WLC
  text: וְ/לָקַחְתִּ֤י אֶת לַחְמִ/י֙ וְ/אֶת מֵימַ֔/י וְ/אֵת֙ טִבְחָתִ֔/י אֲשֶׁ֥ר טָבַ֖חְתִּי לְ/גֹֽזְזָ֑/י וְ/נָֽתַתִּי֙ לַֽ/אֲנָשִׁ֔ים אֲשֶׁר֙ לֹ֣א יָדַ֔עְתִּי אֵ֥י מִ/זֶּ֖ה הֵֽמָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/011.yaml
  text: Should I take my bread and my water and my meat that I have slaughtered for my shearers[b][a], and give it to men whom I do not know where they are from?
translation:
  language: hi
  text: तो क्या मैं अपनी रोटी, अपना पानी और अपना वह मांस, जो मैंने अपनी भेड़ों का ऊन कतरनेवालों के लिए पशु वध करके तैयार किया है, लेकर उन आदमियों को दे दूँ, जिनके बारे में मैं नहीं जानता कि वे कहाँ के हैं?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे कतरनेवालों”; अर्थात भेड़ों का ऊन कतरनेवाले कामगार।
    reason: cultural_note
  - marker: b
    text: अधिक शाब्दिक रूप में, “और मैं अपनी रोटी ... लूँगा और उन आदमियों को दूँगा, जिनके विषय में मैं नहीं जानता कि वे कहाँ के हैं?” हिब्रू में पूर्ण क्रियारूप आलंकारिक प्रश्न में प्रयुक्त हुए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַחְתִּי ... וְנָתַתִּי
  choice: तो क्या मैं ... लेकर ... दे दूँ
  rationale: संयोजित पूर्ण रूप यहाँ नाबाल के रोषपूर्ण आलंकारिक प्रश्न में विचारात्मक/भावी अर्थ देते हैं। यह हिन्दी में उस बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַחְמִי וְאֶת מֵימַי
  choice: अपनी रोटी, अपना पानी
  rationale: ठोस वस्तुओं की सूची और बार-बार आए प्रथम-पुरुष स्वामित्व पर नाबाल का जोर बनाए रखा गया है।
- source_word: טִבְחָתִי אֲשֶׁר טָבַחְתִּי
  choice: अपना वह मांस, जिसे मैंने ... कटवाया है
  rationale: संज्ञा और क्रिया दोनों वध/काटने के एक ही मूल से हैं। 'मांस' सहज है, जबकि 'कटवाया है' प्रसंगानुसार नाबाल द्वारा अपने कामगारों के लिए पशु कटवाने का भाव देता है।
- source_word: לְגֹזְזָי
  choice: अपने भेड़ का ऊन कतरनेवालों
  rationale: शाब्दिक अर्थ 'मेरे कतरनेवाले' है; आधुनिक हिन्दी में भेड़ और ऊन को स्पष्ट करने से सांस्कृतिक गतिविधि तुरंत समझ आती है।
- source_word: לָאֲנָשִׁים
  choice: उन आदमियों को
  rationale: पुल्लिंग बहुवचन और नाबाल के तिरस्कारपूर्ण संदर्भ दोनों सुरक्षित रहते हैं।
- source_word: אֲשֶׁר לֹא יָדַעְתִּי אֵי מִזֶּה הֵמָּה
  choice: जिनके बारे में मैं नहीं जानता कि वे कहाँ से आए हैं
  rationale: मूल में उनके उद्गम के विषय में अनभिज्ञता का दावा है। यह आधुनिक हिन्दी में स्वाभाविक अभिव्यक्ति है।
theological_decisions:
- issue: नाबाल के कथन को वास्तविक प्रश्न या आलंकारिक अस्वीकार समझना
  choice: आलंकारिक प्रश्न की तीव्रता को 'तो क्या मैं ... दे दूँ' से व्यक्त किया
  alternative: '''और मैं ... लूँगा और ... दूँगा'' का अधिक रूप-सापेक्ष अनुवाद'
  rationale: संदर्भ और प्रश्नसूचक אֵי दर्शाते हैं कि पूरा कथन रोषपूर्ण आलंकारिक प्रश्न है; फिर भी पादटिप्पणी में हिब्रू रूपों का अधिक शाब्दिक स्वरूप दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथोपकथन के अनुकूल रखी गई है। 'अपनी/अपना' की पुनरावृत्ति नाबाल के स्वामित्व-बोध और स्वार्थपूर्ण रोष को उभारती है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
