source:
  edition: WLC
  text: וְ/שָׁא֗וּל נָתַ֛ן אֶת מִיכַ֥ל בִּתּ֖/וֹ אֵ֣שֶׁת דָּוִ֑ד לְ/פַלְטִ֥י בֶן לַ֖יִשׁ אֲשֶׁ֥ר מִ/גַּלִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/044.yaml
  text: Saul had given Michal his daughter[a], David’s wife, to Palti son of Laish, who was from Gallim.
translation:
  language: hi
  text: शाऊल ने अपनी बेटी मीकल, जो दाऊद की पत्नी थी, लैश के बेटे पलती[a] को दे दिया था। पलती गल्लीम का रहनेवाला था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कुछ परंपरागत अनुवादों में इस नाम का रूप ‘फलती’ मिलता है; यहाँ इब्रानी पाठ के अनुसार ‘पलती’ रखा गया है।
    reason: नाम के वैकल्पिक पारंपरिक लिप्यंतरण को स्पष्ट करना।
lexical_decisions:
- source_word: וְ/שָׁאוּל
  choice: शाऊल ने
  rationale: इब्रानी ו कथा की कड़ी जोड़ता है; आधुनिक हिन्दी में यहाँ अलग से ‘और’ या ‘अब’ रखना आवश्यक नहीं, क्योंकि प्रसंग-संबंध स्वाभाविक रूप से स्पष्ट है।
- source_word: נָתַן
  choice: दे दिया था
  rationale: पूर्ण हो चुकी और प्रसंग की अन्य घटनाओं से पहले घटित क्रिया को हिन्दी का पूर्ण भूतकाल स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִיכַל בִּתּוֹ
  choice: अपनी बेटी मीकल
  rationale: यह मीकल की पहचान शाऊल की बेटी के रूप में करता है; ‘अपनी’ हिन्दी में संबंध को स्पष्ट और सहज बनाता है।
- source_word: אֵשֶׁת דָּוִד
  choice: जो दाऊद की पत्नी थी
  rationale: समानाधिकरण संबंध को स्वाभाविक हिन्दी उपवाक्य में व्यक्त करते हुए यह मूल का वैवाहिक दावा बनाए रखता है।
- source_word: לְפַלְטִי
  choice: पलती को
  rationale: नाम פַלְטִי का देवनागरी लिप्यंतरण इब्रानी उच्चारण के निकट रखा गया है।
- source_word: בֶן לַיִשׁ
  choice: लैश के बेटे
  rationale: इब्रानी पितृनाम-सूचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אֲשֶׁר מִ/גַּלִּים
  choice: पलती गल्लীম का रहनेवाला था
  rationale: संबंधवाचक खंड पलती के मूल स्थान की पहचान करता है; अलग वाक्य हिन्दी में संदर्भ को अस्पष्ट होने से बचाता है।
theological_decisions:
- issue: मीकल का दाऊद की पत्नी के रूप में वर्णन, जबकि शाऊल ने उसे पलती को दे दिया
  choice: ‘जो दाऊद की पत्नी थी’ को बिना व्याख्यात्मक नरमी के बनाए रखा
  alternative: ‘जो पहले दाऊद की पत्नी थी’
  rationale: मूल पाठ אֵשֶׁת דָּוִד सीधे ‘दाऊद की पत्नी’ कहता है और ‘पहले’ नहीं जोड़ता; इससे उत्पन्न कानूनी या वैवाहिक तनाव को अनुवाद में हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबे संबंधवाचक वाक्य से पैदा होने वाली अस्पष्टता टालने के लिए स्थान-सूचक खंड को दूसरे वाक्य में रखा गया है।
