base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/005.yaml
  text: So David sent ten young men[a], and David said to the young men, “Go up to Carmel, and go to Nabal, and greet him in my name with peace.”
translation:
  language: hi
  text: तब दाऊद ने दस युवकों को भेजा और उनसे कहा, “कर्मेल जाओ, नाबाल के पास जाकर मेरे नाम से उसका कुशल-क्षेम पूछना।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे नाम से उसे शांति का अभिवादन देना।” इब्रानी अभिव्यक्ति में किसी के कुशल-क्षेम के बारे में पूछने और शांति के अभिवादन का भाव दोनों हो सकते हैं।
    reason: लְשָׁלוֹם इस अभिवादन-सूत्र में कुशल-क्षेम की पूछताछ अथवा शांति के अभिवादन, दोनों के भाव को व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: कथात्मक संदर्भ में שׁלח की सीधी और स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: עֲשָׂרָה נְעָרִים
  choice: दस जवानों
  rationale: נְעָרִים आयु अथवा अधीनस्थ सेवक, दोनों का संकेत दे सकता है; यहाँ दूत की भूमिका संदर्भ से स्पष्ट है, इसलिए सामाजिक पद को अनावश्यक रूप से निश्चित किए बिना ‘जवान’ रखा गया है।
- source_word: עֲלוּ כַרְמֶלָה
  choice: कर्मेल को जाओ
  rationale: עלה यात्रा की दिशा या ऊँचाई की ओर जाने को व्यक्त करता है और दिशासूचक ה गंतव्य बताता है; प्राकृतिक हिन्दी में ‘कर्मेल को जाओ’ पर्याप्त है।
- source_word: וּבָאתֶם אֶל נָבָל
  choice: नाबाल के पास पहुँचकर
  rationale: בוא का मूल भाव आना/पहुँचना है; दाऊद के निर्देशों में ‘पहुँचकर’ हिन्दी में दृष्टिकोण की अस्वाभाविकता से बचते हुए क्रम को स्पष्ट करता है।
- source_word: וּשְׁאֶלְתֶּם לוֹ בִשְׁמִי לְשָׁלוֹם
  choice: मेरी ओर से उसका कुशल-क्षेम पूछना
  rationale: यह अभिवादन में किसी की शांति अथवा भलाई पूछने का मुहावरा है। ‘मेरी ओर से’ प्रतिनिधित्व का स्वाभाविक हिन्दी रूप है और ‘कुशल-क्षेम’ שָׁלוֹם के कल्याण-संबंधी भाव को व्यक्त करता है।
