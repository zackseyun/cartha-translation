- source_word: אֲמָתְךָ
  choice: आपकी दासी
  rationale: स्त्री सेवक अथवा दास के लिए प्रयुक्त शब्द और विनम्र आत्म-संबोधन—दोनों को ‘दासी’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשִׁפְחָה
  choice: एक सेविका
