translation:
  language: hi
  text: वह उठी और मुँह के बल भूमि पर झुक गई[a] और बोली, “देखिए, आपकी दासी मेरे स्वामी के सेवकों के पैर धोने के लिए सेविका बनने को प्रस्तुत है।”
  philosophy: optimal-equivalence
  footnotes:
