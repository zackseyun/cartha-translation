- source_word: עַבְדֵי אֲדֹנִי
  choice: मेरे स्वामी के सेवकों
  rationale: עבד यहाँ दाऊद के परिचारकों के लिए है, इसलिए ‘सेवकों’ उपयुक्त है; אֲדֹנִי का आदरसूचक सामाजिक भाव ‘मेरे स्वामी’ से बना रहता है।
theological_decisions:
- issue: אמה और שפחה—स्त्री की दासता/सेवा के दो निकटार्थी पद
  choice: ‘दासी’ और ‘सेविका’ के रूप में अलग-अलग प्रस्तुत करना
  alternative: दोनों को ‘दासी’ कहना, अथवा दूसरे पद को अधिक स्पष्ट रूप से ‘दासी स्त्री’ कहना
  rationale: मूल पाठ दो अलग किंतु निकटार्थी शब्दों से अबीगैल की अत्यंत विनम्र आत्म-स्थिति व्यक्त करता है। हिन्दी में भेद बनाए रखने से यह शैलीगत प्रभाव बचता है, जबकि पादटिप्पणी संभावित दासता-सूचक अर्थ को स्पष्ट करती है और पाठ में अस्वाभाविक कठोरता नहीं लाती।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरपूर्ण और कथात्मक शैली। ‘देखिए’ ने הִנֵּה का ध्यानाकर्षक भाव बिना पुरातन भाषा के रखा है। ‘मेरे स्वामी’ सामाजिक आदर व्यक्त करता है; ‘दासी/सेविका’ की जोड़ी मूल की विनम्रता और शब्द-विविधता को संतुलित रूप से सुरक्षित रखती है।
