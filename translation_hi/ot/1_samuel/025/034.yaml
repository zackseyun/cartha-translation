source:
  edition: WLC
  text: וְ/אוּלָ֗ם חַי יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אֲשֶׁ֣ר מְנָעַ֔/נִי מֵ/הָרַ֖ע אֹתָ֑/ךְ כִּ֣י לוּלֵ֣י מִהַ֗רְתְּ ו/תבאתי לִ/קְרָאתִ֔/י כִּ֣י אִם נוֹתַ֧ר לְ/נָבָ֛ל עַד א֥וֹר הַ/בֹּ֖קֶר מַשְׁתִּ֥ין בְּ/קִֽיר־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/034.yaml
  text: But as Yahweh[a], the God of Israel, lives, who has kept me from harming you, if you had not hurried and come to meet me, surely by the light of morning not one male would have been left to Nabal.
translation:
  language: hi
  text: परन्तु याहवे, इस्राएल के परमेश्वर, के जीवित होने की शपथ, जिन्होंने मुझे तुम्हारी हानि करने से रोका है—यदि तुम जल्दी से मुझसे मिलने न आई होतीं, तो भोर का उजाला होने तक नाबाल का एक भी पुरुष[a] न बचता।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “दीवार पर पेशाब करने वाला।” यह एक भद्दा हिब्रू मुहावरा है, जिसका अर्थ यहाँ “कोई भी पुरुष” है।'
    reason: मूल के कठोर और भद्दे मुहावरे को मुख्य पाठ में शाब्दिक रखने से अर्थ अस्पष्ट होता; पादटिप्पणी मूल अभिव्यक्ति और उसके आशय दोनों को सुरक्षित रखती है।
lexical_decisions:
- source_word: וְאוּלָם
  choice: परन्तु
  rationale: यह अव्यय पिछली बात के विपरीत दाऊद की गंभीर और शपथपूर्वक कही गई बात प्रस्तुत करता है।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: हिब्रू की प्रचलित शपथ-शैली का स्वाभाविक और गरिमापूर्ण हिन्दी रूप, जिसमें परमेश्वर के जीवित होने को शपथ का आधार बनाया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले हिब्रू ईश्वरीय नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: संबंधवाचक हिब्रू पदबंध का सीधा और स्वाभाविक अनुवाद।
- source_word: אֲשֶׁר מְנָעַנִי מֵהָרַע אֹתָךְ
  choice: जिन्होंने मुझे तुम्हारी हानि करने से रोका है
  rationale: מנע का अर्थ रोकना है और הרע אתך इस प्रसंग में अबीगैल तथा उसके घराने के विरुद्ध हानि करने की ओर संकेत करता है। स्त्रीलिंग एकवचन ‘तुम्हारी’ मूल संबोधन को बनाए रखता है।
- source_word: כִּי לוּלֵי מִהַרְתְּ וַתָּבֹאתִי לִקְרָאתִי
  choice: यदि तुम फुर्ती करके मुझसे मिलने न आतीं
  rationale: प्रतितथ्य शर्त तथा अबीगैल को संबोधित स्त्रीलिंग एकवचन रूप को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: עַד אוֹר הַבֹּקֶר
  choice: भोर का उजाला होने तक
  rationale: मूल के समय-सूचक पदबंध ‘भोर के प्रकाश तक’ का सहज हिन्दी रूप।
- source_word: מַשְׁתִּין בְּקִיר
  choice: एक भी पुरुष[a]
  rationale: शाब्दिक रूप से यह एक भद्दा शारीरिक मुहावरा है, जिसका प्रसंगगत आशय नाबाल के घराने के पुरुषों से है; मुख्य पाठ में अर्थ और पादटिप्पणी में मूल बिंब रखा गया है।
- source_word: נוֹתַר לְנָבָל
  choice: नाबाल का ... न बचता
  rationale: לְנָבָל संबंध अथवा अधिकार दर्शाता है और נותר किसी के शेष बचने को; प्रतितथ्य परिणाम को हिन्दी में ‘न बचता’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में ईश्वर का निजी वाचा-नाम सीधे आया है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक लिप्यंतरण है।
- issue: दाऊद को हिंसा से रोकने वाले कर्ता की पहचान
  choice: याहवे ने दाऊद को रोका
  alternative: अबीगैल ने दाऊद को रोका
  rationale: व्याकरण में संबंधवाचक אֲשֶׁר का निकटतम और स्वाभाविक पूर्वपद ‘इस्राएल के परमेश्वर याहवे’ है। फिर भी प्रसंग में अबीगैल इसका मानवीय माध्यम है; अनुवाद इस संबंध को आगे बढ़ाकर स्पष्ट नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शपथ की गंभीरता बनी रहती है, स्त्रीलिंग संबोधन स्पष्ट है, और मूल के भद्दे मुहावरे को पठनीय मुख्य पाठ के साथ पादटिप्पणी में दर्शाया गया है।
