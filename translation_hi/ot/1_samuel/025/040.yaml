base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/040.yaml
  text: So David’s servants came to Abigail at Carmel and spoke to her[a], saying, “David has sent us to you to take you for himself as a wife.”
translation:
  language: hi
  text: तब दाऊद के सेवक कर्मेल में अबीगैल के पास आए और उससे कहा, “दाऊद ने हमें तुम्हारे पास भेजा है, ताकि वह तुम्हें अपनी पत्नी बनाए[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “तुम्हें अपने लिए पत्नी के रूप में लेने के लिए।” अर्थात्, तुमसे विवाह करने के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹאוּ
  choice: आए
  rationale: בוא संदर्भ के दृष्टिकोण के अनुसार ‘आना’ या ‘जाना’ हो सकता है। यहाँ सेवकों का अबीगैल के पास पहुँचने का वर्णन है, इसलिए ‘आए’ स्वाभाविक है।
- source_word: עַבְדֵי דָוִד
  choice: दाऊद के सेवक
  rationale: עֶבֶד का अर्थ सेवक, दास या अधिकारी हो सकता है। यहाँ वे दाऊद के दूत बनकर आए हैं और बंधुआ स्थिति पर बल नहीं है, इसलिए ‘सेवक’ उपयुक्त है।
- source_word: הַכַּרְמֶלָה
  choice: कर्मेल में
  rationale: दिशासूचक प्रत्यय कर्मेल की ओर गति दिखाता है; आगमन पूरा होने के कारण हिन्दी में स्थान को ‘कर्मेल में’ कहना स्वाभाविक है।
- source_word: וַיְדַבְּרוּ אֵלֶיהָ לֵאמֹר
  choice: उससे कहा
  rationale: यह इब्रानी में वचन आरम्भ करने का प्रचलित सूत्र है। शाब्दिक ‘उससे बोलते हुए कहा’ की अपेक्षा ‘उससे कहा’ आधुनिक हिन्दी में सहज है।
- source_word: שְׁלָחָנוּ
  choice: हमें ... भेजा है
  rationale: पूर्ण क्रिया वर्तमान परिस्थिति से जुड़ी हुई है; ‘भेजा है’ दूतों के चल रहे प्रतिनिधि-कार्य को स्पष्ट करता है।
- source_word: לְקַחְתֵּךְ לוֹ לְאִשָּׁה
  choice: ताकि वह तुम्हें अपनी पत्नी बनाए
  rationale: לקח ... לְאִשָּׁה विवाह के प्रसंग में किसी स्त्री को पत्नी के रूप में ग्रहण करने का मुहावरा है। हिन्दी में ‘अपनी पत्नी बनाए’ उसका स्पष्ट और स्वाभाविक अर्थ देता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
