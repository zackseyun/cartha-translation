base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/001.yaml
  text: Samuel died[a], and all Israel gathered and mourned for him, and they buried him at his house in Ramah. Then David arose and went down to the wilderness of Paran.
translation:
  language: hi
  text: शमूएल की मृत्यु हो गई। तब समस्त इस्राएल इकट्ठा हुआ और उसके लिए शोक मनाया[a]। उन्होंने उसे रामा में उसके घर पर दफना दिया। फिर दाऊद उठकर पारान के वीराने की ओर नीचे चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके लिए विलाप किया।” इब्रानी क्रिया मृतक के लिए शोक मनाने की विधियों को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּמָת שְׁמוּאֵל
  choice: शमूएल की मृत्यु हो गई
  rationale: साधारण कथात्मक अर्थ को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है; आरंभिक וַ का कथात्मक संबंध अगले वाक्य के ‘तब’ से स्पष्ट होता है।
- source_word: וַיִּקָּבְצוּ כָל יִשְׂרָאֵל
  choice: तब समस्त इस्राएल इकट्ठा हुआ
  rationale: ‘समस्त इस्राएल’ मूल के सामूहिक राष्ट्रीय पदबंध को बनाए रखता है; एक सामूहिक इकाई होने के कारण एकवचन क्रिया स्वाभाविक है।
- source_word: וַיִּסְפְּדוּ לוֹ
  choice: उसके लिए शोक मनाया[a]
  rationale: क्रिया मृतक के लिए किए जाने वाले शोक और विलाप के संस्कारों को दर्शाती है। ‘शोक मनाया’ सामान्य पाठक के लिए स्पष्ट है, जबकि पादटिप्पणी अधिक विशिष्ट विकल्प बताती है।
- source_word: וַיִּקְבְּרֻהוּ בְּבֵיתוֹ בָּרָמָה
  choice: उन्होंने उसे रामा में उसके घर पर दफना दिया
  rationale: ‘घर पर’ मूल के בְּבֵיתוֹ को निकटता से रखता है, पर हिन्दी में भवन के भीतर दफनाए जाने का अनावश्यक निश्चित दावा नहीं करता; आशय घर या उससे जुड़ी संपत्ति का हो सकता है।
- source_word: וַיָּקָם דָּוִד
  choice: फिर दाऊद उठकर
  rationale: यह कथानक में अगली गति और प्रस्थान को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיֵּרֶד אֶל מִדְבַּר פָּארָן
  choice: पारान के वीराने में चला गया
  rationale: מִדְבָּר के निर्जन, कम आबाद क्षेत्र के अर्थ को ‘वीराना’ सहज हिन्दी में व्यक्त करता है। ירד का दिशात्मक भाव हिन्दी में इस प्रसंग में कृत्रिम लगने वाले ‘नीचे गया’ के बजाय सामान्य गति-क्रिया में समाहित किया गया है।
