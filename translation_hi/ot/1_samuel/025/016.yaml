  text: חוֹמָה֙ הָי֣וּ עָלֵ֔י/נוּ גַּם לַ֖יְלָה גַּם יוֹמָ֑ם כָּל יְמֵ֛י הֱיוֹתֵ֥/נוּ עִמָּ֖/ם רֹעִ֥ים הַ/צֹּֽאן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/016.yaml
  text: They were a wall around us both by night and by day[b][a], all the days we were with them tending the flock.
translation:
  language: hi
  text: जितने दिन हम उनके साथ भेड़-बकरियाँ चरा रहे थे, वे रात-दिन हमारे चारों ओर दीवार बने रहे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חוֹמָה
  choice: दीवार
  rationale: शाब्दिक संज्ञा और सुरक्षा का सजीव रूपक—दोनों बनाए रखता है।
- source_word: הָיוּ עָלֵינוּ
  choice: हमारे चारों ओर दीवार बने रहे
  rationale: עַל का मूल भाव ‘ऊपर/पर’ हो सकता है, पर दीवार के रूपक के साथ प्रसंगगत अर्थ चारों ओर रहकर रक्षा करना है; हिंदी में यह स्वाभाविक अभिव्यक्ति है।
- source_word: גַּם לַיְלָה גַּם יוֹמָם
  choice: रात-दिन
  rationale: גם...גם द्वारा व्यक्त रात और दिन की निरंतरता को संक्षिप्त, स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל יְמֵי הֱיוֹתֵנוּ עִמָּם
  choice: जितने दिन हम उनके साथ ... रहे थे
  rationale: समूची अवधि के कालगत भाव को स्पष्ट और आधुनिक हिंदी में सुरक्षित रखता है।
- source_word: רֹעִים הַצֹּאן
  choice: भेड़-बकरियाँ चरा रहे थे
  rationale: רעה चराने/पालने की क्रिया है और צאן भेड़ों तथा बकरियों के सामूहिक छोटे पशुधन को सूचित कर सकता है; यह हिंदी में अर्थ को स्पष्ट करता है।
