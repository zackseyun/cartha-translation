  register: आधुनिक मानक हिंदी; सरल, गरिमापूर्ण और कथात्मक। ‘दीवार’ का मूल रूपक सुरक्षित रखा गया है, जबकि शब्दक्रम स्वाभाविक हिंदी के अनुसार किया गया है।
