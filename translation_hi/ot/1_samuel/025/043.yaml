lexical_decisions:
- source_word: לָקַח
  choice: पत्नी के रूप में ग्रहण किया
  rationale: क्रिया का मूल अर्थ ‘लिया’ है, पर इस वैवाहिक संदर्भ में हिन्दी में ‘पत्नी के रूप में ग्रहण किया’ अर्थ को स्वाभाविक और स्पष्ट रखता है; अगला खंड भी इसी वैवाहिक अर्थ की पुष्टि करता है।
- source_word: אֲחִינֹעַם
  choice: अहीनोअम
  rationale: व्यक्तिनाम का मानक हिन्दी लिप्यंतरण।
- source_word: מִיִּזְרְעֶאל
  choice: यिज्रेल की
  rationale: מִן और स्थाननाम का मेल उसके यिज्रेल से होने का संकेत देता है। हिन्दी में व्यक्तिनाम के साथ ‘यिज्रेल की’ स्वाभाविक भौगोलिक संबोधन है; ‘यिज्रेल से’ भी अधिक शाब्दिक विकल्प है।
- source_word: וַתִּהְיֶיןָ גַּם שְׁתֵּיהֶן
  choice: और वे दोनों ... हो गईं
  rationale: स्त्रीलिंग बहुवचन क्रिया और ‘दोनों’ अहीनोअम तथा अबीगैल की ओर संकेत करते हैं। ‘हो गईं’ היה के घटनात्मक भाव को सुरक्षित रखता है।
- source_word: לְנָשִׁים
  choice: उसकी पत्नियाँ
  rationale: לּוֹ לְנָשִׁים का स्वाभाविक हिन्दी अर्थ ‘उसकी पत्नियाँ’ है और बहुवचन वैवाहिक संबंध को स्पष्ट बनाए रखता है।
- source_word: גַּם
  choice: भी
  rationale: यह निपात अबीगैल के अतिरिक्त अहीनोअम को ग्रहण किए जाने का योगसूचक भाव व्यक्त करता है।
theological_decisions:
- issue: एक पुरुष की अनेक पत्नियों का वर्णन
  choice: पाठ के अनुसार दोनों स्त्रियों को दाऊद की पत्नियाँ कहा गया है।
  alternative: बहुविवाह के उल्लेख को नरम या परोक्ष बनाना।
  rationale: इब्रानी पाठ स्थिति का सीधा वर्णन करता है। अनुवाद न तो इसे छिपाता है, न इस पद में कोई अतिरिक्त नैतिक निर्णय जोड़ता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘पत्नी के रूप में ग्रहण किया’ केवल ‘लिया’ की सम्भावित अस्पष्टता दूर करता है, जबकि ‘हो गईं’ मूल क्रिया की गति बनाए रखता है।
