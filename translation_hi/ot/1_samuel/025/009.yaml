  text: When David’s young men came[a], they spoke to Nabal all these words in David’s name, and then they rested.
translation:
  language: hi
  text: जब दाऊद के जवान पहुँचे, तो उन्होंने नाबाल को दाऊद के नाम से ये सारी बातें कहीं और फिर ठहर गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विश्राम किया” अथवा “प्रतीक्षा की।” इब्रानी क्रिया का सामान्य अर्थ “विश्राम करना” या “ठहरना” है; इस संदर्भ में इसका अर्थ बोलना समाप्त करके नाबाल के उत्तर की प्रतीक्षा करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַעֲרֵי דָוִד
  choice: दाऊद के जवान
  rationale: נַעַר युवक, सेवक या सहायक को सूचित कर सकता है। यहाँ दाऊद के संदेशवाहक अनुचर अभिप्रेत हैं; ‘जवान’ उनकी आयु-संबंधी धारणा को बनाए रखता है और उन्हें बच्चे नहीं बताता।
- source_word: וַיָּבֹאוּ
  choice: वहाँ पहुँचे
  rationale: בוא का मूल अर्थ ‘आना/पहुँचना’ है। प्रसंग में संदेशवाहकों का नाबाल के पास पहुँच जाना अभिप्रेत है; ‘वहाँ पहुँचे’ हिन्दी कथन में स्वाभाविक है।
- source_word: וַיְדַבְּרוּ אֶל נָבָל
  choice: नाबाल को ... कहीं
  rationale: דבר עם אֶל का अर्थ किसी से/को बोलना है। ‘नाबाल को ... बातें कहीं’ आधुनिक हिन्दी में स्वाभाविक रूप से दिशात्मक भाव व्यक्त करता है।
- source_word: כְּכָל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: शाब्दिक संरचना ‘इन सब वचनों के अनुसार’ है, अर्थात उन्होंने पहले दिया गया पूरा संदेश सुनाया। ‘ये सारी बातें’ हिन्दी में उसी आशय को स्पष्ट और सहज रखता है।
- source_word: בְּשֵׁם דָּוִד
  choice: दाऊद की ओर से
  rationale: בְּשֵׁם यहाँ प्रतिनिधित्व और अधिकार का भाव देता है। ‘दाऊद की ओर से’ आधुनिक हिन्दी में इसी अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיָּנוּחוּ
  choice: चुप हो गए
  rationale: נוח का सामान्य अर्थ ‘विश्राम करना/ठहरना’ है, पर संदेश पूरा करने के बाद यहाँ संभवतः बोलना बंद करके उत्तर की प्रतीक्षा करना अभिप्रेत है। ‘चुप हो गए’ उस प्रसंगगत क्रिया को व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
