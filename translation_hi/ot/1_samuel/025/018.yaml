base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/025/018.yaml
  text: Then Abigail hurried and took two hundred loaves of bread[a], two skins of wine, five sheep already prepared, five seahs of roasted grain, a hundred clusters of raisins, and two hundred cakes of figs, and put them on the donkeys.
translation:
  language: hi
  text: तब अबीगैल ने शीघ्रता से दो सौ रोटियाँ, दाखमधु की दो मशकें, भोजन के लिए तैयार पाँच भेड़ें, पाँच सेआ[a] भुना हुआ अनाज, किशमिश के सौ गुच्छे और अंजीर की दो सौ टिकियाँ ले लीं और उन्हें गधों पर लाद दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सेआ’ सूखी वस्तुओं को नापने की एक प्राचीन माप थी; इसका अनुवाद ‘पाँच माप भुना हुआ अनाज’ भी किया जा सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַתְּמַהֵר
  choice: तब अबीगैल ने फुर्ती की
  rationale: क्रिया का अर्थ शीघ्रता करना है। ‘फुर्ती की’ कथानक की तात्कालिकता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘तब’ वाव-क्रम की कथात्मक प्रगति दर्शाता है।
- source_word: וַתִּקַּח
  choice: लीं
  rationale: לקח का सीधा अर्थ ‘लेना’ है। सूची में अनेक वस्तुएँ होने के कारण हिन्दी में स्त्रीलिंग बहुवचन ‘लीं’ स्वाभाविक है।
- source_word: מָאתַיִם לֶחֶם
  choice: दो सौ रोटियाँ
  rationale: לֶחֶם मूलतः रोटी/भोजन है; गिनी जाने वाली वस्तुओं की इस सूची में ‘रोटियाँ’ हिन्दी पाठक के लिए स्पष्ट और स्रोत के निकट है।
- source_word: שְׁנַיִם נִבְלֵי יַיִן
  choice: दाखमधु की दो मशकें
  rationale: נֵבֶל यहाँ तरल रखने की चमड़े की मशक को सूचित करता है। ‘मशकें’ प्राचीन पात्र को बनाए रखता है और आधुनिक बोतल का अनैतिहासिक बोध नहीं लाता। יַיִן के लिए ‘दाखमधु’ गरिमापूर्ण और सहज बाइबलीय हिन्दी है।
- source_word: חָמֵשׁ צֹאן עֲשׂוּיוֹת
  choice: तैयार की हुई पाँच भेड़ें
  rationale: עשה का कृदंत बताता है कि भेड़ें भोजन के लिए तैयार की जा चुकी थीं। यह अनुवाद तैयारी की ठीक अवस्था—काटी हुई या पकाई हुई—को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: חָמֵשׁ סְאִים קָלִי
  choice: पाँच सआ भुना हुआ अनाज
  rationale: סְאָה एक विशिष्ट प्राचीन सूखी माप है, इसलिए उसे ‘सआ’ के रूप में रखा गया है और पादटिप्पणी में समझाया गया है। קָלִי भुने हुए अनाज को दर्शाता है।
- source_word: מֵאָה צִמֻּקִים
  choice: किशमिश के सौ गुच्छे
  rationale: צִמֻּקִים सूखे अंगूरों को दर्शाता है, जिन्हें यहाँ गिनी जाने वाली गठी हुई मात्राओं/गुच्छों के रूप में समझना सूची के संदर्भ में स्वाभाविक है। ‘गुच्छे’ बाद की अंजीर की टिकियों से भेद भी बनाए रखता है।
- source_word: מָאתַיִם דְּבֵלִים
  choice: अंजीर की दो सौ टिकियाँ
  rationale: דְּבֵלָה दबाकर बनाई गई अंजीर की टिकिया है। ‘टिकियाँ’ उसके खाद्य रूप को संक्षेप और स्पष्ट रूप से व्यक्त करता है।
- source_word: וַתָּשֶׂם עַל הַחֲמֹרִים
  choice: और उन्हें गधों पर लाद दिया
  rationale: शाब्दिक अर्थ ‘गधों पर रखा’ है; इतने प्रावधानों के संदर्भ में ‘लाद दिया’ हिन्दी में अभिप्रेत क्रिया को स्वाभाविक रूप से व्यक्त करता है।
