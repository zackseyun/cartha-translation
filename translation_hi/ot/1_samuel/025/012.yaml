  text: तब दाऊद के जवान मुड़े और अपने रास्ते लौट चले। वे वापस आए और उन्होंने उसे ये सारी बातें बताईं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּהַפְכוּ
  choice: लौट पड़े
  rationale: הפך यहाँ दिशा पलटकर वापस जाने को व्यक्त करता है; ‘लौट पड़े’ आधुनिक हिन्दी में इस गतिशील अर्थ को स्वाभाविक रूप से बताता है।
- source_word: נַעֲרֵי דָוִד
  choice: दाऊद के जवान
  rationale: נַעַר युवक, सेवक या परिचर को सूचित कर सकता है। संदर्भ में ये दाऊद के संदेशवाहक हैं; ‘जवान’ आयु/स्थिति की व्यापकता बनाए रखता है और सेवकत्व को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: לְדַרְכָּם
  choice: अपने रास्ते से
  rationale: शाब्दिक रूप से ‘अपने मार्ग की ओर’; दिशा पलटने के साथ हिन्दी में ‘अपने रास्ते से लौट पड़े’ स्वाभाविक है और वापसी के मार्ग का संकेत देता है।
- source_word: וַיָּשֻׁבוּ וַיָּבֹאוּ
  choice: वे वापस आए
  rationale: दोनों क्रियाएँ लौटने और पहुँचने की क्रमिक गति बताती हैं। हिन्दी में ‘वापस आए’ इस क्रम को संक्षेप में, बिना अर्थ खोए, स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּגִּדוּ לוֹ
  choice: उन्होंने उसे ... बता दीं
  rationale: נגד यहाँ सूचना देने या वृत्तांत सुनाने के अर्थ में है; ‘बता दीं’ सहज आधुनिक हिन्दी है।
- source_word: כְּכֹל הַדְּבָרִים הָאֵלֶּה
  choice: ये सारी बातें
  rationale: דְּבָרִים का अर्थ ‘शब्द/बातें’ या ‘विषय/घटनाएँ’ हो सकता है। नाबाल के मौखिक उत्तर के संदर्भ में ‘बातें’ हिन्दी में दोनों संभावनाओं को अपेक्षाकृत स्वाभाविक रूप से सँभालता है।
