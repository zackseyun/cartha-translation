base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/016.yaml
  text: And the man would say to him[a], “Let them first burn the fat today, and then take for yourself whatever your soul desires.” But he would say to him, “No, you must give it now; and if not, I will take it by force.”
translation:
  language: hi
  text: वह मनुष्य उससे कहता, “पहले वे आज चर्बी अवश्य जलाएँ, फिर तू अपने लिए जो कुछ तेरा मन चाहे ले लेना।” पर वह उससे कहता, “नहीं, अभी दे; वरना मैं उसे बलपूर्वक ले लूँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הָאִישׁ
  choice: वह मनुष्य
  rationale: निश्चित एकवचन पुल्लिंग संज्ञा यहाँ बलि चढ़ाने आए व्यक्ति को सूचित करती है; ‘वह मनुष्य’ उसके कथानक-संदर्भ और व्याकरणिक रूप दोनों को बनाए रखता है।
- source_word: קַטֵּר יַקְטִירוּן
  choice: अवश्य जलाएँ
  rationale: धातु קטר के infinitive absolute और imperfect का मेल क्रिया पर बल देता है। ‘अवश्य’ उस प्रबलता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּיּוֹם
  choice: आज
  rationale: इस प्रसंग में यह समयसूचक अभिव्यक्ति है; ‘आज’ उसका सीधा और सहज हिन्दी रूप है।
- source_word: הַחֵלֶב
  choice: चर्बी
  rationale: यह बलि की उन चर्बीदार भेंटों को दर्शाता है जिन्हें वेदी पर जलाया जाता था; ‘चर्बी’ सामान्य और प्रसंगानुकूल शब्द है।
- source_word: וְקַח לְךָ
  choice: उसके बाद तू अपने लिए ... ले लेना
  rationale: आज्ञार्थक क्रिया सेवक को संबोधित है। ‘उसके बाद’ प्रसंग में अपेक्षित क्रम स्पष्ट करता है और ‘अपने लिए’ לְךָ को व्यक्त करता है।
- source_word: כַּאֲשֶׁר תְּאַוֶּה נַפְשֶׁךָ
  choice: जो कुछ तेरा मन चाहे
  rationale: शाब्दिक अर्थ ‘जैसा तेरी प्राण-इच्छा हो’ है। हिन्दी मुहावरे में ‘तेरा मन चाहे’ इच्छा को स्वाभाविक ढंग से व्यक्त करता है, बिना मात्रा या वस्तु को अनावश्यक रूप से सीमित किए।
- source_word: וְאָמַר לוֹ
  choice: पर वह उससे कहता
  rationale: आसपास का वर्णन बार-बार होने वाली प्रथा बताता है; वर्तमान अभ्यस्त रूप ‘कहता’ इसे व्यक्त करता है। ‘पर’ सेवक के विरोधपूर्ण उत्तर को स्पष्ट करता है।
- source_word: כִּי עַתָּה תִתֵּן
  choice: नहीं, अभी दे
  rationale: כִּי यहाँ प्रतिवाद अथवा आग्रह का बल रखता है। मूल में अलग से ‘नहीं’ नहीं है, पर हिन्दी संवाद में यह सामने वाले प्रस्ताव को ठुकराने का स्वाभाविक संकेत है; संक्षिप्त आज्ञा धमकी का कठोर स्वर बनाए रखती है।
- source_word: וְאִם לֹא
  choice: वरना
  rationale: यह नकारात्मक शर्त को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לָקַחְתִּי בְחָזְקָה
  choice: मैं उसे बलपूर्वक ले लूँगा
  rationale: पूर्ण क्रियारूप धमकी में भावी परिणाम व्यक्त करता है; בְחָזְקָה जबरदस्ती अथवा शक्ति से छीनने का भाव रखता है।
theological_decisions:
- issue: उपासक के विरोध में निहित बलिदान-विधि का क्रम
  choice: पहले चर्बी जलाने और उसके बाद सेवक के मांस लेने का क्रम स्पष्ट रखा गया है।
  alternative: क्रम को स्पष्ट किए बिना अधिक शब्दशः रूप में केवल ‘आज चर्बी अवश्य जलाएँ, और तू ले’ कहना।
  rationale: पद सेवकों की माँग को उचित बलिदान-क्रम के विरुद्ध दिखाता है। क्रम स्पष्ट करना प्रसंग को समझने के लिए आवश्यक है, पर मुख्य पाठ में अतिरिक्त विधिक या धर्मवैज्ञानिक व्याख्या नहीं जोड़ी गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज कथात्मक शैली रखी गई है। प्रत्यक्ष संवाद में ‘तू/तेरा’ मूल के एकवचन संबोधन और सेवक के कठोर व्यवहार को बनाए रखता है; भाषा में किसी संप्रदाय-विशेष की शब्दावली नहीं जोड़ी गई।
