base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/029.yaml
  text: Why do you scorn my sacrifice and my offering[a], which I commanded for the dwelling, and honor your sons above me, fattening yourselves from the first of every offering of Israel[c][b], my people?
translation:
  language: hi
  text: तुम लोग मेरे बलिदान और मेरी भेंट को[a], जिनकी आज्ञा मैंने निवास-स्थान के लिए दी थी[b], क्यों तुच्छ समझते हो? और तू अपने पुत्रों का आदर मुझसे बढ़कर करता है, ताकि तुम लोग मेरी प्रजा इस्राएल की हर भेंट के उत्तम भाग से अपने आप को मोटा करो[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘लात मारते हो’; अर्थात् अवमानना करके तुच्छ समझते हो।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘जिसकी आज्ञा मैंने निवास-स्थान के लिए/में दी।’ अंतिम शब्द पवित्रस्थान को परमेश्वर के निवास-स्थान के रूप में सूचित कर सकता है।
    reason: alternative_reading
  - marker: c
    text: ‘उत्तम भाग’ का अनुवाद ‘पहले भाग’ भी किया जा सकता है। ‘अपने आप को मोटा करो’ में मूल इब्रानी की कठोर, चित्रात्मक भाषा सुरक्षित रखी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִבְעֲטוּ
  choice: तुच्छ समझते हो
  rationale: मूल क्रिया में सचमुच ‘लात मारने’ की सजीव छवि है, पर यहाँ उसका भाव अवमानना और तिरस्कार करना है। मुख्य पाठ में स्वाभाविक हिन्दी रखी गई है और चित्रात्मक अर्थ पादटिप्पणी में दिया गया है।
- source_word: זִבְחִי וּבְמִנְחָתִי
  choice: मेरे बलिदान और मेरी भेंट
  rationale: זֶבַח वध-संबंधी बलिदान है, जबकि מִנְחָה भेंट को सूचित करता है और यहाँ व्यापक उपासना-संदर्भ में प्रयुक्त हो सकता है। यह युग्म हिन्दी में अर्थभेद को सहज रूप से बनाए रखता है।
- source_word: אֲשֶׁר צִוִּיתִי מָעוֹן
  choice: जिनकी आज्ञा मैंने अपने निवास-स्थान के लिए दी थी
  rationale: מָעוֹן यहाँ सम्भवतः पवित्रस्थान को परमेश्वर के निवास-स्थान के रूप में दर्शाता है। कठिन और संक्षिप्त इब्रानी वाक्य-विन्यास को अर्थपूर्ण हिन्दी में प्रस्तुत किया गया है, बिना स्थान-संबंध को अत्यधिक निश्चित किए।
- source_word: וַתְּכַבֵּד אֶת־בָּנֶיךָ מִמֶּנִּי
  choice: तू अपने पुत्रों का आदर मुझसे बढ़कर क्यों करता है
  rationale: כבד का यहाँ सामान्य अर्थ ‘आदर करना’ है और מִמֶּנִּי स्पष्ट तुलनात्मक भाव देता है। आरम्भिक बहुवचन के बाद एकवचन में एली पर केंद्रित आरोप को बनाए रखा गया है।
- source_word: לְהַבְרִיאֲכֶם
  choice: अपने आप को मोटा करता है
  rationale: हिफ़ील रूप अनुचित रीति से खाकर मोटा या पुष्ट होने की ठोस, आरोपात्मक छवि देता है। इसे नरम करके केवल ‘पेट भरना’ नहीं किया गया।
- source_word: מֵרֵאשִׁית
  choice: उत्तम भाग से
  rationale: רֵאשִׁית का मूल भाव ‘पहला’ है, पर बलि-भेंट के संदर्भ में यह प्रथम और इस कारण श्रेष्ठ या चुनिंदा भाग का संकेत दे सकता है। सहज हिन्दी में प्रसंगगत अर्थ चुना गया और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: כָּל מִנְחַת יִשְׂרָאֵל לְעַמִּי
  choice: मेरी प्रजा इस्राएल की हर भेंट
  rationale: לְעַמִּי को इस्राएल की समानाधिकरण पहचान के रूप में समझा गया है—‘इस्राएल, मेरी प्रजा’। हिन्दी में ‘मेरी प्रजा इस्राएल’ इसी संबंध को स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: आरम्भिक बहुवचन और बाद के एकवचन का संबोधन
  choice: ‘तुम लोग ... समझते हो’ के बाद ‘तू ... करता है’
  alternative: पूरे पद में केवल एली को एकवचन में संबोधित करना
  rationale: תִבְעֲטוּ बहुवचन है, जबकि וַתְּכַבֵּד और בָּנֶיךָ एकवचन हैं। अनुवाद आरोप के पहले व्यापक दायरे—एली के घराने—और फिर एली पर व्यक्तिगत केंद्र को समतल नहीं करता।
- issue: एली की दोष-सहभागिता
  choice: पुत्रों को परमेश्वर से अधिक आदर देने और भेंटों के लाभ में सहभागी होने का सीधा आरोप
  alternative: केवल पुत्रों के दुराचार को रोकने में निष्क्रिय रहने का आरोप
  rationale: लְהַבְרִיאֲכֶם का बहुवचन एली के घराने की सामूहिक लाभ-सहभागिता को इंगित करता है। अनुवाद इससे आगे कोई doctrinal निष्कर्ष नहीं जोड़ता।
- issue: מָעוֹן का संबंध
  choice: ‘अपने निवास-स्थान के लिए’
  alternative: ‘निवास-स्थान में’ अथवा केवल ‘निवास-स्थान के लिए’
  rationale: शब्द सम्भवतः परमेश्वर के पवित्रस्थान को उसके निवास के रूप में सूचित करता है, पर इब्रानी में संबंध संक्षिप्त और कठिन है। मुख्य पाठ एक सुसंगत अर्थ देता है और वास्तविक अनिश्चितता को टिप्पणी में स्वीकार करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आरम्भिक बहुवचन से बाद के एकवचन में इब्रानी के बदलाव को जानबूझकर सुरक्षित रखा गया है। ‘बलिदान’, ‘भेंट’, ‘निवास-स्थान’ और ‘प्रजा’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि अस्पष्ट इब्रानी को अनावश्यक रूप से सांप्रदायिक या व्याख्यात्मक नहीं बनाया गया।
