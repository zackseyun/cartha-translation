source:
  edition: WLC
  text: וְ/אִ֗ישׁ לֹֽא אַכְרִ֤ית לְ/ךָ֙ מֵ/עִ֣ם מִזְבְּחִ֔/י לְ/כַלּ֥וֹת אֶת עֵינֶ֖י/ךָ וְ/לַ/אֲדִ֣יב אֶת נַפְשֶׁ֑/ךָ וְ/כָל מַרְבִּ֥ית בֵּיתְ/ךָ֖ יָמ֥וּתוּ אֲנָשִֽׁים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/033.yaml
  text: But I will not cut off every man of yours from beside my altar[a], to make your eyes fail and your soul grieve; and all the increase of your house will die by the sword of men.
translation:
  language: hi
  text: फिर भी मैं तेरे सभी पुरुषों को अपनी वेदी के पास से नष्ट नहीं करूँगा, ताकि तेरी आँखें क्षीण होती जाएँ और तेरा प्राण दुःखी हो; और तेरे घराने की सारी सन्तान पुरुषावस्था में ही मर जाएगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “पुरुष होकर मरेंगे”; सम्भवतः इसका अभिप्राय है, “भरी जवानी में मरेंगे।”
    reason: मूल इब्रानी के संक्षिप्त और अस्पष्ट प्रयोग का शाब्दिक रूप तथा सम्भावित अर्थ दोनों बताने के लिए।
lexical_decisions:
- source_word: וְאִישׁ לֹא אַכְרִית לְךָ מֵעִם מִזְבְּחִי
  choice: फिर भी मैं तेरे सभी पुरुषों को अपनी वेदी के पास से नष्ट नहीं करूँगा
  rationale: नकार के साथ אִישׁ का भाव यह है कि एली के वंश का प्रत्येक पुरुष समाप्त नहीं किया जाएगा। כרת के हिफ़ील रूप का न्याय-संदर्भ में अर्थ ‘नष्ट करना/काट डालना’ है, और מֵעִם को ‘के पास से’ द्वारा व्यक्त किया गया है। ‘सभी ... नहीं’ पूर्ण उन्मूलन न होने का भाव स्पष्ट रखता है।
- source_word: לְכַלּוֹת אֶת עֵינֶיךָ
  choice: जिससे तेरी आँखें क्षीण होती जाएँ
  rationale: כלה यहाँ आँखों के शोक और प्रतीक्षा में चुकते जाने की इब्रानी छवि देता है। ‘क्षीण होती जाएँ’ उस निरन्तर परिणाम को सहज हिन्दी में सुरक्षित रखता है।
- source_word: וְלַאֲדִיב אֶת נַפְשֶׁךָ
  choice: और तेरा प्राण शोकित रहे
  rationale: दुर्लभ क्रिया דיב/דאב दुःख या पीड़ा पहुँचाने का भाव देती है। נֶפֶשׁ के लिए ‘प्राण’ इब्रानी आन्तरिक-व्यक्ति की भाषा को बनाए रखता है; ‘शोकित रहे’ इस प्रसंग में स्वाभाविक है।
- source_word: וְכָל מַרְבִּית בֵּיתְךָ
  choice: पर तेरे घराने की सारी सन्तान
  rationale: מַרְבִּית का मूल भाव ‘वृद्धि/बहुलता’ है, पर घराने के संदर्भ में इससे बढ़ने वाली वंश-सन्तान अभिप्रेत है। ‘सारी सन्तान’ आधुनिक हिन्दी में अर्थ स्पष्ट करती है।
- source_word: יָמֻתוּ אֲנָשִׁים
  choice: पुरुषावस्था में ही मर जाएगी
  rationale: शाब्दिक रचना ‘पुरुष होकर/पुरुषों के रूप में मरेंगे’ असामान्य और अर्थ की दृष्टि से संदिग्ध है। न्याय के प्रसंग में सम्भावित भाव पूर्ण पुरुषावस्था या भरी जवानी में मरना है। मुख्य पाठ में पठनीय अर्थ रखा गया है और शाब्दिक अस्पष्टता पादटिप्पणी में सुरक्षित है; मूल में ‘तलवार’ का कोई शब्द नहीं है।
theological_decisions:
- issue: एली के याजकीय वंश पर न्याय का स्वरूप
  choice: उसके सभी पुरुष तत्काल पूरी तरह समाप्त नहीं होंगे; कुछ वेदी के पास बने रहेंगे, पर उनका बचा रहना शोक और चलते हुए न्याय का कारण होगा।
  alternative: वंश को याजकीय सेवा से पूरी तरह काट दिया जाएगा।
  rationale: לֹא के साथ אִישׁ और आगे के प्रयोजन/परिणाम-वाक्य पूर्ण विनाश के बजाय दुःख देखने के लिए बचे रहने का तनाव व्यक्त करते हैं। अनुवाद इस न्याय के भीतर बचे हुए लोगों की विडम्बना को बनाए रखता है।
- issue: אֲנָשִׁים का अर्थ
  choice: मुख्य पाठ में ‘पुरुषावस्था में ही’ और पादटिप्पणी में शाब्दिक रूप
  alternative: ‘मनुष्यों के समान मरेंगे’ अथवा ‘पुरुष होकर मरेंगे’
  rationale: यह संक्षिप्त इब्रानी प्रयोग अस्पष्ट है। ‘भरी जवानी/पुरुषावस्था में’ प्रसंगानुकूल सम्भावित अर्थ है, पर पादटिप्पणी शाब्दिक रूप और अनिश्चितता दोनों बताती है। हिंसक मृत्यु या तलवार को पाठ में जोड़ना स्रोत से समर्थित नहीं है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। परमेश्वर द्वारा एली को एकवचन सम्बोधन होने के कारण ‘तेरे/तेरी’ रखा गया है। ‘प्राण’ स्रोत की मानव-अन्तःकरण संबंधी छवि को बनाए रखता है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिससे टिप्पणी संबंधित है।
