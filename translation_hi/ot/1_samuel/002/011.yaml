  text: Then Elkanah went to Ramah[a], to his house; and the boy was ministering to Yahweh before Eli the priest.
translation:
  language: hi
  text: तब एल्काना रामा में अपने घर चला गया; और वह बालक एली याजक के सामने[a] याहवे की सेवा करता रहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एली याजक की उपस्थिति में।” इब्रानी में शाब्दिक रूप से, “एली याजक के चेहरे के सामने।”
    reason: शाब्दिक विकल्प और संबंधपरक अस्पष्टता को स्पष्ट करना।
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: चला गया
  rationale: הלך का यह कथात्मक रूप सामान्यतः अगली घटना बताते हुए ‘गया’ का अर्थ देता है। प्रसंग से लौटने का भाव संभव है, पर क्रिया स्वयं उसे स्पष्ट नहीं करती।
- source_word: הָרָמָתָה עַל בֵּיתוֹ
  choice: अपने घर रामा
  rationale: स्थान-नाम के साथ लगा दिशासूचक ה और עַל בֵּיתוֹ यहाँ गंतव्य बताते हैं। ‘अपने घर रामा’ स्वाभाविक हिंदी में दोनों बातों को संक्षेप में व्यक्त करता है।
- source_word: וְהַנַּעַר
  choice: वह बालक
  rationale: נַעַר की अर्थ-सीमा बालक से युवक तक है; इस प्रसंग में शमूएल की छोटी आयु के कारण ‘बालक’ उपयुक्त है।
- source_word: הָיָה מְשָׁרֵת
  choice: सेवा करता रहा
  rationale: היה के साथ कृदंत जारी या स्थायी गतिविधि को दर्शाता है; ‘करता रहा’ इस कालगत पक्ष को स्वाभाविक हिंदी में रखता है।
- source_word: אֶת יְהוָה
  choice: याहवे की
  rationale: שרת के साथ चिह्नित कर्म उस व्यक्ति को बताता है जिसकी सेवा की जाती है; हिंदी में ‘याहवे की सेवा’ स्वाभाविक है और परमेश्वर के नाम को नाम के रूप में रखता है।
- source_word: אֶת פְּנֵי עֵלִי הַכֹּהֵן
  choice: एली याजक के सामने
  rationale: यह वाक्यांश शाब्दिक रूप से एली के मुख या उपस्थिति के सामने होने का भाव देता है। ‘के सामने’ स्थानिक-संबंधपरक अर्थ बनाए रखता है और ‘अधीन’ कहकर निगरानी का अर्थ अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा
  rationale: इब्रानी पाठ में चार-अक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसके व्यापक रूप से स्वीकृत उच्चारण को देवनागरी में व्यक्त करता है और उसे उपाधि से नहीं बदलता।
- issue: एली के साथ शमूएल की सेवा का संबंध
  choice: एली याजक के सामने
  alternative: एली याजक के अधीन
  rationale: मूल वाक्यांश उपस्थिति या सामने होने को स्पष्ट करता है, पर औपचारिक पदानुक्रम को अनिवार्य रूप से नहीं बताता; इसलिए अनिश्चितता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण हिंदी अपनाई गई है। जारी सेवा के भाव के लिए ‘सेवा करता रहा’ और अस्पष्ट स्थानिक-संबंधपरक वाक्यांश के लिए ‘के सामने’ रखा गया है।
