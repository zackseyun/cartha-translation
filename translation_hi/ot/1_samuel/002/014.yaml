base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/014.yaml
  text: and he would thrust it into the basin[a], or the pot, or the kettle, or the cooking pan; all that the fork brought up, the priest would take with it[b]. Thus they did to all Israel who came there to Shiloh.
translation:
  language: hi
  text: और वह उसे हांड़ी, देग, कड़ाही या पकाने के बरतन[b] में घोंप देता था। काँटे[a] से जो कुछ ऊपर आता, याजक उसे उसी से ले लेता था। शीलो आनेवाले सभी इस्राएलियों के साथ वे ऐसा ही करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मांस-काँटा।” इब्रानी शब्द बलिदान के मांस के लिए इस्तेमाल होनेवाले काँटे को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: इन पात्रों के नामों के बीच सटीक भेद अनिश्चित हैं; इब्रानी में पकाने के कई प्रकार के पात्र गिनाए गए हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִכָּה
  choice: घोंप देता था
  rationale: हिफ़ील रूप यहाँ किसी सामान्य प्रहार के बजाय काँटे को पकाने के बरतन में जोर से डालने की बार-बार की जानेवाली क्रिया बताता है।
- source_word: בַכִּיּוֹר ... בַדּוּד ... בַקַּלַּחַת ... בַפָּרוּר
  choice: हाँड़ी, देग, कड़ाही या पकाने का बरतन
  rationale: इब्रानी में कई प्रकार के पकाने के पात्र गिनाए गए हैं, पर उनके बीच के सटीक भेद अनिश्चित हैं। हिन्दी में स्वाभाविक विविधता बनाए रखते हुए अनावश्यक तकनीकी निश्चितता से बचा गया है।
- source_word: כֹּל אֲשֶׁר יַעֲלֶה הַמַּזְלֵג
  choice: काँटे में जितना मांस फँसकर ऊपर आता
  rationale: संदर्भ में पात्र से काँटे द्वारा निकाले गए मांस की बात है। 'मांस' संदर्भ से स्पष्ट वस्तु को स्वाभाविक हिन्दी में व्यक्त करता है, और 'फँसकर ऊपर आता' עלה के चित्र को बनाए रखता है।
- source_word: הַמַּזְלֵג
  choice: काँटा
  rationale: पिछली आयत में इसे तीन नोकों वाला उपकरण बताया गया है। आधुनिक हिन्दी में 'काँटा' सरल और बोधगम्य है।
- source_word: יִקַּח הַכֹּהֵן בּוֹ
  choice: याजक उसे उसी से ले लेता था
  rationale: בּוֹ को काँटे के साधनार्थक संदर्भ में लिया गया है; 'उसी से' उसके साधन होने को स्पष्ट करता है।
- source_word: כָּכָה יַעֲשׂוּ
  choice: वे ऐसा ही करते थे
  rationale: बहुवचन क्रिया को बनाए रखा गया है और इसे याजकीय सेवकों अथवा एली के घराने की सामूहिक प्रथा के रूप में व्यक्त किया गया है।
- source_word: לְכָל יִשְׂרָאֵל הַבָּאִים שָׁם בְּשִׁלֹה
  choice: शीलो में वहाँ आनेवाले सभी इस्राएलियों के साथ
  rationale: सामूहिक 'सारे इस्राएल' को स्वाभाविक हिन्दी में उन सभी इस्राएली उपासकों के रूप में व्यक्त किया गया है जो शीलो आते थे।
theological_decisions:
- issue: मुख्य क्रिया में एकवचन और सारांश में बहुवचन
  choice: मुख्य वाक्य में 'याजक' एकवचन रखा गया, पर अंतिम वाक्य में 'वे' बहुवचन रखा गया।
  alternative: पूरी आयत को एकवचन करके 'याजक ऐसा ही करता था' कहना।
  rationale: इब्रानी पाठ स्वयं एकवचन से बहुवचन की ओर बदलता है। इस बदलाव को बनाए रखने से व्यक्तिगत कार्य और व्यापक याजकीय प्रथा, दोनों की कथात्मक बनावट सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और कथात्मक शैली। पात्रों के प्राचीन नामों में पूर्ण तकनीकी निश्चितता न होने के कारण मुख्य पाठ में परिचित हिन्दी शब्द चुने गए हैं।
