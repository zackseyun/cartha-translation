  yaml_path: translation/ot/1_samuel/002/034.yaml
  text: 'And this will be the sign to you that will come upon your two sons[b][a], Hophni and Phinehas: both of them will die on one day.'
translation:
  language: hi
  text: और तेरे लिए यह चिन्ह होगा जो तेरे दोनों बेटों, होप्नी और पीनहास, पर आएगा:[a] वे दोनों एक ही दिन[b] मर जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तेरे दोनों बेटों, होप्नी और पीनहास, के साथ घटेगा।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “एक दिन”; अर्थात् दोनों उसी दिन मरेंगे।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאוֹת
  choice: चिन्ह
  rationale: यह शब्द किसी पुष्टि करने वाले संकेत को दर्शाता है; प्रसंग में बेटों की मृत्यु एली के घराने पर घोषित न्याय की पुष्टि करेगी।
- source_word: אֲשֶׁר יָבֹא אֶל
  choice: जो ... पर आएगा
  rationale: इब्रानी प्रयोग किसी घटना या न्याय के व्यक्तियों पर आ पड़ने का भाव दे सकता है। यह अनुवाद मूल बिंब को रखते हुए स्वाभाविक हिंदी देता है; ‘जो ... के साथ घटेगा’ भी संभव है।
- source_word: שְׁנֵי בָנֶיךָ
  choice: तेरे दोनों बेटों
  rationale: यह एली के दो बेटों को सीधे संबोधन में निर्दिष्ट करता है। हिंदी में ‘दोनों’ आगे आने वाले दोनों नामों और दोनों की मृत्यु पर बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל חָפְנִי וּפִינְחָס
  choice: होप्नी और पीनहास
  rationale: दूसरा אֶל उन्हीं दो बेटों के नाम स्पष्ट करता है; हिंदी में डैश के बीच नाम देना इस समानाधिकरण को साफ रखता है।
- source_word: בְּיוֹם אֶחָד
  choice: एक ही दिन
  rationale: मूलतः ‘एक दिन’ है, पर प्रसंग में दोनों व्यक्तियों की मृत्यु उसी एक दिन होने पर बल है। ‘एक ही दिन’ आधुनिक हिंदी में इस आशय को स्पष्ट और संक्षिप्त ढंग से व्यक्त करता है।
- source_word: יָמוּתוּ שְׁנֵיהֶם
  choice: वे दोनों मर जाएँगे
  rationale: ‘दोनों’ इस बात पर बल बनाए रखता है कि बताए गए दोनों पुत्र मरेंगे। भविष्यवाणी के परिणाम के लिए ‘मर जाएँगे’ स्वाभाविक हिंदी है।
theological_decisions:
- issue: ‘चिन्ह’ का स्वरूप
  choice: एली के घराने पर घोषित न्याय की पुष्टि करने वाला चिन्ह
  alternative: केवल भविष्य बताने वाला शकुन, जिसमें पुष्टि का विशेष भाव न हो
  rationale: निकटवर्ती प्रसंग में दोनों पुत्रों की एक दिन मृत्यु पहले घोषित वचन की सत्यता की पुष्टि करती है। फिर भी मुख्य पाठ व्यापक शब्द ‘चिन्ह’ ही रखता है और उसके अर्थ को संकीर्ण नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में सीधा, गंभीर और भविष्यवाणी-संगत लहजा रखा गया है। ‘तेरे’ मूल के एकवचन प्रत्यक्ष संबोधन को सुरक्षित रखता है। नामों के समानाधिकरण को डैश से स्पष्ट किया गया है।
