source:
  edition: WLC
  text: אֵין קָד֥וֹשׁ כַּ/יהוָ֖ה כִּ֣י אֵ֣ין בִּלְתֶּ֑/ךָ וְ/אֵ֥ין צ֖וּר כֵּ/אלֹהֵֽי/נוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/002.yaml
  text: There is none holy like Yahweh[a], for there is none besides you, and there is no rock like our God.
translation:
  language: hi
  text: 'याहवे[a] के समान कोई पवित्र नहीं,

    क्योंकि तेरे सिवा कोई नहीं;

    और हमारे परमेश्वर के समान कोई चट्टान नहीं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “याहवे,” परमेश्वर का व्यक्तिगत वाचा-नाम; कई अनुवाद इसे “प्रभु” लिखते हैं।'
    reason: divine_name
lexical_decisions:
- source_word: אֵין
  choice: कोई नहीं / कोई ... नहीं
  rationale: अस्तित्व के निषेध को स्वाभाविक हिन्दी में व्यक्त करता है; तीनों पंक्तियों में इसकी पुनरावृत्ति इब्रानी बल और समानांतरता बनाए रखती है।
- source_word: קָדוֹשׁ
  choice: पवित्र
  rationale: यह परमेश्वर की विशिष्टता और अलगाव को व्यक्त करने वाला मानक तथा प्रसंगानुकूल शब्द है।
- source_word: כַּיהוָה
  choice: याहवे के समान
  rationale: उपसर्ग כ तुलना सूचित करता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम के रूप में 'याहवे' लिखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहली घोषणा का आधार प्रस्तुत करता है और आधुनिक हिन्दी में कारण-संबंध स्पष्ट रखता है।
- source_word: בִּלְתֶּךָ
  choice: तेरे सिवा
  rationale: यह बहिष्करण का अर्थ और हन्ना की प्रार्थना में प्रत्यक्ष द्वितीय-पुरुष संबोधन—दोनों सुरक्षित रखता है।
- source_word: צוּר
  choice: चट्टान
  rationale: मूल रूपक को बनाए रखता है, जिसमें दृढ़ता, स्थिरता और सुरक्षा की अर्थ-छवियाँ समाहित हैं; इसे केवल 'शरण' कहना रूपक को संकीर्ण कर देता।
- source_word: כֵּאלֹהֵינוּ
  choice: हमारे परमेश्वर के समान
  rationale: כ तुलना दर्शाता है; यहाँ אֱלֹהִים इस्राएल के परमेश्वर के लिए एकवचन अर्थ में प्रयुक्त है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। 'याहवे' नाम को शीर्षक में बदलने के बजाय उसकी पहचान सुरक्षित रखता है; पाठक-सहायता हेतु पादटिप्पणी दी गई है।
- issue: צוּר के ईश्वर-विषयक रूपक को बनाए रखना
  choice: चट्टान
  alternative: शरण / रक्षक
  rationale: शाब्दिक रूपक काव्यात्मक व्यापकता और दृढ़ता, सुरक्षा तथा विश्वसनीयता के संयुक्त भाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। तीन समानांतर पंक्तियाँ तथा निषेध की पुनरावृत्ति मूल इब्रानी की स्तुतिपरक लय को बनाए रखती हैं। प्रत्यक्ष संबोधन के कारण 'तेरे' रखा गया है।
