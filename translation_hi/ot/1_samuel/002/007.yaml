  text: יְהוָ֖ה מוֹרִ֣ישׁ וּ/מַעֲשִׁ֑יר מַשְׁפִּ֖יל אַף מְרוֹמֵֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/007.yaml
  text: Yahweh makes poor and makes rich[b][a]; he brings low and also lifts up.
translation:
  language: hi
  text: याहवे निर्धन बनाता है[a] और धनी बनाता है; वह नीचा करता है और ऊँचा भी उठाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कंगाल करता है”; इब्रानी क्रिया में किसी को हानि पहुँचाने अथवा अधिकार या संपत्ति से वंचित करने का व्यापक भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “ऊँचा करता है” अथवा “प्रतिष्ठित करता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מוֹרִישׁ
  choice: निर्धन बनाता है
  rationale: यह ירשׁ का हिफ़ील रूप है। यद्यपि इसका अर्थ अधिकार या संपत्ति से वंचित करना भी हो सकता है, यहाँ ‘धनी बनाता है’ के साथ काव्यात्मक विरोध आर्थिक दशा को सूचित करता है।
- source_word: וּמַעֲשִׁיר
  choice: और धनी बनाता है
  rationale: עשׁר के हिफ़ील रूप की कारणवाचक शक्ति को स्पष्ट रखता है और ‘निर्धन बनाता है’ के साथ स्वाभाविक विरोध बनाता है।
- source_word: מַשְׁפִּיל
  choice: नीचा करता है
  rationale: यह बाहरी दशा या प्रतिष्ठा को नीचे लाने की व्यापक छवि बनाए रखता है और अर्थ को केवल आंतरिक नम्रता तक सीमित नहीं करता।
- source_word: אַף
  choice: भी
  rationale: दूसरी क्रिया में इसके योगात्मक और हल्के बलाघात को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מְרוֹמֵם
  choice: ऊँचा उठाता है
  rationale: רום की ऊपर उठाने या प्रतिष्ठित करने की छवि को बनाए रखता है और ‘नीचा करता है’ के समानांतर है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: मनुष्य की दशा में याहवे की सक्रिय भूमिका
  choice: कारणवाचक क्रियाएँ—‘निर्धन बनाता’, ‘धनी बनाता’, ‘नीचा करता’, ‘ऊँचा उठाता’
  alternative: कमज़ोर कारणवाचक भाषा, जैसे ‘होने देता है’
  rationale: चारों इब्रानी कृदंत याहवे की सक्रिय कारणवाचक भूमिका व्यक्त करते हैं; पाठ के धर्मवैचारिक तनाव को कम नहीं किया गया है।
translation_notes:
  register: भाषा आधुनिक, dignified और सामान्य पाठक के लिए सहज रखी गई है। दोनों विरोधी युग्मों—निर्धन/धनी और नीचा/ऊँचा—की काव्यात्मक समानता तथा कारणवाचक बल सुरक्षित हैं।
