base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/022.yaml
  text: Eli was very old[a], and he heard all that his sons were doing to all Israel, and that they were lying with the women who served at the entrance to the tent of meeting.
translation:
  language: hi
  text: एली बहुत बूढ़ा था। उसने सुना कि उसके बेटे सारे इस्राएल के साथ क्या-क्या कर रहे थे और वे उन स्त्रियों के साथ सोते थे जो मिलापवाले तंबू के प्रवेश-द्वार पर सेवा करती थीं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन स्त्रियों के साथ जो मिलापवाले तंबू के प्रवेश-द्वार पर एकत्र होती थीं।” हिब्रू कृदंत का अर्थ संगठित रूप से एकत्र होना या सेवा करना हो सकता है।
    reason: हिब्रू הַצֹּבְאוֹת की वास्तविक शाब्दिक अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: זָקֵן מְאֹד
  choice: बहुत बूढ़ा हो गया था
  rationale: हिब्रू विशेषण और तीव्रतासूचक शब्द को स्वाभाविक हिन्दी में प्रस्तुत करता है और एली की अत्यधिक वृद्धावस्था पर बल बनाए रखता है।
- source_word: וְשָׁמַע
  choice: उसने सुना
  rationale: कथात्मक पूर्ण क्रिया यहाँ एली को इन बातों की खबर मिलने का तथ्य बताती है; साधारण भूतकाल स्वाभाविक है।
- source_word: כָּל אֲשֶׁר יַעֲשׂוּן
  choice: क्या-क्या कर रहे थे
  rationale: यह बेटों के समस्त और जारी आचरण का सार देता है; हिन्दी का अपूर्ण भूतकाल निरंतरता व्यक्त करता है।
- source_word: לְכָל יִשְׂרָאֵל
  choice: सारे इस्राएल के साथ
  rationale: पूर्वसर्ग को प्रभावित समुदाय के प्रति/साथ किए गए व्यवहार के रूप में निकटता से रखता है, बिना ‘विरुद्ध’ जैसे अधिक व्याख्यात्मक अर्थ को थोपे।
- source_word: יִשְׁכְּבוּן אֶת־הַנָּשִׁים
  choice: वे उन स्त्रियों के साथ सोते थे
  rationale: हिब्रू की यौनार्थक रूढ़ोक्ति को स्पष्ट किंतु स्रोत के समान शिष्ट और परोक्ष हिन्दी में रखता है।
- source_word: הַצֹּבְאוֹת
  choice: जो ... सेवा करती थीं
  rationale: इस पवित्रस्थान-संदर्भ में कृदंत संगठित सेवा का संकेत दे सकता है; ‘सेवा करती थीं’ स्वाभाविक है और बाद की संस्थागत श्रेणी नहीं थोपता।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: पवित्रस्थान के तकनीकी पदबंध को प्रचलित, स्पष्ट और गरिमापूर्ण हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: पवित्रस्थान पर स्त्रियों की भूमिका
  choice: प्रवेश-द्वार पर सेवा करने वाली स्त्रियाँ
  alternative: प्रवेश-द्वार पर एकत्र होने वाली स्त्रियाँ
  rationale: צָבָא से बना कृदंत संगठित सेवा अथवा एकत्र होने—दोनों का संकेत दे सकता है। निर्गमन 38:8 के समान प्रयोग और उपासना-स्थान के संदर्भ में ‘सेवा’ मुख्य पाठ के लिए उपयुक्त है, जबकि वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- issue: यौन दुराचार को कितनी स्पष्टता से व्यक्त किया जाए
  choice: उन स्त्रियों के साथ सोते थे
  alternative: उन स्त्रियों से यौन-संबंध रखते थे
  rationale: मूल हिब्रू स्वयं एक प्रचलित रूढ़ोक्ति प्रयोग करता है। चुनी हुई हिन्दी अर्थ स्पष्ट करती है, पर स्रोत से अधिक चिकित्सकीय या चित्रात्मक नहीं बनती।
translation_notes:
  register: आधुनिक मानक हिन्दी; साधारण पाठकों के लिए स्पष्ट, वर्तमान और गरिमापूर्ण शैली। यौन दुराचार के लिए स्रोत की शिष्ट रूढ़ोक्ति बनाए रखी गई है। पादटिप्पणी-चिह्न संबद्ध वाक्यांश के बाद रखा गया है।
