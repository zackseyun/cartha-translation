source:
  edition: WLC
  text: וַ/יָּבֹ֥א אִישׁ אֱלֹהִ֖ים אֶל עֵלִ֑י וַ/יֹּ֣אמֶר אֵלָ֗י/ו כֹּ֚ה אָמַ֣ר יְהוָ֔ה הֲ/נִגְלֹ֤ה נִגְלֵ֨יתִי֙ אֶל בֵּ֣ית אָבִ֔י/ךָ בִּֽ/הְיוֹתָ֥/ם בְּ/מִצְרַ֖יִם לְ/בֵ֥ית פַּרְעֹֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/027.yaml
  text: 'And a man of God came to Eli and said to him, “Thus says the LORD: Did I indeed reveal myself to your father''s house when they were in Egypt, belonging to Pharaoh''s house?”'
translation:
  language: hi
  text: 'तब परमेश्वर का एक जन एली के पास आया और उससे कहा, “यहोवा यह कहता है: क्या मैंने सचमुच तुम्हारे पितृकुल पर अपने आपको प्रकट किया था, जब वे मिस्र में फ़िरौन के घराने से संबंधित थे?”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ אֱלֹהִים
  choice: परमेश्वर का एक जन
  rationale: यह इब्रानी पदवी का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है; इसका अर्थ परमेश्वर की ओर से बोलने वाला व्यक्ति है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट नाम को हिन्दी में प्रचलित लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: בֵּית אָבִיךָ
  choice: तुम्हारे पूर्वज का घराना
  rationale: संदर्भ हारून और उसके वंश से है; 'घराना' वंशगत सामूहिक अर्थ को व्यक्त करता है, जबकि एकवचन 'पूर्वज' मूल के रूप को बनाए रखता है।
- source_word: לְבֵית פַּרְעֹה
  choice: फ़िरौन के घराने के अधीन
  rationale: לְ संबंध या अधीनता सूचित कर सकता है। प्रसंग में इस्राएली मिस्र में फ़िरौन के अधिकार के अधीन थे; यह रूप अस्वाभाविक 'फ़िरौन के घराने के लिए' से बचता है।
- source_word: הֲנִגְלֹה נִגְלֵיתִי
  choice: क्या मैंने सचमुच अपने आप को ... प्रकट नहीं किया था?
  rationale: निफ़अल infinitive absolute और finite verb की पुनरुक्ति को 'सचमुच' से व्यक्त किया गया है; हिन्दी में नकारात्मक प्रश्न अपेक्षित सकारात्मक उत्तर की शक्ति को स्वाभाविक रूप से दर्शाता है।
theological_decisions:
- issue: 'प्रकाशन का प्राप्तकर्ता: एक पूर्वज या पूरा घराना'
  choice: अपने आप को उन पर प्रकट
  alternative: अपने आप को तुम्हारे पूर्वज के घराने पर प्रकट
  rationale: אֶל בֵּית אָבִיךָ सामूहिक घराने को लक्ष्य करता है; सर्वनाम 'उन पर' उसी सामूहिक अर्थ को स्पष्ट और स्वाभाविक रखता है।
- issue: फ़िरौन के घराने से संबंध
  choice: फ़िरौन के घराने के अधीन
  alternative: फ़िरौन के घराने से संबंधित
  rationale: मूल לְ का संबंध अस्पष्ट है। मुख्य पाठ में ऐतिहासिक अधीनता को चुना गया है, पर पादटिप्पणी में शाब्दिक विकल्प सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कथन गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। भविष्यवाणी-सूत्र में 'यहोवा यह कहता है' और वंशगत अर्थ के लिए 'घराना' प्रयुक्त हुआ है।
