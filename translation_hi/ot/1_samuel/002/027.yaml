revisions:
- from: 'तब परमेश्वर का एक जन एली के पास आया और उससे कहा, “यहोवा यह कहता है: जब तुम्हारे पूर्वज का घराना मिस्र में फ़िरौन के घराने के अधीन था, तब क्या मैंने सचमुच अपने आप को उन पर प्रकट नहीं किया था?[a]”'
  to: 'तब परमेश्वर का एक जन एली के पास आया और उससे कहा, “यहोवा यह कहता है: क्या मैंने सचमुच तुम्हारे पितृकुल पर अपने आपको प्रकट किया था, जब वे मिस्र में फ़िरौन के घराने से संबंधित थे?”'
  rationale: The revision removes the source-unattested negation, renders the intensified verbal form with “सचमुच,” and replaces the interpretively narrow “के अधीन” with “से संबंधित,” which preserves the relational ambiguity of the Hebrew. It also replaces the awkward singular expression “पूर्वज का घराना” with the idiomatic collective “पितृकुल.” No footnote is necessary because the revised wording does not force a disputed relation and no textual variant requires documentation.
