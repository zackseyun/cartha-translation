review_pass:
  verdict: revise
  source_fidelity: The draft accurately identifies the principal participants and the ancestral-house reference, but its negative question (“प्रकट नहीं किया था?”) introduces a negation absent from the Hebrew interrogative. “के अधीन” also narrows the ambiguous לְבֵית פַּרְעֹה to subjection, whereas the source more broadly expresses association/belonging to Pharaoh’s household.
  naturalness: The revision uses clear, modern standard Hindi while retaining the formal prophetic register. “पितृकुल” naturally conveys the collective, ancestral sense of בֵּית אָבִיךָ.
  terminology: “परमेश्वर का एक जन” and “यहोवा” are suitable. “पितृकुल” is preferable to “तुम्हारे पूर्वज का घराना,” which is somewhat awkward and can sound like a single ancestor’s household.
  issues:
  - severity: high
    issue: Unwarranted negation in the question
    rationale: הֲנִגְלֹה נִגְלֵיתִי is an interrogative with infinitive-absolute emphasis, not a negative question. Hindi “क्या मैंने सचमुच ... प्रकट नहीं किया था?” changes the explicit polarity.
  - severity: medium
    issue: “फ़िरौन के घराने के अधीन” is overly specific
    rationale: The phrase לְבֵית פַּרְעֹה has a compact, contextually debated relational force. “के अधीन” interprets it as political subjection; “से संबंधित” retains the broader association indicated by the source and English audit trail.
  - severity: low
    issue: Awkward rendering of the ancestral household
    rationale: “तुम्हारे पूर्वज का घराना” is less idiomatic than “तुम्हारे पितृकुल” and does not as readily convey the conventional collective force of “your father’s house.”
  revised_text: 'तब परमेश्वर का एक जन एली के पास आया और उससे कहा, “यहोवा यह कहता है: क्या मैंने सचमुच तुम्हारे पितृकुल पर अपने आपको प्रकट किया था, जब वे मिस्र में फ़िरौन के घराने से संबंधित थे?”'
