source:
  edition: WLC
  text: וַ/תִּתְפַּלֵּ֤ל חַנָּה֙ וַ/תֹּאמַ֔ר עָלַ֤ץ לִבִּ/י֙ בַּֽ/יהוָ֔ה רָ֥מָה קַרְנִ֖/י בַּֽ/יהוָ֑ה רָ֤חַב פִּ/י֙ עַל א֣וֹיְבַ֔/י כִּ֥י שָׂמַ֖חְתִּי בִּ/ישׁוּעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/001.yaml
  text: 'And Hannah prayed and said: “My heart exults in Yahweh[a]; my horn is lifted high in Yahweh. My mouth is opened wide against my enemies[c][b], because I rejoice in your salvation.”'
translation:
  language: hi
  text: 'तब हन्ना ने प्रार्थना की और कहा,


    “मेरा हृदय याहवे में उल्लसित है;

    याहवे में मेरा सींग[a] ऊँचा उठा है।

    मेरा मुँह मेरे शत्रुओं के विरुद्ध चौड़ा खुला है[b],

    क्योंकि मैं तेरे उद्धार[c] में आनन्दित हूँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सींग’ शक्ति, सम्मान या ऊँचे पद का इब्रानी रूपक है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक रूप से, ‘मेरा मुँह मेरे शत्रुओं के विरुद्ध चौड़ा खुला है’; भाव यह भी हो सकता है, ‘मैं अपने शत्रुओं के विरुद्ध निर्भीकता से बोलती हूँ।’
    reason: lexical_alternative
  - marker: c
    text: या ‘छुटकारे’। इब्रानी शब्द व्यापक उद्धार या संकट से ठोस छुटकारे—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּתְפַּלֵּל
  choice: प्रार्थना की
  rationale: हित्पएल रूप का सामान्य अर्थ ‘प्रार्थना करना’ है। आगे का काव्य स्तुति जैसा है, फिर भी कथात्मक क्रिया उसे प्रार्थना के रूप में प्रस्तुत करती है।
- source_word: וַתֹּאמַר
  choice: कहा
  rationale: इब्रानी में सामान्य ‘कहना’ क्रिया है; पाठ में ‘गाया’ नहीं है, इसलिए काव्यात्मक प्रसंग के बावजूद मूल क्रिया सुरक्षित रखी गई है।
- source_word: עָלַץ לִבִּי
  choice: मेरा हृदय ... उल्लसित है
  rationale: עָלַץ प्रबल और उमंग-भरे आनन्द को व्यक्त करता है। ‘उल्लसित’ इस काव्यात्मक तीव्रता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בַּיהוָה
  choice: याहवे में
  rationale: पूर्वसर्ग ב आनन्द और ऊँचे उठाए जाने के आधार अथवा क्षेत्र को दर्शाता है; ‘में’ मूल अभिव्यक्ति और उसकी धार्मिक-काव्यात्मक गहराई दोनों को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम टेट्राग्रामटन है; उसे किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: רָמָה קַרְנִי
  choice: मेरा सींग ऊँचा उठा है
  rationale: ‘सींग’ शक्ति, सम्मान और ऊँचे पद का इब्रानी रूपक है। व्याख्यात्मक रूप से केवल ‘शक्ति’ कहने के बजाय काव्य-बिम्ब मुख्य पाठ में रखा गया है।
- source_word: רָחַב פִּי עַל אֹיְבַי
  choice: मेरा मुँह मेरे शत्रुओं के विरुद्ध खुल गया है
  rationale: मूल अभिव्यक्ति मुँह के चौड़ा खुलने का शारीरिक बिम्ब लेकर निर्भीक, विजयी वाणी व्यक्त करती है। हिन्दी में समझ आने योग्य रहते हुए इस बिम्ब को सुरक्षित रखा गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह हन्ना के निर्भीक आनन्द का कारण प्रस्तुत करता है; ‘क्योंकि’ समकालीन हिन्दी में स्पष्ट कारणसूचक है।
- source_word: שָׂמַחְתִּי
  choice: मैं ... आनन्दित हूँ
  rationale: पूर्ण क्रिया को प्राप्त परिणाम की वर्तमान अवस्था के रूप में समझा जा सकता है। यह हिन्दी में प्रार्थना के वर्तमान उल्लास को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בִּישׁוּעָתֶךָ
  choice: तेरे उद्धार में
  rationale: יְשׁוּעָה व्यापक उद्धार और संकट से ठोस छुटकारा—दोनों अर्थ रख सकता है। ‘उद्धार’ व्यापक अर्थ बनाए रखता है, और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में टेट्राग्रामटन व्यक्तिगत नाम के रूप में दो बार आया है। ‘याहवे’ मूल नाम को उपाधि से बदले बिना प्रस्तुत करता है; ‘यहोवा’ प्रचलित वैकल्पिक लिप्यंतरण है।
- issue: ‘सींग’ के रूपक को बनाए रखना
  choice: मुख्य पाठ में ‘सींग’
  alternative: ‘शक्ति’ या ‘सम्मान’
  rationale: रूपक शक्ति, प्रतिष्ठा और विजय की परस्पर जुड़ी धारणाएँ रखता है। केवल एक व्याख्यात्मक अर्थ चुनने से मूल की अर्थ-समृद्धि घट जाती।
- issue: יְשׁוּעָה का अर्थ-क्षेत्र
  choice: उद्धार
  alternative: छुटकारा
  rationale: हन्ना के प्रसंग में ठोस संकट से छुटकारा प्रमुख है, पर शब्द का अर्थ उससे व्यापक भी हो सकता है। ‘उद्धार’ मुख्य पाठ में व्यापकता रखता है और ‘छुटकारा’ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली रखी गई है। समानांतर पंक्तियाँ इब्रानी काव्य की लय दिखाती हैं। प्रार्थना में सीधे सम्बोधन के कारण ‘तेरे’ का प्रयोग किया गया है।
