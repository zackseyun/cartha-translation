source:
  edition: WLC
  text: הִנֵּה֙ יָמִ֣ים בָּאִ֔ים וְ/גָֽדַעְתִּי֙ אֶת זְרֹ֣עֲ/ךָ֔ וְ/אֶת זְרֹ֖עַ בֵּ֣ית אָבִ֑י/ךָ מִֽ/הְי֥וֹת זָקֵ֖ן בְּ/בֵיתֶֽ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/031.yaml
  text: Look[a], days are coming when I will cut off your strength and the strength of your father's house, so that there will not be an old man in your house.
translation:
  language: hi
  text: देखो[a], दिन आ रहे हैं जब मैं तुम्हारी शक्ति और तुम्हारे पिता के घराने की शक्ति को तोड़ दूँगा, जिससे तुम्हारे घराने में कोई बूढ़ा आदमी नहीं होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी भुजा ... तुम्हारे पिता के घराने की भुजा।” यहाँ “भुजा” शक्ति या सामर्थ्य का इब्रानी रूपक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह एक गंभीर भविष्यद्वाणी की घोषणा आरम्भ करता है; ‘देखो’ उसके ध्यान आकर्षित करने वाले बल को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: יָמִים בָּאִים
  choice: ऐसे दिन आ रहे हैं
  rationale: यह आने वाले न्याय की मानक भविष्यद्वाणी-सूचक अभिव्यक्ति है। ‘ऐसे’ हिन्दी में आगामी विशेष परिस्थिति की ओर स्वाभाविक संकेत देता है।
- source_word: גָדַעְתִּי
  choice: तोड़ दूँगा
  rationale: क्रिया का मूल अर्थ काट डालना या काट देना है। ‘शक्ति’ के साथ हिन्दी में ‘तोड़ दूँगा’ निर्णायक रूप से सामर्थ्य समाप्त करने का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: זְרֹעֲךָ ... זְרֹעַ בֵּית אָבִיךָ
  choice: तुम्हारी शक्ति ... तुम्हारे पिता के घराने की शक्ति
  rationale: ‘भुजा’ यहाँ सामर्थ्य या सत्ता का इब्रानी रूपक है। मुख्य पाठ में उसका आशय स्पष्ट किया गया है और शाब्दिक चित्र पादटिप्पणी में सुरक्षित है।
- source_word: בֵּית אָבִיךָ
  choice: तुम्हारे पिता का घराना
  rationale: यह केवल भवन नहीं, बल्कि पैतृक परिवार या वंश को सूचित करने वाली संबंध-सूचक अभिव्यक्ति है।
- source_word: מִהְיוֹת זָקֵן בְּבֵיתֶךָ
  choice: जिससे तुम्हारे घराने में कोई बूढ़ा पुरुष न होगा
  rationale: 'यह परिणाम बताता है: परिवार के पुरुष वृद्धावस्था तक नहीं पहुँचेंगे। ‘बूढ़ा पुरुष’ पद या अधिकारी नहीं, आयु को दर्शाता है।'
theological_decisions:
- issue: न्याय-वचन में ‘भुजा’ का रूपक
  choice: दोनों स्थानों पर आशय के अनुसार ‘शक्ति’
  alternative: दोनों स्थानों पर शाब्दिक ‘भुजा’
  rationale: इब्रानी में भुजा प्रायः सामर्थ्य और सत्ता का रूपक है। यहाँ एली के घराने की सामर्थ्य और स्थायी जीवन-शक्ति हटाए जाने की बात है; अगला खंड घराने में बूढ़े पुरुष के न रहने से इसे स्पष्ट करता है। पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गंभीर भविष्यद्वाणी-संबंधी शैली रखी गई है। ‘घराना’ पैतृक वंश/परिवार को स्पष्ट करता है; ‘बूढ़ा पुरुष’ आयु का संकेत देता है, किसी पद का नहीं।
