base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/023.yaml
  text: And he said to them[a], “Why do you do such things? For I hear from all these people about your evil deeds.”
translation:
  language: hi
  text: उसने उनसे कहा, “तुम ऐसे काम क्यों करते हो? मैं इन सब लोगों से तुम्हारे बुरे कामों के बारे में सुन रहा हूँ।[a]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “मैं इन सब लोगों से तुम्हारी बुरी बातें/मामले सुन रहा हूँ।” प्रसंग में आशय एली के पुत्रों के बुरे आचरण के विषय में मिल रही खबरों से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר לָהֶם
  choice: उसने उनसे कहा
  rationale: हिब्रू कथात्मक क्रम और संबोधन को स्वाभाविक हिन्दी में व्यक्त करता है; प्रसंग में ‘उसने’ एली और ‘उनसे’ उसके पुत्रों को सूचित करता है।
- source_word: לָמָּה תַעֲשׂוּן
  choice: तुम ... क्यों करते हो?
  rationale: अपूर्ण क्रिया यहाँ जारी या बार-बार किए जा रहे आचरण पर डाँट को व्यक्त करती है। सामान्य वर्तमान काल हिन्दी में इस भाव को सहज रूप से रखता है।
- source_word: כַּדְּבָרִים הָאֵלֶּה
  choice: ऐसे काम
  rationale: דְּבָרִים का अर्थ ‘बातें/मामले/काम’ हो सकता है। इस प्रसंग में पुत्रों के आचरण की ओर संकेत होने के कारण ‘काम’ स्पष्ट और स्वाभाविक है, जबकि ‘ऐसे’ तुलना-सदृश כַּ और संकेतवाचक तत्व को व्यक्त करता है।
- source_word: אָנֹכִי שֹׁמֵעַ
  choice: मैं ... सुन रहा हूँ
  rationale: स्वतंत्र सर्वनाम के साथ कृदन्त वर्तमान में लगातार मिल रही खबरों पर बल देता है; हिन्दी का वर्तमान प्रगतिशील रूप इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אֶת דִּבְרֵיכֶם רָעִים
  choice: तुम्हारे बुरे कामों के बारे में
  rationale: शाब्दिक संरचना ‘तुम्हारी बुरी बातें/मामले’ है। प्रसंग में लोगों द्वारा बताए जा रहे दुष्कर्म अभिप्रेत हैं; ‘के बारे में’ सुनने की संरचना को सहज हिन्दी बनाता है।
- source_word: מֵאֵת כָּל הָעָם אֵלֶּה
  choice: इन सब लोगों से
  rationale: מֵאֵת खबर के स्रोत को, כָּל समग्रता को और אֵלֶּה संकेतवाचक बल को व्यक्त करता है।
