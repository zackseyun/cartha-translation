translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और प्रत्यक्ष फटकार का स्वर रखा गया है। ‘बुरे काम’ सामान्य पाठक के लिए स्पष्ट है, और पाद-टिप्पणी मूल की व्यापक तथा कुछ असहज शब्दावली को सुरक्षित रखती है।
