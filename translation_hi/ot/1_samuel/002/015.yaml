  yaml_path: translation/ot/1_samuel/002/015.yaml
  text: Even before they burned the fat[a], the priest’s servant would come and say to the man who was sacrificing, “Give meat for the priest to roast, for he will not take boiled meat from you, but only raw.”
translation:
  language: hi
  text: चर्बी जलाने से भी पहले, याजक का सेवक[a] आता और बलि चढ़ाने वाले व्यक्ति से कहता था, “याजक को भूनने के लिए मांस दे, क्योंकि वह तुझसे उबला हुआ मांस नहीं लेगा, बल्कि कच्चा ही लेगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “याजक का युवक” अथवा “याजक का परिचारक”; इब्रानी शब्द נַעַר किसी युवक या सेवक को सूचित कर सकता है। यहाँ संभवतः याजक की ओर से काम करने वाला अधीनस्थ व्यक्ति अभिप्रेत है।
    reason: lexical_alternative
