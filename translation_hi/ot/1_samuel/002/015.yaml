- source_word: תְּנָה בָשָׂר לִצְלוֹת
  choice: भूनने को मांस दे
  rationale: आज्ञार्थक मांग की सीधी कठोरता और भूनने के उद्देश्य, दोनों को बनाए रखता है।
- source_word: מְבֻשָּׁל
  choice: उबला हुआ
  rationale: यह सामान्यतः पके हुए मांस की अपेक्षा विशेष रूप से उबालकर तैयार किए मांस को दर्शाता है, जिसका विरोध कच्चे मांस से है।
- source_word: כִּי אִם חָי
  choice: केवल कच्चा मांस
  rationale: 'निषेध के बाद आने वाली अपवादात्मक अभिव्यक्ति है: उबला हुआ नहीं, बल्कि केवल कच्चा।'
