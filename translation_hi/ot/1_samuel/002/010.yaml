source:
  edition: WLC
  text: יְהוָ֞ה יֵחַ֣תּוּ מריב/ו על/ו בַּ/שָּׁמַ֣יִם יַרְעֵ֔ם יְהוָ֖ה יָדִ֣ין אַפְסֵי אָ֑רֶץ וְ/יִתֶּן עֹ֣ז לְ/מַלְכּ֔/וֹ וְ/יָרֵ֖ם קֶ֥רֶן מְשִׁיחֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/010.yaml
  text: Yahweh’s adversaries will be shattered[a]; he will thunder against them from heaven. Yahweh will judge the ends of the earth[c][b]; he will give strength to his king and lift up the horn of his anointed.
translation:
  language: hi
  text: याहवे के विरोधी चकनाचूर हो जाएँगे[a]; वह स्वर्ग में[b] उनके विरुद्ध गरजेगा। याहवे पृथ्वी के छोरों का न्याय करेगा; वह अपने राजा को सामर्थ्य देगा और अपने अभिषिक्त[c] का सींग ऊँचा उठाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो उससे संघर्ष करते हैं वे चकनाचूर हो जाएँगे।”
    reason: केतिव़-क़ेरे और वाक्यांश की अधिक शाब्दिक वैकल्पिक अभिव्यक्ति।
  - marker: b
    text: या, “स्वर्ग से।”
    reason: हिब्रू का शाब्दिक अर्थ “स्वर्ग में” है, जबकि “स्वर्ग से” गर्जन के स्रोत को स्पष्ट करता है।
  - marker: c
    text: या, “अपने मसीह का।” यहाँ इब्रानी शब्द का अर्थ “उसका अभिषिक्त” है और यह याहवे के अभिषिक्त राजा के लिए प्रयुक्त हो सकता है; इसी शब्द से “मसीह” उपाधि आती है।
    reason: राजकीय निकट संदर्भ और मसीही महत्व, दोनों को सुरक्षित रखने वाला वैकल्पिक पाठ।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: वाचा-संबंधी ईश्वरीय नाम को उपाधि से बदलने के बजाय देवनागरी में निकट लिप्यंतरण किया गया है।
- source_word: יֵחַתּוּ
  choice: चकनाचूर हो जाएँगे
  rationale: निफ़अल रूप यहाँ पराजय में तोड़े या चूर किए जाने का प्रबल भाव देता है।
- source_word: מריבו עליו
  choice: याहवे के विरोधी
  rationale: केतिव़-क़ेरे परंपरा के अनुसार आशय उससे विवाद या संघर्ष करने वालों का है; स्पष्ट हिंदी के लिए सर्वनाम का संदर्भ याहवे से जोड़ा गया है।
- source_word: בַּשָּׁמַיִם
  choice: स्वर्ग में
  rationale: हिब्रू पूर्वसर्ग के स्थानवाचक अर्थ को सीधे रखा गया है; हिंदी में गरजने की दिशा अगले पदबंध 'उनके विरुद्ध' से स्पष्ट है।
- source_word: יַרְעֵם
  choice: उनके विरुद्ध गरजेगा
  rationale: क्रिया दैवी गर्जन को विरोधियों की ओर लक्षित न्यायकारी कार्य के रूप में व्यक्त करती है।
- source_word: יָדִין
  choice: न्याय करेगा
  rationale: यहाँ पृथ्वी भर पर न्यायिक अधिकार और निर्णय का व्यापक भाव है।
- source_word: אַפְסֵי אָרֶץ
  choice: पृथ्वी के छोरों
  rationale: यह संसार के दूरस्थतम भागों और इस प्रकार न्याय के सार्वभौमिक विस्तार का प्रचलित काव्यात्मक मुहावरा है।
- source_word: וְיִתֶּן עֹז
  choice: सामर्थ्य देगा
  rationale: עֹז की शक्ति और पराक्रम की धारणा को गरिमापूर्ण तथा सहज हिंदी में व्यक्त करता है।
- source_word: לְמַלְכּוֹ
  choice: अपने राजा को
  rationale: इस्राएली राजतंत्र स्थापित होने से पहले के संदर्भ में भी मूल पाठ स्पष्टतः 'राजा' कहता है, इसलिए राजकीय पद को सुरक्षित रखा गया है।
- source_word: וְיָרֵם קֶרֶן
  choice: सींग ऊँचा करेगा
  rationale: मूल काव्यात्मक रूपक को सुरक्षित रखा गया है; सींग शक्ति, प्रतिष्ठा और विजय का संकेत है।
- source_word: מְשִׁיחוֹ
  choice: अपने अभिषिक्त जन
  rationale: शब्द का प्रत्यक्ष अर्थ 'उसका अभिषिक्त' है और यहाँ राजा के समानांतर आता है। यह अनुवाद तत्कालीन राजकीय आशय को बनाए रखते हुए आगे की मसीही अनुगूँज को न तो नकारता है, न अनिवार्य बनाता है।
theological_decisions:
- issue: מְשִׁיחוֹ का तत्कालीन राजकीय और व्यापक मसीही महत्व
  choice: अपने अभिषिक्त जन
  alternative: अपने मसीह
  rationale: हिब्रू पद न्यूनतम रूप से याहवे के अभिषिक्त राजा को दर्शाता है और आगे चलकर 'मसीह' की उपाधि का स्रोत बनता है। मुख्य पाठ में अर्थानुवाद वास्तविक ऐतिहासिक संदर्भ और संभावित मसीही अनुगूँज, दोनों के बीच की तनावपूर्ण व्यापकता को बनाए रखता है; वैकल्पिक उपाधि पादटिप्पणी में दी गई है।
- issue: בַּשָּׁמַיִם में पूर्वसर्ग का अर्थ
  choice: स्वर्ग में
  alternative: स्वर्ग से
  rationale: मूल हिब्रू औपचारिक रूप से 'स्वर्ग में' कहता है। 'स्वर्ग से' गर्जन के स्रोत को स्वाभाविक रूप से व्यक्त करता है, पर वह व्याख्यात्मक है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, काव्यात्मक किंतु सहज और गरिमापूर्ण रखी गई है। 'चकनाचूर', 'पृथ्वी के छोर' और 'सींग ऊँचा करेगा' मूल के युद्धात्मक एवं काव्यात्मक बिंबों को बनाए रखते हैं। सभी पादटिप्पणी-चिह्न संबंधित मुख्य-पाठ पदों पर लगाए गए हैं।
