  text: וּ/מִשְׁפַּ֥ט הַ/כֹּהֲנִ֖ים אֶת הָ/עָ֑ם כָּל אִ֞ישׁ זֹבֵ֣חַ זֶ֗בַח וּ/בָ֨א נַ֤עַר הַ/כֹּהֵן֙ כְּ/בַשֵּׁ֣ל הַ/בָּשָׂ֔ר וְ/הַ/מַּזְלֵ֛ג שְׁלֹ֥שׁ הַ/שִּׁנַּ֖יִם בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/013.yaml
  text: 'The custom of the priests with the people was this: whenever any man was sacrificing a sacrifice[a], the priest’s servant would come while the meat was boiling, with the three-pronged fork in his hand.'
translation:
  language: hi
  text: 'लोगों के साथ याजकों की यह रीति थी: जब भी कोई मनुष्य बलि चढ़ाता था, तो जब मांस उबल रहा होता था, याजक का सेवक हाथ में तीन दाँतोंवाला काँटा[a] लिए आता था।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मांस निकालने का काँटा”; इब्रानी शब्द काँटे-जैसे एक औज़ार को दर्शाता है।
    reason: वैकल्पिक पारंपरिक अर्थ और औज़ार के सामान्य स्वरूप को स्पष्ट करता है, बिना मूल पाठ में न कही गई वस्तु या प्रक्रिया जोड़ने के।
lexical_decisions:
- source_word: וּמִשְׁפַּט
  choice: व्यवहार
  rationale: מִשְׁפָּט यहाँ न्यायिक निर्णय नहीं, बल्कि याजकों की स्थापित रीति या लोगों के साथ उनके व्यवहार को बताता है। ‘व्यवहार’ आगे वर्णित अनुचित प्रथा के लिए स्वाभाविक और प्रसंगानुकूल है। आरंभिक וּ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं।
- source_word: הַכֹּהֲנִים אֶת־הָעָם
  choice: याजकों का लोगों के साथ
  rationale: यह वाक्यांश लोगों के संबंध में याजकों की प्रचलित कार्यपद्धति बताता है; ‘लोगों के साथ’ संबंधसूचक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: כָּל־אִישׁ
  choice: जब भी कोई मनुष्य
  rationale: इब्रानी का एकवचन पुल्लिंग वितरणात्मक है। ‘जब भी’ बार-बार होने वाली प्रथा और ‘कोई मनुष्य’ मूल रूप दोनों को व्यक्त करते हैं।
- source_word: זֹבֵחַ זֶבַח
  choice: बलि चढ़ाता था
  rationale: इब्रानी में एक ही धातु से बना क्रिया-संज्ञा प्रयोग है। हिन्दी में ‘बलि की बलि चढ़ाता’ अस्वाभाविक होता; ‘बलि चढ़ाता था’ अर्थ और पुनरावृत्त क्रिया को स्पष्ट रखता है।
- source_word: וּבָא
  choice: लेकर आता था
  rationale: प्रसंग किसी एक घटना के बजाय बार-बार होने वाले व्यवहार का वर्णन करता है, इसलिए अभ्यस्त भूतकाल उपयुक्त है।
- source_word: נַעַר הַכֹּהֵן
  choice: याजक का सेवक
  rationale: נַעַר युवक, परिचारक या सेवक हो सकता है। यहाँ बलि-संबंधी काम करने की भूमिका प्रमुख है, इसलिए ‘सेवक’ आयु के बारे में अनावश्यक निष्कर्ष निकाले बिना अर्थ देता है।
- source_word: כְּבַשֵּׁל הַבָּשָׂר
  choice: मांस उबलते समय
  rationale: כְּ के साथ infinitive construct समयसूचक है। בּשׁל यहाँ मांस के उबलने या पकने को दर्शाता है; ‘उबलते समय’ मूल की विशिष्ट छवि बनाए रखता है।
- source_word: הַמַּזְלֵג שְׁלֹשׁ הַשִּׁנַּיִם
  choice: तीन दाँतोंवाला काँटा
  rationale: शाब्दिक चित्र ‘तीन दाँतों वाला काँटा’ है। यह आधुनिक हिन्दी में समझने योग्य है और औजार के तीन नुकीले सिरों को स्पष्ट करता है।
- source_word: בְּיָדוֹ
  choice: अपने हाथ में
  rationale: पुल्लिंग प्रत्यय सेवक की ओर संकेत करता है; हिन्दी में समान कर्ता के लिए ‘अपने हाथ में’ स्वाभाविक है।
