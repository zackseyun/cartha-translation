  text: וְ/הִבַּטְתָּ֙ צַ֣ר מָע֔וֹן בְּ/כֹ֥ל אֲשֶׁר יֵיטִ֖יב אֶת יִשְׂרָאֵ֑ל וְ/לֹֽא יִהְיֶ֥ה זָקֵ֛ן בְּ/בֵיתְ/ךָ֖ כָּל הַ/יָּמִֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/032.yaml
  text: You will look on the distress of the dwelling in all the good that he does for Israel[a], and there will not be an old man in your house all the days.
translation:
  language: hi
  text: तू उस सारे भले के बीच निवासस्थान की विपत्ति को देखेगा जो वह इस्राएल के लिए करेगा[a]; और तेरे घराने में कोई पुरुष वृद्धावस्था तक नहीं पहुँचेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “निवासस्थान में एक शत्रु,” अथवा, “पवित्रस्थान में विपत्ति”; यह इब्रानी पदबंध कठिन है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהִבַּטְתָּ
  choice: तू ... देखेगा
  rationale: हिफ़ील रूप का सामान्य अर्थ ‘देखना/निहारना’ है। भविष्य के न्याय को एली के प्रत्यक्ष देखने के रूप में व्यक्त करने के लिए सहज और सीधा अनुवाद।
- source_word: צַר מָעוֹן
  choice: निवासस्थान की विपत्ति
  rationale: צַר का अर्थ ‘विपत्ति/संकट’ या ‘शत्रु’ और מָעוֹן का अर्थ ‘निवासस्थान’ हो सकता है। मुख्य पाठ अपेक्षाकृत शाब्दिक रखा गया है और कठिनाई को पादटिप्पणी में बताया गया है।
- source_word: בְּכֹל אֲשֶׁר יֵיטִיב אֶת־יִשְׂרָאֵל
  choice: उस सारे भले के बीच ... जो वह इस्राएल के लिए करेगा
  rationale: मूल में भलाई करने वाले कर्ता का नाम स्पष्ट नहीं है; हिन्दी में ‘वह’ रखकर उसी अंतर्निहित संदर्भ को बनाए रखा गया है। בְּכֹל को प्रसंगानुकूल ‘उस सारे ... के बीच’ कहा गया है।
- source_word: זָקֵן
  choice: बूढ़ा
  rationale: यहाँ पदाधिकारी ‘पुरनिया’ नहीं, बल्कि आयु में वृद्ध होने का अर्थ है।
- source_word: בְּבֵיתְךָ
  choice: तेरे घराने में
  rationale: בַּיִת यहाँ भवन से अधिक एली के परिवार और वंश को सूचित करता है; आधुनिक हिन्दी में ‘घराना’ यह अर्थ स्पष्ट और स्वाभाविक रूप से देता है।
- source_word: כָּל הַיָּמִים
  choice: जीवन भर
  rationale: शाब्दिक ‘सारे दिनों’ का आशय इस संदर्भ में किसी पुरुष का पूर्ण जीवनकाल है। ‘जीवन भर बूढ़ा नहीं होगा’ न्याय के आशय को सहज हिन्दी में व्यक्त करता है, बिना ‘कभी नहीं’ जैसी अतिरिक्त सार्वकालिकता जोड़े।
theological_decisions:
- issue: कठिन पदबंध צַר מָעוֹן की व्याख्या
  choice: निवासस्थान की विपत्ति
  alternative: निवासस्थान में एक शत्रु; पवित्रस्थान में विपत्ति
  rationale: इब्रानी पदबंध व्याकरण और अर्थ दोनों की दृष्टि से कठिन है। मुख्य पाठ में अपेक्षाकृत औपचारिक रूप रखा गया है; किसी निश्चित शत्रु या केवल पवित्रस्थान के विनाश को निर्णायक रूप से आरोपित नहीं किया गया।
- issue: יֵיטִיב का अंतर्निहित कर्ता
  choice: ‘वह’—कर्ता को अनाम रखा गया
  alternative: ‘परमेश्वर’ स्पष्ट रूप से जोड़ा जाए
  rationale: संदर्भ में कर्ता स्वाभाविक रूप से परमेश्वर है, पर मूल पद में नाम नहीं दिया गया। इसलिए अनुवाद मूल की अंतर्निहितता सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। एली को एकवचन संबोधन होने के कारण ‘तू/तेरे’ रखा गया है। कठिन इब्रानी पदबंध की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित है।
