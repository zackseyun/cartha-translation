source:
  edition: WLC
  text: וּ/מְעִ֤יל קָטֹן֙ תַּעֲשֶׂה לּ֣/וֹ אִמּ֔/וֹ וְ/הַעַלְתָ֥ה ל֖/וֹ מִ/יָּמִ֣ים יָמִ֑ימָ/ה בַּֽ/עֲלוֹתָ/הּ֙ אֶת אִישָׁ֔/הּ לִ/זְבֹּ֖חַ אֶת זֶ֥בַח הַ/יָּמִֽים־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/019.yaml
  text: And his mother would make for him a small robe and bring it up to him from year to year[b][a], when she went up with her husband to offer the yearly sacrifice.
translation:
  language: hi
  text: उसकी माँ उसके लिए एक छोटा-सा चोगा[a] बनाती और उसे साल-दर-साल[b] उसके पास ले जाती थी, जब वह अपने पति के साथ वार्षिक बलिदान चढ़ाने ऊपर जाती थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छोटा-सा बाहरी वस्त्र।” इब्रानी शब्द מְעִיל ऊपर से पहने जाने वाले वस्त्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “दिनों से दिनों तक,” अर्थात हर वर्ष या साल-दर-साल।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְעִיל
  choice: चोगा
  rationale: यह शब्द ऊपर से पहने जाने वाले वस्त्र को दर्शाता है। आधुनिक हिंदी में ‘चोगा’ इस अर्थ को सहज रूप से व्यक्त करता है और प्रसंग में वस्त्र की विशिष्टता बनाए रखता है।
- source_word: קָטֹן
  choice: छोटा-सा
  rationale: वस्त्र के बालक के आकार का होने का भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: תַּעֲשֶׂה
  choice: बनाती
  rationale: यहाँ अपूर्ण क्रिया भूतकाल में नियमित रूप से दोहराए जाने वाले कार्य को दर्शाती है; आगे ‘थी’ के साथ संयुक्त होकर यह अभ्यस्त क्रिया बनती है।
- source_word: וְהַעַלְתָה לּוֹ
  choice: और उसे ... उसके पास ले जाती थी
  rationale: ‘उसे’ का संकेत चोगे की ओर है। हिंदी में ‘ले जाती थी’ वस्तु को साथ पहुँचाने की गति को स्वाभाविक ढंग से व्यक्त करता है; वाक्य के अंत में ‘ऊपर जाती थी’ तीर्थ/पवित्रस्थान की ओर आरोहण का भाव सुरक्षित रखता है।
- source_word: מִיָּמִים יָמִימָה
  choice: साल-दर-साल
  rationale: शाब्दिक रूप ‘दिनों से दिनों तक’ एक इब्रानी मुहावरा है, जिसका आशय हर वर्ष नियमित रूप से है।
- source_word: בַּעֲלוֹתָהּ
  choice: जब वह ... ऊपर जाती थी
  rationale: कालसूचक रचना और पवित्रस्थान की ओर चढ़कर जाने—दोनों भावों को बनाए रखता है।
- source_word: אִישָׁהּ
  choice: अपने पति
  rationale: संबंधसूचक प्रत्यय सहित इस प्रसंग में शब्द का अर्थ ‘उसका पति’ है; हिंदी में कर्ता से संबंध के कारण ‘अपने पति’ स्वाभाविक है।
- source_word: לִזְבֹּחַ
  choice: बलिदान चढ़ाने
  rationale: क्रिया का मूल अर्थ बलि देना/वध करके अर्पित करना है; ‘बलिदान चढ़ाना’ हिंदी में उपासना-संबंधी कार्य को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: זֶבַח הַיָּמִים
  choice: वार्षिक बलिदान
  rationale: यह नियमित रूप से हर वर्ष चढ़ाए जाने वाले बलिदान को दर्शाता है; ‘वार्षिक’ संक्षिप्त और स्पष्ट है।
