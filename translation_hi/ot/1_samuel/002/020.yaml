base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/020.yaml
  text: And Eli would bless Elkanah and his wife and say[b][a], “May Yahweh give you offspring by this woman in place of the petition that was asked for Yahweh.” Then they would go to his place.
translation:
  language: hi
  text: और एली एल्काना और उसकी पत्नी को आशीर्वाद देकर कहते थे, “याहवे तुम्हें इस स्त्री से उस माँगी हुई वस्तु के बदले संतान दे, जिसे उसने याहवे से माँगा था[a]।” फिर वे अपने घर चले जाते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शब्दशः भाव है, “उस याचना/माँगी हुई वस्तु के बदले, जिसे उसने याहवे से माँगा था।” यह शब्द शमूएल के जन्म-वृत्तांत में बार-बार आने वाली “माँगना” धातु से जुड़ा है और याचना, माँगी हुई वस्तु, अथवा संदर्भ में शमूएल की ओर संकेत कर सकता है। “माँगा था” की इब्रानी क्रिया पुल्लिंग एकवचन है, यद्यपि प्रसंग हन्ना द्वारा संतान माँगे जाने की ओर संकेत करता है।
    reason: मूल की शब्द-क्रीड़ा, संज्ञा की अर्थगत व्यापकता, और क्रिया के व्याकरणिक लिंग को दर्ज करना।
lexical_decisions:
- source_word: וּבֵרַךְ
  choice: आशीर्वाद देते हुए कहते थे
  rationale: आसपास के वार्षिक प्रसंग में क्रिया को आदतन घटने वाली कार्रवाई के रूप में व्यक्त किया गया है; ‘कहते थे’ आगामी וְאָמַר को भी स्वाभाविक हिन्दी में जोड़ता है।
- source_word: אֶת אֶלְקָנָה וְאֶת אִשְׁתּוֹ
  choice: एल्काना और उसकी पत्नी को
  rationale: मूल में पत्नी का नाम नहीं, बल्कि ‘उसकी पत्नी’ है; हिन्दी में यही स्रोत के निकट और स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में रखा गया है।
- source_word: יָשֵׂם יְהוָה לְךָ זֶרַע
  choice: याहवे तुम्हें … संतान दे
  rationale: שׂים का मूल अर्थ रखना/ठहराना है, पर आशीर्वाद के इस संदर्भ में ‘संतान दे’ स्वाभाविक हिन्दी है; זֶרַע का सामूहिक भाव ‘संतान’ में बना रहता है।
- source_word: מִן הָאִשָּׁה הַזֹּאת
  choice: इस स्त्री से
  rationale: यह वाक्यांश उस स्त्री को संतान की माता के रूप में बताता है; ‘इस स्त्री से’ संक्षिप्त और स्रोत-सन्निकट है।
- source_word: תַּחַת הַשְּׁאֵלָה
  choice: उस माँगे हुए के बदले
  rationale: תחת का प्रतिस्थापन-वाला अर्थ ‘के बदले’ से आता है। השאלה में שׁאל (‘माँगना’) की प्रतिध्वनि और संज्ञा की अस्पष्टता बचाने के लिए ‘माँगे हुए’ चुना गया है, जो माँगी हुई वस्तु—संदर्भतः शमूएल—की ओर संकेत कर सकता है।
- source_word: אֲשֶׁר שָׁאַל לַיהוָה
  choice: जिसे उसने याहवे से माँगा था
  rationale: मूल क्रिया पुल्लिंग एकवचन है, इसलिए हिन्दी ‘उसने’ लिंग को खुला रखती है और हन्ना को स्त्रीलिंग क्रिया देकर पाठगत तनाव को मिटाती नहीं। प्रसंग में माँगी गई वस्तु शमूएल है।
- source_word: וְהָלְכוּ לִמְקֹמוֹ
  choice: फिर वे अपने घर चले जाते थे
  rationale: बहुवचन क्रिया दंपति के जाने को दर्शाती है। एकवचन प्रत्यय के शब्दशः ‘उसके स्थान’ की जगह हिन्दी का स्वाभाविक ‘अपने घर’ आशय देता है; आदतन भाव ‘जाते थे’ में बना है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: व्यक्तिगत ईश्वरीय नाम को नाम के रूप में प्रस्तुत किया गया है, किसी सांप्रदायिक व्याख्या को जोड़े बिना।
- issue: שָׁאַל का कर्ता
  choice: लिंग-निरपेक्ष हिन्दी ‘उसने’
  alternative: ‘उसने (हन्ना ने)’ अथवा ‘उसने (एल्काना ने)’ को स्पष्ट करना
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, जबकि व्यापक प्रसंग हन्ना के माँगने की ओर संकेत करता है। हिन्दी सर्वनाम ‘उसने’ वास्तविक रूपगत और प्रसंगगत तनाव को अनावश्यक रूप से हल नहीं करता।
- issue: הַשְּׁאֵלָה का संकेत
  choice: उस माँगे हुए
  alternative: विनती; माँगी हुई संतान; उधार
  rationale: यह रूप שׁאל धातु की उस शब्द-क्रीड़ा को बनाए रखता है जो शमूएल के माँगे जाने और याहवे को सौंपे जाने की कथा में बार-बार आती है, बिना संज्ञा को केवल ‘विनती’ या केवल ‘बालक’ ठहराए।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वार्षिक रीति का भाव ‘देते हुए कहते थे’ और ‘चले जाते थे’ से व्यक्त है। ‘उसने’ जानबूझकर लिंग-निरपेक्ष रखा गया है।
