  text: וּ/בָחֹ֣ר אֹ֠ת/וֹ מִ/כָּל שִׁבְטֵ֨י יִשְׂרָאֵ֥ל לִ/י֙ לְ/כֹהֵ֔ן לַ/עֲל֣וֹת עַֽל מִזְבְּחִ֗/י לְ/הַקְטִ֥יר קְטֹ֛רֶת לָ/שֵׂ֥את אֵפ֖וֹד לְ/פָנָ֑/י וָֽ/אֶתְּנָ/ה֙ לְ/בֵ֣ית אָבִ֔י/ךָ אֶת כָּל אִשֵּׁ֖י בְּנֵ֥י יִשְׂרָאֵֽל־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/028.yaml
  text: And did I not choose him from all the tribes of Israel to be my priest[a], to go up to my altar, to burn incense, to wear an ephod before me? And I gave to your father's house all the food offerings of the sons of Israel.
translation:
  language: hi
  text: क्या मैंने इस्राएल के सभी गोत्रों में से उसे नहीं चुना कि वह मेरा याजक हो, मेरी वेदी पर चढ़े, धूप जलाए और मेरे सामने एपोद पहने? और मैंने तुम्हारे पिता के घराने को इस्राएल के पुत्रों की अग्नि में अर्पित की जाने वाली सभी भेंटें[a] दीं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: ‘इस्राएल के पुत्रों की आग से की जाने वाली सभी भेंटें।’'
    reason: אִשֵּׁי का व्यापक ‘अग्नि द्वारा अर्पित भेंटें’ वाला अर्थ सुरक्षित रखने और इसे केवल होमबलि या अन्न-भेंट तक सीमित न करने के लिए।
lexical_decisions:
- source_word: וּבָחֹר אֹתוֹ
  choice: क्या मैंने उसी को नहीं चुना
  rationale: प्रसंग में यह रूप परमेश्वर के पूर्व चुनाव को बल देने वाला आलंकारिक प्रश्न है; ‘उसी को’ प्रत्यक्ष कर्म पर पड़े बल को व्यक्त करता है।
- source_word: מִכָּל שִׁבְטֵי יִשְׂרָאֵל
  choice: इस्राएल के सभी गोत्रों में से
  rationale: चुनाव के समूहगत, अंशसूचक भाव को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: לִי לְכֹהֵן
  choice: कि वह मेरा याजक हो
  rationale: दोनों उद्देश्यसूचक ל का भाव और परमेश्वर से याजक के संबंध को स्पष्ट तथा संक्षिप्त रूप से व्यक्त करता है।
- source_word: לַעֲלוֹת עַל מִזְבְּחִי
  choice: मेरी वेदी पर चढ़े
  rationale: עלה के ठोस ‘ऊपर चढ़ने’ वाले भाव को रखता है और इसे अनावश्यक रूप से केवल ‘बलि चढ़ाने’ तक सीमित नहीं करता।
- source_word: לְהַקְטִיר קְטֹרֶת
  choice: धूप जलाए
  rationale: यह याजकीय अनुष्ठान के लिए स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: לָשֵׂאת אֵפוֹד לְפָנָי
  choice: मेरे सामने एपोद पहने
  rationale: नשא का मूल भाव ‘उठाना/धारण करना’ है; याजकीय वस्त्र के संदर्भ में ‘पहने’ आधुनिक हिन्दी में सबसे स्वाभाविक है और क्रियात्मक आशय को व्यक्त करता है।
- source_word: לְבֵית אָבִיךָ
  choice: तुम्हारे पूर्वज के घराने को
  rationale: यह एली के पैतृक याजकीय वंश को सूचित करता है; ‘पूर्वज का घराना’ हिन्दी में आशय को ‘पिता के भौतिक घर’ से बेहतर स्पष्ट करता है।
- source_word: אֶת כָּל אִשֵּׁי בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की आग में चढ़ाई जाने वाली सभी भेंटें
  rationale: אִשֵּׁי को सामान्य होमबलि तक सीमित किए बिना अग्नि द्वारा अर्पित भेंटों के व्यापक वर्ग के रूप में प्रस्तुत करता है; בְּנֵי יִשְׂרָאֵל का औपचारिक जातीय रूप भी सुरक्षित है।
theological_decisions:
- issue: बलिदानी शब्द אִשֵּׁי का अनुवाद
  choice: आग में चढ़ाई जाने वाली सभी भेंटें
  alternative: सभी अन्न-भेंटें; सभी होमबलियाँ
  rationale: यह शब्द अग्नि के द्वारा अर्पित विभिन्न भेंटों का व्यापक संकेत देता है। ‘अन्न-भेंटें’ इसे खाद्य पदार्थों तक और ‘होमबलियाँ’ एक विशिष्ट बलि-वर्ग तक अनुचित रूप से सीमित कर सकती हैं।
- issue: בְּנֵי יִשְׂרָאֵל का जातीय पदबंध
  choice: इस्राएल के पुत्र
  alternative: इस्राएली; इस्राएल के लोग
  rationale: स्रोत के पुरुषवाचक वंशगत सूत्र को औपचारिक रूप से बनाए रखा गया है, बिना उससे अतिरिक्त धर्मवैज्ञानिक निष्कर्ष निकाले।
- issue: एपोद के साथ נשא का अर्थ
  choice: एपोद पहने
  alternative: एपोद धारण करे; एपोद उठाए
  rationale: क्रिया में ‘उठाने/धारण करने’ का विस्तार है, पर याजकीय परिधान के संदर्भ में ‘पहने’ सर्वाधिक स्वाभाविक और प्रसंगानुकूल है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज स्तर रखा गया है। ‘याजक’, ‘वेदी’, ‘धूप’ और ‘एपोद’ जैसे स्थापित बाइबलीय शब्द प्रयुक्त हैं। स्रोत की प्रश्नात्मक बलाघात, याजकीय कार्यों की क्रमबद्धता और अग्नि-भेंटों की व्यापकता सुरक्षित रखी गई है।
