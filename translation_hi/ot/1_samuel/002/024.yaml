  text: אַ֖ל בָּנָ֑/י כִּ֠י לֽוֹא טוֹבָ֤ה הַ/שְּׁמֻעָה֙ אֲשֶׁ֣ר אָנֹכִ֣י שֹׁמֵ֔עַ מַעֲבִרִ֖ים עַם יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/024.yaml
  text: No[a], my sons; for the report that I hear is not good. You are making Yahweh’s people transgress.
translation:
  language: hi
  text: नहीं, मेरे बेटो! क्योंकि जो समाचार मैं सुन रहा हूँ, वह अच्छा नहीं है। तुम याहवे की प्रजा को पाप करने पर मजबूर कर रहे हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, इब्रानी को दूसरी तरह समझने पर: “क्योंकि जो समाचार मैं सुन रहा हूँ, जिसे याहवे की प्रजा फैला रही है, अच्छा नहीं है।”'
    reason: מַעֲבִרִים עַם יְהוָה की कठिन वाक्यरचना की एक सम्भव वैकल्पिक समझ को सुरक्षित रखना।
lexical_decisions:
- source_word: אַל
  choice: नहीं
  rationale: यहाँ यह किसी सीधे निषेध के बजाय एली की कड़ी असहमति और फटकार व्यक्त करने वाला विस्मयादिबोधक निषेध है।
- source_word: בָּנָי
  choice: मेरे बेटो
  rationale: सम्बोधित व्यक्ति एली के पुत्र हैं; सम्बोधन-रूप ‘बेटो’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: לֹא טוֹבָה
  choice: अच्छी नहीं है
  rationale: यह इब्रानी मूल्यांकन-वाक्यांश को बिना उसकी तीव्रता बढ़ाए सीधे रूप में सुरक्षित रखता है।
- source_word: הַשְּׁמֻעָה
  choice: जो बात
  rationale: सन्दर्भ में इसका अर्थ पुत्रों के आचरण के विषय में सुनी जा रही खबर या वृत्तान्त है। ‘जो बात’ सामान्य पाठक के लिए स्वाभाविक है और ‘अफवाह’ जैसी अनिश्चितता नहीं जोड़ता।
- source_word: אֲשֶׁר אָנֹכִי שֹׁמֵעַ
  choice: जो बात मैं सुन रहा हूँ
  rationale: वर्तमान कृदन्त निरन्तर सुनने का भाव दे सकता है; ‘सुन रहा हूँ’ उस चल रही क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַעֲבִרִים
  choice: अपराध करवा रहे हो
  rationale: עבר के हिफ़ील रूप को सन्दर्भानुसार दूसरों से उल्लंघन करवाने के अर्थ में लिया गया है। हिन्दी में ‘अपराध करवा रहे हो’ कारणवाचकता को स्पष्ट रखते हुए धार्मिक उल्लंघन का भाव देता है।
- source_word: עַם יְהוָה
  choice: याहवे की प्रजा
  rationale: सम्बन्धवाचक इब्रानी पदबंध को स्वाभाविक हिन्दी में रखा गया है और יְהוָה को व्यक्तिगत नाम के रूप में लिप्यन्तरित किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय ईश्वरीय नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में उसके प्रचलित निकट लिप्यन्तरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: מַעֲבִרִים עַם יְהוָה की व्याख्या
  choice: तुम याहवे की प्रजा से अपराध करवा रहे हो
  alternative: जो बात मैं याहवे की प्रजा को फैलाते हुए सुन रहा हूँ
  rationale: मुख्य पाठ हिफ़ील कृदन्त को कारणवाचक मानता है और एली के पुत्रों को निहित कर्ता समझता है। फिर भी पद की वाक्यरचना कठिन है और इसे याहवे की प्रजा द्वारा खबर फैलाने के अर्थ में भी समझा गया है; इसलिए वह सम्भावना टिप्पणी में सुरक्षित है।
- issue: יְהוָה का निरूपण
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे उपाधि में बदले बिना सीधे प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘नहीं, मेरे बेटो!’ एली की सीधी फटकार को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ अर्थ को स्पष्ट करता है, जबकि वास्तविक इब्रानी अस्पष्टता को पादटिप्पणी में बनाए रखता है।
