base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/006.yaml
  text: Yahweh puts to death and makes alive[a]; he brings down to Sheol and raises up.
translation:
  language: hi
  text: याहवे मार डालता है और जीवित करता है; वह शिओल[a] में उतारता है और ऊपर उठाता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कब्र’ अथवा ‘मृतकों का लोक’। इब्रानी शब्द ‘शिओल’ मृतकों के निवास-स्थान को दर्शाता है; इसे अपने-आप ‘नरक’ नहीं समझना चाहिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: מֵמִית
  choice: मार डालता
  rationale: מות के हिफ़ील रूप की कारक शक्ति को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וּמְחַיֶּה
  choice: और जीवित करता है
  rationale: חיה के कारक भाव को बनाए रखता है और ‘मार डालता’ के साथ काव्यात्मक समानांतरता सुरक्षित रखता है।
- source_word: מוֹרִיד
  choice: वह उतारता
  rationale: ירד के हिफ़ील रूप में निहित कारक अर्थ और परमेश्वर की सक्रिय भूमिका को संक्षेप में व्यक्त करता है।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: इब्रानी धारणा को ‘नरक’ या केवल ‘कब्र’ जैसे अधिक संकीर्ण अर्थ में सीमित करने से बचने के लिए मूल शब्द का लिप्यंतरण रखा गया है।
- source_word: וַיָּעַל
  choice: और ऊपर उठाता है
  rationale: עלה के कारक भाव को ‘उतारता’ के विपरीत काव्यात्मक जोड़ी के रूप में रखता है और पुनर्स्थापन या मृतकों के लोक से ऊपर लाने के भाव को अनावश्यक रूप से विशिष्ट नहीं बनाता।
theological_decisions:
- issue: क्या पद में पुनरुत्थान को स्पष्ट रूप से व्यक्त किया जाए
  choice: ‘जीवित करता है’ और ‘ऊपर उठाता है’ जैसे व्यापक शब्द रखे गए हैं।
  alternative: ‘मरे हुओं में से जिलाता है’ जैसे स्पष्ट शारीरिक पुनरुत्थान-सूचक शब्द प्रयोग करना।
  rationale: इब्रानी पाठ मृत्यु और शिओल पर याहवे की प्रभुता बताता है, पर शारीरिक पुनरुत्थान को तकनीकी या स्पष्ट शब्दों में निर्दिष्ट नहीं करता। व्यापक काव्यात्मक भाषा मूल की अर्थगत और धर्मवैज्ञानिक व्यापकता बनाए रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संक्षिप्त समानांतर पद-रचना मूल इब्रानी कविता की लय और विरोधी क्रियाओं—मारना/जीवित करना तथा उतारना/ऊपर उठाना—को सुरक्षित रखती है।
