source:
  edition: WLC
  text: אַל תַּרְבּ֤וּ תְדַבְּרוּ֙ גְּבֹהָ֣ה גְבֹהָ֔ה יֵצֵ֥א עָתָ֖ק מִ/פִּי/כֶ֑ם כִּ֣י אֵ֤ל דֵּעוֹת֙ יְהוָ֔ה ו/לא נִתְכְּנ֖וּ עֲלִלֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/003.yaml
  text: Do not keep speaking so very proudly; do not let arrogance come out of your mouth[a], for Yahweh is a God of knowledge, and by him actions are weighed.
translation:
  language: hi
  text: 'बार-बार बहुत घमण्ड से मत बोलो;

    तुम्हारे मुँह से ढिठाई न निकले,

    क्योंकि याहवे ज्ञान का परमेश्वर है,

    और उसी के द्वारा कर्म तौले जाते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'व्यंजनात्मक पाठ का अधिक कड़ाई से अनुसरण करने पर सम्भव अनुवाद: “और कर्म तौले नहीं जाते।” मुख्य पाठ पारम्परिक पठन का अनुसरण करता है, जिसके अनुसार याहवे मनुष्यों के कर्मों को परखता है।'
    reason: textual_variant
lexical_decisions:
- source_word: אַל תַּרְבּוּ תְדַבְּרוּ
  choice: बार-बार बातें मत करो
  rationale: רבה के साथ अगली सीमित क्रिया बोलने की बहुलता या निरन्तरता व्यक्त करती है। यह हिन्दी में निषेध और दोहराव दोनों को स्वाभाविक रूप से रखता है।
- source_word: גְּבֹהָה גְבֹהָה
  choice: बहुत घमण्ड से
  rationale: दोहराया गया शब्द ऊँचे और अहंकारी ढंग से बोलने पर बल देता है; ‘बहुत घमण्ड से’ उसका नैतिक भाव स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: יֵצֵא עָתָק מִפִּיכֶם
  choice: तुम्हारे मुँह से ढिठाई न निकले
  rationale: עָתָק यहाँ अहंकारी, उद्दण्ड या धृष्ट वाणी को सूचित करता है। पिछले निषेध को इस उपवाक्य में लागू करके मूल अर्थ और काव्यात्मक चित्र दोनों सुरक्षित रहते हैं।
- source_word: אֵל דֵּעוֹת יְהוָה
  choice: यहोवा ज्ञान का परमेश्वर है
  rationale: ‘ज्ञानों का परमेश्वर’ का बहुवचन व्यापक या पूर्ण ज्ञान का भाव देता है; हिन्दी में एकवचन ‘ज्ञान’ अधिक स्वाभाविक है। יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: ו/לא נִתְכְּנוּ עֲלִלוֹת
  choice: और उसी के द्वारा काम तौले जाते हैं
  rationale: मुख्य पाठ पारम्परिक पठन और प्रसंगानुकूल अर्थ ग्रहण करता है कि परमेश्वर मनुष्यों के कामों को परखता है। ‘तौले’ נִתְכְּנוּ के मापने या मूल्यांकन करने के रूपक को बनाए रखता है; पाठगत विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार-अक्षरी व्यक्तिगत ईश्वरीय नाम सीधे प्रयुक्त है। हिन्दी के सामान्य और प्रतिष्ठित रूप ‘यहोवा’ से नाम को उपाधि में बदले बिना प्रस्तुत किया गया है।
- issue: ו/לא נִתְכְּנוּ עֲלִילוֹת का पाठ और अर्थ
  choice: और उसी के द्वारा काम तौले जाते हैं
  alternative: और काम तौले नहीं जाते
  rationale: व्यंजनात्मक पाठ לא को ‘नहीं’ समझने की सम्भावना देता है, जबकि पारम्परिक पठन और प्रसंग यह अर्थ देते हैं कि यहोवा कामों का मूल्यांकन करता है। मुख्य पाठ में उत्तरवर्ती अर्थ रखा गया है और वास्तविक पाठगत अस्पष्टता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, काव्यात्मक और सामान्य पाठक के लिए सुबोध शैली। समानान्तर पंक्तियाँ इब्रानी काव्य की लय बनाए रखती हैं; ‘ढिठाई’ उद्दण्ड अहंकार का सहज शब्द है और ‘काम तौले जाते हैं’ मूल रूपक को सुरक्षित रखता है।
