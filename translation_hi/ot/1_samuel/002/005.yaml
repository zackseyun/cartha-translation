  text: שְׂבֵעִ֤ים בַּ/לֶּ֨חֶם֙ נִשְׂכָּ֔רוּ וּ/רְעֵבִ֖ים חָדֵ֑לּוּ עַד עֲקָרָה֙ יָלְדָ֣ה שִׁבְעָ֔ה וְ/רַבַּ֥ת בָּנִ֖ים אֻמְלָֽלָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/005.yaml
  text: Those who were full have hired themselves out for bread[a], but those who were hungry have ceased. Even the barren woman has borne seven[c][b], but she who had many sons has withered away.
translation:
  language: hi
  text: 'जो तृप्त थे, वे रोटी के लिए मज़दूरी पर लग गए हैं;

    पर जो भूखे थे, उनकी भूख मिट गई है।[a]

    यहाँ तक कि बाँझ स्त्री ने सात संतानों को जन्म दिया है,[b]

    पर जिसके बहुत-से पुत्र थे, वह मुरझा गई है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप में, “भूखे रुक गए हैं।” इब्रानी में यह नहीं बताया गया कि क्या रुक गया; आशय यह हो सकता है कि अब वे भूखे नहीं रहे या उनका अभाव समाप्त हो गया।
    reason: lexical_alternative
  - marker: b
    text: “सात” वास्तविक संख्या भी हो सकती है और काव्य में पूर्णता या भरपूरी का संकेत भी। इब्रानी यहाँ जन्मे लोगों का लिंग निर्दिष्ट नहीं करता।
    reason: cultural_note
lexical_decisions:
- source_word: שְׂבֵעִים
  choice: जो पेट भरकर खाते थे
  rationale: विशेषण का प्रयोग लोगों के लिए हुआ है। यह स्वाभाविक हिन्दी में उनकी पहले की संपन्न और तृप्त दशा व्यक्त करता है तथा पद के उलटफेर को स्पष्ट रखता है।
- source_word: בַּלֶּחֶם
  choice: रोटी के लिए
  rationale: לֶחֶם का ठोस अर्थ ‘रोटी’ सुरक्षित रखा गया है; यहाँ यह जीविका के लिए विवश होकर काम करने का चित्र प्रस्तुत करता है।
- source_word: נִשְׂכָּרוּ
  choice: मज़दूरी करने लगे हैं
  rationale: निफ़अल रूप यहाँ मज़दूर के रूप में अपने को लगवा देने या भाड़े पर काम करने का भाव देता है। यह हिन्दी में स्वाभाविक है और निर्भरता में आए सामाजिक पतन को दर्शाता है।
- source_word: וּרְעֵבִים חָדֵלּוּ
  choice: जो भूखे थे, उनकी भूख मिट गई है
  rationale: חָדֵלּוּ का मूल अर्थ ‘रुक गए/समाप्त हो गए’ है और उसका कर्म नहीं कहा गया। हिन्दी में ‘उनकी भूख मिट गई’ प्रसंगगत लोप को स्वाभाविक ढंग से पूरा करता है; पादटिप्पणी अधिक शाब्दिक रूप बताती है।
- source_word: עַד
  choice: यहाँ तक कि
  rationale: यहाँ עַד उलटफेर की पराकाष्ठा प्रस्तुत करता है; ‘यहाँ तक कि’ उसके काव्यात्मक बल को सहज हिन्दी में व्यक्त करता है।
- source_word: עֲקָרָה
  choice: बाँझ स्त्री
  rationale: स्त्रीलिंग विशेषण संज्ञा के समान प्रयुक्त है। ‘बाँझ स्त्री’ सटीक, प्रचलित और प्रसंगानुकूल है।
- source_word: יָלְדָה שִׁבְעָה
  choice: सात पुत्रों को जन्म दिया है
  rationale: ‘सात’ को बिना व्याख्यात्मक विस्तार के रखा गया है। हिन्दी में कर्म स्पष्ट करना आवश्यक है; निकटवर्ती בָּנִים और काव्यात्मक समानांतरता के आधार पर ‘पुत्रों’ का प्रयोग किया गया है।
- source_word: וְרַבַּת בָּנִים
  choice: जिसके बहुत-से पुत्र थे
  rationale: בָּנִים का विशिष्ट अर्थ ‘पुत्र’ सुरक्षित है और स्त्री की पूर्व अवस्था बताने के लिए ‘थे’ उलटफेर को स्पष्ट करता है।
- source_word: אֻמְלָלָה
  choice: मुरझा गई है
  rationale: शब्द निर्बल, क्षीण या दयनीय हो जाने का भाव देता है। ‘मुरझा गई’ फलवत्ता के विपरीत काव्यात्मक क्षय का चित्र बनाए रखता है।
theological_decisions:
- issue: ‘सात’ को वास्तविक संख्या मानना या पूर्णता का काव्यात्मक संकेत
  choice: मुख्य पाठ में ‘सात’ को बिना व्याख्या के बनाए रखा गया है
  alternative: इसे पूर्ण या भरपूर फलवत्ता का प्रतीक मानकर अर्थ खोल देना
  rationale: इब्रानी सीधे संख्या देता है और उसका शाब्दिक तथा पूर्णता-सूचक दोनों अनुनाद संभव है; अनुवाद इस तनाव को खुला रखता है।
- issue: בָּנִים को ‘पुत्र’ या सामान्यीकृत ‘बच्चे’ कहना
  choice: पुत्र
  alternative: बच्चे/संतान
  rationale: मूल संज्ञा पुल्लिंग बहुवचन है और इस प्रसंग में उसे लिंग-निरपेक्ष बनाने की बाध्यता नहीं है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक किंतु साधारण पाठक के लिए सहज रखी गई है। अर्धविराम समानांतर विरोधों को उभारते हैं। ‘रोटी’, ‘बाँझ स्त्री’, ‘पुत्र’ और ‘मुरझा गई’ मूल के ठोस तथा काव्यात्मक चित्र सुरक्षित रखते हैं।
