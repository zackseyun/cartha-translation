  yaml_path: translation/ot/1_samuel/002/018.yaml
  text: Samuel was ministering before Yahweh[a], a boy clothed with a linen ephod.
translation:
  language: hi
  text: और बालक शमूएल सन का एपोद पहने हुए यहवे के सामने[a] सेवा कर रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “यहवे के मुख के सामने,” अर्थात् “यहवे की उपस्थिति में।”'
    reason: मूल इब्रानी मुहावरे के शाब्दिक चित्र और उसके ‘उपस्थिति’ संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וּ/שְׁמוּאֵל
  choice: और बालक शमूएल
  rationale: וּ के संयोजक बल को ‘और’ से रखा गया है; नाम का प्रचलित हिन्दी रूप ‘शमूएल’ है। नַעַר को इसी वाक्यांश में स्वाभाविक हिन्दी क्रम के अनुसार जोड़ा गया है।
- source_word: מְשָׁרֵת
  choice: सेवा करता था
  rationale: वर्तमान कृदन्त यहाँ चलती हुई या नियमित सेवा का भाव देता है; हिन्दी का अपूर्ण भूतकाल उस कालगत भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶת פְּנֵי יְהוָה
  choice: यहवे के सामने[a]
  rationale: ‘के सामने’ इब्रानी ‘मुख/उपस्थिति के सामने’ मुहावरे का संक्षिप्त और सहज रूप है। יְהוָה को व्यक्तिगत वाचा-नाम ‘यहवे’ के रूप में रखा गया है।
- source_word: נַעַר
  choice: बालक
  rationale: यह शब्द यहाँ शमूएल की कम आयु बताता है; ‘बालक’ सेवक की अतिरिक्त भूमिका आरोपित किए बिना अर्थ देता है।
- source_word: חָגוּר
  choice: पहने हुए
  rationale: शाब्दिक अर्थ ‘कमर में बाँधे हुए’ है, पर किसी वस्त्र के संदर्भ में ‘पहने हुए’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: यह एक विशिष्ट इस्राएली धार्मिक वस्त्र है जिसका सटीक हिन्दी पर्याय नहीं है; लिप्यंतरण अनावश्यक अतिव्याख्या से बचाता है।
- source_word: בָּד
  choice: सनी कपड़े का
  rationale: याजकीय वस्त्रों के संदर्भ में בָּד सन से बने वस्त्र को सूचित करता है; ‘सनी कपड़े का’ सामग्री को स्पष्ट करता है और ‘उत्तम’ जैसी अनुपस्थित विशेषता नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम सीधे आया है। ‘यहवे’ वाचा-नाम को नाम के रूप में बनाए रखता है, जबकि ‘प्रभु’ उसे उपाधि में बदल देता है; ‘यहोवा’ एक बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘एपोद’ जैसे विशिष्ट सांस्कृतिक शब्द का लिप्यंतरण किया गया है, जबकि उसके पदार्थ को स्पष्ट हिन्दी में व्यक्त किया गया है।
