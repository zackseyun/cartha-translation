id: 1SA.2.35
reference: 1 Samuel 2:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/הֲקִימֹתִ֥י לִ/י֙ כֹּהֵ֣ן נֶאֱמָ֔ן כַּ/אֲשֶׁ֛ר בִּ/לְבָבִ֥/י וּ/בְ/נַפְשִׁ֖/י יַעֲשֶׂ֑ה וּ/בָנִ֤יתִי ל/וֹ֙ בַּ֣יִת נֶאֱמָ֔ן וְ/הִתְהַלֵּ֥ךְ לִ/פְנֵֽי מְשִׁיחִ֖/י כָּל הַ/יָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/035.yaml
  text: And I will raise up for myself a faithful priest[a], who will do according to what is in my heart and in my soul. And I will build for him a faithful house[b], and he will walk before my anointed all the days.
translation:
  language: hi
  text: और मैं अपने लिए एक विश्वासयोग्य याजक खड़ा करूँगा, जो मेरे मन और मेरी इच्छा के अनुसार करेगा। मैं उसके लिए एक स्थायी घराना[a] बनाऊँगा, और वह सदा मेरे अभिषिक्त के सामने चलता रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “विश्वासयोग्य घर”; आशय एक टिकाऊ घराना या वंश-परंपरा भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: “मेरे अभिषिक्त” का अनुवाद “मेरे मसीह” या इस संदर्भ में “मेरे राजा” भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַהֲקִימֹתִי לִי
  choice: मैं अपने लिए ... खड़ा करूँगा
  rationale: यह पदबंध परमेश्वर की पहल और किसी व्यक्ति को पद पर नियुक्त करने का भाव रखता है; ‘खड़ा करूँगा’ व्यक्तिगत और पदगत दोनों अर्थों को बनाए रखता है।
- source_word: כֹּהֵן נֶאֱמָן
  choice: एक विश्वासयोग्य याजक
  rationale: ‘विश्वासयोग्य’ भरोसेमंदी और अपने दायित्व के प्रति निष्ठा, दोनों को व्यक्त करता है।
- source_word: בִּלְבָבִי וּבְנַפְשִׁי
  choice: मेरे मन और मेरी इच्छा के अनुसार
  rationale: हिब्रू में शाब्दिक रूप से ‘मेरे हृदय और मेरे प्राण में’ है; यहाँ संयुक्त मुहावरा परमेश्वर की अंतःस्थ इच्छा और अभिप्राय को बताता है। स्वाभाविक हिन्दी में अर्थ स्पष्ट रखते हुए दोनों अंगों की तीव्रता बचाई गई है।
- source_word: בַּיִת נֶאֱמָן
  choice: एक स्थायी घराना
  rationale: यहाँ ‘घर’ भवन नहीं, बल्कि परिवार या वंश-परंपरा है; इस प्रयोग में נֶאֱמָן का आशय टिकाऊ या स्थायी होने से है।
- source_word: וְהִתְהַלֵּךְ לִפְנֵי
  choice: के सामने चलता रहेगा
  rationale: ‘चलना’ हिब्रू मुहावरे को बनाए रखता है और लगातार सेवा तथा आचरण—दोनों की गुंजाइश छोड़ता है।
- source_word: מְשִׁיחִי
  choice: मेरे अभिषिक्त
  rationale: यह मूल शब्द का सीधा अर्थ है और संदर्भ को समय से पहले केवल ‘मसीहा’ या केवल ‘राजा’ तक सीमित नहीं करता।
- source_word: כָּל־הַיָּמִים
  choice: सदा
  rationale: शाब्दिक ‘सभी दिनों’ का स्वाभाविक हिन्दी अर्थ यहाँ निरंतरता और दीर्घकालिकता को दर्शाने वाला ‘सदा’ है।
theological_decisions:
- issue: ‘मेरे अभिषिक्त’ का संदर्भ
  choice: मेरे अभिषिक्त
  alternative: मेरे मसीह; मेरे राजा
  rationale: तात्कालिक ऐतिहासिक संदर्भ अभिषिक्त शासक की ओर संकेत कर सकता है, जबकि व्यापक धर्मवैधानिक अर्थ भी खुला रहता है। इसलिए मुख्य पाठ में सामान्य पद ‘अभिषिक्त’ रखा गया है।
- issue: याजक का अभिषिक्त के सामने चलना
  choice: मुहावरे को ‘चलता रहेगा’ के रूप में सुरक्षित रखा
  alternative: सेवा करता रहेगा
  rationale: ‘सेवा करेगा’ संदर्भगत अर्थ हो सकता है, पर वह मूल क्रिया के आचरण और निरंतर उपस्थिति संबंधी व्यापक भाव को संकरा कर देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली अपनाई गई है। ‘याजक’ और ‘अभिषिक्त’ जैसे प्रचलित बाइबलीय पद बनाए गए हैं। हिब्रू मुहावरे वहाँ सुरक्षित रखे गए हैं जहाँ वे हिन्दी में समझने योग्य हैं; अस्पष्टताओं को पादटिप्पणियों में खुला रखा गया है।
