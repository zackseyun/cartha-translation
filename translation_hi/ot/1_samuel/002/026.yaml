source:
  edition: WLC
  text: וְ/הַ/נַּ֣עַר שְׁמוּאֵ֔ל הֹלֵ֥ךְ וְ/גָדֵ֖ל וָ/ט֑וֹב גַּ֚ם עִם יְהוָ֔ה וְ/גַ֖ם עִם אֲנָשִֽׁים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/026.yaml
  text: The boy Samuel continued to grow, and he was good in the sight of both Yahweh and men[a][b].
translation:
  language: hi
  text: बालक शमूएल बढ़ता गया, और वह याहवे तथा लोगों—दोनों की दृष्टि में अच्छा था[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बढ़ता गया और याहवे तथा लोगों—दोनों को अधिकाधिक प्रिय होता गया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “याहवे के साथ भी और मनुष्यों के साथ भी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/הַ/נַּעַר
  choice: बालक
  rationale: נַעַר बालक, किशोर या युवा सेवक को सूचित कर सकता है। इस प्रसंग में शमूएल अभी पवित्रस्थान में सेवा करने वाला बच्चा है, इसलिए ‘बालक’ सबसे उपयुक्त है। आरंभिक וְ को अलग शब्द से व्यक्त करना हिंदी में आवश्यक नहीं है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिवाचक नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: הֹלֵךְ וְ/גָדֵל
  choice: बढ़ता गया
  rationale: הֹלֵךְ के साथ अगला पद निरंतर प्रगति का भाव देता है। ‘बढ़ता गया’ इस जारी प्रक्रिया को स्वाभाविक और संक्षिप्त हिंदी में व्यक्त करता है।
- source_word: וָ/טוֹב
  choice: और वह ... अच्छा था
  rationale: טוֹב यहाँ עִם के साथ संबंधपरक मूल्यांकन व्यक्त करता है—किसी की दृष्टि में अच्छा, स्वीकार्य या प्रिय होना। ‘अच्छा था’ मूल के विशेषणात्मक रूप को बनाए रखता है; वैकल्पिक प्रगतिशील अर्थ पादटिप्पणी में दिया गया है।
- source_word: גַּם עִם יְהוָה וְ/גַם עִם אֲנָשִׁים
  choice: याहवे तथा लोगों—दोनों की दृष्टि में
  rationale: दोहराया हुआ גַּם ... וְגַם संतुलित ‘दोनों’ संरचना बनाता है। यहाँ עִם संबंध या अनुमोदन के अर्थ में है। אֲנָשִׁים का स्वाभाविक सामूहिक हिंदी रूप ‘लोगों’ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। ‘याहवे’ उसका आधुनिक विद्वत्तापरक लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: וָטוֹב עִם का अर्थ
  choice: दोनों की दृष्टि में अच्छा था
  alternative: दोनों को अधिकाधिक प्रिय होता गया
  rationale: मुख्य पाठ विशेषण טוֹב की रूपात्मक सादगी और ईश्वर तथा मनुष्यों के समानांतर संबंध को बनाए रखता है। फिर भी इसे पिछले प्रगतिशील पद के साथ जोड़कर बढ़ती कृपा या प्रसन्नता समझना संभव है, इसलिए वह अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली अपनाई गई है। ‘बालक’, ‘बढ़ता गया’ और ‘लोगों’ सामान्य पाठकों के लिए सहज हैं। मूल की संभावित विशेषणात्मक और प्रगतिशील व्याख्याओं के बीच तनाव को मुख्य पाठ और पादटिप्पणी द्वारा सुरक्षित रखा गया है।
