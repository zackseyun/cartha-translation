source:
  edition: WLC
  text: מֵקִ֨ים מֵ/עָפָ֜ר דָּ֗ל מֵֽ/אַשְׁפֹּת֙ יָרִ֣ים אֶבְי֔וֹן לְ/הוֹשִׁיב֙ עִם נְדִיבִ֔ים וְ/כִסֵּ֥א כָב֖וֹד יַנְחִלֵ֑/ם כִּ֤י לַֽ/יהוָה֙ מְצֻ֣קֵי אֶ֔רֶץ וַ/יָּ֥שֶׁת עֲלֵי/הֶ֖ם תֵּבֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/008.yaml
  text: He raises the poor from the dust[a]; he lifts the needy from the ash heap, to seat them with nobles and make them inherit a seat of honor. For the pillars of the earth belong to Yahweh[b], and on them he has set the world.
translation:
  language: hi
  text: 'वह दीन को धूल में से उठाता है,

    और दरिद्र को कूड़े के ढेर से ऊपर उठाता है,

    ताकि उन्हें कुलीनों के साथ बैठाए

    और सम्मान का आसन[a] उन्हें विरासत में दे।

    क्योंकि पृथ्वी के खंभे[b] यहोवा के हैं,

    और उन्हीं पर उसने जगत को स्थापित किया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सम्मान का सिंहासन।”
    reason: כִסֵּא का अर्थ ‘आसन’ या ‘सिंहासन’ हो सकता है; כָבוֹד यहाँ सम्मान/महिमा का भाव रखता है।
  - marker: b
    text: या “पृथ्वी की नींवें।”
    reason: מְצֻקֵי पृथ्वी को थामने वाले खंभों, आधारों या नींवों का बोध करा सकता है।
lexical_decisions:
- source_word: מֵקִים מֵעָפָר דָּל
  choice: दीन को धूल में से उठाता है
  rationale: कारक क्रिया और सामाजिक हीनता की ठोस काव्यात्मक छवि दोनों सुरक्षित रहती हैं। דָּל के लिए ‘दीन’ आर्थिक अभाव के साथ दुर्बल और निम्न अवस्था का भाव भी व्यक्त करता है।
- source_word: מֵאַשְׁפֹּת יָרִים אֶבְיוֹן
  choice: दरिद्र को राख के ढेर में से ऊपर उठाता है
  rationale: אֶבְיוֹן को अलग हिंदी शब्द ‘दरिद्र’ से व्यक्त किया गया है, और ‘राख का ढेर’ अपमान तथा तिरस्कार की मूर्त छवि बनाए रखता है।
- source_word: לְהוֹשִׁיב עִם נְדִיבִים
  choice: ताकि उन्हें कुलीनों के साथ बैठाए
  rationale: उद्देश्यसूचक infinitive को ‘ताकि’ से स्पष्ट किया गया है। נְדִיבִים यहाँ उच्च सामाजिक पद वाले कुलीन लोगों को दर्शाता है।
- source_word: וְכִסֵּא כָבוֹד יַנְחִלֵם
  choice: और उन्हें सम्मान के आसन का अधिकारी बनाए
  rationale: יַנְחִלֵם के उत्तराधिकार अथवा अधिकार दिलाने वाले कारक भाव को स्वाभाविक हिंदी में व्यक्त करता है। כִסֵּא का व्यापक अर्थ ‘आसन’ मुख्य पाठ में रखा गया है; ‘सिंहासन’ संभव विकल्प है।
- source_word: מְצֻקֵי אֶרֶץ
  choice: पृथ्वी के खंभे
  rationale: पृथ्वी को थामने वाले आधारों की प्राचीन काव्यात्मक छवि को व्याख्यात्मक रूप से सपाट किए बिना सुरक्षित रखता है।
- source_word: לַיהוָה
  choice: यहोवा के
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम יהוה को हिंदी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיָּשֶׁת עֲלֵיהֶם תֵּבֵל
  choice: और उन्हीं पर उसने जगत को स्थापित किया है
  rationale: עֲלֵיהֶם के संकेत को ‘उन्हीं पर’ स्पष्ट करता है और תֵּבֵל के व्यवस्थित, आबाद संसार के काव्यात्मक अर्थ के लिए ‘जगत’ प्रयुक्त है।
theological_decisions:
- issue: מְצֻקֵי אֶרֶץ की ब्रह्मांड-विषयक छवि
  choice: मुख्य पाठ में ‘पृथ्वी के खंभे’
  alternative: ‘पृथ्वी की नींवें’
  rationale: यह पद परमेश्वर की सार्वभौमिक प्रभुता को प्राचीन काव्यात्मक जगत-रचना की भाषा में व्यक्त करता है। अनुवाद उस छवि को वैज्ञानिक कथन में बदलता या मिटाता नहीं है।
- issue: כִסֵּא כָבוֹד में पद-प्रतिष्ठा का स्वरूप
  choice: ‘सम्मान का आसन’
  alternative: ‘महिमा का सिंहासन’
  rationale: मूल पद आसन और सिंहासन दोनों अर्थ दे सकता है। प्रसंग सामान्य रूप से दीन-दरिद्रों के उत्कर्ष की बात करता है, इसलिए मुख्य पाठ राजपद को अनावश्यक रूप से निश्चित नहीं करता; अधिक शाब्दिक विकल्प पादटिप्पणी में है।
- issue: ईश्वरीय नाम יהוה
  choice: ‘यहोवा’
  alternative: ‘याहवे’ अथवा ‘प्रभु’
  rationale: मूल में व्यक्तिगत नाम उपस्थित है; इसलिए उसे उपाधि में बदलने के बजाय हिंदी में पहचाने जाने योग्य नामरूप से रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण काव्यात्मक समानांतरता रखी गई है। ‘दीन/दरिद्र’, ‘कुलीन’, ‘आसन’ और ‘जगत’ सामान्य पाठक के लिए बोधगम्य रहते हुए गीतात्मक शैली बनाए रखते हैं। पंक्ति-विभाजन इब्रानी काव्य की अर्थ-समानांतरता को उभारता है।
