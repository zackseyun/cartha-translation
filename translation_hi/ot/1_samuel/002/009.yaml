base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/009.yaml
  text: He guards the feet of his faithful ones[a], but the wicked are silenced in darkness[c][b], for not by strength does a man prevail.
translation:
  language: hi
  text: वह अपने विश्वासयोग्य जनों के पाँवों की रक्षा करता है[a], पर दुष्ट अंधकार में मौन हो जाते हैं[b], क्योंकि मनुष्य बल से विजयी नहीं होता[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ-परम्परा में इसे एकवचन, ‘अपने विश्वासयोग्य जन के पाँवों’, भी पढ़ा जा सकता है; यहाँ काव्यात्मक समानांतरता और सम्भावित सामूहिक आशय के कारण बहुवचन लिया गया है।
    reason: textual_variant
  - marker: b
    text: या ‘स्तब्ध हो जाते हैं’; इब्रानी क्रिया मौन या निश्चल हो जाने का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: मूल इब्रानी में ‘मनुष्य’ के लिए पुल्लिंग एकवचन शब्द है, जिसका प्रयोग यहाँ सामान्य, प्रतिनिधिक अर्थ में हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רַגְלֵי
  choice: पाँवों
  rationale: मूल के ठोस बहुवचन बिम्ब ‘पाँव’ को बनाए रखता है; ‘कदमों’ की अपेक्षा अधिक प्रत्यक्ष है।
- source_word: חסיד/ו
  choice: अपने विश्वासयोग्य जनों के
  rationale: केतीव/क़ेरे परम्परा में वचन-संबंधी भिन्नता है। काव्यात्मक समानांतरता और सामूहिक आशय के कारण बहुवचन अर्थ अपनाया गया; ‘विश्वासयोग्य जन’ निष्ठा का भाव व्यक्त करता है।
- source_word: יִשְׁמֹר
  choice: रक्षा करता है
  rationale: क्रिया के पहरा देने, सुरक्षित रखने और संरक्षण करने के अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: וּרְשָׁעִים
  choice: पर दुष्ट
  rationale: संयोजक यहाँ विश्वासयोग्य जनों और दुष्टों के बीच विरोध दिखाता है, इसलिए ‘पर’ स्वाभाविक है।
- source_word: בַּחֹשֶׁךְ
  choice: अन्धकार में
  rationale: न्याय और असहायता के मूल काव्यात्मक बिम्ब को बनाए रखता है।
- source_word: יִדָּמּוּ
  choice: चुप करा दिए जाएँगे
  rationale: निफ़अल रूप का निष्क्रिय और न्याय-संबंधी बल व्यक्त करता है; क्रिया का अर्थ मौन या निश्चल कर दिया जाना हो सकता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: पिछले कथन का आधार प्रस्तुत करने वाले कारणवाचक संबंध को स्पष्ट करता है।
- source_word: לֹא בְכֹחַ
  choice: अपने बल से ... नहीं
  rationale: כֹּחַ के ‘बल/सामर्थ्य’ अर्थ को स्वाभाविक हिन्दी वाक्य-विन्यास में रखता है; ‘अपने’ सन्दर्भगत भाव को स्पष्ट करता है कि मनुष्य की स्वयं की शक्ति सफलता का आधार नहीं।
- source_word: יִגְבַּר
  choice: प्रबल ... होता
  rationale: सिर्फ बलवान होने के बजाय विजय पाने या प्रभावी सिद्ध होने का भाव संक्षेप में व्यक्त करता है।
- source_word: אִישׁ
  choice: मनुष्य
  rationale: यहाँ पुल्लिंग एकवचन प्रतिनिधिक और सामान्य अर्थ में है; हिन्दी ‘मनुष्य’ स्रोत के मानवीय सामान्यीकरण को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: חסיד/ו की संख्या और अर्थ
  choice: 'सामूहिक/बहुवचन: ‘अपने विश्वासयोग्य जनों’'
  alternative: 'एकवचन: ‘अपने विश्वासयोग्य जन के’'
  rationale: व्यंजनात्मक पाठ को एकवचन पढ़ा जा सकता है, पर पाठ-परम्परा, प्राचीन साक्ष्य और ‘दुष्टों’ के साथ काव्यात्मक समानांतरता सामूहिक बहुवचन अर्थ का समर्थन करते हैं। अस्पष्टता पादटिप्पणी में सुरक्षित है।
- issue: אִישׁ का प्रतिनिधिक प्रयोग
  choice: ‘मनुष्य’—सामान्य, प्रतिनिधिक अर्थ
  alternative: ‘कोई पुरुष’ या ‘कोई व्यक्ति’
  rationale: मूल में पुल्लिंग एकवचन है, पर कथन सूक्तिपरक रूप से सामान्य मानव की बात करता है। ‘मनुष्य’ हिन्दी में इस प्रतिनिधिक बल को बिना आशय सीमित किए व्यक्त करता है।
- issue: יִדָּמּוּ में न्याय का स्वरूप
  choice: ‘चुप करा दिए जाएँगे’
  alternative: ‘निश्चल कर दिए जाएँगे’ या ‘मिट जाएँगे’
  rationale: क्रिया मौन अथवा निश्चल किए जाने का अर्थ दे सकती है। मुख्य पाठ में मौन किए जाने का अर्थ चुना गया है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है ताकि न्याय की प्रकृति को अनावश्यक रूप से निश्चित न किया जाए।
