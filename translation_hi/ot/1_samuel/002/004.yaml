base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/004.yaml
  text: The bows of the mighty are shattered[b][a], but those who stumble are girded with strength.
translation:
  language: hi
  text: 'वीरों के धनुष टूट गए हैं,[a]

    पर लड़खड़ाने वालों ने सामर्थ्य से कमर कस ली है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चकनाचूर हो गए हैं।’
    reason: lexical_alternative
  - marker: b
    text: या ‘वे सामर्थ्य से कमर कसे हुए हैं।’
    reason: grammatical_alternative
lexical_decisions:
- source_word: קֶשֶׁת
  choice: धनुष
  rationale: रूप एकवचन है, पर ‘वीरों के’ और बहुवचन विधेय के साथ सामूहिक अर्थ देता है; हिन्दी में ‘धनुष’ का रूप एकवचन और बहुवचन दोनों में समान रहता है।
- source_word: גִּבֹּרִים
  choice: वीरों
  rationale: यह शब्द शक्तिशाली अथवा पराक्रमी व्यक्तियों, प्रायः योद्धाओं, को दर्शाता है। ‘वीरों’ व्यापक काव्यात्मक और युद्ध-संबंधी भाव बनाए रखता है।
- source_word: חַתִּים
  choice: टूट गए हैं
  rationale: धनुष के संदर्भ में इसका अर्थ भयभीत होने के बजाय टूट जाना है। यह सीधा और स्वाभाविक हिन्दी प्रयोग है।
- source_word: נִכְשָׁלִים
  choice: जो लड़खड़ाते थे
  rationale: कृदन्त उन लोगों को दर्शाता है जो ठोकर खाते या डगमगाते हैं। ‘लड़खड़ाते’ मूल शारीरिक रूपक को बनाए रखता है।
- source_word: אָזְרוּ
  choice: उन्होंने ... कमरबंद बाँध लिया है
  rationale: हिब्रू क्रिया सक्रिय बहुवचन है और कमर कसने या बाँधने का बिंब देती है। इस सक्रिय रूप को हिन्दी में स्पष्ट रखा गया है; मुहावरे के ठोस बिंब को दिखाने के लिए ‘कमरबंद’ जोड़ा गया है।
- source_word: חָיִל
  choice: सामर्थ्य
  rationale: यहाँ शब्द शक्ति, पराक्रम या सामरिक बल का अर्थ दे सकता है। ‘सामर्थ्य’ व्यापक अर्थ रखता है और केवल युद्ध-कौशल तक सीमित नहीं करता।
theological_decisions:
- issue: हन्ना के गीत में उलटाव का काव्यात्मक चित्रण
  choice: ‘धनुष,’ ‘लड़खड़ाते’ और ‘सामर्थ्य का कमरबंद बाँधना’ जैसे ठोस रूपक बनाए रखे गए हैं।
  alternative: वीरों के हथियार टूट गए हैं, पर निर्बल शक्तिशाली हो गए हैं।
  rationale: मूल पद प्रभु द्वारा मानवीय शक्ति और दुर्बलता के उलटाव को युद्ध और शरीर से जुड़े चित्रों द्वारा व्यक्त करता है। रूपकों को बनाए रखने से काव्यात्मक और धर्मवैचारिक तनाव सुरक्षित रहता है, बिना व्याख्या जोड़े।
- issue: אָזְרוּ का वाच्य
  choice: 'सक्रिय/आत्मसंबंधी भाव: ‘उन्होंने ... बाँध लिया है।’'
  alternative: 'कर्मवाच्य भाव: ‘उन्हें सामर्थ्य से कमरबंद बाँधा गया है’ अथवा ‘वे सामर्थ्य से कमर कसे हुए हैं।’'
  rationale: मसोरेटिक पाठ में क्रिया सक्रिय पूर्ण रूप है; इसलिए सक्रिय हिन्दी को मुख्य पाठ में रखा गया है। काव्य-संदर्भ में कर्मवाच्य अर्थ समझे जाने की संभावना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज हिन्दी। समानांतर काव्य-पंक्तियाँ और मूल के ठोस युद्धात्मक तथा शारीरिक बिंब सुरक्षित रखे गए हैं।
