lexical_decisions:
- source_word: וּ/בְנֵי עֵלִי
  choice: एली के बेटे
  rationale: בְנֵי का स्वाभाविक हिन्दी रूप ‘बेटे’ है। आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में आवश्यक नहीं और यहाँ कोई स्पष्ट कालसूचक ‘अब’ नहीं है।
- source_word: בְּנֵי בְלִיָּעַל
  choice: निकम्मे लोग
  rationale: यह इब्रानी मुहावरा नैतिक रूप से अधम और भ्रष्ट लोगों को दर्शाता है। ‘निकम्मे लोग’ उसका सहज, आधुनिक हिन्दी रूप है और ‘बलीआल’ को व्यक्तिनाम मानने वाली बाद की व्याख्या को पाठ में नहीं लाता।
- source_word: לֹא יָדְעוּ
  choice: नहीं जानते थे
  rationale: יָדַע का मूल अर्थ ‘जानना’ है, यद्यपि यहाँ उसमें स्वीकार करने और आदर रखने का संबंधपरक भाव भी हो सकता है। शाब्दिक रूप उस अर्थगत और धर्मवैचारिक तनाव को सुरक्षित रखता है।
- source_word: אֶת יְהוָה
  choice: यहोवा को
  rationale: אֶת कर्मसूचक चिह्न है, जिसका हिन्दी में ‘को’ से स्वाभाविक संकेत होता है। परमेश्वर के निज नाम יהוה को ‘यहोवा’ लिखा गया है।
theological_decisions:
- issue: בְלִיָּעַל को सामान्य संज्ञात्मक मुहावरा माना जाए या ‘बलीआल’ नाम
  choice: सामान्य मुहावरे के रूप में ‘निकम्मे लोग’
  alternative: ‘बलीआल के बेटे’ या शाब्दिक ‘निकम्मेपन के बेटे’
  rationale: इस प्रसंग में पदबंध नैतिक चरित्र बताता है; किसी नामित दुष्ट आत्मिक सत्ता का स्पष्ट उल्लेख नहीं करता।
- issue: ‘यहोवा को नहीं जानते थे’ का संबंधपरक अर्थ स्पष्ट करके लिखा जाए या नहीं
  choice: मुख्य पाठ में ‘यहोवा को नहीं जानते थे’ बनाए रखना
  alternative: ‘यहोवा को नहीं मानते थे’ या ‘यहोवा का आदर नहीं करते थे’
  rationale: ‘जानना’ मूल क्रिया का सीधा अर्थ है और साथ ही वाचा-संबंधी पहचान, स्वीकृति तथा आदर का संकेत दे सकता है। अधिक व्याख्यात्मक रूप अर्थ को अनावश्यक रूप से सीमित करेगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘निकम्मे लोग’ मुहावरे का बोधगम्य रूप है, जबकि पादटिप्पणी उसका शाब्दिक और पारंपरिक विकल्प देती है। ‘जानते थे’ को जानबूझकर बनाए रखा गया है ताकि मूल की संबंधपरक अस्पष्टता सुरक्षित रहे।
