source:
  edition: WLC
  text: אִם יֶחֱטָ֨א אִ֤ישׁ לְ/אִישׁ֙ וּ/פִֽלְל֣/וֹ אֱלֹהִ֔ים וְ/אִ֤ם לַֽ/יהוָה֙ יֶֽחֱטָא אִ֔ישׁ מִ֖י יִתְפַּלֶּל ל֑/וֹ וְ/לֹ֤א יִשְׁמְעוּ֙ לְ/ק֣וֹל אֲבִי/הֶ֔ם כִּֽי חָפֵ֥ץ יְהוָ֖ה לַ/הֲמִיתָֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/025.yaml
  text: If a man sins against another man[a], God will mediate for him; but if a man sins against Yahweh, who will pray for him? But they would not listen to the voice of their father[b], because Yahweh desired to put them to death.
translation:
  language: hi
  text: यदि कोई पुरुष दूसरे पुरुष के विरुद्ध पाप करे, तो परमेश्वर[a] उसका न्याय करेगा; पर यदि कोई पुरुष यहोवा के विरुद्ध पाप करे, तो उसके लिए कौन प्रार्थना[b] करेगा? पर उन्होंने अपने पिता की बात नहीं मानी, क्योंकि यहोवा उन्हें मार डालना चाहता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “न्यायाधीश उसका न्याय करेंगे।” इब्रानी शब्द אֱלֹהִים कभी-कभी मानव न्यायाधीशों के लिए भी प्रयुक्त होता है; यहाँ यहोवा के साथ विरोध के कारण मुख्य पाठ में “परमेश्वर” रखा गया है।
    reason: alternative_reading
  - marker: b
    text: या, “उसके लिए कौन बिनती करेगा?” इब्रानी क्रिया में प्रार्थना करने या किसी के लिए बिनती करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶחֱטָא
  choice: पाप करे
  rationale: חטא का नैतिक और धर्मवैज्ञानिक बल बनाए रखने के लिए ‘पाप करे’ चुना गया; ‘गलती करे’ अर्थ को अनावश्यक रूप से हल्का कर देता।
- source_word: אִישׁ לְאִישׁ
  choice: कोई पुरुष किसी दूसरे पुरुष के विरुद्ध
  rationale: इब्रानी के पुल्लिंग एकवचन रूप और व्यक्ति-से-व्यक्ति अपराध के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּפִלְלוֹ אֱלֹהִים
  choice: परमेश्वर उसके लिए मध्यस्थता करेगा
  rationale: פלל के पिएल रूप में यहाँ न्यायिक विवाद सुलझाने या मध्यस्थता करने का भाव है। ‘मध्यस्थता करेगा’ संबंधपरक और न्यायिक दोनों पहलुओं को रखता है; אֱלֹהִים के ‘न्यायी’ अर्थ की संभावना पादटिप्पणी में दी गई है।
- source_word: לַיהוָה
  choice: यहोवा के विरुद्ध
  rationale: पूर्वसर्ग अपराध के लक्ष्य को दिखाता है, और יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מִי יִתְפַּלֶּל לוֹ
  choice: उसके लिए कौन प्रार्थना करेगा?
  rationale: התפלל का सामान्य अर्थ ‘प्रार्थना करना’ है; प्रसंग में ‘बिनती/मध्यस्थता करना’ भी संभव है और उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְלֹא יִשְׁמְעוּ לְקוֹל אֲבִיהֶם
  choice: फिर भी उन्होंने अपने पिता की बात नहीं मानी
  rationale: इब्रानी मुहावरे ‘पिता की आवाज़ न सुनना’ का स्वाभाविक हिन्दी अर्थ आज्ञा या चेतावनी न मानना है; ‘बात नहीं मानी’ हठपूर्ण अस्वीकार को स्पष्ट करता है।
- source_word: כִּי חָפֵץ יְהוָה לַהֲמִיתָם
  choice: क्योंकि यहोवा उन्हें मार डालना चाहता था
  rationale: חפץ की इच्छा/चाह का प्रबल अर्थ और מות के हिफ़ील रूप की कारकता दोनों बनाए गए हैं; कथन की कठिन धर्मवैज्ञानिक तीव्रता को नरम नहीं किया गया।
theological_decisions:
- issue: पहले उपवाक्य में אֱלֹהִים का अर्थ
  choice: परमेश्वर
  alternative: न्यायी
  rationale: मनुष्य के विरुद्ध पाप और स्वयं यहोवा के विरुद्ध पाप के बीच विरोध ‘परमेश्वर’ को मुख्य पाठ में उपयुक्त बनाता है। फिर भी אֱלֹהִים मानव न्यायियों को भी सूचित कर सकता है, इसलिए उस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- issue: כִּי חָפֵץ יְהוָה לַהֲמִיתָם में ईश्वरीय इच्छा
  choice: यहोवा उन्हें मार डालना चाहता था
  alternative: यहोवा ने उन्हें मार डालने का निश्चय कर लिया था
  rationale: मुख्य पाठ חפץ के इच्छा करने वाले अर्थ को सीधे रखता है और ईश्वरीय प्रभुता तथा पुत्रों की उत्तरदायित्वपूर्ण अवज्ञा के बीच तनाव को हल नहीं करता। ‘निश्चय कर लिया था’ संभव व्याख्या है, पर मूल क्रिया की तुलना में अधिक व्याख्यात्मक है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘पुरुष’, ‘पाप’, ‘मध्यस्थता’ और ‘यहोवा’ जैसे शब्द मूल पाठ की औपचारिक तथा धर्मवैज्ञानिक विशेषताओं को बनाए रखते हैं; कठिन अंतिम कथन को व्याख्यात्मक रूप से नरम नहीं किया गया।
