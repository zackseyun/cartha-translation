  yaml_path: translation/ot/1_samuel/002/017.yaml
  text: So the sin of the young men was very great before Yahweh[c][b][a], because the men despised Yahweh’s offering.
translation:
  language: hi
  text: इस प्रकार उन जवानों का पाप याहवे के सामने[a] बहुत बड़ा था, क्योंकि वे लोग याहवे की भेंट[b] का तिरस्कार किया करते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “याहवे के मुख के सामने”; यह याहवे की उपस्थिति में होने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द מִנְחָה का अर्थ सामान्य रूप से “भेंट” और कुछ प्रसंगों में विशेष रूप से “अन्नबलि” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חַטַּאת
  choice: पाप
  rationale: यहाँ संज्ञा एली के पुत्रों के दुष्कर्म को बताती है, पापबलि को नहीं; इसलिए सामान्य और स्वाभाविक अर्थ ‘पाप’ उपयुक्त है।
- source_word: הַנְּעָרִים
  choice: उन जवानों
  rationale: נַעַר का अर्थ लड़का, जवान या सेवक हो सकता है। प्रसंग में एली के वयस्क पुत्र पुरोहितीय सेवा कर रहे हैं, इसलिए ‘जवानों’ से आयु-संबंधी अर्थ बना रहता है और उन्हें बालक नहीं समझा जाता। ‘उन’ पिछले प्रसंग से उनके संदर्भ को स्वाभाविक बनाता है।
- source_word: גְּדוֹלָה מְאֹד
  choice: बहुत बड़ा
  rationale: यह सीधा तीव्रीकरण है; ‘बहुत बड़ा’ हिब्रू के जोर को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֶת־פְּנֵי יְהוָה
  choice: याहवे के सामने
  rationale: शाब्दिक रूप से इसमें याहवे के ‘मुख’ का उल्लेख है, पर यह उनकी उपस्थिति में होने का मुहावरा है। ‘के सामने’ मुहावरे का अर्थ और न्याय-संबंधी गंभीरता दोनों रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चतुराक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ सबसे स्पष्ट संबंधसूचक है।
- source_word: נִאֲצוּ
  choice: तिरस्कार करते थे
  rationale: क्रिया अवमानना या घृणापूर्ण तिरस्कार व्यक्त करती है। प्रसंग में चल रहे आचरण के लिए हिन्दी का अपूर्ण भूतकाल स्वाभाविक है।
- source_word: הָאֲנָשִׁים
  choice: वे लोग
  rationale: मूल में सामान्य बहुवचन ‘पुरुष/लोग’ है। यहाँ यह उन्हीं अपराधी जवानों की ओर लौटता है; ‘वे लोग’ इस पुनरुल्लेख को स्वाभाविक हिन्दी में रखता है और अनावश्यक रूप से नया समूह प्रस्तुत नहीं करता।
- source_word: מִנְחַת יְהוָה
  choice: याहवे की भेंट
  rationale: מִנְחָה सामान्यतः भेंट और कुछ प्रसंगों में विशेषतः अन्नबलि हो सकती है। वर्तमान बलिदान-संबंधी कथा में व्यापक ‘भेंट’ अर्थ को जरूरत से अधिक सीमित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित करता है।
- issue: אֶת־פְּנֵי יְהוָה का संबंध
  choice: याहवे के सामने
  alternative: याहवे के विरुद्ध
  rationale: वाक्यांश का शाब्दिक आधार ‘याहवे के मुख/उपस्थिति के सामने’ है। अपराध निस्संदेह याहवे के विरुद्ध है, पर ‘विरुद्ध’ चुनने से मूल की उपस्थिति-संबंधी भाषा व्याख्यात्मक रूप से संकुचित हो जाती।
- issue: מִנְחָה की बलिदान-संबंधी विशिष्टता
  choice: भेंट
  alternative: अन्नबलि
  rationale: शब्द कभी विशिष्ट अन्नबलि को दर्शाता है, किंतु इस कथा में बलिदानी चढ़ावे व्यापक रूप से विचाराधीन हैं। ‘भेंट’ मूल की अर्थ-सीमा को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सहज पर गरिमापूर्ण शैली। ‘जवानों’, ‘पाप’, ‘भेंट’ और ‘तिरस्कार’ सामान्य पाठक के लिए स्पष्ट हैं। वाक्य हिब्रू की कारणात्मक संरचना और जोर को बनाए रखता है; अपूर्ण भूतकाल ‘करते थे’ प्रसंग में उनके लगातार आचरण को स्वाभाविक रूप से व्यक्त करता है।
