base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/036.yaml
  text: And everyone left in your house will come to bow down to him for a piece of silver and a loaf of bread[a], and will say, ‘Please attach me to one of the priestly offices[b], so that I may eat a morsel of bread.’
translation:
  language: hi
  text: और तुम्हारे घराने में जो कोई बचा रहेगा, वह चाँदी के एक छोटे सिक्के[a] और एक रोटी के लिए उसके सामने झुकने आएगा और कहेगा, ‘कृपा करके मुझे याजकीय सेवाओं में से किसी एक में लगा दीजिए[b], ताकि मैं रोटी का एक टुकड़ा खा सकूँ।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चाँदी के एक छोटे टुकड़े’; इब्रानी में चाँदी की एक छोटी मौद्रिक इकाई का नाम है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मुझे याजकीय दायित्वों में से किसी एक में लगा दीजिए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנּוֹתָר
  choice: जो कोई बचा रहेगा
  rationale: यह कृदंत न्याय और हानि के बाद शेष बचे व्यक्ति को दर्शाता है; यह अनुवाद उसी संदर्भगत भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: בְּבֵיתְךָ
  choice: तुम्हारे घराने में
  rationale: यहाँ ‘घर’ भवन नहीं, एली के परिवार और वंश को सूचित करता है; ‘घराना’ आधुनिक हिन्दी में उस वंशगत अर्थ को स्पष्ट करता है।
- source_word: לְהִשְׁתַּחֲוֺת לוֹ
  choice: उसके सामने झुकने
  rationale: क्रिया दीनता और विनती में शारीरिक रूप से झुकने का भाव रखती है; यह विकल्प सामाजिक अधीनता को भी बनाए रखता है।
- source_word: לַאֲגֹרַת כֶּסֶף
  choice: चाँदी के एक छोटे टुकड़े
  rationale: अगोरा चाँदी की एक छोटी मौद्रिक इकाई थी; तकनीकी नाम थोपे बिना उसका छोटा मूल्य स्पष्ट किया गया है।
- source_word: כִכַּר לָחֶם
  choice: एक रोटी
  rationale: यहाँ शब्द रोटी की एक गोल लोई अथवा पूरी रोटी को सूचित करता है; ‘एक रोटी’ सहज और अर्थानुकूल हिन्दी है।
- source_word: סְפָחֵנִי
  choice: मुझे ... से जोड़ दीजिए
  rationale: सפח का मूल भाव किसी समूह या कार्य से जोड़ने अथवा संलग्न करने का है; यह अनुवाद नियुक्ति का भाव आरोपित किए बिना मूल बिंब बचाता है।
- source_word: נָא
  choice: कृपा करके
  rationale: यह विनयपूर्ण आग्रह का सूचक है; ‘कृपा करके’ इस दीन याचना को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַחַת הַכְּהֻנּוֹת
  choice: याजकीय सेवाओं में से किसी एक
  rationale: बहुवचन यहाँ अलग-अलग याजकपदों के बजाय याजकीय कार्यों, सेवाओं या दायित्वों का संकेत दे सकता है; ‘सेवाओं’ से वह अर्थ स्वाभाविक रहता है।
- source_word: לֶאֱכֹל פַּת לָחֶם
  choice: ताकि मैं रोटी का एक टुकड़ा खा सकूँ
  rationale: פַּת रोटी के छोटे टुकड़े या कौर को दर्शाता है और याचक की दयनीय आवश्यकता को बनाए रखता है।
theological_decisions:
- issue: एली के घराने के लोग किसके सामने झुकेंगे
  choice: एकवचन सर्वनाम को अनिर्दिष्ट रखते हुए ‘उसके सामने’
  alternative: भावी प्रधान याजक या उस समय याजकीय अधिकार रखने वाले व्यक्ति की पहचान स्पष्ट करना
  rationale: इब्रानी पाठ केवल एकवचन ‘उसके’ कहता है। न्यायवचन में सत्ता-पलट स्पष्ट है, पर व्यक्ति की पहचान स्पष्ट नहीं; इसलिए अनुवाद उसे अनावश्यक रूप से निश्चित नहीं करता।
- issue: אַחַת הַכְּהֻנּוֹת का संस्थागत अर्थ
  choice: याजकीय सेवाओं में से किसी एक
  alternative: याजकीय पदों में से किसी एक
  rationale: मूल बहुवचन याजकीय कार्य, दायित्व या पद—इनमें कुछ अर्थगत खुलापन रखता है। मुख्य पाठ में ‘सेवाओं’ को चुना गया और वैकल्पिक ‘दायित्वों’ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। ‘घराना’ वंशगत अर्थ स्पष्ट करता है, ‘याजकीय सेवा’ सामान्य पाठक के लिए बोधगम्य है, और विनती के वाक्य में आदरसूचक बहुवचन एली के वंशज की दीन याचना को स्वाभाविक हिन्दी में व्यक्त करता है।
