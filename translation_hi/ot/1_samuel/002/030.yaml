language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לָ/כֵ֗ן נְאֻם יְהוָה֮ אֱלֹהֵ֣י יִשְׂרָאֵל֒ אָמ֣וֹר אָמַ֔רְתִּי בֵּֽיתְ/ךָ֙ וּ/בֵ֣ית אָבִ֔י/ךָ יִתְהַלְּכ֥וּ לְ/פָנַ֖/י עַד עוֹלָ֑ם וְ/עַתָּ֤ה נְאֻם יְהוָה֙ חָלִ֣ילָ/ה לִּ֔/י כִּֽי מְכַבְּדַ֥/י אֲכַבֵּ֖ד וּ/בֹזַ֥/י יֵקָֽלּוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/030.yaml
  text: 'Therefore[a], declares Yahweh, the God of Israel: I indeed said that your house and your father’s house would walk before me forever. But now, declares Yahweh: far be it from me! For those who honor me I will honor, but those who despise me will be lightly esteemed.'
translation:
  language: hi
  text: 'इसलिए इस्राएल के परमेश्वर यहोवा की यह घोषणा है: “मैंने निश्चय कहा था कि तुम्हारा घराना और तुम्हारे पिता का घराना सदा मेरे सामने चलते रहेंगे। पर अब यहोवा की यह घोषणा है: ऐसा मुझसे कदापि न हो! क्योंकि जो मेरा आदर करते हैं, उनका मैं आदर करूँगा; पर जो मुझे तुच्छ जानते हैं, वे तुच्छ समझे जाएँगे।[a]”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनका अनादर होगा” अथवा “उन्हें नगण्य समझा जाएगा।” इब्रानी क्रिया का भाव हल्का, छोटा या कम महत्त्व का हो जाने अथवा ठहराए जाने का है; यह “मैं आदर करूँगा” के विपरीत है।
    reason: अंतिम इब्रानी क्रिया के अर्थ-क्षेत्र और ‘आदर’ के साथ उसके विरोध को स्पष्ट करना।
lexical_decisions:
- source_word: לָכֵן
  choice: इसलिए
  rationale: यह पद पिछले आरोप के आधार पर निकले ईश्वरीय न्याय-निष्कर्ष का परिचय देता है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह घोषणा है
  rationale: भविष्यद्वाणी-संबंधी सूत्र की गंभीरता और स्वाभाविक आधुनिक हिन्दी दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को उपाधि में बदलने के बजाय उसका प्रचलित हिन्दी रूप रखा गया है।
- source_word: אָמֹר אָמַרְתִּי
  choice: मैंने निश्चय कहा था
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute के बलाघात को स्पष्ट करता है।
- source_word: בֵּיתְךָ וּבֵית אָבִיךָ
  choice: तुम्हारा घराना और तुम्हारे पिता का घराना
  rationale: यहाँ ‘घर’ का आशय परिवार अथवा वंश से है; ‘घराना’ आधुनिक पाठक के लिए इस अर्थ को स्वाभाविक रूप से व्यक्त करता है और पुनरावृत्ति भी बचाता है।
- source_word: יִתְהַלְּכוּ לְפָנַי
  choice: मेरे सामने चलते रहेंगे
  rationale: इब्रानी मुहावरे और उसमें निहित निरंतर आचरण अथवा सेवा की व्यापकता को सुरक्षित रखता है; इसे केवल याजकीय सेवा तक सीमित नहीं करता।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: दीर्घकालिक वाचागत भाषा का सहज हिन्दी रूप है और पद में उपस्थित बाद की उलट घोषणा के तनाव को बनाए रखता है।
- source_word: חָלִילָה לִּי
  choice: ऐसा मुझसे कदापि न हो!
  rationale: प्रबल निषेध-सूत्र को गरिमापूर्ण और स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: מְכַבְּדַי אֲכַבֵּד
  choice: जो मेरा आदर करते हैं, उनका मैं आदर करूँगा
  rationale: כבד की जानबूझकर की गई पुनरावृत्ति को ‘आदर ... आदर’ से सुरक्षित रखता है।
- source_word: וּבֹזַי יֵקָלּוּ
  choice: जो मुझे तुच्छ जानते हैं, वे तुच्छ समझे जाएँगे
  rationale: בזה के तिरस्कार और קלל के ‘हल्का अथवा कम महत्त्व का ठहरना’ वाले विरोधी शब्द-चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: एली के घराने से की गई पिछली प्रतिज्ञा का स्वरूप
  choice: पिछली बात को वास्तविक ईश्वरीय घोषणा के रूप में प्रस्तुत किया गया है, जिसके बाद वर्तमान में उसका स्पष्ट प्रत्याख्यान आता है।
  alternative: ‘सदा’ को आरम्भ से ही अतिशयोक्ति मानना, या इस उलटाव को केवल विशेषाधिकार की सीमित कटौती बनाना।
  rationale: मूल पाठ स्वयं ‘मैंने निश्चय कहा था’ और ‘पर अब ... ऐसा मुझसे कदापि न हो’ के बीच तीखा तनाव रखता है। अनुवाद किसी बाहरी धर्मवैज्ञानिक समाधान से इसे कम नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली। ‘घराना’ वंशगत अर्थ स्पष्ट करता है, जबकि ‘मेरे सामने चलते रहेंगे’ मूल मुहावरे की व्यापकता और वाचागत प्रतिध्वनि बचाता है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में संबंधित वाक्य के अंत में दिया गया है।
