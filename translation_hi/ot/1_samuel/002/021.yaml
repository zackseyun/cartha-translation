base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/002/021.yaml
  text: For Yahweh visited Hannah[a], and she conceived and bore three sons and two daughters[b]. And the boy Samuel grew before Yahweh.
translation:
  language: hi
  text: क्योंकि यहोवा ने हन्ना की सुधि ली[a]; वह गर्भवती हुई और उसने तीन पुत्रों और दो पुत्रियों को जन्म दिया। और बालक शमूएल यहोवा के साथ[b] बढ़ता गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हन्ना पर कृपापूर्वक ध्यान दिया।” यहाँ इब्रानी क्रिया किसी के पक्ष में ध्यान देकर हस्तक्षेप करने का भाव रख सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “यहोवा के साथ।” इस संदर्भ में इसका आशय संभवतः यह है कि शमूएल पवित्रस्थान में यहोवा की उपस्थिति में बढ़ता गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले कथन का कारण या स्पष्टीकरण प्रस्तुत करता है; इसलिए कारणसूचक संबंध स्पष्ट रखा गया है।
- source_word: פָקַד
  choice: सुधि ली
  rationale: यहाँ क्रिया हन्ना के पक्ष में यहोवा के कृपापूर्ण ध्यान और हस्तक्षेप को व्यक्त करती है; ‘सुधि ली’ इस भाव को स्वाभाविक हिन्दी में रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וַתַּהַר וַתֵּלֶד
  choice: वह गर्भवती हुई और उसने ... को जन्म दिया
  rationale: गर्भधारण और प्रसव, दोनों क्रमिक क्रियाओं को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में रखा गया है।
- source_word: שְׁלֹשָׁה בָנִים וּשְׁתֵּי בָנוֹת
  choice: तीन पुत्रों और दो पुत्रियों
  rationale: संख्या और पारिवारिक संबंधों का सीधा अनुवाद है।
- source_word: וַיִּגְדַּל הַנַּעַר שְׁמוּאֵל
  choice: बालक शमूएल ... बढ़ता गया
  rationale: वय और निरंतर विकास के कथात्मक भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: עִם יְהוָה
  choice: यहोवा के साथ
  rationale: मूल का शाब्दिक और जानबूझकर खुला संबंध सुरक्षित रखा गया है; संदर्भ में यह पवित्रस्थान में यहोवा की उपस्थिति में शमूएल के बढ़ने का संकेत दे सकता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम को नाम के रूप में ही रखा गया है, उपाधि में नहीं बदला गया।
- issue: עִם יְהוָה का अर्थ
  choice: यहोवा के साथ
  alternative: यहोवा के सामने / यहोवा की उपस्थिति में
  rationale: ‘के साथ’ मूल संबंधसूचक पद की वास्तविक अस्पष्टता और संबंधात्मक बल को सुरक्षित रखता है; पवित्रस्थान-संबंधी अर्थ को पाद-टिप्पणी में बताया गया है, मुख्य पाठ में निर्णायक रूप से आरोपित नहीं किया गया।
- issue: פקד में ईश्वरीय कार्य का स्वरूप
  choice: सुधि ली
  alternative: कृपा की / ध्यान दिया
  rationale: यह चयन परमेश्वर के अनुकूल हस्तक्षेप को व्यक्त करता है, पर क्रिया को केवल भावनात्मक चिंता या सामान्य आशीष तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘पुत्र-पुत्रियाँ’ और ‘बालक’ औपचारिक किंतु सामान्यतः बोधगम्य हैं। मूल की धार्मिक शब्दावली तथा עִם יְהוָה की अस्पष्टता को सुरक्षित रखा गया है।
