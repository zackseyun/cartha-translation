source:
  edition: WLC
  text: וְ/אִם לֹ֤א תִשְׁמְעוּ֙ בְּ/ק֣וֹל יְהוָ֔ה וּ/מְרִיתֶ֖ם אֶת פִּ֣י יְהוָ֑ה וְ/הָיְתָ֧ה יַד יְהוָ֛ה בָּ/כֶ֖ם וּ/בַ/אֲבֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/015.yaml
  text: But if you do not listen to the voice of Yahweh and rebel against the command of Yahweh[a], then the hand of Yahweh will be against you and against your fathers.
translation:
  language: hi
  text: पर यदि तुम याहवे की वाणी न सुनो और याहवे की आज्ञा के विरुद्ध विद्रोह करो, तो याहवे का हाथ तुम्हारे और तुम्हारे पूर्वजों[a] के विरुद्ध होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पाठ में शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है। कुछ प्राचीन अनुवादों और अनेक व्याख्याकारों में ‘तुम्हारे राजा’ पढ़ा जाता है, जो लोगों और उनके राजा—दोनों को दी गई शमूएल की चेतावनी के तत्काल संदर्भ से मेल खाता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पिछले पद की शर्त के विपरीत परिणाम प्रस्तुत करता है; ‘पर यदि’ संयोजक और विरोधात्मक दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לֹא תִשְׁמְעוּ בְּקוֹל יְהוָה
  choice: तुम याहवे की वाणी न सुनो
  rationale: שׁמע בְּקוֹל में आज्ञापालन के भाव के साथ सुनना निहित है। ‘वाणी न सुनो’ इब्रानी मुहावरे को बनाए रखते हुए हिन्दी में इस भाव को समझने योग्य रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य नाम की ध्वन्यात्मक पहचान बनाए रखने के लिए इसका लिप्यंतरण किया गया है।
- source_word: וּמְרִיתֶם
  choice: और … विद्रोह करो
  rationale: מרה साधारण अवज्ञा से अधिक, जानबूझकर विरोध या विद्रोह का बोध कराता है।
- source_word: אֶת פִּי יְהוָה
  choice: याहवे की आज्ञा के विरुद्ध
  rationale: शाब्दिक रूप से ‘याहवे के मुँह के विरुद्ध’ एक मुहावरा है, जिसका आशय उसकी कही हुई आज्ञा का विरोध करना है।
- source_word: וְהָיְתָה יַד יְהוָה
  choice: तो याहवे का हाथ … होगा
  rationale: ‘हाथ’ न्याय में सक्रिय सामर्थ्य का बाइबलीय रूपक है; ‘तो’ शर्त के परिणाम को हिन्दी में स्पष्ट करता है।
- source_word: בָּכֶם
  choice: तुम्हारे … विरुद्ध
  rationale: न्याय के संदर्भ में בְּ का विरोधात्मक अर्थ ‘विरुद्ध’ स्वाभाविक और सटीक है।
- source_word: וּבַאֲבֹתֵיכֶם
  choice: और तुम्हारे पूर्वजों के विरुद्ध
  rationale: मसोरेटिक पाठ में ‘तुम्हारे पिताओं’ है। आधुनिक हिन्दी में ‘पूर्वजों’ से वही वंशगत अर्थ अधिक स्वाभाविक रूप से व्यक्त होता है; पाठांतर को पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा
  rationale: मूल पाठ के विशिष्ट दिव्य नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी लिपि में उसके प्रचलित विद्वत्तापूर्ण उच्चारण के निकट रखा गया है।
- issue: अंतिम पदबंध וּבַאֲבֹתֵיכֶם
  choice: और तुम्हारे पूर्वजों के विरुद्ध
  alternative: और तुम्हारे राजा के विरुद्ध
  rationale: प्रदत्त WLC/मसोरेटिक पाठ ‘तुम्हारे पिताओं’ पढ़ता है, इसलिए मुख्य पाठ उसी का अनुवाद करता है। तत्काल संदर्भ से मेल खाने वाला ‘तुम्हारे राजा’ का प्राचीन पाठांतर पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गंभीर और सार्वजनिक पाठ के योग्य रखी गई है। ‘वाणी सुनना’ और ‘याहवे का हाथ’ जैसे मूल इब्रानी रूपक सुरक्षित हैं, जबकि अपारदर्शी ‘मुँह के विरुद्ध’ को अर्थानुसार ‘आज्ञा के विरुद्ध’ किया गया है।
