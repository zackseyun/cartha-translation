source:
  edition: WLC
  text: וְ/עַתָּ֗ה הִנֵּ֥ה הַ/מֶּ֛לֶךְ אֲשֶׁ֥ר בְּחַרְתֶּ֖ם אֲשֶׁ֣ר שְׁאֶלְתֶּ֑ם וְ/הִנֵּ֨ה נָתַ֧ן יְהוָ֛ה עֲלֵי/כֶ֖ם מֶֽלֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/013.yaml
  text: And now[a], here is the king whom you have chosen, whom you have asked for; and look, Yahweh has set a king over you.
translation:
  language: hi
  text: और अब, यह वह राजा है जिसे तुमने चुना था, जिसे तुमने माँगा था। देखो, याहवे ने तुम पर एक राजा नियुक्त किया है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप से, “याहवे ने तुम पर एक राजा दिया है।”
    reason: נתן का मूल अर्थ ‘देना’ है; मुख्य पाठ में राजा को लोगों पर अधिकार के पद पर नियुक्त करने का प्रसंगगत अर्थ व्यक्त किया गया है।
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक וְ और काल-सूचक עַתָּה दोनों को व्यक्त करता है तथा शमूएल के वर्तमान निष्कर्ष की ओर संक्रमण बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो, यह रहा
  rationale: पहला הִנֵּה सामने उपस्थित राजा की ओर श्रोताओं का ध्यान खींचता है; आधुनिक हिन्दी में यह स्वाभाविक और स्पष्ट है।
- source_word: אֲשֶׁר בְּחַרְתֶּם
  choice: जिसे तुमने चुना था
  rationale: בָּחַר का मूल अर्थ ‘चुनना’ है; पूर्ण क्रिया लोगों के पहले ही किए जा चुके चुनाव को बताती है।
- source_word: אֲשֶׁר שְׁאֶלְתֶּם
  choice: जिसे तुमने माँगा था
  rationale: इस प्रसंग में שׁאל किसी व्यक्ति या वस्तु की माँग करने का अर्थ देता है और 1 शमूएल 8 तथा 12 की कथात्मक भाषा को प्रतिध्वनित करता है।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: दूसरा ध्यानाकर्षक अव्यय परिणाम पर जोर देता है; ‘देखो’ आधुनिक, गरिमापूर्ण और सहज है।
- source_word: נָתַן
  choice: ठहरा दिया है
  rationale: नतन का शाब्दिक अर्थ ‘देना’ है, पर עַל और ‘राजा’ के साथ यह किसी को अधिकार के पद पर रखने का भाव देता है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित प्रत्यक्ष नाम-रूप ‘यहोवा’ चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे ऊपर
  rationale: राजा के संबंध में עַל लोगों पर शासन और अधिकार को सूचित करता है।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: दूसरी बार संज्ञा अनिश्चित रूप में है; हिन्दी में ‘एक राजा’ मूल संरचना और स्थापित शासक के भाव को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में ईश्वर का निजी नाम सीधे आया है। हिन्दी पाठकों के लिए सुविख्यात नाम-रूप ‘यहोवा’ अपनाया गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: लोगों के चुनाव और यहोवा द्वारा राजा ठहराए जाने का संबंध
  choice: दोनों कथनों को बिना सामंजस्यकारी व्याख्या के साथ रखा गया
  alternative: लोगों की माँग को ही परमेश्वर की नियुक्ति के समान बताना
  rationale: पद जानबूझकर लोगों के ‘चुनने/माँगने’ और यहोवा के ‘देने/ठहराने’ दोनों को रखता है; अनुवाद इस धर्मवैचारिक तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन बहुवचन ‘तुम’ मूल के द्वितीय पुरुष बहुवचन के अनुरूप है। भाषा सहज किंतु गरिमापूर्ण रखी गई है। दोनों הִנֵּה का ध्यानाकर्षक बल व्यक्त किया गया है, और विराम-चिह्नों से लम्बे इब्रानी वाक्य को हिन्दी में पठनीय बनाया गया है।
