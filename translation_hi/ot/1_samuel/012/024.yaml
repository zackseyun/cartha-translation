  text: אַ֣ךְ יְר֣אוּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֥ם אֹת֛/וֹ בֶּ/אֱמֶ֖ת בְּ/כָל לְבַבְ/כֶ֑ם כִּ֣י רְא֔וּ אֵ֥ת אֲשֶׁר הִגְדִּ֖ל עִמָּ/כֶֽם׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/024.yaml
  text: Only fear Yahweh and serve him faithfully with all your heart[a], for consider what great things he has done with you.
translation:
  language: hi
  text: केवल याहवे का भय मानो और अपने पूरे मन से निष्ठापूर्वक उसकी सेवा करो, क्योंकि ध्यान दो कि उसने तुम्हारे लिए[a] कितने महान काम किए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘तुम्हारे साथ।’
    reason: עִמָּכֶם के प्रत्यक्ष अर्थ को सुरक्षित रखते हुए मुख्य पाठ के संदर्भगत, सहज हिंदी अनुवाद ‘तुम्हारे लिए’ का विकल्प देना।
lexical_decisions:
- source_word: אַךְ
  choice: केवल
  rationale: यहाँ यह कण इस बात पर बल देता है कि लोगों की उचित प्रतिक्रिया क्या होनी चाहिए; ‘केवल’ उसके सीमित और आग्रहपूर्ण भाव को बनाए रखता है।
- source_word: יְרָאוּ
  choice: भय मानो
  rationale: वाचा के इस संदर्भ में क्रिया में श्रद्धा, विस्मय और आज्ञाकारी सम्मान सम्मिलित हैं। ‘भय मानो’ बाइबिलीय मुहावरे और उसके गंभीर भाव को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; इसलिए किसी उपाधि के स्थान पर उसका देवनागरी लिप्यंतरण किया गया है।
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: उसकी सेवा करो
  rationale: עבד का सीधा अर्थ ‘सेवा करना’ है। इसमें आराधना के साथ व्यापक वाचा-निष्ठा और आज्ञाकारिता भी समाहित रहती है।
- source_word: בֶּאֱמֶת
  choice: निष्ठापूर्वक
  rationale: אֱמֶת सत्य, विश्वसनीयता और निष्ठा का बोध करा सकता है। यहाँ यह याहवे की सेवा करने के ढंग को बताता है, इसलिए ‘निष्ठापूर्वक’ सहज हिंदी में संदर्भगत अर्थ व्यक्त करता है।
- source_word: בְּכָל לְבַבְכֶם
  choice: अपने पूरे मन से
  rationale: यह पूर्ण आंतरिक समर्पण का इब्रानी मुहावरा है; ‘अपने पूरे मन से’ आधुनिक हिंदी में स्वाभाविक और स्पष्ट है।
- source_word: רְאוּ
  choice: ध्यान दो
  rationale: शाब्दिक अर्थ ‘देखो’ है, पर यहाँ आज्ञार्थक रूप परमेश्वर के कार्यों को समझने और उन पर मन लगाने का आग्रह करता है।
- source_word: אֵת אֲשֶׁר הִגְדִּיל
  choice: कितने महान काम किए हैं
  rationale: גדל का हिफ़ील रूप इस प्रसंग में महान कार्य करने का मुहावरेदार अर्थ देता है। हिंदी बहुवचन अभिव्यक्ति परमेश्वर के महान कार्यों के सामूहिक आशय को सहज रूप से व्यक्त करती है।
- source_word: עִמָּכֶם
  choice: तुम्हारे लिए
  rationale: עם का मूल अर्थ ‘साथ’ है, पर इस मुहावरे में आशय इस्राएल के हित में किए गए कार्यों से है। मुख्य पाठ में सहज हिंदी रखी गई है और शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम יהוה है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: בֶּאֱמֶת में सत्य और निष्ठा का संबंध
  choice: निष्ठापूर्वक
  alternative: सच्चाई से
  rationale: सेवा के ढंग का वर्णन होने के कारण ‘निष्ठापूर्वक’ वाचा-संबंधी स्थिर भक्ति को स्पष्ट करता है, जबकि ‘सच्चाई से’ भी मूल शब्द के सत्य वाले पहलू को व्यक्त कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘भय मानो’ और ‘सेवा करो’ जैसे परिचित बाइबिलीय पदों को बनाए रखते हुए ‘निष्ठापूर्वक’ तथा ‘ध्यान दो’ से अर्थ स्पष्ट किया गया है।
