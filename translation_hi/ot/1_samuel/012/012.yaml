reference: 1 Samuel 12:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/תִּרְא֗וּ כִּֽי נָחָ֞שׁ מֶ֣לֶךְ בְּנֵֽי עַמּוֹן֮ בָּ֣א עֲלֵי/כֶם֒ וַ/תֹּ֣אמְרוּ לִ֔/י לֹ֕א כִּי מֶ֖לֶךְ יִמְלֹ֣ךְ עָלֵ֑י/נוּ וַ/יהוָ֥ה אֱלֹהֵי/כֶ֖ם מַלְכְּ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/012.yaml
  text: When you saw that Nahash king of the Ammonites was coming against you[a], you said to me, ‘No, but a king shall reign over us’—though Yahweh your God was your king.
translation:
  language: hi
  text: जब तुमने देखा कि अम्मोनियों का राजा नाहाश तुम पर चढ़ाई करने आ रहा है, तब तुमने मुझसे कहा, “नहीं, बल्कि हम पर एक राजा राज्य करेगा,” जबकि यहोवा, तुम्हारा परमेश्वर, तुम्हारा राजा था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहोवा, तुम्हारा परमेश्वर, तुम्हारा राजा है।” हिब्रू वाक्यांश में कोई स्पष्ट सहायक क्रिया नहीं है, इसलिए प्रसंग के अनुसार भूतकाल या वर्तमानकाल समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַתִּרְאוּ
  choice: जब तुमने देखा
  rationale: वाव-क्रमिक रूप यहाँ उस परिस्थिति को प्रस्तुत करता है जिसने इस्राएल की माँग को जन्म दिया; हिन्दी में कालगत संबंध स्वाभाविक रूप से व्यक्त होता है।
- source_word: נָחָשׁ מֶלֶךְ בְּנֵי עַמּוֹן
  choice: अम्मोनियों का राजा नाहाश
  rationale: जातीय-राष्ट्रीय अर्थ वाले रचना-संबंध का स्वाभाविक हिन्दी रूप; व्यक्ति-नाम का प्रचलित लिप्यंतरण रखा गया है।
- source_word: בָּא עֲלֵיכֶם
  choice: तुम पर चढ़ाई करने आ रहा है
  rationale: सैनिक प्रसंग में בוא + על शत्रुतापूर्वक आने या आक्रमण करने को दर्शाता है; यह रूप आसन्न आक्रमण को स्पष्ट और सहज हिन्दी में व्यक्त करता है।
- source_word: לֹא כִּי
  choice: नहीं
  rationale: यह पहले निहित विकल्प का दृढ़ निषेध करता है; आगे का बलवाचक “ही” माँग के प्रतिस्थापन और आग्रह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֶלֶךְ יִמְלֹךְ עָלֵינוּ
  choice: हम पर एक राजा ही राज्य करेगा
  rationale: एक ही धातु से बने संज्ञा-क्रिया संयोजन का बल “ही” द्वारा व्यक्त किया गया है, जिससे राजतंत्र के लिए लोगों का आग्रह बना रहता है।
- source_word: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם
  choice: जबकि तुम्हारा परमेश्वर यहोवा तुम्हारा राजा था
  rationale: हिब्रू का नामवाचक वाक्य स्पष्ट सहायक क्रिया के बिना है। मुख्य पाठ में भूतकाल कथात्मक प्रसंग के अनुकूल है; वर्तमानकाल की वास्तविक संभावना पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: וַיהוָה אֱלֹהֵיכֶם מַלְכְּכֶם में निहित सहायक क्रिया का काल
  choice: तुम्हारा राजा था
  alternative: तुम्हारा राजा है
  rationale: हिब्रू में काल बताने वाली कोई स्पष्ट सहायक क्रिया नहीं है। शमूएल पिछली घटना और उस समय इस्राएल की स्थिति का वर्णन कर रहा है, इसलिए मुख्य पाठ में भूतकाल उचित है; पर निरंतर ईश्वरीय राजत्व का वर्तमानकालीन पाठ भी व्याकरणतः संभव है और पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। “चढ़ाई करने” सैनिक आशय को सामान्य पाठक के लिए स्पष्ट करता है और “राजा ही” लोगों के आग्रह का बल बनाए रखता है। परमेश्वर के निज नाम יהוה के लिए “यहोवा” रखा गया है।
