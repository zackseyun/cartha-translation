reference: 1 Samuel 12:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כַּֽ/אֲשֶׁר בָּ֥א יַעֲקֹ֖ב מִצְרָ֑יִם וַ/יִּזְעֲק֤וּ אֲבֽוֹתֵי/כֶם֙ אֶל יְהוָ֔ה וַ/יִּשְׁלַ֨ח יְהוָ֜ה אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֗ן וַ/יּוֹצִ֤יאוּ אֶת אֲבֹֽתֵי/כֶם֙ מִ/מִּצְרַ֔יִם וַ/יֹּשִׁב֖וּ/ם בַּ/מָּק֥וֹם הַ/זֶּֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/008.yaml
  text: When Jacob came into Egypt[a], your fathers cried out to Yahweh, and Yahweh sent Moses and Aaron[b], and they brought your fathers out of Egypt and settled them in this place.
translation:
  language: hi
  text: जब याकूब मिस्र में आया, तब तुम्हारे पूर्वजों ने यहोवा को पुकारा। यहोवा ने मूसा और हारून को भेजा, और उन्होंने तुम्हारे पूर्वजों को मिस्र से बाहर निकाला और इस स्थान में बसाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जब ... तब
  rationale: यहाँ ऐतिहासिक परिस्थिति बताने वाला कालवाचक संबंध है; हिन्दी में ‘जब ... तब’ स्वाभाविक और स्पष्ट है।
- source_word: בָּא יַעֲקֹב מִצְרָיִם
  choice: याकूब मिस्र में आया
  rationale: בוא का सामान्य अर्थ ‘आना/प्रवेश करना’ है; स्थान के साथ ‘मिस्र में आया’ सहज हिन्दी है।
- source_word: וַיִּזְעֲקוּ
  choice: पुकारा
  rationale: זעק संकट में सहायता के लिए की गई तीव्र पुकार दर्शाता है; ‘पुकारा’ हिन्दी में प्रार्थनात्मक और आपात भाव दोनों व्यक्त करता है।
- source_word: אֲבוֹתֵיכֶם
  choice: तुम्हारे पूर्वजों
  rationale: शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है, पर इस ऐतिहासिक-सामूहिक संदर्भ में आधुनिक हिन्दी का ‘पूर्वजों’ आशय को अधिक स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֶל יְהוָה / יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत वाचा-नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से दर्शाया गया है, न कि उपाधि से प्रतिस्थापित किया गया।
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: שׁלח का सीधा और प्रसंगानुकूल अर्थ ‘भेजना’ है।
- source_word: וַיּוֹצִיאוּ
  choice: बाहर निकाला
  rationale: हिफ़ईल रूप कारणात्मक है और मूसा तथा हारून को निर्गमन के मानवीय माध्यम के रूप में प्रस्तुत करता है।
- source_word: וַיֹּשִׁבוּם
  choice: बसाया
  rationale: ישׁב का कारणात्मक रूप ‘बसाना/निवास कराना’ है; ‘बसाया’ संक्षिप्त, स्वाभाविक और अर्थसटीक है।
- source_word: בַּמָּקוֹם הַזֶּה
  choice: इस स्थान में
  rationale: मूल के स्थान-संज्ञक पद को निकटता से रखते हुए dignified हिन्दी प्रयोग चुना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय हिन्दी में पहचाने जाने वाले नाम-रूप से रखा गया है।
- issue: निर्गमन में कर्तृत्व
  choice: ‘उन्होंने’ का संदर्भ मूसा और हारून से
  alternative: यहोवा ने उन्हें बाहर निकाला
  rationale: וַיּוֹצִיאוּ बहुवचन है और व्याकरणतः निकटतम बहुवचन कर्ता मूसा और हारून हैं; पाठ साथ ही उन्हें यहोवा द्वारा भेजे गए माध्यमों के रूप में रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सरल किंतु गरिमापूर्ण शैली। वाक्य को हिन्दी की स्वाभाविक लय के लिए दो वाक्यों में रखा गया है। ‘पूर्वज’ सामूहिक ऐतिहासिक आशय स्पष्ट करता है; कोई आवश्यक पाठालोचनात्मक या वास्तविक अर्थ-अस्पष्टता न होने के कारण पादटिप्पणी नहीं जोड़ी गई।
