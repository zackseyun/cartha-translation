base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/010.yaml
  text: Then they cried out to the LORD and said, “We have sinned, because we have forsaken the LORD and have served the Baals and the Ashtaroths. But now, deliver us from the hand of our enemies, and we will serve you.”
translation:
  language: hi
  text: तब उन्होंने यहोवा की दुहाई दी और कहा, “हमने पाप किया है, क्योंकि हमने यहोवा को छोड़कर बाल देवताओं और अश्तारोत देवियों की उपासना की है। पर अब हमें हमारे शत्रुओं के हाथ से छुड़ा ले, और हम तेरी उपासना करेंगे।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּזְעֲקוּ
  choice: उन्होंने ... दुहाई दी
  rationale: संकट में सहायता के लिए ऊँचे स्वर से पुकारने का भाव स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को सामान्य उपाधि में बदलने के बजाय पारंपरिक हिन्दी लिप्यंतरण द्वारा सुरक्षित रखा गया है।
- source_word: הַבְּעָלִים
  choice: बाल देवताओं
  rationale: बहुवचन रूप को बनाए रखते हुए साधारण पाठक को स्पष्ट किया गया है कि यहाँ विभिन्न स्थानीय बाल देवताओं की बात है।
- source_word: הָעַשְׁתָּרוֹת
  choice: अश्तोरेत देवियों
  rationale: इब्रानी बहुवचन को स्त्रीलिंग बहुवचन में व्यक्त किया गया है और नाम को लिप्यंतरित रखा गया है।
- source_word: וַנַּעֲבֹד / וְנַעַבְדֶךָ
  choice: उपासना की है / तेरी उपासना करेंगे
  rationale: एक ही इब्रानी धातु के धार्मिक संदर्भ को दोनों स्थानों पर संगत रूप से व्यक्त करता है।
- source_word: מִיַּד אֹיְבֵינוּ
  choice: हमारे शत्रुओं के हाथ से
  rationale: मूल की ठोस सेमिटिक अभिव्यक्ति को हिन्दी में बोधगम्य रहते हुए सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: WLC में टेट्राग्रामटन स्पष्ट रूप से उपस्थित है; व्यक्तिगत नाम रखने से पाठ का स्रोतगत भेद बना रहता है।
- issue: עבד का धार्मिक अर्थ
  choice: उपासना करना
  alternative: सेवा करना
  rationale: बालों, अश्तोरेतों और यहोवा के प्रति समानांतर धार्मिक निष्ठा का संदर्भ है; ‘उपासना’ आधुनिक हिन्दी में इस आशय को स्पष्ट करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। प्रत्यक्ष कथन में ‘तेरी’ का प्रयोग प्रार्थना की निकटता और एकवचन इब्रानी संबोधन को बनाए रखता है।
