  text: וַ/יֹּאמְר֨וּ כָל הָ/עָ֜ם אֶל שְׁמוּאֵ֗ל הִתְפַּלֵּ֧ל בְּעַד עֲבָדֶ֛י/ךָ אֶל יְהוָ֥ה אֱלֹהֶ֖י/ךָ וְ/אַל נָמ֑וּת כִּֽי יָסַ֤פְנוּ עַל כָּל חַטֹּאתֵ֨י/נוּ֙ רָעָ֔ה לִ/שְׁאֹ֥ל לָ֖/נוּ מֶֽלֶךְ־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/019.yaml
  text: 'Then all the people said to Samuel[a], “Pray to Yahweh your God for your servants, and do not let us die, for we have added to all our sins this evil: to ask for a king for ourselves.”'
translation:
  language: hi
  text: 'तब सब लोगों ने शमूएल से कहा, “याहवे, अपने परमेश्वर से अपने सेवकों के लिए प्रार्थना कीजिए[a], ताकि हम न मरें; क्योंकि हमने अपने सारे पापों में यह बुराई भी जोड़ दी है: अपने लिए राजा माँगना।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: अपने सेवकों की ओर से विनती कीजिए।'
    reason: हिब्रू הִתְפַּלֵּל के साथ בְּעַד का अर्थ ‘के लिए/की ओर से मध्यस्थता करना’ भी हो सकता है; मुख्य पाठ में सामान्य ‘प्रार्थना कीजिए’ रखा गया है।
lexical_decisions:
- source_word: וַיֹּאמְרוּ כָל־הָעָם
  choice: तब सब लोगों ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी कथा-प्रवाह देता है और כָל־הָעָם का सामूहिक अर्थ बनाए रखता है।
- source_word: הִתְפַּלֵּל בְּעַד עֲבָדֶיךָ
  choice: अपने इन सेवकों के लिए प्रार्थना कीजिए
  rationale: התפלל का सीधा अर्थ ‘प्रार्थना करना’ है और בְּעַד उसके पक्ष में की जाने वाली विनती का भाव स्पष्ट करता है। ‘अपने इन सेवकों’ से लोगों की विनम्र आत्म-पहचान सुरक्षित रहती है; आदरसूचक ‘कीजिए’ आधुनिक हिन्दी में शमूएल को संबोधन के अनुरूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में उसके व्यक्तिगत नाम का लिप्यंतरण किया गया है।
- source_word: אֱלֹהֶיךָ
  choice: अपने परमेश्वर
  rationale: द्वितीय पुरुष एकवचन प्रत्यय का अर्थ शमूएल के संदर्भ में ‘आपके परमेश्वर’ है। हिन्दी में एक ही संबोधन के भीतर ‘अपने’ अधिक स्वाभाविक है और मूल का संबंधपरक तनाव बनाए रखता है।
- source_word: וְאַל־נָמוּת
  choice: ताकि हम मर न जाएँ
  rationale: निषेधात्मक रूप प्रार्थना के वांछित परिणाम को व्यक्त करता है। यह हिन्दी में स्वाभाविक है और ‘हम न मरें’ का अर्थ बिना यह जोड़े देता है कि शमूएल स्वयं उन्हें जीवित रख सकता है।
- source_word: כִּי יָסַפְנוּ עַל כָּל־חַטֹּאתֵינוּ רָעָה
  choice: क्योंकि ... हमने अपने सब पापों में यह बुराई भी जोड़ दी है
  rationale: יסף על का संचयी भाव ‘में ... भी जोड़ दी’ से स्पष्ट होता है। רָעָה की नैतिक गंभीरता के लिए ‘बुराई’ रखा गया है।
- source_word: לִשְׁאֹל לָנוּ מֶלֶךְ
  choice: अपने लिए राजा माँगकर
  rationale: לָנוּ का आत्म-संबंधी बल ‘अपने लिए’ से व्यक्त होता है। हिन्दी में कृदन्तीय विन्यास इस काम को उस बुराई के रूप में स्वाभाविक ढंग से जोड़ता है जिसे उन्होंने पहले पापों के ऊपर बढ़ाया।
theological_decisions:
- issue: लोगों का ‘तेरा परमेश्वर’ कहकर शमूएल से प्रार्थना का अनुरोध
  choice: ‘अपने परमेश्वर’ के रूप में द्वितीय पुरुष संबंध बनाए रखा
  alternative: ‘हमारे परमेश्वर’
  rationale: मूल पाठ लोगों की मध्यस्थता-संबंधी अपील में शमूएल के साथ परमेश्वर के संबंध को उभारता है। इसे ‘हमारे परमेश्वर’ कर देने से पाठ का जानबूझकर बना संबंधपरक और आत्मिक तनाव मिट जाता।
- issue: राजा माँगने का नैतिक मूल्यांकन
  choice: ‘यह बुराई’
  alternative: ‘यह गलती’ या ‘यह अपराध’
  rationale: רָעָה नैतिक बुराई को व्यक्त करता है। ‘गलती’ इसे कमजोर करती, जबकि ‘अपराध’ अनावश्यक रूप से अधिक विधिक अर्थ जोड़ सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, आदरसूचक संबोधन और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज वाक्य-विन्यास अपनाया गया है। ‘याहवे’ को दिव्य नाम के लिप्यंतरण के रूप में रखा गया है।
