base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/022.yaml
  text: For Yahweh will not forsake his people[a], for the sake of his great name[b], because Yahweh has been pleased to make you his people.
translation:
  language: hi
  text: क्योंकि यहोवा अपने लोगों को नहीं त्यागेगा[a], अपने महान नाम के कारण; क्योंकि यहोवा तुम्हें अपनी प्रजा बनाने में प्रसन्न हुआ है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘छोड़ नहीं देगा’ अथवा ‘ठुकराएगा नहीं’।
    reason: lexical_alternative
  - marker: b
    text: या ‘क्योंकि यहोवा ने तुम्हें अपने लिए एक प्रजा बनाने को ठाना है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: יִטֹּשׁ
  choice: नहीं त्यागेगा
  rationale: यह क्रिया यहाँ किसी समुदाय को छोड़ देने या उससे मुँह मोड़ लेने का भाव व्यक्त करती है। ‘त्यागना’ स्वाभाविक, गंभीर और वाचा-संबंधी संदर्भ के अनुकूल है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ शीर्षक से उसका भेद बनाए रखता है।
- source_word: עַמּוֹ
  choice: अपने लोगों
  rationale: עַם सामुदायिक और वाचा-संबंधी पहचान बताता है। ‘अपने लोगों’ हिन्दी में स्वाभाविक है और परमेश्वर से उनके संबंध को स्पष्ट रखता है।
- source_word: בַּעֲבוּר שְׁמוֹ הַגָּדוֹל
  choice: अपने महान नाम के कारण
  rationale: यह पदबंध यहोवा के कार्य का आधार उसके महान नाम—अर्थात उसकी प्रकट प्रतिष्ठा और सम्मान—को बताता है।
- source_word: הוֹאִיל
  choice: इच्छा की है
  rationale: הוֹאִיל यहाँ स्वेच्छापूर्वक राजी होने या ठानने का भाव रखता है। ‘इच्छा की है’ अनुग्रहपूर्ण दिव्य संकल्प को व्यक्त करता है, बिना उससे अधिक विशिष्ट धर्मवैज्ञानिक अर्थ थोपे।
- source_word: לַעֲשׂוֹת אֶתְכֶם לוֹ לְעָם
  choice: तुम्हें अपनी प्रजा बनाने
  rationale: לוֹ का ‘अपने लिए’ वाला संबंध ‘अपनी प्रजा’ में स्वाभाविक रूप से समाहित है। ‘प्रजा’ यहाँ परमेश्वर के अधीन और उससे संबंधित वाचा-समुदाय को सुबोध ढंग से व्यक्त करती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल के व्यक्तिगत वाचा-नाम को ‘प्रभु’ जैसे शीर्षक से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण रखा गया है।
- issue: הוֹאִיל में ईश्वरीय इच्छा का भाव
  choice: इच्छा की है
  alternative: प्रसन्न हुआ है; चुन लिया है
  rationale: इस रूप में परमेश्वर की स्वेच्छापूर्ण और अनुग्रहकारी प्रतिबद्धता व्यक्त होती है, जबकि ‘चुन लिया’ पाठ में किसी अधिक तकनीकी धर्मवैज्ञानिक अर्थ का आभास दे सकता है।
- issue: עַם के लिए दो हिन्दी रूप
  choice: पहले ‘लोगों’, फिर ‘प्रजा’
  alternative: दोनों स्थानों पर ‘लोग’
  rationale: पहले पद में ‘अपने लोगों को त्यागना’ स्वाभाविक हिन्दी है; दूसरे में ‘अपनी प्रजा बनाना’ परमेश्वर से संबद्ध समुदाय के गठन को अधिक सहजता से व्यक्त करता है। दोनों एक ही इब्रानी संज्ञा के संदर्भानुकूल रूप हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रूप। वाक्य की दो कारणवाचक धाराओं को अर्धविराम से अलग किया गया है। ‘यहोवा’ द्वारा मूल ईश्वरीय नाम सुरक्षित रखा गया है।
