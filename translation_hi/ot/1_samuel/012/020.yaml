base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/020.yaml
  text: And Samuel said to the people[a], “Do not be afraid. You have done all this evil. Yet do not turn aside from following Yahweh[b], but serve Yahweh with all your heart.”
translation:
  language: hi
  text: तब शमूएल ने लोगों से कहा, “मत डरो। तुमने यह सारी बुराई की है। फिर भी याहवे के पीछे चलना मत छोड़ो[a], बल्कि अपने पूरे मन से याहवे की सेवा करो।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “याहवे के पीछे से मत हटो”; यह उसका अनुसरण करना न छोड़ने का इब्रानी मुहावरा है।
    reason: मूल इब्रानी मुहावरे और उसके अर्थ को दिखाने के लिए।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: इब्रानी कथात्मक क्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना समय-संबंध को अनावश्यक रूप से अधिक स्पष्ट किए।
- source_word: אַל תִּירָאוּ
  choice: मत डरो
  rationale: יָרֵא के निषेधात्मक आदेश का संक्षिप्त, स्वाभाविक और अर्थनिष्ठ हिन्दी रूप।
- source_word: אַתֶּם עֲשִׂיתֶם אֵת כָּל הָרָעָה הַזֹּאת
  choice: तुमने यह सब बुराई की है
  rationale: स्वतंत्र सर्वनाम אַתֶּם के बल को स्पष्ट ‘तुमने’ से रखा गया है; ‘बुराई’ רָעָה की नैतिक गंभीरता बनाए रखती है।
- source_word: אַךְ
  choice: फिर भी
  rationale: पाप की स्वीकृति के बाद आने वाले प्रबल विरोधात्मक और रियायती मोड़ को व्यक्त करता है।
- source_word: אַל תָּסוּרוּ מֵאַחֲרֵי יְהוָה
  choice: याहवे के पीछे चलना मत छोड़ो
  rationale: शाब्दिक ‘याहवे के पीछे से मत हटो’ की अनुयायी-छवि को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וַעֲבַדְתֶּם אֶת יְהוָה
  choice: बल्कि ... याहवे की सेवा करो
  rationale: עבד का व्यापक वाचा-संबंधी अर्थ ‘सेवा करना’ है; ‘बल्कि’ नकारात्मक आदेश के बाद सकारात्मक आदेश का स्वाभाविक विरोध दिखाता है।
- source_word: בְּכָל לְבַבְכֶם
  choice: अपने पूरे मन से
  rationale: सम्पूर्ण आंतरिक निष्ठा और समर्पण के इब्रानी मुहावरे का सहज हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि से नहीं बदलता।
- issue: רָעָה की नैतिक शक्ति
  choice: बुराई
  alternative: दुष्टता; गलत काम
  rationale: सन्दर्भ में लोगों के कार्य को केवल भूल नहीं, नैतिक अपराध कहा गया है; ‘बुराई’ इस गंभीरता को बनाए रखती है।
- issue: מֵאַחֲרֵי का अनुयायी-संबंधी बिंब
  choice: के पीछे चलना मत छोड़ो
  alternative: से मत हटो
  rationale: यह रूप याहवे का अनुसरण करने की मूल इब्रानी छवि को बनाए रखते हुए हिन्दी में स्पष्ट है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। आदेशों की सीधी शक्ति तथा पाप की नैतिक गंभीरता को नरम नहीं किया गया है।
