  text: And do not turn aside after worthless things that cannot profit or deliver[b][a], for they are worthless.
translation:
  language: hi
  text: और व्यर्थ वस्तुओं के पीछे न मुड़ना[a], जो न लाभ पहुँचा सकती हैं, न बचा सकती हैं[b], क्योंकि वे व्यर्थ ही हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खाली चीज़ों,” “निष्फल चीज़ों” अथवा “मूर्तियों।” इब्रानी शब्द תֹהוּ का अर्थ ऐसी चीज़ है जो खाली, सारहीन या व्यर्थ हो।
    reason: lexical_alternative
  - marker: b
    text: या “छुड़ा सकती हैं” अथवा “उद्धार कर सकती हैं।”
    reason: lexical_alternative
lexical_decisions:
- source_word: תָּסוּרוּ
  choice: मुड़ न जाना
  rationale: सूर क्रिया का मूल भाव मार्ग या निष्ठा से हटकर दूसरी ओर मुड़ना है। यह अभिव्यक्ति वाचा-संबंधी चेतावनी का रूपक बनाए रखती है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אַחֲרֵי
  choice: के पीछे
  rationale: शाब्दिक अर्थ ‘पीछे’ है; यहाँ किसी वस्तु का अनुसरण करने या उसके प्रति निष्ठा रखने का भाव है।
- source_word: הַתֹּהוּ / תֹהוּ
  choice: व्यर्थ बातों / व्यर्थ
  rationale: תֹהוּ खालीपन, निष्फलता और सारहीनता को दर्शाता है। ‘व्यर्थ’ संभावित मूर्ति-संदर्भ को अनावश्यक रूप से स्पष्ट किए बिना इस व्यापक अर्थ को सुरक्षित रखता है; अंतिम पुनरुक्ति भी बनाए रखी गई है।
- source_word: אֲשֶׁר לֹא יוֹעִילוּ
  choice: जो न लाभ पहुँचा सकती हैं
  rationale: यह संबंधवाचक उपवाक्य उन वस्तुओं की लाभ देने में अक्षमता बताता है। स्त्रीलिंग बहुवचन क्रिया हिन्दी में ‘बातों’ से सामंजस्य रखती है।
- source_word: וְלֹא יַצִּילוּ
  choice: न छुड़ा सकती हैं
  rationale: हिफ़ील रूप का अर्थ संकट से छुड़ाना या बचाना है। ‘छुड़ाना’ पुराने नियम के उद्धार-संबंधी प्रयोग के अनुकूल रहते हुए तत्काल संकट से मुक्ति का अर्थ व्यक्त करता है।
- source_word: הֵמָּה
  choice: वे
  rationale: बहुवचन सर्वनाम पहले कही गई व्यर्थ बातों की ओर लौटता है; हिन्दी में ‘वे’ इसका सहज रूप है।
theological_decisions:
- issue: ‘व्यर्थ बातों’ का संदर्भ
  choice: मूर्तियों या भरोसे की अन्य सारहीन वस्तुओं की ओर सामान्य संकेत को गैर-विशिष्ट रखा गया है।
  alternative: सीधे ‘मूर्तियों’ का अनुवाद करना।
  rationale: संदर्भ में मूर्तियाँ संभावित मुख्य आशय हैं, पर इब्रानी תֹהוּ स्वयं ‘मूर्ति’ का विशिष्ट शब्द नहीं, बल्कि खालीपन और निष्फलता का व्यापक शब्द है। इसलिए अनुवाद स्रोत की अर्थ-व्याप्ति और निहित अस्पष्टता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण उपदेशात्मक स्तर रखा गया है। ‘व्यर्थ’ की पुनरावृत्ति इब्रानी की अलंकारिक पुनरुक्ति को सुरक्षित रखती है। दोनों पाद-टिप्पणी चिह्न संबंधित पदांशों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
