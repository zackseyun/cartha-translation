base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/002.yaml
  text: And now[a], look, the king is walking before you, and I have grown old and gray, and here are my sons with you[c][b]. And I have walked before you from my youth until this day.
translation:
  language: hi
  text: और अब देखो, राजा तुम्हारे आगे चल रहा है[a]। मैं बूढ़ा हो गया हूँ और मेरे बाल सफेद हो गए हैं[b], और देखो, मेरे बेटे तुम्हारे साथ हैं। मैं अपनी जवानी से लेकर आज के दिन तक तुम्हारे आगे चलता रहा हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजा तुम्हारे आगे-आगे जाता है” अथवा “राजा तुम्हारा नेतृत्व करता है।” इब्रानी मुहावरा सार्वजनिक नेतृत्व को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक भाव: “मैं बूढ़ा हो गया हूँ और सफेद हो गया हूँ,” अर्थात मेरे बाल सफेद हो गए हैं।'
    reason: lexical_alternative
  - marker: c
    text: या, “मैं तुम्हारे आगे-आगे जाता रहा हूँ” अथवा “मैं तुम्हारा नेतृत्व करता रहा हूँ।” शमूएल अपने सार्वजनिक दायित्व और राजा की भूमिका के बीच जानबूझकर समानांतर बनाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: और अब
  rationale: संयोजक वाव और कालसूचक क्रियाविशेषण, दोनों को रखते हुए शमूएल की वर्तमान अपील का आरम्भ दर्शाता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने वाले इस अव्यय का आधुनिक, स्वाभाविक और अनार्काइक हिन्दी रूप।
- source_word: מִתְהַלֵּךְ לִפְנֵיכֶם
  choice: तुम्हारे आगे चल रहा है
  rationale: हित्पाएल कृदन्त की जारी वर्तमान क्रिया और शाब्दिक मुहावरे को सुरक्षित रखता है; सार्वजनिक नेतृत्व का निहित अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: זָקַנְתִּי וָשַׂבְתִּי
  choice: मैं बूढ़ा हो गया हूँ और मेरे बाल सफेद हो गए हैं
  rationale: दोनों सिद्ध अवस्थाओं को स्वाभाविक हिन्दी में व्यक्त करता है और दूसरे क्रियापद में निहित सफेदी/पके बालों की छवि बनाए रखता है।
- source_word: וּבָנַי הִנָּם אִתְּכֶם
  choice: और देखो, मेरे बेटे तुम्हारे साथ हैं
  rationale: הִנָּם की प्रस्तुतिकरण और ध्यानाकर्षण की शक्ति को ‘देखो’ द्वारा स्पष्ट करते हुए पुत्रों की वर्तमान उपस्थिति बताता है।
- source_word: הִתְהַלַּכְתִּי לִפְנֵיכֶם
  choice: तुम्हारे आगे चलता रहा हूँ
  rationale: राजा के विषय में प्रयुक्त उसी ‘आगे चलने’ वाले मुहावरे को दोहराकर शमूएल द्वारा बनाया गया आलंकारिक समानांतर सुरक्षित रखता है।
- source_word: מִנְּעֻרַי עַד הַיּוֹם הַזֶּה
  choice: अपनी जवानी से लेकर आज के दिन तक
  rationale: शमूएल की युवावस्था से वर्तमान दिन तक की निरन्तर अवधि को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ‘तुम्हारे आगे चलना’ का नेतृत्व-संबंधी अर्थ
  choice: मुख्य पाठ में शाब्दिक मुहावरा ‘तुम्हारे आगे चलना’ रखा गया
  alternative: ‘तुम्हारा नेतृत्व करना’
  rationale: इब्रानी अभिव्यक्ति सार्वजनिक नेतृत्व का संकेत दे सकती है, पर केवल औपचारिक नेतृत्व तक सीमित नहीं है। समान अभिव्यक्ति राजा और शमूएल दोनों के लिए रखकर मूल का अर्थगत तनाव और समानांतर सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किन्तु गरिमापूर्ण स्तर अपनाया गया है। ‘देखो’ ने पुरातन ‘निहारो’ जैसे रूपों से बचते हुए הִנֵּה का ध्यानाकर्षण बनाए रखा है। राजा और शमूएल के लिए ‘तुम्हारे आगे चलना’ की पुनरावृत्ति मूल की शैली और संभावित नेतृत्वार्थ दोनों को सुरक्षित रखती है।
