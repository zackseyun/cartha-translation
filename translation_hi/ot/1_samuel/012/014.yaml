  edition: WLC
  text: אִם תִּֽירְא֣וּ אֶת יְהוָ֗ה וַ/עֲבַדְתֶּ֤ם אֹת/וֹ֙ וּ/שְׁמַעְתֶּ֣ם בְּ/קֹל֔/וֹ וְ/לֹ֥א תַמְר֖וּ אֶת פִּ֣י יְהוָ֑ה וִ/הְיִתֶ֣ם גַּם אַתֶּ֗ם וְ/גַם הַ/מֶּ֨לֶךְ֙ אֲשֶׁ֣ר מָלַ֣ךְ עֲלֵי/כֶ֔ם אַחַ֖ר יְהוָ֥ה אֱלֹהֵי/כֶֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/014.yaml
  text: If you fear Yahweh and serve him and listen to his voice and do not rebel against the command of Yahweh[b][a], then both you and the king who reigns over you will follow Yahweh your God.
translation:
  language: hi
  text: यदि तुम याहवे का भय मानोगे, उसकी सेवा करोगे, उसकी वाणी सुनोगे[a] और याहवे की आज्ञा के विरुद्ध विद्रोह नहीं करोगे, तो तुम और तुम्हारे ऊपर राज करने वाला राजा—दोनों अपने परमेश्वर याहवे के पीछे चलोगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “उसकी वाणी सुनोगे” का अर्थ “उसकी वाणी मानोगे” भी हो सकता है, क्योंकि इब्रानी अभिव्यक्ति में प्रायः आज्ञापालन के भाव से सुनना शामिल होता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी का अधिक शाब्दिक रूप है, “और तुम—तुम भी और तुम्हारे ऊपर राज करने वाला राजा भी—अपने परमेश्वर याहवे के पीछे होगे।” इसका आशय संभवतः यह है कि प्रजा और राजा, दोनों याहवे के प्रति निष्ठावान रहेंगे या उसके पीछे चलेंगे।
    reason: alternative_reading
lexical_decisions:
- source_word: תִּירְאוּ אֶת־יְהוָה
  choice: याहवे का भय मानो
  rationale: ירא परमेश्वर के प्रति भय और श्रद्धा, दोनों का भाव रखता है। ‘भय मानना’ हिन्दी की स्वाभाविक बाइबलीय अभिव्यक्ति है और वाचा-संबंधी गंभीरता को बनाए रखता है।
- source_word: וַעֲבַדְתֶּם אֹתוֹ
  choice: उसकी सेवा करो
  rationale: עבד यहाँ आराधना-सहित निष्ठापूर्ण सेवा को व्यक्त करता है; ‘सेवा करो’ मूल शब्द की व्यापकता बनाए रखता है।
- source_word: וּשְׁמַעְתֶּם בְּקֹלוֹ
  choice: उसकी वाणी सुनो
  rationale: यह इब्रानी मुहावरा आज्ञापालन की भावना लिए हुए सुनने को दर्शाता है। मुख्य पाठ में श्रवण की मूल छवि रखी गई है और उसका आज्ञापालन-संबंधी भाव पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְלֹא תַמְרוּ אֶת־פִּי יְהוָה
  choice: याहवे की आज्ञा के विरुद्ध विद्रोह न करो
  rationale: מרה साधारण अवज्ञा से बढ़कर विद्रोही प्रतिरोध बताता है। ‘याहवे का मुख’ का शाब्दिक रूप यहाँ उसकी कही हुई आज्ञा का मुहावरा है।
- source_word: גַּם אַתֶּם וְגַם הַמֶּלֶךְ
  choice: तुम और ... राजा—दोनों
  rationale: दो बार आए גַּם को हिन्दी में ‘दोनों’ की सहसंबंधी रचना से स्वाभाविक और स्पष्ट रूप दिया गया है।
- source_word: אַחַר יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर याहवे के पीछे चलते रहोगे
  rationale: אַחַר किसी के प्रति निष्ठा रखते हुए उसके पीछे चलने का अर्थ दे सकता है। ‘पीछे चलते रहोगे’ मूल रूपक और निरंतर निष्ठा का भाव दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित निकट लिप्यंतरण से प्रस्तुत किया गया है।
theological_decisions:
- issue: अंतिम वाक्यांश וִהְיִיתֶם ... אַחַר יְהוָה אֱלֹהֵיכֶם का संबंध और अर्थ
  choice: इसे शर्त के परिणाम के रूप में ‘दोनों ... याहवे के पीछे चलते रहोगे’ अनूदित किया गया है।
  alternative: 'अधिक शाब्दिक रूप: ‘और तुम—तुम भी और ... राजा भी—अपने परमेश्वर याहवे के पीछे होगे’; इब्रानी में परिणाम बताने वाला कोई स्पष्ट पूरक नहीं है।'
  rationale: संदर्भ में प्रजा और राजा की याहवे के प्रति बनी रहने वाली निष्ठा अभिप्रेत जान पड़ती है, पर मूल की असामान्य और कुछ हद तक अस्पष्ट रचना को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। एकवचन राजा के लिए ‘करने वाला’ और बहुवचन प्रजा तथा राजा के संयुक्त कर्ता के लिए ‘चलते रहोगे’ प्रयुक्त हुआ है। ‘याहवे’ को व्यक्तिगत नाम के रूप में रखा गया है।
