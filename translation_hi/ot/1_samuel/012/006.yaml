id: 1SA.12.6
reference: 1 Samuel 12:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֥אמֶר שְׁמוּאֵ֖ל אֶל הָ/עָ֑ם יְהוָ֗ה אֲשֶׁ֤ר עָשָׂה֙ אֶת מֹשֶׁ֣ה וְ/אֶֽת אַהֲרֹ֔ן וַ/אֲשֶׁ֧ר הֶעֱלָ֛ה אֶת אֲבֹתֵי/כֶ֖ם מֵ/אֶ֥רֶץ מִצְרָֽיִם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/006.yaml
  text: Then Samuel said to the people[b][a], “Yahweh is the one who appointed Moses and Aaron and who brought your fathers up from the land of Egypt.”
translation:
  language: hi
  text: तब शमूएल ने लोगों से कहा, “याहवे ही हैं जिन्होंने मूसा और हारून को नियुक्त किया[a] और तुम्हारे पुरखों[b] को मिस्र देश से बाहर ले आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “मूसा और हारून को बनाया।” यहाँ इब्रानी क्रिया का आशय संभवतः उन्हें उनकी भूमिकाओं में नियुक्त या स्थापित करना है।
    reason: lexical_alternative
  - marker: b
    text: “पुरखों” का अर्थ अधिक व्यापक रूप में “पूर्वजों” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר שְׁמוּאֵל אֶל הָעָם
  choice: तब शमूएल ने लोगों से कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में क्रम को व्यक्त करता है, और शेष वाक्यांश इब्रानी का सीधा अर्थ देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר עָשָׂה אֶת מֹשֶׁה וְאֶת אַהֲרֹן
  choice: जिन्होंने मूसा और हारून को नियुक्त किया
  rationale: עָשָׂה का मूल अर्थ ‘बनाना/करना’ है, पर यहाँ मूसा और हारून को उनकी अगुवाई की भूमिकाओं में स्थापित करने का भाव है। ‘नियुक्त किया’ आधुनिक हिन्दी में इस प्रसंग का आशय स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַאֲשֶׁר הֶעֱלָה
  choice: और ... बाहर ले आए
  rationale: हिफ़ील रूप का अर्थ ‘ऊपर लाना/ले आना’ है और यहाँ निर्गमन का संकेत है। हिन्दी में ‘मिस्र देश से बाहर ले आए’ स्रोत और स्वाभाविक प्रयोग दोनों को बनाए रखता है।
- source_word: אֶת אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखों
  rationale: אֲבוֹת का पुरुषवाची और पारिवारिक-ऐतिहासिक स्वर ‘पुरखों’ से सुरक्षित रहता है; व्यापक अर्थ ‘पूर्वजों’ को पादटिप्पणी में दिया गया है।
- source_word: מֵאֶרֶץ מִצְרָיִם
  choice: मिस्र देश से
  rationale: ‘मिस्र की भूमि/देश से’ का निकट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: मूसा और हारून के साथ עָשָׂה का आशय
  choice: नियुक्त किया
  alternative: बनाया
  rationale: प्रसंग परमेश्वर द्वारा इन अगुवों को उनकी भूमिकाओं में स्थापित किए जाने का है, न कि व्यक्तियों के रूप में उनकी सृष्टि का। फिर भी इब्रानी की शाब्दिक अस्पष्टता पादटिप्पणी में रखी गई है।
- issue: יְהוָה से आरम्भ होने वाले क्रियारहित उपवाक्य का बल
  choice: याहवे ही हैं जिन्होंने
  alternative: याहवे, जिन्होंने
  rationale: यह रूप याहवे को बताए गए कार्यों के कर्ता के रूप में पहचानने वाले इब्रानी कथन का बल स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याहवे’ वाचा-नाम को सुरक्षित रखता है; ‘पुरखे’ औपचारिक ‘पितर’ की अपेक्षा अधिक वर्तमान और बोधगम्य है। दोनों पादटिप्पणी-चिह्न संबंधित शब्दों के तुरंत बाद मुख्य पाठ में दिए गए हैं।
