  register: भाषा आधुनिक, सम्मानपूर्ण और सार्वजनिक उत्तर के अनुकूल रखी गई है। शमूएल के लिए आदरसूचक ‘आप’ प्रयुक्त है। ‘कुचला’ स्रोत के प्रबल रूपक को सुरक्षित रखता है, जबकि वाक्य-संरचना सामान्य पाठक के लिए सरल है।
