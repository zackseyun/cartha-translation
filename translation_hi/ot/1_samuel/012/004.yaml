base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/004.yaml
  text: And they said[a], “You have not oppressed us, and you have not mistreated us, and you have not taken anything from any man's hand.”
translation:
  language: hi
  text: तब उन्होंने कहा, “आपने न हम पर अत्याचार किया, न हमें कुचला, और न किसी मनुष्य के हाथ से कुछ लिया[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “किसी मनुष्य के हाथ से कुछ।” इस वाक्यांश का संकेत किसी से भुगतान, भेंट या घूस लेने की ओर हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब उन्होंने कहा
  rationale: वय्यिक्तोल की कथात्मक क्रमबद्धता को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; ‘तब’ प्रसंग की प्रगति दिखाता है, बिना अतिरिक्त अर्थ जोड़े।
- source_word: עֲשַׁקְתָּנוּ
  choice: आपने न हम पर अत्याचार किया
  rationale: עשק अधिकार के दुरुपयोग द्वारा दबाने, शोषण करने या ठगने का अर्थ दे सकता है। ‘अत्याचार किया’ सार्वजनिक न्याय के इस प्रसंग में व्यापक और सहज है।
- source_word: רַצּוֹתָנוּ
  choice: न हमें कुचला
  rationale: רצץ का मूल बिंब कुचलने या तोड़ने का है और यहाँ दुर्व्यवहार का रूपक है। ‘कुचला’ इब्रानी की तीव्रता और रूपक को बनाए रखता है।
- source_word: לָקַחְתָּ מִיַּד אִישׁ מְאוּמָה
  choice: न किसी मनुष्य के हाथ से कुछ लिया
  rationale: ‘किसी के हाथ से लेना’ स्रोत की ठोस अभिव्यक्ति को बनाए रखता है; प्रसंग में इसका संकेत अनुचित भुगतान, भेंट या घूस लेने की ओर हो सकता है।
- source_word: אִישׁ
  choice: किसी मनुष्य
  rationale: एकवचन पुल्लिंग स्रोत-रूप और उसके प्रतिनिधिक प्रयोग को निकटता से व्यक्त करता है।
- source_word: מְאוּמָה
  choice: कुछ
  rationale: नकारात्मक वाक्य में ‘कुछ’ स्वाभाविक हिन्दी है और ‘कोई भी वस्तु’ का अर्थ देता है।
