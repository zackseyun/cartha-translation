base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/009.yaml
  text: But they forgot Yahweh their God[a], and he sold them into the hand of Sisera, commander of the army of Hazor, and into the hand of the Philistines, and into the hand of the king of Moab; and they fought against them.
translation:
  language: hi
  text: पर वे याहवे, अपने परमेश्वर, को भूल गए। तब उसने उन्हें सीसरा के हाथ में बेच दिया, जो हासोर की सेना का सेनापति था, और पलिश्तियों के हाथ में तथा मोआब के राजा के हाथ में; और उन्होंने उनसे युद्ध किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उन्हें सौंप दिया।’ इब्रानी में शाब्दिक रूप से ‘उन्हें बेच दिया’ है—यह वाचा-संबंधी न्याय का एक मुहावरा है, जिसका अर्थ किसी प्रजा को उसके शत्रुओं के अधिकार में कर देना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁכְּחוּ
  choice: भूल गए
  rationale: שׁכח का सीधा अर्थ ‘भूलना’ है। वाचा के संदर्भ में इसमें उपेक्षा और विश्वासघात का भाव हो सकता है, पर मुख्य पाठ में मूल शब्दावली बनाए रखी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה का हिंदी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵיהֶם
  choice: अपने परमेश्वर
  rationale: हिंदी में कर्ता के साथ संबंध स्पष्ट और स्वाभाविक बनाने के लिए ‘अपने परमेश्वर’ कहा गया है; यह इब्रानी के ‘उनके परमेश्वर’ का वही संबंध व्यक्त करता है।
- source_word: וַיִּמְכֹּר
  choice: बेच दिया
  rationale: מכר का शाब्दिक अर्थ ‘बेचना’ है। यहाँ यह न्याय के रूप में शत्रुओं के अधिकार में कर देने की वाचागत उपमा है; मुख्य पाठ में उसी उपमा को रखा गया है।
- source_word: בְּיַד
  choice: के हाथ
  rationale: इब्रानी मुहावरे में ‘हाथ’ किसी के अधिकार या वश को दर्शाता है। हिंदी की बाइबलीय शैली में यह बिंब समझने योग्य है।
- source_word: שַׂר צְבָא חָצוֹר
  choice: हासोर की सेना का सेनापति
  rationale: שַׂר צְבָא सैन्य नेतृत्व का पद है; ‘सेनापति’ संक्षिप्त, स्वाभाविक और अर्थानुकूल है।
- source_word: וַיִּלָּחֲמוּ בָם
  choice: उन्होंने उनसे युद्ध किया
  rationale: बहुवचन कर्ता पहले बताए गए शत्रु पक्षों की ओर संकेत करता है और בָם इस्राएलियों को लक्ष्य बनाता है। सर्वनामों को बनाए रखने से मूल की संक्षिप्तता सुरक्षित रहती है।
theological_decisions:
- issue: ‘उसने उन्हें बेच दिया’ का कर्ता
  choice: एकवचन कर्ता याहवे है।
  alternative: 'भाववाच्य अनुवाद: ‘वे बेच दिए गए।’'
  rationale: पिछले वाक्यांश में ‘उनके परमेश्वर याहवे’ निकटतम एकवचन संदर्भ है और इब्रानी एकवचन क्रिया उसी कर्ता को स्वाभाविक रूप से आगे बढ़ाती है।
- issue: ‘याहवे को भूल गए’ का आशय
  choice: ‘भूल गए’ के शाब्दिक रूप को रखा गया है।
  alternative: ‘याहवे को त्याग दिया’ या ‘उसकी उपेक्षा की।’
  rationale: संदर्भ में वाचा के प्रति बेवफाई निहित हो सकती है, पर अधिक स्पष्ट व्याख्यात्मक शब्द मूल से अधिक अर्थ जोड़ते।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक किंतु गरिमापूर्ण शैली अपनाई गई है। ‘याहवे’ में दिव्य नाम को लिप्यंतरित किया गया है। ‘के हाथ’ और ‘बेच दिया’ मूल इब्रानी बिंबों को सुरक्षित रखते हैं; अर्थ स्पष्ट करने के लिए पादटिप्पणी दी गई है।
