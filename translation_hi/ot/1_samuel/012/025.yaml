source:
  edition: WLC
  text: וְ/אִם הָרֵ֖עַ תָּרֵ֑עוּ גַּם אַתֶּ֥ם גַּֽם מַלְכְּ/כֶ֖ם תִּסָּפֽוּ־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/025.yaml
  text: But if you persist in doing evil[b][a], both you and your king will be swept away.
translation:
  language: hi
  text: पर यदि तुम बुराई करते ही रहोगे[a], तो तुम और तुम्हारा राजा—दोनों मिटा दिए जाओगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यदि तुम बुराई करोगे” अथवा “यदि तुम दुष्टता से काम करोगे”; इब्रानी में क्रिया की विशेष बलयुक्त रचना है।
    reason: lexical_alternative
  - marker: b
    text: या “नाश हो जाओगे” अथवा “बहा दिए जाओगे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह शर्त पिछले संदर्भ की प्रतिज्ञा के विपरीत चेतावनी प्रस्तुत करती है; इसलिए ‘पर यदि’ स्वाभाविक रूप से विरोधसूचक भाव व्यक्त करता है।
- source_word: הָרֵעַ תָּרֵעוּ
  choice: तुम बुराई करते ही रहोगे
  rationale: धातु के infinitive absolute और finite verb का मेल क्रिया पर बल देता है। ‘करते ही रहोगे’ उस तीव्रता और लगातार बुराई करने की चेतावनी को सहज हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शाब्दिक संभावनाएँ सुरक्षित रखती है।
- source_word: גַּם אַתֶּם גַּם מַלְכְּכֶם
  choice: तुम और तुम्हारा राजा—दोनों
  rationale: दो बार प्रयुक्त גַּם प्रजा और राजा, दोनों को न्याय की चेतावनी में सम्मिलित करता है; यह हिन्दी विन्यास उसी संयुक्त बल को स्पष्ट रखता है।
- source_word: תִּסָּפוּ
  choice: मिटा दिए जाओगे
  rationale: ספה के निफ़अल रूप में निष्क्रिय रूप से नष्ट किए जाने, मिटा दिए जाने या विनाश में बहा ले जाए जाने का भाव हो सकता है। ‘मिटा दिए जाओगे’ गंभीर न्याय और निष्क्रियता को स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: प्रजा और राजा पर घोषित न्याय का स्वरूप
  choice: प्रजा और राजा दोनों को मिटा दिए जाने की व्यापक न्याय-संबंधी चेतावनी
  alternative: केवल सैनिक पराजय; केवल आत्मिक विनाश
  rationale: इब्रानी पद न्याय के सटीक माध्यम को निर्धारित नहीं करता। इसलिए अनुवाद चेतावनी की गंभीरता बनाए रखता है, पर उसे केवल सैनिक या केवल आत्मिक परिणाम तक सीमित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गंभीर और गरिमापूर्ण चेतावनी। ‘करते ही रहोगे’ बलयुक्त इब्रानी रचना को सहज ढंग से व्यक्त करता है; डैश और ‘दोनों’ प्रजा तथा राजा के समान समावेश पर जोर देते हैं।
