  text: גַּם עַתָּה֙ הִתְיַצְּב֣וּ וּ/רְא֔וּ אֶת הַ/דָּבָ֥ר הַ/גָּד֖וֹל הַ/זֶּ֑ה אֲשֶׁ֣ר יְהוָ֔ה עֹשֶׂ֖ה לְ/עֵינֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/016.yaml
  text: Now then[a], stand still and see this great thing that Yahweh is doing before your eyes.
translation:
  language: hi
  text: अब तो तुम खड़े रहो और इस महान कार्य को देखो, जो याहवे[a] तुम्हारी आँखों के सामने कर रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: “YHWH”; परंपरागत रूप से “प्रभु” के रूप में अनूदित।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक रूप की जानकारी
lexical_decisions:
- source_word: גַּם עַתָּה
  choice: अब
  rationale: यह पदबंध यहाँ अगले गंभीर आह्वान की ओर संक्रमण कराता है। हिंदी में “अब” स्वाभाविक रूप से यह संक्रमण व्यक्त करता है; “यहाँ तक कि अब” अनावश्यक रूप से शाब्दिक और असहज होता।
- source_word: הִתְיַצְּבוּ
  choice: स्थिर खड़े रहो
  rationale: हित्पएल आज्ञार्थक रूप लोगों को अपनी जगह खड़े होकर ध्यानपूर्वक देखने के लिए बुलाता है। “स्थिर खड़े रहो” शारीरिक मुद्रा और प्रतीक्षा—दोनों भाव रखता है।
- source_word: וּרְאוּ
  choice: देखो
  rationale: आज्ञार्थक क्रिया लोगों को होने वाले चिह्न का प्रत्यक्ष साक्षी बनने के लिए बुलाती है; “देखो” इसका सीधा और स्वाभाविक हिंदी रूप है।
- source_word: הַדָּבָר הַגָּדוֹל הַזֶּה
  choice: इस महान काम
  rationale: דָּבָר का अर्थ बात, विषय, घटना या काम हो सकता है। यहाँ यह याहवे द्वारा किए जाने वाले असाधारण कार्य को बताता है; “महान काम” संदर्भ में स्पष्ट है, पर घटना की प्रकृति को जरूरत से अधिक निर्दिष्ट नहीं करता।
- source_word: אֲשֶׁר יְהוָה עֹשֶׂה
  choice: जो याहवे … कर रहा है
  rationale: עֹשֶׂה कृदंत क्रिया को निकट और आरंभ होती हुई घटना के रूप में जीवंत बनाता है। हिंदी का वर्तमान अपूर्ण “कर रहा है” इस रूप को “करेगा” की अपेक्षा अधिक निकटता से दर्शाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिंदी में उसके प्रचलित ध्वन्यात्मक रूप “याहवे” से व्यक्त किया गया है।
- source_word: לְעֵינֵיכֶם
  choice: तुम्हारी आँखों के सामने
  rationale: यह इब्रानी मुहावरा सार्वजनिक और प्रत्यक्ष रूप से दिखाई देने वाली घटना पर बल देता है; हिंदी में “तुम्हारी आँखों के सामने” वही जीवंत अर्थ देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम יְהוָה है। “याहवे” नाम को बनाए रखता है, जबकि “प्रभु” उसे एक उपाधि से बदल देता है; परंपरागत पाठकों की सहायता के लिए विकल्प पाद-टिप्पणी में दिया गया है।
- issue: עֹשֶׂה की कालगत अभिव्यक्ति
  choice: कर रहा है
  alternative: करेगा
  rationale: संदर्भ में घटना तुरंत होने वाली है, फिर भी इब्रानी कृदंत उसे वक्ता की दृष्टि से आरंभ होती या सामने घटती हुई क्रिया के रूप में प्रस्तुत करता है। इसलिए भविष्यकाल लगाकर तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गंभीर और सार्वजनिक संबोधन के अनुकूल शैली रखी गई है। बहुवचन संबोधन के लिए “तुम” का प्रयोग स्वाभाविक सामुदायिक संबोधन के रूप में किया गया है; वाक्य में मूल की आज्ञात्मकता और प्रत्यक्ष-दर्शन का बल सुरक्षित है।
