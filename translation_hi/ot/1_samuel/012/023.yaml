base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/023.yaml
  text: As for me[a], far be it from me that I should sin against Yahweh by ceasing to pray for you[c][b]; and I will instruct you in the good and upright way.
translation:
  language: hi
  text: जहाँ तक मेरी बात है, मुझसे ऐसा कभी न हो कि मैं तुम्हारे लिए प्रार्थना करना छोड़कर याहवे[a] के विरुद्ध पाप करूँ। मैं तुम्हें भला और सीधा मार्ग सिखाऊँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ परमेश्वर का व्यक्तिगत नाम YHWH है, जिसका लिप्यंतरण ‘याहवे’ किया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: גַּם אָנֹכִי
  choice: जहाँ तक मेरी बात है
  rationale: यह पदबंध प्रथम पुरुष पर बल देता है और लोगों की जिम्मेदारी के सामने शमूएल की अपनी जिम्मेदारी को उभारता है। यह हिन्दी में स्वाभाविक ढंग से उस बल और विरोध को व्यक्त करता है।
- source_word: חָלִילָה לִּי
  choice: मुझसे ऐसा कभी न हो
  rationale: यह इब्रानी मुहावरा किसी बात का प्रबल निषेध और उससे घृणापूर्वक दूरी व्यक्त करता है। चुना गया हिन्दी रूप उसी तीव्रता को स्वाभाविक भाषा में रखता है।
- source_word: מֵחֲטֹא לַיהוָה
  choice: याहवे के विरुद्ध पाप करूँ
  rationale: मूल पाठ इसे केवल कर्तव्य की उपेक्षा नहीं, बल्कि याहवे के विरुद्ध पाप के रूप में स्पष्ट करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह इब्रानी चतुरक्षरीय व्यक्तिगत नाम YHWH का हिन्दी लिप्यंतरण है; इसे किसी उपाधि से नहीं बदला गया है।
- source_word: מֵחֲדֹל לְהִתְפַּלֵּל בַּעַדְכֶם
  choice: तुम्हारे लिए प्रार्थना करना छोड़कर
  rationale: यह स्पष्ट करता है कि जिस पाप की बात हो रही है, वह लोगों की ओर से मध्यस्थ प्रार्थना करना बंद कर देना है।
- source_word: וְהוֹרֵיתִי אֶתְכֶם
  choice: मैं तुम्हें ... सिखाऊँगा
  rationale: ירה का हिफ़ील रूप सिखाने, निर्देश देने और मार्ग दिखाने का अर्थ रख सकता है। इस प्रसंग में ‘सिखाऊँगा’ सहज है और भविष्य की प्रतिज्ञा को स्पष्ट रखता है।
- source_word: בְּדֶרֶךְ הַטּוֹבָה וְהַיְשָׁרָה
  choice: भला और सीधा मार्ग
  rationale: ‘मार्ग’ जीवन और आचरण का मूल रूपक बनाए रखता है; ‘भला’ और ‘सीधा’ क्रमशः नैतिक अच्छाई और खराई को व्यक्त करते हैं।
theological_decisions:
- issue: लोगों के लिए मध्यस्थ प्रार्थना बंद करने का स्वरूप
  choice: इसे स्पष्ट रूप से याहवे के विरुद्ध पाप कहा गया है
  alternative: इसे केवल नेतृत्व के कर्तव्य की उपेक्षा कहना
  rationale: मूल इब्रानी पाठ सीधे ‘याहवे के विरुद्ध पाप’ कहता है; इसे केवल लापरवाही कहना कथन के धार्मिक और नैतिक भार को घटा देगा।
- issue: יְהוָה नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है। ‘याहवे’ उसका व्यापक रूप से मान्य लिप्यंतरण है और नाम तथा उपाधि के बीच भेद बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य शैली रखी गई है। ‘मुझसे ऐसा कभी न हो’ मूल मुहावरे के प्रबल निषेध को व्यक्त करता है, और ‘भला और सीधा मार्ग’ मूल नैतिक रूपक को बनाए रखता है।
