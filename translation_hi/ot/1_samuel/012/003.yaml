base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/003.yaml
  text: 'Here I am[a]; testify against me before Yahweh and before his anointed: whose ox have I taken, or whose donkey have I taken? Whom have I oppressed? Whom have I mistreated? From whose hand have I taken a bribe[b], that I should hide my eyes with it? I will restore it to you.'
translation:
  language: hi
  text: '“मैं यहाँ हूँ। याहवे और उसके अभिषिक्त के सामने मेरे विरुद्ध गवाही दो: मैंने किसका बैल लिया है? मैंने किसका गधा लिया है? मैंने किस पर अत्याचार किया है? मैंने किसे कुचला[a] है? मैंने किसके हाथ से घूस[b] ली है कि उसके कारण अपनी आँखें मूँद लूँ? मैं उसे तुम्हें लौटा दूँगा।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ प्रयुक्त इब्रानी क्रिया कठिन है। इसका अर्थ “कुचलना” हो सकता है और व्यापक रूप से किसी को दबाने, सताने या उसके साथ दुर्व्यवहार करने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “घूस” के लिए प्रयुक्त इब्रानी शब्द का अर्थ “छुड़ौती” या “भुगतान” भी हो सकता है; पर यहाँ उसके कारण आँखें मूँद लेने का संदर्भ न्याय को बिगाड़ने वाले भ्रष्ट भुगतान की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: मैं यहाँ हूँ
  rationale: यह प्रत्यक्ष आत्म-प्रस्तुति का स्वाभाविक आधुनिक हिन्दी रूप है और सार्वजनिक रूप से उत्तर देने की तत्परता व्यक्त करता है।
- source_word: עֲנוּ בִי
  choice: मेरे विरुद्ध गवाही दो
  rationale: याहवे और राजा के सामने सार्वजनिक जवाबदेही के इस न्यायिक संदर्भ में क्रिया का अर्थ साक्षी के रूप में उत्तर देना है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम को उपाधि से बदलने के बजाय नाम के रूप में लिप्यंतरित किया गया है।
- source_word: מְשִׁיחוֹ
  choice: उसके अभिषिक्त
  rationale: यहाँ तत्काल संदर्भ अभिषिक्त राजा का है; यह रूप मूल शब्द का अर्थ रखता है, पर बाद की विशिष्ट मसीही उपाधि को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: עָשַׁקְתִּי
  choice: मैंने किस पर अत्याचार किया है
  rationale: क्रिया सामाजिक या आर्थिक शोषण और उत्पीड़न का व्यापक नैतिक-न्यायिक भाव व्यक्त करती है।
- source_word: רַצּוֹתִי
  choice: मैंने किसे कुचला है
  rationale: दुर्बोध क्रिया के ठोस और कठोर भाव को बनाए रखते हुए इसे पिछली क्रिया ‘अत्याचार किया’ से अलग रखा गया है; व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: כֹפֶר
  choice: घूस
  rationale: शब्द अन्य संदर्भों में छुड़ौती या भुगतान हो सकता है, पर यहाँ भुगतान लेकर आँखें मूँदने का न्यायिक संदर्भ भ्रष्ट भुगतान का संकेत देता है।
- source_word: אַעְלִים עֵינַי בּוֹ
  choice: उसके कारण अपनी आँखें मूँद लूँ
  rationale: आँखों की मूल उपमा और भुगतान के कारण जानबूझकर अन्याय को अनदेखा करने का भाव दोनों सुरक्षित रहते हैं।
- source_word: וְאָשִׁיב לָכֶם
  choice: मैं तुम्हें लौटा दूँगा
  rationale: मूल में कर्म स्पष्ट नहीं है; हिन्दी में भी उसे अनिर्दिष्ट रखकर सम्भावित गलत ढंग से ली गई वस्तु या रकम की व्यापकता बनाए रखी गई है।
theological_decisions:
- issue: परमेश्वर-नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ स्पष्ट रूप से चतुरक्षरीय परमेश्वर-नाम का प्रयोग करता है; ‘याहवे’ उसे नाम के रूप में प्रस्तुत करता है, सामान्य उपाधि के रूप में नहीं।
- issue: מְשִׁיחוֹ का राजकीय संदर्भ
  choice: उसके अभिषिक्त
  alternative: उसके मसीह
  rationale: इस ऐतिहासिक प्रसंग में संकेत तत्कालीन अभिषिक्त राजा की ओर है। ‘अभिषिक्त’ शब्दार्थ और भावी धर्मवैज्ञानिक संबंध दोनों को खुला रखता है, बिना इस पद को सीधे बाद की विशिष्ट मसीही उपाधि बना देने के।
translation_notes:
  register: भाषा आधुनिक, सार्वजनिक और गरिमापूर्ण रखी गई है। शमूएल के प्रश्नों की आवृत्ति को बनाए रखा गया है। कठिन क्रिया के ठोस रूप ‘कुचला’ को मुख्य पाठ में रखकर उसकी व्यापक सम्भावना पादटिप्पणी में दी गई है। अंग्रेज़ी परामर्श-पाठ में [a] का स्थान ‘Here I am’ के बाद था, पर उसकी पादटिप्पणी वास्तव में רַצּוֹתִי से संबंधित है; इसलिए हिन्दी में चिह्न उसी संबंधित शब्द के बाद रखा गया है।
