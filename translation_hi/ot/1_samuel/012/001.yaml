translation:
  language: hi
  text: तब शमूएल ने सारे इस्राएल से कहा, “देखो, तुमने मुझसे जो कुछ कहा, वह सब मैंने मान लिया है, और तुम्हारे ऊपर एक राजा ठहराया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שָׁמַעְתִּי בְקוֹלְכֶם
  choice: मैंने तुम्हारी बात मानी है
  rationale: यह इब्रानी मुहावरा केवल सुनने के बजाय अनुरोध स्वीकार करने या बात मानने का भाव व्यक्त करता है।
- source_word: וָאַמְלִיךְ עֲלֵיכֶם מֶלֶךְ
  choice: तुम्हारे ऊपर एक राजा को राज्य करने के लिए नियुक्त किया है
  rationale: हिफ़ील रूप का कारणवाचक अर्थ—किसी को राजा बनाकर शासन कराना—स्पष्ट रखते हुए स्वाभाविक हिन्दी दी गई है।
- source_word: הִנֵּה
  choice: देखो
  rationale: वक्ता के कथन पर ध्यान खींचने वाले संकेतक का सीधा और प्रचलित हिन्दी समतुल्य।
- source_word: כָּל יִשְׂרָאֵל
  choice: सारे इस्राएल
  rationale: सामूहिक रूप से इस्राएल की प्रजा को संबोधित करने वाला स्वाभाविक अनुवाद।
theological_decisions:
- issue: राजा स्थापित करने में शमूएल की भूमिका
  choice: राजा को राज्य करने के लिए नियुक्त किया है
  alternative: मैंने तुम्हारे ऊपर एक राजा बनाया है
  rationale: पाठ शमूएल की कार्यकारी भूमिका व्यक्त करता है, पर इसे स्वतंत्र सार्वभौम सत्ता के दावे में नहीं बदलता; कारणवाचक इब्रानी को सुरक्षित रखा गया है।
translation_notes:
