  text: וְ/עַתָּ֗ה הִֽתְיַצְּב֛וּ וְ/אִשָּׁפְטָ֥ה אִתְּ/כֶ֖ם לִ/פְנֵ֣י יְהוָ֑ה אֵ֚ת כָּל צִדְק֣וֹת יְהוָ֔ה אֲשֶׁר עָשָׂ֥ה אִתְּ/כֶ֖ם וְ/אֶת אֲבוֹתֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/007.yaml
  text: Now therefore[a], stand here[b], and I will contend with you before Yahweh concerning all the righteous acts of Yahweh that he did for you and for your fathers.
translation:
  language: hi
  text: अब खड़े हो जाओ; मैं याहवे के सामने तुम्हारे साथ वाद करूँगा[a], याहवे के उन सब न्यायपूर्ण कार्यों[b] के विषय में जो उसने तुम्हारे और तुम्हारे पूर्वजों के लिए किए हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘तुम्हारा न्याय करूँगा’, ‘तुम्हारे साथ तर्क करूँगा’ या ‘तुम्हारे सामने अपना मामला रखूँगा’ भी हो सकता है। इब्रानी अभिव्यक्ति में याहवे के सामने न्यायिक मामला उठाने का भाव है।
    reason: lexical_alternative
  - marker: b
    text: ‘न्यायपूर्ण कार्य’ से आशय याहवे के वे न्यायपूर्ण और वाचा-निष्ठ कार्य हैं जो उसने अपने लोगों के लिए किए।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से निष्कर्ष और भाषण में नए चरण—दोनों को चिह्नित करता है; इसलिए यह रूप केवल ‘अब’ से अधिक पूर्ण है।
- source_word: הִתְיַצְּבוּ
  choice: खड़े हो जाओ
  rationale: बहुवचन आज्ञार्थक रूप श्रोताओं को औपचारिक कार्यवाही के लिए उपस्थित होकर अपना स्थान लेने को कहता है; आधुनिक हिन्दी में यह सहज है।
- source_word: וְאִשָּׁפְטָה אִתְּכֶם
  choice: तुम्हारे साथ वाद करूँगा
  rationale: यहाँ שפט का प्रयोग न्यायिक विवाद या मामला प्रस्तुत करने के अर्थ में है, केवल दंडादेश सुनाने के अर्थ में नहीं। ‘वाद करूँगा’ उस न्यायिक भाव को संक्षेप और स्वाभाविक ढंग से रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह वाचा और न्यायिक प्रसंग में परमेश्वर की उपस्थिति के सामने होने वाली कार्यवाही को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी विशिष्ट नाम יהוה का निकट हिन्दी लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֵת כָּל צִדְקוֹת יְהוָה
  choice: याहवे के उन सब धर्ममय कामों के विषय में
  rationale: बहुवचन צִדְקוֹת यहाँ इतिहास में किए गए ठोस, न्यायपूर्ण और वाचा-निष्ठ कार्यों को बताता है; ‘धर्ममय काम’ इस अर्थ को ‘उद्धार के काम’ जैसे अधिक संकुचित अर्थ में नहीं बाँधता।
- source_word: אֲשֶׁר עָשָׂה
  choice: जो उसने ... किए हैं
  rationale: सामान्य क्रिया עשה को सरल और वर्तमान हिन्दी में प्रस्तुत किया गया है; पूर्ण पक्ष पिछले कार्यों की वर्तमान प्रासंगिकता को भी स्वीकार करता है।
- source_word: אִתְּכֶם וְאֶת אֲבוֹתֵיכֶם
  choice: तुम्हारे और तुम्हारे पुरखों के लिए
  rationale: मूल पूर्वसर्ग का शाब्दिक अर्थ ‘के साथ’ हो सकता है, पर यहाँ याहवे के हितकारी कार्य अभिप्रेत हैं; ‘के लिए’ प्रसंगगत लाभार्थक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। ‘पुरखे’ पैतृक पूर्वजों के सामूहिक अर्थ को रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ वाचा का विशिष्ट नाम सीधे प्रयोग करता है। ‘याहवे’ उस नाम को सुरक्षित रखता है और उसे उपाधि में नहीं बदलता।
- issue: צִדְקוֹת יְהוָה का आशय
  choice: याहवे के धर्ममय काम
  alternative: याहवे के उद्धार के काम; याहवे के न्यायपूर्ण कार्य
  rationale: वाक्यांश याहवे के न्यायपूर्ण और वाचा-निष्ठ ऐतिहासिक कार्यों की ओर संकेत करता है। ‘धर्ममय काम’ मूल की धार्मिकता-संबंधी शब्दावली को बनाए रखता है, जबकि उसे केवल उद्धार तक सीमित नहीं करता।
- issue: שפט का न्यायिक बल
  choice: तुम्हारे साथ वाद करूँगा
  alternative: तुम्हारा न्याय करूँगा; तुम्हारे साथ तर्क करूँगा; तुम्हारे सामने अपना मामला रखूँगा
  rationale: प्रसंग में शमूएल याहवे के सामने इस्राएल के साथ औपचारिक मामला उठाता है। चुना हुआ रूप दोषसिद्धि या दंड को पहले से निश्चित किए बिना न्यायिक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सम्मानपूर्ण किंतु सामान्य पाठक के लिए सुबोध रखी गई है। न्यायिक प्रसंग के लिए ‘वाद’ चुना गया है; कठिन शब्द को पाद-टिप्पणी में स्पष्ट किया गया है। दोनों पाद-टिप्पणी चिह्न संबंधित पदांशों पर ही लगाए गए हैं।
