  text: וַ/יֹּ֨אמֶר אֲלֵי/הֶ֜ם עֵ֧ד יְהוָ֣ה בָּ/כֶ֗ם וְ/עֵ֤ד מְשִׁיח/וֹ֙ הַ/יּ֣וֹם הַ/זֶּ֔ה כִּ֣י לֹ֧א מְצָאתֶ֛ם בְּ/יָדִ֖/י מְא֑וּמָה וַ/יֹּ֖אמֶר עֵֽד׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/005.yaml
  text: And he said to them[a], “Yahweh is witness against you, and his anointed is witness this day, that you have found nothing in my hand.” And they said[c][b], “He is witness.”
translation:
  language: hi
  text: तब उसने उनसे कहा[a], “यहोवा आज तुम्हारे विरुद्ध साक्षी है, और उसका अभिषिक्त जन[b] भी साक्षी है कि तुमने मेरे हाथ में कुछ भी नहीं पाया।” तब उन्होंने कहा[c], “वह साक्षी है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से, “यहोवा तुम्हारे बीच/तुम्हारे साथ साक्षी है।” प्रसंग में भाव न्यायिक है: यहोवा उनसे संबंधित मामले में साक्षी ठहरता है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उसका अभिषिक्त”; यहाँ इसका संकेत राजा शाऊल की ओर है, बाद की विशिष्ट ‘मसीह’ उपाधि की ओर सीधे नहीं।
    reason: cultural_note
  - marker: c
    text: अंतिम इब्रानी क्रिया एकवचन है—“उसने कहा”; पर प्रसंग में यह लोगों की सामूहिक प्रतिक्रिया के रूप में प्रयुक्त है, इसलिए “उन्होंने कहा।”
    reason: textual_note
lexical_decisions:
- source_word: עֵד
  choice: साक्षी
  rationale: यह संज्ञा कानूनी या वाचागत प्रसंग में गवाही देने वाले व्यक्ति को दर्शाती है; शमूएल के सार्वजनिक निर्दोषता-प्रतिपादन में ‘साक्षी’ स्वाभाविक और सटीक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित देवनागरी रूप ‘यहोवा’ को रखा गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: בָּכֶם
  choice: तुम्हारे विरुद्ध
  rationale: עֵד के साथ न्यायिक प्रसंग में इसका भाव मामले में उनके विरुद्ध साक्षी होने का है; अधिक शाब्दिक ‘तुम्हारे बीच/साथ’ की संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מְשִׁיחוֹ
  choice: उसका अभिषिक्त जन
  rationale: यहाँ संकेत नवस्थापित राजा शाऊल की ओर है। यह अनुवाद मूल शब्द का अर्थ बनाए रखता है और बाद की विशिष्ट मसीही उपाधि को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: आधुनिक हिन्दी में ‘आज’ सार्वजनिक घोषणा के समय-संदर्भ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְצָאתֶם
  choice: तुमने ... नहीं पाया
  rationale: पूर्ण हुई जाँच और वर्तमान घोषणा का भाव हिन्दी के सामान्य पूर्ण भूत रूप में स्वाभाविक रूप से आता है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: मूल का मुहावरा सुरक्षित रखा गया है; हिन्दी में भी यह कब्जे या अधिकार में होने का बोध दे सकता है और न्यायिक स्वर बनाए रखता है।
- source_word: מְאוּמָה
  choice: कुछ भी नहीं
  rationale: निषेध के साथ इसका अर्थ ‘कोई भी वस्तु/बात नहीं’ है; ‘कुछ भी नहीं’ आधुनिक हिन्दी में सहज है।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: उसने कहा ... उन्होंने कहा
  rationale: पहला एकवचन शमूएल के लिए है। अंतिम क्रिया रूपतः एकवचन है, पर प्रसंग में जनता की सामूहिक प्रतिक्रिया दर्शाता है; इस रूपगत तनाव को पादटिप्पणी में बताया गया है।
theological_decisions:
- issue: गैर-अंतकालिक राजकीय प्रसंग में מְשִׁיחוֹ का अनुवाद
  choice: उसका अभिषिक्त जन
  alternative: उसका मसीह
  rationale: तात्कालिक संदर्भ में यह वर्तमान राजा शाऊल को दर्शाता है। ‘अभिषिक्त जन’ मूल अर्थ को सुरक्षित रखता है और ऐसा विशिष्ट मसीही अर्थ आरोपित नहीं करता जिसकी इस पद में आवश्यकता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक न्यायिक घोषणा के अनुकूल रखी गई है। ‘मेरे हाथ में’ जैसे बोधगम्य मूल मुहावरे को सुरक्षित रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
