base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/018.yaml
  text: Then Samuel called to Yahweh[a], and Yahweh sent thunder and rain that day; and all the people greatly feared Yahweh and Samuel.
translation:
  language: hi
  text: तब शमूएल ने याहवे को पुकारा, और याहवे ने उस दिन गर्जन और वर्षा भेजे। और सभी लोग याहवे और शमूएल से बहुत डर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּקְרָא ... אֶל־יְהוָה
  choice: याहवे को पुकारा
  rationale: קרא אל का अर्थ यहाँ प्रार्थना में किसी को पुकारना है। यह प्रयोग सीधा और स्वाभाविक है तथा पुकारने के ढंग में अनावश्यक तीव्रता नहीं जोड़ता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וַיִּתֵּן
  choice: भेजी
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘दी’ है, पर आँधी-वर्षा के प्रसंग में हिंदी में ‘गरज और वर्षा भेजी’ कारणात्मक भाव को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קֹלוֹת
  choice: गरज
  rationale: इस शब्द का मूल अर्थ ‘आवाज़ें’ है, किंतु वर्षा के साथ तूफ़ानी प्रसंग में यह बादल की गरज को सूचित करता है।
- source_word: וּמָטָר
  choice: और वर्षा
  rationale: מָטָר का सीधा और गरिमापूर्ण हिंदी रूप ‘वर्षा’ है; मूल पाठ से अधिक तीव्रता नहीं जोड़ी गई।
- source_word: וַיִּירָא ... מְאֹד
  choice: बहुत डर गए
  rationale: यह अभिव्यक्ति ירא के वास्तविक भय और מְאֹד की तीव्रता—दोनों को सामान्य आधुनिक हिंदी में बनाए रखती है।
- source_word: כָל־הָעָם
  choice: सभी लोग
  rationale: यह सामूहिक व्यापकता को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶת־יְהוָה וְאֶת־שְׁמוּאֵל
  choice: याहवे और शमूएल से
  rationale: एक ही क्रिया के दोनों कर्मों को समानांतर रखा गया है; पाठ में निहित तनाव को अलग-अलग ‘भय’ और ‘आदर’ में बाँटकर नहीं सुलझाया गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; इसलिए उसे उपाधि से प्रतिस्थापित किए बिना लिप्यंतरित किया गया है।
- issue: याहवे और शमूएल दोनों से लोगों का डरना
  choice: याहवे और शमूएल से बहुत डर गए
  alternative: याहवे से डरे और शमूएल का आदर किया
  rationale: इब्रानी में एक ही क्रिया दोनों के लिए प्रयुक्त हुई है। चुना हुआ पाठ उस समान व्याकरणिक संरचना और उसके धार्मिक तनाव को सुरक्षित रखता है, बिना दोनों को समान दर्जा देने या अर्थ को कृत्रिम रूप से अलग करने के।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सहज किंतु गरिमापूर्ण रखी गई है। ‘वर्षा’ औपचारिक स्पष्टता देता है, जबकि ‘बहुत डर गए’ सामान्य पाठक के लिए स्वाभाविक है। दोनों वाक्यांशों में ‘तब’ घटनाक्रम को स्पष्ट करता है।
