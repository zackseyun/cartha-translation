reference: 1 Samuel 12:11
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּשְׁלַ֤ח יְהוָה֙ אֶת יְרֻבַּ֣עַל וְ/אֶת בְּדָ֔ן וְ/אֶת יִפְתָּ֖ח וְ/אֶת שְׁמוּאֵ֑ל וַ/יַּצֵּ֨ל אֶתְ/כֶ֜ם מִ/יַּ֤ד אֹֽיְבֵי/כֶם֙ מִ/סָּבִ֔יב וַ/תֵּשְׁב֖וּ בֶּֽטַח־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/011.yaml
  text: And Yahweh sent Jerubbaal and Bedan and Jephthah and Samuel[a], and he delivered you from the hand of your enemies all around[b], and you lived in safety.
translation:
  language: hi
  text: और याहवे ने यरुब्बाल[a], बदान[b], यिप्तह और शमूएल को भेजा। उसने तुम्हें चारों ओर के तुम्हारे शत्रुओं के हाथ से छुड़ाया, और तुम सुरक्षित रहने लगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यरुब्बाल, गिदोन का दूसरा नाम है (देखें न्यायियों 6:32; 7:1)।
    reason: cross_reference
  - marker: b
    text: इब्रानी पाठ में ‘बदान’ है। इसकी पहचान निश्चित नहीं है; कुछ व्याख्याकार इसे बाराक और कुछ, कम प्रचलित मत के अनुसार, अब्दोन समझते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के विशिष्ट इब्रानी नाम को लिप्यंतरित करके मूल पाठ का भेद बनाए रखा गया है।
- source_word: וַיִּשְׁלַח
  choice: भेजा
  rationale: इस प्रसंग में שׁלח का सीधा और स्वाभाविक अर्थ ‘भेजना’ है।
- source_word: יְרֻבַּעַל
  choice: यरुब्बाल
  rationale: मूल पाठ में दिए गए नाम को बनाए रखा गया है; गिदोन के साथ उसकी पहचान पादटिप्पणी में स्पष्ट की गई है।
- source_word: בְּדָן
  choice: बदान
  rationale: मसोरेटिक पाठ के नाम को बिना संशोधन के रखा गया है; अनिश्चित पहचान और प्रस्तावित विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: יִפְתָּח
  choice: यिप्तह
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: וַיַּצֵּל
  choice: छुड़ाया
  rationale: נצל यहाँ संकट और शत्रुओं के अधिकार से बचाने अथवा छुड़ाने को व्यक्त करता है।
- source_word: מִיַּד אֹיְבֵיכֶם
  choice: तुम्हारे शत्रुओं के हाथ से
  rationale: शक्ति और नियंत्रण दर्शाने वाले इब्रानी ‘हाथ’ के रूपक को स्पष्ट हिंदी में सुरक्षित रखा गया है।
- source_word: מִסָּבִיב
  choice: चारों ओर के
  rationale: यह आसपास से घेरने वाले शत्रुओं की स्थानिक धारणा को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וַתֵּשְׁבוּ בֶּטַח
  choice: तुम सुरक्षित रहने लगे
  rationale: ישׁב यहाँ बसे हुए जीवन और בטח भय से मुक्त सुरक्षा को दर्शाता है; यह अभिव्यक्ति आधुनिक हिंदी में सहज है।
theological_decisions:
- issue: בְּדָן की पहचान
  choice: मुख्य पाठ में मसोरेटिक पाठ के अनुसार ‘बदान’ रखा गया है।
  alternative: बाराक या, कम प्रचलित मत के अनुसार, अब्दोन
  rationale: मूल इब्रानी पाठ की कठिनाई को किसी अन्य न्यायी के नाम से चुपचाप सामंजस्यित करने के बजाय सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य-संयोजन में इब्रानी के क्रमिक ‘और’ का आशय सुरक्षित है, जबकि हिंदी में पठनीयता के लिए पहले खंड के बाद पूर्ण विराम रखा गया है।
