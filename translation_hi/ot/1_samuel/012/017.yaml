source:
  edition: WLC
  text: הֲ/ל֤וֹא קְצִיר חִטִּים֙ הַ/יּ֔וֹם אֶקְרָא֙ אֶל יְהוָ֔ה וְ/יִתֵּ֥ן קֹל֖וֹת וּ/מָטָ֑ר וּ/דְע֣וּ וּ/רְא֗וּ כִּֽי רָעַתְ/כֶ֤ם רַבָּה֙ אֲשֶׁ֤ר עֲשִׂיתֶם֙ בְּ/עֵינֵ֣י יְהוָ֔ה לִ/שְׁא֥וֹל לָ/כֶ֖ם מֶֽלֶךְ־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/012/017.yaml
  text: Is it not wheat harvest today? I will call to Yahweh[a], and he will send thunder and rain, so that you may know and see that your wickedness is great[b], which you have done in the sight of Yahweh by asking for yourselves a king.
translation:
  language: hi
  text: क्या आज गेहूँ की कटनी का समय नहीं है? मैं यहोवा[a] को पुकारूँगा, और वह गरज और वर्षा भेजेगा। तब जानो और देखो कि तुमने अपने लिए राजा माँगकर यहोवा की दृष्टि में बड़ी बुराई की है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ईश्वरीय नाम के इब्रानी अक्षर יהוה (YHWH) हैं; इसका संभावित उच्चारण “याहवे” है।
    reason: divine_name
lexical_decisions:
- source_word: הֲלוֹא קְצִיר חִטִּים הַיּוֹם
  choice: क्या आज गेहूँ की कटनी का समय नहीं है?
  rationale: प्रश्नवाचक बल और सहमति की अपेक्षा को बनाए रखते हुए, हिन्दी में कृषि-ऋतु का स्वाभाविक संकेत दिया गया है।
- source_word: אֶקְרָא אֶל יְהוָה
  choice: मैं यहोवा को पुकारूँगा
  rationale: קרא אל का अर्थ यहाँ प्रार्थनापूर्वक पुकारना है; ‘को पुकारूँगा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְיִתֵּן קֹלוֹת וּמָטָר
  choice: और वह गरज और वर्षा भेजेगा
  rationale: נתן का मूल अर्थ ‘देना’ है, पर मौसम के संदर्भ में हिन्दी में ‘भेजना’ स्वाभाविक है। קֹלוֹת शाब्दिक रूप से ‘आवाज़ें’ है, किंतु तूफ़ानी मौसम में इसका आशय गरज है।
- source_word: וּדְעוּ וּרְאוּ
  choice: तब तुम जानोगे और देखोगे
  rationale: दोनों समन्वित क्रियाओं को रखा गया है; ‘तब’ आने वाले चिन्ह के परिणाम को स्पष्ट करता है।
- source_word: כִּי רָעַתְכֶם רַבָּה
  choice: कि ... तुमने ... कितनी बड़ी बुराई की है
  rationale: רָעָה यहाँ नैतिक बुराई को दर्शाता है और רַבָּה उसकी गंभीरता पर बल देता है; हिन्दी वाक्य-विन्यास में संबंधवाचक संरचना को स्वाभाविक रूप से समेटा गया है।
- source_word: בְּעֵינֵי יְהוָה
  choice: यहोवा की दृष्टि में
  rationale: इब्रानी मुहावरे का प्रचलित और गरिमापूर्ण हिन्दी समतुल्य, जिसमें ईश्वरीय मूल्यांकन का भाव बना रहता है।
- source_word: לִשְׁאֹל לָכֶם מֶלֶךְ
  choice: अपने लिए राजा माँगकर
  rationale: लोगों की अपनी माँग और उसके नैतिक संबंध को संक्षेप तथा स्पष्ट रूप में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है, इसलिए उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबल पाठकों में स्थापित रूप ‘यहोवा’ चुना गया है; उच्चारण-पुनर्निर्माण ‘याहवे’ को पादटिप्पणी में बताया गया है।
- issue: राजा माँगने की नैतिक गंभीरता
  choice: कितनी बड़ी बुराई की है
  alternative: तुम्हारी बुराई बड़ी है, जो तुमने की है
  rationale: मूल पाठ इस माँग को यहोवा की दृष्टि में गंभीर नैतिक बुराई कहता है। अनुवाद उस आरोप को न तो हल्का करता है, न उससे आगे कोई सांप्रदायिक निष्कर्ष जोड़ता है।
translation_notes:
  register: भाषा आधुनिक, सुबोध और गरिमापूर्ण रखी गई है। ‘गेहूँ की कटनी का समय’ ऋतु-सूचक अर्थ स्पष्ट करता है; ‘गरज और वर्षा’ मौसम-संदर्भ में קֹלוֹת וּמָטָר का स्वाभाविक हिन्दी रूप है।
