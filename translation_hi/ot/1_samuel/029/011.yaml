base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/011.yaml
  text: So David rose early[a], he and his men, to leave in the morning and return to the land of the Philistines[b]. And the Philistines went up to Jezreel.
translation:
  language: hi
  text: तब दाऊद और उसके लोग तड़के उठे, ताकि सुबह चलकर पलिश्तियों के देश में लौट जाएँ।[a] और पलिश्ती यिज्रेल की ओर चढ़ गए।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शब्दशः: “सुबह जाने और पलिश्तियों के देश में लौटने के लिए।” इब्रानी में यहाँ दो क्रियार्थक रूप हैं।'
    reason: lexical_alternative
  - marker: b
    text: “चढ़ गए” इब्रानी मुहावरे को दर्शाता है, जिसमें किसी स्थान की ओर जाने का स्थलाकृतिक या सैनिक भाव हो सकता है; इसका अनुवाद “यिज्रेल की ओर कूच किया” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם
  choice: तड़के उठे
  rationale: हिफ़ील रूप यहाँ प्रातः जल्दी उठने या जल्दी प्रस्थान की तैयारी करने का भाव देता है; ‘तड़के उठे’ समय के बल को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הוּא וַאֲנָשָׁיו
  choice: दाऊद और उसके लोग
  rationale: यह पदबंध दाऊद और उसके साथ के पुरुषों के दल को सूचित करता है। ‘उसके लोग’ आधुनिक हिंदी में स्वाभाविक है और उन्हें अनावश्यक रूप से सेवक या सैनिक निर्धारित नहीं करता।
- source_word: לָלֶכֶת בַּבֹּקֶר לָשׁוּב
  choice: ताकि सुबह वहाँ से चलकर … लौट जाएँ
  rationale: दोनों क्रियार्थक रूपों के प्रयोजन और क्रम को स्पष्ट रखते हुए ‘चलकर … लौट जाएँ’ स्वाभाविक हिंदी देता है। ‘वहाँ से’ प्रस्थान के प्रसंग में निहित है, यद्यपि इब्रानी में अलग शब्द के रूप में नहीं है।
- source_word: אֶל אֶרֶץ פְּלִשְׁתִּים
  choice: पलिश्तियों के देश में
  rationale: ‘देश’ אֶרֶץ के ठोस भौगोलिक भाव को बनाए रखता है; यहाँ किसी एक नगर के बजाय पलिश्ती क्षेत्र अभिप्रेत है।
- source_word: עָלוּ
  choice: चढ़ गए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है और यहाँ स्थलाकृतिक अथवा सैनिक प्रयाण की छाया हो सकती है। ‘चढ़ गए’ उस इब्रानी मुहावरे को संरक्षित करता है।
- source_word: יִזְרְעֶאל
  choice: यिज्रेल
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
