base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/006.yaml
  text: Then Achish called David and said to him[a], “As Yahweh lives, you are upright, and your going out and your coming in with me in the camp is good in my sight; for I have not found any evil in you from the day of your coming to me to this day. But in the eyes of the lords of the Philistines[c][b], you are not good.”
translation:
  language: hi
  text: तब आकीश ने दाऊद को बुलाकर उससे कहा, “याहवे के जीवन की शपथ, तुम खरे हो। छावनी में मेरे साथ तुम्हारा आना-जाना मेरी दृष्टि में अच्छा है[a], क्योंकि जिस दिन से तुम मेरे पास आए हो, आज तक मैंने तुममें कोई बुराई नहीं पाई। लेकिन पलिश्ती सरदारों[b] की दृष्टि में तुम स्वीकार्य नहीं हो[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “छावनी में मेरे साथ तुम्हारा निकलना और आना मेरी दृष्टि में अच्छा है”; इसका आशय दाऊद की गतिविधि या आचरण से है।
    reason: lexical_alternative
  - marker: b
    text: “सरदार” उस विशिष्ट पदवी का अनुवाद है जो पलिश्ती शासकों के लिए प्रयुक्त होती थी।
    reason: cultural_note
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “तुम अच्छे नहीं हो,” अर्थात पलिश्ती सरदारों की दृष्टि में तुम स्वीकार्य नहीं हो।
    reason: alternative_reading
lexical_decisions:
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह शपथ का प्रचलित इब्रानी सूत्र है। हिन्दी में यह वाक्यांश उसके शपथ-संबंधी बल को स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: יָשָׁר
  choice: खरे
  rationale: यहाँ शब्द नैतिक सच्चाई और विश्वसनीयता दर्शाता है; ‘खरे’ आधुनिक हिन्दी में प्रशंसात्मक भाव को सहजता से पहुँचाता है।
- source_word: טוֹב בְּעֵינַי
  choice: मुझे अच्छा लगा है
  rationale: इब्रानी दृष्टि-आधारित मुहावरे का स्वाभाविक हिन्दी समतुल्य है और आकीश की अनुकूल स्वीकृति व्यक्त करता है।
- source_word: צֵאתְךָ וּבֹאֲךָ
  choice: तुम्हारा आना-जाना
  rationale: मूल के युग्म को बनाए रखता है; प्रसंग में इसका आशय छावनी में दाऊद की गतिविधि या आचरण से है।
- source_word: אִתִּי בַּמַּחֲנֶה
  choice: छावनी में मेरे साथ
  rationale: מַחֲנֶה का सीधा अर्थ ‘छावनी’ है और सैन्य प्रसंग हिन्दी पाठक के लिए स्पष्ट रहता है।
- source_word: לֹא מָצָאתִי בְךָ רָעָה
  choice: मैंने तुममें कोई बुराई नहीं पाई
  rationale: मूल की खोजने/पाने वाली अभिव्यक्ति और רָעָה के नैतिक या दोष-संबंधी बल को सुरक्षित रखता है।
- source_word: סְרָנִים
  choice: पलिश्ती सरदारों
  rationale: यह पलिश्तियों के विशिष्ट शासकीय पद का नाम है; ‘सरदार’ पद-सूचक अर्थ और प्रसंगगत अधिकार दोनों को स्पष्ट करता है।
- source_word: לֹא טוֹב אָתָּה
  choice: तुम स्वीकार्य नहीं हो
  rationale: शाब्दिक ‘तुम अच्छे नहीं हो’ हिन्दी में नैतिक दोष का भ्रामक संकेत दे सकता है; संदर्भ में उनका निर्णय दाऊद की अस्वीकार्यता के विषय में है।
theological_decisions:
- issue: एक पलिश्ती राजा के शपथ-वचन में יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम स्पष्ट रूप से है। ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय नाम के रूप में सुरक्षित रखता है, चाहे वक्ता पलिश्ती राजा ही क्यों न हो।
- issue: לֹא טוֹב אָתָּה का मूल्यांकनात्मक अर्थ
  choice: तुम स्वीकार्य नहीं हो
  alternative: तुम अच्छे नहीं हो
  rationale: यहाँ कथन दाऊद के चरित्र पर आकीश के निर्णय का खंडन नहीं, बल्कि पलिश्ती सरदारों की दृष्टि में उसकी अस्वीकृति बताता है। पादटिप्पणी शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। दाऊद, आकीश, याहवे और पलिश्ती जैसे प्रचलित बाइबिलीय नाम-रूप अपनाए गए हैं। मूल के ‘आना-जाना’ मुहावरे को मुख्य पाठ में रखा गया है और उसका आशय पादटिप्पणी में स्पष्ट किया गया है।
