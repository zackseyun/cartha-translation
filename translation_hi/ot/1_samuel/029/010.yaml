source:
  edition: WLC
  text: וְ/עַתָּה֙ הַשְׁכֵּ֣ם בַּ/בֹּ֔קֶר וְ/עַבְדֵ֥י אֲדֹנֶ֖י/ךָ אֲשֶׁר בָּ֣אוּ אִתָּ֑/ךְ וְ/הִשְׁכַּמְתֶּ֣ם בַּ/בֹּ֔קֶר וְ/א֥וֹר לָ/כֶ֖ם וָ/לֵֽכוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/010.yaml
  text: Now rise early in the morning[a], you and your master's servants who came with you. When you rise early in the morning and it is light for you, go.
translation:
  language: hi
  text: अब तुम और तुम्हारे स्वामी के वे सेवक, जो तुम्हारे साथ आए हैं, सुबह जल्दी उठो। जब तुम सुबह जल्दी उठो और तुम्हारे लिए उजाला हो जाए,[a] तब चले जाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब दिन निकल आए, तब चले जाना” अथवा “भोर होते ही चले जाना।” इब्रानी में शाब्दिक रूप से “और तुम्हारे लिए उजाला हो” है।
    reason: मूल इब्रानी अभिव्यक्ति की शाब्दिक बनावट और उसके अधिक मुहावरेदार अर्थ, दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह वार्तालाप में तत्काल निर्देश की ओर संक्रमण दिखाता है; ‘अब’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַשְׁכֵּם בַּבֹּקֶר
  choice: सुबह जल्दी उठो
  rationale: हिफ़ील आज्ञार्थक रूप जल्दी उठने या जल्दी प्रस्थान की तैयारी करने का भाव देता है; ‘सुबह जल्दी उठो’ समय और क्रिया दोनों को स्पष्ट रखता है।
- source_word: וְעַבְדֵי אֲדֹנֶיךָ
  choice: तुम और तुम्हारे स्वामी के वे सेवक
  rationale: אֲדֹנֶיךָ यहाँ मनुष्य के लिए प्रयुक्त है, इसलिए ‘स्वामी’ उपयुक्त है; समन्वित वाक्यांश को हिन्दी में स्पष्ट करने के लिए ‘तुम और’ रखा गया है।
- source_word: אֲשֶׁר בָּאוּ אִתָּךְ
  choice: जो तुम्हारे साथ आए हैं
  rationale: यह सम्बन्धवाचक उपवाक्य दाऊद के साथ आए सेवकों की पहचान कराता है।
- source_word: וְהִשְׁכַּמְתֶּם בַּבֹּקֶר
  choice: जब तुम सुबह जल्दी उठो
  rationale: संयोजक सहित बहुवचन पूर्ण रूप यहाँ निर्देश की अगली परिस्थिति बताता है; ‘जब’ से उसका कालगत कार्य स्वाभाविक हिन्दी में व्यक्त होता है और मूल की पुनरावृत्ति भी बनी रहती है।
- source_word: וְאוֹר לָכֶם
  choice: और तुम्हारे लिए उजाला हो जाए
  rationale: यह इब्रानी के असामान्य किंतु अर्थपूर्ण ‘और तुम्हारे लिए उजाला हो’ के बहुत निकट है; अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: וָלֵכוּ
  choice: तब चले जाना
  rationale: הלך के बहुवचन आज्ञार्थक का सीधा भाव प्रस्थान करना है; ‘चले जाना’ हिन्दी में स्वाभाविक और स्पष्ट निर्देश है।
