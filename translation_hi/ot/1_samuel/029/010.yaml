translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। मूल में ‘सुबह जल्दी उठने’ की पुनरावृत्ति को बनाए रखा गया है। पहले एकवचन सम्बोधन के साथ सेवकों का उल्लेख और फिर बहुवचन निर्देश हिन्दी में समन्वित बहुवचन क्रिया द्वारा स्पष्ट किया गया है।
