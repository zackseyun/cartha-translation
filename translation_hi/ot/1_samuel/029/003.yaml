base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/003.yaml
  text: Then the Philistine commanders said[a], “What are these Hebrews?” And Achish said to the Philistine commanders, “Is this not David, the servant of Saul king of Israel, who has been with me these days or these years? And I have found nothing against him from the day of his defecting until this very day.”
translation:
  language: hi
  text: तब पलिश्ती सेनापतियों ने कहा, “ये इब्री कौन हैं?” अकीश ने पलिश्ती सेनापतियों से कहा, “क्या यह इस्राएल के राजा शाऊल का सेवक दाऊद नहीं है, जो इतने दिनों या इतने वर्षों से मेरे साथ रहा है? और जिस दिन से वह मेरे पक्ष में आ मिला[a], उस दिन से आज तक मैंने उसमें कोई दोष नहीं पाया।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जिस दिन से वह आ गिरा।” इस मुहावरे का अर्थ किसी के पक्ष में आ मिलना, उसके पास चले आना, या दल बदलकर उसके पास चले जाना हो सकता है।
    reason: मूल इब्रानी मुहावरे की शाब्दिक छवि और उसके विवादरहित प्रसंगगत अर्थ-विकल्प सुरक्षित रखना।
lexical_decisions:
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: पलिश्ती सेनापति
  rationale: युद्ध के प्रसंग में שָׂרִים उच्च पदस्थ सैन्य अधिकारियों को सूचित करता है; ‘सेनापति’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: מָה הָעִבְרִים הָאֵלֶּה
  choice: ये इब्री यहाँ क्या कर रहे हैं?
  rationale: इब्रानी वाक्य संक्षिप्त और व्यंग्यार्थयुक्त है—शाब्दिक रूप से ‘ये इब्री क्या?’ हिन्दी में ‘यहाँ क्या कर रहे हैं?’ उसकी संदिग्धता और प्रसंगगत आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הָעִבְרִים
  choice: इब्री
  rationale: मूल पाठ में जातीय नाम ‘इब्री’ है, ‘इस्राएली’ नहीं; इसे बनाए रखने से पलिश्तियों का दृष्टिकोण सुरक्षित रहता है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं है
  rationale: यह सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिन्दी में यह संरचना उसी बल को बनाए रखती है।
- source_word: עֶבֶד
  choice: सेवक
  rationale: यहाँ दाऊद और शाऊल के राजकीय संबंध का उल्लेख है; ‘दास’ की अपेक्षा ‘सेवक’ प्रसंगानुकूल है।
- source_word: זֶה יָמִים אוֹ זֶה שָׁנִים
  choice: इतने दिनों से, बल्कि इतने वर्षों से
  rationale: मूल का असामान्य ‘दिनों या वर्षों’ वाला प्रयोग लंबी अवधि पर बल देता है। ‘बल्कि’ हिन्दी में संभावित आत्म-संशोधन या विस्तार को स्वाभाविक बनाता है, बिना अवधि निश्चित किए।
- source_word: מְאוּמָה
  choice: कोई दोष नहीं
  rationale: शाब्दिक अर्थ ‘कुछ भी नहीं’ है; इस संदर्भ में अकीश का आशय शिकायत या आरोप योग्य बात न मिलने से है।
- source_word: מִיּוֹם נָפְלוֹ
  choice: जिस दिन से वह मेरे पक्ष में आ मिला
  rationale: נפל का राजनीतिक-सैन्य मुहावरा किसी के पक्ष में चले आने या उससे जा मिलने को व्यक्त कर सकता है। यह हिन्दी विकल्प ‘दल बदलने’ की अपेक्षा कम निर्णायक है और मुहावरे का प्रसंगगत अर्थ स्पष्ट करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह मानक हिन्दी में मूल के काल-संबंधी मुहावरे का सहज समतुल्य है।
- source_word: אָכִישׁ / דָוִד / שָׁאוּל
  choice: अकीश / दाऊद / शाऊल
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और पहचानने योग्य नाम-रूप अपनाए गए हैं।
theological_decisions:
- issue: दाऊद के अकीश से जा मिलने का वर्णन
  choice: मेरे पक्ष में आ मिला
  alternative: मेरे पास भाग आया / दल बदलकर मेरे पास आया / मुझ पर आ पड़ा
  rationale: मूल נפל मुहावरे में ‘गिरना’ का रूप है, पर इस राजनीतिक प्रसंग में पक्ष बदलकर किसी से जा मिलने का अर्थ देता है। चुना हुआ रूप घटना का अर्थ बताता है, पर दाऊद की नीयत या नैतिक स्थिति पर अतिरिक्त निर्णय नहीं थोपता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। सैन्य पद के लिए ‘सेनापति’, जातीय नाम के लिए ‘इब्री’, और राजकीय संबंध के लिए ‘सेवक’ रखा गया है। मूल के संक्षिप्त प्रश्न को हिन्दी में अर्थपूर्ण बनाने हेतु ‘यहाँ क्या कर रहे हैं?’ जोड़ा गया है; अंतिम मुहावरे की वास्तविक शाब्दिक छवि पादटिप्पणी में दी गई है।
