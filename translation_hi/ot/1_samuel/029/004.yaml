  yaml_path: translation/ot/1_samuel/029/004.yaml
  text: But the Philistine commanders were angry with him[a], and the Philistine commanders said to him, “Send the man back, so that he may return to his place where you assigned him, and let him not go down with us into battle, lest he become an adversary to us in the battle[b]. For with what could this man reconcile himself to his lord? Would it not be with the heads of those men?”
translation:
  language: hi
  text: परन्तु पलिश्ती सेनापति उस पर क्रोधित हो गए और उससे कहने लगे, “इस मनुष्य को वापस भेज दे, ताकि वह अपने उस स्थान पर लौट जाए जहाँ तूने उसे नियुक्त किया है। वह हमारे साथ युद्ध में न उतरे, कहीं ऐसा न हो कि वह युद्ध में हमारा विरोधी बन जाए[a]। यह मनुष्य किन साधनों से अपने स्वामी की कृपा फिर पा सकता है[b]? क्या उन लोगों के सिरों से नहीं?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ इब्रानी शब्द שָׂטָן का अर्थ ‘विरोधी’ या ‘प्रतिपक्षी’ है, न कि व्यक्तिवाचक नाम ‘शैतान’।
    reason: lexical_alternative
  - marker: b
    text: या, “अपने स्वामी से फिर मेल कर सकता है?” इब्रानी अभिव्यक्ति अपने वरिष्ठ को फिर स्वीकार्य होने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְצְפוּ עָלָיו
  choice: उस पर क्रोधित हो गए
  rationale: קצף तीव्र रोष व्यक्त करता है। ‘क्रोधित हो गए’ स्वाभाविक और गरिमापूर्ण हिन्दी है तथा प्रसंग से अधिक तीव्रता नहीं जोड़ता।
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: पलिश्ती सेनापति
  rationale: युद्ध के इस प्रसंग में שָׂרִים राजनीतिक-मिलिटरी अगुओं को सूचित करता है; इसलिए ‘सेनापति’ ‘हाकिम’ या ‘सरदार’ से अधिक सटीक है।
- source_word: הָשֵׁב אֶת הָאִישׁ
  choice: इस मनुष्य को वापस भेज दे
  rationale: שוב का हिफ़ईल आज्ञार्थक रूप किसी को लौटाने का कारण बनने की आज्ञा देता है। ‘वापस भेज दे’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וְיָשֹׁב אֶל מְקוֹמוֹ
  choice: वह अपने उस स्थान को लौट जाए
  rationale: आज्ञा के बाद आया रूप अपेक्षित परिणाम अथवा अनुमति व्यक्त करता है। ‘लौट जाए’ इस भाव को सहज हिन्दी में बनाए रखता है।
- source_word: אֲשֶׁר הִפְקַדְתּוֹ שָׁם
  choice: जहाँ तूने उसे नियुक्त किया है
  rationale: הפקיד का अर्थ नियुक्त करना, दायित्व सौंपना या तैनात करना हो सकता है। ‘नियुक्त किया’ इस व्यापकता को बनाए रखता है।
- source_word: וְלֹא יֵרֵד עִמָּנוּ בַּמִּלְחָמָה
  choice: वह हमारे साथ युद्ध में न उतरे
  rationale: ‘युद्ध में उतरना’ हिन्दी का स्वाभाविक मुहावरा है और ירד के ‘उतरने’ वाले रूपक को भी सुरक्षित रखता है।
- source_word: וְלֹא יִהְיֶה לָּנוּ לְשָׂטָן
  choice: कहीं ऐसा न हो कि युद्ध के बीच वह हमारा विरोधी बन जाए
  rationale: שָׂטָן यहाँ सामान्य संज्ञा है, जिसका अर्थ विरोधी या शत्रु है। ‘विरोधी’ बाद की दानव-संबंधी धारणा को पाठ में नहीं लाता।
- source_word: יִתְרַצֶּה זֶה אֶל אֲדֹנָיו
  choice: यह मनुष्य अपने स्वामी की कृपा फिर किस प्रकार पा सकता है
  rationale: רצה के हित्पएल रूप का प्रसंगगत अर्थ अपने वरिष्ठ की स्वीकृति या कृपा फिर प्राप्त करना है। यह हिन्दी वाक्य उस व्यावहारिक अर्थ को स्पष्ट करता है और ‘फिर’ से पुनः अनुकूल संबंध का संकेत देता है।
- source_word: אֲדֹנָיו
  choice: अपने स्वामी
  rationale: यहाँ दाऊद के राजनीतिक अधिपति शाऊल की ओर संकेत है। ‘स्वामी’ संबंध को स्पष्ट करता है, बिना इसे ईश्वरीय उपाधि बनाने के।
- source_word: הֲלוֹא בְּרָאשֵׁי הָאֲנָשִׁים הָהֵם
  choice: क्या उन लोगों के सिरों के द्वारा नहीं?
  rationale: इब्रानी कथन जानबूझकर संक्षिप्त है और संकेत करता है कि पलिश्ती सैनिकों के सिर देकर दाऊद शाऊल की कृपा फिर पा सकता है। निकट-शाब्दिक हिन्दी मूल की तीक्ष्णता और संक्षिप्तता बनाए रखती है।
theological_decisions:
- issue: שָׂטָן का अर्थ
  choice: सामान्य संज्ञा ‘विरोधी’
  alternative: व्यक्तिवाचक नाम ‘शैतान’
  rationale: इस ऐतिहासिक प्रसंग में शब्द किसी मानवीय प्रतिपक्षी के लिए प्रयुक्त है। ‘शैतान’ कहना ऐसी धर्मवैज्ञानिक पहचान जोड़ देगा जो इस पाठ में नहीं है।
- issue: יִתְרַצֶּה का संबंधगत अर्थ
  choice: अपने स्वामी की कृपा फिर पाना
  alternative: अपने स्वामी से अपना मेल कर लेना
  rationale: दोनों अर्थ-संभावनाएँ निकट हैं। मुख्य पाठ में प्रसंगगत ‘कृपा फिर पाना’ रखा गया है और आत्मवाचक मेल का विकल्प पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है। राजकीय-सैन्य प्रसंग के लिए ‘सेनापति’, ‘नियुक्त’ और ‘युद्ध में उतरना’ चुने गए हैं। संबोधन में एकवचन ‘तू’ मूल इब्रानी की प्रत्यक्ष, वरिष्ठों द्वारा राजा आकीश को दी गई कठोर आज्ञा का बल बनाए रखता है; शैली को अनावश्यक रूप से पुरातन नहीं बनाया गया।
