translation:
  language: hi
  text: 'क्या यह वही दाऊद नहीं है, जिसके बारे में वे नृत्यों में बारी-बारी गाते थे[a],


    “शाऊल ने हज़ारों को मार गिराया,

    और दाऊद ने दस हज़ारों को”?'
  philosophy: optimal-equivalence
