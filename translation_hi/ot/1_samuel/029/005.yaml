  choice: क्या यह वही दाऊद नहीं है
  rationale: यह रचना सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है। ‘वही’ पहचान और बल को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
