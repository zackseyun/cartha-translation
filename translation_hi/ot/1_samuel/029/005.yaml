  choice: जिसके विषय में वे ... जवाबी गीत गाते थे
  rationale: ענה यहाँ उत्सव के प्रसंग में उत्तर-प्रत्युत्तर या सामूहिक जवाबी गायन का बोध देता है। ‘जिसके विषय में’ לוֹ का संबंध दाऊद से बनाए रखता है।
- source_word: בַּמְּחֹלוֹת
  choice: नाचते समय
  rationale: מְחֹלוֹת उत्सव के नृत्यों या नृत्य-मंडलियों को दर्शाता है। ‘नाचते समय’ हिन्दी में इस प्रसंग को सहज रूप से व्यक्त करता है।
- source_word: הִכָּה
  choice: मार गिराया
  rationale: सैनिक प्रसंग में נכה का अर्थ घातक रूप से प्रहार करके परास्त करना है। ‘मार गिराया’ इसकी तीव्रता को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: בַּאֲלָפָיו
  choice: अपने हज़ारों को
  rationale: यहाँ पूर्वसर्ग और संख्या का प्रयोग मारे गए शत्रुओं की संख्या के लिए मुहावरेदार है; समानांतर काव्य-पंक्ति बनाए रखने के लिए ‘अपने हज़ारों को’ चुना गया है।
- source_word: בְרִבְבֹתָיו
  choice: अपने दस हज़ारों को
  rationale: רבבה मूलतः दस हज़ार और व्यापक अर्थ में असंख्य बड़ी संख्या का बोध दे सकता है। ‘दस हज़ारों’ शाऊल के ‘हज़ारों’ के साथ संख्यात्मक विरोध और इब्रानी बहुवचन को सुरक्षित रखता है।
