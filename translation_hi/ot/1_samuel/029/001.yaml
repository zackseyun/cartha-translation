  text: पलिश्तियों ने अपनी सारी छावनियाँ[a] अपेक में इकट्ठी कीं, जबकि इस्राएल उस सोते[b] के पास डेरा डाले हुए था जो यिज्रेल में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी सारी सेनाएँ” अथवा “अपने सभी सैन्य दल”; इब्रानी में शाब्दिक रूप से “अपनी सारी छावनियाँ” है।
    reason: lexical_alternative
  - marker: b
    text: या “झरना”; इब्रानी शब्द किसी सोते अथवा फूटते हुए जलस्रोत के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְבְּצוּ
  choice: इकट्ठी कीं
  rationale: קבץ का मूल अर्थ एकत्र या इकट्ठा करना है। यहाँ स्त्रीलिंग बहुवचन क्रिया ‘छावनियाँ’ के अनुसार है और सैन्य जुटान को बिना अनावश्यक विस्तार के व्यक्त करती है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह इस जनसमूह के नाम का प्रचलित आधुनिक हिन्दी रूप है; परसर्ग ‘ने’ के कारण बहुवचन का तिर्यक रूप प्रयुक्त हुआ है।
- source_word: כָּל מַחֲנֵיהֶם
  choice: अपनी सारी छावनियाँ
  rationale: מַחֲנֶה का निकट अर्थ ‘छावनी’ या ‘पड़ाव’ है। ‘छावनियाँ’ सैन्य प्रसंग और इब्रानी बहुवचन दोनों को बनाए रखता है; सम्भावित अर्थ ‘सेनाएँ/सैन्य दल’ पादटिप्पणी में दिया गया है।
- source_word: אֲפֵקָה
  choice: अपेक में
  rationale: स्थान-नाम को हिन्दी लिपि में रूपांतरित किया गया है। दिशासूचक ה को प्रसंगानुसार गंतव्य/एकत्रीकरण-स्थल के अर्थ में स्वाभाविक हिन्दी ‘में’ से व्यक्त किया गया है।
- source_word: וְיִשְׂרָאֵל
  choice: जबकि इस्राएल
  rationale: וְ यहाँ दो समकालीन सैन्य स्थितियों को जोड़ता है। ‘जबकि’ उस दृश्यात्मक समानांतरता को स्वाभाविक हिन्दी में स्पष्ट करता है, बिना कोई अतिरिक्त काल-सूचक ‘अब’ जोड़े।
- source_word: חֹנִים
  choice: डेरा डाले हुए था
  rationale: यह कृदन्त छावनी डालकर स्थित होने का भाव देता है। ‘इस्राएल’ को सामूहिक एकवचन मानते हुए हिन्दी में एकवचन क्रिया रखी गई है।
- source_word: בַּעַיִן
  choice: सोते के पास
  rationale: עַיִן यहाँ जल के प्राकृतिक स्रोत, अर्थात सोते या झरने, को सूचित करता है। ‘सोता’ भौगोलिक सूचना के लिए सटीक और सहज हिन्दी है।
- source_word: אֲשֶׁר בְּיִזְרְעֶאל
  choice: यिज्रेल के सोते
  rationale: इब्रानी संबंधवाचक वाक्यांश सोते को यिज्रेल में स्थित बताता है। हिन्दी में ‘यिज्रेल के सोते’ उसी स्थान-संबंध को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
