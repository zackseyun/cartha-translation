- source_word: שׁוּב וְלֵךְ
  choice: लौट जाओ और ... चले जाओ
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखता है; पहली लौटने और दूसरी प्रस्थान करने पर बल देती है।
- source_word: בְּשָׁלוֹם
  choice: शान्ति से
  rationale: हिब्रू मुहावरे का स्वाभाविक हिन्दी रूप; इसमें निर्विघ्न और सुरक्षित प्रस्थान का भाव भी हो सकता है।
- source_word: וְלֹא תַעֲשֶׂה רָע
  choice: जो बुरा हो, वह न करना
  rationale: רע के नैतिक अर्थ को बनाए रखते हुए अगले मूल्यांकनसूचक पद בְּעֵינֵי से स्वाभाविक रूप से जोड़ता है।
- source_word: בְּעֵינֵי
  choice: की दृष्टि में
  rationale: मूल के मूल्यांकन या स्वीकार्यता-संबंधी मुहावरे का सहज और गरिमापूर्ण हिन्दी रूप है।
- source_word: סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्ती सरदारों
  rationale: סרן पलिश्ती नगर-राज्यों के उच्च पदाधिकारियों की विशिष्ट उपाधि है; ‘सरदार’ सामान्य ‘शासक’ की तुलना में इस पदगत अर्थ को बेहतर रखता है।
