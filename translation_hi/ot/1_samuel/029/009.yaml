base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/009.yaml
  text: Achish answered and said to David[a], “I know that you are good in my eyes, like an angel of God. Yet the commanders of the Philistines have said, ‘He must not go up with us into battle.’”
translation:
  language: hi
  text: आकीश ने दाऊद को उत्तर दिया, “मैं जानता हूँ कि तुम मेरी दृष्टि में परमेश्वर के स्वर्गदूत[a] के समान अच्छे हो। फिर भी पलिश्तियों के सेनापतियों ने कहा है, ‘वह हमारे साथ युद्ध में न जाए।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर के दूत।” हिब्रू शब्द מַלְאָךְ का अर्थ “दूत” या “स्वर्गदूत” दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמֶר
  choice: उत्तर दिया
  rationale: हिब्रू का युग्म उत्तर आरम्भ करने का प्रचलित आख्यानात्मक ढंग है। हिन्दी में केवल ‘उत्तर दिया’ स्वाभाविक है और अनावश्यक ‘कहा’ से बचता है।
- source_word: יָדַעְתִּי
  choice: मैं जानता हूँ
  rationale: पूर्ण क्रिया यहाँ आकीश के वर्तमान, दृढ़ आकलन को व्यक्त करती है।
- source_word: טוֹב אַתָּה בְּעֵינַי
  choice: तुम मेरी दृष्टि में ... भले हो
  rationale: ‘मेरी दृष्टि में’ मूल मुहावरे को बनाए रखता है; ‘भले’ व्यापक सकारात्मक मूल्यांकन को बिना केवल निष्ठा तक सीमित किए व्यक्त करता है।
- source_word: כְּמַלְאַךְ אֱלֹהִים
  choice: परमेश्वर के दूत के समान
  rationale: מַלְאָךְ का मूल अर्थ ‘दूत’ है और वह स्वर्गदूत को भी सूचित कर सकता है। मुख्य पाठ में ‘दूत’ अर्थगत अस्पष्टता को बेहतर बनाए रखता है; पादटिप्पणी में ‘स्वर्गदूत’ दिया गया है।
- source_word: אַךְ
  choice: फिर भी
  rationale: यह आकीश के निजी आकलन और पलिश्ती सेनापतियों के निर्णय के बीच रियायती विरोध को स्पष्ट करता है।
- source_word: שָׂרֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सेनापति
  rationale: युद्ध के प्रसंग में שָׂרִים के नेतृत्वकारी सैन्य पद को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לֹא יַעֲלֶה עִמָּנוּ בַּמִּלְחָמָה
  choice: वह हमारे साथ युद्ध में न जाए
  rationale: निषेधात्मक निर्णय को हिन्दी की स्वाभाविक विधिलिंग शैली में व्यक्त करता है। עלה का शाब्दिक ‘ऊपर जाना’ हिन्दी में इस सैन्य प्रसंग में भ्रामक होता, इसलिए आशयगत ‘युद्ध में जाना’ चुना गया है।
theological_decisions:
- issue: כְּמַלְאַךְ אֱלֹהִים में מַלְאַךְ का अर्थ
  choice: मुख्य पाठ में ‘परमेश्वर के दूत’, पादटिप्पणी में ‘परमेश्वर के स्वर्गदूत’
  alternative: मुख्य पाठ में ‘परमेश्वर के स्वर्गदूत’
  rationale: हिब्रू शब्द मानवीय दूत या स्वर्गदूत दोनों के लिए प्रयुक्त हो सकता है। तुलना आकीश के अत्यन्त ऊँचे सम्मान को व्यक्त करती है, दाऊद के स्वरूप के विषय में कोई तात्त्विक दावा नहीं। अस्पष्टता को पादटिप्पणी सहित सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘मेरी दृष्टि में’ मूल हिब्रू मुहावरे को बनाए रखता है, जबकि वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार रखा गया है।
