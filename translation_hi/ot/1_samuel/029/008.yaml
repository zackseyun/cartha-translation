  text: וַ/יֹּ֨אמֶר דָּוִ֜ד אֶל אָכִ֗ישׁ כִּ֣י מֶ֤ה עָשִׂ֨יתִי֙ וּ/מַה מָּצָ֣אתָ בְ/עַבְדְּ/ךָ֔ מִ/יּוֹם֙ אֲשֶׁ֣ר הָיִ֣יתִי לְ/פָנֶ֔י/ךָ עַ֖ד הַ/יּ֣וֹם הַ/זֶּ֑ה כִּ֣י לֹ֤א אָבוֹא֙ וְ/נִלְחַ֔מְתִּי בְּ/אֹיְבֵ֖י אֲדֹנִ֥/י הַ/מֶּֽלֶךְ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/029/008.yaml
  text: David said to Achish[a], “But what have I done? And what have you found against your servant from the day I entered your service until this day[b], that I should not go and fight against the enemies of my lord the king?”
translation:
  language: hi
  text: दाऊद ने आकीश से कहा, “पर मैंने क्या किया है? और जिस दिन से मैं आपके सामने रहा हूँ, आज तक आपने अपने सेवक में क्या पाया है कि मैं जाकर अपने स्वामी राजा के शत्रुओं से युद्ध न करूँ?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मेरे स्वामी राजा” दाऊद के बोले हुए शब्दों के रूप में रखा गया है। प्रसंग में यह सीधे आकीश के लिए सम्मानसूचक संबोधन हो सकता है, पर दाऊद के शब्दों में जानबूझकर रखी गई अस्पष्टता की संभावना भी बनी रहती है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי מֶה עָשִׂיתִי
  choice: पर मैंने क्या किया है?
  rationale: כִּי यहाँ पिछले कथन के प्रतिवाद में प्रयुक्त संवाद-सूचक है; आधुनिक हिन्दी में ‘पर’ दाऊद के विरोध-भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּמַה מָּצָאתָ בְעַבְדְּךָ
  choice: आपने अपने सेवक में क्या पाया है
  rationale: מצא के साथ ב का मूल बिंब ‘किसी में कुछ पाना’ है और प्रसंग में दोष पाए जाने का संकेत स्वतः स्पष्ट है; यह अनुवाद आरोप का आशय बनाए रखते हुए इब्रानी संरचना के निकट रहता है।
- source_word: בְעַבְדְּךָ
  choice: अपने सेवक
  rationale: עבד यहाँ राजा के सामने विनम्र आत्म-संबोधन है; ‘सेवक’ आधुनिक हिन्दी में उपयुक्त दरबारी सम्मान और सामाजिक भाव रखता है।
- source_word: מִיּוֹם אֲשֶׁר הָיִיתִי לְפָנֶיךָ עַד הַיּוֹם הַזֶּה
  choice: जिस दिन से मैं आपके सामने रहा हूँ, उस दिन से आज तक
  rationale: ‘आपके सामने रहा हूँ’ इब्रानी לְפָנֶיךָ को प्रत्यक्ष रूप से सुरक्षित रखता है और ‘आपकी सेवा में आया’ जैसा अतिरिक्त अर्थ आरोपित नहीं करता। दोहराया हुआ ‘उस दिन से’ हिन्दी में दीर्घ वाक्य की काल-सीमा स्पष्ट करता है।
- source_word: כִּי לֹא אָבוֹא וְנִלְחַמְתִּי
  choice: कि मैं जाकर … युद्ध न करूँ
  rationale: यह उपवाक्य दाऊद की शिकायत का परिणाम बताता है—उसे युद्ध में जाने से रोका जा रहा है। हिन्दी में ‘कि … न करूँ’ इस आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּאֹיְבֵי
  choice: शत्रुओं से युद्ध
  rationale: נלחם के साथ ב युद्ध के प्रतिपक्ष को चिह्नित करता है; हिन्दी में ‘से युद्ध करना’ स्पष्ट और मुहावरेदार है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: अपने प्रभु राजा
  rationale: अर्थगत कर्ता दाऊद होने के कारण हिन्दी का निजवाचक ‘अपने’ स्वाभाविक है। ‘प्रभु राजा’ मानवीय राजकीय सम्मान-सूचक पद को बनाए रखता है, यहाँ इसे परमेश्वर की उपाधि नहीं बनाया गया है।
theological_decisions:
- issue: ‘अपने प्रभु राजा के शत्रुओं’ में ‘प्रभु राजा’ का अभिप्रेत व्यक्ति और कथन का आलंकारिक बल
  choice: वाक्य को दाऊद के कथन के रूप में यथावत रखा गया है और उसके अभिप्रेत व्यक्ति की पहचान नहीं की गई।
  alternative: इसे स्पष्ट रूप से आकीश के लिए निष्कपट संबोधन मानना, अथवा किसी अन्य राजा की ओर जानबूझकर किया गया द्व्यर्थी संकेत मानना।
  rationale: इब्रानी पाठ दाऊद की भीतरी मंशा नहीं बताता। अनिर्णीत शब्दावली कथा में उसकी निष्ठा से जुड़ी वास्तविक अस्पष्टता और तनाव को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानसूचक ‘आप’, और गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज कथात्मक शैली अपनाई गई है। स्रोत की अभिव्यक्ति ‘आपके सामने रहा हूँ’ और ‘अपने प्रभु राजा’ को अनावश्यक व्याख्यात्मक विस्तार के बिना सुरक्षित रखा गया है।
