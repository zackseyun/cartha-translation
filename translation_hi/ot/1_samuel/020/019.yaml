base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/019.yaml
  text: On the third day[a], go down quickly and come to the place where you hid yourself on the day of the deed[b], and remain beside the stone Ezel.
translation:
  language: hi
  text: तीसरे दिन[a] तुम जल्दी से नीचे उतरकर उस स्थान पर आना जहाँ तुम उस घटना के दिन[b] छिपे थे। फिर एज़ेल पत्थर[c] के पास ठहरे रहना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी पद का अर्थ कठिन है; इसका अनुवाद ‘जब तुम तीसरी बार ऐसा करो’ या ‘तीन दिन बाद’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘काम के दिन’; इसका अर्थ ‘मामले के दिन’ या ‘कार्य के दिन’ भी हो सकता है। संभवतः यह पहले से तय की गई घटना या अवसर की ओर संकेत करता है।
    reason: lexical_alternative
  - marker: c
    text: ‘एज़ेल’ संभवतः इस पत्थर का नाम या स्थिर पदनाम है। संबंधित इब्रानी शब्द का संबंध ‘जाने’ या ‘प्रस्थान’ से हो सकता है, पर इसका ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשִׁלַּשְׁתָּ
  choice: तीसरे दिन
  rationale: पिअल रूप यहाँ कठिन और मुहावरेदार है; प्रसंग में यह निर्धारित संकेत-क्रम के तीसरे दिन की ओर संकेत करता है। हिंदी में ‘तीसरे दिन’ स्वाभाविक और कथानक के अनुकूल है।
- source_word: תֵּרֵד מְאֹד
  choice: जल्दी नीचे उतरना
  rationale: יָרַד का मूल अर्थ ‘नीचे उतरना’ है और מְאֹד क्रिया को तीव्र करता है। प्रसंग में इसे तत्परता/शीघ्रता के रूप में व्यक्त करना स्वाभाविक है, यद्यपि ‘बहुत नीचे’ या ‘दूर नीचे’ भी संभव है।
- source_word: וּבָאתָ אֶל הַמָּקוֹם
  choice: और उस स्थान पर आना
  rationale: בוא का सामान्य अर्थ ‘आना/पहुँचना’ है। निर्देशात्मक कथन में ‘उस स्थान पर आना’ सहज हिंदी है।
- source_word: אֲשֶׁר נִסְתַּרְתָּ שָּׁם
  choice: जहाँ तुम ... छिपे थे
  rationale: निफ़अल रूप प्रसंग में दाऊद के स्वयं छिपने को व्यक्त करता है; ‘जहाँ तुम छिपे थे’ हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: בְּיוֹם הַמַּעֲשֶׂה
  choice: उस घटना के दिन
  rationale: מַעֲשֶׂה का अर्थ ‘काम, कार्य, घटना, मामला’ हो सकता है। ‘उस घटना’ पूर्वनियोजित प्रसंग की ओर संकेत करते हुए मूल की कुछ व्यापकता बनाए रखता है।
- source_word: וְיָשַׁבְתָּ
  choice: ठहरे रहना
  rationale: יָשַׁב का शाब्दिक अर्थ ‘बैठना’ है, पर इसका अर्थ ‘ठहरना/रहना’ भी होता है। छिपकर प्रतीक्षा करने के निर्देश में ‘ठहरे रहना’ अभिप्रेत क्रिया को स्पष्ट करता है।
- source_word: אֵצֶל הָאֶבֶן הָאָזֶל
  choice: एज़ेल नामक पत्थर के पास
  rationale: אֶבֶן ‘पत्थर’ है और הָאָזֶל को सबसे उपयुक्त रूप से उस पत्थर की स्थिर संज्ञा अथवा नाम माना गया है। अर्थ अनिश्चित होने के कारण इसका लिप्यंतरण किया गया है।
