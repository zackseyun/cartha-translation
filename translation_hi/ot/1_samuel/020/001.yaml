source:
  edition: WLC
  text: וַ/יִּבְרַ֣ח דָּוִ֔ד מ/נוות בָּ/רָמָ֑ה וַ/יָּבֹ֞א וַ/יֹּ֣אמֶר לִ/פְנֵ֣י יְהוֹנָתָ֗ן מֶ֤ה עָשִׂ֨יתִי֙ מֶֽה עֲוֺנִ֤/י וּ/מֶֽה חַטָּאתִ/י֙ לִ/פְנֵ֣י אָבִ֔י/ךָ כִּ֥י מְבַקֵּ֖שׁ אֶת נַפְשִֽׁ/י׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/001.yaml
  text: Then David fled from Naioth in Ramah and came before Jonathan and said[a], “What have I done? What is my guilt, and what is my sin before your father, that he is seeking my life?”
translation:
  language: hi
  text: तब दाऊद रामा में नायोत से भाग निकला और योनातान के सामने आकर बोला[a], “मैंने क्या किया है? मेरा क्या दोष है, और तुम्हारे पिता के सामने मेरा क्या पाप है कि वह मेरे प्राण लेना चाहता है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रामा के नायोत से।” इब्रानी में सम्भवतः रामा से जुड़े प्रसिद्ध स्थान-नाम नायोत का उल्लेख है।
    reason: स्थानगत संबंध की वैकल्पिक व्याख्या
lexical_decisions:
- source_word: וַיִּבְרַח
  choice: भाग निकला
  rationale: क्रिया ברח भागने या बच निकलने का भाव रखती है। “भाग निकला” प्रसंग की तात्कालिकता और संकट दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִנָּוֹת בָּרָמָה
  choice: रामा के नायोत से
  rationale: संदर्भ में נָוֹת स्थान-नाम है; इसलिए इसे “नायोत” लिप्यंतरित किया गया है। בָּרָמָה के स्थानगत संबंध को सहज हिन्दी में “रामा के” द्वारा व्यक्त किया गया है।
- source_word: וַיָּבֹא
  choice: आकर
  rationale: בוא का मूल अर्थ आना है। अगली क्रिया से जोड़कर “आकर” हिन्दी कथन-प्रवाह में स्वाभाविक है।
- source_word: לִפְנֵי יְהוֹנָתָן
  choice: योनातान के पास
  rationale: לִפְנֵי का शाब्दिक अर्थ सामने या उपस्थिति में है। इस प्रसंग में “के पास” सामान्य आधुनिक हिन्दी में योनातान की उपस्थिति में आने का अर्थ स्पष्ट करता है।
- source_word: מֶה עָשִׂיתִי
  choice: मैंने क्या किया है?
  rationale: इब्रानी पूर्ण क्रिया को यहाँ वर्तमान परिणाम वाली आत्मरक्षात्मक पूछताछ के रूप में स्वाभाविक हिन्दी में रखा गया है।
- source_word: עֲוֺנִי
  choice: मेरा क्या दोष है
  rationale: עָוֹן अपराध, अधर्म या उससे जुड़ा दोष दर्शा सकता है। यहाँ दाऊद अपने विरुद्ध कार्रवाई का आधार पूछ रहा है, इसलिए “दोष” उपयुक्त और सहज है।
- source_word: חַטָּאתִי
  choice: मैंने ... कौन-सा पाप किया है
  rationale: חַטָּאת के नैतिक अर्थ को “पाप” से सुरक्षित रखा गया है और इसे עָוֹן के “दोष” से अलग रखा गया है।
- source_word: לִפְנֵי אָבִיךָ
  choice: तुम्हारे पिता के विरुद्ध
  rationale: यद्यपि לִפְנֵי का रूप शाब्दिकतः “सामने” है, यहाँ पाप के संबंध में इसका भाव “के विरुद्ध/के प्रति” है; यह हिन्दी में आशय अधिक स्पष्ट करता है।
- source_word: כִּי
  choice: कि
  rationale: यह संयोजक पिछले प्रश्न के परिणाम या आधार को प्रस्तुत करता है; हिन्दी में “कि” उसी संबंध को स्वाभाविक रूप से जोड़ता है।
- source_word: מְבַקֵּשׁ אֶת־נַפְשִׁי
  choice: वह मेरे प्राण लेना चाहता है
  rationale: यह इब्रानी मुहावरा किसी के जीवन के पीछे पड़ने, अर्थात उसे मार डालने का प्रयास करने, को दर्शाता है। “मेरे प्राण लेना चाहता है” मुहावरे का जीवन-संबंधी चित्र बनाए रखते हुए आधुनिक हिन्दी में स्पष्ट है।
