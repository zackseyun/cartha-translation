  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज कथात्मक शैली रखी गई है। प्रश्नों की तीव्रता बनाए रखने के लिए छोटे, सीधे वाक्य प्रयुक्त हैं; “दोष” और “पाप” द्वारा दोनों इब्रानी संज्ञाओं का भेद सुरक्षित रखा गया है।
