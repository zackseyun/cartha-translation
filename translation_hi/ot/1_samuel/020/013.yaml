  text: May Yahweh do so to Jonathan[a], and more also, if my father intends evil against you and I do not disclose it to you and send you away, so that you may go in peace. And may Yahweh be with you[c][b], as he has been with my father.
translation:
  language: hi
  text: यहोवा योनातान के साथ ऐसा करे, और इससे भी अधिक करे,[a] यदि मेरे पिता तुम्हारे विरुद्ध बुराई करने की इच्छा रखें और मैं तुम्हें इसकी सूचना न दूँ और तुम्हें विदा न करूँ, ताकि तुम कुशल से जा सको। यहोवा तुम्हारे साथ रहे, जैसे वह मेरे पिता के साथ रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक विन्यास है: “यहोवा योनातान के साथ ऐसा करे, और इससे भी अधिक करे, यदि मेरे पिता को तुम्हारे विरुद्ध बुराई करना अच्छा लगे और मैं तुम्हारा कान खोलूँ और तुम्हें विदा करूँ ...।” “कान खोलना” सूचना देने का इब्रानी मुहावरा है। शपथ के संक्षिप्त विन्यास और प्रसंग से नकार निहित है: योनातान अपने ऊपर शाप बुलाता है यदि वह दाऊद को सूचना न दे और उसे विदा न करे।'
    reason: मूल शपथ-विन्यास, ‘कान खोलना’ मुहावरे, और प्रसंग से निहित नकार को स्पष्ट करना
lexical_decisions:
- source_word: כֹּה יַעֲשֶׂה יְהוָה לִיהוֹנָתָן וְכֹה יֹסִיף
  choice: तो यहोवा योनातान के साथ ऐसा ही करे, वरन् इससे भी अधिक करे
  rationale: यह शापयुक्त शपथ का प्रचलित सूत्र है। तीसरे पुरुष में ‘योनातान’ को बनाए रखा गया है, और हिन्दी में शर्त को पहले रखकर शपथ का आशय स्पष्ट किया गया है।
- source_word: יֵיטִב אֶל אָבִי אֶת הָרָעָה עָלֶיךָ
  choice: मेरे पिता तुम्हारा बुरा करना चाहें
  rationale: शाब्दिक अभिव्यक्ति ‘मेरे पिता को तुम्हारे विरुद्ध बुराई अच्छी लगे’ यहाँ हानि पहुँचाने की इच्छा या मंशा बताती है। यह अनुवाद उस मुहावरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: मैं तुम्हें इसकी खबर न दूँ
  rationale: '‘तुम्हारा कान खोलूँ’ सूचना देने का इब्रानी मुहावरा है। शपथ के संक्षिप्त विन्यास में नकार निहित है: शाप तब पड़े यदि योनातान दाऊद को खबर न दे।'
- source_word: וְשִׁלַּחְתִּיךָ
  choice: तुम्हें विदा न करूँ
  rationale: क्रिया योनातान द्वारा दाऊद को जाने में सक्रिय सहायता देने का भाव रखती है। निहित नकार को इस समन्वित क्रिया पर भी लागू किया गया है।
- source_word: וְהָלַכְתָּ לְשָׁלוֹם
  choice: कि तुम कुशल से चले जाओ
  rationale: לְשָׁלוֹם का अर्थ केवल अभिवादनात्मक ‘शान्ति’ नहीं, बल्कि सुरक्षित और कुशलतापूर्वक जाना भी है। ‘कि’ उद्देश्य/परिणाम का सहज सम्बन्ध दिखाता है।
- source_word: וִיהִי יְהוָה עִמָּךְ
  choice: यहोवा तुम्हारे साथ रहे
  rationale: इच्छासूचक बल को हिन्दी में ‘रहे’ से स्वाभाविक रूप में व्यक्त किया गया है।
- source_word: כַּאֲשֶׁר הָיָה עִם אָבִי
  choice: जैसे वह मेरे पिता के साथ रहा है
  rationale: पूर्ण क्रिया भूतकालीन साथ और उसकी वर्तमान प्रासंगिकता दोनों को व्यक्त कर सकती है; ‘रहा है’ इस तनाव को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यन्तरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
theological_decisions:
- issue: योनातान की शपथ में निहित नकार
  choice: मुख्य पाठ में ‘मैं ... खबर न दूँ और ... विदा न करूँ’ स्पष्ट किया गया है।
  alternative: 'अधिक शाब्दिक रूप में नकार छोड़ा जा सकता है: ‘यदि मेरे पिता... चाहें, तो मैं तुम्हें खबर दूँगा और विदा करूँगा।’'
  rationale: इब्रानी शपथ-सूत्र में शाप का परिणाम संक्षिप्त या लुप्त है। प्रसंग में योनातान अपने ऊपर शाप बुलाता है यदि वह दाऊद को चेतावनी देकर सुरक्षित न भेजे। नकार स्पष्ट करने से हिन्दी में शपथ का वास्तविक आशय समझ में आता है।
- issue: यहोवा का शाऊल के साथ होना और दाऊद के साथ रहने की कामना
  choice: 'तुलना को बिना व्याख्यात्मक नरमी के रखा गया है: ‘जैसे वह मेरे पिता के साथ रहा है।’'
  alternative: इसे केवल शाऊल के आरम्भिक शासन तक सीमित कर व्याख्यायित किया जा सकता था।
  rationale: मूल पाठ समय-सीमा स्पष्ट नहीं करता। अनुवाद इस कथन के भीतर मौजूद ऐतिहासिक और धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कुशल से’ बाइबिलीय शालोम के सुरक्षा-सहित अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। मुख्य पाठ में एक संयुक्त फुटनोट-चिह्न [a] दिया गया है और वही फुटनोट सूची में उपस्थित है।
