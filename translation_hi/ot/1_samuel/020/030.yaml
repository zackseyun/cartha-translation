base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/030.yaml
  text: Then Saul’s anger burned against Jonathan[a], and he said to him, “You son of a perverse, rebellious woman! Do I not know that you have chosen the son of Jesse[c][b], to your own shame and to the shame of your mother’s nakedness?”
translation:
  language: hi
  text: तब शाऊल का क्रोध योनातान पर भड़क उठा, और उसने उससे कहा, “अरे कुटिल और विद्रोही स्त्री के बेटे![a] क्या मैं नहीं जानता कि तूने यिशै के बेटे को चुन लिया है[b]—तेरी लज्जा के लिए और तेरी माँ की नग्नता की लज्जा के लिए?[c]”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अरे टेढ़ेपन और विद्रोह के बेटे!” यह इब्रानी गाली कठिन और अत्यंत मुहावरेदार है।
    reason: lexical_alternative
  - marker: b
    text: या, “तू यिशै के बेटे का पक्ष ले रहा है।”
    reason: lexical_alternative
  - marker: c
    text: “तेरी माँ की नग्नता की लज्जा” परिवार को कलंकित करने की एक अत्यंत कठोर इब्रानी अभिव्यक्ति है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּחַר אַף שָׁאוּל בִּיהוֹנָתָן
  choice: शाऊल का क्रोध योनातान पर भड़क उठा
  rationale: इब्रानी मुहावरे में क्रोध के जलने का सजीव भाव है; ‘भड़क उठा’ स्वाभाविक हिन्दी में उसकी तीव्रता और योनातान की ओर उसके रुख को बनाए रखता है।
- source_word: בֶּן נַעֲוַת הַמַּרְדּוּת
  choice: टेढ़ी और विद्रोही स्त्री के बेटे
  rationale: कठिन और अत्यंत अपमानजनक इब्रानी पदबंध में टेढ़ेपन/विकृति और विद्रोह का भाव है। ‘स्त्री’ जोड़ने से मातृ-संबंधी गाली हिन्दी में समझ आती है, पर कठिन मुहावरे की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: הֲלוֹא יָדַעְתִּי
  choice: क्या मैं नहीं जानता
  rationale: नकारात्मक प्रश्नवाचक रूप को आरोपपूर्ण आलंकारिक प्रश्न के रूप में रखा गया है।
- source_word: בֹחֵר אַתָּה לְבֶן יִשַׁי
  choice: तूने यिशै के बेटे को चुन लिया है
  rationale: בחר के मूल अर्थ ‘चुनना’ को रखा गया है; प्रसंग में किसी का पक्ष लेने का अर्थ पादटिप्पणी में दिया गया है। संबोधन ‘तू’ शाऊल के क्रोध और अपमानसूचक लहजे के अनुरूप है।
- source_word: לְבָשְׁתְּךָ
  choice: अपनी लज्जा के लिए
  rationale: लामेद से व्यक्त परिणाम और בֹּשֶׁת के लज्जा/अपमान के भाव को निकटता से रखा गया है।
- source_word: וּלְבֹשֶׁת עֶרְוַת אִמֶּךָ
  choice: अपनी माँ की नग्नता की लज्जा के लिए
  rationale: עֶרְוָה के स्पष्ट ‘नग्नता’ अर्थ और मूल वाक्य की कठोर, पारिवारिक अपमान वाली अभिव्यक्ति को नरम किए बिना सुरक्षित रखा गया है।
