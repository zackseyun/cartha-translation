base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/041.yaml
  text: When the boy had come[a], David rose from beside the south side and fell with his face to the ground and bowed three times. Then they kissed one another and wept with one another[b], until David wept the more.
translation:
  language: hi
  text: जब वह लड़का आ गया, तब दाऊद दक्षिण के पास से[a] उठ खड़ा हुआ। वह मुँह के बल भूमि पर गिरा और उसने तीन बार दण्डवत् किया। फिर उन्होंने एक-दूसरे को चूमा और दोनों एक-दूसरे के साथ रोए, यहाँ तक कि दाऊद और भी अधिक रोया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दक्षिण/नेगेब के पास से।” हिब्रू पदबंध कठिन है; बहुत-से लोग इसे उस टीले या पत्थर के पास का संकेत समझते हैं जहाँ दाऊद छिपा हुआ था।
    reason: alternative_reading
  - marker: b
    text: या, “यहाँ तक कि दाऊद का रोना बढ़ गया।” इसका अर्थ यह हो सकता है कि वह योनातान से अधिक रोया या उसका रोना अधिक तीव्र हो गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנַּעַר בָּא
  choice: जब वह लड़का आ गया
  rationale: नַעַר यहाँ पिछले प्रसंग में योनातान के साथ गए सेवक लड़के को सूचित करता है। कालगत उपवाक्य हिन्दी कथा-प्रवाह में स्वाभाविक है।
- source_word: מֵאֵצֶל הַנֶּגֶב
  choice: दक्षिण की ओर से
  rationale: नֶגֶב का सामान्य अर्थ ‘दक्षिण’ है और यही उपलब्ध मसोराई पाठ का सीधा आधार है। מֵאֵצֶל का स्थानगत भाव ‘की ओर से’ में व्यक्त हुआ है; कठिन पदबंध को पादटिप्पणी में खुला रखा गया है।
- source_word: וַיִּפֹּל לְאַפָּיו אַרְצָה
  choice: वह मुँह के बल भूमि पर गिरा
  rationale: हिब्रू मुहावरे की शारीरिक मुद्रा को स्पष्ट और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיִּשְׁתַּחוּ שָׁלֹשׁ פְּעָמִים
  choice: उसने तीन बार दण्डवत् किया
  rationale: शׁחה के झुककर सम्मान प्रकट करने के भाव को ‘दण्डवत् किया’ संक्षेप और गरिमा के साथ व्यक्त करता है, बिना उसके सामाजिक अर्थ को आवश्यकता से अधिक निश्चित किए।
- source_word: וַיִּשְּׁקוּ אִישׁ אֶת רֵעֵהוּ
  choice: उन्होंने एक-दूसरे को चूमा
  rationale: परस्पर क्रिया को हिन्दी में स्वाभाविक ढंग से व्यक्त करते हुए चुंबन के शाब्दिक और सांस्कृतिक संकेत को सुरक्षित रखा गया है।
- source_word: וַיִּבְכּוּ אִישׁ אֶת רֵעֵהוּ
  choice: दोनों एक-दूसरे के साथ रोए
  rationale: पारस्परिकता और साझा शोक दोनों को स्पष्ट करता है।
- source_word: עַד דָּוִד הִגְדִּיל
  choice: यहाँ तक कि दाऊद और भी अधिक रोया
  rationale: הִגְדִּיל का मूल भाव ‘बढ़ना/अधिक होना’ है; प्रसंग में रोना अध्याहृत है। अनुवाद तीव्रता या तुलनात्मक अधिकता की वास्तविक अस्पष्टता को पूरी तरह समाप्त नहीं करता।
