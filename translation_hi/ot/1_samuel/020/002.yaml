base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/002.yaml
  text: He said to him[a], “Far from it! You will not die. Look, my father does nothing, great or small, without revealing it to me. So why would my father hide this matter from me? It is not so.”
translation:
  language: hi
  text: उसने उससे कहा, “ऐसा कभी न हो! तुम नहीं मरोगे। देखो, मेरा पिता कोई भी काम—चाहे बड़ा हो या छोटा—मुझे बताए बिना नहीं करता।[a] फिर मेरा पिता यह बात मुझसे क्यों छिपाएगा? ऐसी बात नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “मेरा कान खोले बिना”; यह एक मुहावरा है, जिसका अर्थ है, “मुझे बताए बिना।”
    reason: lexical_alternative
