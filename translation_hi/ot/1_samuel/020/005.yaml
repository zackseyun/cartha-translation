base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/005.yaml
  text: David said to Jonathan[a], “Look, tomorrow is the new moon, and I am supposed to sit with the king to eat. But let me go[b], so that I may hide myself in the field until the third evening.”
translation:
  language: hi
  text: दाऊद ने योनातान से कहा, “देखो, कल नया चाँद है[b], और मुझे राजा के साथ भोजन करने बैठना है। पर मुझे जाने दो, ताकि मैं तीसरी संध्या तक[a] मैदान में छिपा रहूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तीसरे दिन की संध्या तक।” इब्रानी पदबंध संक्षिप्त है।
    reason: lexical_alternative
  - marker: b
    text: “नया चाँद” मासिक नए-चाँद के पालन को दर्शाता है, जिसके अवसर पर प्रायः विशेष भोज होता था।
    reason: cultural_note
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह सामने की परिस्थिति की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देखो’ स्वाभाविक ढंग से इसका संकेतात्मक बल बनाए रखता है।
- source_word: חֹדֶשׁ מָחָר
  choice: कल नया चाँद है
  rationale: חֹדֶשׁ यहाँ अगले दिन के नए चाँद और उससे जुड़े मासिक आयोजन को सूचित करता है; सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: יָשֹׁב אֵשֵׁב
  choice: मुझे ... बैठना है
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute अपेक्षा अथवा निश्चित दायित्व पर बल देता है। यह हिन्दी प्रयोग सामाजिक रूप से अपेक्षित उपस्थिति को स्वाभाविक रूप में व्यक्त करता है, नैतिक कर्तव्य का अनावश्यक अर्थ जोड़े बिना।
- source_word: עִם הַמֶּלֶךְ לֶאֱכֹל
  choice: राजा के साथ भोजन करने
  rationale: राजा के साथ बैठकर खाने की ठोस छवि को सहज और गरिमापूर्ण हिन्दी में बनाए रखता है।
- source_word: וְשִׁלַּחְתַּנִי
  choice: पर मुझे जाने दो
  rationale: शाब्दिक अर्थ ‘मुझे भेज दो’ है, पर प्रसंग में दाऊद योनातान से अनुपस्थित रहने की अनुमति माँग रहा है; ‘जाने दो’ उस आशय का स्वाभाविक अनुवाद है।
- source_word: וְנִסְתַּרְתִּי
  choice: ताकि मैं ... छिपा रहूँ
  rationale: पूर्ववर्ती विनती के बाद यह रूप इच्छित परिणाम का भाव रख सकता है; ‘ताकि’ उस संबंध को स्पष्ट किन्तु स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בַשָּׂדֶה
  choice: मैदान में
  rationale: एकवचन संज्ञा के लिए ‘मैदान’ आधुनिक हिन्दी में सरल और प्रसंगानुकूल है।
- source_word: עַד הָעֶרֶב הַשְּׁלִשִׁית
  choice: तीसरी संध्या तक
  rationale: इब्रानी पदबंध अपूर्णोक्तिपरक है। मुख्य पाठ में उसका संक्षिप्त, अपेक्षाकृत निकट रूप रखा गया है और संभावित कालगत अर्थ पादटिप्पणी में दिया गया है।
