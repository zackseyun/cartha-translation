  register: आधुनिक मानक हिन्दी; संबोधन में विनम्र ‘आप’ और ‘दीजिए’ का प्रयोग। शैली गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। स्रोत में ‘भाई’ एकवचन और आगे ‘भाइयों’ बहुवचन को ज्यों का त्यों रखा गया है; ‘भाइयों’ का आशय सगे भाइयों के साथ व्यापक पुरुष संबंधियों से भी हो सकता है।
