  text: וַ/יֹּ֡אמֶר שַׁלְּחֵ֣/נִי נָ֡א כִּ֣י זֶבַח֩ מִשְׁפָּחָ֨ה לָ֜/נוּ בָּ/עִ֗יר וְ/ה֤וּא צִוָּֽה לִ/י֙ אָחִ֔/י וְ/עַתָּ֗ה אִם מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ אִמָּ֥לְטָה נָּ֖א וְ/אֶרְאֶ֣ה אֶת אֶחָ֑/י עַל כֵּ֣ן לֹא בָ֔א אֶל שֻׁלְחַ֖ן הַ/מֶּֽלֶךְ־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/029.yaml
  text: He said[a], ‘Please let me go, because we have a family sacrifice in the city, and my brother himself has commanded me. So now, if I have found favor in your eyes[b], please let me escape and see my brothers.’ Therefore he has not come to the king’s table.
translation:
  language: hi
  text: उसने कहा, “कृपया मुझे जाने दीजिए, क्योंकि नगर में हमारे परिवार का बलिदान है, और मेरे भाई ने स्वयं मुझे आदेश दिया है। इसलिए अब, यदि आपकी दृष्टि में मुझ पर अनुग्रह हुआ हो, तो कृपया मुझे निकल जाने दीजिए[a] और अपने भाइयों से मिलने दीजिए[b]।” इसी कारण वह राजा की मेज़ पर नहीं आया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “निकल जाने” के लिए प्रयुक्त हिब्रू क्रिया में बच निकलने या चुपचाप खिसक जाने का भाव भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “भाइयों” का अर्थ दाऊद के सगे भाइयों से हो सकता है, या अधिक व्यापक रूप से उसके परिवार/कुल के पुरुष संबंधियों से।
    reason: cultural_note
lexical_decisions:
- source_word: שַׁלְּחֵנִי נָא
  choice: कृपया मुझे जाने दीजिए
  rationale: שלח के आज्ञार्थक रूप और प्रथम पुरुष एकवचन प्रत्यय से प्रस्थान की अनुमति माँगी गई है; נָא की विनम्रता को ‘कृपया’ व्यक्त करता है।
- source_word: זֶבַח מִשְׁפָּחָה
  choice: हमारे परिवार का बलिदान
  rationale: זֶבַח का बलिदान-संबंधी अर्थ सुरक्षित रखा गया है; מִשְׁפָּחָה परिवार अथवा व्यापक कुल को सूचित कर सकता है।
- source_word: בָּעִיר
  choice: नगर में
  rationale: यह स्थानवाचक पदबंध है; ‘नगर में’ स्वाभाविक और स्रोत के निकट है।
- source_word: וְהוּא צִוָּה לִי אָחִי
  choice: और मेरे भाई ने स्वयं मुझे आदेश दिया है
  rationale: स्वतंत्र सर्वनाम הוּא के बल को ‘स्वयं’ से रखा गया है; צוה के अपेक्षाकृत प्रबल अर्थ के लिए ‘आदेश दिया’ चुना गया है।
- source_word: אִם מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: यदि आपकी दृष्टि में मुझ पर अनुग्रह हुआ हो
  rationale: हिब्रू विनम्रता-सूत्र और ‘आँखों/दृष्टि में’ की छवि दोनों को स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: אִמָּלְטָה נָּא
  choice: कृपया मुझे निकल जाने दीजिए
  rationale: מלט में बच निकलने या चुपचाप हट जाने का भाव हो सकता है; प्रसंग में अनुमति माँगने की भाषा के अनुरूप ‘निकल जाने’ से अर्थ को अनावश्यक रूप से नाटकीय बनाए बिना यह भाव रखा गया है।
- source_word: וְאֶרְאֶה אֶת אֶחָי
  choice: और अपने भाइयों से मिल लेने दीजिए
  rationale: ראה का मूल अर्थ ‘देखना’ है, किंतु हिन्दी में परिवार के पास जाने के प्रसंग में ‘मिलना’ अधिक स्वाभाविक है; אֶחָי को ‘भाइयों’ के रूप में बनाए रखा गया है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह दाऊद की अनुपस्थिति के पूर्व कथन से निकले परिणाम को औपचारिक किंतु सहज ढंग से व्यक्त करता है।
- source_word: לֹא בָא
  choice: वह ... नहीं आया है
  rationale: पूर्ण क्रिया यहाँ भोजन के समय उसकी वर्तमान अनुपस्थिति समझाती है; हिन्दी पूर्ण वर्तमान इस कथन-परिस्थिति के अनुकूल है।
- source_word: אֶל שֻׁלְחַן הַמֶּלֶךְ
  choice: राजा की मेज़ पर
  rationale: यह राजकीय भोजन के स्थान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
