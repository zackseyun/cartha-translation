- source_word: צִדָּה
  choice: उसके एक ओर
  rationale: रूप में स्त्रीलिंग एकवचन प्रत्यय है, इसलिए ‘उसके’ को बनाए रखा गया है; संकेतित वस्तु सम्भवतः प्रसंग में पहले उल्लिखित पत्थर या निशान है, पर मुख्य पाठ उसे स्पष्ट रूप से नहीं जोड़ता।
- source_word: אוֹרֶה
  choice: चलाऊँगा
  rationale: ירה के हिफ़ील रूप का धनुर्विद्या के प्रसंग में अर्थ तीर चलाना है; नियोजित भावी कार्य के लिए ‘चलाऊँगा’ उपयुक्त है।
- source_word: לְשַׁלַּח לִי
  choice: मानो ... तीर चला रहा हूँ
  rationale: यहाँ הביטוי लक्ष्याभ्यास जैसा दिखाने की क्रिया बताता है। हिन्दी में शाब्दिक ‘अपने लिए भेजने’ की अपेक्षा यह मुहावरेदार और स्पष्ट है।
- source_word: לְמַטָּרָה
  choice: किसी निशाने पर
  rationale: מַטָּרָה धनुर्विद्या के लक्ष्य या निशाने को दर्शाता है; ‘किसी निशाने पर’ अनिश्चित और स्वाभाविक हिन्दी अभिव्यक्ति है।
