base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/026.yaml
  text: But Saul did not say anything that day[a], for he thought, “Something has happened; he is not clean—surely he is not clean.”
translation:
  language: hi
  text: पर उस दिन शाऊल ने कुछ नहीं कहा, क्योंकि उसने सोचा, “कुछ हुआ होगा; वह शुद्ध नहीं है[a]—निश्चय ही वह शुद्ध नहीं है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात धार्मिक-विधि के अनुसार शुद्ध नहीं। यहाँ भोज के प्रसंग में इब्रानी शब्द अनुष्ठानिक शुद्धता की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דִבֶּר ... מְאוּמָה
  choice: कुछ नहीं कहा
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और शाऊल के कोई टिप्पणी न करने का भाव स्पष्ट रखता है।
- source_word: בַּיּוֹם הַהוּא
  choice: उस दिन
  rationale: यह सामान्य कालवाचक अभिव्यक्ति इब्रानी के अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כִּי אָמַר
  choice: क्योंकि उसने सोचा
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘कहा’ है, पर यहाँ शाऊल का मन में किया गया विचार बताया गया है; ‘सोचा’ हिन्दी में इसे स्पष्ट करता है।
- source_word: מִקְרֶה הוּא
  choice: कुछ हुआ होगा
  rationale: מִקְרֶה किसी घटना या आकस्मिक परिस्थिति को दर्शाता है। यह रूप कारण या घटना का अनावश्यक विवरण जोड़े बिना मूल की अनिश्चितता बनाए रखता है।
- source_word: בִּלְתִּי טָהוֹר הוּא
  choice: वह शुद्ध नहीं है
  rationale: यह मूल की नकारात्मक संरचना के निकट रहता है। प्रसंग में शुद्धता अनुष्ठानिक है, जिसे पादटिप्पणी में स्पष्ट किया गया है।
- source_word: כִּי לֹא טָהוֹר
  choice: निश्चय ही वह शुद्ध नहीं है
  rationale: दोहराव शाऊल के निष्कर्ष पर बल देता है; ‘निश्चय ही’ यहाँ כִּי के बलात्मक अथवा निष्कर्षात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: טָהוֹר द्वारा सूचित अशुद्धता का स्वरूप
  choice: भोज में भाग लेने से संबंधित अनुष्ठानिक अशुद्धता
  alternative: सामान्य नैतिक अशुद्धता
  rationale: नए चाँद के भोज और अनुपस्थिति के प्रसंग में यह भाषा सबसे स्वाभाविक रूप से धार्मिक-विधि के अनुसार शुद्धता की ओर संकेत करती है, नैतिक दोष की ओर नहीं। मुख्य पाठ में व्यापक पदावली रखी गई है और पादटिप्पणी में प्रसंग स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘कुछ हुआ होगा’ मूल में घटना की अनिश्चितता को बनाए रखता है, और अशुद्धता के अनुष्ठानिक अर्थ को मुख्य पाठ में अत्यधिक व्याख्यायित करने के बजाय पादटिप्पणी में दिया गया है।
