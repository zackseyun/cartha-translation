lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक संवाद में ענה का सामान्य अर्थ ‘उत्तर देना’ है; यह अगले प्रत्यक्ष कथन के साथ स्वाभाविक है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी व्यक्तिगत नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֶת שָׁאוּל אָבִיו
  choice: अपने पिता शाऊल को
  rationale: अर्थ और संबंध को स्पष्ट रखते हुए हिन्दी की स्वाभाविक पद-रचना अपनाई गई है।
- source_word: וַיֹּאמֶר אֵלָיו
  choice: '[उत्तर दिया]'
  rationale: इब्रानी में ‘उत्तर दिया और उससे कहा’ का द्विकथन है; स्वाभाविक हिन्दी में ‘उत्तर दिया’ ही कथन और संबोधन दोनों को पर्याप्त रूप से व्यक्त करता है।
- source_word: לָמָּה
  choice: क्यों
  rationale: प्रत्यक्ष कारणवाचक प्रश्न के लिए सरल और स्वाभाविक आधुनिक हिन्दी।
- source_word: יוּמַת
  choice: मृत्युदण्ड दिया जाए
  rationale: מות का होफ़ाल रूप केवल ‘मरना’ नहीं, बल्कि किसी के द्वारा मृत्यु दिए जाने का कारक-कर्मवाच्य अर्थ रखता है; ‘दिया जाए’ प्रसंगगत प्रश्नात्मक/विचारात्मक बल बनाए रखता है।
- source_word: מֶה עָשָׂה
  choice: उसने क्या किया है?
  rationale: यह उसके कथित अपराध के विषय में प्रश्न है; पूर्ण वर्तमान वर्तमान आरोप से उस कार्य की प्रासंगिकता व्यक्त करता है।
