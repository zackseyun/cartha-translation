base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/014.yaml
  text: And if I am still alive[a], will you not show me Yahweh’s covenant faithfulness, so that I may not die?
translation:
  language: hi
  text: और यदि मैं तब तक जीवित रहूँ, तो क्या तुम मेरे प्रति याहवे की वाचा-निष्ठा[a] नहीं दिखाओगे, ताकि मैं न मरूँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘याहवे की कृपा’ अथवा ‘याहवे का अटल प्रेम।’ इब्रानी पदबंध का अर्थ याहवे का अपना निष्ठावान प्रेम, अथवा याहवे के नाम पर या उनके अनुरूप दिखाई जाने वाली निष्ठा भी हो सकता है।
    reason: חֶסֶד יְהוָה की शब्दार्थगत और संबंधवाचक अस्पष्टता को बनाए रखना।
lexical_decisions:
- source_word: וְלֹא אִם
  choice: और यदि
  rationale: इस शपथ और विनती के प्रसंग में यह क्रम साधारण निषेध नहीं, बल्कि आगे बढ़ती हुई शर्त को व्यक्त करता है; ‘और यदि’ स्वाभाविक हिन्दी में वही भाव देता है।
- source_word: עוֹדֶנִּי חָי
  choice: मैं तब भी जीवित रहूँ
  rationale: עוֹד का निरंतरता/उस समय तक बने रहने का भाव ‘तब भी’ से व्यक्त होता है, और חָי का अर्थ ‘जीवित’ है।
- source_word: תַעֲשֶׂה עִמָּדִי
  choice: तुम मुझ पर … दिखाओगे
  rationale: עשה עם का शाब्दिक अर्थ ‘के साथ करना’ है, पर חֶסֶד के साथ हिन्दी में ‘मुझ पर … दिखाना’ अर्थपूर्ण और स्वाभाविक मुहावरा है।
- source_word: חֶסֶד
  choice: वाचा-निष्ठा
  rationale: इस प्रसंग में חֶסֶד केवल सामान्य दया नहीं, बल्कि संबंध और प्रतिज्ञा के प्रति अटल निष्ठा का बोध कराता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय परमेश्वर-नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: וְלֹא אָמוּת
  choice: ताकि मैं न मरूँ
  rationale: यह निषेध यहाँ योनातान की विनती के अपेक्षित उद्देश्य या परिणाम को व्यक्त करता है; ‘ताकि’ उस संबंध को स्पष्ट और स्वाभाविक बनाता है।
theological_decisions:
- issue: חֶסֶד יְהוָה का संबंध और अर्थ
  choice: याहवे की वाचा-निष्ठा
  alternative: याहवे की करुणा / याहवे का अटल प्रेम / याहवे के अनुरूप निष्ठा
  rationale: संबंधवाचक इब्रानी पदबंध यह संकेत दे सकता है कि निष्ठा याहवे से संबंधित, उनके नाम पर दिखाई गई, या उनके अपने अटल प्रेम के अनुरूप है। मुख्य पाठ वाचा-संबंधी निष्ठा को सामने रखता है, जबकि पादटिप्पणी वास्तविक अर्थगत विस्तार को सुरक्षित रखती है।
- issue: יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है; ‘याहवे’ उसका सीधा आधुनिक हिन्दी लिप्यंतरण है, किसी उपाधि का प्रतिस्थापन नहीं।
- issue: विनती और मृत्यु के बीच संबंध
  choice: ताकि मैं न मरूँ
  alternative: और मैं न मरूँ / कहीं ऐसा न हो कि मैं मर जाऊँ
  rationale: प्रसंग में अंतिम खंड विनती के उद्देश्य या अपेक्षित परिणाम के रूप में स्वाभाविक है, यद्यपि इब्रानी संयोजन औपचारिक रूप से समन्वयी है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और संवादात्मक प्रश्न-वाक्य रखा गया है। ‘वाचा-निष्ठा’ सामान्य पाठक के लिए अपेक्षाकृत स्पष्ट धार्मिक-संबंधपरक पद है; पादटिप्पणी अधिक परिचित विकल्प देती है।
