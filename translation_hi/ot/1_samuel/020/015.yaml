  text: וְ/לֹֽא תַכְרִ֧ת אֶֽת חַסְדְּ/ךָ֛ מֵ/עִ֥ם בֵּיתִ֖/י עַד עוֹלָ֑ם וְ/לֹ֗א בְּ/הַכְרִ֤ת יְהוָה֙ אֶת אֹיְבֵ֣י דָוִ֔ד אִ֕ישׁ מֵ/עַ֖ל פְּנֵ֥י הָ/אֲדָמָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/015.yaml
  text: And you shall not cut off your steadfast love from my house forever[a], not even when Yahweh cuts off David’s enemies, every one of them, from the face of the earth.
translation:
  language: hi
  text: और मेरे घराने से अपना अटल प्रेम सदा के लिए न हटाना[a]—उस समय भी नहीं, जब याहवे दाऊद के शत्रुओं में से हर एक को धरती पर से मिटा देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी वाचा की निष्ठा” अथवा “अपना निष्ठावान प्रेम।” इब्रानी शब्द חֶסֶד प्रायः वाचा के संबंध में निभाए जाने वाले विश्वासयोग्य प्रेम का भाव रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַכְרִת / בְּהַכְרִת (כרת)
  choice: न हटाना / मिटा देगा
  rationale: पहली जगह प्रेम को ‘काट देना’ आधुनिक हिन्दी में अस्वाभाविक है, इसलिए ‘हटाना’ चुना गया; शत्रुओं के पूर्ण विनाश के लिए दूसरी जगह ‘मिटा देगा’ स्वाभाविक और अर्थ की दृष्टि से प्रबल है। मूल की पुनरुक्ति हिन्दी में पूरी तरह बनाए रखने के बजाय दोनों प्रसंगों का आशय स्पष्ट रखा गया है।
- source_word: חַסְדְּךָ
  choice: अपना अटल प्रेम
  rationale: חֶסֶד यहाँ साधारण दया से बढ़कर संबंध और वाचा में स्थिर, निष्ठावान प्रेम को व्यक्त करता है। ‘अटल प्रेम’ आधुनिक हिन्दी में सहज है; वाचा-संबंधी अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מֵעִם בֵּיתִי
  choice: मेरे घराने से
  rationale: ‘घराना’ परिवार और वंश—दोनों अर्थों को समेटता है और योनातान के भावी वंशजों के संदर्भ में स्वाभाविक है।
- source_word: עַד עוֹלָם
  choice: सदा के लिए
  rationale: यह स्थायी और अनिश्चितकालीन अवधि को स्पष्ट, गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत इब्रानी नाम का लिप्यंतरण किया गया है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: אֹיְבֵי דָוִד
  choice: दाऊद के शत्रुओं
  rationale: इब्रानी संबंध-वाचक रचना का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: אִישׁ
  choice: एक-एक पुरुष
  rationale: बहुवचन ‘शत्रुओं’ के बाद आया एकवचन אִישׁ वितरणात्मक बल रखता है और प्रत्येक पुरुष शत्रु के व्यक्तिगत रूप से मिटाए जाने पर जोर देता है।
- source_word: מֵעַל פְּנֵי הָאֲדָמָה
  choice: धरती पर से
  rationale: इब्रानी मुहावरे का संक्षिप्त, स्वाभाविक हिन्दी समतुल्य, जिसका आशय संसार से पूर्णतः हटा दिया जाना है।
- source_word: וְלֹא ... וְלֹא
  choice: और ... न ... उस समय भी नहीं
  rationale: 'दूसरे निषेध को पहले अनुरोध का जोरदार विस्तार माना गया है: याहवे द्वारा दाऊद के शत्रुओं को मिटाए जाने के समय भी योनातान के घराने से प्रेम न हटे।'
theological_decisions:
- issue: वाचा के संदर्भ में חֶסֶד का स्वरूप
  choice: मुख्य पाठ में ‘अटल प्रेम’, जिसमें प्रेम और स्थायी निष्ठा दोनों की गुंजाइश है
  alternative: ‘वाचा की निष्ठा’, ‘निष्ठावान प्रेम’, ‘करुणा’
  rationale: योनातान और दाऊद की वाचा के कारण यहाँ वफादारी का भाव प्रमुख है, फिर भी शब्द को केवल तकनीकी संधि-शब्द तक सीमित नहीं किया गया।
- issue: दूसरे उपवाक्य का योनातान के अनुरोध से संबंध
  choice: अनुरोध को उस समय तक भी लागू समझना जब याहवे दाऊद के शत्रुओं को मिटाएगा
  alternative: याहवे द्वारा शत्रुओं को मिटाने के विषय में स्वतंत्र या कोष्ठकीय कथन
  rationale: दूसरा निषेध पहले निषेध को बल देता है और योनातान के घराने के लिए दया की विनती तथा दाऊद के शत्रुओं के भावी विनाश के बीच तनाव को बनाए रखता है।
- issue: אִישׁ का वितरणात्मक और लिंग-सूचक अर्थ
  choice: ‘एक-एक पुरुष’
  alternative: ‘हर एक’, ‘उनमें से प्रत्येक’
  rationale: इब्रानी पुल्लिंग एकवचन बहुवचन शत्रुओं में से प्रत्येक को अलग-अलग इंगित करता है; हिन्दी में ‘एक-एक पुरुष’ उस रूप और बल को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘घराना’, ‘अटल प्रेम’ और ‘धरती पर से मिटा देगा’ सामान्य पाठक के लिए सहज हैं, जबकि वंशगत और वाचा-संबंधी संदर्भ भी सुरक्षित रहता है।
