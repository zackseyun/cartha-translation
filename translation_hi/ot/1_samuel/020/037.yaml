  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। संवाद में ‘तुझसे’ का प्रयोग प्राचीन निकट संबोधन और एक बड़े व्यक्ति द्वारा लड़के को संबोधित करने के प्रसंग के अनुकूल है।
