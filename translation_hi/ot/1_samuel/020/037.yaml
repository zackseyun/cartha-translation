source:
  edition: WLC
  text: וַ/יָּבֹ֤א הַ/נַּ֨עַר֙ עַד מְק֣וֹם הַ/חֵ֔צִי אֲשֶׁ֥ר יָרָ֖ה יְהוֹנָתָ֑ן וַ/יִּקְרָ֨א יְהוֹנָתָ֜ן אַחֲרֵ֤י הַ/נַּ֨עַר֙ וַ/יֹּ֔אמֶר הֲ/ל֥וֹא הַ/חֵ֖צִי מִמְּ/ךָ֥ וָ/הָֽלְאָה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/037.yaml
  text: When the boy came to the place of the arrow that Jonathan had shot[a], Jonathan called after the boy and said, “Is not the arrow beyond you?”
translation:
  language: hi
  text: जब लड़का उस तीर की जगह तक पहुँचा जिसे योनातान ने चलाया था, तब योनातान ने लड़के के पीछे पुकारकर कहा, “क्या तीर तुझसे आगे नहीं है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיָּבֹא
  choice: पहुँचा
  rationale: בוא का कथात्मक रूप यहाँ किसी स्थान तक पहुँचने को दर्शाता है; हिंदी में ‘पहुँचा’ स्वाभाविक और सटीक है।
- source_word: הַנַּעַר
  choice: लड़का
  rationale: נַעַר युवक, बालक या सेवक हो सकता है। निकट संदर्भ में वह योनातान का युवा सहायक है; ‘लड़का’ प्रसंग के अनुकूल और सामान्य हिंदी है।
- source_word: עַד מְקוֹם הַחֵצִי
  choice: उस तीर की जगह तक
  rationale: עַד गंतव्य की सीमा और מְקוֹם स्थान को व्यक्त करता है। ‘जगह तक’ मूल संरचना और गति दोनों बनाए रखता है।
- source_word: אֲשֶׁר יָרָה יְהוֹנָתָן
  choice: जिसे योनातान ने चलाया था
  rationale: ירה इस प्रसंग में तीर चलाने का अर्थ देता है। ‘चलाया था’ लड़के के पहुँचने से पहले हुई क्रिया को स्पष्ट करता है।
- source_word: וַיִּקְרָא ... אַחֲרֵי
  choice: पीछे पुकारकर
  rationale: קרא के साथ אַחֲרֵי आगे जाते व्यक्ति के पीछे से या उसके पीछे पुकारने का भाव देता है। यह हिंदी में दृश्य को स्पष्ट रखता है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: הֲלוֹא सहमति की अपेक्षा वाला आलंकारिक प्रश्न प्रस्तुत करता है; ‘क्या ... नहीं’ हिंदी में यही बल बनाए रखता है।
- source_word: הַחֵצִי
  choice: तीर
  rationale: חֵץ का इस प्रसंग में सामान्य और सटीक हिंदी रूप ‘तीर’ है।
- source_word: מִמְּךָ וָהָלְאָה
  choice: तुझसे आगे
  rationale: वाक्यांश का शाब्दिक भाव ‘तुझसे और आगे की ओर’ है। ‘तुझसे आगे’ संक्षिप्त, स्वाभाविक और सांकेतिक संदेश के लिए पर्याप्त रूप से अस्पष्ट है।
