base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/008.yaml
  text: So show kindness to your servant[a], for you have brought your servant into the covenant of Yahweh with yourself. But if there is guilt in me, put me to death yourself[b]; why should you bring me to your father?
translation:
  language: hi
  text: इसलिए अपने सेवक पर कृपा करें[a], क्योंकि आप अपने सेवक को अपने साथ यहोवा की वाचा में ले आए हैं। पर यदि मुझमें कोई दोष है, तो आप ही मुझे मार डालें; तो मुझे अपने पिता के पास क्यों ले जाएँ?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने सेवक के प्रति वाचा की निष्ठा दिखाएँ।” इब्रानी חֶסֶד में कृपा, अटल प्रेम और निष्ठावान वाचागत भलाई का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשִׂיתָ חֶסֶד
  choice: अपने सेवक पर कृपा करें
  rationale: חֶסֶד यहाँ दाऊद की योनातान से की गई विनती में कृपा के साथ निष्ठावान, वाचागत भलाई का भाव रखता है। मुख्य पाठ में स्वाभाविक हिन्दी ‘कृपा करें’ है और व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: עַבְדֶּךָ
  choice: अपने सेवक
  rationale: यह दरबारी और विनम्र आत्म-संबोधन है; ‘सेवक’ सामाजिक-व्यावहारिक भाव को ‘दास’ से अधिक ठीक व्यक्त करता है।
- source_word: בִּבְרִית יְהוָה
  choice: यहोवा की वाचा में
  rationale: यह यहोवा के समक्ष और उनके अधिकार के अधीन स्थापित वाचागत संबंध को दर्शाता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत वाचागत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ को रखा गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: הֵבֵאתָ אֶת עַבְדְּךָ עִמָּךְ
  choice: आपने अपने सेवक को अपने साथ ... बाँधा है
  rationale: हिफ़ील ‘ले आना’ और עִמָּךְ ‘अपने साथ’ का संबंध हिन्दी में स्वाभाविक रूप से खोलकर व्यक्त किया गया है; वाचा में लाने का आशय ‘वाचा में बाँधा’ से स्पष्ट होता है।
- source_word: וְאִם יֶשׁ בִּי עָוֺן
  choice: पर यदि मुझमें कोई दोष है
  rationale: עָוֹן अपराध, दोष या अपराध-दोष का बोध करा सकता है। यहाँ दाऊद अपनी वास्तविक दोषिता की संभावना रखता है; ‘दोष’ इस अस्पष्टता को सहज हिन्दी में बनाए रखता है।
- source_word: הֲמִיתֵנִי אַתָּה
  choice: तो आप ही मुझे मार डालें
  rationale: ‘आप ही’ स्वतंत्र सर्वनाम אַתָּה के बलाघात को रखता है; ‘मार डालें’ प्रत्यक्ष और गंभीर है।
- source_word: וְעַד אָבִיךָ לָמָּה זֶּה תְבִיאֵנִי
  choice: फिर मुझे अपने पिता के पास क्यों ले जाएँ?
  rationale: 'प्रश्न का आलंकारिक बल सुरक्षित है: यदि दाऊद दोषी है, तो योनातान स्वयं उसे मार दे, शाऊल के पास न ले जाए।'
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; हिन्दी पाठ में नाम को उपाधि से बदलने के बजाय प्रचलित रूप ‘यहोवा’ रखा गया है।
- issue: חֶסֶד का वाचागत आयाम
  choice: मुख्य पाठ में ‘कृपा’, पादटिप्पणी में ‘वाचा के प्रति निष्ठा’
  alternative: केवल ‘वाचा के प्रति निष्ठा’
  rationale: निकट संदर्भ में व्यक्तिगत कृपा और अगले उपवाक्य में वाचा—दोनों आयाम सक्रिय हैं; मुख्य पाठ को स्वाभाविक रखते हुए पादटिप्पणी अर्थ-व्याप्ति सुरक्षित करती है।
- issue: וְאִם יֶשׁ בִּי עָוֺן में दोषिता
  choice: यदि मुझमें कोई दोष है
  alternative: यदि मैंने अपराध किया है
  rationale: मूल किसी विशिष्ट किए गए अपराध को स्पष्ट नहीं करता; अस्तित्वात्मक और नैतिक अस्पष्टता को बनाए रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरार्थी संबोधन रखा गया है, क्योंकि दाऊद विनम्रतापूर्वक स्वयं को ‘सेवक’ कहता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज है; ‘आप ही’ मूल के बलाघात को व्यक्त करता है।
