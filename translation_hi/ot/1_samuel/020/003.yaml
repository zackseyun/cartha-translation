  text: וַ/יִּשָּׁבַ֨ע ע֜וֹד דָּוִ֗ד וַ/יֹּ֨אמֶר֙ יָדֹ֨עַ יָדַ֜ע אָבִ֗י/ךָ כִּֽי מָצָ֤אתִי חֵן֙ בְּ/עֵינֶ֔י/ךָ וַ/יֹּ֛אמֶר אַל יֵֽדַע זֹ֥את יְהוֹנָתָ֖ן פֶּן יֵֽעָצֵ֑ב וְ/אוּלָ֗ם חַי יְהוָה֙ וְ/חֵ֣י נַפְשֶׁ֔/ךָ כִּ֣י כְ/פֶ֔שַׂע בֵּינִ֖/י וּ/בֵ֥ין הַ/מָּֽוֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/003.yaml
  text: But David swore again and said, “Your father certainly knows that I have found favor in your eyes, and he has said, ‘Jonathan must not know this, lest he be grieved.’ But as the LORD lives, and as your soul lives, there is only a step between me and death.”
translation:
  language: hi
  text: पर दाऊद ने फिर शपथ खाकर कहा, “तुम्हारे पिता अच्छी तरह जानते हैं कि मैंने तुम्हारी दृष्टि में अनुग्रह पाया है; और उन्होंने कहा है, ‘योनातान को यह पता न चले, कहीं वह दुखी न हो जाए।’ फिर भी, यहोवा के जीवन की शपथ और तुम्हारे प्राण की शपथ, मेरे और मृत्यु के बीच केवल एक कदम है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדֹעַ יָדַע
  choice: अच्छी तरह जानते हैं
  rationale: क्रिया की पुनरुक्ति निश्चितता और प्रबलता व्यक्त करती है; स्वाभाविक आधुनिक हिन्दी में इसे ‘अच्छी तरह’ से व्यक्त किया गया है।
- source_word: מָצָאתִי חֵן בְּעֵינֶיךָ
  choice: मुझ पर तुम्हारी कृपादृष्टि है
  rationale: हिब्रू मुहावरे ‘तुम्हारी आँखों में अनुग्रह पाया’ का अर्थ बनाए रखते हुए गरिमापूर्ण और सहज हिन्दी दी गई है।
- source_word: וַיֹּאמֶר
  choice: उन्होंने सोचा है
  rationale: शाऊल का कथन उद्धृत है, पर प्रसंग में यह उसके मन के निश्चय को भी दर्शाता है; ‘सोचा है’ हिन्दी में अगले आत्मकथित उद्धरण को स्वाभाविक बनाता है।
- source_word: אַל יֵדַע זֹאת יְהוֹנָתָן
  choice: योनातान को यह पता न चले
  rationale: निषेध का आशय यह है कि योनातान इस बात से अनजान रहे; हिन्दी में यह निष्पक्ष और सहज रूप है।
- source_word: חַי יְהוָה וְחֵי נַפְשֶׁךָ
  choice: जीवित यहोवा की और तुम्हारे जीवन की शपथ
  rationale: दोहरी शपथ की संरचना और गंभीरता सुरक्षित रखी गई है।
- source_word: כִּפֶשַׂע
  choice: केवल एक कदम का अंतर
  rationale: शाब्दिक रूप से बहुत छोटी दूरी/कदम का बिंब है; आसन्न मृत्यु का भाव स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: व्यक्तिगत वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी बाइबल परंपरा में परिचित नामरूप रखा गया है।
- issue: ‘तुम्हारे जीवन की शपथ’ का अर्थ
  choice: शपथ-सूत्र को यथावत रखा
  alternative: ‘जैसे तुम जीवित हो’
  rationale: मूल पाठ की प्राचीन शपथ-भाषा और उसके धार्मिक-सांस्कृतिक तनाव को आधुनिक व्याख्या में समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, संवादात्मक किंतु गरिमापूर्ण रखी गई है। हिब्रू की प्रबल पुनरुक्ति, दोहरी शपथ और मृत्यु से एक कदम की दूरी का बिंब संरक्षित है।
