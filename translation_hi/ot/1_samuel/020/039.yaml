  text: But the boy did not know anything[a]; only Jonathan and David knew the matter.
translation:
  language: hi
  text: परन्तु उस लड़के को कुछ भी पता नहीं था; केवल योनातान और दाऊद ही उस बात[a] को जानते थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘विषय’ या ‘व्यवस्था।’ इब्रानी दावार शब्द व्यापक है और चर्चा के अधीन किसी बात, विषय, या व्यवस्था का संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנַּעַר
  choice: परन्तु उस लड़के
  rationale: נַעַר यहाँ तीर लाने वाले युवा सहायक को दर्शाता है, इसलिए ‘लड़का’ स्वाभाविक और प्रसंगानुकूल है। וְ को अगले खंड के ज्ञान-विरोध के कारण ‘परन्तु’ के रूप में व्यक्त किया गया है।
- source_word: לֹא יָדַע מְאוּמָה
  choice: को कुछ भी पता नहीं था
  rationale: नकार के साथ מְאוּמָה का अर्थ ‘कुछ भी’ है। हिंदी में ‘पता नहीं था’ साधारण संज्ञानात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אַךְ
  choice: केवल ... ही
  rationale: यहाँ אַךְ सीमित करने वाला अर्थ रखता है; ‘केवल ... ही’ लड़के की अनभिज्ञता और योनातान तथा दाऊद के ज्ञान का स्पष्ट विरोध दिखाता है।
- source_word: יְהוֹנָתָן וְדָוִד
  choice: योनातान और दाऊद
  rationale: व्यक्तिनामों के प्रचलित हिंदी बाइबलीय रूप अपनाए गए हैं।
- source_word: יָדְעוּ אֶת־הַדָּבָר
  choice: उस बात को जानते थे
  rationale: יָדְעוּ को पहले आए יָדַע के अनुरूप ‘जानते थे’ रखा गया है। דָּבָר व्यापक शब्द है; ‘बात’ उसकी अस्पष्टता बनाए रखते हुए इस प्रसंग में स्वाभाविक हिंदी देता है।
