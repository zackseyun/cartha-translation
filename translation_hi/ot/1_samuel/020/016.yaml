source:
  edition: WLC
  text: וַ/יִּכְרֹ֥ת יְהוֹנָתָ֖ן עִם בֵּ֣ית דָּוִ֑ד וּ/בִקֵּ֣שׁ יְהוָ֔ה מִ/יַּ֖ד אֹיְבֵ֥י דָוִֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/016.yaml
  text: So Jonathan made a covenant with the house of David, and the LORD sought it from the hand of David’s enemies.
translation:
  language: hi
  text: तब योनातान ने दाऊद के घराने के साथ वाचा बाँधी, और यहोवा ने दाऊद के शत्रुओं से इसका लेखा माँगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस वाक्यांश का शब्दशः रूप है, “और यहोवा ने दाऊद के शत्रुओं के हाथ से माँगा।” कर्म मूल में व्यक्त नहीं है; उसे संदर्भ से वाचा से संबंधित समझा गया है। क्रियारूप को कुछ व्याख्याकार भविष्यसूचक या प्रार्थना-सदृश अर्थ में “माँगेगा” अथवा “माँगे” भी समझते हैं।
    reason: मूल के लुप्त कर्म और क्रियारूप की व्याख्यात्मक बहस को दर्शाते हुए मुख्य पाठ में उपलब्ध POB audit का कथनात्मक रूप रखा गया है।
lexical_decisions:
- source_word: וַיִּכְרֹת ... עִם
  choice: के साथ वाचा बाँधी
  rationale: ‘काटना’ यहाँ वाचा स्थापित करने का इब्रानी मुहावरा है; पिछले संदर्भ से लुप्त कर्म ‘वाचा’ स्पष्ट है।
- source_word: בֵּית דָּוִד
  choice: दाऊद का घराना
  rationale: यह अभिव्यक्ति केवल भवन नहीं, दाऊद के वंश और परिवार को दर्शाती है।
- source_word: וּבִקֵּשׁ יְהוָה מִיַּד
  choice: यहोवा ... से इसका लेखा माँगे
  rationale: בקשׁ מן־יד जवाबदेही या प्रतिफल माँगने का भाव रखता है। स्वाभाविक हिन्दी में ‘लेखा माँगना’ न्यायिक गंभीरता को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित लिप्यंतरण से व्यक्त किया गया है।
theological_decisions:
- issue: दूसरे खंड का काल और भाव
  choice: इसे योनातान की गंभीर प्रार्थना/शापसूचक कामना के रूप में ‘माँगे’ अनूदित किया गया है।
  alternative: ‘और यहोवा ने दाऊद के शत्रुओं के हाथ से इसका लेखा माँगा’ अथवा ‘माँगेगा’।
  rationale: संदर्भ में वाचा की पुष्टि और अगले पद में शपथ दिलाने की भाषा इस रूप को इच्छासूचक/शापसूचक समझने का समर्थन करती है, यद्यपि इब्रानी क्रियारूप को भूतकालीन कथन के रूप में भी पढ़ा जा सकता है; इस वास्तविक अस्पष्टता को पादटिप्पणी में रखा गया है।
- issue: ‘इसका’ का संकेत
  choice: इसे वाचा के उल्लंघन से संबंधित जवाबदेही के रूप में खुला रखा गया है।
  alternative: स्पष्ट रूप से ‘इस वाचा का बदला’ कहना।
  rationale: मूल पाठ में प्रत्यक्ष कर्म व्यक्त नहीं है। इसलिए अनुवाद उसे अत्यधिक विशिष्ट बनाकर प्रतिशोध या किसी खास दंड तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘वाचा’, ‘घराना’ और ‘लेखा माँगना’ बाइबलीय गंभीरता को बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
