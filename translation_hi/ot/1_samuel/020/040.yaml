  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सेवक युवक’ ने נַעַר की आयु-सूचना तथा אֲשֶׁר לוֹ से सूचित आश्रित सेवकीय संबंध—दोनों को सुरक्षित रखा है। पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित है।
