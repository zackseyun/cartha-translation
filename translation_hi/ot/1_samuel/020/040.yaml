base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/040.yaml
  text: Then Jonathan gave his weapons to the young man who was with him and said to him[a], “Go[c][b], bring them to the city.”
translation:
  language: hi
  text: तब योनातान ने अपने हथियार[a] उस युवक को दिए जो उसके साथ था, और उससे कहा, “जा, इन्हें[b] नगर में ले जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “हथियार” का अर्थ अधिक व्यापक रूप से “सामान” या “उपकरण” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “ले जा” का कर्म स्पष्ट रूप से नहीं दिया गया है; “इन्हें” संदर्भ के आधार पर जोड़ा गया है और योनातान के हथियारों/उपकरणों की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: दिए
  rationale: נתן का सामान्य आख्यानात्मक अर्थ ‘देना’ है; यहाँ बहुवचन ‘हथियार’ के साथ स्वाभाविक हिन्दी रूप ‘दिए’ है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כֵּלָיו
  choice: अपने हथियार
  rationale: כְּלִי का अर्थ सामान, उपकरण या हथियार हो सकता है; निकट संदर्भ में धनुष-बाण होने के कारण ‘हथियार’ उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַנַּעַר אֲשֶׁר לוֹ
  choice: अपने सेवक युवक को
  rationale: נַעַר युवक अथवा सेवक हो सकता है और אֲשֶׁר לוֹ योनातान से उसके आश्रित/सेवकीय संबंध को दर्शाता है। ‘सेवक युवक’ आयु और भूमिका दोनों को संक्षेप में व्यक्त करता है।
- source_word: וַיֹּאמֶר לוֹ
  choice: और उससे कहा
  rationale: אמר का सीधा और स्वाभाविक हिन्दी अनुवाद ‘कहा’ है।
- source_word: לֵךְ
  choice: जा
  rationale: הלך के एकवचन पुल्लिंग आदेश का सीधा अनौपचारिक रूप, जो स्वामी द्वारा युवक को दिए आदेश के अनुरूप है।
- source_word: הָבֵיא
  choice: इन्हें ... ले जा
  rationale: בוא के हिफ़ील का मूल अर्थ ‘लाना’ है, पर वक्ता से दूर नगर की दिशा में भेजते हुए आधुनिक हिन्दी में ‘ले जा’ स्वाभाविक है। कर्म इब्रानी में निहित है और संदर्भ से ‘हथियार’ के लिए ‘इन्हें’ जोड़ा गया है।
- source_word: הָעִיר
  choice: नगर
  rationale: निश्चित संज्ञा का सन्दर्भगत हिन्दी रूप; किसी विशेष नगर का नाम मूल पाठ नहीं देता।
