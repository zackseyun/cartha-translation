base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/023.yaml
  text: And as for the matter that you and I have spoken of[a], behold, Yahweh is between me and you forever.
translation:
  language: hi
  text: और जिस बात के बारे में मैंने और तुमने बात की है[a], देखो, याहवे मेरे और तुम्हारे बीच सदा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वह बात जो मैंने और तुमने कही है।’ इब्रानी דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है; यहाँ इसका संकेत अभी चर्चा की गई सहमति की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַדָּבָר
  choice: और जिस बात के विषय में
  rationale: דָּבָר का अर्थ ‘वचन’, ‘बात’ या ‘विषय’ हो सकता है। यहाँ यह दाऊद और योनातान के बीच अभी हुई सहमति की ओर संकेत करता है; इसलिए ‘बात’ स्वाभाविक और संदर्भानुकूल है।
- source_word: אֲשֶׁר דִּבַּרְנוּ אֲנִי וָאָתָּה
  choice: मैंने और तुमने आपस में कहा है
  rationale: यह चयन पूर्व में हुई बातचीत और उसकी वर्तमान प्रासंगिकता को व्यक्त करता है। ‘आपस में’ पारस्परिक वार्ता को स्वाभाविक हिन्दी में स्पष्ट करता है, जबकि कर्ताओं का इब्रानी क्रम बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: הִנֵּה कथन की ओर गंभीरतापूर्वक ध्यान खींचता है। आधुनिक हिन्दी में ‘देखो’ सहज है और मूल का उद्बोधक बल बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: בֵּינִי וּבֵינְךָ
  choice: मेरे और तुम्हारे बीच
  rationale: यह मूल शब्दक्रम और दोनों पक्षों के बीच परमेश्वर की गंभीर साक्षी अथवा प्रत्याभूतिक उपस्थिति की अर्थ-संभावना को बनाए रखता है।
- source_word: עַד עוֹלָם
  choice: सदा रहे
  rationale: עַד עוֹלָם दीर्घस्थायी, अनंत अवधि व्यक्त करता है। हिन्दी वाक्य में ‘सदा रहे’ स्वाभाविक रूप से इस स्थायी संबंध को व्यक्त करता है।
theological_decisions:
- issue: यहोवा का दोनों के ‘बीच’ होना
  choice: यहोवा मेरे और तुम्हारे बीच सदा रहे
  alternative: यहोवा सदा हमारे समझौते का साक्षी रहे
  rationale: मूल पाठ केवल ‘बीच’ कहता है और साक्षी, निर्णायक या प्रत्याभूतिक भूमिका को स्पष्ट नहीं करता। मुख्य पाठ में इस धार्मिक अर्थ-तनाव और अस्पष्टता को सुरक्षित रखा गया है।
- issue: יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम है। हिन्दी पाठकों में पहचाने जाने वाले ‘यहोवा’ रूप को चुना गया है; इसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया।
- issue: עַד עוֹלָם के साथ क्रिया
  choice: सदा रहे
  alternative: सदा है
  rationale: इब्रानी में नामवाची कथन है और स्पष्ट क्रिया नहीं है। इस प्रसंग में हिन्दी का कामनासूचक ‘रहे’ गंभीर संधि-वचन के रूप में स्वाभाविक है, यद्यपि इसे वर्तमान कथन ‘है’ भी समझा जा सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘देखो’ ने הִנֵּה का गंभीर उद्बोधक स्वर बनाए रखा है। ‘आपस में’ हिन्दी में पारस्परिक बातचीत स्पष्ट करता है; मुख्य वाक्य ने ‘बीच’ के वाचागत और धार्मिक अर्थ को अनावश्यक रूप से विस्तृत नहीं किया।
