base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/027.yaml
  text: And it happened on the next day[a], the second day of the new moon, that David’s place was empty. So Saul said to Jonathan his son, “Why has the son of Jesse not come to the meal either yesterday or today?”
translation:
  language: hi
  text: अगले दिन, नए चाँद के दूसरे दिन, दाऊद का स्थान खाली था। तब शाऊल ने अपने पुत्र योनातान से कहा, “यिशै का पुत्र न तो कल और न आज भोज[a] में क्यों आया?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘रोटी को’ है; यहाँ इसका आशय भोज या साथ बैठकर खाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִמָּחֳרַת
  choice: अगले दिन
  rationale: यह पिछले उल्लेखित दिन के बाद वाले दिन को सूचित करता है; ‘अगले दिन’ स्वाभाविक और क्रम-संगत हिन्दी है।
- source_word: הַחֹדֶשׁ הַשֵּׁנִי
  choice: नवचंद्र के दूसरे दिन
  rationale: इस प्रसंग में חֹדֶשׁ नवचंद्र के उत्सव/भोज को सूचित करता है, केवल कैलेंडर के महीने को नहीं; ‘दूसरे दिन’ उत्सव के दूसरे दिन को स्पष्ट करता है।
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: दाऊद का स्थान खाली पाया गया
  rationale: פקד के निफ़ाल रूप का यहाँ भाव है कि दाऊद की जगह अनुपस्थित या खाली पाई गई; यह अनुवाद उस निरीक्षण और भोज के संदर्भ दोनों को बनाए रखता है।
- source_word: בְּנוֹ
  choice: अपने पुत्र
  rationale: सम्बन्धसूचक पद को स्पष्ट रूप से रखा गया है; हिन्दी में कर्ता शाऊल के अनुसार ‘अपने पुत्र’ स्वाभाविक है।
- source_word: מַדּוּעַ
  choice: क्यों
  rationale: कारण पूछने वाले सामान्य प्रश्नवाचक का सहज हिन्दी समतुल्य।
- source_word: בֶן יִשַׁי
  choice: यिशै का पुत्र
  rationale: शाऊल दाऊद का नाम न लेकर उसके पितृनाम से उल्लेख करता है; इस सम्भावित दूरी या तिरस्कार को अनुवाद में सुरक्षित रखा गया है।
- source_word: גַּם תְּמוֹל גַּם הַיּוֹם
  choice: न तो कल और न आज
  rationale: नकारात्मक प्रश्न में यह आधुनिक हिन्दी का स्वाभाविक रूप है और दोनों दिनों पर समान बल बनाए रखता है।
- source_word: אֶל הַלָּחֶם
  choice: भोजन के लिए
  rationale: לֶחֶם का शाब्दिक अर्थ ‘रोटी’ है, पर यहाँ यह पूरे भोज या साथ बैठकर खाने के लिए लक्षणा से प्रयुक्त है।
