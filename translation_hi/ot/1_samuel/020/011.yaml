base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/011.yaml
  text: Then Jonathan said to David[a], “Come, and let us go out into the field.” So both of them went out into the field.
translation:
  language: hi
  text: तब योनातान ने दाऊद से कहा,[a] “आओ, हम मैदान में चलें।” तब वे दोनों मैदान में चले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चलो, हम मैदान में चलें।” इब्रानी आज्ञार्थक לְכָה का अधिक शाब्दिक अनुवाद “चलो” या “जाओ” हो सकता है, पर यहाँ साथ चलने के निमंत्रण में “आओ” अधिक स्वाभाविक है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम स्पष्ट करता है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: אֶל דָּוִד
  choice: दाऊद से
  rationale: कहने की क्रिया के साथ אֶל का स्वाभाविक हिन्दी रूप ‘से’ है; दाऊद नाम का प्रचलित हिन्दी रूप रखा गया है।
- source_word: לְכָה
  choice: आओ
  rationale: शाब्दिक अर्थ ‘चलो/जाओ’ हो सकता है, पर साथ चलने के निमंत्रण के इस प्रसंग में ‘आओ’ स्वाभाविक है।
- source_word: וְנֵצֵא
  choice: हम ... चलें
  rationale: प्रथम पुरुष बहुवचन कोहोर्टेटिव प्रस्ताव या निमंत्रण व्यक्त करता है; ‘हम चलें’ उस इच्छार्थक भाव को सहज हिन्दी में रखता है।
- source_word: הַשָּׂדֶה
  choice: मैदान में
  rationale: שׂדה खेत, मैदान या खुला क्षेत्र सूचित कर सकता है। इस प्रसंग में ‘मैदान’ किसी विशेष कृषिक्षेत्र का अनावश्यक संकेत दिए बिना खुले स्थान को व्यक्त करता है; मूल की पुनरावृत्ति भी रखी गई है।
- source_word: וַיֵּצְאוּ
  choice: तब ... चले गए
  rationale: क्रमिक वाव निमंत्रण के बाद हुई अगली क्रिया बताता है। हिन्दी में ‘चले गए’ बाहर खुले क्षेत्र की ओर जाने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁנֵיהֶם
  choice: वे दोनों
  rationale: यह द्विवचन योनातान और दाऊद दोनों के साथ जाने पर बल देता है; ‘वे दोनों’ संक्षिप्त और स्वाभाविक है।
