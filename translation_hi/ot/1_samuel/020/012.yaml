source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוֹנָתָ֜ן אֶל דָּוִ֗ד יְהוָ֞ה אֱלֹהֵ֤י יִשְׂרָאֵל֙ כִּֽי אֶחְקֹ֣ר אֶת אָבִ֗/י כָּ/עֵ֤ת מָחָר֙ הַ/שְּׁלִשִׁ֔ית וְ/הִנֵּה ט֖וֹב אֶל דָּוִ֑ד וְ/לֹֽא אָז֙ אֶשְׁלַ֣ח אֵלֶ֔י/ךָ וְ/גָלִ֖יתִי אֶת אָזְנֶֽ/ךָ־־־׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/012.yaml
  text: And Jonathan said to David[a], “As Yahweh, the God of Israel, lives, when I sound out my father about this time tomorrow, or the third day, and behold, if it is favorable toward David[c][b], shall I not then send to you and uncover your ear?"
translation:
  language: hi
  text: और योनातान ने दाऊद से कहा, “याहवे, इस्राएल के परमेश्वर के जीवन की शपथ, मैं कल इसी समय या तीसरे दिन अपने पिता का मन टटोलूँगा। और यदि ऐसा हो कि दाऊद के प्रति उनका रुख अच्छा हो, तो क्या मैं तब तेरे पास किसी को भेजकर तुझे यह बात न बताऊँगा?[a]”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक रूप से, “तेरा कान खोलूँगा,” अर्थात् “तुझे बताऊँगा” या “तुझ पर यह बात प्रकट करूँगा।”
    reason: lexical_alternative
  - marker: b
    text: इस पद का हिब्रू वाक्य संक्षिप्त और कठिन है। आरंभिक शब्दों का भाव याहवे को साक्षी मानकर खाई गई गंभीर शपथ का है; समय-सूचक पदबंध का अनुवाद “कल इसी समय, तीसरे दिन” भी हो सकता है।
    reason: textual_variant
lexical_decisions:
- source_word: יְהוָה אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर याहवे
  rationale: ईश्वरीय नाम को ‘याहवे’ के रूप में रखा गया और संबंधवाचक पदबंध को स्वाभाविक हिन्दी क्रम में प्रस्तुत किया गया।
- source_word: כִּי
  choice: के जीवन की शपथ
  rationale: यहाँ כי ईश्वरीय आह्वान के बाद आने वाले संक्षिप्त शपथ-वाक्य का अंग है; हिन्दी में यह प्रयोग उस गंभीर प्रतिज्ञात्मक बल को स्पष्ट करता है।
- source_word: אֶחְקֹר אֶת אָבִי
  choice: मैं अपने पिता का मन टटोलूँगा
  rationale: क्रिया का आशय शाऊल की मनोवृत्ति जानने के लिए सावधानी से जाँच करना है; ‘मन टटोलना’ आधुनिक हिन्दी में इस पारस्परिक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּעֵת מָחָר הַשְּׁלִשִׁית
  choice: कल इसी समय या तीसरे दिन
  rationale: मसोराई पदबंध संक्षिप्त और कालगत रूप से कठिन है। ‘या’ प्रसंग में संभावित समय-विस्तार को समझने योग्य बनाता है, जबकि अनिश्चितता को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְהִנֵּה
  choice: और देख
  rationale: हिब्रू के ध्यान आकर्षित करने वाले कथन-सूचक की जीवंतता बनाए रखी गई है।
- source_word: טוֹב אֶל דָּוִד
  choice: दाऊद के प्रति उनका रुख अच्छा हुआ
  rationale: यह पदबंध दाऊद के प्रति पिता की अनुकूल मनोवृत्ति को दर्शाता है; हिन्दी में निहित कर्ता को ‘उनका रुख’ से स्पष्ट किया गया है।
- source_word: וְלֹא אָז אֶשְׁלַח אֵלֶיךָ
  choice: तो क्या मैं तेरे पास संदेश भेजकर ... न बताऊँगा?
  rationale: निषेधात्मक रचना का आलंकारिक प्रश्न सुरक्षित रखा गया है; ‘संदेश’ क्रिया ‘भेजना’ के प्रसंगगत आशय को सहज हिन्दी में स्पष्ट करता है।
- source_word: וְגָלִיתִי אֶת אָזְנֶךָ
  choice: तुझे यह बात न बताऊँगा
  rationale: शाब्दिक अर्थ ‘तेरा कान खोलूँगा’ है, पर यह सूचना प्रकट करने का हिब्रू मुहावरा है। मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ और पादटिप्पणी में मूल बिंब दिया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम को शीर्षक से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: संक्षिप्त शपथ-वाक्य का अर्थ
  choice: इस्राएल के परमेश्वर याहवे के जीवन की शपथ
  alternative: इस्राएल का परमेश्वर याहवे साक्षी है; इस्राएल के परमेश्वर याहवे की शपथ
  rationale: हिब्रू वाक्य व्याकरण की दृष्टि से अपूर्ण प्रतीत होता है, पर प्रसंग में योनातान की गंभीर प्रतिज्ञा स्पष्ट है। चुना हुआ पाठ सामान्य शपथार्थ व्यक्त करता है, जबकि उसकी संक्षिप्तता और कठिनाई पादटिप्पणी में बताई गई है।
- issue: וְלֹא को आलंकारिक प्रश्न मानना
  choice: तो क्या मैं ... न बताऊँगा?
  alternative: तो मैं ... अवश्य बताऊँगा
  rationale: प्रश्नात्मक रूप मूल के निषेधात्मक बल और प्रतिज्ञात्मक आश्वासन दोनों को बनाए रखता है, बिना उसे सपाट कथन में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। दाऊद और योनातान के घनिष्ठ संवाद के अनुरूप एकवचन आत्मीय सर्वनाम ‘तेरे/तुझे’ प्रयुक्त हुआ है। मूल के कठिन शपथ-वाक्य और संक्षिप्त समय-सूचक अभिव्यक्ति को अत्यधिक निश्चित किए बिना पादटिप्पणी में स्पष्ट किया गया है।
