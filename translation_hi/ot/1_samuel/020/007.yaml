source:
  edition: WLC
  text: אִם כֹּ֥ה יֹאמַ֛ר ט֖וֹב שָׁל֣וֹם לְ/עַבְדֶּ֑/ךָ וְ/אִם חָרֹ֤ה יֶֽחֱרֶה֙ ל֔/וֹ דַּ֕ע כִּֽי כָלְתָ֥ה הָ/רָעָ֖ה מֵ/עִמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/007.yaml
  text: If he says[a], ‘Good,’ there will be peace for your servant; but if he becomes very angry, know that evil has been determined by him.
translation:
  language: hi
  text: यदि वह कहे, “अच्छा,” तो तुम्हारे दास की कुशल होगी; पर यदि वह बहुत क्रोधित हो जाए, तो जान लेना कि उसने अनिष्ट करने का दृढ़ निश्चय कर लिया है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी ओर से अनिष्ट पूरी तरह निश्चित है”; अर्थात शाऊल ने हानि पहुँचाने का पक्का निश्चय कर लिया है।
    reason: כָלְתָה और מֵעִמּוֹ के अधिक शाब्दिक रूप तथा उनसे व्यक्त दृढ़ हानिकारक इरादे को सुरक्षित रखना।
lexical_decisions:
- source_word: טוֹב
  choice: अच्छा
  rationale: यह शाऊल की स्वीकृतिसूचक संक्षिप्त प्रतिक्रिया है; हिन्दी संवाद में “अच्छा” स्वाभाविक रूप से वही अर्थ देता है।
- source_word: שָׁלוֹם לְעַבְדֶּךָ
  choice: तुम्हारे दास की कुशल होगी
  rationale: שָׁלוֹם यहाँ दाऊद की सुरक्षा और भलाई को सूचित करता है। भविष्यसूचक निष्कर्ष को हिन्दी में “कुशल होगी” से स्पष्ट और स्वाभाविक रूप दिया गया है।
- source_word: חָרֹה יֶחֱרֶה לוֹ
  choice: वह बहुत क्रोधित हो जाए
  rationale: धातु के साथ infinitive absolute क्रोध की तीव्रता पर बल देता है; “बहुत क्रोधित” उस बल को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דַּע
  choice: जान लेना
  rationale: यह प्रतिक्रिया से निष्कर्ष निकालने की आज्ञा है; “जान लेना” हिन्दी में प्रसंगानुकूल और सीधा है।
- source_word: כָלְתָה הָרָעָה מֵעִמּוֹ
  choice: उसने अनिष्ट करने का दृढ़ निश्चय कर लिया है
  rationale: वाक्यांश शाऊल की ओर से हानि पहुँचाने के पूर्णतः ठान लिए गए इरादे को व्यक्त करता है। “अनिष्ट” नैतिक और हानिकारक दोनों अर्थों को रखता है, जबकि “दृढ़ निश्चय” כָלְתָה की पूर्णता को स्पष्ट करता है।
theological_decisions:
- issue: שָׁלוֹם का आशय
  choice: तुम्हारे दास की कुशल होगी
  alternative: तुम्हारे दास के लिए शान्ति होगी
  rationale: यहाँ आशय केवल संघर्ष का अभाव नहीं, बल्कि दाऊद की सुरक्षा और भलाई है; “कुशल” हिन्दी में इस व्यापक अर्थ को बेहतर व्यक्त करता है।
- issue: כָלְתָה הָרָעָה מֵעִמּוֹ की अस्पष्ट संरचना
  choice: उसने अनिष्ट करने का दृढ़ निश्चय कर लिया है
  alternative: उसकी ओर से अनिष्ट पूरी तरह निश्चित है
  rationale: मुख्य पाठ में स्वाभाविक हिन्दी रखते हुए शाऊल के ठाने हुए हानिकारक इरादे को व्यक्त किया गया है; अधिक शाब्दिक स्रोत/पूर्णता-संबंधी रूप को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “तुम्हारे दास” मूल के विनम्र आत्म-संबोधन को बनाए रखता है; “अनिष्ट” सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की नैतिक गंभीरता को भी सुरक्षित रखता है।
