  language: hi
  text: दावीद मैदान में छिप गया। जब नया चाँद आया, तब राजा भोजन करने बैठा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּסָּתֵר
  choice: छिप गया
  rationale: 'निफ़अल रूप यहाँ प्रसंगानुसार आत्मवाचक/अकर्मक अर्थ देता है: दावीद ने अपने को छिपाया। आधुनिक हिन्दी में ‘छिप गया’ स्वाभाविक है और उसकी जानबूझकर की गई क्रिया व्यक्त करता है।'
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה का सीधा अर्थ खेत या मैदान है। इस प्रसंग में छिपने के खुले ग्रामीण स्थान के लिए ‘मैदान’ अधिक स्वाभाविक हिन्दी है।
- source_word: וַיְהִי הַחֹדֶשׁ
  choice: जब नया चाँद आया
  rationale: הַחֹדֶשׁ यहाँ केवल महीने के आरम्भ को नहीं, नए चाँद के अवसर को सूचित करता है। कालवाचक ‘जब’ कथानक का संबंध स्पष्ट करता है।
- source_word: וַיֵּשֶׁב
  choice: बैठा
  rationale: भोजन के प्रसंग में ישב का स्वाभाविक हिन्दी रूप ‘बैठा’ है।
- source_word: עַל הַלֶּחֶם לֶאֱכֹל
  choice: भोजन करने
  rationale: शाब्दिक रूप ‘रोटी पर खाने के लिए’ है, पर לֶחֶם यहाँ पूरे भोजन का लक्षणार्थक संकेत है। ‘भोजन करने बैठा’ हिन्दी में अर्थ को संक्षिप्त और स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּוִד
  choice: दावीद
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय लिप्यंतरण।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: मूल में निश्चित उपाधि है; इसलिए शाऊल का नाम रखने के बजाय ‘राजा’ रखा गया है।
