source:
  edition: WLC
  text: וְ/אִם כֹּ֤ה אֹמַר֙ לָ/עֶ֔לֶם הִנֵּ֥ה הַ/חִצִּ֖ים מִמְּ/ךָ֣ וָ/הָ֑לְאָה לֵ֕ךְ כִּ֥י שִֽׁלַּחֲ/ךָ֖ יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/022.yaml
  text: But if I say this to the young man[a], ‘Look, the arrows are beyond you,’ then go, for Yahweh has sent you away.
translation:
  language: hi
  text: पर यदि मैं उस जवान से यह कहूँ, ‘देखो, तीर तुमसे आगे हैं,’ तब चले जाना, क्योंकि यहोवा ने तुम्हें भेज दिया है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: पिछले संकेत के विपरीत विकल्प को स्पष्ट करता है और प्रसंग में स्वाभाविक है।
- source_word: לָעֶלֶם
  choice: उस जवान से
  rationale: עֶלֶם का अर्थ युवक या जवान है; यहाँ योनातान के साथ आए जवान की ओर संकेत है, पर मूल संज्ञा में ‘सेवक’ की भूमिका स्पष्ट नहीं की गई।
- source_word: הִנֵּה הַחִצִּים מִמְּךָ וָהָלְאָה
  choice: देखो, तीर तुम्हारे पार हैं
  rationale: 'स्थान-संबंधी संकेत को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है: तीर उस जवान से आगे हैं।'
- source_word: לֵךְ
  choice: चले जाना
  rationale: आज्ञार्थक क्रिया है; संकेत सुनने के बाद दाऊद के प्रस्थान को संदर्भानुकूल ढंग से व्यक्त करती है।
- source_word: שִׁלַּחֲךָ
  choice: तुम्हें विदा किया है
  rationale: यहाँ क्रिया केवल भेजने से अधिक, दाऊद को वहाँ से जाने देने या भेज देने का भाव रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से परमेश्वर के व्यक्तिगत नाम को प्रस्तुत करता है, शीर्षक से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। हिन्दी बाइबल-परंपरा में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; इसे ‘प्रभु’ जैसे शीर्षक से नहीं बदला गया।
- issue: यहोवा द्वारा दाऊद को भेजे जाने का कथन
  choice: यहोवा ने तुम्हें विदा किया है
  alternative: यहोवा ने तुम्हें भेजा है
  rationale: 'मूल कथन को सीधे रखा गया है: योनातान आसन्न प्रस्थान को परमेश्वर की व्यवस्था के रूप में व्यक्त करता है। इसमें दाऊद के गंतव्य या परमेश्वर की मंशा का अतिरिक्त निर्धारण नहीं किया गया।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘जवान’ मूल עֶלֶם की आयु-सूचक अस्पष्टता बनाए रखता है; ‘तुम्हारे पार’ संकेत की स्थानगत दिशा को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
