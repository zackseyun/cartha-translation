  text: וַ/יָּ֧קָם יְהוֹנָתָ֛ן מֵ/עִ֥ם הַ/שֻּׁלְחָ֖ן בָּ/חֳרִי אָ֑ף וְ/לֹא אָכַ֞ל בְּ/יוֹם הַ/חֹ֤דֶשׁ הַ/שֵּׁנִי֙ לֶ֔חֶם כִּ֤י נֶעְצַב֙ אֶל דָּוִ֔ד כִּ֥י הִכְלִמ֖/וֹ אָבִֽי/ו־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/034.yaml
  text: Then Jonathan rose from the table in fierce anger[a], and he ate no food on the second day of the month, because he was grieved over David, because his father had humiliated him.
translation:
  language: hi
  text: तब योनातान क्रोध से भड़ककर मेज़ से उठ गया। उसने महीने के दूसरे दिन[a] कुछ नहीं खाया, क्योंकि वह दाऊद के विषय में दुखी था और इसलिए कि उसके पिता ने उसका अपमान किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नए चाँद के दूसरे दिन।” इब्रानी शब्द חֹדֶשׁ का अर्थ “महीना” या “नया चाँद” हो सकता है; यहाँ प्रसंग राजकीय नए-चाँद के भोज का है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “उसे” का संदर्भ स्पष्ट नहीं है। निकट प्रसंग में यह संभवतः योनातान है, जिसे उसके पिता ने अपमानित किया था; इसे दाऊद भी समझा जा सकता है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठ गया
  rationale: कथा-संदर्भ में קום के सामान्य अर्थ को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מֵעִם הַשֻּׁלְחָן
  choice: मेज़ से
  rationale: भोजन के स्थान से दूर होने की गति को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּחֳרִי אָף
  choice: क्रोध से आग-बबूला होकर
  rationale: मूल पदबंध में क्रोध की जलन और तीव्रता का भाव है; यह प्रचलित हिन्दी मुहावरा उसी तीव्रता को संप्रेषित करता है।
- source_word: וְלֹא אָכַל ... לֶחֶם
  choice: कुछ नहीं खाया
  rationale: לֶחֶם यहाँ केवल रोटी नहीं, भोजन का सामान्य संकेत है; हिन्दी में यह वाक्य पूरे भोजन से विरत रहने का अर्थ स्वाभाविक रूप से देता है।
- source_word: בְּיוֹם הַחֹדֶשׁ הַשֵּׁנִי
  choice: महीने के दूसरे दिन
  rationale: חֹדֶשׁ का सीधा अर्थ ‘महीना’ हो सकता है, जबकि प्रसंग अमावस्या के राजकीय भोज का है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: נֶעְצַב
  choice: बहुत दुखी था
  rationale: निफ़अल रूप पीड़ा या शोक अनुभव करने का भाव देता है; ‘बहुत’ प्रसंग में भाव की तीव्रता को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: אֶל דָּוִד
  choice: दाऊद के कारण
  rationale: पूर्वसर्ग यहाँ योनातान के दुख के संबंध या कारण के रूप में दाऊद की ओर संकेत करता है।
- source_word: הִכְלִמוֹ
  choice: दाऊद का अपमान किया था
  rationale: हिफ़इल रूप का अर्थ लज्जित या अपमानित करना है। पुल्लिंग एकवचन प्रत्यय का निकटतम संदर्भ दाऊद है; संज्ञा दोहराने से हिन्दी में संभावित सर्वनाम-अस्पष्टता दूर होती है।
- source_word: אָבִיו
  choice: उसके पिता
  rationale: प्रत्यय योनातान के पिता शाऊल की ओर संकेत करता है और पारिवारिक तनाव को मूल के अनुरूप बनाए रखता है।
theological_decisions:
- issue: הִכְלִמוֹ में कर्मवाचक प्रत्यय का संदर्भ
  choice: दाऊद का अपमान किया था
  alternative: उसका अपमान किया था, अर्थात योनातान का
  rationale: तात्कालिक वाक्य-विन्यास और दाऊद के प्रति योनातान के दुख का उल्लेख दाऊद को संभावित कर्म बनाता है, यद्यपि पिछले पद में शाऊल ने योनातान को भी सार्वजनिक रूप से लज्जित किया था; इसलिए संदर्भगत तनाव स्वीकार किया गया है, पर हिन्दी मुख्य पाठ में अस्पष्ट सर्वनाम से बचने के लिए दाऊद चुना गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण कथात्मक हिन्दी। ‘मेज़’ और ‘कुछ नहीं खाया’ साधारण पाठकों के लिए स्वाभाविक हैं; ‘क्रोध से आग-बबूला’ मूल के जलते हुए क्रोध की तीव्र छवि बनाए रखता है।
