  language: hi
  text: तब योनातान ने दाऊद से कहा, “तेरा मन क्या कहता है?[a] मैं तेरे लिए वही करूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक भावानुसार, “तू जो चाहे, मैं तेरे लिए करूँगा।”
    reason: इब्रानी ‘तेरा प्राण क्या कहता है?’ इच्छा या अभिलाषा पूछने का मुहावरा हो सकता है; मुख्य पाठ उसका प्रश्नरूप और रूपक सुरक्षित रखता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमबोधक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक रूप से क्रम व्यक्त करता है।
- source_word: יְהוֹנָתָן אֶל דָּוִד
  choice: योनातान ने दाऊद से
  rationale: नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं और אֶל को कथन के संबोधन में स्वाभाविक ‘से’ से व्यक्त किया गया है।
- source_word: מַה תֹּאמַר נַפְשְׁךָ
  choice: तेरा मन क्या कहता है?
  rationale: इब्रानी में ‘तेरा प्राण/भीतरी व्यक्तित्व क्या कहता है?’ जैसा प्रश्न है। ‘मन’ हिन्दी में इच्छा और अंतरतम दोनों का स्वाभाविक संकेत देता है तथा प्रश्नरूप और बोलने के रूपक को बनाए रखता है।
- source_word: וְאֶעֱשֶׂה לָּךְ
  choice: मैं तेरे लिए वही करूँगा
  rationale: עשה का सीधा अर्थ ‘करना’ और לְ का हितार्थक भाव ‘तेरे लिए’ रखा गया है। ‘वही’ पिछले प्रश्न में निहित इच्छित कार्य को हिन्दी में स्वाभाविक ढंग से स्पष्ट करता है।
