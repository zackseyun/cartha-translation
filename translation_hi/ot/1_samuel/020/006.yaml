base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/006.yaml
  text: If your father surely notices me[a], then say, ‘David earnestly asked leave of me to run to Bethlehem, his city[d][c][b], because the yearly sacrifice is there for the whole family.’
translation:
  language: hi
  text: यदि तुम्हारे पिता मेरी अनुपस्थिति पर अवश्य ध्यान दें[a], तो कहना, ‘दाऊद ने मुझसे बहुत आग्रह करके[b] अपने नगर बेतलेहेम दौड़कर जाने की[c] अनुमति माँगी, क्योंकि वहाँ पूरे परिवार के लिए वार्षिक बलिदान[d] होता है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि तुम्हारे पिता को मेरी कमी अवश्य खले।” इब्रानी में एक ही धातु के बलसूचक अनन्त रूप और रूपान्तरित क्रियारूप के मेल से विशेष बल दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाऊद ने मुझसे तत्काल अनुमति माँगी।” यहाँ भी इब्रानी में बलसूचक अनन्त रूप और रूपान्तरित क्रियारूप का मेल आग्रह की तीव्रता दिखाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक अर्थ, “बेतलेहेम दौड़ जाने की”; भाव शीघ्र वहाँ जाने का है।
    reason: lexical_alternative
  - marker: d
    text: शाब्दिक रूप से यह पदबंध “दिनों का बलिदान” है और नियमित रूप से, सम्भवतः प्रति वर्ष, होने वाले बलिदान को दर्शाता है।
    reason: lexical_alternative
