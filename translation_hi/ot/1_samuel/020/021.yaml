  text: וְ/הִנֵּה֙ אֶשְׁלַ֣ח אֶת הַ/נַּ֔עַר לֵ֖ךְ מְצָ֣א אֶת הַ/חִצִּ֑ים אִם אָמֹר֩ אֹמַ֨ר לַ/נַּ֜עַר הִנֵּ֥ה הַ/חִצִּ֣ים מִמְּ/ךָ֣ וָ/הֵ֗נָּה קָחֶ֧/נּוּ וָ/בֹ֛אָ/ה כִּֽי שָׁל֥וֹם לְ/ךָ֛ וְ/אֵ֥ין דָּבָ֖ר חַי יְהוָֽה־־־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/021.yaml
  text: And look[a], I will send the young man, saying, ‘Go, find the arrows.’ If I plainly say to the young man, ‘Behold, the arrows are on this side of you; take them and come,’ then there is peace for you and no danger[b], as Yahweh lives.
translation:
  language: hi
  text: और देखो, मैं उस युवक को यह कहकर भेजूँगा, ‘जाओ, तीरों को ढूँढ़ो।’ यदि मैं उस युवक से साफ़-साफ़ कहूँ, ‘देखो, तीर तुम्हारे इस पार हैं[a]; उन्हें ले लो और आ जाओ,’ तो याहवे के जीवन की शपथ, तुम्हारे लिए कुशल है और कोई खतरा नहीं है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तीर तुमसे निकट, इसी ओर हैं।” हिब्रू वाक्यांश बताता है कि तीर युवक के पार नहीं, बल्कि उससे पहले, योनातान की ओर गिरे हैं।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “याहवे जीवित है”; यह कथन की सत्यता की पुष्टि करने वाला हिब्रू शपथ-सूत्र है।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: ध्यान आकर्षित करने वाले हिब्रू संकेत को रखते हुए योनातान की योजना के अगले चरण का परिचय देता है।
- source_word: הַנַּעַר
  choice: युवक
  rationale: נַעַר आयु अथवा अधीनस्थ भूमिका का संकेत दे सकता है; ‘युवक’ सेवक की भूमिका को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक हिन्दी देता है।
- source_word: לֵךְ מְצָא אֶת־הַחִצִּים
  choice: जाओ, तीरों को ढूँढ़ो
  rationale: आज्ञार्थक कथन और מָצָא के सामान्य अर्थ को सीधे तथा स्वाभाविक रूप में व्यक्त करता है।
- source_word: אִם אָמֹר אֹמַר
  choice: यदि मैं ... साफ-साफ कहूँ
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute से आए बल को हिन्दी की पुनरुक्ति ‘साफ-साफ’ द्वारा व्यक्त किया गया है।
- source_word: הַחִצִּים מִמְּךָ וָהֵנָּה
  choice: तीर तुम्हारी इस ओर हैं
  rationale: यह संकेत बताता है कि तीर युवक के पार नहीं, बल्कि वक्ता की ओर गिरे हैं; अगले पद के विपरीत दिशात्मक अर्थ को बनाए रखता है।
- source_word: קָחֶנּוּ וָבֹאָה
  choice: उन्हें उठा लो और आ जाओ
  rationale: एकवचन रूप वाले प्रत्यय का आशय बहुवचन ‘तीर’ है; हिन्दी में बहुवचन सर्वनाम स्वाभाविक है, और दिशासूचक रूप वक्ता की ओर लौटने को दर्शाता है।
- source_word: כִּי שָׁלוֹם לְךָ וְאֵין דָּבָר
  choice: तो तुम्हारे लिए सब कुशल है और कोई खतरा नहीं है
  rationale: שָׁלוֹם के कुशल-मंगल और सुरक्षा के भाव को रखा गया है, जबकि संदर्भ में דָּבָר से अभिप्रेत प्रतिकूल बात या संकट को ‘खतरा’ स्पष्ट करता है।
- source_word: חַי יְהוָה
  choice: याहवे के जीवन की शपथ
  rationale: यह हिब्रू की प्रचलित शपथ-विधि है; हिन्दी में शपथ के रूप में व्यक्त करने से इसका वाक्यगत कार्य स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम है; उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: חַי יְהוָה को कथन या शपथ मानना
  choice: याहवे के जीवन की शपथ
  alternative: याहवे जीवित है
  rationale: इस प्रसंग में पदबंध कथन की सत्यता और निश्चितता की पुष्टि करने वाला शपथ-सूत्र है, यद्यपि शब्दशः इसमें याहवे के जीवित होने का कथन निहित है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण मानक हिन्दी। ‘देखो’ ने प्राचीनतापूर्ण ‘निहारो’ जैसे विकल्प से बचते हुए संकेतात्मक बल रखा है। सुरक्षा का आशय स्पष्ट किया गया है, पर ‘कुशल’ द्वारा שָׁלוֹם की व्यापकता भी बचाई गई है।
