  yaml_path: translation/ot/1_samuel/020/017.yaml
  text: And Jonathan made David swear again by his love for him[b][a], for he loved him as his own soul.
translation:
  language: hi
  text: और योनातान ने दाऊद को अपने दाऊद के प्रति प्रेम की शपथ फिर दिलाई[a], क्योंकि वह उससे अपने प्राण के समान प्रेम करता था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “योनातान ने दाऊद को फिर शपथ के अधीन किया।” इब्रानी क्रिया का अर्थ क्रिया को फिर करना या उसे जारी रखना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיּוֹסֶף
  choice: फिर
  rationale: יסף के साथ आए infinitive का भाव यहाँ क्रिया की पुनरावृत्ति है; ‘फिर’ इसे स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: לְהַשְׁבִּיעַ
  choice: शपथ खिलाई
  rationale: שבע के हिफ़इल रूप में किसी को शपथ दिलाने या शपथ के अधीन करने का causative भाव है; ‘शपथ खिलाई’ मानक हिन्दी में इसे स्पष्ट रखता है।
- source_word: בְּאַהֲבָתוֹ אֹתוֹ
  choice: अपने प्रति उसके प्रेम की शपथ
  rationale: 'सर्वनामों का स्वाभाविक हिन्दी विन्यास ‘दाऊद से अपने प्रति उसके प्रेम की शपथ’ है: योनातान ने दाऊद को उस प्रेम के आधार पर शपथबद्ध किया जो दाऊद का योनातान के प्रति था।'
- source_word: כִּי
  choice: क्योंकि
  rationale: כִּי यहाँ योनातान के कार्य का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में संबंध स्पष्ट करता है।
- source_word: אַהֲבַת נַפְשׁוֹ אֲהֵבוֹ
  choice: वह उससे अपने प्राण के समान प्रेम करता था
  rationale: यह अभिव्यक्ति गहरे निजी प्रेम को दर्शाती है। ‘प्राण के समान’ נפש के ‘जीवन/स्व’ संबंधी भाव को स्वाभाविक हिन्दी मुहावरे में बनाए रखता है।
theological_decisions:
- issue: योनातान के दाऊद के प्रति प्रेम का स्वरूप
  choice: ‘प्रेम’ की प्रबल भाषा और ‘अपने प्राण के समान’ की तीव्रता को बनाए रखा गया है।
  alternative: इसे केवल ‘मित्रता’ कहना या इसमें स्पष्ट रूप से रोमानी अथवा यौन आशय जोड़ना।
  rationale: इब्रानी पाठ गहरा निजी और वाचा-संबंधी समर्पण व्यक्त करता है, पर प्रेम के स्वरूप के बारे में इससे आगे कोई विशिष्ट दावा नहीं करता; इसलिए न तो इसकी तीव्रता घटाई गई है, न कोई अतिरिक्त आशय आरोपित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कथात्मक रूप। ‘शपथ खिलाई’ causative अर्थ को सहजता से व्यक्त करता है और ‘अपने प्राण के समान’ गहरे प्रेम का परिचित, स्वाभाविक मुहावरा है।
