  text: Jonathan said to him[a], “Tomorrow is the new moon, and you will be missed, because your seat will be empty.”
translation:
  language: hi
  text: योनातान ने उससे कहा, “कल नया चाँद होगा, और तुम्हारी अनुपस्थिति पर ध्यान जाएगा, क्योंकि तुम्हारा स्थान खाली होगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר לוֹ
  choice: तब ... ने उससे कहा
  rationale: कथात्मक wayyiqtol को स्वाभाविक हिन्दी कथा-प्रवाह में ‘तब ... ने उससे कहा’ से व्यक्त किया गया है।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: מָחָר חֹדֶשׁ
  choice: कल नया चाँद है
  rationale: संदर्भ में חֹדֶשׁ महीने की सामान्य संज्ञा नहीं, नए चाँद के अवसर और उससे जुड़े राजकीय भोज को सूचित करता है।
- source_word: וְנִפְקַדְתָּ
  choice: तुम्हारी कमी खलेगी
  rationale: निफ़अल रूप यहाँ दाऊद की अनुपस्थिति पर ध्यान जाने का भाव देता है। यह हिन्दी में स्वाभाविक है और अगले खंड में खाली आसन से उसका कारण स्पष्ट होता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: दाऊद की कमी खलने का कारण प्रस्तुत करता है।
- source_word: יִפָּקֵד מוֹשָׁבֶךָ
  choice: तुम्हारा आसन खाली होगा
  rationale: भोज के संदर्भ में מוֹשָׁבֶךָ दाऊद के निर्धारित बैठने के स्थान को दर्शाता है; हिन्दी में परिणाम को ‘आसन खाली होगा’ कहना स्पष्ट और स्वाभाविक है।
