  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘आसन’ राजकीय भोज में निर्धारित बैठने के स्थान के लिए चुना गया है; ‘तुम्हारी कमी खलेगी’ भावात्मक अर्थ दे सकता है, इसलिए अधिक तटस्थ अर्थ फुटनोट में सुरक्षित रखा गया है।
