base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/042.yaml
  text: Jonathan said to David, “Go in peace, because the two of us have sworn in the name of the LORD, saying, ‘May the LORD be between me and you, and between my offspring and your offspring forever.’”
translation:
  language: hi
  text: योनातान ने दाऊद से कहा, “शांति से जाओ, क्योंकि हम दोनों ने यहोवा के नाम से शपथ खाई है, यह कहते हुए, ‘यहोवा मेरे और तुम्हारे बीच, और मेरी संतान और तुम्हारी संतान के बीच सदा रहे।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֵךְ לְשָׁלוֹם
  choice: शान्ति से जाओ
  rationale: इब्रानी विदाई-वाक्य का स्वाभाविक और अर्थनिष्ठ हिन्दी रूप; इसमें कुशल-मंगल की कामना निहित है।
- source_word: בְּשֵׁם יְהוָה
  choice: यहोवा के नाम की
  rationale: व्यक्तिगत ईश्वरीय नाम को हिन्दी में प्रचलित बाइबलीय रूप ‘यहोवा’ से व्यक्त किया गया है; ‘के नाम की शपथ’ स्वाभाविक हिन्दी प्रयोग है।
- source_word: זַרְעִי / זַרְעֲךָ
  choice: मेरे वंश / तुम्हारे वंश
  rationale: यहाँ זֶרַע सामूहिक रूप से भावी संतति को दर्शाता है; ‘वंश’ प्रसंगानुकूल, संक्षिप्त और स्वाभाविक है।
- source_word: עַד עוֹלָם
  choice: सदा
  rationale: स्थायी और अनिश्चित भविष्यकालीन अवधि का सहज हिन्दी निरूपण।
theological_decisions:
- issue: यहोवा का दोनों व्यक्तियों और उनके वंशों के ‘बीच’ होना
  choice: ‘यहोवा मेरे और तुम्हारे बीच, और मेरे वंश और तुम्हारे वंश के बीच सदा रहे।’
  alternative: ‘यहोवा सदा मेरे और तुम्हारे तथा मेरे वंश और तुम्हारे वंश का साक्षी रहे।’
  rationale: मूल पाठ केवल ‘बीच रहे/होगा’ कहता है; ‘साक्षी’ अर्थ में निहित हो सकता है, पर उसे स्पष्ट जोड़ने से मूल की व्यापकता और तनाव अनावश्यक रूप से सीमित हो जाता।
- issue: אֲשֶׁר का संबंध
  choice: “क्योंकि हम दोनों ने…”
  alternative: “उस शपथ के कारण जो हम दोनों ने…”
  rationale: यह संबंध कारणसूचक रूप में स्वाभाविक है और विदाई की शान्ति को परस्पर शपथ से जोड़ता है; मूल की वाक्य-संरचना का आशय सुरक्षित रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज शैली। प्रत्यक्ष कथन के भीतर शपथ के शब्दों को अलग उद्धरण में रखा गया है। ‘शान्ति’ की पारंपरिक वर्तनी अपनाई गई है।
