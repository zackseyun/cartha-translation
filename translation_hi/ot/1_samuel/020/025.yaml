base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/025.yaml
  text: The king sat in his seat[a], as at other times, by the wall; and Jonathan rose, and Abner sat beside Saul, but David’s place was empty.
translation:
  language: hi
  text: राजा हमेशा की तरह दीवार के पास अपने आसन पर बैठा। योनातान उठा, और अब्नेर शाऊल के बगल में बैठा; पर दाऊद का स्थान[a] खाली था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाऊद का स्थान सूना था,” अर्थात् भोजन के समय उसके लिए निर्धारित स्थान पर कोई नहीं बैठा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संज्ञा निश्चित है और प्रसंग में शाऊल को सूचित करती है, फिर भी मूल पाठ यहाँ नाम के बजाय पदवी का प्रयोग करता है।
- source_word: מוֹשָׁבוֹ
  choice: अपने आसन पर
  rationale: भोज के प्रसंग में यह निवास नहीं, बैठने के निर्धारित आसन को दर्शाता है।
- source_word: כְּפַעַם בְּפַעַם
  choice: हमेशा की तरह
  rationale: यह मुहावरा पिछले अवसरों के समान नियमित व्यवहार का बोध कराता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: אֶל מוֹשַׁב הַקִּיר
  choice: दीवार के पास
  rationale: वाक्यांश राजा के आसन की स्थिति दीवार के निकट बताता है; हिन्दी में स्थान-संबंध को सहज रूप से व्यक्त किया गया है।
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום के सामान्य कथात्मक अर्थ को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: וַיֵּשֶׁב אַבְנֵר מִצַּד שָׁאוּל
  choice: अब्नेर शाऊल के पास बैठा
  rationale: מִצַּד का स्थानिक अर्थ ‘की बगल में/पास’ है; यह सरल और स्पष्ट हिन्दी है।
- source_word: וַיִּפָּקֵד מְקוֹם דָּוִד
  choice: दाऊद का स्थान खाली था
  rationale: यहाँ क्रिया अपेक्षित व्यक्ति की अनुपस्थिति के कारण उसके स्थान के रिक्त होने को व्यक्त करती है; ‘खाली था’ भोज के प्रसंग में स्वाभाविक है।
