base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/035.yaml
  text: In the morning[a], Jonathan went out to the field for the appointed meeting with David[b], and a young boy was with him.
translation:
  language: hi
  text: सुबह योनातान दाऊद से तय भेंट के लिए[a] मैदान में गया। उसके साथ एक छोटा लड़का[b] भी था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद के लिए ठहराए हुए समय पर।” इब्रानी शब्द מוֹעֵד का अर्थ ठहराया हुआ समय या तय भेंट, दोनों हो सकता है; प्रसंग में पहले से निश्चित मुलाकात की व्यवस्था ‘तय भेंट’ का समर्थन करती है।
    reason: lexical_alternative
  - marker: b
    text: या, “नन्हा लड़का” या “कम उम्र का सेवक।” इब्रानी נַעַר प्रसंग के अनुसार लड़के, युवक या सेवक के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בַבֹּקֶר
  choice: सुबह
  rationale: वाव-क्रमिक के साथ היה कथा में अगली घटना आरम्भ करता है; בַבֹּקֶר उसका समय बताता है। आधुनिक हिन्दी में केवल ‘सुबह’ स्वाभाविक और अर्थपूर्ण है।
- source_word: וַיֵּצֵא
  choice: गया
  rationale: יצא का मूल भाव ‘बाहर जाना’ है, पर ‘मैदान में गया’ हिन्दी में दिशा को स्वाभाविक रूप से व्यक्त करता है; ‘बाहर निकलकर गया’ अनावश्यक रूप से भारी होता।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: הַשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה खुले खेत या मैदान को दर्शाता है। प्रसंग में ‘मैदान’ उस निश्चित खुले स्थान के लिए स्वाभाविक है।
- source_word: לְמוֹעֵד דָּוִד
  choice: दाऊद से तय भेंट के लिए
  rationale: מוֹעֵד नियत समय अथवा तय भेंट दोनों बता सकता है। निकटवर्ती प्रसंग में पहले से तय संकेत और मिलने की व्यवस्था के कारण ‘तय भेंट’ उपयुक्त है, जबकि पादटिप्पणी समय-संबंधी सम्भावना बनाए रखती है।
- source_word: וְנַעַר קָטֹן
  choice: एक छोटा लड़का
  rationale: נַעַר का अर्थ लड़का, युवक अथवा सेवक हो सकता है और קָטֹן उसके छोटे या कम उम्र के होने पर बल देता है। ‘छोटा लड़का’ दोनों शब्दों का सीधा और सहज अनुवाद है।
- source_word: עִמּוֹ
  choice: उसके साथ ... भी था
  rationale: עִמּוֹ संगति दर्शाता है। पूर्ण और स्वाभाविक हिन्दी वाक्य के लिए ‘था’ जोड़ा गया है और ‘भी’ साथ आए पात्र को कथा में सहज रूप से प्रस्तुत करता है।
