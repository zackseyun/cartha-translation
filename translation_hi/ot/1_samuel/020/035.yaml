translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कथा के इब्रानी आरम्भ को हिन्दी में अनावश्यक ‘और ऐसा हुआ’ के बिना व्यक्त किया गया है। मוֹעֵד और נַעַר की वास्तविक अर्थ-सम्भावनाएँ पादटिप्पणियों में सुरक्षित हैं।
