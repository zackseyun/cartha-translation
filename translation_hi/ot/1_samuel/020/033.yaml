  choice: फेंका
  rationale: यह क्रिया किसी वस्तु को फेंकने या उछालने का अर्थ देती है; भाले और शत्रुतापूर्ण प्रसंग में ‘फेंका’ स्वाभाविक और स्पष्ट है।
- source_word: הַחֲנִית
