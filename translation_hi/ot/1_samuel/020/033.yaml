  text: Then Saul hurled the spear at him to strike him[a], and Jonathan knew that his father was determined to put David to death.
translation:
  language: hi
  text: तब शाऊल ने योनातान पर भाला फेंका, ताकि उसे चोट पहुँचाए। इससे योनातान जान गया कि उसके पिता ने दाऊद को मार डालने का पक्का निश्चय कर लिया था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पिता की ओर से यह बात तय हो चुकी थी कि दाऊद को मार डाला जाए।” इब्रानी मुहावरा शाऊल के दृढ़ और अंतिम निर्णय को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
