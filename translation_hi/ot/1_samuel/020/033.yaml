- source_word: עָלָיו
  choice: योनातान पर
  rationale: पूर्वसर्ग लक्ष्य की ओर शत्रुतापूर्ण प्रहार दर्शाता है। अस्पष्ट सर्वनाम के स्थान पर नाम रखने से हिन्दी में संदर्भ साफ रहता है।
- source_word: לְהַכֹּתוֹ
  choice: कि उसे मार डाले
  rationale: उद्देश्यसूचक रूप प्राणघातक प्रहार की मंशा बताता है; संदर्भ में ‘मार डाले’ केवल चोट पहुँचाने से अधिक उपयुक्त है।
- source_word: וַיֵּדַע
  choice: जान गया
  rationale: मूल क्रिया ‘जानना’ है; यहाँ घटना के फलस्वरूप योनातान को निश्चित ज्ञान होने का भाव है।
- source_word: כָלָה הִיא מֵעִם אָבִיו
  choice: उसके पिता ने ... पक्का निश्चय कर लिया है
  rationale: यह इब्रानी मुहावरा पिता की ओर से बात के तय और पूर्ण हो जाने, अर्थात दृढ़ निर्णय, को व्यक्त करता है।
- source_word: לְהָמִית אֶת דָּוִד
  choice: दाऊद को मार डालने
  rationale: यह दाऊद की मृत्यु कराने या उसे प्राण से मारने की स्पष्ट मंशा व्यक्त करता है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: हिन्दी बाइबलीय परंपरा और इब्रानी उच्चारण के निकट प्रचलित नाम-रूप।
- source_word: יְהוֹנָתָן
  choice: योनातान
  rationale: इब्रानी नाम का हिन्दी में प्रचलित और स्रोत-संगत रूप।
- source_word: דָּוִד
  choice: दाऊद
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
