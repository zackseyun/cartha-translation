base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/038.yaml
  text: And Jonathan called after the boy[b][a], “Hurry! Be quick! Do not stop!” So Jonathan’s boy gathered up the arrows and came to his master.
translation:
  language: hi
  text: तब योनातान ने लड़के के पीछे पुकारा, “जल्दी कर! और तेज़ चल! रुक मत!” तब योनातान के लड़के ने तीरों[a] को बटोर लिया और अपने स्वामी के पास लौट आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में इस शब्द का लिखित रूप एकवचन-जैसा दिखाई देता है, पर प्रसंग में योनातान के चलाए हुए तीर अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקְרָא ... אַחֲרֵי הַנַּעַר
  choice: लड़के के पीछे पुकारकर कहा
  rationale: קרא אחרי का अर्थ किसी जाते हुए व्यक्ति के पीछे से पुकारना है। ‘लड़का’ נַעַר की आयु और अधीनस्थ भूमिका दोनों को सहज रूप से बनाए रखता है।
- source_word: מְהֵרָה חוּשָׁה
  choice: जल्दी कर! फुर्ती कर!
  rationale: दो अलग तात्कालिक अभिव्यक्तियों को अलग रखकर इब्रानी की दोहरी तीव्रता सुरक्षित की गई है।
- source_word: אַל תַּעֲמֹד
  choice: रुक मत!
  rationale: शाब्दिक अर्थ ‘खड़ा मत रह’ है, पर प्रसंग में चलते रहने और न रुकने की आज्ञा है; ‘रुक मत’ स्वाभाविक हिन्दी है।
- source_word: וַיְלַקֵּט
  choice: बटोर लिया
  rationale: לקט जमीन पर पड़े तीरों को इकट्ठा करने की क्रिया बताता है; ‘बटोर लिया’ दृश्य और पूर्ण क्रिया दोनों को स्पष्ट करता है।
- source_word: החצי
  choice: तीरों
  rationale: लिखित रूप एकवचन-जैसा दिखाई देता है, किंतु प्रसंग योनातान द्वारा चलाए गए अनेक तीरों की ओर संकेत करता है।
- source_word: אֶל אֲדֹנָיו
  choice: अपने स्वामी के पास
  rationale: यहाँ אָדוֹן लड़के के मानवीय अधिकारी योनातान के लिए है; ‘स्वामी’ अधीनस्थ-संबंध को गरिमापूर्ण और स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיָּבֹא
  choice: लौट आया
  rationale: मूल क्रिया का सामान्य अर्थ ‘आया’ है; प्रसंग में लड़का तीर बटोरकर योनातान के पास वापस आता है, इसलिए ‘लौट आया’ स्वाभाविक हिन्दी में निहित दिशा स्पष्ट करता है।
