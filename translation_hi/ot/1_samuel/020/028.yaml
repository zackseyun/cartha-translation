base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/028.yaml
  text: Jonathan answered Saul[a], “David earnestly asked leave of me to go to Bethlehem.”
translation:
  language: hi
  text: योनातान ने शाऊल को उत्तर दिया, “दाऊद ने मुझसे बहुत आग्रह करके बेतलेहेम जाने की अनुमति माँगी थी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: संवाद में ענה के सामान्य कथात्मक प्रयोग का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: אֶת שָׁאוּל
  choice: शाऊल को
  rationale: प्रत्यक्ष कर्म-चिह्न के साथ नाम उस व्यक्ति को बताता है जिसे योनातान ने उत्तर दिया।
- source_word: נִשְׁאֹל נִשְׁאַל
  choice: बहुत आग्रह करके ... अनुमति माँगी थी
  rationale: धातु שאל के infinitive absolute और finite verb का संयोजन अनुरोध पर बल देता है। प्रसंग में दाऊद जाने की अनुमति माँग रहा है; यह रूप अनुरोध और उसकी प्रबलता दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מֵעִמָּדִי
  choice: मुझसे
  rationale: यह पूर्वसर्गीय रूप योनातान की उपस्थिति अथवा अधिकार से अनुमति माँगने का भाव देता है; हिन्दी में 'मुझसे ... अनुमति माँगी' स्वाभाविक है।
- source_word: עַד בֵּית לָחֶם
  choice: बेतलेहेम जाने की
  rationale: शाब्दिक रूप में 'बेतलेहेम तक' है, पर שאל और गंतव्य के इस संदर्भ में जाने की अनुमति का भाव निहित है; उसे स्पष्ट करना स्वाभाविक हिन्दी देता है।
- source_word: בֵּית לָחֶם
  choice: बेतलेहेम
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
theological_decisions: []
