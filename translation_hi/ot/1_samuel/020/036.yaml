base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/036.yaml
  text: He said to his young man[a], “Run, please, find the arrows that I am shooting.” The young man ran, and he shot the arrow beyond him.
translation:
  language: hi
  text: उसने अपने युवा सहायक से कहा, “दौड़ो, ज़रा उन तीरों को ढूँढ़ो जिन्हें मैं चला रहा हूँ।” वह युवा सहायक दौड़ा, और योनातान ने तीर उसके आगे चला दिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पार।” अर्थात् तीर युवा सहायक से आगे गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְנַעֲרוֹ / הַנַּעַר
  choice: अपने सेवक लड़के / वह लड़का
  rationale: נַעַר युवक, लड़के या परिचारक को सूचित कर सकता है। प्रसंग में वह योनातान का सहायक है; ‘सेवक लड़का’ उसकी भूमिका और आयु/स्थिति दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: רוּץ
  choice: दौड़कर जा
  rationale: आज्ञार्थक रूप ठोस रूप से दौड़ने की क्रिया बताता है; हिन्दी में अगले आदेश के साथ ‘दौड़कर जा’ स्वाभाविक है।
- source_word: מְצָא נָא
  choice: ढूँढ़ ला
  rationale: מצא का मूल भाव पाना/ढूँढ़ना है। נא अनुरोध को नरम करता है; हिन्दी आदेश की समग्र सहजता में यह भाव निहित है, जबकि ‘ला’ तीर बटोरकर वापस लाने के प्रसंग को स्पष्ट करता है।
- source_word: הַחִצִּים
  choice: उन तीरों को
  rationale: हिब्रू बहुवचन को बनाए रखा गया है और सम्बन्धवाचक उपवाक्य के कारण ‘उन’ स्वाभाविक हिन्दी है।
- source_word: אֲשֶׁר אָנֹכִי מוֹרֶה
  choice: जिन्हें मैं चला रहा हूँ
  rationale: ירה का कृदन्त वर्तमान/चल रही क्रिया व्यक्त करता है; तीर के लिए ‘चलाना’ आधुनिक हिन्दी का स्वाभाविक प्रयोग है।
- source_word: וְהוּא יָרָה הַחֵצִי
  choice: और योनातान ने तीर ... चलाया
  rationale: हिब्रू सर्वनाम का संदर्भ योनातान है; हिन्दी में लड़के को निकटतम कर्ता समझने की अस्पष्टता से बचने के लिए नाम दोहराया गया है। एकवचन ‘तीर’ हिब्रू रूप को सुरक्षित रखता है।
- source_word: לְהַעֲבִירוֹ
  choice: इस तरह ... कि वह उसके पार निकल गया
  rationale: עבר के हिफ़ील रूप में किसी वस्तु को आगे/पार पहुँचा देने का भाव है। यह रचना तीर के लड़के से आगे निकलने की दिशा को स्पष्ट और सहज हिन्दी में रखती है।
