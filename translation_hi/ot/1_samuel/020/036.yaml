  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी में रखी गई है। ‘सेवक लड़का’ केवल ‘लड़का’ और अधिक औपचारिक ‘परिचारक’ के बीच संतुलन रखता है। कर्ता की हिन्दीगत अस्पष्टता दूर करने के लिए ‘योनातान’ स्पष्ट किया गया है।
