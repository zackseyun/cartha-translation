base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/010.yaml
  text: Then David said to Jonathan[a], “Who will tell me? Or what if your father answers you harshly?”
translation:
  language: hi
  text: तब दाऊद ने योनातान से कहा, “मुझे कौन बताएगा? या यदि तुम्हारा पिता तुम्हें कठोर उत्तर दे, तो क्या होगा?”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में शाब्दिक रूप से: “मुझे कौन बताएगा? या तुम्हारा पिता तुम्हें क्या उत्तर देगा—कठोर?” मूल वाक्य बहुत संक्षिप्त है; अनुवाद में उसका आशय स्पष्ट किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דָּוִד אֶל־יְהוֹנָתָן
  choice: दाऊद ने योनातान से
  rationale: व्यक्तिनामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं, और אֶל को कथन के साथ स्वाभाविक हिन्दी ‘से’ से व्यक्त किया गया है।
- source_word: מִי יַגִּיד לִי
  choice: मुझे कौन बताएगा?
  rationale: נגד के हिफ़ील रूप का अर्थ यहाँ बताना या सूचना देना है; स्वतंत्र प्रश्न के रूप में मूल की संक्षिप्त संरचना सुरक्षित रहती है।
- source_word: אוֹ
  choice: या यदि
  rationale: אוֹ का मूल विकल्पसूचक बल ‘या’ से रखा गया है, जबकि संकुचित अगले खंड का आशय स्पष्ट करने के लिए ‘यदि’ जोड़ा गया है।
- source_word: מַה יַּעַנְךָ אָבִיךָ קָשָׁה
  choice: यदि तुम्हारा पिता तुम्हें कठोर उत्तर दे, तो क्या होगा?
  rationale: मूल इब्रानी अत्यंत संकुचित है। ‘क्या होगा’ מַה को व्यक्त करता है और ‘कठोर उत्तर दे’ में קָשָׁה को क्रिया के ढंग के रूप में स्वाभाविक हिन्दी मिलती है।
