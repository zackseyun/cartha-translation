base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/009.yaml
  text: Jonathan said[a], “Far be it from you! If I knew for certain that evil had been determined by my father to come upon you, would I not tell you?”
translation:
  language: hi
  text: योनातान ने कहा, “तुम्हारे साथ ऐसा कदापि न हो! यदि मुझे निश्चय से मालूम होता कि मेरे पिता की ओर से तुम पर विपत्ति लाने का इरादा पक्का हो चुका है,[a] तो क्या मैं तुम्हें न बताता?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बुराई पूरी हो चुकी है” अथवा “हानि निश्चित हो चुकी है।” इब्रानी अभिव्यक्ति का अर्थ यह हो सकता है कि शाऊल की हानि पहुँचाने की मंशा पक्की या पूरी तरह बन चुकी थी।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לָּךְ
  choice: तुम्हारे लिए ऐसा सोचना भी दूर रहे!
  rationale: यह प्रबल निषेध का मुहावरा है। ‘तुम्हारे लिए’ दूसरे पुरुष के दत्तिव לָּךְ को बनाए रखता है; ‘ऐसा सोचना’ प्रसंग में दाऊद की आशंका की ओर स्वाभाविक संकेत करता है।
- source_word: כִּי אִם
  choice: यदि
  rationale: यहाँ यह पदबंध शर्तसूचक उपवाक्य आरंभ करता है।
- source_word: יָדֹעַ אֵדַע
  choice: मुझे निश्चय से पता होता
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute ज्ञान की निश्चितता पर बल देता है।
- source_word: כָלְתָה הָרָעָה
  choice: विपत्ति लाने का इरादा पक्का हो चुका है
  rationale: संदर्भ में अभिव्यक्ति हानिकारक मंशा के पूरी तरह बन या ठहर जाने को दर्शाती है, जबकि पादटिप्पणी ‘बुराई पूरी हो चुकी’ जैसे अधिक शाब्दिक अर्थ की अस्पष्टता सुरक्षित रखती है।
- source_word: מֵעִם אָבִי
  choice: मेरे पिता की ओर से
  rationale: מֵעִם स्रोत या उद्गम को सूचित करता है; यह रूप इब्रानी के संबंध को बिना अनावश्यक रूप से सक्रिय कर्ता में बदलने के बनाए रखता है।
- source_word: לָבוֹא עָלֶיךָ
  choice: तुम पर विपत्ति लाने
  rationale: ‘तुम पर’ दिशात्मक बल को रखता है और संदर्भानुसार धमकी या हानि का भाव देता है।
- source_word: וְלֹא אֹתָהּ אַגִּיד לָךְ
  choice: तो क्या मैं तुम्हें न बताता?
  rationale: यह सकारात्मक उत्तर की अपेक्षा रखने वाला आलंकारिक प्रश्न है; हिंदी में यह रूप स्वाभाविक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी का स्वाभाविक और गरिमापूर्ण संवादात्मक रूप अपनाया गया है। हिब्रू की प्रबल नकारात्मक उक्ति, निश्चित ज्ञान पर बल और हानिकारक मंशा के ‘पक्का/पूरा’ हो जाने की अर्थगत अस्पष्टता सुरक्षित रखी गई है।
