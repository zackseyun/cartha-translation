source:
  edition: WLC
  text: כִּ֣י כָל הַ/יָּמִ֗ים אֲשֶׁ֤ר בֶּן יִשַׁי֙ חַ֣י עַל הָ/אֲדָמָ֔ה לֹ֥א תִכּ֖וֹן אַתָּ֣ה וּ/מַלְכוּתֶ֑/ךָ וְ/עַתָּ֗ה שְׁלַ֨ח וְ/קַ֤ח אֹת/וֹ֙ אֵלַ֔/י כִּ֥י בֶן מָ֖וֶת הֽוּא־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/020/031.yaml
  text: For as long as the son of Jesse lives on the earth[a], neither you nor your kingdom will be established. So now, send and bring him to me, for he is a son of death.
translation:
  language: hi
  text: क्योंकि जब तक यिशै का बेटा धरती पर जीवित है, तब तक न तुम स्थिर होगे, न तुम्हारा राज्य स्थिर होगा। इसलिए अब भेजो और उसे मेरे पास ले आओ, क्योंकि वह मृत्यु का पुत्र है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरा “मृत्यु का पुत्र” ऐसे व्यक्ति को दर्शाता है जो मृत्यु का अधिकारी है या जिसकी मृत्यु निश्चित मानी गई है।
    reason: मुहावरे के अर्थ और उसकी संभावित अर्थ-सीमा को स्पष्ट करना।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शाऊल के कथन का कारण प्रस्तुत करता है और प्रसंग में कारणवाचक अर्थ सबसे स्वाभाविक है।
- source_word: כָל הַיָּמִים אֲשֶׁר
  choice: जब तक
  rationale: यह इब्रानी कालवाचक मुहावरे की अवधि को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בֶּן יִשַׁי
  choice: यिशै का बेटा
  rationale: दाऊद का नाम जोड़ने के बजाय मूल का पितृनाम बनाए रखा गया है, जिससे शाऊल की दूरी और तिरस्कारपूर्ण लहजा सुरक्षित रहता है।
- source_word: חַי עַל הָאֲדָמָה
  choice: धरती पर जीवित है
  rationale: यह पदबंध के सीधे अर्थ को रखता है और אֲדָמָה को अनावश्यक रूप से किसी खास देश तक सीमित नहीं करता।
- source_word: לֹא תִכּוֹן
  choice: स्थिर होगे / स्थिर होगा
  rationale: כון के निफ़अल रूप का स्थापित या दृढ़ होने का भाव रखा गया है; हिन्दी में दोनों समन्वित कर्ताओं के साथ वचनानुसार क्रिया दोहराई गई है।
- source_word: אַתָּה וּמַלְכוּתֶךָ
  choice: न तुम ... न तुम्हारा राज्य
  rationale: नकारात्मक समन्वय को स्वाभाविक हिन्दी में व्यक्त करते हुए व्यक्ति और उसके राजवंशीय-राजनीतिक राज्य, दोनों को अलग रखा गया है।
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पिछले कथन से निकलने वाले तात्कालिक निष्कर्ष और आदेश को स्पष्ट करता है।
- source_word: שְׁלַח וְקַח אֹתוֹ אֵלַי
  choice: लोगों को भेजकर उसे मेरे पास ले आओ
  rationale: दोनों आदेशों—भेजने और दाऊद को शाऊल के पास लाने—का आशय स्वाभाविक हिन्दी में सुरक्षित है।
- source_word: בֶּן מָוֶת הוּא
  choice: वह मृत्यु का पुत्र है
  rationale: मूल इब्रानी मुहावरे को मुख्य पाठ में पारदर्शी रूप से रखा गया है; उसका संभावित आशय पादटिप्पणी में दिया गया है ताकि 'मृत्युदंड का अधिकारी' और 'मरने को ठहराया गया' के बीच की सूक्ष्म अस्पष्टता बनी रहे।
theological_decisions:
- issue: בֶּן מָוֶת मुहावरे की व्याख्या
  choice: मुख्य पाठ में शाब्दिक मुहावरा “मृत्यु का पुत्र” रखा गया
  alternative: “वह मरने योग्य है” या “उसकी मृत्यु निश्चित है”
  rationale: मुहावरा दंडनीयता अथवा निश्चित मृत्यु, दोनों की छाया रख सकता है; किसी एक व्याख्या को मुख्य पाठ में निर्णायक बनाने से बचा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। “यिशै का बेटा” मूल की तिरस्कारपूर्ण दूरी बनाए रखता है। संवाद में “तुम” का प्रयोग आधुनिक हिन्दी में स्वाभाविक है और इब्रानी द्वितीय पुरुष एकवचन को बिना अनावश्यक सामाजिक स्तर जोड़े व्यक्त करता है।
