base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/011.yaml
  text: And it happened that all who had known him formerly saw[a], and behold, he was prophesying with the prophets. So the people said, each man to his neighbor[b], “What has happened to the son of Kish? Is Saul also among the prophets?”
translation:
  language: hi
  text: और ऐसा हुआ कि जितने लोग उसे पहले से जानते थे[a], उन्होंने देखा—और देखो, वह भविष्यद्वक्ताओं के साथ भविष्यवाणी कर रहा था। तब लोगों ने एक-दूसरे से कहा, “कीश के बेटे को यह क्या हो गया? क्या शाऊल भी[b] भविष्यद्वक्ताओं में है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे कल और परसों से जानते थे”; यह पहले से जानने के अर्थ में प्रयुक्त हिब्रू मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्या यहाँ तक कि शाऊल भी भविष्यद्वक्ताओं में है?”
    reason: lexical_alternative
lexical_decisions:
- source_word: יֹדְעוֹ מֵאִתְּמוֹל שִׁלְשׁוֹם
  choice: उसे पहले से जानते थे
  rationale: शाब्दिक अभिव्यक्ति ‘कल और परसों से’ पूर्व समय का हिब्रू मुहावरा है। ‘पहले से जानते थे’ आधुनिक हिन्दी में उसके स्वाभाविक अर्थ और शाऊल के बदले हुए व्यवहार के साथ विरोध को स्पष्ट रखता है।
- source_word: וַיְהִי
  choice: और ऐसा हुआ
  rationale: यह हिब्रू कथा को आगे बढ़ाने वाला सामान्य सूत्र है। यह चयन उसके कथात्मक कार्य को बिना पुरातन या कृत्रिम भाषा के बनाए रखता है।
- source_word: וַיִּרְאוּ וְהִנֵּה
  choice: उन्होंने देखा—और देखो
  rationale: וְהִנֵּה दृश्य की आकस्मिकता और देखने वालों के आश्चर्य को उभारता है; ‘और देखो’ उस प्रभाव को बनाए रखता है।
- source_word: עִם נְבִאִים
  choice: भविष्यद्वक्ताओं के साथ
  rationale: עִם का सीधा अर्थ ‘के साथ’ है। अंतिम प्रश्न के בַּנְּבִיאִים (‘भविष्यद्वक्ताओं में’) से इसका भेद भी इस प्रकार सुरक्षित रहता है।
- source_word: נִבָּא
  choice: भविष्यवाणी कर रहा था
  rationale: यहाँ क्रिया चल रही भविष्यसूचक गतिविधि बताती है। अपूर्ण भूतकाल दृश्य में देखी जा रही निरंतर क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אִישׁ אֶל רֵעֵהוּ
  choice: एक-दूसरे से
  rationale: हिब्रू का शाब्दिक रूप ‘एक पुरुष अपने साथी से’ है, पर इस प्रसंग में यह पारस्परिक बातचीत का मुहावरा है; ‘एक-दूसरे से’ अर्थ को सहज और ठीक रूप से व्यक्त करता है।
- source_word: מַה זֶּה הָיָה לְבֶן קִישׁ
  choice: कीश के बेटे को यह क्या हो गया?
  rationale: यह शाऊल की बदली हुई दशा पर आश्चर्य व्यक्त करता है और हिन्दी में मूल प्रश्न की तीव्रता को स्वाभाविक रूप से बनाए रखता है।
- source_word: הֲגַם שָׁאוּל בַּנְּבִיאִים
  choice: क्या शाऊल भी भविष्यद्वक्ताओं में है?
  rationale: הֲגַם आश्चर्ययुक्त प्रश्न में ‘भी’ अथवा ‘यहाँ तक कि’ का भाव दे सकता है। मुख्य पाठ में ‘भी’ सहज है, जबकि अधिक बलयुक्त विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: शाऊल की भविष्यसूचक गतिविधि को स्थायी भविष्यद्वक्ता-पद न मान लेना
  choice: वह भविष्यद्वक्ताओं के साथ भविष्यवाणी कर रहा था
  alternative: वह भविष्यद्वक्ताओं के साथ भविष्यसूचक उन्माद में था; वह भविष्यद्वक्ता के समान व्यवहार कर रहा था
  rationale: मूल पाठ शाऊल की उस समय की भविष्यसूचक गतिविधि बताता है, पर उसे अनिवार्य रूप से स्थायी भविष्यद्वक्ता-पद प्रदान नहीं करता। चुना हुआ रूप गतिविधि को सीधे व्यक्त करते हुए इस धार्मिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘भविष्यद्वक्ता’ और ‘भविष्यवाणी’ सामान्य बाइबलीय शब्दावली हैं। विस्मय और दृश्यात्मकता के लिए ‘और देखो’ बनाए रखा गया है; भाषा में किसी स्थायी भविष्यद्वक्ता-पद या केवल उन्मादी व्यवहार का अतिरिक्त निष्कर्ष नहीं जोड़ा गया।
