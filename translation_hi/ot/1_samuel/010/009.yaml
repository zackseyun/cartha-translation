base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/009.yaml
  text: And it happened[a], when he turned his back to go from Samuel, that God gave him another heart[b], and all these signs came to pass on that day.
translation:
  language: hi
  text: जब वह शमूएल के पास से जाने को मुड़ा[a], तब परमेश्वर ने उसका हृदय बदल दिया; उसके लिए दूसरा हृदय कर दिया[b], और उसी दिन ये सभी चिन्ह घटित हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने अपना कंधा फेरा”; यह वहाँ से चल देने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “परमेश्वर ने उसके लिए एक दूसरा हृदय कर दिया” या “बदल दिया।” पद परमेश्वर द्वारा किए गए आंतरिक परिवर्तन को बताता है, पर उसके स्वरूप को और स्पष्ट नहीं करता।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהָיָה
  choice: तब
  rationale: हिब्रू कथात्मक सूत्र को हिंदी में अलग से ‘और ऐसा हुआ’ कहने के बजाय कालवाचक उपवाक्य के साथ स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּהַפְנֹתוֹ שִׁכְמוֹ
  choice: जब वह ... मुड़ा
  rationale: शाब्दिक अर्थ ‘जब उसने अपना कंधा फेरा’ है, जो प्रस्थान का मुहावरा है। हिंदी में ‘मुड़ा’ अर्थ को स्वाभाविक रूप से व्यक्त करता है; शाब्दिक चित्र पादटिप्पणी में रखा गया है।
- source_word: לָלֶכֶת מֵעִם שְׁמוּאֵל
  choice: शमूएल के पास से जाने के लिए
  rationale: לָלֶכֶת के उद्देश्य और מֵעִם के ‘के पास से’ संबंध को स्पष्ट तथा सहज हिंदी में बनाए रखता है।
- source_word: וַיַּהֲפָךְ
  choice: बदलकर ... कर दिया
  rationale: हिफ़ील क्रिया के ‘बदल देना/फेर देना’ अर्थ को बनाए रखता है और केवल ‘दे दिया’ कहने से होने वाली अर्थ-हानि से बचता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: एकवचन क्रिया के साथ इस्राएल के परमेश्वर का उल्लेख है; हिंदी बाइबलीय प्रयोग में ‘परमेश्वर’ स्वाभाविक है।
- source_word: לֵב אַחֵר
  choice: हृदय ... दूसरा
  rationale: मूल के ‘दूसरा हृदय’ को सुरक्षित रखता है, पर हिंदी वाक्य-विन्यास में ‘हृदय बदलकर दूसरा कर दिया’ अधिक स्वाभाविक है।
- source_word: וַיָּבֹאוּ
  choice: घटित हुए
  rationale: चिन्हों के घटने/सामने आने का अर्थ देता है और ‘पूरे हुए’ जैसी अतिरिक्त व्याख्या नहीं जोड़ता।
- source_word: כָּל הָאֹתוֹת הָאֵלֶּה
  choice: वे सभी चिन्ह
  rationale: पूर्ववर्ती कथन में बताए गए चिन्हों की ओर संकेत करता है; हिंदी में यहाँ ‘वे’ स्वाभाविक संदर्भसूचक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: ‘उस दिन’ के साथ बलसूचक निश्चितता को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: शाऊल के भीतरी परिवर्तन का स्वरूप
  choice: ‘परमेश्वर ने उसका हृदय बदलकर दूसरा कर दिया’—वास्तविक, परमेश्वर-प्रेरित आंतरिक परिवर्तन को कहना, पर उसका सिद्धान्तगत स्वरूप निश्चित न करना।
  alternative: ‘परमेश्वर ने उसे नया हृदय दिया’ या ‘परमेश्वर ने उसे राजत्व के लिए साहसी बनाया।’
  rationale: मूल पाठ ‘दूसरा हृदय’ और ‘बदलने’ की भाषा प्रयोग करता है। ‘नया हृदय’ बाद की वाचा अथवा पुनर्जन्म संबंधी धारणाएँ जगा सकता है, जबकि इसे केवल साहस तक सीमित करना मूल की व्यापकता को घटाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। ‘हृदय’ मूल की मानवीय अंतःस्थिति संबंधी व्यापकता बनाए रखता है; भाषा पुनर्जन्म, परिवर्तन या केवल साहस जैसी किसी विशिष्ट धर्मवैज्ञानिक व्याख्या को आरोपित नहीं करती।
