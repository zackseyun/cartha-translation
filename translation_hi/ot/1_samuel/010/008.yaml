base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/008.yaml
  text: And you shall go down before me to Gilgal. And behold[a], I am coming down to you to offer burnt offerings and to sacrifice peace offerings. You shall wait seven days, until I come to you and make known to you what you shall do.
translation:
  language: hi
  text: तुम मुझसे पहले गिलगाल उतर जाना। देखो, मैं तुम्हारे पास होमबलियाँ और मेल-बलियाँ[a] चढ़ाने के लिए नीचे आऊँगा। तुम सात दिन तक प्रतीक्षा करना, जब तक मैं तुम्हारे पास आकर तुम्हें न बता दूँ कि तुम्हें क्या करना है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शांति-बलियाँ” अथवा “कुशल-मंगल की बलियाँ।” हिब्रू शब्द उन बलिदानों को दर्शाता है जो शांति, समग्र कुशलता और साझा सहभागिता से जुड़े थे।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָרַדְתָּ לְפָנַי
  choice: तुम मुझसे पहले ... उतर जाना
  rationale: निर्देशात्मक क्रम और स्थानगत अर्थ दोनों को स्वाभाविक हिन्दी में रखता है; לְפָנַי यहाँ शाऊल के शमूएल से आगे जाने का संकेत देता है।
- source_word: הַגִּלְגָּל
  choice: गिलगाल
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: וְהִנֵּה
  choice: देखो
  rationale: ध्यान आकर्षित करने और कथन को सजीव बनाने वाले हिब्रू अव्यय का सहज आधुनिक हिन्दी रूप।
- source_word: אָנֹכִי יֹרֵד אֵלֶיךָ
  choice: मैं तुम्हारे पास नीचे आऊँगा
  rationale: יֹרֵד के उतरने के स्थानगत भाव और निकट भविष्य के आशय को सुरक्षित रखता है।
- source_word: לְהַעֲלוֹת עֹלוֹת
  choice: होमबलियाँ चढ़ाऊँ
  rationale: हिब्रू बलिदानी पदबंध का मान्य और संक्षिप्त हिन्दी रूप; עֹלָה पूरी तरह जलाए जाने वाले चढ़ावे को सूचित करता है।
- source_word: לִזְבֹּחַ זִבְחֵי שְׁלָמִים
  choice: मेलबलियाँ बलि करूँ
  rationale: सजातीय क्रिया-संज्ञा की बलिदानी स्पष्टता बनाए रखता है; שְׁלָמִים के मेल, कुशलता और सहभागिता के अर्थक्षेत्र को फुटनोट में दर्शाया गया है।
- source_word: שִׁבְעַת יָמִים תּוֹחֵל
  choice: तुम सात दिन तक प्रतीक्षा करना
  rationale: इस प्रक्रियात्मक संदर्भ में יחל का अर्थ ‘आशा रखना’ नहीं, बल्कि ‘प्रतीक्षा करना’ है।
- source_word: וְהוֹדַעְתִּי לְךָ אֵת אֲשֶׁר תַּעֲשֶׂה
  choice: तुम्हें ... बता दूँ कि तुम्हें क्या करना है
  rationale: हिफ़ील के ‘जान करा देना’ भाव को स्वाभाविक हिन्दी में व्यक्त करता है और आगे मिलने वाले निर्देश को स्पष्ट रखता है।
theological_decisions:
- issue: שְׁלָמִים बलिदान का अनुवाद
  choice: मेलबलियाँ
  alternative: शांति-बलियाँ; कुशल-मंगल की बलियाँ
  rationale: ‘मेलबलि’ हिन्दी पाठक के लिए बलिदान से जुड़े मेल और सहभागिता को सहज रूप से व्यक्त करती है, जबकि मूल शब्द का व्यापक शांति, पूर्णता और कुशलता-संबंधी अर्थ फुटनोट में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष निर्देशात्मक शैली रखी गई है। ‘उतर जाना’, ‘प्रतीक्षा करना’ और ‘क्या करना है’ सामान्य पाठकों के लिए सहज हैं; बलिदानी पारिभाषिकता के लिए ‘होमबलि’ और ‘मेलबलि’ प्रयुक्त हुए हैं।
