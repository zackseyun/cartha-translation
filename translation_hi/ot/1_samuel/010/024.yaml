base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/024.yaml
  text: Then Samuel said to all the people[a], “Do you see the one whom Yahweh has chosen? There is no one like him among all the people.” And all the people shouted and said[b], “Long live the king!”
translation:
  language: hi
  text: तब शमूएल ने सारे लोगों से कहा, “क्या तुम उसे देखते हो[a], जिसे याहवे ने चुना है? सारे लोगों में उसके समान कोई नहीं है।” तब सारे लोगों ने ऊँची आवाज़ में पुकारा और कहा, “राजा चिरायु हो!”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्या तुमने उसे देखा है जिसे याहवे ने चुना?”
    reason: इब्रानी क्रिया रूप की पूर्णकालीन सम्भावना को सुरक्षित रखना।
  - marker: b
    text: शाब्दिक रूप से, “राजा जीवित रहे!”
    reason: इब्रानी इच्छासूचक जयध्वनि का अधिक शाब्दिक रूप देना।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַרְּאִיתֶם
  choice: क्या तुम ... देखते हो
  rationale: रूप की दृष्टि से यह पूर्णकाल, द्वितीय पुरुष बहुवचन है, पर इस प्रत्यक्ष कथन में शाऊल की ओर उपस्थित लोगों का ध्यान खींचता है। वर्तमानकालीन प्रश्न हिन्दी में इस कार्य को स्वाभाविक रूप से व्यक्त करता है; पूर्णकाल की सम्भावना पादटिप्पणी में रखी गई है।
- source_word: אֲשֶׁר בָּחַר בּוֹ יְהוָה
  choice: उसे ... जिसे याहवे ने चुना है
  rationale: सम्बन्धवाचक उपवाक्य शाऊल की पहचान कराता है। ‘चुना है’ पूरी हुई क्रिया की वर्तमान प्रासंगिकता बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय निजी नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यन्तरित किया गया है।
- source_word: כִּי אֵין כָּמֹהוּ
  choice: उसके समान कोई नहीं है
  rationale: यह शाऊल की लोगों के बीच अनुपम स्थिति बताता है। हिन्दी में अलग व्याख्यात्मक वाक्य कारण-सूचक सम्बन्ध को स्वाभाविक रूप से प्रकट करता है; כִּי के लिए कृत्रिम ‘क्योंकि’ आवश्यक नहीं है।
- source_word: בְּכָל הָעָם
  choice: सारे लोगों में
  rationale: यह एकत्रित जनसमुदाय के भीतर तुलना व्यक्त करता है।
- source_word: וַיָּרִעוּ ... וַיֹּאמְרוּ
  choice: ऊँची आवाज़ में पुकारकर कहा
  rationale: यह अभिव्यक्ति लोगों के सामूहिक ऊँचे स्वर और उसके बाद कही गई राजकीय जयध्वनि—दोनों को हिन्दी में सहज रूप से समेटती है।
- source_word: יְחִי הַמֶּלֶךְ
  choice: राजा चिरायु हो!
  rationale: इब्रानी इच्छासूचक रूप राजा के जीवन के लिए सार्वजनिक जयध्वनि है; ‘चिरायु हो’ उसका प्रचलित, गरिमापूर्ण हिन्दी समतुल्य है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ निजी वाचा-नाम का स्पष्ट प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना और किसी विशिष्ट साम्प्रदायिक व्याख्या को जोड़े बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, सहज और गरिमापूर्ण है। ‘सारे लोगों’, ‘ऊँची आवाज़ में पुकारकर कहा’ और ‘चिरायु हो’ सामान्य पाठकों के लिए स्पष्ट हैं; मूल की कालगत सम्भावना और जयध्वनि का शाब्दिक रूप पादटिप्पणियों में सुरक्षित रखा गया है।
