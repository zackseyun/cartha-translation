  yaml_path: translation/ot/1_samuel/010/007.yaml
  text: And when these signs come to you[a], do whatever your hand finds to do, for God is with you.
translation:
  language: hi
  text: जब ये चिन्ह तुम्हारे सामने आएँ, तब जो काम तुम्हारे हाथ में आए, वह करो[a], क्योंकि परमेश्वर तुम्हारे साथ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात, जो काम करने का अवसर तुम्हें मिले या जो तुम्हारे वश में हो। इब्रानी में शाब्दिक रूप से है, “जो कुछ तुम्हारा हाथ पाए।”
    reason: इब्रानी ‘हाथ’ वाले मुहावरे का स्वाभाविक व्यापक अर्थ स्पष्ट करता है और उसका शाब्दिक बिंब भी सुरक्षित रखता है।
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: जब … तब
  rationale: यह रचना भविष्य में होने वाली परिस्थिति प्रस्तुत करती है। हिन्दी में ‘जब … तब’ उसका समय-संबंध स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תבאינה הָאֹתוֹת הָאֵלֶּה לָךְ
  choice: ये चिन्ह तुम्हारे सामने आ जाएँ
  rationale: בוא का मूल बिंब ‘आना’ है; चिन्हों के विषय में यह उनके प्रकट या घटित होने को दर्शाता है। ‘तुम्हारे सामने’ हिन्दी में संबोधित व्यक्ति तक उनके आने का स्वाभाविक भाव देता है।
- source_word: עֲשֵׂה לְךָ
  choice: वह करो
  rationale: לְךָ में व्यक्तिगत या स्वयं आगे बढ़कर कार्य करने की छाया है, पर हिन्दी में ‘अपने लिए करो’ उद्देश्य को अनावश्यक रूप से स्वार्थपरक बना सकता है। संदर्भ में सीधी आज्ञा ‘वह करो’ इस भाव को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: אֲשֶׁר תִּמְצָא יָדֶךָ
  choice: जो कुछ तुम्हारा हाथ करने पाए
  rationale: यह इब्रानी मुहावरे के ‘हाथ’ वाले बिंब को बनाए रखता है और उपलब्ध अवसर अथवा सामर्थ्य—दोनों संभावित भावों को समय से पहले एक ही अर्थ में सीमित नहीं करता।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי आज्ञा का कारण बताता है; ‘क्योंकि’ आधुनिक हिन्दी में सीधा और स्वाभाविक है।
- source_word: הָאֱלֹהִים
  choice: परमेश्वर
  rationale: सप्रत्यय संज्ञा यहाँ इस्राएल के परमेश्वर की निश्चित पहचान कराती है। हिन्दी बाइबलीय प्रयोग में ‘परमेश्वर’ स्पष्ट, प्रतिष्ठित और स्वाभाविक है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ है
  rationale: यह वाक्यांश शाऊल के कार्य में परमेश्वर की सहायक उपस्थिति को सीधे व्यक्त करता है, बिना कोई अतिरिक्त व्याख्या जोड़े।
theological_decisions:
- issue: सप्रत्यय הָאֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: वह परमेश्वर
  rationale: इब्रानी का निश्चित उपपद यहाँ अलग से ‘वह’ जोड़ने की माँग नहीं करता; संदर्भ में एकमात्र परमेश्वर की निश्चित पहचान पहले से स्पष्ट है।
- issue: ‘हाथ जो पाए’ मुहावरे की सीमा
  choice: जो कुछ तुम्हारा हाथ करने पाए
  alternative: जो कुछ करना तुम्हारे वश में हो
  rationale: वैकल्पिक रूप केवल सामर्थ्य पर बल देता है, जबकि मूल मुहावरा अवसर, उपलब्ध कार्य या सामर्थ्य की व्यापकता रख सकता है। मुख्य पाठ उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में है, पर बाइबलीय गरिमा बनाए रखती है। ‘जब … तब’ वाक्य को सहज बनाता है; ‘हाथ’ का मूल बिंब जानबूझकर रखा गया है और पादटिप्पणी उसके मुहावरेदार अर्थ को स्पष्ट करती है।
