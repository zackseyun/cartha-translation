base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/027.yaml
  text: But worthless men said[a], “How can this man save us?” And they despised him and did not bring him a gift. But he was like one keeping silent.
translation:
  language: hi
  text: पर कुछ निकम्मे लोगों ने कहा, “यह हमें कैसे बचाएगा?” उन्होंने उसका तिरस्कार किया और उसके लिए कोई भेंट नहीं लाए। पर वह मानो चुप ही रहा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मानो वह बहरा हो।” यह इब्रानी अभिव्यक्ति उकसावे के सामने जानबूझकर चुप रहने का भाव व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְנֵי בְלִיַּעַל
  choice: निकम्मे लोग
  rationale: यह इब्रानी मुहावरा शाब्दिक रूप से ‘निकम्मेपन के पुत्र’ है और नैतिक रूप से नीच या उद्दंड लोगों को दर्शाता है। ‘निकम्मे लोग’ उसकी तिरस्कारपूर्ण शक्ति को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַה יֹּשִׁעֵנוּ זֶה
  choice: यह हमें कैसे बचाएगा?
  rationale: प्रश्न में संदेह और तिरस्कार दोनों हैं। ‘यह’ זֶה की संकेतवाचक और अवमाननापूर्ण धार को संक्षेप में बनाए रखता है।
- source_word: וַיִּבְזֻהוּ
  choice: उन्होंने उसका तिरस्कार किया
  rationale: בזה किसी को तुच्छ समझने या उसका तिरस्कार करने का भाव देता है; यह हिन्दी वाक्यांश कथात्मक प्रसंग में स्पष्ट और गरिमापूर्ण है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: राजकीय प्रसंग में यह किसी शासक को दी जाने वाली भेंट या नजराना है, अनिवार्य रूप से धार्मिक चढ़ावा नहीं। ‘भेंट’ अर्थ को अनावश्यक रूप से राजनीतिक या धार्मिक बनाए बिना व्यक्त करती है।
- source_word: כְּמַחֲרִישׁ
  choice: मानो चुप हो
  rationale: חרשׁ का कृदंत यहाँ मौन रहने का भाव देता है और כְּ तुलना दर्शाता है। यह चयन उपमा को बनाए रखता है और उसके मौन रहने के उद्देश्य को निश्चित नहीं करता।
- source_word: וַיְהִי
  choice: वह ऐसा रहा
  rationale: היה यहाँ शाऊल की स्थिति या व्यवहार का परिचय देता है। ‘ऐसा रहा’ आगामी तुलनात्मक पद ‘मानो चुप हो’ से स्वाभाविक रूप से जुड़ता है।
theological_decisions:
- issue: तिरस्कार के प्रति शाऊल की प्रतिक्रिया
  choice: वह मानो चुप रहा
  alternative: उसने ऐसा किया मानो वह बहरा हो
  rationale: כְּמַחֲרִישׁ मौन रहने या कुछ न सुनने जैसा व्यवहार करने, दोनों का बोध करा सकता है। मुख्य पाठ सीधे मौन के अर्थ को रखता है और पाद-टिप्पणी दूसरी सम्भावना सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और कथात्मक है। ‘निकम्मे लोग’ मूल मुहावरे की कठोरता रखता है; ‘भेंट’ राजकीय संदर्भ के लिए पर्याप्त व्यापक है। अंतिम वाक्य में कुछ औपचारिकता उपमा और मूल की वास्तविक अर्थगत अस्पष्टता बचाने के लिए रखी गई है।
