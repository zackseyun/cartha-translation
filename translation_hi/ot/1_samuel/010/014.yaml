  yaml_path: translation/ot/1_samuel/010/014.yaml
  text: Then Saul’s uncle said to him and to his young man[a], “Where did you go?” And he said, “To seek the donkeys. When we saw that they were nowhere to be found[b], we went to Samuel.”
translation:
  language: hi
  text: तब शाऊल के चाचा ने उससे और उसके सेवक[a] से पूछा, “तुम कहाँ गए थे?” उसने उत्तर दिया, “गधियों को ढूँढ़ने। जब हमने देखा कि वे कहीं नहीं मिलीं, तो हम शमूएल के पास गए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके जवान साथी”; इब्रानी शब्द युवक, परिचर या सेवक के अर्थ में आ सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹד שָׁאוּל
  choice: शाऊल के चाचा
  rationale: דּוֹד का इस पारिवारिक कथानक में स्वाभाविक अर्थ ‘चाचा’ है; व्यापक ‘रिश्तेदार’ की अपेक्षा यह अधिक सटीक है।
- source_word: אֶלָיו וְאֶל נַעֲרוֹ
  choice: उससे और उसके सेवक से
  rationale: נַעַר युवक, परिचर या सेवक को सूचित कर सकता है। प्रसंग में यह शाऊल के साथ भेजे गए परिचर के लिए है, इसलिए आधुनिक हिन्दी में ‘सेवक’ संबंध को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: אָן הֲלַכְתֶּם
  choice: तुम कहाँ गए थे?
  rationale: אָן स्थानवाचक प्रश्न ‘कहाँ’ है और बहुवचन क्रिया शाऊल तथा उसके साथी दोनों को संबोधित करती है; हिन्दी में ‘गए थे’ कथात्मक संवाद के लिए स्वाभाविक है।
- source_word: לְבַקֵּשׁ אֶת הָאֲתֹנוֹת
  choice: गधियों को ढूँढ़ने
  rationale: בקשׁ का अर्थ यहाँ खोज करना है और אֲתֹנוֹת विशेष रूप से मादा गधों का बहुवचन है; हिन्दी का ‘गधियाँ’ इस भेद को सहज रूप से बनाए रखता है।
- source_word: וַנִּרְאֶה כִי אַיִן
  choice: जब हमने देखा कि वे कहीं नहीं मिलीं
  rationale: शाब्दिक भाव ‘हमने देखा कि [वे] नहीं थीं’ है। ‘कहीं नहीं मिलीं’ खोज के प्रसंग में आशय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַנָּבוֹא אֶל שְׁמוּאֵל
  choice: तो हम शमूएल के पास गए
  rationale: בוא मूलतः ‘आना/पहुँचना’ है, पर यात्रा का वृत्तांत सुनाते हुए हिन्दी में ‘के पास गए’ अधिक स्वाभाविक है; אֶל दिशा या गंतव्य बताता है।
