base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/003.yaml
  text: 'Then you will pass on from there and go farther[a], and you will come to the oak of Tabor. There three men going up to God at Bethel will meet you: one carrying three young goats, another carrying three loaves of bread[c][b], and another carrying a wineskin.'
translation:
  language: hi
  text: तब तुम वहाँ से आगे निकलकर और आगे जाओगे, और ताबोर के बड़े वृक्ष[a] के पास पहुँचोगे। वहाँ तुम्हें तीन पुरुष मिलेंगे, जो बेतेल में परमेश्वर के पास जा रहे होंगे[b]। उनमें से एक तीन बकरी के बच्चे, दूसरा तीन रोटियाँ, और तीसरा दाखमधु की एक मशक[c] लिए हुए होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “ताबोर के बांज वृक्ष” अथवा “ताबोर के तारपीन वृक्ष।” इब्रानी शब्द किसी बड़े वृक्ष के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “बेतेल में परमेश्वर के पास ऊपर जा रहे।” संभवतः वे बेतेल के किसी उपासना-स्थल की ओर जा रहे थे।
    reason: cultural_note
  - marker: c
    text: अर्थात दाखमधु रखने की चमड़े की थैली; इब्रानी शब्द किसी बड़े पात्र के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְחָלַפְתָּ מִשָּׁם וָהָלְאָה
  choice: वहाँ से आगे बढ़ोगे
  rationale: यह पदबंध पिछले स्थान से आगे की ओर चलते रहने को व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से क्रमिक गति भी दिखाता है।
- source_word: אֵלוֹן תָּבוֹר
  choice: ताबोर का बड़ा वृक्ष
  rationale: אֵלוֹן किसी बड़े वृक्ष, विशेषकर बांज या तारपीन जैसे वृक्ष, को सूचित कर सकता है। मुख्य पाठ में सामान्य और स्पष्ट अभिव्यक्ति रखकर पादटिप्पणी में विकल्प दिए गए हैं।
- source_word: וּמְצָאוּךָ
  choice: तुम्हें मिलेंगे
  rationale: क्रिया का मूल अर्थ ‘तुम्हें पाएँगे’ है, पर इस प्रसंग में आकस्मिक भेंट के लिए ‘तुम्हें मिलेंगे’ स्वाभाविक हिंदी है।
- source_word: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל
  choice: बेतेल में परमेश्वर के पास जा रहे होंगे
  rationale: यह अनुवाद बेतेल से जुड़े परमेश्वर की ओर जाने के धार्मिक अभिमुखीकरण को बनाए रखता है, पर मूल में स्पष्ट न किए गए ‘आराधना करने’ या किसी विशेष अनुष्ठान को नहीं जोड़ता।
- source_word: גְדָיִים
  choice: बकरी के बच्चे
  rationale: यह सामान्य आधुनिक हिंदी में स्पष्ट है और इब्रानी के युवा बकरों के अर्थ को ठीक व्यक्त करता है।
- source_word: כִּכְּרוֹת לֶחֶם
  choice: रोटियाँ
  rationale: इस संदर्भ में כִּכָּר गोल रोटी या पाव को सूचित करता है। ‘रोटियाँ’ साधारण हिंदी पाठक के लिए स्वाभाविक और पर्याप्त रूप से सटीक है।
- source_word: נֵבֶל יָיִן
  choice: दाखमधु की एक मशक
  rationale: נֵבֶל यहाँ दाखमधु रखने का पात्र है, जिसे सामान्यतः चमड़े की मशक समझा जाता है। ‘दाखमधु की एक मशक’ संक्षिप्त, स्वाभाविक और स्रोत के दोनों संज्ञापदों को व्यक्त करता है।
theological_decisions:
- issue: עֹלִים אֶל הָאֱלֹהִים בֵּית אֵל का आशय
  choice: बेतेल में परमेश्वर के पास जा रहे होंगे
  alternative: बेतेल में परमेश्वर की आराधना करने जा रहे होंगे
  rationale: मूल वाक्यांश परमेश्वर की ओर ऊपर जाने और बेतेल के बीच संबंध स्थापित करता है, लेकिन इस उपवाक्य में आराधना या बलिदान का स्पष्ट उल्लेख नहीं करता। इसलिए अनुवाद धार्मिक दिशा को बनाए रखते हुए अनुष्ठान संबंधी विवरण नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। भविष्यकालीन संकेतों की श्रृंखला स्पष्ट है। धार्मिक वाक्यांश की वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है और किसी विशेष अनुष्ठान को मुख्य पाठ में नहीं जोड़ा गया।
