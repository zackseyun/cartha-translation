  text: So they ran and took him from there[a], and he stood in the midst of the people. And he was taller than all the people from his shoulders upward.
translation:
  language: hi
  text: तब वे दौड़कर उसे वहाँ से ले आए[a], और वह लोगों के बीच खड़ा हो गया। वह सब लोगों से कंधों से ऊपर तक ऊँचा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे वहाँ से निकाल लाए।” इब्रानी क्रिया का सामान्य अर्थ “लेना” है, पर संदर्भ में इसका अर्थ उस स्थान से शाऊल को निकाल लाना हो सकता है जहाँ वह छिप गया था (पद 22 देखें)।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרֻצוּ
  choice: वे दौड़कर
  rationale: रוץ का सीधा अर्थ दौड़ना है; यह कथानक की जीवंतता को बनाए रखता है।
- source_word: וַיִּקָּחֻהוּ מִשָּׁם
  choice: उसे वहाँ से ले आए
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर यहाँ छिपे हुए शाऊल को सभा के पास लाने का संदर्भ है। ‘ले आए’ हिंदी में स्वाभाविक है और दिशा को स्पष्ट करता है; अधिक व्याख्यात्मक विकल्प पादटिप्पणी में रखा गया है।
- source_word: וַיִּתְיַצֵּב בְּתוֹךְ הָעָם
  choice: वह लोगों के बीच खड़ा हो गया
  rationale: हित्पएल रूप का अर्थ अपने को खड़ा करना या स्थान ग्रहण करना हो सकता है। ‘खड़ा हो गया’ दृश्य को स्वाभाविक हिंदी में व्यक्त करता है, जबकि ‘लोगों के बीच’ בְּתוֹךְ का अर्थ सुरक्षित रखता है।
- source_word: וַיִּגְבַּהּ מִכָּל הָעָם
  choice: बाकी सब लोगों से ऊँचा था
  rationale: גבהּ यहाँ तुलनात्मक शारीरिक ऊँचाई बताता है। ‘बाकी सब लोगों से ऊँचा’ हिंदी में स्पष्ट है और הָעָם को अनावश्यक रूप से केवल पुरुषों तक सीमित नहीं करता।
- source_word: מִשִּׁכְמוֹ וָמָעְלָה
  choice: कंधों से ऊपर तक
  rationale: यह मुहावरा बताता है कि शाऊल अन्य लोगों से इतना ऊँचा था कि उसके कंधों के ऊपर का भाग उनसे ऊपर दिखाई देता था। हिंदी का यह रूप मूल चित्र को संक्षेप और स्वाभाविक ढंग से रखता है।
