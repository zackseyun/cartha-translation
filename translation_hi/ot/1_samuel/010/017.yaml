translation:
  language: hi
  text: तब शमूएल ने लोगों को मिस्पा में यहोवा के सम्मुख बुलाया।[क]
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: या, “शमूएल ने लोगों को मिस्पा में यहोवा के पास बुलाया।” इब्रानी क्रिया का अर्थ लोगों को पुकारकर सभा के लिए बुलाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּצְעֵק
  choice: इकट्ठा होने के लिए बुलाया
  rationale: यहाँ क्रिया के साथ सीधा कर्म ‘लोगों’ और सभा-स्थान का उल्लेख है, इसलिए इसका अर्थ पुकारकर सभा के लिए बुलाना है; यह हिन्दी में स्वाभाविक रूप से सामूहिक बुलावे को व्यक्त करता है।
- source_word: אֶת הָעָם
  choice: लोगों को
  rationale: עָם यहाँ इस्राएल के लोगों को सामूहिक रूप से दर्शाता है; ‘लोगों’ इसका सीधा और सहज हिन्दी रूप है।
- source_word: אֶל יְהוָה
  choice: यहोवा के सामने
  rationale: शाब्दिक ‘यहोवा की ओर’ हिन्दी में इस प्रसंग में अस्पष्ट लगेगा। सभा परमेश्वर की उपस्थिति और अधिकार के सामने बुलाई गई है; ‘के सामने’ इस संबंध को स्वाभाविक रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित रूप ‘यहोवा’ व्यक्तिगत दिव्य नाम को शीर्षक से अलग रखते हुए स्पष्ट और सामान्य पाठकों के लिए परिचित है।
- source_word: הַמִּצְפָּה
  choice: मिस्पा में
  rationale: यहाँ מִצְפָּה स्थान-नाम है। अन्तिम ה स्थान-सूचक दिशा को इंगित कर सकता है, पर हिन्दी में सभा के स्थान को ‘मिस्पा में’ कहना प्रसंगानुकूल और स्वाभाविक है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत दिव्य नाम है; इसलिए उसे ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित लिप्यंतरण ‘यहोवा’ रखा गया है।
- issue: אֶל יְהוָה में सभा और यहोवा का संबंध
  choice: यहोवा के सामने
  alternative: यहोवा के पास/लिए
  rationale: मूल का אֶל सामान्यतः दिशा या संबंध बताता है। यहाँ लोगों को वाचा-संबंधी सार्वजनिक कार्यवाही के लिए परमेश्वर की उपस्थिति में बुलाने का भाव संभावित है; ‘के सामने’ इसे व्यक्त करता है, जबकि किसी विशिष्ट अनुष्ठान का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य में सभा बुलाने का भाव स्पष्ट किया गया है, पर मूल में निहित परमेश्वर की उपस्थिति और अधिकार का संबंध बनाए रखा गया है।
