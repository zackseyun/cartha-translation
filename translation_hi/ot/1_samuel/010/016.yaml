  text: וַ/יֹּ֤אמֶר שָׁאוּל֙ אֶל דּוֹד֔/וֹ הַגֵּ֤ד הִגִּיד֙ לָ֔/נוּ כִּ֥י נִמְצְא֖וּ הָ/אֲתֹנ֑וֹת וְ/אֶת דְּבַ֤ר הַ/מְּלוּכָה֙ לֹֽא הִגִּ֣יד ל֔/וֹ אֲשֶׁ֖ר אָמַ֥ר שְׁמוּאֵֽל־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/016.yaml
  text: Saul said to his uncle[b][a], “He plainly told us that the donkeys had been found.” But he did not tell him about the matter of the kingship that Samuel had spoken of.
translation:
  language: hi
  text: शाऊल ने अपने चाचा से कहा, “उन्होंने हमें साफ-साफ बताया कि गदहियाँ मिल गई हैं।” लेकिन राजपद के विषय की वह बात, जो शमूएल ने कही थी, उसने अपने चाचा को नहीं बताई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹדוֹ
  choice: अपने चाचा
  rationale: इस कथा-संदर्भ में דּוֹד पारिवारिक संबंध को सूचित करता है; आधुनिक हिन्दी में ‘चाचा’ स्वाभाविक और स्पष्ट है।
- source_word: הַגֵּד הִגִּיד
  choice: साफ-साफ बताया
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute कथन पर बल देता है; ‘साफ-साफ’ उस प्रबलता को सहज हिन्दी में व्यक्त करता है।
- source_word: נִמְצְאוּ
  choice: मिल गई हैं
  rationale: यहाँ खोई हुई गदहियों के मिल जाने का भाव है; प्रत्यक्ष कथन में हिन्दी का पूर्ण पक्ष स्वाभाविक है।
- source_word: הָאֲתֹנוֹת
  choice: गदहियाँ
  rationale: इब्रानी संज्ञा विशेष रूप से मादा गधों को सूचित करती है; हिन्दी में ‘गदहियाँ’ अर्थ और कथा-संदर्भ दोनों को स्वाभाविक रूप से बनाए रखता है।
- source_word: דְּבַר הַמְּלוּכָה
  choice: राजपद के विषय में जो बात
  rationale: דָּבָר यहाँ विषय/मामले के अर्थ में और מְלוּכָה इस संदर्भ में शाऊल के राजकीय पद या राजत्व के अर्थ में है, न कि मुख्यतः भू-क्षेत्र के रूप में राज्य।
- source_word: לֹא הִגִּיד לוֹ
  choice: वह उसने अपने चाचा को नहीं बताई
  rationale: कर्ता शाऊल ही बना रहता है; ‘अपने चाचा को’ सर्वनाम की संभावित अस्पष्टता दूर करते हुए मूल संबंध को स्पष्ट करता है।
- source_word: אֲשֶׁר אָמַר שְׁמוּאֵל
  choice: जो बात शमूएल ने कही थी
  rationale: यह संबंधवाचक उपवाक्य राजपद के विषय की बात को शमूएल के कथन से जोड़ता है और मूल की सामान्य अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: מְלוּכָה का आशय
  choice: राजपद
  alternative: राज्य
  rationale: निकट संदर्भ शाऊल को दिए जाने वाले राजकीय अधिकार और पद से संबंधित है; ‘राजपद’ इसे भूभाग या प्रजा के अर्थ वाले ‘राज्य’ से अलग रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। प्रत्यक्ष कथन में जोर के लिए ‘साफ-साफ’ और स्त्रीलिंग पशु-संज्ञा के लिए ‘गदहियाँ’ रखा गया है।
