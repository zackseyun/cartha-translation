  yaml_path: translation/ot/1_samuel/010/004.yaml
  text: They will ask you about your welfare and give you two loaves of bread[c][b][a], and you shall receive them from their hand.
translation:
  language: hi
  text: वे तुम्हारा कुशल-क्षेम पूछेंगे[a] और तुम्हें दो रोटियाँ[b] देंगे; और तुम उन्हें उनके हाथ से ले लेना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे तुम्हारा अभिवादन करेंगे।” इब्रानी मुहावरे का शाब्दिक भाव है, कुशल या भलाई के विषय में पूछना।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में, “दो रोटी”; मुहावरे के अनुसार, “दो रोटियाँ।”
    reason: lexical_alternative
  - marker: c
    text: या, “तुम उन्हें उनके हाथ से ग्रहण करना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשָׁאֲלוּ לְךָ לְשָׁלוֹם
  choice: वे तुम्हारा कुशल-क्षेम पूछेंगे
  rationale: यह इब्रानी मुहावरा किसी के शालोम, अर्थात उसकी दशा और भलाई, के विषय में पूछने को व्यक्त करता है। ‘कुशल-क्षेम पूछना’ आधुनिक हिन्दी में स्वाभाविक है और केवल सामान्य अभिवादन की अपेक्षा मूल भाव को अधिक स्पष्ट रखता है।
- source_word: שָׁלוֹם
  choice: कुशल-क्षेम
  rationale: इस प्रसंग में शब्द का अर्थ अमूर्त ‘शान्ति’ नहीं, बल्कि व्यक्ति की भलाई और स्थिति है।
- source_word: וְנָתְנוּ לְךָ
  choice: और तुम्हें ... देंगे
  rationale: वाव-क्रम यहाँ शमूएल की भविष्यवाणी को आगे बढ़ाता है; हिन्दी में भविष्यकाल इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שְׁתֵּי לֶחֶם
  choice: दो रोटियाँ
  rationale: शाब्दिक रूप ‘दो रोटी/दो अन्न’ हिन्दी में अस्वाभाविक है। इस गिनने योग्य संदर्भ में ‘दो रोटियाँ’ सम्भावित इकाइयों को सहज रूप में व्यक्त करता है, बिना अनावश्यक रूप से आधुनिक पावरोटी का बोध देने के।
- source_word: וְלָקַחְתָּ מִיָּדָם
  choice: और तुम उन्हें उनके हाथ से ले लेना
  rationale: לקח का मूल अर्थ ‘लेना’ है। प्रसंग में वस्तु स्वीकार करने का भाव है, पर ‘ले लेना’ मूल क्रिया और निर्देशात्मक बल दोनों को सुरक्षित रखता है।
- source_word: מִיָּדָם
  choice: उनके हाथ से
  rationale: मूल में ‘हाथ’ एकवचन है और प्रत्यय बहुवचन; हिन्दी का ‘उनके हाथ से’ इस सामूहिक मुहावरे और स्रोत-चित्र दोनों को स्वाभाविक रूप से बनाए रखता है।
