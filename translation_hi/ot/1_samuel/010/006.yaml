source:
  edition: WLC
  text: וְ/צָלְחָ֤ה עָלֶ֨י/ךָ֙ ר֣וּחַ יְהוָ֔ה וְ/הִתְנַבִּ֖יתָ עִמָּ֑/ם וְ/נֶהְפַּכְתָּ֖ לְ/אִ֥ישׁ אַחֵֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/006.yaml
  text: Then the Spirit of Yahweh will rush upon you[a], and you will prophesy with them[b], and be turned into another man.
translation:
  language: hi
  text: तब यहोवा का आत्मा तुझ पर प्रबल होकर आएगा[a]; तू उनके साथ भविष्यवाणी करेगा और बदलकर दूसरा मनुष्य हो जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सामर्थ्य के साथ तुझ पर आएगा।”
    reason: lexical_alternative
  - marker: b
    text: या, “एक भिन्न मनुष्य हो जाएगा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְצָלְחָה עָלֶיךָ
  choice: तुझ पर प्रबल होकर उतरेगा
  rationale: रूअख़ यहोवा को कर्ता मानने वाले प्रसंगों में צלח किसी पर आत्मा के शक्तिशाली ढंग से आने को व्यक्त करता है। यह चयन शक्ति और अचानक प्रभाव को स्वाभाविक हिन्दी में रखता है।
- source_word: רוּחַ יְהוָה
  choice: यहोवा का आत्मा
  rationale: यहाँ רוּחַ परमेश्वर के आत्मा को सूचित करता है, न कि केवल हवा या साँस को; יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וְהִתְנַבִּיתָ עִמָּם
  choice: तू उनके साथ भविष्यवाणी करेगा
  rationale: נבא का हित्पएल रूप यहाँ नबियों के समूह के साथ भविष्यवाणी की गतिविधि में भाग लेने का संकेत देता है; ‘उनके साथ’ עם के सहचर्य-भाव को बनाए रखता है।
- source_word: וְנֶהְפַּכְתָּ
  choice: बदलकर … हो जाएगा
  rationale: הפך का निफ़अल रूप अवस्था में आए परिवर्तन को दर्शाता है। हिन्दी की यह रचना परिणामसूचक अर्थ को स्वाभाविक ढंग से व्यक्त करती है, बिना परिवर्तन की प्रकृति को अधिक परिभाषित किए।
- source_word: לְאִישׁ אַחֵר
  choice: दूसरा मनुष्य
  rationale: אִישׁ אַחֵר का सीधा अर्थ ‘दूसरा/भिन्न मनुष्य’ है। यह शाऊल की दशा या भूमिका में वास्तविक परिवर्तन बताता है, पर उसके धर्मवैज्ञानिक विस्तार को तय नहीं करता।
theological_decisions:
- issue: शाऊल के परिवर्तन की प्रकृति
  choice: आत्मा द्वारा प्रभावी वास्तविक परिवर्तन को सीधे शब्दों में रखना, पर उसकी सीमा या स्थायित्व को अनिर्धारित छोड़ना
  alternative: इसे केवल बाहरी भावावेश मानना, या पूर्ण आंतरिक आत्मिक नवीनीकरण घोषित करना
  rationale: इब्रानी पाठ कहता है कि शाऊल भविष्यवाणी करेगा और ‘दूसरा मनुष्य’ हो जाएगा, पर यह नहीं बताता कि यह परिवर्तन स्थायी नैतिक नवीनीकरण था या केवल बाहरी अनुभव। अनुवाद इस धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथात्मक शैली अपनाई गई है। इब्रानी के एकवचन संबोधन के लिए ‘तू/तुझ’ रखा गया है। ‘यहोवा’ मूल पाठ में आए दिव्य नाम को स्पष्ट रूप से प्रस्तुत करता है।
