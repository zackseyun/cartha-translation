source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר אֶל בְּנֵ֣י יִשְׂרָאֵ֗ל כֹּֽה אָמַ֤ר יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל אָנֹכִ֛י הֶעֱלֵ֥יתִי אֶת יִשְׂרָאֵ֖ל מִ/מִּצְרָ֑יִם וָ/אַצִּ֤יל אֶתְ/כֶם֙ מִ/יַּ֣ד מִצְרַ֔יִם וּ/מִ/יַּד֙ כָּל הַ/מַּמְלָכ֔וֹת הַ/לֹּחֲצִ֖ים אֶתְ/כֶֽם׀־פ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/018.yaml
  text: 'And he said to the sons of Israel[a], “Thus says Yahweh, the God of Israel: I brought Israel up from Egypt, and I delivered you from the hand of the Egyptians and from the hand of all the kingdoms that were oppressing you.”'
translation:
  language: hi
  text: 'और उसने इस्राएलियों[a] से कहा, “इस्राएल का परमेश्वर यहोवा यों कहता है: मैं इस्राएल को मिस्र से निकाल लाया, और मैंने तुमको मिस्रियों के हाथ से तथा उन सभी राज्यों के हाथ से छुड़ाया जो तुम पर अत्याचार कर रहे थे।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “इस्राएल के पुत्रों”; परंपरागत रूप से “इस्राएल की संतानों”।
    reason: मूल जातिनाम की शाब्दिक संरचना और परंपरागत विकल्प बताने के लिए।
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे समुदाय का प्रचलित जातिनाम है; आधुनिक हिन्दी में ‘इस्राएली’ अधिक स्वाभाविक और समावेशी है। शाब्दिक विकल्प फुटनोट में दिया गया है।
- source_word: כֹּה אָמַר
  choice: यों कहता है
  rationale: यह दूत अथवा नबी की गंभीर उद्घोषणा का स्थापित सूत्र है और हिन्दी बाइबलीय शैली में स्वाभाविक है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण से रखा गया है।
- source_word: הֶעֱלֵיתִי
  choice: निकाल लाया
  rationale: हिफ़ील क्रिया का मूल बिंब ‘ऊपर ले आना’ है; निर्गमन के प्रसंग में हिन्दी का ‘मिस्र से निकाल लाया’ दिशा और उद्धार—दोनों को सहज रूप से व्यक्त करता है।
- source_word: וָאַצִּיל
  choice: छुड़ाया
  rationale: यह क्रिया शत्रुतापूर्ण अधिकार अथवा संकट से बचाने और मुक्त करने को सूचित करती है; ‘छुड़ाया’ हिन्दी में इस भाव को स्पष्ट रखता है।
- source_word: מִיַּד
  choice: के हाथ से
  rationale: सामर्थ्य अथवा नियंत्रण के लिए प्रयुक्त इब्रानी रूपक को सुरक्षित रखा गया है; हिन्दी में भी यह मुहावरा स्पष्ट है।
- source_word: מִצְרַיִם
  choice: मिस्रियों
  rationale: यहाँ देश का नाम उसके लोगों अथवा शासन-सामर्थ्य के लिए लक्षणा से आया है; ‘मिस्रियों के हाथ से’ हिन्दी में अधिक स्वाभाविक है।
- source_word: כָּל הַמַּמְלָכוֹת
  choice: सभी राज्यों
  rationale: बहुवचन और व्यापकता को बिना कोई अतिरिक्त भौगोलिक सूचना जोड़े सुरक्षित रखता है।
- source_word: הַלֹּחֲצִים אֶתְכֶם
  choice: जो तुम पर अत्याचार कर रहे थे
  rationale: कृदंत जारी अथवा विशेषतापूर्ण उत्पीड़न दर्शाता है; अपूर्ण भूतकालीन अभिव्यक्ति उसके कालगत विस्तार को बनाए रखती है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है, इसलिए ‘प्रभु’ जैसी स्थानापन्न उपाधि नहीं दी गई। आधुनिक हिन्दी में ‘यहोवा’ व्यापक रूप से पहचाना जाने वाला रूप है; ‘याहवे’ स्रोत-उच्चारण के निकट वैकल्पिक लिप्यंतरण है।
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: पद में संबोधन पूरे इस्राएली समुदाय का है। मुख्य पाठ में जातिनाम रखने से स्त्री-पुरुष पूरे समुदाय का आशय स्पष्ट होता है, जबकि मूल की औपचारिक संरचना फुटनोट में संरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। ‘यों कहता है’ और ‘के हाथ से छुड़ाया’ मूल की उद्घोषणात्मक शैली तथा रूपक को बनाए रखते हैं; अत्यधिक पुरातन शब्दावली से बचा गया है।
