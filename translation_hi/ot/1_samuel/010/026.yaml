base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/026.yaml
  text: Saul also went to his home at Gibeah[b][a], and with him went the valiant men whose hearts God had touched.
translation:
  language: hi
  text: शाऊल भी गिबा में अपने घर चला गया, और उसके साथ वे वीर पुरुष[a] गए जिनके हृदयों को परमेश्वर ने छुआ था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘पराक्रमी पुरुष’ अथवा ‘योद्धा’।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘जिनके हृदयों को परमेश्वर ने छुआ था’; यह मुहावरा बताता है कि परमेश्वर ने उनकी भीतरी प्रवृत्ति को प्रभावित किया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם
  choice: भी
  rationale: यह कथा में जोड़ और निरंतरता दर्शाता है; हिंदी में ‘भी’ संक्षिप्त और स्वाभाविक है।
- source_word: הָלַךְ לְבֵיתוֹ גִּבְעָתָה
  choice: गिबा में अपने घर चला गया
  rationale: לְבֵיתוֹ और दिशासूचक גִּבְעָתָה दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: וַיֵּלְכוּ עִמּוֹ
  choice: और उसके साथ ... गए
  rationale: इब्रानी कथात्मक क्रम और साथ जाने के भाव को बनाए रखता है।
- source_word: הַחַיִל
  choice: वीर पुरुष
  rationale: संदर्भ में यह पूरी सेना नहीं, बल्कि सामर्थ्यवान अथवा युद्ध-योग्य पुरुषों के समूह को सूचित करता है; विकल्प फुटनोट में दिए गए हैं।
- source_word: אֲשֶׁר נָגַע אֱלֹהִים בְּלִבָּם
  choice: जिनके हृदयों को परमेश्वर ने छुआ था
  rationale: मूल रूपक और प्रत्येक व्यक्ति के भीतरी मनोभाव पर परमेश्वर के प्रभाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ इस्राएल के परमेश्वर का उल्लेख है; आधुनिक हिंदी बाइबलीय शैली में यह स्पष्ट और प्रतिष्ठित रूप है।
- source_word: לֵב
  choice: हृदयों
  rationale: इब्रानी में यह इच्छा, विचार और भीतरी प्रवृत्ति सहित आंतरिक व्यक्ति को दर्शा सकता है; ‘हृदय’ मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: पुरुषों के हृदयों को छूने में परमेश्वर के कार्य का स्वरूप
  choice: ‘परमेश्वर ने छुआ था’ कहकर दैवी प्रभाव के मूल रूपक को बनाए रखना
  alternative: ‘परमेश्वर ने प्रेरित किया था’ या ‘परमेश्वर ने उनके मन फेर दिए थे’
  rationale: पाठ परमेश्वर की पहल और उनके भीतरी स्वभाव पर प्रभाव बताता है, पर उसके सिद्धान्तगत तंत्र को स्पष्ट नहीं करता; इसलिए पुनर्जन्म, बाध्यकारी नियंत्रण या केवल भावनात्मक प्रोत्साहन जैसी व्याख्याएँ नहीं जोड़ी गईं।
translation_notes:
  register: आधुनिक मानक हिंदी में स्वाभाविक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट शैली। मूल इब्रानी के ‘हृदय छूने’ वाले रूपक को मुख्य पाठ में रखा गया है; सभी फुटनोट चिह्न मुख्य पाठ में उपस्थित हैं।
