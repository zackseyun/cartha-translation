base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/021.yaml
  text: Then he brought the tribe of Benjamin near by its clans[a], and the clan of the Matrites was taken. Then Saul son of Kish was taken, but when they sought him[b], he could not be found.
translation:
  language: hi
  text: फिर उसने बिन्यामीन के गोत्र को उसके कुलों[a] के अनुसार सामने लाया, और मत्रियों का कुल चुना गया। फिर कीश का पुत्र शाऊल चुना गया; पर जब उन्होंने उसे खोजा, तो वह नहीं मिला।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘कुल’ से आशय गोत्र के भीतर के विस्तृत पारिवारिक समूहों से है; इसका अनुवाद ‘परिवारों’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘चुना गया’ यहाँ चयन की प्रक्रिया में संकेतित होने को दर्शाता है; इसका अर्थ सैन्य रूप से बंदी बनाया जाना नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: निकट बुलाया
  rationale: हिफ़ील रूप का मूल भाव ‘निकट लाना’ है; चयन की प्रक्रिया में यह स्वाभाविक हिन्दी में लोगों को सामने बुलाने का संकेत देता है।
- source_word: שֵׁבֶט בִּנְיָמִן
  choice: बिन्यामीन के गोत्र
  rationale: שֵׁבֶט के सामाजिक-संगठन संबंधी अर्थ के लिए ‘गोत्र’ प्रचलित और संक्षिप्त हिन्दी पद है।
- source_word: לְמִשְׁפְּחֹתָיו
  choice: उसके कुलों के अनुसार
  rationale: מִשְׁפָּחָה यहाँ गोत्र के भीतर विस्तृत पारिवारिक समूह को दर्शाता है; ‘कुल’ आधुनिक हिन्दी में इस क्रम को स्पष्ट रखता है।
- source_word: וַתִּלָּכֵד / וַיִּלָּכֵד
  choice: चिट्ठी में पकड़ा गया
  rationale: לכד के ‘पकड़े जाने’ वाले रूपक को बनाए रखते हुए ‘चिट्ठी में’ जोड़ने से स्पष्ट होता है कि बात युद्धबंदी बनाए जाने की नहीं, चिट्ठी द्वारा संकेतित होने की है।
- source_word: מִשְׁפַּחַת הַמַּטְרִי
  choice: मत्रियों का कुल
  rationale: समूहवाचक/वंश-सूचक रूप הַמַּטְרִי को किसी अनुमानित एकल पूर्वज में बदलने के बजाय ‘मत्रियों’ के रूप में रखा गया है।
- source_word: שָׁאוּל בֶּן קִישׁ
  choice: कीश का पुत्र शाऊल
  rationale: हिब्रू संरचना का अर्थ स्पष्ट करते हुए स्वाभाविक हिन्दी वंश-सूचक क्रम अपनाया गया है।
- source_word: וַיְבַקְשֻׁהוּ
  choice: जब उन्होंने उसे खोजा
  rationale: בקשׁ का यहाँ अर्थ किसी अनुपस्थित व्यक्ति को ढूँढ़ना है; ‘खोजा’ सहज कथात्मक हिन्दी है।
- source_word: וְלֹא נִמְצָא
  choice: वह नहीं मिला
  rationale: निफ़अल रूप का सरल और स्वाभाविक हिन्दी समतुल्य, जो असफल खोज का परिणाम व्यक्त करता है।
theological_decisions:
- issue: לכד का चयन-संदर्भ
  choice: ‘चिट्ठी में पकड़ा गया’ के द्वारा क्रिया का रूपक और चयन की विधि दोनों व्यक्त किए गए
  alternative: ‘चुना गया’
  rationale: ‘चुना गया’ अर्थ स्पष्ट करता, पर मूल क्रिया के ‘पकड़े जाने’ वाले तनाव को मिटा देता; वर्तमान रूप मूल रूपक को सुरक्षित रखते हुए गलत सैन्य अर्थ रोकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक रखी गई है। ‘गोत्र → कुल → व्यक्ति’ का क्रम स्पष्ट है। ‘निकट बुलाया’ मूल קרב के प्रक्रियात्मक भाव को बनाए रखता है, जबकि ‘चिट्ठी में पकड़ा गया’ לכד की वास्तविक रूपकात्मकता और प्रसंगगत अर्थ दोनों को सुरक्षित रखता है।
