  text: אַ֣חַר כֵּ֗ן תָּבוֹא֙ גִּבְעַ֣ת הָ/אֱלֹהִ֔ים אֲשֶׁר שָׁ֖ם נְצִבֵ֣י פְלִשְׁתִּ֑ים וִ/יהִי֩ כְ/בֹאֲ/ךָ֨ שָׁ֜ם הָ/עִ֗יר וּ/פָגַעְתָּ֞ חֶ֤בֶל נְבִיאִים֙ יֹרְדִ֣ים מֵֽ/הַ/בָּמָ֔ה וְ/לִ/פְנֵי/הֶ֞ם נֵ֤בֶל וְ/תֹף֙ וְ/חָלִ֣יל וְ/כִנּ֔וֹר וְ/הֵ֖מָּה מִֽתְנַבְּאִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/005.yaml
  text: After that you will come to Gibeath-ha-Elohim[a], where the Philistine garrison is. And when you enter there, into the city, you will meet a band of prophets coming down from the high place, with harp, tambourine, flute, and lyre before them[c][b], and they will be prophesying.
translation:
  language: hi
  text: इसके बाद तुम गिबअत-हा-एलोहीम[a] पहुँचोगे, जहाँ पलिश्तियों की सैनिक चौकी[b] है। जब तुम वहाँ नगर में प्रवेश करोगे, तब तुम्हें नबियों का एक दल ऊँचे स्थान से नीचे आता हुआ मिलेगा। उनके आगे वीणा, डफली, बाँसुरी और किन्नोर[c] होंगे, और वे भविष्यवाणी कर रहे होंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “परमेश्वर की पहाड़ी” अथवा “परमेश्वर का गिबा”; हिब्रू को स्थान-नाम या उस स्थान के वर्णन, दोनों रूपों में समझा जा सकता है।
    reason: alternative_reading
  - marker: b
    text: या “पलिश्तियों की चौकी”; हिब्रू शब्द पलिश्ती अधिकारियों के लिए भी प्रयुक्त हो सकता है, हालाँकि यहाँ सैनिक चौकी का अर्थ अधिक सम्भावित है।
    reason: alternative_reading
  - marker: c
    text: इन प्राचीन वाद्यों की ठीक पहचान अनिश्चित है। “वीणा” किसी हार्प या ल्यूट जैसे तारवाद्य को और “बाँसुरी” किसी नलीनुमा वाद्य को दर्शा सकती है; “किन्नोर” एक अन्य प्राचीन तारवाद्य था।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּבְעַת הָאֱלֹהִים
  choice: गिबअत-हा-एलोहीम
  rationale: वाक्यांश को सम्भावित स्थान-नाम मानकर लिप्यंतरित किया गया है; इसकी वर्णनात्मक समझ को पादटिप्पणी में रखा गया है।
- source_word: נְצִבֵי פְלִשְׁתִּים
  choice: पलिश्तियों की सैनिक चौकी
  rationale: נְצִיב अधिकारी अथवा तैनात चौकी दोनों का बोध करा सकता है; निकटवर्ती कथा-संदर्भ में सैनिक चौकी अधिक उपयुक्त है।
- source_word: וִיהִי כְבֹאֲךָ שָׁם הָעִיר
  choice: जब तुम वहाँ नगर में प्रवेश करोगे
  rationale: हिब्रू के कालवाचक कथन को स्वाभाविक आधुनिक हिन्दी में व्यक्त करते हुए שָׁם और הָעִיר दोनों को बनाए रखा गया है।
- source_word: וּפָגַעְתָּ
  choice: तुम्हें ... मिलेगा
  rationale: यहाँ क्रिया का अर्थ किसी से आमना-सामना होना या उसे मार्ग में पाना है; हिन्दी में यह सहज और सटीक है।
- source_word: חֶבֶל נְבִיאִים
  choice: नबियों का एक दल
  rationale: חֶבֶל यहाँ साथ चलनेवाले समूह या मंडली को दर्शाता है; ‘दल’ स्पष्ट और प्रचलित है।
- source_word: יֹרְדִים מֵהַבָּמָה
  choice: ऊँचे स्थान से नीचे आता हुआ
  rationale: בָּמָה उपासना के लिए प्रयुक्त ऊँचे स्थान को दर्शाता है; इसे केवल ‘मन्दिर’ या ‘पवित्र स्थान’ कहकर अधिक निश्चित नहीं किया गया।
- source_word: נֵבֶל
  choice: वीणा
  rationale: प्राचीन तारवाद्य की ठीक पहचान अनिश्चित है; ‘वीणा’ हिन्दी पाठक के लिए परिचित निकटतम सामान्य शब्द है।
- source_word: תֹף
  choice: डफली
  rationale: यह हाथ में लेकर बजाया जानेवाला तालवाद्य था; ‘डफली’ आधुनिक हिन्दी में सहज समतुल्य है।
- source_word: חָלִיל
  choice: बाँसुरी
  rationale: यह एक वायुवाद्य है; ‘बाँसुरी’ सुबोध है, यद्यपि ‘नली’ जैसा अधिक सामान्य अर्थ सम्भव है।
- source_word: כִּנּוֹר
  choice: सारंगी
  rationale: यह נֵבֶל से भिन्न प्राचीन तारवाद्य है; ‘सारंगी’ एक परिचित अनुमानित समतुल्य है, पर सटीक पहचान अनिश्चित होने से पादटिप्पणी दी गई है।
- source_word: וְהֵמָּה מִתְנַבְּאִים
  choice: वे भविष्यवाणी कर रहे होंगे
  rationale: क्रिया को उसके व्यापक नबूवत-संबंधी अर्थ में रखा गया है; उन्मत्तावस्था, प्रेरित संगीत या भविष्य-कथन जैसी किसी एक विशेष विधि को आरोपित नहीं किया गया।
theological_decisions:
- issue: מִתְנַבְּאִים में नबूवत-संबंधी गतिविधि का स्वरूप
  choice: ‘भविष्यवाणी कर रहे होंगे’
  alternative: ‘नबियों जैसी प्रेरित अवस्था में होंगे’ या ‘प्रेरणा से स्तुति कर रहे होंगे’
  rationale: हिब्रू क्रिया नबूवत-संबंधी गतिविधि स्पष्ट करती है, पर उसके बाहरी स्वरूप को निश्चित नहीं करती; इसलिए मूल की खुली हुई अर्थ-सीमा सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और मौखिक पठन के अनुकूल शैली रखी गई है। स्थान-नाम लिप्यंतरित है और वास्तविक शाब्दिक व वाद्य-संबंधी अनिश्चितताएँ पादटिप्पणियों में सुरक्षित हैं।
