  text: וַ/יְדַבֵּ֨ר שְׁמוּאֵ֜ל אֶל הָ/עָ֗ם אֵ֚ת מִשְׁפַּ֣ט הַ/מְּלֻכָ֔ה וַ/יִּכְתֹּ֣ב בַּ/סֵּ֔פֶר וַ/יַּנַּ֖ח לִ/פְנֵ֣י יְהוָ֑ה וַ/יְשַׁלַּ֧ח שְׁמוּאֵ֛ל אֶת כָּל הָ/עָ֖ם אִ֥ישׁ לְ/בֵיתֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/025.yaml
  text: Then Samuel told the people the rights and duties of the kingship[a], and he wrote them in the book and laid it before Yahweh. Then Samuel sent all the people away[b], each man to his house.
translation:
  language: hi
  text: तब शमूएल ने लोगों को राजपद की व्यवस्था[a] बताई। उसने उसे पुस्तक में लिखकर याहवे के सामने रख दिया। फिर शमूएल ने सब लोगों को विदा कर दिया—हर एक पुरुष अपने घर चला गया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “राजपद की रीति या प्रथा।” इब्रानी पदबंध राजकीय शासन से संबंधित कानूनी नियमों, स्थापित व्यवस्था अथवा प्रथा को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “हर एक पुरुष अपने घर को।” यह वितरणात्मक अभिव्यक्ति बताती है कि लोग अपने-अपने घर चले गए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: बताए
  rationale: דבר के साथ संबोधित व्यक्ति और कथ्य आने पर यहाँ अर्थ लोगों को किसी विषय की जानकारी देना है; ‘बताए’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מִשְׁפַּט הַמְּלֻכָה
  choice: राजपद के अधिकार और कर्तव्य
  rationale: מִשְׁפַּט विधि, अधिकार, निर्धारित दायित्व या प्रचलित व्यवस्था को सूचित कर सकता है, और מְלֻכָה यहाँ भू-राज्य से अधिक राजकीय पद अथवा संस्था है। यह अनुवाद प्रसंग के वैधानिक आशय को स्पष्ट रखते हुए वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित करता है।
- source_word: וַיִּכְתֹּב בַּסֵּפֶר
  choice: उन्हें पुस्तक में लिखकर
  rationale: ‘उन्हें’ पूर्वोक्त अधिकारों और कर्तव्यों की ओर संकेत करता है। סֵפֶר पुस्तक, ग्रंथ, लेख या दस्तावेज़ हो सकता है; ‘पुस्तक’ मुख्य पाठ में सहज और पर्याप्त रूप से अनिर्दिष्ट है।
- source_word: וַיַּנַּח לִפְנֵי יְהוָה
  choice: याहवे के सामने रख दिया
  rationale: נוח के हिफ़ील रूप का अर्थ यहाँ किसी लिखित वस्तु को रख देना है; वाक्यांश परमेश्वर की उपस्थिति में उसे जमा करने का संभावित धार्मिक भाव भी बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए व्यक्तिगत ईश्वरीय नाम को उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: וַיְשַׁלַּח
  choice: विदा कर दिया
  rationale: इस प्रसंग में क्रिया किसी कार्य पर भेजने के बजाय सभा समाप्त करके लोगों को जाने देने का अर्थ देती है।
- source_word: אִישׁ לְבֵיתוֹ
  choice: हर एक पुरुष अपने घर चला गया
  rationale: मूल का पुल्लिंग एकवचन वितरणात्मक प्रयोग बनाए रखा गया है, जबकि हिन्दी में ‘चला गया’ जोड़ने से विदाई के बाद अपने-अपने घर लौटने का आशय स्वाभाविक बनता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: מִשְׁפַּט הַמְּלֻכָה की वैधानिक और प्रथागत अर्थ-सीमा
  choice: राजपद के अधिकार और कर्तव्य
  alternative: राजपद की रीति/प्रथा
  rationale: प्रसंग राजकीय व्यवस्था के निर्धारित नियमों की ओर संकेत करता है, पर मूल शब्द स्थापित प्रथा भी दर्शा सकता है; इसलिए मुख्य पाठ में वैधानिक अर्थ और पादटिप्पणी में विकल्प रखा गया है।
- issue: אִישׁ לְבֵיתוֹ का लिंगयुक्त वितरणात्मक रूप
  choice: हर एक पुरुष अपने घर चला गया
  alternative: हर कोई अपने घर चला गया
  rationale: मूल पाठ का व्याकरणिक पुल्लिंग एकवचन सुरक्षित रखा गया है और उसके वितरणात्मक आशय को हिन्दी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘राजपद’ संस्था या पद के अर्थ को ‘राज्य’ की भौगोलिक धारणा से अलग रखता है। वाक्यों को हिन्दी की स्वाभाविक लय के लिए विभाजित किया गया है, और सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
