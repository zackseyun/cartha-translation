base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/022.yaml
  text: So they inquired of Yahweh again[a], “Has the man come here yet?” And Yahweh said, “Behold, he has hidden himself among the baggage.”
translation:
  language: hi
  text: तब उन्होंने फिर याहवे से पूछा, “क्या वह आदमी अब तक यहाँ आया है?” याहवे ने कहा, “देखो, वह सामान[a] के बीच छिपा हुआ है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ व्यापक रूप से ‘वस्तुएँ’ या ‘सामान’ हो सकता है; यह पात्रों, उपकरणों या अन्य सामग्री को भी सूचित कर सकता है। यहाँ संभवतः इकट्ठे हुए लोगों का सामान अथवा रसद अभिप्रेत है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁאֲלוּ עוֹד בַּיהוָה
  choice: तब उन्होंने फिर यहोवा से पूछा
  rationale: שׁאל עם בַּיהוָה यहाँ परमेश्वर से उत्तर जानने के लिए पूछने का भाव रखता है। सरल हिंदी में ‘यहोवा से पूछा’ औपचारिक परामर्श के इस संदर्भ में स्वाभाविक है; עוֹד की पुनरावृत्ति ‘फिर’ से व्यक्त हुई है।
- source_word: הֲבָא עוֹד הֲלֹם אִישׁ
  choice: क्या वह पुरुष यहाँ आ चुका है?
  rationale: Perfect בוא आगमन हो चुकने के विषय में प्रश्न करता है; ‘आ चुका है’ उस पूर्णता को व्यक्त करता है। אִישׁ संदर्भ में खोजे जा रहे विशिष्ट पुरुष, शाऊल, की ओर संकेत करता है, इसलिए ‘वह पुरुष’ रखा गया है। दूसरे עוֹד का भाव हिंदी की पूर्णतासूचक रचना ‘आ चुका है’ में स्वाभाविक रूप से समाहित है।
- source_word: הִנֵּה
  choice: देखो
  rationale: הִנֵּה आगे कही जाने वाली बात की ओर जोर से ध्यान खींचता है। ‘देखो’ आधुनिक, dignified और स्पष्ट हिंदी है।
- source_word: נֶחְבָּא
  choice: छिपा हुआ है
  rationale: Niphal रूप यहाँ शाऊल के छिपे होने की वर्तमान परिणामी अवस्था बताता है। ‘छिपा हुआ है’ मूल की रूपगत अस्पष्टता को बनाए रखता है और अनावश्यक रूप से ‘उसने अपने आपको छिपाया है’ नहीं जोड़ता।
- source_word: אֶל הַכֵּלִים
  choice: सामान के बीच
  rationale: כֵּלִים पात्रों, वस्तुओं, उपकरणों या यात्रा-सामग्री का व्यापक शब्द है। सभा के संदर्भ में ‘सामान’ स्वाभाविक है, जबकि पादटिप्पणी इसकी व्यापक अर्थ-सीमा बताती है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में वाचा-सूचक विशिष्ट नाम יְהוָה दो बार आया है। हिंदी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को सामान्य उपाधि में बदलने के बजाय उसके नामत्व को सुरक्षित रखता है।
translation_notes:
