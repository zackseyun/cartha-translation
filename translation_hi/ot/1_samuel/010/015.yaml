  register: भाषा आधुनिक, सहज और सम्मानपूर्ण है। चाचा द्वारा छोटे संबंधी को संबोधित करने के प्रसंग में ‘बताओ’ स्वाभाविक है। मूल के बहुवचन לָכֶם को अस्पष्ट ‘तुमसे’ के बजाय ‘तुम लोगों से’ द्वारा मुख्य पाठ में ही स्पष्ट रखा गया है, इसलिए पादटिप्पणी आवश्यक नहीं है।
