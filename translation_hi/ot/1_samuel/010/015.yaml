base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/015.yaml
  text: Then Saul’s uncle said[a], “Please tell me what Samuel said to you.”
translation:
  language: hi
  text: तब शाऊल के चाचा ने कहा, “कृपया मुझे बताओ, शमूएल ने तुम लोगों से क्या कहा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम का स्वाभाविक संकेत देता है।
- source_word: דּוֹד שָׁאוּל
  choice: शाऊल के चाचा
  rationale: इस संबंध-सूचक प्रसंग में דּוֹד का सामान्य अर्थ ‘चाचा’ है, और हिन्दी में संबंध-निर्माण स्वाभाविक रूप से ‘शाऊल के चाचा’ होता है।
- source_word: הַגִּידָה נָּא לִי
  choice: कृपया मुझे बताओ
  rationale: נגד का हिफ़ील आज्ञार्थक रूप ‘बताना/सूचित करना’ है और נָא विनम्र अनुरोध व्यक्त करता है; ‘कृपया’ इस भाव को स्पष्ट और स्वाभाविक रखता है।
- source_word: מָה
  choice: क्या
  rationale: यह सीधा प्रश्नवाचक शब्द है और ‘बताओ ... क्या कहा’ हिन्दी में स्वाभाविक आश्रित प्रश्न है।
- source_word: אָמַר
  choice: कहा
  rationale: אָמַר का सामान्य अर्थ ‘कहना’ है; ‘कहा’ मूल के सरल वचन-क्रिया भाव को बनाए रखता है।
- source_word: לָכֶם
  choice: तुम लोगों से
  rationale: यह द्वितीय पुरुष पुल्लिंग बहुवचन है। हिन्दी में ‘तुम लोगों से’ बहुवचन को स्पष्ट रूप से सुरक्षित रखता है और प्रसंगतः शाऊल तथा उसके सेवक की ओर संकेत कर सकता है।
- source_word: שְׁמוּאֵל
  choice: शमूएल
  rationale: व्यक्तिनाम को प्रचलित हिन्दी बाइबलीय रूप में लिप्यंतरित किया गया है।
