    rationale: נָטַשׁ ... אֶת דִּבְרֵי הָאֲתֹנוֹת means that Saul’s father has set aside the donkeys’ matter, namely his concern over them; it is not chiefly about ceasing to speak of them.
  - severity: low
    issue: ‘अब’ does not fully reflect וְהִנֵּה.
    rationale: The particle introduces an emphatic, vivid development. ‘देखो’ preserves this discourse function in modern Hindi.
  - severity: low
    issue: ‘तुम दोनों के लिए चिंतित’ is less precise idiomatically.
    rationale: The plural suffix is correctly made explicit, but ‘तुम दोनों की चिंता कर रहे हैं’ more directly means ‘is anxious about you both.’
