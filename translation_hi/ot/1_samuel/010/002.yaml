base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/002.yaml
  text: When you leave me today[a], you will find two men near Rachel’s tomb in the territory of Benjamin at Zelzah, and they will say to you, ‘The donkeys that you went to look for have been found, and look, your father has stopped caring about the donkeys and is anxious about you, saying[c][b], “What shall I do about my son?”’
translation:
  language: hi
  text: आज जब तुम मेरे पास से जाओगे, तो बिन्यामीन के क्षेत्र[a] में सेल्सह के पास, राहेल की कब्र के निकट तुम्हें दो आदमी मिलेंगे। वे तुमसे कहेंगे, ‘जिन गधियों को ढूँढ़ने तुम गए थे, वे मिल गई हैं। देखो, तुम्हारे पिता ने गधियों की चिंता छोड़ दी है[b] और वे तुम दोनों की चिंता कर रहे हैं। वे कह रहे हैं, “मैं अपने बेटे के लिए क्या करूँ?”’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिन्यामीन की सीमा पर।’ इब्रानी शब्द का अर्थ ‘क्षेत्र’ या ‘सीमा’, दोनों हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘गधियों का मामला छोड़ दिया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּלֶכְתְּךָ הַיּוֹם מֵעִמָּדִי
  choice: आज जब तुम मेरे पास से जाओगे
  rationale: ב के साथ infinitive construct समयसूचक उपवाक्य बनाता है; ‘मेरे पास से जाओगे’ शमूएल की उपस्थिति से प्रस्थान का भाव स्वाभाविक हिन्दी में रखता है।
- source_word: עִם קְבֻרַת רָחֵל
  choice: राहेल की कब्र के पास
  rationale: स्थानसूचक प्रसंग में עִם का अर्थ ‘पास’ है; קְבֻרָה को यहाँ नामित समाधि-स्थल के अर्थ में ‘कब्र’ कहना स्पष्ट और स्वाभाविक है।
- source_word: בִּגְבוּל בִּנְיָמִן
  choice: बिन्यामीन के क्षेत्र में
  rationale: גְּבוּל क्षेत्र या सीमा, दोनों का बोध करा सकता है। मुख्य पाठ में स्थानवाचक प्रवाह के लिए ‘क्षेत्र’ चुना गया है और ‘सीमा’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּצֶלְצַח
  choice: सेल्सह में
  rationale: स्थान-नाम का देवनागरी लिप्यंतरण किया गया है; हिन्दी में स्थान के साथ ‘में’ सहज है।
- source_word: נִמְצְאוּ הָאֲתֹנוֹת אֲשֶׁר הָלַכְתָּ לְבַקֵּשׁ
  choice: जिन गधियों को ढूँढ़ने तुम गए थे, वे मिल गई हैं
  rationale: אֲתֹנוֹת स्त्रीलिंग बहुवचन है, इसलिए ‘गधियाँ’ स्रोत की विशिष्टता रखता है। पूर्ण क्रिया के परिणामसूचक भाव को ‘मिल गई हैं’ व्यक्त करता है।
- source_word: נָטַשׁ אָבִיךָ אֶת דִּבְרֵי הָאֲתֹנוֹת
  choice: तुम्हारे पिता ने गधियों की बात छोड़ दी है
  rationale: दִּבְרֵי यहाँ केवल बोले हुए शब्द नहीं, बल्कि विषय या मामला है। ‘बात छोड़ दी है’ मूल रूपक के निकट रहते हुए आधुनिक हिन्दी में समझने योग्य है।
- source_word: וְדָאַג לָכֶם
  choice: और वे तुम दोनों के लिए चिंतित होकर
  rationale: לָכֶם स्पष्टतः बहुवचन है और प्रसंग में शाऊल तथा उसके सेवक की ओर संकेत करता है; ‘तुम दोनों’ हिन्दी में इस संख्या को प्रत्यक्ष रखता है।
- source_word: מָה אֶעֱשֶׂה לִבְנִי
  choice: मैं अपने बेटे के लिए क्या करूँ?
  rationale: לִבְנִי का संबंधपरक अर्थ ‘अपने बेटे के लिए’ स्वाभाविक रूप से व्यक्त होता है और पिता की चिंता बनाए रखता है।
