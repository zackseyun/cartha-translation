base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/019.yaml
  text: But today you have rejected your God[a], who himself saves you from all your calamities and distresses, and you have said to him, ‘No[b], but set a king over us.’ So now present yourselves before Yahweh by your tribes and by your thousands.
translation:
  language: hi
  text: परन्तु आज तुमने तुम्हारे परमेश्वर को ठुकरा दिया है, जो स्वयं तुम्हें तुम्हारी सारी विपत्तियों और मुसीबतों से बचाता है[a]; और तुमने उससे कहा, “हमारे ऊपर एक राजा नियुक्त कर।”[b] इसलिए अब अपने-अपने गोत्रों और अपने-अपने हज़ारों के अनुसार याहवे के सामने उपस्थित हो जाओ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “विपत्तियों और मुसीबतों” के लिए प्रयुक्त इब्रानी शब्द झेली गई बुराइयों, आपदाओं, कष्टों या संकटों को भी दर्शा सकते हैं।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी अव्यय का बल प्रसंगानुसार “कि,” “निश्चय ही,” अथवा विरोध को उभारने वाला हो सकता है। इसलिए इसे इस प्रकार भी समझा जा सकता है: “नहीं, हमारे ऊपर एक राजा नियुक्त कर।”'
    reason: source_ambiguity
lexical_decisions:
- source_word: מְאַסְתֶּם
  choice: ठुकरा दिया है
  rationale: यह क्रिया अस्वीकार करने या तिरस्कारपूर्वक नकार देने का भाव रखती है। ‘ठुकरा दिया है’ आधुनिक हिन्दी में स्वाभाविक है और इस प्रसंग की वाचागत गंभीरता बनाए रखता है।
- source_word: אֱלֹהֵיכֶם
  choice: अपने परमेश्वर
  rationale: यद्यपि אֱלֹהִים रूप की दृष्टि से बहुवचन-जैसा है, यहाँ एकवचन सम्बन्धवाचक सर्वनाम और प्रसंग स्पष्ट रूप से इस्राएल के एक परमेश्वर की ओर संकेत करते हैं।
- source_word: מוֹשִׁיעַ
  choice: बचाता है
  rationale: हिफ़ील कृदन्त परमेश्वर के निरन्तर या चरित्रगत उद्धारकारी कार्य को व्यक्त करता है; ‘बचाता है’ सामान्य पाठक के लिए सहज है।
- source_word: מִכָּל רָעוֹתֵיכֶם וְצָרֹתֵיכֶם
  choice: तुम्हारी सारी विपत्तियों और मुसीबतों से
  rationale: दोनों संज्ञाएँ झेली गई हानियों, आपदाओं और संकटों को दर्शाती हैं। अलग-अलग हिन्दी शब्द रखकर उनकी युग्मात्मकता और अर्थ-भेद को बचाया गया है।
- source_word: כִּי
  choice: नहीं, बल्कि
  rationale: यहाँ כִּי लोगों की ज़िदभरी माँग को पहले कथन के विपरीत रख सकता है। प्रसंगगत विरोध को मुख्य पाठ में व्यक्त किया गया है, जबकि अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: תָּשִׂים
  choice: नियुक्त कर
  rationale: שׂוּם का मूल अर्थ रखना या ठहराना है; राजा के विषय में ‘नियुक्त कर’ स्वाभाविक प्रशासनिक हिन्दी है।
- source_word: הִתְיַצְּבוּ
  choice: उपस्थित हो जाओ
  rationale: हित्पएल रूप औपचारिक रूप से सामने आकर खड़े होने का भाव देता है; चयन-प्रक्रिया के प्रसंग में यह हिन्दी अभिव्यक्ति उपयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी लिपि में लिप्यन्तरित किया गया है।
- source_word: לְשִׁבְטֵיכֶם
  choice: अपने-अपने गोत्रों के अनुसार
  rationale: לְ यहाँ समूहों के अनुसार व्यवस्थित होने का संकेत देता है। ‘अपने-अपने’ वितरणात्मक भाव को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וּלְאַלְפֵיכֶם
  choice: अपने-अपने हज़ारों के अनुसार
  rationale: אֶלֶף का सामान्य अर्थ ‘हज़ार’ है, पर इस प्रशासनिक प्रसंग में यह कुल या एक हज़ार की सामाजिक-सैनिक इकाई भी हो सकता है; मुख्य पाठ मूल रूप को पारदर्शी रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘याहवे’ उसका सीधा और व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यन्तरण है; इसे किसी उपाधि से नहीं बदला गया।
- issue: लोगों की माँग में כִּי का बल
  choice: “नहीं, बल्कि हमारे ऊपर एक राजा नियुक्त कर।”
  alternative: “हमारे ऊपर एक राजा नियुक्त कर।” / “कि हमारे ऊपर एक राजा नियुक्त कर।”
  rationale: प्रसंग परमेश्वर के उद्धार और लोगों की माँग के बीच तीखा विरोध दिखाता है। फिर भी כִּי अपने आप में अनिवार्य रूप से ‘नहीं’ नहीं है, इसलिए अधिक शाब्दिक सम्भावना पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य में मूल इब्रानी का आरोप, उद्धार और फिर औपचारिक रूप से सामने उपस्थित होने का क्रम बनाए रखा गया है। ‘परन्तु’, ‘गोत्र’ और ‘याहवे’ बाइबलीय प्रसंग की गरिमा रखते हैं, जबकि ‘ठुकरा दिया’, ‘बचाता है’ और ‘मुसीबतों’ से भाषा अनावश्यक रूप से पुरातन नहीं बनती।
