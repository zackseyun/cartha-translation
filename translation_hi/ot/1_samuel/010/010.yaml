  text: וַ/יָּבֹ֤אוּ שָׁם֙ הַ/גִּבְעָ֔תָ/ה וְ/הִנֵּ֥ה חֶֽבֶל נְבִאִ֖ים לִ/קְרָאת֑/וֹ וַ/תִּצְלַ֤ח עָלָי/ו֙ ר֣וּחַ אֱלֹהִ֔ים וַ/יִּתְנַבֵּ֖א בְּ/תוֹכָֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/010.yaml
  text: When they came there to the hill[a], behold, a band of prophets came to meet him, and the Spirit of God rushed upon him, and he prophesied among them.
translation:
  language: hi
  text: जब वे वहाँ उस पहाड़ी[a] पर आए, तो देखो, भविष्यद्वक्ताओं का एक दल उससे मिलने आ रहा था। परमेश्वर का आत्मा बलपूर्वक उस पर आ उतरा, और वह उनके बीच भविष्यवाणी करने लगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “गिबा।” इब्रानी रूप को स्थान-नाम “गिबा” अथवा “पहाड़ी” दोनों तरह समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַגִּבְעָתָה
  choice: उस पहाड़ी पर
  rationale: दिशासूचक प्रत्यय के साथ यह रूप सामान्य संज्ञा ‘पहाड़ी’ या स्थान-नाम ‘गिबा’ दोनों समझा जा सकता है। मुख्य पाठ में सामान्य अर्थ रखा गया है और विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: חֶבֶל נְבִאִים
  choice: भविष्यद्वक्ताओं का एक दल
  rationale: यहाँ חֶבֶל रस्सी नहीं, बल्कि संगठित समूह या दल को सूचित करता है; ‘दल’ सहज और संक्षिप्त हिन्दी है।
- source_word: לִקְרָאתוֹ
  choice: उससे मिलने आया
  rationale: यह अभिव्यक्ति उसकी ओर आने और उससे मिलने का उद्देश्य बताती है।
- source_word: רוּחַ אֱלֹהִים
  choice: परमेश्वर का आत्मा
  rationale: प्रसंग में यह परमेश्वर द्वारा शाऊल को दी गई सामर्थ्य का द्योतक है; हिन्दी बाइबलीय प्रयोग के अनुरूप निश्चित दिव्य संदर्भ रखा गया है।
- source_word: וַתִּצְלַח עָלָיו
  choice: उस पर सामर्थ्य के साथ उतरा
  rationale: צלח और רוּחַ का मेल अचानक तथा प्रभावशाली रूप से छा जाने या आने का भाव देता है। यह हिन्दी वाक्य उस बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיִּתְנַבֵּא
  choice: भविष्यवाणी करने लगा
  rationale: हित्पअेल रूप यहाँ भविष्यद्वक्ताओं जैसी गतिविधि में सम्मिलित होने को दर्शाता है; ‘करने लगा’ घटनाक्रम में आरम्भ का स्वाभाविक भाव देता है, बिना गतिविधि का प्रकार अधिक स्पष्ट किए।
- source_word: בְּתוֹכָם
  choice: उनके बीच
  rationale: यह शाऊल के उस भविष्यद्वक्ता-दल के मध्य सहभागी होने को स्पष्ट रूप से व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह अचानक सामने आए दृश्य की ओर ध्यान खींचता है; ‘तो देखो’ आधुनिक हिन्दी में इसका कथात्मक बल बनाए रखता है।
theological_decisions:
- issue: רוּחַ אֱלֹהִים का अर्थ
  choice: परमेश्वर का आत्मा
  alternative: परमेश्वर की ओर से एक आत्मा
  rationale: शाऊल को दिए गए चिन्ह और दिव्य सामर्थ्य के इस प्रसंग में वाक्यांश का सबसे स्वाभाविक संदर्भ परमेश्वर का अपना आत्मा है। फिर भी अनुवाद इसमें बाद की धर्मशास्त्रीय परिभाषाएँ नहीं जोड़ता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘भविष्यद्वक्ता’ तथा ‘परमेश्वर का आत्मा’ जैसे परिचित बाइबलीय पद रखे गए हैं; जहाँ इब्रानी में वास्तविक स्थानगत अस्पष्टता है, उसे पाद-टिप्पणी में सुरक्षित रखा गया है।
