source:
  edition: WLC
  text: וַ/יִּקַּ֨ח שְׁמוּאֵ֜ל אֶת פַּ֥ךְ הַ/שֶּׁ֛מֶן וַ/יִּצֹ֥ק עַל רֹאשׁ֖/וֹ וַ/יִּשָּׁקֵ֑/הוּ וַ/יֹּ֕אמֶר הֲ/ל֗וֹא כִּֽי מְשָׁחֲ/ךָ֧ יְהוָ֛ה עַל נַחֲלָת֖/וֹ לְ/נָגִֽיד־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/001.yaml
  text: Then Samuel took the flask of oil and poured it on his head and kissed him[a], and said, “Has not Yahweh anointed you as ruler over his inheritance?”
translation:
  language: hi
  text: तब शमूएल ने तेल की कुप्पी ली, उसे शाऊल के सिर पर उँडेला और उसे चूमा। फिर उसने कहा, “क्या यहोवा ने तुम्हें अपनी विरासत पर शासक[a] के रूप में अभिषिक्त नहीं किया है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अगुवा” अथवा “प्रधान।” इब्रानी शब्द ऐसे व्यक्ति को दर्शाता है जिसे शासन के लिए नियुक्त किया गया हो; उसकी अर्थछाया बाद में प्रयुक्त औपचारिक उपाधि “राजा” के ठीक समान नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פַּךְ הַשֶּׁמֶן
  choice: तेल की कुप्पी
  rationale: פַּךְ तेल रखने का छोटा पात्र है। ‘कुप्पी’ ठोस चित्र को बनाए रखती है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיִּצֹק עַל רֹאשׁוֹ
  choice: उसे शाऊल के सिर पर उँडेला
  rationale: יצק का मूल अर्थ ‘उँडेलना’ है। हिन्दी में स्पष्टता के लिए तेल को ‘उसे’ और प्रसंगगत पुरुष को ‘शाऊल’ कहा गया है।
- source_word: וַיִּשָּׁקֵהוּ
  choice: उसे चूमा
  rationale: נשׁק यहाँ सीधे तौर पर चूमने की क्रिया बताता है; अभिषेक के प्रसंग में इस संकेत को ज्यों का त्यों रखा गया है।
- source_word: הֲלוֹא כִּי
  choice: क्या ... नहीं किया है?
  rationale: यह रचना उत्तर की अपेक्षा रखने वाली आलंकारिक प्रश्नवाचक पुष्टि है। हिन्दी प्रश्नवाचक रूप उसके बल को स्वाभाविक ढंग से सुरक्षित रखता है।
- source_word: מְשָׁחֲךָ
  choice: तुम्हारा अभिषेक
  rationale: משׁח राजकीय नियुक्ति से जुड़ी अभिषेक-विधि का मानक शब्द है; ‘अभिषेक’ धार्मिक और राजनीतिक दोनों अर्थों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; हिन्दी में उसका प्रचलित लिप्यंतरण ‘यहोवा’ रखा गया है, न कि उसके स्थान पर कोई उपाधि।
- source_word: נַחֲלָתוֹ
  choice: अपनी विरासत
  rationale: נַחֲלָה विरासत अथवा आवंटित निज भाग को दर्शाता है। ‘अपनी विरासत’ इस वाचागत भाव को बनाए रखता है कि इस्राएल यहोवा का है।
- source_word: לְנָגִיד
  choice: शासक
  rationale: נָגִיד नियुक्त अगुवे या शासन करने वाले व्यक्ति को दर्शाता है, पर इसका अर्थ बाद की औपचारिक उपाधि ‘राजा’ के ठीक समान नहीं है। ‘शासक’ शासन-संबंधी बल को स्पष्ट रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: पद में उपाधि नहीं, चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है; इसलिए हिन्दी में नाम का प्रचलित रूप रखा गया है।
- issue: राजकीय नियुक्ति के प्रसंग में נָגִיד
  choice: शासक
  alternative: अगुवा या प्रधान
  rationale: शाऊल की सार्वजनिक राजस्थापना से पहले की इस नियुक्ति में शब्द शासन का अधिकार बताता है, किंतु उसे स्पष्ट उपाधि ‘राजा’ में बदलना मूल की शब्दगत भिन्नता मिटा देता।
- issue: נַחֲלָתוֹ में संबंधसूचक भाव
  choice: अपनी विरासत
  alternative: अपने निज भाग
  rationale: सर्वनाम यहोवा की ओर संकेत करता है और इस्राएल के उसके अधिकार में होने का वाचागत भाव व्यक्त करता है; ‘विरासत’ मूल रूपक को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। शाऊल का नाम स्पष्टता के लिए जोड़ा गया है, क्योंकि इब्रानी में सर्वनाम का संदर्भ तत्कालीन प्रसंग से स्पष्ट है। आलंकारिक प्रश्न को कथन में बदलने के बजाय प्रश्न के रूप में सुरक्षित रखा गया है।
