lexical_decisions:
- source_word: וַיְכַל
  choice: जब उसने … समाप्त किया
  rationale: यह क्रिया पिछली गतिविधि के पूरा होने को बताती है। समयसूचक उपवाक्य स्वाभाविक हिन्दी में दोनों घटनाओं का क्रम स्पष्ट रखता है।
- source_word: מֵהִתְנַבּוֹת
  choice: भविष्यवाणी करना
  rationale: यहाँ नבא की क्रिया भविष्यवाणी करने की गतिविधि को व्यक्त करती है; चयन मूल अर्थ को सीधे और सहज रूप में रखता है।
- source_word: וַיָּבֹא
  choice: वह … आया
  rationale: בוא का अर्थ सन्दर्भ के अनुसार आना, जाना या पहुँच जाना हो सकता है। ‘आया’ सामान्य कथात्मक अर्थ को सुरक्षित रखता है और दृष्टिकोण को आवश्यकता से अधिक निश्चित नहीं करता।
- source_word: הַבָּמָה
  choice: ऊँचा स्थान
  rationale: במה प्रायः किसी ऊँचे पूजा-स्थल को सूचित करता है। ‘ऊँचा स्थान’ इब्रानी पद के पारंपरिक और पारदर्शी अर्थ को मुख्य पाठ में बनाए रखता है; पूजा-संबंधी आशय पादटिप्पणी में स्पष्ट किया गया है।
theological_decisions:
- issue: הַבָּמָה का पूजा-संबंधी आशय
  choice: ऊँचा स्थान
  alternative: पहाड़ी पूजा-स्थल; ऊँचा पूजा-स्थल
  rationale: यह पद पूजा के स्थान को सूचित करता है, पर यह वचन उस स्थान की धार्मिक वैधता पर कोई निर्णय नहीं देता। इसलिए मुख्य पाठ अधिक व्याख्यात्मक शब्दावली अपनाए बिना मूल की अर्थगत गुंजाइश और धार्मिक तनाव बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘भविष्यवाणी करना समाप्त किया’ पूर्ण हुई गतिविधि को स्पष्ट करता है, जबकि ‘ऊँचा स्थान’ मूल पद को व्याख्या से दबाए बिना सुरक्षित रखता है। पादटिप्पणी-चिह्न संबंधित पद के बाद रखा गया है।
