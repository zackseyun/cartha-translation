base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/010/012.yaml
  text: 'Then a man from there answered and said[a], “And who is their father?” Therefore it became a proverb: “Is Saul also among the prophets?”'
translation:
  language: hi
  text: 'तब वहाँ से एक आदमी ने उत्तर में कहा, “और उनका पिता कौन है?”[a] इसी कारण यह कहावत बन गई: “क्या शाऊल भी नबियों में है?”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और उसका पिता कौन है?” कुछ अनुवाद इस प्रश्न को विशेष रूप से शाऊल से जोड़ते हैं, पर मसोरेटिक पाठ में “उनका पिता” है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: यह क्रिया कथात्मक प्रसंग में किसी बात के प्रत्युत्तर को प्रकट करती है; ‘उत्तर दिया’ स्वाभाविक और अर्थ-सटीक है।
- source_word: אִישׁ מִשָּׁם
  choice: वहाँ के एक आदमी
  rationale: यह पदबंध उस स्थान के एक अनाम पुरुष की पहचान कराता है; हिन्दी में ‘वहाँ के एक आदमी’ सहज है।
- source_word: וּמִי אֲבִיהֶם
  choice: और उनका पिता कौन है?
  rationale: मसोरेटिक पाठ में प्रत्यय बहुवचन है—‘उनका’; इसे मुख्य पाठ में बनाए रखने से नबियों के समूह की ओर संकेत करने वाली मूल अस्पष्टता और तर्क सुरक्षित रहता है।
- source_word: עַל כֵּן
  choice: इसी कारण
  rationale: यह पदबंध पिछली घटना से निकलने वाले परिणाम का परिचय देता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הָיְתָה לְמָשָׁל
  choice: यह कहावत बन गई
  rationale: מָשָׁל यहाँ विस्तृत दृष्टान्त नहीं, प्रचलित लोकोक्ति या कहावत है; यह अनुवाद उस अर्थ को स्पष्ट रखता है।
- source_word: הֲגַם
  choice: क्या ... भी
  rationale: प्रश्नवाचक रूप के साथ גַּם आश्चर्यपूर्ण समावेश व्यक्त करता है; ‘क्या शाऊल भी...’ उसी आलंकारिक बल को बनाए रखता है।
- source_word: בַּנְּבִאִים
  choice: नबियों में
  rationale: यहाँ בְּ समूह में सम्मिलित होने का भाव देता है; ‘नबियों में’ संक्षिप्त और सटीक है।
theological_decisions:
- issue: ‘उनका पिता’ में सर्वनाम का संदर्भ
  choice: मसोरेटिक पाठ के बहुवचन ‘उनका पिता’ को मुख्य पाठ में रखा गया है, जो नबियों के समूह की ओर संकेत कर सकता है और यह भाव देता है कि नबूवत किसी खास वंश से निर्धारित नहीं होती।
  alternative: ‘उसका पिता’, प्रश्न को केवल शाऊल पर केंद्रित मानते हुए।
  rationale: हिब्रू रूप बहुवचन प्रत्यय का समर्थन करता है। एकवचन पाठ अनुवाद-परंपरा में मिलता है, इसलिए उसे मुख्य पाठ में अपनाने के बजाय पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘नबी’ और ‘कहावत’ सामान्य हिन्दी पाठक के लिए परिचित शब्द हैं। मूल हिब्रू के बहुवचन सर्वनाम को मुख्य पाठ में रखते हुए वैकल्पिक एकवचन पाठ पादटिप्पणी में दिया गया है।
