base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/003.yaml
  text: But David’s men said to him[a], “Look, we are afraid here in Judah; how much more, then, if we go to Keilah against the battle lines of the Philistines?”
translation:
  language: hi
  text: पर दाऊद के लोगों ने उससे कहा, “देखिए, हम यहाँ यहूदा में डरे हुए हैं; फिर पलिश्तियों की युद्ध-पंक्तियों के विरुद्ध क़ईला जाने पर हम और भी अधिक डरेंगे!”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तो पलिश्तियों की युद्ध-पंक्तियों के विरुद्ध क़ईला जाने की बात तो और भी अधिक है।” इब्रानी मुहावरा अल्प से अधिक की ओर तर्क व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: पर ... ने कहा
  rationale: वाव-क्रम कथा को आगे बढ़ाता है, जबकि प्रसंग में लोगों की हिचकिचाहट पिछली आज्ञा के विपरीत प्रतिक्रिया है; इसलिए स्वाभाविक हिन्दी में ‘पर’ उपयुक्त है।
- source_word: אַנְשֵׁי דָוִד
  choice: दाऊद के लोग
  rationale: यह रचना दाऊद से जुड़े पुरुषों/अनुयायियों के समूह को दर्शाती है; ‘दाऊद के लोग’ सहज और स्पष्ट हिन्दी है।
- source_word: הִנֵּה
  choice: देखिए
  rationale: यह ध्यान खींचने और बात पर बल देने वाला उद्गार है। संबोधन में आदरयुक्त बहुवचन आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֲנַחְנוּ פֹה בִּיהוּדָה יְרֵאִים
  choice: हम यहाँ यहूदा में ही डरे हुए हैं
  rationale: '‘ही’ छोटे से बड़े खतरे की ओर बढ़ते तर्क को उभारता है: वे अपेक्षाकृत सुरक्षित यहूदा में भी भयभीत हैं।'
- source_word: וְאַף כִּי
  choice: फिर यदि ... तो हमारा क्या होगा
  rationale: इब्रानी मुहावरा छोटे से बड़े की ओर तर्क व्यक्त करता है। यह हिन्दी रूप उस आशय को स्वाभाविक ढंग से स्पष्ट करता है, जबकि पादटिप्पणी अधिक निकट वैकल्पिक अभिव्यक्ति देती है।
- source_word: נֵלֵךְ קְעִלָה
  choice: हम ... क़ईला जाएँ
  rationale: स्थानवाचक नाम के साथ क्रिया गंतव्य की ओर जाने को व्यक्त करती है।
- source_word: אֶל מַעַרְכוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की युद्ध-पंक्तियों का सामना करने के लिए
  rationale: מַעַרְכוֹת सैनिक पंक्तियों अथवा युद्ध-व्यूह को दर्शाता है; אֶל प्रसंग में उनकी ओर जाकर मुठभेड़ करने का भाव रखता है।
