source:
  edition: WLC
  text: וַ/יְהִ֗י בִּ֠/בְרֹחַ אֶבְיָתָ֧ר בֶּן אֲחִימֶ֛לֶךְ אֶל דָּוִ֖ד קְעִילָ֑ה אֵפ֖וֹד יָרַ֥ד בְּ/יָדֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/006.yaml
  text: When Abiathar son of Ahimelech fled to David at Keilah[a], he came down with an ephod in his hand.
translation:
  language: hi
  text: जब अहीमेलेक का पुत्र एब्यातार भागकर कीला में दाऊद के पास आया, तब वह अपने हाथ में एक एपोद लिए नीचे आया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “एक एपोद उसके हाथ में नीचे आया।” यह इब्रानी शब्दक्रम का अधिक शाब्दिक अनुवाद है।
    reason: इब्रानी में ‘एपोद’ को ‘नीचे आया’ का कर्ता समझना संभव है; मुख्य पाठ प्रसंगानुकूल वैकल्पिक समझ प्रस्तुत करता है।
lexical_decisions:
- source_word: וַיְהִי
  choice: जब … तब
  rationale: यहाँ וַיְהִי कथा को आगे बढ़ाता है; अलग से ‘अब’ जोड़ने के बजाय आश्रित और मुख्य उपवाक्य के ‘जब … तब’ संबंध में इसकी भूमिका स्वाभाविक हिन्दी में व्यक्त की गई है।
- source_word: בִּבְרֹחַ
  choice: जब … भागकर … आया
  rationale: בְּ के साथ infinitive construct समयगत परिस्थिति बताता है। ‘भागकर … आया’ पलायन और दाऊद की ओर गति, दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: אֶבְיָתָר בֶּן אֲחִימֶלֶךְ
  choice: अहीमेलेक का पुत्र एब्यातार
  rationale: नामों का प्रचलित हिन्दी लिप्यंतरण और पितृनाम-संबंध का सीधा अनुवाद।
- source_word: אֶל דָּוִד קְעִילָה
  choice: कीला में दाऊद के पास
  rationale: पदक्रम संक्षिप्त है, पर प्रसंग में कीला दाऊद का स्थान है और אֶל दाऊद की ओर गति दर्शाता है। हिन्दी में यह विन्यास संबंध को स्पष्ट और स्वाभाविक रखता है।
- source_word: אֵפוֹד
  choice: एपोद
  rationale: यह विशिष्ट याजकीय वस्तु का नाम है; लिप्यंतरण मूल की ऐतिहासिक-धार्मिक विशिष्टता बनाए रखता है और इसे केवल ‘वस्त्र’ कहकर सीमित नहीं करता।
- source_word: יָרַד
  choice: नीचे आया
  rationale: क्रिया का मूल दिशात्मक अर्थ ‘नीचे उतरना/आना’ है। दाऊद के स्थान की ओर आगमन के प्रसंग में ‘नीचे आया’ उपयुक्त है।
- source_word: בְּיָדוֹ
  choice: अपने हाथ में … लिए
  rationale: शाब्दिक चित्र ‘उसके हाथ में’ को स्वाभाविक हिन्दी में रखा गया है और वस्तु साथ लाने का भाव स्पष्ट होता है।
theological_decisions:
- issue: इस प्रसंग में אֵפוֹד का स्वरूप
  choice: ‘एपोद’ को बिना अतिरिक्त व्याख्या के विशिष्ट याजकीय वस्तु के नाम के रूप में रखा गया है।
  alternative: ‘याजकीय वस्त्र’ या ‘पवित्र अंगरखा’
  rationale: आसपास का वृत्तांत इसके याजकीय और दैवी मार्गदर्शन से जुड़े उपयोग की ओर संकेत करता है, पर यह पद इसके स्वरूप को अधिक स्पष्ट नहीं करता। लिप्यंतरण अनावश्यक धार्मिक विशिष्टीकरण से बचता है।
- issue: יָרַד का कर्ता
  choice: मुख्य पाठ में एब्यातार को कर्ता मानकर ‘वह … नीचे आया’ रखा गया है।
  alternative: ‘उसके हाथ में एक एपोद नीचे आया’
  rationale: वाक्य-संदर्भ में एब्यातार का नीचे आना सहज अर्थ देता है, किंतु इब्रानी शब्दक्रम में ‘एपोद’ क्रिया के ठीक पहले है और उसे व्याकरणिक कर्ता समझना संभव है। इस वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘एपोद’ जैसे विशिष्ट सांस्कृतिक-धार्मिक शब्द को लिप्यंतरित रखा गया है। पादटिप्पणी-चिह्न [a] मुख्य पाठ में स्पष्ट रूप से उपस्थित है।
