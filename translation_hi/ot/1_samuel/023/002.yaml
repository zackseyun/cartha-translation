base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/002.yaml
  text: So David inquired of Yahweh[a], saying, “Shall I go and strike these Philistines?” And Yahweh said to David, “Go and strike the Philistines, and save Keilah.”
translation:
  language: hi
  text: तब दाऊद ने यहवे से पूछा, “क्या मैं जाकर इन पलिश्तियों पर आक्रमण करूँ?” यहवे ने दाऊद से कहा, “जा, पलिश्तियों पर आक्रमण कर और क़ईला को बचा ले।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: यहवे से पूछकर मार्गदर्शन चाहा
  rationale: שׁאל के साथ בַּיהוָה केवल सामान्य प्रश्न पूछना नहीं, बल्कि परमेश्वर से दिशा जानना व्यक्त करता है। यह वाक्यांश उस परामर्शात्मक अर्थ को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम है; उसका लिप्यंतरण ‘यहवे’ इस नाम को सामान्य उपाधि में बदलने से बचाता है।
- source_word: הַאֵלֵךְ
  choice: क्या मैं जाकर ... करूँ?
  rationale: प्रश्नवाचक चिह्न और अपूर्ण क्रिया विचार-विमर्श वाला प्रश्न व्यक्त करते हैं; हिन्दी में ‘क्या मैं ... करूँ?’ स्वाभाविक और सटीक है।
- source_word: וְהִכֵּיתִי / וְהִכִּיתָ
  choice: पर आक्रमण करूँ / पर आक्रमण कर
  rationale: נכה का यहाँ सैनिक संदर्भ है। ‘आक्रमण करना’ हिंसक सैन्य कार्रवाई बताता है, पर ‘हरा देना’ की तरह परिणाम को पहले से निश्चित नहीं करता; प्रश्न और उत्तर में क्रिया की पुनरावृत्ति भी बनी रहती है।
- source_word: בַּפְּלִשְׁתִּים הָאֵלֶּה
  choice: इन पलिश्तियों पर
  rationale: निर्देशक הָאֵלֶּה को ‘इन’ द्वारा सुरक्षित रखा गया है और בְּ को सैन्य क्रिया के अनुरूप ‘पर’ से व्यक्त किया गया है।
- source_word: וְהוֹשַׁעְתָּ
  choice: बचा ले
  rationale: हिफ़ील रूप का अर्थ यहाँ शत्रु से छुड़ाना या बचाना है। ‘बचा ले’ सैन्य संकट में नगर के उद्धार को सहज हिन्दी में व्यक्त करता है।
- source_word: קְעִילָה
  choice: क़ईला
  rationale: इब्रानी स्थान-नाम का निकट देवनागरी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा / प्रभु
  rationale: मूल में विशिष्ट व्यक्तिगत नाम है। ‘यहवे’ उसे नाम के रूप में बनाए रखता है; ‘प्रभु’ उसे उपाधि बना देता, जबकि ‘यहोवा’ एक पारंपरिक वैकल्पिक स्वरूप है।
- issue: וְהוֹשַׁעְתָּ में उद्धार का स्वरूप
  choice: क़ईला को बचा ले
  alternative: क़ईला का उद्धार कर
  rationale: संदर्भ पलिश्तियों के सैन्य खतरे से नगर को छुड़ाने का है। ‘बचा ले’ आध्यात्मिक उद्धार का अनावश्यक विशिष्ट अर्थ आरोपित किए बिना प्रसंगगत अर्थ देता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संवाद सीधा रखा गया है और मूल की प्रश्न–उत्तर संरचना तथा दोहराई गई सैन्य क्रिया सुरक्षित रखी गई है।
