language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּכְרְת֧וּ שְׁנֵי/הֶ֛ם בְּרִ֖ית לִ/פְנֵ֣י יְהוָ֑ה וַ/יֵּ֤שֶׁב דָּוִד֙ בַּ/חֹ֔רְשָׁה וִ/יהוֹנָתָ֖ן הָלַ֥ךְ לְ/בֵיתֽ/וֹ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/018.yaml
  text: And the two of them made a covenant before Yahweh[a]. Then David remained in the wooded area[b], and Jonathan went to his house.
translation:
  language: hi
  text: और उन दोनों ने यहोवा के सामने वाचा बाँधी[a]। फिर दाऊद वन-प्रदेश में[b] रहा, और योनातान अपने घर चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “वाचा काटी।”
    reason: lexical_alternative
  - marker: b
    text: या “होरेश में”; इब्रानी को स्थान-नाम अथवा वन या वृक्षाच्छादित क्षेत्र के अर्थ में समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּכְרְתוּ
  choice: बाँधी
  rationale: כרת ברית एक इब्रानी मुहावरा है, जिसका शाब्दिक अर्थ ‘वाचा काटना’ है; स्वाभाविक हिन्दी में ‘वाचा बाँधना’ उसी गंभीर वाचागत कार्य को व्यक्त करता है।
- source_word: שְׁנֵיהֶם
  choice: उन दोनों
  rationale: यह द्विवचन का स्पष्ट भाव रखता है और दाऊद तथा योनातान की संयुक्त सहभागिता दिखाता है।
- source_word: בְּרִית
  choice: वाचा
  rationale: ‘वाचा’ सम्बन्धपरक, गंभीर और धर्मग्रन्थीय आशय को बनाए रखती है; ‘समझौता’ अपेक्षाकृत कमजोर और ‘संधि’ अधिक राजनीतिक होती।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह पदबंध की उपस्थिति और गंभीरता को संक्षिप्त, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: सन्दर्भ में क्रिया का अर्थ किसी स्थान पर ठहरे रहने से है, न कि केवल बैठने से।
- source_word: בַּחֹרְשָׁה
  choice: वन-प्रदेश में
  rationale: חֹרֶשׁ वन, झाड़ीदार भूभाग या वृक्षाच्छादित क्षेत्र का बोध करा सकता है। ‘वन-प्रदेश’ इस सामान्य संज्ञा-समझ को स्वाभाविक हिन्दी में रखता है; स्थान-नाम ‘होरेश’ भी सम्भव है।
- source_word: הָלַךְ לְבֵיתוֹ
  choice: अपने घर चला गया
  rationale: यह इब्रानी के ‘अपने घर गया’ को स्वाभाविक हिन्दी कथन में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिगत नाम सीधे प्रयुक्त है। हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को मुख्य पाठ में रखा गया, बिना उसे केवल उपाधि ‘प्रभु’ से बदलने के।
- issue: בַּחֹרְשָׁה की सामान्य संज्ञा या स्थान-नाम के रूप में व्याख्या
  choice: वन-प्रदेश में
  alternative: होरेश में
  rationale: स्वरांकित रूप को निश्चित उपपद सहित सामान्य संज्ञा माना जा सकता है, जबकि आस-पास का सन्दर्भ स्थान-नाम की सम्भावना भी देता है। मुख्य पाठ एक सम्भव अर्थ रखता है और पादटिप्पणी वास्तविक अस्पष्टता सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वाचा बाँधी’ हिन्दी में स्वाभाविक धर्मग्रन्थीय मुहावरा है। मूल की भौगोलिक अस्पष्टता को मुख्य पाठ में एक पाठनीय विकल्प और पादटिप्पणी में दूसरे विकल्प द्वारा सुरक्षित रखा गया है।
