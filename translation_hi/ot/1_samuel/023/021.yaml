  text: וַ/יֹּ֣אמֶר שָׁא֔וּל בְּרוּכִ֥ים אַתֶּ֖ם לַֽ/יהוָ֑ה כִּ֥י חֲמַלְתֶּ֖ם עָלָֽ/י׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/021.yaml
  text: Saul said[a], “May you be blessed by Yahweh[b], because you have had compassion on me.”
translation:
  language: hi
  text: शाऊल ने कहा, “याहवे तुम्हें आशीष दे, क्योंकि तुमने मुझ पर दया की है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: हिब्रू गद्य के सामान्य कथात्मक रूप को स्वाभाविक हिन्दी में व्यक्त करता है; आरम्भिक संयोजक का अलग अनुवाद आवश्यक नहीं।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: בְּרוּכִים אַתֶּם
  choice: तुम्हें आशीष दे
  rationale: विधेय विशेषण और सर्वनाम यहाँ आशीर्वचन का कार्य करते हैं; हिन्दी में यह कामनात्मक प्रयोग स्वाभाविक और गरिमापूर्ण है।
- source_word: לַיהוָה
  choice: याहवे
  rationale: ल संबंध अथवा स्रोत सूचित करता है; हिन्दी आशीर्वचन में ‘याहवे तुम्हें आशीष दे’ वही आशय सहजता से व्यक्त करता है और परमेश्वर के निज नाम को सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: शाऊल के आशीर्वचन का कारण प्रस्तुत करने वाले स्पष्ट कारणवाचक संबंध को व्यक्त करता है।
- source_word: חֲמַלְתֶּם
  choice: दया की है
  rationale: חמל का मूल भाव दया या करुणा करना है; कुछ प्रसंगों में इससे छोड़ देने का अर्थ निकलता है, पर यहाँ ‘मुझ पर’ के साथ भावात्मक-संबंधपरक अर्थ अधिक उपयुक्त है।
- source_word: עָלָי
  choice: मुझ पर
  rationale: חמל के साथ על की हिन्दी में स्वाभाविक संगति ‘किसी पर दया करना’ है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला परमेश्वर का निज नाम सीधे आया है; ‘याहवे’ उसे पदवी में बदले बिना प्रस्तुत करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण कथात्मक शैली। ‘दया की है’ सामान्य पाठक के लिए स्वाभाविक है और मूल क्रिया के करुणा-संबंधी अर्थ को बनाए रखता है।
