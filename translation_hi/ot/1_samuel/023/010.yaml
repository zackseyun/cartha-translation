  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל שָׁמֹ֤עַ שָׁמַע֙ עַבְדְּ/ךָ֔ כִּֽי מְבַקֵּ֥שׁ שָׁא֖וּל לָ/ב֣וֹא אֶל קְעִילָ֑ה לְ/שַׁחֵ֥ת לָ/עִ֖יר בַּ/עֲבוּרִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/010.yaml
  text: Then David said[a], “O Yahweh, God of Israel, your servant has surely heard that Saul is seeking to come to Keilah to destroy the city because of me.”
translation:
  language: hi
  text: तब दाऊद ने कहा, “हे यहोवा[a], इस्राएल के परमेश्वर, आपके दास ने निश्चय ही सुना है कि शाऊल मेरे कारण इस नगर को नष्ट करने के लिए क़ईला आने की कोशिश कर रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: YHWH; परंपरागत रूप से इसका अनुवाद “प्रभु” किया जाता है।'
    reason: ईश्वरीय नाम के पारंपरिक वैकल्पिक निरूपण की जानकारी।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ में आए परमेश्वर के व्यक्तिगत नाम चतुरक्षर को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर
  rationale: यह संबंधवाचक रचना का सीधा और स्वाभाविक हिन्दी अनुवाद है।
- source_word: שָׁמֹעַ שָׁמַע
  choice: निश्चय सुना है
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का संयोजन सुनने की बात पर बल देता है; ‘निश्चय’ उस बल को संक्षिप्त और स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עַבְדְּךָ
  choice: आपके दास
  rationale: परमेश्वर से विनीत निवेदन में यह दाऊद का आत्म-संबोधन है; ‘दास’ मूल अर्थ और प्रार्थनापूर्ण गरिमा दोनों को सुरक्षित रखता है।
- source_word: מְבַקֵּשׁ
  choice: कोशिश कर रहा है
  rationale: कृदन्त वर्तमान या जारी प्रयत्न/इरादे को सूचित करता है; यह अनुवाद योजना की निश्चितता को मूल से अधिक प्रबल नहीं बनाता।
- source_word: לָבוֹא אֶל קְעִילָה
  choice: क़ईला आने
  rationale: בוא के ‘आना/प्रवेश करना’ अर्थ और दाऊद के क़ईला में होने के दृष्टिकोण को बनाए रखा गया है।
- source_word: לְשַׁחֵת לָעִיר
  choice: इस नगर को नष्ट करने के लिए
  rationale: सैन्य प्रसंग में שׁחת का स्पष्ट अर्थ ‘नष्ट करना’ है; निश्चित नगर क़ईला को संदर्भानुसार ‘इस नगर’ कहा गया है।
- source_word: בַּעֲבוּרִי
  choice: मेरे कारण
  rationale: यह पद कारण या किसी के खाते पर होने का भाव देता है; ‘मेरे कारण’ आधुनिक हिन्दी में स्पष्ट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल इब्रानी में व्यक्तिगत वाचा-नाम सीधे आया है। ‘यहोवा’ हिन्दी में उसका परिचित लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी, विनीत प्रार्थनापूर्ण संबोधन और कथात्मक गरिमा। परमेश्वर के लिए आदरसूचक ‘आप’ रखा गया है। ‘क़ईला’ में नुक़्ता उच्चारण का संकेत देता है; पाठ सामान्य पाठकों के लिए सहज रखा गया है।
