translation:
  language: hi
  text: दाऊद ने फिर यहोवा से पूछा। यहोवा ने उसे उत्तर दिया और कहा, “उठ, कीला को नीचे जा, क्योंकि मैं पलिश्तियों को तेरे हाथ में दे रहा हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיּוֹסֶף עוֹד ... לִשְׁאֹל
  choice: ने फिर ... पूछा
  rationale: इब्रानी पुनरावृत्ति-सूचक अभिव्यक्ति का स्वाभाविक हिन्दी रूप; इससे स्पष्ट है कि दाऊद ने दोबारा परामर्श माँगा।
- source_word: בַּיהוָה
  choice: यहोवा से
  rationale: पूर्वसर्ग और दिव्य नाम को स्वाभाविक हिन्दी में व्यक्त किया गया; יהוה के लिए प्रचलित हिन्दी बाइबलीय रूप ‘यहोवा’ रखा गया।
- source_word: קוּם רֵד קְעִילָה
  choice: उठ, कीला को जा
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखा गया। स्थल की ओर जाने के अर्थ में רֵד का शाब्दिक ‘नीचे उतर’ हिन्दी में अनावश्यक रूप से भौगोलिक संकेत दे सकता है, इसलिए ‘जा’ चुना गया।
- source_word: אֲנִי נֹתֵן
  choice: मैं ... कर रहा हूँ
  rationale: इब्रानी कृदंत की वर्तमान/आसन्न क्रियात्मक शक्ति को रखा गया, जो निश्चित ईश्वरीय प्रतिज्ञा व्यक्त करती है।
- source_word: בְּיָדֶךָ
  choice: तेरे हाथ में
  rationale: विजय या अधिकार में सौंपने की इब्रानी उपमा को हिन्दी में सुरक्षित रखा गया।
theological_decisions:
- issue: יהוה के नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के विशिष्ट व्यक्तिगत दिव्य नाम को सामान्य उपाधि में बदलने के बजाय स्पष्ट रूप से दर्शाया गया।
- issue: ‘मैं पलिश्तियों को तेरे हाथ में कर रहा हूँ’ का काल और आशय
  choice: वर्तमान-प्रगतिशील रूप
  alternative: मैं पलिश्तियों को तेरे हाथ में कर दूँगा
  rationale: נֹתֵן कृदंत है; चुना हुआ रूप प्रतिज्ञा की निश्चितता और आरंभिक/आसन्न क्रिया दोनों को बनाए रखता है, बिना इसे केवल साधारण भविष्य में सीमित किए।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। दाऊद के लिए सम्मानसूचक बहुवचन न देकर मूल के एकवचन संबोधन के अनुरूप ‘उसे/तेरे’ प्रयोग किया गया है।
