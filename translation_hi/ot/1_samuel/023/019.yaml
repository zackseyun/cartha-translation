base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/019.yaml
  text: Then the Ziphites went up to Saul at Gibeah[a], saying, “Is not David hiding among us in the strongholds in the wooded area, on the hill of Hachilah[b], which is to the right of the Jeshimon?”
translation:
  language: hi
  text: तब ज़ीफ़ के निवासी गिबा में शाऊल के पास गए और कहने लगे, “क्या दाऊद हमारे बीच जंगल[a] में, हकीला की पहाड़ी पर स्थित गढ़ों में नहीं छिपा हुआ है, जो यशीमोन के दाहिनी ओर[b] है?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “होरेश में,” यदि इब्रानी शब्द को ‘जंगल’ के बजाय स्थान-नाम समझा जाए।
    reason: alternative_reading
  - marker: b
    text: इब्रानी भौगोलिक प्रयोग में “दाहिनी ओर” का अर्थ संभवतः “दक्षिण में” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲלוּ
  choice: गए
  rationale: עלה यात्रा के संदर्भ में ऊपर जाने का भाव रखता है; हिन्दी में गंतव्य के साथ सरल ‘गए’ स्वाभाविक है और अनावश्यक भू-आकृतिक अर्थ नहीं जोड़ता।
- source_word: זִפִים
  choice: जीप के निवासी
  rationale: यह जीप के निवासियों के लिए प्रयुक्त जातिवाचक बहुवचन है; हिन्दी में स्थान-नाम से कृत्रिम जातिनाम बनाने की अपेक्षा यह अधिक स्पष्ट है।
- source_word: הַגִּבְעָתָה
  choice: गिबा में
  rationale: दिशासूचक ה गिबा की ओर गति दिखाता है, पर ‘शाऊल के पास’ के साथ हिन्दी में ‘गिबा में’ शाऊल का स्थान स्वाभाविक ढंग से बताता है।
- source_word: מִסְתַּתֵּר
  choice: छिपा हुआ है
  rationale: हित्पएल कृदंत लगातार स्वयं को छिपाए रखने की अवस्था व्यक्त करता है।
- source_word: עִמָּנוּ
  choice: हमारे ही इलाके में
  rationale: शाब्दिक अर्थ ‘हमारे साथ’ है, पर प्रसंग में जीपियों के क्षेत्र के भीतर होने का अर्थ है; ‘ही’ प्रश्न में निहित अपेक्षित सहमति को सहज बनाता है।
- source_word: בַמְּצָדוֹת
  choice: गढ़ों में
  rationale: מְצָדוֹת सुरक्षित और रक्षा-योग्य शरणस्थलों को दर्शाता है; ‘गढ़’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: בַּחֹרְשָׁה
  choice: जंगल के
  rationale: חֹרֶשׁ को यहाँ सामान्य संज्ञा ‘वनाच्छादित क्षेत्र/जंगल’ माना गया है; इससे ‘गढ़ों’ का स्थान स्पष्ट होता है।
- source_word: בְּגִבְעַת הַחֲכִילָה
  choice: हकीला पहाड़ी पर
  rationale: גִּבְעָה का अर्थ पहाड़ी है और हिन्दी में स्थान-नाम के साथ यह क्रम स्वाभाविक है।
- source_word: אֲשֶׁר מִימִין הַיְשִׁימוֹן
  choice: जो यशीमोन के दाहिनी ओर है
  rationale: यह मूल इब्रानी के दिशासूचक मुहावरे को सीधे रखता है और ‘दक्षिण’ अर्थ को मुख्य पाठ में निश्चित नहीं करता।
