reference: 1 Samuel 23:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד הֲ/יַסְגִּ֜רוּ בַּעֲלֵ֧י קְעִילָ֛ה אֹתִ֥/י וְ/אֶת אֲנָשַׁ֖/י בְּ/יַד שָׁא֑וּל וַ/יֹּ֥אמֶר יְהוָ֖ה יַסְגִּֽירוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/012.yaml
  text: Then David said[a], “Will the men of Keilah hand me and my men over into Saul’s hand?” And Yahweh said[c][b], “They will hand you over.”
translation:
  language: hi
  text: तब दाऊद ने पूछा, “क्या कीला के लोग मुझे और मेरे आदमियों को शाऊल के हाथ में[b] सौंप देंगे[a]?” याहवे ने कहा, “वे तुम्हें[c] सौंप देंगे।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनके हवाले कर देंगे” अथवा “पकड़वा देंगे।”
    reason: lexical_alternative
  - marker: b
    text: “शाऊल के हाथ में” एक इब्रानी मुहावरा है, जिसका अर्थ है “शाऊल के अधिकार या वश में।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी उत्तर में शाब्दिक रूप से “वे तुम्हें सौंप देंगे” है; कर्म एकवचन है। दाऊद को प्रतिनिधि अगुआ मानते हुए उसके आदमी निहित हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲיַסְגִּרוּ / יַסְגִּירוּ
  choice: सौंप देंगे
  rationale: यहाँ סגר के हिफ़ईल रूप का अर्थ किसी को दूसरे के अधिकार में कर देना है। ‘सौंप देना’ सहज आधुनिक हिन्दी है और शत्रु के वश में किए जाने का भाव बनाए रखता है।
- source_word: בַּעֲלֵי קְעִילָה
  choice: कीला के लोग
  rationale: शाब्दिक अर्थ ‘कीला के स्वामी/मालिक’ हो सकता है, पर इस नागरिक प्रसंग में नगर के निवासियों अथवा प्रमुख पुरुषों का संकेत है। ‘कीला के लोग’ स्वाभाविक है और अनावश्यक रूप से केवल अगुओं तक अर्थ सीमित नहीं करता।
- source_word: אֹתִי וְאֶת־אֲנָשַׁי
  choice: मुझे और मेरे आदमियों को
  rationale: ‘मेरे आदमी’ दाऊद के साथियों/अनुयायियों के लिए मूल का निकट और प्रसंगानुकूल रूप है; ‘सैनिक’ कहना उनकी भूमिका को मूल से अधिक निश्चित कर देता।
- source_word: בְּיַד שָׁאוּל
  choice: शाऊल के हाथ में
  rationale: मूल की ‘हाथ में’ छवि सुरक्षित रखी गई है; यह किसी के अधिकार या वश में किए जाने का इब्रानी मुहावरा है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: יַסְגִּירוּ
  choice: वे तुम्हें सौंप देंगे
  rationale: उत्तर में क्रिया प्रश्न को दोहराती है, जबकि कर्म एकवचन है। इसलिए दाऊद को संबोधित एकवचन ‘तुम्हें’ रखा गया है और ‘तुम्हें और तुम्हारे आदमियों को’ जोड़कर मूल की व्याकरणिक विशेषता नहीं मिटाई गई।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: उत्तर में एकवचन कर्म और दाऊद के आदमियों का निहित होना
  choice: वे तुम्हें सौंप देंगे
  alternative: वे तुम्हें और तुम्हारे आदमियों को सौंप देंगे
  rationale: इब्रानी उत्तर में कर्म एकवचन है, यद्यपि प्रश्न में दाऊद और उसके आदमी दोनों हैं। अनुवाद इस तनाव को बनाए रखता है और दाऊद को प्रतिनिधि अगुआ मानकर निहित समूह को मुख्य पाठ में स्पष्ट नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पूछा’ संवाद के प्रश्नात्मक स्वर को स्वाभाविक हिन्दी में व्यक्त करता है। ‘शाऊल के हाथ में’ मूल मुहावरे की छवि बचाता है, और अंतिम उत्तर का एकवचन जानबूझकर सुरक्षित रखा गया है।
