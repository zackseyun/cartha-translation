base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/023.yaml
  text: See and find out from all the hiding places where he hides there, then return to me with certainty, and I will go with you. And if he is in the land, I will search him out among all the clans of Judah.
translation:
  language: hi
  text: देखो और उन सभी छिपने के स्थानों के विषय में ठीक-ठीक पता लगाओ, जहाँ वह छिपा रहता है। फिर निश्चित जानकारी के साथ मेरे पास लौट आओ, और मैं तुम्हारे साथ चलूँगा। यदि वह देश में है, तो मैं यहूदा के सभी कुलों[a] में उसे ढूँढ़ निकालूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा के सभी हज़ारों में”; यहाँ “हज़ारों” से सम्भवतः यहूदा के कुल या वंशगत विभाग अभिप्रेत हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאוּ וּדְעוּ
  choice: देखो और ... पक्का पता लगाओ
  rationale: दोनों बहुवचन आज्ञार्थकों को रखा गया है; संदर्भ में דעו का आशय जाँच करके विश्वसनीय जानकारी प्राप्त करना है।
- source_word: מִכֹּל הַמַּחֲבֹאִים אֲשֶׁר יִתְחַבֵּא שָׁם
  choice: उन सभी छिपने के स्थानों का ... पता लगाओ, जहाँ वह छिपता है
  rationale: מַחֲבֹאִים को स्वाभाविक हिन्दी में ‘छिपने के स्थान’ कहा गया है। मूल के ‘जहाँ ... वहाँ’ जैसे स्थानसूचक दोहराव को हिन्दी की पठनीयता के लिए एक ही सम्बन्धवाचक वाक्य में व्यक्त किया गया है।
- source_word: וְשַׁבְתֶּם אֵלַי אֶל נָכוֹן
  choice: फिर निश्चित जानकारी लेकर मेरे पास लौट आओ
  rationale: आदेशों का क्रम ‘फिर’ से स्पष्ट किया गया है और נָכוֹן की दृढ़ता/निश्चितता को ऐसी प्रमाणित सूचना के रूप में व्यक्त किया गया है जिसके साथ उन्हें लौटना है।
- source_word: וְהָלַכְתִּי אִתְּכֶם
  choice: और मैं तुम्हारे साथ चलूँगा
  rationale: भविष्यसूचक परिणाम-वाक्य का सीधा और स्वाभाविक अनुवाद।
- source_word: וְהָיָה אִם יֶשְׁנוֹ בָאָרֶץ
  choice: यदि वह इस देश में कहीं भी हुआ
  rationale: हिब्रू शर्त को स्वाभाविक हिन्दी में रखा गया है; ‘कहीं भी’ आगे आने वाली व्यापक खोज के भाव को स्पष्ट करता है, बिना शर्त की अनिश्चितता मिटाए।
- source_word: וְחִפַּשְׂתִּי אֹתוֹ
  choice: मैं ... उसे ढूँढ़ निकालूँगा
  rationale: חפשׂ की सावधानीपूर्वक खोज करने की प्रबलता को ‘ढूँढ़ निकालूँगा’ व्यक्त करता है।
- source_word: בְּכֹל אַלְפֵי יְהוּדָה
  choice: यहूदा के सभी कुलों में
  rationale: אַלְפֵי का शाब्दिक अर्थ ‘हज़ारों’ है, पर यहाँ यह यहूदा की सामाजिक अथवा वंशगत इकाइयों के लिए प्रयुक्त जान पड़ता है; शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
