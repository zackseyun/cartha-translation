source:
  edition: WLC
  text: הֲ/יַסְגִּרֻ֣/נִי בַעֲלֵי֩ קְעִילָ֨ה בְ/יָד֜/וֹ הֲ/יֵרֵ֣ד שָׁא֗וּל כַּֽ/אֲשֶׁר֙ שָׁמַ֣ע עַבְדֶּ֔/ךָ יְהוָה֙ אֱלֹהֵ֣י יִשְׂרָאֵ֔ל הַגֶּד נָ֖א לְ/עַבְדֶּ֑/ךָ וַ/יֹּ֥אמֶר יְהוָ֖ה יֵרֵֽד־ס׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/011.yaml
  text: Will the men of Keilah hand me over into his hand? Will Saul come down[a], as your servant has heard? O Yahweh, God of Israel, please tell your servant.” And Yahweh said, “He will come down.”
translation:
  language: hi
  text: “क्या कीला के लोग मुझे उसके हाथ में सौंप देंगे[a]? क्या शाऊल नीचे आएगा, जैसा तेरे दास ने सुना है? हे याहवे, इस्राएल के परमेश्वर, कृपा करके अपने दास को बता।” तब याहवे ने कहा, “वह नीचे आएगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उसके हाथ में’; यहाँ ‘हाथ’ का अर्थ शाऊल का अधिकार या वश है।
    reason: इब्रानी अधिकार-सूचक मुहावरे को स्पष्ट करना।
lexical_decisions:
- source_word: יַסְגִּרֻנִי
  choice: मुझे ... सौंप देंगे
  rationale: हिफ़ईल रूप यहाँ किसी व्यक्ति को दूसरे के अधिकार में कर देने का अर्थ देता है। ‘सौंप देंगे’ आधुनिक हिन्दी में स्वाभाविक है और शत्रुतापूर्ण हस्तांतरण का भाव बनाए रखता है।
- source_word: בַעֲלֵי קְעִילָה
  choice: कीला के लोग
  rationale: בַעֲלֵי का मूल अर्थ ‘स्वामी/प्रमुख’ हो सकता है, पर इस नगर-संदर्भ में यह कीला के नागरिकों अथवा प्रभावशाली पुरुषों को सामूहिक रूप से सूचित करता है। ‘कीला के लोग’ अनावश्यक रूप से नेतृत्व तक अर्थ को सीमित नहीं करता।
- source_word: בְיָדוֹ
  choice: उसके हाथ में
  rationale: इब्रानी मुहावरे में ‘हाथ’ अधिकार या वश को दर्शाता है। शाब्दिक बिंब हिन्दी में भी समझ में आता है; सर्वनाम का संकेत शाऊल की ओर है।
- source_word: יֵרֵד
  choice: नीचे आएगा
  rationale: यरद का अर्थ उतरना/नीचे जाना है। दाऊद के दृष्टिकोण से शाऊल का कीला की ओर आना पूछा जा रहा है, इसलिए ‘नीचे आएगा’ स्वाभाविक है और प्रश्न तथा उत्तर में एकरूप रखा गया है।
- source_word: כַּאֲשֶׁר שָׁמַע עַבְדֶּךָ
  choice: जैसा तेरे दास ने सुना है
  rationale: यह दाऊद को मिली सूचना की ओर संकेत करता है और मूल की तुलना-सूचक रचना को संक्षेप में सुरक्षित रखता है।
- source_word: עַבְדְּךָ
  choice: तेरे दास / अपने दास
  rationale: प्रार्थना में यह परमेश्वर के सामने विनम्र आत्म-संबोधन है। प्रत्यक्ष संबोधन में ‘तेरे दास’ और आज्ञार्थक वाक्य में हिन्दी की स्वाभाविक संरचना के अनुसार ‘अपने दास’ प्रयुक्त है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित निकट लिप्यंतरण ‘याहवे’ के रूप में रखा गया है।
- source_word: הַגֶּד נָא
  choice: कृपा करके ... बता
  rationale: आज्ञार्थक क्रिया के साथ נָא विनम्र किंतु आग्रहपूर्ण निवेदन व्यक्त करता है; ‘कृपा करके ... बता’ आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: וַיֹּאמֶר יְהוָה
  choice: तब याहवे ने कहा
  rationale: वाव-युक्त कथात्मक क्रिया दिव्य उत्तर को आगे बढ़ाती है। हिन्दी कथानक में ‘तब’ उत्तर का क्रम स्वाभाविक रूप से स्पष्ट करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना हिन्दी लिपि में प्रस्तुत करता है।
- issue: शाऊल के आने के विषय में परमेश्वर का कथन
  choice: वह नीचे आएगा
  alternative: वह अवश्य नीचे आएगा
  rationale: मूल उत्तर केवल יֵרֵד कहता है। ‘अवश्य’ जोड़ने से निश्चितता पर अतिरिक्त बल पड़ता, इसलिए संक्षिप्त कथन को यथावत रखा गया है; आगे की कथा से उत्पन्न शर्तात्मकता के प्रश्न को यहाँ चुपचाप हल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनात्मक गरिमा और कथात्मक सहजता के साथ रखी गई है। परमेश्वर के लिए एकवचन आत्मीय-सम्मानसूचक ‘तू’ के रूप (‘तेरे’, ‘बता’) मूल के एकवचन संबोधन और पारंपरिक प्रार्थना-रजिस्टर को दर्शाते हैं। प्रश्नों का क्रम और दिव्य उत्तर की संक्षिप्तता मूल के अनुसार सुरक्षित है।
