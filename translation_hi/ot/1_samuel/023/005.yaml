reference: 1 Samuel 23:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֵּ֣לֶךְ דָּוִד֩ ו/אנש/ו קְעִילָ֜ה וַ/יִּלָּ֣חֶם בַּ/פְּלִשְׁתִּ֗ים וַ/יִּנְהַג֙ אֶת מִקְנֵי/הֶ֔ם וַ/יַּ֥ךְ בָּ/הֶ֖ם מַכָּ֣ה גְדוֹלָ֑ה וַ/יֹּ֣שַׁע דָּוִ֔ד אֵ֖ת יֹשְׁבֵ֥י קְעִילָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/005.yaml
  text: So David and his men went to Keilah and fought against the Philistines[a], and he drove off their livestock and struck them with a great blow[c][b]. So David saved the inhabitants of Keilah.
translation:
  language: hi
  text: तब दाऊद अपने आदमियों के साथ कीला गया और पलिश्तियों से लड़ा। उसने उनके पशुधन को हाँककर ले गया[a] और उन्हें करारी हार दी[b]। इस प्रकार दाऊद ने कीला के निवासियों को बचाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उनके मवेशियों को हाँककर ले गया’; इब्रानी शब्द में सभी प्रकार का पशुधन सम्मिलित हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उन पर बड़ी मार लगाई’; इसका अर्थ ‘उन्हें बुरी तरह पराजित किया’ या ‘उनका बड़ा संहार किया’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘छुड़ाया’ अथवा ‘उद्धार किया’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד וַאֲנָשָׁיו קְעִילָה
  choice: दाऊद अपने आदमियों के साथ कईला गया
  rationale: הלך का सामान्य कथात्मक अर्थ ‘गया’ है। אֲנָשָׁיו सैन्य प्रसंग में दाऊद के साथ के योद्धाओं को दर्शाता है, इसलिए ‘अपने आदमियों’ स्वाभाविक है। קְעִילָה को उसके इब्रानी उच्चारण के निकट ‘कईला’ लिखा गया है।
- source_word: וַיִּלָּחֶם בַּפְּלִשְׁתִּים
  choice: पलिश्तियों से लड़ा
  rationale: לחם के साथ ב यहाँ विरोधियों के विरुद्ध युद्ध करने का बोध देता है; हिन्दी में ‘से लड़ा’ स्पष्ट और स्वाभाविक है।
- source_word: וַיִּנְהַג אֶת־מִקְנֵיהֶם
  choice: उसने उनके पशुधन को हाँककर ले लिया
  rationale: נהג पशुओं को हाँकने का संकेत देता है और מִקְנֶה केवल गाय-बैलों तक सीमित न होकर सामूहिक रूप से पशुधन है। ‘ले लिया’ युद्ध में उन्हें वहाँ से हटा लेने का आशय स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּךְ בָּהֶם מַכָּה גְדוֹלָה
  choice: उन्हें करारी हार दी
  rationale: נכה और מַכָּה का संयुक्त प्रयोग यहाँ भारी आघात या गंभीर पराजय पहुँचाने का मुहावरा है। ‘करारी हार दी’ सहज हिन्दी में अर्थ देता है और अनिश्चित मृतक-संख्या को ‘बड़ा संहार’ कहकर अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וַיּוֹשַׁע
  choice: बचाया
  rationale: ישע का इस सैन्य प्रसंग में अर्थ संकट या शत्रु से बचाना/छुड़ाना है; ‘बचाया’ सीधा और सामान्य पाठक के लिए स्पष्ट है।
- source_word: יֹשְׁבֵי קְעִילָה
  choice: कईला के निवासियों
  rationale: यह पद शाब्दिक रूप से ‘कईला में रहनेवालों’ को दर्शाता है; ‘निवासियों’ संक्षिप्त और गरिमापूर्ण है।
theological_decisions:
- issue: מַכָּה גְדוֹלָה में पराजय और संहार के बीच अर्थ-व्याप्ति
  choice: मुख्य पाठ में ‘करारी हार दी’
  alternative: ‘उन पर बड़ी मार लगाई’ या ‘उनका बड़ा संहार किया’
  rationale: इब्रानी पद भारी सैन्य आघात को स्पष्ट करता है, पर स्वयं मृतकों की संख्या या पूर्ण संहार को निश्चित नहीं करता। मुख्य पाठ स्वाभाविक हिन्दी में सैन्य परिणाम देता है और पादटिप्पणी मूल रूपक तथा अधिक तीव्र सम्भावना सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। छोटे वाक्यों से घटनाक्रम स्पष्ट रखा गया है। सैन्य मुहावरे को स्वाभाविक हिन्दी में व्यक्त करते हुए मूल इब्रानी की अर्थ-व्याप्ति पादटिप्पणियों में सुरक्षित रखी गई है।
