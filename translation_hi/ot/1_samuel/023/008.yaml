    text: या “युद्ध के लिए सब लोगों को इकट्ठा किया।” इब्रानी क्रिया का शाब्दिक अर्थ “सुनने देना” या “सुनवाना” हो सकता है, पर यहाँ संभवतः आशय सैन्य कार्रवाई के लिए लोगों को एकत्र होने के लिए बुलाने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁמַּע
  choice: बुलवाया
  rationale: हिफ़ील रूप का मूल भाव ‘सुनवाना’ है, पर इस सैन्य संदर्भ में इसका आशय लोगों को एकत्र होने के लिए बुलाना है। ‘बुलवाया’ कारक भाव और राजकीय आह्वान दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל הָעָם
  choice: सब लोगों को
  rationale: यह इब्रानी पद अक्षरशः ‘सब लोग’ है। संदर्भ में वे युद्ध के लिए जुटाए गए लोग हैं, फिर भी ‘सेना’ या ‘सैनिक’ जोड़ने से बचकर मूल की व्यापक अभिव्यक्ति रखी गई है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: यह उद्देश्य बताता है कि लोगों को सैन्य कार्रवाई के लिए बुलाया गया। ‘युद्ध के लिए’ आधुनिक हिंदी में स्पष्ट और स्वाभाविक है।
- source_word: לָרֶדֶת
  choice: नीचे ... जाएँ
  rationale: यָרַד का सामान्य अर्थ नीचे जाना या उतरना है। हिंदी वाक्यक्रम के कारण स्थान-नाम को इसके बीच रखा गया है।
- source_word: קְעִילָה
  choice: कीला
  rationale: स्थान-नाम का प्रचलित हिंदी लिप्यंतरण।
- source_word: לָצוּר
  choice: घेर लें
  rationale: צוּר यहाँ सैन्य घेराबंदी करने का भाव रखता है। व्यक्ति और उसके साथियों को लक्ष्य बनाकर कही गई हिंदी में ‘घेर लें’ स्वाभाविक है और उन्हें भीतर बंद कर देने की मंशा भी व्यक्त करता है।
- source_word: אֶל דָּוִד וְאֶל אֲנָשָׁיו
  choice: दाऊद तथा उसके आदमियों को
  rationale: אֶל यहाँ घेराबंदी के लक्ष्य को दर्शाता है। ‘उसके आदमी’ मूल के सामान्य אֲנָשָׁיו को बनाए रखता है और अनावश्यक रूप से ‘सैनिक’ नहीं जोड़ता।
