translation:
  language: hi
  text: तब शाऊल ने युद्ध के लिए सब लोगों को बुलाया[a], कि वे कीला की ओर नीचे उतरें और दाऊद तथा उसके आदमियों को घेर लें।
  philosophy: optimal-equivalence
  footnotes:
