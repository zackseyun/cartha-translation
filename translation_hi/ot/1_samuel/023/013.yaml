base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/013.yaml
  text: Then David arose with his men[a], about six hundred men, and they went out from Keilah and went wherever they could go. And it was told to Saul that David had escaped from Keilah[b], so he stopped going out.
translation:
  language: hi
  text: तब दाऊद और उसके लगभग छह सौ आदमी उठे और क़ईला से निकल गए। वे जहाँ भी जा सकते थे, वहाँ घूमते रहे।[a] शाऊल को बताया गया कि दाऊद क़ईला से बच निकला था, इसलिए उसने निकलना बंद कर दिया।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “और वे जहाँ कहीं जा सकते थे, वहाँ जाते रहे” या “और वे एक स्थान से दूसरे स्थान घूमते रहे” भी हो सकता है। इब्रानी अभिव्यक्ति उनके लगातार स्थान बदलते रहने पर बल देती है।
    reason: lexical_alternative
  - marker: b
    text: “उसने निकलना बंद कर दिया” का आशय संभवतः यह है कि दाऊद के क़ईला से बच निकलने की खबर पाकर शाऊल ने उसका पीछा करने के लिए निकलना बंद कर दिया।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּקָם דָּוִד וַאֲנָשָׁיו
  choice: दाऊद अपने ... आदमियों के साथ उठा
  rationale: קום का मूल अर्थ ‘उठना’ है। ‘के साथ’ दाऊद और उसके आदमियों को संयुक्त कर्ता के रूप में स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे पहले ही ‘चल पड़ा’ अर्थ देने के।
- source_word: כְּשֵׁשׁ מֵאוֹת אִישׁ
  choice: लगभग छः सौ आदमी
  rationale: संख्या से पहले כְּ अनुमान सूचित करता है; सैन्य दल के संदर्भ में אִישׁ के लिए ‘आदमी’ उपयुक्त है।
- source_word: וַיֵּצְאוּ מִקְּעִלָה
  choice: वे क़ईला से निकल गए
  rationale: יצא की स्थान-संबंधी छवि ‘निकल गए’ में सुरक्षित रहती है और हिन्दी में स्वाभाविक है।
- source_word: וַיִּתְהַלְּכוּ בַּאֲשֶׁר יִתְהַלָּכוּ
  choice: जहाँ कहीं जा सकते थे, वहाँ घूमते रहे
  rationale: הלכ का हित्पएल रूप और क्रिया की पुनरावृत्ति निरंतर एक स्थान से दूसरे स्थान जाते रहने का भाव देती है। ‘घूमते रहे’ इस सतत गतिविधि को व्यक्त करता है, जबकि ‘जहाँ कहीं जा सकते थे’ इब्रानी मुहावरे की परिस्थितिजन्य खुली अभिव्यक्ति बनाए रखता है।
- source_word: וּלְשָׁאוּל הֻגַּד
  choice: शाऊल को बताया गया
  rationale: नגד का होफ़अल रूप कर्मवाच्य है; हिन्दी का ‘को बताया गया’ उसी अनिर्दिष्ट सूचना-दाता को बनाए रखता है।
- source_word: כִּי נִמְלַט דָּוִד מִקְּעִילָה
  choice: कि दाऊद क़ईला से बच निकला है
  rationale: נמלט संकट या पकड़ से निकल जाने को दर्शाता है; ‘बच निकला’ पीछा किए जाने के प्रसंग में सटीक और स्वाभाविक है।
- source_word: וַיֶּחְדַּל לָצֵאת
  choice: तो उसने निकलना छोड़ दिया
  rationale: חדל के साथ धात्वर्थक प्रयोग का सीधा अर्थ किसी काम को बंद करना है। ‘निकलना’ יצא को सुरक्षित रखता है और अभियान का आशय पादटिप्पणी में स्पष्ट किया गया है।
