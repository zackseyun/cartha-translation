  yaml_path: translation/ot/1_samuel/023/024.yaml
  text: They arose and went to Ziph ahead of Saul[a]. Now David and his men were in the wilderness of Maon, in the Arabah[b], to the south of the Jeshimon.
translation:
  language: hi
  text: वे उठे और शाऊल से आगे ज़ीफ़ को चले गए। उस समय दाऊद और उसके जन माओन के निर्जन प्रदेश में, अराबा में, यशीमोन[a] के दक्षिण में[b] थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यशीमोन’ का अर्थ ‘उजाड़ प्रदेश’ या ‘मरुभूमि’ भी लिया जा सकता है, पर यहाँ यह संभवतः एक स्थान-नाम है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यशीमोन की दाहिनी ओर।’ इब्रानी में शाब्दिक रूप से ‘दाहिना हाथ/दाहिनी ओर’ है, जिसका भौगोलिक प्रयोग ‘दक्षिण’ के अर्थ में हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּק֛וּמוּ וַיֵּלְכ֥וּ
  choice: वे उठे और ... चले गए
  rationale: दोनों क्रमिक क्रियाओं को सरल, स्वाभाविक हिन्दी में रखा गया है; ‘उठे’ קום और ‘चले गए’ הלך का कथात्मक क्रम बनाए रखते हैं।
- source_word: זִ֖יפָה
  choice: सीप को
  rationale: स्थान-नाम के साथ लगी दिशासूचक ה को लक्ष्य की ओर गति के रूप में व्यक्त किया गया है।
- source_word: לִפְנֵ֣י שָׁא֑וּל
  choice: शाऊल से पहले
  rationale: यहाँ לִפְנֵי का अर्थ शाऊल के पहुँचने से पहले अथवा उससे आगे जाकर होना है; हिन्दी में ‘से पहले’ इस स्थानिक-कालिक भाव को स्वाभाविक रूप से रखता है।
- source_word: וְדָוִ֨ד וַאֲנָשָׁ֜יו
  choice: उस समय दाऊद और उसके जन ... थे
  rationale: इब्रानी का क्रियारहित उपवाक्य दाऊद के स्थान की ओर दृश्य बदलता है। ‘उस समय’ इस परिवर्तन को सहज बनाता है और ‘थे’ हिन्दी में आवश्यक है।
- source_word: בְּמִדְבַּ֤ר מָעוֹן֙
  choice: माओन के जंगल में
  rationale: מִדְבָּר निर्जन, खुला वन-प्रदेश दर्शाता है; ‘जंगल’ प्रचलित बाइबलीय हिन्दी में केवल घने वन तक सीमित न होकर ऐसे निर्जन प्रदेश के लिए भी समझा जाता है।
- source_word: בָּעֲרָבָ֔ה
  choice: अराबा में
  rationale: निश्चित उपपद और भौगोलिक प्रसंग के कारण इसे सामान्य ‘मैदान’ के बजाय क्षेत्र-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: הַיְשִׁימֽוֹן
  choice: यशीमोन
  rationale: यद्यपि शब्द का सामान्य अर्थ ‘उजाड़ प्रदेश’ हो सकता है, यहाँ इसका प्रयोग संभवतः भौगोलिक नाम के रूप में हुआ है; इसलिए नाम सुरक्षित रखा गया है।
- source_word: אֶ֖ל יְמִ֥ין הַיְשִׁימֽוֹן
  choice: यशीमोन के दक्षिण में
  rationale: יָמִין का शाब्दिक अर्थ ‘दाहिनी ओर’ है, पर पूर्वाभिमुख भौगोलिक दिशा-निर्धारण में यह ‘दक्षिण’ को सूचित कर सकता है। मुख्य पाठ में अभिप्रेत दिशा दी गई है और शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
