base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/025.yaml
  text: So Saul and his men went to seek him. And they told David[a], so he went down to the rock and stayed in the wilderness of Maon. When Saul heard, he pursued David in the wilderness of Maon.
translation:
  language: hi
  text: तब शाऊल और उसके आदमी दाऊद को खोजने निकले। जब लोगों ने दाऊद को इसकी खबर दी, तो वह नीचे उस चट्टान[a] तक गया और माओन के निर्जन क्षेत्र में ठहरा। जब शाऊल ने यह सुना, तो उसने माओन के निर्जन क्षेत्र में दाऊद का पीछा किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शैल-शिखर” अथवा “खड़ी चट्टान।” इब्रानी शब्द संभवतः किसी प्रसिद्ध पथरीले गढ़ या शैल-रचना की ओर संकेत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְבַקֵּשׁ
  choice: दाऊद को खोजने
  rationale: यह उद्देश्यसूचक क्रिया है; इब्रानी में कर्म प्रसंग से स्पष्ट है, इसलिए स्वाभाविक हिन्दी में ‘दाऊद को’ स्पष्ट किया गया है।
- source_word: וַיַּגִּדוּ לְדָוִד
  choice: जब लोगों ने दाऊद को इसकी खबर दी
  rationale: इब्रानी क्रिया सक्रिय बहुवचन है, पर कर्ता अनिर्दिष्ट है। ‘लोगों ने’ उस अनिर्दिष्ट बहुवचन को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וַיֵּרֶד
  choice: वह ... उतर गया
  rationale: मूल क्रिया नीचे की ओर जाने का स्थानिक भाव रखती है; इसका कर्ता निकट प्रसंग के अनुसार दाऊद है।
- source_word: הַסֶּלַע
  choice: चट्टान
  rationale: यह शब्द चट्टान, शैल-खंड या खड़ी पथरीली जगह को सूचित कर सकता है। ‘चट्टान’ मूल बिंब को बनाए रखते हुए आधुनिक हिन्दी में स्वाभाविक है।
- source_word: וַיֵּשֶׁב
  choice: ठहरा
  rationale: इस आख्यान में क्रिया किसी स्थान पर रहने या टिके रहने को दर्शाती है; ‘ठहरा’ अस्थायी निवास के प्रसंग में सहज है।
- source_word: בְּמִדְבַּר מָעוֹן / מִדְבַּר מָעוֹן
  choice: माओन के निर्जन प्रदेश में
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं, बल्कि विरल आबादी वाला वन्य या चरागाही क्षेत्र भी हो सकता है। ‘निर्जन प्रदेश’ इस व्यापक अर्थ को व्यक्त करता है।
- source_word: וַיִּרְדֹּף אַחֲרֵי
  choice: पीछा किया
  rationale: यह इब्रानी मुहावरा किसी का पीछा करने या उसे पकड़ने के लिए आगे बढ़ने का अर्थ देता है; हिन्दी में ‘पीछा किया’ सटीक और सहज है।
- source_word: וַיֵּלֶךְ שָׁאוּל וַאֲנָשָׁיו
  choice: तब शाऊल और उसके आदमी ... निकले
  rationale: वाव-क्रम आख्यान को आगे बढ़ाता है। ‘तब’ इस क्रम को दिखाता है, और ‘निकले’ उद्देश्यसूचक ‘खोजने’ के साथ स्वाभाविक हिन्दी बनाता है।
