base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/022.yaml
  text: Please go and make further preparations[a], and know and see his place where his foot is, who has seen him there; for I am told[c][b], ‘He is very cunning.’
translation:
  language: hi
  text: अब जाओ और आगे की तैयारी करो। उसके उस ठिकाने का पता लगाओ और देखो जहाँ वह आता-जाता है[a], और यह भी कि वहाँ उसे किसने देखा है; क्योंकि मुझसे कहा गया है[b], ‘वह बड़ी चालाकी से काम करता है।’[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका पैर कहाँ होगा”; यह उसके ठिकाने या आने-जाने को बताने वाला मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “क्योंकि उसने मुझसे कहा है”; इब्रानी में “कहा” का कर्ता स्पष्ट रूप से नहीं बताया गया है।
    reason: alternative_reading
  - marker: c
    text: इब्रानी में बल देने के लिए एक ही मूल के शब्द साथ आए हैं; शाब्दिक भाव कुछ ऐसा है, “वह चालाकी से चाल चलता है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הָכִינוּ עוֹד
  choice: आगे की तैयारी करो
  rationale: हिफ़ील रूप הָכִינוּ का अर्थ ‘तैयार करना’ है और עוֹד आगे या अधिक तैयारी करने का भाव देता है।
- source_word: וּדְעוּ וּרְאוּ
  choice: पता लगाओ और देखो
  rationale: दोनों आज्ञार्थक क्रियाओं को बनाए रखा गया है, ताकि सावधानी से जाँच-पड़ताल करने का संचयी बल बना रहे।
- source_word: מְקוֹמוֹ
  choice: उसका ठिकाना
  rationale: यह מקום के साथ लगे तृतीय पुरुष एकवचन प्रत्यय को व्यक्त करता है और आधुनिक हिन्दी में स्थान या मौजूदगी के संदर्भ में स्वाभाविक है।
- source_word: אֲשֶׁר תִּהְיֶה רַגְלוֹ
  choice: वह कहाँ आता-जाता है
  rationale: शाब्दिक चित्र ‘उसका पैर कहाँ होगा’ दाऊद की गतिविधियों या आने-जाने के स्थान को सूचित करने वाला मुहावरा है; मुख्य पाठ में उसका स्वाभाविक हिन्दी अर्थ दिया गया है और चित्र को पादटिप्पणी में रखा गया है।
- source_word: מִי רָאָהוּ שָׁם
  choice: वहाँ उसे किसने देखा है
  rationale: यह उन प्रत्यक्षदर्शियों या सूचना देने वालों की पहचान पूछता है जिन्होंने उसे उस स्थान पर देखा था।
- source_word: כִּי אָמַר אֵלַי
  choice: क्योंकि मुझसे कहा गया है
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर उसका कर्ता स्पष्ट नहीं है। भाववाच्य हिन्दी अनुवाद अनिर्दिष्ट कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עָרוֹם יַעְרִם הוּא
  choice: वह बड़ी चालाकी से काम करता है
  rationale: विशेषण और उसी मूल की क्रिया से बनी सजातीय अभिव्यक्ति तीव्रता प्रकट करती है। हिन्दी में ‘बड़ी चालाकी से’ उस बल और शाऊल के संदेहपूर्ण आकलन दोनों को स्वाभाविक रूप से व्यक्त करता है।
