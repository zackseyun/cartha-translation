  yaml_path: translation/ot/1_samuel/023/017.yaml
  text: He said to him[a], “Do not be afraid, for the hand of Saul my father will not find you. You will reign over Israel, and I will be second to you[b]. Even Saul my father knows this.”
translation:
  language: hi
  text: उसने उससे कहा, “मत डर, क्योंकि मेरे पिता शाऊल का हाथ तुझे नहीं ढूँढ़ पाएगा[a]। तू इस्राएल पर राज करेगा, और मैं तेरे अधीन दूसरे स्थान पर रहूँगा[b]। मेरे पिता शाऊल भी यह बात जानते हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे पिता शाऊल की शक्ति तुझ तक नहीं पहुँचेगी।” इब्रानी में “हाथ” शक्ति या पकड़ का लाक्षणिक बिंब है।
    reason: lexical_alternative
  - marker: b
    text: या, “मैं तेरे बाद दूसरे स्थान पर रहूँगा” या “मैं तेरा दूसरा अधिकारी रहूँगा।” इब्रानी का अर्थ पद या श्रेणी में दाऊद के बाद दूसरा होना है।
    reason: lexical_alternative
