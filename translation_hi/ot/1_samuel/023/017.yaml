  register: भाषा आधुनिक, गरिमापूर्ण और संवादानुकूल रखी गई है। योनातान और दाऊद के निकट संबंध तथा इब्रानी के एकवचन संबोधन को दिखाने के लिए ‘तू/तुझे/तेरे’ का प्रयोग किया गया है।
