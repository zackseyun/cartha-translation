  choice: मेरे पिता शाऊल का हाथ तुझे नहीं पकड़ पाएगा
  rationale: ‘हाथ’ के इब्रानी बिंब को बनाए रखते हुए ‘पकड़ पाएगा’ प्रसंग में उसकी पहुँच अथवा गिरफ्त में आने का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְאַתָּה תִּמְלֹךְ עַל יִשְׂרָאֵל
  choice: तू इस्राएल पर राज करेगा
  rationale: מלך के क्रियात्मक अर्थ को सामान्य, स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וְאָנֹכִי אֶהְיֶה לְּךָ לְמִשְׁנֶה
  choice: मैं तेरे बाद दूसरे स्थान पर रहूँगा
  rationale: מִשְׁנֶה का आशय पद या श्रेणी में दूसरे स्थान से है; यह रूप आधुनिक ‘उप-सेनापति’ जैसे अधिक विशिष्ट पदनाम को आरोपित नहीं करता।
- source_word: וְגַם שָׁאוּל אָבִי יֹדֵעַ כֵּן
  choice: मेरे पिता शाऊल भी यह बात जानते हैं
  rationale: כֵּן को पिछले पूरे कथन की ओर संकेत मानकर सहज हिन्दी में प्रस्तुत किया गया है।
theological_decisions:
- issue: दाऊद के भावी राज और योनातान की अधीनस्थ स्थिति की स्पष्टता
  choice: इसे योनातान की सीधी राजनीतिक और भविष्य-संबंधी अपेक्षा के रूप में रखा गया है
  alternative: इसे परमेश्वर की नियुक्ति की स्पष्ट धार्मिक भविष्यवाणी के रूप में विस्तृत करना
  rationale: इस वाक्य में दाऊद के राज और योनातान के दूसरे स्थान की बात स्पष्ट है, पर यहाँ स्वयं यहोवा का उल्लेख नहीं है; इसलिए अनकही वाचा-संबंधी या मसीही व्याख्या नहीं जोड़ी गई।
