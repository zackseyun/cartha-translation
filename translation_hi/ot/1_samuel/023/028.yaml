- source_word: קָרְאוּ לַמָּקוֹם הַהוּא
  choice: उस स्थान का नाम … रखा गया
  rationale: अनिर्दिष्ट बहुवचन कर्ता को हिंदी में भाववाच्य द्वारा सहज रूप से व्यक्त किया गया है, बिना किसी कर्ता को जोड़ने के।
- source_word: סֶלַע הַמַּחְלְקוֹת
  choice: अलगाव की चट्टान
  rationale: סֶלַע चट्टान या शैल-स्थान है और הַמַּחְלְקוֹת विभाजन, अलगाव या बिछुड़ने का संकेत देता है; ‘अलगाव’ इस प्रसंग में दोनों पक्षों के अलग होने को सहज रूप से व्यक्त करता है।
