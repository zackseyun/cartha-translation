base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/009.yaml
  text: When David learned that Saul was secretly plotting harm against him[a], he said to Abiathar the priest[b], “Bring the ephod here.”
translation:
  language: hi
  text: जब दाऊद को पता चला कि शाऊल उसके विरुद्ध गुप्त रूप से हानि की योजना बना रहा था[a], तब उसने एब्यातार याजक से कहा, “एपोद यहाँ ले आओ।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसके विरुद्ध बुराई रच रहा था।”
    reason: lexical_alternative
  - marker: b
    text: इस कथा के संदर्भ में एपोद एक याजकीय वस्त्र अथवा वस्तु थी, जिसका संबंध परमेश्वर से मार्गदर्शन माँगने से था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֵּדַע
  choice: को पता चला
  rationale: कथात्मक क्रम में दाऊद के उस समय यह बात जानने को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כִּי
  choice: कि
  rationale: यह दाऊद को ज्ञात हुई बात की विषयवस्तु का परिचय देता है।
- source_word: עָלָיו
  choice: उसके विरुद्ध
  rationale: शत्रुतापूर्ण आशय के संदर्भ में על का उपयुक्त मुहावरेदार अर्थ है।
- source_word: מַחֲרִישׁ
  choice: गुप्त रूप से ... योजना बना रहा है
  rationale: हिफ़ील कृदंत यहाँ छिपकर षड्यंत्रकारी ढंग से योजना बनाने और जारी क्रिया—दोनों का भाव देता है।
- source_word: הָרָעָה
  choice: हानि
  rationale: इस संदर्भ में शाऊल द्वारा दाऊद को नुकसान पहुँचाने का ठोस आशय स्पष्ट करता है, जबकि ‘बुराई’ का व्यापक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אֶל אֶבְיָתָר הַכֹּהֵן
  choice: एब्यातार याजक से
  rationale: एब्यातार की पहचान उसके याजकीय पद से करते हुए कथन का स्वाभाविक हिन्दी रूप है।
- source_word: הַגִּישָׁה
  choice: यहाँ ले आओ
  rationale: नגש के हिफ़ील आज्ञार्थक का ‘निकट लाना/प्रस्तुत करना’ भाव सहज प्रत्यक्ष आज्ञा के रूप में व्यक्त होता है।
- source_word: הָאֵפוֹד
  choice: एपोद
  rationale: विशिष्ट याजकीय वस्त्र अथवा वस्तु के पारंपरिक लिप्यंतरण को बनाए रखता है; सामान्य शब्द इसकी सांस्कृतिक विशिष्टता खो देगा।
theological_decisions:
- issue: מַחֲרִישׁ הָרָעָה में शाऊल के आशय का स्वरूप
  choice: शाऊल दाऊद के विरुद्ध गुप्त रूप से हानि की योजना बना रहा था
  alternative: शाऊल दाऊद के विरुद्ध बुराई रच रहा था
  rationale: इब्रानी पदबंध शत्रुतापूर्ण और छिपी हुई योजना का संकेत देता है। ‘हानि’ तत्काल ठोस खतरे को व्यक्त करता है, जबकि ‘बुराई’ के अधिक व्यापक नैतिक अर्थ को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘याजक’ और ‘एपोद’ जैसे स्थापित बाइबलीय शब्द बनाए रखे गए हैं; एपोद की भूमिका पादटिप्पणी में स्पष्ट की गई है।
