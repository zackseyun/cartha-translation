base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/007.yaml
  text: And it was reported to Saul that David had come to Keilah[a]. So Saul said, “God has delivered him into my hand[b], for he has shut himself in by entering a city with doors and bars.”
translation:
  language: hi
  text: जब शाऊल को बताया गया कि दाऊद कीला आ गया है, तो शाऊल ने कहा, “परमेश्वर ने उसे मेरे हाथ में सौंप दिया है[a], क्योंकि दोहरे फाटक और अर्गले वाले नगर में प्रवेश करके उसने अपने को भीतर बंद कर लिया है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “परमेश्वर ने उसे मेरे अधिकार में कर दिया है।” यह शाऊल की अपनी व्याख्या है कि दाऊद की स्थिति उसे परमेश्वर द्वारा सौंपे जाने के समान है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में नगर के द्वार के दो पल्लों और उन्हें भीतर से सुरक्षित करने वाले आड़े अर्गले का उल्लेख है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֻּגַּד
  choice: बताया गया
  rationale: होफ़ाल रूप सूचना दिए जाने का निष्क्रिय भाव व्यक्त करता है; यह हिंदी में स्वाभाविक रहते हुए उस भाव को सुरक्षित रखता है।
- source_word: בָא דָוִד קְעִילָה
  choice: दाऊद कीला आ गया है
  rationale: בוא का सामान्य अर्थ ‘आना/प्रवेश करना’ है; गंतव्य के साथ ‘कीला आ गया है’ कथात्मक सूचना के लिए स्वाभाविक है।
- source_word: נִכַּר אֹתוֹ אֱלֹהִים בְּיָדִי
  choice: परमेश्वर ने उसे मेरे हाथ में सौंप दिया है
  rationale: यहाँ נכר का दुर्लभ अर्थ किसी को दूसरे के अधिकार में सौंप देना है। ‘मेरे हाथ में’ मूल इब्रानी मुहावरे और सत्ता में आ जाने, दोनों भावों को बनाए रखता है।
- source_word: נִסְגַּר
  choice: उसने अपने को भीतर बंद कर लिया है
  rationale: निफ़अल रूप निष्क्रिय अथवा आत्मवाचक समझा जा सकता है। प्रसंग में शाऊल की दृष्टि से दाऊद गढ़वाले नगर में जाकर स्वयं भीतर फँस गया है; चुना हुआ वाक्य इस अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: לָבוֹא
  choice: प्रवेश करके
  rationale: क्रियार्थक संज्ञा बंद हो जाने के साधन या कारण को बताती है; ‘प्रवेश करके’ इस संबंध को स्पष्ट रखता है।
- source_word: בְּעִיר דְּלָתַיִם וּבְרִיחַ
  choice: दोहरे फाटक और अर्गले वाले नगर में
  rationale: דלתים नगर-द्वार के दो पल्लों की ओर संकेत करता है और בריח उन्हें सुरक्षित करने वाला आड़ा अर्गला है। यह अनुवाद किलाबंद नगर की ठोस छवि बनाए रखता है।
theological_decisions:
- issue: दाऊद की असुरक्षित स्थिति को परमेश्वर का कार्य मानने का शाऊल का दावा
  choice: 'शाऊल के कथन को सीधे उद्धृत किया गया है: ‘परमेश्वर ने उसे मेरे हाथ में सौंप दिया है।’'
  alternative: ‘शाऊल ने समझा कि परमेश्वर ने उसे उसके हाथ में सौंप दिया है।’
  rationale: इब्रानी पाठ इसे शाऊल के सीधे कथन के रूप में देता है और कथावाचक की स्वीकृति या अस्वीकृति नहीं जोड़ता। अनुवाद भी इस धार्मिक तनाव को बिना सुलझाए सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘मेरे हाथ में’ बाइबलीय मुहावरे को सुरक्षित रखता है, जबकि ‘अर्गला’ किलाबंद नगर के द्वार को बंद करने वाली आड़ी छड़ के लिए सटीक हिंदी शब्द है।
