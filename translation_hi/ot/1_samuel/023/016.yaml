  yaml_path: translation/ot/1_samuel/023/016.yaml
  text: Then Jonathan son of Saul arose and went to David at Horesh[a], and strengthened his hand in God.
translation:
  language: hi
  text: 'तब शाऊल का पुत्र योनातान उठा और होरेश में दाऊद के पास गया। उसने परमेश्वर में उसका साहस बढ़ाया[a]।


    [a] या, “उसे परमेश्वर में हिम्मत दी”; शाब्दिक रूप से, “परमेश्वर में उसके हाथ को दृढ़ किया।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसे परमेश्वर में हिम्मत दी”; शाब्दिक रूप से, “परमेश्वर में उसके हाथ को दृढ़ किया।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: यह क्रिया उद्देश्यपूर्ण कार्य के आरम्भ को दिखाती है; ‘उठा’ इब्रानी कथात्मक क्रम और संक्षिप्तता को बनाए रखता है।
- source_word: יְהוֹנָתָן בֶּן שָׁאוּל
  choice: शाऊल का पुत्र योनातान
  rationale: यह पुत्र-संबंध को स्पष्ट रखते हुए मूल पदबंध के राजनीतिक और पारिवारिक तनाव को सुरक्षित रखता है।
- source_word: וַיֵּלֶךְ אֶל דָּוִד
  choice: दाऊद के पास गया
  rationale: הלך אל का स्वाभाविक अर्थ किसी व्यक्ति के पास जाना है और प्रसंग में पहुँचने का भाव निहित है।
- source_word: חֹרְשָׁה
  choice: होरेश में
  rationale: रूप और कथात्मक परिवेश इसे सामान्य संज्ञा ‘वन’ के बजाय स्थान-नाम के रूप में समझने का समर्थन करते हैं। दिशासूचक ה स्थानीय गंतव्य को सूचित करता है, जिसे हिंदी में प्रसंगानुसार ‘में’ व्यक्त किया गया है।
- source_word: וַיְחַזֵּק אֶת יָדוֹ
  choice: उसके हाथ को दृढ़ किया
  rationale: यह मूल इब्रानी रूपक को सुरक्षित रखता है। इसका आशय दाऊद को साहस या संकल्प देना है, जिसे पादटिप्पणी में स्वाभाविक विकल्प के रूप में बताया गया है।
- source_word: בֵּאלֹהִים
  choice: परमेश्वर में
  rationale: ב को ‘में’ कहना उस आधार या क्षेत्र की वास्तविक अस्पष्टता बनाए रखता है जिसमें दाऊद को दृढ़ किया गया; ‘परमेश्वर के द्वारा’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: यहोवा
  rationale: मूल पाठ में אֱלֹהִים है, יהוה नहीं; इसलिए वाचा-सूचक नाम को आयात किए बिना ‘परमेश्वर’ रखा गया है।
- issue: בֵּאלֹהִים में पूर्वसर्ग ב का संबंध
  choice: परमेश्वर में
  alternative: परमेश्वर के द्वारा
  rationale: ‘में’ मूल की संभावित अर्थ-व्याप्ति और धार्मिक तनाव को बनाए रखता है—दृढ़ता का आधार, क्षेत्र या संबंध—जबकि ‘के द्वारा’ साधन का अर्थ निश्चित कर देता।
translation_notes:
  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण कथात्मक रूप अपनाया गया है। ‘उसके हाथ को दृढ़ किया’ सामान्य हिंदी में कुछ असामान्य है, पर मूल इब्रानी बिंब को सुरक्षित रखने के लिए मुख्य पाठ में रखा गया और उसका सहज अर्थ पादटिप्पणी में दिया गया है।
