  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। वाक्य में गतिशील पीछा और दोनों दलों की विपरीत स्थितियाँ स्पष्ट रखी गई हैं। मुख्य पाठ के दोनों पादटिप्पणी-चिह्न अपने संबंधित अंशों पर लगाए गए हैं।
