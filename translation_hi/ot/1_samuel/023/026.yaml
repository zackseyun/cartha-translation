base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/026.yaml
  text: Saul was going on one side of the mountain[a], and David and his men were on the other side of the mountain. David was hurrying to go away from Saul[c][b], while Saul and his men were closing in on David and his men to capture them.
translation:
  language: hi
  text: शाऊल पहाड़ के एक ओर जा रहा था,[a] और दाऊद तथा उसके लोग पहाड़ की दूसरी ओर थे। दाऊद शाऊल से दूर जाने की जल्दी में था, जबकि शाऊल और उसके लोग दाऊद और उसके लोगों को पकड़ने के लिए उनके चारों ओर घेरा कसते जा रहे थे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में दोनों स्थानों पर शाब्दिक रूप से, “पहाड़ की ओर से इस ओर” है। यहाँ सन्दर्भ में अभिप्रेत विरोध को हिन्दी में “एक ओर” और “दूसरी ओर” कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाऊद और उसके लोगों को चारों ओर से घेर रहे थे।”
    reason: alternative_reading
lexical_decisions:
- source_word: וַיֵּלֶךְ
  choice: जा रहा था
  rationale: कथानक में शाऊल और दाऊद की एक साथ जारी गतियों को दिखाने के लिए अपूर्ण भूतकालीन अभिव्यक्ति स्वाभाविक है।
- source_word: מִצַּד הָהָר מִזֶּה ... מִצַּד הָהָר מִזֶּה
  choice: पहाड़ के एक ओर ... पहाड़ की दूसरी ओर
  rationale: इब्रानी दोनों स्थानों के लिए शाब्दिक रूप से ‘इस ओर’ दोहराता है; हिन्दी में अभिप्रेत स्थानिक विरोध को ‘एक ओर’ और ‘दूसरी ओर’ स्पष्ट और स्वाभाविक ढंग से व्यक्त करते हैं।
- source_word: נֶחְפָּז
  choice: जल्दी कर रहा था
  rationale: निफ़अल कृदंत तत्काल और जारी शीघ्रता बताता है; यह चयन भय या घबराहट को अनावश्यक रूप से नहीं जोड़ता।
- source_word: לָלֶכֶת מִפְּנֵי שָׁאוּל
  choice: शाऊल के सामने से निकल जाने के लिए
  rationale: ‘शाऊल के सामने से जाने’ की मूल स्थानिक भाषा को सुरक्षित रखते हुए यह आधुनिक हिन्दी में दाऊद के उससे दूर जाने का आशय व्यक्त करता है, बिना इसे अधिक प्रबल ‘भागना’ बनाने के।
- source_word: עֹטְרִים אֶל
  choice: उनकी ओर से घेरा कसते जा रहे थे
  rationale: यह कृदंत घेरने या चारों ओर से निकट आने की सामरिक गति दर्शाता है। ‘घेरा कसते जा रहे थे’ जारी कार्रवाई और आसन्न गिरफ्तारी दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: לְתָפְשָׂם
  choice: उन्हें पकड़ने के लिए
  rationale: सप्रत्यय infinitive उद्देश्य बताता है; सैन्य पीछा करने के प्रसंग में ‘पकड़ना’ सहज और पर्याप्त सटीक है।
