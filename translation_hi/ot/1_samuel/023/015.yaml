  yaml_path: translation/ot/1_samuel/023/015.yaml
  text: David saw that Saul had come out to seek his life[a], while David was in the wilderness of Ziph at Horesh.
translation:
  language: hi
  text: दाऊद ने देखा कि शाऊल उसकी जान के पीछे निकल पड़ा था। उस समय दाऊद ज़ीफ़ के निर्जन प्रदेश में, होरेश[a] में था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वन में” अथवा “वृक्षों वाले स्थान में।” इब्रानी शब्द को सामान्य संज्ञा के रूप में भी समझा जा सकता है, पर यहाँ सम्भवतः यह ‘होरेश’ नामक स्थान है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּרְא
  choice: देखा
  rationale: रאָה का मूल अर्थ ‘देखना’ है और प्रसंग में यह जान लेने या भाँप लेने का भाव भी दे सकता है। ‘देखा’ मूल अभिव्यक्ति को बनाए रखते हुए स्वाभाविक है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי उस बात का परिचय देता है जिसे दाऊद ने देखा या जाना; इसलिए ‘कि’ उपयुक्त है।
- source_word: יָצָא
  choice: निकल पड़ा था
  rationale: יצא का अर्थ ‘बाहर जाना/निकलना’ है। पूर्वकालिक रूप ‘निकल पड़ा था’ शाऊल के खोज-अभियान पर रवाना होने और कथानक के समय-संबंध को व्यक्त करता है।
- source_word: לְבַקֵּשׁ אֶת נַפְשׁוֹ
  choice: उसकी जान के पीछे
  rationale: शाब्दिक अर्थ ‘उसके प्राण को ढूँढ़ना’ है, जिसका आशय प्राण लेने के इरादे से पीछा करना है। ‘उसकी जान के पीछे’ आधुनिक हिन्दी का स्वाभाविक मुहावरा है और मूल की धमकीपूर्ण अभिव्यक्ति को सीधे ‘मार डालने’ में नहीं बदलता।
- source_word: בְּמִדְבַּר זִיף
  choice: जीप के निर्जन प्रदेश में
  rationale: מִדְבָּר केवल रेतीले मरुस्थल तक सीमित नहीं, बल्कि विरल आबादी वाले जंगल/उजाड़ भूभाग को भी दर्शाता है। ‘निर्जन प्रदेश’ इस व्यापक अर्थ को सहज हिन्दी में रखता है।
- source_word: בַּחֹרְשָׁה
  choice: होरेश में
  rationale: חֹרְשָׁה का सामान्य अर्थ वन या वृक्षों वाला स्थान हो सकता है, पर इस प्रसंग में इसे स्थान-नाम समझना अधिक सम्भावित है। इसलिए ‘होरेश’ रखा गया है और दूसरा सम्भव अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְדָוִד
  choice: उस समय दाऊद
  rationale: वाव से आरम्भ यह खंड दाऊद की तत्कालीन स्थिति और स्थान बताता है। ‘उस समय’ हिन्दी में इस परिस्थितिजन्य संबंध को स्पष्ट और स्वाभाविक बनाता है।
