  yaml_path: translation/ot/1_samuel/023/020.yaml
  text: Now then[a], O king, come down according to all the desire of your soul to come down[b], and it is for us to hand him over into the king’s hand.
translation:
  language: hi
  text: अब, हे राजा, नीचे उतरने की आपके मन में जितनी भी इच्छा हो, अवश्य उतर आइए[a]; और उसे राजा के हाथ में सौंप देना हमारा काम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘उतरना’ क्रिया दोहराई गई है—शाब्दिक रूप से, ‘उतरने के लिए, उतर आइए’—जिससे आग्रह पर विशेष बल पड़ता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले कथन से जुड़ते हुए तत्काल आग्रह की ओर संक्रमण करता है; ‘इसलिए अब’ हिन्दी में संयोजक और संवाद-सूचक दोनों बल व्यक्त करता है।
- source_word: לְכָל אַוַּת נַפְשְׁךָ
  choice: जैसा आपका मन ... चाहे
  rationale: शाब्दिक ‘आपके प्राण की सारी अभिलाषा’ के स्थान पर यह स्वाभाविक हिन्दी मुहावरा व्यक्ति की प्रबल इच्छा का वही भाव देता है।
- source_word: הַמֶּלֶךְ
  choice: हे राजा
  rationale: निश्चित उपपद सहित संज्ञा यहाँ संबोधन के रूप में प्रयुक्त है; ‘हे राजा’ इसे स्पष्ट और गरिमापूर्ण बनाता है।
- source_word: לָרֶדֶת רֵד
  choice: उतरने को चाहे, अवश्य उतर आइए
  rationale: मूल के क्रियार्थक रूप और आज्ञार्थक क्रिया की पुनरावृत्ति आग्रह पर बल देती है। हिन्दी में ‘अवश्य’ उस बल को स्वाभाविक ढंग से प्रकट करता है, जबकि ‘उतर’ का अर्थ भी बना रहता है।
- source_word: וְלָנוּ
  choice: हमारा काम है
  rationale: यहाँ सर्वनामयुक्त पद जिम्मेदारी अथवा अपने हिस्से के कार्य को दर्शाता है; वर्तमान हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: הַסְגִּירוֹ
  choice: उसे ... सौंपना
  rationale: हिफ़ील रूप यहाँ किसी को दूसरे के अधिकार में दे देने का अर्थ रखता है; ‘सौंपना’ सहज आधुनिक हिन्दी है।
- source_word: בְּיַד הַמֶּלֶךְ
  choice: राजा के हाथ में
  rationale: मूल का ‘हाथ में’ मुहावरा किसी के अधिकार या वश में सौंपने को दर्शाता है और स्रोत की सजीव छवि बनाए रखता है।
