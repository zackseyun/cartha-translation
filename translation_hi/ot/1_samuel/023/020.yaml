translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, सम्मानपूर्ण और कथात्मक संवाद-रजिस्टर अपनाया गया है। राजकीय संबोधन के लिए ‘हे राजा’ रखा गया है; अत्यधिक संस्कृतनिष्ठ शब्दावली से बचते हुए मूल इब्रानी के बल और ‘हाथ में’ जैसे मुहावरे को सुरक्षित रखा गया है।
