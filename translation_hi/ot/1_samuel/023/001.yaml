  yaml_path: translation/ot/1_samuel/023/001.yaml
  text: Then they told David[a], saying, “Look, the Philistines are fighting against Keilah, and they are plundering the threshing floors.”
translation:
  language: hi
  text: तब लोगों ने दाऊद को बताया, “देखो, पलिश्ती कीला पर आक्रमण कर रहे हैं[a] और खलिहानों को लूट रहे हैं।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कीला में लड़ रहे हैं।” इब्रानी संबंधबोधक शब्द का मूल अर्थ “में” है, पर इस सैन्य प्रसंग में संभवतः नगर पर आक्रमण करना अभिप्रेत है।
    reason: स्थानवाचक संबंधबोधक शब्द और सैन्य अर्थ के बीच वास्तविक शाब्दिक विकल्प को सुरक्षित रखना।
lexical_decisions:
- source_word: וַיַּגִּדוּ
  choice: तब लोगों ने ... बताया
  rationale: हिफ़ील वय्यिक्तोल कथा की अगली घटना बताता है। इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है; हिंदी में ‘लोगों ने’ इसे स्वाभाविक ढंग से व्यक्त करता है और ‘तब’ घटनाक्रम की क्रमिकता बनाए रखता है।
- source_word: לְדָוִד
  choice: दाऊद को
  rationale: ל द्वारा चिह्नित समाचार के प्राप्तकर्ता को स्वाभाविक हिंदी में ‘को’ से व्यक्त किया गया है।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष कथन के आरंभ से व्यक्त
  rationale: इब्रानी का मानक कथन-सूचक रूप है। हिंदी में ‘यह कहते हुए’ जोड़ने के बजाय ‘बताया’ के बाद सीधे उद्धरण देना अधिक स्वाभाविक है और वही कार्य करता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने और समाचार की तात्कालिकता दिखाने वाला अव्यय है। ‘देखो’ आधुनिक हिंदी में इसकी जीवंतता बनाए रखता है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्ती
  rationale: ज्ञात जनसमूह के पारंपरिक और सुबोध हिंदी नाम का प्रयोग किया गया है।
- source_word: נִלְחָמִים בִּקְעִילָה
  choice: कईला पर आक्रमण कर रहे हैं
  rationale: निफ़ाल कृदंत सैन्य संघर्ष बताता है और ב का मूल अर्थ ‘में/पर’ है। प्रसंग में पलिश्तियों द्वारा नगर को संकट में डालना अभिप्रेत है, इसलिए मुख्य पाठ में स्वाभाविक हिंदी ‘पर आक्रमण’ रखा गया है; स्थानवाचक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: וְהֵמָּה
  choice: और
  rationale: स्वतंत्र सर्वनाम पलिश्तियों पर हल्का बल देता है। हिंदी में उसी कर्ता के साथ संयुक्त क्रिया-खंड ‘और ... रहे हैं’ विषय की निरंतरता को स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֹׁסִים
  choice: लूट रहे हैं
  rationale: युद्ध या छापे के प्रसंग में इसका अर्थ माल छीनना अथवा लूटना है; ‘लूट रहे हैं’ सामान्य पाठक के लिए स्पष्ट और सटीक है।
- source_word: אֶת הַגֳּרָנוֹת
  choice: खलिहानों को
  rationale: גֹּרֶן अनाज दाँवने का स्थान, अर्थात खलिहान, बताता है। मूल पाठ स्थान को ही सीधा कर्म बनाता है, इसलिए अनाज का अनुमान जोड़ने के बजाय ठोस रूपक बनाए रखा गया है।
