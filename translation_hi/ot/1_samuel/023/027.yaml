  text: पर एक दूत शाऊल के पास आकर कहने लगा, “जल्दी कीजिए और चलिए, क्योंकि फ़िलिस्तियों ने देश पर धावा बोल दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מַלְאָךְ
  choice: दूत
  rationale: इस संदर्भ में यह शब्द समाचार लाने वाले मानवीय संदेशवाहक को दर्शाता है; ‘दूत’ स्वाभाविक और संक्षिप्त है।
- source_word: מַהֲרָה וְלֵכָה
  choice: जल्दी कीजिए और चलिए
  rationale: दोनों आज्ञार्थक क्रियाओं को अलग रखते हुए उनकी तात्कालिकता व्यक्त की गई है; शाऊल के प्रति आदरसूचक बहुवचन आधुनिक हिंदी में स्वाभाविक है।
- source_word: פָשְׁטוּ
  choice: धावा बोल दिया है
  rationale: क्रिया का अर्थ आक्रमण या लूटमार के लिए अचानक चढ़ आने से है; यह प्रयोग सैन्य छापे की तीव्रता को सहज हिंदी में व्यक्त करता है।
- source_word: עַל־הָאָרֶץ
  choice: देश पर
  rationale: पूर्वसर्ग עַל का आक्रामक दिशा-संबंध ‘पर’ से और הָאָרֶץ का संदर्भगत अर्थ ‘देश’ से व्यक्त होता है।
