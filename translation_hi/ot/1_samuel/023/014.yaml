source:
  edition: WLC
  text: וַ/יֵּ֨שֶׁב דָּוִ֤ד בַּ/מִּדְבָּר֙ בַּ/מְּצָד֔וֹת וַ/יֵּ֥שֶׁב בָּ/הָ֖ר בְּ/מִדְבַּר זִ֑יף וַ/יְבַקְשֵׁ֤/הוּ שָׁאוּל֙ כָּל הַ/יָּמִ֔ים וְ/לֹֽא נְתָנ֥/וֹ אֱלֹהִ֖ים בְּ/יָדֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/023/014.yaml
  text: David stayed in the wilderness strongholds[a], and he stayed in the hill country in the wilderness of Ziph. Saul sought him all the days, but God did not give him into his hand.
translation:
  language: hi
  text: दाऊद निर्जन प्रदेश के गढ़ों में रहा, और वह ज़ीफ के निर्जन प्रदेश के पहाड़ी इलाके में रहा। शाऊल लगातार उसकी खोज करता रहा, पर परमेश्वर ने उसे उसके हाथ में नहीं दिया।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अर्थात, परमेश्वर ने दाऊद को शाऊल के वश में नहीं होने दिया। इब्रानी में: “उसे उसके हाथ में नहीं दिया।”'
    reason: इब्रानी मुहावरे का अर्थ स्पष्ट करने वाला शाब्दिक विकल्प।
lexical_decisions:
- source_word: וַיֵּשֶׁב
  choice: रहा
  rationale: ישׁב यहाँ किसी स्थान पर ठहरे रहने या निवास करने को दर्शाता है; ‘रहा’ स्वाभाविक आधुनिक हिन्दी में इस निरंतरता को व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר आवश्यक रूप से रेतीला मरुस्थल नहीं, बल्कि अनखेती और विरल आबादी वाला क्षेत्र हो सकता है; ‘निर्जन प्रदेश’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: בַּמְּצָדוֹת
  choice: गढ़ों में
  rationale: מְצָדוֹת रक्षात्मक और सुरक्षित ठिकानों को सूचित करता है; ‘गढ़’ संक्षिप्त रूप से उस सामरिक अर्थ को व्यक्त करता है।
- source_word: בָּהָר
  choice: पहाड़ी इलाके में
  rationale: הַר यहाँ किसी एक पर्वत-शिखर के बजाय पहाड़ी भूभाग का संकेत दे सकता है; यह हिन्दी में भौगोलिक संदर्भ के अनुकूल है।
- source_word: בְּמִדְבַּר זִיף
  choice: ज़ीफ के निर्जन प्रदेश में
  rationale: यह संबंधवाचक पदबंध ज़ीफ से जुड़े विशिष्ट निर्जन भूभाग को पहचानता है।
- source_word: וַיְבַקְשֵׁהוּ
  choice: उसकी खोज करता रहा
  rationale: בקשׁ यहाँ लगातार ढूँढ़ने या तलाश करने के अर्थ में है; यह चयन पीछा करने की निरंतरता स्पष्ट करता है।
- source_word: כָּל הַיָּמִים
  choice: लगातार
  rationale: शाब्दिक ‘सारे दिनों’ का आशय निरंतर खोज है; ‘लगातार’ आधुनिक हिन्दी में उसी कालगत बल को स्वाभाविक ढंग से देता है।
- source_word: וְלֹא נְתָנוֹ
  choice: उसे नहीं दिया
  rationale: נתן को मूल मुहावरे ‘हाथ में देना’ के साथ रखकर इब्रानी की प्रत्यक्ष संरचना और दैवी कर्तृत्व दोनों सुरक्षित रहते हैं।
- source_word: אֱלֹהִים
  choice: परमेश्वर
  rationale: यहाँ शब्द एकवचन अर्थ में इस्राएल के परमेश्वर को सूचित करता है; ‘परमेश्वर’ मानक और संप्रदाय-निरपेक्ष हिन्दी रूप है।
- source_word: בְּיָדוֹ
  choice: उसके हाथ में
  rationale: ‘हाथ में’ किसी के वश या अधिकार में सौंपे जाने का इब्रानी मुहावरा है; निकटवर्ती कर्ता शाऊल इसका स्वाभाविक संदर्भ है।
theological_decisions:
- issue: कथा में אֱלֹהִים द्वारा दाऊद की रक्षा
  choice: परमेश्वर ने उसे उसके हाथ में नहीं दिया
  alternative: परमेश्वर ने उसे शाऊल के वश में नहीं होने दिया
  rationale: चुना हुआ पाठ दाऊद की रक्षा का श्रेय सीधे परमेश्वर को देता है और साथ ही मूल ‘हाथ में देना’ मुहावरे को बनाए रखता है, बिना इस कथन को किसी विस्तृत धर्मवैज्ञानिक व्याख्या में बदलने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘निर्जन प्रदेश’ को ‘मरुभूमि’ पर वरीयता दी गई ताकि रेतीले रेगिस्तान का अनावश्यक बोध न आए; ‘गढ़’ दाऊद के सुरक्षित, रक्षात्मक ठिकानों का भाव रखता है।
