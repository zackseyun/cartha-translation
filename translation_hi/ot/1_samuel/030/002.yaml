translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘छोटे से लेकर बड़े तक’ मूल की संभावित आयु, आकार या सामाजिक स्थिति संबंधी व्यापकता को समय से पहले केवल ‘बूढ़े-जवान’ में सीमित नहीं करता।
