  yaml_path: translation/ot/1_samuel/030/002.yaml
  text: They took captive the women who were in it[a], from small to great. They did not kill anyone, but led them away and went on their way.
translation:
  language: hi
  text: उन्होंने उस नगर में रहनेवाली स्त्रियों को बंदी बना लिया—छोटे से बड़े तक सभी को। उन्होंने किसी को नहीं मारा, बल्कि उन्हें ले गए और अपने रास्ते चले गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁבּוּ
  choice: बंदी बना लिया
  rationale: שׁבה युद्ध में लोगों को बंदी बनाने का बोध देता है; यह प्रयोग स्वाभाविक हिन्दी में सैन्य संदर्भ को स्पष्ट रखता है।
- source_word: הַנָּשִׁים
  choice: स्त्रियों
  rationale: मूल शब्द का सामान्य अर्थ ‘स्त्रियाँ’ है; ‘पत्नियाँ’ कहना संदर्भ से संभव होते हुए भी मूल से अधिक संकीर्ण होगा।
- source_word: אֲשֶׁר בָּהּ
  choice: उस नगर में रहनेवाली
  rationale: स्त्रीलिंग एकवचन सर्वनाम पिछले पद के सिकलग नगर की ओर संकेत करता है। हिन्दी में केवल ‘उसमें’ की अपेक्षा ‘उस नगर में’ अधिक सहज और स्पष्ट है, जबकि कोई नई सूचना नहीं जोड़ता।
- source_word: מִקָּטֹן וְעַד גָּדוֹל
  choice: छोटे से लेकर बड़े तक
  rationale: यह चयन इब्रानी मुहावरे के रूप को बनाए रखता है और बिना अपवाद पूरे समूह का संकेत देता है; आयु वाला अर्थ संभावित है, पर अनिवार्य नहीं।
- source_word: לֹא הֵמִיתוּ אִישׁ
  choice: उन्होंने किसी को नहीं मारा
  rationale: यहाँ אִישׁ अनिश्चित व्यक्ति के अर्थ में है, केवल पुरुष के अर्थ में नहीं; ‘किसी को’ स्वाभाविक हिन्दी में यही भाव देता है।
- source_word: וַיִּנְהֲגוּ
  choice: उन्हें ले गए
  rationale: נהג का अर्थ आगे हाँकना या ले जाना है। बंदियों का बलपूर्वक ले जाया जाना संदर्भ से स्पष्ट है; यह संक्षिप्त हिन्दी उसी गति को व्यक्त करती है।
- source_word: וַיֵּלְכוּ לְדַרְכָּם
  choice: अपने रास्ते चले गए
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी समतुल्य है और उनके वहाँ से प्रस्थान कर आगे बढ़ने को व्यक्त करता है।
