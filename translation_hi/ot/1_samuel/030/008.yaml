base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/008.yaml
  text: And David inquired of the LORD, saying, “Should I pursue this raiding party? Will I overtake them?” And he said to him, “Pursue, for you will surely overtake them, and you will surely rescue.”
translation:
  language: hi
  text: तब दाऊद ने यहोवा से पूछा, “क्या मैं इस लुटेरे दल का पीछा करूँ? क्या मैं इसे पकड़ लूँगा?” यहोवा ने उससे कहा, “पीछा कर, क्योंकि तू निश्चय ही इसे पकड़ लेगा और निश्चय ही छुड़ा लेगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁאַל ... בַּיהוָה
  choice: यहोवा से पूछा
  rationale: यह अभिव्यक्ति परमेश्वर से मार्गदर्शन माँगने को दर्शाती है। वाचा-नाम יהוה को प्रचलित हिन्दी रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הַגְּדוּד
  choice: लुटेरे दल
  rationale: संदर्भ में यह अमालेकी छापामारों का दल है; ‘लुटेरे दल’ सामान्य पाठक के लिए अर्थ स्पष्ट रखता है।
- source_word: הַאַשִּׂגֶנּוּ / הַשֵּׂג תַּשִּׂיג
  choice: उन्हें जा पकड़ूँगा / निश्चय ही उन्हें जा पकड़ेगा
  rationale: נשׂג यहाँ पीछा करके दल तक पहुँच जाने या उसे पकड़ लेने के अर्थ में है। हिब्रू के infinitive absolute और finite verb के मेल का बल ‘निश्चय ही’ से व्यक्त किया गया है।
- source_word: וְהַצֵּל תַּצִּיל
  choice: और निश्चय ही छुड़ा लेगा
  rationale: נצל का causative रूप यहाँ बंदियों और लूटी वस्तुओं को शत्रु के हाथ से बचाकर वापस लाने को सूचित करता है। दोहरे क्रियारूप का बल ‘निश्चय ही’ से रखा गया है।
theological_decisions:
- issue: दिव्य नाम יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को सामान्य उपाधि में बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नाम ‘यहोवा’ से रखा गया है।
- issue: וַיֹּאמֶר में वक्ता की पहचान
  choice: उसने दाऊद से कहा
  alternative: यहोवा ने उससे कहा
  rationale: हिब्रू में कर्ता सर्वनाम से निहित है और निकटतम संदर्भ में יהוה है। ‘उसने’ मूल की शैली बनाए रखता है, जबकि ‘दाऊद से’ हिन्दी में संदर्भ को स्वाभाविक बनाता है।
- issue: उद्धार की वस्तु का अनुल्लेख
  choice: निश्चय ही छुड़ा लेगा
  alternative: सबको निश्चय ही छुड़ा लेगा
  rationale: हिब्रू में कर्म स्पष्ट रूप से नहीं दिया गया है। संदर्भ से लोग और संपत्ति समझे जा सकते हैं, इसलिए ‘सबको’ जोड़कर अस्पष्टता को अनावश्यक रूप से सीमित नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। आज्ञार्थक एकवचन ‘पीछा कर’ तथा ‘तू’ प्राचीन कथा-संवाद की सीधी शैली को स्वाभाविक हिन्दी में बनाए रखते हैं।
