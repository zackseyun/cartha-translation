  yaml_path: translation/ot/1_samuel/030/011.yaml
  text: They found an Egyptian man in the field and brought him to David[a]. They gave him bread, and he ate[c][b], and they gave him water to drink.
translation:
  language: hi
  text: उन्हें मैदान में एक मिस्री पुरुष मिला और वे उसे दाऊद के पास ले आए। उन्होंने उसे रोटी दी और उसने खाई; फिर उन्होंने उसे पानी पिलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּמְצְאוּ
  choice: उन्हें ... मिला
  rationale: हिब्रू कथात्मक रूप को स्वाभाविक आधुनिक हिन्दी भूतकाल में व्यक्त करता है; आरम्भिक संयोजक का अलग अनुवाद आवश्यक नहीं।
- source_word: אִישׁ מִצְרִי
  choice: एक मिस्री पुरुष
  rationale: אִישׁ और מִצְרִי दोनों को स्पष्ट रखते हुए व्यक्ति की पहचान को स्रोत के अनुरूप व्यक्त करता है।
- source_word: בַּשָּׂדֶה
  choice: मैदान में
  rationale: שָׂדֶה के सामान्य अर्थ को बिना 'खुले' जैसा अतिरिक्त विशेषण जोड़े स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיִּקְחוּ אֹתוֹ אֶל דָּוִד
  choice: वे उसे दाऊद के पास ले आए
  rationale: לקח यहाँ व्यक्ति को गंतव्य तक ले जाने का भाव देता है; दाऊद की ओर गति के लिए 'ले आए' स्वाभाविक है।
- source_word: וַיִּתְּנוּ לוֹ לֶחֶם
  choice: उन्होंने उसे रोटी दी
  rationale: לֶחֶם का विशिष्ट और सीधा अर्थ 'रोटी' सुरक्षित रखा गया है।
- source_word: וַיֹּאכַל
  choice: उसने खाई
  rationale: हिब्रू में कर्म निहित है; हिन्दी में स्त्रीलिंग क्रिया निकटवर्ती 'रोटी' को स्वाभाविक रूप से संदर्भित करती है।
- source_word: וַיַּשְׁקֻהוּ מָיִם
  choice: उन्होंने उसे पानी पिलाया
  rationale: שׁקה के हिफ़ील रूप का कारणात्मक अर्थ संक्षिप्त और सहज हिन्दी में ठीक प्रकार व्यक्त होता है।
