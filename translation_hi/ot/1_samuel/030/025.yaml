lexical_decisions:
- source_word: וַיְהִי
  choice: और ... ऐसा ही हुआ
  rationale: यह कथन पहले वर्णित व्यवस्था के स्थापित हो जाने को व्यक्त करता है; ‘ऐसा ही हुआ’ इब्रानी मुहावरे के परिणामसूचक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: מֵהַיּוֹם הַהוּא וָמָעְלָה
  choice: उस दिन से आगे
  rationale: यह समय-सूचक पदबंध उस दिन से भविष्य की ओर जारी रहने का भाव देता है; ‘उस दिन से आगे’ संक्षिप्त और स्वाभाविक है।
- source_word: וַיְשִׂמֶהָ
  choice: उसने इसे ... ठहराया
  rationale: שׂים का मूल भाव ‘रखना/स्थापित करना’ है। प्रसंग में स्त्रीलिंग प्रत्यय पहले बताई गई प्रथा की ओर संकेत करता है और कर्ता दाऊद है; ‘ठहराया’ किसी नियम को औपचारिक रूप देने का भाव व्यक्त करता है।
- source_word: לְחֹק
  choice: एक विधि
  rationale: חֹק किसी निर्धारित, स्थायी या विधिवत नियम को दर्शाता है; ‘विधि’ इसके औपचारिक और बाध्यकारी स्वरूप को सुरक्षित रखता है।
- source_word: וּלְמִשְׁפָּט
  choice: और नियम
  rationale: מִשְׁפָּט का अर्थ न्याय, न्यायिक निर्णय, विधान या प्रचलित नियम हो सकता है। यहाँ חֹק के समानांतर यह बाध्यकारी व्यवस्था को दर्शाता है; सामान्य पाठक के लिए ‘नियम’ स्वाभाविक है, जबकि वैकल्पिक कानूनी अर्थ पादटिप्पणी में रखा गया है।
- source_word: לְיִשְׂרָאֵל
  choice: इस्राएल के लिए
  rationale: לְ उन लोगों को दर्शाता है जिन पर यह व्यवस्था लागू होती है; ‘इस्राएल के लिए’ रूप और अर्थ दोनों को बनाए रखता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: आज तक
  rationale: यह इब्रानी मुहावरा लेखक के समय तक प्रथा के बने रहने को दर्शाता है; ‘आज तक’ इसका सहज आधुनिक हिन्दी रूप है।
