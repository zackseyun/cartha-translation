base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/015.yaml
  text: David said to him[a], “Will you lead me down to this raiding party?” He said, “Swear to me by God that you will not kill me or hand me over into the hand of my master, and I will lead you down to this raiding party.”
translation:
  language: hi
  text: दाऊद ने उससे कहा, “क्या तू मुझे उस लुटेरे दल तक नीचे ले जाएगा?” उसने कहा, “परमेश्वर की शपथ खा कि तू न तो मुझे मार डालेगा और न मुझे मेरे स्वामी के हाथ में सौंपेगा; तब मैं तुझे उस लुटेरे दल तक नीचे ले जाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הֲתוֹרִדֵנִי
  choice: क्या तू मुझे ... तक नीचे ले जाएगा
  rationale: ירד के हिफ़ील रूप का कारणवाचक और दिशासूचक भाव सुरक्षित रखते हुए प्रसंगानुकूल स्वाभाविक हिन्दी दी गई है।
- source_word: הַגְּדוּד
  choice: लुटेरा दल
  rationale: यहाँ शब्द अमालेकी छापामार समूह को सूचित करता है; ‘लुटेरा दल’ उसके संगठित और लूटमार करने वाले चरित्र को स्पष्ट करता है।
- source_word: הִשָּׁבְעָה לִּי בֵאלֹהִים
  choice: परमेश्वर की शपथ खाकर मुझसे कह
  rationale: परमेश्वर को साक्षी मानकर गंभीर प्रतिज्ञा माँगने का भाव आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप से व्यक्त होता है।
- source_word: אִם תְּמִיתֵנִי
  choice: तू न तो मुझे मार डालेगा
  rationale: शपथ-सूत्र में אִם का नकारात्मक आशय हिन्दी में स्पष्ट किया गया है; क्रिया का मृत्यु-दंड/हत्या संबंधी बल बना रहता है।
- source_word: תַּסְגִּרֵנִי בְּיַד אֲדֹנִי
  choice: मेरे स्वामी के हाथ में सौंपेगा
  rationale: ‘हाथ में’ वाला इब्रानी मुहावरा अधिकार और नियंत्रण का भाव बनाए रखता है, जबकि ‘सौंपेगा’ क्रिया को सहज हिन्दी देता है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यह मिस्री सेवक के मानवीय मालिक का उल्लेख है; ‘स्वामी’ संबंध और पद दोनों को गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְאוֹרִדְךָ
  choice: तुझे ... तक नीचे ले जाऊँगा
  rationale: पहली क्रिया के समान ירד के हिफ़ील का कारणवाचक और दिशासूचक अर्थ लगातार रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप; संवाद में सामाजिक-सांस्कृतिक प्रसंग के अनुरूप एकवचन ‘तू’ रखा गया है। ‘नीचे’ को दोनों बार बनाए रखकर मूल की दिशासूचक पुनरावृत्ति सुरक्षित की गई है।
