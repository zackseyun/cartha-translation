translation:
  language: hi
  text: जब दाऊद और उसके लोग नगर में पहुँचे, तो देखा कि वह आग से जला दिया गया था और उनकी पत्नियाँ, बेटे और बेटियाँ बंदी बना लिए गए थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִנֵּה
  choice: तो देखा कि
  rationale: हिब्रू कथात्मक विस्मय और दृश्य की अचानक पहचान को आधुनिक, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שְׂרוּפָה בָּאֵשׁ
  choice: आग से जला दिया गया था
  rationale: स्त्रीलिंग निष्क्रिय कृदंत नगर की पहले ही पूरी हो चुकी दशा बताता है; 'आग से' मूल की स्पष्ट अभिव्यक्ति को बनाए रखता है।
- source_word: נִשְׁבּוּ
  choice: बंदी बना लिए गए थे
  rationale: निफ़अल पूर्ण क्रिया का निष्क्रिय अर्थ और दाऊद के पहुँचने से पहले घट चुकी घटना, दोनों सुरक्षित हैं।
