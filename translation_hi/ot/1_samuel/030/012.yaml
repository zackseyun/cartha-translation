base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/012.yaml
  text: They gave him a piece of fig cake and two clusters of raisins[a], and he ate, and his spirit returned to him[c][b], for he had not eaten bread or drunk water for three days and three nights.
translation:
  language: hi
  text: उन्होंने उसे अंजीर की टिकिया का एक टुकड़ा और किशमिश की दो टिकियाँ[a] दीं। उसने खाया, और उसमें फिर जान आ गई[b], क्योंकि उसने तीन दिन और तीन रातों तक न रोटी खाई थी, न पानी पिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “किशमिश के दो गुच्छे।”
    reason: lexical_alternative
  - marker: b
    text: या “उसकी शक्ति लौट आई” अथवा “वह फिर सँभल गया”; शाब्दिक अर्थ, “उसका प्राण/उसकी आत्मा उसके पास लौट आई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: פֶלַח דְּבֵלָה
  choice: अंजीर की टिकिया का एक टुकड़ा
  rationale: פֶלַח का अर्थ टुकड़ा या फाँक है और דְּבֵלָה दबाए हुए अंजीरों से बनी टिकिया को दर्शाता है। यह हिन्दी में प्राचीन खाद्य पदार्थ को स्वाभाविक और पर्याप्त रूप से स्पष्ट करता है।
- source_word: שְׁנֵי צִמֻּקִים
  choice: किशमिश की दो टिकियाँ
  rationale: צִמֻּקִים किशमिश के गिने जा सकने वाले दो संकुचित समूहों को दर्शाता है। इस प्रसंग में 'टिकियाँ' हिन्दी में खाद्य-वस्तु का स्वाभाविक बोध कराता है, यद्यपि 'गुच्छे' भी संभव है।
- source_word: וַתָּשָׁב רוּחוֹ אֵלָיו
  choice: उसके प्राण फिर उसमें लौट आए
  rationale: यह इब्रानी बिंब को बनाए रखता है और हिन्दी में चेतना तथा शक्ति लौटने का स्वाभाविक मुहावरा है; केवल 'वह सँभल गया' कहने से मूल का चित्र खो जाता।
- source_word: לֶחֶם
  choice: रोटी
  rationale: לֶחֶם का ठोस अर्थ 'रोटी' है। पानी के साथ इसका युग्म हिन्दी में स्वाभाविक है, इसलिए व्यापक 'भोजन' आवश्यक नहीं।
- source_word: שָׁתָה מַיִם
  choice: पानी पिया था
  rationale: मूल पाठ विशेष रूप से पानी पीने का उल्लेख करता है; ठोस अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילוֹת
  choice: तीन दिन और तीन रात
  rationale: समय की सीधी अभिव्यक्ति को बिना व्याख्यात्मक परिवर्तन के रखा गया है।
theological_decisions:
- issue: רוּחַ का अर्थ
  choice: प्राण
  alternative: आत्मा; शक्ति; होश
  rationale: यहाँ कथन शारीरिक पुनर्जीवन के प्रसंग में एक इब्रानी मुहावरा है। 'प्राण' मूल बिंब और प्रसंगगत अर्थ दोनों को बनाए रखता है, बिना इसे मनुष्य की आत्मा के स्वरूप पर किसी सिद्धान्तगत दावे में बदलने के।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण कथात्मक शैली अपनाई गई है। 'न तो...न...' से भोजन और पानी दोनों के अभाव पर मूल का समान बल बना रहता है।
