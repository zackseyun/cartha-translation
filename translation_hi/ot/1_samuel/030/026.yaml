  to: जब दाऊद सिकलग पहुँचा, तो उसने लूट के माल में से कुछ यहूदा के पुरनियों, अर्थात् अपने मित्रों, को यह कहते हुए भेजा, “देखो, यह याहवे के शत्रुओं से प्राप्त लूट में से तुम्हारे लिए एक भेंट[a] है।”
