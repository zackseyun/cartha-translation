  text: וַ/יָּבֹ֤א דָוִד֙ אֶל צִ֣קְלַ֔ג וַ/יְשַׁלַּ֧ח מֵֽ/הַ/שָּׁלָ֛ל לְ/זִקְנֵ֥י יְהוּדָ֖ה לְ/רֵעֵ֣/הוּ לֵ/אמֹ֑ר הִנֵּ֤ה לָ/כֶם֙ בְּרָכָ֔ה מִ/שְּׁלַ֖ל אֹיְבֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/026.yaml
  text: When David came to Ziklag[a], he sent some of the plunder to the elders of Judah, his friends, saying, “Look, here is a gift for you from the plunder of the enemies of Yahweh.”
translation:
  language: hi
  text: जब दाऊद सिकलग पहुँचा, तो उसने लूट के माल में से कुछ यहूदा के पुरनियों, अर्थात् अपने मित्रों, को यह कहते हुए भेजा, “देखो, यह याहवे के शत्रुओं से प्राप्त लूट में से तुम्हारे लिए एक भेंट[a] है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “आशीष।” इब्रानी शब्द का अर्थ “आशीष” हो सकता है, पर यहाँ यह लूट के माल में से भेजी गई भौतिक भेंट को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּבֹא דָוִד אֶל צִקְלַג
  choice: जब दाऊद सिकलग पहुँचा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘जब… पहुँचा’ अगले कार्य के साथ समय-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है। स्थान-नाम צִקְלַג का लिप्यंतरण ‘सिकलग’ किया गया है।
- source_word: וַיְשַׁלַּח מֵהַשָּׁלָל
  choice: उसने लूट के माल में से कुछ… भेजा
  rationale: מִן बताता है कि कुल युद्ध-लूट में से एक अंश भेजा गया। ‘लूट का माल’ आधुनिक हिन्दी में שָׁלָל का सैन्य संदर्भ स्पष्ट करता है।
- source_word: לְזִקְנֵי יְהוּדָה
  choice: यहूदा के पुरनियों के पास
  rationale: यहाँ זָקֵן आयु मात्र नहीं, बल्कि समुदाय के मान्य अगुओं को दर्शाता है; बाइबलीय हिन्दी में ‘पुरनिये’ इस संस्थागत अर्थ को संक्षेप में व्यक्त करता है।
- source_word: לְרֵעֵהוּ
  choice: जो उसके मित्र थे
  rationale: רֵעַ के ‘मित्र/साथी/पड़ोसी’ अर्थों में संदर्भ दाऊद के मैत्रीपूर्ण संबंध वाले यहूदी अगुओं की ओर संकेत करता है; ‘मित्र’ इस संबंध को सहज रूप से व्यक्त करता है।
- source_word: הִנֵּה לָכֶם
  choice: देखो, यह तुम्हारे लिए… है
  rationale: הִנֵּה ध्यान आकर्षित करने वाला संकेतवाचक अव्यय है। ‘देखो’ उसका बल बनाए रखते हुए आधुनिक और स्वाभाविक है।
- source_word: בְּרָכָה
  choice: एक भेंट
  rationale: शब्द का मूल अर्थ ‘आशीष’ है, पर यहाँ लूट में से भेजी गई ठोस वस्तु के लिए प्रयुक्त है। ‘भेंट’ संदर्भगत आशय देता है और शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: מִשְּׁלַל אֹיְבֵי יְהוָה
  choice: यहोवा के शत्रुओं से लूटे गए माल में से
  rationale: निर्माण युद्ध में शत्रुओं से प्राप्त माल को दर्शाता है। हिन्दी में ‘शत्रुओं से लूटे गए माल’ स्रोत और सैन्य संदर्भ दोनों स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि ‘प्रभु’ से।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु; याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों में पहचाने जाने वाले रूप ‘यहोवा’ से नाम और उपाधि का भेद सुरक्षित रहता है।
- issue: בְּרָכָה का शाब्दिक या संदर्भगत अर्थ
  choice: भेंट
  alternative: आशीष
  rationale: तत्काल प्रसंग में दाऊद युद्ध-लूट का एक भौतिक भाग भेजता है, इसलिए मुख्य पाठ में ‘भेंट’ अर्थ को साफ करता है; ‘आशीष’ की वास्तविक शब्दगत प्रतिध्वनि पादटिप्पणी में रखी गई है।
- issue: אֹיְבֵי יְהוָה में संबंध का स्वरूप
  choice: यहोवा के शत्रु
  alternative: वे शत्रु जिनसे यहोवा ने लड़ाई की
  rationale: इब्रानी संबंधवाचक संरचना शत्रुओं को यहोवा के विरोधी बताती है, पर यह स्पष्ट नहीं करती कि स्वयं यहोवा प्रत्यक्ष योद्धा के रूप में वर्णित हैं; इसलिए अधिक व्याख्यात्मक विकल्प नहीं अपनाया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कथात्मक शैली रखी गई है। ‘देखो’ को पुरातन ‘निहारो’ या अत्यधिक औपचारिक विकल्पों पर प्राथमिकता दी गई। ‘पुरनिये’ बाइबलीय-सामुदायिक पद को दर्शाता है, जबकि वाक्य-विन्यास सामान्य पाठकों के लिए स्पष्ट रखा गया है।
