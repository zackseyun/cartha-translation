    reason: lexical_alternative
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: और ... में रहनेवालों को
  rationale: संयोजक וְ, संबंधसूचक לְ और אֲשֶׁר का यह प्रयोग वितरण-सूची में उन लोगों को दर्शाता है जो संबंधित नगर में रहते थे; हिंदी में ‘में रहनेवालों को’ स्वाभाविक रूप से प्राप्तकर्ताओं और स्थान—दोनों को स्पष्ट करता है।
- source_word: בְּחָרְמָה
  choice: होर्मा में
  rationale: בְּ स्थानवाचक है और חָרְמָה नगर का नाम है; इसलिए नाम का लिप्यंतरण करके ‘में’ लगाया गया है।
- source_word: בְּבוֹר עָשָׁן
  choice: बोर-आशान में
  rationale: यह स्थान-नाम है। इसके घटकों का अर्थ ‘कुआँ/गड्ढा’ और ‘धुआँ’ हो सकता है, पर यहाँ उनका अनुवाद करने के बजाय संयुक्त नाम का लिप्यंतरण उचित है।
- source_word: בַּעֲתָךְ
  choice: अताक में
  rationale: בַּ स्थानवाचक उपसर्ग है और עֲתָךְ स्थान-नाम; आधुनिक हिंदी उच्चारण के अनुकूल इसे ‘अताक’ लिप्यंतरित किया गया है।
