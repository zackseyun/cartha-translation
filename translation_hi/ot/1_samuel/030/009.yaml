translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘छह सौ पुरुष’ मूल के पुरुष-समूह को दर्शाता है। दो वाक्यों में विभाजन हिन्दी में स्पष्टता बढ़ाता है, जबकि मूल की घटनाक्रम-श्रृंखला सुरक्षित रहती है।
