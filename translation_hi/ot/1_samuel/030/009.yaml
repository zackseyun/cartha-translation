  text: וַ/יֵּ֣לֶךְ דָּוִ֗ד ה֚וּא וְ/שֵׁשׁ מֵא֥וֹת אִישׁ֙ אֲשֶׁ֣ר אִתּ֔/וֹ וַ/יָּבֹ֖אוּ עַד נַ֣חַל הַ/בְּשׂ֑וֹר וְ/הַ/נּֽוֹתָרִ֖ים עָמָֽדוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/009.yaml
  text: So David went[a], he and the six hundred men who were with him, and they came to the Brook Besor[b], where those who were left behind stayed.
translation:
  language: hi
  text: तब दाऊद अपने साथ के छह सौ पुरुषों को लेकर चला। वे बसोर नाले[a] तक पहुँचे, और जो पीछे रह गए थे, वे वहीं ठहर गए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बसोर नाला’ का अनुवाद ‘बसोर की मौसमी जलधारा’ या ‘बसोर की घाटी’ भी किया जा सकता है।
    reason: cultural_note
  - marker: b
    text: 'शाब्दिक अर्थ: ‘खड़े रहे’; यहाँ इसका भाव ‘वहीं रुके रहे’ या ‘ठहर गए’ है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ דָּוִד הוּא וְשֵׁשׁ מֵאוֹת אִישׁ אֲשֶׁר אִתּוֹ
  choice: तब दाऊद अपने साथ के छह सौ पुरुषों को लेकर चला
  rationale: וַיֵּלֶךְ कथा को आगे बढ़ाता है, इसलिए स्वाभाविक हिन्दी में ‘तब ... चला’ चुना गया। הוּא וְ... की appositional रचना को शब्दशः असहज ढंग से दोहराने के बजाय ‘अपने साथ के ... को लेकर’ से दाऊद और उसके साथ के छह सौ पुरुषों की संयुक्त यात्रा स्पष्ट होती है।
- source_word: וַיָּבֹאוּ
  choice: वे ... तक पहुँचे
  rationale: बहुवचन क्रिया दाऊद और उसके पुरुषों को साथ रखती है। यात्रा के गन्तव्य के साथ ‘पहुँचे’ हिन्दी में בוא का स्वाभाविक अर्थ देता है।
- source_word: עַד נַחַל הַבְּשׂוֹר
  choice: बसोर नाले तक
  rationale: נַחַל किसी जलधारा, मौसमी नाले या उसकी घाटी को सूचित कर सकता है। ‘नाला’ सामान्य हिन्दी पाठक के लिए सुबोध है और स्थलरूप की सम्भावित मौसमी प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְהַנּוֹתָרִים עָמָדוּ
  choice: और जो पीछे रह गए थे, वे वहीं ठहर गए
  rationale: הַנּוֹתָרִים शेष रह जानेवालों को और עָמָדוּ इस यात्रा-सन्दर्भ में रुकने या ठहरने को बताता है। ‘ठहर गए’ शब्दशः ‘खड़े रहे’ से अधिक स्वाभाविक है; ‘वहीं’ बसोर नाले पर उनके रुकने का सम्बन्ध स्पष्ट करता है।
