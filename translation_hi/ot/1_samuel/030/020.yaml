  text: David took all the flocks and the herds[a]. They drove them ahead of the other livestock, and said[b], “This is David’s spoil.”
translation:
  language: hi
  text: दाऊद ने सारी भेड़-बकरियाँ और गाय-बैल ले लिए। वे उन्हें उस पशुधन[a] के आगे हाँका और कहा, “यह दाऊद की लूट है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: संभवतः नए लिए गए पशुओं को पहले वापस पाए गए पशुधन के आगे सार्वजनिक रूप से हाँका गया, और वे उन्हें दाऊद की लूट घोषित कर रहे थे।
    reason: सांस्कृतिक और संदर्भगत टिप्पणी; ‘उस पशुधन’ के संकेत और जुलूस-जैसी क्रिया का संभावित आशय स्पष्ट करती है, पर इसे मुख्य पाठ में निश्चित नहीं बनाती।
lexical_decisions:
- source_word: וַיִּקַּח
  choice: ले लिए
  rationale: לקח का सामान्य कथात्मक अर्थ ‘लेना’ है; बहुवचन पशुओं के साथ ‘ले लिए’ स्वाभाविक है और अनावश्यक रूप से बलपूर्वक कब्ज़े का भाव नहीं जोड़ता।
- source_word: הַצֹּאן וְהַבָּקָר
  choice: भेड़-बकरियाँ और गाय-बैल
  rationale: צאן छोटे पालतू पशुओं, विशेषकर भेड़-बकरियों, और בקר बड़े मवेशियों को दर्शाता है; यह जोड़ी आधुनिक हिन्दी में दोनों वर्ग स्पष्ट करती है।
- source_word: נָהֲגוּ
  choice: हाँका
  rationale: נהג यहाँ पशुओं को आगे चलाने/हाँकने की क्रिया है; ‘हाँका’ पशुधन के संदर्भ में सटीक और स्वाभाविक है।
- source_word: לִפְנֵי הַמִּקְנֶה הַהוּא
  choice: उस पशुधन के आगे
  rationale: शाब्दिक स्थानिक संबंध और הַהוּא के संकेतवाचक अर्थ को बनाए रखता है; ‘दूसरे पशुधन’ कहने की व्याख्यात्मक वृद्धि से बचता है।
- source_word: וַיֹּאמְרוּ
  choice: लोगों ने ... कहा
  rationale: हिब्रू क्रिया बहुवचन है, पर कर्ता स्पष्ट रूप से निर्दिष्ट नहीं; ‘लोगों’ से बहुवचन भाव स्वाभाविक हिन्दी में व्यक्त होता है, बिना किसी खास समूह की पहचान तय किए।
- source_word: שְׁלַל דָּוִד
  choice: दाऊद की लूट
  rationale: שׁלל युद्ध या छापे में प्राप्त लूट को दर्शाता है; ‘लूट’ आधुनिक हिन्दी में संक्षिप्त, स्पष्ट और प्रसंगानुकूल है।
