    text: इब्रानी शब्द का अर्थ जलधारा, मौसमी नाला या वादी भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּרְדֹּף
  choice: पीछा करना जारी रखा
  rationale: רדף का अर्थ पीछा करना है; प्रसंग में दाऊद पहले से अभियान पर है, इसलिए ‘जारी रखा’ हिंदी में घटनाक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הוּא וְאַרְבַּע מֵאוֹת אִישׁ
  choice: चार सौ पुरुषों के साथ
  rationale: इब्रानी का शाब्दिक रूप ‘वह और चार सौ पुरुष’ है; हिंदी कथात्मक शैली में ‘दाऊद ने चार सौ पुरुषों के साथ’ अधिक सहज है और समूह का अर्थ सुरक्षित रखता है।
- source_word: וַיַּעַמְדוּ
  choice: पीछे रह गए
  rationale: עמד का मूल अर्थ ‘खड़े होना/ठहरना’ है, पर पीछा करते दल के संदर्भ में इसका आशय आगे न जाकर पीछे रह जाना है।
- source_word: אֲשֶׁר פִּגְּרוּ מֵעֲבֹר
  choice: वे इतने थक गए थे कि ... पार नहीं कर सके
  rationale: दुर्लभ क्रिया פגר यहाँ थककर शिथिल या आगे बढ़ने में असमर्थ होने का भाव देती है; परिणामसूचक हिंदी रचना अर्थ को स्पष्ट और स्वाभाविक रखती है।
- source_word: נַחַל הַבְּשׂוֹר
  choice: बसोर नाला
  rationale: נחל किसी जलधारा, मौसमी नाले या वादी को सूचित कर सकता है। ‘नाला’ आधुनिक हिंदी में भू-आकृतिक अर्थ के निकट है, यद्यपि इसकी प्रकृति संदर्भानुसार बदल सकती है।
