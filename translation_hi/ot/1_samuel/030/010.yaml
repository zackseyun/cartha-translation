  text: तब दाऊद ने चार सौ पुरुषों के साथ पीछा किया, जबकि दो सौ पुरुष पीछे रह गए; वे इतने थक गए थे कि बसोर नाले[a] को पार नहीं कर सके।
  philosophy: optimal-equivalence
  footnotes:
