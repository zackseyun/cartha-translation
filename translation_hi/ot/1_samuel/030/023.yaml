source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֔ד לֹֽא תַעֲשׂ֥וּ כֵ֖ן אֶחָ֑/י אֵ֠ת אֲשֶׁר נָתַ֨ן יְהוָ֥ה לָ֨/נוּ֙ וַ/יִּשְׁמֹ֣ר אֹתָ֔/נוּ וַ/יִּתֵּ֗ן אֶֽת הַ/גְּד֛וּד הַ/בָּ֥א עָלֵ֖י/נוּ בְּ/יָדֵֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/023.yaml
  text: But David said[a], “You must not do so, my brothers, with what Yahweh has given us[c][b]. He has preserved us and has given into our hand the raiding band that came against us.”
translation:
  language: hi
  text: पर दाऊद ने कहा, “मेरे भाइयो, यहोवा ने हमें जो दिया है, उसके साथ तुम ऐसा न करो। उसने हमारी रक्षा की है और उस लुटेरे दल को, जो हमारे विरुद्ध आया था, हमारे हाथ में सौंप दिया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לֹא תַעֲשׂוּ כֵן
  choice: तुम ऐसा न करो
  rationale: बहुवचन में दिए गए सीधे निषेध को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֶחָי
  choice: मेरे भाइयो
  rationale: दाऊद अपने पुरुष साथियों को भ्रातृ-संबोधन देता है; सम्बोधन कारक का स्वाभाविक हिन्दी रूप रखा गया है।
- source_word: אֵת אֲשֶׁר נָתַן יְהוָה לָנוּ
  choice: यहोवा ने हमें जो दिया है, उसके साथ
  rationale: संक्षिप्त और कुछ कठिन इब्रानी रचना यहाँ चर्चा के विषय—मिली हुई लूट के व्यवहार—को सामने लाती है; हिन्दी वाक्य इसी संबंध को स्पष्ट रखते हुए अनावश्यक व्याख्या नहीं जोड़ता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय ईश्वरीय नाम को हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
- source_word: וַיִּשְׁמֹר אֹתָנוּ
  choice: उसने हमारी रक्षा की
  rationale: שׁמר युद्ध के प्रसंग में सुरक्षा और बचाव का बोध देता है; ‘रक्षा की’ सहज आधुनिक हिन्दी है।
- source_word: הַגְּדוּד
  choice: लुटेरा दल
  rationale: इस प्रसंग में शब्द शत्रु की छापा मारने वाली टुकड़ी को सूचित करता है; ‘लुटेरा दल’ साधारण पाठक के लिए स्पष्ट है।
- source_word: הַבָּא עָלֵינוּ
  choice: जो हमारे विरुद्ध आया था
  rationale: मूल के दिशात्मक और विरोधी भाव को बनाए रखता है, बिना इसे अधिक विशिष्ट ‘हमला किया’ में बदलने के।
- source_word: בְּיָדֵנוּ
  choice: हमारे हाथ में
  rationale: सत्ता या नियंत्रण सूचित करने वाले इब्रानी मुहावरे को हिन्दी के समान और सुबोध मुहावरे से संरक्षित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को नाम के रूप में रखा गया है, ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: विजय में ईश्वरीय और मानवीय कर्तृत्व
  choice: उसने हमारी रक्षा की और… हमारे हाथ में कर दिया
  alternative: उसने हमें विजय दी
  rationale: मूल पाठ ईश्वर की रक्षा और शत्रु को उनके अधिकार में देने—दोनों कथनों को अलग रखता है; सामान्यीकृत ‘विजय दी’ इस संरचना और बल को घटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, देवनागरी; शैली सरल, वर्तमान और गरिमापूर्ण है। ‘मेरे भाइयो’ मूल के प्रत्यक्ष भ्रातृ-संबोधन को रखता है। इब्रानी के ‘हाथ में’ मुहावरे को हिन्दी में स्वाभाविक होने के कारण बनाए रखा गया है।
