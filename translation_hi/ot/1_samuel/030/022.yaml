  text: וַ/יַּ֜עַן כָּל אִֽישׁ רָ֣ע וּ/בְלִיַּ֗עַל מֵֽ/הָ/אֲנָשִׁים֮ אֲשֶׁ֣ר הָלְכ֣וּ עִם דָּוִד֒ וַ/יֹּאמְר֗וּ יַ֚עַן אֲשֶׁ֣ר לֹֽא הָלְכ֣וּ עִמִּ֔/י לֹֽא נִתֵּ֣ן לָ/הֶ֔ם מֵ/הַ/שָּׁלָ֖ל אֲשֶׁ֣ר הִצַּ֑לְנוּ כִּֽי אִם אִ֤ישׁ אֶת אִשְׁתּ/וֹ֙ וְ/אֶת בָּנָ֔י/ו וְ/יִנְהֲג֖וּ וְ/יֵלֵֽכוּ־־־־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/022.yaml
  text: Then every wicked and worthless man from among the men who had gone with David answered and said[a], “Because they did not go with me, we will not give them any of the spoil that we recovered[c][b], except that each man may take his wife and his children and lead them away and go.”
translation:
  language: hi
  text: तब दाऊद के साथ गए लोगों में से हर दुष्ट और निकम्मे आदमी ने उत्तर दिया, “क्योंकि वे मेरे साथ[a] नहीं गए, इसलिए जो लूट का माल हमने वापस पाया है, उसमें से हम उन्हें कुछ नहीं देंगे। बस हर आदमी अपनी पत्नी और अपने बच्चों को ले जाए और चला जाए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ “मेरे साथ” है, जबकि बोलने वाले एक समूह हैं और आगे “हम” कहते हैं।
    reason: source_ambiguity
lexical_decisions:
- source_word: וַיַּעַן ... וַיֹּאמְרוּ
  choice: उत्तर दिया
  rationale: दोनों कथन-क्रियाओं को हिंदी में यांत्रिक रूप से ‘उत्तर दिया और कहा’ कहना अनावश्यक पुनरुक्ति लगेगा; ‘उत्तर दिया’ प्रत्युत्तर और प्रत्यक्ष वचन की भूमिका स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל אִישׁ רָע וּבְלִיַּעַל
  choice: हर दुष्ट और निकम्मे आदमी
  rationale: רָע की नैतिक बुराई को ‘दुष्ट’ और בְלִיַּעַל के अवमूल्यनकारी वर्णन को ‘निकम्मा’ व्यक्त करता है; इसे बाद के व्यक्तिवाचक नाम ‘बेलियाल’ के रूप में नहीं लिया गया। संयुक्त विशेषण के कारण हिंदी में ‘आदमी’ का परसर्गीय रूप प्रयुक्त है।
- source_word: מֵהָאֲנָשִׁים אֲשֶׁר הָלְכוּ עִם דָּוִד
  choice: दाऊद के साथ गए लोगों में से
  rationale: מִן का अंशवाचक बल स्पष्ट करता है कि बोलने वाले दाऊद के साथ गए पूरे दल में से कुछ लोग थे।
- source_word: יַעַן אֲשֶׁר לֹא הָלְכוּ עִמִּי
  choice: क्योंकि वे मेरे साथ नहीं गए
  rationale: कारणसूचक संबंध और स्रोत का प्रथम पुरुष एकवचन ‘मेरे साथ’ दोनों सुरक्षित रखे गए हैं, यद्यपि आगे वक्ता बहुवचन में बोलते हैं।
- source_word: לֹא נִתֵּן לָהֶם
  choice: इसलिए ... हम उन्हें कुछ नहीं देंगे
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ समूह के दृढ़ निश्चय को व्यक्त करती है; हिंदी भविष्यकाल इसे स्वाभाविक ढंग से रखता है। ‘इसलिए’ कारण से निष्कर्ष का संबंध स्पष्ट करता है।
- source_word: מֵהַשָּׁלָל אֲשֶׁר הִצַּלְנוּ
  choice: जो लूट का माल हमने वापस पाया है, उसमें से
  rationale: שָׁלָל युद्ध में लिया गया माल है, और נצל का हिफ़ील यहाँ अमालेकियों से उसे फिर प्राप्त करने के प्रसंग में ‘वापस पाना’ है। ‘में से’ अंशवाचक מִן को दर्शाता है।
- source_word: כִּי אִם אִישׁ אֶת אִשְׁתּוֹ וְאֶת בָּנָיו
  choice: बस हर आदमी अपनी पत्नी और अपने बच्चों को ले जाए
  rationale: כִּי אִם एकमात्र रियायत प्रस्तुत करता है। אִישׁ को वितरणात्मक ‘हर आदमी’ और בָּנָיו को पारिवारिक प्रसंग में समावेशी ‘बच्चों’ के रूप में व्यक्त किया गया है। ‘ले जाए’ लुप्त किंतु संदर्भ से स्पष्ट क्रिया को अगले נהג से स्वाभाविक हिंदी में ग्रहण करता है।
- source_word: וְיִנְהֲגוּ וְיֵלֵכוּ
  choice: ले जाए और चला जाए
  rationale: 'दोनों क्रियाओं का आशय रखा गया है: अपने परिवार को साथ ले जाना और स्वयं प्रस्थान करना। हिंदी में एकवचन वितरणात्मक कर्ता के अनुरूप क्रियाएँ एकवचन हैं।'
theological_decisions:
- issue: בְלִיַּעַל का अर्थ
  choice: निकम्मा
  alternative: व्यवस्थाहीन; बेलियाल
  rationale: यहाँ शब्द मनुष्यों के चरित्र का अपमानजनक वर्णन है, किसी दुष्ट आत्मिक सत्ता का व्यक्तिवाचक नाम नहीं। ‘निकम्मा’ मूल्यहीनता का बल रखता है और बाद की धार्मिक अर्थछाया आरोपित नहीं करता।
- issue: עִמִּי में वक्ता की वचन-संख्या
  choice: मेरे साथ
  alternative: हमारे साथ
  rationale: मसोरेटिक पाठ स्पष्ट रूप से प्रथम पुरुष एकवचन प्रत्यय रखता है। आगे का ‘हम’ तनाव उत्पन्न करता है, पर अनुवाद ने इसे सामंजस्य बैठाकर मिटाया नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण कथात्मक शैली। ‘लूट का माल’ सामान्य पाठक के लिए स्पष्ट है। प्रत्यक्ष वचन में स्रोत का ‘मेरे साथ/हम’ वचन-परिवर्तन सुरक्षित रखा गया है और पादटिप्पणी में बताया गया है।
