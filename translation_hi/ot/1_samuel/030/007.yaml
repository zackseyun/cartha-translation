source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶל אֶבְיָתָ֤ר הַ/כֹּהֵן֙ בֶּן אֲחִימֶ֔לֶךְ הַגִּֽישָׁ/ה נָּ֥א לִ֖/י הָ/אֵפֹ֑ד וַ/יַּגֵּ֧שׁ אֶבְיָתָ֛ר אֶת הָ/אֵפֹ֖ד אֶל דָּוִֽד־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/007.yaml
  text: Then David said to Abiathar the priest[a], the son of Ahimelech[b], “Please bring me the ephod.” So Abiathar brought the ephod to David.
translation:
  language: hi
  text: तब दाऊद ने अहीमेलेक के पुत्र, याजक एब्यातार से कहा, “कृपया एपोद मेरे पास ले आओ[a]।” तब एब्यातार एपोद[b] दाऊद के पास ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “एपोद मेरे सामने प्रस्तुत करो।” इब्रानी क्रिया का अर्थ किसी वस्तु को पास लाना या प्रस्तुत करना है।'
    reason: lexical_alternative
  - marker: b
    text: “एपोद” इस्राएल की उपासना में प्रयुक्त एक याजकीय पवित्र वस्तु या परिधान था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַכֹּהֵן בֶּן אֲחִימֶלֶךְ
  choice: अहीमेलेक के पुत्र, याजक एब्यातार
  rationale: मूल पाठ में एब्यातार के पद और वंश—दोनों की पहचान दी गई है; हिन्दी में यह क्रम स्पष्ट और स्वाभाविक है।
- source_word: הַגִּישָׁה נָּא לִי
  choice: कृपया ... मेरे पास ले आओ
  rationale: हिफ़ील आज्ञार्थक रूप किसी वस्तु को निकट लाने या प्रस्तुत करने का भाव देता है, और נָא विनम्र अनुरोध सूचित करता है।
- source_word: הָאֵפֹד
  choice: एपोद
  rationale: यह इस्राएली याजकीय उपासना से जुड़ी विशिष्ट वस्तु या परिधान का नाम है; इसका सटीक हिन्दी पर्याय नहीं है, इसलिए लिप्यंतरण रखा गया है।
- source_word: וַיַּגֵּשׁ
  choice: तब ... ले आया
  rationale: यह उसी נגשׁ धातु का कारणवाचक रूप है और यहाँ अनुरोध के प्रत्युत्तर में वस्तु को दाऊद के पास लाने का कार्य बताता है।
- source_word: אֶל דָּוִד
  choice: दाऊद के पास
  rationale: पूर्वसर्ग दाऊद की ओर गति को दर्शाता है; ‘दाऊद के पास’ हिन्दी में इसका सहज रूप है।
theological_decisions:
- issue: אֵפוֹד को याजकीय परिधान या पवित्र वस्तु के रूप में स्पष्ट करना
  choice: मुख्य पाठ में ‘एपोद’ लिप्यंतरण बनाए रखा गया
  alternative: याजकीय परिधान; पवित्र वस्तु
  rationale: इस प्रसंग में एपोद आगे परमेश्वर से मार्गदर्शन पूछने से जुड़ा है, पर यह पद स्वयं उसके सटीक स्वरूप या कार्य को परिभाषित नहीं करता। लिप्यंतरण मूल की ऐतिहासिक और धार्मिक विशिष्टता तथा संभावित अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘एपोद’ जैसे विशिष्ट सांस्कृतिक शब्द को लिप्यंतरित करके संक्षिप्त पादटिप्पणी में समझाया गया है। विनम्रता-सूचक נָא को ‘कृपया’ से व्यक्त किया गया है।
