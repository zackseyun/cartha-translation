  yaml_path: translation/ot/1_samuel/030/016.yaml
  text: When he had led him down[a], behold, they were spread out over the face of all the land[b], eating and drinking and celebrating over all the great spoil that they had taken from the land of the Philistines and from the land of Judah.
translation:
  language: hi
  text: जब वह उसे नीचे ले गया, तो देखो, वे सारे इलाके में दूर-दूर तक फैले हुए थे[a], खाते, पीते और उस सारी बड़ी लूट के उपलक्ष्य में उत्सव मना रहे थे[b], जिसे उन्होंने पलिश्तियों के देश और यहूदा के देश से ले लिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सारे इलाके में बिखरे पड़े थे।” हिब्रू कृदन्त बिखराव या बड़े क्षेत्र में फैलाव—दोनों पर बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उस सारी बड़ी लूट के कारण उत्सव मना रहे थे।” हिब्रू संबंधबोधक शब्द उनके उत्सव के अवसर या आधार को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּרִדֵהוּ
  choice: जब वह उसे नीचे ले गया
  rationale: हिफ़ील रूप का अर्थ ‘नीचे ले जाना’ है; प्रसंग में मिस्री सेवक दाऊद को हमलावरों के पास ले जाता है। वाव-क्रम का समयगत संबंध स्वाभाविक हिन्दी में ‘जब’ से व्यक्त किया गया है।
- source_word: וְהִנֵּה
  choice: तो देखो
  rationale: यह दृश्य की आकस्मिक और सजीव प्रस्तुति की ओर ध्यान खींचता है। ‘तो देखो’ आधुनिक हिन्दी में इस कथात्मक बल को बनाए रखता है।
- source_word: נְטֻשִׁים עַל־פְּנֵי כָל־הָאָרֶץ
  choice: वे सारे इलाके में दूर-दूर तक फैले हुए थे
  rationale: निष्क्रिय कृदन्त व्यापक फैलाव या बिखराव सूचित करता है। यहाँ אֶרֶץ स्थानीय भूभाग है, इसलिए ‘इलाका’ प्रसंगानुकूल है; ‘दूर-दूर तक’ עַל־פְּנֵי के व्यापक विस्तार को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹכְלִים וְשֹׁתִים וְחֹגְגִים
  choice: खा-पीकर जश्न मना रहे थे
  rationale: तीनों कृदन्त जारी गतिविधि दिखाते हैं। हिन्दी का यह समन्वित वाक्यांश खाने, पीने और उत्सव मनाने—तीनों को स्पष्ट और स्वाभाविक रूप से रखता है।
- source_word: בְּכֹל הַשָּׁלָל הַגָּדוֹל
  choice: उस सारी बड़ी लूट के कारण
  rationale: यहाँ בְ उत्सव के अवसर, आधार या कारण को सूचित कर सकता है। ‘के कारण’ प्रसंग में स्पष्ट है, जबकि वैकल्पिक संबंध को पादटिप्पणी में सुरक्षित रखा गया है। שָׁלָל के लिए सैन्य प्रसंग में सामान्य शब्द ‘लूट’ चुना गया है।
- source_word: אֲשֶׁר לָקְחוּ
  choice: जिसे वे ... ले आए थे
  rationale: हिब्रू पूर्ण क्रिया उत्सव से पहले पूरी हुई लूट की कार्रवाई बताती है। हिन्दी का पूर्ण भूतकाल इस पूर्वता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵאֶרֶץ פְּלִשְׁתִּים וּמֵאֶרֶץ יְהוּדָה
  choice: पलिश्तियों के देश और यहूदा के देश से
  rationale: दोनों समानांतर प्रादेशिक पदबंधों को बनाए रखा गया है। ‘पलिश्ती’ आधुनिक हिन्दी बाइबलीय प्रयोग में परिचित नाम है।
