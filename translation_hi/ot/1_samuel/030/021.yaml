  text: וַ/יָּבֹ֣א דָוִ֗ד אֶל מָאתַ֨יִם הָ/אֲנָשִׁ֜ים אֲשֶֽׁר פִּגְּר֣וּ מִ/לֶּ֣כֶת אַחֲרֵ֣י דָוִ֗ד וַ/יֹּֽשִׁיבֻ/ם֙ בְּ/נַ֣חַל הַ/בְּשׂ֔וֹר וַ/יֵּֽצְאוּ֙ לִ/קְרַ֣את דָּוִ֔ד וְ/לִ/קְרַ֖את הָ/עָ֣ם אֲשֶׁר אִתּ֑/וֹ וַ/יִּגַּ֤שׁ דָּוִד֙ אֶת הָ/עָ֔ם וַ/יִּשְׁאַ֥ל לָ/הֶ֖ם לְ/שָׁלֽוֹם־־׀׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/021.yaml
  text: David came to the two hundred men who had become too exhausted to follow after David[a], and whom they had left at the Brook Besor. They came out to meet David and to meet the people who were with him[b], and David approached the people and asked them how they were.
translation:
  language: hi
  text: दाऊद उन दो सौ पुरुषों के पास आया, जो इतने थक गए थे कि दाऊद के पीछे नहीं जा सके थे और जिन्हें उसने बसोर नाले पर ठहराया था। वे दाऊद से और उसके साथ के लोगों से मिलने बाहर आए। तब दाऊद उन लोगों के पास गया और उनका कुशल-क्षेम पूछा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פִּגְּרוּ
  choice: इतने थक गए थे कि ... न जा सके थे
  rationale: क्रिया यहाँ थककर आगे बढ़ने में असमर्थ हो जाने का भाव देती है; यह अनुवाद प्रसंगगत कारण को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִלֶּכֶת אַחֲרֵי דָוִד
  choice: दाऊद के पीछे न जा सके थे
  rationale: अक्षरशः ‘दाऊद के पीछे जाने से’ का भाव है; हिन्दी में यह आगे यात्रा जारी न रख पाने को स्पष्ट और सहज ढंग से कहता है।
- source_word: וַיֹּשִׁיבֻם
  choice: जिन्हें ... छोड़ दिया गया था
  rationale: हिफ़ील रूप का अर्थ किसी को वहाँ ठहराना या छोड़ना हो सकता है। कर्ता की संख्या/पहचान को लेकर पाठ में संभावित कठिनाई को निष्क्रिय रचना द्वारा अनावश्यक रूप से नहीं सुलझाया गया।
- source_word: בְּנַחַל הַבְּשׂוֹר
  choice: बसोर नाले के पास
  rationale: נחל सूखी नदी-घाटी, बरसाती नाला या जलधारा को सूचित कर सकता है। ‘नाला’ आधुनिक हिन्दी में स्थलरूप को संक्षेप में व्यक्त करता है।
- source_word: לִקְרַאת
  choice: से मिलने
  rationale: यह सामने जाकर मिलने या स्वागत करने के लिए निकलने का संकेत देता है; ‘मिलने’ तटस्थ और स्वाभाविक है।
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: उसके साथ के लोगों
  rationale: עָם यहाँ दाऊद के साथ आए समूह को दर्शाता है; ‘लोग’ मूल की व्यापकता बनाए रखता है और उसे केवल सैनिकों तक सीमित नहीं करता।
- source_word: וַיִּגַּשׁ ... אֶת הָעָם
  choice: उन लोगों के पास गया
  rationale: נגשׁ का मूल भाव निकट आने का है। यह अगली क्रिया, कुशल पूछने, से अलग क्रिया के रूप में रखा गया है।
- source_word: וַיִּשְׁאַל לָהֶם לְשָׁלוֹם
  choice: उनका कुशल-क्षेम पूछा
  rationale: यह शांति/भलाई के विषय में पूछने वाला हिब्रू मुहावरा है। ‘कुशल-क्षेम पूछा’ हिन्दी में इसका स्वाभाविक और गरिमापूर्ण समतुल्य है।
