translation:
  language: hi
  text: और हेब्रोन के लोगों को, तथा उन सभी स्थानों के लोगों को जहाँ दाऊद और उसके आदमी आया-जाया करते थे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/לַ/אֲשֶׁר בְּ/חֶבְרוֹן
  choice: और हेब्रोन में रहनेवालों को
  rationale: पूर्ववर्ती पद में उपहार पानेवालों की सूची यहाँ जारी रहती है। सम्बन्धवाचक रचना में निहित बहुवचन व्यक्तियों को स्वाभाविक हिन्दी में ‘रहनेवालों’ से स्पष्ट किया गया है।
- source_word: וּֽ/לְ/כָל הַ/מְּקֹמ֛וֹת
  choice: तथा उन सभी स्थानों में रहनेवालों को
  rationale: शाब्दिक ‘सभी स्थानों को’ से ऐसा लग सकता है कि उपहार निर्जीव स्थानों को दिए गए; प्रसंग के अनुसार आशय उन स्थानों के निवासियों से है, इसलिए निहित प्राप्तकर्ताओं को स्पष्ट किया गया है।
- source_word: אֲשֶׁר ... שָׁם
  choice: जहाँ
  rationale: स्थानवाचक पूर्वपद के साथ सम्बन्धवाचक अव्यय और ‘वहाँ’ का संयुक्त अर्थ हिन्दी में स्वाभाविक रूप से ‘जहाँ’ में समाहित होता है।
- source_word: הִתְהַלֶּךְ
  choice: आया-जाया करते थे
  rationale: הלך के हित्पएल रूप का यहाँ बार-बार या विभिन्न स्थानों में घूमने-फिरने का भाव है; ‘आया-जाया करते थे’ उस अभ्यस्त और पुनरावृत्त गति को सहज हिन्दी में व्यक्त करता है।
- source_word: דָּוִד הוּא וַ/אֲנָשָׁיו
  choice: दाऊद और उसके जन
  rationale: स्वतन्त्र सर्वनाम הוּא को हिन्दी में अलग से ‘स्वयं’ कहना आवश्यक नहीं, क्योंकि यहाँ वह दाऊद को पुनः निर्दिष्ट करता है। אֲנָשָׁיו प्रसंग में दाऊद के साथियों अथवा दल के लोगों को सूचित करता है; ‘उसके जन’ गरिमापूर्ण और पर्याप्त रूप से व्यापक है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी की सहज, गरिमापूर्ण शैली अपनाई गई है। यह वाक्य पिछले पद की प्राप्तकर्ता-सूची का निरन्तर अंश है, इसलिए आरम्भ में ‘और’ रखा गया है। हिब्रू की पुनरावृत्त स्थान-स्थान गति को ‘आया-जाया करते थे’ से व्यक्त किया गया है।
