  yaml_path: translation/ot/1_samuel/030/014.yaml
  text: We raided the Negev of the Kerethites[a], and the territory that belongs to Judah, and the Negev of Caleb; and we burned Ziklag with fire.
translation:
  language: hi
  text: हमने करेती लोगों के नेगेव[a], यहूदा के भूभाग और कालेब के नेगेव पर छापा मारा; और सिकलग को आग से जला दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नेगेव’ दक्षिण के शुष्क क्षेत्र के लिए प्रयुक्त भौगोलिक पद है।
    reason: पद्य में बार-बार आने वाले भौगोलिक पद ‘नेगेव’ का अर्थ स्पष्ट करना।
lexical_decisions:
- source_word: פָּשַׁטְנוּ
  choice: हमने ... पर छापा मारा
  rationale: सैनिक संदर्भ में यह क्रिया लूटपाट के उद्देश्य से किए गए आक्रमण को दर्शाती है; ‘छापा मारा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: נֶגֶב
  choice: नेगेव
  rationale: यहाँ यह केवल दक्षिण दिशा नहीं, बल्कि दक्षिणी शुष्क भूभाग अथवा क्षेत्र का भौगोलिक नाम है; इसलिए लिप्यंतरण रखा गया है।
- source_word: הַכְּרֵתִי
  choice: करेती लोग
  rationale: यह एक जनसमूह का नाम है। ‘करेती’ इब्रानी व्यंजनों के निकट हिन्दी लिप्यंतरण है।
- source_word: וְעַל אֲשֶׁר לִיהוּדָה
  choice: यहूदा के अधिकार-क्षेत्र
  rationale: सम्बन्धवाचक पदबंध यहूदा से संबद्ध अथवा उसके अधीन भूभाग को सूचित करता है। ‘अधिकार-क्षेत्र’ स्वाभाविक हिन्दी में स्वामित्व/संबद्धता को व्यक्त करता है, जबकि इब्रानी की कुछ सामान्यता भी बनी रहती है।
- source_word: נֶגֶב כָּלֵב
  choice: कालेब के नेगेव
  rationale: यह कालेब के कुल अथवा उसके क्षेत्र से संबद्ध दक्षिणी भूभाग को सूचित करता है; इब्रानी संरचना और भौगोलिक संकेत को बनाए रखा गया है।
- source_word: שָׂרַפְנוּ בָאֵשׁ
  choice: आग से जला दिया
  rationale: इब्रानी में ‘जलाना’ और ‘आग से’ दोनों स्पष्ट हैं। हिन्दी में यह अभिव्यक्ति स्रोत के बल और घटना की तीव्रता को बनाए रखती है।
- source_word: צִקְלַג
  choice: सिकलग
  rationale: स्थान-नाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
