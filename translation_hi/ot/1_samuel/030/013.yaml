base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/013.yaml
  text: David said to him, “Whose are you, and where are you from?” He said, “I am an Egyptian young man, a servant of an Amalekite man, and my master abandoned me because I became sick three days ago.”
translation:
  language: hi
  text: दाऊद ने उससे पूछा, “तुम किसके हो, और कहाँ के रहनेवाले हो?” उसने उत्तर दिया, “मैं एक मिस्री युवक हूँ और एक अमालेकी का दास हूँ। मेरे स्वामी ने मुझे छोड़ दिया, क्योंकि मैं तीन दिन पहले बीमार पड़ गया था।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְמִי אַתָּה
  choice: तुम किसके हो
  rationale: इब्रानी में स्वामित्व या संबद्धता पूछी गई है; यह संक्षिप्त हिंदी अभिव्यक्ति उसी प्रश्न को स्वाभाविक रूप में बनाए रखती है।
- source_word: נַעַר מִצְרִי
  choice: एक मिस्री युवक
  rationale: נַעַר यहाँ आयु/स्थिति बताने वाला सामान्य शब्द है; “युवक” प्रसंगानुकूल और आधुनिक हिंदी में सहज है।
- source_word: עֶבֶד
  choice: दास
  rationale: यह शब्द सेवक या दास दोनों अर्थ दे सकता है; स्वामी द्वारा बीमार होने पर छोड़ दिए जाने का प्रसंग अधीन स्वामित्व की कठोर स्थिति दिखाता है, जिसे “दास” अधिक स्पष्ट रूप से व्यक्त करता है।
- source_word: וַיַּעַזְבֵנִי
  choice: मुझे छोड़ दिया
  rationale: क्रिया का मूल अर्थ छोड़ देना है; हिंदी में यह जानबूझकर त्याग देने का भाव भी स्वाभाविक रूप से व्यक्त करती है।
- source_word: הַיּוֹם שְׁלֹשָׁה
  choice: आज तीन दिन हो गए हैं
  rationale: इब्रानी काल-सूचक मुहावरे की संरचना और वर्तमान बिंदु दोनों को स्वाभाविक हिंदी में सुरक्षित रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। संवाद को बोलचाल योग्य रखा गया है, पर अत्यधिक अनौपचारिक शब्दावली से बचा गया है। “कहाँ के रहनेवाले हो” स्रोत के उद्गम-स्थान संबंधी प्रश्न को स्पष्ट करता है।
