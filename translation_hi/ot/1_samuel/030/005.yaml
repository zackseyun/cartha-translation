  rationale: निफ़अल पूर्ण रूप पकड़े जाकर बंदी बनाए जाने को व्यक्त करता है। “गई थीं” पिछले आक्रमण के परिणाम को वर्तमान कथानक-बिंदु से पूर्व घटित दिखाता है।
- source_word: אֲחִינֹעַם הַ/יִּזְרְעֵלִית
  choice: यिज्रेली अहीनोअम
  rationale: व्यक्तिनाम का लिप्यंतरण किया गया है और स्त्रीलिंग स्थानवाची विशेषण को संक्षिप्त हिन्दी रूप “यिज्रेली” से व्यक्त किया गया है।
- source_word: וַ/אֲבִיגַיִל
  choice: और ... अबीगैल
  rationale: संयोजक और व्यक्तिनाम दोनों को सीधे और स्वाभाविक ढंग से रखा गया है।
- source_word: אֵשֶׁת נָבָל הַֽ/כַּרְמְלִי
  choice: कर्मेलवासी नाबाल की पत्नी
  rationale: मूल में “कर्मेली” नाबाल की भौगोलिक पहचान बताता है। “कर्मेलवासी” आधुनिक हिन्दी में यह अर्थ स्पष्ट करता है और बाद के धार्मिक अर्थ से भ्रम घटाता है।
