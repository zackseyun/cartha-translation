    text: अर्थात् यिज्रेल की स्त्री, या यिज्रेल की रहनेवाली।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “कर्मेलवासी” का अर्थ कर्मेल का रहनेवाला है; इसका बाद के किसी धार्मिक संप्रदाय से संबंध नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וּ/שְׁתֵּי נְשֵׁי דָוִד
  choice: और दाऊद की दोनों पत्नियाँ
  rationale: वाव पिछले वृत्तांत से वाक्य को जोड़ता है; हिन्दी में “और” स्वाभाविक है। स्त्रीलिंग संख्या और संबंधवाचक रचना का अर्थ स्पष्ट रूप से रखा गया है।
- source_word: נִשְׁבּוּ
