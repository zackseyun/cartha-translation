translation:
  language: hi
  text: और दाऊद की दोनों पत्नियाँ बंदी बना ली गई थीं—यिज्रेल की रहनेवाली अहीनोअम[a] और कर्मेलवासी[b] नाबाल की पत्नी अबीगैल।
  philosophy: optimal-equivalence
  footnotes:
