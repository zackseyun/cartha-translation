translation:
  language: hi
  text: और राकाल में रहने वालों को, यरहमेएलियों के नगरों में रहने वालों को, और केनियों के नगरों में रहने वालों को।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: और ... में रहनेवालों को
  rationale: वाव, लामेद और संबंधवाचक कण का यह दोहराया गया विन्यास भेंट पानेवालों की सूची में स्थान-निवास का भाव देता है। हिंदी में ‘में रहनेवालों को’ दातृकारक और संबंध दोनों को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: בְּרָכָל
  choice: राकाल में
  rationale: यह स्थान-नाम है; इसलिए इसका अनुवाद न करके इब्रानी व्यंजनों और स्वरांकन के आधार पर ‘राकाल’ लिप्यंतरित किया गया है।
- source_word: בְּעָרֵי
  choice: नगरों में
  rationale: עִיר का अर्थ नगर या बस्ती हो सकता है। यहाँ बहुवचन construct रूप क्षेत्र के लोगों से जुड़े बसे हुए स्थानों को दर्शाता है; ‘नगरों’ आधुनिक हिंदी में गरिमापूर्ण और पर्याप्त व्यापक है।
- source_word: הַיְּרַחְמְאֵלִי
  choice: यरहमेएलियों के
  rationale: रूप व्याकरणतः एकवचन जातिवाचक है, पर ‘नगरों’ के साथ पूरे जनसमूह को सामूहिक रूप से सूचित करता है; इसलिए हिंदी बहुवचन जातिनाम स्वाभाविक है।
- source_word: הַקֵּינִי
  choice: केनियों के
  rationale: यह भी एकवचन जातिवाचक रूप में सामूहिक जनसमूह को सूचित करता है; ‘केनियों’ से वही सामूहिक अर्थ स्वाभाविक हिंदी में व्यक्त होता है।
