  register: आधुनिक मानक हिंदी; सूची की पुनरावृत्त संरचना सुरक्षित रखी गई है। ‘रहनेवालों’ का प्रयोग मूल के संबंधवाचक विन्यास को स्पष्ट और सहज बनाता है, जबकि नामों को प्रचलित हिंदी बाइबिलीय रूपों के निकट रखा गया है।
