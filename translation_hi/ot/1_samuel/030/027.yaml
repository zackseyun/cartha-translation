- source_word: לַאֲשֶׁר
  choice: में रहनेवालों को
  rationale: לְ के प्राप्तकर्ता-सूचक अर्थ और אֲשֶׁר के संबंधवाचक भाव को सूची के संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है। प्रत्येक स्थान के निवासियों को भेंट भेजे जाने का भाव बना रहता है।
- source_word: בְּבֵית אֵל
  choice: बेतेल में
  rationale: यहाँ בֵּית אֵל स्थान-नाम है; בְּ का स्थानीय अर्थ ‘में’ से व्यक्त किया गया है।
- source_word: בְּרָמוֹת נֶגֶב
  choice: रामोत-नेगेब में
  rationale: संयुक्त स्थान-नाम को लिप्यंतरित करने से נֶגֶב को ‘नेगेब’, ‘दक्षिण’ या विशेषण मानने की वास्तविक अस्पष्टता मुख्य पाठ में अनावश्यक रूप से हल नहीं होती।
- source_word: בְּיַתִּר
  choice: यत्तीर में
  rationale: स्थान-नाम יַתִּר का हिन्दी ध्वन्यात्मक लिप्यंतरण; בְּ को ‘में’ से व्यक्त किया गया है।
- source_word: וְ
  choice: और
  rationale: सूची की अंतिम इकाई को जोड़नेवाला सामान्य समुच्चयबोधक।
