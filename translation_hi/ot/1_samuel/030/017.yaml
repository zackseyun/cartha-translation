base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/017.yaml
  text: David struck them down from the twilight until the evening of the next day[a], and not a man of them escaped, except four hundred young men who rode on the camels and fled.
translation:
  language: hi
  text: दाऊद ने धुँधलके[a] से लेकर अगले दिन की शाम तक उन पर प्रहार करता रहा। उनमें से एक भी व्यक्ति बच नहीं निकला, सिवाय चार सौ युवकों के, जो ऊँटों पर सवार होकर भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘भोर से’; यहाँ प्रयुक्त इब्रानी शब्द दिन के आरम्भ या अन्त—दोनों समय के धुँधलके के लिए आ सकता है। कुछ लोग यहाँ इसे भोर का धुँधलका मानते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּכֵּם
  choice: उन्हें मार गिराया
  rationale: सैन्य प्रसंग में נכה हिंसक प्रहार करके परास्त या मार गिराने का भाव देता है। यह चयन क्रिया की तीव्रता बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: מֵהַנֶּשֶׁף
  choice: धुँधलके से
  rationale: נֶשֶׁף भोर या साँझ—दोनों समय के धुँधलके को सूचित कर सकता है। ‘धुँधलका’ मूल की अस्पष्टता को मुख्य पाठ में यथासंभव बनाए रखता है।
- source_word: וְעַד הָעֶרֶב לְמָחֳרָתָם
  choice: अगले दिन की शाम तक
  rationale: यह पदबंध कार्रवाई के अगले दिन की शाम तक जारी रहने का समयबोध देता है; यह आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נִמְלַט מֵהֶם אִישׁ
  choice: उनमें से कोई भी पुरुष बच नहीं निकला
  rationale: एकवचन אִישׁ यहाँ वितरणात्मक और बलाघाती है। ‘कोई भी पुरुष’ पूर्ण निषेध और पुरुषवाचक रूप दोनों को व्यक्त करता है।
- source_word: כִּי אִם
  choice: सिवाय
  rationale: यह मुहावरा पिछले पूर्ण निषेध के अपवाद को प्रस्तुत करता है; ‘सिवाय’ इसका स्पष्ट आधुनिक हिन्दी समतुल्य है।
- source_word: אַרְבַּע מֵאוֹת אִישׁ נַעַר
  choice: चार सौ युवकों
  rationale: נַעַר के अर्थ बालक, युवक या सेवक हो सकते हैं। ऊँटों पर सवार होकर भागने वाले इन लोगों के लिए ‘युवक’ आयु और पुरुषवाचकता को स्वाभाविक रूप से व्यक्त करता है, बिना सेवक होने का अर्थ जोड़ने के।
- source_word: רָכְבוּ עַל הַגְּמַלִּים
  choice: ऊँटों पर चढ़कर
  rationale: यह हिन्दी में स्वाभाविक ढंग से ऊँटों पर सवार होने की क्रिया व्यक्त करता है और עַל के अर्थ को बनाए रखता है।
- source_word: וַיָּנֻסוּ
  choice: भाग गए
  rationale: נוּס का अर्थ संकट से भागना है। ‘भाग गए’ पहले प्रयुक्त ‘बच नहीं निकला’ से क्रियात्मक भेद भी बनाए रखता है।
