  text: וַ/תֵּ֨צֶר לְ/דָוִ֜ד מְאֹ֗ד כִּֽי אָמְר֤וּ הָ/עָם֙ לְ/סָקְל֔/וֹ כִּֽי מָ֨רָה֙ נֶ֣פֶשׁ כָּל הָ/עָ֔ם אִ֖ישׁ עַל בנ/ו וְ/עַל בְּנֹתָ֑י/ו וַ/יִּתְחַזֵּ֣ק דָּוִ֔ד בַּ/יהוָ֖ה אֱלֹהָֽי/ו־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/006.yaml
  text: And David was greatly distressed[a], because the people spoke of stoning him, for the soul of all the people was bitter, each man because of his sons and his daughters. But David strengthened himself in Yahweh his God.
translation:
  language: hi
  text: दाऊद बहुत संकट में पड़ गया, क्योंकि लोग उसे पत्थर मारने की बात कर रहे थे; सभी लोग अपने-अपने बेटे-बेटियों के कारण बहुत व्यथित थे।[a] परन्तु दाऊद ने अपने परमेश्वर यहोवा में अपने को दृढ़ किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “सभी लोगों का प्राण कड़वा था”; अर्थात वे अपने बेटे-बेटियों के कारण गहरे दुःख और व्यथा में थे।
    reason: इब्रानी נֶפֶשׁ और מָרָה के ठोस मुहावरे को सुरक्षित रखते हुए उसका प्रसंगगत भाव स्पष्ट करना।
lexical_decisions:
- source_word: וַתֵּצֶר לְדָוִד מְאֹד
  choice: दाऊद बहुत संकट में पड़ गया
  rationale: צרר के इस निर्वैयक्तिक प्रयोग और לְדָוִד को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है; מְאֹד की तीव्रता ‘बहुत’ से बनी रहती है।
- source_word: הָעָם
  choice: लोग
  rationale: इब्रानी सामूहिक संज्ञा को बिना अनावश्यक रूप से ‘सैनिक’ या ‘पुरुष’ निर्धारित किए सहज हिन्दी में रखा गया है।
- source_word: לְסָקְלוֹ
  choice: उसे पत्थरवाह करने की बात
  rationale: אָמְרוּ के बाद infinitive विचाराधीन या कही जा रही कार्रवाई बताता है; यह अनुवाद तत्काल क्रिया के बजाय उस पर हो रही बात को व्यक्त करता है।
- source_word: מָרָה נֶפֶשׁ כָּל הָעָם
  choice: सभी लोगों का मन ... कड़वाहट से भर गया था
  rationale: נֶפֶשׁ के सामूहिक भाव और מָרָה की गहरी कटुता को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि पादटिप्पणी अधिक शब्दानुरूप रूप देती है।
- source_word: אִישׁ עַל בנו וְעַל בְּנֹתָיו
  choice: अपने-अपने बेटे-बेटियों के कारण
  rationale: אִישׁ का वितरणात्मक अर्थ ‘अपने-अपने’ से स्पष्ट होता है और עַל यहाँ दुःख का कारण बताता है।
- source_word: וַיִּתְחַזֵּק
  choice: अपने आपको दृढ़ किया
  rationale: हित्पएल रूप की आत्मवाचक/मध्यवाचक शक्ति को बनाए रखता है और केवल ‘हिम्मत बाँधी’ कहकर अर्थ को सीमित नहीं करता।
- source_word: בַּיהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा में
  rationale: בְּ का आश्रय/क्षेत्र-संबंधी भाव सुरक्षित है और יהוה को उसके व्यक्तिगत नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। आधुनिक हिन्दी में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को सामान्य उपाधि ‘प्रभु’ में बदलने से बचाता है; ‘याहवे’ निकटतर विद्वतापूर्ण लिप्यंतरण है।
- issue: दाऊद के दृढ़ होने में मानवीय सक्रियता और परमेश्वर पर निर्भरता
  choice: दाऊद ने अपने परमेश्वर यहोवा में अपने आपको दृढ़ किया
  alternative: दाऊद को उसके परमेश्वर यहोवा से सामर्थ्य मिली
  rationale: हित्पएल क्रिया दाऊद की सक्रिय प्रतिक्रिया को और בַּיהוָה उसके परमेश्वर में आधार को साथ रखती है; वैकल्पिक रूप क्रिया को निष्क्रिय बनाकर तनाव को हल कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध। ‘पत्थरवाह’ बाइबलीय प्रसंग में स्थापित और संक्षिप्त शब्द है। मुख्य पाठ में इब्रानी मुहावरे को स्वाभाविक बनाया गया है और उसके अधिक शब्दानुरूप रूप को पादटिप्पणी में सुरक्षित रखा गया है।
