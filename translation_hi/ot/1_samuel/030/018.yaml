  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और कथात्मक शैली। एक ही इब्रानी क्रिया के लिए दोनों स्थानों पर ‘छुड़ा लिया’ रखने से अर्थ और साहित्यिक पुनरावृत्ति दोनों सुरक्षित हैं; इसलिए फुटनोट आवश्यक नहीं है।
