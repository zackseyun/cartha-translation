translation:
  language: hi
  text: दाऊद ने वह सब छुड़ा लिया जो अमालेक ले गया था, और दाऊद ने अपनी दोनों पत्नियों को छुड़ा लिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּצֵּל / הִצִּיל (נצל)
  choice: छुड़ा लिया ... छुड़ा लिया
  rationale: दोनों उपवाक्यों में एक ही इब्रानी धातु נצל प्रयुक्त हुई है। हिंदी में ‘छुड़ा लिया’ लूटी हुई वस्तुओं/लोगों को शत्रु के कब्ज़े से वापस पाने और पत्नियों को बचा लाने—दोनों अर्थों में स्वाभाविक है, इसलिए मूल की पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: כָּל אֲשֶׁר לָקְחוּ עֲמָלֵק
  choice: वह सब ... जो अमालेक ले गया था
  rationale: כָּל אֲשֶׁר का अर्थ ‘वह सब जो’ है। हिंदी कथा-क्रम में ‘ले गया था’ पहले हो चुकी क्रिया को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: עֲמָלֵק
  choice: अमालेक
  rationale: इब्रानी पाठ में एकवचन जातिनाम है, जो यहाँ सामूहिक अर्थ में अमालेकी लोगों को दर्शाता है। ‘अमालेक’ मूल रूप को बनाए रखता है।
- source_word: שְׁתֵּי נָשָׁיו
  choice: अपनी दोनों पत्नियों
  rationale: यह पदबंध स्पष्ट रूप से उसकी दो पत्नियों को बताता है। ‘अपनी दोनों पत्नियों’ आधुनिक हिंदी में स्वाभाविक है और संख्या को सुरक्षित रखता है।
- source_word: דָּוִד ... דָּוִד
  choice: दाऊद ... दाऊद
  rationale: मूल पाठ में नाम की पुनरावृत्ति बल और स्पष्टता देती है; इसलिए दूसरे स्थान पर सर्वनाम रखने के बजाय नाम दोहराया गया है।
