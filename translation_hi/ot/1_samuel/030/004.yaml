  text: Then David and the people who were with him raised their voices and wept until they had no strength left to weep[a].
translation:
  language: hi
  text: तब दाऊद और उसके साथ के लोगों ने ऊँचे स्वर से विलाप किया और तब तक रोते रहे, जब तक उनमें और रोने की शक्ति न रही।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשָּׂא ... אֶת קוֹלָם
  choice: ऊँचे स्वर से विलाप किया
  rationale: शाब्दिक रूप से ‘अपना स्वर उठाया’; रोने के संदर्भ में यह इब्रानी मुहावरा तेज़ स्वर में विलाप करने को व्यक्त करता है। हिंदी में चुना गया रूप स्वाभाविक है और अगले ‘रोते रहे’ से अनावश्यक रूप से एक ही क्रिया की पुनरावृत्ति नहीं करता।
- source_word: הָעָם אֲשֶׁר אִתּוֹ
  choice: उसके साथ के लोगों
  rationale: עָם का सामान्य अर्थ ‘लोग’ है। प्रसंग में ये दाऊद के योद्धा हैं, पर मूल पाठ यहाँ विशेष रूप से ‘सैनिक’ या ‘पुरुष’ नहीं कहता।
- source_word: וַיִּבְכּוּ
  choice: रोते रहे
  rationale: בכה का अर्थ रोना या विलाप करना है। ‘रोते रहे’ अगले परिणामसूचक खंड तक जारी क्रिया को सहज हिंदी में दर्शाता है।
- source_word: עַד אֲשֶׁר אֵין בָּהֶם כֹּחַ
  choice: जब तक उनमें ... शक्ति न रही
  rationale: यह मूल अभिव्यक्ति ‘उनमें शक्ति नहीं रही’ के निकट रहते हुए पूरी तरह थक जाने का भाव स्पष्ट करती है।
- source_word: לִבְכּוֹת
  choice: और रोने की
  rationale: क्रिया בכה की पुनरावृत्ति बनाए रखी गई है और हिंदी में उद्देश्य/क्षमता का संबंध स्वाभाविक ढंग से व्यक्त किया गया है।
