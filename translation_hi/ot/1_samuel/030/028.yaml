  text: और अरोएर में रहनेवालों को, और सिफमोत में रहनेवालों को, और एश्तमोआ में रहनेवालों को,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלַאֲשֶׁר
  choice: और ... में रहनेवालों को
  rationale: संयोजक, संबंधसूचक अव्यय और सापेक्ष कण का यह बार-बार आनेवाला सूत्र इस प्रसंग में अलग-अलग नगरों के प्राप्तकर्ताओं को दर्शाता है। हिंदी में ‘... में रहनेवालों को’ स्वाभाविक और अर्थ-स्पष्ट है तथा इसकी पुनरावृत्ति भी सुरक्षित रहती है।
- source_word: בַּעֲרֹעֵר
  choice: अरोएर में
  rationale: यह स्थानवाचक नाम है; उपसर्ग בְּ को नगर के साथ स्वाभाविक हिंदी स्थानसूचक ‘में’ से व्यक्त किया गया है।
- source_word: בְּשִׂפְמוֹת
  choice: सिफमोत में
  rationale: स्थानवाचक नाम का लिप्यंतरण किया गया है और בְּ का स्थानसूचक अर्थ ‘में’ रखा गया है।
- source_word: בְּאֶשְׁתְּמֹעַ
  choice: एश्तमोआ में
  rationale: इब्रानी स्थानवाचक नाम का हिंदी ध्वन्यात्मक लिप्यंतरण किया गया है; בְּ को ‘में’ अनूदित किया गया है।
