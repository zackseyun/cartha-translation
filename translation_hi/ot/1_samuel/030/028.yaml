  register: आधुनिक मानक हिंदी में गरिमापूर्ण और सहज सूची-वाक्य। इब्रानी मूल में प्रत्येक नगर से पहले आए पूरे सूत्र की पुनरावृत्ति को हिंदी में भी बनाए रखा गया है। पद अंश के रूप में अगले पदांश से जुड़ने के कारण अंत में अल्पविराम रखा गया है।
