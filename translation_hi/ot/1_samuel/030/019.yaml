base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/019.yaml
  text: Nothing of theirs was missing[a], from small to great, sons and daughters, spoil, or anything that had been taken from them[b]; David brought back everything.
translation:
  language: hi
  text: छोटे से बड़े तक किसी का भी, न बेटों-बेटियों का, न लूट के माल का, न उस किसी चीज़ का जो उनसे ले ली गई थी[b], कुछ भी गायब नहीं था[a]; दाऊद सब कुछ वापस ले आया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “सबसे छोटे से सबसे बड़े तक।” यह अभिव्यक्ति आयु या सामाजिक महत्त्व, दोनों की ओर संकेत कर सकती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “वह सब जो उन्होंने अपने लिए ले लिया था”; प्रसंग में इसका अर्थ वह सब है जो दाऊद के लोगों से छीन लिया गया था।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶעְדַּר
  choice: गायब नहीं था
  rationale: निफ़ाल रूप यहाँ किसी व्यक्ति या वस्तु के लापता अथवा कम होने को दर्शाता है। ‘गायब नहीं था’ लोगों और संपत्ति, दोनों पर स्वाभाविक रूप से लागू होता है और स्थायी हानि का अनावश्यक भाव नहीं देता।
- source_word: לָהֶם
  choice: उनका
  rationale: 'עדר के साथ आए संबंधसूचक भाव को आधुनिक हिन्दी में स्वामित्व के रूप में व्यक्त करना सबसे स्वाभाविक है: ‘उनका कुछ भी गायब नहीं था।’'
- source_word: מִן הַקָּטֹן וְעַד הַגָּדוֹל
  choice: छोटे से बड़े तक
  rationale: यह समावेशी युग्म सभी स्तरों या आयु के लोगों को समेटता है। यह अनुवाद मूल की व्यापकता बनाए रखता है, बिना यह निश्चित किए कि भेद केवल आयु का है या सामाजिक महत्त्व का।
- source_word: בָּנִים וּבָנוֹת
  choice: बेटे-बेटियाँ
  rationale: मूल पाठ पुत्रों और पुत्रियों दोनों का स्पष्ट उल्लेख करता है; हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: מִשָּׁלָל
  choice: लूट का माल
  rationale: यह छापे में छीनी गई संपत्ति को दर्शाता है। ‘लूट का माल’ साधारण आधुनिक हिन्दी में स्पष्ट है।
- source_word: כָּל אֲשֶׁר לָקְחוּ לָהֶם
  choice: वह कुछ भी जो उनसे ले लिया गया था
  rationale: शाब्दिक संरचना ‘वह सब जो उन्होंने अपने लिए लिया था’ है, जिसमें कर्ता संदर्भ से अमालेकी हैं। हिन्दी में पीड़ितों को ‘उनसे’ कहकर स्पष्ट करना प्रसंगगत अर्थ को स्वाभाविक बनाता है; शाब्दिक भिन्नता पादटिप्पणी में सुरक्षित है।
- source_word: הַכֹּל הֵשִׁיב
  choice: सब कुछ वापस ले आया
  rationale: שוב का हिफ़ील रूप यहाँ वापस लाने का ठोस कथात्मक कार्य बताता है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: इस इब्रानी नाम का मानक हिन्दी बाइबलीय रूप।
