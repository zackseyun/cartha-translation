source:
  edition: WLC
  text: וּ/מִי֙ יִשְׁמַ֣ע לָ/כֶ֔ם לַ/דָּבָ֖ר הַ/זֶּ֑ה כִּ֞י כְּ/חֵ֣לֶק הַ/יֹּרֵ֣ד בַּ/מִּלְחָמָ֗ה וּֽ/כְ/חֵ֛לֶק הַ/יֹּשֵׁ֥ב עַל הַ/כֵּלִ֖ים יַחְדָּ֥ו יַחֲלֹֽקוּ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/024.yaml
  text: And who will listen to you in this matter? For as is the share of the one who goes down into the battle[a], so is the share of the one who stays by the supplies[b]; together they shall divide.
translation:
  language: hi
  text: और इस बात में तुम्हारी कौन सुनेगा? क्योंकि युद्ध में उतरने वाले का जैसा हिस्सा होगा, वैसा ही सामान के पास ठहरे रहने वाले का भी होगा; दोनों मिलकर बाँटेंगे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמִי יִשְׁמַע לָכֶם
  choice: और ... तुम्हारी कौन सुनेगा?
  rationale: संयोजक और आलंकारिक प्रश्न को बनाए रखता है। שׁמע ל का अर्थ यहाँ किसी की बात सुनना या मानना है; आधुनिक हिन्दी में ‘तुम्हारी कौन सुनेगा’ दोनों भावों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לַדָּבָר הַזֶּה
  choice: इस बात में
  rationale: דבר यहाँ केवल बोले गए शब्द के बजाय विवादाधीन प्रस्ताव या विषय को सूचित करता है। ‘इस बात में’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: כְּחֵלֶק
  choice: जैसा हिस्सा ... वैसा ही ... हिस्सा
  rationale: חלק युद्ध की लूट में मिलने वाले भाग को दर्शाता है। हिन्दी की तुलनात्मक संरचना दोनों दलों के समान हिस्से पर बल देती है।
- source_word: הַיֹּרֵד בַּמִּלְחָמָה
  choice: युद्ध में उतरने वाले
  rationale: इब्रानी कृदन्त और ‘उतरने’ की गतिशील अभिव्यक्ति को सुरक्षित रखते हुए युद्ध में भाग लेने का भाव स्पष्ट करता है।
- source_word: הַיֹּשֵׁב עַל הַכֵּלִים
  choice: सामान के पास ठहरे रहने वाले
  rationale: יֹשֵׁב यहाँ पीछे रहकर पहरा देने के अर्थ में है। כֵּלִים का व्यापक अर्थ सामान, उपकरण या रसद हो सकता है; ‘सामान’ उस व्यापकता को सहज हिन्दी में बनाए रखता है।
- source_word: יַחְדָּו יַחֲלֹקוּ
  choice: दोनों मिलकर बाँटेंगे
  rationale: יַחְדָּו संयुक्त सहभागिता और प्रसंगतः बराबरी का संकेत देता है; יַחֲלֹקוּ लूट को बाँटने की ठोस क्रिया व्यक्त करता है।
theological_decisions: []
