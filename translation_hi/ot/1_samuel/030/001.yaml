base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/030/001.yaml
  text: When David and his men came to Ziklag on the third day[a], the Amalekites had made a raid against the Negev and against Ziklag, and they had struck Ziklag and burned it with fire.
translation:
  language: hi
  text: तीसरे दिन जब दाऊद और उसके आदमी सिकलग पहुँचे, तब अमालेकियों ने नेगेव[a] और सिकलग पर छापा मारा था। उन्होंने सिकलग पर हमला किया और उसे आग से जला दिया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दक्षिणी प्रदेश”; इब्रानी शब्द नेगेव सामान्य रूप से दक्षिणी क्षेत्र या विशेष रूप से नेगेव नामक भूभाग, दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי בְּבֹא
  choice: जब … पहुँचे
  rationale: यह रचना दाऊद के आगमन को कथा की समय-संबंधी पृष्ठभूमि बनाती है। ‘जब … पहुँचे’ आधुनिक हिन्दी में स्वाभाविक है और किसी ऐसे ‘अब’ को नहीं जोड़ता जो इब्रानी में स्पष्ट रूप से नहीं है।
- source_word: וַאֲנָשָׁיו
  choice: और उसके आदमी
  rationale: संदर्भ में यह दाऊद के साथ चलने वाले पुरुषों के दल को दर्शाता है; ‘उसके आदमी’ सामान्य आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: צִקְלַג
  choice: सिकलग
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: यह समय का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: וַעֲמָלֵקִי
  choice: अमालेकियों
  rationale: रूप एकवचन-सामूहिक है, पर साथ की बहुवचन क्रियाएँ एक जातीय समूह का संकेत देती हैं; इसलिए हिन्दी बहुवचन स्वाभाविक है।
- source_word: פָשְׁטוּ
  choice: छापा मारा था
  rationale: सैन्य प्रसंग में क्रिया लूटमार के उद्देश्य से किए गए आकस्मिक आक्रमण को दर्शाती है। पूर्ण भूतकाल यह स्पष्ट करता है कि हमला दाऊद के पहुँचने से पहले हो चुका था।
- source_word: אֶל נֶגֶב
  choice: नेगेव पर
  rationale: अमालेकियों की शत्रुतापूर्ण कार्रवाई के लक्ष्य को ‘पर’ स्वाभाविक रूप से व्यक्त करता है। ‘नेगेव’ भौगोलिक क्षेत्र को दर्शा सकता है, जबकि ‘दक्षिणी प्रदेश’ भी संभव है; यह विकल्प पादटिप्पणी में सुरक्षित है।
- source_word: וַיַּכּוּ אֶת צִקְלַג
  choice: उन्होंने सिकलग पर हमला किया
  rationale: נכה का अर्थ व्यापक रूप से मारना या आक्रमण करना हो सकता है। किसी नगर के संदर्भ में ‘हमला किया’ स्पष्ट और स्वाभाविक है।
- source_word: וַיִּשְׂרְפוּ אֹתָהּ בָּאֵשׁ
  choice: और उसे आग से जला दिया था
  rationale: यह इब्रानी के स्पष्ट ‘आग से जलाया’ को बनाए रखता है और नगर के विनाश को सहज हिन्दी में व्यक्त करता है।
