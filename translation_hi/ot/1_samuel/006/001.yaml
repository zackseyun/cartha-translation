  yaml_path: translation/ot/1_samuel/006/001.yaml
  text: And the ark of Yahweh was in the territory of the Philistines seven months[a].
translation:
  language: hi
  text: याहवे का सन्दूक पलिश्तियों के क्षेत्र में सात महीने तक रहा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי
  choice: रहा
  rationale: कथात्मक क्रम को स्वाभाविक हिन्दी में मुख्य क्रिया के रूप में व्यक्त किया गया है; अलग से ‘और ऐसा हुआ’ कहना यहाँ अनावश्यक और बोझिल होता।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का सन्दूक
  rationale: सम्बन्धवाचक रचना का सीधा और प्रचलित हिन्दी रूप; इस धार्मिक सन्दर्भ में אֲרוֹן के लिए ‘सन्दूक’ सटीक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का लिप्यन्तरण किया गया है, उसे किसी उपाधि से नहीं बदला गया।
- source_word: בִּשְׂדֵה פְלִשְׁתִּים
  choice: पलिश्तियों के क्षेत्र में
  rationale: שָׂדֶה का शाब्दिक अर्थ ‘मैदान/खेत’ है, पर इस प्रसंग में उसका विस्तृत भौगोलिक अर्थ ‘क्षेत्र/प्रदेश’ स्वाभाविक है।
- source_word: שִׁבְעָה חֳדָשִׁים
  choice: सात महीने तक
  rationale: अवधि को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करने के लिए ‘तक’ जोड़ा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में आए वाचा-संबंधी व्यक्तिगत नाम को लिप्यन्तरित करना उसकी पहचान बनाए रखता है और उसके स्थान पर कोई उपाधि नहीं रखता।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। ‘पलिश्ती’ बाइबलीय जातिनाम का प्रचलित हिन्दी रूप है; ‘क्षेत्र’ मूल के भौगोलिक आशय को स्वाभाविक ढंग से व्यक्त करता है।
