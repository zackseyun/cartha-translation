  text: וַ/יַּ֞ךְ בְּ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ כִּ֤י רָאוּ֙ בַּ/אֲר֣וֹן יְהוָ֔ה וַ/יַּ֤ךְ בָּ/עָם֙ שִׁבְעִ֣ים אִ֔ישׁ חֲמִשִּׁ֥ים אֶ֖לֶף אִ֑ישׁ וַ/יִּֽתְאַבְּל֣וּ הָ/עָ֔ם כִּֽי הִכָּ֧ה יְהוָ֛ה בָּ/עָ֖ם מַכָּ֥ה גְדוֹלָֽה־־
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/019.yaml
  text: And he struck down some of the men of Beth-shemesh because they had looked into the ark of Yahweh[a]. He struck down seventy men among the people, fifty thousand men[b], and the people mourned because Yahweh had struck the people with a great blow.
translation:
  language: hi
  text: और उसने बेत-शेमेश के कुछ पुरुषों को मार डाला, क्योंकि उन्होंने यहोवा के संदूक के भीतर झाँका था।[a] उसने लोगों में से सत्तर पुरुषों को, पचास हज़ार पुरुषों को मार डाला;[b] और लोगों ने शोक मनाया, क्योंकि यहोवा ने लोगों पर बड़ा प्रहार किया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि उन्होंने यहोवा के संदूक को देखा था।” हिब्रू पूर्वसर्ग का अर्थ अधिक सामान्य रूप से संदूक को देखना भी हो सकता है, यद्यपि इस प्रसंग में “भीतर झाँका” अपराध की संभावित प्रकृति को बेहतर व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में शाब्दिक रूप से “सत्तर पुरुष, पचास हज़ार पुरुष” है। यह कठिन वाक्यांश “पचास हज़ार में से सत्तर पुरुष” या “पचास हज़ार और सत्तर पुरुष” समझा जा सकता है, अथवा यह किसी पाठ-संबंधी समस्या को दर्शा सकता है; कुछ प्राचीन पाठ-साक्ष्य बहुत छोटी संख्या का समर्थन करते हैं।
    reason: textual_variant
lexical_decisions:
- source_word: וַיַּךְ
  choice: मार डाला / प्रहार किया
  rationale: नכה का मूल अर्थ ‘मारना/प्रहार करना’ है। मृत्यु के प्रसंग में ‘मार डाला’ परिणाम स्पष्ट करता है; अंतिम वाक्य में संज्ञा מַכָּה से संबंध बनाए रखने के लिए ‘प्रहार किया’ रखा गया है।
- source_word: בְּאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: बेत-शेमेश के कुछ पुरुषों को
  rationale: בְּ का यहाँ समूह के भीतर से कुछ लोगों पर आघात होने का भाव है। ‘पुरुष’ אַנְשֵׁי के लिंग-सूचक अर्थ को बनाए रखता है।
- source_word: כִּי רָאוּ בַּאֲרוֹן יְהוָה
  choice: क्योंकि उन्होंने यहोवा के संदूक के भीतर देखा था
  rationale: ראה के साथ בְּ का अर्थ यहाँ संदूक के भीतर देखना हो सकता है और प्रसंग में यही अपराध की संभावित प्रकृति है; अधिक सामान्य ‘संदूक को देखा’ पादटिप्पणी में सुरक्षित है।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का संदूक
  rationale: निर्मित पदबंध का स्वाभाविक हिन्दी रूप; אֲרוֹן के लिए बाइबलीय और सुबोध ‘संदूक’ उपयुक्त है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ टेट्राग्राम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: שִׁבְעִים אִישׁ חֲמִשִּׁים אֶלֶף אִישׁ
  choice: सत्तर पुरुषों को—पचास हज़ार पुरुषों को
  rationale: मसोरेटिक पाठ की कठिन संख्या-शृंखला को बिना चुपचाप सुलझाए यथासंभव प्रत्यक्ष रखा गया है; विराम-चिह्न कठिन संबंध को संकेत करता है, जबकि संभावित अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: וַיִּתְאַבְּלוּ
  choice: शोक मनाया
  rationale: אבל का हितपएल रूप मृत्यु या विपत्ति पर शोक करने को दर्शाता है; यह आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: מַכָּה גְדוֹלָה
  choice: बहुत भारी प्रहार
  rationale: מַכָּה के ‘प्रहार/आघात’ अर्थ को बनाए रखता है और इसे बिना प्रमाण महामारी या संहार के रूप में अधिक विशिष्ट नहीं बनाता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। हिन्दी पाठकों में परिचित ‘यहोवा’ नाम को बनाए रखता है और उसे केवल उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता।
- issue: दंड देने वाले कर्ता की पहचान
  choice: आरंभ में सर्वनाम ‘उसने’, अंत में स्पष्ट ‘यहोवा’
  alternative: दोनों स्थानों पर ‘यहोवा’
  rationale: हिब्रू की वाक्य-रचना आरंभ में कर्ता को सर्वनाम-सदृश क्रिया में निहित रखती है और बाद में यहोवा को स्पष्ट करती है; हिन्दी रूप इसी कथात्मक गति को सुरक्षित रखता है।
- issue: मसोरेटिक पाठ की कठिन मृतक-संख्या
  choice: मुख्य पाठ में ‘सत्तर पुरुषों को—पचास हज़ार पुरुषों को’ सुरक्षित रखना
  alternative: पचास हज़ार सत्तर; पचास हज़ार में से सत्तर; केवल सत्तर
  rationale: हिब्रू वाक्यांश अत्यंत कठिन है और प्राचीन साक्ष्यों में भी भिन्नता है। किसी एक समाधान को मूल पाठ पर थोपने के बजाय मुख्य पाठ तनाव बनाए रखता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध। स्थान-नाम ‘बेत-शेमेश’ और वाचा-नाम ‘यहोवा’ हिन्दी बाइबल-परंपरा के परिचित रूपों में हैं। कठिन संख्या को डैश द्वारा पठनीय बनाया गया है, पर उसकी वास्तविक अस्पष्टता मिटाई नहीं गई।
