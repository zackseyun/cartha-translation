  text: וּ/בֵ֣ית שֶׁ֔מֶשׁ קֹצְרִ֥ים קְצִיר חִטִּ֖ים בָּ/עֵ֑מֶק וַ/יִּשְׂא֣וּ אֶת עֵינֵי/הֶ֗ם וַ/יִּרְאוּ֙ אֶת הָ֣/אָר֔וֹן וַֽ/יִּשְׂמְח֖וּ לִ/רְאֽוֹת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/013.yaml
  text: The people of Beth-shemesh were reaping the wheat harvest in the valley[a], and they lifted up their eyes and saw the ark, and they rejoiced to see it.
translation:
  language: hi
  text: बेत-शेमेश के लोग घाटी में गेहूँ की फसल काट रहे थे। उन्होंने आँखें उठाकर सन्दूक को देखा और उसे देखकर आनन्दित हुए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבֵית שֶׁמֶשׁ
  choice: बेत-शेमेश के लोग
  rationale: स्थान-नाम बहुवचन क्रियाओं के साथ लक्षणा द्वारा वहाँ के निवासियों को सूचित करता है; ‘के लोग’ लिंग का अनावश्यक निर्धारण किए बिना अर्थ स्पष्ट करता है।
- source_word: קֹצְרִים קְצִיר חִטִּים
  choice: गेहूँ की फसल काट रहे थे
  rationale: बहुवचन कृदन्त चल रही पृष्ठभूमि-क्रिया व्यक्त करता है; यह हिन्दी प्रयोग उसके कालगत पक्ष को स्वाभाविक रूप से रखता है।
- source_word: בָּעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק यहाँ घाटी अथवा विस्तृत निम्न भूभाग को दर्शाता है; ‘घाटी’ सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: וַיִּשְׂאוּ אֶת עֵינֵיהֶם
  choice: उन्होंने आँखें उठाकर
  rationale: हिब्रू मुहावरे की सजीव देह-छवि बनाए रखते हुए हिन्दी में स्वाभाविक अर्थ ‘ऊपर देखकर’ व्यक्त होता है।
- source_word: הָאָרוֹן
  choice: सन्दूक
  rationale: निकटवर्ती कथा में यह परमेश्वर के स्थापित पवित्र सन्दूक का संदर्भ है; हिन्दी बाइबलीय प्रयोग में ‘सन्दूक’ परिचित और प्रसंगानुकूल है।
- source_word: וַיִּשְׂמְחוּ לִרְאוֹת
  choice: उसे देखकर आनन्दित हुए
  rationale: इनफिनिटिव देखने को आनन्द का अवसर बताता है; निहित कर्म का संकेत हिन्दी में ‘उसे’ से स्वाभाविक रूप से स्पष्ट किया गया है।
