  text: Now then[a], take and make one new cart, and two nursing cows on which no yoke has come, and hitch the cows to the cart[b], but take their calves away from them to the house.
translation:
  language: hi
  text: अब एक नई गाड़ी लो और तैयार करो, और ऐसी दो दूध पिलाती गायें लो जिन पर कभी जुआ न रखा गया हो। गायों को गाड़ी में जोतो और उनके बछड़ों को उनसे अलग करके घर ले जाओ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעַתָּה
  choice: इसलिए अब
  rationale: यह पद पिछले निर्देश से अगले व्यावहारिक कदम की ओर बढ़ता है; ‘इसलिए अब’ हिब्रू के संयोजक और संक्रमणकारी बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קְחוּ וַעֲשׂוּ
  choice: तैयार करो ... लो
  rationale: हिब्रू में दोनों आज्ञाएँ अलग हैं। हिन्दी में कर्मों के स्वाभाविक क्रम के अनुसार गाड़ी तैयार करने और गायें लेने की क्रियाएँ स्पष्ट रूप से रखी गई हैं।
- source_word: עֲגָלָה חֲדָשָׁה אֶחָת
  choice: एक नई गाड़ी
  rationale: ‘गाड़ी’ इस संदर्भ में पशुओं से खींचे जाने वाले वाहन को दर्शाती है; संख्या और नवीनता दोनों सुरक्षित हैं।
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: दो दूध पिलाती गायें
  rationale: עָלוֹת ऐसी गायों को बताता है जो दूध दे रही हैं और जिनके बछड़े हैं; ‘दूध पिलाती’ आगे बछड़ों के उल्लेख से संबंध भी स्पष्ट रखता है।
- source_word: אֲשֶׁר לֹא עָלָה עֲלֵיהֶם עֹל
  choice: जिन पर कभी जुआ न रखा गया हो
  rationale: हिब्रू मुहावरे का आशय है कि इन गायों को पहले भार खींचने के काम में नहीं लगाया गया था। ‘कभी ... न रखा गया हो’ इसे स्पष्ट और निकट रूप से व्यक्त करता है।
- source_word: וַאֲסַרְתֶּם אֶת־הַפָּרוֹת בָּעֲגָלָה
  choice: गायों को गाड़ी में जोतो
  rationale: क्रिया का संदर्भगत अर्थ पशुओं को गाड़ी खींचने के लिए बाँधना है। ‘गाड़ी में जोतो’ आधुनिक हिन्दी में स्वाभाविक है और पूर्व अनुभव के निषेध के बजाय वर्तमान निर्देश को व्यक्त करता है।
- source_word: וַהֲשֵׁיבֹתֶם בְּנֵיהֶם מֵאַחֲרֵיהֶם הַבָּיְתָה
  choice: उनके बछड़ों को उनसे अलग करके घर लौटा दो
  rationale: हिफ़ील रूप कारणवाचक ‘लौटा दो’ है; בְּנֵיהֶם पशु-संदर्भ में ‘बछड़े’ है और מֵאַחֲרֵיהֶם माताओं से उनके अलग किए जाने को दर्शाता है।
