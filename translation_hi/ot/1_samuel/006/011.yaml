base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/011.yaml
  text: Then they put the ark of Yahweh on the cart[a], along with the box and the gold mice and the images of their tumors.
translation:
  language: hi
  text: तब उन्होंने याहवे का संदूक गाड़ी पर रखा, और उसके साथ पेटी, सोने के चूहे और उनकी गाँठों[a] के प्रतिरूप भी रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सूजन’; सम्भवतः ‘बवासीर’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּשִׂמוּ
  choice: तब उन्होंने ... रख दिया
  rationale: वय्यिक्तोल कथा को आगे बढ़ाता है; ‘तब’ क्रम को और ‘रख दिया’ पूर्ण क्रिया को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: אֲרוֹן יְהוָה
  choice: याहवे का संदूक
  rationale: सन्दर्भ में אֲרוֹן इस्राएल की पवित्र वाचा-पेटी है। ‘संदूक’ हिन्दी में स्थापित और स्पष्ट शब्द है; याहवे को व्यक्तिगत ईश्वरीय नाम के रूप में रखा गया है।
- source_word: אֶל הָעֲגָלָה
  choice: गाड़ी पर
  rationale: यहाँ אֶל वस्तुओं को वाहन पर रखने की दिशा/स्थिति बताता है; ‘गाड़ी पर’ स्वाभाविक हिन्दी है।
- source_word: הָאַרְגַּז
  choice: पेटी
  rationale: यह भेंट की वस्तुओं वाला अलग पात्र है। ‘पेटी’ इसे याहवे के ‘संदूक’ से स्पष्ट रूप से अलग रखती है।
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: सोने के चूहे
  rationale: शाब्दिक अर्थ ‘सोने के चूहे’ है और यह निर्मित प्रतिरूपों की सामग्री को स्पष्ट करता है।
- source_word: צַלְמֵי
  choice: प्रतिमाएँ
  rationale: צֶלֶם किसी रूप, प्रतिरूप या निर्मित छवि को दर्शाता है; इस भेंट के सन्दर्भ में ‘प्रतिमाएँ’ उपयुक्त है।
- source_word: טְחֹרֵיהֶם
  choice: उनकी गाँठों
  rationale: रोग का ठीक चिकित्सीय स्वरूप विवादित है। ‘गाँठें’ मुख्य पाठ में शारीरिक उभार/सूजन का व्यापक अर्थ बनाए रखता है और अनावश्यक रूप से ‘बवासीर’ निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुराक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ नाम को उपाधि से बदलने के बजाय उसका आधुनिक हिन्दी लिप्यंतरण प्रस्तुत करता है।
- issue: טְחֹרֵיהֶם से अभिप्रेत रोग
  choice: गाँठें
  alternative: सूजन; बवासीर की गाँठें
  rationale: इब्रानी शब्द पीड़ादायक उभारों को सूचित करता है, पर उनका सटीक चिकित्सीय स्वरूप निश्चित नहीं है। इसलिए मुख्य पाठ व्यापक अर्थ रखता है और अधिक विशिष्ट सम्भावना पाद-टिप्पणी में देता है।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। दो वाक्यों में विभाजन हिन्दी में सूची को स्पष्ट करता है, जबकि मूल की सभी वस्तुएँ और उनका संबंध सुरक्षित रहता है।
