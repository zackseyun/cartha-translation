source:
  edition: WLC
  text: וַ/יִּקְרְא֣וּ פְלִשְׁתִּ֗ים לַ/כֹּהֲנִ֤ים וְ/לַ/קֹּֽסְמִים֙ לֵ/אמֹ֔ר מַֽה נַּעֲשֶׂ֖ה לַ/אֲר֣וֹן יְהוָ֑ה הוֹדִעֻ֕/נוּ בַּ/מֶּ֖ה נְשַׁלְּחֶ֥/נּוּ לִ/מְקוֹמֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/002.yaml
  text: So the Philistines called for the priests and the diviners[a], saying, “What shall we do with the ark of Yahweh? Tell us with what we should send it to its place.”
translation:
  language: hi
  text: तब पलिश्तियों ने याजकों और शकुन-विचारकों को बुलाकर कहा, “हम याहवे के संदूक का क्या करें? हमें बताओ कि हम उसे किसके साथ[a] उसके स्थान पर भेजें।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ “किसके साथ” या “किस साधन से” है; संदर्भ में प्रश्न यह भी हो सकता है कि संदूक को उसके स्थान पर भेजते समय उसके साथ क्या भेजा जाए।
    reason: मूल अभिव्यक्ति בַּמֶּה ‘किसके साथ/किस साधन से’ का खुला अर्थ रखती है। टिप्पणी संदर्भगत ‘साथ भेजी जाने वाली वस्तु’ की संभावना बताती है, पर उसे मूल पाठ का एकमात्र अर्थ नहीं ठहराती।
lexical_decisions:
- source_word: וַיִּקְרְאוּ
  choice: बुलाकर
  rationale: यहाँ क्रिया विशेषज्ञों को परामर्श के लिए बुलाने का भाव देती है। ‘बुलाकर’ अगले क्रियात्मक कथन से स्वाभाविक रूप से जुड़ता है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह इस प्राचीन जाति के नाम का प्रचलित हिन्दी रूप है; विभक्ति के कारण ‘पलिश्तियों’ रूप स्वाभाविक है।
- source_word: לַכֹּהֲנִים
  choice: याजकों
  rationale: यहाँ निश्चित रूप में पलिश्ती धार्मिक पदाधिकारियों का उल्लेख है। ‘याजक’ आधुनिक बाइबलीय हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: וְלַקֹּסְמִים
  choice: और शकुन-विचारकों
  rationale: קֹסְמִים उन लोगों को दर्शाता है जो शकुन अथवा अन्य साधनों से गुप्त बात जानने का दावा करते थे। यह रूप ‘भविष्यवक्ताओं’ से भेद बनाए रखता है और ‘ज्योतिषियों’ जैसी अनावश्यक संकीर्णता से बचता है।
- source_word: מַה נַּעֲשֶׂה
  choice: हम ... क्या करें?
  rationale: यह प्रथम पुरुष बहुवचन का विचार-विमर्श सूचक प्रश्न है; हिन्दी में यह सीधा और स्वाभाविक रूप है।
- source_word: לַאֲרוֹן יְהוָה
  choice: याहवे के संदूक का
  rationale: ל को हिन्दी के मुहावरे ‘किसी वस्तु का क्या करना’ के अनुसार व्यक्त किया गया है। אָרוֹן के लिए ‘संदूक’ ठोस वस्तु का सामान्य और समझने योग्य शब्द है।
- source_word: הוֹדִיעֻנוּ
  choice: हमें बताओ
  rationale: हिफ़ील आज्ञार्थक का अर्थ ‘हमें ज्ञात कराओ’ है; ‘हमें बताओ’ उसका स्वाभाविक आधुनिक हिन्दी रूप है।
- source_word: בַּמֶּה
  choice: किस वस्तु के साथ
  rationale: पूर्वसर्ग ב और प्रश्नवाचक מֶה का अधिक ठोस अर्थ ‘किसके/किस वस्तु के साथ’ है। निकटवर्ती संदर्भ में संदूक के साथ भेजी जाने वाली भेंट की बात है; केवल ‘कैसे’ कहने से यह संकेत खो सकता है।
- source_word: נְשַׁלְּחֶנּוּ
  choice: हम ... उसे ... भेजें
  rationale: पिएल अपूर्ण रूप परामर्श के प्रसंग में प्रस्तावित कार्य व्यक्त करता है। कर्म-प्रत्यय को ‘उसे’ से स्पष्ट किया गया है।
- source_word: לִמְקוֹמוֹ
  choice: उसके स्थान पर
  rationale: मूल पाठ शाब्दिक रूप से ‘उसके स्थान को/पर’ कहता है। ‘वापस’ संदर्भ से समझा जाता है, पर मूल शब्दों में स्पष्ट नहीं है, इसलिए मुख्य पाठ में नहीं जोड़ा गया।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका विद्वानों में व्यापक रूप से स्वीकृत ध्वन्यात्मक रूप है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: पलिश्ती धार्मिक अधिकारियों की पहचान
  choice: याजकों और शकुन-विचारकों
  alternative: पलिश्ती याजकों और शकुन-विचारकों
  rationale: संदर्भ से स्पष्ट है कि ये पलिश्तियों के अधिकारी हैं, पर मूल पद में अतिरिक्त जातीय विशेषण नहीं है। इसलिए उसे मुख्य पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। संवाद को सीधे प्रश्नों में रखा गया है। ‘शकुन-विचारक’ धार्मिक-सांस्कृतिक अर्थ को बनाए रखता है, जबकि ‘भविष्यवक्ता’ से संभावित धर्मवैचारिक भ्रम से बचाता है।
