source:
  edition: WLC
  text: וְ/הָ/עֲגָלָ֡ה בָּ֠אָה אֶל שְׂדֵ֨ה יְהוֹשֻׁ֤עַ בֵּֽית הַשִּׁמְשִׁי֙ וַ/תַּעֲמֹ֣ד שָׁ֔ם וְ/שָׁ֖ם אֶ֣בֶן גְּדוֹלָ֑ה וַֽ/יְבַקְּעוּ֙ אֶת עֲצֵ֣י הָ/עֲגָלָ֔ה וְ/אֶת הַ֨/פָּר֔וֹת הֶעֱל֥וּ עֹלָ֖ה לַ/יהוָֽה־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/014.yaml
  text: The cart came into the field of Joshua the Beth-shemite and stopped there[a], where there was a large stone[c][b]. Then they split up the wood of the cart and offered up the cows as a burnt offering to Yahweh.
translation:
  language: hi
  text: गाड़ी बेत-शेमेश के निवासी यहोशू के खेत में आई[a] और वहीं रुक गई[b]। वहाँ एक बड़ा पत्थर था। तब उन्होंने गाड़ी की लकड़ी चीर डाली और गायों को याहवे के लिए होमबलि के रूप में चढ़ाया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘बेत-शेमेश के यहोशू के खेत में’ भी कहा जा सकता है। इब्रानी में यहोशू को बेत-शेमेश से संबंधित निवासी बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘और वहीं खड़ी हो गई।’ यहाँ गतिमान गाड़ी के रुकने का अर्थ है।
    reason: lexical_alternative
  - marker: c
    text: 'इब्रानी: יהוה (YHWH)। पारंपरिक हिन्दी रूप ‘यहोवा’ है; अनेक अनुवाद इसे ‘प्रभु’ लिखते हैं। मूल नाम का प्राचीन उच्चारण पूरी निश्चितता से ज्ञात नहीं है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הָעֲגָלָה
  choice: गाड़ी
  rationale: यह शब्द यहाँ उस पहिएदार वाहन को दर्शाता है जिस पर वाचा का संदूक रखा गया था; आधुनिक हिन्दी में ‘गाड़ी’ सहज और प्रसंगानुकूल है।
- source_word: שְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: बेत-शेमेश के निवासी यहोशू के खेत
  rationale: בֵּית הַשִּׁמְשִׁי यहोशू का बेत-शेमेश से संबंध बताने वाला निवासी-सूचक रूप है। हिन्दी में यह वाक्यांश स्वाभाविक ढंग से उसी संबंध को व्यक्त करता है।
- source_word: וַתַּעֲמֹד שָׁם
  choice: और वहीं रुक गई
  rationale: עמד का मूल अर्थ ‘खड़ा होना’ है, पर गतिमान गाड़ी के विषय में यहाँ उसका प्रसंगगत अर्थ ‘रुक जाना’ है।
- source_word: אֶבֶן גְּדוֹלָה
  choice: एक बड़ा पत्थर
  rationale: यह सीधा और स्वाभाविक हिन्दी रूप है; גְּדוֹלָה पत्थर के बड़े आकार या प्रमुखता को बताता है।
- source_word: וַיְבַקְּעוּ אֶת עֲצֵי הָעֲגָלָה
  choice: उन्होंने गाड़ी की लकड़ी चीर डाली
  rationale: בקע लकड़ी को चीरने या फाड़ने का भाव देता है; गाड़ी की लकड़ी को बलि के ईंधन के रूप में तैयार करने का आशय स्पष्ट रहता है।
- source_word: הַפָּרוֹת
  choice: गायों
  rationale: פָּרוֹת मादा गोवंश का सामान्य बहुवचन है। पिछले प्रसंग में उनके दूध देने और बछड़े होने के कारण ‘बछियाँ’ की अपेक्षा ‘गायें’ अधिक सही है।
- source_word: הֶעֱלוּ עֹלָה
  choice: होमबलि के रूप में चढ़ाया
  rationale: यह याजकीय पदावली पूरी तरह जलाकर अर्पित की जाने वाली बलि को दर्शाती है; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और परिचित है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यंजनात्मक नाम יהוה को उसके प्रचलित विद्वत्तापूर्ण उच्चारण ‘याहवे’ से व्यक्त किया गया है और לְ के अर्पण-संबंधी अर्थ को ‘के लिए’ से रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चार अक्षरों वाला विशिष्ट वाचा-नाम है। ‘याहवे’ नाम और उपाधि के भेद को बनाए रखता है; उच्चारण पूर्णतः निश्चित न होने के कारण पारंपरिक विकल्प पाद-टिप्पणी में दिए गए हैं।
- issue: הֶעֱלוּ עֹלָה में बलि का स्वरूप
  choice: होमबलि के रूप में चढ़ाया
  alternative: पूरी तरह जलाकर बलि चढ़ाई
  rationale: עֹלָה एक विशिष्ट बलि है जो वेदी पर पूर्णतः जलाई जाती थी। ‘होमबलि’ उस अनुष्ठानिक श्रेणी को बनाए रखता है और पाठ में इससे अधिक धार्मिक व्याख्या नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। कथात्मक प्रवाह के लिए छोटे वाक्य प्रयोग किए गए हैं। ‘होमबलि’ जैसा स्थापित धार्मिक शब्द रखा गया है, जबकि उसके अर्थ को अनावश्यक रूप से विस्तृत नहीं किया गया।
