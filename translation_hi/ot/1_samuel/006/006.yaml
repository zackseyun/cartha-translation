source:
  edition: WLC
  text: וְ/לָ֤/מָּה תְכַבְּדוּ֙ אֶת לְבַבְ/כֶ֔ם כַּ/אֲשֶׁ֧ר כִּבְּד֛וּ מִצְרַ֥יִם וּ/פַרְעֹ֖ה אֶת לִבָּ֑/ם הֲ/לוֹא֙ כַּ/אֲשֶׁ֣ר הִתְעַלֵּ֣ל בָּ/הֶ֔ם וַֽ/יְשַׁלְּח֖וּ/ם וַ/יֵּלֵֽכוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/006.yaml
  text: Why then do you harden your hearts[a], as Egypt and Pharaoh hardened their hearts? Was it not when he dealt harshly with them that they sent them away[b], and they went?
translation:
  language: hi
  text: फिर तुम अपने मनों को कठोर क्यों करते हो[a], जैसे मिस्र और फ़िरौन ने अपने मनों को कठोर किया था? जब उसने उनके साथ कठोर व्यवहार किया, तब क्या उन्होंने उन्हें जाने नहीं दिया[b], और वे चले गए?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने मनों को भारी क्यों करते हो”; इब्रानी में मन को “भारी करना” उसे कठोर या हठी बनाने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: “उनके साथ” में संकेत मिस्र और फ़िरौन की ओर है; “उन्हें जाने दिया” में संकेत इस्राएलियों की ओर है।
    reason: cross_reference
lexical_decisions:
- source_word: תְכַבְּדוּ / כִּבְּדוּ
  choice: अपने मनों को कठोर करते हो / अपने मनों को कठोर किया था
  rationale: כבד का पिएल रूप ‘मन/हृदय’ के साथ शाब्दिक रूप से उसे ‘भारी करना’ और मुहावरे के रूप में हठी या कठोर बनाना व्यक्त करता है। आधुनिक हिन्दी में ‘मन कठोर करना’ अर्थ को स्वाभाविक ढंग से पहुँचाता है; दोनों प्रयोगों में समान अनुवाद रखा गया है।
- source_word: לְבַבְכֶם / לִבָּם
  choice: अपने मनों / अपने मनों
  rationale: लेवाव यहाँ अंतःकरण, इच्छा और निर्णय-शक्ति का द्योतक है। बहुवचन ‘मनों’ सम्बोधित समूह और मिस्र तथा फ़िरौन से जुड़े सामूहिक बहुवचन को बनाए रखता है।
- source_word: מִצְרַיִם וּפַרְעֹה
  choice: मिस्र और फ़िरौन
  rationale: मूल में स्थाननाम ‘मिस्र’ उसके लोगों या शासकीय शक्ति के लिए सामूहिक रूप से प्रयुक्त है। इसे ‘मिस्री लोग’ बनाकर स्पष्ट करने के बजाय मूल अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: הֲלוֹא כַּאֲשֶׁר
  choice: जब … तब क्या … नहीं
  rationale: הֲלוֹא सहमति की अपेक्षा रखने वाला आलंकारिक प्रश्न है और दूसरा כַּאֲשֶׁר समयसूचक है। हिन्दी की ‘जब…तब क्या…नहीं’ रचना दोनों भूमिकाएँ स्पष्ट और स्वाभाविक रूप से व्यक्त करती है।
- source_word: הִתְעַלֵּל בָּהֶם
  choice: उसने उनके साथ कठोर व्यवहार किया
  rationale: हित्पाएल रूप यहाँ मिस्र पर किए गए दंडात्मक और कठोर व्यवहार को सूचित करता है। ‘कठोर व्यवहार किया’ बल को बनाए रखता है, पर उसके ढंग को मूल से अधिक विशिष्ट नहीं करता।
- source_word: וַיְשַׁלְּחוּם
  choice: उन्होंने उन्हें जाने दिया
  rationale: שלח इस प्रसंग में भेज देने या मुक्त करके जाने देने का अर्थ रखता है। हिन्दी में ‘जाने दिया’ निर्गमन-संदर्भ में स्वाभाविक है और सर्वनामों की मूल संक्षिप्तता बनाए रखता है।
- source_word: וַיֵּלֵכוּ
  choice: वे चले गए
  rationale: הלך की सरल और संक्षिप्त क्रिया-श्रृंखला को ‘वे चले गए’ स्वाभाविक हिन्दी में सुरक्षित रखता है।
theological_decisions:
- issue: הִתְעַלֵּל का अप्रकट कर्ता
  choice: ‘उसने’ द्वारा कर्ता को सर्वनाम के रूप में रखा गया है; निर्गमन-संदर्भ में यह परमेश्वर की ओर संकेत करता है।
  alternative: ‘जब उनके साथ कठोर व्यवहार हुआ’ जैसा निर्वैयक्तिक अनुवाद।
  rationale: इब्रानी में कर्ता स्पष्ट संज्ञा के रूप में नहीं दिया गया, पर क्रिया एकवचन पुल्लिंग है और व्यापक निर्गमन-संदर्भ परमेश्वर की ओर संकेत करता है। ‘उसने’ आवश्यक हिन्दी कर्ता देता है, फिर भी पद में ‘परमेश्वर’ जोड़कर निहित बात को अनावश्यक रूप से स्पष्ट नहीं करता।
- issue: दो अलग समूहों के लिए समान सर्वनाम
  choice: मुख्य पाठ में ‘उनके’ और ‘उन्हें’ रखा गया तथा पादटिप्पणी में उनके अलग-अलग संकेत स्पष्ट किए गए।
  alternative: मुख्य पाठ में ‘मिस्रियों’ और ‘इस्राएलियों’ को दोहराकर सर्वनामों को स्पष्ट करना।
  rationale: मूल की संक्षिप्तता और सर्वनामिक रचना को सुरक्षित रखते हुए पाठक को संभावित भ्रम से बचाने के लिए पादटिप्पणी उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सरल स्तर रखा गया है। ‘मन कठोर करना’, ‘जाने दिया’ और ‘चले गए’ सामान्य पाठक के लिए स्वाभाविक हैं। मूल के सामूहिक ‘मिस्र’, आलंकारिक प्रश्न, अप्रकट कर्ता और बदलते सर्वनाम-संदर्भ को बिना सांप्रदायिक व्याख्या जोड़े सुरक्षित रखा गया है।
