  text: וַ/יֹּאמְר֗וּ מָ֣ה הָ/אָשָׁם֮ אֲשֶׁ֣ר נָשִׁ֣יב ל/וֹ֒ וַ/יֹּאמְר֗וּ מִסְפַּר֙ סַרְנֵ֣י פְלִשְׁתִּ֔ים חֲמִשָּׁה֙ עפלי זָהָ֔ב וַ/חֲמִשָּׁ֖ה עַכְבְּרֵ֣י זָהָ֑ב כִּֽי מַגֵּפָ֥ה אַחַ֛ת לְ/כֻלָּ֖/ם וּ/לְ/סַרְנֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/004.yaml
  text: 'And they said[a], “What is the guilt offering that we should return to him?” They said, “According to the number of the Philistine rulers: five golden tumors and five golden mice[c][b], for one plague was on all of them and on your rulers.”'
translation:
  language: hi
  text: उन्होंने पूछा, “हम उसके पास कौन-सी दोष-बलि वापस भेजें?” उन्होंने उत्तर दिया, “पलिश्ती शासकों की संख्या के अनुसार सोने की पाँच सूजनें[a] और सोने के पाँच चूहे; क्योंकि तुम सब पर और तुम्हारे शासकों पर एक ही महामारी आई है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द संभवतः महामारी से हुई गाँठों या सूजनों को दर्शाता है; कुछ अनुवाद इसे अधिक विशिष्ट रूप से “बवासीर” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָאָשָׁם
  choice: दोष-बलि
  rationale: यहाँ אָשָׁם अपराध के निवारण और क्षतिपूर्ति से जुड़ी भेंट है। ‘दोष-बलि’ प्रचलित, संक्षिप्त और उपासना-संबंधी संदर्भ के अनुकूल है।
- source_word: נָשִׁיב לוֹ
  choice: हम उसे ... चढ़ाकर लौटाएँ
  rationale: שׁוב के हिफ़ील रूप में लौटाने का भाव है और לוֹ पुल्लिंग एकवचन है। हिंदी वाक्य में भेंट चढ़ाकर लौटाने की क्रिया स्वाभाविक रूप से व्यक्त की गई है; ‘उसे’ इस्राएल के परमेश्वर की ओर संकेत करता है।
- source_word: מִסְפַּר סַרְנֵי פְלִשְׁתִּים
  choice: पलिश्ती शासकों की संख्या के अनुसार
  rationale: पदबंध पाँच वस्तुओं और पाँच पलिश्ती अगुओं की संख्या के बीच अनुरूपता बताता है।
- source_word: סַרְנֵי
  choice: शासक
  rationale: यह पलिश्तियों के प्रमुख राजनीतिक अगुओं की विशिष्ट उपाधि है। ‘शासक’ आधुनिक हिंदी में अधिकार का अर्थ स्पष्ट करता है और सामंती अर्थ आरोपित नहीं करता।
- source_word: עפלי זָהָב
  choice: सोने की पाँच सूजनें
  rationale: עפלים महामारी से जुड़ी शारीरिक गाँठों या सूजनों को दर्शाता है। ‘सूजनें’ रोग का स्थान या ठीक चिकित्सीय स्वरूप अनावश्यक रूप से निश्चित नहीं करता।
- source_word: עַכְבְּרֵי זָהָב
  choice: सोने के पाँच चूहे
  rationale: עַכְבָּר का सीधा अर्थ ‘चूहा’ है; संख्या और पदार्थ दोनों स्पष्ट रखे गए हैं।
- source_word: מַגֵּפָה אַחַת
  choice: एक ही महामारी
  rationale: אַחַת सब लोगों और शासकों पर आई समान विपत्ति पर बल देता है; ‘एक ही महामारी’ हिंदी में यह अर्थ स्वाभाविक रूप से पहुँचाता है।
- source_word: לְכֻלָּם וּלְסַרְנֵיכֶם
  choice: तुम सब पर और तुम्हारे शासकों पर
  rationale: दूसरे खंड के द्वितीय पुरुष बहुवचन से संबोधन स्पष्ट होता है; पहले सर्वनाम को भी उसी संबोधित समुदाय के रूप में व्यक्त करना हिंदी में अधिक स्वाभाविक है।
theological_decisions:
- issue: לוֹ सर्वनाम का संदर्भ
  choice: ‘उसे’, अर्थात इस्राएल के परमेश्वर को
  alternative: ‘उसे/उसके साथ’, अर्थात सन्दूक को
  rationale: पुल्लिंग एकवचन सर्वनाम दोनों संदर्भों की संभावना छोड़ सकता है, पर दोष-बलि द्वारा अपराध का निवारण परमेश्वर की ओर व्यक्तिगत संकेत को अधिक संगत बनाता है। अनुवाद में नाम जोड़कर संदर्भ को जरूरत से अधिक निश्चित नहीं किया गया।
- issue: אָשָׁם का बलिदानी और क्षतिपूरक आयाम
  choice: दोष-बलि
  alternative: क्षतिपूर्ति-भेंट / अपराध-बलि
  rationale: पद में अपराध और उसकी भरपाई दोनों निहित हो सकते हैं। मुख्य पाठ में परिचित बलिदानी पद रखा गया है, बिना किसी विशेष सांप्रदायिक व्याख्या को जोड़ने के।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘पलिश्ती’, ‘दोष-बलि’ और ‘महामारी’ बाइबलीय संदर्भ के अनुरूप हैं, जबकि रोग का ठीक स्वरूप मुख्य पाठ में अनिश्चित रखा गया है।
