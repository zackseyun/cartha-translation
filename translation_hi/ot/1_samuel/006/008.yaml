base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/008.yaml
  text: Then take the ark of Yahweh and place it on the cart[a], and put the gold objects that you are returning to him as a guilt offering in a box beside it. Then send it away[c][b], and let it go.
translation:
  language: hi
  text: फिर यहोवा का संदूक लो और उसे गाड़ी पर रखो। सोने की जो वस्तुएँ तुम उसे दोष-बलि के रूप में लौटा रहे हो, उन्हें संदूक के पास एक पेटी में रख दो। फिर उसे भेज दो, और वह चला जाए।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: c
    text: शाब्दिक रूप से, ‘और वह जाएगा’; निर्देशों के इस क्रम में इसका भाव है कि उसे भेजकर जाने दिया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का संदूक
  rationale: אֲרוֹן यहाँ पवित्र संदूक को सूचित करता है; יְהוָה को उसके नाम के रूप में ‘यहोवा’ से व्यक्त किया गया है।
- source_word: הָעֲגָלָה
  choice: गाड़ी
  rationale: עגלה बैलों द्वारा खींची जाने वाली गाड़ी है; आधुनिक हिन्दी में ‘गाड़ी’ स्वाभाविक और संदर्भानुकूल है।
- source_word: כְּלֵי הַזָּהָב
  choice: सोने की वस्तुएँ
  rationale: כְּלִי व्यापक शब्द है और वस्तु, पात्र या उपकरण को सूचित कर सकता है; संदर्भ में आकृतियाँ होने के कारण ‘वस्तुएँ’ अनावश्यक विशिष्टता से बचता है।
- source_word: הֲשֵׁבֹתֶם לוֹ
  choice: जिन्हें तुम ... उसे लौटा रहे हो
  rationale: שוב के हिफ़ील रूप का अर्थ यहाँ वापस करना या लौटाना है; वर्तमान निर्देश के संदर्भ में ‘लौटा रहे हो’ स्वाभाविक है।
- source_word: אָשָׁם
  choice: दोष-बलि
  rationale: यह प्रायश्चित अथवा क्षतिपूर्ति से जुड़ा पारिभाषिक बलि-शब्द है; ‘दोष-बलि’ इसके उपासना-संबंधी स्वरूप को बनाए रखता है।
- source_word: בָאַרְגַּז
  choice: एक पेटी में
  rationale: אַרְגָּז किसी पेटी या छोटे संदूक को दर्शाता है; ‘पेटी’ मुख्य पवित्र संदूक से स्पष्ट भेद भी रखता है।
- source_word: מִצִּדּוֹ
  choice: संदूक के पास
  rationale: शाब्दिक अर्थ ‘उसके बगल में’ है; संज्ञा दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है और प्रत्यय का सबसे स्वाभाविक पूर्वपद, संदूक, व्यक्त होता है।
- source_word: וְשִׁלַּחְתֶּם אֹתוֹ
  choice: फिर उसे रवाना कर दो
  rationale: שׁלח का अर्थ यहाँ भेज देना या छोड़ देना है; ‘रवाना कर दो’ निर्देशात्मक क्रम और गति दोनों को सहज हिन्दी में व्यक्त करता है।
- source_word: וְהָלָךְ
  choice: और वह चला जाए
  rationale: रूपतः इसका अर्थ ‘और वह जाएगा’ है, पर निर्देशों की इस शृंखला में इच्छार्थक ‘चला जाए’ स्वाभाविक है और मूल की संक्षिप्तता बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिनाम है, इसलिए उसे सामान्य उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ रखा गया है।
- issue: पलिश्ती संदर्भ में אָשָׁם
  choice: दोष-बलि
  alternative: दोष का चढ़ावा; क्षतिपूर्ति-भेंट
  rationale: वर्णनकर्ता उपासना-संबंधी पारिभाषिक शब्द का प्रयोग करता है; ‘दोष-बलि’ उस संबंध को सुरक्षित रखता है, बिना पलिश्तियों की धर्मवैचारिक समझ को अधिक निश्चित किए।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। छोटे वाक्यों से निर्देशों का क्रम सहज बनाया गया है। ‘संदूक’ और ‘पेटी’ अलग शब्दों में रखे गए हैं ताकि पवित्र संदूक और सोने की वस्तुओं वाले पात्र में भ्रम न हो।
