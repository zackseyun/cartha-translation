source:
  edition: WLC
  text: וַ/יֹּאמְר֗וּ אִֽם מְשַׁלְּחִ֞ים אֶת אֲר֨וֹן אֱלֹהֵ֤י יִשְׂרָאֵל֙ אַל תְּשַׁלְּח֤וּ אֹת/וֹ֙ רֵיקָ֔ם כִּֽי הָשֵׁ֥ב תָּשִׁ֛יבוּ ל֖/וֹ אָשָׁ֑ם אָ֤ז תֵּרָֽפְאוּ֙ וְ/נוֹדַ֣ע לָ/כֶ֔ם לָ֛/מָּה לֹא תָס֥וּר יָד֖/וֹ מִ/כֶּֽם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/003.yaml
  text: And they said[a], “If you are sending away the ark of the God of Israel, do not send it away empty, for you must surely return to him a guilt offering. Then you will be healed[b], and it will be made known to you why his hand has not turned away from you.”
translation:
  language: hi
  text: उन्होंने कहा, “यदि तुम इस्राएल के परमेश्वर के संदूक को वापस भेज रहे हो, तो उसे खाली मत भेजो; क्योंकि तुम्हें इस्राएल के परमेश्वर को दोष-भेंट[a] अवश्य अर्पित करनी होगी। तब तुम चंगे हो जाओगे, और तुम्हें पता चल जाएगा कि उसका हाथ तुम पर से क्यों नहीं हटा है।”[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “क्षतिपूर्ति-भेंट”; परम्परागत रूप से “अपराध-बलि।”
    reason: lexical_alternative
  - marker: b
    text: “उसका हाथ” परमेश्वर की दण्ड देने वाली सामर्थ्य के लिए प्रचलित इब्रानी रूपक है।
    reason: cultural_note
lexical_decisions:
- source_word: מְשַׁלְּחִים / תְּשַׁלְּחוּ
  choice: वापस भेज रहे हो / मत भेजो
  rationale: सन्दर्भ में संदूक को पलिश्तियों के अधिकार से इस्राएल की ओर लौटाना अभिप्रेत है। पहले प्रयोग में ‘वापस’ इसे स्पष्ट करता है, जबकि दूसरे में अनावश्यक पुनरुक्ति से बचते हुए मूल क्रिया की पुनरावृत्ति बनी रहती है।
- source_word: אֲרוֹן אֱלֹהֵי יִשְׂרָאֵל
  choice: इस्राएल के परमेश्वर का संदूक
  rationale: यह मूल सम्बन्धवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; इसमें अनुपस्थित ‘वाचा’ जैसे किसी बाद के संक्षिप्त नाम को नहीं जोड़ा गया।
- source_word: רֵיקָם
  choice: खाली
  rationale: संदूक को किसी प्रतिपूरक भेंट के बिना न लौटाने की बात है। ‘खाली’ मूल रूपक को संक्षेप और स्वाभाविकता से बनाए रखता है।
- source_word: הָשֵׁב תָּשִׁיבוּ
  choice: अवश्य चढ़ाओ
  rationale: इनफ़िनिटिव ऐब्सल्यूट और सीमित क्रिया का संयोजन प्रबल आग्रह/अनिवार्यता व्यक्त करता है। दोष-बलि के साथ हिन्दी में ‘चढ़ाना’ स्वाभाविक है और ‘अवश्य’ मूल बलाघात को व्यक्त करता है।
- source_word: לּוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन प्रत्यय का सबसे स्वाभाविक सन्दर्भ इस्राएल का परमेश्वर है। हिन्दी ‘उसे’ परमेश्वर के व्यक्तिगत सन्दर्भ को बनाए रखता है।
- source_word: אָשָׁם
  choice: दोष-बलि
  rationale: אָשָׁם दोष के कारण दी जाने वाली ऐसी भेंट है जिसमें क्षतिपूर्ति का भाव भी हो सकता है। ‘दोष-बलि’ संक्षिप्त और पारदर्शी है; विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: תֵּרָפְאוּ
  choice: तुम चंगे हो जाओगे
  rationale: רפא का निफ़अल रूप विपत्ति से चंगाई/मुक्ति का परिणाम बताता है। ‘चंगे हो जाओगे’ उसके निष्क्रिय-परिणामात्मक भाव को स्वाभाविक हिन्दी में रखता है।
- source_word: וְנוֹדַע לָכֶם
  choice: तुम्हें पता चल जाएगा
  rationale: 'निफ़अल का भाव हिन्दी के इस स्वाभाविक अनुभवकर्ता-वाक्य में बना रहता है: बात उनके लिए ज्ञात हो जाएगी। अधिक कृत्रिम ‘तुम्हें ज्ञात कराया जाएगा’ से बचा गया है।'
- source_word: לָמָּה לֹא תָסוּר יָדוֹ מִכֶּם
  choice: उसका हाथ तुम पर से क्यों नहीं हटा है
  rationale: ‘हाथ’ परमेश्वर की दण्ड देने वाली सामर्थ्य का महत्वपूर्ण इब्रानी रूपक है। उसे व्याख्यात्मक रूप से ‘दण्ड’ में बदलने के बजाय अक्षुण्ण रखा गया है; ‘तुम पर से’ हिन्दी में लगातार पड़े दबाव को स्पष्ट करता है।
theological_decisions:
- issue: לּוֹ में सर्वनाम का सन्दर्भ
  choice: दोष-बलि ‘उसे’, अर्थात् इस्राएल के परमेश्वर को चढ़ाई जाती है।
  alternative: दोष-बलि ‘उसके साथ’, अर्थात् संदूक के साथ वापस भेजी जाती है।
  rationale: निकटवर्ती ‘इस्राएल के परमेश्वर’ और बलिदानी शब्द אָשָׁם व्यक्तिगत ईश्वरीय सन्दर्भ के पक्ष में हैं। फिर भी व्यवहार में भेंट संदूक के साथ भेजी जाएगी; अनुवाद व्याकरण के अधिक सम्भावित व्यक्तिगत सन्दर्भ को रखता है।
- issue: ‘उसका हाथ’ का अर्थ
  choice: परमेश्वर की पीड़ा पहुँचाने वाली सामर्थ्य/न्याय का रूपक मूल रूप में रखा गया है।
  alternative: ‘उसका दण्ड’ या ‘उसकी मार’ जैसा स्पष्ट व्याख्यात्मक अनुवाद।
  rationale: यह पुराने नियम का महत्वपूर्ण और समझ में आने योग्य रूपक है। इसे बनाए रखना पाठ की धर्मवैज्ञानिक छवि और कुछ व्याख्यात्मक खुलापन दोनों सुरक्षित रखता है।
- issue: चंगाई और ज्ञान के बीच सम्बन्ध
  choice: ‘तब’ के द्वारा क्रम/परिणाम व्यक्त किया गया है, पर यह निश्चित नहीं किया गया कि चंगाई ही एकमात्र प्रमाण है।
  alternative: ‘तब तुम चंगे हो जाओगे और जान लोगे’ को सीधे निर्णायक प्रमाण के रूप में पढ़ना।
  rationale: אָז क्रम अथवा परिणाम सूचित करता है; वाक्य दोनों परिणामों को जोड़ता है, लेकिन उनके तार्किक सम्बन्ध को पूरी तरह नहीं खोलता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। ‘परमेश्वर’, ‘संदूक’, ‘दोष-बलि’ और ‘चंगे’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं; [a] सम्बन्धित पद के साथ और [b] पूरे रूपक-वाक्य के बाद रखा गया है।
