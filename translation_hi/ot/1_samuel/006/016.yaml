translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक रखी गई है। ‘सरदारों’ या ‘प्रभुओं’ के बजाय ‘शासकों’ से आधिकारिक राजनीतिक पद स्पष्ट होता है। मूल पाठ की अनुच्छेद-समापन सूचना (ס) को पद के अनुवाद में अलग चिह्नित नहीं किया गया है।
