  yaml_path: translation/ot/1_samuel/006/016.yaml
  text: When the five rulers of the Philistines saw it[b][a], they returned to Ekron that same day.
translation:
  language: hi
  text: जब पलिश्तियों के पाँचों शासकों ने यह देखा, तो वे उसी दिन एक्रोन लौट गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַ/חֲמִשָּׁה
  choice: पाँचों
  rationale: यहाँ ज्ञात पाँच पलिश्ती नगर-शासकों का पूरा समूह अभिप्रेत है; आधुनिक हिन्दी में ‘पाँचों’ इसे स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: סַרְנֵי
  choice: शासकों
  rationale: סֶרֶן पलिश्ती नगरों के आधिकारिक शासक की उपाधि है। ‘शासक’ राजनीतिक अधिकार को स्पष्ट, वर्तमान और गैर-सांप्रदायिक भाषा में व्यक्त करता है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों के
  rationale: यह संबंधसूचक बहुवचन है और ‘शासकों’ के साथ मिलकर ‘पलिश्तियों के शासक’ बनाता है।
- source_word: רָאוּ
  choice: यह देखा
  rationale: इब्रानी में कर्म व्यक्त नहीं है, पर निकटवर्ती प्रसंग से अभी वर्णित घटना अभिप्रेत है। हिन्दी में ‘यह’ जोड़ने से वाक्य स्वाभाविक रहता है और संदर्भ से आगे कोई विशिष्ट व्याख्या आरोपित नहीं होती।
- source_word: וַ/יָּשֻׁבוּ
  choice: लौट गए
  rationale: कथात्मक क्रम में שוב का स्वाभाविक हिन्दी रूप; यह उनके वापस जाने को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: עֶקְרוֹן
  choice: एक्रोन
  rationale: स्थान-नाम का प्रचलित हिन्दी लिप्यंतरण; गति-सूचक ‘लौट गए’ के साथ गंतव्य बिना परसर्ग के भी स्वाभाविक है।
- source_word: בַּ/יּוֹם הַ/הוּא
  choice: उसी दिन
  rationale: शाब्दिक अर्थ ‘उस दिन’ है; प्रसंग में ‘उसी दिन’ तत्काल समय-संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
