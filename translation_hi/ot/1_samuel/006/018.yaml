source:
  edition: WLC
  text: וְ/עַכְבְּרֵ֣י הַ/זָּהָ֗ב מִסְפַּ֞ר כָּל עָרֵ֤י פְלִשְׁתִּים֙ לַ/חֲמֵ֣שֶׁת הַ/סְּרָנִ֔ים מֵ/עִ֣יר מִבְצָ֔ר וְ/עַ֖ד כֹּ֣פֶר הַ/פְּרָזִ֑י וְ/עַ֣ד אָבֵ֣ל הַ/גְּדוֹלָ֗ה אֲשֶׁ֨ר הִנִּ֤יחוּ עָלֶ֨י/הָ֙ אֵ֚ת אֲר֣וֹן יְהוָ֔ה עַ֚ד הַ/יּ֣וֹם הַ/זֶּ֔ה בִּ/שְׂדֵ֥ה יְהוֹשֻׁ֖עַ בֵּֽית הַשִּׁמְשִֽׁי־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/018.yaml
  text: and the golden mice[a], according to the number of all the cities of the Philistines belonging to the five rulers, from fortified city to unwalled village, and as far as the great stone on which they set down the ark of Yahweh, which remains to this day in the field of Joshua the Beth-shemite.
translation:
  language: hi
  text: और सोने के चूहे भी पलिश्तियों के उन सभी नगरों की गिनती के अनुसार थे जो पाँचों शासकों के अधीन थे—गढ़वाले नगर से लेकर बिना दीवार के गाँव तक, और उस बड़े पत्थर[a] तक, जिस पर उन्होंने याहवे का संदूक रखा था और जो आज तक बेत-शेमेशवासी यहोशू के खेत में है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “बड़े आबेल तक”; हिब्रू को “बड़ा पत्थर” के बजाय स्थान-नाम माना जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַכְבְּרֵי הַזָּהָב
  choice: सोने के चूहे
  rationale: עַכְבָּר चूहे या चूहे-जैसे कृंतक को दर्शाता है; प्रसंग में महामारी के प्रतीक रूपों के लिए स्वाभाविक हिन्दी अभिव्यक्ति।
- source_word: מִסְפַּר כָּל עָרֵי פְלִשְׁתִּים
  choice: पलिश्तियों के उन सभी नगरों की गिनती के अनुसार
  rationale: מִסְפַּר यहाँ संख्या में अनुरूपता बताता है; यह अनुवाद उस संबंध को स्पष्ट रखता है।
- source_word: לַחֲמֵשֶׁת הַסְּרָנִים
  choice: जो पाँचों शासकों के अधीन थे
  rationale: סְרָנִים पलिश्ती प्रमुखों की विशिष्ट उपाधि है; 'शासक' आधुनिक हिन्दी में स्पष्ट है और वाक्यगत संबंध को 'अधीन' स्वाभाविक बनाता है।
- source_word: מֵעִיר מִבְצָר וְעַד כֹּפֶר הַפְּרָזִי
  choice: गढ़वाले नगर से लेकर बिना दीवार के गाँव तक
  rationale: यह गढ़युक्त और खुले ग्रामीण निवासों का विरोध सुरक्षित रखता है और सभी प्रकार की बस्तियों को समेटता है।
- source_word: וְעַד אָבֵל הַגְּדוֹלָה
  choice: और उस बड़े पत्थर तक
  rationale: मसोरेटिक स्वरांकन 'बड़ा आबेल' का संकेत देता है, पर अगले संबंधवाचक उपवाक्य में सन्दूक उस पर रखे जाने के कारण प्रसंग पत्थर के अर्थ का समर्थन करता है; वैकल्पिक पाठ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר הִנִּיחוּ עָלֶיהָ אֵת אֲרוֹן יְהוָה
  choice: जिस पर उन्होंने याहवे का सन्दूक रखा था
  rationale: הִנִּיחוּ का सामान्य कथात्मक अर्थ 'रखना/नीचे रखना' है; 'सन्दूक' ארון के धार्मिक प्रसंग को स्पष्ट करता है।
- source_word: עַד הַיּוֹם הַזֶּה
  choice: जो आज तक ... है
  rationale: हिब्रू मुहावरा लेखक के समय तक बने रहने का संकेत देता है; हिन्दी में आवश्यक क्रिया जोड़कर अर्थ स्वाभाविक किया गया है।
- source_word: בִּשְׂדֵה יְהוֹשֻׁעַ בֵּית הַשִּׁמְשִׁי
  choice: बेत-शेमेशवासी यहोशू के खेत में
  rationale: בֵּית הַשִּׁמְשִׁי स्थान-व्युत्पन्न निवासी-संज्ञा है; हिन्दी में '-वासी' इसका अर्थ साफ़ और स्वाभाविक रूप से देता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; लिप्यंतरण उसे सामान्य उपाधि में बदले बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज लेकिन गरिमापूर्ण शैली रखी गई है। पलिश्ती पदवी के लिए 'शासक', बस्ती-विरोध के लिए 'गढ़वाला नगर/बिना दीवार का गाँव', और निवासी-संज्ञा के लिए 'बेत-शेमेशवासी' चुना गया है।
