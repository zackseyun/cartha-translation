source:
  edition: WLC
  text: וּ/רְאִיתֶ֗ם אִם דֶּ֨רֶךְ גְּבוּל֤/וֹ יַֽעֲלֶה֙ בֵּ֣ית שֶׁ֔מֶשׁ ה֚וּא עָ֣שָׂה לָ֔/נוּ אֶת הָ/רָעָ֥ה הַ/גְּדוֹלָ֖ה הַ/זֹּ֑את וְ/אִם לֹ֗א וְ/יָדַ֨עְנוּ֙ כִּ֣י לֹ֤א יָד/וֹ֙ נָ֣גְעָה בָּ֔/נוּ מִקְרֶ֥ה ה֖וּא הָ֥יָה לָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/009.yaml
  text: 'And watch: if it goes up by the way of its territory to Beth-shemesh[a], then he is the one who has done this great harm to us; but if not, then we will know that it was not his hand that struck us[b]; it happened to us by chance.'
translation:
  language: hi
  text: 'और देखना: यदि वह अपने क्षेत्र के मार्ग से बेत-शेमेश की ओर चढ़ जाए, तो यह बड़ी विपत्ति[a] उसी ने हम पर डाली है; पर यदि ऐसा न हो, तो हम जान लेंगे कि उसका हाथ हम पर नहीं पड़ा; यह हमारे साथ संयोग से हुआ है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह बड़ी हानि’ अथवा ‘यह बड़ी आपदा।’ इब्रानी शब्द गंभीर हानि या विपत्ति को भी व्यक्त कर सकता है; यहाँ इसका अर्थ अनिवार्य रूप से नैतिक बुराई नहीं है।
    reason: lexical_alternative
  - marker: b
    text: या ‘यह हमारे लिए एक आकस्मिक घटना थी।’
    reason: lexical_alternative
lexical_decisions:
- source_word: וּרְאִיתֶם
  choice: और देखते रहना
  rationale: बहुवचन आज्ञार्थक रूप यहाँ गाड़ी की दिशा को ध्यान से देखकर परीक्षा का परिणाम जानने को कहता है।
- source_word: דֶּרֶךְ גְּבוּלוֹ
  choice: अपने क्षेत्र के मार्ग से
  rationale: דֶּרֶךְ का अर्थ ‘मार्ग’ और גְּבוּל का अर्थ ‘सीमा/क्षेत्र’ है। यह अनुवाद गंतव्य के उचित भूभाग की ओर जाने का भाव रखता है, पर इब्रानी की सर्वनाम-संबंधी हल्की अस्पष्टता को नहीं मिटाता।
- source_word: יַעֲלֶה
  choice: चढ़ जाए
  rationale: עלה का मूल अर्थ ‘ऊपर जाना/चढ़ना’ है; बेत-शेमेश की ओर भौगोलिक गति के संदर्भ में इसे बनाए रखा गया है।
- source_word: בֵּית שֶׁמֶשׁ
  choice: बेत-शेमेश
  rationale: स्थान-नाम का प्रचलित देवनागरी लिप्यंतरण।
- source_word: הוּא עָשָׂה לָנוּ
  choice: हम पर उसी ने डाली है
  rationale: स्वतंत्र सर्वनाम הוּא के बलाघात को ‘उसी ने’ से व्यक्त किया गया है; ‘डाली है’ विपत्ति पहुँचाने के लिए स्वाभाविक हिन्दी है।
- source_word: הָרָעָה הַגְּדוֹלָה הַזֹּאת
  choice: यह बड़ी विपत्ति
  rationale: רָעָה यहाँ नैतिक बुराई के बजाय गंभीर हानि या आपदा का संकेत देती है; ‘विपत्ति’ प्रसंगानुकूल और गरिमापूर्ण है।
- source_word: יָדוֹ נָגְעָה בָּנוּ
  choice: उसका हाथ हम पर पड़ा
  rationale: शाब्दिक ‘हाथ ने छुआ’ के स्थान पर यह स्वाभाविक हिन्दी मुहावरा सक्रिय प्रहार या दंड का भाव रखता है।
- source_word: מִקְרֶה הוּא הָיָה לָנוּ
  choice: यह हमारे साथ संयोग से हुआ है
  rationale: מִקְרֶה आकस्मिक घटना या संयोग को दर्शाता है; हिन्दी वाक्यांश स्रोत का संभावित गैर-दैवी कारण वाला निष्कर्ष स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय कार्य के संदर्भ में רָעָה का अनुवाद
  choice: बड़ी विपत्ति
  alternative: बड़ी हानि / बड़ी आपदा / बड़ी बुराई
  rationale: यहाँ शब्द पलिश्तियों पर आई गंभीर मार को बताता है। ‘विपत्ति’ दंड की तीव्रता बनाए रखती है, पर परमेश्वर पर नैतिक बुराई करने का अनावश्यक अर्थ नहीं थोपती।
- issue: הוּא में कर्ता की पहचान
  choice: उसी ने
  alternative: उसने / वही है जिसने
  rationale: इब्रानी सर्वनाम बलाघाती है। हिन्दी में ‘उसी ने’ उसी बल को रखता है और पद में नाम न होने के कारण संदर्भगत सर्वनाम को किसी व्याख्यात्मक नाम से नहीं बदलता।
- issue: दैवी हाथ और संयोग के बीच परीक्षा
  choice: उसका हाथ हम पर नहीं पड़ा; यह हमारे साथ संयोग से हुआ है
  alternative: उसने हमें नहीं मारा; यह आकस्मिक घटना थी
  rationale: पलिश्तियों की अपनी वैकल्पिक व्याख्याओं—दैवी प्रहार या संयोग—के बीच तनाव को ज्यों का त्यों रखा गया है; कथावाचक की ओर से उनके निष्कर्ष का समर्थन नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। ‘देखते रहना’ प्रेक्षण की आज्ञा, ‘उसी ने’ मूल का बलाघात, और ‘हाथ हम पर पड़ा’ इब्रानी रूपक को स्वाभाविक हिन्दी में बनाए रखते हैं। दोनों पादटिप्पणी-चिह्न संबंधित पदांशों के तुरंत बाद रखे गए हैं।
