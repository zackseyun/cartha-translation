  text: וַ/יִשַּׁ֨רְנָה הַ/פָּר֜וֹת בַּ/דֶּ֗רֶךְ עַל דֶּ֨רֶךְ֙ בֵּ֣ית שֶׁ֔מֶשׁ בִּ/מְסִלָּ֣ה אַחַ֗ת הָלְכ֤וּ הָלֹךְ֙ וְ/גָע֔וֹ וְ/לֹא סָ֖רוּ יָמִ֣ין וּ/שְׂמֹ֑אול וְ/סַרְנֵ֤י פְלִשְׁתִּים֙ הֹלְכִ֣ים אַחֲרֵי/הֶ֔ם עַד גְּב֖וּל בֵּ֥ית שָֽׁמֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/012.yaml
  text: And the cows went straight on the road toward Beth-shemesh[a], along one highway; they went on, lowing as they went, and did not turn aside to the right or to the left[c][b]. And the lords of the Philistines were walking behind them as far as the border of Beth-shemesh.
translation:
  language: hi
  text: और गायें बेत-शेमेश को जानेवाले मार्ग पर एक ही सड़क से सीधे चलीं। वे रँभाती हुई लगातार चलती रहीं और न दाहिनी ओर मुड़ीं, न बाईं ओर। पलिश्तियों के शासक उनके पीछे-पीछे बेत-शेमेश की सीमा तक चलते गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִשַּׁרְנָה
  choice: सीधे ... चल पड़ीं
  rationale: ישר यहाँ गायों के सीधे और निश्चित दिशा में बढ़ने को व्यक्त करता है; यह हिंदी में स्वाभाविक रूप से गति और दिशा दोनों बताता है।
- source_word: הַפָּרוֹת
  choice: गायें
  rationale: संदर्भ में दूध देनेवाली गायें हैं; इसलिए सामान्य और सटीक हिंदी शब्द 'गायें' चुना गया।
- source_word: בַּדֶּרֶךְ עַל דֶּרֶךְ בֵּית שֶׁמֶשׁ
  choice: बेत-शेमेश की ओर जानेवाले मार्ग पर
  rationale: דרך की पुनरावृत्ति निश्चित मार्ग पर चलने पर बल देती है; हिंदी में इसे बिना अस्वाभाविक दोहराव के व्यक्त किया गया है।
- source_word: בִּמְסִלָּה אַחַת
  choice: एक ही सड़क पर
  rationale: מסלה मार्ग या राजमार्ग को सूचित करता है और אחת एक निश्चित, एकमात्र रास्ते पर बने रहने का बल रखता है। 'सड़क' आधुनिक हिंदी में स्पष्ट है और आधुनिक द्रुतगामी राजमार्ग का अनचाहा बोध नहीं कराता।
- source_word: הָלְכוּ הָלוֹךְ
  choice: लगातार चलती रहीं
  rationale: सीमित क्रिया के साथ infinitive absolute निरंतर गति का भाव देता है, जिसे 'लगातार चलती रहीं' स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְגָעוֹ
  choice: रँभाती हुई
  rationale: यह क्रिया मवेशियों की आवाज़ के लिए प्रयुक्त है; 'रँभाना' सामान्य, सटीक और गरिमापूर्ण हिंदी है।
- source_word: וְלֹא סָרוּ יָמִין וּשְׂמֹאול
  choice: न दाहिनी ओर मुड़ीं, न बाईं ओर
  rationale: यह मार्ग से तनिक भी न हटने का इब्रानी मुहावरा है; हिंदी रूप दोनों दिशाओं को बनाए रखते हुए सहज है।
- source_word: וְסַרְנֵי פְלִשְׁתִּים
  choice: पलिश्तियों के सरदार
  rationale: סרנים पलिश्ती नगर-शासकों की विशिष्ट उपाधि है। 'सरदार' उनके राजनीतिक नेतृत्व और पद को सामान्य हिंदी में स्पष्ट करता है।
- source_word: הֹלְכִים אַחֲרֵיהֶם
  choice: उनके पीछे-पीछे ... चलते गए
  rationale: कृदंत जारी सहगामी क्रिया को दर्शाता है; यह हिंदी प्रयोग निरंतर पीछे चलने का भाव बनाए रखता है।
- source_word: עַד גְּבוּל בֵּית שָׁמֶשׁ
  choice: बेत-शेमेश की सीमा तक
  rationale: גבול यहाँ नगर के भूभाग की सीमा को सूचित करता है; 'सीमा तक' संक्षिप्त और भौगोलिक रूप से स्पष्ट है।
