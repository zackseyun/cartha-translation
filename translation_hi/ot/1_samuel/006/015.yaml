source:
  edition: WLC
  text: וְ/הַ/לְוִיִּ֞ם הוֹרִ֣ידוּ אֶת אֲר֣וֹן יְהוָ֗ה וְ/אֶת הָ/אַרְגַּ֤ז אֲשֶׁר אִתּ/וֹ֙ אֲשֶׁר בּ֣/וֹ כְלֵֽי זָהָ֔ב וַ/יָּשִׂ֖מוּ אֶל הָ/אֶ֣בֶן הַ/גְּדוֹלָ֑ה וְ/אַנְשֵׁ֣י בֵֽית שֶׁ֗מֶשׁ הֶעֱל֨וּ עֹל֜וֹת וַֽ/יִּזְבְּח֧וּ זְבָחִ֛ים בַּ/יּ֥וֹם הַ/ה֖וּא לַֽ/יהוָֽה׀־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/015.yaml
  text: And the Levites took down the ark of Yahweh[a], and the box that was with it, in which were the gold objects, and set them on the great stone[c][b]. And the men of Beth-shemesh offered burnt offerings and sacrificed sacrifices on that day to Yahweh.
translation:
  language: hi
  text: और लेवियों ने यहवे का संदूक और उसके साथ की वह पेटी, जिसमें सोने की वस्तुएँ थीं,[a] उतारकर उस बड़े पत्थर पर रख दिए। और बेत-शेमेश के पुरुषों ने उस दिन यहवे के लिए होमबलियाँ चढ़ाईं और बलिदान चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वस्तुएँ’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ पात्र, उपकरण या अन्य सामान भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַלְוִיִּם
  choice: लेवियों
  rationale: यह शब्द लेवी के गोत्र के सदस्यों को दर्शाता है; हिन्दी में ‘लेवी’ का बहुवचन संबंध/कर्ता रूप ‘लेवियों’ स्वाभाविक और प्रचलित है।
- source_word: הוֹרִידוּ
  choice: गाड़ी से उतारकर
  rationale: हिफ़ील रूप नीचे उतारने की क्रिया बताता है। निकटवर्ती प्रसंग में वस्तुएँ गाड़ी पर थीं; ‘गाड़ी से’ अर्थ को स्पष्ट करता है, यद्यपि इस पद में गाड़ी दोहराई नहीं गई।
- source_word: אֲרוֹן יְהוָה
  choice: यहवे का सन्दूक
  rationale: אֲרוֹן यहाँ पवित्र वाचा-सन्दूक है। יְהוָה को उपाधि से बदलने के बजाय उसके व्यक्तिवाचक नाम ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: הָאַרְגַּז
  choice: पेटी
  rationale: यह सन्दूक से अलग, उसके साथ रखा पात्र है; आधुनिक हिन्दी में ‘पेटी’ स्पष्ट और स्वाभाविक है।
- source_word: אֲשֶׁר אִתּוֹ
  choice: उसके साथ की
  rationale: सरल इब्रानी संबंध को संक्षिप्त और सहज हिन्दी में सुरक्षित रखता है।
- source_word: אֲשֶׁר בּוֹ כְלֵי זָהָב
  choice: जिसमें सोने की वस्तुएँ थीं
  rationale: כְלֵי व्यापक शब्द है और वस्तु, पात्र या उपकरण का अर्थ दे सकता है; ‘वस्तुएँ’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: וַיָּשִׂמוּ אֶל הָאֶבֶן הַגְּדוֹלָה
  choice: उस बड़े पत्थर पर रख दिए
  rationale: אֶל मूलतः ‘की ओर/पर’ हो सकता है; प्रसंग में बड़े पत्थर पर रखने का अर्थ सर्वाधिक स्वाभाविक है। ‘उन्हें’ के बजाय लिंग-संगति के लिए ‘सन्दूक और पेटी ... रख दिए’ संरचना अपनाई गई है।
- source_word: וְאַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: तब बेत-शेमेश के पुरुषों ने
  rationale: אַנְשֵׁי का पुरुषवाचक अर्थ बनाए रखा गया है; ‘तब’ हिन्दी कथा-प्रवाह में अगले कार्य को स्वाभाविक रूप से जोड़ता है।
- source_word: הֶעֱלוּ עֹלוֹת
  choice: होमबलियाँ चढ़ाईं
  rationale: यह पूर्णतः जलाए जाने वाले बलिदान का स्थापित बाइबिलीय पद है और मूल की बलिदानी क्रिया को स्पष्ट रखता है।
- source_word: וַיִּזְבְּחוּ זְבָחִים
  choice: और बलिदान चढ़ाए
  rationale: इब्रानी में सजातीय क्रिया-संज्ञा पुनरुक्ति है; हिन्दी में ‘बलिदानों का बलिदान किया’ अस्वाभाविक होता, इसलिए अर्थ को सहज रूप में व्यक्त किया गया है।
- source_word: בַּיּוֹם הַהוּא לַיהוָה
  choice: उस दिन यहवे के लिए
  rationale: काल और बलिदान के प्राप्तकर्ता/समर्पण, दोनों को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में चार-अक्षरीय व्यक्तिगत नाम है। ‘यहवे’ उसका व्यापक विद्वत् पुनर्निर्मित उच्चारण है और नाम को उपाधि में बदलने से बचाता है।
- issue: אַנְשֵׁי का लिंग-संबंधी निरूपण
  choice: बेत-शेमेश के पुरुष
  alternative: बेत-शेमेश के लोग
  rationale: मूल का रूप स्पष्टतः पुल्लिंग है और पाठ इसे सामान्यीकृत करने को बाध्य नहीं करता; इसलिए लिंग-सटीक अनुवाद रखा गया है।
- issue: बलिदानी पदों הֶעֱלוּ עֹלוֹת और וַיִּזְבְּחוּ זְבָחִים का भेद
  choice: होमबलियाँ चढ़ाईं और बलिदान चढ़ाए
  alternative: होमबलियाँ और अन्य बलिदान चढ़ाए
  rationale: दोनों इब्रानी पदों का भेद बनाए रखा गया है, पर ‘अन्य’ जोड़कर ऐसी श्रेणीगत व्याख्या नहीं की गई जो मूल में प्रत्यक्ष नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘सन्दूक’, ‘होमबलि’ और ‘बलिदान’ जैसे स्थापित बाइबिलीय शब्द संदर्भगत सटीकता के लिए बनाए रखे गए हैं। मुख्य पाठ में एकमात्र पादटिप्पणी-चिह्न [a] उसके संबद्ध वाक्यांश के बाद दिया गया है।
