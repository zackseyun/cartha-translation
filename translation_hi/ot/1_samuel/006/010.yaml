  text: וַ/יַּעֲשׂ֤וּ הָ/אֲנָשִׁים֙ כֵּ֔ן וַ/יִּקְח֗וּ שְׁתֵּ֤י פָרוֹת֙ עָל֔וֹת וַ/יַּאַסְר֖וּ/ם בָּ/עֲגָלָ֑ה וְ/אֶת בְּנֵי/הֶ֖ם כָּל֥וּ בַ/בָּֽיִת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/010.yaml
  text: 'So the men did so: they took two milk cows and harnessed them to the cart[b][a], and shut up their calves in the house.'
translation:
  language: hi
  text: तब उन पुरुषों ने वैसा ही किया। उन्होंने दूध पिलानेवाली दो गायें लीं और उन्हें गाड़ी में जोत दिया; फिर उनके बछड़ों को घर में बंद कर दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעֲשׂוּ ... כֵּן
  choice: वैसा ही किया
  rationale: यह स्वाभाविक हिन्दी में पहले दिए गए निर्देश के अनुसार काम करने का संक्षिप्त भाव व्यक्त करता है।
- source_word: הָאֲנָשִׁים
  choice: उन पुरुषों
  rationale: संज्ञा यहाँ कथा में काम करने वाले पुरुषों को निर्दिष्ट करती है; 'उन' से प्रसंगगत समूह स्पष्ट होता है।
- source_word: שְׁתֵּי פָרוֹת עָלוֹת
  choice: दूध पिलानेवाली दो गायें
  rationale: עָלוֹת ऐसी गायों का वर्णन करता है जो दूध दे रही थीं और जिनके आश्रित बछड़े थे; यह अर्थ आगे की परीक्षा के लिए महत्वपूर्ण है।
- source_word: וַיַּאַסְרוּם בָּעֲגָלָה
  choice: उन्हें गाड़ी में जोत दिया
  rationale: אסר का मूल भाव बाँधना है, पर गाड़ी के साथ पशुओं के संदर्भ में 'जोत दिया' स्वाभाविक और कार्यगत रूप से सटीक हिन्दी है।
- source_word: וְאֶת בְּנֵיהֶם
  choice: उनके बछड़ों को
  rationale: शाब्दिक अर्थ 'उनके पुत्र/बच्चे' है, किंतु गायों के बच्चों के लिए हिन्दी में 'बछड़े' सही और स्वाभाविक है।
- source_word: כָּלוּ בַבָּיִת
  choice: घर में बंद कर दिया
  rationale: क्रिया रोककर रखने या बंद करने का भाव देती है, और בַּבָּיִת का सीधा अर्थ 'घर में' है; संभावित पशुशाला को मुख्य पाठ में अनुमान से नहीं जोड़ा गया।
