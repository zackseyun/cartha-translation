source:
  edition: WLC
  text: וַֽ/יִּשְׁלְחוּ֙ מַלְאָכִ֔ים אֶל יוֹשְׁבֵ֥י קִרְיַת יְעָרִ֖ים לֵ/אמֹ֑ר הֵשִׁ֤בוּ פְלִשְׁתִּים֙ אֶת אֲר֣וֹן יְהוָ֔ה רְד֕וּ הַעֲל֥וּ אֹת֖/וֹ אֲלֵי/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/021.yaml
  text: So they sent messengers to the inhabitants of Kiriath-jearim[a], saying, “The Philistines have returned the ark of Yahweh. Come down; bring it up to yourselves.”
translation:
  language: hi
  text: तब उन्होंने किर्यत-यारीम के निवासियों के पास दूत भेजकर कहा, “पलिश्तियों ने याहवे का संदूक लौटा दिया है। नीचे उतर आओ और उसे ऊपर अपने पास ले जाओ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नीचे उतर जाओ और उसे ऊपर अपने पास ले जाओ।” इब्रानी में भू-आकृतिक क्रियाएँ “नीचे उतरना” और “ऊपर ले जाना” प्रयुक्त हुई हैं; सम्भवतः ये बेत-शेमेश और किर्यत-यारीम के बीच के भूभाग को दर्शाती हैं।
    reason: רְדוּ का अर्थ संदर्भ में ‘नीचे उतर आओ’ या ‘नीचे उतर जाओ’ हो सकता है; टिप्पणी मूल की दिशात्मक और भू-आकृतिक भाषा को सुरक्षित रखती है।
lexical_decisions:
- source_word: וַיִּשְׁלְחוּ
  choice: तब उन्होंने ... भेजे
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ स्वाभाविक हिन्दी में घटनाक्रम का क्रम स्पष्ट करता है।
- source_word: מַלְאָכִים
  choice: दूत
  rationale: यहाँ मनुष्यों द्वारा संदेश पहुँचाने का प्रसंग है; ‘दूत’ उपयुक्त है, जबकि ‘स्वर्गदूत’ भ्रामक होगा।
- source_word: יוֹשְׁבֵי קִרְיַת יְעָרִים
  choice: किर्यत-यारीम के निवासी
  rationale: सहभागी रूप का अर्थ वहाँ रहने वाले लोग है; स्थान-नाम का लिप्यंतरण रखा गया है।
- source_word: הֵשִׁבוּ פְלִשְׁתִּים
  choice: पलिश्तियों ने ... लौटा दिया है
  rationale: שׁוב का हिफ़ील यहाँ किसी वस्तु को वापस करने का अर्थ देता है; पूर्ण क्रिया के वर्तमान परिणाम को हिन्दी पूर्णकाल स्वाभाविक रूप से व्यक्त करता है।
- source_word: אֲרוֹן יְהוָה
  choice: यहोवा का संदूक
  rationale: निर्मित संबंध को सीधे रखा गया है; אֲרוֹן के लिए परिचित बाइबिलीय शब्द ‘संदूक’ और יהוה के लिए व्यक्तिवाचक नाम ‘यहोवा’ लिया गया है।
- source_word: רְדוּ
  choice: नीचे आओ
  rationale: ירד का बहुवचन आज्ञार्थक रूप और भू-आकृतिक दिशा दोनों सुरक्षित रहते हैं; वक्ताओं की ओर बुलावे के अनुसार ‘आओ’ स्वाभाविक है।
- source_word: הַעֲלוּ אֹתוֹ אֲלֵיכֶם
  choice: उसे अपने यहाँ ऊपर ले जाओ
  rationale: עלה का हिफ़ील ‘ऊपर ले जाना’ है; ‘अपने यहाँ’ אֲלֵיכֶם के गंतव्य और संदूक को अपने पास ग्रहण करने की भावना को सहज हिन्दी में रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में चतुरक्षरीय व्यक्तिवाचक नाम है, इसलिए उसे सामान्य उपाधि ‘प्रभु’ से नहीं बदला गया। आधुनिक हिन्दी बाइबिलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है; ‘याहवे’ मूल उच्चारण का एक प्रचलित विद्वत्तापूर्ण पुनर्निर्माण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दूत’, ‘निवासी’ और ‘संदूक’ सामान्य पाठकों के लिए परिचित हैं। स्थलाकृतिक ‘नीचे/ऊपर’ को समतल नहीं किया गया, और רְדוּ की दृष्टिकोणगत अस्पष्टता पादटिप्पणी में दी गई है।
