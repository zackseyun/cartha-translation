  text: וַ/עֲשִׂיתֶם֩ צַלְמֵ֨י עפלי/כם וְ/צַלְמֵ֣י עַכְבְּרֵי/כֶ֗ם הַ/מַּשְׁחִיתִם֙ אֶת הָ/אָ֔רֶץ וּ/נְתַתֶּ֛ם לֵ/אלֹהֵ֥י יִשְׂרָאֵ֖ל כָּב֑וֹד אוּלַ֗י יָקֵ֤ל אֶת יָד/וֹ֙ מֵֽ/עֲלֵי/כֶ֔ם וּ/מֵ/עַ֥ל אֱלֹהֵי/כֶ֖ם וּ/מֵ/עַ֥ל אַרְצְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/005.yaml
  text: So make images of your tumors and images of your mice that are ravaging the land[a], and give glory to the God of Israel. Perhaps he will lighten his hand from upon you, and from upon your gods, and from upon your land.
translation:
  language: hi
  text: इसलिए अपनी गाँठों[a] के प्रतिरूप और देश को उजाड़ रहे अपने चूहों के प्रतिरूप बनाओ, और इस्राएल के परमेश्वर की महिमा करो। शायद वह तुम पर से, तुम्हारे देवताओं पर से और तुम्हारे देश पर से अपना हाथ हल्का कर दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘तुम्हारी बवासीर।’ इब्रानी शब्द शरीर की सूजन या गाँठों को दर्शाता है; ‘बवासीर’ वाला पारंपरिक, अधिक विशिष्ट अर्थ संभव है, पर निश्चित नहीं।
    reason: मूल शब्द के व्यापक अर्थ और पारंपरिक विशिष्ट अर्थ—दोनों को सुरक्षित रखना।
lexical_decisions:
- source_word: וַעֲשִׂיתֶם
  choice: इसलिए ... बनाओ
  rationale: यह क्रम में दिया गया निर्देश है; संदर्भ में परिणामसूचक भाव को ‘इसलिए’ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: צַלְמֵי
  choice: प्रतिरूप
  rationale: यह शब्द यहाँ रोग और चूहों की बनाई हुई आकृतियों या नमूनों को दर्शाता है; ‘प्रतिरूप’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: עפלי/כם
  choice: अपनी गाँठों
  rationale: इब्रानी शब्द शरीर की सूजन या गाँठों का संकेत देता है, पर उनका ठीक चिकित्सीय स्वरूप निश्चित नहीं करता। ‘गाँठों’ इस अस्पष्टता को बनाए रखता है।
- source_word: עַכְבְּרֵי/כֶם
  choice: अपने चूहों
  rationale: עכבר सामान्यतः चूहे को दर्शाता है; हिन्दी में ‘चूहों’ सहज और पारंपरिक अर्थ के अनुरूप है।
- source_word: הַמַּשְׁחִיתִם אֶת הָאָרֶץ
  choice: देश को उजाड़ रहे
  rationale: बहुवचन कृदंत चूहों की जारी विनाशकारी गतिविधि बताता है; ‘उजाड़ रहे’ उस निरंतरता और तीव्रता को व्यक्त करता है।
- source_word: וּנְתַתֶּם ... כָּבוֹד
  choice: महिमा करो
  rationale: शाब्दिक भाव ‘महिमा देना’ है। हिन्दी में ‘परमेश्वर की महिमा करो’ स्वाभाविक बाइबलीय अभिव्यक्ति है और उसके सामर्थ्य को स्वीकार करने का भाव रखती है।
- source_word: אוּלַי
  choice: शायद
  rationale: यह आशा या संभावना व्यक्त करता है, निश्चित परिणाम नहीं।
- source_word: יָקֵל אֶת יָדוֹ
  choice: अपना हाथ हल्का कर दे
  rationale: मूल पाठ के ‘हाथ’ रूपक और ‘हल्का करने’ की क्रिया दोनों को बनाए रखा गया है; यह दैवी दबाव या प्रहार के कम होने का बोध कराता है।
- source_word: מֵעֲלֵיכֶם וּמֵעַל אֱלֹהֵיכֶם וּמֵעַל אַרְצְכֶם
  choice: तुम पर से, तुम्हारे देवताओं पर से और तुम्हारे देश पर से
  rationale: तीनों पदों में दोहराई गई इब्रानी संरचना को हिन्दी में भी रखा गया है, जिससे हाथ के उन सब पर होने का चित्र स्पष्ट रहता है।
theological_decisions:
- issue: עפלים से सूचित रोग का स्वरूप
  choice: गाँठों
  alternative: बवासीर के मस्सों; सूजनों
  rationale: मूल इब्रानी किसी शारीरिक सूजन या गाँठ का संकेत देता है, पर ‘बवासीर’ जैसी विशिष्ट पहचान अनिवार्य नहीं करता। मुख्य पाठ में व्यापक अर्थ रखा गया और पारंपरिक विशिष्ट अर्थ पादटिप्पणी में दिया गया।
- issue: परमेश्वर के ‘हाथ’ का मानवाकार रूपक
  choice: अपना हाथ हल्का कर दे
  alternative: अपना दंड कम कर दे; अपनी शक्ति हटा ले
  rationale: मूल रूपक स्पष्ट और अर्थपूर्ण है। इसे बनाए रखने से परमेश्वर की सक्रिय सामर्थ्य और प्रहार का चित्र सुरक्षित रहता है, बिना उसे केवल ‘दंड’ कहकर सीमित किए।
- issue: पलिश्तियों के देवताओं पर परमेश्वर का हाथ
  choice: तुम्हारे देवताओं पर से
  alternative: तुम्हारे देव-मंदिरों पर से
  rationale: मूल पाठ स्पष्टतः ‘तुम्हारे देवताओं’ कहता है। इसे वैसा ही रखा गया है ताकि इस्राएल के परमेश्वर और पलिश्ती देवताओं के बीच निहित धार्मिक तनाव को अनुवाद में न मिटाया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सामान्य पाठक के लिए स्पष्ट और गरिमापूर्ण रखी गई है। ‘प्रतिरूप,’ ‘महिमा’ और ‘हाथ हल्का करना’ मूल पाठ की ठोस छवियों को सुरक्षित रखते हैं; वाक्य-विन्यास हिन्दी की स्वाभाविकता के अनुसार व्यवस्थित है।
