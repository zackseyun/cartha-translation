source:
  edition: WLC
  text: וַ/יֹּֽאמְרוּ֙ אַנְשֵׁ֣י בֵֽית שֶׁ֔מֶשׁ מִ֚י יוּכַ֣ל לַ/עֲמֹ֔ד לִ/פְנֵ֨י יְהוָ֧ה הָ/אֱלֹהִ֛ים הַ/קָּד֖וֹשׁ הַ/זֶּ֑ה וְ/אֶל מִ֖י יַעֲלֶ֥ה מֵ/עָלֵֽי/נוּ־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/020.yaml
  text: Then the men of Beth-shemesh said[a], “Who is able to stand before Yahweh, this holy God? And to whom shall he go up from us?”
translation:
  language: hi
  text: तब बेत-शेमेश के पुरुषों ने कहा, “कौन याहवे, इस पवित्र परमेश्वर, के सामने खड़ा रह सकता है? और वह[a] हमारे पास से किसके पास ऊपर जाए?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “वह” सम्भवतः याहवे के सन्दूक की ओर संकेत करता है।
    reason: मूल इब्रानी में क्रिया का कर्ता व्यक्त नहीं है; सन्दर्भ से सन्दूक सबसे सम्भावित कर्ता है।
lexical_decisions:
- source_word: וַיֹּאמְרוּ
  choice: तब ... ने कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में स्वाभाविक कथात्मक क्रम व्यक्त करता है।
- source_word: אַנְשֵׁי בֵית שֶׁמֶשׁ
  choice: बेत-शेमेश के पुरुषों
  rationale: אַנְשֵׁי का शाब्दिक अर्थ ‘पुरुष’ है; नगर के पुरुष प्रतिनिधियों का संकेत बनाए रखा गया है।
- source_word: מִי יוּכַל לַעֲמֹד לִפְנֵי
  choice: कौन ... के सामने खड़ा रह सकता है
  rationale: यह प्रश्न सामर्थ्य और पवित्र उपस्थिति के सामने टिके रहने—दोनों भावों को व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: הָאֱלֹהִים הַקָּדוֹשׁ הַזֶּה
  choice: इस पवित्र परमेश्वर
  rationale: विशेषण और संकेतवाचक का बल रखते हुए वाक्यांश को स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: וְאֶל מִי יַעֲלֶה
  choice: और वह ... किसके पास ऊपर जाए
  rationale: क्रिया का कर्ता मूल में व्यक्त नहीं है। हिन्दी का ‘वह’ व्यक्ति या वस्तु दोनों का संकेत कर सकता है और इस अस्पष्टता को बनाए रखता है; ‘ऊपर जाए’ עלה की दिशात्मक छवि भी सुरक्षित रखता है।
- source_word: מֵעָלֵינוּ
  choice: हमारे यहाँ से
  rationale: यह उनके स्थान या निकटता से दूर जाने का भाव स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; ‘याहवे’ उसका प्रत्यक्ष लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: दूसरे प्रश्न में יַעֲלֶה का अव्यक्त कर्ता
  choice: वह
  alternative: सन्दूक
  rationale: सन्दर्भ में कर्ता सम्भवतः याहवे का सन्दूक है, पर इब्रानी पाठ उसे स्पष्ट नहीं करता। हिन्दी ‘वह’ मूल की अस्पष्टता बनाए रखता है, जबकि पादटिप्पणी सम्भावित संकेत बताती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘खड़ा रह सकता है’ भय और असमर्थता का गंभीर भाव देता है; ‘ऊपर जाए’ मूल दिशात्मक क्रिया को सुरक्षित रखता है।
