  text: וְ/אֵ֨לֶּה֙ טְחֹרֵ֣י הַ/זָּהָ֔ב אֲשֶׁ֨ר הֵשִׁ֧יבוּ פְלִשְׁתִּ֛ים אָשָׁ֖ם לַֽ/יהוָ֑ה לְ/אַשְׁדּ֨וֹד אֶחָ֜ד לְ/עַזָּ֤ה אֶחָד֙ לְ/אַשְׁקְל֣וֹן אֶחָ֔ד לְ/גַ֥ת אֶחָ֖ד לְ/עֶקְר֥וֹן אֶחָֽד׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/006/017.yaml
  text: 'And these are the golden tumors that the Philistines returned as a guilt offering to Yahweh: one for Ashdod[a], one for Gaza, one for Ashkelon, one for Gath, one for Ekron.'
translation:
  language: hi
  text: 'और ये सोने की गाँठें[a] हैं, जिन्हें फ़िलिस्तियों ने यहोवा को दोष-बलि के रूप में लौटाया था: अशदोद के लिए एक, गाज़ा के लिए एक, अश्कलोन के लिए एक, गत के लिए एक और एक्रोन के लिए एक।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “गाँठें” का अनुवाद “सूजनें” भी हो सकता है; इब्रानी शब्द उस शारीरिक व्याधि की ओर संकेत करता है जिसकी आकृति में ये सोने की भेंटें बनाई गई थीं। परम्परागत रूप से इसे अधिक विशेष अर्थ में “बवासीर” भी अनूदित किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵלֶּה
  choice: और ये ... हैं
  rationale: संयोजक और संकेतवाचक पद पिछले प्रसंग से जोड़ते हुए सूची का परिचय देते हैं; यह रूप उस संबंध को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: טְחֹרֵי הַזָּהָב
  choice: सोने की गाँठें
  rationale: टְחֹרִים शारीरिक सूजन अथवा गाँठों के रूप में प्रकट व्याधि को दर्शाता है, जिसकी सोने की प्रतिमाएँ चढ़ाई गई थीं। 'गाँठें' आधुनिक पाठक के लिए सहज है और बवासीर जैसा अधिक विशिष्ट चिकित्सकीय अर्थ अनावश्यक रूप से निश्चित नहीं करता।
- source_word: אֲשֶׁר הֵשִׁיבוּ
  choice: जिन्हें ... लौटाया था
  rationale: שׁוב का हिफ़ील रूप यहाँ वापस करने या लौटा देने का भाव रखता है; सन्दूक को लौटाने और क्षतिपूर्ति के प्रसंग में 'लौटाया' उपयुक्त है।
- source_word: פְלִשְׁתִּים
  choice: फ़िलिस्तियों
  rationale: इस प्राचीन जनसमूह के लिए प्रचलित हिन्दी नाम।
- source_word: אָשָׁם
  choice: दोष-बलि
  rationale: यह पद दोष के कारण दी जाने वाली प्रायश्चित्तात्मक अथवा क्षतिपूर्ति-संबंधी भेंट को दर्शाता है; 'दोष-बलि' संक्षिप्त, प्रतिष्ठित और प्रसंगानुकूल है।
- source_word: לַיהוָה
  choice: यहोवा को
  rationale: मूल पाठ में परमेश्वर का विशिष्ट वाचा-नाम יהוה है; लिप्यंतरण-सदृश प्रचलित हिन्दी रूप 'यहोवा' उस नाम को सामान्य उपाधि में बदलने से बचाता है।
- source_word: לְאַשְׁדּוֹד אֶחָד ... לְעֶקְרוֹן אֶחָד
  choice: अशदोद के लिए एक ... एक्रोन के लिए एक
  rationale: हर नगर के साथ लगी ל और אֶחָד से प्रत्येक नगर के अनुरूप एक वस्तु का संकेत मिलता है; हिन्दी में 'के लिए एक' की पुनरावृत्ति इसे स्पष्ट रखती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: यहाँ सामान्य उपाधि नहीं, चार अक्षरों वाला विशिष्ट ईश्वरीय नाम है। 'यहोवा' हिन्दी बाइबलीय परम्परा में व्यापक रूप से पहचाना जाता है और नाम की विशिष्टता सुरक्षित रखता है; 'याहवे' मूल उच्चारण का अधिक संभावित पुनर्निर्माण है, इसलिए उसे वैकल्पिक रूप माना जा सकता है।
- issue: אָשָׁם का बलिदानी अर्थ
  choice: दोष-बलि
  alternative: क्षतिपूर्ति-बलि
  rationale: पद में दोष और उसकी भरपाई दोनों के आयाम हो सकते हैं। 'दोष-बलि' परिचित धार्मिक पद है, जबकि इस प्रसंग का क्षतिपूर्ति-पक्ष संदर्भ से स्पष्ट होता है; किसी एक आयाम को पूर्णतः हटाया नहीं गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किन्तु सरल वाक्य-विन्यास। नगरों के स्थापित बाइबलीय हिन्दी रूप रखे गए हैं। सूची की लय बनाए रखने के लिए अंतिम पद से पहले 'और' जोड़ा गया है।
