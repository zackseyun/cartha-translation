lexical_decisions:
- source_word: וַיֹּאמֶר דָּוִד אֶל שָׁאוּל
  choice: तब दाऊद ने शाऊल से कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी आख्यान में ‘तब’ स्वाभाविक है। नामों के लिए प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं।
- source_word: אַל יִפֹּל לֵב אָדָם
  choice: किसी का हृदय न गिरे
  rationale: यह हिन्दी में समझ आने योग्य रहते हुए इब्रानी के ‘हृदय गिरने’ वाले चित्र को सुरक्षित रखता है। अधिक मुहावरेदार अर्थ ‘कोई हिम्मत न हारे’ पादटिप्पणी में दिया गया है।
- source_word: עָלָיו
  choice: उसके कारण
  rationale: सर्वनाम का संदर्भ प्रसंग से उस पलिश्ती की ओर है; मुख्य पाठ इब्रानी की सर्वनामात्मक अस्पष्टता को बनाए रखता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा से विनम्र आत्म-संदर्भ के प्रसंग में ‘सेवक’ स्वाभाविक और यथार्थ है।
- source_word: יֵלֵךְ וְנִלְחַם
  choice: जाकर ... लड़ेगा
  rationale: अपूर्ण क्रियाएँ यहाँ दाऊद के दृढ़ निश्चय को व्यक्त करती हैं; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: עִם הַפְּלִשְׁתִּי הַזֶּה
  choice: इस पलिश्ती से
  rationale: युद्ध के प्रसंग में עִם का ‘से’ स्वाभाविक हिन्दी प्रतिरूप है और प्रतिद्वंद्वी से भिड़ने का अर्थ स्पष्ट करता है।
