source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר֙ הַ/פְּלִשְׁתִּ֔י אֲנִ֗י חֵרַ֛פְתִּי אֶת מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל הַ/יּ֣וֹם הַ/זֶּ֑ה תְּנוּ לִ֣/י אִ֔ישׁ וְ/נִֽלָּחֲמָ֖ה יָֽחַד־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/010.yaml
  text: Then the Philistine said[a], “I have defied the ranks of Israel this day. Give me a man[c][b], and let us fight together.”
translation:
  language: hi
  text: तब उस पलिश्ती ने कहा, “आज मैंने इस्राएल की युद्ध-पंक्तियों को ललकारा है। मुझे एक आदमी दो, और हम दोनों आमने-सामने लड़ें।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: संज्ञा पर निश्चित उपपद गोलियत को उसकी जातीय पहचान से निर्दिष्ट करता है; यहाँ मूल शब्द में ‘योद्धा’ या ‘वीर’ नहीं है।
- source_word: חֵרַפְתִּי
  choice: मैंने ... ललकारा है
  rationale: इस सैनिक चुनौती के संदर्भ में क्रिया तिरस्कारपूर्ण चुनौती और अपमान का भाव रखती है; ‘ललकारा’ आधुनिक हिन्दी में प्रसंगानुकूल और स्वाभाविक है।
- source_word: מַעַרְכוֹת
  choice: युद्ध-पंक्तियों
  rationale: बहुवचन शब्द सजी हुई सैन्य पंक्तियों या मोर्चों को दर्शाता है; ‘सेनाओं’ की तुलना में ‘युद्ध-पंक्तियाँ’ मूल बिंब को अधिक स्पष्ट रखता है।
- source_word: הַיּוֹם הַזֶּה
  choice: आज
  rationale: हिन्दी में ‘आज’ मूल पदबंध ‘इस दिन’ के कालगत और बलयुक्त अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תְּנוּ לִי אִישׁ
  choice: मुझे एक आदमी दो
  rationale: मूल आज्ञा का सीधा और चुनौतीपूर्ण स्वर सुरक्षित रहता है; प्रसंग में आशय प्रतिनिधि लड़ाके को सामने करने का है।
- source_word: וְנִלָּחֲמָה
  choice: और ... लड़ें
  rationale: कोहोर्टेटिव रूप इच्छा अथवा चुनौतीपूर्ण प्रस्ताव व्यक्त करता है; हिन्दी का संभावनार्थक ‘लड़ें’ इस बल को दर्शाता है।
- source_word: יָחַד
  choice: हम दोनों आमने-सामने
  rationale: मूलतः ‘साथ/एक साथ’ का अर्थ है, पर प्रसंग में परस्पर एकल युद्ध अभिप्रेत है; हिन्दी में ‘हम दोनों आमने-सामने’ संभावित गलत अर्थ से बचाते हुए संबंध को स्पष्ट करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधी, गरिमापूर्ण और सैनिक चुनौती के अनुरूप भाषा। मूल पाठ की पुनरुक्त वक्ता-सूचना बनाए रखने के लिए ‘तब उस पलिश्ती ने कहा’ रखा गया है।
