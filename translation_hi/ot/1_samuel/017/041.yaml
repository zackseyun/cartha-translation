- source_word: וַיֵּלֶךְ הֹלֵךְ וְקָרֵב
  choice: आगे बढ़ा और…निकट आता गया
  rationale: समापिका क्रिया के बाद आए दो कृदंत पलिश्ती की लगातार आगे बढ़ती गति को चित्रित करते हैं। यह हिंदी अभिव्यक्ति उस प्रगतिशील गति को स्वाभाविक रूप से बनाए रखती है।
- source_word: הַפְּלִשְׁתִּי
  choice: पलिश्ती
  rationale: मूल में निश्चित एकवचन जातिवाचक पद है। इस पद में ‘वीर’ या ‘योद्धा’ जोड़ना मूल से अधिक कहना होगा।
- source_word: אֶל דָּוִד
  choice: दाऊद के निकट
  rationale: אֶל दिशा को सूचित करता है; קָרֵב के साथ यह दाऊद की ओर बढ़ते हुए उसके निकट आने का भाव देता है।
- source_word: וְהָאִישׁ נֹשֵׂא הַצִּנָּה
  choice: और बड़ी ढाल उठानेवाला आदमी
  rationale: נֹשֵׂא का अर्थ उठाए या लिए चलना है। צִנָּה प्रायः बड़ी ढाल को दर्शाता है; ‘आदमी’ मूल के הָאִישׁ को बनाए रखता है और अनावश्यक रूप से कोई पदवी नहीं जोड़ता।
- source_word: לְפָנָיו
  choice: उसके आगे
  rationale: यह पलिश्ती के सामने या आगे उस आदमी की स्थिति बताता है।
