base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/047.yaml
  text: and all this assembly will know that Yahweh does not save by sword or by spear[a]; for the battle belongs to Yahweh[c][b], and he will give you into our hand.
translation:
  language: hi
  text: और यह सारी सभा जान लेगी कि याहवे तलवार या भाले से नहीं बचाता[a], क्योंकि युद्ध याहवे का है, और वह तुम्हें हमारे हाथ में दे देगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तलवार और भाले के द्वारा नहीं छुड़ाता।”
    reason: lexical_alternative
  - marker: c
    text: “हमारे हाथ में” का अर्थ है “हमारे अधिकार में” या “हमें सौंप देगा।”
    reason: idiom_explanation
lexical_decisions:
- source_word: וְיֵדְעוּ
  choice: और ... जान लेगी
  rationale: यहाँ क़ाल अपूर्ण रूप दाऊद की घोषणा के भावी परिणाम को व्यक्त करता है। ‘जान लेगी’ स्वाभाविक हिन्दी में उस परिणामी बोध को स्पष्ट करता है।
- source_word: כָּל הַקָּהָל הַזֶּה
  choice: यह सारी सभा
  rationale: קהל यहाँ उपस्थित एकत्र जनसमूह है। ‘सभा’ युद्धस्थल के संदर्भ में स्वाभाविक और धार्मिक संस्था के अर्थ से अपेक्षाकृत मुक्त है।
- source_word: לֹא בְּחֶרֶב וּבַחֲנִית יְהוֹשִׁיעַ יְהוָה
  choice: यहोवा तलवार या भाले से नहीं बचाता
  rationale: हिफ़ील ישׁע का अर्थ बचाना या छुड़ाना है; साधनवाचक בְ को ‘से’ द्वारा व्यक्त किया गया है। निषेधयुक्त जोड़ी में ‘या’ स्वाभाविक हिन्दी है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: כִּי לַיהוָה הַמִּלְחָמָה
  choice: क्योंकि युद्ध यहोवा का है
  rationale: दूसरा כִּי कारण बताता है और לַיהוָה अधिकार/सम्बन्ध व्यक्त करता है। यह रूप इब्रानी वाक्यरचना और उसके बल को निकटता से बनाए रखता है।
- source_word: וְנָתַן
  choice: और वह ... कर देगा
  rationale: रूप क़ातल है, पर भावी घोषणा के प्रसंग में निश्चित आगामी कार्य बताता है; अतः हिन्दी भविष्यकाल उपयुक्त है।
- source_word: אֶתְכֶם בְּיָדֵנוּ
  choice: तुम लोगों को हमारे हाथ में
  rationale: बहुवचन कर्म ‘तुम लोगों’ से स्पष्ट किया गया है और ‘हाथ में करना’ अधिकार में सौंपने की इब्रानी उपमा को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है; इसलिए उपाधि ‘प्रभु’ से बदलने के बजाय उसका प्रचलित हिन्दी लिप्यंतरण रखा गया है।
- issue: सैन्य प्रसंग में יְהוֹשִׁיעַ का अर्थ
  choice: बचाता
  alternative: छुड़ाता / विजय दिलाता
  rationale: ‘बचाता’ मूल क्रिया के व्यापक उद्धारार्थ को बनाए रखता है, जबकि सैन्य प्रसंग से यहाँ युद्ध में छुटकारे का आशय स्वतः स्पष्ट होता है।
- issue: לַיהוָה הַמִּלְחָמָה की अधिकार-सूचक रचना
  choice: युद्ध यहोवा का है
  alternative: युद्ध यहोवा के अधीन है
  rationale: चुना गया रूप मूल की संक्षिप्त अधिकार-सूचक अभिव्यक्ति और उसके धर्मवैचारिक तनाव को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक घोषणा के अनुकूल शैली। ‘तुम लोगों’ से बहुवचन स्पष्ट किया गया है। मुख्य पाठ इब्रानी के ‘हाथ’ वाले मुहावरे को रखता है और पादटिप्पणी उसका अर्थ खोलती है।
