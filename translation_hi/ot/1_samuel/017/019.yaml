  register: आधुनिक, सहज और गरिमापूर्ण मानक हिंदी। ‘वे’ को कुछ असामान्य लगने पर भी मूल पाठ में उपस्थित स्वतंत्र सर्वनाम के कारण रखा गया है; संदर्भ में यह यिशै के पुत्रों अथवा पहले उल्लिखित लोगों की ओर संकेत करता है।
