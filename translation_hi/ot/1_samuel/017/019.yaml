base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/019.yaml
  text: Saul and they and all the men of Israel were in the Valley of Elah[a], fighting with the Philistines.
translation:
  language: hi
  text: शाऊल, वे और इस्राएल के सभी पुरुष एला की घाटी में पलिश्तियों से[a] लड़ रहे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “पलिश्तियों के साथ”; यहाँ युद्ध के संदर्भ में इसका अर्थ उनके विरुद्ध लड़ना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/שָׁאוּל וְ/הֵמָּה וְ/כָל אִישׁ יִשְׂרָאֵל
  choice: शाऊल, वे और इस्राएल के सभी पुरुष
  rationale: इब्रानी के स्पष्ट सर्वनाम ‘वे’ और पूरे समूह के बोध को बनाए रखते हुए हिंदी में स्वाभाविक समन्वित पदबंध रखा गया है। आरंभिक वाव को अलग से ‘और’ कहने के बजाय वाक्य-संदर्भ में निहित रहने दिया गया है।
- source_word: בְּ/עֵמֶק הָאֵלָה
  choice: एला की घाटी में
  rationale: עֵמֶק का सामान्य अर्थ ‘घाटी’ है और אֵלָה स्थाननाम को ‘एला’ के रूप में लिप्यंतरित किया गया है।
- source_word: נִלְחָמִים
  choice: लड़ रहे थे
  rationale: कृदंत चल रही या जारी युद्ध-क्रिया व्यक्त करता है; हिंदी का अपूर्ण भूतकाल इसका स्वाभाविक रूप है।
- source_word: עִם פְּלִשְׁתִּים
  choice: पलिश्तियों से
  rationale: עִם का मूल अर्थ ‘के साथ’ है, पर युद्ध-संदर्भ में यह विरोधी पक्ष के साथ मुठभेड़ दर्शाता है। हिंदी में ‘से लड़ना’ शत्रुतापूर्ण अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
