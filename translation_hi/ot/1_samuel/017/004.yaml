  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। प्राचीन माप मुख्य पाठ में सुरक्षित हैं, जबकि उनका आधुनिक अनुमान पादटिप्पणी में दिया गया है।
