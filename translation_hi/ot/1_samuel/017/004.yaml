source:
  edition: WLC
  text: וַ/יֵּצֵ֤א אִֽישׁ הַ/בֵּנַ֨יִם֙ מִ/מַּחֲנ֣וֹת פְּלִשְׁתִּ֔ים גָּלְיָ֥ת שְׁמ֖/וֹ מִ/גַּ֑ת גָּבְה֕/וֹ שֵׁ֥שׁ אַמּ֖וֹת וָ/זָֽרֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/004.yaml
  text: Then a champion came out from the camps of the Philistines[a]; his name was Goliath, from Gath[b]. His height was six cubits and a span.
translation:
  language: hi
  text: तब पलिश्तियों की छावनियों में से एक वीर योद्धा[a] निकला। उसका नाम गोलियत था और वह गत का रहनेवाला था। उसकी ऊँचाई छः हाथ और एक बित्ता थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘बीच का मनुष्य’ है। संभवतः इससे ऐसा प्रतिनिधि योद्धा अभिप्रेत है जो दोनों सेनाओं के बीच निकलकर द्वंद्व-युद्ध करता था।
    reason: lexical_alternative
  - marker: b
    text: छः हाथ और एक बित्ता लगभग 9 फुट 9 इंच (करीब 3.0 मीटर) है; वास्तविक माप इस बात पर निर्भर करता है कि किस प्रकार का ‘हाथ’ माना जाए।
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ הַבֵּנַיִם
  choice: वीर योद्धा
  rationale: इस इब्रानी मुहावरे का शाब्दिक अर्थ ‘बीच का मनुष्य’ है और प्रसंग में यह दोनों सेनाओं के बीच प्रतिनिधि के रूप में लड़ने के लिए निकलनेवाले योद्धा को दर्शाता है। ‘वीर योद्धा’ सामान्य पाठक के लिए स्वाभाविक है; शाब्दिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וַיֵּצֵא
  choice: निकला
  rationale: क्रिया का अर्थ बाहर निकलना है; यहाँ पलिश्ती छावनियों से युद्धभूमि की ओर आने के लिए ‘निकला’ स्वाभाविक हिंदी है।
- source_word: מִמַּחֲנוֹת פְּלִשְׁתִּים
  choice: पलिश्तियों की छावनियों में से
  rationale: मूल पाठ में ‘छावनियाँ’ बहुवचन है, इसलिए उसे बनाए रखा गया है। ‘पलिश्ती’ इस प्राचीन जाति के नाम का प्रचलित हिंदी रूप है।
- source_word: גָּלְיָת שְׁמוֹ
  choice: उसका नाम गोलियत था
  rationale: यह नाम प्रस्तुत करनेवाली इब्रानी संरचना का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: מִגַּת
  choice: गत का रहनेवाला था
  rationale: मूल पाठ सीधे उसके उद्गम-स्थान ‘गत’ का उल्लेख करता है; हिंदी में स्थान-संबंध को स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: גָּבְהוֹ
  choice: उसकी ऊँचाई
  rationale: संज्ञा का अर्थ उसके कद या ऊँचाई से है; ‘ऊँचाई’ आधुनिक हिंदी में स्पष्ट है।
- source_word: שֵׁשׁ אַמּוֹת וָזָרֶת
  choice: छः हाथ और एक बित्ता
  rationale: प्राचीन मापों को मुख्य पाठ में बनाए रखा गया है। אַמָּה के लिए ‘हाथ’ और זֶרֶת के लिए ‘बित्ता’ हिंदी के पारंपरिक तथा बोधगम्य माप-शब्द हैं; आधुनिक अनुमान पादटिप्पणी में दिया गया है।
theological_decisions: []
