  edition: WLC
  text: וַ/יַּשְׁכֵּ֨ם דָּוִ֜ד בַּ/בֹּ֗קֶר וַ/יִּטֹּ֤שׁ אֶת הַ/צֹּאן֙ עַל שֹׁמֵ֔ר וַ/יִּשָּׂ֣א וַ/יֵּ֔לֶךְ כַּ/אֲשֶׁ֥ר צִוָּ֖/הוּ יִשָׁ֑י וַ/יָּבֹא֙ הַ/מַּעְגָּ֔לָ/ה וְ/הַ/חַ֗יִל הַ/יֹּצֵא֙ אֶל הַ/מַּ֣עֲרָכָ֔ה וְ/הֵרֵ֖עוּ בַּ/מִּלְחָמָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/020.yaml
  text: So David rose early in the morning[a], left the sheep with a keeper, took the supplies, and went, just as Jesse had commanded him[b]. He came to the encampment as the army was going out to the battle line and shouting the war cry.
translation:
  language: hi
  text: दाऊद सुबह तड़के उठा। उसने भेड़ों को एक रखवाले की देखरेख में छोड़ दिया, सामान लिया और चल पड़ा, ठीक वैसे ही जैसे यिशै ने उसे आज्ञा दी थी। वह छावनी[a] में पहुँचा, जब सेना युद्ध-पंक्ति की ओर निकल रही थी और युद्ध-घोष कर रही थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “छावनी का घेरा” अथवा “गाड़ियों से बनी रक्षात्मक परिधि”; इब्रानी शब्द विशेष रूप से छावनी की गोलाकार बनावट या उसकी रक्षात्मक सीमा का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “और उन्होंने युद्ध में/युद्ध के लिए ऊँची पुकार लगाई।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּשְׁכֵּם דָּוִד בַּבֹּקֶר
  choice: दाऊद भोर को सवेरे उठा
  rationale: क्रिया शीघ्र उठने या आरम्भ करने का भाव देती है; यह हिंदी अभिव्यक्ति सुबह बहुत जल्दी उठने पर कथात्मक बल बनाए रखती है।
- source_word: וַיִּטֹּשׁ אֶת־הַצֹּאן עַל־שֹׁמֵר
  choice: उसने भेड़ों को एक रखवाले के पास छोड़ा
  rationale: यह भेड़ों को किसी अन्य की देखरेख में छोड़ने का स्वाभाविक और संदर्भानुकूल हिंदी रूप है।
- source_word: וַיִּשָּׂא
  choice: सामान उठाया
  rationale: मूल क्रिया का अर्थ 'उठाना/लेना' है और उसका कर्म यहाँ लुप्त है; पिछले पद की रसद-सामग्री संदर्भ से निहित होने के कारण 'सामान' स्पष्ट किंतु संयत पूर्ति है।
- source_word: כַּאֲשֶׁר צִוָּהוּ יִשָׁי
  choice: ठीक वैसे ही जैसे यिशै ने उसे आज्ञा दी थी
  rationale: आज्ञा के अर्थ और दाऊद द्वारा उसके ठीक अनुरूप कार्य करने—दोनों को सुरक्षित रखता है।
- source_word: הַמַּעְגָּלָה
  choice: छावनी
  rationale: सैन्य पड़ाव के लिए सहज आधुनिक हिंदी; शब्द में निहित संभावित गोलाकार घेरा या रक्षात्मक परिधि को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: הַחַיִל הַיֹּצֵא אֶל־הַמַּעֲרָכָה
  choice: सेना युद्ध-पंक्ति की ओर निकल रही थी
  rationale: कृदन्त से व्यक्त समकालीन पृष्ठभूमि-क्रिया तथा युद्ध के लिए सजी पंक्ति, दोनों का स्वाभाविक हिंदी रूप।
- source_word: וְהֵרֵעוּ בַּמִּלְחָמָה
  choice: और युद्ध के लिए जयघोष कर रही थी
  rationale: यहाँ क्रिया ऊँची सामरिक पुकार लगाने को व्यक्त करती है; 'युद्ध के लिए जयघोष' सैन्य संदर्भ को स्पष्ट रखता है, जबकि अधिक शाब्दिक संरचना पादटिप्पणी में दी गई है।
