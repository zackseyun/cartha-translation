translation_notes:
  register: आधुनिक मानक हिंदी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। इब्रानी के क्रमिक क्रियाविन्यास को छोटे, स्पष्ट वाक्यों में रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों का स्थान उनकी सामग्री से मेल नहीं खाता था; हिंदी में [a] को ‘छावनी’ और [b] को युद्ध-जयघोष के साथ सही स्थान पर रखा गया है।
