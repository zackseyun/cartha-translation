  terminology: “दाऊद,” “यिशै,” “छावनी,” “युद्ध-पंक्ति,” and “रखवाला” are suitable. “युद्ध-घोष” accurately conveys the loud military shout without adding an interpretive sense of victory or praise.
  issues:
