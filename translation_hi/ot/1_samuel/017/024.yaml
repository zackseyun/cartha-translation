  text: इस्राएल के सभी पुरुष उस पुरुष को देखते ही उसके सामने से भाग गए और बहुत डर गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֹל אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के सभी पुरुष
  rationale: यह सामूहिक अभिव्यक्ति इस्राएली सेना के पुरुषों को सूचित करती है; ‘सभी पुरुष’ मूल की व्यापकता बनाए रखता है।
- source_word: הָאִישׁ
  choice: उस पुरुष
  rationale: मूल पाठ गोलियत को सामान्य पद ‘उस पुरुष’ से फिर निर्दिष्ट करता है; अनावश्यक रूप से उसका नाम जोड़ने के बजाय वही संदर्भात्मक शैली रखी गई है।
- source_word: מִפָּנָיו
  choice: उसके सामने से
  rationale: इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप, जिससे उसके सम्मुख से दूर भागने का भाव व्यक्त होता है।
- source_word: וַיִּירְאוּ מְאֹד
  choice: बहुत डर गए
  rationale: क्रिया और तीव्रतासूचक अव्यय दोनों का सरल, वर्तमान हिन्दी में सीधा अनुवाद।
