source:
  edition: WLC
  text: וַ/יֹּאמֶר֮ דָּוִד֒ יְהוָ֗ה אֲשֶׁ֨ר הִצִּלַ֜/נִי מִ/יַּ֤ד הָֽ/אֲרִי֙ וּ/מִ/יַּ֣ד הַ/דֹּ֔ב ה֣וּא יַצִּילֵ֔/נִי מִ/יַּ֥ד הַ/פְּלִשְׁתִּ֖י הַ/זֶּ֑ה וַ/יֹּ֨אמֶר שָׁא֤וּל אֶל דָּוִד֙ לֵ֔ךְ וַֽ/יהוָ֖ה יִהְיֶ֥ה עִמָּֽ/ךְס־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/037.yaml
  text: David said[a], “Yahweh, who delivered me from the paw of the lion and from the paw of the bear, he will deliver me from the hand of this Philistine.” Then Saul said to David, “Go, and may Yahweh be with you.”
translation:
  language: hi
  text: दाऊद ने कहा, “याहवे, जिसने मुझे सिंह के पंजे और भालू के पंजे से बचाया, वही मुझे इस पलिश्ती के हाथ से बचाएगा।” तब शाऊल ने दाऊद से कहा, “जा, और याहवे तेरे साथ रहे।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और याहवे तेरे साथ रहेगा।” हिब्रू को आशीर्वाद या कामना के रूप में भी और साधारण भविष्य कथन के रूप में भी समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में उसके प्रचलित निकट लिप्यंतरण द्वारा व्यक्त किया गया है।
- source_word: הִצִּלַנִי / יַצִּילֵנִי
  choice: मुझे बचाया है / मुझे बचाएगा
  rationale: हिफ़ील रूप यहाँ संकट से छुड़ाने का अर्थ देता है। एक ही हिंदी क्रिया दोनों स्थानों पर रखकर दाऊद के पिछले अनुभव और भावी भरोसे का संबंध बनाए रखा गया है।
- source_word: מִיַּד
  choice: पंजे से / हाथ से
  rationale: मूल शब्द का शाब्दिक अर्थ ‘हाथ’ है। पशुओं के लिए स्वाभाविक हिंदी में ‘पंजा’ और पलिश्ती के लिए ‘हाथ’ रखा गया है; दोनों जगह किसी की पकड़ या शक्ति से बचाए जाने का भाव बना रहता है।
- source_word: הָאֲרִי / הַדֹּב
  choice: सिंह / भालू
  rationale: निश्चित पशुओं के सीधे और स्वाभाविक हिंदी नाम।
- source_word: הוּא
  choice: वही
  rationale: स्वतंत्र सर्वनाम के बल को ‘वही’ से प्रकट किया गया है, जिससे याहवे पर दाऊद का दृढ़ भरोसा उभरता है।
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: इस पलिश्ती
  rationale: संकेतवाचक पद को हिंदी के स्वाभाविक क्रम में रखकर दाऊद के सामने खड़े विशेष पलिश्ती की ओर संकेत सुरक्षित रखा गया है।
- source_word: לֵךְ
  choice: जा
  rationale: एकवचन आदेश संक्षिप्त और सीधा है; शाऊल और दाऊद के संवाद में ‘जा’ स्वाभाविक है।
- source_word: יִהְיֶה עִמָּךְ
  choice: तेरे साथ रहे
  rationale: संदर्भ में अपूर्ण क्रिया को आशीर्वाद या कामना के रूप में पढ़ना स्वाभाविक है; हिंदी संभावनार्थक रूप इसे सहजता से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित किया गया है।
- issue: शाऊल के अंतिम कथन का भाव
  choice: कामना/आशीर्वाद—‘याहवे तेरे साथ रहे’
  alternative: साधारण भविष्य कथन—‘याहवे तेरे साथ रहेगा’
  rationale: हिब्रू अपूर्ण रूप दोनों अर्थ ग्रहण कर सकता है। विदाई के संदर्भ में कामना मुख्य पाठ में अधिक स्वाभाविक है, जबकि वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सहज संवाद रखा गया है। दाऊद और शाऊल के ऐतिहासिक नाम-रूप तथा ‘पलिश्ती’ का परिचित हिंदी रूप अपनाया गया है। पशुओं के संदर्भ में ‘पंजा’ और मनुष्य के संदर्भ में ‘हाथ’ रखकर मूल बिंब को प्राकृतिक हिंदी में व्यक्त किया गया है।
