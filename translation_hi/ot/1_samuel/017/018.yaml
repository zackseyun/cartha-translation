  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी अपनाई गई है। सैन्य पद को अत्यधिक प्राचीन शब्दावली के बिना स्पष्ट किया गया है, और עֲרֻבָּתָם की वास्तविक अर्थगत अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई है।
