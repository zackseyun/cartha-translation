source:
  edition: WLC
  text: וְ֠/אֵת עֲשֶׂ֜רֶת חֲרִצֵ֤י הֶֽ/חָלָב֙ הָ/אֵ֔לֶּה תָּבִ֖יא לְ/שַׂר הָ/אָ֑לֶף וְ/אֶת אַחֶ֨י/ךָ֙ תִּפְקֹ֣ד לְ/שָׁל֔וֹם וְ/אֶת עֲרֻבָּתָ֖/ם תִּקָּֽח־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/018.yaml
  text: Also bring these ten cuts of cheese to the commander of the thousand[a], check on your brothers’ welfare, and bring back some token from them.
translation:
  language: hi
  text: और पनीर के ये दस टुकड़े हज़ार सैनिकों की टुकड़ी के प्रधान के पास ले जाना। अपने भाइयों का कुशल-क्षेम पूछना और उनकी ओर से कोई निशानी[a] वापस ले आना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उनकी जमानत” अथवा “उनसे कोई प्रमाण।” मूल शब्द का अर्थ ऐसी वस्तु या चिह्न भी हो सकता है जिसे भाइयों की दशा के प्रमाण के रूप में वापस लाया जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲרִצֵי הֶחָלָב
  choice: पनीर के टुकड़े
  rationale: חֲרִיצִים काटे या जमाए हुए हिस्सों अथवा टिकियों को सूचित कर सकता है; दूध से बने पदार्थ के संदर्भ में ‘पनीर के टुकड़े’ ठोस बिंब और सहज आधुनिक हिन्दी दोनों बनाए रखता है।
- source_word: שַׂר הָאָלֶף
  choice: हज़ार सैनिकों की टुकड़ी के प्रधान
  rationale: שַׂר सैन्य अगुआ या अधिकारी है और אֶלֶף यहाँ हज़ार की सैन्य इकाई को दर्शाता है। यह रूप सैन्य संरचना को स्पष्ट रखते हुए हिन्दी में स्वाभाविक है।
- source_word: תִּפְקֹד לְשָׁלוֹם
  choice: कुशल-क्षेम पूछना
  rationale: פקד यहाँ उनकी दशा जानने या उनका हाल लेने का भाव देता है, और לְשָׁלוֹם उनके कल्याण को सूचित करता है। ‘कुशल-क्षेम पूछना’ इसका स्वाभाविक हिन्दी समतुल्य है।
- source_word: עֲרֻבָּתָם
  choice: उनकी ओर से कोई निशानी
  rationale: यह शब्द गिरवी, प्रमाण या पहचान की निशानी का अर्थ दे सकता है। ‘कोई निशानी’ संदर्भ में लौटाकर लाए जाने वाले प्रमाण का भाव देता है, जबकि शब्द की अनिश्चितता को पूरी तरह समाप्त नहीं करता।
- source_word: תָּבִיא
  choice: ले जाना
  rationale: यिशै दाऊद को अपने स्थान से छावनी की ओर वस्तु पहुँचाने को कहता है; हिन्दी में वक्ता से दूर की दिशा के लिए ‘ले जाना’ स्वाभाविक है।
- source_word: תִּקָּח
  choice: वापस ले आना
  rationale: לקח मूलतः ‘लेना’ है, पर संदर्भ में वस्तु भाइयों से लेकर यिशै के पास लौटाने का आशय है; ‘वापस ले आना’ उस संदर्भगत दिशा को स्पष्ट करता है।
