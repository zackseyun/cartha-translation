translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। ‘उठ खड़ा हुआ’ स्रोत की अभिव्यक्ति को सुरक्षित रखता है, जबकि ‘दाढ़ी’ को अधिक व्याख्यात्मक पशु-शारीरिक शब्द से नहीं बदला गया।
