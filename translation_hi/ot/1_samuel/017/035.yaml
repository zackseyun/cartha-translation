base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/035.yaml
  text: I went out after it and struck it and rescued it from its mouth[a]; and when it rose up against me[b], I seized it by its beard and struck it and killed it.
translation:
  language: hi
  text: मैं उसके पीछे निकल गया, उस पर प्रहार किया और उसके मुँह से भेड़ के बच्चे को छुड़ा लिया।[a] जब वह मेरे विरुद्ध उठ खड़ा हुआ, तो मैंने उसकी दाढ़ी[b] पकड़ ली, उस पर प्रहार किया और उसे मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में पशु के लिए पुल्लिंग एकवचन प्रत्यय हैं—शाब्दिक रूप से, “उसके पीछे … उसके मुँह से।” “भेड़ का बच्चा” पिछले पद से समझा जाता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “दाढ़ी”; कुछ अनुवाद संदर्भ के अनुसार “अयाल” या “जबड़ा” कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָאתִי אַחֲרָיו
  choice: मैं उसके पीछे गया
  rationale: יצא के ठोस गतिशील अर्थ और אַחֲרָיו के ‘पीछे’ भाव को स्वाभाविक आधुनिक हिन्दी में रखा गया है। पुल्लिंग एकवचन सर्वनाम पिछले पद के सिंह या भालू की ओर संकेत करता है।
- source_word: וְהִכִּתִיו
  choice: उसे मारा
  rationale: נכה का व्यापक अर्थ ‘मारना/प्रहार करना’ है। इसे ऐसा नहीं बनाया गया कि पहला प्रहार ही प्राणघातक था, क्योंकि अंत में मृत्यु के लिए अलग क्रिया आती है।
- source_word: וְהִצַּלְתִּי מִפִּיו
  choice: झुंड के पशु को उसके मुँह से छुड़ा लिया
  rationale: हिफ़ील נצל का अर्थ यहाँ छुड़ाना या बचाना है। बचाई गई वस्तु इब्रानी में व्यक्त नहीं, बल्कि पिछले पद से समझी जाती है; स्पष्ट और सहज हिन्दी के लिए ‘झुंड के पशु को’ जोड़ा गया है। ‘मुँह’ स्रोत की ठोस छवि को बनाए रखता है।
- source_word: וַיָּקָם עָלַי
  choice: जब वह मुझ पर उठ खड़ा हुआ
  rationale: קום על में विरोधी होकर उठने या आक्रमण के लिए सामने आने का भाव है। यह अनुवाद hostile action को बनाए रखता है, पर उसे अधिक विशिष्ट ‘झपटा’ कहकर सीमित नहीं करता।
- source_word: וְהֶחֱזַקְתִּי בִּזְקָנוֹ
  choice: मैंने उसकी दाढ़ी पकड़कर
  rationale: חזק का हिफ़ील रूप दृढ़ता से पकड़ने का भाव देता है। זקן का सामान्य अर्थ ‘दाढ़ी’ है; पशु के संदर्भ में भी इसी स्पष्ट शब्द को रखा गया है।
- source_word: וַהֲמִיתִּיו
  choice: जान से मार डाला
  rationale: מות का हिफ़ील रूप स्पष्ट रूप से मृत्यु का कारण बनने, अर्थात मार डालने, को व्यक्त करता है और पहले आए ‘मारा’ से चरम क्रिया को अलग रखता है।
