  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ स्वाभाविक कथा-प्रवाह व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: संज्ञा निश्चित है और प्रसंग में शाऊल को सूचित करती है, पर मूल पाठ यहाँ नाम के बजाय पदवी रखता है।
- source_word: שְׁאַל
  choice: पता लगाओ
  rationale: आज्ञार्थक क्रिया का अर्थ ‘पूछना/जानकारी लेना’ है; परोक्ष प्रश्न के साथ ‘पता लगाओ’ आधुनिक हिन्दी में उद्देश्य को स्वाभाविक रूप से व्यक्त करता है और पूछताछ का भाव बनाए रखता है।
- source_word: אַתָּה
  choice: तुम
  rationale: मूल में स्वतंत्र सर्वनाम स्पष्ट रूप से आया है और आदेश में बल देता है; हिन्दी में ‘तुम’ को प्रकट रखने से यह बल सुरक्षित रहता है।
- source_word: בֶּן מִי
  choice: किसका बेटा
  rationale: यह इब्रानी मुहावरा पितृवंश पूछता है; ‘किसका बेटा’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: זֶה
  choice: यह
  rationale: निकटता-सूचक पुल्लिंग एकवचन सर्वनाम का सीधा हिन्दी समतुल्य।
- source_word: הָעָלֶם
  choice: जवान
  rationale: यह शब्द युवा पुरुष को सूचित करता है; ‘जवान’ संक्षिप्त, वर्तमान और बोलचाल में स्वाभाविक है।
