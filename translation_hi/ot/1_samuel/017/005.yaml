lexical_decisions:
- source_word: כּוֹבַע
  choice: टोप
  rationale: सैनिक प्रसंग में यह सिर की रक्षा करने वाला टोप है। ‘टोप’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: बाइबलीय भौतिक संस्कृति में यह शब्द ताँबे या काँसे की धातु के लिए प्रयुक्त हो सकता है; यहाँ शस्त्र-सज्जा के प्रसंग में ‘काँसा’ अधिक संभावित और प्रचलित अर्थ है।
- source_word: שִׁרְיוֹן קַשְׂקַשִּׂים
  choice: शल्कों वाला कवच
  rationale: शाब्दिक चित्र ऐसे कवच का है जो एक-दूसरे पर चढ़े हुए शल्कों से बना था। यह अनुवाद उसे जंजीरी कवच समझे जाने से बचाता है।
- source_word: הוּא לָבוּשׁ
  choice: वह ... पहने हुए था
  rationale: यह अभिव्यक्ति उसके कवच धारण किए होने की अवस्था बताती है; हिन्दी में ‘पहने हुए था’ उस भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִשְׁקַל
  choice: भार
  rationale: मापी गई भारीपन की मात्रा के लिए ‘भार’ गरिमापूर्ण और सहज हिन्दी शब्द है।
- source_word: חֲמֵשֶׁת אֲלָפִים שְׁקָלִים
  choice: पाँच हज़ार शेकेल
  rationale: मूल पाठ की प्राचीन भार-इकाई को मुख्य पाठ में सुरक्षित रखा गया है; आधुनिक अनुमान पाद-टिप्पणी में दिया गया है।
