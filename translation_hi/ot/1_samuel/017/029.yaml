- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: यह אָמַר का सामान्य कथात्मक रूप है, जो प्रत्यक्ष कथन का परिचय देता है।
- source_word: דָּוִד
  choice: दाऊद
  rationale: हिन्दी बाइबलीय परंपरा में प्रचलित नाम-रूप।
- source_word: מֶה עָשִׂיתִי עָתָּה
  choice: अब मैंने क्या कर दिया?
  rationale: प्रश्न दाऊद के विरोध और खिन्नता को व्यक्त करता है; ‘कर दिया’ तत्काल प्रसंग में उसके कथित अपराध पर स्वाभाविक हिन्दी प्रतिक्रिया है।
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह ऐसा आलंकारिक प्रश्न प्रस्तुत करता है जिसमें सकारात्मक उत्तर अपेक्षित है।
- source_word: דָּבָר
  choice: एक बात
  rationale: דָּבָר का अर्थ ‘बात’, ‘वचन’, ‘मामला’ या ‘वस्तु’ हो सकता है। यहाँ ‘बात’ कथन और विषय—दोनों की कुछ अस्पष्टता बनाए रखती है।
- source_word: הוּא
  choice: ही
  rationale: हिन्दी वाक्य में पृथक सर्वनाम अस्वाभाविक होता; ‘ही’ के साथ ‘क्या ... नहीं’ मूल के सीमित करने वाले आलंकारिक भाव को स्वाभाविक रूप से व्यक्त करता है।
