base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/023.yaml
  text: While he was speaking with them[a], behold, the champion came up—the Philistine named Goliath, from Gath, from the ranks of the Philistines—and he spoke these words[b], and David heard.
translation:
  language: hi
  text: जब वह उनसे बातें कर रहा था, तभी देखो, वह योद्धा[a]—गत का रहनेवाला गोलियत नाम का वह पलिश्ती—पलिश्तियों की पांतों में से[b] ऊपर आया। उसने फिर वही बातें कहीं, और दाऊद ने उन्हें सुना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “दोनों के बीच का पुरुष” है—अर्थात दोनों सेनाओं के बीच एकल युद्ध में प्रतिनिधित्व करनेवाला योद्धा।
    reason: lexical_alternative
  - marker: b
    text: “पलिश्तियों की पांतों” वाला इब्रानी पाठ कठिन है; इसका अनुवाद “पलिश्तियों की युद्ध-पंक्तियों” या “पलिश्तियों के शिविरों” से भी किया जाता है।
    reason: alternative_reading
