- source_word: עוֹלֶה
  choice: ऊपर आया
  rationale: युद्धभूमि के संदर्भ में आगे/ऊपर आने की गति को व्यक्त करता है और हिन्दी कथन में स्वाभाविक है।
- source_word: הַפְּלִשְׁתִּי שְׁמוֹ ... מִגַּת
  choice: गत का रहनेवाला गोलियत नाम का वह पलिश्ती
  rationale: नाम, जातीय पहचान और स्थान—तीनों को स्पष्ट, स्वाभाविक हिन्दी क्रम में रखता है।
- source_word: מ/מערות פְּלִשְׁתִּים
  choice: पलिश्तियों की पांतों में से
  rationale: कठिन पाठ का प्रसंगानुकूल अर्थ पलिश्ती युद्ध-पंक्तियों से निकलना है; पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: וַיְדַבֵּר כַּדְּבָרִים הָאֵלֶּה
  choice: उसने फिर वही बातें कहीं
  rationale: यह पहले कही गई चुनौती की पुनरावृत्ति की ओर संकेत करता है; हिन्दी में संदर्भ-संबंध स्पष्ट करता है।
- source_word: וַיִּשְׁמַע דָּוִד
  choice: दाऊद ने उन्हें सुना
  rationale: सुनने का निहित कर्म पूर्ववर्ती बातों से स्पष्ट है; हिन्दी में सर्वनाम जोड़ना स्वाभाविक है।
