  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל הַ/פְּלִשְׁתִּ֔י אַתָּה֙ בָּ֣א אֵלַ֔/י בְּ/חֶ֖רֶב וּ/בַ/חֲנִ֣ית וּ/בְ/כִיד֑וֹן וְ/אָנֹכִ֣י בָֽא אֵלֶ֗י/ךָ בְּ/שֵׁם֙ יְהוָ֣ה צְבָא֔וֹת אֱלֹהֵ֛י מַעַרְכ֥וֹת יִשְׂרָאֵ֖ל אֲשֶׁ֥ר חֵרַֽפְתָּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/045.yaml
  text: Then David said to the Philistine[a], “You come to me with a sword, with a spear, and with a javelin, but I come to you in the name of Yahweh of Armies, the God of the armies of Israel[c][b], whom you have defied.”
translation:
  language: hi
  text: तब दाऊद ने उस पलिश्ती से कहा, “तू तलवार, भाला और बरछी लेकर मेरे पास आता है, पर मैं सेनाओं के याहवे के नाम में तेरे पास आता हूँ—इस्राएल की युद्ध-पंक्तियों के परमेश्वर के, जिसका तूने अपमान किया है।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में उसके क्रमिक बल को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: यह संज्ञा गोलियत को उसकी जातीय पहचान से निर्दिष्ट करती है; ‘योद्धा’ जोड़ना आवश्यक नहीं क्योंकि वह मूल में स्पष्ट रूप से नहीं है।
- source_word: בָּא אֵלַי / בָא אֵלֶיךָ
  choice: मेरे पास आता है / तेरे पास आता हूँ
  rationale: कृदन्त वर्तमान अथवा आसन्न क्रिया दर्शाता है। शत्रुतापूर्ण भाव प्रसंग से स्पष्ट है, इसलिए ‘विरुद्ध’ जोड़कर अर्थ को अनावश्यक रूप से सीमित नहीं किया गया।
- source_word: בְּחֶרֶב וּבַחֲנִית וּבְכִידוֹן
  choice: तलवार, भाला और बरछी लेकर
  rationale: ב साधन का बोध कराता है। ‘लेकर’ हिन्दी में स्वाभाविक है; ‘बरछी’ כידון को חנית ‘भाला’ से अलग हल्के अथवा फेंके जाने वाले भाले के रूप में व्यक्त करती है।
- source_word: בְּשֵׁם
  choice: के नाम में
  rationale: यह पद अधिकार, प्रतिनिधित्व और आश्रय का भाव रखता है। ‘नाम में’ बाइबलीय मुहावरे और उसके धर्मवैज्ञानिक भार को बनाए रखता है।
- source_word: יְהוָה צְבָאוֹת
  choice: सेनाओं के याहवे
  rationale: ईश्वरीय व्यक्तिगत नाम को ‘याहवे’ के रूप में लिप्यंतरित किया गया और צבאות का पारदर्शी अर्थ ‘सेनाओं’ दिया गया।
- source_word: אֱלֹהֵי מַעַרְכוֹת יִשְׂרָאֵל
  choice: इस्राएल की युद्ध-पंक्तियों के परमेश्वर
  rationale: מערכות व्यवस्थित सैन्य पंक्तियों, दलों या सेनाओं को सूचित करता है। ‘युद्ध-पंक्तियाँ’ तत्काल युद्धभूमि के चित्र और व्यवस्था के अर्थ को सुरक्षित रखती हैं।
- source_word: אֲשֶׁר חֵרַפְתָּ
  choice: जिसका तूने अपमान किया है
  rationale: חרף का मूल भाव निन्दा, तिरस्कार या अपमान है। प्रसंग में यह चुनौती भी है, पर मुख्य पाठ में ‘अपमान’ व्यापक अर्थ को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का सीधे प्रयोग करता है। ‘याहवे’ उसे उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- issue: יְהוָה צְבָאוֹת की उपाधि
  choice: सेनाओं के याहवे
  alternative: सेनाधीश याहवे / सेनाओं का प्रभु
  rationale: यह रूप צבאות के बहुवचन और सैन्य-सार्वभौमिक भाव को स्पष्ट रखता है तथा पारंपरिक पर कम पारदर्शी ‘गणों’ से बचता है।
- issue: אֲשֶׁר का पूर्वपद
  choice: परमेश्वर की ओर संकेत करने वाला ‘जिसका’
  alternative: पूरी संयुक्त उपाधि अथवा इस्राएल की युद्ध-पंक्तियों की ओर संकेत
  rationale: निकटतम उपयुक्त पूर्वपद ‘परमेश्वर’ है और प्रसंग में गोलियत का तिरस्कार इस्राएल के परमेश्वर के विरुद्ध माना गया है; फिर भी हिब्रू सम्बन्धवाचक रचना संक्षिप्त है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक रूप से स्पष्ट रखी गई है। दाऊद और गोलियत के सीधे संवाद में एकवचन अनौपचारिक ‘तू/तेरे’ मूल हिब्रू के सीधे, टकरावपूर्ण संबोधन को व्यक्त करता है। हथियारों के लिए सामान्य हिन्दी शब्द चुने गए हैं और सैन्य पदावली को अत्यधिक संस्कृतनिष्ठ नहीं बनाया गया।
