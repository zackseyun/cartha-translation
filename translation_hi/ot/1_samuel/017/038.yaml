  text: Then Saul clothed David with his garments[a], put a bronze helmet on his head[b], and clothed him with armor.
translation:
  language: hi
  text: तब शाऊल ने दाऊद को अपने वस्त्र पहनाए[a], उसके सिर पर काँसे का टोप रखा, और उसे कवच[b] पहनाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपने सैनिक वस्त्र।’ इब्रानी शब्द पद या युद्ध से जुड़े वस्त्रों को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात शरीर पर पहना जाने वाला कवच; इब्रानी शब्द यहाँ उसकी सटीक बनावट नहीं बताता।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיַּלְבֵּשׁ
  choice: पहनाए / पहनाया
  rationale: हिफ़ील रूप का कारक अर्थ है—किसी को कोई वस्तु पहनाना। दोनों occurrences में इसी क्रिया को बनाए रखा गया है।
- source_word: מַדָּיו
  choice: अपने वस्त्र
  rationale: מַדִּים पद, सेवा या युद्ध से जुड़े वस्त्रों को दर्शा सकता है। यहाँ अलग से टोप और कवच का उल्लेख होने के कारण व्यापक शब्द ‘वस्त्र’ उपयुक्त है; ‘अपने’ का संकेत शाऊल की ओर है।
- source_word: קוֹבַע נְחֹשֶׁת
  choice: काँसे का टोप
  rationale: קוֹבַע सिर की रक्षा के लिए पहना जाने वाला टोप है और נְחֹשֶׁת इस प्राचीन सैन्य संदर्भ में काँसा दर्शाता है।
- source_word: עַל רֹאשׁוֹ
  choice: उसके सिर पर
  rationale: यह मूल पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; संदर्भ में सर्वनाम दाऊद को सूचित करता है।
- source_word: שִׁרְיוֹן
  choice: कवच
  rationale: यह शरीर की रक्षा के लिए पहने जाने वाले युद्ध-कवच को दर्शाता है। मूल पद उसकी सटीक बनावट स्पष्ट नहीं करता, इसलिए सामान्य और आधुनिक ‘कवच’ चुना गया है।
