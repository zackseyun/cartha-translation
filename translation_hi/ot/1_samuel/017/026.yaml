  edition: WLC
  text: וַ/יֹּ֣אמֶר דָּוִ֗ד אֶֽל הָ/אֲנָשִׁ֞ים הָ/עֹמְדִ֣ים עִמּ/וֹ֮ לֵ/אמֹר֒ מַה יֵּעָשֶׂ֗ה לָ/אִישׁ֙ אֲשֶׁ֤ר יַכֶּה֙ אֶת הַ/פְּלִשְׁתִּ֣י הַלָּ֔ז וְ/הֵסִ֥יר חֶרְפָּ֖ה מֵ/עַ֣ל יִשְׂרָאֵ֑ל כִּ֣י מִ֗י הַ/פְּלִשְׁתִּ֤י הֶֽ/עָרֵל֙ הַ/זֶּ֔ה כִּ֣י חֵרֵ֔ף מַעַרְכ֖וֹת אֱלֹהִ֥ים חַיִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/026.yaml
  text: And David said to the men standing with him, “What will be done for the man who strikes down this Philistine and removes disgrace from Israel? For who is this uncircumcised Philistine, this one who has defied the battle lines of the living God?”
translation:
  language: hi
  text: तब दाऊद ने अपने पास खड़े पुरुषों से कहा, “जो इस पलिश्ती को मार गिराएगा और इस्राएल पर से अपमान हटा देगा, उस व्यक्ति के लिए क्या किया जाएगा? क्योंकि यह खतनारहित पलिश्ती कौन है, जिसने जीवित परमेश्वर की युद्ध-पंक्तियों को ललकारा है?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... पूछा
  rationale: शाब्दिक अर्थ ‘कहा’ है, पर आगे प्रत्यक्ष प्रश्न होने के कारण स्वाभाविक हिन्दी में ‘पूछा’ कथन की संवादात्मक भूमिका स्पष्ट करता है; וַ की कथात्मक प्रगति ‘तब’ से व्यक्त हुई है।
- source_word: יַכֶּה
  choice: मार गिराएगा
  rationale: נכה हिफ़िल का यहाँ अर्थ युद्ध में प्रहार करके परास्त/मार डालना है; प्रसंग के अनुसार ‘मार गिराना’ उपयुक्त है।
- source_word: חֶרְפָּה
  choice: अपमान
  rationale: यह शब्द निंदा, कलंक और तिरस्कार का भाव रखता है; ‘अपमान’ आधुनिक हिन्दी में व्यापक और सहज है।
- source_word: הֶעָרֵל
  choice: खतनारहित
  rationale: मूल का शारीरिक-वाचा-संबंधी विशेषण सीधे सुरक्षित रखा गया है; इसे केवल ‘अधर्मी’ जैसे व्याख्यात्मक शब्द से नहीं बदला गया।
- source_word: מַעַרְכוֹת
  choice: सेनाओं
  rationale: शब्द का मूल भाव युद्ध के लिए सजी पंक्तियाँ/दल है। हिन्दी में ‘सेनाओं’ स्वाभाविक है और इस्राएली युद्ध-दलों के बहुवचन को बनाए रखता है।
- source_word: חֵרֵף
  choice: ललकारता है
  rationale: पिएल रूप तिरस्कारपूर्वक चुनौती देने का भाव देता है। पूर्ववर्ती और जारी चुनौती को हिन्दी के वर्तमान काल में स्वाभाविक रूप से व्यक्त किया गया है।
theological_decisions:
- issue: ‘खतनारहित’ का वाचा-संबंधी अपमानसूचक बल
  choice: खतनारहित पलिश्ती
  alternative: अधर्मी पलिश्ती
  rationale: मूल की ठोस वाचा-संबंधी भाषा को सुरक्षित रखा गया है और किसी व्यापक धार्मिक निष्कर्ष को पाठ में नहीं जोड़ा गया।
- issue: מַעַרְכוֹת אֱלֹהִים חַיִּים का आशय
  choice: जीवित परमेश्वर की सेनाएँ
  alternative: जीवित परमेश्वर की युद्ध-पंक्तियाँ
  rationale: यहाँ इस्राएल की युद्ध-सज्जित टुकड़ियाँ परमेश्वर से संबद्ध कही गई हैं। ‘सेनाएँ’ अर्थ को सहज हिन्दी में रखता है, बिना उन्हें स्वर्गदूतों की सेना मानने का अर्थ जोड़े।
- issue: חֵרֵף का कालगत रूप
  choice: ललकारता है
  alternative: ललकारा है
  rationale: हिब्रू पूर्ण रूप को प्रसंग में वर्तमान प्रासंगिकता वाली की गई चुनौती के रूप में समझा गया है। हिन्दी वर्तमान उसके जारी अपमानसूचक आचरण को व्यक्त करता है; वैकल्पिक पूर्णकाल भी संभव है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। संवाद की तीव्रता बनाए रखने के लिए छोटे, सीधे प्रश्न रखे गए हैं। ‘पुरुषों’ मूल אֲנָשִׁים का स्पष्ट प्रतिनिधित्व करता है; कोई अनावश्यक व्याख्यात्मक पद या संप्रदायगत शब्दावली नहीं जोड़ी गई।
