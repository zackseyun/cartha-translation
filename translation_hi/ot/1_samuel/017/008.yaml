  text: וַֽ/יַּעֲמֹ֗ד וַ/יִּקְרָא֙ אֶל מַעַרְכֹ֣ת יִשְׂרָאֵ֔ל וַ/יֹּ֣אמֶר לָ/הֶ֔ם לָ֥/מָּה תֵצְא֖וּ לַ/עֲרֹ֣ךְ מִלְחָמָ֑ה הֲ/ל֧וֹא אָנֹכִ֣י הַ/פְּלִשְׁתִּ֗י וְ/אַתֶּם֙ עֲבָדִ֣ים לְ/שָׁא֔וּל בְּרוּ לָ/כֶ֥ם אִ֖ישׁ וְ/יֵרֵ֥ד אֵלָֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/008.yaml
  text: He stood and called out to the battle lines of Israel and said to them[a], “Why do you come out to array yourselves for battle? Am I not the Philistine, and are you not servants of Saul? Choose a man for yourselves[b], and let him come down to me.”
translation:
  language: hi
  text: वह खड़ा हुआ और इस्राएल की युद्ध-पंक्तियों को पुकारकर उनसे कहा, “तुम युद्ध के लिए मोर्चा बाँधने क्यों निकलते हो? क्या मैं पलिश्ती नहीं हूँ, और तुम शाऊल के दास[a] नहीं हो? अपने लिए एक आदमी चुनो, और वह मेरे पास नीचे उतर आए।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सेवक।” हिब्रू शब्द עֲבָדִים दासों अथवा सेवकों, दोनों के लिए प्रयुक्त हो सकता है; यहाँ “दास” गोलियत के ताने की अपमानजनक शक्ति को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּעֲמֹד
  choice: वह खड़ा हुआ
  rationale: वर्णन में עמד की सामान्य शारीरिक और आमने-सामने खड़े होने की भावना को सरल, स्वाभाविक हिन्दी में रखता है।
- source_word: וַיִּקְרָא אֶל מַעַרְכוֹת יִשְׂרָאֵל
  choice: इस्राएल की युद्ध-पंक्तियों को पुकारकर
  rationale: מַעַרְכוֹת व्यवस्थित सैन्य पंक्तियों को दर्शाता है और קרא यहाँ ऊँची आवाज़ में सार्वजनिक चुनौती देने का भाव रखता है।
- source_word: לַעֲרֹךְ מִלְחָמָה
  choice: युद्ध के लिए मोर्चा बाँधने
  rationale: ערך के सैनिकों को व्यवस्थित करने के बिंब को वर्तमान और सहज हिन्दी मुहावरे में व्यक्त करता है।
- source_word: אָנֹכִי הַפְּלִשְׁתִּי
  choice: क्या मैं पलिश्ती नहीं हूँ
  rationale: הֲלוֹא से उत्पन्न आलंकारिक प्रश्न और चुनौती का स्वर सुरक्षित रहता है; हिन्दी में जातिवाचक संज्ञा के साथ हिब्रू निश्चित उपपद को अलग से व्यक्त करना अस्वाभाविक होता।
- source_word: עֲבָדִים לְשָׁאוּל
  choice: शाऊल के दास
  rationale: दास अधीनता और अपमानजनक ताने की शक्ति को ‘सेवक’ की अपेक्षा अधिक स्पष्ट रखता है, जबकि शब्द की अर्थ-सीमा पर टिप्पणी दी गई है।
- source_word: בְּרוּ לָכֶם אִישׁ
  choice: अपने लिए एक पुरुष चुनो
  rationale: אִישׁ का एकवचन पुल्लिंग और एक पुरुष योद्धा द्वारा प्रतिनिधिक द्वंद्व का संदर्भ बनाए रखता है।
- source_word: וְיֵרֵד אֵלָי
  choice: और वह मेरे पास नीचे उतर आए
  rationale: ירד की नीचे आने की दिशात्मक भावना तथा आज्ञा के बाद आने वाले इच्छार्थक भाव, दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: עֲבָדִים में सेवक अथवा दास का अर्थ
  choice: दास
  alternative: सेवक
  rationale: यहाँ गोलियत इस्राएलियों को शाऊल के अधीन बताकर अपमानित कर रहा है। ‘दास’ उस ताने और बँधी हुई अधीनता को बनाए रखता है, पर अर्थगत विकल्प को पादटिप्पणी में खुला रखा गया है।
- issue: אִישׁ का लिंग-विशिष्ट अनुवाद
  choice: एक पुरुष
  alternative: एक व्यक्ति अथवा एक योद्धा
  rationale: हिब्रू संज्ञा स्पष्ट रूप से पुल्लिंग एकवचन है और प्रसंग एक पुरुष प्रतिनिधि-योद्धा की माँग करता है; इसलिए इसे लिंग-निरपेक्ष नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक चुनौती के अनुकूल रखी गई है। “युद्ध-पंक्तियाँ” सैन्य गठन को, “मोर्चा बाँधना” युद्ध के लिए पंक्तिबद्ध होने को, और “नीचे उतर आए” स्थल-दिशा को स्पष्ट करता है।
