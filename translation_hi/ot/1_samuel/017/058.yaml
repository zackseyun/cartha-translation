base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/058.yaml
  text: Saul said to him[a], “Whose son are you, young man?” And David said, “I am the son of your servant Jesse the Bethlehemite.”
translation:
  language: hi
  text: शाऊल ने उससे कहा, “हे युवक, तुम किसके बेटे हो?” दाऊद ने कहा, “मैं आपके सेवक, बेतलेहेमवासी यिशै का बेटा हूँ।”[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “आपके सेवक, बेतलेहेमवासी यिशै का बेटा।” इब्रानी उत्तर में “मैं हूँ” स्पष्ट रूप से नहीं लिखा है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּן מִי
  choice: तुम किसके बेटे हो
  rationale: यह स्वाभाविक आधुनिक हिन्दी में इब्रानी मुहावरे के पैतृक वंश संबंधी प्रश्न को बनाए रखता है।
- source_word: הַנָּעַר
  choice: हे जवान
  rationale: נַעַר के आयु-संबंधी लचीलेपन को ध्यान में रखते हुए यह संबोधन दाऊद की युवावस्था व्यक्त करता है, पर उसे छोटा बच्चा नहीं ठहराता।
- source_word: עַבְדְּךָ
  choice: आपके सेवक
  rationale: राजदरबार की विनम्र, आत्म-नत अभिव्यक्ति को दर्शाता है; यहाँ 'दास' अनावश्यक रूप से बंधुआ स्थिति का संकेत दे सकता है।
- source_word: בֵּית הַלַּחְמִי
  choice: बेतलेहेमवासी
  rationale: इब्रानी जातिवाचक रूप द्वारा व्यक्त यिशै के स्थान-संबंध को संक्षेप और स्वाभाविक रूप से प्रकट करता है।
- source_word: וַיֹּאמֶר ... וַיֹּאמֶר
  choice: कहा ... कहा
  rationale: दोनों स्थानों पर प्रयुक्त समान इब्रानी क्रिया का रूप बनाए रखा गया है; प्रश्न का स्वरूप स्वयं पहले कथन का पूछना होना स्पष्ट करता है।
- source_word: בֶּן עַבְדְּךָ יִשַׁי
  choice: मैं आपके सेवक, बेतलेहेमवासी यिशै का बेटा हूँ
  rationale: इब्रानी में स्पष्ट योजक क्रिया नहीं है, पर स्वाभाविक हिन्दी उत्तर के लिए 'मैं ... हूँ' जोड़ा गया है; अर्थ वही निहित है।
