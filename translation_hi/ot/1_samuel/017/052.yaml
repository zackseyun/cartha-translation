  naturalness: The prose is generally natural modern Hindi. “पीछा ... करते गए” is acceptable but more periphrastic than needed; “पीछा किया” is direct. “गिर पड़े” is a more idiomatic narrative equivalent here than “गिरते गए.”
  terminology: “युद्ध का नारा,” “पलिश्ती,” “एक्रोन,” and “शआरैम” are suitable. The military term and the designation “पुरुष” appropriately reflect the source in this context. The revised footnote explicitly identifies the ambiguity without treating one interpretation as certain.
