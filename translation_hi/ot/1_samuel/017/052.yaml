  text: וַ/יָּקֻ֣מוּ אַנְשֵׁי֩ יִשְׂרָאֵ֨ל וִ/יהוּדָ֜ה וַ/יָּרִ֗עוּ וַֽ/יִּרְדְּפוּ֙ אֶת הַ/פְּלִשְׁתִּ֔ים עַד בּוֹאֲ/ךָ֣ גַ֔יְא וְ/עַ֖ד שַׁעֲרֵ֣י עֶקְר֑וֹן וַֽ/יִּפְּל֞וּ חַֽלְלֵ֤י פְלִשְׁתִּים֙ בְּ/דֶ֣רֶךְ שַׁעֲרַ֔יִם וְ/עַד גַּ֖ת וְ/עַד עֶקְרֽוֹן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/052.yaml
  text: Then the men of Israel and Judah rose up and shouted[a], and they pursued the Philistines as far as Gai and as far as the gates of Ekron. The slain Philistines fell along the road to Shaaraim[b], as far as Gath and as far as Ekron.
translation:
  language: hi
  text: तब इस्राएल और यहूदा के पुरुष उठ खड़े हुए, युद्ध का नारा लगाया और पलिश्तियों का पीछा गै तक[a] और एक्रोन के फाटकों तक किया। पलिश्तियों के मारे हुए लोग शआरैम की राह पर, गत तक और एक्रोन तक, गिर पड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी वाक्यांश कठिन है। “गै” को कुछ लोग स्थाननाम मानते हैं; इसका अर्थ ‘घाटी के प्रवेश तक’ भी समझा जाता है।
    reason: textual_and_syntactic_difficulty
lexical_decisions:
- source_word: וַיָּקֻמוּ
  choice: उठ खड़े हुए
  rationale: कथा के क्रम में קום अचानक सक्रिय होकर खड़े होने और आगे बढ़ने को व्यक्त करता है; यह आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אַנְשֵׁי יִשְׂרָאֵל וִיהוּדָה
  choice: इस्राएल और यहूदा के पुरुष
  rationale: אַנְשֵׁי का शाब्दिक अर्थ ‘पुरुष’ है और यहाँ सैनिक प्रसंग होने के कारण यही उपयुक्त है; संबंध दोनों नामों पर लागू होता है।
- source_word: וַיָּרִיעוּ
  choice: युद्ध का नारा लगाकर
  rationale: רוע यहाँ साधारण चिल्लाने के बजाय ऊँची युद्ध-ललकार का बोध कराता है; हिन्दी में यह मार्शल आशय स्पष्ट और स्वाभाविक है।
- source_word: וַיִּרְדְּפוּ
  choice: पीछा ... करते गए
  rationale: רדף सैन्य प्रसंग में पीछा करने को दर्शाता है; ‘करते गए’ पीछा जारी रहने और बताए गए स्थानों तक पहुँचने का भाव देता है।
- source_word: עַד בּוֹאֲךָ גַיְא
  choice: घाटी के प्रवेश तक[a]
  rationale: בואך को मार्ग-वर्णन की रूढ़ि के अनुसार ‘प्रवेश/पहुँचने के स्थान’ और גיא को ‘घाटी’ समझा गया है। वाक्यांश कठिन है, इसलिए विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְעַד שַׁעֲרֵי עֶקְרוֹן
  choice: और एक्रोन के फाटकों तक
  rationale: यह स्थानिक सीमा का सीधा वर्णन है; बहुवचन ‘फाटकों’ मूल रूप को बनाए रखता है।
- source_word: וַיִּפְּלוּ חַלְלֵי פְלִשְׁתִּים
  choice: मारे गए पलिश्ती ... गिरते गए
  rationale: חַלְלֵי युद्ध में घात किए गए या मारे गए लोगों को सूचित करता है, केवल घायलों को नहीं; क्रिया का क्रमिक रूप पीछा करते समय मार्ग में होती मृत्यु को सहज हिन्दी में व्यक्त करता है।
- source_word: בְּדֶרֶךְ שַׁעֲרַיִם
  choice: शआरैम की राह में
  rationale: בדרך के साथ स्थाननाम उस स्थान की ओर जाने वाली राह को दर्शाता है; स्थाननाम का लिप्यंतरण किया गया है।
- source_word: וְעַד גַּת וְעַד עֶקְרוֹן
  choice: गत तक और एक्रोन तक
  rationale: दोहराए गए עַד को दोनों बार ‘तक’ रखकर हानि के विस्तार पर मूल का बल सुरक्षित रखा गया है।
