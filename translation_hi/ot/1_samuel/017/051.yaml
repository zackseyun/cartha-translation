base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/051.yaml
  text: Then David ran and stood over the Philistine[a], took his sword, drew it from its sheath, and killed him; then he cut off his head with it. When the Philistines saw that their champion was dead[b], they fled.
translation:
  language: hi
  text: तब दाऊद दौड़कर उस पलिश्ती के पास खड़ा हो गया[a]। उसने उस पलिश्ती की तलवार ली, उसे म्यान से खींचा और उसे मार डाला। फिर उसी तलवार से उसका सिर काट दिया। जब पलिश्तियों ने देखा कि उनका वीर योद्धा[b] मर गया है, तो वे भाग गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस पलिश्ती के ऊपर खड़ा हो गया।’ इब्रानी अभिव्यक्ति उसके पास स्थान लेने का अर्थ दे सकती है; प्रसंग में दाऊद गिरे हुए गोलियत के ऊपर खड़ा हुआ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से ‘उनका वीर पुरुष’; यहाँ आशय उनके प्रमुख योद्धा से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּרָץ
  choice: दौड़कर
  rationale: रוץ का सामान्य आख्यानात्मक अर्थ स्वाभाविक और सीधा रखा गया है।
- source_word: וַיַּעֲמֹד אֶל הַפְּלִשְׁתִּי
  choice: उस पलिश्ती के पास खड़ा हो गया
  rationale: עמד אל निकट जाकर स्थान लेने को व्यक्त कर सकता है। हिन्दी में ‘के पास खड़ा हो गया’ मूल की स्थानगत अस्पष्टता को ‘ऊपर’ कहकर अनावश्यक रूप से सीमित नहीं करता।
- source_word: חַרְבּוֹ
  choice: उसकी तलवार
  rationale: सर्वनाम का संदर्भ पलिश्ती से है; सरल संबंधसूचक रूप मूल के अनुरूप है।
- source_word: וַיִּשְׁלְפָהּ מִתַּעְרָהּ
  choice: उसे म्यान से खींचा
  rationale: שלף हथियार को म्यान से खींचने के लिए प्रयुक्त होता है और תער यहाँ ‘म्यान’ है।
- source_word: וַיְמֹתְתֵהוּ
  choice: उसे मार डाला
  rationale: מות का यह कारक रूप मृत्यु घटित करने को बताता है। पिछले पद में उसके धरती पर गिरने के बावजूद इस पद के क्रम और तनाव को यथावत रखा गया है।
- source_word: וַיִּכְרָת בָּהּ אֶת רֹאשׁוֹ
  choice: उसी तलवार से उसका सिर काट दिया
  rationale: כרת के साथ ראש सिर काट देने को दर्शाता है; ‘उसी तलवार से’ בָּהּ के स्पष्ट संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גִּבּוֹרָם
  choice: उनका वीर योद्धा
  rationale: גבור का मूल अर्थ बलवान या वीर पुरुष/योद्धा है। ‘वीर योद्धा’ युद्ध-संदर्भ को स्पष्ट रखता है, जबकि केवल ‘प्रतिनिधि योद्धा’ कहना इस शब्द में निहित भूमिका से अधिक विशिष्ट होता।
- source_word: וַיָּנֻסוּ
  choice: वे भाग गए
  rationale: נוס युद्ध में पलायन को बताता है; ‘भाग गए’ आधुनिक सामान्य हिन्दी में सहज है।
