lexical_decisions:
- source_word: וַיִּגַּשׁ
  choice: आगे आकर
  rationale: נגשׁ का मूल अर्थ निकट आना या आगे बढ़ना है; युद्ध की इस परिस्थिति में ‘आगे आकर’ दोनों सेनाओं के सामने उसके बार-बार आने को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַפְּלִשְׁתִּי
  choice: वह पलिश्ती
  rationale: इब्रानी पाठ केवल ‘वह पलिश्ती’ कहता है। यहाँ ‘योद्धा’ या ‘वीर’ जोड़ना निकटवर्ती पदों की सूचना को इस पद में ले आता।
- source_word: הַשְׁכֵּם וְהַעֲרֵב
  choice: हर सुबह और शाम
  rationale: यह युग्म प्रतिदिन सुबह-सवेरे और शाम को होने वाली दोहराई गई क्रिया बताता है। ‘हर’ हिन्दी में इस पुनरावृत्ति को स्पष्ट और सहज बनाता है।
- source_word: וַיִּתְיַצֵּב
  choice: अपना स्थान लेता रहा
  rationale: हित्पएल रूप स्वयं को किसी स्थान पर खड़ा करने या मोर्चा लेने का भाव देता है। ‘अपना स्थान लेता रहा’ आत्मवाची अर्थ और बार-बार की चुनौतीपूर्ण मुद्रा को बनाए रखता है।
- source_word: אַרְבָּעִים יוֹם
  choice: चालीस दिन तक
  rationale: यह पदबंध समयावधि बताता है; हिन्दी में ‘तक’ उस अवधि को स्वाभाविक रूप से व्यक्त करता है।
