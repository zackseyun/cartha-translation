base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/049.yaml
  text: Then David reached his hand into the bag[a], took a stone from there, slung it, and struck the Philistine on his forehead. The stone sank into his forehead[c][b], and he fell on his face to the ground.
translation:
  language: hi
  text: तब दाऊद ने थैले[a] में हाथ डाला, उसमें से एक पत्थर लिया, और उसे गोफन से फेंका और पलिश्ती के माथे पर मारा। पत्थर उसके माथे में धँस गया[b], और वह मुँह के बल भूमि पर गिर पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झोली।” इब्रानी शब्द व्यापक है और यहाँ पत्थर रखने के पात्र को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या, “पत्थर उसके माथे में जा धँसा।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁלַח ... אֶת יָדוֹ אֶל הַכֶּלִי
  choice: थैले में हाथ डाला
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘अपना हाथ पात्र की ओर/में बढ़ाया’ है; प्रसंग में स्वाभाविक हिन्दी ‘थैले में हाथ डाला’ है।
- source_word: הַכֶּלִי
  choice: थैला
  rationale: כְּלִי व्यापक अर्थ वाला शब्द है, पर यहाँ वह दाऊद के पत्थर रखने के पात्र को दर्शाता है। ‘थैला’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: אֶבֶן
  choice: पत्थर
  rationale: यह प्रक्षेप्य के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: וַיְקַלַּע
  choice: उसे गोफन से चलाया
  rationale: क्रिया विशेष रूप से गोफन के प्रयोग को व्यक्त करती है; हिन्दी में उपकरण को स्पष्ट करना स्वाभाविक है।
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי אֶל מִצְחוֹ
  choice: पलिश्ती के माथे पर मारा
  rationale: אֶל यहाँ प्रहार के लक्ष्य-बिंदु को बताता है; ‘माथे पर मारा’ सहज हिन्दी है।
- source_word: וַתִּטְבַּע הָאֶבֶן בְּמִצְחוֹ
  choice: पत्थर उसके माथे में धँस गया
  rationale: טבע डूबने या धँसने का भाव देता है। यह अनुवाद इब्रानी की सजीवता बनाए रखता है और अनावश्यक शारीरिक विवरण नहीं जोड़ता।
- source_word: וַיִּפֹּל עַל פָּנָיו אַרְצָה
  choice: वह मुँह के बल भूमि पर गिर पड़ा
  rationale: यह ‘अपने मुँह के बल धरती की ओर गिरा’ का स्वाभाविक और गरिमापूर्ण हिन्दी रूप है तथा गिरने की मुद्रा को सुरक्षित रखता है।
