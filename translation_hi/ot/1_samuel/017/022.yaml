base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/022.yaml
  text: So David left the supplies with the keeper of the supplies[a], and ran to the battle line[c][b]. When he arrived, he asked his brothers how they were.
translation:
  language: hi
  text: तब दाऊद ने अपना सामान, सामान के रखवाले के पास छोड़ दिया[a] और युद्ध-पंक्ति[b] की ओर दौड़ा। वहाँ पहुँचकर उसने अपने भाइयों का कुशल-क्षेम पूछा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘सामान’ के लिए इब्रानी शब्द כֵּלִים व्यापक है और इसका अर्थ ‘वस्तुएँ’, ‘साज-सामान’ या ‘उपकरण’ भी हो सकता है। यहाँ संभवतः वह सामग्री अभिप्रेत है जिसे दाऊद लेकर आया था।
    reason: lexical_alternative
  - marker: b
    text: या ‘सैनिक पंक्ति’ अथवा ‘व्यूह’; इब्रानी מַעֲרָכָה युद्ध के लिए व्यवस्थित सैनिक गठन को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से, ‘अपने भाइयों से शांति के विषय में पूछा’; यह इब्रानी मुहावरा उनके हालचाल या कुशल-मंगल के विषय में पूछने का अर्थ देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּטֹּשׁ
  choice: छोड़ दिया
  rationale: क्रिया का अर्थ छोड़ना या त्याग देना हो सकता है, पर यहाँ दाऊद सामान को अस्थायी रूप से रखवाले के पास रखता है; इसलिए ‘छोड़ दिया’ प्रसंगानुकूल है और परित्याग का अनावश्यक भाव नहीं लाता।
- source_word: הַכֵּלִים
  choice: सामान
  rationale: כֵּלִים वस्तुओं, पात्रों या साज-सामान के लिए व्यापक शब्द है। ‘सामान’ उसकी व्यापकता बनाए रखता है और हथियारों का भ्रामक संकेत नहीं देता।
- source_word: מֵעָלָיו
  choice: अपना सामान
  rationale: इब्रानी में शाब्दिक भाव ‘उसके ऊपर से’ है, अर्थात वह सामान जिसे दाऊद ढो रहा था। स्वाभाविक हिन्दी में स्वामित्वसूचक ‘अपना’ इस संदर्भ को संक्षेप में व्यक्त करता है।
- source_word: עַל יַד שׁוֹמֵר הַכֵּלִים
  choice: सामान के रखवाले के पास
  rationale: עַל יַד का शाब्दिक रूप ‘हाथ के पास/हाथ में’ है, पर यहाँ आशय किसी की देखरेख में वस्तुएँ छोड़ने से है। आधुनिक हिन्दी में ‘रखवाले के पास’ यही अर्थ सहजता से देता है।
- source_word: וַיָּרָץ
  choice: दौड़ा
  rationale: यह क्रिया सीधे तौर पर दौड़ने को व्यक्त करती है और दाऊद की तत्परता बनाए रखती है।
- source_word: הַמַּעֲרָכָה
  choice: युद्ध-पंक्ति
  rationale: यहाँ शब्द युद्ध के लिए व्यवस्थित सैनिक पंक्ति या व्यूह को सूचित करता है। ‘युद्ध-पंक्ति’ आधुनिक पाठक के लिए स्पष्ट है और केवल सामान्य छावनी का अर्थ नहीं देता।
- source_word: וַיָּבֹא
  choice: वहाँ पहुँचकर
  rationale: इब्रानी कथानक में क्रमशः ‘और वह आया’ है। हिन्दी में ‘वहाँ पहुँचकर’ उसी कालक्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּשְׁאַל לְאֶחָיו לְשָׁלוֹם
  choice: उसने अपने भाइयों का कुशल-क्षेम पूछा
  rationale: ‘शांति के विषय में पूछना’ एक इब्रानी मुहावरा है जिसका अर्थ किसी की भलाई या हालचाल पूछना है। ‘कुशल-क्षेम पूछा’ अर्थ को सटीक और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
