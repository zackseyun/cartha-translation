source:
  edition: WLC
  text: וּ/פְלִשְׁתִּ֞ים עֹמְדִ֤ים אֶל הָ/הָר֙ מִ/זֶּ֔ה וְ/יִשְׂרָאֵ֛ל עֹמְדִ֥ים אֶל הָ/הָ֖ר מִ/זֶּ֑ה וְ/הַ/גַּ֖יְא בֵּינֵי/הֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/003.yaml
  text: The Philistines were standing on the mountain on one side[a], and Israel was standing on the mountain on the other side[b], with the valley between them.
translation:
  language: hi
  text: पलिश्ती एक ओर के पहाड़ पर खड़े थे[a], और इस्राएल दूसरी ओर के पहाड़ पर खड़ा था; उनके बीच घाटी थी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पहाड़’ के स्थान पर ‘पहाड़ी’ भी हो सकता है; इब्रानी הַר प्रसंग के अनुसार दोनों अर्थ दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘घाटी’ के स्थान पर ‘खड्ड’ भी हो सकता है; इब्रानी גַּיְא खड़ी ढलानों वाली घाटी को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּפְלִשְׁתִּים
  choice: पलिश्ती
  rationale: जाति-नाम का प्रचलित हिन्दी रूप रखा गया है। आरम्भिक וּ को अलग से ‘और’ कहना हिन्दी में अनावश्यक रूप से पिछले वाक्य से जोड़ता; यहाँ दृश्य-वर्णन स्वाभाविक रूप से आरम्भ होता है।
- source_word: עֹמְדִים
  choice: खड़े थे / खड़ा था
  rationale: कृदन्त यहाँ चल रही स्थिति का वर्णन करता है। ‘इस्राएल’ सामूहिक एकवचन के रूप में हिन्दी में ‘खड़ा था’ लेता है, जबकि ‘पलिश्ती’ बहुवचन है।
- source_word: אֶל הָהָר מִזֶּה ... אֶל הָהָר מִזֶּה
  choice: एक ओर के पहाड़ पर ... दूसरी ओर के पहाड़ पर
  rationale: עמד के साथ אֶל स्थान-संबंध दर्शाता है; दोनों समानांतर वाक्यांश विरोधी सेनाओं की स्थिति बताते हैं। מִזֶּה ... מִזֶּה को स्वाभाविक हिन्दी में ‘एक ओर ... दूसरी ओर’ कहा गया है।
- source_word: וְיִשְׂרָאֵל
  choice: और इस्राएल
  rationale: मूल पाठ सामूहिक नाम ‘इस्राएल’ कहता है; इसलिए इसे ‘इस्राएली’ में नहीं बदला गया। संयोजक וְ को यहाँ ‘और’ से व्यक्त किया गया है।
- source_word: וְהַגַּיְא בֵּינֵיהֶם
  choice: उनके बीच घाटी थी
  rationale: גַּיְא का सामान्य और सुबोध अर्थ ‘घाटी’ है। हिन्दी में अस्तित्वसूचक ‘थी’ जोड़ने से स्थान-संबंध स्पष्ट और स्वाभाविक बनता है।
