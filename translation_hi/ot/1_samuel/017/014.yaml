lexical_decisions:
- source_word: וְ/דָוִד
  choice: दाऊद
  rationale: आरंभिक ו कथन को पिछले प्रसंग से जोड़ता है; स्वाभाविक हिन्दी में अलग संयोजक आवश्यक नहीं है।
- source_word: הוּא הַ/קָּטָן
  choice: सबसे छोटा था
  rationale: भाइयों के बीच तुलना के प्रसंग में הַקָּטָן का अर्थ सबसे कम आयु वाला, अर्थात ‘सबसे छोटा’, है। स्वतंत्र सर्वनाम הוּא का हल्का बल हिन्दी में नाम और विधेय की सामान्य रचना से पर्याप्त रूप से व्यक्त होता है।
- source_word: וּ/שְׁלֹשָׁה הַ/גְּדֹלִים
  choice: और तीनों बड़े भाई
  rationale: संदर्भ में הַגְּדֹלִים आयु में बड़े भाइयों को दर्शाता है। ‘तीनों’ निश्चित रूप से उल्लिखित तीन व्यक्तियों को स्वाभाविक हिन्दी में व्यक्त करता है; स्पष्टता के लिए ‘भाई’ संदर्भ से पूरित है।
- source_word: הָלְכוּ אַחֲרֵי
  choice: के पीछे चले गए थे
  rationale: यह चयन इब्रानी मुहावरे ‘पीछे जाना’ की छवि बनाए रखता है और यहाँ शाऊल के साथ युद्ध के लिए जाने का भाव देता है। ‘गए थे’ पूर्ववर्ती पृष्ठभूमि-घटना को स्वाभाविक हिन्दी में दर्शाता है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय रूप।
