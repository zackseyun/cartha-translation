  text: दाऊद सबसे छोटा था,[a] और तीनों बड़े भाई शाऊल के पीछे चले गए थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दाऊद सबसे छोटा था, और तीनों बड़े भाई शाऊल के पीछे चले गए।” इब्रानी संयोजक का अनुवाद सामान्य रूप से “और” किया जा सकता है, और क्रिया का अनुवाद पूर्वपूर्ण काल के बिना भी किया जा सकता है।
