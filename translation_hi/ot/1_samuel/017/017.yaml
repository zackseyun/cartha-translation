  text: And Jesse said to David his son[a], “Please take to your brothers this ephah of roasted grain and these ten loaves[b], and run to the camp to your brothers.”
translation:
  language: hi
  text: तब यिशै ने अपने बेटे दाऊद से कहा, “ज़रा अपने भाइयों के लिए यह एक एपा[a] भर भुना हुआ अनाज[b] और ये दस रोटियाँ ले, और छावनी में अपने भाइयों के पास दौड़कर जा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: एपा सूखी वस्तुओं को मापने की एक प्राचीन इकाई थी, जो लगभग 22 लीटर के बराबर थी।
    reason: cultural_note
  - marker: b
    text: या “सेंका हुआ अनाज।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַח נָא
  choice: ले
  rationale: आज्ञार्थक क्रिया के साथ נָא आदेश को कुछ नरम बनाता है। पूरे हिंदी वाक्य में पिता का निर्देश स्वाभाविक और अनावश्यक रूप से कठोर नहीं लगता; ‘कृपया’ यहाँ आधुनिक हिंदी में जरूरत से अधिक औपचारिक होता।
- source_word: לְאַחֶיךָ
  choice: अपने भाइयों के लिए / अपने भाइयों के पास
  rationale: पहले प्रयोग में ל प्राप्तकर्ताओं के हित या उनके लिए ले जाई जाने वाली वस्तुओं को दर्शाता है; अंतिम प्रयोग गंतव्य को। हिंदी में प्रसंगानुसार इन दोनों रूपों से अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: אֵיפַת
  choice: एक एपा भर
  rationale: प्राचीन सूखी वस्तुओं की माप ‘एपा’ को बनाए रखा गया है, जबकि ‘भर’ हिंदी पाठक को बताता है कि यह मात्रा की इकाई है।
- source_word: הַקָּלִיא
  choice: भुना हुआ अनाज
  rationale: यह शब्द आग में भूनकर या सेंककर तैयार किए गए अनाज को दर्शाता है। ‘भुना हुआ अनाज’ आधुनिक हिंदी में स्पष्ट और सहज है।
- source_word: וַעֲשָׂרָה לֶחֶם
  choice: और ये दस रोटियाँ
  rationale: לֶחֶם सामान्यतः रोटी या भोजन के लिए प्रयुक्त हो सकता है; संख्या और यात्रा-भोजन के इस प्रसंग में ‘दस रोटियाँ’ स्वाभाविक हिंदी है।
- source_word: וְהָרֵץ
  choice: और ... दौड़कर जा
  rationale: רוץ का हिफ़ील आज्ञार्थक रूप शीघ्र जाने का सजीव निर्देश देता है। ‘दौड़कर जा’ मूल की तत्परता और चित्रात्मकता बनाए रखता है।
- source_word: הַמַּחֲנֶה
  choice: छावनी
  rationale: सैनिक प्रसंग में מַחֲנֶה के लिए ‘छावनी’ स्पष्ट, संक्षिप्त और स्वाभाविक हिंदी शब्द है।
- source_word: בְּנוֹ
  choice: अपने बेटे
  rationale: यह पद दाऊद की पहचान यिशै के बेटे के रूप में कराता है। हिंदी में संबंधसूचक ‘अपने बेटे दाऊद’ स्वाभाविक है।
