base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/039.yaml
  text: And David strapped his sword over his armor and tried to go[a], for he had not tested them. But David said to Saul, “I cannot go with these[b], for I have not tested them.” So David removed them from himself.
translation:
  language: hi
  text: तब दाऊद ने अपनी तलवार अपने युद्ध-कवच[b] के ऊपर बाँध ली और चलने की कोशिश की[a], क्योंकि उसने उन्हें आज़माया नहीं था। पर दाऊद ने शाऊल से कहा, “मैं इन्हें पहनकर नहीं चल सकता, क्योंकि मैंने इन्हें आज़माया नहीं है।” तब दाऊद ने उन्हें उतार दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चलने का उपक्रम किया”; इब्रानी अभिव्यक्ति किसी काम को हाथ में लेने, उसके लिए तैयार होने या उसे आज़माने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: “युद्ध-कवच” के लिए प्रयुक्त इब्रानी शब्द का व्यापक अर्थ “वस्त्र” या “पोशाक” भी हो सकता है; यहाँ सैनिक प्रसंग युद्ध में पहने जाने वाले कवच-साज की ओर संकेत करता है।
    reason: lexical_alternative
