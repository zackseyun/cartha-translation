- source_word: מֵעַל לְמַדָּיו
  choice: अपने युद्ध-कवच के ऊपर
  rationale: מַדִּים वस्त्र या पहनावे को सूचित कर सकता है, किंतु पिछले पदों का सैनिक प्रसंग यहाँ युद्ध के लिए पहने गए कवच-साज की ओर संकेत करता है।
- source_word: וַיֹּאֶל לָלֶכֶת
  choice: चलने की कोशिश की
  rationale: יאל के साथ infinitive किसी काम को हाथ में लेने, साहस करने या आज़माने का भाव दे सकता है। यहाँ अपरिचित कवच में दाऊद के चलने के प्रयास को यह सहज रूप से व्यक्त करता है।
- source_word: כִּי לֹא נִסָּה
  choice: क्योंकि उसने उन्हें परखकर नहीं देखा था
  rationale: נסה का अर्थ प्रयोग द्वारा जाँचना या आज़माना है। ‘परखकर नहीं देखा था’ अनुभवजन्य परीक्षण का भाव रखता है और ‘अभ्यस्त नहीं था’ जैसी व्याख्या को मुख्य पाठ में नहीं जोड़ता।
- source_word: לֹא אוּכַל לָלֶכֶת בָּאֵלֶּה
  choice: मैं इन सबको पहनकर नहीं चल सकता
  rationale: הלך यहाँ चलने या आगे बढ़ने को और בָּאֵלֶּה पहने हुए सैनिक साज को सूचित करता है। हिंदी में ‘इन सबको पहनकर’ निहित संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: לֹא נִסִּיתִי
  choice: मैंने इन्हें परखकर नहीं देखा है
  rationale: पहले आए נסה का वही मूल अर्थ बनाए रखा गया है; हिंदी में संदर्भित वस्तुओं को स्पष्ट करने के लिए ‘इन्हें’ व्यक्त किया गया है।
- source_word: וַיְסִרֵם ... מֵעָלָיו
  choice: उन्हें उतार दिया
  rationale: हिफ़िल रूप का अर्थ अपने ऊपर से हटाना है। पहने हुए कवच-साज के लिए ‘उतार दिया’ आधुनिक हिंदी में संक्षिप्त और स्वाभाविक है।
