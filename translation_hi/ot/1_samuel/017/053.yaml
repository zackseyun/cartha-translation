lexical_decisions:
- source_word: וַיָּשֻׁבוּ
  choice: लौट आए
  rationale: שׁוב का मूल अर्थ ‘लौटना’ है। कथात्मक संदर्भ में ‘लौट आए’ स्वाभाविक है और पीछा समाप्त करके वापस आने की गति व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ यह पूरे जातीय समुदाय के लोगों का प्रचलित सामूहिक नाम है। आधुनिक हिन्दी में ‘इस्राएली’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: מִדְּלֹק אַחֲרֵי
  choice: पीछा करके
  rationale: דלק और אַחֲרֵי का संयुक्त भाव निकटता से पीछे दौड़ने या पीछा करने का है। ‘पीछा करके लौट आए’ हिन्दी में सहज रूप से बताता है कि वे पीछा करने के बाद वापस आए।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: यह इस जनसमूह के नाम का हिन्दी में प्रचलित बाइबिलीय रूप है।
- source_word: וַיָּשֹׁסּוּ
  choice: लूट लीं
  rationale: שׁסס युद्ध के संदर्भ में लूटने या माल छीन लेने को दर्शाता है। ‘लूट लीं’ वर्तमान हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מַחֲנֵיהֶם
  choice: उनकी छावनियाँ
  rationale: रूप बहुवचन है और उस पर तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय है; इसलिए ‘उनकी छावनियाँ’ स्रोत की संख्या और संबंध दोनों को सुरक्षित रखता है।
