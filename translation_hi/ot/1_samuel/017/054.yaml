base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/054.yaml
  text: David took the head of the Philistine and brought it to Jerusalem[b][a], and he put his weapons in his tent.
translation:
  language: hi
  text: दाऊद उस पलिश्ती का सिर यरूशलेम ले आया[b], और उसके हथियार[a] अपने तंबू में रख दिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसकी युद्ध-सामग्री” अथवा “उसका साज-सामान”; हिब्रू शब्द व्यापक है और इसमें हथियार, कवच तथा अन्य सैनिक वस्तुएँ शामिल हो सकती हैं।
    reason: lexical_alternative
  - marker: b
    text: व्यापक कथा के इस चरण में यरूशलेम अभी पूरी तरह इस्राएल के अधिकार में नहीं था, इसलिए कुछ पाठकों को यहाँ कालक्रम संबंधी तनाव दिखाई देता है। अनुवाद इस तनाव का सामंजस्य बैठाने के बजाय हिब्रू कथन को यथावत रखता है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लेकर
  rationale: לקח का सामान्य कथात्मक अर्थ यहाँ ‘लेना’ है; अगले क्रियापद के साथ हिंदी में ‘लेकर ... आया’ स्वाभाविक और सटीक है।
- source_word: רֹאשׁ
  choice: सिर
  rationale: गोलियत की मृत्यु के बाद यहाँ शरीर के अंग का सीधा अर्थ अभिप्रेत है।
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: यह जातिवाचक संज्ञा गोलियत के लिए प्रयुक्त हुई है; ‘उस’ पूर्वोक्त व्यक्ति की ओर स्वाभाविक संकेत करता है।
- source_word: וַיְבִאֵהוּ
  choice: आया
  rationale: हिब्रू में क्रिया का अर्थ ‘ले आया/पहुँचाया’ है और पुल्लिंग प्रत्यय ‘सिर’ की ओर संकेत करता है; संयुक्त हिंदी रचना ‘सिर लेकर ... आया’ इसी अर्थ को व्यक्त करती है।
- source_word: יְרוּשָׁלִָם
  choice: यरूशलेम
  rationale: स्थान-नाम का प्रचलित मानक हिंदी रूप।
- source_word: כֵּלָיו
  choice: उसके हथियार
  rationale: כְּלִי व्यापक शब्द है, जिसका अर्थ औज़ार, सामान, अस्त्र या युद्ध-सामग्री हो सकता है; युद्ध के प्रसंग में ‘हथियार’ संक्षिप्त और स्वाभाविक है, जबकि पादटिप्पणी व्यापकता स्पष्ट करती है।
- source_word: שָׂם
  choice: रख दिए
  rationale: שׂים रखने या स्थापित करने की सामान्य क्रिया है; बहुवचन ‘हथियार’ के साथ ‘रख दिए’ स्वाभाविक आधुनिक हिंदी है।
- source_word: בְּאָהֳלוֹ
  choice: अपने तंबू में
  rationale: אָהֶל का सामान्य अर्थ ‘तंबू’ है। हिंदी का ‘अपने’ कर्ता दाऊद को तंबू का स्वामी बताता है, जो संदर्भगत रूप से सबसे स्वाभाविक समझ है।
theological_decisions:
- issue: अंतिम खंड में संबंधसूचक प्रत्ययों के संदर्भ
  choice: हथियार पलिश्ती के हैं और तंबू दाऊद का है।
  alternative: दोनों संबंधसूचक रूप दाऊद से जुड़े हों; अथवा तंबू किसी सामुदायिक या सैनिक तंबू को सूचित करे।
  rationale: निकटवर्ती प्रसंग में दाऊद गोलियत की युद्ध-सामग्री विजय-चिह्न के रूप में लेता है। इसलिए ‘उसके हथियार’ का संदर्भ पलिश्ती और ‘अपने तंबू’ का संदर्भ दाऊद समझना सबसे स्वाभाविक है; यह संदर्भगत निर्णय है, doctrinal harmonization नहीं।
- issue: यरूशलेम संबंधी संभावित कालक्रमिक तनाव
  choice: ‘यरूशलेम आया’ को हिब्रू के अनुसार सीधे रखा गया है।
  alternative: ‘बाद में यरूशलेम ले आया’ या ‘यरूशलेम की ओर ले गया’ कहकर तनाव सुलझाना।
  rationale: हिब्रू पाठ घटना को सीधे कहता है। अनुवाद व्यापक कथा में दिखाई देने वाले कालक्रमिक प्रश्न को व्याख्यात्मक जोड़ द्वारा नहीं सुलझाता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण कथात्मक शैली। ‘लेकर ... आया’ हिंदी की स्वाभाविक संयुक्त क्रिया है। ‘उसके’ और ‘अपने’ का भेद अलग-अलग संदर्भों को स्पष्ट करता है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
