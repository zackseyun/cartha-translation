lexical_decisions:
- source_word: מִצְחַת
  choice: पिंडली-कवच
  rationale: यह शब्द टाँग के निचले भाग की रक्षा करने वाले कवच को दर्शाता है। ‘पिंडली-कवच’ आधुनिक हिन्दी में सटीक और सहज रूप से समझ आने वाला पद है।
- source_word: נְחֹשֶׁת
  choice: काँसा
  rationale: प्राचीन सैन्य सन्दर्भ में यह शब्द सामान्यतः हथियारों और कवच में प्रयुक्त काँसे को दर्शाता है; ‘पीतल’ काल-विसंगत होगा और ‘ताँबा’ यहाँ कम सम्भावित है।
- source_word: עַל רַגְלָיו
  choice: उसकी टाँगों पर
  rationale: רֶגֶל का अर्थ पैर या टाँग हो सकता है, पर पिंडली-कवच के सन्दर्भ में टाँगें अभिप्रेत हैं।
- source_word: כִידוֹן
  choice: बर्छा
  rationale: यह किसी हलके भाले या भाले-जैसे हथियार को सूचित कर सकता है। ‘बर्छा’ बड़े भाले से सम्भावित भेद बनाए रखता है, जबकि अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: בֵּין כְּתֵפָיו
  choice: उसके दोनों कंधों के बीच
  rationale: यह इब्रानी वाक्यांश का निकट और स्वाभाविक हिन्दी रूप है। स्रोत में स्पष्ट न होने के कारण ‘पीठ पर लटका हुआ’ जैसी व्याख्या नहीं जोड़ी गई।
