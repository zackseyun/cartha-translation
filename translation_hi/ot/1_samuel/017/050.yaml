base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/050.yaml
  text: So David prevailed over the Philistine with a sling and with a stone; he struck the Philistine and killed him[a], though there was no sword in David’s hand.
translation:
  language: hi
  text: इस प्रकार दाऊद ने गोफन और एक पत्थर से उस पलिश्ती पर विजय पाई; उसने पलिश्ती को मारा और उसे मार डाला, यद्यपि दाऊद के हाथ में तलवार नहीं थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दाऊद के हाथ में तलवार नहीं थी।” इब्रानी संयोजक का अधिक औपचारिक अनुवाद साधारण “और” हो सकता है; मुख्य पाठ में प्रसंग के रियायती भाव को प्रकट करने के लिए “यद्यपि” रखा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֶּחֱזַק דָּוִד מִן הַפְּלִשְׁתִּי
  choice: दाऊद ने ... उस पलिश्ती पर विजय पाई
  rationale: חזק के साथ מן यहाँ प्रतिद्वंद्वी से अधिक शक्तिशाली सिद्ध होने या उस पर प्रबल होने का भाव देता है; आधुनिक हिन्दी में ‘पर विजय पाई’ युद्ध-संदर्भ में स्वाभाविक है।
- source_word: בַּקֶּלַע וּבָאֶבֶן
  choice: गोफन और एक पत्थर से
  rationale: ב साधन सूचित करता है। אֶבֶן एकवचन है, इसलिए ‘एक पत्थर’ रखा गया है।
- source_word: וַיַּךְ אֶת הַפְּלִשְׁתִּי
  choice: उसने पलिश्ती को मारा
  rationale: נכה का सामान्य अर्थ प्रहार करना या मारना है; ‘मारा’ सरल आधुनिक हिन्दी है और अगले क्रियापद ‘मार डाला’ से परिणाम का भेद बनाए रखता है।
- source_word: וַיְמִיתֵהוּ
  choice: और उसे मार डाला
  rationale: מות के हिफ़ील रूप का अर्थ मृत्यु का कारण बनना, अर्थात मार डालना, है।
- source_word: וְחֶרֶב אֵין בְּיַד דָּוִד
  choice: यद्यपि दाऊद के हाथ में तलवार नहीं थी
  rationale: वाक्यांश परिस्थितिजन्य और प्रसंग में रियायती भाव रखता है; ‘यद्यपि’ बिना तलवार के हुई विजय की विस्मयकारी परिस्थिति को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘हाथ में’ मूल बिंब बचाता है।
