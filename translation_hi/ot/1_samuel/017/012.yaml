base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/012.yaml
  text: David was the son of an Ephrathite from Bethlehem of Judah[a], whose name was Jesse, and he had eight sons. In the days of Saul, the man was old, advanced in years.
translation:
  language: hi
  text: दाऊद यहूदा के बेतलेहेम के एक एप्राती व्यक्ति का पुत्र था, जिसका नाम यिशै था और जिसके आठ पुत्र थे। शाऊल के दिनों में वह व्यक्ति बूढ़ा और बहुत वृद्ध था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अधिक शाब्दिक रूप है, “बूढ़ा, मनुष्यों के बीच आ चुका था।” हिब्रू अभिव्यक्ति असामान्य है और यहाँ बहुत अधिक आयु का होना बताती है।
    reason: lexical_alternative
