source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר הַ/פְּלִשְׁתִּי֙ אֶל דָּוִ֔ד הֲ/כֶ֣לֶב אָנֹ֔כִי כִּֽי אַתָּ֥ה בָֽא אֵלַ֖/י בַּ/מַּקְל֑וֹת וַ/יְקַלֵּ֧ל הַ/פְּלִשְׁתִּ֛י אֶת דָּוִ֖ד בֵּ/אלֹהָֽי/ו־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/043.yaml
  text: And the Philistine said to David[a], “Am I a dog[b], that you come to me with sticks?” And the Philistine cursed David by his gods.
translation:
  language: hi
  text: तब पलिश्ती ने दाऊद से कहा, “क्या मैं कुत्ता हूँ कि तू लाठियाँ लेकर मेरे पास आ रहा है?” और पलिश्ती ने अपने देवताओं के नाम से दाऊद को शाप दिया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: पलिश्ती
  rationale: यह संज्ञा गोलियत की जातीय पहचान बताती है। केवल ‘पलिश्ती’ कहना कथानक के अनुरूप है; ‘योद्धा’ जोड़ना मूल पाठ से अतिरिक्त होगा।
- source_word: הֲכֶלֶב אָנֹכִי
  choice: क्या मैं कुत्ता हूँ
  rationale: यह अपमान और रोष व्यक्त करने वाला आलंकारिक प्रश्न है। सांस्कृतिक और कथात्मक बिंब बनाए रखने के लिए ‘कुत्ता’ का शाब्दिक अनुवाद रखा गया है।
- source_word: כִּי
  choice: कि
  rationale: यहाँ כִּי आलंकारिक प्रश्न के आधार अथवा आशय को प्रस्तुत करता है; हिन्दी में ‘कि’ स्वाभाविक संयोजक है।
- source_word: בָא אֵלַי
  choice: तू ... मेरे पास आ रहा है
  rationale: कृदंत वर्तमान में चल रही क्रिया की तात्कालिकता व्यक्त करता है। सीधे संबोधन में ‘तू’ पलिश्ती की अवमाननापूर्ण वाणी के अनुकूल है।
- source_word: בַּמַּקְלוֹת
  choice: लाठियाँ लेकर
  rationale: מַקֵּל छड़ी, लाठी या डंडे को सूचित कर सकता है। बहुवचन और पलिश्ती की तिरस्कारपूर्ण अतिशयोक्ति को बनाए रखते हुए ‘लाठियाँ’ सहज हिन्दी है।
- source_word: וַיְקַלֵּל
  choice: शाप दिया
  rationale: इस प्रसंग में קלל केवल निंदा नहीं, देवताओं का आह्वान करके शाप देना बताता है; इसलिए धार्मिक अर्थ सुरक्षित रखा गया है।
- source_word: בֵּאלֹהָיו
  choice: अपने देवताओं के नाम से
  rationale: בְּ को यहाँ उस सत्ता के आह्वान के रूप में समझा गया है जिसके द्वारा शाप दिया जाता है। ‘अपने देवताओं के नाम से’ हिन्दी में इस आशय को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: पलिश्ती प्रसंग में 3ms प्रत्यय सहित אֱלֹהִים का वचन
  choice: अपने देवताओं
  alternative: अपने देवता
  rationale: אֱלֹהִים कभी एकवचन अर्थ दे सकता है, पर इस गैर-इस्राएली प्रसंग में बहुवचन स्वाभाविक है और पलिश्ती धार्मिक परिवेश के अनुरूप है। फिर भी व्याकरणतः एकवचन की संभावना पूर्णतः असंभव नहीं है।
translation_notes:
  register: भाषा आधुनिक, कथात्मक और गरिमापूर्ण रखी गई है। पलिश्ती के तिरस्कार को दिखाने के लिए संबोधन में ‘तू’ और बहुवचन ‘लाठियाँ’ रखा गया है। पद में कोई पाद-टिप्पणी आवश्यक नहीं मानी गई।
