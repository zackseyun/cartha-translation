source:
  edition: WLC
  text: גַּ֧ם אֶֽת הָ/אֲרִ֛י גַּם הַ/דּ֖וֹב הִכָּ֣ה עַבְדֶּ֑/ךָ וְֽ֠/הָיָה הַ/פְּלִשְׁתִּ֨י הֶ/עָרֵ֤ל הַ/זֶּה֙ כְּ/אַחַ֣ד מֵ/הֶ֔ם כִּ֣י חֵרֵ֔ף מַעַרְכֹ֖ת אֱלֹהִ֥ים חַיִּֽים־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/036.yaml
  text: Your servant struck down both the lion and the bear[a], and this uncircumcised Philistine will be like one of them, because he has defied the battle lines of the living God.
translation:
  language: hi
  text: तेरे सेवक ने सिंह और भालू दोनों को मार गिराया है; और यह खतनारहित पलिश्ती भी उनमें से एक के समान हो जाएगा, क्योंकि उसने जीवित परमेश्वर की युद्ध-पंक्तियों[a] को ललकारा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जीवित परमेश्वर की सेनाओं।” इब्रानी शब्द का अर्थ “युद्ध-पंक्तियाँ,” “पांतें,” अथवा विस्तार से “सेनाएँ” हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִכָּה
  choice: मार गिराया
  rationale: नכה का मूल भाव प्रहार करने और परास्त कर गिराने का है। प्रसंग में हिंसक पशुओं का घातक पराभव निहित है; ‘मार गिराया’ इसे स्वाभाविक हिन्दी में व्यक्त करता है, पर केवल ‘हत्या की’ जितना संकीर्ण नहीं बनाता।
- source_word: עַבְדֶּךָ
  choice: तेरे दास
  rationale: शाऊल को संबोधित करते समय यह विनम्र आत्म-संदर्भ है। ‘दास’ दरबारी और बाइबिलीय गरिमा बनाए रखता है।
- source_word: הָאֲרִי ... הַדּוֹב
  choice: सिंह और भालू दोनों
  rationale: दोनों संज्ञाएँ निश्चित हैं और גם...גם का अर्थ ‘दोनों’ है। यह दाऊद द्वारा सामना किए गए दोनों पशुओं को स्पष्ट रूप से दर्शाता है।
- source_word: וְהָיָה
  choice: हो जाएगा
  rationale: संदर्भ में यह भविष्य के परिणाम के विषय में दाऊद का दृढ़ कथन है। ‘हो जाएगा’ हिन्दी में स्वाभाविक रूप से भावी परिणति व्यक्त करता है।
- source_word: הֶעָרֵל
  choice: खतनारहित
  rationale: यह शब्द शारीरिक वाचा-चिह्न के अभाव को सीधे व्यक्त करता है। इसे रूपकात्मक व्याख्या में बदलने के बजाय मूल अपमान और वाचागत बल सुरक्षित रखा गया है।
- source_word: כְּאַחַד מֵהֶם
  choice: उनमें से एक के समान
  rationale: यह पलिश्ती के परिणाम की तुलना सिंह और भालू में से किसी एक के परिणाम से करता है और इब्रानी के एकवचन-वितरणात्मक रूप को बनाए रखता है।
- source_word: חֵרֵף
  choice: ललकारा
  rationale: חרף में निंदा, ताना और उद्दंड चुनौती का भाव हो सकता है। सैन्य प्रसंग में ‘ललकारा’ विरोधपूर्ण अवज्ञा को सहज हिन्दी में व्यक्त करता है।
- source_word: מַעַרְכֹת
  choice: युद्ध-पंक्तियों
  rationale: מערכות युद्ध-विन्यास, पंक्तियों या सेनाओं को सूचित कर सकता है। ‘युद्ध-पंक्तियाँ’ मूल की ठोस सैन्य छवि और बहुवचन को बनाए रखती हैं।
- source_word: אֱלֹהִים חַיִּים
  choice: जीवित परमेश्वर
  rationale: यह स्थापित इब्रानी अभिव्यक्ति परमेश्वर की जीवित वास्तविकता पर बल देती है। अर्थ की दृष्टि से यहाँ ‘परमेश्वर’ एकवचन है।
theological_decisions:
- issue: गोलियत के लिए ‘खतनारहित’ शब्द का वाचागत बल
  choice: मुख्य पाठ में शाब्दिक ‘खतनारहित’ रखा गया
  alternative: वाचा से बाहर; भक्तिहीन पलिश्ती
  rationale: मूल पाठ शारीरिक वाचा-चिह्न को धार्मिक अपमान के रूप में उपयोग करता है। शाब्दिक रूप इस तनाव को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- issue: מַעַרְכֹת का परमेश्वर के संबंध में अर्थ
  choice: युद्ध-पंक्तियाँ
  alternative: जीवित परमेश्वर की सेनाएँ; जीवित परमेश्वर की पांतें
  rationale: यह पद सम्भवतः इस्राएल के युद्ध-विन्यास को जीवित परमेश्वर से संबंधित बताता है। ‘युद्ध-पंक्तियाँ’ इब्रानी की सैन्य छवि को सुरक्षित रखता है, जबकि ‘सेनाएँ’ भी सम्भव अर्थ है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, मौखिक कथन के अनुकूल शैली अपनाई गई है। शाऊल के प्रति दाऊद के विनम्र संबोधन के कारण ‘तेरे दास’ रखा गया है; सैन्य शब्दावली स्पष्ट किंतु अत्यधिक तकनीकी नहीं है।
