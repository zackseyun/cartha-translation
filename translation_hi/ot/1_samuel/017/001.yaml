  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּאַסְפ֨וּ פְלִשְׁתִּ֤ים אֶת מַֽחֲנֵי/הֶם֙ לַ/מִּלְחָמָ֔ה וַ/יֵּאָ֣סְפ֔וּ שֹׂכֹ֖ה אֲשֶׁ֣ר לִ/יהוּדָ֑ה וַֽ/יַּחֲנ֛וּ בֵּין שׂוֹכֹ֥ה וּ/בֵין עֲזֵקָ֖ה בְּ/אֶ֥פֶס דַּמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/001.yaml
  text: The Philistines gathered their armies for battle[a], and they assembled at Socoh, which belongs to Judah, and camped between Socoh and Azekah[b], at Ephes-dammim.
translation:
  language: hi
  text: पलिश्तियों ने युद्ध के लिए अपनी सेनाएँ[a] इकट्ठी कीं। वे यहूदा के सोको[b] में इकट्ठे हुए और सोको तथा अजेका के बीच, एफेस-दम्मीम में डेरा डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अपनी छावनियाँ’; इब्रानी शब्द सैनिक छावनियों या सेनाओं, दोनों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: सोको यहूदा के भूभाग का एक नगर था।
    reason: cultural_note
lexical_decisions:
- source_word: וַיַּאַסְפוּ
  choice: इकट्ठी कीं
  rationale: אָסַף का कथात्मक रूप यहाँ एकत्र करने का भाव देता है। यह आधुनिक हिन्दी में स्वाभाविक है और सेनाओं को युद्ध के लिए जुटाने के अर्थ के अनुकूल है।
- source_word: פְלִשְׁתִּים
  choice: पलिश्तियों
  rationale: इस प्राचीन जाति के लिए प्रचलित हिन्दी नाम का प्रयोग किया गया है।
- source_word: מַחֲנֵיהֶם
  choice: अपनी सेनाएँ
  rationale: מַחֲנֶה का अर्थ छावनी या सैन्य दल/सेना हो सकता है। युद्ध के लिए उन्हें इकट्ठा करने के प्रसंग में ‘सेनाएँ’ सहज है; मूल की अर्थ-व्याप्ति फुटनोट में सुरक्षित रखी गई है।
- source_word: לַמִּלְחָמָה
  choice: युद्ध के लिए
  rationale: מִלְחָמָה युद्ध या लड़ाई को दर्शाता है; यहाँ सैनिक जुटाव के उद्देश्य को स्पष्ट और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: וַיֵּאָסְפוּ
  choice: वे ... इकट्ठे हुए
  rationale: दूसरा אָסַף अकर्मक/निष्क्रिय रूप में लोगों के किसी स्थान पर एकत्र होने को व्यक्त करता है।
- source_word: שֹׂכֹה
  choice: सोको
  rationale: स्थान-नाम का सरल हिन्दी लिप्यंतरण, पूरे पद में एकरूप रखा गया है।
- source_word: אֲשֶׁר לִיהוּדָה
  choice: यहूदा के सोको
  rationale: लामेद का संबंध/अधिकारसूचक भाव यहाँ यहूदा के भूभाग से सोको के संबंध को संक्षेप और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: חנה के लिए यह वर्तमान हिन्दी का स्वाभाविक मुहावरा है और शिविर लगाने का अर्थ स्पष्ट करता है।
- source_word: בֵּין ... וּבֵין
  choice: के बीच
  rationale: दो स्थानों के मध्य की स्थिति को सीधे व्यक्त करता है।
- source_word: עֲזֵקָה
  choice: अजेका
  rationale: स्थान-नाम का सुबोध हिन्दी लिप्यंतरण।
- source_word: בְּאֶפֶס דַּמִּים
  choice: एफेस-दम्मीम में
  rationale: इसे अनूदित अर्थ के बजाय स्थान-नाम माना गया है; ‘में’ शिविर के स्थान को स्वाभाविक हिन्दी में बताता है।
