  text: וּ/כְ/שׁ֣וּב דָּוִ֗ד מֵֽ/הַכּוֹת֙ אֶת הַ/פְּלִשְׁתִּ֔י וַ/יִּקַּ֤ח אֹת/וֹ֙ אַבְנֵ֔ר וַ/יְבִאֵ֖/הוּ לִ/פְנֵ֣י שָׁא֑וּל וְ/רֹ֥אשׁ הַ/פְּלִשְׁתִּ֖י בְּ/יָדֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/057.yaml
  text: When David returned from striking down the Philistine[a], Abner took him and brought him before Saul, with the Philistine’s head in his hand.
translation:
  language: hi
  text: जब दाऊद उस पलिश्ती को मारकर लौटा, तब अब्नेर उसे लेकर शाऊल के सामने लाया; और पलिश्ती का सिर उसके हाथ में था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּכְשׁוּב
  choice: जब ... लौटा
  rationale: וְ के साथ שוב का infinitive construct समयसूचक उपवाक्य बनाता है। ‘जब ... लौटा’ आधुनिक हिन्दी में स्वाभाविक है और घटनाक्रम को स्पष्ट रखता है।
- source_word: מֵהַכּוֹת
  choice: मारकर
  rationale: נכה का मूल अर्थ ‘मारना/प्रहार करना’ है और इस प्रसंग में प्राणघातक रूप से मार गिराना अभिप्रेत है। ‘मारकर’ संक्षिप्त, स्वाभाविक और प्रसंगानुकूल है।
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: इब्रानी में व्यक्तिवाचक नाम के बजाय ‘पलिश्ती’ है। हिन्दी में पहले से उल्लिखित व्यक्ति को इंगित करने के लिए ‘उस’ जोड़ा गया है, बिना ‘गोलियत’ नाम प्रतिस्थापित किए।
- source_word: וַיִּקַּח אֹתוֹ
  choice: अब्नेर उसे लेकर
  rationale: לקח का सीधा अर्थ ‘लेना’ है। ‘उसे लेकर’ अगले क्रियापद ‘लाया’ के साथ स्वाभाविक हिन्दी क्रम बनाता है और अनावश्यक बलप्रयोग का भाव नहीं जोड़ता।
- source_word: וַיְבִאֵהוּ לִפְנֵי שָׁאוּל
  choice: शाऊल के सामने लाया
  rationale: בוא का हिफ़ील रूप ‘लाना’ और לִפְנֵי यहाँ ‘के सामने’ है। यह स्रोत के निकट तथा सामान्य हिन्दी में स्पष्ट है।
- source_word: וְרֹאשׁ הַפְּלִשְׁתִּי בְּיָדוֹ
  choice: और पलिश्ती का सिर उसके हाथ में था
  rationale: इब्रानी का यह क्रियारहित समन्वित उपवाक्य हिन्दी में ‘था’ के साथ स्वाभाविक रूप से व्यक्त होता है। ‘उसके’ का निकटतम और प्रसंगगत संदर्भ दाऊद है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। इब्रानी के अंतिम क्रियारहित उपवाक्य को औपचारिक समन्वित वाक्य के रूप में रखा गया है; इसलिए वैकल्पिक परिस्थितिसूचक अनुवाद हेतु पादटिप्पणी आवश्यक नहीं समझी गई।
