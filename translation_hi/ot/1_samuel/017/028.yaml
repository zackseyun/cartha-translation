translation_notes:
  register: आधुनिक मानक हिन्दी, अनौपचारिक पारिवारिक संबोधन ‘तू’ के साथ, जो बड़े भाई की झिड़की और हिब्रू के एकवचन संबोधन को स्वाभाविक रूप से दर्शाता है। वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है।
