source:
  edition: WLC
  text: וַ/יִּשְׁמַ֤ע אֱלִיאָב֙ אָחִ֣י/ו הַ/גָּד֔וֹל בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים וַ/יִּֽחַר אַף֩ אֱלִיאָ֨ב בְּ/דָוִ֜ד וַ/יֹּ֣אמֶר לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ וְ/עַל מִ֨י נָטַ֜שְׁתָּ מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙ בַּ/מִּדְבָּ֔ר אֲנִ֧י יָדַ֣עְתִּי אֶת זְדֹנְ/ךָ֗ וְ/אֵת֙ רֹ֣עַ לְבָבֶ֔/ךָ כִּ֗י לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה יָרָֽדְתָּ־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/028.yaml
  text: Eliab his oldest brother heard him speaking to the men[a], and Eliab’s anger burned against David, and he said, “Why have you come down here? And with whom have you left those few sheep in the wilderness? I know your presumption and the evil of your heart[b], for you have come down to see the battle.”
translation:
  language: hi
  text: जब दाविद पुरुषों से बात कर रहा था, तब उसके सबसे बड़े भाई एलीआब ने उसकी बात सुनी। एलीआब का क्रोध दाविद पर भड़क उठा और उसने कहा, “तू यहाँ क्यों उतर आया है? और जंगल में उन थोड़ी-सी भेड़ों को किसके भरोसे छोड़ आया है? मैं तेरे घमंड[a] और तेरे मन की बुराई[b] को जानता हूँ। तू तो लड़ाई देखने के लिए यहाँ उतर आया है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तेरी धृष्टता” अथवा “तेरा अहंकार”।
    reason: lexical_alternative
  - marker: b
    text: या “तेरे हृदय की दुष्टता”।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּ/דַבְּר֖/וֹ אֶל הָ/אֲנָשִׁ֑ים
  choice: जब दाविद पुरुषों से बात कर रहा था
  rationale: בְּ के साथ infinitive construct परिस्थिति या समय का भाव देता है। हिन्दी में कर्ता को स्पष्ट करके यह रूप स्वाभाविक है; הָאֲנָשִׁים का सामान्य अर्थ ‘पुरुष’ रखा गया है, ‘सैनिक’ नहीं जोड़ा गया।
- source_word: וַ/יִּֽחַר אַף
  choice: क्रोध ... भड़क उठा
  rationale: हिब्रू के जलते हुए क्रोध के सजीव मुहावरे को वर्तमान हिन्दी में स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לָ/מָּה זֶּ֣ה יָרַ֗דְתָּ
  choice: तू यहाँ क्यों उतर आया है?
  rationale: ירד का ‘उतरना’ अर्थ और זֶה की प्रसंगगत संकेतात्मक शक्ति ‘यहाँ’ से व्यक्त होती है। एलीआब के स्थान की ओर आने के कारण ‘उतर आया’ उपयुक्त है।
- source_word: וְ/עַל מִ֨י נָטַ֜שְׁתָּ
  choice: किसके भरोसे छोड़ आया है?
  rationale: נטשׁ का मूल भाव ‘छोड़ना’ है। ‘किसके भरोसे’ पशुओं की देखरेख के व्यावहारिक संदर्भ को स्वाभाविक हिन्दी में व्यक्त करता है, बिना पूर्ण परित्याग का अर्थ थोपे।
- source_word: מְעַ֨ט הַ/צֹּ֤אן הָ/הֵ֨נָּה֙
  choice: उन थोड़ी-सी भेड़ों
  rationale: מְעַט संख्या की अल्पता और הָהֵנָּה स्त्रीलिंग बहुवचन संकेत को व्यक्त करते हैं; यह शब्दावली एलीआब का तिरस्कारपूर्ण लहजा भी बनाए रखती है।
- source_word: בַּ/מִּדְבָּ֔ר
  choice: जंगल में
  rationale: מִדְבָּר निर्जन अथवा असंस्कृत चरागाही प्रदेश हो सकता है। सामान्य हिन्दी बाइबलीय प्रयोग में ‘जंगल’ पठनीय है और यहाँ घने वन का अर्थ आवश्यक नहीं बनाता।
- source_word: זְדֹנְ/ךָ֗
  choice: तेरे घमंड
  rationale: זָדוֹן में घमंड, उद्दंडता और धृष्टता का अर्थक्षेत्र है। ‘घमंड’ साधारण आधुनिक हिन्दी में स्पष्ट है; वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: רֹ֣עַ לְבָבֶ֔/ךָ
  choice: तेरे मन की बुराई
  rationale: לֵבָב भीतरी व्यक्ति, मन या हृदय को सूचित करता है और רֹעַ नैतिक बुराई को। ‘मन की बुराई’ सहज हिन्दी है और आरोप की नैतिक तीव्रता बनाए रखता है।
- source_word: לְמַ֛עַן רְא֥וֹת הַ/מִּלְחָמָ֖ה
  choice: लड़ाई देखने के लिए ही
  rationale: לְמַעַן उद्देश्य प्रकट करता है और מִלְחָמָה इस प्रसंग में वर्तमान युद्ध-संघर्ष या लड़ाई है। ‘ही’ एलीआब के आरोप में निहित एकमात्र उद्देश्य के बल को हिन्दी में व्यक्त करता है।
