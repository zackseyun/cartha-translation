  text: The people told him the same thing, saying, “This is what will be done for the man who strikes him down.”
translation:
  language: hi
  text: लोगों ने उसे वही बात बताई। उन्होंने कहा, “जो आदमी उसे मार गिराएगा, उसके लिए यही किया जाएगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כַּדָּבָר הַזֶּה
  choice: वही बात
  rationale: यह पद पिछले पद में बताए गए पुरस्कार की ओर संकेत करता है; आधुनिक हिन्दी में ‘वही बात’ इस संदर्भ-संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יַכֶּנּוּ
  choice: उसे मार गिराएगा
  rationale: נכה का अर्थ प्रहार करना हो सकता है, पर इस युद्ध-संदर्भ में गोलियत को परास्त करके मार डालना अभिप्रेत है; ‘मार गिराना’ इस अर्थ को सहज और सटीक रूप से रखता है।
- source_word: כֹּה יֵעָשֶׂה לָאִישׁ
  choice: उसके लिए यही किया जाएगा
  rationale: हिब्रू के अव्यक्त कर्मवाच्य को बनाए रखते हुए पुरस्कार दिए जाने का संकेत सुरक्षित रखा गया है।
