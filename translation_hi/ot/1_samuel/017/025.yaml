translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु बोलचाल में बोधगम्य रूप। सैनिकों के आपसी कथन के लिए ‘कह रहे थे’ और ‘तुमने’ स्वाभाविक हैं। मूल की पुनरुक्ति ‘चढ़कर आ रहा है’ दोनों स्थानों पर तथा ‘धन से धनी’ में जानबूझकर रखी गई है। प्रशासनिक ‘मुक्त’ का सम्भावित आशय मुख्य पाठ में स्पष्ट किया गया है, इसलिए पादटिप्पणी आवश्यक नहीं रखी गई।
