base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/025.yaml
  text: And the men of Israel said[a], “Have you seen this man who is coming up? Surely he is coming up to defy Israel. And it shall be that the man who strikes him down, the king will enrich him with great riches, and will give him his daughter, and will make his father’s house free in Israel.”
translation:
  language: hi
  text: इस्राएल के लोग कह रहे थे, “क्या तुमने इस आदमी को देखा है, जो चढ़कर आ रहा है? वह तो इस्राएल को ललकारने के लिए ही चढ़कर आ रहा है। जो आदमी उसे मार गिराएगा, राजा उसे बहुत धन देकर धनी करेगा, अपनी बेटी उससे ब्याह देगा और इस्राएल में उसके पिता के घराने को स्वतंत्र[a] कर देगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके पिता के घराने को छूट देगा”; सम्भवतः करों या राजकीय सेवा के दायित्वों से छूट का अर्थ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ יִשְׂרָאֵל
  choice: इस्राएल के लोग
  rationale: रूप की दृष्टि से पद एकवचन है, पर प्रसंग में सामूहिक या प्रतिनिधिक अर्थ रखता है; हिन्दी बहुवचन संवाद की स्थिति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַרְּאִיתֶם
  choice: क्या तुमने ... देखा है
  rationale: द्वितीय पुरुष पुल्लिंग बहुवचन पूर्ण रूप प्रश्नवाचक है; यह अनुवाद तत्काल चल रही बातचीत के अनुकूल है।
- source_word: הָאִישׁ הָעֹלֶה הַזֶּה
  choice: इस आदमी को ... जो चढ़कर आ रहा है
  rationale: कृदन्त עֹלֶה जारी गति को दर्शाता है; युद्ध-भूमि के प्रसंग में ‘चढ़कर आना’ मूल स्थानिक बिंब बचाता है।
- source_word: כִּי
  choice: देखो
  rationale: यहाँ כִּי कथन पर बल देते हुए व्याख्या आरम्भ करता है; ‘देखो’ हिन्दी में उस emphatic discourse force को सहज रूप देता है, न कि कठोर कारणसूचक अर्थ।
- source_word: לְחָרֵף
  choice: ललकारने के लिए
  rationale: חרף में अपमानपूर्ण चुनौती और तिरस्कार दोनों निहित हैं; इस युद्ध-प्रसंग में ‘ललकारना’ सार्वजनिक शत्रुतापूर्ण चुनौती को स्पष्ट करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएल
  rationale: मूल पाठ में केवल इस्राएल है; ‘इस्राएल की सेना’ जोड़ना आसपास के पदों की भाषा को इस पद में लाना होता।
- source_word: יַכֶּנּוּ
  choice: इसे मार गिराएगा
  rationale: נכה का अर्थ प्रहार करना, धराशायी करना या प्रसंगानुसार मार डालना हो सकता है; ‘मार गिराना’ निर्णायक पराजय व्यक्त करता है और क्रिया की कुछ अर्थ-व्याप्ति बनाए रखता है।
- source_word: יַעְשְׁרֶנּוּ ... עֹשֶׁר גָּדוֹל
  choice: उसे अपार धन से धनी करेगा
  rationale: עשר के हिफ़ील और उसी मूल के संज्ञा עֹשֶׁר की पुनरुक्ति को ‘धन से धनी’ द्वारा बचाया गया है; ‘अपार’ עֹשֶׁר גָּדוֹל की तीव्रता व्यक्त करता है।
- source_word: בִּתּוֹ יִתֶּן לוֹ
  choice: अपनी बेटी उससे ब्याह देगा
  rationale: शाब्दिक अर्थ ‘अपनी बेटी उसे देगा’ है, पर आधुनिक हिन्दी में विवाह का आशय स्पष्ट और गरिमापूर्ण ढंग से व्यक्त करने के लिए यह स्वाभाविक रूप चुना गया।
- source_word: בֵּית אָבִיו
  choice: उसके पिता के घराने
  rationale: यह पद केवल भवन नहीं बल्कि पैतृक परिवार या व्यापक गृहस्थी को सूचित करता है; ‘घराना’ उस सामाजिक इकाई को स्पष्ट करता है।
- source_word: יַעֲשֶׂה חָפְשִׁי בְּיִשְׂרָאֵל
  choice: इस्राएल में ... कर और राजकीय सेवा से मुक्त कर देगा
  rationale: חָפְשִׁי का यहाँ सम्भावित प्रशासनिक अर्थ राजकीय करों या सेवा-दायित्वों से छूट है; हिन्दी में केवल ‘स्वतंत्र करेगा’ भ्रामक हो सकता है, इसलिए प्रसंगगत अर्थ स्पष्ट किया गया है।
