    text: या, “वे निराश हो गए।” इब्रानी क्रिया का अर्थ “टूट जाना,” “निराश होना,” या “व्याकुल हो जाना” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने...सुनीं
  rationale: क़ाल रूप का सामान्य अर्थ ‘सुनना’ है; ‘बातें’ के साथ स्त्रीलिंग बहुवचन क्रिया स्वाभाविक हिन्दी देती है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: וְכָל יִשְׂרָאֵל
  choice: और सारे इस्राएल
  rationale: मूल के सामूहिक पद ‘सारा इस्राएल’ को बनाए रखता है और यहाँ उपस्थित इस्राएली जन/सेना को सूचित करता है।
- source_word: דִּבְרֵי הַפְּלִשְׁתִּי הָאֵלֶּה
  choice: उस पलिश्ती की ये बातें
  rationale: प्रदर्शक और संबंध को स्वाभाविक हिन्दी क्रम में रखा गया है; एकवचन निश्चित पद संदर्भ में पहले उल्लिखित पलिश्ती योद्धा की ओर संकेत करता है।
- source_word: וַיֵּחַתּוּ
  choice: उनका साहस टूट गया
  rationale: חתת के ‘टूट जाना/हताश हो जाना’ वाले सजीव भाव को स्वाभाविक हिन्दी में व्यक्त करता है और अगले भय-सूचक क्रियापद से भेद बनाए रखता है।
- source_word: וַיִּירְאוּ מְאֹד
  choice: वे बहुत डर गए
  rationale: יִרא का सीधा अर्थ ‘डरना’ और מְאֹד का तीव्रतासूचक अर्थ ‘बहुत’ है; संयोजन आधुनिक हिन्दी में सहज है।
