  text: When the Philistine looked and saw David[a], he despised him, because he was a youth, ruddy and handsome in appearance.
translation:
  language: hi
  text: जब उस पलिश्ती ने दृष्टि डालकर दाऊद को देखा, तो उसने उसे तुच्छ समझा, क्योंकि वह युवा था, लालिमा लिए हुए और देखने में सुंदर था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּבֵּט
  choice: दृष्टि डालकर
  rationale: नבט किसी की ओर दृष्टि करने को व्यक्त करता है; यह चयन अगले क्रियापद ‘देखा’ के साथ इब्रानी क्रम को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: इब्रानी में जातिसूचक संज्ञा ‘पलिश्ती’ ही है; संदर्भ से पहचान स्पष्ट होने के कारण ‘उस’ हिंदी में निश्चितता को स्वाभाविक रूप से व्यक्त करता है, बिना ‘योद्धा’ जोड़ने के।
- source_word: וַיִּרְאֶה אֶת דָּוִד
  choice: दाऊद को देखा
  rationale: ראה का सामान्य अर्थ ‘देखना’ है; सीधा अनुवाद दृष्टि डालने से देखने तक के कथात्मक क्रम को सुरक्षित रखता है।
- source_word: וַיִּבְזֵהוּ
  choice: उसने उसे तुच्छ जाना
  rationale: בזה का अर्थ किसी को नीचा या तुच्छ समझना है; यह पदबंध व्यक्ति-वाचक कर्म-प्रत्यय और मनोभाव दोनों को संक्षेप में व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ כִּי पलिश्ती के तिरस्कार का कारण प्रस्तुत करता है।
- source_word: הָיָה נַעַר
  choice: वह किशोर था
  rationale: נַעַר बालक, किशोर या जवान व्यक्ति को सूचित कर सकता है; इस संदर्भ में ‘किशोर’ दाऊद की कम आयु व्यक्त करता है, पर उसे छोटा बच्चा निश्चित नहीं करता।
- source_word: אַדְמֹנִי
  choice: लालिमा लिए हुए
  rationale: विशेषण लाल या लालिमा-युक्त रंग-रूप का संकेत देता है, पर यह निश्चित नहीं करता कि लालिमा त्वचा में थी या बालों में; हिंदी चयन उसी व्यापकता को रखता है।
- source_word: עִם יְפֵה מַרְאֶה
  choice: और देखने में सुंदर
  rationale: यह स्वाभाविक आधुनिक हिंदी में ‘सुंदर रूप वाला’ का भाव व्यक्त करता है और पुरुष के लिए भी सहज है।
