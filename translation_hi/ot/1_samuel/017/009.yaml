source:
  edition: WLC
  text: אִם יוּכַ֞ל לְ/הִלָּחֵ֤ם אִתִּ/י֙ וְ/הִכָּ֔/נִי וְ/הָיִ֥ינוּ לָ/כֶ֖ם לַ/עֲבָדִ֑ים וְ/אִם אֲנִ֤י אֽוּכַל ל/וֹ֙ וְ/הִכִּיתִ֔י/ו וִ/הְיִ֤יתֶם לָ֨/נוּ֙ לַ/עֲבָדִ֔ים וַ/עֲבַדְתֶּ֖ם אֹתָֽ/נוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/009.yaml
  text: If he is able to fight with me and strike me down[a], then we will be your servants. But if I prevail against him and strike him down[c][b], then you will be our servants and serve us.
translation:
  language: hi
  text: यदि वह मुझसे लड़ सके और मुझे मार गिराए[a], तो हम तुम्हारे दास[b] हो जाएँगे। पर यदि मैं उस पर प्रबल हो जाऊँ[c] और उसे मार गिराऊँ, तो तुम हमारे दास हो जाओगे और हमारी सेवा करोगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “मार गिराए” का अनुवाद “मार डाले” या “परास्त करे” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “दास” युद्ध में हारने के बाद दूसरे समुदाय के अधीन होकर सेवा करनेवालों को दर्शाता है; इसका अनुवाद “सेवक” भी किया जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी क्रिया का अधिक शाब्दिक अर्थ “मैं उसके विरुद्ध समर्थ होऊँ” है; इस युद्ध-प्रसंग में इसका भाव “उस पर प्रबल होना” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוּכַל לְהִלָּחֵם אִתִּי
  choice: मुझसे लड़ सके
  rationale: יכל सामर्थ्य या क्षमता व्यक्त करता है, और נלחם אתי परस्पर युद्ध, अर्थात आमने-सामने लड़ने, को दर्शाता है। ‘लड़ सके’ हिन्दी में दोनों बातों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְהִכָּנִי / וְהִכִּיתִיו
  choice: मुझे/उसे मार गिराए/मार गिराऊँ
  rationale: נכה का अर्थ प्रहार करना, परास्त करना या प्रसंगानुसार मार डालना हो सकता है। द्वंद्वयुद्ध के इस प्रसंग में ‘मार गिराना’ निर्णायक प्रहार को व्यक्त करता है, पर मृत्यु को अनिवार्य रूप से स्पष्ट नहीं करता।
- source_word: עֲבָדִים
  choice: दास
  rationale: यहाँ युद्ध के परिणामस्वरूप एक समुदाय की दूसरे के अधीन बँधी हुई सेवा अभिप्रेत है। ‘दास’ इस अधीनता को ‘सेवक’ की अपेक्षा अधिक स्पष्ट करता है और अगले क्रियापद ‘सेवा करोगे’ से संबंध बनाए रखता है।
- source_word: אֲנִי אוּכַל לוֹ
  choice: मैं उस पर प्रबल हो जाऊँ
  rationale: יכל के साथ ל व्यक्ति पर सामर्थ्य सिद्ध करने या उस पर हावी होने का भाव दे सकता है। युद्ध के प्रसंग में ‘प्रबल हो जाऊँ’ स्वाभाविक है और केवल सामान्य क्षमता से अधिक उपयुक्त है।
- source_word: וַעֲבַדְתֶּם אֹתָנוּ
  choice: हमारी सेवा करोगे
  rationale: עבד यहाँ अधीन होकर सेवा करने को दर्शाता है। ‘हमारी सेवा करोगे’ आधुनिक हिन्दी में स्पष्ट और मूल की पुनरुक्तिपूर्ण संरचना के अनुरूप है।
