  text: And when the Philistine rose and came and drew near to meet David[a], David hurried and ran toward the battle line to meet the Philistine.
translation:
  language: hi
  text: जब वह पलिश्ती उठा, आगे बढ़ा और दाऊद से मिलने के लिए निकट आया, तब दाऊद ने जल्दी की और पलिश्ती से मिलने के लिए युद्ध-पंक्ति[a] की ओर दौड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “युद्ध-व्यूह।” इब्रानी संज्ञा सैनिकों की युद्ध-पंक्ति या युद्ध के लिए सजी हुई सेना को सूचित कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה כִּי
  choice: जब ... तब
  rationale: इब्रानी कथात्मक सूत्र को स्वाभाविक हिन्दी कालवाचक रचना में व्यक्त करता है, बिना अनावश्यक रूप से शाब्दिक ‘और ऐसा हुआ कि’ अपनाए।
- source_word: קָם
  choice: उठकर
  rationale: क्रिया के उठने और तत्पश्चात आगे बढ़ने के क्रम को संक्षिप्त तथा स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַפְּלִשְׁתִּי
  choice: वह पलिश्ती
  rationale: मूल पाठ केवल ‘पलिश्ती’ कहता है; ‘योद्धा’ या ‘वीर’ जोड़ना प्रसंग से आयातित अर्थ होता।
- source_word: וַיֵּלֶךְ וַיִּקְרַב
  choice: आगे बढ़ा और उसके निकट आया
  rationale: 'दोनों क्रमिक क्रियाओं को बनाए रखता है: पहले गति, फिर दाऊद के समीप पहुँचना।'
- source_word: לִקְרַאת
  choice: का सामना करने के लिए
  rationale: यहाँ आमने-सामने मुठभेड़ की दिशा और उद्देश्य दोनों व्यक्त होते हैं; दोनों occurrences में एक ही अनुवाद रखा गया है।
- source_word: וַיְמַהֵר
  choice: फुर्ती की
  rationale: दाऊद के तुरंत और शीघ्रता से कार्य करने को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וַיָּרָץ
  choice: दौड़ा
  rationale: इब्रानी क्रिया का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: הַמַּעֲרָכָה
  choice: युद्ध-पंक्ति
  rationale: संज्ञा की सैनिक पंक्ति अथवा युद्ध-व्यूह संबंधी अर्थ-सीमा में ‘युद्ध-पंक्ति’ प्रसंग के लिए स्पष्ट है, जबकि वैकल्पिक अर्थ फुटनोट में सुरक्षित है।
