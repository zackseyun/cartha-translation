base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/055.yaml
  text: When Saul saw David going out to meet the Philistine[a], he said to Abner, the commander of the army, “Whose son is this young man, Abner?” And Abner said, “As your soul lives, O king, I do not know.”
translation:
  language: hi
  text: जब शाऊल ने दाऊद को उस पलिश्ती से मिलने के लिए जाते देखा, तो उसने सेनापति अब्नेर से पूछा, “अब्नेर, यह युवक किसका बेटा है?” अब्नेर ने कहा, “हे राजा, आपके जीवन की शपथ,[a] मैं नहीं जानता।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शपथ-विधि का शाब्दिक रूप है, “जैसे आपका प्राण जीवित है”; अर्थात, “आपके जीवन की शपथ।”
    reason: मूल इब्रानी शपथ-विधि के शाब्दिक रूप और उसके स्वाभाविक हिंदी अर्थ को दिखाना।
lexical_decisions:
- source_word: וְ/כִ/רְאוֹת
  choice: जब ... ने ... देखा
  rationale: संयोजक और infinitive construct मिलकर कालवाचक उपवाक्य बनाते हैं; यह हिंदी में स्वाभाविक रूप से घटनाक्रम व्यक्त करता है।
- source_word: יֹצֵא לִקְרַאת
  choice: सामना करने के लिए जाते
  rationale: יֹצֵא गति को और לִקְרַאת मिलने अथवा मुकाबले की ओर बढ़ने को व्यक्त करता है; युद्ध के प्रसंग में ‘सामना करने’ से भाव स्पष्ट रहता है, बिना ‘योद्धा’ जैसी अतिरिक्त सूचना जोड़े।
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: मूल में निश्चित जातिवाचक एकवचन है। हिंदी में पहले से परिचित व्यक्ति के लिए ‘उस पलिश्ती’ स्वाभाविक है; ‘वीर’ या ‘योद्धा’ मूल में नहीं जोड़ा गया।
- source_word: שַׂר הַצָּבָא
  choice: सेनापति
  rationale: यह सेना के प्रधान अधिकारी का पदनाम है; ‘सेनापति’ आधुनिक हिंदी में संक्षिप्त, स्पष्ट और प्रतिष्ठित रूप है।
- source_word: בֶּן מִי זֶה הַנַּעַר
  choice: यह जवान किसका बेटा है?
  rationale: यह मूल प्रश्न की पुत्र-संबंधी संरचना को बनाए रखता है। נַעַר के लिए ‘जवान’ दाऊद की युवावस्था और युद्ध में उसकी सक्रिय भूमिका, दोनों के अनुकूल है।
- source_word: חֵי נַפְשְׁךָ
  choice: आपके जीवन की शपथ
  rationale: यह संबोधित व्यक्ति के जीवन को साक्षी बनाकर कही गई इब्रानी शपथ-विधि है। हिंदी में यह शपथ का अर्थ स्वाभाविक रूप से देता है, जबकि शाब्दिक ‘आपका प्राण जीवित है’ असहज होता।
- source_word: אִם יָדָעְתִּי
  choice: मैं नहीं जानता
  rationale: शपथ-वाक्य में אִם नकारात्मक दृढ़ कथन का संक्षिप्त रूप है; हिंदी में इसका आशय स्पष्टतः ‘मैं नहीं जानता’ है।
