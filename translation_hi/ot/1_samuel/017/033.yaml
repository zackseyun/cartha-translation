base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/033.yaml
  text: Saul said to David[a], “You are not able to go against this Philistine to fight with him, because you are a youth[b], and he has been a man of war from his youth.”
translation:
  language: hi
  text: शाऊल ने दाऊद से कहा, “तुम इस पलिश्ती के विरुद्ध जाकर उससे लड़ नहीं सकते, क्योंकि तुम एक युवक हो[a], और वह अपनी युवावस्था से ही योद्धा रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द נַעַר का अर्थ प्रसंग के अनुसार ‘लड़का’, ‘किशोर’ या ‘युवक’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לֹא תוּכַל
  choice: लड़ नहीं सकते
  rationale: यह वाक्य निषेधाज्ञा नहीं, बल्कि सामर्थ्य की कमी व्यक्त करता है। हिंदी में क्रिया-समूह के साथ ‘नहीं सकते’ स्वाभाविक है।
- source_word: לָלֶכֶת אֶל
  choice: के विरुद्ध जाकर
  rationale: सैन्य प्रसंग में אֶל के साथ הלך केवल निकट जाने का नहीं, प्रतिद्वंद्वी का सामना करने के लिए आगे बढ़ने का भाव देता है।
- source_word: הַפְּלִשְׁתִּי הַזֶּה
  choice: इस पलिश्ती
  rationale: संकेतवाचक और जातिसूचक संज्ञा का सीधा तथा स्वाभाविक हिंदी रूप।
- source_word: לְהִלָּחֵם עִמּוֹ
  choice: उससे लड़
  rationale: हिंदी में ‘उससे लड़ना’ עִם के साथ युद्ध करने का सहज समतुल्य है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ शब्द शाऊल द्वारा बताए गए कारण का परिचय देता है।
- source_word: נַעַר
  choice: किशोर
  rationale: नַעַר की आयु-संबंधी व्यापकता को देखते हुए ‘किशोर’ दाऊद की युवावस्था और गोलियत से उसका विरोध स्पष्ट करता है, बिना उसे छोटा बच्चा ठहराए।
- source_word: אִישׁ מִלְחָמָה
  choice: योद्धा
  rationale: शाब्दिक ‘युद्ध का पुरुष’ की अपेक्षा ‘योद्धा’ आधुनिक हिंदी में स्वाभाविक है और युद्ध में प्रशिक्षित/अनुभवी व्यक्ति का अर्थ ठीक व्यक्त करता है।
- source_word: מִנְּעֻרָיו
  choice: अपनी किशोरावस्था से ही
  rationale: מִן आरंभ-बिंदु और लंबे अनुभव को बताता है; ‘से ही’ उस निरंतरता और बल को स्वाभाविक हिंदी में व्यक्त करता है।
