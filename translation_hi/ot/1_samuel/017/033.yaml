  register: आधुनिक मानक हिंदी का सरल, गरिमापूर्ण और कथात्मक रूप रखा गया है। ‘नहीं सकते’ से असमर्थता, न कि केवल मनाही, व्यक्त होती है। ‘किशोर’ और ‘किशोरावस्था’ की पुनरावृत्ति मूल के נַעַר/נְעוּרִים शब्द-संबंध और दाऊद तथा गोलियत के अनुभवगत विरोध को बनाए रखती है।
