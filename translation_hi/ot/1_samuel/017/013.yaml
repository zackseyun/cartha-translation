  yaml_path: translation/ot/1_samuel/017/013.yaml
  text: The three oldest sons of Jesse had gone after Saul to the battle. And the names of his three sons who had gone to the battle were Eliab the firstborn[a], his second Abinadab, and the third Shammah.
translation:
  language: hi
  text: 'यिशै के तीनों बड़े बेटे शाऊल के पीछे[a] युद्ध के लिए गए थे। युद्ध में गए उसके तीनों बेटों के नाम ये थे: पहिलौठा पुत्र एलीआब, दूसरा अबीनादाब और तीसरा शम्मा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी अभिव्यक्ति का अर्थ “शाऊल के पीछे” या “शाऊल का अनुसरण करते हुए” हो सकता है।
    reason: मूल पदबंध אַחֲרֵי שָׁאוּל स्थानगत ‘पीछे’ और नेतृत्व के अनुसरण—दोनों भाव व्यक्त कर सकता है।
lexical_decisions:
- source_word: וַיֵּלְכוּ / הָלְכוּ
  choice: गए थे
  rationale: यहाँ क्रिया कथा की पृष्ठभूमि में पहले से घट चुकी बात बताती है; ‘गए थे’ हिंदी में इस पूर्वकालिक संबंध को स्वाभाविक ढंग से व्यक्त करता है।
