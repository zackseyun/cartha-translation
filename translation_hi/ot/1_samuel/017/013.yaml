  choice: यिशै के तीनों बड़े बेटे
  rationale: परिवार के संदर्भ में הַגְּדֹלִים आयु और वरिष्ठता को दर्शाता है, शारीरिक आकार या प्रतिष्ठा को नहीं। निश्चित तीन बेटों के लिए ‘तीनों’ स्वाभाविक है।
- source_word: אַחֲרֵי שָׁאוּל
  choice: शाऊल के पीछे
  rationale: यह मूल इब्रानी के ‘पीछे/अनुगमन में’ रूपक को बनाए रखता है। प्रसंग में आशय शाऊल के सैन्य अभियान में उसके पीछे चलने या उसका अनुसरण करने से है; संभावित अर्थभेद को पादटिप्पणी में रखा गया है।
- source_word: לַמִּלְחָמָה / בַּמִּלְחָמָה
  choice: युद्ध में
  rationale: מִלְחָמָה युद्ध या लड़ाई दोनों को सूचित कर सकता है। यहाँ विशिष्ट सैन्य मुठभेड़ की ओर जाना अभिप्रेत है; ‘युद्ध में’ हिंदी में दोनों आवृत्तियों के लिए सहज और संगत है।
- source_word: וְשֵׁם שְׁלֹשֶׁת בָּנָיו
  choice: उसके तीनों बेटों के नाम ये थे
  rationale: इब्रानी में ‘नाम’ एकवचन है, पर इसके बाद अनेक नामों की सूची आती है; हिंदी में बहुवचन ‘नाम’ अधिक स्वाभाविक है। ‘उसके’ का संदर्भ निकटवर्ती यिशै से है।
- source_word: הַבְּכוֹר
  choice: पहलौठा
  rationale: בְּכוֹר केवल सबसे बड़ा नहीं, बल्कि परिवार में प्रथम जन्मे पुत्र की स्थिति को व्यक्त करता है; ‘पहलौठा’ इस विशिष्टता को सुरक्षित रखता है।
- source_word: וּמִשְׁנֵהוּ
  choice: दूसरा
  rationale: यह भाईयों के क्रम में पहले के बाद आने वाले को दर्शाता है। हिंदी सूची में ‘दूसरा’ स्पष्ट और स्वाभाविक है।
- source_word: וְהַשְּׁלִשִׁי
  choice: और तीसरा
  rationale: मूल पाठ की क्रमसूचक सूची को सीधे और स्पष्ट रूप में रखा गया है।
- source_word: אֱלִיאָב / אֲבִינָדָב / שַׁמָּה
  choice: एलीआब / अबीनादाब / शम्मा
  rationale: नामों को उनके इब्रानी रूपों के निकट, हिंदी में प्रचलित और उच्चारणयोग्य लिप्यंतरण में प्रस्तुत किया गया है।
