  text: Then he turned away from him toward another and said the same thing[a], and the people answered him as before.
translation:
  language: hi
  text: तब वह उसके पास से हटकर किसी दूसरे की ओर मुड़ा और वही बात कही[a]। लोगों ने उसे पहले जैसा ही उत्तर दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “लोगों ने उसे पहली बात के समान बात का उत्तर दिया,” अर्थात उन्होंने उसे पहले जैसा ही उत्तर दिया।
    reason: अंतिम इब्रानी वाक्यांश की शब्दशः संरचना और उसके प्रसंगगत अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וַיִּסֹּב
  choice: मुड़कर
  rationale: यह क्रिया दाऊद के एलीआब से हटकर दूसरे व्यक्ति की ओर मुड़ने की शारीरिक क्रिया बताती है।
- source_word: מֵאֶצְלוֹ
  choice: उसके पास से
  rationale: वाक्यांश का शाब्दिक अर्थ ‘उसके पास/बगल से’ है; यह स्वाभाविक हिन्दी में स्थान और अलग होने दोनों का भाव रखता है।
- source_word: אֶל מוּל אַחֵר
  choice: किसी और की ओर हुआ
  rationale: מול का आमने-सामने या दिशा की ओर होने का संकेत इस सहज हिन्दी अभिव्यक्ति में बना रहता है।
- source_word: וַיֹּאמֶר כַּדָּבָר הַזֶּה
  choice: वही बात कही
  rationale: संदर्भ में दाऊद अपनी पहले कही बात या प्रश्न दोहराता है; ‘बात’ דבר के अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: וַיְשִׁבֻהוּ
  choice: उसे ... उत्तर दिया
  rationale: यहाँ שוב का हिफ़ील रूप प्रत्युत्तर देने के अर्थ में है; ‘उत्तर दिया’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: הָעָם
  choice: लोगों
  rationale: עם का व्यापक अर्थ ‘लोग’ है। सैनिक प्रसंग होने पर भी मूल पाठ इसे केवल सैनिकों तक स्पष्ट रूप से सीमित नहीं करता।
- source_word: דָּבָר כַּדָּבָר הָרִאשׁוֹן
  choice: पहले जैसा ही उत्तर
  rationale: शाब्दिक ‘पहली बात के समान बात’ का प्रसंगगत अर्थ है कि उत्तर पहले दिए गए उत्तर के समान था।
