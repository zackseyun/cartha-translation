- source_word: נֹשֵׂא הַצִּנָּה
  choice: बड़ी ढाल उठानेवाला
  rationale: צִנָּה सामान्यतः छोटी ढाल के बजाय शरीर को अधिक ढकनेवाली बड़ी ढाल को दर्शाता है; इसलिए यह विशेषता मुख्य पाठ में स्पष्ट की गई है।
- source_word: הֹלֵךְ לְפָנָיו
  choice: उसके आगे-आगे चलता था
  rationale: यह चलती हुई निरंतर क्रिया और गोलियत के सामने सेवक की स्थिति, दोनों को सहज हिन्दी में व्यक्त करता है।
