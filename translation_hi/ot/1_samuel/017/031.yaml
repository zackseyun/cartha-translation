  text: When the words that David had spoken were heard[a], they reported them before Saul, and he sent for him.
translation:
  language: hi
  text: जब लोगों ने दाऊद की कही हुई बातें सुनीं, तो उन्होंने उन्हें शाऊल को बताया, और उसने दाऊद को बुलवा लिया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “और उसने उसे ले लिया।” प्रसंग में इसका आशय सम्भवतः यह है कि शाऊल ने दाऊद को अपने पास बुलवा लिया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְּשָּׁמְעוּ
  choice: सुनी गईं
  rationale: इब्रानी रूप व्याकरणतः सक्रिय बहुवचन है, पर कर्ता अनिर्दिष्ट है। हिन्दी में कर्मवाच्य अभिव्यक्ति अनिर्दिष्ट कर्ता को जोड़े बिना वही कथात्मक अर्थ स्वाभाविक रूप से देती है।
- source_word: הַדְּבָרִים אֲשֶׁר דִּבֶּר דָּוִד
  choice: दाऊद की कही हुई बातें
  rationale: דברים यहाँ दाऊद के कथनों को दर्शाता है; ‘बातें’ आधुनिक हिन्दी में स्वाभाविक है और बोलने के प्रसंग को बनाए रखता है।
- source_word: וַיַּגִּדוּ
  choice: लोगों ने उन्हें ... बताया
  rationale: נגד का अर्थ किसी बात को ज्ञात कराना या उसका समाचार देना है। बहुवचन कर्ता अनिर्दिष्ट होने के कारण ‘लोगों ने’ हिन्दी में सहज है।
- source_word: לִפְנֵי שָׁאוּל
  choice: शाऊल के सामने
  rationale: यह मूल पदबंध ‘शाऊल के सम्मुख’ का निकट और स्पष्ट हिन्दी रूप है, जो उसकी उपस्थिति में बात बताए जाने का भाव रखता है।
- source_word: וַיִּקָּחֵהוּ
  choice: उसने दाऊद को बुलवा लिया
  rationale: לקח का मूल अर्थ ‘लेना’ है, पर राजदरबार के इस प्रसंग में इसका संभावित आशय दाऊद को शाऊल के पास लाया जाना है। ‘बुलवा लिया’ इस कारक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है; शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
