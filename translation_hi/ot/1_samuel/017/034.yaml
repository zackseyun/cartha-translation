  text: וַ/יֹּ֤אמֶר דָּוִד֙ אֶל שָׁא֔וּל רֹעֶ֨ה הָיָ֧ה עַבְדְּ/ךָ֛ לְ/אָבִ֖י/ו בַּ/צֹּ֑אן וּ/בָ֤א הָֽ/אֲרִי֙ וְ/אֶת הַ/דּ֔וֹב וְ/נָשָׂ֥א שֶׂ֖ה מֵ/הָ/עֵֽדֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/034.yaml
  text: David said to Saul[a], “Your servant was tending his father’s sheep[b], and when a lion or a bear would come and carry off a lamb from the flock,”
translation:
  language: hi
  text: दाऊद ने शाऊल से कहा, “आपका सेवक अपने पिता की भेड़ें चराया करता था। जब कभी कोई सिंह या भालू[a] आकर झुंड में से एक भेड़[b] उठा ले जाता था,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप से, “सिंह और भालू”; इब्रानी में “और” है, पर आशय संभवतः यह है कि दोनों में से कोई एक आता था।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद “एक मेमना” या व्यापक अर्थ में “झुंड का एक पशु” भी हो सकता है; इब्रानी शब्द भेड़ या बकरी-वर्ग के पशु के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: רֹעֶה הָיָה
  choice: चराया करता था
  rationale: कृदंत के साथ הָיָה दाऊद के निरंतर या अभ्यस्त चरवाही-कार्य को बताता है। हिंदी में यह प्रयोग स्वाभाविक रूप से उसी भाव को व्यक्त करता है।
- source_word: עַבְדְּךָ
  choice: आपका सेवक
  rationale: राजा से बात करते समय यह विनम्र आत्म-संबोधन है; यहाँ दासत्व पर बल देने के बजाय दरबारी आदर व्यक्त किया गया है।
- source_word: לְאָבִיו בַּצֹּאן
  choice: अपने पिता की भेड़ें
  rationale: यह वाक्यांश बताता है कि दाऊद अपने पिता के पशुओं की चरवाही करता था। सरल हिंदी में इसे सीधे कर्म के रूप में कहना अधिक स्वाभाविक है।
- source_word: וּבָא
  choice: जब कभी … आकर
  rationale: पिछले समय में बार-बार घटने वाली सामान्य परिस्थिति का भाव व्यक्त करने के लिए ‘जब कभी’ अभ्यस्त अर्थ को स्पष्ट करता है।
- source_word: הָאֲרִי וְאֶת הַדּוֹב
  choice: कोई सिंह या भालू
  rationale: इब्रानी में संयोजक ‘और’ है, पर एकवचन क्रिया और प्रसंग इसे वितरणात्मक बनाते हैं—इनमें से कोई एक हिंसक पशु आता था।
- source_word: וְנָשָׂא
  choice: उठा ले जाता था
  rationale: यहाँ क्रिया शिकार को पकड़कर ले जाने का अर्थ देती है; हिंदी मुहावरे में ‘उठा ले जाना’ इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֶׂה
  choice: एक भेड़
  rationale: यह शब्द झुंड के किसी एक भेड़ या बकरी-वर्गीय पशु को सूचित कर सकता है। ‘एक भेड़’ प्रसंग में सहज है और ‘मेमना’ कहकर आयु को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מֵהָעֵדֶר
  choice: झुंड में से
  rationale: यह स्रोत या समूह से अलग किए जाने का भाव देता है; ‘झुंड में से’ हिंदी में सटीक और स्वाभाविक है।
