  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘आता-जाता रहता था’ नियमित या बार-बार होने वाली गतिविधि बताता है; ‘भेड़-बकरियाँ’ צֹאן के व्यापक सामूहिक अर्थ को स्पष्ट करता है।
