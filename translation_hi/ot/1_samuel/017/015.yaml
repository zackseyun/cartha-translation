base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/015.yaml
  text: David went back and forth from Saul to shepherd his father's flock at Bethlehem[a].
translation:
  language: hi
  text: दाऊद शाऊल के पास से बेतलेहेम में अपने पिता की भेड़-बकरियाँ चराने के लिए आता-जाता रहता था।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप से: “दाऊद शाऊल के पास से जाता और लौटता था, ताकि बेतलेहेम में अपने पिता का झुंड चराए।”'
    reason: मूल इब्रानी की युग्मित क्रियाओं और वाक्य-विन्यास का अधिक औपचारिक विकल्प देने के लिए।
lexical_decisions:
- source_word: הֹלֵךְ וָשָׁב
  choice: आता-जाता रहता था
  rationale: दोनों क्रियाओं का यह मेल एक बार की यात्रा के बजाय बार-बार या नियमित रूप से आने-जाने का भाव देता है। यह हिन्दी में उस पुनरावृत्त गतिविधि को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֵעַל שָׁאוּל
  choice: शाऊल के पास से
  rationale: यह पदबंध यहाँ शाऊल की उपस्थिति अथवा सेवा के स्थान से प्रस्थान का संकेत देता है। ‘शाऊल के पास से’ मूल संबंध को संक्षिप्त और सहज हिन्दी में बनाए रखता है।
- source_word: לִרְעוֹת
  choice: चराने के लिए
  rationale: רעה का अर्थ चरवाहे के रूप में पशुओं को चराना और उनकी देखभाल करना है। प्रसंग में ‘चराने’ से इसका मुख्य क्रियात्मक अर्थ स्पष्ट होता है।
- source_word: צֹאן
  choice: भेड़-बकरियाँ
  rationale: यह सामूहिक संज्ञा छोटे पालतू पशुओं, विशेषतः भेड़ों और बकरियों, को सूचित कर सकती है। ‘भेड़-बकरियाँ’ हिन्दी पाठक के लिए इसके अर्थ-क्षेत्र को ‘भेड़ें’ की अपेक्षा अधिक पूर्ण रूप से व्यक्त करता है।
- source_word: אָבִיו
  choice: अपने पिता की
  rationale: कर्ता दाऊद के साथ आत्मवाचक ‘अपने’ हिन्दी में स्वाभाविक रूप से संबंध स्पष्ट करता है।
- source_word: בֵּית לָחֶם
  choice: बेतलेहेम
  rationale: यह स्थान-नाम का हिन्दी में प्रचलित लिप्यंतरण है।
- source_word: וְ
  choice: अलग संयोजक शब्द नहीं
  rationale: आरंभिक וְ कथा को जोड़ता है; हिन्दी में इस व्याख्यात्मक वाक्य के आरंभ में ‘और’ जोड़ना आवश्यक नहीं है और मूल में कोई स्वतंत्र कालवाचक ‘अब’ नहीं है।
