base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/046.yaml
  text: This day Yahweh will deliver you into my hand[a], and I will strike you down and remove your head from you. And this day I will give the corpses of the Philistine camp to the birds of the sky and to the wild animals of the earth, so that all the earth may know that there is a God for Israel.
translation:
  language: hi
  text: आज ही याहवे तुझे मेरे हाथ में सौंप देगा; मैं तुझे मार गिराऊँगा और तेरा सिर तेरे धड़ से अलग कर दूँगा। आज ही मैं पलिश्तियों की छावनी के शव आकाश के पक्षियों और धरती के जंगली जानवरों को दे दूँगा। तब सारी पृथ्वी जान लेगी कि इस्राएल के लिए परमेश्वर है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल में परमेश्वर है।” इब्रानी में शाब्दिक रूप से “इस्राएल के लिए” है, जो संबंध या इस्राएल की ओर से होने का भाव भी व्यक्त कर सकता है।
    reason: לְיִשְׂרָאֵל के संबंधवाचक और संभावित स्थानवाचक अर्थों की वास्तविक अस्पष्टता सुरक्षित रखने के लिए।
lexical_decisions:
- source_word: יְסַגֶּרְךָ ... בְּיָדִי
  choice: तुझे मेरे हाथ में सौंप देगा
  rationale: हिफ़ील रूप यहाँ किसी को दूसरे के अधिकार में कर देने का अर्थ देता है। हिंदी मुहावरा ‘हाथ में सौंपना’ मूल बिंब और सैन्य संदर्भ दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिंदी में प्रचलित नामरूप ‘यहोवा’ चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
- source_word: וְהִכִּיתִךָ
  choice: मैं तुझे मार गिराऊँगा
  rationale: נכה का अर्थ प्रहार करना या मार डालना हो सकता है; युद्ध के इस प्रसंग में ‘मार गिराऊँगा’ मृत्यु का संकेत देते हुए क्रिया की प्रहार-संबंधी शक्ति बनाए रखता है।
- source_word: וַהֲסִרֹתִי אֶת־רֹאשְׁךָ מֵעָלֶיךָ
  choice: तेरा सिर तेरे धड़ से अलग कर दूँगा
  rationale: मूल क्रिया का सीधा अर्थ ‘हटा देना/अलग कर देना’ है। स्वाभाविक हिंदी के लिए ‘धड़ से अलग’ निहित शारीरिक संबंध स्पष्ट करता है, बिना किसी अतिरिक्त विधि का उल्लेख किए।
- source_word: פֶּגֶר מַחֲנֵה פְלִשְׁתִּים
  choice: पलिश्तियों की छावनी के शव
  rationale: एकवचन रूप פֶּגֶר सामूहिक अर्थ में है और छावनी के मारे गए लोगों को दर्शाता है; ‘शव’ मानव मृतदेहों के लिए स्वाभाविक और गंभीर शब्द है।
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों को
  rationale: यह सामान्य इब्रानी अभिव्यक्ति मूल के आकाश-संबंधी बिंब को सहज आधुनिक हिंदी में रखती है।
- source_word: וּלְחַיַּת הָאָרֶץ
  choice: धरती के जंगली जानवरों को
  rationale: इस सहप्रयोग में חַיָּה स्थल पर रहने वाले जंगली पशुओं को सूचित करता है।
- source_word: וְיֵדְעוּ כָּל־הָאָרֶץ
  choice: तब सारी पृथ्वी जान लेगी
  rationale: वाव और अपूर्ण क्रिया यहाँ परिणाम की ओर बढ़ते कथन के रूप में स्वाभाविक रूप से समझे जा सकते हैं। ‘तब’ उस परिणामी संबंध को स्पष्ट करता है, जबकि ‘सारी पृथ्वी’ मूल की व्यापक अलंकारिक सीमा बनाए रखती है।
- source_word: כִּי יֵשׁ אֱלֹהִים לְיִשְׂרָאֵל
  choice: कि इस्राएल के लिए परमेश्वर है
  rationale: לְ का सबसे सीधा संबंधसूचक रूप ‘के लिए’ है, जो परमेश्वर और इस्राएल के संबंध को व्यक्त करता है। संभावित स्थानवाचक अर्थ फुटनोट में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का रूप
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम है, इसलिए उसे ‘प्रभु’ जैसी उपाधि से नहीं बदला गया। आधुनिक हिंदी बाइबल-पाठकों में सुगम और व्यापक रूप से पहचाना जाने वाला नामरूप ‘यहोवा’ चुना गया।
- issue: לְיִשְׂרָאֵל द्वारा व्यक्त संबंध
  choice: इस्राएल के लिए परमेश्वर है
  alternative: इस्राएल में परमेश्वर है
  rationale: לְ सामान्यतः ‘के लिए/को’ का संबंध व्यक्त करता है और यहाँ इस्राएल के साथ परमेश्वर का संबंध या उसकी ओर से होना सूचित कर सकता है। स्थानवाचक समझ भी प्राचीन संदर्भ और प्रचलित अनुवाद के आधार पर संभव है, इसलिए उसे फुटनोट में रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक घोषणा के अनुकूल रखी गई है। ‘तुझे/तेरा’ युद्धस्थल के सीधे एकवचन संबोधन को दर्शाता है। हिंसक चित्रण को मूल के अनुरूप स्पष्ट रखा गया है, पर मूल से अधिक विस्तार नहीं जोड़ा गया।
