  text: וַ/יִּקַּ֨ח מַקְל֜/וֹ בְּ/יָד֗/וֹ וַ/יִּבְחַר ל֣/וֹ חֲמִשָּׁ֣ה חַלֻּקֵֽי אֲבָנִ֣ים מִן הַ/נַּ֡חַל וַ/יָּ֣שֶׂם אֹ֠תָ/ם בִּ/כְלִ֨י הָ/רֹעִ֧ים אֲשֶׁר ל֛/וֹ וּ/בַ/יַּלְק֖וּט וְ/קַלְּע֣/וֹ בְ/יָד֑/וֹ וַ/יִּגַּ֖שׁ אֶל הַ/פְּלִשְׁתִּֽי־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/040.yaml
  text: He took his staff in his hand and chose for himself five smooth stones from the wadi[a], and put them in the shepherd’s bag that he had, in the pouch; and his sling was in his hand[b]. Then he approached the Philistine.
translation:
  language: hi
  text: उसने अपनी लाठी हाथ में ली और नाले[a] में से अपने लिए पाँच चिकने पत्थर चुने। उसने उन्हें अपने पास के चरवाहे के थैले में, अर्थात् उसकी झोली[b] में रखा। उसका गोफन उसके हाथ में था। फिर वह उस पलिश्ती के पास गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जलधारा” अथवा “सूखे नाले की तलहटी”; इब्रानी נַחַל घाटी में बहने वाली, कभी-कभी मौसमी, जलधारा या उसके मार्ग को भी दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “छोटी थैली”; इब्रानी יַלְקוּט सामान रखने की छोटी झोली या थैली को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַקְלוֹ
  choice: अपनी लाठी
  rationale: מַקֵּל का अर्थ लाठी या डंडा हो सकता है; चरवाहे के संदर्भ में ‘लाठी’ स्वाभाविक और सटीक है।
- source_word: וַיִּבְחַר לוֹ
  choice: अपने लिए ... चुने
  rationale: לוֹ के आत्मसंबंधी भाव को ‘अपने लिए’ से स्पष्ट रखा गया है।
- source_word: חֲמִשָּׁה חַלֻּקֵי אֲבָנִים
  choice: पाँच चिकने पत्थर
  rationale: חַלֻּקֵי यहाँ जलधारा से चिकने हुए पत्थरों की विशेषता बताता है; ‘चिकने पत्थर’ सहज हिंदी है।
- source_word: מִן הַנַּחַל
  choice: नाले में से
  rationale: נַחַל घाटी की जलधारा, नाला अथवा कभी मौसमी जलमार्ग को दर्शा सकता है। ‘नाला’ सामान्य हिंदी पाठक के लिए सुबोध है, और विकल्प पादटिप्पणी में दिए गए हैं।
- source_word: בִּכְלִי הָרֹעִים אֲשֶׁר לוֹ וּבַיַּלְקוּט
  choice: अपने चरवाहे के थैले की झोली में
  rationale: כְּלִי व्यापक रूप से सामान रखने के पात्र को और יַלְקוּט छोटी झोली या थैली को दर्शाता है। यह रूप दूसरे पदबंध को पहले का अधिक विशिष्ट विवरण मानते हुए मूल की पुनरुक्ति को यथासंभव बनाए रखता है।
- source_word: וְקַלְּעוֹ בְיָדוֹ
  choice: उसका गोफन उसके हाथ में था
  rationale: मूल का वाक्य क्रियारहित है; हिंदी में स्पष्टता के लिए ‘था’ जोड़ा गया है। ‘गोफन’ קֶלַע के लिए प्रचलित और सटीक शब्द है।
- source_word: וַיִּגַּשׁ אֶל הַפְּלִשְׁתִּי
  choice: फिर वह उस पलिश्ती के पास गया
  rationale: נגשׁ का मूल भाव पास जाना या निकट आना है। ‘पास गया’ सरल, स्वाभाविक हिंदी में दिशा और निकटता दोनों व्यक्त करता है।
