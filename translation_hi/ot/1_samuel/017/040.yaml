  register: आधुनिक मानक हिंदी में सरल किंतु गरिमापूर्ण कथात्मक शैली रखी गई है। ‘लाठी’, ‘झोली’ और ‘गोफन’ जैसे ठोस शब्द ग्रामीण-चरवाही संदर्भ को स्वाभाविक बनाते हैं। मूल के ‘थैले ... झोली’ वाले कुछ कठिन संबंध को पूरी तरह समतल करने के बजाय हल्की पुनरुक्ति में सुरक्षित रखा गया है।
