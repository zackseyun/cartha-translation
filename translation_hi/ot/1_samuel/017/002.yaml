source:
  edition: WLC
  text: וְ/שָׁא֤וּל וְ/אִֽישׁ יִשְׂרָאֵל֙ נֶאֶסְפ֔וּ וַֽ/יַּחֲנ֖וּ בְּ/עֵ֣מֶק הָאֵלָ֑ה וַ/יַּעַרְכ֥וּ מִלְחָמָ֖ה לִ/קְרַ֥את פְּלִשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/002.yaml
  text: And Saul and the men of Israel gathered together and camped in the Valley of Elah[a], and they drew up for battle against the Philistines.
translation:
  language: hi
  text: और शाऊल तथा इस्राएल के पुरुष इकट्ठे हुए और एला की घाटी में डेरा डाला। उन्होंने पलिश्तियों का सामना करने के लिए[a] युद्ध-पंक्ति बाँधी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पलिश्तियों के सामने।”
    reason: לִקְרַאת स्थानगत रूप से ‘के सामने’ भी समझा जा सकता है; मुख्य पाठ उसका प्रसंगानुकूल सैन्य भाव देता है।
lexical_decisions:
- source_word: וְשָׁאוּל
  choice: और शाऊल
  rationale: आरंभिक संयोजक पिछले वृत्तांत से संबंध बनाए रखता है; ‘और’ इब्रानी कथात्मक प्रवाह को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְאִישׁ יִשְׂרָאֵל
  choice: तथा इस्राएल के पुरुष
  rationale: एकवचन אִישׁ यहाँ सामूहिक अर्थ में युद्ध के लिए आए पुरुषों को सूचित करता है; यह ‘सेना’ जैसे अधिक व्याख्यात्मक शब्द से अधिक निकट है।
- source_word: נֶאֶסְפוּ
  choice: इकट्ठे हुए
  rationale: निफ़ाल रूप एकत्र होने का भाव देता है; यह आधुनिक हिन्दी में स्वाभाविक है और सैन्य जमाव का संदर्भ बनाए रखता है।
- source_word: וַיַּחֲנוּ
  choice: डेरा डाला
  rationale: क्रिया किसी स्थान पर शिविर लगाने को सूचित करती है; ‘डेरा डाला’ स्पष्ट और प्रचलित हिन्दी है।
- source_word: בְּעֵמֶק הָאֵלָה
  choice: एला की घाटी में
  rationale: עֵמֶק का सामान्य अर्थ ‘घाटी’ है और הָאֵלָה यहाँ स्थान-नाम ‘एला’ है।
- source_word: וַיַּעַרְכוּ מִלְחָמָה
  choice: युद्ध-पंक्ति बाँधी
  rationale: यह पदबंध युद्ध के लिए सैनिकों को क्रमबद्ध करने का भाव देता है; चुना हुआ रूप सैन्य अर्थ को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: לִקְרַאת פְּלִשְׁתִּים
  choice: पलिश्तियों का सामना करने के लिए
  rationale: לִקְרַאת में ‘सामना करने/मिलने के लिए’ और ‘सामने’ का भाव हो सकता है; युद्ध-संदर्भ में यह अनुवाद उद्देश्य और आमने-सामने की स्थिति दोनों को सहज रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण कथात्मक रूप रखा गया है। व्यक्तियों और स्थानों के नाम प्रचलित हिन्दी बाइबिलीय लिप्यंतरण के अनुसार दिए गए हैं; सैन्य पदबंध को न तो अत्यधिक शाब्दिक बनाया गया है, न ‘सेना’ जोड़कर मूल से अधिक स्पष्ट किया गया है।
