base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/017/044.yaml
  text: And the Philistine said to David[a], “Come to me[b], and I will give your flesh to the birds of the heavens and to the beasts of the field.”
translation:
  language: hi
  text: तब उस पलिश्ती ने दाऊद से कहा, “मेरे पास आ, और मैं तेरा मांस आकाश के पक्षियों[a] और मैदान के पशुओं[b] को दे दूँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “आसमान के पक्षियों।”
    reason: lexical_alternative
  - marker: b
    text: या “मैदान के जानवरों।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַפְּלִשְׁתִּי
  choice: उस पलिश्ती
  rationale: संज्ञा पर लगा निश्चित उपपद संदर्भ में गोलियत की ओर संकेत करता है। ‘उस पलिश्ती’ मूल के अनुरूप है और ‘योद्धा’ जैसा अनकहा विवरण नहीं जोड़ता।
- source_word: לְכָה אֵלַי
  choice: मेरे पास आ
  rationale: यह चुनौती के रूप में प्रयुक्त सीधी आज्ञा है; आधुनिक हिन्दी में ‘मेरे पास आ’ स्वाभाविक और तीखा है।
- source_word: וְאֶתְּנָה
  choice: और मैं ... दे दूँगा
  rationale: यह रूप यहाँ वक्ता के दृढ़ निश्चय और धमकी को व्यक्त करता है। ‘दे दूँगा’ हिन्दी में पूर्ण और प्रबल भावी क्रिया को स्वाभाविक रूप से दर्शाता है।
- source_word: בְּשָׂרְךָ
  choice: तेरा मांस
  rationale: ‘मांस’ मूल की सजीव और क्रूर छवि को बनाए रखता है; ‘शरीर’ अपेक्षाकृत व्याख्यात्मक और कम तीखा होता।
- source_word: לְעוֹף הַשָּׁמַיִם
  choice: आकाश के पक्षियों
  rationale: यह मूल पदबंध का स्पष्ट और स्वाभाविक हिन्दी रूप है। ‘आकाश’ यहाँ उड़ने वाले पक्षियों के क्षेत्र को व्यक्त करता है।
- source_word: וּלְבֶהֱמַת הַשָּׂדֶה
  choice: और मैदान के पशुओं
  rationale: ‘पशु’ בְּהֵמָה की व्यापकता को बनाए रखता है, जबकि ‘मैदान के’ मूल संबंधवाचक पदबंध को सीधे व्यक्त करता है।
