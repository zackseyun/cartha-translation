translation:
  language: hi
  text: इस्राएल और पलिश्ती अपनी-अपनी युद्ध-पंक्तियों में एक-दूसरे के सामने सज गए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַתַּעֲרֹךְ
  choice: खड़ी की
  rationale: ערך का सैन्य संदर्भ सेना को क्रमबद्ध करके युद्ध के लिए तैनात करने का है। संयुक्त वाक्यांश 'सेना ... खड़ी की' आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यहाँ राष्ट्रीय नाम सामूहिक रूप से इस्राएली सेना को दर्शाता है; हिन्दी में बहुवचन समुदायवाचक रूप वाक्य को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וּפְלִשְׁתִּים
  choice: और पलिश्तियों
  rationale: पलिश्ती जाति/सेना के लिए प्रचलित आधुनिक हिन्दी रूप।
- source_word: מַעֲרָכָה ... מַעֲרָכָה
  choice: अपनी-अपनी सेना युद्ध के लिए आमने-सामने
  rationale: दोहराया गया מַעֲרָכָה दो विरोधी युद्ध-पंक्तियों अथवा सैन्य-व्यूहों को चित्रित करता है। हिन्दी में 'अपनी-अपनी सेना ... आमने-सामने' दोनों पक्षों की समानांतर तैनाती को स्पष्ट और सहज रूप से रखता है।
- source_word: לִקְרַאת
  choice: आमने-सामने
  rationale: शाब्दिक भाव 'मिलने की ओर/सामना करने के लिए' है; सैन्य प्रसंग में यह विरोधी सेनाओं के एक-दूसरे के सामने तैनात होने को दर्शाता है।
