    rationale: The Hebrew twice denotes a battle line, array, or formation, rather than the armies as such. This reduces the source's imagery and repetition.
  - severity: low
    issue: The deployment is phrased as causing armies to stand ('सेना ... खड़ी की').
    rationale: The Hebrew depicts Israel and the Philistines themselves drawing up in opposing formations. A reflexive Hindi construction represents this more directly.
