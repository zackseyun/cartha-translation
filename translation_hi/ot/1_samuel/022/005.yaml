  text: וַ/יֹּאמֶר֩ גָּ֨ד הַ/נָּבִ֜יא אֶל דָּוִ֗ד לֹ֤א תֵשֵׁב֙ בַּ/מְּצוּדָ֔ה לֵ֥ךְ וּ/בָֽאתָ לְּ/ךָ֖ אֶ֣רֶץ יְהוּדָ֑ה וַ/יֵּ֣לֶךְ דָּוִ֔ד וַ/יָּבֹ֖א יַ֥עַר חָֽרֶת־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/005.yaml
  text: Then Gad the prophet said to David[a], “Do not stay in the stronghold. Go and come for yourself to the land of Judah.” So David went and came to the forest of Hereth.
translation:
  language: hi
  text: तब गाद नबी ने दाऊद से कहा, “गढ़ में मत ठहरो। जाओ और यहूदा प्रदेश में प्रवेश करो।” तब दाऊद गया और हेरेत के वन में पहुँचा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַנָּבִיא
  choice: नबी
  rationale: נָבִיא के लिए यह आधुनिक हिन्दी में प्रचलित और सटीक धार्मिक पद है; यहाँ ‘द्रष्टा’ किसी भिन्न इब्रानी पद का आभास देता।
- source_word: לֹא תֵשֵׁב
  choice: मत ठहरो
  rationale: सन्दर्भ में יָשַׁב किसी स्थान पर बने रहने को व्यक्त करता है; ‘मत ठहरो’ स्वाभाविक हिन्दी में आज्ञा का बल बनाए रखता है।
- source_word: בַּמְּצוּדָה
  choice: गढ़ में
  rationale: מְצוּדָה सुरक्षित और सुदृढ़ शरणस्थान को सूचित करता है; ‘गढ़’ संक्षिप्त, सहज और प्रसंगानुकूल है।
- source_word: לֵךְ
  choice: जाओ
  rationale: הלך का आज्ञार्थक रूप सीधे जाने की आज्ञा देता है।
- source_word: וּבָאתָ לְּךָ אֶרֶץ יְהוּדָה
  choice: और यहूदा प्रदेश में प्रवेश करो
  rationale: בוא गन्तव्य में आने अथवा प्रवेश करने को व्यक्त कर सकता है। यहाँ ‘प्रवेश करो’ दिशा और सीमा-प्रदेश में पहुँचने का भाव स्वाभाविक रूप से देता है; לְךָ को हिन्दी में अलग आत्मवाचक पद से व्यक्त करना असहज और अनावश्यक होगा।
- source_word: אֶרֶץ יְהוּדָה
  choice: यहूदा प्रदेश
  rationale: אֶרֶץ के क्षेत्रीय अर्थ को ‘प्रदेश’ स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: יַעַר חָרֶת
  choice: हेरेत का वन
  rationale: יַעַר का सीधा अर्थ ‘वन’ है और חָרֶת स्थान-नाम के रूप में ‘हेरेत’ लिप्यन्तरित है।
- source_word: וַיֵּלֶךְ דָּוִד וַיָּבֹא
  choice: दाऊद वहाँ से चला गया और ... पहुँचा
  rationale: दोनों क्रमिक क्रियाओं को हिन्दी में स्वाभाविक कथा-प्रवाह के साथ व्यक्त करता है; ‘वहाँ से’ प्रस्थान को स्पष्ट करने वाला प्रसंगगत संकेत है और ‘पहुँचा’ בוא के गन्तव्य-केंद्रित अर्थ को दर्शाता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप अपनाया गया है। अनावश्यक रूप से शाब्दिक ‘अपने लिए आओ’ से बचते हुए इब्रानी दिशा-बोध को स्वाभाविक हिन्दी में रखा गया है।
