base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/010.yaml
  text: And he inquired of Yahweh for him[a], and gave him provisions, and gave him the sword of Goliath the Philistine.
translation:
  language: hi
  text: उसने उसके लिए याहवे से परामर्श किया[a], उसे रसद दी, और उसे पलिश्ती गोलियत की तलवार दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसने उसके लिए याहवे से पूछा।”
    reason: शׁאל בְּ + ईश्वरीय नाम का शाब्दिक निकटतर विकल्प; मुख्य पाठ में ‘परामर्श किया’ इस धार्मिक प्रयोग की स्वाभाविक हिन्दी अभिव्यक्ति है।
lexical_decisions:
- source_word: וַיִּשְׁאַל לוֹ בַּיהוָה
  choice: उसने उसके लिए याहवे से पूछा
  rationale: שׁאל के साथ ב + ईश्वरीय नाम यहाँ ईश्वर से मार्गदर्शन पूछने का धार्मिक भाव रखता है। לּוֹ को ‘उसके लिए’ कहना यह स्पष्ट करता है कि पूछना उसकी ओर से हुआ, जबकि मूल के सर्वनामों की अस्पष्टता बनी रहती है।
- source_word: בַּיהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत वाचा-नाम יהוה है; इसे उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ लिखा गया है।
- source_word: צֵידָה
  choice: यात्रा के लिए भोजन
  rationale: צֵידָה यात्रा हेतु साथ रखे जाने वाले भोजन या रसद को दर्शाता है। सामान्य हिन्दी में ‘यात्रा के लिए भोजन’ सहज और संदर्भानुकूल है।
- source_word: נָתַן לוֹ
  choice: उसे ... दिया / उसे दी
  rationale: दोनों बार आए נתן को दोनों बार ‘दिया/दी’ से व्यक्त किया गया है, जिससे इब्रानी की पुनरावृत्ति और आरोप की लय सुरक्षित रहती है।
- source_word: וְאֵת חֶרֶב גָּלְיָת הַפְּלִשְׁתִּי
  choice: और पलिश्ती गोलियत की तलवार
  rationale: यह रचना संबंधवाचक क्रम को स्वाभाविक हिन्दी में रखती है और गोलियत की पहचान ‘पलिश्ती’ के रूप में सुरक्षित करती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: यहाँ मूल पाठ उपाधि नहीं, चार-अक्षरीय व्यक्तिगत नाम का प्रयोग करता है; ‘याहवे’ उस वाचा-नाम को प्रत्यक्ष रूप से सुरक्षित रखता है।
- issue: याहवे से पूछने की क्रिया का स्वरूप
  choice: याहवे से पूछा
  alternative: याहवे से परामर्श किया
  rationale: ‘पूछा’ मूल क्रिया के निकट है और धार्मिक मार्गदर्शन माँगने का भाव संदर्भ से उभरने देता है; ‘परामर्श किया’ उसी निर्माण की वैध व्याख्या है, इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: कर्ता और लाभार्थी सर्वनामों की पहचान
  choice: उसने उसके लिए
  alternative: अहीमेलेक ने दाऊद के लिए
  rationale: इस पद में नाम नहीं, सर्वनाम हैं। नाम जोड़ने से संदर्भ स्पष्ट होता, पर मूल की अभिव्यक्ति से अधिक निश्चितता आती; इसलिए सर्वनाम बनाए रखे गए हैं।
translation_notes:
  register: भाषा आधुनिक, सरल और गरिमापूर्ण रखी गई है। ‘यात्रा के लिए भोजन’ सामान्य पाठक के लिए ‘रसद’ से अधिक स्पष्ट है। मूल के दोनों सर्वनाम और ‘दिया’ की पुनरावृत्ति सुरक्षित रखी गई है।
