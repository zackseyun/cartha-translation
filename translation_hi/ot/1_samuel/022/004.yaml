lexical_decisions:
- source_word: וַיַּנְחֵם
  choice: वह उन्हें ... ले गया
  rationale: इस रूप का प्रसंगगत अर्थ दाऊद के माता-पिता को मोआब के राजा की उपस्थिति में ले जाना है। ‘ले गया’ स्वाभाविक हिन्दी है और ‘सामने’ के साथ ठीक बैठता है; ‘पहुँचा दिया’ आशय को जरूरत से अधिक निश्चित करता।
- source_word: אֶת פְּנֵי
  choice: के सामने
  rationale: यह व्यक्तिवाचक पद के साथ ‘किसी की उपस्थिति में/सामने’ का मुहावरा है। ‘के सामने’ संक्षिप्त और सहज है।
- source_word: מֶלֶךְ מוֹאָב
  choice: मोआब के राजा
  rationale: सम्बन्धसूचक पदबंध का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: וַיֵּשְׁבוּ עִמּוֹ
  choice: वे उसके साथ ... रहे
  rationale: ישב यहाँ बैठने के बजाय निवास करने अथवा ठहरे रहने का भाव देता है। ‘रहे’ अवधि और साथ रहने—दोनों को सहजता से व्यक्त करता है।
- source_word: כָּל יְמֵי הֱיוֹת דָּוִד
  choice: उन सभी दिनों तक ... जब तक दाऊद ... रहा
  rationale: इब्रानी कालवाचक रचना की व्यापकता को बनाए रखते हुए आधुनिक हिन्दी में अवधि स्पष्ट की गई है।
- source_word: בַּמְּצוּדָה
  choice: गढ़ में
  rationale: מְצוּדָה यहाँ दाऊद के किलाबंद आश्रय को सूचित करता है। ‘गढ़’ संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य है।
