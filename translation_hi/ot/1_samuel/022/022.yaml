source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר דָּוִ֜ד לְ/אֶבְיָתָ֗ר יָדַ֜עְתִּי בַּ/יּ֤וֹם הַ/הוּא֙ כִּֽי שָׁם֙ דויג הָ/אֲדֹמִ֔י כִּֽי הַגֵּ֥ד יַגִּ֖יד לְ/שָׁא֑וּל אָנֹכִ֣י סַבֹּ֔תִי בְּ/כָל נֶ֖פֶשׁ בֵּ֥ית אָבִֽי/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/022.yaml
  text: David said to Abiathar[a], “I knew on that day, when Doeg the Edomite was there, that he would surely tell Saul[c][b]. I am responsible for all the lives of your father’s house.”
translation:
  language: hi
  text: दाऊद ने एब्यातार से कहा, “मैं उसी दिन जान गया था कि एदोमी दोएग वहाँ था और वह शाऊल को अवश्य बताएगा। तुम्हारे पिता के घराने के हर एक की मृत्यु का कारण मैं ही हूँ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדַעְתִּי
  choice: मैं ... जान गया था
  rationale: पूर्ण क्रिया दाऊद के उस दिन हुए बोध को व्यक्त करती है; हिन्दी में ‘जान गया था’ प्रसंगानुकूल और स्वाभाविक है।
- source_word: בַּיּוֹם הַהוּא
  choice: उसी दिन
  rationale: निर्दिष्ट बीते दिन पर बल को संक्षिप्त और स्वाभाविक हिन्दी में रखता है।
- source_word: כִּי שָׁם דויג הָאֲדֹמִי
  choice: कि एदोमी दोएग वहाँ है
  rationale: पहले כִּי को दाऊद ने जो जाना उसकी विषय-वस्तु बताने वाला माना गया है; इब्रानी की वास्तविक संरचनात्मक अस्पष्टता को फुटनोट में रखा गया है।
- source_word: כִּי הַגֵּד יַגִּיד לְשָׁאוּל
  choice: और वह शाऊल को अवश्य बता देगा
  rationale: क्रिया के साथ infinitive absolute से आए निश्चयात्मक बल को ‘अवश्य’ व्यक्त करता है; इब्रानी में कोई स्पष्ट कर्म नहीं है, इसलिए उसे जोड़ा नहीं गया।
- source_word: אָנֹכִי סַבֹּתִי
  choice: कारण मैं ही हूँ
  rationale: स्वतंत्र सर्वनाम אָנֹכִי के बल को ‘मैं ही’ रखता है और סבב के कारणात्मक/परिणामकारी अर्थ को स्पष्ट करता है।
- source_word: בְּכָל נֶפֶשׁ בֵּית אָבִיךָ
  choice: तुम्हारे पिता के घराने के सभी लोगों की मृत्यु
  rationale: נֶפֶשׁ यहाँ मारे गए व्यक्तियों/जीवनों को सूचित करता है; ‘सभी लोगों की मृत्यु’ हिन्दी में अर्थ को स्पष्ट करता है, जबकि בית אב को ‘पिता का घराना’ पारिवारिक-वंशीय अर्थ में रखता है।
theological_decisions:
- issue: दाऊद की उत्तरदायित्व-स्वीकृति की तीव्रता
  choice: तुम्हारे पिता के घराने के सभी लोगों की मृत्यु का कारण मैं ही हूँ
  alternative: तुम्हारे पिता के घराने के हर व्यक्ति के लिए मैं उत्तरदायी हूँ
  rationale: סַבֹּתִי का अधिक सीधा कारणात्मक अर्थ और אָנֹכִי का बल बनाए रखा गया है; इसे केवल सामान्य नैतिक उत्तरदायित्व तक हल्का नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण पर सहज। ‘एब्यातार,’ ‘दोएग,’ और ‘शाऊल’ नामों के प्रचलित हिन्दी बाइबलीय रूप रखे गए हैं। मुख्य पाठ में कारणात्मक दोष-स्वीकृति स्पष्ट की गई है और इब्रानी संयोजक की अस्पष्टता फुटनोट में सुरक्षित है।
