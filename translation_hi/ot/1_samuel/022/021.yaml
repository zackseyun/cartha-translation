translation:
  language: hi
  text: एब्यातार ने दाऊद को बताया कि शाऊल ने याहवे के याजकों को मार डाला था।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּגֵּד
  choice: बताया
  rationale: हिफ़इल रूप का अर्थ यहाँ किसी बात को ज्ञात कराना या बताना है; ‘बताया’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: אֶבְיָתָר
  choice: एब्यातार
  rationale: व्यक्तिनाम का हिब्रू उच्चारण के निकट देवनागरी लिप्यंतरण।
- source_word: לְדָוִד
  choice: दाऊद को
  rationale: उपसर्ग לְ अप्रत्यक्ष कर्म को चिह्नित करता है, जिसे हिन्दी में ‘को’ से व्यक्त किया गया है।
- source_word: כִּי
  choice: कि
  rationale: यह एब्यातार द्वारा बताई गई बात का परिचय देता है; हिन्दी में स्वाभाविक पूरक-समुच्चयबोधक ‘कि’ है।
- source_word: הָרַג
  choice: मार डाला था
  rationale: क्रिया जान लेने को व्यक्त करती है; ‘मार डाला’ परिणाम की पूर्णता बताता है और ‘था’ इस घटना को एब्यातार के बताने से पहले घटित दिखाता है।
- source_word: שָׁאוּל
  choice: शाऊल
  rationale: व्यक्तिनाम का प्रचलित हिन्दी बाइबलीय लिप्यंतरण।
- source_word: כֹּהֲנֵי יְהוָה
  choice: यहोवा के याजकों
  rationale: संबंधवाचक संरचना को हिन्दी में ‘के’ से व्यक्त किया गया है; ‘याजक’ כֹּהֵן का प्रतिष्ठित और समझ में आने वाला हिन्दी धार्मिक पद है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय हिन्दी में व्यापक रूप से पहचाने जाने वाले नामरूप ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबल-पाठकों में व्यापक रूप से पहचाना जाता है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता; ‘याहवे’ अधिक प्रत्यक्ष शैक्षिक लिप्यंतरण है, पर सामान्य हिन्दी में कम परिचित है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। वाक्यक्रम हिन्दी के स्वाभाविक ढाँचे के अनुसार है और पूर्वघटित क्रिया को ‘मार डाला था’ से स्पष्ट किया गया है।
