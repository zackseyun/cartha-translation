  text: שְׁבָ֤/ה אִתִּ/י֙ אַל תִּירָ֔א כִּ֛י אֲשֶׁר יְבַקֵּ֥שׁ אֶת נַפְשִׁ֖/י יְבַקֵּ֣שׁ אֶת נַפְשֶׁ֑/ךָ כִּֽי מִשְׁמֶ֥רֶת אַתָּ֖ה עִמָּדִֽ/י־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/023.yaml
  text: Stay with me[a]; do not be afraid, for he who seeks my life seeks your life also[b], for you are under my protection.
translation:
  language: hi
  text: मेरे साथ रहो; मत डरो, क्योंकि जो मेरे प्राण लेना चाहता है, वह तुम्हारे प्राण भी लेना चाहता है; क्योंकि तुम मेरे संरक्षण में हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के निकट: “क्योंकि तुम मेरे साथ सुरक्षा/रखवाली में हो।”'
    reason: मूल इब्रानी की असामान्य नामवाचक अभिव्यक्ति और מִשְׁמֶרֶת के ‘रखवाली/सुरक्षित संरक्षण’ वाले अर्थ को दिखाने के लिए।
lexical_decisions:
- source_word: שְׁבָה אִתִּי
  choice: मेरे साथ रहो
  rationale: ישׁב का यह आदेश यहाँ बैठने नहीं, दाऊद के साथ बने रहने का भाव देता है; आधुनिक हिन्दी में यह स्वाभाविक और सटीक है।
- source_word: אַל תִּירָא
  choice: मत डरो
  rationale: निषेधात्मक आदेश का संक्षिप्त, स्वाभाविक और वर्तमान हिन्दी रूप।
- source_word: אֲשֶׁר יְבַקֵּשׁ אֶת נַפְשִׁי
  choice: जो मेरे प्राण लेना चाहता है
  rationale: किसी के נֶפֶשׁ को ‘ढूँढ़ना’ यहाँ उसे मारने के उद्देश्य से उसके प्राण लेने की चेष्टा का मुहावरा है; शाब्दिक ‘मेरे प्राण खोजता है’ हिन्दी में अर्थ को अस्पष्ट कर देता।
- source_word: יְבַקֵּשׁ אֶת נַפְשֶׁךָ
  choice: वह तुम्हारे प्राण भी लेना चाहता है
  rationale: दोहराई गई इब्रानी अभिव्यक्ति को बनाए रखते हुए ‘भी’ दोनों व्यक्तियों पर एक ही जानलेवा खतरे का स्वाभाविक हिन्दी संकेत देता है।
- source_word: מִשְׁמֶרֶת אַתָּה עִמָּדִי
  choice: मेरे साथ तुम सुरक्षित हो
  rationale: מִשְׁמֶרֶת रखवाली, निगरानी या सुरक्षित संरक्षण का भाव रखता है। हिन्दी में यह रूप दाऊद के साथ अब्यातार की सुरक्षा को स्पष्ट करता है, जबकि पद की नामवाचक संरचना को भविष्यकालीन प्रतिज्ञा में नहीं बदलता।
theological_decisions:
- issue: अंतिम वाक्य में सुरक्षा का स्वरूप
  choice: मेरे साथ तुम सुरक्षित हो
  alternative: तुम मेरी सुरक्षा में हो / मेरे साथ तुम सुरक्षित रहोगे
  rationale: मूल पाठ की नामवाचक अभिव्यक्ति सुरक्षा या सुरक्षित रखे जाने का आश्वासन देती है, पर स्पष्ट भविष्यकालीन क्रिया नहीं रखती। चुना हुआ रूप किसी अतिरिक्त धार्मिक या अचूक सुरक्षा-सिद्धांत को जोड़े बिना कथन का बल बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्राण लेना चाहता है’ इब्रानी मुहावरे का अर्थ स्पष्ट करता है; अंतिम वाक्य सरल हिन्दी में है और उसकी शाब्दिक बनावट पादटिप्पणी में सुरक्षित है।
