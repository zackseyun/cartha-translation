base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/011.yaml
  text: Then the king sent to summon Ahimelech son of Ahitub the priest[a], and all his father's house, the priests who were at Nob; and they all came to the king.
translation:
  language: hi
  text: तब राजा ने याजक अहीतूब के पुत्र अहीमेलेक को, और उसके पिता के घराने के उन सभी याजकों को जो नोब में थे, बुलवा भेजा[a]; और वे सब राजा के पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “उसके पिता का घराना” केवल उसका निकट परिवार नहीं, बल्कि उसके पिता की ओर का विस्तृत परिवार या कुल है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּשְׁלַח ... לִקְרֹא
  choice: बुलाने के लिए संदेश भेजा
  rationale: राजकीय प्रसंग में यह संयुक्त अभिव्यक्ति किसी को आधिकारिक रूप से उपस्थित होने के लिए बुलवाने का भाव देती है; यह हिन्दी में स्वाभाविक है और क्रिया के दोनों अंगों को व्यक्त करती है।
- source_word: אֲחִימֶלֶךְ בֶּן אֲחִיטוּב הַכֹּהֵן
  choice: अहीतूब के पुत्र अहीमेलेक याजक
  rationale: नामों का देवनागरी लिप्यंतरण किया गया है, पुत्र-संबंध सीधे रखा गया है, और 'याजक' पदनाम को समानाधिकरण में सुरक्षित रखा गया है।
- source_word: כָּל בֵּית אָבִיו
  choice: उसके पिता के घराने के सभी
  rationale: '''पिता का घराना'' हिब्रू के पैतृक विस्तृत परिवार या कुल की सांस्कृतिक संकल्पना को निकटता से व्यक्त करता है; फुटनोट संभावित आधुनिक गलतफहमी स्पष्ट करता है।'
- source_word: הַכֹּהֲנִים אֲשֶׁר בְּנֹב
  choice: नोब में रहनेवाले ... सभी याजकों
  rationale: यह वाक्यांश उस पैतृक घराने को नोब में स्थित याजक-समुदाय के रूप में और स्पष्ट करता है।
- source_word: וַיָּבֹאוּ כֻלָּם אֶל הַמֶּלֶךְ
  choice: और वे सब राजा के पास आए
  rationale: '''वे सब'' כֻּלָּם के समग्र बल को बनाए रखता है, जबकि ''राजा के पास'' אֶל के दिशात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।'
