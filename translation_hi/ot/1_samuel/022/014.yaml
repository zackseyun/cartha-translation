source:
  edition: WLC
  text: וַ/יַּ֧עַן אֲחִימֶ֛לֶךְ אֶת הַ/מֶּ֖לֶךְ וַ/יֹּאמַ֑ר וּ/מִ֤י בְ/כָל עֲבָדֶ֨י/ךָ֙ כְּ/דָוִ֣ד נֶאֱמָ֔ן וַ/חֲתַ֥ן הַ/מֶּ֛לֶךְ וְ/סָ֥ר אֶל מִשְׁמַעְתֶּ֖/ךָ וְ/נִכְבָּ֥ד בְּ/בֵיתֶֽ/ךָ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/014.yaml
  text: Ahimelech answered the king and said[a], “And who among all your servants is as faithful as David, the king’s son-in-law, who has access to your council[b], and is honored in your house?”
translation:
  language: hi
  text: अहीमेलेक ने राजा को उत्तर दिया, “आपके सब सेवकों में दाऊद के समान विश्वासयोग्य कौन है? वह राजा का दामाद है, आपकी आज्ञा पर हाज़िर रहता है[a], और आपके घराने में सम्मानित है[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस हिब्रू पदबंध का अर्थ “आपकी आज्ञा मानता है” या “आपकी मंत्रणा तक उसकी पहुँच है” भी हो सकता है।
    reason: मूल अभिव्यक्ति आज्ञापालन, राजा के बुलावे पर तत्परता, या निकट दरबारी पहुँच में से एक से अधिक भाव दे सकती है।
  - marker: b
    text: “घराने” से यहाँ राजा का परिवार, राजपरिवार अथवा राजदरबार अभिप्रेत हो सकता है।
    reason: हिब्रू ‘घर’ का अर्थ प्रसंगानुसार भवन से व्यापक होकर घराना या दरबार भी हो सकता है।
lexical_decisions:
- source_word: וַיַּעַן אֲחִימֶלֶךְ אֶת־הַמֶּלֶךְ וַיֹּאמַר
  choice: अहीमेलेक ने राजा को उत्तर दिया
  rationale: हिब्रू कथा-शैली में ‘उत्तर दिया और कहा’ वाणी का मानक परिचय है; स्वाभाविक हिन्दी में अनावश्यक पुनरुक्ति हटाकर ‘उत्तर दिया’ पर्याप्त और सटीक है।
- source_word: וּמִי בְכָל־עֲבָדֶיךָ כְּדָוִד נֶאֱמָן
  choice: आपके सब सेवकों में दाऊद के समान विश्वासयोग्य कौन है?
  rationale: प्रश्न की अलंकारिक शक्ति और נֶאֱמָן में निहित भरोसेमंदी तथा निष्ठा, दोनों को ‘विश्वासयोग्य’ व्यक्त करता है।
- source_word: וַחֲתַן הַמֶּלֶךְ
  choice: वह राजा का दामाद है
  rationale: חָתָן यहाँ शाऊल के साथ दाऊद के पारिवारिक संबंध को स्पष्ट रूप से बताता है; अलग वाक्यखंड हिन्दी में समन्वित हिब्रू पदों को सहज बनाता है।
- source_word: וְסָר אֶל־מִשְׁמַעְתֶּךָ
  choice: आपकी आज्ञा पर हाज़िर रहता है
  rationale: यह कठिन पदबंध राजा के बुलावे या आदेश के प्रति तत्पर उपस्थिति का भाव दे सकता है। यह चयन उसकी दरबारी भूमिका को अनावश्यक रूप से निश्चित किए बिना स्वाभाविक हिन्दी देता है; अन्य सम्भव अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: וְנִכְבָּד בְּבֵיתֶךָ
  choice: आपके घराने में सम्मानित है
  rationale: נִכְבָּד का अर्थ ‘सम्मानित’ है, और בַּיִת इस संदर्भ में केवल भवन नहीं बल्कि राजघराने या राजकीय परिवार/परिसर को सूचित कर सकता है; ‘घराना’ इस व्यापकता को सहज रूप से रखता है।
theological_decisions:
- issue: וְסָר אֶל־מִשְׁמַעְתֶּךָ की अस्पष्ट दरबारी अभिव्यक्ति
  choice: आपकी आज्ञा पर हाज़िर रहता है
  alternative: आपकी आज्ञा मानता है; आपकी मंत्रणा तक उसकी पहुँच है
  rationale: मूल पदबंध आज्ञापालन, बुलावे पर उपस्थित होने, अथवा राजा की गोपनीय मंत्रणा तक पहुँच का संकेत दे सकता है। मुख्य पाठ में एक व्यापक दरबारी अर्थ रखा गया है और विकल्प पादटिप्पणी में दिए गए हैं, ताकि अस्पष्टता को किसी विशेष पद या अधिकार के रूप में न सुलझाया जाए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘हाज़िर’ प्रचलित हिन्दी शब्द है और राजकीय बुलावे के प्रति तत्परता को स्वाभाविक ढंग से व्यक्त करता है। अलंकारिक प्रश्न को स्पष्ट प्रश्नचिह्न के साथ रखा गया है।
