base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/018.yaml
  text: Then the king said to Doeg[a], “Turn and strike down the priests.” So Doeg the Edomite turned and struck down the priests, and on that day he put to death eighty-five men who wore a linen ephod.
translation:
  language: hi
  text: तब राजा ने दोएग से कहा, “तुम मुड़ो और याजकों पर वार करो[a]।” तब एदोमी दोएग ने मुड़कर याजकों पर वार किया, और उस दिन उसने सन का एपोद पहने हुए पचासी पुरुषों को मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजकों पर आक्रमण करो” अथवा “याजकों पर टूट पड़ो।” इब्रानी क्रिया हिंसक आक्रमण का व्यापक अर्थ रख सकती है; यहाँ ‘वार करो’ चुना गया है, जबकि आगे ‘मार डाला’ उसके प्राणघातक परिणाम को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: סֹב
  choice: मुड़ो
  rationale: आज्ञार्थक रूप लक्ष्य की ओर मुड़कर आदेश पूरा करने को व्यक्त करता है; संक्षिप्त रूप आदेश की आकस्मिकता बनाए रखता है।
- source_word: וּפְגַע / וַיִּפְגַּע
  choice: पर वार करो / पर वार किया
  rationale: פגע यहाँ हिंसक प्रहार या आक्रमण को दर्शाता है। ‘वार करना’ क्रिया की हिंसा को व्यक्त करता है, पर बाद के परिणामसूचक ‘मार डाला’ में इसे समय से पहले नहीं मिला देता।
- source_word: הַכֹּהֲנִים
  choice: याजकों
  rationale: निश्चित बहुवचन का प्रचलित और संदर्भानुकूल हिन्दी रूप।
- source_word: הָאֲדֹמִי
  choice: एदोमी
  rationale: दोएग की जातीय पहचान बताने वाले विशेषण का सीधा अनुवाद।
- source_word: וַיָּמֶת
  choice: उसने ... मार डाला
  rationale: हिफ़ील रूप कारणात्मक परिणाम व्यक्त करता है। कर्ता स्वाभाविक रूप से पिछले उपवाक्य का दोएग है।
- source_word: שְׁמֹנִים וַחֲמִשָּׁה אִישׁ
  choice: पचासी पुरुषों
  rationale: गिनती के बाद איש यहाँ पुरुष याजकों को सूचित करता है; इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: נֹשֵׂא אֵפוֹד בָּד
  choice: मलमल का एपोद पहने हुए
  rationale: נשא वस्त्र के संबंध में ‘पहने होना’ दर्शा सकता है। בד महीन सन के वस्त्र को सूचित करता है, जिसके लिए बाइबिलीय हिन्दी में ‘मलमल’ स्वाभाविक है; ‘एपोद’ विशिष्ट याजकीय वस्त्र का लिप्यंतरण है।
- source_word: וַיֹּאמֶר הַמֶּלֶךְ
  choice: तब राजा ने ... कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; ‘तब’ आधुनिक हिन्दी में घटनाक्रम को सहज रूप से व्यक्त करता है।
