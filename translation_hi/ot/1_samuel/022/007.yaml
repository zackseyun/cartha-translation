base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/007.yaml
  text: Then Saul said to his servants who were standing around him, “Listen, please, sons of Benjamin! Will the son of Jesse also give all of you fields and vineyards? Will he make all of you commanders of thousands and commanders of hundreds?”
translation:
  language: hi
  text: तब शाऊल ने अपने चारों ओर खड़े सेवकों से कहा, “हे बिन्यामीनियो, ज़रा सुनो! क्या यिशै का पुत्र भी तुम सबको खेत और दाख की बारियाँ देगा? क्या वह तुम सबको हज़ारों के प्रधान और सैकड़ों के प्रधान बनाएगा?”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עֲבָדָיו
  choice: उसके सेवकों
  rationale: עֶבֶד का यहाँ प्रसंगानुकूल अर्थ राजा के अधीन सेवा करने वाले अधिकारी/सेवक हैं; ‘सेवक’ स्रोत की व्यापकता बनाए रखता है।
- source_word: הַנִּצָּבִים עָלָיו
  choice: अपने चारों ओर खड़े
  rationale: मुहावरा शाऊल के पास उपस्थित और उसके आसपास खड़े सेवकों को दर्शाता है; सहज हिन्दी में स्थानगत भाव व्यक्त किया गया है।
- source_word: שִׁמְעוּ נָא
  choice: ज़रा सुनो
  rationale: נָא अनुरोध अथवा आग्रह का कण है; यहाँ शाऊल के तीखे संबोधन में ‘ज़रा’ उसका बल स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּנֵי יְמִינִי
  choice: बिन्यामीन के पुत्रो
  rationale: शाब्दिक गोत्रीय संबोधन को बनाए रखा गया है; यह शाऊल द्वारा अपने बिन्यामीनी समर्थकों को संबोधित करने का संकेत देता है।
- source_word: בֶּן יִשַׁי
  choice: यिशै का पुत्र
  rationale: शाऊल दाऊद का नाम न लेकर उसे उसके पिता से पहचानता है; स्रोत का यह तिरस्कारपूर्ण या दूरी दर्शाने वाला ढंग सुरक्षित रखा गया है।
- source_word: שָׂרֵי אֲלָפִים וְשָׂרֵי מֵאוֹת
  choice: हज़ारों के प्रधान और सैकड़ों के प्रधान
  rationale: सैन्य-प्रशासनिक पदों का औपचारिक और पारंपरिक अर्थ रखा गया है, बिना आधुनिक पदनाम थोपे।
