  text: הַ/יּ֧וֹם הַחִלֹּ֛תִי ל/שאול ל֥/וֹ בֵ/אלֹהִ֖ים חָלִ֣ילָ/ה לִּ֑/י אַל יָשֵׂם֩ הַ/מֶּ֨לֶךְ בְּ/עַבְדּ֤/וֹ דָבָר֙ בְּ/כָל בֵּ֣ית אָבִ֔/י כִּ֠י לֹֽא יָדַ֤ע עַבְדְּ/ךָ֙ בְּ/כָל זֹ֔את דָּבָ֥ר קָטֹ֖ן א֥וֹ גָדֽוֹל־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/015.yaml
  text: Was today the first time that I inquired of God for him? Far be it from me! Let not the king impute anything to his servant or to all my father’s house[a], for your servant knew nothing of all this, whether small or great.
translation:
  language: hi
  text: क्या आज मैंने पहली बार उसके लिए परमेश्वर से पूछा था?[a] मुझसे ऐसा न हो! राजा अपने दास या मेरे पिता के सारे घराने पर कोई आरोप न लगाए, क्योंकि आपके दास को इस सब के विषय में कुछ भी, छोटा हो या बड़ा, मालूम न था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “क्या मैंने आज उसके लिए परमेश्वर से पूछना आरम्भ किया?” इब्रानी का यह आलंकारिक प्रश्न संकेत करता है कि अहीमेलेक ने यह काम पहली बार नहीं किया था।
    reason: शाब्दिक विकल्प और आलंकारिक प्रश्न का निहितार्थ स्पष्ट करना।
lexical_decisions:
- source_word: הַיּוֹם הַחִלֹּתִי
  choice: क्या आज ही मैंने पहली बार... पूछा था?
  rationale: शाब्दिक रूप ‘क्या मैंने आज आरम्भ किया?’ है। प्रसंग में यह आलंकारिक प्रश्न है, जिसका आशय है कि अहीमेलेक ने दाऊद के लिए परमेश्वर से पूछना आज पहली बार नहीं किया था। मुख्य पाठ स्वाभाविक हिन्दी में इस निहितार्थ को व्यक्त करता है, जबकि पादटिप्पणी अधिक औपचारिक रूप सुरक्षित रखती है।
- source_word: לִשְׁאוֹל לוֹ בֵאלֹהִים
  choice: उसके लिए परमेश्वर से पूछा
  rationale: यह पदबंध परमेश्वर से मार्गदर्शन या निर्णय पूछने को दर्शाता है। ‘उसके लिए’ से לוֹ का हितार्थक भाव और दाऊद का संदर्भ बना रहता है।
- source_word: חָלִילָה לִּי
  choice: ऐसा करना मुझसे दूर रहे!
  rationale: यह प्रबल अस्वीकार का सूत्र है। यह हिन्दी अभिव्यक्ति उसकी गंभीरता और आत्म-विमुखता को बनाए रखती है।
- source_word: אַל יָשֵׂם ... בְּעַבְדּוֹ דָבָר
  choice: अपने दास ... पर किसी बात का दोष न लगाए
  rationale: यहाँ שׂים के साथ ב किसी बात को किसी के विरुद्ध रखने या उस पर दोष मढ़ने का भाव देता है। ‘दोष न लगाए’ आधुनिक हिन्दी में न्यायिक-अभियोग का आशय स्पष्ट करता है।
- source_word: בְּכָל בֵּית אָבִי
  choice: मेरे पिता के सारे घराने पर
  rationale: ‘पिता का घराना’ विस्तृत परिवार या कुल को सूचित करने वाला बाइबलीय पदबंध है और हिन्दी में समझने योग्य है।
- source_word: לֹא יָדַע עַבְדְּךָ בְּכָל זֹאת
  choice: आपके दास को इस सारे मामले की ... मालूम न थी
  rationale: अहीमेलेक का आदरसूचक आत्म-संदर्भ ‘आपके दास’ के रूप में रखा गया है। ‘इस सारे मामले’ से आरोपाधीन पूरी घटना का संकेत मिलता है।
- source_word: דָּבָר קָטֹן אוֹ גָדוֹל
  choice: कोई भी बात—छोटी या बड़ी—
  rationale: ‘छोटी या बड़ी’ एक समग्रतासूचक युग्म है, जो किसी भी स्तर की जानकारी होने का पूर्ण निषेध करता है।
