review_pass:
  verdict: revise
  source_fidelity: The draft accurately preserves the rhetorical question, the beneficiary ‘for him,’ the emphatic repudiation, the king’s potential accusation against Ahimelech and his whole paternal household, and Ahimelech’s comprehensive denial of knowledge. A slight revision more directly represents ‘impute any matter’ and the Hebrew merism ‘small or great.’
  naturalness: “ऐसा करना मुझसे दूर रहे” is understandable but less idiomatic as a standalone repudiation formula. “मुझसे ऐसा न हो!” is concise, natural, and emphatic. The final clause is smoother when the total denial is expressed without the redundant “कोई भी बात … मालूम न थी.”
  terminology: “परमेश्वर,” “राजा,” “दास,” and “पिता का घराना” suit the reverent courtly register. “आरोप न लगाए” adequately conveys the adversative, forensic sense of placing a matter against someone.
  issues:
  - severity: low
    issue: The repudiation formula is somewhat unnatural in the current wording.
    rationale: חָלִילָה לִּי is an emphatic self-disavowal; “मुझसे ऐसा न हो!” is a more idiomatic Hindi equivalent than “ऐसा करना मुझसे दूर रहे!”.
  - severity: low
    issue: The final denial is syntactically heavy and slightly redundant.
    rationale: “इस सारे मामले की कोई भी बात—छोटी या बड़ी—मालूम न थी” can be simplified while retaining the exhaustive Hebrew expression.
  - severity: low
    issue: “किसी बात का दोष न लगाए” can suggest blame for a particular fault rather than imputing any matter against the persons named.
    rationale: “कोई आरोप न लगाए” more directly reflects the Hebrew construction without altering the meaning.
