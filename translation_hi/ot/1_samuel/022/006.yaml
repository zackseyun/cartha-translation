base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/006.yaml
  text: Saul heard that David and the men who were with him had become known[a]. Now Saul was sitting at Gibeah, under the tamarisk tree on the height, with his spear in his hand[b], and all his servants were standing around him.
translation:
  language: hi
  text: शाऊल ने सुना कि दाऊद और उसके साथ के लोगों का पता चल गया था[a]। उस समय शाऊल गिबा में, ऊँचाई पर झाऊ के वृक्ष के नीचे बैठा था[b]। उसका भाला उसके हाथ में था, और उसके सभी सेवक उसके चारों ओर खड़े थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद और उसके साथ के लोग खोज लिए गए थे” या “उनका भेद खुल गया था।” इब्रानी क्रिया का अर्थ यह भी हो सकता है कि दाऊद के ठिकाने का पता लग गया था।
    reason: lexical_alternative
  - marker: b
    text: या संभवतः, “रामा में झाऊ के वृक्ष के नीचे।” इब्रानी בָּרָמָה को सामान्य संज्ञा “ऊँचाई पर” अथवा स्थाननाम “रामा में” समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיִּשְׁמַע
  choice: ने सुना
  rationale: यहाँ שׁמע का सामान्य अर्थ समाचार सुनना है; हिन्दी कथा-शैली में ‘ने सुना’ स्वाभाविक और मूल के निकट है।
- source_word: כִּי נוֹדַע דָּוִד וַאֲנָשִׁים אֲשֶׁר אִתּוֹ
  choice: कि दाऊद और उसके साथ के लोगों का पता चल गया है
  rationale: ידע के निफ़अल रूप में ‘ज्ञात होना/पता चलना’ या ‘खोज लिया जाना’ दोनों भाव संभव हैं। प्रसंग में उनके छिपे स्थान या गतिविधि की खबर मिलने का भाव है; यह अनुवाद उस अर्थ को सहज हिन्दी में रखता है।
- source_word: יוֹשֵׁב
  choice: बैठा था
  rationale: कृदन्त पृष्ठभूमि में जारी अवस्था दिखाता है; ‘बैठा था’ दृश्य को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: בַּגִּבְעָה
  choice: गिबा में
  rationale: इसे स्थाननाम गिबा माना गया है; हिन्दी में नगर के लिए ‘में’ स्वाभाविक है।
- source_word: תַּחַת הָאֶשֶׁל
  choice: झाऊ के पेड़ के नीचे
  rationale: אֵשֶׁל को सामान्यतः टैमरिस्क माना जाता है; ‘झाऊ’ इसका समझने योग्य हिन्दी वृक्षनाम है।
- source_word: בָּרָמָה
  choice: ऊँचाई पर
  rationale: लेखयुक्त रूप और वाक्य-संरचना यहाँ सामान्य संज्ञा ‘ऊँचाई’ के पक्ष में हैं, यद्यपि ‘रामा में’ भी संभव है।
- source_word: וַחֲנִיתוֹ בְיָדוֹ
  choice: उसका भाला उसके हाथ में था
  rationale: मूल का क्रियारहित उपवाक्य शाऊल की मुद्रा का स्पष्ट चित्र देता है; हिन्दी में पूर्ण वाक्य उसी बल को बनाए रखता है।
- source_word: וְכָל עֲבָדָיו נִצָּבִים עָלָיו
  choice: उसके सभी सेवक उसके चारों ओर खड़े थे
  rationale: עֲבָדִים राजकीय सेवकों, परिचारकों या अधिकारियों को सूचित कर सकता है। ‘सेवक’ व्यापक अर्थ रखता है और נִצָּבִים עָלָיו की दरबारी स्थिति को ‘चारों ओर खड़े’ स्पष्ट करता है।
