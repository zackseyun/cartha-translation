base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/020.yaml
  text: But one son of Ahimelech son of Ahitub escaped[a], and his name was Abiathar, and he fled after David.
translation:
  language: hi
  text: परन्तु अहीतूब के पुत्र अहीमेलेक का एक पुत्र बच निकला। उसका नाम एब्यातार था, और वह दाऊद के पीछे भाग गया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद के पास भाग गया।” इब्रानी में शाब्दिक रूप से “दाऊद के पीछे” है; इसका अर्थ उसके पीछे जाकर उससे मिलना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּמָּלֵט
  choice: बच निकला
  rationale: निफ़ाल रूप यहाँ पिछले वर्णित संहार से सफलतापूर्वक निकल बचने को दर्शाता है। ‘बच निकला’ जीवित बचने और वहाँ से निकल जाने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֵּן אֶחָד
  choice: एक पुत्र
  rationale: शाब्दिक अर्थ ‘एक पुत्र’ है; वंशावली-संबंधी संदर्भ में בֵּן वास्तविक पुत्र को सूचित करता है और केवल एक वंशज के बचने पर बल देता है।
- source_word: לַאֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: अहीतूब के पुत्र अहीमेलेक का
  rationale: לְ यहाँ संबंध दिखाता है। हिन्दी में संबंधों को स्पष्ट और स्वाभाविक क्रम में रखते हुए दोनों पीढ़ियों की पहचान सुरक्षित रखी गई है।
- source_word: וּשְׁמוֹ אֶבְיָתָר
  choice: उसका नाम एब्यातार था
  rationale: यह सीधा नाम-परिचय वाक्यांश है; चयन मूल अर्थ के निकट और आधुनिक हिन्दी में सहज है।
- source_word: וַיִּבְרַח
  choice: भाग गया
  rationale: בּרח का अर्थ भागना या पलायन करना है। पहले क्रिया के ‘बच निकला’ से भेद बनाए रखते हुए यहाँ ‘भाग गया’ रखा गया है।
- source_word: אַחֲרֵי דָוִד
  choice: दाऊद के पीछे
  rationale: אַחֲרֵי का प्रत्यक्ष अर्थ ‘पीछे’ है। यह प्रसंग में दाऊद से जा मिलने के लिए उसके पीछे जाने का भाव भी दे सकता है; मुख्य पाठ मूल की अभिव्यक्ति और उसकी अस्पष्टता बनाए रखता है।
- source_word: וַ
  choice: परन्तु
  rationale: आरम्भिक वाव पिछले संहार के बावजूद एक पुत्र के बच निकलने का हल्का विरोधाभास प्रकट करता है; ‘परन्तु’ इसे स्पष्ट करता है।
- source_word: אֶבְיָתָר
  choice: एब्यातार
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲחִימֶלֶךְ
  choice: अहीमेलेक
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
- source_word: אֲחִיטוּב
  choice: अहीतूब
  rationale: इब्रानी नाम का प्रचलित हिन्दी लिप्यंतरण।
