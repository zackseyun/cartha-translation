base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/008.yaml
  text: For all of you have conspired against me[a], and no one informs me when my son makes a covenant with the son of Jesse, and none of you is grieved for me or informs me that my son has stirred up my servant against me to lie in wait[d][c][b], as at this day.
translation:
  language: hi
  text: क्योंकि तुम सबने मेरे विरुद्ध षड्यंत्र रचा है, और मेरे पुत्र के यिशै के पुत्र[c] के साथ वाचा बाँधने पर कोई मुझे इसकी सूचना नहीं देता[a]। तुममें से किसी को मेरी चिंता नहीं है[b], न कोई मुझे यह बताता है कि मेरे पुत्र ने मेरे सेवक को मेरे विरुद्ध घात लगाने के लिए उकसाया है[d], जैसा कि आज है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘मेरा कान खोलता है’; यह किसी को सूचना देने या कोई बात बताने का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘तुममें से किसी को मेरे लिए दुःख नहीं होता’ अथवा ‘किसी को मुझसे सहानुभूति नहीं है।’
    reason: lexical_alternative
  - marker: c
    text: ‘यिशै का पुत्र’ दाऊद के लिए प्रयुक्त है; शाऊल यहाँ दाऊद का नाम लेने के बजाय उसके पिता के नाम से उसे संबोधित करता है।
    reason: cultural_note
  - marker: d
    text: या, ‘मेरे सेवक को मेरे विरुद्ध घात लगाने के लिए खड़ा किया है।’
    reason: lexical_alternative
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: षड्यंत्र रचा है
  rationale: यहाँ क्रिया शाऊल के विरुद्ध विश्वासघाती और शत्रुतापूर्ण मिलीभगत का आरोप व्यक्त करती है; ‘षड्यंत्र रचा’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: גֹּלֶה אֶת אָזְנִי
  choice: मुझे इसकी सूचना नहीं दी / मुझे यह बताता
  rationale: इब्रानी मुहावरे का शाब्दिक अर्थ ‘मेरा कान खोलना’ है, पर आशय किसी बात की सूचना देना या उसे प्रकट करना है। प्रसंगानुसार दोनों हिन्दी रूप स्वाभाविक हैं।
- source_word: בִּכְרָת
  choice: जब ... वाचा बाँधी
  rationale: ב के साथ infinitive construct उस परिस्थिति या समय को सूचित करता है जब वाचा की गई। ‘वाचा बाँधना’ स्रोत के ‘वाचा काटना’ मुहावरे का गरिमापूर्ण और परिचित हिन्दी रूप है।
- source_word: בְּנִי עִם בֶּן יִשַׁי
  choice: मेरे पुत्र ने यिशै के पुत्र के साथ
  rationale: ‘मेरे पुत्र’ से योनातान और ‘यिशै के पुत्र’ से दाऊद अभिप्रेत हैं। नाम जोड़ने के बजाय शाऊल की दूरी दर्शाने वाली मूल पितृनाम-संज्ञा सुरक्षित रखी गई है।
- source_word: חֹלֶה ... עָלַי
  choice: किसी को मेरी चिंता नहीं है
  rationale: यहाँ חלה शाब्दिक बीमारी नहीं, बल्कि शाऊल के प्रति सहानुभूतिपूर्ण दुख या चिंता व्यक्त करता है। ‘मेरी चिंता’ सहज हिन्दी में इस भाव को व्यक्त करता है।
- source_word: הֵקִים
  choice: खड़ा किया है
  rationale: הקים का मूल अर्थ ‘खड़ा करना/उठाना’ सुरक्षित रखा गया है। प्रसंग में इसका आशय किसी को शाऊल के विरुद्ध सक्रिय करना हो सकता है, पर अनुवाद उस व्याख्या को अनावश्यक रूप से निर्णायक नहीं बनाता।
- source_word: עַבְדִּי
  choice: मेरे सेवक
  rationale: दाऊद यहाँ शाऊल के राजकीय अधीनस्थ के रूप में प्रस्तुत है; ‘सेवक’ उपयुक्त है, जबकि ‘दास’ अनावश्यक रूप से संपत्ति-संबंध का अर्थ दे सकता है।
- source_word: לְאֹרֵב
  choice: घात लगाने के लिए
  rationale: ארב छिपकर आक्रमण की प्रतीक्षा करने या घात लगाने का भाव देता है। हिन्दी में यह स्पष्ट और स्वाभाविक है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा कि आज हो रहा है
  rationale: मुहावरा वर्तमान स्थिति की ओर संकेत करता है। यह रूप अर्थ को स्पष्ट रखते हुए शाऊल के आरोप की तात्कालिकता व्यक्त करता है।
theological_decisions:
- issue: הֵקִים में उकसाने या केवल खड़ा करने का भाव
  choice: खड़ा किया है
  alternative: भड़का दिया है
  rationale: मूल क्रिया अपने आप में ‘उकसाने’ को अनिवार्य नहीं करती। ‘खड़ा किया’ शाऊल के आरोप को व्यक्त करता है और यह अस्पष्टता बनाए रखता है कि योनातान ने दाऊद को सक्रिय रूप से भड़काया था या शाऊल ऐसा आरोप लगा रहा है।
- issue: पात्रों के नाम स्पष्ट करना
  choice: ‘मेरे पुत्र’ और ‘यिशै के पुत्र’ को मूल रूप में रखा
  alternative: ‘योनातान’ और ‘दाऊद’ जोड़ना
  rationale: शाऊल का दाऊद का नाम न लेकर उसे ‘यिशै का पुत्र’ कहना कथात्मक और भावात्मक रूप से महत्वपूर्ण है; अनुवाद में इसे सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज शैली रखी गई है। शाऊल के तीखे आरोप को छोटे वाक्यों और ‘तुम सबने’ से उभारा गया है। ‘वाचा’, ‘यिशै’ और ‘सेवक’ जैसे पारंपरिक बाइबलीय पद सामान्य हिन्दी वाक्य-विन्यास में रखे गए हैं। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
