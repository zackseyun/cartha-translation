source:
  edition: WLC
  text: וַ/יֹּ֣אמֶר הַ/מֶּ֔לֶךְ מ֥וֹת תָּמ֖וּת אֲחִימֶ֑לֶךְ אַתָּ֖ה וְ/כָל בֵּ֥ית אָבִֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/016.yaml
  text: But the king said[a], “You shall surely die, Ahimelech[b], you and all your father's house.”
translation:
  language: hi
  text: परन्तु राजा ने कहा, “अहीमेलेक, तू निश्चय ही मरेगा[a]—तू और तेरे पिता का सारा घराना[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुझे अवश्य मरना होगा।” इब्रानी में एक ही क्रिया-मूल के दो रूप साथ रखकर बात पर बहुत जोर दिया गया है।
    reason: lexical_alternative
  - marker: b
    text: “तेरे पिता का घराना” से आशय उसके पैतृक परिवार या वंशगत गृहसमूह से है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: ने कहा
  rationale: אמר का कथात्मक रूप सामान्यतः ‘कहा’ से स्वाभाविक और ठीक व्यक्त होता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पद वक्ता की पहचान राजा के रूप में करता है; हिन्दी में कर्ता के साथ अलग निश्चित उपपद आवश्यक नहीं है।
- source_word: מוֹת תָּמוּת
  choice: तू निश्चय ही मरेगा
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute मृत्यु की घोषणा पर प्रबल बल देता है; ‘निश्चय ही’ उस तीव्रता को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: אֲחִימֶלֶךְ
  choice: अहीमेलेक
  rationale: व्यक्तिनाम का ध्वन्यात्मक लिप्यंतरण किया गया है।
- source_word: אַתָּה
  choice: तू
  rationale: स्पष्ट सर्वनाम पर बल है; संबोधन के बाद इसे दोहराकर उस बल को बनाए रखा गया है।
- source_word: וְכָל
  choice: और ... सारा
  rationale: यह दण्ड की घोषणा को अहीमेलेक से आगे उसके पूरे पैतृक घराने तक विस्तृत करता है।
- source_word: בֵּית אָבִיךָ
  choice: तेरे पिता का सारा घराना
  rationale: शाब्दिक ‘तेरे पिता का घर’ यहाँ पैतृक परिवार या वंशगत गृहसमूह का मुहावरा है; ‘घराना’ आधुनिक हिन्दी में इस सामूहिक अर्थ को स्पष्ट रखता है।
theological_decisions:
- issue: מוֹת תָּמוּת का भाव—भविष्यवाणी या न्यायिक आदेश
  choice: तू निश्चय ही मरेगा
  alternative: तुझे अवश्य मरना होगा
  rationale: हिब्रू रचना प्रबल निश्चितता व्यक्त करती है और प्रसंग में न्यायिक स्वर भी रखती है। चुना हुआ अनुवाद किसी एक व्याख्या को अनावश्यक रूप से निश्चित किए बिना दोनों आयामों को सम्भव रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘तू/तेरे’ राजा के कठोर, अधिकारपूर्ण संबोधन तथा इब्रानी के एकवचन सर्वनाम को दर्शाता है। दीर्घ विराम-चिह्न स्पष्ट सर्वनाम אַתָּה के बल को सहज हिन्दी में उभारता है।
