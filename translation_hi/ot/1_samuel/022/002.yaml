base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/002.yaml
  text: And everyone in distress[a], everyone who was in debt, and everyone bitter in soul gathered to him, and he became commander over them[b]. About four hundred men were with him.
translation:
  language: hi
  text: तब संकट में पड़ा हुआ हर व्यक्ति, हर वह व्यक्ति जिसका कोई लेनदार था[a], और हर वह व्यक्ति जिसके मन में कड़वाहट थी[b], उसके पास इकट्ठे हुए; और वह उनका अगुआ बन गया। उसके साथ लगभग चार सौ पुरुष थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक भावार्थपूर्ण रूप में, “जो कर्ज़दार था।” इब्रानी में शाब्दिक रूप से, “जिसका कोई लेनदार/वसूली करनेवाला था।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से, “मन का कड़वा”; यह गहरी भीतरी कड़वाहट या व्यथा का मुहावरा है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיִּתְקַבְּצוּ אֵלָיו
  choice: उसके पास इकट्ठा हुआ
  rationale: क्रिया लोगों के एक साथ आने और אֵלָיו दाऊद की ओर आने को व्यक्त करती है। हिन्दी में संयुक्त कर्ता के साथ एकवचन ‘हुआ’ स्वाभाविक है।
- source_word: כָּל אִישׁ מָצוֹק
  choice: हर संकट में पड़ा हुआ व्यक्ति
  rationale: מָצוֹק दबाव, तंगी या संकट की व्यापक स्थिति बताता है; यह अनुवाद आर्थिक अर्थ तक सीमित नहीं करता।
- source_word: אֲשֶׁר לוֹ נֹשֶׁא
  choice: जिसका कोई लेनदार था
  rationale: यह इब्रानी की अपेक्षाकृत शाब्दिक और किंचित अंडाकार अभिव्यक्ति को बनाए रखता है; ‘कर्ज़ में डूबा था’ अधिक व्याख्यात्मक होता।
- source_word: מַר נֶפֶשׁ
  choice: मन का कड़वा
  rationale: इब्रानी मुहावरे के भीतर की कटुता अथवा गहरी व्यथा को सीधे रूप में सुरक्षित रखता है; ‘असंतुष्ट’ अर्थ को अनावश्यक रूप से संकीर्ण करता।
- source_word: וַיְהִי עֲלֵיהֶם לְשָׂר
  choice: वह उनका प्रधान बन गया
  rationale: שַׂר का अर्थ प्रधान, अगुआ या सेनानायक हो सकता है। ‘प्रधान’ मूल की व्यापकता रखता है और इस दल पर अधिकार का भाव देता है।
- source_word: כְּאַרְבַּע מֵאוֹת אִישׁ
  choice: लगभग चार सौ पुरुष
  rationale: उपसर्ग כְּ अनुमान सूचित करता है और इस गणना में אִישׁ वयस्क पुरुषों को दर्शाता है।
theological_decisions:
- issue: מַר נֶפֶשׁ में भीतरी दशा का स्वरूप
  choice: मन का कड़वा
  alternative: असंतुष्ट / मन से दुखी
  rationale: मूल पाठ कटुता और व्यथा के बीच तनाव को पूरी तरह स्पष्ट नहीं करता; इसलिए अधिक निर्णायक मनोवैज्ञानिक व्याख्या नहीं अपनाई गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। ‘लेनदार’ मूल अभिव्यक्ति की विशिष्टता रखता है; ‘मन का कड़वा’ जानबूझकर इब्रानी मुहावरे का रूप और उसकी अर्थगत व्यापकता सुरक्षित रखता है।
