  text: तब शाऊल ने कहा, “कृपया सुनो, अहीतूब के पुत्र।” उसने उत्तर दिया, “मैं उपस्थित हूँ, मेरे स्वामी।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁמַע נָא
  choice: कृपया मेरी बात सुनो
  rationale: שְׁמַע का स्वाभाविक हिन्दी रूप ‘मेरी बात सुनो’ है; נָא अनुरोध या विनम्र आग्रह का भाव देता है, जिसे ‘कृपया’ से व्यक्त किया गया है।
- source_word: בֶּן אֲחִיטוּב
  choice: अहीतूब के पुत्र
  rationale: वंश-संबंधी संबोधन को स्रोत के निकट रखते हुए स्पष्ट और गरिमापूर्ण हिन्दी में प्रस्तुत किया गया है।
- source_word: הִנְנִי
  choice: मैं उपस्थित हूँ
  rationale: यह प्रत्युत्तर तत्पर उपस्थिति और ध्यान को सूचित करता है; केवल स्थान बताने वाले ‘मैं यहाँ हूँ’ की अपेक्षा ‘मैं उपस्थित हूँ’ इस प्रसंग में अधिक स्वाभाविक है।
- source_word: אֲדֹנִי
  choice: मेरे स्वामी
  rationale: यहाँ यह शाऊल के लिए सम्मानसूचक मानवीय संबोधन है, दिव्य नाम या परमेश्वर-संबंधी उपाधि नहीं।
