base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/001.yaml
  text: So David went from there and escaped to the cave of Adullam. When his brothers and all his father's household heard[a], they went down there to him.
translation:
  language: hi
  text: तब दाऊद वहाँ से चला गया और बच निकलकर अदुल्लाम की गुफा में जा पहुँचा[a]। जब उसके भाइयों और उसके पिता के पूरे घराने ने यह सुना, तो वे वहाँ उसके पास उतर आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भागकर अदुल्लाम की गुफा में जा पहुँचा।” इब्रानी क्रिया का अर्थ संकट से बच निकलना या भाग जाना, दोनों हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ מִשָּׁם
  choice: वहाँ से चला गया
  rationale: यह सामान्य कथात्मक गति और पिछले स्थान से प्रस्थान को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וַיִּמָּלֵט
  choice: बच निकलकर
  rationale: निफ़ाल रूप संकट से सफलतापूर्वक निकल जाने का परिणाम सूचित कर सकता है; ‘बच निकलकर’ इस भाव को बनाए रखता है, जबकि पादटिप्पणी भागने के वैकल्पिक अर्थ को दर्ज करती है।
- source_word: אֶל מְעָרַת עֲדֻלָּם
  choice: अदुल्लाम की गुफा में जा पहुँचा
  rationale: אֶל गुफा की ओर गति और वहाँ पहुँचने का भाव देता है। हिन्दी में ‘में जा पहुँचा’ गंतव्य को सहज ढंग से व्यक्त करता है।
- source_word: אֶחָיו
  choice: उसके भाइयों
  rationale: पुल्लिंग बहुवचन यहाँ दाऊद के भाइयों को संदर्भित करता है।
- source_word: כָל בֵּית אָבִיו
  choice: उसके पिता के पूरे घराने
  rationale: ‘घराना’ भौतिक मकान के बजाय व्यापक पैतृक परिवार या गृहस्थी का सामाजिक अर्थ व्यक्त करता है।
- source_word: וַיֵּרְדוּ
  choice: उतर आए
  rationale: यह ירד की नीचे की ओर गति को सुरक्षित रखता है और दाऊद की ओर आने को हिन्दी में स्वाभाविक बनाता है।
- source_word: אֵלָיו שָׁמָּה
  choice: वहाँ उसके पास
  rationale: यह स्थानसूचक ‘वहाँ’ और दाऊद की ओर गति, दोनों को स्पष्ट रूप से बनाए रखता है।
