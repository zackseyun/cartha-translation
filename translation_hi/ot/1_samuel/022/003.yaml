source:
  edition: WLC
  text: וַ/יֵּ֧לֶךְ דָּוִ֛ד מִ/שָּׁ֖ם מִצְפֵּ֣ה מוֹאָ֑ב וַ/יֹּ֣אמֶר אֶל מֶ֣לֶךְ מוֹאָ֗ב יֵֽצֵא נָ֞א אָבִ֤/י וְ/אִמִּ/י֙ אִתְּ/כֶ֔ם עַ֚ד אֲשֶׁ֣ר אֵדַ֔ע מַה יַּֽעֲשֶׂה לִּ֖/י אֱלֹהִֽים׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/003.yaml
  text: Then David went from there to Mizpeh of Moab[a], and he said to the king of Moab[b], “Please let my father and my mother come out and stay with you until I know what God will do for me.”
translation:
  language: hi
  text: तब दाऊद वहाँ से मोआब के मिस्पे को गया। उसने मोआब के राजा से कहा, “कृपया मेरे पिता और मेरी माता को आपके पास जाकर आपके साथ रहने दीजिए[a], जब तक मैं यह न जान लूँ कि परमेश्वर मेरे लिए क्या करेगा[b]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मेरे पिता और मेरी माता आपके पास निकल आएँ” या “आपके पास चले जाएँ।” प्रसंग में आशय है कि वे मोआब के राजा की देखरेख में रहें।
    reason: lexical_alternative
  - marker: b
    text: या “परमेश्वर मेरे साथ क्या करेगा” अथवा “परमेश्वर मेरे प्रति क्या करेगा।” इब्रानी अभिव्यक्ति परिणाम को खुला छोड़ती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֵּלֶךְ ... מִשָּׁם
  choice: वहाँ से ... गया
  rationale: यह क्रमिक कथात्मक गति को सरल और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִצְפֵּה מוֹאָב
  choice: मोआब के मिस्पे
  rationale: स्थान-नाम को उसके इब्रानी उच्चारण के निकट लिप्यंतरित किया गया है और संबंधसूचक रचना को स्पष्ट रखा गया है।
- source_word: יֵצֵא נָא
  choice: कृपया ... यहाँ से निकलकर ... रहने दीजिए
  rationale: יֵצֵא का मूल भाव ‘निकलना’ है, जबकि प्रसंग में दाऊद अपने माता-पिता को मोआब के राजा की देखरेख में ठहराने की अनुमति माँगता है। यह रूप मूल क्रिया और व्यावहारिक आशय दोनों को बनाए रखता है।
- source_word: אָבִי וְאִמִּי
  choice: मेरे पिता और मेरी माता
  rationale: इब्रानी में दोनों का अलग-अलग उल्लेख है; ‘मेरे माता-पिता’ कहने के बजाय उसी बल और रूप को सुरक्षित रखा गया है।
- source_word: אִתְּכֶם
  choice: आपके साथ
  rationale: इब्रानी सर्वनाम बहुवचन है। हिन्दी का आदरसूचक ‘आपके’ राजा और उसके लोगों—दोनों को समेट सकता है और संबोधन में स्वाभाविक है।
- source_word: עַד אֲשֶׁר אֵדַע
  choice: जब तक मैं यह न जान लूँ
  rationale: यह माता-पिता के ठहरने की समय-सीमा व्यक्त करता है और हिन्दी में स्वाभाविक अधीन वाक्य बनाता है।
- source_word: מַה יַּעֲשֶׂה לִּי אֱלֹהִים
  choice: परमेश्वर मेरे लिए क्या करेगा
  rationale: לִי को मुख्य पाठ में ‘मेरे लिए’ कहा गया है, जो दाऊद द्वारा परमेश्वर की भावी व्यवस्था की प्रतीक्षा को स्वाभाविक ढंग से व्यक्त करता है; इब्रानी की अन्य संभावनाएँ टिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: दाऊद के कथन में אֱלֹהִים का अनुवाद
  choice: परमेश्वर
  alternative: देवता / कोई देवता
  rationale: शब्द का रूप व्याकरणतः बहुवचन है, पर यहाँ एकवचन क्रिया और कथानक का संदर्भ इस्राएल के परमेश्वर की ओर संकेत करते हैं।
- issue: מַה יַּעֲשֶׂה לִּי में परमेश्वर के भावी कार्य का संबंध
  choice: परमेश्वर मेरे लिए क्या करेगा
  alternative: परमेश्वर मेरे साथ क्या करेगा / परमेश्वर मुझ पर क्या बीतने देगा
  rationale: לִי खुला संबंध व्यक्त कर सकता है। मुख्य पाठ ‘मेरे लिए’ चुनता है, पर इसे निश्चित रूप से अनुकूल परिणाम की प्रतिज्ञा नहीं बनाता; वैकल्पिक अर्थ टिप्पणी में दिए गए हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘कृपया’ और ‘आपके’ राजकीय संबोधन के अनुरूप हैं। ‘यहाँ से’ प्रसंगगत प्रस्थान को स्पष्ट करता है, जबकि ‘निकलकर ... रहने’ से मूल क्रिया और उसका आशय दोनों सुरक्षित रहते हैं।
