  text: וַ/יֹּ֣אמֶר הַ/מֶּ֡לֶךְ לָ/רָצִים֩ הַ/נִּצָּבִ֨ים עָלָ֜י/ו סֹ֥בּוּ וְ/הָמִ֣יתוּ כֹּהֲנֵ֣י יְהוָ֗ה כִּ֤י גַם יָדָ/ם֙ עִם דָּוִ֔ד וְ/כִ֤י יָֽדְעוּ֙ כִּֽי בֹרֵ֣חַ ה֔וּא וְ/לֹ֥א גָל֖וּ אֶת אזנ/ו וְ/לֹֽא אָב֞וּ עַבְדֵ֤י הַ/מֶּ֨לֶךְ֙ לִ/שְׁלֹ֣חַ אֶת יָדָ֔/ם לִ/פְגֹ֖עַ בְּ/כֹהֲנֵ֥י יְהוָֽה׀־־־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/017.yaml
  text: Then the king said to the runners who were standing around him[a], “Turn and kill the priests of Yahweh, because their hand also is with David[b], and because they knew that he was fleeing and did not disclose it to me.” But the king’s servants were not willing to put out their hand to strike the priests of Yahweh.
translation:
  language: hi
  text: तब राजा ने उन धावकों से, जो उसके चारों ओर खड़े थे, कहा, “मुड़ो और यहोवा के याजकों को मार डालो, क्योंकि उनका हाथ भी दाऊद के साथ है[a], और क्योंकि वे जानते थे कि वह भाग रहा है और उन्होंने मुझे यह बात नहीं बताई[b]।” परन्तु राजा के सेवक यहोवा के याजकों पर प्रहार करने के लिए हाथ बढ़ाने को तैयार न हुए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में, “उनका हाथ भी दाऊद के साथ है”; अर्थात वे दाऊद का समर्थन करते हैं या उसका पक्ष लेते हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “उन्होंने मेरा कान नहीं खोला”; इब्रानी मुहावरे का अर्थ है, “उन्होंने मुझे इसकी सूचना नहीं दी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: לָרָצִים
  choice: दौड़ाकों से
  rationale: शाब्दिक अर्थ ‘दौड़नेवाले’ है; राजकीय संदर्भ में ये अंगरक्षक या संदेशवाहक हो सकते हैं। ‘दौड़ाक’ मूल पद को सुरक्षित रखता है, जबकि प्रसंग उनकी राजकीय सेवा स्पष्ट करता है।
- source_word: הַנִּצָּבִים עָלָיו
  choice: अपने चारों ओर खड़े
  rationale: नצב के साथ על यहाँ राजा के पास उपस्थित या उसकी सेवा में खड़े लोगों का संकेत देता है; यह हिन्दी में दृश्य और दरबारी संदर्भ दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: סֹבּוּ וְהָמִיתוּ
  choice: मुड़ो और ... मार डालो
  rationale: आज्ञार्थक क्रियाएँ तत्काल मुड़कर घातक कार्रवाई करने का आदेश देती हैं। ‘मार डालो’ प्रत्यक्ष है और अनावश्यक न्यायिक अर्थ नहीं जोड़ता।
- source_word: כֹּהֲנֵי יְהוָה
  choice: यहोवा के याजकों
  rationale: सम्बन्धवाचक रचना का सीधा अनुवाद है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: כִּי גַם יָדָם עִם דָּוִד
  choice: क्योंकि उनका हाथ भी दाऊद के साथ है
  rationale: समर्थन या पक्ष लेने के इब्रानी मुहावरे की मूल शारीरिक छवि मुख्य पाठ में सुरक्षित रखी गई है; अर्थ पादटिप्पणी में स्पष्ट किया गया है।
- source_word: וְכִי יָדְעוּ כִּי בֹרֵחַ הוּא
  choice: वे जानते थे कि वह भाग रहा है
  rationale: בֹרֵחַ कृदन्त है और चल रही अवस्था बताता है; ‘भाग रहा है’ उसकी अपूर्ण/जारी प्रकृति को बनाए रखता है।
- source_word: וְלֹא גָלוּ אֶת־אָזְנוֹ
  choice: फिर भी उन्होंने मेरे कान पर यह बात नहीं खोली
  rationale: इब्रानी मुहावरे की छवि बचाई गई है। वक्ता राजा होने के कारण ‘उसका कान’ का आशय प्रथम पुरुष ‘मेरे कान’ से स्वाभाविक रूप में व्यक्त हुआ है; अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְלֹא אָבוּ
  choice: तैयार न हुए
  rationale: אבה इच्छा या सहमति को दर्शाता है; यह रूप उनके जानबूझकर इनकार को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לִשְׁלֹחַ אֶת־יָדָם לִפְגֹעַ
  choice: वार करने के लिए अपना हाथ बढ़ाने
  rationale: ‘हाथ बढ़ाना’ मूल मुहावरे की छवि सुरक्षित रखता है और ‘वार करने’ से हिंसक आशय स्पष्ट हो जाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। आधुनिक हिन्दी बाइबल-पाठकों में सुबोध और प्रतिष्ठित रूप ‘यहोवा’ रखते हुए नाम को सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया।
- issue: याजकों की दाऊद के साथ सहभागिता के विषय में शाऊल का आरोप
  choice: ‘उनका हाथ भी दाऊद के साथ है’ को शाऊल के कथन के रूप में यथावत रखा
  alternative: ‘वे भी दाऊद का साथ देते हैं’
  rationale: मूल का मुहावरा आरोप की तीव्रता और सम्भावित सहभागिता/समर्थन की अर्थ-सीमा बनाए रखता है; अनुवाद इसे वस्तुनिष्ठ धार्मिक निर्णय के रूप में प्रमाणित नहीं करता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और कथात्मक हिन्दी। मूल के ‘हाथ साथ होना’, ‘कान खोलना’ और ‘हाथ बढ़ाना’ जैसे प्रमुख रूपकों को जहाँ सम्भव था सुरक्षित रखा गया है और कम परिचित मुहावरों को पादटिप्पणियों में समझाया गया है।
