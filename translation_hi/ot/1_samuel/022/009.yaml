source:
  edition: WLC
  text: וַ/יַּ֜עַן דֹּאֵ֣ג הָ/אֲדֹמִ֗י וְ/ה֛וּא נִצָּ֥ב עַל עַבְדֵֽי שָׁא֖וּל וַ/יֹּאמַ֑ר רָאִ֨יתִי֙ אֶת בֶּן יִשַׁ֔י בָּ֣א נֹ֔בֶ/ה אֶל אֲחִימֶ֖לֶךְ בֶּן אֲחִטֽוּב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/009.yaml
  text: Then Doeg the Edomite[a], who was standing among Saul’s servants, answered and said, “I saw the son of Jesse coming to Nob, to Ahimelech son of Ahitub.”
translation:
  language: hi
  text: तब एदोमी दोएग ने, जो शाऊल के सेवकों के बीच खड़ा था[a], उत्तर दिया, “मैंने यिशै के पुत्र को नोब की ओर, अहीतूब के पुत्र अहीमेलेक के पास आते देखा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो शाऊल के सेवकों पर नियुक्त था।” इब्रानी वाक्यांश दोएग के सेवकों के बीच खड़े होने या उन पर किसी पर्यवेक्षकीय पद पर नियुक्त होने—दोनों का संकेत दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וַיַּעַן
  choice: उत्तर दिया
  rationale: कथात्मक संवाद में ענה प्रत्युत्तर देने को दर्शाता है; हिन्दी में ‘उत्तर दिया’ इब्रानी अभिव्यक्ति को स्वाभाविक रूप से बनाए रखता है।
- source_word: הָאֲדֹמִי
  choice: एदोमी
  rationale: यह दोएग के साथ प्रयुक्त जातीय पहचान है; हिन्दी में विशेषणात्मक ‘एदोमी’ स्वाभाविक और सटीक है।
- source_word: וְהוּא נִצָּב עַל עַבְדֵי שָׁאוּל
  choice: जो शाऊल के सेवकों के बीच खड़ा था
  rationale: נִצָּב का अर्थ ‘खड़ा’ या ‘नियुक्त’ हो सकता है और עַל संबंध अथवा अधिकार दोनों सूचित कर सकता है। मुख्य पाठ स्थानगत अर्थ रखता है और वैकल्पिक पर्यवेक्षकीय अर्थ पादटिप्पणी में दिया गया है।
- source_word: עַבְדֵי שָׁאוּל
  choice: शाऊल के सेवक
  rationale: עבדים का सीधा अर्थ ‘सेवक’ है; दरबारी संदर्भ में यह अधिकारियों या परिचारकों को भी समेट सकता है, पर ‘सेवक’ अनावश्यक विशिष्टीकरण से बचता है।
- source_word: וַיֹּאמַר
  choice: उत्तर दिया
  rationale: इब्रानी में ‘उत्तर दिया और कहा’ दोनों क्रियाएँ हैं, किंतु आधुनिक हिन्दी में संयुक्त अभिव्यक्ति भारी लगती है; ‘उत्तर दिया’ के बाद प्रत्यक्ष कथन दोनों का स्वाभाविक संप्रेषण करता है।
- source_word: רָאִיתִי
  choice: मैंने ... देखा था
  rationale: पूर्ण क्रिया बीती हुई प्रत्यक्ष घटना बताती है; हिन्दी का ‘देखा था’ वर्तमान संवाद से पहले हुई घटना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בֶּן יִשַׁי
  choice: यिशै का पुत्र
  rationale: मूल पाठ दाऊद का नाम लेने के बजाय संबंधसूचक पद प्रयोग करता है; उसके संभावित आलंकारिक प्रभाव को सुरक्षित रखा गया है।
- source_word: בָּא
  choice: आते
  rationale: यह कृदन्त ‘मैंने देखा’ की पूरक क्रिया है; ‘आते देखा’ इसकी प्रगतिशील/अवलोकित क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נֹבֶה
  choice: नोब में
  rationale: दिशासूचक ה गति को नोब की ओर दिखाता है। ‘नोब में ... के पास आते’ हिन्दी में गंतव्य और वहाँ स्थित व्यक्ति के पास पहुँचने की गति को सहज ढंग से व्यक्त करता है।
- source_word: אֶל אֲחִימֶלֶךְ בֶּן אֲחִטוּב
  choice: अहीमेलेक बिन अहीतूब के पास
  rationale: אֶל व्यक्ति की ओर गति दर्शाता है; हिन्दी में व्यक्ति के लिए ‘के पास’ सर्वाधिक स्वाभाविक है। वंशसूचक ‘बिन’ संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: दोएग की स्थिति या पद
  choice: शाऊल के सेवकों के बीच खड़ा था
  alternative: शाऊल के सेवकों पर नियुक्त था
  rationale: עַל और נִצָּב का मेल स्थानगत उपस्थिति या पर्यवेक्षकीय पद दोनों की अनुमति देता है। मुख्य पाठ अधिक तटस्थ स्थानगत अर्थ देता है, जबकि वास्तविक वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज कथात्मक शैली। व्यक्तिनामों के लिए प्रचलित बाइबलीय लिप्यंतरण रखा गया है। ‘यिशै के पुत्र’ को ‘दाऊद’ से नहीं बदला गया, और अस्पष्ट पद-संबंध को पादटिप्पणी में सुरक्षित रखा गया है।
