source:
  edition: WLC
  text: וַ/יֹּ֤אמֶר אל/ו שָׁא֔וּל לָ֚/מָּה קְשַׁרְתֶּ֣ם עָלַ֔/י אַתָּ֖ה וּ/בֶן יִשָׁ֑י בְּ/תִתְּ/ךָ֨ ל֜/וֹ לֶ֣חֶם וְ/חֶ֗רֶב וְ/שָׁא֥וֹל ל/וֹ֙ בֵּֽ/אלֹהִ֔ים לָ/ק֥וּם אֵלַ֛/י לְ/אֹרֵ֖ב כַּ/יּ֥וֹם הַ/זֶּֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/013.yaml
  text: Saul said to him[a], “Why have you and the son of Jesse conspired against me, by giving him bread and a sword and by inquiring of God for him, so that he has risen against me to lie in wait[b], as on this day?”
translation:
  language: hi
  text: शाऊल ने उससे कहा, “तुमने और यिशै के बेटे ने मेरे विरुद्ध षड्यंत्र क्यों रचा? तुमने उसे रोटी और तलवार दी और उसके लिए परमेश्वर से पूछा, ताकि वह मेरे विरुद्ध उठ खड़ा हो और घात लगाए बैठे[a], जैसा कि आज हो रहा है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिसके फलस्वरूप वह मेरे विरुद्ध उठ खड़ा हुआ है और घात लगाए बैठा है, जैसा कि आज है।”
    reason: इब्रानी infinitive-रचना को उद्देश्य या परिणाम के रूप में समझा जा सकता है और כַּיּוֹם הַזֶּה वर्तमान स्थिति पर बल देता है।
lexical_decisions:
- source_word: קְשַׁרְתֶּם
  choice: षड्यंत्र रचा
  rationale: यहाँ קשר का अर्थ राजा के विरुद्ध राजनीतिक साज़िश करना है; ‘षड्यंत्र रचा’ इस शत्रुतापूर्ण भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בֶן־יִשָׁי
  choice: यिशै के बेटे
  rationale: शाऊल दाऊद का नाम न लेकर उसे उसके पिता के संबंध से संबोधित करता है; इससे मूल का तिरस्कारपूर्ण और दूरी बनाने वाला स्वर बना रहता है।
- source_word: בְּתִתְּךָ לוֹ לֶחֶם וְחֶרֶב
  choice: तुमने उसे रोटी और तलवार दी
  rationale: ב के साथ infinitive construct आरोप के साधन अथवा आधार को दर्शाता है। हिन्दी में समानांतर मुख्य क्रियाएँ अधिक स्वाभाविक हैं और कारणात्मक संबंध संदर्भ से स्पष्ट रहता है।
- source_word: וְשָׁאוֹל לוֹ בֵּאלֹהִים
  choice: और उसके लिए परमेश्वर से पूछा
  rationale: याजकीय संदर्भ में यह पदबंध परमेश्वर से मार्गदर्शन जानने का संकेत देता है। ‘परमेश्वर से पूछा’ सरल, स्वाभाविक और अर्थानुकूल है।
- source_word: בֵּאלֹהִים
  choice: परमेश्वर से
  rationale: मूल पाठ में אֱלֹהִים है, न कि יהוה; इसलिए वाचा-सूचक नाम जोड़ने के बजाय वास्तविक शब्दरूप सुरक्षित रखा गया है।
- source_word: לָקוּם אֵלַי
  choice: ताकि वह मेरे विरुद्ध उठ खड़ा हो
  rationale: infinitive उद्देश्य या परिणाम दोनों का बोध करा सकता है। ‘ताकि’ शाऊल द्वारा लगाए गए आरोप की अभिप्रेत परिणति व्यक्त करता है, बिना उसकी सत्यता को कथाकार की पुष्टि बनाने के।
- source_word: לְאֹרֵב
  choice: और घात लगाए बैठे
  rationale: ארב का अर्थ छिपकर आक्रमण की प्रतीक्षा करना है। यह हिन्दी मुहावरा मूल की घात लगाने की क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּיּוֹם הַזֶּה
  choice: जैसा कि आज हो रहा है
  rationale: यह मुहावरा वर्तमान में दिखाई दे रही कथित स्थिति पर बल देता है; यह हिन्दी में ‘आज के दिन जैसा’ की अपेक्षा अधिक स्वाभाविक है।
theological_decisions:
- issue: בֵּאלֹהִים में ईश्वर का उल्लेख
  choice: परमेश्वर
  alternative: यहोवा
  rationale: इब्रानी पाठ אֱלֹהִים कहता है, יהוה नहीं। इसलिए अनुवाद मूल शब्द को रखता है और वाचा-सूचक नाम को पाठ में आयात नहीं करता।
- issue: לָקוּם אֵלַי का उद्देश्य अथवा परिणाम
  choice: ताकि वह मेरे विरुद्ध उठ खड़ा हो
  alternative: जिसके फलस्वरूप वह मेरे विरुद्ध उठ खड़ा हुआ है
  rationale: इब्रानी infinitive उद्देश्य और परिणाम के बीच कुछ अस्पष्टता रखता है। मुख्य पाठ शाऊल के आरोप की उद्देश्यपरक संरचना को सुरक्षित रखता है; पादटिप्पणी पूर्ण हुई वर्तमान स्थिति की वैकल्पिक समझ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज किंतु गरिमापूर्ण स्तर रखा गया है। ‘यिशै के बेटे’ को ‘दाऊद’ से नहीं बदला गया, ताकि शाऊल का मूल तिरस्कारपूर्ण संबोधन बना रहे। वाक्य को हिन्दी की स्वाभाविक प्रवाहशीलता के लिए समानांतर क्रियाओं में रखा गया है।
