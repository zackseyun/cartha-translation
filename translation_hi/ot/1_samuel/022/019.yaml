base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/022/019.yaml
  text: And Nob[a], the city of the priests, he struck with the edge of the sword, from man to woman, from child to nursing infant, and ox and donkey and sheep, with the edge of the sword.
translation:
  language: hi
  text: और याजकों के नगर नोब को उसने तलवार की धार से मार डाला[a]—पुरुष से लेकर स्त्री तक, छोटे बच्चे से लेकर दूध पीने वाले शिशु तक; और बैलों, गधों और भेड़ों को तलवार की धार से मार डाला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “तलवार की धार से मार डाला” का इब्रानी में शाब्दिक रूप “तलवार के मुँह के अनुसार” है; यह तलवार से मार डालने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹב
  choice: नोब
  rationale: स्थानवाचक नाम को मानक हिन्दी लिप्यंतरण में रखा गया है।
- source_word: עִיר הַכֹּהֲנִים
  choice: याजकों का नगर
  rationale: सम्बन्धसूचक इब्रानी पदबंध का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: הִכָּה
  choice: मारा
  rationale: נכה के व्यापक अर्थ ‘मारना/प्रहार करना’ को बनाए रखता है; तलवार वाला पदबंध यहाँ घातक परिणाम स्पष्ट करता है।
- source_word: לְפִי חֶרֶב / לְפִי חָרֶב
  choice: तलवार की धार से
  rationale: शाब्दिक बिंब ‘तलवार के मुँह’ को हिन्दी के स्वाभाविक युद्ध-संबंधी मुहावरे में व्यक्त करता है और केवल ‘तलवार से’ की अपेक्षा ठोस चित्र बनाए रखता है।
- source_word: מֵאִישׁ וְעַד אִשָּׁה
  choice: पुरुष से लेकर स्त्री तक
  rationale: एकवचन वितरणात्मक समष्टिसूचक संरचना तथा दोनों लिंगों को समेटने वाली युग्मोक्ति सुरक्षित रहती है।
- source_word: מֵעוֹלֵל וְעַד יוֹנֵק
  choice: छोटे बच्चे से लेकर दूध पीते शिशु तक
  rationale: עוֹלֵל छोटे बच्चे और יוֹנֵק दूध पीने वाले शिशु को दर्शाता है; यह क्रम और अंधाधुंध संहार की भयावहता दोनों बनाए रखता है।
- source_word: וְשׁוֹר וַחֲמוֹר וָשֶׂה
  choice: और बैल, गधे और भेड़ को भी
  rationale: पालतू पशुओं की एकवचन सूची को स्वाभाविक हिन्दी में रखा गया है; שֶׂה भेड़ या बकरी जाति का छोटा पशु हो सकता है, पर इस प्रसंग में ‘भेड़’ उपयुक्त सामान्य चयन है।
theological_decisions:
- issue: समष्टिसूचक युग्मोक्ति में लिंगसूचक मानव शब्द
  choice: पुरुष से लेकर स्त्री तक
  alternative: आदमी से लेकर औरत तक; सभी लोगों को
  rationale: इब्रानी के स्पष्ट पुरुष–स्त्री युग्म और उसकी समग्रता को बनाए रखा गया है; इसे लिंग-निरपेक्ष बनाकर स्रोत की संरचना नहीं मिटाई गई।
- issue: संहार-वर्णन में औपचारिक पुनरावृत्ति
  choice: ‘तलवार की धार से’ को आरम्भ और अंत दोनों में व्यक्त करना
  alternative: केवल एक बार ‘तलवार से सबको मार डाला’ कहना
  rationale: इब्रानी की पुनरावृत्ति संपूर्ण विनाश पर बल देती है; उसे बनाए रखने से पद की गंभीरता और वाक्पटु संरचना सुरक्षित रहती है।
- issue: שֶׂה की प्रजातिगत अस्पष्टता
  choice: भेड़
  alternative: भेड़ या बकरी; छोटा पशु
  rationale: शब्द छोटे भेड़-बकरी वर्ग के पशु को सूचित कर सकता है। मुख्य पाठ में स्वाभाविक पारंपरिक समतुल्य ‘भेड़’ चुना गया, बिना किसी धार्मिक निष्कर्ष को इससे जोड़ने के।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। संहार की भयावहता को न तो नरम किया गया है, न अनावश्यक रूप से बढ़ाया गया है। वाक्य में विराम-चिह्नों द्वारा लंबी समष्टिसूचक सूची को स्पष्ट बनाया गया है।
