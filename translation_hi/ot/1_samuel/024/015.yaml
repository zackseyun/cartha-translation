  yaml_path: translation/ot/1_samuel/024/015.yaml
  text: After whom has the king of Israel come out? After whom are you pursuing? After a dead dog[a], after a single flea.
translation:
  language: hi
  text: इस्राएल का राजा किसके पीछे निकला है? तू किसके पीछे पड़ा है? एक मरे हुए कुत्ते के पीछे, एक अकेले पिस्सू के पीछे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַחֲרֵי מִי
  choice: किसके पीछे
  rationale: यह मूल पूर्वसर्ग के शाब्दिक अर्थ और पीछा करने के प्रसंग—दोनों को स्वाभाविक हिन्दी में व्यक्त करता है। पहले प्रश्न में इसकी रचना स्पष्ट रूप से रखी गई है।
- source_word: יָצָא
  choice: निकला है
  rationale: क्रिया के ‘बाहर निकलने/अभियान पर निकलने’ के भाव को वर्तमान प्रसंग में सहज हिन्दी पूर्णकाल से व्यक्त करता है।
- source_word: מֶלֶךְ יִשְׂרָאֵל
  choice: इस्राएल का राजा
  rationale: उपाधि का सीधा और गरिमापूर्ण अनुवाद है, जो दाऊद द्वारा राजा की महानता और अपने बताए तुच्छपन के बीच विरोध बनाए रखता है।
- source_word: אַתָּה רֹדֵף
  choice: तू ... पीछा कर रहा है
  rationale: רדף के लगातार और शत्रुतापूर्ण पीछा करने के भाव को स्पष्ट करता है। ‘तू’ मूल के एकवचन संबोधन और दाऊद के सीधे कथन को दर्शाता है।
- source_word: כֶּלֶב מֵת
  choice: एक मरे हुए कुत्ते
  rationale: दाऊद की आत्म-दीनता की तीखी उपमा को बिना नरम किए सीधे व्यक्त करता है।
- source_word: פַּרְעֹשׁ אֶחָד
  choice: एक अदने-से पिस्सू
  rationale: אֶחָד द्वारा उभारी गई नगण्यता को स्वाभाविक हिन्दी में व्यक्त करता है; केवल ‘एक पिस्सू’ की अपेक्षा तुच्छता का आशय अधिक साफ है।
- source_word: אַחֲרֵי ... אַחֲרֵי ... אַחֲרֵי
  choice: पीछे ... पीछा ... का ... का
  rationale: हिन्दी में हर बार ‘पीछे’ दोहराने से वाक्य अस्वाभाविक होता; इसलिए पीछा करने का अर्थ और अंतिम समानांतर उपमाएँ बनाए रखते हुए व्याकरणानुकूल विविध रूप अपनाए गए हैं।
theological_decisions: []
