  register: आधुनिक मानक हिन्दी; भाषा सीधी, गरिमापूर्ण और मौखिक रूप से सहज है। संबोधन में ‘तू’ मूल के एकवचन रूप तथा निकटवर्ती बाइबिलीय संवाद की तीव्रता को बनाए रखता है।
