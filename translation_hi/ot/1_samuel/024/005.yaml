base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/005.yaml
  text: Then David’s men said to him[a], “Look, this is the day of which Yahweh said to you, ‘Look, I am giving your enemy into your hand, and you may do to him as seems good in your eyes.’” Then David arose and secretly cut off the corner of Saul’s robe.
translation:
  language: hi
  text: तब दाऊद के आदमियों ने उससे कहा, “देखिए, यही वह दिन है जिसके विषय में यहोवा ने आपसे कहा था, ‘देख, मैं तेरे शत्रु को तेरे हाथ में दे रहा हूँ, और तू उसके साथ वैसा कर सकता है जैसा तुझे अपनी दृष्टि में अच्छा लगे[a]।’” तब दाऊद उठा और उसने चुपके से शाऊल के चोगे का किनारा काट लिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक सहज रूप में: “जैसा तुझे अच्छा लगे।”'
    reason: मूल इब्रानी मुहावरे की शाब्दिक छवि और उसके सहज हिंदी अर्थ—दोनों उपलब्ध कराने के लिए।
lexical_decisions:
- source_word: וַיֹּאמְרוּ אַנְשֵׁי דָוִד אֵלָיו
  choice: तब दाऊद के लोगों ने उससे कहा
  rationale: वाव-क्रमिक रूप कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम को स्वाभाविक हिंदी में स्पष्ट करता है। ‘दाऊद के लोग’ आश्रित समूह के लिए सहज आधुनिक प्रयोग है।
- source_word: הִנֵּה הַיּוֹם
  choice: देखिए, यही वह दिन है
  rationale: הִנֵּה का ध्यान आकर्षित करने वाला बल ‘देखिए’ से व्यक्त होता है, और ‘यही वह दिन’ पहचान तथा बल दोनों को बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: ईश्वर के व्यक्तिवाचक इब्रानी नाम को उपाधि से बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: הִנֵּה אָנֹכִי נֹתֵן
  choice: देख, मैं ... दे रहा हूँ
  rationale: הִנֵּה और स्वतंत्र सर्वनाम אָנֹכִי का जोर सुरक्षित है; कृदंत נֹתֵן की सजीव, आसन्न क्रिया को ‘दे रहा हूँ’ व्यक्त करता है।
- source_word: אֶת איביך בְּיָדֶךָ
  choice: तेरे शत्रु को तेरे हाथ में
  rationale: संदर्भ और आगे आने वाले एकवचन सर्वनाम शाऊल नामक एक शत्रु की ओर संकेत करते हैं। ‘हाथ में देना’ सामर्थ्य के अधीन करने की मूल इब्रानी छवि को स्पष्ट रूप से बनाए रखता है।
- source_word: וְעָשִׂיתָ לּוֹ
  choice: तू उसके साथ ... कर सकता है
  rationale: संदर्भ में यह आज्ञा देने के बजाय सौंपे गए अवसर और अनुमति को व्यक्त करता है; ‘कर सकता है’ इसी भाव को स्वाभाविक हिंदी में रखता है।
- source_word: כַּאֲשֶׁר יִטַב בְּעֵינֶיךָ
  choice: जो तुझे अपनी दृष्टि में अच्छा लगे
  rationale: मूल मुहावरे की ‘आँखों/दृष्टि में अच्छा’ छवि और व्यक्ति के अपने निर्णय का भाव दोनों सुरक्षित रखे गए हैं।
- source_word: וַיָּקָם דָּוִד
  choice: तब दाऊद उठा
  rationale: कथात्मक क्रम और शारीरिक गति दोनों का संक्षिप्त, स्वाभाविक अनुवाद है।
- source_word: וַיִּכְרֹת אֶת כְּנַף הַמְּעִיל אֲשֶׁר לְשָׁאוּל בַּלָּט
  choice: उसने चुपके से शाऊल के चोगे का किनारा काट लिया
  rationale: כְּנַף वस्त्र के किनारे/छोर को और בַּלָּט गुप्त ढंग से किए कार्य को बताता है। ‘काट लिया’ पूर्ण हुई क्रिया को सहज हिंदी में व्यक्त करता है।
theological_decisions:
- issue: क्या दाऊद के लोगों द्वारा उद्धृत कथन को यहोवा की प्रमाणित पूर्ववाणी माना जाए या केवल उन लोगों का दावा
  choice: 'कथावाचक की ओर से अतिरिक्त पुष्टि किए बिना लोगों का कथन सीधे प्रस्तुत किया गया है: ‘जिसके विषय में यहोवा ने आपसे कहा था।’'
  alternative: इसे स्पष्टतः लोगों की अपनी व्याख्या कहना, अथवा किसी ज्ञात विशिष्ट भविष्यवाणी के रूप में और दृढ़ता से प्रस्तुत करना।
  rationale: इब्रानी पाठ केवल दाऊद के लोगों की बात उद्धृत करता है। सीधी रिपोर्ट कथात्मक और धर्मवैचारिक तनाव को बनाए रखती है तथा उनके दावे को न तो कमजोर करती है, न उससे अधिक प्रमाणित करती है।
translation_notes:
  register: आधुनिक, सम्मानपूर्ण और कथात्मक हिंदी अपनाई गई है। दाऊद के लोग उससे आदरसूचक ‘आप’ में बोलते हैं, जबकि उद्धृत दिव्य वचन में इब्रानी एकवचन संबोधन के अनुरूप ‘तू/तेरे’ रखा गया है। ‘चोगा’ सामान्य पाठक के लिए स्पष्ट है और राजकीय बाहरी वस्त्र का भाव देता है।
