  text: וַ/יֹּ֤אמֶר דָּוִד֙ לְ/שָׁא֔וּל לָ֧/מָּה תִשְׁמַ֛ע אֶת דִּבְרֵ֥י אָדָ֖ם לֵ/אמֹ֑ר הִנֵּ֣ה דָוִ֔ד מְבַקֵּ֖שׁ רָעָתֶֽ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/010.yaml
  text: And David said to Saul[a], “Why do you listen to the words of a man who says, ‘Look[b], David is seeking your harm’?”
translation:
  language: hi
  text: तब दाऊद ने शाऊल से कहा, “आप किसी मनुष्य[a] की बातों पर क्यों ध्यान देते हैं, जो कहता है, ‘देखिए, दाऊद आपकी हानि[b] चाहता है’?”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों की बातें” या “मानवीय बातें।” हिब्रू में “मनुष्य” एकवचन है, पर कभी सामान्य मानवीय अर्थ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “आपके विरुद्ध बुराई चाहता है।” हिब्रू शब्द का अर्थ हानि, अनिष्ट, या बुराई हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमिक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में ‘तब’ प्रसंग के क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְשָׁאוּל
  choice: शाऊल से
  rationale: לְ संबोधित व्यक्ति को चिह्नित करता है; हिन्दी में ‘से कहा’ स्वाभाविक है।
- source_word: לָמָּה תִשְׁמַע
  choice: तू ... क्यों सुनता है
  rationale: यहाँ שׁמע केवल ध्वनि सुनने के बजाय किसी की बात पर ध्यान देने या उसे मानने का भाव रखता है। राजा से दाऊद के सीधे संबोधन में एकवचन ‘तू’ स्रोत के व्याकरण को बनाए रखता है।
- source_word: דִּבְרֵי אָדָם
  choice: उन लोगों की बात
  rationale: אָדָם रूप में एकवचन होते हुए भी सामान्य मानव-संदर्भ रख सकता है। इस प्रसंग में हिन्दी का ‘लोगों की बात’ आरोप लगाने वालों की वाणी का स्वाभाविक सामान्यीकरण है; एकवचन विकल्प पादटिप्पणी में रखा गया है।
- source_word: לֵאמֹר
  choice: जो कहते हैं
  rationale: उद्धृत कथन का परिचय कराने वाले infinitive को हिन्दी में संबंधवाचक उपवाक्य से सहज रूप दिया गया है।
- source_word: הִנֵּה
  choice: देख
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देख’ आधुनिक और प्रत्यक्ष है, जबकि ‘निहार’ या ‘देखो’ यहाँ संबोधन-वचन से कम मेल खाते हैं।
- source_word: מְבַקֵּשׁ רָעָתֶךָ
  choice: तेरी हानि चाहता है
  rationale: בקשׁ के साथ רעה किसी के विरुद्ध हानि या अनिष्ट चाहने का आरोप व्यक्त करता है। हिन्दी में यह स्रोत के आशय को स्वाभाविक रूप से पहुँचाता है।
theological_decisions:
- issue: אָדָם का एकवचन अथवा सामान्य मानवीय अर्थ
  choice: उन लोगों की बात
  alternative: किसी मनुष्य की बात / एक आदमी की बात
  rationale: हिब्रू का एकवचन אָדָם कभी सामान्य मानव-अर्थ दे सकता है और यहाँ किसी विशेष आरोपकर्ता की पहचान नहीं दी गई। पाठ की वास्तविक अस्पष्टता को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: רָעָה का नैतिक ‘बुराई’ अथवा परिणामगत ‘हानि’ अर्थ
  choice: हानि
  alternative: तेरे विरुद्ध बुराई
  rationale: प्रसंग में आरोप यह है कि दाऊद शाऊल का अनिष्ट चाहता है; ‘हानि’ अनावश्यक रूप से दाऊद की नैतिक दुष्टता सिद्ध किए बिना आशय व्यक्त करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज हिन्दी। शाऊल को सीधे संबोधन में स्रोत के एकवचन रूप के अनुरूप ‘तू/तेरी’ रखा गया है।
