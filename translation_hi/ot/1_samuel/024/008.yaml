base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/008.yaml
  text: David restrained his men with words and did not allow them to rise up against Saul[a]. Then Saul rose from the cave and went on his way.
translation:
  language: hi
  text: दाऊद ने अपने आदमियों को शब्दों से कड़ाई से रोक दिया[a] और उन्हें शाऊल के विरुद्ध उठ खड़े होने नहीं दिया। तब शाऊल गुफा से उठा और अपने रास्ते चला गया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाऊद ने अपने आदमियों को शब्दों से कड़ी फटकार लगाई।” यहाँ प्रयुक्त हिब्रू क्रिया दुर्लभ है और केवल रोकने से अधिक तीखा भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְשַׁסַּע
  choice: कड़ाई से रोक लिया
  rationale: यह दुर्लभ क्रिया यहाँ दाऊद द्वारा अपने आदमियों को शाऊल पर आक्रमण करने से बलपूर्वक रोकने का भाव देती है। यह चयन प्रसंगगत परिणाम और क्रिया की संभावित तीव्रता—दोनों को व्यक्त करता है, जबकि पादटिप्पणी वैकल्पिक अर्थ सुरक्षित रखती है।
- source_word: אֲנָשָׁיו
  choice: अपने आदमियों
  rationale: यहाँ संज्ञा गुफा में दाऊद के साथ मौजूद उसके पुरुष अनुयायियों को दर्शाती है; आधुनिक हिन्दी में ‘अपने आदमियों’ स्वाभाविक और सटीक है।
- source_word: בַּדְּבָרִים
  choice: शब्दों से
  rationale: यह पद उस साधन को बताता है जिसके द्वारा दाऊद ने उन्हें रोका—मौखिक हस्तक्षेप। ‘शब्दों से’ हिब्रू की साधनवाचक रचना को निकटता से रखता है।
- source_word: וְלֹא נְתָנָם
  choice: उन्हें ... नहीं दिया
  rationale: נתן के साथ infinitive अनुमति देने का अर्थ व्यक्त करता है। हिन्दी रचना ‘उन्हें ... नहीं दिया’ इस निषेध को स्पष्ट रूप से प्रकट करती है।
- source_word: לָקוּם אֶל־שָׁאוּל
  choice: शाऊल के विरुद्ध उठने
  rationale: इस शत्रुतापूर्ण प्रसंग में קום אֶל शाऊल के विरुद्ध कार्रवाई करने का संकेत देता है। ‘विरुद्ध उठने’ मूल क्रियात्मक बिंब और विरोधी भाव दोनों को बचाए रखता है।
- source_word: קָם מֵהַמְּעָרָה
  choice: गुफा से उठा
  rationale: यह अनुवाद קום की पुनरावृत्ति को बनाए रखता है और हिन्दी कथा-शैली में स्वाभाविक है।
- source_word: וַיֵּלֶךְ בַּדָּרֶךְ
  choice: अपने रास्ते चला गया
  rationale: शाब्दिक अर्थ ‘मार्ग पर चला’ है; यहाँ मुहावरेदार हिन्दी ‘अपने रास्ते चला गया’ उसके प्रस्थान और यात्रा जारी रखने का भाव सहज ढंग से देती है।
