  text: וַ/יֹּ֨אמֶר֙ אֶל דָּוִ֔ד צַדִּ֥יק אַתָּ֖ה מִמֶּ֑/נִּי כִּ֤י אַתָּה֙ גְּמַלְתַּ֣/נִי הַ/טּוֹבָ֔ה וַ/אֲנִ֖י גְּמַלְתִּ֥י/ךָ הָ/רָעָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/018.yaml
  text: And he said to David[a], “You are more righteous than I, for you have repaid me with good, while I have repaid you with evil.”
translation:
  language: hi
  text: उसने दाऊद से कहा, “तुम मुझसे अधिक धर्मी[a] हो, क्योंकि तुमने मेरे साथ भलाई की है, जबकि मैंने तुम्हारे साथ बुराई की है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मुझसे अधिक सही हो।”
    reason: צַדִּיק यहाँ नैतिक रूप से ‘धर्मी’ के साथ-साथ ‘सही पक्ष में’ होने का भाव भी दे सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר אֶל־דָּוִד
  choice: उसने दाऊद से कहा
  rationale: सामान्य इब्रानी कथात्मक भूतकाल को सहज हिन्दी में व्यक्त किया गया है। प्रसंग से वक्ता शाऊल है, पर मूल वाक्य में केवल ‘उसने’ है, इसलिए वही संरक्षित है।
- source_word: צַדִּיק אַתָּה מִמֶּנִּי
  choice: तुम मुझसे अधिक धर्मी हो
  rationale: צַדִּיק में नैतिक धार्मिकता और सही पक्ष में होने—दोनों का भाव हो सकता है। मुख्य पाठ में ‘धर्मी’ नैतिक बल को रखता है; दूसरे भाव को पादटिप्पणी में दिया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह शाऊल के कथन का आधार बताता है और आधुनिक हिन्दी में स्वाभाविक कारणसूचक संयोजक है।
- source_word: גְּמַלְתַּנִי הַטּוֹבָה
  choice: तुमने मेरे साथ भलाई की है
  rationale: גמל का अर्थ किसी के साथ उसके प्रति भला या बुरा व्यवहार करना अथवा प्रतिफल देना हो सकता है। हिन्दी में ‘मेरे साथ भलाई की’ स्वाभाविक है और הַטּוֹבָה के व्यापक अर्थ को बनाए रखता है।
- source_word: וַאֲנִי גְּמַלְתִּיךָ הָרָעָה
  choice: जबकि मैंने तुम्हारे साथ बुराई की है
  rationale: ‘जबकि’ दोनों समानांतर उपवाक्यों के तीखे विरोध को स्पष्ट करता है। पहले खंड की ‘...के साथ ... की’ रचना दोहराकर मूल के גמל की पुनरावृत्ति और ‘भलाई/बुराई’ का विरोध सुरक्षित रखा गया है।
