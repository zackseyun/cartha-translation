base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/017.yaml
  text: When David had finished speaking these words to Saul[a], Saul said, “Is this your voice, my son David?” Then Saul lifted up his voice and wept.
translation:
  language: hi
  text: जब दाऊद शाऊल से ये बातें कह चुका था, तब शाऊल ने कहा, “मेरे बेटे दाऊद, क्या यह तुम्हारी आवाज़ है?” फिर शाऊल ने अपनी आवाज़ ऊँची की और रोया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְהִי כְּכַלּוֹת דָּוִד לְדַבֵּר
  choice: जब दाऊद ... कह चुका
  rationale: यह रचना एक कालवाचक उपवाक्य बनाती है। ‘जब ... कह चुका’ घटनाओं का क्रम स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है, बिना आरम्भिक וַיְהִי का कृत्रिम शब्दशः अनुवाद किए।
- source_word: אֶת הַדְּבָרִים הָאֵלֶּה
  choice: ये बातें
  rationale: דְּבָרִים कथन के शब्दों अथवा कही गई बातों को सूचित कर सकता है। इस प्रसंग में ‘ये बातें’ सहज हिन्दी है और पूरे पूर्ववर्ती कथन की ओर संकेत करता है।
- source_word: הֲקֹלְךָ זֶה
  choice: क्या यह तुम्हारी आवाज़ है?
  rationale: קוֹל यहाँ पहचानी जा रही मानवीय आवाज़ है; प्रश्नवाचक הֲ और निकटवाची זֶה को क्रमशः ‘क्या’ और ‘यह’ से व्यक्त किया गया है।
- source_word: בְּנִי דָוִד
  choice: मेरे बेटे दाऊद
  rationale: शाऊल के भावपूर्ण पारिवारिक संबोधन को यथावत रखा गया है। हिन्दी में संबोधन को प्रश्न से पहले रखना अधिक स्वाभाविक है।
- source_word: וַיִּשָּׂא שָׁאוּל קֹלוֹ וַיֵּבְךְּ
  choice: फिर शाऊल ऊँचे स्वर से रो पड़ा
  rationale: ‘अपनी आवाज़ उठाना और रोना’ इब्रानी मुहावरा श्रव्य, भावावेशपूर्ण विलाप दर्शाता है। ‘ऊँचे स्वर से रो पड़ा’ अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: शाऊल का ‘मेरे बेटे दाऊद’ संबोधन
  choice: इसे भावपूर्ण और संबंधसूचक संबोधन के रूप में ज्यों का त्यों रखा गया है।
  alternative: इसे केवल राजनीतिक कृपा या संरक्षण की उपाधि मानना।
  rationale: इब्रानी पाठ स्पष्ट रूप से पुत्र-संबंधी भाषा का प्रयोग करता है। अनुवाद उसके भावात्मक और सामाजिक बल को सुरक्षित रखता है, पर इसे शाब्दिक पुत्रत्व या किसी विशिष्ट धर्मसैद्धान्तिक दावे के रूप में नहीं समझाता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और कथात्मक। ‘दाऊद’ और ‘शाऊल’ प्रचलित हिन्दी बाइबलीय नामरूप हैं। कोई पाद-टिप्पणी आवश्यक नहीं मानी गई, क्योंकि בְּנִי דָוִד के शब्दक्रम का हिन्दी में स्वाभाविक पुनर्विन्यास अर्थगत विकल्प उत्पन्न नहीं करता।
