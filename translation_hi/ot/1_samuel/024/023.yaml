  yaml_path: translation/ot/1_samuel/024/023.yaml
  text: So David swore to Saul. Then Saul went to his house[a], but David and his men went up to the stronghold.
translation:
  language: hi
  text: दाऊद ने शाऊल से शपथ ली। फिर शाऊल अपने घर लौट गया, पर दाऊद और उसके लोग गढ़ की ओर ऊपर चले गए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और दाऊद और उसके लोग गढ़ की ओर ऊपर चले गए।” इब्रानी संयोजक का साधारण अर्थ “और” है; मुख्य पाठ में “पर” दोनों के भिन्न गंतव्यों का प्रसंगगत विरोध स्पष्ट करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשָּׁבַע
  choice: शपथ खाई
  rationale: निफ़अल रूप यहाँ शपथ लेने को व्यक्त करता है; ‘शपथ खाई’ आधुनिक हिन्दी में सीधा और स्वाभाविक कथात्मक प्रयोग है।
- source_word: לְשָׁאוּל
  choice: शाऊल से
  rationale: लामेद शाऊल को उस व्यक्ति के रूप में चिह्नित करता है जिसके प्रति दाऊद ने प्रतिज्ञा की; हिन्दी में ‘शाऊल से शपथ खाई’ स्वाभाविक है।
- source_word: וַיֵּלֶךְ שָׁאוּל אֶל בֵּיתוֹ
  choice: तब शाऊल अपने घर चला गया
  rationale: בֵּיתוֹ का ठोस और स्वाभाविक अर्थ ‘अपने घर’ है; ‘तब’ कथानक की अगली घटना स्पष्ट करता है।
- source_word: וְדָוִד וַאֲנָשָׁיו
  choice: परन्तु दाऊद और उसके जन
  rationale: वाव का मूल अर्थ ‘और’ है, किन्तु यहाँ शाऊल और दाऊद के अलग-अलग गंतव्यों का प्रसंगगत विरोध ‘परन्तु’ से स्वाभाविक रूप में उभरता है। ‘उसके जन’ सैन्य अनुयायियों को गरिमापूर्ण और व्यापक ढंग से व्यक्त करता है।
- source_word: עָלוּ
  choice: चढ़ गए
  rationale: עלה की ऊपर जाने की दिशात्मकता को संक्षिप्त और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַמְּצוּדָה
  choice: गढ़
  rationale: यह शब्द सुरक्षित, दृढ़ शरणस्थान को दर्शाता है; दाऊद के वन-प्रदेशीय संदर्भ में ‘गढ़’ संक्षिप्त, सुबोध और उपयुक्त है।
