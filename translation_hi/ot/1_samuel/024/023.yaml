  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप। वाक्यरचना मूल घटनाक्रम और भौगोलिक दिशात्मकता को बनाए रखती है। संयोजक में निहित प्रसंगगत विरोध को मुख्य पाठ में ‘परन्तु’ से स्पष्ट किया गया है; इससे कोई धर्मवैज्ञानिक निष्कर्ष नहीं जोड़ा गया।
