base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/007.yaml
  text: And he said to his men[a], “Far be it from me, because of Yahweh, that I should do this thing to my lord, Yahweh’s anointed, to stretch out my hand against him, for he is Yahweh’s anointed.”
translation:
  language: hi
  text: और उसने अपने आदमियों से कहा, “याहवे के कारण,[a] ऐसा काम करना मुझसे दूर रहे कि मैं अपने स्वामी, याहवे के अभिषिक्त, के विरुद्ध हाथ बढ़ाकर ऐसा काम करूँ; क्योंकि वह याहवे का अभिषिक्त है।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या परंपरागत ढंग से, “याहवे न करे कि मैं ऐसा करूँ।” हिब्रू मुहावरा याहवे के संबंध में ऐसे काम के प्रति प्रबल विरक्ति व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָלִילָה לִּי מֵיְהוָה
  choice: याहवे के कारण यह मुझसे दूर रहे
  rationale: हिब्रू मुहावरा किसी कार्य के प्रति प्रबल विरक्ति और निषेध व्यक्त करता है; מֵיְהוָה इस इनकार को याहवे के प्रति श्रद्धा से जोड़ता है। यह रूप अर्थ को स्वाभाविक हिन्दी में रखते हुए याहवे को सीधे निषेध का कर्ता नहीं बनाता।
- source_word: אִם אֶעֱשֶׂה
  choice: कि मैं ... करूँ
  rationale: חָלִילָה के बाद אִם शाब्दिक शर्त से अधिक शपथ-सदृश दृढ़ अस्वीकार का अंग है; हिन्दी में ‘कि मैं ... करूँ’ वही मुहावरेदार संबंध व्यक्त करता है।
- source_word: הַדָּבָר הַזֶּה
  choice: ऐसा काम
  rationale: דבר यहाँ विचाराधीन कृत्य को दर्शाता है। ‘ऐसा काम’ आधुनिक हिन्दी में स्वाभाविक है और मूल शब्द को अनावश्यक रूप से विशिष्ट नहीं बनाता।
- source_word: לַאדֹנִי
  choice: अपने स्वामी ... के साथ
  rationale: אָדוֹן आदरसूचक रूप में शाऊल के लिए प्रयुक्त है। לְ का संबंध यहाँ contemplated action से है; ‘के साथ ऐसा काम’ हिन्दी में इस संबंध को सहज रूप देता है, जबकि आगे का वाक्यांश उसकी विरोधी दिशा स्पष्ट करता है।
- source_word: לִמְשִׁיחַ יְהוָה
  choice: याहवे के अभिषिक्त
  rationale: מָשִׁיחַ का अर्थ ‘अभिषिक्त जन’ है। शाऊल के राजकीय अभिषेक के संदर्भ में यह अनुवाद उचित है और बाद के मसीही अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: לִשְׁלֹחַ יָדִי בּוֹ
  choice: उसके विरुद्ध अपना हाथ बढ़ाऊँ
  rationale: मूल हिंसक कार्रवाई के लिए प्रयुक्त ‘किसी के विरुद्ध हाथ बढ़ाने’ की छवि रखता है। हिन्दी अभिव्यक्ति मूल बिंब और शत्रुतापूर्ण दिशा दोनों सुरक्षित रखती है।
- source_word: כִּי מְשִׁיחַ יְהוָה הוּא
  choice: क्योंकि वह याहवे का अभिषिक्त है
  rationale: כִּי दाऊद के इनकार का कारण देता है। मूल की तरह उपाधि की पुनरावृत्ति उसके तर्क और बलाघात को बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय देवनागरी में ‘याहवे’ रूप में प्रस्तुत किया गया है।
theological_decisions:
- issue: शाऊल के लिए מְשִׁיחַ का अनुवाद
  choice: याहवे का अभिषिक्त
  alternative: याहवे का मसीह
  rationale: इस प्रसंग में शब्द याहवे द्वारा अभिषिक्त राजा के रूप में शाऊल की स्थिति बताता है। ‘मसीह’ बाद के विशिष्ट मसीही आशय का आभास दे सकता है, जो यहाँ संदर्भ द्वारा अपेक्षित नहीं है।
- issue: חָלִילָה לִּי מֵיְהוָה में याहवे की भूमिका
  choice: याहवे के कारण यह मुझसे दूर रहे
  alternative: याहवे न करे कि मैं
  rationale: हिब्रू में प्रबल विरक्ति याहवे के साथ संबंध में व्यक्त होती है। मुख्य पाठ दाऊद के संयम को याहवे के प्रति श्रद्धा में आधारित रखता है, पर यह निश्चित नहीं करता कि वाक्य व्याकरणतः याहवे से प्रत्यक्ष निषेध की प्रार्थना है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप अपनाया गया है। ‘यह मुझसे दूर रहे’ मूल मुहावरे की तीव्रता बचाता है; डैश अगले वाक्यांश को ‘ऐसा काम’ की व्याख्या के रूप में स्पष्ट करता है।
