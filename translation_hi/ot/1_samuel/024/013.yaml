  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: יִשְׁפֹּ֤ט יְהוָה֙ בֵּינִ֣/י וּ/בֵינֶ֔/ךָ וּ/נְקָמַ֥/נִי יְהוָ֖ה מִמֶּ֑/ךָּ וְ/יָדִ֖/י לֹ֥א תִֽהְיֶה בָּֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/013.yaml
  text: May Yahweh judge between me and you[a], and may Yahweh avenge me on you[c][b]; but my hand will not be against you.
translation:
  language: hi
  text: याहवे मेरे और तेरे बीच न्याय करे, और याहवे तुझसे मेरा बदला ले[a]; पर मेरा हाथ तेरे विरुद्ध न होगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे मेरी ओर से तुझसे बदला ले।”
    reason: lexical_alternative
  - marker: b
    text: “मेरा हाथ तेरे विरुद्ध न होगा” एक इब्रानी अभिव्यक्ति है, जिसका अर्थ है कि दाऊद स्वयं उसके विरुद्ध हिंसक कार्रवाई नहीं करेगा।
    reason: cultural_note
lexical_decisions:
- source_word: יִשְׁפֹּט
  choice: न्याय करे
  rationale: यहाँ अपूर्ण क्रिया प्रार्थनात्मक/कामनार्थक भाव व्यक्त करती है; ‘न्याय करे’ दाऊद की अपील को स्वाभाविक हिन्दी में रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम יהוה है; उसे किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: בֵּינִי וּבֵינֶךָ
  choice: मेरे और तेरे बीच
  rationale: यह न्यायिक तुलना का स्पष्ट और निकट रूप है तथा दोनों पक्षों के व्यक्तिगत विरोध को बनाए रखता है।
- source_word: וּנְקָמַנִי ... מִמֶּךָּ
  choice: तुझसे मेरा बदला ले
  rationale: נקם का अर्थ प्रतिशोध या बदला लेना है, और מן उस व्यक्ति को चिह्नित करता है जिससे बदला लिया जाता है। यह हिन्दी प्रयोग मूल अर्थ को बिना नरम किए स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: पर मेरा हाथ तेरे विरुद्ध न होगा
  rationale: ‘हाथ’ को मूल इब्रानी बिंब के रूप में रखा गया है; ‘पर’ परमेश्वर के कार्य और दाऊद के स्वयं हिंसक कार्रवाई न करने के बीच विरोध स्पष्ट करता है।
theological_decisions:
- issue: יהוה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा-संबंधी व्यक्तिगत नाम सीधे आया है; लिप्यंतरण उसे उपाधि में बदलने से बचाता है।
- issue: दाऊद की נקם संबंधी अपील
  choice: याहवे तुझसे मेरा बदला ले
  alternative: याहवे मुझे निर्दोष ठहराए
  rationale: मूल क्रिया प्रतिशोध/बदला लेने की प्रबल धारणा रखती है। पद स्वयं इस अपील को दाऊद के अपने हाथ से कार्रवाई न करने के साथ तनाव में रखता है; अनुवाद उस तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। दाऊद और शाऊल के प्रत्यक्ष संवाद के अनुरूप एकवचन ‘तेरे/तुझसे’ का प्रयोग किया गया है। इब्रानी ‘हाथ’ का रूपक मुख्य पाठ में सुरक्षित है और पादटिप्पणी में स्पष्ट किया गया है।
