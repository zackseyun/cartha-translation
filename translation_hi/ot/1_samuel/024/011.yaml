source:
  edition: WLC
  text: הִנֵּה֩ הַ/יּ֨וֹם הַ/זֶּ֜ה רָא֣וּ עֵינֶ֗י/ךָ אֵ֣ת אֲשֶׁר נְתָנְ/ךָ֩ יְהוָ֨ה הַ/יּ֤וֹם בְּ/יָדִ/י֙ בַּ/מְּעָרָ֔ה וְ/אָמַ֥ר לַ/הֲרָגֲ/ךָ֖ וַ/תָּ֣חָס עָלֶ֑י/ךָ וָ/אֹמַ֗ר לֹא אֶשְׁלַ֤ח יָדִ/י֙ בַּֽ/אדֹנִ֔/י כִּי מְשִׁ֥יחַ יְהוָ֖ה הֽוּא־׀׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/011.yaml
  text: Look[a], this day your own eyes have seen that Yahweh gave you today into my hand in the cave, and I said to kill you, but I spared you. I said, ‘I will not stretch out my hand against my lord[b], for he is Yahweh’s anointed.’
translation:
  language: hi
  text: देखो, आज तुम्हारी अपनी आँखों ने देखा है कि यहोवा ने आज गुफा में तुम्हें मेरे हाथ में सौंप दिया। तब किसी ने तुम्हें मार डालने को कहा[a], पर मैंने तुम्हें बख्श दिया। मैंने कहा, ‘मैं अपने स्वामी के विरुद्ध हाथ नहीं उठाऊँगा, क्योंकि वह यहोवा का अभिषिक्त है।’
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तब उसने तुम्हें मार डालने को कहा,” “तुम्हें मार डालने की बात कही गई,” अथवा “मुझसे तुम्हें मार डालने को कहा गया।” इब्रानी में क्रिया एकवचन है, पर उसका कर्ता बताया नहीं गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला उद्गार है; ‘देखो’ आधुनिक और स्वाभाविक हिन्दी में इसका संकेतात्मक तथा बलात्मक प्रभाव रखता है।
- source_word: רָאוּ עֵינֶיךָ
  choice: तुम्हारी अपनी आँखों ने देख लिया है
  rationale: आँखों को प्रत्यक्ष साक्षी बताने वाले इब्रानी मुहावरे और उसके बल को स्पष्ट, स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: נְתָנְךָ יְהוָה ... בְּיָדִי
  choice: यहोवा ने ... तुम्हें मेरे हाथ में कर दिया था
  rationale: נתן के साथ ‘हाथ में’ किसी को दूसरे के अधिकार में सौंपे जाने को व्यक्त करता है; यह हिन्दी प्रयोग अर्थ और मूल बिंब दोनों बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के विशिष्ट वाचा-नाम को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: בַּמְּעָרָה
  choice: गुफा में
  rationale: स्थान का सीधा और स्वाभाविक अनुवाद।
- source_word: וְאָמַר לַהֲרָגֲךָ
  choice: तब किसी ने तुम्हें मार डालने को कहा
  rationale: क्रिया एकवचन है, पर उसका कर्ता व्यक्त नहीं है। ‘किसी ने’ अनिर्दिष्ट कर्ता को बनाए रखता है और पाठ को अनावश्यक रूप से दाऊद की अपनी आज्ञा नहीं बनाता।
- source_word: וַתָּחָס עָלֶיךָ
  choice: पर मैंने तुम्हें छोड़ दिया
  rationale: संदर्भ में क्रिया वध न करके जीवन बख्शने को दर्शाती है। ‘छोड़ दिया’ सामान्य हिन्दी में संयम और प्राण बख्शने का आशय देता है।
- source_word: לֹא אֶשְׁלַח יָדִי
  choice: मैं ... हाथ नहीं उठाऊँगा
  rationale: यह विरोधी या हिंसक कार्रवाई करने का मुहावरा है; हिन्दी का ‘हाथ उठाना’ उसी भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּאדֹנִי
  choice: अपने स्वामी के विरुद्ध
  rationale: यहाँ אדני शाऊल के लिए मानवीय अधीनता और सम्मान का संबोधन है, दिव्य उपाधि नहीं।
- source_word: מְשִׁיחַ יְהוָה
  choice: यहोवा का अभिषिक्त
  rationale: राजा के रूप में यहोवा द्वारा अभिषिक्त व्यक्ति का संकेत है; ‘अभिषिक्त’ राजकीय अभिषेक और धार्मिक महत्त्व दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में विशिष्ट ईश्वरीय नाम है। आधुनिक हिन्दी बाइबलीय प्रयोग में पहचान योग्य नामरूप ‘यहोवा’ रखा गया है, न कि सामान्य उपाधि ‘प्रभु’।
- issue: מְשִׁיחַ יְהוָה का राजकीय संदर्भ
  choice: यहोवा का अभिषिक्त
  alternative: यहोवा का मसीह
  rationale: इस कथा में वाक्यांश अभिषेक द्वारा स्थापित राजा शाऊल को दर्शाता है। ‘अभिषिक्त’ तत्कालीन राजकीय अर्थ को रखता है और बाद की विशिष्ट मसीही उपाधि को अनावश्यक रूप से आरोपित नहीं करता।
- issue: וְאָמַר में अनिर्दिष्ट कर्ता
  choice: किसी ने ... कहा
  alternative: मैंने ... कहा
  rationale: मसोरेटी पाठ में एकवचन क्रिया का स्पष्ट कर्ता नहीं है। मुख्य पाठ में अनिर्दिष्टता बनाए रखी गई है; सम्भावित अन्य व्याकरणिक समझ फुटनोट में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कथात्मक है। ‘अपनी आँखों ने’, ‘मेरे हाथ में’ और ‘हाथ नहीं उठाऊँगा’ जैसे मूल बिंब जहाँ हिन्दी में सहज हैं, वहाँ सुरक्षित रखे गए हैं। मुख्य पाठ ने इब्रानी के अनिर्दिष्ट कर्ता को खुला रखा है।
