base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/022.yaml
  text: Now swear to me by Yahweh that you will not cut off my descendants after me[c][b][a], and that you will not wipe out my name from my father's house.
translation:
  language: hi
  text: अब याहवे की शपथ खाकर मुझसे वचन दे कि[a] तू मेरे बाद मेरे वंशजों[b] का अन्त नहीं करेगा और मेरे पिता के घराने से मेरा नाम[c] नहीं मिटाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में यहाँ शाब्दिक रूप से ‘यदि’ है। शपथ के इस सूत्र में वह उस प्रतिज्ञा की विषय-वस्तु प्रस्तुत करता है जिसकी शपथ शाऊल दाऊद से लेना चाहता है; इसलिए अनुवाद में ‘कि … नहीं’ कहा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरी सन्तति’। इब्रानी शब्द का शाब्दिक अर्थ ‘बीज’ भी हो सकता है, पर यहाँ वह वंशजों को दर्शाता है।
    reason: lexical_alternative
  - marker: c
    text: यहाँ ‘मेरा नाम’ शाऊल की स्मृति, पारिवारिक वंश और अपने कुल में बनी रहने वाली पहचान को सूचित करता है।
    reason: cultural_note
lexical_decisions:
- source_word: וְעַתָּה
  choice: अब
  rationale: यह शाऊल के समापन अनुरोध को आरम्भ करने वाला स्वाभाविक वार्तालाप-सूचक है।
- source_word: הִשָּׁבְעָה לִּי
  choice: शपथ खाकर मुझसे वचन दे
  rationale: निफ़अल आज्ञार्थक यहाँ शपथ द्वारा दृढ़ प्रतिज्ञा की माँग करता है; यह हिन्दी में अर्थ और प्रसंग दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַּיהוָה
  choice: याहवे की
  rationale: यह शपथ में सीधे इस्राएल के परमेश्वर के विशिष्ट नाम का आह्वान है।
- source_word: אִם / וְאִם
  choice: कि … नहीं … और … नहीं
  rationale: शपथ-सूत्र में אִם दोनों निषेधात्मक प्रतिज्ञाओं की विषय-वस्तु प्रस्तुत करता है; हिन्दी में केवल ‘यदि’ कहने से वाक्य अधूरा या भ्रामक लगेगा।
- source_word: תַכְרִית אֶת־זַרְעִי
  choice: मेरे वंशजों का अन्त नहीं करेगा
  rationale: כרת का हिफ़ील रूप किसी वंश को काट देने या समाप्त कर देने का भाव रखता है, और זֶרַע यहाँ भावी सन्तति को दर्शाता है।
- source_word: אַחֲרָי
  choice: मेरे बाद
  rationale: यहाँ इसका कालगत अर्थ प्रमुख है—शाऊल अपने जाने के बाद की सन्तति की बात कर रहा है।
- source_word: תַשְׁמִיד אֶת־שְׁמִי
  choice: मेरा नाम नहीं मिटाएगा
  rationale: שמד का हिफ़ील रूप पूर्ण विनाश का सशक्त भाव देता है; ‘नाम मिटाना’ हिन्दी में पारिवारिक स्मृति और पहचान के लोप को भी बनाए रखता है।
- source_word: מִבֵּית אָבִי
  choice: मेरे पिता के घराने से
  rationale: यह पैतृक परिवार या कुल को सूचित करने वाली इब्रानी संबंध-संज्ञा का स्पष्ट और गरिमापूर्ण हिन्दी रूप है।
theological_decisions:
- issue: शपथ-सूत्र में יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ शपथ में चार-अक्षरीय विशिष्ट ईश्वरीय नाम का सीधे प्रयोग करता है; ‘याहवे’ उस वाचा-नाम को सामान्य उपाधि में बदले बिना प्रस्तुत करता है।
- issue: אִם वाले शपथ-सूत्र में नकार का अर्थ
  choice: प्रतिज्ञा की विषय-वस्तु को ‘कि … नहीं’ के रूप में व्यक्त किया
  alternative: शाब्दिक ‘यदि’ को बनाए रखना
  rationale: इब्रानी शपथ-प्रयोग में אִם निषेधात्मक वचन का सूत्रगत परिचय देता है। केवल ‘यदि’ वाला हिन्दी अनुवाद अस्वाभाविक और अर्थतः अधूरा होगा; पादटिप्पणी मूल संरचना को पारदर्शी रखती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और कथात्मक है। ‘शपथ खाकर … वचन दे’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘पिता का घराना’ मूल की पैतृक-कुल संरचना को बनाए रखता है। सर्वनाम ‘तू’ निकट, प्रत्यक्ष संबोधन और बाइबिलीय कथन-शैली के अनुरूप रखा गया है।
