base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/004.yaml
  text: He came to the sheepfolds by the road[a], where there was a cave, and Saul went in to relieve himself. Now David and his men were sitting in the innermost parts of the cave.
translation:
  language: hi
  text: वह मार्ग के पास भेड़ों के बाड़ों के पास आया, जहाँ एक गुफा थी। शाऊल शौच करने[a] के लिए उसमें गया, और दाऊद तथा उसके आदमी गुफा के सबसे भीतरी भागों में बैठे थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, “अपने पाँव ढाँकना।” यह शौच करने के लिए प्रयुक्त एक हिब्रू मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּדְרוֹת הַצֹּאן
  choice: भेड़शालाओं
  rationale: यह पद भेड़ों के लिए बने बाड़ों या घेरों को दर्शाता है; ‘भेड़शाला’ आधुनिक हिन्दी में संक्षिप्त और ठोस स्थान-सूचक शब्द है।
- source_word: עַל הַדֶּרֶךְ
  choice: मार्ग के पास की
  rationale: यह वाक्यांश भेड़शालाओं को मार्ग के सापेक्ष स्थित करता है; हिन्दी में यह प्रयोग स्वाभाविक है।
- source_word: מְעָרָה
  choice: एक गुफा
  rationale: स्रोत संज्ञा का सीधा और मानक हिन्दी अर्थ।
- source_word: לְהָסֵךְ אֶת רַגְלָיו
  choice: शौच करने
  rationale: शाब्दिक अर्थ ‘अपने पाँव ढकने’ है, पर यह शौच के लिए प्रयुक्त हिब्रू मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट रखा गया है और मूल बिंब पाद-टिप्पणी में दिया गया है।
- source_word: בְּיַרְכְּתֵי הַמְּעָרָה
  choice: गुफा के सबसे भीतरी भागों में
  rationale: יַרְכְּתֵי दूरस्थ, पिछले अथवा अंतरतम हिस्सों को सूचित करता है; यह अनुवाद स्थानिक बल को बनाए रखता है।
- source_word: יֹשְׁבִים
  choice: बैठे थे
  rationale: कृदन्त इस दृश्य में उनकी तत्काल मुद्रा और स्थिति बताता है, न कि स्थायी निवास।
- source_word: וַיָּבֹא ... וַיָּבֹא
  choice: आया ... उसमें गया
  rationale: पहली क्रिया यात्रा की गति को आगे बढ़ाती है और दूसरी शाऊल के गुफा में प्रवेश को बताती है; हिन्दी में पुनरुक्ति से बचते हुए क्रम सुरक्षित है।
