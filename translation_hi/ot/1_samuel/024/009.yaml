base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/009.yaml
  text: After that David rose and went out of the cave[a], and called after Saul, saying, “My lord the king!” When Saul looked behind him, David bowed with his face to the ground and prostrated himself.
translation:
  language: hi
  text: इसके बाद दाऊद उठा, गुफा से बाहर निकला और शाऊल को पुकारकर कहा, “मेरे स्वामी, हे राजा!” जब शाऊल ने पीछे मुड़कर देखा, तब दाऊद ने मुँह भूमि की ओर झुकाया और दण्डवत किया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “झुककर प्रणाम किया।” इब्रानी क्रिया गहरे सम्मान या अधीनता में भूमि पर दण्डवत होने को व्यक्त कर सकती है; यहाँ यह शाऊल के सामने दाऊद की मुद्रा है, परमेश्वर की आराधना नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיָּקָם
  choice: उठा
  rationale: קום का कालगत कथात्मक रूप उठने की क्रिया बताता है; ‘उठा’ संक्षिप्त और स्वाभाविक है।
- source_word: אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पदबंध घटनाओं का सीधा कालक्रम व्यक्त करता है।
- source_word: וַיֵּצֵא מִן־הַמְּעָרָה
  choice: गुफा से बाहर निकला
  rationale: יצא का अर्थ किसी स्थान से बाहर निकलना है; यह हिन्दी कथन में स्वाभाविक है।
- source_word: וַיִּקְרָא אַחֲרֵי שָׁאוּל
  choice: शाऊल के पीछे पुकारकर कहा
  rationale: אַחֲרֵי यहाँ आगे जा रहे शाऊल के पीछे से पुकारने का भाव देता है; ‘पुकारकर कहा’ आगे आने वाले कथन से सहजता से जुड़ता है।
- source_word: אֲדֹנִי הַמֶּלֶךְ
  choice: हे मेरे प्रभु, राजा
  rationale: אֲדֹנִי आदरसूचक सम्बोधन है और הַמֶּלֶךְ शाही पदवी; हिन्दी में दोनों को स्पष्ट रखा गया है।
- source_word: וַיַּבֵּט שָׁאוּל אַחֲרָיו
  choice: जब शाऊल ने पीछे मुड़कर देखा
  rationale: निहित दिशा को स्वाभाविक हिन्दी में ‘पीछे मुड़कर’ व्यक्त किया गया है; ‘जब’ अगली क्रिया से कालगत सम्बन्ध स्पष्ट करता है।
- source_word: וַיִּקֹּד אַפַּיִם אַרְצָה
  choice: भूमि तक मुँह झुकाया
  rationale: קדד झुकने को और אַפַּיִם אַרְצָה मुँह भूमि की ओर होने की गहरी मुद्रा को व्यक्त करता है।
- source_word: וַיִּשְׁתָּחוּ
  choice: दण्डवत किया
  rationale: यह क्रिया गहरे सम्मान या अधीनता में भूमि तक झुकने को बताती है; ‘दण्डवत किया’ पहली क्रिया से इसकी तीव्रता अलग रखते हुए शारीरिक मुद्रा को व्यक्त करता है।
theological_decisions:
- issue: शाऊल के सामने दाऊद के झुकने का अर्थ
  choice: मनुष्य-राजा के प्रति गहरे सम्मान और अधीनता की शारीरिक मुद्रा
  alternative: ‘उसकी आराधना की’ या केवल ‘प्रणाम किया’
  rationale: שׁחה सन्दर्भ के अनुसार परमेश्वर की आराधना या मनुष्य के प्रति गहरा सम्मान दोनों व्यक्त कर सकता है। यहाँ शाऊल के सामने दाऊद की मुद्रा है, इसलिए ‘आराधना’ कहना अनुचित धार्मिक अर्थ जोड़ेगा, जबकि केवल ‘प्रणाम’ शारीरिक गहराई को कम कर सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कथात्मक रूप रखा गया है। ‘प्रभु’ यहाँ आदरसूचक मानवीय सम्बोधन है। ‘दण्डवत’ की सम्भावित धार्मिक ध्वनि को पादटिप्पणी में सन्दर्भानुसार स्पष्ट किया गया है।
