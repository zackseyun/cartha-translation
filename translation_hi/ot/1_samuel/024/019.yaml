  text: ו/את הִגַּ֣דְתָּ הַ/יּ֔וֹם אֵ֛ת אֲשֶׁר עָשִׂ֥יתָה אִתִּ֖/י טוֹבָ֑ה אֵת֩ אֲשֶׁ֨ר סִגְּרַ֧/נִי יְהוָ֛ה בְּ/יָדְ/ךָ֖ וְ/לֹ֥א הֲרַגְתָּֽ/נִי־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/019.yaml
  text: 'And you have declared today what good you have done to me: when Yahweh gave me into your hand[b][a], you did not kill me.'
translation:
  language: hi
  text: 'और आज तुमने प्रकट कर दिया है कि तुमने मेरे साथ जो भलाई की है[a]: याहवे ने मुझे तुम्हारे हाथ में सौंप दिया[b], फिर भी तुमने मुझे नहीं मारा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज तुमने मुझ पर की हुई कृपा प्रकट कर दी है।”
    reason: עָשִׂיתָה אִתִּי טוֹבָה का अर्थ ‘मेरे साथ की हुई भलाई’ है; प्रसंगानुसार इसे ‘मुझ पर की हुई कृपा’ भी कहा जा सकता है। הִגַּדְתָּ के लिए ‘प्रकट कर दिया’ एक स्वाभाविक विकल्प है।
  - marker: b
    text: या, “मुझे तुम्हारे अधिकार में कर दिया” या “मुझे तुम्हारे हाथ में दे दिया।”
    reason: סִגְּרַנִי इस प्रसंग में किसी को दूसरे के अधिकार या वश में सौंप देने के अर्थ में है।
lexical_decisions:
- source_word: הִגַּדְתָּ
  choice: बता दिया है
  rationale: हिफ़ील में נגד का सामान्य अर्थ ‘बताना, प्रकट करना, ज्ञात कराना’ है। यहाँ दाऊद के व्यवहार ने उसकी भलाई को प्रत्यक्ष रूप से जाहिर किया; ‘बता दिया है’ इस अर्थ को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הַיּוֹם
  choice: आज
  rationale: यह सीधा समय-सूचक क्रियाविशेषण है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: עָשִׂיתָה אִתִּי טוֹבָה
  choice: तुमने मेरे साथ कैसी भलाई की है
  rationale: इब्रानी वाक्यांश का निकट अर्थ ‘तुमने मेरे साथ भलाई की’ है। ‘कैसी भलाई’ अֲשֶׁר के प्रसंगगत बल को स्वाभाविक हिन्दी में व्यक्त करता है, बिना इसे केवल भाव या सद्भाव तक सीमित किए।
- source_word: סִגְּרַנִי
  choice: मुझे ... सौंप दिया
  rationale: इस प्रसंग में סגר किसी को दूसरे के अधिकार में कर देने या सौंप देने का भाव रखता है। ‘सौंप दिया’ हिन्दी में स्पष्ट है; अधिक शाब्दिक ‘बंद कर दिया’ यहाँ भ्रामक होगा।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम, टेट्राग्रामटन, सीधे प्रयुक्त है; इसलिए किसी उपाधि से बदलने के बजाय उसका हिन्दी लिप्यंतरण किया गया है।
- source_word: בְּיָדְךָ
  choice: तुम्हारे हाथ में
  rationale: यह अधिकार या वश में होने का इब्रानी रूपक है। ‘हाथ में’ हिन्दी में भी सुबोध है और मूल रूपक को बनाए रखता है।
- source_word: וְלֹא הֲרַגְתָּנִי
  choice: तो तुमने मुझे नहीं मारा
  rationale: הרג का सीधा आधुनिक हिन्दी समतुल्य ‘मारना’ है। ‘तो’ पूर्ववर्ती समयवाचक उपवाक्य को मुख्य कथन से स्वाभाविक रूप से जोड़ता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में व्यक्तिगत ईश्वरीय नाम उपस्थित है। ‘याहवे’ मूल नाम का प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम’ प्रसंगानुकूल प्रत्यक्ष संबोधन है। इब्रानी ‘हाथ में’ का रूपक सुरक्षित रखा गया है, जबकि मुख्य पाठ में סגר का प्रसंगगत अर्थ ‘सौंप दिया’ दिया गया है।
