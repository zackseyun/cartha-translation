translation:
  language: hi
  text: तब दाऊद वहाँ से ऊपर गया और एन-गदी के गढ़ों में रहने लगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַל
  choice: ऊपर गया
  rationale: עלה ऊपर की ओर जाने का भाव रखता है; ‘ऊपर गया’ स्वाभाविक हिन्दी में इस दिशात्मक अर्थ को बनाए रखता है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: यह स्थान-सूचक पद है; ‘वहाँ से’ इसका संक्षिप्त और स्वाभाविक हिन्दी रूप है।
- source_word: וַיֵּשֶׁב
  choice: रहने लगा
  rationale: ישב यहाँ किसी स्थान पर ठहरकर रहने का संकेत देता है। ‘रहने लगा’ अस्थायी निवास के कथात्मक भाव को व्यक्त करता है, बिना स्थायी बसावट का अनावश्यक संकेत दिए।
- source_word: בִּמְצָדוֹת
  choice: गढ़ों में
  rationale: מְצָדוֹת सुरक्षित और रक्षा योग्य स्थानों को दर्शाता है। ‘गढ़’ निर्मित किलों तक अर्थ को सीमित किए बिना ऐसे शरण-स्थलों का स्वाभाविक हिन्दी शब्द है।
- source_word: עֵין גֶּדִי
  choice: एन-गदी
  rationale: यह स्थान-नाम है, इसलिए इसका अनुवाद करने के बजाय देवनागरी में लिप्यंतरण किया गया है।
