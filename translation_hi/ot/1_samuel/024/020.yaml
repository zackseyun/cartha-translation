source:
  edition: WLC
  text: וְ/כִֽי יִמְצָ֥א אִישׁ֙ אֶת אֹ֣יְב֔/וֹ וְ/שִׁלְּח֖/וֹ בְּ/דֶ֣רֶךְ טוֹבָ֑ה וַֽ/יהוָה֙ יְשַׁלֶּמְ/ךָ֣ טוֹבָ֔ה תַּ֚חַת הַ/יּ֣וֹם הַ/זֶּ֔ה אֲשֶׁ֥ר עָשִׂ֖יתָה לִֽ/י־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/020.yaml
  text: For when a man finds his enemy and lets him go on his way safely[b][a], may Yahweh repay you with good for what you have done to me this day.
translation:
  language: hi
  text: क्योंकि जब किसी मनुष्य को अपना शत्रु मिलता है और वह उसे सकुशल विदा कर देता है,[a] तो याहवे आज तूने मेरे लिए जो किया है उसके बदले तुझे भलाई का प्रतिफल दे![b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसे अच्छी राह पर भेज देता है।” अर्थात् उसे सुरक्षित, बिना हानि पहुँचाए जाने देता है।
    reason: मूल इब्रानी मुहावरे के शाब्दिक बिंब और उसके संदर्भगत अर्थ को सुरक्षित रखना।
  - marker: b
    text: या, “याहवे ... तुझे भलाई का प्रतिफल देगा।” इब्रानी क्रियारूप को आशीर्वचन या भविष्यसूचक कथन, दोनों रूपों में समझा जा सकता है।
    reason: क्रियारूप की आशीर्वचनात्मक/भविष्यवाची अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וְכִי יִמְצָא אִישׁ אֶת אֹיְבוֹ
  choice: क्योंकि जब कोई मनुष्य अपने शत्रु को पाता है, तो क्या वह...
  rationale: וְכִי यहाँ पिछले कथन का कारण देते हुए एक सामान्य, अलंकारिक प्रश्न आरम्भ करता है। हिंदी में प्रश्नात्मक रूप निहित आश्चर्य को स्वाभाविक ढंग से व्यक्त करता है। אִישׁ का एकवचन पुल्लिंग रूप ‘कोई मनुष्य’ से सुरक्षित है।
- source_word: וְשִׁלְּחוֹ בְּדֶרֶךְ טוֹבָה
  choice: उसे सकुशल जाने देता है
  rationale: शाब्दिक अर्थ ‘उसे अच्छी राह पर भेजता है’ है, पर प्रसंग में इसका भाव शत्रु को बिना हानि पहुँचाए सुरक्षित छोड़ देना है। ‘सकुशल जाने देता है’ वर्तमान हिंदी में स्वाभाविक है और राह/प्रस्थान का बिंब भी रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: יְשַׁלֶּמְךָ טוֹבָה
  choice: तुझे भलाई का प्रतिफल दे
  rationale: שלם के प्रतिदान-संबंधी अर्थ और טובה के सकारात्मक भाव को स्पष्ट तथा स्वाभाविक हिंदी में रखा गया है। क्रिया को आशीर्वचन के रूप में समझा गया है, जबकि भविष्यवाची संभावना पादटिप्पणी में दी गई है।
- source_word: תַּחַת הַיּוֹם הַזֶּה אֲשֶׁר עָשִׂיתָה לִי
  choice: आज जो भलाई तूने मेरे साथ की है, उसके बदले
  rationale: תחת का प्रतिदानार्थक भाव ‘उसके बदले’ से व्यक्त है। मूल में कर्म केवल ‘जो तूने मेरे लिए/साथ किया’ है; निकटवर्ती טובה के भाव को हिंदी में स्पष्ट करने के लिए ‘भलाई’ जोड़ा गया है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का रूप
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल में व्यक्तिगत दिव्य नाम है। हिंदी पाठकों के लिए सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है, उपाधि ‘प्रभु’ में नहीं बदलता।
- issue: יְשַׁלֶּמְךָ को आशीर्वचन या भविष्यवचन समझना
  choice: यहोवा तुझे भलाई का प्रतिफल दे!
  alternative: यहोवा तुझे भलाई का प्रतिफल देगा।
  rationale: yiqtol रूप दोनों अर्थों की अनुमति देता है। शाऊल के संबोधन में आशीर्वचन स्वाभाविक है, पर वास्तविक व्याकरणिक अस्पष्टता पादटिप्पणी में संरक्षित है।
- issue: पहले उपवाक्य की अलंकारिक शक्ति
  choice: तो क्या वह उसे सकुशल जाने देता है?
  alternative: और वह उसे सकुशल जाने देता है
  rationale: מִי जैसे स्पष्ट प्रश्नवाचक शब्द के बिना भी प्रसंग और कथन की असामान्यता इसे अलंकारिक प्रश्न के रूप में सुनने का आधार देते हैं। वैकल्पिक कथनात्मक पठन पादटिप्पणी में संकेतित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और बोलचाल में सुबोध हिंदी। ऐतिहासिक संबोधन की निकटता और एकवचन को बनाए रखने के लिए ‘तू/तुझे/तूने’ प्रयुक्त है। पहले खंड को अलंकारिक प्रश्न बनाया गया है ताकि शाऊल का आश्चर्य स्पष्ट हो; पादटिप्पणी कथनात्मक विकल्प सुरक्षित रखती है।
