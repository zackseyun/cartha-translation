  text: Afterward David’s heart struck him because he had cut off the corner of Saul’s robe[a][b].
translation:
  language: hi
  text: इसके बाद दाऊद का हृदय उसे कचोटने लगा[a], क्योंकि उसने शाऊल के वस्त्र का कोना काट लिया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “दाऊद के हृदय ने उसे मारा”; यह व्याकुल अंतःकरण को व्यक्त करने वाला मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “किनारा” अथवा “छोर”; इब्रानी शब्द वस्त्र के किसी अंतिम भाग को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְהִי אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पद पिछले कार्य के बाद की घटना बताता है। आधुनिक हिन्दी में ‘इसके बाद’ स्वाभाविक है और इब्रानी के कालक्रम को स्पष्ट रखता है।
- source_word: וַיַּךְ לֵב דָּוִד אֹתוֹ
  choice: दाऊद का हृदय उसे धिक्कारने लगा
  rationale: शाब्दिक चित्र ‘दाऊद के हृदय ने उसे मारा’ है। ‘हृदय उसे धिक्कारने लगा’ हृदय को कर्ता बनाए रखता है और हिन्दी में व्याकुल नैतिक चेतना का अर्थ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לֵב
  choice: हृदय
  rationale: इब्रानी में हृदय मनुष्य की आंतरिक नैतिक चेतना को भी समेटता है। मुख्य पाठ में ठोस स्रोत-चित्र को बनाए रखने के लिए ‘विवेक’ के स्थान पर ‘हृदय’ रखा गया है।
- source_word: עַל אֲשֶׁר
  choice: क्योंकि
  rationale: यह पद दाऊद की आंतरिक ग्लानि का कारण बताता है; ‘क्योंकि’ इसका स्पष्ट और स्वाभाविक हिन्दी समतुल्य है।
- source_word: כָּרַת
  choice: काट लिया था
  rationale: क्रिया का अर्थ काटना या काटकर अलग करना है। ‘था’ से स्पष्ट होता है कि यह काम हृदय के धिक्कारने से पहले हो चुका था।
- source_word: כָּנָף
  choice: कोना
  rationale: मूल अर्थ ‘पंख’ है और विस्तार से किसी वस्त्र का सिरा, किनारा या कोना हो सकता है। ‘कोना’ उपयुक्त है, पर अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: אֶת כָּנָף אֲשֶׁר לְשָׁאוּל
  choice: शाऊल के वस्त्र का कोना
  rationale: इब्रानी में शाऊल से संबंधित ‘कोना’ कहा गया है; पिछले पद के संदर्भ से ‘वस्त्र’ स्पष्ट है। हिन्दी में आशय पूरा और स्वाभाविक करने के लिए इसे व्यक्त किया गया है।
