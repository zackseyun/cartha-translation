  text: May the LORD be judge and decide between me and you, see and plead my case, and vindicate me from your hand.
translation:
  language: hi
  text: यहोवा न्यायाधीश हों और मेरे और आपके बीच फैसला करें। वे देखें, मेरा मुकदमा लड़ें और आपके हाथ से मुझे न्याय दिलाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהָיָה יְהוָה לְדַיָּן
  choice: यहोवा न्यायी ठहरे
  rationale: इच्छासूचक प्रसंग में हिब्रू संरचना को स्वाभाविक और गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְשָׁפַט בֵּינִי וּבֵינֶךָ
  choice: मेरे और तेरे बीच फैसला करे
  rationale: שפט यहाँ दोनों पक्षों के बीच न्यायिक निर्णय करने के अर्थ में है; ‘फैसला करे’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: וְיָרֵב אֶת רִיבִי
  choice: मेरा मुकदमा लड़े
  rationale: 'रיב का न्यायिक रूपक बनाए रखता है: यह केवल निवेदन करना नहीं, किसी का पक्ष लेकर उसका मुकदमा लड़ना है।'
- source_word: וְיִשְׁפְּטֵנִי מִיָּדֶךָ
  choice: तेरे हाथ से मुझे न्याय दिलाए
  rationale: क्रिया के न्यायिक भाव और מִיַּדֶךָ के छुड़ाए जाने के आशय, दोनों को समेटता है; ‘निर्दोष ठहराए’ मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: दाऊद द्वारा अंतिम न्याय परमेश्वर को सौंपना
  choice: सभी इच्छासूचक क्रियाओं का कर्ता यहोवा रखा गया है
  alternative: वाक्य को निश्चित भविष्यवाणी की तरह प्रस्तुत करना
  rationale: प्रसंग और क्रियारूप दाऊद की अपील/कामना व्यक्त करते हैं, न कि केवल भविष्य के बारे में निर्विवाद घोषणा।
- issue: वाचा-नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिगत दिव्य नाम को हिन्दी में प्रचलित रूप से प्रत्यक्ष रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संबोधन में एकवचन ‘तेरे’ मूल के द्वितीय पुरुष एकवचन और शाऊल से सीधे संबोधन को दर्शाता है। भाषा न्यायालय-संबंधी रूपक को बनाए रखते हुए सामान्य पाठक के लिए सहज रखी गई है।
