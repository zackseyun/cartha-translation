  text: और अब, देख, मैं जानता हूँ कि तू निश्चय ही राज्य करेगा, और इस्राएल का राज्य तेरे हाथ में स्थिर होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הִנֵּה
  choice: देख
  rationale: यहाँ ध्यान आकर्षित करने वाला प्रत्यक्ष संबोधन है; आधुनिक हिन्दी में “देख” स्वाभाविक है और अंग्रेज़ी consultation layer के “look” से भी मेल खाता है।
- source_word: מָלֹךְ תִּמְלוֹךְ
  choice: तू निश्चय ही राजा होगा
  rationale: एक ही धातु के infinitive absolute और finite verb का संयोजन कथन को दृढ़ करता है; “निश्चय ही” उस बल को स्पष्ट हिन्दी में व्यक्त करता है।
- source_word: וְקָמָה
  choice: दृढ़ हो जाएगा
  rationale: קום का अर्थ यहाँ राज्य का स्थापित या स्थिर होना है; “दृढ़ हो जाएगा” वैधानिक और स्थायी स्थापना की भावना व्यक्त करता है।
- source_word: בְּיָדְךָ
  choice: तेरे हाथ में
  rationale: मूल का ठोस रूपक सुरक्षित रखा गया है; यह अधिकार और नियंत्रण दोनों का संकेत देता है।
theological_decisions:
- issue: दाऊद के भावी राजत्व की निश्चितता
  choice: “निश्चय ही राजा होगा” द्वारा प्रबल निश्चितता बनाए रखी गई
  alternative: “राजा बनेगा”
  rationale: मूल में emphatic construction है; साधारण भविष्यकाल उसका बल कम कर देता।
- issue: राज्य की स्थापना और मानवीय अधिकार का संबंध
  choice: “तेरे हाथ में दृढ़ हो जाएगा”
  alternative: “तेरे द्वारा स्थापित होगा”
  rationale: मूल में कर्ता राज्य है और “तेरे हाथ में” अधिकार-क्षेत्र बताता है; इसे दाऊद द्वारा सक्रिय स्थापना में बदलना अनावश्यक व्याख्या होती।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष संबोधन। शाऊल द्वारा दाऊद को एकवचन निकट संबोधन होने के कारण “तू/तेरे” रखा गया है। वाक्य मूल की दो समन्वित घोषणाओं और उसके भविष्यसूचक दृढ़ बल को सुरक्षित रखता है।
