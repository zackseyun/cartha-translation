translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण कथात्मक शैली रखी गई है। ‘जन’ बाइबलीय प्रसंग के अनुकूल है, पर सामान्य पाठक के लिए भी बोधगम्य है; स्रोत की स्थलाकृतिक अस्पष्टता को फुटनोट सहित बनाए रखा गया है।
