source:
  edition: WLC
  text: וַ/יִּקַּ֣ח שָׁא֗וּל שְׁלֹ֧שֶׁת אֲלָפִ֛ים אִ֥ישׁ בָּח֖וּר מִ/כָּל יִשְׂרָאֵ֑ל וַ/יֵּ֗לֶךְ לְ/בַקֵּ֤שׁ אֶת דָּוִד֙ וַֽ/אֲנָשָׁ֔י/ו עַל פְּנֵ֖י צוּרֵ֥י הַ/יְּעֵלִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/003.yaml
  text: Then Saul took three thousand chosen men from all Israel and went to seek David and his men in front of the rocks of the wild goats[a].
translation:
  language: hi
  text: तब शाऊल ने सारे इस्राएल में से तीन हज़ार चुने हुए पुरुषों को साथ लिया और दाऊद तथा उसके आदमियों को जंगली बकरों की चट्टानों[a] के सामने ढूँढ़ने निकल पड़ा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘जंगली बकरों की चट्टानी कगारों के सामने’; यहाँ बताए गए पशु विशेष रूप से आइबेक्स हो सकते हैं।
    reason: צוּרֵי का अर्थ ‘चट्टानें’ अथवा ‘चट्टानी कगारें’ हो सकता है, और יְעֵלִים सामान्यतः जंगली बकरों को, संभवतः विशेष रूप से आइबेक्स को, सूचित करता है।
lexical_decisions:
- source_word: וַיִּקַּח
  choice: लिए
  rationale: לקח का सीधा अर्थ ‘लेना’ है; इस सैनिक प्रसंग में शाऊल ने इन पुरुषों को अभियान के लिए अपने साथ लिया।
- source_word: שְׁלֹשֶׁת אֲלָפִים אִישׁ בָּחוּר
  choice: तीन हज़ार चुने हुए पुरुष
  rationale: यह चयनित सैनिक पुरुषों की संख्या बताता है। ‘चुने हुए पुरुष’ अर्थ को स्पष्ट रखते हुए स्रोत की संरचना के निकट है।
- source_word: מִכָּל יִשְׂרָאֵל
  choice: सारे इस्राएल में से
  rationale: यह चयन पूरे इस्राएल में से किए जाने को दर्शाता है; हिंदी में यह सहज और स्पष्ट है।
- source_word: וַיֵּלֶךְ לְבַקֵּשׁ
  choice: ढूँढ़ने चला गया
  rationale: यहाँ infinitive उद्देश्य व्यक्त करता है। ‘ढूँढ़ने चला गया’ आधुनिक हिंदी में स्वाभाविक रूप से शाऊल की खोज और प्रस्थान दोनों बताता है।
- source_word: אֶת דָּוִד וַאֲנָשָׁיו
  choice: दाऊद तथा उसके जनों को
  rationale: ‘उसके जन’ दाऊद के साथ रहने वाले अनुयायियों या सैनिकों को संक्षेप और गरिमा से व्यक्त करता है।
- source_word: עַל פְּנֵי
  choice: के सामने
  rationale: स्थानसूचक पदबंध का मूल भाव ‘के सामने/सम्मुख’ है। इसे अधिक सामान्य ‘के पास’ में बदलने से मूल की स्थलाकृतिक अभिव्यक्ति धुँधली हो जाती।
- source_word: צוּרֵי הַיְּעֵלִים
  choice: जंगली बकरों की चट्टानों
  rationale: צוּרֵי चट्टानों या चट्टानी कगारों को और יְעֵלִים जंगली बकरों—संभवतः आइबेक्स—को दर्शाता है। मुख्य पाठ में सुबोध सामान्य नाम रखा गया है।
