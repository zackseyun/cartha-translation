source:
  edition: WLC
  text: וְ/אָבִ֣/י רְאֵ֔ה גַּ֗ם רְאֵ֛ה אֶת כְּנַ֥ף מְעִילְ/ךָ֖ בְּ/יָדִ֑/י כִּ֡י בְּ/כָרְתִ/י֩ אֶת כְּנַ֨ף מְעִֽילְ/ךָ֜ וְ/לֹ֣א הֲרַגְתִּ֗י/ךָ דַּ֤ע וּ/רְאֵה֙ כִּי֩ אֵ֨ין בְּ/יָדִ֜/י רָעָ֤ה וָ/פֶ֨שַׁע֙ וְ/לֹא חָטָ֣אתִי לָ֔/ךְ וְ/אַתָּ֛ה צֹדֶ֥ה אֶת נַפְשִׁ֖/י לְ/קַחְתָּֽ/הּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/1_samuel/024/012.yaml
  text: And[a], my father, see—yes, see the corner of your robe in my hand. For when I cut off the corner of your robe[b], I did not kill you. Know and see that there is no evil or transgression in my hand, and I have not sinned against you[c], though you are hunting my life to take it.
translation:
  language: hi
  text: और, हे मेरे पिता, देखिए—हाँ, मेरे हाथ में आपके बागे का कोना देखिए। क्योंकि जब मैंने आपके बागे का कोना काटा, तब मैंने आपको नहीं मारा। जान लीजिए और देखिए कि मेरे हाथ में न कोई बुराई है, न विद्रोह[a]। मैंने आपके विरुद्ध पाप नहीं किया, फिर भी आप मेरे प्राण लेने के लिए उनका शिकार कर रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपराध” अथवा “उल्लंघन।”
    reason: פֶשַׁע में विद्रोह के साथ अपराध या उल्लंघन का व्यापक नैतिक अर्थ भी संभव है।
  - marker: b
    text: शाब्दिक रूप से, “आप मेरे प्राण का शिकार कर रहे हैं, उसे लेने के लिए।”
    reason: मूल इब्रानी में दाऊद के प्राण को शिकार की वस्तु बनाकर कहा गया है।
lexical_decisions:
- source_word: וְאָבִי
  choice: और हे मेरे पिता
  rationale: शाऊल के प्रति दाऊद के आदरपूर्ण, पारिवारिक-राजनीतिक संबोधन को बनाए रखता है।
- source_word: רְאֵה גַּם רְאֵה
  choice: देखिए—हाँ, ... देखिए
  rationale: पुनरुक्ति और גַּם से उत्पन्न आग्रह तथा जोर को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כְּנַף מְעִילְךָ
  choice: आपके बागे का कोना
  rationale: כָּנָף यहाँ वस्त्र के छोर या कोने को दर्शाता है; 'कोना' ठोस और प्रसंगानुकूल है।
- source_word: בְּיָדִי
  choice: मेरे हाथ में
  rationale: दाऊद के हाथ में मौजूद भौतिक प्रमाण और उसके कर्म/अधिकार से जुड़े मुहावरे, दोनों को सुरक्षित रखता है।
- source_word: כִּי בְּכָרְתִי ... וְלֹא הֲרַגְתִּיךָ
  choice: क्योंकि जब मैंने ... काटा, तब भी आपको मार नहीं डाला
  rationale: कारणात्मक संबंध स्पष्ट करता है और इस बात पर बल देता है कि अवसर होते हुए भी दाऊद ने शाऊल को नहीं मारा।
- source_word: דַּע וּרְאֵה
  choice: जान लीजिए और देखिए
  rationale: इब्रानी के दोनों आदेशों तथा प्रमाण से नैतिक निष्कर्ष पहचानने के आह्वान को बनाए रखता है।
- source_word: אֵין בְּיָדִי רָעָה וָפֶשַׁע
  choice: मेरे हाथ में न कोई बुराई है, न विद्रोह
  rationale: रָעָה को 'बुराई' और פֶשַׁע को राजा के विरुद्ध संभावित विद्रोह के राजनीतिक अर्थ सहित प्रस्तुत करता है; 'हाथ में' की मूल छवि भी बनी रहती है।
- source_word: וְלֹא חָטָאתִי לָךְ
  choice: मैंने आपके विरुद्ध पाप नहीं किया
  rationale: व्यक्ति के विरुद्ध अपराध के साथ मूल की नैतिक-धार्मिक गंभीरता को बनाए रखता है।
- source_word: וְאַתָּה צֹדֶה אֶת נַפְשִׁי לְקַחְתָּהּ
  choice: फिर भी आप मेरे प्राण लेने के लिए मेरा शिकार कर रहे हैं
  rationale: צדה की शिकार करने वाली सजीव छवि को स्वाभाविक हिन्दी में रखता है और आशय स्पष्ट करता है कि शाऊल दाऊद को मारना चाहता है।
theological_decisions:
- issue: פֶשַׁע का नैतिक और राजनीतिक अर्थ
  choice: विद्रोह
  alternative: अपराध / उल्लंघन
  rationale: राजा शाऊल के सामने दाऊद विशेष रूप से राजद्रोही मंशा से इनकार कर रहा है। 'विद्रोह' इस प्रसंगगत राजनीतिक अर्थ को व्यक्त करता है, जबकि पादटिप्पणी व्यापक नैतिक विकल्प को सुरक्षित रखती है।
- issue: נֶפֶשׁ और צדה की शिकार-संबंधी छवि
  choice: मेरे प्राण लेने के लिए मेरा शिकार कर रहे हैं
  alternative: मेरे प्राण की घात में लगे हैं
  rationale: अनुवाद मूल की शिकार वाली उपमा को बनाए रखता है, पर हिन्दी में इसका स्पष्ट अर्थ दाऊद की हत्या का प्रयास है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आदरपूर्ण बहुवचन क्रियारूप अपनाए गए हैं, क्योंकि दाऊद राजा शाऊल को सम्मान से संबोधित करता है। भाषा गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है; मूल की पुनरुक्ति, 'हाथ' की छवि और शिकार की उपमा संरक्षित हैं।
