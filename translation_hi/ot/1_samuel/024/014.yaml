lexical_decisions:
- source_word: כַּאֲשֶׁר יֹאמַר
  choice: जैसा ... कहा जाता है
  rationale: यह पारंपरिक उक्ति को उद्धृत करने का सूत्र है। इब्रानी अपूर्ण क्रिया यहाँ सामान्य, लोकोक्तिपरक अर्थ देती है; हिंदी में कर्मवाच्य प्रयोग स्वाभाविक है।
- source_word: מְשַׁל הַקַּדְמֹנִי
  choice: प्राचीन कहावत
  rationale: מְשַׁל यहाँ संक्षिप्त पारंपरिक नीतिवचन है, और הַקַּדְמֹנִי को पहले समय की या प्राचीन वस्तु के रूप में समझा जा सकता है।
- source_word: מֵרְשָׁעִים יֵצֵא רֶשַׁע
  choice: दुष्टों से दुष्टता ही निकलती है
  rationale: מִן स्रोत बताता है और יֵצֵא का प्रत्यक्ष बिंब ‘निकलना’ है। ‘दुष्टों/दुष्टता’ से मूल का शब्द-संबंध सुरक्षित रहता है; ‘ही’ कहावत के केंद्रित कथन को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: וְיָדִי לֹא תִהְיֶה בָּךְ
  choice: पर मेरा हाथ तेरे विरुद्ध नहीं उठेगा
  rationale: संदर्भ में וְ विरोधसूचक है। ‘हाथ’ का मूल रूपक रखा गया है, जबकि ‘विरुद्ध ... उठेगा’ हिंदी में किसी पर हिंसक कार्रवाई न करने का अर्थ स्पष्ट करता है।
