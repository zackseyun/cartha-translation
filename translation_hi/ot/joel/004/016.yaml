source:
  edition: WLC
  text: וַ/יהוָ֞ה מִ/צִּיּ֣וֹן יִשְׁאָ֗ג וּ/מִ/ירוּשָׁלִַ֨ם֙ יִתֵּ֣ן קוֹל֔/וֹ וְ/רָעֲשׁ֖וּ שָׁמַ֣יִם וָ/אָ֑רֶץ וַֽ/יהוָה֙ מַֽחֲסֶ֣ה לְ/עַמּ֔/וֹ וּ/מָע֖וֹז לִ/בְנֵ֥י יִשְׂרָאֵֽל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/016.yaml
  text: And Yahweh roars from Zion and gives his voice from Jerusalem[a], and the heavens and the earth quake; but Yahweh is a refuge for his people[b], and a stronghold for the sons of Israel.
translation:
  language: hi
  text: 'याहवे सिय्योन से गरजता है,

    और यरूशलेम से अपना स्वर सुनाता है[a]।

    आकाश और पृथ्वी काँप उठते हैं;

    और याहवे अपनी प्रजा के लिए शरणस्थान

    और इस्राएल के पुत्रों के लिए दृढ़ गढ़ है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपनी आवाज़ देता है”; यह ऊँचे या गर्जनापूर्ण स्वर में बोलने की इब्रानी अभिव्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: या, अधिक मुहावरेदार रूप में, “इस्राएल की सन्तान” अथवा “इस्राएल की प्रजा।” इब्रानी में “इस्राएल के पुत्रों के लिए” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: יִשְׁאַג
  choice: गरजता है
  rationale: यह क्रिया विशेष रूप से सिंह की गरज जैसी प्रबल ध्वनि को व्यक्त करती है; ‘गरजता है’ उसकी सजीव और भयावह छवि बनाए रखता है।
- source_word: יִתֵּן קוֹלוֹ
  choice: अपना स्वर सुनाता है
  rationale: इब्रानी का शाब्दिक अर्थ ‘अपनी आवाज़ देता है’ है। हिन्दी में ‘अपना स्वर सुनाता है’ उसी ऊँची, प्रभावशाली वाणी को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְרָעֲשׁוּ
  choice: काँप उठते हैं
  rationale: यह रूप आकाश और पृथ्वी पर परमेश्वर की प्रकट उपस्थिति के आकस्मिक और व्यापक प्रभाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַחֲסֶה
  choice: शरणस्थान
  rationale: यह शब्द संकट से बचाव और आश्रय के स्थान को दर्शाता है; ‘शरणस्थान’ भविष्यद्वाणी और भक्तिपरक प्रसंग दोनों के अनुकूल है।
- source_word: מָעוֹז
  choice: दृढ़ गढ़
  rationale: मूल शब्द सुरक्षा देने वाले सुदृढ़ स्थान या शक्ति-स्रोत को दर्शाता है। ‘दृढ़ गढ़’ ‘शरणस्थान’ के समानान्तर उसकी रक्षात्मक छवि बनाए रखता है।
- source_word: לִבְנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तान
  rationale: בְּנֵי का मूल अर्थ ‘पुत्र’ है, पर राष्ट्रीय-सामूहिक अभिव्यक्ति में यह याकूब/इस्राएल के वंशजों को सूचित करता है। ‘सन्तान’ हिन्दी में उस वंशगत अर्थ और सामूहिक दायरे दोनों को सुरक्षित रखता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा-नाम स्वयं उपस्थित है। ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना निकट आधुनिक लिप्यंतरण में प्रस्तुत करता है।
- issue: וַיהוָה से न्याय और आश्रय के बीच संबंध
  choice: परन्तु याहवे
  alternative: और याहवे
  rationale: וְ सामान्यतः ‘और’ है, किन्तु यहाँ आकाश-पृथ्वी के काँपने और परमेश्वर द्वारा अपनी प्रजा को शरण देने के बीच प्रसंगगत विरोध है। ‘परन्तु’ उस संबंध को स्पष्ट करता है, बिना दोनों पक्षों के तनाव को मिटाए।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक दायरा
  choice: इस्राएल की सन्तान
  alternative: इस्राएल के पुत्र; इस्राएली
  rationale: यह वाक्यांश राष्ट्रीय-वाचागत समुदाय को दर्शाता है। ‘सन्तान’ मूल की वंशगत धारणा को बनाए रखते हुए उसे केवल पुरुष सदस्यों तक सीमित नहीं करता; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। काव्यात्मक समान्तरता के लिए पंक्तियाँ विभाजित हैं। ‘स्वर सुनाता है’, ‘शरणस्थान’ और ‘दृढ़ गढ़’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल की भविष्यद्वाणीपूर्ण गंभीरता और चित्रात्मकता बनाए रखते हैं।
