  yaml_path: translation/ot/joel/004/003.yaml
  text: And they cast lots for my people[a]; they gave a boy for a prostitute, and sold a girl for wine[b], and drank it.
translation:
  language: hi
  text: उन्होंने मेरी प्रजा को बाँटने के लिए चिट्ठियाँ डालीं[a]; उन्होंने एक लड़के को वेश्या के बदले दे दिया[b], और एक लड़की को दाखमधु के बदले बेच दिया और उसे पीया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उन्होंने मेरी प्रजा पर चिट्ठी डाली।” इब्रानी मुहावरा लोगों को लूट के रूप में चिट्ठी डालकर बाँटने का संकेत देता है।
    reason: lexical_alternative
  - marker: b
    text: या, “एक लड़के को वेश्या को दे दिया।” इब्रानी संबंधसूचक शब्द विनिमय का मूल्य या पाने वाले व्यक्ति—दोनों का संकेत दे सकता है; अगले खंड की समानांतर रचना विनिमय के अर्थ का समर्थन करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֶל עַמִּי יַדּוּ גוֹרָל
  choice: उन्होंने मेरी प्रजा को बाँटने के लिए चिट्ठियाँ डालीं
  rationale: ‘चिट्ठियाँ डालना’ גורל डालने का स्वाभाविक हिन्दी मुहावरा है। इस प्रसंग में चिट्ठी डालने का उद्देश्य बंदी बनाई गई प्रजा को लूट के रूप में बाँटना है; इसे स्पष्ट करने से इब्रानी मुहावरे का आशय साधारण पाठक तक पहुँचता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: ‘प्रजा’ सामूहिक और वाचा-संबंधी भाव बनाए रखती है तथा परमेश्वर के अपने लोगों के लिए स्वाभाविक, गरिमापूर्ण हिन्दी है।
- source_word: וַיִּתְּנוּ
  choice: उन्होंने ... दे दिया
  rationale: मूल क्रिया का सीधा अर्थ ‘दिया’ है। लेन-देन का भाव अगले पदबंध ‘के बदले’ से स्पष्ट हो जाता है, इसलिए क्रिया में अनावश्यक रूप से ‘सौदा किया’ नहीं जोड़ा गया।
- source_word: הַיֶּלֶד
  choice: एक लड़के को
  rationale: इब्रानी निश्चित उपपद यहाँ किसी एक पहले से पहचाने गए लड़के के बजाय एक प्रतिनिधि पीड़ित को सामान्य रूप से दर्शाता है। ‘लड़का’ अगले खंड की ‘लड़की’ के समानांतर है।
- source_word: בַּזּוֹנָה
  choice: वेश्या के बदले
  rationale: בְּ को यहाँ विनिमय-मूल्य के अर्थ में समझना प्रसंग और अगले समानांतर खंड ‘दाखमधु के बदले’ के अनुकूल है। यह वाक्य की कठोर और शोषणकारी लेन-देन की छवि बनाए रखता है।
- source_word: וְהַיַּלְדָּה מָכְרוּ
  choice: एक लड़की को ... बेच दिया
  rationale: מכר का सीधा अर्थ ‘बेचना’ है। ‘एक लड़की’ सामान्य प्रतिनिधि अर्थ व्यक्त करता और ‘एक लड़के’ के साथ समानांतरता रखता है।
- source_word: בַיַּיִן
  choice: दाखमधु के बदले
  rationale: יַיִן का अर्थ दाख से बनी मदिरा है और בְּ यहाँ प्राप्त मूल्य दर्शाता है। ‘दाखमधु’ सटीक और गरिमापूर्ण हिन्दी है।
- source_word: וַיִּשְׁתּוּ
  choice: और उसे पी गए
  rationale: कर्म मूल में निहित है और ठीक पहले आए दाखमधु की ओर संकेत करता है। ‘उसे’ जोड़ने से हिन्दी स्वाभाविक रहती है और शोषण के बाद तत्काल उपभोग का तीखा क्रम बना रहता है।
