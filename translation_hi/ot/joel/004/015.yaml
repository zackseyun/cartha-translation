source:
  edition: WLC
  text: שֶׁ֥מֶשׁ וְ/יָרֵ֖חַ קָדָ֑רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/015.yaml
  text: The sun and the moon grow dark[a], and the stars withdraw their brightness.
translation:
  language: hi
  text: सूरज और चाँद अँधेरे हो जाते हैं, और तारे अपनी चमक समेट लेते हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שֶׁמֶשׁ
  choice: सूरज
  rationale: खगोलीय पिंड के लिए आधुनिक मानक हिन्दी का स्वाभाविक और सर्वसुलभ शब्द।
- source_word: וְיָרֵחַ
  choice: और चाँद
  rationale: सूरज के साथ युग्म में יָרֵחַ का सीधा और स्वाभाविक हिन्दी अनुवाद।
- source_word: קָדָרוּ
  choice: अँधेरे हो जाते हैं
  rationale: קדר के अँधेरा या मंद हो जाने के आरंभिक भाव को सक्रिय और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְכוֹכָבִים
  choice: और तारे
  rationale: बहुवचन संज्ञा का सीधा अनुवाद; हिन्दी में निश्चितता के लिए अलग उपपद आवश्यक नहीं है।
- source_word: אָסְפוּ
  choice: समेट लेते हैं
  rationale: אסף के मूल अर्थ ‘इकट्ठा करना/समेटना’ को बनाए रखते हुए चमक को रोक लेने की काव्यात्मक छवि व्यक्त करता है।
- source_word: נָגְהָם
  choice: अपनी चमक
  rationale: נֹגַהּ की दीप्ति या चमक को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है; प्रत्यय का संबंध ‘अपनी’ से स्पष्ट होता है।
theological_decisions:
- issue: भविष्यद्वाणी में ब्रह्मांडीय अंधकार की छवि
  choice: सूरज, चाँद और तारों के अंधकार को बिना व्याख्यात्मक विस्तार के सीधी काव्यात्मक छवि के रूप में रखा गया है।
  alternative: इसे केवल शाब्दिक खगोलीय घटना, केवल प्रतीकात्मक न्याय, अथवा दोनों के मिश्रण के रूप में स्पष्ट करना।
  rationale: इब्रानी पाठ यह निर्धारित नहीं करता कि दृश्य पूर्णतः शाब्दिक है या प्रतीकात्मक; अनुवाद इस अर्थगत और धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज है। ‘अँधेरे हो जाते हैं’ परिवर्तन का भाव रखता है, जबकि ‘अपनी चमक समेट लेते हैं’ मूल क्रिया की काव्यात्मक ठोस छवि को हिन्दी में स्वाभाविक ढंग से सुरक्षित करता है।
