id: JOL.4.19
reference: Joel 4:19
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִצְרַ֨יִם֙ לִ/שְׁמָמָ֣ה תִֽהְיֶ֔ה וֶ/אֱד֕וֹם לְ/מִדְבַּ֥ר שְׁמָמָ֖ה תִּֽהְיֶ֑ה מֵֽ/חֲמַס֙ בְּנֵ֣י יְהוּדָ֔ה אֲשֶׁר שָׁפְכ֥וּ דָם נָקִ֖יא בְּ/אַרְצָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/019.yaml
  text: Egypt will become a desolation[a], and Edom a desolate wilderness, because of the violence done to the sons of Judah[c][b], whose innocent blood they shed in their land.
translation:
  language: hi
  text: 'मिस्र उजाड़ हो जाएगा,

    और एदोम उजड़ा हुआ मरुस्थल हो जाएगा,

    क्योंकि उन्होंने यहूदा के वंशजों[a] पर हिंसा की

    और उनके देश में[b] निर्दोषों का रक्त बहाया।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यहूदा के पुत्रों।” यह पद सामूहिक रूप से यहूदा के लोगों के लिए प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: संदर्भ में “उनके” का संकेत यहूदा के वंशजों की ओर होना सबसे स्वाभाविक है; व्याकरण की दृष्टि से इसे मिस्र और एदोम से जोड़ना भी संभव है।
    reason: referential_ambiguity
lexical_decisions:
- source_word: מִצְרַיִם לִשְׁמָמָה תִהְיֶה
  choice: मिस्र उजाड़ हो जाएगा
  rationale: לְ के साथ היה यहाँ परिणामस्वरूप अवस्था व्यक्त करता है। सहज हिन्दी में संज्ञात्मक ‘उजाड़’ मूल के विनाश और वीरानी के भाव को बनाए रखता है।
- source_word: וֶאֱדוֹם לְמִדְבַּר שְׁמָמָה תִּהְיֶה
  choice: और एदोम उजड़ा हुआ मरुस्थल हो जाएगा
  rationale: מִדְבָּר को ‘मरुस्थल’ और שְׁמָמָה को ‘उजड़ा हुआ’ कहने से दोनों शब्दों का अर्थ स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: מֵחֲמַס
  choice: क्योंकि उन्होंने ... पर हिंसा की
  rationale: यहाँ מִן कारणसूचक है। हिन्दी वाक्य में निहित कर्ता को ‘उन्होंने’ से स्पष्ट किया गया है; संदर्भ में यह मिस्र और एदोम की ओर संकेत करता है।
- source_word: בְּנֵי יְהוּדָה
  choice: यहूदा के वंशजों
  rationale: शाब्दिक अर्थ ‘यहूदा के पुत्र’ है, पर सामूहिक राष्ट्रीय अर्थ के लिए ‘वंशज’ आधुनिक हिन्दी में अधिक स्वाभाविक है और मूल संबंध को भी बनाए रखता है।
- source_word: דָם נָקִיא
  choice: निर्दोषों का रक्त
  rationale: इब्रानी पद का शाब्दिक भाव ‘निर्दोष रक्त’ है। ‘निर्दोषों का रक्त’ हिन्दी में स्वाभाविक रूप से अन्यायपूर्ण रक्तपात का वही अर्थ देता है।
- source_word: בְּאַרְצָם
  choice: उनके देश में
  rationale: तीसरे पुरुष बहुवचन प्रत्यय को सीधे ‘उनके’ से व्यक्त किया गया है। संदर्भ में इसका सबसे संभावित संबंध यहूदा के वंशजों से है।
theological_decisions:
- issue: בְּאַרְצָם में सर्वनाम का पूर्वपद
  choice: मुख्य पाठ में ‘उनके देश में’, जिसे संदर्भतः यहूदा के वंशजों का देश समझा जाता है
  alternative: मिस्र और एदोम का अपना देश; अथवा जानबूझकर खुला सर्वनाम-संदर्भ
  rationale: निकटतम और प्रसंगानुकूल पूर्वपद ‘यहूदा के वंशज’ है, और व्यापक प्रसंग यहूदा के विरुद्ध राष्ट्रों की हिंसा का न्याय करता है। फिर भी इब्रानी सर्वनाम अपने रूप में पूर्वपद का नाम नहीं बताता, इसलिए पादटिप्पणी में दूसरी व्याकरणतः संभव समझ दर्ज की गई है।
- issue: אֲשֶׁר שָׁפְכוּ में बहुवचन कर्ता
  choice: 'मिस्र और एदोम: ‘उन्होंने ... रक्त बहाया’'
  alternative: निकटस्थ ‘यहूदा के वंशज’ को व्याकरणिक कर्ता मानना
  rationale: निकटस्थ पद को कर्ता मानने पर यहूदा के वंशजों को अपने ही निर्दोष रक्त का बहाने वाला बताने वाला असंगत अर्थ निकलता है। न्याय के प्रसंग में निहित बहुवचन कर्ता मिस्र और एदोम हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। काव्यात्मक समानांतरता के लिए पंक्ति-विन्यास रखा गया है। ‘रक्त’ गंभीर भविष्यवाणी-साहित्य के अनुरूप है, जबकि वाक्यरचना आज की स्वाभाविक हिन्दी में है।
