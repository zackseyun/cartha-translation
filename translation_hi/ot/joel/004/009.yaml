review_pass:
  verdict: revise
  source_fidelity: The draft accurately represents the sequence of Hebrew imperatives and jussive summonses, including the cultic force of קַדְּשׁוּ and the directional image in יַעֲלוּ. However, “जाति-जाति में” can naturally evoke caste groups in modern Hindi and is therefore not a reliable rendering of גּוֹיִם (“nations”). The footnote marker is also placed at the end of the verse rather than on the phrase to which its lexical alternative applies.
  naturalness: “राष्ट्रों में यह घोषणा करो” is clear, idiomatic modern Hindi. “युद्ध करने वाले सभी पुरुष” preserves the explicitly masculine military expression while remaining understandable, though it is somewhat more explicit than the compact “युद्धवीर.”
  terminology: “युद्ध को पवित्र ठहराओ” appropriately preserves the marked cultic language without prematurely reducing it to military preparation. “योद्धाओं” suitably renders הַגִּבּוֹרִים in context. The revised footnote retains “युद्ध की तैयारी करो” as an idiomatic alternative and explains the religious/set-apart nuance without asserting a particular theological interpretation.
  issues:
  - severity: medium
    issue: “जाति-जाति में” for בַּגּוֹיִם
    rationale: In current standard Hindi, जाति commonly denotes caste or ethnic community. Here the Hebrew refers to the nations/peoples collectively; “राष्ट्रों में” avoids a misleading caste association.
  - severity: low
    issue: Footnote anchor is detached from its referent
    rationale: The note explains “युद्ध को पवित्र ठहराओ,” so its marker should immediately follow that phrase rather than the closing quotation.
  - severity: low
    issue: “सभी युद्धवीर” does not explicitly preserve אַנְשֵׁי (“men”)
    rationale: The Hebrew military idiom explicitly uses a masculine noun. “युद्ध करने वाले सभी पुरुष” retains this feature more transparently in the main text.
  revised_text: 'राष्ट्रों में यह घोषणा करो: “युद्ध को पवित्र ठहराओ[a]; योद्धाओं को जगाओ। युद्ध करने वाले सभी पुरुष निकट आएँ; वे चढ़ आएँ।”'
