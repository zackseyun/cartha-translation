  text: קִרְאוּ זֹאת֙ בַּ/גּוֹיִ֔ם קַדְּשׁ֖וּ מִלְחָמָ֑ה הָעִ֨ירוּ֙ הַ/גִּבּוֹרִ֔ים יִגְּשׁ֣וּ יַֽעֲל֔וּ כֹּ֖ל אַנְשֵׁ֥י הַ/מִּלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/009.yaml
  text: 'Proclaim this among the nations: Consecrate war; stir up the warriors[a]. Let all the men of war draw near; let them come up.'
translation:
  language: hi
  text: 'राष्ट्रों में यह घोषणा करो: “युद्ध को पवित्र ठहराओ[a]; योद्धाओं को जगाओ। युद्ध करने वाले सभी पुरुष निकट आएँ; वे चढ़ आएँ।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “युद्ध की तैयारी करो।” इब्रानी में शाब्दिक रूप से “युद्ध को पवित्र ठहराओ” है; इसमें युद्ध को अलग ठहराने के लिए धार्मिक शब्दावली का प्रयोग हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְאוּ זֹאת בַּגּוֹיִם
  choice: जाति-जाति में यह घोषणा करो
  rationale: बहुवचन आज्ञार्थक קִרְאוּ सार्वजनिक घोषणा का भाव देता है। בַּגּוֹיִם का अर्थ विदेशी जातियों/राष्ट्रों के बीच है; ‘जाति-जाति में’ स्वाभाविक हिन्दी में उसके सामूहिक और व्यापक भाव को रखता है।
- source_word: קַדְּשׁוּ מִלְחָמָה
  choice: युद्ध को पवित्र ठहराओ
  rationale: קדשׁ युद्ध को केवल तैयार करने के बजाय अलग ठहराने या पवित्र करने की धार्मिक शब्दावली रखता है। यह चयन उस असामान्य और अर्थपूर्ण तनाव को बनाए रखता है।
- source_word: הָעִירוּ הַגִּבּוֹרִים
  choice: योद्धाओं को जगाओ
  rationale: הָעִירוּ causative आज्ञा है, जिसका अर्थ जगाना या सक्रिय करना है; सैन्य संदर्भ में הַגִּבּוֹרִים के लिए ‘योद्धाओं’ स्पष्ट और स्वाभाविक है।
- source_word: יִגְּשׁוּ
  choice: निकट आएँ
  rationale: यह आह्वानात्मक रूप युद्ध के लिए पास आने या एकत्र होने का औपचारिक भाव रखता है।
- source_word: יַעֲלוּ
  choice: वे चढ़ आएँ
  rationale: עלה की ऊपर आने की दिशात्मक छवि को सुरक्षित रखा गया है; इसे केवल ‘आगे बढ़ें’ कहकर व्याख्यात्मक रूप से समतल नहीं किया गया।
- source_word: כֹּל אַנְשֵׁי הַמִּלְחָמָה
  choice: सभी युद्धवीर
  rationale: यह पुरुष युद्धकर्ताओं के लिए इब्रानी सैन्य अभिव्यक्ति है। ‘युद्धवीर’ हिन्दी में संक्षिप्त, गरिमापूर्ण और स्पष्ट है।
theological_decisions:
- issue: युद्ध के आह्वान में קדשׁ के धार्मिक अर्थ को बनाए रखना
  choice: युद्ध को पवित्र ठहराओ
  alternative: युद्ध की तैयारी करो
  rationale: संदर्भ में वाक्यांश युद्ध की तैयारी या सैन्य जुटान का मुहावरा हो सकता है, पर קדשׁ में किसी वस्तु को पवित्र प्रयोजन के लिए अलग ठहराने का धार्मिक भाव भी है। मुख्य पाठ उस भाव को सुरक्षित रखता है और पादटिप्पणी अधिक मुहावरेदार अर्थ देती है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। सैन्य आह्वान की संक्षिप्त, क्रमिक लय तथा मूल के धार्मिक-सैन्य तनाव को सुरक्षित रखा गया है।
