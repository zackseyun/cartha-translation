  text: וְ/נִקֵּ֖יתִי דָּמָ֣/ם לֹֽא נִקֵּ֑יתִי וַֽ/יהוָ֖ה שֹׁכֵ֥ן בְּ/צִיּֽוֹן־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/021.yaml
  text: I will avenge their blood that I have not avenged[a], and Yahweh dwells in Zion.
translation:
  language: hi
  text: और मैं उनके रक्त का बदला लूँगा, जिसका मैंने अब तक बदला नहीं लिया है[a]; और याहवे सिय्योन में निवास करता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं उनके रक्तपात को दण्ड दिए बिना नहीं छोड़ूँगा।” इब्रानी में एक ही क्रिया निषेध के साथ दोहराई गई है; इसलिए इसका अर्थ रक्त का बदला लेना या रक्तपात को दण्ड दिए बिना न छोड़ना हो सकता है।
    reason: वैकल्पिक पाठ और मूल इब्रानी की अर्थगत अस्पष्टता को सुरक्षित रखना।
lexical_decisions:
- source_word: וְנִקֵּיתִי
  choice: और मैं…बदला लूँगा
  rationale: नקה का पिएल रूप यहाँ रक्तपात और राष्ट्रों पर न्याय के प्रसंग में न्यायिक प्रतिशोध या निर्दोषों के पक्ष में न्याय करने का भाव देता है। शाब्दिक ‘निर्दोष ठहराऊँगा/शुद्ध करूँगा’ इस संदर्भ में कम स्वाभाविक है।
- source_word: דָּמָם
  choice: उनके बहाए गए रक्त
  rationale: मूल अर्थ ‘उनका रक्त’ है; ‘बहाए गए’ जोड़ने से हिन्दी में रक्तपात और उसके लिए अपेक्षित न्याय का आशय स्पष्ट होता है, जबकि पीड़ितों के रक्त की ठोस छवि बनी रहती है।
- source_word: לֹא נִקֵּיתִי
  choice: जिसका बदला मैंने अब तक नहीं लिया
  rationale: उसी क्रिया की निषेध सहित पुनरावृत्ति अत्यंत संक्षिप्त और बहुअर्थी है। यह अनुवाद अब होने वाले प्रतिशोध और पहले न हुए प्रतिशोध के बीच तनाव को बनाए रखता है; ‘अब तक’ हिन्दी में निहित कालगत विरोध स्पष्ट करता है।
- source_word: וַיהוָה
  choice: और याहवे
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को नाम के रूप में पारदर्शी ढंग से ‘याहवे’ लिखा गया है और आरम्भिक संयोजक भी सुरक्षित रखा गया है।
- source_word: שֹׁכֵן
  choice: निवास करता है
  rationale: कर्तृवाचक कृदन्त निरन्तर या स्थायी निवास का भाव देता है; ‘निवास करता है’ आधुनिक, गरिमापूर्ण हिन्दी है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: בְ का स्थानवाचक अर्थ ‘में’ है और צִיּוֹן का प्रचलित हिन्दी बाइबलीय रूप ‘सिय्योन’ रखा गया है।
theological_decisions:
- issue: नקה का ‘रक्त’ के साथ अर्थ
  choice: याहवे पीड़ितों के बहाए गए रक्त का बदला लेकर न्याय करेगा।
  alternative: याहवे रक्त-दोष को शुद्ध करेगा या किसी को निर्दोष ठहराएगा।
  rationale: आस-पास का प्रसंग शत्रु राष्ट्रों के न्याय और यहूदा तथा यरूशलेम के पक्ष में न्याय का है। इसलिए न्यायिक प्रतिशोध का भाव सबसे संगत है, पर क्रिया की व्यापक अर्थ-सीमा को टिप्पणी में स्वीकार किया गया है।
- issue: לֹא נִקֵּיתִי की वाक्यगत भूमिका
  choice: पहले न लिए गए बदले को अब लेने की प्रतिज्ञा
  alternative: ‘मैं उनके रक्तपात को दण्ड दिए बिना नहीं छोड़ूँगा’—निषेध के द्वारा दृढ़ न्याय-घोषणा
  rationale: इब्रानी पुनरावृत्ति संक्षिप्त और अस्पष्ट है। मुख्य पाठ कालगत विरोध को व्यक्त करता है, जबकि पादटिप्पणी मान्य दण्डात्मक मुहावरे को सुरक्षित रखती है।
- issue: अन्तिम कथन में ईश्वरीय उपस्थिति
  choice: ‘याहवे सिय्योन में निवास करता है’ को वर्तमान, निरन्तर तथ्य के रूप में रखना
  alternative: ‘याहवे सिय्योन में निवास करेगा’ के रूप में भविष्यसूचक बनाना
  rationale: שֹׁכֵן कृदन्त है और स्वाभाविक रूप से निरन्तर निवास व्यक्त करता है; भविष्यकाल जोड़ना मूल की अस्पष्टता से आगे जाना होगा।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज शैली रखी गई है। ‘बहाए गए रक्त’ न्याय की ठोस पृष्ठभूमि स्पष्ट करता है; ‘अब तक’ मुख्य पाठ में निहित कालगत विरोध को स्वाभाविक हिन्दी में व्यक्त करता है। अर्धविराम दो समन्वित किन्तु अर्थतः अलग घोषणाओं को जोड़ता है।
