  text: וְ֠/גַם מָה אַתֶּ֥ם לִ/י֙ צֹ֣ר וְ/צִיד֔וֹן וְ/כֹ֖ל גְּלִיל֣וֹת פְּלָ֑שֶׁת הַ/גְּמ֗וּל אַתֶּם֙ מְשַׁלְּמִ֣ים עָלָ֔/י וְ/אִם גֹּמְלִ֤ים אַתֶּם֙ עָלַ֔/י קַ֣ל מְהֵרָ֔ה אָשִׁ֥יב גְּמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/004.yaml
  text: And also[a], what are you to me, Tyre and Sidon, and all the regions of Philistia? Are you repaying me with recompense? If you are dealing out repayment against me[b], swiftly and quickly I will return your repayment on your own head.
translation:
  language: hi
  text: और तुम भी, हे सोर और सीदोन, और पलिश्त के सभी प्रदेशों—मुझसे तुम्हारा क्या लेना-देना है?[a] क्या तुम मुझ पर प्रतिकार कर रहे हो? और यदि तुम मेरे विरुद्ध प्रतिकार कर रहे हो, तो बहुत जल्दी, तुरंत मैं तुम्हारा प्रतिकार तुम्हारे ही सिर पर लौटा दूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप के अधिक निकट: “तुम मेरे लिए क्या हो?” यह इब्रानी मुहावरा विरोधपूर्ण चुनौती व्यक्त करता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְגַם מָה אַתֶּם לִי
  choice: और तुम भी…मुझसे तुम्हारा क्या लेना-देना है?
  rationale: וְגַם को ‘और…भी’ से व्यक्त किया गया है। प्रश्नवाचक इब्रानी मुहावरा विरोधपूर्ण चुनौती है; आधुनिक हिन्दी में ‘मुझसे तुम्हारा क्या लेना-देना है?’ उसका स्वाभाविक और सशक्त रूप है।
- source_word: צֹר וְצִידוֹן
  choice: सोर और सीदोन
  rationale: स्थान-नामों के प्रचलित हिन्दी बाइबलीय लिप्यंतरण रखे गए हैं।
- source_word: וְכֹל גְּלִילוֹת פְּלָשֶׁת
  choice: और पलिश्त के सभी प्रदेशो
  rationale: גְּלִילוֹת का अर्थ प्रदेश, ज़िले या भूभाग है; संबोधन के कारण ‘प्रदेशो’ रूप रखा गया है, और פְּלָשֶׁת को भू-नाम ‘पलिश्त’ के रूप में लिया गया है।
- source_word: הַגְּמוּל אַתֶּם מְשַׁלְּמִים עָלָי
  choice: क्या तुम मुझे बदला चुका रहे हो?
  rationale: שלם और גמול की प्रतिदान/प्रतिकार संबंधी भाषा को ‘बदला चुकाना’ से व्यक्त किया गया है। यह प्रश्न की न्यायिक और प्रतिशोधात्मक धार बनाए रखता है।
- source_word: וְאִם גֹּמְלִים אַתֶּם עָלַי
  choice: यदि तुम मेरे विरुद्ध बदला चुका रहे हो
  rationale: עָלַי के विरोधात्मक बल को ‘मेरे विरुद्ध’ से स्पष्ट किया गया है और גמל/גמול की पुनरावृत्ति को ‘बदला’ द्वारा बनाए रखा गया है।
- source_word: קַל מְהֵרָה
  choice: फुर्ती से, बहुत शीघ्र
  rationale: दोनों तीव्रतासूचक पदों को अलग-अलग व्यक्त किया गया है, ताकि मूल की जोरदार तात्कालिकता न घटे।
- source_word: אָשִׁיב גְּמֻלְכֶם בְּרֹאשְׁכֶם
  choice: तुम्हारा बदला तुम्हारे ही सिर पर लौटा दूँगा
  rationale: שוב की लौटाने की छवि, גְּמֻלְכֶם का प्रतिकारार्थक भाव, और ‘सिर पर’ परिणाम लौटने का इब्रानी मुहावरा—तीनों सुरक्षित रखे गए हैं। ‘ही’ आत्म-प्रत्यावर्तन का बल स्वाभाविक हिन्दी में देता है।
theological_decisions:
- issue: ईश्वरीय प्रत्युत्तर का स्वरूप
  choice: सीधे न्यायिक प्रतिदान और धमकी की भाषा रखी गई है।
  alternative: इसे केवल कर्मों के सामान्य या स्वतः होने वाले परिणाम के रूप में कहना।
  rationale: גמל/גמול की पुनरावृत्ति और ‘तुम्हारे ही सिर पर’ का मुहावरा वक्ता द्वारा सीधे बदला लौटाने को व्यक्त करते हैं; इसे निर्जीव कर्मफल में नरम करना मूल के धर्मवैचारिक तनाव को मिटा देता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और मौखिक पाठ के अनुकूल रखी गई है। ‘हे’ संबोधन की गंभीरता बनाए रखता है, जबकि ‘क्या लेना-देना’ प्राचीन मुहावरे का आज समझ में आने वाला हिन्दी रूप है। ‘बदला चुकाना/लौटाना’ की पुनरावृत्ति मूल के शब्द-संबंध और न्यायिक चेतावनी दोनों को सुरक्षित रखती है।
