  edition: WLC
  text: ע֣וּשׁוּ וָ/בֹ֧אוּ כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה הַֽנְחַ֥ת יְהוָ֖ה גִּבּוֹרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/011.yaml
  text: Hasten and come[a], all you nations from every side, and gather yourselves there. Bring down your mighty ones[b], O Yahweh.
translation:
  language: hi
  text: जल्दी करो और आओ[a], हे सब राष्ट्रों, चारों ओर से; वहाँ इकट्ठे हो जाओ। हे याहवे, अपने पराक्रमियों को नीचे ले आ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘शीघ्रता करो और आओ ... और वहाँ इकट्ठे हो जाओ।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘हे याहवे, अपने योद्धाओं को नीचे भेज।’ ‘अपने पराक्रमियों’ से याहवे के शक्तिशाली प्रतिनिधि अभिप्रेत हो सकते हैं; मूल पाठ यह स्पष्ट नहीं करता कि वे मनुष्य हैं या स्वर्गीय प्राणी।
    reason: alternative_reading
lexical_decisions:
- source_word: ע֣וּשׁוּ
  choice: जल्दी करो
  rationale: यह दुर्लभ आज्ञार्थक रूप प्रसंग में शीघ्र आने का आह्वान करता है। ‘जल्दी करो’ आधुनिक हिन्दी में स्वाभाविक है और तात्कालिकता बनाए रखता है।
- source_word: וָ/בֹ֧אוּ
  choice: और आओ
  rationale: בוא के स्पष्ट आज्ञार्थक अर्थ और वाक्य की क्रमिक लय—जल्दी करो, फिर आओ—को सुरक्षित रखता है।
- source_word: כָֽל הַ/גּוֹיִ֛ם מִ/סָּבִ֖יב
  choice: हे चारों ओर के सब राष्ट्रो
  rationale: आज्ञार्थक प्रसंग में राष्ट्रों को सीधे संबोधित किया गया है। ‘चारों ओर के’ उनके सभी दिशाओं से आने का भाव व्यक्त करता है।
- source_word: וְ/נִקְבָּ֑צוּ שָׁ֕מָּ/ה
  choice: वहाँ इकट्ठे हो जाओ
  rationale: निफ़अल रूप के एकत्र होने के भाव को स्वाभाविक हिन्दी में आत्मवाचक आज्ञा के रूप में व्यक्त करता है।
- source_word: הַֽנְחַ֥ת
  choice: नीचे उतार ला
  rationale: हिफ़ईल आज्ञार्थक में किसी को नीचे लाने का कारणवाचक और दिशात्मक भाव है; यह अनुवाद उस गति को स्पष्ट रखता है।
- source_word: יְהוָ֖ה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: גִּבּוֹרֶֽי/ךָ
  choice: अपने पराक्रमियों
  rationale: גבור शक्तिशाली या वीर व्यक्तियों/प्रतिनिधियों को सूचित कर सकता है। ‘पराक्रमी’ उनके मानव अथवा स्वर्गीय होने का निर्णय किए बिना व्यापक अर्थ बनाए रखता है।
theological_decisions:
- issue: ‘तेरे पराक्रमियों’ की पहचान
  choice: अपने पराक्रमियों
  alternative: अपने योद्धाओं; अपने वीरों; अपने स्वर्गदूत-सेनाओं
  rationale: मूल शब्द शक्तिशाली प्रतिनिधियों को दर्शाता है, पर यह स्पष्ट नहीं करता कि वे मनुष्य हैं या स्वर्गीय प्राणी। व्यापक पदावली इस अनिश्चितता को सुरक्षित रखती है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसका लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: הַנְחַת का कर्ता और दिशा
  choice: याहवे से उसके पराक्रमियों को नीचे लाने की विनती
  alternative: हे याहवे, अपने योद्धाओं को भेज
  rationale: हिफ़ईल रूप नीचे उतारने का भाव देता है। ‘नीचे उतार ला’ इस स्थानिक संकेत को बनाए रखता है, जबकि ‘भेज’ उसे अस्पष्ट कर देता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। राष्ट्रों के लिए प्रत्यक्ष संबोधन तथा याहवे के लिए एकवचन आज्ञार्थक ‘उतार ला’ मूल की तीखी प्रार्थनात्मक शैली को बनाए रखते हैं। ‘पराक्रमी’ जानबूझकर व्यापक है, ताकि मूल की वास्तविक पहचान-संबंधी अस्पष्टता बनी रहे।
