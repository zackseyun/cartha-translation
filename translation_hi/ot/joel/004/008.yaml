source:
  edition: WLC
  text: וּ/מָכַרְתִּ֞י אֶת בְּנֵי/כֶ֣ם וְ/אֶת בְּנֽוֹתֵי/כֶ֗ם בְּ/יַד֙ בְּנֵ֣י יְהוּדָ֔ה וּ/מְכָר֥וּ/ם לִ/שְׁבָאיִ֖ם אֶל גּ֣וֹי רָח֑וֹק כִּ֥י יְהוָ֖ה דִּבֵּֽר־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/008.yaml
  text: And I will sell your sons and your daughters into the hand of the sons of Judah[a], and they will sell them to the Sabeans, to a distant nation[b]; for Yahweh has spoken.
translation:
  language: hi
  text: और मैं तुम्हारे बेटों और तुम्हारी बेटियों को यहूदा के लोगों के हाथ में बेच दूँगा, और वे उन्हें शबा के लोगों को, एक दूरस्थ राष्ट्र के लोगों को, बेच देंगे; क्योंकि याहवे ने बोला है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּמָכַרְתִּי
  choice: और मैं ... बेच दूँगा
  rationale: काल में מכר का सामान्य अर्थ ‘बेचना’ है। न्याय के प्रत्युत्तर और उलटाव की व्यापारिक छवि को नरम किए बिना बनाए रखा गया है।
- source_word: בְּנֵיכֶם ... בְּנוֹתֵיכֶם
  choice: तुम्हारे बेटों और तुम्हारी बेटियों
  rationale: इब्रानी पाठ पुत्रों और पुत्रियों का स्पष्ट अलग-अलग उल्लेख करता है; हिन्दी में भी यह भेद सुरक्षित रखा गया है।
- source_word: בְּיַד בְּנֵי יְהוּדָה
  choice: यहूदा के लोगों के हाथ में
  rationale: ‘हाथ में’ नियंत्रण में सौंपे जाने की इब्रानी छवि को बनाए रखता है। בני יהודה का शाब्दिक अर्थ ‘यहूदा के पुत्र’ है, पर आधुनिक हिन्दी में ‘यहूदा के लोग’ यहाँ अधिक स्वाभाविक और सामुदायिक अर्थ में स्पष्ट है।
- source_word: וּמְכָרוּם
  choice: और वे उन्हें ... बेच देंगे
  rationale: पहले आए उसी मूल क्रिया מכר के लिए ‘बेचना’ दोहराया गया है; कर्म-प्रत्यय का संकेत पहले उल्लिखित बेटों और बेटियों की ओर है।
- source_word: לִשְׁבָאִים
  choice: शबा के लोगों के हाथ
  rationale: यह रूप शबा के निवासियों को सूचित करता है। ‘शबा के लोग’ आधुनिक हिन्दी पाठक के लिए ‘शबाई’ जैसे दुर्लभ जातिनाम से अधिक स्पष्ट है। हिन्दी में ‘के हाथ बेच देंगे’ स्वाभाविक रूप से खरीदार को व्यक्त करता है।
- source_word: אֶל גּוֹי רָחוֹק
  choice: एक दूर देश में
  rationale: גוי का अर्थ ‘जाति/राष्ट्र’ हो सकता है, पर शबा के लोगों के दूरस्थ भूभाग में पहुँचाए जाने के प्रसंग में ‘दूर देश में’ सहज हिन्दी है और दूरी का भाव सुरक्षित रखता है।
- source_word: כִּי יְהוָה דִּבֵּר
  choice: क्योंकि यहोवा ने कहा है
  rationale: यह उपवाक्य न्याय की निश्चितता को परमेश्वर की घोषणा पर आधारित करता है। דִּבֵּר के पूर्ण पक्ष को हिन्दी पूर्ण काल ‘कहा है’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरीय निजी नाम सीधे आया है। हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाने जाने वाले ‘यहोवा’ को नाम के रूप में रखा गया है, न कि उसे ‘प्रभु’ पदवी से बदला गया है।
- issue: दैवी न्याय में ‘बेचने’ की भाषा
  choice: शाब्दिक न्यायिक-व्यापारिक छवि बनाए रखना
  alternative: ‘सौंप देना’ जैसे नरम रूप में अनुवाद करना
  rationale: पद का प्रत्युत्तरात्मक न्याय उसी क्रिया ‘बेचना’ पर निर्भर है; इसलिए नैतिक तनाव को समझाकर या नरम करके समाप्त नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज गद्य। ‘यहूदा के पुत्रों’ के स्थान पर सामुदायिक अर्थ स्पष्ट करने के लिए ‘यहूदा के लोग’ और दुर्लभ ‘शबाई’ के स्थान पर ‘शबा के लोग’ रखा गया है। वाक्य में डैश दूर देश की व्याख्यात्मक परिणति को स्पष्ट करता है।
