base_translation:
  language: en
  yaml_path: translation/ot/joel/004/006.yaml
  text: And the sons of Judah and the sons of Jerusalem you sold to the sons of the Greeks[b][a], in order to remove them far from their border.
translation:
  language: hi
  text: और यहूदा के लोगों और यरूशलेम के लोगों को तुमने यूनानियों[a] को बेच दिया, ताकि उन्हें उनकी सीमा[b] से बहुत दूर कर सको।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘यूनानियों के पुत्रों को’; इसे अधिक मुहावरेदारी से ‘यूनानियों को’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उनके प्रदेश से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְנֵי יְהוּדָה וּבְנֵי יְרוּשָׁלִַם
  choice: और यहूदा के लोगों और यरूशलेम के लोगों को
  rationale: בני का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह किसी स्थान से संबंधित लोगों को सूचित करने वाला सामुदायिक मुहावरा है। आधुनिक हिन्दी में ‘के लोगों’ स्वाभाविक और स्पष्ट है।
- source_word: מְכַרְתֶּם
  choice: तुमने ... बेच दिया
  rationale: यह מכר का काल रूप, द्वितीय पुरुष बहुवचन है। भविष्यद्वाणी के आरोप में हिन्दी का सामान्य भूतकाल उपयुक्त है।
- source_word: לִבְנֵי הַיְּוָנִים
  choice: यूनानियों के हाथ
  rationale: יונים यूनानियों अथवा आयोनियों को सूचित कर सकता है। हिन्दी में ‘यूनानी’ सर्वाधिक स्पष्ट है; ‘के हाथ बेच दिया’ बिक्री के प्राप्तकर्ता को स्वाभाविक ढंग से व्यक्त करता है। शाब्दिक पारिवारिक अभिव्यक्ति पाद-टिप्पणी में रखी गई है।
- source_word: לְמַעַן הַרְחִיקָם
  choice: ताकि उन्हें ... बहुत दूर कर दो
  rationale: למען उद्देश्य बताता है और רחק का हिफ़ील रूप किसी को दूर करने का कारणात्मक भाव रखता है। यह अनुवाद साधन को अनावश्यक रूप से निर्धारित किए बिना उस भाव को बनाए रखता है।
- source_word: מֵעַל גְּבוּלָם
  choice: उनकी अपनी सीमा से
  rationale: גבול का अर्थ ‘सीमा’, ‘सरहद’ या विस्तार से ‘प्रदेश’ हो सकता है। ‘सीमा’ मूल के ठोस स्थानिक भाव को बनाए रखता है; ‘अपनी’ हिन्दी में सर्वनाम-संदर्भ को स्पष्ट करता है।
