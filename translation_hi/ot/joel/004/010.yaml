base_translation:
  language: en
  yaml_path: translation/ot/joel/004/010.yaml
  text: Beat your plowshares into swords[a], and your pruning hooks into spears; let the weak say[b], “I am a warrior.”
translation:
  language: hi
  text: अपने हल के फालों को पीटकर तलवारें बना लो[a], और अपनी छँटाई की हँसियों को भाले बना लो; जो निर्बल है, वह कहे[b], “मैं योद्धा हूँ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यह यशायाह 2:4 और मीका 4:3 की छवि को उलट देता है, जहाँ हथियारों को पीटकर खेती के औजार बनाए जाते हैं।
    reason: cross_reference
  - marker: b
    text: या “मैं बलवान हूँ,” अथवा “मैं पराक्रमी हूँ।” इब्रानी शब्द גִּבּוֹר किसी बलवान, पराक्रमी व्यक्ति या योद्धा को दर्शा सकता है; यहाँ युद्ध का संदर्भ “योद्धा” अर्थ के पक्ष में है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֹּתּוּ
  choice: पीटकर ... बना लो
  rationale: बहुवचन आज्ञार्थक क्रिया का मूल भाव पीटने या कूटने का है; यह धातु से कृषि-औजारों को हथियारों में बदलने का ठोस चित्र बनाए रखता है।
- source_word: אִתֵּיכֶם
  choice: अपने हलों की फालों
  rationale: यह जुताई में काम आने वाले औजारों को दर्शाता है। ‘हल की फाल’ आधुनिक हिन्दी में स्पष्ट है और यशायाह 2:4 तथा मीका 4:3 की उलटी छवि को पहचानने योग्य रखता है।
- source_word: לַחֲרָבוֹת
  choice: तलवारें बना लो
  rationale: ל यहाँ परिणति का बोध कराता है; हिन्दी में ‘पीटकर तलवारें बना लो’ रूपांतरण को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וּמַזְמְרֹתֵיכֶם
  choice: अपनी छँटाई की हँसियों
  rationale: संज्ञा दाखलताओं या अन्य पौधों की छँटाई के औजारों को दर्शाती है; ‘छँटाई की हँसियाँ’ सामान्य पाठक के लिए अर्थ स्पष्ट रखती है।
- source_word: לִרְמָחִים
  choice: भाले
  rationale: רמח भाले या बरछे को दर्शाता है; ‘भाले’ आधुनिक हिन्दी में सर्वाधिक सहज और व्यापक शब्द है।
- source_word: הַחַלָּשׁ
  choice: जो निर्बल है
  rationale: विशेषण यहाँ संज्ञा के रूप में प्रतिनिधिक एकवचन है। यह रूप हिन्दी में स्वाभाविक रहते हुए मूल के सामान्य कथन को बनाए रखता है।
- source_word: יֹאמַר
  choice: वह कहे
  rationale: अपूर्ण क्रिया का यहाँ आदेशात्मक/कामनार्थक बल है; ‘वह कहे’ उस आग्रह को बिना उसे निश्चित भविष्य में बदले सुरक्षित रखता है।
- source_word: גִּבּוֹר
  choice: योद्धा
  rationale: यह शब्द बलवान या पराक्रमी व्यक्ति के साथ युद्धवीर को भी दर्शा सकता है। शस्त्रीकरण के संदर्भ में ‘योद्धा’ मुख्य पाठ के लिए सबसे उपयुक्त है, जबकि व्यापक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: אָנִי
  choice: मैं ... हूँ
  rationale: स्पष्ट सर्वनाम आत्म-घोषणा पर बल देता है; हिन्दी में ‘मैं योद्धा हूँ’ उस जोर को स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शांति-वाणी की छवि का उलटा प्रयोग
  choice: कृषि-औजारों को हथियारों में बदलने की स्पष्ट शब्दावली रखी गई है।
  alternative: ऐसी सामान्य शब्दावली अपनाना जिससे यशायाह 2:4 और मीका 4:3 का उलटा संकेत पहचान में न आए।
  rationale: इब्रानी पाठ प्रसिद्ध शांति-छवि को जानबूझकर उलटता है। ‘हल की फालों’, ‘तलवारें’, ‘छँटाई की हँसियों’ और ‘भाले’ को बनाए रखने से न्याय के लिए हथियार उठाने का तनाव बिना अतिरिक्त सांप्रदायिक व्याख्या के सामने आता है।
- issue: גִּבּוֹר का युद्ध-संबंधी अथवा सामान्य बल-संबंधी अर्थ
  choice: मुख्य पाठ में ‘योद्धा’।
  alternative: ‘बलवान’ या ‘पराक्रमी’।
  rationale: निकट संदर्भ तलवारों और भालों की तैयारी का है, इसलिए युद्ध-संबंधी अर्थ प्रमुख है; फिर भी शब्द की वास्तविक व्यापकता पादटिप्पणी में दी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, प्रत्यक्ष और सामान्य पाठक के लिए सुबोध रूप। ‘छँटाई की हँसियाँ’ कृषि-औजार की पहचान स्पष्ट करता है; आज्ञा और कामनार्थक कथन के बीच इब्रानी व्याकरणिक अंतर को ‘बना लो’ और ‘वह कहे’ से रखा गया है।
