  text: וִֽ/ידַעְתֶּ֗ם כִּ֣י אֲנִ֤י יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם שֹׁכֵ֖ן בְּ/צִיּ֣וֹן הַר קָדְשִׁ֑/י וְ/הָיְתָ֤ה יְרוּשָׁלִַ֨ם֙ קֹ֔דֶשׁ וְ/זָרִ֥ים לֹא יַֽעַבְרוּ בָ֖/הּ עֽוֹד־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/017.yaml
  text: Then you will know that I am Yahweh your God[a], dwelling in Zion, my holy mountain. And Jerusalem will be holy, and strangers will pass through her no more.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं याहवे, तुम्हारा परमेश्वर हूँ; मैं सिय्योन में, अपने पवित्र पर्वत में, निवास करता हूँ। यरूशलेम पवित्र होगा, और अजनबी लोग[a] फिर कभी उसमें से होकर नहीं जाएँगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘विदेशी लोग।’ इब्रानी शब्द זָרִים का अर्थ बाहरी या अजनबी लोग है। इस संदर्भ में सम्भवतः आशय उन लोगों से है जिनका उस पवित्र नगर में स्थान नहीं है, न कि हर अर्थ में प्रत्येक गैर-इस्राएली व्यक्ति से।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: भविष्यद्वाणी के संदर्भ में वाव सहित यह रूप परिणाम या क्रम का भाव दे सकता है। ‘तब’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि ‘जानोगे’ पहचान और अनुभव दोनों की सम्भावना बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: שֹׁכֵן בְּצִיּוֹן הַר קָדְשִׁי
  choice: जो अपने पवित्र पर्वत सिय्योन में वास करता हूँ
  rationale: इब्रानी कृदन्त के निरन्तर वास के भाव को ‘वास करता हूँ’ से व्यक्त किया गया है। हिन्दी में वक्ता के प्रथम पुरुष से सामंजस्य रखने के लिए ‘करता हूँ’ स्वाभाविक है; पदबंध सिय्योन को पवित्र पर्वत के रूप में प्रस्तुत करता है।
- source_word: וְהָיְתָה יְרוּשָׁלִַם קֹדֶשׁ
  choice: यरूशलेम पवित्र होगा
  rationale: यह वाक्य यरूशलेम के विषय में पवित्रता का विधान करता है; ‘हो जाएगा’ जैसा प्रक्रियात्मक अर्थ मूल में स्पष्ट नहीं है।
- source_word: וְזָרִים
  choice: और पराये लोग
  rationale: זָרִים उन बाहरी या अनधिकृत लोगों को सूचित कर सकता है जो उस पवित्र स्थान से सम्बद्ध नहीं हैं। ‘पराये लोग’ इस व्यापक अर्थ को रखता है और इसे केवल जातीय विदेशियों तक सीमित नहीं करता।
- source_word: לֹא יַעַבְרוּ בָהּ עוֹד
  choice: फिर कभी उसमें से होकर नहीं जाएँगे
  rationale: עבר ב की आर-पार जाने की गति तथा עוֹד के ‘फिर कभी नहीं’ वाले भाव को स्पष्ट और सहज हिन्दी में सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसका लिप्यंतरण करके नाम और उपाधि का भेद बनाए रखता है।
- issue: पवित्र यरूशलेम के संदर्भ में זָרִים का आशय
  choice: पराये लोग
  alternative: विदेशी लोग
  rationale: संदर्भ अपवित्र करने वाले बाहरी लोगों के प्रवेश या आवागमन से मुक्ति पर बल देता है। ‘पराये लोग’ मूल की अस्पष्टता बनाए रखता है और कथन को प्रत्येक गैर-इस्राएली व्यक्ति के बारे में सार्वभौमिक जातीय निषेध नहीं बनाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठक के लिए सुबोध शैली रखी गई है। ‘वास करता हूँ’ धार्मिक साहित्य में परिचित है, पर अत्यधिक संस्कृतनिष्ठ नहीं। स्थान-नामों के लिए प्रचलित हिन्दी बाइबलीय रूप ‘सिय्योन’ और ‘यरूशलेम’ प्रयुक्त हुए हैं।
