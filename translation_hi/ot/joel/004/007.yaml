source:
  edition: WLC
  text: הִנְ/נִ֣י מְעִירָ֔/ם מִן הַ֨/מָּק֔וֹם אֲשֶׁר מְכַרְתֶּ֥ם אֹתָ֖/ם שָׁ֑מָּ/ה וַ/הֲשִׁבֹתִ֥י גְמֻלְ/כֶ֖ם בְּ/רֹאשְׁ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/007.yaml
  text: Look[a], I am stirring them up from the place where you sold them[b], and I will return your recompense on your own head.
translation:
  language: hi
  text: देखो, मैं उन्हें उस स्थान से उठा रहा हूँ[a] जहाँ तुमने उन्हें बेचा था; और मैं तुम्हारे प्रतिफल को तुम्हारे ही सिर पर लौटा दूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उन्हें जगा रहा हूँ’ अथवा ‘उन्हें उभार रहा हूँ।’ इब्रानी क्रिया का अर्थ जगाना, उठाना या उभारना हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात, ‘मैं तुम्हें तुम्हारे किए का फल दूँगा।’ शाब्दिक रूप से, ‘मैं तुम्हारे प्रतिफल को तुम्हारे सिर पर लौटा दूँगा।’
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: यह पद एक गंभीर ईश्वरीय घोषणा की ओर ध्यान खींचता है। ‘देखो’ आधुनिक हिन्दी में इसके संकेतात्मक और ध्यानाकर्षक बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מְעִירָם
  choice: उन्हें ... उठा रहा हूँ
  rationale: עור के हिफ़ील रूप में जगाने, उठाने या सक्रिय करने का भाव है। ‘उठा रहा हूँ’ निर्वासित लोगों को वहाँ से निकलने और लौटने के लिए सक्रिय किए जाने का भाव रखता है, पर इसे केवल नींद से जागने या सैनिक रूप से उकसाने तक सीमित नहीं करता।
- source_word: מִן הַמָּקוֹם
  choice: उस स्थान से
  rationale: स्थान से बाहर लाए जाने का सीधा अर्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: אֲשֶׁר מְכַרְתֶּם אֹתָם שָׁמָּה
  choice: जहाँ तुमने उन्हें बेच दिया था
  rationale: शाब्दिक दिशा-सूचक भाव ‘जिस स्थान को/जहाँ’ हिन्दी में ‘जहाँ’ से स्वाभाविक रूप से व्यक्त होता है; ‘बेच दिया था’ पूर्व में संपन्न कार्य को स्पष्ट करता है।
- source_word: וַהֲשִׁבֹתִי
  choice: लौटा दूँगा
  rationale: שוב के हिफ़ील का लौटाने वाला ठोस रूपक सुरक्षित रखा गया है, ताकि प्रतिफल का अपराधियों पर वापस आना स्पष्ट रहे।
- source_word: גְמֻלְכֶם
  choice: तुम्हारे किए का प्रतिफल
  rationale: גמול किए गए व्यवहार के अनुरूप मिलने वाले फल या प्रतिदान को दर्शाता है। यह चयन नैतिक प्रतिफल का अर्थ रखता है और इसे केवल व्यापारिक भुगतान नहीं बनाता।
- source_word: בְּרֹאשְׁכֶם
  choice: तुम्हारे ही सिर पर
  rationale: अपराध का प्रतिफल स्वयं अपराधियों पर पड़ने की इब्रानी कहावत को हिन्दी में समझने योग्य और चित्रात्मक रूप में सुरक्षित रखा गया है।
theological_decisions:
- issue: מְעִירָם में परमेश्वर के कार्य का स्वरूप
  choice: परमेश्वर बेचे गए लोगों को उनके स्थान से उठाकर सक्रिय रूप से बाहर ला रहा है।
  alternative: परमेश्वर उन्हें केवल भावनात्मक रूप से जगा रहा है या सैनिक कार्रवाई के लिए उकसा रहा है।
  rationale: क्रिया का अर्थ व्यापक है, पर निकट संदर्भ उनके बेचे जाने के स्थान से निकलने की ओर संकेत करता है। अनुवाद क्रिया को केवल आंतरिक जागृति या सैन्य उकसावे तक सीमित नहीं करता।
- issue: גְמֻלְכֶם בְּרֹאשְׁכֶם का न्याय-संबंधी बल
  choice: दोषियों के किए का उचित प्रतिफल उन्हीं पर लौटेगा।
  alternative: सामान्य अर्थ में केवल ‘मैं तुम्हें दंड दूँगा।’
  rationale: मूल पाठ सामान्य दंड की संज्ञा के बजाय लौटते हुए प्रतिफल का ठोस रूपक रखता है। इसे सुरक्षित रखने से न्याय की नैतिक समरूपता बनी रहती है और कोई अतिरिक्त सिद्धान्त नहीं जोड़ा जाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘तुम्हारे ही सिर पर’ मूल इब्रानी मुहावरे का चित्रात्मक बल बनाए रखता है, जबकि पादटिप्पणी उसका सीधा अर्थ स्पष्ट करती है।
