language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָה֩ בַ/יּ֨וֹם הַ/ה֜וּא יִטְּפ֧וּ הֶ/הָרִ֣ים עָסִ֗יס וְ/הַ/גְּבָעוֹת֙ תֵּלַ֣כְנָה חָלָ֔ב וְ/כָל אֲפִיקֵ֥י יְהוּדָ֖ה יֵ֣לְכוּ מָ֑יִם וּ/מַעְיָ֗ן מִ/בֵּ֤ית יְהוָה֙ יֵצֵ֔א וְ/הִשְׁקָ֖ה אֶת נַ֥חַל הַ/שִּׁטִּֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/018.yaml
  text: And in that day the mountains will drip sweet wine[a], and the hills will flow with milk, and all the streambeds of Judah will flow with water; and a spring will come out from the house of Yahweh and will water the Valley of Shittim.
translation:
  language: hi
  text: उस दिन ऐसा होगा कि पहाड़ों से मीठी दाख की मदिरा टपकेगी, पहाड़ियों से दूध बहेगा, और यहूदा के सभी नाले पानी से भरकर बहेंगे। याहवे के भवन से एक सोता निकलेगा और शित्तीम की घाटी[a] को सींचेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बबूलों की घाटी” अथवा “बबूलों की वादी।”
    reason: הַשִּׁטִּים को स्थान-नाम या ‘बबूलों’ के सामान्य अर्थ में समझा जा सकता है; נַחַל घाटी या वादी भी हो सकता है।
lexical_decisions:
- source_word: וְהָיָה בַיּוֹם הַהוּא
  choice: उस दिन ऐसा होगा कि
  rationale: यह भविष्य के दृश्य का परिचय देने वाले इब्रानी सूत्र को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: יִטְּפוּ הֶהָרִים עָסִיס
  choice: पहाड़ों से मीठी दाखमधु टपकेगी
  rationale: יִטְּפוּ के टपकने के सजीव बिंब और עָסִיס की ताज़ी, मीठी अंगूरी मदिरा के अर्थ को बनाए रखता है।
- source_word: וְהַגְּבָעוֹת תֵּלַכְנָה חָלָב
  choice: पहाड़ियों से दूध बहेगा
  rationale: शाब्दिक ‘दूध लेकर चलेंगी’ की जगह प्रसंगानुकूल प्रवाह और समृद्धि का स्वाभाविक हिन्दी बिंब देता है।
- source_word: וְכָל אֲפִיקֵי יְהוּדָה יֵלְכוּ מָיִם
  choice: यहूदा के सभी नाले पानी से भरकर बहेंगे
  rationale: אֲפִיקֵי सूखी जलधाराओं, नालों या प्रवाह-पथों को सूचित कर सकता है; यह अनुवाद पानी की प्रचुरता और बहाव दोनों को स्पष्ट करता है।
- source_word: וּמַעְיָן
  choice: एक सोता
  rationale: מַעְיָן प्राकृतिक जलस्रोत या सोते को दर्शाता है; ‘सोता’ संक्षिप्त और प्रचलित हिन्दी है।
- source_word: מִבֵּית יְהוָה
  choice: याहवे के भवन से
  rationale: בֵּית का मूल अर्थ ‘भवन/घर’ बनाए रखते हुए मन्दिर-संबंधी संकेत को अनावश्यक रूप से स्पष्ट नहीं किया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में प्रतिलिपित किया गया है।
- source_word: וְהִשְׁקָה
  choice: सींचेगा
  rationale: हिफ़ील क्रिया का अर्थ पानी देना या सिंचित करना है; भू-दृश्य के प्रसंग में ‘सींचेगा’ स्वाभाविक है।
- source_word: נַחַל הַשִּׁטִּים
  choice: शित्तीम की घाटी
  rationale: נַחַל को घाटी/वादी और הַשִּׁטִּים को सम्भावित स्थान-नाम मानते हुए भौगोलिक तथा प्रतीकात्मक अस्पष्टता सुरक्षित रखी गई है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा या प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक चतुरक्षरीय नाम है; उसे उपाधि से प्रतिस्थापित न करके प्रतिलिपित किया गया है।
- issue: הַשִּׁטִּים स्थान-नाम है या बबूल वृक्षों का सामान्य संकेत
  choice: शित्तीम की घाटी
  alternative: बबूलों की घाटी / बबूलों की वादी
  rationale: इसे सम्भावित स्थान-नाम के रूप में मुख्य पाठ में रखा गया है, जबकि इसके वानस्पतिक अर्थ को पाद-टिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। समानांतर काव्य-बिंबों में ‘टपकेगी’, ‘बहेगा’ और ‘भरकर बहेंगे’ द्वारा उर्वरता तथा जल-समृद्धि का क्रम बनाए रखा गया है। पाद-टिप्पणी चिह्न को उसके वास्तविक संदर्भ ‘शित्तीम की घाटी’ के बाद रखा गया है।
