  yaml_path: translation/ot/joel/004/014.yaml
  text: Multitudes[a], multitudes in the Valley of Decision! For the day of Yahweh is near in the Valley of Decision.
translation:
  language: hi
  text: भीड़ें ही भीड़ें—निर्णय की घाटी[a] में! क्योंकि निर्णय की घाटी में यहोवा का दिन निकट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘न्याय की घाटी’ या ‘दँवाई की घाटी’ भी अनुवाद संभव हैं। इब्रानी पद में निर्णायक फैसले का भाव है और वह दँवाई का बिंब भी जगा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הֲמוֹנִים
  choice: भीड़-की-भीड़
  rationale: बहुवचन संज्ञा विशाल जनसमूह को व्यक्त करती है। इब्रानी पुनरुक्ति को स्वाभाविक हिन्दी में ‘भीड़-की-भीड़’ से रखा गया है, जिससे संख्या और तात्कालिकता दोनों उभरते हैं।
- source_word: בְּעֵמֶק
  choice: घाटी में
  rationale: עֵמֶק का सामान्य अर्थ ‘घाटी’ है; यह ठोस भौगोलिक बिंब को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: הֶחָרוּץ
  choice: निर्णय
  rationale: חָרוּץ में निश्चित किए गए निर्णय या निर्णायक विधान का भाव है और यह धार अथवा दँवाई के बिंब भी जगा सकता है। मुख्य पाठ में ‘निर्णय’ अर्थगत व्यापकता को अपेक्षाकृत सुरक्षित रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विस्मय-वाक्य का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: קָרוֹב
  choice: निकट है
  rationale: विशेषण सीधे निकटता बताता है; ‘निकट है’ गरिमापूर्ण और सहज हिन्दी है।
- source_word: יוֹם יְהוָה
  choice: यहोवा का दिन
  rationale: यह नबी-साहित्य में परमेश्वर के निर्णायक हस्तक्षेप का स्थापित पद है। संबंधसूचक हिन्दी संरचना मूल वाक्यांश को सीधे रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: עֵמֶק הֶחָרוּץ का अर्थ
  choice: निर्णय की घाटी
  alternative: न्याय की घाटी; दँवाई की घाटी
  rationale: इब्रानी पद निर्णायक विधान या न्याय का भाव रखता है और संभवतः दँवाई के न्याय-बिंब को भी जगाता है। मुख्य पाठ ‘निर्णय’ रखता है और संकरे अर्थ को थोपने से बचने के लिए अन्य संभावनाएँ पादटिप्पणी में देता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और उद्घोषणात्मक हिन्दी। मूल की पुनरुक्ति तथा विस्मय को बनाए रखा गया है; वाक्य-संरचना साधारण पाठक के लिए स्पष्ट रखी गई है।
