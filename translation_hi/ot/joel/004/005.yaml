  text: אֲשֶׁר כַּסְפִּ֥/י וּ/זְהָבִ֖/י לְקַחְתֶּ֑ם וּ/מַֽחֲמַדַּ/י֙ הַ/טֹּבִ֔ים הֲבֵאתֶ֖ם לְ/הֵיכְלֵי/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/005.yaml
  text: because you took my silver and my gold[a], and brought my precious things into your temples.
translation:
  language: hi
  text: क्योंकि तुमने मेरी चाँदी और मेरा सोना ले लिया, और मेरी बहुमूल्य वस्तुएँ अपने मंदिरों[a] में ले गए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने महलों में।” इब्रानी शब्द का अर्थ “मंदिर” या “महल” दोनों हो सकता है। यहाँ “मंदिर” को प्राथमिकता दी गई है, क्योंकि प्रसंग संकेत करता है कि परमेश्वर की वस्तुएँ दूसरे राष्ट्रों के उपासना-स्थलों में पहुँचा दी गई थीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: क्योंकि
  rationale: संदर्भ में यह पद पिछले कथन के न्याय का कारण बताता है; इसलिए केवल संबंधवाचक रूप के बजाय कारणसूचक अनुवाद स्वाभाविक है।
- source_word: כַּסְפִּי וּזְהָבִי
  choice: मेरी चाँदी और मेरा सोना
  rationale: दोनों प्रथम पुरुष एकवचन संबंधसूचक संज्ञाओं का सीधा और स्वाभाविक अनुवाद।
- source_word: לְקַחְתֶּם
  choice: तुमने ... ले लिया
  rationale: לקח के सामान्य अर्थ ‘लेना’ को रखा गया है; प्रसंग में पूर्ण क्रिया के कारण ‘ले लिया’ अपराध की सम्पन्न कार्रवाई को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּמַחֲמַדַּי הַטֹּבִים
  choice: और मेरी बहुमूल्य वस्तुएँ
  rationale: מַחֲמַדַּי मूल्यवान या मनभावनी वस्तुओं को और הַטֹּבִים उनकी उत्तमता को दर्शाता है। ‘बहुमूल्य वस्तुएँ’ दोनों का संक्षिप्त, अर्थनिष्ठ रूप है और ‘खजाने’ जैसा अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הֲבֵאתֶם
  choice: ले गए
  rationale: हिफ़ील रूप का मूल अर्थ ‘पहुँचाना/ले आना’ है। हिन्दी में वक्ता से दूर, उनके मंदिरों में पहुँचाने के लिए ‘ले गए’ अधिक स्वाभाविक है।
- source_word: לְהֵיכְלֵיכֶם
  choice: अपने मंदिरों में
  rationale: הֵיכָל का अर्थ ‘मंदिर’ या ‘महल’ हो सकता है। लूटी हुई परमेश्वर की वस्तुओं को राष्ट्रों के धार्मिक भवनों में रखने के प्रसंग में ‘मंदिर’ अधिक संभावित है; विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הֵיכְלֵיכֶם से अभिप्रेत भवन
  choice: धार्मिक भवन—‘अपने मंदिरों में’
  alternative: राजकीय भवन—‘अपने महलों में’
  rationale: संदर्भ परमेश्वर की वस्तुओं के अनुचित अधिग्रहण को धार्मिक अपवित्रीकरण के रूप में संकेत कर सकता है, पर इब्रानी शब्द स्वयं दोनों अर्थों की अनुमति देता है। इसलिए मुख्य पाठ में संभावित संदर्भगत अर्थ और पादटिप्पणी में वास्तविक वैकल्पिक अर्थ रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और मौखिक रूप से सहज। ‘तुम’ बहुवचन संबोधन के अनुरूप है। मुख्य पाठ इब्रानी की समानांतर संरचना बनाए रखता है और הֵיכָל की वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित रखता है।
