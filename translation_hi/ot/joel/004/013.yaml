  yaml_path: translation/ot/joel/004/013.yaml
  text: Send in the sickle, for the harvest is ripe. Come, go down, for the winepress is full; the vats overflow, for their evil is great.
translation:
  language: hi
  text: हँसिया चलाओ, क्योंकि फसल पक गई है। आओ, नीचे उतरो, क्योंकि अंगूर रौंदने का कुण्ड भर गया है; हौद छलक रहे हैं, क्योंकि उनकी बुराई बहुत बढ़ गई है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שִׁלְחוּ מַגָּל
  choice: हँसिया चलाओ
  rationale: शाब्दिक रूप से ‘हँसिया भेजो/लगाओ’; हिन्दी में कटाई आरम्भ करने की आज्ञा के लिए ‘हँसिया चलाओ’ स्वाभाविक और चित्रात्मक है।
- source_word: בָשַׁל קָצִיר
  choice: फसल पक गई है
  rationale: בשל के पक जाने और कटाई के लिए तैयार होने का अर्थ सुरक्षित रहता है।
- source_word: רְדוּ
  choice: नीचे उतरो
  rationale: मसोराई पाठ के सामान्य अर्थ ‘नीचे उतरना’ को बनाए रखा गया है; संदर्भ के आधार पर इसे ‘रौंदो’ में संशोधित नहीं किया गया।
- source_word: גַּת
  choice: दाखरस का कुण्ड
  rationale: अंगूर दबाने के स्थान/कुण्ड का बोध देता है और अगले पद के हौदों से उसका भेद रखता है।
- source_word: הֵשִׁיקוּ הַיְקָבִים
  choice: हौद उमड़ रहे हैं
  rationale: क्रिया की प्रचुरता/बह निकलने की छवि और יְקָבִים के संग्रह-हौदों का अर्थ सहज हिन्दी में व्यक्त होता है।
- source_word: רַבָּה רָעָתָם
  choice: उनकी बुराई बहुत बढ़ गई है
  rationale: רבה को केवल परिमाण नहीं, अत्यधिक हो जाने की परिणति के रूप में व्यक्त करता है; न्याय का कारण उनकी व्यापक बुराई है।
theological_decisions:
- issue: रְדוּ की पाठगत/व्याख्यात्मक अस्पष्टता
  choice: नीचे उतरो
  alternative: रौंदो
  rationale: व्यंजन-पाठ को सामान्य धातु ירד (‘नीचे उतरना’) के अनुसार रखा गया है। दाखरस-कुण्ड के संदर्भ में ‘रौंदो’ अर्थपूर्ण अनुमान है, पर वह मौजूदा मसोराई स्वरांकन का सीधा अर्थ नहीं है।
translation_notes:
  register: आज्ञार्थक, काव्यात्मक और न्यायसूचक स्वर रखा गया है। भाषा आधुनिक मानक हिन्दी में है; ‘दाखरस का कुण्ड’ और ‘हौद’ प्राचीन अंगूर-दबाई की छवि को साधारण पाठक के लिए स्पष्ट रखते हैं।
