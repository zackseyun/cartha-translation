source:
  edition: WLC
  text: וְ/קִבַּצְתִּי֙ אֶת כָּל הַ/גּוֹיִ֔ם וְ/ה֣וֹרַדְתִּ֔י/ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט וְ/נִשְׁפַּטְתִּ֨י עִמָּ֜/ם שָׁ֗ם עַל עַמִּ֨/י וְ/נַחֲלָתִ֤/י יִשְׂרָאֵל֙ אֲשֶׁ֣ר פִּזְּר֣וּ בַ/גּוֹיִ֔ם וְ/אֶת אַרְצִ֖/י חִלֵּֽקוּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/002.yaml
  text: I will gather all the nations and bring them down to the Valley of Jehoshaphat[a], and there I will enter into judgment with them on behalf of my people and my inheritance, Israel[b], whom they scattered among the nations and divided up my land.
translation:
  language: hi
  text: मैं सब राष्ट्रों को इकट्ठा करूँगा और उन्हें यहोशापात की घाटी[a] में नीचे ले आऊँगा। वहाँ मैं अपने लोगों और मेरी विरासत, इस्राएल, की ओर से[b] उनके साथ न्याय-विवाद करूँगा, क्योंकि उन्होंने इस्राएल को राष्ट्रों के बीच तितर-बितर कर दिया और मेरी भूमि बाँट ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोशापात की घाटी’ एक स्थान-नाम है; ‘यहोशापात’ नाम में ‘यहोवा न्याय करता है’ का भाव भी सुनाई दे सकता है।
    reason: cultural_note
  - marker: b
    text: या ‘अपने लोगों और मेरी विरासत, इस्राएल, के कारण,’ अथवा ‘अपने लोगों और मेरी विरासत, इस्राएल, के विषय में।’ हिब्रू पूर्वसर्ग के ये निकटवर्ती न्यायिक अर्थ संभव हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: קִבַּצְתִּי
  choice: इकट्ठा करूँगा
  rationale: קבץ का सामान्य अर्थ इकट्ठा या एकत्र करना है; यह रूप आधुनिक हिन्दी में स्वाभाविक है और न्याय के लिए राष्ट्रों को बुलाने का भाव रखता है।
- source_word: כָּל הַגּוֹיִם
  choice: सब राष्ट्रों
  rationale: גּוֹיִם यहाँ विदेशी जनसमुदायों अथवा राष्ट्रों को सामूहिक रूप से दर्शाता है; बाद के तकनीकी धार्मिक अर्थ वाला शब्द उपयुक्त नहीं है।
- source_word: הוֹרַדְתִּים
  choice: उन्हें ... नीचे ले आऊँगा
  rationale: ירד का हिफ़ील रूप कारणवाचक है; यह अनुवाद नीचे लाने का अर्थ स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: यहोशापात की घाटी
  rationale: पाठ इसे स्थान-नाम के रूप में प्रस्तुत करता है, इसलिए नाम का लिप्यंतरण किया गया है; उसके संभावित अर्थ को पादटिप्पणी में रखा गया है।
- source_word: וְנִשְׁפַּטְתִּי עִמָּם
  choice: उनके साथ न्याय-विवाद करूँगा
  rationale: שפט का निफ़ाल रूप עם के साथ केवल निर्णय सुनाने से अधिक, न्यायिक मुक़दमे या विवाद में उतरने का भाव दे सकता है।
- source_word: עַל עַמִּי וְנַחֲלָתִי יִשְׂרָאֵל
  choice: अपने लोगों और अपने निज भाग इस्राएल की ओर से
  rationale: עַל यहाँ न्याय की वजह, विषय या पक्ष को सूचित कर सकता है। मुख्य पाठ में 'की ओर से' परमेश्वर के अपने लोगों के पक्ष में न्याय करने का भाव देता है; निकटवर्ती विकल्प पादटिप्पणी में सुरक्षित हैं। נַחֲלָה के वाचाई संबंध और अपनेपन के भाव के लिए 'निज भाग' चुना गया है।
- source_word: פִּזְּרוּ בַגּוֹיִם
  choice: राष्ट्रों के बीच तितर-बितर कर दिया
  rationale: פזר बिखेरने या तितर-बितर करने को दर्शाता है, और בַגּוֹיִם उस क्षेत्र को बताता है जहाँ इस्राएल फैलाया गया।
- source_word: אַרְצִי חִלֵּקוּ
  choice: मेरी भूमि बाँट ली
  rationale: חלק का पिएल रूप विभाजन या हिस्से करने को दर्शाता है। 'बाँट ली' भूमि के ठोस बँटवारे और कर्ताओं द्वारा उस पर अधिकार करने के प्रसंग में स्वाभाविक हिन्दी है।
theological_decisions:
- issue: נַחֲלָתִי का वाचाई और स्वामित्व-संबंधी बल
  choice: अपने निज भाग
  alternative: अपनी विरासत; अपनी संपत्ति
  rationale: '''निज भाग'' इस्राएल के यहोवा से विशेष संबंध और उसके अपना होने को व्यक्त करता है, पर ऐसा नहीं कहता कि परमेश्वर ने इसे किसी पूर्वाधिकारी से विरासत में पाया।'
- issue: न्याय-वाक्य में עַל का बल
  choice: की ओर से
  alternative: के कारण; के विषय में
  rationale: इस पूर्वसर्ग में पक्ष, कारण और विषय के निकटवर्ती न्यायिक अर्थ संभव हैं। मुख्य पाठ में लोगों की ओर से न्यायिक कार्रवाई का भाव रखा गया है और अस्पष्टता को पादटिप्पणी में स्पष्ट किया गया है।
- issue: אֲשֶׁר का पूर्वपद
  choice: इस्राएल को ... तितर-बितर कर दिया
  alternative: मेरे लोगों और मेरे निज भाग ... जिन्हें उन्होंने तितर-बितर किया
  rationale: हिब्रू संबंधवाचक सर्वनाम संख्या या लिंग को स्पष्ट नहीं करता। हिन्दी में 'इस्राएल को' दोहराने से सामूहिक इस्राएल को बिखेरने का आशय स्पष्ट होता है, बिना किसी अतिरिक्त धर्मसैद्धांतिक निष्कर्ष के।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किंतु सहज रूप अपनाया गया है। 'न्याय-विवाद' कानूनी टकराव का भाव सुरक्षित रखता है। स्थान-नाम के अर्थ और עַל की वास्तविक अस्पष्टता को मुख्य पाठ में अत्यधिक व्याख्यायित करने के बजाय पादटिप्पणियों में रखा गया है। अंग्रेज़ी परामर्श-पाठ में पादटिप्पणी-चिह्नों और उनकी सामग्री का क्रम असंगत था; हिन्दी मसौदे में स्थान-नाम की टिप्पणी [a] और पूर्वसर्ग की वैकल्पिक व्याख्या [b] के साथ सही स्थान पर जोड़ी गई है।
