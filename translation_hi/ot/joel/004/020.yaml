base_translation:
  language: en
  yaml_path: translation/ot/joel/004/020.yaml
  text: But Judah will be inhabited forever[a], and Jerusalem from generation to generation.
translation:
  language: hi
  text: परन्तु यहूदा सदा बसा रहेगा, और यरूशलेम पीढ़ी-दर-पीढ़ी बसा रहेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וִ/יהוּדָה
  choice: परन्तु यहूदा
  rationale: आरम्भिक वाव पिछले पद में शत्रु देशों पर आए न्याय के विपरीत यहूदा की स्थिति प्रस्तुत करता है; इसलिए आधुनिक हिन्दी में ‘परन्तु’ प्रसंगगत विरोध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְ/עוֹלָם
  choice: सदा
  rationale: यहाँ עוֹלָם अनिश्चित भविष्य तक निरन्तर बने रहने का भाव देता है; ‘सदा’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: תֵּשֵׁב
  choice: बसा रहेगा
  rationale: ישׁב भूमि अथवा नगर के विषय में बसे या आबाद रहने का अर्थ दे सकता है। ‘बसा रहेगा’ यहूदा को भूभाग मानते हुए निरन्तर आबादी का भाव व्यक्त करता है, जबकि अधिक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וִ/ירוּשָׁלִַם
  choice: और यरूशलेम
  rationale: दूसरा वाव पहले खण्ड में यरूशलेम को जोड़ता है; अतः ‘और’ सीधा और स्वाभाविक अनुवाद है।
- source_word: לְ/ד֥וֹר וָ/דֽוֹר
  choice: पीढ़ी-दर-पीढ़ी
  rationale: यह हिब्रू मुहावरा लगातार आने वाली पीढ़ियों में निरन्तरता व्यक्त करता है। ‘पीढ़ी-दर-पीढ़ी’ पुनरुक्ति का बल बनाए रखते हुए प्रचलित हिन्दी देता है।
theological_decisions:
- issue: यहूदा और यरूशलेम के स्थायी भविष्य से सम्बन्धित प्रतिज्ञा का स्वरूप
  choice: पद को स्थायी बसावट की सीधी भविष्यद्वाणी के रूप में रखा गया है, उसकी पूर्ति की विधि या काल-सीमा को परिभाषित किए बिना।
  alternative: इसे केवल शाब्दिक भू-राजनीतिक स्थायित्व अथवा मुख्यतः प्रतीकात्मक/कलीसियाई पूर्ति के रूप में स्पष्ट करना।
  rationale: हिब्रू पाठ यहूदा और यरूशलेम की निरन्तर बसावट कहता है, पर यह नहीं बताता कि पूर्ति केवल शाब्दिक, प्रतिरूपात्मक या युगान्त-संबन्धी है। अनुवाद इस धर्मवैज्ञानिक तनाव को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और सामान्य पाठक के लिए सहज शैली अपनाई गई है। ‘बसा रहेगा’ क्षेत्र की आबादी का स्वाभाविक भाव देता है; पादटिप्पणी मूल क्रिया की वास्तविक अर्थ-सम्भावना सुरक्षित रखती है।
