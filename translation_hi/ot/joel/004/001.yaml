  yaml_path: translation/ot/joel/004/001.yaml
  text: For behold[a], in those days and at that time, when I restore the fortunes of Judah and Jerusalem,
translation:
  language: hi
  text: क्योंकि देखो, उन दिनों और उस समय, जब मैं यहूदा और यरूशलेम की दशा को फिर से सुधारूँगा[a],
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यहूदा और यरूशलेम के बंधुओं को वापस ले आऊँगा।” हिब्रू अभिव्यक्ति एक मुहावरा है, जिसका अर्थ किसी प्रजा की विपत्ति को पलटकर उसकी दशा को पुनः सुधारना है; इसमें प्रायः निर्वासन से वापसी का भाव भी होता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले संदर्भ से जुड़कर आगे कही जाने वाली बात का आधार प्रस्तुत करता है; इसलिए संयोजक अर्थ को बनाए रखा गया है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान आकर्षित करने वाला सूचक अव्यय है। ‘देखो’ आधुनिक हिन्दी में स्वाभाविक रहते हुए भविष्यसूचक बल को बनाए रखता है।
- source_word: בַּיָּמִים הָהֵמָּה
  choice: उन दिनों
  rationale: यह भविष्यसूचक कथन में पहले से संकेतित भावी अवधि के लिए प्रचलित कालवाचक अभिव्यक्ति है।
- source_word: וּבָעֵת הַהִיא
  choice: और उस समय
  rationale: पहली कालवाचक अभिव्यक्ति के समानांतर इस पदबंध का बल और संयोजक संरचना सुरक्षित रखी गई है।
- source_word: אֲשֶׁר
  choice: जब
  rationale: यहाँ सम्बन्धवाचक अव्यय पुनर्स्थापना की घटना को कालगत रूप में प्रस्तुत करता है; हिन्दी में ‘जब’ स्वाभाविक समतुल्य है।
- source_word: אשוב אֶת שְׁבוּת
  choice: दशा फिर से सुधारूँगा
  rationale: यह हिब्रू मुहावरा विपत्ति को पलटकर पुनर्बहाली करने का अर्थ दे सकता है, जिसमें बंधुआई से वापसी भी निहित हो सकती है। यह हिन्दी रूप व्यापक मुहावरेदार अर्थ को स्पष्ट रखता है।
- source_word: יְהוּדָה
  choice: यहूदा
  rationale: स्थान और लोगों के नाम का हिन्दी बाइबलीय मानक रूप।
- source_word: וִירוּשָׁלִָם
  choice: और यरूशलेम
  rationale: नगर के नाम का हिन्दी बाइबलीय मानक रूप; संयोजक वाव को ‘और’ से व्यक्त किया गया है।
theological_decisions:
- issue: שׁוּב אֶת־שְׁבוּת का मुहावरेदार अर्थ
  choice: मुख्य पाठ में ‘दशा फिर से सुधारूँगा’
  alternative: ‘बंधुआई से लौटा लाऊँगा’ या ‘बंधुओं को वापस ले आऊँगा’
  rationale: हिब्रू पदबंध बंधुआई से वापसी का संकेत दे सकता है, पर उसका अर्थ व्यापक रूप से विपत्ति का पलटना और लोगों की दशा की पुनर्बहाली भी है। मुख्य पाठ में व्यापक मुहावरेदार अर्थ रखा गया है और निर्वासन-संबंधी सम्भावना पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक और गरिमापूर्ण भविष्यसूचक शैली अपनाई गई है। ‘देखो’ ध्यानाकर्षक बल बनाए रखता है, जबकि ‘दशा फिर से सुधारूँगा’ सामान्य पाठक के लिए मुहावरे का अर्थ स्पष्ट करता है। पद अगले वाक्य में जारी रहने के कारण अंत में अल्पविराम रखा गया है।
