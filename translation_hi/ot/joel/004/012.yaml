source:
  edition: WLC
  text: יֵע֨וֹרוּ֙ וְ/יַעֲל֣וּ הַ/גּוֹיִ֔ם אֶל עֵ֖מֶק יְהֽוֹשָׁפָ֑ט כִּ֣י שָׁ֗ם אֵשֵׁ֛ב לִ/שְׁפֹּ֥ט אֶת כָּל הַ/גּוֹיִ֖ם מִ/סָּבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/004/012.yaml
  text: Let the nations awaken and come up to the Valley of Jehoshaphat[a], for there I will sit to judge all the surrounding nations.
translation:
  language: hi
  text: राष्ट्र जाग उठें और यहोशापात की घाटी[a] में चढ़ आएँ, क्योंकि वहाँ मैं आस-पास के सभी राष्ट्रों का न्याय करने के लिए बैठूँगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘यहोशापात’ नाम सम्भवतः ‘यहोवा न्याय करता है’ के अर्थ की ओर संकेत करता है और यहाँ परमेश्वर के न्याय के दृश्य को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֵעוֹרוּ
  choice: जाग उठें
  rationale: यह रूप यहाँ आह्वान का भाव देता है। ‘जाग उठें’ कार्य या युद्ध के लिए सचेत और सक्रिय किए जाने की रूपकात्मकता बनाए रखता है।
- source_word: וְיַעֲלוּ
  choice: और ... चढ़ आएँ
  rationale: עלה का मूल दिशात्मक भाव ‘ऊपर चढ़ना’ है। ‘चढ़ आएँ’ न्याय के लिए निर्धारित स्थान की ओर गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַגּוֹיִם
  choice: राष्ट्र
  rationale: सन्दर्भ में यह न्याय के लिए एकत्र विदेशी राष्ट्रों को दर्शाता है; ‘राष्ट्र’ आधुनिक हिन्दी में सटीक और सहज है।
- source_word: עֵמֶק יְהוֹשָׁפָט
  choice: यहोशापात की घाटी
  rationale: स्थान-नाम को लिप्यंतरित रखा गया है; उसके अर्थ और न्याय-विषयक शब्द-साम्य को पादटिप्पणी में बताया गया है।
- source_word: כִּי שָׁם
  choice: क्योंकि वहाँ
  rationale: यह राष्ट्रों को बुलाए जाने का कारण प्रस्तुत करता है और इब्रानी के कारणसूचक बल को स्पष्ट रखता है।
- source_word: אֵשֵׁב
  choice: मैं ... बैठूँगा
  rationale: ישב का अर्थ ‘निवास करना’ भी हो सकता है, पर לִשְׁפֹּט के साथ यहाँ न्यायासन पर बैठने का न्यायिक चित्र प्रमुख है।
- source_word: לִשְׁפֹּט
  choice: न्याय करने के लिए
  rationale: यहाँ שפט राष्ट्रों पर न्यायिक कार्रवाई को सूचित करता है; यह चयन सीधा और अर्थपूर्ण है।
- source_word: כָּל הַגּוֹיִם מִסָּבִיב
  choice: आस-पास के सभी राष्ट्रों
  rationale: מִסָּבִיב स्थानिक अर्थ में चारों ओर स्थित राष्ट्रों का संकेत देता है; ‘आस-पास के सभी राष्ट्र’ सहज आधुनिक हिन्दी है।
theological_decisions:
- issue: ईश्वरीय न्याय की ओर संकेत करने वाले स्थान-नाम יְהוֹשָׁפָט का अनुवाद
  choice: मुख्य पाठ में ‘यहोशापात’ के रूप में लिप्यंतरण और अर्थ का पादटिप्पणी में उल्लेख
  alternative: नाम को ‘यहोवा न्याय करता है’ या ‘यहोवा ने न्याय किया’ के रूप में अनूदित करना
  rationale: मुख्य पाठ में व्यक्तिवाचक स्थान-नाम सुरक्षित रहता है, जबकि पादटिप्पणी उसके न्याय-विषयक अर्थ-साम्य को सामने लाती है और नाम के अर्थ की कालगत सम्भावना को अनावश्यक रूप से निश्चित नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जाग उठें’ और ‘चढ़ आएँ’ मूल के आह्वान तथा दिशात्मक गति को बनाए रखते हैं; ‘बैठूँगा’ न्यायासन के चित्र को सुरक्षित रखता है।
