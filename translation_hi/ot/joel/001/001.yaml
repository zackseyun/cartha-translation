    reason: alternative_reading
lexical_decisions:
- source_word: דְּבַר
  choice: वचन
  rationale: यְהוָה के साथ यह रचना नबूवत की मानक अभिव्यक्ति है। ‘वचन’ मूल रूपक और बाइबलीय प्रयोग को बनाए रखता है; ‘संदेश’ अधिक अर्थ-स्पष्ट विकल्प है, जिसे पादटिप्पणी में दिया गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले इब्रानी ईश्वरीय नाम YHWH को किसी उपाधि से बदलने के बजाय आधुनिक हिन्दी में प्रचलित निकट लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֲשֶׁר הָיָה אֶל
  choice: जो … के पास पहुँचा
  rationale: היה + אל यहाँ नबी को प्राप्त हुए ईश्वरीय प्रकाशन की मानक अभिव्यक्ति है। ‘के पास पहुँचा’ स्वाभाविक हिन्दी में इस भाव को व्यक्त करता है, बिना उसे केवल सुनने या दर्शन पाने तक सीमित किए।
- source_word: יוֹאֵל
  choice: योएल
  rationale: इब्रानी व्यक्तिगत नाम का हिन्दी में प्रचलित बाइबलीय लिप्यंतरण।
- source_word: בֶּן
  choice: पुत्र
  rationale: वंश-सूचक संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप। संबंध को स्वाभाविक बनाने के लिए ‘पतूएल के पुत्र योएल’ क्रम अपनाया गया है।
- source_word: פְּתוּאֵל
  choice: पतूएल
  rationale: इब्रानी व्यक्तिगत नाम का ध्वन्यात्मक हिन्दी लिप्यंतरण।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, बल्कि ईश्वर का विशिष्ट नाम YHWH है। ‘याहवे’ उस नाम को नाम के रूप में सुरक्षित रखता है; पारंपरिक उपाधि-संबंधी जानकारी पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘वचन’ नबूवत की परिचित बाइबलीय अभिव्यक्ति को बनाए रखता है, जबकि वाक्य-विन्यास सामान्य हिन्दी पाठक के लिए स्वाभाविक है।
