id: JOL.1.15
reference: Joel 1:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אֲהָ֖הּ לַ/יּ֑וֹם כִּ֤י קָרוֹב֙ י֣וֹם יְהוָ֔ה וּ/כְ/שֹׁ֖ד מִ/שַׁדַּ֥י יָבֽוֹא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/015.yaml
  text: Alas for the day! For the day of Yahweh is near[a], and it comes like destruction from the Almighty.
translation:
  language: hi
  text: हाय, उस दिन पर! क्योंकि याहवे का दिन निकट है; वह सर्वशक्तिमान की ओर से विनाश के समान आएगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘विनाश’ (शोद) और ‘शद्दाई’ (सर्वशक्तिमान) के बीच ध्वनि पर आधारित शब्दालंकार है।
    reason: मूल भाषा का शब्दालंकार हिन्दी मुख्य पाठ में पूरी तरह व्यक्त नहीं किया जा सकता।
lexical_decisions:
- source_word: אֲהָהּ לַיּוֹם
  choice: हाय, उस दिन के कारण!
  rationale: विलाप और भय की विस्मयादिबोधक अभिव्यक्ति है। ‘उस दिन के कारण’ ל के संबंध को स्वाभाविक हिन्दी में व्यक्त करता है और आगामी ‘यहोवा के दिन’ की ओर संकेत बनाए रखता है।
- source_word: כִּי קָרוֹב
  choice: क्योंकि ... निकट है
  rationale: כִּי विलाप का कारण बताता है और קָרוֹב आसन्नता व्यक्त करता है।
- source_word: יוֹם יְהוָה
  choice: यहोवा का दिन
  rationale: भविष्यद्वाणी में परमेश्वर के निर्णायक हस्तक्षेप की स्थापित अभिव्यक्ति; יְהוָה को उसके व्यक्तिगत नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: וּכְשֹׁד
  choice: विनाश के समान
  rationale: שֹׁד हिंसक उजाड़ या विनाश दर्शाता है और כְ उपमा को चिह्नित करता है।
- source_word: מִשַׁדַּי
  choice: सर्वशक्तिमान की ओर से
  rationale: מִן स्रोत बताता है और שַׁדַּי का अर्थपरक, प्रचलित हिन्दी रूप ‘सर्वशक्तिमान’ है।
- source_word: יָבֹוא
  choice: आएगा
  rationale: अपूर्ण क्रिया यहाँ निकट भविष्य और निश्चित आगमन व्यक्त करती है; हिन्दी भविष्यकाल स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम है; शीर्षक से बदलने के बजाय हिन्दी में प्रचलित नामरूप रखा गया है।
- issue: שֹׁד और שַׁדַּי का संबंध
  choice: मुख्य पाठ में ‘विनाश’ और ‘सर्वशक्तिमान’, तथा पादटिप्पणी में शब्दालंकार
  alternative: ‘शद्दाई की ओर से विनाश’
  rationale: अर्थ को सामान्य पाठक के लिए स्पष्ट रखते हुए मूल हिब्रू की ध्वनि-समानता को पादटिप्पणी में सुरक्षित किया गया है।
- issue: आने वाली वस्तु का कर्ता
  choice: ‘वह’ से ‘यहोवा का दिन’ का संकेत
  alternative: ‘विनाश ... आएगा’
  rationale: हिब्रू वाक्यरचना में आने वाली बात को दिन अथवा विनाश-सदृश घटना से जोड़ा जा सकता है। हिन्दी में ‘वह’ निकटतम मुख्य विषय ‘यहोवा का दिन’ को स्वाभाविक रूप से आगे बढ़ाता है, जबकि उपमा को अलग से बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण भविष्यद्वाणी-संबंधी स्वर रखा गया है। ‘हाय’ सामान्य पाठक के लिए सहज विलाप है; वाक्य में आसन्न संकट की तीव्रता और मूल उपमा दोनों सुरक्षित हैं।
