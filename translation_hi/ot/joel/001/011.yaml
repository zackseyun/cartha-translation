source:
  edition: WLC
  text: הֹבִ֣ישׁוּ אִכָּרִ֗ים הֵילִ֨ילוּ֙ כֹּֽרְמִ֔ים עַל חִטָּ֖ה וְ/עַל שְׂעֹרָ֑ה כִּ֥י אָבַ֖ד קְצִ֥יר שָׂדֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/011.yaml
  text: Be ashamed[a], farmers; wail, vinedressers, over the wheat and over the barley[b], because the harvest of the field has perished.
translation:
  language: hi
  text: किसानों, लज्जित हो जाओ[a]; दाख की बारी सँभालनेवालो, गेहूँ और जौ के लिए विलाप करो[b], क्योंकि खेत की फसल नष्ट हो गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “हताश हो जाओ” अथवा “अपमानित हो जाओ।” इब्रानी क्रिया भावनात्मक व्याकुलता और लज्जा या अपमान—दोनों का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: या, “हाहाकार करो।” इब्रानी क्रिया दुःख में ऊँचे स्वर से रोने-पुकारने को व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֹבִישׁוּ
  choice: लज्जित हो जाओ
  rationale: यह בוש का हिफ़ील बहुवचन आज्ञार्थक रूप है, जो लज्जित होने, अपमानित होने या व्याकुल हो उठने का भाव दे सकता है। “लज्जित हो जाओ” सीधे आज्ञार्थक स्वर और भावनात्मक तीव्रता को बनाए रखता है; अर्थ की दूसरी सम्भावना पादटिप्पणी में दी गई है।
- source_word: אִכָּרִים
  choice: किसानो
  rationale: यह खेत जोतने और खेती करनेवालों के लिए प्रयुक्त शब्द है। “किसान” आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: הֵילִילוּ
  choice: विलाप करो
  rationale: ילל का यह बहुवचन आज्ञार्थक रूप दुःख में ऊँचे स्वर से रोने-पुकारने को दर्शाता है। “विलाप करो” गरिमापूर्ण और स्वाभाविक है तथा इसकी तीव्रता बनाए रखता है।
- source_word: כֹּרְמִים
  choice: दाख की बारी सँभालनेवालो
  rationale: शब्द का संकेत उन लोगों की ओर है जो दाख की बारियों की देखभाल करते हैं। यह हिन्दी पद सटीक और सामान्य पाठक के लिए समझने योग्य है।
- source_word: עַל
  choice: के लिए
  rationale: विलाप के प्रसंग में עַל शोक के विषय अथवा कारण को बताता है। “के लिए” हिन्दी में इस सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חִטָּה וְעַל שְׂעֹרָה
  choice: गेहूँ और जौ
  rationale: दोनों अनाजों के प्रचलित और सटीक हिन्दी नाम रखे गए हैं; दोहराए गए עַל को सहज हिन्दी में एक ही परसर्ग से व्यक्त किया गया है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए आदेशों का कारण प्रस्तुत करता है; “क्योंकि” आधुनिक हिन्दी में स्पष्ट कारणसूचक संयोजक है।
- source_word: אָבַד
  choice: नष्ट हो गई है
  rationale: אבד का काल और भाव ऐसी हानि को दिखाता है जो घट चुकी है और जिसका परिणाम वर्तमान में बना हुआ है। “नष्ट हो गई है” उस परिणामात्मक और गंभीर अर्थ को व्यक्त करता है।
- source_word: קְצִיר שָׂדֶה
  choice: खेत की फसल
  rationale: शाब्दिक अर्थ “खेत की कटनी” है, पर आधुनिक हिन्दी में “खेत की फसल” अधिक स्वाभाविक है और कटाई के लिए उपलब्ध उपज के नष्ट हो जाने का आशय स्पष्ट रखता है।
