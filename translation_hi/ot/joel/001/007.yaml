  text: שָׂ֤ם גַּפְנִ/י֙ לְ/שַׁמָּ֔ה וּ/תְאֵנָתִ֖/י לִ/קְצָפָ֑ה חָשֹׂ֤ף חֲשָׂפָ/הּ֙ וְ/הִשְׁלִ֔יךְ הִלְבִּ֖ינוּ שָׂרִיגֶֽי/הָ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/007.yaml
  text: It has made my vine a desolation and my fig tree splinters[a]; it has stripped it bare and thrown it down[b]; its branches have turned white.
translation:
  language: hi
  text: उसने मेरी अंगूर की बेल को उजाड़ बना दिया है और मेरे अंजीर के पेड़ को टुकड़े-टुकड़े कर दिया है[a]। उसने उसे पूरी तरह छील डाला और फेंक दिया; उसकी शाखाएँ सफेद हो गई हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी शब्द का अर्थ निश्चित नहीं है; इसका अनुवाद ‘ठूँठ’ या ‘चकनाचूर अवशेष’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में ‘फेंक दिया’ का कर्म स्पष्ट नहीं है। आशय यह भी हो सकता है कि पेड़ की उतारी हुई छाल फेंक दी गई, जिससे उसकी शाखाएँ सफेद दिखाई देने लगीं।
    reason: ambiguity
lexical_decisions:
- source_word: שָׂם ... לְשַׁמָּה
  choice: उजाड़ दी है
  rationale: שׂים के साथ לְשַׁמָּה परिणामसूचक मुहावरा है—किसी वस्तु को उजाड़ बना देना। हिन्दी में ‘उजाड़ दी है’ इस अर्थ को स्वाभाविक और संक्षिप्त रूप से व्यक्त करता है।
- source_word: גַּפְנִי
  choice: मेरी दाखलता
  rationale: גֶּפֶן का अर्थ अंगूर की लता है, दाख की बारी नहीं। ‘दाखलता’ मूल संज्ञा और प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय दोनों को बनाए रखता है।
- source_word: וּתְאֵנָתִי
  choice: और मेरे अंजीर के पेड़ को
  rationale: תְּאֵנָה यहाँ अंजीर का पेड़ है। कर्मसूचक ‘को’ हिन्दी वाक्य में שָׂם की परिणामी क्रिया के साथ स्पष्टता देता है।
- source_word: לִקְצָפָה
  choice: टुकड़े-टुकड़े कर दिया है
  rationale: यह दुर्लभ संज्ञा टूटे हुए टुकड़ों या चकनाचूर अवशेषों का बोध कराती है। क्रियात्मक हिन्दी रूप परिणामसूचक לְ को स्वाभाविक ढंग से व्यक्त करता है; शब्द की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: חָשֹׂף חֲשָׂפָהּ
  choice: उसे पूरी तरह छील दिया
  rationale: एक ही धातु के infinitive absolute और perfect का मेल क्रिया पर बल देता है। ‘पूरी तरह’ उस तीव्रता को और ‘छील दिया’ पेड़ की छाल उतारे जाने की तस्वीर को व्यक्त करता है।
- source_word: וְהִשְׁלִיךְ
  choice: और फेंक दिया है
  rationale: Hiphil रूप का मूल अर्थ फेंकना या दूर कर देना है। इब्रानी में इसका व्यक्त कर्म नहीं दिया गया; हिन्दी में भी उसे स्पष्ट रूप से जोड़ने के बजाय प्रसंगगत अस्पष्टता रहने दी गई है।
- source_word: הִלְבִּינוּ שָׂרִיגֶיהָ
  choice: उसकी शाखाएँ सफेद हो गई हैं
  rationale: बहुवचन क्रिया का कर्ता שָׂרִיגֶיהָ है। ‘शाखाएँ’ सामान्य पाठक के लिए सुबोध है और सफेद होना छाल उतरने के बाद खुली लकड़ी की दशा को दर्शाता है।
