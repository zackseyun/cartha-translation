source:
  edition: WLC
  text: הָקִ֤יצוּ שִׁכּוֹרִים֙ וּ/בְכ֔וּ וְ/הֵילִ֖לוּ כָּל שֹׁ֣תֵי יָ֑יִן עַל עָסִ֕יס כִּ֥י נִכְרַ֖ת מִ/פִּי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/005.yaml
  text: Wake up[a], you drunkards, and weep; wail, all you drinkers of wine, over the sweet wine, because it has been cut off from your mouth.
translation:
  language: hi
  text: हे पियक्कड़ों, जागो और रोओ! हे दाखमधु पीनेवालो, तुम सब मीठे दाखमधु[a] के कारण विलाप करो, क्योंकि वह तुम्हारे मुँह से काट दिया गया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “नया दाखमधु” अथवा “ताज़ा दाखमधु”।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָקִיצוּ
  choice: जागो
  rationale: बहुवचन आज्ञार्थक क्रिया नींद या मदहोशी से जागने का आह्वान करती है; ‘जागो’ आधुनिक हिन्दी में स्वाभाविक और सीधा है।
- source_word: שִׁכּוֹרִים
  choice: हे मतवालो
  rationale: विशेषण का सम्बोधनात्मक बहुवचन प्रयोग है। ‘मतवालो’ नशे में रहनेवालों को सीधे संबोधित करता है और गरिमापूर्ण भविष्यद्वाणी शैली बनाए रखता है।
- source_word: וּבְכוּ
  choice: और रोओ
  rationale: यह सामान्यतः रोने या शोक में आँसू बहाने की क्रिया है; अगले अधिक तीव्र शोकादेश से इसका भेद बना रहता है।
- source_word: וְהֵילִלוּ
  choice: विलाप करो
  rationale: ילל ऊँचे स्वर में शोक करने को व्यक्त करता है। ‘विलाप करो’ हिन्दी में सार्वजनिक और तीव्र शोक का स्वाभाविक संकेत देता है।
- source_word: כָּל שֹׁתֵי יָיִן
  choice: हे दाखमधु पीनेवालो, तुम सब
  rationale: कृदन्त और उसके कर्म का सम्बोधनात्मक बल स्पष्ट रखने के लिए यह विन्यास चुना गया है; ‘दाखमधु’ יַיִן के मदिरापेय अर्थ को स्पष्ट करता है।
- source_word: עַל
  choice: के लिए
  rationale: यहाँ यह विलाप के विषय या कारण को प्रस्तुत करता है। ‘के लिए’ दोनों के बीच की हल्की अस्पष्टता बनाए रखता है।
- source_word: עָסִיס
  choice: मीठे दाखमधु
  rationale: עָסִיס ताजे निचोड़े हुए, नए या मीठे अंगूरी पेय का संकेत देता है। ‘मीठा दाखमधु’ उसके स्वाद और पेय-संदर्भ को सहज हिन्दी में व्यक्त करता है; अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: נִכְרַת
  choice: छीन लिया गया है
  rationale: निफ़अल पूर्ण क्रिया आपूर्ति के काट दिए जाने और वर्तमान अभाव को दर्शाती है। ‘छीन लिया गया है’ हिन्दी में उस परिणामी वंचना को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מִפִּיכֶם
  choice: तुम्हारे मुँह से
  rationale: शाब्दिक और सजीव बिंब को बनाए रखा गया है; ‘होंठों से’ अनावश्यक व्याख्यात्मक परिवर्तन होता।
