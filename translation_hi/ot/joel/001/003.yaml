  text: Tell your children about it[a], and let your children tell their children, and their children tell another generation.
translation:
  language: hi
  text: इसके बारे में अपने बच्चों[a] को बताओ; तुम्हारे बच्चे अपने बच्चों को बताएँ, और उनके बच्चे आने वाली पीढ़ी को बताएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘अपने बेटों को बताओ; तुम्हारे बेटे अपने बेटों को, और उनके बेटे दूसरी पीढ़ी को’ है। यहाँ ‘बच्चों’ कहा गया है, क्योंकि संदर्भ सामान्य रूप से आने वाली पीढ़ियों को स्मृति सौंपने का है, केवल पुरुष संतानों का नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָלֶיהָ
  choice: इसके बारे में
  rationale: עַל के साथ स्त्रीलिंग एकवचन प्रत्यय पहले वर्णित विपत्ति की ओर संकेत करता है। हिन्दी में किसी घटना के विषय में कहने के लिए ‘इसके बारे में’ स्वाभाविक है; व्याकरणिक स्त्रीलिंग के कारण ‘उसके/उस स्त्री के बारे में’ कहना भ्रामक होगा।
- source_word: לִבְנֵיכֶם
  choice: अपने बच्चों को
  rationale: בנים का अर्थ विशेष रूप से ‘बेटे’ भी हो सकता है और व्यापक रूप से ‘बच्चे’ भी। यहाँ स्मृति को पीढ़ी-दर-पीढ़ी पहुँचाने का निर्देश है, इसलिए ‘बच्चों’ से संदर्भ का व्यापक पारिवारिक अर्थ स्वाभाविक रूप से व्यक्त होता है।
- source_word: סַפֵּרוּ
  choice: बताओ
  rationale: पिएल बहुवचन आज्ञार्थ जानबूझकर घटना का वर्णन करने का निर्देश देता है। आधुनिक हिन्दी में ‘बताओ’ स्पष्ट, सहज और इस पीढ़ीगत क्रम के अनुकूल है।
- source_word: וּבְנֵיכֶם ... וּבְנֵיהֶם
  choice: तुम्हारे बच्चे ... और उनके बच्चे
  rationale: मूल में अगली उपवाक्य-श्रृंखला में क्रिया दुहराई नहीं गई है, पर उसका अर्थ पहले आज्ञार्थ से जारी रहता है। हिन्दी में स्पष्टता और सहजता के लिए दोनों स्थानों पर ‘बताएँ’ जोड़ा गया है।
- source_word: לְדוֹר אַחֵר
  choice: आनेवाली पीढ़ी को
  rationale: यह पद आगे की किसी दूसरी या बाद की पीढ़ी को दर्शाता है। ‘आनेवाली पीढ़ी’ हिन्दी में स्वाभाविक है और इसे केवल तुरंत अगली पीढ़ी तक सीमित नहीं करता।
