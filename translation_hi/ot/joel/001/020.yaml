base_translation:
  language: en
  yaml_path: translation/ot/joel/001/020.yaml
  text: Even the beasts of the field pant for you[a], because the channels of water have dried up[c][b], and fire has consumed the pastures of the wilderness.
translation:
  language: hi
  text: मैदान के पशु भी आपकी ओर हाँफते हैं[a], क्योंकि जलधाराएँ सूख गई हैं[b], और आग ने निर्जन प्रदेश के चरागाहों[c] को भस्म कर दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘आपके लिए तरसते हैं।’ इब्रानी क्रिया प्यास से हाँफने और लालसा करने, दोनों का भाव दे सकती है; साथ का पूर्वसर्ग ‘की ओर’ दिशा बताता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पानी के नाले’ अथवा ‘जलमार्ग सूख गए हैं।’
    reason: lexical_alternative
  - marker: c
    text: या ‘चरने के स्थानों।’ ‘निर्जन प्रदेश’ के लिए प्रयुक्त इब्रानी शब्द खुले वन्य या असिंचित चरागाही क्षेत्र को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גַּם
  choice: भी
  rationale: यह आरम्भिक अव्यय इस बात पर बल देता है कि इस विपत्ति से पशु भी अछूते नहीं हैं।
- source_word: בַּהֲמוֹת שָׂדֶה
  choice: मैदान के पशु
  rationale: यह पद खुले क्षेत्र में रहने वाले पशुओं के लिए व्यापक अभिव्यक्ति है; इसे केवल पालतू मवेशियों तक सीमित नहीं किया गया।
- source_word: תַּעֲרוֹג אֵלֶיךָ
  choice: आपकी ओर हाँफते हैं
  rationale: ערג प्यास से हाँफने और व्याकुल लालसा—दोनों का बोध करा सकता है, जबकि אֵלֶיךָ स्पष्ट दिशात्मकता रखता है। यह अनुवाद सूखे की शारीरिक व्याकुलता और परमेश्वर की ओर उन्मुखता दोनों बनाए रखता है।
- source_word: יָבְשׁוּ אֲפִיקֵי מָיִם
  choice: जलधाराएँ सूख गई हैं
  rationale: אֲפִיקִים जल के मार्गों, धाराओं या नदी-नालों को दर्शाता है। ‘जलधाराएँ’ आधुनिक हिन्दी में सहज है और सूख चुके जलस्रोतों का भाव देता है।
- source_word: וְאֵשׁ אָכְלָה
  choice: और आग ने ... भस्म कर दिया है
  rationale: आग के साथ אָכַל विनाशकारी रूप से खा जाने का मुहावरा है; ‘भस्म कर दिया’ हिन्दी में स्वाभाविक और प्रबल है।
- source_word: נְאוֹת הַמִּדְבָּר
  choice: निर्जन प्रदेश की चरागाहों
  rationale: נְאוֹת यहाँ चरने के स्थान हैं और מִדְבָּר अनिवार्यतः रेतीला मरुस्थल नहीं, बल्कि खुला, असिंचित प्रदेश भी हो सकता है।
theological_decisions:
- issue: אֵלֶיךָ में द्वितीय पुरुष एकवचन का संदर्भ
  choice: ‘आपकी ओर’—सम्बोधन परमेश्वर से है
  alternative: इसे केवल पशुओं की अवैयक्तिक व्याकुलता के रूप में समझना
  rationale: पिछले पद में परमेश्वर को प्रत्यक्ष पुकारा गया है और यहाँ पुल्लिंग एकवचन प्रत्यय उसी सम्बोधन को जारी रखता है। फिर भी अनुवाद यह निर्धारित नहीं करता कि पशुओं की क्रिया सचेत प्रार्थना है या संकट में सृष्टि का परमेश्वर की ओर उन्मुख होना।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘आपकी’ द्वारा परमेश्वर के लिए आदरसूचक सम्बोधन रखा गया है। ‘निर्जन प्रदेश’ को ‘रेगिस्तान’ पर वरीयता दी गई, ताकि इब्रानी מִדְבָּר का व्यापक अर्थ बना रहे।
