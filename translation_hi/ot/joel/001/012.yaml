  text: הַ/גֶּ֣פֶן הוֹבִ֔ישָׁה וְ/הַ/תְּאֵנָ֖ה אֻמְלָ֑לָה רִמּ֞וֹן גַּם תָּמָ֣ר וְ/תַפּ֗וּחַ כָּל עֲצֵ֤י הַ/שָּׂדֶה֙ יָבֵ֔שׁוּ כִּֽי הֹבִ֥ישׁ שָׂשׂ֖וֹן מִן בְּנֵ֥י אָדָֽם־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/012.yaml
  text: The vine has dried up[a], and the fig tree has withered; the pomegranate, also the palm and the apple tree—all the trees of the field have dried up. Indeed[b], joy has dried up from the sons of man.
translation:
  language: hi
  text: 'अंगूर की बेल सूख गई है,

    और अंजीर का पेड़ मुरझा गया है;

    अनार, खजूर और सेब के पेड़[a] भी—

    खेत के सभी पेड़ सूख गए हैं।

    निश्चय ही, मनुष्यों में से आनन्द सूख गया है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः “खुबानी का पेड़”; इब्रानी תַפּוּחַ से अभिप्रेत पेड़ की ठीक-ठीक प्रजाति निश्चित नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शब्दशः, “मनुष्य-पुत्रों में से”; या, “मानवजाति में से।”
    reason: alternative_reading
lexical_decisions:
- source_word: הַגֶּפֶן
  choice: अंगूर की बेल
  rationale: खेती की जाने वाली दाखलता के लिए आधुनिक हिन्दी में यह स्पष्ट और स्वाभाविक पद है।
- source_word: הוֹבִישָׁה
  choice: सूख गई है
  rationale: कृषि-विनाश के प्रसंग में क्रिया पौधे के सूख जाने को बताती है; पूर्ण क्रिया का वर्तमान परिणाम भी बना रहता है।
- source_word: הַתְּאֵנָה אֻמְלָלָה
  choice: अंजीर का पेड़ मुरझा गया है
  rationale: אֻמְלָלָה पेड़ की क्षीण और मुरझाई दशा व्यक्त करता है तथा निकटवर्ती 'सूख गई' से काव्यात्मक भिन्नता बनाए रखता है।
- source_word: רִמּוֹן גַּם תָּמָר וְתַפּוּחַ
  choice: अनार, खजूर और सेब का पेड़ भी
  rationale: पेड़ों की सूची को सहज हिन्दी में रखा गया है; גם की योगात्मक शक्ति 'भी' से व्यक्त होती है। תַפּוּחַ की प्रजाति अनिश्चित होने के कारण परम्परागत 'सेब' मुख्य पाठ में और विकल्प पादटिप्पणी में है।
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: मैदान के सभी पेड़
  rationale: व्यापक कथन और שׂדה की ग्रामीण/खुले क्षेत्र की छवि दोनों को सरल, औपचारिक हिन्दी में सुरक्षित रखता है।
- source_word: יָבֵשׁוּ
  choice: सूख गए हैं
  rationale: बहुवचन पूर्ण क्रिया पेड़ों की वर्तमान उजड़ी दशा बताती है और आरम्भ की सूखने वाली छवि दोहराती है।
- source_word: כִּי הֹבִישׁ שָׂשׂוֹן
  choice: निश्चय ही, ... आनन्द सूख गया है
  rationale: כִּי को यहाँ जोर देने वाले व्याख्यात्मक संक्रमण के रूप में लिया गया है। आनन्द के 'सूखने' से कृषि-विनाश और मानवीय अनुभव के बीच मूल रूपक बना रहता है।
- source_word: מִן בְּנֵי אָדָם
  choice: मनुष्यों के बीच से
  rationale: מן के अलगाव-सूचक भाव और בני אדם के समस्त मानवों को सूचित करने वाले मुहावरे को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: בְּנֵי אָדָם का सामान्य मानवता-सूचक अर्थ
  choice: मनुष्यों के बीच से
  alternative: आदम की सन्तानों के बीच से / मानवजाति से
  rationale: यह इब्रानी मुहावरा केवल पुरुषों को नहीं, मानव समुदाय को सामान्य रूप से सूचित करता है। मुख्य पाठ में उसका स्वाभाविक समावेशी अर्थ रखा गया है, जबकि अधिक शब्दशः रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक विलाप के अनुरूप रखी गई है। पंक्ति-विन्यास पेड़ों की क्रमिक सूची और अन्त में आनन्द के सूख जाने वाले रूपक को उभारता है। सभी पादटिप्पणी-चिह्न सम्बद्ध शब्दों या वाक्यांशों के ठीक बाद दिए गए हैं।
