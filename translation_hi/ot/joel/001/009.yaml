id: JOL.1.9
reference: Joel 1:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הָכְרַ֥ת מִנְחָ֛ה וָ/נֶ֖סֶךְ מִ/בֵּ֣ית יְהוָ֑ה אָֽבְלוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/009.yaml
  text: The grain offering and the drink offering are cut off from the house of Yahweh[a]; the priests mourn[c][b], the ministers of Yahweh.
translation:
  language: hi
  text: याहवे[a] के भवन[b] से अन्नबलि और पेय-बलि[c] हटा दी गई हैं; याहवे की सेवा करने वाले याजक शोक मना रहे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (याहवे) है।
    reason: divine_name
  - marker: b
    text: शाब्दिक रूप से, ‘याहवे के भवन से’; अर्थात उसके मंदिर या पवित्रस्थान से।
    reason: lexical_clarification
  - marker: c
    text: अर्थात उँडेलकर चढ़ाई जाने वाली पेय-अर्पण की बलि।
    reason: lexical_clarification
lexical_decisions:
- source_word: הָכְרַת
  choice: चढ़ना बंद हो गया है
  rationale: होफ़अल रूप किसी वस्तु के काट दिए जाने अथवा रुकवा दिए जाने का परिणाम बताता है। इस उपासना-संदर्भ में यह अनुवाद स्वाभाविक हिन्दी में बलियों के पूरी तरह रुक जाने को व्यक्त करता है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: मंदिर और נֶסֶךְ के साथ प्रयुक्त होने के कारण यहाँ सामान्य भेंट नहीं, बल्कि अन्न से चढ़ाई जाने वाली निर्धारित बलि अभिप्रेत है।
- source_word: נֶסֶךְ
  choice: अर्घ्य
  rationale: यह उँडेलकर चढ़ाए जाने वाले पेय-अर्पण का पारिभाषिक शब्द है। ‘अर्घ्य’ संक्षिप्त और प्रतिष्ठित हिन्दी समतुल्य है; अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: מִבֵּית יְהוָה
  choice: याहवे के भवन में
  rationale: शाब्दिक चित्र ‘याहवे का भवन’ सुरक्षित रखा गया है। हिन्दी में बलि चढ़ने का स्थान स्वाभाविक रूप से ‘में’ से व्यक्त होता है, जबकि स्रोत का מִן यह बताता है कि ये अर्पण उस भवन से हटा दिए गए या वहाँ से समाप्त हो गए हैं।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: אָבְלוּ
  choice: शोक मना रहे हैं
  rationale: क्रिया सामुदायिक या धार्मिक शोक को व्यक्त करती है; यह वर्तमान संकट का स्वाभाविक हिन्दी वर्णन है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: मंदिर में धार्मिक सेवा करने वाले पदधारियों के लिए मानक हिन्दी शब्द।
- source_word: מְשָׁרְתֵי יְהוָה
  choice: वे जो याहवे की सेवा करते हैं
  rationale: यह कृदन्त पद ‘याजकों’ का समानाधिकरण में परिचय देता है। वर्णनात्मक अनुवाद उनके आधिकारिक धार्मिक कार्य को स्पष्ट रखता है और व्यापक ‘सेवक’ से अधिक सटीक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे केवल एक उपाधि में नहीं बदलता।
- issue: מְשָׁרְתֵי יְהוָה का ‘याजकों’ से संबंध
  choice: याजकों का समानाधिकरण—‘वे जो याहवे की सेवा करते हैं’
  alternative: याजकों से अलग सेवकों का दूसरा समूह
  rationale: इब्रानी पद बिना संयोजक के ‘याजकों’ के बाद आता है, इसलिए उसे उन्हीं की भूमिका स्पष्ट करने वाला समानाधिकरण मानना वाक्य-विन्यास के सर्वाधिक अनुरूप है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण धार्मिक गद्य। ‘याजक’ और ‘अन्नबलि’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; ‘अर्घ्य’ को सामान्य पाठक के लिए पादटिप्पणी में समझाया गया है। डैश के बाद का पद याजकों की भूमिका स्पष्ट करता है और इब्रानी समानाधिकरण को स्वाभाविक हिन्दी में बनाए रखता है।
