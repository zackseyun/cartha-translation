- from: याहवे[a] के भवन[b] में अन्नबलि और अर्घ्य[c] चढ़ना बंद हो गया है; याजक शोक मना रहे हैं—वे जो याहवे की सेवा करते हैं।
  to: याहवे[a] के भवन[b] से अन्नबलि और पेय-बलि[c] हटा दी गई हैं; याहवे की सेवा करने वाले याजक शोक मना रहे हैं।
  rationale: The revision preserves the Hebrew passive sense that the offerings have been removed from Yahweh’s house, uses the precise modern Hindi cultic term “पेय-बलि” for נֶסֶךְ, and expresses the final apposition naturally without implying a separate group from the priests.
