source:
  edition: WLC
  text: עָבְשׁ֣וּ פְרֻד֗וֹת תַּ֚חַת מֶגְרְפֹ֣תֵי/הֶ֔ם נָשַׁ֨מּוּ֙ אֹֽצָר֔וֹת נֶהֶרְס֖וּ מַמְּגֻר֑וֹת כִּ֥י הֹבִ֖ישׁ דָּגָֽן׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/017.yaml
  text: The seeds have shriveled beneath their clods[a]; the storehouses are desolate, the granaries are torn down[b], because the grain has dried up.
translation:
  language: hi
  text: 'बीज के दाने[a] मिट्टी के ढेलों[b] के नीचे सिकुड़ गए हैं;

    भंडार-घर उजाड़ पड़े हैं,

    अन्नागार ढह गए हैं,

    क्योंकि अनाज सूख गया है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी פְרֻדוֹת एक दुर्लभ और अनिश्चित शब्द है। संभवतः इसका अर्थ बीज या अनाज के दाने है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी מֶגְרְפֹתֵיהֶם का अर्थ भी अनिश्चित है। यहाँ कृषि-संदर्भ के अनुसार इसका अनुवाद “मिट्टी के ढेले” किया गया है; अन्य संभावित अर्थ “क्यारियाँ/हल की रेखाएँ” या “कुदालें/फावड़े” हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עָבְשׁוּ
  choice: सिकुड़ गए हैं
  rationale: क्रिया सूखकर मुरझाने या सिकुड़ने का बोध कराती है; भूमि के नीचे पड़े बीज-दानों के संदर्भ में यह स्वाभाविक और चित्रात्मक है।
- source_word: פְרֻדוֹת
  choice: बीज के दाने
  rationale: यह दुर्लभ और अनिश्चित संज्ञा संभवतः बोए गए बीजों अथवा अनाज के दानों को सूचित करती है। यह चयन अर्थ को स्पष्ट करता है, पर उसे किसी विशेष फसल तक सीमित नहीं करता।
- source_word: תַּחַת
  choice: के नीचे
  rationale: स्थान-सूचक संबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מֶגְרְפֹתֵיהֶם
  choice: मिट्टी के ढेलों
  rationale: शब्द दुर्लभ और विवादित है। कृषि-संदर्भ और 'नीचे' के साथ मिट्टी के ढेले सर्वाधिक सुसंगत अर्थ देते हैं, यद्यपि 'क्यारियाँ/हल की रेखाएँ' या कृषि-औज़ार भी प्रस्तावित हैं।
- source_word: נָשַׁמּוּ
  choice: उजाड़ पड़े हैं
  rationale: भंडार-स्थलों की वीरानी और अनुपयोगी दशा को वर्तमान, स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹצָרוֹת
  choice: भंडार-घर
  rationale: कृषि-संदर्भ में उपज रखने के स्थान अभिप्रेत हैं, न कि धन का खजाना।
- source_word: נֶהֶרְסוּ
  choice: ढह गए हैं
  rationale: निफ़अल रूप नष्ट या गिरा दिए जाने की परिणामी दशा बताता है। 'ढह गए हैं' कारक को अनावश्यक रूप से निश्चित किए बिना भवनों के विनाश को व्यक्त करता है।
- source_word: מַמְּגֻרוֹת
  choice: अन्नागार
  rationale: यह अनाज रखने की संरचनाओं का सटीक और प्रतिष्ठित हिन्दी शब्द है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यहाँ भंडारण-स्थलों की दुर्दशा का कारण दिया गया है।
- source_word: הֹבִישׁ
  choice: सूख गया है
  rationale: कृषि-विफलता को सूख जाने के ठोस चित्र द्वारा व्यक्त करता है; संदर्भ में यही अर्थ सबसे उपयुक्त है।
- source_word: דָּגָן
  choice: अनाज
  rationale: सामान्य अन्न-उपज के लिए सहज आधुनिक हिन्दी शब्द, जो किसी एक प्रकार के अनाज तक अर्थ सीमित नहीं करता।
