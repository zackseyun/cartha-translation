id: JOL.1.13
reference: Joel 1:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: חִגְר֨וּ וְ/סִפְד֜וּ הַ/כֹּהֲנִ֗ים הֵילִ֨ילוּ֙ מְשָׁרְתֵ֣י מִזְבֵּ֔חַ בֹּ֚אוּ לִ֣ינוּ בַ/שַּׂקִּ֔ים מְשָׁרְתֵ֖י אֱלֹהָ֑/י כִּ֥י נִמְנַ֛ע מִ/בֵּ֥ית אֱלֹהֵי/כֶ֖ם מִנְחָ֥ה וָ/נָֽסֶךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/013.yaml
  text: Gird yourselves and mourn[a], O priests; wail, you ministers of the altar. Come, spend the night in sackcloth, you ministers of my God[b], because grain offering and drink offering are withheld from the house of your God.
translation:
  language: hi
  text: हे याजको, कमर बाँधो[a] और विलाप करो; हे वेदी-सेवको, हाहाकार करो। मेरे परमेश्वर के सेवको, आओ, टाट पहनकर रात बिताओ, क्योंकि तुम्हारे परमेश्वर के भवन[b] से अन्नबलि और पेयबलि रोक दी गई हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में शाब्दिक अर्थ, “कमर बाँधो।” यहाँ शोक के संदर्भ में इसका आशय शोक-वस्त्र धारण करने से है।
    reason: lexical_alternative
  - marker: b
    text: या, “तुम्हारे परमेश्वर के मंदिर से।” हिब्रू में शाब्दिक रूप से, “तुम्हारे परमेश्वर के भवन से।”
    reason: lexical_alternative
lexical_decisions:
- source_word: חִגְרוּ
  choice: कमर बाँधो
  rationale: हिब्रू क्रिया का मूल अर्थ ‘कमर बाँधना’ है। आगे टाट का स्पष्ट उल्लेख होने के कारण उसे यहाँ पहले से जोड़ने के बजाय मूल बिंब बनाए रखा गया है।
- source_word: וְסִפְדוּ
  choice: और विलाप करो
  rationale: यह क्रिया शोक के सार्वजनिक और अनुष्ठानिक प्रकटीकरण को व्यक्त करती है; ‘विलाप करो’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से गंभीर है।
- source_word: הֵילִילוּ
  choice: हाहाकार करो
  rationale: यह पहले प्रयुक्त शोक-क्रिया से अधिक तीव्र पुकार को व्यक्त करती है; ‘हाहाकार करो’ उस बढ़ी हुई तीव्रता को बनाए रखता है।
- source_word: מְשָׁרְתֵי מִזְבֵּחַ
  choice: वेदी की सेवा करनेवालो
  rationale: यह वेदी से जुड़ी याजकीय सेवा का वर्णन करता है। यह रूप साधारण पाठकों के लिए ‘सेवकों’ या तकनीकी ‘परिचारकों’ से अधिक स्पष्ट है।
- source_word: לִינוּ בַשַּׂקִּים
  choice: टाट ओढ़े रात बिताओ
  rationale: לִינוּ का अर्थ रात भर ठहरना है और בַשַּׂקִּים शोक-वस्त्र को दर्शाता है। ‘टाट ओढ़े’ हिन्दी में उस शोक-वेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מְשָׁרְתֵי אֱלֹהָי
  choice: मेरे परमेश्वर की सेवा करनेवालो
  rationale: प्रथम पुरुष ‘मेरे’ को सुरक्षित रखा गया है और याजकों की उपासना-संबंधी सेवा स्पष्ट की गई है।
- source_word: נִמְנַע
  choice: रोक दिए गए हैं
  rationale: निफ़अल रूप निष्क्रिय अर्थ देता है कि चढ़ावे अब परमेश्वर के भवन में उपलब्ध या प्रस्तुत नहीं हो रहे। बहुवचन संयुक्त कर्ता के अनुसार हिन्दी रूप रखा गया है।
- source_word: מִנְחָה וָנָסֶךְ
  choice: अन्नबलि और अर्घ्य
  rationale: מִנְחָה यहाँ अनाज से चढ़ाई जानेवाली भेंट है और נֶסֶךְ उंडेली जानेवाली पेय-भेंट। ‘अन्नबलि’ और ‘अर्घ्य’ संक्षिप्त, प्रतिष्ठित तथा उपासना-संदर्भ में बोधगम्य हैं।
- source_word: מִבֵּית אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर के भवन से
  rationale: ‘भवन’ हिब्रू בַּיִת के रूपक को बनाए रखता है; संदर्भ में इससे मंदिर समझा जाता है, पर अनुवाद उसे व्याख्यात्मक रूप से प्रतिस्थापित नहीं करता।
theological_decisions:
- issue: אֱלֹהָי और אֱלֹהֵיכֶם के सर्वनामों का अंतर
  choice: ‘मेरे परमेश्वर’ और ‘तुम्हारे परमेश्वर’ दोनों को ज्यों का त्यों बनाए रखना
  alternative: दोनों को ‘हमारे परमेश्वर’ कर देना
  rationale: मूल पाठ पहले नबी के प्रथम पुरुष और फिर याजकों को संबोधित द्वितीय पुरुष का प्रयोग करता है। इस परिवर्तन को समतल करना मूल वक्तृता और संभावित अर्थ-तनाव को मिटा देगा।
- issue: חִגְרוּ में टाट को निहित मानना
  choice: मूल बिंब ‘कमर बाँधो’ रखना और टाट का उल्लेख केवल वहाँ करना जहाँ वह स्पष्ट है
  alternative: पहली आज्ञा में ही ‘टाट पहन लो’ कहना
  rationale: शोक-संदर्भ टाट का संकेत दे सकता है, किंतु חִגְרוּ स्वयं केवल ‘कमर बाँधो’ कहता है और בַשַּׂקִּים बाद में स्पष्ट आता है। इस प्रकार अनुवाद वास्तविक संकेत को मिटाए बिना शब्दगत अंतर बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गंभीर, काव्यात्मक और सार्वजनिक आह्वान वाला लहजा रखा गया है। ‘हे याजको’, ‘विलाप’, ‘हाहाकार’, ‘टाट’, ‘अन्नबलि’ और ‘अर्घ्य’ जैसे शब्द धार्मिक संदर्भ के अनुरूप हैं, पर वाक्यरचना साधारण आधुनिक पाठक के लिए सीधी रखी गई है।
