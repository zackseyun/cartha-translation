base_translation:
  language: en
  yaml_path: translation/ot/joel/001/008.yaml
  text: Wail like a virgin clothed in sackcloth for the husband of her youth[a][b].
translation:
  language: hi
  text: टाट पहने उस कुँवारी की तरह विलाप कर, जो अपने यौवन के पति[a] के लिए विलाप करती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘पति’ का अर्थ ‘मंगेतर’ भी समझा जा सकता है, क्योंकि यह काव्यात्मक छवि संक्षिप्त है। ‘टाट पहने’ का शाब्दिक भाव ‘टाट से कमर बाँधे हुए’ है।
    reason: alternative_reading; lexical_alternative
lexical_decisions:
- source_word: אֱלִי
  choice: विलाप कर
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप ऊँचे स्वर में शोक प्रकट करने को कहता है। हिंदी में ‘विलाप कर’ भविष्यद्वाणी की गरिमा और शोक की तीव्रता दोनों व्यक्त करता है।
- source_word: כִּבְתוּלָה
  choice: जैसे ... कुँवारी
  rationale: כְּ तुलना सूचित करता है और בְּתוּלָה का सामान्य अर्थ ‘कुँवारी’ है। काव्यात्मक तनाव बनाए रखने के लिए इसे ‘युवती’ कहकर नरम नहीं किया गया।
- source_word: חֲגֻרַת שַׂק
  choice: टाट ओढ़े हुई
  rationale: शाब्दिक भाव ‘टाट से कमर बाँधे हुई’ है। ‘टाट ओढ़े हुई’ आधुनिक हिंदी में स्वाभाविक ढंग से शोक-वस्त्र धारण करने की अवस्था व्यक्त करता है।
- source_word: שַׂק
  choice: टाट
  rationale: यह शोक में पहने जाने वाले खुरदरे कपड़े को दर्शाता है; हिंदी बाइबलीय प्रयोग में ‘टाट’ संक्षिप्त और परिचित समतुल्य है।
- source_word: עַל
  choice: के लिए
  rationale: शोक-संदर्भ में यह उस व्यक्ति को सूचित करता है जिसके कारण या जिसके लिए विलाप किया जाता है।
- source_word: בַּעַל
  choice: पति
  rationale: इस संबंधपरक प्रयोग में शब्द वैवाहिक साथी को दर्शाता है। ‘मंगेतर’ एक संभव व्याख्या है, पर मूल शब्द के तनाव को मुख्य पाठ में ‘पति’ बेहतर बनाए रखता है।
- source_word: נְעוּרֶיהָ
  choice: अपने यौवन के
  rationale: यह संबंधसूचक रचना ‘उसके यौवन का पति’ अर्थात आरंभिक जीवन में उससे बँधा साथी व्यक्त करती है।
theological_decisions:
- issue: ‘कुँवारी’ और ‘अपने यौवन के पति’ वाली शोक-छवि का अर्थ
  choice: मूल इब्रानी की संक्षिप्त काव्यात्मक छवि और उसका तनाव बनाए रखा गया है।
  alternative: בַּעַל का अनुवाद ‘मंगेतर’ करना, अथवा पूरी पंक्ति को अपने वर के लिए शोक करती युवती के रूप में स्पष्ट करना।
  rationale: मूल पाठ आधुनिक वैवाहिक श्रेणियों को स्पष्ट नहीं करता। संभव है कि चित्र एक वाग्दत्त युवती का हो, किंतु अनुवाद में इसे निश्चित कर देना मूल की वास्तविक अस्पष्टता को मिटा देगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। स्त्रीलिंग आज्ञा को संदर्भानुसार ‘कर’ से व्यक्त किया गया है। ‘टाट ओढ़े हुई’ स्वाभाविक हिंदी है, जबकि अधिक शाब्दिक विकल्प ‘टाट से कमर बाँधे हुई’ होता।
