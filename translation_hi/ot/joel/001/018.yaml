id: JOL.1.18
reference: Joel 1:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַה נֶּאֶנְחָ֣ה בְהֵמָ֗ה נָבֹ֨כוּ֙ עֶדְרֵ֣י בָקָ֔ר כִּ֛י אֵ֥ין מִרְעֶ֖ה לָ/הֶ֑ם גַּם עֶדְרֵ֥י הַ/צֹּ֖אן נֶאְשָֽׁמוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/018.yaml
  text: How the animals groan! The herds of cattle wander in confusion[a], because there is no pasture for them[b]; even the flocks of sheep suffer.
translation:
  language: hi
  text: पशु कैसे कराह रहे हैं! गाय-बैलों के झुंड भ्रमित हैं[a], क्योंकि उनके लिए कोई चरागाह नहीं है; भेड़-बकरियों के झुंड भी दुःख झेल रहे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उलझन में हैं” अथवा “व्याकुल हैं।”
    reason: lexical_alternative
  - marker: b
    text: हिब्रानी क्रिया में “दोषी ठहराए जाने” या “दोष का फल भोगने” की न्यायिक अर्थछाया हो सकती है; यहाँ आशय सम्भवतः यह है कि भेड़-बकरियाँ इस विनाश के परिणाम झेल रही हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה נֶּאֶנְחָה
  choice: कैसे कराह रहे हैं!
  rationale: מַה यहाँ प्रश्नवाचक नहीं, विस्मय और विलाप प्रकट करने वाला अव्यय है; נאנח सुनाई देने वाली पीड़ा की कराह व्यक्त करता है।
- source_word: בְהֵמָה
  choice: पशु
  rationale: यह सामूहिक एकवचन है और पालतू पशुओं को व्यापक रूप से दर्शाता है; आगे गाय-बैलों का अलग उल्लेख होने के कारण यहाँ केवल 'मवेशी' कहना बहुत संकीर्ण होगा।
- source_word: נָבֹכוּ
  choice: उलझन में भटक रहे हैं
  rationale: क्रिया भ्रमित या दिशाहीन होने का भाव रखती है; चरागाह के अभाव के संदर्भ में यह अनुवाद मानसिक उलझन और इधर-उधर भटकने, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֶדְרֵי בָקָר
  choice: गाय-बैलों के झुंड
  rationale: בקר गोवंश के पशुओं का सामूहिक पद है; 'गाय-बैल' आधुनिक हिन्दी में दोनों लिंगों को समेटते हुए स्पष्ट और सहज है।
- source_word: כִּי אֵין מִרְעֶה לָהֶם
  choice: क्योंकि उनके लिए कोई चरागाह नहीं है
  rationale: כִּי का कारणसूचक बल और מִרְעֶה का चरने की जगह/चरागाह वाला अर्थ सीधे सुरक्षित रहता है।
- source_word: עֶדְרֵי הַצֹּאן
  choice: भेड़-बकरियों के झुंड
  rationale: צאן छोटे पालतू पशुओं, विशेषकर भेड़ और बकरियों, का सामूहिक शब्द है; हिन्दी में संयुक्त पद इसका विस्तार ठीक से बताता है।
- source_word: נֶאְשָׁמוּ
  choice: दुःख झेल रहे हैं
  rationale: אשם से बना यह रूप दोष, दंडनीयता या उसके परिणाम भुगतने का न्यायिक संकेत रख सकता है। निर्जीव/पशु-संदर्भ में 'दुःख झेल रहे हैं' पशुओं पर नैतिक दोष आरोपित किए बिना विपत्ति के परिणाम का भाव देता है; पादटिप्पणी मूल की कठिनता सुरक्षित रखती है।
theological_decisions:
- issue: נֶאְשָׁמוּ में पशुओं की पीड़ा और न्यायिक/दोष-संबंधी अर्थछाया
  choice: मुख्य पाठ में 'दुःख झेल रहे हैं', साथ में न्यायिक अर्थछाया की पादटिप्पणी
  alternative: '''दोषी ठहराए गए हैं'', ''दोष का फल भोग रहे हैं'', या ''उजड़ गए हैं'''
  rationale: मूल क्रिया में दोष या दायित्व की अर्थछाया हो सकती है, पर पशुओं को सीधे नैतिक रूप से दोषी कहना संदर्भ से अधिक निर्णायक होगा। तटस्थ मुख्य पाठ और स्पष्ट पादटिप्पणी अर्थगत तथा धर्मवैचारिक तनाव दोनों को बनाए रखते हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज विलाप-शैली रखी गई है। 'गाय-बैल' और 'भेड़-बकरियाँ' सामान्य पाठक के लिए सामूहिक पशु-श्रेणियाँ स्पष्ट करते हैं। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
