base_translation:
  language: en
  yaml_path: translation/ot/joel/001/002.yaml
  text: 'Hear this[a], you elders, and give ear, all inhabitants of the land: Has this happened in your days[b], or in the days of your fathers?'
translation:
  language: hi
  text: हे बुज़ुर्गो, यह सुनो; और हे देश[a] के सभी निवासियो, ध्यान दो! क्या यह तुम्हारे दिनों में, या तुम्हारे पुरखाओं[b] के दिनों में, हुआ है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देश’ का अनुवाद ‘पृथ्वी’ भी हो सकता है। हिब्रू शब्द के दोनों अर्थ होते हैं, पर यहाँ तत्कालीन सन्दर्भ में ‘देश’ अधिक उपयुक्त है।
    reason: lexical_alternative
  - marker: b
    text: ‘पुरखाओं’ का अनुवाद ‘पूर्वजों’ भी हो सकता है। मूल हिब्रू का शाब्दिक अर्थ ‘तुम्हारे पिताओं’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁמְעוּ זֹאת
  choice: यह सुनो
  rationale: बहुवचन आज्ञार्थक और उसके प्रत्यक्ष कर्म को संक्षिप्त, स्वाभाविक हिन्दी में रखा गया है।
- source_word: הַזְּקֵנִים
  choice: हे पुरनियो
  rationale: यह सम्बोधन है। ‘पुरनिये’ आयु में बड़े लोगों और समुदाय के वरिष्ठ जनों—दोनों की सम्भावना बनाए रखता है।
- source_word: וְהַאֲזִינוּ
  choice: और ... ध्यान दो
  rationale: האזין को पहले שׁמע से अलग रखा गया है; ‘ध्यान दो’ ध्यानपूर्वक सुनने की अधिक बलपूर्ण आज्ञा व्यक्त करता है।
- source_word: כֹּל יוֹשְׁבֵי הָאָרֶץ
  choice: हे देश के सब निवासियो
  rationale: सन्दर्भ में אֶרֶץ का स्थानीय अर्थ ‘देश’ अधिक उपयुक्त है; सम्बोधन-रूप और सामूहिक अर्थ सुरक्षित हैं।
- source_word: הֶהָיְתָה זֹּאת
  choice: क्या ऐसी बात ... हुई थी?
  rationale: हिब्रू का आशय ऐसी घटना के घटित होने से है। हिन्दी में ‘ऐसी बात हुई थी’ स्वाभाविक है और पूर्ववर्ती ‘यह’ की ओर संकेत बनाए रखता है।
- source_word: בִּימֵיכֶם
  choice: तुम्हारे दिनों में
  rationale: हिब्रू काल-सूचक मुहावरे को स्पष्ट और सहज हिन्दी में निकटता से रखा गया है।
- source_word: וְאִם
  choice: या
  rationale: प्रश्न में यह दूसरे विकल्प को प्रस्तुत करता है; यहाँ शर्तसूचक ‘यदि’ स्वाभाविक नहीं होगा।
- source_word: בִּימֵי אֲבֹתֵיכֶם
  choice: तुम्हारे पुरखाओं के दिनों में
  rationale: ‘पुरखा’ अतीत की पुरुष पूर्वज-पीढ़ियों का स्वाभाविक हिन्दी बोध देता है और पीढ़ीगत तुलना को बनाए रखता है।
theological_decisions:
- issue: הָאָרֶץ का विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: योएल के तात्कालिक भविष्यद्वाणी-सन्दर्भ में स्थानीय/राष्ट्रीय अर्थ अधिक उपयुक्त है, यद्यपि हिब्रू शब्द व्यापक रूप से ‘पृथ्वी’ भी कह सकता है; इसलिए विकल्प पादटिप्पणी में सुरक्षित है।
- issue: אֲבֹתֵיכֶם का अनुवाद
  choice: तुम्हारे पुरखा
  alternative: तुम्हारे पूर्वज
  rationale: हिब्रू में ‘पिता’ का पुल्लिंग बहुवचन है, पर इस वंशगत प्रयोग में हिन्दी ‘पुरखा’ मूल की पुरुष-पूर्वज छवि और स्वाभाविकता दोनों बनाए रखता है।
