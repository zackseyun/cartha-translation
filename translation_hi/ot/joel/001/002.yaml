  register: आधुनिक, गरिमापूर्ण और श्रवणीय हिन्दी। समानान्तर आज्ञाओं में ‘सुनो’ और ‘ध्यान दो’ का भेद रखा गया है। ‘हे’ सम्बोधन को स्पष्ट करता है; ‘पुरनियो/निवासियो’ काव्यात्मक भविष्यद्वाणी की सार्वजनिक पुकार को स्वाभाविक हिन्दी में बनाए रखते हैं।
