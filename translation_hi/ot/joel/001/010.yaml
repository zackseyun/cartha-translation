id: JOL.1.10
reference: Joel 1:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שֻׁדַּ֣ד שָׂדֶ֔ה אָבְלָ֖ה אֲדָמָ֑ה כִּ֚י שֻׁדַּ֣ד דָּגָ֔ן הוֹבִ֥ישׁ תִּיר֖וֹשׁ אֻמְלַ֥ל יִצְהָֽר׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/010.yaml
  text: The field is devastated; the ground mourns[a], for the grain is devastated, the new wine has dried up, the oil has failed.
translation:
  language: hi
  text: 'खेत उजड़ गया है; भूमि शोक मना रही है,

    क्योंकि अनाज नष्ट हो गया है,

    नया दाखमधु सूख गया है,

    और तेल चुक गया है।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘ताज़ा तेल मुरझा गया है’ अथवा ‘जैतून का तेल समाप्त हो गया है।’ इब्रानी शब्द ताज़े तेल—सामान्यतः जैतून के तेल—के लिए है और ‘अनाज, नया दाखमधु और तेल’ वाली मुख्य कृषि-उपजों की त्रयी का भाग है।
    reason: יִצְהָר और אֻמְלַל के संयुक्त अर्थ में ‘ताज़ा/जैतून का तेल’ तथा ‘मुरझाना/विफल होना’ जैसे शाब्दिक विकल्पों को सुरक्षित रखना।
lexical_decisions:
- source_word: שֻׁדַּד (שׁדד)
  choice: उजड़ गया है / नष्ट हो गया है
  rationale: निष्क्रिय रूप हिंसक बरबादी या पूरी तरह उजड़ जाने का भाव देता है। खेत के लिए ‘उजड़ गया’ स्वाभाविक है, जबकि अनाज के लिए ‘नष्ट हो गया’ वही गंभीरता सहज हिन्दी में व्यक्त करता है।
- source_word: שָׂדֶה
  choice: खेत
  rationale: मूल एकवचन को बनाए रखते हुए सामान्य कृषि-क्षेत्र का अर्थ व्यक्त करता है।
- source_word: אָבְלָה (אבל)
  choice: शोक मना रही है
  rationale: भूमि के मानवीकरण और काव्यात्मक चित्र को सुरक्षित रखता है; इसे केवल ‘सूख गई’ कहना मूल की शोक-संबंधी भाषा खो देगा।
- source_word: אֲדָמָה
  choice: भूमि
  rationale: इसे ‘खेत’ से अलग रखता है और गरिमापूर्ण, स्वाभाविक हिन्दी में personified ground/soil को व्यक्त करता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: भूमि के शोक का कारण स्पष्ट रूप से प्रस्तुत करता है।
- source_word: דָּגָן
  choice: अनाज
  rationale: सामान्य रूप से अन्नवर्गीय कृषि-उपज का बोध कराता है, किसी एक फसल तक अर्थ को सीमित नहीं करता।
- source_word: הוֹבִישׁ (יבש)
  choice: सूख गया है
  rationale: कृषि-संदर्भ में सूख जाने का परिणामी भाव है; ‘लज्जित हुआ’ यहाँ प्रसंगानुकूल नहीं है।
- source_word: תִּירוֹשׁ
  choice: नया दाखमधु
  rationale: ताज़ा उत्पादित wine/must का अर्थ रखता है। ‘दाखमधु’ आधुनिक हिन्दी बाइबलीय शैली में समझने योग्य है और ‘नया’ ताजगी को सुरक्षित रखता है।
- source_word: אֻמְלַל (אמלל)
  choice: चुक गया है
  rationale: मूल क्रिया के मुरझाने, क्षीण होने या विफल हो जाने के भाव को तेल के संदर्भ में स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יִצְהָר
  choice: तेल
  rationale: यह ताज़े तेल, सामान्यतः जैतून के तेल, को सूचित करता है। मुख्य पाठ में ‘तेल’ सहज है; अधिक विशिष्ट lexical information पादटिप्पणी में दी गई है।
