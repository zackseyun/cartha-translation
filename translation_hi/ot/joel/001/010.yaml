  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और काव्यात्मक शैली अपनाई गई है। ‘भूमि शोक मना रही है’ में मूल का मानवीकरण रखा गया है। पंक्ति-विन्यास इब्रानी पद के समानांतर कृषि-विनाश को उभारता है।
