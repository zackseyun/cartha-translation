source:
  edition: WLC
  text: אֵלֶ֥י/ךָ יְהוָ֖ה אֶקְרָ֑א כִּ֣י אֵ֗שׁ אָֽכְלָה֙ נְא֣וֹת מִדְבָּ֔ר וְ/לֶ֣הָבָ֔ה לִהֲטָ֖ה כָּל עֲצֵ֥י הַ/שָּׂדֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/019.yaml
  text: To you[a], O Yahweh, I call, for fire has devoured the pastures of the wilderness[c][b], and flame has scorched all the trees of the field.
translation:
  language: hi
  text: हे याहवे[a], मैं आपको पुकारता हूँ, क्योंकि आग ने निर्जन प्रदेश के चरागाहों[b] को भस्म कर दिया है, और ज्वाला ने मैदान के सारे पेड़ों को झुलसा दिया है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का नाम YHWH है; इसका लिप्यंतरण ‘याहवे’ किया गया है। परंपरागत अनुवादों में ‘यहोवा’ या ‘प्रभु’ भी मिलता है।
    reason: alternative_reading
  - marker: b
    text: या ‘चरने के स्थानों’।
    reason: lexical_alternative
  - marker: c
    text: या ‘जला दिया है’।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֵלֶיךָ
  choice: आपको
  rationale: אֶל के साथ द्वितीय पुरुष एकवचन प्रत्यय उस व्यक्ति की ओर संकेत करता है जिसे पुकारा जा रहा है। परमेश्वर से सीधे संबोधन में आदरसूचक ‘आपको’ सहज और गरिमापूर्ण आधुनिक हिन्दी है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֶקְרָא
  choice: मैं ... पुकारता हूँ
  rationale: קרא का क़ाल अपूर्ण, प्रथम पुरुष एकवचन रूप प्रार्थना और विलाप के संदर्भ में पुकारने को व्यक्त करता है।
- source_word: אֵשׁ אָכְלָה
  choice: आग ने ... भस्म कर दिया है
  rationale: אכל का मूल अर्थ ‘खा जाना’ है और आग के लिए यह विनाशकारी रूप से निगल जाने का सजीव रूपक है। हिन्दी में ‘भस्म कर दिया’ उसी परिणाम को स्वाभाविक और प्रभावशाली ढंग से व्यक्त करता है।
- source_word: נְאוֹת מִדְבָּר
  choice: निर्जन प्रदेश की चराइयों
  rationale: נְאוֹת यहाँ पशुओं की चराई के स्थान हैं, जबकि מִדְבָּר बस्ती से बाहर के खुले, कम आबाद भूभाग को दर्शाता है। ‘निर्जन प्रदेश’ आधुनिक हिन्दी में ‘जंगल’ की वृक्षाच्छादित भूमि वाली संभावित गलत धारणा से बचाता है।
- source_word: וְלֶהָבָה
  choice: और ज्वाला
  rationale: यह पिछले अग्नि-बिंब के समानांतर विनाशकारी लपट को व्यक्त करता है; हिन्दी काव्यात्मक गद्य में बिना अनिश्चित लेख के यह स्वाभाविक है।
- source_word: לִהֲטָה
  choice: झुलसा दिया है
  rationale: להט प्रचंड ताप से जलने या झुलसाने का भाव देता है। यह पहले खंड के ‘भस्म कर दिया’ से भेद रखते हुए समानांतरता बनाए रखता है।
- source_word: כָּל עֲצֵי הַשָּׂדֶה
  choice: मैदान के सारे पेड़ों
  rationale: כָּל के साथ बहुवचन का अर्थ ‘सारे पेड़’ है। הַשָּׂדֶה खुली या कृषि-भूमि को दर्शाता है, जिसके लिए ‘मैदान’ स्पष्ट और स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चतुरक्षरीय व्यक्तिगत नाम יְהוָה सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता है; ‘यहोवा’ बाद की मिश्रित उच्चारण-परंपरा को दर्शाता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, प्रार्थनापूर्ण और गरिमापूर्ण रखी गई है। परमेश्वर के लिए आदरसूचक ‘आप’ का प्रयोग किया गया है। ‘निर्जन प्रदेश’ מִדְבָּר के खुले, कम आबाद चरागाही भूभाग को व्यक्त करता है और आधुनिक हिन्दी के ‘जंगल’ से उत्पन्न वृक्षाच्छादित वन की अनावश्यक धारणा से बचता है।
