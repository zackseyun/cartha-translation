base_translation:
  language: en
  yaml_path: translation/ot/joel/001/006.yaml
  text: For a nation has come up against my land[a], mighty and without number; its teeth are the teeth of a lion[b], and it has the fangs of a lioness.
translation:
  language: hi
  text: क्योंकि एक राष्ट्र मेरी भूमि के विरुद्ध चढ़ आया है[a]—वह बलवान और असंख्य है। उसके दाँत सिंह के दाँत जैसे हैं, और उसके चीरने वाले दाँत सिंह के दाँत जैसे हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लोग-समूह।’ इब्रानी शब्द גוֹי का शाब्दिक अर्थ ‘राष्ट्र’ या ‘लोग-समूह’ है। यहाँ यह आक्रमणकारी टिड्डियों की विपत्ति को राष्ट्र के रूप में चित्रित करता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘सिंहनी के दाँत जैसे,’ अथवा ‘एक शक्तिशाली/परिपक्व सिंह के दाँत जैसे।’ इब्रानी शब्द לָבִיא का सटीक प्राणी-वाचक और लिंगगत अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले आह्वान और विलाप का कारण बताता है; इसलिए कारणसूचक अर्थ बनाए रखा गया है।
- source_word: גוֹי
  choice: जाति
  rationale: मूल शब्द का अर्थ ‘जाति/लोग’ है और यहाँ हमलावर टिड्डी-दल को सेना-सदृश जाति के रूप में चित्रित करता है। ‘जाति’ इस रूपक को बनाए रखती है।
- source_word: עָלָה עַל
  choice: पर चढ़ आई है
  rationale: यह इब्रानी मुहावरे के ऊपर चढ़ आने और शत्रुतापूर्ण आक्रमण, दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אַרְצִי
  choice: मेरी भूमि
  rationale: प्रथम पुरुष एकवचन प्रत्यय स्पष्ट है; ‘भूमि’ क्षेत्रीय और वाचा-संबंधी भाषा को सुरक्षित रखती है।
- source_word: עָצוּם
  choice: शक्तिशाली
  rationale: हमलावर की प्रबल और भयावह सामर्थ्य को आधुनिक, गरिमापूर्ण हिन्दी में व्यक्त करता है।
- source_word: וְאֵין מִסְפָּר
  choice: असंख्य
  rationale: शाब्दिक ‘जिसकी कोई गिनती नहीं’ का संक्षिप्त और स्वाभाविक हिन्दी समतुल्य है।
- source_word: שִׁנָּיו שִׁנֵּי אַרְיֵה
  choice: उसके दाँत सिंह के दाँत जैसे हैं
  rationale: सामूहिक, व्याकरणतः एकवचन ‘जाति’ को ‘उसके’ से संदर्भित करते हुए सिंह-सदृश दाँतों की काव्यात्मक तुलना स्पष्ट रखी गई है।
- source_word: מְתַלְּעוֹת
  choice: जबड़े के दाँत
  rationale: यह विरल शब्द चीरने वाले जबड़े के दाँतों को सूचित करता है। ‘नुकीले दाँत’ की अपेक्षा यह मूल शारीरिक बिंब के अधिक निकट है।
- source_word: לָבִיא
  choice: बलवान सिंह
  rationale: शब्द शक्तिशाली परिपक्व सिंह को सूचित कर सकता है; हिन्दी में ‘बलवान सिंह’ बल और परिपक्वता का भाव देता है, जबकि लिंग-संबंधी अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: לוֹ
  choice: उसके ... हैं
  rationale: לְ + प्रत्यय का स्वामित्वसूचक अर्थ स्वाभाविक हिन्दी वाक्यरचना में व्यक्त किया गया है।
theological_decisions:
- issue: हमलावर ‘जाति’ की रूपकात्मक पहचान
  choice: मुख्य पाठ में ‘जाति’ रखकर सैन्य रूपक को कायम रखा गया है।
  alternative: इसे स्पष्ट रूप से ‘टिड्डियों का दल’ या ‘टिड्डी-जाति’ कहना।
  rationale: मूल पाठ גוי कहता है; निकटवर्ती प्रसंग टिड्डियों की विपत्ति की ओर संकेत करता है, पर यहाँ उसे सीधे मुख्य पाठ में जोड़ना भविष्यद्वक्ता के रूपक को व्याख्या में बदल देता।
- issue: לָבִיא का प्राणी-वाचक अर्थ
  choice: ‘बलवान सिंह’
  alternative: ‘सिंहनी’ या केवल ‘सिंह’
  rationale: शब्द का ठीक प्राणी-वाचक और लिंगगत सूक्ष्म अर्थ विवादित है। मुख्य पाठ शक्ति के भाव को रखता है और पादटिप्पणी वास्तविक विकल्प बताती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, भविष्यद्वाणी के अनुरूप गरिमापूर्ण और सजीव रखी गई है। ‘चढ़ आई है’ और सिंह के दाँतों का बिंब मूल की सैन्य तथा भक्षक छवि बनाए रखते हैं; विरल शब्द מְתַלְּעוֹת के लिए अपेक्षाकृत औपचारिक पर स्पष्ट ‘जबड़े के दाँत’ चुना गया है।
