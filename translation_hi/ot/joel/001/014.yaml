source:
  edition: WLC
  text: קַדְּשׁוּ צוֹם֙ קִרְא֣וּ עֲצָרָ֔ה אִסְפ֣וּ זְקֵנִ֗ים כֹּ֚ל יֹשְׁבֵ֣י הָ/אָ֔רֶץ בֵּ֖ית יְהוָ֣ה אֱלֹהֵי/כֶ֑ם וְ/זַעֲק֖וּ אֶל יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/014.yaml
  text: Consecrate a fast; call a solemn assembly. Gather the elders[a], all the inhabitants of the land, to the house of Yahweh your God, and cry out to Yahweh.
translation:
  language: hi
  text: उपवास को पवित्र ठहराओ; एक गंभीर सभा बुलाओ। बुज़ुर्गों और देश[a] के सभी निवासियों को तुम्हारे परमेश्वर याहवे के भवन में इकट्ठा करो, और याहवे को दुहाई दो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पृथ्वी के सभी निवासियों।” इब्रानी शब्द का अर्थ “देश” या “पृथ्वी” दोनों हो सकता है; यहाँ मंदिर-केंद्रित बुलाहट के प्रसंग में स्थानीय अर्थ अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: קַדְּשׁוּ צוֹם
  choice: उपवास को पवित्र ठहराओ
  rationale: קדשׁ का आदेश उपवास को पवित्र उद्देश्य के लिए विधिवत अलग ठहराने का भाव रखता है। यह अनुवाद धार्मिक बल को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: קִרְאוּ עֲצָרָה
  choice: एक गंभीर सभा बुलाओ
  rationale: עֲצָרָה उपासना के लिए बुलाई गई विशेष और गंभीर सामुदायिक सभा को दर्शाता है। ‘गंभीर सभा’ प्रसंग की धार्मिक गंभीरता व्यक्त करती है।
- source_word: אִסְפוּ זְקֵנִים
  choice: पुरनियों ... को इकट्ठा करो
  rationale: זקנים यहाँ केवल वृद्ध पुरुषों के बजाय समुदाय के मान्य अगुओं को सूचित करता है; ‘पुरनिये’ बाइबलीय सामाजिक भूमिका को संक्षेप में व्यक्त करता है।
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: देश के सभी निवासियों
  rationale: הָאָרֶץ का अर्थ ‘देश’ या ‘पृथ्वी’ हो सकता है। मंदिर-केंद्रित स्थानीय बुलाहट के प्रसंग में ‘देश’ अधिक संभावित है, जबकि वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: בֵּית יְהוָה אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर याहवे के भवन में
  rationale: इकट्ठा करने की आज्ञा से गंतव्य निहित है, इसलिए हिन्दी में ‘में’ स्वाभाविक है। ‘भवन’ मंदिर को सूचित करता है और יְהוָה को व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: וְזַעֲקוּ אֶל יְהוָה
  choice: और याहवे की दोहाई दो
  rationale: זעק संकट और विनती में की गई तीव्र पुकार है। ‘दोहाई दो’ साधारण ‘पुकारो’ की अपेक्षा इसकी तात्कालिकता और व्याकुलता को बेहतर व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरीय व्यक्तिगत नाम है। ‘याहवे’ उसका निकट हिन्दी लिप्यंतरण है और नाम को उपाधि से प्रतिस्थापित नहीं करता।
- issue: הָאָרֶץ का क्षेत्र
  choice: देश
  alternative: पृथ्वी
  rationale: यहूदा के लोगों को याहवे के भवन में एकत्र करने का तत्काल प्रसंग स्थानीय अर्थ का समर्थन करता है; फिर भी शब्द का व्यापक अर्थ वास्तविक है और पादटिप्पणी में सुरक्षित रखा गया है।
- issue: זְקֵנִים और כֹּל יֹשְׁבֵי הָאָרֶץ के बीच संबंध
  choice: पुरनियों और देश के सभी निवासियों
  alternative: पुरनियों को, अर्थात देश के सभी निवासियों को
  rationale: हिब्रू में दोनों पदों के बीच संयोजक नहीं है, पर आज्ञा की स्वाभाविक सूची में दोनों समूहों को एकत्र करने का अर्थ अधिक संभावित है। हिन्दी में ‘और’ जोड़कर संबंध स्पष्ट किया गया है, बिना पुरनियों को सभी निवासियों के समानार्थी ठहराए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के अनुकूल रखी गई है। छोटे आदेशात्मक वाक्य मूल की तात्कालिकता बनाए रखते हैं। ‘पुरनिये’, ‘गंभीर सभा’ और ‘दोहाई दो’ धार्मिक प्रसंग के अनुरूप हैं, फिर भी सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
