  yaml_path: translation/ot/joel/001/004.yaml
  text: What the cutting locust left[a], the swarming locust ate; and what the swarming locust left, the hopping locust ate; and what the hopping locust left, the devouring locust ate.
translation:
  language: hi
  text: कुतरने वाली टिड्डी ने जो छोड़ा था,[a] उसे झुंडों में चलने वाली टिड्डी खा गई; और झुंडों में चलने वाली टिड्डी ने जो छोड़ा था, उसे फुदकने वाली टिड्डी खा गई; और फुदकने वाली टिड्डी ने जो छोड़ा था, उसे चट कर खाने वाली टिड्डी खा गई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: चारों इब्रानी शब्द शायद टिड्डियों के अलग-अलग प्रकारों या अवस्थाओं को बताते हैं, पर उनके सटीक प्राणीवैज्ञानिक भेद निश्चित नहीं हैं। इनके संभावित अर्थ ‘कुतरने वाली,’ ‘झुंडों में चलने वाली,’ ‘फुदकने वाली,’ और ‘चट कर खाने वाली’ टिड्डियाँ हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: יֶתֶר
  choice: जो ... ने छोड़ा था
  rationale: यह संज्ञा ‘बचा हुआ भाग’ बताती है। दोहराई गई रचना में यह हिन्दी प्रयोग क्रमिक रूप से बचे अंश के खाए जाने का अर्थ स्वाभाविक ढंग से रखता है।
- source_word: גָּזָם
  choice: कुतरनेवाली टिड्डी
  rationale: यह किसी प्रकार की टिड्डी या वनस्पति काटकर खानेवाले कीट का नाम है। सटीक प्राणीवैज्ञानिक पहचान अनिश्चित होने के कारण कार्यसूचक नाम चुना गया है।
- source_word: אָכַל
  choice: खा गई
  rationale: पूर्ण हुई क्रिया और विनाश के क्रम को सरल हिन्दी में व्यक्त करता है तथा इब्रानी की पुनरावृत्ति बनाए रखता है।
- source_word: אַרְבֶּה
  choice: झुंडवाली टिड्डी
  rationale: यह टिड्डी का सामान्य शब्द है, जिसका संबंध प्रायः झुंड से होता है। यहाँ विशेषण चारों पदों को हिन्दी में अलग पहचान देता है।
- source_word: יָּלֶק / יֶּלֶק
  choice: फुदकनेवाली टिड्डी
  rationale: यह टिड्डी के किसी अन्य प्रकार या अवस्था का संकेत देता है, पर उसका ठीक भेद अनिश्चित है। यह अनुवाद पठनीय भेद देता है, बिना झूठी वैज्ञानिक निश्चितता के।
- source_word: חָסִיל
  choice: चट कर जानेवाली टिड्डी
  rationale: यह पूरी तरह खा डालने या उजाड़नेवाले कीट का बोध कराता है। चुना हुआ मुहावरा विनाशकारी तीव्रता को सहज आधुनिक हिन्दी में रखता है।
- source_word: וְ
  choice: और
  rationale: दोहराया गया संयोजक संचयी क्रम और मूल का लयात्मक प्रभाव बनाए रखता है।
