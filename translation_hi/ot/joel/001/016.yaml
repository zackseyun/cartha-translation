id: JOL.1.16
reference: Joel 1:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הֲ/ל֛וֹא נֶ֥גֶד עֵינֵ֖י/נוּ אֹ֣כֶל נִכְרָ֑ת מִ/בֵּ֥ית אֱלֹהֵ֖י/נוּ שִׂמְחָ֥ה וָ/גִֽיל׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/001/016.yaml
  text: Is not food cut off before our eyes[b][a], joy and gladness from the house of our God?
translation:
  language: hi
  text: क्या हमारी आँखों के सामने ही भोजन छिन नहीं गया, और हमारे परमेश्वर के भवन[a] से आनन्द और उल्लास[b] भी?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हमारे परमेश्वर के मन्दिर से।’ इब्रानी में शाब्दिक रूप से ‘हमारे परमेश्वर के घर से’ है।
    reason: lexical_alternative
  - marker: b
    text: या ‘हर्षोल्लास।’ यह दूसरा शब्द उमंग से भरे, प्रकट आनन्द का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הֲלוֹא
  choice: क्या ... नहीं
  rationale: यह सहमति की अपेक्षा रखने वाले आलंकारिक प्रश्न को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: נֶגֶד עֵינֵינוּ
  choice: हमारी आँखों के सामने ही
  rationale: यह खुले रूप से और प्रत्यक्षतः घट रही विपत्ति की सजीवता व्यक्त करता है; ‘ही’ प्रत्यक्ष अनुभव पर बल देता है।
- source_word: אֹכֶל
  choice: भोजन
  rationale: यह सामान्य खाद्य-सामग्री का व्यापक अर्थ देता है, केवल रोटी का नहीं।
- source_word: נִכְרָת
  choice: छिन गया
  rationale: इब्रानी ‘काट दिया गया/अलग कर दिया गया’ की हानि और वंचित हो जाने की ठोस धारणा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מִבֵּית אֱלֹהֵינוּ
  choice: हमारे परमेश्वर के भवन से
  rationale: यह इब्रानी के शाब्दिक ‘हमारे परमेश्वर के घर/भवन से’ को सुरक्षित रखता है, जबकि सन्दर्भ में मन्दिर अभिप्रेत है।
- source_word: שִׂמְחָה
  choice: आनन्द
  rationale: यह सामान्य हर्ष या प्रसन्नता को संक्षेप और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וָגִיל
  choice: और उल्लास
  rationale: यह पहले शब्द के निकटार्थी होते हुए भी अधिक उमंगपूर्ण आनन्द का भाव बनाए रखता है।
theological_decisions:
- issue: आलंकारिक प्रश्न का वाक्यगत विस्तार और दो समन्वित हानियाँ
  choice: प्रश्न को भोजन तथा परमेश्वर के भवन के आनन्द और उल्लास—दोनों की हानि पर लागू किया गया है; दूसरे खंड में क्रिया अध्याहृत रखी गई है।
  alternative: केवल भोजन के छिन जाने को प्रश्न मानना और आनन्द-उल्लास की हानि को उसका परिणाम अथवा समानाधिकरण मानना।
  rationale: इब्रानी काव्य में दूसरे समानांतर खंड से दोहराई जाने वाली क्रिया का लोप सामान्य है। हिन्दी में ‘भी’ इस समानांतरता को स्पष्ट करता है, पर मूल की संक्षिप्त काव्यात्मक संरचना और तनाव को बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, विलापपरक और सहज काव्यात्मक रूप अपनाया गया है। दूसरे खंड में क्रिया का लोप मूल इब्रानी समानांतरता के अनुरूप जानबूझकर रखा गया है।
