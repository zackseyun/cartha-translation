source:
  edition: WLC
  text: וְ/הָיָ֗ה כֹּ֧ל אֲשֶׁר יִקְרָ֛א בְּ/שֵׁ֥ם יְהוָ֖ה יִמָּלֵ֑ט כִּ֠י בְּ/הַר צִיּ֨וֹן וּ/בִ/ירוּשָׁלִַ֜ם תִּֽהְיֶ֣ה פְלֵיטָ֗ה כַּֽ/אֲשֶׁר֙ אָמַ֣ר יְהוָ֔ה וּ/בַ֨/שְּׂרִידִ֔ים אֲשֶׁ֥ר יְהוָ֖ה קֹרֵֽא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/005.yaml
  text: And it will happen that everyone who calls on the name of Yahweh will be delivered[a]; for on Mount Zion and in Jerusalem there will be escape, as Yahweh has said[c][b], among the survivors whom Yahweh calls.
translation:
  language: hi
  text: और ऐसा होगा कि जो कोई याहवे का नाम पुकारेगा, वह बच निकलेगा[a]; क्योंकि सिय्योन पर्वत पर और यरूशलेम में बच निकलनेवाले होंगे[b], जैसा याहवे ने कहा है, और बचे हुओं में वे लोग होंगे जिन्हें याहवे बुलाता है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह छुड़ाया जाएगा।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द פְלֵיטָה का अर्थ “बच निकलना,” “छुटकारा,” अथवा “बच निकले हुए लोग” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: इस पद में मनुष्यों का याहवे का नाम पुकारना और याहवे का बचे हुओं को बुलाना—दोनों साथ रखे गए हैं।
    reason: theological_tension
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य में होनेवाले परिणाम का परिचय स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में देता है।
- source_word: כֹּל אֲשֶׁר
  choice: जो कोई
  rationale: यह व्यक्तिवाचक और व्यापक अर्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: יִקְרָא בְּשֵׁם יְהוָה
  choice: याहवे का नाम पुकारेगा
  rationale: यह इब्रानी मुहावरे में निहित याहवे से प्रार्थनापूर्वक सहायता माँगने या उसका आह्वान करने का भाव बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत इब्रानी नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में प्रस्तुत किया गया है।
- source_word: יִמָּלֵט
  choice: बच निकलेगा
  rationale: मלט के निफ़अल रूप का मूल भाव संकट या न्याय से बच निकलना है; यह चयन बाद की व्यवस्थित धर्मवैज्ञानिक शब्दावली को आरोपित नहीं करता।
- source_word: בְּהַר צִיּוֹן וּבִירוּשָׁלִַם
  choice: सिय्योन पर्वत पर और यरूशलेम में
  rationale: दोनों स्थानों और उनके साथ स्वाभाविक हिन्दी परसर्गों को स्पष्ट रूप से बनाए रखा गया है।
- source_word: תִּהְיֶה פְלֵיטָה
  choice: बच निकलनेवाले होंगे
  rationale: פְלֵיטָה बच निकलने, छुटकारे, या बच निकले लोगों को सूचित कर सकता है। निकटवर्ती 'बचे हुओं' के साथ ठोस व्यक्तिवाचक अर्थ स्वाभाविक बैठता है, जबकि पादटिप्पणी अन्य सम्भावनाएँ सुरक्षित रखती है।
- source_word: כַּאֲשֶׁר אָמַר יְהוָה
  choice: जैसा याहवे ने कहा है
  rationale: पूर्ण क्रिया को पहले कही गई और अब भी प्रभावी घोषणा के रूप में सहज हिन्दी में व्यक्त किया गया है।
- source_word: וּבַשְּׂרִידִים
  choice: और बचे हुओं में
  rationale: यह שׂרידים के जीवित बचे लोगों या शेष बचे समुदाय के अर्थ को सामान्य पाठक के लिए स्पष्ट रखता है।
- source_word: אֲשֶׁר יְהוָה קֹרֵא
  choice: जिन्हें याहवे बुलाता है
  rationale: वर्तमानकालीन अभिव्यक्ति इब्रानी कृदन्त की चालू या लाक्षणिक क्रिया को दर्शाती है और मनुष्यों के याहवे को पुकारने तथा याहवे के उन्हें बुलाने की शब्दगत प्रतिध्वनि बनाए रखती है।
theological_decisions:
- issue: मनुष्य के याहवे का नाम पुकारने और याहवे द्वारा बचे हुओं को बुलाने का सम्बन्ध
  choice: दोनों कथनों को बिना किसी व्यवस्थित धर्मवैज्ञानिक समाधान के साथ रखा गया है।
  alternative: अन्तिम खण्ड को पहले वचन पर कठोर सीमा मानना, या उसे केवल गैर-सीमित पुनर्वर्णन मानना।
  rationale: इब्रानी पाठ सार्वभौमिक निमंत्रण और याहवे की बुलाहट—दोनों को साथ रखता है; अनुवाद उसी तनाव को सुरक्षित रखता है।
- issue: פְלֵיטָה का अर्थ
  choice: मुख्य पाठ में ठोस रूप से 'बच निकलनेवाले होंगे'।
  alternative: '''छुटकारा होगा'' या ''बचाव होगा''।'
  rationale: संज्ञा बच निकलने की घटना, छुटकारे, अथवा बचे हुए लोगों का बोध करा सकती है। अगला खण्ड बचे हुओं की बात करता है, इसलिए व्यक्तिवाचक प्रस्तुति प्रसंगानुकूल है; अन्य अर्थ पादटिप्पणी में दिए गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। 'याहवे' नाम को लिप्यंतरित किया गया है; अत्यधिक संस्कृतनिष्ठ या सम्प्रदाय-विशिष्ट शब्दावली से बचा गया है।
