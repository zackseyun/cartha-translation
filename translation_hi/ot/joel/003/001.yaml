reference: Joel 3:1
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הָיָ֣ה אַֽחֲרֵי כֵ֗ן אֶשְׁפּ֤וֹךְ אֶת רוּחִ/י֙ עַל כָּל בָּשָׂ֔ר וְ/נִבְּא֖וּ בְּנֵי/כֶ֣ם וּ/בְנֽוֹתֵי/כֶ֑ם זִקְנֵי/כֶם֙ חֲלֹמ֣וֹת יַחֲלֹמ֔וּ/ן בַּח֣וּרֵי/כֶ֔ם חֶזְיֹנ֖וֹת יִרְאֽוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/001.yaml
  text: And it will happen afterward that I will pour out my Spirit on all flesh[a]; and your sons and your daughters will prophesy, your old men will dream dreams[b], your young men will see visions.
translation:
  language: hi
  text: और इसके बाद ऐसा होगा कि मैं अपना आत्मा सब मनुष्यों पर[a] उण्डेलूँगा। तुम्हारे बेटे और तुम्हारी बेटियाँ भविष्यवाणी करेंगे; तुम्हारे वृद्ध पुरुष स्वप्न देखेंगे और तुम्हारे जवान पुरुष दर्शन देखेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “सब मांस पर”; अर्थात् “सब मनुष्यों पर” या “सब लोगों पर।”'
    reason: मूल हिब्रू मुहावरे को दिखाता है और उसके व्यापक मानवीय दायरे का वैकल्पिक निरूपण देता है।
lexical_decisions:
- source_word: וְהָיָה
  choice: और ऐसा होगा
  rationale: यह भविष्य में होने वाली घटना का सूत्रात्मक परिचय है; यह रूप आधुनिक और स्वाभाविक हिन्दी में उसके भविष्यसूचक बल को बनाए रखता है।
- source_word: אַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह पद समय के क्रम को सूचित करता है और बिना अनावश्यक विशिष्टता के मूल अर्थ देता है।
- source_word: אֶשְׁפּוֹךְ
  choice: मैं ... उण्डेलूँगा
  rationale: मूल क्रिया के ठोस 'उण्डेलने' वाले रूपक को परिभाषात्मक भाषा में बदलने के बजाय सुरक्षित रखा गया है।
- source_word: רוּחִי
  choice: अपना आत्मा
  rationale: भविष्यवाणी, स्वप्न और दर्शनों के प्रसंग में इसका संदर्भ परमेश्वर के आत्मा से है। हिन्दी में 'आत्मा' व्याकरणतः पुल्लिंग है, इसलिए 'अपना' रखा गया है।
- source_word: עַל כָּל בָּשָׂר
  choice: सब प्राणियों पर
  rationale: शाब्दिक अर्थ 'सब मांस पर' है, पर आधुनिक हिन्दी में वह अस्वाभाविक और भ्रामक हो सकता है। 'सब प्राणियों' से देहधारी मनुष्यों का व्यापक सामूहिक संकेत मिलता है और दायरा अनावश्यक रूप से किसी एक वर्ग तक सीमित नहीं होता।
- source_word: וְנִבְּאוּ
  choice: भविष्यवाणी करेंगे
  rationale: निफ़अल रूप यहाँ प्रेरित भविष्यसूचक वाणी को व्यक्त करता है; हिन्दी में यह प्रचलित और स्पष्ट अभिव्यक्ति है।
- source_word: בְּנֵיכֶם וּבְנוֹתֵיכֶם
  choice: तुम्हारे बेटे और तुम्हारी बेटियाँ
  rationale: मूल पाठ पुरुष और स्त्री दोनों संतानों का स्पष्ट उल्लेख करता है; दोनों को अलग-अलग बनाए रखा गया है।
- source_word: זִקְנֵיכֶם
  choice: तुम्हारे बूढ़े पुरुष
  rationale: अगले खंड के 'जवान' के साथ विरोध उम्र का है, पद या नेतृत्व का नहीं। 'पुरुष' जोड़ने से पुरुषवाचक संदर्भ स्पष्ट रहता है।
- source_word: חֲלֹמוֹת יַחֲלֹמוּן
  choice: स्वप्न देखेंगे
  rationale: हिब्रू में सजातीय कर्म से बल दिया गया है। हिन्दी में 'स्वप्न देखेंगे' स्वाभाविक है; 'स्वप्नों का स्वप्न देखेंगे' कृत्रिम होता।
- source_word: בַּחוּרֵיכֶם
  choice: तुम्हारे जवान
  rationale: यह बूढ़े पुरुषों के समानांतर युवा पुरुषों को दर्शाता है; आधुनिक हिन्दी में 'जवान' संक्षिप्त और स्वाभाविक है।
- source_word: חֶזְיֹנוֹת יִרְאוּ
  choice: दर्शन देखेंगे
  rationale: यह भविष्यसूचक अनुभव की मानक अभिव्यक्ति है और मूल की 'देखने' वाली क्रिया को बनाए रखती है।
theological_decisions:
- issue: भविष्यसूचक उण्डेले जाने के प्रसंग में רוּחִי का अर्थ
  choice: अपना आत्मा
  alternative: अपनी आत्मा / अपनी जीवन-शक्ति
  rationale: परमेश्वर के उण्डेलने के फलस्वरूप भविष्यवाणी, स्वप्न और दर्शन होने के कारण यहाँ परमेश्वर का आत्मा सर्वाधिक संभावित संदर्भ है। मूल हिब्रू में बड़े-छोटे अक्षरों का भेद नहीं है, इसलिए हिन्दी वर्तनी से उससे अधिक अर्थ आरोपित नहीं किया गया।
- issue: כָּל בָּשָׂר का दायरा
  choice: सब प्राणियों
  alternative: सब मनुष्यों / सब लोगों / सब मांसधारियों
  rationale: वाक्यांश का शाब्दिक रूप 'सब मांस' है। चुना हुआ रूप उसके व्यापक देहधारी मानवीय संकेत को स्वाभाविक हिन्दी में रखता है, जबकि यह प्रश्न खुला छोड़ता है कि बल समस्त मानवता पर है या संबोधित समुदाय के हर प्रकार के व्यक्ति पर।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सहज और सार्वजनिक पाठ के योग्य रूप अपनाया गया है। भविष्यसूचक समानांतरता बनाए रखी गई है; अत्यधिक संस्कृतनिष्ठ या पुरातन क्रियारूपों से बचा गया है।
