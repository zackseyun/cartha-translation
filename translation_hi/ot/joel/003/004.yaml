id: JOL.3.4
reference: Joel 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הַ/שֶּׁ֨מֶשׁ֙ יֵהָפֵ֣ךְ לְ/חֹ֔שֶׁךְ וְ/הַ/יָּרֵ֖חַ לְ/דָ֑ם לִ/פְנֵ֗י בּ֚וֹא י֣וֹם יְהוָ֔ה הַ/גָּד֖וֹל וְ/הַ/נּוֹרָֽא׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/004.yaml
  text: The sun will be turned to darkness[a], and the moon to blood[c][b], before the coming of the great and fearful day of Yahweh.
translation:
  language: hi
  text: सूर्य अंधकार में बदल जाएगा, और चाँद लहू में बदल जाएगा[a]—इससे पहले कि याहवे[b] का महान और भयावह[c] दिन आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शब्दशः, “लहू में”; आशय “लहू जैसा लाल” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “याहवे” हिब्रू ईश्वरीय नाम YHWH का लिप्यंतरण है; कई अनुवाद यहाँ “प्रभु” लिखते हैं।
    reason: alternative_reading
  - marker: c
    text: या, “विस्मयकारी”; हिब्रू शब्द भय और विस्मय उत्पन्न करनेवाले दिन का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַשֶּׁמֶשׁ
  choice: सूर्य
  rationale: निश्चित संज्ञा खगोलीय पिंड को दर्शाती है; आधुनिक मानक हिन्दी में ‘सूर्य’ स्वाभाविक और गरिमापूर्ण है।
- source_word: יֵהָפֵךְ
  choice: बदल जाएगा
  rationale: הפך का निफ़ाल अपूर्ण रूप किसी परिणामी परिवर्तन को व्यक्त करता है। हिन्दी में ‘बदल जाएगा’ इस अर्थ को स्वाभाविक ढंग से देता है; दोनों खंडों में क्रिया दोहराने से अर्थ स्पष्ट रहता है।
- source_word: לְחֹשֶׁךְ
  choice: अंधकार में
  rationale: לְ यहाँ परिणामी अवस्था बताता है; ‘अंधकार में’ परिवर्तन की छवि को बनाए रखता है।
- source_word: וְהַיָּרֵחַ
  choice: और चाँद
  rationale: निश्चित संज्ञा चंद्रमा को दर्शाती है। ‘चाँद’ सामान्य आधुनिक हिन्दी में सहज है और काव्यात्मक भविष्यवाणी के अनुकूल भी है।
- source_word: לְדָם
  choice: लहू में
  rationale: हिब्रू में शब्दशः ‘लहू में’ है। ‘लहू’ तीखी भविष्यसूचक छवि को बनाए रखता है और इसे व्याख्यात्मक रूप से केवल ‘लहू जैसा लाल’ नहीं बनाता।
- source_word: לִפְנֵי בּוֹא
  choice: इससे पहले कि … आए
  rationale: यह पदबंध समयगत पूर्वता व्यक्त करता है। हिन्दी में उपवाक्यात्मक रचना मूल अर्थ को स्वाभाविक रूप में व्यक्त करती है।
- source_word: יוֹם יְהוָה
  choice: याहवे का … दिन
  rationale: भविष्यद्वाणी में यह स्थापित अभिव्यक्ति है; संबंधकारक रचना हिन्दी में स्वाभाविक है और יְהוָה को व्यक्तिगत नाम के रूप में रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: टेट्राग्राम YHWH को उपाधि से बदलने के बजाय उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण दिया गया है।
- source_word: הַגָּדוֹל
  choice: महान
  rationale: यह विशेषण दिन के महत्व और व्यापकता को व्यक्त करता है, बिना अतिरिक्त व्याख्या जोड़े।
- source_word: וְהַנּוֹרָא
  choice: और भयावह
  rationale: यह शब्द भय और विस्मय उत्पन्न करने का भाव रखता है। ‘भयावह’ न्याय-संबंधी गंभीरता को स्पष्ट करता है, जबकि केवल सकारात्मक अर्थ वाले आधुनिक ‘अद्भुत’ से बचता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु; यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम YHWH का प्रयोग करता है। ‘याहवे’ उस नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है; पाठक-सहायता के लिए विकल्प पादटिप्पणी में बताए गए हैं।
- issue: ब्रह्मांडीय चिह्नों की प्रकृति
  choice: मुख्य पाठ में ‘चाँद लहू में बदल जाएगा’ की मूल भविष्यसूचक छवि बनाए रखना
  alternative: चाँद लहू जैसा लाल हो जाएगा
  rationale: मूल कथन यह तय नहीं करता कि वर्णन शाब्दिक खगोलीय परिवर्तन है, दृश्य समानता है, या प्रतीकात्मक प्रलयात्मक भाषा। इसलिए मुख्य पाठ तनाव और अस्पष्टता को बनाए रखता है।
- issue: הַנּוֹרָא का भाव
  choice: भयावह
  alternative: विस्मयकारी; भयंकर
  rationale: शब्द भय और विस्मय दोनों जगा सकता है। ‘भयावह’ आने वाले दिन की गंभीरता रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर भविष्यसूचक काव्य की गरिमा और तीव्रता बनाए रखी गई है। ‘चाँद’ सामान्य पाठक के लिए ‘चंद्रमा’ से अधिक सहज है; ‘लहू’ इस प्रसंग की गंभीर, चित्रात्मक शैली के अनुकूल है। विराम-चिह्न समयसूचक अंतिम खंड को स्पष्ट करता है।
