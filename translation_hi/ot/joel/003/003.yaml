base_translation:
  language: en
  yaml_path: translation/ot/joel/003/003.yaml
  text: 'And I will give wonders in the heavens and on the earth: blood and fire and columns of smoke[a].'
translation:
  language: hi
  text: 'और मैं आकाश में और पृथ्वी पर अद्भुत चिन्ह दिखाऊँगा: लहू, आग और धुएँ के स्तंभ[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “धुएँ के खंभे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתִּי
  choice: और मैं ... दिखाऊँगा
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर מוֹפְתִים के साथ हिन्दी में ‘अद्भुत चिन्ह दिखाऊँगा’ स्वाभाविक है और प्रकट किए जाने का भाव स्पष्ट करता है।
- source_word: מוֹפְתִים
  choice: अद्भुत चिन्ह
  rationale: מוֹפְתִים असाधारण चिन्हों अथवा चमत्कारपूर्ण संकेतों को दर्शाता है। ‘अद्भुत चिन्ह’ विस्मय और संकेत—दोनों पक्षों को सहज हिन्दी में बनाए रखता है।
- source_word: בַּשָּׁמַיִם
  choice: आकाश में
  rationale: हिब्रू बहुवचन रूप व्यापक ऊपरी क्षेत्र को सूचित करता है; आधुनिक हिन्दी में ‘आकाश में’ इसका स्वाभाविक और पर्याप्त समतुल्य है।
- source_word: וּבָאָרֶץ
  choice: और पृथ्वी पर
  rationale: आकाश के विपरीत ब्रह्मांडीय जोड़ी के रूप में אֶרֶץ के लिए ‘पृथ्वी’ उपयुक्त है; हिन्दी में घटनाओं के स्थान हेतु ‘पर’ स्वाभाविक है।
- source_word: דָּם
  choice: लहू
  rationale: शब्द का सीधा अर्थ रक्त है। ‘लहू’ काव्यात्मक-भविष्यद्वाणी के गरिमापूर्ण संदर्भ में सहज और स्पष्ट है।
- source_word: וָאֵשׁ
  choice: आग
  rationale: यह אֵשׁ का सीधा और सामान्य हिन्दी समतुल्य है।
- source_word: וְתִימֲרוֹת עָשָׁן
  choice: और धुएँ के स्तंभ
  rationale: תִימֲרוֹת ऊपर उठती हुई स्तंभाकार राशियों का चित्र प्रस्तुत करता है। ‘धुएँ के स्तंभ’ इस दृश्य बिंब को स्पष्ट और संक्षिप्त रूप में बनाए रखता है।
theological_decisions:
- issue: वर्णित घटनाओं का स्वरूप
  choice: ईश्वरीय हस्तक्षेप अथवा न्याय के विस्मयकारी आकाशीय और पार्थिव चिन्ह, बिना किसी संकीर्ण अंतकालीन योजना को निर्धारित किए
  alternative: इन्हें केवल शाब्दिक प्राकृतिक घटनाएँ या केवल प्रतीकात्मक उथल-पुथल मानना
  rationale: पद स्वयं इस बात का निर्णय नहीं करता कि प्रत्येक बिंब शाब्दिक है, प्रतीकात्मक है, या दोनों। अनुवाद मूल चित्रों और उनकी गंभीरता को बिना अतिरिक्त व्याख्या के सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और भविष्यद्वाणी के काव्यात्मक स्वर के अनुकूल रखी गई है। ‘अद्भुत चिन्ह’ מוֹפְתִים के संकेत और विस्मय दोनों को व्यक्त करता है; पादटिप्पणी वैकल्पिक दृश्यात्मक शब्दावली सुरक्षित रखती है।
