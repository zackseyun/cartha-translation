  edition: WLC
  text: וְ/גַ֥ם עַל הָֽ/עֲבָדִ֖ים וְ/עַל הַ/שְּׁפָח֑וֹת בַּ/יָּמִ֣ים הָ/הֵ֔מָּה אֶשְׁפּ֖וֹךְ אֶת רוּחִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/003/002.yaml
  text: And even on the male servants and on the female servants[a], in those days I will pour out my Spirit.
translation:
  language: hi
  text: और उन दिनों में मैं दासों पर और दासियों पर भी अपना आत्मा उँडेलूँगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְגַם
  choice: और...भी
  rationale: संयोजक और बलसूचक अर्थ दोनों को स्वाभाविक हिन्दी में व्यक्त करता है तथा इस प्रतिज्ञा को पिछले कथन से जोड़ता है।
- source_word: עַל הָעֲבָדִים
  choice: दासों पर
  rationale: עֶבֶד यहाँ सेवाधीन अथवा बँधी सामाजिक स्थिति वाले पुरुषों को सूचित करता है; ‘दास’ इस यथार्थ को ‘सेवक’ से अधिक स्पष्ट रखता है।
- source_word: וְעַל הַשְּׁפָחוֹת
  choice: और दासियों पर
  rationale: שִׁפְחָה स्त्री दास अथवा सेवाधीन स्त्री को दर्शाता है; ‘दासियाँ’ लिंग और सामाजिक स्थिति दोनों को संक्षेप में सुरक्षित रखता है।
- source_word: בַּיָּמִים הָהֵמָּה
  choice: उन दिनों
  rationale: यह भविष्यसूचक समय-सूचक वाक्यांश का सहज और निकट हिन्दी रूप है।
- source_word: אֶשְׁפּוֹךְ
  choice: मैं...उँडेलूँगा
  rationale: שפך के उँडेलने के रूपक को बनाए रखता है और प्रचुर दान का भाव व्यक्त करता है।
- source_word: אֶת רוּחִי
  choice: अपना आत्मा
  rationale: वक्ता परमेश्वर है और संदर्भ उसके अपने आत्मा के लोगों पर उँडेले जाने का है; ‘अपना’ हिन्दी में कर्ता से संबंध स्वाभाविक रूप से दिखाता है।
theological_decisions:
- issue: עֲבָדִים / שְׁפָחוֹת की सामाजिक स्थिति
  choice: दासों और दासियों
  alternative: सेवकों और सेविकाओं
  rationale: इस जोड़ी में बँधी और अधीन सामाजिक स्थिति प्रमुख है। ‘दासों और दासियों’ भविष्यवाणी में सामाजिक तथा लैंगिक सीमाओं से परे आत्मा के उँडेले जाने की तीव्रता को सुरक्षित रखता है।
- issue: רוּחִי का अभिप्राय
  choice: अपना आत्मा
  alternative: अपनी आत्मा / अपनी वायु
  rationale: संदर्भ परमेश्वर द्वारा अपने आत्मा को मनुष्यों पर उँडेलने की बात करता है। हिन्दी बाइबलीय प्रयोग में परमेश्वर के आत्मा के लिए पुल्लिंग ‘आत्मा’ स्वाभाविक है; अनावश्यक व्याख्या जोड़े बिना दिव्य संदर्भ स्पष्ट रहता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण और मौखिक रूप से सहज वाक्य। स्रोत का समानांतर ढाँचा, सामाजिक यथार्थ और ‘उँडेलने’ का रूपक सुरक्षित रखा गया है।
