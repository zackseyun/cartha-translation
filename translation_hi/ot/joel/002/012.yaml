source:
  edition: WLC
  text: וְ/גַם עַתָּה֙ נְאֻם יְהוָ֔ה שֻׁ֥בוּ עָדַ֖/י בְּ/כָל לְבַבְ/כֶ֑ם וּ/בְ/צ֥וֹם וּ/בְ/בְכִ֖י וּ/בְ/מִסְפֵּֽד־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/012.yaml
  text: “Yet even now,” declares Yahweh[a], “return to me with all your heart, and with fasting, and with weeping, and with mourning.”
translation:
  language: hi
  text: “फिर भी, अब भी,” याहवे[a] की यह वाणी है, “अपने पूरे मन से मेरे पास लौट आओ—उपवास, रोने और विलाप के साथ।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम YHWH है, जिसे यहाँ ‘याहवे’ लिखा गया है।
    reason: divine_name
lexical_decisions:
- source_word: וְגַם עַתָּה
  choice: फिर भी, अब भी
  rationale: यह पद न्याय की पूर्ववर्ती घोषणा के बीच अवसर की निरंतरता और आग्रह, दोनों व्यक्त करता है। यह हिन्दी अभिव्यक्ति संयोजक, रियायती और बलात्मक भाव को स्वाभाविक रूप से सामने लाती है।
- source_word: נְאֻם יְהוָה
  choice: यहोवा की यह वाणी है
  rationale: यह गंभीर भविष्यद्वाणी-सूत्र को सुरक्षित रखता है और נְאֻם को केवल सामान्य बोलने वाले क्रियापद में नहीं बदलता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित लिप्यंतरण के द्वारा इब्रानी वाचा-नाम को उपाधि से प्रतिस्थापित किए बिना व्यक्त किया गया है।
- source_word: שֻׁבוּ עָדַי
  choice: मेरे पास लौट आओ
  rationale: שׁוב का मूल लौटने/फिरने का भाव तथा עָדַי द्वारा व्यक्त परमेश्वर की ओर संबंधपरक दिशा—दोनों सुरक्षित रहते हैं।
- source_word: בְּכָל לְבַבְכֶם
  choice: अपने पूरे मन से
  rationale: लेवाव यहाँ इच्छा, विचार और भावनाओं सहित भीतरी व्यक्ति की संपूर्णता दर्शाता है। आधुनिक हिन्दी में ‘पूरे मन से’ स्वाभाविक और व्यापक है।
- source_word: וּבְצוֹם וּבְבְכִי וּבְמִסְפֵּד
  choice: उपवास, रोने और विलाप के साथ
  rationale: तीनों प्रायश्चित्तसूचक बाहरी अभिव्यक्तियों को क्रम से रखा गया है। हिन्दी में अंतिम ‘और’ के साथ सूची स्वाभाविक है, जबकि ‘के साथ’ पूरे त्रिक पर लागू होता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में व्यक्तिगत वाचा-नाम है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में पहचाना जाने वाला लिप्यंतरण है और इसे केवल उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: שׁוב को ‘लौटना’ या ‘पश्चाताप करना’ कहना
  choice: मेरे पास लौट आओ
  alternative: मन फिराओ; पश्चाताप करो
  rationale: ‘लौटना’ मूल गति-रूपक और ‘मेरे पास’ की संबंधपरक दिशा को बनाए रखता है। वाचा-संदर्भ में पश्चाताप निहित है, पर उसे मुख्य पाठ में अधिक संकीर्ण धार्मिक पद बनाकर नहीं रखा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के लिए सहज रखी गई है। उद्धरण की भविष्यद्वाणी-संबंधी गंभीरता बनी रहती है; डैश आज्ञा और उसके साथ आने वाली प्रायश्चित्तसूचक अभिव्यक्तियों को स्पष्ट रूप से जोड़ता है।
