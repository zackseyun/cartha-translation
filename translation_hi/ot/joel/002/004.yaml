  yaml_path: translation/ot/joel/002/004.yaml
  text: Their appearance is like the appearance of horses[a], and like horsemen[b], so they run.
translation:
  language: hi
  text: उनका रूप घोड़ों के रूप जैसा है,[a] और वे घुड़सवारों के समान दौड़ते हैं।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका रूप घोड़ों के रूप जैसा है।” इब्रानी में एकवचन प्रत्यय है, पर उसका संदर्भ एक सामूहिक दल से है; इसलिए हिन्दी में “उनका रूप” किया गया है।
    reason: lexical_alternative
  - marker: b
    text: “घुड़सवारों” का अनुवाद “सवार सैनिकों” या “अश्वारोही सेना” भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַרְאֵה סוּסִים מַרְאֵהוּ
  choice: उनका रूप घोड़ों के रूप जैसा है
  rationale: מַרְאֶה दृश्य रूप या आकृति को दर्शाता है और इब्रानी में इसकी पुनरावृत्ति है। एकवचन प्रत्यय सामूहिक समूह की ओर संकेत करता है, इसलिए स्वाभाविक हिन्दी में बहुवचन 'उनका' रखा गया है।
- source_word: וּכְפָרָשִׁים
  choice: और वे घुड़सवारों के समान
  rationale: פָּרָשִׁים का अर्थ घुड़सवार या सवार सैनिक है। 'घुड़सवार' सैन्य उपमा और घोड़ों से समानांतरता दोनों बनाए रखता है।
- source_word: כֵּן יְרוּצוּן
  choice: दौड़ते हैं
  rationale: רוץ का मूल अर्थ 'दौड़ना' है। वाक्य-विन्यास को स्वाभाविक हिन्दी में समेटते हुए כֵּן की तुलनात्मक शक्ति 'के समान' में व्यक्त की गई है।
