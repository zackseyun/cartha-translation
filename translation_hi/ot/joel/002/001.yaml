source:
  edition: WLC
  text: תִּקְע֨וּ שׁוֹפָ֜ר בְּ/צִיּ֗וֹן וְ/הָרִ֨יעוּ֙ בְּ/הַ֣ר קָדְשִׁ֔/י יִרְגְּז֕וּ כֹּ֖ל יֹשְׁבֵ֣י הָ/אָ֑רֶץ כִּֽי בָ֥א יוֹם יְהוָ֖ה כִּ֥י קָרֽוֹב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/001.yaml
  text: Blow a horn in Zion[a], and sound an alarm on my holy mountain; let all the inhabitants of the land tremble, for the day of Yahweh is coming—indeed, it is near.
translation:
  language: hi
  text: सिय्योन में सींग फूँको और मेरे पवित्र पर्वत पर चेतावनी का नाद करो; देश[a] के सभी निवासी काँपें, क्योंकि याहवे का दिन आ रहा है—वह निकट है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘देश’ के स्थान पर ‘पृथ्वी’ भी संभव है; इब्रानी אֶרֶץ का अर्थ संदर्भ के अनुसार ‘देश’ या ‘पृथ्वी’ हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: תִּקְעוּ שׁוֹפָר
  choice: नरसिंगा फूँको
  rationale: शोफ़ार चेतावनी अथवा उपासना-संबंधी संकेत के लिए फूँका जाने वाला सींग था। ‘नरसिंगा’ आधुनिक हिन्दी में सींग से बने ऐसे वाद्य का स्वाभाविक और संक्षिप्त बोध कराता है; ‘तुरही’ धातु के वाद्य का आभास दे सकती है।
- source_word: בְּצִיּוֹן
  choice: सिय्योन में
  rationale: स्थानवाचक उपसर्ग בְּ का यहाँ स्वाभाविक हिन्दी रूप ‘में’ है।
- source_word: וְהָרִיעוּ
  choice: चेतावनी का नाद करो
  rationale: हिफ़ील आज्ञार्थक रूप ऊँची ध्वनि द्वारा सचेत करने को दर्शाता है। शोफ़ार के समानांतर और आसन्न संकट के प्रसंग में यह केवल सामान्य जयघोष या युद्धघोष से अधिक उपयुक्त है।
- source_word: בְּהַר קָדְשִׁי
  choice: मेरे पवित्र पर्वत पर
  rationale: ‘पर्वत’ के साथ स्थानवाचक בְּ का स्वाभाविक अनुवाद ‘पर’ है; प्रथम पुरुष प्रत्यय को ‘मेरे’ से स्पष्ट किया गया है।
- source_word: יִרְגְּזוּ
  choice: काँप उठें
  rationale: यह रूप भय से शारीरिक और भावात्मक रूप से काँपने का भाव रखता है। ‘उठें’ हिन्दी में इस प्रत्याशित प्रतिक्रिया की तीव्रता और आरम्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: כֹּל יֹשְׁבֵי הָאָרֶץ
  choice: देश के सभी निवासी
  rationale: सिय्योन और पवित्र पर्वत का तात्कालिक संदर्भ स्थानीय अर्थ ‘देश’ का समर्थन करता है। אֶרֶץ का व्यापक अर्थ ‘पृथ्वी’ भी संभव है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: כִּי בָא יוֹם יְהוָה
  choice: क्योंकि यहोवा का दिन आ रहा है
  rationale: בָא आसन्न आगमन को व्यक्त करता है। वाचा-संबंधी नाम יְהוָה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से दर्शाया गया है।
- source_word: כִּי קָרוֹב
  choice: वह निकट है
  rationale: दूसरा כִּי कारणात्मक या बलसूचक हो सकता है। पृथक वाक्यांश हिन्दी में आसन्नता पर जोर देता है, बिना संयोजक की सूक्ष्मता को अत्यधिक निश्चित किए।
theological_decisions:
- issue: הָאָרֶץ का विस्तार
  choice: देश
  alternative: पृथ्वी
  rationale: सिय्योन और पवित्र पर्वत तत्काल स्थानीय संदर्भ देते हैं, पर ‘यहोवा के दिन’ का व्यापक आयाम ‘पृथ्वी’ को भी संभव बनाता है। इसलिए मुख्य पाठ में ‘देश’ और पादटिप्पणी में दूसरा अर्थ रखा गया है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के विशिष्ट वाचा-नाम को सामान्य उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। ‘यहोवा’ हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाने वाला रूप है, जबकि मूल उच्चारण की पुनर्रचना सामान्यतः ‘याहवे’ मानी जाती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सार्वजनिक उद्घोषणा के अनुकूल हिन्दी। समानांतर आज्ञाओं तथा आसन्न संकट की तीव्रता को बनाए रखते हुए अनावश्यक सैन्य विशिष्टता से बचा गया है। पादटिप्पणी चिह्न संबंधित अर्थ ‘देश’ के तुरंत बाद न रखकर पद के अंत में दिया गया है, पर उसका विषय पादटिप्पणी में स्पष्ट है।
