source:
  edition: WLC
  text: וַ/אֲכַלְתֶּ֤ם אָכוֹל֙ וְ/שָׂב֔וֹעַ וְ/הִלַּלְתֶּ֗ם אֶת שֵׁ֤ם יְהוָה֙ אֱלֹ֣הֵי/כֶ֔ם אֲשֶׁר עָשָׂ֥ה עִמָּ/כֶ֖ם לְ/הַפְלִ֑יא וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/026.yaml
  text: You will surely eat and be satisfied[a], and you will praise the name of Yahweh your God, who has dealt wondrously with you[c][b]; and my people will never again be put to shame.
translation:
  language: hi
  text: तुम निश्चय ही खाओगे और तृप्त हो जाओगे[a]। तुम अपने परमेश्वर याहवे के नाम की स्तुति करोगे, जिसने तुम्हारे लिए अद्भुत काम किए हैं[b]; और मेरी प्रजा फिर कभी लज्जित न होगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम भरपूर खाओगे और तृप्त हो जाओगे।” इब्रानी में बल देने वाली रचना है, जिसका शब्दशः रूप “खाते हुए तुम खाओगे” है।
    reason: lexical_alternative
  - marker: b
    text: या, “जिसने तुम्हारे साथ अद्भुत रीति से व्यवहार किया है।”
    reason: lexical_alternative
  - marker: c
    text: शब्दशः, “और मेरी प्रजा सदा तक लज्जित न होगी।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲכַלְתֶּם אָכוֹל
  choice: तुम निश्चय ही खाओगे
  rationale: क्रिया के साथ infinitive absolute क्रिया पर बल देता है। ‘निश्चय ही खाओगे’ उस बल को बनाए रखता है, पर मूल में स्पष्ट न की गई भोजन की मात्रा को मुख्य पाठ में नहीं जोड़ता।
- source_word: וְשָׂבוֹעַ
  choice: और तृप्त हो जाओगे
  rationale: यह रूप खाकर भर जाने या संतुष्ट होने का परिणाम बताता है। ‘तृप्त हो जाओगे’ आधुनिक हिन्दी में स्वाभाविक और प्रसंगानुकूल है।
- source_word: וְהִלַּלְתֶּם
  choice: स्तुति करोगे
  rationale: यहाँ הלל का पिएल रूप प्रशंसा अथवा स्तुति करने के अर्थ में है; उपासना के प्रसंग में ‘स्तुति करोगे’ सीधा और स्वाभाविक अनुवाद है।
- source_word: שֵׁם יְהוָה אֱלֹהֵיכֶם
  choice: अपने परमेश्वर याहवे के नाम
  rationale: ‘नाम’ को बनाए रखा गया है, क्योंकि यह परमेश्वर की प्रकट पहचान और प्रतिष्ठा को व्यक्त करता है। יְהוָה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: אֲשֶׁר עָשָׂה עִמָּכֶם לְהַפְלִיא
  choice: जिसने तुम्हारे साथ अद्भुत रीति से काम किया है
  rationale: यह अनुवाद עִם के ‘साथ’ भाव और לְהַפְלִיא के अद्भुत ढंग से कार्य करने के भाव—दोनों को बनाए रखता है। ‘तुम्हारे लिए अद्भुत काम किए हैं’ अधिक मुहावरेदार विकल्प है, पर उसमें ‘साथ’ का संबंध कुछ कम स्पष्ट हो जाता है।
- source_word: וְלֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם
  choice: और मेरी प्रजा फिर कभी लज्जित न होगी
  rationale: בושׁ यहाँ अपमानित या निराश होकर लज्जा में पड़ने का भाव रखता है। לְעוֹלָם के स्थायी निषेध को हिन्दी में स्वाभाविक रूप से ‘फिर कभी ... न होगी’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसे उपाधि में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
- issue: לְעוֹלָם के साथ भविष्य की लज्जा का निषेध
  choice: मेरी प्रजा फिर कभी लज्जित न होगी
  alternative: मेरी प्रजा सदा तक लज्जित न होगी
  rationale: मूल का आशय भविष्य में लज्जा के स्थायी अंत का है। ‘फिर कभी’ पुनर्स्थापना के प्रसंग में स्वाभाविक हिन्दी है, जबकि पादटिप्पणी अधिक शब्दशः रूप को सुरक्षित रखती है।
- issue: עָשָׂה עִמָּכֶם לְהַפְלִיא में परमेश्वर के कार्य का संबंध
  choice: तुम्हारे साथ अद्भुत रीति से काम किया है
  alternative: तुम्हारे लिए अद्भुत काम किए हैं
  rationale: मुख्य पाठ עִם के संबंधसूचक ‘साथ’ को बनाए रखता है और यह तय नहीं करता कि बल केवल लाभ पर है या लोगों के बीच/साथ परमेश्वर के अद्भुत व्यवहार पर।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है—सरल, गरिमापूर्ण और सार्वजनिक पाठ के योग्य। ‘तृप्त’, ‘स्तुति’ और ‘लज्जित’ जैसे परिचित धार्मिक-साहित्यिक शब्द अर्थ की सटीकता रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
