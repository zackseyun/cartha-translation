source:
  edition: WLC
  text: וְ/שִׁלַּמְתִּ֤י לָ/כֶם֙ אֶת הַ/שָּׁנִ֔ים אֲשֶׁר֙ אָכַ֣ל הָֽ/אַרְבֶּ֔ה הַ/יֶּ֖לֶק וְ/הֶ/חָסִ֣יל וְ/הַ/גָּזָ֑ם חֵילִ/י֙ הַ/גָּד֔וֹל אֲשֶׁ֥ר שִׁלַּ֖חְתִּי בָּ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/025.yaml
  text: I will restore to you the years that the swarming locust has eaten—the hopper[a], the destroyer[b], and the cutter—my great army that I sent among you.
translation:
  language: hi
  text: मैं तुम्हें उन वर्षों की भरपाई कर दूँगा जिन्हें झुंड बनानेवाली टिड्डी, रेंगनेवाली टिड्डी, भक्षक टिड्डी और कुतरनेवाली टिड्डी[a] खा गई थीं—मेरी वह विशाल सेना, जिसे मैंने तुम्हारे बीच भेजा था।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इन चारों इब्रानी शब्दों से संभवतः टिड्डियों के अलग-अलग प्रकारों या उनकी अलग-अलग अवस्थाओं का संकेत मिलता है। इनके ठीक-ठीक प्राणिवैज्ञानिक भेद निश्चित नहीं हैं; अन्य अर्थों में ‘छोटी टिड्डी,’ ‘नाश करनेवाली’ और ‘काटनेवाली’ शामिल हैं।
    reason: lexical_alternative
  - marker: b
    text: या ‘जिसे मैंने तुम पर भेजा था’ अथवा ‘जिसे मैंने तुम्हारे विरुद्ध भेजा था।’ यहाँ प्रयुक्त इब्रानी पूर्वसर्ग के एक से अधिक अर्थ हो सकते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: וְשִׁלַּמְתִּי
  choice: मैं ... भरपाई कर दूँगा
  rationale: पिएल रूप यहाँ चुकाने, प्रतिपूर्ति करने या हुई हानि पूरी करने का भाव देता है। अकाल और फसल की हानि के संदर्भ में ‘भरपाई कर दूँगा’ स्वाभाविक हिन्दी में पुनः पूर्ण करने का आशय व्यक्त करता है।
- source_word: לָכֶם
  choice: तुम्हें
  rationale: ל प्रभावित प्राप्तकर्ताओं को चिह्नित करता है; ‘तुम्हें’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הַשָּׁנִים
  choice: उन वर्षों
  rationale: इब्रानी में सीधा कर्म अक्षरशः ‘वर्ष’ है। यह नष्ट हुई उपज के वर्षों के लिए लक्षणा है; ‘वर्षों’ को बनाए रखने से मूल की सजीव अभिव्यक्ति सुरक्षित रहती है।
- source_word: אֲשֶׁר אָכַל
  choice: जिन्हें ... खा गई थीं
  rationale: यह विनाश के पूर्ण हो चुके कार्य और उसके परिणाम को व्यक्त करता है। हिन्दी में टिड्डियों के सामूहिक उल्लेख के साथ यह वाक्यांश सहज है।
- source_word: הָאַרְבֶּה
  choice: झुंडवाली टिड्डी
  rationale: אַרְבֶּה टिड्डी का सामान्य शब्द है और इसमें झुंड बनाकर आने का भाव हो सकता है। यह अनुवाद अगले तीन अनिश्चित कीट-संज्ञाओं से इसे अलग रखता है।
- source_word: הַיֶּלֶק
  choice: रेंगनेवाली टिड्डी
  rationale: इसका सटीक प्राणिवैज्ञानिक अर्थ अनिश्चित है; संभवतः टिड्डी की कोई अवस्था या प्रकार है। ‘रेंगनेवाली टिड्डी’ भेद को बनाए रखता है, जबकि पादटिप्पणी अनिश्चितता स्पष्ट करती है।
- source_word: וְהֶחָסִיל
  choice: भक्षक टिड्डी
  rationale: חָסִיל में खा डालने या नष्ट करने का भाव है। ‘भक्षक टिड्डी’ उस विनाशकारी अर्थ को संक्षेप में व्यक्त करता है।
- source_word: וְהַגָּזָם
  choice: कुतरनेवाली टिड्डी
  rationale: גָּזָם को काटने या कुतरनेवाली टिड्डी समझा जाता है। यह रूप अर्थगत भेद रखता है, पर किसी निश्चित प्रजाति का असमर्थित दावा नहीं करता।
- source_word: חֵילִי הַגָּדוֹל
  choice: मेरी ... विशाल सेना
  rationale: חַיִל का अर्थ सेना या सैन्य बल हो सकता है। यहाँ टिड्डी-दल को युद्ध-संबंधी बिंब में परमेश्वर की सेना कहा गया है; ‘विशाल सेना’ इस रूपक को सुरक्षित रखता है।
- source_word: אֲשֶׁר שִׁלַּחְתִּי בָּכֶם
  choice: जिसे मैंने तुम्हारे बीच भेजा था
  rationale: בְּ का अर्थ यहाँ ‘बीच में’ हो सकता है, यद्यपि ‘विरुद्ध/पर’ का भाव भी संभव है। मुख्य पाठ में स्थानगत अर्थ रखा गया है और दूसरा अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: टिड्डियों के शब्द वास्तविक कीटों के नाम हैं या केवल किसी मानवीय सेना के प्रतीक
  choice: वास्तविक टिड्डी-विपत्ति, जिसका वर्णन सैन्य रूपक से किया गया है
  alternative: पूरी तरह रूपकात्मक मानवीय सेना
  rationale: पद चार टिड्डी-संबंधी संज्ञाएँ देता है और फिर उन्हें ‘मेरी विशाल सेना’ कहता है। अनुवाद वास्तविक कीटों और सैन्य बिंब—दोनों को बनाए रखता है, किसी एक को दूसरे में विलीन नहीं करता।
- issue: विपत्ति में परमेश्वर की सक्रिय भूमिका
  choice: परमेश्वर सीधे कहता है कि उसने उस सेना को भेजा था
  alternative: परमेश्वर ने केवल उसे होने दिया
  rationale: इब्रानी में प्रथम पुरुष क्रिया ‘मैंने भेजा’ स्पष्ट है। इसलिए मूल कथन को नरम करके केवल अनुमति का भाव नहीं दिया गया।
- issue: בָּכֶם में समुदाय के बीच प्रवेश या समुदाय के विरुद्ध दंड का भाव
  choice: मुख्य पाठ में ‘तुम्हारे बीच’
  alternative: ‘तुम पर’ या ‘तुम्हारे विरुद्ध’
  rationale: पूर्वसर्ग दोनों प्रकार से समझा जा सकता है। मुख्य पाठ न्यून व्याख्यात्मक स्थानगत अर्थ रखता है और संभावित दंडात्मक अर्थ को पादटिप्पणी में सुरक्षित करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उन वर्षों की भरपाई’ मूल की सजीव लक्षणा को बनाए रखता है। चारों कीट-संज्ञाओं को एक ही सामान्य शब्द में समतल करने के बजाय अलग रखा गया है, पर उनकी वैज्ञानिक पहचान के बारे में झूठी निश्चितता से बचने के लिए पादटिप्पणी दी गई है।
