id: JOL.2.21
reference: Joel 2:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אַל תִּֽירְאִ֖י אֲדָמָ֑ה גִּ֣ילִי וּ/שְׂמָ֔חִי כִּֽי הִגְדִּ֥יל יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/021.yaml
  text: Do not fear[a], O land; rejoice and be glad, for Yahweh has done great things.
translation:
  language: hi
  text: हे भूमि, मत डर; उल्लसित हो और आनन्द मना, क्योंकि याहवे ने महान काम किए हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का अनुवाद ‘महान रीति से काम किया है’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אַל תִּירְאִי
  choice: मत डर
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है। ‘मत डर’ आधुनिक हिन्दी में सीधा और स्वाभाविक संबोधन है।
- source_word: אֲדָמָה
  choice: हे भूमि
  rationale: यहाँ यहूदा की भूमि का मानवीकरण किया गया है। ‘भूमि’ कृषि-संदर्भ और क्षेत्र, दोनों को समेटती है; ‘धरती’ अधिक व्यापक और ‘मिट्टी’ अधिक संकीर्ण हो सकती है।
- source_word: גִּילִי
  choice: उल्लसित हो
  rationale: क्रिया प्रफुल्लित, विजयपूर्ण आनन्द को दर्शाती है। ‘उल्लसित हो’ अगली समानार्थी आज्ञा से भेद बनाए रखती है।
- source_word: וּשְׂמָחִי
  choice: और आनन्द मना
  rationale: दूसरी आज्ञा आनन्द की काव्यात्मक तीव्रता बढ़ाती है। इसे अलग अभिव्यक्ति देकर इब्रानी समानांतरता सुरक्षित रखी गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए आह्वान का कारण प्रस्तुत करता है।
- source_word: הִגְדִּיל ... לַעֲשׂוֹת
  choice: महान काम किए हैं
  rationale: इब्रानी मुहावरे का शाब्दिक भाव ‘करने में महान हुआ’ या ‘महान रीति से काम किया’ है। हिन्दी में ‘महान काम किए हैं’ अर्थ को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है; ‘याहवे’ उसे किसी उपाधि से बदलने के बजाय लिप्यंतरित करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ मूल नाम का निकट हिन्दी लिप्यंतरण है और उसे ‘प्रभु’ जैसी उपाधि से नहीं बदलता।
- issue: याहवे के कार्य की अभिव्यक्ति
  choice: महान काम किए हैं
  alternative: महान रीति से काम किया है
  rationale: इब्रानी रचना कार्य की महानता और कर्ता के महान ढंग से कार्य करने—दोनों भावों की अनुमति देती है। मुख्य पाठ स्वाभाविक हिन्दी रखता है और पादटिप्पणी वैकल्पिक मुहावरेगत अर्थ सुरक्षित करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक है। ‘हे भूमि’ मानवीकृत संबोधन को, तथा ‘उल्लसित हो और आनन्द मना’ दो समानांतर इब्रानी आज्ञाओं को अलग-अलग बनाए रखता है।
