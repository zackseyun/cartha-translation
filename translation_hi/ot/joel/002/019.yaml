base_translation:
  language: en
  yaml_path: translation/ot/joel/002/019.yaml
  text: Then the LORD answered and said to his people, “Look, I am sending you the grain, the new wine, and the fresh oil, and you will be satisfied with it; and I will no longer make you a reproach among the nations.”
translation:
  language: hi
  text: तब यहोवा ने अपने लोगों को उत्तर देकर कहा, “देखो, मैं तुम्हें अनाज, नया दाखमधु और ताज़ा तेल भेज रहा हूँ, और तुम इस उपज से तृप्त हो जाओगे; और मैं फिर कभी तुम्हें जातियों के बीच निंदा का पात्र नहीं बनाऊँगा।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को हिन्दी में प्रचलित और स्पष्ट रूप में रखा गया है।
- source_word: הִנְנִי
  choice: देखो, मैं
  rationale: ध्यान आकर्षित करने और निकट भविष्य की प्रतिज्ञा पर बल देने वाली हिब्रू अभिव्यक्ति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַתִּירוֹשׁ
  choice: नई दाखमधु
  rationale: यह उपज के रूप में नई बनी दाखमधु को सूचित करता है; केवल ‘रस’ कहना स्रोत की मदिरा-संबंधी अर्थ-सीमा को संकुचित कर सकता है।
- source_word: הַיִּצְהָר
  choice: ताज़ा तेल
  rationale: शब्द कृषि-उपज के रूप में नया तेल, सामान्यतः जैतून का तेल, दर्शाता है; ‘ताज़ा’ इस संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: חֶרְפָּה
  choice: निंदा का पात्र
  rationale: यह अपमान, तिरस्कार या उपहास की स्थिति को दर्शाता है; हिन्दी मुहावरा व्यक्ति-समुदाय पर पड़ने वाली सार्वजनिक बदनामी को स्पष्ट करता है।
theological_decisions:
- issue: दैवी नाम का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में टेट्राग्राम YHWH है; ‘यहोवा’ नाम और सामान्य उपाधि के बीच का भेद बनाए रखता है।
- issue: परमेश्वर द्वारा निंदा का पात्र बनाए जाने की अभिव्यक्ति
  choice: मैं फिर कभी तुम्हें ... निंदा का पात्र नहीं बनाऊँगा
  alternative: मैं फिर कभी तुम्हें ... निंदा सहने नहीं दूँगा
  rationale: हिब्रू क्रिया נָתַן का सीधा कर्ता परमेश्वर है; नरम वैकल्पिक रूप इस धर्मवैज्ञानिक तनाव को कम कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी, सम्मानपूर्ण और सहज शैली। कृषि-संबंधी त्रयी को समानांतर रूप में रखा गया है और प्रतिज्ञा की प्रत्यक्षता बनाए रखी गई है।
