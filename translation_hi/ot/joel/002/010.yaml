source:
  edition: WLC
  text: לְ/פָנָי/ו֙ רָ֣גְזָה אֶ֔רֶץ רָעֲשׁ֖וּ שָׁמָ֑יִם שֶׁ֤מֶשׁ וְ/יָרֵ֨חַ֙ קָדָ֔רוּ וְ/כוֹכָבִ֖ים אָסְפ֥וּ נָגְהָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/010.yaml
  text: Before him the earth quakes[a]; the heavens tremble. The sun and the moon grow dark[b], and the stars withdraw their brightness.
translation:
  language: hi
  text: उसके सामने पृथ्वी काँपती है[a], आकाश थरथराता है। सूर्य और चन्द्रमा अँधेरे हो जाते हैं, और तारे अपनी चमक समेट लेते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी उपस्थिति में पृथ्वी थरथराती है।”
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “तारे अपनी चमक समेट लेते हैं”; अर्थात वे अपना प्रकाश देना बन्द कर देते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: उसके सामने
  rationale: यह पदबंध ‘उसके सामने’ या ‘उसकी उपस्थिति में’ का अर्थ देता है। ‘उसके सामने’ स्थान-संबंधी और उपस्थिति—दोनों भावों को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רָגְזָה אֶרֶץ
  choice: पृथ्वी काँपती है
  rationale: רגז पृथ्वी के साथ कम्पन या भूकम्प-जैसे हिलने को व्यक्त करता है; आसपास के ब्रह्मांडीय वर्णन के कारण אֶרֶץ को स्थानीय ‘देश’ नहीं, ‘पृथ्वी’ किया गया है।
- source_word: רָעֲשׁוּ שָׁמָיִם
  choice: आकाश थरथराता है
  rationale: רעשׁ तीव्र हिलने या काँपने का बोध देता है। हिन्दी में ‘थरथराता है’ समानांतरता और तीव्रता बनाए रखते हुए ‘काँपती’ की अनावश्यक पुनरावृत्ति से बचाता है। सामूहिक ब्रह्मांडीय विस्तार के लिए ‘आकाश’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: שֶׁמֶשׁ וְיָרֵחַ קָדָרוּ
  choice: सूर्य और चन्द्रमा अँधेरे हो जाते हैं
  rationale: קדר अँधेरा या मलिन हो जाने को दर्शाता है। यह अनुवाद अवस्था-परिवर्तन का भाव स्पष्ट और गरिमापूर्ण हिन्दी में रखता है।
- source_word: וְכוֹכָבִים אָסְפוּ נָגְהָם
  choice: और तारे अपनी चमक समेट लेते हैं
  rationale: אָסף का मूल भाव ‘इकट्ठा करना/समेटना’ है और נֹגַהּ चमक या दीप्ति है। ‘चमक समेट लेते हैं’ मूल काव्यात्मक मुहावरे को बनाए रखते हुए प्रकाश लुप्त होने का अर्थ समझने योग्य बनाता है।
theological_decisions:
- issue: ब्रह्मांडीय विक्षोभ की भाषा का दायरा
  choice: ब्रह्मांडीय घटनाओं को सीधे और काव्यात्मक रूप में प्रस्तुत किया गया है, बिना उन्हें केवल रूपक मानने या किसी निश्चित अंत-कालीन योजना से बाँधने के।
  alternative: इसे केवल आक्रमणकारी सेना से उत्पन्न भय का रूपक मानना, अथवा स्पष्ट रूप से किसी विशिष्ट अंत-कालीन घटना का वर्णन मानना।
  rationale: भविष्यद्वाणी की कविता इतिहास, रूपक और युगान्त-संबंधी संकेतों के बीच तनाव को खुला रखती है; अनुवाद को उस वास्तविक अस्पष्टता को सुरक्षित रखना चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण और भविष्यद्वाणी-सुलभ काव्यात्मक स्तर रखा गया है। ‘चन्द्रमा’ और ‘सूर्य’ ऊँचे किन्तु सामान्यतः समझे जाने वाले शब्द हैं। मुख्य पाठ में मूल इब्रानी के ‘समेटने’ वाले चित्र को संरक्षित किया गया है; फुटनोट उसका आशय स्पष्ट करता है।
