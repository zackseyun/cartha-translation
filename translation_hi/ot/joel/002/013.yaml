  text: וְ/קִרְע֤וּ לְבַבְ/כֶם֙ וְ/אַל בִּגְדֵי/כֶ֔ם וְ/שׁ֖וּבוּ אֶל יְהוָ֣ה אֱלֹֽהֵי/כֶ֑ם כִּֽי חַנּ֤וּן וְ/רַחוּם֙ ה֔וּא אֶ֤רֶךְ אַפַּ֨יִם֙ וְ/רַב חֶ֔סֶד וְ/נִחָ֖ם עַל הָ/רָעָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/013.yaml
  text: Tear your hearts and not your garments[a], and return to Yahweh your God, for he is gracious and compassionate, slow to anger and abundant in steadfast love[b], and relenting concerning the disaster.
translation:
  language: hi
  text: अपने हृदय को फाड़ो, वस्त्रों को नहीं[a], और याहवे, अपने परमेश्वर, की ओर लौट आओ; क्योंकि वह अनुग्रहकारी और करुणामय है, क्रोध करने में धीमा और अटल प्रेम से भरपूर है, और विपत्ति के बारे में अपना मन बदल लेता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने हृदय चीर डालो।”
    reason: lexical_alternative
  - marker: b
    text: या, “विपत्ति लाने से रुक जाता है।” यहाँ “विपत्ति” से आशय घोषित दंड है, नैतिक बुराई नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: קִרְעוּ לְבַבְכֶם
  choice: अपने हृदय फाड़ो
  rationale: क्रिया קרע का मूल अर्थ ‘फाड़ना’ है। यह अभिव्यक्ति बाहरी शोक के बजाय भीतरी पश्चाताप की सशक्त उपमा को बनाए रखती है।
- source_word: וְאַל בִּגְדֵיכֶם
  choice: अपने वस्त्र नहीं
  rationale: संक्षिप्त समानांतर वाक्यांश मूल पाठ में हृदय और शोक के चिह्न के रूप में फाड़े जाने वाले वस्त्रों के बीच विरोध को सुरक्षित रखता है।
- source_word: וְשׁוּבוּ אֶל
  choice: के पास लौट आओ
  rationale: שוב का दिशात्मक अर्थ ‘लौटना’ है; इससे परमेश्वर की ओर फिरने का संबंधपरक और वाचागत भाव बना रहता है, बिना इसे केवल मानसिक पश्चाताप तक सीमित किए।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक देवनागरी में लिप्यंतरित किया गया है।
- source_word: חַנּוּן וְרַחוּם
  choice: अनुग्रहकारी और करुणामय
  rationale: 'दोनों विशेषणों को अलग रखा गया है: पहला कृपा दिखाने और दूसरा गहरी करुणा रखने के भाव को व्यक्त करता है।'
- source_word: אֶרֶךְ אַפַּיִם
  choice: क्रोध करने में धीमा
  rationale: शाब्दिक शारीरिक मुहावरे के बजाय उसका प्रचलित अर्थ दिया गया है; यह परमेश्वर के शीघ्र क्रोधित न होने को व्यक्त करता है।
- source_word: רַב חֶסֶד
  choice: अटल प्रेम से भरपूर
  rationale: חסד के स्थायी, निष्ठावान और संबंधपरक प्रेम के भाव को ‘अटल प्रेम’ व्यक्त करता है; ‘भरपूर’ רב की प्रचुरता को दर्शाता है।
- source_word: וְנִחָם עַל הָרָעָה
  choice: विपत्ति के विषय में अपना मन फेर लेता है
  rationale: נחם के यहाँ प्रयुक्त निफ़अल रूप में घोषित दंड से फिरने या नरम पड़ने का भाव है। यह अनुवाद पाठ की मानवीय भाषा और उसके धर्मवैचारिक तनाव को बनाए रखता है; רעה को इस न्याय-संदर्भ में नैतिक बुराई नहीं, ‘विपत्ति’ माना गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा अथवा ‘प्रभु’
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: וְנִחָם עַל הָרָעָה में परमेश्वर के मन फेरने का वर्णन
  choice: विपत्ति के विषय में अपना मन फेर लेता है
  alternative: विपत्ति लाने से रुक जाता है
  rationale: मुख्य पाठ मूल की मानवीय और धर्मवैचारिक रूप से तनावपूर्ण भाषा को सुरक्षित रखता है। विकल्प उसका प्रसंगगत आशय अधिक स्पष्ट करता है, पर घोषित न्याय को रोकने की व्याख्या को सीधे पाठ में जोड़ देता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। ‘हृदय फाड़ो’ की तीखी भविष्यद्वक्ताई उपमा और ‘अपना मन फेर लेता है’ की धर्मवैचारिक कठिनाई को सरल व्याख्या से दबाया नहीं गया है।
