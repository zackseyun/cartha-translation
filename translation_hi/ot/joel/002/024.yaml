lexical_decisions:
- source_word: וּמָלְאוּ
  choice: भर जाएंगे
  rationale: भविष्यसूचक प्रसंग में यह रूप आने वाले परिणाम को व्यक्त करता है; हिन्दी में ‘भर जाएंगे’ स्वाभाविक ढंग से पूर्णता की अवस्था बताता है।
- source_word: הַגֳּרָנוֹת
  choice: खलिहान
  rationale: यह अनाज दाँवने और इकट्ठा करने के स्थानों को दर्शाता है; हिन्दी में ‘खलिहान’ इसका सहज कृषि-संबंधी शब्द है।
- source_word: בָּר
  choice: अनाज
  rationale: यहाँ किसी एक विशेष फसल के बजाय दँवाए हुए अन्न के लिए व्यापक शब्द है।
- source_word: וְהֵשִׁיקוּ
  choice: छलक उठेंगे
  rationale: यह रूप प्रचुरता के कारण हौदों के उमड़कर बहने का जीवंत चित्र देता है; ‘छलक उठेंगे’ उस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַיְקָבִים
  choice: हौद
  rationale: ये अंगूर या जैतून से निकले द्रव को जमा करने वाले पात्र अथवा कुंड हैं; ‘हौद’ दोनों उत्पादों के साथ उपयुक्त और सुबोध है।
- source_word: תִּירוֹשׁ
  choice: नया दाखरस
  rationale: यह ताज़ी उपज से मिले नए दाखरस को सूचित करता है, केवल सामान्य मदिरा को नहीं।
- source_word: וְיִצְהָר
  choice: और तेल
  rationale: शब्द कृषि-उपज के रूप में तेल, सामान्यतः जैतून के तेल, को दर्शाता है; मुख्य पाठ में संक्षिप्त ‘तेल’ रखा गया है और संदर्भ फुटनोट में स्पष्ट किया गया है।
