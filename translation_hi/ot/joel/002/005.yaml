  text: כְּ/ק֣וֹל מַרְכָּב֗וֹת עַל רָאשֵׁ֤י הֶֽ/הָרִים֙ יְרַקֵּד֔וּ/ן כְּ/קוֹל֙ לַ֣הַב אֵ֔שׁ אֹכְלָ֖ה קָ֑שׁ כְּ/עַ֣ם עָצ֔וּם עֱר֖וּךְ מִלְחָמָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/005.yaml
  text: Like the sound of chariots[a], they leap on the tops of the mountains; like the sound of a flame of fire consuming stubble[c][b]; like a mighty people arrayed for battle.
translation:
  language: hi
  text: रथों की ध्वनि के समान वे पहाड़ों की चोटियों[b] पर उछलते हैं[a]; सूखे डंठलों को भस्म करती आग की लपट की ध्वनि के समान; युद्ध के लिए पंक्तिबद्ध एक शक्तिशाली जनसमूह के समान।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कूदते हैं’ अथवा ‘नाचते हैं’; इब्रानी क्रिया में सजीव ढंग से उछलने की गति का भाव हो सकता है। यहाँ सैन्य अग्रगमन के चित्र के अनुरूप ‘उछलते हैं’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, ‘पहाड़ों के सिरों पर।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּקוֹל
  choice: आवाज़ के समान
  rationale: כְּ तुलना प्रकट करता है और קוֹל सुनाई देने वाली आवाज़ या ध्वनि को; यह चयन पद में तीन बार आने वाली उपमा की संरचना को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מַרְכָּבוֹת
  choice: रथों
  rationale: मूल शब्द सामान्यतः रथों को दर्शाता है; ‘युद्ध-रथ’ कहना प्रसंगानुकूल होता, पर मूल से अधिक विशिष्टता जोड़ता।
- source_word: עַל רָאשֵׁי הֶהָרִים
  choice: पहाड़ों की चोटियों पर
  rationale: शाब्दिक बिंब ‘पहाड़ों के सिरों पर’ है। ‘चोटियों पर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए ऊँचाइयों का दृश्य सुरक्षित रखता है।
- source_word: יְרַקֵּדוּן
  choice: वे ... उछलते हैं
  rationale: רקד में उछलने, कूदने या नाचने जैसी सजीव गति का भाव है। यहाँ सैन्य अग्रगमन के चित्र में ‘उछलते हैं’ तीव्र, लाँघती हुई गति व्यक्त करता है और उत्सवी नृत्य का अनावश्यक संकेत नहीं देता।
- source_word: לַהַב אֵשׁ
  choice: आग की लपट
  rationale: לַהַב का अर्थ लपट या ज्वाला है। ‘आग की लपट’ मूल अभिव्यक्ति को स्पष्ट और सहज हिन्दी में रखता है।
- source_word: אֹכְלָה קָשׁ
  choice: ठूँठ को भस्म करती
  rationale: यह अभिव्यक्ति सूखे कटे डंठलों को आग द्वारा खा जाने का सक्रिय चित्र देती है। ‘भस्म करती’ हिन्दी में आग की तीव्र विनाशकारी क्रिया को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּעַם עָצוּם
  choice: एक शक्तिशाली जनसमूह के समान
  rationale: עָצוּם सामर्थ्य, प्रबलता या विशालता जता सकता है। सैन्य प्रसंग में ‘शक्तिशाली’ उपयुक्त है, और ‘जनसमूह’ עַם को किसी विशिष्ट राष्ट्र के रूप में सीमित किए बिना सामूहिकता व्यक्त करता है।
- source_word: עֱרוּךְ מִלְחָמָה
  choice: युद्ध के लिए पंक्तिबद्ध
  rationale: ערך का निष्क्रिय कृदन्त व्यवस्थित या क्रमबद्ध किए जाने का भाव देता है, विशेषतः सैन्य गठन में। ‘पंक्तिबद्ध’ केवल तैयारी नहीं, बल्कि सुव्यवस्थित युद्ध-विन्यास को भी व्यक्त करता है।
