base_translation:
  language: en
  yaml_path: translation/ot/joel/002/002.yaml
  text: A day of darkness and gloom[a], a day of clouds and thick darkness; like dawn spread over the mountains, a great and mighty people comes. Nothing like it has ever been from of old, and after it there will not again be any[c][b], through the years of generation after generation.
translation:
  language: hi
  text: अंधकार और घोर अंधकार का दिन, बादलों और गहन अंधकार का दिन! भोर के समान पहाड़ों पर फैला हुआ[a] एक विशाल और शक्तिशाली जन-समुदाय[b] आ रहा है। ऐसा कोई प्राचीनकाल से कभी नहीं हुआ, और उसके बाद भी आने वाली पीढ़ियों के वर्षों तक फिर कभी कोई नहीं होगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘भोर’ के स्थान पर इसका एक दुर्लभ अर्थ लेकर अनुवाद हो सकता है: ‘पहाड़ों पर फैली कालिमा के समान।’ फिर भी सामान्य इब्रानी प्रयोग और फैलने के बिंब के कारण ‘भोर’ अधिक संभावित है।'
    reason: lexical_alternative
  - marker: b
    text: यह ‘जन-समुदाय’ आक्रमणकारी सेना, सैनिक भाषा में वर्णित टिड्डियों का दल, या दोनों को मिलाता हुआ भविष्यद्वाणी का बिंब हो सकता है।
    reason: alternative_reading
  - marker: c
    text: शाब्दिक रूप से, ‘पीढ़ी और पीढ़ी के वर्षों तक’; यह बहुत लंबे, अनिश्चित पीढ़ीक्रम का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: י֧וֹם
  choice: दिन
  rationale: मूल पाठ में दोहराव काव्यात्मक बल और भविष्यद्वाणी की घोषणा-शैली देता है; इसलिए दोनों बार ‘दिन’ रखा गया है।
- source_word: חֹשֶׁךְ וַאֲפֵלָה
  choice: अंधकार और घोर अँधेरा
  rationale: दो निकटार्थी शब्दों की तीव्रता और समानांतरता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: עָנָן וַעֲרָפֶל
  choice: बादल और गहन अंधकार
  rationale: पहला शब्द बादल और दूसरा घनी, दृष्टि रोकने वाली अंधकारमयता को व्यक्त करता है; दोनों को अलग रखा गया है।
- source_word: כְּשַׁחַר
  choice: भोर के समान
  rationale: שַׁחַר का सामान्य अर्थ ‘भोर’ है और पहाड़ों पर फैलने के बिंब के साथ यह सहज बैठता है; दुर्लभ अर्थ ‘कालिमा’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: פָּרֻשׂ עַל הֶהָרִים
  choice: पहाड़ों पर फैला हुआ
  rationale: निष्क्रिय कृदंत किसी विस्तृत वस्तु या समूह का चित्र देता है; हिन्दी में यह संरचना उसी दृश्यात्मकता को रखती है।
- source_word: עַם רַב וְעָצוּם
  choice: एक विशाल और शक्तिशाली जन-समुदाय
  rationale: עַם को ‘सेना’ बनाकर अर्थ सीमित नहीं किया गया। ‘जन-समुदाय’ आधुनिक हिन्दी में सामूहिक समूह को स्पष्ट करता है, जबकि ‘विशाल और शक्तिशाली’ संख्या तथा सामर्थ्य दोनों का भाव देता है।
- source_word: מִן הָעוֹלָם
  choice: प्राचीनकाल से
  rationale: इस प्रसंग में यह पद बीते हुए सुदूर काल को सूचित करता है, न कि दार्शनिक अर्थ में ‘संसार’ को।
- source_word: עַד שְׁנֵי דּוֹר וָדוֹר
  choice: पीढ़ी-दर-पीढ़ी वर्षों तक
  rationale: मूल इब्रानी मुहावरे की पीढ़ियों की लंबी, अनिश्चित शृंखला को हिन्दी में लगभग औपचारिक रूप से बनाए रखता है।
theological_decisions:
- issue: ‘विशाल और शक्तिशाली जन-समुदाय’ की पहचान
  choice: इसे सामान्य सामूहिक पद ‘जन-समुदाय’ के रूप में रखा गया है।
  alternative: टिड्डियों का दल, मनुष्यों की आक्रमणकारी सेना, अथवा दोनों को जानबूझकर मिलाता हुआ भविष्यद्वाणी का बिंब।
  rationale: पद स्वयं עַם (‘लोग/जन’) कहता है और इस स्तर पर पहचान निश्चित नहीं करता; किसी एक व्याख्या को मुख्य पाठ में थोपने से मूल की अर्थगत और धर्मवैचारिक तनातनी मिट जाती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। उद्घाटन की समानांतर पंक्तियों और दोहराव को काव्यात्मक प्रभाव के लिए बनाए रखा गया है। ‘जाति’ से आधुनिक हिन्दी में उत्पन्न होने वाली जाति/caste की अनचाही ध्वनि से बचने के लिए ‘जन-समुदाय’ चुना गया है; साथ ही ‘सेना’ या ‘टिड्डियों का दल’ कहकर संदर्भ को संकुचित नहीं किया गया।
