  edition: WLC
  text: מִ֥י יוֹדֵ֖עַ יָשׁ֣וּב וְ/נִחָ֑ם וְ/הִשְׁאִ֤יר אַֽחֲרָי/ו֙ בְּרָכָ֔ה מִנְחָ֣ה וָ/נֶ֔סֶךְ לַ/יהוָ֖ה אֱלֹהֵי/כֶֽם׃פ
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/014.yaml
  text: Who knows? He may turn and relent[a], and leave behind him a blessing—an offering and a drink offering for Yahweh your God.
translation:
  language: hi
  text: कौन जानता है? हो सकता है, वह मुड़ जाए और दण्ड देने से रुक जाए, और अपने पीछे तुम्हारे परमेश्वर याहवे के लिए एक आशीष—एक भेंट[a] और पेय-बलि—छोड़ जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अन्नबलि।” बलिदान-संबंधी प्रसंगों में इब्रानी शब्द מִנְחָה प्रायः विशेष रूप से अन्नबलि को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יוֹדֵעַ
  choice: कौन जानता है?
  rationale: यह इब्रानी मुहावरा सम्भावना और अनिश्चितता व्यक्त करता है; संक्षिप्त आलंकारिक प्रश्न उसी भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: יָשׁוּב
  choice: मुड़ जाए
  rationale: שׁוב का अर्थ ‘मुड़ना/लौटना’ है। यहाँ यह घोषित दण्ड से पलटने की ओर संकेत करता है, न कि केवल स्थान बदलने की ओर।
- source_word: וְנִחָם
  choice: दण्ड देने से रुक जाए
  rationale: נחם यहाँ घोषित विपत्ति को लागू न करने का भाव रखता है। यह हिन्दी अभिव्यक्ति परमेश्वर के निर्णय के पलटने की वास्तविक सम्भावना को रखती है, पर अनावश्यक रूप से भूल मान लेने का संकेत नहीं देती।
- source_word: וְהִשְׁאִיר
  choice: छोड़ जाए
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को शेष छोड़ना है; हिन्दी में यह सहज और संक्षिप्त है।
- source_word: אַחֲרָיו
  choice: अपने पीछे
  rationale: शाब्दिक चित्र ‘उसके पीछे’ का है; ‘अपने पीछे’ हिन्दी में उसी बिम्ब को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּרָכָה
  choice: ऐसी आशीष
  rationale: यहाँ आशीष का ठोस परिणाम उपासना के लिए बची हुई उपज है; ‘ऐसी’ अगले परिणामवाचक वाक्यांश से इसका सम्बन्ध स्पष्ट करता है।
- source_word: מִנְחָה
  choice: भेंट
  rationale: शब्द सामान्य भेंट और बलिदानी सन्दर्भ में विशेषतः अन्नबलि दोनों का अर्थ दे सकता है। मुख्य पाठ में व्यापक अर्थ रखा गया है और विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: וָנֶסֶךְ
  choice: पेय-बलि
  rationale: यह उण्डेली जाने वाली बलिदानी भेंट का तकनीकी शब्द है; ‘पेय-बलि’ आधुनिक पाठक के लिए स्पष्ट है।
- source_word: לַיהוָה
  choice: याहवे के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को लिप्यन्तरित किया गया है; ל यहाँ उपासना में चढ़ाने हेतु उपलब्ध होने का भाव देता है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारे परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन के सम्बन्धसूचक रूप को सीधे रखा गया है और इससे श्रोताओं को सम्बोधित वाचा-संबंधी भाषा बनी रहती है।
theological_decisions:
- issue: परमेश्वर के पछताने अथवा अपना निर्णय पलटने की भाषा
  choice: हो सकता है, वह मुड़ जाए और दण्ड देने से रुक जाए
  alternative: शायद वह लौटे और पछताए
  rationale: मूल पाठ ‘कौन जानता है?’ द्वारा मानवीय दृष्टि से वास्तविक अनिश्चितता रखता है और נחם द्वारा घोषित दण्ड से पलटने की भविष्यद्वक्ताई भाषा इस्तेमाल करता है। चुना हुआ पाठ इस तनाव को रखता है, किन्तु हिन्दी ‘पछताना’ से उत्पन्न भूल या अपराध मानने के अनावश्यक अर्थ से बचता है।
- issue: מִנְחָה का बलिदानी अर्थ
  choice: भेंट
  alternative: अन्नबलि
  rationale: पेय-बलि के साथ प्रयोग होने के कारण यहाँ विशेषतः अन्नबलि सम्भावित है। फिर भी शब्द की अर्थ-व्याप्ति बनाए रखने के लिए मुख्य पाठ में ‘भेंट’ और पादटिप्पणी में अधिक विशिष्ट विकल्प दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण स्तर रखा गया है। ‘दण्ड देने से रुक जाए’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘पेय-बलि’ बलिदानी सन्दर्भ को संक्षेप में व्यक्त करता है। पादटिप्पणी का चिह्न उसी शब्द ‘भेंट’ पर रखा गया है जिससे उसका वास्तविक शाब्दिक विकल्प सम्बन्धित है।
