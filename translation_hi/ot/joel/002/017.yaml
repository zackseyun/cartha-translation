  text: בֵּ֤ין הָ/אוּלָם֙ וְ/לַ/מִּזְבֵּ֔חַ יִבְכּוּ֙ הַ/כֹּ֣הֲנִ֔ים מְשָׁרְתֵ֖י יְהוָ֑ה וְֽ/יֹאמְר֞וּ ח֧וּסָ/ה יְהוָ֣ה עַל עַמֶּ֗/ךָ וְ/אַל תִּתֵּ֨ן נַחֲלָתְ/ךָ֤ לְ/חֶרְפָּה֙ לִ/מְשָׁל בָּ֣/ם גּוֹיִ֔ם לָ֚/מָּה יֹאמְר֣וּ בָֽ/עַמִּ֔ים אַיֵּ֖ה אֱלֹהֵי/הֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/017.yaml
  text: Let the priests[a], the ministers of Yahweh, weep between the portico and the altar, and let them say, “Spare your people, Yahweh, and do not make your inheritance a reproach, a byword among the nations. Why should they say among the peoples[b], ‘Where is their God?’”
translation:
  language: hi
  text: 'मंदिर के प्रवेश-मंडप[a] और वेदी के बीच याहवे की सेवा करनेवाले याजक रोएँ और कहें,

    “हे याहवे, अपनी प्रजा को बख्श दे;

    अपनी विरासत को अपमान का पात्र,

    राष्ट्रों के बीच उपहास का विषय न बनने दे।[b]

    लोगों के बीच यह क्यों कहा जाए,

    ‘उनका परमेश्वर कहाँ है?’”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मंदिर के बरामदे”; यहाँ उस प्रवेश-कक्ष या मंडप का उल्लेख है जो मंदिर के मुख्य भवन के सामने था।
    reason: lexical_alternative
  - marker: b
    text: 'इस इब्रानी वाक्यांश का अनुवाद यह भी हो सकता है: “अपनी विरासत को अपमान के लिए न सौंप, ताकि राष्ट्र उन पर शासन करें।” मूल वाक्यांश उपहास की कहावत बनने अथवा विदेशी प्रभुत्व में दिए जाने—दोनों अर्थों में समझा जा सकता है; अगला ताना मुख्य पाठ में उपहास वाले अर्थ का समर्थन करता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: בֵּין הָאוּלָם וְלַמִּזְבֵּחַ
  choice: मंदिर के प्रवेश-मंडप और वेदी के बीच
  rationale: אוּלָם मंदिर के मुख्य भवन के सामने के प्रवेश-कक्ष या मंडप को दर्शाता है। ‘प्रवेश-मंडप’ आधुनिक हिंदी में स्थान को स्पष्ट करता है, जबकि ‘मंदिर के’ को स्पष्टार्थक रूप से जोड़ा गया है।
- source_word: יִבְכּוּ
  choice: रोएँ
  rationale: प्रसंग में अपूर्ण क्रिया का निर्देशात्मक या आह्वानात्मक बल है; विधिलिंग ‘रोएँ’ इसे स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: הַכֹּהֲנִים מְשָׁרְתֵי יְהוָה
  choice: याहवे की सेवा करनेवाले याजक
  rationale: מְשָׁרְתֵי याजकों की उपासना-संबंधी सेवा को बताता है। यह रूप औपचारिक भूमिका को स्पष्ट रखते हुए हिंदी में सहज है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: חוּסָה עַל עַמֶּךָ
  choice: अपनी प्रजा को बख्श दे
  rationale: חוּסָה दयापूर्वक विनाशकारी न्याय रोकने की विनती है। ‘बख्श दे’ इस तात्कालिक निवेदन को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: נַחֲלָתְךָ
  choice: अपनी विरासत
  rationale: यह शब्द इस्राएल को परमेश्वर के वाचागत भाग और अधिकार के रूप में प्रस्तुत करता है; ‘विरासत’ उस अर्थ-प्रतिध्वनि को बनाए रखती है।
- source_word: לְחֶרְפָּה
  choice: अपमान का पात्र
  rationale: חֶרְפָּה सार्वजनिक लज्जा, तिरस्कार और निंदा का भाव रखता है। ‘अपमान का पात्र’ हिंदी में इस सामुदायिक अनादर को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִמְשָׁל בָּם גּוֹיִם
  choice: राष्ट्रों के बीच उपहास का विषय
  rationale: מָשָׁל यहाँ कहावत, ताना या उपहास का विषय हो सकता है। अगला प्रश्न राष्ट्रों के ताने को उद्धृत करता है, इसलिए मुख्य पाठ में सार्वजनिक उपहास का अर्थ अधिक संगत है।
- source_word: לָמָּה יֹאמְרוּ בָעַמִּים
  choice: लोगों के बीच यह क्यों कहा जाए
  rationale: अपूर्ण क्रिया आशंकित परिणाम को व्यक्त करती है। भाववाच्य हिंदी उस अलंकारिक विनती को स्वाभाविक रखता है और इब्रानी में अनिर्दिष्ट वक्ताओं को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत वाचागत नाम का प्रयोग करता है। ‘याहवे’ उसका सीधा लिप्यंतरण है और उसे किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: לִמְשָׁל בָּם גּוֹיִם का अर्थ
  choice: राष्ट्रों के बीच उपहास का विषय
  alternative: राष्ट्र उन पर शासन करें
  rationale: מָשָׁל का रूप ‘कहावत/ताना बनना’ या ‘शासन करना’—दोनों से जोड़ा जा सकता है। निकटवर्ती חֶרְפָּה और ‘उनका परमेश्वर कहाँ है?’ वाला ताना मुख्य पाठ में उपहास के अर्थ का समर्थन करते हैं; विदेशी प्रभुत्व वाला अर्थ पाद-टिप्पणी में सुरक्षित है।
- issue: נַחֲלָתְךָ में प्रजा का परमेश्वर की विरासत होना
  choice: अपनी विरासत
  alternative: अपनी धरोहर / अपनी प्रजा
  rationale: ‘विरासत’ मूल रूपक को बनाए रखती है और इस्राएल के परमेश्वर के वाचागत भाग होने का भाव सुरक्षित करती है, बिना उसे केवल सामान्य ‘प्रजा’ में समतल किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। काव्यात्मक पंक्ति-विन्यास प्रार्थना की लय और समानांतरता को उभारता है। ‘प्रवेश-मंडप’, ‘याजक’, ‘वेदी’ और ‘विरासत’ जैसे शब्द धार्मिक-सांस्कृतिक सटीकता बनाए रखते हैं, जबकि वाक्य-विन्यास सामान्य हिंदी पाठक के लिए सहज है।
