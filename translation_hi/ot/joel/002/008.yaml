  yaml_path: translation/ot/joel/002/008.yaml
  text: No man crowds his brother; each goes on his own path. Though they fall through the weapon[a], they do not break ranks.
translation:
  language: hi
  text: 'कोई अपने भाई को नहीं धकेलता;

    हर एक अपने मार्ग पर चलता है।

    वे हथियार के बीच से होकर गिर पड़ते हैं,

    पर उनकी पंक्तियाँ नहीं टूटतीं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “वे काटे नहीं जाते” अथवा “वे नहीं रुकते।” अंतिम इब्रानी क्रिया का अर्थ अनिश्चित है। मुख्य पाठ उस सेना के प्रसंगगत चित्र को व्यक्त करता है जिसकी पंक्तियाँ नहीं टूटतीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אָחִיו לֹא יִדְחָקוּן
  choice: कोई अपने भाई को धक्का नहीं देता
  rationale: इब्रानी वितरणात्मक मुहावरे और सैन्य साथियों के परस्पर न टकराने का भाव सुरक्षित है। דחק का मूल अर्थ दबाना या धक्का देना है।
- source_word: גֶּבֶר בִּמְסִלָּתוֹ יֵלֵכוּן
  choice: हर एक अपने मार्ग पर चलता है
  rationale: גֶּבֶר का वितरणात्मक बल ‘हर एक’ से व्यक्त होता है; מְסִלָּה यहाँ प्रत्येक की निर्धारित राह या आगे बढ़ने की दिशा है, जबकि הלך के सामान्य अर्थ को ‘चलता है’ बनाए रखता है।
- source_word: וּבְעַד הַשֶּׁלַח יִפֹּלוּ
  choice: वे हथियारों के बीच से गिरते-पड़ते आगे बढ़ते हैं
  rationale: שֶׁלַח किसी हथियार, विशेषतः फेंके या छोड़े जाने वाले अस्त्र, को सूचित कर सकता है; בעד का अर्थ ‘बीच से/आर-पार’ संभव है। नפל का असामान्य प्रयोग यहाँ आक्रमण के बीच निर्बाध आगे बढ़ने का चित्र देता है, इसलिए स्वाभाविक हिन्दी में ‘गिरते-पड़ते आगे बढ़ते हैं’ चुना गया है, बिना किसी विशिष्ट अस्त्र को आरोपित किए।
- source_word: לֹא יִבְצָעוּ
  choice: पर उनकी पंक्तियाँ नहीं टूटतीं
  rationale: בצע का यह प्रयोग शब्दार्थ की दृष्टि से कठिन है। प्रसंग में सुव्यवस्थित और न रुकने वाले दल का चित्र होने के कारण मुख्य पाठ सैन्य गठन न टूटने का भाव देता है; वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
