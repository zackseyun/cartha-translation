source:
  edition: WLC
  text: לְ/פָנָי/ו֙ אָ֣כְלָה אֵ֔שׁ וְ/אַחֲרָ֖י/ו תְּלַהֵ֣ט לֶֽהָבָ֑ה כְּ/גַן עֵ֨דֶן הָ/אָ֜רֶץ לְ/פָנָ֗י/ו וְ/אַֽחֲרָי/ו֙ מִדְבַּ֣ר שְׁמָמָ֔ה וְ/גַם פְּלֵיטָ֖ה לֹא הָ֥יְתָה לּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/003.yaml
  text: Before it[a], fire devours; behind it, a flame blazes. The land before it is like the garden of Eden, but behind it is a desolate wilderness; indeed, nothing escapes it.
translation:
  language: hi
  text: उसके आगे आग भस्म करती है, और उसके पीछे ज्वाला धधकती है। उसके आगे की भूमि अदन के बगीचे के समान है, पर उसके पीछे उजाड़ मरुभूमि है; सचमुच, उससे कोई भी बच नहीं पाता।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कोई बचा हुआ व्यक्ति नहीं रहता” अथवा “उससे बच निकलने का कोई उपाय नहीं है।” इब्रानी संज्ञा का अर्थ बच निकलना भी हो सकता है और बचा हुआ व्यक्ति या अवशेष भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְפָנָיו
  choice: उसके आगे
  rationale: स्थानवाचक पद और एकवचन प्रत्यय को स्वाभाविक हिन्दी में रखा गया है; ‘उसके’ का संकेत सामूहिक रूप से देखी गई आक्रमणकारी सेना या टिड्डी-दल की ओर है।
- source_word: אָכְלָה אֵשׁ
  choice: आग भस्म करती जाती है
  rationale: नबी के सजीव वर्णन में पूर्ण क्रिया का वर्तमान-जैसा प्रभाव है। ‘भस्म करती जाती है’ आग की निरंतर विनाशकारी गति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאַחֲרָיו
  choice: और उसके पीछे
  rationale: यह ‘उसके आगे’ के समानांतर स्पष्ट स्थानवाचक अर्थ देता है।
- source_word: תְּלַהֵט לֶהָבָה
  choice: ज्वाला धधकती है
  rationale: पिएल क्रिया की तीव्र अग्नि का भाव ‘धधकती’ से संक्षेप और स्वाभाविक रूप में आता है।
- source_word: כְּגַן עֵדֶן
  choice: अदन के बगीचे के समान
  rationale: यह उत्पत्ति-वृत्तांत के ‘अदन के बगीचे’ की ओर संकेत बनाए रखता है और आधुनिक हिन्दी में स्पष्ट है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: यहाँ स्थानीय कृषि-प्रदेश अभिप्रेत है; ‘पृथ्वी’ अनावश्यक रूप से वैश्विक अर्थ दे सकती है।
- source_word: מִדְבַּר שְׁמָמָה
  choice: उजाड़ मरुभूमि
  rationale: यह मरुभूमि और पूर्ण वीरानी, दोनों अर्थों को सहज और प्रभावशाली हिन्दी में रखता है।
- source_word: וְגַם
  choice: सचमुच
  rationale: अंतिम कथन के जोर और चरम प्रभाव को व्यक्त करता है।
- source_word: פְּלֵיטָה
  choice: कुछ भी नहीं बचता
  rationale: संज्ञा का अर्थ ‘बच निकलना’ या ‘बचा हुआ व्यक्ति/अवशेष’ हो सकता है। मुख्य पाठ का व्यापक कथन विनाश की संपूर्णता बताता है, जबकि पादटिप्पणी वास्तविक शब्दगत अस्पष्टता सुरक्षित रखती है।
- source_word: לֹא הָיְתָה לוֹ
  choice: उससे कुछ भी नहीं बचता
  rationale: शाब्दिक संरचना ‘उसके लिए बचाव/बचा हुआ कोई न था’ है। सन्दर्भ में यह हिन्दी अभिव्यक्ति स्पष्ट है और आक्रमणकारी शक्ति से किसी के या किसी वस्तु के न बचने का भाव देती है।
theological_decisions:
- issue: पद में एकवचन सर्वनाम-प्रत्ययों का संकेत
  choice: आक्रमणकारी दल के लिए सामूहिक एकवचन ‘उसके/उससे’
  alternative: सेना या टिड्डी-दल का अधिक मानवीकरण करते हुए किसी पुरुष व्यक्ति-सदृश रूप में अनुवाद
  rationale: इब्रानी एकवचन प्रत्यय सम्भवतः आस-पास वर्णित आक्रमणकारी शक्ति को सामूहिक इकाई मानते हैं। हिन्दी ‘उसके/उससे’ एकवचन बनाए रखता है, पर किसी विशिष्ट पुरुष व्यक्ति का अर्थ आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, दृश्यात्मक और सामान्य पाठक के लिए सुबोध रूप। समानांतरता (‘उसके आगे… उसके पीछे’) और आग से उजाड़ तक बढ़ती विनाश-छवि सुरक्षित रखी गई है।
