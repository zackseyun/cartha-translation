  to: उसके आगे आग भस्म करती है, और उसके पीछे ज्वाला धधकती है। उसके आगे की भूमि अदन के बगीचे के समान है, पर उसके पीछे उजाड़ मरुभूमि है; सचमुच, उससे कोई भी बच नहीं पाता।[a]
