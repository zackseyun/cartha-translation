  text: They rush through the city[a]; they run on the wall; they climb into the houses; they enter through the windows like a thief.
translation:
  language: hi
  text: वे नगर में दौड़ते-फिरते हैं[a]; वे नगर की दीवार पर दौड़ते हैं; वे घरों में चढ़ जाते हैं; वे चोर के समान खिड़कियों से भीतर प्रवेश करते हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे नगर के बीच से दौड़ते हैं।” इब्रानी पूर्वसर्ग का शाब्दिक अर्थ “में” है; गति के इस संदर्भ में “के बीच से” भी सम्भव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָשֹׁקּוּ
  choice: इधर-उधर दौड़ते हैं
  rationale: यह क्रिया नगर के भीतर तेज़ और सक्रिय आवागमन को व्यक्त करती है। ‘इधर-उधर दौड़ते हैं’ आक्रमण की तीव्रता को स्वाभाविक हिन्दी में रखता है, बिना यह तय किए कि कर्ता टिड्डियाँ हैं या सैनिक।
- source_word: בָּעִיר
  choice: नगर में
  rationale: पूर्वसर्ग ב का सीधा अर्थ ‘में’ है। गति के संदर्भ में यह नगर के भीतर आवागमन बताता है; इसलिए मूल की अस्पष्टता बनाए रखने हेतु मुख्य पाठ में ‘नगर में’ रखा गया है।
- source_word: יְרֻצוּן
  choice: दौड़ते हैं
  rationale: רוץ का सामान्य और सीधा अर्थ ‘दौड़ना’ है; यह पंक्ति की तीव्र गति और समानांतर रचना को बनाए रखता है।
- source_word: בַּחוֹמָה
  choice: शहरपनाह पर
  rationale: यहाँ חוֹמָה नगर की रक्षात्मक दीवार है। ‘शहरपनाह’ साधारण ‘दीवार’ की अपेक्षा उस दुर्ग-परकोटे के भाव को अधिक स्पष्टता से व्यक्त करता है।
- source_word: יַעֲלוּ
  choice: चढ़ आते हैं
  rationale: עלה का मूल भाव ऊपर चढ़ना है। घरों के संदर्भ में ‘चढ़ आते हैं’ आक्रामक प्रवेश की तस्वीर देता है, पर प्रवेश का मार्ग अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בַּבָּתִּים
  choice: घरों में
  rationale: संज्ञा सप्रत्यय और बहुवचन है। हिन्दी में ‘घरों में’ निश्चित घरों के दृश्य को स्वाभाविक रूप से व्यक्त करता है; अलग निश्चितता-सूचक शब्द आवश्यक नहीं।
- source_word: בְּעַד הַחַלּוֹנִים
  choice: खिड़कियों से भीतर
  rationale: בְּעַד किसी खुले मार्ग से होकर प्रवेश को बताता है। ‘खिड़कियों से भीतर’ हिन्दी में दिशा और माध्यम दोनों को स्पष्ट तथा स्वाभाविक बनाता है।
- source_word: יָבֹאוּ
  choice: घुसते हैं
  rationale: בוא सामान्यतः ‘आना/प्रवेश करना’ है; चोर की उपमा और घरों में अनधिकृत प्रवेश के संदर्भ में ‘घुसते हैं’ उपयुक्त और सजीव है।
- source_word: כַּגַּנָּב
  choice: चोर के समान
  rationale: यह उपमा गुप्त और अनधिकृत प्रवेश का चित्र रखती है। ‘चोर के समान’ गरिमापूर्ण आधुनिक हिन्दी है और किसी बाद की धर्मवैज्ञानिक संगति को आयात नहीं करता।
theological_decisions:
- issue: आक्रमणकारी समूह का परिचय
  choice: बहुवचन ‘वे’ रखा गया है और समूह की पहचान स्पष्ट नहीं की गई।
  alternative: उन्हें स्पष्ट रूप से टिड्डियाँ या मानव सैनिक कहना।
  rationale: इस पद में इब्रानी पाठ केवल तृतीय पुरुष बहुवचन क्रियाएँ देता है। योएल के प्रसंग में टिड्डियों और सेना की छवियाँ परस्पर जुड़ी रहती हैं; किसी एक पहचान को जोड़ना मूल की तनावपूर्ण अस्पष्टता को समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सजीव, गरिमापूर्ण वर्णन रखा गया है। ‘शहरपनाह’ नगर की किलेबंदी को स्पष्ट करता है; वाक्यों की पुनरावृत्त संरचना मूल की तीव्र, क्रमिक गति बनाए रखती है।
