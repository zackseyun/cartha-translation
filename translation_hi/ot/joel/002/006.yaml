    text: इब्रानी में शाब्दिक रूप से, “सभी चेहरे פָארוּר बटोरते हैं”; यह दुर्लभ मुहावरा सामान्यतः चेहरों का रंग उड़ जाने के अर्थ में समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפָּנָיו
  choice: उसके सामने
  rationale: यह पदबंध किसी की उपस्थिति या उसके सम्मुख होने का भाव देता है। पुरुषवाचक एकवचन प्रत्यय को ‘उसके’ के रूप में रखा गया है, पर उसका संदर्भ स्पष्ट करके नहीं बताया गया।
- source_word: יָחִילוּ
  choice: पीड़ा से तड़पते हैं
  rationale: חול का यह रूप भय से कांपने, मरोड़ खाने या प्रसव-जैसी वेदना में होने का सजीव भाव व्यक्त कर सकता है; यह हिन्दी पदबंध शारीरिक और मानसिक व्याकुलता दोनों बनाए रखता है।
- source_word: עַמִּים
  choice: जाति-जाति के लोग
  rationale: बहुवचन עַמִּים व्यापक मानव-समुदायों को दर्शाता है। यह चयन आधुनिक हिन्दी में स्वाभाविक है और आधुनिक राजनीतिक ‘राष्ट्रों’ तक अर्थ को सीमित नहीं करता।
- source_word: כָּל פָּנִים
  choice: सभी चेहरे
  rationale: इब्रानी सामूहिक अभिव्यक्ति का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: קִבְּצוּ פָארוּר
  choice: रंग उड़ जाता है
  rationale: दुर्लभ पदबंध को भय के कारण चेहरों का रंग फीका पड़ जाने के अर्थ में समझा गया है। शाब्दिक ‘पीलापन बटोरते हैं’ हिन्दी में अस्वाभाविक होगा।
theological_decisions:
- issue: מִפָּנָיו में तीसरे पुरुष एकवचन प्रत्यय का संदर्भ
  choice: ‘उसके’ कहकर संदर्भ को अनिर्दिष्ट रखा गया
  alternative: ‘यहोवा के सामने’ अथवा ‘उसके आते ही’
  rationale: निकटवर्ती संदर्भ में यह आगे बढ़ती सेना/शक्ति की ओर संकेत कर सकता है, जो यहोवा के दिन से घनिष्ठ रूप से जुड़ी है। मूल पाठ की अस्पष्टता को व्याख्यात्मक रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और सजीव काव्यात्मक गद्य। ‘जाति-जाति के लोग’ सामूहिक बहुवचन को व्यक्त करता है; ‘पीड़ा से तड़पते हैं’ मूल क्रिया की तीव्रता रखता है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
