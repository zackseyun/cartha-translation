id: JOL.2.27
reference: Joel 2:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וִ/ידַעְתֶּ֗ם כִּ֣י בְ/קֶ֤רֶב יִשְׂרָאֵל֙ אָ֔נִי וַ/אֲנִ֛י יְהוָ֥ה אֱלֹהֵי/כֶ֖ם וְ/אֵ֣ין ע֑וֹד וְ/לֹא יֵבֹ֥שׁוּ עַמִּ֖/י לְ/עוֹלָֽם־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/027.yaml
  text: Then you will know that I am in the midst of Israel[a], and that I am Yahweh your God, and there is no other; and my people will never again be put to shame.
translation:
  language: hi
  text: तब तुम जानोगे कि मैं इस्राएल के बीच में हूँ, और मैं ही याहवे, तुम्हारा परमेश्वर हूँ; मेरे सिवा कोई और नहीं है। मेरी प्रजा फिर कभी लज्जित नहीं होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक शाब्दिक रूप: “मेरी प्रजा सदा के लिए लज्जित नहीं होगी।”'
    reason: לְעוֹלָם का मूल अर्थ ‘सदा के लिए’ है; मुख्य पाठ में पुनर्स्थापना के प्रसंगानुसार नकारात्मक मुहावरे को ‘फिर कभी नहीं’ कहा गया है।
lexical_decisions:
- source_word: וִידַעְתֶּם
  choice: तब तुम जानोगे
  rationale: संयोजक सहित यह पूर्ण क्रिया पूर्ववर्ती पुनर्स्थापना की प्रतिज्ञाओं के परिणाम को भविष्य में व्यक्त करती है; इसलिए ‘तब’ प्रसंगगत परिणामी बल को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: בְּקֶרֶב יִשְׂרָאֵל
  choice: इस्राएल के बीच में
  rationale: בְּקֶרֶב किसी समुदाय के मध्य उपस्थित होने का भाव देता है। ‘के बीच में’ केवल ‘के बीच’ की तुलना में उस आंतरिक उपस्थिति को अधिक स्पष्ट रखता है।
- source_word: וַאֲנִי
  choice: और मैं ही
  rationale: दोहराया गया सर्वनाम बलाघातपूर्ण है। ‘ही’ उस बल को सहज हिन्दी में व्यक्त करता है और पहले कथन से समानांतर संबंध बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का निकट हिन्दी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित रचना का सीधा अर्थ है ‘तुम्हारा परमेश्वर’, जो वाचा-संबंध को व्यक्त करता है।
- source_word: וְאֵין עוֹד
  choice: मेरे सिवा कोई और नहीं है
  rationale: इब्रानी मुहावरा याहवे की अनन्यता बताता है। हिन्दी में ‘मेरे सिवा’ पूर्ववर्ती प्रथम पुरुष वक्ता से आशय स्पष्ट करते हुए कथन का स्वाभाविक रूप देता है।
- source_word: וְלֹא יֵבֹשׁוּ
  choice: लज्जित नहीं होगी
  rationale: क्रिया लज्जा अनुभव करने या अपमानित होने, दोनों अर्थ दे सकती है। ‘लज्जित होना’ हिन्दी में इस अर्थ-सीमा को अपेक्षाकृत खुला रखता है।
- source_word: עַמִּי
  choice: मेरी प्रजा
  rationale: प्रथम पुरुष एकवचन प्रत्यय सहित यह प्रचलित वाचा-संबंधी अभिव्यक्ति है। सामूहिक एकवचन के अनुरूप ‘होगी’ रखा गया है।
- source_word: לְעוֹלָם
  choice: फिर कभी
  rationale: नकार के साथ और पुनर्स्थापना के प्रसंग में यह स्थायी रूप से दोबारा लज्जित न होने की प्रतिज्ञा देता है। अधिक शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का निकट देवनागरी लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: וְאֵין עוֹד में अनन्यता का कथन
  choice: मेरे सिवा कोई और नहीं है
  alternative: और कोई नहीं है
  rationale: यह रूप परमेश्वर की अनन्यता को स्पष्ट और स्वाभाविक हिन्दी में रखता है, पर पाठ से आगे बढ़कर कोई बाद की धर्मसैद्धांतिक शब्दावली नहीं जोड़ता।
- issue: לֹא יֵבֹשׁוּ עַמִּי לְעוֹלָם में लज्जा का स्वरूप
  choice: मेरी प्रजा फिर कभी लज्जित नहीं होगी
  alternative: मेरी प्रजा सदा के लिए लज्जित नहीं होगी; मेरी प्रजा फिर कभी अपमानित नहीं होगी
  rationale: मुख्य पाठ स्थायी उलटाव को स्वाभाविक हिन्दी में व्यक्त करता है। ‘लज्जित’ व्यक्तिगत लज्जा और सार्वजनिक अपमान के बीच मूल क्रिया की अर्थगत व्यापकता को अनावश्यक रूप से सीमित नहीं करता; कालगत अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। वाक्य की समानांतर रचना, बलाघातपूर्ण ‘मैं ही’, ईश्वरीय व्यक्तिगत नाम और लज्जा-संबंधी मूल अर्थ की व्यापकता को संरक्षित किया गया है। पादटिप्पणी-चिह्न उसी वाक्यांश के बाद रखा गया है जिससे वह संबंधित है।
