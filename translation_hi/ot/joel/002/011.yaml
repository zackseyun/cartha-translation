source:
  edition: WLC
  text: וַֽ/יהוָ֗ה נָתַ֤ן קוֹל/וֹ֙ לִ/פְנֵ֣י חֵיל֔/וֹ כִּ֣י רַ֤ב מְאֹד֙ מַחֲנֵ֔/הוּ כִּ֥י עָצ֖וּם עֹשֵׂ֣ה דְבָר֑/וֹ כִּֽי גָד֧וֹל יוֹם יְהוָ֛ה וְ/נוֹרָ֥א מְאֹ֖ד וּ/מִ֥י יְכִילֶֽ/נּוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/011.yaml
  text: And Yahweh gives his voice before his army[a], for his camp is exceedingly great; for mighty is the one who does his word[c][b]. For the day of Yahweh is great and exceedingly dreadful—who can endure it?
translation:
  language: hi
  text: और याहवे अपनी सेना के आगे अपना स्वर सुनाता है[a], क्योंकि उसका शिविर अत्यन्त विशाल है; क्योंकि उसके वचन को पूरा करनेवाला सामर्थी है[b]। क्योंकि याहवे का दिन महान और अत्यन्त भयानक है[c]—कौन उसे सह सकता है?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: ‘अपनी आवाज़ देता है’; इसका अर्थ ‘अपनी आवाज़ सुनाता है’ भी हो सकता है।'
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी आज्ञा को पूरा करनेवाला’; यहाँ ‘वचन’ के भीतर आज्ञा का भाव हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या ‘अत्यन्त भयावह’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיהוָה
  choice: याहवे
  rationale: संयोजक संबंध को वाक्य-प्रवाह में रखा गया है और परमेश्वर के व्यक्तिगत नाम को ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: נָתַן קוֹלוֹ
  choice: अपना स्वर सुनाता है
  rationale: शाब्दिक भाव ‘अपनी आवाज़ देता है’ है; वर्तमान हिन्दी में ‘अपना स्वर सुनाता है’ उसी उद्घोषणा को स्वाभाविक और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: לִפְנֵי חֵילוֹ
  choice: अपनी सेना के आगे
  rationale: חַיִל यहाँ संगठित सैन्य दल को सूचित करता है और לִפְנֵי स्थानिक अर्थ में उसके आगे होने को।
- source_word: כִּי רַב מְאֹד מַחֲנֵהוּ
  choice: क्योंकि उसका शिविर अत्यन्त विशाल है
  rationale: מַחֲנֶה की शिविर/छावनी की छवि को ‘सेना’ से अलग रखा गया है; רַב आकार अथवा संख्या दोनों का संकेत दे सकता है, इसलिए ‘विशाल’ मूल की कुछ व्यापकता बनाए रखता है।
- source_word: כִּי עָצוּם עֹשֵׂה דְבָרוֹ
  choice: क्योंकि उसके वचन को पूरा करनेवाला सामर्थी है
  rationale: एकवचन कृदन्त को एकवचन ही रखा गया है और עָצוּם का बल ‘सामर्थी’ से व्यक्त किया गया है। ‘वचन को पूरा करना’ आज की हिन्दी में आज्ञार्थक संदर्भ के साथ भी स्वाभाविक है।
- source_word: כִּי גָדוֹל יוֹם יְהוָה
  choice: निश्चय ही याहवे का दिन महान है
  rationale: כִּי यहाँ पिछले कथन का आधार और जोर दोनों देता है; ‘निश्चय ही’ हिन्दी में इस अंतिम घोषणात्मक वाक्य का बल स्पष्ट करता है।
- source_word: וְנוֹרָא מְאֹד
  choice: और अत्यन्त भयानक
  rationale: न्याय के इस प्रसंग में נוֹרָא भय उत्पन्न करनेवाले अर्थ में है; ‘भयानक’ आधुनिक हिन्दी में उस तीव्रता को स्पष्ट रखता है।
- source_word: וּמִי יְכִילֶנּוּ
  choice: कौन उसे सह सकता है?
  rationale: क्रिया का अर्थ सहने अथवा टिक पाने की क्षमता है और प्रत्यय का संकेत ‘याहवे के दिन’ की ओर है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: व्यक्तिगत वाचा-नाम को उपाधि में बदले बिना लिप्यंतरित किया गया है।
- issue: ‘उसकी सेना’ और ‘उसका शिविर’ किसके हैं
  choice: आक्रमणकारी दल को याहवे की सेना और उसके आदेश के अधीन बताया गया है
  alternative: इसे केवल टिड्डियों का झुंड अथवा केवल मानवीय सेना मानना
  rationale: अधिकारसूचक प्रत्यय और ‘उसके वचन को पूरा करनेवाला’ दल को याहवे के नियंत्रण में रखते हैं, पर अनुवाद यह तय नहीं करता कि चित्र टिड्डियों, मनुष्यों या दोनों से संबंधित है।
- issue: עֹשֵׂה का एकवचन कर्ता
  choice: ‘पूरा करनेवाला’ के रूप में व्याकरणिक एकवचन सुरक्षित रखा गया है
  alternative: ‘पूरा करनेवाले’ कहकर सामूहिक बहुवचन स्पष्ट करना
  rationale: मूल पाठ का एकवचन किसी प्रतिनिधि अथवा सामूहिक एकवचन के रूप में समझा जा सकता है; उसे बहुवचन बनाकर अस्पष्टता समाप्त नहीं की गई।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण भविष्यद्वाणी-शैली रखी गई है। कठिन इब्रानी मुहावरों को सहज बनाया गया है, पर सेना/शिविर, एकवचन कर्ता और ‘वचन’ की मूल छवियाँ तथा उनकी अर्थगत अस्पष्टता सुरक्षित हैं।
