  text: כְּ/גִבּוֹרִ֣ים יְרֻצ֔וּ/ן כְּ/אַנְשֵׁ֥י מִלְחָמָ֖ה יַעֲל֣וּ חוֹמָ֑ה וְ/אִ֤ישׁ בִּ/דְרָכָי/ו֙ יֵֽלֵכ֔וּ/ן וְ/לֹ֥א יְעַבְּט֖וּ/ן אֹרְחוֹתָֽ/ם׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/007.yaml
  text: Like warriors they run[a]; like men of war they climb the wall. Each goes in his own way[b], and they do not swerve from their paths.
translation:
  language: hi
  text: वे वीरों के समान दौड़ते हैं; योद्धाओं के समान दीवार पर चढ़ते हैं। हर एक अपने मार्ग पर चलता है, और वे अपने रास्तों से नहीं मुड़ते[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वे अपनी पंक्ति नहीं बिगाड़ते।” इब्रानी क्रिया दुर्लभ है और अपने मार्ग से न हटने या सैन्य पंक्ति न तोड़ने का भाव दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּגִבּוֹרִים
  choice: वीरों के समान
  rationale: גִּבּוֹרִים इस सैनिक प्रसंग में बलवान योद्धाओं को दर्शाता है; ‘वीर’ संक्षिप्त, स्वाभाविक और गरिमापूर्ण है।
- source_word: יְרֻצוּן
  choice: वे दौड़ते हैं
  rationale: רוץ का सीधा अर्थ ‘दौड़ना’ है; अपूर्ण रूप यहाँ सजीव, लगातार दिखाई देने वाली कार्रवाई व्यक्त करता है।
- source_word: כְּאַנְשֵׁי מִלְחָמָה
  choice: योद्धाओं के समान
  rationale: शाब्दिक अर्थ ‘युद्ध के पुरुषों के समान’ है। आधुनिक हिन्दी में ‘योद्धा’ सैन्य आशय को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: יַעֲלוּ חוֹמָה
  choice: शहरपनाह पर चढ़ते हैं
  rationale: עלה का अर्थ ऊपर जाना/चढ़ना और חוֹמָה का अर्थ नगर की रक्षात्मक दीवार है; ‘शहरपनाह’ साधारण दीवार से भेद रखते हुए प्रसंग स्पष्ट करती है।
- source_word: וְאִישׁ בִּדְרָכָיו יֵלֵכוּן
  choice: हर एक अपने मार्ग पर चलता है
  rationale: אִישׁ का प्रयोग वितरणात्मक है—‘हर एक’; एकवचन वाक्य-विन्यास और स्वत्ववाचक रूप को हिन्दी में सुरक्षित रखा गया है।
- source_word: וְלֹא יְעַבְּטוּן
  choice: वे ... नहीं मुड़ते
  rationale: दुर्लभ क्रिया का अर्थ अनिश्चित है और मार्ग से विचलित होने अथवा पंक्ति बिगाड़ने का संकेत दे सकता है। मुख्य पाठ में सामान्य अर्थ रखा गया है और विकल्प पादटिप्पणी में दिया गया है।
- source_word: אֹרְחוֹתָם
  choice: अपने रास्तों से
  rationale: אֹרַח रास्ते या पथ को दर्शाता है; ‘रास्तों’ से पहले आए דֶּרֶךְ के समानांतर भाव के साथ हल्का शब्दगत भेद बना रहता है।
theological_decisions:
- issue: पुल्लिंग सैन्य भाषा
  choice: ‘वीरों’ और ‘योद्धाओं’ का प्रयोग; वितरणात्मक खंड में ‘हर एक अपने’
  alternative: ‘सैनिकों’ तथा बहुवचन/लिंग-निरपेक्ष अभिव्यक्ति
  rationale: इब्रानी में सैन्य उपमा पुल्लिंग है और אִישׁ के साथ तृतीय पुरुष पुल्लिंग एकवचन प्रत्यय है। हिन्दी में ‘हर एक अपने’ स्रोत की वितरणात्मक एकवचन रचना को स्वाभाविक रूप से बनाए रखता है, जबकि ‘योद्धा’ सैन्य अर्थ स्पष्ट करता है।
- issue: יְעַבְּטוּן का दुर्लभ और अनिश्चित अर्थ
  choice: ‘अपने रास्तों से नहीं मुड़ते’
  alternative: ‘अपनी पंक्ति नहीं बिगाड़ते’
  rationale: समानांतर पद मार्ग और रास्तों पर केंद्रित है, इसलिए विचलित न होने का अर्थ मुख्य पाठ में उपयुक्त है; फिर भी सैन्य गठन का अर्थ संभव होने से उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट और गरिमापूर्ण स्तर रखा गया है। ‘शहरपनाह’ नगर की रक्षात्मक दीवार को सूचित करती है। इब्रानी समानांतरता बनाए रखने के लिए ‘मार्ग’ और ‘रास्तों’ का प्रयोग किया गया है।
