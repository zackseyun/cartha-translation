  yaml_path: translation/ot/joel/002/018.yaml
  text: Then Yahweh became jealous for his land and had compassion on his people[a].
translation:
  language: hi
  text: तब यहोवा अपनी भूमि के लिए ईर्ष्या से भर उठा[a] और उसने अपनी प्रजा पर दया की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपनी भूमि के लिए उत्साह से भर उठा।” इब्रानी क्रिया ईर्ष्या या उत्साह—दोनों का भाव व्यक्त कर सकती है; यहाँ यह अपनी भूमि के लिए यहोवा की तीव्र, वाचा-संबंधी लगन को दर्शाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְקַנֵּא
  choice: जल उठा
  rationale: कנא ईर्ष्या और उत्साह—दोनों का भाव व्यक्त कर सकता है। ‘अपनी भूमि के लिए जल उठा’ हिन्दी में यहोवा की तीव्र, रक्षक और अधिकारपूर्ण वाचा-संबंधी चिंता को स्वाभाविक रूप से व्यक्त करता है, जबकि पादटिप्पणी में अर्थ-सीमा स्पष्ट रखी गई है। वाव-सहित क्रिया को भूतकालीन कथात्मक रूप में अनूदित किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में परमेश्वर के व्यक्तिगत नाम के प्रचलित लिप्यंतरण ‘यहोवा’ का प्रयोग किया गया है, न कि उसे किसी उपाधि से बदला गया है।
- source_word: לְאַרְצוֹ
  choice: अपनी भूमि के लिए
  rationale: यहाँ אֶרֶץ का संकेत पूरी पृथ्वी के बजाय वाचा की भूमि की ओर है। קנא के बाद לְ उस वस्तु को दिखाता है जिसके लिए यहोवा की तीव्र चिंता है।
- source_word: וַיַּחְמֹל
  choice: दया की
  rationale: חמל दया, करुणा या बख्श देने का भाव रखता है। ‘दया की’ आधुनिक हिन्दी में सहज है और केवल दंड रोकने की अपेक्षा व्यापक करुणामय भाव को बनाए रखता है।
- source_word: עַל
  choice: पर
  rationale: חמל के साथ עַל दया के पात्र को चिह्नित करता है; हिन्दी में ‘पर दया की’ स्वाभाविक प्रयोग है।
- source_word: עַמּוֹ
  choice: अपनी प्रजा
  rationale: वाचा के संदर्भ में עַם परमेश्वर से संबंधित सामुदायिक जन को दर्शाता है। ‘प्रजा’ इस संबंध को ‘राष्ट्र’ की तुलना में अधिक स्वाभाविक और कम राजनीतिक ढंग से व्यक्त करती है।
theological_decisions:
- issue: परमेश्वर की ईर्ष्या/उत्साह का अनुवाद
  choice: अपनी भूमि के लिए जल उठा
  alternative: अपनी भूमि के लिए ईर्ष्या से भर उठा; अपनी भूमि के लिए जोश से भर उठा
  rationale: इब्रानी קנא में ईर्ष्या और उत्साह दोनों निहित हो सकते हैं। मुख्य पाठ का ‘जल उठा’ तीव्र भाव और रक्षक वाचा-संबंधी चिंता को बनाए रखता है, पर किसी एक हिन्दी अर्थ तक सीमित नहीं करता; पादटिप्पणी वास्तविक शाब्दिक विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘तब’ कथात्मक क्रम को, ‘अपनी’ यहोवा के भूमि और प्रजा दोनों से संबंध को, और ‘जल उठा’ मूल की भावात्मक तीव्रता तथा अर्थगत अस्पष्टता को व्यक्त करता है।
