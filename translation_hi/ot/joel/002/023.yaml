base_translation:
  language: en
  yaml_path: translation/ot/joel/002/023.yaml
  text: And you[a], children of Zion, rejoice and be glad in Yahweh your God, for he has given you the early rain for righteousness[c][b]; and he causes the rain to come down for you—the early rain and the latter rain as before.
translation:
  language: hi
  text: और हे सिय्योन की संतानों, अपने परमेश्वर याहवे में आनन्द करो और प्रसन्न होओ, क्योंकि उसने तुम्हें धार्मिकता के लिए आरंभिक वर्षा[a][b] दी है; और वह तुम्हारे लिए वर्षा बरसाता है—आरंभिक वर्षा और अंतिम वर्षा, पहले के समान।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धार्मिकता के लिए शिक्षक” अथवा “धार्मिकता का शिक्षक।” हिब्रू शब्द मोरेह का अर्थ “शिक्षक” या “आरंभिक वर्षा” हो सकता है; आस-पास वर्षा का उल्लेख होने के कारण यहाँ “आरंभिक वर्षा” अधिक संभावित है।
    reason: alternative_reading
  - marker: b
    text: या, “उचित मात्रा में” अथवा “तुम्हारे पक्ष में न्याय के लिए।” हिब्रू वाक्यांश का शाब्दिक अर्थ “धार्मिकता के लिए” है।
    reason: lexical_alternative
  - marker: c
    text: या, “पहले महीने में।” हिब्रू को कैलेंडर-संबंधी संकेत के रूप में भी पढ़ा जा सकता है, यद्यपि पुनर्स्थापना के प्रसंग में “पहले के समान” अधिक उपयुक्त है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּבְנֵי צִיּוֹן
  choice: और हे सिय्योन की सन्तानो
  rationale: בְּנֵי का शाब्दिक अर्थ ‘पुत्र’ है, पर यहाँ यह सिय्योन के समस्त लोगों के लिए सामूहिक सम्बोधन है। ‘सन्तानो’ पारिवारिक और वाचागत भाव बनाए रखते हुए केवल पुरुषों तक अर्थ सीमित नहीं करता; आरम्भिक וּ को ‘और’ से व्यक्त किया गया है।
- source_word: גִּילוּ וְשִׂמְחוּ
  choice: मगन हो और आनन्द मनाओ
  rationale: दोनों आज्ञार्थक क्रियाएँ आनन्द के आह्वान को बल देती हैं। यह हिन्दी में स्वाभाविक रहते हुए दोहरे कथन को सुरक्षित रखता है।
- source_word: בַּיהוָה אֱלֹהֵיכֶם
  choice: याहवे अपने परमेश्वर में
  rationale: व्यक्तिगत नाम יהוה को ‘याहवे’ से लिप्यन्तरित किया गया है। בְּ यहाँ आनन्द के आधार अथवा विषय को दर्शाता है, जिसे ‘में’ से व्यक्त किया गया है।
- source_word: כִּי נָתַן לָכֶם
  choice: क्योंकि उसने तुम्हें ... दी है
  rationale: כִּי आनन्द मनाने का कारण प्रस्तुत करता है। पूर्ण क्रिया נָתַן को वर्तमान परिणाम वाली पूर्ण घटना के रूप में ‘दी है’ कहा गया है।
- source_word: אֶת הַמּוֹרֶה לִצְדָקָה
  choice: धार्मिकता के लिए आरम्भिक वर्षा
  rationale: מוֹרֶה का अर्थ ‘शिक्षक’ या ‘आरम्भिक वर्षा’ हो सकता है; तुरन्त बाद आरम्भिक और अन्तिम वर्षा के उल्लेख के कारण मुख्य पाठ में वर्षा वाला अर्थ अधिक उपयुक्त है। לִצְדָקָה की कठिन और बहुअर्थी अभिव्यक्ति को ‘धार्मिकता के लिए’ कहकर उसके नैतिक-वाचागत शब्दभार को बनाए रखा गया है।
- source_word: וַיּוֹרֶד לָכֶם גֶּשֶׁם
  choice: वह तुम्हारे लिए वर्षा बरसाता है
  rationale: ירד का हिफ़ील रूप वर्षा को नीचे लाने या भेजने का कारणात्मक भाव देता है। हिन्दी में ‘वर्षा बरसाता है’ उसी भाव का स्वाभाविक रूप है।
- source_word: מוֹרֶה וּמַלְקוֹשׁ
  choice: आरम्भिक वर्षा और अन्तिम वर्षा
  rationale: ये देश के कृषि-चक्र की क्रमशः आरम्भिक/शरदकालीन और अन्तिम/वसन्तकालीन वर्षाओं के पारम्परिक पद हैं। ‘आरम्भिक’ और ‘अन्तिम’ मूल युग्म को बनाए रखते हैं।
- source_word: בָּרִאשׁוֹן
  choice: पहले के समान
  rationale: רִאשׁוֹן का अर्थ ‘पहला’ हो सकता है, पर पुनर्स्थापना के प्रसंग में क्रियाविशेषणीय अर्थ ‘पहले के समान’ उपयुक्त है। सम्भावित पंचांगीय अर्थ पादटिप्पणी में रखा गया है।
theological_decisions:
- issue: הַמּוֹרֶה को ‘आरम्भिक वर्षा’ या ‘धार्मिकता का/के लिए शिक्षक’ समझना
  choice: मुख्य पाठ में ‘आरम्भिक वर्षा’
  alternative: ‘धार्मिकता के लिए शिक्षक’ अथवा ‘धार्मिकता का शिक्षक’
  rationale: निकटतम कृषि-सन्दर्भ, विशेषतः आगे מוֹרֶה וּמַלְקוֹשׁ, मौसम सम्बन्धी अर्थ का प्रबल समर्थन करता है। फिर भी शिक्षक वाला वास्तविक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है, ताकि सम्भावित मसीही या शिक्षकीय व्याख्या को न तो थोपा जाए, न छिपाया जाए।
- issue: לִצְדָקָה का अर्थ
  choice: ‘धार्मिकता के लिए’
  alternative: ‘उचित मात्रा में’ अथवा ‘तुम्हारे न्याय-सिद्ध होने के लिए’
  rationale: צדקה में धार्मिकता, न्याय और वाचागत सहीपन का भार है। मुख्य पाठ अपेक्षाकृत शाब्दिक रहकर इस तनाव को सुरक्षित रखता है; अधिक व्याख्यात्मक अर्थ पादटिप्पणी में दिए गए हैं।
- issue: בָּרִאשׁוֹן का कालगत अर्थ
  choice: ‘पहले के समान’
  alternative: ‘पहले महीने में’
  rationale: पुनर्स्थापना के व्यापक प्रसंग में ‘पहले के समान’ सहज है, पर इब्रानी रूप पंचांगीय सन्दर्भ की सम्भावना भी रखता है; इसलिए वैकल्पिक अर्थ स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किन्तु गरिमापूर्ण रखी गई है। ‘सन्तानो’ सामूहिक और समावेशी सम्बोधन है; ‘मगन हो और आनन्द मनाओ’ काव्यात्मक समानता बनाए रखता है। कठिन इब्रानी पदों को मुख्य पाठ में कृत्रिम रूप से स्पष्ट करने के बजाय उनकी वास्तविक बहुअर्थकता पादटिप्पणियों में सुरक्षित की गई है।
