source:
  edition: WLC
  text: אַל תִּֽירְאוּ֙ בַּהֲמ֣וֹת שָׂדַ֔י כִּ֥י דָשְׁא֖וּ נְא֣וֹת מִדְבָּ֑ר כִּֽי עֵץ֙ נָשָׂ֣א פִרְי֔/וֹ תְּאֵנָ֥ה וָ/גֶ֖פֶן נָתְנ֥וּ חֵילָֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/022.yaml
  text: Do not fear[a], beasts of the field, for the pastures of the wilderness have become green; for the tree bears its fruit, the fig tree and the vine have given their wealth.
translation:
  language: hi
  text: हे खेतों के पशुओं, मत डरो! क्योंकि उजाड़ प्रदेश की चरागाहें हरी हो गई हैं; पेड़ अपना फल दे रहा है, और अंजीर का पेड़ तथा अंगूर की बेल भरपूर उपज दे रहे हैं।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּירְאוּ
  choice: मत डरो
  rationale: निषेधात्मक आज्ञा को सीधे और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: בַּהֲמוֹת שָׂדַי
  choice: हे मैदान के पशुओ
  rationale: प्रत्यक्ष संबोधन को बनाए रखता है; 'पशु' आधुनिक हिन्दी में स्वाभाविक है और שָׂדַי के खुले मैदानी क्षेत्र का अर्थ देता है।
- source_word: דָשְׁאוּ
  choice: हरी हो गई हैं
  rationale: क्रिया के अंकुरित होकर हरियाली छा जाने के परिणामात्मक अर्थ और पूर्ण पक्ष को सहज हिन्दी में व्यक्त करता है।
- source_word: נְאֹות מִדְבָּר
  choice: उजाड़ प्रदेश की चरागाहें
  rationale: נְאֹות को चरने के स्थान और מִדְבָּר को निर्जन अथवा असंवर्धित प्रदेश के रूप में व्यक्त करता है, बिना रेतीले मरुस्थल का अनिवार्य बोध कराए।
- source_word: עֵץ נָשָׂא פִרְיוֹ
  choice: पेड़ अपना फल दे रहा है
  rationale: इब्रानी के एकवचन सामूहिक चित्र को बनाए रखते हुए बहाली की वर्तमान उत्पादकता को स्वाभाविक हिन्दी में सामने लाता है।
- source_word: תְּאֵנָה וָגֶפֶן
  choice: अंजीर के पेड़ तथा अंगूर की बेल
  rationale: दोनों विशिष्ट फलदार पौधों की स्पष्ट और सामान्य हिन्दी पहचान देता है।
- source_word: נָתְנוּ חֵילָם
  choice: भरपूर उपज दी है
  rationale: कृषि-संदर्भ में חֵילָם पौधों की सामर्थ्य, उत्पादकता अथवा प्रचुर फलन को सूचित करता है; 'भरपूर उपज' उस आशय को स्पष्ट और स्वाभाविक हिन्दी में देता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। पशुओं को किए गए काव्यात्मक प्रत्यक्ष संबोधन और उजाड़ क्षेत्र की पुनर्स्थापित उर्वरता के भविष्यद्वाणीपरक चित्र को सुरक्षित रखा गया है।
