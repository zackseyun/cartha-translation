id: JOL.2.16
reference: Joel 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִסְפוּ עָ֞ם קַדְּשׁ֤וּ קָהָל֙ קִבְצ֣וּ זְקֵנִ֔ים אִסְפוּ֙ עֽוֹלָלִ֔ים וְ/יֹנְקֵ֖י שָׁדָ֑יִם יֵצֵ֤א חָתָן֙ מֵֽ/חֶדְר֔/וֹ וְ/כַלָּ֖ה מֵ/חֻפָּתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/016.yaml
  text: Gather the people[a]; consecrate the assembly; gather the elders; gather the children, even the nursing infants. Let the bridegroom come out from his room[c][b], and the bride from her chamber.
translation:
  language: hi
  text: 'लोगों को इकट्ठा करो;

    सभा को पवित्र करो;

    बुज़ुर्गों[a] को एकत्र करो;

    छोटे बच्चों को,

    यहाँ तक कि दूध पीते शिशुओं[b] को भी इकट्ठा करो।

    दूल्हा अपने कमरे से बाहर निकले,

    और दुल्हन अपने विवाह-मंडप[c] से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ उम्रदराज़ पुरुष या समुदाय के मान्य अगुए भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “स्तनों से दूध पीने वाले।”'
    reason: lexical_alternative
  - marker: c
    text: या “दुल्हन के कक्ष”; इब्रानी शब्द विवाह की छतरी, मंडप या वैवाहिक कक्ष को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִסְפוּ
  choice: इकट्ठा करो
  rationale: बहुवचन आज्ञार्थक क्रिया का सीधा और स्वाभाविक हिन्दी रूप; पद में इसकी पुनरावृत्ति भी यथासंभव बनाए रखी गई है।
- source_word: קַדְּשׁוּ קָהָל
  choice: सभा को पवित्र करो
  rationale: यह धार्मिक और सामुदायिक आह्वान है; ‘पवित्र करो’ सभा को परमेश्वर के लिए अलग करने का भाव रखता है, बिना अतिरिक्त अनुष्ठान जोड़ने के।
- source_word: קִבְצוּ זְקֵנִים
  choice: बुज़ुर्गों को एकत्र करो
  rationale: קבץ और אסף के निकट अर्थ होते हुए भी अलग क्रियाएँ हैं, इसलिए ‘एकत्र’ कुछ शब्दगत भिन्नता बनाए रखता है। זְקֵנִים आयु में बड़े पुरुषों अथवा समुदाय के मान्य अगुओं, दोनों का संकेत दे सकता है।
- source_word: עוֹלָלִים
  choice: छोटे बच्चों
  rationale: यह छोटे बच्चों को दर्शाता है; अगले पदबंध में दूध पीते शिशुओं का अलग उल्लेख होने से दोनों समूहों का अंतर सुरक्षित रहता है।
- source_word: יֹנְקֵי שָׁדָיִם
  choice: दूध पीते शिशुओं
  rationale: शाब्दिक चित्र ‘स्तनों से दूध पीने वालों’ का है; चुना हुआ रूप आधुनिक हिन्दी में स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: יֵצֵא חָתָן מֵחֶדְרוֹ
  choice: दूल्हा अपने कमरे से बाहर निकले
  rationale: अपूर्ण क्रिया का यहाँ आदेशात्मक/प्रेरणार्थक बल है। ‘बाहर निकले’ इस आह्वान को सहज हिन्दी में व्यक्त करता है।
- source_word: כַלָּה מֵחֻפָּתָהּ
  choice: दुल्हन अपने विवाह-मंडप से
  rationale: חֻפָּה विवाह की छतरी, मंडप या दुल्हन के कक्ष का संकेत कर सकता है। ‘विवाह-मंडप’ विवाह-संदर्भ को स्पष्ट रखते हुए मूल शब्द के प्रमुख अर्थ को व्यक्त करता है।
theological_decisions:
- issue: पवित्र सभा के आह्वान की भाषा
  choice: सभा को पवित्र करो
  alternative: सभा को अलग ठहराओ
  rationale: קדשׁ का यहाँ पवित्र प्रयोजन के लिए अलग करने का धार्मिक भाव है। ‘पवित्र करो’ उस गंभीर धार्मिक बल को बनाए रखता है, पर किसी विशिष्ट संप्रदायगत विधि को नहीं जोड़ता।
- issue: זְקֵנִים का सामाजिक अर्थ
  choice: बुज़ुर्गों
  alternative: समुदाय के अगुओं
  rationale: इब्रानी शब्द आयु और मान्य सामुदायिक पद—दोनों का बोध करा सकता है। मुख्य पाठ में सहज और व्यापक शब्द रखा गया है तथा पादटिप्पणी में वास्तविक अस्पष्टता बताई गई है।
- issue: חֻפָּה का स्थानगत अर्थ
  choice: विवाह-मंडप
  alternative: दुल्हन का कक्ष
  rationale: शब्द विवाह की छतरी/मंडप या वैवाहिक कक्ष के लिए प्रयुक्त हो सकता है। एक अर्थ मुख्य पाठ में और दूसरा पादटिप्पणी में देकर अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक पाठ के योग्य रखी गई है। समानांतर आज्ञाओं और सभी आयु-वर्गों को बुलाने की तीव्रता बनाए रखने के लिए छोटी पंक्तियाँ प्रयुक्त हुई हैं। ‘यहाँ तक कि’ मूल के וְ से निहित समावेशी बल को स्वाभाविक हिन्दी में स्पष्ट करता है।
