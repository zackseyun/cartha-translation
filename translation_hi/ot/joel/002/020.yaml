source:
  edition: WLC
  text: וְֽ/אֶת הַ/צְּפוֹנִ֞י אַרְחִ֣יק מֵ/עֲלֵי/כֶ֗ם וְ/הִדַּחְתִּי/ו֮ אֶל אֶ֣רֶץ צִיָּ֣ה וּ/שְׁמָמָה֒ אֶת פָּנָ֗י/ו אֶל הַ/יָּם֙ הַ/קַּדְמֹנִ֔י וְ/סֹפ֖/וֹ אֶל הַ/יָּ֣ם הָ/אַֽחֲר֑וֹן וְ/עָלָ֣ה בָאְשׁ֗/וֹ וְ/תַ֨עַל֙ צַחֲנָת֔/וֹ כִּ֥י הִגְדִּ֖יל לַ/עֲשֽׂוֹת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/joel/002/020.yaml
  text: And I will remove the northerner far from you[a], and I will drive him into a dry and desolate land, his front into the eastern sea and his rear into the western sea; his stench will rise, and his foul smell will rise[c][b], because he has done great things.
translation:
  language: hi
  text: “मैं उत्तरवाले को तुमसे बहुत दूर कर दूँगा[a] और उसे सूखी और उजाड़ भूमि में खदेड़ दूँगा; उसका अगला भाग पूर्वी समुद्र की ओर और उसका पिछला भाग पश्चिमी समुद्र की ओर होगा[b]। उसकी दुर्गंध उठेगी और उसकी सड़ाँध ऊपर चढ़ेगी, क्योंकि उसने बड़े काम किए हैं[c]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘उत्तरवाला’। यह एकवचन में मानवीकृत अभिव्यक्ति है; इसका अर्थ ‘उत्तरी सेना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘पूर्वी समुद्र’ से संभवतः मृत सागर और ‘पश्चिमी समुद्र’ से भूमध्य सागर अभिप्रेत है।
    reason: cultural_note
  - marker: c
    text: इसका अर्थ ‘क्योंकि उसने घमंड से काम किया है’ भी हो सकता है। इब्रानी मुहावरा शाब्दिक रूप से ‘क्योंकि उसने बड़े काम किए हैं’ है, पर यहाँ प्रसंग में इसका भाव नकारात्मक हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַצְּפוֹנִי
  choice: उत्तर से आनेवाला
  rationale: इब्रानी में शाब्दिक अर्थ ‘उत्तरवाला’ है और रूप एकवचन तथा मानवीकृत है। ‘उत्तर से आनेवाला’ आधुनिक हिन्दी में स्वाभाविक रहते हुए दिशा और एकवचन को बनाए रखता है; ‘सेना’ को मुख्य पाठ में जोड़कर अर्थ सीमित नहीं किया गया।
- source_word: אַרְחִיק מֵעֲלֵיכֶם
  choice: तुमसे बहुत दूर कर दूँगा
  rationale: हिफ़ील रूप किसी को दूर करने का कारणात्मक भाव व्यक्त करता है; ‘बहुत दूर कर दूँगा’ हिन्दी में इस स्थानिक बल को स्पष्ट रखता है।
- source_word: וְהִדַּחְתִּיו
  choice: उसे ... खदेड़ दूँगा
  rationale: क्रिया बलपूर्वक दूर धकेलने या निकालने का भाव रखती है। ‘खदेड़ दूँगा’ आक्रमणकारी अथवा मानवीकृत समूह के प्रसंग में स्वाभाविक है।
- source_word: אֶרֶץ צִיָּה וּשְׁמָמָה
  choice: एक सूखी और उजाड़ भूमि
  rationale: צִיָּה सूखेपन और שְׁמָמָה निर्जन उजाड़ अवस्था को व्यक्त करते हैं; दोनों विशेषताओं को अलग-अलग बनाए रखा गया है।
- source_word: פָּנָיו ... סֹפוֹ
  choice: उसके अगले भाग ... उसके पिछले भाग
  rationale: פָּנָיו का मूल अर्थ ‘उसका मुख’ और סֹפוֹ का अर्थ ‘उसका अंत’ है; परस्पर विरोधी स्थानिक प्रयोग में ये किसी मानवीकृत दल के अग्र और पश्च भाग को दर्शाते हैं। ‘अगला भाग/पिछला भाग’ देह-आधारित रूपक को सैन्य पारिभाषिक शब्दों से अधिक सीमित नहीं करता।
- source_word: הַיָּם הַקַּדְמֹנִי
  choice: पूर्वी समुद्र
  rationale: दिशात्मक इब्रानी पद को मुख्य पाठ में रखा गया है; संभावित भौगोलिक पहचान को पादटिप्पणी में दिया गया है।
- source_word: הַיָּם הָאַחֲרוֹן
  choice: पश्चिमी समुद्र
  rationale: शाब्दिक ‘पिछला समुद्र’ प्राचीन दिशाबोध में पश्चिमी समुद्र का संकेत है। अनुवाद दिशात्मक अर्थ देता है, जबकि विशिष्ट समुद्र की पहचान पादटिप्पणी में रहती है।
- source_word: בָאְשׁוֹ ... צַחֲנָתוֹ
  choice: उसकी दुर्गंध ... उसकी सड़ाँध
  rationale: दोनों निकटार्थी पदों के घृणित गंध-संबंधी समानांतर बल को दो स्वाभाविक हिन्दी शब्दों द्वारा सुरक्षित रखा गया है।
- source_word: כִּי הִגְדִּיל לַעֲשׂוֹת
  choice: क्योंकि उसने बड़े काम किए हैं
  rationale: इब्रानी मुहावरे की शब्दावली को जानबूझकर सुरक्षित रखा गया है। प्रसंग में इसका भाव घमंडी या हद से बढ़कर किए गए काम हो सकता है, पर मुख्य पाठ इस नकारात्मक व्याख्या को अनिवार्य नहीं बनाता।
theological_decisions:
- issue: ‘उत्तर से आनेवाले’ की पहचान
  choice: एकवचन में मानवीकृत शत्रु या आक्रमणकारी दल
  alternative: उत्तरी हवा; कोई विशिष्ट ऐतिहासिक राष्ट्र; अथवा मानवीकृत टिड्डी-दल
  rationale: एकवचन रूप और उसके अगले तथा पिछले भाग का चित्रण मानवीकरण के अनुकूल है। पद स्वयं किसी खास राष्ट्र या केवल प्राकृतिक घटना की पहचान निश्चित नहीं करता, इसलिए मुख्य पाठ उस प्रश्न को खुला रखता है।
- issue: ‘उसने बड़े काम किए हैं’ का नैतिक भाव
  choice: मुख्य पाठ में इब्रानी मुहावरे की अस्पष्टता बनाए रखना
  alternative: ‘उसने घमंड से काम किया है’ अथवा ‘उसने हद से बढ़कर काम किए हैं’
  rationale: निकट प्रसंग में न्याय पाए शत्रु के कारण इसका नकारात्मक भाव संभव है, जबकि यही मूल अभिव्यक्ति महान कार्यों के सकारात्मक अर्थ में भी प्रयुक्त हो सकती है। इसलिए व्याख्यात्मक नकारात्मक अर्थ पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। वाक्य की काव्यात्मक समानांतरता—अगला/पिछला भाग और दुर्गंध/सड़ाँध—सुरक्षित है। विशिष्ट सैन्य या ऐतिहासिक पहचान मुख्य पाठ पर आरोपित नहीं की गई।
