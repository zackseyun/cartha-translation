reference: Song of Songs 3:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ/מְעַט֙ שֶׁ/עָבַ֣רְתִּי מֵ/הֶ֔ם עַ֣ד שֶֽׁ/מָּצָ֔אתִי אֵ֥ת שֶׁ/אָהֲבָ֖ה נַפְשִׁ֑/י אֲחַזְתִּי/ו֙ וְ/לֹ֣א אַרְפֶּ֔/נּוּ עַד שֶׁ֤/הֲבֵיאתִי/ו֙ אֶל בֵּ֣ית אִמִּ֔/י וְ/אֶל חֶ֖דֶר הוֹרָתִֽ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/004.yaml
  text: I had scarcely passed by them when I found the one my soul loves[a]. I held on to him and would not let him go until I had brought him into my mother's house[b], into the chamber of the one who conceived me.
translation:
  language: hi
  text: मैं उनसे थोड़ा ही आगे निकली थी कि मुझे वह मिल गया, जिससे मेरा प्राण प्रेम करता है[a]। मैंने उसे थाम लिया और तब तक जाने न दिया, जब तक मैं उसे अपनी माँ के घर में, उस स्त्री की कोठरी में न ले आई जिसने मुझे गर्भ में धारण किया था[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “वह, जिससे मेरा प्राण प्रेम करता है।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “उसकी कोठरी जिसने मुझे गर्भ में धारण किया था”; यह “मेरी माँ के घर” के समानांतर एक काव्यात्मक अभिव्यक्ति है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּמְעַט שֶׁעָבַרְתִּי מֵהֶם
  choice: मैं उनसे थोड़ा ही आगे निकली थी
  rationale: כִּמְעַט का मूल भाव ‘थोड़ा ही’ है और עבר מן पहरेदारों से आगे निकल जाने की गति बताता है। यह हिंदी में निकट-अंतराल और कथा की गति दोनों स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַד שֶׁמָּצָאתִי
  choice: कि मुझे ... मिल गया
  rationale: यहाँ עַד שֶׁ औपचारिक रूप से ‘जब तक’ हो सकता है, पर כִּמְעַט के साथ वाक्य तत्काल घटित खोज को दर्शाता है; ‘कि’ हिंदी में उसी निकटता को सहजता से जोड़ता है।
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: वह ... जिससे मेरा प्राण प्रेम करता है
  rationale: निश्चित प्रिय पुरुष का संकेत बनाए रखा गया है और נֶפֶשׁ को केवल ‘मैं’ में समतल करने के बजाय ‘प्राण’ द्वारा काव्यात्मक तथा भावात्मक गहराई सुरक्षित रखी गई है।
- source_word: אֲחַזְתִּיו
  choice: मैंने उसे थाम लिया
  rationale: אחז पकड़ने या दृढ़ता से थामे रहने का अर्थ देता है। ‘थाम लिया’ स्नेहपूर्ण दृढ़ता व्यक्त करता है, बिना अनावश्यक हिंसक अर्थ के।
- source_word: וְלֹא אַרְפֶּנּוּ
  choice: और ... जाने न दिया
  rationale: हिफ़ील रूप यहाँ छोड़ देने या पकड़ ढीली करने का अर्थ देता है। ‘जाने न दिया’ वर्तमान हिंदी में स्वाभाविक है और भावनात्मक दृढ़ता बनाए रखता है।
- source_word: עַד שֶׁהֲבֵיאתִיו
  choice: जब तक मैं उसे ... न ले आई
  rationale: עַד שֶׁ की सीमावाचक संरचना को ‘जब तक ... न’ से प्रत्यक्ष रखा गया है। स्त्री वक्ता के अनुरूप ‘ले आई’ प्रयुक्त है।
- source_word: אֶל בֵּית אִמִּי
  choice: अपनी माँ के घर में
  rationale: गंतव्य के भीतर पहुँचाने का भाव ‘घर में ... ले आई’ से स्पष्ट और सहज है।
- source_word: וְאֶל חֶדֶר הוֹרָתִי
  choice: अपनी गर्भधारिणी की कोठरी में
  rationale: הוֹרָתִי गर्भधारण कराने/मुझे गर्भ में धारण करने वाली की ओर संकेत करता है। ‘गर्भधारिणी’ मातृ-समानांतरता को दोहराए बिना मूल की विशिष्ट काव्यात्मक अभिव्यक्ति बचाता है; חֶדֶר के लिए ‘कोठरी’ अंतरंग भीतरी कक्ष का भाव देता है।
