    issue: “अपनी गर्भधारिणी की कोठरी” is semantically and idiomatically imprecise.
    rationale: In current Hindi, “गर्भधारिणी” primarily means a pregnant woman. Hebrew הוֹרָתִי identifies the woman who conceived/bore the speaker. A relative clause clearly conveys this while preserving the Hebrew’s poetic non-repetition of “mother.”
