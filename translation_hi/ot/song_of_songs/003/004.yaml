  register: आधुनिक मानक हिंदी में सहज किंतु काव्यात्मक और गरिमापूर्ण शैली रखी गई है। स्त्री वक्ता का व्याकरणिक लिंग ‘निकली’ और ‘ले आई’ से स्पष्ट है। ‘प्राण’ मूल נֶפֶשׁ की भावात्मक बनावट बचाता है, और ‘गर्भधारिणी’ मूल की असामान्य काव्यात्मक समानांतरता को सुरक्षित रखता है।
