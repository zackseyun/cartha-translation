base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/002.yaml
  text: I will rise now and go about the city[a], in the marketplaces and in the streets; I will seek the one my soul loves. I sought him, but I did not find him.
translation:
  language: hi
  text: अब मैं उठूँगी और नगर में—बाज़ारों और सड़कों पर—घूमूँगी। मैं उसे ढूँढ़ूँगी, जिससे मेरा प्राण प्रेम करता है।[a] मैंने उसे ढूँढ़ा, पर उसे नहीं पाया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक शाब्दिक, “वह, जिससे मेरा प्राण प्रेम करता है।”
    reason: ‘मेरा प्राण’ नֶפֶשׁ के निकट है; यह वैकल्पिक रूप मूल के औपचारिक संबंधवाचक ढाँचे को स्पष्ट करता है।
lexical_decisions:
- source_word: אָקוּמָה נָּא
  choice: अब मैं उठूँगी
  rationale: स्त्री वक्ता का cohortative रूप संकल्प या आत्म-प्रेरणा व्यक्त करता है; נָא यहाँ विनम्र निवेदन से अधिक तात्कालिकता दर्शाता है।
- source_word: וַאֲסוֹבְבָה בָעִיר
  choice: और नगर में घूमूँगी
  rationale: סבב नगर में इधर-उधर जाकर खोजने का भाव देता है। ‘घूमूँगी’ आधुनिक हिन्दी में स्वाभाविक है और गति की व्यापकता बनाए रखता है।
- source_word: בַּשְּׁוָקִים
  choice: बाज़ारों
  rationale: שׁוּק सार्वजनिक बाज़ार अथवा व्यापारिक स्थान को सूचित करता है; ‘बाज़ारों’ इसका स्पष्ट और प्रचलित हिन्दी रूप है।
- source_word: וּבָרְחֹבוֹת
  choice: और चौड़ी सड़कों पर
  rationale: רְחֹבוֹת खुले, विस्तृत सार्वजनिक मार्गों या स्थानों को दर्शाता है। ‘चौड़ी सड़कों’ से मूल का विस्तार-बोध बना रहता है और ‘बाज़ारों’ के साथ अनावश्यक समानार्थकता नहीं आती।
- source_word: אֲבַקְשָׁה
  choice: मैं उसे ढूँढ़ूँगी
  rationale: בקשׁ का अर्थ खोजने या ढूँढ़ने का प्रयत्न करना है। ‘ढूँढ़ूँगी’ सामान्य आधुनिक हिन्दी में भावपूर्ण और सहज है।
- source_word: אֵת שֶׁאָהֲבָה נַפְשִׁי
  choice: उसे, जिससे मेरा प्राण प्रेम करता है
  rationale: यह रूप נפשׁ को ‘प्राण’ के रूप में बनाए रखता है और प्रेम करने वाले व्याकरणिक कर्ता के रूप में मूल वाक्य-संरचना को निकटता से दर्शाता है।
- source_word: בִּקַּשְׁתִּיו וְלֹא מְצָאתִיו
  choice: मैंने उसे ढूँढ़ा, पर उसे नहीं पाया
  rationale: दोनों क्रियाओं से जुड़े पुल्लिंग एकवचन कर्म-सर्वनाम स्पष्ट रखे गए हैं। ‘पर’ खोज और असफलता के बीच निहित विरोध को स्वाभाविक हिन्दी में व्यक्त करता है।
