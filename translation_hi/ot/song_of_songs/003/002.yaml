  verdict: revise
  source_fidelity: The draft accurately conveys the female speaker’s resolve, her movement through the city, the search, and its unsuccessful outcome. However, “चौड़ी सड़कों” adds a degree of width not required by רְחֹבוֹת; “सड़कों” more safely retains the public-street sense.
  naturalness: The draft is generally clear and appropriately poetic. Reordering the first sentence lets “बाज़ारों और सड़कों पर” modify “घूमूँगी” directly and reads more fluidly in modern Hindi.
  terminology: “नगर,” “प्राण,” and “प्रेम करता है” suitably preserve the elevated poetic register and the lexical force of עִיר and נֶפֶשׁ. The masculine object is retained without introducing an interpretive identity.
  issues:
  - severity: low
    issue: “चौड़ी सड़कों” is more specific than the Hebrew.
    rationale: רְחֹבוֹת can denote streets or open public places, but the text does not explicitly state that they are broad. “सड़कों” is faithful and idiomatic.
  - severity: low
    issue: The existing footnote is an interpretive idiomatic paraphrase rather than a close lexical alternative.
    rationale: The audit-trail note concerns the more formal expression “him whom my soul loves.” A note giving the formal Hindi wording better corresponds to that alternative while retaining the anchor.
