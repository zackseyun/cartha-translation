  rationale: मूल क्रिया सामान्यतः ‘बनाया’ है, पर राजा और राजसी पालकी के प्रसंग में हिन्दी का कारक रूप ‘बनवाई’ स्वाभाविक है; इससे यह अनिवार्यतः नहीं कहा जाता कि सुलैमान ने उसे अपने हाथों बनाया।
- source_word: לּוֹ
  choice: अपने लिए
  rationale: पूर्वसर्ग और सर्वनाम-प्रत्यय का शाब्दिक अर्थ ‘उसके लिए’ हो सकता है, पर अगले पदबंध में सुलैमान कर्ता है; इसलिए यहाँ आत्मवाचक अर्थ ‘अपने लिए’ स्वाभाविक है।
- source_word: הַמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान
  rationale: उपाधि और नाम का आधुनिक हिन्दी में स्वाभाविक क्रम।
- source_word: מֵעֲצֵי
  choice: पेड़ों की लकड़ी से
  rationale: मूल में ‘पेड़ों से’ है और आशय निर्माण-सामग्री का है। हिन्दी में ‘पेड़ों की लकड़ी से’ स्रोत-चित्र और आशय दोनों स्पष्ट करता है।
- source_word: הַלְּבָנוֹן
  choice: लबानोन
  rationale: इब्रानी स्थान-नाम לְבָנוֹן का स्रोत-सन्निकट हिन्दी लिप्यंतरण।
