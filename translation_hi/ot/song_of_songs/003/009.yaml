lexical_decisions:
- source_word: אַפִּרְיוֹן
  choice: पालकी
  rationale: यह दुर्लभ शब्द किसी भव्य, उठाकर ले जाए जाने वाले राजसी वाहन को सूचित करता है। आधुनिक हिन्दी में ‘पालकी’ सबसे स्वाभाविक निकटतम शब्द है, जबकि सटीक स्वरूप की अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: עָשָׂה
