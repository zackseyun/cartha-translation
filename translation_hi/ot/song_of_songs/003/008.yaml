  verdict: revise
  source_fidelity: The draft accurately conveys the armed, battle-trained group and the causal sense of the final phrase. However, ‘रातों के आतंक’ can mean terror belonging to the nights, whereas the Hebrew locates the terror/danger ‘in the nights.’ The revision makes that relation explicit while retaining the Hebrew plural.
  naturalness: The wording is generally modern and dignified. ‘रातों में होने वाले आतंक’ is clearer and more idiomatic in Hindi than ‘रातों के आतंक.’
  terminology: ‘तलवार थामे हुए,’ ‘युद्ध में प्रशिक्षित,’ and ‘जाँघ पर’ appropriately preserve the military imagery. ‘हर एक पुरुष’ represents the distributive masculine singular איש more explicitly than ‘हर एक.’
  issues:
  - severity: medium
    issue: The phrase ‘रातों के आतंक’ ambiguously recasts the Hebrew locative phrase as a genitive construction.
    rationale: בַּלֵּילוֹת means ‘in the nights’; with מִפַּחַד it denotes fear/terror associated with nighttime. Hindi ‘रातों के आतंक’ may be read as ‘the nights’ terror,’ rather than terror occurring in the nights.
  - severity: low
    issue: ‘हर एक’ does not explicitly reflect the masculine singular איש.
    rationale: Though idiomatic Hindi may use ‘हर एक’ generically, ‘हर एक पुरुष’ more closely represents the source’s distributive masculine wording in this armed-guard image.
