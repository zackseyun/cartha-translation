base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/008.yaml
  text: All of them are holding swords[a], trained in warfare; each man has his sword at his thigh because of terror in the nights.
translation:
  language: hi
  text: 'वे सभी तलवार थामे हुए और युद्ध में प्रशिक्षित हैं;

    रातों[a] में होने वाले आतंक के कारण हर एक पुरुष की तलवार उसकी जाँघ पर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘रात के समय।’ इब्रानी में शाब्दिक रूप से ‘रातों में’ है; यह बहुवचन रात के खतरे को काव्यात्मक रूप से अधिक तीव्र कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כֻּלָּם
  choice: वे सभी
  rationale: सर्वनाम-प्रत्यय सहित यह रूप पूरे समूह को स्पष्ट रूप से समेटता है; ‘वे सभी’ सहज हिन्दी में इसकी समग्रता बनाए रखता है।
- source_word: אֲחֻזֵי חֶרֶב
  choice: तलवार थामे हुए
  rationale: אחז का कृदन्तीय प्रयोग यहाँ तलवार पकड़े या धारण किए हुए सशस्त्र पुरुषों का चित्र प्रस्तुत करता है। सामूहिक संदर्भ में हिन्दी का एकवचन ‘तलवार’ स्वाभाविक वितरणात्मक अर्थ देता है।
- source_word: מְלֻמְּדֵי מִלְחָמָה
  choice: युद्ध में प्रशिक्षित
  rationale: למד का यह रूप सिखाए या प्रशिक्षित किए जाने को दर्शाता है; यह अनुवाद सैनिक तैयारी का व्यापक अर्थ स्वाभाविक ढंग से व्यक्त करता है।
- source_word: אִישׁ
  choice: हर एक
  rationale: बहुवचन समूह के बाद आया एकवचन אִישׁ वितरणात्मक है। ‘हर एक’ प्रत्येक सशस्त्र पुरुष की ओर संकेत करता है और हिन्दी में अनावश्यक पुनरुक्ति से बचता है।
- source_word: חַרְבּוֹ עַל יְרֵכוֹ
  choice: हर एक की तलवार उसकी जाँघ पर है
  rationale: वाक्यांश तलवार को ऊपरी पैर या कमर के पास तैयार स्थिति में धारण करने का दृश्य देता है। ‘जाँघ पर’ मूल स्थानगत बिंब को सुरक्षित रखता है; ‘बँधी’ जैसा अनुल्लिखित विवरण नहीं जोड़ा गया।
- source_word: מִפַּחַד
  choice: आतंक के कारण
  rationale: यहाँ מִן कारणसूचक है, और פַּחַד साधारण चिंता से अधिक तीव्र भय को व्यक्त कर सकता है; इसलिए ‘आतंक के कारण’ सुरक्षात्मक संदर्भ के अनुकूल है।
- source_word: בַּלֵּילוֹת
  choice: रातों
  rationale: मूल इब्रानी में बहुवचन है। ‘रातों’ उसके काव्यात्मक बहुवचन और बार-बार उपस्थित रात्रिकालीन खतरे की संभावना, दोनों को खुला रखता है।
