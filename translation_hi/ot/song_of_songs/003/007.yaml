  yaml_path: translation/ot/song_of_songs/003/007.yaml
  text: Look[a], it is Solomon’s couch; sixty mighty men are around it, from the mighty men of Israel.
translation:
  language: hi
  text: देखो[a], यह सुलैमान की शय्या है; उसके चारों ओर साठ वीर हैं, जो इस्राएल के वीरों में से हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बिस्तर’; इब्रानी शब्द बिस्तर या शय्या को सूचित कर सकता है। आस-पास के प्रसंग को देखते हुए कुछ लोग यहाँ इसे राजकीय पालकी या डोली समझते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנֵּה
  choice: देखो
  rationale: दृश्य की ओर ध्यान खींचने वाला संकेतक है; ‘देखो’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी में इसका बल बनाए रखता है।
- source_word: מִטָּתוֹ
  choice: उसकी शय्या
  rationale: מִטָּה बिस्तर, शय्या अथवा लेटने के आसन को सूचित कर सकता है। ‘शय्या’ इस अर्थ-विस्तार को काफी हद तक खुला रखती है और प्रसंग के आधार पर इसे पालकी निश्चित नहीं करती।
- source_word: שֶׁלִּשְׁלֹמֹה
  choice: सुलैमान की
  rationale: यह संबंध/स्वामित्व दर्शाता है; हिन्दी का संबंधकारक इसका स्वाभाविक अनुवाद है।
- source_word: שִׁשִּׁים
  choice: साठ
  rationale: मूल की निश्चित संख्या का सीधा अनुवाद।
- source_word: גִּבֹּרִים
  choice: वीर
  rationale: यह बलवान और युद्ध-कुशल पुरुषों को सूचित करता है। ‘वीर’ संक्षिप्त और स्वाभाविक है तथा पद में शब्द की पुनरावृत्ति बनाए रखता है।
- source_word: סָבִיב לָהּ
  choice: उसके चारों ओर
  rationale: स्त्रीलिंग प्रत्यय का संदर्भ स्त्रीलिंग संज्ञा מִטָּה से है; हिन्दी में ‘उसके’ निर्जीव वस्तु के लिए स्वाभाविक है और चारों ओर की स्थिति स्पष्ट करता है।
- source_word: מִגִּבֹּרֵי יִשְׂרָאֵל
  choice: इस्राएल के वीरों में से
  rationale: 'מִן चयन का भाव देता है: ये साठ पुरुष इस्राएल के वीरों में से लिए गए हैं। ‘में से’ इस अर्थ को स्पष्टतः सुरक्षित रखता है।'
