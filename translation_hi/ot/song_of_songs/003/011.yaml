  text: צְאֶ֧ינָה וּֽ/רְאֶ֛ינָה בְּנ֥וֹת צִיּ֖וֹן בַּ/מֶּ֣לֶךְ שְׁלֹמֹ֑ה בָּ/עֲטָרָ֗ה שֶׁ/עִטְּרָה לּ֤/וֹ אִמּ/וֹ֙ בְּ/י֣וֹם חֲתֻנָּת֔/וֹ וּ/בְ/י֖וֹם שִׂמְחַ֥ת לִבּֽ/וֹ׀־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/011.yaml
  text: Go out and look[a], O daughters of Zion, at King Solomon, with the crown with which his mother crowned him on the day of his wedding, on the day of the joy of his heart.
translation:
  language: hi
  text: हे सिय्योन की बेटियो, बाहर निकलो और राजा सुलैमान को उस मुकुट को पहने हुए देखो[a], जो उसकी माता ने उसे उसके विवाह के दिन, उसके हृदय के आनन्द के दिन, पहनाया था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उस पुष्पमाला में’; इब्रानी शब्द עֲטָרָה किसी उत्सवी मुकुट या पुष्पमाला का भी बोध करा सकता है, जो विवाह के प्रसंग के अनुकूल है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צְאֶינָה וּרְאֶינָה
  choice: बाहर निकलो और ... देखो
  rationale: दोनों स्त्रीलिंग बहुवचन आज्ञार्थक क्रियाओं को स्पष्ट और स्वाभाविक हिन्दी में रखा गया है; आह्वान सिय्योन की बेटियों से है।
- source_word: בְּנוֹת צִיּוֹן
  choice: हे सिय्योन की बेटियो
  rationale: सम्बोधन को काव्यात्मक किंतु आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בַּמֶּלֶךְ שְׁלֹמֹה
  choice: राजा सुलैमान को
  rationale: ראה के साथ ב यहाँ देखने के लक्ष्य को चिह्नित करता है; हिन्दी में ‘को ... देखो’ स्वाभाविक है।
- source_word: בָּעֲטָרָה
  choice: उस मुकुट में
  rationale: ב को परिस्थितिसूचक रूप में लिया गया है—सुलैमान उस मुकुट को पहने हुए दिखाई देता है। यह ‘मुकुट पहने हुए’ की अपेक्षा इब्रानी संरचना के निकट है।
- source_word: עֲטָרָה
  choice: मुकुट
  rationale: शब्द मुकुट अथवा उत्सवी पुष्पमाला का बोध करा सकता है। मुख्य पाठ में व्यापक अर्थ वाला ‘मुकुट’ रखा गया और विवाह-सन्दर्भ में सम्भव विकल्प पादटिप्पणी में दिया गया है।
- source_word: שֶׁעִטְּרָה לוֹ אִמּוֹ
  choice: जो उसकी माता ने ... उसे पहनाया था
  rationale: हिन्दी में मुकुट के साथ ‘पहनाना’ स्वाभाविक है। इससे माता द्वारा उस पर मुकुट रखने का अर्थ स्पष्ट रहता है, यद्यपि संज्ञा और क्रिया की इब्रानी शब्द-क्रीड़ा पूरी तरह नहीं दोहरती।
- source_word: בְּיוֹם חֲתֻנָּתוֹ
  choice: उसके विवाह के दिन
  rationale: חֲתֻנָּה को विवाह अथवा विवाहोत्सव के रूप में समझा जा सकता है; यह चयन निकट और सहज है।
- source_word: וּבְיוֹם שִׂמְחַת לִבּוֹ
  choice: उसके हृदय के आनन्द के दिन
  rationale: मूल की समानान्तर समय-सूचक रचना और काव्यात्मक संबंधवाचक पद को सुरक्षित रखा गया है।
