base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/010.yaml
  text: He made its pillars of silver[a], its back of gold, its seat of purple[c][b]; its interior was inlaid with love by the daughters of Jerusalem.
translation:
  language: hi
  text: 'उसने उसके खंभे चाँदी के बनाए,

    उसका सहारा सोने का,

    और उसका आसन बैंगनी वस्त्र का;

    उसका भीतरी भाग प्रेम से जड़ा गया था,

    यरूशलेम की बेटियों के द्वारा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसका भीतरी भाग प्रेम से जड़ा गया था—यरूशलेम की बेटियों की ओर से।” “सहारा,” “आसन” और “जड़ा गया” के मूल इब्रानी शब्दों का इस संदर्भ में ठीक आशय अनिश्चित है; अंतिम पंक्ति का संबंध भी एक से अधिक प्रकार से समझा जा सकता है।
    reason: lexical_and_syntactic_alternative
lexical_decisions:
- source_word: עַמּוּדָיו
  choice: उसके खंभे
  rationale: संज्ञा का सामान्य अर्थ खंभे या स्तंभ है; पालकी के संदर्भ में ‘खंभे’ स्वाभाविक और चित्रात्मक है।
- source_word: עָשָׂה
  choice: उसने ... बनाए
  rationale: सामान्य क्रिया ‘बनाना’ का सीधा अनुवाद; पुल्लिंग एकवचन कर्ता संदर्भ से सुलैमान है।
- source_word: כֶסֶף
  choice: चाँदी
  rationale: धातु के लिए मानक हिन्दी शब्द।
- source_word: רְפִידָתוֹ
  choice: उसका सहारा
  rationale: यह दुर्लभ और अनिश्चित शब्द किसी टिकाव, आधार या सहायक हिस्से का बोध करा सकता है। ‘सहारा’ अनिश्चितता को किसी खास संरचना तक सीमित किए बिना बनाए रखता है।
- source_word: זָהָב
  choice: सोना
  rationale: धातु के लिए मानक हिन्दी शब्द।
- source_word: מֶרְכָּבוֹ
  choice: उसका आसन
  rationale: शब्द सामान्यतः सवारी या वाहन से जुड़ा है, पर यहाँ पालकी में बैठने या सवारी करने के स्थान का अर्थ संदर्भानुकूल है।
- source_word: אַרְגָּמָן
  choice: बैंगनी वस्त्र
  rationale: यह राजसी बैंगनी रंग की सामग्री या कपड़े को सूचित करता है; ‘वस्त्र’ जोड़ने से हिन्दी में भौतिक अर्थ स्पष्ट होता है।
- source_word: תּוֹכוֹ
  choice: उसका भीतरी भाग
  rationale: पालकी के अंदरूनी हिस्से के लिए सहज और स्पष्ट हिन्दी।
- source_word: רָצוּף
  choice: जड़ा गया था
  rationale: किसी सतह पर सजावटी सामग्री बिछाने, लगाने या जड़ने का भाव; राजसी पालकी के वर्णन में ‘जड़ा’ स्वाभाविक है।
- source_word: אַהֲבָה
  choice: प्रेम से
  rationale: मसोरी पाठ का सीधा अर्थ ‘प्रेम’ है। अभिव्यक्ति असामान्य और काव्यात्मक है, इसलिए इसे किसी अनुमानित भौतिक सामग्री से प्रतिस्थापित नहीं किया गया।
- source_word: מִבְּנוֹת יְרוּשָׁלִָם
  choice: यरूशलेम की बेटियों के द्वारा
  rationale: מִן यहाँ कर्तृत्व या स्रोत दोनों दर्शा सकता है। मुख्य पाठ में कर्तृत्व रखा गया है, जबकि स्रोत की संभावना पादटिप्पणी में सुरक्षित है।
