  text: מִ֣י זֹ֗את עֹלָה֙ מִן הַ/מִּדְבָּ֔ר כְּ/תִֽימֲר֖וֹת עָשָׁ֑ן מְקֻטֶּ֤רֶת מוֹר֙ וּ/לְבוֹנָ֔ה מִ/כֹּ֖ל אַבְקַ֥ת רוֹכֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/006.yaml
  text: Who is this coming up from the wilderness like columns of smoke[a], perfumed with myrrh and frankincense[c][b], from every fragrant powder of the merchant?
translation:
  language: hi
  text: 'यह कौन है, जो निर्जन प्रदेश[a] से ऊपर चली आ रही है,

    धुएँ के स्तंभों[b] के समान,

    गन्धरस और लोबान से,

    और व्यापारी के हर सुगंधित चूर्ण से सुवासित?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “रेगिस्तान।”
    reason: מִדְבָּר निर्जन या उजाड़ प्रदेश, अथवा रेगिस्तान का बोध करा सकता है।
  - marker: b
    text: या, “धुएँ के ऊँचे गुबारों।”
    reason: תִּימֲרוֹת का आशय ऊपर उठती स्तंभाकार धुएँ की धाराओं या गुबारों से हो सकता है।
lexical_decisions:
- source_word: מִי זֹאת
  choice: यह कौन है
  rationale: प्रश्नवाचक सर्वनाम और स्त्रीलिंग संकेतवाचक का स्वाभाविक हिन्दी रूप। आगे स्त्रीलिंग क्रिया मूल पाठ के स्त्रीलिंग संकेत को स्पष्ट रखती है।
- source_word: עֹלָה
  choice: ऊपर चली आ रही है
  rationale: यह ऊपर की ओर गति और बोलने वाले की दिशा में आने—दोनों भावों को स्वाभाविक हिन्दी में व्यक्त करता है; स्त्रीलिंग रूप मूल व्याकरण के अनुरूप है।
- source_word: מִן הַמִּדְבָּר
  choice: निर्जन प्रदेश से
  rationale: מִדְבָּר का अर्थ केवल रेतीला मरुस्थल नहीं, बल्कि निर्जन या उजाड़ भूभाग भी हो सकता है।
- source_word: כְּתִימֲרוֹת עָשָׁן
  choice: धुएँ के स्तंभों के समान
  rationale: תִּימֲרוֹת ऊपर उठते हुए स्तंभाकार धुएँ का चित्र प्रस्तुत करता है; यह रूप दृश्य और काव्यात्मक दोनों है।
- source_word: מְקֻטֶּרֶת
  choice: सुवासित
  rationale: निष्क्रिय कृदन्त यहाँ सुगंधित द्रव्यों से महकाए जाने या उनके धुएँ से सुगंधित होने का परिणाम बताता है; ‘सुवासित’ आधुनिक हिन्दी में स्पष्ट और गरिमापूर्ण है।
- source_word: מוֹר וּלְבוֹנָה
  choice: गन्धरस और लोबान
  rationale: इन दोनों सुगंधित रालों के लिए प्रचलित हिन्दी बाइबलीय नाम रखे गए हैं।
- source_word: מִכֹּל אַבְקַת רוֹכֵל
  choice: व्यापारी के हर सुगंधित चूर्ण से
  rationale: אַבְקַת का मूल अर्थ चूर्ण या धूल है; प्रसंग इसे सुगंधित पदार्थ बताता है। רוֹכֵל व्यापारी या फेरीवाले को सूचित करता है। מִן को यहाँ सुगंध के साधन या स्रोत के अर्थ में ‘से’ रखा गया है।
