- source_word: נַפְשִׁי
  choice: मेरा प्राण
  rationale: נֶפֶשׁ का अर्थ प्रसंगानुसार प्राण, जीवन, स्वयं या अंतर्मन हो सकता है। यहाँ ‘मेरा प्राण’ मूल की काव्यात्मक गहराई और तीव्र प्रेमभाव बनाए रखता है।
- source_word: בִּקַּשְׁתִּיו
  choice: मैंने उसे खोजा
  rationale: मूल में क्रिया की पुनरावृत्ति और पुरुषवाचक प्रत्यय दोनों स्पष्ट हैं; इसलिए समानान्तरता और बल बनाए रखने के लिए पूरा वाक्यांश दोहराया गया है।
- source_word: וְלֹא מְצָאתִיו
  choice: पर वह मुझे नहीं मिला
  rationale: ‘पर’ असफल परिणाम का विरोधात्मक भाव स्वाभाविक रूप से व्यक्त करता है; ‘वह मुझे नहीं मिला’ מצא के अर्थ और पुरुषवाचक संदर्भ को स्पष्ट रखता है।
