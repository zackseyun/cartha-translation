  text: On my bed in the nights I sought the one my soul loves; I sought him[a], but I did not find him.
translation:
  language: hi
  text: रातों को[a] अपने बिस्तर पर मैंने उसे खोजा, जिसे मेरा प्राण प्रेम करता है; मैंने उसे खोजा, पर वह मुझे नहीं मिला।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘रातों’ बहुवचन है; इससे बार-बार की रातों या रात्रिकालीन अवधियों का संकेत मिल सकता है। कई अनुवाद इसे सरल करके ‘रात को’ कहते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַל מִשְׁכָּבִי
  choice: अपने बिस्तर पर
  rationale: מִשְׁכָּב लेटने के स्थान को दर्शाता है। ‘अपने बिस्तर पर’ ठोस बिंब को बनाए रखते हुए स्वाभाविक आधुनिक हिन्दी है।
