id: SNG.3.5
reference: Song of Songs 3:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/003/005.yaml
  text: I adjure you[a], daughters of Jerusalem, by the gazelles or by the does of the field[b], that you not stir up or awaken love until it desires.
translation:
  language: hi
  text: हे यरूशलेम की बेटियो, मैं तुम्हें चिकारे या मैदान की हिरनियों की शपथ दिलाती हूँ:[a] प्रेम को तब तक न जगाओ, न उभारो, जब तक प्रेम न चाहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में ‘चिकारे या मैदान की हिरनियों की शपथ’ है। ‘चिकारे’ के लिए प्रयुक्त शब्द की ध्वनि ‘सेनाओं’ जैसे एक अन्य इब्रानी शब्द से मिलती है; यहाँ पशु वाला अर्थ समानांतर पंक्ति के अधिक अनुकूल है।
    reason: शाब्दिक विकल्प और काव्यात्मक शब्द-क्रीड़ा स्पष्ट करना।
  - marker: b
    text: शाब्दिक रूप में ‘जब तक प्रेम चाहे।’ इब्रानी क्रिया स्त्रीलिंग एकवचन है और व्याकरणतः ‘प्रेम’ से मेल खाती है। इसे ‘जब तक वह स्त्री चाहे,’ ‘जब तक वह पुरुष चाहे,’ या पारंपरिक रूप से ‘जब तक उसे अच्छा लगे’ भी समझा गया है।
    reason: मूल की व्याकरणिक और संदर्भगत अस्पष्टता सुरक्षित रखना।
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: मैं तुम्हें ... शपथ दिलाती हूँ
  rationale: हिफ़ील रूप किसी को शपथ के अधीन करने या गंभीर शपथ दिलाने का भाव रखता है। वक्ता के स्त्री होने का संकेत प्रसंग से स्पष्ट है; हिन्दी में क्रिया के लिंग के कारण इसे व्यक्त करना आवश्यक है।
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: हे यरूशलेम की बेटियो
  rationale: शाब्दिक और काव्यात्मक संबोधन को बनाए रखता है; ‘स्त्रियो’ या ‘युवतियो’ कहने से मूल की पुत्री-संबंधी सामूहिक छवि मिट जाती।
- source_word: בִּצְבָאוֹת אוֹ בְּאַיְלוֹת הַשָּׂדֶה
  choice: चिकारे और मैदान की हिरनियों की शपथ
  rationale: צְבָאוֹת को समानांतर पशु-संज्ञा के अनुसार चिकारे माना गया है और אַיְלוֹת को मादा हिरनियाँ। शपथ-सूत्र में אוֹ का मूल अर्थ ‘या’ है, पर हिन्दी में दो समानांतर साक्षियों के साथ ‘और’ अधिक स्वाभाविक है; पाठगत ‘या’ को पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְרוּ
  choice: न जगाना, न उकसाना
  rationale: शपथ-संदर्भ में אִם ... וְאִם निषेध का बल रखता है। दो निकटार्थी जागृत करने वाली क्रियाओं की काव्यात्मक समानांतरता को दो हिन्दी क्रियाओं से व्यक्त किया गया है।
- source_word: הָאַהֲבָה
  choice: प्रेम
  rationale: सामान्य संज्ञा मूल की यह अस्पष्टता बनाए रखती है कि आशय प्रेम की अनुभूति, इच्छा या मानवीकृत प्रेम से है।
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: जब तक वह स्वयं न चाहे
  rationale: स्त्रीलिंग एकवचन क्रिया व्याकरणतः स्त्रीलिंग संज्ञा ‘प्रेम’ से मेल खाती है। हिन्दी में ‘वह’ लिंग-निरपेक्ष रहते हुए प्रेम को कर्ता बनाए रखता है; ‘स्वयं’ उसकी इच्छा और उपयुक्त समय के भाव को स्वाभाविक बनाता है।
theological_decisions:
- issue: अंतिम उपवाक्य में ‘चाहने’ वाले का संदर्भ
  choice: ‘वह’ का संदर्भ प्रेम से रखा गया है, किसी पुरुष या स्त्री प्रिय से स्पष्ट रूप से नहीं जोड़ा गया।
  alternative: ‘जब तक वह स्त्री चाहे’, ‘जब तक वह पुरुष चाहे’, अथवा पारंपरिक ‘जब तक उचित समय न आए’।
  rationale: मूल में स्त्रीलिंग क्रिया सबसे सहज रूप से स्त्रीलिंग संज्ञा הָאַהֲבָה से सहमत है। किसी खास व्यक्ति या अमूर्त ‘समय’ को कर्ता बनाना मूल की काव्यात्मक अस्पष्टता को अनावश्यक रूप से हल कर देगा।
- issue: पशुओं द्वारा शपथ की असामान्य भाषा
  choice: चिकारे और हिरनियों को वास्तविक काव्यात्मक शपथ-सूत्र के रूप में रखा गया।
  alternative: ‘सेनाओं के याहवे’ की ओर परोक्ष संकेत मानकर दिव्य नाम को अनुवाद में लाना।
  rationale: समानांतर אַיְלוֹת הַשָּׂדֶה पशु-संबंधी अर्थ का समर्थन करता है। ध्वन्यात्मक संकेत संभव है, पर उसे मुख्य पाठ में स्पष्ट ईश्वरीय नाम बना देना अति-व्याख्या होगी।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘शपथ दिलाती हूँ’ गंभीर शपथ-सूत्र को साधारण पाठक के लिए स्पष्ट करता है। ‘हे ... बेटियो’ गीत के औपचारिक संबोधन को बनाए रखता है। मुख्य पाठ प्रवाहपूर्ण है, जबकि वास्तविक पाठगत और व्याख्यात्मक अस्पष्टताएँ पाद-टिप्पणियों में दी गई हैं।
