  text: כְּ/מִגְדַּ֤ל דָּוִיד֙ צַוָּארֵ֔/ךְ בָּנ֖וּי לְ/תַלְפִּיּ֑וֹת אֶ֤לֶף הַ/מָּגֵן֙ תָּל֣וּי עָלָ֔י/ו כֹּ֖ל שִׁלְטֵ֥י הַ/גִּבּוֹרִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/004.yaml
  text: Your neck is like the tower of David[a], built in rows of stone; a thousand shields hang on it[b], all the small shields of the warriors.
translation:
  language: hi
  text: तेरी गर्दन दाऊद की मीनार के समान है[a], जो कतारों में बनी हुई है; उस पर एक हज़ार ढालें लटकी हैं[b]—वीर योद्धाओं की सारी ढालें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'जिस हिब्रू पद का अनुवाद “कतारों में” किया गया है (תלפיות), वह दुर्लभ है और उसका ठीक अर्थ अनिश्चित है। अन्य संभावित अर्थ हैं: “शस्त्रागारों के लिए बनाया गया,” “कंगूरों सहित बनाया गया,” या “परतों में बनाया गया।”'
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू में रक्षात्मक उपकरणों के लिए दो अलग शब्द आए हैं: מָגֵן (“ढाल”) और שֶׁלֶט। यहाँ दोनों का अनुवाद “ढाल” किया गया है; दूसरे शब्द का सटीक भेद अनिश्चित है और वह आकार को निश्चित रूप से नहीं बताता।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמִגְדַּל דָּוִיד
  choice: दाऊद के गुम्मट के समान
  rationale: כְּ तुलना व्यक्त करता है और מִגְדַּל का अर्थ ऊँची रक्षात्मक मीनार है। हिंदी बाइबलीय-साहित्यिक प्रयोग में ‘गुम्मट’ इस स्थापत्य और काव्यात्मक बिंब को संक्षेप में बनाए रखता है।
- source_word: צַוָּארֵךְ
  choice: तेरी गर्दन
  rationale: स्त्रीलिंग एकवचन संबोधन और प्रेम-काव्य की सीधी, आत्मीय वाणी को बनाए रखा गया है।
- source_word: בָּנוּי
  choice: बनाया गया है
  rationale: בנה के निष्क्रिय कृदंत का सीधा अर्थ है; इससे स्थापत्य-बिंब स्पष्ट रहता है।
- source_word: לְתַלְפִּיּוֹת
  choice: पत्थरों की कतारों में
  rationale: यह दुर्लभ और अनिश्चित पद है। प्रसंग में यह सुगढ़ ढंग से कतारों या परतों में किए गए निर्माण की ओर संकेत कर सकता है; अन्य संभावनाएँ पादटिप्पणी में रखी गई हैं ताकि अनिश्चितता न छिपे।
- source_word: אֶלֶף הַמָּגֵן
  choice: एक हज़ार ढालें
  rationale: एकवचन सामूहिक संज्ञा का स्वाभाविक हिंदी बहुवचन किया गया है।
- source_word: תָּלוּי עָלָיו
  choice: उस पर ... लटकी हैं
  rationale: कृदंत वर्तमान दृश्य या अवस्था दिखाता है; हिंदी में यह रूप स्वाभाविक और चित्रात्मक है।
- source_word: שִׁלְטֵי
  choice: छोटी ढालें
  rationale: यह מָגֵן से भिन्न रक्षात्मक उपकरण का शब्द है। ‘छोटी ढालें’ दोनों हिब्रू पदों का भेद बनाए रखता है, यद्यपि आकार स्वयं पद में निश्चित रूप से व्यक्त नहीं है; इसलिए पादटिप्पणी दी गई है।
- source_word: הַגִּבּוֹרִים
  choice: वीर योद्धाओं की
  rationale: גִּבּוֹרִים सामर्थी और युद्धकुशल पुरुषों को सूचित करता है; ‘वीर योद्धा’ आधुनिक हिंदी में मार्शल भाव स्पष्ट करता है।
