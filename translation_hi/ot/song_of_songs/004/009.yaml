  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। “हृदय हर लिया” तथा “चितवन” प्रेम-काव्य की तीव्रता व्यक्त करते हैं, पर अत्यधिक पुरातन नहीं हैं। मूल के दोनों समानांतर संबोधन और आरम्भ-अन्त की पुनरुक्ति सुरक्षित रखी गई है।
