  text: לִבַּבְתִּ֖/נִי אֲחֹתִ֣/י כַלָּ֑ה לִבַּבְתִּ֨י/נִי֙ ב/אחד מֵ/עֵינַ֔יִ/ךְ בְּ/אַחַ֥ד עֲנָ֖ק מִ/צַּוְּרֹנָֽיִ/ךְ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/009.yaml
  text: You have captured my heart[a], my sister, my bride; you have captured my heart with one glance of your eyes[c][b], with one jewel of your necklace.
translation:
  language: hi
  text: तुमने मेरा हृदय हर लिया है[a], मेरी बहन, मेरी दुल्हन; तुमने मेरा हृदय हर लिया है—अपनी आँखों की एक ही चितवन से[b], अपने गले के हार के एक ही आभूषण से[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुमने मेरा हृदय मोहित कर लिया है।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और यह भाव देती है कि प्रियतमा ने वक्ता के हृदय को शक्तिशाली ढंग से प्रभावित या अभिभूत कर दिया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “अपनी आँखों में से एक से।” सम्भवतः आशय “एक ही दृष्टि” या “एक ही चितवन” है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी वाक्यांश का अर्थ “अपने गले की एक जंजीर/सजावट से” या “अपने गले के आभूषणों में से एक से” भी समझा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לִבַּבְתִּנִי
  choice: तुमने मेरा हृदय हर लिया है
  rationale: यह दुर्लभ क्रिया बताती है कि प्रियतमा ने वक्ता के हृदय को गहराई से प्रभावित और अभिभूत कर दिया है। “हृदय हर लिया” आधुनिक हिन्दी में स्वाभाविक काव्यात्मक अभिव्यक्ति है और मूल की पुनरुक्ति भी बनाए रखी गई है।
- source_word: אֲחֹתִי
  choice: मेरी बहन
  rationale: मूल संबोधन को ज्यों का त्यों रखा गया है। गीतगीत में यह आत्मीय प्रेम-संबोधन है; अनुवाद में इसे किसी जैविक संबंध की व्याख्या देकर सीमित नहीं किया गया।
- source_word: כַלָּה
  choice: मेरी दुल्हन
  rationale: यह वैवाहिक प्रेम का सीधा संबोधन है। हिन्दी में “मेरी बहन, मेरी दुल्हन” मूल के समानांतर संबोधनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְאֶחָד מֵעֵינַיִךְ
  choice: अपनी आँखों की एक ही चितवन से
  rationale: शाब्दिक संरचना “तुम्हारी आँखों में से एक से” है, पर प्रसंग में आशय एक आँख से नहीं, बल्कि एक ही दृष्टि या चितवन से है। “चितवन” प्रेम-काव्य के अनुकूल और आज भी बोधगम्य है।
- source_word: בְּאַחַד עֲנָק מִצַּוְּרֹנָיִךְ
  choice: अपने गले के हार के एक ही आभूषण से
  rationale: עֲנָק गले में पहने जाने वाले हार, कंठाभूषण या उसकी किसी सजावटी इकाई को सूचित कर सकता है। यह चयन आभूषण की छवि को बनाए रखते हुए हिन्दी में अर्थ स्पष्ट करता है, और पाठगत अनिश्चितता पादटिप्पणी में सुरक्षित रखता है।
