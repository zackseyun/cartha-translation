base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/001.yaml
  text: Look[a], you are beautiful, my darling; look, you are beautiful. Your eyes are doves behind your veil[b]. Your hair is like a flock of goats streaming down from Mount Gilead.
translation:
  language: hi
  text: देखो, मेरी प्रियतमा, तुम कितनी सुंदर हो! देखो, तुम कितनी सुंदर हो! तुम्हारे आवरण[a] के पीछे तुम्हारी आँखें कबूतर हैं। तुम्हारे बाल गिलाद पर्वत से नीचे उतरती हुई बकरियों के झुंड के समान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारे घूँघट के पीछे” अथवा “तुम्हारी लटों के पीछे।” इब्रानी शब्द का अर्थ अनिश्चित है और किसी आवरण, लटों या गूँथे हुए बालों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: देखो, ... तुम कितनी ... हो
  rationale: यह विस्मय और ध्यान आकर्षित करने वाला पद है। ‘देखो’ उसकी जीवंत काव्यात्मक शक्ति रखता है, और ‘कितनी’ हिंदी में प्रशंसापूर्ण विस्मय को स्वाभाविक बनाता है।
- source_word: יָפָה
  choice: सुंदर
  rationale: यह सौंदर्य का सीधा और आधुनिक मानक हिंदी में सहज विशेषण है।
- source_word: רַעְיָתִי
  choice: मेरी प्रियतमा
  rationale: गीतगीत में यह स्त्री प्रेमिका के लिए आत्मीय संबोधन है। ‘प्रियतमा’ स्त्रीलिंग, स्नेह और काव्यात्मक गरिमा को स्पष्ट रखता है।
- source_word: עֵינַיִךְ יוֹנִים
  choice: तुम्हारी आँखें कबूतर हैं
  rationale: इब्रानी में सीधा, क्रियारहित रूपक है—‘तुम्हारी आँखें कबूतर।’ ‘के समान’ जोड़ने के बजाय प्रत्यक्ष रूपक को बनाए रखा गया है।
- source_word: מִבַּעַד לְצַמָּתֵךְ
  choice: तुम्हारी ओट में
  rationale: पूरा पद किसी आवरण के पीछे से आंशिक रूप से दिखाई देने का भाव देता है। विवादित संज्ञा को अनावश्यक रूप से केवल ‘घूँघट’ या ‘लटें’ ठहराने के बजाय ‘ओट’ मूल अस्पष्टता को स्वाभाविक हिंदी में सुरक्षित रखती है।
- source_word: שַׂעְרֵךְ
  choice: तुम्हारे बाल
  rationale: मूल संज्ञा का सीधा और स्वाभाविक अनुवाद।
- source_word: כְּעֵדֶר הָעִזִּים
  choice: बकरियों के उस झुंड के समान
  rationale: देहाती उपमा को स्पष्ट और स्वाभाविक हिंदी में रखा गया है; ‘झुंड’ बकरियों के लिए सामान्य शब्द है।
- source_word: שֶׁגָּלְשׁוּ
  choice: लहराता हुआ नीचे उतर रहा हो
  rationale: क्रिया नीचे की ओर बहने, फिसलने या उतरने का दृश्य देती है। ‘लहराता हुआ’ बालों और पहाड़ी ढलान पर चलते झुंड के दृश्य-साम्य को व्यक्त करता है, जबकि ‘नीचे उतर रहा’ दिशात्मक अर्थ बनाए रखता है।
- source_word: מֵהַר גִּלְעָד
  choice: गिलाद पर्वत से
  rationale: भौगोलिक नाम और ‘पर्वत’ का एकवचन रूप सुरक्षित रखा गया है।
