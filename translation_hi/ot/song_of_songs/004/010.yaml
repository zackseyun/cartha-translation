source:
  edition: WLC
  text: מַה יָּפ֥וּ דֹדַ֖יִ/ךְ אֲחֹתִ֣/י כַלָּ֑ה מַה טֹּ֤בוּ דֹדַ֨יִ/ךְ֙ מִ/יַּ֔יִן וְ/רֵ֥יחַ שְׁמָנַ֖יִ/ךְ מִ/כָּל בְּשָׂמִֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/010.yaml
  text: How beautiful your love is[a], my sister, my bride! How much better your love is than wine[b], and the fragrance of your oils than all spices!
translation:
  language: hi
  text: मेरी बहन, मेरी दुल्हन, तुम्हारा प्रेम कितना सुंदर है![a] तुम्हारा प्रेम दाखमधु से कितना उत्तम है, और तुम्हारे तेलों[b] की महक सभी सुगंध-द्रव्यों से कितनी उत्तम है!
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर ‘तुम्हारा प्रेम’ का अनुवाद ‘तुम्हारे प्रेम-भरे स्पर्श’ भी हो सकता है; इब्रानी शब्द शारीरिक स्नेह में व्यक्त प्रेम को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘तेलों’ से आशय संभवतः शरीर पर लगाए जाने वाले सुगंधित तेलों या इत्रयुक्त लेपों से है।
    reason: cultural_note
lexical_decisions:
- source_word: מַה יָפוּ
  choice: कितना सुंदर है
  rationale: विस्मय और प्रशंसा व्यक्त करने वाले מַה तथा יפה के सौंदर्य-बोध को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דֹדַיִךְ
  choice: तुम्हारा प्रेम
  rationale: यह बहुवचन रूप प्रेम, प्रणय या शारीरिक स्नेह-प्रदर्शन का संकेत दे सकता है। मुख्य पाठ में ‘प्रेम’ काव्यात्मक व्यापकता बनाए रखता है; वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: אֲחֹתִי כַלָּה
  choice: मेरी बहन, मेरी दुल्हन
  rationale: दोनों संबोधनों को अलग-अलग रखकर इब्रानी की आत्मीय और काव्यात्मक अभिव्यक्ति सुरक्षित रखी गई है।
- source_word: מַה טֹבוּ ... מִיַּיִן
  choice: दाखमधु से कितना उत्तम है
  rationale: מִן की तुलनात्मक शक्ति को स्पष्ट करता है और טֹבוּ को सीधे, गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: וְרֵיחַ שְׁמָנַיִךְ
  choice: और तुम्हारे सुगंधित तेलों की महक
  rationale: רֵיחַ को ‘महक’ और שְׁמָנִים को सांस्कृतिक संदर्भानुसार सुगंधित तेलों के रूप में प्रस्तुत किया गया है।
- source_word: מִכָּל בְּשָׂמִים
  choice: हर सुगंध-द्रव्य से
  rationale: בְּשָׂמִים सुगंध देने वाले मसालों या अन्य सुगंधित पदार्थों को सूचित करता है; ‘सुगंध-द्रव्य’ इस व्यापकता को बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। ‘दाखमधु’ बाइबलीय काव्य के अनुकूल है, जबकि ‘महक’ सामान्य पाठक के लिए स्वाभाविक है। तुलना की दूसरी पंक्ति में हिन्दी की स्पष्टता के लिए ‘कितनी उत्तम है’ दोहराया गया है।
