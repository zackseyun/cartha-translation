- source_word: חָתוּם
  choice: मुहरबंद
  rationale: निष्क्रिय कृदंत का सीधा अर्थ ‘मुहर लगा हुआ’ है; ‘मुहरबंद’ संक्षिप्त, स्वाभाविक और सुरक्षित पहुँच की अलग छवि बनाए रखता है।
