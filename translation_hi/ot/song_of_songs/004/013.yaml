translation:
  language: hi
  text: 'तेरे अंकुर अनारों का एक बाग़ हैं,

    जिसमें उत्तम फल,

    मेहंदी और जटामांसी हैं।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: שְׁלָחַיִךְ
  choice: तेरी कोंपलें
  rationale: यह शब्द पौधे की नई शाखाओं या अंकुरों का बिंब देता है; प्रसंग में स्त्री की उर्वर सुंदरता के रूपक को बनाए रखने के लिए ‘कोंपलें’ स्वाभाविक है।
- source_word: פַּרְדֵּס
  choice: एक बारी
  rationale: फ़ारसी मूल का यह शब्द घिरे हुए उद्यान या फलोद्यान को सूचित करता है। ‘बारी’ काव्यात्मक, सहज और फलवृक्षों के संदर्भ में उपयुक्त है।
- source_word: רִמּוֹנִים
  choice: अनारों
  rationale: बहुवचन का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: פְּרִי מְגָדִים
  choice: उत्तम फल
  rationale: מְגָדִים मूल्यवान, मनोहर या चुनिंदा वस्तुओं को बताता है; ‘उत्तम’ गुणवत्ता और आकर्षण दोनों को संक्षेप में व्यक्त करता है।
- source_word: כְּפָרִים
  choice: मेहंदी
  rationale: כֹּפֶר/כְּפָרִים यहाँ सुगंधित हिना या मेहंदी के पौधे/पुष्प हैं; आधुनिक हिन्दी में ‘मेहंदी’ सर्वाधिक परिचित नाम है।
- source_word: נְרָדִים
  choice: जटामांसी
  rationale: यह सुगंधित नार्द के लिए प्रयुक्त बहुवचन है। हिन्दी में वनस्पति और सुगंध-द्रव्य का पारंपरिक नाम ‘जटामांसी’ है; सामूहिक अर्थ के कारण अलग बहुवचन चिह्न आवश्यक नहीं।
