  register: आधुनिक मानक हिन्दी में अंतरंग प्रेम-काव्य का गरिमापूर्ण स्वर रखा गया है। स्त्री को एकवचन निकट संबोधन में ‘तेरे/तेरी/तेरा’ कहा गया है। पंक्ति-विन्यास इब्रानी समानांतरता और दृश्य-क्रम को उभारता है; विवादित शब्दों को बिना अनावश्यक रूप से सुलझाए पाद-टिप्पणियों में संरक्षित किया गया है।
