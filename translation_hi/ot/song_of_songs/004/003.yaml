  yaml_path: translation/ot/song_of_songs/004/003.yaml
  text: Your lips are like a scarlet thread[a], and your mouth is lovely[c][b]. Your temples are like a slice of pomegranate behind your veil.
translation:
  language: hi
  text: 'तेरे होंठ किरमिज़ी धागे जैसे हैं,

    और तेरा मुख मनोहर है।[a]

    तेरे घूँघट के पीछे से तेरी कनपटियाँ अनार की फाँक जैसी हैं।[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तेरी वाणी मनोहर है।” इब्रानी शब्द बोलने या वाणी को दर्शा सकता है, यद्यपि यहाँ शारीरिक अंगों के क्रम में वह मुख की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तेरे घूँघट के आर-पार।” इब्रानी अभिव्यक्ति किसी आवरण के पीछे से या उसके आर-पार दिखाई देने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: c
    text: “घूँघट” के लिए प्रयुक्त इब्रानी शब्द का अर्थ यहाँ अनिश्चित है; इसका अनुवाद “लटों” या “बालों” के रूप में भी किया जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כְּחוּט הַשָּׁנִי
  choice: लाल रंग के धागे जैसे
  rationale: חוּט का स्वाभाविक अर्थ ‘धागा’ है और שָׁנִי गहरे लाल/किरमिजी रंग को दर्शाता है। ‘लाल रंग का धागा’ सामान्य हिन्दी में स्पष्ट और काव्यात्मक है।
- source_word: שִׂפְתֹתַיִךְ
  choice: तेरे होंठ
  rationale: द्विवचन रूप का हिन्दी में स्वाभाविक बहुवचन ‘होंठ’ है; अंतरंग काव्य-संबोधन के लिए ‘तेरे’ उपयुक्त है।
- source_word: וּמִדְבָּרֵיךְ
  choice: और तेरा मुख
  rationale: מִדְבָּר यहाँ बोलने/वाणी से जुड़ा शब्द है, पर शारीरिक अंगों के क्रम में मुख का लाक्षणिक संकेत संभव है। मुख्य पाठ में ‘मुख’ रखा गया और ‘वाणी’ की वास्तविक वैकल्पिक समझ पाद-टिप्पणी में सुरक्षित की गई।
- source_word: נָאוֶה
  choice: मनोहर
  rationale: यह शब्द सुन्दर, प्रिय या आकर्षक होने का भाव देता है। ‘मनोहर’ गरिमापूर्ण आधुनिक काव्यात्मक हिन्दी है।
- source_word: כְּפֶלַח הָרִמּוֹן
  choice: अनार की फाँक जैसी
  rationale: פֶּלַח कटे हुए फल के भाग या फाँक को दर्शाता है; ‘अनार की फाँक’ हिन्दी में चित्र को सहजता से व्यक्त करता है।
- source_word: רַקָּתֵךְ
  choice: तेरी कनपटियाँ
  rationale: רַקָּה सिर के पार्श्व भाग, अर्थात कनपटी, का अधिक सटीक संकेत है; ‘गाल’ अपेक्षाकृत ढीला विकल्प है।
- source_word: מִבַּעַד
  choice: पीछे से
  rationale: यह किसी आड़ के पीछे से अथवा उसके आर-पार दिखाई देने का भाव दे सकता है। ‘पीछे से’ मुख्य अर्थ रखता है, जबकि ‘आर-पार’ की छाया पाद-टिप्पणी में दी गई है।
- source_word: לְצַמָּתֵךְ
  choice: तेरे घूँघट
  rationale: צַמָּה का अर्थ इस प्रसंग में विवादित है। आवरण के अर्थ में ‘घूँघट’ हिन्दी पाठक के लिए स्वाभाविक है, पर केश/लटों की सम्भावना पाद-टिप्पणी में सुरक्षित है।
