source:
  edition: WLC
  text: נֹ֛פֶת תִּטֹּ֥פְנָה שִׂפְתוֹתַ֖יִ/ךְ כַּלָּ֑ה דְּבַ֤שׁ וְ/חָלָב֙ תַּ֣חַת לְשׁוֹנֵ֔/ךְ וְ/רֵ֥יחַ שַׂלְמֹתַ֖יִ/ךְ כְּ/רֵ֥יחַ לְבָנֽוֹן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/011.yaml
  text: Your lips drip honeycomb[a], bride; honey and milk are under your tongue[b], and the fragrance of your garments is like the fragrance of Lebanon.
translation:
  language: hi
  text: हे दुल्हन, तेरे होंठों से छत्ते का मधु[a] टपकता है; तेरी जीभ के नीचे मधु और दूध[b] हैं, और तेरे वस्त्रों की सुगंध लबानोन की सुगंध के समान है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छत्ते का टपकता मधु”; इब्रानी נֹפֶת पद में आगे आए सामान्य शब्द “मधु” से अधिक विशिष्ट है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में क्रम “मधु और दूध” है, न कि अधिक परिचित “दूध और मधु।”
    reason: lexical_alternative
lexical_decisions:
- source_word: נֹפֶת
  choice: छत्ते का मधु
  rationale: यह शब्द सामान्य דְּבַשׁ की अपेक्षा छत्ते से टपकते विशिष्ट मधु को दर्शाता है; इससे पद में प्रयुक्त दोनों मधु-संबंधी शब्दों का भेद बना रहता है।
- source_word: תִּטֹּפְנָה
  choice: टपकता है
  rationale: נטף बूंद-बूंद बहने या टपकने का बिंब देता है; हिन्दी में यह स्वाभाविक और काव्यात्मक है।
- source_word: שִׂפְתוֹתַיִךְ
  choice: तेरे होंठ
  rationale: द्विवचन रूप का आधुनिक हिन्दी में स्वाभाविक समतुल्य 'होंठ' है।
- source_word: כַּלָּה
  choice: दुल्हन
  rationale: यह प्रेयसी के लिए वैवाहिक स्नेह-संबोधन है; 'दुल्हन' आधुनिक हिन्दी में सहज और स्पष्ट है।
- source_word: דְּבַשׁ וְחָלָב
  choice: मधु और दूध
  rationale: मूल का क्रम जानबूझकर सुरक्षित रखा गया है और प्रचलित उलटे क्रम 'दूध और मधु' को आरोपित नहीं किया गया।
- source_word: תַּחַת לְשׁוֹנֵךְ
  choice: तेरी जीभ के नीचे
  rationale: यह ठोस और अंतरंग काव्य-बिंब को सीधे तथा स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: רֵיחַ
  choice: सुगंध
  rationale: सकारात्मक काव्य-संदर्भ में 'सुगंध' सुखद गंध को स्पष्ट करता है।
- source_word: שַׂלְמֹתַיִךְ
  choice: तेरे वस्त्र
  rationale: '''वस्त्र'' बाहरी पहनावे के लिए गरिमापूर्ण किंतु सामान्यतः बोधगम्य शब्द है।'
- source_word: כְּרֵיחַ לְבָנוֹן
  choice: लबानोन की सुगंध के समान
  rationale: भौगोलिक-काव्यात्मक संकेत को बिना व्याख्यात्मक विस्तार के सुरक्षित रखा गया है।
