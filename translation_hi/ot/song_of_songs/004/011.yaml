  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रेम-काव्य का स्वर रखा गया है। संबोधन और सर्वनाम के लिए अंतरंग एकवचन 'तेरे/तेरी' चुना गया है; मूल की संवेदनात्मक छवियों और शब्द-क्रम को यथासंभव सुरक्षित रखते हुए वाक्य को स्वाभाविक हिन्दी बनाया गया है।
