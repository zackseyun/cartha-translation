id: SNG.4.16
reference: Song of Songs 4:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: ע֤וּרִי צָפוֹן֙ וּ/ב֣וֹאִי תֵימָ֔ן הָפִ֥יחִי גַנִּ֖/י יִזְּל֣וּ בְשָׂמָ֑י/ו יָבֹ֤א דוֹדִ/י֙ לְ/גַנּ֔/וֹ וְ/יֹאכַ֖ל פְּרִ֥י מְגָדָֽי/ו׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/016.yaml
  text: Awake[a], north wind, and come, south wind! Blow on my garden, so that its spices may flow[c][b]. Let my beloved come into his garden and eat its choice fruits.
translation:
  language: hi
  text: 'हे उत्तरी पवन[a], जाग उठ! हे दक्षिणी पवन, आ!

    मेरे बाग पर बह,

    ताकि उसके सुगंध-द्रव्य[b] बह निकलें।

    मेरा प्रिय अपने बाग[c] में आए

    और उसके उत्तम फल खाए।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘उत्तर’ और ‘दक्षिण’ है। यहाँ उन्हें संबोधित करके बाग पर बहने को कहा गया है, इसलिए ‘पवन’ जोड़ा गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘उसकी सुगंध बह निकले।’ इब्रानी शब्द सुगंधित द्रव्यों अथवा उनसे निकलने वाली महक—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: मूल पाठ पहले ‘मेरे बाग’ और फिर ‘उसके बाग’ कहता है। हिंदी का ‘अपने बाग’ प्रिय के बाग को दर्शाता है और यह संबंध-सूचक परिवर्तन सुरक्षित रखता है।
    reason: cross_reference
lexical_decisions:
- source_word: ע֤וּרִי
  choice: जाग उठ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप उत्तरी पवन को सजीव पात्र की तरह संबोधित करता है। ‘जाग उठ’ इस काव्यात्मक पुकार को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: צָפוֹן / תֵימָן
  choice: उत्तरी पवन / दक्षिणी पवन
  rationale: मूल शब्द शाब्दिक रूप से ‘उत्तर’ और ‘दक्षिण’ हैं, पर संबोधन और आगे की ‘बह’ आज्ञा से यहाँ हवाएँ अभिप्रेत हैं।
- source_word: הָפִ֥יחִי
  choice: बह
  rationale: क्रिया हवा के बाग पर बहने अथवा साँस फूँकने का बोध देती है। ‘बह’ आधुनिक हिंदी में पवन के लिए सहज है और चित्र को सरल रखता है।
- source_word: גַנִּ֖י
  choice: मेरे बाग
  rationale: प्रथम पुरुष एकवचन संबंध को सीधे रखा गया है; प्रेम-काव्य के बाग-रूपक को न दबाया गया है, न उसकी व्याख्या पाठ में जोड़ी गई है।
- source_word: יִזְּל֣וּ
  choice: बह निकलें
  rationale: यह इच्छासूचक अपूर्ण रूप है और बहने या टपकने का अर्थ देता है। ‘ताकि ... बह निकलें’ वांछित परिणाम तथा गतिशील बिंब दोनों व्यक्त करता है।
- source_word: בְשָׂמָיו
  choice: उसके सुगंध-द्रव्य
  rationale: संज्ञा सुगंधित मसालों, बलसानों या उनसे निकलने वाली महक का संकेत कर सकती है। मुख्य पाठ में ठोस उद्यान-उपज का बिंब रखा गया है और अर्थ-विकल्प पादटिप्पणी में दिया गया है।
- source_word: יָבֹא דוֹדִי
  choice: मेरा प्रिय ... आए
  rationale: इच्छासूचक भाव को स्वाभाविक हिंदी में रखा गया है। דּוֹדִי के स्नेहपूर्ण अर्थ के लिए ‘मेरा प्रिय’ उपयुक्त और गरिमापूर्ण है।
- source_word: לְגַנּוֹ
  choice: अपने बाग में
  rationale: ‘मेरे बाग’ से ‘उसके/अपने बाग’ की मूल संबंध-सूचक भिन्नता सुरक्षित है। हिंदी में कर्ता ‘मेरा प्रिय’ की ओर स्पष्ट संकेत करने के लिए ‘अपने’ स्वाभाविक है।
- source_word: וְיֹאכַל פְּרִי מְגָדָיו
  choice: और उसके उत्तम फल खाए
  rationale: ‘खाए’ मूल के प्रत्यक्ष भोजन-बिंब को बनाए रखता है; מְגָדִים के मूल्यवान, मनोहर या उत्तम फल होने का भाव ‘उत्तम फल’ से व्यक्त किया गया है, बिना अनावश्यक श्रेष्ठतम अर्थ जोड़े।
theological_decisions:
- issue: कामुक बाग-रूपक और संबंध-सूचक परिवर्तन
  choice: संवेदनात्मक प्रेम-रूपक को सीधे बनाए रखना और ‘मेरे बाग’ से ‘अपने बाग’ का परिवर्तन सुरक्षित रखना
  alternative: रूपक को स्पष्ट धार्मिक रूपक बनाना अथवा संबंध-सूचक परिवर्तन को समतल कर देना
  rationale: इब्रानी पाठ अंतरंग काव्यात्मक चित्र स्वयं प्रस्तुत करता है। अनुवाद उसमें बाहरी मतवैचारिक अर्थ नहीं जोड़ता और प्रेमियों के पारस्परिक अपनत्व में निहित वास्तविक काव्यात्मक तनाव को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, काव्यात्मक और सामान्य पाठक के लिए सुबोध रखी गई है। ‘बाग’, ‘प्रिय’ और संक्षिप्त आज्ञार्थक वाक्य गीतात्मक गरिमा बनाए रखते हैं। पंक्ति-विन्यास इब्रानी कविता की समानांतर पुकार और उसके बाद व्यक्त इच्छा को उभारता है।
