  yaml_path: translation/ot/song_of_songs/004/015.yaml
  text: A spring of gardens[a], a well of living water[c][b], and streams flowing from Lebanon.
translation:
  language: hi
  text: बागों का सोता[a], जीवित जल का कुआँ[b], और लबानोन से बहती जलधाराएँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘बागों का झरना’; इब्रानी शब्द प्राकृतिक सोते या फूटते जलस्रोत को दर्शा सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘जीवित जल’ एक इब्रानी अभिव्यक्ति है, जिसका अर्थ ठहरे हुए जल के विपरीत ताज़ा, बहता हुआ जल है।
    reason: cultural_note
lexical_decisions:
- source_word: מַעְיַן
  choice: सोता
  rationale: यह शब्द प्राकृतिक जलस्रोत या फूटते हुए सोते को दर्शाता है; ‘सोता’ आधुनिक हिन्दी में स्वाभाविक है और कुएँ तथा बहती जलधाराओं के समानांतर बैठता है।
- source_word: גַּנִּים
  choice: बागों
  rationale: इब्रानी में स्पष्ट बहुवचन है, इसलिए उसे बनाए रखा गया है।
- source_word: בְּאֵר
  choice: कुआँ
  rationale: सामान्य अर्थ ‘कुआँ’ है; ‘हौज’ ठहरे या संचित जल का संकेत देता, जबकि प्रसंग ताज़े बहते जल पर बल देता है।
- source_word: מַיִם חַיִּים
  choice: जीवित जल
  rationale: इब्रानी की सजीव उपमा को सुरक्षित रखता है; पादटिप्पणी स्पष्ट करती है कि इससे ताज़ा, बहता हुआ जल अभिप्रेत है।
- source_word: וְנֹזְלִים
  choice: और ... बहती जलधाराएँ
  rationale: बहुवचन कृदंत जल की निरंतर गति बताता है; हिन्दी में अर्थ स्पष्ट करने के लिए ‘जलधाराएँ’ संज्ञा जोड़ी गई है।
- source_word: מִן לְבָנוֹן
  choice: लबानोन से
  rationale: यह भौगोलिक वाक्यांश का सीधा रूप है; ‘नीचे उतरती’ जैसा अतिरिक्त अर्थ नहीं जोड़ा गया।
