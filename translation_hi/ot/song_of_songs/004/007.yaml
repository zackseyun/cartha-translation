  yaml_path: translation/ot/song_of_songs/004/007.yaml
  text: You are altogether beautiful[a], my beloved[c][b], and there is no blemish in you.
translation:
  language: hi
  text: हे मेरी प्रियतमा, तुम पूरी तरह सुन्दर हो; तुममें कोई दोष नहीं है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כֻּלָּךְ
  choice: पूरी तरह
  rationale: स्त्रीलिंग एकवचन प्रत्यय सहित यह रूप स्त्री की समग्र सुन्दरता पर बल देता है। ‘पूरी तरह’ आधुनिक हिन्दी में स्वाभाविक रहते हुए इस व्यापक बल को व्यक्त करता है।
- source_word: יָפָה
  choice: सुन्दर
  rationale: यह विशेषण यहाँ सौन्दर्य का सीधा कथन है; ‘सुन्दर’ सामान्य, स्पष्ट और काव्यात्मक हिन्दी समतुल्य है।
- source_word: רַעְיָתִי
  choice: मेरी प्रियतमा
  rationale: श्रेष्ठगीत में यह स्त्री प्रेमिका के लिए आत्मीय सम्बोधन है। ‘मेरी प्रियतमा’ उसके स्त्रीलिंग, स्नेहपूर्ण और सम्बन्धपरक भाव को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: וּמוּם
  choice: दोष
  rationale: מוּם किसी शारीरिक त्रुटि, दाग या खोट को सूचित कर सकता है। ‘दोष’ यहाँ व्यापक और स्वाभाविक है तथा सौन्दर्य में किसी कमी के न होने का भाव देता है।
- source_word: אֵין בָּךְ
  choice: तुममें कोई ... नहीं है
  rationale: अस्तित्ववाचक निषेध और בְּ के संयोजन को यह हिन्दी रचना स्पष्ट और स्वाभाविक ढंग से व्यक्त करती है।
