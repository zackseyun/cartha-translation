translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। सम्बोधन के लिए ‘तेरे’ चुना गया है, जो प्रेम-काव्य की निकटता व्यक्त करता है। स्पष्ट शारीरिक बिंब को मूल के अनुसार बिना शिष्टोक्ति में बदलने के रखा गया है। पंक्ति-विभाजन इब्रानी तुलना और चरने वाले बच्चों के उपवाक्य को पठनीय बनाता है।
