  yaml_path: translation/ot/song_of_songs/004/005.yaml
  text: Your two breasts are like two fawns[a], twins of a gazelle, grazing among the lilies.
translation:
  language: hi
  text: 'तेरे दोनों स्तन हिरनी के दो जुड़वाँ शावकों के समान हैं,

    जो सोसन के फूलों के बीच चरते हैं।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मादा गज़ेल के दो जुड़वाँ शावकों के समान।” इब्रानी צְבִיָּה किसी मादा गज़ेल या हिरनी-जैसे पशु को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: तेरे दोनों स्तन
  rationale: मूल पाठ में संख्या ‘दो’ स्पष्ट है। ‘दोनों’ स्वाभाविक हिन्दी में द्वित्व को बनाए रखता है और आगे आने वाले ‘दो जुड़वाँ बच्चों’ के साथ काव्यात्मक समानता रचता है।
- source_word: כִּשְׁנֵי
  choice: दो ... के समान हैं
  rationale: उपसर्ग כְּ तुलना व्यक्त करता है। हिन्दी में क्रियारहित इब्रानी वाक्य को स्वाभाविक बनाने के लिए ‘के समान हैं’ जोड़ा गया है।
- source_word: עֳפָרִים
  choice: बच्चों
  rationale: यह शब्द हिरन-कुल के छोटे बच्चों को सूचित करता है। अगले पदबंध में माँ की जाति ‘चिकारा’ बताई गई है, इसलिए ‘चिकारे के ... बच्चों’ से अर्थ स्पष्ट और स्वाभाविक रहता है।
- source_word: תְּאוֹמֵי
  choice: जुड़वाँ
  rationale: रचना-रूप का अर्थ ‘के जुड़वाँ’ है। यह दोनों पशु-शावकों की समानता और स्तनों की जोड़ी के बिंब को सुरक्षित रखता है।
- source_word: צְבִיָּה
  choice: चिकारे के
  rationale: स्त्रीलिंग संज्ञा मादा गज़ेल अथवा हिरनी-जैसे पशु को सूचित कर सकती है। ‘चिकारा’ गीत में बार-बार आने वाले गज़ेल-संबंधी बिंब को हिन्दी में ठोस रूप देता है; लिंग का संकेत आश्रित पद ‘बच्चों’ के कारण हिन्दी में स्वाभाविक रूप से सामान्यीकृत है।
- source_word: הָרֹעִים
  choice: चरते हैं
  rationale: רעה का कृदन्त पशुओं के चरने या भोजन करने का बोध देता है। ‘चरते हैं’ सहज आधुनिक हिन्दी है और ग्रामीण बिंब को बनाए रखता है।
- source_word: בַּשּׁוֹשַׁנִּים
  choice: सोसन के फूलों के बीच
  rationale: שׁוֹשַׁנִּים का पारंपरिक और सम्भावित अर्थ ‘सोसन’ है। ‘के बीच’ उस फूलों से भरे स्थान में पशुओं के चरने का स्वाभाविक हिन्दी चित्र प्रस्तुत करता है।
