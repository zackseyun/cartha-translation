  text: אִתִּ֤/י מִ/לְּבָנוֹן֙ כַּלָּ֔ה אִתִּ֖/י מִ/לְּבָנ֣וֹן תָּב֑וֹאִי תָּשׁ֣וּרִי מֵ/רֹ֣אשׁ אֲמָנָ֗ה מֵ/רֹ֤אשׁ שְׂנִיר֙ וְ/חֶרְמ֔וֹן מִ/מְּעֹנ֣וֹת אֲרָי֔וֹת מֵֽ/הַרְרֵ֖י נְמֵרִֽים׀׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/008.yaml
  text: Come with me from Lebanon[a], my bride; with me from Lebanon, come. Look from the summit of Amanah, from the summit of Senir and Hermon, from lions’ dens[b], from mountains of leopards.
translation:
  language: hi
  text: 'मेरे साथ लबानोन से आ, मेरी दुल्हन;

    मेरे साथ लबानोन से आ।

    अमाना के शिखर से निहार[a],

    सनीर[b] और हेर्मोन के शिखरों से,

    सिंहों की मांदों से,

    और तेंदुओं के पहाड़ों से।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस दुर्लभ इब्रानी क्रिया का अर्थ अनिश्चित है। इसका अनुवाद “नीचे उतर आ” भी किया जा सकता है; यहाँ इसे पर्वत-शिखरों से देखने या निहारने के अर्थ में लिया गया है।
    reason: lexical_alternative
  - marker: b
    text: सनीर हेर्मोन पर्वत-श्रृंखला के एक भाग का प्राचीन नाम है।
    reason: cultural_note
lexical_decisions:
- source_word: אִתִּי
  choice: मेरे साथ
  rationale: पहले पुरुष एकवचन प्रत्यय सहित पूर्वसर्ग का स्वाभाविक अर्थ ‘मेरे साथ’ है; इसकी पुनरावृत्ति आमंत्रण और काव्यात्मक बल दोनों को बनाए रखती है।
- source_word: מִלְּבָנוֹן
  choice: लबानोन से
  rationale: מִן स्रोत या प्रस्थान-बिंदु बताता है; दोनों बार ‘लबानोन से’ रखकर मूल समानांतरता सुरक्षित की गई है।
- source_word: כַּלָּה
  choice: मेरी दुल्हन
  rationale: प्रत्यक्ष संबोधन में संबंधसूचक भाव स्पष्ट करने के लिए आधुनिक हिन्दी में ‘मेरी दुल्हन’ स्वाभाविक और आत्मीय है।
- source_word: תָּבוֹאִי
  choice: आ
  rationale: प्रसंग में रूप आमंत्रण या आग्रह व्यक्त करता है; ‘आ’ भविष्य या बाध्यता को अनावश्यक रूप से निश्चित किए बिना इसे स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תָּשׁוּרִי
  choice: निहार
  rationale: दुर्लभ और विवादित क्रिया को यहाँ ‘निहार’ दिया गया है, जो ऊँचाइयों से देखने के अर्थ को व्यक्त करता है; ‘उतर आ’ की गतिसूचक संभावना पादटिप्पणी में सुरक्षित है।
- source_word: מֵרֹאשׁ
  choice: के शिखर से
  rationale: पर्वत-संदर्भ में רֹאשׁ के लिए ‘शिखर’ सटीक, संक्षिप्त और काव्यात्मक हिन्दी है।
- source_word: אֲמָנָה
  choice: अमाना
  rationale: स्थाननाम को हिन्दी ध्वन्यात्मक रूप में लिप्यंतरित किया गया है।
- source_word: שְׂנִיר
  choice: सनीर
  rationale: प्राचीन स्थाननाम को अनूदित करने के बजाय लिप्यंतरित किया गया है।
- source_word: חֶרְמוֹן
  choice: हेर्मोन
  rationale: स्थाननाम का प्रचलित बाइबलीय हिन्दी के निकट लिप्यंतरण रखा गया है।
- source_word: מִמְּעֹנוֹת אֲרָיוֹת
  choice: सिंहों की मांदों से
  rationale: מְעוֹנוֹת पशुओं के निवास या मांद को दर्शाता है; यह चयन खतरे की सजीव छवि और बहुवचन दोनों बनाए रखता है।
- source_word: מֵהַרְרֵי נְמֵרִים
  choice: तेंदुओं के पहाड़ों से
  rationale: निर्माण-संबंध को स्वाभाविक हिन्दी में व्यक्त करते हुए मूल की जंगली और खतरनाक पर्वतीय छवि सुरक्षित रखी गई है।
