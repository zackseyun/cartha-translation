base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/002.yaml
  text: Your teeth are like a flock of shorn ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: hi
  text: 'तुम्हारे दाँत ऊन कतराई गई भेड़ों के झुंड के समान हैं,

    जो धुलाई से ऊपर आई हैं;

    हर एक के जुड़वाँ बच्चे हैं[a],

    और उनमें कोई भी अपने बच्चे को खो चुकी नहीं है[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: जुड़वाँ बच्चों वाली भेड़ों की छवि से दाँतों की पूरी और बराबर जोड़ीदार पंक्ति का संकेत मिलता है।
    reason: cultural_note
  - marker: b
    text: शाब्दिक भाव है, “उनमें कोई संतान खोकर शोकाकुल नहीं।” भेड़ों की उपमा को बनाए रखते हुए यह संकेत दिया गया है कि कोई दाँत गायब नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: तुम्हारे दाँत
  rationale: स्त्री को संबोधित करते हुए उसके दाँतों का सीधा उल्लेख है; मूल पाठ में ‘हाथीदाँत जैसे’ आदि कोई अतिरिक्त विशेषण नहीं है।
- source_word: כְּעֵדֶר
  choice: झुंड के समान
  rationale: עֵדֶר प्रायः भेड़-बकरियों के झुंड को दर्शाता है और यहाँ पशुपालन से जुड़ी उपमा के अनुकूल है।
- source_word: הַקְּצוּבוֹת
  choice: कतर चुकी भेड़ों
  rationale: निष्क्रिय स्त्रीलिंग बहुवचन रूप ऊन कतरी गई मादा भेड़ों की ओर संकेत करता है। आगे के स्त्रीलिंग रूपों और बच्चे जनने की छवि को स्पष्ट रखने के लिए ‘भेड़ों’ कहा गया है।
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: जो धुलाई से निकलकर ऊपर आई हैं
  rationale: पानी में धोए जाने के बाद भेड़ों के ऊपर आने की ठोस ग्रामीण छवि को बनाए रखता है। ‘धुलाई’ मूल संज्ञा הָרַחְצָה के निकट है।
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: उन सभी के जुड़वाँ बच्चे हैं
  rationale: מַתְאִימוֹת में जोड़ी या जुड़वाँ होने का भाव है। यह अनुवाद भेड़ों की उपमा को बनाए रखते हुए दाँतों की समान जोड़ों वाली पूरी पंक्ति का संकेत देता है।
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: और उनमें से कोई भी अपने बच्चे से वंचित नहीं है
  rationale: שַׁכֻּלָה का मूल भाव संतान खो देने या संतान-विहीन होने का है। यह रूप भेड़ों की छवि को सीधे दाँतों की व्याख्या में बदले बिना सुरक्षित रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। मूल की ग्रामीण भेड़-उपमा को स्पष्ट व्याख्या से बदलने के बजाय पाठ में सुरक्षित रखा गया है; उसके निहित अर्थ को पादटिप्पणियों में बताया गया है।
