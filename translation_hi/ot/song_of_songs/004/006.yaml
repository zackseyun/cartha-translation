  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים אֵ֤לֶךְ לִ/י֙ אֶל הַ֣ר הַ/מּ֔וֹר וְ/אֶל גִּבְעַ֖ת הַ/לְּבוֹנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/004/006.yaml
  text: Until the day breathes and the shadows flee[b][a], I will go to the mountain of myrrh and to the hill of frankincense.
translation:
  language: hi
  text: जब तक दिन साँस ले और छायाएँ भाग जाएँ,[a] मैं गन्धरस के पर्वत और लोबान की पहाड़ी पर जाऊँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक दिन फूँके/ठंडा हो और छायाएँ भाग जाएँ।” इब्रानी क्रिया का शाब्दिक अर्थ “साँस लेना” या “फूँकना” है; यहाँ संध्या की हवा अथवा भोर फूटने का संकेत हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “मैं अपने लिए जाऊँगा” है। “अपने लिए” अलग अर्थ देने के बजाय कथन पर बल भी दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: जब तक दिन साँस लेने लगे
  rationale: עַד temporal limit को व्यक्त करता है, और פוח का मूल बिंब ‘साँस लेना/फूँकना’ है। यह अनुवाद दिन के मानवीकरण को बनाए रखता है और भोर अथवा संध्या का निर्णय मुख्य पाठ में नहीं करता।
- source_word: וְנָסוּ הַצְּלָלִים
  choice: और छायाएँ भाग न जाएँ
  rationale: נוס का सजीव अर्थ ‘भागना’ है; ‘मिट जाना’ की अपेक्षा यह मूल काव्यात्मक क्रिया को अधिक निकटता से सुरक्षित रखता है।
- source_word: אֵלֶךְ לִי
  choice: मैं … जाऊँगा
  rationale: אֵלֶךְ प्रथम पुरुष एकवचन है। לִי यहाँ नैतिक/हितवाचक dative हो सकता है, जो केवल बल भी जोड़ सकता है; अप्राकृतिक ‘अपने लिए’ को मुख्य पाठ में न जोड़कर उसकी बारीकी पादटिप्पणी में रखी गई है।
- source_word: הַר הַמּוֹר
  choice: गन्धरस का पहाड़
  rationale: मोर सुगन्धित राल ‘गन्धरस’ है। ठोस काव्य-बिंब को बिना रूपकात्मक व्याख्या जोड़े रखा गया है।
- source_word: גִּבְעַת הַלְּבוֹנָה
  choice: लोबान की पहाड़ी
  rationale: לְבוֹנָה विशेष रूप से लोबान को दर्शाता है, और גִּבְעָה को ‘पहाड़ी’ कहने से पहले आए הַר ‘पहाड़’ का भेद बना रहता है।
theological_decisions:
- issue: सुगन्धित पहाड़ और पहाड़ी के बिंब का आशय
  choice: मुख्य पाठ में शाब्दिक काव्य-बिंब बनाए रखना
  alternative: इसे प्रिय के शरीर, उपासना-स्थल या आत्मिक आश्रय के स्पष्ट रूपक के रूप में अनूदित करना
  rationale: इब्रानी पाठ संदर्भित वस्तु की स्पष्ट पहचान नहीं करता। किसी कामुक, स्थानगत या आध्यात्मिक व्याख्या को पाठ में आरोपित करने के बजाय वास्तविक अस्पष्टता सुरक्षित रखी गई है।
- issue: ‘दिन के साँस लेने’ का समय
  choice: भोर या संध्या तय किए बिना रूपक बनाए रखना
  alternative: ‘भोर होने तक’ अथवा ‘दिन ठंडा होने तक’
  rationale: פוח हवा चलने, दिन के ठंडा होने या भोर फूटने का संकेत दे सकता है। मुख्य पाठ किसी एक समयगत व्याख्या को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। ‘दिन साँस लेने लगे’ और ‘छायाएँ भाग जाएँ’ जैसे मानवीकरण मूल इब्रानी की सजीवता को बनाए रखते हैं। ‘गन्धरस’ और ‘लोबान’ सामान्य हिन्दी बाइबलीय-सुगन्धित पदार्थों के स्पष्ट नाम हैं; किसी सम्प्रदायगत या रूपकात्मक अर्थ को मुख्य पाठ में नहीं जोड़ा गया।
