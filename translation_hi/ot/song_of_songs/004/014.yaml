translation:
  language: hi
  text: 'जटामांसी और केसर,[a]

    सुगंधित नरकट[b] और दालचीनी,

    लोबान के सभी वृक्षों के साथ,[c]

    गन्धरस और अगरु,[d]

    और सभी उत्तम सुगंध-द्रव्यों के साथ।[e]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “जटामांसी” को “नार्ड” भी कहते हैं।
    reason: lexical_alternative
  - marker: b
    text: या “सुगंधित बेंत।”
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “लोबान के सभी वृक्षों के साथ।”
    reason: lexical_alternative
  - marker: d
    text: यहाँ “अगरु” से सम्भवतः सुगंधित अगरवुड अभिप्रेत है, एलोवेरा नहीं।
    reason: cultural_note
  - marker: e
    text: इब्रानी में शाब्दिक रूप से, “सुगंध-द्रव्यों के प्रधान।”
    reason: lexical_alternative
