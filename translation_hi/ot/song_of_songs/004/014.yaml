  choice: लोबान के सभी वृक्षों के साथ
  rationale: इब्रानी के वृक्ष-संबंधी बिंब और 'सभी' की व्यापकता को निकटता से सुरक्षित रखता है।
- source_word: מֹר
  choice: गन्धरस
  rationale: सुगंधित राल myrrh के लिए प्रचलित बाइबलीय हिन्दी पद; इसे लोबान से अलग रखता है।
- source_word: אֲהָלוֹת
