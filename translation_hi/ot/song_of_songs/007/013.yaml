source:
  edition: WLC
  text: נַשְׁכִּ֨ימָה֙ לַ/כְּרָמִ֔ים נִרְאֶ֞ה אִם פָּֽרְחָ֤ה הַ/גֶּ֨פֶן֙ פִּתַּ֣ח הַ/סְּמָדַ֔ר הֵנֵ֖צוּ הָ/רִמּוֹנִ֑ים שָׁ֛ם אֶתֵּ֥ן אֶת דֹּדַ֖/י לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/013.yaml
  text: Let us rise early for the vineyards[a]; let us see whether the vine has budded, whether the blossom has opened, whether the pomegranates are in bloom[c][b]. There I will give you my love.
translation:
  language: hi
  text: आओ, हम भोर होते ही दाख की बारियों की ओर चलें[a]; देखें कि दाखलता में कोंपलें फूटी हैं या नहीं[b], उसके फूल खिले हैं या नहीं, और अनारों में बहार आई है या नहीं। वहीं मैं तुम्हें अपना प्रेम दूँगी[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दाख की बारियों में चलें।” इब्रानी संबंधबोधक यहाँ गंतव्य की दिशा बताता है।
    reason: lexical_alternative
  - marker: b
    text: या, “दाखलता फूली है।” इब्रानी क्रिया अंकुर फूटने या फूलने, दोनों को व्यक्त कर सकती है; “कोंपलें फूटी हैं” अगली पंक्ति में फूल खिलने तक के संभावित क्रम को बनाए रखता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “मेरे प्रेमों।” इब्रानी बहुवचन यहाँ संभवतः गहन या सामूहिक अर्थ में “मेरा प्रेम” अथवा “मेरा प्रेम-दुलार” व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נַשְׁכִּימָה
  choice: आओ, हम भोर होते ही ... चलें
  rationale: हिफ़ील कोहोर्टेटिव में साथ मिलकर शीघ्र निकलने का निमंत्रण और प्रातःकाल का भाव दोनों हैं। यह हिंदी में स्वाभाविक ढंग से दोनों को व्यक्त करता है।
- source_word: לַכְּרָמִים
  choice: दाख की बारियों को
  rationale: ל यहाँ दिशा या गंतव्य बताता है। ‘को चलें’ आधुनिक हिंदी में ‘की ओर/तक चलें’ का स्वाभाविक संक्षिप्त रूप है; ‘दाख की बारियाँ’ כרמים का स्पष्ट बहुवचन है।
- source_word: נִרְאֶה אִם
  choice: देखें कि ... या नहीं
  rationale: ראה का कोहोर्टेटिव साथ मिलकर निरीक्षण करने का प्रस्ताव है, और אם यहाँ परोक्ष प्रश्न आरंभ करता है।
- source_word: פָּרְחָה הַגֶּפֶן
  choice: दाखलता में कोंपलें फूटी हैं
  rationale: פרח अंकुर फूटने या फूलने, दोनों का संकेत दे सकता है। अगले पदबंध में फूल खुलने का उल्लेख होने के कारण ‘कोंपलें फूटी हैं’ संभावित विकास-क्रम को बनाए रखता है।
- source_word: פִּתַּח הַסְּמָדַר
  choice: उसके फूल खिले हैं
  rationale: סמדר दाख के आरंभिक पुष्प या बौर को सूचित करता है और פתח खुलने का भाव देता है। संदर्भ से दाखलता स्पष्ट होने के कारण ‘उसके फूल’ सहज और सुबोध है।
- source_word: הֵנֵצוּ הָרִמּוֹנִים
  choice: अनारों में बहार आई है
  rationale: נוץ फूल निकलने या खिलने को दर्शाता है। ‘बहार आई है’ हिंदी का स्वाभाविक बागवानी-संबंधी प्रयोग है और फूलने का चित्र बनाए रखता है।
- source_word: שָׁם
  choice: वहीं
  rationale: यह क्रिया-विशेषण स्थान पर बल देता है—उसी दाखबारी के परिवेश में—न कि केवल समय-क्रम पर।
- source_word: אֶתֵּן אֶת דֹּדַי לָךְ
  choice: मैं तुम्हें अपना प्रेम दूँगी
  rationale: נתן का सीधा अर्थ ‘देना’ है। דֹּדַי व्याकरणतः बहुवचन है, पर यहाँ प्रेम या प्रेमपूर्ण अंतरंगता का सामूहिक/तीव्र भाव हो सकता है। स्त्री वक्ता का लिंग क्रियारूप से नहीं, व्यापक काव्य-संवाद से स्पष्ट होता है; हिंदी में भविष्यकाल के लिए ‘दूँगी’ आवश्यक है।
