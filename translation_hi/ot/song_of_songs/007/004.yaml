lexical_decisions:
- source_word: שְׁנֵי שָׁדַיִךְ
  choice: तेरे दोनों स्तन
  rationale: שְׁנֵי paired number को और שָׁדַיִךְ स्तनों को स्त्रीलिंग एकवचन संबोधन-सूचक प्रत्यय के साथ व्यक्त करता है। ‘दोनों’ स्वाभाविक हिन्दी में जोड़ी का भाव स्पष्ट करता है, और ‘स्तन’ मूल की ठोस, कामुक काव्य-भाषा को शिष्टतापूर्वक बनाए रखता है।
- source_word: כִּשְׁנֵי עֳפָרִים
  choice: बच्चों के समान
  rationale: तुलनासूचक כִּ को ‘के समान’ से व्यक्त किया गया है। עֳפָרִים युवा हिरन/मृग-वर्गीय पशुओं के बच्चे हैं; हिन्दी में आगे आने वाली मादा पशु-संज्ञा के साथ ‘बच्चों’ कहना स्वाभाविक है। संख्या दो होने का भाव ‘जुड़वाँ’ में सुरक्षित है।
- source_word: תָּאֳמֵי צְבִיָּה
  choice: हिरनी के जुड़वाँ बच्चे
  rationale: תָּאֳמֵי matched twin pair को दर्शाता है और צְבִיָּה स्त्रीलिंग एकवचन मृग/गज़ेल को। ‘हिरनी’ सामान्य आधुनिक हिन्दी में सहज और काव्यात्मक है; अधिक विशिष्ट ‘मादा चिकारा’ भी सम्भव है, इसलिए विकल्प पादटिप्पणी में दिया गया है।
