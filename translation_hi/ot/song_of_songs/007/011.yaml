lexical_decisions:
- source_word: אֲנִי
  choice: मैं
  rationale: इब्रानी में प्रथम पुरुष एकवचन सर्वनाम स्पष्ट रूप से आया है; काव्यात्मक बल बनाए रखने के लिए इसे रखा गया है।
- source_word: לְדוֹדִי
  choice: अपने प्रियतम की हूँ
  rationale: לְ उपसर्ग वाला यह क्रियारहित वाक्य यहाँ संबंध और अपनेपन को व्यक्त करता है। हिन्दी में स्त्री वक्ता के लिए ‘मैं अपने प्रियतम की हूँ’ स्वाभाविक है और गीतगीत 2:16 तथा 6:3 के आवर्ती संबंध-सूत्र से मेल खाता है।
- source_word: וְעָלַי
  choice: मेरी ओर
  rationale: תְּשׁוּקָה के साथ עַל अभिलाषा की दिशा या लक्ष्य बताता है। ‘मेरी ओर’ मूल की स्थानिक-दिशात्मक छवि को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: תְּשׁוּקָתוֹ
  choice: उसकी अभिलाषा
  rationale: תְּשׁוּקָה तीव्र इच्छा, चाह या लालसा को दर्शाता है। ‘अभिलाषा’ गरिमापूर्ण और स्पष्ट है तथा उत्पत्ति 3:16 और 4:7 से संभावित शब्द-संबंध को अनावश्यक व्याख्या के बिना सुरक्षित रखता है; प्रत्यय וֹ को ‘उसकी’ से व्यक्त किया गया है।
theological_decisions:
- issue: संबंधसूचक क्रियारहित वाक्य का अर्थ
  choice: ‘मैं अपने प्रियतम की हूँ’—प्रेमपूर्ण पारस्परिक अपनेपन का भाव
  alternative: ‘मैं अपने प्रियतम के लिए हूँ’
  rationale: शाब्दिक रूप से לְ दिशा या समर्पण का भाव दे सकता है, पर गीतगीत में बार-बार आने वाला यह सूत्र मुख्यतः संबंध और अपनेपन को व्यक्त करता है। अनुवाद इसी सहज काव्यात्मक अर्थ को रखता है और बाद की रूपकात्मक या सम्प्रदायगत व्याख्या नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और प्रेम-काव्य के अनुरूप भाषा। स्त्री वक्ता का लिंग ‘की हूँ’ से स्पष्ट है। ‘प्रियतम’ דּוֹד के प्रणय-संबंधी अर्थ को व्यक्त करता है; ‘अभिलाषा मेरी ओर है’ मूल की दिशा-सूचक रचना और उसकी काव्यात्मक तन्यता को बनाए रखता है।
