  text: I am my beloved's[a], and his desire is for me.
translation:
  language: hi
  text: मैं अपने प्रियतम की हूँ[a], और उसकी अभिलाषा मेरी ओर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
