lexical_decisions:
- source_word: לְכָה
  choice: आओ
  rationale: הלך का पुल्लिंग एकवचन आज्ञार्थ यहाँ प्रिय को साथ चलने का आत्मीय निमंत्रण देता है; आधुनिक हिन्दी में “आओ” इसका स्वाभाविक रूप है।
- source_word: דוֹדִי
  choice: मेरे प्रिय
  rationale: गीतश्रेष्ठ में यह प्रेमपूर्ण संबोधन है; “मेरे प्रिय” काव्यात्मक गरिमा और आत्मीय संबंध दोनों बनाए रखता है।
- source_word: נֵצֵא
  choice: हम ... निकल चलें
  rationale: יצא का प्रथम पुरुष बहुवचन इच्छार्थ साझा प्रस्ताव व्यक्त करता है। “निकल चलें” वर्तमान स्थान छोड़कर साथ जाने की दिशा और आमंत्रण दोनों को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: הַשָּׂדֶה
  choice: खेतों में
  rationale: שדה का मूल अर्थ खेत या खुला ग्रामीण क्षेत्र है। यहाँ एकवचन निश्चित रूप सामूहिक अर्थ में लिया जा सकता है; हिन्दी का बहुवचन “खेतों में” प्राकृतिक ग्रामीण दृश्य देता है और अगले पद के כפרים को “गाँव” रखने देता है।
- source_word: נָלִינָה
  choice: रात बिताएँ
  rationale: לון/לין का इच्छार्थ बहुवचन रात ठहरने का साझा प्रस्ताव है; “रात बिताएँ” स्पष्ट, आधुनिक और काव्य-संदर्भ के अनुकूल है।
- source_word: בַּכְּפָרִים
  choice: गाँवों की ओर
  rationale: כפרים का सामान्य अर्थ “गाँव” है। काव्य-पंक्ति के हिन्दी विन्यास में इसे गंतव्य के रूप में पहले खंड से जोड़ा गया है; इब्रानी में उपसर्ग בְּ का सीधा स्थानीय अर्थ “गाँवों में” भी संभव है, जिसे पादटिप्पणी में रखा गया है।
