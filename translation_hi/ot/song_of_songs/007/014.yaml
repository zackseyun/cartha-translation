source:
  edition: WLC
  text: הַֽ/דּוּדָאִ֣ים נָֽתְנוּ רֵ֗יחַ וְ/עַל פְּתָחֵ֨י/נוּ֙ כָּל מְגָדִ֔ים חֲדָשִׁ֖ים גַּם יְשָׁנִ֑ים דּוֹדִ֖/י צָפַ֥נְתִּי לָֽ/ךְ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/014.yaml
  text: The mandrakes give off fragrance[a], and at our doorways are all choice fruits, new as well as old, which I have stored up for you[b], my beloved.
translation:
  language: hi
  text: मैंड्रेक सुगंध फैला रहे हैं[a], और हमारे द्वारों के पास हर प्रकार के उत्तम फल हैं[b]—नए भी और पुराने भी—जिन्हें मैंने तुम्हारे लिए संजोकर रखा है, मेरे प्रिय।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दूदाफल”; यह पौधा प्राचीन परंपरा में प्रेम और जननक्षमता से जुड़ा माना जाता था।
    reason: lexical_alternative
  - marker: b
    text: या “हर प्रकार के व्यंजन” अथवा “हर प्रकार की बहुमूल्य वस्तुएँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַדּוּדָאִים
  choice: दूदाफल
  rationale: यह דּוּדָאִים का प्रचलित हिन्दी बाइबलीय वनस्पति-नाम है; पौधे की सटीक आधुनिक पहचान को अनावश्यक रूप से निश्चित किए बिना मूल का ठोस वनस्पति-संदर्भ बनाए रखता है।
- source_word: נָתְנוּ רֵיחַ
  choice: सुगंध दे रहे हैं
  rationale: शाब्दिक अर्थ ‘सुगंध दी है’ है, पर काव्य-दृश्य में जारी वर्तमान अनुभूति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְעַל פְּתָחֵינוּ
  choice: और हमारे द्वारों पर
  rationale: עַל और פְּתָחֵינוּ के स्थानिक अर्थ को निकटता से सुरक्षित रखते हुए हिन्दी में स्वाभाविक है।
- source_word: כָּל מְגָדִים
  choice: हर प्रकार के उत्तम फल
  rationale: מְגָדִים बहुमूल्य या मनभावनी उपज/वस्तुओं को सूचित कर सकता है; आसपास की वनस्पति-छवि के कारण ‘उत्तम फल’ उपयुक्त है, जबकि वैकल्पिक व्यापक अर्थ पाद-टिप्पणी में रखा गया है।
- source_word: חֲדָשִׁים גַּם יְשָׁנִים
  choice: नए भी और पुराने भी
  rationale: גַּם की समावेशी शक्ति और नए-पुराने के काव्यात्मक विरोध को स्पष्ट और सहज हिन्दी में बनाए रखता है।
- source_word: דּוֹדִי
  choice: मेरे प्रिय
  rationale: श्रेष्ठगीत में यह अंतरंग संबोधन है; ‘मेरे प्रिय’ आधुनिक, स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: צָפַנְתִּי לָךְ
  choice: जिन्हें मैंने तुम्हारे लिए संजोकर रखा है
  rationale: צפן के सुरक्षित रख छोड़ने और मूल्यवान वस्तु की तरह सहेजने—दोनों भावों को व्यक्त करता है।
