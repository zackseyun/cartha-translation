base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/008.yaml
  text: This stature of yours is like a palm tree[a], and your breasts are like clusters of fruit.
translation:
  language: hi
  text: तुम्हारा यह कद खजूर के पेड़ के समान है, और तुम्हारे स्तन फलों के गुच्छों[a] के समान हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंगूर के गुच्छों के समान।” इब्रानी शब्द प्रायः अंगूर के गुच्छों के लिए प्रयुक्त होता है, यद्यपि यहाँ फल का नाम स्पष्ट रूप से नहीं दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת קוֹמָתֵךְ
  choice: तुम्हारा यह कद
  rationale: קוֹמָה शरीर की ऊँचाई, गठन या कद को दर्शाता है। ‘तुम्हारा यह कद’ संकेतवाचक की निकटता और स्त्री की समूची खड़ी देहाकृति का स्वाभाविक हिंदी बोध बनाए रखता है।
- source_word: דָּמְתָה לְתָמָר
  choice: खजूर के पेड़ के समान है
  rationale: דמה समानता प्रकट करता है और תָּמָר खजूर का पेड़ है। वर्तमानकालीन हिंदी रचना काव्यात्मक तुलना को सहज रूप में व्यक्त करती है।
- source_word: וְשָׁדַיִךְ
  choice: और तुम्हारे स्तन
  rationale: שָׁדַיִם का सीधा अर्थ ‘स्तन’ है। गीत के प्रेम-काव्य में मूल पाठ की स्पष्ट शारीरिक भाषा को नरम या अस्पष्ट नहीं किया गया है।
- source_word: לְאַשְׁכֹּלוֹת
  choice: फलों के गुच्छों के समान
  rationale: אֶשְׁכּוֹל गुच्छे को दर्शाता है और प्रायः अंगूर के गुच्छे के लिए आता है, पर यहाँ फल का प्रकार स्पष्ट नहीं है। ‘फलों के गुच्छों’ से चित्र समझ में आता है और मूल की अनिश्चितता भी बनी रहती है।
