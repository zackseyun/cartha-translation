  register: आधुनिक, सहज और गरिमापूर्ण हिंदी रखी गई है। प्रेम-काव्य की शारीरिक स्पष्टता को बिना शिष्टोक्ति के सुरक्षित रखा गया है; तुलना की काव्यात्मकता के लिए ‘के समान’ प्रयोग किया गया है।
