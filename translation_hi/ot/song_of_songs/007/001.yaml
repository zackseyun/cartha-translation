language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: שׁ֤וּבִי שׁ֨וּבִי֙ הַ/שּׁ֣וּלַמִּ֔ית שׁ֥וּבִי שׁ֖וּבִי וְ/נֶחֱזֶה בָּ֑/ךְ מַֽה תֶּחֱזוּ֙ בַּ/שּׁ֣וּלַמִּ֔ית כִּ/מְחֹלַ֖ת הַֽ/מַּחֲנָֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/001.yaml
  text: Return[a], return, O Shulammite; return, return, that we may look at you[b]. Why do you look at the Shulammite as at the dance of Mahanaim?
translation:
  language: hi
  text: लौट आ, लौट आ, हे शूलम्मीत; लौट आ, लौट आ, कि हम तुझे देखें। तुम शूलम्मीत को महनैम के नृत्य की तरह क्यों देखते हो[a]?[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम शूलम्मीत में क्या देखते हो?—महनैम के नृत्य जैसा।” इस उपवाक्य का इब्रानी पाठ कठिन है; कुछ अनुवाद प्रश्नवाचक शब्द का अर्थ “क्यों” के बजाय “क्या” लेते हैं।
    reason: alternative_reading
  - marker: b
    text: “महनैम” संभवतः एक स्थान का नाम है; इस नाम का अर्थ “दो छावनियाँ” हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: שׁוּבִי
  choice: लौट आ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप है। ‘लौट आ’ बार-बार दिए गए आह्वान को स्वाभाविक आधुनिक हिन्दी में रखता है और यह निश्चित नहीं करता कि लौटना शारीरिक है या संबंधपरक।
- source_word: הַשּׁוּלַמִּית
  choice: शूलम्मीत स्त्री
  rationale: यह किसी स्थान से संबंध बताने वाला नाम, उपाधि या काव्यात्मक संबोधन हो सकता है। लिप्यंतरण इस अनिश्चितता को सुरक्षित रखता है; ‘स्त्री’ हिन्दी में संबोधन और स्त्री-संदर्भ स्पष्ट करता है।
- source_word: וְנֶחֱזֶה בָּךְ
  choice: कि हम तुझे देखें
  rationale: दोहराई गई आज्ञाओं के बाद प्रथम पुरुष बहुवचन रूप उद्देश्य व्यक्त करता है। यह सरल और स्वाभाविक है तथा दृष्टि के भाव को बिना अनावश्यक तीव्रता के रखता है।
- source_word: מַה
  choice: क्यों
  rationale: मूलतः ‘क्या’ होते हुए भी यहाँ प्रश्नवाचक-व्याख्यात्मक अर्थ ‘क्यों’ संभव है और अगले क्रियापद के साथ सहज वाक्य बनाता है। कठिन वैकल्पिक रचना पादटिप्पणी में दी गई है।
- source_word: תֶּחֱזוּ
  choice: तुम ... देखते हो
  rationale: द्वितीय पुरुष पुल्लिंग बहुवचन रूप संवाद में वक्ता-परिवर्तन को बनाए रखता है और पहले आए חזה के साथ शब्दगत संबंध सुरक्षित करता है।
- source_word: כִּמְחֹלַת
  choice: ऐसे ... जैसे ... का नृत्य
  rationale: उपसर्ग כְּ तुलना दर्शाता है। हिन्दी में ‘ऐसे ... जैसे’ तुलना को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַמַּחֲנָיִם
  choice: महनैम
  rationale: इसे संभावित स्थान-नाम मानकर लिप्यंतरित किया गया है। इसका शाब्दिक संबंध ‘दो छावनियों’ से हो सकता है, जिसे पादटिप्पणी में रखा गया है।
theological_decisions: []
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। चार बार दोहराए गए स्त्रीलिंग आह्वान को सुरक्षित रखा गया है। ‘तुझे’ निकट और काव्य-संगत संबोधन है; बहुवचन ‘तुम’ मूल पाठ में वक्ताओं/समूह के परिवर्तन को दर्शाता है।
