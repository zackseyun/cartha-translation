source:
  edition: WLC
  text: צַוָּארֵ֖/ךְ כְּ/מִגְדַּ֣ל הַ/שֵּׁ֑ן עֵינַ֜יִ/ךְ בְּרֵכ֣וֹת בְּ/חֶשְׁבּ֗וֹן עַל שַׁ֨עַר֙ בַּת רַבִּ֔ים אַפֵּ/ךְ֙ כְּ/מִגְדַּ֣ל הַ/לְּבָנ֔וֹן צוֹפֶ֖ה פְּנֵ֥י דַמָּֽשֶׂק־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/005.yaml
  text: Your neck is like a tower of ivory[a]; your eyes are pools in Heshbon, by the gate of Bath-rabbim. Your nose is like the tower of Lebanon[c][b], looking toward Damascus.
translation:
  language: hi
  text: 'तेरी गर्दन हाथीदाँत की मीनार के समान है;


    तेरी आँखें हेशबोन के जलकुंडों के समान हैं,


    बत-रब्बीम के फाटक के पास।[a]


    तेरी नाक[b] लबानोन की मीनार के समान है,


    जो दमिश्क की ओर देखती है।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “बहुतों के फाटक के पास” अथवा “जनसमृद्ध नगर के फाटक के पास।” इब्रानी पदबंध “बत-रब्बीम” किसी स्थान का नाम भी हो सकता है और उसका वर्णनात्मक अर्थ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: मूल इब्रानी में “नाक” है। यह बिंब सम्भवतः प्रेयसी के गरिमामय मुख-पार्श्व की प्रशंसा करता है, न कि आधुनिक दृष्टि से किसी एक अंग को असहज ढंग से अलग करता है।
    reason: cultural_note
  - marker: c
    text: या “जो दमिश्क पर दृष्टि रखती है” अथवा “जिसका मुख दमिश्क की ओर है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: צַוָּארֵךְ
  choice: तेरी गरदन
  rationale: यह संज्ञा गरदन या गर्दन के पिछले भाग को सूचित करती है; इस काव्यात्मक अंग-वर्णन में ‘गरदन’ स्वाभाविक और सीधा अनुवाद है।
- source_word: כְּמִגְדַּל הַשֵּׁן
  choice: हाथीदाँत की मीनार के समान
  rationale: כְּ तुलना को और הַשֵּׁן इस संबंध में हाथीदाँत को व्यक्त करता है; इस प्रकार मूल उपमा अक्षुण्ण रहती है।
- source_word: עֵינַיִךְ בְּרֵכוֹת
  choice: तेरी आँखें ... जलकुंडों के समान हैं
  rationale: בְּרֵכוֹת तालाबों अथवा जल-संचय के कुंडों को सूचित करता है। हिन्दी में तुलना को स्पष्ट करने के लिए ‘के समान’ जोड़ा गया है, जो मूल काव्यात्मक रूपक का आशय व्यक्त करता है।
- source_word: בְּחֶשְׁבּוֹן
  choice: हेशबोन
  rationale: स्थान-नाम का हिन्दी लिप्यंतरण किया गया है।
- source_word: עַל שַׁעַר בַּת רַבִּים
  choice: बत-रब्बीम के फाटक के पास
  rationale: मुख्य पाठ में בַּת רַבִּים को अनिश्चित अर्थ वाले स्थान-नाम के रूप में लिप्यंतरित किया गया है और עַל को इस स्थान-सूचक संदर्भ में ‘के पास’ कहा गया है।
- source_word: אַפֵּךְ
  choice: तेरी नाक
  rationale: मूल शब्द का सामान्य और इस संदर्भ में सर्वाधिक विशिष्ट अर्थ ‘नाक’ है; ‘चेहरा’ कहने से मूल बिंब की विशिष्टता मिट जाती।
- source_word: כְּמִגְדַּל הַלְּבָנוֹן
  choice: लबानोन की मीनार के समान
  rationale: सम्बन्ध-सूचक इब्रानी रचना को सीधे रखा गया है और लबानोन को स्थान-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: צוֹפֶה פְּנֵי דַמָּשֶׂק
  choice: जो दमिश्क की ओर देखती है
  rationale: צוֹפֶה सक्रिय दृष्टि अथवा निगरानी की मुद्रा व्यक्त करता है, जबकि פְּנֵי דַמָּשֶׂק यहाँ ‘दमिश्क की ओर’ का मुहावरेदार अर्थ देता है।
