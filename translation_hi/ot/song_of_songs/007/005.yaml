translation_notes:
  register: आधुनिक मानक हिन्दी में स्वाभाविक, गरिमामय काव्य-भाषा रखी गई है। स्त्रीलिंग एकवचन संबोधन के लिए ‘तेरी’ प्रयुक्त है। पंक्ति-विन्यास मूल की समानांतर उपमाओं को उभारता है। ‘जलकुंड’ से स्थिर, निर्मल जल का बिंब बना रहता है; हिन्दी में अपूर्ण लगने वाले नामवाचक रूपक को स्पष्ट करने के लिए ‘के समान’ जोड़ा गया है।
