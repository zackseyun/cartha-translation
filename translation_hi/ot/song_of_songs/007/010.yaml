source:
  edition: WLC
  text: וְ/חִכֵּ֕/ךְ כְּ/יֵ֥ין הַ/טּ֛וֹב הוֹלֵ֥ךְ לְ/דוֹדִ֖/י לְ/מֵישָׁרִ֑ים דּוֹבֵ֖ב שִׂפְתֵ֥י יְשֵׁנִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/010.yaml
  text: And your mouth is like the best wine[a], going down smoothly for my beloved[b], gliding over the lips of sleepers.
translation:
  language: hi
  text: 'और तुम्हारा मुँह[a] उत्तम दाखमधु के समान है,

    जो मेरे प्रिय की ओर सहजता से बहता है,

    और सोए हुओं के होंठों पर धीरे से सरकता है।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तुम्हारा तालू”; इब्रानी शब्द विशेष रूप से मुँह की छत या स्वाद ग्रहण करनेवाले तालू को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “सोए हुओं के होंठों से बुलवाता है।” यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और वह होंठों पर कोमल गति अथवा दाखमधु के प्रभाव से उनके बोल उठने—दोनों में से किसी का वर्णन कर सकती है।
    reason: alternative_reading
lexical_decisions:
- source_word: חִכֵּךְ
  choice: तुम्हारा मुँह
  rationale: इब्रानी संज्ञा का शाब्दिक अर्थ ‘तालू’ है, पर इस प्रेम-काव्य में ‘मुँह’ स्वाभाविक रूप से व्यापक आशय व्यक्त करता है; अधिक सटीक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: כְּיֵין הַטּוֹב
  choice: उत्तम दाखमधु के समान
  rationale: यह वाक्यांश उच्च कोटि की मदिरा से तुलना करता है। ‘उत्तम दाखमधु’ काव्यात्मक और वर्तमान मानक हिन्दी में गरिमापूर्ण है।
- source_word: הוֹלֵךְ
  choice: बहता है
  rationale: मूल क्रिया सामान्यतः ‘जाना/चलना’ है; दाखमधु के प्रसंग में उसका प्रवाह अभिप्रेत है, जिसे हिन्दी में ‘बहता है’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְדוֹדִי
  choice: मेरे प्रिय की ओर
  rationale: לְ दिशा अथवा संबंध बता सकता है। ‘की ओर’ दाखमधु की गति की छवि और प्रथम पुरुष ‘मेरे प्रिय’—दोनों को बनाए रखता है।
- source_word: לְמֵישָׁרִים
  choice: सहजता से
  rationale: शाब्दिक भाव ‘सीधेपन से’ है, पर दाखमधु के प्रवाह के साथ यह बिना रुकावट, सुगमता से बहने का भाव देता है।
- source_word: דּוֹבֵב
  choice: धीरे से सरकता है
  rationale: यह दुर्लभ रूप अनिश्चित है। प्रसंग में इसे होंठों पर दाखमधु की कोमल गति के रूप में प्रस्तुत किया गया है, जबकि ‘बुलवाना’ वाला संभावित अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: שִׂפְתֵי יְשֵׁנִים
  choice: सोए हुओं के होंठों
  rationale: यह निकट-शाब्दिक अनुवाद मूल की असामान्य और स्वप्निल काव्य-छवि को बिना स्पष्ट किए बनाए रखता है।
theological_decisions:
- issue: דּוֹבֵב की दुर्लभता से उत्पन्न अर्थगत अस्पष्टता
  choice: होंठों पर धीरे से सरकना
  alternative: सोए हुओं के होंठों से बुलवाना
  rationale: मदिरा के बहने की तत्काल छवि गति वाले अर्थ का समर्थन करती है, पर कारक अर्थ भी भाषिक रूप से संभव है; इसलिए उसे पादटिप्पणी में रखा गया है और तनाव को मिटाया नहीं गया।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, पर ‘उत्तम दाखमधु’ और पंक्तिबद्ध रचना से गीतात्मक गरिमा रखी गई है। ‘मुँह’ सामान्य पाठक के लिए स्वाभाविक है; ‘तालू’ की मूल-सटीकता पादटिप्पणी में दी गई है। दुर्लभ क्रिया की वास्तविक अस्पष्टता को मुख्य पाठ और पादटिप्पणी के माध्यम से सुरक्षित रखा गया है।
