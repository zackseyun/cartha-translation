  register: भाषा आधुनिक, गरिमापूर्ण और प्रेम-काव्य के अनुरूप स्पष्ट रखी गई है। दुर्लभ वनस्पति शब्द סַנְסִנָּיו के लिए ‘फलदार डालियाँ’ चुना गया है। אַפֵּךְ को व्याख्यात्मक ‘साँस’ के बजाय औपचारिक रूप से ‘नाक’ रखा गया है, ताकि मूल की असामान्य सुगंध-छवि बनी रहे।
