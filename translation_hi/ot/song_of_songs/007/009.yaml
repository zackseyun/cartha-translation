  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אָמַ֨רְתִּי֙ אֶעֱלֶ֣ה בְ/תָמָ֔ר אֹֽחֲזָ֖ה בְּ/סַנְסִנָּ֑י/ו וְ/יִֽהְיוּ נָ֤א שָׁדַ֨יִ/ךְ֙ כְּ/אֶשְׁכְּל֣וֹת הַ/גֶּ֔פֶן וְ/רֵ֥יחַ אַפֵּ֖/ךְ כַּ/תַּפּוּחִֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/009.yaml
  text: I said[a], “I will climb the palm tree; I will take hold of its branches. May your breasts be like clusters of the vine[b], and the fragrance of your breath like apples.”
translation:
  language: hi
  text: मैंने कहा, “मैं खजूर के पेड़ पर चढ़ूँगा और उसकी फलदार डालियाँ पकड़ूँगा। तुम्हारे स्तन अंगूर की बेल के गुच्छों के समान हों, और तुम्हारी नाक की सुगंध सेबों जैसी हो।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תָמָר
  choice: खजूर का पेड़
  rationale: यह संज्ञा खजूर की जाति के ताड़-वृक्ष को दर्शाती है; ‘खजूर का पेड़’ आधुनिक हिन्दी में ठोस और सहज चित्र प्रस्तुत करता है।
- source_word: אֶעֱלֶה
  choice: मैं ... चढ़ूँगा
  rationale: मूल अर्थ ‘ऊपर जाना’ है; पेड़ के संदर्भ में ‘चढ़ना’ स्वाभाविक है और वक्ता के निश्चय को व्यक्त करता है।
- source_word: אֹחֲזָה
  choice: पकड़ूँगा
  rationale: क्रिया का अर्थ पकड़ना या थामना है; यह मूल की सजीवता बनाए रखते हुए अनावश्यक हिंसक भाव से बचती है।
- source_word: סַנְסִנָּיו
  choice: उसकी फलदार डालियाँ
  rationale: दुर्लभ शब्द खजूर की शाखाओं अथवा फल धारण करने वाले डंठलों को सूचित करता है; ‘फलदार डालियाँ’ दोनों पहलुओं को संक्षेप में व्यक्त करता है।
- source_word: וְיִהְיוּ נָא
  choice: '... के समान हों'
  rationale: आज्ञार्थक/इच्छार्थक रूप के साथ נָא वक्ता की इच्छा व्यक्त करता है; हिन्दी में ‘हों’ इस भाव को स्वाभाविक रूप से रखता है।
- source_word: שָׁדַיִךְ
  choice: तुम्हारे स्तन
  rationale: शब्द का सीधा अर्थ ‘स्तन’ है; प्रेम-काव्य की कामुक उपमा को शिष्ट किंतु स्पष्ट रूप में रखा गया है।
- source_word: אֶשְׁכְּלֹת הַגֶּפֶן
  choice: अंगूर की बेल के गुच्छे
  rationale: शाब्दिक अर्थ ‘बेल के गुच्छे’ है; ‘अंगूर की बेल’ हिन्दी पाठक के लिए आशय स्पष्ट करती है।
- source_word: רֵיחַ
  choice: सुगंध
  rationale: सकारात्मक और प्रेमपूर्ण संदर्भ में ‘सुगंध’ तटस्थ ‘गंध’ की अपेक्षा अधिक उपयुक्त है।
- source_word: אַפֵּךְ
  choice: तुम्हारी नाक
  rationale: शब्द का प्रत्यक्ष शारीरिक अर्थ ‘नाक’ है। सुगंध के साथ इसका मेल असामान्य होते हुए भी मूल पाठ के रूपक और उसकी अस्पष्टता को सुरक्षित रखता है; ‘साँस’ अर्थ स्पष्ट करने वाला व्याख्यात्मक विकल्प होता।
- source_word: כַּתַּפּוּחִים
  choice: सेबों जैसी
  rationale: फल की ठीक पहचान विवादित है, पर पारंपरिक और व्यापक रूप से समझा जाने वाला अर्थ ‘सेब’ है।
