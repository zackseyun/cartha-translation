base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/003.yaml
  text: Your navel is a rounded bowl[a]; may it never lack mixed wine. Your belly is a heap of wheat[c][b], encircled with lilies.
translation:
  language: hi
  text: 'तेरी नाभि[a] एक गोल कटोरा है;

    उसमें मिश्रित दाखमधु[b] की कभी कमी न हो।

    तेरा पेट[c] गेहूँ का ढेर है,

    जो लिलियों से घिरा हुआ है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या सम्भवतः, “तेरी योनि एक गोल कटोरा है।” इस कामुक काव्य-संदर्भ में जिस हिब्रू शब्द का पारंपरिक अनुवाद “नाभि” किया जाता है, उसके सटीक अर्थ पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: या “मसालेदार दाखमधु।” हिब्रू में ऐसे दाखमधु का उल्लेख है जिसमें सम्भवतः पानी या मसाले मिलाए गए थे।
    reason: lexical_alternative
  - marker: c
    text: या “तेरी कोख,” यदि हिब्रू शब्द को बाहरी पेट के बजाय गर्भाशय के अर्थ में लिया जाए; फिर भी इस संदर्भ में “पेट” अधिक सम्भावित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁרְרֵךְ
  choice: तेरी नाभि
  rationale: इस शब्द का पारंपरिक और व्यापक अर्थ ‘नाभि’ है, और शरीर के अंगों के क्रमिक काव्य-वर्णन में यह स्वाभाविक बैठता है। कामोत्तेजक संदर्भ में ‘गुप्तांग’ का अर्थ भी प्रस्तावित किया गया है, पर शब्द-साक्ष्य निर्णायक नहीं है; इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: אַגַּן הַסַּהַר
  choice: एक गोल कटोरा
  rationale: אַגַּן किसी कटोरे या पात्र को दर्शाता है और הַסַּהַר उसकी गोल आकृति को। ‘गोल कटोरा’ हिब्रू बिंब को सहज और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: אַל יֶחְסַר
  choice: की कभी कमी न हो
  rationale: निषेधात्मक इच्छार्थक रूप को साधारण कथन के बजाय कामना के रूप में रखा गया है, जिससे मूल की काव्यात्मक शक्ति बनी रहती है।
- source_word: הַמָּזֶג
  choice: मिश्रित दाखमधु
  rationale: यह मिलाए हुए, सम्भवतः पानी या मसालों के साथ तैयार किए गए दाखमधु को दर्शाता है। ‘मिश्रित दाखमधु’ मूल के निकट है और ‘मसालेदार दाखमधु’ की सम्भावना पादटिप्पणी में सुरक्षित है।
- source_word: בִּטְנֵךְ
  choice: तेरा पेट
  rationale: בֶּטֶן सामान्यतः पेट या उदर को दर्शाता है; कुछ प्रसंगों में इसका अर्थ गर्भ अथवा कोख भी हो सकता है। यहाँ बाहरी शारीरिक वर्णन के क्रम में ‘पेट’ अधिक सम्भावित है।
- source_word: עֲרֵמַת חִטִּים
  choice: गेहूँ का ढेर
  rationale: यह सीधा संबंध-वाचक पद है। ‘गेहूँ का ढेर’ मूल के कृषि-बिंब और काव्यात्मक बनावट को बनाए रखता है।
- source_word: סוּגָה בַּשּׁוֹשַׁנִּים
  choice: लिली के फूलों से घिरा
  rationale: סוּגָה चारों ओर से घेरे जाने का भाव देता है। בַּשּׁוֹשַׁנִּים को आधुनिक हिन्दी में परिचित पुष्पनाम ‘लिली के फूलों’ से व्यक्त किया गया है।
