base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/002.yaml
  text: How beautiful are your feet in sandals[a], O noble daughter! The curves of your thighs are like jewels[b], the work of the hands of a master craftsman.
translation:
  language: hi
  text: हे कुलीन कन्या, सैंडल पहने तुम्हारे पाँव कितने सुंदर हैं! तुम्हारी जाँघों[a] के घुमाव कुशल कारीगर के हाथों से बने आभूषणों[b] जैसे हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कूल्हों’। इब्रानी शब्द जाँघ और कूल्हे के व्यापक क्षेत्र को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘रत्नों’ अथवा ‘हारों’। इब्रानी शब्द सम्भवतः बहुमूल्य, गढ़े हुए अलंकरणों को सूचित करता है।
    reason: lexical_alternative
