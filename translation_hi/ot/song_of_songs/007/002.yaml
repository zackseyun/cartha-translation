- source_word: חַמּוּקֵי יְרֵכַיִךְ
  choice: तुम्हारी जाँघों के घुमाव
  rationale: חַמּוּקֵי के गोलाई और मुड़ाव के सौन्दर्यबोध को ‘घुमाव’ व्यक्त करता है; יָרֵךְ के लिए मुख्य पाठ में ‘जाँघ’ चुना गया है और व्यापक अर्थ पादटिप्पणी में दिया गया है।
- source_word: חֲלָאִים
  choice: आभूषणों
  rationale: यह अनिश्चित शब्द गढ़े हुए बहुमूल्य अलंकरणों को सूचित करता है। ‘आभूषण’ ‘रत्न’ या ‘हार’ की अपेक्षा कम विशिष्ट रहकर मूल की व्यापकता बचाता है।
- source_word: מַעֲשֵׂה יְדֵי אָמָּן
  choice: कुशल कारीगर के हाथों की कृति
  rationale: मूल में निहित हस्तकौशल और कलात्मक निपुणता दोनों को संक्षिप्त, गरिमापूर्ण हिन्दी में व्यक्त करता है।
