  rationale: पादत्राण के संदर्भ में פְעָמַיִךְ का ठोस अर्थ ‘पाँव’ सबसे स्वाभाविक है; בַּנְּעָלִים को हिन्दी मुहावरे के अनुसार ‘सैंडल पहने’ कहा गया है।
