base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/007/006.yaml
  text: Your head upon you is like Carmel[a], and the flowing hair of your head like purple[c][b]; a king is held captive in the tresses.
translation:
  language: hi
  text: 'तुम्हारा सिर कर्मेल[a] के समान है,


    और तुम्हारे सिर के लहराते बाल[b] बैंगनी रंग के समान;


    एक राजा लटों[c] में बँधा हुआ है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: कर्मेल से संभवतः कर्मेल पर्वत अभिप्रेत है, जो भव्य ऊँचाई और सुंदरता की छवि प्रस्तुत करता है।
    reason: cultural_note
  - marker: b
    text: या, “तुम्हारे सिर की लटकती लटें।” यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और नीचे लटकते या लहराते बालों को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “एक राजा दीर्घाओं में बँधा हुआ है।” अंतिम इब्रानी शब्द का अर्थ कठिन है और उसे एक से अधिक प्रकार से समझा गया है; मुख्य पाठ आसपास की बालों वाली छवि का अनुसरण करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: רֹאשֵׁךְ עָלַיִךְ
  choice: तुम पर शोभित तुम्हारा सिर
  rationale: רֹאשֵׁךְ का मूल अर्थ ‘तुम्हारा सिर’ है और עָלַיִךְ स्थानसूचक ‘तुम पर’ है। शाब्दिक संबंध को बनाए रखते हुए ‘शोभित’ हिंदी में काव्यात्मक वाक्य को स्वाभाविक बनाता है, बिना ‘मुकुट’ या ‘ऊँचा’ जैसी अतिरिक्त छवि जोड़े।
- source_word: כַּכַּרְמֶל
  choice: कर्मेल के समान
  rationale: तुलनासूचक כְּ और स्थाननाम कर्मेल को संक्षिप्त रूप में रखा गया है। संदर्भ संभवतः कर्मेल पर्वत की भव्य ऊँचाई और सुंदरता जगाता है; यह जानकारी पादटिप्पणी में दी गई है।
- source_word: דַּלַּת רֹאשֵׁךְ
  choice: तुम्हारे सिर के लहराते बाल
  rationale: דַּלָּה दुर्लभ शब्द है और यहाँ सामान्यतः नीचे लटकते या बहते बालों के लिए समझा जाता है। ‘लहराते बाल’ आधुनिक हिंदी में संभावित आशय और प्रेम-काव्य की छवि दोनों संप्रेषित करता है।
- source_word: כָּאַרְגָּמָן
  choice: बैंगनी रंग के समान
  rationale: אַרְגָּמָן मूल्यवान बैंगनी रंग या उस रंग के वस्त्र को सूचित करता है। ‘बैंगनी रंग’ सामग्री को अनावश्यक रूप से निश्चित किए बिना रंग और वैभव की संगति बनाए रखता है।
- source_word: מֶלֶךְ
  choice: एक राजा
  rationale: संज्ञा के साथ निश्चित उपपद नहीं है; इसलिए किसी विशिष्ट राजा की पहचान मानने के बजाय ‘एक राजा’ अधिक सीधा अनुवाद है।
- source_word: אָסוּר
  choice: बँधा हुआ है
  rationale: אָסוּר, אסר (‘बाँधना’) का निष्क्रिय रूप है। ‘बँधा हुआ’ मूल रूपक को बनाए रखता है और प्रेम से मोहित या वशीभूत होने का भाव पाठक के लिए खुला छोड़ता है।
- source_word: בָּרְהָטִים
  choice: उन लटों में
  rationale: यह दुर्लभ बहुवचन शब्द विवादित है। निकटवर्ती बालों की छवि के आधार पर ‘लटों में’ मुख्य पाठ में उपयुक्त है, जबकि ‘दीर्घाओं में’ वाला पारंपरिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
