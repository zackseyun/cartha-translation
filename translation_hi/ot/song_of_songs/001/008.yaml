base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/008.yaml
  text: If you do not know[a], most beautiful among women, go out for yourself in the tracks of the flock[b], and pasture your young goats beside the shepherds’ tents.
translation:
  language: hi
  text: 'यदि तुम नहीं जानती, हे स्त्रियों में सबसे सुंदर,


    तो अपने लिए झुंड के पदचिह्नों के पीछे निकल जाओ[a],


    और चरवाहों के तंबुओं के पास


    अपनी बकरियों के बच्चों को चराओ[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘झुंड के पदचिह्नों में निकल जाओ’; इब्रानी में शाब्दिक रूप से ‘झुंड के पदचिह्नों/पगचिन्हों में’ है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘अपनी बकरियों के बच्चों को चरने दो’; इब्रानी शब्द बकरी के बच्चों को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִם לֹא תֵדְעִי
  choice: यदि तुम नहीं जानती
  rationale: इब्रानी में वास्तविक शर्त व्यक्त हुई है। स्त्रीलिंग क्रिया-रूप को हिन्दी के ‘जानती’ में बनाए रखा गया है; प्रसंग में इसका अर्थ यह जानना है कि कहाँ जाना या क्या करना है।
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: हे स्त्रियों में सबसे सुन्दरी
  rationale: विशेषण के साथ בְּ और बहुवचन समूह यहाँ उत्कृष्टता का भाव देते हैं। सम्बोधन को स्पष्ट करने के लिए ‘हे’ रखा गया है।
- source_word: צְאִי לָךְ
  choice: स्वयं निकल जाओ
  rationale: צְאִי का अर्थ ‘निकल जाओ’ है और לָךְ के व्यक्तिगत/आत्मवाचक बल को स्वाभाविक हिन्दी में ‘स्वयं’ से व्यक्त किया गया है।
- source_word: בְּעִקְבֵי הַצֹּאן
  choice: झुंड के पदचिह्नों पर चलो
  rationale: עִקְבֵי एड़ी, पदचिह्न या पीछे छोड़े गए निशानों की ठोस चरवाही छवि देता है। हिन्दी में ‘पदचिह्नों पर चलो’ उस दिशा का आशय भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: וּרְעִי
  choice: चराओ
  rationale: रעה का क़ाल रूप यहाँ सीधे कर्म के रूप में बकरी के बच्चों को लेता है, इसलिए उन्हें चरने के लिए ले जाने या चराने का अर्थ उपयुक्त है।
- source_word: גְּדִיֹּתַיִךְ
  choice: अपनी बकरी के बच्चों को
  rationale: यह शब्द कम उम्र की बकरियों को दर्शाता है। ‘बकरी के बच्चे’ आधुनिक हिन्दी में स्पष्ट है और केवल ‘बच्चों’ से उत्पन्न मानवीय अर्थ की अस्पष्टता से बचाता है।
- source_word: עַל מִשְׁכְּנוֹת הָרֹעִים
  choice: चरवाहों के तंबुओं के पास
  rationale: מִשְׁכְּנוֹת निवास-स्थानों को दर्शाता है, जो इस चरवाही प्रसंग में तंबू हैं; עַל यहाँ स्थानिक निकटता, अर्थात ‘के पास’, व्यक्त करता है।
