  yaml_path: translation/ot/song_of_songs/001/015.yaml
  text: Look[a], you are beautiful, my beloved; look, you are beautiful—your eyes are doves.
translation:
  language: hi
  text: देखो, मेरी प्रिया, तुम सुंदर हो; देखो, तुम सुंदर हो—तुम्हारी आँखें कबूतरों जैसी हैं।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “तुम्हारी आँखें कबूतर हैं।” इब्रानी में यह बिम्ब संक्षिप्त संज्ञात्मक रूप में व्यक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנָּךְ
  choice: देखो, ... तुम
  rationale: הִנֵּה के स्त्रीलिंग एकवचन संबोधनयुक्त रूप का ध्यान आकर्षित करने वाला, विस्मयात्मक बल आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त करता है।
- source_word: יָפָה
  choice: सुन्दर
  rationale: यह विशेषण आकर्षक रूप-सौन्दर्य को बताता है; ‘सुन्दर’ स्पष्ट, वर्तमान और गरिमापूर्ण हिन्दी है।
- source_word: רַעְיָתִי
  choice: मेरी प्रिया
  rationale: गीतगीत में यह स्त्री प्रेमिका के लिए आत्मीय संबोधन है। ‘मेरी प्रिया’ उसके प्रेमपूर्ण और संबंधपरक भाव को संक्षेप में बनाए रखता है।
- source_word: הִנָּךְ יָפָה
  choice: देखो, तुम सुन्दर हो
  rationale: मूल की पुनरुक्ति को काव्यात्मक बल और प्रशंसा की तीव्रता बनाए रखने के लिए ज्यों का त्यों रखा गया है।
- source_word: עֵינַיִךְ
  choice: तुम्हारी आँखें
  rationale: यह द्विवचन संज्ञा पर स्त्रीलिंग एकवचन संबंधसूचक प्रत्यय का सीधा और स्वाभाविक अनुवाद है।
- source_word: יוֹנִים
  choice: कबूतर
  rationale: 'मूल इब्रानी में संक्षिप्त संज्ञात्मक रूपक है: ‘तुम्हारी आँखें कबूतर हैं।’ ‘जैसे कबूतर’ सम्भव अर्थ को अधिक स्पष्ट करता है, पर मूल की सघन काव्यात्मक अभिव्यक्ति को ढीला कर देता है।'
