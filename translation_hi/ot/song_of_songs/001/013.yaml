  text: My beloved is to me a sachet of myrrh[c][b][a]; he lies between my breasts.
translation:
  language: hi
  text: मेरा प्रिय मेरे लिए गंधरस की एक छोटी पोटली है[a]; वह मेरे स्तनों के बीच रात बिताता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘गंधरस की एक छोटी गठरी।’ हिब्रू צְרוֹר का अर्थ छोटी बँधी हुई पोटली या गठरी हो सकता है; यहाँ सुगंधित पदार्थ को शरीर पर रखने के संदर्भ में ‘छोटी पोटली’ चुना गया है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वह मेरे स्तनों के बीच ठहरता है।’ हिब्रू क्रिया में रात भर ठहरने का भाव हो सकता है, जो इस आत्मीय बिंब को और प्रबल करता है।
    reason: lexical_alternative
  - marker: c
    text: मूल हिब्रू में स्पष्ट रूप से ‘मेरे स्तनों’ कहा गया है, न कि अधिक सामान्य ‘मेरा वक्ष’ या ‘मेरा सीना’।
    reason: lexical_alternative
lexical_decisions:
- source_word: צְרוֹר
  choice: छोटी पोटली
  rationale: यह शब्द किसी छोटी बँधी हुई गठरी या पुड़िया को दर्शाता है। गन्धरस के संदर्भ में ‘छोटी पोटली’ शरीर पर रखी या पहनी जाने वाली सुगन्धित पुड़िया का बोध सहज रूप से कराती है।
- source_word: הַמֹּר
  choice: गन्धरस
  rationale: यह सुगन्ध और इत्र में प्रयुक्त विशिष्ट राल, मुर्र, का पारंपरिक और समझने योग्य हिन्दी नाम है; इससे काव्य-बिम्ब की सुगन्धित वस्तु बनी रहती है।
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीतगीत में यह शब्द प्रेमपूर्ण और रोमानी निकटता के साथ प्रिय पुरुष को दर्शाता है। ‘मेरा प्रिय’ आत्मीय और गरिमापूर्ण काव्य-भाषा बनाए रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यह वक्ता के साथ निजी संबंध और उसके मूल्यांकन को व्यक्त करता है; ‘मेरे लिए’ स्वाभाविक हिन्दी में वही भाव देता है।
- source_word: בֵּין
  choice: के बीच
  rationale: मूल का स्थान-सूचक अर्थ ठोस और स्पष्ट है, इसलिए शारीरिक बिम्ब को नरम किए बिना ‘के बीच’ रखा गया है।
- source_word: שָׁדַי
  choice: मेरी छातियों
  rationale: इब्रानी शब्द स्पष्ट रूप से स्त्री की दोनों छातियों को दर्शाता है। ‘वक्ष’ या ‘सीने’ जैसे शिष्टोक्तिपरक विकल्प मूल के ठोस शारीरिक बिम्ब को धुँधला कर देते।
- source_word: יָלִין
  choice: रात बिताता है
  rationale: לין में ठहरने या रात बिताने का भाव है। पुल्लिंग क्रिया प्रिय की ओर संकेत कर सकती है, जिसे गन्धरस की पोटली के रूपक में प्रस्तुत किया गया है; इसलिए ‘वह…रात बिताता है’ मूल की आत्मीयता और रात्रि-संबंधी अर्थ दोनों रखता है।
