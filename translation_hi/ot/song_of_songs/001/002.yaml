base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/002.yaml
  text: Let him kiss me with the kisses of his mouth[a], for your love is better than wine.
translation:
  language: hi
  text: वह अपने मुँह के चुम्बनों से मुझे चूमे! क्योंकि तेरा प्रेम[a] दाखमधु से बढ़कर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे प्रेम-प्रदर्शन” अथवा “तेरे दुलार।” इब्रानी शब्द बहुवचन में है और प्रेम के ठोस प्रदर्शनों या दुलार को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יִשָּׁקֵנִי
  choice: वह मुझे चूमे
  rationale: काल का अपूर्ण रूप यहाँ भविष्यवाणी नहीं, बल्कि वक्ता की इच्छा व्यक्त करता है; हिंदी का संभावनार्थक रूप ‘चूमे’ इस भाव को स्वाभाविक रूप से बनाए रखता है।
- source_word: מִנְּשִׁיקוֹת
  choice: चुम्बनों से
  rationale: מן यहाँ साधन अथवा माध्यम का भाव देता है। ‘चुम्बनों से’ मूल की ठोस, काव्यात्मक बहुवचन छवि को सुरक्षित रखता है।
- source_word: פִּיהוּ
  choice: अपने मुँह के
  rationale: यह मूल पद का सीधा अर्थ है और प्रेमगीत की शारीरिक निकटता को अनावश्यक रूप से नरम नहीं करता। हिंदी में कर्ता के संदर्भ में ‘अपने’ अधिक स्वाभाविक है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले व्यक्त इच्छा का कारण प्रस्तुत करता है और वाक्यों के कारणात्मक संबंध को स्पष्ट रखता है।
- source_word: דֹּדֶיךָ
  choice: तेरा प्रेम
  rationale: बहुवचन रूप प्रेम, प्रेमपूर्ण व्यवहार अथवा दुलार के ठोस प्रदर्शनों को सूचित कर सकता है। मुख्य पाठ में ‘तेरा प्रेम’ सहज और व्यापक है; अधिक ठोस अर्थ को पादटिप्पणी में रखा गया है।
- source_word: מִיָּיִן
  choice: दाखमधु से बढ़कर
  rationale: טוֹבִים के साथ מן तुलनात्मक है। ‘से बढ़कर’ आधुनिक हिंदी में स्वाभाविक ढंग से ‘दाखमधु से अच्छा/उत्तम’ का अर्थ देता है।
theological_decisions:
- issue: आरम्भ में तीसरे पुरुष से दूसरे पुरुष की ओर परिवर्तन
  choice: ‘वह ... चूमे’ के बाद ‘तेरा प्रेम’ रखा गया
  alternative: पूरे वचन में एक ही पुरुष कर देना
  rationale: इब्रानी पाठ स्वयं प्रियतम के विषय में कही गई इच्छा से सीधे उसे किए गए संबोधन की ओर मुड़ता है। इस काव्यात्मक परिवर्तन को समतल नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक रखी गई है। ‘दाखमधु’ बाइबिलीय गरिमा बनाए रखते हुए सामान्य हिंदी पाठकों के लिए बोधगम्य है; मूल की प्रेमपूर्ण और शारीरिक निकटता को शिष्ट किंतु स्पष्ट रूप में सुरक्षित रखा गया है।
