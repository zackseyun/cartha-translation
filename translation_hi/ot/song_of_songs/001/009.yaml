  text: I compare you[a], my beloved, to my mare among Pharaoh’s chariots.
translation:
  language: hi
  text: मेरी प्रियतमा, मैंने तेरी तुलना फ़िरौन के रथों के बीच मेरी घोड़ी से की है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: לְסֻסָתִי
  choice: अपनी घोड़ी से
  rationale: סוּסָה स्त्रीलिंग एकवचन है, इसलिए ‘घोड़ी’ उसके चिह्नित लिंग को सुरक्षित रखता है। प्रथम पुरुष एकवचन प्रत्यय को ‘अपनी’ से स्पष्ट किया गया है। तुलना के हिंदी वाक्य-विन्यास में לְ को ‘से’ से व्यक्त किया गया है।
- source_word: בְּרִכְבֵי פַרְעֹה
  choice: फ़िरौन के रथों के बीच जुती
  rationale: בְּ यहाँ स्थान अथवा संगति सूचित करता है; ‘के बीच’ मूल चित्र को स्वाभाविक हिंदी में रखता है। ‘जुती’ हिंदी पाठक के लिए यह स्पष्ट करता है कि घोड़ी रथ-दल के संदर्भ में है, यद्यपि यह अर्थ संदर्भ से पूरित है।
- source_word: דִּמִּיתִיךְ
  choice: मैंने तेरी तुलना ... से की है
  rationale: पिएल पूर्ण रूप 1cs और 2fs प्रत्यय को पूर्णतावाची हिंदी में व्यक्त किया गया है। यह स्त्री संबोधन और तुलना की क्रिया दोनों को स्पष्ट रखता है।
- source_word: רַעְיָתִי
  choice: हे मेरी प्रियतमा
  rationale: यह स्त्री प्रिय को किया गया आत्मीय संबोधन है। ‘प्रियतमा’ आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी में प्रेम-संबंध की निकटता व्यक्त करता है।
