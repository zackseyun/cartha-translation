id: SNG.1.3
reference: Song of Songs 1:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: לְ/רֵ֨יחַ֙ שְׁמָנֶ֣י/ךָ טוֹבִ֔ים שֶׁ֖מֶן תּוּרַ֣ק שְׁמֶ֑/ךָ עַל כֵּ֖ן עֲלָמ֥וֹת אֲהֵבֽוּ/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/003.yaml
  text: The fragrance of your oils is pleasing[a]; your name is oil poured out[b]; therefore young women love you.
translation:
  language: hi
  text: तेरे तेलों की सुगंध मनभावनी है[a]; तेरा नाम उंडेला हुआ तेल है; इसीलिए युवतियाँ[b] तुझसे प्रेम करती हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “क्योंकि तेरे तेलों की सुगंध अच्छी है”; इब्रानी वाक्य-विन्यास संक्षिप्त और अत्यंत काव्यात्मक है।
    reason: alternative_reading
  - marker: b
    text: “युवतियाँ” इब्रानी עֲלָמוֹת का अनुवाद है। इसका अनुवाद “कुमारियाँ” भी किया जा सकता है, पर यहाँ मूल शब्द अपने आप में कौमार्य को उतनी स्पष्टता से निर्दिष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְרֵיחַ שְׁמָנֶיךָ טוֹבִים
  choice: तेरे तेलों की सुगंध मनभावनी है
  rationale: रֵיחַ को ‘सुगंध’ और שְׁמָנֶיךָ को ‘तेलों’ के रूप में रखकर मूल बिंब सुरक्षित रखा गया है। संक्षिप्त इब्रानी रचना को स्वाभाविक हिन्दी वाक्य में व्यक्त किया गया है; טוֹבִים का सकारात्मक मूल्यांकन ‘मनभावनी’ से प्रकट होता है।
- source_word: שֶׁמֶן תּוּרַק שְׁמֶךָ
  choice: तेरा नाम उंडेला हुआ तेल है
  rationale: שֶׁמֶן का ठोस बिंब ‘तेल’ के रूप में और תּוּרַק का कर्मवाच्य भाव ‘उंडेला हुआ’ के रूप में सुरक्षित है। ‘नाम’ को प्रतिष्ठा आदि कहकर व्याख्यायित नहीं किया गया, जिससे मूल रूपक बना रहता है।
- source_word: עַל־כֵּן
  choice: इसीलिए
  rationale: यह पद पहले कथनों से परिणाम अथवा निष्कर्ष जोड़ता है; ‘इसीलिए’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है।
- source_word: עֲלָמוֹת
  choice: युवतियाँ
  rationale: यह शब्द विवाह-योग्य आयु की युवा स्त्रियों को सूचित करता है, पर अपने आप में कौमार्य को अनिवार्य रूप से निर्दिष्ट नहीं करता; इसलिए ‘कुमारियाँ’ की अपेक्षा ‘युवतियाँ’ अधिक सावधान अनुवाद है।
- source_word: אֲהֵבוּךָ
  choice: तुझसे प्रेम करती हैं
  rationale: पूर्ण क्रिया को यहाँ सामान्य वर्तमान सत्य के रूप में समझना काव्य-संदर्भ में स्वाभाविक है। ‘प्रेम करती हैं’ אָהַב का सीधा अर्थ रखता है।
theological_decisions:
- issue: ‘नाम’ और सुगंधित तेल के बीच रूपक
  choice: 'रूपक को सीधे बनाए रखा गया: ‘तेरा नाम उंडेला हुआ तेल है।’'
  alternative: ‘तेरी ख्याति फैली हुई सुगंध के समान है।’
  rationale: व्याख्यात्मक विकल्प अर्थ का एक संभव पक्ष स्पष्ट करता, पर मूल की काव्यात्मक बहुअर्थता घटा देता। सीधे रूपक से व्यक्ति, नाम और फैलती सुगंध के संबंध का तनाव सुरक्षित रहता है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी अपनाई गई है। प्रेमगीत की निकटता के अनुरूप ‘तेरे/तेरा/तुझसे’ का प्रयोग किया गया है। समानांतर उपवाक्यों और तेल-सुगंध के ठोस बिंब को बनाए रखा गया है।
