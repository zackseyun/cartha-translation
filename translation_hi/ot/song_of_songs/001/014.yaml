lexical_decisions:
- source_word: אֶשְׁכֹּל
  choice: गुच्छा
  rationale: यह संज्ञा किसी फल या फूल के गुच्छे को दर्शाती है; यहाँ मेंहदी के सुगंधित फूलों का गुच्छा अभिप्रेत है।
- source_word: הַכֹּפֶר
  choice: मेंहदी के फूलों
  rationale: यह शब्द संभवतः मेंहदी के पौधे (Lawsonia inermis) को दर्शाता है, जो अपने सुगंधित फूलों के लिए जाना जाता था; काव्यात्मक संदर्भ में फूलों का उल्लेख स्वाभाविक है।
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीत में यह स्त्री-वक्ता के प्रिय पुरुष को दर्शाता है; ‘मेरा प्रिय’ गरिमापूर्ण और स्वाभाविक हिन्दी है।
- source_word: לִי
  choice: मेरे लिए
  rationale: यह व्यक्तिगत संबंध और वक्ता की दृष्टि में प्रिय के मूल्य को व्यक्त करता है।
- source_word: בְּכַרְמֵי
  choice: दाखबारियों में
  rationale: बहुवचन रूप और स्थानवाचक उपसर्ग को सीधे व्यक्त करता है तथा अंगूर की खेती के काव्यात्मक दृश्य को बनाए रखता है।
- source_word: עֵין גֶּדִי
  choice: एन-गेदी
  rationale: यह स्थान-नाम है; हिन्दी बाइबलीय प्रयोग के अनुरूप इसका लिप्यंतरण किया गया है।
