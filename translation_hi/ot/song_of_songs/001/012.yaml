reference: Song of Songs 1:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עַד שֶׁ֤/הַ/מֶּ֨לֶךְ֙ בִּ/מְסִבּ֔/וֹ נִרְדִּ֖/י נָתַ֥ן רֵיחֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/012.yaml
  text: While the king was at his table[b][a], my nard gave its fragrance.
translation:
  language: hi
  text: जब राजा अपनी मेज़ पर था[a], तब मेरी जटामांसी[b] ने अपनी सुगंध बिखेरी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “जब राजा अपने भोज में था” अथवा “अपनी शय्या पर था।” हिब्रू शब्द भोज की व्यवस्था या टेक लगाकर बैठे लोगों के मंडल के लिए भी प्रयुक्त हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: परंपरागत रूप से “मेरी स्पाइकनार्ड”; जटामांसी एक सुगंधित पौधा है और यह शब्द उससे बने इत्र को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עַד שֶׁ
  choice: जब ... तब
  rationale: यहाँ यह पदबंध उस समय की परिस्थिति बताता है जिसमें अगली क्रिया हुई। ‘जब ... तब’ आधुनिक हिन्दी में स्वाभाविक है और काव्यात्मक संदर्भ में ‘जब तक’ से अधिक उपयुक्त है, जो अनावश्यक रूप से किसी समाप्ति-बिंदु पर बल दे सकता है।
- source_word: שֶׁהַמֶּלֶךְ
  choice: राजा
  rationale: निश्चित पदबंध को सामान्य साहित्यिक अर्थ में रखा गया है। हिन्दी में इसे किसी विशेष धर्मवैज्ञानिक उपाधि के रूप में चिह्नित नहीं किया गया।
- source_word: בִּמְסִבּוֹ
  choice: अपनी मेज़ पर
  rationale: מְסִבָּה मेज़, भोज की व्यवस्था, या टेक लगाकर बैठे लोगों के मंडल को सूचित कर सकता है। ‘अपनी मेज़ पर’ सहज और ठोस हिन्दी है, जबकि अन्य संभावनाएँ पादटिप्पणी में सुरक्षित रखी गई हैं।
- source_word: נִרְדִּי
  choice: मेरी जटामांसी
  rationale: यह सुगंधित जटामांसी के पौधे अथवा उससे बने इत्र को दर्शाता है। ‘मेरी’ मूल के प्रथम पुरुष एकवचन संबंधसूचक प्रत्यय को व्यक्त करता है।
- source_word: נָתַן רֵיחוֹ
  choice: अपनी सुगंध बिखेरी
  rationale: शाब्दिक अर्थ ‘अपनी सुगंध दी’ है; ‘सुगंध बिखेरी’ उसी हिब्रू मुहावरे को स्वाभाविक, काव्यात्मक हिन्दी में व्यक्त करता है। ‘अपनी’ सुगंध का संबंध जटामांसी से स्पष्ट करता है।
theological_decisions:
- issue: क्या ‘राजा’ को मसीही या धर्मवैज्ञानिक उपाधि के रूप में प्रस्तुत किया जाए
  choice: काव्य में पुरुष प्रेमी के साहित्यिक उल्लेख के रूप में ‘राजा’
  alternative: इसे विशेष रूप से ‘राजाधिराज’ जैसे धर्मवैज्ञानिक संकेत के साथ प्रस्तुत करना
  rationale: हिब्रू पाठ स्वयं यहाँ किसी धर्मवैज्ञानिक या मसीही उपाधि की माँग नहीं करता। इसलिए अनुवाद प्रेम-काव्य के प्रत्यक्ष अर्थ को रखता है और किसी विशिष्ट रूपकात्मक व्याख्या को पाठ में नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और हल्की काव्यात्मक शैली रखी गई है। ‘जब ... तब’ वाक्य-संबंध को स्पष्ट करता है; ‘सुगंध बिखेरी’ प्रेम-काव्य के संवेदनात्मक स्वर को स्वाभाविक हिन्दी में बनाए रखता है।
