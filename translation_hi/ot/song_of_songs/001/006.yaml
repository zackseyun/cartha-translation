  edition: WLC
  text: אַל תִּרְא֨וּ/נִי֙ שֶׁ/אֲנִ֣י שְׁחַרְחֹ֔רֶת שֶׁ/שֱּׁזָפַ֖תְ/נִי הַ/שָּׁ֑מֶשׁ בְּנֵ֧י אִמִּ֣/י נִֽחֲרוּ בִ֗/י שָׂמֻ֨/נִי֙ נֹטֵרָ֣ה אֶת הַ/כְּרָמִ֔ים כַּרְמִ֥/י שֶׁ/לִּ֖/י לֹ֥א נָטָֽרְתִּי־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/006.yaml
  text: Do not stare at me because I am dark[a], because the sun has scorched me. My mother’s sons were angry with me; they made me keeper of the vineyards[d][c][b], but my own vineyard I have not kept.
translation:
  language: hi
  text: मुझे घूरकर मत देखो, क्योंकि मैं साँवली हूँ[a], क्योंकि धूप ने मुझे झुलसा दिया है[b]। मेरी माँ के बेटे[c] मुझ पर क्रोधित हुए; उन्होंने मुझे दाख की बारियों की रखवाली करने पर लगा दिया, पर मैंने अपनी ही दाख की बारी की रखवाली नहीं की[d]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं काली हूँ।” इब्रानी विशेषण का यह अधिक शाब्दिक अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “क्योंकि सूर्य ने मुझे झुलसा दिया है।” कुछ परम्परागत अनुवादों में “सूर्य ने मुझे देखा है” मिलता है।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “मेरी माँ के बेटे।”
    reason: lexical_alternative
  - marker: d
    text: “अपनी ही दाख की बारी” सम्भवतः एक रूपक है, पर इब्रानी पाठ यह स्पष्ट नहीं करता कि वह ठीक किसकी ओर संकेत करता है।
    reason: cultural_note
lexical_decisions:
- source_word: אַל תִּרְאוּנִי
  choice: मुझे घूरकर मत देखो
  rationale: मूल अर्थ ‘मुझे मत देखो’ है, पर प्रसंग में रूप-रंग को जाँचती हुई दृष्टि का भाव है। ‘घूरकर मत देखो’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: שְׁחַרְחֹרֶת
  choice: साँवली
  rationale: यह शब्द गहरे अथवा धूप से काले पड़े रंग को बताता है। ‘साँवली’ हिन्दी में त्वचा के रंग के लिए स्वाभाविक है और किसी जातीय पहचान को अनावश्यक रूप से आरोपित नहीं करता; अधिक शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: שֶׁשֱּׁזָפַתְנִי הַשָּׁמֶשׁ
  choice: क्योंकि धूप ने मुझे झुलसा दिया है
  rationale: क्रिया सूर्य की तपन अथवा झुलसाने वाले प्रभाव को सूचित करती है। ‘धूप’ हिन्दी में सूर्य के शरीर पर पड़ने वाले प्रभाव को सहज रूप से व्यक्त करती है।
- source_word: בְּנֵי אִמִּי
  choice: मेरी माँ के बेटे
  rationale: इब्रानी में सामान्य ‘भाई’ नहीं, बल्कि विशेष रूप से ‘मेरी माँ के बेटे’ है। शाब्दिक संबंध-सूचक अभिव्यक्ति सम्भावित भावनात्मक दूरी को भी बनाए रखती है।
- source_word: נִחֲרוּ בִי
  choice: मुझ पर क्रोधित हुए
  rationale: क्रिया भड़के हुए क्रोध का भाव देती है। यह चयन अर्थ को स्पष्ट और गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: שָׂמֻנִי נֹטֵרָה אֶת הַכְּרָמִים
  choice: उन्होंने मुझे दाख की बारियों की रखवाली करने पर लगा दिया
  rationale: स्त्रीलिंग कृदन्त रखवाली अथवा निगरानी करने वाली भूमिका बताता है। ‘रखवाली करने पर लगा दिया’ कार्य सौंपे जाने के साथ श्रम और बाध्यता का भाव भी स्वाभाविक रूप से व्यक्त करता है।
- source_word: כַּרְמִי שֶׁלִּי
  choice: अपनी ही दाख की बारी
  rationale: दोहरी अधिकार-सूचक रचना बल देती है; ‘अपनी ही’ उस बल को हिन्दी में बनाए रखता है।
- source_word: לֹא נָטָרְתִּי
  choice: मैंने रखवाली नहीं की
  rationale: ‘रखवाली’ की पुनरावृत्ति उसी इब्रानी धातु की पुनरावृत्ति को सुरक्षित रखती है और दाख की बारी के सम्भावित रूपक को बिना समझाए खुला छोड़ती है।
theological_decisions:
- issue: ‘अपनी ही दाख की बारी’ का रूपकात्मक अर्थ
  choice: मुख्य पाठ में दाख की बारी का बिम्ब ज्यों का त्यों रखा गया और उसका आशय स्पष्ट नहीं किया गया।
  alternative: इसे स्त्री के शरीर, रूप-रंग, निजी जीवन अथवा यौन शुचिता का सीधा संकेत मानकर अनुवाद करना।
  rationale: इब्रानी कविता में रूपक सम्भावित है, पर उसका ठीक आशय नहीं बताया गया। किसी एक व्याख्या को पाठ में आरोपित करने के बजाय मूल की काव्यात्मक और धर्मवैचारिक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक किन्तु सहज और गरिमापूर्ण रखी गई है। ‘दाख की बारी’ बाइबलीय काव्य-बिम्ब को परिचित हिन्दी रूप में बनाए रखती है। वक्ता स्त्री है, इसलिए ‘साँवली हूँ’ का स्त्रीलिंग सुरक्षित है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
