    reason: lexical_alternative
  - marker: b
    text: या ‘जुनिपर’ अथवा ‘फ़र’ की; वृक्ष की ठीक-ठीक प्रजाति अनिश्चित है।
    reason: lexical_alternative
  - marker: c
    text: ‘बल्लियाँ’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ अनिश्चित है; इसका अर्थ लकड़ी की पट्टियाँ या दीर्घाएँ भी हो सकता है।
    reason: lexical_alternative
