  yaml_path: translation/ot/song_of_songs/001/011.yaml
  text: We will make for you ornaments of gold[b][a], with studs of silver.
translation:
  language: hi
  text: 'हम तुम्हारे लिए सोने के आभूषण[a] बनाएँगे,

    चाँदी की बिंदियों[b] सहित।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने की लड़ियाँ” अथवा “सोने की पंक्तियाँ”; इब्रानी शब्द शायद किसी प्रकार के आभूषण को दर्शाता है, पर उसका ठीक रूप अनिश्चित है।
    reason: lexical_alternative
  - marker: b
    text: या “चाँदी के मनके” अथवा “चाँदी की चमकीली सजावटें”; इब्रानी में चाँदी के छोटे सजावटी तत्वों का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תּוֹרֵי
  choice: आभूषण
  rationale: यह बहुवचन संज्ञा किसी गढ़े हुए श्रृंगार या आभूषण को दर्शाती है, पर उसका ठीक रूप अनिश्चित है। इसलिए सामान्य और स्वाभाविक शब्द ‘आभूषण’ चुना गया है।
- source_word: זָהָב
  choice: सोने के
  rationale: यह धातु को दर्शाने वाला सामान्य शब्द है और यहाँ आभूषण की सामग्री बताता है।
- source_word: נַעֲשֶׂה
  choice: हम ... बनाएँगे
  rationale: यह प्रथम पुरुष बहुवचन अपूर्ण रूप है; प्रसंग में भविष्यकालीन आश्वासन या प्रस्ताव सबसे स्वाभाविक है।
- source_word: לָךְ
  choice: तुम्हारे लिए
  rationale: पूर्वसर्ग के साथ स्त्रीलिंग एकवचन प्रत्यय बताता है कि आभूषण स्त्री संबोधित व्यक्ति के लिए बनाए जाएँगे।
- source_word: עִם
  choice: जिन पर ... जड़ी होंगी
  rationale: शाब्दिक अर्थ ‘के साथ’ है; हिन्दी में आभूषण और चाँदी के छोटे सजावटी तत्वों का संबंध स्वाभाविक ढंग से व्यक्त करने के लिए इसे उपवाक्य में रूपांतरित किया गया है।
- source_word: נְקֻדּוֹת
  choice: बिंदियाँ
  rationale: शब्द छोटी बिंदु-जैसी सजावटी वस्तुओं को दर्शाता है। ‘बिंदियाँ’ रूपगत संकेत को बनाए रखता है और ‘जड़ी’ के साथ आभूषण-संदर्भ में स्पष्ट है।
- source_word: הַכָּסֶף
  choice: चाँदी की
  rationale: यह चाँदी धातु का सामान्य शब्द है और यहाँ छोटी सजावटी बिंदियों की सामग्री बताता है।
