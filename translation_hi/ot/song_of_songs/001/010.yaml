  text: 'आभूषणों की पंक्तियों से तुम्हारे गाल सुन्दर लगते हैं[a],

    और आभूषणों की लड़ियों से तुम्हारी गर्दन[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पंक्तियों से”; इब्रानी शब्द सम्भवतः आभूषणों की पंक्तियों या उनके विन्यास को दर्शाता है। कुछ लोग इसे किसी विशेष प्रकार का आभूषण मानते हैं।
    reason: lexical_alternative
  - marker: b
    text: या, “मनकों से” अथवा “हारों से”; इब्रानी शब्द पिरोए हुए आभूषणों को दर्शाता है।
    reason: lexical_alternative
