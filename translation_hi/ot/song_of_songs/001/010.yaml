- source_word: בַּתֹּרִים
  choice: आभूषणों की पंक्तियों से
  rationale: समानांतर पंक्ति और अगले पद के संदर्भ में यह आभूषणों की पंक्तियों अथवा सजावटी विन्यास को सूचित करता है। अनिश्चित वस्तु को ‘आभूषणों’ और उसके विन्यास को ‘पंक्तियों’ द्वारा व्यक्त किया गया है।
- source_word: צַוָּארֵךְ
  choice: तुम्हारी गर्दन
  rationale: यह शरीर के अंग ‘गर्दन’ का सीधा और स्वाभाविक हिन्दी समतुल्य है।
- source_word: בַּחֲרוּזִים
  choice: मोतियों की लड़ियों से
  rationale: यह धागे में पिरोए हुए अलंकारों को दर्शाता है। ‘लड़ियाँ’ पिरोए जाने की छवि बनाए रखता है और ‘मोती’ हिन्दी में ऐसे गले के आभूषण की स्वाभाविक काव्यात्मक अभिव्यक्ति है।
