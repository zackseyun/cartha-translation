  text: שְׁחוֹרָ֤ה אֲנִי֙ וְֽ/נָאוָ֔ה בְּנ֖וֹת יְרוּשָׁלִָ֑ם כְּ/אָהֳלֵ֣י קֵדָ֔ר כִּ/ירִיע֖וֹת שְׁלֹמֹֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/005.yaml
  text: I am dark[a], yet lovely, daughters of Jerusalem, like the tents of Kedar, like the curtains of Solomon.
translation:
  language: hi
  text: 'मैं साँवली हूँ, फिर भी सुन्दर हूँ[a], हे यरूशलेम की बेटियों: केदार के तम्बुओं के समान, सुलैमान के परदों के समान।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं साँवली और सुन्दर हूँ।” इब्रानी संयोजक का सामान्य अर्थ “और” है; “फिर भी” प्रसंग में सम्भावित विरोध को व्यक्त करता है।
    reason: alternative_reading
lexical_decisions:
- source_word: שְׁחוֹרָה
  choice: साँवली
  rationale: स्त्री वक्ता के गहरे वर्ण का स्वाभाविक और सम्मानजनक हिन्दी वर्णन; यह न तो जातीय पहचान आरोपित करता है, न ‘काली’ जितना निरपेक्ष या प्रसंगतः कठोर लगता है।
- source_word: וְנָאוָה
  choice: फिर भी सुन्दर
  rationale: ו का मूल अर्थ ‘और’ है, पर प्रसंग में निहित विरोध को सहज हिन्दी में ‘फिर भी’ व्यक्त करता है। मूल का सीधा समन्वयी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: हे यरूशलेम की बेटियो
  rationale: प्रत्यक्ष काव्यात्मक सम्बोधन और स्त्रीलिंग बहुवचन बिम्ब को बनाए रखता है; ‘युवतियो’ अधिक व्याख्यात्मक होता।
- source_word: כְּאָהֳלֵי קֵדָר
  choice: केदार के तम्बुओं के समान
  rationale: उपमा का सीधा अनुवाद है; केदार के तम्बुओं के गहरे रंग का संकेत बिना अतिरिक्त व्याख्या जोड़े बना रहता है।
- source_word: כִּירִיעוֹת שְׁלֹמֹה
  choice: सुलैमान के परदों के समान
  rationale: יְרִיעוֹת के लिए सुलभ हिन्दी ‘परदे’ चुना गया है; यह तम्बू के कपड़ों या सजावटी लटकनों की सम्भावित छवि को पर्याप्त रूप से खुला रखता है।
theological_decisions:
- issue: נָאוָה से पहले ו का अर्थ-बल
  choice: प्रसंगानुसार विरोधसूचक ‘फिर भी सुन्दर’
  alternative: 'सरल समन्वय: ‘और सुन्दर’'
  rationale: इब्रानी में संयोजक सामान्यतः ‘और’ है और विरोध स्पष्ट रूप से चिह्नित नहीं है। फिर भी प्रसंग वक्ता के साँवले वर्ण के सम्भावित नकारात्मक आकलन का प्रत्युत्तर सुझाता है; इसलिए मुख्य पाठ में सहज विरोधसूचक अर्थ रखा गया और वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित की गई।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज काव्यात्मक हिन्दी। ‘साँवली’ स्त्री वक्ता के वर्णन के लिए स्वाभाविक है। समानान्तर उपमाओं और प्रत्यक्ष सम्बोधन को बनाए रखा गया है।
