base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/016.yaml
  text: Look[a], you are beautiful, my beloved—indeed, pleasant! Indeed, our couch is luxuriant.
translation:
  language: hi
  text: देखो, मेरे प्रिय, तुम कितने सुंदर हो—और कितने मनोहर! हमारी शय्या भी हरी-भरी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हमारी शय्या ताज़ी और हरी है।” इब्रानी विशेषण ताजगी या हरियाली का बोध कराता है और संभवतः हरे-भरे प्राकृतिक परिवेश का चित्र प्रस्तुत करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הִנְּךָ
  choice: देखो, ... तुम
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय सहित यह विस्मयात्मक संकेतवाचक पद सामने उपस्थित प्रिय की ओर ध्यान खींचता है; आधुनिक हिन्दी में ‘देखो’ इसका स्वाभाविक काव्यात्मक बल रखता है।
- source_word: יָפֶה
  choice: सुंदर
  rationale: यह आकर्षक रूप-सौंदर्य को व्यक्त करता है और पुरुष संबोधन में भी सहज, गरिमापूर्ण तथा काव्यात्मक है।
- source_word: דוֹדִי
  choice: मेरे प्रिय
  rationale: श्रेष्ठगीत में यह प्रेमी के लिए आत्मीय संबोधन है; ‘मेरे प्रिय’ संबंध और काव्यात्मक गरिमा दोनों बनाए रखता है।
- source_word: אַף
  choice: और ... भी
  rationale: दोनों स्थानों पर पद के बलवर्धक/योगात्मक अर्थ को हिन्दी की स्वाभाविक संरचना में व्यक्त किया गया है, यद्यपि शब्दशः पुनरावृत्ति नहीं की गई।
- source_word: נָעִים
  choice: मनोहर
  rationale: यह सुखदता, आकर्षण और रमणीयता बताता है; ‘मनोहर’ व्यक्ति के लिए स्वाभाविक है और पहले आए ‘सुंदर’ से अनावश्यक पुनरुक्ति नहीं करता।
- source_word: עַרְשֵׂנוּ
  choice: हमारी शय्या
  rationale: मूल शब्द पलंग, बिछौना या विश्राम-स्थान का अर्थ दे सकता है। ‘शय्या’ काव्यात्मक और गरिमापूर्ण है तथा अंतरंग संकेत को न तो मिटाता है, न आवश्यकता से अधिक स्पष्ट करता है।
- source_word: רַעֲנָנָה
  choice: हरी-भरी
  rationale: विशेषण ताजगी, हरियाली और फलती-फूलती वनस्पति का बिंब देता है। ‘हरी-भरी’ हिन्दी में उस सजीव प्राकृतिक दृश्य को अधिक प्रत्यक्ष रूप से रखता है।
