  text: מָשְׁכֵ֖/נִי אַחֲרֶ֣י/ךָ נָּר֑וּצָה הֱבִיאַ֨/נִי הַ/מֶּ֜לֶךְ חֲדָרָ֗י/ו נָגִ֤ילָה וְ/נִשְׂמְחָה֙ בָּ֔/ךְ נַזְכִּ֤ירָה דֹדֶ֨י/ךָ֙ מִ/יַּ֔יִן מֵישָׁרִ֖ים אֲהֵבֽוּ/ךָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/004.yaml
  text: Draw me after you[a]; let us run. The king has brought me into his chambers. We will rejoice and be glad in you; we will extol your love more than wine[b]. Rightly do they love you.
translation:
  language: hi
  text: मुझे अपने पीछे खींच ले; हम दौड़ें। राजा मुझे अपने भीतरी कक्षों में ले आया है। हम तुझमें मगन होकर आनन्द मनाएँगे; दाखमधु से बढ़कर तेरे प्रेम का गुणगान करेंगे[a]। वे उचित ही तुझसे प्रेम करते हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हम तेरे प्रेम को स्मरण करेंगे,’ ‘उसका वर्णन करेंगे,’ अथवा ‘उसका उत्सव मनाएँगे।’
    reason: lexical_alternative
  - marker: b
    text: या ‘सज्जन लोग तुझसे प्रेम करते हैं।’ इब्रानी מֵישָׁרִים को क्रियाविशेषण (‘उचित ही’) अथवा संज्ञा (‘सज्जन लोग’) समझा जा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: מָשְׁכֵנִי
  choice: मुझे … खींच ले
  rationale: משך का मूल अर्थ ‘खींचना’ है। यह चयन आकर्षण की काव्यात्मक छवि को बनाए रखता है और उसे केवल शारीरिक खिंचाव तक सीमित नहीं करता।
- source_word: אַחֲרֶיךָ נָּרוּצָה
  choice: अपने पीछे …; आ, हम दौड़ें
  rationale: एकवचन ‘मुझे’ से प्रथम पुरुष बहुवचन ‘हम’ में मूल पाठ का बदलाव सुरक्षित रखा गया है। ‘हम दौड़ें’ इच्छासूचक रूप का स्वाभाविक हिन्दी रूप है।
- source_word: הֱבִיאַנִי
  choice: मुझे … ले आया है
  rationale: रूप को पूर्ण क्रिया माना गया है, न कि इच्छा या आज्ञा; हिन्दी पूर्ण वर्तमान घटना की परिणति को सहजता से व्यक्त करता है।
- source_word: הַמֶּלֶךְ
  choice: राजा
  rationale: शब्द का सीधा साहित्यिक अनुवाद किया गया है; अनुवाद में उसे परमेश्वर या मसीह के रूप में नहीं पहचाना गया।
- source_word: חֲדָרָיו
  choice: अपने भीतरी कक्षों में
  rationale: חדר भीतर के निजी कमरों या कक्षों को दर्शाता है। ‘भीतरी कक्ष’ काव्यात्मक आत्मीयता और स्थान का आन्तरिक स्वरूप दोनों रखता है।
- source_word: נָגִילָה וְנִשְׂמְחָה
  choice: हम … मगन होकर आनन्द मनाएँगे
  rationale: दोनों निकटार्थी क्रियाओं के उल्लासपूर्ण समानान्तर भाव को प्रवाहपूर्ण आधुनिक हिन्दी में व्यक्त किया गया है।
- source_word: בָּךְ
  choice: तुझमें
  rationale: ב की प्रत्यक्षता और प्रिय व्यक्ति को आनन्द का केन्द्र या क्षेत्र बताने वाला अर्थ बनाए रखा गया है।
- source_word: נַזְכִּירָה
  choice: गुणगान करेंगे
  rationale: זכר का मूल अर्थ स्मरण करना या उल्लेख करना है; इस प्रसंग में प्रिय के प्रेम को याद करके उसका उत्सवपूर्ण उल्लेख करना अभिप्रेत हो सकता है। ‘गुणगान’ उस प्रसंगगत बल को सहज हिन्दी में देता है, जबकि शाब्दिक विकल्प पादटिप्पणी में सुरक्षित हैं।
- source_word: דֹדֶיךָ
  choice: तेरे प्रेम
  rationale: बहुवचन रूप प्रेम की अभिव्यक्तियों या प्रणय को सामूहिक रूप से दर्शा सकता है। हिन्दी में एकवचन ‘प्रेम’ स्वाभाविक है और प्रणयात्मक अर्थ बनाए रखता है।
- source_word: מִיַּיִן
  choice: दाखमधु से बढ़कर
  rationale: सन्दर्भ में מן तुलनात्मक है। ‘से बढ़कर’ प्रेम को दाखमधु की अपेक्षा श्रेष्ठ बताता है और हिन्दी में स्पष्ट है।
- source_word: מֵישָׁרִים
  choice: उचित ही
  rationale: इसे क्रियाविशेषण रूप में ‘ठीक ही/उचित ही’ समझा गया है। संज्ञात्मक पाठ ‘सीधे लोग’ भी सम्भव है और पादटिप्पणी में दिया गया है।
- source_word: אֲהֵבוּךָ
  choice: वे … तुझसे प्रेम करते हैं
  rationale: काव्य में पूर्ण रूप सामान्य वर्तमान सत्य व्यक्त कर सकता है। बहुवचन कर्ता को स्पष्ट रखने के लिए ‘वे’ जोड़ा गया है।
theological_decisions:
- issue: ‘राजा’ की पहचान
  choice: कविता के भीतर साहित्यिक पात्र के रूप में केवल ‘राजा’ रखा गया है।
  alternative: इसे परमेश्वर अथवा मसीह का रूपक मानना।
  rationale: इब्रानी पद स्वयं राजा की ऐसी धर्मवैज्ञानिक पहचान स्पष्ट नहीं करता; इसलिए किसी विशिष्ट रूपकात्मक व्याख्या को मुख्य पाठ में नहीं जोड़ा गया।
- issue: מֵישָׁרִים का व्याकरणिक अर्थ
  choice: 'क्रियाविशेषण: ‘वे उचित ही तुझसे प्रेम करते हैं।’'
  alternative: 'संज्ञात्मक: ‘सीधे लोग तुझसे प्रेम करते हैं।’'
  rationale: दोनों अर्थ भाषिक रूप से सम्भव हैं। प्रसंग में क्रियाविशेषणीय अर्थ अधिक सहज है, पर वास्तविक अस्पष्टता पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में आत्मीय, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। प्रिय को सम्बोधन में ‘तू/तेरा’ के रूप (‘तुझमें,’ ‘तेरे’) निकटता दर्शाते हैं और अपमानसूचक नहीं हैं। ‘दाखमधु’ बाइबिलीय-काव्यात्मक गरिमा रखते हुए सामान्य पाठक के लिए बोधगम्य है।
