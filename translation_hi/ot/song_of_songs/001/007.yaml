source:
  edition: WLC
  text: הַגִּ֣ידָ/ה לִּ֗/י שֶׁ֤/אָהֲבָה֙ נַפְשִׁ֔/י אֵיכָ֣ה תִרְעֶ֔ה אֵיכָ֖ה תַּרְבִּ֣יץ בַּֽ/צָּהֳרָ֑יִם שַׁ/לָּ/מָ֤ה אֶֽהְיֶה֙ כְּ/עֹ֣טְיָ֔ה עַ֖ל עֶדְרֵ֥י חֲבֵרֶֽי/ךָ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/001/007.yaml
  text: Tell me[a], you whom my soul loves, where you pasture your flock, where you make it lie down at noon; for why should I be like one who veils herself beside the flocks of your companions?
translation:
  language: hi
  text: 'हे मेरे प्राण के प्रिय, मुझे बता,

    तू अपना झुंड कहाँ चराता है?

    दोपहर में उसे कहाँ लिटाता है?

    मैं तेरे साथियों के झुंडों के पास

    अपने को ढाँपे हुए स्त्री[a] जैसी क्यों बनूँ?'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरे साथियों के झुंडों के पास भटकनेवाली स्त्री।” इब्रानी पद का अर्थ अपने को ढाँपने या ओढ़नेवाली स्त्री हो सकता है; प्रसंग के आधार पर इसे प्रिय को खोजती हुई भटकनेवाली स्त्री भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַגִּידָה לִּי
  choice: मुझे बता
  rationale: प्रत्यक्ष आज्ञार्थक निवेदन को सरल, स्वाभाविक और आत्मीय हिन्दी में व्यक्त करता है।
- source_word: שֶׁאָהֲבָה נַפְשִׁי
  choice: हे मेरे प्राण के प्रिय
  rationale: נֶפֶשׁ की काव्यात्मक तीव्रता को ‘प्राण’ द्वारा बनाए रखता है और हिन्दी संबोधन में स्वाभाविक है; केवल ‘जिससे मैं प्रेम करती हूँ’ कहने से मूल मुहावरे की गहनता घट जाती।
- source_word: אֵיכָה תִרְעֶה
  choice: तू अपना झुंड कहाँ चराता है
  rationale: रעה का चराने/पालने का अर्थ और אֵיכָה का स्थानवाचक आशय संदर्भानुसार व्यक्त किया गया है। मूल में कर्म निहित है; ‘अपना झुंड’ चरवाही के संदर्भ को स्पष्ट करता है।
- source_word: אֵיכָה תַּרְבִּיץ
  choice: उसे कहाँ बिठाता है
  rationale: רבץ के हिफ़ील रूप का कारक भाव सुरक्षित है। ‘उसे’ सामूहिक एकवचन ‘झुंड’ की ओर संकेत करता है।
- source_word: בַּצָּהֳרָיִם
  choice: दोपहर को
  rationale: समय-सूचक पद का सीधा और प्रचलित हिन्दी रूप।
- source_word: שַׁלָּמָה אֶהְיֶה
  choice: मैं ... जैसी क्यों बनूँ
  rationale: संभावित अवस्था वाले आलंकारिक प्रश्न को स्वाभाविक हिन्दी में रखता है और निवेदन का कारण स्पष्ट करता है।
- source_word: כְּעֹטְיָה
  choice: मुँह ढाँपनेवाली स्त्री जैसी
  rationale: עטה के ढाँपने या ओढ़ने के मजबूत शाब्दिक अर्थ को अपनाता है। स्त्री वक्ता की आत्म-संदर्भित तुलना हिन्दी में स्पष्ट की गई है; वैकल्पिक संदर्भगत समझ पादटिप्पणी में सुरक्षित है।
- source_word: עַל עֶדְרֵי חֲבֵרֶיךָ
  choice: तेरे साथियों के झुंडों के पास
  rationale: עַל को यहाँ स्थानवाचक ‘पास’ और חֲבֵרֶיךָ को संबंध की तटस्थ संज्ञा ‘साथियों’ से व्यक्त किया गया है।
