  text: שׁוֹקָי/ו֙ עַמּ֣וּדֵי שֵׁ֔שׁ מְיֻסָּדִ֖ים עַל אַדְנֵי פָ֑ז מַרְאֵ֨/הוּ֙ כַּ/לְּבָנ֔וֹן בָּח֖וּר כָּ/אֲרָזִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/015.yaml
  text: His legs are pillars of marble[a], set on bases of fine gold. His appearance is like Lebanon[b], choice as the cedars.
translation:
  language: hi
  text: उसकी टाँगें संगमरमर के स्तंभों[a] के समान हैं, जो उत्तम सोने के आधारों पर टिके हैं। उसका रूप लबानोन के समान है—देवदारों के समान उत्कृष्ट[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘संगमरमर’ के स्थान पर ‘अलबास्टर’ या ‘उत्तम श्वेत पत्थर’ भी संभव है; इब्रानी שֵׁשׁ किसी उत्तम सफेद पत्थर को सूचित कर सकता है, केवल संगमरमर को ही नहीं।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘देवदारों के समान विशिष्ट’ भी हो सकता है। यहाँ इब्रानी בָּחוּר संभवतः ‘जवान’ के बजाय चुनी हुई उत्कृष्टता को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹקָיו
  choice: उसकी टाँगें
  rationale: שׁוֹק टाँग या जाँघ के क्षेत्र को सूचित कर सकता है; इस काव्यात्मक देह-वर्णन और खंभों की उपमा में सामान्य और स्वाभाविक हिन्दी ‘टाँगें’ है।
- source_word: עַמּוּדֵי שֵׁשׁ
  choice: संगमरमर के खंभों
  rationale: עַמּוּדֵי का अर्थ ‘खंभे’ है और שֵׁשׁ यहाँ किसी उत्तम श्वेत पत्थर को सूचित करता है; परंपरागत और चित्रात्मक अर्थ के लिए ‘संगमरमर’ चुना गया है, जबकि अनिश्चितता पादटिप्पणी में रखी गई है।
- source_word: מְיֻסָּדִים עַל אַדְנֵי פָז
  choice: उत्तम सोने के आधारों पर टिके हैं
  rationale: מְיֻסָּדִים दृढ़ता से स्थापित होने और אַדְנֵי स्थापत्य आधारों को व्यक्त करता है; ‘टिके हैं’ हिन्दी में स्वाभाविक ढंग से यह दृश्य देता है। פָז उच्च कोटि के परिष्कृत सोने को दर्शाता है।
- source_word: מַרְאֵהוּ
  choice: उसका रूप
  rationale: מַרְאֶה दृश्य रूप या समग्र बाहरी प्रभाव को सूचित करता है; काव्यात्मक हिन्दी में ‘रूप’ संक्षिप्त और स्वाभाविक है।
- source_word: כַּלְּבָנוֹן
  choice: लबानोन के समान
  rationale: यह उपमा लबानोन की भव्यता और शोभा का आह्वान करती है; स्थान-नाम को मूल के निकट ‘लबानोन’ रखा गया है।
- source_word: בָּחוּר כָּאֲרָזִים
  choice: देवदारों जैसा श्रेष्ठ
  rationale: בָּחוּר का मूल संबंध ‘चुना हुआ’ होने से है और यहाँ विशेषणात्मक रूप में उत्कृष्टता सूचित करता है; ‘श्रेष्ठ’ आधुनिक हिन्दी में सहज है और כָּאֲרָזִים की उपमा बनाए रखता है।
