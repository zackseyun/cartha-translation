translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। हिंसा के क्रम—मारना और घायल करना—को बिना नरम किए अलग-अलग व्यक्त किया गया है। ‘ओढ़नी’ सहज हिन्दी विकल्प है, पर रְדִיד की सटीक वस्त्र-श्रेणी अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिए गए हैं।
