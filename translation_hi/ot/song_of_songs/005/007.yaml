source:
  edition: WLC
  text: מְצָאֻ֧/נִי הַ/שֹּׁמְרִ֛ים הַ/סֹּבְבִ֥ים בָּ/עִ֖יר הִכּ֣וּ/נִי פְצָע֑וּ/נִי נָשְׂא֤וּ אֶת רְדִידִ/י֙ מֵֽ/עָלַ֔/י שֹׁמְרֵ֖י הַ/חֹמֽוֹת־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/007.yaml
  text: The watchmen who go about the city found me[a]; they struck me, they wounded me[b]; the keepers of the walls took my cloak from me.
translation:
  language: hi
  text: नगर में चक्कर लगाते पहरेदारों ने मुझे पा लिया[a]; उन्होंने मुझे मारा, मुझे घायल कर दिया; नगर की दीवारों के पहरेदारों ने मेरी ओढ़नी मुझ पर से उतार ली[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “नगर में गश्त लगाते।” इब्रानी कर्तृवाचक रूप का अर्थ “चारों ओर घूमते” या “चक्कर लगाते” है; इस प्रसंग में संभवतः नगर के पहरेदारों का नियमित गश्त लगाना अभिप्रेत है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरा बाहरी आवरण” अथवा “मेरी चादर।” इब्रानी शब्द רְדִיד किसी ओढ़े या लपेटे जानेवाले बाहरी वस्त्र को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מְצָאֻנִי
  choice: मुझे पा लिया
  rationale: מצא का सीधा अर्थ ‘पाना/ढूँढ़ लेना’ है। स्त्री के नगर में खोजते फिरने के प्रसंग में ‘मुझे पा लिया’ स्वाभाविक है और अनावश्यक रूप से आकस्मिक भेंट का भाव नहीं जोड़ता।
- source_word: הַשֹּׁמְרִים
  choice: पहरेदारों
  rationale: שמר से बना यह कर्तृवाचक रूप पहरा देनेवालों को दर्शाता है। नगरीय और रात्रिकालीन प्रसंग में ‘पहरेदार’ स्पष्ट तथा स्वाभाविक है।
- source_word: הַסֹּבְבִים בָּעִיר
  choice: नगर में चक्कर लगाते
  rationale: סבב का मूल भाव घूमना या चक्कर लगाना है। यह अनुवाद उनकी नियमित गश्त का संकेत देता है, पर मूल में निहित सामान्य गतिशील अर्थ को किसी आधुनिक पुलिस-पदावली तक सीमित नहीं करता।
- source_word: הִכּוּנִי
  choice: उन्होंने मुझे मारा
  rationale: נכה प्रहार करने या मारने का व्यापक क्रियापद है। ‘मारा’ सहज हिन्दी है और अगले, अधिक प्रबल क्रियापद ‘घायल कर दिया’ से भिन्न रहता है।
- source_word: פְצָעוּנִי
  choice: मुझे घायल कर दिया
  rationale: פצע का अर्थ घायल करना है। यह पहले क्रियापद की हिंसा के परिणाम को स्पष्ट रखते हुए उसकी तीव्रता को बनाए रखता है।
- source_word: נָשְׂאוּ אֶת רְדִידִי מֵעָלַי
  choice: मेरी ओढ़नी मुझ पर से उतार ली
  rationale: נשא के साथ מֵעָלַי यहाँ शरीर पर से हटा लेने का भाव देता है। רְדִיד किसी बाहरी आवरण या लपेटनेवाले वस्त्र को सूचित करता है; ‘ओढ़नी’ आधुनिक हिन्दी में इस अर्थ को स्वाभाविक रूप से व्यक्त करती है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित हैं।
- source_word: שֹׁמְרֵי הַחֹמוֹת
  choice: नगर की दीवारों के पहरेदारों
  rationale: यह संबंध-पदबंध दीवारों की रखवाली करनेवालों को पहचानता है। ‘नगर की दीवारें’ सामान्य पाठक के लिए स्पष्ट है और पहले आए ‘पहरेदार’ से मूल की समानांतरता बनाए रखता है।
