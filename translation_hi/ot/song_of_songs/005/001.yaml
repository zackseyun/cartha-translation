source:
  edition: WLC
  text: בָּ֣אתִי לְ/גַנִּ/י֮ אֲחֹתִ֣/י כַלָּה֒ אָרִ֤יתִי מוֹרִ/י֙ עִם בְּשָׂמִ֔/י אָכַ֤לְתִּי יַעְרִ/י֙ עִם דִּבְשִׁ֔/י שָׁתִ֥יתִי יֵינִ֖/י עִם חֲלָבִ֑/י אִכְל֣וּ רֵעִ֔ים שְׁת֥וּ וְ/שִׁכְר֖וּ דּוֹדִֽים־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/001.yaml
  text: I have come into my garden[a], my sister, my bride; I have gathered my myrrh with my spice. I have eaten my honeycomb with my honey; I have drunk my wine with my milk. Eat, friends; drink, and be drunk, beloved ones.
translation:
  language: hi
  text: 'मैं अपने बगीचे में आ गया हूँ,

    मेरी बहन, मेरी दुल्हन!


    मैंने अपना गन्धरस और अपने सुगन्ध-द्रव्य बटोर लिए हैं;

    मैंने शहद का अपना छत्ता और अपना शहद खाया है;

    मैंने अपना दाखमधु और अपना दूध पिया है।


    हे मित्रो, खाओ!

    हे प्रिय जनो, पीओ और मतवाले हो जाओ![a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पीओ और प्रेम में मतवाले हो जाओ।” यहाँ इब्रानी शब्द דּוֹדִים का अर्थ “प्रेम” भी हो सकता है; मुख्य पाठ में इसे “हे प्रिय जनो” के सम्बोधन के रूप में लिया गया है।
    reason: इब्रानी דּוֹדִים के अमूर्त और सम्बोधनात्मक, दोनों सम्भव अर्थों को सुरक्षित रखना।
lexical_decisions:
- source_word: בָּאתִי לְגַנִּי
  choice: मैं अपने बगीचे में आ गया हूँ
  rationale: בוא के पूर्ण रूप और गन्तव्यसूचक לְ को वर्तमान प्रसंग से जुड़ी पूरी हुई क्रिया के रूप में व्यक्त किया गया है; ‘में आ गया हूँ’ केवल बगीचे की ओर आने के बजाय उसमें प्रवेश का भाव देता है।
- source_word: אֲחֹתִי כַלָּה
  choice: मेरी बहन, मेरी दुलहन
  rationale: गीत में प्रयुक्त दोनों आत्मीय सम्बोधनों को अलग-अलग बनाए रखा गया है; ‘बहन’ यहाँ प्रेमिका के लिए काव्यात्मक सम्बोधन है।
- source_word: אָרִיתִי מוֹרִי עִם בְּשָׂמִי
  choice: मैंने अपना गन्धरस और अपने सुगन्ध-द्रव्य बटोर लिए हैं
  rationale: ארה का अर्थ सुगन्धित उपज एकत्र करना है। מֹר को प्रचलित बाइबलीय ‘गन्धरस’ और בשם को सन्दर्भानुसार सामूहिक ‘सुगन्ध-द्रव्य’ कहा गया है।
- source_word: אָכַלְתִּי יַעְרִי עִם דִּבְשִׁי
  choice: मैंने अपना मधु-छत्ता और अपना मधु खाया है
  rationale: יער यहाँ वन के बजाय मधु-छत्ते अथवा छत्ते के मधु को दर्शाता है। दोनों समानान्तर संज्ञाओं और उनके प्रथम-पुरुष स्वामित्व को सुरक्षित रखा गया है।
- source_word: שָׁתִיתִי יֵינִי עִם חֲלָבִי
  choice: मैंने अपना दाखमधु और अपना दूध पिया है
  rationale: दोनों पेयों को शाब्दिक रूप से रखा गया है; עם को सहज हिन्दी समन्वय ‘और’ से व्यक्त किया गया है।
- source_word: אִכְלוּ רֵעִים
  choice: हे मित्रो, खाओ
  rationale: बहुवचन आज्ञा और רֵעִים के प्रत्यक्ष सम्बोधन को स्पष्ट, स्वाभाविक हिन्दी में रखा गया है।
- source_word: שְׁתוּ וְשִׁכְרוּ דּוֹדִים
  choice: पीओ और प्रेम से मतवाले हो जाओ
  rationale: דּוֹדִים को प्रेम अथवा प्रेमानुभव के अर्थ में लेकर तीव्र तृप्ति का काव्यात्मक भाव व्यक्त किया गया है; सम्भव सम्बोधनात्मक अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
theological_decisions:
- issue: अन्तिम पद में דּוֹדִים का अर्थ और व्याकरणिक सम्बन्ध
  choice: ‘प्रेम से’—अर्थात प्रेम में भरकर मतवाले होने का काव्यात्मक आह्वान
  alternative: ‘हे प्रेमियो/प्रिय जनो’—דּוֹדִים को सम्बोधन मानना
  rationale: श्रेष्ठगीत में דּוֹדִים प्रेम या प्रेमाभिव्यक्तियों के लिए बार-बार आता है, इसलिए मुख्य पाठ में अमूर्त अर्थ सम्भव और प्रसंगानुकूल है। फिर भी बिना पूर्वसर्ग के इसका सम्बोधनात्मक विश्लेषण भी वास्तविक सम्भावना है; अतः उसे दबाने के बजाय पादटिप्पणी में दिया गया है। किसी रूपकात्मक या सम्प्रदायगत पहचान को पाठ में नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और काव्यात्मक रखी गई है। पूर्ण क्रियाओं में ‘आ गया हूँ/बटोर लिए हैं/खाया है/पिया है’ से अभी-अभी सम्पन्न कार्यों की वर्तमान प्रासंगिकता उभरती है। ‘गन्धरस’, ‘दुलहन’, ‘दाखमधु’ और ‘मधु-छत्ता’ संवेदी बिम्बों को बनाए रखते हुए सामान्य हिन्दी पाठक के लिए बोधगम्य हैं।
