lexical_decisions:
- source_word: רֹאשׁוֹ
  choice: उसका सिर
  rationale: רֹאשׁ का यहाँ प्रियतम के शरीर-वर्णन में सीधा शारीरिक अर्थ ‘सिर’ है।
- source_word: כֶּתֶם פָּז
  choice: कुंदन-सोना
  rationale: सोने के लिए प्रयुक्त दोनों काव्यात्मक शब्द मिलकर अत्यंत शुद्ध और बहुमूल्य सोने का बिंब देते हैं। ‘कुंदन-सोना’ इस बल को स्वाभाविक और संक्षिप्त हिन्दी में व्यक्त करता है।
- source_word: קְוּצּוֹתָיו
  choice: उसके केश
  rationale: यह शब्द बालों की लटों या घुँघराले गुच्छों को दर्शाता है। ‘केश’ काव्यात्मक, गरिमापूर्ण और आधुनिक पाठक के लिए सुबोध है।
- source_word: תַּלְתַּלִּים
  choice: लहरदार
  rationale: यह दुर्लभ काव्यात्मक शब्द बालों की लहराती या घुँघराली बनावट बताता है। ‘लहरदार’ अर्थ की अनिश्चितता को आवश्यकता से अधिक सीमित नहीं करता।
- source_word: שְׁחֹרוֹת
  choice: काले
  rationale: विशेषण सीधे काले रंग को व्यक्त करता है और हिन्दी में ‘केश’ के साथ स्वाभाविक है।
- source_word: כָּעוֹרֵב
  choice: कौए के समान
  rationale: כְּ तुलना और עֹרֵב कौए को दर्शाता है; यह उपमा बालों के गहरे काले रंग का बिंब देती है।
