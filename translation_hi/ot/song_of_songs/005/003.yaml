base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/003.yaml
  text: I have taken off my tunic—how can I put it on again? I have washed my feet—how can I soil them?[a][b]
translation:
  language: hi
  text: मैंने अपना वस्त्र उतार दिया है—मैं उसे फिर कैसे पहनूँ? मैंने अपने पाँव धो लिए हैं—मैं उन्हें कैसे मैला करूँ?[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैंने अपना पहनावा उतार दिया है—मैं उसे कैसे पहनूँ?”
    reason: lexical_alternative
  - marker: b
    text: या, “मैं उन्हें कैसे गंदा करूँ?”
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּשַׁטְתִּי
  choice: मैंने ... उतार दिया है
  rationale: यह क्रिया वस्त्र उतारने या शरीर से अलग करने को दर्शाती है। ‘उतार दिया है’ आधुनिक हिन्दी में स्वाभाविक है और पूर्ण हो चुकी, अभी प्रासंगिक क्रिया को व्यक्त करता है।
- source_word: כֻּתָּנְתִּי
  choice: अपना अंगरखा
  rationale: כֻּתֹּנֶת शरीर पर पहना जाने वाला मूल वस्त्र है। ‘अंगरखा’ सामान्य ‘वस्त्र’ से अधिक ठोस है और ‘चोगा’ की अपेक्षा मूल वस्त्र के भाव के निकट है।
- source_word: אֵיכָכָה
  choice: मैं ... कैसे
  rationale: यह प्रश्न व्यावहारिक आपत्ति या अनिच्छा व्यक्त करता है। हिन्दी में ‘मैं ... कैसे’ उसी स्वाभाविक आलंकारिक बल को बनाए रखता है।
- source_word: אֶלְבָּשֶׁנָּה
  choice: उसे फिर ... पहनूँ
  rationale: क्रिया का अर्थ पहनना है और स्त्रीलिंग प्रत्यय पहले आए वस्त्र की ओर संकेत करता है। ‘फिर’ उतारने की क्रिया को उलटने का प्रसंगगत भाव स्पष्ट करता है।
- source_word: רָחַצְתִּי
  choice: मैंने ... धो लिए हैं
  rationale: पूर्ण क्रिया का परिणाम वर्तमान में प्रासंगिक है। ‘धो लिए हैं’ हिन्दी में इस पूर्णता और बोलने वाली की अपनी क्रिया, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: רַגְלַי
  choice: अपने पाँव
  rationale: यह रूप दोनों पैरों को सूचित करता है। ‘पाँव’ आधुनिक हिन्दी में स्वाभाविक और काव्यात्मक रूप से उपयुक्त है।
- source_word: אֲטַנְּפֵם
  choice: उन्हें ... मैला करूँ
  rationale: पिएल रूप का ठोस अर्थ गंदा या मैला करना है। ‘मैला करूँ’ भौतिक चित्र को बनाए रखता है और ‘अपवित्र’ जैसे अनावश्यक धार्मिक अर्थ से बचता है।
theological_decisions:
- issue: स्त्री के कथन की व्याख्या
  choice: मुख्य पाठ में इसे वस्त्र उतारने और पाँव धोने से जुड़ी शाब्दिक घरेलू आपत्ति के रूप में रखा गया है।
  alternative: वस्त्र और पाँव की भाषा को मुख्यतः कामोत्तेजक रूपक मानना।
  rationale: गीतगीत में अर्थ की कई परतें संभव हैं, पर इस पद के प्रत्यक्ष शब्द ठोस और घरेलू हैं। अनुवाद शाब्दिक चित्र को सुरक्षित रखता है और व्यापक साहित्यिक या सांकेतिक व्याख्या पाठक पर नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल, गरिमापूर्ण और संवादात्मक काव्य-लहजा। ‘अंगरखा’ मूल वस्त्र की ठोस छवि देता है, जबकि पादटिप्पणी अधिक सामान्य ‘वस्त्र’ विकल्प सुरक्षित रखती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
