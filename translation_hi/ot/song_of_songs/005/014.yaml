base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/014.yaml
  text: His hands are rods of gold[a], set with beryl; his body is polished ivory[c][b], covered with sapphires.
translation:
  language: hi
  text: उसके हाथ सोने की गोल छड़ें हैं,[a] जिनमें तर्शीश-मणि जड़ी है[c]; उसका पेट तराशे हुए हाथीदाँत का काम है,[b] जो नीलमों से मढ़ा हुआ है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सोने के छल्ले।” इब्रानी शब्द गोल या बेलनाकार सुनहरी आकृतियों का बोध कराता है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से “उसके भीतरी अंग” या “उसका पेट।” यहाँ प्रसंग शरीर के प्रत्यक्ष वर्णन का समर्थन करता है।
    reason: lexical_alternative
  - marker: c
    text: “तर्शीश-मणि” किस आधुनिक रत्न को सूचित करती है, यह अनिश्चित है; इसे बेरिल, पुखराज या क्राइसोलाइट भी समझा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָדָיו
  choice: उसके हाथ
  rationale: יָד का सामान्य अर्थ ‘हाथ’ है; यद्यपि यह बाँह तक का संकेत दे सकता है, यहाँ शरीर-वर्णन में प्रत्यक्ष और स्वाभाविक अर्थ रखा गया है।
- source_word: גְּלִילֵי זָהָב
  choice: सोने के बेलन
  rationale: גְּלִילִים गोल या बेलनाकार रूपों को सूचित करता है। ‘बेलन’ आकृति को स्पष्ट रखता है; ‘छल्ले’ भी संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
- source_word: מְמֻלָּאִים בַּתַּרְשִׁישׁ
  choice: जिनमें तर्शीश-मणि जड़ी है
  rationale: आभूषण के प्रसंग में מְמֻלָּאִים का भाव रत्न जड़े होने का है। תַּרְשִׁישׁ की ठीक आधुनिक पहचान अनिश्चित होने के कारण उसका लिप्यंतरण रखा गया है।
- source_word: מֵעָיו
  choice: उसका पेट
  rationale: מֵעֶה ‘भीतरी अंग’ या ‘पेट’ कह सकता है। इस शारीरिक सौंदर्य-वर्णन में ठोस शारीरिक अर्थ उपयुक्त है; ‘पेट’ आधुनिक हिन्दी में सहज और स्रोत के निकट है।
- source_word: עֶשֶׁת שֵׁן
  choice: तराशा हुआ हाथीदाँत
  rationale: यह पद गढ़े या कारीगरी किए हुए हाथीदाँत की छवि देता है। ‘तराशा हुआ’ उसकी निर्मित, सुडौल चमक को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מְעֻלֶּפֶת סַפִּירִים
  choice: जिस पर नीलम जड़े हैं
  rationale: कृदंत ढके, मढ़े या अलंकृत होने का भाव देता है। रत्नकारी की समानांतर छवि में ‘जड़े हैं’ स्पष्ट और काव्यात्मक है।
