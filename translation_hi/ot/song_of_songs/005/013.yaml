  yaml_path: translation/ot/song_of_songs/005/013.yaml
  text: His cheeks are like beds of spice[a], mounds of perfumes; his lips are lilies, dripping flowing myrrh.
translation:
  language: hi
  text: 'उसके गाल सुगंधित पौधों की क्यारी जैसे हैं,

    सुगंधित मिश्रणों के ऊँचे ढेर[a];

    उसके होंठ सोसन के फूल हैं,

    जो बहता हुआ गन्धरस टपकाते हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘सुगंध-द्रव्यों की मीनारें।’ इब्रानी बिंब कठिन है; इसका अर्थ सुगंधित पौधों की ऊँची क्यारियाँ या सुगंधित मिश्रणों के ढेर भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: לְחָיָו
  choice: उसके गाल
  rationale: बहुवचन संज्ञा और तृतीय पुरुष एकवचन प्रत्यय यहाँ चेहरे के दोनों गालों को सूचित करते हैं; काव्यात्मक वर्णन में ‘गाल’ स्वाभाविक और सटीक है।
- source_word: כַּעֲרוּגַת הַבֹּשֶׂם
  choice: सुगंधित पौधों की क्यारियों जैसे
  rationale: עֲרוּגָה बगीचे की क्यारी या भूखंड है और בֹּשֶׂם सुगंधित वनस्पति अथवा मसाले को सूचित करता है। हिंदी में बहुवचन ‘क्यारियों’ दोनों गालों से तुलना को सहज बनाता है, जबकि बागवानी का बिंब बना रहता है।
- source_word: מִגְדְּלוֹת מֶרְקָחִים
  choice: सुगंध-द्रव्यों के ऊँचे ढेर
  rationale: यह कठिन काव्यात्मक पदबंध ऊँची संरचनाओं, उभरी क्यारियों या सुगंधित मिश्रणों के ढेरों का बिंब दे सकता है। ‘ऊँचे ढेर’ उसकी ऊर्ध्वता और सुगंध दोनों को सहज हिंदी में रखता है; अधिक शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: שְׂפָתוֹתָיו
  choice: उसके होंठ
  rationale: यह बहुवचन संज्ञा तृतीय पुरुष एकवचन प्रत्यय के साथ सीधे उसके होंठों को दर्शाती है।
- source_word: שׁוֹשַׁנִּים
  choice: सोसन के फूल
  rationale: वनस्पति की ठीक पहचान अनिश्चित है, पर बाइबलीय काव्य में שׁוֹשַׁנִּים का पारंपरिक और परिचित हिंदी रूप ‘सोसन के फूल’ है।
- source_word: נֹטְפוֹת
  choice: टपकता है
  rationale: कृदंत धीरे-धीरे बूंदों में झरने या टपकने का जीवंत बिंब देता है। हिंदी वाक्य में इसका कर्ता ‘गन्धरस’ रखा गया है।
- source_word: מוֹר
  choice: गन्धरस
  rationale: מוֹר सुगंधित राल myrrh है; ‘गन्धरस’ आधुनिक हिंदी बाइबलीय काव्य में अर्थपूर्ण और गरिमापूर्ण रूप है।
- source_word: עֹבֵר
  choice: बहता हुआ
  rationale: यहाँ शब्द गन्धरस की तरल, स्वतंत्र रूप से बहने वाली अवस्था बताता है; ‘बहता हुआ’ संवेदनात्मक काव्य-बिंब को स्पष्ट रखता है।
