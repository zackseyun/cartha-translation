  edition: WLC
  text: אֲנִ֥י יְשֵׁנָ֖ה וְ/לִבִּ֣/י עֵ֑ר ק֣וֹל דּוֹדִ֣/י דוֹפֵ֗ק פִּתְחִי לִ֞/י אֲחֹתִ֤/י רַעְיָתִ/י֙ יוֹנָתִ֣/י תַמָּתִ֔/י שֶׁ/רֹּאשִׁ/י֙ נִמְלָא טָ֔ל קְוֻּצּוֹתַ֖/י רְסִ֥יסֵי לָֽיְלָה׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/002.yaml
  text: 'I was asleep[a], but my heart was awake. The sound of my beloved knocking: “Open to me, my sister, my darling, my dove, my blameless one, for my head is drenched with dew[b], my locks with the drops of the night.”'
translation:
  language: hi
  text: 'मैं सोई हुई थी, पर मेरा हृदय जाग रहा था। मेरे प्रिय की आहट[a]—वह खटखटा रहा है: “मेरे लिए दरवाज़ा खोल दे, मेरी बहन, मेरी प्रियतमा, मेरी कबूतरी, मेरी निष्कलंक[b], क्योंकि मेरा सिर ओस से तर है और मेरी लटें रात की बूँदों से भीगी हैं।”'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मेरे प्रिय की आवाज़।” इब्रानी शब्द קוֹל का अर्थ प्रसंग के अनुसार ‘आवाज़’, ‘वाणी’ या ‘ध्वनि’ हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “मेरी संपूर्ण” अथवा “मेरी निर्दोष।” इब्रानी शब्द में संपूर्णता, निष्कपटता या शुद्धता का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יְשֵׁנָה
  choice: सोई हुई थी
  rationale: स्त्रीलिंग एकवचन विधेय विशेषण को अवस्था के रूप में व्यक्त करता है और वक्ता के स्त्री होने को भी स्पष्ट रखता है।
- source_word: לִבִּי עֵר
  choice: मेरा हृदय जाग रहा था
  rationale: ‘हृदय’ मूल काव्य-बिंब और सोए शरीर के साथ जागते अंतरमन का तनाव बनाए रखता है।
- source_word: קוֹל דּוֹדִי
  choice: मेरे प्रिय की आवाज़
  rationale: हिन्दी ‘आवाज़’ वाणी और सुनाई देने वाली ध्वनि, दोनों के लिए प्रयुक्त हो सकती है; इससे इब्रानी קוֹל की संदर्भगत व्यापकता काफी हद तक बनी रहती है।
- source_word: דוֹפֵק
  choice: वह खटखटा रहा है
  rationale: वर्तमान कृदंत की जारी और सजीव क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: פִּתְחִי לִי
  choice: मेरे लिए द्वार खोल दे
  rationale: ‘द्वार’ प्रसंग से निहित कर्म को हिन्दी में स्वाभाविकता के लिए स्पष्ट करता है; एकवचन आत्मीय आज्ञार्थक निकट संबंध के स्वर को रखता है।
- source_word: אֲחֹתִי
  choice: मेरी बहन
  rationale: गीत में प्रयुक्त प्रेमपूर्ण संबोधन को बिना व्याख्यात्मक परिवर्तन के अक्षरशः रखा गया है।
- source_word: רַעְיָתִי
  choice: मेरी प्रियतमा
  rationale: स्त्री प्रिय साथी के लिए आत्मीय, वर्तमान और गरिमापूर्ण हिन्दी संबोधन है।
- source_word: יוֹנָתִי
  choice: मेरी कबूतरी
  rationale: मूल रूपक को प्रत्यक्ष रूप से सुरक्षित रखता है।
- source_word: תַמָּתִי
  choice: मेरी निष्कलंक
  rationale: शब्द की संपूर्णता, निर्दोषता और शुद्धता की अर्थ-सीमा में से नैतिक तथा संबंधपरक निर्मलता को व्यक्त करता है, पर पूर्ण त्रुटिहीनता का अनिवार्य दावा नहीं करता।
- source_word: שֶׁרֹּאשִׁי נִמְלָא טָל
  choice: क्योंकि मेरा सिर ओस से तर है
  rationale: कारणसूचक संबंध को स्पष्ट रखते हुए ‘ओस से भर गया’ के भौतिक बिंब को स्वाभाविक काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: קְוֻּצּוֹתַי רְסִיסֵי לָיְלָה
  choice: मेरी लटें रात की बूँदों से भीगी हैं
  rationale: ‘लटें’ मूल के केश-गुच्छों को और ‘रात की बूँदें’ उसके खुले, काव्यात्मक समानांतर बिंब को बनाए रखती हैं; हिन्दी में आवश्यक विधेय को पिछले खंड से स्पष्ट किया गया है।
