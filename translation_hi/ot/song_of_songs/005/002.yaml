  register: आधुनिक मानक हिन्दी में काव्यात्मक किंतु सहज शैली रखी गई है। स्त्री वक्ता का व्याकरणिक लिंग सुरक्षित है। प्रेमियों के बीच निकटता दिखाने के लिए एकवचन आत्मीय ‘दे’ प्रयुक्त हुआ है; संबोधनों की क्रमिकता और मूल की भावनात्मक तीव्रता बनाए रखी गई है।
