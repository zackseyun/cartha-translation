base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/008.yaml
  text: 'I adjure you[a], daughters of Jerusalem: if you find my beloved, what will you tell him? That I am sick with love.'
translation:
  language: hi
  text: 'हे यरूशलेम की बेटियो, मैं तुम्हें शपथ दिलाती हूँ: यदि तुम्हें मेरा प्रिय मिल जाए, तो तुम उससे क्या कहोगी? कि मैं प्रेम से बीमार हूँ[a]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मैं प्रेम-रोगी हूँ।” इब्रानी में शाब्दिक अर्थ है, “प्रेम से बीमार।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: मैं तुम्हें शपथ दिलाती हूँ
  rationale: हिफ़िल रूप यहाँ किसी को शपथ के अधीन करने या अत्यंत गंभीर आग्रह करने का भाव रखता है। यह हिंदी प्रयोग मूल की औपचारिकता और तात्कालिकता बनाए रखता है। स्त्रीलिंग ‘दिलाती’ वक्ता के लिए आगे आए חוֹלַת के स्त्रीलिंग रूप से स्पष्ट होता है।
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: हे यरूशलेम की बेटियो
  rationale: यह गीत में प्रयुक्त सीधा संबोधन है। ‘बेटियो’ मूल रूपक और काव्यात्मक संबोधन को सुरक्षित रखता है।
- source_word: אִם תִּמְצְאוּ
  choice: यदि तुम्हें ... मिल जाए
  rationale: אִם वास्तविक शर्त व्यक्त करता है; ‘यदि’ मूल की अनिश्चितता को ‘जब’ की अपेक्षा अधिक ठीक से बनाए रखता है।
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीत में דּוֹד प्रिय पुरुष साथी को दर्शाता है। ‘मेरा प्रिय’ स्वाभाविक, गरिमापूर्ण और मूल से कम व्याख्यात्मक है।
- source_word: מַה תַּגִּידוּ לוֹ
  choice: तुम उससे क्या कहोगी?
  rationale: यह सीधा प्रश्न उस संदेश के विषय में है जो यरूशलेम की बेटियाँ प्रिय को देंगी। हिंदी में यह सहज रूप से उसी प्रश्नवाचक बल को रखता है।
- source_word: שֶׁחוֹלַת אַהֲבָה אָנִי
  choice: यही कि मैं प्रेम में बीमार हूँ
  rationale: मूल में बीमारी और प्रेम का रूपक स्पष्ट है। ‘प्रेम में बीमार’ उसे संक्षिप्त शब्द ‘प्रेम-रोगी’ में समेटने के बजाय पारदर्शी रूप में बनाए रखता है। ‘यही’ प्रश्न के बाद उत्तर को स्वाभाविक हिंदी में जोड़ता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिंदी में काव्यात्मक, गरिमापूर्ण और सहज शैली रखी गई है। स्त्री वक्ता तथा स्त्री-समूह के संबोधन को हिंदी के लिंग-सूचक क्रियारूपों में स्पष्ट किया गया है; मूल की शर्त और प्रेम-जनित बीमारी का रूपक बनाए रखा गया है।
