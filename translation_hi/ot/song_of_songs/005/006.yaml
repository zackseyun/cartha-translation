  text: פָּתַ֤חְתִּֽי אֲנִי֙ לְ/דוֹדִ֔/י וְ/דוֹדִ֖/י חָמַ֣ק עָבָ֑ר נַפְשִׁ/י֙ יָֽצְאָ֣ה בְ/דַבְּר֔/וֹ בִּקַּשְׁתִּ֨י/הוּ֙ וְ/לֹ֣א מְצָאתִ֔י/הוּ קְרָאתִ֖י/ו וְ/לֹ֥א עָנָֽ/נִי׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/006.yaml
  text: I opened to my beloved[a], but my beloved had turned away and gone. My soul went out when he spoke; I sought him, but I did not find him. I called him[b], but he did not answer me.
translation:
  language: hi
  text: मैंने अपने प्रिय के लिए द्वार खोला, पर मेरा प्रिय सरककर चला गया था।[a] जब वह बोला, मेरे प्राण निकल गए।[b] मैंने उसे ढूँढ़ा, पर वह मुझे नहीं मिला; मैंने उसे पुकारा, पर उसने मुझे उत्तर नहीं दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ के अधिक निकट: “खिसककर आगे निकल गया था।” इब्रानी में उसके चले जाने पर बल देने के लिए दो क्रियाएँ प्रयुक्त हुई हैं।'
    reason: lexical_alternative
  - marker: b
    text: इस कठिन इब्रानी मुहावरे का अर्थ “उसके बोलने पर मेरी सुध-बुध जाती रही” या “उसके बोलते ही मैं अपने आपे में न रही” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּתַחְתִּי אֲנִי לְדוֹדִי
  choice: मैंने अपने प्रिय के लिए द्वार खोल दिया
  rationale: פתח ל का अर्थ किसी के लिए द्वार खोलना है। हिंदी में कर्म स्पष्ट करना आवश्यक है, इसलिए निकटवर्ती प्रसंग से निहित ‘द्वार’ व्यक्त किया गया है। अलग सर्वनाम אֲנִי का हल्का बल स्वाभाविक हिंदी वाक्य में अंतर्निहित है।
- source_word: וְדוֹדִי חָמַק עָבָר
  choice: पर मेरा प्रिय चुपके से निकलकर जा चुका था
  rationale: संदर्भ में ו विरोध प्रकट करता है। חמק और עבר दोनों को रखते हुए अनदेखे ढंग से निकल जाने और दूर चले जाने का भाव व्यक्त किया गया है।
- source_word: נַפְשִׁי יָצְאָה
  choice: मेरे प्राण निकल गए
  rationale: यह मूल इब्रानी की सजीव और भावात्मक उक्ति को बनाए रखता है। इसे केवल ‘मैं घबरा गई’ जैसे अर्थ में सीमित नहीं किया गया।
- source_word: בְדַבְּרוֹ
  choice: जब वह बोला
  rationale: בְּ के साथ क्रियार्थक रूप को समयसूचक समझना यहाँ स्वाभाविक है, यद्यपि यह उक्ति उसके बोलने के कारण उत्पन्न भाव को भी संकेत कर सकती है।
- source_word: בִּקַּשְׁתִּיהוּ וְלֹא מְצָאתִיהוּ
  choice: मैंने उसे ढूँढ़ा, पर वह मुझे नहीं मिला
  rationale: בקשׁ को सामान्य आधुनिक हिंदी ‘ढूँढ़ना’ से व्यक्त किया गया है और नकारात्मक पूर्ण क्रिया में असमर्थता का अतिरिक्त भाव नहीं जोड़ा गया।
- source_word: קְרָאתִיו וְלֹא עָנָנִי
  choice: मैंने उसे पुकारा, पर उसने मुझे उत्तर नहीं दिया
  rationale: קרא का यहाँ अर्थ आवाज़ देकर पुकारना है और ענה व्यक्तिगत उत्तर देने को दर्शाता है; यह अनुत्तरित पुकार की भावात्मक तीव्रता बनाए रखता है।
