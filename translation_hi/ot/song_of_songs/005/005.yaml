base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/005.yaml
  text: I arose to open to my beloved[a], and my hands dripped with myrrh, my fingers with flowing myrrh[b], on the handles of the bolt.
translation:
  language: hi
  text: मैं अपने प्रिय के लिए द्वार खोलने को उठी; मेरे हाथ गन्धरस से टपक रहे थे, और मेरी उँगलियों से बहता हुआ गन्धरस[a] साँकल के हत्थों पर[b] टपक रहा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “तरल गन्धरस” अथवा “बहता गन्धरस।”
    reason: lexical_alternative
  - marker: b
    text: या “ताले के हत्थों पर” अथवा “कुंडी पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קַמְתִּי אֲנִי
  choice: मैं ... उठी
  rationale: קום के प्रथम पुरुष एकवचन रूप और स्पष्ट सर्वनाम के बल को स्वाभाविक हिन्दी में रखा गया है; वक्ता स्त्री है, इसलिए ‘उठी’ प्रयोग हुआ है।
- source_word: לִפְתֹּחַ לְדוֹדִי
  choice: अपने प्रिय के लिए द्वार खोलने को
  rationale: פתח का अर्थ ‘खोलना’ और דּוֹדִי का अर्थ ‘मेरा प्रिय’ है। हिन्दी में क्रिया को स्वाभाविक और स्पष्ट बनाने के लिए प्रसंग में निहित ‘द्वार’ जोड़ा गया है।
- source_word: יָדַי נָטְפוּ מוֹר
  choice: मेरे हाथों से गन्धरस टपक रहा था
  rationale: נטף की टपकने की क्रिया और गन्धरस की सजीव, सुगन्धित छवि दोनों सुरक्षित रखी गई हैं।
- source_word: אֶצְבְּעֹתַי
  choice: मेरी उँगलियों से
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: מוֹר עֹבֵר
  choice: बहता हुआ गन्धरस
  rationale: עֹבֵר का मूल गतिशील भाव ‘गुज़रता/बहता हुआ’ है; यह चयन पदार्थ की तरलता की छवि रखता है, जबकि अन्य सम्भव अर्थ पादटिप्पणी में दिए गए हैं।
- source_word: עַל כַּפּוֹת הַמַּנְעוּל
  choice: साँकल के हत्थों पर
  rationale: इस स्थापत्य प्रसंग में כַּפּוֹת हाथ से पकड़ने वाले हत्थों को और מַנְעוּל द्वार बन्द करने वाली साँकल/अवरोधक युक्ति को सूचित करता है। यह प्राचीन द्वार-सज्जा के अनुकूल और आधुनिक पाठक के लिए समझने योग्य है।
