source:
  edition: WLC
  text: חִכּ/וֹ֙ מַֽמְתַקִּ֔ים וְ/כֻלּ֖/וֹ מַחֲּמַדִּ֑ים זֶ֤ה דוֹדִ/י֙ וְ/זֶ֣ה רֵעִ֔/י בְּנ֖וֹת יְרוּשָׁלִָֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/016.yaml
  text: His mouth is sweetness itself[a], and all of him is desirable. This is my beloved, and this is my friend[b], O daughters of Jerusalem.
translation:
  language: hi
  text: उसके मुँह में मिठास ही मिठास है[a], और वह पूरा का पूरा मनभावना है[b]। हे यरूशलेम की बेटियो, यही मेरा प्रियतम और यही मेरा मित्र है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका तालु मिठास है”; इसका आशय उसके मुँह, स्वाद, चुम्बन या वाणी की मिठास से हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “वह पूरा का पूरा मनोहर है।” इब्रानी में यहाँ तीव्रता व्यक्त करने वाला बहुवचन है, जिसका भाव चाहने योग्य, प्रिय या मनोहर होने का है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חִכּוֹ
  choice: उसका मुँह
  rationale: मूल अर्थ तालु है, पर इस काव्यात्मक प्रसंग में यह लक्षणा से मुँह—और संभवतः उसके चुम्बन या वाणी—को दर्शाता है। ‘मुँह’ आधुनिक हिन्दी में स्वाभाविक रहते हुए शारीरिक बिंब बनाए रखता है।
- source_word: מַמְתַקִּים
  choice: मिठास ही है
  rationale: यह बहुवचन यहाँ तीव्रता अथवा भाववाचक अर्थ व्यक्त करता है। ‘मिठास ही है’ केवल ‘मीठा है’ की अपेक्षा काव्यात्मक बल को बेहतर बनाए रखता है।
- source_word: וְכֻלּוֹ
  choice: और वह पूरा-का-पूरा
  rationale: इब्रानी का ठोस अर्थ ‘उसका समूचा [व्यक्तित्व/शरीर]’ है। यह रूप पूरे व्यक्ति पर बल देता है और हिन्दी में सहज है।
- source_word: מַחֲמַדִּים
  choice: मनभावना है
  rationale: शब्द चाहने योग्य, प्रिय या मनोहर होने का भाव देता है; इसका बहुवचन तीव्र या भाववाचक है। ‘मनभावना’ प्रेम-काव्य के प्रसंग में स्वाभाविक है और बाद की धार्मिक व्याख्याएँ नहीं जोड़ता।
- source_word: זֶה ... וְזֶה
  choice: यही ... और यही
  rationale: दोहराए गए संकेतवाचक की बलात्मकता और समानांतरता को हिन्दी में ‘यही’ से सुरक्षित रखा गया है।
- source_word: דּוֹדִי
  choice: मेरा प्रियतम
  rationale: गीतगीत में यह स्त्री के प्रेमी पुरुष के लिए आत्मीय संबोधन है। ‘प्रियतम’ काव्यात्मक और स्पष्ट है, पर अनावश्यक रूप से स्थूल नहीं।
- source_word: רֵעִי
  choice: मेरा मित्र
  rationale: शब्द मित्र या साथी को सूचित करता है। ‘मित्र’ प्रियतम के साथ संबंध की व्यापकता और कोमलता को बनाए रखता है।
- source_word: בְּנוֹת יְרוּשָׁלָם
  choice: हे यरूशलेम की बेटियो
  rationale: यह गीतगीत का आवर्ती काव्यात्मक संबोधन है। ‘बेटियो’ मूल रूपक को बनाए रखता है; ‘युवतियो’ अधिक व्याख्यात्मक होता।
theological_decisions:
- issue: מַחֲמַדִּים की मसीह-संबंधी अथवा भक्तिपरक अतिव्याख्या की संभावना
  choice: प्रेम-काव्य के तात्कालिक प्रसंग में ‘मनभावना’
  alternative: पारंपरिक भक्तिपरक अनुगूँज वाला ‘सर्वथा मनोहर’ या इसे उपाधि-जैसा मानना
  rationale: पद में स्त्री अपने प्रियतम की प्रशंसा कर रही है। अनुवाद को इब्रानी से अनिवार्य न होने वाली बाद की मसीह-संबंधी या सांप्रदायिक व्याख्या नहीं जोड़नी चाहिए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण प्रेम-काव्य का स्वर रखा गया है। ‘मिठास ही है’ और ‘पूरा-का-पूरा’ मूल की तीव्रता को सहज हिन्दी में व्यक्त करते हैं; संबोधन में ‘हे’ साहित्यिक गरिमा और स्पष्ट संबोधन दोनों बनाए रखता है।
