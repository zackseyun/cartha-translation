  yaml_path: translation/ot/song_of_songs/005/010.yaml
  text: My beloved is radiant and ruddy[a], distinguished among ten thousand.
translation:
  language: hi
  text: मेरा प्रिय उज्ज्वल और सुर्ख है; वह दस हज़ार में विशिष्ट है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा “दस हज़ार में सबसे अलग दिखाई देता है”; अधिक शाब्दिक रूप में, “दस हज़ार में ध्वजा से चिह्नित है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीतगीत में דּוֹד स्त्री के प्रेमपात्र के लिए प्रयुक्त होता है। “मेरा प्रिय” आधुनिक हिन्दी में स्वाभाविक, गरिमापूर्ण और पुस्तक की आत्मीय प्रेम-भाषा के अनुरूप है।
- source_word: צַח
  choice: उज्ज्वल
  rationale: यह शब्द चमक, निर्मलता या दीप्त रूप का बोध कराता है। “उज्ज्वल” केवल गोरे रंग के बजाय दिखाई देने वाली कांति को व्यक्त करता है।
- source_word: וְאָדוֹם
  choice: और सुर्ख
  rationale: אָדוֹם का मूल अर्थ लाल होना है। किसी व्यक्ति के रूप-वर्णन में “सुर्ख” स्वस्थ लालिमा का स्वाभाविक हिन्दी बोध देता है और सीधे “लाल” कहने की असहजता से बचाता है।
- source_word: דָּגוּל
  choice: विशिष्ट
  rationale: यह रूप किसी के चिह्नित, सबसे अलग दिखाई देने वाले या प्रतिष्ठित होने का भाव दे सकता है। “विशिष्ट” कविता के संदर्भ में उसकी भीड़ से अलग पहचान को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है, जबकि अधिक शाब्दिक ध्वजा-संबंधी रूपक हिन्दी में अस्पष्ट हो सकता है।
- source_word: מֵרְבָבָה
  choice: दस हज़ार में
  rationale: यहाँ מִן विशाल समूह के बीच से तुलना या चयन का भाव देता है। “दस हज़ार में” उसके बड़ी भीड़ में सबसे अलग पहचाने जाने का काव्यात्मक अर्थ बनाए रखता है।
