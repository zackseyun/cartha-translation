  text: My beloved put his hand through the opening[b][a], and my inward parts trembled for him.
translation:
  language: hi
  text: मेरे प्रिय ने छेद में से अपना हाथ बढ़ाया[a], और उसके लिए मेरे भीतर हलचल मच उठी[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘खुले स्थान में से।’ इब्रानी में शाब्दिक रूप से ‘छेद से’ है; संभवतः द्वार के किसी छेद या खुले स्थान का संकेत है।
    reason: lexical_alternative
  - marker: b
    text: या ‘मेरे भीतर के अंग उसके लिए उद्वेलित हो उठे’ अथवा ‘मेरा हृदय उसके लिए व्याकुल हो उठा।’ इब्रानी गहरी आंतरिक भावना को शरीर के भीतरी अंगों की भाषा में व्यक्त करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: דּוֹדִי
  choice: मेरे प्रिय
  rationale: यह पद गीत में स्त्री के प्रिय पुरुष को सूचित करता है। ‘मेरे प्रिय’ आधुनिक, स्वाभाविक और काव्यात्मक है तथा अनावश्यक रूप से अर्थ को अधिक स्पष्ट नहीं करता।
- source_word: שָׁלַח יָדוֹ
  choice: अपना हाथ बढ़ाया
  rationale: שׁלח का सामान्य अर्थ ‘भेजना’ है, पर ‘हाथ’ के साथ यहाँ हाथ आगे बढ़ाने की क्रिया अभिप्रेत है। हिंदी में ‘हाथ बढ़ाया’ इस मुहावरे का स्वाभाविक रूप है।
- source_word: מִן הַחֹר
  choice: छेद में से
  rationale: חֹר किसी छेद या खुले स्थान को दर्शाता है। ‘छेद में से’ मूल की ठोस छवि और מן के संदर्भगत मार्गवाचक अर्थ को बनाए रखता है; द्वार का उल्लेख संदर्भ से संभावित है, पर मूल पद में स्पष्ट नहीं।
- source_word: וּמֵעַי
  choice: मेरे भीतर का सब कुछ
  rationale: מֵעִים शाब्दिक रूप से शरीर के भीतरी अंगों और लाक्षणिक रूप से गहरी आंतरिक भावनाओं को दर्शाता है। यह चयन आधुनिक हिंदी में सहज रहते हुए उस देहगत भाव-चित्र को कुछ हद तक सुरक्षित रखता है।
- source_word: הָמוּ עָלָיו
  choice: उसके लिए काँप उठा
  rationale: המה भीतर की हलचल, व्याकुलता या कंपित होने को व्यक्त करता है। ‘काँप उठा’ तीव्र शारीरिक-भावनात्मक प्रतिक्रिया को संक्षेप में देता है, और עָלָיו को भाव की दिशा बताते हुए ‘उसके लिए’ किया गया है।
