translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक और गरिमापूर्ण सम्बोधन रखा गया है। स्त्री वक्ता को किया गया एकवचन अनौपचारिक सम्बोधन ‘तेरे/तूने’ मूल इब्रानी के स्त्रीलिंग एकवचन रूपों को स्पष्ट करता है। समान प्रश्न की पुनरावृत्ति मूल की समान्तर रचना के अनुसार सुरक्षित रखी गई है।
