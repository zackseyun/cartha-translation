base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/005/009.yaml
  text: What is your beloved more than another beloved[a], most beautiful among women? What is your beloved more than another beloved[b], that you have made us swear thus?
translation:
  language: hi
  text: हे स्त्रियों में सबसे सुन्दरी, तेरा प्रिय[a] दूसरे प्रिय से किस बात में बढ़कर है? तेरा प्रिय दूसरे प्रिय से किस बात में बढ़कर है कि तूने हमसे इस प्रकार शपथ दिलवाई है[b]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरा प्रेमी”; इस पूरे पद में इब्रानी शब्द דּוֹד प्रेम-संबंध में प्रिय व्यक्ति को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “तूने हमें शपथ के अधीन किया है”; इब्रानी क्रिया का अर्थ किसी से शपथ करवाना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מַה דּוֹדֵךְ מִדּוֹד
  choice: तेरे प्रिय में किसी और प्रिय से बढ़कर क्या है
  rationale: מַה प्रश्नवाचक बल रखता है और מִן तुलना दर्शाता है। यह हिन्दी वाक्यांश स्वाभाविक ढंग से पूछता है कि उसका प्रिय अन्य प्रियजनों से किस बात में बढ़कर है, साथ ही मूल की पुनरावृत्ति बनाए रखता है।
- source_word: דּוֹדֵךְ
  choice: तेरा प्रिय
  rationale: गीतगीत में דּוֹד स्त्री के प्रेम-संबंधी प्रिय पुरुष को दर्शाता है। ‘प्रिय’ काव्यात्मक, संबंधपरक और आधुनिक हिन्दी में गरिमापूर्ण है; ‘प्रेमी’ सम्भव वैकल्पिक अर्थ है।
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: हे स्त्रियों में सबसे सुन्दरी
  rationale: विशेषण और בַּנָּשִׁים का प्रयोग प्रसंग में सर्वोच्चता का भाव देता है। सम्बोधनसूचक ‘हे’ और ‘सबसे सुन्दरी’ आधुनिक, स्पष्ट और काव्यात्मक हिन्दी देते हैं।
- source_word: שֶׁכָּכָה
  choice: इस प्रकार
  rationale: यह क्रियाविशेषण रीति या मात्रा की ओर संकेत करता है। ‘इस प्रकार’ मूल के संकेतात्मक भाव को गरिमापूर्ण आधुनिक हिन्दी में रखता है।
- source_word: הִשְׁבַּעְתָּנוּ
  choice: तूने हमें शपथ दिलाई है
  rationale: שבע का हिफ़ील रूप किसी से शपथ करवाने या उसे शपथ के अधीन करने का अर्थ देता है। ‘शपथ दिलाई’ हिन्दी में स्पष्ट और सहज है।
