  yaml_path: translation/ot/song_of_songs/005/012.yaml
  text: His eyes are like doves beside streams of water[a], bathed in milk, sitting by fullness.
translation:
  language: hi
  text: उसकी आँखें जलधाराओं के पास कबूतरियों के समान हैं, जो दूध में नहाई हुई और भरे हुए स्थान पर बैठी हुई हैं[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अंतिम इब्रानी पदबंध कठिन है। इसका अर्थ ‘भरे हुए जलाशय के पास’ या ‘अपने स्थान में ठीक से जड़ी हुई’ भी हो सकता है।
    reason: वैकल्पिक पाठार्थ
lexical_decisions:
- source_word: עֵינָיו
  choice: उसकी आँखें
  rationale: עַיִן का सामान्य अर्थ ‘आँख’ है; यहाँ संबंधसूचक प्रत्यय और कबूतरियों की उपमा शारीरिक आँखों की ओर स्पष्ट संकेत करते हैं।
- source_word: כְּיוֹנִים
  choice: कबूतरियों के समान
  rationale: כְּ तुलना व्यक्त करता है। स्त्रीलिंग बहुवचन कृदंतों के अनुरूप ‘कबूतरियाँ’ स्वाभाविक है और काव्यात्मक उपमा को बनाए रखता है।
- source_word: עַל אֲפִיקֵי מָיִם
  choice: जलधाराओं के किनारे
  rationale: אֲפִיקִים जल की धाराओं, नालों या जलमार्गों को सूचित करता है; ‘जलधाराओं के किनारे’ दृश्य को सहज और काव्यात्मक ढंग से व्यक्त करता है।
- source_word: רֹחֲצוֹת
  choice: नहाई हुई
  rationale: רחץ का स्त्रीलिंग बहुवचन कृदंत नहाने या धोए जाने का भाव दे सकता है। ‘नहाई हुई’ दूध में स्नान करती कबूतरियों का सजीव चित्र प्रस्तुत करता है, बिना कर्मवाच्य अर्थ को अनिवार्य किए।
- source_word: בֶּחָלָב
  choice: दूध में
  rationale: בְּ यहाँ स्थान अथवा माध्यम का अर्थ देता है; ‘दूध में’ मूल की उज्ज्वल, श्वेत छवि को सुरक्षित रखता है।
- source_word: יֹשְׁבוֹת
  choice: बैठी हुई
  rationale: ישׁב का मूल ठोस अर्थ ‘बैठना’ या ‘निवास करना’ है। ‘बैठी हुई’ कबूतरियों की उपमा को बनाए रखता है और आँखों की स्थिति का संकेत भी दे सकता है।
- source_word: עַל מִלֵּאת
  choice: भराव के पास
  rationale: מִלֵּאת अत्यंत कठिन पद है और पूर्णता, भरे हुए जलाशय, अथवा आँखों के जड़ाव/खाँचे की ओर संकेत कर सकता है। ‘भराव के पास’ मूल की संक्षिप्त अस्पष्टता और עַל के संबंधसूचक भाव को यथासंभव बनाए रखता है।
