  text: הִשְׁבַּ֥עְתִּי אֶתְ/כֶ֖ם בְּנ֣וֹת יְרוּשָׁלִָ֑ם מַה תָּעִ֧ירוּ וּֽ/מַה תְּעֹֽרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/004.yaml
  text: 'I adjure you[b][a], daughters of Jerusalem: why should you awaken or stir up love until it desires?'
translation:
  language: hi
  text: 'हे यरूशलेम की बेटियो, मैं तुम्हें शपथ दिलाती हूँ: तुम प्रेम को क्यों जगाओगी, या क्यों उभारोगी, जब तक प्रेम स्वयं न चाहे?[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इसे इस प्रकार भी समझा जा सकता है: “मैं तुम्हें शपथ दिलाती हूँ कि प्रेम को तब तक न जगाओ, न उभारो, जब तक प्रेम स्वयं न चाहे।” मूल इब्रानी में प्रश्नवाचक रूप है, पर इस शपथ-सूत्र का आशय निषेधात्मक आग्रह के रूप में भी लिया जाता है।'
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי
  choice: मैं तुम्हें शपथ दिलाती हूँ
  rationale: हिफ़िल रूप का अर्थ किसी को शपथ के अधीन करना या गंभीर आग्रह करना है। वक्ता स्त्री है, इसलिए हिन्दी में ‘दिलाती’ स्वाभाविक है।
- source_word: בְּנוֹת יְרוּשָׁלִָם
  choice: हे यरूशलेम की बेटियो
  rationale: काव्यात्मक संबोधन और ‘बेटियों’ की मूल छवि दोनों सुरक्षित रहते हैं।
- source_word: מַה
  choice: क्यों
  rationale: प्रश्नवाचक रूप को सीधे बनाए रखता है; प्रसंग में इसमें निषेध-सदृश गंभीर आग्रह भी सुनाई देता है।
- source_word: תָּעִירוּ וּמַה תְּעֹרְרוּ
  choice: क्यों जगाओ या उकसाओगी
  rationale: समान मूल से आए दो क्रियापदों की काव्यात्मक पुनरुक्ति को दो निकटार्थी हिन्दी क्रियाओं से व्यक्त किया गया है।
- source_word: הָאַהֲבָה
  choice: प्रेम
  rationale: यह प्रेम, प्रेमानुभूति या प्रेमावेग की व्यापकता को अनावश्यक रूप से सीमित नहीं करता।
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: उसके स्वयं चाहने से पहले
  rationale: स्त्रीलिंग क्रिया का संबंध ‘प्रेम’ से है और प्रेम का मानवीकरण करती है। हिन्दी में यह रूप ‘जब तक वह चाहे’ की संभावित कर्ता-अस्पष्टता से बचते हुए वही भाव स्वाभाविक ढंग से देता है।
theological_decisions:
- issue: यह वाक्य प्रश्न है या प्रत्यक्ष निषेध
  choice: 'प्रश्नवाचक रूप: ‘क्यों ...?’'
  alternative: ‘मत जगाओ, न उकसाओ’
  rationale: मूल में מַה प्रश्नवाचक है, यद्यपि पूरे शपथ-सूत्र का व्यावहारिक बल निषेधात्मक आग्रह जैसा है। मुख्य पाठ मूल रूप को रखता है और पादटिप्पणी प्रचलित निषेधात्मक समझ बताती है।
- issue: प्रेम का मानवीकरण
  choice: ‘उसके स्वयं चाहने’ द्वारा प्रेम को इच्छाशील रूप में प्रस्तुत करना
  alternative: ‘जब तक उचित समय न आए’
  rationale: समय-संबंधी अर्थ प्रसंग से निकाला जा सकता है, पर मूल में ‘उचित समय’ नहीं कहा गया; स्त्रीलिंग क्रिया प्रेम से सहमति रखती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और काव्यात्मक हिन्दी। ‘शपथ दिलाती हूँ’ गंभीरता बनाए रखता है; ‘हे ... बेटियो’ गीतात्मक संबोधन को स्वाभाविक रूप देता है।
