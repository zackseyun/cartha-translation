lexical_decisions:
- source_word: הַיּוֹשֶׁבֶת
  choice: हे … रहनेवाली
  rationale: स्त्रीलिंग एकवचन कृदंत यहाँ स्त्री को सीधे संबोधित करता है। ‘रहनेवाली’ निरंतर उपस्थिति का भाव देता है और हिन्दी में ‘बैठनेवाली’ से अधिक स्वाभाविक है।
- source_word: בַּגַּנִּים
  choice: बागों में
  rationale: मूल के बहुवचन को बनाए रखते हुए स्वाभाविक हिन्दी रूप चुना गया है।
- source_word: חֲבֵרִים
  choice: साथी
  rationale: यह शब्द मित्रों या साथियों को सूचित करता है; ‘साथी’ काव्यात्मक और संबंधपरक भाव को बिना अधिक विशिष्ट किए बनाए रखता है।
- source_word: מַקְשִׁיבִים לְקוֹלֵךְ
  choice: तुम्हारी आवाज़ ध्यान से सुन रहे हैं
  rationale: קשׁב का हिफ़ील रूप ध्यान लगाकर सुनने का भाव रखता है। यह अनुवाद उस सजगता को व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: הַשְׁמִיעִינִי
  choice: मुझे भी अपनी आवाज़ सुनाओ
  rationale: स्त्रीलिंग एकवचन हिफ़ील आज्ञार्थक रूप का मूल भाव ‘मुझे सुनने का कारण बनाओ’ है। हिन्दी में ‘मुझे … सुनाओ’ उसी कारक भाव को सहज ढंग से व्यक्त करता है। ‘अपनी आवाज़’ पिछले वाक्यांश से निहित कर्म को स्पष्ट करता है, और ‘भी’ साथियों तथा वक्ता के बीच स्वाभाविक काव्यात्मक संबंध दिखाता है।
