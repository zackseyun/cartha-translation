base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/006.yaml
  text: Set me as a seal upon your heart[a], as a seal upon your arm; for love is as strong as death, jealousy as relentless as Sheol. Its flashes are flashes of fire[c][b], a flame of Yah.
translation:
  language: hi
  text: 'मुझे अपने हृदय पर मुहर के समान,

    अपनी बाँह पर मुहर के समान लगा ले;

    क्योंकि प्रेम मृत्यु के समान प्रबल है,

    ईर्ष्या शिओल के समान अटल है।[a]

    उसकी चिनगारियाँ आग की चिनगारियाँ हैं—

    याह की ज्वाला हैं।[b][c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘शिओल’ मृतकों के लोक के लिए इब्रानी शब्द है। इस पंक्ति का अनुवाद ‘ईर्ष्या कब्र के समान कठोर है’ भी हो सकता है।
    reason: alternative_reading
  - marker: b
    text: इब्रानी शब्द का अनुवाद ‘लपटें’ या ‘अग्निमय कौंधें’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: 'शाब्दिक रूप से ‘याह की ज्वाला’; ‘याह’ परमेश्वर के नाम का संक्षिप्त रूप है। संभव है कि यह पदबंध तीव्रता जताता हो: ‘एक प्रचंड ज्वाला’ या ‘धधकती ज्वाला।’'
    reason: alternative_reading
lexical_decisions:
- source_word: שִׂימֵנִי
  choice: मुझे ... लगा ले
  rationale: दूसरे पुरुष एकवचन पुल्लिंग की आज्ञा और प्रथम पुरुष एकवचन प्रत्यय को सीधे, आत्मीय निवेदन के रूप में व्यक्त करता है। ‘लगा ले’ हृदय और बाँह पर मुहर रखने के रूपक के साथ स्वाभाविक हिन्दी है।
- source_word: כַחוֹתָם
  choice: मुहर के समान
  rationale: חוֹתָם पहचान, स्वामित्व या प्रामाणिकता दर्शाने वाली मुहर अथवा मुहर-अंगूठी हो सकती है। ‘मुहर’ सामान्य पाठक के लिए स्पष्ट है और रूपक को बनाए रखती है।
- source_word: עַל לִבֶּךָ
  choice: अपने हृदय पर
  rationale: मूल रूपक और उसके आत्मीय, भीतरी संकेत को सीधे बनाए रखता है।
- source_word: עַל זְרוֹעֶךָ
  choice: अपनी बाँह पर
  rationale: זְרוֹעַ का सीधा अर्थ ‘बाँह’ है; हृदय और बाँह की समानांतर काव्यात्मक छवि सुरक्षित रखी गई है।
- source_word: כִּי עַזָּה כַמָּוֶת אַהֲבָה
  choice: क्योंकि प्रेम मृत्यु के समान प्रबल है
  rationale: עַזָּה की शक्ति और तीव्रता को ‘प्रबल’ व्यक्त करता है तथा मृत्यु के साथ कठोर तुलना को ज्यों का त्यों रखता है।
- source_word: קָשָׁה כִשְׁאוֹל קִנְאָה
  choice: ईर्ष्या शिओल के समान अटल है
  rationale: קִנְאָה के ईर्ष्या, उत्साह और अधिकारपूर्ण अनुराग के अर्थ-तनाव को ‘ईर्ष्या’ सुरक्षित रखता है। קָשָׁה यहाँ शिओल की न टलने वाली कठोरता दर्शाता है; ‘अटल’ इस संदर्भ में स्वाभाविक है और अनावश्यक रूप से ‘क्रूर’ नहीं जोड़ता।
- source_word: שְׁאוֹל
  choice: शिओल
  rationale: विशिष्ट इब्रानी शब्द को लिप्यंतरित करने से उसका अर्थ केवल कब्र तक सीमित नहीं होता; पादटिप्पणी उसका सामान्य आशय स्पष्ट करती है।
- source_word: רְשָׁפֶיהָ
  choice: उसकी चिनगारियाँ
  rationale: स्त्रीलिंग प्रत्यय पीछे के प्रेम/ईर्ष्या की ओर संकेत करता है। רֶשֶׁף के चिनगारी, ज्वाला या अग्निमय कौंध जैसे अर्थों में ‘चिनगारियाँ’ अगली अग्नि-संबंधी पंक्ति के साथ स्पष्ट और सजीव है।
- source_word: רִשְׁפֵּי אֵשׁ
  choice: आग की चिनगारियाँ
  rationale: मूल की शब्द-पुनरावृत्ति को दोहराकर काव्यात्मक बल बनाए रखा गया है।
- source_word: שַׁלְהֶבֶתְ יָה
  choice: याह की ज्वाला
  rationale: יָה को परमेश्वर के नाम के संक्षिप्त रूप के रूप में स्पष्ट रखा गया है; विवादित अतिशयोक्तिपरक अर्थ पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: क्या שַׁלְהֶבֶתְ יָה में दिव्य नाम का स्पष्ट उल्लेख है या यह केवल उत्कृष्टता/तीव्रता बताने वाला प्रयोग है
  choice: याह की ज्वाला
  alternative: प्रचंड ज्वाला; धधकती ज्वाला
  rationale: इब्रानी पाठ में יָה उपस्थित है, जो दिव्य नाम का संक्षिप्त रूप है। उसे मुख्य पाठ में रखना स्रोत के प्रति पारदर्शी है, जबकि संभावित तीव्रतासूचक अर्थ पादटिप्पणी में सुरक्षित है।
- issue: प्रेम-काव्य में קִנְאָה को ‘ईर्ष्या’ कहा जाए या नरम करके ‘जुनून/अनुराग’
  choice: ईर्ष्या
  alternative: उत्कट अनुराग; जुनून; उत्साह
  rationale: यह संज्ञा विशिष्ट और अधिकारपूर्ण प्रेम की तीव्रता सहित ईर्ष्या या जोश दर्शा सकती है। ‘ईर्ष्या’ पाठ की असहज तीव्रता को मिटाए बिना उसका प्रमुख शाब्दिक अर्थ बचाती है।
- issue: שְׁאוֹל को सामान्य हिन्दी अर्थ में बदलना या इब्रानी नाम बनाए रखना
  choice: शिओल
  alternative: अधोलोक; मृतकों का लोक; कब्र
  rationale: ‘शिओल’ मूल की विशिष्ट धारणा को केवल भौतिक कब्र तक सीमित नहीं करता। सामान्य पाठक के लिए अर्थ पादटिप्पणी में समझाया गया है।
translation_notes:
  register: आधुनिक, dignified काव्यात्मक हिन्दी अपनाई गई है। वक्ता का संबोधन आत्मीय एकवचन पुल्लिंग है, इसलिए ‘लगा ले’ और ‘अपने/अपनी’ का प्रयोग हुआ है। पंक्ति-विन्यास इब्रानी समानांतरता और बढ़ती अग्नि-छवि को उभारता है। ‘शिओल’ और ‘याह’ जैसे स्रोत-विशिष्ट पद मुख्य पाठ में रखकर पादटिप्पणियों में समझाए गए हैं।
