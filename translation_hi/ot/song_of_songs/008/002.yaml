  edition: WLC
  text: אֶנְהָֽגֲ/ךָ֗ אֲבִֽיאֲ/ךָ֛ אֶל בֵּ֥ית אִמִּ֖/י תְּלַמְּדֵ֑/נִי אַשְׁקְ/ךָ֙ מִ/יַּ֣יִן הָ/רֶ֔קַח מֵ/עֲסִ֖יס רִמֹּנִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/002.yaml
  text: I would lead you and bring you into my mother’s house[a], where she taught me; I would give you spiced wine to drink[b], from the juice of my pomegranate.
translation:
  language: hi
  text: मैं तुम्हें ले चलती और अपनी माँ के घर के भीतर ले आती[a], जहाँ वह मुझे सिखाती थी। मैं तुम्हें अपने अनार के रस से बनी मसालेदार मदिरा पिलाती[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम मुझे सिखाते।” इब्रानी में “मुझे सिखाती थी” वाली क्रिया तीसरे पुरुष स्त्रीलिंग एकवचन में है, इसलिए उसका सबसे स्वाभाविक संबंध “मेरी माँ” से है; फिर भी संक्षिप्त काव्य-विन्यास के कारण कुछ लोग इसे अलग तरह से जोड़ते हैं।
    reason: alternative_reading
  - marker: b
    text: या, “मैं तुम्हें अपने अनार की मीठी मदिरा पिलाती।” इब्रानी शब्द का अर्थ ताज़ा रस, मीठा पेय अथवा कच्ची/मीठी मदिरा हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֶנְהָגֲךָ
  choice: मैं तुम्हें ले चलती
  rationale: נהג के क़ाल अपूर्ण 1cs रूप को इस काव्यात्मक संदर्भ में साधारण भविष्य के बजाय इच्छार्थक/संभावनार्थक भाव में लिया गया है। स्त्री वक्ता के कारण हिंदी में 'चलती' स्वाभाविक है।
- source_word: אֲבִיאֲךָ
  choice: और ... घर के भीतर ले आती
  rationale: בוא के हिफ़ील अपूर्ण 1cs में किसी को भीतर लाने का कारक गतिशील अर्थ है; אֶל और घर के संदर्भ में 'भीतर ले आती' स्वाभाविक हिंदी है।
- source_word: בֵּית אִמִּי
  choice: अपनी माँ के घर
  rationale: रचनात्मक संबंध 'मेरी माँ का घर' व्यक्त करता है; हिंदी में कर्ता से संबंध होने के कारण 'अपनी माँ' अधिक स्वाभाविक है।
- source_word: תְּלַמְּדֵנִי
  choice: जहाँ वह मुझे सिखाती थी
  rationale: पिएल अपूर्ण 3fs + 1cs प्रत्यय व्याकरणतः सबसे स्वाभाविक रूप से स्त्रीलिंग 'माँ' की ओर संकेत करता है। संक्षिप्त काव्य-विन्यास को हिंदी में स्थानवाचक उपवाक्य से स्पष्ट किया गया है, जबकि वैकल्पिक संबद्धता पादटिप्पणी में रखी गई है।
- source_word: אַשְׁקְךָ
  choice: मैं तुम्हें ... पिलाती
  rationale: שקה के हिफ़ील रूप का अर्थ किसी को पीने देना/पिलाना है। 'पिलाती' संक्षिप्त, स्वाभाविक और कारक अर्थ के अनुरूप है।
- source_word: מִיַּיִן הָרֶקַח
  choice: मसालेदार दाखमधु
  rationale: यह पद मसालों या सुगंधित द्रव्यों से तैयार किए गए दाखमधु को दर्शाता है। 'मसालेदार दाखमधु' काव्यात्मक छवि और पेय का स्वरूप दोनों बनाए रखता है।
- source_word: מֵעֲסִיס רִמֹּנִי
  choice: अपने अनार का रस
  rationale: עָסִיס ताज़ा रस, मीठा पेय अथवा कच्ची/मीठी मदिरा का अर्थ दे सकता है। मुख्य पाठ में 'रस' फल की छवि को बिना किण्वन निश्चित किए सुरक्षित रखता है; एकवचन और प्रथम पुरुष संबंध को 'अपने अनार' से रखा गया है।
theological_decisions:
- issue: תְּלַמְּדֵנִי का कर्ता
  choice: माँ को कर्ता मानकर 'जहाँ वह मुझे सिखाती थी'
  alternative: '''तुम मुझे सिखाते'''
  rationale: क्रिया 3 स्त्रीलिंग एकवचन है, इसलिए निकटवर्ती 'मेरी माँ' इसका सबसे स्वाभाविक व्याकरणिक पूर्वपद है। फिर भी इब्रानी काव्य-विन्यास संक्षिप्त है, अतः दूसरी संबद्धता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और अंतरंग काव्यात्मक शैली रखी गई है। स्त्री वक्ता को क्रिया-रूपों से स्पष्ट किया गया है। 'दाखमधु' बाइबिलीय काव्य के लिए परिचित और dignified शब्द है; वास्तविक शाब्दिक अस्पष्टताएँ पादटिप्पणियों में सुरक्षित हैं।
