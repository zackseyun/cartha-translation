base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/011.yaml
  text: Solomon had a vineyard at Baal-hamon[a]; he gave the vineyard to keepers[c][b]. Each man was to bring a thousand pieces of silver for its fruit.
translation:
  language: hi
  text: सुलैमान की एक दाख की बारी बाल-हामोन में थी। उसने वह दाख की बारी रखवालों को सौंप दी। हर एक को उसके फल के बदले चाँदी के एक हज़ार टुकड़े[a] लाने थे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल इब्रानी में शाब्दिक रूप से ‘एक हज़ार चाँदी’ है; चाँदी की कोई निश्चित इकाई नहीं बताई गई है।
    reason: cultural_note
lexical_decisions:
- source_word: כֶּרֶם
  choice: दाख की बारी
  rationale: यह शब्द किसी एक लता नहीं, बल्कि अंगूर उगाने के पूरे बाग को दर्शाता है; ‘दाख की बारी’ हिन्दी बाइबलीय परंपरा में परिचित और अर्थ की दृष्टि से सटीक है।
- source_word: הָיָה לִשְׁלֹמֹה
  choice: सुलैमान की ... थी
  rationale: शाब्दिक रचना ‘सुलैमान के लिए थी’ स्वामित्व का इब्रानी मुहावरा है; हिन्दी में संबंधकारक रचना स्वाभाविक रूप से वही अर्थ देती है।
- source_word: בְּבַעַל הָמוֹן
  choice: बाल-हामोन में
  rationale: इसे स्थान-नाम मानकर लिप्यंतरित किया गया है; בְ का स्थानवाचक अर्थ ‘में’ से स्वाभाविक रूप में व्यक्त होता है।
- source_word: נָתַן אֶת־הַכֶּרֶם לַנֹּטְרִים
  choice: उसने वह दाख की बारी रखवालों को सौंप दी
  rationale: נתן का मूल अर्थ ‘देना’ है, पर इस कृषि-आर्थिक प्रसंग में बारी को निगरानी या प्रबंधन के लिए सौंपना अभिप्रेत है। ‘सौंप दी’ इस कार्यगत अर्थ को व्यक्त करता है, बिना किसी विशिष्ट कानूनी पट्टे का दावा किए।
- source_word: לַנֹּטְרִים
  choice: रखवालों को
  rationale: נטר में रखने, निगरानी करने और रक्षा करने का भाव है। ‘रखवाले’ इन पहलुओं को समेटता है और दाख की बारी के प्रसंग में सहज है।
- source_word: אִישׁ
  choice: हर एक
  rationale: यहाँ एकवचन का प्रयोग वितरणात्मक है और प्रत्येक रखवाले को अलग-अलग इंगित करता है। हिन्दी में ‘हर एक’ लिंग को अनावश्यक रूप से प्रमुख किए बिना इसी अर्थ को स्पष्ट करता है।
- source_word: יָבִא
  choice: लाने थे
  rationale: अपूर्ण क्रिया यहाँ व्यवस्था के अनुसार अपेक्षित या बाध्यकारी कार्य को दर्शाती है; ‘लाने थे’ आज्ञा को बढ़ा-चढ़ाकर बताए बिना अपेक्षा व्यक्त करता है।
- source_word: בְּפִרְיוֹ
  choice: उसके फल के बदले
  rationale: सर्वनामिक प्रत्यय का सबसे निकट और स्वाभाविक संदर्भ दाख की बारी है। בְ को आर्थिक संबंध के प्रसंग में ‘के बदले’ कहना भुगतान और उपज के संबंध को स्पष्ट करता है; ‘उसके’ की संभावित संदर्भ-अस्पष्टता मूल के अनुरूप बनी रहती है।
- source_word: אֶלֶף כָּסֶף
  choice: चाँदी के एक हज़ार टुकड़े
  rationale: इब्रानी में केवल ‘एक हज़ार चाँदी’ है और कोई निश्चित इकाई नहीं दी गई। ‘टुकड़े’ अर्थपूर्ण हिन्दी देता है, पर ‘शेकेल’ या ‘सिक्के’ जैसी अनुल्लिखित इकाई नहीं जोड़ता।
