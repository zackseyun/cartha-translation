  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מִ֤י יִתֶּנְ/ךָ֙ כְּ/אָ֣ח לִ֔/י יוֹנֵ֖ק שְׁדֵ֣י אִמִּ֑/י אֶֽמְצָאֲ/ךָ֤ בַ/חוּץ֙ אֶשָׁ֣קְ/ךָ֔ גַּ֖ם לֹא יָב֥וּזוּ לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/001.yaml
  text: Oh[a], that you were like a brother to me, who nursed at my mother’s breasts! If I found you outside, I would kiss you[c][b], and no one would despise me.
translation:
  language: hi
  text: 'काश[a] तुम मेरे भाई जैसे होते,

    जो मेरी माँ की छातियों से दूध पीता था![b]

    यदि मैं तुम्हें बाहर पाती,

    तो तुम्हें चूम लेती,

    और कोई मेरा तिरस्कार न करता।[c]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भला कौन तुम्हें मेरे भाई जैसा बना देता!” इब्रानी का आरम्भिक मुहावरा प्रबल इच्छा व्यक्त करता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात ऐसा भाई, जिसने उसी माँ का दूध पिया हो; भाई के प्रति सार्वजनिक स्नेह दिखाना सामाजिक रूप से स्वीकार्य होता।
    reason: cultural_note
  - marker: c
    text: इब्रानी में शाब्दिक रूप से, “वे मेरा तिरस्कार न करते।” यहाँ अनिश्चित बहुवचन सामान्य लोगों की प्रतिक्रिया को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי יִתֶּנְךָ
  choice: काश तुम…होते
  rationale: यह इब्रानी मुहावरा शाब्दिक प्रश्न नहीं, बल्कि प्रबल इच्छा व्यक्त करता है। ‘काश’ आधुनिक हिन्दी में इस इच्छार्थक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כְּאָח לִי
  choice: मेरे भाई जैसे
  rationale: כְּ तुलना को सूचित करता है, वास्तविक भाई होने को नहीं। हिन्दी में ‘मेरे भाई जैसे’ तुलना और व्यक्तिगत संबंध, दोनों को सहज रूप से रखता है।
- source_word: יוֹנֵק שְׁדֵי אִמִּי
  choice: जो मेरी माँ की छातियों से दूध पीता था
  rationale: यह अनुवाद मूल के कृदन्त और ठोस मातृ-चित्र को बनाए रखता है। भूतकालीन ‘पीता था’ हिन्दी में साझा शैशव और दूध पिलाए जाने के आशय को स्वाभाविक बनाता है।
- source_word: אֶמְצָאֲךָ בַחוּץ
  choice: यदि मैं तुम्हें बाहर पाती
  rationale: अपूर्ण क्रिया यहाँ काल्पनिक परिस्थिति में उचित है। ‘बाहर’ सार्वजनिक स्थान का व्यापक अर्थ रखता है और मूल से अधिक विशिष्ट नहीं होता।
- source_word: אֶשָׁקְךָ
  choice: तो तुम्हें चूम लेती
  rationale: ‘चूमना’ क्रिया का सीधा अर्थ है; ‘लेती’ पूर्ववर्ती काल्पनिक शर्त के अनुरूप संभाव्य भाव व्यक्त करता है।
- source_word: גַּם לֹא יָבֻזוּ לִי
  choice: और कोई मेरा तिरस्कार न करता
  rationale: मूल का अनिश्चित बहुवचन सामान्य जनमत को दर्शाता है। हिन्दी में ‘कोई…न करता’ वही अर्थ सहज ढंग से देता है, जबकि तिरस्कार का सामाजिक भाव बना रहता है।
theological_decisions:
- issue: प्रेम-काव्य में भाई की उपमा
  choice: भाई की उपमा को सामाजिक रूप से स्वीकार्य सार्वजनिक स्नेह की इच्छा के रूप में यथावत रखना
  alternative: उपमा को हटाकर केवल सार्वजनिक प्रेम व्यक्त करना, अथवा इसे वास्तविक रक्त-संबंध मानना
  rationale: मूल पाठ प्रेमी को वास्तविक भाई नहीं कहता, बल्कि भाई ‘जैसा’ होने की इच्छा व्यक्त करता है। इससे सार्वजनिक चुंबन पर तिरस्कार न होने की सांस्कृतिक-सामाजिक पृष्ठभूमि सामने आती है; अनुवाद इससे आगे कोई नैतिक या सिद्धान्तगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक गरिमा वाली रखी गई है। ‘छातियों’ मूल के स्पष्ट शारीरिक चित्र को बिना शिष्टोक्ति द्वारा धुँधला किए व्यक्त करता है; पंक्ति-विन्यास इच्छा, काल्पनिक भेंट और सामाजिक परिणाम की गति को उभारता है।
