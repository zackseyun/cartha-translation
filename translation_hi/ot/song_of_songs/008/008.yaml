base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/008.yaml
  text: We have a little sister[a], and she has no breasts. What shall we do for our sister on the day when she is spoken for?
translation:
  language: hi
  text: हमारी एक छोटी बहन है, और उसके स्तन नहीं हैं। जिस दिन उसके लिए विवाह की बात की जाएगी[a], उस दिन हम अपनी बहन के लिए क्या करें?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जिस दिन उसके बारे में बात की जाएगी।” इब्रानी पाठ सामान्य रूप से उसके विषय में चर्चा किए जाने का संकेत दे सकता है, हालाँकि प्रसंग में संभवतः विवाह की बातचीत अभिप्रेत है।
    reason: alternative_reading
lexical_decisions:
- source_word: אָחוֹת לָנוּ
  choice: हमारी एक ... बहन है
  rationale: इब्रानी रचना का शाब्दिक भाव ‘हमारे लिए/हमारी एक बहन है’ है। यह हिन्दी प्रयोग स्वाभाविक ढंग से पारिवारिक संबंध और प्रथम पुरुष बहुवचन दोनों बनाए रखता है।
- source_word: קְטַנָּה
  choice: छोटी
  rationale: यह विशेषण आकार या कम आयु दोनों का संकेत दे सकता है। ‘छोटी’ हिन्दी में आयु और परिवार में कनिष्ठ होने का भाव स्वाभाविक रूप से रखता है, बिना निश्चित आयु बताए।
- source_word: וְשָׁדַיִם אֵין לָהּ
  choice: और उसके स्तन नहीं हैं
  rationale: इब्रानी कथन सीधा और ठोस है—‘उसके स्तन नहीं हैं।’ इसे नरम करके ‘विकसित नहीं हुए’ कहना पाठ में निहित शारीरिक अपरिपक्वता की व्याख्या को मूल शब्दों में जोड़ देता।
- source_word: מַה נַּעֲשֶׂה
  choice: हम ... क्या करेंगे?
  rationale: प्रथम पुरुष बहुवचन अपूर्ण क्रिया यहाँ विचार-विमर्श या भावी योजना व्यक्त करती है। हिन्दी का भविष्यकाल प्रश्न इस भाव को सहजता से व्यक्त करता है।
- source_word: לַאֲחֹתֵנוּ
  choice: अपनी बहन के लिए
  rationale: ל उपसर्ग यहाँ बहन के हित में किए जाने वाले कार्य का भाव देता है; ‘के लिए’ इसे स्पष्ट और स्वाभाविक रखता है।
- source_word: בַּיּוֹם
  choice: जिस दिन ... उस दिन
  rationale: यह रचना इब्रानी के स्पष्ट कालवाचक ‘दिन’ को बनाए रखते हुए हिन्दी में वाक्य को स्वाभाविक बनाती है।
- source_word: שֶׁיְדֻבַּר בָּהּ
  choice: उसके विवाह की बात चलेगी
  rationale: निष्क्रिय דּבר के साथ ב का सामान्य अर्थ उसके विषय में बात किया जाना हो सकता है। प्रसंग में विवाह संबंधी बातचीत संभावित है; हिन्दी मुहावरा ‘विवाह की बात चलना’ उस संभावित आशय को स्पष्ट करता है, जबकि व्यापक शाब्दिक संभावना पादटिप्पणी में सुरक्षित है।
