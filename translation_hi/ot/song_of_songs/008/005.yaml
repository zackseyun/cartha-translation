source:
  edition: WLC
  text: מִ֣י זֹ֗את עֹלָה֙ מִן הַ/מִּדְבָּ֔ר מִתְרַפֶּ֖קֶת עַל דּוֹדָ֑/הּ תַּ֤חַת הַ/תַּפּ֨וּחַ֙ עֽוֹרַרְתִּ֔י/ךָ שָׁ֚מָּ/ה חִבְּלַ֣תְ/ךָ אִמֶּ֔/ךָ שָׁ֖מָּ/ה חִבְּלָ֥ה יְלָדַֽתְ/ךָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/005.yaml
  text: Who is this coming up from the wilderness[a], leaning on her beloved? Under the apple tree I awakened you; there your mother was in labor with you[c][b]; there she who bore you was in labor.
translation:
  language: hi
  text: 'यह कौन है जो निर्जन प्रदेश से ऊपर आती हुई,

    अपने प्रिय पर टिकी हुई है?


    सेब के पेड़[a] के नीचे मैंने तुम्हें जगाया था।[b][c]

    वहीं तुम्हारी माँ तुम्हें जन्म देते समय प्रसव-पीड़ा में थी;

    वहीं तुम्हें जन्म देनेवाली प्रसव-पीड़ा में थी।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या संभवतः, “खुबानी का पेड़”; इब्रानी शब्द से सूचित वृक्ष की ठीक प्रजाति निश्चित नहीं है, यद्यपि “सेब का पेड़” पारंपरिक अनुवाद है।
    reason: lexical_alternative
  - marker: b
    text: “मैंने तुम्हें जगाया” का अनुवाद “मैंने तुम्हें उद्दीप्त किया” भी हो सकता है। प्रेम-काव्य के इस संदर्भ में इब्रानी क्रिया में साधारण जगाने से अधिक अर्थच्छाया हो सकती है।
    reason: alternative_reading
  - marker: c
    text: इस पद के बीच में वाणी प्रेक्षक के वर्णन से सीधे संबोधन की ओर बदलती जान पड़ती है, पर इब्रानी में वक्ता की पहचान स्पष्ट नहीं है।
    reason: alternative_reading
lexical_decisions:
- source_word: עֹלָה
  choice: चली आ रही है
  rationale: עלה का कृदन्त ऊपर जाने या किसी ओर आते हुए चढ़ने की गति व्यक्त करता है। हिंदी में ‘चली आ रही है’ दृश्य की गतिशीलता को स्वाभाविक रूप से रखता है; स्थलाकृतिक ‘ऊपर’ को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: הַמִּדְבָּר
  choice: निर्जन प्रदेश
  rationale: מִדְבָּר केवल रेतीला मरुस्थल नहीं, बल्कि असिंचित और विरल आबादी वाला वन्य क्षेत्र भी हो सकता है। ‘निर्जन प्रदेश’ इस व्यापक अर्थ को सुरक्षित रखता है।
- source_word: מִתְרַפֶּקֶת עַל
  choice: का सहारा लिए हुए
  rationale: दुर्लभ रूप निकट शारीरिक लगाव अथवा किसी पर टिकने का बोध देता है। यह चयन प्रेमपूर्ण निकटता और सहारे—दोनों को सहज हिंदी में व्यक्त करता है।
- source_word: דּוֹדָהּ
  choice: अपने प्रिय
  rationale: गीतश्रेष्ठ में דּוֹד पुरुष प्रेमी के लिए अनुरागपूर्ण संबोधन है। ‘प्रिय’ स्वाभाविक, गरिमापूर्ण और प्रसंगानुकूल है।
- source_word: תַּחַת הַתַּפּוּחַ
  choice: सेब के पेड़ के नीचे
  rationale: תַּפּוּחַ का पारंपरिक अनुवाद ‘सेब’ है, यद्यपि वृक्ष की ठीक प्रजाति अनिश्चित है; अनिश्चितता पादटिप्पणी में दी गई है।
- source_word: עוֹרַרְתִּיךָ
  choice: मैंने तुम्हें जगाया था
  rationale: עור का अर्थ जगाना अथवा उद्दीप्त करना हो सकता है। ‘जगाया’ मूल अर्थ को रखता है और प्रेम-काव्य में संभव अतिरिक्त संकेत को पादटिप्पणी द्वारा खुला छोड़ता है।
- source_word: חִבְּלַתְךָ
  choice: तुम्हें जनते समय प्रसव-पीड़ा हुई थी
  rationale: חבל यहाँ प्रसव के समय तड़पने या पीड़ा उठाने को सूचित करता है। यह हिंदी अभिव्यक्ति मातृ-प्रसव के संदर्भ को स्पष्ट रखते हुए ‘गर्भधारण’ जैसे कम संभावित अर्थ से बचती है।
- source_word: יְלָדַתְךָ
  choice: तुम्हें जन्म देनेवाली
  rationale: ילד स्पष्ट रूप से जन्म देने को दर्शाता है। कृदन्तीय हिंदी रूप दूसरे समानांतर चरण में माँ का पुनः वर्णन स्वाभाविक ढंग से करता है।
- source_word: שָׁמָּה ... שָׁמָּה
  choice: वहीं ... वहीं
  rationale: दोहराव को रखकर इब्रानी काव्य का स्थानगत बल और समानांतरता सुरक्षित की गई है।
theological_decisions:
- issue: पद के मध्य वक्ता और संबोधित व्यक्ति का संभावित परिवर्तन
  choice: आरंभ को तीसरे पुरुष का वर्णनात्मक प्रश्न और बाद के भाग को दूसरे पुरुष का सीधा संबोधन रखा गया है।
  alternative: पूरे पद को एक ही प्रेक्षक-वक्ता का कथन मानना, अथवा स्त्री द्वारा पुरुष को अधिक स्पष्ट कामोत्तेजक अर्थ में संबोधित मानना।
  rationale: इब्रानी पाठ ‘उसके प्रिय’ से ‘मैंने तुम्हें’ और ‘तुम्हारी माँ’ की ओर जाता है। वक्ता की पहचान स्पष्ट नहीं है, इसलिए अनुवाद इस काव्यात्मक परिवर्तन को बनाए रखता है, पर किसी एक पहचान को निश्चित नहीं करता।
- issue: עוֹרַרְתִּיךָ में प्रेम-काव्य संबंधी अर्थच्छाया
  choice: मुख्य पाठ में ‘जगाया’ और पादटिप्पणी में ‘उद्दीप्त किया’ की संभावना।
  alternative: मुख्य पाठ में ही ‘उद्दीप्त किया’ अथवा अधिक स्पष्ट कामुक शब्दावली।
  rationale: क्रिया में साधारण जागरण और प्रेमपूर्ण उद्दीपन दोनों की संभावना है। मुख्य पाठ में किसी विशेष कामुक व्याख्या को आरोपित किए बिना वास्तविक अर्थगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण काव्यात्मक गद्य-पद्य रजिस्टर अपनाया गया है। ‘निर्जन प्रदेश’, ‘सहारा लिए हुए’ और ‘प्रसव-पीड़ा’ सामान्य पाठक के लिए स्पष्ट हैं। मूल की पंक्ति-समानांतरता, ‘वहीं’ का दोहराव, प्रत्यक्ष संबोधन और वक्ता-संबंधी अस्पष्टता बनाए रखी गई है।
