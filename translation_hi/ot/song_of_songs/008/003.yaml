  text: His left hand is under my head[a], and his right hand embraces me.
translation:
  language: hi
  text: उसका बायाँ हाथ मेरे सिर के नीचे है,[a] और उसका दायाँ हाथ मुझे गले लगाए हुए है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “उसका बायाँ ... और उसका दायाँ” है; जोड़ीदार अभिव्यक्तियों के भाव के अनुसार हिन्दी में “हाथ” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: उसका बायाँ हाथ
  rationale: शब्द का अर्थ बाईं ओर अथवा बायाँ हाथ हो सकता है। आलिंगन के प्रसंग में आधुनिक हिन्दी में ‘बायाँ हाथ’ स्वाभाविक है; ‘बाँह’ प्रसंगानुकूल तो है, पर मूल शब्द में उतनी स्पष्ट नहीं।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह स्थान-सूचक संबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: רֹאשִׁי
  choice: मेरे सिर
  rationale: संज्ञा और प्रथम पुरुष एकवचन प्रत्यय का सीधा अनुवाद।
- source_word: וִימִינוֹ
  choice: और उसका दायाँ हाथ
  rationale: मूल में ‘और उसका दायाँ [भाग/हाथ]’ है। समानांतर अभिव्यक्ति और आलिंगन के प्रसंग के कारण हिन्दी में ‘हाथ’ स्पष्ट करना स्वाभाविक है।
- source_word: תְּחַבְּקֵנִי
  choice: मुझे गले लगाए हुए है
  rationale: חבק का अर्थ आलिंगन करना है। यह रूप चल रहे स्नेहपूर्ण आलिंगन का स्वाभाविक, वर्तमानकालीन हिन्दी वर्णन देता है; ‘कसकर पकड़े’ अनावश्यक रूप से अधिक व्याख्यात्मक होता।
