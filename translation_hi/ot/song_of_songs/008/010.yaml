  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। मूल की वास्तुशिल्पीय तथा शारीरिक उपमाओं को स्पष्ट रूप से सुरक्षित रखा गया है; अंतिम पदबंध की वास्तविक अर्थगत व्यापकता को मुख्य पाठ में संकीर्ण किए बिना पाद-टिप्पणी में दर्शाया गया है।
