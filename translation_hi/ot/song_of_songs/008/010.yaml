  yaml_path: translation/ot/song_of_songs/008/010.yaml
  text: I am a wall[a], and my breasts are like towers; then I was in his eyes like one who finds peace.
translation:
  language: hi
  text: 'मैं एक दीवार हूँ,

    और मेरे स्तन मीनारों के समान हैं।

    तब मैं उसकी दृष्टि में

    शांति पानेवाली के समान थी।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कुशलता पानेवाली” अथवा “अनुग्रह पानेवाली।” इब्रानी अभिव्यक्ति में शांति के साथ-साथ कुशलता, संपूर्णता या अनुकूल स्वीकृति पाने का व्यापक भाव भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: दीवार
  rationale: यह संज्ञा नगर या रक्षा की दीवार को सूचित कर सकती है। ‘दीवार’ रूपक की सरलता और दृढ़ता को बिना अनावश्यक सैन्य अर्थ जोड़े बनाए रखती है।
- source_word: שָׁדַי
  choice: मेरे स्तन
  rationale: इब्रानी शब्द स्त्री के स्तनों का स्पष्ट उल्लेख करता है; यह सीधा और स्वाभाविक अनुवाद कविता की शारीरिक उपमा को सुरक्षित रखता है।
- source_word: כַּמִּגְדָּלוֹת
  choice: मीनारों के समान
  rationale: बहुवचन वास्तुशिल्पीय उपमा को स्पष्ट रूप से व्यक्त करता है और ‘दीवार’ के रूपक के साथ स्वाभाविक रूप से जुड़ता है।
- source_word: אָז
  choice: तब
  rationale: यह शब्द समय अथवा परिणाम की ओर संक्रमण दर्शाता है; ‘तब’ दोनों संभावनाओं को संक्षेप में बनाए रखता है।
- source_word: הָיִיתִי
  choice: मैं … थी
  rationale: यहाँ क्रिया को स्थिति बताने वाले सामान्य भूतकाल के रूप में रखा गया है; ‘हो गई’ कहने से ऐसा आरंभिक या परिवर्तनकारी भाव जुड़ सकता है जो इब्रानी में अनिवार्य नहीं है।
- source_word: בְעֵינָיו
  choice: उसकी दृष्टि में
  rationale: यह इब्रानी मुहावरे का स्वाभाविक हिन्दी रूप है और किसी व्यक्ति की निगाह या आकलन में होने का अर्थ देता है।
- source_word: כְּמוֹצְאֵת
  choice: पानेवाली के समान
  rationale: स्त्रीलिंग एकवचन कृदंत का अर्थ सबसे स्वाभाविक रूप से ‘पानेवाली’ या ‘ढूँढ़ पानेवाली’ है। ‘पानेवाली’ हिन्दी में सहज है और प्राप्ति के भाव को बनाए रखता है।
- source_word: שָׁלוֹם
  choice: शांति
  rationale: ‘शालोम’ के लिए ‘शांति’ सबसे परिचित और संक्षिप्त विकल्प है, जबकि उसके व्यापक अर्थ—कुशलता, संपूर्णता या अनुग्रह—टिप्पणी में सुरक्षित रखे गए हैं।
