id: SNG.8.7
reference: Song of Songs 8:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: מַ֣יִם רַבִּ֗ים לֹ֤א יֽוּכְלוּ֙ לְ/כַבּ֣וֹת אֶת הָֽ/אַהֲבָ֔ה וּ/נְהָר֖וֹת לֹ֣א יִשְׁטְפ֑וּ/הָ אִם יִתֵּ֨ן אִ֜ישׁ אֶת כָּל ה֤וֹן בֵּית/וֹ֙ בָּ/אַהֲבָ֔ה בּ֖וֹז יָב֥וּזוּ לֽ/וֹ־־־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/007.yaml
  text: Many waters cannot quench love[a], nor can rivers sweep it away. If a man were to give all the wealth of his house for love, he would be utterly despised.
translation:
  language: hi
  text: 'बहुत जल प्रेम को बुझा नहीं सकता,

    न नदियाँ उसे बहा ले जा सकती हैं।

    यदि कोई पुरुष प्रेम के लिए

    अपने घर की सारी संपत्ति दे दे,

    तो उसका घोर तिरस्कार किया जाएगा।[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक रूप से: “वे निश्चय ही उसका तिरस्कार करेंगे।” इब्रानी में क्रिया के साथ उसी धातु का भाववाचक रूप रखकर तिरस्कार पर विशेष बल दिया गया है।'
    reason: source_form_and_emphasis
lexical_decisions:
- source_word: מַיִם רַבִּים
  choice: बहुत जल
  rationale: काव्यात्मक बिंब को यथासंभव सीधे रूप में रखता है और इसे केवल ‘बाढ़’ मानकर अर्थ सीमित नहीं करता।
- source_word: לֹא יוּכְלוּ לְכַבּוֹת
  choice: बुझा नहीं सकता
  rationale: כבה आग बुझाने के लिए प्रयुक्त होता है; यह 8:6 में प्रेम की ज्वाला और यहाँ जल के बीच काव्यात्मक विरोध को बनाए रखता है।
- source_word: הָאַהֲבָה
  choice: प्रेम
  rationale: यह संज्ञा सीधे प्रेम को सूचित करती है; हिन्दी में भाववाचक संज्ञा के साथ किसी अतिरिक्त निश्चितता-सूचक शब्द की आवश्यकता नहीं है।
- source_word: וּנְהָרוֹת
  choice: न नदियाँ
  rationale: समानांतर नकारात्मक पंक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और ‘जल’ से ‘नदियों’ की ओर बढ़ते बिंब को बनाए रखता है।
- source_word: לֹא יִשְׁטְפוּהָ
  choice: उसे बहा ले जा सकती हैं
  rationale: שטף के बाढ़ में बहा देने अथवा अभिभूत कर देने के प्रबल भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: אִם יִתֵּן אִישׁ
  choice: यदि कोई पुरुष ... दे दे
  rationale: काल्पनिक शर्त को हिन्दी के संभावनार्थक रूप में व्यक्त करता है और אִישׁ के पुल्लिंग संदर्भ को बनाए रखता है।
- source_word: כָּל הוֹן בֵּיתוֹ
  choice: अपने घर की सारी संपत्ति
  rationale: הוֹן का अर्थ धन-संपत्ति है और בֵּיתוֹ यहाँ व्यक्ति के घर अथवा गृहस्थी की संपदा को दर्शाता है।
- source_word: בָּאַהֲבָה
  choice: प्रेम के लिए
  rationale: पूर्वसर्ग के विनिमय अथवा प्राप्ति के भाव को संक्षेप में रखता है, पर यह अनावश्यक रूप से तय नहीं करता कि प्रेम खरीदा जा रहा है या प्रेम की खातिर धन दिया जा रहा है।
- source_word: בּוֹז יָבֻזוּ לוֹ
  choice: उसका घोर तिरस्कार किया जाएगा
  rationale: अनिश्चित बहुवचन कर्ता को हिन्दी में स्वाभाविक कर्मवाच्य से व्यक्त किया गया है; ‘घोर’ infinitive absolute और finite verb से आए तीव्र बल को दर्शाता है।
