translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी अपनाई गई है। मूल की काव्यात्मक समानांतरता बनाए रखने के लिए पद्य-पंक्तियाँ अलग रखी गई हैं। ‘बहुत जल’ थोड़ा काव्यात्मक है, पर सामान्य पाठक के लिए स्पष्ट है।
