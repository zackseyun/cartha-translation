source:
  edition: WLC
  text: אִם חוֹמָ֣ה הִ֔יא נִבְנֶ֥ה עָלֶ֖י/הָ טִ֣ירַת כָּ֑סֶף וְ/אִם דֶּ֣לֶת הִ֔יא נָצ֥וּר עָלֶ֖י/הָ ל֥וּחַ אָֽרֶז־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/009.yaml
  text: If she is a wall[a], we will build on her a battlement of silver; but if she is a door[b], we will enclose her with a board of cedar.
translation:
  language: hi
  text: यदि वह दीवार हो, तो हम उसके ऊपर चाँदी की बुर्जी[a] बनाएँगे; और यदि वह द्वार हो, तो हम उस पर देवदार का तख़्ता लगा देंगे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चाँदी की किलेबंदी” अथवा “चाँदी का मीनारनुमा भाग।” इब्रानी पद किसी किलेनुमा या मीनारनुमा वास्तु-रचना को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “हम उसे देवदार के तख़्ते से बंद कर देंगे/सुरक्षित करेंगे।” इब्रानी क्रिया में घेरने, रोकने या पहरा देकर सुरक्षित रखने का भाव हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חוֹמָה
  choice: दीवार
  rationale: मूल शब्द का सामान्य अर्थ ‘दीवार’ है। यह रूपक को बनाए रखता है और दृढ़ता अथवा दुर्गमता का अर्थ पाठक पर थोपे बिना संकेतित रहने देता है।
- source_word: נִבְנֶה
  choice: हम ... बनाएँगे
  rationale: בנה के प्रथम पुरुष बहुवचन अपूर्ण रूप को इस शर्तीय संदर्भ में साधारण भविष्य के रूप में स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: טִירַת כָּסֶף
  choice: चाँदी की बुर्जी
  rationale: טִירָה यहाँ किलेबंदी से जुड़ी मीनारनुमा वास्तु-रचना को सूचित कर सकता है। ‘बुर्जी’ दीवार के समानांतर स्थापत्य बिंब को बनाए रखती है; ‘महल’ भी शब्द का संभावित अर्थ है, पर इस संदर्भ में कम उपयुक्त है।
- source_word: דֶּלֶת
  choice: द्वार
  rationale: मूल संज्ञा का सामान्य अर्थ दरवाज़ा अथवा द्वार है। ‘द्वार’ काव्यात्मक गरिमा और स्थापत्य-बिंब दोनों को सहज रूप से बनाए रखता है।
- source_word: נָצוּר
  choice: हम ... घेर देंगे
  rationale: צור यहाँ घेरने, बंद करने, रोकने या सुरक्षित करने का भाव दे सकता है। ‘घेर देंगे’ मूल की क्रियात्मक अस्पष्टता को अपेक्षाकृत सुरक्षित रखता है और देवदार के तख़्ते के साथ स्वाभाविक है।
- source_word: לוּחַ אָרֶז
  choice: देवदार का तख़्ता
  rationale: לוּחַ पटरे, तख़्ते या फलक को दर्शाता है। ‘देवदार का तख़्ता’ ठोस निर्माण-सामग्री के बिंब को स्पष्ट और सामान्य हिन्दी में व्यक्त करता है।
- source_word: עָלֶיהָ
  choice: उस पर / उसे
  rationale: पहले खंड में על का स्थानगत भाव ‘उस पर’ से रखा गया है। दूसरे खंड में हिन्दी क्रिया ‘घेरना’ के साथ कर्म ‘उसे’ अधिक स्वाभाविक है, जबकि मूल का वास्तु-संबंध बना रहता है।
- source_word: וְאִם
  choice: लेकिन यदि
  rationale: וְ का मूल अर्थ ‘और’ है, पर यहाँ दो वैकल्पिक शर्तों का विरोध है; ‘लेकिन यदि’ इस अंतर को आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: दीवार और द्वार के रूपकों का आशय
  choice: रूपकों को बिना व्याख्यात्मक विस्तार के यथावत रखा गया है।
  alternative: इन्हें स्पष्ट रूप से युवती की शील-रक्षा, दृढ़ता या उपलब्धता के अर्थ में समझाकर अनुवाद करना।
  rationale: पद स्वयं रूपक के नैतिक अथवा सामाजिक आशय को खुलकर नहीं बताता। किसी एक व्याख्या को मुख्य पाठ में डालना मूल की काव्यात्मक और धार्मिक-साहित्यिक अस्पष्टता को अनावश्यक रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में काव्यात्मक परंतु सहज शैली रखी गई है। ‘बुर्जी’ स्थापत्य-बिंब को संक्षिप्त रूप में व्यक्त करती है; उसकी संभावित अपरिचितता और मूल पद की व्यापक अर्थ-सीमा को पादटिप्पणी स्पष्ट करती है। सभी स्त्रीलिंग संकेतों को ‘वह/उस’ से सुरक्षित रखा गया है।
