translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘दाख की बारी’ प्रचलित बाइबलीय कृषि-बिंब को बनाए रखता है। संख्याओं के साथ मूल में अनुपस्थित ‘चाँदी के सिक्के’ या ‘शेकेल’ नहीं जोड़े गए हैं।
