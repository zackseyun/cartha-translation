base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/012.yaml
  text: My vineyard[a], my very own, is before me. The thousand is for you, Solomon[b], and two hundred for those who keep its fruit.
translation:
  language: hi
  text: मेरी अपनी दाख की बारी[a] मेरे सामने[b] है। हे सुलैमान, वह हज़ार तुम्हारे लिए है, और उसके फल की रखवाली करनेवालों के लिए दो सौ हैं।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘दाख की बारी’ यहाँ स्त्री स्वयं या जो उसका अपना है, उसका रूपक भी हो सकती है; मुख्य पाठ में इस बिंब को खुला रखा गया है।
    reason: metaphorical_ambiguity
  - marker: b
    text: ‘मेरे सामने’ का अर्थ ‘मेरी देखरेख में’ या ‘मेरे अधिकार में’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּרְמִי שֶׁלִּי
  choice: मेरी अपनी दाख की बारी
  rationale: כֶּרֶם का सामान्य अर्थ ‘दाख की बारी’ है; שֶׁלִּי अधिकार पर बल देता है। यह अनुवाद काव्यात्मक रूपक को समझाकर सीमित करने के बजाय सुरक्षित रखता है।
- source_word: לְפָנָי
  choice: मेरे सामने
  rationale: इसका शाब्दिक अर्थ ‘मेरे सामने’ है। प्रसंग में यह अपने अधिकार या देखरेख में होने का संकेत भी दे सकता है, इसलिए मुख्य पाठ में इसकी काव्यात्मक अस्पष्टता रखी गई है।
- source_word: הָאֶלֶף
  choice: वह हज़ार
  rationale: इब्रानी में इस पद में मुद्रा का नाम नहीं, केवल निश्चित पद ‘वह हज़ार’ है। पिछले पद के कारण चाँदी की राशि समझी जा सकती है, पर उसे मुख्य पाठ में जोड़ा नहीं गया।
- source_word: לְךָ שְׁלֹמֹה
  choice: हे सुलैमान, ... तुम्हारे लिए
  rationale: לְ आवंटन या अधिकार दर्शाता है और सुलैमान को सीधे संबोधित किया गया है। हिंदी में संबोधन को वाक्य के आरंभिक भाग में रखना स्वाभाविक है।
- source_word: וּמָאתַיִם
  choice: और दो सौ
  rationale: मूल में केवल संख्या दी गई है; मुद्रा का नाम यहाँ भी नहीं जोड़ा गया।
- source_word: לְנֹטְרִים אֶת־פִּרְיוֹ
  choice: उसके फल की रखवाली करनेवालों के लिए
  rationale: נטר का अर्थ रक्षा या रखवाली करना है और פְּרִי फल अथवा उपज को दर्शाता है। ‘उसके’ का संकेत दाख की बारी की ओर है।
