base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/008/014.yaml
  text: Flee[a], my beloved[c][b], and be like a gazelle or a young stag on the mountains of spices.
translation:
  language: hi
  text: भाग जा[a], मेरे प्रिय, और सुगंध-द्रव्यों के पहाड़ों पर चिकारे या नर-हिरन के बच्चे जैसा हो जा।[c]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूर भाग जा।” इब्रानी क्रिया का मूल अर्थ “भागना” है; यहाँ प्रेम-काव्य की छवि में संभवतः भयभीत पलायन के बजाय तीव्र गति पर बल है।
    reason: lexical_alternative
  - marker: c
    text: श्रेष्ठगीत 2:17 से तुलना करें, जहाँ प्रिय की तुलना चिकारे या जवान हिरन से करते हुए मिलती-जुलती छवि आती है।
    reason: cross_reference
lexical_decisions:
- source_word: בְּרַח
  choice: भाग चल
  rationale: यह पुल्लिंग एकवचन आज्ञार्थक क्रिया मूलतः ‘भागना’ या ‘दूर भागना’ व्यक्त करती है। ‘भाग चल’ उसकी तीव्र गति और काव्यात्मक आग्रह को बनाए रखता है, पर प्रसंग में इसे भय से पलायन मानना आवश्यक नहीं करता।
- source_word: דּוֹדִי
  choice: मेरे प्रिय
  rationale: श्रेष्ठगीत में यह स्त्री वक्ता द्वारा अपने पुरुष प्रेमी के लिए प्रयुक्त स्नेहसूचक संबोधन है। ‘मेरे प्रिय’ आधुनिक, स्वाभाविक और संबंध की विशिष्टता बनाए रखने वाला रूप है।
- source_word: וּדְמֵה לְךָ
  choice: के समान हो जा
  rationale: דמה עם ל समानता या सदृशता व्यक्त करता है। यह रूप आज्ञार्थक बल और काव्यात्मक तुलना दोनों को सुरक्षित रखता है।
- source_word: לִצְבִי
  choice: चिकारे
  rationale: צְבִי एक सुडौल, तेज दौड़ने वाले गज़ेल-जैसे पशु को दर्शाता है। ‘चिकारा’ आधुनिक हिन्दी में स्पष्ट और चित्रात्मक है।
- source_word: אֹו לְעֹפֶר הָאַיָּלִים
  choice: या जवान हिरन
  rationale: עֹפֶר किसी पशु के बच्चे या कम आयु के पशु को और אַיָּלִים हिरनों/नर हिरनों को सूचित करता है। ‘जवान हिरन’ पुरुष प्रिय से जुड़ी छवि और पशु की युवावस्था दोनों व्यक्त करता है।
- source_word: עַל
  choice: पर
  rationale: यहाँ संबंध ऊँचे भूभाग पर गति या उपस्थिति का है; ‘पर’ इसका सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: הָרֵי בְשָׂמִים
  choice: सुगंध-द्रव्यों के पहाड़ों
  rationale: בְשָׂמִים सुगंधित पदार्थों, मसालों या इत्र-सामग्री को दर्शाता है। ‘सुगंध-द्रव्य’ किसी एक वनस्पति को अनावश्यक रूप से निश्चित किए बिना मूल की बहुअर्थी, कामोत्तेजक काव्य-छवि बनाए रखता है।
