source:
  edition: WLC
  text: אַחַ֥ת הִיא֙ יוֹנָתִ֣/י תַמָּתִ֔/י אַחַ֥ת הִיא֙ לְ/אִמָּ֔/הּ בָּרָ֥ה הִ֖יא לְ/יֽוֹלַדְתָּ֑/הּ רָא֤וּ/הָ בָנוֹת֙ וַֽ/יְאַשְּׁר֔וּ/הָ מְלָכ֥וֹת וּ/פִֽילַגְשִׁ֖ים וַֽ/יְהַלְלֽוּ/הָ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/009.yaml
  text: My dove[a], my flawless one, is the only one; she is the only one of her mother, pure to the one who bore her. Daughters saw her and called her blessed[c][b]; queens and concubines also praised her.
translation:
  language: hi
  text: मेरी कबूतरी, मेरी निष्कलंक[a], वही एकमात्र है; वह अपनी माँ की इकलौती है, जिसने उसे जन्म दिया उसके लिए वह निर्मल[b] है। युवतियों[c] ने उसे देखा और उसे धन्य कहा; रानियों और रखैलों ने भी उसकी प्रशंसा की।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी सर्वांगपूर्ण।” इब्रानी शब्द पूर्णता, अखंडता या निष्कलंकता का भाव दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “उज्ज्वल” अथवा “चुनी हुई।” इब्रानी विशेषण शुद्धता के साथ असाधारण सुंदरता या विशिष्टता भी व्यक्त कर सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप से “बेटियों”; गीत की काव्य-भाषा में इसका संकेत युवतियों या कुमारियों की ओर हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: יוֹנָתִי
  choice: मेरी कबूतरी
  rationale: शाब्दिक पक्षी-बिंब और प्रेमपूर्ण संबोधन दोनों को बनाए रखता है; सामान्य ‘मेरी प्रिया’ कहने से मूल काव्य-रूपक मिट जाता।
- source_word: תַמָּתִי
  choice: मेरी निष्कलंक
  rationale: यहाँ पूर्णता, अखंडता और दोषरहित सौंदर्य का भाव है। ‘निष्कलंक’ काव्यात्मक और गरिमापूर्ण है, जबकि केवल नैतिक निर्दोषता तक अर्थ सीमित नहीं करता।
- source_word: אַחַת הִיא
  choice: वह एक ही है
  rationale: दोहराया गया वाक्यांश उसकी अनन्यता और विशिष्टता पर बल देता है, केवल संख्या पर नहीं।
- source_word: לְאִמָּהּ
  choice: अपनी माँ की इकलौती
  rationale: ל संबंध सूचित करता है; हिन्दी में ‘अपनी माँ की इकलौती’ सहज रूप से उसकी अद्वितीय स्थिति व्यक्त करता है।
- source_word: בָּרָה
  choice: निर्मल
  rationale: शब्द शुद्धता, उज्ज्वलता अथवा चुनी हुई विशिष्टता का बोध करा सकता है। ‘निर्मल’ काव्य-संदर्भ में मूल अस्पष्टता का पर्याप्त विस्तार बचाता है।
- source_word: לְיוֹלַדְתָּהּ
  choice: अपनी जननी की ... बेटी
  rationale: मूलतः ‘जिसने उसे जन्म दिया’ है। ‘जननी’ जन्म देने वाली माँ का संबंध संक्षेप और काव्यात्मक ढंग से व्यक्त करता है; हिन्दी वाक्य पूर्ण करने के लिए ‘बेटी’ जोड़ा गया है।
- source_word: בָנוֹת
  choice: युवतियों
  rationale: शाब्दिक अर्थ ‘बेटियाँ’ है, पर गीत के मुहावरे में स्त्रियों या कुमारियों का समुदाय अभिप्रेत हो सकता है। यहाँ ‘युवतियों’ आधुनिक हिन्दी में अधिक स्वाभाविक है और पादटिप्पणी शाब्दिक विकल्प बताती है।
- source_word: וַיְאַשְּׁרוּהָ
  choice: उसे धन्य कहा
  rationale: Piel रूप किसी को सुखी, सौभाग्यशाली या धन्य घोषित करने का भाव देता है। यह अनावश्यक धार्मिक विशिष्टीकरण के बिना मूल्यांकनात्मक बल रखता है।
- source_word: מְלָכוֹת
  choice: रानियों
  rationale: बहुवचन संज्ञा का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וּפִילַגְשִׁים
  choice: और रखैलों ने भी
  rationale: ‘रखैल’ פִּילֶגֶשׁ का प्रचलित हिन्दी समतुल्य है; ‘भी’ समन्वित दूसरे समूह की सहभागिता स्पष्ट करता है।
- source_word: וַיְהַלְלוּהָ
  choice: उसकी प्रशंसा की
  rationale: הלל का सीधा अर्थ प्रशंसा करना है; यह आधुनिक पाठकों के लिए स्पष्ट और स्वाभाविक है।
