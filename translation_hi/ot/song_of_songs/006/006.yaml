base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/006.yaml
  text: Your teeth are like a flock of ewes that have come up from the washing[a], all of them bearing twins[b], and none among them has lost her young.
translation:
  language: hi
  text: 'तेरे दाँत भेड़ों के झुंड के समान हैं,


    जो धुलाई से ऊपर आई हैं;


    वे सभी जुड़वाँ बच्चे जनती हैं[a],


    और उनमें कोई भी ऐसी नहीं जिसने अपना बच्चा खोया हो[b]।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘वे सभी जोड़े में हैं।’ इस पंक्ति से संभवतः यह संकेत मिलता है कि हर दाँत का उससे मेल खाने वाला जोड़ीदार है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, ‘संतान खो चुकी।’ यह रूपक पूर्णता का संकेत देता है—कोई भी अपने जोड़ीदार से रहित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שִׁנַּיִךְ
  choice: तेरे दाँत
  rationale: यह स्त्रीलिंग एकवचन संबोधन के साथ सीधा संबंधसूचक रूप है। आधुनिक हिन्दी में काव्यात्मक निकटता के लिए ‘तेरे दाँत’ स्वाभाविक है।
- source_word: כְּעֵדֶר הָרְחֵלִים
  choice: भेड़ों के झुंड के समान
  rationale: רְחֵלִים विशेष रूप से मादा भेड़ों को दर्शाता है। हिन्दी में ‘भेड़’ स्वयं स्त्रीलिंग है, इसलिए अस्वाभाविक ‘मादा भेड़ों’ की अपेक्षा यह रूप सटीक और सहज है।
- source_word: שֶׁעָלוּ מִן הָרַחְצָה
  choice: जो नहाकर ऊपर आई हैं
  rationale: यह धुली हुई भेड़ों के ऊपर आने का दृश्य प्रस्तुत करता है। ‘नहाकर’ आधुनिक हिन्दी में स्वाभाविक रहते हुए धुलाई और उज्ज्वल स्वच्छता की काव्यात्मक छवि बनाए रखता है।
- source_word: שֶׁכֻּלָּם מַתְאִימוֹת
  choice: वे सभी जुड़वाँ बच्चे जनती हैं
  rationale: תאם का रूप इस पशुपालकीय रूपक में जुड़वाँ बच्चे देने का अर्थ रख सकता है, जबकि दाँतों के संदर्भ में उससे हर दाँत के जोड़ीदार होने का संकेत मिलता है। मुख्य पाठ में भेड़ों का रूपक रखा गया है और वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְשַׁכֻּלָה אֵין בָּהֶם
  choice: और उनमें से कोई भी अपने बच्चे से वंचित नहीं है
  rationale: שַׁכֻּלָה का मूल अर्थ संतान खो चुकी अथवा संतान से वंचित होना है। यह अनुवाद पशुपालकीय छवि को बनाए रखता है; दाँतों के स्तर पर निहित अर्थ है कि कोई जोड़ीदार लापता नहीं है।
