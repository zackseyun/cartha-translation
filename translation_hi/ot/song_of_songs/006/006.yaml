translation_notes:
  register: भाषा आधुनिक, सहज और काव्यात्मक रखी गई है। प्रेम-काव्य के निकट संबोधन को बनाए रखने के लिए ‘तेरे’ चुना गया है। पंक्ति-विन्यास ने इब्रानी समानांतरता और भेड़ों से दाँतों की विस्तृत उपमा को स्पष्ट रखा है।
