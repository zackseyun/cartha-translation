  yaml_path: translation/ot/song_of_songs/006/003.yaml
  text: I am my beloved's[a], and my beloved is mine, who grazes among the lilies.
translation:
  language: hi
  text: मैं अपने प्रिय की हूँ, और मेरा प्रिय मेरा है—वह जो सोसनों के बीच चरवाही करता है[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह जो सोसनों के बीच चरता है।” इब्रानी कृदन्त का अर्थ चरना, चराना, या चरवाही करना हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲנִי לְדוֹדִי
  choice: मैं अपने प्रिय की हूँ
  rationale: לְ के साथ यह काव्यात्मक वाक्यांश संबंध और अपनेपन को व्यक्त करता है। हिन्दी में स्त्री वक्ता के प्रसंग के अनुरूप ‘अपने प्रिय की हूँ’ स्वाभाविक है और पारस्परिक समर्पण का भाव बनाए रखता है।
- source_word: וְדוֹדִי לִי
  choice: और मेरा प्रिय मेरा है
  rationale: क्रियारहित इब्रानी उपवाक्य को हिन्दी में ‘है’ के साथ व्यक्त किया गया है। यह पहले खंड के समानांतर पारस्परिक अपनेपन को संक्षेप और काव्यात्मक रूप में रखता है।
- source_word: הָרֹעֶה
  choice: वह जो … चरवाही करता है
  rationale: רעה का कृदन्त चराने, चरागाह में ले जाने या चरवाही करने का अर्थ दे सकता है। ‘चरवाही करता है’ बिना किसी ऐसे स्पष्ट कर्म को जोड़कर, जो इब्रानी में नहीं है, चरवाहे की काव्यात्मक छवि बनाए रखता है।
- source_word: בַּשׁוֹשַׁנִּים
  choice: सोसन के फूलों के बीच
  rationale: בַּ यहाँ किसी परिवेश के भीतर होने को बताता है, इसलिए ‘के बीच’ उपयुक्त है। ‘सोसन के फूल’ שׁוֹשַׁנִּים की पारंपरिक पुष्प-छवि और गीत में उसकी पुनरावृत्ति को सुरक्षित रखता है।
theological_decisions:
- issue: गीत में संबंधपरक भाषा
  choice: प्रेमियों के पारस्परिक अपनेपन की काव्यात्मक भाषा को ज्यों का त्यों बनाए रखना
  alternative: प्रिय को अनुवाद में परमेश्वर या मसीह के रूप में स्पष्ट करना
  rationale: इब्रानी पाठ प्रेमियों के बीच पारस्परिक प्रेम और अपनेपन को प्रस्तुत करता है। बाद की रूपकात्मक या सिद्धान्तगत व्याख्या को मुख्य पाठ में जोड़ना मूल की सीमा से आगे जाएगा।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। डैश दूसरे कथन से वर्णनात्मक कृदन्त को जोड़ता है। ‘सोसन के फूल’ पारंपरिक बाइबिलीय पुष्प-शब्दावली को बनाए रखता है, जबकि पादटिप्पणी רעה की वास्तविक अर्थगत व्यापकता को सुरक्षित रखती है।
