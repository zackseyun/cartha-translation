- source_word: לֹא יָדַעְתִּי
  choice: मुझे पता भी न चला
  rationale: शाब्दिक अर्थ ‘मैं नहीं जानती थी’ है; प्रसंग में यह अचानक और अनजाने में हुई बात को व्यक्त करता है। हिंदी में यह रूप स्वाभाविक है और वक्ता के व्याकरणिक लिंग को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: נַפְשִׁי
  choice: मेरे मन
  rationale: נֶפֶשׁ यहाँ प्राण, स्वयं, अंतरमन या अभिलाषा का बोध करा सकता है। ‘मन’ आंतरिक प्रेरणा को सहज हिंदी में व्यक्त करता है, जबकि मूल की बहुअर्थकता पादटिप्पणी में रखी गई है।
- source_word: שָׂמַתְנִי
  choice: मुझे … के बीच ला खड़ा किया
  rationale: שׂוּם का मूल अर्थ रखना या स्थापित करना है। ‘ला खड़ा किया’ रथों के बीच अचानक रखे जाने की काव्यात्मक छवि को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: מַרְכְּבוֹת
  choice: रथों
  rationale: बहुवचन संज्ञा का सीधा और प्रसंगानुकूल अनुवाद।
- source_word: עַמִּי נָדִיב
  choice: मेरे कुलीन लोगों
  rationale: עַמִּי को ‘मेरे लोग’ और נָדִיב को ‘कुलीन’ समझकर कठिन वाक्यांश का निकट अनुवाद किया गया है; व्यक्तिवाचक नाम वाली वैकल्पिक व्याख्या पादटिप्पणी में दी गई है।
