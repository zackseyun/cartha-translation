base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/011.yaml
  text: I went down to the walnut grove to look at the shoots in the valley[a], to see whether the vine had budded[c][b], whether the pomegranates had blossomed.
translation:
  language: hi
  text: 'मैं अखरोटों की वाटिका में नीचे उतरी,

    घाटी में उगी नई कोपलों को देखने,[a]

    यह देखने कि क्या अंगूर की बेल में कलियाँ फूटी हैं,[b]

    और क्या अनार के पेड़ों पर फूल खिले हैं।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘घाटी’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ वादी, बरसाती नाला, या उसकी तलहटी भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: इसका अनुवाद ‘क्या अंगूर की बेल फूल उठी है’ भी हो सकता है; इब्रानी क्रिया कली फूटने या फूलने—दोनों को व्यक्त कर सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: גִּנַּת אֱגוֹז
  choice: अखरोटों की वाटिका
  rationale: גִּנַּת किसी बगीचे या वृक्ष-वाटिका को और אֱגוֹז अखरोट अथवा अखरोट के वृक्ष को दर्शाता है। यह चयन खेती की हुई वृक्ष-वाटिका का काव्यात्मक और स्वाभाविक चित्र देता है।
- source_word: יָרַדְתִּי
  choice: मैं ... उतर गई
  rationale: क्रिया का मूल अर्थ नीचे जाना या उतरना है। संदर्भ में वक्ता स्त्री है, इसलिए हिन्दी में स्त्रीलिंग रूप रखा गया है।
- source_word: בְּאִבֵּי הַנָּחַל
  choice: घाटी की नई कोंपलों
  rationale: אִבֵּי ताज़ी बढ़त या नई कोंपलों को सूचित करता है; נַחַל घाटी, वादी या बरसाती नाले की तलहटी हो सकता है। मुख्य पाठ में सहज 'घाटी' रखा और व्यापक अर्थ टिप्पणी में बताया है।
- source_word: הֲפָרְחָה הַגֶּפֶן
  choice: क्या दाखलता में कलियाँ फूट आई हैं
  rationale: פרח में अंकुरित होने, कली फूटने या फूलने की अर्थ-सीमा है। 'कलियाँ फूट आई हैं' अगले खंड के फूल खिलने से शब्दचित्र का अंतर बनाए रखता है।
- source_word: הֵנֵצוּ הָרִמֹּנִים
  choice: क्या अनारों में फूल खिल आए हैं
  rationale: נוץ फूल निकलने या खिलने को दर्शाता है। हिन्दी में 'अनारों' के द्वारा अनार के पेड़ों का वही संक्षिप्त काव्यात्मक संकेत सुरक्षित रहता है जो इब्रानी में है।
