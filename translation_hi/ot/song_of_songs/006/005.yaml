  text: הָסֵ֤בִּי עֵינַ֨יִ/ךְ֙ מִ/נֶּגְדִּ֔/י שֶׁ֥/הֵ֖ם הִרְהִיבֻ֑/נִי שַׂעְרֵ/ךְ֙ כְּ/עֵ֣דֶר הָֽ/עִזִּ֔ים שֶׁ/גָּלְשׁ֖וּ מִן הַ/גִּלְעָֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/005.yaml
  text: Turn your eyes away from me[a], for they overwhelm me[b]. Your hair is like a flock of goats streaming down from Gilead.
translation:
  language: hi
  text: अपनी आँखें मुझसे फेर ले, क्योंकि वे मुझे अभिभूत कर देती हैं[a]। तेरे बाल बकरियों के उस झुंड के समान हैं, जो गिलआद से नीचे उतरता चला जाता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वे मुझे व्याकुल कर देती हैं’ अथवा ‘वे मुझ पर प्रबल हो जाती हैं।’ यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है और उसके सटीक भाव पर मतभेद है।
    reason: lexical_alternative
  - marker: b
    text: या ‘जो गिलआद से उतर रहा है’ अथवा ‘जो गिलआद की ढलानों पर उतर रहा है।’ मूल इब्रानी में केवल ‘गिलआद से’ कहा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הָסֵבִּי
  choice: फेर ले
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप को सहज और प्रत्यक्ष हिन्दी में व्यक्त करता है; भाव है कि स्त्री अपनी आँखें वक्ता की ओर से हटा ले।
- source_word: עֵינַיִךְ מִנֶּגְדִּי
  choice: अपनी आँखें मुझसे
  rationale: מִנֶּגְדִּי का आशय वक्ता के सामने से या उसकी ओर से दृष्टि हटाना है; ‘मुझसे फेर ले’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: שֶׁהֵם הִרְהִיבֻנִי
  choice: क्योंकि वे मुझे अभिभूत कर देती हैं
  rationale: רהב का यह रूप दुर्लभ और अर्थ की दृष्टि से विवादित है। प्रेम-काव्य के प्रसंग में स्त्री की आँखों द्वारा वक्ता को भावनात्मक रूप से वश में या व्याकुल कर देने का भाव सम्भावित है; ‘अभिभूत’ इस तीव्रता को बिना अनावश्यक व्याख्या के बनाए रखता है।
- source_word: שַׂעְרֵךְ
  choice: तेरे बाल
  rationale: सम्बोधन की निकटता और एकवचन स्त्रीलिंग सम्बन्ध को सरल, काव्यात्मक हिन्दी में बनाए रखता है।
- source_word: כְּעֵדֶר הָעִזִּים
  choice: बकरियों के उस झुंड के समान
  rationale: עֵדֶר पशुओं के झुंड को दर्शाता है; ‘उस’ आगे वर्णित विशिष्ट दृश्य से उपमा को सहज रूप से जोड़ता है।
- source_word: שֶׁגָּלְשׁוּ
  choice: जो ... नीचे उतरता चला आता है
  rationale: גלשׁ नीचे की ओर सरकने या उतरने का दृश्य प्रस्तुत करता है। हिन्दी में एक झुंड को सामूहिक एकवचन मानकर यह प्रयोग स्वाभाविक है और लहराते बालों की गतिशील छवि सुरक्षित रखता है।
- source_word: מִן הַגִּלְעָד
  choice: गिलआद से
  rationale: मूल पाठ केवल गिलआद का नाम लेकर ‘से’ कहता है; मुख्य पाठ में ‘पर्वत’ या ‘ढलानों’ को जोड़कर अर्थ को अनावश्यक रूप से निश्चित नहीं किया गया।
theological_decisions:
- issue: दुर्लभ क्रिया הִרְהִיבֻנִי का भाव
  choice: मुझे अभिभूत कर देती हैं
  alternative: मुझे व्याकुल कर देती हैं / मुझ पर प्रबल हो जाती हैं
  rationale: पद प्रेम-काव्य है और क्रिया का सटीक भाव विवादित है। मुख्य पाठ सम्भावित भावनात्मक तीव्रता व्यक्त करता है, जबकि पाद-टिप्पणी वैकल्पिक अर्थों को खुला रखती है; कोई विशिष्ट धर्मवैज्ञानिक अर्थ आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण और काव्यात्मक शैली रखी गई है। प्रेमी-प्रेमिका की निकटता के अनुरूप ‘तेरे’ और स्त्रीलिंग ‘फेर ले’ का प्रयोग किया गया है। दुर्लभ क्रिया और भौगोलिक चित्र की वास्तविक अस्पष्टता पाद-टिप्पणियों में सुरक्षित है।
