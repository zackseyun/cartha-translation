base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/002.yaml
  text: My beloved has gone down to his garden[a], to the beds of spices[b], to graze in the gardens and to gather lilies.
translation:
  language: hi
  text: 'मेरा प्रिय अपने बगीचे में,

    सुगंधित पौधों की क्यारियों में उतर गया है,

    बगीचों में चरने

    और सोसन के फूल बटोरने।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीतगीत में यह पद स्त्री के प्रिय पुरुष को दर्शाता है। ‘मेरा प्रिय’ स्नेह और संबंध, दोनों को स्वाभाविक एवं गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: יָרַד
  choice: उतर गया है
  rationale: यह पूर्ण हुई क्रिया और प्रसंग में उसकी वर्तमान प्रासंगिकता को व्यक्त करता है तथा नीचे की ओर जाने का भाव बनाए रखता है।
- source_word: לְגַנּוֹ
  choice: अपने बगीचे में
  rationale: हिब्रू पद दिशा को सूचित करता है; हिंदी में ‘अपने बगीचे में उतर गया है’ अधिक स्वाभाविक है और स्वामित्व स्पष्ट रखता है।
- source_word: לַעֲרוּגוֹת הַבֹּשֶׂם
  choice: सुगंधित पौधों की क्यारियों के पास
  rationale: עֲרוּגוֹת खेती की क्यारियाँ हैं और בֹּשֶׂם सुगंधित मसाले, गोंद या पौधों का बोध करा सकता है। यह चयन बागवानी और सुगंध, दोनों बिंबों को सहज हिंदी में रखता है।
- source_word: לִרְעוֹת
  choice: चरे
  rationale: רעה चरने, चराने अथवा खिलाने का अर्थ दे सकता है। मुख्य पाठ में ‘चरे’ ठोस चरवाही-बिंब को बनाए रखता है, जबकि पादटिप्पणी उसकी वास्तविक अस्पष्टता बताती है।
- source_word: בַּגַּנִּים
  choice: बगीचों में
  rationale: मूल पाठ के बहुवचन को पहले आए एकवचन ‘बगीचे’ से मिलाकर बदलने के बजाय सुरक्षित रखा गया है।
- source_word: וְלִלְקֹט
  choice: और … बटोरे
  rationale: לקט का अर्थ इकट्ठा करना या चुनना है। फूलों के संदर्भ में ‘बटोरे’ स्वाभाविक और काव्यात्मक है।
- source_word: שׁוֹשַׁנִּים
  choice: सोसन के फूल
  rationale: पारंपरिक पुष्प-नाम ‘सोसन’ को रखा गया है, पर मूल शब्द से अभिप्रेत सटीक प्रजाति अनिश्चित होने के कारण पादटिप्पणी दी गई है।
theological_decisions:
- issue: प्रिय के ‘चरने’ अथवा ‘चराने’ का आशय
  choice: मुख्य पाठ में ‘चरे’ और पादटिप्पणी में विकल्प
  alternative: ‘झुंड चराए’ या ‘भोजन करे’
  rationale: हिब्रू क्रिया कर्म या झुंड को स्पष्ट नहीं करती। किसी झुंड को जोड़ना या क्रिया को केवल भोजन करने तक सीमित करना काव्य की जानबूझकर बनी रह सकने वाली चरवाही-संबंधी अस्पष्टता को मिटा देता।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की, सरल किंतु काव्यात्मक और गरिमापूर्ण रखी गई है। पंक्ति-विन्यास हिब्रू कविता की समानांतर गति को उभारता है। एकवचन ‘बगीचे’ और बहुवचन ‘बगीचों’ का अंतर मूल के अनुसार सुरक्षित है।
