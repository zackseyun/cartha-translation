base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/001.yaml
  text: Where has your beloved gone[a], most beautiful among women? Where has your beloved turned, that we may seek him with you?
translation:
  language: hi
  text: हे स्त्रियों में सबसे सुंदरी, तुम्हारा प्रिय कहाँ चला गया है? तुम्हारा प्रिय किधर मुड़ा है[a], कि हम तुम्हारे साथ उसे ढूँढ़ें?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारा प्रिय किधर अलग मुड़ गया है?” यह क्रिया केवल दिशा बदलने के बजाय अलग हट जाने या मुड़ जाने का भाव भी दे सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אָנָה
  choice: कहाँ / किधर
  rationale: यह गन्तव्य या दिशा पूछने वाला प्रश्नवाचक क्रियाविशेषण है। पहली पंक्ति में ‘कहाँ’ और समानान्तर दूसरी पंक्ति में ‘किधर’ स्वाभाविक हिन्दी देते हैं।
- source_word: הָלַךְ
  choice: चला गया है
  rationale: सन्दर्भ में पूर्ण हो चुके प्रस्थान के आधार पर प्रिय के वर्तमान ठिकाने का प्रश्न है; ‘चला गया है’ इसे स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: דּוֹדֵךְ
  choice: तुम्हारा प्रिय
  rationale: गीतगीत में यह स्त्री के प्रेमपात्र के लिए स्नेहपूर्ण और काव्यात्मक सम्बोधन है; ‘प्रिय’ गरिमापूर्ण रहते हुए प्रेम-संबंध को व्यक्त करता है।
- source_word: הַיָּפָה בַּנָּשִׁים
  choice: हे स्त्रियों में सबसे सुन्दर
  rationale: यह सम्बोधन सन्दर्भ में श्रेष्ठता-सूचक है। ‘स्त्रियों में सबसे सुन्दर’ आधुनिक हिन्दी में इब्रानी भाव को स्पष्ट रखता है।
- source_word: פָּנָה
  choice: मुड़ा है
  rationale: मूल क्रिया दिशा बदलने या मुड़ने का बिम्ब रखती है। ‘मुड़ा है’ पहली पंक्ति के ‘चला गया है’ के साथ समानान्तरता और सम्भावित अर्थ-तनाव दोनों बचाता है।
- source_word: וּנְבַקְשֶׁנּוּ
  choice: कि हम ... उसे ढूँढ़ें
  rationale: यह पूछने के उद्देश्य या इच्छित परिणाम को व्यक्त करता है—वे उसके साथ खोज में सम्मिलित होना चाहती हैं। ‘ढूँढ़ें’ सामान्य आधुनिक हिन्दी में खोजने का स्वाभाविक रूप है।
- source_word: עִמָּךְ
  choice: तुम्हारे साथ
  rationale: यह स्त्रीलिंग एकवचन सम्बोधित व्यक्ति के साथ मिलकर खोजने का भाव सीधे व्यक्त करता है।
