  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। समानान्तर उपमाओं की काव्यात्मक लय बनाए रखते हुए तिर्सा और यरूशलेम के स्थान-नाम सुरक्षित रखे गए हैं; अंतिम सैन्य बिंब को नरम या आध्यात्मिक अर्थ में परिवर्तित नहीं किया गया।
