  text: יָפָ֨ה אַ֤תְּ רַעְיָתִ/י֙ כְּ/תִרְצָ֔ה נָאוָ֖ה כִּ/ירוּשָׁלִָ֑ם אֲיֻמָּ֖ה כַּ/נִּדְגָּלֽוֹת׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/004.yaml
  text: You are beautiful[a], my love, like Tirzah, lovely like Jerusalem, awe-inspiring as bannered armies.
translation:
  language: hi
  text: मेरी प्रियतमा, तुम तिर्सा के समान सुन्दर, यरूशलेम के समान मनोहर और ध्वजों से सजी सेनाओं के समान विस्मयकारी हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “ध्वजों वाली सेनाओं के समान भय जगाने वाली।” इब्रानी बिंब ध्वजों के नीचे व्यवस्थित सैन्य दलों का है, जो प्रभावशाली और विस्मयकारी भव्यता को उभारता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָפָה
  choice: सुन्दर
  rationale: यह विधेय विशेषण स्त्री की सुन्दरता का सीधा वर्णन करता है; ‘सुन्दर’ आधुनिक हिन्दी में स्वाभाविक और गरिमापूर्ण है।
- source_word: רַעְיָתִי
  choice: मेरी प्रियतमा
  rationale: यह गीत में बार-बार प्रयुक्त आत्मीय प्रेम-संबोधन है। ‘मेरी प्रियतमा’ प्रेमपूर्ण काव्य-संदर्भ को स्पष्ट रखते हुए आधुनिक पाठक के लिए सहज है।
- source_word: כְּתִרְצָה
  choice: तिर्सा के समान
  rationale: उपसर्ग כְּ तुलना प्रकट करता है। तिर्सा स्थान-नाम है, इसलिए उसे लिप्यंतरित करते हुए उपमा को यथावत रखा गया है।
- source_word: נָאוָה
  choice: मनोहर
  rationale: यह יָפָה के समानान्तर दूसरा सौन्दर्यवाचक विशेषण है। ‘मनोहर’ काव्यात्मक विविधता बनाए रखता है और दोनों शब्दों को एक ही हिन्दी शब्द में नहीं मिलाता।
- source_word: כִּירוּשָׁלִָם
  choice: यरूशलेम के समान
  rationale: तुलनात्मक उपसर्ग के साथ आए परिचित स्थान-नाम को मानक हिन्दी रूप में रखा गया है।
- source_word: אֲיֻמָּה
  choice: विस्मयकारी
  rationale: यह शब्द भय या विस्मय जगाने वाली प्रभावशाली भव्यता व्यक्त कर सकता है। ‘विस्मयकारी’ प्रेम-काव्य में नैतिक बुराई का संकेत दिए बिना उस प्रबल प्रभाव को व्यक्त करता है।
- source_word: כַּנִּדְגָּלוֹת
  choice: ध्वजों से सजी सेनाओं के समान
  rationale: यह रूप ध्वजों या पताकाओं के अधीन व्यवस्थित दलों की ओर संकेत करता है। हिन्दी वाक्यांश सैन्य बिंब, सुव्यवस्था और प्रभावशाली भव्यता को स्पष्ट रखता है।
