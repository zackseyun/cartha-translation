  yaml_path: translation/ot/song_of_songs/006/007.yaml
  text: Your cheeks are like a slice of pomegranate behind your veil[a].
translation:
  language: hi
  text: तेरी कनपटी तेरे घूँघट[a] के पीछे अनार की फाँक जैसी है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेरी लटों के पीछे” अथवा “तेरे बालों में से,” यदि לְצַמָּתֵךְ को घूँघट के बजाय बालों का संकेत माना जाए।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּפֶלַח
  choice: फाँक जैसी
  rationale: उपसर्ग כְּ तुलना प्रकट करता है और פֶלַח किसी फल के कटे या अलग हुए खंड को दर्शाता है। ‘फाँक जैसी’ स्वाभाविक हिन्दी में इस उपमा को स्पष्ट रखता है।
- source_word: הָרִמּוֹן
  choice: अनार की
  rationale: רִמּוֹן का अर्थ ‘अनार’ है। हिन्दी में ‘अनार की फाँक’ सहज अभिव्यक्ति है और मूल की फल-संबंधी काव्यात्मक छवि बनाए रखती है।
- source_word: רַקָּתֵךְ
  choice: तेरी कनपटी
  rationale: רַקָּה सिर के पार्श्व भाग या कनपटी को सूचित करता है। मूल में रूप एकवचन है, इसलिए व्यापक ‘गालों’ के बजाय अधिक निकट और स्वाभाविक ‘कनपटी’ चुना गया है।
- source_word: מִבַּעַד
  choice: के पीछे
  rationale: यह पूर्वसर्ग किसी बीच में पड़ी वस्तु के पीछे से दिखाई देने का भाव देता है। ‘के पीछे’ संक्षिप्त है और आंशिक रूप से ढकी सुंदरता की छवि बनाए रखता है।
- source_word: לְצַמָּתֵךְ
  choice: तेरे घूँघट
  rationale: צַמָּה को इस प्रसंग में चेहरे या सिर को ढकने वाले आवरण के रूप में समझा जा सकता है। ‘घूँघट’ आधुनिक हिन्दी में काव्यात्मक और बोधगम्य है; बाल या लटें वाला संभव अर्थ पादटिप्पणी में रखा गया है।
