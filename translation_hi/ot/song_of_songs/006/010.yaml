base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/006/010.yaml
  text: Who is this who looks forth like the dawn[a], beautiful as the moon, bright as the sun[c][b], awe-inspiring as bannered armies?
translation:
  language: hi
  text: यह कौन है जो भोर के समान झाँकती है[a], चाँद के समान सुंदर, सूरज के समान उज्ज्वल[b], और ध्वजधारी सेनाओं के समान भयावह है[c]?
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो भोर के समान प्रकट होती है।”
    reason: lexical_alternative
  - marker: b
    text: “उज्ज्वल” के लिए प्रयुक्त इब्रानी विशेषण का अर्थ “निर्मल” या “स्वच्छ” भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: या, “ध्वजों वाली सेनाओं के समान भय-मिश्रित विस्मय जगाने वाली।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִי זֹאת
  choice: यह कौन है
  rationale: इब्रानी में प्रश्नवाचक ‘कौन’ के साथ स्त्रीलिंग संकेतवाचक ‘यह’ है। हिन्दी में ‘यह कौन है’ स्वाभाविक है और प्रसंग से स्त्री संदर्भ स्पष्ट रहता है।
- source_word: הַנִּשְׁקָפָה
  choice: जो ... झाँकती है
  rationale: שׁקף का भाव किसी ऊँचे या भीतर के स्थान से बाहर दिखाई देने अथवा झाँकने का हो सकता है। ‘झाँकती है’ दृश्यात्मक काव्य-भाव को बनाए रखता है; ‘प्रकट होती है’ भी सम्भव है।
- source_word: כְּמוֹ שָׁחַר
  choice: भोर के समान
  rationale: שׁחר का अर्थ भोर या पौ फटना है। ‘भोर’ संक्षिप्त, सहज और काव्यात्मक है।
- source_word: יָפָה
  choice: सुन्दर
  rationale: यह सामान्य रूप से सौन्दर्य व्यक्त करने वाला विशेषण है; आधुनिक मानक हिन्दी में ‘सुन्दर’ स्पष्ट और गरिमापूर्ण है।
- source_word: כַלְּבָנָה
  choice: चाँद के समान
  rationale: यह निश्चित संज्ञा ‘चाँद’ के साथ सीधी उपमा है।
- source_word: בָּרָה
  choice: उज्ज्वल
  rationale: विशेषण में निर्मल, स्वच्छ या चमकीला होने का भाव हो सकता है। चाँद और सूरज के प्रकाशमय समानांतर में ‘उज्ज्वल’ उपयुक्त है, जबकि वैकल्पिक अर्थ को पादटिप्पणी में रखा गया है।
- source_word: כַּחַמָּה
  choice: सूरज के समान
  rationale: यह सूरज से सीधी उपमा है; ‘सूरज’ साधारण आधुनिक हिन्दी में स्वाभाविक है और काव्यात्मक गरिमा भी बनाए रखता है।
- source_word: אֲיֻמָּה
  choice: विस्मयकारी
  rationale: शब्द भय-मिश्रित प्रभाव और प्रताप का बोध कराता है। ‘विस्मयकारी’ रोमानी-काव्य प्रसंग में नकारात्मक नैतिक अर्थ जोड़े बिना उस प्रभाव को व्यक्त करता है।
- source_word: כַּנִּדְגָּלוֹת
  choice: ध्वजों से सजी सेनाओं के समान
  rationale: דגל से बना यह रूप ध्वजों या पताकाओं से पहचाने जाने वाले सैन्य दलों की छवि जगाता है। यह अनुवाद उस सामूहिक सैन्य रूपक को स्पष्ट और स्वाभाविक हिन्दी में रखता है।
