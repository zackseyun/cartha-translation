base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/003.yaml
  text: Like an apple tree among the trees of the forest[a], so is my beloved among the sons. In his shade I delighted to sit[b], and his fruit was sweet to my taste.
translation:
  language: hi
  text: जैसे वन के पेड़ों के बीच सेब का पेड़,[a] वैसे ही जवानों[b] के बीच मेरा प्रिय है। मैंने उसकी छाया की लालसा की और उसमें बैठ गई, और उसका फल मेरे तालू पर मीठा था।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द से ठीक किस फलदार वृक्ष का बोध होता है, यह निश्चित नहीं है; परंपरागत अनुवाद ‘सेब का पेड़’ है।
    reason: cultural_note
  - marker: b
    text: या, “पुत्रों के बीच।” इब्रानी में शाब्दिक रूप से “पुत्रों” है; यहाँ आशय युवा पुरुषों से हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּפּוּחַ
  choice: सेब का पेड़
  rationale: इस वृक्ष की ठीक प्रजाति अनिश्चित है, पर पारंपरिक और सहज पहचान योग्य अनुवाद ‘सेब का पेड़’ है; वन के साधारण पेड़ों के बीच मनभावन फलदार वृक्ष का काव्यात्मक विरोध भी बना रहता है।
- source_word: בַּעֲצֵי הַיַּעַר
  choice: वन के पेड़ों के बीच
  rationale: यह व्यापक वन-वृक्ष समूह के बीच एक विशिष्ट वृक्ष की तुलना व्यक्त करता है और हिन्दी में स्वाभाविक है।
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीतगीत में यह स्त्री वक्ता के प्रेमपात्र पुरुष को सूचित करता है; ‘प्रिय’ काव्यात्मक, आत्मीय और आधुनिक हिन्दी में सहज है।
- source_word: בֵּין הַבָּנִים
  choice: जवानों के बीच
  rationale: शाब्दिक अर्थ ‘पुत्रों के बीच’ है, किंतु प्रसंग में पुरुष समवयस्कों अथवा जवान पुरुषों का आशय है; ‘जवानों’ हिन्दी में इस तुलना को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּצִלּוֹ
  choice: उसकी छाया में
  rationale: पुल्लिंग एकवचन प्रत्यय वृक्ष-रूपक के द्वारा प्रिय की ओर संकेत करता है; ‘उसकी’ इस जानबूझकर मिलाई गई छवि को बनाए रखता है।
- source_word: חִמַּדְתִּי וְיָשַׁבְתִּי
  choice: बैठने की मैंने लालसा की
  rationale: इब्रानी में इच्छा/आनंद और बैठने की क्रिया दोनों हैं। यह अनुवाद इच्छा के भाव को स्पष्ट रखता है; अगली पंक्ति में फल चखने का वर्णन उस निकटता के अनुभव को आगे बढ़ाता है।
- source_word: וּפִרְיוֹ
  choice: और उसका फल
  rationale: वृक्ष और प्रिय का रूपक जारी है; पुल्लिंग ‘उसका’ मूल की व्यक्तिगत और कामुक-काव्यात्मक अस्पष्टता को सुरक्षित रखता है।
- source_word: מָתוֹק לְחִכִּי
  choice: मेरे तालू को मीठा लगा
  rationale: חֵךְ का ठोस अर्थ ‘तालू’ है। हिन्दी मुहावरे ‘तालू को मीठा लगा’ से स्वाद की इंद्रियगत छवि और भूतकालीन अनुभूति दोनों बनी रहती हैं।
theological_decisions:
- issue: प्रेम-काव्य की इंद्रियगत और संभावित कामुक रूपकात्मकता
  choice: छाया, फल और तालू की मूल छवियों को बिना व्याख्यात्मक विस्तार के बनाए रखा गया।
  alternative: इन्हें केवल सुरक्षा, संगति या आध्यात्मिक तृप्ति के रूप में स्पष्ट करना।
  rationale: मूल पद स्वयं रूपक को नहीं खोलता; किसी विशिष्ट रूपकात्मक या सांप्रदायिक व्याख्या को मुख्य पाठ में जोड़ना उसकी वास्तविक काव्यात्मक बहुअर्थता को सीमित कर देता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘प्रिय’, ‘वन’, ‘छाया’ और ‘तालू’ मूल की काव्यात्मक तथा इंद्रियगत बनावट को बचाते हैं। ‘पुत्रों’ के स्थान पर प्रसंगानुकूल ‘जवानों’ चुना गया है, क्योंकि हिन्दी में ‘पुत्रों के बीच’ अनपेक्षित पारिवारिक अर्थ दे सकता है।
