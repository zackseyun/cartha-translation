base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/014.yaml
  text: My dove[a], in the clefts of the rock, in the hiding place of the cliff, let me see your appearance; let me hear your voice, for your voice is sweet[b], and your appearance is lovely.
translation:
  language: hi
  text: 'हे मेरी कबूतरी, चट्टान की दरारों में,

    खड़ी चट्टानी जगह की आड़ में[a],

    मुझे अपना रूप[b] दिखा;

    मुझे अपनी आवाज़ सुना,

    क्योंकि तेरी आवाज़ मधुर है,

    और तेरा रूप मनोहर है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “खड़ी चढ़ाई के छिपे स्थान में” अथवा “चट्टानी कगार की ओट में”; यहाँ प्रयुक्त इब्रानी शब्द दुर्लभ है और किसी खड़ी चट्टानी चढ़ाई, सोपान या कगार का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “अपना चेहरा” अथवा “अपनी सूरत”; इब्रानी शब्द सामान्य रूप से दिखाई देने वाले रूप को और अधिक विशेष अर्थ में मुख-मंडल को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: יוֹנָתִי
  choice: मेरी कबूतरी
  rationale: यह शाब्दिक रूप से ‘मेरी कबूतरी’ है और प्रेमपूर्ण संबोधन तथा पक्षी-बिंब दोनों को सहज आधुनिक हिन्दी में बनाए रखता है।
- source_word: בְּחַגְוֵי הַסֶּלַע
  choice: चट्टान की दरारों में
  rationale: חגוי चट्टान की दरारों अथवा संकरी खोहों को दर्शाता है; बहुवचन और ठोस दृश्य दोनों सुरक्षित हैं।
- source_word: בְּסֵתֶר הַמַּדְרֵגָה
  choice: खड़ी चट्टान की ओट में
  rationale: סתר छिपी या आड़ वाली जगह को सूचित करता है, जबकि दुर्लभ מַדְרֵגָה का आशय संभवतः खड़ी चढ़ाई, कगार या चट्टानी सोपान है। यह अनुवाद प्राकृतिक हिन्दी देता है और अनिश्चित भू-दृश्य को पादटिप्पणी में सुरक्षित रखता है।
- source_word: הַרְאִינִי אֶת־מַרְאַיִךְ
  choice: मुझे अपना रूप दिखा
  rationale: आज्ञार्थक रूप यहाँ प्रेमपूर्ण अनुरोध है। מראה का अर्थ रूप, दिखाई देने वाला स्वरूप या मुख हो सकता है; ‘रूप’ अर्थ को केवल चेहरे तक सीमित नहीं करता।
- source_word: הַשְׁמִיעִינִי אֶת־קוֹלֵךְ
  choice: मुझे अपनी आवाज़ सुना
  rationale: हिफ़ील आज्ञार्थक का शाब्दिक भाव ‘मुझे सुनवा’ है; ‘मुझे अपनी आवाज़ सुना’ हिन्दी में स्वाभाविक अनुरोध है।
- source_word: עָרֵב
  choice: मधुर
  rationale: यह शब्द सुखद या मीठे होने का भाव देता है; आवाज़ के लिए ‘मधुर’ स्वाभाविक और काव्यात्मक है।
- source_word: נָאוֶה
  choice: मनोहर
  rationale: यह विशेषण सुंदर अथवा आकर्षक होने को व्यक्त करता है; ‘मनोहर’ गीतात्मक गरिमा बनाए रखता है।
- source_word: מַרְאַיִךְ / מַרְאֵיךְ
  choice: रूप
  rationale: दोनों स्थानों पर एक ही हिन्दी शब्द रखने से मूल की शब्दगत पुनरावृत्ति और ‘आवाज़’ के साथ दृश्य समानांतरता बनी रहती है।
