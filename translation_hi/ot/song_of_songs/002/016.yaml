id: SNG.2.16
reference: Song of Songs 2:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דּוֹדִ֥/י לִ/י֙ וַ/אֲנִ֣י ל֔/וֹ הָ/רֹעֶ֖ה בַּ/שּׁוֹשַׁנִּֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/016.yaml
  text: My beloved is mine[c][b][a], and I am his—he who grazes among the lilies.
translation:
  language: hi
  text: मेरा प्रिय मेरा है[a], और मैं उसकी हूँ—वह, जो सोसन के फूलों के बीच चरवाही करता है[b][c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘प्रिय’ का अनुवाद ‘प्रेमी’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी कृदंत का अर्थ ‘चरानेवाला’, ‘चरवाही करनेवाला’ या प्रसंग के अनुसार ‘चरता हुआ’ भी हो सकता है।
    reason: lexical_alternative
  - marker: c
    text: ‘सोसन’ से अभिप्रेत फूल की ठीक-ठीक पहचान निश्चित नहीं है; यह किसी आकर्षक पुष्प के लिए व्यापक नाम भी हो सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹדִי
  choice: मेरा प्रिय
  rationale: गीतगीत में דּוֹד स्त्री के प्रेमी पुरुष के लिए आत्मीय प्रेम-संबोधन है। ‘मेरा प्रिय’ स्वाभाविक और गरिमापूर्ण है तथा इसे केवल यौन अर्थ तक सीमित नहीं करता।
- source_word: לִי
  choice: मेरा है
  rationale: לִי यहाँ संबंध और परस्पर अपनापन व्यक्त करता है। ‘मेरा है’ मूल की संक्षिप्तता बनाए रखता है; ‘मेरा ही है’ अनावश्यक रूप से अनन्यता पर अतिरिक्त बल देता।
- source_word: וַאֲנִי לוֹ
  choice: और मैं उसकी हूँ
  rationale: यह पहले खंड के समानांतर परस्पर संबंध व्यक्त करता है। प्रसंग में वक्ता स्त्री है, इसलिए हिंदी में ‘हूँ’ के साथ स्त्रीलिंग ‘उसकी’ स्वाभाविक है।
- source_word: הָרֹעֶה
  choice: जो ... चरवाही करता है
  rationale: רעה का कृदंत चराने, चरवाही करने या चरने का भाव दे सकता है। ‘चरवाही करता है’ प्रिय को स्वयं पशु की तरह चरता हुआ बताने से बचते हुए चरवाहे की काव्यात्मक छवि सुरक्षित रखता है और किसी स्पष्ट कर्म को मूल से जोड़ता नहीं।
- source_word: בַּשּׁוֹשַׁנִּים
  choice: सोसन के फूलों के बीच
  rationale: בְּ का स्थानवाचक अर्थ यहाँ ‘के बीच’ से स्वाभाविक रूप में व्यक्त होता है। שׁוֹשַׁנִּים के लिए पारंपरिक ‘सोसन के फूल’ रखा गया है, जबकि उसकी ठीक वनस्पति पहचान की अनिश्चितता पादटिप्पणी में बताई गई है।
theological_decisions:
- issue: परस्पर संबंध में अधिकार और अपनापन
  choice: ‘मेरा है ... मैं उसकी हूँ’ की संतुलित संरचना
  alternative: ‘मेरा ही है ... मैं उसी की हूँ’
  rationale: मूल में परस्पर संबंध स्पष्ट है, पर ‘ही/उसी’ जैसा विशेष बल उपस्थित नहीं है। इसलिए अनन्यता का अतिरिक्त धर्मवैचारिक या वैवाहिक निष्कर्ष पाठ में नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, काव्यात्मक और गरिमापूर्ण शैली रखी गई है। ‘सोसन’ पारंपरिक वनस्पति-नाम है, इसलिए सामान्य पाठक की सहायता के लिए उसके साथ ‘के फूल’ जोड़ा गया और पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित रखी गई।
