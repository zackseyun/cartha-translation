  text: הַ/נִּצָּנִים֙ נִרְא֣וּ בָ/אָ֔רֶץ עֵ֥ת הַ/זָּמִ֖יר הִגִּ֑יעַ וְ/ק֥וֹל הַ/תּ֖וֹר נִשְׁמַ֥ע בְּ/אַרְצֵֽ/נוּ׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/012.yaml
  text: The blossoms appear in the land; the time of singing has come[a], and the voice of the turtledove is heard in our land.
translation:
  language: hi
  text: देश में फूल दिखाई देने लगे हैं; गाने का समय आ गया है[a], और हमारे देश में पंडुक की आवाज़ सुनाई देती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “छँटाई का समय आ गया है।” इब्रानी शब्द זָמִיר का अर्थ “गाना/गीत” या “छँटाई” हो सकता है। यहाँ पंडुक की आवाज़ के समानांतर होने के कारण “गाने” को प्राथमिकता दी गई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַנִּצָּנִים
  choice: फूल
  rationale: यह बहुवचन शब्द वसंत में दिखाई देने वाले फूलों या पुष्पों को दर्शाता है। सामान्य आधुनिक हिन्दी में ‘फूल’ स्वाभाविक और स्पष्ट है तथा इसे केवल बंद कलियों तक सीमित नहीं करता।
- source_word: נִרְאוּ
  choice: दिखाई देने लगे हैं
  rationale: ראה के निफ़अल रूप में यहाँ दृश्य होने या प्रकट होने का भाव है। ‘दिखाई देने लगे हैं’ वसंत के आगमन की प्रक्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בָאָרֶץ
  choice: देश में
  rationale: אֶרֶץ यहाँ स्थानीय भूभाग को सूचित करता है; वसंत के इस दृश्य में ‘देश’ ‘पृथ्वी’ की अपेक्षा अधिक उपयुक्त है।
- source_word: עֵת
  choice: समय
  rationale: עֵת समय या ऋतु को दर्शाता है। ‘समय’ मूल संरचना को बनाए रखते हुए सहज हिन्दी देता है।
- source_word: הַזָּמִיר
  choice: गाने
  rationale: זָמִיר का अर्थ ‘गाना/गीत’ अथवा ‘छँटाई’ हो सकता है। अगले खंड में पंडुक की आवाज़ का उल्लेख होने के कारण मुख्य पाठ में ‘गाने’ को प्राथमिकता दी गई है; दूसरा अर्थ पादटिप्पणी में रखा गया है।
- source_word: הִגִּיעַ
  choice: आ गया है
  rationale: इस प्रयोग में क्रिया किसी समय के आ पहुँचने को व्यक्त करती है; ‘आ गया है’ वर्तमान पूर्ण भाव का स्वाभाविक हिन्दी रूप है।
- source_word: וְקוֹל
  choice: और ... आवाज़
  rationale: קוֹל का अर्थ आवाज़ या ध्वनि है। पक्षी के संदर्भ में ‘आवाज़’ आधुनिक हिन्दी में स्वाभाविक है और मूल की काव्यात्मकता बनाए रखती है।
- source_word: הַתּוֹר
  choice: पंडुक
  rationale: תּוֹר सामान्य कबूतर नहीं, विशेष रूप से टर्टलडव को सूचित करता है। ‘पंडुक’ हिन्दी में इस पक्षी का विशिष्ट नाम है।
- source_word: נִשְׁמַע
  choice: सुनाई देती है
  rationale: שמע के निफ़अल रूप का सीधा अर्थ ‘सुनी जाती है/सुनाई देती है’ है। यह अनावश्यक रूप से ‘पुकारना’ नहीं जोड़ता।
- source_word: בְּאַרְצֵנוּ
  choice: हमारे देश में
  rationale: प्रथम पुरुष बहुवचन प्रत्यय साझा और आत्मीय स्थान दर्शाता है; ‘हमारे देश में’ अधिकार-संबंध और काव्यात्मक परिवेश दोनों को सुरक्षित रखता है।
