base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/013.yaml
  text: The fig tree has ripened its early figs[a], and the vines in blossom give off fragrance. Arise, my love, my beautiful one[c][b], and come away.
translation:
  language: hi
  text: अंजीर के पेड़ पर कच्चे अंजीर लग गए हैं[a], और फूलती हुई अंगूर की बेलें सुगंध दे रही हैं[b]। उठ, मेरी प्रिया, मेरी सुंदरी, और चली आ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अंजीर के पेड़ पर उसके आरंभिक फल बन गए हैं।” इब्रानी शब्द कच्चे या विकास की आरंभिक अवस्था वाले अंजीरों का संकेत दे सकते हैं, न कि पूरी तरह पके फलों का।
    reason: lexical_alternative
  - marker: b
    text: या, “अंगूर की बेलों पर कोमल फल सुगंध दे रहे हैं।” इब्रानी शब्द फूल या अंगूर बनने की आरंभिक अवस्था का संकेत दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: शाब्दिक रूप में, “और अपने लिए चली जा”; यहाँ यह प्रस्थान के लिए प्रेमपूर्ण निमंत्रण है, इसलिए “चली आ” का भावार्थ दिया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חָנְטָה פַגֶּיהָ
  choice: कच्चे अंजीर लग गए हैं
  rationale: क्रिया और संज्ञा मिलकर अंजीर के आरंभिक विकास की अवस्था बताती हैं। यह अनुवाद पूर्ण पकने का अर्थ थोपे बिना मौसमी चित्र को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: סְמָדַר
  choice: फूलती हुई
  rationale: यह शब्द अंगूर की बेल के पुष्पित होने या फल बनने की बहुत आरंभिक अवस्था का संकेत देता है; सुगंध के उल्लेख के साथ 'फूलती हुई' सहज बैठता है।
- source_word: נָתְנוּ רֵיחַ
  choice: सुगंध दे रही हैं
  rationale: शाब्दिक भाव 'सुगंध देना' है। हिन्दी में यह स्वाभाविक है और मूल की इंद्रियग्राह्य काव्यात्मक छवि बनाए रखता है।
- source_word: קוּמִי
  choice: उठ
  rationale: स्त्रीलिंग एकवचन आज्ञार्थक रूप यहाँ प्रेमपूर्ण निमंत्रण है; 'उठ' सरल, सीधा और वर्तमान हिन्दी में काव्य-संगत है।
- source_word: רַעְיָתִי
  choice: मेरी प्रिया
  rationale: यह आत्मीय प्रेम-संबोधन है। 'प्रिया' गरिमापूर्ण, सुबोध और गीत की कोमलता के अनुरूप है।
- source_word: יָפָתִי
  choice: मेरी सुंदरी
  rationale: मूल स्त्री की सुंदरता को आत्मीय संबोधन में व्यक्त करता है; 'मेरी सुंदरी' अर्थ और काव्यात्मक स्वर दोनों बनाए रखता है।
- source_word: וּלְכִי לָךְ
  choice: और मेरे साथ चली आ
  rationale: शाब्दिक रूप में 'और अपने लिए जा' जैसा वाक्यांश है, पर प्रसंग में वक्ता अपनी प्रिया को साथ चलने के लिए बुला रहा है। 'मेरे साथ चली आ' इस संबंधगत दिशा को स्वाभाविक हिन्दी में स्पष्ट करता है।
