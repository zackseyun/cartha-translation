base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/008.yaml
  text: The sound of my beloved! Look[a], here he comes, leaping over the mountains, bounding over the hills.
translation:
  language: hi
  text: मेरे प्रिय की आवाज़! देखो[a], वह आ रहा है—पहाड़ों पर छलाँगें लगाता, पहाड़ियों पर उछलता हुआ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मेरे प्रिय की ध्वनि!’; इब्रानी शब्द क़ोल का अर्थ ‘आवाज़’ या ‘ध्वनि’ हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: ק֣וֹל
  choice: आहट
  rationale: קוֹל का अर्थ ‘ध्वनि’ या ‘आवाज़’ हो सकता है। यहाँ प्रिय के बोलने का उल्लेख नहीं, बल्कि उसके आने को पहले सुन लेने का दृश्य है; इसलिए ‘आहट’ स्वाभाविक और प्रसंगानुकूल है, जबकि ‘आवाज़’ को पादटिप्पणी में रखा गया है।
- source_word: דּוֹדִי
  choice: मेरे प्रिय
  rationale: गीतश्रेष्ठ में דּוֹדִי स्त्री वक्ता के पुरुष प्रियतम के लिए स्नेहसूचक संबोधन है। ‘मेरे प्रिय’ आधुनिक, गरिमापूर्ण और काव्यात्मक हिंदी है।
- source_word: הִנֵּה זֶה בָּא
  choice: देखो, वह चला आ रहा है
  rationale: הִנֵּה זֶה ध्यान आकृष्ट कर प्रिय की ओर संकेत करता है, और בָּא उसके सजीव, निकट आते हुए आगमन को व्यक्त करता है। ‘चला आ रहा है’ हिंदी में इस गतिशील दृश्य को स्वाभाविक ढंग से प्रस्तुत करता है।
- source_word: מְדַלֵּג
  choice: छलाँगें लगाता
  rationale: यह कृदंत फुर्तीली, बार-बार होने वाली उछाल को चित्रित करता है। बहुवचन ‘छलाँगें’ पहाड़ों को पार करते आने की जीवंत गति स्पष्ट करता है।
- source_word: עַל הֶהָרִים
  choice: पहाड़ों पर
  rationale: गतिसूचक क्रिया के साथ עַל ऊँचे भूभाग पर अथवा उसके ऊपर से आगे बढ़ने का बिंब देता है। हिंदी में ‘पहाड़ों पर छलाँगें लगाता’ सहज है और स्रोत की स्थानिक व्यापकता बनाए रखता है।
- source_word: מְקַפֵּץ
  choice: उछलता हुआ
  rationale: यह מְדַלֵּג के समानांतर फुर्तीली उछाल व्यक्त करता है। ‘उछलता हुआ’ पुनरुक्ति से बचते हुए काव्यात्मक समानांतरता और गतिशीलता बनाए रखता है।
- source_word: עַל הַגְּבָעוֹת
  choice: पहाड़ियों पर
  rationale: यह ‘पहाड़ों’ के समानांतर किंतु अपेक्षाकृत छोटे भू-आकार को अलग रखता है और सामान्य आधुनिक हिंदी में स्वाभाविक है।
