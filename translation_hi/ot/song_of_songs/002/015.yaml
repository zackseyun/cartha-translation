  yaml_path: translation/ot/song_of_songs/002/015.yaml
  text: Catch the foxes for us[a], the little foxes that ruin the vineyards[c][b], for our vineyards are in blossom.
translation:
  language: hi
  text: हमारे लिए लोमड़ियों को पकड़ो[a]—उन छोटी लोमड़ियों को, जो दाख की बारियों को बिगाड़ती हैं[b]; क्योंकि हमारी दाख की बारियाँ फूलों पर हैं[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू शब्द का अर्थ कुछ संदर्भों में “गीदड़” भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: या, “जो दाख की बारियों को उजाड़ती हैं।”
    reason: lexical_alternative
  - marker: c
    text: या, “हमारी दाख की बारियाँ खिली हुई हैं”; कम संभावना से, “हमारी दाख की बारियों में कोमल अंगूर लगे हैं।”
    reason: lexical_alternative
