  yaml_path: translation/ot/song_of_songs/002/002.yaml
  text: Like a lily among thorns[b][a], so is my beloved among the daughters.
translation:
  language: hi
  text: 'जैसे काँटों के बीच सोसन का फूल,

    वैसे ही युवतियों के बीच मेरी प्रिया है।'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כְּ/שׁוֹשַׁנָּה
  choice: जैसे सोसन का फूल
  rationale: שׁוֹשַׁנָּה किसी सोसन-जैसे फूल को दर्शाता है, पर उसकी सटीक वनस्पति-प्रजाति अनिश्चित है। ‘सोसन का फूल’ पारंपरिक काव्यात्मक बिंब बनाए रखता है और उपसर्ग כְּ को ‘जैसे’ से व्यक्त करता है।
- source_word: בֵּין
  choice: के बीच
  rationale: बहुवचन समूह के संदर्भ में यह स्थान या संगति को दर्शाता है; आधुनिक हिन्दी में ‘के बीच’ स्वाभाविक है और दोनों अर्ध-पंक्तियों की समानांतरता बनाए रखता है।
- source_word: הַחוֹחִים
  choice: काँटों
  rationale: חוֹחִים काँटेदार पौधों या झाड़ियों को सूचित करता है। ‘काँटों’ संक्षिप्त है और कोमल फूल तथा कठोर परिवेश का काव्यात्मक विरोध स्पष्ट रखता है।
- source_word: כֵּן
  choice: वैसे ही
  rationale: כֵּן उपमा के दूसरे भाग का परिचय देता है। ‘वैसे ही’ हिन्दी में ‘जैसे…वैसे ही’ की स्वाभाविक तुलनात्मक संरचना पूरी करता है।
- source_word: רַעְיָתִי
  choice: मेरी प्रिया
  rationale: רַעְיָה स्त्रीलिंग में प्रिय संगिनी या प्रेमिका को दर्शाता है। ‘मेरी प्रिया’ आत्मीय, गरिमापूर्ण और काव्यात्मक है, तथा वक्ता और संबोधित स्त्री के संबंध को स्पष्ट रखता है।
- source_word: הַבָּנוֹת
  choice: युवतियों
  rationale: शाब्दिक अर्थ ‘बेटियाँ’ है, किंतु गीतगीत में यह समूह की स्त्रियों, विशेषकर युवतियों, के लिए मुहावरेदार प्रयोग हो सकता है। हिन्दी में यहाँ ‘बेटियों’ अस्वाभाविक और भ्रामक हो सकता है; ‘युवतियों’ आशय को सहज रूप से व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण काव्य-पंक्ति। ‘जैसे…वैसे ही’ से मूल की समानांतर उपमा सुरक्षित रखी गई है। सटीक पुष्प-प्रजाति की अनिश्चितता के कारण किसी अधिक विशिष्ट आधुनिक वनस्पति-नाम का चयन नहीं किया गया।
