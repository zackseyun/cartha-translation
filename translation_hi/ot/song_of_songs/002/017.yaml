source:
  edition: WLC
  text: עַ֤ד שֶׁ/יָּפ֨וּחַ֙ הַ/יּ֔וֹם וְ/נָ֖סוּ הַ/צְּלָלִ֑ים סֹב֩ דְּמֵה לְ/ךָ֨ דוֹדִ֜/י לִ/צְבִ֗י א֛וֹ לְ/עֹ֥פֶר הָ/אַיָּלִ֖ים עַל הָ֥רֵי בָֽתֶר־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/017.yaml
  text: Until the day breathes and the shadows flee[a], turn[b], my beloved—be like a gazelle or a young stag on the mountains of Bether.
translation:
  language: hi
  text: जब तक दिन साँस ले और छायाएँ भाग जाएँ,[a] तब तक मुड़ जा, मेरे प्रिय—बेतर के पहाड़ों[b] पर चिकारे या जवान नर हिरन के समान बन जा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जब तक दिन ठंडा हो और छायाएँ भाग जाएँ।” इब्रानी में शाब्दिक रूप से दिन के “साँस लेने” या “फूँकने” की बात है। यह काव्यात्मक अभिव्यक्ति प्रायः शाम की ठंडी हवा चलने या भोर की ताज़गी आने के अर्थ में समझी जाती है।
    reason: lexical_alternative
  - marker: b
    text: “बेतर” किसी स्थान का नाम हो सकता है। यह वाक्यांश “अलगाव के पहाड़” या, कम संभावना से, “ऊबड़-खाबड़ पहाड़” भी हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: עַד שֶׁיָּפוּחַ הַיּוֹם
  choice: जब तक दिन साँस लेने लगे
  rationale: פוח का मूल भाव ‘फूँकना/साँस लेना’ है। यह अनुवाद दिन के मानवीकरण और काव्यात्मक सजीवता को बनाए रखता है तथा इसे केवल ‘ठंडा होना’ मानकर अर्थ को सीमित नहीं करता।
- source_word: וְנָסוּ הַצְּלָלִים
  choice: और छायाएँ भाग जाएँ
  rationale: נוּס का सामान्य अर्थ ‘भागना’ है। ‘भाग जाएँ’ छायाओं की गति का सशक्त काव्यात्मक चित्र बनाए रखता है।
- source_word: סֹב
  choice: मुड़ जा
  rationale: סבב के आदेशात्मक रूप का सीधा अर्थ ‘मुड़ना’ है। ‘लौट आ’ संदर्भ में संभव है, पर उसमें दिशा और आगमन का ऐसा अर्थ जुड़ता है जो क्रिया में स्पष्ट नहीं है।
- source_word: דְּמֵה לְךָ
  choice: के समान बन जा
  rationale: यह आदेश प्रिय की तुलना चिकारे या जवान हिरन से करता है। आधुनिक हिन्दी में ‘के समान बन जा’ तुलना और आदेश दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: דּוֹדִי
  choice: मेरे प्रिय
  rationale: यह घनिष्ठ प्रेम-संबंध का संबोधन है। ‘मेरे प्रिय’ आत्मीय, गरिमापूर्ण और आधुनिक हिन्दी में सहज है।
- source_word: לִצְבִי
  choice: चिकारे के समान
  rationale: צְבִי एक सुंदर, तेज़ गज़ेल-सदृश पशु है; भारतीय हिन्दी पाठक के लिए ‘चिकारा’ सटीक और परिचित पद है। उपसर्ग ל यहाँ तुलना प्रकट करता है।
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: जवान हिरन के समान
  rationale: עֹפֶר युवा पशु को और אַיָּלִים हिरन/मृग को सूचित करता है। ‘जवान हिरन’ नर और उसकी युवावस्था की छवि को संक्षेप में बनाए रखता है।
- source_word: עַל הָרֵי בָתֶר
  choice: बेतर के पहाड़ों पर
  rationale: בָתֶר संभवतः स्थान-नाम है, इसलिए मुख्य पाठ में इसका लिप्यंतरण किया गया है। इसके वर्णनात्मक अर्थ अनिश्चित हैं और पादटिप्पणी में दिए गए हैं।
