base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/011.yaml
  text: For look[a], the winter has passed; the rain is over and gone.
translation:
  language: hi
  text: क्योंकि देखो, शीत ऋतु[a] बीत गई है; वर्षा बीत गई, चली गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वर्षा ऋतु।’ यहाँ ‘शीत ऋतु’ के लिए प्रयुक्त इब्रानी शब्द विशेष रूप से वर्षा के मौसम को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले पद के निमंत्रण का कारण प्रस्तुत करता है; ‘क्योंकि’ उसके संयोजक और व्याख्यात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנֵּה
  choice: देखो
  rationale: यह ध्यान खींचने वाला संकेतवाचक अव्यय है; ‘देखो’ आधुनिक, सजीव और सहज है।
- source_word: הַסְּתָו
  choice: शीत ऋतु
  rationale: यह शब्द उस ठंडे मौसम को दर्शाता है जो प्राचीन इस्राएल में वर्षा का समय भी था; मुख्य पाठ में ‘शीत ऋतु’ स्वाभाविक है और अधिक विशिष्ट अर्थ पादटिप्पणी में दिया गया है।
- source_word: עָבָר
  choice: बीत गई है
  rationale: 'पूर्ण हो चुकी क्रिया को वर्तमान परिस्थिति से जोड़ते हुए व्यक्त करता है: वह ऋतु अब समाप्त हो चुकी है।'
- source_word: הַגֶּשֶׁם
  choice: वर्षा
  rationale: मूल संज्ञा और उसके निश्चित संदर्भ को संक्षिप्त, काव्यात्मक हिन्दी में व्यक्त करता है।
- source_word: חָלַף
  choice: बीत गई
  rationale: वर्षा के गुजर जाने या समाप्त हो जाने का भाव रखता है और पहले अर्धपद के समानांतर काव्यात्मकता बनाए रखता है।
- source_word: הָלַךְ לוֹ
  choice: चली गई है
  rationale: यह मुहावरा पिछली क्रिया को तीव्र करता है—वर्षा केवल बीती नहीं, पूरी तरह जा चुकी है।
