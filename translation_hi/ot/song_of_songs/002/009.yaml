  text: דּוֹמֶ֤ה דוֹדִ/י֙ לִ/צְבִ֔י א֖וֹ לְ/עֹ֣פֶר הָֽ/אַיָּלִ֑ים הִנֵּה זֶ֤ה עוֹמֵד֙ אַחַ֣ר כָּתְלֵ֔/נוּ מַשְׁגִּ֨יחַ֙ מִן הַֽ/חֲלֹּנ֔וֹת מֵצִ֖יץ מִן הַֽ/חֲרַכִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/009.yaml
  text: My beloved is like a gazelle or a young stag[a]. Look—there he stands behind our wall, gazing through the windows[b], peering through the lattice.
translation:
  language: hi
  text: मेरा प्रिय चिकारे या युवा नर हिरन[a] के समान है। देखो—वह हमारी दीवार के पीछे खड़ा है; खिड़कियों से निहार रहा है, जालीदार झरोखों[b] से झाँक रहा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘हिरन का बच्चा’। इब्रानी पद हिरन-वंश के एक छोटे या युवा पशु को दर्शाता है; मुख्य पाठ में प्रिय पुरुष के अनुरूप पुल्लिंग बिम्ब बनाए रखने के लिए ‘युवा नर हिरन’ रखा गया है।
    reason: lexical_alternative
  - marker: b
    text: ‘जालीदार झरोखे’ से आशय दीवार या खिड़की के ऐसे सँकरे, जालीदार खुले भागों से है जिनमें से भीतर झाँका जा सकता था; यह आवश्यक नहीं कि वे आधुनिक प्रकार की अलग खिड़कियाँ हों।
    reason: cultural_note
lexical_decisions:
- source_word: דּוֹמֶה
  choice: के समान है
  rationale: इब्रानी कृदंत समानता व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक और काव्यात्मक तुलना है।
- source_word: דוֹדִי
  choice: मेरा प्रिय
  rationale: गीतगीत में यह स्त्री के प्रिय पुरुष के लिए स्नेहपूर्ण सम्बोधन है। ‘मेरा प्रिय’ काव्यात्मक आत्मीयता रखता है और अनावश्यक रूप से अर्थ को केवल यौन सम्बन्ध तक सीमित नहीं करता।
- source_word: לִצְבִי
  choice: चिकारे
  rationale: צְבִי गज़ेल जाति के फुर्तीले पशु को दर्शाता है; ‘चिकारा’ आधुनिक हिन्दी में इस पशु का स्पष्ट और सटीक नाम है।
- source_word: לְעֹפֶר הָאַיָּלִים
  choice: जवान हिरन
  rationale: עֹפֶר किसी छोटे या युवा पशु को और הָאַיָּלִים हिरन-वंश को सूचित करता है। ‘जवान हिरन’ प्रिय पुरुष के साथ मेल खाते पुल्लिंग बिम्ब को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: הִנֵּה זֶה
  choice: देखो! वह
  rationale: यह पद दृश्य की ओर तत्काल और उत्साहपूर्ण ध्यान खींचता है; ‘देखो!’ आधुनिक हिन्दी में उसी जीवंत प्रभाव को व्यक्त करता है।
- source_word: עוֹמֵד
  choice: खड़ा है
  rationale: कृदंत वर्तमान दृश्य को सजीव रूप में प्रस्तुत करता है।
- source_word: אַחַר כָּתְלֵנוּ
  choice: हमारी दीवार के पीछे
  rationale: मूल पाठ में ‘दीवार’ एकवचन है और उस पर प्रथम पुरुष बहुवचन का प्रत्यय है; अनुवाद इस रूप को बनाए रखता है।
- source_word: מַשְׁגִּיחַ מִן הַחֲלֹּנוֹת
  choice: खिड़कियों से निहार रहा है
  rationale: क्रिया ध्यानपूर्वक देखने का भाव देती है। ‘निहार रहा है’ प्रेम-काव्य के प्रसंग में स्वाभाविक है, और ‘से’ खिड़कियों के रास्ते दृष्टि डालने को व्यक्त करता है।
- source_word: מֵצִיץ מִן הַחֲרַכִּים
  choice: जालीदार झरोखों से झाँक रहा है
  rationale: מֵצִיץ सँकरे स्थान से झाँकने को और חֲרַכִּים दीवार या जाली के संकरे खुले भागों को दर्शाता है। यह हिन्दी पदबंध वास्तु-बिम्ब और क्रिया की विशिष्टता दोनों रखता है।
