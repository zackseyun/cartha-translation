  text: עָנָ֥ה דוֹדִ֖/י וְ/אָ֣מַר לִ֑/י ק֥וּמִי לָ֛/ךְ רַעְיָתִ֥/י יָפָתִ֖/י וּ/לְכִי לָֽ/ךְ־׃
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/010.yaml
  text: My beloved answered and said to me, “Rise up, my love, my beautiful one, and come away.”
translation:
  language: hi
  text: मेरे प्रिय ने उत्तर देकर मुझसे कहा, “उठो, मेरी प्रिया, मेरी सुन्दरी, और चली आओ।”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עָנָה
  choice: उत्तर देकर
  rationale: मूल क्रिया का अर्थ ‘उत्तर देना/प्रत्युत्तर देना’ है; ‘उत्तर देकर … कहा’ हिन्दी में स्वाभाविक रहते हुए उसकी संवादात्मक बारी को बनाए रखता है।
- source_word: דּוֹדִי
  choice: मेरे प्रिय
  rationale: गीत के प्रेम-संदर्भ में यह स्त्री वक्ता के पुरुष प्रेमी के लिए स्नेहपूर्ण और स्वाभाविक सम्बोधन है।
- source_word: רַעְיָתִי
  choice: मेरी प्रिया
  rationale: स्त्री प्रेमिका के लिए आत्मीय सम्बोधन को स्पष्ट करता है और आधुनिक साहित्यिक हिन्दी में सहज है।
- source_word: יָפָתִי
  choice: मेरी सुन्दरी
  rationale: शाब्दिक अर्थ ‘मेरी सुन्दर [स्त्री]’ को स्नेहपूर्ण संज्ञात्मक सम्बोधन के रूप में व्यक्त करता है।
- source_word: קוּמִי לָךְ … וּלְכִי לָךְ
  choice: उठो … और चली आओ
  rationale: स्त्रीलिंग आज्ञार्थक क्रियाओं और आवाहन की गति को स्वाभाविक हिन्दी में व्यक्त करता है; दोहराया हुआ לָךְ यहाँ प्रस्थान/आने के आग्रह को बल देता है, पर हिन्दी में उसे अलग शब्द से दुहराना कृत्रिम होता।
