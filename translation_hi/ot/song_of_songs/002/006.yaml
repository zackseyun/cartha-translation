lexical_decisions:
- source_word: שְׂמֹאלוֹ
  choice: उसका बायाँ हाथ
  rationale: इब्रानी शब्द बाईं ओर या बाएँ हाथ/बाँह को सूचित कर सकता है। इस शारीरिक संदर्भ में ‘बायाँ हाथ’ सहज और निकटतम स्पष्ट अनुवाद है।
- source_word: תַּחַת
  choice: के नीचे
  rationale: यह पूर्वसर्ग स्पष्ट रूप से किसी वस्तु के नीचे की स्थिति बताता है; आधुनिक हिन्दी में ‘के नीचे’ स्वाभाविक है।
- source_word: לְרֹאשִׁי
  choice: मेरे सिर
  rationale: רֹאשׁ का सामान्य अर्थ ‘सिर’ है। यहाँ ठोस शारीरिक बिंब को बिना विस्तार दिए रखा गया है।
- source_word: וִימִינוֹ
  choice: और उसका दायाँ हाथ
  rationale: यह शब्द दाईं ओर या दाएँ हाथ/बाँह को सूचित कर सकता है। पहले पदांश के समानांतर ‘दायाँ हाथ’ स्पष्ट और स्वाभाविक है।
- source_word: תְּחַבְּקֵנִי
  choice: मुझे आलिंगन में लिए हुए है
  rationale: חבק का अर्थ आलिंगन करना है। यह प्रयोग वर्तमान आत्मीय दृश्य और निरंतर निकटता को स्वाभाविक हिन्दी में व्यक्त करता है।
