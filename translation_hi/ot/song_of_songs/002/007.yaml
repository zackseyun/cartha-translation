  text: הִשְׁבַּ֨עְתִּי אֶתְ/כֶ֜ם בְּנ֤וֹת יְרוּשָׁלִַ֨ם֙ בִּ/צְבָא֔וֹת א֖וֹ בְּ/אַיְל֣וֹת הַ/שָּׂדֶ֑ה אִם תָּעִ֧ירוּ וְֽ/אִם תְּעֽוֹרְר֛וּ אֶת הָ/אַהֲבָ֖ה עַ֥ד שֶׁ/תֶּחְפָּֽץ־׀־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/song_of_songs/002/007.yaml
  text: 'I adjure you[a], daughters of Jerusalem[c][b], by the gazelles or by the does of the field: do not stir up or awaken love until it pleases.'
translation:
  language: hi
  text: 'हे यरूशलेम की बेटियो, मैं तुम्हें चिकारों या मैदान की हिरनियों की शपथ दिलाती हूँ[a]: प्रेम को न जगाओ, न उभारो, जब तक वह न चाहे।[b]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मैं तुम्हें ... की शपथ के अधीन करती हूँ।” इब्रानी में “चिकारों या मैदान की हिरनियों” है; यह एक काव्यात्मक शपथ-वाक्य है। कुछ लोग यहाँ परमेश्वर के नामों की प्रतिध्वनि देने वाली शब्द-क्रीड़ा देखते हैं, पर सीधा अर्थ पशुओं का ही है।
    reason: lexical_alternative_and_cultural_note
  - marker: b
    text: या, “प्रेम को न जगाओ, न उभारो, जब तक प्रेम न चाहे।” इब्रानी क्रिया स्त्रीलिंग एकवचन है और ‘प्रेम’ की ओर संकेत कर सकती है; हिन्दी का ‘वह’ इस काव्यात्मक मानवीकरण और संदर्भगत अस्पष्टता को बनाए रखता है।
    reason: alternative_reading
lexical_decisions:
- source_word: הִשְׁבַּעְתִּי אֶתְכֶם
  choice: मैं तुम्हें ... शपथ दिलाती हूँ
  rationale: हिफ़ील रूप का अर्थ किसी को शपथ के अधीन करना या गंभीरतापूर्वक शपथ दिलाना है। स्त्रीलिंग वक्ता का संकेत प्रसंग से स्पष्ट है; हिन्दी में क्रिया पर लिंग दिखाना स्वाभाविक है।
- source_word: בְּנוֹת יְרוּשָׁלִַם
  choice: हे यरूशलेम की बेटियो
  rationale: यह सीधे और साहित्यिक संबोधन को बनाए रखता है; ‘युवतियो’ की अपेक्षा मूल रूप ‘बेटियो’ के अधिक निकट है।
- source_word: בִּצְבָאוֹת
  choice: चिकारे
  rationale: यहाँ צְבָאוֹת का अर्थ सेनाएँ नहीं, बल्कि बहुवचन ‘चिकारे’ है; अगली समानांतर पशु-छवि इसकी पुष्टि करती है।
- source_word: אוֹ
  choice: और
  rationale: मूलतः ‘या’ होने पर भी हिन्दी की शपथ-सूची में ‘चिकारे और ... हिरनियों की शपथ’ अधिक स्वाभाविक है और दोनों समानांतर काव्य-छवियों को साथ रखता है; पादटिप्पणी में शाब्दिक विकल्प दिया गया है।
- source_word: בְּאַיְלוֹת הַשָּׂדֶה
  choice: मैदान की हिरनियों
  rationale: स्त्रीलिंग बहुवचन पशु-छवि और ‘मैदान’ का संबंध दोनों सुरक्षित रहते हैं।
- source_word: אִם תָּעִירוּ וְאִם תְּעוֹרְרוּ
  choice: न जगाओ, न उकसाओ
  rationale: शपथ के बाद אִם निषेधात्मक बल रखता है। दोनों निकटार्थी क्रियाओं को अलग रखकर मूल की काव्यात्मक तीव्रता बचाई गई है।
- source_word: הָאַהֲבָה
  choice: प्रेम
  rationale: हिन्दी में भाववाचक संज्ञा ‘प्रेम’ बिना संकेतवाचक निर्धारक के स्वाभाविक और गरिमापूर्ण है।
- source_word: עַד שֶׁתֶּחְפָּץ
  choice: जब तक कि वह स्वयं न चाहे
  rationale: स्त्रीलिंग क्रिया का पूर्वपद ‘प्रेम’ है। ‘वह’ मूल की मानवीकरण-संभावना और संदर्भगत अस्पष्टता को बनाए रखता है; ‘स्वयं’ अकाल या बलपूर्वक जगाने के निषेध को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में स्त्रीलिंग क्रिया का संदर्भ और प्रेम का मानवीकरण
  choice: ‘वह स्वयं न चाहे’—‘वह’ को प्रेम की ओर संकेत करने दिया गया है
  alternative: ‘जब तक उसका उचित समय न आए’ या ‘जब तक वह तैयार न हो’
  rationale: मूल पाठ प्रेम को स्त्रीलिंग व्याकरणिक पूर्वपद बनाता है और संभवतः उसका मानवीकरण करता है। ‘उचित समय’ अर्थ की व्याख्या तो करता है, पर मूल में उपस्थित इच्छा/चाहने के भाव को समय-संबंधी कथन में बदल देता है।
- issue: पशुओं द्वारा शपथ की काव्यात्मक अभिव्यक्ति
  choice: पशु-छवि को उसके सीधे अर्थ में रखा गया
  alternative: इसे परमेश्वर के नामों की ओर संकेत करने वाली शब्द-क्रीड़ा के रूप में मुख्य पाठ में व्यक्त करना
  rationale: समानांतरता में चिकारे और मैदान की हिरनियाँ प्रत्यक्ष अर्थ हैं। संभावित शब्द-क्रीड़ा अनिश्चित है और उसे मुख्य पाठ में लाने से अनावश्यक धार्मिक व्याख्या आरोपित होगी।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, काव्यात्मक और गरिमापूर्ण रखी गई है। ‘हे ... बेटियो’ संबोधन की साहित्यिकता बचाता है; ‘शपथ दिलाती हूँ’ सामान्य पाठक के लिए बोधगम्य रहते हुए मूल के गंभीर शपथात्मक बल को व्यक्त करता है।
