  yaml_path: translation/ot/song_of_songs/002/005.yaml
  text: Sustain me with raisin cakes[a]; refresh me with apples[c][b], for I am sick with love.
translation:
  language: hi
  text: किशमिश की टिकियों से मुझे सहारा दो[a]; सेबों से मुझे तरोताज़ा करो[b], क्योंकि मैं प्रेम से बीमार हूँ[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किशमिश की पिंडियों से” अथवा “दबाए हुए अंगूरों की टिकियों से।”
    reason: lexical_alternative
  - marker: b
    text: जिस इब्रानी शब्द का अनुवाद परंपरागत रूप से “सेब” किया जाता है, वह किसी अन्य सुगंधित फल को भी सूचित कर सकता है; उसकी सटीक वनस्पतिक पहचान अनिश्चित है।
    reason: cultural_note
  - marker: c
    text: या “मैं प्रेम-विह्वल हूँ।”
    reason: lexical_alternative
lexical_decisions:
- source_word: סַמְּכוּנִי
  choice: मुझे सहारा दो
  rationale: बहुवचन आज्ञार्थक क्रिया का मूल अर्थ सहारा देना या संभालना है; यह शारीरिक और भावनात्मक निर्बलता दोनों के संदर्भ में स्वाभाविक है।
- source_word: בָּאֲשִׁישׁוֹת
  choice: किशमिश की टिकियों से
  rationale: אֲשִׁישׁוֹת दबाए हुए अंगूर या किशमिश से बनी टिकियों को सूचित करता है; यह अनुवाद संभावित खाद्य पदार्थ को सहज हिन्दी में व्यक्त करता है।
- source_word: רַפְּדוּנִי
  choice: मुझे ताज़गी दो
  rationale: רפד का मूल चित्र बिछाने या सहारा देने से जुड़ा हो सकता है, पर यहाँ समानांतर खाद्य-बिंब में पुनः स्फूर्ति देने का भाव प्रसंगानुकूल है।
- source_word: בַּתַּפּוּחִים
  choice: सेबों से
  rationale: परंपरागत अर्थ 'सेब' रखा गया है, जबकि फल की सटीक वनस्पतिक पहचान की अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पहले दिए गए दोनों आग्रहों का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्पष्ट तथा स्वाभाविक है।
- source_word: חוֹלַת אַהֲבָה
  choice: प्रेम की रोगी हूँ
  rationale: स्त्रीलिंग חוֹלַת और אַהֲבָה की संबंधात्मक रचना को निकटता से व्यक्त करते हुए प्रेम के कारण व्याकुल या अस्वस्थ होने का काव्यात्मक रूपक बनाए रखता है।
- source_word: אָֽנִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम वक्ता के स्पष्ट आत्म-संदर्भ को बनाए रखता है।
theological_decisions:
- issue: प्रेम की बीमारी का रूपक
  choice: प्रेम की रोगी हूँ
  alternative: मैं प्रेम-विह्वल हूँ
  rationale: मूल पाठ बीमारी की तीव्र देहात्मक उपमा रखता है; उसे केवल भावनात्मक व्याकुलता में नरम नहीं किया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण काव्यात्मक हिन्दी। स्त्री वक्ता को स्त्रीलिंग रूप से स्पष्ट किया गया है। समानांतर आज्ञार्थक पंक्तियाँ और प्रेम-जनित बीमारी का सशक्त रूपक सुरक्षित रखे गए हैं।
