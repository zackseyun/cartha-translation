  naturalness: The compact two-line poetic structure is natural. Replacing the specialized compound ‘केसर-पुष्प’ with the familiar botanical loanword ‘क्रोकस’ and ‘सोसन’ with ‘लिली’ improves clarity for modern Hindi readers while retaining the verse’s parallelism.
