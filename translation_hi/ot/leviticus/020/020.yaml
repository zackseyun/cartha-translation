  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת דֹּ֣דָת֔/וֹ עֶרְוַ֥ת דֹּד֖/וֹ גִּלָּ֑ה חֶטְאָ֥/ם יִשָּׂ֖אוּ עֲרִירִ֥ים יָמֻֽתוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/020.yaml
  text: If a man lies with his aunt[a], he has uncovered his uncle’s nakedness. They shall bear their sin[b]; they shall die childless.
translation:
  language: hi
  text: यदि कोई पुरुष अपने चाचा की पत्नी के साथ सोए, तो उसने अपने चाचा की नग्नता प्रकट की है[a]। वे दोनों अपने पाप का भार उठाएँगे[b]; वे निःसंतान मरेंगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने अपने चाचा की नग्नता प्रकट की है।” लैव्यव्यवस्था में यह निषिद्ध निकट संबंध में यौन-संबंध के लिए प्रयुक्त मुहावरा है; यहाँ चाचा की पत्नी के साथ संबंध को इस प्रकार कहा गया है।
    reason: cultural_note
  - marker: b
    text: या, “वे दोनों अपने दोष का भार उठाएँगे।” हिब्रू मुहावरा पाप अथवा उससे उत्पन्न दोष-दायित्व—दोनों को व्यक्त कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: यदि कोई पुरुष
  rationale: कानूनी प्रसंग में यह पदबंध एक शर्तात्मक मामले का परिचय देता है; ‘पुरुष’ मूल के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: יִשְׁכַּב אֶת
  choice: के साथ सोए
  rationale: यह यौन-संबंध का हिब्रू मुहावरा है; हिंदी में यह स्वाभाविक है और मूल की शिष्ट परोक्षता बनाए रखता है।
- source_word: דֹּדָתוֹ
  choice: अपनी चाची
  rationale: यह शब्द पिता या माता के भाई की पत्नी को सूचित करता है। ‘चाची’ सामान्य हिंदी में चाचा की पत्नी के लिए स्पष्ट और सहज है, और अगला वाक्य चाचा से संबंध स्पष्ट करता है।
- source_word: עֶרְוַת דֹּדוֹ גִּלָּה
  choice: उसने अपने चाचा का तन उघाड़ा है
  rationale: लैव्यव्यवस्था के निषिद्ध यौन-संबंध संबंधी विशिष्ट मुहावरे को बनाए रखा गया है। ‘तन’ आधुनिक हिंदी में ‘नंगापन’ की अपेक्षा अधिक स्वाभाविक और गरिमापूर्ण है।
- source_word: חֶטְאָם יִשָּׂאוּ
  choice: वे दोनों अपने पाप का भार उठाएँगे
  rationale: बहुवचन दोनों पक्षों की उत्तरदायिता दर्शाता है। ‘दोनों’ हिंदी में निहित बहुवचन को स्पष्ट करता है; ‘पाप का भार उठाना’ मूल मुहावरे को सुरक्षित रखता है।
- source_word: עֲרִירִים יָמֻתוּ
  choice: वे निःसंतान मरेंगे
  rationale: संक्षिप्त हिब्रू दंड-वाक्य को बिना उसके साधन या समय का अनुमान लगाए ज्यों का त्यों रखा गया है।
theological_decisions:
- issue: עֲרִירִים יָמֻתוּ में दंड का आशय
  choice: वे निःसंतान मरेंगे
  alternative: वे बिना संतान के मरेंगे / उनकी कोई जीवित संतान नहीं रहेगी
  rationale: मूल केवल अंतिम दशा बताता है, यह नहीं बताता कि निःसंतानता कैसे या कब घटित होगी; इसलिए अधिक विशिष्ट दंड-विवरण नहीं जोड़ा गया।
- issue: חֶטְאָם में ‘पाप’ या ‘दोष’
  choice: अपने पाप का भार उठाएँगे
  alternative: अपने दोष का भार उठाएँगे
  rationale: חטא स्वयं अपराध और उससे उत्पन्न दोष-दायित्व दोनों को व्यक्त कर सकता है। मुख्य पाठ में ‘पाप’ रखा गया और वास्तविक वैकल्पिक अर्थ को पादटिप्पणी में सुरक्षित किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध रखी गई है। निषिद्ध यौन-संबंध के लैव्यव्यवस्था-संबंधी मुहावरे को व्याख्यात्मक विस्तार दिए बिना सुरक्षित रखा गया है।
