language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/אִישׁ אֲשֶׁר יִשְׁכַּ֨ב אֶת אִשָּׁ֜ה דָּוָ֗ה וְ/גִלָּ֤ה אֶת עֶרְוָתָ/הּ֙ אֶת מְקֹרָ֣/הּ הֶֽעֱרָ֔ה וְ/הִ֕יא גִּלְּתָ֖ה אֶת מְק֣וֹר דָּמֶ֑י/הָ וְ/נִכְרְת֥וּ שְׁנֵי/הֶ֖ם מִ/קֶּ֥רֶב עַמָּֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/018.yaml
  text: If a man lies with a woman during her menstrual impurity and uncovers her nakedness—he has laid bare her flow[c][b][a], and she has uncovered the flow of her blood—both of them shall be cut off from among their people.
translation:
  language: hi
  text: यदि कोई पुरुष किसी स्त्री के मासिक धर्म की अशुद्धता के समय उसके साथ यौन-संबंध रखे और उसका नंगापन प्रकट करे—उसने उसका स्रोत खोल दिया है,[a] और उस स्त्री ने अपने रक्त का स्रोत प्रकट किया है—तो वे दोनों अपने लोगों के बीच से काट दिए जाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसने उसका स्रोत खोल दिया है, और उसने अपने रक्त का स्रोत प्रकट किया है।” यहाँ “स्रोत” रक्तस्राव के शारीरिक स्रोत के लिए प्रयुक्त रूपक है।
    reason: lexical_alternative
  - marker: b
    text: “काट दिए जाएँगे” तोरा में प्रयुक्त एक मानक कानूनी सूत्र है; यहाँ यह नहीं बताया गया कि यह दण्ड किस प्रकार लागू किया जाएगा।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: पुल्लिंग एकवचन कानूनी संरचना और यौन प्रसंग को ठीक रूप से व्यक्त करता है।
- source_word: יִשְׁכַּב אֶת אִשָּׁה
  choice: किसी स्त्री के साथ यौन-संबंध रखे
  rationale: इब्रानी मुहावरे का अर्थ स्पष्ट और स्वाभाविक आधुनिक हिन्दी में देता है; शाब्दिक ‘सोए’ यहाँ अनावश्यक रूप से अस्पष्ट होता।
- source_word: דָּוָה
  choice: मासिक धर्म की अशुद्धता के समय
  rationale: यह मासिक धर्म और उससे जुड़ी लैव्यव्यवस्था की अनुष्ठानिक अशुद्धता—दोनों को व्यक्त करता है।
- source_word: גִלָּה אֶת עֶרְוָתָהּ
  choice: उसका नंगापन उघाड़े
  rationale: लैव्यव्यवस्था के मानक यौन-कानूनी मुहावरे और उसकी अंतर्पाठीय संगति को बनाए रखता है।
- source_word: מְקֹרָהּ הֶעֱרָה
  choice: उसके रक्तस्राव का स्रोत खोल दिया है
  rationale: מָקוֹר के मूल ‘स्रोत’ बिंब को रखते हुए प्रसंगगत शारीरिक आशय स्पष्ट करता है; הֶעֱרָה को ‘खोल दिया’ से स्वाभाविक रूप मिलता है।
- source_word: וְהִיא גִּלְּתָה אֶת מְקוֹר דָּמֶיהָ
  choice: और उसने भी अपने रक्त का स्रोत प्रकट किया है
  rationale: स्त्री की समान भागीदारी और इब्रानी समानांतरता को व्यक्त करता है तथा ‘रक्त का स्रोत’ रूपक को सुरक्षित रखता है।
- source_word: וְנִכְרְתוּ
  choice: काट दिए जाएँगे
  rationale: तोरा के मानक दण्ड-विधान सूत्र को उसके क्रियान्वयन का तरीका निर्धारित किए बिना बनाए रखता है।
- source_word: מִקֶּרֶב עַמָּם
  choice: अपने लोगों के बीच से
  rationale: सामुदायिक-वाचा संबंधी परिवेश को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: דָּוָה में स्त्री की दशा
  choice: मासिक धर्म की अशुद्धता
  alternative: जब उसका मासिक धर्म चल रहा हो; मासिक धर्म के समय
  rationale: लैव्यव्यवस्था के प्रसंग में यह केवल जैविक मासिक धर्म नहीं, उससे जुड़ी अनुष्ठानिक अशुद्धता भी सूचित करता है।
- issue: ‘काट दिए जाएँगे’ दण्ड का स्वरूप
  choice: मानक सूत्र को बिना व्याख्यात्मक विस्तार के बनाए रखा
  alternative: मृत्युदण्ड दिया जाएगा; समुदाय से निकाल दिए जाएँगे; निःसन्तान मरेंगे
  rationale: यह पद दण्ड के क्रियान्वयन की विधि स्पष्ट नहीं करता; किसी एक विवादित अर्थ को मुख्य पाठ में थोपना उचित नहीं।
- issue: पुरुष और स्त्री की भागीदारी
  choice: ‘उसने भी’ द्वारा स्त्री की समान भागीदारी स्पष्ट की
  alternative: साधारण ‘और उसने’
  rationale: इब्रानी וְהִיא में स्वतंत्र सर्वनाम स्त्री पर बल देता है, जिसे हिन्दी में ‘भी’ स्वाभाविक ढंग से दर्शाता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण कानूनी हिन्दी अपनाई गई है। ‘यौन-संबंध’ अर्थ को सामान्य पाठक के लिए स्पष्ट करता है, जबकि ‘नंगापन उघाड़े,’ ‘स्रोत,’ और ‘काट दिए जाएँगे’ मूल इब्रानी के प्रमुख मुहावरों, रूपक और जानबूझकर छोड़ी गई अस्पष्टता को सुरक्षित रखते हैं।
