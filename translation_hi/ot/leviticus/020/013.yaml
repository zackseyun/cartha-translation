id: LEV.20.13
reference: Leviticus 20:13
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִשְׁכַּ֤ב אֶת זָכָר֙ מִשְׁכְּבֵ֣י אִשָּׁ֔ה תּוֹעֵבָ֥ה עָשׂ֖וּ שְׁנֵי/הֶ֑ם מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/013.yaml
  text: If a man lies with a male as one lies with a woman[a], both of them have done an abomination; they shall surely be put to death[b]; their blood is on them.
translation:
  language: hi
  text: यदि कोई पुरुष किसी नर के साथ उस प्रकार सोए जिस प्रकार वह स्त्री के साथ सोता है[a], तो उन दोनों ने घृणित काम किया है। उन दोनों को अवश्य मार डाला जाए; उनका रक्त उन्हीं पर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, “स्त्री के शयनों की तरह”; यह स्त्री के साथ यौन-संबंध का मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका रक्त-दोष उन्हीं पर है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: यदि कोई पुरुष
  rationale: कानूनी प्रसंग में यह पदबंध शर्तसूचक उपवाक्य आरम्भ करता है। ‘यदि कोई पुरुष’ आधुनिक हिन्दी में स्वाभाविक है और אִישׁ के पुरुषवाचक अर्थ को बनाए रखता है।
- source_word: יִשְׁכַּב אֶת
  choice: के साथ ... सोए
  rationale: इस प्रसंग में שׁכב यौन-संबंध का मुहावरा है। ‘के साथ सोना’ स्रोत की रूपकात्मक अभिव्यक्ति के निकट और सामान्य हिन्दी में समझने योग्य है।
- source_word: זָכָר
  choice: किसी नर
  rationale: זָכָר का अर्थ ‘नर’ है और यह אִישׁ (‘पुरुष’) से शब्दगत रूप से अलग है; अनुवाद में यह भेद सुरक्षित रखा गया है।
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: ऐसे ... जैसे स्त्री के साथ सोया जाता है
  rationale: शाब्दिक रूप ‘स्त्री के शयनों’ हिन्दी में अस्वाभाविक होगा। यह वाक्यांश स्त्री के साथ यौन-संबंध का मुहावरा है, जिसे मुख्य पाठ में स्वाभाविक रूप से व्यक्त कर फुटनोट में मूल रूप बताया गया है।
- source_word: תּוֹעֵבָה
  choice: घिनौना काम
  rationale: यह תּוֹעֵבָה की तीव्र नैतिक और वाचा-संबंधी निन्दा को साधारण आधुनिक हिन्दी में व्यक्त करता है; ‘घृणित काम’ भी सम्भव है।
- source_word: עָשׂוּ שְׁנֵיהֶם
  choice: उन दोनों ने ... किया है
  rationale: इब्रानी पाठ दोनों सहभागियों को स्पष्ट रूप से कर्ता ठहराता है; ‘उन दोनों’ उस द्विगुण बल को बनाए रखता है।
- source_word: מוֹת יוּמָתוּ
  choice: उन्हें निश्चय ही मार डाला जाए
  rationale: क्रियार्थक संज्ञा और निष्क्रिय क्रिया का संयोजन दण्ड की निश्चितता पर बल देता है। ‘निश्चय ही’ उस बल को व्यक्त करता है और निष्क्रियता भी बनाए रखता है।
- source_word: דְּמֵיהֶם בָּם
  choice: उनका खून उन्हीं के सिर पर है
  rationale: यह हिन्दी का परिचित कानूनी-नैतिक मुहावरा है जो उनकी मृत्यु की जिम्मेदारी उन्हीं पर ठहराता है। मूल में ‘सिर’ शब्द नहीं है, इसलिए वैकल्पिक अधिक शाब्दिक अर्थ फुटनोट में दिया गया है।
theological_decisions:
- issue: नैतिक और सांस्कृतिक रूप से विवादित विधान का अनुवाद
  choice: इब्रानी विधान में वर्णित विशिष्ट कृत्य और उसके दण्ड को बिना नरम किए या विस्तार दिए सीधे व्यक्त किया गया है।
  alternative: ‘समलैंगिकता’ अथवा आधुनिक पहचान-आधारित शब्दावली का प्रयोग।
  rationale: मूल पाठ आधुनिक यौन पहचान की श्रेणी नहीं, एक विशिष्ट कृत्य का वर्णन करता है; इसलिए अनुवाद में स्रोत से अधिक व्यापक या संकीर्ण अवधारणा नहीं जोड़ी गई।
- issue: אִישׁ और זָכָר का भेद
  choice: ‘पुरुष’ और ‘नर’
  alternative: दोनों के लिए ‘पुरुष’
  rationale: मूल पाठ दो अलग शब्दों का प्रयोग करता है। हिन्दी में कुछ असामान्यता के बावजूद यह भेद अर्थगत साक्ष्य को सुरक्षित रखता है।
- issue: रक्त-वाक्यांश का अर्थ
  choice: ‘उनका खून उन्हीं के सिर पर है’ के द्वारा मृत्यु की जिम्मेदारी उन्हीं पर होना व्यक्त किया गया।
  alternative: ‘उनका रक्त-दोष उन्हीं पर है।’
  rationale: דְּמֵיהֶם בָּם में ‘खून’ और ‘रक्त-दोष’ दोनों अर्थ-छायाएँ सम्भव हैं। मुख्य पाठ में स्वाभाविक हिन्दी मुहावरा रखा गया और वैकल्पिक अर्थ फुटनोट में सुरक्षित किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी स्वर वाली रखी गई है। ‘सोए’ मूल मुहावरे की मर्यादित स्पष्टता बनाए रखता है; ‘नर’ इब्रानी के शब्दगत भेद को सुरक्षित करता है। दोनों फुटनोट-चिह्न मुख्य पाठ में उपस्थित हैं।
