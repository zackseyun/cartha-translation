source:
  edition: WLC
  text: וְ/עֶרְוַ֨ת אֲח֧וֹת אִמְּ/ךָ֛ וַ/אֲח֥וֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה כִּ֧י אֶת שְׁאֵר֛/וֹ הֶעֱרָ֖ה עֲוֺנָ֥/ם יִשָּֽׂאוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/019.yaml
  text: You shall not uncover the nakedness of your mother's sister or of your father's sister[a], for he has laid bare his own flesh[b]; they shall bear their iniquity.
translation:
  language: hi
  text: तुम अपनी माता की बहन या अपने पिता की बहन की नग्नता न उघाड़ना, क्योंकि उसने अपने ही निकट रक्त-संबंधी को उघाड़ा है।[a] वे अपने अधर्म का भार उठाएँगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘अपने ही मांस को।’ यहाँ इसका अर्थ अपना निकट रक्त-संबंधी या कुटुम्बी है।
    reason: lexical_alternative
  - marker: b
    text: ‘अपने अधर्म का भार उठाएँगे’ का अर्थ ‘अपने दोष का भार उठाएँगे’ या ‘अपने अधर्म का दंड भोगेंगे’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: नग्नता न उघाड़ना
  rationale: लैव्यव्यवस्था के यौन-निषेधों में यह स्थापित इब्रानी मुहावरा है। इसे बनाए रखने से विधिक शैली और आसपास के पदों से इसका संबंध सुरक्षित रहता है; अधिक व्याख्यात्मक ‘यौन-संबंध न रखना’ मूल रूपक को मिटा देता।
- source_word: אֲחוֹת אִמְּךָ וַאֲחוֹת אָבִיךָ
  choice: अपनी माता की बहन या अपने पिता की बहन
  rationale: यह मूल के रिश्तेदारी-सूचक शब्दों का सीधा और स्पष्ट रूप है। इब्रानी समन्वय यहाँ निषेध के दो वैकल्पिक संबंधों को प्रस्तुत करता है, इसलिए स्वाभाविक हिन्दी में ‘या’ उपयुक्त है।
- source_word: שְׁאֵרוֹ
  choice: अपने ही मांस
  rationale: שְׁאֵר निकट रक्त-संबंधी को ‘मांस’ की ठोस रिश्तेदारी-छवि से व्यक्त करता है। मुख्य पाठ में इस रूपक को रखा गया है और अर्थ को पादटिप्पणी में स्पष्ट किया गया है।
- source_word: הֶעֱרָה
  choice: उघाड़ा है
  rationale: ערה का अर्थ नंगा या प्रकट करना है। ‘उघाड़ा है’ पहली पंक्ति के यौन-विधिक मुहावरे से संबंध बनाए रखता है और इब्रानी क्रिया की ठोस छवि को सुरक्षित रखता है।
- source_word: עֲוֺנָם יִשָּׂאוּ
  choice: वे अपने अधर्म का भार उठाएँगे
  rationale: נשא עון दोष, अधर्म और उसके परिणाम को वहन करने का संक्षिप्त इब्रानी मुहावरा है। ‘भार उठाएँगे’ उसके नैतिक और दंडात्मक दोनों संभावित पक्षों को खुला रखता है।
theological_decisions:
- issue: कारणवाचक उपवाक्य के एकवचन से दंडवाचक उपवाक्य के बहुवचन में परिवर्तन
  choice: ‘उसने अपने ही मांस को उघाड़ा है’ के बाद ‘वे ... उठाएँगे’
  alternative: 'पूरे कथन को बहुवचन में समतल करना: ‘उन्होंने अपने ही मांस को उघाड़ा है; वे ...’'
  rationale: इब्रानी पाठ कारणवाचक खंड में पुल्लिंग एकवचन और अंतिम खंड में बहुवचन रखता है। इस तनाव को बनाए रखना स्रोत के प्रति पारदर्शी है और दायित्व में दोनों सहभागियों के सम्मिलित होने की संभावना को बिना अतिरिक्त व्याख्या के व्यक्त करता है।
- issue: यौन-संबंध के मुहावरे को मुख्य पाठ में स्पष्ट करके कहना या मूल रूप में रखना
  choice: ‘नग्नता न उघाड़ना’ को बनाए रखना
  alternative: ‘यौन-संबंध न रखना’
  rationale: मूल मुहावरा पवित्रता-संहिता की विधिक और साहित्यिक बनावट का महत्त्वपूर्ण अंग है। संदर्भ उसका यौन अर्थ स्पष्ट करता है, इसलिए उसे व्याख्यात्मक वाक्यांश से बदलना आवश्यक नहीं है।
- issue: עָוֹן को अधर्म, दोष या दंड के रूप में समझना
  choice: ‘अधर्म का भार उठाएँगे’
  alternative: ‘अपने दोषी होने का दंड भोगेंगे’
  rationale: इब्रानी संज्ञा स्वयं किए गए अधर्म, उससे उत्पन्न दोष और उसके दंडात्मक परिणाम तक का बोध करा सकती है। चुना हुआ रूप इस अर्थ-व्याप्ति को संकुचित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘माता’ और ‘पिता’ औपचारिक बाइबिलीय संदर्भ के अनुकूल हैं, जबकि वाक्यरचना साधारण पाठक के लिए सीधी है। ‘नग्नता उघाड़ना,’ ‘अपने ही मांस’ और ‘अधर्म का भार उठाना’ जैसे मूल मुहावरों को अर्थ-स्पष्टीकरण वाली पादटिप्पणियों के साथ सुरक्षित रखा गया है।
