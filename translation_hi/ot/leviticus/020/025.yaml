  text: וְ/הִבְדַּלְתֶּ֞ם בֵּֽין הַ/בְּהֵמָ֤ה הַ/טְּהֹרָה֙ לַ/טְּמֵאָ֔ה וּ/בֵין הָ/ע֥וֹף הַ/טָּמֵ֖א לַ/טָּהֹ֑ר וְ/לֹֽא תְשַׁקְּצ֨וּ אֶת נַפְשֹֽׁתֵי/כֶ֜ם בַּ/בְּהֵמָ֣ה וּ/בָ/ע֗וֹף וּ/בְ/כֹל֙ אֲשֶׁ֣ר תִּרְמֹ֣שׂ הָֽ/אֲדָמָ֔ה אֲשֶׁר הִבְדַּ֥לְתִּי לָ/כֶ֖ם לְ/טַמֵּֽא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/025.yaml
  text: So you shall distinguish between the clean animal and the unclean[a], and between the unclean bird and the clean; and you shall not make yourselves detestable by the animal or by the bird or by anything that creeps on the ground[b], which I have set apart for you as unclean.
translation:
  language: hi
  text: इसलिए शुद्ध पशु और अशुद्ध पशु में, तथा अशुद्ध पक्षी और शुद्ध पक्षी में भेद करो। किसी पशु, पक्षी, या भूमि पर रेंगनेवाले किसी भी जीव के कारण अपने आपको घृणित न बनाओ[a], जिसे मैंने तुम्हारे लिए अशुद्ध ठहराकर अलग किया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने आपको घिनौना न बनाओ।” यहाँ प्रयुक्त इब्रानी क्रिया का अर्थ घृणित या घिनौना बनाना है; यह सामान्यतः “अशुद्ध होना” के लिए प्रयुक्त शब्द नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִבְדַּלְתֶּם
  choice: इसलिए तुम ... भेद करना
  rationale: हिफ़ील रूप श्रेणियों के बीच भेद बनाए रखने का आदेश देता है। संदर्भगत संयोजक को स्वाभाविक हिन्दी में ‘इसलिए’ से व्यक्त किया गया है।
- source_word: הַבְּהֵמָה
  choice: पशु
  rationale: यहाँ भूमि पर रहनेवाले पशुओं की व्यापक श्रेणी अभिप्रेत है; ‘पशु’ आधुनिक हिन्दी में सहज और पर्याप्त व्यापक है।
- source_word: הַטְּהֹרָה / הַטְּמֵאָה / הַטָּמֵא / הַטָּהֹר
  choice: शुद्ध / अशुद्ध
  rationale: ये लैव्यव्यवस्था की आहार-संबंधी और अनुष्ठानिक श्रेणियाँ हैं; ‘शुद्ध/अशुद्ध’ इन्हें नैतिक या स्वास्थ्य-संबंधी अर्थ में बदले बिना स्पष्ट रखता है।
- source_word: הָעוֹף
  choice: पक्षी
  rationale: इस आहार-संबंधी संदर्भ में ‘पक्षी’ सबसे स्वाभाविक हिन्दी पद है।
- source_word: וְלֹא תְשַׁקְּצוּ אֶת נַפְשֹׁתֵיכֶם
  choice: अपने आप को घिनौना न बनाना
  rationale: שׁקץ का अर्थ घृणास्पद या घिनौना बनाना है, न कि केवल अशुद्ध होना। נַפְשֹׁתֵיכֶם यहाँ पूरे व्यक्तियों के लिए मुहावरेदार प्रयोग है, इसलिए ‘अपने आप को’ चुना गया है।
- source_word: וּבְכֹל אֲשֶׁר תִּרְמֹשׂ הָאֲדָמָה
  choice: भूमि पर रेंगनेवाले किसी भी जीव
  rationale: רמשׂ भूमि के निकट रेंगने या चलने का बोध देता है; ‘जीव’ जोड़ने से हिन्दी में वाक्य स्वाभाविक और अर्थ स्पष्ट होता है।
- source_word: אֲשֶׁר הִבְדַּלְתִּי לָכֶם לְטַמֵּא
  choice: उन्हें मैंने तुम्हारे लिए अशुद्ध ठहराकर अलग किया है
  rationale: यह अनुवाद परमेश्वर द्वारा इस्राएल के लिए इन जीवों को अशुद्ध श्रेणी में अलग ठहराने के भाव को सुरक्षित रखता है।
theological_decisions:
- issue: अनुष्ठानिक श्रेणी बनाम नैतिक अर्थ
  choice: शुद्ध/अशुद्ध को वाचा-संबंधी अनुष्ठानिक श्रेणियों के रूप में रखा गया
  alternative: पवित्र/अपवित्र या अच्छा/बुरा
  rationale: पद का विषय इस्राएल की आहार और पवित्रता-संबंधी वर्गीकरण व्यवस्था है; नैतिक भाषा मूल अर्थ को अनावश्यक रूप से बदल देती।
- issue: נֶפֶשׁ का अर्थ
  choice: अपने आप को
  alternative: अपने प्राणों को
  rationale: इस वाक्य में נֶפֶשׁ पूरे व्यक्ति को सूचित करता है; ‘प्राणों’ से शरीर और आत्मा के ऐसे भेद का संकेत मिल सकता है जो इब्रानी मुहावरे में अपेक्षित नहीं है।
- issue: שׁקץ और טמא के बीच भेद
  choice: घिनौना बनाना और अशुद्ध ठहराना अलग-अलग रखा गया
  alternative: दोनों को ‘अशुद्ध करना/होना’ कहना
  rationale: मूल पाठ जानबूझकर दो अलग अर्थ-क्षेत्रों के शब्द प्रयोग करता है; उन्हें एक ही हिन्दी शब्द में मिला देना इस तनाव को मिटा देता।
translation_notes:
  register: आधुनिक मानक हिन्दी में आज्ञार्थक शैली रखी गई है। ‘घिनौना’ साधारण पाठक के लिए बोधगम्य है, जबकि पादटिप्पणी में अधिक औपचारिक विकल्प ‘घृणित’ दिया गया है। सर्वनाम ‘तुम’ मूल बहुवचन संबोधन को स्वाभाविक सामुदायिक आदेश के रूप में व्यक्त करता है।
