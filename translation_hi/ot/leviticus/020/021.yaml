id: LEV.20.21
reference: Leviticus 20:21
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֥ר יִקַּ֛ח אֶת אֵ֥שֶׁת אָחִ֖י/ו נִדָּ֣ה הִ֑וא עֶרְוַ֥ת אָחִ֛י/ו גִּלָּ֖ה עֲרִירִ֥ים יִהְיֽוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/021.yaml
  text: And if a man takes his brother’s wife[a], it is uncleanness; he has uncovered his brother’s nakedness[b]. They shall be childless.
translation:
  language: hi
  text: और यदि कोई पुरुष अपने भाई की पत्नी को ग्रहण करे, तो यह अशुद्धता है[a]; उसने अपने भाई की नग्नता उघाड़ी है। वे निःसंतान होंगे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘यह अपवित्रता है।’ इब्रानी शब्द धार्मिक और नैतिक अर्थ में अशुद्धता या दूषण को सूचित कर सकता है।
    reason: lexical_alternative
  - marker: b
    text: या ‘वे निःसंतान मरेंगे।’ इब्रानी में अधिक शाब्दिक रूप से ‘वे निःसंतान होंगे’ है; यह नहीं बताया गया कि यह दंड किस प्रकार पूरा होगा।
    reason: alternative_reading
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: और यदि कोई पुरुष
  rationale: संयोजक וְ इस विधान को पिछले नियमों से जोड़ता है, और इस कानूनी रचना में אֲשֶׁר सशर्त अर्थ देता है।
- source_word: יִקַּח
  choice: ग्रहण करे
  rationale: לקח का मूल अर्थ ‘लेना’ है और वैवाहिक प्रसंग में किसी स्त्री को पत्नी के रूप में ग्रहण करने का संकेत दे सकता है। ‘ग्रहण करे’ इस संकेत को बनाए रखता है, पर औपचारिक विवाह-विधि को अनावश्यक रूप से स्पष्ट नहीं करता।
- source_word: אֵשֶׁת אָחִיו
  choice: अपने भाई की पत्नी
  rationale: यह इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: נִדָּה הִוא
  choice: यह अशुद्धता है
  rationale: נִדָּה यहाँ धार्मिक-नैतिक अशुद्धता या दूषण का बोध करा सकता है। नपुंसकलिंग ‘यह’ इस कृत्य या संबंध की ओर संकेत करता है, स्त्री को स्वयं अशुद्ध ठहराने की ओर नहीं।
- source_word: עֶרְוַת אָחִיו גִּלָּה
  choice: उसने अपने भाई की नग्नता उघाड़ी है
  rationale: लैव्यव्यवस्था में अवैध यौन संबंध के लिए प्रयुक्त मूल इब्रानी मुहावरे और उसकी अंतर्पाठीय संगति को बनाए रखा गया है।
- source_word: עֲרִירִים יִהְיוּ
  choice: वे निःसंतान होंगे
  rationale: עֲרִירִים का अर्थ संतान से रहित होना है। बहुवचन रूप के कारण दंपती दोनों को ‘वे’ से व्यक्त किया गया है; दंड किस प्रकार पूरा होगा, यह नहीं जोड़ा गया।
theological_decisions:
- issue: עֲרִירִים יִהְיוּ में दंड का स्वरूप
  choice: वे निःसंतान होंगे
  alternative: वे निःसंतान मरेंगे
  rationale: इब्रानी पाठ स्पष्ट रूप से निःसंतान होने की बात कहता है, पर मृत्यु या दंड के कार्यान्वयन की रीति स्पष्ट नहीं करता। अनुवाद इस अस्पष्टता को सुरक्षित रखता है।
- issue: נִדָּה הִוא का कर्ता-संदर्भ
  choice: यह अशुद्धता है
  alternative: वह अशुद्ध है
  rationale: प्रसंग में पद को स्त्री पर व्यक्तिगत विशेषण लगाने के बजाय निषिद्ध संबंध या कृत्य का मूल्यांकन समझना अधिक उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण कानूनी-बाइबलीय स्वर रखा गया है। ‘ग्रहण करे’ और ‘नग्नता उघाड़ी’ कुछ औपचारिक हैं, पर मूल की कानूनी अभिव्यक्ति और स्थापित यौन-संबंधी मुहावरे को सुरक्षित रखते हुए सामान्य पाठक के लिए बोधगम्य हैं।
