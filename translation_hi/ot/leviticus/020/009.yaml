language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי אִ֣ישׁ אִ֗ישׁ אֲשֶׁ֨ר יְקַלֵּ֧ל אֶת אָבִ֛י/ו וְ/אֶת אִמּ֖/וֹ מ֣וֹת יוּמָ֑ת אָבִ֧י/ו וְ/אִמּ֛/וֹ קִלֵּ֖ל דָּמָ֥י/ו בּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/009.yaml
  text: For any man who curses his father or his mother shall surely be put to death[a]; he has cursed his father and his mother[c][b]; his blood is on him.
translation:
  language: hi
  text: क्योंकि जो कोई अपने पिता या अपनी माता को शाप देता है, वह निश्चय ही मार डाला जाए; उसने अपने पिता और अपनी माता को शाप दिया है। उसका खून उसी के सिर पर है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विधान से संबंध रखते हुए इस दंड-विधान का आधार प्रस्तुत करता है।
- source_word: אִישׁ אִישׁ
  choice: जो कोई
  rationale: दोहराया गया संज्ञा-रूप वितरणात्मक मुहावरा है; आधुनिक हिन्दी में ‘जो कोई’ उसका स्वाभाविक और व्यापक अर्थ व्यक्त करता है।
- source_word: יְקַלֵּל / קִלֵּל
  choice: शाप देता है / शाप दिया है
  rationale: पिएल रूप यहाँ केवल अनादर नहीं, बल्कि माता-पिता के विरुद्ध शाप बोलने का विशिष्ट अर्थ देता है।
- source_word: אָבִיו וְאֶת אִמּוֹ
  choice: अपने पिता या अपनी माता
  rationale: हिब्रू में संयोजक ‘और’ है, पर कानूनी वितरणात्मक अर्थ में माता या पिता में से किसी एक को शाप देना भी दंड के लिए पर्याप्त है; हिन्दी में ‘या’ इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाए
  rationale: क्रिया के साथ infinitive absolute दंड की निश्चितता और प्रबलता व्यक्त करता है; कर्मवाच्य न्यायिक दंड को बनाए रखता है।
- source_word: דָּמָיו בּוֹ
  choice: उसका खून उसी के सिर पर है
  rationale: यह हिन्दी का परिचित न्यायिक मुहावरा है, जो बताता है कि अपनी मृत्यु की जिम्मेदारी अपराधी पर स्वयं है।
theological_decisions:
- issue: אִישׁ אִישׁ का लिंग और वितरणात्मक अर्थ
  choice: जो कोई
  alternative: हर पुरुष
  rationale: यह कानूनी सूत्र व्याकरणतः पुल्लिंग होते हुए प्रतिनिधिक और वितरणात्मक है। ‘जो कोई’ अनावश्यक रूप से दायरा केवल पुरुषों तक सीमित किए बिना मूल का आशय देता है।
- issue: דָּמָיו בּוֹ में मृत्यु की जिम्मेदारी
  choice: उसका खून उसी के सिर पर है
  alternative: उसका रक्त-दोष उसी पर है
  rationale: मुख्य पाठ में न्यायिक जिम्मेदारी का मुहावरा सुरक्षित रखा गया है और प्रायश्चित या किसी अन्य बाद की धर्मवैचारिक धारणा को इसमें नहीं जोड़ा गया।
- issue: माता-पिता के बीच וְ का कानूनी बल
  choice: अपने पिता या अपनी माता
  alternative: अपने पिता और अपनी माता
  rationale: कानूनी संदर्भ में अपराध दोनों को एक साथ शाप देने तक सीमित नहीं है; किसी एक माता-पिता को शाप देना भी दंडनीय है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘मार डाला जाए’ न्यायिक कर्मवाच्य को और ‘उसी के सिर पर’ जिम्मेदारी के पारंपरिक हिन्दी मुहावरे को व्यक्त करता है।
