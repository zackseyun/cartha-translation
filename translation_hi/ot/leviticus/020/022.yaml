reference: Leviticus 20:22
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֤ם אֶת כָּל חֻקֹּתַ/י֙ וְ/אֶת כָּל מִשְׁפָּטַ֔/י וַ/עֲשִׂיתֶ֖ם אֹתָ֑/ם וְ/לֹא תָקִ֤יא אֶתְ/כֶם֙ הָ/אָ֔רֶץ אֲשֶׁ֨ר אֲנִ֜י מֵבִ֥יא אֶתְ/כֶ֛ם שָׁ֖מָּ/ה לָ/שֶׁ֥בֶת בָּֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/022.yaml
  text: So you shall keep all my statutes and all my judgments and do them[b][a], so that the land to which I am bringing you to dwell in it may not vomit you out.
translation:
  language: hi
  text: इसलिए तुम मेरी सब विधियों और मेरे सब न्याय-विधानों[a] को मानो और उनका पालन करो, ताकि जिस देश में मैं तुम्हें बसने के लिए ले जा रहा हूँ, वह तुम्हें उगल न दे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मेरी सब विधियों और मेरे सब न्यायिक निर्णयों।” इब्रानी में यहाँ दो अलग विधिक शब्द—חֻקּוֹת और מִשְׁפָּטִים—हैं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ “उलटी करके बाहर न निकाल दे।” इब्रानी क्रिया देश द्वारा अशुद्ध निवासियों को निकाल फेंकने की सजीव उपमा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: इसलिए तुम ... पालन करना
  rationale: שׁמר का विधिक-वाचाई अर्थ ‘पालन करना’ है। आरंभिक וּ संदर्भ में पिछले चेतावनी-वचन से निष्कर्षात्मक संबंध रखता है, जिसे ‘इसलिए’ स्पष्ट करता है।
- source_word: חֻקֹּתַי
  choice: मेरी ... विधियों
  rationale: חֻקָּה निर्धारित विधि या विधान को सूचित करता है। ‘विधियाँ’ सहज आधुनिक हिन्दी है और साथ आए दूसरे विधिक पद से भिन्न रहता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे ... न्याय-विधानों
  rationale: מִשְׁפָּט न्यायिक निर्णय, नियम या विधिक विधान का अर्थ रख सकता है। ‘न्याय-विधान’ उसके न्यायिक-विधिक रंग को बनाए रखते हुए חֻקּוֹת से भेद रखता है।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: और उन्हें मानना
  rationale: कानूनी आदेशों के साथ עשה का आशय उन्हें व्यवहार में लाना है। हिन्दी में ‘उन्हें मानना’ शाब्दिक ‘उन्हें करना’ से अधिक स्वाभाविक है और क्रियान्वयन का भाव रखता है।
- source_word: וְלֹא תָקִיא אֶתְכֶם
  choice: वह तुम्हें उगल न दे
  rationale: קיא का मूल अर्थ उलटी करके बाहर निकालना है। ‘उगल न दे’ देश द्वारा निवासियों को बाहर फेंकने की सजीव और कठोर उपमा को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: यहाँ אֶרֶץ उस विशिष्ट भूभाग को दर्शाता है जहाँ इस्राएल को बसाया जाना है; हिन्दी बाइबिलीय संदर्भ में ‘देश’ स्वाभाविक है।
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה לָשֶׁבֶת בָּהּ
  choice: जिस देश में मैं तुम्हें बसने के लिए ले जा रहा हूँ
  rationale: यह रूप गंतव्य, परमेश्वर की जारी क्रिया और ישׁב के बसने/निवास करने के भाव को सहज हिन्दी में व्यक्त करता है; स्रोत की स्थानसूचक पुनरुक्ति को अनावश्यक रूप से नहीं दोहराता।
theological_decisions:
- issue: देश द्वारा निवासियों को बाहर निकालने की उपमा
  choice: देश को मानवीकृत करके ‘वह तुम्हें उगल न दे’ रखा गया है।
  alternative: देश तुम्हें निकाल न दे / अस्वीकार न कर दे
  rationale: स्रोत का קיא जानबूझकर तीखा और शारीरिक रूपक है। इसे नरम करने से भूमि की अशुद्धि और वाचा-संबंधी निष्कासन की चेतावनी का प्रभाव घटेगा।
- issue: חֻקּוֹת और מִשְׁפָּטִים का भेद
  choice: ‘विधियों’ और ‘न्याय-विधानों’ के रूप में दो अलग विधिक पद रखे गए हैं।
  alternative: आज्ञाओं और नियमों / विधियों और नियमों
  rationale: मूल पाठ दो अलग कानूनी श्रेणियों का प्रयोग करता है। अलग हिन्दी पद उस भेद को बनाए रखते हैं, यद्यपि उनके अर्थ-क्षेत्र आंशिक रूप से एक-दूसरे से मिलते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। आज्ञार्थक बहुवचन ‘तुम ... करना’ स्रोत के सामूहिक संबोधन को रखता है। ‘उगल न दे’ जानबूझकर सजीव है, जबकि ‘बसने के लिए’ ישׁב का स्वाभाविक आधुनिक रूप है।
