  text: וְ/שַׂמְתִּ֨י אֲנִ֧י אֶת פָּנַ֛/י בָּ/אִ֥ישׁ הַ/ה֖וּא וּ/בְ/מִשְׁפַּחְתּ֑/וֹ וְ/הִכְרַתִּ֨י אֹת֜/וֹ וְ/אֵ֣ת כָּל הַ/זֹּנִ֣ים אַחֲרָ֗י/ו לִ/זְנ֛וֹת אַחֲרֵ֥י הַ/מֹּ֖לֶךְ מִ/קֶּ֥רֶב עַמָּֽ/ם־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/005.yaml
  text: then I myself will set my face against that man and against his family[a], and I will cut off him and all who prostitute themselves after him by prostituting themselves after Molech[b], from among their people.
translation:
  language: hi
  text: तब मैं स्वयं उस मनुष्य और उसके परिवार के विरुद्ध अपना मुख कर दूँगा, और उसे तथा उन सभी को, जो उसके पीछे चलकर मोलेक के पीछे व्यभिचार करते हैं,[a] उनके लोगों के बीच से काट डालूँगा।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “व्यभिचार करना” मूर्तिपूजा के द्वारा परमेश्वर के प्रति विश्वासघात के लिए प्रयुक्त रूपक है।
    reason: lexical_alternative
  - marker: b
    text: “काट डालना” वाचा के न्याय की अभिव्यक्ति है; यहाँ यह स्पष्ट नहीं किया गया कि यह मृत्यु, समुदाय से निष्कासन, या किसी अन्य प्रकार के दैवी हटाए जाने के द्वारा होगा।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְשַׂמְתִּי אֲנִי אֶת־פָּנַי
  choice: तब मैं स्वयं ... के विरुद्ध अपना मुख करूँगा
  rationale: इब्रानी मुहावरे और אֲנִי के बल को बनाए रखते हुए परमेश्वर के सचेत विरोध और न्याय को व्यक्त करता है।
- source_word: בָּאִישׁ הַהוּא
  choice: उस मनुष्य के विरुद्ध
  rationale: אִישׁ के एकवचन पुल्लिंग अर्थ को स्वाभाविक आधुनिक हिन्दी में बनाए रखता है।
- source_word: וּבְמִשְׁפַּחְתּוֹ
  choice: और उसके परिवार के विरुद्ध
  rationale: מִשְׁפָּחָה परिवार, घराने या व्यापक कुल को सूचित कर सकता है; 'परिवार' सबसे स्वाभाविक और पर्याप्त रूप से व्यापक है।
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: उसे ... काट डालूँगा
  rationale: वाचा-संबंधी न्याय के כרת मुहावरे को सुरक्षित रखता है और दंड की ठीक विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: וְאֵת כָּל־הַזֹּנִים אַחֲרָיו
  choice: उन सभी को, जो उसके पीछे व्यभिचार करते हुए
  rationale: זנה की यौन बेवफाई वाली मूर्तिपूजा-संबंधी उपमा को बनाए रखता है; 'उसके पीछे' अपराधी के उदाहरण का अनुसरण व्यक्त करता है।
- source_word: לִזְנוֹת אַחֲרֵי הַמֹּלֶךְ
  choice: मोलेक के पीछे व्यभिचार करते हैं
  rationale: दोहराई गई זנה उपमा और אַחֲרֵי के अनुचित धार्मिक अनुसरण—दोनों को सुरक्षित रखता है।
- source_word: הַמֹּלֶךְ
  choice: मोलेक
  rationale: इस प्रसंग में पारंपरिक रूप से समझे गए देवता के नाम का प्रचलित हिन्दी लिप्यंतरण है।
- source_word: מִקֶּרֶב עַמָּם
  choice: उनके लोगों के बीच से
  rationale: बहुवचन प्रत्यय को संयुक्त कर्म—उस मनुष्य और उसका अनुसरण करने वालों—के अनुरूप दर्शाता है।
theological_decisions:
- issue: मूर्तिपूजा के लिए यौन बेवफाई की उपमा
  choice: '''व्यभिचार करते हैं'' के द्वारा זנה की उपमा बनाए रखना'
  alternative: '''विश्वासघात करते हैं'' या ''मूर्तिपूजा करते हैं'''
  rationale: मूल पाठ मूर्तिपूजा को वाचा-संबंधी यौन बेवफाई के रूप में चित्रित करता है; सामान्यीकृत अनुवाद इसकी आलंकारिक और धर्मवैचारिक तीव्रता घटा देगा।
- issue: वाचा के न्याय में 'काट डालना'
  choice: मुख्य पाठ में 'काट डालूँगा' रखना
  alternative: '''मार डालूँगा'', ''समुदाय से निकाल दूँगा'' या ''नष्ट कर दूँगा'''
  rationale: यह पद दैवी निष्कासन या विनाश का न्याय घोषित करता है, पर यहाँ उसकी ठीक विधि नहीं बताता; इसलिए अस्पष्टता बनाए रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। 'अपना मुख करूँगा', 'व्यभिचार' और 'काट डालूँगा' मूल इब्रानी की प्रमुख उपमाओं और न्याय-संबंधी तनाव को सुरक्षित रखते हैं।
