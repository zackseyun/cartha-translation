  yaml_path: translation/ot/leviticus/020/008.yaml
  text: You shall keep my statutes and do them. I am Yahweh[a], who sanctifies you.
translation:
  language: hi
  text: तुम मेरी विधियों का पालन करना और उन्हें पूरा करना। मैं याहवे हूँ, जो तुम्हें पवित्र करता हूँ[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जो तुम्हें पवित्र बनाता हूँ।”
    reason: मְקַדִּשְׁכֶם के लिए अंग्रेज़ी POB audit trail में दिए गए पारदर्शी शब्दार्थ-विकल्प को सुरक्षित रखता है।
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: तुम ... पालन करना
  rationale: שׁמר का अर्थ यहाँ वाचा-संबंधी विधियों को मानना और उनका पालन करना है। हिंदी में आज्ञार्थक संदर्भ में यह स्वाभाविक और स्पष्ट है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: חֻקָּה निर्धारित नियम या विधान को सूचित करता है; ‘विधियाँ’ कानूनी भाव रखते हुए सामान्य पाठक के लिए सुबोध है।
- source_word: וַעֲשִׂיתֶם אֹתָם
  choice: और उन्हें मानना
  rationale: עשה का यहाँ अर्थ विधियों को व्यवहार में पूरा करना है। ‘मानना’ केवल मानसिक सहमति नहीं, बल्कि आज्ञापालन का स्वाभाविक हिंदी भाव देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय ईश-नाम को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: מְקַדִּשְׁכֶם
  choice: जो तुम्हें पवित्र करता हूँ
  rationale: קדשׁ का हिफ़ील कृदंत परमेश्वर की निरंतर अथवा विशिष्ट करने वाली क्रिया व्यक्त करता है। ‘पवित्र करता हूँ’ आधुनिक हिंदी में स्पष्ट है और पवित्रता की मुख्य शब्दावली बनाए रखता है।
theological_decisions:
- issue: ईश-नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश-नाम है, इसलिए ‘प्रभु’ जैसी उपाधि नहीं रखी गई। आधुनिक हिंदी बाइबल-पाठकों के बीच अधिक पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ को चुना गया; ‘याहवे’ अधिक संभावित विद्वत् पुनर्निर्मित उच्चारण है।
- issue: מְקַדִּשְׁכֶם में पवित्र करने की क्रिया
  choice: जो तुम्हें पवित्र करता हूँ
  alternative: जो तुम्हें अपने लिए अलग करता हूँ
  rationale: ‘पवित्र करता हूँ’ קדשׁ की धार्मिक और वाचा-संबंधी शब्दावली को बनाए रखता है। ‘अपने लिए अलग करता हूँ’ उसका एक व्याख्यात्मक आयाम है, पर मूल की समूची पवित्रता-अवधारणा को सीमित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सीधी रखी गई है। बहुवचन संबोधन ‘तुम’ से व्यक्त है। पहले वाक्य में हिंदी का आज्ञार्थक रूप प्रसंग की विधिक आज्ञा को स्वाभाविक रूप से संप्रेषित करता है।
