source:
  edition: WLC
  text: וְ/אִ֡ם הַעְלֵ֣ם יַעְלִימֽוּ֩ עַ֨ם הָ/אָ֜רֶץ אֶת עֵֽינֵי/הֶם֙ מִן הָ/אִ֣ישׁ הַ/ה֔וּא בְּ/תִתּ֥/וֹ מִ/זַּרְע֖/וֹ לַ/מֹּ֑לֶךְ לְ/בִלְתִּ֖י הָמִ֥ית אֹתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/004.yaml
  text: But if the people of the land deliberately close their eyes to that man when he gives some of his offspring to Molech[a], so as not to put him to death[c][b],
translation:
  language: hi
  text: पर यदि देश के लोग उस मनुष्य से जान-बूझकर अपनी आँखें मूँद लें[a], जब वह अपनी सन्तान में से किसी को[b] मोलेक[c] को देता है, ताकि वे उसे मृत्युदण्ड न दें,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक अर्थ है ‘उस मनुष्य से अपनी आँखें छिपा लें’; आशय है उसे जानबूझकर पूरी तरह अनदेखा करना।
    reason: lexical_alternative
  - marker: b
    text: ‘सन्तान’ के लिए मूल इब्रानी शब्द का शाब्दिक अर्थ ‘बीज’ है।
    reason: lexical_alternative
  - marker: c
    text: ‘मोलेक’ किसी देवता अथवा बाल-बलि से जुड़े किसी अनुष्ठान का नाम हो सकता है; एक अन्य सम्भव पाठ है ‘राजा को’।
    reason: alternative_reading
lexical_decisions:
- source_word: הַעְלֵם יַעְלִימוּ אֶת־עֵינֵיהֶם
  choice: जान-बूझकर अपनी आँखें मूँद लें
  rationale: इन्फिनिटिव एब्सोल्यूट और सीमित क्रिया का संयोजन कार्य पर बल देता है। ‘आँखें मूँद लेना’ हिन्दी में जानबूझकर अनदेखा करने का स्वाभाविक मुहावरा है और इब्रानी बिंब को भी बनाए रखता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: इस विधिक प्रसंग में यह पद देश अथवा समुदाय के जनसाधारण को सूचित करता है, किसी विशेष सामाजिक वर्ग को नहीं।
- source_word: מִזַּרְעוֹ
  choice: अपनी सन्तान में से किसी को
  rationale: मूल शब्द का शाब्दिक अर्थ ‘बीज’ है, पर यहाँ वह सन्तान को सूचित करता है। מִן अंशवाचक है, इसलिए ‘में से किसी को’ उपयुक्त है।
- source_word: לַמֹּלֶךְ
  choice: मोलेक को
  rationale: लैव्यव्यवस्था 18:21 और 20:2–5 के उपासना-संबंधी प्रसंग में इसे पारम्परिक रूप से नाम अथवा पदनाम ‘मोलेक’ माना जाता है; लिप्यन्तरण व्याख्यात्मक विस्तार से बचता है।
- source_word: לְבִלְתִּי הָמִית אֹתוֹ
  choice: ताकि वे उसे मृत्युदण्ड न दें
  rationale: रचना उद्देश्य अथवा परिणति व्यक्त करती है। विधिक प्रसंग में ‘मृत्युदण्ड देना’ हिन्दी का स्पष्ट और गरिमापूर्ण न्यायिक प्रयोग है।
theological_decisions:
- issue: לַמֹּלֶךְ का आशय
  choice: मोलेक
  alternative: राजा को; अथवा बाल-बलि से जुड़ी किसी अनुष्ठानिक संज्ञा के रूप में
  rationale: इस खण्ड का प्रसंग निषिद्ध उपासना-कर्म की ओर प्रबल संकेत करता है, पर पद की सटीक पहचान विवादित है। मुख्य पाठ में स्थापित लिप्यन्तरण रखा गया और वास्तविक अनिश्चितता पादटिप्पणी में बताई गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक प्रसंग के अनुरूप गरिमापूर्ण पर सहज रखी गई है। पद अगले वाक्यांश से जुड़ता है, इसलिए अन्त में अल्पविराम रखा गया है। ‘जान-बूझकर अपनी आँखें मूँद लें’ इब्रानी मुहावरे और उसके बलाघात दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
