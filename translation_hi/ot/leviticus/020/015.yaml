id: LEV.20.15
reference: Leviticus 20:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִתֵּ֧ן שְׁכָבְתּ֛/וֹ בִּ/בְהֵמָ֖ה מ֣וֹת יוּמָ֑ת וְ/אֶת הַ/בְּהֵמָ֖ה תַּהֲרֹֽגוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/015.yaml
  text: If a man has sexual intercourse with an animal, he must surely be put to death, and you shall kill the animal.
translation:
  language: hi
  text: यदि कोई पुरुष किसी पशु के साथ संभोग करे, तो उसे निश्चय ही मृत्युदंड दिया जाए, और तुम उस पशु को भी मार डालो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: यह संज्ञा पुल्लिंग एकवचन है और यहाँ विशेष रूप से पुरुष अपराधी को सूचित करती है; अगला पद स्त्री के मामले को अलग से संबोधित करता है।
- source_word: אֲשֶׁר
  choice: यदि
  rationale: यद्यपि यह मूलतः संबंधवाचक अव्यय है, विधिक प्रसंग में इसका स्वाभाविक हिन्दी रूप सशर्त ‘यदि’ है।
- source_word: יִתֵּן שְׁכָבְתּוֹ
  choice: संभोग करे
  rationale: शाब्दिक इब्रानी मुहावरा ‘अपना शयन दे’ है; ‘संभोग करे’ आधुनिक हिन्दी में यौन क्रिया को स्पष्ट, संक्षिप्त और गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בִּבְהֵמָה
  choice: किसी पशु के साथ
  rationale: בְּהֵמָה का सामान्य अर्थ पशु है; संबंधसूचक उपसर्ग को हिन्दी में ‘के साथ’ से स्वाभाविक रूप दिया गया है।
- source_word: מוֹת יוּמָת
  choice: उसे निश्चय ही मृत्युदंड दिया जाए
  rationale: धातु के पूर्णभावक रूप और सीमित क्रिया का संयोजन दंड की निश्चितता और विधिक बल पर जोर देता है; यह हिन्दी रूप दोनों को बनाए रखता है।
- source_word: וְאֶת־הַבְּהֵמָה תַּהֲרֹגוּ
  choice: और तुम उस पशु को भी मार डालो
  rationale: बहुवचन क्रिया को ‘तुम’ से सुरक्षित रखा गया है। ‘भी’ अपराधी के साथ पशु को मारने के संयुक्त आदेश को हिन्दी में स्पष्ट करता है, जबकि ‘मार डालो’ क्रिया की घातक परिणति व्यक्त करता है।
theological_decisions:
- issue: अपराधी का लिंग
  choice: 'पुरुष-विशिष्ट: ‘कोई पुरुष’'
  alternative: 'लिंग-निरपेक्ष: ‘कोई व्यक्ति’'
  rationale: इब्रानी पाठ पुरुष को निर्दिष्ट करता है और अगला पद स्त्री के मामले को अलग रखता है; लिंग-निरपेक्ष अनुवाद विधिक संरचना को धुंधला कर देता।
- issue: מוֹת יוּמָת की विधिक अभिव्यक्ति
  choice: 'निष्क्रिय रूप: ‘मृत्युदंड दिया जाए’'
  alternative: 'सक्रिय आदेश: ‘उसे मार डालना’'
  rationale: इब्रानी निष्क्रिय रूप अपराधी पर लागू अनिवार्य दंड बताता है और दंड देने वाले पक्ष को स्पष्ट नहीं करता; हिन्दी में वही अनिर्दिष्टता रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, स्पष्ट और विधिक-गरिमापूर्ण है। यौन क्रिया के लिए अस्पष्ट शाब्दिक मुहावरे के बजाय सामान्य एवं सटीक ‘संभोग’ चुना गया है। अपराधी के दंड में निष्क्रिय विधिक वाक्य और समुदाय को दिए आदेश में बहुवचन ‘तुम’ के बीच मूल पाठ का अंतर सुरक्षित है।
