source:
  edition: WLC
  text: וִ/הְיִ֤יתֶם לִ/י֙ קְדֹשִׁ֔ים כִּ֥י קָד֖וֹשׁ אֲנִ֣י יְהוָ֑ה וָ/אַבְדִּ֥ל אֶתְ/כֶ֛ם מִן הָֽ/עַמִּ֖ים לִ/הְי֥וֹת לִֽ/י־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/026.yaml
  text: You shall be holy to me[a], because I, Yahweh, am holy, and I have separated you from the peoples to be mine.
translation:
  language: hi
  text: तुम मेरे लिए पवित्र होगे, क्योंकि मैं, याहवे, पवित्र हूँ; और मैंने तुम्हें जातियों[a] से अलग किया है, ताकि तुम मेरे बनो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “लोगों के समूहों से।” इब्रानी शब्द עַמִּים का अर्थ “जातियाँ” या “लोगों के समूह” हो सकता है और कुछ प्रसंगों में “राष्ट्र” भी।
    reason: lexical_alternative
lexical_decisions:
- source_word: וִהְיִיתֶם
  choice: तुम ... होगे
  rationale: संयोजक उपसर्ग के साथ यह क़ाल पूर्ण रूप इस विधिक और वाचा-संबंधी प्रसंग में भावी/बाध्यतामूलक परिणाम व्यक्त करता है। ‘होगे’ इस अर्थ को बिना स्पष्ट आज्ञार्थ थोपे स्वाभाविक हिन्दी में रखता है।
- source_word: לִי
  choice: मेरे लिए
  rationale: לְ के साथ प्रथम पुरुष प्रत्यय संबंध और समर्पण का भाव देता है। यहाँ ‘मेरे लिए’ इब्रानी अभिव्यक्ति के निकट रहते हुए स्वाभाविक है।
- source_word: קְדֹשִׁים / קָדוֹשׁ
  choice: पवित्र
  rationale: קדש में नैतिक और उपासना-संबंधी अलगाव दोनों निहित हैं। ‘पवित्र’ परमेश्वर और इस्राएल के बीच पद में स्थापित समान शब्द-संबंध को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह इस्राएल की पवित्रता का आधार प्रस्तुत करता है; आधुनिक हिन्दी में ‘क्योंकि’ कारण का संबंध स्पष्ट रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: यह परमेश्वर के व्यक्तिगत वाचा-नाम का हिन्दी लिप्यंतरण है, किसी उपाधि से उसका स्थान नहीं भरता।
- source_word: וָאַבְדִּל
  choice: मैंने ... अलग किया है
  rationale: בדל अलग करने या पृथक करने की पूरी की हुई क्रिया को व्यक्त करता है, जिसका वर्तमान वाचा-संबंधी प्रभाव बना हुआ है। इसे קדש से अलग शब्द द्वारा अनूदित किया गया है।
- source_word: מִן הָעַמִּים
  choice: जन-समुदायों से
  rationale: עַמִּים बहुवचन में लोगों के समूहों को दर्शाता है और हर प्रसंग में राजनीतिक ‘राष्ट्रों’ तक सीमित नहीं है। ‘जन-समुदायों’ से यह व्यापकता बनी रहती है।
- source_word: לִהְיוֹת לִי
  choice: ताकि तुम मेरे हो
  rationale: लामेद सहित क्रिया का अनंत रूप उद्देश्य या परिणाम बताता है, और अंतिम לִי संबंध/अधिकार व्यक्त करता है। यह हिन्दी वाचा-संबंधी अपनत्व को संक्षेप में व्यक्त करती है।
theological_decisions:
- issue: इस्राएल की वाचा-संबंधी पवित्रता को केवल नैतिक शुद्धता या केवल अनुष्ठानिक पृथकता तक सीमित न करना
  choice: קדש के लिए ‘पवित्र’ और בדל के लिए ‘अलग किया’
  alternative: קדש को हर जगह केवल ‘अलग ठहराया’ या नैतिक अर्थ में ‘शुद्ध’ कहना
  rationale: पद याहवे की पवित्रता को इस्राएल की पवित्रता का आधार बनाता है और फिर पृथक करने के लिए अलग क्रिया בדל का उपयोग करता है। दोनों अलग शब्द रखने से मूल का अर्थ-विस्तार और धर्मवैचारिक तनाव सुरक्षित रहता है।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे उपाधि से बदलने के बजाय वाचा-नाम के रूप में प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘जन-समुदायों’ कुछ औपचारिक है, पर यह עַמִּים की सामूहिक बहुवचन व्यापकता को ‘राष्ट्रों’ की अपेक्षा बेहतर सुरक्षित रखता है। अर्धविराम पद के कारण और उसके बाद वर्णित ईश्वरीय अलगाव के बीच स्वाभाविक विभाजन देता है।
