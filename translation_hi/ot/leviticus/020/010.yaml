reference: Leviticus 20:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִנְאַף֙ אֶת אֵ֣שֶׁת אִ֔ישׁ אֲשֶׁ֥ר יִנְאַ֖ף אֶת אֵ֣שֶׁת רֵעֵ֑/הוּ מֽוֹת יוּמַ֥ת הַ/נֹּאֵ֖ף וְ/הַ/נֹּאָֽפֶת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/010.yaml
  text: If a man commits adultery with another man's wife—if he commits adultery with his neighbor's wife—the adulterer and the adulteress shall surely be put to death[a].
translation:
  language: hi
  text: यदि कोई पुरुष किसी दूसरे पुरुष की पत्नी के साथ व्यभिचार करे—अर्थात अपने पड़ोसी की पत्नी के साथ व्यभिचार करे—तो व्यभिचारी पुरुष और व्यभिचारिणी स्त्री, दोनों को निश्चय ही मार डाला जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “किसी पुरुष की पत्नी के साथ ... अपने पड़ोसी की पत्नी के साथ।” कानूनी शैली में यह पुनरावृत्ति अपराध को स्पष्ट करती और उस पर बल देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: यदि कोई पुरुष
  rationale: कानूनी प्रसंग में संयोजक और संबंधवाचक पद मिलकर शर्तसूचक मामले का परिचय देते हैं; आधुनिक हिन्दी में ‘यदि कोई पुरुष’ स्वाभाविक और मूल के लिंग-सूचक रूप के अनुरूप है।
- source_word: יִנְאַף
  choice: व्यभिचार करे
  rationale: נאף विशेष रूप से विवाहित व्यक्ति से जुड़े व्यभिचार को दर्शाता है, सामान्य यौन अनैतिकता को नहीं।
- source_word: אֶת אֵשֶׁת אִישׁ
  choice: किसी दूसरे पुरुष की पत्नी के साथ
  rationale: शाब्दिक अर्थ ‘किसी पुरुष की पत्नी’ है; ‘दूसरे पुरुष की’ हिन्दी में स्पष्ट करता है कि वह अपराधी पुरुष की अपनी पत्नी नहीं है।
- source_word: אֵשֶׁת רֵעֵהוּ
  choice: अपने पड़ोसी की पत्नी
  rationale: רֵעַ समुदाय के सह-सदस्य या साथी को सूचित करता है; ‘पड़ोसी’ स्थापित हिन्दी समतुल्य है और केवल पास रहने वाले व्यक्ति तक सीमित नहीं समझा जाना चाहिए।
- source_word: מוֹת יוּמַת
  choice: निश्चय ही मार डाले जाएँ
  rationale: क्रियार्थक संज्ञा और सीमित क्रिया का संयोग मृत्युदंड की निश्चितता पर बल देता है; निष्क्रिय बहुवचन दोनों दोषियों पर लागू होता है और दंड की विधि नहीं जोड़ता।
- source_word: הַנֹּאֵף וְהַנֹּאָפֶת
  choice: व्यभिचारी पुरुष और व्यभिचारिणी स्त्री
  rationale: मूल में पुल्लिंग और स्त्रीलिंग कृदंत दोनों पक्षों को स्पष्ट और संतुलित रूप से नामित करते हैं; हिन्दी में ये रूप अर्थ और लिंग दोनों सुरक्षित रखते हैं।
theological_decisions:
- issue: लिंग-सूचक कानूनी भाषा
  choice: ‘पुरुष’ तथा ‘व्यभिचारी पुरुष और व्यभिचारिणी स्त्री’ को स्पष्ट रखा गया।
  alternative: ‘यदि कोई व्यक्ति... दोनों दोषियों को’
  rationale: इब्रानी मामले के वर्णन और दंडादेश, दोनों में लिंग स्पष्ट है; लिंग-निरपेक्ष पुनर्कथन मूल की संरचना को धुँधला कर देता।
- issue: मृत्युदंड का सूत्र
  choice: ‘निश्चय ही मार डाले जाएँ’
  alternative: ‘उन्हें मृत्युदंड दिया जाए’
  rationale: मूल पाठ दंड की निश्चितता पर जोर देता है, पर उसकी विधि नहीं बताता; अनुवाद उसी सीमा को बनाए रखता है।
- issue: अपराध-वर्णन की पुनरावृत्ति
  choice: दूसरी अभिव्यक्ति को ‘अर्थात’ के साथ दोहराया गया।
  alternative: पुनरावृत्ति हटाकर केवल एक बार अपराध बताना
  rationale: इब्रानी कानूनी शैली अपराध को दोहराकर स्पष्ट और प्रबल करती है; ‘अर्थात’ दोनों वाक्यांशों का स्पष्टीकरणात्मक संबंध दिखाता है, बिना पुनरावृत्ति मिटाए।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण कानूनी शैली रखी गई है। ‘व्यभिचार’ और ‘मार डाले जाएँ’ सामान्य पाठक के लिए बोधगम्य हैं; दंड की कोई ऐसी विधि नहीं जोड़ी गई जो इस पद में नहीं है।
