base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/007.yaml
  text: Consecrate yourselves[a], and be holy, because I am Yahweh your God.
translation:
  language: hi
  text: अपने आप को पवित्र करो[a] और पवित्र बनो, क्योंकि मैं याहवे तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘अपने आप को पवित्र ठहराओ।’ इब्रानी क्रिया आत्मवाचक है और इस्राएल से सक्रिय रूप से स्वयं को पवित्र करने की माँग करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִתְקַדִּשְׁתֶּם
  choice: अपने आप को पवित्र ठहराओ
  rationale: 'हित्पएल रूप का आत्मवाचक और सक्रिय भाव सुरक्षित रहता है: इस्राएल को स्वयं को परमेश्वर के लिए पवित्र करने का आदेश है।'
- source_word: וִהְיִיתֶם
  choice: और पवित्र बने रहो
  rationale: היה का यह रूप पहले आदेश के साथ समन्वित होकर आदेशात्मक अर्थ देता है। ‘बने रहो’ सहज हिन्दी में पवित्र अवस्था और आचरण को बनाए रखने का भाव व्यक्त करता है।
- source_word: קְדֹשִׁים
  choice: पवित्र
  rationale: यह शब्द लैव्यव्यवस्था के वाचागत और नैतिक संदर्भ में केवल ‘अलग’ होने से अधिक व्यापक धार्मिक-नैतिक अर्थ रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: आज्ञा का आधार बताने वाले कारणवाचक संबंध को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: दिव्य व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण में सुरक्षित रखा गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: रूप की बाहरी बहुवचनता के बावजूद इस प्रसंग में इस्राएल के एकमात्र परमेश्वर का एकवचन अर्थ है; सामूहिक ‘तुम’ के साथ मानक हिन्दी में ‘तुम्हारा’ रखा गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है; ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना सुरक्षित रखता है।
- issue: मानवीय सक्रियता और पवित्रता का संबंध
  choice: अपने आप को पवित्र ठहराओ
  alternative: पवित्र हो जाओ
  rationale: आत्मवाचक क्रिया इस्राएल की सक्रिय आत्म-समर्पणात्मक प्रतिक्रिया पर बल देती है। इसे केवल निष्क्रिय अवस्था के रूप में प्रस्तुत नहीं किया गया, और न ही इससे पवित्रता के स्रोत के विषय में पाठ से आगे कोई निष्कर्ष जोड़ा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और आज्ञात्मक शैली। ‘पवित्र ठहराओ’ को ‘पवित्र बने रहो’ से अलग रखा गया है, ताकि पहली क्रिया का सक्रिय-आत्मवाचक भाव और दूसरी की पवित्र अवस्था स्पष्ट रहें।
