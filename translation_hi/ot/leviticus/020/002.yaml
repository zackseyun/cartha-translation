  text: וְ/אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל תֹּאמַר֒ אִ֣ישׁ אִישׁ֩ מִ/בְּנֵ֨י יִשְׂרָאֵ֜ל וּ/מִן הַ/גֵּ֣ר הַ/גָּ֣ר בְּ/יִשְׂרָאֵ֗ל אֲשֶׁ֨ר יִתֵּ֧ן מִ/זַּרְע֛/וֹ לַ/מֹּ֖לֶךְ מ֣וֹת יוּמָ֑ת עַ֥ם הָ/אָ֖רֶץ יִרְגְּמֻ֥/הוּ בָ/אָֽבֶן־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/002.yaml
  text: 'And you shall say to the sons of Israel: Any man from the sons of Israel[a], or from the sojourner who sojourns in Israel, who gives any of his offspring to Molech shall surely be put to death[c][b]; the people of the land shall stone him with stones.'
translation:
  language: hi
  text: 'और इस्राएल की संतानों से कहना: इस्राएल की संतानों में से कोई भी पुरुष, या इस्राएल में रहनेवाला कोई परदेशी[a], जो अपनी संतान[b] में से किसी को मोलेक[c] को दे, वह निश्चय ही मार डाला जाए; देश के लोग उसे पत्थरों से मार डालें।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: '‘रहनेवाला परदेशी’ उस विदेशी व्यक्ति को दर्शाता है जो इस्राएलियों के बीच बसता था। हिब्रू में एक ही मूल की संज्ञा और क्रिया हैं: ‘वह परदेशी जो इस्राएल में रहता है।’'
    reason: lexical_alternative
  - marker: b
    text: ‘संतान’ के लिए हिब्रू शब्द का शाब्दिक अर्थ ‘बीज’ है; यहाँ उससे वंशज या बच्चे अभिप्रेत हैं।
    reason: lexical_alternative
  - marker: c
    text: मोलेक को परंपरागत रूप से बाल-बलि से जुड़ा एक देवता या उसकी उपाधि समझा जाता है। कुछ विद्वान इस शब्द को देवता के नाम के बजाय एक विशेष प्रकार की भेंट का नाम मानते हैं।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की संतानें
  rationale: हिब्रू के पारिवारिक रूपक को बनाए रखता है और आधुनिक हिंदी में ‘इस्राएल के पुत्रों’ की अपेक्षा अधिक स्वाभाविक है; यहाँ यह पूरे इस्राएली समुदाय का नाम है।
- source_word: אִישׁ אִישׁ
  choice: कोई भी पुरुष
  rationale: दोहराया हुआ אִישׁ वितरणात्मक अर्थ देता है; यह चयन ‘हर/कोई भी पुरुष’ का अर्थ और मूल का पुल्लिंग एकवचन दोनों बनाए रखता है।
- source_word: הַגֵּר הַגָּר
  choice: रहनेवाला कोई परदेशी
  rationale: גֵּר से समुदाय के बीच निवास करने वाला विदेशी अभिप्रेत है; संज्ञा और सजातीय क्रिया की पुनरुक्ति हिंदी में स्वाभाविक ढंग से व्यक्त की गई है।
- source_word: יִתֵּן מִזַּרְעוֹ לַמֹּלֶךְ
  choice: अपनी संतान में से किसी को मोलेक को दे
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर यहाँ वंशज अथवा बच्चे का अर्थ है। ‘में से किसी को’ מִן के आंशिक भाव को स्पष्ट करता है, बिना अनुष्ठान का ऐसा विवरण जोड़ने के जो इस पद में नहीं है।
- source_word: מוֹת יוּמָת
  choice: निश्चय ही मार डाला जाए
  rationale: क्रिया के साथ infinitive absolute दंड की निश्चितता पर बल देता है; कर्मवाच्य न्यायिक मृत्यु-दंड को व्यक्त करता है।
- source_word: עַם הָאָרֶץ
  choice: देश के लोग
  rationale: शाब्दिक और प्रसंगानुकूल रूप; यहाँ दंड लागू करने वाले स्थानीय समुदाय के लोग अभिप्रेत हैं, न कि बाद के किसी तकनीकी सामाजिक वर्ग का अनिवार्य संकेत।
- source_word: יִרְגְּמֻהוּ בָאָבֶן
  choice: उसे पत्थरों से मार डालें
  rationale: हिंदी का स्वाभाविक वाक्यांश है और पत्थरों द्वारा मृत्यु-दंड देने के ठोस साधन तथा परिणाम दोनों को स्पष्ट रखता है।
theological_decisions:
- issue: मोलेक को संतान देने का अर्थ
  choice: मुख्य पाठ में ‘मोलेक’ को नाम अथवा उपाधि मानते हुए संतान को उसे देने की बात ज्यों की त्यों रखी गई है।
  alternative: מֹלֶךְ को किसी देवता का नाम न मानकर एक विशेष प्रकार की भेंट या अनुष्ठान का पद समझा जा सकता है।
  rationale: पद स्वयं आग या अनुष्ठान की विधि का उल्लेख नहीं करता। इसलिए अनुवाद बाल-बलि से जुड़े व्यापक बाइबलीय संदर्भ को मुख्य पाठ में जोड़कर अस्पष्टता का अतिक्रमण नहीं करता; वैकल्पिक समझ पादटिप्पणी में दी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। कानूनी गंभीरता के लिए ‘निश्चय ही मार डाला जाए’ और सामुदायिक दंड के लिए ‘पत्थरों से मार डालें’ प्रयुक्त हैं। ‘परदेशी’ को केवल आगंतुक नहीं, बल्कि निवासी विदेशी के अर्थ में पादटिप्पणी से स्पष्ट किया गया है।
