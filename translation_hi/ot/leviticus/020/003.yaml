source:
  edition: WLC
  text: וַ/אֲנִ֞י אֶתֵּ֤ן אֶת פָּנַ/י֙ בָּ/אִ֣ישׁ הַ/ה֔וּא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֣רֶב עַמּ֑/וֹ כִּ֤י מִ/זַּרְע/וֹ֙ נָתַ֣ן לַ/מֹּ֔לֶךְ לְמַ֗עַן טַמֵּא֙ אֶת מִקְדָּשִׁ֔/י וּ/לְ/חַלֵּ֖ל אֶת שֵׁ֥ם קָדְשִֽׁ/י־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/003.yaml
  text: I myself will set my face against that man and cut him off from among his people[a], because he has given some of his offspring to Molech, so as to defile my sanctuary and to profane my holy name.
translation:
  language: hi
  text: और मैं स्वयं उस मनुष्य के विरुद्ध अपना मुख करूँगा और उसे उसके लोगों के बीच से काट डालूँगा, क्योंकि उसने अपनी संतान में से किसी को मोलेक को दिया है[a], जिससे वह मेरे पवित्रस्थान को अशुद्ध करे और मेरे पवित्र नाम को अपवित्र करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपनी संतान में से किसी को मोलेक के लिए बलि चढ़ाया है।” इब्रानी में शाब्दिक रूप से “अपनी संतान में से किसी को मोलेक को दिया है”; बलि का अर्थ व्यापक प्रसंग से समझा जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַאֲנִי
  choice: और मैं स्वयं
  rationale: स्वतंत्र सर्वनाम के बल को ‘मैं स्वयं’ से व्यक्त किया गया है; आरम्भिक וַ को ‘और’ के रूप में रखा गया है।
- source_word: אֶתֵּן אֶת־פָּנַי בָּאִישׁ הַהוּא
  choice: उस मनुष्य के विरुद्ध अपना मुख करूँगा
  rationale: यह परमेश्वर के सोद्देश्य विरोध को व्यक्त करने वाला इब्रानी न्यायिक मुहावरा है; हिन्दी में ‘मुख करना’ उसकी रूपकात्मक शक्ति बनाए रखता है।
- source_word: וְהִכְרַתִּי אֹתוֹ מִקֶּרֶב עַמּוֹ
  choice: और उसे उसके लोगों के बीच से काट डालूँगा
  rationale: ‘काट डालना’ כרת के न्यायिक-वाचाई मुहावरे को सुरक्षित रखता है और दण्ड की विधि को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: מִזַּרְעוֹ
  choice: अपनी संतान में से किसी को
  rationale: מן की अंशवाचक शक्ति और זרע के इस प्रसंग में वंशज अथवा संतान के अर्थ, दोनों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נָתַן לַמֹּלֶךְ
  choice: मोलेक को दिया है
  rationale: मूल क्रिया का सीधा अर्थ ‘दिया’ है; मुख्य पाठ में ‘बलि चढ़ाया’ जोड़ने से बचा गया है। मोलेक को व्यक्तिवाचक नाम माना गया है।
- source_word: לְמַעַן
  choice: जिससे
  rationale: यहाँ उद्देश्य अथवा परिणामी आशय के बीच सम्भव सूक्ष्म अस्पष्टता को सहज हिन्दी में बनाए रखता है।
- source_word: טַמֵּא אֶת־מִקְדָּשִׁי
  choice: मेरे पवित्रस्थान को अशुद्ध करे
  rationale: याजकीय प्रसंग में טמא की धार्मिक-अशुद्धता और מקדש के पवित्र स्थान के भाव को स्पष्ट रूप से व्यक्त करता है।
- source_word: וּלְחַלֵּל אֶת־שֵׁם קָדְשִׁי
  choice: और मेरे पवित्र नाम को अपवित्र करे
  rationale: חלל का अर्थ पवित्र को साधारण अथवा अपमानित ठहराना है; ‘अपवित्र करना’ आधुनिक हिन्दी में इसका गंभीर धार्मिक भाव व्यक्त करता है।
theological_decisions:
- issue: मोलेक से सम्बन्धित अपराध का स्वरूप
  choice: मुख्य पाठ में ‘अपनी संतान में से किसी को मोलेक को दिया है’ रखा गया है।
  alternative: ‘अपनी संतान में से किसी को मोलेक के लिए बलि चढ़ाया है।’
  rationale: व्यापक प्रसंग बाल-बलि की ओर संकेत करता है, पर इस पद में נָתַן का शाब्दिक अर्थ ‘दिया’ है। इसलिए व्याख्यात्मक बलि-संबंधी अर्थ को पादटिप्पणी में रखा गया है।
- issue: परमेश्वर की व्यक्तिगत न्यायिक संलग्नता
  choice: ‘मैं स्वयं’ तथा ‘उस मनुष्य के विरुद्ध अपना मुख करूँगा’
  alternative: ‘मैं उसका विरोध करूँगा।’
  rationale: इब्रानी पाठ परमेश्वर की व्यक्तिगत कार्रवाई पर बल देता है और मुख करने के न्यायिक मुहावरे का प्रयोग करता है; इसे सामान्य विरोध में समतल नहीं किया गया।
- issue: לְמַעַן में उद्देश्य अथवा परिणाम
  choice: ‘जिससे’
  alternative: ‘इस उद्देश्य से कि’ अथवा ‘जिसके परिणामस्वरूप’
  rationale: यह संयोजक उद्देश्य या लक्षित परिणाम व्यक्त कर सकता है। ‘जिससे’ हिन्दी में दोनों के बीच की वास्तविक अर्थगत गुंजाइश को कुछ हद तक बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण और सहज धार्मिक गद्य। ‘मुख करना’, ‘काट डालना’, ‘पवित्रस्थान’ और ‘पवित्र नाम’ जैसे पद मूल के न्यायिक तथा याजकीय रूपकों को बनाए रखते हैं, जबकि वाक्यरचना सामान्य पाठक के लिए स्पष्ट रखी गई है।
