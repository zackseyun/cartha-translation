  text: וְ/הַ/נֶּ֗פֶשׁ אֲשֶׁ֨ר תִּפְנֶ֤ה אֶל הָֽ/אֹבֹת֙ וְ/אֶל הַ/יִּדְּעֹנִ֔ים לִ/זְנ֖וֹת אַחֲרֵי/הֶ֑ם וְ/נָתַתִּ֤י אֶת פָּנַ/י֙ בַּ/נֶּ֣פֶשׁ הַ/הִ֔וא וְ/הִכְרַתִּ֥י אֹת֖/וֹ מִ/קֶּ֥רֶב עַמּֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/006.yaml
  text: And the person who turns to the mediums and to the spiritists[a], to prostitute himself after them[c][b], I will set my face against that person and cut him off from among his people.
translation:
  language: hi
  text: और जो व्यक्ति मृतात्माओं से संपर्क कराने वाले माध्यमों और गुप्त विद्या जानने वालों[a] की ओर मुड़े और उनके पीछे वेश्यावृत्ति करे[b], मैं उस व्यक्ति के विरुद्ध अपना मुख करूँगा और उसे उसके लोगों के बीच से काट डालूँगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘माध्यमों’ के लिए ‘जिनमें परिचित आत्माएँ हों’ भी कहा जा सकता है। पहला इब्रानी पद मृतकों या आत्माओं से संपर्क कराने वाले माध्यमों को सूचित करता है; दूसरा उनसे जुड़ी गुप्त विद्या के साधकों को।
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूपक: “उनके पीछे वेश्यावृत्ति करे”; यह अनुचित आत्मिक साधना द्वारा परमेश्वर के प्रति वाचागत विश्वासघात को दर्शाता है।'
    reason: lexical_alternative
  - marker: c
    text: “काट डालना” एक मानक विधिक सूत्र है; यहाँ दंड की ठीक रीति निर्दिष्ट नहीं की गई है।
    reason: alternative_reading
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: व्यक्ति
  rationale: विधिक संदर्भ में נֶפֶשׁ यहाँ अमूर्त ‘आत्मा’ नहीं, बल्कि समूचे व्यक्ति को सूचित करता है।
- source_word: תִּפְנֶה
  choice: की ओर फिरे
  rationale: यह פנה के ‘मुड़ने’ के बिंब को बनाए रखते हुए सहायता या परामर्श के लिए उनकी ओर जाने का भाव व्यक्त करता है।
- source_word: הָאֹבֹת
  choice: ओझाओं
  rationale: यह पद मृतकों या आत्माओं से संपर्क करानेवाले माध्यमों अथवा साधकों को सूचित करता है; ‘ओझा’ सामान्य हिन्दी में इस भूमिका का निकट और समझने योग्य शब्द है।
- source_word: הַיִּדְּעֹנִים
  choice: प्रेतात्माओं से संपर्क करनेवालों
  rationale: यह गुप्त आत्मिक ज्ञान से जुड़े साधकों के लिए प्रयुक्त पद है। वर्णनात्मक अनुवाद इसे पहले पद से अलग रखते हुए अर्थ स्पष्ट करता है।
- source_word: לִזְנוֹת אַחֲרֵיהֶם
  choice: उनके पीछे व्यभिचार करे
  rationale: זנה के यौन-अविश्वास के रूपक को सुरक्षित रखा गया है; इस प्रसंग में यह अनुचित आत्मिक साधना के द्वारा वाचा के प्रति विश्वासघात का तीखा भाव देता है।
- source_word: וְנָתַתִּי אֶת־פָּנַי בַּנֶּפֶשׁ הַהִוא
  choice: मैं उस व्यक्ति के विरुद्ध अपना मुख करूँगा
  rationale: ईश्वरीय विरोध और न्याय का मूल इब्रानी मुख-संबंधी बिंब सुरक्षित रहता है और हिन्दी में अर्थ स्पष्ट है।
- source_word: וְהִכְרַתִּי אֹתוֹ
  choice: उसे ... काट डालूँगा
  rationale: मानक विधिक सूत्र की जानबूझकर बनी अनिश्चितता को रखा गया है; अनुवाद दंड को केवल मृत्यु या निष्कासन तक सीमित नहीं करता।
- source_word: מִקֶּרֶב עַמּוֹ
  choice: उसके लोगों के बीच से
  rationale: यह सामुदायिक क्षेत्र से हटाए जाने या न्याय के अधीन किए जाने का मूल सूत्र स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: वाचा के प्रति विश्वासघात के लिए व्यभिचार का रूपक
  choice: उनके पीछे व्यभिचार करे
  alternative: उनके पीछे चलकर विश्वासघात करे
  rationale: मूल में זנה स्पष्ट रूप से यौन-अविश्वास का रूपक है। इसे बनाए रखने से अवैध आत्मिक साधना की वाचागत और धार्मिक गंभीरता सुरक्षित रहती है।
- issue: ‘काट डाला जाना’ दंड का आशय
  choice: उसे उसके लोगों के बीच से काट डालूँगा
  alternative: उसे नष्ट कर दूँगा / उसे समुदाय से निकाल दूँगा
  rationale: इस विधिक सूत्र के दंड की ठीक रीति यहाँ निर्दिष्ट नहीं है। इसलिए अनुवाद मृत्यु, ईश्वरीय दंड या समुदाय से निष्कासन में से किसी एक को निर्णायक रूप से नहीं चुनता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी अपनाई गई है। ‘ओझा’ परिचित शब्द है, जबकि दूसरे तकनीकी इब्रानी पद को वर्णनात्मक वाक्यांश से अलग किया गया है। मूल के ‘मुख’ और ‘काट डालने’ वाले न्यायिक बिंब तथा व्यभिचार का कठोर रूपक जानबूझकर सुरक्षित रखे गए हैं।
