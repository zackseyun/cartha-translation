source:
  edition: WLC
  text: וָ/אֹמַ֣ר לָ/כֶ֗ם אַתֶּם֮ תִּֽירְשׁ֣וּ אֶת אַדְמָתָ/ם֒ וַ/אֲנִ֞י אֶתְּנֶ֤/נָּה לָ/כֶם֙ לָ/רֶ֣שֶׁת אֹתָ֔/הּ אֶ֛רֶץ זָבַ֥ת חָלָ֖ב וּ/דְבָ֑שׁ אֲנִי֙ יְהוָ֣ה אֱלֹֽהֵי/כֶ֔ם אֲשֶׁר הִבְדַּ֥לְתִּי אֶתְ/כֶ֖ם מִן הָֽ/עַמִּֽים־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/024.yaml
  text: But I said to you[a], ‘You shall possess their land, and I myself will give it to you to possess’—a land flowing with milk and honey. I am Yahweh your God[d][c][b], who has separated you from the peoples.
translation:
  language: hi
  text: पर मैंने तुमसे कहा था, ‘तुम उनकी भूमि पर अधिकार करोगे, और मैं स्वयं वह भूमि तुम्हें दूँगा ताकि तुम उस पर अधिकार करो’[a]—वह देश जिसमें दूध और मधु की धाराएँ बहती हैं।[b] मैं तुम्हारा परमेश्वर याहवे हूँ,[c] जिसने तुम्हें जातियों से अलग किया है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम उनकी भूमि उत्तराधिकार में पाओगे, और मैं स्वयं वह भूमि तुम्हें उत्तराधिकार में लेने के लिए दूँगा।” इब्रानी क्रिया में उत्तराधिकार पाने और अधिकार करने—दोनों का भाव हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: “दूध और मधु की धाराएँ बहती हैं” प्रचुरता और उर्वरता का इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: c
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु” अनूदित किया गया है।'
    reason: alternative_reading
  - marker: d
    text: या, “जिसने तुम्हें जातियों से अलग ठहराया है।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וָאֹמַר
  choice: पर मैंने तुमसे कहा था
  rationale: वाव कथन को आगे बढ़ाता है और संदर्भ में पिछले लोगों के निष्कासन के विपरीत इस्राएल से की गई प्रतिज्ञा सामने आती है; इसलिए ‘पर’ स्वाभाविक है। पूर्ण भूत ‘कहा था’ वर्तमान कथन से पहले दिए गए दिव्य वचन को स्पष्ट करता है।
- source_word: תִּירְשׁוּ / לָרֶשֶׁת
  choice: अधिकार करोगे / अधिकार करो
  rationale: यारश भूमि को उत्तराधिकार में पाने और उस पर कब्ज़ा अथवा अधिकार करने—दोनों अर्थ रख सकता है। ‘अधिकार करना’ यहाँ सक्रिय रूप से भूमि प्राप्त करने और रखने का भाव व्यक्त करता है, जबकि वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: אַדְמָתָם / אֶרֶץ
  choice: उनकी भूमि / वह देश
  rationale: अदामा यहाँ क्षेत्रीय भूमि है, केवल मिट्टी नहीं। आगे एरेत्स के लिए ‘देश’ रखने से हिन्दी में अनावश्यक पुनरावृत्ति घटती है और वादा किए गए भूभाग का भाव बना रहता है।
- source_word: וַאֲנִי אֶתְּנֶנָּה
  choice: और मैं स्वयं वह भूमि तुम्हें दूँगा
  rationale: स्वतंत्र सर्वनाम אֲנִי पर बल है, जिसे ‘मैं स्वयं’ सुरक्षित रखता है। स्त्रीलिंग प्रत्यय का संबंध भूमि से स्पष्ट करने के लिए ‘वह भूमि’ कहा गया है।
- source_word: אֶרֶץ זָבַת חָלָב וּדְבָשׁ
  choice: वह देश जिसमें दूध और मधु की धाराएँ बहती हैं
  rationale: यह उर्वरता और प्रचुरता का इब्रानी मुहावरा है। हिन्दी का यह परिचित बाइबलीय रूप चित्रात्मक भाषा को बनाए रखते हुए अर्थगम्य है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित ध्वन्यात्मक रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को शीर्षक से प्रतिस्थापित किए बिना प्रस्तुत करता है; पारंपरिक शीर्षकीय विकल्प पादटिप्पणी में दिया गया है।
- source_word: הִבְדַּלְתִּי
  choice: अलग किया है
  rationale: बदल का सीधा अर्थ अलग करना या पृथक ठहराना है। ‘अलग किया है’ अध्याय के भेद और पवित्रता के प्रसंग को बिना अतिरिक्त धर्मवैज्ञानिक विस्तार के रखता है।
- source_word: הָעַמִּים
  choice: दूसरे समुदायों
  rationale: अम्मीम अनेक जनसमूहों को दर्शाता है। हिन्दी में ‘दूसरे समुदायों’ तुलना को स्वाभाविक बनाता है और आधुनिक राष्ट्र-राज्य का अनावश्यक राजनीतिक अर्थ नहीं जोड़ता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत चतुरक्षरीय नाम है। हिन्दी पाठकों के बीच व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ वाली परंपरा पादटिप्पणी में बताई गई है।
- issue: इस्राएल का अन्य जनसमूहों से विभाजन
  choice: जिसने तुम्हें दूसरे समुदायों से अलग किया है
  alternative: जिसने तुम्हें दूसरे समुदायों से अपने लिए अलग ठहराया है
  rationale: मूल क्रिया अलग करने की बात कहती है, लेकिन इस पद में ‘अपने लिए’ प्रत्यक्षतः नहीं है। इसलिए उद्देश्य जोड़े बिना कथन की धर्मवैज्ञानिक गंभीरता और संभावित व्यापकता सुरक्षित रखी गई है।
- issue: भूमि प्राप्त करने में दान और अधिकार का संबंध
  choice: पर अधिकार करोगे ... मैं स्वयं ... दूँगा
  alternative: उत्तराधिकार में पाओगे ... उत्तराधिकार में लेने के लिए दूँगा
  rationale: पद एक साथ इस्राएल के अधिकार करने और परमेश्वर के देने की बात करता है। अनुवाद दोनों पक्षों को बनाए रखता है और किसी एक के पक्ष में तनाव को समाप्त नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। वाक्य में प्रतिज्ञा की औपचारिकता बनाए रखते हुए ‘मैं स्वयं’ का बल और भूमि को ईश्वरीय दान तथा मानवीय अधिकार—दोनों रूपों में प्रस्तुत करने वाला तनाव सुरक्षित है।
