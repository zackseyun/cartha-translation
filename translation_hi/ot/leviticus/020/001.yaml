lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर … कहा
  rationale: वाव-क्रमिक के साथ पिएल रूप यहाँ एक नए वचन-खंड का आरम्भ करता है। आधुनिक हिन्दी में ‘मूसा से कहा’ इस सूत्र का स्वाभाविक और स्पष्ट रूप है; ‘फिर’ कथानक की अगली घटना का संकेत देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय उसके प्रचलित विद्वतापूर्ण उच्चारण का देवनागरी लिप्यंतरण दिया गया है।
- source_word: אֶל
  choice: से
  rationale: דבר के साथ यह उस व्यक्ति को चिह्नित करता है जिससे बात कही गई। हिन्दी में ‘मूसा से कहा’ स्वाभाविक प्रयोग है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह इस इब्रानी व्यक्तिगत नाम का हिन्दी में स्थापित रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह इब्रानी वचन-परिचय सूत्र आगामी कथन को प्रस्तुत करता है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना कृत्रिम होगा; ‘कहा’ ही उसके कार्य को सहज रूप से व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम יהוה है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत लिप्यंतरण है और नाम तथा उपाधि के भेद को बनाए रखता है। परंपरागत पाठक-सहायता के लिए पादटिप्पणी में प्रचलित प्रतिस्थापन बताया गया है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। इब्रानी सूत्र का शब्दशः ‘बोला … यह कहते हुए’ हिन्दी में अस्वाभाविक होता, इसलिए उसका पूरा अर्थ सहज वचन-परिचय ‘ने … से कहा’ में व्यक्त किया गया है।
