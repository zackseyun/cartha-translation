  text: וְ/לֹ֤א תֵֽלְכוּ֙ בְּ/חֻקֹּ֣ת הַ/גּ֔וֹי אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶ֑ם כִּ֤י אֶת כָּל אֵ֨לֶּה֙ עָשׂ֔וּ וָ/אָקֻ֖ץ בָּֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/023.yaml
  text: And you shall not walk in the statutes of the nation that I am driving out before you[a], because they did all these things[c][b], and I loathed them.
translation:
  language: hi
  text: तुम उस जाति के रीति-विधानों[a] पर मत चलना, जिसे मैं तुम्हारे सामने से निकाल रहा हूँ; क्योंकि उन्होंने ये सब काम किए हैं, और मुझे उनसे घृणा हुई।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “रीति-रिवाजों”; इब्रानी शब्द नियत विधियों और स्थापित प्रथाओं—दोनों को दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תֵלְכוּ
  choice: पर न चलना
  rationale: הלך के ‘चलना’ रूपक को बनाए रखते हुए आचरण का भाव स्वाभाविक हिन्दी में व्यक्त होता है।
- source_word: בְּחֻקֹּת
  choice: रीति-विधानों
  rationale: חֻקּוֹת यहाँ स्थापित प्रथाओं और नियत नियमों दोनों का संकेत दे सकता है; संयुक्त पद इस अर्थ-व्याप्ति को बनाए रखता है।
- source_word: הַגּוֹי
  choice: जिस जाति
  rationale: एकवचन גּוֹי उस देश में रहने वाले समुदाय को सामूहिक रूप से दर्शाता है; ‘जाति’ आधुनिक बाइबलीय हिन्दी में सहज है और बाद के ‘गैर-यहूदी’ अर्थ को नहीं थोपता।
- source_word: מְשַׁלֵּחַ מִפְּנֵיכֶם
  choice: तुम्हारे सामने से निकाल रहा हूँ
  rationale: शाब्दिक ‘तुम्हारे सामने से भेज रहा हूँ’ का प्रसंगगत अर्थ बेदखल करके निकालना है; हिन्दी वाक्यांश मूल स्थानगत बिंब भी रखता है।
- source_word: כִּי אֶת כָּל אֵלֶּה עָשׂוּ
  choice: क्योंकि उन्होंने ये सब काम किए हैं
  rationale: כִּי को कारणसूचक रखा गया है और यह खंड पिछले निषिद्ध कर्मों की ओर संकेत करता है।
- source_word: וָאָקֻץ בָּם
  choice: मुझे उनसे घृणा हुई
  rationale: קוץ तीव्र नैतिक विरक्ति या घृणा व्यक्त करता है। हिन्दी में यह अकर्मक अनुभूति-विन्यास בָּם के साथ स्वाभाविक है और मूल की प्रबल भावात्मक भाषा को बनाए रखता है।
theological_decisions:
- issue: परमेश्वर की तीव्र नैतिक विरक्ति का निरूपण
  choice: मुझे उनसे घृणा हुई
  alternative: मैंने उनसे घृणा की / मुझे उनसे चिढ़ हुई
  rationale: यह पाठ की तीव्र भावात्मक भाषा को नरम नहीं करता, पर उसके आगे कोई व्यवस्थित धर्मवैज्ञानिक निष्कर्ष भी नहीं जोड़ता। ‘चिढ़’ अपेक्षाकृत हल्का है, जबकि ‘मैंने घृणा की’ हिन्दी में कम स्वाभाविक लगता है।
- issue: בָּם का संकेत व्यक्तियों या कर्मों की ओर
  choice: उनसे
  alternative: उन कामों से
  rationale: व्याकरणतः पुल्लिंग बहुवचन सर्वनाम निकटवर्ती कर्ता ‘उन्होंने’ अर्थात उस जाति के लोगों की ओर सहज रूप से लौटता है, जबकि प्रसंग उनके कर्मों को घृणा का कारण बताता है। अनुवाद ‘उनसे’ रखकर इस तनाव को स्पष्ट किए बिना सुरक्षित रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। ‘पर चलना’ मूल के आचरण-संबंधी रूपक को रखता है; ‘रीति-विधान’ कानूनी और प्रथागत दोनों अर्थों को समेटता है।
