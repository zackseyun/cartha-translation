source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת כַּלָּת֔/וֹ מ֥וֹת יוּמְת֖וּ שְׁנֵי/הֶ֑ם תֶּ֥בֶל עָשׂ֖וּ דְּמֵי/הֶ֥ם בָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/012.yaml
  text: If a man lies with his daughter-in-law[a], both of them shall surely be put to death. They have committed perversion[b]; their blood is upon them.
translation:
  language: hi
  text: यदि कोई पुरुष अपनी बहू के साथ यौन-संबंध बनाए, तो उन दोनों को निश्चय ही मृत्युदंड दिया जाए। उन्होंने घोर अनर्थ[a] किया है; उनका रक्त उन्हीं पर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘भ्रष्टता,’ ‘लज्जाजनक कृत्य,’ या ‘घोर अनैतिक काम।’ इब्रानी शब्द תֶּבֶל इस विधिक प्रसंग में नैतिक रूप से अव्यवस्थित और गंभीर रूप से निंदनीय कृत्य को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात उनकी मृत्यु का दोष उन्हीं पर है। यह इब्रानी मुहावरा उनके दंड के लिए उन्हीं को उत्तरदायी ठहराता है।
    reason: idiom_explanation
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: यदि कोई पुरुष
  rationale: इस कानूनी सूत्र में यह पदबंध शर्तसूचक उपवाक्य आरंभ करता है। ‘पुरुष’ इब्रानी के पुल्लिंग और प्रसंग में पुरुष अपराधी को स्पष्ट रखता है।
- source_word: יִשְׁכַּב אֶת
  choice: के साथ यौन-संबंध बनाए
  rationale: यहाँ שׁכב का प्रयोग संभोग के लिए है। यह अनुवाद आधुनिक हिंदी में स्पष्ट और गरिमापूर्ण है तथा केवल साथ सोने का अर्थ निकलने नहीं देता।
- source_word: כַּלָּתוֹ
  choice: अपनी बहू
  rationale: כַּלָּה यहाँ पुत्र की पत्नी को दर्शाता है; हिंदी में ‘बहू’ इसका स्वाभाविक और सटीक संबंधसूचक शब्द है।
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: उन दोनों को निश्चय ही मृत्युदंड दिया जाए
  rationale: क्रिया के साथ infinitive absolute मृत्यु-दंड की निश्चितता पर बल देता है; ‘निश्चय ही’ उस बल को बनाए रखता है और ‘उन दोनों’ से दोनों सहभागी स्पष्ट होते हैं।
- source_word: תֶּבֶל עָשׂוּ
  choice: उन्होंने घोर विकृति की है
  rationale: תֶּבֶל इस यौन-विधिक प्रसंग में नैतिक रूप से अव्यवस्थित और घृणित काम को दर्शाता है। ‘घोर विकृति’ स्रोत की तीखी नैतिक अभिव्यक्ति को संक्षिप्त रूप में रखती है।
- source_word: דְּמֵיהֶם בָּם
  choice: उनका खून उन्हीं पर है
  rationale: यह अनुवाद इब्रानी के ‘खून’ वाले कानूनी मुहावरे को बनाए रखता है; ‘उन्हीं’ इस बात पर बल देता है कि दंड के लिए उत्तरदायित्व अपराधियों का अपना है।
theological_decisions:
- issue: कानून के विषय का लिंग
  choice: ‘पुरुष’ रखा गया है।
  alternative: ‘व्यक्ति’ या ‘कोई’
  rationale: אִישׁ व्याकरण और प्रसंग दोनों में पुरुष अपराधी को निर्दिष्ट करता है; लिंग-निरपेक्ष रूप स्रोत की विशिष्टता घटा देता।
- issue: תֶּבֶל का नैतिक स्वर
  choice: मुख्य पाठ में ‘घोर विकृति’
  alternative: ‘घोर अनैतिक काम’, ‘लज्जाजनक काम’ या ‘व्यवस्था-विरुद्ध काम’
  rationale: शब्द स्वयं इस कृत्य का प्रबल नैतिक मूल्यांकन करता है। चुना हुआ रूप उस निंदा को व्यक्त करता है, पर किसी अतिरिक्त सांप्रदायिक व्याख्या को नहीं जोड़ता।
- issue: דְּמֵיהֶם בָּם में दंड की जिम्मेदारी
  choice: मूल मुहावरा ‘उनका खून उन्हीं पर है’ बनाए रखा गया है।
  alternative: ‘उनकी मृत्यु का दोष उन्हीं पर है’
  rationale: वैकल्पिक रूप अर्थ स्पष्ट करता है, पर मुहावरे को व्याख्या में बदल देता है। मुख्य पाठ स्रोत की चित्रात्मक भाषा रखता है और पादटिप्पणी उसका आशय बताती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘यौन-संबंध बनाए’ सामान्य पाठक के लिए स्पष्ट है; ‘सहवास करे’ की अपेक्षा कम पुरातन और ‘साथ सोए’ की अपेक्षा कम अस्पष्ट है। पादटिप्पणी-चिह्न संबंधित शब्दों के बाद सही स्थान पर दिए गए हैं।
