  text: וְ/אִ֗ישׁ אֲשֶׁ֤ר יִשְׁכַּב֙ אֶת אֵ֣שֶׁת אָבִ֔י/ו עֶרְוַ֥ת אָבִ֖י/ו גִּלָּ֑ה מֽוֹת יוּמְת֥וּ שְׁנֵי/הֶ֖ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/011.yaml
  text: If a man lies with his father's wife[a], he has uncovered his father's nakedness; both of them shall surely be put to death[b]; their blood is on them.
translation:
  language: hi
  text: यदि कोई पुरुष अपने पिता की पत्नी के साथ यौन संबंध रखे, तो उसने अपने पिता का नंगापन खोला है[a]। वे दोनों निश्चय ही मृत्यु-दंड पाएँ; उनका खून उन्हीं के सिर पर है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, अधिक व्याख्यात्मक रूप में, ‘उसने यौन रूप से अपने पिता का अपमान किया है।’ इब्रानी में शाब्दिक रूप से, ‘उसने अपने पिता का नंगापन खोला है’; लैव्यव्यवस्था में यह निषिद्ध यौन संबंध के लिए प्रयुक्त एक स्थिर मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, ‘उनका खून उन्हीं पर है।’ यह एक विधिक सूत्र है, जो बताता है कि उनकी मृत्यु की जिम्मेदारी उन्हीं पर है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאִישׁ אֲשֶׁר
  choice: यदि कोई पुरुष
  rationale: विधिक प्रसंग में यह पदबंध शर्त के रूप में एक मामले का परिचय देता है। ‘पुरुष’ मूल के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: יִשְׁכַּב אֶת
  choice: के साथ सोए
  rationale: इस यौन-विधिक प्रसंग में क्रिया संभोग का संकेत देती है। यह हिंदी में स्वाभाविक, समझने योग्य और मूल की शिष्ट व्यंजना के अनुरूप है।
- source_word: אֵשֶׁת אָבִיו
  choice: अपने पिता की पत्नी
  rationale: यह मूल पद का सीधा अनुवाद है। ‘सौतेली माँ’ संभावित संदर्भ को अनावश्यक रूप से संकरा कर देता।
- source_word: עֶרְוַת אָבִיו גִּלָּה
  choice: उसने अपने पिता का नंगापन उघाड़ा है
  rationale: लैव्यव्यवस्था के निषिद्ध यौन संबंधों से जुड़े स्थिर मुहावरे और अध्याय 18 व 20 के पारस्परिक संबंध को सुरक्षित रखा गया है।
- source_word: מוֹת יוּמְתוּ שְׁנֵיהֶם
  choice: उन दोनों को निश्चय ही मार डाला जाए
  rationale: धातु के अनंत रूप और सीमित क्रिया का संयोजन दंड की निश्चितता पर बल देता है; ‘निश्चय ही’ उस जोर को व्यक्त करता है और ‘दोनों’ दोनों सहभागियों पर दंड लागू करता है।
- source_word: דְּמֵיהֶם בָּם
  choice: उनका खून उन्हीं के सिर पर है
  rationale: यह हिंदी में प्रचलित विधिक-नैतिक मुहावरे के रूप में मृत्यु की जिम्मेदारी उन्हीं पर होने का अर्थ व्यक्त करता है, साथ ही ‘खून’ की मूल बिंबात्मकता बनाए रखता है।
theological_decisions:
- issue: निषिद्ध यौन संबंध के मुहावरे का अनुवाद
  choice: उसने अपने पिता का नंगापन उघाड़ा है
  alternative: उसने यौन रूप से अपने पिता का अपमान किया है
  rationale: मूल पाठ केवल सामान्य अपमान नहीं कहता, बल्कि पवित्रता-संहिता का एक स्थिर मुहावरा प्रयोग करता है। उसे बनाए रखने से उसका शास्त्रीय अंतर्संबंध और नैतिक भार सुरक्षित रहता है।
- issue: विधिक कर्ता का लिंग
  choice: यदि कोई पुरुष
  alternative: यदि कोई व्यक्ति
  rationale: इब्रानी पाठ विशेष रूप से पुल्लिंग एकवचन अपराधी का उल्लेख करता है; इसलिए लिंग-निरपेक्ष रूप अपनाकर अर्थ को व्यापक नहीं किया गया।
- issue: मृत्यु-दंड की जिम्मेदारी का सूत्र
  choice: उनका खून उन्हीं के सिर पर है
  alternative: उनके खून का दोष उन्हीं पर है
  rationale: चुना हुआ रूप मूल के ‘खून’ वाले मुहावरे को बनाए रखता है और यह बताता है कि न्यायिक मृत्यु की जिम्मेदारी अपराधियों पर ही है, बिना अतिरिक्त धर्मशास्त्रीय व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी की है, किंतु विधिक और शास्त्रीय गरिमा बनाए रखती है। ‘के साथ सोए’ सामान्य पाठक के लिए स्पष्ट शिष्ट व्यंजना है; ‘नंगापन उघाड़ा’ मूल मुहावरे की असामान्यता और अंतर्पाठीय महत्व को जानबूझकर सुरक्षित रखता है।
