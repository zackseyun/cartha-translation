  text: וְ/אִ֣ישׁ אֽוֹ אִשָּׁ֗ה כִּֽי יִהְיֶ֨ה בָ/הֶ֥ם א֛וֹב א֥וֹ יִדְּעֹנִ֖י מ֣וֹת יוּמָ֑תוּ בָּ/אֶ֛בֶן יִרְגְּמ֥וּ אֹתָ֖/ם דְּמֵי/הֶ֥ם בָּֽ/ם־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/027.yaml
  text: And a man or a woman[a], if there is in them a medium or a spiritist, shall surely be put to death; they shall stone them with stones[c][b]. Their blood is on them.
translation:
  language: hi
  text: यदि कोई पुरुष या स्त्री मृतात्माओं से संपर्क करने वाला माध्यम या प्रेतविद्या का साधक हो, तो उसे निश्चय ही मार डाला जाए। लोग उन्हें पत्थरों से मार डालें। उनका लहू उन्हीं पर हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְאִישׁ אוֹ אִשָּׁה
  choice: किसी पुरुष या स्त्री
  rationale: इब्रानी में पुरुष और स्त्री दोनों का स्पष्ट उल्लेख है; हिन्दी में ‘किसी ...’ शर्तवाचक वाक्य को स्वाभाविक बनाता है।
- source_word: כִּי יִהְיֶה בָהֶם
  choice: यदि ... में ... हो
  rationale: एकवचन क्रिया और बहुवचन-संदर्भित सर्वनाम की इब्रानी संरचना व्यक्ति के भीतर ऐसी आत्मा की उपस्थिति को व्यक्त करती है; हिन्दी में इसे निकट और बोधगम्य रूप में रखा गया है।
- source_word: אוֹב
  choice: मृतात्माओं से संपर्क कराने वाली आत्मा
  rationale: शब्द मृतकों से संपर्क की प्रथा से जुड़ी आत्मा अथवा उस आत्मा से संबद्ध माध्यम, दोनों का संकेत दे सकता है। मुख्य पाठ में आत्मा का अर्थ रखा गया है और पादटिप्पणी में ‘माध्यम’ वाला विकल्प सुरक्षित किया गया है।
- source_word: יִדְּעֹנִי
  choice: भविष्य बताने वाली आत्मा
  rationale: यह אוֹב के साथ प्रयुक्त होकर गुप्त ज्ञान देने वाली आत्मा या उससे जुड़े साधक को सूचित कर सकता है। यह चयन आधुनिक हिन्दी में समझने योग्य है और पादटिप्पणी वैकल्पिक अर्थ बताती है।
- source_word: מוֹת יוּמָתוּ
  choice: निश्चय ही मार डाला जाए
  rationale: क्रिया के साथ infinitive absolute से आने वाले बलाघात और विधिक मृत्युदंड को स्पष्ट करता है।
- source_word: בָּאֶבֶן יִרְגְּמוּ אֹתָם
  choice: लोग उस पर पत्थर बरसाकर उसे मार डालें
  rationale: पत्थरों द्वारा मृत्युदंड का साधन और परिणाम दोनों स्वाभाविक आधुनिक हिन्दी में व्यक्त होते हैं। व्यक्ति पुरुष या स्त्री में से कोई एक है, इसलिए हिन्दी में एकवचन सर्वनाम रखा गया है।
- source_word: דְּמֵיהֶם בָּם
  choice: उसका खून उसी के सिर पर है
  rationale: यह हिन्दी में प्रचलित न्यायिक मुहावरा है, जो बताता है कि दोषी अपनी मृत्यु के लिए स्वयं उत्तरदायी है; ‘खून’ की मूल छवि भी बनी रहती है।
theological_decisions:
- issue: אוֹב और יִדְּעֹנִי का आशय आत्माओं से है या साधकों से
  choice: मुख्य पाठ में आत्मा-संबंधी अर्थ, और पादटिप्पणियों में माध्यम/साधक का विकल्प
  alternative: मुख्य पाठ में ‘मृतात्माओं से संपर्क कराने वाला माध्यम’ और ‘प्रेतात्माओं से पूछने वाला’
  rationale: इब्रानी पद व्यक्ति के ‘भीतर’ אוֹב या יִדְּעֹנִי होने की बात कहता है, पर दोनों संज्ञाएँ आत्मा और उससे जुड़े साधक के बीच अर्थ-विस्तार रखती हैं। अनुवाद वास्तविक शब्दार्थगत अस्पष्टता को पादटिप्पणी द्वारा बनाए रखता है।
- issue: पुरुष और स्त्री का स्पष्ट युग्म
  choice: ‘किसी पुरुष या स्त्री’ बनाए रखना
  alternative: ‘कोई व्यक्ति’
  rationale: मूल पाठ दोनों लिंगों को स्पष्ट रूप से नाम देता है; इसे सामान्यीकृत करके हटाया नहीं गया।
- issue: דְּמֵיהֶם בָּם का न्यायिक बल
  choice: ‘उसका खून उसी के सिर पर है’
  alternative: ‘वह अपनी मृत्यु के लिए स्वयं उत्तरदायी है’
  rationale: चयन मूल रक्त-रूपक और उत्तरदायित्व दोनों को सुरक्षित रखता है; पादटिप्पणी इसका विधिक आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य हिन्दी। विधिक कठोरता को बनाए रखते हुए दुर्बोध तांत्रिक शब्दावली से बचा गया है। ‘खून उसी के सिर पर’ परिचित हिन्दी मुहावरे के रूप में मूल न्यायिक सूत्र और रक्त-रूपक दोनों को सुरक्षित रखता है।
