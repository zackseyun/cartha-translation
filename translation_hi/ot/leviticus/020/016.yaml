source:
  edition: WLC
  text: וְ/אִשָּׁ֗ה אֲשֶׁ֨ר תִּקְרַ֤ב אֶל כָּל בְּהֵמָה֙ לְ/רִבְעָ֣ה אֹתָ֔/הּ וְ/הָרַגְתָּ֥ אֶת הָ/אִשָּׁ֖ה וְ/אֶת הַ/בְּהֵמָ֑ה מ֥וֹת יוּמָ֖תוּ דְּמֵי/הֶ֥ם בָּֽ/ם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/016.yaml
  text: If a woman approaches any animal to mate with it[a], you shall kill the woman and the animal. They shall surely be put to death[b]; their blood is on them.
translation:
  language: hi
  text: यदि कोई स्त्री किसी पशु के पास जाए कि उसके साथ मैथुन करे[a], तो तुम उस स्त्री और उस पशु को मार डालना। वे निश्चय ही मार डाले जाएँ[b]; उनका खून उन्हीं के सिर पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कि वह उसके साथ लेटे।” इब्रानी क्रिया यहाँ पशु के साथ यौन-संबंध को सूचित करती है और शाब्दिक रूप से चढ़ने से जुड़ी है।
    reason: lexical_alternative
  - marker: b
    text: या, “उनका रक्त-दोष उन्हीं पर है।” इस मुहावरे का अर्थ है कि उनकी मृत्यु की जिम्मेदारी उन्हीं पर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תִּקְרַב
  choice: के पास जाए
  rationale: क्रिया קרב का मूल अर्थ ‘निकट आना/पास जाना’ है। यह अनुवाद गति के ठोस भाव को बनाए रखता है; यौन उद्देश्य अगले पदबंध से स्पष्ट होता है।
- source_word: בְּהֵמָה
  choice: पशु
  rationale: यह व्यापक रूप से किसी पशु को सूचित करता है। ‘पशु’ आधुनिक मानक हिन्दी में स्वाभाविक है और כָּל के साथ सामान्य दायरे को बनाए रखता है।
- source_word: לְרִבְעָה אֹתָהּ
  choice: कि उसके साथ मैथुन करे
  rationale: रבע यहाँ पशु के साथ यौन-संबंध, शाब्दिक रूप से चढ़ने/चढ़वाने से जुड़ी क्रिया, को सूचित करता है। ‘मैथुन करे’ स्पष्ट, संक्षिप्त और गरिमापूर्ण है।
- source_word: וְהָרַגְתָּ
  choice: तो तुम ... मार डालना
  rationale: व्यवस्था-संबंधी प्रसंग में यह आदेशात्मक बल रखता है। हिन्दी का यह रूप स्पष्ट निर्देश देता है और कानूनी शैली में स्वाभाविक रहता है।
- source_word: מוֹת יוּמָתוּ
  choice: वे निश्चय ही मार डाले जाएँ
  rationale: क्रिया के साथ infinitive absolute मृत्यु-दंड की निश्चितता पर बल देता है। ‘निश्चय ही’ उस जोर को व्यक्त करता है और कर्मवाच्य मूल दंड-विधान के रूप को बनाए रखता है।
- source_word: דְּמֵיהֶם בָּם
  choice: उनका खून उन्हीं के सिर पर है
  rationale: यह मुहावरा बताता है कि उनकी मृत्यु की जिम्मेदारी उन्हीं पर है। हिन्दी का प्रचलित मुहावरा अर्थ को स्पष्ट रखते हुए ‘खून’ की मूल छवि भी सुरक्षित रखता है।
theological_decisions:
- issue: पशुगमन से संबंधित कठोर दंड-विधान का अनुवाद
  choice: निषेध और दंड को सीधे तथा स्पष्ट रूप में प्रस्तुत करना
  alternative: ‘उसके साथ लेटे’ जैसे अपेक्षाकृत परोक्ष शब्दों का प्रयोग करना
  rationale: मूल पाठ कानूनी और दंडात्मक है। अनुवाद उसकी गंभीरता और स्पष्टता को बनाए रखता है, पर पाठ से बाहर की नैतिक या सांप्रदायिक व्याख्या नहीं जोड़ता।
- issue: דְּמֵיהֶם בָּם में दायित्व का भाव
  choice: ‘उनका खून उन्हीं के सिर पर है’
  alternative: ‘उनका रक्त-दोष उन्हीं पर है’
  rationale: ‘रक्त-दोष’ अधिक तकनीकी और व्याख्यात्मक है। चुना हुआ मुहावरा मूल रक्त-छवि तथा स्वयं उत्तरदायी होने का अर्थ दोनों बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में स्पष्ट, गरिमापूर्ण और कानूनी स्वर रखा गया है। ‘मैथुन’ यौन कृत्य को बिना अस्पष्टता या अनावश्यक अशिष्टता के व्यक्त करता है। आदेश, दंड की निश्चितता और अंतिम रक्त-मुहावरे का नैतिक-कानूनी बल सुरक्षित रखा गया है।
