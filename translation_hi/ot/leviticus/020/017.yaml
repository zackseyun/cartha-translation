source:
  edition: WLC
  text: וְ/אִ֣ישׁ אֲשֶׁר יִקַּ֣ח אֶת אֲחֹת֡/וֹ בַּת אָבִ֣י/ו א֣וֹ בַת אִ֠מּ/וֹ וְ/רָאָ֨ה אֶת עֶרְוָתָ֜/הּ וְ/הִֽיא תִרְאֶ֤ה אֶת עֶרְוָת/וֹ֙ חֶ֣סֶד ה֔וּא וְ/נִ֨כְרְת֔וּ לְ/עֵינֵ֖י בְּנֵ֣י עַמָּ֑/ם עֶרְוַ֧ת אֲחֹת֛/וֹ גִּלָּ֖ה עֲוֺנ֥/וֹ יִשָּֽׂא־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/017.yaml
  text: If a man takes his sister[a], his father's daughter or his mother's daughter, and sees her nakedness, and she sees his nakedness, it is a disgrace, and they shall be cut off in the sight of the sons of their people. He has uncovered his sister's nakedness[b]; he shall bear his guilt.
translation:
  language: hi
  text: यदि कोई पुरुष अपनी बहन[a] को—चाहे वह उसके पिता की बेटी हो या उसकी माँ की बेटी—लेता है, और वह उसकी नग्नता देखता है और वह स्त्री उसकी नग्नता देखती है, तो यह लज्जाजनक बात है। वे अपने लोगों की आँखों के सामने अलग किए जाएँगे[b]। उसने अपनी बहन की नग्नता प्रकट की है; वह अपना दोष उठाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पिता की ओर से या माँ की ओर से बहन।
    reason: clarification
  - marker: b
    text: “अलग किए जाएँगे” इब्रानी का विधिक सूत्र है; यह अपने आप में यह निश्चित नहीं करता कि दंड मृत्यु, समुदाय से निष्कासन या किसी अन्य प्रकार का हटाया जाना है।
    reason: alternative_reading
lexical_decisions:
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी का पुल्लिंग एकवचन और विधिक स्वरूप बनाए रखता है।
- source_word: יִקַּח
  choice: लेता है
  rationale: मूल क्रिया का अर्थ ‘लेना’ है; विवाह या यौन-संबंध को अनावश्यक रूप से स्पष्ट किए बिना स्रोत की व्यापकता बनाए रखी गई है।
- source_word: אֲחֹתוֹ בַּת אָבִיו אוֹ בַת אִמּוֹ
  choice: अपनी बहन को—चाहे वह उसके पिता की बेटी हो या उसकी माँ की बेटी
  rationale: यह स्पष्ट करता है कि पिता या माता की ओर से बहन, दोनों निषेध में सम्मिलित हैं।
- source_word: וְרָאָה אֶת עֶרְוָתָהּ וְהִיא תִרְאֶה אֶת עֶרְוָתוֹ
  choice: वह उसका नंगापन देखता है और वह स्त्री उसका नंगापन देखती है
  rationale: ‘नंगापन देखना’ वाले इब्रानी यौन-विधिक मुहावरे और उसकी पारस्परिक संरचना को सुरक्षित रखा गया है।
- source_word: חֶסֶד
  choice: लज्जाजनक बात
  rationale: यहाँ शब्द अपने सामान्य सकारात्मक अर्थ में नहीं, बल्कि दुर्लभ नकारात्मक अर्थ में घृणित या लज्जाजनक कृत्य को सूचित करता है।
- source_word: וְנִכְרְתוּ
  choice: काट डाले जाएँगे
  rationale: खרת के विधिक सूत्र को इस तरह रखा गया है कि दंड की ठीक रीति—मृत्यु, निष्कासन या अन्य प्रकार का हटाया जाना—निर्धारित न हो।
- source_word: לְעֵינֵי בְּנֵי עַמָּם
  choice: अपने लोगों की आँखों के सामने
  rationale: इब्रानी दृश्यात्मक मुहावरे का स्वाभाविक आधुनिक हिन्दी रूप।
- source_word: גִּלָּה
  choice: उघाड़ा है
  rationale: लैव्यव्यवस्था के निषिद्ध यौन-संबंधों में प्रयुक्त ‘नंगापन उघाड़ना’ मुहावरे को बनाए रखता है।
- source_word: עֲוֺנוֹ יִשָּׂא
  choice: अपना दोष उठाएगा
  rationale: दोष और उसके परिणाम दोनों की विधिक-धार्मिक गंभीरता को बिना केवल दंड तक सीमित किए व्यक्त करता है।
theological_decisions:
- issue: इस पद में חֶסֶד का अर्थ
  choice: 'नकारात्मक अर्थ: ‘लज्जाजनक बात’'
  alternative: सामान्य सकारात्मक अर्थ ‘करुणा’ या ‘अटल प्रेम’
  rationale: संदर्भ में सकारात्मक अर्थ असंगत है; यहाँ दुर्लभ नकारात्मक अर्थ अपेक्षित है।
- issue: ‘काट डाले जाएँगे’ दंड की प्रकृति
  choice: इब्रानी विधिक सूत्र को अस्पष्टता सहित बनाए रखना
  alternative: इसे स्पष्ट रूप से मृत्युदंड या समाज से निष्कासन कहना
  rationale: मूल सूत्र यहाँ दंड लागू किए जाने की सटीक रीति निर्धारित नहीं करता; इसलिए विवादित अर्थ को अनावश्यक रूप से हल नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक और गरिमापूर्ण शैली। ‘नंगापन देखना/उघाड़ना’ तथा ‘काट डाले जाना’ जैसे स्रोत-मुहावरों को जानबूझकर बनाए रखा गया है, जबकि वाक्य-विन्यास सामान्य पाठक के लिए स्वाभाविक रखा गया है।
