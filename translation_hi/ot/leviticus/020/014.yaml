  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֗ישׁ אֲשֶׁ֨ר יִקַּ֧ח אֶת אִשָּׁ֛ה וְ/אֶת אִמָּ֖/הּ זִמָּ֣ה הִ֑וא בָּ/אֵ֞שׁ יִשְׂרְפ֤וּ אֹת/וֹ֙ וְ/אֶתְ/הֶ֔ן וְ/לֹא תִהְיֶ֥ה זִמָּ֖ה בְּ/תוֹכְ/כֶֽם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/020/014.yaml
  text: If a man takes a woman and her mother[a], it is depravity. They shall burn him and them with fire[c][b], so that there will not be depravity among you.
translation:
  language: hi
  text: यदि कोई पुरुष किसी स्त्री और उसकी माँ को ले[a], तो यह घोर दुष्कर्म है। वे उसे और उन दोनों को आग में जलाएँ[b], ताकि तुम्हारे बीच घोर दुष्कर्म न हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी स्त्री और उसकी माँ से विवाह करे।” इब्रानी क्रिया का मूल अर्थ “लेना” है और कानूनी प्रसंग में वह विवाह का संकेत दे सकती है, पर यहाँ विवाह का स्पष्ट उल्लेख नहीं है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “वे उसे और उन्हें आग में जलाएँ।” “उन्हें” से आशय उस स्त्री और उसकी माँ से है।
    reason: source_form_and_pronoun_clarification
lexical_decisions:
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: इब्रानी शब्द पुल्लिंग एकवचन है और इस व्यवस्था में अपराध करने वाले पुरुष को सूचित करता है।
- source_word: יִקַּח
  choice: ग्रहण करे
  rationale: मूल अर्थ ‘लेना’ है और इस कानूनी-यौन प्रसंग में विवाह या स्त्री को पत्नी के रूप में लेने का संकेत हो सकता है; ‘ग्रहण करे’ उस दायरे को बनाए रखता है, जबकि विवाह को मुख्य पाठ में अनिवार्य नहीं बनाता।
- source_word: אִשָּׁה וְאֶת אִמָּהּ
  choice: किसी स्त्री और उसकी माँ
  rationale: אִשָּׁה का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है; व्यापक ‘स्त्री’ मूल की अस्पष्टता बनाए रखता है, और אִמָּהּ स्पष्टतः उसी स्त्री की माँ है।
- source_word: זִמָּה
  choice: घोर अनैतिकता
  rationale: यह शब्द लैव्यव्यवस्था के यौन कानूनों में अत्यंत निंदनीय और विकृत आचरण को दर्शाता है। आधुनिक हिंदी में यह चयन उसकी नैतिक गंभीरता को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בָּאֵשׁ יִשְׂרְפוּ
  choice: आग में जला दिया जाए
  rationale: हिंदी की कानूनी शैली में कर्मवाच्य स्वाभाविक है और दंड को स्पष्ट करता है; ‘आग में’ दहन के साधन और प्रक्रिया दोनों को व्यक्त करता है।
- source_word: אֹתוֹ וְאֶתְהֶן
  choice: उस पुरुष और उन दोनों स्त्रियों को
  rationale: बहुवचन स्त्रीलिंग सर्वनाम का संदर्भ पहले उल्लिखित स्त्री और उसकी माँ से है; हिंदी में इसे स्पष्ट करना अस्पष्ट सर्वनाम से अधिक स्वाभाविक है।
- source_word: וְלֹא תִהְיֶה זִמָּה בְּתוֹכְכֶם
  choice: ताकि तुम्हारे बीच ऐसी घोर अनैतिकता न रहे
  rationale: ‘ताकि’ दंड के प्रयोजन/परिणाम को स्वाभाविक हिंदी में व्यक्त करता है और ‘तुम्हारे बीच’ בְּתוֹכְכֶם का सहज अनुवाद है।
theological_decisions:
- issue: ‘स्त्री और उसकी माँ को ग्रहण करने’ से सूचित संबंध का स्वरूप
  choice: मुख्य पाठ में व्यापक ‘ग्रहण करे’ रखा गया है।
  alternative: ‘किसी स्त्री और उसकी माँ से विवाह करे’ या ‘उन्हें पत्नी बनाए।’
  rationale: לקח कानूनी प्रसंग में विवाह का संकेत दे सकता है, पर यहाँ अलग से विवाह-सूचक शब्द नहीं है। व्यापक अनुवाद मूल की वास्तविक अस्पष्टता को सुरक्षित रखता है।
- issue: दंड-वाक्य की वाच्य-रचना
  choice: 'स्वाभाविक हिंदी कानूनी कर्मवाच्य: ‘जला दिया जाए।’'
  alternative: 'मूल की सक्रिय रचना के निकट: ‘वे उस पुरुष और उन दोनों स्त्रियों को आग में जलाएँ।’'
  rationale: इब्रानी क्रिया सक्रिय बहुवचन है, पर कर्ता व्यक्त नहीं किया गया। हिंदी में ‘वे’ जोड़ना अनिश्चित कर्ता को अधिक उभारता; कर्मवाच्य बिना नया कर्ता निर्धारित किए कानूनी आदेश स्पष्ट करता है।
- issue: זִמָּה की नैतिक तीव्रता
  choice: ‘घोर अनैतिकता’
  alternative: ‘दुष्टता,’ ‘लज्जाजनक काम,’ ‘जघन्य कृत्य’ या ‘व्यभिचार।’
  rationale: शब्द किसी सामान्य भूल से अधिक, गंभीर यौन नैतिक विकृति को दर्शाता है। ‘व्यभिचार’ अर्थ को अनावश्यक रूप से एक विशिष्ट श्रेणी तक सीमित कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण और स्पष्ट कानूनी शैली अपनाई गई है। ‘ग्रहण करे’ थोड़ा औपचारिक है, किंतु ‘ले’ की संभावित बोलचालगत या अस्पष्ट ध्वनि से बचते हुए मूल לקח का व्यापक अर्थ सुरक्षित रखता है। मुख्य पाठ में सर्वनाम का संदर्भ स्पष्ट किया गया है और मूल की वैवाहिक अस्पष्टता पादटिप्पणी में दी गई है।
