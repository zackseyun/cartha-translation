source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶצְבָּע֖/וֹ מִן הַ/דָּ֑ם וְ/הִזָּ֞ה שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֵ֖ת פְּנֵ֥י הַ/פָּרֹֽכֶת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/017.yaml
  text: Then the priest shall dip his finger in some of the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain.
translation:
  language: hi
  text: तब याजक अपनी उँगली लहू में डुबोए और याहवे के सामने, पर्दे[a] के आगे, लहू सात बार छिड़के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भीतरी पर्दा।” इब्रानी शब्द पवित्रस्थान के पवित्र भाग को अलग करने वाले पर्दे के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְטָבַל
  choice: तब ... डुबोए
  rationale: क्रिया का मूल अर्थ ‘डुबोना’ है। यहाँ क्रमिक विधि-विधान के संदर्भ में ‘तब’ और आज्ञार्थक-विधिक ‘डुबोए’ स्वाभाविक हैं।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: बलिदान और पवित्रस्थान की सेवा करने वाले כֹּהֵן के लिए प्रचलित, स्पष्ट हिन्दी शब्द।
- source_word: אֶצְבָּעוֹ מִן הַדָּם
  choice: अपनी उँगली लहू में
  rationale: शाब्दिक संरचना में ‘लहू में से’ है, पर טבל के साथ हिन्दी में ‘लहू में उँगली डुबोना’ स्वाभाविक है; इससे केवल उँगली डुबोने की क्रिया स्पष्ट रहती है।
- source_word: וְהִזָּה
  choice: उसमें से छिड़के
  rationale: पुरोहितीय विधि में נזה तरल, विशेषकर लहू, छिड़कने को दर्शाता है। इब्रानी में कर्म निहित है; हिन्दी में ‘उसमें से’ लहू को स्वाभाविक रूप से पुनः इंगित करता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: मूल संख्या और आवृत्ति का सीधा अनुवाद।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का अर्थ ‘सामने/उपस्थिति में’ है और יְהוָה को उसके व्यक्तिगत नाम ‘याहवे’ के रूप में रखा गया है।
- source_word: אֵת פְּנֵי הַפָּרֹכֶת
  choice: पर्दे के आगे
  rationale: यह वाक्यांश पवित्रस्थान के विभाजक पर्दे के सामने या उसकी ओर की स्थिति बताता है। ‘पर्दे के आगे’ सामान्य हिन्दी में स्थानिक संबंध स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है; ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है।
- issue: פָּרֹכֶת का अर्थ
  choice: पर्दा
  alternative: ओट का पर्दा / भीतरी पर्दा
  rationale: यह पवित्रस्थान के पवित्र भाग को अलग करने वाला विशिष्ट पर्दा है। मुख्य पाठ में सरल आधुनिक शब्द रखा गया है और उसका विधिक-सांस्कृतिक आशय पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण विधिक भाषा अपनाई गई है। क्रियाओं को क्रमिक अनुष्ठानिक निर्देश के रूप में रखा गया है; ‘लहू’ और ‘याजक’ जैसे परिचित बाइबलीय शब्द सामान्य पाठक के लिए स्पष्ट हैं।
