  text: א֚וֹ הוֹדַ֣ע אֵלָ֔י/ו חַטָּאת֖/וֹ אֲשֶׁ֣ר חָטָ֑א וְ/הֵבִ֨יא קָרְבָּנ֜/וֹ שְׂעִירַ֤ת עִזִּים֙ תְּמִימָ֣ה נְקֵבָ֔ה עַל חַטָּאת֖/וֹ אֲשֶׁ֥ר חָטָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/028.yaml
  text: Or if the sin that he has committed is made known to him[b][a], then he shall bring as his offering for the sin that he has committed a female goat without blemish.
translation:
  language: hi
  text: या यदि उसके किए हुए पाप का उसे पता चले[a], तो वह अपने किए हुए पाप के लिए अपने चढ़ावे के रूप में एक दोषरहित मादा बकरी लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका पाप उसके ज्ञान में लाया जाए” अथवा “उसे अपने पाप की सूचना दी जाए।” इब्रानी कर्मवाच्य रूप यह खुला छोड़ता है कि उसे स्वयं पाप का पता चलता है या किसी के द्वारा उसकी सूचना दी जाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: א֚וֹ
  choice: या यदि
  rationale: यह पिछले कानूनी प्रसंग के विकल्प को प्रस्तुत करता है; हिन्दी में ‘या यदि’ से वैकल्पिक शर्त स्वाभाविक और स्पष्ट होती है।
- source_word: הוֹדַע אֵלָיו
  choice: उसे बता दिया जाए
  rationale: होफल रूप के कर्मवाच्य भाव को बनाए रखता है और यह खुला छोड़ता है कि जानकारी किसी व्यक्ति के द्वारा मिली या किसी अन्य तरह उसके ज्ञान में आई।
- source_word: חַטָּאתוֹ ... אֲשֶׁר חָטָא
  choice: उसका किया हुआ पाप
  rationale: यहाँ חַטָּאת अपराधपूर्ण कर्म को दर्शाता है; आधुनिक हिन्दी में यह संक्षिप्त और स्वाभाविक है।
- source_word: וְהֵבִיא
  choice: तो वह ... लाए
  rationale: कानूनी निर्देश में क्रम और दायित्व व्यक्त करता है; ‘तो’ शर्त के परिणाम को स्पष्ट करता है।
- source_word: קָרְבָּנוֹ
  choice: अपने चढ़ावे के रूप में
  rationale: קרבן किसी प्रस्तुत की जाने वाली भेंट या बलि को दर्शाता है; ‘चढ़ावा’ लैव्यव्यवस्था के बलिदानी संदर्भ में सुबोध है।
- source_word: שְׂעִירַת עִזִּים ... נְקֵבָה
  choice: एक बकरी, अर्थात् मादा
  rationale: मूल पाठ में प्रजाति के स्त्रीलिंग रूप के साथ נְקֵבָה भी स्पष्ट रूप से आया है; अनावश्यक हिन्दी पुनरुक्ति घटाते हुए इस विशिष्टता को बनाए रखा गया है।
- source_word: תְּמִימָה
  choice: निर्दोष
  rationale: बलिदानी पशु में शारीरिक दोष न होने का पारंपरिक और सहज हिन्दी पद है; इसका अर्थ नैतिक निष्पापता नहीं है।
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: अपने किए हुए पाप के लिए
  rationale: עַל यहाँ उस पाप से चढ़ावे का संबंध या उसका प्रयोजन बताता है; ‘के लिए’ अर्थ को बिना अधिक व्याख्या के व्यक्त करता है।
theological_decisions:
- issue: बलिदानी व्यवस्था में חַטָּאת का अर्थ
  choice: दोनों प्रसंगों में ‘पाप’
  alternative: दूसरे प्रसंग में ‘पापबलि’
  rationale: इस पद में चढ़ावा קָרְבָּנוֹ से अलग पहचाना गया है और वह मादा बकरी है; अतः חַטָּאתוֹ उस अपराध को दर्शाता है जिसके लिए चढ़ावा लाया जाता है, स्वयं बलि को नहीं।
- issue: पाप के ज्ञान में आने की रीति
  choice: कर्मवाच्य ‘उसे बता दिया जाए’
  alternative: ‘उसे अपने पाप का एहसास हो जाए’ या ‘उसका पाप उसे मालूम हो जाए’
  rationale: मूल का कर्मवाच्य रूप व्यक्तिगत अनुभूति और किसी के द्वारा सूचित किए जाने के बीच पूरी तरह निर्णय नहीं करता; मुख्य पाठ कर्मवाच्य बल बनाए रखता है और पादटिप्पणी विकल्प बताती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट कानूनी शैली रखी गई है। ‘लाए’ विधिक आदेश को स्वाभाविक ढंग से व्यक्त करता है। ‘निर्दोष’ बलिदानी संदर्भ में शारीरिक दोषरहित होने के अर्थ में प्रयुक्त है।
