base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/018.yaml
  text: And from the blood he shall put some on the horns of the altar that is before Yahweh[a], which is in the tent of meeting, and all the blood he shall pour out at the base of the altar of burnt offering, which is at the entrance of the tent of meeting.
translation:
  language: hi
  text: और वह लहू में से कुछ[a] उस वेदी के सींगों पर लगाए, जो याहवे के सामने, अर्थात् मिलाप के तंबू में है; और सारा लहू वह होम-बलि की वेदी के आधार पर उंडेल दे, जो मिलाप के तंबू के प्रवेश-द्वार पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक क्रम है, “और लहू में से वह लगाए।” आगे के “सारा लहू” के विपरीत निहित अंशवाचक भाव स्पष्ट करने के लिए “कुछ” जोड़ा गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּמִן הַדָּם
  choice: और वह उस लहू में से कुछ
  rationale: इब्रानी में शाब्दिक रूप से ‘और लहू में से वह लगाए’ है। आगे आए ‘सारा लहू’ के विपरीत यहाँ अंशवाचक भाव निहित है; स्वाभाविक हिन्दी में उसे स्पष्ट करने के लिए ‘कुछ’ जोड़ा गया है।
- source_word: יִתֵּן
  choice: लगाए
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर वेदी के सींगों पर लहू रखने की अनुष्ठानिक क्रिया के लिए ‘लगाए’ स्वाभाविक और सटीक है।
- source_word: קַרְנֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों
  rationale: ‘सींग’ मूल रूपक और प्राचीन वेदी की पारिभाषिक रचना—उसके उभरे हुए कोने—दोनों को सुरक्षित रखता है।
- source_word: אֲשֶׁר לִפְנֵי יְהוָה
  choice: जो याहवे के सामने
  rationale: לִפְנֵי का स्थानसूचक अर्थ ‘के सामने’ है; यְהוָה को व्यक्तिगत ईश्वरीय नाम के रूप में ‘याहवे’ लिप्यंतरित किया गया है।
- source_word: אֲשֶׁר בְּאֹהֶל מוֹעֵד
  choice: जो ... मिलाप के तंबू में है
  rationale: אֹהֶל מוֹעֵד के लिए ‘मिलाप का तंबू’ स्पष्ट और प्रचलित हिन्दी पद है; संबंधवाचक वाक्य वेदी का स्थान बताता है।
- source_word: וְאֵת כָּל הַדָּם
  choice: और वह सारा लहू
  rationale: मूल पाठ ‘सारा लहू’ कहता है। संदर्भ में इससे बचा हुआ लहू अभिप्रेत हो सकता है, फिर भी पाठ की अभिव्यक्ति को बदले बिना सुरक्षित रखा गया है।
- source_word: יִשְׁפֹּךְ
  choice: उंडेल दे
  rationale: שׁפך का अर्थ ‘उंडेलना’ है। ‘दे’ क्रिया की पूर्णता को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל יְסוֹד
  choice: आधार पर
  rationale: יְסוֹד का अर्थ नींव या आधार है; वेदी के संदर्भ में ‘आधार’ सहज है। हिन्दी में क्रिया के साथ ‘पर’ स्थानगत गंतव्य को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होम-बलि की वेदी
  rationale: עֹלָה उस बलि का पारिभाषिक नाम है जो पूरी तरह जलाई जाती थी; ‘होम-बलि’ हिन्दी बाइबलीय परंपरा में संक्षिप्त और समझने योग्य पद है।
- source_word: אֲשֶׁר פֶּתַח אֹהֶל מוֹעֵד
  choice: जो मिलाप के तंबू के प्रवेश-द्वार पर है
  rationale: פֶּתַח किसी खुलने के स्थान या प्रवेश को दर्शाता है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्थान को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: כָּל הַדָּם का संदर्भगत आशय
  choice: सारा लहू
  alternative: बचा हुआ सारा लहू
  rationale: अनुष्ठान के क्रम में पहले कुछ लहू लगाया गया है, इसलिए व्यावहारिक रूप से शेष लहू अभिप्रेत है; फिर भी मूल पाठ केवल ‘सारा लहू’ कहता है। अनकहे ‘बचा हुआ’ को मुख्य पाठ में जोड़कर तनाव को समाप्त नहीं किया गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक है। विधिक शैली के लिए ‘लगाए’ और ‘उंडेल दे’ का प्रयोग किया गया है। ‘वेदी के सींग’, ‘होम-बलि’ और ‘मिलाप का तंबू’ जैसे आवश्यक उपासना-संबंधी पद बनाए रखे गए हैं।
