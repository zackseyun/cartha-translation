source:
  edition: WLC
  text: וְ/אֵת֙ שְׁתֵּ֣י הַ/כְּלָיֹ֔ת וְ/אֶת הַ/חֵ֨לֶב֙ אֲשֶׁ֣ר עֲלֵי/הֶ֔ן אֲשֶׁ֖ר עַל הַ/כְּסָלִ֑ים וְ/אֶת הַ/יֹּתֶ֨רֶת֙ עַל הַ/כָּבֵ֔ד עַל הַ/כְּלָי֖וֹת יְסִירֶֽ/נָּה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/009.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, along with the kidneys, he shall remove it.
translation:
  language: hi
  text: और दोनों गुर्दे, उन पर की चर्बी जो कमर के पास है, और गुर्दों समेत कलेजे पर का उपांग[a] वह निकाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “कलेजे की पालि।” इस शारीरिक भाग के लिए प्रयुक्त हिब्रू शब्द का ठीक अर्थ अनिश्चित है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: यह बलि-पशु के दो गुर्दों का स्पष्ट शारीरिक उल्लेख है; ‘दोनों गुर्दे’ स्वाभाविक आधुनिक हिन्दी है और हिब्रू की संख्या-स्पष्टता बनाए रखता है।
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: उन पर की चर्बी
  rationale: बलिदान-संबंधी प्रसंग में חֵלֶב चढ़ाने के लिए अलग की जाने वाली चरबी को दर्शाता है; यह पदबंध गुर्दों पर स्थित चर्बी को स्पष्ट करता है।
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: जो कमर के पास है
  rationale: כְּסָלִים कमर अथवा पार्श्व-भाग के शारीरिक क्षेत्र को दर्शाता है। ‘कमर के पास’ सामान्य पाठक के लिए स्पष्ट है और अनावश्यक तकनीकी सूक्ष्मता से बचता है।
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: कलेजे पर का उपांग
  rationale: יוֹתֶרֶת एक अनिश्चित शारीरिक पद है, जो कलेजे से जुड़े किसी उपांग या पालि को सूचित करता है। ‘उपांग’ अनिश्चितता को बनाए रखते हुए किसी निश्चित आधुनिक शारीरिक पहचान का दावा नहीं करता।
- source_word: עַל הַכְּלָיוֹת
  choice: गुर्दों समेत
  rationale: इस दोहराए गए बलिदानी सूत्र में यह पद संबंधित भाग को गुर्दों के साथ हटाने की क्रिया से जोड़ता है; ‘समेत’ उस अनुष्ठानिक समूह को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְסִירֶנָּה
  choice: वह निकाल दे
  rationale: स्रोत का हिफ़ील रूप निर्दिष्ट अंगों को पशु से अलग करने का निर्देश देता है। ‘निकाल दे’ हिन्दी में विधिक-अनुष्ठानिक आदेश को स्पष्ट और संक्षिप्त रखता है।
