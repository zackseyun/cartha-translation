  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद पिछले वाक्य से जुड़ा होने के कारण आरम्भिक ‘और’ बनाए रखा गया है। ‘कलेजा’ सामान्य हिन्दी में ‘यकृत’ से अधिक सहज है, जबकि ‘उपांग’ मूल शब्द की शारीरिक अनिश्चितता सुरक्षित रखता है।
