base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/032.yaml
  text: And if he brings a lamb as his offering for a sin offering[a], he shall bring a female without blemish.
translation:
  language: hi
  text: और यदि वह पापबलि[a] के लिए अपने चढ़ावे के रूप में एक मेमना लाए, तो वह दोषरहित मादा लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת उस बलिदान को दर्शा सकता है जो पाप और अनुष्ठानिक अशुद्धता से निपटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: यह संयोजन पिछले निर्देश से संबंध बनाए रखते हुए एक वैकल्पिक स्थिति प्रस्तुत करता है।
- source_word: כֶּבֶשׂ
  choice: एक मेमना
  rationale: यहाँ भेड़-वंश के पशु का उल्लेख है; बलिदान-संबंधी संदर्भ में 'मेमना' स्वाभाविक और प्रचलित है।
- source_word: יָבִיא
  choice: लाए
  rationale: בוא के हिफ़ील रूप का ठोस अर्थ 'लाना' है और बलिदान के संदर्भ में यही क्रिया उपयुक्त है।
- source_word: קָרְבָּנוֹ
  choice: अपने चढ़ावे के रूप में
  rationale: קָרְבָּן परमेश्वर के निकट लाई गई भेंट को दर्शाता है; यह अनुवाद संबंधवाचक प्रत्यय और वाक्यगत भूमिका दोनों स्पष्ट करता है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: लैव्यव्यवस्था में חַטָּאת एक विशिष्ट बलिदान-श्रेणी है। 'पापबलि' परिचित और स्पष्ट है, जबकि शुद्धिकरण का वास्तविक अर्थ-संकेत पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: נְקֵבָה
  choice: मादा
  rationale: यह शब्द पशु के मादा होने की स्पष्ट माँग व्यक्त करता है।
- source_word: תְמִימָה
  choice: निर्दोष
  rationale: बलिदान-विधि में תמים का अर्थ शारीरिक दोष से रहित पशु है; 'निर्दोष' संक्षिप्त और स्वाभाविक है।
- source_word: יְבִיאֶנָּה
  choice: वह ... लाए
  rationale: स्त्रीलिंग एकवचन प्रत्यय मादा पशु की ओर संकेत करता है; हिंदी में वस्तु को स्पष्ट रूप से रखकर निर्देशात्मक बल बनाए रखा गया है।
theological_decisions:
- issue: बलिदान-विधि में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप से निपटने वाले बलिदान को नाम देता है, पर लैव्यव्यवस्था में इसका संबंध अनुष्ठानिक अशुद्धता के शुद्धिकरण से भी हो सकता है। मुख्य पाठ में प्रचलित श्रेणी-नाम रखा गया है और दूसरा वास्तविक अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, सामान्य पाठक के लिए सुबोध बलिदान-विधिक भाषा। 'चढ़ावा' और 'पापबलि' जैसे परिचित शब्द रखे गए हैं; इब्रानी की शर्तीय संरचना और दोहराई गई 'लाना' क्रिया सुरक्षित हैं।
