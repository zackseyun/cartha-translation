base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/012.yaml
  text: He shall bring out the whole bull to a clean place[a] outside the camp, to the ash dump, and burn it on wood in the fire[b]; it shall be burned at the ash dump.
translation:
  language: hi
  text: वह पूरे बैल को छावनी के बाहर एक शुद्ध स्थान[a]—राख डालने के स्थान[b]—पर ले जाए और उसे लकड़ियों पर आग में जला दे; उसे राख डालने के उसी स्थान पर जलाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् अनुष्ठान की दृष्टि से शुद्ध स्थान।
    reason: lexical_alternative
  - marker: b
    text: अर्थात् वेदी की राख डालने के लिए निर्धारित स्थान।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: ले जाए
  rationale: हिफ़ील रूप किसी वस्तु को बाहर ले जाने का भाव देता है; छावनी के बाहर का स्पष्ट उल्लेख हिन्दी में इस दिशात्मक अर्थ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַפָּר
  choice: पूरे बछड़े को
  rationale: כָּל निश्चित संज्ञा के साथ पशु की संपूर्णता पर बल देता है; ‘पूरे बछड़े’ सहज और सटीक है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह छावनी की सीमा से बाहर का स्थान बताता है।
- source_word: מָקוֹם טָהוֹר
  choice: किसी शुद्ध स्थान
  rationale: लैव्यव्यवस्था के संदर्भ में טָהוֹר का अनुष्ठानिक अर्थ है; ‘शुद्ध’ सामान्य पाठक के लिए स्वाभाविक है और इस अर्थ को बनाए रखता है।
- source_word: שֶׁפֶךְ הַדֶּשֶׁן
  choice: राख डालने की जगह
  rationale: शाब्दिक वाक्यांश राख उँडेलने या डालने के निर्धारित स्थान को दर्शाता है; यह ‘राख का ढेर’ की अपेक्षा स्थल के नियत उपयोग को अधिक स्पष्ट रखता है।
- source_word: וְשָׂרַף אֹתוֹ
  choice: और उसे ... जला दे
  rationale: שׂרף का सामान्य अर्थ ‘जलाना’ है; विधिक निर्देश के लिए ‘जला दे’ स्वाभाविक हिन्दी है।
- source_word: עַל עֵצִים בָּאֵשׁ
  choice: लकड़ियों पर आग में
  rationale: यह अनुवाद ईंधन (‘लकड़ियों पर’) और आग (‘आग में’) दोनों को अलग-अलग बनाए रखता है।
- source_word: עַל שֶׁפֶךְ הַדֶּשֶׁן יִשָּׂרֵף
  choice: राख डालने की जगह पर ही उसे जलाया जाए
  rationale: अंतिम निष्क्रिय उपवाक्य निर्धारित स्थान को दोहराकर बल देता है; ‘ही’ उस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: טָהוֹר में अनुष्ठानिक शुद्धता का भाव
  choice: शुद्ध स्थान
  alternative: अनुष्ठान की दृष्टि से शुद्ध स्थान
  rationale: बलिदान-संबंधी संदर्भ में अनुष्ठानिक शुद्धता निहित है, पर मुख्य पाठ में अतिरिक्त व्याख्या जोड़ने के बजाय उसे पादटिप्पणी में स्पष्ट किया गया है।
- issue: שֶׁפֶךְ הַדֶּשֶׁן का स्वरूप
  choice: राख डालने की जगह
  alternative: राख का ढेर
  rationale: मूल वाक्यांश केवल राख के ढेर के बजाय वेदी की राख के निपटान के लिए निर्धारित स्थल की ओर संकेत करता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और निर्देशात्मक हिन्दी अपनाई गई है। मूल पाठ में स्थान के दोहराव को सुरक्षित रखा गया है। ‘बछड़ा’ यहाँ बलिदान के नर गोवंश के लिए प्रचलित बाइबलीय शब्द है।
