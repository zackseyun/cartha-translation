source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/הּ יָסִ֗יר כַּ/אֲשֶׁ֨ר הוּסַ֣ר חֵלֶב֮ מֵ/עַ֣ל זֶ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֤יר הַ/כֹּהֵן֙ הַ/מִּזְבֵּ֔חָ/ה לְ/רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָ֑ה וְ/כִפֶּ֥ר עָלָ֛י/ו הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לֽ/וֹ־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/031.yaml
  text: And he shall remove all its fat[a], just as the fat is removed from the sacrifice of peace offerings, and the priest shall burn it on the altar as a pleasing aroma to Yahweh. And the priest shall make atonement for him[b], and he will be forgiven.
translation:
  language: hi
  text: और वह उसकी सारी चरबी निकाल दे, जैसे शांति-बलि में से चरबी निकाली जाती है। याजक उसे वेदी पर यहोवा के लिए मनभावनी सुगंध[b] के रूप में जलाए। याजक उसके लिए प्रायश्चित करे, और उसे क्षमा कर दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: b
    text: ‘मनभावनी सुगंध’ बलि के लिए प्रयुक्त एक प्रचलित अभिव्यक्ति है, जो यहोवा द्वारा भेंट के स्वीकार किए जाने का संकेत देती है।
    reason: सांस्कृतिक टिप्पणी पाठ के सुगंध-रूपक और उसके बलिदानी प्रयोग को स्पष्ट करती है।
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: चरबी
  rationale: यह शब्द बलि के पशु से निकालकर वेदी पर चढ़ाई जाने वाली चरबी को दर्शाता है। ‘चरबी’ इसका सीधा और सामान्य हिन्दी पर्याय है; ‘चरबी के भाग’ मूल से अधिक व्याख्यात्मक होता।
- source_word: יָסִיר
  choice: निकाल दे
  rationale: हिफ़ील रूप किसी वस्तु को अलग करने या हटाने की क्रिया बताता है। ‘निकाल दे’ विधिक निर्देश को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר הוּסַר
  choice: जैसे ... निकाली जाती है
  rationale: यह पहले से निर्धारित बलि-विधि से तुलना करता है। वर्तमान कर्मवाच्य हिन्दी में सामान्य अनुष्ठानिक प्रक्रिया को स्पष्ट रखता है।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: शांति-बलि
  rationale: यह इब्रानी बलि-श्रेणी का संक्षिप्त और पारदर्शी नाम है। इसके मेल-मिलाप या सहभागिता संबंधी भाव को वैकल्पिक टिप्पणी में रखा गया है।
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: बलिदानी संदर्भ में क्रिया वेदी पर जलाने को दर्शाती है। ‘जलाए’ सहज है और वेदी का उल्लेख इसके बलिदानी अर्थ को स्पष्ट करता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप यहाँ वेदी पर चढ़ाकर जलाने को दर्शाता है; यह मानक और स्वाभाविक हिन्दी प्रयोग है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: मनभावनी सुगंध के रूप में
  rationale: यह स्थिर बलिदानी अभिव्यक्ति परमेश्वर को स्वीकार्य भेंट का सुगंध-रूपक बनाए रखती है, बिना उसे केवल ‘स्वीकार्य’ कहकर रूपक मिटाए।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: मूल पाठ में परमेश्वर का विशिष्ट नाम יהוה है। ‘यहोवा’ हिन्दी में उसका परिचित प्रत्यक्ष रूप है और לְ के अर्पण-संबंधी भाव के लिए ‘के लिए’ स्वाभाविक है।
- source_word: וְכִפֶּר עָלָיו
  choice: याजक उसके लिए प्रायश्चित करे
  rationale: याजकीय बलि-संदर्भ में כפר के स्थापित धार्मिक अर्थ को ‘प्रायश्चित करना’ सुरक्षित रखता है। ‘उसके लिए’ עָלָיו का लाभार्थी अथवा प्रतिनिधिक संबंध स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְנִסְלַח לוֹ
  choice: उसे क्षमा कर दिया जाएगा
  rationale: निफ़अल रूप क्षमा प्राप्त होने के निष्क्रिय परिणाम को व्यक्त करता है। यह अनुवाद कर्ता को वहाँ स्पष्ट नहीं करता जहाँ इब्रानी भी उसे प्रत्यक्ष रूप से नहीं बताता।
theological_decisions:
- issue: याजकीय प्रायश्चित और क्षमा के सूत्र वְכִפֶּר עָלָיו ... וְנִסְלַח לוֹ का संबंध
  choice: याजक उसके लिए प्रायश्चित करे, और उसे क्षमा कर दिया जाएगा
  alternative: याजक उसकी ओर से प्रायश्चित करे, और उसका अपराध क्षमा किया जाएगा
  rationale: मूल पाठ याजक द्वारा किए गए प्रायश्चित के बाद क्षमा का परिणाम बताता है, पर उसकी आगे की धर्मवैज्ञानिक यांत्रिकी नहीं समझाता। चुना हुआ रूप इसी संबंध और निष्क्रिय क्षमा को बनाए रखता है।
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं बल्कि विशिष्ट वाचा-नाम है। उसका लिप्यंतर पाठ-साक्ष्य को प्रत्यक्ष रखता है, जबकि ‘प्रभु’ नाम और उपाधि का भेद मिटा सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज किंतु गरिमापूर्ण विधिक-धार्मिक शैली रखी गई है। निर्देशों के लिए ‘निकाल दे/जलाए/करे’ और निश्चित परिणाम के लिए ‘क्षमा कर दिया जाएगा’ प्रयुक्त हुआ है। तकनीकी शब्द ‘प्रायश्चित’, ‘वेदी’ और ‘बलि’ आवश्यक धार्मिक सटीकता के कारण बनाए रखे गए हैं।
