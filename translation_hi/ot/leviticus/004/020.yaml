  text: וְ/עָשָׂ֣ה לַ/פָּ֔ר כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/פַ֣ר הַֽ/חַטָּ֔את כֵּ֖ן יַעֲשֶׂה לּ֑/וֹ וְ/כִפֶּ֧ר עֲלֵ/הֶ֛ם הַ/כֹּהֵ֖ן וְ/נִסְלַ֥ח לָ/הֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/020.yaml
  text: He shall do with the bull just as he did with the bull of the sin offering; so he shall do with it. And the priest shall make atonement for them[a], and they shall be forgiven.
translation:
  language: hi
  text: वह उस बैल के साथ वैसा ही करे जैसा उसने पापबलि[a] के बैल के साथ किया था; वह उसके साथ ठीक वैसा ही करे। और याजक उनके लिए प्रायश्चित करे, और उन्हें क्षमा कर दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” इब्रानी शब्द उस बलि को सूचित कर सकता है जो पाप का निवारण करके शुद्धि लाती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה לַפָּר
  choice: वह उस बैल के साथ ... करे
  rationale: עשה के साथ ל यहाँ पशु पर किए जाने वाले विधिगत व्यवहार को व्यक्त करता है; ‘बैल के साथ ... करे’ स्वाभाविक हिन्दी में निर्देशात्मक अर्थ बनाए रखता है।
- source_word: כַּאֲשֶׁר עָשָׂה
  choice: वैसा ही ... जैसा उसने ... किया था
  rationale: तुलनात्मक संरचना को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखा गया है।
- source_word: לְפַר הַחַטָּאת
  choice: पापबलि के बैल के साथ
  rationale: חטאת के पारंपरिक और सामान्यतः समझे जाने वाले बलिदानी अर्थ ‘पापबलि’ को मुख्य पाठ में रखा गया है।
- source_word: כֵּן יַעֲשֶׂה לּוֹ
  choice: वह उसके साथ ठीक वैसा ही करे
  rationale: כֵּן पूर्ववर्णित विधि से पूर्ण समानता बताता है; ‘ठीक वैसा ही’ उस बल को व्यक्त करता है।
- source_word: וְכִפֶּר עֲלֵהֶם הַכֹּהֵן
  choice: इस प्रकार याजक उनके लिए प्रायश्चित करे
  rationale: כפר על का विधिगत अर्थ ‘किसी के लिए प्रायश्चित करना’ है; ‘याजक’ כהן का प्रतिष्ठित और स्पष्ट हिन्दी रूप है।
- source_word: וְנִסְלַח לָהֶם
  choice: और उन्हें क्षमा कर दिया जाएगा
  rationale: निफ़अल रूप क्षमा प्राप्त होने का निष्क्रिय परिणाम व्यक्त करता है; हिन्दी का यह रूप कर्ता को अनिर्दिष्ट रखते हुए मूल अर्थ सुरक्षित रखता है।
theological_decisions:
- issue: बलिदानी विधान में חטאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप से निपटने वाली और शुद्धि लाने वाली बलि दोनों पहलुओं को सूचित कर सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है, जबकि वास्तविक शाब्दिक विकल्प को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-धार्मिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट भाषा। दोहराव मूल इब्रानी की बलाघातपूर्ण प्रक्रिया-समानता को बनाए रखने के लिए सुरक्षित रखा गया है।
