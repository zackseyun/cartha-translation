  edition: WLC
  text: וְ/אִ֨ם כָּל עֲדַ֤ת יִשְׂרָאֵל֙ יִשְׁגּ֔וּ וְ/נֶעְלַ֣ם דָּבָ֔ר מֵ/עֵינֵ֖י הַ/קָּהָ֑ל וְ֠/עָשׂוּ אַחַ֨ת מִ/כָּל מִצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁמוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/013.yaml
  text: And if the whole congregation of Israel sins unintentionally[a], and the matter is hidden from the eyes of the assembly, and they do one of all the things that Yahweh has commanded not to be done, and they become guilty[d][c][b],
translation:
  language: hi
  text: यदि इस्राएल की पूरी मंडली[a] अनजाने में पाप करे[b], और वह बात सभा की आँखों से छिपी रहे[c], और वे याहवे की आज्ञाओं के विरुद्ध निषिद्ध कामों में से कोई एक काम कर बैठें[d], और इस प्रकार दोषी हो जाएँ,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “इस्राएल का पूरा समुदाय।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया जानबूझकर किए गए विद्रोह के बजाय भूल या अनजाने में किए गए पाप को दर्शाती है।
    reason: cultural_note
  - marker: c
    text: “सभा की आँखों से छिपी” एक इब्रानी मुहावरा है; अर्थ है कि सभा को उस बात का पता नहीं चला।
    reason: lexical_alternative
  - marker: d
    text: या, “वे याहवे की निषेधात्मक आज्ञाओं में से किसी एक का उल्लंघन करें।”
    reason: literal_rendering
lexical_decisions:
- source_word: עֲדַת יִשְׂרָאֵל
  choice: इस्राएल की पूरी मंडली
  rationale: עֵדָה पूरे इस्राएली समुदाय को दर्शाता है। ‘मंडली’ उपासना और व्यवस्था-संबंधी प्रसंग के अनुकूल है, जबकि आगे הַקָּהָל के लिए ‘सभा’ रखकर दोनों शब्दों का भेद बनाए रखा गया है।
- source_word: יִשְׁגּוּ
  choice: अनजाने में पाप करे
  rationale: लैव्यव्यवस्था 4 के बलिदान-संबंधी प्रसंग में שׁגה जानबूझकर किए विद्रोह के बजाय भूल या अनजाने में किए पाप को दर्शाता है।
- source_word: וְנֶעְלַם דָּבָר מֵעֵינֵי הַקָּהָל
  choice: वह बात सभा की आँखों से छिपी रहे
  rationale: अनुवाद इब्रानी के निष्क्रिय रूप और ‘आँखों से छिपी’ वाली बोध-संबंधी छवि को सुरक्षित रखता है; अर्थ है कि सभा उस अपराध से अनजान रही।
- source_word: וְעָשׂוּ אַחַת מִכָּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: वे याहवे की उन सब आज्ञाओं में से किसी एक के विरुद्ध ऐसा काम कर बैठें जिसे नहीं करना चाहिए
  rationale: इब्रानी रचना का आशय याहवे की आज्ञाओं में निषिद्ध किसी एक काम को कर बैठना है। ‘के विरुद्ध’ हिंदी में संबंध स्पष्ट करता है, क्योंकि आज्ञा स्वयं ‘की’ नहीं जाती, बल्कि उसका उल्लंघन होता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत वाचा-नाम को किसी उपाधि से बदलने के बजाय आधुनिक हिंदी में उसके प्रचलित ध्वन्यात्मक लिप्यंतरण से व्यक्त किया गया है।
- source_word: וְאָשֵׁמוּ
  choice: दोषी हो जाएँ
  rationale: क्रिया अपराध के परिणामस्वरूप दोष की अवस्था या उत्तरदायित्व में आने को व्यक्त करती है; यह अनुवाद प्रायश्चित संबंधी अतिरिक्त धारणा नहीं जोड़ता।
theological_decisions:
- issue: שׁגה द्वारा बताए गए पाप का स्वरूप
  choice: अनजाने में पाप
  alternative: भूल करना; भटक जाना
  rationale: इस अध्याय का विधान अनजाने में हुए अपराधों से संबंधित है। फिर भी ‘पाप’ शब्द नैतिक और धार्मिक दोष को बनाए रखता है; इसे केवल साधारण भूल नहीं बनाता।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम है। उसका लिप्यंतरण नाम और उपाधि के बीच का भेद सुरक्षित रखता है।
- issue: समुदाय का सामूहिक दोष
  choice: और इस प्रकार दोषी हो जाएँ
  alternative: और उन पर दोष आए
  rationale: बहुवचन क्रिया पूरी मंडली के सामूहिक उत्तरदायित्व को व्यक्त करती है, पर यह नहीं बताती कि हर सदस्य ने जानबूझकर वही काम किया था।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट रखी गई है। ‘मंडली’ और ‘सभा’ से עֵדָה तथा קָהָל का सीमित शब्दगत भेद सुरक्षित है। वाक्य आगे आने वाले विधान से जुड़ा होने के कारण अंत में अल्पविराम रखा गया है।
