  text: אֲשֶׁ֥ר נָשִׂ֖יא יֶֽחֱטָ֑א וְ/עָשָׂ֡ה אַחַ֣ת מִ/כָּל מִצְוֺת֩ יְהוָ֨ה אֱלֹהָ֜י/ו אֲשֶׁ֧ר לֹא תֵעָשֶׂ֛ינָה בִּ/שְׁגָגָ֖ה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/022.yaml
  text: When a leader sins and unintentionally does one of any of the things that Yahweh his God has commanded not to be done[a], and becomes guilty[b],
translation:
  language: hi
  text: “जब कोई प्रधान[a] पाप करे और अनजाने में[b] अपने परमेश्वर यहोवा की किसी ऐसी आज्ञा के विरुद्ध कोई काम करे जो नहीं किया जाना चाहिए, और दोषी हो जाए,”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अगुवा,” “मुखिया” अथवा “शासक”; इब्रानी נָשִׂיא किसी मान्य नेता या प्रमुख को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: या “भूल से”; इब्रानी शब्द का आशय अनिच्छित रूप से हुए अपराध से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נָשִׂיא
  choice: प्रधान
  rationale: यह शब्द किसी मान्य अगुवे, मुखिया या शासक को दर्शाता है। ‘प्रधान’ लैव्यव्यवस्था के सामाजिक संदर्भ में स्वाभाविक है और आधुनिक अर्थ में केवल राजकुमार का संकेत नहीं देता।
- source_word: יֶחֱטָא
  choice: पाप करे
  rationale: חטא पाप करने के लिए प्रयुक्त सामान्य और सीधा क्रियापद है।
- source_word: וְעָשָׂה אַחַת מִכָּל מִצְוֺת
  choice: किसी ऐसी आज्ञा के विरुद्ध कुछ कर बैठे
  rationale: इब्रानी पदबंध का आशय यह है कि व्यक्ति यहोवा की आज्ञाओं में निषिद्ध किसी एक काम को कर देता है। यह हिन्दी अभिव्यक्ति उस अंशात्मक अर्थ को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: יְהוָה אֱלֹהָיו
  choice: अपने परमेश्वर यहोवा
  rationale: ईश्वर का व्यक्तिगत नाम ‘यहोवा’ रखा गया है और प्रत्यय का संबंधसूचक अर्थ ‘अपने परमेश्वर’ में सुरक्षित है।
- source_word: אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: जिसे नहीं करना चाहिए
  rationale: निफ़अल रूप निषेधात्मक कर्मवाच्य भाव देता है—ऐसा कार्य जो किया नहीं जाना चाहिए।
- source_word: בִּשְׁגָגָה
  choice: अनजाने में
  rationale: बलिदान-संबंधी व्यवस्था में यह शब्द जानबूझकर किए गए अपराध के विपरीत अनिच्छित या असावधान अपराध को दर्शाता है।
- source_word: וְאָשֵׁם
  choice: और दोषी हो जाए
  rationale: यह क्रिया अपराध के फलस्वरूप उत्पन्न दोष की अवस्था बताती है; ‘दोषी हो जाए’ उस परिणामी भाव को सुरक्षित रखता है।
theological_decisions:
- issue: ईश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में उपाधि नहीं बल्कि चतुरक्षरी व्यक्तिगत नाम יְהוָה है; इसलिए उसे हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
- issue: अनजाने अपराध के बाद दोष की वास्तविकता
  choice: अनजाने में ... और दोषी हो जाए
  alternative: भूल होने के कारण दोषरहित समझा जाए
  rationale: पद अनजानेपन को स्वीकार करते हुए भी וְאָשֵׁם द्वारा दोष की अवस्था बताता है; इस धार्मिक तनाव को बिना हल्का किए बनाए रखा गया है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। वाक्य को अगले पद से जुड़ने वाले व्यवस्था-वाक्य के रूप में अंत में अल्पविराम सहित प्रस्तुत किया गया है; ‘कर बैठे’ अनजाने कृत्य को स्वाभाविक हिन्दी में व्यक्त करता है।
