base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/024.yaml
  text: And he shall lay his hand on the head of the goat and slaughter it in the place where they slaughter the burnt offering before Yahweh[a]. It is a sin offering.
translation:
  language: hi
  text: और वह अपना हाथ उस बकरे के सिर पर रखे, और उसे उस स्थान पर वध करे जहाँ याहवे के सामने होमबलि का वध किया जाता है। यह पापबलि[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת पाप तथा पाप या अशुद्धता को दूर करने से संबंधित बलि—दोनों को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ יָדוֹ
  choice: वह अपना हाथ ... रखे
  rationale: बलिदान-विधि में यह पदबंध पशु के सिर पर हाथ रखने की नियत क्रिया बताता है। एकवचन ‘हाथ’ और विधिसूचक भाव सुरक्षित रखे गए हैं।
- source_word: עַל רֹאשׁ הַשָּׂעִיר
  choice: उस बकरे के सिर पर
  rationale: שָׂעִיר यहाँ बलिदान के लिए नर बकरे को दर्शाता है; ‘बकरा’ आधुनिक हिन्दी में स्वाभाविक और सटीक है।
- source_word: וְשָׁחַט אֹתוֹ
  choice: उसे ... वध करे
  rationale: שׁחט अनुष्ठानिक रीति से पशु का गला काटकर मारने का मानक क्रियापद है; ‘वध करना’ बलिदान-संदर्भ को बनाए रखता है।
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: उस स्थान पर ... जहाँ ... वध किया जाता है
  rationale: यह निर्दिष्ट बलिदान-स्थान बताता है। हिब्रू का सक्रिय अनिर्दिष्ट कर्ता हिन्दी में सामान्य कर्मवाच्य द्वारा स्वाभाविक रूप से व्यक्त होता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलि का पारंपरिक नाम है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और स्थापित है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי स्थानिक और उपासना-संबंधी अर्थ में ‘के सामने’ है; יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: חַטָּאת הוּא
  choice: यह पापबलि है
  rationale: विधिक संदर्भ में חַטָּאת बलिदान की एक श्रेणी को नाम देता है। ‘पापबलि’ स्थापित मुख्य-पाठ विकल्प है, जबकि शुद्धिकरण का संभावित बल फुटनोट में सुरक्षित है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया; ‘प्रभु’ करने से व्यक्तिगत नाम छिप जाता।
- issue: חַטָּאת का अनुष्ठानिक अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यहाँ शब्द पशु/अनुष्ठान को बलि की विशिष्ट श्रेणी के रूप में पहचानता है। ‘पापबलि’ मुख्य पाठ में स्पष्ट और प्रचलित है, पर शब्द में पाप अथवा अशुद्धता दूर करने का शुद्धिकरण-संबंधी पक्ष भी हो सकता है; इसलिए विकल्प फुटनोट में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘रखे’ और ‘वध करे’ आज्ञात्मक-विधिसूचक हिब्रू क्रम को व्यक्त करते हैं। तकनीकी बलिदान-शब्दावली के लिए ‘होमबलि’ और ‘पापबलि’ का प्रयोग किया गया है।
