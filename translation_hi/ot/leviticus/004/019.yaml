  yaml_path: translation/ot/leviticus/004/019.yaml
  text: And he shall remove all its fat from it and burn it on the altar[a].
translation:
  language: hi
  text: और वह उसकी सारी चर्बी उसमें से निकालकर वेदी पर जलाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी क्रिया विशेष रूप से बलि के अंश को वेदी पर जलाकर उसका धुआँ ऊपर उठाने के लिए प्रयुक्त होती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: और
  rationale: संयोजक इस क्रिया को पिछले पदों में दिए गए बलिदान-विधान की अगली क्रिया से जोड़ता है; प्रत्यक्ष कर्म-चिह्न का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
- source_word: כָּל
  choice: सारी
  rationale: यह शब्द पूर्णता दर्शाता है—निर्धारित चर्बी का केवल कुछ भाग नहीं, बल्कि सारी चर्बी निकाली जानी है।
- source_word: חֶלְבּוֹ
  choice: उसकी चर्बी
  rationale: पुल्लिंग एकवचन प्रत्यय बलि के पशु की ओर संकेत करता है। लैव्यव्यवस्था के बलिदान-संबंधी प्रसंग में חֵלֶב वे चर्बीदार भाग हैं जिन्हें वेदी पर जलाया जाता है।
- source_word: יָרִים
  choice: निकालकर
  rationale: רוּם के हिफ़ईल रूप का मूल भाव उठाने या अलग करने का है; यहाँ प्रसंगानुसार पशु में से चर्बी निकालना अभिप्रेत है। संयुक्त क्रिया-विन्यास हिन्दी में अनुष्ठान की क्रमिक क्रियाओं को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: पूर्वसर्ग बलि के पशु से चर्बी अलग किए जाने को दर्शाता है; हिन्दी में निर्जीव पशु-संदर्भ के लिए 'उसमें से' स्वाभाविक है।
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: याजकीय बलिदान-भाषा में הקטיר किसी अर्पित भाग को वेदी पर जलाकर धुआँ उठाने की विशिष्ट क्रिया है। मुख्य पाठ में 'जलाए' सहज और स्पष्ट है, जबकि विशिष्ट बलिदान-संबंधी अर्थ पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय वेदी की ओर गति का संकेत दे सकता है, पर הקטיר के साथ हिन्दी में क्रिया का स्थान बताने वाला 'वेदी पर' सबसे स्वाभाविक है।
