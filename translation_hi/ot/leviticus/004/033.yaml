  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַ֤ט אֹתָ/הּ֙ לְ/חַטָּ֔את בִּ/מְק֕וֹם אֲשֶׁ֥ר יִשְׁחַ֖ט אֶת הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/033.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter it for a sin offering in the place where the burnt offering is slaughtered[a].
translation:
  language: hi
  text: और वह अपना हाथ पापबलि के सिर पर रखे और उसका पापबलि के रूप में उस स्थान पर वध करे जहाँ होमबलि का वध किया जाता है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: दोनों स्थानों पर “पापबलि” का अनुवाद “शुद्धिकरण-बलि” भी हो सकता है; इब्रानी शब्द उस बलि को सूचित कर सकता है जो पाप और अनुष्ठानिक अशुद्धता से निपटती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ אֶת יָדוֹ
  choice: और वह अपना हाथ ... रखे
  rationale: क्रिया סמך बलिदान-विधि में पशु पर हाथ रखने या टिकाने की क्रिया बताती है; एकवचन יָדוֹ के अनुसार ‘अपना हाथ’ रखा गया है।
- source_word: עַל רֹאשׁ הַחַטָּאת
  choice: पापबलि के सिर पर
  rationale: रचना का सीधा और स्वाभाविक हिन्दी रूप; חטאת को परिचित बलिदानी पद ‘पापबलि’ से व्यक्त किया गया है।
- source_word: וְשָׁחַט אֹתָהּ
  choice: और उसे ... बलि करे
  rationale: שׁחט बलिदानी पशु को विधिपूर्वक वध करने की तकनीकी क्रिया है। हिन्दी में ‘बलि करे’ संदर्भानुकूल और गरिमापूर्ण है तथा सामान्य ‘मार डाले’ से अधिक सटीक है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: लामेद यहाँ प्रयोजन या नियुक्त भूमिका बताता है; ‘के रूप में’ पशु को पापबलि के तौर पर चढ़ाए जाने का अर्थ स्पष्ट करता है।
- source_word: בִּמְקוֹם אֲשֶׁר יִשְׁחַט
  choice: उसी स्थान पर ... जहाँ ... बलि किया जाता है
  rationale: विधिक निर्देश में इब्रानी का अनिर्दिष्ट कर्ता हिन्दी के स्वाभाविक कर्मवाच्य से व्यक्त किया गया है। ‘उसी’ निर्दिष्ट साझा वध-स्थान को स्पष्ट करता है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए ‘होमबलि’ हिन्दी बाइबलीय और बलिदानी संदर्भ में स्थापित, संक्षिप्त पद है।
theological_decisions:
- issue: बलिदानी विधान में חטאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: חטאת पाप से संबंधित बलि को और अनुष्ठानिक अशुद्धता दूर करने वाले शुद्धिकरण-पक्ष को भी सूचित कर सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और महत्वपूर्ण वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक-धार्मिक गरिमा बनाए रखी गई है। ‘अपना हाथ’ से इब्रानी एकवचन सुरक्षित है; ‘होमबलि’ और ‘पापबलि’ सामान्य पाठकों के लिए परिचित बलिदानी पद हैं।
