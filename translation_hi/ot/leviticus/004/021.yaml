base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/021.yaml
  text: He shall bring the bull outside the camp and burn it[a], just as he burned the first bull. It is the sin offering for the assembly.
translation:
  language: hi
  text: वह बछड़े को छावनी के बाहर ले जाकर जला दे, ठीक वैसे ही जैसे उसने पहले बछड़े को जलाया था। यह सभा की पापबलि[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द पाप का निवारण करने के साथ-साथ अशुद्धता दूर करने में इस बलि की भूमिका पर भी बल दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהוֹצִיא
  choice: बाहर ले जाकर
  rationale: יצא के हिफ़ईल रूप का अर्थ किसी वस्तु को बाहर ले जाना है; संयुक्त क्रिया अगली क्रिया के साथ स्वाभाविक हिन्दी वाक्य बनाती है।
- source_word: הַפָּר
  choice: बछड़ा
  rationale: פַּר बलि के लिए प्रयुक्त युवा नर गोवंश को दर्शाता है; लैव्यव्यवस्था की हिन्दी शब्दावली में ‘बछड़ा’ सहज और पहचाना हुआ है।
- source_word: אֶל מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह पदबंध छावनी की सीमा से बाहर किसी स्थान की ओर गति व्यक्त करता है।
- source_word: וְשָׂרַף אֹתוֹ
  choice: जला दे
  rationale: שׂרף का सीधा अर्थ जलाना है; विधिक निर्देश के लिए ‘जला दे’ स्वाभाविक है।
- source_word: כַּאֲשֶׁר שָׂרַף
  choice: ठीक वैसे ही जैसे उसने ... जलाया था
  rationale: כַּאֲשֶׁר पूर्ववर्णित विधि से स्पष्ट समानता स्थापित करता है।
- source_word: הַפָּר הָרִאשׁוֹן
  choice: पहले बछड़े
  rationale: רִאשׁוֹן संदर्भ में पहले वर्णित बछड़े की ओर संकेत करता है।
- source_word: חַטַּאת
  choice: पापबलि
  rationale: बलिदान-संबंधी संदर्भ में חַטָּאת पाप से संबंधित बलि को दर्शाता है; ‘पापबलि’ संक्षिप्त, प्रचलित और बोधगम्य है।
- source_word: הַקָּהָל
  choice: सभा
  rationale: קָהָל यहाँ संपूर्ण एकत्रित समुदाय को दर्शाता है; ‘सभा’ सामूहिक अर्थ को बनाए रखता है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम विधेयात्मक रूप से उस पशु की पहचान सभा की पापबलि के रूप में करता है।
theological_decisions:
- issue: बलिदान-विधान में חַטַּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप के लिए चढ़ाई जाने वाली बलि और अशुद्धता हटाने वाली उसकी भूमिका—दोनों से जुड़ सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और वैकल्पिक बलाघात पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-वर्णनात्मक रूप अपनाया गया है। ‘ठीक वैसे ही’ तुलना को स्पष्ट करता है, जबकि חַטַּאת की अर्थगत व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
