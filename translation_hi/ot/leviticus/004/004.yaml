id: LEV.4.4
reference: Leviticus 4:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵבִ֣יא אֶת הַ/פָּ֗ר אֶל פֶּ֛תַח אֹ֥הֶל מוֹעֵ֖ד לִ/פְנֵ֣י יְהוָ֑ה וְ/סָמַ֤ךְ אֶת יָד/וֹ֙ עַל רֹ֣אשׁ הַ/פָּ֔ר וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/004.yaml
  text: He shall bring the bull to the entrance of the tent of meeting before Yahweh[b][a], and he shall lay his hand on the head of the bull and slaughter the bull before Yahweh.
translation:
  language: hi
  text: वह उस बैल को मिलापवाले तंबू के प्रवेश-द्वार[b] पर, याहवे के सामने[a] लाए। फिर वह अपना हाथ बैल के सिर पर रखे और याहवे के सामने उस बैल का वध करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: “याहवे के सामने” यहाँ एक अनुष्ठानिक अभिव्यक्ति है, जिसका अर्थ है “याहवे की उपस्थिति में।”
    reason: lexical_alternative
  - marker: b
    text: या “मिलापवाले तंबू के द्वार पर।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהֵבִיא
  choice: वह ... लाए
  rationale: हिफ़ील रूप अनुष्ठान संबंधी निर्देश देता है। हिंदी का संभावनार्थक/आज्ञार्थक रूप “लाए” विधि-विधान के प्रसंग में स्वाभाविक है।
- source_word: הַפָּר
  choice: उस बैल
  rationale: פַּר का अर्थ बैल है। इस पद में उसकी आयु स्पष्ट नहीं की गई, इसलिए “बछड़ा” या “जवान बैल” नहीं जोड़ा गया।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח किसी खुले स्थान, प्रवेश या द्वार को दर्शाता है; “प्रवेश-द्वार” हिंदी में स्थान को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है। אֹהֶל מוֹעֵד के लिए परिचित पवित्रस्थान-संज्ञा “मिलापवाला तंबू” रखी गई है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का मूल भाव “सामने/उपस्थिति में” है। संक्षिप्त अनुष्ठानिक अभिव्यक्ति “के सामने” मूल की संरचना और अर्थ दोनों बनाए रखती है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में “याहवे” लिखा गया है।
- source_word: וְסָמַךְ אֶת יָדוֹ עַל רֹאשׁ הַפָּר
  choice: वह अपना हाथ बैल के सिर पर रखे
  rationale: स्मख का यहाँ अर्थ बलिपशु पर हाथ रखने की अनुष्ठानिक क्रिया है। पद स्वयं इस क्रिया का धर्मवैज्ञानिक अर्थ नहीं समझाता, इसलिए केवल प्रत्यक्ष क्रिया का अनुवाद किया गया है।
- source_word: וְשָׁחַט
  choice: वध करे
  rationale: שׁחט बलि के पशु को विधिपूर्वक मारने का तकनीकी क्रियापद है। “वध करे” साधारण “मार डाले” की अपेक्षा इस अनुष्ठानिक आशय को बेहतर बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ में चतुरक्षरी व्यक्तिगत नाम है। “याहवे” उसे उपाधि में बदले बिना प्रस्तुत करता है।
- issue: बैल के सिर पर हाथ रखने का अर्थ
  choice: केवल शारीरिक अनुष्ठानिक क्रिया का वर्णन
  alternative: इसे दोष के स्थानांतरण या बलिदानी के साथ तादात्म्य के रूप में स्पष्ट करना
  rationale: इस पद में क्रिया का अर्थ नहीं समझाया गया है। किसी एक धर्मवैज्ञानिक व्याख्या को पाठ में जोड़ने के बजाय मूल की व्याख्यात्मक खुलावट सुरक्षित रखी गई है।
- issue: לִפְנֵי יְהוָה का अनुष्ठानिक आशय
  choice: याहवे के सामने
  alternative: याहवे की उपस्थिति में
  rationale: “सामने” हिब्रू रूपक को बनाए रखता है, जबकि पादटिप्पणी स्पष्ट करती है कि यहाँ केवल भौतिक दिशा नहीं, याहवे की उपस्थिति में किया गया अनुष्ठान अभिप्रेत है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधि-विधान के अनुरूप रखी गई है। “मिलापवाला तंबू,” “वध करे,” और “के सामने” जैसे पद परिचित धार्मिक हिंदी तथा मूल हिब्रू की औपचारिकता के बीच संतुलन रखते हैं।
