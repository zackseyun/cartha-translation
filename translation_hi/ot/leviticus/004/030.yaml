id: LEV.4.30
reference: Leviticus 4:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֤ן מִ/דָּמָ/הּ֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/030.yaml
  text: And the priest shall take some of its blood with his finger and put it on the horns of the altar of burnt offering[c][b][a], and he shall pour out all its blood at the base of the altar.
translation:
  language: hi
  text: फिर याजक अपनी उँगली से उसके लहू में से कुछ लेकर होमबलि की वेदी के सींगों पर लगाएगा[a], और उसका सारा लहू वेदी के आधार पर उँडेल देगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: वेदी के “सींग” उसके कोनों पर बने सींग जैसे उभरे हुए भाग थे।
    reason: cultural_note
  - marker: b
    text: यहाँ “सारा लहू” से प्रसंग के अनुसार वह लहू अभिप्रेत है जो कुछ लहू सींगों पर लगाए जाने के बाद बचता था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर ... लेकर
  rationale: बलिदान-विधि के इस प्रसंग में क्रिया निर्देशात्मक क्रम बताती है; ‘फिर’ स्वाभाविक हिन्दी में उस क्रम को स्पष्ट करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित पदाधिकारी के लिए प्रचलित और गरिमापूर्ण बाइबलीय हिन्दी शब्द।
- source_word: מִדָּמָהּ
  choice: उसके लहू में से कुछ
  rationale: 'מִן का यहाँ अंशवाचक अर्थ है: याजक लहू का एक भाग वेदी पर लगाने के लिए लेता है।'
- source_word: בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से
  rationale: בְּ साधन का बोध कराता है; हिन्दी में ‘से’ स्वाभाविक है।
- source_word: וְנָתַן
  choice: लगाएगा
  rationale: נתן का मूल अर्थ ‘रखना/देना’ है, पर लहू और वेदी के सींगों के संदर्भ में ‘लगाना’ क्रिया को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी के सींगों पर
  rationale: ‘सींग’ विशिष्ट उपासना-संबंधी रूपक को अक्षुण्ण रखता है; संबंध-श्रृंखला को स्वाभाविक हिन्दी क्रम में रखा गया है।
- source_word: וְאֶת כָּל דָּמָהּ
  choice: और उसका सारा लहू
  rationale: כָּל के व्यापक अर्थ को मुख्य पाठ में सुरक्षित रखा गया है, यद्यपि प्रसंग से पहले प्रयुक्त भाग के बाद बचा हुआ लहू अभिप्रेत है।
- source_word: יִשְׁפֹּךְ
  choice: उँडेल देगा
  rationale: बलिदान-विधि में שׁפך के लिए ‘उँडेलना’ नियंत्रित रूप से लहू डालने की क्रिया को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: वेदी के आधार पर
  rationale: יְסוֹד का अर्थ नींव/आधार है; वेदी के संदर्भ में ‘आधार’ स्पष्ट और संक्षिप्त है।
theological_decisions:
- issue: बलिदान-विधि की क्रियाओं का काल और भाव
  choice: 'निर्देशात्मक भविष्य रूप: ‘लगाएगा ... उँडेल देगा’'
  alternative: 'साधारण भूतकाल: ‘लगाया ... उँडेला’'
  rationale: पद कानूनी-अनुष्ठानिक निर्देश का भाग है, किसी एक ऐतिहासिक घटना का वर्णन नहीं; इसलिए हिन्दी का निर्देशात्मक भविष्य रूप उपयुक्त है।
- issue: वेदी के कर्णोत्थानों की उपासना-संबंधी शब्दावली
  choice: ‘सींगों’ का शाब्दिक रूप सुरक्षित रखा
  alternative: ‘कोनों’ या ‘उभरे हुए भागों’ जैसा कार्यात्मक अनुवाद
  rationale: मूल का विशिष्ट दृश्य और उपासना-संबंधी शब्द बनाए रखने से अर्थ को अनावश्यक रूप से सपाट नहीं किया जाता।
- issue: ‘सारा लहू’ और पहले लिए गए अंश का संबंध
  choice: मुख्य पाठ में मूल के ‘सारा लहू’ को रखा और प्रसंगगत अर्थ पादटिप्पणी में समझाया
  alternative: मुख्य पाठ में ‘बाकी सारा लहू’
  rationale: मूल में כָּל דָּמָהּ है, ‘बाकी’ स्पष्ट रूप से नहीं लिखा; अतः मूल की अभिव्यक्ति और उसके प्रसंगगत तनाव दोनों सुरक्षित रखे गए हैं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सहज, गरिमापूर्ण विधिक-अनुष्ठानिक शैली अपनाई गई है। ‘याजक’, ‘होमबलि’, ‘वेदी’ और ‘सींग’ जैसे स्थापित उपासना-संबंधी शब्द बनाए रखे गए हैं; अत्यधिक संस्कृतनिष्ठ वाक्य-विन्यास से बचा गया है।
