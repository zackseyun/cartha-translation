source:
  edition: WLC
  text: וְ/אִם נֶ֧פֶשׁ אַחַ֛ת תֶּחֱטָ֥א בִ/שְׁגָגָ֖ה מֵ/עַ֣ם הָ/אָ֑רֶץ בַּ֠/עֲשֹׂתָ/הּ אַחַ֨ת מִ/מִּצְוֺ֧ת יְהוָ֛ה אֲשֶׁ֥ר לֹא תֵעָשֶׂ֖ינָה וְ/אָשֵֽׁם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/027.yaml
  text: And if one person from the common people sins unintentionally by doing one of Yahweh’s commandments that must not be done, and becomes guilty,
translation:
  language: hi
  text: और यदि जनसाधारण में से कोई व्यक्ति अनजाने में पाप करे—याहवे की आज्ञाओं के विरुद्ध कोई एक ऐसा काम करके, जिसे नहीं किया जाना चाहिए—और दोषी ठहरे,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: נֶפֶשׁ אַחַת
  choice: कोई व्यक्ति
  rationale: कानूनी संदर्भ में נֶפֶשׁ व्यक्ति को सूचित करता है। हिंदी में ‘कोई व्यक्ति’ स्वाभाविक है और एक व्यक्तिगत सदस्य को बनाए रखता है।
- source_word: בִשְׁגָגָה
  choice: अनजाने में
  rationale: बलिदान-संबंधी व्यवस्था में यह जानबूझकर नहीं, बल्कि असावधानी या भूल से किए गए अपराध को दर्शाता है।
- source_word: מֵעַם הָאָרֶץ
  choice: देश के लोगों में से
  rationale: यह हिब्रू पदबंध का निकट अनुवाद है; आसपास के नियमों में यह याजक और प्रधान के विपरीत समुदाय के साधारण सदस्य को सूचित करता है। अर्थ-स्पष्टता हेतु पादटिप्पणी दी गई है।
- source_word: אַחַת מִמִּצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: याहवे की उन आज्ञाओं में से, जिन्हें नहीं करना चाहिए, किसी एक का उल्लंघन करके
  rationale: शाब्दिक संरचना ‘किसी एक को करके’ हिंदी में भ्रमित कर सकती है, क्योंकि आशय निषिद्ध कार्य करने का है। ‘उल्लंघन करके’ उसी कानूनी आशय को स्वाभाविक रूप से व्यक्त करता है और निषेधात्मक संबंधवाक्य को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: ईश्वर के व्यक्तिगत नाम का लिप्यंतरण किया गया है, उसे किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: וְאָשֵׁם
  choice: और दोषी ठहरे
  rationale: यह अपराध के फलस्वरूप दोष की अवस्था में आने या दोषी होने को व्यक्त कर सकता है। ‘दोषी ठहरे’ इस कानूनी परिणति को दर्शाता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
theological_decisions:
- issue: מֵעַם הָאָרֶץ की सामाजिक-कानूनी पहचान
  choice: देश के लोगों में से
  alternative: साधारण लोगों में से
  rationale: मुख्य पाठ में मूल पदबंध की ठोस छवि सुरक्षित रखी गई है; पादटिप्पणी स्पष्ट करती है कि इस प्रसंग में आशय समुदाय के साधारण सदस्य से है, न कि किसी बाद की सामाजिक या राजनीतिक श्रेणी से।
- issue: וְאָשֵׁם का अर्थ-बल
  choice: और दोषी ठहरे
  alternative: और उस पर दोष आए / और वह दोषी हो
  rationale: हिब्रू क्रिया दोषी होने, दोष की अवस्था में आने या दोष उठाने का संकेत दे सकती है। चुना हुआ रूप कार्रवाई से उत्पन्न कानूनी दोष को व्यक्त करता है, पर संभावित अर्थों को पादटिप्पणी में खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी-विधिक प्रसंग के अनुरूप रखी गई है। वाक्य अगले पद से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
