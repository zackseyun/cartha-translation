source:
  edition: WLC
  text: וְ/נֽוֹדְעָה֙ הַֽ/חַטָּ֔את אֲשֶׁ֥ר חָטְא֖וּ עָלֶ֑י/הָ וְ/הִקְרִ֨יבוּ הַ/קָּהָ֜ל פַּ֤ר בֶּן בָּקָר֙ לְ/חַטָּ֔את וְ/הֵבִ֣יאוּ אֹת֔/וֹ לִ/פְנֵ֖י אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/014.yaml
  text: and the sin that they committed becomes known[a], then the assembly shall present a bull, a son of the herd, as a sin offering and bring it before the tent of meeting.
translation:
  language: hi
  text: और जब उनके किए हुए पाप[a] का पता चल जाए, तब सभा पापबलि के रूप में गाय-बैलों के झुंड में से एक बैल अर्पित करे और उसे मिलाप के तंबू के सामने लाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में एक ही शब्द חַטָּאת (हत्तात) इस पद में दो बार आया है: पहली बार उसका अर्थ ‘पाप’ और दूसरी बार ‘पापबलि’ है।'
    reason: एक ही मूल शब्द के दो संदर्भगत अर्थों को दिखाना।
lexical_decisions:
- source_word: וְנֽוֹדְעָה
  choice: और जब ... का पता चल जाए
  rationale: निफ़अल रूप पाप के जानकारी में आने को व्यक्त करता है; ‘पता चल जाए’ स्वाभाविक हिन्दी है और यह नहीं बताता कि उसे किसने प्रकट किया।
- source_word: הַחַטָּאת
  choice: पाप
  rationale: इसके बाद ‘जो उन्होंने किया’ का भाव है, इसलिए यहाँ अपराध अथवा पाप अभिप्रेत है, बलि नहीं।
- source_word: אֲשֶׁר חָטְאוּ עָלֶיהָ
  choice: उनके किए हुए
  rationale: ‘पाप’ के साथ यह संक्षिप्त और स्वाभाविक हिन्दी है तथा उस विशिष्ट पाप को पहचानता है जो समुदाय ने किया था।
- source_word: הַקָּהָל
  choice: सभा
  rationale: यह सामूहिक और विधिक-उपासना संबंधी अर्थ को स्पष्ट रखता है तथा किसी आधुनिक धार्मिक संस्था का अनावश्यक संकेत नहीं देता।
- source_word: וְהִקְרִיבוּ
  choice: अर्पित करे
  rationale: बलिदान-संदर्भ में हिफ़ईल रूप किसी वस्तु को बलि के लिए प्रस्तुत या अर्पित करने का अर्थ देता है; आगे ‘लाए’ आने के कारण दोनों क्रियाएँ अलग बनी रहती हैं।
- source_word: פַּר בֶּן בָּקָר
  choice: झुंड का एक बैल
  rationale: यह पशु को गाय-बैलों के झुंड के नर के रूप में पहचानता है और शाब्दिक संरचना को अस्वाभाविक हिन्दी ‘पशुओं का पुत्र’ बनाए बिना व्यक्त करता है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: यहाँ वही संज्ञा बलिदान की निर्धारित श्रेणी को बताती है, इसलिए संयुक्त पद ‘पापबलि’ संदर्भ को स्पष्ट करता है।
- source_word: וְהֵבִיאוּ אֹתוֹ
  choice: और उसे ... लाए
  rationale: सर्वनाम बैल की ओर संकेत करता है और हिफ़ईल क्रिया का सीधा अर्थ ‘लाना’ है।
- source_word: לִפְנֵי אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के सामने
  rationale: यह उपासना-स्थान के प्रचलित हिन्दी नाम को रखते हुए स्थानवाचक ‘सामने’ का ठीक अर्थ देता है।
theological_decisions:
- issue: חַטָּאת के एक ही पद में दो संदर्भगत अर्थ
  choice: पहली बार ‘पाप’ और दूसरी बार ‘पापबलि’
  alternative: दोनों स्थानों पर एक ही हिन्दी शब्द रखना, अथवा दूसरी बार ‘शुद्धिकरण-बलि’ कहना
  rationale: पहला प्रयोग किए गए अपराध को और दूसरा उसके लिए निर्धारित बलिदान को दर्शाता है। संदर्भगत भेद अर्थ को स्पष्ट करता है, जबकि ‘शुद्धिकरण-बलि’ इस पद में निहित बलिदानी कार्य को अपेक्षा से अधिक निश्चित कर सकता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विधिक-बलिदानी संदर्भ के लिए ‘सभा’, ‘अर्पित करे’, ‘पापबलि’ और ‘मिलापवाला तंबू’ जैसे स्पष्ट पद चुने गए हैं।
