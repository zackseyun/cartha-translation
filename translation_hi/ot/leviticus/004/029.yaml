id: LEV.4.29
reference: Leviticus 4:29
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/סָמַךְ֙ אֶת יָד֔/וֹ עַ֖ל רֹ֣אשׁ הַֽ/חַטָּ֑את וְ/שָׁחַט֙ אֶת הַ֣/חַטָּ֔את בִּ/מְק֖וֹם הָ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/029.yaml
  text: And he shall lay his hand on the head of the sin offering and slaughter the sin offering in the place of the burnt offering[a].
translation:
  language: hi
  text: वह अपना हाथ पापबलि[a] के सिर पर रखे और पापबलि का वध होमबलि के वध के स्थान पर करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द חטאת पाप और शुद्धिकरण से संबद्ध बलि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: वह ... रखे
  rationale: बलिदान-संबंधी संदर्भ में סמך हाथ रखने या दबाने की क्रिया बताता है। विधिक निर्देश के रूप में हिंदी में संभावनार्थक ‘रखे’ स्वाभाविक है।
- source_word: יָדוֹ
  choice: अपना हाथ
  rationale: इब्रानी में संज्ञा एकवचन है और कर्ता का ही हाथ अभिप्रेत है; इसलिए ‘अपना हाथ’ संबंध को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: עַל רֹאשׁ
  choice: के सिर पर
  rationale: यह पूर्वसर्गीय पदबंध का सीधा और स्वाभाविक हिंदी रूप है तथा अनुष्ठानिक क्रिया की विशिष्टता बनाए रखता है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ חטאת पाप से संबद्ध विशेष बलिदान को सूचित करता है। ‘पापबलि’ संक्षिप्त, प्रचलित और सामान्य पाठक के लिए स्पष्ट है; शुद्धिकरण-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְשָׁחַט
  choice: बलि करे
  rationale: שחט बलिदानी पशु को विधिपूर्वक वध करने का तकनीकी शब्द है। ‘बलि करे’ हिंदी में अनुष्ठानिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है, यद्यपि ‘वध करे’ अधिक शाब्दिक विकल्प है।
- source_word: בִּמְקוֹם
  choice: के स्थान पर
  rationale: यह निर्धारित अनुष्ठानिक स्थान को बताता है; ‘के स्थान पर’ हिंदी में स्थानसूचक अर्थ देता है, संदर्भ से प्रतिस्थापन का अर्थ नहीं।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עלה का यह बलिदानी प्रयोग पूर्णतः जलाए जाने वाले चढ़ावे को दर्शाता है। ‘होमबलि’ हिंदी बाइबिलीय भाषा में स्थापित और संक्षिप्त पद है।
theological_decisions:
- issue: बलिदानी विधान में חטאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: इस पद में शब्द किसी अमूर्त ‘पाप’ के बजाय चढ़ाए और वध किए जाने वाले पशु-बलिदान को दर्शाता है। ‘पापबलि’ परिचित पद है, जबकि वैकल्पिक शुद्धिकरण-संबंधी समझ पादटिप्पणी में दी गई है ताकि मूल की अर्थ-व्याप्ति बनी रहे।
- issue: विधिक संदर्भ में इब्रानी क्रियारूपों का हिंदी रूप
  choice: रखे ... और ... बलि करे
  alternative: रखा ... और ... बलि किया
  rationale: यद्यपि रूप कथात्मक क्रम में आ सकते हैं, यहाँ प्रसंग अनुष्ठान की प्रक्रिया निर्धारित करता है। हिंदी में निर्देशात्मक संभावनार्थक रूप इस विधिक बल को स्पष्ट और स्वाभाविक बनाता है।
- issue: שחט का अनुष्ठानिक अर्थ
  choice: बलि करे
  alternative: वध करे
  rationale: ‘बलि करे’ क्रिया को सामान्य हत्या के बजाय परमेश्वर को चढ़ाए जाने वाले अनुष्ठान के भीतर रखती है। ‘वध करे’ शाब्दिक रूप से निकट है, पर सामान्य पाठक के लिए कुछ कम सहज हो सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, गरिमापूर्ण विधिक शैली रखी गई है। ‘अपना हाथ’, ‘सिर पर रखे’ और ‘बलि करे’ सामान्य पाठक के लिए सहज हैं; ‘पापबलि’ तथा ‘होमबलि’ स्थापित बलिदानी पदावली बनाए रखते हैं।
