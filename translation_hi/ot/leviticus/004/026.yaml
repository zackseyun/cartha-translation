base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/026.yaml
  text: And he shall burn all its fat on the altar[a], like the fat of the sacrifice of peace offerings. Thus the priest shall make atonement for him for his sin[b], and he shall be forgiven.
translation:
  language: hi
  text: और वह उसकी सारी चरबी वेदी पर जलाए, मेलबलि[a] की चरबी के समान। इस प्रकार याजक उसके लिए, उसके पाप[b] के संबंध में, प्रायश्चित करे, और उसे क्षमा किया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मेलबलि’ का अनुवाद ‘शांति-बलि,’ ‘सहभागिता-बलि’ या ‘कुशल-मंगल की भेंट’ भी किया जा सकता है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द חַטָּאת का अर्थ ‘पाप’ या ‘पापबलि’ हो सकता है; यहाँ अधिक संभवतः व्यक्ति के पाप का उल्लेख है।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֶלְבּוֹ
  choice: उसकी सारी चरबी
  rationale: חֵלֶב यहाँ बलि-पशु की वे निर्धारित चरबी के भागों को दर्शाता है जिन्हें वेदी पर जलाया जाता था; כָּל के कारण ‘सारी’ को स्पष्ट रखा गया है।
- source_word: יַקְטִיר
  choice: वेदी पर जलाए
  rationale: बलि-संबंधी संदर्भ में קטר का हिफ़ील रूप वेदी पर जलाकर धुआँ उठाने की क्रिया बताता है। सहज आधुनिक हिन्दी में ‘जलाए’ स्पष्ट है, और वेदी का उल्लेख अनुष्ठानिक अर्थ सुरक्षित रखता है।
- source_word: כְּחֵלֶב זֶבַח הַשְּׁלָמִים
  choice: जैसे मेलबलि की चरबी जलाई जाती है
  rationale: वाक्य इस बलि की चरबी जलाने की विधि की तुलना शְׁלָמִים की स्थापित विधि से करता है। हिन्दी बाइबलीय प्रयोग में ‘मेलबलि’ संक्षिप्त और पहचाना हुआ बलि-वर्ग है। तुलना को स्वाभाविक बनाने के लिए ‘जलाई जाती है’ स्पष्ट किया गया है।
- source_word: וְכִפֶּר עָלָיו
  choice: याजक ... उसके लिए प्रायश्चित करे
  rationale: כפר का याजकीय अनुष्ठान में अर्थ प्रायश्चित करना है। ‘उसके लिए’ עָלָיו के लाभार्थी/संबंधगत भाव को रखता है, पर प्रायश्चित के किसी एक संकीर्ण धर्मवैज्ञानिक सिद्धान्त को नहीं थोपता।
- source_word: מֵחַטָּאתוֹ
  choice: उसके पाप के कारण
  rationale: חַטָּאת का अर्थ ‘पाप’ या ‘पापबलि’ दोनों हो सकता है। यहाँ व्यक्ति के लिए प्रायश्चित और उसके बाद क्षमा का उल्लेख अपराध के अर्थ को अधिक संभावित बनाता है; מִן के संबंध को सहज हिन्दी में ‘के कारण’ से व्यक्त किया गया है।
- source_word: וְנִסְלַח לוֹ
  choice: और उसे क्षमा किया जाएगा
  rationale: סלח का निफ़अल रूप और לֹו क्षमा पाने वाले व्यक्ति को दिखाते हैं। यह हिन्दी निष्क्रिय रचना मूल के अप्रकट कर्ता—अर्थात् ईश्वरीय क्षमा—को बिना अनावश्यक विस्तार के सुरक्षित रखती है।
theological_decisions:
- issue: שְׁלָמִים का बलि-संबंधी अर्थ
  choice: मेलबलि
  alternative: शांति-बलि; सहभागिता-बलि; कुशल-मंगल की भेंट
  rationale: यह शब्द शांति, संपूर्ण कुशल और सहभागी संगति जैसे जुड़े हुए भाव रख सकता है। मुख्य पाठ में परिचित ‘मेलबलि’ रखा गया है, जबकि पादटिप्पणी अर्थ-क्षेत्र की वास्तविक व्यापकता बताती है।
- issue: מֵחַטָּאתוֹ में חַטָּאת का अर्थ
  choice: उसका पाप
  alternative: उसकी पापबलि
  rationale: लैव्यव्यवस्था में חַטָּאת अपराध और उसके लिए चढ़ाई जाने वाली बलि, दोनों का नाम हो सकता है। इस खंड में ‘उसके लिए’ प्रायश्चित और फिर व्यक्ति को क्षमा मिलने का क्रम ‘पाप’ को अधिक संभावित बनाता है, पर वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘चरबी,’ ‘वेदी,’ ‘मेलबलि,’ ‘याजक’ और ‘प्रायश्चित’ जैसे स्थापित धार्मिक शब्द प्रसंगगत सटीकता और लैव्यव्यवस्था में पारिभाषिक निरंतरता के लिए बनाए रखे गए हैं।
