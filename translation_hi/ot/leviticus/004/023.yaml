  text: אֽוֹ הוֹדַ֤ע אֵלָי/ו֙ חַטָּאת֔/וֹ אֲשֶׁ֥ר חָטָ֖א בָּ֑/הּ וְ/הֵבִ֧יא אֶת קָרְבָּנ֛/וֹ שְׂעִ֥יר עִזִּ֖ים זָכָ֥ר תָּמִֽים־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/023.yaml
  text: or if the sin that he has committed is made known to him[a], then he shall bring as his offering a male goat without blemish.
translation:
  language: hi
  text: या यदि उसे उसके उस पाप का पता चले जो उसने किया है, तो वह अपनी भेंट के रूप में बिना किसी दोष का एक बकरा लाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אֽוֹ
  choice: या
  rationale: यह पिछले पद से चली आ रही विधिक स्थिति के अगले विकल्प को प्रस्तुत करता है।
- source_word: הוֹדַע אֵלָיו
  choice: उसे ... का पता चलाया जाए
  rationale: 'ידע के होफ़ाल रूप का कर्मवाच्य/कारणवाच्य भाव सुरक्षित रहता है: पाप की जानकारी उसे दी जाती है, न कि वह केवल स्वयं उसे समझता है।'
- source_word: חַטָּאתוֹ
  choice: उसके ... पाप
  rationale: यहाँ शब्द अपराध को दर्शाता है, पापबलि को नहीं; संबंधवाचक प्रत्यय को स्वाभाविक हिंदी में ‘उसके’ द्वारा स्पष्ट रखा गया है।
- source_word: אֲשֶׁר חָטָא בָּהּ
  choice: किए हुए
  rationale: यह वाक्यांश उसी पाप को निर्दिष्ट करता है जो उसने किया था; בָּהּ का भाव हिंदी में ‘पाप करना’ के स्वाभाविक प्रयोग में निहित है।
- source_word: וְהֵבִיא
  choice: तो वह ... लाए
  rationale: विधिक प्रसंग में वाव सहित पूर्ण क्रिया परिणामस्वरूप निर्धारित कार्य बताती है; ‘तो’ इस संबंध को स्पष्ट करता है।
- source_word: קָרְבָּנוֹ
  choice: अपनी भेंट के रूप में
  rationale: קָרְבָּן परमेश्वर के सामने लाई जाने वाली भेंट है; यह हिंदी में ‘लाए’ के साथ सहज और स्पष्ट है।
- source_word: שְׂעִיר עִזִּים זָכָר
  choice: एक ... बकरा
  rationale: शब्दसमूह नर बकरी को दर्शाता है; हिंदी ‘बकरा’ में जाति और नर लिंग दोनों स्वाभाविक रूप से व्यक्त होते हैं।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलि-पशु के संदर्भ में इसका अर्थ किसी शारीरिक दोष से रहित होना है; ‘निर्दोष’ प्रचलित, संक्षिप्त और गरिमापूर्ण धार्मिक भाषा है।
theological_decisions:
- issue: इस पद में חַטָּאת का अर्थ
  choice: पाप/अपराध
  alternative: पापबलि
  rationale: ‘जो उसने किया’ वाला संबंधवाचक उपवाक्य इसे किए गए अपराध के रूप में पहचानता है; बलि की भेंट को आगे קָרְבָּנוֹ से अलग व्यक्त किया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण विधिक शैली रखी गई है। ‘पता चलाया जाए’ कर्मवाच्य स्रोत-भाव को सुरक्षित रखता है, जबकि ‘बकरा’ नर पशु को अनावश्यक दोहराव के बिना स्पष्ट करता है।
