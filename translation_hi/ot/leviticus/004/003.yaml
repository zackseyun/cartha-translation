  text: אִ֣ם הַ/כֹּהֵ֧ן הַ/מָּשִׁ֛יחַ יֶחֱטָ֖א לְ/אַשְׁמַ֣ת הָ/עָ֑ם וְ/הִקְרִ֡יב עַ֣ל חַטָּאת/וֹ֩ אֲשֶׁ֨ר חָטָ֜א פַּ֣ר בֶּן בָּקָ֥ר תָּמִ֛ים לַ/יהוָ֖ה לְ/חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/003.yaml
  text: If the anointed priest sins[a], bringing guilt on the people, then he shall present for the sin that he has committed a bull, a son of the herd, without blemish[b], to Yahweh as a sin offering.
translation:
  language: hi
  text: यदि अभिषिक्त याजक पाप करे, जिससे लोगों पर दोष आए,[a] तो वह अपने किए हुए पाप के लिए बैलों में से एक निर्दोष बैल यहोवा के लिए पापबलि के रूप में चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “लोगों के दोष के लिए।” इब्रानी पदबंध संक्षिप्त है और याजक के पाप के कारण लोगों से संबंधित दोष या अपराध के परिणाम को व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: अभिषिक्त याजक
  rationale: यह इब्रानी पदबंध का सीधा अनुवाद है। संदर्भ में प्रधान याजक अभिप्रेत हो सकता है, पर मूल पाठ में ‘प्रधान’ के लिए अलग शब्द नहीं है।
- source_word: יֶחֱטָא
  choice: पाप करे
  rationale: אִם के बाद आया अपूर्ण क्रियारूप विधिक शर्त को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: לְאַשְׁמַת הָעָם
  choice: और इस प्रकार लोगों को दोषी ठहराए
  rationale: संक्षिप्त इब्रानी पदबंध याजक के पाप से लोगों पर आने वाले दोष या उत्तरदायित्व को दर्शाता है; यह अनुवाद उसके सामुदायिक परिणाम को व्यक्त करता है, पर उसकी प्रक्रिया को आवश्यकता से अधिक परिभाषित नहीं करता।
- source_word: וְהִקְרִיב
  choice: चढ़ाए
  rationale: बलिदान-संबंधी संदर्भ में यह क्रिया भेंट को प्रस्तुत करने या अर्पित करने के लिए प्रयुक्त होती है; हिंदी में ‘चढ़ाए’ स्वाभाविक और प्रचलित धार्मिक अभिव्यक्ति है।
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: अपने किए हुए पाप के लिए
  rationale: यह अपराध और उसके निमित्त चढ़ाई जाने वाली बलि का संबंध स्पष्ट करता है और इब्रानी की पुनरुक्ति को संक्षिप्त, स्वाभाविक हिंदी में रखता है।
- source_word: פַּר בֶּן בָּקָר
  choice: बैलों में से एक बैल
  rationale: यह पदबंध गोवंश के नर पशु को निर्दिष्ट करता है। चयन मूल की वर्गसूचक अभिव्यक्ति को हिंदी में सहज रूप से रखता है और पशु की आयु को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: תָּמִים
  choice: निर्दोष
  rationale: बलिदान योग्य पशु में किसी शारीरिक दोष के न होने का मानक धार्मिक अर्थ व्यक्त करता है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: दिव्य नाम יהוה को ‘यहोवा’ से दर्शाया गया है; ‘के सामने’ बलि को यहोवा के लिए प्रस्तुत किए जाने का स्वाभाविक हिंदी रूप है।
- source_word: לְחַטָּאת
  choice: पापबलि के रूप में
  rationale: इस बलिदानी विधान में חַטָּאת पाप ही नहीं, पाप के लिए चढ़ाई जाने वाली बलि को भी दर्शाता है।
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ को ‘अभिषिक्त याजक’ कहना या अर्थ खोलकर ‘अभिषिक्त प्रधान याजक’ कहना
  choice: अभिषिक्त याजक
  alternative: अभिषिक्त प्रधान याजक
  rationale: मूल पदबंध शाब्दिक रूप से ‘अभिषिक्त याजक’ है। संदर्भगत पद को मुख्य पाठ में जोड़ने के बजाय वैकल्पिक समझ को पादटिप्पणी में रखा गया है।
- issue: לְאַשְׁמַת הָעָם में याजक के पाप के सामुदायिक परिणाम को कैसे व्यक्त किया जाए
  choice: और इस प्रकार लोगों को दोषी ठहराए
  alternative: जिससे लोगों पर दोष आए
  rationale: चयन याजक के पाप और समुदाय पर आने वाले दोष के बीच संबंध बनाए रखता है, लेकिन उस संबंध की धार्मिक प्रक्रिया को मूल पाठ से अधिक स्पष्ट नहीं करता।
translation_notes:
  register: आधुनिक मानक हिंदी में विधिक और धार्मिक गरिमा बनाए रखी गई है। ‘अभिषिक्त याजक’, ‘निर्दोष’ और ‘पापबलि’ जैसे परिचित बाइबलीय शब्द रखे गए हैं, जबकि वाक्यरचना सामान्य पाठक के लिए सहज बनाई गई है।
