id: LEV.4.25
reference: Leviticus 4:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת דָּמ֣/וֹ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד מִזְבַּ֥ח הָ/עֹלָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/025.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out the rest of its blood at the base of the altar of burnt offering.
translation:
  language: hi
  text: तब याजक पापबलि[a] के लहू में से कुछ अपनी उँगली से लेकर होमबलि की वेदी के सींगों पर लगाए, और उसका बाकी लहू होमबलि की वेदी के आधार पर उँडेल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द पाप के साथ-साथ अशुद्धता दूर करने से संबंधित बलि को भी दर्शा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: तब ... लेकर
  rationale: वाव के साथ प्रयुक्त क्रिया अनुष्ठान की क्रमिक अगली क्रिया बताती है; हिन्दी में ‘तब’ इस क्रम को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִדַּם
  choice: लहू में से कुछ
  rationale: מִן यहाँ अंशसूचक है; वेदी के सींगों पर लगाने के लिए पूरे लहू में से केवल कुछ लिया जाता है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: इस बलिदान-संबंधी प्रसंग में חַטָּאת अमूर्त ‘पाप’ नहीं, बल्कि पाप अथवा शुद्धिकरण से संबंधित बलि को दर्शाता है। ‘पापबलि’ हिन्दी में संक्षिप्त, परिचित और प्रसंगानुकूल है।
- source_word: בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से
  rationale: בְּ यहाँ साधन का बोध कराता है; याजक अपनी उँगली का उपयोग करके लहू लगाता है।
- source_word: וְנָתַן עַל
  choice: पर लगाए
  rationale: अनुष्ठान में लहू को वेदी के सींगों पर रखने/लगाने की ठोस क्रिया को ‘लगाए’ स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קַרְנֹת
  choice: सींगों
  rationale: यह वेदी के कोनों पर बने सींग-जैसे उभारों का मानक और प्रत्यक्ष पद है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: यह पद होमबलियों से संबद्ध वेदी की पहचान कराता है; हिन्दी बाइबलीय प्रयोग में यह स्पष्ट और प्रचलित है।
- source_word: וְאֶת דָּמוֹ יִשְׁפֹּךְ
  choice: और उसका बाकी लहू ... उँडेल दे
  rationale: सर्वनाम बलि के पशु की ओर संकेत करता है। पहले कुछ लहू लिए जाने के कारण ‘बाकी’ अंशसूचक מִדַּם में निहित क्रम को स्पष्ट करता है।
- source_word: אֶל יְסוֹד
  choice: आधार पर
  rationale: יְסוֹד वेदी के निचले आधार अथवा नींव वाले भाग को दर्शाता है; यहाँ लहू उँडेलने के स्थान के लिए ‘आधार पर’ सहज है।
theological_decisions:
- issue: बलिदान-संबंधी विधान में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: इस प्रसंग में यह शब्द बलि/बलिपशु को दर्शाता है। ‘पापबलि’ पारंपरिक अनुष्ठानिक श्रेणी को बनाए रखता है, पर शब्द के शुद्धिकरण-संबंधी अर्थ की वास्तविक संभावना पादटिप्पणी में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और अनुष्ठानिक शैली रखी गई है। विधिक निर्देश को हिन्दी के स्वाभाविक क्रम में ‘तब ... लगाए ... उँडेल दे’ से व्यक्त किया गया है।
