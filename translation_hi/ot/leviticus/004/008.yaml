reference: Leviticus 4:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אֶת כָּל חֵ֛לֶב פַּ֥ר הַֽ/חַטָּ֖את יָרִ֣ים מִמֶּ֑/נּוּ אֶת הַ/חֵ֨לֶב֙ הַֽ/מְכַסֶּ֣ה עַל הַ/קֶּ֔רֶב וְ/אֵת֙ כָּל הַ/חֵ֔לֶב אֲשֶׁ֖ר עַל הַ/קֶּֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/008.yaml
  text: 'And he shall remove from it all the fat of the sin offering bull: the fat that covers the entrails and all the fat that is on the entrails,[a]'
translation:
  language: hi
  text: और वह पापबलि के बछड़े की सारी चरबी उसमें से निकाले—वह चरबी जो अंतड़ियों को ढकती है, और वह सारी चरबी जो अंतड़ियों पर लगी है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि का बछड़ा।” इब्रानी शब्द חַטָּאת ‘पाप’ और पाप या अशुद्धता को दूर करने से संबंधित बलि—दोनों का बोध करा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל
  choice: सारी
  rationale: इब्रानी शब्द की समग्रता बनाए रखता है और बताता है कि निर्दिष्ट चरबी का पूरा भाग निकाला जाना है।
- source_word: חֵלֶב
  choice: चरबी
  rationale: बलिदान के लिए निर्धारित वसायुक्त भागों का सीधा और सामान्य आधुनिक हिन्दी रूप; आगे के शारीरिक विवरण से इसका अनुष्ठानिक आशय स्पष्ट होता है।
- source_word: פַּר הַחַטָּאת
  choice: पापबलि का बछड़ा
  rationale: स्वाभाविक हिन्दी में संबंध व्यक्त करता है कि यह बछड़ा पापबलि के लिए निर्धारित है।
- source_word: יָרִים
  choice: निकाले
  rationale: क्रिया का मूल अर्थ उठाना है, पर इस बलिदान-विधि में आशय निर्दिष्ट अंगों को अलग करके निकालना है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: संदर्भ में सर्वनाम बलि के पशु की ओर संकेत करता है; हिन्दी में यह रूप स्वाभाविक है।
- source_word: הַמְכַסֶּה
  choice: जो ... ढकती है
  rationale: कृदंत का संबंधवाचक रूप चरबी की स्थिति और कार्य को स्पष्ट तथा सहज हिन्दी में व्यक्त करता है।
- source_word: קֶּרֶב
  choice: अंतड़ियाँ
  rationale: बलिदान-संबंधी शारीरिक संदर्भ में ठोस और सामान्य पाठक के लिए सुबोध शब्द है।
- source_word: אֲשֶׁר עַל הַקֶּרֶב
  choice: जो अंतड़ियों पर लगी है
  rationale: עַל का स्थानगत अर्थ बनाए रखते हुए मुहावरेदार हिन्दी देता है और ढकने वाली चरबी से उस पर लगी चरबी को अलग पहचानता है।
theological_decisions:
- issue: बलिदान-संदर्भ में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह शब्द पाप और उससे संबंधित बलि दोनों का बोध करा सकता है। मुख्य पाठ में प्रचलित और सुबोध ‘पापबलि’ रखा गया है, जबकि वैकल्पिक अनुष्ठानिक बलाघात को पादटिप्पणी में सुरक्षित किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक-बलिदान संबंधी गरिमा बनाए रखते हुए सरल वाक्यरचना अपनाई गई है। ‘चरबी’ और ‘अंतड़ियाँ’ सामान्य पाठक के लिए स्पष्ट हैं; दीर्घ विराम अनुष्ठानिक वस्तुओं की सूची को साफ करता है।
