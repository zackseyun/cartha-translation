  text: ठीक वैसे ही जैसे मेलबलि के बैल में से उसे निकाला जाता है,[a] और याजक उन्हें होमबलि की वेदी पर जलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या अधिक शाब्दिक रूप में, “मेलबलि के बैल में से उसे ऊपर उठाया जाता है।” इब्रानी क्रिया चढ़ाए जाने वाले भागों को निकालने और ऊपर उठाने—दोनों का बिंब प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: ठीक वैसे ही जैसे
  rationale: यह पद मेलबलि की विधि के साथ प्रक्रियात्मक तुलना करता है; यह प्रयोग उस तुलना को स्वाभाविक और स्पष्ट बनाता है।
- source_word: יוּרַם
  choice: निकाला जाता है
  rationale: रום के होफल रूप का मूल भाव ऊपर उठाए जाने का है, पर यहाँ बलि के पशु से चर्बी वाले भाग अलग किए जाने की क्रिया अभिप्रेत है। मूल बिंब को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: מִשּׁוֹר
  choice: बैल में से
  rationale: שׁוֹר गोवंश के नर पशु को सूचित कर सकता है; इस बलिदानी प्रसंग में ‘बैल’ सहज और सटीक है।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: मेलबलि के लिए चढ़ाए गए
  rationale: ‘मेलबलि’ इस स्थापित बलिदानी पद के शांति, कुशल और सहभागिता-संबंधी अर्थक्षेत्र को संक्षेप में व्यक्त करता है; वाक्य में ‘चढ़ाए गए’ זֶבַח के बलिदान संबंधी भाव को स्वाभाविक हिंदी में स्पष्ट करता है।
- source_word: וְהִקְטִירָם
  choice: और ... उन्हें ... जलाए
  rationale: קטר का हिफ़ील रूप वेदी पर बलिदानी अंश जलाने को दर्शाता है। ‘उन्हें’ पिछले पद में गिनाए गए चर्बी वाले भागों की ओर संकेत करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: इस्राएली उपासना में सेवा करने वाले पुरोहित पद के लिए प्रचलित और गरिमापूर्ण हिंदी शब्द।
- source_word: עַל מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी पर
  rationale: यह होमबलि से संबद्ध वेदी के लिए स्थापित और संक्षिप्त हिंदी अभिव्यक्ति है।
