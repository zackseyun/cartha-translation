source:
  edition: WLC
  text: וְ/אֶת כָּל חֶלְבָּ֣/ה יָסִ֗יר כַּ/אֲשֶׁ֨ר יוּסַ֥ר חֵֽלֶב הַ/כֶּשֶׂב֮ מִ/זֶּ֣בַח הַ/שְּׁלָמִים֒ וְ/הִקְטִ֨יר הַ/כֹּהֵ֤ן אֹתָ/ם֙ הַ/מִּזְבֵּ֔חָ/ה עַ֖ל אִשֵּׁ֣י יְהוָ֑ה וְ/כִפֶּ֨ר עָלָ֧י/ו הַ/כֹּהֵ֛ן עַל חַטָּאת֥/וֹ אֲשֶׁר חָטָ֖א וְ/נִסְלַ֥ח לֽ/וֹ־־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/035.yaml
  text: And he shall remove all its fat[a], just as the fat of the lamb is removed from the sacrifice of peace offerings, and the priest shall burn them on the altar, on the food offerings of Yahweh. Thus the priest shall make atonement for him concerning the sin that he committed, and he shall be forgiven.
translation:
  language: hi
  text: वह उसकी सारी चर्बी निकाल दे, जैसे मेलबलि में मेम्ने की चर्बी निकाली जाती है; और याजक उन्हें वेदी पर याहवे के लिए अग्नि-बलियों[a] के ऊपर जलाए। इस प्रकार याजक उसके किए हुए पाप के लिए प्रायश्चित करे, और उसे क्षमा कर दिया जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के लिए अग्नि में चढ़ाई जाने वाली भेंटों पर।” इब्रानी में यह बलिदान-विधि का एक तकनीकी पद है।
    reason: अग्नि-बलियों के लिए प्रयुक्त इब्रानी तकनीकी पद אִשֵּׁי יְהוָה का वैकल्पिक अधिक व्याख्यात्मक अनुवाद देना।
lexical_decisions:
- source_word: חֶלְבָּהּ / חֵלֶב
  choice: चर्बी
  rationale: यह शब्द पशु की उस चर्बी को दर्शाता है जिसे बलिदान की विधि में निकालकर वेदी पर जलाया जाता था। ‘चर्बी’ इसका सीधा और सहज हिन्दी अर्थ है।
- source_word: יָסִיר / יוּסַר
  choice: निकाल दे / निकाली जाती है
  rationale: हिफ़ील रूप यहाँ बलिदानी पशु से निर्धारित चर्बी अलग करने की क्रिया बताता है; ‘निकालना’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַכֶּשֶׂב
  choice: मेम्ना
  rationale: बलिदानी संदर्भ में כֶּשֶׂב सामान्यतः भेड़ के बच्चे को दर्शाता है; इसलिए व्यापक ‘भेड़’ के बजाय ‘मेम्ना’ अधिक सटीक है।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: मेलबलि
  rationale: यह इस्राएली बलिदान-व्यवस्था की एक निश्चित श्रेणी है। ‘मेलबलि’ शांति और सहभागिता से जुड़े भाव को संक्षिप्त पारंपरिक रूप में रखता है।
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: बलिदानी संदर्भ में क्रिया वेदी पर वस्तु को जलाकर धुआँ उठाने को सूचित करती है; ‘जलाए’ स्पष्ट और स्वाभाविक है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: मूल इब्रानी सर्वनाम बहुवचन है और चर्बी के निकाले गए विभिन्न भागों की ओर संकेत करता है; हिन्दी में ‘उन्हें’ उस व्याकरणिक विशेषता को सुरक्षित रखता है।
- source_word: עַל אִשֵּׁי יְהוָה
  choice: याहवे के अग्नि-चढ़ावों के ऊपर
  rationale: אִשֶּׁה बलिदानी तकनीकी पद है, जो आग में चढ़ाई जाने वाली भेंटों को दर्शाता है। ‘के ऊपर’ עַל की स्थानगत भावना को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: व्यक्तिगत दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए प्रायश्चित करे
  rationale: पुरोहितीय बलिदानी संदर्भ में כפר के व्यापक धार्मिक अर्थ को ‘प्रायश्चित करना’ सुरक्षित रखता है, बिना किसी एक व्यवस्थित सिद्धांत को आरोपित किए।
- source_word: עַל חַטָּאתוֹ אֲשֶׁר חָטָא
  choice: उसके उस पाप के लिए जो उसने किया है
  rationale: यह वाक्यांश उस अपराध को निर्दिष्ट करता है जिसके संबंध में प्रायश्चित किया जाता है; हिन्दी रूप अर्थ और इब्रानी बलाघात दोनों को स्पष्ट रखता है।
- source_word: וְנִסְלַח לוֹ
  choice: उसे क्षमा कर दिया जाएगा
  rationale: निफ़ाल रूप क्षमा प्राप्त होने के परिणाम को व्यक्त करता है। यह निष्क्रिय हिन्दी रचना मूल की संरचना और अर्थ दोनों को स्वाभाविक ढंग से दर्शाती है।
theological_decisions:
- issue: बलिदानी प्रायश्चित की भाषा
  choice: उसके लिए प्रायश्चित करे
  alternative: उसका दोष मिटाए
  rationale: पद बलिदानी विधि और उसके परिणाम का वर्णन करता है, पर प्रायश्चित की कोई संकीर्ण बाद की व्याख्या निर्धारित नहीं करता। ‘प्रायश्चित’ मूल धार्मिक श्रेणी की व्यापकता बनाए रखता है।
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और ‘यहोवा’ से भिन्न प्रचलित विद्वत् लिप्यंतरण को दर्शाता है।
- issue: बहुवचन सर्वनाम אֹתָם
  choice: उन्हें
  alternative: उसे
  rationale: यद्यपि ‘चर्बी’ हिन्दी में एकवचन सामूहिक संज्ञा है, मूल का बहुवचन चर्बी के अलग-अलग भागों की ओर संकेत करता है। ‘उन्हें’ इस वास्तविक पाठगत तनाव को मिटाता नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेलबलि’, ‘अग्नि-चढ़ाव’ और ‘प्रायश्चित’ जैसे पद बलिदानी संदर्भ की तकनीकी प्रकृति बनाए रखते हैं। मूल इब्रानी के बहुवचन אֹתָם को ‘उन्हें’ से सुरक्षित रखा गया है, भले ही उसका हिन्दी पूर्वपद ‘चर्बी’ सामूहिक एकवचन है।
