  text: וְ/אֶת ע֤וֹר הַ/פָּר֙ וְ/אֶת כָּל בְּשָׂר֔/וֹ עַל רֹאשׁ֖/וֹ וְ/עַל כְּרָעָ֑י/ו וְ/קִרְבּ֖/וֹ וּ/פִרְשֽׁ/וֹ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/011.yaml
  text: But the hide of the bull[a], and all its flesh[c][b], with its head and with its legs and its entrails and its dung—
translation:
  language: hi
  text: परन्तु बैल की खाल[a] और उसका सारा मांस—उसके सिर और टाँगों समेत—उसकी अंतड़ियाँ और उसका गोबर—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘चमड़ी’।
    reason: lexical_alternative
lexical_decisions:
- source_word: עוֹר
  choice: खाल
  rationale: बलि किए गए पशु के बाहरी आवरण के लिए ‘खाल’ स्वाभाविक और संदर्भानुकूल है।
- source_word: הַפָּר
  choice: बैल
  rationale: פַּר बैल या जवान बैल को सूचित कर सकता है; यहाँ आयु पर बल न होने के कारण ‘बैल’ पर्याप्त है।
- source_word: כָּל בְּשָׂרוֹ
  choice: उसका सारा मांस
  rationale: यह पशु के शरीर के मांसल भागों का ठोस उल्लेख बनाए रखता है।
- source_word: עַל רֹאשׁוֹ וְעַל כְּרָעָיו
  choice: उसके सिर और टाँगों समेत
  rationale: सूची में עַל समावेश का भाव देता है; ‘समेत’ आधुनिक हिन्दी में इसे स्पष्ट और स्वाभाविक बनाता है।
- source_word: קִרְבּוֹ
  choice: उसकी अंतड़ियाँ
  rationale: बलि-विधान के शारीरिक संदर्भ में קֶרֶב के भीतरी अंगों का ठोस अर्थ व्यक्त होता है।
- source_word: פִרְשׁוֹ
  choice: उसका गोबर
  rationale: פֶּרֶשׁ यहाँ पशु के मल को सूचित करता है; ‘गोबर’ सीधा और सामान्य हिन्दी शब्द है।
