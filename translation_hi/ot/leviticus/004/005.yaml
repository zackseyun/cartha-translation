source:
  edition: WLC
  text: וְ/לָקַ֛ח הַ/כֹּהֵ֥ן הַ/מָּשִׁ֖יחַ מִ/דַּ֣ם הַ/פָּ֑ר וְ/הֵבִ֥יא אֹת֖/וֹ אֶל אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/005.yaml
  text: And the anointed priest shall take some of the bull's blood and bring it into the tent of meeting[a][b].
translation:
  language: hi
  text: फिर अभिषिक्त याजक बैल के लहू में से कुछ लेकर उसे मिलाप के तंबू के भीतर ले जाए[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अधिक शाब्दिक रूप में, “बैल के लहू में से।” यहाँ हिब्रू वाक्यांश का आशय संभवतः लहू का कुछ भाग लेने से है।
    reason: lexical_alternative
  - marker: b
    text: हिब्रू में “मिलाप के तंबू की ओर”; “भीतर” अनुष्ठान के प्रसंग को दर्शाता है, क्योंकि आगे के कार्य पवित्रस्थान के अंदर किए जाते हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर ... लेकर
  rationale: बलिदान-विधि के क्रम में वाव + क़ातल निर्देशात्मक और क्रमसूचक है। हिंदी में संयुक्त क्रिया-विन्यास ‘लेकर ... ले जाए’ इस क्रम और विधिक भाव को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַכֹּהֵן הַמָּשִׁיחַ
  choice: अभिषिक्त याजक
  rationale: यह हिब्रू पदवी याजक की अभिषिक्त स्थिति बताती है। ‘अभिषिक्त याजक’ मूल शब्दार्थ को बनाए रखता है और मुख्य पाठ में ‘महायाजक’ जैसी व्याख्यात्मक पदवी नहीं जोड़ता।
- source_word: מִדַּם הַפָּר
  choice: बैल के लहू में से कुछ
  rationale: 'यहाँ מִן अंशवाचक है: याजक सारा लहू नहीं, उसमें से कुछ लेता है। ‘में से कुछ’ आधुनिक हिंदी में इस अर्थ को स्पष्ट और स्वाभाविक ढंग से व्यक्त करता है।'
- source_word: וְהֵבִיא אֹתוֹ
  choice: उसे ... ले जाए
  rationale: कर्म-प्रत्यय पहले उल्लिखित लहू की ओर संकेत करता है। ‘उसे’ उस संदर्भ को बनाए रखता है और ‘ले जाए’ विधिक निर्देश का भाव देता है।
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के भीतर
  rationale: אֶל का मूल दिशात्मक अर्थ ‘की ओर/तक’ हो सकता है, पर आगामी अनुष्ठान तंबू के अंदर होता है। ‘के भीतर’ उस प्रसंगगत गंतव्य को स्पष्ट करता है; अधिक शाब्दिक विकल्प पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: הַכֹּהֵן הַמָּשִׁיחַ का अनुवाद
  choice: अभिषिक्त याजक
  alternative: महायाजक; समर्पित याजक
  rationale: מָשִׁיחַ का प्रत्यक्ष अर्थ ‘अभिषिक्त’ है। इसे बनाए रखने से लैव्यव्यवस्था की याजकीय पदवी सुरक्षित रहती है और न तो इसे केवल व्याख्यात्मक ‘महायाजक’ से बदला जाता है, न बाद की मसीही अर्थच्छाया को जबरन पाठ में डाला जाता है।
- issue: אֶל के दिशात्मक अर्थ और अनुष्ठानिक प्रसंग के बीच तनाव
  choice: के भीतर
  alternative: के पास; की ओर
  rationale: हिब्रू पूर्वसर्ग अपने आप में प्रवेश को अनिवार्य नहीं बनाता, किंतु अगले पदों में कार्य पवित्रस्थान के अंदर होते हैं। मुख्य पाठ प्रसंगगत अर्थ देता है और शाब्दिक दिशा-सूचक संभावना पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक-अनुष्ठानिक है। ‘याजक,’ ‘अभिषिक्त,’ ‘लहू’ और ‘मिलापवाला तंबू’ परिचित बाइबलीय शब्दावली बनाए रखते हैं; वाक्य-विन्यास साधारण पाठक के लिए सहज रखा गया है।
