  choice: इस्राएलियों से कहो
  rationale: हिब्रू का शाब्दिक अर्थ ‘इस्राएल के पुत्रों से बोलो, यह कहते हुए’ है; आधुनिक हिन्दी में ‘इस्राएलियों से कहो’ पूरे समुदाय के लिए स्वाभाविक और अर्थ-सटीक है।
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: इस विधिक प्रसंग में נֶפֶשׁ का अर्थ किसी मनुष्य या व्यक्ति से है, न कि अलग अमूर्त ‘आत्मा’ से।
- source_word: כִּי תֶחֱטָא בִשְׁגָגָה
  choice: अनजाने में ... पाप करे
  rationale: בִשְׁגָגָה भूल, चूक या अनभिप्रेत कृत्य को दर्शाता है; यह जानबूझकर विद्रोही ढंग से किए गए पाप के विपरीत है।
- source_word: מִכֹּל מִצְוֺת יְהוָה אֲשֶׁר לֹא תֵעָשֶׂינָה
  choice: याहवे की उन आज्ञाओं में से, जिनका उल्लंघन नहीं किया जाना चाहिए
  rationale: निषेधात्मक आज्ञाओं के आशय को स्वाभाविक हिन्दी में व्यक्त किया गया है; ‘उल्लंघन’ आज्ञा और निषिद्ध काम के बीच संबंध स्पष्ट करता है।
- source_word: וְעָשָׂה מֵאַחַת מֵהֵנָּה
  choice: किसी एक का ... उल्लंघन करके
  rationale: यह वाक्यांश पहले कही गई निषेधात्मक आज्ञाओं में से एक को वास्तव में तोड़ने का संकेत देता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में आए परमेश्वर के विशिष्ट वाचा-नाम को शीर्षक से बदलने के बजाय लिप्यंतरित किया गया है।
theological_decisions:
- issue: अनजाने पाप का स्वरूप
  choice: अनजाने में
  alternative: भूल से / चूक से
  rationale: शब्द अनभिप्रेत या असावधानी में हुए अपराध को समेटता है, पर दोष की वास्तविकता को समाप्त नहीं करता।
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल के विशिष्ट व्यक्तिगत नाम को सुरक्षित रखा गया है; ‘याहवे’ प्रचलित विद्वत्तापूर्ण लिप्यंतरण है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक और धार्मिक गरिमा बनाए रखते हुए वाक्य को सामान्य पाठक के लिए सहज रखा गया है। ‘इस्राएली’ सामुदायिक अर्थ देता है, और ‘उल्लंघन’ निषेधात्मक आज्ञा के आशय को स्पष्ट करता है।
