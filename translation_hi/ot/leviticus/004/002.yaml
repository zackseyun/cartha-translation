  text: דַּבֵּ֞ר אֶל בְּנֵ֣י יִשְׂרָאֵ֘ל לֵ/אמֹר֒ נֶ֗פֶשׁ כִּֽי תֶחֱטָ֤א בִ/שְׁגָגָה֙ מִ/כֹּל֙ מִצְוֺ֣ת יְהוָ֔ה אֲשֶׁ֖ר לֹ֣א תֵעָשֶׂ֑ינָה וְ/עָשָׂ֕ה מֵ/אַחַ֖ת מֵ/הֵֽנָּה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/002.yaml
  text: 'Speak to the sons of Israel[a], saying: If a person sins unintentionally in regard to any of the commandments of Yahweh concerning things that should not be done, and does one of them[b],'
translation:
  language: hi
  text: '“इस्राएलियों से कहो: यदि कोई व्यक्ति याहवे की उन आज्ञाओं में से किसी के संबंध में अनजाने में पाप करे, जिनके अनुसार कुछ काम नहीं किए जाने चाहिए, और उन कामों में से कोई एक करे,[a]'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “भूल से” अथवा “चूक से।” हिब्रू शब्द उस पाप को सूचित करता है जो जानबूझकर या उद्दंडता से नहीं, बल्कि अनजाने में हुआ हो।
    reason: lexical_alternative
lexical_decisions:
