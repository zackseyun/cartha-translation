id: LEV.4.34
reference: Leviticus 4:34
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֨ח הַ/כֹּהֵ֜ן מִ/דַּ֤ם הַֽ/חַטָּאת֙ בְּ/אֶצְבָּע֔/וֹ וְ/נָתַ֕ן עַל קַרְנֹ֖ת מִזְבַּ֣ח הָ/עֹלָ֑ה וְ/אֶת כָּל דָּמָ֣/הּ יִשְׁפֹּ֔ךְ אֶל יְס֖וֹד הַ/מִּזְבֵּֽחַ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/034.yaml
  text: Then the priest shall take some of the blood of the sin offering with his finger and put it on the horns of the altar of burnt offering[a], and he shall pour out all its blood at the base of the altar.
translation:
  language: hi
  text: फिर याजक पापबलि[a] के लहू में से कुछ अपनी उँगली से लेकर होमबलि की वेदी के सींगों पर लगाए, और उसका सारा लहू वेदी के आधार पर उंडेल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द पाप और अनुष्ठानिक शुद्धिकरण से संबंधित बलि को सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर ... लेकर
  rationale: वाव + क़ातल यहाँ अनुष्ठान की क्रमिक विधि को आगे बढ़ाता है। हिंदी में ‘फिर ... लेकर’ अगली क्रिया ‘लगाए’ से स्वाभाविक रूप से जुड़कर इस क्रम को व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: यह निश्चित संज्ञा अनुष्ठान संपन्न करने वाले पुरोहित को दर्शाती है; ‘याजक’ बाइबलीय हिंदी में परिचित और गरिमापूर्ण है।
- source_word: מִדַּם
  choice: लहू में से कुछ
  rationale: 'מִן यहाँ अंशवाचक है: याजक लहू का कुछ भाग उँगली से लगाता है, जबकि बाद में लहू वेदी के आधार पर उंडेला जाता है।'
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: लैव्यव्यवस्था के बलिदान-संबंधी संदर्भ में यह शब्द अमूर्त ‘पाप’ नहीं, पाप अथवा शुद्धिकरण से संबंधित बलि को सूचित करता है। ‘पापबलि’ संक्षिप्त, परिचित और संदर्भानुकूल है।
- source_word: בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से
  rationale: בְּ साधन का बोध कराता है; ‘अपनी’ से हिब्रू प्रत्यय का संबंध याजक से स्पष्ट होता है।
- source_word: וְנָתַן
  choice: लगाए
  rationale: נתן का मूल अर्थ ‘देना/रखना’ है, पर इस अनुष्ठान में लहू को वेदी के सींगों पर लगाने के लिए हिंदी ‘लगाए’ अधिक स्वाभाविक और सटीक है।
- source_word: עַל קַרְנֹת מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी के सींगों पर
  rationale: यह वेदी के सींग-जैसे उभारों की उपासना-संबंधी छवि को बनाए रखता है और वेदी को होमबलि की वेदी के रूप में पहचानता है।
- source_word: וְאֶת כָּל דָּמָהּ
  choice: और उसका सारा लहू
  rationale: כָּל की पूर्णतावाचक अभिव्यक्ति को ‘सारा’ से सुरक्षित रखा गया है। संदर्भ में शेष लहू अभिप्रेत हो सकता है, पर मूल पाठ ‘सारा लहू’ कहता है, इसलिए उसे स्पष्ट करके ‘बाकी’ नहीं बनाया गया।
- source_word: יִשְׁפֹּךְ
  choice: उंडेल दे
  rationale: यह जानबूझकर किए जाने वाले अनुष्ठानिक उंडेलने को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: אֶל יְסוֹד הַמִּזְבֵּחַ
  choice: वेदी के आधार पर
  rationale: יְסוֹד का अर्थ नींव या आधार है। ‘वेदी के आधार पर’ स्थान को स्पष्ट और मूल के निकट रखता है।
theological_decisions:
- issue: बलिदान-विधान में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: इस संदर्भ में शब्द का बलि को सूचित करना निश्चित है, पर वह पाप से संबंधित बलि अथवा शुद्धिकरण-कार्य पर बल देने वाली बलि के रूप में समझा जा सकता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और वैध वैकल्पिक अर्थ पाद-टिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, विधिपरक और गरिमापूर्ण शैली रखी गई है। ‘लहू,’ ‘याजक,’ ‘पापबलि,’ ‘होमबलि’ और वेदी के ‘सींग’ जैसे स्थापित बाइबलीय शब्द साधारण पाठक के लिए बोधगम्य रहते हुए मूल के सांस्कृतिक स्वरूप को बनाए रखते हैं।
