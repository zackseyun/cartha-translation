reference: Leviticus 4:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ֠/סָמְכוּ זִקְנֵ֨י הָ/עֵדָ֧ה אֶת יְדֵי/הֶ֛ם עַל רֹ֥אשׁ הַ/פָּ֖ר לִ/פְנֵ֣י יְהוָ֑ה וְ/שָׁחַ֥ט אֶת הַ/פָּ֖ר לִ/פְנֵ֥י יְהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/015.yaml
  text: And the elders of the congregation shall lay their hands on the head of the bull before Yahweh[a], and the bull shall be slaughtered before Yahweh.
translation:
  language: hi
  text: और मण्डली के बुज़ुर्ग यहोवा के सामने उस बैल के सिर पर अपने हाथ रखें, और वह उस बैल का वध यहोवा के सामने करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְסָמְכוּ
  choice: अपने हाथ रखें
  rationale: बलिदान-विधि में סמך चढ़ावे के सिर पर हाथ रखने या दबाने की रस्मी क्रिया बताता है। आधुनिक हिन्दी में ‘हाथ रखें’ स्वाभाविक और सटीक है।
- source_word: זִקְנֵי הָעֵדָה
  choice: मण्डली के पुरनिए
  rationale: यह पदबंध वाचा-समुदाय के मान्य वरिष्ठ प्रतिनिधियों को दर्शाता है। ‘मण्डली’ सामूहिक धार्मिक अर्थ रखता है और ‘पुरनिए’ बाइबलीय संदर्भ में पदसूचक, सुबोध शब्द है।
- source_word: אֶת יְדֵיהֶם
  choice: अपने हाथ
  rationale: इब्रानी में बहुवचन संज्ञा और तृतीय पुरुष बहुवचन संबंधसूचक प्रत्यय है; हिन्दी का ‘अपने हाथ’ सामूहिक बहुवचन क्रिया के साथ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: עַל רֹאשׁ הַפָּר
  choice: उस बैल के सिर पर
  rationale: स्थान-संबंधी वाक्यांश और פַּר का अर्थ सीधे रूप में सुरक्षित हैं। संदर्भ में पहले से निर्दिष्ट पशु होने के कारण ‘उस बैल’ स्वाभाविक है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का अर्थ ‘सामने/उपस्थिति में’ है; यह रूप बलिदान-विधि के स्थान और परमेश्वर की उपस्थिति दोनों को सहज हिन्दी में बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: टेट्राग्राम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित नामरूप ‘यहोवा’ द्वारा व्यक्त किया गया है।
- source_word: וְשָׁחַט
  choice: फिर वह ... बलि करे
  rationale: मूल में बहुवचन ‘पुरनिए’ के बाद क्रिया तृतीय पुरुष एकवचन है। ‘वह’ इस संख्या-परिवर्तन को बनाए रखता है; ‘बलि करे’ पशुबलि के विधिक संदर्भ में केवल ‘मारे’ से अधिक सटीक और स्वाभाविक है।
- source_word: הַפָּר
  choice: उस बैल को
  rationale: פַּר का मूल अर्थ ‘बैल’ है; आयु की अतिरिक्त सूक्ष्मता जोड़े बिना वही रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है। ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं करता और हिन्दी पाठकों के लिए परिचित रूप है।
- issue: וְשָׁחַט में बहुवचन कर्ता के बाद एकवचन क्रिया
  choice: एकवचन ‘वह ... बलि करे’ बनाए रखना
  alternative: ‘वे ... बलि करें’ अथवा कर्मवाच्य ‘बैल की बलि की जाए’
  rationale: इब्रानी पाठ जानबूझकर या व्याकरणिक रूप से बहुवचन से एकवचन की ओर जाता है और कर्ता को स्पष्ट नहीं करता। एकवचन बनाए रखने से किसी सामूहिक कर्ता या कर्मवाच्य अर्थ को चुपचाप आरोपित नहीं किया जाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली। ‘रखें’ और ‘बलि करे’ आज्ञार्थक/विधिसूचक भाव देते हैं। ‘पुरनिए’ बाइबलीय पद-संज्ञा के रूप में रखा गया है; वाक्य में मूल का बहुवचन से एकवचन की ओर परिवर्तन जानबूझकर सुरक्षित है।
