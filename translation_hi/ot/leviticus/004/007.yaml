id: LEV.4.7
reference: Leviticus 4:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַן֩ הַ/כֹּהֵ֨ן מִן הַ/דָּ֜ם עַל קַ֠רְנוֹת מִזְבַּ֨ח קְטֹ֤רֶת הַ/סַּמִּים֙ לִ/פְנֵ֣י יְהוָ֔ה אֲשֶׁ֖ר בְּ/אֹ֣הֶל מוֹעֵ֑ד וְ/אֵ֣ת כָּל דַּ֣ם הַ/פָּ֗ר יִשְׁפֹּךְ֙ אֶל יְסוֹד֙ מִזְבַּ֣ח הָ/עֹלָ֔ה אֲשֶׁר פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־־׀־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/007.yaml
  text: And the priest shall put some of the blood on the horns of the altar of fragrant incense before Yahweh[a], which is in the tent of meeting, and he shall pour out all the bull’s blood at the base of the altar of burnt offering[b], which is at the entrance of the tent of meeting.
translation:
  language: hi
  text: और याजक उस रक्त में से कुछ लेकर सुगंधित धूप की वेदी के सींगों पर लगाएगा। यह वेदी मिलाप के तंबू में याहवे के सामने है। फिर वह बैल का सारा रक्त[a] मिलाप के तंबू के प्रवेश-द्वार पर स्थित होमबलि की वेदी के आधार पर उंडेल देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ “बैल का सारा रक्त” है; पिछले वाक्य में कुछ रक्त सींगों पर लगाए जाने के कारण संदर्भ में इसका आशय बचा हुआ सारा रक्त हो सकता है।
    reason: मूल अभिव्यक्ति और संदर्भगत आशय के बीच तनाव को सुरक्षित रखना।
lexical_decisions:
- source_word: וְנָתַן
  choice: लगाएगा
  rationale: अनुष्ठान में रक्त को वेदी के सींगों पर रखने की क्रिया के लिए स्वाभाविक हिंदी; נתן के ‘रखना/लगाना’ भाव को संदर्भानुसार व्यक्त करता है।
- source_word: מִן הַדָּם
  choice: उस रक्त में से कुछ
  rationale: מן यहाँ अंशसूचक है; यह स्पष्ट करता है कि रक्त का एक भाग सींगों पर लगाया जाता है।
- source_word: קַרְנוֹת
  choice: सींगों
  rationale: वेदी के उभरे हुए कोनों के लिए पारंपरिक और स्रोत-संगत धार्मिक शब्द।
- source_word: מִזְבַּח קְטֹרֶת הַסַּמִּים
  choice: सुगंधित धूप की वेदी
  rationale: कतורת और סמּים दोनों की अर्थ-छटा रखते हुए सुबोध हिंदी; यह सुगंधित मसालों से बनी धूप की वेदी को दर्शाता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: स्थानिक और उपासना-संबंधी भाव बनाए रखता है तथा יהוה को व्यक्तिगत नाम ‘याहवे’ के रूप में प्रस्तुत करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: इस पवित्र स्थान के लिए प्रचलित, संक्षिप्त और समझने योग्य हिंदी पद।
- source_word: כָּל דַּם הַפָּר
  choice: बैल का सारा रक्त
  rationale: हिब्रू के स्पष्ट ‘बैल का सारा रक्त’ को बिना अर्थ-विस्तार के बनाए रखा गया है; संदर्भगत कठिनाई पादटिप्पणी में बताई गई है।
- source_word: יִשְׁפֹּךְ
  choice: उंडेल देगा
  rationale: שׁפך की ठोस क्रिया और अनुष्ठानिक प्रसंग को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אֶל יְסוֹד
  choice: आधार पर
  rationale: יסוד वेदी की नींव अथवा निचले आधार को दर्शाता है; ‘आधार पर’ रक्त उंडेलने के स्थान को सहज रूप से बताता है।
- source_word: מִזְבַּח הָעֹלָה
  choice: होमबलि की वेदी
  rationale: पूरी तरह जलाई जाने वाली बलि की वेदी के लिए स्थापित हिंदी धार्मिक पद।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम है; उसे उपाधि से बदलने के बजाय देवनागरी लिप्यंतरण में रखा गया है।
- issue: पहले कुछ रक्त प्रयुक्त होने के बाद כָּל דַּם הַפָּר का अर्थ
  choice: बैल का सारा रक्त
  alternative: बैल का बचा हुआ सारा रक्त
  rationale: मुख्य पाठ हिब्रू की वास्तविक अभिव्यक्ति को बनाए रखता है और ‘बचा हुआ’ को चुपचाप नहीं जोड़ता; अनुष्ठान के क्रम से संभव संदर्भगत अर्थ पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। लंबे इब्रानी वाक्य को हिंदी में दो वाक्यों में बाँटा गया है, पर सभी संबंध सुरक्षित हैं। ‘याजक’, ‘वेदी’, ‘होमबलि’ और ‘मिलाप का तंबू’ जैसे परिचित बाइबलीय पद बनाए गए हैं।
