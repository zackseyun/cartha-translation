  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/טָבַ֧ל הַ/כֹּהֵ֛ן אֶת אֶצְבָּע֖/וֹ בַּ/דָּ֑ם וְ/הִזָּ֨ה מִן הַ/דָּ֜ם שֶׁ֤בַע פְּעָמִים֙ לִ/פְנֵ֣י יְהוָ֔ה אֶת פְּנֵ֖י פָּרֹ֥כֶת הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/006.yaml
  text: The priest shall dip his finger in the blood and sprinkle some of the blood seven times before Yahweh[a], in front of the curtain of the sanctuary.
translation:
  language: hi
  text: याजक अपनी उँगली लहू में डुबोए और उस लहू में से कुछ याहवे के सामने, पवित्रस्थान के परदे के सामने सात बार छिड़के।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְטָבַל
  choice: डुबोए
  rationale: अनुष्ठान-संबंधी निर्देश की क्रमिक विधि को हिन्दी में संभावनार्थक आज्ञात्मक रूप स्वाभाविक ढंग से व्यक्त करता है; טבל का सामान्य अर्थ किसी वस्तु को द्रव में डुबोना है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: यह निश्चित एकवचन संज्ञा इस अनुष्ठान को संपन्न करने वाले पुरोहित को सूचित करती है; ‘याजक’ आधुनिक हिन्दी बाइबलीय प्रयोग में स्पष्ट और गरिमापूर्ण है।
- source_word: אֶצְבָּעוֹ
  choice: अपनी उँगली
  rationale: तीसरे पुरुष एकवचन संबंधसूचक प्रत्यय का हिन्दी में कर्ता-संदर्भित स्वाभाविक रूप ‘अपनी’ है।
- source_word: בַּדָּם
  choice: लहू में
  rationale: ב यहाँ उस पदार्थ को बताता है जिसमें उँगली डुबोई जाती है। ‘लहू’ बलिदान-संबंधी प्रसंग में प्रचलित और सहज है।
- source_word: וְהִזָּה
  choice: छिड़के
  rationale: נזה के हिफ़ील रूप का याजकीय अनुष्ठानों में अर्थ विधिपूर्वक छिड़कना है।
- source_word: מִן־הַדָּם
  choice: उस लहू में से कुछ
  rationale: 'מן का यहाँ अंशवाचक अर्थ है: पात्र के लहू में से एक मात्रा लेकर छिड़की जाती है।'
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: संख्यात्मक क्रियाविशेषण का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי स्थानिक और उपासना-संबंधी उपस्थिति/अभिमुखता दर्शाता है; יְהוָה को उसके व्यक्तिगत वाचा-नाम ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ
  choice: पवित्रस्थान के परदे की ओर
  rationale: פְּנֵי यहाँ परदे के सामने वाले भाग की दिशा बताता है। ‘की ओर’ छिड़कने की अभिमुखता को स्पष्ट करता है, जबकि פָּרֹכֶת को सामान्य पाठक के लिए ‘परदा’ और הַקֹּדֶשׁ को ‘पवित्रस्थान’ कहा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकार्य आधुनिक लिप्यंतरण है और उसे किसी उपाधि में नहीं बदलता।
- issue: לִפְנֵי יְהוָה और אֶת־פְּנֵי פָּרֹכֶת הַקֹּדֶשׁ का पारस्परिक संबंध
  choice: याहवे के सामने, पवित्रस्थान के परदे की ओर
  alternative: याहवे के सामने, अर्थात् पवित्रस्थान के परदे के सामने
  rationale: मुख्य पाठ दोनों अभिमुखताओं को साथ रखता है और उन्हें पूरी तरह समानार्थी ठहराकर मूल की वाक्यगत संभावना को बंद नहीं करता। पादटिप्पणी निकट appositional समझ को दर्ज करती है।
- issue: פָּרֹכֶת הַקֹּדֶשׁ की उपासना-संबंधी पहचान
  choice: पवित्रस्थान का परदा
  alternative: पवित्र भाग का परदा; परमपवित्र स्थान का परदा
  rationale: הַקֹּדֶשׁ पवित्र क्षेत्र/पवित्रस्थान को सूचित कर सकता है। इस पद में अधिक विशिष्ट वास्तुशास्त्रीय पहचान आरोपित किए बिना ‘पवित्रस्थान’ उपयुक्त है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल किंतु गरिमापूर्ण अनुष्ठानिक विधान-रजिस्टर अपनाया गया है। ‘डुबोए’ और ‘छिड़के’ निर्देशात्मक क्रम बनाए रखते हैं; अनावश्यक तकनीकी मंदिर-वास्तु शब्दावली से बचा गया है।
