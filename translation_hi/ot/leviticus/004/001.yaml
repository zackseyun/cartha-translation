  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया नए ईश्वरीय वचन-खंड का आरंभ करती है। आधुनिक हिन्दी में ‘मूसा से कहा’ इस सूत्र का स्वाभाविक और गरिमापूर्ण रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय ‘याहवे’ के रूप में लिप्यंतरित किया गया है।
- source_word: אֶל
  choice: से
  rationale: 'דבר के साथ हिन्दी में संबोधित व्यक्ति को ‘से’ द्वारा व्यक्त करना स्वाभाविक है: ‘मूसा से कहा’।'
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिन्दी बाइबल-परंपरा में प्रचलित और सामान्यतः पहचाना जाने वाला नाम-रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: इब्रानी में यह आने वाले कथन की विषयवस्तु प्रस्तुत करता है। ‘ने…कहा’ आधुनिक हिन्दी में וידבר और לאמר के संयुक्त सूत्र को बिना अनावश्यक दोहराव के स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ उसका व्यापक रूप से स्वीकृत विद्वत्तापूर्ण लिप्यंतरण है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और सहज वाक्य। इब्रानी के ‘बोला…यह कहते हुए’ जैसे औपचारिक दोहरे सूत्र को हिन्दी के स्वाभाविक ‘से कहा’ में व्यक्त किया गया है।
