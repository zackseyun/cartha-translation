base_translation:
  language: en
  yaml_path: translation/ot/leviticus/004/016.yaml
  text: Then the anointed priest shall bring some of the bull's blood into the tent of meeting[a][b].
translation:
  language: hi
  text: तब अभिषिक्त याजक बछड़े के लहू में से कुछ लेकर मिलापवाले तंबू के भीतर आएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/הֵבִיא
  choice: तब ... लेकर ... आएगा
  rationale: संयोजक सहित हिफ़ील क्रिया विधिक प्रक्रिया के अगले चरण को बताती है। हिंदी में ‘तब ... लेकर ... आएगा’ क्रम और ‘भीतर लाने’ की गति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: הַ/כֹּהֵן הַ/מָּשִׁיחַ
  choice: अभिषिक्त याजक
  rationale: यह पद उस याजक को दर्शाता है जिसका पदाभिषेक तेल से हुआ है; यहाँ यह मसीह-संबंधी उपाधि नहीं है।
- source_word: מִ/דַּם הַ/פָּר
  choice: बछड़े के लहू में से कुछ
  rationale: 'מִן का यहाँ अंशवाचक अर्थ है: पूरा लहू नहीं, उसका कुछ भाग भीतर लाया जाता है। बलिदान-संबंधी संदर्भ में פַּר के लिए ‘बछड़ा’ प्रचलित और सहज हिंदी है।'
- source_word: אֶל אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के भीतर
  rationale: אֶל गंतव्य बताता है और इस अनुष्ठानिक संदर्भ में प्रवेश निहित है। אֹהֶל מוֹעֵד के लिए ‘मिलापवाला तंबू’ हिंदी बाइबलीय परंपरा में परिचित है और ‘तंबू’ मूल रूपक को बनाए रखता है।
theological_decisions:
- issue: הַמָּשִׁיחַ का याजकीय संदर्भ में अनुवाद
  choice: अभिषिक्त
  alternative: मसीह; पवित्र ठहराया हुआ
  rationale: यहाँ शब्द तेल से पद पर नियुक्त याजक का वर्णन करता है, किसी मसीहाई उपाधि का नहीं। ‘अभिषिक्त’ मूल शब्द और अनुष्ठानिक अर्थ दोनों को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘याजक,’ ‘लहू’ और ‘मिलापवाला तंबू’ जैसे परिचित बाइबलीय पद इस लैव्यव्यवस्था-संबंधी अनुष्ठानिक संदर्भ के लिए बनाए रखे गए हैं।
