base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/014.yaml
  text: You shall not uncover the nakedness of your father's brother; you shall not approach his wife[a]. She is your aunt.
translation:
  language: hi
  text: तुम अपने पिता के भाई की नग्नता प्रकट न करना; उसकी पत्नी के निकट न जाना[a]। वह तुम्हारी चाची है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में “निकट जाना”; इस प्रसंग में इस क्रिया का आशय यौन-संबंध बनाना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: का नंगापन
  rationale: लैव्यव्यवस्था 18 के स्थिर कानूनी मुहावरे ‘नंगापन उघाड़ना’ को बनाए रखा गया है। प्रसंग में इसका आशय यौन-संबंध है, पर ठोस हिब्रू अभिव्यक्ति को व्याख्यात्मक वाक्यांश से नहीं बदला गया।
- source_word: אֲחִי אָבִיךָ
  choice: अपने पिता के भाई
  rationale: यह संबंध-सूचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है; इससे पैतृक पक्ष का संबंध स्पष्ट रहता है।
- source_word: לֹא תְגַלֵּה
  choice: न उघाड़ना
  rationale: पिएल रूप यहाँ प्रचलित कानूनी मुहावरे का अंग है। ‘न उघाड़ना’ निषेधात्मक विधि-शैली और अध्याय की सूत्रबद्ध भाषा को बनाए रखता है।
- source_word: אֶל אִשְׁתּוֹ לֹא תִקְרָב
  choice: उसकी पत्नी के निकट न जाना
  rationale: קרב का मूल भाव ‘निकट जाना’ है। इस प्रसंग में इसका यौन आशय है, फिर भी मुख्य पाठ में हिब्रू की संयत अभिव्यक्ति सुरक्षित रखी गई है और पादटिप्पणी में उसका प्रसंगगत बल बताया गया है।
- source_word: דֹּדָתְךָ
  choice: तुम्हारी चाची
  rationale: यहाँ शब्द पिता के भाई की पत्नी को सूचित करता है। आधुनिक मानक हिन्दी में इस विशिष्ट संबंध के लिए ‘चाची’ स्वाभाविक और सटीक है।
- source_word: הִוא
  choice: वह ... है
  rationale: सर्वनाम को सीधे विधेयात्मक वाक्य के रूप में रखा गया है; ‘क्योंकि’ जोड़कर स्रोत से अधिक स्पष्ट कारण-संबंध नहीं बनाया गया।
theological_decisions:
- issue: निकट संबंधियों के विषय में यौन निषेध वाले हिब्रू मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘नंगापन ... उघाड़ना’ को बनाए रखना
  alternative: ‘यौन-संबंध न रखना’ जैसे स्पष्ट व्याख्यात्मक रूप से बदल देना
  rationale: मूल अध्याय में बार-बार आने वाला कानूनी सूत्र सुरक्षित रहता है, जबकि संदर्भ और पादटिप्पणी उसका यौन आशय स्पष्ट करते हैं।
- issue: रिश्ते की विशिष्ट पहचान
  choice: ‘वह तुम्हारी चाची है’
  alternative: ‘वह तुम्हारे पिता के भाई की पत्नी है’
  rationale: हिब्रू अंतिम खंड में सामान्य संबंध-सूचक संज्ञा का प्रयोग करता है; हिन्दी ‘चाची’ उसी विशिष्ट संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण कानूनी शैली अपनाई गई है। ‘नंगापन उघाड़ना’ अध्याय के स्थिर मुहावरे को सुरक्षित रखता है; ‘चाची’ भारतीय हिन्दी पाठक के लिए संबंध को सहज और विशिष्ट बनाता है।
