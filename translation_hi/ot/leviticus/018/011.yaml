source:
  edition: WLC
  text: עֶרְוַ֨ת בַּת אֵ֤שֶׁת אָבִ֨י/ךָ֙ מוֹלֶ֣דֶת אָבִ֔י/ךָ אֲחוֹתְ/ךָ֖ הִ֑וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/011.yaml
  text: You shall not uncover the nakedness of your father's wife's daughter[a], born to your father; she is your sister.
translation:
  language: hi
  text: अपने पिता की पत्नी की उस बेटी की नग्नता प्रकट न करना, जो तुम्हारे पिता से जन्मी है; वह तुम्हारी बहन[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम्हारी सौतेली बहन है।” इब्रानी में शब्दशः, “वह तुम्हारी बहन है”; इससे पहले का वर्णन संबंध को अधिक स्पष्ट करता है।
    reason: शाब्दिक विकल्प और नातेदारी-संबंध की व्याख्या
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָהּ
  choice: का तन / उसका तन
  rationale: लैव्यव्यवस्था 18 में यह यौन-संबंध संबंधी निषेध का स्थिर शिष्टोक्तिपूर्ण मुहावरा है। हिंदी में “तन उघाड़ना” कानूनी भाव, शालीनता और अध्यायगत संगति बनाए रखता है; “नग्नता उघाड़ना” अधिक शब्दशः होते हुए अस्वाभाविक है।
- source_word: בַּת
  choice: बेटी
  rationale: यह सीधा नातेदारी-सूचक शब्द है और हिंदी में स्वाभाविक रूप से रखा गया है।
- source_word: אֵשֶׁת אָבִיךָ
  choice: तुम्हारे पिता की पत्नी
  rationale: मूल का संबंधसूचक रूप सुरक्षित रखा गया है। “सौतेली माँ” कहने से ऐसा संबंध जोड़ दिया जाता जिसे इब्रानी पद स्वयं स्पष्ट रूप से नहीं कहता।
- source_word: מוֹלֶדֶת אָבִיךָ
  choice: तुम्हारे पिता से उत्पन्न हुई
  rationale: यह जैविक पितृवंश को व्यक्त करता है। यह रूप “तुम्हारे पिता से जन्मी” की अपेक्षा अधिक स्वाभाविक और स्पष्ट है, फिर भी मूल के वंश-संबंधी बल को बनाए रखता है।
- source_word: אֲחוֹתְךָ הִוא
  choice: वह तुम्हारी बहन है
  rationale: इब्रानी सीधे “बहन” कहता है, “सौतेली बहन” नहीं; इसलिए मुख्य पाठ में उसी व्यापक नातेदारी-सूचक शब्द को रखा गया है।
- source_word: לֹא תְגַלֶּה
  choice: न उघाड़ना
  rationale: यह अध्याय के मानक कानूनी निषेध का स्वाभाविक हिंदी रूप है और आदेशात्मक गंभीरता बनाए रखता है।
theological_decisions:
- issue: क्या मुख्य पाठ में संबंध को “सौतेली बहन” कहा जाए
  choice: मूल के अनुसार “वह तुम्हारी बहन है” रखा गया है और पूर्ववर्ती वर्णन से संबंध की प्रकृति स्पष्ट होने दी गई है।
  alternative: वह तुम्हारी सौतेली बहन है
  rationale: “सौतेली” पाठ को समझाने में सहायक हो सकता है, पर इब्रानी निष्कर्ष में केवल “बहन” है। अतिरिक्त विशिष्टीकरण को मुख्य पाठ में जोड़ने के बजाय टिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में शालीन, गंभीर और विधिक शैली रखी गई है। “तन उघाड़ना” यौन निषेध के शिष्टोक्तिपूर्ण भाव को स्वाभाविक हिंदी में व्यक्त करता है।
