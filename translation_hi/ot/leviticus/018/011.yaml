  verdict: revise
  source_fidelity: The draft correctly preserves the father’s wife, her daughter’s biological descent from the father, and the concluding identification as the addressee’s sister. However, “तन उघाड़ना” shifts the fixed Hebrew legal euphemism toward simply exposing a body and is not the clearest Hindi equivalent of the prohibition formula.
  naturalness: “का तन न उघाड़ना” is somewhat awkward in this kinship construction. “की नग्नता प्रकट न करना” is an established, dignified, and readily intelligible legal-scriptural expression in modern Hindi.
  terminology: “नग्नता प्रकट करना” consistently represents the Hebrew idiom גלה ערוה without anatomically over-specifying it. “जो तुम्हारे पिता से जन्मी है” naturally conveys the biological paternal relation. The note retains “सौतेली बहन” only as an alternative, while the main text correctly says “बहन.”
  issues:
  - severity: medium
    issue: “तन उघाड़ना” is an imprecise rendering of the Hebrew legal idiom.
    rationale: The expression can suggest the physical act of uncovering a person’s body rather than the established sexual-prohibition idiom “uncover nakedness.” “नग्नता प्रकट करना” preserves both the euphemism and the formal legal register.
  - severity: low
    issue: The sentence division weakens the source’s integrated kinship description.
    rationale: The Hebrew identifies the daughter as one born to the father within the object phrase. Using a relative clause in one sentence makes that relationship clearer and more natural in Hindi without adding interpretation.
