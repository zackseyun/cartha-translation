source:
  edition: WLC
  text: עֶרְוַ֥ת אִשָּׁ֛ה וּ/בִתָּ֖/הּ לֹ֣א תְגַלֵּ֑ה אֶֽת בַּת בְּנָ֞/הּ וְ/אֶת בַּת בִּתָּ֗/הּ לֹ֤א תִקַּח֙ לְ/גַלּ֣וֹת עֶרְוָתָ֔/הּ שַׁאֲרָ֥ה הֵ֖נָּה זִמָּ֥ה הִֽוא־־־־
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/017.yaml
  text: You shall not uncover the nakedness of a woman and her daughter[a]. You shall not take her son's daughter or her daughter's daughter to uncover her nakedness; they are close relatives[c][b]. It is depravity.
translation:
  language: hi
  text: किसी स्त्री और उसकी बेटी की नग्नता प्रकट न करना।[a] उसके बेटे की बेटी या उसकी बेटी की बेटी को उसकी नग्नता प्रकट करने के लिए न लेना;[b] वे उसके निकट रक्त-संबंधी हैं।[c] यह घोर अनैतिकता है।[d]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘नग्नता प्रकट करना’ निषिद्ध यौन-संबंध के लिए प्रयुक्त इब्रानी मुहावरा है।
    reason: cultural_note
  - marker: b
    text: यहाँ ‘उसकी’ पहली स्त्री की ओर संकेत कर सकता है; इसे उल्लिखित प्रत्येक वंशज के संदर्भ में भी समझा जा सकता है।
    reason: textual_ambiguity
  - marker: c
    text: 'शाब्दिक रूप से: ‘वे उसका मांस हैं’; अर्थात वे उसके निकट रक्त-संबंधी हैं।'
    reason: lexical_alternative
  - marker: d
    text: इसका अनुवाद ‘घोर दुष्कर्म’, ‘लज्जाजनक काम’ या ‘अत्यंत निंदनीय कृत्य’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת ... תְגַלֵּה
  choice: तन उघाड़ना
  rationale: यह लैव्यव्यवस्था में निषिद्ध यौन-संबंध के लिए प्रयुक्त इब्रानी कानूनी मुहावरा है। इसे बनाए रखने से मूल की शैली और इस अध्याय के भीतर शब्दगत संगति सुरक्षित रहती है; अर्थ फुटनोट में स्पष्ट किया गया है।
- source_word: אִשָּׁה
  choice: स्त्री
  rationale: इब्रानी संज्ञा का अर्थ ‘स्त्री’ या ‘पत्नी’ हो सकता है। यहाँ औपचारिक वैवाहिक संबंध निश्चित नहीं है, इसलिए व्यापक और तटस्थ ‘स्त्री’ उपयुक्त है।
- source_word: וּבִתָּהּ
  choice: और उसकी बेटी
  rationale: सर्वनामिक प्रत्यय पहले उल्लिखित स्त्री की ओर संकेत करता है।
- source_word: תִקַּח
  choice: न लेना
  rationale: मूल क्रिया का सामान्य अर्थ ‘लेना’ है और इस प्रसंग में विवाह या यौन-संबंध के लिए लेने का भाव हो सकता है। केवल ‘विवाह करना’ कहने से निषेध अनावश्यक रूप से संकरा हो जाता।
- source_word: בַּת בְּנָהּ
  choice: उसके बेटे की बेटी
  rationale: यह अनुवाद मूल की विशिष्ट पारिवारिक संरचना को सीधे बनाए रखता है।
- source_word: בַּת בִּתָּהּ
  choice: उसकी बेटी की बेटी
  rationale: यह मूल के विशिष्ट रिश्ते को बिना सामान्यीकृत किए स्पष्ट रूप से व्यक्त करता है।
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: उसका तन उघाड़ने के लिए
  rationale: एकवचन स्त्रीलिंग प्रत्यय की अस्पष्टता को विस्तार से हल किए बिना ‘उसका’ रखा गया है, जिससे मूल स्त्री अथवा प्रसंगानुसार उल्लिखित वंशज से संबंध की संभावनाएँ बनी रहती हैं।
- source_word: שַׁאֲרָה הֵנָּה
  choice: वे निकट रक्त-संबंधी हैं
  rationale: שְׁאֵר का मूल बिंब ‘मांस’ है, पर यहाँ इसका आशय निकट रक्त-संबंध है। आधुनिक हिन्दी में यह चयन कानूनी तर्क को स्वाभाविक और स्पष्ट बनाता है।
- source_word: זִמָּה
  choice: घोर दुष्कर्म
  rationale: यह शब्द एक निंदनीय, विशेषतः यौन रूप से घोर अनुचित कृत्य को दर्शाता है। ‘घोर दुष्कर्म’ उसकी गंभीर नैतिक निंदा को सहज आधुनिक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: ‘उसका तन उघाड़ने’ में एकवचन प्रत्यय का संदर्भ
  choice: अनुवाद में केवल ‘उसका’ रखकर मूल की संदर्भगत अस्पष्टता सुरक्षित रखी गई है।
  alternative: इसे पहली स्त्री के संदर्भ में स्पष्ट करना, जिससे उसकी पोती को लेना भी उसी स्त्री का तन उघाड़ना माना जाए; अथवा प्रत्येक वंशज के लिए वितरणात्मक रूप से समझना।
  rationale: इब्रानी प्रत्यय स्त्रीलिंग एकवचन है, पर अनुवाद में उसका स्पष्ट विस्तार करना पाठ की वास्तविक संदर्भगत जटिलता को समय से पहले सुलझा देता।
- issue: इस निकट-संबंध निषेध में תִקַּח का बल
  choice: व्यापक क्रिया ‘लेना’ को बनाए रखा गया है।
  alternative: ‘विवाह करना’ या ‘पत्नी बनाकर लेना।’
  rationale: निषेध केवल औपचारिक विवाह-अनुबंध तक सीमित नहीं है; आगे आने वाला यौन मुहावरा निषिद्ध उद्देश्य को बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और कानूनी निषेध के अनुरूप रखी गई है। ‘तन उघाड़ना’ मूल इब्रानी मुहावरे और अध्याय की पारस्परिक संगति को बचाता है, जबकि फुटनोट सामान्य पाठक के लिए उसका यौन आशय स्पष्ट करता है। रिश्तों के नाम औपचारिक किंतु सहज हिन्दी में सीधे व्यक्त किए गए हैं।
