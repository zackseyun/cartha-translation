  - marker: a
    text: या, “मार डाले जाएँगे” अथवा “समुदाय से निकाल दिए जाएँगे”; इब्रानी में “काट दिए जाएँगे” है, पर न्याय का ठीक तरीका नहीं बताया गया है।
    reason: alternative_reading
