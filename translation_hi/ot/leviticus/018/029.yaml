source:
  edition: WLC
  text: כִּ֚י כָּל אֲשֶׁ֣ר יַעֲשֶׂ֔ה מִ/כֹּ֥ל הַ/תּוֹעֵב֖וֹת הָ/אֵ֑לֶּה וְ/נִכְרְת֛וּ הַ/נְּפָשׁ֥וֹת הָ/עֹשֹׂ֖ת מִ/קֶּ֥רֶב עַמָּֽ/ם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/029.yaml
  text: For whoever does any of all these abominations[a], the persons who do them shall be cut off from among their people.
translation:
  language: hi
  text: क्योंकि जो कोई इन सब घृणित कामों में से कोई भी करता है, वे व्यक्ति जो ऐसे काम करते हैं, अपने लोगों के बीच से काट दिए जाएँगे।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “मार डाले जाएँगे” अथवा “समुदाय से निकाल दिए जाएँगे”; इब्रानी में “काट दिए जाएँगे” है, पर न्याय का ठीक तरीका नहीं बताया गया है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पद पिछले निषेधों के आधार पर उनका न्यायिक परिणाम बताता है; ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כָּל אֲשֶׁר
  choice: जो कोई
  rationale: यह अनिश्चित किंतु सर्वसमावेशी संबंधवाचक अभिव्यक्ति है; ‘जो कोई’ प्रत्येक दोषी व्यक्ति को दायरे में रखता है।
- source_word: יַעֲשֶׂה
  choice: काम करेगा
  rationale: मूल क्रिया का सामान्य अर्थ ‘करना’ है; इसे किसी अधिक विशिष्ट नैतिक या कानूनी क्रिया तक सीमित नहीं किया गया।
- source_word: מִכֹּל הַתּוֹעֵבוֹת הָאֵלֶּה
  choice: इन सब घिनौने कामों में से कोई भी काम
  rationale: यह चयनात्मक מִן और व्यापक כֹּל, दोनों को स्वाभाविक हिंदी में बनाए रखता है। संदर्भ में अमूर्त ‘घृणित वस्तुओं’ के बजाय निषिद्ध आचरण अभिप्रेत हैं।
- source_word: תּוֹעֵבוֹת
  choice: घिनौने कामों
  rationale: यह शब्द धार्मिक और नैतिक रूप से अत्यंत घृणित आचरण का संकेत देता है; ‘घिनौने काम’ आधुनिक पाठक के लिए स्पष्ट और गंभीर है।
- source_word: וְנִכְרְתוּ
  choice: काट दिए जाएँगे
  rationale: निफ़अल रूप की पारंपरिक न्यायिक वाचा-संबंधी छवि सुरक्षित रखी गई है; दंड का ठीक माध्यम मूल पाठ में निर्दिष्ट नहीं है।
- source_word: הַנְּפָשׁוֹת
  choice: वे व्यक्ति
  rationale: कानूनी संदर्भ में נֶפֶשׁ पूरे व्यक्ति को दर्शाता है, न कि शरीर से अलग ‘आत्मा’ को।
- source_word: הָעֹשֹׂת
  choice: जो ऐसे काम करते हैं
  rationale: कृदंत दोषी व्यक्तियों की पहचान इन्हीं कार्यों को करनेवालों के रूप में करता है।
- source_word: מִקֶּרֶב עַמָּם
  choice: अपने लोगों के बीच से
  rationale: यह वाचा-समुदाय के भीतर से हटाए जाने या न्याय पाने की सामुदायिक अभिव्यक्ति को सुरक्षित रखता है।
theological_decisions:
- issue: וְנִכְרְתוּ ... מִקֶּרֶב עַמָּם में दंड का आशय
  choice: अपने लोगों के बीच से काट दिए जाएँगे
  alternative: मार डाले जाएँगे; समुदाय से निकाल दिए जाएँगे
  rationale: इब्रानी सूत्र स्वयं यह स्पष्ट नहीं करता कि दंड प्रत्यक्ष ईश्वरीय न्याय, मनुष्यों द्वारा दिया गया मृत्युदंड, या समुदाय से निष्कासन है। मुख्य पाठ में ‘काट दिए जाएँगे’ रखकर यह वास्तविक अस्पष्टता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गंभीर और विधिक स्वर के साथ रखी गई है। ‘घिनौने काम’ सामान्य पाठक के लिए स्पष्ट है, जबकि ‘काट दिए जाएँगे’ मूल इब्रानी की जानबूझकर अनिर्दिष्ट दंड-सूचक अभिव्यक्ति को बनाए रखता है।
