id: LEV.18.3
reference: Leviticus 18:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כְּ/מַעֲשֵׂ֧ה אֶֽרֶץ מִצְרַ֛יִם אֲשֶׁ֥ר יְשַׁבְתֶּם בָּ֖/הּ לֹ֣א תַעֲשׂ֑וּ וּ/כְ/מַעֲשֵׂ֣ה אֶֽרֶץ כְּנַ֡עַן אֲשֶׁ֣ר אֲנִי֩ מֵבִ֨יא אֶתְ/כֶ֥ם שָׁ֨מָּ/ה֙ לֹ֣א תַעֲשׂ֔וּ וּ/בְ/חֻקֹּתֵי/הֶ֖ם לֹ֥א תֵלֵֽכוּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/003.yaml
  text: You shall not do as they do in the land of Egypt[a], where you lived, and you shall not do as they do in the land of Canaan, where I am bringing you[b]. You shall not walk in their statutes.
translation:
  language: hi
  text: जिस प्रकार के काम मिस्र देश में होते हैं[a], जहाँ तुम रहते थे, उस प्रकार के काम तुम न करना; और जिस प्रकार के काम कनान देश में होते हैं, जहाँ मैं तुम्हें ले जा रहा हूँ, उस प्रकार के काम भी तुम न करना। उनकी विधियों पर न चलना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “मिस्र देश के कामों के अनुसार… और कनान देश के कामों के अनुसार।” इब्रानी मुहावरा उन देशों में प्रचलित कामों या व्यवहारों की बात करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּמַעֲשֵׂה
  choice: जिस प्रकार के काम ... होते हैं
  rationale: यह מַעֲשֶׂה के ठोस अर्थ ‘काम/व्यवहार’ और כְּ की तुलनात्मक शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है। ‘देश के काम’ की इब्रानी अभिव्यक्ति वहाँ के लोगों के प्रचलित व्यवहार को सूचित करती है।
- source_word: אֶרֶץ מִצְרַיִם / אֶרֶץ כְּנַעַן
  choice: मिस्र देश / कनान देश
  rationale: दोनों भौगोलिक नामों के साथ ‘देश’ रखकर इब्रानी संरचना और पद का समानांतर विन्यास सुरक्षित रखा गया है।
- source_word: אֲשֶׁר יְשַׁבְתֶּם בָּהּ
  choice: जहाँ तुम रहते थे
  rationale: यह सम्बन्धवाचक उपवाक्य और पूर्ण हो चुके पूर्व निवास को सरल आधुनिक हिन्दी में ठीक प्रकार व्यक्त करता है।
- source_word: לֹא תַעֲשׂוּ
  choice: तुम न करना
  rationale: निषेधात्मक कानूनी निर्देश को स्पष्ट, गरिमापूर्ण और सीधे रूप में प्रस्तुत करता है।
- source_word: אֲשֶׁר אֲנִי מֵבִיא אֶתְכֶם שָׁמָּה
  choice: जहाँ मैं तुम्हें ले जा रहा हूँ
  rationale: מֵבִיא कृदन्त के वर्तमान और आसन्न भाव तथा परमेश्वर द्वारा गन्तव्य की ओर ले जाए जाने—दोनों को बनाए रखता है।
- source_word: וּבְחֻקֹּתֵיהֶם
  choice: उनकी विधियों पर
  rationale: חֻקּוֹת में निर्धारित नियमों और स्थापित रीति-व्यवहार दोनों का भाव हो सकता है। ‘विधियाँ’ कानूनी/नियामक बल को बनाए रखता है और अगले पद में प्रभु की विधियों के साथ विरोध को स्पष्ट करता है।
- source_word: לֹא תֵלֵכוּ
  choice: न चलना
  rationale: ‘चलना’ आचरण के लिए प्रयुक्त मूल रूपक को सुरक्षित रखता है; ‘पर चलना’ आधुनिक हिन्दी में किसी नियम या मार्ग का अनुसरण करने का स्वाभाविक प्रयोग भी है।
theological_decisions:
- issue: क्या ‘देश के काम’ को मिट्टी या भूभाग का काम समझे जाने से बचाने के लिए वहाँ के लोगों को अर्थ में स्पष्ट किया जाए
  choice: ‘जिस प्रकार के काम ... देश में होते हैं’
  alternative: ‘मिस्र/कनान देश के कामों के अनुसार’
  rationale: चुना हुआ पाठ इब्रानी मुहावरे के व्यवहारगत आशय को स्पष्ट करता है, पर लोगों या किसी विशेष समूह को मूल पाठ से अधिक स्पष्ट रूप से जोड़ता नहीं।
- issue: חֻקֹּתֵיהֶם को ‘रीति-रिवाज’ अथवा अधिक नियमपरक शब्द से अनूदित करना
  choice: उनकी विधियों पर
  alternative: उनकी रीति-रिवाजों के अनुसार
  rationale: ‘विधियाँ’ बन्धनकारी मानदण्डों का भाव और निकटवर्ती प्रसंग में प्रभु की विधियों के साथ विरोध सुरक्षित रखता है; ‘रीति-रिवाज’ सम्भव है, पर केवल सामाजिक परम्परा का हल्का अर्थ दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, प्रत्यक्ष कानूनी निषेध रखा गया है। ‘तुम’ बहुवचन समुदाय को सम्बोधित करता है। समानांतर वाक्यरचना और ‘चलना’ का आचरण-सूचक बाइबलीय रूपक सुरक्षित हैं।
