source:
  edition: WLC
  text: וְ/אֶל אֵ֨שֶׁת֙ עֲמִֽיתְ/ךָ֔ לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/זָ֑רַע לְ/טָמְאָה בָֽ/הּ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/020.yaml
  text: You shall not have sexual relations[a] with your neighbor’s wife and so defile yourself with her.
translation:
  language: hi
  text: तुम अपने पड़ोसी की पत्नी के साथ यौन-संबंध न रखना[a] और इस प्रकार उसके साथ अपने को अशुद्ध न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से, ‘तुम अपने पड़ोसी की पत्नी के साथ अपना वीर्य बीज के लिए न देना।’
    reason: source_idiom
lexical_decisions:
- source_word: אֵשֶׁת עֲמִיתְךָ
  choice: अपने पड़ोसी की पत्नी
  rationale: यहाँ עָמִית समुदाय के किसी दूसरे सदस्य या संगी को दर्शाता है। आधुनिक हिन्दी में ‘पड़ोसी’ इस कानूनी संबंध को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ לְזָרַע
  choice: यौन-संबंध न रखना
  rationale: इब्रानी पदबंध वीर्य को बीज के रूप में देने की शारीरिक छवि द्वारा संभोग को व्यक्त करता है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और मूल छवि पादटिप्पणी में रखी गई है।
- source_word: לְטָמְאָה בָהּ
  choice: जिससे तुम उसके साथ अशुद्ध हो जाओ
  rationale: लְטָמְאָה परिणाम या उद्देश्य सूचित करता है, और בָהּ उस स्त्री के साथ अथवा उसके द्वारा अशुद्ध होने का भाव रख सकता है। ‘उसके साथ’ संबंध को बनाए रखते हुए अनावश्यक रूप से केवल अनुष्ठानिक अशुद्धता तक अर्थ को सीमित नहीं करता।
theological_decisions:
- issue: निषेध का स्वरूप और अशुद्धता की भाषा
  choice: पड़ोसी की पत्नी के साथ संभोग का निषेध, जिसके परिणामस्वरूप संबोधित पुरुष अशुद्ध होता है।
  alternative: मूल वीर्य-संबंधी मुहावरे को मुख्य पाठ में शाब्दिक रूप से रखना, या अशुद्धता को विशेष रूप से ‘अनुष्ठानिक अशुद्धता’ कहना।
  rationale: इब्रानी मुहावरा संभोग को दर्शाता है, जबकि अंतिम पदबंध अशुद्ध होने का परिणाम बताता है। स्पष्ट हिन्दी अर्थ को मुख्य पाठ में और मूल शारीरिक छवि को पादटिप्पणी में रखना दोनों स्तरों के प्रति निष्ठावान है; ‘अनुष्ठानिक’ जोड़ना मूल से अधिक विशिष्ट होता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण कानूनी शैली अपनाई गई है। ‘यौन-संबंध’ सामान्य पाठक के लिए बोधगम्य है, जबकि ‘अशुद्ध’ लैव्यव्यवस्था की प्रमुख धार्मिक-नैतिक शब्दावली को बनाए रखता है।
