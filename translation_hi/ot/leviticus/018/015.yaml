  yaml_path: translation/ot/leviticus/018/015.yaml
  text: You shall not uncover the nakedness of your daughter-in-law[a]; she is your son's wife; you shall not uncover her nakedness.
translation:
  language: hi
  text: तू अपनी बहू की नग्नता प्रकट न करना[a]; वह तेरे बेटे की पत्नी है; तू उसकी नग्नता प्रकट न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में, “नग्नता प्रकट करना”; लैव्यव्यवस्था में निषिद्ध यौन संबंधों के लिए बार-बार प्रयुक्त एक विधिक शिष्टोक्ति।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: का तन
  rationale: यहाँ עֶרְוָה ‘नंगापन/नग्नता’ को सूचित करता है और גלה के साथ लैंगिक संबंधों के लिए प्रयुक्त विधिक शिष्टोक्ति बनाता है। ‘तन उघाड़ना’ हिंदी में मूल बिंब और शिष्टोक्तिपूर्ण आशय दोनों को बनाए रखता है।
- source_word: כַּלָּתְךָ
  choice: अपनी बहू
  rationale: यह 2 पुल्लिंग एकवचन प्रत्यय सहित संबोधनकर्ता की बहू को सीधे सूचित करता है; ‘बहू’ स्वाभाविक आधुनिक हिंदी संबंध-संज्ञा है।
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: न उघाड़ना
  rationale: गला का पिएल रूप עֶרְוָה के साथ अध्याय में बार-बार आने वाला निषेध-सूत्र है। ‘उघाड़ना’ मूल क्रिया और औपचारिक विधिक शिष्टोक्ति को सुरक्षित रखता है।
- source_word: אֵשֶׁת בִּנְךָ
  choice: तेरे बेटे की पत्नी
  rationale: यह व्याख्यात्मक समानाधिकरण बहू के संबंध को स्पष्ट करता है और हिब्रू के संबंधसूचक अर्थ को स्वाभाविक हिंदी में रखता है।
- source_word: הִוא
  choice: वह ... है
  rationale: सर्वनाम पहले कही गई स्त्री की पहचान पर बल देते हुए व्याख्यात्मक उपवाक्य बनाता है।
- source_word: עֶרְוָתָהּ
  choice: उसका तन
  rationale: पहले वाक्यांश की पुनरावृत्ति मूल की विधिक शैली और अध्याय के आवर्ती सूत्र को बनाए रखती है।
theological_decisions:
- issue: लैंगिक निषेध के संदर्भ में ‘नंगापन उघाड़ना’ शिष्टोक्ति का अनुवाद
  choice: मूल बिंब को ‘तन उघाड़ना’ के रूप में बनाए रखना
  alternative: उसके साथ यौन संबंध न रखना
  rationale: हिब्रू में यह लैव्यव्यवस्था 18 भर में स्थिर विधिक शिष्टोक्ति है। इसे स्पष्ट यौन परिभाषा से बदलने के बजाय मूल की साहित्यिक और विधिक संगति रखी गई है; पादटिप्पणी इसका आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिंदी। हिब्रू के एकवचन पुरुष संबोधन और विधिक आज्ञा-शैली को ‘तू...न उघाड़ना’ से रखा गया है; ‘तन’ मूल शिष्टोक्ति को कठोर या अत्यधिक स्पष्ट बनाए बिना संप्रेषित करता है।
