  text: וּ/בְ/כָל בְּהֵמָ֛ה לֹא תִתֵּ֥ן שְׁכָבְתְּ/ךָ֖ לְ/טָמְאָה בָ֑/הּ וְ/אִשָּׁ֗ה לֹֽא תַעֲמֹ֞ד לִ/פְנֵ֧י בְהֵמָ֛ה לְ/רִבְעָ֖/הּ תֶּ֥בֶל הֽוּא־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/023.yaml
  text: And with any animal you shall not give your lying[a] to become unclean with it, and a woman shall not stand before an animal to mate with it[c][b]; it is a perversion.
translation:
  language: hi
  text: तुम किसी भी पशु के साथ सहवास करके अपने को अशुद्ध न करो[a]। कोई स्त्री भी किसी पशु के सामने इस उद्देश्य से खड़ी न हो कि वह पशु उसके साथ मैथुन करे[b]। यह विकृति है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक: “अपना शयन देना”; इसका आशय पशु के साथ यौन-संबंध से है। “अपने को अशुद्ध न करो” का अनुवाद “उससे अशुद्ध होने के लिए” भी किया जा सकता है।'
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ इस प्रसंग में पशु द्वारा चढ़ना या उसके साथ यौन-संबंध करना है; अनुवाद हो सकता है, “कि वह उसे चढ़े।”
    reason: lexical_alternative
  - marker: c
    text: या “यह उचित व्यवस्था का उल्लंघन है”; इब्रानी शब्द का अनुवाद “घोर अनुचित काम” भी किया जाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבְכָל בְּהֵמָה
  choice: किसी भी पशु के साथ
  rationale: בְּהֵמָה सामान्यतः पशु, विशेषकर चौपाए या पालतू पशु, को दर्शाता है; ‘किसी भी पशु’ כָּל की व्यापकता को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: לֹא תִתֵּן שְׁכָבְתְּךָ
  choice: सहवास करके
  rationale: शाब्दिक मुहावरा ‘अपना शयन न देना’ आधुनिक हिन्दी में अस्पष्ट और अस्वाभाविक होगा। प्रसंग में שְׁכָבְתְּךָ यौन शयन/सहवास को सूचित करता है, इसलिए निषेध को स्पष्ट और मर्यादित भाषा में व्यक्त किया गया है।
- source_word: לְטָמְאָה בָהּ
  choice: अपने को अशुद्ध न करना
  rationale: यह अनन्त क्रिया उद्देश्य या परिणाम का भाव रखती है। ‘अशुद्ध’ बाइबलीय नैतिक-धार्मिक अशुद्धता को बनाए रखता है, बिना उसे केवल अनुष्ठानिक अशुद्धता तक सीमित किए।
- source_word: וְאִשָּׁה
  choice: कोई स्त्री भी
  rationale: אִשָּׁה यहाँ सामान्य अर्थ में ‘स्त्री’ है, ‘पत्नी’ नहीं। ‘भी’ समानांतर निषेध को सहज हिन्दी में जोड़ता है।
- source_word: לֹא תַעֲמֹד לִפְנֵי בְהֵמָה
  choice: किसी पशु के सामने इस उद्देश्य से खड़ी न हो
  rationale: ‘सामने खड़ी होना’ मूल चित्र को बनाए रखता है; ‘इस उद्देश्य से’ अगले उद्देश्यवाचक पद के साथ इसके यौन आशय को स्पष्ट करता है।
- source_word: לְרִבְעָהּ
  choice: कि वह पशु उसके साथ मैथुन करे
  rationale: רבע इस प्रसंग में पशु द्वारा चढ़ने या यौन-संबंध बनाने को दर्शाता है। स्त्रीलिंग कर्म-प्रत्यय बताता है कि स्त्री क्रिया की भोक्ता है; स्पष्ट संज्ञा ‘वह पशु’ हिन्दी में सर्वनामगत भ्रम दूर करती है।
- source_word: תֶּבֶל
  choice: विकृति
  rationale: תֶּבֶל उचित व्यवस्था के उल्लंघन, विशेषकर यौन क्षेत्र में, को दर्शाता है। ‘विकृति’ आधुनिक हिन्दी में इस नैतिक और अव्यवस्थाकारी भाव को ‘गड़बड़ी’ या ‘भ्रम’ से अधिक ठीक व्यक्त करता है।
- source_word: הוּא
  choice: यह ... है
  rationale: ‘यह’ अभी बताए गए निषिद्ध आचरण की ओर संकेत करता है और हिन्दी में स्वाभाविक विधेय-वाक्य बनाता है।
theological_decisions:
- issue: अशुद्धता की भाषा को केवल अनुष्ठानिक या केवल सामान्य नैतिक भाषा में सीमित करना
  choice: अपने को अशुद्ध न करना
  alternative: उससे अपवित्र न होना
  rationale: मूल क्रिया טמא की बाइबलीय अशुद्धता की श्रेणी को रखा गया है। यह अनुष्ठानिक और नैतिक आयामों के बीच मूल पाठ के तनाव को समय से पहले समाप्त नहीं करता।
- issue: תֶּבֶל का नैतिक मूल्यांकन
  choice: विकृति
  alternative: व्यवस्था का उल्लंघन / घोर अनुचित काम
  rationale: ‘विकृति’ निषिद्ध कृत्य को उचित व्यवस्था से विपथन बताती है, जबकि पारंपरिक ‘भ्रम’ आधुनिक पाठक को मानसिक असमंजस का गलत अर्थ दे सकता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और मर्यादित रखी गई है। ‘सहवास’ और ‘मैथुन’ यौन आशय को बिना अश्लीलता के स्पष्ट करते हैं। पहले उपवाक्य में पुल्लिंग एकवचन आज्ञार्थ का हिन्दी रूप प्रसंगानुसार सामान्य निषेध के रूप में है; दूसरे में स्त्री का स्पष्ट उल्लेख मूल पाठ के लिंग-विशिष्ट विन्यास को सुरक्षित रखता है।
