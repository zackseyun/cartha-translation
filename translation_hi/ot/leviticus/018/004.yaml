  yaml_path: translation/ot/leviticus/018/004.yaml
  text: You shall do my judgments[a], and you shall keep my statutes, to walk in them. I am Yahweh your God.
translation:
  language: hi
  text: मेरे न्याय-विधानों को मानो और मेरी विधियों का पालन करो, ताकि तुम उनके अनुसार चलो[a]। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उनमें चलो”; यह इब्रानी मुहावरा परमेश्वर की आज्ञाओं के अनुसार अपना जीवन और आचरण ढालने को दर्शाता है। इसे “उनके अनुसार जीवन बिताना” भी कहा जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधान
  rationale: מִשְׁפָּט का कानूनी अर्थ न्याय-निर्णय, नियम या विधान हो सकता है। ‘न्याय-विधान’ उसके न्यायिक बल को बनाए रखता है और חֻקֹּתַי से उसका भेद भी स्पष्ट करता है।
- source_word: תַּעֲשׂוּ
  choice: पालन करो
  rationale: עשה का मूल अर्थ ‘करना’ है; पर नियमों के संदर्भ में आधुनिक हिंदी में ‘पालन करना’ स्वाभाविक ढंग से उन्हें व्यवहार में लाने का अर्थ देता है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियाँ
  rationale: חֻקָּה निर्धारित विधि या विधान को दर्शाता है। ‘विधियाँ’ संक्षिप्त, गरिमापूर्ण और कानूनी संदर्भ के अनुकूल है।
- source_word: תִּשְׁמְרוּ
  choice: मानो
  rationale: שׁמר का मूल भाव रखना, रक्षा करना और सावधानी से पालन करना है। विधियों के साथ ‘मानो’ सहज हिंदी है और आज्ञापालन का भाव बनाए रखता है।
- source_word: לָלֶכֶת בָּהֶם
  choice: उनके अनुसार चलते रहो
  rationale: הלך ב जीवन के आचरण को दर्शाने वाला मुहावरा है। ‘चलते रहो’ इब्रानी के चलने वाले रूपक को बचाता है, जबकि ‘उनके अनुसार’ हिंदी में उसका आशय स्वाभाविक बनाता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार-अक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित लिप्यंतरण ‘याहवे’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: द्वितीय पुरुष बहुवचन प्रत्यय सहित इस पद का सीधा अर्थ ‘तुम्हारा परमेश्वर’ है और यह वाचा के संबंध को व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है; ‘याहवे’ उसे किसी उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है।
- issue: לָלֶכֶת בָּהֶם का अर्थ
  choice: उनके अनुसार चलते रहो
  alternative: उनके अनुसार जीवन बिताओ
  rationale: मुख्य पाठ में ‘चलना’ का इब्रानी रूपक रखा गया है और उसे केवल ‘जीना’ बनाकर उसकी संभावित अर्थ-व्याप्ति को संकुचित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में बहुवचन संबोधन ‘तुम’ और सीधे आज्ञार्थक रूप रखे गए हैं। भाषा सहज किंतु गरिमापूर्ण है; समानार्थी कानूनी पदों को पूरी तरह एक ही शब्द में समेटने से बचा गया है।
