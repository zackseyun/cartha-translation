    reason: वַתִּטְמָא के लिए ‘अशुद्ध हो गई’ के साथ ‘दूषित हो गई’ एक वैध शाब्दिक विकल्प है; यह मूल के अशुद्ध/अपवित्र होने के अर्थ को बनाए रखता है।
  revision_rationale: Revision replaces the potentially political “देश” with “भूमि,” uses standard spaced modern Hindi, and adds the lexical-alternative footnote. The causal link, the collective reference to the prior inhabitants, the force of the abhorrent acts, and the land’s becoming impure are preserved.
