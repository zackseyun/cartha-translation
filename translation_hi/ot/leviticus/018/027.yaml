id: LEV.18.27
reference: Leviticus 18:27
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּ֚י אֶת כָּל הַ/תּוֹעֵבֹ֣ת הָ/אֵ֔ל עָשׂ֥וּ אַנְשֵֽׁי הָ/אָ֖רֶץ אֲשֶׁ֣ר לִ/פְנֵי/כֶ֑ם וַ/תִּטְמָ֖א הָ/אָֽרֶץ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/027.yaml
  text: For the men of the land who were before you did all these abominations[a], and the land became unclean.
translation:
  language: hi
  text: क्योंकि तुमसे पहले उस भूमि में रहने वाले लोगों ने ये सभी घृणित काम किए, और भूमि अशुद्ध हो गई[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भूमि दूषित हो गई।”
    reason: वַתִּטְמָא के लिए ‘अशुद्ध हो गई’ के साथ ‘दूषित हो गई’ एक वैध शाब्दिक विकल्प है; यह मूल के अशुद्ध/अपवित्र होने के अर्थ को बनाए रखता है।
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध और चेतावनी का कारण बताता है; हिंदी में ‘क्योंकि’ इसके व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל הַתּוֹעֵבֹת הָאֵל
  choice: ये सब घिनौने काम
  rationale: ‘घिनौने’ תּוֹעֵבָה की तीव्र नैतिक और धार्मिक घृणितता को सहज आधुनिक हिंदी में रखता है; ‘काम’ उन कृत्यों की ओर संकेत स्पष्ट करता है।
- source_word: עָשׂוּ
  choice: किए
  rationale: सामान्य क्रिया עשה का सीधा और स्वाभाविक हिंदी रूप है।
- source_word: אַנְשֵׁי הָאָרֶץ אֲשֶׁר לִפְנֵיכֶם
  choice: तुमसे पहले इस देश में रहनेवाले लोगों
  rationale: यह पदबंध पूर्व निवासियों को सामूहिक रूप से दर्शाता है। हिंदी में ‘लोग’ सामूहिक अर्थ को स्वाभाविक ढंग से देता है और केवल पुरुषों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
- source_word: וַתִּטְמָא
  choice: अशुद्ध हो गया
  rationale: यह भूमि के अशुद्ध हो जाने की परिणति को व्यक्त करता है और अनुष्ठानिक तथा नैतिक दोनों संभावित आयामों को खुला रखता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: संदर्भ में पूरी पृथ्वी नहीं, इस्राएल से पहले आबाद विशिष्ट भूभाग अभिप्रेत है; आधुनिक हिंदी में ‘देश’ इस भौगोलिक-सामुदायिक अर्थ को सहजता से देता है।
theological_decisions:
- issue: भूमि की अशुद्धता का स्वरूप
  choice: देश अशुद्ध हो गया
  alternative: देश दूषित हो गया
  rationale: हिब्रू मानवीय पाप और भूमि की अशुद्धता के बीच संबंध रखता है। ‘अशुद्ध’ इस संबंध को केवल अनुष्ठानिक या केवल रूपकात्मक अर्थ तक सीमित किए बिना सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘रहनेवाले लोगों’ से पूर्व निवासियों का सामूहिक अर्थ स्वाभाविक हिंदी में व्यक्त होता है; ‘घिनौने काम’ मूल की प्रबल नैतिक-धार्मिक भाषा बनाए रखता है।
