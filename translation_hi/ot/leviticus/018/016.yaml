base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/016.yaml
  text: You shall not uncover the nakedness of your brother’s wife[a]; it is your brother’s nakedness.
translation:
  language: hi
  text: तुम अपने भाई की पत्नी की नग्नता न उघाड़ना[a]; वह तुम्हारे भाई की नग्नता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप में: “तुम अपने भाई की पत्नी के साथ यौन-संबंध न रखना।” इब्रानी में शाब्दिक मुहावरा “नग्नता उघाड़ना” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: का नंगापन
  rationale: लैव्यव्यवस्था 18 में यह शब्द גלה ערוה के साथ निषिद्ध यौन-संबंध के लिए प्रयुक्त विधिक शिष्टोक्ति है। ‘नंगापन उघाड़ना’ मूल रूपक और पद की पुनरावृत्ति को बनाए रखता है।
- source_word: אֵשֶׁת אָחִיךָ
  choice: अपने भाई की पत्नी
  rationale: समासिक प्रयोग में אֵשֶׁת का अर्थ यहाँ स्पष्ट रूप से ‘पत्नी’ है; ‘स्त्री’ इस वैवाहिक और विधिक संबंध को पर्याप्त स्पष्टता से व्यक्त नहीं करेगा।
- source_word: לֹא תְגַלֵּה
  choice: न उघाड़ना
  rationale: לֹא के साथ अपूर्ण क्रिया विधिक निषेध व्यक्त करती है। हिंदी में ‘न उघाड़ना’ आज्ञार्थक व्यवस्था-शैली को स्वाभाविक और स्पष्ट रूप में प्रस्तुत करता है।
- source_word: עֶרְוַת אָחִיךָ הִוא
  choice: वह तुम्हारे भाई का नंगापन है
  rationale: यह अनुवाद मूल की शब्द-पुनरावृत्ति और निषेध के दिए गए आधार को सुरक्षित रखता है; ‘वह’ का संदर्भ भाई की पत्नी से है।
theological_decisions:
- issue: क्या इब्रानी विधिक शिष्टोक्ति को सीधे ‘यौन-संबंध रखना’ कहकर स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘नंगापन उघाड़ना’ की शिष्टोक्ति बनाए रखी गई
  alternative: तुम अपने भाई की पत्नी के साथ यौन-संबंध न रखना
  rationale: मूल पाठ प्रत्यक्ष अभिव्यक्ति के बजाय स्थापित विधिक शिष्टोक्ति का प्रयोग करता है। उसे बनाए रखने से लैव्यव्यवस्था 18 की शब्दावली, साहित्यिक स्वर और वास्तविक अभिव्यक्ति सुरक्षित रहती है; स्पष्ट अर्थ पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण विधिक शैली रखी गई है। ‘नंगापन उघाड़ना’ कुछ हद तक असामान्य होते हुए भी मूल इब्रानी शिष्टोक्ति और पूरे अध्याय की प्रमुख शब्दावली को सुरक्षित रखता है; पादटिप्पणी सामान्य पाठक के लिए उसका आशय स्पष्ट करती है।
