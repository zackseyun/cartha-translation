  text: וְ/אֶל אִשָּׁ֖ה בְּ/נִדַּ֣ת טֻמְאָתָ֑/הּ לֹ֣א תִקְרַ֔ב לְ/גַלּ֖וֹת עֶרְוָתָֽ/הּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/019.yaml
  text: You shall not approach a woman during her menstrual uncleanness to uncover her nakedness[a].
translation:
  language: hi
  text: तुम किसी स्त्री के पास, जब वह अपनी मासिक अशुद्धता की अवस्था में हो, उसकी नग्नता प्रकट करने के लिए न जाना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अथवा, “उसके मासिक धर्म से जुड़ी अशुद्धता के समय।” इब्रानी में अनुष्ठानिक शुद्धता-अशुद्धता की भाषा प्रयुक्त हुई है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֶל אִשָּׁה ... לֹא תִקְרַב
  choice: किसी स्त्री ... उसके पास न जाना
  rationale: אִשָּׁה यहाँ अनिश्चित और सामान्य अर्थ में है, इसलिए ‘किसी स्त्री’ स्वाभाविक है। אֶל के साथ קָרַב का अर्थ ‘पास जाना’ है; निषेधात्मक कानूनी शैली को हिंदी में आज्ञार्थक ‘न जाना’ से स्पष्ट और गरिमापूर्ण ढंग से व्यक्त किया गया है।
- source_word: בְּ/נִדַּת טֻמְאָתָהּ
  choice: उसकी मासिक अशुद्धता के समय
  rationale: नִדָּה मासिक धर्म से जुड़ी अवस्था और טֻמְאָה लैव्यव्यवस्था की अनुष्ठानिक शुद्धता-अशुद्धता की भाषा है। ‘मासिक अशुद्धता’ मूल श्रेणी को बनाए रखती है और इसे केवल चिकित्सकीय स्थिति नहीं बनाती।
- source_word: לְ/גַלּוֹת עֶרְוָתָהּ
  choice: उसकी नग्नता उघाड़ने के लिए
  rationale: ‘नग्नता उघाड़ना’ इब्रानी कानूनी मुहावरे और उसके संयत यौन संकेत को सुरक्षित रखता है; इसे मुख्य पाठ में अधिक स्पष्ट बनाना मूल की व्यंजना का अति-निर्णय होता।
theological_decisions:
- issue: अशुद्धता की भाषा को अनुष्ठानिक श्रेणी के रूप में रखना या केवल जैविक/चिकित्सकीय अवस्था बनाना
  choice: मासिक अशुद्धता
  alternative: मासिक धर्म के समय
  rationale: טֻמְאָה लैव्यव्यवस्था में अनुष्ठानिक अशुद्धता का पद है। चुना हुआ अनुवाद मूल की धार्मिक-सांस्कृतिक श्रेणी को सुरक्षित रखता है, बिना आधुनिक नैतिक या चिकित्सकीय निर्णय जोड़े।
translation_notes:
  register: आधुनिक मानक हिंदी की संक्षिप्त, गरिमापूर्ण कानूनी शैली। ‘पास न जाना’ सामान्य पाठक के लिए स्वाभाविक है, जबकि ‘नग्नता उघाड़ना’ अध्याय के मूल संयत मुहावरे को बनाए रखता है।
