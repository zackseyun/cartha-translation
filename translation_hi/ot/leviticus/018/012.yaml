source:
  edition: WLC
  text: עֶרְוַ֥ת אֲחוֹת אָבִ֖י/ךָ לֹ֣א תְגַלֵּ֑ה שְׁאֵ֥ר אָבִ֖י/ךָ הִֽוא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/012.yaml
  text: You shall not uncover the nakedness of your father's sister[b][a]; she is your father's flesh.
translation:
  language: hi
  text: तुम अपने पिता की बहन की नग्नता प्रकट न करना[a]; वह तुम्हारे पिता की निकट रक्त-संबंधी है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में “नग्नता प्रकट करना” लैव्यव्यवस्था 18 का एक कानूनी मुहावरा है, जो निषिद्ध यौन अनावरण या यौन संबंध को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी का अधिक शाब्दिक रूप: “वह तुम्हारे पिता का मांस है”; अर्थात, वह उनकी निकट रक्त-संबंधी है।'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: तन न उघाड़ना
  rationale: यह लैव्यव्यवस्था 18 का स्थिर कानूनी मुहावरा है। ‘तन न उघाड़ना’ मूल बिंब और अध्याय की सूत्रात्मक भाषा को बनाए रखता है, जबकि इसका आशय निषिद्ध यौन संबंध से है।
- source_word: אֲחוֹת אָבִיךָ
  choice: अपने पिता की बहन
  rationale: यह मूल संबंध-सूचक अभिव्यक्ति को सीधे और स्वाभाविक आधुनिक हिन्दी में रखता है; ‘फूफी’ अधिक संक्षिप्त है, पर स्रोत की संरचना को कम प्रत्यक्ष रूप से दिखाता है।
- source_word: שְׁאֵר אָבִיךָ
  choice: तुम्हारे पिता की निकट रक्त-संबंधी
  rationale: שְׁאֵר निकट देहगत या रक्त-संबंध को दर्शाता है। हिन्दी में यह चयन कानूनी रिश्तेदारी का आशय स्पष्ट करता है; शाब्दिक ‘मांस’ अस्वाभाविक और संभावित रूप से भ्रामक होता।
- source_word: הִוא
  choice: वह ... है
  rationale: स्त्रीलिंग सर्वनाम उस स्त्री को निषिद्ध निकट संबंध की सदस्य के रूप में पहचानता है; हिन्दी में साधारण ‘वह ... है’ स्वाभाविक है।
theological_decisions:
- issue: निषिद्ध यौन संबंध के कानूनी मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘तन न उघाड़ना’ सूत्र को बनाए रखा गया।
  alternative: ‘उसके साथ यौन संबंध न रखना’
  rationale: गतिशील विकल्प आशय स्पष्ट करता है, पर इब्रानी अभिव्यक्ति से अधिक खुलकर व्याख्या करता है। मुख्य पाठ मूल कानूनी बिंब और अध्यायगत संगति को सुरक्षित रखता है, और पादटिप्पणी उसका आशय बताती है।
- issue: שְׁאֵר की देहगत और रिश्तेदारी-संबंधी अर्थ-छाया
  choice: मुख्य पाठ में ‘निकट रक्त-संबंधी’
  alternative: ‘तुम्हारे पिता का मांस’ अथवा ‘तुम्हारे पिता की देह का अंश’
  rationale: स्रोत में ‘मांस/देह’ और निकट रिश्तेदारी की अर्थ-छायाएँ साथ हैं। मुख्य पाठ आधुनिक हिन्दी में कानूनी आशय स्पष्ट करता है, जबकि पादटिप्पणी अधिक शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘पिता की बहन’ स्रोत के रिश्ते को सीधे व्यक्त करता है। निषेध में आदरसूचक/बहुवचन ‘तुम’ के अनुरूप क्रियारूप रखा गया है; कानूनी मुहावरे की व्याख्या पादटिप्पणी में दी गई है।
