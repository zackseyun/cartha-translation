source:
  edition: WLC
  text: אִ֥ישׁ אִישׁ֙ אֶל כָּל שְׁאֵ֣ר בְּשָׂר֔/וֹ לֹ֥א תִקְרְב֖וּ לְ/גַלּ֣וֹת עֶרְוָ֑ה אֲנִ֖י יְהוָֽה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/006.yaml
  text: No man among you shall approach any close relative of his flesh to uncover nakedness[a]; I am Yahweh.
translation:
  language: hi
  text: तुम में से कोई पुरुष अपने किसी निकट संबंधी के पास उसकी नग्नता प्रकट करने के लिए न जाए[a]। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में ‘नग्नता प्रकट करना’ इस अध्याय का एक कानूनी मुहावरा है, जो निकट संबंधी के साथ निषिद्ध यौन अनावरण या यौन-संबंध को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ אִישׁ
  choice: तुम में से कोई पुरुष
  rationale: दोहराया हुआ एकवचन संज्ञा-वाक्यांश वितरणात्मक है और प्रत्येक पुरुष को अलग-अलग इस निषेध के अधीन रखता है। संदर्भ से स्पष्ट समुदाय को व्यक्त करने के लिए ‘तुम में से’ स्वाभाविक हिंदी है।
- source_word: שְׁאֵר בְּשָׂרוֹ
  choice: अपने किसी निकट संबंधी
  rationale: यह पद निकट देहगत या रक्त-संबंधी रिश्तेदारी बताता है। ‘निकट संबंधी’ आधुनिक हिंदी में स्पष्ट है; ‘अपने’ प्रत्यय וֹ को व्यक्त करता है, जबकि ‘देह का’ जैसी शाब्दिक अभिव्यक्ति अस्वाभाविक होती।
- source_word: לֹא תִקְרְבוּ
  choice: के पास ... न जाए
  rationale: क़ारव क्रिया और אֶל मिलकर ‘पास जाना/निकट जाना’ व्यक्त करते हैं। निषेधात्मक अपूर्ण रूप को हिंदी विधिक निषेध ‘न जाए’ से स्वाभाविक रूप में रखा गया है।
- source_word: לְגַלּוֹת עֶרְוָה
  choice: उसका नंगापन उघाड़ने के लिए
  rationale: अध्याय में बार-बार आने वाले इब्रानी कानूनी मुहावरे की मूल छवि सुरक्षित रखी गई है। इसके यौन आशय को मुख्य पाठ में पूरी तरह परिभाषित करने के बजाय पादटिप्पणी में स्पष्ट किया गया है।
- source_word: אֲנִי יְהוָה
  choice: मैं यहोवा हूँ
  rationale: वाचा-संबंधी आत्मपरिचय को सीधे रखा गया है और יְהוָה को प्रचलित हिंदी रूप ‘यहोवा’ में लिप्यंतरित किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे उपस्थित है। हिंदी पाठकों में पहचाने जाने वाले लिप्यंतरण ‘यहोवा’ से नाम और उपाधि का भेद बना रहता है।
- issue: ‘नंगापन उघाड़ना’ मुहावरे को मुख्य पाठ में स्पष्ट करना
  choice: मूल कानूनी मुहावरा बनाए रखना
  alternative: यौन संबंध रखना
  rationale: मूल अभिव्यक्ति अध्याय की संरचना में बार-बार आती है और केवल एक सपाट परिभाषा से अधिक व्यापक यौन अनावरण या संबंध का संकेत दे सकती है। पादटिप्पणी अर्थ-क्षेत्र समझाती है, पर वास्तविक अस्पष्टता को मिटाती नहीं।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण, स्पष्ट और कानूनी निषेध के अनुरूप शैली। ‘नंगापन उघाड़ना’ जानबूझकर कुछ औपचारिक रखा गया है ताकि अध्याय में दोहराए गए इब्रानी मुहावरे की छवि सुरक्षित रहे।
