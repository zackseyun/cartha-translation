reference: Leviticus 18:26
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אַתֶּ֗ם אֶת חֻקֹּתַ/י֙ וְ/אֶת מִשְׁפָּטַ֔/י וְ/לֹ֣א תַעֲשׂ֔וּ מִ/כֹּ֥ל הַ/תּוֹעֵבֹ֖ת הָ/אֵ֑לֶּה הָֽ/אֶזְרָ֔ח וְ/הַ/גֵּ֖ר הַ/גָּ֥ר בְּ/תוֹכְ/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/026.yaml
  text: But you yourselves shall keep my statutes and my judgments[a], and you shall not do any of these abominations, neither the native-born nor the sojourner who sojourns among you.
translation:
  language: hi
  text: पर तुम स्वयं—चाहे देश में जन्मे हुए हो या तुम्हारे बीच रहने वाले परदेशी[a]—मेरी विधियों और मेरे नियमों का पालन करो, और इन घृणित कामों में से कोई भी न करो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तुम्हारे बीच रहने वाला विदेशी निवासी।”
    reason: גֵּר का अर्थ केवल थोड़े समय के यात्री से अधिक, समुदाय में रहने वाला गैर-मूल निवासी भी हो सकता है।
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אַתֶּם
  choice: पर तुम स्वयं ... पालन करो
  rationale: שׁמר के वाचा और व्यवस्था-संबंधी प्रयोग में ‘पालन करना’ स्वाभाविक है। स्वतंत्र सर्वनाम אַתֶּם के बल को ‘तुम स्वयं’ से व्यक्त किया गया है; संदर्भगत विरोध को ‘पर’ स्पष्ट करता है।
- source_word: חֻקֹּתַי וְאֶת־מִשְׁפָּטַי
  choice: मेरी विधियों और मेरे नियमों
  rationale: ‘विधियाँ’ निश्चित आदेशों का और ‘नियम’ न्यायिक अथवा विधिक निर्देशों का सामान्य, आधुनिक हिन्दी रूप है। दोनों शब्दों को अलग रखकर इब्रानी युग्म का भेद बनाए रखा गया है।
- source_word: וְלֹא תַעֲשׂוּ מִכֹּל הַתּוֹעֵבֹת הָאֵלֶּה
  choice: और इन घृणित कामों में से कोई भी न करो
  rationale: עשה का सीधा अर्थ ‘करना’ रखा गया है। नकार के साथ מִכֹּל का व्यापक अर्थ ‘कोई भी’ है। תּוֹעֵבֹת की प्रबल नैतिक निंदा को सहज हिन्दी में ‘घृणित काम’ व्यक्त करता है।
- source_word: הָאֶזְרָח
  choice: देश में जन्मा व्यक्ति
  rationale: אֶזְרָח समुदाय अथवा देश के मूल निवासी को दर्शाता है। यह रूप ‘नागरिक’ जैसे आधुनिक कानूनी अर्थ को अनावश्यक रूप से आरोपित नहीं करता।
- source_word: וְהַגֵּר הַגָּר בְּתוֹכְכֶם
  choice: न तुम्हारे बीच रहने वाला परदेशी
  rationale: גֵּר यहाँ समुदाय के बीच रहने वाले गैर-मूल निवासी को दर्शाता है। ‘परदेशी’ संक्षिप्त और स्वाभाविक है, जबकि सहभागी वाक्यांश का निवासी भाव ‘तुम्हारे बीच रहने वाला’ से स्पष्ट होता है।
theological_decisions:
- issue: निषेध का देश में जन्मे लोगों और निवासी परदेशियों पर लागू होना
  choice: 'अंतिम दोनों संज्ञाओं को समान रूप से निषेध के अधीन रखा गया है: ‘न देश में जन्मा व्यक्ति, न ... परदेशी।’'
  alternative: अंतिम पदों को केवल उन लोगों की व्याख्यात्मक पहचान माना जा सकता है जिन्हें बहुवचन ‘तुम’ संबोधित करता है।
  rationale: इब्रानी वाक्य-विन्यास दोनों समूहों को निषिद्ध काम न करने वालों के रूप में साथ रखता है। अनुवाद इस समान दायित्व को दिखाता है, पर इसके आधार पर कोई व्यापक संप्रदायगत निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञा के सामूहिक स्वर के लिए ‘पालन करो’ और ‘न करो’ प्रयुक्त हैं। डैश अंतिम दोनों समूहों को निषेध के दायरे में स्पष्ट रूप से रखता है।
