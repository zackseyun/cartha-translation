source:
  edition: WLC
  text: עֶרְוַ֥ת אָבִ֛י/ךָ וְ/עֶרְוַ֥ת אִמְּ/ךָ֖ לֹ֣א תְגַלֵּ֑ה אִמְּ/ךָ֣ הִ֔וא לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/הּ׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/007.yaml
  text: You shall not uncover the nakedness of your father[a], that is, the nakedness of your mother. She is your mother; you shall not uncover her nakedness.
translation:
  language: hi
  text: तू अपने पिता की नग्नता[a], अर्थात् अपनी माता की नग्नता, प्रकट न करना। वह तेरी माता है; तू उसकी नग्नता प्रकट न करना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या अधिक शाब्दिक रूप से, “तू अपने पिता की नग्नता और अपनी माता की नग्नता प्रकट न करना।” पद आगे इसे माता के संदर्भ में स्पष्ट करता है: “वह तेरी माता है।”'
    reason: alternative_reading
lexical_decisions:
- source_word: עֶרְוַת
  choice: का नंगापन
  rationale: लैव्यव्यवस्था 18 में גלה ערוה निषिद्ध यौन-संबंध के लिए एक स्थिर शिष्टोक्ति है। ‘नंगापन’ मूल बिंब और कानूनी शैली को बनाए रखता है, जबकि यौन आशय संदर्भ से स्पष्ट रहता है।
- source_word: תְגַלֵּה / תְגַלֶּה
  choice: तू ... न उघाड़ना
  rationale: גלה के पिएल रूप और עֶרְוָה से बनी अध्याय की दोहराई गई निषेधात्मक अभिव्यक्ति को सुरक्षित रखा गया है। ‘उघाड़ना’ वर्तमान हिन्दी में बोधगम्य है और मूल रूपक को अनावश्यक रूप से स्पष्टार्थक नहीं बनाता।
- source_word: אָבִיךָ
  choice: अपने पिता
  rationale: द्वितीय पुरुष पुल्लिंग एकवचन प्रत्यय सहित संबंधवाचक शब्द का सीधा अनुवाद।
- source_word: וְעֶרְוַת אִמְּךָ
  choice: अर्थात् अपनी माता का नंगापन
  rationale: संयोजक वाव को अगले वाक्य ‘वह तेरी माता है’ के प्रकाश में व्याख्यात्मक माना गया है। अधिक शाब्दिक समन्वयी पाठ को पादटिप्पणी में रखा गया है, ताकि हिब्रू की संभावित अस्पष्टता बनी रहे।
- source_word: הִוא
  choice: वह
  rationale: स्त्रीलिंग एकवचन सर्वनाम माता की ओर संकेत करता है; ‘वह तेरी माता है’ मूल के बलाघात और कानूनी स्पष्टता को बनाए रखता है।
- source_word: אִמְּךָ
  choice: तेरी माता
  rationale: मूल में संबंधवाचक शब्द की पुनरावृत्ति को बल और कानूनी स्पष्टता के लिए सुरक्षित रखा गया है।
theological_decisions:
- issue: ‘अपने पिता का नंगापन’ और ‘अपनी माता का नंगापन’ का पारस्परिक संबंध
  choice: 'मुख्य पाठ में दूसरे पदबंध को व्याख्यात्मक रखा गया: ‘अपने पिता का नंगापन, अर्थात् अपनी माता का नंगापन।’'
  alternative: 'अधिक शाब्दिक समन्वयी अनुवाद: ‘अपने पिता का नंगापन और अपनी माता का नंगापन।’'
  rationale: पद का अगला कथन, ‘वह तेरी माता है,’ माता को तत्काल निषेध का विषय बताता है और इस समझ का समर्थन करता है कि माता का नंगापन उघाड़ना पिता के नंगापन का उल्लंघन भी माना जाता है। फिर भी וְ का सामान्य अर्थ ‘और’ हो सकता है, इसलिए वैकल्पिक पाठ पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। एकवचन आज्ञार्थक संबोधन के लिए ‘तू’ मूल के द्वितीय पुरुष पुल्लिंग एकवचन को प्रत्यक्ष रखता है; ‘माता’ औपचारिक और सहज धार्मिक-कानूनी शब्दावली है।
