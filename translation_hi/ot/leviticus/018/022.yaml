  text: וְ/אֶ֨ת זָכָ֔ר לֹ֥א תִשְׁכַּ֖ב מִשְׁכְּבֵ֣י אִשָּׁ֑ה תּוֹעֵבָ֖ה הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/022.yaml
  text: You shall not lie with a male as with a woman[a]; it is an abomination.
translation:
  language: hi
  text: तू किसी पुरुष के साथ उस प्रकार न सोना जिस प्रकार स्त्री के साथ सोया जाता है[a]; यह घृणित काम है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “स्त्री के शयन” (बहुवचन); यह स्त्री के साथ यौन-संबंध का संकेत देने वाला मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: זָכָר
  choice: किसी पुरुष
  rationale: זָכָר का मूल अर्थ पुरुष-लिंग का व्यक्ति है। हिंदी में ‘किसी पुरुष’ निषेध के अनिश्चित कर्म को स्वाभाविक ढंग से व्यक्त करता है और पाठ में न दी गई कोई अतिरिक्त सीमा नहीं जोड़ता।
- source_word: תִשְׁכַּב
  choice: न सोना
  rationale: שׁכב यहाँ यौन-संबंध का शिष्टोक्तिपरक प्रयोग है। ‘सोना’ हिंदी में उसी मुहावरे को बनाए रखता है, और अगला पद उसका आशय स्पष्ट करता है।
- source_word: מִשְׁכְּבֵי אִשָּׁה
  choice: ऐसे ... जैसे स्त्री के साथ सोते हैं
  rationale: शाब्दिक रूप ‘स्त्री के शयन’ बहुवचन में है, पर यह स्त्री के साथ यौन-संबंध का मुहावरा है। चुना हुआ रूप तुलना और मुहावरे का आशय दोनों स्वाभाविक हिंदी में रखता है।
- source_word: תּוֹעֵבָה
  choice: घिनौना काम
  rationale: תּוֹעֵבָה किसी अत्यंत घृणित या निषिद्ध बात के लिए प्रबल मूल्यांकनात्मक संज्ञा है। ‘घिनौना काम’ आधुनिक सामान्य हिंदी में इसका भार स्पष्ट रखता है; केवल ‘घिनौना’ कहने की अपेक्षा संज्ञात्मक विधान भी सुरक्षित रहता है।
- source_word: הִוא
  choice: यह ... है
  rationale: स्त्रीलिंग सर्वनाम निषिद्ध कर्म की ओर लौटता है और תּוֹעֵבָה के साथ विधेय बनाता है। हिंदी में ‘यह ... है’ इसका स्वाभाविक रूप है।
theological_decisions:
- issue: पवित्रता-संहिता के संदर्भ में निषेध का स्वरूप
  choice: पद को पुरुष के साथ स्त्री-सदृश यौन-संबंध के सीधे निषेध के रूप में अनूदित किया गया है, बिना ऐसी सीमाएँ जोड़े जो इब्रानी में नहीं हैं।
  alternative: इसे केवल किसी विशिष्ट पंथ-संबंधी, शोषणकारी या अन्य संकुचित प्रथा तक सीमित करके प्रस्तुत करना।
  rationale: इब्रानी पाठ स्वयं किसी पुरुष के साथ ‘स्त्री के शयन’ के अनुसार सोने का निषेध करता और उस कर्म को תּוֹעֵבָה कहता है। अनुवाद न तो अनकहे सीमाकारक जोड़े, न मूल वाक्य से आगे बढ़कर व्यापक धर्मसैद्धांतिक दावा करे।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिंदी। व्यवस्था-संबंधी एकवचन संबोधन के लिए ‘तू’ रखा गया है। ‘सोना’ मूल की शिष्टोक्ति को बनाए रखता है, जबकि पादटिप्पणी यौन आशय स्पष्ट करती है।
