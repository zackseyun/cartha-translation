base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/025.yaml
  text: So the land became unclean[a], and I punished its iniquity upon it[c][b], and the land vomited out its inhabitants.
translation:
  language: hi
  text: इस प्रकार भूमि अशुद्ध हो गई[a]; मैंने उसके अधर्म के कारण उस पर दण्ड लगाया[b], और भूमि ने अपने निवासियों को उगल दिया[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपवित्र हो गई।” इब्रानी क्रिया भूमि के अशुद्ध या अपवित्र हो जाने का भाव दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “मैंने उसका अधर्म उस पर ठहराया” या “उसका अधर्म उस पर देखा”; यह दोष को न्याय में उत्तरदायी ठहराने का मुहावरा है।
    reason: lexical_alternative
  - marker: c
    text: या “उलटी करके बाहर निकाल दिया।” इब्रानी में उलटी करने का तीखा बिम्ब है, जो भूमि द्वारा अपने निवासियों के निष्कासन को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַתִּטְמָא
  choice: अशुद्ध हो गई
  rationale: यह क्रिया भूमि के अपवित्र या अशुद्ध हो जाने का परिणाम बताती है। ‘अशुद्ध हो गई’ आधुनिक हिन्दी में स्वाभाविक है और धार्मिक तथा नैतिक अशुद्धता—दोनों की संगति बनाए रखती है।
- source_word: הָאָרֶץ
  choice: भूमि
  rationale: सन्दर्भ कनान की विशिष्ट भूमि का है, इसलिए व्यापक ‘पृथ्वी’ के बजाय ‘भूमि’ उपयुक्त है।
- source_word: וָאֶפְקֹד
  choice: मैंने ... दण्ड दिया
  rationale: פקד का मूल अर्थ ध्यान देना या हिसाब लेना भी हो सकता है, पर עון के साथ यहाँ न्यायपूर्वक दण्ड देने का भाव है। हिन्दी में यह प्रयोग अर्थ को स्पष्ट और स्वाभाविक बनाता है।
- source_word: עֲוֺנָהּ
  choice: उसके अधर्म
  rationale: עון में अधर्म, दोष और उसके दण्डनीय परिणाम का अर्थ-क्षेत्र है। ‘अधर्म’ नैतिक गम्भीरता को बनाए रखता है।
- source_word: עָלֶיהָ
  choice: उसे
  rationale: ‘उस पर’ का सम्बन्ध भूमि से है। ‘उसके अधर्म के लिए उसे दण्ड दिया’ हिन्दी में इस सम्बन्ध को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַתָּקִא
  choice: उगल दिया
  rationale: किय क्रिया का ठोस अर्थ उलटी करके बाहर निकालना है। ‘उगल दिया’ भूमि के सजीव और तीखे मानवीकरण को सुरक्षित रखता है।
- source_word: יֹשְׁבֶיהָ
  choice: अपने निवासियों
  rationale: यह भूमि में रहने वाले लोगों का सामूहिक उल्लेख है। ‘अपने निवासियों’ संक्षिप्त और स्पष्ट है।
theological_decisions:
- issue: भूमि का मानवीकरण और उसका निवासियों को बाहर निकालना
  choice: भूमि ने अपने निवासियों को ‘उगल दिया’
  alternative: भूमि ने अपने निवासियों को निकाल दिया
  rationale: मूल इब्रानी में जानबूझकर तीखा शारीरिक बिम्ब है। इसे बनाए रखने से अधर्म, भूमि की अशुद्धता, परमेश्वर के न्याय और लोगों के निष्कासन का सम्बन्ध सुरक्षित रहता है।
- issue: וָאֶפְקֹד עֲוֺנָהּ עָלֶיהָ में परमेश्वर का न्याय
  choice: मैंने उसके अधर्म के लिए उसे दण्ड दिया
  alternative: मैंने उसके अधर्म का हिसाब उससे लिया
  rationale: मुख्य पाठ में दण्ड का भाव स्पष्ट किया गया है, जबकि पादटिप्पणी क्रिया के अधिक शाब्दिक मुहावरे की सूचना देती है। इससे परमेश्वर की प्रत्यक्ष न्यायिक भूमिका बनी रहती है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘भूमि’, ‘अधर्म’ और ‘निवासी’ बाइबलीय सन्दर्भ की गम्भीरता बनाए रखते हैं; ‘उगल दिया’ मूल के तीखे रूपक को बिना नरम किए प्रस्तुत करता है।
