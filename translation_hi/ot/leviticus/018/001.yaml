lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया कथानक को आगे बढ़ाते हुए वाणी का परिचय देती है। हिन्दी में ‘मूसा से कहा’ इस सूत्र का स्वाभाविक और सटीक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी लिपि में ‘याहवे’ लिखा गया है।
- source_word: אֶל־מֹשֶׁה
  choice: मूसा से
  rationale: बोलने की क्रिया के साथ אֶל संबोधित व्यक्ति को चिह्नित करता है; आधुनिक हिन्दी में ‘मूसा से’ स्वाभाविक प्रयोग है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह रूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में अलग से ‘यह कहते हुए’ जोड़ना अनावश्यक रूप से भारी होता; ‘कहा’ वही कार्य स्वाभाविक ढंग से करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत नाम स्पष्ट रूप से उपस्थित है। ‘याहवे’ उसका प्रचलित विद्वतापूर्ण लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। इब्रानी वाणी-परिचय सूत्र को शब्दशः दोहराने के बजाय हिन्दी की स्वाभाविक अभिव्यक्ति ‘ने…से कहा’ में प्रस्तुत किया गया है।
