source:
  edition: WLC
  text: וּ/שְׁמַרְתֶּ֣ם אֶת מִשְׁמַרְתִּ֗/י לְ/בִלְתִּ֨י עֲשׂ֜וֹת מֵ/חֻקּ֤וֹת הַ/תּֽוֹעֵבֹת֙ אֲשֶׁ֣ר נַעֲשׂ֣וּ לִ/פְנֵי/כֶ֔ם וְ/לֹ֥א תִֽטַּמְּא֖וּ בָּ/הֶ֑ם אֲנִ֖י יְהוָ֥ה אֱלֹהֵי/כֶֽם־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/030.yaml
  text: So you shall keep my charge[a], so as not to practice any of the abominable statutes that were practiced before you, and you shall not make yourselves unclean by them. I am Yahweh your God.
translation:
  language: hi
  text: तुम मेरे दिए हुए दायित्व का पालन करना, ताकि तुम उन घिनौनी रीति-रिवाज़ों[a] में से किसी को न अपनाओ, जो तुमसे पहले प्रचलित थे; और उनके द्वारा अपने आपको अशुद्ध न करना। मैं याहवे, तुम्हारा परमेश्वर हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “घिनौने विधि-विधानों” अथवा “घिनौनी प्रथाओं।” इब्रानी शब्द निर्धारित आचार, प्रथा या रीति को सूचित कर सकता है, केवल औपचारिक कानून को नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם אֶת־מִשְׁמַרְתִּי
  choice: तुम मेरी सौंपी हुई ज़िम्मेदारी को निभाना
  rationale: שׁמר का अर्थ रखना/पालना और מִשְׁמֶרֶת का अर्थ सौंपी हुई निगरानी, दायित्व या ज़िम्मेदारी है। यह हिंदी प्रयोग केवल सामान्य ‘आज्ञा’ कहने के बजाय सौंपे गए दायित्व की भावना बनाए रखता है।
- source_word: לְבִלְתִּי עֲשׂוֹת
  choice: किसी को न अपनाना
  rationale: यह रचना निषेधात्मक उद्देश्य व्यक्त करती है। रीति-रिवाज़ों के संदर्भ में ‘अपनाना’ स्वाभाविक हिंदी है और व्यवहार में लाने का भाव देता है।
- source_word: מֵחֻקּוֹת הַתּוֹעֵבֹת
  choice: उन घिनौनी रीति-रिवाज़ों में से किसी को
  rationale: מן अंशवाचक है, इसलिए ‘में से किसी को’; חֻקּוֹת यहाँ निर्धारित प्रथाओं या रीति-रिवाज़ों को सूचित कर सकता है, और תּוֹעֵבֹת उनकी तीव्र निंदनीयता व्यक्त करता है।
- source_word: אֲשֶׁר נַעֲשׂוּ לִפְנֵיכֶם
  choice: जो तुमसे पहले प्रचलित थे
  rationale: शाब्दिक रूप से ‘जो तुमसे पहले किए गए थे’; संदर्भ में पहले के निवासियों द्वारा प्रचलित व्यवहार अभिप्रेत है।
- source_word: וְלֹא תִטַּמְּאוּ בָּהֶם
  choice: उनके द्वारा अपने आप को अशुद्ध न करना
  rationale: क्रिया का आत्मवाचक भाव ‘अपने आप को अशुद्ध करना’ से और בָּהֶם का साधनवाचक भाव ‘उनके द्वारा’ से सुरक्षित रहता है।
- source_word: אֲנִי יְהוָה אֱלֹהֵיכֶם
  choice: मैं यहोवा तुम्हारा परमेश्वर हूँ
  rationale: वाचा-संबंधी आत्मपरिचय सूत्र को सीधे रखा गया है और יְהוָה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे / प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिंदी बाइबलीय पाठकों में पहचाना जाने वाला लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: תּוֹעֵבֹת की नैतिक और धार्मिक तीव्रता
  choice: घिनौनी
  alternative: घृणित / अत्यंत निंदनीय
  rationale: ‘घिनौनी’ साधारण पाठक के लिए स्पष्ट और प्रबल है तथा मूल के विकर्षण और निंदा के भाव को बनाए रखती है, बिना अतिरिक्त धार्मिक वर्गीकरण जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिंदी पाठक के लिए सुबोध रखी गई है। ‘सौंपी हुई ज़िम्मेदारी’ दायित्व का भाव स्पष्ट करती है; ‘रीति-रिवाज़’ संदर्भगत सामुदायिक प्रथाओं को स्वाभाविक हिंदी में व्यक्त करता है।
