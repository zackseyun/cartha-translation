source:
  edition: WLC
  text: אַל תִּֽטַּמְּא֖וּ בְּ/כָל אֵ֑לֶּה כִּ֤י בְ/כָל אֵ֨לֶּה֙ נִטְמְא֣וּ הַ/גּוֹיִ֔ם אֲשֶׁר אֲנִ֥י מְשַׁלֵּ֖חַ מִ/פְּנֵי/כֶֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/024.yaml
  text: Do not make yourselves unclean by any of these things[a], for by all these things the nations that I am driving out before you became unclean.
translation:
  language: hi
  text: इनमें से किसी से भी अपने आपको अशुद्ध मत करो, क्योंकि इन सभी से वे जातियाँ अशुद्ध हो गईं जिन्हें मैं तुम्हारे सामने से निकाल रहा हूँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: אַל תִּטַּמְּאוּ
  choice: अपने आप को अशुद्ध मत करना
  rationale: אַל के साथ अपूर्ण क्रिया निषेध व्यक्त करती है, और טמא का हित्पएल रूप आत्मवाचक सहभागिता दिखाता है। यह अनुवाद लैव्यव्यवस्था की शुद्ध-अशुद्ध शब्दावली को बनाए रखता है।
- source_word: בְּכָל אֵלֶּה
  choice: इनमें से किसी भी काम से
  rationale: निषेधात्मक वाक्य में בְּכָל אֵלֶּה का स्वाभाविक हिन्दी रूप ‘इनमें से किसी भी ... से’ है। संदर्भ में אֵלֶּה पिछली आयतों में बताए गए आचरणों की ओर संकेत करता है, इसलिए ‘काम’ स्पष्ट और सहज है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में इस संबंध को स्पष्ट रखता है।
- source_word: נִטְמְאוּ
  choice: अशुद्ध हो गईं
  rationale: טמא का निफ़अल रूप यहाँ परिणामी अवस्था व्यक्त करता है। ‘अशुद्ध हो गईं’ इस भाव को व्यक्त करता और पहले प्रयोग के साथ शब्दगत संगति रखता है।
- source_word: הַגּוֹיִם
  choice: वे जातियाँ
  rationale: यहाँ גּוֹיִם देश में रहने वाले गैर-इस्राएली जनसमूहों को सूचित करता है। ‘जातियाँ’ मानक बाइबलीय हिन्दी है; ‘अन्यजाति’ इस संदर्भ में अनावश्यक धार्मिक अर्थ ला सकता है।
- source_word: אֲשֶׁר אֲנִי מְשַׁלֵּחַ
  choice: जिन्हें मैं ... निकाल रहा हूँ
  rationale: שׁלח का मूल अर्थ ‘भेजना’ है, पर भूमि और न्याय के इस संदर्भ में इसका आशय हटाने या निष्कासित करने से है। ‘निकाल रहा हूँ’ इस संदर्भगत बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מִפְּנֵיכֶם
  choice: तुम्हारे सामने से
  rationale: यह इब्रानी पद का निकट और मुहावरेदार हिन्दी रूप है तथा इस्राएल की उपस्थिति और आगे बढ़ने के मार्ग से जातियों को हटाने का स्थानिक भाव बनाए रखता है।
theological_decisions:
- issue: लैव्यव्यवस्था 18 में धार्मिक-नैतिक अशुद्धता की शब्दावली
  choice: अशुद्ध मत करना / अशुद्ध हो गईं
  alternative: अपने आप को दूषित मत करना / दूषित हो गईं
  rationale: ‘अशुद्ध’ טמא की लैव्यव्यवस्थीय अवधारणा और दोनों क्रियारूपों की शब्दगत संगति को सुरक्षित रखता है। ‘दूषित’ भी संभव है, पर वह हिन्दी में अधिक सामान्य नैतिक या भौतिक प्रदूषण का भाव दे सकता है।
- issue: נִטְמְאוּ के निफ़अल का भाव
  choice: अशुद्ध हो गईं
  alternative: दूषित की गईं
  rationale: निफ़अल यहाँ निष्क्रिय अथवा अवस्थापरक दोनों रूपों में समझा जा सकता है। मुख्य पाठ परिणामी अवस्था को सहजता से व्यक्त करता है; पादटिप्पणी वैध निष्क्रिय विकल्प सुरक्षित रखती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में सीधा, गरिमापूर्ण निषेध रखा गया है। ‘अपने आप को’ आत्मवाचक भाव को स्पष्ट करता है; ‘काम’ पूर्ववर्ती निषिद्ध आचरणों की ओर सहज संकेत देता है।
