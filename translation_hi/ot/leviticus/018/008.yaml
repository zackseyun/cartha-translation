base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/008.yaml
  text: You shall not uncover the nakedness of your father's wife[a]; it is your father's nakedness.
translation:
  language: hi
  text: तुम अपने पिता की पत्नी की नग्नता न उघाड़ना[a]; यह तुम्हारे पिता की नग्नता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप में: “तुम अपने पिता की पत्नी के साथ यौन-संबंध न रखना।” इब्रानी में शाब्दिक रूप से, “नग्नता उघाड़ना” है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת
  choice: का नंगापन
  rationale: लैव्यव्यवस्था 18 में यह संज्ञा ‘नंगापन उघाड़ना’ के स्थिर कानूनी शिष्टोक्ति-वाक्यांश का भाग है, जो निषिद्ध यौन-संबंध को सूचित करता है। मुख्य पाठ में इब्रानी रूपक और अध्याय की दोहराई गई कानूनी भाषा सुरक्षित रखी गई है।
- source_word: אֵשֶׁת
  choice: पत्नी
  rationale: '‘पिता’ के साथ संबंधवाचक संरचना में अर्थ विशेष रूप से वैवाहिक है: ‘तुम्हारे पिता की पत्नी।’'
- source_word: לֹא תְגַלֵּה
  choice: न उघाड़ना
  rationale: निषेधात्मक अपूर्ण क्रिया कानूनी आदेश व्यक्त करती है। ‘न उघाड़ना’ इब्रानी रूपक को बनाए रखते हुए स्वाभाविक हिंदी निषेध देता है।
- source_word: אָבִיךָ
  choice: तुम्हारे पिता
  rationale: संबंधसूचक रूप का सीधा और स्पष्ट अनुवाद; पद में इसकी पुनरावृत्ति भी रखी गई है।
- source_word: הִוא
  choice: वह ... है
  rationale: स्त्रीलिंग सर्वनाम निकटवर्ती स्त्रीलिंग संज्ञा ‘नंगापन’ की ओर लौटता है; हिंदी में ‘वह तुम्हारे पिता का नंगापन है’ इस संदर्भ को स्वाभाविक रूप से बनाए रखता है।
theological_decisions:
- issue: क्या कानूनी शिष्टोक्ति को सीधे ‘यौन-संबंध रखना’ कहकर स्पष्ट किया जाए
  choice: मुख्य पाठ में ‘नंगापन उघाड़ना’ का रूपक बनाए रखा गया
  alternative: तुम अपने पिता की पत्नी के साथ यौन-संबंध न रखना
  rationale: इब्रानी पाठ पूरे अध्याय में दोहराया गया वाचा-कानून का शिष्टोक्तिपूर्ण सूत्र प्रयोग करता है। उसे मुख्य पाठ में रखने से शैली और शब्दगत संगति बचती है, जबकि स्पष्ट अर्थ पादटिप्पणी में दिया जाता है।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘नंगापन उघाड़ना’ सामान्य बातचीत की अपेक्षा कुछ औपचारिक है, पर यह मूल इब्रानी की शिष्टोक्ति और अध्याय की आवर्ती अभिव्यक्ति को सुरक्षित रखता है।
