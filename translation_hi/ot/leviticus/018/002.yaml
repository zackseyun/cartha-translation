base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/002.yaml
  text: Speak to the sons of Israel and say to them[b][a], ‘I am Yahweh your God.’
translation:
  language: hi
  text: “इस्राएल के पुत्रों से बोल और उनसे कह, ‘मैं याहवे[a] तुम्हारा परमेश्वर हूँ।’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: YHWH; इसे “यहोवा” भी लिखा जाता है और परंपरागत रूप से “प्रभु” अनुवाद किया गया है।'
    reason: alternative_reading
lexical_decisions:
- source_word: דַּבֵּר
  choice: बात कर
  rationale: यह पिएल आज्ञार्थक रूप मूसा को लोगों को संबोधित करने की सीधी आज्ञा देता है; आधुनिक हिंदी में ‘से बात कर’ स्वाभाविक और निकट अर्थ वाला है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू की शाब्दिक पारिवारिक वाचा-अभिव्यक्ति ‘इस्राएल के पुत्र’ को बनाए रखा गया है; यहाँ यह सामूहिक रूप से इस्राएल की प्रजा को सूचित करती है।
- source_word: וְאָמַרְתָּ אֲלֵהֶם
  choice: और उनसे कह
  rationale: हिब्रू की क्रमिक आज्ञा और प्रत्यक्ष कथन की भूमिका को सरल, स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: אֲנִי
  choice: मैं ... हूँ
  rationale: स्वतंत्र सर्वनाम को हिंदी के आवश्यक योजक ‘हूँ’ के साथ पहचान-सूत्र के रूप में व्यक्त किया गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार अक्षरों वाले व्यक्तिगत ईश्वरीय नाम YHWH को किसी उपाधि से बदलने के बजाय हिंदी में प्रचलित नाम-रूप ‘यहोवा’ से व्यक्त किया गया है।
- source_word: אֱלֹהֵיכֶם
  choice: तुम्हारा परमेश्वर
  rationale: संदर्भ में אֱלֹהִים एकवचन अर्थ रखता है और द्वितीय पुरुष बहुवचन प्रत्यय को सामूहिक हिंदी ‘तुम्हारा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत वाचा-नाम YHWH देता है। हिंदी पाठकों के लिए परिचित लिप्यंतरण ‘यहोवा’ नाम को नाम ही रहने देता है; टिप्पणी ‘याहवे’ और पारंपरिक ‘प्रभु’ को स्पष्ट करती है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक और लिंगगत स्वरूप
  choice: इस्राएल के पुत्रों
  alternative: इस्राएल की सन्तान; इस्राएलियों
  rationale: मूल की स्पष्ट पुल्लिंग-बहुवचन पारिवारिक अभिव्यक्ति और उसकी वाचागत ध्वनि सुरक्षित रखी गई है, बिना उसके सामूहिक संदर्भ को किसी संप्रदायगत अर्थ से सीमित किए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रत्यक्ष रखी गई है। मूसा को संबोधित एकवचन आज्ञार्थक ‘कर/कह’ तथा इस्राएल के लिए सामूहिक ‘तुम्हारा’ मूल के व्याकरणिक संबंधों को स्पष्ट रखते हैं।
