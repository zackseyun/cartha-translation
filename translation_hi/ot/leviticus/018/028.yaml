source:
  edition: WLC
  text: וְ/לֹֽא תָקִ֤יא הָ/אָ֨רֶץ֙ אֶתְ/כֶ֔ם בְּ/טַֽמַּאֲ/כֶ֖ם אֹתָ֑/הּ כַּ/אֲשֶׁ֥ר קָאָ֛ה אֶת הַ/גּ֖וֹי אֲשֶׁ֥ר לִ/פְנֵי/כֶֽם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/028.yaml
  text: so that the land will not vomit you out when you defile it[a], as it vomited out the nation that was before you.
translation:
  language: hi
  text: ऐसा न हो कि जब तुम उस देश को अशुद्ध करो, तो वह तुम्हें न उगल दे, जैसे उसने उस जाति को उगल दिया जो तुमसे पहले थी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बाहर निकाल दे” / “बाहर निकाल दिया।” इब्रानी क्रिया देश द्वारा अशुद्धता के कारण अपने निवासियों को उगल देने की सजीव छवि प्रस्तुत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: תָקִיא / קָאָה
  choice: उगलकर बाहर निकाल दे / उगलकर बाहर निकाल दिया
  rationale: इब्रानी की सजीव निष्कासन-छवि को बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक रूप से बताता है कि देश अपने निवासियों को बाहर फेंक देता है।
- source_word: הָאָרֶץ
  choice: देश
  rationale: संदर्भ में पूरी पृथ्वी नहीं, कनान का विशिष्ट भूभाग अभिप्रेत है; हिन्दी बाइबलीय गद्य में ‘देश’ इस अर्थ को सहजता से व्यक्त करता है।
- source_word: בְּטַמַּאֲכֶם אֹתָהּ
  choice: जब तुम उस देश को अशुद्ध करो
  rationale: בְּ के साथ infinitive construct की कालगत/परिस्थितिगत शक्ति को स्वाभाविक हिन्दी में व्यक्त करता है और טמא के कारणवाचक भाव को बनाए रखता है।
- source_word: הַגּוֹי
  choice: उस जाति
  rationale: एकवचन सामूहिक जनसमूह को व्यक्त करता है; ‘अन्यजाति’ कहने से ऐसा बाद का धार्मिक अर्थ जुड़ सकता है जो यहाँ स्पष्ट नहीं है।
- source_word: אֲשֶׁר לִפְנֵיכֶם
  choice: जो तुमसे पहले वहाँ रहती थी
  rationale: पहले से उस देश में रहने वाले जनसमूह का कालगत अर्थ स्पष्ट करता है; ‘वहाँ रहती थी’ हिन्दी में आशय को सहज बनाता है।
- source_word: וְלֹא
  choice: ताकि ... न
  rationale: पिछले संदर्भ से जुड़ी नकारात्मक परिणाम/प्रयोजन चेतावनी को आधुनिक हिन्दी में स्पष्ट और स्वाभाविक रूप देता है।
theological_decisions:
- issue: न्याय के कर्ता के रूप में देश का मानवीकरण
  choice: देश को व्याकरणिक कर्ता रखते हुए उसे लोगों को ‘उगलकर बाहर निकालते’ दिखाना
  alternative: भाव को अमूर्त करके कहना कि परमेश्वर देश के द्वारा उन्हें निकाल देगा
  rationale: इब्रानी पाठ स्वयं देश का मानवीकरण करता है। यह अनैतिकता से देश के अशुद्ध होने और उसके फलस्वरूप निवासियों के निष्कासन की लैव्यव्यवस्था-संबंधी धार्मिक छवि को सुरक्षित रखता है, बिना परमेश्वर की परम प्रभुता के विषय में कोई अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘उगलकर बाहर निकालना’ मूल रूपक की तीव्रता बनाए रखता है; ‘अशुद्ध’ लैव्यव्यवस्था के शुद्धता-संबंधी प्रसंग के अनुकूल है।
