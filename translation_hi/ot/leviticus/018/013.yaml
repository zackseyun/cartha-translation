  yaml_path: translation/ot/leviticus/018/013.yaml
  text: You shall not uncover the nakedness of your mother's sister[b][a], for she is your mother's close relative.
translation:
  language: hi
  text: तू अपनी माँ की बहन की नग्नता प्रकट न करना,[a] क्योंकि वह तेरी माँ की निकट संबंधी है।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक भावानुवाद के साथ: “तू अपनी माँ की बहन के साथ यौन-संबंध न रखना।” इब्रानी में शाब्दिक रूप से, “तू अपनी माँ की बहन की नग्नता प्रकट न करना” है।'
    reason: lexical_alternative
  - marker: b
    text: “निकट संबंधी” के लिए प्रयुक्त इब्रानी शब्द שְׁאֵר निकट देह-किन या रक्त-संबंधी के लिए प्रयुक्त नातेदारी-संज्ञा है।
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת ... לֹא תְגַלֵּה
  choice: का तन उघाड़ने का प्रयास न करना
  rationale: यह इब्रानी का स्थिर कानूनी शिष्टोक्ति-प्रयोग है, जो निषिद्ध यौन-संबंध को दर्शाता है। ‘तन उघाड़ना’ मूल बिंब और अध्याय के कानूनी स्वर को बनाए रखता है; ‘प्रयास न करना’ निषेधात्मक अपूर्ण क्रिया के भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֲחוֹת אִמְּךָ
  choice: अपनी माँ की बहन
  rationale: यह संबंध को मूल पाठ की तरह सीधे और स्पष्ट रूप से बताता है; ‘मौसी’ अधिक संक्षिप्त है, पर मूल की संबंध-संरचना को कम प्रत्यक्ष बनाता है।
- source_word: שְׁאֵר אִמְּךָ
  choice: तेरी माँ की निकट संबंधी
  rationale: שְׁאֵר निकट देहगत/रक्त-संबंधी के लिए प्रयुक्त नातेदारी-संज्ञा है। ‘निकट संबंधी’ आधुनिक हिन्दी में स्पष्ट है और ‘मांस’ जैसे अत्यधिक शब्दशः किंतु अस्पष्ट अनुवाद से बचता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह निषेध का कारण प्रस्तुत करता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הִוא
  choice: वह ... है
  rationale: स्त्रीलिंग सर्वनाम को कारण-वाक्य के स्पष्ट कर्ता के रूप में रखा गया है।
theological_decisions:
- issue: व्यभिचार-संबंधी कानूनी शिष्टोक्ति को कैसे प्रस्तुत किया जाए
  choice: मुख्य पाठ में ‘तन उघाड़ना’ का बिंब बनाए रखा गया
  alternative: ‘यौन-संबंध रखना’
  rationale: लैव्यव्यवस्था 18 में यह बार-बार आने वाला कानूनी शिष्टोक्ति-प्रयोग है। मूल बिंब रखने से साहित्यिक संगति और औपचारिक कानूनी स्वर सुरक्षित रहते हैं; पादटिप्पणी उसका आशय स्पष्ट करती है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण कानूनी हिन्दी; संबोधन में अध्याय की एकवचन निषेधात्मक शैली के अनुरूप ‘तू/तेरी’ रखा गया है। मुख्य पाठ में इब्रानी शिष्टोक्ति का बिंब सुरक्षित है, जबकि पादटिप्पणी उसका स्पष्ट भावार्थ देती है।
