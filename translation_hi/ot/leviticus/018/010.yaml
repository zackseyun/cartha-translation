  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: עֶרְוַ֤ת בַּת בִּנְ/ךָ֙ א֣וֹ בַֽת בִּתְּ/ךָ֔ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָ֑/ן כִּ֥י עֶרְוָתְ/ךָ֖ הֵֽנָּה־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/010.yaml
  text: You shall not uncover the nakedness of your son's daughter or of your daughter's daughter[b][a], for their nakedness is your own.
translation:
  language: hi
  text: तुम अपने बेटे की बेटी या अपनी बेटी की बेटी की नग्नता प्रकट न करना[a], क्योंकि वे तुम्हारी ही नग्नता हैं[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक अर्थ-स्पष्ट अनुवाद: “तुम अपने बेटे की बेटी या अपनी बेटी की बेटी के साथ यौन-संबंध न रखना।” इब्रानी मुहावरे का शाब्दिक अर्थ है “की नग्नता प्रकट करना।”'
    reason: lexical_alternative
  - marker: b
    text: 'शाब्दिक रूप से: “क्योंकि वे तुम्हारी नग्नता हैं।” यह निकट वंशजों को अपने ही पारिवारिक अस्तित्व का विस्तार मानने वाली भाषा है; इसीलिए उनके साथ यौन-संबंध निषिद्ध है।'
    reason: cultural_note
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן / עֶרְוָתְךָ
  choice: तन
  rationale: यहाँ ‘तन उघाड़ना’ लैव्यव्यवस्था 18 में निषिद्ध यौन-संबंध के लिए प्रयुक्त शिष्टोक्ति है। ‘नंगापन’ की तुलना में ‘तन’ आधुनिक हिन्दी में अधिक स्वाभाविक और गरिमापूर्ण है, जबकि अंतिम वाक्यांश में भी स्रोत की शब्दगत पुनरावृत्ति बनाए रखता है।
- source_word: בַּת בִּנְךָ
  choice: अपने बेटे की बेटी
  rationale: यह सीधा नातेदारी-सूचक अनुवाद मूल की कानूनी सटीकता और दोनों वंश-रेखाओं की समानांतर संरचना बनाए रखता है।
- source_word: בַת בִּתְּךָ
  choice: अपनी बेटी की बेटी
  rationale: मूल के प्रत्यक्ष नातेदारी-सूचक पद और पद्य की समानांतर कानूनी संरचना को सुरक्षित रखता है।
- source_word: לֹא תְגַלֶּה
  choice: न उघाड़ना
  rationale: निषेधात्मक कानूनी शैली तथा पूरे अध्याय में दोहराए गए ‘तन उघाड़ने’ के मुहावरे को बनाए रखता है।
- source_word: כִּי
  choice: क्योंकि
  rationale: इब्रानी संयोजक की कारणसूचक भूमिका आधुनिक हिन्दी में स्पष्ट रूप से व्यक्त होती है।
- source_word: הֵנָּה
  choice: वे ... हैं
  rationale: स्त्रीलिंग बहुवचन सर्वनाम दोनों पोतियों/नातिनों की ओर संकेत करता है; ‘वे’ इस संदर्भ में सहज हिन्दी है।
theological_decisions:
- issue: समापन कारण-वाक्य ‘क्योंकि वे तुम्हारा तन हैं’ का अर्थ
  choice: मूल की पहचान/विस्तार वाली पारिवारिक भाषा को मुख्य पाठ में बनाए रखना
  alternative: क्योंकि उनका तन तुम्हारा अपना तन है / क्योंकि वे तुम्हारा अपना मांस हैं
  rationale: इब्रानी में विधि का आधार निकट वंशजों को व्यक्ति के अपने तन से संबद्ध बताना है। इसे शाब्दिक तनाव सहित रखने से कोई आधुनिक व्याख्या मुख्य पाठ में आरोपित नहीं होती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण कानूनी शैली रखी गई है। ‘बेटे की बेटी’ और ‘बेटी की बेटी’ मूल की द्विपक्षीय नातेदारी-स्पष्टता बनाए रखते हैं। मुख्य पाठ में मूल शिष्टोक्ति सुरक्षित है और अर्थ फुटनोट में स्पष्ट किया गया है।
