base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/021.yaml
  text: And you shall not give any of your offspring to make them pass over to Molech, and you shall not profane the name of your God. I am Yahweh.
translation:
  language: hi
  text: तुम अपनी सन्तान में से किसी को भी मोलेक के लिए पार कराने हेतु मत देना[a]; और अपने परमेश्वर के नाम को अपवित्र मत करना। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात मोलेक से जुड़ी किसी रीति के लिए। बहुत-से विद्वान इसे बाल-बलि मानते हैं, जिसका वर्णन अन्य स्थानों पर बच्चों को ‘आग में से पार कराने’ के रूप में मिलता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמִזַּרְעֲךָ
  choice: अपनी सन्तान में से किसी को भी
  rationale: זֶרַע का मूल अर्थ ‘बीज’ है, पर इस कानूनी सन्दर्भ में यह वंशज या सन्तान को सूचित करता है। ‘में से किसी को भी’ विभाजक מִן और निषेध के दायरे को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: תִתֵּן
  choice: न देना
  rationale: נתן का सामान्य अर्थ ‘देना’ है; निषेधात्मक कानूनी शैली में ‘न देना’ मूल के निकट और स्पष्ट है।
- source_word: לְהַעֲבִיר
  choice: पार कराने को
  rationale: עבר के हिफ़ील रूप का अर्थ ‘पार कराना’ है। यह अनुवाद अनुष्ठान-संबंधी हिब्रू अभिव्यक्ति को बनाए रखता है और मुख्य पाठ में आग या बलिदान का ऐसा उल्लेख नहीं जोड़ता जो इस पद में स्पष्ट नहीं है।
- source_word: לַמֹּלֶךְ
  choice: मोलेक के लिए
  rationale: स्वरांकन और पारम्परिक समझ के अनुसार מֹלֶךְ को देवता के व्यक्तिवाचक नाम के रूप में लिया गया है। यहाँ לְ उद्देश्य अथवा समर्पण का भाव दे सकता है, जिसे ‘के लिए’ खुला रखते हुए व्यक्त करता है।
- source_word: תְחַלֵּל
  choice: अपवित्र न करना
  rationale: חלל के पिएल रूप का अर्थ ‘अपवित्र करना’ या ‘पवित्रता भंग करना’ है। ‘अपवित्र करना’ आधुनिक हिन्दी में सहज है और परमेश्वर के नाम के साथ उपयुक्त धार्मिक-कानूनी गम्भीरता रखता है।
- source_word: שֵׁם אֱלֹהֶיךָ
  choice: अपने परमेश्वर के नाम
  rationale: यह रचना मूल के ‘तुम्हारे परमेश्वर का नाम’ को स्वाभाविक हिन्दी में रखती है और ‘नाम’ की वाचिक तथा प्रतिष्ठात्मक महत्ता बनाए रखती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: चार-अक्षरीय दिव्य नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित व्यक्तिनाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: मोलेक-संबंधी निषेध का स्वरूप
  choice: मुख्य पाठ में ‘पार कराने’ की मूल क्रियात्मक अभिव्यक्ति बनाए रखना
  alternative: ‘आग में होम करना’ या ‘बलि चढ़ाना’
  rationale: इस पद में आग या बलिदान का स्पष्ट उल्लेख नहीं है, यद्यपि अन्य बाइबिलीय सन्दर्भ इस रीति को बाल-बलि और आग से जोड़ते हैं। इसलिए मुख्य पाठ मूल की अभिव्यक्ति और उसकी कुछ अस्पष्टता बचाता है; सम्भावित अनुष्ठानिक अर्थ पादटिप्पणी में दिया गया है।
- issue: זֶרַע का आशय
  choice: सन्तान
  alternative: बच्चे; बीज
  rationale: कानूनी सन्दर्भ में यह शब्द वंशज या सन्तान को दर्शाता है और किसी खास आयु-वर्ग तक सीमित नहीं है। ‘सन्तान’ हिन्दी में स्वाभाविक तथा पर्याप्त व्यापक है।
- issue: לַמֹּלֶךְ में संबंध
  choice: मोलेक के लिए
  alternative: मोलेक को
  rationale: लामेद उद्देश्य, समर्पण या दिशा का भाव दे सकता है। ‘के लिए’ मूल संबंध को व्यक्त करता है, जबकि अनुष्ठान की सटीक प्रकृति को अनावश्यक रूप से निश्चित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘सन्तान’, ‘अपवित्र’ और ‘यहोवा’ धार्मिक-कानूनी प्रसंग के अनुरूप हैं। मुख्य पाठ में हिब्रू की अनुष्ठानिक अस्पष्टता सुरक्षित है और व्याख्यात्मक विस्तार पादटिप्पणी तक सीमित रखा गया है।
