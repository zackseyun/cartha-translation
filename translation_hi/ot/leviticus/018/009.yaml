source:
  edition: WLC
  text: עֶרְוַ֨ת אֲחֽוֹתְ/ךָ֤ בַת אָבִ֨י/ךָ֙ א֣וֹ בַת אִמֶּ֔/ךָ מוֹלֶ֣דֶת בַּ֔יִת א֖וֹ מוֹלֶ֣דֶת ח֑וּץ לֹ֥א תְגַלֶּ֖ה עֶרְוָתָֽ/ן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/009.yaml
  text: You shall not uncover the nakedness of your sister[a], whether your father's daughter or your mother's daughter, born in the household or born outside it.
translation:
  language: hi
  text: तुम अपनी बहन की नग्नता प्रकट न करना—चाहे वह तुम्हारे पिता की बेटी हो या तुम्हारी माता की बेटी, चाहे घर में जन्मी हो या घर के बाहर जन्मी हो।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “घर में जन्मी हो या बाहर जन्मी हो।” इब्रानी में “घर/गृहस्थी” और “बाहर” का विरोध है; “घर” का अर्थ भवन या व्यापक गृहस्थी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: עֶרְוַת / עֶרְוָתָן
  choice: का तन
  rationale: लैव्यव्यवस्था 18 में यह निषिद्ध यौन-संबंध के संदर्भ में नग्नता उघाड़ने का रूढ़ कानूनी मुहावरा है। हिंदी में ‘तन उघाड़ना’ उसके शारीरिक और मुहावरेदार बल को बनाए रखता है, जबकि केवल ‘लज्जा’ अर्थ को अस्पष्ट कर सकती है।
- source_word: אֲחוֹתְךָ
  choice: अपनी बहन
  rationale: यह सीधे पुरुष एकवचन संबोधन में निकट संबंध का शब्द है; ‘अपनी बहन’ स्वाभाविक हिंदी है।
- source_word: בַת אָבִיךָ / בַת אִמֶּךָ
  choice: तुम्हारे पिता की बेटी / तुम्हारी माता की बेटी
  rationale: मूल की समांतर और कानूनी रूप से सटीक अभिव्यक्ति सुरक्षित रखी गई है; इसमें पिता या माता की ओर से बहन दोनों सम्मिलित हैं।
- source_word: מוֹלֶדֶת
  choice: जन्मी
  rationale: यहाँ नामित पारिवारिक परिस्थिति में जन्म लेने का भाव है; ‘जन्मी’ स्पष्ट और वर्तमान हिंदी है।
- source_word: בַּיִת / חוּץ
  choice: घर में / घर से बाहर
  rationale: मूल पाठ घर अथवा गृहस्थी के भीतर और बाहर जन्म की परिस्थिति में भेद करता है। संक्षिप्त हिंदी मूल की वास्तविक स्थानगत/सामाजिक अस्पष्टता को बनाए रखती है।
- source_word: לֹא תְגַלֶּה
  choice: न उघाड़ना
  rationale: निषेधात्मक कानूनी शैली को बनाए रखते हुए ‘उघाड़ना’ עֶרְוָה के साथ बने मूल मुहावरे को दर्शाता है।
- source_word: אוֹ ... אוֹ
  choice: चाहे ... या ... चाहे ... या
  rationale: दोनों वैकल्पिक जोड़ियों को स्वाभाविक हिंदी में स्पष्ट रूप से प्रस्तुत करता है।
theological_decisions:
- issue: निषिद्ध संबंध का दायरा
  choice: निषेध अपनी बहन पर लागू है, चाहे वह पिता की ओर से हो या माता की ओर से और चाहे उसका जन्म घर के भीतर हुआ हो या बाहर।
  alternative: अंतिम पदबंधों को घर में या बाहर जन्मी बहनों के बीच सामाजिक भेद अथवा पूर्ण और सौतेली बहनों के अप्रत्यक्ष वर्गीकरण के रूप में समझा जा सकता है।
  rationale: इब्रानी कानूनी सूत्र ‘अपनी बहन’ की श्रेणी को व्यापक रूप से स्पष्ट करता है। अनुवाद बाद के कानूनी वर्गीकरण को पाठ में जोड़े बिना सभी उल्लिखित स्थितियों को निषेध में रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण कानूनी हिंदी अपनाई गई है। पुरुष एकवचन संबोधन ‘तुम’ के रूप में रखा गया है। ‘तन उघाड़ना’ मूल के यौन-कानूनी मुहावरे को अपेक्षाकृत सहज हिंदी में सुरक्षित रखता है।
