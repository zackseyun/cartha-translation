source:
  edition: WLC
  text: וְ/אִשָּׁ֥ה אֶל אֲחֹתָ֖/הּ לֹ֣א תִקָּ֑ח לִ/צְרֹ֗ר לְ/גַלּ֧וֹת עֶרְוָתָ֛/הּ עָלֶ֖י/הָ בְּ/חַיֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/018.yaml
  text: And you shall not take a woman in addition to her sister as a rival wife[a], to uncover her nakedness while her sister is still alive.
translation:
  language: hi
  text: किसी स्त्री के जीवित रहते उसकी बहन को उसकी सौत के रूप में पत्नी न बनाना और उसकी नग्नता न उघाड़ना।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “किसी स्त्री के साथ उसकी बहन को प्रतिद्वंद्वी पत्नी बनाने के लिए न लेना।” इब्रानी वाक्य संक्षिप्त है। इसका आशय किसी स्त्री के जीवित रहते उसकी बहन को दूसरी पत्नी बनाकर दोनों के बीच सौत का संबंध उत्पन्न करने के निषेध से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִשָּׁה אֶל אֲחֹתָהּ
  choice: अपनी पत्नी के रहते उसकी बहन को
  rationale: शाब्दिक संरचना ‘एक स्त्री को उसकी बहन के साथ/अतिरिक्त’ है। हिन्दी में अधिकारसूचक संबंध स्पष्ट करने और विवाह-संदर्भ को स्वाभाविक बनाने के लिए ‘अपनी पत्नी ... उसकी बहन’ कहा गया है।
- source_word: לֹא תִקָּח
  choice: पत्नी न बनाना
  rationale: यहाँ ‘लेना’ विवाह के लिए स्त्री को ग्रहण करने का प्रचलित इब्रानी प्रयोग है। हिन्दी में केवल ‘न लेना’ अस्पष्ट होता, इसलिए वैवाहिक अर्थ स्पष्ट किया गया है; निषेधात्मक कानूनी शैली भी बनी रहती है।
- source_word: לִצְרֹר
  choice: उसकी सौत बनाने के लिए
  rationale: क्रिया צרר यहाँ दो बहनों के बीच प्रतिद्वंद्वी-पत्नी का संबंध उत्पन्न करने का भाव देती है। ‘सौत’ आधुनिक हिन्दी में उसी पारिवारिक संबंध को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְגַלּוֹת עֶרְוָתָהּ
  choice: उसकी बहन का तन उघाड़ना
  rationale: यह लैव्यव्यवस्था में यौन संबंध के लिए प्रयुक्त स्थिर शिष्टोक्ति है। ‘तन उघाड़ना’ स्रोत-रूपक को बनाए रखते हुए हिन्दी में समझने योग्य है।
- source_word: עָלֶיהָ בְּחַיֶּיהָ
  choice: उसके जीवनकाल में
  rationale: वाक्यांश का अर्थ पहली बहन के जीवित रहते दूसरी बहन को पत्नी बनाने से है। ‘उसके जीवनकाल में’ मूल की संक्षिप्तता और संदर्भगत समय-सीमा दोनों रखता है।
theological_decisions:
- issue: 'निषेध का दायरा: पत्नी की बहन से विवाह'
  choice: पहली बहन के जीवित रहते उसकी बहन को अतिरिक्त पत्नी और सौत बनाने का निषेध
  alternative: दो बहनों से विवाह का हर परिस्थिति में निषेध, पहली बहन की मृत्यु के बाद भी
  rationale: לִצְרֹר और בְּחַיֶּיהָ मिलकर प्रतिद्वंद्वी वैवाहिक संबंध तथा पहली बहन के जीवनकाल की सीमा बताते हैं। अनुवाद इस स्पष्ट सीमा से आगे कोई व्यापक निषेध नहीं जोड़ता।
- issue: ‘तन उघाड़ना’ का आशय
  choice: मूल की यौन-संबंधसूचक शिष्टोक्ति को बनाए रखना
  alternative: सीधे ‘यौन संबंध रखना’ कहना
  rationale: मूल पाठ जानबूझकर शारीरिक रूपक का प्रयोग करता है। उसे बनाए रखने से लैव्यव्यवस्था की शब्दावली और उसकी गरिमापूर्ण अप्रत्यक्षता सुरक्षित रहती है।
translation_notes:
  register: आधुनिक मानक हिन्दी की गरिमापूर्ण कानूनी शैली। ‘सौत’ सामान्य पाठक के लिए प्रतिद्वंद्वी सह-पत्नी का संबंध सहज रूप से व्यक्त करता है। ‘तन उघाड़ना’ मूल इब्रानी शिष्टोक्ति को संरक्षित करता है।
