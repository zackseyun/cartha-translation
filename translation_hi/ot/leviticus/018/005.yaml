base_translation:
  language: en
  yaml_path: translation/ot/leviticus/018/005.yaml
  text: So you shall keep my statutes and my judgments[a], which if a man does them, he shall live by them[b]. I am Yahweh.
translation:
  language: hi
  text: तुम मेरी विधियों और मेरे न्याय-विधानों का पालन करना। जो मनुष्य उनका पालन करता है, वह उनके द्वारा जीवित रहेगा[a]। मैं यहोवा हूँ।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह उनमें जीवित रहेगा।” इब्रानी पूर्वसर्ग का अर्थ साधन के रूप में “उनके द्वारा” अथवा क्षेत्र के रूप में “उनमें” हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּשְׁמַרְתֶּם
  choice: इसलिए तुम ... पालन करना
  rationale: संयोजक सहित क्रिया यहाँ कानूनी निर्देश के रूप में प्रयुक्त है। ‘पालन करना’ आधुनिक हिन्दी में वाचा-संबंधी आज्ञापालन का स्वाभाविक बोध देता है; ‘इसलिए’ पिछले प्रसंग से संबंध दर्शाता है।
- source_word: חֻקֹּתַי
  choice: मेरी विधियों
  rationale: חֻקּוֹת निर्धारित विधियों या अधिनियमों को सूचित करता है। ‘विधियाँ’ औपचारिक कानूनी अर्थ बनाए रखता है।
- source_word: מִשְׁפָּטַי
  choice: मेरे न्याय-विधानों
  rationale: מִשְׁפָּטִים कानूनी निर्णयों, नियमों या अध्यादेशों का बोध करा सकता है। ‘न्याय-विधान’ חֻקּוֹת से इसका शब्दार्थगत भेद बनाए रखता है।
- source_word: אֲשֶׁר יַעֲשֶׂה אֹתָם
  choice: जो ... उनका पालन करे
  rationale: शाब्दिक ‘उन्हें करे’ हिन्दी में अस्वाभाविक है; कानूनों के संदर्भ में ‘उनका पालन करे’ वही ठोस आज्ञापालन व्यक्त करता है। संबंधवाचक रचना मूल की संक्षिप्त शर्तात्मक शक्ति बनाए रखती है।
- source_word: הָאָדָם
  choice: मनुष्य
  rationale: यहाँ एकवचन אָדָם किसी विशिष्ट पुरुष का नहीं, प्रतिनिधिक मानव का द्योतक है। ‘मनुष्य’ हिन्दी में एकवचन और व्यापक मानवीय संदर्भ दोनों को स्वाभाविक रूप से रखता है।
- source_word: וָחַי
  choice: वह ... जीवित रहेगा
  rationale: यह חיה के परिणामसूचक अर्थ का सीधा अनुवाद है और जीवन की अवधि अथवा धर्मवैज्ञानिक सीमा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: בָּהֶם
  choice: उनके द्वारा
  rationale: यहाँ בְּ का साधनसूचक अर्थ सम्भव है। ‘उनके द्वारा’ मुख्य पाठ में स्वाभाविक है, जबकि स्थान अथवा क्षेत्रसूचक ‘उनमें’ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप ‘यहोवा’ परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय नाम के रूप में प्रस्तुत करता है।
theological_decisions:
- issue: ‘उनके द्वारा जीवित रहेगा’ में जीवन का आशय
  choice: जीवन को व्यापक और अनिर्दिष्ट रखते हुए ‘जीवित रहेगा’
  alternative: देश में दीर्घ जीवन पाएगा; अनन्त जीवन पाएगा; उनके कारण जीवन प्राप्त करेगा
  rationale: इब्रानी पाठ स्वयं यह निर्धारित नहीं करता कि यहाँ केवल सांसारिक, वाचा-संबंधी या अनन्त जीवन अभिप्रेत है। इसलिए धर्मवैज्ञानिक तनाव को खुला रखा गया है।
- issue: בָּהֶם का संबंध
  choice: उनके द्वारा
  alternative: उनमें
  rationale: इब्रानी पूर्वसर्ग साधन (‘द्वारा’) अथवा क्षेत्र (‘में’) दोनों का बोध करा सकता है। मुख्य पाठ में साधनसूचक रूप चुना गया है और वास्तविक वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- issue: הָאָדָם का प्रतिनिधिक एकवचन
  choice: मनुष्य
  alternative: कोई व्यक्ति; आदमी
  rationale: मूल का एकवचन प्रतिनिधिक प्रयोग सुरक्षित है, पर ‘मनुष्य’ स्पष्ट करता है कि कथन सामान्य मानव के विषय में है, केवल पुरुष के विषय में नहीं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘विधियाँ’ और ‘न्याय-विधान’ मूल के दो कानूनी पदों का भेद बनाए रखते हैं। मुख्य पाठ में केवल वही पादटिप्पणी दी गई है जो इब्रानी בָּהֶם की वास्तविक अस्पष्टता को सुरक्षित करती है।
