source:
  edition: WLC
  text: זֹ֣את הַ/תּוֹרָ֗ה לָֽ/עֹלָה֙ לַ/מִּנְחָ֔ה וְ/לַֽ/חַטָּ֖את וְ/לָ/אָשָׁ֑ם וְ/לַ֨/מִּלּוּאִ֔ים וּ/לְ/זֶ֖בַח הַ/שְּׁלָמִֽים׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/037.yaml
  text: This is the law for the burnt offering[a], the grain offering, the sin offering, the guilt offering, the ordination offering[d][c][b], and the sacrifice of peace offerings.
translation:
  language: hi
  text: यह होमबलि, अन्नबलि, पापबलि[a], दोषबलि[b], याजकीय स्थापना-विधियों[c] और मेलबलि[d] के विषय में व्यवस्था है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द पाप से निपटने के साथ-साथ अशुद्धता दूर करने पर भी बल दे सकता है।
    reason: lexical_alternative
  - marker: b
    text: या “क्षतिपूर्ति-बलि।” इब्रानी शब्द दोष से उत्पन्न उत्तरदायित्व और आवश्यक भरपाई पर बल दे सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “याजकीय प्रतिष्ठा-संस्कार” अथवा “प्रतिष्ठा-बलि।” इब्रानी शब्द बहुवचन में है और याजकों को पद पर स्थापित करने की विधियों को सूचित करता है।
    reason: lexical_alternative
  - marker: d
    text: या “शांति-बलि,” “सहभागिता-बलि” अथवा “कल्याण-बलि।”
    reason: lexical_alternative
lexical_decisions:
- source_word: זֹאת הַתּוֹרָה
  choice: यह ... के विषय में व्यवस्था है
  rationale: स्त्रीलिंग एकवचन संकेतवाचक זֹאת और הַתּוֹרָה इस सार-वाक्य को आरम्भ करते हैं। बलिदानों के विधिक प्रसंग में ‘व्यवस्था’ स्वाभाविक है; ל उपसर्ग का विषय-सूचक भाव ‘के विषय में’ से स्पष्ट किया गया है।
- source_word: לָעֹלָה
  choice: होमबलि
  rationale: עֹלָה उस बलि को बताता है जो वेदी पर पूर्णतः जलाई जाती थी; ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में संक्षिप्त और पहचाना हुआ पद है।
- source_word: לַמִּנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के अनुष्ठानिक प्रसंग में מִנְחָה मुख्यतः अन्न या अनाज से चढ़ाई जाने वाली भेंट है; ‘अन्नबलि’ इसका सहज, संक्षिप्त रूप है।
- source_word: וְלַחַטָּאת
  choice: पापबलि
  rationale: חַטָּאת पाप तथा अशुद्धता से निपटने वाली बलि को दर्शाता है। मुख्य पाठ में परिचित ‘पापबलि’ रखा गया है और शुद्धिकरण का अर्थ-पक्ष पादटिप्पणी में सुरक्षित है।
- source_word: וְלָאָשָׁם
  choice: दोषबलि
  rationale: אָשָׁם दोष, उत्तरदायित्व और उससे जुड़ी क्षतिपूर्ति की बलि को सूचित करता है। ‘दोषबलि’ मुख्य अर्थ को संक्षेप में व्यक्त करता है।
- source_word: וְלַמִּלּוּאִים
  choice: याजकीय अभिषेक-संस्कारों
  rationale: מִלּוּאִים बहुवचन है और याजकों की स्थापना या समर्पण की प्रक्रियाओं को बताता है। इसलिए इसे केवल एक ‘बलि’ तक सीमित न करके बहुवचन ‘अभिषेक-संस्कारों’ कहा गया है।
- source_word: וּלְזֶבַח הַשְּׁלָמִים
  choice: मेलबलि
  rationale: זֶבַח הַשְּׁלָמִים बलिदान की उस श्रेणी को बताता है जिसमें शांति, कुशलता और सहभागिता के अर्थ जुड़े हैं। ‘मेलबलि’ हिन्दी में संक्षिप्त और अर्थपूर्ण है; अन्य अर्थ-पक्ष पादटिप्पणी में दिए गए हैं।
theological_decisions:
- issue: חַטָּאת का अर्थ पाप-निवारण है या शुद्धिकरण
  choice: मुख्य पाठ में ‘पापबलि’
  alternative: ‘शुद्धिकरण-बलि’
  rationale: इब्रानी पद दोनों अर्थ-क्षेत्रों से जुड़ा हो सकता है। मुख्य पाठ परिचित पद रखता है, पर पादटिप्पणी अशुद्धता दूर करने के बल को दबने नहीं देती।
- issue: מִלּוּאִים को एक चढ़ावे या व्यापक स्थापना-विधियों के रूप में समझना
  choice: ‘याजकीय अभिषेक-संस्कारों’
  alternative: ‘अभिषेक-बलि’ या ‘याजकीय स्थापना-संस्कारों’
  rationale: इब्रानी बहुवचन और याजकीय संदर्भ व्यापक स्थापना-प्रक्रियाओं की ओर संकेत करते हैं; इसलिए अनुवाद इसे एकमात्र बलि तक सीमित नहीं करता।
- issue: שְׁלָמִים में शांति, सहभागिता और कुशलता के अर्थ-पक्ष
  choice: मुख्य पाठ में ‘मेलबलि’
  alternative: ‘शान्ति-बलि’, ‘सहभागिता-बलि’ या ‘कल्याण-बलि’
  rationale: किसी एक हिन्दी पद से पूरा अर्थ-क्षेत्र व्यक्त नहीं होता। ‘मेलबलि’ संबंध और सहभागिता का संकेत देता है, जबकि विकल्प पादटिप्पणी में सुरक्षित हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदानों के पारंपरिक हिन्दी संयुक्त पदों का उपयोग किया गया है, पर जहाँ इब्रानी शब्द का अर्थ व्यापक या विवाद्य है वहाँ पादटिप्पणियों में वास्तविक विकल्प सुरक्षित रखे गए हैं।
