source:
  edition: WLC
  text: כִּ֚י כָּל אֹכֵ֣ל חֵ֔לֶב מִן הַ֨/בְּהֵמָ֔ה אֲשֶׁ֨ר יַקְרִ֥יב מִמֶּ֛/נָּה אִשֶּׁ֖ה לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הָ/אֹכֶ֖לֶת מֵֽ/עַמֶּֽי/הָ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/025.yaml
  text: For anyone who eats fat from an animal from which an offering made by fire is presented to Yahweh[b][a], the person who eats it shall be cut off from his people.
translation:
  language: hi
  text: क्योंकि जो कोई ऐसे पशु की चरबी खाए, जिसमें से यहोवा के लिए अग्नि-भेंट चढ़ाई जाती है[a], वह व्यक्ति अपने लोगों में से काट दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अग्नि पर चढ़ाई जाने वाली भेंट।” इब्रानी शब्द उस भेंट को सूचित करता है जो वेदी की आग में जलकर धुएँ के रूप में चढ़ती थी।
    reason: lexical_alternative
  - marker: b
    text: “काट दिया जाएगा” इब्रानी कानूनी सूत्र को सुरक्षित रखता है। दंड का ठीक स्वरूप विवादित है; इसका अर्थ समुदाय से निष्कासन, मृत्यु या परमेश्वर का न्याय हो सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले निषेध का कारण या आधार बताता है और पद का पूर्ववर्ती वाक्य से संबंध बनाए रखता है।
- source_word: כָּל אֹכֵל
  choice: जो कोई ... खाए
  rationale: यह अनिश्चित किंतु सार्वभौमिक कानूनी स्थिति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: חֵלֶב
  choice: चरबी
  rationale: यह बलिदान-विधि में पशु की उस चरबी को सूचित करता है जो वेदी के लिए निर्धारित थी; ‘चरबी’ इसका स्पष्ट और सामान्य हिन्दी रूप है।
- source_word: מִן הַבְּהֵמָה
  choice: ऐसे पशु की
  rationale: संदर्भ में ऐसे पशु की बात है जिसमें से यहोवा के लिए अग्नि-भेंट चढ़ाई जा सकती है; ‘पशु’ आधुनिक और व्यापक शब्द है।
- source_word: אֲשֶׁר יַקְרִיב מִמֶּנָּה
  choice: जिसमें से ... चढ़ाई जाती है
  rationale: इब्रानी में कर्ता अनिश्चित एकवचन है; हिन्दी का कर्मवाच्य उसी अनिश्चितता को स्वाभाविक रूप से बनाए रखता है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह वेदी की आग पर चढ़ाई और धुएँ में परिणत की जाने वाली भेंट का पारिभाषिक शब्द है; संक्षिप्त हिन्दी रूप मूल के अग्नि-संबंध को बनाए रखता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग समर्पण या प्रस्तुति दर्शाता है; ‘यहोवा’ इब्रानी विशिष्ट नाम יהוה को नाम के रूप में प्रत्यक्ष रखता है।
- source_word: וְנִכְרְתָה
  choice: काट दिया जाएगा
  rationale: यह तोराह का पारंपरिक वाचा-संबंधी दंडसूत्र है। शाब्दिक मुहावरा दंड की ठीक प्रकृति को अनिर्णीत रखता है।
- source_word: הַנֶּפֶשׁ הָאֹכֶלֶת
  choice: वह व्यक्ति
  rationale: कानूनी प्रसंग में נֶפֶשׁ पूरे व्यक्ति को दर्शाता है; हिन्दी में ‘व्यक्ति’ स्वाभाविक और लिंग-समावेशी है।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: स्त्रीलिंग प्रत्यय व्याकरणतः נֶפֶשׁ से मेल खाता है, अपराधी के जैविक लिंग को निर्दिष्ट नहीं करता। ‘अपने’ यह संबंध बिना अनावश्यक लिंग-निर्धारण के व्यक्त करता है।
theological_decisions:
- issue: वाचा-संबंधी दंडसूत्र וְנִכְרְתָה ... מֵעַמֶּיהָ का अर्थ
  choice: अपने लोगों में से काट दिया जाएगा
  alternative: अपने लोगों से निकाल दिया जाएगा; मार डाला जाएगा
  rationale: इस दंड की ठीक प्रकृति विवादित है—यह बहिष्कार, मृत्यु, दैवी न्याय या इनके किसी मेल की ओर संकेत कर सकती है। अनुवाद मूल मुहावरे को सुरक्षित रखकर इस तनाव का निर्णय नहीं करता।
- issue: अपराधी के लिए व्याकरणिक लिंग
  choice: वह व्यक्ति ... अपने लोगों
  alternative: वह स्त्री ... उसके लोग; वह पुरुष ... उसके लोग
  rationale: स्त्रीलिंग रूप נֶפֶשׁ के व्याकरणिक लिंग के कारण है, जबकि विधान किसी भी अपराधी पर लागू होता है। हिन्दी में ‘व्यक्ति’ और ‘अपने’ मूल के सामान्य आशय को ठीक रखते हैं।
- issue: दैवी नाम יהוה का निरूपण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में सामान्य उपाधि नहीं, इस्राएल के परमेश्वर का विशिष्ट वाचा-नाम है। ‘यहोवा’ उस नाम-सूचना को हिन्दी पाठ में प्रत्यक्ष रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। बलिदान-संबंधी पारिभाषिकता के लिए ‘चरबी’ और ‘अग्नि-भेंट’ प्रयुक्त हैं। कानूनी सूत्र को समझाकर सरल बनाने के बजाय उसके मूल रूप और अर्थगत खुलापन को बनाए रखा गया है।
