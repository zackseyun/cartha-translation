  text: וְ/נֶ֜פֶשׁ כִּֽי תִגַּ֣ע בְּ/כָל טָמֵ֗א בְּ/טֻמְאַ֤ת אָדָם֙ א֣וֹ בִּ/בְהֵמָ֣ה טְמֵאָ֗ה א֚וֹ בְּ/כָל שֶׁ֣קֶץ טָמֵ֔א וְ/אָכַ֛ל מִ/בְּשַׂר זֶ֥בַח הַ/שְּׁלָמִ֖ים אֲשֶׁ֣ר לַ/יהוָ֑ה וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/021.yaml
  text: And if a person touches anything unclean—whether human uncleanness[a], or an unclean animal, or any unclean detestable thing—and eats some of the flesh of the sacrifice of peace offerings that belongs to Yahweh[b], that person shall be cut off from his people.
translation:
  language: hi
  text: और यदि कोई व्यक्ति[a] किसी भी अशुद्ध वस्तु को—चाहे वह मनुष्य की अशुद्धता हो, कोई अशुद्ध पशु हो, या कोई भी अशुद्ध घृणित वस्तु—छुए और याहवे की शांति-बलि के मांस में से कुछ खाए, तो वह व्यक्ति अपनी प्रजा में से काट दिया जाएगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘व्यक्ति’ के लिए इब्रानी शब्द נֶפֶשׁ (नेफ़ेश) है। यह व्याकरण की दृष्टि से स्त्रीलिंग है; इसलिए आगे इब्रानी में शाब्दिक रूप से ‘उसकी प्रजा’ स्त्रीलिंग रूप में आता है, पर व्यवस्था केवल स्त्री पर लागू नहीं होती।
    reason: lexical_alternative
  - marker: b
    text: ‘काट दिया जाएगा’ वाचा के दंड का एक सूत्रबद्ध कथन है। इसका आशय प्रजा से बहिष्कार या ईश्वरीय न्याय हो सकता है; यहाँ इब्रानी पाठ दंड की ठीक रीति नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: व्यक्ति
  rationale: विधिक प्रसंग में נֶפֶשׁ किसी व्यक्तिगत मनुष्य को दर्शाता है, न कि केवल अमूर्त ‘आत्मा’ को।
- source_word: תִגַּע
  choice: छुए
  rationale: यह נגע के सामान्य अर्थ ‘छूना/संपर्क में आना’ को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּכָל טָמֵא
  choice: किसी भी अशुद्ध वस्तु को
  rationale: यह व्यापक और अनिश्चित इब्रानी पदबंध का अर्थ बनाए रखता है।
- source_word: טֻמְאַת אָדָם
  choice: मनुष्य से जुड़ी अशुद्धता
  rationale: यह मनुष्य-संबंधी आनुष्ठानिक अशुद्धता को व्यक्त करता है और किसी विशेष लिंग तक अर्थ को सीमित नहीं करता।
- source_word: בִּבְהֵמָה טְמֵאָה
  choice: कोई अशुद्ध पशु
  rationale: בְּהֵמָה के व्यापक पशु-संदर्भ के लिए यह स्पष्ट आधुनिक हिन्दी है।
- source_word: שֶׁקֶץ טָמֵא
  choice: कोई भी अशुद्ध घृणित वस्तु
  rationale: यह שֶׁקֶץ में निहित घृणा और शुद्धता-विधान की श्रेणी को बनाए रखता है, बिना उसे केवल रेंगने वाले जीवों तक सीमित किए।
- source_word: וְאָכַל מִבְּשַׂר
  choice: मांस में से कुछ खाए
  rationale: ‘में से कुछ’ विभाजक מִן को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: זֶבַח הַשְּׁלָמִים
  choice: शांति-बलि
  rationale: यह प्रचलित बलिदानी पदावली के निकट है और ‘मेलबलि’ जैसे अधिक व्याख्यात्मक विकल्प की अपेक्षा मूल शब्द से औपचारिक संबंध बनाए रखता है।
- source_word: אֲשֶׁר לַיהוָה
  choice: याहवे के लिए ठहराए गए
  rationale: यह बलि के याहवे के लिए नियत अथवा समर्पित होने का भाव स्पष्ट करता है।
- source_word: יהוה
  choice: याहवे
  rationale: यह इब्रानी व्यक्तिवाचक दिव्य नाम को नाम के रूप में प्रस्तुत करता है, उपाधि से प्रतिस्थापित नहीं करता।
- source_word: וְנִכְרְתָה ... מֵעַמֶּיהָ
  choice: उसकी प्रजा में से काट दिया जाएगा
  rationale: यह वाचा-दंड के औपचारिक कथन को सुरक्षित रखता है और दंड की ठीक रीति को अनावश्यक रूप से निश्चित नहीं करता।
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ में दंड का ठीक स्वरूप
  choice: ‘उसकी प्रजा में से काट दिया जाएगा’ के औपचारिक कथन को बनाए रखना
  alternative: ‘प्रजा से निकाल दिया जाएगा’ या ‘मार डाला जाएगा’
  rationale: इब्रानी पाठ यहाँ यह स्पष्ट नहीं करता कि दंड सामाजिक निष्कासन, मृत्यु अथवा प्रत्यक्ष ईश्वरीय न्याय के द्वारा पूरा होगा; इसलिए अनुवाद इस तनाव को खुला रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। शुद्धता-विधान की शब्दावली में ‘अशुद्ध’ की पुनरावृत्ति जानबूझकर बनाए रखी गई है। लंबे इब्रानी वाक्य को डैशों से व्यवस्थित किया गया है, पर उसकी शर्त और परिणाम की संरचना सुरक्षित है।
