source:
  edition: WLC
  text: וְ/הַ/נּוֹתָ֖ר מִ/בְּשַׂ֣ר הַ/זָּ֑בַח בַּ/יּוֹם֙ הַ/שְּׁלִישִׁ֔י בָּ/אֵ֖שׁ יִשָּׂרֵֽף׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/017.yaml
  text: But what remains of the meat of the sacrifice on the third day shall be burned in the fire[a].
translation:
  language: hi
  text: परन्तु बलिदान के मांस में से जो कुछ बच जाए, उसे तीसरे दिन आग में जला दिया जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: परन्तु ... जो कुछ बच जाए
  rationale: संयोजक वाव पिछले पद के निर्देश की अगली, किंचित विरोधसूचक बात प्रस्तुत करता है; संज्ञा के रूप में प्रयुक्त कृदन्त को स्वाभाविक हिन्दी में ‘जो कुछ बच जाए’ कहा गया है।
- source_word: מִבְּשַׂר
  choice: मांस में से
  rationale: बलिदान के भोजन-संदर्भ में בָּשָׂר के लिए ‘मांस’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है; מִן का अंशसूचक भाव ‘में से’ से व्यक्त होता है।
- source_word: הַזָּבַח
  choice: बलिदान
  rationale: זֶבַח यहाँ बलि किए गए पशु अथवा बलिदान को सूचित करता है; ‘बलिदान’ सीधा, प्रतिष्ठित और संदर्भानुकूल शब्द है।
- source_word: בַּיּוֹם הַשְּׁלִישִׁי
  choice: तीसरे दिन
  rationale: यह इब्रानी कालवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: בְּ के स्थानवाचक/साधनवाचक प्रयोग को यहाँ जलाकर नष्ट करने के संदर्भ में ‘आग में’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יִשָּׂרֵף
  choice: जला दिया जाए
  rationale: निफ़अल अपूर्ण क्रिया यहाँ विधिक निर्देश देती है; ‘जला दिया जाए’ कर्मवाच्य और आदेशात्मक-विधिक बल दोनों बनाए रखता है।
theological_decisions: []
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली रखी गई है। ‘मांस’ वर्तमान हिन्दी में ‘देह’ या ‘शरीर’ की अपेक्षा इस बलिदानी-भोजन संदर्भ को अधिक स्पष्ट करता है, इसलिए अलग पाठ-टिप्पणी आवश्यक नहीं मानी गई।
