  text: וְ/הִקְרִ֨יב מִמֶּ֤/נּוּ אֶחָד֙ מִ/כָּל קָרְבָּ֔ן תְּרוּמָ֖ה לַ/יהוָ֑ה לַ/כֹּהֵ֗ן הַ/זֹּרֵ֛ק אֶת דַּ֥ם הַ/שְּׁלָמִ֖ים ל֥/וֹ יִהְיֶֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/014.yaml
  text: And from it he shall present one from each offering as a contribution to Yahweh[c][b][a]; it shall belong to the priest who sprinkles the blood of the peace offerings.
translation:
  language: hi
  text: और वह उसमें से हर प्रकार की भेंट में से एक को यहोवा के लिए अलग किए हुए अंश[a] के रूप में चढ़ाए। वह उस याजक का होगा जो मेलबलियों का लहू छिड़कता[b] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “यहोवा के लिए उठाई हुई भेंट।” इब्रानी शब्द उस अंश को दर्शाता है जो परमेश्वर के लिए अलग करके याजक को दिया जाता था।
    reason: lexical_alternative
  - marker: b
    text: या “फेंकता” अथवा “छींटता।” इब्रानी क्रिया बलि के लहू को उछालने या छिड़कने की विधिक क्रिया बताती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: चढ़ाए
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को निकट लाकर भेंट के रूप में प्रस्तुत करना है; बलिदान के संदर्भ में ‘चढ़ाए’ स्वाभाविक और स्पष्ट है।
- source_word: מִמֶּנּוּ
  choice: उनमें से
  rationale: इब्रानी में प्रत्यय एकवचन है, पर वह पिछले पद में बताई गई भेंट-सामग्री के सामूहिक पूरे समूह की ओर संकेत करता है; हिन्दी में ‘उनमें से’ संदर्भ को स्पष्ट करता है।
- source_word: אֶחָד מִכָּל קָרְבָּן
  choice: हर प्रकार की भेंट में से एक
  rationale: 'वाक्यांश का वितरणात्मक भाव है: पिछले पद में वर्णित प्रत्येक प्रकार की रोटी में से एक। ‘प्रकार’ संदर्भ से निहित वस्तु को बिना अनावश्यक विस्तार के स्पष्ट करता है।'
- source_word: תְּרוּמָה
  choice: अलग किया हुआ अंश
  rationale: यह उस अंश को दर्शाता है जो यहोवा के लिए अलग करके अंततः याजक को दिया जाता था। यह हिन्दी में पारंपरिक किंतु अस्पष्ट ‘उठाई हुई भेंट’ की अपेक्षा अधिक बोधगम्य है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: समर्पण का भाव व्यक्त करने के लिए संबंधबोधक ל को ‘के लिए’ किया गया है; परमेश्वर के व्यक्तिगत नाम को हिन्दी के प्रचलित रूप ‘यहोवा’ में रखा गया है।
- source_word: הַזֹּרֵק
  choice: वेदी पर छिड़कता
  rationale: זרק का मूल भाव फेंकने या उछालने का है और याजकीय संदर्भ में लहू को वेदी पर फेंकने/छिड़कने की क्रिया बताता है। ‘छिड़कता’ स्वाभाविक हिन्दी है; ‘वेदी पर’ संदर्भ से स्पष्ट निहित लक्ष्य को बताता है।
- source_word: דַּם הַשְּׁלָמִים
  choice: मेलबलियों का लहू
  rationale: שְׁלָמִים के लिए ‘मेलबलि’ स्थापित और संक्षिप्त हिन्दी धार्मिक पद है, जो शांति, सहभागिता और कुशलता से जुड़े अर्थ-क्षेत्र को खुला रखता है।
- source_word: לוֹ יִהְיֶה
  choice: उस याजक का होगा
  rationale: यह इब्रानी मुहावरा अधिकार अथवा आवंटन बताता है; हिन्दी में यह रूप स्पष्ट रूप से स्वामित्व व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का रूप
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत दिव्य नाम है। ‘यहोवा’ हिन्दी पाठक के लिए परिचित रूप है और नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: שְׁלָמִים का अनुवाद
  choice: मेलबलि
  alternative: शान्ति-बलि; कुशल-बलि
  rationale: इस बलि-पद में शांति, सहभागिता और कल्याण के परस्पर जुड़े भाव हैं। ‘मेलबलि’ सहज तथा प्रचलित है, जबकि पादटिप्पणी विकल्पों द्वारा अर्थ-विस्तार सुरक्षित रखती है।
- issue: תְּרוּמָה की विधिक प्रकृति
  choice: यहोवा के लिए अलग किया हुआ अंश
  alternative: उठाई हुई भेंट
  rationale: मूल शब्द किसी समर्पित और याजक को आवंटित अंश को दर्शाता है। मुख्य पाठ क्रिया-विधि के किसी विवादित पुनर्निर्माण के बजाय उसके कार्य को व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सरल शैली रखी गई है। ‘हर प्रकार की भेंट में से एक’ पिछले पद में वर्णित विभिन्न रोटियों को स्पष्ट करता है। ‘वेदी पर’ मूल में प्रत्यक्ष नहीं है, पर लैव्यव्यवस्था की बलिदान-विधि में क्रिया का निहित लक्ष्य है। सभी पादटिप्पणी-चिह्न मुख्य पाठ में उपस्थित हैं।
