base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/005.yaml
  text: The priest shall burn them on the altar as a food offering to Yahweh[b][a]; it is a guilt offering.
translation:
  language: hi
  text: याजक उन्हें वेदी पर यहोवा के लिए अग्नि-भेंट के रूप में जलाए। यह दोषबलि[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘क्षतिपूर्ति-बलि’ अथवा पारंपरिक रूप से ‘अपराधबलि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: हिफ़ील रूप बलि के अंशों को वेदी पर जलाकर धुआँ उठाने की क्रिया व्यक्त करता है। संदर्भ के कारण सरल हिंदी ‘जलाए’ बलिदान-संबंधी अर्थ स्पष्ट रखता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह बहुवचन कर्म-सर्वनाम निकटवर्ती संदर्भ में बताए गए बलि के अंशों की ओर संकेत करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: निश्चित एकवचन संज्ञा का प्रचलित और गरिमापूर्ण हिंदी रूप।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप का शाब्दिक अर्थ ‘वेदी की ओर’ हो सकता है, पर बलि-विधान में क्रिया का स्वाभाविक हिंदी अर्थ ‘वेदी पर’ है।
- source_word: אִשֶּׁה
  choice: अग्नि में चढ़ाए जानेवाला अर्पण
  rationale: यह लैव्यव्यवस्था का तकनीकी शब्द है, जो आग के द्वारा अर्पित बलि को बताता है। यह रूप ‘भोजन-अर्पण’ जैसी विवादित व्युत्पत्तिमूलक व्याख्या थोपे बिना अग्नि के तत्व को स्पष्ट करता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: पूर्वसर्ग अर्पण के समर्पण या अभिमुखता को दर्शाता है; ‘के लिए’ सहज हिंदी में इसे व्यक्त करता है।
- source_word: אָשָׁם
  choice: दोषबलि
  rationale: लैव्यव्यवस्था में यह एक विशिष्ट बलि-श्रेणी का तकनीकी नाम है। ‘दोषबलि’ संक्षिप्त, स्थापित और मूल के दोष-संबंधी अर्थ के निकट है।
- source_word: הוּא
  choice: यह ... है
  rationale: सर्वनाम बलिदान को उसकी औपचारिक श्रेणी में पहचानता है; हिंदी में ‘यह दोषबलि है’ स्वाभाविक नामवाचक वाक्य है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में वाचा का व्यक्तिगत नाम सीधे आया है। हिंदी बाइबल परंपरा में व्यापक रूप से पहचाना जाने वाला ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से अलग रखते हुए प्रस्तुत करता है; ‘याहवे’ अधिक संभावित ऐतिहासिक उच्चारण को दर्शाने वाला विकल्प है।
- issue: तकनीकी बलि-शब्द אָשָׁם
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि / अपराधबलि
  rationale: यहाँ शब्द बलि की औपचारिक श्रेणी बताता है। ‘दोषबलि’ उसके दोष-संबंधी पहलू को रखता है, जबकि ‘क्षतिपूर्ति-बलि’ उसके प्रतिपूर्ति-पक्ष को अधिक उभारता और अर्थ को कुछ संकरा कर सकता है।
translation_notes:
  register: आधुनिक मानक हिंदी, संक्षिप्त विधिक-धार्मिक शैली। ‘याजक’, ‘वेदी’ और ‘दोषबलि’ जैसे स्थापित बलिदानी पद बनाए गए हैं। मुख्य पाठ में אִשֶּׁה के अग्नि-संबंधी अर्थ को स्पष्ट किया गया है और אָשָׁם के वैकल्पिक अर्थों को पादटिप्पणी में सुरक्षित रखा गया है।
