  yaml_path: translation/ot/leviticus/007/027.yaml
  text: Every person who eats any blood—that person shall be cut off from his people[a][b].
translation:
  language: hi
  text: जो कोई किसी भी प्रकार का खून खाएगा, उस व्यक्ति को अपने लोगों में से काट दिया जाएगा।[a][b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्राण।” यहाँ इब्रानी नेफ़ेश का अर्थ एक व्यक्ति है।
    reason: lexical_alternative
  - marker: b
    text: “काट दिया जाएगा” वाचा के दंड का एक प्रचलित सूत्र है। इसका अर्थ समुदाय से अलग किया जाना या परमेश्वर का न्याय हो सकता है; यहाँ इब्रानी पाठ दंड का ठीक स्वरूप नहीं बताता।
    reason: alternative_reading
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: व्यक्ति
  rationale: इस कानूनी संदर्भ में נֶפֶשׁ किसी व्यक्ति को सूचित करता है, न कि विशेष रूप से देह से अलग ‘आत्मा’ को। आधुनिक हिन्दी में ‘व्यक्ति’ स्वाभाविक और अर्थ-सटीक है।
- source_word: תֹּאכַל
  choice: खाएगा
  rationale: सापेक्ष उपवाक्य में अपूर्ण क्रिया सामान्य कानूनी स्थिति व्यक्त करती है। हिन्दी का ‘जो कोई…खाएगा’ इस सामान्य और भावी कानूनी बल को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָּל דָּם
  choice: किसी भी प्रकार का खून
  rationale: अगणनीय संज्ञा के साथ כָּל यहाँ वितरणात्मक अर्थ देता है—किसी भी रूप या प्रकार का खून—न कि मात्र कुल मात्रा के अर्थ में ‘सारा खून’।
- source_word: וְנִכְרְתָה
  choice: काट डाला जाएगा
  rationale: यह כרת के निफ़अल रूप में मानक वाचागत-दंड सूत्र है। ‘काट डाला जाएगा’ मूल रूपक और दंड के ठीक स्वरूप की अस्पष्टता को बनाए रखता है।
- source_word: הַנֶּפֶשׁ הַהִוא
  choice: वह व्यक्ति
  rationale: संज्ञा और संकेतवाचक की पुनरावृत्ति पहले बताए अपराधी को बल देकर फिर से निर्दिष्ट करती है; ‘वह व्यक्ति’ इसे साफ़ और स्वाभाविक हिन्दी में रखता है।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: इब्रानी स्त्रीलिंग प्रत्यय נֶפֶשׁ के व्याकरणिक लिंग के कारण है। ‘अपने लोगों में से’ स्त्री-पुरुष दोनों पर लागू होने वाला स्वाभाविक रूप है और समुदाय से संबंध बनाए रखता है।
theological_decisions:
- issue: वाचा-संबंधी दंडसूत्र ‘काट डाला जाएगा’ का अर्थ
  choice: औपचारिक अभिव्यक्ति ‘अपने लोगों में से काट डाला जाएगा’ को बनाए रखना
  alternative: ‘मार डाला जाएगा,’ ‘समुदाय से निकाल दिया जाएगा,’ या ‘परमेश्वर द्वारा नष्ट किया जाएगा’
  rationale: इब्रानी सूत्र संक्षिप्त है और यहाँ दंड की ठीक विधि स्पष्ट नहीं करता। अनुवाद मृत्यु, बहिष्कार या सीधे ईश्वरीय न्याय में से किसी एक अर्थ को निर्णायक नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘खून’ दैनिक आधुनिक हिन्दी में ‘रक्त’ से अधिक सहज है, जबकि कानूनी गंभीरता वाक्य-संरचना और दंडसूत्र से बनी रहती है। दोनों पादटिप्पणी-चिह्न मुख्य पाठ में दिए गए हैं।
