base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/004.yaml
  text: and the two kidneys[a], and the fat that is on them, which is on the loins, and the appendage on the liver, which he shall remove with the kidneys.
translation:
  language: hi
  text: और दोनों गुर्दे, और उन पर की वह चर्बी जो कटि-प्रदेश पर है, और कलेजे पर का उभार[a]—उसे वह गुर्दों के साथ निकाल ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कलेजे की पाली”; इस शारीरिक भाग के लिए प्रयुक्त इब्रानी शब्द तकनीकी है और यह ठीक किस भाग को दर्शाता है, इस पर मतभेद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: बलि-संबंधी शरीर-रचना में כְּלָיֹת स्पष्ट रूप से गुर्दों को दर्शाता है; आधुनिक हिन्दी में यही सहज और सटीक शब्द है।
- source_word: הַחֵלֶב אֲשֶׁר עֲלֵיהֶן
  choice: उन पर की चर्बी
  rationale: חֵלֶב यहाँ बलि के लिए अलग किए जाने वाले चरबीदार भाग को दर्शाता है, और עַל का सीधा अर्थ ‘पर’ रखा गया है।
- source_word: אֲשֶׁר עַל הַכְּסָלִים
  choice: जो कमर के पास है
  rationale: כְּסָלִים गुर्दों के निकट कमर/पार्श्व के क्षेत्र को दर्शाता है। ‘कमर के पास’ सामान्य पाठक के लिए स्वाभाविक है और शरीर-स्थान को स्पष्ट करता है।
- source_word: הַיֹּתֶרֶת עַל הַכָּבֵד
  choice: कलेजे पर का उभार
  rationale: יוֹתֶרֶת बलि-विधान में प्रयुक्त एक तकनीकी शारीरिक शब्द है। ‘उभार’ किसी निकले या जुड़े हुए भाग का संकेत देता है, पर विवादित शरीर-रचना को अनावश्यक रूप से निश्चित नहीं करता। ‘कलेजा’ आधुनिक सामान्य हिन्दी में liver के लिए सहज है।
- source_word: עַל הַכְּלָיֹת יְסִירֶנָּה
  choice: इसे वह गुर्दों के साथ निकाल दे
  rationale: इस बलि-सूत्र में עַל הַכְּלָיֹת को गुर्दों के साथ उस भाग को निकालने के प्रक्रियात्मक संबंध के रूप में समझना स्वाभाविक है। יְסִירֶנָּה निर्देशात्मक क्रिया है, इसलिए ‘निकाल दे’ उपयुक्त है।
