  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद का आरंभ ‘और’ से किया गया है ताकि पिछले पद से उसका वाक्यगत संबंध बना रहे। तकनीकी शारीरिक शब्द के लिए मुख्य पाठ में स्पष्ट किंतु अनिर्णायक ‘उभार’ और पादटिप्पणी में वैकल्पिक ‘पाली’ दिया गया है।
