language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר הַ/מַּקְרִ֞יב אֶת זֶ֤בַח שְׁלָמָי/ו֙ לַ/יהוָ֔ה יָבִ֧יא אֶת קָרְבָּנ֛/וֹ לַ/יהוָ֖ה מִ/זֶּ֥בַח שְׁלָמָֽי/ו־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/029.yaml
  text: 'Speak to the sons of Israel[b][a], saying: The one who presents his peace sacrifice to Yahweh shall bring his offering to Yahweh from his peace sacrifice.'
translation:
  language: hi
  text: '“इस्राएलियों से कह: जो व्यक्ति यहोवा के लिये अपनी मेलबलि चढ़ाता है, वह अपनी मेलबलि में से अपनी भेंट यहोवा के लिये ले आए।”'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: דַּבֵּר אֶל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से कह
  rationale: בני ישראל का शाब्दिक रूप ‘इस्राएल के पुत्र’ है, पर यहाँ पूरा वाचा-समुदाय संबोधित है; आधुनिक हिन्दी में ‘इस्राएली’ स्वाभाविक और समावेशी सामूहिक रूप है। एकवचन ‘कह’ मूसा को दिए गए आदेश से मेल खाता है।
- source_word: הַמַּקְרִיב
  choice: जो व्यक्ति ... चढ़ाता है
  rationale: קרב के हिफ़ईल रूप का बल किसी वस्तु को परमेश्वर के सामने प्रस्तुत/निकट लाने पर है। बलिदान-संदर्भ में ‘चढ़ाता है’ सहज हिन्दी है और अनुष्ठानिक अर्थ स्पष्ट रखता है।
- source_word: זֶבַח שְׁלָמָיו
  choice: अपना मेलबलि
  rationale: זבח बलिदान को और שלמים कल्याण/शांति से जुड़े विशिष्ट बलिदान-वर्ग को दर्शाता है। हिन्दी बाइबलीय प्रयोग ‘मेलबलि’ संक्षिप्त है और इसे केवल सामान्य ‘भेंट’ बनने से रोकता है।
- source_word: לַיהוָה
  choice: यहोवा के लिए / यहोवा के पास
  rationale: दिव्य नाम יהוה को हिन्दी में प्रचलित रूप ‘यहोवा’ से व्यक्त किया गया है। पहले प्रयोग में ל उद्देश्य/प्राप्तकर्ता बताता है; दूसरे में भेंट परमेश्वर के सम्मुख लाने का भाव है।
- source_word: יָבִיא אֶת קָרְבָּנוֹ
  choice: अपनी भेंट ... ले आए
  rationale: कानूनी प्रसंग में imperfect निर्देशात्मक दायित्व व्यक्त करता है। ‘ले आए’ हिन्दी में आज्ञात्मक-नियमात्मक बल रखता है; קרבן के लिए ‘भेंट’ सामान्य और स्पष्ट समतुल्य है।
- source_word: מִזֶּבַח שְׁלָמָיו
  choice: अपने मेलबलि में से
  rationale: 'מן का अंशसूचक अर्थ सुरक्षित रखा गया है: यह भेंट उसी मेलबलि में से लाई जानी है।'
theological_decisions:
- issue: יהוה का हिन्दी रूप
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल पाठ के व्यक्तिगत वाचा-नाम को सामान्य उपाधि में विलीन न करते हुए हिन्दी पाठकों में परिचित नाम-रूप अपनाया गया है।
- issue: שְׁלָמִים की बलिदानी संज्ञा
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि / कुशल-बलि
  rationale: शब्द शांति, कल्याण और सहभागिता से जुड़ा विशिष्ट बलिदान-वर्ग है। ‘मेलबलि’ परिचित और संक्षिप्त है, जबकि किसी एक संभावित धार्मिक अर्थ को अत्यधिक निश्चित नहीं करता।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक आशय
  choice: इस्राएली
  alternative: इस्राएल के पुत्र / इस्राएल की सन्तान
  rationale: इब्रानी मुहावरा वाचा-समुदाय का सामूहिक नाम है। आधुनिक हिन्दी में ‘इस्राएली’ उसके स्वाभाविक आशय को व्यक्त करता है और संबोधन को केवल पुरुषों तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुरूप रखी गई है। ‘कह’ और ‘ले आए’ सीधे आदेश का स्वर बनाए रखते हैं; तकनीकी बलिदानी पद के रूप में ‘मेलबलि’ प्रयुक्त है।
