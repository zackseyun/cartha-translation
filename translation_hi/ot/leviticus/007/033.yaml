source:
  edition: WLC
  text: הַ/מַּקְרִ֞יב אֶת דַּ֧ם הַ/שְּׁלָמִ֛ים וְ/אֶת הַ/חֵ֖לֶב מִ/בְּנֵ֣י אַהֲרֹ֑ן ל֧/וֹ תִהְיֶ֛ה שׁ֥וֹק הַ/יָּמִ֖ין לְ/מָנָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/033.yaml
  text: The one from among the sons of Aaron who presents the blood of the peace offerings and the fat—to him the right thigh shall belong as his portion.
translation:
  language: hi
  text: हारून के पुत्रों में से जो मेलबलियों[a] का लहू और चरबी चढ़ाता है, दाहिनी जाँघ उसके भाग के रूप में उसे मिलेगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘सहभागिता-बलियों’।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמַּקְרִיב
  choice: जो ... चढ़ाता है
  rationale: हिफ़ील कृदंत बलि-संबंधी वस्तु को वेदी के निकट लाने या प्रस्तुत करने का बोध देता है। हिंदी के याजकीय संदर्भ में ‘चढ़ाता है’ स्वाभाविक है और कृदंत की निरंतर/भूमिका-सूचक शक्ति को बनाए रखता है।
- source_word: דַּם
  choice: लहू
  rationale: बलि-विधान में प्रचलित, स्पष्ट और गरिमापूर्ण हिंदी शब्द।
- source_word: הַשְּׁלָמִים
  choice: मेलबलियों
  rationale: यह एक विशिष्ट बलि-श्रेणी का शब्द है, जिसका संबंध शांति, कुशल और मेल से है। ‘मेलबलि’ संक्षिप्त पारिभाषिक रूप है; वैकल्पिक अर्थ फुटनोट में रखा गया है।
- source_word: הַחֵלֶב
  choice: चरबी
  rationale: बलि में निर्धारित वसायुक्त भागों के लिए स्रोत का सीधा और संदर्भानुकूल अनुवाद।
- source_word: מִבְּנֵי אַהֲרֹן
  choice: हारून के पुत्रों में से
  rationale: מִן चयन को पूरे समूह के भीतर से चिह्नित करता है। ‘पुत्रों’ मूल की स्पष्ट पुल्लिंग और पारिवारिक अभिव्यक्ति को सुरक्षित रखता है।
- source_word: לוֹ תִהְיֶה
  choice: उसी की होगी
  rationale: विधिक अधिकार और आवंटन को स्वाभाविक हिंदी में व्यक्त करता है; ‘उसी’ उस याजक पर बल देता है जो अनुष्ठान करता है।
- source_word: שׁוֹק הַיָּמִין
  choice: दाहिनी जाँघ
  rationale: שׁוֹק बलि-पशु की जाँघ/ऊपरी टाँग के हिस्से को दर्शाता है; ‘जाँघ’ सामान्य ‘टाँग’ से अधिक सटीक है।
- source_word: לְמָנָה
  choice: उसके भाग के रूप में
  rationale: निर्धारित हिस्से या आवंटन का विधिक भाव स्पष्ट करता है।
theological_decisions:
- issue: याजकीय विधान में בְּנֵי אַהֲרֹן का अनुवाद
  choice: हारून के पुत्रों
  alternative: हारून के वंशजों / हारून के परिवार
  rationale: मूल पद स्पष्ट रूप से पुल्लिंग बहुवचन है और बलि-सेवा करने वाले याजकों को ठोस रूप से निर्दिष्ट करता है; इसलिए इसे लिंग-निरपेक्ष या अधिक व्यापक नहीं बनाया गया।
- issue: שְׁלָמִים की बलि-श्रेणी
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि
  rationale: शब्द में शांति, कुशलता और मेल के अर्थ-संबंध हैं। मुख्य पाठ में परिचित पारिभाषिक रूप रखा गया है और वास्तविक वैकल्पिक समझ फुटनोट में दी गई है।
translation_notes:
  register: आधुनिक मानक हिंदी में संक्षिप्त, विधिक और गरिमापूर्ण शैली। वाक्य की विषय-संरचना और याजक के विशेष अधिकार पर मूल का बल सुरक्षित रखा गया है।
