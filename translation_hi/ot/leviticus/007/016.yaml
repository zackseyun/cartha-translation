  text: וְ/אִם נֶ֣דֶר א֣וֹ נְדָבָ֗ה זֶ֚בַח קָרְבָּנ֔/וֹ בְּ/י֛וֹם הַקְרִיב֥/וֹ אֶת זִבְח֖/וֹ יֵאָכֵ֑ל וּ/מִֽ/מָּחֳרָ֔ת וְ/הַ/נּוֹתָ֥ר מִמֶּ֖/נּוּ יֵאָכֵֽל־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/016.yaml
  text: But if the sacrifice of his offering is a vow or a freewill offering[a], it shall be eaten on the day he presents his sacrifice, and on the next day what remains of it may be eaten.
translation:
  language: hi
  text: परन्तु यदि उसके चढ़ावे का बलिदान मन्नत-भेंट या स्वेच्छा-भेंट[a] हो, तो जिस दिन वह अपना बलिदान चढ़ाए, उसी दिन उसे खाया जाए; और अगले दिन उसमें से जो बचा हो, वह भी खाया जा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मन्नत-भेंट’ का अनुवाद ‘मन्नत’ भी हो सकता है। इब्रानी पाठ मन्नत से संबंधित बलिदान और स्वेच्छा से दी गई भेंट के बीच भेद करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶדֶר
  choice: किसी मन्नत के कारण
  rationale: यहाँ נֶדֶר स्वयं मन्नत अथवा मन्नत पूरी करने से संबंधित चढ़ावे को सूचित करता है। संदर्भ में बलिदान की प्रेरणा या श्रेणी बताने के लिए यह वाक्यांश स्वाभाविक और स्पष्ट है।
- source_word: נְדָבָה
  choice: स्वेच्छा-भेंट
  rationale: यह शब्द बाध्यता से नहीं, अपनी इच्छा से दी गई भेंट को दर्शाता है। ‘स्वेच्छा-भेंट’ आधुनिक हिन्दी में संक्षिप्त और याजकीय संदर्भ के अनुकूल है।
- source_word: זֶבַח קָרְבָּנוֹ
  choice: उसके चढ़ावे का बलिदान
  rationale: ‘चढ़ावा’ और ‘बलिदान’ दोनों शब्द रखकर इब्रानी पदबंध के दोनों विशिष्ट तत्वों को सुरक्षित रखा गया है।
- source_word: בְּיוֹם הַקְרִיבוֹ אֶת זִבְחוֹ
  choice: उसका बलिदान चढ़ाए जाने के दिन
  rationale: קרב का हिफ़ील रूप बलिदान को प्रस्तुत या चढ़ाने का अर्थ देता है। कर्मवाच्य हिन्दी कानूनी निर्देश में स्वाभाविक है और अनिर्दिष्ट कर्ता को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יֵאָכֵל
  choice: उसे खाया जाए
  rationale: निफ़अल रूप और विधिक-निर्देशात्मक बल को हिन्दी के कर्मवाच्य विधान से व्यक्त किया गया है।
- source_word: וּמִמָּחֳרָת
  choice: और अगले दिन
  rationale: מָחֳרָת का अर्थ उसके बाद आने वाला दिन है; यह आधुनिक हिन्दी में सीधा और स्पष्ट रूप है।
- source_word: וְהַנּוֹתָר מִמֶּנּוּ
  choice: उसमें से जो बचा हो
  rationale: भागसूचक מִמֶּנּוּ और बचे हुए अंश का अर्थ स्वाभाविक हिन्दी में सुरक्षित रहता है।
- source_word: יֵאָכֵל
  choice: वह भी खाया जा सकता है
  rationale: दूसरी बार वही इब्रानी रूप दूसरे दिन बचे अंश को खाने की अनुमति व्यक्त करता है; ‘जा सकता है’ प्रसंगगत अनुमतिपरक बल स्पष्ट करता है।
