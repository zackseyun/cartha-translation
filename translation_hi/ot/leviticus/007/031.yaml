source:
  edition: WLC
  text: וְ/הִקְטִ֧יר הַ/כֹּהֵ֛ן אֶת הַ/חֵ֖לֶב הַ/מִּזְבֵּ֑חָ/ה וְ/הָיָה֙ הֶֽ/חָזֶ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָֽי/ו־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/031.yaml
  text: The priest shall burn the fat on the altar[a], and the breast shall belong to Aaron and to his sons.
translation:
  language: hi
  text: और याजक चरबी को वेदी पर जलाए[a], और छाती हारून और उसके पुत्रों के लिए हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “चरबी को वेदी पर धुएँ में चढ़ाए।”
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: बलिदान-संबंधी प्रसंग में קטר का हिफ़ील रूप वेदी पर किसी अर्पण को जलाने, विशेषतः उसका धुआँ ऊपर उठाने, को व्यक्त करता है। सरल मुख्य पाठ में “जलाए” स्वाभाविक है; धुएँ की बारीकी पादटिप्पणी में सुरक्षित है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-संबंधी संदर्भ में כֹּהֵן के लिए यह मानक, गरिमापूर्ण और सुबोध हिन्दी शब्द है; एकवचन भी सुरक्षित है।
- source_word: הַחֵלֶב
  choice: चरबी
  rationale: यहाँ חֵלֶב पशु की वे चरबीदार चढ़ावे की थैलियाँ/भाग सूचित करता है जिन्हें वेदी पर जलाया जाता था; “चरबी” आधुनिक हिन्दी में सटीक और स्पष्ट है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय को शब्दशः “वेदी की ओर” कहा जा सकता है, पर הִקְטִיר के साथ अनुष्ठानिक क्रिया का स्वाभाविक अर्थ वेदी पर जलाना है।
- source_word: וְהָיָה
  choice: की हो
  rationale: शाब्दिक अर्थ “और वह हो” है, किंतु यहाँ विधानात्मक संदर्भ में यह हिस्से के आवंटन और अधिकार को दर्शाता है। “की हो” उस अर्थ को संक्षिप्त और स्वाभाविक रूप में व्यक्त करता है।
- source_word: הֶחָזֶה
  choice: छाती
  rationale: बलिदान-विधान में חָזֶה पशु की छाती के उस निश्चित भाग को दर्शाता है जो याजकों को दिया जाता था।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों की
  rationale: לְ यहाँ स्वामित्व अथवा आवंटन दर्शाता है। हिन्दी में “की हो” के साथ यह रचना कानूनी अधिकार को सहजता से व्यक्त करती है।
theological_decisions: []
