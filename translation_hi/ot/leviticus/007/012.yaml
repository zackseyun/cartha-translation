reference: Leviticus 7:12
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: אִ֣ם עַל תּוֹדָה֮ יַקְרִיבֶ/נּוּ֒ וְ/הִקְרִ֣יב עַל זֶ֣בַח הַ/תּוֹדָ֗ה חַלּ֤וֹת מַצּוֹת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֣ים בַּ/שָּׁ֑מֶן וְ/סֹ֣לֶת מֻרְבֶּ֔כֶת חַלֹּ֖ת בְּלוּלֹ֥ת בַּ/שָּֽׁמֶן־׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/012.yaml
  text: If he offers it as a thanksgiving offering[a], then with the sacrifice of thanksgiving he shall offer unleavened loaves mixed with oil, unleavened wafers anointed with oil[c][b], and cakes of fine flour well mixed with oil.
translation:
  language: hi
  text: यदि वह उसे धन्यवाद-बलि[a] के रूप में चढ़ाए, तो वह धन्यवाद की बलि के साथ तेल में मिलाई हुई अख़मीरी रोटियाँ, तेल लगी हुई अख़मीरी पतली रोटियाँ, और तेल में मिलाई हुई बारीक आटे की अच्छी तरह तैयार की गई रोटियाँ[b] चढ़ाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “धन्यवाद की भेंट।” इब्रानी शब्द תּוֹדָה उस बलि को दर्शाता है जो धन्यवाद व्यक्त करने के लिए चढ़ाई जाती थी।
    reason: lexical_alternative
  - marker: b
    text: “अच्छी तरह तैयार की गई” के लिए इब्रानी शब्द की ठीक पाक-विधि अनिश्चित है; यह बारीक आटे को तेल के साथ अच्छी तरह मिलाने या गूँधने का संकेत दे सकता है।
    reason: cultural_note
lexical_decisions:
- source_word: תּוֹדָה
  choice: धन्यवाद-बलि
  rationale: यहाँ यह शब्द धन्यवाद व्यक्त करने के लिए चढ़ाए जाने वाले मेलबलि के एक प्रकार को सूचित करता है। ‘धन्यवाद-बलि’ अर्थ को स्पष्ट और संक्षिप्त रूप में रखता है।
- source_word: יַקְרִיבֶנּוּ
  choice: उसे ... चढ़ाए
  rationale: हिफ़ईल रूप का बलिदानी संदर्भ में स्वाभाविक अर्थ किसी भेंट या बलि को चढ़ाना है।
- source_word: זֶבַח הַתּוֹדָה
  choice: धन्यवाद का मेलबलि
  rationale: זֶבַח बलि को और תּוֹדָה उसके धन्यवाद-संबंधी प्रकार को बताता है। व्यापक प्रसंग में यह मेलबलि की श्रेणी है, इसलिए ‘मेलबलि’ संबंध को स्पष्ट करता है।
- source_word: חַלּוֹת מַצּוֹת
  choice: अख़मीरी रोटियाँ
  rationale: חַלּוֹת रोटी जैसे पके हुए पदार्थ और מַצּוֹת उनके बिना ख़मीर के होने को दर्शाता है।
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: तेल में गूँधी हुई
  rationale: בלל सामग्री को तेल के साथ मिलाने का संकेत देता है; आटे के संदर्भ में ‘गूँधी हुई’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: רְקִיקֵי מַצּוֹת
  choice: अख़मीरी पपड़ियाँ
  rationale: רְקִיקִים पतली, चपटी रोटी या वेफ़र जैसे खाद्य पदार्थ हैं; ‘पपड़ियाँ’ उनकी पतली बनावट को सहज हिन्दी में व्यक्त करता है।
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: तेल लगाई हुई
  rationale: משׁח का मूल भाव पोतना या लगाना है। खाद्य-तैयारी के संदर्भ में यह अनुष्ठानिक ‘अभिषेक’ के बजाय तेल लगाने की क्रिया बताता है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: סֹלֶת बारीक, उत्तम आटे को दर्शाता है; आधुनिक सामान्य हिन्दी में ‘मैदा’ इसका सबसे सहज पाक-संबंधी पद है।
- source_word: מֻרְבֶּכֶת
  choice: अच्छी तरह मिलाए हुए
  rationale: इस दुर्लभ पाक-संबंधी रूप की ठीक प्रक्रिया अनिश्चित है। यह अनुवाद मिश्रण के सामान्य अर्थ को रखता है और अनावश्यक विशिष्टता से बचता है।
- source_word: חַלֹּת
  choice: रोटियाँ
  rationale: शब्द रोटी या केक जैसे पके हुए खाद्य पदार्थ को दर्शाता है; ‘रोटियाँ’ सामान्य पाठक के लिए स्वाभाविक और पर्याप्त व्यापक है।
theological_decisions:
- issue: תּוֹדָה का बलिदानी वर्गीकरण
  choice: धन्यवाद-बलि; दूसरी बार ‘धन्यवाद का मेलबलि’
  alternative: स्तुति-बलि / धन्यवाद का बलिदान
  rationale: तत्काल शब्दार्थ धन्यवाद है, जबकि लैव्यव्यवस्था 7 का प्रसंग इसे मेलबलि का प्रकार दिखाता है। अनुवाद दोनों बातों को बनाए रखता है और किसी विशिष्ट सांप्रदायिक व्याख्या को नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण विधिक-धार्मिक रजिस्टर रखा गया है। ‘अख़मीरी’, ‘मेलबलि’ और ‘मैदा’ जैसे प्रचलित बाइबिलीय तथा पाक-संबंधी शब्द सामान्य पाठक की समझ और स्रोत की विशिष्टता के बीच संतुलन रखते हैं।
