  yaml_path: translation/ot/leviticus/007/006.yaml
  text: Every male among the priests may eat it[a]; it shall be eaten in a holy place[b]. It is most holy.
translation:
  language: hi
  text: याजकों में से हर पुरुष उसे खा सकता है[a]। उसे किसी पवित्र स्थान में ही खाया जाना चाहिए। वह परमपवित्र है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजकों में से हर पुरुष उसे खाए।” इब्रानी क्रिया को अधिक औपचारिक रूप से आज्ञा के रूप में भी अनूदित किया जा सकता है; संदर्भ में यह याजकीय समूह के किसी भी पुरुष सदस्य को उसे खाने का अधिकार दिए जाने का भाव रखती है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से “पवित्रताओं का पवित्र”; यह मुहावरा उच्चतम स्तर की पवित्रता को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כָּל זָכָר בַּכֹּהֲנִים
  choice: याजकों में से हर पुरुष
  rationale: यह पदबंध याजकीय समूह के प्रत्येक पुरुष सदस्य को अलग-अलग सम्मिलित करता है; ‘पुरुष’ मूल पाठ में दिए लिंग-निर्देश को बनाए रखता है।
- source_word: יֹאכְלֶנּוּ
  choice: उसे खा सकता है
  rationale: इस विधिक संदर्भ में अपूर्ण क्रिया अधिकृत अनुमति या अधिकार व्यक्त करती है, केवल भविष्यकाल नहीं।
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: ‘स्थान’ के साथ निश्चित उपपद नहीं है; इसलिए यह अनुवाद किसी एक विशिष्ट ‘पवित्रस्थान’ का अनावश्यक संकेत नहीं देता।
- source_word: יֵאָכֵל
  choice: खाया जाए
  rationale: निफ़अल रूप कर्मवाच्य विधिक निर्देश देता है और खाने के निर्धारित स्थान पर बल रखता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: शाब्दिक ‘पवित्रताओं का पवित्र’ उच्चतम पवित्रता का इब्रानी मुहावरा है; ‘परमपवित्र’ बलि-संबंधी श्रेणी को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הוּא
  choice: वह है
  rationale: सर्वनाम संदर्भ में बताए गए बलि-भाग की ओर लौटता है।
theological_decisions:
- issue: भोजन का अधिकार याजकों में पुरुषों तक सीमित होना
  choice: याजकों में से हर पुरुष उसे खा सकता है
  alternative: हर याजक उसे खा सकता है
  rationale: इब्रानी पाठ में ‘हर’ और ‘पुरुष’ दोनों स्पष्ट हैं; सामान्यीकृत अनुवाद मूल विधान के लिंग-संबंधी प्रतिबंध को मिटा देगा।
- issue: יֹאכְלֶנּוּ में अनुमति और आदेश के बीच अर्थ-संभावना
  choice: खा सकता है
  alternative: खाए
  rationale: बलि-विधान के संदर्भ में यह पात्र याजकीय पुरुषों के अधिकृत अधिकार को व्यक्त कर सकता है; अधिक औपचारिक आज्ञार्थक अनुवाद भी व्याकरणतः संभव है, इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘खा सकता है’ अनुमति का स्वाभाविक बोध देता है; ‘किसी पवित्र स्थान’ अनिश्चितता को बनाए रखता है; ‘परमपवित्र’ बलि-विधान की पारंपरिक धार्मिक गंभीरता को संक्षेप में व्यक्त करता है।
