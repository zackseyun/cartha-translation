  text: אֲשֶׁ֨ר צִוָּ֧ה יְהוָ֛ה אֶת מֹשֶׁ֖ה בְּ/הַ֣ר סִינָ֑י בְּ/י֨וֹם צַוֺּת֜/וֹ אֶת בְּנֵ֣י יִשְׂרָאֵ֗ל לְ/הַקְרִ֧יב אֶת קָרְבְּנֵי/הֶ֛ם לַ/יהוָ֖ה בְּ/מִדְבַּ֥ר סִינָֽי־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/038.yaml
  text: which Yahweh commanded Moses on Mount Sinai[a], on the day when he commanded the sons of Israel to present their offerings to Yahweh in the wilderness of Sinai.
translation:
  language: hi
  text: जिसकी आज्ञा याहवे ने मूसा को सीनै पर्वत पर उस दिन दी, जिस दिन उसने इस्राएल के पुत्रों[a] को सीनै के निर्जन प्रदेश में अपने चढ़ावे याहवे के लिए अर्पित करने की आज्ञा दी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् ‘इस्राएली’ या ‘इस्राएल के लोग।’ इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्र’ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक सर्वनाम पिछले पद में दी गई विधियों की सूची से इस वाक्य को जोड़ता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: व्यवस्थागत और उपासना-संबंधी प्रसंग में क्रिया के अधिकारपूर्ण भाव को बनाए रखता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी परमेश्वर-नाम का शीर्षक से प्रतिस्थापन करने के बजाय देवनागरी में सीधा लिप्यंतरण।
- source_word: בְּהַר סִינָי
  choice: सीनै पर्वत पर
  rationale: इब्रानी स्थान-सूचक वाक्यांश का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: בְּיוֹם צַוֹּתוֹ
  choice: उस दिन ... जब उसने ... आज्ञा दी थी
  rationale: इब्रानी की स्पष्ट काल-सूचना और सर्वनाम-सहित क्रियार्थक रचना को पठनीय हिन्दी उपवाक्य में व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: मूल के पारिवारिक और पुल्लिंग बहुवचन रूप को सीधे बनाए रखता है; अधिक मुहावरेदार विकल्प पाद-टिप्पणी में दिया गया है।
- source_word: לְהַקְרִיב
  choice: अर्पित करने
  rationale: बलि-संबंधी प्रसंग में ‘समीप लाने/प्रस्तुत करने’ के अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: קָרְבְּנֵיהֶם
  choice: अपने चढ़ावे
  rationale: यह व्यापक बलि-संबंधी संज्ञा है जो अध्याय में बताए गए विभिन्न प्रकार के चढ़ावों को समेटती है।
- source_word: בְּמִדְבַּר סִינָי
  choice: सीनै के निर्जन प्रदेश में
  rationale: מִדְבָּר के उजाड़, कम आबादी वाले भूभाग के अर्थ को ‘रेगिस्तान’ तक सीमित किए बिना व्यक्त करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिगत परमेश्वर-नाम है; ‘याहवे’ उसके प्रचलित विद्वत्तापूर्ण उच्चारण का देवनागरी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: בְּנֵי יִשְׂרָאֵל की पारिवारिक अभिव्यक्ति
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली; इस्राएल के लोग
  rationale: मुख्य पाठ मूल की शाब्दिक पारिवारिक बनावट को सुरक्षित रखता है, जबकि पाद-टिप्पणी हिन्दी के स्वाभाविक सामूहिक विकल्प स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य पिछले पद से जुड़ा संबंधवाचक खंड है, इसलिए आरंभ में ‘जिसे’ रखा गया है। ‘चढ़ावे अर्पित करना’ उपासना-संबंधी अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
