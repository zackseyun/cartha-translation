  text: וְ/כָל מִנְחָ֗ה אֲשֶׁ֤ר תֵּֽאָפֶה֙ בַּ/תַּנּ֔וּר וְ/כָל נַעֲשָׂ֥ה בַ/מַּרְחֶ֖שֶׁת וְ/עַֽל מַחֲבַ֑ת לַ/כֹּהֵ֛ן הַ/מַּקְרִ֥יב אֹתָ֖/הּ ל֥/וֹ תִֽהְיֶֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/009.yaml
  text: And every grain offering that is baked in the oven[a], and everything prepared in a pan or on a griddle, shall belong to the priest who presents it.
translation:
  language: hi
  text: और प्रत्येक अन्नबलि जो तंदूर में पकाई जाए, तथा जो कड़ाही में या तवे पर तैयार की जाए, उसे अर्पित करने वाले याजक की होगी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में यह सामान्य भेंट नहीं, अनाज से तैयार की गई भेंट है; ‘अन्नबलि’ संक्षिप्त, प्रचलित और संदर्भानुकूल है।
- source_word: תֵּאָפֶה בַּתַּנּוּר
  choice: तंदूर में पकाई जाए
  rationale: निफ़अल रूप निष्क्रिय अर्थ देता है। ‘तंदूर’ प्राचीन भट्ठीनुमा पकाने के साधन के लिए स्वाभाविक हिन्दी शब्द है; ‘पकाई जाए’ रोटी आदि को सेंकने/पकाने के व्यापक अर्थ को सहज रूप से व्यक्त करता है।
- source_word: נַעֲשָׂה
  choice: तैयार किया जाए
  rationale: עשה का अर्थ व्यापक है; भोजन और अन्नबलि के संदर्भ में ‘तैयार किया जाए’ विधि को अनावश्यक रूप से सीमित किए बिना स्वाभाविक है।
- source_word: מַרְחֶשֶׁת
  choice: गहरी कड़ाही
  rationale: यह किसी पकाने के पात्र को दर्शाता है, जिसे अगले מַחֲבַת की अपेक्षा प्रायः गहरा माना जाता है। ‘गहरी कड़ाही’ संभावित भेद को स्पष्ट रखते हुए सामान्य पाठक के लिए बोधगम्य है।
- source_word: מַחֲבַת
  choice: तवा
  rationale: यह संभवतः चपटा पकाने का पात्र था; ‘तवा’ हिन्दी में स्वाभाविक है और गहरी कड़ाही से उसका संभावित अंतर बनाए रखता है।
- source_word: לַכֹּהֵן הַמַּקְרִיב אֹתָהּ לוֹ תִהְיֶה
  choice: वह उसे अर्पित करने वाले याजक का होगा
  rationale: यह वाक्यांश वैधानिक स्वामित्व बताता है। हिन्दी संरचना मूल के आशय को स्पष्ट करती है और सहभागी रूप ‘अर्पित करने वाले’ को बनाए रखती है।
- source_word: הַמַּקְרִיב
  choice: अर्पित करने वाले
  rationale: हिफ़ईल रूप बलिदानी संदर्भ में किसी भेंट को निकट लाने या प्रस्तुत करने का अर्थ रखता है; ‘अर्पित करने’ से अनुष्ठानिक कार्य सहज और सटीक रूप में व्यक्त होता है।
