source:
  edition: WLC
  text: עַל חַלֹּת֙ לֶ֣חֶם חָמֵ֔ץ יַקְרִ֖יב קָרְבָּנ֑/וֹ עַל זֶ֖בַח תּוֹדַ֥ת שְׁלָמָֽי/ו־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/013.yaml
  text: Along with cakes of leavened bread[a], he shall present his offering with the sacrifice of his peace offerings of thanksgiving.
translation:
  language: hi
  text: वह खमीर वाली रोटी की टिकियों के साथ अपनी भेंट, अपनी शांति-बलियों की धन्यवाद-बलि के साथ, चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: עַל
  choice: के साथ
  rationale: यहाँ עַל स्थान नहीं, बल्कि साथ दी जाने वाली वस्तु का संबंध बताता है; इसलिए सहज हिन्दी में ‘के साथ’ उपयुक्त है।
- source_word: חַלֹּת לֶחֶם חָמֵץ
  choice: खमीर मिली रोटी की टिकियाँ
  rationale: חַלֹּת रोटी की टिकियों या लोइयों को और חָמֵץ खमीर उठी हुई रोटी को दर्शाता है; यह वाक्यांश आसपास की अखमीरी वस्तुओं से अनुष्ठानिक भेद बनाए रखता है।
- source_word: יַקְרִיב
  choice: चढ़ाए
  rationale: हिफ़ील रूप का बल किसी वस्तु को परमेश्वर के सामने अर्पण करने पर है; बलिदान-संबंधी हिन्दी में ‘चढ़ाए’ स्पष्ट और स्वाभाविक है।
- source_word: קָרְבָּנוֹ
  choice: अपनी भेंट
  rationale: קָרְבָּן परमेश्वर के निकट लाई जाने वाली सामान्य भेंट है; ‘भेंट’ आधुनिक हिन्दी में संक्षिप्त और व्यापक शब्द है।
- source_word: זֶבַח תּוֹדַת
  choice: धन्यवाद की … बलि
  rationale: निर्माण-संबंधी पदबंध उस बलि को धन्यवाद से विशेषित करता है; ‘धन्यवाद की’ इस संबंध को बिना अतिरिक्त व्याख्या के बनाए रखता है।
- source_word: שְׁלָמָיו
  choice: अपनी … शांति-बलि
  rationale: שְׁלָמִים शांति, संपूर्ण कुशल और सहभागी संगति से जुड़ी एक तकनीकी बलि-श्रेणी है। ‘शांति-बलि’ मूल धातु-संबंध को सुरक्षित रखते हुए सामान्य पाठक के लिए समझने योग्य है। हिन्दी वाक्य में संयुक्त बलि-नाम को स्वाभाविक रखने के लिए एकवचन सामूहिक रूप प्रयुक्त है।
theological_decisions:
- issue: שְׁלָמִים नामक बलि-श्रेणी का अनुवाद
  choice: शांति-बलि
  alternative: मेलबलि; संगति-बलि; कुशल-मंगल की बलि
  rationale: इब्रानी शब्द में शांति या संपूर्ण कुशल के साथ सहभागी भोज और संगति के भाव भी जुड़े हैं। मुख्य पाठ में ‘शांति-बलि’ मूल शब्द-संबंध को सुरक्षित रखता है, जबकि अन्य वैध अर्थछटाएँ पादटिप्पणी में दी गई हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘शांति-बलि’ तकनीकी पद है, इसलिए अर्थगत विकल्प पादटिप्पणी में सुरक्षित किए गए हैं।
