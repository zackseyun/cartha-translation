source:
  edition: WLC
  text: דַּבֵּ֛ר אֶל בְּנֵ֥י יִשְׂרָאֵ֖ל לֵ/אמֹ֑ר כָּל חֵ֜לֶב שׁ֥וֹר וְ/כֶ֛שֶׂב וָ/עֵ֖ז לֹ֥א תֹאכֵֽלוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/023.yaml
  text: 'Speak to the sons of Israel[a], saying: You shall not eat any fat of an ox, a sheep, or a goat.'
translation:
  language: hi
  text: 'इस्राएलियों[a] से कह: ‘तुम बैल, भेड़ या बकरी की किसी भी चरबी को न खाना।’'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से ‘इस्राएल के पुत्रों’ है; यहाँ इसका अर्थ सामूहिक रूप से इस्राएली लोग हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבֵּר
  choice: कह
  rationale: पिएल आज्ञार्थक रूप मूसा को सीधे आदेश देता है। आधुनिक हिन्दी में ‘से कह’ इस विधिक कथन-सूत्र को स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर यहाँ पदबंध पूरी वाचा-समुदाय के लिए सामूहिक नाम है। ‘इस्राएलियों’ से वही आशय सहज आधुनिक हिन्दी में आता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לֵאמֹר
  choice: कह
  rationale: यह बोलने की विषयवस्तु प्रस्तुत करने वाला प्रचलित इब्रानी कथन-सूत्र है। हिन्दी के ‘से कह’ में इसका कार्य स्वाभाविक रूप से समाहित हो जाता है; अलग से ‘यह कहते हुए’ कहना बोझिल होता।
- source_word: כָּל חֵלֶב
  choice: किसी भी चरबी
  rationale: निषेध के भीतर כָּל का व्यापक अर्थ ‘किसी भी’ से स्पष्ट होता है। חֵלֶב यहाँ विशेष रूप से पशुओं की चरबी, विशेषकर बलि-विधान से संबंधित चरबी, को दर्शाता है।
- source_word: שׁוֹר
  choice: बैल
  rationale: यह गोवंश के एक पशु को दर्शाता है। सूची के एकवचन रूप और सामान्य हिन्दी बाइबलीय-विधिक प्रयोग के अनुरूप ‘बैल’ चुना गया है।
- source_word: כֶשֶׂב
  choice: भेड़
  rationale: यह भेड़-वर्ग के पशु का सामान्य पद है; ‘मेमना’ या ‘मेढ़ा’ कहना आयु अथवा लिंग को अनावश्यक रूप से निश्चित कर देता।
- source_word: עֵז
  choice: बकरी
  rationale: यहाँ यह बकरी-वर्ग के पशु का सामान्य नाम है। हिन्दी में ‘बकरी’ प्रजाति के सामान्य उल्लेख के रूप में स्वाभाविक है।
- source_word: לֹא תֹאכֵלוּ
  choice: तुम … न खाना
  rationale: नकार के साथ बहुवचन अपूर्ण क्रिया विधिक निषेध व्यक्त करती है। ‘न खाना’ आधुनिक हिन्दी में सीधा, दृढ़ और स्वाभाविक सामूहिक आदेश है।
theological_decisions:
- issue: चरबी के निषेध का दायरा
  choice: पद के व्यापक शब्दों को बिना अतिरिक्त व्याख्या के रखा गया है
  alternative: इसे केवल बलि में चढ़ाई जाने वाली विशेष चरबी तक स्पष्ट रूप से सीमित करना
  rationale: חֵלֶב का लैव्यव्यवस्था में बलि-संबंधी विशेष अर्थ हो सकता है, पर इस पद की अभिव्यक्ति स्वयं संक्षिप्त और व्यापक है। अनुवाद में ऐसी सीमा जोड़ना पाठ की संभावित व्यापकता को पहले ही तय कर देता।
translation_notes:
  register: भाषा आधुनिक, सरल और विधिक गरिमा वाली रखी गई है। ‘इस्राएलियों से कह’ हिन्दी में स्वाभाविक है, जबकि पादटिप्पणी मूल इब्रानी की शाब्दिक बनावट सुरक्षित रखती है। प्रत्यक्ष वचन को उद्धरण-चिह्नों में रखा गया है।
