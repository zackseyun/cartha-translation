source:
  edition: WLC
  text: וּ/בְשַׂ֗ר זֶ֚בַח תּוֹדַ֣ת שְׁלָמָ֔י/ו בְּ/י֥וֹם קָרְבָּנ֖/וֹ יֵאָכֵ֑ל לֹֽא יַנִּ֥יחַ מִמֶּ֖/נּוּ עַד בֹּֽקֶר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/015.yaml
  text: And the flesh of the sacrifice of his thanksgiving peace offering shall be eaten on the day of his offering[b][a]; he shall not leave any of it until morning.
translation:
  language: hi
  text: उसकी धन्यवाद-हेतु मेलबलि[a] का मांस उसी दिन खाया जाए जिस दिन वह उसे चढ़ाए; वह उसमें से कुछ भी सुबह तक न छोड़े।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसकी धन्यवाद-हेतु मेलबलियों का बलिदान।”
    reason: हिब्रू की संबंध-श्रृंखला और שְׁלָמָיו के बहुवचन रूप को अधिक शाब्दिक ढंग से व्यक्त करने का विकल्प।
lexical_decisions:
- source_word: וּבְשַׂר
  choice: और निहित संबंध के साथ ‘मांस’
  rationale: בשר बलि किए गए पशु के खाने योग्य मांस को दर्शाता है; हिन्दी में ‘मांस’ स्वाभाविक और सटीक है। पद को स्वतंत्र वाक्य के रूप में प्रस्तुत करते समय आरंभिक ו का संबंध प्रसंग से स्पष्ट रहता है, इसलिए कृत्रिम ‘और’ आवश्यक नहीं।
- source_word: זֶבַח תּוֹדַת שְׁלָמָיו
  choice: उसके धन्यवाद के मेलबलि
  rationale: यह सघन संबंध-श्रृंखला धन्यवाद के उद्देश्य वाले שְׁלָמִים-वर्ग के बलिदान को बताती है। ‘मेलबलि’ विशिष्ट बलिदानी श्रेणी को बनाए रखता है, जबकि ‘धन्यवाद के’ उसके उपप्रकार या उद्देश्य को व्यक्त करता है।
- source_word: בְּיוֹם קָרְבָּנוֹ
  choice: उसी दिन जिस दिन वह उसे चढ़ाए
  rationale: קָרְבָּן और प्रत्यय को हिन्दी में क्रियात्मक रूप देना अधिक स्वाभाविक है और बलि चढ़ाने वाले व्यक्ति तथा बलि—दोनों संदर्भों को स्पष्ट रखता है।
- source_word: יֵאָכֵל
  choice: खाया जाए
  rationale: निफ़अल का कर्मवाच्य और विधिसूचक बल हिन्दी के ‘खाया जाए’ से सुरक्षित रहता है।
- source_word: לֹא יַנִּיחַ מִמֶּנּוּ עַד בֹּקֶר
  choice: वह उसमें से कुछ भी भोर तक न छोड़े
  rationale: एकवचन कर्ता को ‘वह’ से बनाए रखा गया है; מִמֶּנּוּ का निषेधात्मक अर्थ स्वाभाविक हिन्दी में ‘उसमें से कुछ भी’ है, और ‘भोर तक’ समय-सीमा को ठीक व्यक्त करता है।
theological_decisions:
- issue: שְׁלָמִים बलिदानी श्रेणी का अनुवाद
  choice: मेलबलि
  alternative: शान्ति-बलि / सहभागिता-बलि
  rationale: ‘मेलबलि’ हिन्दी में संक्षिप्त रूप से इस विशिष्ट बलिदानी श्रेणी को नाम देता है और केवल आंतरिक शान्ति या सामुदायिक भोजन जैसी किसी एक व्याख्या को निर्णायक नहीं बनाता।
- issue: זֶבַח תּוֹדַת שְׁלָמָיו की संबंध-रचना
  choice: धन्यवाद के मेलबलि
  alternative: उसकी धन्यवाद की मेलबलियों का बलिदान
  rationale: मुख्य पाठ में इसे धन्यवाद-प्रकार के मेलबलि के रूप में सहज बनाया गया है, पर हिब्रू की सघन रचना और שְׁלָמָיו के बहुवचन रूप की झलक वैकल्पिक अनुवाद में सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध विधिक-धार्मिक हिन्दी। ‘उसी दिन’ आदेश की समय-सीमा पर स्वाभाविक बल देता है; ‘भोर’ बलिदानी विधान के औपचारिक स्वर के अनुकूल है।
