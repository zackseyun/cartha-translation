source:
  edition: WLC
  text: וְ/הַ/נֶּ֜פֶשׁ אֲשֶׁר תֹּאכַ֣ל בָּשָׂ֗ר מִ/זֶּ֤בַח הַ/שְּׁלָמִים֙ אֲשֶׁ֣ר לַ/יהוָ֔ה וְ/טֻמְאָת֖/וֹ עָלָ֑י/ו וְ/נִכְרְתָ֛ה הַ/נֶּ֥פֶשׁ הַ/הִ֖וא מֵ/עַמֶּֽי/הָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/020.yaml
  text: But the person who eats meat from the sacrifice of peace offerings that belongs to Yahweh while his uncleanness is on him—that person shall be cut off from his people[a].
translation:
  language: hi
  text: परन्तु जो व्यक्ति याहवे की मेलबलि का मांस उस समय खाए जब उसकी अशुद्धता उस पर हो, वह व्यक्ति अपने लोगों में से काट डाला जाए[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अपने लोगों से निकाल दिया जाए।” “काट डाला जाए” का अर्थ निष्कासन अथवा मृत्यु हो सकता है, पर यहाँ इब्रानी पाठ इसका ठीक-ठीक माध्यम नहीं बताता।
    reason: दण्ड-सूत्र के वैकल्पिक अर्थ और मूल पाठ की अनिश्चितता बताना।
lexical_decisions:
- source_word: הַנֶּפֶשׁ
  choice: व्यक्ति
  rationale: विधिक प्रसंग में נֶפֶשׁ से किसी व्यक्तिगत मनुष्य का बोध होता है, न कि केवल अमूर्त ‘आत्मा’ का।
- source_word: תֹּאכַל
  choice: खाए
  rationale: अपूर्ण क्रिया यहाँ सामान्य विधिक परिस्थिति व्यक्त करती है; हिन्दी में संबंधवाचक-विधिलिंग रूप स्वाभाविक है।
- source_word: בָּשָׂר
  choice: मांस
  rationale: बलि के भोजन के प्रसंग में ‘मांस’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: מִזֶּבַח הַשְּׁלָמִים
  choice: मेलबलि का मांस
  rationale: שְׁלָמִים एक विशिष्ट बलि-श्रेणी है। ‘मेलबलि’ उसके मेल, शांति और सहभागिता से जुड़े अर्थक्षेत्र को संक्षेप में व्यक्त करने वाला परिचित हिन्दी धार्मिक पद है।
- source_word: אֲשֶׁר לַיהוָה
  choice: याहवे के
  rationale: यह वाक्यांश बलि को याहवे के लिए समर्पित अथवा उनका ठहराता है; सम्बन्धकारक रूप हिन्दी में इस पवित्र स्वामित्व को संक्षेप और स्वाभाविक ढंग से व्यक्त करता है।
- source_word: טֻמְאָתוֹ עָלָיו
  choice: जब उसकी अशुद्धता उस पर हो
  rationale: यह अनुवाद इब्रानी के ‘अशुद्धता उस पर’ वाले रूपक और विधिक बल को बनाए रखता है, साथ ही समयगत परिस्थिति भी स्पष्ट करता है।
- source_word: וְנִכְרְתָה
  choice: काट डाला जाए
  rationale: כרת के निफ़अल रूप का यह औपचारिक अनुवाद समुदाय से गंभीर निष्कासन या विनाश का भाव रखता है, पर दण्ड का निश्चित माध्यम नहीं ठहराता।
- source_word: מֵעַמֶּיהָ
  choice: अपने लोगों में से
  rationale: इब्रानी स्त्रीलिंग प्रत्यय व्याकरणिक रूप से נֶפֶשׁ के अनुरूप है और जैविक लिंग नहीं बताता। ‘अपने लोगों में से’ हिन्दी में लिंग-निरपेक्ष और स्वाभाविक है।
theological_decisions:
- issue: וְנִכְרְתָה ... מֵעַמֶּיהָ दण्ड-सूत्र का अर्थ
  choice: अपने लोगों में से काट डाला जाए
  alternative: अपने लोगों से निकाल दिया जाए; अथवा उसकी मृत्यु हो/उसे मार डाला जाए
  rationale: इब्रानी सूत्र वाचा-समुदाय से गंभीर रूप से अलग किए जाने को व्यक्त करता है, पर यहाँ यह स्पष्ट नहीं करता कि इसका माध्यम निष्कासन है, दैवी मृत्यु है या मृत्युदण्ड। मुख्य पाठ और पादटिप्पणी इस अनिश्चितता को सुरक्षित रखते हैं।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मेलबलि’ बलि की विशिष्ट श्रेणी को संक्षेप में पहचानने योग्य बनाता है। ‘अशुद्धता उस पर हो’ मूल इब्रानी मुहावरे को जानबूझकर सुरक्षित रखता है।
