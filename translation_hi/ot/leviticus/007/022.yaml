lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने...कहा
  rationale: वाव-क्रमिक के साथ דבר यहाँ एक नए वचन-खंड का आरम्भ करता है। हिन्दी में अगले לֵאמֹר के साथ इसे स्वाभाविक रूप से एक ही कथन-सूत्र, ‘ने...कहा’, में व्यक्त किया गया है।
- source_word: יְהוָה
