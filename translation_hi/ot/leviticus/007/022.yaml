  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को उपाधि से बदलने के बजाय प्रचलित हिन्दी लिप्यंतरण में रखा गया है।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ वाक्य-विन्यास के अनुसार यह सम्बोधित व्यक्ति को स्वाभाविक रूप से चिह्नित करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: यह מֹשֶׁה का मानक और व्यापक रूप से परिचित हिन्दी नाम-रूप है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह अगले वचन में आने वाली प्रत्यक्ष वाणी का परिचय देता है। अलग से ‘यह कहते हुए’ रखने के बजाय हिन्दी के स्वाभाविक कथन-सूत्र में समाहित किया गया है।
theological_decisions:
