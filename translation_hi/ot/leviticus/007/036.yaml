base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/036.yaml
  text: which Yahweh commanded to be given to them from the sons of Israel on the day he anointed them—an everlasting statute throughout their generations[a][b].
translation:
  language: hi
  text: जिसे यहोवा ने उस दिन इस्राएलियों की ओर से उन्हें दिए जाने की आज्ञा दी, जिस दिन उसने उनका अभिषेक किया था—वह उनकी पीढ़ियों के लिए स्थायी विधि है[a][b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘इस्राएल के पुत्रों से।’
    reason: lexical_alternative
  - marker: b
    text: या, ‘चिरस्थायी विधि।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אֲשֶׁר
  choice: जिसे
  rationale: यह संबंधवाचक शब्द पिछले संदर्भ में याजकों को मिलने वाले भागों की ओर संकेत करता है।
- source_word: צִוָּה
  choice: आज्ञा दी
  rationale: यह परमेश्वर के अधिकारपूर्ण आदेश का कानूनी और वाचागत बल बनाए रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी में प्रचलित रूप से दिव्य व्यक्तिगत नाम को सीधे प्रस्तुत करता है, किसी उपाधि से प्रतिस्थापित नहीं करता।
- source_word: לָתֵת לָהֶם
  choice: उन्हें देने
  rationale: हिन्दी वाक्य-विन्यास में सक्रिय अनंत क्रिया स्वाभाविक है और अर्थतः इन भागों को याजकों को दिए जाने की बात स्पष्ट करती है।
- source_word: בְּיוֹם מָשְׁחוֹ אֹתָם
  choice: उनके अभिषेक के दिन
  rationale: मूल के ठोस कालवाचक पद और विशिष्ट अभिषेक-क्रिया को बनाए रखते हुए हिन्दी में स्वाभाविक रूप देता है; कर्ता संदर्भ से यहोवा है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों से
  rationale: शाब्दिक ‘इस्राएल के पुत्रों से’ का सहज आधुनिक हिन्दी समतुल्य है; औपचारिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: तोरा के धार्मिक-कानूनी सूत्र का स्थायी बल रखता है, पर दार्शनिक अनंतता का अतिरिक्त दावा नहीं जोड़ता।
- source_word: לְדֹרֹתָם
  choice: उनकी पीढ़ी-दर-पीढ़ी
  rationale: लगातार आने वाली पीढ़ियों में लागू रहने का भाव सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: व्यक्तिगत वाचा-नाम को उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी पाठकों के लिए सुपरिचित नाम-रूप में रखा गया है।
- issue: याजकीय विधान में עוֹלָם का बल
  choice: सदा की विधि
  alternative: चिरस्थायी विधि
  rationale: यह विधान के पीढ़ियों तक बने रहने का कानूनी बल सुरक्षित रखता है, बिना पाठ से आगे कोई विशिष्ट धर्मवैज्ञानिक निष्कर्ष थोपे।
- issue: מָשְׁחוֹ का कर्ता
  choice: संज्ञात्मक रूप ‘उनके अभिषेक के दिन’
  alternative: जिस दिन उसने उनका अभिषेक किया
  rationale: इब्रानी का 3 पुल्लिंग एकवचन कर्ता स्वाभाविक रूप से यहोवा की ओर संकेत करता है; हिन्दी में संज्ञात्मक रूप वही घटना व्यक्त करता है और अनावश्यक सर्वनाम-संदिग्धता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट और सामान्य पाठकों के लिए सहज शैली। ‘विधि’ धार्मिक-कानूनी संदर्भ को व्यक्त करती है; वाक्य का संबंध पिछले पद में बताए याजकीय भागों से है।
