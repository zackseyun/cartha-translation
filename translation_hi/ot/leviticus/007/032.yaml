source:
  edition: WLC
  text: וְ/אֵת֙ שׁ֣וֹק הַ/יָּמִ֔ין תִּתְּנ֥וּ תְרוּמָ֖ה לַ/כֹּהֵ֑ן מִ/זִּבְחֵ֖י שַׁלְמֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/032.yaml
  text: And you shall give the right thigh as a contribution to the priest from your sacrifices of peace offerings[a][b][c].
translation:
  language: hi
  text: और अपनी मेल-बलियों[c] में से दाहिनी जाँघ[a] याजक को भेंट[b] के रूप में देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “दाहिना पैर।”
    reason: lexical_alternative
  - marker: b
    text: या “अर्पण”; परम्परागत रूप से “उठाई हुई भेंट।”
    reason: lexical_alternative
  - marker: c
    text: “मेल-बलियों” का अनुवाद “शान्ति-बलियों,” “सहभागिता-बलियों” या “कुशल-क्षेम की बलियों” के रूप में भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: שׁוֹק
  choice: जाँघ
  rationale: यह पशु के पैर के ऊपरी भाग को सूचित करता है; बलि-विधान के इस संदर्भ में ‘जाँघ’ अधिक सटीक है।
- source_word: הַיָּמִין
  choice: दाहिनी
  rationale: मूल पाठ निर्धारित दाहिने भाग को स्पष्ट रूप से निर्दिष्ट करता है।
- source_word: תִּתְּנוּ
  choice: देना
  rationale: कानूनी निर्देश के प्रवाह में यह रूप आज्ञार्थक दायित्व को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: תְרוּמָה
  choice: भेंट
  rationale: यह अलग करके दिए गए अंश को दर्शाता है; ‘भेंट’ आधुनिक पाठक के लिए सहज है और किसी अस्पष्ट पारंपरिक अनुष्ठानिक पद को नहीं थोपता।
- source_word: לַכֹּהֵן
  choice: याजक को
  rationale: प्राप्तकर्ता के लिए एकवचन को मूल पाठ के अनुसार बनाए रखा गया है।
- source_word: מִזִּבְחֵי
  choice: अपने ... बलियों में से
  rationale: מִן स्रोत या समूह में से निकाले गए अंश को दर्शाता है, और द्वितीय पुरुष बहुवचन प्रत्यय को ‘अपने’ से व्यक्त किया गया है।
- source_word: שַׁלְמֵיכֶם
  choice: मेलबलियों
  rationale: यह स्थापित हिन्दी बलिदानी पद है और शांति, सहभागिता तथा कुशल-क्षेम से जुड़े मूल शब्द के अर्थक्षेत्र को संक्षेप में व्यक्त करता है।
- source_word: וְאֵת
  choice: और
  rationale: संयोजक पिछले निर्देश से संबंध बनाए रखता है; कर्मचिह्न का हिन्दी में अलग अनुवाद आवश्यक नहीं है।
theological_decisions:
- issue: שְׁלָמִים का बलिदानी अर्थ
  choice: मेलबलि
  alternative: शान्ति-बलि; सहभागिता-बलि; कुशल-क्षेम की बलि
  rationale: मूल पद का अर्थक्षेत्र बहुआयामी है। मुख्य पाठ में परिचित और संक्षिप्त ‘मेलबलि’ रखा गया है, जबकि विकल्प पादटिप्पणी में देकर अर्थगत तनाव सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सुबोध हिन्दी। विधिक निर्देश को पूर्ववर्ती प्रसंग से जुड़े अनन्त क्रियारूप ‘देना’ द्वारा स्वाभाविक रूप में रखा गया है। सभी पादटिप्पणी चिह्न मुख्य पाठ में उपस्थित हैं।
