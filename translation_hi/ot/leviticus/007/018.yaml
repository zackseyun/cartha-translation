source:
  edition: WLC
  text: וְ/אִ֣ם הֵאָכֹ֣ל יֵ֠אָכֵל מִ/בְּשַׂר זֶ֨בַח שְׁלָמָ֜י/ו בַּ/יּ֣וֹם הַ/שְּׁלִישִׁי֮ לֹ֣א יֵרָצֶה֒ הַ/מַּקְרִ֣יב אֹת֗/וֹ לֹ֧א יֵחָשֵׁ֛ב ל֖/וֹ פִּגּ֣וּל יִהְיֶ֑ה וְ/הַ/נֶּ֛פֶשׁ הָ/אֹכֶ֥לֶת מִמֶּ֖/נּוּ עֲוֺנָ֥/הּ תִּשָּֽׂא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/018.yaml
  text: But if any of the flesh of his peace offering is eaten on the third day[a], it will not be accepted; it will not be credited to the one who offers it. It will be an abhorrent thing[b], and the person who eats from it will bear his guilt.
translation:
  language: hi
  text: परन्तु यदि उसकी मेलबलि के मांस में से कुछ भी तीसरे दिन खाया जाए, तो वह स्वीकार नहीं किया जाएगा; जिसने उसे चढ़ाया है, उसके पक्ष में वह गिना नहीं जाएगा। वह घृणित वस्तु[a] माना जाएगा, और जो व्यक्ति उसमें से खाएगा, वह अपने दोष का भार उठाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “दूषित मांस” अथवा “घिनौनी वस्तु।” इब्रानी शब्द बलिदान-संबंधी एक विशेष शब्द है, जो ऐसी वस्तु को दर्शाता है जो अनुचित होने के कारण अस्वीकार्य और घृणित ठहर गई हो।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले नियम के विपरीत स्थिति प्रस्तुत करने वाली शर्त है; ‘परन्तु यदि’ संयोजक और प्रसंगगत विरोध—दोनों को व्यक्त करता है।
- source_word: הֵאָכֹל יֵאָכֵל מִבְּשַׂר
  choice: मांस में से कुछ भी ... खाया जाए
  rationale: इन्फिनिटिव एब्सोल्यूट और इम्परफेक्ट की बलात्मक रचना को सहज हिन्दी में ‘कुछ भी’ से व्यक्त किया गया है; מִן का अंशवाचक अर्थ भी सुरक्षित है।
- source_word: זֶבַח שְׁלָמָיו
  choice: उसके मेलबलि
  rationale: यह विशिष्ट बलिदान-श्रेणी है। ‘मेलबलि’ शांति, मेल और सहभागिता के अर्थक्षेत्र को संक्षेप में रखता है और हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: לֹא יֵרָצֶה
  choice: स्वीकार नहीं किया जाएगा
  rationale: बलिदान-संबंधी प्रसंग में רצה का निफ़अल रूप परमेश्वर के सामने स्वीकार्यता को दर्शाता है।
- source_word: לֹא יֵחָשֵׁב לוֹ
  choice: उसके लिए उसका लेखा नहीं होगा
  rationale: חשב עם ל की गणना अथवा श्रेय दिए जाने की धारणा को यथासंभव स्पष्ट रखते हुए यह अनुवाद किया गया है।
- source_word: פִּגּוּל
  choice: घृणित वस्तु
  rationale: यह तकनीकी बलिदान-संबंधी शब्द किसी ऐसी वस्तु को बताता है जो अनुचित होने के कारण अस्वीकार्य और घिनौनी ठहर गई हो; कठिन पद के विकल्प को पादटिप्पणी में रखा गया है।
- source_word: וְהַנֶּפֶשׁ הָאֹכֶלֶת מִמֶּנּוּ
  choice: और जो व्यक्ति उसमें से खाएगा
  rationale: נפש यहाँ शरीर से अलग ‘आत्मा’ नहीं, बल्कि कानूनी अर्थ में व्यक्ति को सूचित करता है।
- source_word: עֲוֺנָהּ תִּשָּׂא
  choice: वह अपने अधर्म का भार उठाएगा
  rationale: मुहावरा अपराध-दोष वहन करने और उससे जुड़ी दंडनीय जवाबदेही का संकेत देता है; मूल की तनावपूर्ण व्यापकता को केवल ‘दंड पाएगा’ कहकर सीमित नहीं किया गया।
theological_decisions:
- issue: זֶבַח שְׁלָמָיו का बलिदान-संबंधी नाम
  choice: उसके मेलबलि
  alternative: उसकी शान्ति-बलि; उसकी कुशल-बलि
  rationale: ‘मेलबलि’ विशिष्ट बलिदान-श्रेणी को नाम देता है और शब्द की शांति/सम्पूर्णता तथा सहभागिता से जुड़ी अर्थच्छायाओं को बिना किसी साम्प्रदायिक व्याख्या के रखता है।
- issue: לֹא יֵחָשֵׁב לוֹ का आशय
  choice: उसके लिए उसका लेखा नहीं होगा
  alternative: वह उसके लिए गिना नहीं जाएगा; उसका श्रेय उसे नहीं मिलेगा
  rationale: मूल में लेखा/गणना की भाषा है। मुख्य पाठ उसे बनाए रखता है और यह तय नहीं करता कि यहाँ केवल धार्मिक लाभ, बलिदान की मान्यता, या दोनों अभिप्रेत हैं।
- issue: עֲוֺנָהּ תִּשָּׂא में दोष और दंड का संबंध
  choice: अपने अधर्म का भार उठाएगा
  alternative: अपने दोष का भार उठाएगा; अपने अधर्म का दंड भोगेगा
  rationale: हिब्रू मुहावरा दोष तथा उसके परिणाम दोनों का संकेत दे सकता है। ‘भार उठाएगा’ मूल रूपक और उसकी वास्तविक धर्मवैधानिक अस्पष्टता को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और विधिक-बलिदानात्मक शैली रखी गई है। ‘चढ़ानेवाले’ संयुक्त रूप में है। मूल स्रोत में केवल कठिन शब्द פִּגּוּל के स्थान पर पादटिप्पणी चिह्न रखा गया है; उपलब्ध अंग्रेज़ी परत में पादटिप्पणी-चिह्नों और उनकी सामग्री का क्रम असंगत था, इसलिए हिन्दी मसौदे में उन्हें स्रोत-संगत किया गया है।
