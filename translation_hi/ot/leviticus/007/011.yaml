base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/011.yaml
  text: This is the law of the sacrifice of peace offerings that one shall present to Yahweh:[a]
translation:
  language: hi
  text: यहोवा को चढ़ाई जाने वाली मेलबलि की व्यवस्था यह है:[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘कल्याण-बलि’; परंपरागत रूप से ‘शांति-बलि’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: यह है
  rationale: वाव के साथ संकेतवाचक शब्द नए उपखंड का परिचय देता है। हिन्दी में ‘यह है’ स्वाभाविक है; अलग से ‘और’ जोड़ना आवश्यक नहीं।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: याजकीय प्रसंग में תּוֹרָה निर्धारित विधि या नियम को सूचित करता है। ‘व्यवस्था’ इसके विधिक और अनुष्ठानिक भाव को बनाए रखता है।
- source_word: זֶבַח
  choice: बलिदान
  rationale: यह वध से जुड़े बलिदानी अर्पण का द्योतक है; ‘बलिदान’ स्पष्ट और प्रचलित हिन्दी शब्द है।
- source_word: הַ/שְּׁלָמִים
  choice: मेलबलि
  rationale: यह एक विशिष्ट बलिदानी पारिभाषिक शब्द है। ‘मेलबलि’ शांति और सहभागिता के भाव को संक्षेप में व्यक्त करता है; कल्याण का अर्थ-पक्ष पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר יַקְרִיב
  choice: जिसे कोई ... चढ़ाएगा
  rationale: हिफ़ील रूप बलिदानी संदर्भ में निकट लाने या अर्पित करने का अर्थ देता है। तीसरे पुरुष एकवचन का प्रयोग सामान्य व्यक्ति के लिए है; ‘कोई’ उस सामान्य अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है। अपूर्ण रूप को विधिक भाव सहित ‘चढ़ाएगा’ से प्रस्तुत किया गया है।
- source_word: לַ/יהוָה
  choice: यहोवा को
  rationale: पूर्वसर्ग अर्पण की दिशा या समर्पण बताता है और परमेश्वर के निज नाम को ‘यहोवा’ रूप में रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार अक्षरों वाला निज नाम स्पष्ट रूप से है। हिन्दी बाइबल-परंपरा में परिचित ‘यहोवा’ उसका नामरूप बनाए रखता है, उसे किसी उपाधि से नहीं बदलता।
- issue: שְׁלָמִים का पारिभाषिक अनुवाद
  choice: मेलबलि
  alternative: कल्याण-बलि
  rationale: इस शब्द में शांति, सकुशलता और सहभागिता से जुड़े अर्थ हैं। मुख्य पाठ में संक्षिप्त पारिभाषिक ‘मेलबलि’ रखा गया है और अर्थ की व्यापकता पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिन्दी। पद की विधिक-अनुष्ठानिक शैली बनाए रखते हुए अत्यधिक संस्कृतनिष्ठ अभिव्यक्ति से बचा गया है।
