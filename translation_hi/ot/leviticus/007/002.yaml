  text: בִּ/מְק֗וֹם אֲשֶׁ֤ר יִשְׁחֲטוּ֙ אֶת הָ֣/עֹלָ֔ה יִשְׁחֲט֖וּ אֶת הָ/אָשָׁ֑ם וְ/אֶת דָּמ֛/וֹ יִזְרֹ֥ק עַל הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/002.yaml
  text: In the place where they slaughter the burnt offering[a], they shall slaughter the guilt offering, and he shall splash its blood against the altar all around.
translation:
  language: hi
  text: जहाँ वे होमबलि के लिए पशु वध करते हैं, वहीं वे दोषबलि[a] के लिए पशु वध करें; और याजक उसका लहू वेदी के चारों ओर छिड़के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “क्षतिपूर्ति-बलि” भी कहा जा सकता है। इब्रानी शब्द दोष और उसकी भरपाई—दोनों की ओर संकेत कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בִּמְקוֹם אֲשֶׁר
  choice: जिस स्थान पर
  rationale: स्थानवाचक संबंधवाक्य को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है और विधि में बताए गए निश्चित स्थान को बनाए रखता है।
- source_word: יִשְׁחֲטוּ
  choice: पशु बलि करते हैं / पशु बलि करें
  rationale: बलिदान के संदर्भ में שׁחט अनुष्ठानिक वध को दर्शाता है। केवल ‘मारना’ की अपेक्षा ‘पशु बलि करना’ अधिक सटीक और सामान्य पाठक के लिए स्पष्ट है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: पूरी तरह जलाए जाने वाले बलिदान के लिए हिन्दी बाइबलीय परंपरा में परिचित और संक्षिप्त पद है। ‘का पशु’ जोड़ने से स्पष्ट होता है कि वध अर्पण किए जाने वाले पशु का है।
- source_word: הָאָשָׁם
  choice: दोषबलि
  rationale: אָשָׁם में दोष तथा उसकी क्षतिपूर्ति से जुड़ी भेंट—दोनों अर्थछायाएँ हैं। ‘दोषबलि’ स्थापित बलिदानी श्रेणी को संक्षेप में व्यक्त करता है; क्षतिपूर्ति की अर्थछाया पादटिप्पणी में सुरक्षित है।
- source_word: דָּמוֹ
  choice: उसका लहू
  rationale: एकवचन प्रत्यय दोषबलि के पशु की ओर संकेत करता है। ‘लहू’ बलिदानी संदर्भ में सहज और गरिमापूर्ण हिन्दी है।
- source_word: יִזְרֹק
  choice: छिड़के
  rationale: זָרַק वेदी पर लहू फेंककर लगाने की अनुष्ठानिक क्रिया है। हिन्दी में ‘लहू छिड़कना’ इस क्रिया का प्रचलित और सुबोध रूप है, यद्यपि यह बहुत हल्की बूँदें डालने तक सीमित नहीं समझा जाना चाहिए।
- source_word: עַל הַמִּזְבֵּחַ סָבִיב
  choice: वेदी पर चारों ओर
  rationale: עַל को वेदी की सतह पर लहू लगाए जाने के रूप में और סָבִיב को उसकी परिधि के चारों ओर के रूप में व्यक्त करता है।
theological_decisions:
- issue: אָשָׁם नामक बलिदान की प्रकृति
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि / प्रायश्चित्त-बलि
  rationale: मूल पद दोष और प्रतिपूर्ति दोनों से संबंधित हो सकता है। मुख्य पाठ में पहचानी जाने वाली बलिदानी श्रेणी रखी गई है, जबकि किसी एक धर्मवैज्ञानिक व्याख्या को निर्णायक बनाए बिना क्षतिपूर्ति की अर्थछाया पादटिप्पणी में दी गई है।
- issue: יִזְרֹק का कर्ता
  choice: याजक
  alternative: वह
  rationale: हिब्रू में क्रिया एकवचन पुल्लिंग है, जबकि पहले की क्रियाएँ बहुवचन हैं; लैव्यव्यवस्था की बलिदानी प्रक्रिया में लहू वेदी पर लगाने वाला याजक होता है। हिन्दी में अस्पष्ट ‘वह’ से बचने के लिए निहित कर्ता स्पष्ट किया गया है, बिना क्रिया की अनुष्ठानिक भूमिका बदले।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘होमबलि’, ‘दोषबलि’, ‘याजक’ और ‘वेदी’ जैसे परिचित धार्मिक पद विधिक-बलिदानी संदर्भ की सटीकता बनाए रखते हैं। पहले वाक्यखंड के वर्णनात्मक वर्तमान को हिन्दी में स्थान-निर्धारण की सामान्य प्रक्रिया के रूप में रखा गया है और मुख्य आदेश में ‘करें/छिड़के’ का प्रयोग किया गया है।
