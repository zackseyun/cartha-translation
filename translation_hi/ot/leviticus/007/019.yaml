  text: וְ/הַ/בָּשָׂ֞ר אֲשֶׁר יִגַּ֤ע בְּ/כָל טָמֵא֙ לֹ֣א יֵֽאָכֵ֔ל בָּ/אֵ֖שׁ יִשָּׂרֵ֑ף וְ/הַ֨/בָּשָׂ֔ר כָּל טָה֖וֹר יֹאכַ֥ל בָּשָֽׂר־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/019.yaml
  text: But the meat that touches anything unclean must not be eaten; it must be burned in the fire. And as for the meat, anyone who is clean may eat meat.
translation:
  language: hi
  text: परन्तु जो मांस किसी अशुद्ध वस्तु के सम्पर्क में आए,[a] उसे न खाया जाए; उसे आग में जला दिया जाए। और जहाँ तक मांस की बात है, हर शुद्ध व्यक्ति उसे खा सकता है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी भी अशुद्ध चीज़ को छूए।” इब्रानी अभिव्यक्ति व्यापक है और अनुष्ठानिक अशुद्धता की ओर संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַבָּשָׂר
  choice: परन्तु जो मांस
  rationale: यहाँ בָּשָׂר बलि के मांस को दर्शाता है। आरम्भिक וְ को प्रसंगगत विरोध दिखाने के लिए ‘परन्तु’ किया गया है।
- source_word: אֲשֶׁר יִגַּע בְּכָל טָמֵא
  choice: जो मांस किसी अशुद्ध वस्तु के सम्पर्क में आए
  rationale: יִגַּע वास्तविक सम्पर्क को व्यक्त करता है और כָּל טָמֵא अनुष्ठानिक रूप से अशुद्ध किसी भी वस्तु या पदार्थ की व्यापक श्रेणी है।
- source_word: לֹא יֵאָכֵל
  choice: उसे न खाया जाए
  rationale: निफ़अल अपूर्ण रूप निषेध को कर्मवाच्य में व्यक्त करता है; हिंदी कानूनी शैली में यह स्वाभाविक और स्पष्ट है।
- source_word: בָּאֵשׁ יִשָּׂרֵף
  choice: उसे आग में जला दिया जाए
  rationale: यह दूषित बलि-मांस को आग से नष्ट करने की अपेक्षित क्रिया बताता है और ठोस बिंब बनाए रखता है।
- source_word: וְהַבָּשָׂר
  choice: और जहाँ तक मांस की बात है
  rationale: संज्ञा की पुनरावृत्ति विषय को अशुद्ध हुए मांस से उस मांस की ओर मोड़ती है जिसे खाने की अनुमति है।
- source_word: כָּל טָהוֹר
  choice: हर शुद्ध व्यक्ति
  rationale: विशेषण यहाँ संज्ञा की तरह प्रयुक्त होकर अनुष्ठानिक रूप से शुद्ध व्यक्तियों को दर्शाता है।
- source_word: יֹאכַל בָּשָׂר
  choice: उसे खा सकता है
  rationale: यह आज्ञा की अपेक्षा अनुमति व्यक्त करता है। हिंदी में ‘उसे’ पहले उल्लिखित बलि-मांस का स्वाभाविक संदर्भ देता है।
theological_decisions:
- issue: बलि-विधान में טָמֵא और טָהוֹר का स्वरूप
  choice: ‘अशुद्ध’ और ‘शुद्ध’ को अनुष्ठानिक स्थिति के अर्थ में रखना
  alternative: ‘अपवित्र’ और ‘पवित्र’ अथवा ‘दूषित’ और ‘निर्मल’
  rationale: लैव्यव्यवस्था के इस विधान में ये शब्द मुख्यतः अनुष्ठानिक स्थिति बताते हैं, न कि अनिवार्य रूप से नैतिक दोष या सद्गुण।
translation_notes:
  register: आधुनिक मानक हिंदी में गरिमापूर्ण किंतु सामान्य पाठक के लिए स्पष्ट कानूनी शैली अपनाई गई है। ‘मांस’, ‘अशुद्ध’ और ‘शुद्ध’ जैसे परिचित शब्द मूल के बलि-विधान और अनुष्ठानिक भेद को बनाए रखते हैं।
