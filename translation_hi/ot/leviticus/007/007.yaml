  edition: WLC
  text: כַּֽ/חַטָּאת֙ כָּֽ/אָשָׁ֔ם תּוֹרָ֥ה אַחַ֖ת לָ/הֶ֑ם הַ/כֹּהֵ֛ן אֲשֶׁ֥ר יְכַפֶּר בּ֖/וֹ ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/007.yaml
  text: 'Like the sin offering[a], so the guilt offering: there is one law for them[c][b]. The priest who makes atonement with it shall have it.'
translation:
  language: hi
  text: जैसी पापबलि है, वैसी ही दोषबलि भी है; उन दोनों के लिए एक ही व्यवस्था[a] है। जो याजक उसके द्वारा प्रायश्चित करता है, वह बलि उसी की होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या “एक ही विधि।” इब्रानी: तोराह, जिसका अर्थ “निर्देश” भी हो सकता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: כַּחַטָּאת כָּאָשָׁם
  choice: जैसा पापबलि है, वैसा ही दोषबलि भी है
  rationale: दोनों כ उपसर्ग तुलनात्मक संबंध व्यक्त करते हैं। חַטָּאת और אָשָׁם यहाँ सामान्यतः पाप और दोष नहीं, बल्कि विशिष्ट बलिदानों के नाम हैं। हिंदी में 'जैसा..., वैसा ही...' यह तुलना स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: תּוֹרָה אַחַת לָהֶם
  choice: उन दोनों के लिए एक ही व्यवस्था है
  rationale: תּוֹרָה यहाँ बलिदानों से संबंधित विधि या नियम का बोध कराता है। 'व्यवस्था' धार्मिक-कानूनी निर्देश का भार बनाए रखती है, और 'दोनों' बहुवचन सर्वनाम का संदर्भ स्पष्ट करता है।
- source_word: הַכֹּהֵן אֲשֶׁר יְכַפֵּר בּוֹ
  choice: जो याजक उसके द्वारा प्रायश्चित करे
  rationale: याजकीय संदर्भ में כפר को 'प्रायश्चित करना' अनुवादित किया गया है। בּוֹ बलि को साधन के रूप में सूचित करता है; 'उसके द्वारा' इस अर्थ को बनाए रखता है और ऐसा कोई कर्म-विषय नहीं जोड़ता जो इब्रानी में स्पष्ट नहीं है।
- source_word: לוֹ יִהְיֶה
  choice: वह बलि उसी की होगी
  rationale: यह पदबंध अधिकार या आवंटन व्यक्त करता है। हिंदी में स्पष्टता के लिए निहित विषय 'वह बलि' दोहराया गया है; 'उसी' से अनुष्ठान करने वाले याजक पर बल बना रहता है।
theological_decisions:
- issue: बलिदान-संबंधी כפר का अर्थ
  choice: प्रायश्चित करे
  alternative: शुद्धि करे
  rationale: '''प्रायश्चित'' याजकीय क्रिया के धार्मिक और बलिदान-संबंधी महत्व को बनाए रखता है, पर प्रायश्चित के किसी एक विशिष्ट सिद्धांत को पाठ पर आरोपित नहीं करता।'
translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। 'पापबलि', 'दोषबलि', 'याजक' और 'प्रायश्चित' लैव्यव्यवस्था के बलिदान-संबंधी संदर्भ के अनुरूप पारिभाषिक शब्द हैं।
