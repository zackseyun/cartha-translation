source:
  edition: WLC
  text: וְ/אֵ֥ת כָּל חֶלְבּ֖/וֹ יַקְרִ֣יב מִמֶּ֑/נּוּ אֵ֚ת הָֽ/אַלְיָ֔ה וְ/אֶת הַ/חֵ֖לֶב הַֽ/מְכַסֶּ֥ה אֶת הַ/קֶּֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/003.yaml
  text: 'And from it he shall present all its fat: the fat tail and the fat that covers the entrails[a][b].'
translation:
  language: hi
  text: 'और वह उस बलि-पशु में से उसकी सारी चर्बी चढ़ाए[a]: चर्बीदार पूँछ[b] और वह चर्बी जो अंतड़ियों को ढकती है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “अर्पित करे।” इब्रानी क्रिया बलिदान के किसी भाग को सामने प्रस्तुत करने या चढ़ाने—दोनों का अर्थ दे सकती है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात भेड़ की मोटी, चर्बीयुक्त पूँछ, जो बलिदान में चढ़ाई जाने वाली चर्बी का एक विशिष्ट भाग है।
    reason: cultural_note
lexical_decisions:
- source_word: חֶלְבּוֹ / הַחֵלֶב
  choice: उसकी सारी चर्बी / वह चर्बी
  rationale: बलिदान-संबंधी प्रसंग में חֵלֶב चढ़ाने के लिए निर्धारित चर्बी के भागों को सूचित करता है। ‘चर्बी’ सीधा, प्रचलित और प्रसंगानुकूल अनुवाद है।
- source_word: יַקְרִיב
  choice: चढ़ाए
  rationale: קרב के हिफ़ील रूप का बलिदान-विधान में अर्थ किसी भाग को परमेश्वर के सामने प्रस्तुत करना या अर्पित करना है। हिंदी में ‘चढ़ाए’ स्वाभाविक रूप से इस अनुष्ठानिक भाव को व्यक्त करता है, जबकि ‘अर्पित करे’ भी संभव है।
- source_word: מִמֶּנּוּ
  choice: उसमें से
  rationale: प्रत्यय का सबसे स्वाभाविक संकेत प्रसंग में बलि-पशु की ओर है। ‘उसमें से’ पशु से निकाले गए और आगे गिनाए गए अंगों के साथ सहज बैठता है।
- source_word: הָאַלְיָה
  choice: चर्बीदार पूँछ
  rationale: אַלְיָה भेड़ की विशिष्ट मोटी, चर्बीयुक्त पूँछ को सूचित करता है। ‘चर्बीदार पूँछ’ केवल ‘पूँछ’ की तुलना में शारीरिक और बलिदान-संबंधी अर्थ को अधिक स्पष्ट रखता है।
- source_word: הַמְכַסֶּה אֶת־הַקֶּרֶב
  choice: जो अंतड़ियों को ढकती है
  rationale: यहाँ קֶרֶב पशु के भीतरी अंगों, विशेषतः उदर के भीतर के अंगों, को सूचित करता है। ‘अंतड़ियाँ’ साधारण आधुनिक हिंदी में ठोस और समझने योग्य है।
- source_word: כָּל
  choice: सारी
  rationale: כָּל निर्धारित चर्बी के भागों की संपूर्णता पर बल देता है; स्त्रीलिंग ‘चर्बी’ के साथ ‘सारी’ स्वाभाविक है।
