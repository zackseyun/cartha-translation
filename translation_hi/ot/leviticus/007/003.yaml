translation_notes:
  register: भाषा आधुनिक मानक हिंदी में, विधिक-धार्मिक प्रसंग के अनुरूप गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखी गई है। ‘चढ़ाए’ परिचित बलिदानी शब्दावली है; फुटनोट में ‘अर्पित करे’ का वास्तविक विकल्प सुरक्षित रखा गया है।
