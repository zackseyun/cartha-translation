  text: יָדָ֣י/ו תְּבִיאֶ֔ינָה אֵ֖ת אִשֵּׁ֣י יְהוָ֑ה אֶת הַ/חֵ֤לֶב עַל הֶֽ/חָזֶה֙ יְבִיאֶ֔/נּוּ אֵ֣ת הֶ/חָזֶ֗ה לְ/הָנִ֥יף אֹת֛/וֹ תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/030.yaml
  text: 'His own hands shall bring the food offerings of the LORD: he shall bring the fat with the breast, to wave the breast as a wave offering before the LORD.'
translation:
  language: hi
  text: उसके अपने हाथ यहोवा की अग्नि-बलियाँ लाएँ; वह छाती पर की चर्बी लाए। वह छाती को यहोवा के सामने लहराने के लिए लाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: יָדָיו
  choice: अपने ही हाथों से
  rationale: स्वयं चढ़ाने वाले व्यक्ति द्वारा भेंट लाए जाने पर दिए गए मूल पाठ के बल को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: אִשֵּׁי יְהוָה
  choice: यहोवा के लिए अग्नि-बलियाँ
  rationale: אִשֶּׁה का संबंध आग में चढ़ाई जाने वाली भेंट से है; बहुवचन रूप और समर्पण का भाव सुरक्षित रखा गया है।
- source_word: הֶחָזֶה
  choice: छाती
  rationale: बलि-पशु की छाती के भाग के लिए सीधा, सामान्य और संदर्भानुकूल शब्द।
- source_word: תְּנוּפָה
  choice: हिलाई जाने वाली भेंट
  rationale: अनुष्ठान में यहोवा के सामने भेंट को हिलाने की क्रिया को शब्दगत संबंध सहित व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: व्यक्तिगत ईश्वरीय नाम को शीर्षक में बदलने के बजाय हिंदी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत करता है।
theological_decisions:
- issue: छाती को लाने का उद्देश्य
  choice: ताकि छाती को ... हिलाए
  alternative: कि छाती ... हिलाई जाए
  rationale: לְהָנִיף का उद्देश्यसूचक सक्रिय अर्थ बनाए रखा गया है और चढ़ाने वाले व्यक्ति को कर्ता माना गया है; साथ ही निष्क्रिय अनुष्ठानिक अर्थ की संभावना को पाठ में अनावश्यक रूप से नहीं थोपा गया।
- issue: אִשֵּׁי का अर्थ
  choice: अग्नि-बलियाँ
  alternative: भोजन-भेंटें
  rationale: इस शब्द की व्युत्पत्ति और लैव्यव्यवस्था के बलिदानी संदर्भ में आग पर चढ़ाई जाने वाली भेंट का अर्थ अधिक प्रत्यक्ष है; इसे परमेश्वर के शाब्दिक भोजन के रूप में नहीं प्रस्तुत किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और अनुष्ठानिक शब्दावली रखी गई है। दोहराव मूल इब्रानी की संरचना और बल को बनाए रखने के लिए सुरक्षित है।
