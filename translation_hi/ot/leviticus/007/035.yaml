revisions:
- from: यह हारून का अभिषेक से जुड़ा भाग[a] और उसके पुत्रों का अभिषेक से जुड़ा भाग है, जो यहोवा की अग्नि-भेंटों[b] में से मिलता है। यह उस दिन ठहराया गया, जब उसने उन्हें यहोवा के लिए याजकों के रूप में सेवा करने को प्रस्तुत किया।
  to: यह हारून का अभिषेक से जुड़ा भाग[a] और उसके पुत्रों का अभिषेक से जुड़ा भाग है, जो यहोवा की अग्नि-भेंटों[b] में से है, उस दिन का जब उसने उन्हें यहोवा के लिए याजकों के रूप में सेवा करने को प्रस्तुत किया।
  rationale: The revision removes the unsupported passive ‘ठहराया गया’ and directly relates the temporal phrase to the day on which the unnamed subject presented Aaron and his sons for priestly service. It preserves the repeated wording for the two portions, all footnote anchors, the lexical ambiguity of מִשְׁחַת, and the unspecified subject of הִקְרִיב.
  reviewer_model: gpt-5.6-terra
