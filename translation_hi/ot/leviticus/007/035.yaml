reference: Leviticus 7:35
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹ֣את מִשְׁחַ֤ת אַהֲרֹן֙ וּ/מִשְׁחַ֣ת בָּנָ֔י/ו מֵ/אִשֵּׁ֖י יְהוָ֑ה בְּ/יוֹם֙ הִקְרִ֣יב אֹתָ֔/ם לְ/כַהֵ֖ן לַ/יהוָֽה׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/035.yaml
  text: This is the anointed portion of Aaron and the anointed portion of his sons from the food offerings of Yahweh[b][a], on the day when he presented them to serve as priests to Yahweh.
translation:
  language: hi
  text: यह हारून का अभिषेक से जुड़ा भाग[a] और उसके पुत्रों का अभिषेक से जुड़ा भाग है, जो यहोवा की अग्नि-भेंटों[b] में से है, उस दिन का जब उसने उन्हें यहोवा के लिए याजकों के रूप में सेवा करने को प्रस्तुत किया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभिषेक का भाग।” इब्रानी शब्द अभिषेक से संबंधित है, पर यहाँ संभवतः अभिषेक के साथ याजकों के लिए ठहराए गए हिस्से को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे भेंटें जो आग पर चढ़ाई जाती थीं; कुछ अनुवादों में “भोजन-भेंटें।”
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁחַת
  choice: अभिषेक से जुड़ा भाग
  rationale: यह पद अभिषेक से संबंधित याजकीय हिस्से की बात करता है। इस अनुवाद में मूल शब्द का अभिषेक से संबंध और प्रसंग में उसका ‘नियत भाग’ वाला अर्थ—दोनों बने रहते हैं।
- source_word: מִשְׁחַת אַהֲרֹן וּמִשְׁחַת בָּנָיו
  choice: हारून का अभिषेक से जुड़ा भाग और उसके पुत्रों का अभिषेक से जुड़ा भाग
  rationale: इब्रानी में संज्ञा दोहराई गई है; इसलिए हारून और उसके पुत्रों के हिस्सों को अलग-अलग स्पष्ट रूप से रखा गया है।
- source_word: מֵאִשֵּׁי יְהוָה
  choice: यहोवा की अग्नि-भेंटों में से
  rationale: אִשֶּׁה वे भेंटें हैं जो आग पर चढ़ाई जाती हैं। ‘अग्नि-भेंट’ मूल की अग्नि-संबंधी धारणा को संक्षेप और स्वाभाविक रूप में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा रखा गया है।
- source_word: בְּיוֹם
  choice: उस दिन
  rationale: मूल का स्पष्ट काल-सूचक पद बनाए रखा गया है। दूसरे वाक्य में इसे रखना आधुनिक हिन्दी में संबंध को अधिक साफ करता है।
- source_word: הִקְרִיב אֹתָם
  choice: उसने उन्हें ... प्रस्तुत किया
  rationale: קרב के हिफ़ील रूप का मूल भाव ‘निकट लाना’ है; यहाँ मनुष्य वस्तु हैं, इसलिए ‘बलि चढ़ाया’ भ्रामक होता। ‘प्रस्तुत किया’ याजकीय नियुक्ति के औपचारिक प्रसंग के अनुकूल है और मूल में अनिर्दिष्ट कर्ता ‘उसने’ को अनिर्दिष्ट ही रखता है।
- source_word: לְכַהֵן לַיהוָה
  choice: यहोवा के लिए याजकों के रूप में सेवा करने को
  rationale: כהן याजकीय कार्य करने को दर्शाता है और לַיהוָה उस सेवा के लक्ष्य अथवा स्वामी को सूचित करता है।
theological_decisions:
- issue: מִשְׁחַת का याजकीय विधान में अर्थ
  choice: अभिषेक से जुड़ा नियत भाग
  alternative: केवल ‘अभिषेक’ या केवल ‘भाग’
  rationale: संदर्भ चढ़ावों में से याजकों को मिलने वाले हिस्से का है, पर शब्द अभिषेक से व्युत्पन्न है। चयन दोनों पहलुओं को बनाए रखता है और किसी एक को छिपाता नहीं।
- issue: הִקְרִיב का कर्ता
  choice: ‘उसने’ कहकर कर्ता को अनिर्दिष्ट रखना
  alternative: स्पष्ट रूप से ‘मूसा ने’ या ‘यहोवा ने’ कहना
  rationale: इब्रानी क्रिया पुल्लिंग एकवचन है, पर इस पद में कर्ता का नाम नहीं दिया गया। किसी नाम को जोड़ना मूल की अस्पष्टता को अनुचित रूप से समाप्त कर देता।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए स्पष्ट हिन्दी। मूल में दोहराए गए ‘भाग’ को बनाए रखा गया है। लंबे इब्रानी वाक्य को दो हिन्दी वाक्यों में बाँटा गया है, और ‘उसने’ का संदर्भ जानबूझकर अनिर्दिष्ट रखा गया है।
