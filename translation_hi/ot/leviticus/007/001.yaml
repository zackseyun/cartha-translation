  text: 'This is the law of the guilt offering: it is most holy[a].'
translation:
  language: hi
  text: 'दोषबलि[a] की व्यवस्था यह है: यह बलि परमपवित्र है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे ‘क्षतिपूर्ति-बलि’ भी कहा जा सकता है। इब्रानी शब्द आशाम ऐसी बलि का नाम है जो दोष और उसकी क्षतिपूर्ति से जुड़ी है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/זֹאת
  choice: यह है
  rationale: संयोजक וְ के साथ संकेतवाचक זֹאת यहाँ नए निर्देश का आरम्भ करता है। हिन्दी में अलग आरम्भिक ‘और’ जोड़े बिना ‘यह है’ स्वाभाविक रूप से वही कार्य करता है।
- source_word: תּוֹרַת
  choice: व्यवस्था
  rationale: यहाँ תּוֹרָה बलि से सम्बन्धित निर्धारित विधि या नियम को दर्शाता है। ‘व्यवस्था’ लैव्यव्यवस्था के विधिक-सांस्कारिक संदर्भ में संक्षिप्त, गरिमापूर्ण और परिचित है।
- source_word: הָ/אָשָׁם
  choice: दोषबलि
  rationale: אָשָׁם एक विशिष्ट बलि-श्रेणी का नाम है, जो दोष के साथ क्षतिपूर्ति के पहलू से भी जुड़ी है। ‘दोषबलि’ नैतिक और सांस्कारिक अर्थ को सुरक्षित रखते हुए हिन्दी में स्पष्ट पारिभाषिक रूप देता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र
  rationale: यह इब्रानी संबंध-वाक्यांश सर्वोच्च स्तर की पवित्रता व्यक्त करता है। ‘परमपवित्र’ इसे स्वाभाविक हिन्दी में व्यक्त करता है और पवित्रस्थान के किसी विशेष कक्ष से भ्रमित नहीं करता।
- source_word: הוּא
  choice: वह ... है
  rationale: पुल्लिंग सर्वनाम הוּא निकटवर्ती ‘दोषबलि’ को परमपवित्र श्रेणी में रखता है; हिन्दी में ‘वह ... है’ इस विधेयात्मक प्रयोग को स्पष्ट रखता है।
theological_decisions:
- issue: אָשָׁם बलि-श्रेणी का अनुवाद
  choice: दोषबलि
  alternative: क्षतिपूर्ति-बलि / प्रायश्चित्त-बलि
  rationale: ‘दोषबलि’ विशिष्ट लैव्यीय बलि-श्रेणी और दोष के पहलू को बनाए रखता है। ‘क्षतिपूर्ति-बलि’ उससे जुड़ी भरपाई को उभारता है, जबकि ‘प्रायश्चित्त-बलि’ दूसरी बलि-श्रेणी से भ्रम पैदा कर सकता है; इसलिए क्षतिपूर्ति का संकेत पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक-सांस्कारिक शैली। ‘दोषबलि’ और ‘परमपवित्र’ को संयुक्त पारिभाषिक शब्दों के रूप में रखा गया है।
