base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/026.yaml
  text: And you shall not eat any blood in any of your dwellings[b][a], whether from bird or from animal.
translation:
  language: hi
  text: और तुम अपने सभी निवास-स्थानों में पक्षी या पशु का कोई भी रक्त न खाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/כָל דָּם
  choice: और ... किसी भी प्रकार का रक्त
  rationale: וְ पिछले निर्देशों से जोड़ता है। निषेध के साथ כָל का स्वाभाविक हिन्दी अर्थ ‘किसी भी प्रकार का’ है; इससे रक्त पर पूर्ण निषेध स्पष्ट होता है।
- source_word: לֹא תֹאכְלוּ
  choice: न खाना
  rationale: कानूनी निषेध के रूप में यह आधुनिक हिन्दी में सीधा, स्वाभाविक और अधिकारपूर्ण है।
- source_word: בְּ/כֹל מוֹשְׁבֹתֵי/כֶם
  choice: अपने सभी निवास-स्थानों में
  rationale: यह मूल के ‘तुम्हारे सभी निवास-स्थानों में’ को निकटता से रखता और निषेध की व्यापक भौगोलिक सीमा व्यक्त करता है।
- source_word: לָ/עוֹף
  choice: पक्षी का
  rationale: ל यहाँ उस वर्ग से रक्त का संबंध या स्रोत बताता है; हिन्दी में संबंधकारक ‘का’ सहज है।
- source_word: וְ/לַ/בְּהֵמָה
  choice: या पशु का
  rationale: בְּהֵמָה के लिए ‘पशु’ वर्तमान धार्मिक-कानूनी संदर्भ में व्यापक और स्वाभाविक है। सूची में हिन्दी का ‘या’ दोनों श्रेणियों में से किसी के भी रक्त को निषिद्ध बताता है।
theological_decisions:
- issue: रक्त-निषेध का दायरा
  choice: इस्राएल के सभी निवास-स्थानों में पक्षी या पशु के किसी भी रक्त का सेवन निषिद्ध है।
  alternative: अंतिम पदबंध का अधिक अक्षरशः अनुवाद ‘पक्षी के लिए और पशु के लिए’ किया जा सकता है।
  rationale: हिब्रू वाक्य-विन्यास स्वाभाविक रूप से उन जीव-श्रेणियों को बताता है जिनका रक्त निषिद्ध है। अनुवाद बाद की कोई धर्मवैज्ञानिक व्याख्या जोड़े बिना कानूनी निषेध को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; संक्षिप्त, गरिमापूर्ण और कानूनी निर्देश के अनुरूप। ‘न खाना’ आज्ञार्थक निषेध को सहज ढंग से व्यक्त करता है।
