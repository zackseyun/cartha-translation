review_pass:
  verdict: revise
  source_fidelity: The draft correctly renders חֵלֶב as animal fat, distinguishes an animal that died apart from proper slaughter from one torn by a wild animal, preserves the permission for non-food use, and conveys the emphatic prohibition on eating. The Hebrew initial conjunction is better represented as “और” rather than an unstated contrast.
  naturalness: The sentence is generally clear and modern. “अपने-आप मर गया हो” is understandable but slightly informal and less precise for this legal category; “जो अपने आप मर गया हो” is smoother. “कदापि न खाना” is intelligible but somewhat literary/imperatival; “बिल्कुल न खाना” communicates the emphatic prohibition naturally in modern Hindi.
  terminology: “चर्बी” is appropriate in this food-law context. “जंगली पशु” accurately expresses the presumed predator. The footnote should explain that the animal was not properly slaughtered, rather than the awkward formulation that it “died without being properly slaughtered.”
  issues:
  - severity: low
    issue: The opening conjunction is not represented.
    rationale: The verse begins with וְ (“and”). Although omission does not substantially alter meaning, retaining “और” more closely follows the legal sequence.
  - severity: low
    issue: Footnote wording about נְבֵלָה is awkward.
    rationale: “विधिपूर्वक वध किए बिना मर गया” can imply that death itself occurred without slaughter. The intended legal sense is an animal that died without having been properly slaughtered.
  revised_text: और जो पशु अपने आप मर गया हो, उसकी चर्बी, और जिसे किसी जंगली पशु ने फाड़ डाला हो, उसकी चर्बी किसी भी काम में लाई जा सकती है; पर तुम उसे बिल्कुल न खाना।
