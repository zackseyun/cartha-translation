  text: וְ/חֵ֤לֶב נְבֵלָה֙ וְ/חֵ֣לֶב טְרֵפָ֔ה יֵעָשֶׂ֖ה לְ/כָל מְלָאכָ֑ה וְ/אָכֹ֖ל לֹ֥א תֹאכְלֻֽ/הוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/024.yaml
  text: But the fat of an animal that dies naturally[a], and the fat of one torn by beasts, may be used for any work[b]; but you must certainly not eat it.
translation:
  language: hi
  text: और जो पशु अपने आप मर गया हो, उसकी चर्बी, और जिसे किसी जंगली पशु ने फाड़ डाला हो, उसकी चर्बी किसी भी काम में लाई जा सकती है; पर तुम उसे बिल्कुल न खाना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: חֵלֶב
  choice: चर्बी
  rationale: बलि और आहार-विधि के संदर्भ में यह पशु की चर्बी के लिए सहज और प्रचलित हिन्दी शब्द है।
- source_word: נְבֵלָה
  choice: जो पशु अपने-आप मर गया हो
  rationale: यहाँ ऐसे पशु का अर्थ है जो विधिपूर्वक वध किए बिना मर गया हो। यह अनुवाद कानूनी आशय को सामान्य हिन्दी में स्पष्ट करता है।
- source_word: טְרֵפָה
  choice: जिसे जंगली पशु ने फाड़ डाला हो
  rationale: यह शब्द हिंसक पशु द्वारा फाड़े गए पशु को सूचित करता है; हिन्दी में यह अभिकर्ता और दशा दोनों को स्पष्ट रखता है।
- source_word: יֵעָשֶׂה
  choice: काम में लाई जा सकती है
  rationale: निफ़अल रूप यहाँ निर्माण से अधिक अनुमत उपयोग व्यक्त करता है।
- source_word: לְכָל מְלָאכָה
  choice: किसी भी काम में
  rationale: यह खाने के अतिरिक्त व्यापक व्यावहारिक उपयोग की अनुमति को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְאָכֹל לֹא תֹאכְלֻהוּ
  choice: पर तुम उसे कदापि न खाना
  rationale: क्रिया के साथ infinitive absolute निषेध पर बल देता है; ‘कदापि न खाना’ उस प्रबल निषेध को संक्षेप और गरिमा से व्यक्त करता है।
