source:
  edition: WLC
  text: וְ/כָל מִנְחָ֥ה בְלוּלָֽה בַ/שֶּׁ֖מֶן וַ/חֲרֵבָ֑ה לְ/כָל בְּנֵ֧י אַהֲרֹ֛ן תִּהְיֶ֖ה אִ֥ישׁ כְּ/אָחִֽי/ו־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/010.yaml
  text: And every grain offering mixed with oil[a], or dry, shall belong to all the sons of Aaron, each alike with his brother.
translation:
  language: hi
  text: और हर अन्नबलि, चाहे तेल में मिली हुई हो या सूखी, हारून के सब पुत्रों की होगी; हर एक को अपने भाई के बराबर हिस्सा मिलेगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में यह सामान्य भेंट नहीं, बल्कि अनाज से तैयार की जाने वाली विशिष्ट भेंट है; ‘अन्नबलि’ संक्षिप्त, प्रचलित और संदर्भानुकूल है।
- source_word: בְלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: यह पदबंध बलि तैयार करने की विधि बताता है। यह हिन्दी में स्वाभाविक है और मूल के निष्क्रिय भाव को बनाए रखता है।
- source_word: חֲרֵבָה
  choice: सूखा
  rationale: यह तेल में मिले हुए अन्नबलि के विपरीत विशेषण है। ‘सूखा’ मूल का संक्षिप्त शाब्दिक विरोध बनाए रखता है; ‘बिना तेल का’ अर्थ की व्याख्या कर देता।
- source_word: לְכָל בְּנֵי אַהֲרֹן תִּהְיֶה
  choice: हारून के सब पुत्रों का होगा
  rationale: लामेद और היה का यह प्रयोग अधिकार अथवा आवंटन व्यक्त करता है। चुना हुआ वाक्यांश हिन्दी में स्वाभाविक रूप से यही कानूनी भाव देता है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के सब पुत्र
  rationale: मूल पाठ याजकीय संदर्भ में स्पष्ट पुरुषवाची संबंधसूचक शब्द प्रयोग करता है; इसलिए इसे लिंग-निरपेक्ष नहीं बनाया गया।
- source_word: אִישׁ כְּאָחִיו
  choice: हर एक को अपने भाई के समान हिस्सा मिलेगा
  rationale: इब्रानी मुहावरा हारून के पुत्रों के बीच समान वितरण पर बल देता है। ‘हिस्सा मिलेगा’ निहित आवंटन को सहज आधुनिक हिन्दी में स्पष्ट करता है।
theological_decisions:
- issue: पुरुषवाची याजकीय भाषा
  choice: हारून के सब पुत्रों ... अपने भाई
  alternative: हारून की सब संतान ... हर एक को समान रूप से
  rationale: इब्रानी में पुरुषवाची पारिवारिक शब्द याजकीय कानूनी संदर्भ में स्पष्ट हैं। इसलिए ऐतिहासिक और पाठगत विशिष्टता सुरक्षित रखी गई है।
- issue: अन्नबलि का समान वितरण
  choice: हर एक को अपने भाई के समान हिस्सा मिलेगा
  alternative: हर एक अपने भाई के समान
  rationale: मूल मुहावरा तुलना द्वारा समान आवंटन व्यक्त करता है। हिन्दी में ‘हिस्सा’ जोड़ने से निहित कानूनी अर्थ स्पष्ट होता है, बिना वितरण के स्वरूप को और अधिक निर्धारित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण और कानूनी-निर्देशात्मक स्वर। ‘चाहे ... या ...’ मूल के समन्वय को स्वाभाविक हिन्दी में व्यक्त करता है। कोई पादटिप्पणी आवश्यक नहीं मानी गई, क्योंकि वितरण का भाव मुख्य पाठ में स्पष्ट है।
