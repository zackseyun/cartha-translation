id: LEV.7.8
reference: Leviticus 7:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ֨/כֹּהֵ֔ן הַ/מַּקְרִ֖יב אֶת עֹ֣לַת אִ֑ישׁ ע֤וֹר הָֽ/עֹלָה֙ אֲשֶׁ֣ר הִקְרִ֔יב לַ/כֹּהֵ֖ן ל֥/וֹ יִהְיֶֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/008.yaml
  text: And the priest who presents a man's burnt offering shall have for himself the skin of the burnt offering that he has presented[a][b].
translation:
  language: hi
  text: और जो याजक किसी पुरुष की होमबलि चढ़ाता है, जिस होमबलि को उसने चढ़ाया है उसकी खाल[a] उसी याजक की होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चर्म।”
    reason: lexical_alternative
lexical_decisions:
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: बलिदान-संबंधी व्यवस्था में כֹּהֵן के लिए प्रचलित और स्पष्ट हिन्दी पद; निश्चितता प्रसंग और वाक्य-विन्यास से व्यक्त होती है।
- source_word: הַמַּקְרִיב / הִקְרִיב
  choice: चढ़ाता है / चढ़ाई हुई
  rationale: हिफ़ील में קרב का यहाँ अनुष्ठानिक अर्थ बलि प्रस्तुत या अर्पित करना है। ‘चढ़ाना’ आधुनिक हिन्दी में होमबलि के साथ स्वाभाविक है; कृदन्त रूप पहले संपन्न किए गए कर्म को व्यक्त करता है।
- source_word: עֹלַת אִישׁ
  choice: किसी पुरुष की होमबलि
  rationale: עֹלָה को स्थापित धार्मिक पद ‘होमबलि’ से और אִישׁ के एकवचन पुल्लिंग को ‘पुरुष’ से व्यक्त किया गया है; ‘किसी’ अनिश्चित संबंध को स्वाभाविक हिन्दी में रखता है।
- source_word: עֹור
  choice: खाल
  rationale: यह बलि-पशु की उतारी जाने वाली skin/hide है; इस संदर्भ में ‘खाल’ ‘चमड़ी’ की अपेक्षा अधिक स्वाभाविक और सटीक है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: लैव्यव्यवस्था में עֹלָה की स्थापित बलिदान-श्रेणी को स्पष्ट रूप से दर्शाता है; ‘आरोहण-बलि’ व्युत्पत्ति दिखाती, पर सामान्य पाठक के लिए कम सहज होती।
- source_word: לַכֹּהֵן לוֹ יִהְיֶה
  choice: उसी याजक की होगी
  rationale: शाब्दिक बल ‘याजक के लिए—उसी की होगी’ को ‘उसी’ द्वारा सुरक्षित रखते हुए यह स्पष्ट किया गया है कि खाल बलि चढ़ाने वाले याजक का भाग है।
theological_decisions:
- issue: אִישׁ का लिंग-सूचक अनुवाद
  choice: किसी पुरुष की होमबलि
  alternative: किसी व्यक्ति की होमबलि
  rationale: मूल में एकवचन पुल्लिंग אִישׁ है। ‘पुरुष’ उसका रूप सुरक्षित रखता है, जबकि ‘व्यक्ति’ लिंग-सूचना को सामान्य बना देता।
- issue: עֹלָה के लिए बलिदान-संबंधी पद
  choice: होमबलि
  alternative: आरोहण-बलि
  rationale: ‘होमबलि’ हिन्दी बाइबलीय प्रयोग में इस पूर्णतः जलाए जाने वाले बलिदान की पहचानी हुई श्रेणी है। वैकल्पिक पद मूल की आरोहण-संबंधी व्युत्पत्ति दिखाता है, पर अनुष्ठानिक अर्थ कम स्पष्ट कर सकता है।
- issue: खाल पाने वाले याजक की पहचान
  choice: उसी याजक की होगी
  alternative: याजक की होगी
  rationale: לוֹ का बल उस याजक पर है जिसने बलि चढ़ाई; ‘उसी’ इस संदर्भ को स्पष्ट करता है और खाल को सामान्य याजकीय संपत्ति बताने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘याजक’ और ‘होमबलि’ स्थापित धार्मिक शब्द हैं। हिन्दी में अनावश्यक पुनरुक्ति से बचते हुए मूल का बल ‘उसी याजक’ में सुरक्षित रखा गया है।
