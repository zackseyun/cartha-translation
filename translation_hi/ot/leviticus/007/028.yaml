base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/028.yaml
  text: And Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: और यहोवा ने मूसा से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: और ... ने ... कहा
  rationale: वाव-क्रमिक रूप अगले वचन-खंड को आरम्भ करता है। हिन्दी में ‘कहा’ यहाँ स्वाभाविक है; आगे לֵאמֹר का अलग शाब्दिक अनुवाद अनावश्यक पुनरुक्ति पैदा करता।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल में प्रयुक्त चतुरक्षरीय व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: אֶל
  choice: से
  rationale: हिन्दी में ‘किसी से कहना’ बोलने के संबोधित व्यक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: व्यक्तिनाम का मानक हिन्दी बाइबलीय रूप।
- source_word: לֵאמֹר
  choice: प्रत्यक्ष रूप से अलग अनूदित नहीं
  rationale: यह सूत्र आगामी प्रत्यक्ष वचन का परिचय देता है। ‘कहा’ और अल्पविराम से हिन्दी में इसका कार्य स्पष्ट होता है; ‘यह कहते हुए’ जोड़ना कृत्रिम और पुनरुक्तिपूर्ण होता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ व्यक्तिगत ईश्वरीय नाम का प्रयोग करता है। ‘यहोवा’ आधुनिक हिन्दी पाठकों में व्यापक रूप से पहचाना जाने वाला लिप्यंतरण है और नाम को ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं करता।
translation_notes:
  register: सरल, आधुनिक और गरिमापूर्ण मानक हिन्दी। मूल के सामान्य भाषण-सूत्र को हिन्दी की स्वाभाविक रचना में रखा गया है।
