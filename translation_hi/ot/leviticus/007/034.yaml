  text: כִּי֩ אֶת חֲזֵ֨ה הַ/תְּנוּפָ֜ה וְ/אֵ֣ת שׁ֣וֹק הַ/תְּרוּמָ֗ה לָקַ֨חְתִּי֙ מֵ/אֵ֣ת בְּנֵֽי יִשְׂרָאֵ֔ל מִ/זִּבְחֵ֖י שַׁלְמֵי/הֶ֑ם וָ/אֶתֵּ֣ן אֹ֠תָ/ם לְ/אַהֲרֹ֨ן הַ/כֹּהֵ֤ן וּ/לְ/בָנָי/ו֙ לְ/חָק עוֹלָ֔ם מֵ/אֵ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/007/034.yaml
  text: For I have taken the breast of the wave offering and the thigh of the contribution from the sons of Israel[a], from their sacrifices of peace offerings[c][b], and I have given them to Aaron the priest and to his sons as a permanent statute from the sons of Israel.
translation:
  language: hi
  text: क्योंकि इस्राएल के पुत्रों[a] की मेलबलियों[c] में से लहराई हुई भेंट की छाती और उठाई हुई भेंट की जाँघ मैंने ले ली हैं[b], और उन्हें हारून याजक और उसके पुत्रों को इस्राएल के पुत्रों की ओर से सदा की विधि के रूप में दे दिया है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “इस्राएलियों”; इब्रानी में शाब्दिक रूप से “इस्राएल के पुत्रों” है, जो वाचा-संबंधी एक मानक पद है।
    reason: lexical_alternative
  - marker: b
    text: “उठाई हुई भेंट” उस अंश को दर्शाती है जिसे अलग करके भेंट के रूप में उठाया या प्रस्तुत किया जाता था; इसे “अंशदान” भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: या “शान्ति-बलियों”।
    reason: lexical_alternative
lexical_decisions:
- source_word: חֲזֵה
  choice: छाती
  rationale: यह पशु की छाती के उस विशिष्ट भाग को दर्शाता है जो याजकीय अंश था; आधुनिक हिन्दी में यह स्वाभाविक और शारीरिक रूप से स्पष्ट है।
- source_word: תְּנוּפָה
  choice: हिलाई हुई भेंट
  rationale: यह अनुष्ठान में भेंट को हिलाकर प्रस्तुत करने की विशिष्ट क्रिया और भेंट-श्रेणी को बनाए रखता है।
- source_word: שׁוֹק
  choice: जाँघ
  rationale: यह याजक को दिए जाने वाले पैर के ऊपरी भाग का उपयुक्त शारीरिक नाम है।
- source_word: תְּרוּמָה
  choice: उठाई हुई भेंट
  rationale: यह अलग करके ऊपर उठाए अथवा प्रस्तुत किए गए अंश का संकेत देता है और תְּנוּפָה से भेद बनाए रखता है।
- source_word: לָקַחְתִּי
  choice: मैंने ले ली हैं
  rationale: हिब्रू पूर्ण क्रिया यहाँ स्थापित दैवी व्यवस्था के वर्तमान परिणाम को व्यक्त करती है; हिन्दी पूर्ण रूप इसे स्वाभाविक ढंग से दिखाता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: हिब्रू की औपचारिक वाचा-संबंधी पदावली को यथासंभव प्रत्यक्ष रखा गया है; अधिक मुहावरेदार विकल्प पादटिप्पणी में है।
- source_word: זִבְחֵי שַׁלְמֵיהֶם
  choice: उनके मेलबलियों
  rationale: זֶבַח और שְׁלָמִים दोनों का आशय संक्षिप्त हिन्दी संयुक्त पद में रहता है; 'मेलबलि' शांति/कल्याण और सहभागिता से जुड़ी बलि-श्रेणी का पारंपरिक, बोधगम्य नाम है।
- source_word: וָאֶתֵּן אֹתָם
  choice: और उन्हें ... दे दिया है
  rationale: यह दैवी रूप से स्थापित और अब भी प्रभावी याजकीय अधिकार को स्वाभाविक हिन्दी पूर्ण रूप में व्यक्त करता है।
- source_word: לְחָק עוֹלָם
  choice: सदा की विधि के रूप में
  rationale: यह स्थायी कानूनी विधान का भाव स्पष्ट, आधुनिक और गरिमापूर्ण हिन्दी में देता है।
- source_word: מֵאֵת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों की ओर से
  rationale: अंतिम מֵאֵת को केवल भौतिक स्रोत की पुनरावृत्ति न मानकर इस्राएलियों की ओर से देय स्थायी अंश के रूप में स्वाभाविक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: वाचा-संबंधी नाम בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  alternative: इस्राएली
  rationale: मुख्य पाठ हिब्रू के औपचारिक पुरुषवाचक बहुवचन पद को सुरक्षित रखता है, जबकि पादटिप्पणी सामान्य आधुनिक विकल्प देती है।
- issue: שְׁלָמִים बलि-श्रेणी का नाम
  choice: मेलबलि
  alternative: शान्ति-बलि
  rationale: शब्द के अर्थ-क्षेत्र में शांति, पूर्णता और सहभागिता जुड़े हैं। 'मेलबलि' हिन्दी बाइबलीय प्रयोग में पहचाना जाता है, पर वैकल्पिक अनुवाद देकर अर्थ को किसी एक धर्मवैज्ञानिक व्याख्या तक सीमित नहीं किया गया।
- issue: לְחָק עוֹלָם की अवधि
  choice: सदा की विधि
  alternative: स्थायी विधान
  rationale: यह मूल की दीर्घस्थायी वैधानिक शक्ति को बनाए रखता है, बिना यहाँ उसके धर्मवैज्ञानिक अनुप्रयोग या सीमा का अतिरिक्त निर्धारण किए।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक-उपासना संबंधी शैली रखी गई है। वाक्यक्रम को हिन्दी में स्वाभाविक बनाया गया है, पर दोनों भेंट-श्रेणियों, दोनों पशु-अंशों, दैवी प्रथम पुरुष और स्थायी विधान को स्पष्ट रूप से सुरक्षित रखा गया है।
