translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विधिक बल के लिए ‘तोड़ दिया जाए’ और ‘धोया जाए’ का प्रयोग हुआ है। ‘स्राव से पीड़ित व्यक्ति’ तकनीकी आशय स्पष्ट करता है, जबकि फुटनोट इब्रानी की संक्षिप्त संरचना बताता है।
