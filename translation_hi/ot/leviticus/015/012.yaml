  text: וּ/כְלִי חֶ֛רֶשׂ אֲשֶׁר יִגַּע בּ֥/וֹ הַ/זָּ֖ב יִשָּׁבֵ֑ר וְ/כָל כְּלִי עֵ֔ץ יִשָּׁטֵ֖ף בַּ/מָּֽיִם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/012.yaml
  text: And an earthen vessel that the one with the discharge touches shall be broken[c][b][a], and every wooden vessel shall be rinsed with water.
translation:
  language: hi
  text: मिट्टी का कोई बर्तन[a], जिसे स्राव वाला पुरुष[b] छुए, तोड़ दिया जाए; और लकड़ी का हर बर्तन पानी से धोया[c] जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘मिट्टी का पात्र’ अथवा ‘मृद्भांड।’
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक रूप से ‘स्राव वाला’; यह शारीरिक स्राव वाले पुरुष के लिए शुद्धता-विधि का एक विशेष पद है।
    reason: cultural_note
  - marker: c
    text: या, ‘पानी से खंगाला जाए।’
    reason: lexical_alternative
lexical_decisions:
- source_word: כְלִי חֶרֶשׂ
  choice: मिट्टी का बर्तन
  rationale: כְלִי חֶרֶשׂ मिट्टी से बने पात्र या बर्तन को दर्शाता है। ‘मिट्टी का बर्तन’ आधुनिक हिन्दी में स्वाभाविक है और शुद्धता-विधि में महत्त्वपूर्ण सामग्री-भेद को बनाए रखता है।
- source_word: אֲשֶׁר יִגַּע בּוֹ
  choice: जिसे ... छुए
  rationale: נגע के सामान्य अर्थ ‘छूना’ को सीधे और स्वाभाविक ढंग से व्यक्त किया गया है।
- source_word: הַזָּב
  choice: स्राव से पीड़ित व्यक्ति
  rationale: यह शारीरिक स्राव से प्रभावित व्यक्ति के लिए शुद्धता-विधि का तकनीकी पद है। हिन्दी अभिव्यक्ति अवस्था को स्पष्ट करती है और पद में अनावश्यक लिंग-सूचना नहीं जोड़ती।
- source_word: יִשָּׁבֵר
  choice: तोड़ दिया जाए
  rationale: שבר का निफ़ाल रूप यहाँ निष्क्रिय कानूनी निर्देश देता है; ‘तोड़ दिया जाए’ हिन्दी में इस विधिक आदेश को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כָל כְּלִי עֵץ
  choice: लकड़ी का हर बर्तन
  rationale: यह लकड़ी से बनी प्रत्येक संबंधित वस्तु या पात्र को दर्शाता है। ‘बर्तन’ पहले खंड के כְלִי के साथ समानांतरता बनाए रखता है।
- source_word: יִשָּׁטֵף בַּמָּיִם
  choice: पानी से धोया जाए
  rationale: שטף यहाँ पानी से धोने या खंगालने की क्रिया बताता है। ‘पानी से धोया जाए’ सामान्य हिन्दी में स्पष्ट और स्वाभाविक है।
