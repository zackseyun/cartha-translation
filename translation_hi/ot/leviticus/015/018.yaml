id: LEV.15.18
reference: Leviticus 15:18
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִשָּׁ֕ה אֲשֶׁ֨ר יִשְׁכַּ֥ב אִ֛ישׁ אֹתָ֖/הּ שִׁכְבַת זָ֑רַע וְ/רָחֲצ֣וּ בַ/מַּ֔יִם וְ/טָמְא֖וּ עַד הָ/עָֽרֶב־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/018.yaml
  text: If a man lies with a woman and has an emission of semen[b][a], both of them shall wash in water and be unclean until the evening.
translation:
  language: hi
  text: यदि कोई पुरुष किसी स्त्री के साथ सहवास करे और वीर्य स्खलित हो,[a] तो वे दोनों जल से स्नान करें और शाम तक अशुद्ध रहें।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वीर्यपात के साथ।” इब्रानी पदबंध विशेष रूप से वीर्य के स्खलन को बताता है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वे अनुष्ठानिक रूप से शाम तक अशुद्ध रहेंगे; यहाँ नैतिक दोष की बात नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וְאִשָּׁה אֲשֶׁר
  choice: यदि कोई ... स्त्री
  rationale: विधिक प्रसंग में यह संबंधवाचक रचना शर्त का भाव रखती है; हिन्दी में ‘यदि’ इसका स्वाभाविक और स्पष्ट रूप है।
- source_word: יִשְׁכַּב אִישׁ אֹתָהּ
  choice: कोई पुरुष किसी स्त्री के साथ सहवास करे
  rationale: שׁכב यहाँ यौन-संबंध का प्रचलित इब्रानी मुहावरा है। ‘सहवास करे’ आधुनिक हिन्दी में स्पष्ट, गरिमापूर्ण और विधिक शैली के अनुकूल है।
- source_word: שִׁכְבַת זָרַע
  choice: वीर्य स्खलित हो
  rationale: यह पदबंध विशेष रूप से वीर्य के स्खलन को दर्शाता है। चुना हुआ रूप शारीरिक आशय को स्पष्ट रखता है और अस्वाभाविक शब्दशः अनुवाद से बचता है।
- source_word: וְרָחֲצוּ בַמַּיִם
  choice: वे दोनों जल से स्नान करें
  rationale: बहुवचन क्रिया दोनों सहभागियों की ओर संकेत करती है। ‘दोनों’ संदर्भ को स्पष्ट करता है और ‘जल से स्नान करें’ शुद्धि-संबंधी धुलाई का स्वाभाविक हिन्दी रूप है।
- source_word: וְטָמְאוּ
  choice: अशुद्ध रहें
  rationale: यहाँ טמא अस्थायी अनुष्ठानिक अशुद्धता की दशा बताता है। मुख्य पाठ में केवल ‘अशुद्ध’ रखकर नैतिक दोष का भाव नहीं जोड़ा गया।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह इब्रानी समय-सीमा का सहज और सटीक आधुनिक हिन्दी रूप है; ‘सूर्यास्त तक’ कहना मूल से अधिक विशिष्ट होता।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में अशुद्धता का स्वरूप
  choice: मुख्य पाठ में ‘अशुद्ध’ रखा गया और टिप्पणी में इसका अनुष्ठानिक अर्थ स्पष्ट किया गया।
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ या ‘धार्मिक रीति से अशुद्ध’ मुख्य पाठ में रखना।
  rationale: पद अस्थायी शुद्धता-दशा का वर्णन करता है, नैतिक अपराध या पाप का नहीं। संक्षिप्त मूल अभिव्यक्ति को मुख्य पाठ में बनाए रखते हुए टिप्पणी गलत नैतिक निष्कर्ष से बचाती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सहवास’ तथा ‘वीर्य स्खलित हो’ यौन और शारीरिक आशय को बिना अशिष्टता या अनावश्यक चिकित्सकीय जटिलता के व्यक्त करते हैं; वाक्य की विधिक प्रकृति भी बनी रहती है।
