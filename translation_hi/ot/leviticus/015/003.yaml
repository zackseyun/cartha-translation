language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/זֹ֛את תִּהְיֶ֥ה טֻמְאָת֖/וֹ בְּ/זוֹב֑/וֹ רָ֣ר בְּשָׂר֞/וֹ אֶת זוֹב֗/וֹ אֽוֹ הֶחְתִּ֤ים בְּשָׂר/וֹ֙ מִ/זּוֹב֔/וֹ טֻמְאָת֖/וֹ הִֽוא־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/003.yaml
  text: 'And this shall be his uncleanness in his discharge: whether his body runs with his discharge[a], or his body is stopped up from his discharge, it is his uncleanness.'
translation:
  language: hi
  text: 'और उसके स्राव के विषय में उसकी अशुद्धता यह होगी: चाहे उसके शरीर से स्राव बहता हो, या उसके शरीर से स्राव निकलना रुक गया हो[a], यह उसकी अशुद्धता है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उसका मांस अपने स्राव से बंद हो गया हो।” हिब्रू वाक्यांश का अर्थ यह भी हो सकता है कि शरीर स्राव को रोक रहा हो या स्राव के निकलने से रुद्ध हो गया हो।
    reason: हिब्रू में ‘मांस/शरीर’, ‘बंद होना’, और ‘स्राव से’ का संबंध संक्षिप्त और कुछ अस्पष्ट है। मुख्य पाठ संदर्भानुकूल अर्थ देता है, जबकि पादटिप्पणी शाब्दिक रूप और वैकल्पिक समझ सुरक्षित रखती है।
lexical_decisions:
- source_word: טֻמְאָתוֹ
  choice: उसकी अशुद्धता
  rationale: लैव्यव्यवस्था के संदर्भ में यह शब्द अनुष्ठानिक अशुद्धता की विधिक श्रेणी बताता है; ‘अशुद्धता’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: זוֹב
  choice: स्राव
  rationale: यहाँ शब्द असामान्य शारीरिक, विशेषतः जननांग-संबंधी, बहाव को दर्शाता है; ‘स्राव’ स्पष्ट, संयत और चिकित्सकीय रूप से उपयुक्त है।
- source_word: רָר
  choice: बहता हो
  rationale: क्रिया स्राव के सक्रिय रूप से निकलने या बहने को व्यक्त करती है।
- source_word: בְּשָׂרוֹ
  choice: उसका शरीर
  rationale: शाब्दिक अर्थ ‘उसका मांस’ है, पर यहाँ आशय स्राव से संबंधित शरीर या शारीरिक अंग से है; ‘शरीर’ हिन्दी में अधिक स्वाभाविक है और अनचाहे धर्मवैचारिक अर्थ से बचाता है।
- source_word: הֶחְתִּים
  choice: अवरुद्ध हो गया हो
  rationale: यह रूप बंद हो जाने या रुकावट उत्पन्न होने की दशा बताता है और पहले बताए गए बहते स्राव के विपरीत स्थिति प्रस्तुत करता है।
- source_word: מִזּוֹבוֹ
  choice: स्राव के कारण
  rationale: यहाँ מִן को कारण के अर्थ में समझना स्वाभाविक हिन्दी देता है; ‘स्राव से/स्राव को निकलने से अवरुद्ध’ की शाब्दिक संरचना भी संभव है, इसलिए उसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְזֹאת תִּהְיֶה
  choice: और ... यह होगी
  rationale: यह विधिक परिचय-सूत्र के संयोजक और भावी रूप दोनों को बनाए रखता है।
- source_word: אוֹ
  choice: चाहे ... या
  rationale: यह एक ही अशुद्धता-विधान के अंतर्गत दो वैकल्पिक शारीरिक दशाओं को स्पष्ट करता है।
theological_decisions:
- issue: अशुद्धता की प्रकृति
  choice: ‘अशुद्धता’ को अनुष्ठानिक-विधिक श्रेणी के रूप में रखा गया है
  alternative: इसे नैतिक दोष या पाप के रूप में व्यक्त करना
  rationale: मूल पद शुद्धता-विधान में व्यक्ति की अनुष्ठानिक दशा बताता है; वह अपने आप में नैतिक अपराध घोषित नहीं करता।
- issue: הֶחְתִּים ... מִזּוֹבוֹ का संबंध
  choice: स्राव के कारण शरीर के अवरुद्ध होने की दशा
  alternative: शरीर का स्राव को रोक लेना या स्राव निकलने से बंद हो जाना
  rationale: हिब्रू वाक्यांश की व्याख्या में कुछ अस्पष्टता है; मुख्य पाठ स्वाभाविक हिन्दी देता है और वैकल्पिक, अधिक शाब्दिक समझ पादटिप्पणी में रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक है। ‘स्राव’ चिकित्सकीय स्पष्टता रखता है, जबकि ‘शरीर’ शाब्दिक ‘मांस’ की अपेक्षा सामान्य पाठक के लिए अधिक स्वाभाविक है। पादटिप्पणी मूल वाक्यांश की वास्तविक अस्पष्टता को बिना अनावश्यक विस्तार के बनाए रखती है।
