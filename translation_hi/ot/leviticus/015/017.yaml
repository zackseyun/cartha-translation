base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/017.yaml
  text: And every garment and every skin on which there is an emission of semen shall be washed with water and be unclean until the evening[a][b].
translation:
  language: hi
  text: और हर वस्त्र और हर खाल[b], जिस पर वीर्य का स्राव[a] हो, पानी से धोए जाएँ और शाम तक अशुद्ध रहें।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘वीर्यपात’।
    reason: lexical_alternative
  - marker: b
    text: ‘खाल’ से संभवतः पशु की खाल से बनी कोई वस्तु अभिप्रेत है; संदर्भ के अनुसार ‘चमड़ा’ भी अनुवाद हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בֶּגֶד
  choice: वस्त्र
  rationale: यह सामान्य रूप से पहनने के कपड़े या वस्त्र को दर्शाता है। ‘वस्त्र’ आधुनिक मानक हिन्दी में स्वाभाविक, गरिमापूर्ण और पर्याप्त व्यापक है।
- source_word: עוֹר
  choice: खाल
  rationale: मूल शब्द त्वचा या पशु-खाल को दर्शाता है और यहाँ संभवतः खाल से बनी किसी वस्तु के लिए प्रयुक्त है। ‘खाल’ मूल अर्थ को सीधे रखता है; संदर्भगत संभावना पादटिप्पणी में दी गई है।
- source_word: אֲשֶׁר יִהְיֶה עָלָיו
  choice: जिस ... पर ... लगा हो
  rationale: यह स्थान-संबंधी अर्थ ‘जिस पर हो’ को सुरक्षित रखते हुए हिन्दी में द्रव्य के किसी वस्तु पर होने की स्वाभाविक अभिव्यक्ति देता है।
- source_word: שִׁכְבַת זָרַע
  choice: वीर्य का स्राव
  rationale: यह पदबंध निकले हुए वीर्य को दर्शाता है। ‘वीर्य का स्राव’ स्पष्ट है और केवल ‘बीज’ कहने से उत्पन्न अस्पष्टता से बचता है।
- source_word: וְכֻבַּס
  choice: उसे ... धोया जाए
  rationale: कानूनी निर्देश के निष्क्रिय रूप को हिन्दी में स्वाभाविक विधिक शैली में रखा गया है।
- source_word: בַּמַּיִם
  choice: पानी से
  rationale: यहाँ पूर्वसर्ग धुलाई के साधन को दर्शाता है; ‘पानी से’ आधुनिक हिन्दी में सहज है।
- source_word: וְטָמֵא
  choice: अशुद्ध रहे
  rationale: ‘अशुद्ध’ लैव्यव्यवस्था की विधिगत शुद्धता-अशुद्धता की श्रेणी को व्यक्त करता है और अपने आप नैतिक दोष का अर्थ नहीं जोड़ता।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह समय-सीमा को संक्षिप्त और स्वाभाविक हिन्दी में ठीक प्रकार व्यक्त करता है।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में अशुद्धता का स्वरूप
  choice: טָמֵא का अनुवाद ‘अशुद्ध’ किया गया है, इसे विधिगत स्थिति के रूप में खुला रखते हुए।
  alternative: अपवित्र
  rationale: इस प्रसंग में अशुद्धता अनिवार्यतः व्यक्तिगत पाप या नैतिक दोष नहीं है। ‘अशुद्ध’ स्रोत की विधिगत श्रेणी को बिना अतिरिक्त धर्मवैचारिक निष्कर्ष जोड़े सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी की है, किंतु विधिक प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। ‘जिस किसी ... या ...’ ने इब्रानी के वितरणात्मक ‘हर वस्त्र और हर खाल’ को हिन्दी में स्वाभाविक ढंग से व्यक्त किया है।
