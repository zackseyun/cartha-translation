source:
  edition: WLC
  text: זֹ֥את תּוֹרַ֖ת הַ/זָּ֑ב וַ/אֲשֶׁ֨ר תֵּצֵ֥א מִמֶּ֛/נּוּ שִׁכְבַת זֶ֖רַע לְ/טָמְאָה בָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/032.yaml
  text: 'This is the law for the one with a discharge[a], and for him from whom an emission of semen goes out, making him unclean by it:'
translation:
  language: hi
  text: 'यह स्राव वाले व्यक्ति और उस पुरुष के लिए व्यवस्था है जिससे वीर्य निकलता है और जो उसके कारण अशुद्ध हो जाता है:'
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: זֹאת תּוֹרַת
  choice: यह व्यवस्था है
  rationale: यह पद पिछले नियमों का सार प्रस्तुत करता है। लैव्यव्यवस्था के विधिक संदर्भ में תּוֹרָה के लिए ‘व्यवस्था’ स्वाभाविक और गरिमापूर्ण है।
- source_word: הַזָּב
  choice: स्राववाला व्यक्ति
  rationale: यह कृदन्त-संज्ञा शारीरिक स्राव से ग्रस्त व्यक्ति को बताती है। ‘व्यक्ति’ मूल पद की स्थिति-केंद्रित अभिव्यक्ति को बनाए रखता है।
- source_word: וַאֲשֶׁר תֵּצֵא מִמֶּנּוּ שִׁכְבַת זֶרַע
  choice: और उस पुरुष के लिए, जिसका वीर्य निकलने से
  rationale: שִׁכְבַת זֶרַע वीर्य के निकलने को सूचित करता है। हिंदी में ‘जिसका वीर्य निकलने से’ स्पष्ट और सहज है; ‘पुरुष’ प्रसंग में निहित पुरुष-संदर्भ को स्वाभाविक बनाता है।
- source_word: לְטָמְאָה בָהּ
  choice: वह उसके कारण अशुद्ध हो जाता है
  rationale: लामेदयुक्त infinitive यहाँ परिणाम को व्यक्त कर सकता है, और בָהּ अशुद्धता के साधन/कारण के रूप में वीर्य-उत्सर्जन की ओर लौटता है।
theological_decisions:
- issue: לְטָמְאָה का उद्देश्य अथवा परिणाम
  choice: 'परिणाम: ‘अशुद्ध हो जाता है’'
  alternative: 'उद्देश्य/फल: ‘ताकि वह अशुद्ध हो जाए’'
  rationale: इस प्रसंग में वाक्य का आशय उत्सर्जन से होने वाली विधिक अशुद्धता बताना है; हिंदी में परिणामसूचक रूप अधिक स्वाभाविक है, जबकि मूल की संभावित उद्देश्य/परिणाम अस्पष्टता को कठोरता से सिद्धान्तगत नहीं बनाया गया।
translation_notes:
  register: आधुनिक मानक हिंदी; विधिक-पवित्रशास्त्रीय गरिमा बनाए रखते हुए शारीरिक विषय को स्पष्ट, अश्लीलतारहित भाषा में व्यक्त किया गया है। अगले पदों में सूची जारी रहने के कारण अंत में द्विबिंदु रखा गया है।
