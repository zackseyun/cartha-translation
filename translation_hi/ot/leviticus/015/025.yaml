id: LEV.15.25
reference: Leviticus 15:25
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִשָּׁ֡ה כִּֽי יָזוּב֩ ז֨וֹב דָּמָ֜/הּ יָמִ֣ים רַבִּ֗ים בְּ/לֹא֙ עֶת נִדָּתָ֔/הּ א֥וֹ כִֽי תָז֖וּב עַל נִדָּתָ֑/הּ כָּל יְמֵ֞י ז֣וֹב טֻמְאָתָ֗/הּ כִּ/ימֵ֧י נִדָּתָ֛/הּ תִּהְיֶ֖ה טְמֵאָ֥ה הִֽוא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/025.yaml
  text: If a woman has a discharge of blood for many days[a], not at the time of her menstrual impurity, or if she has a discharge beyond her menstrual impurity, all the days of her unclean discharge she shall be unclean[b], as in the days of her menstrual impurity.
translation:
  language: hi
  text: यदि किसी स्त्री को बहुत दिनों तक रक्तस्राव होता रहे—उसकी मासिक अशुद्धता के समय के अतिरिक्त[a]—या उसका रक्तस्राव उसकी मासिक अशुद्धता की अवधि से आगे तक जारी रहे[b], तो जिस रक्तस्राव के कारण वह अशुद्ध है, उसके सभी दिनों में वह अशुद्ध रहेगी; वह वैसी ही अशुद्ध होगी जैसी अपनी मासिक अशुद्धता के दिनों में होती है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके मासिक धर्म के समय के बाहर।’ इब्रानी शब्द केवल रक्तस्राव ही नहीं, उससे जुड़ी अनुष्ठानिक अशुद्धता की स्थिति को भी समेटता है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘यदि उसे अपनी मासिक अशुद्धता के अतिरिक्त रक्तस्राव हो,’ अर्थात सामान्य मासिक अवधि के बाद भी रक्तस्राव जारी रहे।
    reason: lexical_alternative
lexical_decisions:
- source_word: יָזוּב / תָזוּב + זוֹב
  choice: रक्तस्राव होता रहे / रक्तस्राव ... जारी रहे
  rationale: क्रिया-संज्ञा संयोजन असामान्य शारीरिक बहाव को व्यक्त करता है। ‘रक्तस्राव’ आधुनिक हिन्दी में स्वाभाविक और स्पष्ट है; ‘जारी रहे’ अवधि के विस्तार को दिखाता है।
- source_word: דָּמָהּ
  choice: रक्तस्राव
  rationale: शाब्दिक अर्थ ‘उसका रक्त’ है, पर זוֹב के साथ हिन्दी में ‘रक्तस्राव’ सहज रूप से रक्त के बहाव को व्यक्त करता है।
- source_word: יָמִים רַבִּים
  choice: बहुत दिनों तक
  rationale: यह अवधि को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: בְּלֹא עֶת נִדָּתָהּ
  choice: उसकी मासिक अशुद्धता के समय के अतिरिक्त
  rationale: यह सामान्य समय से बाहर होने का अर्थ रखता है और נִדָּה में निहित अनुष्ठानिक अशुद्धता को भी बनाए रखता है।
- source_word: נִדָּה
  choice: मासिक अशुद्धता
  rationale: लैव्यव्यवस्था के इस विधिक संदर्भ में शब्द केवल मासिक धर्म के रक्तस्राव को नहीं, उससे जुड़ी अनुष्ठानिक स्थिति को भी दर्शाता है।
- source_word: עַל נִדָּתָהּ
  choice: उसकी मासिक अशुद्धता की अवधि से आगे तक
  rationale: עַל यहाँ सामान्य मासिक अवधि के पार रक्तस्राव जारी रहने का अर्थ दे सकता है; यह चयन उस प्रसंगगत अर्थ को स्पष्ट करता है।
- source_word: כָּל יְמֵי זֹב טֻמְאָתָהּ
  choice: अपने अशुद्ध करनेवाले रक्तस्राव के सभी दिनों में
  rationale: यह संरचना रक्तस्राव और उससे उत्पन्न अनुष्ठानिक अशुद्धता के संबंध को स्पष्ट करती है, बिना नैतिक दोष का संकेत दिए।
- source_word: טְמֵאָה
  choice: अशुद्ध
  rationale: यह लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की श्रेणी के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: כִּימֵי נִדָּתָהּ
  choice: जैसे वह अपनी मासिक अशुद्धता के दिनों में रहती है
  rationale: यह असामान्य रक्तस्राव के दौरान उसकी स्थिति की तुलना सामान्य मासिक अशुद्धता के दिनों से स्पष्ट रूप से करता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की भाषा को नैतिक दोष समझे जाने से बचाना
  choice: ‘अशुद्ध’ और ‘मासिक अशुद्धता’ को अनुष्ठानिक स्थिति के अर्थ में रखना
  alternative: केवल ‘मासिक धर्म’ या ‘रजोधर्म’ कहना, अथवा हर जगह ‘अपवित्र’ कहना
  rationale: पद का विषय लैव्यव्यवस्था की अनुष्ठानिक शुद्धता है, व्यक्तिगत पाप या नैतिक दोष नहीं। ‘अशुद्ध’ इस विधिक श्रेणी को सुरक्षित रखता है।
- issue: עַל נִדָּתָהּ की अर्थगत अनिश्चितता
  choice: मुख्य पाठ में सामान्य अवधि से आगे तक जारी रहने का अर्थ
  alternative: उसकी मासिक अशुद्धता के अतिरिक्त रक्तस्राव
  rationale: प्रसंग अवधि के बढ़ने का समर्थन करता है, पर इब्रानी पूर्वसर्ग ‘अतिरिक्त’ का भाव भी दे सकता है; इसलिए विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, विधिक किंतु सहज रखी गई है। ‘रक्तस्राव’ चिकित्सा-सदृश स्पष्टता देता है, जबकि ‘मासिक अशुद्धता’ मूल के अनुष्ठानिक आयाम को सुरक्षित रखता है। ‘अशुद्ध’ को नैतिक निंदा के अर्थ में नहीं लिया गया है।
