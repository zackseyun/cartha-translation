base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/033.yaml
  text: and for the woman who is sick in her menstrual impurity, and for the one who has a discharge, whether male or female, and for a man who lies with an unclean woman.
translation:
  language: hi
  text: और उस स्त्री के विषय में जो अपनी मासिक अशुद्धता में अस्वस्थ हो[a], और उस व्यक्ति के विषय में जिसे स्राव हो—चाहे वह पुरुष हो या स्त्री—और उस पुरुष के विषय में जो किसी अशुद्ध स्त्री[b] के साथ सोए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “मासिक धर्म वाली स्त्री”; यहाँ इब्रानी शब्द मासिक धर्म की अवस्था में अस्वस्थ स्त्री को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अशुद्ध” का अर्थ लैव्यव्यवस्था के विधान के अनुसार अनुष्ठानिक अशुद्धता है, नैतिक अशुद्धता नहीं।
    reason: cultural_note
lexical_decisions:
- source_word: הַדָּוָה
  choice: जो ... अस्वस्थ हो
  rationale: यह शब्द पीड़ित या अस्वस्थ दशा का भाव रखता है; अगले पदबंध से स्पष्ट होता है कि यहाँ मासिक धर्म की अवस्था की बात है। इस प्रकार दोनों इब्रानी पदों को एक ही अर्थ में मिला नहीं दिया गया।
- source_word: בְּנִדָּתָהּ
  choice: अपनी मासिक अशुद्धता के समय
  rationale: लैव्यव्यवस्था के प्रसंग में נִדָּה मासिक धर्म से जुड़ी विधिक अशुद्धता को दर्शाता है। ‘के समय’ स्वाभाविक हिन्दी में अवस्था और अवधि दोनों व्यक्त करता है।
- source_word: הַזָּב אֶת־זוֹבוֹ
  choice: उस व्यक्ति ... जिसे स्राव हो
  rationale: इब्रानी संज्ञा और सजातीय कर्म को स्वाभाविक हिन्दी में अवस्था के रूप में व्यक्त किया गया है। आगे ‘पुरुष ... या स्त्री’ आने के कारण ‘व्यक्ति’ दोनों को समेटता है।
- source_word: לַזָּכָר וְלַנְּקֵבָה
  choice: चाहे वह पुरुष हो या स्त्री
  rationale: यह पिछले स्राव-संबंधी वर्ग का विस्तार दोनों लिंगों तक करता है और हिन्दी में वितरक अर्थ स्पष्ट रखता है।
- source_word: אֲשֶׁר יִשְׁכַּב עִם
  choice: जो ... के साथ सोए
  rationale: इब्रानी यौन-संबंध का शिष्ट व्यंजक प्रयोग करता है। ‘के साथ सोए’ उसी व्यंजना को बनाए रखता है, बिना अनावश्यक रूप से अधिक स्पष्ट हुए।
- source_word: טְמֵאָה
  choice: अशुद्ध स्त्री
  rationale: स्त्रीलिंग विशेषण ऐसी स्त्री को दर्शाता है जो लैव्यव्यवस्था के अनुसार विधिक रूप से अशुद्ध अवस्था में है। ‘अशुद्ध’ पुस्तक की शुद्धता-संबंधी शब्दावली को बनाए रखता है।
theological_decisions:
- issue: विधिक अशुद्धता की शब्दावली
  choice: ‘मासिक अशुद्धता’ और ‘अशुद्ध स्त्री’
  alternative: ‘गंदी’, ‘पापी’ या नैतिक रूप से दूषित स्त्री
  rationale: इस पद में लैव्यव्यवस्था की धार्मिक-विधिक शुद्धता की अवस्था अभिप्रेत है, स्त्री के नैतिक मूल्य या व्यक्तिगत गरिमा पर निर्णय नहीं।
- issue: ‘सोना’ क्रिया की यौन व्यंजना
  choice: ‘के साथ सोए’
  alternative: ‘सहवास करे’
  rationale: इब्रानी मूल यौन संबंध के लिए व्यंजक भाषा का उपयोग करता है; हिन्दी में भी वही शिष्ट अप्रत्यक्षता सुरक्षित रखी गई है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। पद पिछले विधानों की सूची का समापन है, इसलिए प्रत्येक वर्ग के साथ ‘के विषय में’ दोहराकर इब्रानी की सूचीबद्ध संरचना और हिन्दी की स्पष्टता दोनों बनाए रखी गई हैं।
