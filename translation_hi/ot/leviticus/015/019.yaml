source:
  edition: WLC
  text: וְ/אִשָּׁה֙ כִּֽי תִהְיֶ֣ה זָבָ֔ה דָּ֛ם יִהְיֶ֥ה זֹבָ֖/הּ בִּ/בְשָׂרָ֑/הּ שִׁבְעַ֤ת יָמִים֙ תִּהְיֶ֣ה בְ/נִדָּתָ֔/הּ וְ/כָל הַ/נֹּגֵ֥עַ בָּ֖/הּ יִטְמָ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/019.yaml
  text: When a woman has a discharge[a], and her discharge in her body is blood, she shall remain in her menstrual impurity seven days[b], and everyone who touches her shall be unclean until evening.
translation:
  language: hi
  text: जब किसी स्त्री को स्राव हो और उसके शरीर में वह स्राव रक्त हो, तो वह सात दिन तक अपनी मासिक अशुद्धता[a] में रहेगी; और जो कोई उसे छुएगा, वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ “मासिक अशुद्धता” लैव्यव्यवस्था के विधान के अनुसार अनुष्ठानिक अशुद्धता की अवस्था है; इसका अर्थ अपने-आप में नैतिक दोष या पाप नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: זָבָה / זֹבָהּ
  choice: रक्तस्राव / स्राव
  rationale: זוּב शरीर से होनेवाले बहाव या स्राव को दर्शाता है। पहले पदबंध में आगे आनेवाले ‘रक्त’ को ध्यान में रखकर स्वाभाविक हिन्दी ‘रक्तस्राव’ रखा गया है, जबकि दूसरे में मूल की पुनरावृत्ति बनाए रखने के लिए ‘स्राव’ है।
- source_word: דָּם
  choice: रक्त
  rationale: यह सीधे तौर पर स्राव के स्वरूप को बताता है; ‘रक्त’ गरिमापूर्ण और सामान्य आधुनिक हिन्दी है।
- source_word: בִּבְשָׂרָהּ
  choice: उसके शरीर में
  rationale: בשר का मूल अर्थ ‘मांस’ है, पर यहाँ स्त्री के शरीर का संकेत है। ב उपसर्ग के कारण ‘शरीर में’ मूल के निकट है; ‘शरीर से’ अधिक व्याख्यात्मक होता।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: संख्या और अवधि को सहज हिन्दी में सीधे व्यक्त करता है।
- source_word: בְנִדָּתָהּ
  choice: अपनी मासिक अशुद्धता में
  rationale: निद्दा यहाँ मासिक धर्म से जुड़ी लैव्यव्यवस्थीय अनुष्ठानिक अशुद्धता की अवस्था है; यह अनुवाद जैविक घटना और विधिक स्थिति दोनों का संकेत रखता है।
- source_word: הַנֹּגֵעַ בָּהּ
  choice: जो कोई उसे छुएगा
  rationale: כל के साथ कृदन्त सामान्य और अनिश्चित व्यक्ति को दर्शाता है; यह हिन्दी में स्वाभाविक विधिक अभिव्यक्ति है।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: लैव्यव्यवस्था के शुद्धता-विधानों में טמא अनुष्ठानिक अशुद्ध स्थिति को व्यक्त करता है। ‘रहेगा’ परिणामस्वरूप स्थिति को स्वाभाविक ढंग से बताता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह आधुनिक हिन्दी में स्वाभाविक है और अशुद्धता की समय-सीमा को स्पष्ट रखता है।
theological_decisions:
- issue: मासिक धर्म से जुड़ी अशुद्धता को नैतिक दोष मान लेने का जोखिम
  choice: ‘मासिक अशुद्धता’ और ‘अशुद्ध’ को अनुष्ठानिक/विधिक स्थिति के अर्थ में रखना
  alternative: ‘मासिक धर्म’ मात्र, अथवा ‘अपवित्र/दूषित’
  rationale: लैव्यव्यवस्था 15 का प्रसंग अनुष्ठानिक शुद्धता का है; पद स्त्री पर नैतिक अपराध या व्यक्तिगत पाप का आरोप नहीं लगाता। ‘अपवित्र’ नैतिक अर्थ का अनचाहा आभास दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सहज विधिक शैली। ‘रजस्वला’ जैसे अपेक्षाकृत संस्कृतनिष्ठ शब्द से बचकर ‘मासिक अशुद्धता’ रखा गया है। मुख्य पाठ में एकमात्र पाद-टिप्पणी चिह्न [a] उपस्थित है।
