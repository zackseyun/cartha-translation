id: LEV.15.16
reference: Leviticus 15:16
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֕ישׁ כִּֽי תֵצֵ֥א מִמֶּ֖/נּוּ שִׁכְבַת זָ֑רַע וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת כָּל בְּשָׂר֖/וֹ וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/016.yaml
  text: And if a man has an emission of semen[b][a], he shall wash all his flesh in water and be unclean until the evening.
translation:
  language: hi
  text: यदि किसी पुरुष का वीर्यस्खलन हो,[a] तो वह अपने पूरे शरीर को पानी से धोए और शाम तक अशुद्ध रहे।[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “उससे वीर्य का स्राव निकले।”
    reason: lexical_alternative
  - marker: b
    text: यहाँ “अशुद्ध” लैव्यव्यवस्था के शुद्धता-विधानों के अनुसार अनुष्ठानिक अशुद्धता को दर्शाता है; इससे अपने-आप नैतिक दोष का अर्थ नहीं निकलता।
    reason: cultural_note
lexical_decisions:
- source_word: אִישׁ
  choice: किसी पुरुष
  rationale: यह नियम विशेष रूप से पुरुष के शारीरिक स्राव से संबंधित है; इसलिए लिंग-सटीक अनुवाद रखा गया है।
- source_word: כִּי
  choice: यदि
  rationale: विधिक प्रसंग में यह किसी संभावित स्थिति को प्रस्तुत करता है।
- source_word: תֵצֵא מִמֶּנּוּ שִׁכְבַת זָרַע
  choice: उसका वीर्यस्खलन हो
  rationale: इब्रानी का शाब्दिक भाव ‘उससे वीर्य का स्राव निकले’ है; ‘वीर्यस्खलन’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है, और कारण के विषय में पाठ से अधिक नहीं कहता।
- source_word: וְרָחַץ בַּמַּיִם
  choice: पानी से धोए
  rationale: यह विधिक क्रम में अपेक्षित शारीरिक धुलाई को व्यक्त करता है; हिन्दी में करण-सूचक ‘पानी से’ स्वाभाविक है।
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: अपने पूरे शरीर को
  rationale: शाब्दिक ‘अपने सारे मांस को’ के आशय को स्पष्ट, स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְטָמֵא
  choice: अशुद्ध रहे
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में यह अनुष्ठानिक अशुद्धता की स्थिति दर्शाता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: इब्रानी समय-सीमा का संक्षिप्त और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: शुद्धता-विधान में טָמֵא का स्वरूप
  choice: मुख्य पाठ में ‘अशुद्ध’, पादटिप्पणी में अनुष्ठानिक संदर्भ की स्पष्टता
  alternative: नैतिक रूप से अपवित्र; धार्मिक रीति से अशुद्ध
  rationale: प्रसंग लैव्यव्यवस्था के शारीरिक स्राव और शुद्धता-विधानों का है। पाठ स्वयं नैतिक दोष घोषित नहीं करता; इसलिए पारंपरिक शब्द बनाए रखते हुए पादटिप्पणी संभावित गलत अर्थ से बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; भाषा स्पष्ट, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक शैली के लिए ‘यदि…तो’ और निर्देश के लिए ‘धोए…रहे’ का प्रयोग किया गया है।
