reference: Leviticus 15:7
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נֹּגֵ֖עַ בִּ/בְשַׂ֣ר הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/007.yaml
  text: Whoever touches the flesh of the man with the discharge shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: hi
  text: और जो कोई स्राव वाले पुरुष के शरीर[a] को छुए, वह अपने कपड़े धोए और पानी से स्नान करे, और वह शाम तक अशुद्ध रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से ‘स्राव वाले का मांस’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנֹּגֵעַ
  choice: और जो कोई ... छुए
  rationale: संज्ञा के रूप में प्रयुक्त निश्चित कृदन्त सामान्य कानूनी विधान व्यक्त करता है। ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक है, जबकि आरम्भ का ‘और’ इब्रानी संयोजक को बनाए रखता है।
- source_word: בִּבְשַׂר
  choice: शरीर
  rationale: בָּשָׂר का शाब्दिक अर्थ ‘मांस’ है, पर यहाँ किसी व्यक्ति के भौतिक शरीर के स्पर्श का आशय है। मुख्य पाठ में ‘शरीर’ अधिक स्वाभाविक और स्पष्ट है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: הַזָּב
  choice: स्राव वाले पुरुष
  rationale: זוּב से बना कृदन्त इस प्रसंग में शारीरिक स्राव से ग्रस्त पुरुष को सूचित करता है। पुल्लिंग एकवचन और निकटवर्ती विधिक प्रसंग दोनों स्पष्ट रखे गए हैं।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: כִּבֵּס वस्त्र धोने के लिए प्रयुक्त है। ‘कपड़े’ आधुनिक सामान्य हिन्दी है और ‘अपने’ इब्रानी प्रत्यय ‘उसके’ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: और पानी से स्नान करे
  rationale: רָחַץ यहाँ शरीर धोने को दर्शाता है। ‘पानी से स्नान करे’ हिन्दी में स्पष्ट और गरिमापूर्ण विधिक अभिव्यक्ति है।
- source_word: וְטָמֵא
  choice: और वह ... अशुद्ध रहे
  rationale: טָמֵא यहाँ धार्मिक-विधिक अशुद्धता बताता है, नैतिक अपराध नहीं। ‘अशुद्ध’ लैव्यव्यवस्था की शुद्धता-विषयक भाषा के लिए उपयुक्त है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह अशुद्धता की समय-सीमा बताता है। ‘शाम तक’ सहज आधुनिक हिन्दी है और अर्थ पूर्णतः सुरक्षित रखता है।
theological_decisions:
- issue: अशुद्धता की प्रकृति
  choice: טָמֵא का अनुवाद धार्मिक-विधिक अर्थ में ‘अशुद्ध’ किया गया है।
  alternative: ‘अपवित्र’ या नैतिक दोष सूचित करने वाली भाषा
  rationale: लैव्यव्यवस्था 15 में स्पर्श के कारण उत्पन्न दशा इस्राएल की शुद्धता-व्यवस्था से संबंधित है; पाठ स्वयं इसे नैतिक पाप नहीं कहता।
- issue: בָּשָׂר की अर्थ-सीमा
  choice: मुख्य पाठ में ‘शरीर’, और शाब्दिक ‘मांस’ पादटिप्पणी में।
  alternative: मुख्य पाठ में ‘मांस’
  rationale: दोनों अर्थ-संभावनाएँ सुरक्षित हैं। इस संदर्भ में ‘शरीर’ लक्ष्य-भाषा में अधिक स्वाभाविक है, जबकि पादटिप्पणी मूल की ठोस शब्दावली दिखाती है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण विधिक शैली में है। ‘जो कोई’, ‘धोए’, ‘स्नान करे’ और ‘अशुद्ध रहे’ सामान्य पाठक के लिए सहज हैं; अनावश्यक संस्कृतनिष्ठ या सांप्रदायिक शब्दावली से बचा गया है।
