base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/022.yaml
  text: And everyone who touches any object on which she sits shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: hi
  text: और जो कोई किसी भी वस्तु[a] को छुए जिस पर वह स्त्री बैठती है, वह अपने कपड़े धोए और पानी में स्नान करे, और वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पात्र’ अथवा ‘कोई वस्तु।’ हिब्रू शब्द כְּלִי किसी वस्तु, उपकरण या पात्र के लिए व्यापक शब्द है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: और जो कोई...छुए
  rationale: समुच्चयबोधक וְ और सार्वत्रिक כָל के साथ संज्ञा के रूप में प्रयुक्त कृदंत הַנֹּגֵעַ किसी भी ऐसे व्यक्ति को दर्शाता है; यह हिंदी में स्वाभाविक रूप से सामान्य और व्यापक अर्थ रखता है।
- source_word: בְּכָל כְּלִי
  choice: उस वस्तु को
  rationale: כְּלִי का अर्थ पात्र, उपकरण, सामान या कोई वस्तु हो सकता है। बैठने के संदर्भ में ‘वस्तु’ पर्याप्त व्यापक है और इसे केवल ‘पात्र’ तक सीमित नहीं करता।
- source_word: אֲשֶׁר תֵּשֵׁב עָלָיו
  choice: जिस पर वह स्त्री बैठती है
  rationale: सम्बन्धवाचक उपवाक्य כְּלִי को विशेषित करता है। हिब्रू क्रिया का स्त्रीलिंग रूप पूर्ववर्ती संदर्भ की स्त्री की ओर संकेत करता है; हिंदी में संदर्भ स्पष्ट करने के लिए ‘वह स्त्री’ कहा गया है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: כִּבֵּס वस्त्रों को धोने का निर्देश देता है। ‘अपने कपड़े’ आधुनिक हिंदी में स्वाभाविक है और प्रत्यय के स्वामित्व-संबंध को व्यक्त करता है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: और पानी से स्नान करे
  rationale: शुद्धता-विधानों में רָחַץ प्रायः शरीर धोने को दर्शाता है। ‘स्नान करे’ साधारण ‘धोए’ की अपेक्षा इसे स्पष्ट करता है।
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: और वह शाम तक अशुद्ध रहेगा
  rationale: טָמֵא यहाँ विधिक/अनुष्ठानिक अशुद्धता की दशा बताता है, और עַד הָעָרֶב उसकी अवधि निर्धारित करता है। ‘रहेगा’ परिणामस्वरूप जारी रहने वाली दशा को स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: लैव्यव्यवस्था के शुद्धता-विधान में अशुद्धता का स्वरूप
  choice: טָמֵא का अनुवाद ‘अशुद्ध’ किया गया है, बिना नैतिक दोष का अर्थ जोड़े।
  alternative: अपवित्र या दूषित
  rationale: यह पद संपर्क से उत्पन्न विधिक/अनुष्ठानिक स्थिति का वर्णन करता है, व्यक्तिगत पाप या नैतिक अपराध का नहीं। ‘अशुद्ध’ लैव्यव्यवस्था की श्रेणी को संक्षेप में सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। विधिक निर्देश के लिए ‘धोए’ और ‘स्नान करे’ का प्रयोग किया गया है; अनावश्यक प्राचीन या संप्रदाय-विशिष्ट शब्दावली से बचा गया है।
