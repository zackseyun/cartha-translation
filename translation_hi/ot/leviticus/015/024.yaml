base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/024.yaml
  text: If a man indeed lies with her[a], and her menstrual impurity comes upon him, he shall be unclean seven days, and every bed on which he lies shall be unclean.
translation:
  language: hi
  text: यदि कोई पुरुष उसके साथ सोए[a], और उसकी मासिक धर्म की अशुद्धता उस पर आ जाए, तो वह सात दिन तक अशुद्ध रहेगा; और हर वह बिछौना जिस पर वह लेटेगा, अशुद्ध हो जाएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'अधिक स्पष्ट रूप में: “यदि कोई पुरुष उसके साथ यौन-संबंध बनाए।” हिब्रू मुहावरे का शाब्दिक रूप है: “यदि कोई पुरुष निश्चय ही उसके साथ सोए”; क्रिया की इस रचना से बल प्रकट होता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: שָׁכֹב יִשְׁכַּב
  choice: सचमुच उसके साथ सोए
  rationale: धातु के infinitive absolute और अपूर्ण क्रिया के मेल से क्रिया पर बल पड़ता है। ‘सचमुच ... सोए’ उस बल और यौन-संबंध के हिब्रू मुहावरे, दोनों को बनाए रखता है; स्पष्ट विकल्प पादटिप्पणी में दिया गया है।
- source_word: אִישׁ
  choice: कोई पुरुष
  rationale: यह एकवचन पुल्लिंग संज्ञा है और वयस्क पुरुष को सूचित करती है; आधुनिक हिन्दी में ‘कोई पुरुष’ स्वाभाविक और लिंग-सटीक है।
- source_word: נִדָּתָהּ
  choice: उसकी मासिक धर्म की अशुद्धता
  rationale: लैव्यव्यवस्था के इस प्रसंग में נִדָּה केवल जैविक मासिक धर्म नहीं, उससे जुड़ी अनुष्ठानिक अशुद्धता की अवस्था भी दर्शाता है।
- source_word: וּתְהִי ... עָלָיו
  choice: उस पर आ जाए
  rationale: हिब्रू का शाब्दिक बिंब ‘उस पर हो’ है। ‘उस पर आ जाए’ अशुद्धता के उस पुरुष तक पहुँचने का भाव स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: וְטָמֵא
  choice: वह ... अशुद्ध रहेगा
  rationale: शर्त के बाद यह परिणाम बताता है। ‘अशुद्ध रहेगा’ सात दिन की अवधि और अनुष्ठानिक स्थिति को स्पष्ट करता है।
- source_word: הַמִּשְׁכָּב
  choice: बिछौना
  rationale: यह लेटने की जगह को दर्शाता है। ‘बिछौना’ हिन्दी में व्यापक और प्रसंगानुकूल है तथा केवल आधुनिक पलंग तक अर्थ सीमित नहीं करता।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगा
  rationale: कानूनी परिणाम के रूप में बिछौने की अशुद्ध अवस्था में आने को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता को नैतिक दोष समझने से बचाना
  choice: ‘अशुद्ध’ और ‘मासिक धर्म की अशुद्धता’ जैसे अनुष्ठानिक शुद्धता-संबंधी पद
  alternative: ‘दूषित’, ‘अपवित्र’, अथवा नैतिक पाप का संकेत देने वाली भाषा
  rationale: लैव्यव्यवस्था 15 का तत्काल प्रसंग अनुष्ठानिक शुद्धता का है। यह पद स्वयं उस पुरुष या स्त्री पर नैतिक अपराध का निर्णय नहीं सुनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी परिणाम का स्वर बना है, पर अत्यधिक संस्कृतनिष्ठ या चिकित्सकीय शब्दावली से बचा गया है। ‘अशुद्ध’ को इस अध्याय के अनुष्ठानिक अर्थ में प्रयोग किया गया है।
