  text: וּ/בַ/יּ֣וֹם הַ/שְּׁמִינִ֗י יִֽקַּֽח ל/וֹ֙ שְׁתֵּ֣י תֹרִ֔ים א֥וֹ שְׁנֵ֖י בְּנֵ֣י יוֹנָ֑ה וּ/בָ֣א לִ/פְנֵ֣י יְהוָ֗ה אֶל פֶּ֨תַח֙ אֹ֣הֶל מוֹעֵ֔ד וּ/נְתָנָ֖/ם אֶל הַ/כֹּהֵֽן־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/014.yaml
  text: And on the eighth day he shall take for himself two turtledoves or two young pigeons[a], and he shall come before Yahweh at the entrance of the tent of meeting and give them to the priest.
translation:
  language: hi
  text: और आठवें दिन वह अपने लिए दो फाख्ते या कबूतर के दो बच्चे ले। फिर वह याहवे[a] के सामने, मिलाप के तंबू के प्रवेश-द्वार पर आए और उन्हें याजक को दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी में: YHWH; इसका उच्चारण सामान्यतः ‘याहवे’ माना जाता है और परंपरागत रूप से इसका अनुवाद ‘प्रभु’ किया जाता है।'
    reason: ईश्वरीय नाम के इब्रानी रूप और परंपरागत अनुवाद को स्पष्ट करना।
lexical_decisions:
- source_word: וּ/בַ/יּוֹם הַ/שְּׁמִינִי
  choice: और आठवें दिन
  rationale: संयोजक וּ और काल-सूचक पद को रखते हुए पिछले पद से विधिक क्रम की निरंतरता व्यक्त होती है।
- source_word: יִקַּח ל/וֹ
  choice: वह अपने लिए … ले
  rationale: कानूनी निर्देश में अपूर्ण क्रिया को हिंदी की विधिक आज्ञार्थक शैली ‘ले’ से व्यक्त किया गया है; ל/וֹ को ‘अपने लिए’ के रूप में स्पष्ट रखा गया है।
- source_word: שְׁתֵּי תֹרִים
  choice: दो फाख्ते
  rationale: תֹרִים बलि में प्रयुक्त turtledoves को सूचित करता है; आधुनिक सामान्य हिंदी में ‘फाख्ते’ स्वाभाविक और बोधगम्य है।
- source_word: אוֹ שְׁנֵי בְּנֵי יוֹנָה
  choice: या कबूतर के दो बच्चे
  rationale: शाब्दिक मुहावरे ‘कबूतर के पुत्र’ का आशय कम उम्र के कबूतर हैं; हिंदी में ‘कबूतर के दो बच्चे’ अर्थ को सहज रूप से सुरक्षित रखता है।
- source_word: וּ/בָא לִ/פְנֵי יְהוָה
  choice: फिर वह यहोवा के सामने … आए
  rationale: क्रमागत क्रिया को हिंदी में ‘फिर’ और विधिक ‘आए’ से व्यक्त किया गया है। לִפְנֵי का सीधा अर्थ ‘के सामने’ रखा गया है और पवित्र नाम को ‘यहोवा’ लिखा गया है।
- source_word: אֶל פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलाप के तंबू के प्रवेश-द्वार पर
  rationale: פֶּתַח को ‘प्रवेश-द्वार’ और אֹהֶל מוֹעֵד को पारदर्शी, प्रचलित रूप ‘मिलाप का तंबू’ दिया गया है। संदर्भ में गंतव्य को स्वाभाविक हिंदी में ‘पर’ से व्यक्त किया गया है।
- source_word: וּ/נְתָנָ/ם אֶל הַ/כֹּהֵן
  choice: और उन्हें याजक को दे
  rationale: נתן और उसके कर्म-प्रत्यय का सीधा अर्थ ‘उन्हें … दे’ है; इससे पक्षियों को याजक के हाथ सौंपना स्पष्ट रहता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला निजी वाचा-नाम सीधे आया है। हिंदी पाठकों में पहचाने जाने वाले नामरूप ‘यहोवा’ से इसे सामान्य उपाधि में बदले बिना सुरक्षित रखा गया है; फुटनोट अन्य प्रचलित निरूपण बताता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और साधारण पाठक के लिए सहज रखी गई है। लंबे इब्रानी वाक्य को दो हिंदी वाक्यों में बाँटा गया है, पर विधिक क्रम और सभी आशयगत घटक सुरक्षित हैं।
