  text: כָּל הַ/מִּשְׁכָּ֞ב אֲשֶׁר תִּשְׁכַּ֤ב עָלָי/ו֙ כָּל יְמֵ֣י זוֹבָ֔/הּ כְּ/מִשְׁכַּ֥ב נִדָּתָ֖/הּ יִֽהְיֶה לָּ֑/הּ וְ/כָֽל הַ/כְּלִי֙ אֲשֶׁ֣ר תֵּשֵׁ֣ב עָלָ֔י/ו טָמֵ֣א יִהְיֶ֔ה כְּ/טֻמְאַ֖ת נִדָּתָֽ/הּ־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/026.yaml
  text: Every bed on which she lies during all the days of her discharge shall be to her like the bed of her menstruation[a], and every vessel on which she sits shall be unclean[b], like the uncleanness of her menstruation.
translation:
  language: hi
  text: उसके स्राव के सभी दिनों में जिस बिछौने पर वह लेटेगी, वह उसके लिए उसके मासिक धर्म के बिछौने के समान होगा; और जिस किसी वस्तु[क] पर वह बैठेगी, वह उसके मासिक धर्म की अशुद्धता के समान अशुद्ध होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: क
    text: ‘वस्तु’ के लिए इब्रानी शब्द व्यापक है; इसका अर्थ केवल पात्र नहीं, बल्कि कोई भी सामान या चीज़ हो सकता है जिस पर वह बैठे।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִשְׁכָּב
  choice: बिछौना
  rationale: यह उस स्थान या वस्तु को दर्शाता है जिस पर कोई लेटता है। ‘बिछौना’ आधुनिक हिन्दी में स्वाभाविक है और ‘पलंग’ की अपेक्षा पर्याप्त व्यापक है।
- source_word: כָּל יְמֵי זוֹבָהּ
  choice: उसके स्राव के जितने दिन हों, उन दिनों में
  rationale: זוֹב इस प्रसंग में शारीरिक स्राव को दर्शाता है; यह रूप पूरे काल की बात को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִדָּה
  choice: मासिक धर्म
  rationale: यहाँ इसका ठोस संदर्भ स्त्री की मासिक अवस्था से है। ‘मासिक धर्म’ सामान्य आधुनिक हिन्दी में स्पष्ट है, जबकि पद की विधिक शुद्धता-संबंधी छाया आसपास के ‘अशुद्धता’ शब्द से बनी रहती है।
- source_word: כְּלִי
  choice: वस्तु
  rationale: כְּלִי का अर्थ यहाँ कोई पात्र मात्र नहीं, बल्कि वह सामान या वस्तु भी हो सकता है जिस पर बैठा जाए। इसलिए ‘वस्तु’ हिन्दी में अपेक्षित व्यापकता बनाए रखता है।
- source_word: טָמֵא / טֻמְאָה
  choice: अशुद्ध / अशुद्धता
  rationale: लैव्यव्यवस्था के इस विधिक प्रसंग में ये शब्द अनुष्ठानिक अशुद्धता की स्थिति बताते हैं। हिन्दी बाइबलीय प्रयोग में ‘अशुद्ध/अशुद्धता’ स्पष्ट और प्रतिष्ठित हैं।
theological_decisions:
- issue: अशुद्धता की प्रकृति
  choice: अनुष्ठानिक स्थिति को ‘अशुद्ध/अशुद्धता’ से व्यक्त किया गया है।
  alternative: अपवित्र/अपवित्रता
  rationale: पद शुद्धता-विधान के अंतर्गत स्थिति का वर्णन करता है, नैतिक दोष या व्यक्तिगत पाप का नहीं। ‘अशुद्धता’ इस विधिक अर्थ को अधिक सीधे व्यक्त करती है।
- issue: נִדָּה का अर्थ
  choice: मुख्य पाठ में ‘मासिक धर्म’
  alternative: मासिक अशुद्धता अथवा पृथक्करण की अवस्था
  rationale: निकटवर्ती प्रसंग में मासिक स्राव ही स्पष्ट संदर्भ है। ‘मासिक धर्म’ अर्थ को सहज बनाता है, बिना मुख्य पाठ में पृथक्करण की अतिरिक्त व्याख्या जोड़े।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक प्रसंग के अनुरूप रखी गई है। वाक्य की इब्रानी समानांतर संरचना को यथासंभव बनाए रखते हुए हिन्दी प्रवाह के लिए ‘जितने दिन हों, उन दिनों में’ प्रयोग किया गया है।
