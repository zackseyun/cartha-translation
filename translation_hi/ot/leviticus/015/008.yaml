base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/008.yaml
  text: And if the man with the discharge spits on a clean person[a], he shall wash his clothes and bathe in water[b], and he shall be unclean until the evening.
translation:
  language: hi
  text: और यदि स्राव वाला पुरुष किसी शुद्ध व्यक्ति[a] पर थूक दे, तो वह शुद्ध व्यक्ति अपने कपड़े धोए और पानी से स्नान करे; वह शाम तक अशुद्ध रहेगा[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “किसी ऐसे व्यक्ति पर जो शुद्ध है।” हिब्रू में शाब्दिक रूप से “शुद्ध जन” है, अर्थात अनुष्ठानिक रूप से शुद्ध व्यक्ति।
    reason: lexical_alternative
  - marker: b
    text: अर्थात वह शाम तक अनुष्ठानिक रूप से अशुद्ध रहेगा; इसका यह अर्थ आवश्यक नहीं कि वह नैतिक रूप से दोषी हुआ।
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: वाव के संयोजक बल और כִּי के शर्तसूचक अर्थ—दोनों को विधिक क्रम में सुरक्षित रखता है।
- source_word: יָרֹק
  choice: थूक दे
  rationale: क्रिया का सीधा अर्थ ‘थूकना’ है; व्यक्ति के साथ ‘पर’ जोड़ना स्वाभाविक हिन्दी है।
- source_word: הַזָּב
  choice: स्राव से पीड़ित पुरुष
  rationale: पद का अर्थ ‘स्राव वाला व्यक्ति’ है; निकटवर्ती विधान के पुल्लिंग एकवचन संदर्भ को स्पष्ट रखते हुए सहज हिन्दी दी गई है।
- source_word: בַּטָּהוֹר
  choice: किसी शुद्ध व्यक्ति पर
  rationale: हिब्रू में विशेषण संज्ञा के रूप में प्रयुक्त है और यहाँ शुद्धता अनुष्ठानिक स्थिति है; ‘व्यक्ति’ अर्थ-स्पष्टता के लिए जोड़ा गया है।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: तो वह अपने कपड़े धोए
  rationale: כִּבֶּס वस्त्र धोने के लिए प्रयुक्त है; ‘कपड़े’ आधुनिक और सामान्य हिन्दी है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: और पानी से स्नान करे
  rationale: इस शुद्धता-विधान में רָחַץ शरीर धोने का संकेत करता है; ‘स्नान करे’ सामान्य ‘धोए’ से अधिक स्पष्ट है।
- source_word: וְטָמֵא
  choice: वह अशुद्ध रहेगा
  rationale: यहाँ क्रिया परिणामी अनुष्ठानिक अवस्था बताती है; ‘रहेगा’ अवधि-सूचक अगले वाक्यांश के साथ सहज बैठता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: लैव्यव्यवस्था में अनुष्ठानिक अशुद्धता की अवधि बताने वाला मानक समय-सूत्र है।
theological_decisions:
- issue: शुद्धता की शब्दावली
  choice: טָהוֹר / טָמֵא को ‘शुद्ध’ / ‘अशुद्ध’ कहा गया
  alternative: ‘पवित्र’ / ‘अपवित्र’ अथवा ‘साफ़’ / ‘गंदा’
  rationale: संदर्भ अनुष्ठानिक स्थिति का है, न कि अनिवार्यतः नैतिक दोष या केवल शारीरिक स्वच्छता का। ‘शुद्ध/अशुद्ध’ इस भेद को सबसे स्वाभाविक रूप से बनाए रखते हैं।
- issue: अशुद्ध होने वाले व्यक्ति की पहचान
  choice: उत्तरवर्ती ‘वह’ को उस शुद्ध व्यक्ति के लिए रखा गया जिस पर थूका गया
  alternative: संज्ञा को दोहराकर ‘वह व्यक्ति’ कहना
  rationale: हिब्रू में क्रियाएँ पुल्लिंग एकवचन हैं और निकटतम संदर्भित शुद्ध व्यक्ति पर लागू होती हैं; सर्वनाम स्रोत की संक्षिप्तता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली रखी गई है। ‘स्राव से पीड़ित पुरुष’ संदर्भ को स्पष्ट करता है, जबकि ‘शुद्ध/अशुद्ध’ लैव्यव्यवस्था की अनुष्ठानिक शब्दावली और उसके तनाव को सुरक्षित रखते हैं।
