base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/027.yaml
  text: And everyone who touches them shall be unclean[a], and he shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: hi
  text: और जो कोई उन्हें छुए, वह अशुद्ध हो जाएगा[a]; उसे अपने कपड़े धोने और पानी से स्नान करने होंगे, और वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात् पिछले प्रसंग में उस स्त्री की अशुद्धता से जुड़ी वस्तुएँ, जैसे वे वस्तुएँ जिन पर वह लेटी या बैठी थी।
    reason: ‘उन्हें’ का संदर्भ पिछले पदों से स्पष्ट करने के लिए।
lexical_decisions:
- source_word: וְ/כָל הַ/נּוֹגֵעַ
  choice: और जो कोई ... छुए
  rationale: כָּל के साथ substantival participle एक सार्वभौमिक अनिश्चित अभिव्यक्ति है; ‘जो कोई’ आधुनिक हिन्दी में स्वाभाविक और व्यापक है।
- source_word: בָּם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन सर्वनाम-सूचक प्रत्यय पिछले प्रसंग की उन वस्तुओं की ओर संकेत करता है जिन पर वह स्त्री लेटी या बैठी थी; मुख्य पाठ में संदर्भ को अधिक स्पष्ट करके अर्थ सीमित नहीं किया गया।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगा
  rationale: यहाँ טמא लैव्यव्यवस्था की रीति-संबंधी अशुद्धता दर्शाता है, नैतिक पाप नहीं; क्रिया अशुद्ध अवस्था में आने को व्यक्त करती है।
- source_word: וְ/כִבֶּס בְּגָדָי/ו
  choice: वह अपने कपड़े धोए
  rationale: כבס वस्त्र धोने को दर्शाता है; ‘कपड़े’ सामान्य आधुनिक हिन्दी में स्पष्ट है।
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: और पानी से स्नान करे
  rationale: इस शुद्धि-विधि के प्रसंग में רחץ शरीर धोने को दर्शाता है; ‘स्नान करे’ इसे सहज हिन्दी में स्पष्ट करता है।
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: और शाम तक अशुद्ध रहेगा
  rationale: यह वाक्यांश रीति-संबंधी अशुद्धता की अवधि बताता है; हिन्दी में ‘शाम तक’ स्वाभाविक है।
theological_decisions:
- issue: लैव्यव्यवस्था में अशुद्धता की प्रकृति
  choice: טמא को ‘अशुद्ध’ कहकर रीति-संबंधी शुद्धता-अशुद्धता के अर्थ में प्रस्तुत किया गया।
  alternative: ‘अपवित्र’ या नैतिक रूप से दूषित
  rationale: प्रसंग उपासना और रीति से संबंधित अशुद्धता का है; केवल स्पर्श को नैतिक पाप बताना मूल पाठ से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक निर्देश के लिए ‘छुए’, ‘धोए’, ‘स्नान करे’ और परिणाम के लिए ‘हो जाएगा/रहेगा’ का प्रयोग किया गया है।
