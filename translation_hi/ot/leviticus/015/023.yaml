  text: וְ/אִ֨ם עַֽל הַ/מִּשְׁכָּ֜ב ה֗וּא א֧וֹ עַֽל הַ/כְּלִ֛י אֲשֶׁר הִ֥וא יֹשֶֽׁבֶת עָלָ֖י/ו בְּ/נָגְע/וֹ ב֑/וֹ יִטְמָ֖א עַד הָ/עָֽרֶב־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/023.yaml
  text: And if it is on the bed or on the item on which she sits[a], when he touches it he shall be unclean until the evening.
translation:
  language: hi
  text: और यदि वह बिछौने पर या उस वस्तु पर हो जिस पर वह स्त्री बैठती है[a], तो उसे छूने वाला शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वस्तु’ के लिए इब्रानी शब्द כְּלִי है, जिसका अर्थ प्रसंग के अनुसार पात्र, उपकरण या कोई अन्य सामान भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: और यदि
  rationale: संयोजक और शर्तसूचक भाव दोनों को बनाए रखता है तथा पिछले विधान से संबंध स्पष्ट करता है।
- source_word: עַל הַמִּשְׁכָּב
  choice: उस बिछौने पर
  rationale: מִשְׁכָּב सोने या लेटने के स्थान को दर्शाता है; इस प्रसंग में ‘बिछौना’ स्वाभाविक और पर्याप्त व्यापक है।
- source_word: הוּא
  choice: वह अशुद्धता ... हो
  rationale: पुल्लिंग एकवचन सर्वनाम का संदर्भ प्रसंग से निहित अशुद्ध करने वाली चीज़ या अशुद्धता की ओर है। हिन्दी में अस्पष्ट ‘वह’ से बचने के लिए ‘अशुद्धता’ स्पष्ट रूप से जोड़ा गया है, बिना इसे किसी विशिष्ट द्रव्य तक सीमित किए।
- source_word: עַל הַכְּלִי
  choice: उस वस्तु पर
  rationale: כְּלִי एक व्यापक शब्द है, जिसका अर्थ पात्र, उपकरण या अन्य वस्तु हो सकता है; ‘वस्तु’ इसकी व्यापकता सुरक्षित रखता है।
- source_word: אֲשֶׁר הִוא יֹשֶׁבֶת עָלָיו
  choice: जिस पर वह स्त्री बैठती है
  rationale: स्त्रीलिंग सर्वनाम का संदर्भ स्पष्ट करने के लिए ‘स्त्री’ जोड़ा गया है; वर्तमानकालीन अभिव्यक्ति इब्रानी कृदंत के विधिक, सामान्य भाव को व्यक्त करती है।
- source_word: בְּנָגְעוֹ בוֹ
  choice: जो पुरुष उसे छुए
  rationale: इब्रानी में स्पर्श करने वाला व्याकरणतः पुल्लिंग एकवचन है। हिन्दी में संबंधवाचक रचना विधिक परिणाम को स्वाभाविक ढंग से व्यक्त करती है।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: विधिक प्रसंग में यह स्पर्श के परिणामस्वरूप रहने वाली रीति-संबंधी अशुद्ध अवस्था को दर्शाता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: लैव्यव्यवस्था में बार-बार आने वाले समयसूचक सूत्र का स्वाभाविक आधुनिक हिन्दी रूप।
theological_decisions:
- issue: लैव्यव्यवस्था के शुद्धता-विधानों में טָמֵא का स्वरूप
  choice: ‘अशुद्ध’—रीति-संबंधी स्थिति के अर्थ में
  alternative: ‘रीति के अनुसार अशुद्ध’ या ‘अपवित्र’
  rationale: मूल पाठ केवल अशुद्ध स्थिति बताता है, नैतिक दोष नहीं। ‘अशुद्ध’ स्रोत की संक्षिप्तता बनाए रखता है और अनावश्यक व्याख्या नहीं जोड़ता।
- issue: הוּא का निहित संदर्भ
  choice: ‘वह अशुद्धता’
  alternative: ‘वह’ अथवा ‘वह स्राव’
  rationale: मूल में संदर्भ संक्षिप्त और कुछ हद तक निहित है। ‘अशुद्धता’ हिन्दी में वाक्य को बोधगम्य बनाती है, जबकि ‘स्राव’ कहने से मूल की तुलना में संदर्भ अधिक संकीर्ण हो सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सहज विधिक शैली। ‘जो पुरुष’ व्याकरणिक पुल्लिंग एकवचन को स्पष्ट करता है; ‘अशुद्धता’ संदर्भगत पूर्ति है। मुख्य पाठ में फुटनोट चिह्न [a] उपस्थित है।
