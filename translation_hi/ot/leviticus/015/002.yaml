source:
  edition: WLC
  text: דַּבְּרוּ֙ אֶל בְּנֵ֣י יִשְׂרָאֵ֔ל וַ/אֲמַרְתֶּ֖ם אֲלֵ/הֶ֑ם אִ֣ישׁ אִ֗ישׁ כִּ֤י יִהְיֶה֙ זָ֣ב מִ/בְּשָׂר֔/וֹ זוֹב֖/וֹ טָמֵ֥א הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/002.yaml
  text: 'Speak to the sons of Israel and say to them: When any man has a discharge from his body[b][a], his discharge is unclean.'
translation:
  language: hi
  text: 'इस्राएल के पुत्रों[a] से बोलो और उनसे कहो: जब किसी पुरुष के शरीर[b] से स्राव होता है, तो उसका स्राव अशुद्ध है।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘इस्राएलियों’; शाब्दिक रूप से ‘इस्राएल के पुत्रों’।
    reason: lexical_alternative
  - marker: b
    text: या ‘मांस’; शाब्दिक रूप से ‘उसके मांस से’।
    reason: lexical_alternative
lexical_decisions:
- source_word: דַּבְּרוּ
  choice: बोलो
  rationale: बहुवचन आज्ञार्थक क्रिया है। ‘बोलो’ मूल आदेश की औपचारिकता बनाए रखता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल के पुत्रों
  rationale: यह इब्रानी पद का निकट और स्पष्ट रूप है; अधिक स्वाभाविक विकल्प ‘इस्राएलियों’ को पादटिप्पणी में दिया गया है।
- source_word: וַאֲמַרְתֶּם אֲלֵהֶם
  choice: और उनसे कहो
  rationale: इब्रानी विधिक कथन की क्रमिक आज्ञा और उसकी औपचारिक लय को सुरक्षित रखता है।
- source_word: אִישׁ אִישׁ
  choice: किसी पुरुष
  rationale: दोहराया हुआ אִישׁ वितरणार्थक है, अर्थात ‘कोई भी पुरुष’; प्रसंग पुरुष के शारीरिक स्राव का है।
- source_word: כִּי יִהְיֶה זָב
  choice: जब ... स्राव होता हो
  rationale: כִּי यहाँ विधिक परिस्थिति प्रस्तुत करता है, इसलिए ‘जब’ उपयुक्त है; זָב निरंतर या विद्यमान स्राव की दशा बताता है।
- source_word: מִבְּשָׂרוֹ
  choice: उसके शरीर से
  rationale: בשר का शाब्दिक अर्थ ‘मांस’ है, पर इस शुद्धता-विधान के प्रसंग में ‘शरीर’ आधुनिक हिन्दी में आशय अधिक स्वाभाविक और स्पष्ट रूप से व्यक्त करता है।
- source_word: זוֹבוֹ
  choice: उसका स्राव
  rationale: यह זָב का सजातीय संज्ञा-रूप है; ‘स्राव’ की पुनरावृत्ति मूल की शब्दगत संगति और विधिक स्पष्टता बनाए रखती है।
- source_word: טָמֵא הוּא
  choice: अशुद्ध है
  rationale: यहाँ ‘अशुद्ध’ लैव्यव्यवस्था की अनुष्ठानिक अशुद्धता व्यक्त करता है, न कि अनिवार्यतः नैतिक पाप। वाक्य-विन्यास निकटतम पुल्लिंग संज्ञा ‘स्राव’ को विषय बनाए रखता है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: טָמֵא शुद्धता-विधान में अनुष्ठानिक अशुद्धता बताता है। ‘अशुद्ध’ नैतिक दोष का अनावश्यक संकेत दिए बिना इस विधिक अर्थ को स्पष्ट रखता है।
- issue: अशुद्धता का व्याकरणिक संबंध
  choice: उसका स्राव अशुद्ध है
  alternative: वह अशुद्ध है
  rationale: זוֹבוֹ के बाद טָמֵא הוּא में निकटतम पुल्लिंग संज्ञा ‘स्राव’ है; इसलिए स्राव को विषय बनाना स्वाभाविक है। वैकल्पिक रूप पुरुष को विषय मान सकता है, पर मुख्य पाठ मूल की निकट व्याकरणिक संगति का अनुसरण करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण विधिक शैली रखी गई है। ‘स्राव’ शरीर-संबंधी दशा को स्पष्ट, संयत और चिकित्सकीय रूप से स्वाभाविक ढंग से व्यक्त करता है; पादटिप्पणियाँ शाब्दिक इब्रानी रूपों को सुरक्षित रखती हैं।
