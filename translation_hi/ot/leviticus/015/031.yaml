source:
  edition: WLC
  text: וְ/הִזַּרְתֶּ֥ם אֶת בְּנֵי יִשְׂרָאֵ֖ל מִ/טֻּמְאָתָ֑/ם וְ/לֹ֤א יָמֻ֨תוּ֙ בְּ/טֻמְאָתָ֔/ם בְּ/טַמְּאָ֥/ם אֶת מִשְׁכָּנִ֖/י אֲשֶׁ֥ר בְּ/תוֹכָֽ/ם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/031.yaml
  text: Thus you shall warn the sons of Israel about their uncleanness[a], so that they may not die in their uncleanness by defiling my tabernacle, which is among them.
translation:
  language: hi
  text: इस प्रकार तुम इस्राएलियों को उनकी अशुद्धता के विषय में चेतावनी देना, ताकि वे अपनी अशुद्धता में मेरे उस निवास-स्थान को अशुद्ध करके, जो उनके बीच में है, मर न जाएँ।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִזַּרְתֶּם
  choice: तुम ... सावधान करना
  rationale: זהר के हिफ़ील रूप में यहाँ चेतावनी देने और खतरे से सावधान करने का भाव है। हिंदी में यह आज्ञार्थक विधान स्वाभाविक रूप से निवारक उद्देश्य व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: शाब्दिक अर्थ ‘इस्राएल के पुत्र’ है, पर इस लैव्यव्यवस्थीय नियम के सामुदायिक संदर्भ में आधुनिक हिंदी का ‘इस्राएलियों’ पूरे समुदाय को स्पष्ट और स्वाभाविक रूप से दर्शाता है।
- source_word: מִטֻּמְאָתָם
  choice: उनकी अशुद्धता से
  rationale: 'מִן को उसके मूल पृथक्करण/बचाव के भाव सहित रखा गया है: उन्हें अपनी अशुद्धता के कारण उत्पन्न खतरे से सावधान किया जाना है।'
- source_word: טֻמְאָה
  choice: अशुद्धता
  rationale: यह लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की श्रेणी को व्यक्त करता है और इसे केवल नैतिक पाप नहीं बनाता।
- source_word: וְלֹא יָמֻתוּ
  choice: ताकि वे ... मर न जाएँ
  rationale: यह पूर्ववर्ती चेतावनी का निवारक उद्देश्य स्पष्ट करता है और हिंदी में स्वाभाविक है।
- source_word: בְּטֻמְאָתָם
  choice: अपनी अशुद्धता में
  rationale: בְּ उस अवस्था को सूचित करता है जिसमें मृत्यु का संकट होगा; कारणार्थक अर्थ को अनावश्यक रूप से निर्णीत नहीं किया गया।
- source_word: בְּטַמְּאָם
  choice: अशुद्ध करके
  rationale: בְּ सहित infinitive construct साधन या परिस्थिति बताता है; हिंदी कृदंत मूल पाठ के इस संबंध को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: מִשְׁכָּנִי
  choice: मेरे निवास-स्थान
  rationale: מִשְׁכָּן परमेश्वर के इस्राएल के बीच वास करने के पवित्र तंबू को दर्शाता है। ‘निवास-स्थान’ शब्दार्थ और धर्मवैज्ञानिक संकेत दोनों को बनाए रखता है।
- source_word: אֲשֶׁר בְּתוֹכָם
  choice: जो उनके बीच में है
  rationale: यह सापेक्ष उपवाक्य इस्राएल के बीच परमेश्वर के निवास की उपस्थिति पर बल देता है और इब्रानी के निकट है।
theological_decisions:
- issue: लैव्यव्यवस्था में अनुष्ठानिक अशुद्धता
  choice: טֻמְאָה का अनुवाद ‘अशुद्धता’ किया गया और निवास-स्थान के दूषित होने के उपासना-संबंधी अर्थ को सुरक्षित रखा गया।
  alternative: ‘अपवित्रता’ या ऐसा नैतिक शब्द जो इसे सीधे पाप ठहराए
  rationale: संदर्भ शारीरिक स्रावों से जुड़ी अनुष्ठानिक अवस्था और पवित्र निवास-स्थान पर उसके प्रभाव का है; पद हर अशुद्ध अवस्था को अपने-आप नैतिक दोष नहीं ठहराता।
- issue: בְּטֻמְאָתָם में संबंध
  choice: ‘अपनी अशुद्धता में’
  alternative: ‘अपनी अशुद्धता के कारण’
  rationale: इब्रानी בְּ अवस्था, परिस्थिति या कारण का भाव दे सकता है। ‘में’ मूल की अस्पष्टता को सुरक्षित रखता है, जबकि व्यापक वाक्य मृत्यु के संकट को स्पष्ट करता है।
- issue: सामुदायिक पद בְּנֵי יִשְׂרָאֵל
  choice: ‘इस्राएलियों’
  alternative: ‘इस्राएल के पुत्रों’
  rationale: यह स्थापित इब्रानी सामुदायिक पद है। संदर्भ का नियम पूरे समुदाय से संबंधित है; आधुनिक हिंदी में ‘इस्राएलियों’ बिना अनावश्यक लैंगिक संकुचन के वही सामुदायिक अर्थ देता है।
translation_notes:
  register: भाषा आधुनिक मानक हिंदी, गरिमामय और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अशुद्धता’ को पद भर में एकरूप रखा गया है। ‘निवास-स्थान’ मִשְׁכָּן के वास-संबंधी अर्थ को बनाए रखता है; वाक्य-विन्यास कानूनी चेतावनी और उसके निवारक उद्देश्य को स्पष्ट करता है।
