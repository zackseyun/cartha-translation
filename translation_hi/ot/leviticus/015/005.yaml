id: LEV.15.5
reference: Leviticus 15:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/אִ֕ישׁ אֲשֶׁ֥ר יִגַּ֖ע בְּ/מִשְׁכָּב֑/וֹ יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/005.yaml
  text: And a man who touches his bed shall wash his clothes and bathe in water[b][a], and he shall be unclean until the evening.
translation:
  language: hi
  text: और जो पुरुष उसके बिछौने[a] को छुए, वह अपने कपड़े धोए और पानी से स्नान करे; वह शाम तक अशुद्ध[b] रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘उसके लेटने की जगह।’ इब्रानी शब्द केवल बने हुए पलंग के बजाय उस स्थान को भी दर्शा सकता है जहाँ वह लेटा था।
    reason: lexical_alternative
  - marker: b
    text: अर्थात शुद्धता-संबंधी विधियों के अनुसार अनुष्ठानिक रूप से अशुद्ध।
    reason: cultural_note
lexical_decisions:
- source_word: וְ/אִישׁ אֲשֶׁר
  choice: और जो पुरुष
  rationale: אִישׁ का पुल्लिंग एकवचन अर्थ बनाए रखा गया है; אֲשֶׁר को स्वाभाविक हिन्दी संबंधवाचक रचना ‘जो’ से व्यक्त किया गया है।
- source_word: יִגַּע
  choice: छुए
  rationale: נגע का सामान्य अर्थ ‘छूना’ है और यहाँ अनुष्ठानिक संपर्क के लिए यही संक्षिप्त तथा स्वाभाविक है।
- source_word: בְּ/מִשְׁכָּב/וֹ
  choice: उसके बिछौने
  rationale: מִשְׁכָּב लेटने की जगह, बिछौना या पलंग का बोध करा सकता है। ‘बिछौना’ अर्थ की व्यापकता को ‘पलंग’ से बेहतर बनाए रखता है; संबंधसूचक प्रत्यय को ‘उसके’ से व्यक्त किया गया है।
- source_word: יְכַבֵּס בְּגָדָי/ו
  choice: अपने कपड़े धोए
  rationale: כִּבֵּס यहाँ कपड़ों को धोने की क्रिया है। हिन्दी में कर्ता से संबंधित वस्त्रों के लिए ‘अपने कपड़े’ स्वाभाविक है और विधिक निर्देश ‘धोए’ से स्पष्ट होता है।
- source_word: וְ/רָחַץ בַּ/מַּיִם
  choice: और पानी से स्नान करे
  rationale: רחץ इस संदर्भ में शरीर धोने को सूचित करता है। בַּמַּיִם साधन या माध्यम के रूप में पानी को दर्शा सकता है; ‘पानी से स्नान करे’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: וְ/טָמֵא עַד הָ/עָרֶב
  choice: वह शाम तक अशुद्ध रहेगा
  rationale: טָמֵא को लैव्यव्यवस्था की शुद्धता-संबंधी स्थिति के रूप में ‘अशुद्ध’ कहा गया है; עַד הָעָרֶב की अवधि ‘शाम तक’ से सहज रूप में व्यक्त होती है।
theological_decisions:
- issue: लैव्यव्यवस्था में ‘अशुद्ध’ की प्रकृति
  choice: मुख्य पाठ में ‘अशुद्ध’ रखा गया और पादटिप्पणी में इसे शुद्धता-विधियों के अंतर्गत अनुष्ठानिक स्थिति बताया गया।
  alternative: मुख्य पाठ में ‘अनुष्ठानिक रूप से अशुद्ध’ कहना।
  rationale: मूल טָמֵא स्वयं नैतिक अपराध या दोष नहीं बताता। संक्षिप्त मूल श्रेणी को मुख्य पाठ में बनाए रखना और सांस्कृतिक स्पष्टीकरण पादटिप्पणी में देना अनावश्यक व्याख्यात्मक विस्तार से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘पुरुष’ मूल के पुल्लिंग एकवचन को बनाए रखता है; ‘बिछौना’ अर्थगत व्यापकता और स्वाभाविकता के बीच संतुलन देता है। विधिक बल को हिन्दी की निर्देशात्मक क्रियाओं ‘धोए’, ‘स्नान करे’ और परिणामसूचक ‘रहेगा’ से व्यक्त किया गया है।
