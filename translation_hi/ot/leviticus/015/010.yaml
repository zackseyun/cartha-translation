id: LEV.15.10
reference: Leviticus 15:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כָל הַ/נֹּגֵ֗עַ בְּ/כֹל֙ אֲשֶׁ֣ר יִהְיֶ֣ה תַחְתָּ֔י/ו יִטְמָ֖א עַד הָ/עָ֑רֶב וְ/הַ/נּוֹשֵׂ֣א אוֹתָ֔/ם יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/010.yaml
  text: And everyone who touches anything that was under him shall be unclean until the evening[a], and whoever carries them shall wash his clothes and bathe in water[b], and be unclean until the evening.
translation:
  language: hi
  text: और जो कोई उस वस्तु को छुए जो उसके नीचे रही हो, वह शाम तक अशुद्ध रहेगा[a]। और जो कोई ऐसी वस्तुओं को उठाकर ले जाए, वह अपने कपड़े धोए और पानी से स्नान करे[b], और शाम तक अशुद्ध रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से इसका अनुवाद ‘जो उसके नीचे हो’ भी किया जा सकता है। यहाँ ‘रही हो’ पिछले पदों में वर्णित उस वस्तु को ध्यान में रखकर है जो पहले उस व्यक्ति के नीचे थी।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में यहाँ बहुवचन ‘उन्हें’ है, जो उसके नीचे रही दूषित वस्तुओं को सामूहिक रूप से सूचित करता है।
    reason: cross_reference
lexical_decisions:
- source_word: הַנֹּגֵעַ
  choice: जो कोई ... छुए
  rationale: नגע का कृदन्त यहाँ शारीरिक स्पर्श को बताता है; सामान्य नियम का भाव दिखाने के लिए ‘जो कोई’ स्वाभाविक है।
- source_word: בְּכֹל אֲשֶׁר יִהְיֶה תַחְתָּיו
  choice: उस वस्तु को ... जो उसके नीचे रही हो
  rationale: यह उस स्रावग्रस्त पुरुष के नीचे पहले रही वस्तु की ओर संकेत करता है। ‘रही हो’ प्रक्रियात्मक संदर्भ के अनुकूल है, जबकि इब्रानी रूप वर्तमान अर्थ भी दे सकता है।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में טמא अनुष्ठानिक अशुद्धता बताता है; ‘अशुद्ध रहेगा’ समय-सीमा सहित विधिक परिणाम को स्पष्ट करता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: आधुनिक हिन्दी में यह स्वाभाविक और अर्थ की दृष्टि से सटीक है।
- source_word: הַנּוֹשֵׂא אֹתָם
  choice: जो कोई ऐसी वस्तुओं को उठाकर ले जाए
  rationale: נשא यहाँ वस्तुओं को उठाने/ढोने का भाव देता है। ‘ऐसी वस्तुओं’ से इब्रानी बहुवचन सर्वनाम का सामूहिक संदर्भ स्पष्ट होता है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: ‘कपड़े’ आधुनिक हिन्दी में सहज है और בְּגָדָיו का ठीक अर्थ देता है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: और पानी से स्नान करे
  rationale: רחץ इस शुद्धिकरण-सूत्र में शरीर धोने को सूचित करता है; ‘स्नान करे’ केवल हाथ आदि धोने के बजाय पूरे शरीर की धुलाई स्पष्ट करता है।
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: और शाम तक अशुद्ध रहे
  rationale: यह धुलाई के बाद भी शाम तक बनी रहने वाली अनुष्ठानिक अशुद्धता को सीधे व्यक्त करता है।
