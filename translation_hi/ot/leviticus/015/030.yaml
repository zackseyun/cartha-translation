source:
  edition: WLC
  text: וְ/עָשָׂ֤ה הַ/כֹּהֵן֙ אֶת הָ/אֶחָ֣ד חַטָּ֔את וְ/אֶת הָ/אֶחָ֖ד עֹלָ֑ה וְ/כִפֶּ֨ר עָלֶ֤י/הָ הַ/כֹּהֵן֙ לִ/פְנֵ֣י יְהוָ֔ה מִ/זּ֖וֹב טֻמְאָתָֽ/הּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/030.yaml
  text: Then the priest shall offer one as a sin offering and the other as a burnt offering, and the priest shall make atonement for her before Yahweh because of her unclean discharge.
translation:
  language: hi
  text: तब याजक एक को पापबलि के रूप में और दूसरे को होमबलि के रूप में चढ़ाए, और याजक उसके अशुद्ध स्राव के कारण यहोवा के सामने उसके लिए प्रायश्चित करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְעָשָׂה
  choice: चढ़ाए
  rationale: क्रिया का मूल अर्थ ‘करना/बनाना’ है, पर बलिदान-संबंधी प्रसंग में हिन्दी में ‘चढ़ाना’ स्वाभाविक और सटीक है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के अनुष्ठानिक अधिकारी के लिए मानक और प्रतिष्ठित हिन्दी शब्द।
- source_word: הָאֶחָד חַטָּאת
  choice: एक को पापबलि
  rationale: यहाँ חַטָּאת बलिदान की श्रेणी को दर्शाता है। ‘पापबलि’ प्रचलित और सामान्य पाठक के लिए स्पष्ट है; शुद्धिकरण-कार्य पर बल देने वाला विकल्प पादटिप्पणी में रखा गया है।
- source_word: וְאֶת־הָאֶחָד עֹלָה
  choice: और दूसरे को होमबलि
  rationale: עֹלָה उस बलि का पारंपरिक नाम है जो पूरी तरह वेदी पर जलाई जाती है; दो पक्षियों के वितरण के अनुसार दूसरी बार הָאֶחָד को ‘दूसरे’ कहना स्वाभाविक है।
- source_word: וְכִפֶּר עָלֶיהָ
  choice: उसके लिए प्रायश्चित करे
  rationale: याजकीय बलिदान-संदर्भ में כפר के धार्मिक-अनुष्ठानिक अर्थ को ‘प्रायश्चित करना’ सुरक्षित रखता है और עָלֶיהָ को ‘उसके लिए’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: לִפְנֵי का औपचारिक उपासना-संदर्भ ‘के सामने’ से सुरक्षित रहता है; יהוה को उसके व्यक्तिवाचक वाचा-नाम ‘यहोवा’ से प्रस्तुत किया गया है।
- source_word: מִזּוֹב טֻמְאָתָהּ
  choice: उसके अशुद्ध स्राव के कारण
  rationale: זוֹב शारीरिक स्राव को और טֻמְאָה उसकी अनुष्ठानिक अशुद्धता को सूचित करता है। यह वाक्यांश मूल संबंध को स्पष्ट, सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में परमेश्वर का वाचा-नाम प्रत्यक्ष है। हिन्दी बाइबलीय प्रयोग में ‘यहोवा’ व्यापक रूप से पहचाना जाता है और नाम को किसी उपाधि से प्रतिस्थापित नहीं करता।
- issue: बलिदान-विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: शब्द बलिदान की स्थापित श्रेणी को दर्शाता है, जबकि लैव्य अनुष्ठान में उसका शुद्धिकरण-कार्य भी महत्त्वपूर्ण है। मुख्य पाठ में परिचित नाम रखा गया और वैध अर्थ-बल पादटिप्पणी में सुरक्षित किया गया।
- issue: स्त्री की अशुद्धता और כפר का संबंध
  choice: उसके अशुद्ध स्राव के कारण उसके लिए प्रायश्चित
  alternative: उसकी अशुद्धता के स्राव से उसे शुद्ध करे
  rationale: मूल का כפר धार्मिक रूप से अर्थपूर्ण और व्यापक है; इसे केवल शारीरिक शुद्धि तक सीमित नहीं किया गया। साथ ही ‘अशुद्ध’ यहाँ लैव्य अनुष्ठानिक स्थिति को दर्शाता है, नैतिक दोष का निर्णय नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और विधिक-अनुष्ठानिक स्वर रखा गया है। ‘इस प्रकार’ दूसरे खंड के परिणामात्मक संबंध को सहज बनाता है। ‘अशुद्ध’ को नैतिक निंदा के बजाय लैव्य अनुष्ठानिक श्रेणी के रूप में समझा जाना चाहिए।
