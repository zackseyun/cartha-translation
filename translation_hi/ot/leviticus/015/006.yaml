source:
  edition: WLC
  text: וְ/הַ/יֹּשֵׁב֙ עַֽל הַ/כְּלִ֔י אֲשֶׁר יֵשֵׁ֥ב עָלָ֖י/ו הַ/זָּ֑ב יְכַבֵּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/006.yaml
  text: Whoever sits on the object on which the man with the discharge sat shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: hi
  text: जो कोई उस वस्तु[a] पर बैठे जिस पर स्राव वाला पुरुष बैठा था, वह अपने कपड़े धोए और पानी में स्नान करे; वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वस्तु’ के लिए प्रयुक्त इब्रानी शब्द का अर्थ ‘पात्र’, ‘उपकरण’ या ‘सामान’ भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַיֹּשֵׁב
  choice: जो कोई ... बैठे
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत का सामान्य और विधिक भाव आधुनिक हिन्दी में स्वाभाविक रूप से व्यक्त होता है।
- source_word: הַכְּלִי
  choice: उस वस्तु
  rationale: כְּלִי का अर्थ पात्र, उपकरण या कोई वस्तु हो सकता है; यहाँ बैठने योग्य चीज़ के लिए व्यापक 'वस्तु' उपयुक्त है।
- source_word: אֲשֶׁר יֵשֵׁב עָלָיו
  choice: जिस पर ... बैठा था
  rationale: सम्बन्धवाचक उपवाक्य उस वस्तु को स्राव वाले पुरुष के पहले बैठने से पहचानता है; हिन्दी में पूर्वकालिकता के लिए 'बैठा था' स्पष्ट और स्वाभाविक है।
- source_word: הַזָּב
  choice: स्राव वाला पुरुष
  rationale: यह पुल्लिंग एकवचन रूप अध्याय के इस खंड में शारीरिक स्राव वाले पुरुष को बताता है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: वस्त्र धोने की विधिक आज्ञा को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: और पानी से स्नान करे
  rationale: शुद्धता-विधि के प्रसंग में רָחַץ शरीर धोने को सूचित करता है; 'स्नान करे' केवल हाथ-पैर धोने की सम्भावना से बचाता है।
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: वह शाम तक अशुद्ध रहेगा
  rationale: यह संपर्क से उत्पन्न अशुद्धता की स्थिति और उसकी समय-सीमा को बिना नैतिक दोष जोड़े व्यक्त करता है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: '''अशुद्ध''—नैतिक अपराध का संकेत जोड़े बिना'
  alternative: '''धार्मिक रीति से अशुद्ध'' या ''अपवित्र'''
  rationale: प्रसंग लैव्यव्यवस्था की शुद्धता-विधि का है। 'धार्मिक रीति से' व्याख्यात्मक जोड़ होगा, जबकि 'अपवित्र' नैतिक या आध्यात्मिक दोष का अधिक प्रबल संकेत दे सकता है।
- issue: הַזָּב का लिंग-संदर्भ
  choice: पुरुष-संदर्भ को स्पष्ट रखा गया
  alternative: लिंग-निरपेक्ष 'स्राव वाला व्यक्ति'
  rationale: इस खंड का मूलपाठ पुरुष के स्राव की चर्चा करता है और व्याकरणिक रूप पुल्लिंग एकवचन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक स्वर के लिए सम्भावनार्थक आज्ञा-रूप और परिणाम के लिए 'रहेगा' प्रयुक्त है। मुख्य पाठ में [a] का स्थान स्नान के बाद रखा गया है, यद्यपि टिप्पणी वास्तव में पहले आए 'वस्तु' शब्द को स्पष्ट करती है; स्रोत परामर्श-पाठ के दिए हुए चिह्न-स्थान को यथासम्भव बनाए रखा गया है।
