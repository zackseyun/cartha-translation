base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/021.yaml
  text: And everyone who touches her bed shall wash his clothes and bathe in water[a], and he shall be unclean until the evening.
translation:
  language: hi
  text: और जो कोई उसके बिछौने[a] को छुए, वह अपने कपड़े धोए और पानी में स्नान करे, और वह शाम तक अशुद्ध रहेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके लेटने का स्थान’। इब्रानी शब्द उस स्थान या बिछौने को दर्शाता है जहाँ वह लेटती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכָל הַנֹּגֵעַ
  choice: और जो कोई ... को छुए
  rationale: संयोजन, כָּל और संज्ञा के रूप में प्रयुक्त कृदंत मिलकर एक सामान्य नियम बताते हैं। ‘जो कोई’ सार्वभौमिक दायरा और विधिक स्वर स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: בְּמִשְׁכָּבָהּ
  choice: उसके बिछौने
  rationale: מִשְׁכָּב लेटने के स्थान अथवा बिछौने को दर्शाता है। ‘बिछौना’ इस शुद्धता-विधान में ठोस वस्तु और मूल शब्द की अर्थ-व्याप्ति को सहज हिन्दी में व्यक्त करता है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: כבס विशेष रूप से वस्त्र धोने के लिए प्रयुक्त है। ‘अपने कपड़े धोए’ स्वाभाविक हिन्दी में विधिक निर्देश और प्रत्यावर्ती स्वामित्व दोनों स्पष्ट करता है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: और पानी से स्नान करे
  rationale: רחץ यहाँ शरीर धोने को बताता है। ‘स्नान करे’ इसे कपड़े धोने से स्पष्ट रूप से अलग रखता है; בַּמַּיִם को ‘पानी से’ के रूप में व्यक्त किया गया है।
- source_word: וְטָמֵא
  choice: और ... अशुद्ध रहे
  rationale: טמא इस प्रसंग में अनुष्ठानिक शुद्धता की अवस्था बताता है। ‘अशुद्ध’ नैतिक दोष जोड़े बिना स्थापित विधिक श्रेणी को व्यक्त करता है।
- source_word: עַד הָעָרֶב
  choice: शाम तक
  rationale: यह पद अशुद्धता की अवधि की सीमा बताता है। ‘शाम तक’ आधुनिक हिन्दी में संक्षिप्त और स्वाभाविक है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: טמא का अनुवाद अनुष्ठानिक अर्थ में ‘अशुद्ध’ किया गया है।
  alternative: ‘अपवित्र’ अथवा नैतिक दोष सूचित करने वाली भाषा
  rationale: लैव्यव्यवस्था 15 का प्रसंग शुद्धता-विधान है। पाठ स्वयं यहाँ व्यक्तिगत पाप या नैतिक अपराध घोषित नहीं करता, इसलिए अनुवाद में वह अर्थ नहीं जोड़ा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, स्पष्ट विधिक शैली रखी गई है। ‘जो कोई’, ‘धोए’, ‘स्नान करे’ और ‘अशुद्ध रहे’ सामान्य पाठक के लिए सहज हैं तथा मूल के निर्देशात्मक स्वर को बनाए रखते हैं।
