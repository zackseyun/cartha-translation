source:
  edition: WLC
  text: וְ/כֹ֨ל אֲשֶׁ֤ר יִגַּע בּ/וֹ֙ הַ/זָּ֔ב וְ/יָדָ֖י/ו לֹא שָׁטַ֣ף בַּ/מָּ֑יִם וְ/כִבֶּ֧ס בְּגָדָ֛י/ו וְ/רָחַ֥ץ בַּ/מַּ֖יִם וְ/טָמֵ֥א עַד הָ/עָֽרֶב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/011.yaml
  text: And everyone whom the man with the discharge touches[a], without having washed his hands in water, shall wash his clothes and bathe in water, and be unclean until the evening.
translation:
  language: hi
  text: और जिस किसी को स्राव वाला पुरुष छुए, जबकि उस पुरुष ने अपने हाथ पानी से न धोए हों[a], वह अपने कपड़े धोए, पानी से स्नान करे और शाम तक अशुद्ध रहे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि उस पुरुष ने अपने हाथ पानी से न धोए हों।” हिब्रू उपवाक्य को उस शर्त के रूप में भी समझा जा सकता है जिसके अंतर्गत स्पर्श से अशुद्धता फैलती है।
    reason: हिब्रू उपवाक्य का संबंध परिस्थितिजन्य या स्पष्ट शर्त के रूप में पढ़ा जा सकता है।
lexical_decisions:
- source_word: הַזָּב
  choice: स्राव वाला पुरुष
  rationale: यह पुरुषवाचक रूप है और इस शुद्धता-विधि के संदर्भ में शारीरिक स्राव से ग्रस्त पुरुष को दर्शाता है। यह चयन लिंग-संदर्भ को स्पष्ट और सहज हिंदी में बनाए रखता है।
- source_word: כֹל אֲשֶׁר יִגַּע בּוֹ
  choice: जिस किसी को ... छुए
  rationale: כֹל אֲשֶׁר का व्यापक, व्यक्तिवाचक अर्थ और נגע ב का शारीरिक स्पर्श का भाव स्वाभाविक हिंदी में व्यक्त होता है।
- source_word: וְיָדָיו לֹא שָׁטַף בַּמָּיִם
  choice: और उसने अपने हाथ पानी से न धोए हों
  rationale: इस उपवाक्य का कर्ता स्राव वाला पुरुष है। इसे परिस्थिति अथवा शर्त बताने वाले उपवाक्य के रूप में रखा गया है; हिब्रू वाक्य-संबंध में कुछ अस्पष्टता बनी रहने के कारण पादटिप्पणी दी गई है।
- source_word: שָׁטַף
  choice: धोए
  rationale: क्रिया का अर्थ पानी से धोना अथवा खंगालना है। हाथों के संदर्भ में ‘धोना’ आधुनिक हिंदी में सबसे सहज है, यद्यपि मूल में बाद की शारीरिक धुलाई के लिए अलग क्रिया प्रयुक्त है।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: כּבס विशेषतः वस्त्र धोने के लिए प्रयुक्त है; ‘कपड़े धोना’ स्पष्ट और वर्तमान हिंदी प्रयोग है।
- source_word: וְרָחַץ בַּמַּיִם
  choice: पानी से स्नान करे
  rationale: רחץ यहाँ शरीर धोने को दर्शाता है। ‘स्नान करे’ इसे कपड़े और हाथ धोने से अलग रखते हुए संक्षेप में व्यक्त करता है।
- source_word: וְטָמֵא עַד הָעָרֶב
  choice: शाम तक अशुद्ध रहे
  rationale: טמא यहाँ धार्मिक शुद्धता-विधि की अवस्था को दर्शाता है, नैतिक दोष को नहीं। ‘अशुद्ध’ इस विधिक श्रेणी का प्रचलित हिंदी रूप है।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में טמא का स्वरूप
  choice: अशुद्ध
  alternative: दूषित
  rationale: यह अवस्था शारीरिक संपर्क से उत्पन्न होती है और धुलाई तथा समय बीतने पर समाप्त होती है; इसलिए यह धार्मिक-विधिक अशुद्धता है, नैतिक अपराध नहीं।
- issue: हाथ न धोने वाले व्यक्ति की पहचान और उपवाक्य का संबंध
  choice: हाथ स्राव वाले पुरुष के हैं; वाक्यांश उसके स्पर्श की परिस्थिति बताता है
  alternative: 'इसे स्पष्ट शर्त के रूप में पढ़ना: ‘यदि उसने अपने हाथ पानी से न धोए हों’'
  rationale: יָדָיו का निकटतम और व्याकरणिक संदर्भ הַזָּב है। हिब्रू समन्वय परिस्थिति और शर्त के बीच सूक्ष्म अस्पष्टता की अनुमति देता है, जिसे मुख्य पाठ और पादटिप्पणी मिलकर सुरक्षित रखते हैं।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘स्राव वाला पुरुष’ पुरुष-संदर्भ को बनाए रखता है; ‘अशुद्ध’ को नैतिक दोष के बजाय शुद्धता-विधि की तकनीकी अवस्था के रूप में समझना चाहिए।
