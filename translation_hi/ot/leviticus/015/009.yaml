base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/009.yaml
  text: And every saddle on which the man with the discharge rides shall be unclean[a].
translation:
  language: hi
  text: और हर वह काठी, जिस पर स्राव वाला पुरुष सवारी करे, अशुद्ध होगी।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हर वह वस्तु जिस पर सवारी की जाए”; इब्रानी शब्द का अर्थ केवल संकीर्ण अर्थ में काठी नहीं, बल्कि सवारी के लिए प्रयुक्त वस्तु भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/כָל
  choice: और हर
  rationale: וְ पिछले नियमों से जोड़ता है और כָּל का वितरणात्मक, सार्वत्रिक भाव है; ‘और हर’ दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: הַ/מֶּרְכָּב
  choice: काठी
  rationale: מֶרְכָּב का मूल अर्थ वह वस्तु है जिस पर सवारी की जाती है। इस शुद्धता-विधान के प्रसंग में ‘काठी’ स्वाभाविक और ठोस अर्थ देता है; व्यापक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר יִרְכַּב עָלָיו
  choice: जिस पर ... सवारी करे
  rationale: यह सम्बन्धवाचक उपवाक्य इब्रानी के स्थान-सूचक עַל और क्रिया ‘सवारी करना’ को स्पष्ट, सहज हिन्दी में बनाए रखता है।
- source_word: הַ/זָּב
  choice: स्राव वाला पुरुष
  rationale: זָב यहाँ पुंलिंग कृदन्त-संज्ञा है और अध्याय के प्रसंग में शारीरिक स्राव से ग्रस्त पुरुष को बताता है। यह चयन पुरुष-सन्दर्भ को स्पष्ट रखते हुए अनावश्यक चिकित्सकीय विशिष्टता नहीं जोड़ता।
- source_word: יִטְמָא
  choice: अशुद्ध होगी
  rationale: टामे क्रिया यहाँ धार्मिक-विधिक अशुद्धता की स्थिति बताती है। हिन्दी में काठी स्त्रीलिंग होने के कारण ‘अशुद्ध होगी’ स्वाभाविक है और नैतिक दोष का अर्थ नहीं जोड़ता।
theological_decisions:
- issue: लैव्यव्यवस्था में अशुद्धता की प्रकृति
  choice: טמא को धार्मिक-विधिक अर्थ में ‘अशुद्ध’ कहना
  alternative: दूषित / अपवित्र
  rationale: यह पद शारीरिक स्राव से जुड़ी विधिक अशुद्धता के बारे में है, न कि अनिवार्य रूप से पाप या नैतिक दोष के बारे में। ‘अशुद्ध’ स्रोत का भेद बनाए रखता है और अतिरिक्त धार्मिक निष्कर्ष नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक शैली। ‘स्राव वाला पुरुष’ सामान्य पाठक के लिए स्पष्ट है; ‘काठी’ मुख्य पाठ को सहज रखता है, जबकि स्रोत की व्यापक lexical सम्भावना पादटिप्पणी में सुरक्षित है।
