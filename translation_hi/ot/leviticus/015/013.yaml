base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/013.yaml
  text: And when the man with the discharge is cleansed from his discharge[a], then he shall count seven days for his cleansing, and wash his clothes and bathe his body in living water; then he shall be clean.
translation:
  language: hi
  text: और जब स्राव वाला पुरुष अपने स्राव से शुद्ध हो जाए, तब वह अपनी शुद्धि के लिए सात दिन गिने। फिर वह अपने कपड़े धोए और बहते जल[a] से अपने शरीर को धोए; तब वह शुद्ध होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “जीवित जल”; अर्थात ताज़ा अथवा बहता हुआ जल।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַזָּב
  choice: स्राव वाला पुरुष
  rationale: यह कृदन्त-संज्ञा इस अध्याय में वर्णित शारीरिक स्राव से ग्रस्त पुरुष को सूचित करती है। यह अनुवाद पुरुष-संदर्भ को बनाए रखते हुए सहज और चिकित्सकीय रूप से तटस्थ है।
- source_word: יִטְהַר מִזּוֹבוֹ
  choice: अपने स्राव से शुद्ध हो जाए
  rationale: यहाँ क्रिया अनुष्ठानिक अशुद्धता से शुद्ध अवस्था में आने को व्यक्त करती है; इसका आशय नैतिक दोष से क्षमा पाना नहीं है।
- source_word: וְסָפַר לוֹ שִׁבְעַת יָמִים
  choice: वह ... सात दिन गिने
  rationale: यह विधिक प्रक्रिया की अगली क्रिया है। हिंदी में भविष्यसूचक क्रियारूप निर्देश का भाव स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לְטָהֳרָתוֹ
  choice: अपनी शुद्धि के लिए
  rationale: संज्ञा अनुष्ठानिक शुद्धि की प्रक्रिया और परिणामी अवस्था से संबंधित है।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: कपड़ों को धोने की क्रिया को सरल, वर्तमान हिंदी में स्पष्ट रूप से व्यक्त करता है।
- source_word: וְרָחַץ בְּשָׂרוֹ
  choice: अपने शरीर को नहाए
  rationale: בשר का शाब्दिक अर्थ 'मांस' है, पर पूरे शरीर के अनुष्ठानिक स्नान के प्रसंग में 'शरीर' स्वाभाविक अर्थ देता है।
- source_word: בְּמַיִם חַיִּים
  choice: बहते जल
  rationale: शाब्दिक अभिव्यक्ति 'जीवित जल' है, जो यहाँ स्रोत से आने वाले ताजे अथवा बहते जल का मुहावरा है। 'बहते जल' आधुनिक हिंदी में व्यावहारिक आशय स्पष्ट करता है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: וְטָהֵר
  choice: तब वह शुद्ध होगा
  rationale: यह निर्धारित प्रक्रिया के बाद प्राप्त अनुष्ठानिक शुद्ध अवस्था को व्यक्त करता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता को नैतिक दोष से अलग रखना
  choice: '''शुद्ध हो जाए'' और ''शुद्ध होगा'''
  alternative: '''पवित्र हो जाए'' अथवा नैतिक रूप से दोषमुक्त समझाने वाली भाषा'
  rationale: लैव्यव्यवस्था 15 में शारीरिक स्राव से उत्पन्न अनुष्ठानिक अशुद्धता का विषय है, व्यक्तिगत पाप का आरोप नहीं। 'शुद्ध' स्रोत की श्रेणी को बिना नैतिक अर्थ जोड़े बनाए रखता है।
- issue: מַיִם חַיִּים के मुहावरे का अर्थ
  choice: मुख्य पाठ में 'बहते जल', पादटिप्पणी में 'जीवित जल'
  alternative: मुख्य पाठ में 'जीवित जल' या 'ताजा जल'
  rationale: यह चुनाव प्रसंगगत, भौतिक अर्थ को स्पष्ट करता है और साथ ही पादटिप्पणी में हिब्रू की ठोस शाब्दिक छवि तथा अर्थ-सीमा को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज किंतु गरिमापूर्ण विधिक-अनुष्ठानिक शैली रखी गई है। 'स्राव' चिकित्सकीय रूप से तटस्थ है और 'शुद्ध' को प्रसंग के अनुसार अनुष्ठानिक अर्थ में प्रयुक्त किया गया है।
