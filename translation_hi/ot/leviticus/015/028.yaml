source:
  edition: WLC
  text: וְ/אִֽם טָהֲרָ֖ה מִ/זּוֹבָ֑/הּ וְ/סָ֥פְרָה לָּ֛/הּ שִׁבְעַ֥ת יָמִ֖ים וְ/אַחַ֥ר תִּטְהָֽר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/028.yaml
  text: But if she is cleansed from her discharge[a], then she shall count seven days for herself, and after that she shall be clean.
translation:
  language: hi
  text: परन्तु यदि उसका स्राव बंद हो जाए[a], तो वह अपने लिए सात दिन गिने, और उसके बाद वह शुद्ध होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “यदि वह अपने स्राव से शुद्ध हो जाए।” इब्रानी में दोनों उपवाक्यों में एक ही मूल शब्द आया है—पहले स्राव की समाप्ति के लिए और फिर उससे मिलने वाली अनुष्ठानिक शुद्ध स्थिति के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले प्रसंग से जुड़ी हुई एक विपरीत शर्त प्रस्तुत करता है; ‘परन्तु यदि’ इस संबंध को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: טָהֲרָה מִזּוֹבָהּ
  choice: उसका स्राव बंद हो जाए
  rationale: इस संदर्भ में वाक्यांश का आशय स्राव की समाप्ति से है। यह सहज आधुनिक हिन्दी है; साथ ही पादटिप्पणी में טהר की शाब्दिक पुनरावृत्ति सुरक्षित रखी गई है।
- source_word: וְסָפְרָה לָּהּ שִׁבְעַת יָמִים
  choice: तो वह अपने लिए सात दिन गिने
  rationale: ‘अपने लिए’ לָהּ को बनाए रखता है और बताता है कि यह गणना उसी की शुद्धता-अवधि से संबंधित है। ‘गिने’ विधिक निर्देश का स्वाभाविक रूप है।
- source_word: וְאַחַר
  choice: और उसके बाद
  rationale: सात दिनों की गणना पूरी होने के बाद आने वाले अगले चरण को स्पष्ट करता है।
- source_word: תִּטְהָר
  choice: वह शुद्ध होगी
  rationale: यहाँ טהר सात दिनों के बाद प्राप्त होने वाली अनुष्ठानिक शुद्ध स्थिति को दर्शाता है; ‘शुद्ध होगी’ इसे संक्षिप्त और स्पष्ट रूप से व्यक्त करता है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता की शब्दावली
  choice: ‘शुद्ध’ को अनुष्ठानिक स्थिति के अर्थ में प्रयोग किया गया है।
  alternative: ‘साफ़’ या नैतिक रूप से ‘पवित्र’
  rationale: लैव्यव्यवस्था 15 में शारीरिक स्राव से संबंधित अनुष्ठानिक स्थिति की बात है, नैतिक दोष या पाप की नहीं। ‘शुद्ध’ स्रोत की धार्मिक-विधिक श्रेणी को बनाए रखता है।
- issue: טהר के पहले प्रयोग का अर्थ
  choice: मुख्य पाठ में ‘स्राव बंद हो जाए’
  alternative: ‘वह अपने स्राव से शुद्ध हो जाए’
  rationale: पहला प्रयोग स्राव की समाप्ति की ओर संकेत करता है, जबकि अंतिम प्रयोग परिणामी अनुष्ठानिक स्थिति बताता है। मुख्य पाठ अर्थ को स्वाभाविक हिन्दी में देता है और पादटिप्पणी इब्रानी की समान धातु तथा संभावित शाब्दिक रूप को सुरक्षित रखती है।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण विधिक हिन्दी। ‘स्राव’ सामान्य पाठक के लिए समझने योग्य चिकित्सकीय शब्द है। वाक्य में स्त्री के लिए आदरसूचक बहुवचन न अपनाकर मूल के एकवचन विधिक कथन को सीधा रखा गया है।
