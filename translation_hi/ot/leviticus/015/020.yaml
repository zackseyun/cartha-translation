source:
  edition: WLC
  text: וְ/כֹל֩ אֲשֶׁ֨ר תִּשְׁכַּ֥ב עָלָ֛י/ו בְּ/נִדָּתָ֖/הּ יִטְמָ֑א וְ/כֹ֛ל אֲשֶׁר תֵּשֵׁ֥ב עָלָ֖י/ו יִטְמָֽא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/020.yaml
  text: And everything on which she lies during her menstrual impurity shall be unclean[a], and everything on which she sits shall be unclean.
translation:
  language: hi
  text: और मासिक धर्म की अशुद्धता के समय वह जिस किसी वस्तु पर लेटेगी, वह अशुद्ध हो जाएगी[a]; और जिस किसी वस्तु पर वह बैठेगी, वह अशुद्ध हो जाएगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उसके मासिक धर्म के समय।” इब्रानी शब्द केवल शारीरिक मासिक चक्र ही नहीं, बल्कि उससे जुड़ी अनुष्ठानिक अशुद्धता की अवस्था को भी समेटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: נִדָּה
  choice: मासिक धर्म की अशुद्धता
  rationale: यह पद मासिक धर्म से जुड़ी लैव्यव्यवस्था की अनुष्ठानिक अशुद्धता की अवस्था का वर्णन करता है; यह अनुवाद जैविक अवस्था और शुद्धता-विधान, दोनों को व्यक्त करता है तथा नैतिक दोष का संकेत नहीं देता।
- source_word: תִּשְׁכַּב
  choice: लेटेगी
  rationale: שׁכב यहाँ किसी वस्तु पर लेटने को दर्शाता है, आवश्यक रूप से सोने को नहीं।
- source_word: תֵּשֵׁב
  choice: बैठेगी
  rationale: ישׁב का यहाँ सीधा अर्थ किसी वस्तु पर बैठना है।
- source_word: עָלָיו
  choice: जिस ... वस्तु पर
  rationale: पूर्वसर्ग और सर्वनामिक प्रत्यय उस वस्तु को सूचित करते हैं जिस पर वह लेटती या बैठती है; हिन्दी सापेक्ष वाक्य में यह स्वाभाविक अभिव्यक्ति है।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगी
  rationale: सन्दर्भ में क्रिया का आशय अनुष्ठानिक रूप से अशुद्ध अवस्था में आना है; स्त्रीलिंग रूप 'वस्तु' के अनुसार रखा गया है।
- source_word: וְכֹל אֲשֶׁר
  choice: जिस किसी वस्तु
  rationale: यह व्यापक सापेक्ष पदबंध हर ऐसी वस्तु को सम्मिलित करता है; हिन्दी में यह सहज और वितरणात्मक अर्थ वाला रूप है।
theological_decisions:
- issue: लैव्यव्यवस्था के शुद्धता-विधान में अशुद्धता का स्वरूप
  choice: טמא और נִדָּה को अनुष्ठानिक शुद्धता की श्रेणी में व्यक्त करना, बिना नैतिक दोष जोड़े
  alternative: ऐसी शब्दावली जो मासिक धर्म को पाप या नैतिक कलंक समझा सकती हो
  rationale: पद इस्राएल के शुद्धता-विधान के अन्तर्गत अनुष्ठानिक अशुद्धता की बात करता है; यह मासिक धर्म को नैतिक अपराध नहीं ठहराता।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। विधिक भविष्यवाची शैली में 'हो जाएगी' रखा गया है; 'अशुद्धता' को सन्दर्भ और पाद-टिप्पणी द्वारा अनुष्ठानिक अर्थ में स्पष्ट किया गया है।
