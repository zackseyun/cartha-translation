  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: तब ... ने ... कहा
  rationale: वय्यिक्तोल रूप कथा को आगे बढ़ाता है; ‘तब’ उसके क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है। हिन्दी में ‘कहा’ अगली प्रत्यक्ष वाणी का सहज परिचायक है।
- source_word: יְהוָה
  choice: यहवे
  rationale: मूल पाठ में प्रयुक्त परमेश्वर के व्यक्तिगत नाम יהוה को किसी उपाधि से बदलने के बजाय हिन्दी में निकट लिप्यंतरण द्वारा रखा गया है।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: दोनों व्यक्तियों को संबोधित करने का अर्थ स्पष्ट रहता है; हिन्दी में एक ही ‘से’ के साथ संयुक्त संरचना अधिक स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह क्रियारूप आगे आने वाली प्रत्यक्ष वाणी का परिचय देता है। हिन्दी में ‘कहा’ वַיְדַבֵּר ... לֵאמֹר सूत्र को संक्षिप्त और स्वाभाविक ढंग से व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहवे
  alternative: यहोवा; प्रभु
  rationale: पद में उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत नाम है। ‘यहवे’ उसे नाम के रूप में सुरक्षित रखता है; पाठक की परिचित पारंपरिक अभिव्यक्ति स्पष्ट करने के लिए पादटिप्पणी दी गई है।
