base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/015.yaml
  text: The priest shall offer them[a], one as a sin offering and the other as a burnt offering, and the priest shall make atonement for him before Yahweh because of his discharge.
translation:
  language: hi
  text: याजक उन दोनों को चढ़ाए, एक को पापबलि[a] के रूप में और दूसरे को होमबलि के रूप में; और याजक उसके स्राव के कारण यहोवा के सामने उसके लिए प्रायश्चित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द חַטָּאת उस बलि को भी सूचित कर सकता है जो अनुष्ठानिक अशुद्धता दूर करने के लिए चढ़ाई जाती थी, न कि केवल नैतिक पाप के लिए।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְעָשָׂה אֹתָם
  choice: उन दोनों को चढ़ाए
  rationale: बलिदान-संबंधी प्रसंग में עשה का अर्थ अनुष्ठानपूर्वक अर्पित करना है; אֹתָם पिछले पद के दोनों पक्षियों की ओर संकेत करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-विधान में כהן का मानक और स्वाभाविक हिन्दी रूप।
- source_word: אֶחָד חַטָּאת
  choice: एक को पापबलि
  rationale: חַטָּאת का पारंपरिक और व्यापक रूप से पहचाना जाने वाला अनुवाद रखा गया है; शुद्धिकरण-संबंधी तकनीकी अर्थ पादटिप्पणी में सुरक्षित है।
- source_word: וְהָאֶחָד עֹלָה
  choice: दूसरे को होमबलि के रूप में
  rationale: עֹלָה उस बलि को सूचित करता है जो पूर्णतः वेदी पर जलाई जाती है; हिन्दी बाइबलीय प्रयोग में 'होमबलि' सुस्थापित है।
- source_word: וְכִפֶּר עָלָיו
  choice: उसके लिए प्रायश्चित करे
  rationale: כפר की अनुष्ठानिक और धर्मवैज्ञानिक व्यापकता को बनाए रखता है तथा उसके प्रभाव की किसी एक व्याख्या को आरोपित नहीं करता।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: मूल के स्थानिक/उपस्थितिपरक भाव को स्वाभाविक हिन्दी में व्यक्त करता है और יהוה को परियोजना की रीति के अनुसार 'यहोवा' कहा गया है।
- source_word: מִזּוֹבוֹ
  choice: उसके स्राव के कारण
  rationale: מן यहाँ उस अशुद्धि के कारण या स्रोत को दर्शाता है जिसके संबंध में प्रायश्चित किया जाता है; 'के कारण' हिन्दी में अर्थ स्पष्ट करता है।
theological_decisions:
- issue: शुद्धता-विधान के प्रसंग में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: '''पापबलि'' परिचित और मूल पद का मान्य अनुवाद है, जबकि इस प्रसंग में बलि नैतिक पाप के बजाय अनुष्ठानिक अशुद्धता दूर करने से जुड़ी हो सकती है; इस तनाव को पादटिप्पणी में रखा गया है।'
- issue: כפר का अनुवाद
  choice: प्रायश्चित करे
  alternative: दोष ढाँपे / शुद्ध करे
  rationale: '''प्रायश्चित करे'' मूल क्रिया की व्यापक बलिदान-संबंधी शक्ति बनाए रखता है और उसके तंत्र को अनावश्यक रूप से किसी एक सिद्धान्त तक सीमित नहीं करता।'
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज विधिक शैली। 'याजक', 'पापबलि', 'होमबलि' और 'प्रायश्चित' जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य-विन्यास को पठनीय बनाने के लिए दो वाक्यों में बाँटा गया है।
