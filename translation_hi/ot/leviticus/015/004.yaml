base_translation:
  language: en
  yaml_path: translation/ot/leviticus/015/004.yaml
  text: Every bed on which the man with the discharge lies shall be unclean[a], and every vessel on which he sits shall be unclean.
translation:
  language: hi
  text: हर वह बिछौना, जिस पर स्राव वाला पुरुष लेटे, अशुद्ध होगा; और हर वह वस्तु[a], जिस पर वह बैठे, अशुद्ध होगी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द का अर्थ व्यापक है और वह किसी सामान, उपकरण या पात्र को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּשְׁכָּב
  choice: बिछौना
  rationale: מִשְׁכָּב लेटने की जगह को दर्शाता है। यहाँ ‘बिछौना’ आधुनिक हिन्दी में स्वाभाविक है और केवल चौखट वाले पलंग तक अर्थ को सीमित नहीं करता।
- source_word: הַזָּב
  choice: स्राव वाला पुरुष
  rationale: זָב यहाँ זוּב से बना पुल्लिंग एकवचन कृदन्त है और शारीरिक स्राव वाले पुरुष को सूचित करता है। यह चयन लिंग और प्रसंग दोनों को स्पष्ट रखते हुए अनावश्यक चिकित्सकीय व्याख्या नहीं जोड़ता।
- source_word: יִשְׁכַּב עָלָיו
  choice: जिस ... पर ... लेटेगा
  rationale: इब्रानी सम्बन्धवाचक संरचना और עַל के ‘पर’ अर्थ को स्वाभाविक हिन्दी विधिक वाक्य में रखा गया है। भविष्यत् रूप सामान्य नियम के परिणामकारी स्वर को व्यक्त करता है।
- source_word: יִטְמָא
  choice: अशुद्ध हो जाएगा/जाएगी
  rationale: काल क्रिया यहाँ किसी वस्तु की अनुष्ठानिक अशुद्धता की स्थिति में आने का कानूनी परिणाम बताती है। हिन्दी में ‘अशुद्ध हो जाएगा’ यह परिणाम स्पष्ट करता है, बिना नैतिक दोष का संकेत दिए।
- source_word: הַכְּלִי
  choice: वस्तु
  rationale: כְּלִי का अर्थ व्यापक है—सामान, उपकरण, पात्र या अन्य उपयोगी वस्तु। चूँकि यहाँ उस पर बैठने की बात है, ‘वस्तु’ हिन्दी में ‘पात्र’ से अधिक स्वाभाविक है और मूल की व्यापकता बनाए रखता है।
- source_word: יֵשֵׁב עָלָיו
  choice: जिस ... पर वह बैठेगा
  rationale: ישׁב के साथ עַל का अर्थ ‘पर बैठना’ है। यह रूप मूल की सामान्य विधिक शर्त को सहज हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: ‘अशुद्ध’—लैव्यव्यवस्था की अनुष्ठानिक शुद्धता की श्रेणी
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ या ‘अपवित्र’
  rationale: मूल में कोई व्याख्यात्मक विशेषण नहीं है। ‘अशुद्ध’ स्थापित और सीधा समतुल्य है; ‘अनुष्ठानिक रूप से’ स्पष्टता तो देता, पर मूल में शब्द जोड़ता, जबकि ‘अपवित्र’ नैतिक या आध्यात्मिक भ्रष्टता का अधिक प्रबल संकेत दे सकता है।
- issue: कर्ता का लिंग
  choice: पुरुषवाचक सन्दर्भ को ‘स्राव वाला पुरुष’ और ‘वह’ से सुरक्षित रखा गया
  alternative: लिंग-निरपेक्ष ‘स्राव वाला व्यक्ति’
  rationale: इब्रानी में पुल्लिंग एकवचन रूप हैं और निकटवर्ती प्रसंग पुरुष के शारीरिक स्राव से सम्बन्धित है; इसलिए पुरुषवाचकता को हटाना उचित नहीं होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘जिस किसी’ से כָּל की सर्वसमावेशी कानूनी शक्ति व्यक्त होती है। पुल्लिंग ‘बिछौना’ और स्त्रीलिंग ‘वस्तु’ के अनुसार परिणामकारी क्रियाओं में स्वाभाविक हिन्दी लिंग-सामंजस्य रखा गया है।
