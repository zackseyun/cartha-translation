  text: אָדָ֗ם כִּֽי יִהְיֶ֤ה בְ/עוֹר בְּשָׂר/וֹ֙ שְׂאֵ֤ת אֽוֹ סַפַּ֨חַת֙ א֣וֹ בַהֶ֔רֶת וְ/הָיָ֥ה בְ/עוֹר בְּשָׂר֖/וֹ לְ/נֶ֣גַע צָרָ֑עַת וְ/הוּבָא֙ אֶל אַהֲרֹ֣ן הַ/כֹּהֵ֔ן א֛וֹ אֶל אַחַ֥ד מִ/בָּנָ֖י/ו הַ/כֹּהֲנִֽים־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/002.yaml
  text: When a man has on the skin of his body a swelling[a], or a scab, or a bright spot, and it becomes on the skin of his body an infection of skin disease, then he shall be brought to Aaron the priest, or to one of his sons the priests.
translation:
  language: hi
  text: यदि किसी व्यक्ति के शरीर की त्वचा पर सूजन, पपड़ी या उजला धब्बा हो, और वह उसके शरीर की त्वचा पर चर्मरोग का घाव बन जाए[a], तो उसे हारून याजक के पास या उसके याजक-पुत्रों में से किसी एक के पास लाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़ का घाव” या “कुष्ठ रोग का घाव।” इब्रानी צָרָעַת त्वचा-संबंधी विकारों की एक व्यापक श्रेणी को दर्शाता है; इसे आधुनिक हैन्सेन रोग के समान मानना आवश्यक नहीं है।'
    reason: पारंपरिक अनुवाद को सुरक्षित रखते हुए संभावित भ्रामक आधुनिक चिकित्सीय समानता स्पष्ट करना।
lexical_decisions:
- source_word: אָדָם
  choice: किसी व्यक्ति
  rationale: यह एकवचन में सामान्य कानूनी परिस्थिति का आरम्भ करता है; आधुनिक हिन्दी में ‘किसी व्यक्ति’ स्वाभाविक है और इब्रानी के व्यापक मानवीय संदर्भ को बनाए रखता है।
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: उसके शरीर की त्वचा पर
  rationale: इब्रानी की ठोस शारीरिक अभिव्यक्ति तथा पद में उसकी पुनरावृत्ति को सहज हिन्दी में सुरक्षित रखता है।
- source_word: שְׂאֵת
  choice: सूजन
  rationale: त्वचा के उभरे हुए भाग का स्पष्ट और सामान्य हिन्दी वर्णन।
- source_word: סַפַּחַת
  choice: पपड़ी
  rationale: ठीक त्वचा-विकार अनिश्चित है; ‘पपड़ी’ ठोस घाव-सदृश अर्थ देता है, पर अनावश्यक आधुनिक निदान नहीं थोपता।
- source_word: בַּהֶרֶת
  choice: चमकीला धब्बा
  rationale: मूल शब्द की चमकीले या फीके चिह्न की धारणा को बनाए रखता है और उसे केवल ‘सफेद’ नहीं ठहराता।
- source_word: לְנֶגַע צָרָעַת
  choice: चर्मरोग का घाव
  rationale: נֶגַע के दृश्य पीड़ित स्थान/घाव और צָרָעַת की व्यापक बाइबलीय त्वचा-विकार श्रेणी को व्यक्त करता है; आधुनिक कुष्ठ रोग का निश्चित निदान नहीं करता।
- source_word: וְהוּבָא
  choice: उसे ... लाया जाए
  rationale: निफ़अल की कर्मवाच्य कानूनी प्रक्रिया और निर्देशात्मक बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: אַהֲרֹן הַכֹּהֵן
  choice: हारून याजक
  rationale: नाम और पदवी का सीधा, प्रचलित हिन्दी रूप।
- source_word: אַחַד מִבָּנָיו הַכֹּהֲנִים
  choice: उसके याजक-पुत्रों में से किसी एक
  rationale: हारून से पारिवारिक संबंध और पुत्रों की याजकीय पहचान दोनों को संक्षेप तथा स्पष्टता से व्यक्त करता है।
theological_decisions:
- issue: צָרָעַת का अनुवाद
  choice: चर्मरोग
  alternative: कोढ़ / कुष्ठ रोग / त्साराअत
  rationale: यह इब्रानी शब्द आधुनिक हैन्सेन रोग से अधिक व्यापक अनुष्ठानिक-निदानात्मक श्रेणी को सूचित करता है। ‘चर्मरोग’ किसी विशिष्ट आधुनिक रोग को आरोपित किए बिना मूल का सामान्य आशय देता है; पारंपरिक विकल्प पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी; कानूनी-विधिक स्वर गरिमापूर्ण पर सहज रखा गया है। मूल की तीन त्वचा-स्थितियाँ, शारीरिक पदबंध की पुनरावृत्ति और कर्मवाच्य प्रक्रिया संरक्षित हैं।
