source:
  edition: WLC
  text: וְ/רָאָ֨ה אֶת הַ/נֶּ֜גַע בַּ/יּ֣וֹם הַ/שְּׁבִיעִ֗י כִּֽי פָשָׂ֤ה הַ/נֶּ֨גַע֙ בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בָ/ע֔וֹר לְ/כֹ֛ל אֲשֶׁר יֵעָשֶׂ֥ה הָ/ע֖וֹר לִ/מְלָאכָ֑ה צָרַ֧עַת מַמְאֶ֛רֶת הַ/נֶּ֖גַע טָמֵ֥א הֽוּא־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/051.yaml
  text: On the seventh day he shall examine the infection[a], and if the infection has spread in the garment, or in the warp, or in the woof, or in the leather, in anything for which leather is made for work, the infection is a destructive skin disease[c][b]; it is unclean.
translation:
  language: hi
  text: सातवें दिन वह उस दाग[a] की जाँच करे। यदि वह दाग वस्त्र में, ताने में, बाने में, चमड़े में या चमड़े से बनी किसी भी उपयोगी वस्तु में फैल गया हो, तो वह दाग नाशकारी त्साराअत[b] है; वह अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: यहाँ ‘दाग’ उस प्रभावित चिह्न के लिए है जिसकी याजक जाँच करता था; इसका अर्थ आवश्यक रूप से आधुनिक चिकित्सकीय संक्रमण नहीं है।
    reason: lexical_alternative
  - marker: b
    text: 'हिब्रू: त्साराअत। इसका अनुवाद परंपरागत रूप से ‘कोढ़’ किया गया है, पर लैव्यव्यवस्था में यह शब्द विभिन्न अशुद्धिकारक दशाओं के लिए आता है और वस्त्रों तथा चमड़े पर भी लागू होता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: याजकीय निरीक्षण के इस विधिक प्रसंग में क्रिया का अर्थ केवल देखना नहीं, ध्यानपूर्वक जाँच करना है।
- source_word: הַנֶּגַע
  choice: दाग
  rationale: यहाँ शब्द वस्त्र या चमड़े पर दिखाई देने वाले प्रभावित चिह्न को दर्शाता है। ‘दाग’ स्वाभाविक है और आधुनिक चिकित्सकीय ‘संक्रमण’ का अनावश्यक अर्थ नहीं जोड़ता।
- source_word: פָשָׂה
  choice: फैल गया हो
  rationale: क्रिया प्रभावित दाग के फैलने या बढ़ने को व्यक्त करती है।
- source_word: בֶּגֶד
  choice: वस्त्र
  rationale: विधिक शैली में यह सामान्य और स्पष्ट समतुल्य है।
- source_word: שְׁתִי ... עֵרֶב
  choice: ताना ... बाना
  rationale: ये बुनाई के क्रमशः लंबवत और आड़े धागों के प्रचलित हिन्दी तकनीकी शब्द हैं।
- source_word: עוֹר
  choice: चमड़ा
  rationale: प्रसंग में खाल से तैयार और उपयोग में लाई जाने वाली सामग्री अभिप्रेत है, इसलिए ‘चमड़ा’ उपयुक्त है।
- source_word: לְכֹל אֲשֶׁר יֵעָשֶׂה הָעוֹר לִמְלָאכָה
  choice: चमड़े से काम में आने वाली किसी भी वस्तु में
  rationale: वाक्यांश के व्यापक विधिक आशय को रखते हुए यह चमड़े से बनाई गई उपयोगी वस्तुओं को स्वाभाविक हिन्दी में समेटता है।
- source_word: צָרַעַת מַמְאֶרֶת
  choice: नाशकारी चर्मरोग
  rationale: मूल तकनीकी शब्द को अध्याय के मनुष्यों संबंधी प्रयोग से जोड़ते हुए ‘चर्मरोग’ रखा गया है, जबकि ‘नाशकारी’ उसके हानिकारक या खा जाने वाले गुण को व्यक्त करता है; पादटिप्पणी स्पष्ट करती है कि यह आधुनिक रोग-निदान नहीं है।
- source_word: טָמֵא הוּא
  choice: वह वस्तु अशुद्ध है
  rationale: हिब्रू सर्वनाम का संदर्भ हिन्दी में स्पष्ट करने के लिए ‘वस्तु’ जोड़ा गया है; ‘अशुद्ध’ लैव्यव्यवस्था की धार्मिक-विधिक स्थिति दर्शाता है।
theological_decisions:
- issue: צָרַעַת को वस्त्र और चमड़े के प्रसंग में प्रस्तुत करना
  choice: चर्मरोग, साथ में स्पष्टीकरणात्मक पादटिप्पणी
  alternative: कोढ़; अशुद्धिकारक दाग; फफूँद
  rationale: यह हिब्रू शब्द आधुनिक हैन्सन रोग के समानार्थी नहीं है और इस अध्याय में वस्त्र तथा चमड़े पर भी लागू होता है। मुख्य पाठ अध्याय की शब्दावली की निरंतरता रखता है, जबकि पादटिप्पणी इसकी व्यापक धार्मिक-विधिक सीमा बताती है।
- issue: טָמֵא की स्थिति
  choice: अशुद्ध
  alternative: रीति से अशुद्ध
  rationale: ‘अशुद्ध’ संक्षिप्त और पारंपरिक रूप से बोधगम्य है; लैव्यव्यवस्था का प्रसंग इसके धार्मिक-विधिक अर्थ को स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक और गरिमापूर्ण, किंतु सामान्य पाठक के लिए सुबोध। ‘ताना-बाना’ की प्रचलित शब्दावली रखी गई है और अंतिम सर्वनाम का संदर्भ स्पष्ट करने के लिए ‘वस्तु’ जोड़ा गया है।
