  text: But if it does spread in the skin[a], the priest shall pronounce him unclean[b]; it is an infection.
translation:
  language: hi
  text: पर यदि वह त्वचा पर फैलता जाए, तो याजक उसे अशुद्ध घोषित करे[a]; वह एक दाग है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘उसे अशुद्ध ठहराए’ भी किया जा सकता है; यहाँ आशय अशुद्धता की याजकीय घोषणा से है।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ प्रसंग के अनुसार ‘व्याधि’, ‘प्रकोप’, ‘घाव’ या ‘प्रभावित स्थान’ भी हो सकता है; यह किसी आधुनिक रोग-श्रेणी का निश्चित नाम नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: पर यदि
  rationale: यह पहले बताए गए संभावित निष्कर्ष के विपरीत शर्त प्रस्तुत करता है; इसलिए केवल ‘यदि’ की अपेक्षा ‘पर यदि’ प्रसंग के विरोधात्मक बल को बेहतर व्यक्त करता है।
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: फैल ही जाए
  rationale: धातु के infinitive absolute और imperfect का मेल क्रिया पर बल देता है। ‘फैल ही जाए’ इस बल को स्वाभाविक हिन्दी में रखता है, बिना अनिवार्य रूप से निरंतर फैलते रहने का अर्थ जोड़ने के।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: עוֹר का अर्थ ‘त्वचा’ है। हिन्दी में किसी चिह्न या घाव के फैलने के लिए ‘त्वचा पर’ अधिक स्वाभाविक है, जबकि इब्रानी בְּ स्थानगत संबंध व्यक्त करता है।
- source_word: וְטִמֵּא
  choice: अशुद्ध घोषित करे
  rationale: इस याजकीय-कानूनी प्रसंग में Piel रूप किसी व्यक्ति को अशुद्ध बना देने के बजाय उसकी अशुद्ध स्थिति का अधिकृत निर्णय सुनाने को व्यक्त करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के याजकीय विधान में כֹּהֵן का मानक और सहज हिन्दी समतुल्य।
- source_word: אֹתוֹ
  choice: उसे
  rationale: पुल्लिंग एकवचन कर्मवाचक सर्वनाम जाँच कराए जा रहे व्यक्ति की ओर संकेत करता है।
- source_word: נֶגַע
  choice: रोगग्रस्त चिह्न
  rationale: נֶגַע यहाँ त्वचा पर दिखाई देने वाले पीड़ित या रोग-संबंधी स्थान के लिए व्यापक शब्द है। ‘रोगग्रस्त चिह्न’ दृश्य चिह्न और रोगात्मक दशा दोनों को रखता है, पर किसी आधुनिक चिकित्सकीय निदान को निश्चित नहीं करता।
- source_word: הִוא
  choice: वह … है
  rationale: यह सर्वनाम अभी वर्णित त्वचा की दशा या चिह्न की पहचान कराता है; हिन्दी में ‘वह … है’ स्वाभाविक है।
theological_decisions:
- issue: याजक की घोषणा से अशुद्धता का स्वरूप
  choice: याजक व्यक्ति को अशुद्ध घोषित करता है।
  alternative: याजक व्यक्ति को अशुद्ध बना देता है।
  rationale: याजकीय-कानूनी प्रसंग अधिकृत जाँच और धार्मिक स्थिति की घोषणा का है। अनुवाद यह संकेत नहीं देता कि याजक के कथन से ही अशुद्धता उत्पन्न होती है।
- issue: נֶגַע की चिकित्सकीय पहचान
  choice: व्यापक ‘रोगग्रस्त चिह्न’ रखा गया है।
  alternative: इसे निश्चित रूप से ‘संक्रमण’, ‘कुष्ठ रोग’ या किसी आधुनिक रोग का नाम देना।
  rationale: इब्रानी शब्द व्यापक है और आधुनिक चिकित्सा की किसी एक श्रेणी से ठीक-ठीक मेल नहीं खाता; इसलिए अनुवाद उसकी अनिश्चितता बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, विधिक और गरिमापूर्ण शैली रखी गई है। ‘फैल ही जाए’ मूल की क्रियात्मक तीव्रता को सहज रूप से व्यक्त करता है। ‘त्वचा पर’ सामान्य पाठक के लिए ‘त्वचा में’ से अधिक स्वाभाविक है। फुटनोट-चिह्न संबंधित पदों—‘अशुद्ध घोषित करे’ और ‘रोगग्रस्त चिह्न’—के तुरंत बाद रखे गए हैं।
