base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/041.yaml
  text: And if the front of his head becomes bald[a], he is bald on the forehead; he is clean.
translation:
  language: hi
  text: और यदि उसके सिर के सामने के भाग के बाल झड़ जाएँ[a], तो वह सामने से गंजा है; वह शुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “सिर के सामने का भाग गंजा हो जाए।” यहाँ प्रयुक्त इब्रानी शब्द पिछले पद में बताए गए सिर के पीछे की ओर के गंजेपन से इसे अलग करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִפְּאַת פָּנָיו
  choice: उसके सिर के सामने के भाग
  rationale: शाब्दिक पदबंध में ‘किनारा/ओर’ और ‘उसका मुख’ आते हैं, पर सिर की गंजेपन-संबंधी इस प्रसंग में आशय सिर के सामने वाले भाग से है।
- source_word: יִמָּרֵט
  choice: बाल झड़ जाएँ
  rationale: निफ़अल रूप बालों के हट जाने या उस स्थान के बालरहित हो जाने को व्यक्त करता है; आधुनिक हिन्दी में यह स्वाभाविक है।
- source_word: רֹאשׁוֹ
  choice: उसके सिर
  rationale: इस शारीरिक संदर्भ में רֹאשׁ का सीधा और स्वाभाविक अर्थ ‘सिर’ है।
- source_word: גִּבֵּחַ
  choice: सामने से गंजा
  rationale: यह शब्द पिछले पद में सिर के पीछे या चोटी की ओर के गंजेपन के लिए आए भिन्न शब्द से अलग, सामने के भाग के गंजेपन को बताता है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: लैव्यव्यवस्था के शुद्धता-विधान में यह याजकीय निर्णय से निर्धारित धार्मिक-अनुष्ठानिक स्थिति का मानक हिन्दी पद है, नैतिक निष्पापता का कथन नहीं।
theological_decisions:
- issue: शुद्धता-विधान में धार्मिक-अनुष्ठानिक स्थिति
  choice: शुद्ध
  alternative: साफ़
  rationale: यहाँ शारीरिक स्वच्छता या नैतिक पवित्रता नहीं, याजकीय जाँच के बाद ठहराई गई शुद्ध स्थिति अभिप्रेत है; ‘शुद्ध’ इस विधिक श्रेणी को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सामने से गंजा’ सामान्य पाठक के लिए सहज है और मूल में सामने तथा पीछे के गंजेपन के बीच किया गया भेद बनाए रखता है।
