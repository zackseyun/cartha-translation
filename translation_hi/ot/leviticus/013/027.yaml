base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/027.yaml
  text: And the priest shall examine him on the seventh day. If it has indeed spread in the skin, the priest shall pronounce him unclean; it is an infection of skin disease.
translation:
  language: hi
  text: सातवें दिन याजक उसकी जाँच करे। यदि वह त्वचा पर फैल ही गया हो, तो याजक उसे अशुद्ध ठहराए; यह चर्मरोग[a] का दाग है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़।” इब्रानी शब्द इस्राएल के शुद्धता-विधानों में त्वचा की विभिन्न दशाओं के लिए व्यापक रूप से प्रयुक्त हुआ है; इसका अर्थ केवल आधुनिक कोढ़ (हैन्सेन रोग) नहीं है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: उसकी जाँच करे
  rationale: क्रिया का शाब्दिक अर्थ ‘देखना’ है, पर याजकीय निदान के इस संदर्भ में इसका आशय ध्यानपूर्वक जाँच करना है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: इब्रानी कालवाचक पद का स्वाभाविक और सीधा हिन्दी रूप।
- source_word: אִם פָּשֹׂה תִפְשֶׂה
  choice: यदि वह ... सचमुच फैल गया हो
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute के बलाघात को ‘सचमुच’ से व्यक्त किया गया है।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: עוֹר का अर्थ त्वचा है; हिन्दी में किसी चिह्न या घाव के फैलने के लिए ‘त्वचा पर’ अधिक स्वाभाविक है।
- source_word: וְטִמֵּא ... אֹתוֹ
  choice: उसे अशुद्ध ठहराए
  rationale: याजक अशुद्धता उत्पन्न नहीं करता, बल्कि धार्मिक-विधिक निर्णय सुनाता है; ‘ठहराए’ इस भूमिका को स्पष्ट करता है।
- source_word: נֶגַע
  choice: घाव
  rationale: लैव्यव्यवस्था 13 में यह किसी दिखाई देने वाले रोग-चिह्न या प्रभावित स्थान को सूचित करता है। ‘घाव’ साधारण हिन्दी में सुबोध है और आधुनिक संक्रमण का अनावश्यक दावा नहीं करता।
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: यह इब्रानी शब्द आधुनिक हैन्सेन रोग तक सीमित नहीं है; ‘चर्मरोग’ व्यापक अर्थ को बनाए रखता है, जबकि पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
theological_decisions:
- issue: शुद्धता-विधान में צָרַעַת का अनुवाद
  choice: चर्मरोग
  alternative: कोढ़
  rationale: इब्रानी शब्द लैव्यव्यवस्था में आधुनिक कोढ़ अर्थात हैन्सेन रोग से अधिक व्यापक दशाओं को समेटता है। इसलिए मुख्य पाठ में चिकित्सकीय रूप से कम विशिष्ट शब्द रखा गया है और पारंपरिक अनुवाद पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक-याजकीय स्वर को बनाए रखते हुए सरल, गरिमापूर्ण भाषा। ‘त्वचा पर’ स्वाभाविक हिन्दी के लिए और ‘अशुद्ध ठहराए’ आधिकारिक निर्णय के भाव के लिए चुना गया है।
