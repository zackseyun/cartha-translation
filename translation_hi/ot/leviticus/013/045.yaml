  edition: WLC
  text: וְ/הַ/צָּר֜וּעַ אֲשֶׁר בּ֣/וֹ הַ/נֶּ֗גַע בְּגָדָ֞י/ו יִהְי֤וּ פְרֻמִים֙ וְ/רֹאשׁ/וֹ֙ יִהְיֶ֣ה פָר֔וּעַ וְ/עַל שָׂפָ֖ם יַעְטֶ֑ה וְ/טָמֵ֥א טָמֵ֖א יִקְרָֽא־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/045.yaml
  text: As for the one with the skin disease[a], in whom the infection is, his clothes shall be torn, his head shall be left unkempt, he shall cover his mustache, and he shall cry out, ‘Unclean, unclean!’
translation:
  language: hi
  text: “जिस व्यक्ति को चर्म-रोग हो, और उसके शरीर पर वह घाव हो, उसके कपड़े फटे हुए हों, उसके सिर के बाल बिखरे रहें, वह अपना ऊपरी होंठ ढके[a] और पुकारे, ‘अशुद्ध! अशुद्ध!’”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “वह अपनी मूँछों वाले भाग को ढके।” इब्रानी अभिव्यक्ति ऊपरी होंठ अथवा मूँछों के आसपास के भाग को ढकने का संकेत करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַצָּרוּעַ
  choice: जिस व्यक्ति को चर्मरोग हो
  rationale: צָרוּעַ लैव्यव्यवस्था में त्वचा-संबंधी व्यापक रोगावस्था को दर्शाता है; ‘कोढ़ी’ आधुनिक हैन्सन रोग का भ्रामक संकेत दे सकता है। ‘व्यक्ति’ इब्रानी के व्याकरणिक पुल्लिंग को अनावश्यक रूप से जैविक लिंग तक सीमित नहीं करता।
- source_word: הַנֶּגַע
  choice: वह रोग-चिह्न
  rationale: נֶגַע यहाँ जाँच में दिखाई देनेवाले रोगजन्य चिह्न अथवा घाव को सूचित करता है। ‘रोग-चिह्न’ आधुनिक जीवाणु-संक्रमण की धारणा आरोपित किए बिना प्रसंग स्पष्ट करता है।
- source_word: בְּגָדָיו יִהְיוּ פְרֻמִים
  choice: उसके कपड़े फटे हुए रहें
  rationale: פְרֻמִים फाड़े हुए वस्त्रों की सार्वजनिक दशा बताता है; ‘कपड़े’ स्वाभाविक आधुनिक हिन्दी है।
- source_word: וְרֹאשׁוֹ יִהְיֶה פָרוּעַ
  choice: उसके सिर के बाल बिखरे रहें
  rationale: פָרוּעַ खुले, अस्त-व्यस्त अथवा सँवारे न गए बालों की ओर संकेत करता है, न कि आवश्यक रूप से नंगे सिर की ओर।
- source_word: וְעַל שָׂפָם יַעְטֶה
  choice: वह अपने ऊपरी होंठ को ढके
  rationale: שָׂפָם ऊपरी होंठ या मूँछों वाले भाग को दर्शाता है। ‘ऊपरी होंठ’ शारीरिक स्थान को स्पष्ट रखता है; वैकल्पिक अर्थ पाद-टिप्पणी में दिया गया है।
- source_word: וְטָמֵא טָמֵא יִקְרָא
  choice: पुकार-पुकारकर कहे, ‘अशुद्ध! अशुद्ध!’
  rationale: दोहराया गया טָמֵא सार्वजनिक और जोरदार घोषणा है। ‘अशुद्ध’ लैव्यव्यवस्था की रीति-संबंधी स्थिति को व्यक्त करता है, जबकि ‘पुकार-पुकारकर’ יִקְרָא और पुनरुक्ति के सार्वजनिक बल को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
- issue: लैव्यव्यवस्था 13 में अशुद्धता का स्वरूप
  choice: טָמֵא को ‘अशुद्ध’ कहा गया है और इसे रीति-संबंधी तथा सार्वजनिक स्थिति के रूप में खुला रखा गया है।
  alternative: अपवित्र; दूषित
  rationale: यह पद अपने आप उस व्यक्ति पर नैतिक दोष नहीं लगाता और न रोग को पाप का सीधा परिणाम बताता है। ‘अशुद्ध’ इस भेद और मूल पाठ के धार्मिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सार्वजनिक विधिक निर्देश के अनुरूप रखी गई है। ‘कोढ़’ से बचकर व्यापक चर्मरोग-श्रेणी सुरक्षित रखी गई है। पाद-टिप्पणी का चिह्न संबंधित ‘ऊपरी होंठ’ वाक्यांश पर रखा गया है।
