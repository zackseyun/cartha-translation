  text: וְ/רָאָ֨ה אֹת֜/וֹ הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה שְׂאֵת הַ/נֶּ֨גַע֙ לְבָנָ֣ה אֲדַמְדֶּ֔מֶת בְּ/קָרַחְתּ֖/וֹ א֣וֹ בְ/גַבַּחְתּ֑/וֹ כְּ/מַרְאֵ֥ה צָרַ֖עַת ע֥וֹר בָּשָֽׂר־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/043.yaml
  text: and the priest examines him, and behold, the swelling of the disease is whitish-red on his bald head or on his bald forehead, like the appearance of a skin disease on the flesh,
translation:
  language: hi
  text: और याजक उसकी जाँच करे, और देखे कि रोग की उभरी हुई सूजन उसके सिर के पिछले गंजे भाग या सामने के गंजे भाग[b] पर लालिमा लिए हुए सफेद है और उसका रूप शरीर की त्वचा पर चर्मरोग[a] जैसा हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू צָרַעַת का पारंपरिक अनुवाद प्रायः “कोढ़” किया गया है, पर लैव्यव्यवस्था में यह केवल हैनसेन रोग नहीं, बल्कि विभिन्न त्वचा-सम्बन्धी अवस्थाओं को सूचित करता है।
    reason: lexical_alternative
  - marker: b
    text: गंजेपन के लिए प्रयुक्त दोनों हिब्रू शब्द सम्भवतः सिर के पिछले और सामने के भागों में भेद करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְרָאָה אֹתוֹ הַכֹּהֵן
  choice: और याजक उसकी जाँच करे
  rationale: यद्यपि ראה का मूल अर्थ ‘देखना’ है, लैव्यव्यवस्था 13 की याजकीय प्रक्रिया में इसका आशय सावधानी से जाँच करना है।
- source_word: וְהִנֵּה
  choice: और देखे कि
  rationale: हिन्दी की स्वाभाविक प्रक्रियात्मक भाषा में निरीक्षण से सामने आए तथ्य की ओर ध्यान खींचता है और हिब्रू के संकेतात्मक बल को बनाए रखता है।
- source_word: שְׂאֵת הַנֶּגַע
  choice: रोग की उभरी हुई सूजन
  rationale: שְׂאֵת किसी उभरे हुए चिह्न या सूजन को और נֶגַע जाँची जा रही व्याधि को सूचित करता है; दोनों तत्वों को स्पष्ट रूप से रखा गया है।
- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: लालिमा लिए सफेद
  rationale: यह अभिव्यक्ति सफेदी को मुख्य रंग रखते हुए उसमें लालिमा की मिश्रित छटा को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: उसके सिर के पिछले गंजे भाग या सामने के गंजे भाग पर
  rationale: दोनों हिब्रू संज्ञाओं के बीच सम्भावित पिछले और सामने के गंजे भाग का भेद स्पष्ट और पठनीय रूप में सुरक्षित रखा गया है।
- source_word: כְּמַרְאֵה
  choice: उसका रूप ... जैसा है
  rationale: निदान में बाहरी रूप की तुलना करने वाली हिब्रू भाषा को सुरक्षित रखता है।
- source_word: צָרַעַת עוֹר בָּשָׂר
  choice: शरीर की त्वचा पर होने वाले चर्मरोग
  rationale: צָרַעַת को केवल आधुनिक हैन्सन रोग तक सीमित किए बिना व्यापक त्वचा-सम्बन्धी रोग के रूप में प्रस्तुत करता है; עוֹר בָּשָׂר का शारीरिक त्वचा-सन्दर्भ भी बना रहता है।
theological_decisions:
- issue: צָרַעַת की पहचान
  choice: चर्मरोग
  alternative: कोढ़
  rationale: लैव्यव्यवस्था में यह शब्द आधुनिक हैन्सन रोग से अधिक व्यापक त्वचा-स्थितियों को समेटता है; इसलिए पारम्परिक किन्तु संकीर्ण और सम्भावित रूप से भ्रामक ‘कोढ़’ नहीं चुना गया।
