base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/034.yaml
  text: Then the priest shall examine the scaly infection on the seventh day[a], and if the scaly infection has not spread in the skin and its appearance is not deeper than the skin, the priest shall pronounce him clean[c][b]. He shall wash his clothes and be clean.
translation:
  language: hi
  text: सातवें दिन याजक उस पपड़ीदार चर्मरोग[a] की जाँच करे। यदि वह चर्मरोग त्वचा में न फैला हो और उसका रूप त्वचा से गहरा दिखाई न देता हो[b], तो याजक उस व्यक्ति को शुद्ध घोषित करे[c]। वह अपने वस्त्र धोए, और शुद्ध हो।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द नेतेक एक विशेष चर्म-स्थिति को दर्शाता है; इसका ठीक आधुनिक चिकित्सकीय नाम निश्चित नहीं है। आसपास के संदर्भ में इसका संबंध सिर या दाढ़ी के बालों वाले भाग से हो सकता है। इसे 'खुजली' या पारंपरिक 'स्कैल' भी समझा गया है।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक अर्थ, “उसका रूप त्वचा से गहरा नहीं है।” यह याजकीय जाँच का एक मानदंड था—प्रभावित भाग आसपास की त्वचा से धँसा हुआ दिखाई नहीं देता था।
    reason: cultural_note
  - marker: c
    text: अर्थात याजक उसके शुद्ध होने की आधिकारिक घोषणा करे; इसका अर्थ यह नहीं कि याजक ने रोग को ठीक किया।
    reason: alternative_reading
lexical_decisions:
- source_word: נֶתֶק
  choice: सिर या दाढ़ी का चर्मरोग
  rationale: इस अध्याय में यह शब्द सिर या दाढ़ी के बालों वाले भाग की एक विशिष्ट त्वचा-समस्या को दर्शाता है। आधुनिक रोग का निश्चित नाम थोपे बिना संदर्भ स्पष्ट किया गया है।
- source_word: פָשָׂה
  choice: फैला हो
  rationale: जाँच के संदर्भ में क्रिया त्वचा पर रोग के आगे फैलने को व्यक्त करती है।
- source_word: בָּעוֹר
  choice: त्वचा में
  rationale: इब्रानी पूर्वसर्ग और अध्याय की निदान-संबंधी भाषा के अनुरूप।
- source_word: מַרְאֵהוּ אֵינֶנּוּ עָמֹק מִן הָעוֹר
  choice: वह त्वचा से गहरा दिखाई न देता हो
  rationale: מַרְאֵהוּ दृश्य रूप का संकेत देता है; अनुवाद यह स्पष्ट रखता है कि यह निरीक्षण में दिखाई देने वाला मानदंड है, आधुनिक चिकित्सकीय निष्कर्ष नहीं।
- source_word: וְטִהַר אֹתוֹ הַכֹּהֵן
  choice: याजक उस व्यक्ति को शुद्ध घोषित करे
  rationale: यहाँ याजक शुद्धता की आधिकारिक स्थिति निर्धारित करता है; वह रोग को चिकित्सकीय रूप से ठीक नहीं करता।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: वह अपने वस्त्र धोए
  rationale: विधिक-धार्मिक संदर्भ के अनुकूल स्वाभाविक और गरिमापूर्ण हिन्दी।
- source_word: וְטָהֵר
  choice: और तब शुद्ध होगा
  rationale: वस्त्र धोने के बाद प्राप्त होने वाली शुद्ध स्थिति व्यक्त होती है; 'तब' क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: साधारण देखने के बजाय याजक द्वारा की जाने वाली औपचारिक जाँच का भाव।
- source_word: וְהִנֵּה
  choice: यदि
  rationale: निरीक्षण में पाई गई स्थिति विधिक शर्त का काम करती है; हिन्दी में 'यदि' इसे स्वाभाविक रूप से व्यक्त करता है।
theological_decisions:
- issue: शुद्धता-विधान में याजक की भूमिका
  choice: याजक उस व्यक्ति को शुद्ध घोषित करता है।
  alternative: याजक उसे शुद्ध करता है।
  rationale: इस विधिक संदर्भ में טהר शुद्धता की स्थिति पर आधिकारिक निर्णय को दर्शाता है। यह अनुवाद याजक द्वारा उपचार या रहस्यमय ढंग से शुद्ध किए जाने का अनावश्यक अर्थ नहीं जोड़ता।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और गरिमापूर्ण शैली रखी गई है। 'याजक', 'शुद्ध घोषित करे' और 'वस्त्र' लैव्यव्यवस्था के धार्मिक-विधिक संदर्भ को स्पष्ट रखते हैं। विशिष्ट रोग की आधुनिक पहचान नहीं थोपी गई; मुख्य पाठ में उसके शारीरिक स्थान को स्पष्ट कर सामान्य पाठक के लिए अर्थ सुगम बनाया गया है।
