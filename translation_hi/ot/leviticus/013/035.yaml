base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/035.yaml
  text: But if the scaly eruption does spread in the skin after his cleansing,[a]
translation:
  language: hi
  text: लेकिन यदि उसके शुद्ध ठहराए जाने के बाद वह पपड़ीदार चकत्ता त्वचा पर सचमुच फैल जाए,[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द सिर या दाढ़ी के क्षेत्र में होने वाली उस विशेष त्वचा-दशा को दर्शाता है जिसका वर्णन इस अध्याय में है; इसमें संभवतः पपड़ी पड़ना और बाल झड़ना शामिल था। इसका अनुवाद ‘खाज’ भी किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: लेकिन यदि
  rationale: संयोजक और शर्तसूचक पद निरीक्षण की प्रक्रिया में एक विपरीत स्थिति प्रस्तुत करते हैं; आधुनिक हिन्दी में ‘लेकिन यदि’ इस संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: פָּשֹׂה יִפְשֶׂה
  choice: सचमुच फैल जाए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute फैलने की क्रिया पर बल देता है। ‘सचमुच’ उस बल को बनाए रखता है, पर लगातार फैलते रहने का अतिरिक्त अर्थ नहीं जोड़ता।
- source_word: הַנֶּתֶק
  choice: वह पपड़ीदार चकत्ता
  rationale: यह लैव्यव्यवस्था 13 में सिर या दाढ़ी के क्षेत्र की एक विशिष्ट दशा है, जिसका संबंध पपड़ी और प्रभावित बालों से है। ‘पपड़ीदार चकत्ता’ आधुनिक पाठक के लिए दृश्य लक्षण को स्पष्ट करता है, जबकि केवल ‘खाज’ खुजली की अनुभूति का भ्रामक संकेत दे सकता है।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: עוֹר का अर्थ ‘त्वचा’ है। यद्यपि इब्रानी पूर्वसर्ग का शाब्दिक रूप ‘में’ हो सकता है, हिन्दी में किसी चकत्ते के फैलने के लिए ‘त्वचा पर’ अधिक स्वाभाविक है।
- source_word: אַחֲרֵי טָהֳרָתוֹ
  choice: उसके शुद्ध ठहराए जाने के बाद
  rationale: इस विधिक और अनुष्ठानिक निरीक्षण-संदर्भ में यह पद व्यक्ति के शुद्ध घोषित किए जाने की ओर संकेत करता है। यह अनुवाद नैतिक शुद्धि या उपचार का अनावश्यक अर्थ जोड़ने से बचता है।
theological_decisions:
- issue: טָהֳרָתוֹ में शुद्धता का आशय
  choice: शुद्ध ठहराए जाने के बाद
  alternative: उसकी शुद्धि के बाद
  rationale: संदर्भ याजकीय निरीक्षण और शुद्ध घोषित किए जाने की स्थिति से जुड़ा है। चुना हुआ रूप इसे पाप से नैतिक शुद्धि या रोग के उपचार के रूप में निर्धारित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक संदर्भ के अनुरूप रखी गई है। ‘पपड़ीदार चकत्ता’ सामान्य पाठक के लिए समझने योग्य है, और ‘शुद्ध ठहराया जाना’ अनुष्ठानिक घोषणा को नैतिक अर्थ से अलग रखता है।
