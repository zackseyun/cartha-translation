source:
  edition: WLC
  text: וְ/כִֽי יִהְיֶ֤ה בַ/קָּרַ֨חַת֙ א֣וֹ בַ/גַּבַּ֔חַת נֶ֖גַע לָבָ֣ן אֲדַמְדָּ֑ם צָרַ֤עַת פֹּרַ֨חַת֙ הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/042.yaml
  text: But if there is on the bald head or on the bald forehead a white-reddish diseased spot[b][a], it is a spreading skin disease on his bald head or on his bald forehead.
translation:
  language: hi
  text: पर यदि सिर के पिछले गंजे भाग या माथे की ओर के गंजे भाग पर सफ़ेद-लाल रंग का रोग-चिह्न[b] हो, तो वह उसके सिर के पिछले गंजे भाग या माथे की ओर के गंजे भाग पर फैलता हुआ चर्मरोग[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़।” इब्रानी शब्द त्वचा के कई प्रकार के रोगों या अवस्थाओं के लिए प्रयुक्त होता है; इसे केवल आधुनिक हैन्सन रोग के समान नहीं समझना चाहिए।'
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त दोनों इब्रानी शब्द सिर के पिछले भाग के गंजेपन और माथे की ओर के गंजेपन में भेद करते हैं।
    reason: cultural_note
lexical_decisions:
- source_word: וְכִי
  choice: पर यदि
  rationale: यह पिछले पद के सामान्य कथन के विपरीत एक शर्तयुक्त स्थिति प्रस्तुत करता है; ‘पर यदि’ विरोध और शर्त दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קָרַחַת / גַּבַּחַת
  choice: सिर के पिछले गंजे भाग / माथे की ओर के गंजे भाग
  rationale: दोनों इब्रानी शब्द क्रमशः सिर के पीछे और आगे की ओर के गंजेपन में भेद करते हैं; हिन्दी में अर्थ को स्पष्ट रखते हुए यही भेद व्यक्त किया गया है।
- source_word: נֶגַע
  choice: रोग-चिह्न
  rationale: लैव्यव्यवस्था 13 में यह जाँच के योग्य दिखाई देने वाले प्रभावित चिह्न को दर्शाता है; ‘रोग-चिह्न’ आधुनिक चिकित्सकीय निदान थोपे बिना अर्थ देता है।
- source_word: לָבָן אֲדַמְדָּם
  choice: सफ़ेद-लाल रंग का
  rationale: इब्रानी विशेषणों का क्रम बनाए रखते हुए चिह्न के मिश्रित रंग का स्वाभाविक हिन्दी वर्णन करता है।
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: यह इब्रानी शब्द आधुनिक हैन्सन रोग तक सीमित नहीं है, बल्कि त्वचा की अनेक दशाओं के लिए प्रयुक्त होता है; इसलिए व्यापक और समझने योग्य शब्द चुना गया है।
- source_word: פֹּרַחַת
  choice: फैलता हुआ
  rationale: פרח का कृदन्त यहाँ रोग के उभरने या फैलने को दर्शाता है; ‘फैलता हुआ’ संदर्भ में स्पष्ट और चिकित्सकीय रूप से तटस्थ है।
theological_decisions:
- issue: צָרַעַת को पारंपरिक ‘कोढ़’ कहना या व्यापक त्वचा-दशा के रूप में प्रस्तुत करना
  choice: मुख्य पाठ में ‘चर्मरोग’
  alternative: ‘कोढ़’
  rationale: ‘कोढ़’ आधुनिक पाठक को विशेष रूप से हैन्सन रोग समझा सकता है, जबकि मूल शब्द का अर्थ अधिक व्यापक है। पारंपरिक विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। कानूनी-विधिक शैली की शर्त और निदानात्मक कथन सुरक्षित हैं। दोनों प्रकार के गंजेपन का मूलभाषीय भेद मुख्य पाठ में स्पष्ट किया गया है; पादटिप्पणी-चिह्न उसी क्रम में लगाए गए हैं जिस पदांश को वे समझाते हैं।
