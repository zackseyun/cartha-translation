    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: घाव
  rationale: लैव्यव्यवस्था 13 के जाँच-संदर्भ में यह त्वचा पर दिखाई देने वाले रोगग्रस्त चिह्न या घाव को दर्शाता है; ‘घाव’ सामान्य आधुनिक हिन्दी में स्वाभाविक है।
- source_word: צָרַעַת
  choice: चर्म-रोग
  rationale: यह इब्रानी शब्द आधुनिक कुष्ठ रोग तक सीमित नहीं, बल्कि त्वचा की कई गंभीर दशाओं को समेट सकता है; इसलिए ‘चर्म-रोग’ चिकित्सा की अनावश्यक विशिष्टता से बचता है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ यह व्यवस्था के एक मामले की परिस्थिति प्रस्तुत करता है; हिन्दी में ‘जब’ विधिक क्रम को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: תִהְיֶה
  choice: हो
  rationale: मूल क्रिया साधारण ‘होना’ है; इसे ‘दिखाई दे’ कहना मूल से अतिरिक्त अर्थ जोड़ता।
- source_word: בְּאָדָם
  choice: किसी मनुष्य को
  rationale: אָדָם यहाँ किसी मानव व्यक्ति के लिए सामान्य एकवचन है। हिन्दी में रोग या घाव होने के साथ ‘किसी मनुष्य को’ अधिक स्वाभाविक है, जबकि संदर्भ में किसी विशेष लिंग को सीमित नहीं करता।
- source_word: וְהוּבָא
  choice: तो उसे ... लाया जाए
  rationale: कर्मवाच्य रूप अगले प्रक्रियात्मक कदम को बताता है; ‘लाया जाए’ विधिक निर्देश और मूल के कर्मवाच्य दोनों को बनाए रखता है।
- source_word: אֶל הַכֹּהֵן
  choice: याजक के पास
  rationale: निश्चित पद उस याजक की ओर संकेत करता है जो जाँच करेगा; हिन्दी में व्यक्ति के सामने जाँच हेतु लाने के लिए ‘के पास’ स्वाभाविक है।
theological_decisions:
- issue: צָרַעַת को आधुनिक कुष्ठ रोग के समान मानना
  choice: चर्म-रोग
  alternative: कुष्ठ रोग
  rationale: मूल पद का अर्थ आधुनिक हैनसेन रोग से व्यापक हो सकता है। ‘चर्म-रोग’ इस ऐतिहासिक और चिकित्सकीय अनिश्चितता को बनाए रखता है।
- issue: אָדָם का सामान्य एकवचन
  choice: मनुष्य
  alternative: पुरुष
  rationale: यह व्यवस्था किसी मानव व्यक्ति की दशा बताती है, केवल वयस्क पुरुष की नहीं; ‘मनुष्य’ मूल के सामान्य मानवीय संदर्भ को स्पष्ट रखता है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। ‘चर्म-रोग का घाव’ נֶגַע צָרַעַת के दोनों पदों को व्यक्त करता है और पुरातन अथवा भ्रामक चिकित्सकीय शब्दावली से बचता है।
