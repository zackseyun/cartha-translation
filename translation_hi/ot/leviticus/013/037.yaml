  text: וְ/אִם בְּ/עֵינָי/ו֩ עָמַ֨ד הַ/נֶּ֜תֶק וְ/שֵׂעָ֨ר שָׁחֹ֧ר צָֽמַח בּ֛/וֹ נִרְפָּ֥א הַ/נֶּ֖תֶק טָה֣וֹר ה֑וּא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/037.yaml
  text: But if in his sight the scaly eruption has remained unchanged[a], and black hair has grown in it, the scaly eruption is healed; he is clean, and the priest shall pronounce him clean.
translation:
  language: hi
  text: परन्तु यदि उसकी दृष्टि में वह पपड़ीदार चकत्ता ज्यों का त्यों बना हुआ है और उसमें काले बाल उग आए हैं, तो वह पपड़ीदार चकत्ता ठीक हो गया है। वह शुद्ध है, और याजक उसे शुद्ध ठहराएगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याजक उसे शुद्ध घोषित करेगा।” इब्रानी क्रिया का अनुवाद “शुद्ध करेगा” भी हो सकता है, पर यहाँ यह दशा ठीक हो जाने के बाद याजक के औपचारिक निर्णय को सूचित करती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בְּעֵינָיו
  choice: उसकी दृष्टि में
  rationale: यह निरीक्षण करने वाले के आकलन को व्यक्त करने वाला इब्रानी मुहावरा है। सर्वनाम की मूल अस्पष्टता बनाए रखते हुए निरीक्षण का भाव स्पष्ट रखा गया है।
- source_word: עָמַד
  choice: ज्यों का त्यों बना हुआ है
  rationale: इस निदानात्मक प्रसंग में क्रिया का अर्थ है कि चकत्ता फैला या बदला नहीं, बल्कि अपनी अवस्था में स्थिर रहा।
- source_word: הַנֶּתֶק
  choice: पपड़ीदार चकत्ता
  rationale: यह सिर या दाढ़ी के क्षेत्र की एक विशिष्ट त्वचा-विकृति को सूचित करता है। यह पद आधुनिक हिन्दी में समझने योग्य है और केवल खुजली का अर्थ देने से बचता है।
- source_word: שֵׂעָר שָׁחֹר
  choice: काले बाल
  rationale: यह इब्रानी वाक्यांश का सीधा और स्वाभाविक अनुवाद है।
- source_word: צָמַח בּוֹ
  choice: उसमें ... उग आए हैं
  rationale: प्रभावित स्थान के भीतर बाल उगने की बात को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: נִרְפָּא
  choice: ठीक हो गया है
  rationale: निष्क्रिय/अवस्थात्मक अर्थ को सरल आधुनिक हिन्दी में व्यक्त करता है; रोगग्रस्त चकत्ते के स्वस्थ हो जाने का संकेत है।
- source_word: טָהוֹר הוּא
  choice: वह शुद्ध है
  rationale: लैव्यव्यवस्था के अनुष्ठानिक शुद्धता-संबंधी विधान में व्यक्ति के लिए ‘शुद्ध’ मानक और प्रसंगानुकूल शब्द है।
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: और याजक उसे शुद्ध ठहराएगा
  rationale: चकत्ते के पहले ही ठीक हो जाने के बाद याजक के औपचारिक निर्णय को दर्शाता है, न कि उसके द्वारा रोग ठीक किए जाने को।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता के विषय में याजक की कार्रवाई का स्वरूप
  choice: याजक उसे शुद्ध ठहराएगा
  alternative: याजक उसे शुद्ध करेगा
  rationale: पद पहले चकत्ते के ठीक हो जाने की बात कहता है और फिर याजक के निर्णय की। ‘शुद्ध ठहराएगा’ इस विधिक-अनुष्ठानिक घोषणा को व्यक्त करता है और यह संकेत नहीं देता कि याजक ने रोग को ठीक किया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘पपड़ीदार चकत्ता’ तकनीकी त्वचा-दशा को स्पष्ट करता है; ‘शुद्ध ठहराएगा’ याजकीय निर्णय और शारीरिक उपचार के बीच भेद बनाए रखता है।
