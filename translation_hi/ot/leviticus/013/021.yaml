base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/021.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in it, and it is not deeper than the skin, but it is dim, then the priest shall isolate him for seven days.
translation:
  language: hi
  text: परन्तु यदि याजक उस निशान की जाँच करे और देखे कि उसमें सफेद बाल नहीं हैं, वह चमड़ी से धँसा हुआ नहीं है और फीका है, तो याजक उस व्यक्ति को सात दिन तक अलग रखेगा[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उस व्यक्ति को सात दिन तक एकांत में रखेगा।’ हिब्रू क्रिया निरीक्षण के लिए किसी को अलग रखने या बंद रखने का भाव देती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले निदान के विपरीत एक वैकल्पिक स्थिति प्रस्तुत करता है; इसलिए विरोधसूचक और शर्तसूचक दोनों भाव रखे गए हैं।
- source_word: יִרְאֶנָּה
  choice: उस निशान की जाँच करे
  rationale: मूल क्रिया का शाब्दिक अर्थ ‘देखना’ है, पर इस याजकीय निरीक्षण के संदर्भ में यह निदान के लिए ध्यानपूर्वक जाँचने को दर्शाती है। स्त्रीलिंग कर्म-सर्वनाम का संदर्भ प्रभावित निशान से स्पष्ट किया गया है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था में निरीक्षण करने वाले पुरोहित के लिए प्रचलित और गरिमापूर्ण हिन्दी पद।
- source_word: וְהִנֵּה
  choice: और देखे कि
  rationale: निरीक्षण के परिणाम पर ध्यान खींचने वाले हिब्रू सूत्र को स्वाभाविक हिन्दी वाक्य-विन्यास में रखा गया है।
- source_word: אֵין בָּהּ שֵׂעָר לָבָן
  choice: उसमें सफेद बाल नहीं हैं
  rationale: मूल के निदान-संबंधी प्रत्यक्ष लक्षण को निकटता से व्यक्त करता है।
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: वह चमड़ी से गहरा भी नहीं है
  rationale: שְׁפָלָה का मूल भाव नीचा या धँसा हुआ है; त्वचा के निशान के संदर्भ में ‘चमड़ी से गहरा’ सहज और अर्थसंगत है।
- source_word: וְהִיא כֵהָה
  choice: बल्कि फीका है
  rationale: כֵהָה निशान की मंद, कम स्पष्ट या फीकी दिखावट बताता है; ‘फीका’ आधुनिक हिन्दी में स्वाभाविक है और दृश्य गुण को बनाए रखता है।
- source_word: וְהִסְגִּירוֹ
  choice: उस व्यक्ति को सात दिन तक अलग रखेगा
  rationale: पुल्लिंग प्रत्यय निशान नहीं, व्यक्ति की ओर संकेत करता है। क्रिया निरीक्षण के लिए उसे दूसरों से अलग रखने को दर्शाती है; ‘अलग रखेगा’ अनावश्यक आधुनिक चिकित्सकीय विशिष्टता से बचता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: अवधि का सीधा और स्वाभाविक हिन्दी रूप।
