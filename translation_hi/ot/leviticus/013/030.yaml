base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/030.yaml
  text: And the priest shall examine the diseased area[a], and behold, its appearance is deeper than the skin, and in it is thin yellow hair, then the priest shall pronounce him unclean; it is an itch[b], a skin disease of the head or of the beard.
translation:
  language: hi
  text: और याजक उस प्रभावित स्थान[a] को जाँचे। यदि वह त्वचा से अधिक धँसा हुआ दिखाई दे और उसमें बारीक पीले बाल हों, तो याजक उस व्यक्ति को अशुद्ध ठहराए। यह सिर या दाढ़ी का खाज है, अर्थात एक त्वचा-रोग[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द उस दिखाई देने वाले प्रभावित स्थान के लिए है जिसकी जाँच की जाती थी; इससे किसी निश्चित आधुनिक रोग का निदान नहीं होता।
    reason: lexical_alternative
  - marker: b
    text: ‘खाज’ इब्रानी נֶתֶק के लिए एक अनुमानित समतुल्य है; सटीक आधुनिक चिकित्सकीय स्थिति अनिश्चित है। “त्वचा-रोग” इब्रानी צָרַעַת का व्यापक शब्द है और आवश्यक नहीं कि आधुनिक कोढ़ (हैन्सन रोग) ही हो।
    reason: cultural_note
lexical_decisions:
- source_word: נֶגַע
  choice: प्रभावित स्थान
  rationale: यहाँ शब्द उस दिखाई देने वाले स्थान को दर्शाता है जिसकी याजक जाँच करता है; यह किसी निश्चित आधुनिक रोग-निदान को आरोपित नहीं करता।
- source_word: מַרְאֵהוּ עָמֹק מִן־הָעוֹר
  choice: वह त्वचा से गहरा दिखाई दे
  rationale: इब्रानी के निदान-संबंधी वर्णन को स्वाभाविक हिन्दी में रखते हुए घाव के धँसे या त्वचा के नीचे तक प्रतीत होने का भाव सुरक्षित रहता है।
- source_word: שֵׂעָר צָהֹב דַּק
  choice: बारीक पीले बाल
  rationale: צָהֹב के पीले रंग और דַּק के बारीक अथवा पतले होने—दोनों लक्षणों को स्पष्ट रूप से रखा गया है।
- source_word: וְטִמֵּא אֹתוֹ
  choice: उस व्यक्ति को अशुद्ध ठहराए
  rationale: याजक अशुद्धता उत्पन्न नहीं करता, बल्कि विधिक-अनुष्ठानिक निर्णय सुनाता है; इसलिए ‘अशुद्ध ठहराए’ उपयुक्त है।
- source_word: נֶתֶק
  choice: खाज रोग
  rationale: यह सिर या दाढ़ी पर होने वाली एक विशिष्ट व्याधि का नाम है, पर इसका सटीक आधुनिक चिकित्सकीय समकक्ष अनिश्चित है; ‘खाज रोग’ सामान्य पाठक के लिए सुबोध है और अनिश्चितता पादटिप्पणी में बताई गई है।
- source_word: צָרַעַת
  choice: रोग
  rationale: यहाँ यह נֶתֶק को सिर या दाढ़ी से संबंधित व्यापक त्वचा-व्याधि की श्रेणी में रखता है। ‘कोढ़’ आधुनिक हैन्सन रोग का भ्रामक संकेत दे सकता है; संयुक्त पद ‘खाज रोग’ प्रसंग में पर्याप्त है।
- source_word: הָרֹאשׁ אוֹ הַזָּקָן
  choice: सिर या दाढ़ी का
  rationale: मूल के दोनों स्थानों को बिना ‘खोपड़ी’ जैसी अतिरिक्त व्याख्या जोड़े निकटता से व्यक्त करता है।
