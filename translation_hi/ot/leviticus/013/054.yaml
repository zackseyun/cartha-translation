  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। विधिक शैली के लिए ‘आज्ञा दे’ और ‘अलग रखे’ का प्रयोग किया गया है। मूल की व्यापक वस्तु-संज्ञा और अनिर्दिष्ट धोने वालों को सुरक्षित रखा गया है।
