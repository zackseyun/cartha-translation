  text: Then the priest shall command them to wash the thing in which the infection is[b][a], and he shall quarantine it for seven days a second time.
translation:
  language: hi
  text: तब याजक आज्ञा दे कि जिस वस्तु में वह दाग हो, उसे धोया जाए; फिर वह उसे दूसरी बार सात दिन के लिए अलग रखे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְצִוָּה הַכֹּהֵן
  choice: तब याजक आज्ञा दे
  rationale: वाव + पूर्ण क्रिया यहाँ विधिक निर्देशों की क्रमिक कड़ी है; आधुनिक हिन्दी में ‘तब ... आज्ञा दे’ प्रक्रिया और आदेशात्मक भाव दोनों को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וְכִבְּסוּ
  choice: उसे धोया जाए
  rationale: इब्रानी में कर्ता अनिर्दिष्ट बहुवचन है। हिन्दी का कर्मवाच्य अज्ञात कार्यकर्ताओं को जोड़े बिना याजक की आज्ञा का आशय स्पष्ट रखता है।
- source_word: אֵת אֲשֶׁר בּוֹ הַנָּגַע
  choice: जिस वस्तु पर वह दाग है
  rationale: सापेक्ष वाक्यांश प्रसंग में जाँच के अधीन कपड़े या चमड़े की वस्तु को व्यापक रूप से सूचित करता है। ‘वस्तु’ इसकी अनिर्दिष्टता बनाए रखता है; वस्त्र के संदर्भ में हिन्दी में ‘पर ... दाग’ स्वाभाविक है।
- source_word: הַנֶּגַע
  choice: दाग
  rationale: इस प्रसंग में यह शब्द वस्तु पर दिखाई देने वाले प्रभावित चिह्न या विकृति को बताता है। ‘दाग’ निर्जीव वस्तु के लिए सहज है और ‘संक्रमण’ जैसी आधुनिक चिकित्सीय निश्चितता आरोपित नहीं करता।
- source_word: וְהִסְגִּירוֹ
  choice: फिर वह उसे ... अलग रखे
  rationale: मूल क्रिया का अर्थ बंद करके निरीक्षण हेतु पृथक रखना है। ‘अलग रखे’ वस्तु के लिए स्वाभाविक है और आधुनिक रोग-निरोध संबंधी ‘क्वारंटीन’ की अनावश्यक छाया से बचता है।
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: दूसरी बार सात दिन के लिए
  rationale: यह स्पष्ट करता है कि सात दिन की पृथक रखने की अवधि दोहराई जाती है।
