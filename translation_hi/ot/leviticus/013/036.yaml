base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/036.yaml
  text: And if the priest examines him[a], and behold, the scaly infection has spread in the skin, the priest need not look for the yellow hair; he is unclean.
translation:
  language: hi
  text: और यदि याजक उसकी जाँच करे और देखे कि पपड़ीदार रोग[a] त्वचा में फैल गया है, तो याजक को पीले बालों को ढूँढ़ने की आवश्यकता नहीं है; वह अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द सिर या दाढ़ी के बालों वाले भाग में होने वाली एक पपड़ीदार त्वचा-दशा को सूचित करता है; इसका अनुवाद “खुजली” भी किया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: यदि याजक उसकी जाँच करे
  rationale: याजकीय निरीक्षण के प्रसंग में ראה केवल देखने के बजाय जाँच करने का अर्थ देता है; पूर्ववर्ती विधिक संदर्भ के कारण वाक्य को शर्त के रूप में व्यक्त किया गया है।
- source_word: וְהִנֵּה
  choice: और देखे कि
  rationale: यह निरीक्षण में सामने आई स्थिति की ओर ध्यान दिलाता है; आधुनिक हिन्दी में यह 'और देखो' से अधिक स्वाभाविक ढंग से वाक्य में जुड़ता है।
- source_word: פָּשָׂה
  choice: फैल गया है
  rationale: त्वचा-संबंधी चिह्न के विस्तार के लिए सीधा और प्रचलित हिन्दी रूप।
- source_word: הַנֶּתֶק
  choice: खोपड़ी या दाढ़ी का पपड़ीदार रोग
  rationale: נתק सिर या दाढ़ी के बालों वाले भाग में होने वाली विशिष्ट दशा है; यह अनुवाद उसके स्थान और पपड़ीदार स्वरूप को स्पष्ट करता है, जबकि आधुनिक चिकित्सकीय निदान थोपने से बचता है।
- source_word: בָּעוֹר
  choice: त्वचा में
  rationale: इब्रानी पूर्वसर्ग का निकट और हिन्दी में स्वीकार्य प्रतिरूप।
- source_word: לֹא יְבַקֵּר
  choice: खोज करने की आवश्यकता नहीं
  rationale: यहाँ בקר किसी निदान-चिह्न को ध्यान से ढूँढ़ने या जाँचने का बोध देता है; फैलाव सिद्ध हो जाने पर आगे यह चिह्न खोजना आवश्यक नहीं।
- source_word: לַשֵּׂעָר הַצָּהֹב
  choice: पीले बाल
  rationale: अध्याय में पहले उल्लिखित निदान-चिह्न का सीधा अनुवाद।
- source_word: טָמֵא הוּא
  choice: वह अशुद्ध है
  rationale: सर्वनाम जाँचे जा रहे व्यक्ति की ओर संकेत करता है; 'अशुद्ध' लैव्यव्यवस्था की धार्मिक-विधिक स्थिति को व्यक्त करता है, नैतिक दोष को नहीं।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में טָמֵא का स्वरूप
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: '''अशुद्ध'' धार्मिक-विधिक स्थिति को स्वाभाविक हिन्दी में व्यक्त करता है और इसे अनिवार्यतः नैतिक पाप नहीं ठहराता।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। 'याजक' और 'अशुद्ध' जैसे स्थापित बाइबलीय शब्द बनाए गए हैं; रोग के लिए कोई अनिश्चित आधुनिक चिकित्सकीय नाम नहीं लगाया गया।
