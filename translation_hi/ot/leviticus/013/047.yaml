id: LEV.13.47
reference: Leviticus 13:47
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/בֶּ֕גֶד כִּֽי יִהְיֶ֥ה ב֖/וֹ נֶ֣גַע צָרָ֑עַת בְּ/בֶ֣גֶד צֶ֔מֶר א֖וֹ בְּ/בֶ֥גֶד פִּשְׁתִּֽים־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/047.yaml
  text: And if a garment has in it an outbreak of leprosy[a], in a wool garment or in a linen garment,
translation:
  language: hi
  text: और यदि किसी वस्त्र में—चाहे वह ऊनी वस्त्र हो या सन का वस्त्र—कोढ़ का दाग़[a] हो,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी ‘त्साराअत’ का पारंपरिक अनुवाद ‘कोढ़’ है। यहाँ यह केवल आधुनिक हैन्सन रोग नहीं, बल्कि वस्त्रों में दिखाई देने वाली रोगग्रस्त या दूषित दशाओं सहित एक व्यापक श्रेणी को सूचित करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: किसी वस्त्र
  rationale: בֶּגֶד का अर्थ वस्त्र या पहनने की वस्तु है। यहाँ व्यवस्था में एक सामान्य स्थिति प्रस्तुत की गई है, इसलिए हिन्दी में ‘किसी वस्त्र’ स्वाभाविक है।
- source_word: כִּי יִהְיֶה בוֹ
  choice: यदि ... में ... हो
  rationale: व्यवस्था-संबंधी प्रसंग में כִּי के साथ अपूर्ण क्रिया एक संभावित स्थिति प्रस्तुत करती है; ‘यदि’ और ‘में ... हो’ शर्त तथा स्थान—दोनों भावों को स्पष्ट रखते हैं।
- source_word: נֶגַע צָרָעַת
  choice: कोढ़ का दाग़
  rationale: נֶגַע यहाँ जाँच योग्य दिखाई देने वाले दाग़ या प्रभावित स्थान को सूचित करता है। ‘कोढ़’ צָרָעַת का परिचित पारंपरिक अनुवाद है, पर आधुनिक हैन्सन रोग तक सीमित नहीं; इसलिए अर्थ-सीमा पादटिप्पणी में स्पष्ट की गई है।
- source_word: בְּבֶגֶד צֶמֶר
  choice: ऊनी वस्त्र
  rationale: צֶמֶר ऊन को सूचित करता है। हिन्दी में ‘ऊनी वस्त्र’ संक्षिप्त और स्वाभाविक है; पूरे वाक्य की ‘में’ संरचना इसके स्थानगत संबंध को बनाए रखती है।
- source_word: אוֹ בְּבֶגֶד פִּשְׁתִּים
  choice: या सन का वस्त्र
  rationale: פִּשְׁתִּים सन से बने कपड़े को सूचित करता है। ‘सन का वस्त्र’ सामान्य पाठक के लिए सामग्री का अर्थ स्पष्ट रखता है।
theological_decisions:
- issue: צָרָעַת को आधुनिक रोग-नाम मानने का प्रश्न
  choice: मुख्य पाठ में पारंपरिक ‘कोढ़’ रखा गया और पादटिप्पणी में उसका व्यापक लैव्यव्यवस्था-संबंधी अर्थ स्पष्ट किया गया।
  alternative: इसे केवल ‘हैन्सन रोग’ या ‘कुष्ठ रोग’ कहना।
  rationale: इस पद में दशा वस्त्र को प्रभावित करती है, इसलिए इब्रानी शब्द किसी एक आधुनिक चिकित्सीय निदान तक सीमित नहीं किया जा सकता।
translation_notes:
  register: भाषा आधुनिक, सहज और विधिक प्रसंग के अनुरूप गरिमापूर्ण रखी गई है। मध्यवर्ती वाक्यांश को डैश के भीतर रखकर ऊनी और सन के वस्त्र—दोनों विकल्प स्पष्ट किए गए हैं; पद अगले वाक्यांश से जुड़ता है, इसलिए अंत में अल्पविराम रखा गया है।
