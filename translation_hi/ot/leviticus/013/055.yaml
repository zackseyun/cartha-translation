  text: וְ/רָאָ֨ה הַ/כֹּהֵ֜ן אַחֲרֵ֣י הֻכַּבֵּ֣ס אֶת הַ/נֶּ֗גַע וְ֠/הִנֵּה לֹֽא הָפַ֨ךְ הַ/נֶּ֤גַע אֶת עֵינ/וֹ֙ וְ/הַ/נֶּ֣גַע לֹֽא פָשָׂ֔ה טָמֵ֣א ה֔וּא בָּ/אֵ֖שׁ תִּשְׂרְפֶ֑/נּוּ פְּחֶ֣תֶת הִ֔וא בְּ/קָרַחְתּ֖/וֹ א֥וֹ בְ/גַבַּחְתּֽ/וֹ׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/055.yaml
  text: Then the priest shall examine it after the diseased area has been washed[a], and if the diseased area has not changed its appearance and the diseased area has not spread, it is unclean. You shall burn it in the fire; it is a corrosive spot[c][b], whether on its worn side or on its bare side.
translation:
  language: hi
  text: तब याजक उस प्रभावित स्थान को धोए जाने के बाद उसकी जाँच करे। यदि उस प्रभावित स्थान का रूप नहीं बदला[a] और वह फैला भी नहीं, तो वह अशुद्ध है। उसे आग में जला देना; वह क्षयकारी दाग है[b], चाहे वह उसकी एक सतह पर हो या दूसरी पर[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसका रंग नहीं बदला।” हिब्रू मुहावरे का शाब्दिक अर्थ है “उसकी आँख नहीं बदली,” अर्थात उसका दिखाई देने वाला रूप नहीं बदला।
    reason: lexical_alternative
  - marker: b
    text: या “क्षयकारी विकार।” इस दुर्लभ हिब्रू शब्द का आशय सामग्री को नष्ट या क्षीण करने वाले विकार से है।
    reason: lexical_alternative
  - marker: c
    text: अंतिम पदबंध का अर्थ अनिश्चित है। शाब्दिक रूप से इसमें “उसकी गंजाहट” और “उसके माथे की गंजाहट” जैसे शब्द हैं; यहाँ संभवतः प्रभावित वस्तु की दो सतहों या पक्षों का संकेत है।
    reason: textual_or_exegetical_difficulty
lexical_decisions:
- source_word: וְרָאָה
  choice: तब ... जाँच करे
  rationale: याजकीय निदान के संदर्भ में क्रिया का अर्थ केवल देखना नहीं, बल्कि ध्यान से जाँच करना है; आरंभिक वाव को स्वाभाविक क्रमसूचक ‘तब’ से व्यक्त किया गया है।
- source_word: אַחֲרֵי הֻכַּבֵּס אֶת הַנֶּגַע
  choice: उस प्रभावित स्थान को धोए जाने के बाद
  rationale: हिब्रू में धुलाई निष्क्रिय रूप में है और उसका व्याकरणिक कर्म प्रभावित स्थान है; हिन्दी में निष्क्रियता स्पष्ट रखी गई है।
- source_word: הַנֶּגַע
  choice: प्रभावित स्थान
  rationale: यहाँ शब्द वस्त्र या चमड़े पर दिखने वाले विकारग्रस्त क्षेत्र को बताता है। ‘महामारी’ या किसी निश्चित आधुनिक रोग का संकेत देना अनुचित होगा।
- source_word: לֹא הָפַךְ ... אֶת עֵינוֹ
  choice: उस प्रभावित स्थान का रूप नहीं बदला
  rationale: ‘उसकी आँख नहीं बदली’ एक हिब्रू मुहावरा है, जिसका आशय दृश्य रूप और संभवतः रंग से है। ‘रूप’ मूल की अर्थ-व्याप्ति बनाए रखता है।
- source_word: וְהַנֶּגַע לֹא פָשָׂה
  choice: वह फैला भी नहीं
  rationale: पָשָׂה का इस अध्याय में सामान्य अर्थ किसी विकार का फैलना या बढ़ना है।
- source_word: טָמֵא הוּא
  choice: वह अशुद्ध है
  rationale: लैव्यव्यवस्था की शुद्धता-संबंधी विधियों में ‘अशुद्ध’ मानक और स्पष्ट हिन्दी शब्द है।
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: उसे आग में जला देना
  rationale: द्वितीय पुरुष एकवचन आदेश को हिन्दी के स्वाभाविक विधिक निर्देश के रूप में रखा गया है।
- source_word: פְּחֶתֶת
  choice: सामग्री को गलाने वाला दाग
  rationale: दुर्लभ संज्ञा किसी विनाशकारी, क्षयकारी विकार को बताती है। यह अनुवाद निश्चित आधुनिक निदान थोपे बिना वस्तु के बिगड़ने का भाव देता है।
- source_word: בְּקָרַחְתּוֹ אוֹ בְגַבַּחְתּוֹ
  choice: चाहे वह उसकी एक सतह पर हो या दूसरी पर
  rationale: शाब्दिक शब्द सिर के गंजे भाग और माथे की गंजाहट से संबंधित हैं, पर वस्त्र/चमड़े के संदर्भ में उनका सटीक भौतिक संकेत अनिश्चित है। मुख्य पाठ में सतहों का विरोध स्पष्ट रखा गया और कठिनाई पादटिप्पणी में बताई गई है।
