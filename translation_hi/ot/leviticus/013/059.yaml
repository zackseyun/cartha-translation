language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: זֹ֠את תּוֹרַ֨ת נֶֽגַע צָרַ֜עַת בֶּ֥גֶד הַ/צֶּ֣מֶר א֣וֹ הַ/פִּשְׁתִּ֗ים א֤וֹ הַ/שְּׁתִי֙ א֣וֹ הָ/עֵ֔רֶב א֖וֹ כָּל כְּלִי ע֑וֹר לְ/טַהֲר֖/וֹ א֥וֹ לְ/טַמְּאֽ/וֹ־׀־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/059.yaml
  text: This is the law for an outbreak of leprous disease in a wool garment or a linen garment[a], or in the warp or the woof, or in any leather article, for pronouncing it clean or pronouncing it unclean.
translation:
  language: hi
  text: यह ऊनी वस्त्र या सन के वस्त्र में, ताने या बाने में, अथवा चमड़े की किसी वस्तु में कुष्ठ-जैसे दाग[a] के विषय में व्यवस्था है—उसे शुद्ध या अशुद्ध ठहराने के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द צָרַעַת मनुष्यों के साथ-साथ वस्त्रों और चमड़े की वस्तुओं पर दिखाई देने वाली अशुद्धता की एक श्रेणी के लिए भी आता है; इसका अर्थ केवल आधुनिक हैन्सेन रोग नहीं है।
    reason: lexical_and_cultural_clarification
lexical_decisions:
- source_word: תּוֹרַת
  choice: के विषय में व्यवस्था
  rationale: यहाँ תּוֹרָה पहले बताए गए मामलों को नियंत्रित करने वाली विधि या नियम का सार प्रस्तुत करता है; ‘व्यवस्था’ विधिक भाव को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: נֶגַע צָרַעַת
  choice: कुष्ठ-जैसा दाग
  rationale: נֶגַע दिखाई देने वाले प्रभावित दाग को और צָרַעַת लैव्यव्यवस्था की व्यापक अशुद्धता-श्रेणी को दर्शाता है। ‘कुष्ठ-जैसा’ पारंपरिक संबंध बनाए रखता है, पर इसे आधुनिक हैन्सेन रोग के समान नहीं ठहराता और वस्त्रों पर लागू होने योग्य रहता है।
- source_word: בֶּגֶד הַצֶּמֶר ... הַפִּשְׁתִּים
  choice: ऊनी या सन के वस्त्र
  rationale: समानांतर रचना में दोनों पदार्थों से बने वस्त्र अभिप्रेत हैं; ‘सन का वस्त्र’ मूल के flax/linen अर्थ को सरल आधुनिक हिन्दी में रखता है।
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: ताने या बाने
  rationale: ये बुनाई के क्रमशः लंबवत और आड़े धागों के प्रचलित हिन्दी तकनीकी शब्द हैं।
- source_word: כָּל כְּלִי עוֹר
  choice: चमड़े की किसी वस्तु
  rationale: כְּלִי व्यापक अर्थ में सामान, उपकरण या वस्तु है; यह अनुवाद अनावश्यक रूप से किसी खास प्रकार की चीज़ तक सीमित नहीं करता।
- source_word: לְטַהֲרוֹ אוֹ לְטַמְּאוֹ
  choice: उसे शुद्ध या अशुद्ध ठहराने के लिए
  rationale: सन्दर्भ में यह भौतिक सफाई नहीं, बल्कि याजकीय निर्णय द्वारा अनुष्ठानिक स्थिति निर्धारित करना है; ‘ठहराना’ उस न्यायिक भाव को व्यक्त करता है।
theological_decisions:
- issue: वस्त्र और चमड़े पर लागू צָרַעַת का अनुवाद
  choice: कुष्ठ-जैसा दाग
  alternative: कोढ़; कुष्ठ रोग; अशुद्ध करने वाला दाग
  rationale: इब्रानी पद आधुनिक चिकित्सकीय हैन्सेन रोग तक सीमित नहीं है और यहाँ निर्जीव वस्तुओं पर लागू होता है। ‘कुष्ठ-जैसा दाग’ पारंपरिक पहचान को बनाए रखते हुए झूठी चिकित्सकीय निश्चितता से बचता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधिक और अनुष्ठानिक प्रसंग के अनुरूप गरिमापूर्ण, किंतु सामान्य पाठक के लिए सहज। ‘ताना-बाना’ के प्रचलित शब्द युग्म को अलग-अलग पदों के रूप में रखा गया है।
