  text: וְ/אִ֣ם יִרְאֶ֣/נָּה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה אֵֽין בַּ/בֶּהֶ֨רֶת֙ שֵׂעָ֣ר לָבָ֔ן וּ/שְׁפָלָ֥ה אֵינֶ֛/נָּה מִן הָ/ע֖וֹר וְ/הִ֣וא כֵהָ֑ה וְ/הִסְגִּיר֥/וֹ הַ/כֹּהֵ֖ן שִׁבְעַ֥ת יָמִֽים׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/026.yaml
  text: But if the priest examines it[a], and behold, there is no white hair in the bright spot, and it is not deeper than the skin, but it is faded[b], then the priest shall isolate him seven days.
translation:
  language: hi
  text: परन्तु यदि याजक उसे जाँचकर देखे कि उस चमकीले धब्बे में सफेद बाल नहीं हैं, और वह धब्बा त्वचा की सतह से धँसा हुआ नहीं है[a], बल्कि फीका है, तो याजक उस व्यक्ति को सात दिन तक अलग रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह त्वचा से नीचा नहीं है”; अर्थात वह आसपास की त्वचा की सतह से नीचे धँसा हुआ नहीं दिखाई देता।
    reason: lexical_alternative
  - marker: b
    text: या “बंद रखे” अथवा “एकांत में रखे।”
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּבֶּהֶרֶת
  choice: उस चमकीले धब्बे में
  rationale: यह शब्द त्वचा पर दिखाई देने वाले चमकीले या सफेद-से चिह्न को बताता है। ‘चमकीला धब्बा’ उसके दृश्य गुण को सुरक्षित रखता है और किसी आधुनिक रोग-निदान को आरोपित नहीं करता।
- source_word: שֵׂעָר לָבָן
  choice: सफेद बाल
  rationale: इब्रानी का एकवचन यहाँ सामूहिक अर्थ दे सकता है; हिन्दी में ‘सफेद बाल’ स्वाभाविक और अर्थ-सटीक है।
- source_word: וּשְׁפָלָה אֵינֶנָּה מִן הָעוֹר
  choice: वह त्वचा की सतह से धँसा हुआ नहीं है
  rationale: मूल विशेषण नीचे या दबा हुआ होने का भाव देता है। ‘धँसा हुआ नहीं’ निरीक्षण में दिखाई देने वाली स्थिति को स्पष्ट करता है, जबकि ‘त्वचा की सतह’ तुलना के आधार को स्वाभाविक हिन्दी में व्यक्त करती है।
- source_word: כֵהָה
  choice: उसका रंग फीका पड़ गया है
  rationale: यह शब्द धब्बे के मंद या कम स्पष्ट हो जाने का संकेत देता है। ‘रंग फीका पड़ गया’ त्वचा के धब्बे के संदर्भ में सहज और स्पष्ट है।
- source_word: וְהִסְגִּירוֹ
  choice: उस व्यक्ति को ... अलग रखे
  rationale: क्रिया का अर्थ निरीक्षण के लिए बंद या पृथक रखना है। ‘अलग रखे’ आधुनिक हिन्दी में स्पष्ट है और आधुनिक चिकित्सकीय ‘क्वारंटीन’ की अतिरिक्त धारणाएँ नहीं जोड़ता।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: समयावधि का सीधा और स्वाभाविक अनुवाद।
- source_word: יִרְאֶנָּה
  choice: उसे जाँचकर देखे
  rationale: मूल क्रिया का सामान्य अर्थ ‘देखना’ है, पर याजकीय निरीक्षण के प्रसंग में ‘जाँचकर देखे’ औपचारिक परीक्षण और दृश्य अवलोकन दोनों को व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: कि
  rationale: इब्रानी अवलोकन-सूचक को हिन्दी की ‘जाँचकर देखे कि’ संरचना में स्वाभाविक रूप से समाहित किया गया है; अलग से ‘देखो’ रखने पर वाक्य असहज और अत्यधिक शब्दशः होता।
