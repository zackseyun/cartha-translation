  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। याजकीय निरीक्षण की प्राचीन प्रक्रिया को किसी निश्चित आधुनिक रोग या सार्वजनिक-स्वास्थ्य श्रेणी से नहीं जोड़ा गया है। सर्वनाम की अस्पष्टता से बचने के लिए अंतिम खंड में ‘उस व्यक्ति’ कहा गया है।
