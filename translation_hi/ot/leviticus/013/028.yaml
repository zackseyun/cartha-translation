  text: וְ/אִם תַּחְתֶּי/הָ֩ תַעֲמֹ֨ד הַ/בַּהֶ֜רֶת לֹא פָשְׂתָ֤ה בָ/עוֹר֙ וְ/הִ֣וא כֵהָ֔ה שְׂאֵ֥ת הַ/מִּכְוָ֖ה הִ֑וא וְ/טִֽהֲר/וֹ֙ הַ/כֹּהֵ֔ן כִּֽי צָרֶ֥בֶת הַ/מִּכְוָ֖ה הִֽוא־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/028.yaml
  text: But if the bright spot remains in its place and has not spread in the skin[a], and it is faded, it is the swelling from the burn, and the priest shall pronounce him clean, for it is the scar of the burn.
translation:
  language: hi
  text: परन्तु यदि वह चमकीला धब्बा अपनी जगह पर बना रहे[a], त्वचा में न फैला हो और फीका पड़ गया हो, तो वह जलने से हुई सूजन है। याजक उसे शुद्ध ठहराए, क्योंकि वह जलने का दाग है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘उसके नीचे बना रहे’; इब्रानी में शाब्दिक रूप से ‘उसके नीचे खड़ा रहे’ है, पर प्रसंग में आशय है कि धब्बा अपनी जगह पर स्थिर रहे और न फैले।
    reason: lexical_alternative
lexical_decisions:
- source_word: תַּחְתֶּיהָ תַעֲמֹד
  choice: अपनी जगह पर बना रहे
  rationale: शाब्दिक रूप से ‘उसके नीचे खड़ा रहे’ है, पर जाँच के इस संदर्भ में आशय धब्बे के वहीं स्थिर रहने और न फैलने से है।
- source_word: הַבַּהֶרֶת
  choice: चमकीला धब्बा
  rationale: यह त्वचा पर दिखाई देने वाले उजले या चमकीले वर्ण-विकार को सूचित करता है; ‘धब्बा’ सामान्य पाठक के लिए स्वाभाविक है।
- source_word: פָשְׂתָה בָעוֹר
  choice: त्वचा में न फैला हो
  rationale: क्रिया रोग-चिह्न के फैलने को बताती है और בָעוֹר का निकट रूप ‘त्वचा में’ है।
- source_word: כֵהָה
  choice: फीका पड़ गया हो
  rationale: शब्द चमक या तीव्रता घटने का बोध देता है; हिन्दी में यह सहज चिकित्सकीय वर्णन है।
- source_word: שְׂאֵת הַמִּכְוָה
  choice: जलने से हुई सूजन
  rationale: שְׂאֵת त्वचा के उभरे हुए भाग या सूजन और מִכְוָה जले हुए घाव को दर्शाता है।
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: याजक उसे शुद्ध ठहराए
  rationale: यहाँ क्रिया प्रत्यक्ष रूप से शुद्ध करने के बजाय याजकीय जाँच के बाद शुद्ध घोषित करने का अर्थ रखती है।
- source_word: צָרֶבֶת הַמִּכְוָה
  choice: जलने का दाग
  rationale: צָרֶבֶת जले हुए स्थान पर रह गए निशान या दाग को सूचित करता है; ‘दाग’ आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
