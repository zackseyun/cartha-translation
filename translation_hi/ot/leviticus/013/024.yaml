- source_word: לְבָנָה אֲדַמְדֶּמֶת
  choice: लाली लिए सफेद
  rationale: दोनों विशेषणों के संयुक्त रंग-वर्णन को बिना अत्यधिक चिकित्सकीय भाषा के स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אוֹ לְבָנָה
  choice: या सफेद
  rationale: रंग के दूसरे विकल्प को मूल के समान संक्षेप और स्पष्टता से सुरक्षित रखता है।
