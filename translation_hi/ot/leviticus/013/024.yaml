base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/024.yaml
  text: Or if the body has on its skin a burn from fire[a], and the raw flesh of the burn becomes a bright spot, reddish-white or white[b],
translation:
  language: hi
  text: या यदि किसी व्यक्ति के शरीर[a] की त्वचा पर आग से जलने का घाव हो, और जले हुए स्थान का कच्चा मांस चमकीला चकत्ता बन जाए—लालिमा लिए सफेद या सफेद—,[b]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: मूल भाषा में ‘शरीर’ के लिए प्रयुक्त शब्द का सामान्य अर्थ ‘मांस’ भी है; यहाँ वह त्वचा-संबंधी नियम में व्यक्ति के शरीर को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: ‘कच्चा मांस’ उस इब्रानी अभिव्यक्ति का अनुवाद है जिसका अर्थ जले हुए स्थान में दिखाई देने वाला जीवित ऊतक है।
    reason: cultural_note
