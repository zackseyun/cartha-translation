  text: וְ/אִישׁ֙ אֽוֹ אִשָּׁ֔ה כִּֽי יִהְיֶ֥ה בְ/עוֹר בְּשָׂרָ֖/ם בֶּהָרֹ֑ת בֶּהָרֹ֖ת לְבָנֹֽת־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/038.yaml
  text: And if a man or a woman has bright spots on the skin of the body[a], white bright spots,
translation:
  language: hi
  text: और यदि किसी पुरुष या स्त्री के शरीर की त्वचा पर चमकीले धब्बे, यानी सफेद चमकीले धब्बे, हों,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְ/אִישׁ ... אִשָּׁה
  choice: और यदि किसी पुरुष या स्त्री
  rationale: दोनों लिंगों का स्पष्ट उल्लेख रखा गया है; ‘किसी’ लैव्यव्यवस्था की निदानात्मक विधि-शैली में अनिश्चित व्यक्ति को स्वाभाविक रूप से व्यक्त करता है।
- source_word: כִּי יִהְיֶה
  choice: यदि ... हों
  rationale: यहाँ כִּי एक संभावित परिस्थिति प्रस्तुत करता है; बहुवचन ‘धब्बे’ के साथ ‘हों’ आधुनिक हिन्दी में स्वाभाविक है।
- source_word: בְּעוֹר בְּשָׂרָם
  choice: के शरीर की त्वचा पर
  rationale: עוֹר को ‘त्वचा’ और בָּשָׂר को इस शारीरिक संदर्भ में ‘शरीर’ कहा गया है। हिन्दी में त्वचा पर दिखाई देने वाले चिह्नों के लिए ‘पर’ उपयुक्त है।
- source_word: בֶּהָרֹת
  choice: चमकीले धब्बे
  rationale: यह शब्द त्वचा पर दिखाई देने वाले उजले या चमकीले चिह्नों को बताता है; ‘धब्बे’ निदानात्मक संदर्भ में स्पष्ट और सामान्य शब्द है।
- source_word: בֶּהָרֹת לְבָנֹת
  choice: सफेद चमकीले धब्बे
  rationale: לְבָנֹת रंग को सफेद बताता है। मूल की संज्ञा-पुनरावृत्ति को बनाए रखकर वर्णन की निदानात्मक सटीकता सुरक्षित की गई है।
