  text: or in the warp or in the woof of the linen or of the wool[a], or in leather[c][b], or in any article made of leather—
translation:
  language: hi
  text: या सन अथवा ऊन के ताने या बाने में[a], या चमड़े में, या चमड़े से बनी किसी भी वस्तु में—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘बाना’ से आशय ताने के आर-पार बुने जाने वाले धागों से है।
    reason: lexical_clarification
lexical_decisions:
- source_word: שְׁתִי
  choice: ताना
  rationale: यह बुनाई के लंबाई की दिशा में रहने वाले धागों का मानक और सामान्य हिन्दी नाम है।
- source_word: עֵרֶב
  choice: बाना
  rationale: यह ताने के आर-पार बुने जाने वाले धागों का मानक हिन्दी नाम है और 'ताना-बाना' युग्म में स्वाभाविक है।
- source_word: לַפִּשְׁתִּים
  choice: सन के
  rationale: פִּשְׁתִּים मूलतः सन को सूचित करता है; यहाँ उससे बने धागे या कपड़े का आशय है। 'सन के' मूल पदार्थ को स्पष्ट रखते हुए प्रसंग में स्वाभाविक है।
- source_word: וְלַצָּמֶר
  choice: या ऊन के
  rationale: צֶמֶר का सीधा अर्थ ऊन है; दो प्रकार के वस्त्र-पदार्थों के विकल्प को हिन्दी में स्पष्ट किया गया है।
- source_word: עוֹר
  choice: चमड़ा
  rationale: इस प्रसंग में उपयोग या निर्माण के लिए तैयार पशु-चर्म अभिप्रेत है, इसलिए 'चमड़ा' सामान्य हिन्दी में 'खाल' से अधिक उपयुक्त है।
- source_word: בְּכָל מְלֶאכֶת עוֹר
  choice: चमड़े से बनी किसी भी वस्तु में
  rationale: מְלֶאכֶת עוֹר यहाँ चमड़े से निर्मित वस्तु को दर्शाता है; यह रूप शाब्दिक 'चमड़े के किसी भी काम' की अपेक्षा अधिक स्पष्ट और स्वाभाविक है।
- source_word: אוֹ ... אוֹ
  choice: या ... अथवा ... या
  rationale: हिब्रू की वैकल्पिक सूची को बनाए रखा गया है; निकटवर्ती पुनरावृत्ति में सहज हिन्दी के लिए 'अथवा' का प्रयोग किया गया है।
