  text: צָרַ֨עַת נוֹשֶׁ֤נֶת הִוא֙ בְּ/ע֣וֹר בְּשָׂר֔/וֹ וְ/טִמְּא֖/וֹ הַ/כֹּהֵ֑ן לֹ֣א יַסְגִּרֶ֔/נּוּ כִּ֥י טָמֵ֖א הֽוּא׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/011.yaml
  text: it is a chronic skin disease in the skin of his body[a], and the priest shall pronounce him unclean; he shall not isolate him, for he is unclean.
translation:
  language: hi
  text: यह उसके शरीर की त्वचा में पुराना चर्मरोग[a] है। याजक उसे अशुद्ध घोषित करे। वह उसे अलग न रखे, क्योंकि वह अशुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘लंबे समय से चला आ रहा चर्मरोग।’ पारंपरिक अनुवादों में צָרַעַת का अनुवाद प्रायः ‘कोढ़’ किया गया है, पर लैव्यव्यवस्था में यह इब्रानी शब्द आधुनिक कोढ़ (हैन्सन रोग) से अधिक व्यापक प्रकार के रोगों को समेटता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: लैव्यव्यवस्था में यह इब्रानी शब्द आधुनिक हैन्सन रोग तक सीमित नहीं, बल्कि त्वचा के कई गंभीर विकारों के लिए प्रयुक्त होता है; इसलिए ‘चर्मरोग’ अनावश्यक चिकित्सकीय विशिष्टता से बचता है।
- source_word: נוֹשֶׁנֶת
  choice: पुराना
  rationale: यह रूप पहले से बने हुए या लंबे समय से मौजूद रोग को दर्शाता है। ‘पुराना’ सहज हिन्दी है और मूल की अवधि-संबंधी धारणा बनाए रखता है।
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: उसके शरीर की त्वचा में
  rationale: यह मूल वाक्यांश के स्थान-संबंध को स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: וְטִמְּאוֹ
  choice: उसे अशुद्ध घोषित करे
  rationale: याजक उस व्यक्ति को अशुद्ध बनाता नहीं, बल्कि उसकी विधिक-अनुष्ठानिक स्थिति की आधिकारिक घोषणा करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-संबंधी पद के लिए प्रचलित और सीधा हिन्दी पर्याय।
- source_word: לֹא יַסְגִּרֶנּוּ
  choice: वह उसे अलग न रखे
  rationale: संदर्भ में क्रिया का अर्थ निरीक्षण के लिए किसी व्यक्ति को अलग रखना है। यह अनुवाद ‘क्वारंटीन’ जैसे अत्यधिक आधुनिक चिकित्सकीय शब्द से बचता है।
- source_word: כִּי טָמֵא הוּא
  choice: क्योंकि वह अशुद्ध है
  rationale: यह कारण बताता है कि आगे निरीक्षण के लिए अलग रखना आवश्यक नहीं है; स्थिति पहले ही स्पष्ट है।
theological_decisions:
- issue: अनुष्ठानिक अशुद्धता की शब्दावली
  choice: अशुद्ध
  alternative: अपवित्र
  rationale: यहाँ טמא अनुष्ठानिक-विधिक स्थिति बताता है, व्यक्तिगत नैतिक दोष नहीं। ‘अशुद्ध’ स्थापित बाइबलीय शब्दावली को बनाए रखता है और नैतिक दोष का अनावश्यक संकेत नहीं देता।
- issue: याजक की भूमिका
  choice: अशुद्ध घोषित करे
  alternative: अशुद्ध कर दे
  rationale: पाठ में याजक रोगी की स्थिति पहचानकर सुनाता है; वह अपने कार्य से व्यक्ति को अशुद्ध नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। विधिक आदेश के लिए ‘करे’ और निरीक्षण हेतु पृथक्करण के लिए ‘अलग न रखे’ प्रयुक्त है।
