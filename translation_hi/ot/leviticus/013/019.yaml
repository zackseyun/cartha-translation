  text: and in the place of the boil there develops a white swelling or a reddish-white bright spot[a], then it shall be shown to the priest.
translation:
  language: hi
  text: और फोड़े की जगह पर यदि सफेद सूजन या लालिमा लिए हुआ सफेद चमकीला चकत्ता उभर आए, तो उसे याजक को दिखाया जाए।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “और वह याजक को दिखाई दे।” इब्रानी का अधिक शाब्दिक अनुवाद “देखा जाए” हो सकता है, पर यहाँ संभवतः आशय उसे याजक की जाँच के लिए प्रस्तुत करने से है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהָיָה
  choice: यदि ... उभर आए
  rationale: इस निदान-संबंधी विधान में היה उस त्वचा-विकार के प्रकट होने को बताता है; हिंदी में शर्तसूचक वाक्य और ‘उभर आए’ इस भाव को स्वाभाविक रूप से व्यक्त करते हैं।
- source_word: בִּמְקוֹם הַשְּׁחִין
  choice: फोड़े की जगह पर
  rationale: शְׁחִין के लिए ‘फोड़ा’ और स्थानसूचक בִּמְקוֹם के लिए ‘की जगह पर’ सहज तथा अर्थनिष्ठ हैं।
- source_word: שְׂאֵת לְבָנָה
  choice: सफेद सूजन
  rationale: שְׂאֵת यहाँ त्वचा पर उभरी हुई सूजन को दर्शाता है; ‘सूजन’ अध्याय के रोग-परीक्षण संदर्भ में स्पष्ट है।
- source_word: בַהֶרֶת לְבָנָה אֲדַמְדָּמֶת
  choice: लालिमा लिए हुए सफेद चमकीला चकत्ता
  rationale: בַהֶרֶת को ‘चमकीला चकत्ता’ अलग त्वचा-चिह्न के रूप में व्यक्त करता है, जबकि לְבָנָה אֲדַמְדָּמֶת उसकी सफेदी और लालिमा दोनों को बनाए रखता है।
- source_word: וְנִרְאָה אֶל הַכֹּהֵן
  choice: तो उसे याजक को दिखाया जाए
  rationale: निफ़अल रूप का शाब्दिक अर्थ ‘देखा जाए/दिखाई दे’ हो सकता है, पर विधिक संदर्भ में प्रभावित स्थान को याजकीय जाँच के लिए प्रस्तुत करना अभिप्रेत है।
