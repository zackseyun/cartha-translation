  naturalness: “प्रभावित स्थान,” “जाँच करे,” and “शुद्ध ठहराए” are clear, modern, and suitably formal. Joining the initial clauses also better reflects the flow of the Hebrew examination formula.
  terminology: “याजक” appropriately renders כֹּהֵן. “प्रभावित स्थान” responsibly avoids imposing a modern diagnosis for נֶגַע. “शुद्ध ठहराए” correctly conveys an authoritative ritual verdict rather than medical treatment.
  issues:
  - severity: medium
    issue: The final verdict is ambiguously attached to the affected spot.
    rationale: Although הוּא is masculine singular and נֶגַע is grammatically masculine, the surrounding passage identifies the person who comes to the priest and receives the resulting purity status. In Hindi, following “उस स्थान” with “वह शुद्ध है” strongly identifies the spot as clean. “वह व्यक्ति शुद्ध है” communicates the contextual referent without asserting a medical cure.
