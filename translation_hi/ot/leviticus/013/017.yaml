base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/017.yaml
  text: And the priest shall examine it[a], and behold, the diseased spot has turned white; then the priest shall pronounce the spot clean[c][b]; it is clean.
translation:
  language: hi
  text: याजक उसकी जाँच करे[a], और देखे कि प्रभावित स्थान सफेद हो गया है; तब याजक उस स्थान को शुद्ध ठहराए[b]—वह व्यक्ति शुद्ध है[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, ‘उसे देखे।’ यहाँ देखने का अर्थ याजकीय निरीक्षण या जाँच करना है।
    reason: lexical_alternative
  - marker: b
    text: या, ‘उस स्थान को शुद्ध घोषित करे।’ याजक जाँच के बाद शुद्धता का निर्णय देता है; वह यहाँ रोग को ठीक नहीं करता।
    reason: lexical_alternative
  - marker: c
    text: इब्रानी में शाब्दिक क्रम है, ‘शुद्ध है वह।’ सर्वनाम पुल्लिंग एकवचन है; प्रसंग में यह जाँच के अधीन व्यक्ति के लिए शुद्धता का निर्णय व्यक्त करता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: उसकी जाँच करे
  rationale: शाब्दिक अर्थ ‘उसे देखे’ है, पर लैव्यव्यवस्था 13 की याजकीय प्रक्रिया में क्रिया निरीक्षण या जाँच को व्यक्त करती है। ‘उसकी जाँच करे’ आधुनिक हिन्दी में इस प्रक्रियात्मक अर्थ को स्पष्ट रखता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: यह निरीक्षण के परिणाम की ओर ध्यान खींचने वाला कथन-सूचक है। ‘और देखो’ मूल की आकस्मिक अवलोकन-शक्ति और गरिमापूर्ण शैली को बनाए रखता है।
- source_word: הַנֶּגַע
  choice: प्रभावित स्थान
  rationale: נֶגַע यहाँ जाँच के अधीन दिखाई देने वाले प्रभावित भाग को सूचित करता है, बिना किसी आधुनिक चिकित्सकीय निदान को निश्चित किए। ‘प्रभावित स्थान’ सहज है और ‘घाव’ या ‘संक्रमण’ जैसी अनावश्यक विशिष्टता से बचता है।
- source_word: נֶהְפַּךְ ... לְלָבָן
  choice: सफेद हो गया है
  rationale: निफ़अल रूप अवस्था और रंग के परिवर्तन को बताता है; यह हिन्दी अभिव्यक्ति स्वाभाविक रूप से वही परिणाम व्यक्त करती है।
- source_word: וְטִהַר
  choice: शुद्ध ठहराए
  rationale: यहाँ याजक उपचार नहीं करता, बल्कि जाँच के बाद विधिक-अनुष्ठानिक शुद्धता का निर्णय सुनाता है। ‘शुद्ध ठहराए’ इस निर्णायक भूमिका को स्पष्ट करता है।
- source_word: טָהוֹר הוּא
  choice: वह शुद्ध है
  rationale: मूल में पुल्लिंग एकवचन सर्वनाम है। ‘वह शुद्ध है’ उसकी औपचारिक संरचना और संभावित संदर्भगत तनाव को बनाए रखता है, जबकि निकट संदर्भ इसे प्रभावित स्थान पर दिया गया शुद्धता-निर्णय समझने देता है।
theological_decisions:
- issue: शुद्धता-विधान में याजक की भूमिका
  choice: याजक प्रभावित स्थान को शुद्ध ठहराता है
  alternative: याजक प्रभावित स्थान को शुद्ध करता है
  rationale: इस प्रसंग में טהר का अर्थ किसी रोग को ठीक करना या वस्तु को सक्रिय रूप से शुद्ध करना नहीं, बल्कि निरीक्षण के बाद शुद्धता की आधिकारिक घोषणा करना है।
- issue: अंतिम शुद्धता-वचन का संदर्भ
  choice: ‘वह शुद्ध है’ के रूप में मूल का पुल्लिंग सर्वनाम बनाए रखा गया
  alternative: ‘वह स्थान शुद्ध है’ या ‘वह व्यक्ति शुद्ध है’ कहकर संदर्भ स्पष्ट करना
  rationale: इब्रानी का संक्षिप्त वाक्य औपचारिक रूप से पुल्लिंग एकवचन है और निकटवर्ती נגע से जुड़ सकता है। अनुवाद किसी एक विस्तृत व्याख्या को अनावश्यक रूप से आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। विधिक प्रक्रिया को स्पष्ट करने के लिए ‘जाँच करे’ और ‘शुद्ध ठहराए’ चुने गए हैं। ‘और देखो’ मूल कथन-सूचक को बनाए रखता है, जबकि ‘प्रभावित स्थान’ आधुनिक चिकित्सकीय निदान थोपने से बचता है।
