source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֣ן אֶת הַ/נֶּ֣גַע בְּ/עֽוֹר הַ֠/בָּשָׂר וְ/שֵׂעָ֨ר בַּ/נֶּ֜גַע הָפַ֣ךְ לָבָ֗ן וּ/מַרְאֵ֤ה הַ/נֶּ֨גַע֙ עָמֹק֙ מֵ/ע֣וֹר בְּשָׂר֔/וֹ נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/רָאָ֥/הוּ הַ/כֹּהֵ֖ן וְ/טִמֵּ֥א אֹתֽ/וֹ־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/003.yaml
  text: And the priest shall examine the diseased spot on the skin of the body[a], and if the hair in the spot has turned white and the appearance of the spot is deeper than the skin of his body, it is a diseased spot of skin disease; when the priest has examined him, he shall pronounce him unclean.
translation:
  language: hi
  text: और याजक शरीर की त्वचा पर उस रोगग्रस्त स्थान की जाँच करे। यदि उस स्थान के बाल सफेद हो गए हों और वह स्थान शरीर की त्वचा की सतह से धँसा हुआ दिखाई दे, तो वह चर्मरोग[a] का घाव है। याजक उसकी जाँच करके उसे अशुद्ध घोषित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़।” इब्रानी शब्द צָרַעַת आधुनिक कोढ़ (हैन्सन रोग) से अधिक व्यापक, त्वचा से संबंधित अनुष्ठानिक श्रेणी के लिए प्रयुक्त होता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: נֶגַע
  choice: रोगग्रस्त स्थान / घाव
  rationale: निरीक्षण के आरंभ में यह त्वचा का प्रभावित स्थान है; निदान स्पष्ट होने पर ‘घाव’ स्वाभाविक है। इससे इब्रानी शब्द का दृश्य और रोग-संबंधी आशय बना रहता है।
- source_word: בְּעוֹר הַבָּשָׂר
  choice: शरीर की त्वचा पर
  rationale: हिन्दी में यह स्वाभाविक शारीरिक अभिव्यक्ति है और ‘मांस की त्वचा’ जैसे असहज अक्षरशः अनुवाद से बचती है।
- source_word: שֵׂעָר ... הָפַךְ לָבָן
  choice: बाल सफेद हो गए हों
  rationale: दिखाई देने वाले परिणामी परिवर्तन को सहज आधुनिक हिन्दी में व्यक्त करता है।
- source_word: מַרְאֵה הַנֶּגַע עָמֹק מֵעוֹר בְּשָׂרוֹ
  choice: वह स्थान शरीर की त्वचा से गहरा दिखाई दे
  rationale: מַרְאֵה के दृश्य-आभास को स्पष्ट रखता है; पाठ यह कहता है कि वह गहरा दिखाई देता है, केवल यह नहीं कि चिकित्सकीय रूप से अवश्य गहरा है।
- source_word: נֶגַע צָרַעַת
  choice: चर्मरोग का घाव
  rationale: दोनों संज्ञाओं को स्वाभाविक हिन्दी में बनाए रखता है और צָרַעַת को आधुनिक हैन्सन रोग तक सीमित नहीं करता।
- source_word: וְטִמֵּא אֹתוֹ
  choice: उसे अशुद्ध घोषित करे
  rationale: याजक के न्यायिक-विधिक निर्णय को दर्शाता है; यह संकेत नहीं देता कि याजक स्वयं उसे अशुद्ध बनाता है।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में צָרַעַת का अर्थ
  choice: चर्मरोग
  alternative: कोढ़
  rationale: इब्रानी शब्द प्राचीन अनुष्ठानिक-वर्ग को दर्शाता है और आधुनिक हैन्सन रोग से अधिक व्यापक है। पारंपरिक विकल्प को पादटिप्पणी में रखा गया है।
- issue: וְטִמֵּא אֹתוֹ में याजक की क्रिया
  choice: अशुद्ध घोषित करे
  alternative: अशुद्ध कर दे
  rationale: संदर्भ में याजक जाँच के आधार पर अनुष्ठानिक स्थिति का निर्णय सुनाता है; वह अशुद्धता उत्पन्न नहीं करता।
translation_notes:
  register: आधुनिक, स्पष्ट और गरिमापूर्ण मानक हिन्दी। ‘याजक’ और ‘अशुद्ध’ विधिक-अनुष्ठानिक संदर्भ को बनाए रखते हैं; ‘जाँच करे’ सामान्य पाठक के लिए सहज है।
