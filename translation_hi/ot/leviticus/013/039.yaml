source:
  edition: WLC
  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֧ה בְ/עוֹר בְּשָׂרָ֛/ם בֶּהָרֹ֖ת כֵּה֣וֹת לְבָנֹ֑ת בֹּ֥הַק ה֛וּא פָּרַ֥ח בָּ/ע֖וֹר טָה֥וֹר הֽוּא־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/039.yaml
  text: and the priest examines, and behold, on the skin of their flesh there are dull white spots, it is a harmless rash that has broken out on the skin; he is clean.
translation:
  language: hi
  text: और याजक जाँच करे। यदि उनके शरीर की त्वचा पर धुँधले सफेद धब्बे हों, तो यह त्वचा पर निकला बोहक[a] है; वह शुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात त्वचा पर निकला एक प्रकार का धब्बा या चकत्ता, जो इस अध्याय में वर्णित अशुद्ध ठहराने वाली गंभीर त्वचा-दशा से अलग है। इस हिब्रू शब्द की सटीक चिकित्सकीय पहचान अनिश्चित है।
    reason: दुर्लभ शब्द בֹּהַק के अर्थ-विकल्प और चिकित्सकीय अनिश्चितता को स्पष्ट करना।
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: लैव्यव्यवस्था 13 के याजकीय निरीक्षण-संदर्भ में ראה केवल देखने के बजाय जाँचने का भाव रखता है; विधिक निर्देश के लिए यह स्वाभाविक हिन्दी है।
- source_word: וְהִנֵּה
  choice: यदि … हों
  rationale: यहाँ निरीक्षण के परिणाम को प्रस्तुत करने वाली हिब्रू संरचना को स्वाभाविक हिन्दी की शर्तात्मक विधिक शैली में व्यक्त किया गया है।
- source_word: בְעוֹר בְּשָׂרָם
  choice: उनके शरीर की त्वचा पर
  rationale: ‘उनके’ बहुवचन प्रत्यय को सुरक्षित रखता है और ‘शरीर की त्वचा’ आधुनिक हिन्दी में ‘मांस की त्वचा’ से अधिक स्वाभाविक है।
- source_word: בֶּהָרֹת כֵּהוֹת לְבָנֹת
  choice: धुँधले सफेद धब्बे
  rationale: בֶּהָרֹת को दृश्य धब्बों और כֵּהוֹת को उनकी मंद या फीकी चमक के रूप में व्यक्त करता है।
- source_word: בֹּהַק
  choice: बोहक
  rationale: दुर्लभ और चिकित्सकीय रूप से अनिश्चित पद का लिप्यंतरण स्रोत की अस्पष्टता बचाता है तथा इसे आधुनिक रोग-नाम या स्वतः ‘हानिरहित’ घोषित करने से बचता है।
- source_word: פָּרַח בָּעוֹר
  choice: त्वचा पर निकला
  rationale: त्वचा की दशा के प्रकट होने या उभरने का स्वाभाविक हिन्दी वर्णन है।
- source_word: טָהוֹר הוּא
  choice: वह शुद्ध है
  rationale: याजकीय निर्णय की संक्षिप्त विधिक श्रेणी को बनाए रखता है; सन्दर्भ इसे अनुष्ठानिक शुद्धता बताता है, न नैतिक निर्दोषता या चिकित्सकीय आरोग्यता।
theological_decisions:
- issue: याजकीय निर्णय का स्वरूप
  choice: ‘वह शुद्ध है’—अनुष्ठानिक/विधिक स्थिति के निर्णय के रूप में
  alternative: ‘वह अनुष्ठानिक रूप से शुद्ध है’ या ‘वह साफ है’
  rationale: טָהוֹר की पारंपरिक और संक्षिप्त धार्मिक-विधिक अभिव्यक्ति ‘शुद्ध’ है। ‘अनुष्ठानिक रूप से’ अर्थ स्पष्ट करता, पर मूल से अधिक व्याख्यात्मक होता; ‘साफ’ त्वचा की साधारण स्वच्छता का भ्रम दे सकता है।
- issue: בֹּהַק की चिकित्सकीय पहचान
  choice: मुख्य पाठ में ‘बोहक’ और पादटिप्पणी में सामान्य अर्थ
  alternative: ‘हानिरहित चकत्ता’, ‘त्वचा का उभार’ या किसी आधुनिक रोग का नाम
  rationale: दुर्लभ हिब्रू पद की सटीक आधुनिक चिकित्सकीय पहचान निश्चित नहीं है। प्रसंग इतना स्पष्ट करता है कि यह अशुद्ध ठहराने वाली गंभीर दशा नहीं है, पर मूल स्वयं ‘हानिरहित’ शब्द नहीं कहता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज विधिक शैली अपनाई गई है। ‘याजक’ और ‘शुद्ध’ लैव्यव्यवस्था की स्थापित धार्मिक शब्दावली रखते हैं। मूल के 3 पुरुष बहुवचन प्रत्यय के कारण ‘उनके’ रखा गया है, जबकि अंतिम निदान के एकवचन रूप को ‘वह’ से व्यक्त किया गया है।
