  text: וַ/יְדַבֵּ֣ר יְהוָ֔ה אֶל מֹשֶׁ֥ה וְ/אֶֽל אַהֲרֹ֖ן לֵ/אמֹֽר־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/001.yaml
  text: And Yahweh spoke to Moses and to Aaron[a], saying,
translation:
  language: hi
  text: याहवे ने मूसा और हारून से कहा,
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने…कहा
  rationale: यह क्रिया नए कथात्मक वचन-प्रसंग का आरम्भ करती है। हिन्दी में संबोधित व्यक्तियों के साथ ‘से कहा’ इस प्रचलित दिव्य-वचन सूत्र का स्वाभाविक और सटीक रूप है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल पाठ में परमेश्वर का व्यक्तिगत नाम YHWH है; ‘याहवे’ उसका प्रचलित हिन्दी लिप्यंतरण है और इसे किसी उपाधि से नहीं बदलता।
- source_word: אֶל מֹשֶׁה וְאֶל אַהֲרֹן
  choice: मूसा और हारून से
  rationale: दोनों व्यक्तियों को वचन के संबोधित जन के रूप में स्पष्ट रखता है। हिन्दी में साझा परसर्ग ‘से’ को दूसरे नाम के बाद रखना स्वाभाविक है।
- source_word: לֵאמֹר
  choice: कहा,
  rationale: यह आगामी वचन की विषयवस्तु प्रस्तुत करने वाला सूत्र है। हिन्दी में मुख्य क्रिया ‘कहा’ ही यह कार्य स्वाभाविक ढंग से करती है; ‘यह कहते हुए’ अनावश्यक रूप से बोझिल होता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: इब्रानी पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘याहवे’ नाम को सुरक्षित रखता है, जबकि ‘प्रभु’ उसे उपाधि से बदल देता और ‘यहोवा’ एक वैकल्पिक पारंपरिक रूप है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सहज मानक हिन्दी। इब्रानी वाक्य-सूत्र का अर्थ बनाए रखते हुए हिन्दी की स्वाभाविक ‘ने…से कहा’ रचना अपनाई गई है।
