  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֨ה כִסְּתָ֤ה הַ/צָּרַ֨עַת֙ אֶת כָּל בְּשָׂר֔/וֹ וְ/טִהַ֖ר אֶת הַ/נָּ֑גַע כֻּלּ֛/וֹ הָפַ֥ךְ לָבָ֖ן טָה֥וֹר הֽוּא־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/013.yaml
  text: and the priest examines him[a], and behold, the skin disease has covered all his flesh, then he shall pronounce the affected person clean; all of it has turned white[b]; he is clean.
translation:
  language: hi
  text: और याजक उसकी जाँच करे और देखे कि चर्मरोग[a] ने उसके सारे शरीर को ढक लिया है, तो वह उस व्यक्ति को[b] शुद्ध घोषित करे; उसका सारा शरीर सफेद हो गया है; वह शुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी צָרַעַत (परंपरागत रूप से ‘कुष्ठ रोग’) लैव्यव्यवस्था में त्वचा की कई व्याधियों के लिए प्रयुक्त व्यापक पद है; यह आवश्यक नहीं कि आधुनिक कुष्ठ रोग ही हो।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में शाब्दिक कर्म “घाव/व्याधि” है, पर शुद्ध घोषित किए जाने का निर्णय उस व्यक्ति पर लागू होता है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: याजकीय निरीक्षण के संदर्भ में क्रिया केवल देखने नहीं, ध्यानपूर्वक जाँच करने का भाव देती है।
- source_word: הַצָּרַעַת
  choice: चर्मरोग
  rationale: यह इब्रानी पद आधुनिक कुष्ठ रोग तक सीमित नहीं, बल्कि त्वचा की कई व्याधियों के लिए व्यापक श्रेणी है।
- source_word: אֶת כָּל בְּשָׂרוֹ
  choice: उसके पूरे शरीर को
  rationale: शाब्दिक 'उसका सारा मांस' के बजाय संदर्भ में शरीर की पूरी बाहरी सतह का स्वाभाविक हिन्दी बोध देता है।
- source_word: וְטִהַר אֶת הַנָּגַע
  choice: वह उस रोगी को शुद्ध घोषित करे
  rationale: पिएल रूप यहाँ उपचार द्वारा शुद्ध करने के बजाय याजकीय शुद्धता का निर्णय सुनाने को व्यक्त करता है; व्याकरणिक कर्म 'घाव/व्याधि' है, पर निर्णय व्यक्ति पर लागू होता है।
- source_word: כֻּלּוֹ הָפַךְ לָבָן
  choice: वह पूरा सफेद हो गया है
  rationale: पुल्लिंग सर्वनाम की अस्पष्टता को बनाए रखता है और पूर्ण रूप से सफेद होने की निर्णायक दशा व्यक्त करता है।
- source_word: טָהוֹר הוּא
  choice: वह शुद्ध है
  rationale: लैव्यव्यवस्था की शुद्धता-संबंधी मानक शब्दावली को बिना 'अनुष्ठानिक' जोड़कर सुरक्षित रखता है।
theological_decisions:
- issue: צָרַעַת का अर्थ
  choice: चर्मरोग
  alternative: कुष्ठ रोग
  rationale: आधुनिक हैन्सन रोग की अनावश्यक चिकित्सीय विशिष्टता से बचते हुए इब्रानी श्रेणी की व्यापकता बनाए रखी गई है।
- issue: וְטִהַר की याजकीय भूमिका
  choice: शुद्ध घोषित करे
  alternative: शुद्ध करे
  rationale: याजक रोग का उपचार या व्यक्ति का शोधन नहीं करता, बल्कि निरीक्षण के आधार पर शुद्धता का निर्णय देता है।
- issue: אֶת הַנָּגַע का कर्म
  choice: उस रोगी को
  alternative: उस घाव को
  rationale: मूल में कर्म 'घाव/व्याधि' है, किंतु कानूनी निर्णय उसके धारक व्यक्ति पर लागू होता है; इस अंतर को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिन्दी। 'याजक', 'शुद्ध' और 'चर्मरोग' जैसे पद लैव्यव्यवस्था के विधिक-धार्मिक संदर्भ को स्पष्ट रखते हैं। मूल के וְהִנֵּה को हिन्दी में स्वाभाविक निरीक्षण-वाक्य 'और देखे कि' द्वारा व्यक्त किया गया है।
