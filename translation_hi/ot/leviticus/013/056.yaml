base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/056.yaml
  text: But if the priest examines it[a], and behold, the spot has faded after it was washed, then he shall tear it out of the garment, or out of the leather, or out of the warp, or out of the woof.
translation:
  language: hi
  text: लेकिन यदि याजक जाँच करे और देखे कि धोए जाने के बाद दाग फीका पड़ गया है, तो वह उस दाग वाले हिस्से को वस्त्र, चमड़े, ताने या बाने[a] में से फाड़कर निकाल दे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ताना कपड़े में लंबाई की दिशा के धागे होते हैं और बाना उनके आर-पार बुने जाने वाले धागे।
    reason: तकनीकी वस्त्र-शब्दों की स्पष्टता
lexical_decisions:
- source_word: וְאִם
  choice: लेकिन यदि
  rationale: यह पिछले निर्देश से जुड़ी हुई एक वैकल्पिक स्थिति प्रस्तुत करता है; ‘लेकिन यदि’ संयोजन और हल्के विरोध—दोनों को व्यक्त करता है।
- source_word: רָאָה הַכֹּהֵן
  choice: याजक जाँच करने पर देखे
  rationale: मूल क्रिया का अर्थ ‘देखना’ है, पर इस विधिक प्रसंग में यह निरीक्षण भी सूचित करती है; यह वाक्यांश दोनों भाव बनाए रखता है।
- source_word: וְהִנֵּה
  choice: देखे कि
  rationale: हिन्दी में अलग से ‘देखो’ रखने पर विधिक वाक्य अस्वाभाविक होता; ‘देखे कि’ परिणाम की ओर ध्यान खींचने वाले भाव को सहज रूप में समेटता है।
- source_word: כֵּהָה הַנֶּגַע
  choice: दाग फीका पड़ गया है
  rationale: כֵּהָה तीव्रता घटने या मंद पड़ने को और נֶגַע यहाँ सामग्री पर प्रभावित चिह्न को दर्शाता है।
- source_word: אַחֲרֵי הֻכַּבֵּס אֹתוֹ
  choice: धोए जाने के बाद
  rationale: हिब्रू के कर्मवाच्य रूप को स्वाभाविक हिन्दी कर्मवाच्य में रखा गया है।
- source_word: וְקָרַע אֹתוֹ
  choice: उस दाग वाले हिस्से को … फाड़कर निकाल दे
  rationale: संदर्भ से हटाया जाने वाला भाग प्रभावित हिस्सा है; यह अनुवाद पूरे पदार्थ को फाड़ने का भ्रम रोके बिना क्रिया की कठोरता बनाए रखता है।
- source_word: מִן הַבֶּגֶד
  choice: वस्त्र में से
  rationale: בֶּגֶד के लिए ‘वस्त्र’ व्यापक, स्पष्ट और इस विधिक प्रसंग के अनुकूल है।
- source_word: מִן הָעוֹר
  choice: चमड़े में से
  rationale: यहाँ עוֹר मानव त्वचा नहीं, उपयोग की जाने वाली खाल या चमड़े की वस्तु है।
- source_word: מִן הַשְּׁתִי
  choice: ताने में से
  rationale: यह करघे पर लंबाई की दिशा वाले धागों का मानक हिन्दी वस्त्र-तकनीकी शब्द है।
- source_word: מִן הָעֵרֶב
  choice: बाने में से
  rationale: यह ताने के आर-पार जाने वाले धागों का मानक हिन्दी वस्त्र-तकनीकी शब्द है और हिब्रू के विशिष्ट भेद को बनाए रखता है।
