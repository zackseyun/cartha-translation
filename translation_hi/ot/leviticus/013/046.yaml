source:
  edition: WLC
  text: כָּל יְמֵ֞י אֲשֶׁ֨ר הַ/נֶּ֥גַע בּ֛/וֹ יִטְמָ֖א טָמֵ֣א ה֑וּא בָּדָ֣ד יֵשֵׁ֔ב מִ/ח֥וּץ לַֽ/מַּחֲנֶ֖ה מוֹשָׁבֽ/וֹ־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/046.yaml
  text: All the days that the disease is in him[a], he shall be unclean. He is unclean. He shall live alone[b]; his dwelling shall be outside the camp.
translation:
  language: hi
  text: जब तक उसमें रोग[a] रहेगा, वह अशुद्ध[b] रहेगा। वह अशुद्ध है। वह अकेला रहेगा; उसका निवास छावनी के बाहर होगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘रोग’ के स्थान पर ‘पीड़ा’, ‘प्रकोप’ या ‘रोगग्रस्त दशा’ भी संभव है। इब्रानी शब्द व्यापक है और यहाँ इस अध्याय में जाँची गई दशा को दर्शाता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ ‘अशुद्ध’ व्यवस्था के अनुसार अशुद्धता की स्थिति को दर्शाता है; इसका अर्थ आवश्यक रूप से नैतिक दोष नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: הַנֶּגַע
  choice: रोग
  rationale: נֶגַע व्यापक शब्द है, जिसका अर्थ आघात, पीड़ा या रोगग्रस्त दशा हो सकता है। लैव्यव्यवस्था 13 में यह जाँची-परखी गई शारीरिक दशा को दर्शाता है; इसलिए आधुनिक हिन्दी में ‘रोग’ स्पष्ट है, जबकि इसकी व्यापकता पादटिप्पणी में सुरक्षित रखी गई है।
- source_word: בּוֹ
  choice: उसमें
  rationale: पूर्वसर्ग का अर्थ ‘उसमें/उस पर’ हो सकता है। ‘रोग’ के साथ ‘उसमें’ स्वाभाविक हिन्दी है और मूल की अर्थ-सीमा को बनाए रखता है।
- source_word: יִטְמָא
  choice: अशुद्ध रहेगा
  rationale: यहाँ क्रिया लैव्यव्यवस्था के अनुसार अशुद्धता की स्थिति बताती है। प्रसंग में रोग के बने रहने जितनी अवधि की बात होने के कारण ‘अशुद्ध रहेगा’ कानूनी और कालगत भाव स्पष्ट करता है।
- source_word: טָמֵא הוּא
  choice: वह अशुद्ध है
  rationale: यह स्वतंत्र, क्रियारहित उपवाक्य व्यक्ति की स्थिति को बल देकर दोहराता है। अलग वाक्य रखने से मूल का जोर सुरक्षित रहता है।
- source_word: בָּדָד
  choice: अकेला
  rationale: בָּדָד अलग या अकेले रहने को दर्शाता है। ‘अकेला’ सीधा और सहज हिन्दी रूप है; ‘एकांतवास में’ अनावश्यक रूप से चिकित्सकीय या प्रशासनिक अर्थ जोड़ सकता है।
- source_word: יֵשֵׁב
  choice: रहे
  rationale: ישב का अर्थ बैठना, रहना या निवास करना हो सकता है। इस निवास-संबंधी नियम में ‘रहे’ स्वाभाविक और सटीक है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह वाक्यांश समुदाय की छावनी की सीमा से बाहर रहने का स्थान बताता है। ‘छावनी के बाहर’ मरुभूमि के प्रसंग में स्पष्ट और प्रचलित अनुवाद है।
- source_word: מוֹשָׁבוֹ
  choice: उसका निवास
  rationale: מוֹשָׁב निवास या रहने के स्थान को दर्शाता है। ‘उसका निवास’ संक्षिप्त, गरिमापूर्ण और मूल के ठोस स्थानबोध के अनुरूप है।
theological_decisions:
- issue: लैव्यव्यवस्था 13 में अशुद्धता का स्वरूप
  choice: मुख्य पाठ में טמא का अनुवाद ‘अशुद्ध’ किया गया है, बिना ‘अनुष्ठानिक’ या ‘नैतिक’ विशेषण जोड़े।
  alternative: ‘अनुष्ठानिक रूप से अशुद्ध’ अथवा ‘विधि के अनुसार अशुद्ध’
  rationale: पद लैव्यव्यवस्था की व्यवस्था के अंतर्गत अशुद्धता की स्थिति बताता है, पर इब्रानी पाठ केवल ‘अशुद्ध’ कहता है। मुख्य पाठ में उसी व्यापक बाइबलीय श्रेणी को बनाए रखना और पादटिप्पणी में प्रसंग स्पष्ट करना धर्मवैज्ञानिक तनाव को बिना संकुचित किए सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण कानूनी-वर्णनात्मक रूप अपनाया गया है। मूल की पुनरुक्ति ‘वह अशुद्ध है’ को जोर बनाए रखने के लिए अलग वाक्य के रूप में रखा गया है; ‘छावनी’ मरुभूमि-कालीन सामुदायिक परिवेश को स्पष्ट करती है।
