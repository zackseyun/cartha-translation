  text: וְ/רָאָ֣ה הַ/כֹּהֵ֗ן וְ/הִנֵּ֤ה מַרְאֶ֨/הָ֙ שָׁפָ֣ל מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/הּ הָפַ֣ךְ לָבָ֑ן וְ/טִמְּא֧/וֹ הַ/כֹּהֵ֛ן נֶֽגַע צָרַ֥עַת הִ֖וא בַּ/שְּׁחִ֥ין פָּרָֽחָה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/020.yaml
  text: And the priest shall examine it[a], and behold, its appearance is deeper than the skin, and its hair has turned white; then the priest shall pronounce him unclean. It is an outbreak of leprosy; it has broken out in the boil.
translation:
  language: hi
  text: याजक उसकी जाँच करे, और देखे कि वह त्वचा की सतह से धँसा हुआ दिखाई देता है और उस स्थान के बाल सफेद हो गए हैं, तो याजक उस व्यक्ति को अशुद्ध घोषित करे। यह चर्मरोग[a] का घाव है, जो फोड़े में उभरा है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी צָרַעַת का पारंपरिक अनुवाद प्रायः “कोढ़” है; पर लैव्यव्यवस्था में यह शब्द संभवतः आधुनिक हैन्सन रोग तक सीमित न होकर कई गंभीर त्वचा-रोगों के लिए प्रयुक्त हुआ है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँचकर देखे
  rationale: याजकीय निदान के इस संदर्भ में क्रिया केवल देखने नहीं, ध्यानपूर्वक निरीक्षण करने का भाव रखती है।
- source_word: וְהִנֵּה
  choice: यदि
  rationale: यहाँ הִנֵּה निरीक्षण में पाए गए लक्षणों को प्रस्तुत करता है; स्वाभाविक आधुनिक हिन्दी में शर्तसूचक ‘यदि’ उस प्रक्रियात्मक भाव को स्पष्ट करता है।
- source_word: מַרְאֶהָ שָׁפָל מִן הָעוֹר
  choice: वह त्वचा से गहरी दिखाई दे
  rationale: यह मुहावरा प्रभावित स्थान के आसपास की त्वचा से धँसा हुआ दिखने का वर्णन करता है; ‘गहरी दिखाई दे’ मूल के दृश्य-आभास को बनाए रखता है।
- source_word: וּשְׂעָרָהּ הָפַךְ לָבָן
  choice: उसमें के बाल सफेद हो गए हों
  rationale: स्त्रीलिंग प्रत्यय प्रभावित सूजन/स्थान से जुड़ा है; हिन्दी में ‘उसमें के बाल’ स्थानगत संबंध को स्पष्ट और स्वाभाविक बनाता है।
- source_word: וְטִמְּאוֹ
  choice: उस व्यक्ति को अशुद्ध घोषित करे
  rationale: याजक व्यक्ति को अशुद्ध बनाता नहीं, बल्कि विधिवत उसकी अशुद्ध दशा का निर्णय सुनाता है।
- source_word: נֶגַע צָרַעַת
  choice: चर्मरोग का संक्रमण
  rationale: נֶגַע किसी प्रकट घाव या रोग-संक्रमण को और צָרַעַת लैव्यव्यवस्था में आधुनिक हैन्सन रोग से व्यापक त्वचा-संबंधी दशा को सूचित कर सकता है।
- source_word: בַּשְּׁחִין
  choice: फोड़े में
  rationale: שְׁחִין फोड़े या सूजे हुए घाव को दर्शाता है; इस प्रसंग में ‘फोड़ा’ संक्षिप्त और सहज है।
- source_word: פָּרָחָה
  choice: फूट निकला है
  rationale: क्रिया के उगने या फूट निकलने के चित्रात्मक भाव को सुरक्षित रखता है और यहाँ रोग के फोड़े में प्रकट होने को बताता है, अनिवार्यतः पूरे शरीर में फैलने को नहीं।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में צָרַעַת का अनुवाद
  choice: चर्मरोग
  alternative: कोढ़
  rationale: इब्रानी पद आधुनिक हैन्सन रोग तक सीमित नहीं है। ‘चर्मरोग’ अनावश्यक चिकित्सीय विशिष्टता से बचता है, जबकि पादटिप्पणी पारंपरिक अनुवाद से संबंध स्पष्ट करती है।
- issue: याजक की भूमिका और וְטִמְּאוֹ
  choice: अशुद्ध घोषित करे
  alternative: अशुद्ध कर दे
  rationale: पाठ में याजक निदानात्मक और विधिक घोषणा करता है; अनुवाद यह संकेत नहीं देता कि वही व्यक्ति में अशुद्धता उत्पन्न करता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘याजक’ और ‘अशुद्ध’ जैसे स्थापित बाइबलीय-विधिक शब्द बनाए गए हैं; वाक्य-विन्यास हिन्दी की स्वाभाविक निदानात्मक शैली के अनुसार है।
