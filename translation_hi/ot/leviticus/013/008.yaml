  text: וְ/רָאָה֙ הַ/כֹּהֵ֔ן וְ/הִנֵּ֛ה פָּשְׂתָ֥ה הַ/מִּסְפַּ֖חַת בָּ/ע֑וֹר וְ/טִמְּא֥/וֹ הַ/כֹּהֵ֖ן צָרַ֥עַת הִֽוא׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/008.yaml
  text: And the priest shall examine him[a], and behold, if the scaly eruption has spread on the skin, the priest shall pronounce him unclean; it is leprosy.
translation:
  language: hi
  text: और याजक उसकी जाँच करे। यदि पपड़ीदार चकत्ता त्वचा पर फैल गया हो, तो याजक उसे अशुद्ध ठहराए; यह चर्मरोग[a] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: त्साराअत; इसका पारंपरिक अनुवाद ‘कुष्ठ रोग’ है, पर लैव्यव्यवस्था में यह शब्द संभवतः केवल आधुनिक कुष्ठ रोग नहीं, बल्कि विभिन्न त्वचा-दशाओं को समेटता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: याजकीय निदान के इस संदर्भ में क्रिया केवल देखने नहीं, ध्यानपूर्वक निरीक्षण करने का भाव रखती है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था की विधिक सामग्री में כהן के लिए मानक, गरिमापूर्ण हिन्दी पद।
- source_word: וְהִנֵּה
  choice: यदि वह देखे कि
  rationale: शाब्दिक रूप से ‘और देखो’ है, पर यहाँ निरीक्षण में पाई गई स्थिति प्रस्तुत होती है; यह हिन्दी में स्वाभाविक ढंग से शर्त और प्रत्यक्ष निष्कर्ष दोनों व्यक्त करता है।
- source_word: פָּשְׂתָה
  choice: फैल गया है
  rationale: यह क्रिया त्वचा की दशा के बढ़ने या विस्तृत होने को बताती है, जो अध्याय में मुख्य निदान-चिह्न है।
- source_word: הַמִּסְפַּחַת
  choice: पपड़ीदार चकत्ता
  rationale: यह किसी सतही त्वचा-विकार या उभार को सूचित करता है; यह चयन केवल ‘पपड़ी’ से व्यापक और ‘चकत्ता’ से अधिक विशिष्ट है।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: עוֹר का सीधा अर्थ त्वचा है और हिन्दी में इस दशा के स्थान के लिए ‘त्वचा पर’ स्वाभाविक है।
- source_word: וְטִמְּאוֹ
  choice: उसे अशुद्ध ठहराए
  rationale: याजक उस व्यक्ति को अशुद्ध बनाता नहीं, बल्कि विधिपूर्वक उसकी अशुद्ध स्थिति घोषित करता है।
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: यह इब्रानी पद आधुनिक कुष्ठ रोग तक सीमित नहीं है और लैव्यव्यवस्था में त्वचा की कई गंभीर दशाओं को समेट सकता है।
- source_word: הִוא
  choice: यह ... है
  rationale: स्त्रीलिंग सर्वनाम पूर्वोक्त त्वचा-दशा की पहचान करता है; हिन्दी में ‘यह ... है’ स्वाभाविक है।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में צָרַעַת का अनुवाद
  choice: चर्मरोग
  alternative: कुष्ठ रोग; अशुद्ध करने वाला चर्मरोग; त्साराअत
  rationale: इब्रानी शब्द का अर्थ आधुनिक हैन्सन रोग से अधिक व्यापक है। ‘चर्मरोग’ झूठी चिकित्सकीय विशिष्टता से बचता है, जबकि पादटिप्पणी पारंपरिक अनुवाद और शब्द की व्यापकता स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और गरिमापूर्ण शैली रखी गई है। ‘याजक’, ‘अशुद्ध ठहराए’ और ‘चर्मरोग’ सामान्य पाठक के लिए बोधगम्य हैं; वाक्य-विन्यास मूल की निरीक्षण-घोषणा संरचना को स्पष्ट रखता है।
