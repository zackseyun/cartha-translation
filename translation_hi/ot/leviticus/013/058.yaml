source:
  edition: WLC
  text: וְ/הַ/בֶּ֡גֶד אֽוֹ הַ/שְּׁתִ֨י אוֹ הָ/עֵ֜רֶב אֽוֹ כָל כְּלִ֤י הָ/עוֹר֙ אֲשֶׁ֣ר תְּכַבֵּ֔ס וְ/סָ֥ר מֵ/הֶ֖ם הַ/נָּ֑גַע וְ/כֻבַּ֥ס שֵׁנִ֖ית וְ/טָהֵֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/058.yaml
  text: But the garment[a], or the warp, or the woof, or any article of leather that you wash, and the infection departs from them, shall be washed a second time and be clean.
translation:
  language: hi
  text: पर जिस वस्त्र, ताने, बाने या चमड़े की किसी वस्तु को तुम धोओ और उसमें से दाग मिट जाए, उसे दूसरी बार धोया जाए; तब वह शुद्ध हो जाएगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: הַבֶּגֶד
  choice: वस्त्र
  rationale: यह בגד का सामान्य और गरिमापूर्ण हिन्दी रूप है तथा कपड़े या पहनावे की वस्तु के अर्थ को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַשְּׁתִי
  choice: ताना
  rationale: बुनाई में लंबाई की दिशा में लगाए गए धागों के लिए मानक हिन्दी तकनीकी शब्द।
- source_word: הָעֵרֶב
  choice: बाना
  rationale: ताना के आर-पार बुने जाने वाले धागों के लिए मानक हिन्दी शब्द और שׁתי का स्वाभाविक युग्म।
- source_word: כָל כְּלִי הָעוֹר
  choice: चमड़े की किसी वस्तु
  rationale: כְּלִי का अर्थ यहाँ व्यापक है; 'वस्तु' इसे किसी विशेष पात्र या औज़ार तक सीमित नहीं करता।
- source_word: תְּכַבֵּס
  choice: तुम धोओ
  rationale: द्वितीय पुरुष एकवचन संबोधन और वस्त्रादि को धोने की क्रिया दोनों को सीधे बनाए रखता है।
- source_word: הַנָּגַע
  choice: दूषित दाग
  rationale: सामग्री पर दिखाई देने वाले दूषण को समझने योग्य ढंग से व्यक्त करता है, पर उसे किसी निश्चित आधुनिक रोग या फफूँदी के रूप में नहीं पहचानता।
- source_word: וְסָר מֵהֶם
  choice: और उसमें से दूषित दाग मिट जाए
  rationale: וְ के समन्वयकारी रूप को बनाए रखते हुए हिन्दी में परिणामात्मक-शर्तीय संबंध स्वाभाविक रूप से व्यक्त होता है; एक-एक वैकल्पिक वस्तु के संदर्भ में 'उसमें' प्रयोग किया गया है।
- source_word: וְכֻבַּס שֵׁנִית
  choice: उसे दूसरी बार धोया जाए
  rationale: इब्रानी कर्मवाच्य और दोबारा धोने के प्रक्रियात्मक निर्देश को सुरक्षित रखता है।
- source_word: וְטָהֵר
  choice: तब वह शुद्ध होगा
  rationale: लैव्यव्यवस्था के अनुष्ठानिक संदर्भ में טהר के लिए 'शुद्ध' उपयुक्त है; 'तब' क्रम और परिणति को स्पष्ट करता है।
theological_decisions:
- issue: טהר की अनुष्ठानिक अभिव्यक्ति
  choice: शुद्ध होगा
  alternative: साफ़ हो जाएगा
  rationale: '''शुद्ध'' केवल भौतिक सफ़ाई नहीं, बल्कि विधान के अनुसार स्वच्छ ठहरने की स्थिति भी व्यक्त करता है।'
- issue: וְסָר के संबंध का स्वरूप
  choice: समन्वित उपवाक्य—'और ... मिट जाए'
  alternative: स्पष्ट शर्त—'यदि ... मिट जाए'
  rationale: मूल में स्वतंत्र शर्तसूचक शब्द नहीं है; हिन्दी वाक्यरचना संदर्भगत शर्त को समझने योग्य रखते हुए इब्रानी संयोजक को भी बचाती है।
translation_notes:
  register: आधुनिक मानक हिन्दी; विधानात्मक परंतु सहज शैली। 'ताना-बाना' सामान्यतः समझे जाने वाले बुनाई-संबंधी शब्द हैं, इसलिए अलग पादटिप्पणी आवश्यक नहीं मानी गई।
