  text: But on the day living flesh appears in it, he shall be unclean.
translation:
  language: hi
  text: पर जिस दिन उसमें[a] जीवित मांस दिखाई दे, वह अशुद्ध ठहरेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में ‘उसमें’ है। इसका पूर्वसंदर्भ प्रसंग में व्यक्ति/उसका शरीर या चर्मरोगी स्थान समझा जा सकता है।
    reason: हिब्रू सर्वनाम בּוֹ की संदर्भगत अस्पष्टता को बिना किसी एक व्याख्या को अनिवार्य किए स्पष्ट करता है।
lexical_decisions:
- source_word: בָּשָׂר חַי
  choice: जीवित मांस
  rationale: इस पद में रोगग्रस्त त्वचा के बीच दिखाई देने वाले कच्चे या जीवित ऊतक का संकेत है; शाब्दिक अभिव्यक्ति संदर्भ की चिकित्सकीय छवि और अगले पद से संबंध बनाए रखती है।
- source_word: בּוֹ
  choice: उस चर्मरोग में
  rationale: पुंलिंग एकवचन सर्वनाम का संदर्भ निकटवर्ती रोग/घाव की दशा से है। स्पष्ट संज्ञा देकर हिंदी में अस्पष्ट 'उसमें' से बचा गया है, बिना इसे व्यक्ति पर लागू किए।
- source_word: יִטְמָא
  choice: वह अशुद्ध ठहरेगा
  rationale: यह अनुष्ठानिक स्थिति की घोषणा है, नैतिक दोष की नहीं; 'ठहरेगा' याजकीय निर्णय का भाव व्यक्त करता है।
- source_word: וּבְיוֹם
  choice: पर जिस दिन
  rationale: वाव यहाँ पिछले नियम के विपरीत परिस्थिति प्रस्तुत करता है; 'पर' इस विरोध को स्वाभाविक हिंदी में रखता है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: अनुष्ठानिक स्थिति के रूप में 'अशुद्ध ठहरेगा'
  alternative: '''अपवित्र हो जाएगा'''
  rationale: लैव्यव्यवस्था के इस प्रसंग में טמא याजकीय/अनुष्ठानिक वर्गीकरण बताता है; 'अपवित्र' हिंदी में नैतिक या आध्यात्मिक दोष का अनावश्यक संकेत दे सकता है।
- issue: בּוֹ का पूर्वसंदर्भ
  choice: रोगग्रस्त दशा—'उस चर्मरोग में'
  alternative: व्यक्ति—'उसमें/उसके शरीर में'
  rationale: संदर्भ और अंग्रेज़ी परामर्श-पाठ का नवीनतम निर्णय इसे रोग/घाव की दशा की ओर संकेत मानता है; इसलिए व्यक्ति-केंद्रित अर्थ नहीं अपनाया गया।
translation_notes:
  register: आधुनिक, सहज और गरिमापूर्ण हिंदी। 'चर्मरोग' प्रसंग को स्पष्ट करता है, जबकि 'जीवित मांस' मूल की ठोस और कुछ हद तक तकनीकी अभिव्यक्ति को सुरक्षित रखता है।
