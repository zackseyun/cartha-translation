base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/005.yaml
  text: And the priest shall examine him on the seventh day[a], and behold, if the spot has remained unchanged in his sight and the spot has not spread in the skin[c][b], then the priest shall isolate him for seven days a second time.
translation:
  language: hi
  text: सातवें दिन याजक उसकी जाँच करे। और देखो, यदि वह चिह्न[a] याजक को पहले जैसा ही दिखाई दे[b] और त्वचा में न फैला हो, तो याजक उसे दूसरी बार सात दिन के लिए अलग रखे[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “विकार” अथवा “निशान”; इब्रानी נֶגַע (नेगा) यहाँ याजक द्वारा जाँचे जा रहे दिखाई देने वाले त्वचा-चिह्न को बताता है, अनिवार्य रूप से आधुनिक चिकित्सा द्वारा परिभाषित रोग को नहीं।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप से, “चिह्न याजक की आँखों में स्थिर रहा”; अर्थात जाँच करने पर याजक को वह पहले जैसा ही दिखाई दिया।
    reason: lexical_alternative
  - marker: c
    text: या “बंद रखे”; इब्रानी क्रिया का शाब्दिक भाव किसी को बंद या सीमित करके रखना है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָהוּ
  choice: उसकी जाँच करे
  rationale: यद्यपि ראה का मूल अर्थ ‘देखना’ है, इस याजकीय प्रक्रिया में इसका आशय ध्यानपूर्वक निरीक्षण करना है।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: निश्चित और क्रमिक समय को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וְהִנֵּה
  choice: और देखो
  rationale: निरीक्षण के परिणाम की ओर ध्यान खींचने वाले इब्रानी कथन-सूचक को बनाए रखता है।
- source_word: הַנֶּגַע
  choice: वह चिह्न
  rationale: נגע यहाँ निरीक्षण के अधीन दिखाई देने वाले त्वचा-विकार या निशान को बताता है; ‘चिह्न’ आधुनिक चिकित्सकीय निदान आरोपित नहीं करता।
- source_word: עָמַד בְּעֵינָיו
  choice: याजक को पहले जैसा ही दिखाई दे
  rationale: शाब्दिक मुहावरा ‘उसकी आँखों में स्थिर रहा’ है; इसका आशय है कि निरीक्षण करने वाले याजक को उसकी दशा बदली हुई न दिखे।
- source_word: לֹא פָשָׂה
  choice: न फैला हो
  rationale: निदानात्मक संदर्भ में פשׂה का स्वाभाविक अर्थ फैलना या बढ़ना है।
- source_word: בָּעוֹר
  choice: त्वचा में
  rationale: עור का अर्थ ‘त्वचा’ है और इब्रानी पूर्वसर्ग को ‘में’ से व्यक्त किया गया है।
- source_word: וְהִסְגִּירוֹ
  choice: उसे ... अलग रखे
  rationale: क्रिया का मूल भाव बंद या सीमित करके रखना है; ‘अलग रखे’ अनुष्ठानिक-प्रक्रियात्मक पृथक्करण को बिना आधुनिक चिकित्सकीय अर्थ थोपे स्पष्ट करता है।
- source_word: שִׁבְעַת יָמִים שֵׁנִית
  choice: दूसरी बार सात दिन के लिए
  rationale: अलग रखने की सात-दिवसीय अवधि के दोहराव को स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
