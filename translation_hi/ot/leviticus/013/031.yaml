- source_word: שֵׂעָר שָׁחֹר
  choice: काला बाल
  rationale: रंग-संबंधी स्पष्ट निदान-चिह्न को सामान्यीकृत किए बिना मूल के अनुसार रखा गया है।
- source_word: וְהִסְגִּיר
