base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/031.yaml
  text: And if the priest examines the diseased area of the scaly outbreak[a], and indeed its appearance is not deeper than the skin and there is no black hair in it, then the priest shall isolate the diseased area of the scaly outbreak for seven days.
translation:
  language: hi
  text: और यदि याजक पपड़ीदार त्वचा-रोग[a] के प्रभावित भाग की जाँच करे और देखे कि वह त्वचा से गहरा दिखाई नहीं देता और उसमें काला बाल नहीं है, तो याजक उस पपड़ीदार त्वचा-रोग के प्रभावित भाग को सात दिन तक अलग रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी נֶתֶק एक विशिष्ट त्वचा या सिर की त्वचा की दशा का नाम है; इसका ठीक आधुनिक रोग-नाम अनिश्चित है। इसका अनुवाद ‘खाज’ या पारंपरिक रूप से ‘स्कैल’ भी किया जाता है।
    reason: lexical_alternative
