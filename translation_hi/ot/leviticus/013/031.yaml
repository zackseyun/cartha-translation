  choice: और जब
  rationale: पूर्ववर्ती नियमों से संबंध बनाए रखता है; इस विधिक प्रसंग में अपेक्षित मामले को हिन्दी में सहज ढंग से प्रस्तुत करता है।
- source_word: יִרְאֶה
  choice: जाँच करे
  rationale: शाब्दिक ‘देखे’ यहाँ याजकीय निरीक्षण की प्रक्रिया है; ‘जाँच करे’ प्रसंगगत अर्थ को स्पष्ट करता है।
