base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/044.yaml
  text: He is a leprous man; he is unclean[a]. The priest shall surely pronounce him unclean; his disease is on his head.
translation:
  language: hi
  text: वह चर्मरोग[a] से पीड़ित पुरुष है; वह अशुद्ध है। याजक अवश्य उसे अशुद्ध ठहराए; उसका रोग उसके सिर पर है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “कोढ़ी पुरुष।” इब्रानी शब्द इस अध्याय में वर्णित चर्मरोग को सूचित करता है; यह आवश्यक नहीं कि वह आधुनिक कुष्ठ रोग (हैनसेन रोग) ही हो।'
    reason: lexical_alternative
lexical_decisions:
- source_word: אִישׁ צָרוּעַ
  choice: चर्मरोग से पीड़ित पुरुष
  rationale: इब्रानी पद एक पुरुष को उस रोगावस्था से ग्रस्त बताता है जिसकी जाँच इस अध्याय में की गई है। ‘चर्मरोग’ आधुनिक हैनसेन रोग की अनावश्यक विशिष्टता से बचता है, और ‘पुरुष’ मूल के पुल्लिंग एकवचन को बनाए रखता है।
- source_word: טָמֵא הוּא
  choice: वह अशुद्ध है
  rationale: लैव्यव्यवस्था में यह पद अनुष्ठानिक अशुद्धता की स्थिति बताता है; ‘अशुद्ध’ इसका प्रचलित और स्पष्ट हिन्दी समतुल्य है।
- source_word: טַמֵּא יְטַמְּאֶנּוּ
  choice: उसे अवश्य ही अशुद्ध घोषित करे
  rationale: क्रिया के साथ infinitive absolute कथन को बल देता है। याजक व्यक्ति को अशुद्ध बनाता नहीं, बल्कि उसकी स्थिति आधिकारिक रूप से घोषित करता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: उपासना-संबंधी जाँच और घोषणा करने वाले अधिकारी के लिए मानक बाइबिलीय हिन्दी शब्द।
- source_word: בְּרֹאשׁוֹ
  choice: उसके सिर पर
  rationale: मूल पाठ स्थान को सामान्य रूप से ‘सिर पर’ बताता है; संदर्भ खोपड़ी का है, फिर भी अनुवाद मूल की व्यापक अभिव्यक्ति बनाए रखता है।
- source_word: נִגְעוֹ
  choice: उसका रोग
  rationale: इस प्रसंग में נגע जाँची गई व्याधि अथवा घाव को सूचित करता है। ‘रोग’ सहज आधुनिक हिन्दी है और ‘महामारी’ जैसे भ्रामक अर्थ से बचता है।
theological_decisions:
- issue: अशुद्धता का स्वरूप
  choice: याजक उसे अशुद्ध घोषित करता है
  alternative: याजक उसे अशुद्ध करता है
  rationale: इस निदान-संबंधी विधान में याजक विद्यमान अनुष्ठानिक स्थिति की आधिकारिक घोषणा करता है; अनुवाद उसे उस स्थिति का कारण नहीं बनाता।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘चर्मरोग’ चिकित्सकीय अति-विशिष्टता से बचता है, जबकि ‘अशुद्ध’ और ‘याजक’ लैव्यव्यवस्था के अनुष्ठानिक संदर्भ को बनाए रखते हैं।
