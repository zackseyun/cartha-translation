  text: then he shall shave himself[a], but he shall not shave the scaly spot[b]; and the priest shall isolate the scaly spot for seven days a second time.
translation:
  language: hi
  text: तब वह अपने बाल मुँड़वाए[a], पर उस पपड़ीदार प्रभावित स्थान को न मुँड़वाए[b]; और याजक उस प्रभावित स्थान को फिर सात दिन के लिए अलग रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात वह स्वयं अपने बाल मूँड़े या उन्हें किसी से मुँड़वाए।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में सीधे कहा गया है, “उस प्रभावित स्थान को न मुँड़वाए।” नֶתֶक सिर या दाढ़ी की एक विशेष, किंतु ठीक-ठीक अनिश्चित, त्वचा-अवस्था है, जिसमें पपड़ी और बाल झड़ना हो सकता है। संभवतः प्रभावित भाग के बाल इसलिए छोड़े जाते थे कि आसपास के बाल हटाने के बाद याजक उसका ठीक से निरीक्षण कर सके।
    reason: cultural_note
lexical_decisions:
- source_word: וְהִתְגַּלָּח
  choice: तब वह अपने बाल मुँड़वाए
  rationale: 'हित्पएल रूप का आत्मवाचक/कारक भाव है: प्रभावित व्यक्ति स्वयं बाल मूँड़े या मुँड़वाए। हिंदी में ‘अपने बाल मुँड़वाए’ स्वाभाविक है और क्रमसूचक वाव को ‘तब’ व्यक्त करता है।'
- source_word: הַנֶּתֶק
  choice: दादवाला स्थान
  rationale: नֶתֶק सिर या दाढ़ी में होने वाली विशेष विकृति है, जिसमें बाल झड़ सकते हैं; ‘दाद’ आधुनिक पाठक के लिए त्वचा के प्रभावित, पपड़ीदार स्थान का सहज संकेत देता है, जबकि ‘स्थान’ उसके सीमित क्षेत्र को स्पष्ट करता है।
- source_word: לֹא יְגַלֵּחַ
  choice: न मुँड़वाए
  rationale: निषेधयुक्त अपूर्ण क्रिया कानूनी निर्देश में मनाही व्यक्त करती है।
- source_word: וְהִסְגִּיר
  choice: अलग रखे
  rationale: यह निरीक्षण की अवधि के लिए पृथक रखने का भाव देता है; ‘अलग रखे’ आधुनिक और सहज है तथा अनावश्यक आधुनिक चिकित्सकीय अर्थ नहीं जोड़ता।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के विधिक संदर्भ में כֹּהֵן का मानक हिंदी रूप।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह पहले हो चुकी सात दिन की अवधि के बाद उसी प्रक्रिया की पुनरावृत्ति स्पष्ट करता है।
