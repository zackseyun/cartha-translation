base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/006.yaml
  text: Then the priest shall examine him again on the seventh day[a], and if the infection has faded and the infection has not spread in the skin, the priest shall pronounce him clean; it is a scaly eruption. He shall wash his clothes and be clean.
translation:
  language: hi
  text: फिर सातवें दिन याजक उसकी दूसरी बार जाँच करे। यदि घाव फीका पड़ गया हो और वह त्वचा में न फैला हो, तो याजक उसे शुद्ध ठहराए; वह एक पपड़ीदार त्वचा-विकृति है[a]। वह अपने कपड़े धोए और शुद्ध हो जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चकत्ता।” इब्रानी शब्द अपेक्षाकृत हल्की त्वचा-विकृति को दर्शाता है, न कि फैलने वाली अधिक गंभीर दशा को।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: याजक के आधिकारिक निरीक्षण के संदर्भ में यह केवल देखने नहीं, बल्कि जाँच करने को व्यक्त करता है।
- source_word: שֵׁנִית
  choice: दूसरी बार
  rationale: यह पुनः किए जाने वाले निरीक्षण को स्पष्ट और स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: כֵּהָה
  choice: फीका पड़ गया हो
  rationale: यह घाव के रंग या तीव्रता के मंद पड़ने का निरीक्षणात्मक अर्थ देता है।
- source_word: הַנֶּגַע
  choice: घाव
  rationale: यह त्वचा पर दिखाई देने वाली विकृति के लिए सहज, गैर-तकनीकी शब्द है और आधुनिक अर्थ में निश्चित संक्रमण का दावा नहीं करता।
- source_word: פָשָׂה
  choice: फैला न हो
  rationale: त्वचा पर विकृति के विस्तार के संदर्भ में मूल क्रिया का सीधा अर्थ है।
- source_word: בָּעוֹר
  choice: त्वचा में
  rationale: पूर्वसर्ग और संज्ञा के निकट रहते हुए निदानात्मक संदर्भ को स्वाभाविक हिंदी में रखता है।
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: याजक उसे शुद्ध ठहराए
  rationale: यह याजक द्वारा धार्मिक-विधिक शुद्धता का निर्णय सुनाने को व्यक्त करता है, न कि उसके द्वारा शारीरिक उपचार करने को।
- source_word: מִסְפַּחַת
  choice: पपड़ीदार चकत्ता
  rationale: यह अपेक्षाकृत हल्की त्वचा-विकृति का बोध कराता है; शब्द का सटीक चिकित्सकीय स्वरूप अनिश्चित होने के कारण विकल्प पादटिप्पणी में दिया गया है।
- source_word: וְכִבֶּס בְּגָדָיו
  choice: वह अपने कपड़े धोए
  rationale: आधुनिक हिंदी में सहज रहते हुए मूल निर्देश को सीधे व्यक्त करता है।
- source_word: וְטָהֵר
  choice: शुद्ध हो जाए
  rationale: धुलाई के बाद प्राप्त धार्मिक-विधिक स्थिति को व्यक्त करता है, शारीरिक चंगाई को नहीं।
theological_decisions:
- issue: धार्मिक-विधिक शुद्धता का निर्णय बनाम शारीरिक चंगाई
  choice: शुद्ध ठहराए; ... शुद्ध हो जाए
  alternative: उसे चंगा घोषित करे; वह ठीक हो जाए
  rationale: अध्याय का प्रसंग याजकीय जाँच और शुद्ध-अशुद्ध स्थिति का है। इसलिए अनुवाद उपचार या पूर्ण शारीरिक चंगाई का दावा नहीं करता।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘याजक’ और ‘शुद्ध’ जैसे स्थापित बाइबलीय शब्द विधिक-धार्मिक संदर्भ को बनाए रखते हैं; अनावश्यक आधुनिक चिकित्सकीय निदान से बचा गया है।
