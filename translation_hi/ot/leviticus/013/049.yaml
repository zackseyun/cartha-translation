  edition: WLC
  text: וְ/הָיָ֨ה הַ/נֶּ֜גַע יְרַקְרַ֣ק א֣וֹ אֲדַמְדָּ֗ם בַּ/בֶּגֶד֩ א֨וֹ בָ/ע֜וֹר אֽוֹ בַ/שְּׁתִ֤י אוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר נֶ֥גַע צָרַ֖עַת ה֑וּא וְ/הָרְאָ֖ה אֶת הַ/כֹּהֵֽן׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/049.yaml
  text: And if the spot is greenish or reddish in the garment[a], or in the leather, or in the warp or in the woof, or in any article of leather, it is a diseased spot of skin disease[b], and it shall be shown to the priest.
translation:
  language: hi
  text: यदि वस्त्र में, चमड़े में, ताने या बाने में, अथवा चमड़े की किसी भी वस्तु में वह दाग हरा-सा या लाल-सा हो, तो वह साराअत[a] का दाग है; उसे याजक को दिखाया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी शब्द ‘साराअत’ लैव्यव्यवस्था में मनुष्यों, वस्त्रों और चमड़े पर दिखाई देने वाली एक व्यापक पुरोहितीय जाँच-श्रेणी के लिए प्रयुक्त है। इसका परंपरागत अनुवाद प्रायः ‘कोढ़’ किया गया है, पर यह केवल आधुनिक कुष्ठ रोग को नहीं दर्शाता।
    reason: मूल शब्द की व्यापक पुरोहितीय श्रेणी स्पष्ट करना और आधुनिक चिकित्सकीय अर्थ से भ्रामक समानता से बचाना।
lexical_decisions:
- source_word: נֶגַע
  choice: दाग
  rationale: यहाँ शब्द वस्त्र या चमड़े पर दिखाई देने वाले प्रभावित स्थान को दर्शाता है। ‘दाग’ आधुनिक हिन्दी में स्वाभाविक है और निर्जीव सामग्री के लिए भी उपयुक्त है।
- source_word: יְרַקְרַק
  choice: हरापन लिए
  rationale: द्विरुक्त रूप हरे रंग की छाया या झलक व्यक्त करता है; यह अनुवाद किसी अधिक विशिष्ट रंगत को थोपे बिना उस भाव को सुरक्षित रखता है।
- source_word: אֲדַמְדָּם
  choice: लालिमा लिए
  rationale: द्विरुक्त रूप शुद्ध गहरे लाल रंग के बजाय लाल रंग की झलक दर्शाता है।
- source_word: בֶּגֶד
  choice: वस्त्र
  rationale: यह गरिमापूर्ण और सामान्य हिन्दी शब्द है, जो प्रसंग में कपड़े से बनी वस्तु को ठीक प्रकार व्यक्त करता है।
- source_word: עוֹר
  choice: चमड़ा
  rationale: यहाँ जीवित त्वचा नहीं, वस्तुओं में प्रयुक्त पशु-चर्म की सामग्री अभिप्रेत है।
- source_word: שְׁתִי
  choice: ताना
  rationale: बुनाई में लंबाई की दिशा में रहने वाले धागों के लिए यह प्रचलित हिन्दी तकनीकी शब्द है।
- source_word: עֵרֶב
  choice: बाना
  rationale: बुनाई में आड़ी दिशा में बुने जाने वाले धागों के लिए यह प्रचलित हिन्दी शब्द है और ‘ताना’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: כְּלִי עוֹר
  choice: चमड़े की किसी भी वस्तु
  rationale: यह व्यापक अभिव्यक्ति चमड़े से बने किसी पात्र, उपकरण या अन्य सामान को समेटती है, बिना उसका प्रकार सीमित किए।
- source_word: נֶגַע צָרַעַת
  choice: साराअत का दाग
  rationale: צָרַעַת लैव्यव्यवस्था की एक विशिष्ट पुरोहितीय जाँच-श्रेणी है, जो मनुष्य के अतिरिक्त वस्त्र और चमड़े पर भी लागू होती है। लिप्यंतरण इसे आधुनिक कुष्ठ रोग या किसी निश्चित फफूँद से गलत ढंग से समान ठहराने से बचाता है; पादटिप्पणी इसका अर्थ स्पष्ट करती है।
- source_word: וְהָרְאָה אֶת־הַכֹּהֵן
  choice: उसे याजक को दिखाया जाए
  rationale: हिब्रू का होफ़ाल रूप कर्मवाच्य है और दिखाने वाले व्यक्ति को अनिर्दिष्ट छोड़ता है; हिन्दी कर्मवाच्य उसी केंद्रबिंदु को बनाए रखता है।
theological_decisions:
- issue: पुरोहितीय विधान में צָרַעַת का अनुवाद
  choice: साराअत
  alternative: कोढ़ / कुष्ठ रोग / चर्मरोग
  rationale: यह श्रेणी वस्त्र और चमड़े पर भी लागू है, इसलिए इसे आधुनिक हैन्सन रोग या केवल त्वचा के रोग के रूप में प्रस्तुत करना भ्रामक होगा। लिप्यंतरण मूल की विशिष्ट और कुछ हद तक अनिश्चित श्रेणी को बनाए रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘ताना-बाना’ के परिचित वस्त्र-शब्द अपनाए गए हैं। वाक्य को हिन्दी की स्वाभाविक शर्तात्मक संरचना में रखा गया है, जबकि अंतिम कर्मवाच्य मूल हिब्रू के अनिर्दिष्ट कर्ता को सुरक्षित रखता है।
