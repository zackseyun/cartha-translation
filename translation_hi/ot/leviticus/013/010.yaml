    issue: The phrase 'यदि त्वचा पर ... हो' introduces an explicit conditional absent from the Hebrew observation.
    rationale: וְהִנֵּה introduces what the priest finds on inspection, not an 'if' clause. Although procedural contexts can imply conditions, the explicit conditional and following subjunctives weaken the direct observational force.
  - severity: low
