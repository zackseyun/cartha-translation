  choice: जाँच करे
  rationale: इस निदान-संबंधी विधिक प्रसंग में क्रिया का अर्थ केवल देखना नहीं, बल्कि ध्यान से निरीक्षण करना है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था की शुद्धता-संबंधी व्यवस्था में अधिकृत निरीक्षक के लिए प्रचलित और गरिमापूर्ण शब्द।
- source_word: וְהִנֵּה
  choice: यदि ... हो
  rationale: हिब्रू का ध्यान आकृष्ट करने वाला पद यहाँ निरीक्षण में पाई गई दशाओं का परिचय देता है; हिंदी की विधिक शर्त-शैली में इसे स्वाभाविक रूप से समाहित किया गया है।
- source_word: שְׂאֵת
  choice: सूजन
  rationale: यह इस अध्याय में त्वचा के उभरे हुए घाव या चिह्न का तकनीकी पद है; 'सूजन' सामान्य पाठक के लिए स्पष्ट है।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: यह त्वचा में प्रकट होने वाली दशा को स्वाभाविक आधुनिक हिंदी में व्यक्त करता है।
- source_word: וְהִיא הָפְכָה שֵׂעָר לָבָן
  choice: उसने बालों को सफेद कर दिया हो
  rationale: स्त्रीलिंग सर्वनाम का संबंध सूजन से है; अनुवाद कारणात्मक संरचना को बनाए रखता है।
- source_word: וּמִחְיַת בָּשָׂר חַי
  choice: जीवित कच्चा मांस दिखाई दे
  rationale: '''जीवित मांस'' की शाब्दिक छवि और घाव में दिखने वाले खुले, कच्चे ऊतक का निदानात्मक अर्थ दोनों सुरक्षित रखे गए हैं।'
- source_word: בַּשְׂאֵת
  choice: उस सूजन में
  rationale: मांस की स्थिति घाव के भीतर बताता है और שְׂאֵת के अनुवाद में संगति रखता है।
