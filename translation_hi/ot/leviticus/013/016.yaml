  text: Or if the raw flesh turns back and becomes white[a], then he shall come to the priest.
translation:
  language: hi
  text: या यदि कच्चा मांस फिर से लौट आए और सफेद हो जाए[a], तो वह याजक के पास आए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ, ‘जीवित मांस।’
    reason: lexical_alternative
lexical_decisions:
- source_word: אוֹ כִּי
  choice: या यदि
  rationale: אוֹ वैकल्पिक स्थिति प्रस्तुत करता है और כִּי यहाँ शर्त सूचित करता है; दोनों को मिलाकर ‘या यदि’ स्वाभाविक और सटीक है।
- source_word: יָשׁוּב
  choice: फिर से
  rationale: שׁוב पहले की अवस्था में लौटने का भाव देता है; ‘फिर से’ सफेद हो जाने की पुनरावृत्ति/वापसी को सहज हिन्दी में व्यक्त करता है।
- source_word: הַבָּשָׂר הַחַי
  choice: कच्चा मांस
  rationale: शाब्दिक अर्थ ‘जीवित मांस’ है, पर इस रोग-परीक्षण के संदर्भ में यह दिखाई देने वाले कच्चे मांस या जीवित ऊतक को दर्शाता है; ‘कच्चा मांस’ सामान्य पाठक के लिए स्पष्ट है और शाब्दिक रूप पादटिप्पणी में रखा गया है।
- source_word: וְנֶהְפַּךְ לְלָבָן
  choice: सफेद हो जाए
  rationale: निफ़अल रूप अवस्था-परिवर्तन बताता है; ‘सफेद हो जाए’ इसे स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וּבָא אֶל הַכֹּהֵן
  choice: तो वह याजक के पास आए
  rationale: यह शर्त के बाद अगला विधिक-प्रक्रियात्मक कदम है; ‘तो’ परिणाम-संबंध स्पष्ट करता है और ‘याजक के पास आए’ गति तथा निर्देश दोनों को बनाए रखता है।
