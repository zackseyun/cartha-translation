  text: וְ/אִם בַּהֶרֶת֩ לְבָנָ֨ה הִ֜וא בְּ/ע֣וֹר בְּשָׂר֗/וֹ וְ/עָמֹק֙ אֵין מַרְאֶ֣/הָ מִן הָ/ע֔וֹר וּ/שְׂעָרָ֖/ה לֹא הָפַ֣ךְ לָבָ֑ן וְ/הִסְגִּ֧יר הַ/כֹּהֵ֛ן אֶת הַ/נֶּ֖גַע שִׁבְעַ֥ת יָמִֽים־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/004.yaml
  text: But if the bright spot is white in the skin of his flesh[a], and its appearance is not deeper than the skin, and its hair has not turned white[c][b], then the priest shall isolate the affected area for seven days.
translation:
  language: hi
  text: पर यदि उसके शरीर की त्वचा पर चमकीला सफेद धब्बा हो[a], और वह देखने में त्वचा से धँसा हुआ न दिखाई दे, और उसके बाल सफेद न हुए हों, तो याजक उस प्रभावित स्थान[b] को सात दिन तक अलग रखेगा[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “चमकीला चकत्ता” अथवा “उजला निशान।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी शब्द का अर्थ “घाव,” “त्वचा-विकार” या उससे प्रभावित स्थान हो सकता है; यहाँ अभी किसी विशेष रोग का निश्चित निदान नहीं बताया गया है।
    reason: lexical_alternative
  - marker: c
    text: अर्थात निरीक्षण के लिए अस्थायी रूप से अलग रखेगा; इसे “एकांत में रखेगा” भी अनुवाद किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: בַּהֶרֶת לְבָנָה
  choice: चमकीला सफेद धब्बा
  rationale: בַּהֶרֶת त्वचा पर दिखाई देने वाले चमकीले या उजले चिह्न को और לְבָנָה उसके सफेद रंग को व्यक्त करता है। यह अनुवाद दोनों विशेषताओं को स्वाभाविक आधुनिक हिन्दी में रखता है।
- source_word: בְּעוֹר בְּשָׂרוֹ
  choice: उसके शरीर की त्वचा पर
  rationale: शाब्दिक 'उसके मांस की त्वचा में' हिन्दी में अस्वाभाविक और भ्रामक हो सकता है; यहाँ בשר व्यक्ति के शरीर को सूचित करता है। हिन्दी में त्वचा के चिह्न के लिए 'पर' स्वाभाविक है।
- source_word: וְעָמֹק אֵין מַרְאֶהָ מִן־הָעוֹר
  choice: वह देखने में त्वचा से गहरा न हो
  rationale: यह वाक्यांश आसपास की त्वचा की तुलना में घाव की दिखाई देने वाली गहराई का निदानात्मक वर्णन करता है।
- source_word: וּשְׂעָרָהּ לֹא־הָפַךְ לָבָן
  choice: उसके बाल सफेद न हुए हों
  rationale: प्रत्यय उस धब्बे से संबंधित बाल को सूचित करता है और הפך यहाँ रंग बदलने की अवस्था बताता है। हिन्दी में यह संक्षिप्त और सहज है।
- source_word: וְהִסְגִּיר
  choice: अलग रखेगा
  rationale: क्रिया जाँच और निरीक्षण के लिए अस्थायी रूप से अलग रखने का निर्देश देती है। 'अलग रखेगा' सामान्य पाठक के लिए स्पष्ट है, जबकि 'बन्द करेगा' भ्रामक हो सकता है।
- source_word: אֶת־הַנֶּגַע
  choice: उस प्रभावित स्थान
  rationale: נגע यहाँ याजक द्वारा जाँचे जा रहे त्वचा के प्रभावित चिह्न या स्थान को दर्शाता है; 'महामारी' या निश्चित रोग कहना अर्थ को अनावश्यक रूप से सीमित करेगा।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: यह अलग रखे जाने और निरीक्षण की अवधि को स्वाभाविक हिन्दी में व्यक्त करता है।
