  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज शैली रखी गई है। 'याजक' लैव्यव्यवस्था के धार्मिक पद के लिए प्रचलित बाइबलीय शब्द है। मूल पाठ के निदानात्मक, दृश्य और अस्थायी स्वरूप को बनाए रखते हुए आधुनिक चिकित्सकीय निदान थोपने से बचा गया है।
