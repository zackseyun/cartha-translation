  text: וְ/רָאָ֣ה אֹתָ֣/הּ הַ/כֹּהֵ֡ן וְ/הִנֵּ֣ה נֶהְפַּךְ֩ שֵׂעָ֨ר לָבָ֜ן בַּ/בַּהֶ֗רֶת וּ/מַרְאֶ֨/הָ֙ עָמֹ֣ק מִן הָ/ע֔וֹר צָרַ֣עַת הִ֔וא בַּ/מִּכְוָ֖ה פָּרָ֑חָה וְ/טִמֵּ֤א אֹת/וֹ֙ הַ/כֹּהֵ֔ן נֶ֥גַע צָרַ֖עַת הִֽוא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/025.yaml
  text: And the priest shall examine it[a], and behold, the hair in the bright spot has turned white and its appearance is deeper than the skin, it is a skin disease that has broken out in the burn scar; and the priest shall pronounce him unclean. It is an infection of skin disease.
translation:
  language: hi
  text: याजक उसकी जाँच करे, और देखो, उस उजले चकत्ते के बाल सफेद हो गए हैं और वह त्वचा से गहरा दिखाई देता है, तो यह चर्म-रोग[a] है जो जले हुए स्थान पर फूट निकला है। याजक उस व्यक्ति को अशुद्ध घोषित करे; वह चर्म-रोग का घाव है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'इब्रानी: त्सारा-अत—गंभीर त्वचा-विकारों के लिए प्रयुक्त एक व्यापक शब्द; परंपरागत रूप से इसका अनुवाद ‘कोढ़’ किया गया है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: רָאָה
  choice: जाँच करे
  rationale: याजकीय निदान के इस प्रसंग में क्रिया केवल देखने नहीं, बल्कि औपचारिक निरीक्षण और मूल्यांकन को व्यक्त करती है।
- source_word: בַּהֶרֶת
  choice: उजला चकत्ता
  rationale: यह त्वचा पर दिखाई देने वाले चमकीले या उजले विकार को दर्शाता है; यह चयन सहज और चिकित्सकीय अति-विशिष्टता से मुक्त है।
- source_word: נֶהְפַּךְ שֵׂעָר לָבָן
  choice: बाल सफेद हो गए हैं
  rationale: यह बालों के सफेद हो जाने के निदानात्मक चिह्न को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: מַרְאֶהָ עָמֹק מִן־הָעוֹר
  choice: वह त्वचा से गहरा दिखाई देता है
  rationale: यह मूल पाठ के दृश्य आभास और त्वचा की सतह से नीचे धँसे दिखने, दोनों को बनाए रखता है।
- source_word: צָרַעַת
  choice: चर्म-रोग
  rationale: यह इब्रानी शब्द आधुनिक हैन्सन रोग से अधिक व्यापक अनुष्ठानिक-त्वचा संबंधी श्रेणी है; ‘चर्म-रोग’ भ्रामक चिकित्सकीय समानता से बचता है।
- source_word: מִכְוָה
  choice: जला हुआ स्थान
  rationale: संज्ञा जलने से प्रभावित स्थान या उसके परिणाम को सूचित करती है; ‘जला हुआ स्थान’ मूल की सीमा में रहते हुए स्पष्ट है।
- source_word: פָּרָחָה
  choice: फूट निकला है
  rationale: त्वचा-विकार के संदर्भ में यह किसी विकार के उभरने या फैलकर प्रकट होने का स्वाभाविक वर्णन है।
- source_word: טִמֵּא אֹתוֹ
  choice: उस व्यक्ति को अशुद्ध घोषित करे
  rationale: याजक अशुद्धता उत्पन्न नहीं करता, बल्कि अनुष्ठानिक स्थिति पर अधिकृत निर्णय सुनाता है।
- source_word: נֶגַע צָרַעַת
  choice: चर्म-रोग का घाव
  rationale: נגע यहाँ दिखाई देने वाले रोगग्रस्त घाव या प्रभावित स्थान को दर्शाता है; ‘घाव’ संक्रमणशीलता का अनावश्यक दावा नहीं करता।
theological_decisions:
- issue: लैव्यव्यवस्था की शुद्धता-विधि में צָרַעַת का अनुवाद
  choice: चर्म-रोग
  alternative: कोढ़; अशुद्ध करने वाला चर्म-रोग
  rationale: यह शब्द आधुनिक ‘कुष्ठ रोग’ या हैन्सन रोग तक सीमित नहीं है। ‘चर्म-रोग’ व्यापक अर्थ बनाए रखता है और पाठ में आधुनिक चिकित्सकीय पहचान नहीं जोड़ता।
- issue: याजक द्वारा अशुद्ध किए जाने का अर्थ
  choice: अशुद्ध घोषित करे
  alternative: अशुद्ध कर दे
  rationale: यहाँ याजक का कार्य व्यक्ति की अनुष्ठानिक स्थिति पर निर्णय देना है, न कि उसे कारणतः अशुद्ध बनाना।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और विधिक-याजकीय शैली रखी गई है। ‘और देखो’ से וְהִנֵּה की ध्यानाकर्षक शक्ति बचाई गई है, जबकि ‘यदि’ निदानात्मक परिस्थिति को हिन्दी में स्पष्ट करता है।
