  - marker: a
    text: शाब्दिक अर्थ ‘मांस’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וּבָשָׂר
  choice: किसी व्यक्ति का शरीर
  rationale: בָשָׂר का मूल अर्थ ‘मांस’ है, पर इस जाँच-संबंधी विधिक प्रसंग में यह व्यक्ति के शरीर को सूचित करता है; आधुनिक हिन्दी में ‘किसी व्यक्ति का शरीर’ अधिक स्वाभाविक और स्पष्ट है।
- source_word: כִּי
  choice: जब
  rationale: यहाँ כִּי विधिक मामले की परिस्थिति प्रस्तुत करता है। ‘जब’ लैव्यव्यवस्था की प्रक्रियात्मक शैली में स्वाभाविक है, यद्यपि ‘यदि’ भी संभव है।
- source_word: יִהְיֶה בּוֹ בְעֹרוֹ
  choice: की त्वचा पर ... हो
  rationale: शाब्दिक दोहरे स्थान-सूचक विन्यास को हिन्दी में स्वाभाविक ढंग से ‘शरीर की त्वचा पर’ कहा गया है। ‘पर’ त्वचा पर दिखाई देने वाले घाव के संदर्भ में सहज है।
- source_word: שְׁחִין
  choice: फोड़ा
  rationale: שְׁחִין फोड़े या सूजे हुए घाव को सूचित करता है; ‘फोड़ा’ संक्षिप्त, प्रचलित और प्रसंगानुकूल चिकित्सकीय शब्द है।
- source_word: וְנִרְפָּא
  choice: और वह ठीक हो जाए
  rationale: रפא के निफ़अल रूप को यहाँ परिणामसूचक अकर्मक भाव में प्रस्तुत किया गया है। ‘वह’ निकटवर्ती ‘फोड़ा’ की ओर संकेत करता है; कर्मवाच्य ‘चंगा किया जाए’ अनावश्यक रूप से किसी कर्ता को उभार सकता है।
