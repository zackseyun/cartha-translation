  text: וְ/שָׂרַ֨ף אֶת הַ/בֶּ֜גֶד א֥וֹ אֶֽת הַ/שְּׁתִ֣י א֣וֹ אֶת הָ/עֵ֗רֶב בַּ/צֶּ֨מֶר֙ א֣וֹ בַ/פִּשְׁתִּ֔ים א֚וֹ אֶת כָּל כְּלִ֣י הָ/ע֔וֹר אֲשֶׁר יִהְיֶ֥ה ב֖/וֹ הַ/נָּ֑גַע כִּֽי צָרַ֤עַת מַמְאֶ֨רֶת֙ הִ֔וא בָּ/אֵ֖שׁ תִּשָּׂרֵֽף־־׀־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/052.yaml
  text: He shall burn the garment[a], or the warp or the woof in wool or in linen, or any article of leather in which the infection is, for it is a destructive skin disease[b]; it shall be burned in the fire.
translation:
  language: hi
  text: वह उस वस्त्र को, या ऊन या सन के ताने या बाने को, या चमड़े की किसी भी वस्तु को जिसमें वह दाग हो, जला दे; क्योंकि यह विनाशकारी त्साराअत[a] है। उसे आग में जला दिया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी צָרַעַת (त्साराअत; जिसका पारंपरिक अनुवाद प्रायः “कोढ़” किया गया है) आधुनिक कोढ़, अर्थात् हैन्सन रोग, तक सीमित नहीं है। लैव्यव्यवस्था में यह अशुद्धता से जुड़ी एक व्यापक अवस्था के लिए प्रयुक्त है और वस्त्रों तथा घरों के दागों के लिए भी लागू होता है।
    reason: सांस्कृतिक और शब्दार्थ-संबंधी टिप्पणी
lexical_decisions:
- source_word: וְשָׂרַף
  choice: वह ... जला दे
  rationale: विधिक क्रम में संयोजक सहित पूर्ण क्रिया अगले अनिवार्य निर्देश को व्यक्त करती है; हिंदी में आज्ञार्थक-विधिक ‘जला दे’ स्वाभाविक है।
- source_word: הַבֶּגֶד
  choice: उस वस्त्र को
  rationale: בגד के सामान्य अर्थ ‘वस्त्र’ को बनाए रखता है और पूर्ववर्ती प्रसंग की निश्चित वस्तु की ओर संकेत करता है।
- source_word: הַשְּׁתִי ... הָעֵרֶב
  choice: ताने या बाने को
  rationale: ये बुनाई के दो तकनीकी और परस्पर पूरक शब्द हैं; आधुनिक हिंदी में मानक युग्म ‘ताना-बाना’ है।
- source_word: בַּצֶּמֶר ... בַפִּשְׁתִּים
  choice: ऊन अथवा सन के
  rationale: यहाँ सामग्री की श्रेणी बताई गई है। פשתים के लिए ‘सन’ मूल रेशे और उससे बने कपड़े, दोनों के प्रसंग में उपयुक्त है।
- source_word: כָּל כְּלִי הָעוֹר
  choice: चमड़े की किसी भी वस्तु को
  rationale: כלי का अर्थ केवल पात्र नहीं, व्यापक रूप से वस्तु या उपयोग की चीज़ भी है; इसलिए यह अनुवाद दायरे को सीमित नहीं करता।
- source_word: אֲשֶׁר יִהְיֶה בוֹ הַנָּגַע
  choice: जिसमें वह दाग हो
  rationale: נגע इस प्रसंग में जाँच योग्य प्रभावित चिह्न को दर्शाता है। ‘दाग’ दृश्य चिह्न को व्यक्त करता है और आधुनिक सूक्ष्मजीवी संक्रमण का अनावश्यक दावा नहीं करता।
- source_word: צָרַעַת מַמְאֶרֶת
  choice: नष्ट करनेवाला चर्म-रोग
  rationale: ממארת के विनाशकारी/क्षयकारी प्रभाव को ‘नष्ट करनेवाला’ व्यक्त करता है। צרעת के पारंपरिक परंतु भ्रामक ‘कोढ़’ से बचते हुए अध्याय की व्यापक शुद्धता-संबंधी श्रेणी को फुटनोट में स्पष्ट किया गया है।
- source_word: בָּאֵשׁ תִּשָּׂרֵף
  choice: उसे आग में जला दिया जाए
  rationale: निफ़अल अपूर्ण क्रिया अपेक्षित निष्क्रिय परिणाम/विधिक आदेश बताती है; यह हिंदी रूप उसी बल को बनाए रखता है।
theological_decisions:
- issue: लैव्यव्यवस्था की अशुद्धता-विधि में צָרַעַת का अनुवाद
  choice: चर्म-रोग[a]
  alternative: कोढ़; अशुद्ध करनेवाला रोग; त्साराअत
  rationale: यह इब्रानी शब्द आधुनिक हैन्सन रोग तक सीमित नहीं है और इसी अध्याय में मनुष्यों के अतिरिक्त वस्त्रों तथा आगे घरों पर भी लागू होता है। मुख्य पाठ में परिचित पर व्यापक पद रखा गया है, जबकि फुटनोट इसकी अनुष्ठानिक और गैर-आधुनिक चिकित्सीय सीमा स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण विधिक शैली। ‘ताना-बाना’ जैसे प्रचलित वस्त्र-तकनीकी शब्द रखे गए हैं। दृश्य נגע के लिए ‘दाग’ चुना गया है ताकि आधुनिक चिकित्सीय ‘संक्रमण’ का अर्थ आरोपित न हो।
