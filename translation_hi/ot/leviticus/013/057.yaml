source:
  edition: WLC
  text: וְ/אִם תֵּרָאֶ֨ה ע֜וֹד בַּ֠/בֶּגֶד אֽוֹ בַ/שְּׁתִ֤י אֽוֹ בָ/עֵ֨רֶב֙ א֣וֹ בְ/כָל כְּלִי ע֔וֹר פֹּרַ֖חַת הִ֑וא בָּ/אֵ֣שׁ תִּשְׂרְפֶ֔/נּוּ אֵ֥ת אֲשֶׁר בּ֖/וֹ הַ/נָּֽגַע־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/057.yaml
  text: But if it appears again in the garment[a], or in the warp, or in the woof, or in any article of leather, it is a spreading outbreak[b]; you shall burn in the fire whatever has the infection in it.
translation:
  language: hi
  text: लेकिन यदि वह कपड़े में, ताने में, बाने में या चमड़े की किसी भी वस्तु में फिर दिखाई दे, तो वह फैल रहा है; जिस वस्तु में यह दाग हो, उसे आग में जला देना।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: תֵּרָאֶה עוֹד
  choice: फिर दिखाई दे
  rationale: निफ़अल रूप निरीक्षण में दाग के दोबारा प्रत्यक्ष होने को व्यक्त करता है; यह स्वाभाविक हिंदी में पुनरावृत्ति और दृश्यता दोनों बनाए रखता है।
- source_word: בֶּגֶד
  choice: कपड़ा
  rationale: इस प्रसंग में शब्द परिधान के साथ वस्त्र-सामग्री को भी सूचित कर सकता है; ताने-बाने के उल्लेख के कारण ‘कपड़ा’ अधिक व्यापक और सहज है।
- source_word: שְׁתִי
  choice: ताना
  rationale: यह बुनाई के लंबाई की दिशा वाले धागों का मानक हिंदी तकनीकी शब्द है।
- source_word: עֵרֶב
  choice: बाना
  rationale: यह ताने के आर-पार बुने जाने वाले धागों का मानक हिंदी शब्द है और ‘ताना’ के साथ स्वाभाविक युग्म बनाता है।
- source_word: כְּלִי עוֹר
  choice: चमड़े की किसी भी वस्तु
  rationale: यह चमड़े या खाल से बनी विविध वस्तुओं के लिए प्रयुक्त व्यापक इब्रानी पदबंध को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: פֹּרַחַת הִוא
  choice: वह फैलता हुआ दाग है
  rationale: פרח का मूल बिंब अंकुरित या फूट निकलने का है, पर यहाँ दाग के सक्रिय रूप से फैलने अथवा फिर उभरने का भाव है; ‘फैलता हुआ’ प्रक्रियात्मक संदर्भ में स्पष्ट है।
- source_word: בָּאֵשׁ תִּשְׂרְפֶנּוּ
  choice: उसे आग में जला देना
  rationale: विधिक आदेश का दृढ़ स्वर सरल आधुनिक हिंदी में रखा गया है।
- source_word: הַנָּגַע
  choice: दाग
  rationale: लैव्यव्यवस्था 13 का यह तकनीकी शब्द प्रभावित या दूषित चिह्न को दर्शाता है; ‘दाग’ आधुनिक रोग-निदान थोपे बिना दृश्य चिह्न का अर्थ देता है।
theological_decisions: []
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और प्रक्रियात्मक विधि के अनुरूप है। ताना-बाना जैसे प्रचलित वस्त्र-तकनीकी शब्द रखे गए हैं। आधुनिक चिकित्सकीय अर्थ वाला ‘संक्रमण’ नहीं अपनाया गया, क्योंकि यहाँ निर्जीव वस्तुओं पर दिखाई देने वाले व्यापक अनुष्ठानिक-निरीक्षण संबंधी נגע का उल्लेख है।
