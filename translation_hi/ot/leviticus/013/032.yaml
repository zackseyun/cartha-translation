base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/032.yaml
  text: And the priest shall examine the diseased area on the seventh day[a], and behold, if the scaly infection has not spread, and there is no yellow hair in it, and the appearance of the scaly infection is not deeper than the skin,
translation:
  language: hi
  text: सातवें दिन याजक उस प्रभावित स्थान की जाँच करे। और यदि पपड़ीदार चकत्ता[a] फैला नहीं है, उसमें पीले बाल नहीं हैं और उसका रूप त्वचा के स्तर से धँसा हुआ दिखाई नहीं देता,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी נֶתֶק सिर या दाढ़ी के भाग में होने वाली एक विशिष्ट पपड़ीदार विकृति के लिए प्रयुक्त है। इसका अनुवाद “खुजली” या पारंपरिक रूप से “सेंहुआ” भी किया गया है; किसी आधुनिक रोग से इसकी ठीक-ठीक पहचान निश्चित नहीं है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जाँच करे
  rationale: याजकीय निदान के प्रसंग में क्रिया का अर्थ केवल देखना नहीं, बल्कि ध्यानपूर्वक निरीक्षण करना है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के धार्मिक और शुद्धता-संबंधी विधान में כֹּהֵן का प्रचलित, स्पष्ट हिन्दी रूप।
- source_word: הַנֶּגַע
  choice: प्रभावित स्थान
  rationale: נֶגַע यहाँ शरीर का रोगग्रस्त या विकृत भाग है; यह अनिवार्यतः आधुनिक अर्थ में संक्रमण नहीं बताता।
- source_word: בַּיּוֹם הַשְּׁבִיעִי
  choice: सातवें दिन
  rationale: निर्धारित पुनःपरीक्षण का सीधा काल-सूचक अनुवाद।
- source_word: וְהִנֵּה
  choice: यदि वह देखे कि
  rationale: निरीक्षण में सामने आए निष्कर्ष का परिचय देता है; हिन्दी विधिक गद्य में शर्त-सदृश प्रवाह स्वाभाविक है, यद्यपि मूल में पृथक शर्तबोधक शब्द नहीं है।
- source_word: לֹא פָשָׂה
  choice: फैला नहीं है
  rationale: त्वचा-संबंधी प्रसंग में פשׂה प्रभावित भाग के फैलने को दर्शाता है।
- source_word: הַנֶּתֶק
  choice: पपड़ीदार चकत्ता
  rationale: यह सिर या दाढ़ी के भाग में होने वाली एक विशिष्ट विकृति का पारिभाषिक नाम है। यह चयन किसी निश्चित आधुनिक रोग-निदान का दावा किए बिना पाठक को उसके दृश्य स्वरूप का संकेत देता है।
- source_word: וְלֹא הָיָה בוֹ שֵׂעָר צָהֹב
  choice: उसमें पीले बाल नहीं हैं
  rationale: निदान के इस लक्षण की अनुपस्थिति और प्रभावित भाग में बालों की स्थिति दोनों स्पष्ट रहती हैं।
- source_word: וּמַרְאֵה הַנֶּתֶק אֵין עָמֹק מִן הָעוֹר
  choice: वह चकत्ता त्वचा से गहरा दिखाई नहीं देता
  rationale: מַרְאֶה के दृश्य-पक्ष को ‘दिखाई’ द्वारा सुरक्षित रखते हुए आसपास की त्वचा की तुलना में धँसा या गहरा न दिखने का अर्थ व्यक्त किया गया है।
