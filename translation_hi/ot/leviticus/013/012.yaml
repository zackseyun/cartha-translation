source:
  edition: WLC
  text: וְ/אִם פָּר֨וֹחַ תִּפְרַ֤ח הַ/צָּרַ֨עַת֙ בָּ/ע֔וֹר וְ/כִסְּתָ֣ה הַ/צָּרַ֗עַת אֵ֚ת כָּל ע֣וֹר הַ/נֶּ֔גַע מֵ/רֹאשׁ֖/וֹ וְ/עַד רַגְלָ֑י/ו לְ/כָל מַרְאֵ֖ה עֵינֵ֥י הַ/כֹּהֵֽן־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/012.yaml
  text: And if the skin disease breaks out all over the skin[a], and the skin disease covers all the skin of the affected person from his head to his feet, as far as the priest can see[b],
translation:
  language: hi
  text: और यदि चर्मरोग त्वचा पर पूरी तरह फैल जाए[a], और चर्मरोग उस रोग से प्रभावित व्यक्ति की सारी त्वचा को सिर से पाँव तक ढक ले—जहाँ तक याजक की आँखें देख सकें[b]—
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी צָרַעַת (त्साराअत) लैव्यव्यवस्था में कई प्रकार के अनुष्ठानिक त्वचा-विकारों को दर्शाता है; इसे केवल आधुनिक कुष्ठ रोग (हैन्सन रोग) नहीं समझना चाहिए।
    reason: cultural_note
  - marker: b
    text: 'अधिक शाब्दिक अनुवाद: “रोगग्रस्त स्थान की सारी त्वचा।” इब्रानी अभिव्यक्ति रोग के प्रकोप से प्रभावित व्यक्ति की त्वचा की ओर संकेत करती है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: פָּרוֹחַ תִּפְרַח
  choice: पूरी तरह फैल जाए
  rationale: इनफिनिटिव ऐब्सोल्यूट और सीमित क्रिया का मेल फैलने की तीव्रता या व्यापकता पर बल देता है। हिंदी में ‘पूरी तरह फैल जाए’ इस व्यापक प्रकोप को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: הַצָּרַעַת
  choice: वह चर्मरोग / चर्मरोग
  rationale: צָרַעַת लैव्यव्यवस्था में विभिन्न अनुष्ठानिक त्वचा-विकारों का नाम है; इसे आधुनिक कुष्ठ रोग (हैन्सन रोग) तक सीमित करना भ्रामक होगा। ‘चर्मरोग’ स्पष्ट और चिकित्सकीय रूप से अनावश्यक रूप से संकीर्ण नहीं है।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: यहाँ בְ शरीर की उस सतह को सूचित करता है जिस पर रोग फैलता है; ‘त्वचा पर’ आधुनिक हिंदी में सहज है।
- source_word: וְכִסְּתָה
  choice: ढक ले
  rationale: शर्तवाचक वाक्यक्रम में यह क्रिया रोग द्वारा त्वचा के पूर्ण आच्छादन को व्यक्त करती है; ‘ढक ले’ संभाव्य शर्त के अनुरूप है।
- source_word: אֵת כָּל עוֹר הַנֶּגַע
  choice: उस रोग से प्रभावित व्यक्ति की ... सारी त्वचा
  rationale: शाब्दिक रूप ‘घाव/रोग की सारी त्वचा’ हिंदी में अस्पष्ट होगा। संदर्भ में आशय रोगग्रस्त व्यक्ति की प्रभावित त्वचा से है; यह अनुवाद उसी आशय को स्पष्ट रखते हुए पादटिप्पणी में शाब्दिक विकल्प देता है।
- source_word: מֵרֹאשׁוֹ וְעַד רַגְלָיו
  choice: सिर से पाँव तक
  rationale: यह संपूर्ण शरीर के विस्तार को बताने वाला युग्म है। ‘सिर से पाँव तक’ स्वाभाविक और स्रोत के पर्याप्त निकट है।
- source_word: לְכָל מַרְאֵה עֵינֵי הַכֹּהֵן
  choice: जहाँ तक याजक की आँखें देख सकें
  rationale: इब्रानी मुहावरा याजक को जाँच में दिखाई देने वाले पूरे क्षेत्र को सूचित करता है। यह हिंदी रूप दृश्य परीक्षण की सीमा को बनाए रखता है।
