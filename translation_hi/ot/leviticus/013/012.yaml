  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। पद 13 की अगली शर्त से व्याकरणिक रूप से जुड़ा है, इसलिए अंत में पूर्णविराम के बजाय डैश और अल्पविराम-सदृश खुला प्रवाह रखा गया है। ‘याजक’ पुरोहितीय संदर्भ का मानक हिंदी बाइबलीय पद है।
