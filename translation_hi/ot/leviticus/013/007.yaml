source:
  edition: WLC
  text: וְ/אִם פָּשֹׂ֨ה תִפְשֶׂ֤ה הַ/מִּסְפַּ֨חַת֙ בָּ/ע֔וֹר אַחֲרֵ֧י הֵרָאֹת֛/וֹ אֶל הַ/כֹּהֵ֖ן לְ/טָהֳרָת֑/וֹ וְ/נִרְאָ֥ה שֵׁנִ֖ית אֶל הַ/כֹּהֵֽן־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/007.yaml
  text: But if the scaly eruption indeed spreads on the skin after he has shown himself to the priest for his cleansing[c][b][a], then he shall appear before the priest a second time.
translation:
  language: hi
  text: परन्तु यदि वह चकत्ता त्वचा पर सचमुच फैल जाए, उसके शुद्ध ठहराए जाने के लिए याजक के सामने अपने को दिखाने के बाद, तो उसे दूसरी बार याजक के सामने उपस्थित होना होगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: פָּשֹׂה תִפְשֶׂה
  choice: सचमुच फैल जाए
  rationale: क्रिया के साथ प्रयुक्त infinitive absolute फैलने पर बल देता है; ‘सचमुच’ इस बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: הַמִּסְפַּחַת
  choice: चकत्ता
  rationale: यह याजकीय जाँच के अधीन त्वचा की सतही अवस्था को सूचित करता है। ‘चकत्ता’ सामान्य पाठक के लिए सहज है और ‘पपड़ी’ की अपेक्षा कम संकीर्ण है।
- source_word: בָּעוֹר
  choice: त्वचा पर
  rationale: यह त्वचा पर उस अवस्था के स्थान को स्वाभाविक हिन्दी में व्यक्त करता है; इब्रानी में कोई स्पष्ट संबंधसूचक सर्वनाम नहीं है।
- source_word: אַחֲרֵי הֵרָאֹתוֹ
  choice: अपने को दिखाने के बाद
  rationale: निफ़ाल रूप यहाँ जाँच के लिए स्वयं को प्रस्तुत करने का भाव देता है; हिन्दी में यह प्रक्रियात्मक अर्थ स्पष्ट करता है।
- source_word: אֶל הַכֹּהֵן
  choice: याजक के सामने
  rationale: पूर्वसर्ग जाँच करने वाले याजक के पास अथवा उसके समक्ष प्रस्तुत होने को दर्शाता है।
- source_word: לְטָהֳרָתוֹ
  choice: शुद्ध ठहराए जाने के लिए
  rationale: इस प्रसंग में विषय याजकीय जाँच के आधार पर विधिगत रूप से शुद्ध घोषित किया जाना है; यह अनुवाद केवल शारीरिक उपचार का अर्थ लेने से बचाता है।
- source_word: וְנִרְאָה שֵׁנִית
  choice: उसे दूसरी बार ... उपस्थित होना होगा
  rationale: विधिक प्रसंग में यह रूप पुनः याजकीय जाँच के लिए उपस्थित होने की अपेक्षा व्यक्त करता है।
theological_decisions:
- issue: לְטָהֳרָתוֹ में शुद्धि का स्वरूप
  choice: शुद्ध ठहराए जाने के लिए
  alternative: शुद्ध होने के लिए
  rationale: अध्याय का प्रसंग याजकीय निरीक्षण और शुद्ध घोषित किए जाने से संबंधित है। चुना हुआ रूप इसे स्पष्ट करता है, पर शुद्धि की व्यापक विधिगत धारणा को नकारता नहीं।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विधिक स्वर रखा गया है। ‘याजक,’ ‘शुद्ध ठहराया जाना,’ और ‘उपस्थित होना होगा’ लैव्यव्यवस्था के निरीक्षण-संबंधी प्रसंग को स्पष्ट रखते हैं।
