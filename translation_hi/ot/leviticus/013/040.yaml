base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/040.yaml
  text: If a man loses the hair of his head[a], he is bald; he is clean.
translation:
  language: hi
  text: यदि किसी पुरुष के सिर के बाल झड़ जाएँ[a], तो वह गंजा है; वह शुद्ध है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यदि किसी पुरुष का सिर गंजा हो जाए।” इब्रानी क्रिया बालों से रहित हो जाने या बाल निकाले जाने का अर्थ दे सकती है; मुख्य पाठ आगे आने वाले “वह गंजा है” से इसका क्रियात्मक भेद बनाए रखता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִישׁ
  choice: किसी पुरुष
  rationale: इब्रानी संज्ञा व्याकरण की दृष्टि से पुल्लिंग एकवचन है और यहाँ कानूनी उदाहरण के रूप में एक पुरुष का मामला प्रस्तुत करती है।
- source_word: כִּי
  choice: यदि
  rationale: इस कानूनी और जाँच-संबंधी प्रसंग में यह एक शर्त अथवा संभावित स्थिति प्रस्तुत करता है।
- source_word: יִמָּרֵט
  choice: बाल झड़ जाएँ
  rationale: מרט का निफ़अल रूप सिर के बालों से रहित हो जाने या बाल निकल जाने को दर्शाता है। यह अभिव्यक्ति कारण को अनावश्यक रूप से निश्चित किए बिना क्रियात्मक भेद बनाए रखती है।
- source_word: רֹאשׁוֹ
  choice: उसके सिर के
  rationale: यह संबंधवाचक रचना स्पष्ट करती है कि बालों का झड़ना सिर से संबंधित है।
- source_word: קֵרֵחַ
  choice: गंजा
  rationale: यह परिणामी अवस्था बताने वाला विशेषण है; आधुनिक हिन्दी में 'गंजा' स्वाभाविक और स्पष्ट है।
- source_word: טָהוֹר
  choice: शुद्ध
  rationale: लैव्यव्यवस्था 13 में यह नैतिक निर्दोषता नहीं, बल्कि अनुष्ठानिक शुद्धता की स्थिति दर्शाता है; 'शुद्ध' इस मुख्य पारिभाषिक भेद को बनाए रखता है।
- source_word: הוּא ... הוּא
  choice: वह ... है; वह शुद्ध है
  rationale: दोनों सर्वनामयुक्त विधेयों को अलग-अलग वाक्यखंडों में रखकर इब्रानी की दोहरी और बलयुक्त घोषणा सुरक्षित की गई है।
theological_decisions:
- issue: लैव्यव्यवस्था की अशुद्धता-संबंधी व्यवस्था में स्थिति का पारिभाषिक शब्द
  choice: शुद्ध
  alternative: साफ़
  rationale: यह पद नैतिक पवित्रता या शारीरिक स्वच्छता का निर्णय नहीं करता, बल्कि अनुष्ठानिक स्थिति घोषित करता है। 'शुद्ध' उस धार्मिक-कानूनी श्रेणी को स्पष्ट रखता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। कानूनी प्रसंग के अनुरूप 'यदि' और अनुष्ठानिक पारिभाषिकता के लिए 'शुद्ध' चुना गया है।
