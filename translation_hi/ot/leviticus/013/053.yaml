base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/053.yaml
  text: But if the priest examines it[a], and behold, the infection has not spread in the garment, or in the warp, or in the woof, or in any article of leather,
translation:
  language: hi
  text: परन्तु यदि याजक जाँच करके देखे कि वह दाग वस्त्र में, या ताने में, या बाने[a] में, या चमड़े की किसी भी वस्तु में नहीं फैला है,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘ताना’ कपड़े के लम्बाई की दिशा में रहने वाले धागे हैं और ‘बाना’ उनके आर-पार बुने जाने वाले धागे।
    reason: तकनीकी वस्त्र-शब्दों को सामान्य पाठक के लिए स्पष्ट करना।
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले निर्देश से जुड़ी हुई शर्त है और पूर्ववर्ती सम्भावना के विपरीत स्थिति प्रस्तुत करती है।
- source_word: יִרְאֶה הַכֹּהֵן וְהִנֵּה
  choice: याजक जाँच करके देखे
  rationale: शाब्दिक ‘देखे’ के साथ याजकीय निरीक्षण का भाव स्पष्ट करने के लिए स्वाभाविक हिन्दी अभिव्यक्ति चुनी गई है।
- source_word: לֹא פָשָׂה
  choice: नहीं फैला है
  rationale: पुनः निरीक्षण के समय पाई गई स्थिति को दर्शाता है; פשה का सामान्य अर्थ यहाँ फैलना है।
- source_word: הַנֶּגַע
  choice: वह दाग
  rationale: वस्त्र या चमड़े में दिखाई देने वाले प्रभावित स्थान के लिए सरल और प्रसंगानुकूल शब्द; इससे किसी आधुनिक रोग-विज्ञान संबंधी निदान को आरोपित नहीं किया जाता।
- source_word: בַּבֶּגֶד
  choice: वस्त्र में
  rationale: בגד के लिए प्रचलित और व्यापक हिन्दी शब्द; उपसर्ग ב को पदार्थ में स्थित दाग के अर्थ में ‘में’ किया गया है।
- source_word: בַשְּׁתִי א֣וֹ בָעֵרֶב
  choice: चाहे ताने में या बाने में
  rationale: कपड़े के लम्बवत और आड़े धागों के लिए हिन्दी के मानक वस्त्र-तकनीकी युग्म ‘ताना-बाना’ का प्रयोग किया गया है।
- source_word: בְּכָל כְּלִי עוֹר
  choice: चमड़े की किसी भी वस्तु में
  rationale: כְּלִי यहाँ किसी भी निर्मित सामान या वस्तु का व्यापक अर्थ रखता है; ‘चमड़ा’ आधुनिक हिन्दी में प्रसंस्कृत पशु-चर्म के लिए स्वाभाविक है।
