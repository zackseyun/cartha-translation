source:
  edition: WLC
  text: וְ/רָאָ֧ה הַ/כֹּהֵ֛ן אֶת הַ/בָּשָׂ֥ר הַ/חַ֖י וְ/טִמְּא֑/וֹ הַ/בָּשָׂ֥ר הַ/חַ֛י טָמֵ֥א ה֖וּא צָרַ֥עַת הֽוּא־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/015.yaml
  text: When the priest sees the raw flesh[a], he shall pronounce him unclean. The raw flesh is unclean[c][b]; it is a skin disease.
translation:
  language: hi
  text: जब याजक उस उघड़े हुए मांस[a] को देखे, तब वह उस व्यक्ति को अशुद्ध ठहराए[b]। वह उघड़ा हुआ मांस अशुद्ध है; यह चर्मरोग[c] है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक अर्थ ‘जीवित मांस’ है; परंपरागत अनुवाद ‘कच्चा मांस’ है।
    reason: lexical_alternative
  - marker: b
    text: अर्थात याजक शुद्धता के विषय में आधिकारिक निर्णय देता है; इसे ‘अशुद्ध घोषित करे’ भी कहा जा सकता है।
    reason: lexical_alternative
  - marker: c
    text: परंपरागत रूप से ‘कोढ़’; पर इब्रानी शब्द आधुनिक कोढ़ (हैन्सन रोग) तक सीमित नहीं, बल्कि अधिक व्यापक त्वचा-दशा को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָאָה
  choice: जब ... देखे
  rationale: विधिक प्रक्रिया में वाव + क़ातल क्रम की अगली परिस्थिति बताता है; आधुनिक हिन्दी में समयसूचक ‘जब ... देखे’ स्वाभाविक है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था में निरीक्षण और शुद्धता-संबंधी निर्णय करने वाले כֹּהֵן के लिए मानक, गरिमापूर्ण हिन्दी पद।
- source_word: הַבָּשָׂר הַחַי
  choice: कच्चा मांस
  rationale: शाब्दिक अर्थ ‘जीवित मांस’ है, पर इस संदर्भ में खुला या उघड़ा जीवित ऊतक अभिप्रेत है। ‘कच्चा मांस’ पारंपरिक अर्थ को बनाए रखते हुए सामान्य हिन्दी में अधिक बोधगम्य है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: וְטִמְּאוֹ
  choice: उस व्यक्ति को अशुद्ध ठहराए
  rationale: पिएल रूप यहाँ याजक के आधिकारिक शुद्धता-निर्णय को व्यक्त करता है, न कि उस व्यक्ति को वास्तव में अशुद्ध बना देने को। ‘उस व्यक्ति’ से पुल्लिंग कर्म-प्रत्यय का संदर्भ स्पष्ट होता है।
- source_word: טָמֵא הוּא
  choice: अशुद्ध है
  rationale: यह लैव्यव्यवस्था की अनुष्ठानिक शुद्धता-श्रेणी का मानक पद है; इसे सामान्य गंदगी के अर्थ में नहीं बदला गया।
- source_word: צָרַעַת
  choice: चर्मरोग
  rationale: यह इब्रानी पद आधुनिक हैन्सन रोग तक सीमित नहीं है। ‘चर्मरोग’ अनावश्यक चिकित्सीय विशिष्टता से बचते हुए इस प्रसंग की व्यापक त्वचा-संबंधी दशा बताता है।
theological_decisions:
- issue: צָרַעַת का अनुवाद
  choice: चर्मरोग
  alternative: कोढ़; अशुद्ध करने वाला चर्मरोग
  rationale: ‘कोढ़’ आधुनिक हैन्सन रोग का भ्रामक संकेत दे सकता है, जबकि मूल पद व्यापक है। ‘चर्मरोग’ मूल की विधिक-अनुष्ठानिक श्रेणी को किसी आधुनिक रोग-निदान से नहीं बाँधता।
- issue: याजक की क्रिया का स्वरूप
  choice: अशुद्ध ठहराए
  alternative: अशुद्ध करे; अशुद्ध घोषित करे
  rationale: वचन में याजक रोग उत्पन्न या व्यक्ति को अशुद्ध नहीं बनाता, बल्कि आधिकारिक निर्णय देता है। ‘ठहराए’ निर्णयात्मक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त विधिक शैली रखी गई है। ‘याजक’, ‘अशुद्ध’ और ‘चर्मरोग’ सामान्य पाठक के लिए बोधगम्य रहते हुए लैव्यव्यवस्था की अनुष्ठानिक शब्दावली और मूल पाठ की चिकित्सीय अनिश्चितता को बनाए रखते हैं।
