  text: וְ/אִם תַּחְתֶּ֜י/הָ תַּעֲמֹ֤ד הַ/בַּהֶ֨רֶת֙ לֹ֣א פָשָׂ֔תָה צָרֶ֥בֶת הַ/שְּׁחִ֖ין הִ֑וא וְ/טִהֲר֖/וֹ הַ/כֹּהֵֽן־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/013/023.yaml
  text: But if the bright spot remains in its place and has not spread[a], it is the scar of the boil, and the priest shall pronounce him clean.
translation:
  language: hi
  text: परन्तु यदि वह उजला धब्बा अपनी जगह पर बना रहे और फैला न हो[a], तो वह फोड़े का निशान है; याजक उसे शुद्ध घोषित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी मुहावरे का शाब्दिक अर्थ ‘उसके नीचे’ है; यहाँ आशय है कि उजला धब्बा अपनी जगह पर रहे, फैले नहीं।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאִם
  choice: परन्तु यदि
  rationale: यह पिछले सम्भावित मामले के विपरीत शर्त प्रस्तुत करता है; इसलिए केवल ‘और यदि’ की अपेक्षा ‘परन्तु यदि’ प्रसंग का विरोध स्पष्ट करता है।
- source_word: תַּחְתֶּיהָ תַּעֲמֹד
  choice: अपनी जगह पर बना रहे
  rationale: शाब्दिक रूप ‘उसके नीचे खड़ा रहे’ है, पर जाँच के इस प्रसंग में आशय धब्बे का उसी स्थान पर सीमित रहना है।
- source_word: הַבַּהֶרֶת
  choice: वह उजला धब्बा
  rationale: यह त्वचा पर दिखाई देने वाले चमकीले या उजले चिह्न को बताता है; ‘उजला धब्बा’ सहज है और किसी विशिष्ट रोग का अनावश्यक निदान नहीं करता।
- source_word: לֹא פָשָׂתָה
  choice: फैला न हो
  rationale: अध्याय में यह क्रिया त्वचा की दशा के फैलने के लिए बार-बार प्रयुक्त है।
- source_word: צָרֶבֶת הַשְּׁחִין
  choice: फोड़े का निशान
  rationale: צָרֶבֶת सूजन या घाव के बाद बचे चिह्न को दर्शाता है और הַשְּׁחִין फोड़े को; संयुक्त पद का स्वाभाविक हिन्दी रूप ‘फोड़े का निशान’ है।
- source_word: וְטִהֲרוֹ הַכֹּהֵן
  choice: याजक उसे शुद्ध घोषित करे
  rationale: पुरोहितीय शुद्धता के प्रसंग में क्रिया व्यक्ति को प्रत्यक्ष रूप से साफ या स्वस्थ करने के बजाय उसकी धार्मिक-सामुदायिक स्थिति को शुद्ध घोषित करने का संकेत देती है।
theological_decisions:
- issue: अनुष्ठानिक शुद्धता बनाम चिकित्सीय चंगाई
  choice: ‘याजक उसे शुद्ध घोषित करे’
  alternative: ‘याजक उसे शुद्ध करे’
  rationale: यह पद याजकीय निरीक्षण और शुद्धता की स्थिति के निर्धारण से सम्बन्धित है, न कि याजक द्वारा रोग को ठीक करने से।
translation_notes:
  register: आधुनिक मानक हिन्दी में सरल, गरिमापूर्ण और विधिक-अनुष्ठानिक भाव वाला रूप। ‘याजक’ लैव्यव्यवस्था के पुरोहितीय प्रसंग के लिए रखा गया है और ‘शुद्ध घोषित करे’ निर्णयात्मक अर्थ को स्पष्ट करता है।
