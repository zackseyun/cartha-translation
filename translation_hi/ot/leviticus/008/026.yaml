  text: וּ/מִ/סַּ֨ל הַ/מַּצּ֜וֹת אֲשֶׁ֣ר לִ/פְנֵ֣י יְהוָ֗ה לָ֠קַח חַלַּ֨ת מַצָּ֤ה אַחַת֙ וְֽ/חַלַּ֨ת לֶ֥חֶם שֶׁ֛מֶן אַחַ֖ת וְ/רָקִ֣יק אֶחָ֑ד וַ/יָּ֨שֶׂם֙ עַל הַ֣/חֲלָבִ֔ים וְ/עַ֖ל שׁ֥וֹק הַ/יָּמִֽין׀־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/026.yaml
  text: And from the basket of unleavened bread that was before Yahweh[a], he took one unleavened cake, one cake of bread with oil, and one wafer, and put them on the fat portions and on the right thigh.
translation:
  language: hi
  text: और याहवे के सामने रखी हुई अखमीरी रोटियों की टोकरी में से उसने एक अखमीरी रोटी, तेल वाली एक रोटी[a] और एक पतली रोटी ली। फिर उसने उन्हें चर्बी के भागों और दाहिनी जाँघ पर रख दिया।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “तेल से गूँथी हुई एक रोटी।” इब्रानी पद रोटी के तेल से तैयार किए जाने का संकेत देता है, लेकिन तेल इस्तेमाल करने की ठीक विधि स्पष्ट नहीं करता।
    reason: lexical_alternative
lexical_decisions:
- source_word: מִסַּל הַמַּצּוֹת
  choice: अखमीरी रोटियों की टोकरी में से
  rationale: מִן स्रोत को और סַל टोकरी को दर्शाता है; הַמַּצּוֹת यहाँ अनुष्ठान में प्रयुक्त अखमीरी रोटी की वस्तुओं के लिए है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह उपासना-संबंधी वाक्यांश याहवे की उपस्थिति में रखे या प्रस्तुत किए जाने का भाव देता है।
- source_word: חַלַּת מַצָּה אַחַת
  choice: एक अखमीरी रोटी
  rationale: חַלָּה रोटी या रोटी-जैसी टिकिया को बताता है; सरल हिंदी में ‘रोटी’ वस्तु और उसके अखमीरी होने दोनों को स्पष्ट रखती है।
- source_word: חַלַּת לֶחֶם שֶׁמֶן אַחַת
  choice: तेल वाली एक रोटी
  rationale: इब्रानी पद रोटी का तेल से संबंध बताता है, पर यह स्पष्ट नहीं करता कि तेल उसमें मिलाया गया था या किसी और प्रकार से लगाया गया था; इसलिए अनिर्दिष्ट संबंध सुरक्षित रखा गया है।
- source_word: רָקִיק אֶחָד
  choice: एक पतली रोटी
  rationale: רָקִיק बलि में प्रयुक्त पतली, चपटी रोटी को दर्शाता है; ‘पतली रोटी’ सामान्य हिंदी पाठक के लिए स्पष्ट है।
- source_word: הַחֲלָבִים
  choice: चरबी के भागों
  rationale: बहुवचन शब्द बलि के लिए निर्धारित चरबीदार टुकड़ों को दर्शाता है, न कि सामान्य रूप से चरबी को।
- source_word: שׁוֹק הַיָּמִין
  choice: दाहिनी जाँघ
  rationale: बलि-पशु के अंग के संदर्भ में שׁוֹק जाँघ या ऊपरी टाँग के हिस्से को दर्शाता है; ‘दाहिनी जाँघ’ सटीक और प्रचलित है।
- source_word: וַיָּשֶׂם
  choice: फिर उसने उन्हें ... रख दिया
  rationale: क्रिया का कर्ता मूसा है और रखी गई वस्तुएँ पहले बताई गई तीन रोटियाँ हैं; हिंदी में बहुवचन सर्वनाम स्वाभाविक है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में वाचा का विशिष्ट नाम יְהוָה है। ‘याहवे’ उसे उपाधि में बदले बिना सीधे प्रस्तुत करता है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। लंबी इब्रानी वाक्य-रचना को स्पष्टता के लिए दो हिंदी वाक्यों में बाँटा गया है। ‘तेल वाली’ मूल की वास्तविक अस्पष्टता को बनाए रखता है, जबकि पादटिप्पणी संभावित विशिष्ट अर्थ बताती है।
