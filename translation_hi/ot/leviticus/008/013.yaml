  text: וַ/יַּקְרֵ֨ב מֹשֶׁ֜ה אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יַּלְבִּשֵׁ֤/ם כֻּתֳּנֹת֙ וַ/יַּחְגֹּ֤ר אֹתָ/ם֙ אַבְנֵ֔ט וַ/יַּחֲבֹ֥שׁ לָ/הֶ֖ם מִגְבָּע֑וֹת כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/013.yaml
  text: Then Moses brought Aaron’s sons near[a], and clothed them with tunics, and girded them with sashes, and bound caps on them[c][b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: फिर मूसा हारून के पुत्रों को पास ले आया[a], उन्हें कुरते पहनाए, उनकी कमर पर पटुके बाँधे[b] और उनके सिरों पर टोपियाँ बाँधीं—ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “हारून के पुत्रों को प्रस्तुत किया।” इब्रानी क्रिया का अर्थ “पास लाना” हो सकता है और अनुष्ठानिक प्रसंग में “प्रस्तुत करना” भी।
    reason: lexical_alternative
  - marker: b
    text: शाब्दिक रूप में “उन्हें पटुका बाँधा”; आशय है कि हर पुत्र की कमर पर उसका याजकीय पटुका बाँधा गया।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: पास ले आया
  rationale: हिफ़ील क्रिया का मूल अर्थ ‘निकट लाना’ है; यह अभिषेक-संस्कार के प्रसंग में प्रस्तुत करने का भाव भी रखती है, जिसे पाद-टिप्पणी में सुरक्षित रखा गया है।
- source_word: בְּנֵי אַהֲרֹן
  choice: हारून के पुत्रों
  rationale: इब्रानी संबंधवाचक पदबंध का सीधा और स्वाभाविक हिन्दी रूप।
- source_word: וַיַּלְבִּשֵׁם כֻּתֳּנֹת
  choice: उन्हें कुरते पहनाए
  rationale: כֻּתֹּנֶת लंबे, कमीज़-जैसे मूल वस्त्र को दर्शाता है; ‘कुरते’ आधुनिक हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: וַיַּחְגֹּר אֹתָם אַבְנֵט
  choice: उनकी कमर पर पटुके बाँधे
  rationale: חגר कमर कसने अथवा बाँधने और אַבְנֵט याजकीय कपड़े के कमरबंद को दर्शाता है। इब्रानी में एकवचन संज्ञा बहुवचन व्यक्तियों के साथ वितरणात्मक अर्थ रखती है।
- source_word: וַיַּחֲבֹשׁ לָהֶם מִגְבָּעוֹת
  choice: उनके सिरों पर टोपियाँ बाँधीं
  rationale: חבשׁ केवल पहनाने के बजाय बाँधने का संकेत देता है, और מִגְבָּעוֹת साधारण याजकों के विशिष्ट सिर-वस्त्र हैं, जो महायाजक की पगड़ी से अलग हैं।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: यह आवर्ती अनुपालन-सूत्र आदेश के अनुरूप ठीक-ठीक किए गए कार्य पर बल देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: मूल पाठ के व्यक्तिगत ईश्वरीय नाम YHWH को हिन्दी में प्रचलित नामरूप ‘यहोवा’ से व्यक्त किया गया है, न कि किसी उपाधि से।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: प्रभु / याहवे
  rationale: मूल में व्यक्तिगत नाम YHWH है। ‘यहोवा’ हिन्दी बाइबलीय परंपरा में व्यापक रूप से पहचाना जाने वाला नामरूप है और इसे उपाधि ‘प्रभु’ से अलग रखता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। याजकीय वस्त्रों के लिए ‘कुरते’, ‘पटुके’ और ‘टोपियाँ’ जैसे स्पष्ट हिन्दी शब्द चुने गए हैं; क्रियाओं में मूल के अनुष्ठानिक और ठोस भाव को यथासंभव बनाए रखा गया है।
