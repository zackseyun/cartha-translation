source:
  edition: WLC
  text: וַ/יִּקַּ֞ח אֶת הַ/חֵ֣לֶב וְ/אֶת הָֽ/אַלְיָ֗ה וְ/אֶֽת כָּל הַ/חֵלֶב֮ אֲשֶׁ֣ר עַל הַ/קֶּרֶב֒ וְ/אֵת֙ יֹתֶ֣רֶת הַ/כָּבֵ֔ד וְ/אֶת שְׁתֵּ֥י הַ/כְּלָיֹ֖ת וְ/אֶֽת חֶלְבְּ/הֶ֑ן וְ/אֵ֖ת שׁ֥וֹק הַ/יָּמִֽין־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/025.yaml
  text: Then he took the fat[a], and the fat tail, and all the fat that was on the entrails, and the lobe of the liver, and the two kidneys with their fat, and the right thigh.
translation:
  language: hi
  text: तब उसने चरबी, चरबीदार पूँछ, अंतड़ियों पर की सारी चरबी, कलेजे का लोब[a], दोनों गुर्दे और उन पर की चरबी, और दाहिनी जाँघ ली।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद “कलेजे का उपांग” भी हो सकता है। इब्रानी शब्द बलिदान की विधि में निकाले जाने वाले एक विशिष्ट भाग को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब उसने … ली
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ क्रम को स्वाभाविक हिंदी में व्यक्त करता है। क्रिया को सूची के अंत में रखना हिंदी वाक्य-विन्यास के अनुरूप है।
- source_word: הַחֵלֶב
  choice: चरबी
  rationale: बलिदान की विधि में अलग किए जाने वाले वसायुक्त भागों के लिए यह सीधा और सामान्य हिंदी शब्द है।
- source_word: הָאַלְיָה
  choice: चरबीदार पूँछ
  rationale: यह सामान्य पूँछ नहीं, बल्कि भेड़ की मोटी, वसायुक्त पूँछ को सूचित करता है।
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: अंतड़ियों पर की सारी चरबी
  rationale: यहाँ קֶרֶב बलिदान-संबंधी शारीरिक संदर्भ में भीतरी अंगों या आँतों के क्षेत्र को दर्शाता है; ‘अंतड़ियाँ’ सहज और ठोस अभिव्यक्ति है।
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: कलेजे का उभरा हुआ भाग
  rationale: यह बलिदान में निकाले जाने वाले कलेजे के एक विशिष्ट भाग या उपांग को सूचित करता है। ‘उभरा हुआ भाग’ मूल शब्द की शारीरिक धारणा को समझने योग्य हिंदी में रखता है, जबकि सटीक पहचान की अनिश्चितता पादटिप्पणी में सुरक्षित है।
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: द्विवचन को स्वाभाविक हिंदी में ‘दोनों’ से व्यक्त किया गया है।
- source_word: חֶלְבְּהֶן
  choice: उन पर की चरबी
  rationale: स्त्रीलिंग बहुवचन प्रत्यय गुर्दों से जुड़ी चरबी को दर्शाता है; यह हिंदी में शारीरिक संबंध स्पष्ट करता है।
- source_word: שׁוֹק הַיָּמִין
  choice: दाहिनी जाँघ
  rationale: שׁוֹק बलिदान के संदर्भ में टाँग के ऊपरी, मांसल भाग को दर्शाता है; ‘जाँघ’ सामान्य ‘टाँग’ से अधिक सटीक है।
