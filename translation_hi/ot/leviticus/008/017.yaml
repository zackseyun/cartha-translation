source:
  edition: WLC
  text: וְ/אֶת הַ/פָּ֤ר וְ/אֶת עֹר/וֹ֙ וְ/אֶת בְּשָׂר֣/וֹ וְ/אֶת פִּרְשׁ֔/וֹ שָׂרַ֣ף בָּ/אֵ֔שׁ מִ/ח֖וּץ לַֽ/מַּחֲנֶ֑ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/017.yaml
  text: But the bull[a], along with its hide, its flesh, and its dung, he burned with fire outside the camp[b], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: परन्तु उसने बैल[a] को उसकी खाल, उसका मांस और उसका मल[b] समेत छावनी के बाहर आग में जला दिया, जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “जवान बैल।”
    reason: פַּר वयस्क बैल के साथ अपेक्षाकृत जवान नर गोवंश को भी दर्शा सकता है।
  - marker: b
    text: अर्थात पशु का गोबर या विष्ठा; यहाँ सामान्य कचरा अभिप्रेत नहीं है।
    reason: פֶּרֶשׁ का ठोस अर्थ मल या गोबर है, इसलिए उसकी विशिष्टता स्पष्ट की गई है।
lexical_decisions:
- source_word: הַפָּר
  choice: बैल
  rationale: פַּר का अर्थ बैल या जवान बैल है। यहाँ सरल और स्वाभाविक शब्द ‘बैल’ चुना गया है; पापबलि का बैल कहना संदर्भतः सही होता, पर इस पद में वह विशेषण नहीं है।
- source_word: עֹרוֹ
  choice: उसकी खाल
  rationale: עוֹר पशु की त्वचा या खाल को दर्शाता है; बलिदान और शव के संदर्भ में ‘खाल’ आधुनिक हिन्दी में सबसे स्वाभाविक है।
- source_word: בְּשָׂרוֹ
  choice: उसका मांस
  rationale: בָּשָׂר का सामान्य अर्थ ‘मांस’ है। यह ‘शरीर’ से अधिक सटीक और बलिदान के प्रसंग में सहज है।
- source_word: פִּרְשׁוֹ
  choice: उसका मल
  rationale: פֶּרֶשׁ विशेष रूप से विष्ठा या गोबर को दर्शाता है, सामान्य कचरे अथवा अंतड़ियों को नहीं। ‘मल’ सटीक और मर्यादित आधुनिक हिन्दी है।
- source_word: שָׂרַף בָּאֵשׁ
  choice: आग में जला दिया
  rationale: שׂרף के साथ בָאֵשׁ का स्वाभाविक हिन्दी रूप ‘आग में जला दिया’ है; इससे मूल का स्पष्ट अग्नि-संदर्भ बना रहता है।
- source_word: מִחוּץ לַמַּחֲנֶה
  choice: छावनी के बाहर
  rationale: यह वाक्यांश इस्राएल की पड़ाव-व्यवस्था के बाहर के स्थान को दर्शाता है; ‘छावनी’ सटीक और प्रचलित बाइबलीय हिन्दी है।
- source_word: כַּאֲשֶׁר צִוָּה
  choice: ठीक वैसे ही जैसे ... आज्ञा दी थी
  rationale: כַּאֲשֶׁר आज्ञा और कार्य के पूर्ण अनुरूप होने पर बल देता है; ‘ठीक वैसे ही जैसे’ इस भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में परमेश्वर का व्यक्तिगत नाम יהוה है; ‘याहवे’ उसका हिन्दी लिप्यंतरण है, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: וְאֶת ... וְאֶת ... וְאֶת ... וְאֶת
  choice: को—... समेत—
  rationale: दोहराए गए समुच्चयबोधक और कर्मचिह्न बैल तथा उसके अंगों की संचयी सूची बनाते हैं। ‘समेत’ और विराम-चिह्न इस संबंध को स्पष्ट, प्रवाहपूर्ण हिन्दी में बनाए रखते हैं।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पद में चार अक्षरों वाला व्यक्तिगत नाम יהוה सीधे प्रयुक्त है। ‘याहवे’ मूल नाम को नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ उसे उपाधि में बदल देता, जबकि ‘यहोवा’ एक पारंपरिक वैकल्पिक उच्चारण है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘परन्तु’ पूर्ववर्ती बलिदानी क्रिया से विरोध दर्शाता है। डैशों से बैल के साथ जलाए गए अंगों की सूची स्पष्ट होती है।
