source:
  edition: WLC
  text: וַ/יַּקְרֵב֙ אֶת הָ/אַ֣יִל הַ/שֵּׁנִ֔י אֵ֖יל הַ/מִּלֻּאִ֑ים וַֽ/יִּסְמְכ֞וּ אַהֲרֹ֧ן וּ/בָנָ֛י/ו אֶת יְדֵי/הֶ֖ם עַל רֹ֥אשׁ הָ/אָֽיִל־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/022.yaml
  text: Then he brought near the second ram[a], the ram of ordination, and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: hi
  text: फिर उसने दूसरे मेढ़े, अर्थात् दीक्षा के मेढ़े[a], को प्रस्तुत किया; और हारून तथा उसके पुत्रों ने अपने हाथ उस मेढ़े के सिर पर रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “प्रतिष्ठा के मेढ़े।” इब्रानी अभिव्यक्ति याजकों को उनके पद पर स्थापित करने की विधि का एक तकनीकी पद है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: तब वह ... पास ले आया
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को पास लाना या विधिपूर्वक प्रस्तुत करना है। ‘पास ले आया’ बलिदान-संबंधी सूत्र का भाव बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है; ‘तब’ क्रमसूचक वाव को व्यक्त करता है।
- source_word: הָאַיִל הַשֵּׁנִי
  choice: दूसरे मेढ़े को
  rationale: אַיִל का अर्थ ‘मेढ़ा’ और הַשֵּׁנִי का अर्थ ‘दूसरा’ है; यह अभिषेक-विधि के क्रम में दूसरे मेढ़े को स्पष्ट रूप से पहचानता है।
- source_word: אֵיל הַמִּלֻּאִים
  choice: अभिषेक-संस्कार के मेढ़े
  rationale: מִלֻּאִים का शाब्दिक संबंध ‘हाथ भरने’ से है, पर याजकीय प्रसंग में यह पद-स्थापन अथवा अभिषेक-संस्कार का तकनीकी पद है। ‘अभिषेक-संस्कार’ हिन्दी पाठक को विधि और याजकीय नियुक्ति दोनों का संकेत देता है।
- source_word: וַיִּסְמְכוּ
  choice: ने ... रखे
  rationale: बलिदान के प्रसंग में סמך हाथ रखने या टिकाने की अनुष्ठानिक क्रिया बताता है। ‘हाथ ... रखे’ स्पष्ट और प्रचलित हिन्दी अभिव्यक्ति है।
- source_word: אֶת יְדֵיהֶם
  choice: अपने हाथ
  rationale: इब्रानी में बहुवचन ‘उनके हाथ’ है। हिन्दी में कर्ताओं की ओर लौटते स्वामित्व को ‘अपने हाथ’ स्वाभाविक और स्पष्ट ढंग से व्यक्त करता है।
- source_word: עַל רֹאשׁ הָאָיִל
  choice: उस मेढ़े के सिर पर
  rationale: यह पूर्वसर्गीय पद बलिदान के पशु के सिर पर हाथ रखने की क्रिया को सीधे व्यक्त करता है; ‘उस’ पहले उल्लिखित मेढ़े की ओर संकेत करता है।
- source_word: אַהֲרֹן וּבָנָיו
  choice: हारून तथा उसके पुत्रों
  rationale: בָנָיו यहाँ हारून के उन पुत्रों को दर्शाता है जो याजकीय अभिषेक में सम्मिलित हैं; इसलिए ‘पुत्रों’ प्रसंगानुकूल और लिंग की दृष्टि से सटीक है।
theological_decisions:
- issue: याजकीय तकनीकी पद מִלֻּאִים का अनुवाद
  choice: अभिषेक-संस्कार के मेढ़े
  alternative: पद-स्थापन के मेढ़े; समर्पण-संस्कार के मेढ़े
  rationale: यह अध्याय हारून और उसके पुत्रों को याजकीय सेवा में स्थापित करने की विधि बताता है। ‘अभिषेक-संस्कार’ हिन्दी के धार्मिक-सांस्कृतिक प्रयोग में समझने योग्य है, जबकि पाद-टिप्पणी ‘पद-स्थापन’ का वैकल्पिक अर्थ देकर तकनीकी पद की अर्थ-सीमा सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘अर्थात’ दूसरे मेढ़े और अभिषेक-संस्कार के मेढ़े को एक ही पशु के रूप में स्पष्ट करता है। तकनीकी इब्रानी पद की अर्थ-व्याप्ति पाद-टिप्पणी में सुरक्षित रखी गई है।
