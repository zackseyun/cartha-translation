base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/016.yaml
  text: He took all the fat that was on the entrails[a], the lobe of the liver, the two kidneys and their fat[b], and Moses burned them on the altar.
translation:
  language: hi
  text: फिर उसने अंतड़ियों पर की सारी चर्बी, कलेजे का उपांग[a], दोनों गुर्दे और उनकी चर्बी लिए; और मूसा ने उन्हें वेदी पर जलाकर चढ़ाया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “कलेजे का उभार”; इब्रानी शब्द उस विशेष जुड़े हुए भाग को दर्शाता है जिसे बलि तैयार करते समय निकाला जाता था।
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अर्थ बलि को वेदी पर जलाकर धुएँ में चढ़ाना है।
    reason: lexical_clarification
lexical_decisions:
- source_word: וַיִּקַּח
  choice: फिर उसने ... ली
  rationale: वय्यिक्तोल कथानक के अगले क्रम को व्यक्त करता है। हिन्दी में ‘फिर’ क्रम को स्वाभाविक रूप से दिखाता है; क्रिया का स्त्रीलिंग रूप सूची के निकटतम और प्रमुख संज्ञा ‘चर्बी’ के अनुरूप है।
- source_word: כָּל הַחֵלֶב אֲשֶׁר עַל הַקֶּרֶב
  choice: अंतड़ियों पर की सारी चर्बी
  rationale: बलि-संबंधी प्रसंग में חֵלֶב चढ़ाई जाने वाली चर्बी को और קֶרֶב पशु के भीतरी अंगों/अंतड़ियों को दर्शाता है। यह अभिव्यक्ति ठोस और सामान्य हिन्दी है।
- source_word: יֹתֶרֶת הַכָּבֵד
  choice: कलेजे का उभार
  rationale: יֹתֶרֶת किसी जुड़े हुए निकले भाग या उपांग को सूचित करता है। ‘उभार’ सामान्य पाठक के लिए समझने योग्य है और निश्चित आधुनिक शारीरिक पहचान को आवश्यकता से अधिक तय नहीं करता।
- source_word: שְׁתֵּי הַכְּלָיֹת
  choice: दोनों गुर्दे
  rationale: द्विवचन का स्वाभाविक और स्पष्ट हिन्दी रूप।
- source_word: חֶלְבְּהֶן
  choice: उनकी चर्बी
  rationale: स्त्रीलिंग बहुवचन प्रत्यय गुर्दों की ओर संकेत करता है; हिन्दी सर्वनाम संबंध स्पष्ट रखता है।
- source_word: וַיַּקְטֵר
  choice: जलाकर धुआँ किया
  rationale: हिफ़ील קטר बलि को वेदी पर जलाकर धुएँ में चढ़ाने का विशिष्ट भाव रखता है। यह रूप केवल सामान्यतः ‘जलाया’ कहने की अपेक्षा मूल क्रिया का बलि-संबंधी अर्थ अधिक स्पष्ट करता है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक ה के साथ संज्ञा यहाँ क्रिया का स्थान/गंतव्य बताती है; आधुनिक हिन्दी में ‘वेदी पर’ स्वाभाविक है।
