  yaml_path: translation/ot/leviticus/008/036.yaml
  text: And Aaron and his sons did all the things that Yahweh had commanded through Moses[a].
translation:
  language: hi
  text: और हारून और उसके पुत्रों ने उन सभी बातों का पालन किया जिनकी आज्ञा याहवे ने मूसा के द्वारा दी थी।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: पूरी कीं
  rationale: עשה यहाँ पहले दिए गए अनुष्ठान-संबंधी निर्देशों के आज्ञाकारी पालन का सार बताता है। ‘पूरी कीं’ स्वाभाविक हिन्दी में क्रियान्वयन का भाव देता है।
- source_word: אַהֲרֹן וּבָנָיו
  choice: हारून और उसके पुत्रों
  rationale: नाम का मानक हिन्दी लिप्यंतरण ‘हारून’ है; בנים इस याजकीय प्रसंग में उसके पुरुष वंशजों, अर्थात पुत्रों, को सूचित करता है।
- source_word: אֵת כָּל הַדְּבָרִים
  choice: वे सभी बातें
  rationale: דברים का अर्थ ‘वचन’, ‘बातें’ या ‘विषय’ हो सकता है। यहाँ ‘वे सभी बातें’ इब्रानी की व्यापकता बनाए रखता है और उन निर्देशों को सूचित करता है जिन्हें पूरा किया गया।
- source_word: צִוָּה
  choice: आज्ञा ... दी थी
  rationale: इब्रानी पूर्ण क्रिया उस आज्ञा को बताती है जो इस पालन से पहले दी गई थी; हिन्दी में ‘दी थी’ इस क्रम को स्वाभाविक रूप से प्रकट करता है।
- source_word: יְהוָה
  choice: यहवे
  rationale: चतुरक्षरीय दिव्य नाम को उपाधि से बदलने के बजाय उसके प्रचलित हिन्दी लिप्यंतरण ‘यहवे’ से प्रस्तुत किया गया है।
- source_word: בְּיַד מֹשֶׁה
  choice: मूसा के हाथ से
  rationale: इब्रानी मुहावरे का रूप मुख्य पाठ में रखा गया है; इसका आशय मूसा के माध्यम से आज्ञा दिए जाने से है, जिसे पादटिप्पणी स्पष्ट करती है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: यहवे
  alternative: प्रभु / यहोवा
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है। ‘यहवे’ उसे उपाधि में बदले बिना आधुनिक हिन्दी लिपि में दर्शाता है।
- issue: בְּיַד מֹשֶׁה में मूसा की मध्यस्थ भूमिका
  choice: मूसा के हाथ से
  alternative: मूसा के द्वारा
  rationale: शाब्दिक मुहावरा पाठ में सुरक्षित रखा गया है, जबकि पादटिप्पणी बताती है कि यहाँ ‘हाथ से’ माध्यम अथवा मध्यस्थता दर्शाता है; इससे मूल की अभिव्यक्ति और उसका आशय दोनों बने रहते हैं।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट हिन्दी। वाक्य की इब्रानी संरचना को यथासंभव बनाए रखते हुए ‘पूरी कीं’ से आज्ञाओं के क्रियान्वयन का स्वाभाविक भाव दिया गया है।
