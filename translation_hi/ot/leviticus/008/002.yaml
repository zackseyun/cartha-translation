language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: קַ֤ח אֶֽת אַהֲרֹן֙ וְ/אֶת בָּנָ֣י/ו אִתּ֔/וֹ וְ/אֵת֙ הַ/בְּגָדִ֔ים וְ/אֵ֖ת שֶׁ֣מֶן הַ/מִּשְׁחָ֑ה וְ/אֵ֣ת פַּ֣ר הַֽ/חַטָּ֗את וְ/אֵת֙ שְׁנֵ֣י הָֽ/אֵילִ֔ים וְ/אֵ֖ת סַ֥ל הַ/מַּצּֽוֹת־־׀׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/002.yaml
  text: Take Aaron and his sons with him[a], and the garments, and the anointing oil, and the bull of the sin offering, and the two rams, and the basket of unleavened bread.
translation:
  language: hi
  text: “हारून को और उसके साथ उसके पुत्रों को, तथा वस्त्र, अभिषेक का तेल, पापबलि का बैल[a], दोनों मेढ़े और अखमीरी रोटी की टोकरी ले।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि का बैल।” इब्रानी शब्द पापबलि और अनुष्ठानिक शुद्धिकरण से संबंधित बलि—दोनों का बोध करा सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: קַח
  choice: ले
  rationale: לקח के दूसरे पुरुष एकवचन पुल्लिंग आज्ञार्थक रूप को सीधे और स्वाभाविक ढंग से व्यक्त करता है; अगले पद में गंतव्य बताया गया है, इसलिए यहाँ ‘ले आ’ जोड़ना आवश्यक नहीं।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: हिन्दी बाइबल परंपरा में प्रचलित और आसानी से पहचाना जाने वाला नामरूप।
- source_word: בָּנָיו אִתּוֹ
  choice: उसके साथ उसके पुत्रों को
  rationale: इत्तो (‘उसके साथ’) को छोड़े बिना उसके स्वाभाविक पूर्वपद हारून से जोड़ता है और इब्रानी अभिव्यक्ति को स्पष्ट रखता है।
- source_word: הַבְּגָדִים
  choice: वस्त्रों
  rationale: सामान्य इब्रानी शब्द का गरिमापूर्ण हिन्दी समतुल्य; ‘याजकीय’ जैसा विशेषण मूल में न होने के कारण नहीं जोड़ा गया।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक के तेल
  rationale: इब्रानी संबंधसूचक पदबंध ‘अभिषेक का तेल’ को स्वाभाविक हिन्दी में व्यक्त करता है और अनुष्ठानिक अर्थ बनाए रखता है।
- source_word: פַּר הַחַטָּאת
  choice: पापबलि के बैल
  rationale: פַּר को ‘बैल’ और बलिदानी संदर्भ में חַטָּאת को ‘पापबलि’ के रूप में प्रस्तुत करता है; संबंधसूचक रचना भी बनी रहती है।
- source_word: שְׁנֵי הָאֵילִים
  choice: दोनों मेढ़ों
  rationale: निश्चित रूप में उल्लिखित दो पशुओं के लिए सहज हिन्दी; אַיִל का बलिदानी संदर्भ में मानक अर्थ ‘मेढ़ा’ है।
- source_word: סַל הַמַּצּוֹת
  choice: अखमीरी रोटी की टोकरी
  rationale: מַצּוֹת को सामूहिक अर्थ में ‘अखमीरी रोटी’ कहा गया है; इस पद में उसके आकार को ‘टिकिया’ या ‘रोटी’ के रूप में अधिक विशिष्ट करना आवश्यक नहीं।
theological_decisions:
- issue: बलिदानी संदर्भ में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यहाँ शब्द बलि के पशु को निर्दिष्ट करता है। ‘पापबलि’ परिचित और शब्दगत रूप से निकट है, जबकि ‘शुद्धिकरण-बलि’ अनुष्ठानिक शुद्धि के पहलू को उभारने वाला वैध विकल्प है; इस अर्थगत तनाव को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, सरल किंतु गरिमापूर्ण अनुष्ठानिक शैली में रखी गई है। लंबी वस्तु-सूची में मूल इब्रानी के समन्वय को बनाए रखते हुए हिन्दी कारक-चिह्न ‘को’ अंत में आने वाली आज्ञा ‘ले’ से जोड़े गए हैं। पादटिप्पणी का चिह्न उसी पदबंध के बाद रखा गया है जिससे उसका वास्तविक संबंध है।
