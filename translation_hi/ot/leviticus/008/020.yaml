- source_word: וַיַּקְטֵר
  choice: जलाकर उनका धुआँ उठाया
  rationale: हिफ़ील रूप बलि की वस्तुओं को इस प्रकार जलाने का द्योतक है कि वे धुएँ के रूप में ऊपर उठें; यह अनुवाद सामान्य ‘जलाया’ से अधिक पूर्ण रूप से उस बलिदानी क्रिया को व्यक्त करता है।
- source_word: הָרֹאשׁ
  choice: सिर
  rationale: यह सामान्य शारीरिक अंग के लिए प्रयुक्त सीधा शब्द है।
- source_word: הַנְּתָחִים
  choice: टुकड़ों
  rationale: यह पहले आए उसी मूल के संज्ञा-पद को दोहराता है और काटे गए भागों को दर्शाता है।
- source_word: הַפָּדֶר
  choice: चर्बी
  rationale: यह दुर्लभ बलिदानी शब्द पशु के चर्बीयुक्त भाग या परत को दर्शाता है। ‘चर्बी’ अर्थ को स्पष्ट रखती है, जबकि ‘चर्बीदार पूँछ’ कहना इब्रानी शब्द से अधिक विशिष्ट होगा।
