    reason: दुर्लभ बलिदानी पद הַפָּדֶר के अर्थ-क्षेत्र को स्पष्ट करना और ‘चर्बीदार पूँछ’ जैसी अधिक विशिष्ट व्याख्या से बचना।
lexical_decisions:
- source_word: הָאַיִל
  choice: मेढ़े
  rationale: बलि के प्रसंग में אַיִל वयस्क नर भेड़, अर्थात् मेढ़े, को दर्शाता है।
- source_word: נִתַּח לִנְתָחָיו
