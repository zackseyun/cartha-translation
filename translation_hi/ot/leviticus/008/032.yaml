  yaml_path: translation/ot/leviticus/008/032.yaml
  text: And what remains of the meat and of the bread you shall burn with fire[a].
translation:
  language: hi
  text: और मांस[a] और रोटी में से जो बच जाए, उसे तुम आग में जला देना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘मांस’ के लिए प्रयुक्त इब्रानी शब्द का शाब्दिक अर्थ ‘शरीर का मांस’ है; यहाँ यह बलि के पशु के खाने योग्य मांस को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהַנּוֹתָר
  choice: और ... जो बच जाए
  rationale: निफ़अल कृदन्त उस वस्तु को दर्शाता है जो शेष रह जाती है; हिन्दी में ‘जो बच जाए’ स्वाभाविक है और निर्देश के संदर्भ में संभावित शेष को व्यक्त करता है।
- source_word: בַּבָּשָׂר
  choice: मांस[a] में से
  rationale: בָּשָׂר का मूल अर्थ ‘देह/मांस’ है; यहाँ बलि के पशु के खाने योग्य मांस की बात होने के कारण ‘मांस’ सर्वाधिक स्पष्ट और स्वाभाविक है।
- source_word: וּבַלָּחֶם
  choice: और रोटी में से
  rationale: לֶחֶם का सामान्य अर्थ ‘रोटी’ है। ‘में से’ मांस और रोटी दोनों में बचे हुए अंश के साथ हिन्दी का स्वाभाविक संबंध बनाता है।
- source_word: בָּאֵשׁ
  choice: आग में
  rationale: यहाँ ב जलाने के क्षेत्र या साधन को दर्शा सकता है; ‘आग में जला देना’ हिन्दी में स्वाभाविक है और इब्रानी अभिव्यक्ति को निकटता से रखता है।
- source_word: תִּשְׂרֹפוּ
  choice: तुम ... जला देना
  rationale: द्वितीय पुरुष बहुवचन अपूर्ण क्रिया यहाँ विधिक निर्देश देती है। ‘तुम ... जला देना’ आधुनिक हिन्दी में स्पष्ट निर्देशात्मक बल रखता है।
