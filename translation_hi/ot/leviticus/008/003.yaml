  yaml_path: translation/ot/leviticus/008/003.yaml
  text: And assemble all the congregation at the entrance of the tent of meeting[a].
translation:
  language: hi
  text: और सारी मण्डली को मिलापवाले तम्बू के द्वार पर इकट्ठा कर।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पूरी सभा को मिलापवाले तम्बू के द्वार पर एकत्र कर।” इब्रानी शब्द עֵדָה का अनुवाद प्रसंग के अनुसार “मण्डली,” “सभा,” या “समुदाय” किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְ/אֵת
  choice: और
  rationale: וְ अगले आदेश को पिछले आदेश से जोड़ता है; אֵת निश्चित कर्म का चिह्न है और हिन्दी में अलग से अनूदित नहीं होता।
- source_word: כָּל הָעֵדָה
  choice: सारी मण्डली
  rationale: כָּל सम्पूर्णता पर बल देता है, और עֵדָה यहाँ इस्राएल के सामुदायिक समूह को दर्शाता है। ‘सारी मण्डली’ स्वाभाविक और गरिमापूर्ण हिन्दी है।
- source_word: הַקְהֵל
  choice: इकट्ठा कर
  rationale: यह קהל का हिफ़ील आज्ञार्थक रूप है, जिसका अर्थ किसी समूह को एकत्र करना है। एकवचन आज्ञा मूसा को संबोधित है।
- source_word: אֶל פֶּתַח
  choice: द्वार पर
  rationale: אֶל दिशा या निकटता बताता है; इस प्रसंग में हिन्दी में स्थान के लिए ‘द्वार पर’ स्वाभाविक है। פֶּתַח प्रवेश के खुले स्थान को दर्शाता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह उस पवित्र तम्बू का पारंपरिक और व्यापक रूप से समझा जाने वाला हिन्दी नाम है जहाँ यहोवा अपने लोगों से मिलता था; इससे ‘नियुक्त भेंट’ की मूल धारणा भी प्रसंगानुसार व्यक्त होती है।
