language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר מֹשֶׁ֜ה אֶל אַהֲרֹ֣ן וְ/אֶל בָּנָ֗י/ו בַּשְּׁל֣וּ אֶת הַ/בָּשָׂר֮ פֶּ֣תַח אֹ֣הֶל מוֹעֵד֒ וְ/שָׁם֙ תֹּאכְל֣וּ אֹת֔/וֹ וְ/אֶ֨ת הַ/לֶּ֔חֶם אֲשֶׁ֖ר בְּ/סַ֣ל הַ/מִּלֻּאִ֑ים כַּ/אֲשֶׁ֤ר צִוֵּ֨יתִי֙ לֵ/אמֹ֔ר אַהֲרֹ֥ן וּ/בָנָ֖י/ו יֹאכְלֻֽ/הוּ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/031.yaml
  text: And Moses said to Aaron and to his sons[a], “Boil the meat at the entrance of the tent of meeting, and there eat it and the bread that is in the basket of ordination offerings, just as I commanded, saying, ‘Aaron and his sons shall eat it.’”
translation:
  language: hi
  text: तब मूसा ने हारून और उसके पुत्रों से कहा, “मिलाप के तंबू के प्रवेश-द्वार पर मांस उबालो और वहीं उसे तथा याजक-स्थापना की भेंटों की टोकरी में रखी रोटी खाओ, ठीक जैसा मैंने यह कहकर आज्ञा दी थी, ‘हारून और उसके पुत्र उसे खाएँ।’”
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: בַּשְּׁלוּ
  choice: उबालो
  rationale: बलि-संबंधी इस पाक प्रसंग में क्रिया का विशिष्ट अर्थ उबालना है; यह सामान्य ‘पकाओ’ से अधिक सटीक है।
- source_word: הַבָּשָׂר
  choice: मांस
  rationale: यह बलि-पशु के खाने योग्य मांस को दर्शाता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: פֶּתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के द्वार पर
  rationale: פֶּתַח का स्थान-सूचक अर्थ ‘द्वार/प्रवेश’ है; यह पदबंध उपासना-स्थान को स्पष्ट और परिचित हिन्दी में व्यक्त करता है।
- source_word: וְשָׁם תֹּאכְלוּ אֹתוֹ
  choice: वहीं उसे ... खाओ
  rationale: ‘वहीं’ से שָׁם पर दिए गए स्थानगत बल को बनाए रखा गया है।
- source_word: הַלֶּחֶם
  choice: रोटी
  rationale: इस अनुष्ठान के साथ रखी रोटी के लिए यह सीधा और सामान्य हिन्दी शब्द है।
- source_word: סַל הַמִּלֻּאִים
  choice: याजक-स्थापना की भेंटों की टोकरी
  rationale: מִלֻּאִים यहाँ हारून और उसके पुत्रों को याजकीय पद पर स्थापित करने के संस्कार और उससे जुड़ी भेंटों को सूचित करता है; ‘याजक-स्थापना’ संदर्भ को स्पष्ट करता है, जबकि ‘भेंटों’ का बहुवचन उस टोकरी की अनुष्ठानिक सामग्री को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: כַּאֲשֶׁר צִוֵּיתִי לֵאמֹר
  choice: ठीक जैसा मैंने यह कहकर आज्ञा दी थी
  rationale: यह आज्ञा और उसके बाद आने वाले प्रत्यक्ष कथन—दोनों को स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: יֹאכְלֻהוּ
  choice: उसे खाएँ
  rationale: यह रूप उद्धृत निर्देश की बाध्यकारी शक्ति को बनाए रखता है, बिना उसे केवल भविष्यकाल या अत्यधिक कठोर अनिवार्यता बनाने के।
theological_decisions:
- issue: याजकीय स्थापना के संदर्भ में מִלֻּאִים का अनुवाद
  choice: याजक-स्थापना की भेंटें
  alternative: अभिषेक की भेंटें / समर्पण की भेंटें
  rationale: शब्द हारून और उसके पुत्रों की याजकीय नियुक्ति के अनुष्ठान से संबंधित है। ‘याजक-स्थापना’ विशिष्ट प्रसंग को साधारण आधुनिक हिन्दी में स्पष्ट करता है और बाद की किसी कलीसियाई पद-व्यवस्था को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का स्पष्ट, गरिमापूर्ण और साधारण पाठक के लिए बोधगम्य रूप। हिब्रू की आज्ञात्मक संरचना, स्थानगत बल और उद्धृत आदेश सुरक्षित रखे गए हैं। किसी पादटिप्पणी की आवश्यकता नहीं मानी गई, इसलिए मुख्य पाठ में कोई पादटिप्पणी-चिह्न नहीं है।
