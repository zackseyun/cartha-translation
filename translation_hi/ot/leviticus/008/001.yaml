base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/001.yaml
  text: Then Yahweh spoke to Moses[a], saying,
translation:
  language: hi
  text: तब याहवे[a] ने मूसा से कहा,
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'हिब्रू: “YHWH”; परंपरागत रूप से “यहोवा” भी लिखा जाता है।'
    reason: The source uses the Tetragrammaton יהוה; the note identifies the underlying name and records the traditional Hindi alternative.
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: फिर ... कहा
  rationale: वाव-क्रमवाचक कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “फिर” उसका स्वाभाविक क्रमिक बल व्यक्त करता है। דִּבֵּר के लिए “कहा” सहज है, जबकि לֵאמֹר से आरम्भ होने वाली वाणी अगले पद में आती है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: हिन्दी बाइबलीय परंपरा में परमेश्वर के व्यक्तिगत नाम YHWH का प्रचलित लिप्यंतरण “यहोवा” है; इसे केवल उपाधि “प्रभु” से बदलने के बजाय नाम के रूप में रखा गया है।
- source_word: אֶל
  choice: से
  rationale: हिब्रू में यह वाणी के संबोधित व्यक्ति को चिह्नित करता है; हिन्दी मुहावरे में “मूसा से कहा” स्वाभाविक है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: हिब्रू नाम का हिन्दी में स्थापित रूप।
- source_word: לֵאמֹר
  choice: कहा
  rationale: यह सूत्र आगे आने वाले प्रत्यक्ष कथन का परिचय देता है। हिन्दी में मुख्य क्रिया के साथ अलग से “यह कहते हुए” लिखना अनावश्यक रूप से बोझिल होता; “कहा” स्वाभाविक रूप से अगले पद की वाणी की भूमिका बनाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। “यहोवा” आधुनिक हिन्दी पाठकों के लिए इसका स्थापित नामरूप है; “याहवे” स्रोत-उच्चारण के निकट एक वैकल्पिक लिप्यंतरण है, जबकि “प्रभु” नाम के स्थान पर उपाधि रखता है।
translation_notes:
  register: भाषा आधुनिक, संक्षिप्त और गरिमापूर्ण रखी गई है। पद अगले पद में आने वाली प्रत्यक्ष वाणी की भूमिका है। कोई पादटिप्पणी नहीं जोड़ी गई, क्योंकि मुख्य पाठ में “यहोवा” स्पष्ट और हिन्दी में स्थापित है।
