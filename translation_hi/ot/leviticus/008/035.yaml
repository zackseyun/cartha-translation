  text: וּ/פֶתַח֩ אֹ֨הֶל מוֹעֵ֜ד תֵּשְׁב֨וּ יוֹמָ֤ם וָ/לַ֨יְלָה֙ שִׁבְעַ֣ת יָמִ֔ים וּ/שְׁמַרְתֶּ֛ם אֶת מִשְׁמֶ֥רֶת יְהוָ֖ה וְ/לֹ֣א תָמ֑וּתוּ כִּי כֵ֖ן צֻוֵּֽיתִי־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/035.yaml
  text: And you shall stay at the entrance of the tent of meeting day and night for seven days[a], and keep the charge of Yahweh, so that you may not die; for so I have been commanded.
translation:
  language: hi
  text: और तुम सात दिन तक दिन-रात मिलाप के तंबू के प्रवेश-द्वार पर रहो, और याहवे के ठहराए हुए कर्तव्य का पालन करो, जिससे तुम न मरो[a]; क्योंकि मुझे इसी प्रकार आज्ञा दी गई है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तुम नहीं मरोगे”; अथवा, “कहीं ऐसा न हो कि तुम मर जाओ।”
    reason: इब्रानी वाक्यांश וְלֹא תָמֻתוּ को उद्देश्य/परिणाम, समन्वयी कथन, या चेतावनी के रूप में समझा जा सकता है।
lexical_decisions:
- source_word: וּ/פֶתַח אֹהֶל מוֹעֵד
  choice: मिलापवाले तंबू के प्रवेश-द्वार पर
  rationale: פֶתַח प्रवेश या द्वार को सूचित करता है; ‘प्रवेश-द्वार’ सहज हिन्दी में स्थान का अर्थ स्पष्ट करता है। אֹהֶל מוֹעֵד के लिए ‘मिलापवाला तंबू’ परिचित और अर्थपूर्ण पवित्रस्थान-संज्ञा है।
- source_word: תֵּשְׁבוּ
  choice: रहना
  rationale: ישב का मूल अर्थ बैठना, बसना या बने रहना हो सकता है। इस अनुष्ठानिक प्रसंग में लगातार वहीं ठहरे रहने की आज्ञा है, जिसे हिन्दी में ‘रहना’ स्वाभाविक रूप से व्यक्त करता है।
- source_word: יוֹמָם וָלַיְלָה שִׁבְעַת יָמִים
  choice: सात दिन तक दिन-रात
  rationale: यह अवधि और निरंतरता दोनों को सहज हिन्दी क्रम में व्यक्त करता है; ‘दिन-रात’ पूरे समय का द्योतक है।
- source_word: וּ/שְׁמַרְתֶּם אֶת מִשְׁמֶרֶת יְהוָה
  choice: याहवे ने जो कर्तव्य तुम्हें सौंपा है, उसका पालन करना
  rationale: שמר + משמרת किसी सौंपे हुए दायित्व या सेवा का सावधानी से पालन करने को व्यक्त करता है। यह रूप हिन्दी में स्वाभाविक है और इसे केवल सामान्य ‘आज्ञा मानना’ बनाकर अनुष्ठानिक दायित्व को समतल नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिवाचक दिव्य नाम को किसी उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: וְ/לֹא תָמֻתוּ
  choice: जिससे तुम न मरो
  rationale: आज्ञापालन से टलने वाले परिणाम को उद्देश्य/परिणाम के रूप में व्यक्त करता है, जबकि वाव-युक्त इब्रानी की अन्य सम्भव व्याख्याएँ पादटिप्पणी में सुरक्षित हैं।
- source_word: כִּי כֵן צֻוֵּיתִי
  choice: क्योंकि मुझे यही आज्ञा दी गई है
  rationale: इब्रानी कर्मवाच्य को बनाए रखते हुए मूसा के आज्ञा प्राप्त करने का भाव स्पष्ट और स्वाभाविक आधुनिक हिन्दी में व्यक्त किया गया है।
theological_decisions:
- issue: दिव्य नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में व्यक्तिवाचक चतुरक्षरीय नाम है; ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि में नहीं बदलता।
- issue: मृत्यु-संबंधी चेतावनी का बल
  choice: जिससे तुम न मरो
  alternative: और तुम नहीं मरोगे; कहीं ऐसा न हो कि तुम मर जाओ
  rationale: मुख्य पाठ इसे आज्ञापालन द्वारा टलने वाले परिणाम के रूप में प्रस्तुत करता है। इब्रानी וְלֹא תָמֻתוּ समन्वयी कथन या चेतावनी के रूप में भी समझा जा सकता है, इसलिए अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। आज्ञार्थक बहुवचन के लिए ‘रहना’ और ‘पालन करना’ का प्रयोग प्रवचनात्मक हिन्दी में स्वाभाविक है। ‘मिलापवाला तंबू’ पवित्रस्थान की परिचित संज्ञा बनाए रखता है।
