id: LEV.8.9
reference: Leviticus 8:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם אֶת הַ/מִּצְנֶ֖פֶת עַל רֹאשׁ֑/וֹ וַ/יָּ֨שֶׂם עַֽל הַ/מִּצְנֶ֜פֶת אֶל מ֣וּל פָּנָ֗י/ו אֵ֣ת צִ֤יץ הַ/זָּהָב֙ נֵ֣זֶר הַ/קֹּ֔דֶשׁ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/009.yaml
  text: And he put the turban on his head[a], and on the front of the turban he placed the gold plate, the holy crown, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: उसने उसके सिर पर पगड़ी रखी और पगड़ी के सामने वाले भाग पर सोने की पट्टी—पवित्र मुकुट[a]—लगाई, ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, ‘पवित्र किरीट।’
    reason: नֵזֶר के लिए ‘मुकुट’ के साथ ‘किरीट’ भी संभव है; टिप्पणी इस औपचारिक वैकल्पिक अर्थ को सुरक्षित रखती है।
lexical_decisions:
- source_word: מִצְנֶפֶת
  choice: पगड़ी
  rationale: यह महायाजक के विशिष्ट सिर-वस्त्र को दर्शाता है। ‘पगड़ी’ आधुनिक हिन्दी में स्पष्ट, सहज और प्रसंगानुकूल है।
- source_word: אֶל מוּל פָּנָיו
  choice: सामने की ओर
  rationale: यह पदबंध पगड़ी के आगे वाले भाग पर पट्टी लगाए जाने का स्थान बताता है; ‘सामने की ओर’ इस स्थानिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: צִיץ
  choice: पट्टी
  rationale: याजकीय वस्त्र के इस प्रसंग में यह पगड़ी पर लगाई जाने वाली सोने की वस्तु है। यद्यपि अन्य प्रसंगों में शब्द का अर्थ फूल या पुष्प भी हो सकता है, यहाँ ‘पट्टी’ उसके पदार्थ और उपयोग को स्पष्ट करता है।
- source_word: נֵזֶר הַקֹּדֶשׁ
  choice: पवित्र मुकुट
  rationale: यह सोने की पट्टी का समानाधिकरण रूप में वर्णन करता है और उसके पवित्र, समर्पित चिह्न होने को व्यक्त करता है। ‘मुकुट’ सामान्य पाठक के लिए ‘किरीट’ से अधिक सुलभ है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में उसके प्रचलित लिप्यंतरण ‘याहवे’ से प्रस्तुत किया गया है।
- source_word: וַיָּשֶׂם ... וַיָּשֶׂם
  choice: रखी ... लगाई
  rationale: मूल में एक ही क्रिया दो बार है, किंतु वस्तुओं और क्रियाओं के प्रकार के अनुसार ‘पगड़ी रखी’ तथा ‘पट्टी लगाई’ स्वाभाविक हिन्दी है और दोनों क्रियाओं का मूल भाव सुरक्षित रखता है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת־מֹשֶׁה
  choice: ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी
  rationale: ‘ठीक वैसे ही’ आज्ञा और उसके पालन के बीच पूर्ण अनुरूपता पर दिए गए बल को स्वाभाविक हिन्दी में सामने लाता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसे उपाधि से प्रतिस्थापित किए बिना प्रस्तुत करता है और मूल के नाम-रूप को बनाए रखता है।
- issue: נֵזֶר הַקֹּדֶשׁ और सोने की पट्टी का संबंध
  choice: ‘पवित्र मुकुट’ को सोने की पट्टी का समानाधिकरण वर्णन माना गया
  alternative: इसे सोने की पट्टी से अलग दूसरी वस्तु मानना
  rationale: इब्रानी वाक्य-विन्यास में यह पदबंध צִיץ הַזָּהָב के बाद उसी वस्तु की पहचान या विशेषता बताता है; इसलिए डैश द्वारा संबंध स्पष्ट किया गया, पर किसी अतिरिक्त धर्मवैज्ञानिक अर्थ को नहीं जोड़ा गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘उसने’ और ‘उसके’ मूल के सर्वनामात्मक रूप को बनाए रखते हैं; निकटवर्ती प्रसंग से इनके संकेत क्रमशः मूसा और हारून की ओर समझे जा सकते हैं। डैश सोने की पट्टी और ‘पवित्र मुकुट’ के समानाधिकरण संबंध को पठनीय बनाते हैं।
