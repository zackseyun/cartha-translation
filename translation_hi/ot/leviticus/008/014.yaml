source:
  edition: WLC
  text: וַ/יַּגֵּ֕שׁ אֵ֖ת פַּ֣ר הַֽ/חַטָּ֑את וַ/יִּסְמֹ֨ךְ אַהֲרֹ֤ן וּ/בָנָי/ו֙ אֶת יְדֵי/הֶ֔ם עַל רֹ֖אשׁ פַּ֥ר הַֽ/חַטָּֽאת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/014.yaml
  text: Then he brought near the bull of the sin offering[a], and Aaron and his sons laid their hands on the head of the bull of the sin offering.
translation:
  language: hi
  text: तब वह पापबलि के बैल को निकट लाया[a], और हारून और उसके पुत्रों ने अपने हाथ पापबलि के बैल के सिर पर रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “प्रस्तुत किया” अथवा “आगे लाया।”
    reason: וַיַּגֵּשׁ के अनुष्ठानिक प्रसंग में ‘निकट लाना’, ‘प्रस्तुत करना’, और ‘आगे लाना’ अर्थ संभव हैं।
lexical_decisions:
- source_word: וַיַּגֵּשׁ
  choice: पास ले आया
  rationale: हिफ़इल क्रिया यहाँ बलि के पशु को अनुष्ठान के लिए निकट लाने या प्रस्तुत करने का बोध देती है। ‘पास ले आया’ मूल के स्थानिक और अनुष्ठानिक भाव को सहज हिंदी में बनाए रखता है।
- source_word: פַּר
  choice: बैल
  rationale: बलिदान-संबंधी प्रसंग में פַּר के लिए ‘बैल’ स्पष्ट और स्वाभाविक है; इस पद में उसकी आयु को ‘जवान’ कहकर स्पष्ट करना आवश्यक नहीं।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: यहाँ חַטָּאת स्वयं पाप नहीं, बल्कि पाप के संबंध में चढ़ाई जाने वाली बलि को सूचित करता है। ‘पापबलि’ संक्षिप्त और प्रचलित धार्मिक पद है।
- source_word: וַיִּסְמֹךְ
  choice: रखे
  rationale: स्मख क्रिया अनुष्ठान में पशु पर हाथ रखने या टिकाने की क्रिया बताती है। ‘रखे’ स्वाभाविक है और दबाव की मात्रा को अनावश्यक रूप से निश्चित नहीं करता।
- source_word: יְדֵיהֶם
  choice: अपने हाथ
  rationale: हिब्रू में बहुवचन है। ‘अपने हाथ’ प्रत्येक सहभागी द्वारा किए गए सामूहिक अनुष्ठान को सहज हिंदी में व्यक्त करता है।
- source_word: עַל רֹאשׁ
  choice: के सिर पर
  rationale: यह मूल स्थान-संबंधी अभिव्यक्ति का सीधा, स्पष्ट और आधुनिक हिंदी रूप है।
theological_decisions:
- issue: बलि के पशु पर हाथ रखने का धार्मिक अर्थ
  choice: क्रिया का केवल वर्णन किया गया है; उसके धार्मिक तंत्र की व्याख्या नहीं जोड़ी गई।
  alternative: इसे दोष के हस्तांतरण, बलि से तादात्म्य, अथवा पशु को बलि के लिए निर्धारित करने के रूप में स्पष्ट करना।
  rationale: पद स्वयं इस अनुष्ठान का अर्थ नहीं समझाता। इसलिए अनुवाद किसी एक धार्मिक व्याख्या को मूल पाठ में नहीं जोड़ता और उसकी वास्तविक व्याख्यात्मक खुली जगह बनाए रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य शैली। ‘पापबलि’ जैसे संक्षिप्त पारिभाषिक शब्द का उपयोग किया गया है और वाक्य की हिब्रू क्रमबद्धता यथासंभव सुरक्षित रखी गई है।
