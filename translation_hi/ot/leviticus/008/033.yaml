id: LEV.8.33
reference: Leviticus 8:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מִ/פֶּתַח֩ אֹ֨הֶל מוֹעֵ֜ד לֹ֤א תֵֽצְאוּ֙ שִׁבְעַ֣ת יָמִ֔ים עַ֚ד י֣וֹם מְלֹ֔את יְמֵ֖י מִלֻּאֵי/כֶ֑ם כִּ֚י שִׁבְעַ֣ת יָמִ֔ים יְמַלֵּ֖א אֶת יֶדְ/כֶֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/033.yaml
  text: And you shall not go out from the entrance of the tent of meeting for seven days[a], until the day the days of your ordination are completed, for he will ordain you for seven days.
translation:
  language: hi
  text: तुम सात दिन तक मिलाप के तंबू के प्रवेश-द्वार से बाहर न निकलना—उस दिन तक, जब तुम्हारी याजकीय नियुक्ति के दिन पूरे हो जाएँ; क्योंकि वह सात दिन तक तुम्हें याजक-पद पर नियुक्त करेगा।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “वह तुम्हारे हाथ भरेगा।” यह किसी को याजकीय सेवा में नियुक्त या प्रतिष्ठित करने का हिब्रू मुहावरा है।
    reason: मूल हिब्रू मुहावरे और उसके याजकीय अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: וּמִפֶּתַח
  choice: प्रवेश-द्वार से
  rationale: פֶּתַח किसी स्थान के खुले प्रवेश या द्वार को दर्शाता है। ‘प्रवेश-द्वार’ यहाँ स्थान-संबंधी अर्थ को स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह पवित्रस्थान का मानक नाम है। ‘मिलाप का तंबू’ हिब्रू पद के दोनों घटकों को पारदर्शी और आधुनिक हिन्दी में रखता है।
- source_word: לֹא תֵצְאוּ
  choice: बाहर न निकलना
  rationale: नकारात्मक अपूर्ण क्रिया यहाँ निर्देशात्मक निषेध है। हिन्दी में ‘न निकलना’ प्रत्यक्ष संबोधन के भीतर दृढ़, किंतु स्वाभाविक आदेश देता है।
- source_word: שִׁבְעַת יָמִים
  choice: सात दिन तक
  rationale: निषेध की अवधि बताने के लिए ‘तक’ स्वाभाविक हिन्दी है और सात दिनों की पूरी अवधि को स्पष्ट करता है।
- source_word: עַד יוֹם מְלֹאת יְמֵי מִלֻּאֵיכֶם
  choice: उस दिन तक, जब तुम्हारी याजकीय नियुक्ति के दिन पूरे हो जाएँ
  rationale: מְלֹאת पूर्ण होने का भाव देता है और מִלֻּאִים यहाँ याजकीय पद-स्थापना के अनुष्ठानों का तकनीकी पद है। वाक्य को हिन्दी में बोधगम्य रखते हुए ‘दिन’ और उनकी पूर्णता दोनों सुरक्षित रखे गए हैं।
- source_word: כִּי
  choice: क्योंकि
  rationale: यह सात दिन बाहर न निकलने का कारण प्रस्तुत करता है; ‘क्योंकि’ आधुनिक हिन्दी में संबंध को स्पष्ट करता है।
- source_word: יְמַלֵּא אֶת יֶדְכֶם
  choice: तुम्हें याजक-पद पर नियुक्त करेगा
  rationale: शाब्दिक रूप ‘तुम्हारे हाथ भरेगा’ है, पर यह याजकीय पद पर नियुक्त या प्रतिष्ठित करने का हिब्रू मुहावरा है। मुख्य पाठ में उसका प्रसंगगत अर्थ दिया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
theological_decisions:
- issue: מלא את־יד याजकीय मुहावरे का अनुवाद
  choice: मुख्य पाठ में ‘तुम्हें याजक-पद पर नियुक्त करेगा’ और पादटिप्पणी में शाब्दिक रूप
  alternative: मुख्य पाठ में ‘तुम्हारे हाथ भरेगा’
  rationale: शाब्दिक रूप हिन्दी पाठक के लिए बिना स्पष्टीकरण के अर्थहीन या भ्रामक हो सकता है। प्रसंगगत याजकीय अर्थ मुख्य पाठ में देने से वचन स्वाभाविक रहता है, जबकि पादटिप्पणी मूल मुहावरे और उसी मूल से बने ‘याजकीय नियुक्ति’ के विचार को दिखाती है।
- issue: יְמַלֵּא का अनिर्दिष्ट कर्ता
  choice: ‘वह’ को बनाए रखना
  alternative: स्पष्ट रूप से ‘मूसा’ या ‘यहोवा’ कहना
  rationale: हिब्रू क्रिया तृतीय पुरुष एकवचन है, पर इस पद में कर्ता का नाम नहीं दिया गया। किसी एक कर्ता को स्पष्ट कर देना मूल की संभावित अस्पष्टता को अनावश्यक रूप से सुलझा देता।
translation_notes:
  register: भाषा आधुनिक, सम्मानपूर्ण और सामान्य पाठकों के लिए सहज रखी गई है। ‘याजकीय नियुक्ति’ और ‘याजक-पद पर नियुक्त’ तकनीकी अनुष्ठानिक अर्थ को स्पष्ट करते हैं; अनिर्दिष्ट ‘वह’ मूल पाठ की अस्पष्टता बनाए रखता है।
