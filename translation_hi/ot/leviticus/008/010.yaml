source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת שֶׁ֣מֶן הַ/מִּשְׁחָ֔ה וַ/יִּמְשַׁ֥ח אֶת הַ/מִּשְׁכָּ֖ן וְ/אֶת כָּל אֲשֶׁר בּ֑/וֹ וַ/יְקַדֵּ֖שׁ אֹתָֽ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/010.yaml
  text: Then Moses took the anointing oil and anointed the tabernacle and all that was in it[a], and consecrated them.
translation:
  language: hi
  text: तब मूसा ने अभिषेक का तेल लिया और निवास-स्थान तथा उसमें जो कुछ था, उन सबका अभिषेक किया और उन्हें पवित्र ठहराया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उन्हें पवित्र किया।”
    reason: 'लेक्सिकल विकल्प: וַיְקַדֵּשׁ का अर्थ उन्हें पवित्र करना अथवा पवित्र उपयोग के लिए अलग करना है।'
lexical_decisions:
- source_word: וַיִּקַּח
  choice: तब मूसा ने…लिया
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘तब’ क्रमिक बल को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह अभिषेक के लिए प्रयुक्त तेल का संबंधवाचक पदबंध है; हिन्दी में यह सहज और सटीक है।
- source_word: וַיִּמְשַׁח
  choice: अभिषेक किया
  rationale: याजकीय अनुष्ठान में तेल लगाने और किसी वस्तु को विशेष उद्देश्य के लिए अलग करने का स्थापित धार्मिक अर्थ सुरक्षित रहता है।
- source_word: הַמִּשְׁכָּן
  choice: पवित्र निवास
  rationale: मिश्कान उस पवित्र निवास-स्थान को सूचित करता है जहाँ परमेश्वर इस्राएल के बीच निवास करते हैं; यह आधुनिक हिन्दी में तकनीकी संदर्भ को स्पष्ट रखता है।
- source_word: כָּל אֲשֶׁר בּוֹ
  choice: उसमें जो कुछ था, उस सब
  rationale: यह पवित्र निवास के भीतर की सारी वस्तुओं और साज-सामग्री को समग्र रूप से सूचित करता है।
- source_word: וַיְקַדֵּשׁ אֹתָם
  choice: और उन्हें पवित्र ठहराया
  rationale: קדשׁ यहाँ पवित्र उपयोग के लिए अलग करने का अनुष्ठानिक भाव रखता है; ‘पवित्र ठहराया’ इसे सहज हिन्दी में व्यक्त करता है। बहुवचन ‘उन्हें’ निवास और उसकी समस्त वस्तुओं को सम्मिलित करता है।
theological_decisions:
- issue: याजकीय अनुष्ठान में קדשׁ का अनुवाद
  choice: पवित्र ठहराया
  alternative: समर्पित किया; पवित्र किया
  rationale: संदर्भ निवास और उसकी वस्तुओं को पवित्र उपयोग के लिए अलग किए जाने का है। ‘पवित्र ठहराया’ अनुष्ठानिक और धार्मिक भाव को बनाए रखता है, पर बाद की किसी विशिष्ट मत-संबंधी धारणा को आरोपित नहीं करता।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। वाक्य की इब्रानी कथात्मक गति और अनुष्ठानिक शब्दावली को स्वाभाविक हिन्दी के साथ संतुलित किया गया है।
