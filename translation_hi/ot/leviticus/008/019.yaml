lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: उसने उस पशु को बलि किया
  rationale: शׁחט बलिदान के संदर्भ में पशु का विधिपूर्वक वध करना दर्शाता है। हिन्दी में कर्म स्पष्ट करने के लिए पिछले पद से निहित पशु को व्यक्त किया गया है; ‘बलि किया’ अनुष्ठानिक संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: וַיִּזְרֹק
  choice: उछाला
  rationale: זרק यहाँ बलि के लहू को वेदी पर जोर से लगाने या फेंकने की क्रिया है। ‘उछाला’ हल्के छिड़काव की अपेक्षा इस बलपूर्ण क्रिया को अधिक ठीक ढंग से व्यक्त करता है।
- source_word: הַדָּם
  choice: लहू
  rationale: निश्चित संज्ञा का सीधा और गरिमापूर्ण हिन्दी रूप; बाइबलीय बलिदान-संदर्भ में ‘लहू’ सहज और प्रचलित है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान-संदर्भ में מִזְבֵּחַ का मानक हिन्दी रूप।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: यह वेदी की परिधि या सभी ओर लहू लगाए जाने का वितरणात्मक भाव सुरक्षित रखता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: नाम का मानक हिन्दी बाइबलीय रूप।
