base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/015.yaml
  text: And he slaughtered it, and Moses took the blood and put it on the horns of the altar all around with his finger, and he purified the altar, and he poured out the blood at the base of the altar and consecrated it to make atonement for it.
translation:
  language: hi
  text: तब उसने उसे बलि के लिए वध किया। मूसा ने लहू लिया और अपनी उँगली से वेदी के सींगों पर चारों ओर लगाया, और वेदी को शुद्ध किया[a]। फिर उसने लहू वेदी के आधार पर उँडेल दिया और उसे पवित्र ठहराया, उसके लिए प्रायश्चित करने के लिए[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वेदी को निर्मल किया।” यहाँ हिब्रू क्रिया का अर्थ वेदी को अनुष्ठानिक अशुद्धि से शुद्ध करना है, न कि उसे पाप करवाना।
    reason: lexical_alternative
  - marker: b
    text: या, “उसे शुद्ध करने के लिए” अथवा “उसके लिए प्रायश्चित करने के लिए।” हिब्रू क्रिया में बलिदानी शुद्धिकरण और प्रायश्चित दोनों का भाव है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: उसने उसे बलि किया
  rationale: बलिदान के प्रसंग में שׁחט सामान्य हत्या नहीं, विधिपूर्वक पशु-वध को दर्शाता है। ‘बलि किया’ आधुनिक हिन्दी में इस अनुष्ठानिक अर्थ को स्वाभाविक रूप से व्यक्त करता है; कर्म संदर्भ से पूरा किया गया है।
- source_word: קַרְנוֹת הַמִּזְבֵּחַ
  choice: वेदी के सींगों
  rationale: यह वेदी पर बने सींग जैसे उभारों के लिए निश्चित अनुष्ठानिक पद है; ‘सींग’ स्रोत की ठोस उपमा को बनाए रखता है।
- source_word: סָבִיב בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से ... चारों ओर
  rationale: एकवचन אֶצְבַּע और करणार्थक בְּ को ‘अपनी उँगली से’ व्यक्त करता है; סָבִיב का वितरणात्मक भाव ‘चारों ओर’ से स्पष्ट होता है।
- source_word: וַיְחַטֵּא אֶת־הַמִּזְבֵּחַ
  choice: वेदी को शुद्ध किया
  rationale: पुरोहितीय अनुष्ठान में חטא का पिएल रूप पाप कराने का नहीं, अशुद्धि दूर करके शुद्ध करने का अर्थ देता है।
- source_word: יָצַק אֶל־יְסוֹד הַמִּזְבֵּחַ
  choice: वेदी के आधार पर उँडेल दिया
  rationale: יָצַק का अर्थ उँडेलना और יְסוֹד का यहाँ वेदी का आधार है। ‘उँडेल दिया’ पूर्ण क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: וַיְקַדְּשֵׁהוּ
  choice: वेदी को पवित्र किया
  rationale: קדשׁ यहाँ वेदी को पवित्र उपयोग के लिए अलग ठहराने को बताता है। सर्वनाम की जगह ‘वेदी’ दोहराने से हिन्दी में संदर्भ स्पष्ट रहता है।
- source_word: לְכַפֵּר עָלָיו
  choice: ताकि उसके लिए प्रायश्चित करे
  rationale: כפר के केंद्रीय बलिदानी अर्थ के लिए ‘प्रायश्चित करना’ स्थापित और बोधगम्य हिन्दी है। עַל यहाँ वेदी को अनुष्ठान के लक्ष्य के रूप में रखता है, इसलिए ‘उसके लिए’ स्वाभाविक है।
theological_decisions:
- issue: पुरोहितीय शुद्धिकरण में חטא का अर्थ
  choice: वेदी को शुद्ध किया
  alternative: वेदी को निर्मल किया
  rationale: वेदी ने पाप किया हो, ऐसा अर्थ नहीं लिया गया; लहू के अनुष्ठान द्वारा उसकी अनुष्ठानिक शुद्धि का भाव सुरक्षित रखा गया है।
- issue: बलिदानी प्रसंग में כפר का अर्थ और עַל का संबंध
  choice: उसके लिए प्रायश्चित करे
  alternative: उस पर प्रायश्चित करे / उसे दोषमुक्त करे
  rationale: ‘प्रायश्चित’ इब्रानी पद का धर्मवैचारिक भार बनाए रखता है। ‘उसके लिए’ वेदी को अनुष्ठान का लक्ष्य बताता है और हिन्दी में ‘उस पर प्रायश्चित’ की अस्वाभाविकता से बचता है; स्रोत में निहित शुद्धिकरण का निकट अर्थ वैकल्पिक रूप में दर्ज है।
translation_notes:
  register: 'आधुनिक मानक हिन्दी; गरिमामय पर सामान्य पाठक के लिए स्पष्ट। लंबे इब्रानी समन्वित वाक्य को पठनीयता हेतु तीन वाक्यों में बाँटा गया है। ‘बचा हुआ’ स्पष्टार्थक पूर्ति है: पहले कुछ लहू लगाया गया और फिर शेष वेदी के आधार पर उँडेला गया।'
