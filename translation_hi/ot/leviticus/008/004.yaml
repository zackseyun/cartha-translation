id: LEV.8.4
reference: Leviticus 8:4
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יַּ֣עַשׂ מֹשֶׁ֔ה כַּֽ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֹת֑/וֹ וַ/תִּקָּהֵל֙ הָֽ/עֵדָ֔ה אֶל פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/004.yaml
  text: And Moses did as Yahweh commanded him[a], and the congregation assembled at the entrance to the tent of meeting.
translation:
  language: hi
  text: और मूसा ने वैसा ही किया जैसा यहोवा ने उसे आज्ञा दी थी, और मण्डली मिलापवाले तम्बू के प्रवेश-द्वार पर इकट्ठी हुई।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּעַשׂ
  choice: ने...किया
  rationale: עשה का व्यापक अर्थ ‘करना/बनाना’ है; आज्ञापालन के इस प्रसंग में ‘किया’ स्वाभाविक और सीधा है।
- source_word: כַּאֲשֶׁר
  choice: वैसा ही...जैसा
  rationale: यह आज्ञा के अनुरूप कार्य किए जाने को व्यक्त करता है; ‘वैसा ही...जैसा’ अनुरूपता के बल को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: צִוָּה
  choice: आज्ञा दी थी
  rationale: צוה अधिकारपूर्ण आदेश को दर्शाता है; ‘आज्ञा दी’ इसकी शक्ति को सुरक्षित रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से प्रतिस्थापित नहीं किया गया।
- source_word: אֹתוֹ
  choice: उसे
  rationale: कर्मवाचक सर्वनाम मूसा की ओर संकेत करता है।
- source_word: וַתִּקָּהֵל
  choice: इकट्ठी हुई
  rationale: קהל के निफ़अल रूप का अर्थ समुदाय का एकत्र होना है; स्त्रीलिंग एकवचन ‘मण्डली’ के साथ ‘इकट्ठी हुई’ सहज हिन्दी है और अनावश्यक रूप से कर्मवाच्य नहीं बनाता।
- source_word: הָעֵדָה
  choice: सारी मण्डली
  rationale: עֵדָה यहाँ इस्राएल के सामुदायिक जनसमूह को सूचित करता है। निश्चित पदबंध को हिन्दी में स्वाभाविक सामूहिक अर्थ देने के लिए ‘सारी मण्डली’ चुना गया है।
- source_word: אֶל פֶּתַח
  choice: प्रवेश-द्वार पर
  rationale: אֶל सामान्यतः दिशा ‘की ओर/तक’ बताता है, पर एकत्र होने की परिणति को हिन्दी में ‘प्रवेश-द्वार पर’ स्वाभाविक रूप से व्यक्त किया जाता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तम्बू
  rationale: यह पवित्र तम्बू का स्थापित हिन्दी नाम है और उस स्थान की भेंट/मिलन-संबंधी भूमिका को व्यक्त करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत ईश्वरीय नाम स्पष्ट रूप से है। हिन्दी पाठकों में परिचित लिप्यंतरण ‘यहोवा’ नाम को उपाधि ‘प्रभु’ से बदले बिना सुरक्षित रखता है।
- issue: וַתִּקָּהֵל की वाच्यता
  choice: मण्डली...इकट्ठी हुई
  alternative: मण्डली इकट्ठी की गई
  rationale: निफ़अल रूप मध्य/अकर्मक या कर्मवाच्य भाव दे सकता है। प्रसंग किसी मानवीय आयोजक को स्पष्ट नहीं करता, इसलिए स्वाभाविक अकर्मक हिन्दी चुनी गई और संभावित एजेंसी को जोड़ा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘मण्डली’ और ‘मिलापवाला तम्बू’ पंचग्रन्थीय धार्मिक प्रसंग में परिचित पद हैं। मूल की अस्पष्ट वाच्यता को सहज अकर्मक हिन्दी में रखा गया है; इस एक-पद पाठ में पादटिप्पणी आवश्यक नहीं समझी गई।
