source:
  edition: WLC
  text: כַּ/אֲשֶׁ֥ר עָשָׂ֖ה בַּ/יּ֣וֹם הַ/זֶּ֑ה צִוָּ֧ה יְהוָ֛ה לַ/עֲשֹׂ֖ת לְ/כַפֵּ֥ר עֲלֵי/כֶֽם׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/034.yaml
  text: Just as has been done on this day[a], Yahweh has commanded to be done, to make atonement for you.
translation:
  language: hi
  text: जैसा आज किया गया है,[a] वैसा ही यहोवा ने करने की आज्ञा दी है, ताकि तुम्हारे लिए प्रायश्चित किया जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “आज जैसा किया गया, यहोवा ने वैसा ही करने की आज्ञा दी है, जिससे तुम्हारे लिए प्रायश्चित हो।”
    reason: वाक्य-विन्यास का वैकल्पिक, किंतु अर्थ-संगत रूप।
lexical_decisions:
- source_word: כַּאֲשֶׁר
  choice: जैसा… वैसा ही
  rationale: यह तुलना का भाव स्पष्ट और स्वाभाविक हिन्दी में व्यक्त करता है तथा पहले किए गए संस्कारों को आगे दी गई आज्ञा से जोड़ता है।
- source_word: עָשָׂה
  choice: किया गया है
  rationale: यद्यपि इब्रानी रूप व्याकरणतः अन्य पुरुष एकवचन है, यहाँ कर्ता अनिर्दिष्ट रह सकता है और आशय अभी संपन्न हुए संस्कार से है; कर्मवाच्य हिन्दी अनावश्यक रूप से कर्ता निश्चित नहीं करती।
- source_word: בַּיּוֹם הַזֶּה
  choice: आज
  rationale: शाब्दिक अर्थ ‘इस दिन’ है; वर्तमान अनुष्ठान के दिन के लिए ‘आज’ सहज और स्पष्ट आधुनिक हिन्दी है।
- source_word: צִוָּה
  choice: आज्ञा दी है
  rationale: 'पूर्ण क्रिया की वर्तमान प्रासंगिकता बनाए रखता है: यहोवा की दी हुई आज्ञा अभी लागू है।'
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को किसी उपाधि से बदलने के बजाय हिन्दी में प्रचलित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: לַעֲשֹׂת
  choice: करने
  rationale: यह पहले आए עשה की पुनरावृत्ति को स्वाभाविक हिन्दी में बनाए रखता है और संस्कार-संबंधी कार्यों को संपन्न करने का अर्थ देता है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित किया जाए
  rationale: याजकीय बलिदानी संदर्भ में כפר का स्थापित, समझने योग्य अर्थ देता है; क्रियावाच्य रचना अनिर्दिष्ट अनुष्ठानकर्ता को खुला रखती है।
- source_word: עֲלֵיכֶם
  choice: तुम्हारे लिए
  rationale: כפר के साथ על यहाँ लाभ अथवा प्रतिनिधित्व का भाव देता है; ‘तुम्हारे लिए’ स्वाभाविक और संक्षिप्त है।
theological_decisions:
- issue: बलिदानी संदर्भ में כפר का अनुवाद
  choice: तुम्हारे लिए प्रायश्चित किया जाए
  alternative: तुम्हारा प्रायश्चित किया जाए; तुम्हारे पाप ढाँपे जाएँ
  rationale: ‘प्रायश्चित’ याजकीय अर्थ को सुरक्षित रखता है, पर यह तय नहीं करता कि क्रिया को केवल शमन, दोष-निवारण या शुद्धिकरण की किसी एक संकीर्ण धर्मवैज्ञानिक श्रेणी में समझा जाए।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘प्रायश्चित’ याजकीय संदर्भ के कारण अपेक्षाकृत औपचारिक है, पर हिन्दी बाइबलीय प्रयोग में व्यापक रूप से समझा जाता है।
