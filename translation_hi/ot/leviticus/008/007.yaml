base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/007.yaml
  text: And he put the tunic on him[a], and fastened him with the sash, and clothed him with the robe, and put the ephod on him, and fastened it on him with the skillfully woven band of the ephod[b], and tied the ephod to him with it.
translation:
  language: hi
  text: फिर उसने उसे अंगरखा पहनाया, उसकी कमर में पटुका बाँधा, उसे चोगा पहनाया और उस पर एपोद रखा। फिर उसने एपोद के कुशलता से बुने हुए कमरबंद[a] से उसकी कमर बाँधी और उसी से एपोद को उस पर कस दिया[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसका अनुवाद ‘एपोद का सजावटी पट्टा’ या ‘एपोद का कमर-पट्टा’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: यहाँ प्रयुक्त इब्रानी क्रिया दुर्लभ है। सम्भवतः इसका अर्थ है कि एपोद को उसके बुने हुए कमरबंद से हारून के शरीर पर सुरक्षित कर दिया गया।
    reason: cultural_note
lexical_decisions:
- source_word: כֻּתֹּנֶת
  choice: अंगरखा
  rationale: यह शरीर पर पहने जाने वाले मूल याजकीय वस्त्र को दर्शाता है; ‘अंगरखा’ आधुनिक हिन्दी में स्वाभाविक और पर्याप्त रूप से विशिष्ट है।
- source_word: אַבְנֵט
  choice: पटुका
  rationale: यह कमर के चारों ओर बाँधी जाने वाली कपड़े की पट्टी है; ‘पटुका’ इसे साधारण चमड़े की पेटी से अलग रखते हुए अनुष्ठानिक वस्त्र के अनुकूल है।
- source_word: מְעִיל
  choice: चोगा
  rationale: यह अंगरखे के ऊपर पहना जाने वाला बाहरी वस्त्र है; ‘चोगा’ सामान्य पाठक के लिए स्पष्ट है।
- source_word: אֵפֹד
  choice: एपोद
  rationale: यह एक विशिष्ट याजकीय परिधान है जिसका सटीक हिन्दी पर्याय नहीं है; लिप्यंतरण उसकी सांस्कृतिक विशिष्टता बनाए रखता है।
- source_word: חֵשֶׁב הָאֵפֹד
  choice: एपोद का बुना हुआ कमरबंद
  rationale: सन्दर्भ में यह एपोद से जुड़ा बुना हुआ पट्टा या कमरबंद है। मुख्य पाठ में उसके रूप और काम दोनों को सहज हिन्दी में व्यक्त किया गया है, जबकि सम्भव अलंकरण को पादटिप्पणी में खुला रखा गया है।
- source_word: וַיַּחְגֹּר אֹתוֹ
  choice: उसकी कमर में पटुका बाँधा
  rationale: חגר का आशय कमर के चारों ओर बाँधने से है। यह प्रयोग शाब्दिक सम्बन्ध बनाए रखते हुए अप्रचलित ‘कटिबद्ध किया’ से अधिक स्वाभाविक है।
- source_word: וַיֶּאְפֹּד לוֹ בּוֹ
  choice: उसी से एपोद को उस पर कस दिया
  rationale: दुर्लभ denominative क्रिया एपोद को उसके अपने कमरबंद द्वारा शरीर पर सुरक्षित करने का बोध देती है। ‘कस दिया’ क्रिया के कार्य को स्पष्ट करती है, पर पादटिप्पणी मूल की दुर्लभता बताती है।
- source_word: וַיִּתֵּן עָלָיו
  choice: उस पर ... रखा
  rationale: एपोद पहनाने की क्रिया के लिए मूल के ‘उस पर रखा’ रूप को स्वाभाविक हिन्दी में बनाए रखा गया है।
theological_decisions:
- issue: याजकीय परिधान की विशेष शब्दावली
  choice: ‘एपोद’ को लिप्यंतरित रखा गया और सामान्य वस्त्रों के लिए प्रचलित हिन्दी शब्द अपनाए गए।
  alternative: ‘एपोद’ का वर्णनात्मक अनुवाद, जैसे ‘एप्रन-जैसा याजकीय वस्त्र’।
  rationale: पद मुख्यतः परिधान-विधि का वर्णन करता है। ‘एपोद’ का लिप्यंतरण उसकी उपासना-संबंधी विशिष्टता को बिना किसी अनिश्चित आकार की व्याख्या थोपे सुरक्षित रखता है।
- issue: अंतिम दुर्लभ क्रिया וַיֶּאְפֹּד का अर्थ
  choice: इसे एपोद को उसके बुने हुए कमरबंद से शरीर पर कसने के रूप में व्यक्त किया गया।
  alternative: ‘उसे उससे एपोद पहनाया’ या ‘उसे उससे बाँधा’।
  rationale: क्रिया אֵפֹד से बनी है और בּוֹ निकटतम ‘कमरबंद’ की ओर संकेत करता है। अनुवाद सम्भावित क्रियात्मक अर्थ देता है, जबकि पादटिप्पणी दुर्लभता और व्याख्यात्मक प्रकृति स्पष्ट करती है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किन्तु सहज शैली अपनाई गई है। क्रमिक वाक्यरचना मूल की वस्त्र पहनाने की चरणबद्ध प्रक्रिया को बनाए रखती है। ‘एपोद’ तकनीकी धार्मिक पद के रूप में रखा गया है; ‘कटिबद्ध’ जैसे अप्रचलित शब्दों से बचा गया है।
