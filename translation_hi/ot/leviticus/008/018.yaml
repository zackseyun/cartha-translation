base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/018.yaml
  text: Then he brought near the ram of the burnt offering[b][a], and Aaron and his sons laid their hands on the head of the ram.
translation:
  language: hi
  text: तब वह होमबलि का मेढ़ा आगे लाया[a], और हारून तथा उसके पुत्रों ने मेढ़े के सिर पर अपने हाथ रखे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “निकट ले आया” अथवा “प्रस्तुत किया।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी क्रिया का अनुवाद “हाथ टिकाए” या “दबाकर रखे” भी किया जा सकता है; यह बलि के पशु पर की जाने वाली अनुष्ठानिक क्रिया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: आगे लाया
  rationale: हिफ़ील रूप का अर्थ किसी वस्तु को निकट लाना या अनुष्ठान के लिए प्रस्तुत करना है। ‘आगे लाया’ आधुनिक हिन्दी में स्वाभाविक है और अनुष्ठानिक प्रस्तुति का भाव बनाए रखता है; कर्ता तत्काल प्रसंग से मूसा है, पर इब्रानी के समान यहाँ सर्वनाम रखा गया है।
- source_word: אֵיל
  choice: मेढ़ा
  rationale: यह नर भेड़ के लिए प्रचलित और सटीक हिन्दी शब्द है।
- source_word: הָעֹלָה
  choice: होमबलि
  rationale: עֹלָה के लिए स्थापित बाइबलीय हिन्दी शब्द; यह उस बलि को सूचित करता है जो पूर्णतः वेदी पर जलाई जाती है।
- source_word: וַיִּסְמְכוּ
  choice: अपने हाथ रखे
  rationale: बलिदान के पशु पर हाथ रखने की अनुष्ठानिक क्रिया को सहज हिन्दी में व्यक्त करता है। मूल क्रिया में हाथ टिकाने या दबाकर रखने का भाव भी हो सकता है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יְדֵיהֶם
  choice: अपने हाथ
  rationale: इब्रानी का बहुवचन बनाए रखा गया है; ‘अपने’ स्पष्ट करता है कि हारून और उसके पुत्रों ने स्वयं यह क्रिया की।
- source_word: עַל רֹאשׁ הָאָיִל
  choice: मेढ़े के सिर पर
  rationale: मूल संबंधबोधक पदबंध का सीधा, स्पष्ट और स्वाभाविक हिन्दी रूप।
theological_decisions:
- issue: बलिदान के प्रसंग में पशु पर हाथ रखना
  choice: मेढ़े के सिर पर अपने हाथ रखे
  alternative: मेढ़े के सिर पर अपने हाथ टिकाए / दबाकर रखे
  rationale: पद केवल अनुष्ठानिक क्रिया बताता है; यह स्वयं स्पष्ट नहीं करता कि इसका अर्थ दोष का स्थानांतरण, प्रतिनिधित्व या पहचान है। इसलिए अनुवाद किसी एक धर्मवैचारिक व्याख्या को आरोपित नहीं करता।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज रखी गई है। ‘होमबलि’ स्थापित धार्मिक शब्दावली के कारण रखा गया है। ‘तथा’ वाक्य को औपचारिक गरिमा देता है, जबकि शेष रचना सरल आधुनिक हिन्दी में है।
