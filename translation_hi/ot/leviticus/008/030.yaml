id: LEV.8.30
reference: Leviticus 8:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יִּקַּ֨ח מֹשֶׁ֜ה מִ/שֶּׁ֣מֶן הַ/מִּשְׁחָ֗ה וּ/מִן הַ/דָּם֮ אֲשֶׁ֣ר עַל הַ/מִּזְבֵּחַ֒ וַ/יַּ֤ז עַֽל אַהֲרֹן֙ עַל בְּגָדָ֔י/ו וְ/עַל בָּנָ֛י/ו וְ/עַל בִּגְדֵ֥י בָנָ֖י/ו אִתּ֑/וֹ וַ/יְקַדֵּ֤שׁ אֶֽת אַהֲרֹן֙ אֶת בְּגָדָ֔י/ו וְ/אֶת בָּנָ֛י/ו וְ/אֶת בִּגְדֵ֥י בָנָ֖י/ו אִתּֽ/וֹ־־־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/030.yaml
  text: Then Moses took some of the anointing oil and some of the blood that was on the altar[a], and sprinkled it on Aaron, on his garments, on his sons, and on the garments of his sons with him; so he consecrated Aaron, his garments, his sons, and the garments of his sons with him.
translation:
  language: hi
  text: तब मूसा ने अभिषेक के तेल में से कुछ और वेदी पर के लहू में से कुछ लिया और उसे हारून पर, उसके वस्त्रों पर, उसके बेटों पर और उसके साथ उपस्थित उसके बेटों के वस्त्रों पर छिड़का। इस प्रकार उसने हारून को, उसके वस्त्रों को, उसके बेटों को और उसके साथ उपस्थित उसके बेटों के वस्त्रों को पवित्र ठहराया[a]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पवित्र किया।”
    reason: קדשׁ का अधिक शाब्दिक विकल्प; मुख्य पाठ का ‘पवित्र ठहराया’ पुरोहितीय संस्कार में अलग किए जाने के भाव को अधिक स्वाभाविक हिन्दी में व्यक्त करता है।
lexical_decisions:
- source_word: וַיִּקַּח ... מִשֶּׁמֶן ... וּמִן הַדָּם
  choice: अभिषेक के तेल में से कुछ और ... लहू में से कुछ लिया
  rationale: क्रिया का अर्थ ‘लिया’ है, जबकि दो बार प्रयुक्त מִן अंश ग्रहण करने का भाव देता है; हिन्दी में ‘में से कुछ’ इसे स्पष्ट और स्वाभाविक रूप से व्यक्त करता है।
- source_word: שֶׁמֶן הַמִּשְׁחָה
  choice: अभिषेक का तेल
  rationale: यह पुरोहितीय संस्कार के लिए प्रयुक्त तेल का सीधा, प्रचलित और गरिमापूर्ण हिन्दी पद है।
- source_word: הַדָּם אֲשֶׁר עַל הַמִּזְבֵּחַ
  choice: वेदी पर का लहू
  rationale: सम्बन्धवाचक उपवाक्य को स्वाभाविक हिन्दी संरचना में संक्षिप्त किया गया है; ‘लहू’ धार्मिक-बलिदानी प्रसंग में स्पष्ट और परिचित है।
- source_word: וַיַּז
  choice: छिड़का
  rationale: नזה का हिफ़ील पुरोहितीय अनुष्ठान में किसी द्रव को छिड़कने का संकेत देता है। निहित कर्म को हिन्दी में ‘उसे’ से व्यक्त किया गया है, जो अभी उल्लिखित तेल और लहू को सामूहिक रूप से संदर्भित करता है।
- source_word: בְּגָדָיו / בִּגְדֵי בָנָיו
  choice: उसके वस्त्र / उसके बेटों के वस्त्र
  rationale: ‘वस्त्र’ अनुष्ठानिक प्रसंग की गरिमा बनाए रखता है और सामान्य पाठक के लिए भी सहज है।
- source_word: בָּנָיו
  choice: उसके बेटे
  rationale: इब्रानी शब्द स्पष्ट रूप से पुल्लिंग बहुवचन है और यहाँ हारून के पुरोहित-पुत्रों को संदर्भित करता है।
- source_word: אִתּוֹ
  choice: उसके साथ उपस्थित
  rationale: शाब्दिक ‘उसके साथ’ की सम्बन्धगत अस्पष्टता हिन्दी में असहज हो सकती थी; ‘उपस्थित’ जोड़कर यह स्पष्ट किया गया है कि बेटे संस्कार में हारून के साथ थे, बिना कोई नया धार्मिक अर्थ जोड़े।
- source_word: וַיְקַדֵּשׁ
  choice: पवित्र ठहराया
  rationale: קדשׁ यहाँ व्यक्तियों और वस्त्रों को पवित्र सेवा के लिए अलग किए जाने को दर्शाता है। ‘पवित्र ठहराया’ इस अनुष्ठानिक अर्थ को समझने योग्य हिन्दी में बनाए रखता है।
theological_decisions:
- issue: पुरोहितीय प्रतिष्ठापन के प्रसंग में קדשׁ का अनुवाद
  choice: पवित्र ठहराया
  alternative: पवित्र किया; समर्पित किया
  rationale: ‘पवित्र ठहराया’ पवित्र सेवा के लिए अलग किए जाने का भाव रखता है और यह दावा नहीं करता कि क्रिया का अर्थ केवल पदस्थापन या केवल नैतिक शुद्धि है।
- issue: हारून की सन्तान का लिंग-सूचक उल्लेख
  choice: उसके बेटे
  alternative: उसकी सन्तान
  rationale: मूल पाठ पुल्लिंग बहुवचन का प्रयोग करता है और प्रसंग में पुरोहितीय संस्कार ग्रहण करने वाले हारून के बेटों की बात है; इसलिए लिंग-विशिष्टता सुरक्षित रखी गई है।
translation_notes:
  register: आधुनिक मानक हिन्दी, गरिमापूर्ण किंतु सरल धार्मिक शैली। ‘अभिषेक’, ‘वेदी’, ‘लहू’ और ‘पवित्र ठहराया’ जैसे परिचित बाइबलीय पद रखे गए हैं। इब्रानी सूची की पुनरावृत्ति और सभी व्यक्तियों तथा वस्त्रों का स्पष्ट उल्लेख सुरक्षित रखा गया है।
