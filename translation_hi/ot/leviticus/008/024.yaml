  text: וַ/יַּקְרֵ֞ב אֶת בְּנֵ֣י אַהֲרֹ֗ן וַ/יִּתֵּ֨ן מֹשֶׁ֤ה מִן הַ/דָּם֙ עַל תְּנ֤וּךְ אָזְנָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֤הֶן יָדָ/ם֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְלָ֖/ם הַ/יְמָנִ֑ית וַ/יִּזְרֹ֨ק מֹשֶׁ֧ה אֶת הַ/דָּ֛ם עַל הַֽ/מִּזְבֵּ֖חַ סָבִֽיב־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/024.yaml
  text: Then he brought Aaron’s sons near, and Moses put some of the blood on the lobe of their right ear, on the thumb of their right hand, and on the big toe of their right foot. Then Moses threw the blood against the altar all around.
translation:
  language: hi
  text: फिर वह हारून के पुत्रों को पास ले आया। मूसा ने उनके दाहिने कान की लौ, दाहिने हाथ के अँगूठे और दाहिने पैर के अँगूठे पर कुछ लहू लगाया। फिर मूसा ने लहू को वेदी के चारों ओर छिड़का।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: पास ले आया
  rationale: हिफ़ील रूप का प्रेरणार्थक भाव बनाए रखता है और अभिषेक-विधि में व्यक्तियों को आगे लाने का स्वाभाविक हिन्दी वर्णन है।
- source_word: תְּנוּךְ אָזְנָם הַיְמָנִית
  choice: उनके दाहिने कान की लौ
  rationale: תְּנוּךְ कान के बाहरी सिरे या लौ को सूचित करता है; हिन्दी में 'कान की लौ' स्पष्ट और प्रचलित शारीरिक पद है।
- source_word: בֹּהֶן יָדָם הַיְמָנִית
  choice: दाहिने हाथ के अँगूठे
  rationale: בֹּהֶן हाथ के संदर्भ में अँगूठा है। सामूहिक एकवचन को हिन्दी में प्रत्येक पुत्र के अंग का बोध कराने वाले स्वाभाविक रूप में रखा गया है।
- source_word: בֹּהֶן רַגְלָם הַיְמָנִית
  choice: दाहिने पैर के अँगूठे
  rationale: पैर के संदर्भ में בֹּהֶן बड़े अँगूठे को दर्शाता है; हिन्दी में 'पैर का अँगूठा' सामान्य और असंदिग्ध है।
- source_word: וַיִּזְרֹק
  choice: छिड़का
  rationale: זרק वेदी पर लहू को जोर से डालने/छिड़कने की संस्कारगत क्रिया है। 'छिड़का' आधुनिक हिन्दी में स्वाभाविक है और वेदी के चारों ओर लहू लगाने की विधिक क्रिया व्यक्त करता है।
- source_word: סָבִיב
  choice: चारों ओर
  rationale: वेदी के आसपास या उसकी सभी भुजाओं पर किए गए कर्म का संक्षिप्त और सटीक हिन्दी रूप।
