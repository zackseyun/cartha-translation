  text: וַ/יִּקַּ֨ח מֹשֶׁ֤ה אֹתָ/ם֙ מֵ/עַ֣ל כַּפֵּי/הֶ֔ם וַ/יַּקְטֵ֥ר הַ/מִּזְבֵּ֖חָ/ה עַל הָ/עֹלָ֑ה מִלֻּאִ֥ים הֵם֙ לְ/רֵ֣יחַ נִיחֹ֔חַ אִשֶּׁ֥ה ה֖וּא לַ/יהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/028.yaml
  text: Then Moses took them from their palms and burned them on the altar[a], on top of the burnt offering. They were an ordination offering for a pleasing aroma[b], a food offering to Yahweh.
translation:
  language: hi
  text: तब मूसा ने उन्हें उनकी हथेलियों से लिया और उन्हें वेदी पर होमबलि के ऊपर धुएँ में चढ़ाया। यह याजकीय स्थापना की भेंट थी, यहोवा के लिए सुखद सुगंध वाली अग्नि-भेंट।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מֵעַל כַּפֵּיהֶם
  choice: उनकी हथेलियों पर से
  rationale: शाब्दिक रूप से ‘उनकी हथेलियों के ऊपर से’; अनुष्ठान में रखे गए अंशों की स्थिति को स्वाभाविक हिन्दी में स्पष्ट रखता है।
- source_word: וַיַּקְטֵר
  choice: जलाकर धुआँ कर दिया
  rationale: बलिदानी सन्दर्भ में हिफ़ील रूप का अर्थ वेदी पर चढ़ाकर धुएँ में ऊपर उठाना है; केवल ‘जलाया’ की अपेक्षा यह मूल क्रिया की विशिष्टता अधिक स्पष्ट करता है।
- source_word: עַל הָעֹלָה
  choice: होमबलि के ऊपर
  rationale: עַל का सामान्य अर्थ ‘ऊपर’ है और यहाँ अंशों को होमबलि के ऊपर जलाने का अनुष्ठानिक स्थान बताता है।
- source_word: מִלֻּאִים
  choice: याजक-अभिषेक की भेंट
  rationale: यह याजकों की स्थापना के अनुष्ठान का तकनीकी पद है। ‘याजक-अभिषेक’ आधुनिक हिन्दी पाठक को प्रसंग स्पष्ट करता है, पर बाद की कलीसियाई पदवी का संकेत नहीं देता।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध के लिए
  rationale: मान्य बलिदानी मुहावरे को स्वाभाविक और गरिमापूर्ण हिन्दी में रखता है तथा ईश्वरीय स्वीकृति का भाव बनाए रखता है।
- source_word: אִשֶּׁה
  choice: अग्नि में चढ़ाई गई भेंट
  rationale: यह आग के द्वारा वेदी पर चढ़ाई जाने वाली भेंट का तकनीकी बलिदानी पद है; यह अर्थ ‘भोजन-भेंट’ की अपेक्षा स्रोत से अधिक प्रत्यक्ष है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिवाचक वाचा-नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है।
theological_decisions:
- issue: מִלֻּאִים का याजकीय तकनीकी अर्थ
  choice: याजक-अभिषेक की भेंट
  alternative: अभिषेक की भेंट; प्रतिष्ठा की भेंट
  rationale: सन्दर्भ हारून और उसके पुत्रों की याजकीय स्थापना का है। चुना हुआ रूप अनुष्ठान का विशेष प्रयोजन बताता है, बिना बाद की सम्प्रदायगत पद-व्यवस्था आरोपित किए।
- issue: אִשֶּׁה की बलिदानी संज्ञा
  choice: अग्नि में चढ़ाई गई भेंट
  alternative: अग्नि-भेंट; भोजन-भेंट
  rationale: शब्द की व्युत्पत्ति निश्चित नहीं है, पर याजकीय प्रयोग अग्नि पर चढ़ाई गई भेंट को दर्शाता है। चुना हुआ रूप इस बलिदानी क्रिया को स्पष्ट रखता है और ‘भोजन’ की विवादित व्याख्या नहीं थोपता।
- issue: יהוה का निरूपण
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल में ईश्वर का व्यक्तिवाचक वाचा-नाम है; उसका लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज और स्रोत-सन्निकट शैली। ‘जलाकर धुआँ कर दिया’ बलिदानी क्रिया को स्पष्ट करता है; तकनीकी शब्दों को अत्यधिक संस्कृतनिष्ठ बनाए बिना याजकीय प्रसंग बनाए रखा गया है।
