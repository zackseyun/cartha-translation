  text: וַ/יַּ֥ז מִמֶּ֛/נּוּ עַל הַ/מִּזְבֵּ֖חַ שֶׁ֣בַע פְּעָמִ֑ים וַ/יִּמְשַׁ֨ח אֶת הַ/מִּזְבֵּ֜חַ וְ/אֶת כָּל כֵּלָ֗י/ו וְ/אֶת הַ/כִּיֹּ֛ר וְ/אֶת כַּנּ֖/וֹ לְ/קַדְּשָֽׁ/ם־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/011.yaml
  text: He sprinkled some of it on the altar seven times[a], and he anointed the altar and all its utensils, and the basin and its stand[b], to consecrate them.
translation:
  language: hi
  text: उसने अभिषेक के तेल में से कुछ वेदी पर सात बार छिड़का[a], और वेदी, उसके सभी उपकरणों, हौद और उसके आधार का अभिषेक किया, ताकि उन्हें पवित्र करने के लिए अलग करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ ‘उसमें से’ है; संदर्भ में इसका संकेत अभिषेक के तेल की ओर है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיַּז
  choice: उसने ... छिड़का
  rationale: हिफ़िल रूप यहाँ अनुष्ठान के संदर्भ में किसी द्रव को छिड़कने की क्रिया बताता है; ‘छिड़का’ सहज और सटीक हिन्दी है।
- source_word: מִמֶּנּוּ
  choice: उसमें से कुछ अभिषेक-तेल
  rationale: इब्रानी का शाब्दिक अर्थ ‘उसमें से’ है और संदर्भ अभिषेक के तेल का है। मुख्य पाठ में संदर्भ स्पष्ट किया गया है, जबकि पादटिप्पणी शाब्दिक रूप सुरक्षित रखती है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान संबंधी संदर्भ में מִזְבֵּחַ का मानक और सर्वसुलभ हिन्दी पर्याय।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: दोहराई गई अनुष्ठानिक क्रिया को बताने वाला सीधा संख्यात्मक पद।
- source_word: וַיִּמְשַׁח
  choice: अभिषेक किया
  rationale: पवित्र-स्थान के संस्कार में משׁח के अनुष्ठानिक अर्थ को स्थापित किन्तु बोधगम्य हिन्दी में व्यक्त करता है।
- source_word: כָּל כֵּלָיו
  choice: उसके सभी उपकरणों
  rationale: כְּלִי यहाँ वेदी से जुड़े सामान या साधनों के लिए व्यापक शब्द है; ‘उपकरण’ आधुनिक और स्पष्ट है।
- source_word: הַכִּיֹּר
  choice: हौद
  rationale: यह मिलापवाले तंबू के प्रांगण में धोने के लिए रखे बड़े पात्र को दर्शाता है; ‘हौद’ हिन्दी पाठक के लिए ‘हौज़’ की अपेक्षा मानक और ‘पात्र’ की अपेक्षा अधिक विशिष्ट है।
- source_word: כַּנּוֹ
  choice: उसके आधार
  rationale: כֵּן हौद को थामने वाली संरचना को दर्शाता है; ‘आधार’ स्वाभाविक हिन्दी है और ‘चौकी’ जैसी अनावश्यक आकृति नहीं जोड़ता।
- source_word: לְקַדְּשָׁם
  choice: ताकि उन्हें पवित्र ठहराए
  rationale: यह पवित्र उपयोग के लिए अलग ठहराने का भाव व्यक्त करता है। ‘पवित्र ठहराना’ सामान्य पाठक के लिए ‘प्रतिष्ठित करना’ से अधिक पारदर्शी है और कर्मकांडीय आशय बनाए रखता है।
theological_decisions:
- issue: पवित्र वस्तुओं और अनुष्ठानिक क्रियाओं की शब्दावली
  choice: ‘अभिषेक किया’ और ‘पवित्र ठहराए’ जैसी स्थापित, पठनीय अनुष्ठानिक भाषा
  alternative: ‘तेल लगाया’ और ‘प्रतिष्ठित करे’ अथवा ‘पवित्रीकरण करे’
  rationale: पद तंबू-संबंधी वस्तुओं को पवित्र सेवा के लिए अलग किए जाने का वर्णन करता है। चुनी हुई भाषा अनुष्ठानिक महत्त्व बनाए रखती है, पर बाद की किसी विशिष्ट सांप्रदायिक व्याख्या को आरोपित नहीं करती।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज कथन। ‘वेदी’, ‘अभिषेक’ और ‘पवित्र ठहराना’ जैसे परिचित बाइबलीय शब्द रखे गए हैं; ‘हौद’ और ‘आधार’ वस्तुओं को सामान्य पाठक के लिए स्पष्ट करते हैं।
