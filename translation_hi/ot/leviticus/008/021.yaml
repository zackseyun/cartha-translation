  text: וְ/אֶת הַ/קֶּ֥רֶב וְ/אֶת הַ/כְּרָעַ֖יִם רָחַ֣ץ בַּ/מָּ֑יִם וַ/יַּקְטֵר֩ מֹשֶׁ֨ה אֶת כָּל הָ/אַ֜יִל הַ/מִּזְבֵּ֗חָ/ה עֹלָ֨ה ה֤וּא לְ/רֵֽיחַ נִיחֹ֨חַ֙ אִשֶּׁ֥ה הוּא֙ לַ/יהוָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/021.yaml
  text: He washed the entrails and the legs with water[a], and Moses burned the whole ram on the altar. It was a burnt offering for a pleasing aroma, a food offering to Yahweh, just as Yahweh had commanded Moses.
translation:
  language: hi
  text: मूसा ने अंतड़ियों और टाँगों को पानी से धोया, और पूरे मेढ़े को वेदी पर जलाया। यह याहवे के लिए सुखदायक सुगंध की होमबलि, अर्थात् अग्नि-अर्पण[a] थी—ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “भोजन-अर्पण।”
    reason: אִשֶּׁה के लिए एक अन्य संभव संदर्भगत अनुवाद, जो वेदी पर चढ़ाए अर्पण को परमेश्वर के भोजन के रूप में प्रस्तुत करता है।
lexical_decisions:
- source_word: הַקֶּרֶב
  choice: अंतड़ियों
  rationale: बलि-पशु के भीतरी अंगों के लिए ठोस और सामान्य आधुनिक हिन्दी शब्द; संदर्भ में केवल अमूर्त ‘भीतरी भाग’ कहने से अधिक स्पष्ट।
- source_word: הַכְּרָעַיִם
  choice: टाँगों
  rationale: बलि-विधान में पशु के निचले पैरों/टाँगों का संकेत करता है; ‘टाँगें’ सहज और स्पष्ट है।
- source_word: רָחַץ בַּמָּיִם
  choice: पानी से धोया
  rationale: इब्रानी में पानी का स्पष्ट उल्लेख है; हिन्दी में यह अनुष्ठानिक क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: וַיַּקְטֵר
  choice: वेदी पर जलाया
  rationale: याजकीय संदर्भ में बलि को वेदी पर जलाकर धुएँ के रूप में चढ़ाने का भाव है; ‘जलाया’ आधुनिक हिन्दी में स्वाभाविक है और वेदी का संदर्भ विशिष्ट बलिदानी अर्थ बनाए रखता है।
- source_word: כָּל הָאַיִל
  choice: पूरे मेढ़े को
  rationale: כָּל पशु की संपूर्णता पर बल देता है; ‘पूरा मेढ़ा’ इसका सीधा और सहज रूप है।
- source_word: עֹלָה
  choice: होमबलि
  rationale: पूर्णतः वेदी पर जलाई जाने वाली बलि के लिए हिन्दी बाइबलीय परंपरा में स्थापित और संक्षिप्त पद।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंधवाली
  rationale: मूल की सुगंध संबंधी उपमा और परमेश्वर को बलि के स्वीकार्य/मनभावन होने का भाव दोनों बनाए रखता है।
- source_word: אִשֶּׁה
  choice: अग्नि-अर्पण
  rationale: यह शब्द आग के द्वारा चढ़ाए गए अर्पण को दर्शाता है। ‘अग्नि-अर्पण’ संक्षिप्त है; संभावित ‘भोजन-अर्पण’ अर्थ को पादटिप्पणी में रखा गया है।
- source_word: יְהוָה
  choice: याहवे
  rationale: मूल में आए परमेश्वर के व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिन्दी में लिप्यंतरित किया गया है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे याहवे ने मूसा को आज्ञा दी थी
  rationale: כַּאֲשֶׁר द्वारा व्यक्त पूर्ण अनुरूपता को ‘ठीक वैसे ही’ स्पष्ट करता है और हिन्दी कथात्मक शैली में स्वाभाविक है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: पाठ में वाचा-नाम स्वयं उपस्थित है; ‘याहवे’ मूल नाम का निकट हिन्दी लिप्यंतरण है और उसे किसी उपाधि से नहीं बदलता।
- issue: बलिदानी पद לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंधवाली
  alternative: मनभावनी सुगंध के लिए
  rationale: यह रूप मूल की इंद्रिय-संबंधी उपमा को बनाए रखता है और बलि की स्वीकार्यता का भाव देता है, बिना यह तय किए कि भाषा को केवल रूपक ही समझा जाए।
- issue: אִשֶּׁה का अर्थ
  choice: अग्नि-अर्पण
  alternative: भोजन-अर्पण
  rationale: शब्द की व्युत्पत्ति और बलिदानी प्रयोग आग द्वारा चढ़ाए अर्पण का समर्थन करते हैं, जबकि कुछ संदर्भों में वेदी पर परमेश्वर के भोजन की धारणा के कारण ‘भोजन-अर्पण’ भी प्रस्तावित है; इस विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘होमबलि’ और ‘अग्नि-अर्पण’ जैसे स्थापित बलिदानी पद तकनीकी सटीकता बनाए रखते हैं। पहले क्रियापद का कर्ता इब्रानी में अंतर्निहित है; हिन्दी में ‘उसने’ रखकर मूल की वाक्यगत बनावट बनाए रखी गई है, जबकि अगली पंक्ति में मूसा का नाम स्पष्ट है।
