  text: וַ/יִּשְׁחָ֓ט וַ/יִּקַּ֤ח מֹשֶׁה֙ מִ/דָּמ֔/וֹ וַ/יִּתֵּ֛ן עַל תְּנ֥וּךְ אֹֽזֶן אַהֲרֹ֖ן הַ/יְמָנִ֑ית וְ/עַל בֹּ֤הֶן יָד/וֹ֙ הַ/יְמָנִ֔ית וְ/עַל בֹּ֥הֶן רַגְל֖/וֹ הַ/יְמָנִֽית׀־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/023.yaml
  text: And he slaughtered it[a], and Moses took some of its blood and put it on the lobe of Aaron’s right ear, and on the thumb of his right hand, and on the big toe of his right foot.
translation:
  language: hi
  text: और उसने उसका वध किया। मूसा ने उसके लहू में से कुछ लिया और उसे हारून के दाहिने कान की लौ पर, हारून के दाहिने हाथ के अँगूठे पर, और हारून के दाहिने पैर के बड़े अँगूठे पर लगाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּשְׁחָט
  choice: उसने उसे बलि के लिए काटा
  rationale: बलिदान के प्रसंग में यह क्रिया विधिपूर्वक पशु-वध को दर्शाती है; ‘बलि के लिए काटा’ आधुनिक हिन्दी में ‘मार डाला’ से अधिक सटीक और स्वाभाविक है। कर्म ‘उसे’ निकटवर्ती प्रसंग से स्पष्ट है।
- source_word: מִדָּמוֹ
  choice: उसके लहू में से कुछ
  rationale: מִן यहाँ पूरे लहू में से एक अंश लिए जाने का भाव देता है; ‘में से कुछ’ इसे स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: תְּנוּךְ אֹזֶן
  choice: कान की लौ
  rationale: यह पद कान के बाहरी सिरे या लौ को सूचित करता है। मुख्य पाठ में ‘लौ’ सहज है, जबकि ‘सिरा’ को पाद-टिप्पणी में वास्तविक शाब्दिक विकल्प के रूप में रखा गया है।
- source_word: הַיְמָנִית
  choice: दाहिने
  rationale: हिब्रू विशेषण शरीर के दाहिने अंग को निर्दिष्ट करता है; हिन्दी में ‘दाहिने कान/हाथ/पैर’ स्वाभाविक प्रयोग है।
- source_word: בֹּהֶן יָדוֹ
  choice: उसके दाहिने हाथ के अँगूठे
  rationale: हाथ के संदर्भ में בֹּהֶן विशेष रूप से अँगूठे को दर्शाता है।
- source_word: בֹּהֶן רַגְלוֹ
  choice: उसके दाहिने पैर के अँगूठे
  rationale: पैर के संदर्भ में בֹּהֶן बड़े अँगूठे को दर्शाता है; हिन्दी में ‘पैर का अँगूठा’ अपने आप बड़े अँगूठे को सूचित करता है।
- source_word: וַיִּתֵּן עַל
  choice: पर लगाया
  rationale: लहू के अनुष्ठानिक प्रयोग के संदर्भ में ‘पर लगाया’ सरल, वर्तमान हिन्दी में स्वाभाविक और अर्थतः सटीक है।
theological_decisions:
- issue: बलि के लहू को हारून के अंगों पर लगाने का अनुष्ठान
  choice: क्रिया का वर्णन बिना प्रतीकात्मक अर्थ जोड़े किया गया
  alternative: मुख्य पाठ में अभिषेक, समर्पण या आज्ञाकारिता का प्रतीकात्मक अर्थ स्पष्ट करना
  rationale: हिब्रू पद स्वयं केवल अनुष्ठानिक क्रिया का वर्णन करता है; उसके धर्मवैचारिक प्रतीकवाद को अनुवाद में जोड़ना मूल कथन से आगे जाना होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘लहू’ बलिदान-संबंधी बाइबलीय प्रसंग में स्वाभाविक गंभीरता बनाए रखता है; वाक्य-विन्यास हिब्रू की क्रमिक कथा को स्पष्ट हिन्दी में प्रस्तुत करता है।
