  edition: WLC
  text: וַ/יֹּ֥אמֶר מֹשֶׁ֖ה אֶל הָ/עֵדָ֑ה זֶ֣ה הַ/דָּבָ֔ר אֲשֶׁר צִוָּ֥ה יְהוָ֖ה לַ/עֲשֽׂוֹת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/005.yaml
  text: And Moses said to the congregation[a], “This is the thing that Yahweh has commanded to be done.”
translation:
  language: hi
  text: तब मूसा ने मंडली से कहा, “यह वह काम है जिसे करने की आज्ञा याहवे ने दी है[a]।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “यह वह काम है जिसके किए जाने की आज्ञा याहवे ने दी है।”
    reason: इब्रानी क्रियार्थक रूप व्याकरणतः सक्रिय है, पर प्रसंग में इसे अनिर्दिष्ट कर्मवाच्य अर्थ में भी स्वाभाविक रूप से व्यक्त किया जा सकता है।
lexical_decisions:
- source_word: וַיֹּאמֶר
  choice: तब ... ने कहा
  rationale: वाव-क्रमागत रूप कथा को आगे बढ़ाता है; आधुनिक हिन्दी में “तब” इस प्रगति को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस नाम का प्रचलित मानक हिन्दी रूप।
- source_word: הָעֵדָה
  choice: मंडली
  rationale: यह शब्द यहाँ एकत्रित इस्राएली समुदाय को दर्शाता है; “मंडली” सामूहिक और उपासना-संबंधी प्रसंग दोनों के अनुकूल है।
- source_word: זֶה הַדָּבָר
  choice: यह वह काम
  rationale: “काम” आगामी क्रियान्वयन के प्रसंग में דָּבָר के आशय को स्वाभाविक हिन्दी में व्यक्त करता है, जबकि संकेतवाचक संरचना भी बनी रहती है।
- source_word: צִוָּה
  choice: आज्ञा ... दी है
  rationale: पूर्ण क्रिया पहले दी गई उस आज्ञा को सूचित करती है जो वर्तमान कार्यवाही के लिए अब भी प्रासंगिक है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम का हिन्दी लिप्यंतरण, किसी उपाधि से उसका प्रतिस्थापन नहीं।
- source_word: לַעֲשׂוֹת
  choice: करने
  rationale: इब्रानी उद्देश्यवाचक क्रियार्थक रूप सक्रिय है; “जिसे करने की आज्ञा” हिन्दी में स्वाभाविक है और कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे प्रयुक्त है; लिप्यंतरण नाम और उपाधि के भेद को सुरक्षित रखता है।
- issue: לַעֲשׂוֹת में कार्य करने वाले का अनिर्दिष्ट रहना
  choice: जिसे करने की आज्ञा ... दी है
  alternative: जिसके किए जाने की आज्ञा ... दी है
  rationale: सक्रिय क्रियार्थक रूप को बनाए रखते हुए हिन्दी वाक्य कार्य करने वाले को अनिर्दिष्ट छोड़ता है; कर्मवाच्य विकल्प भी प्रसंगगत अर्थ को सम्भव रूप से व्यक्त करता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। “मंडली” धार्मिक-सामुदायिक प्रसंग को व्यक्त करती है, और “याहवे” मूल व्यक्तिगत नाम को सुरक्षित रखता है।
