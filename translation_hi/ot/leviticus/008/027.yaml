source:
  edition: WLC
  text: וַ/יִּתֵּ֣ן אֶת הַ/כֹּ֔ל עַ֚ל כַּפֵּ֣י אַהֲרֹ֔ן וְ/עַ֖ל כַּפֵּ֣י בָנָ֑י/ו וַ/יָּ֧נֶף אֹתָ֛/ם תְּנוּפָ֖ה לִ/פְנֵ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/027.yaml
  text: He put all of it into the palms of Aaron and into the palms of his sons[a], and he waved them as a wave offering before Yahweh.
translation:
  language: hi
  text: उसने वह सब हारून और उसके पुत्रों की हथेलियों पर रखा, और उन्हें याहवे के सामने हिलाने की भेंट के रूप में हिलाया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּתֵּן
  choice: उसने ... रखा
  rationale: נתן का अर्थ यहाँ किसी वस्तु को देना नहीं, बल्कि अनुष्ठान के लिए हथेलियों पर रखना है।
- source_word: אֶת הַכֹּל
  choice: वह सब
  rationale: यह पिछले पद में इकट्ठे किए गए सभी बलिदानी अंशों की ओर संकेत करता है और इब्रानी की समग्रता बनाए रखता है।
- source_word: עַל כַּפֵּי
  choice: की हथेलियों पर
  rationale: עַל का सीधा अर्थ ‘पर’ है और כַּפּוֹת यहाँ खुली या अंजलिबद्ध हथेलियों को दर्शाता है; यह हिंदी में स्वाभाविक भी है।
- source_word: בָנָיו
  choice: उसके पुत्रों
  rationale: इब्रानी में हारून के पुरुष वंशज, अर्थात इस अभिषेक-विधि में भाग लेने वाले उसके पुत्र, स्पष्ट रूप से अभिप्रेत हैं।
- source_word: וַיָּנֶף ... תְּנוּפָה
  choice: हिलाने की भेंट के रूप में हिलाया
  rationale: क्रिया נוף और उसी मूल से बने तकनीकी बलिदानी संज्ञा תְּנוּפָה की पुनरुक्ति को बनाए रखते हुए प्रचलित धार्मिक पद ‘हिलाने की भेंट’ रखा गया है।
- source_word: אֹתָם
  choice: उसे
  rationale: इब्रानी में बहुवचन सर्वनाम उन अनेक बलिदानी अंशों को संदर्भित करता है; हिंदी में ‘वह सब’ को एक समष्टि मानकर एकवचन ‘उसे’ अधिक स्वाभाविक है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: यह अनुष्ठान याहवे की उपस्थिति में किया गया; परमेश्वर के व्यक्तिगत नाम को पारदर्शी रूप से ‘याहवे’ लिखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में आए व्यक्तिगत वाचा-नाम को उपाधि से बदलने के बजाय हिंदी में उसका सीधा लिप्यंतरण दिया गया है।
- issue: תְּנוּפָה का अनुष्ठानिक अर्थ
  choice: हिलाने की भेंट
  alternative: प्रस्तुति-भेंट
  rationale: मूल में हिलाने की क्रिया और उसी से बनी भेंट-संज्ञा साथ आती हैं। चुना गया पद इस दृश्य क्रिया और तकनीकी बलिदानी अर्थ दोनों को सुरक्षित रखता है।
- issue: אֹתָם का वचन और संदर्भ
  choice: उसे
  alternative: उन्हें
  rationale: सर्वनाम उन अंशों को संदर्भित करता है, हारून और उसके पुत्रों को नहीं। हिंदी में पूर्ववर्ती ‘वह सब’ समष्टिवाचक है, इसलिए एकवचन स्वाभाविक है; संदर्भगत अर्थ नहीं बदला गया।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘हथेलियों पर’ मूल के निकट तथा स्वाभाविक हिंदी है। ‘हिलाने की भेंट’ बलिदानी पारिभाषिकता को बनाए रखती है, जबकि वाक्य सामान्य पाठक के लिए समझने योग्य रहता है।
