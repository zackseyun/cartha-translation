  yaml_path: translation/ot/leviticus/008/012.yaml
  text: Then he poured some of the anointing oil on Aaron’s head and anointed him to consecrate him.
translation:
  language: hi
  text: तब उसने अभिषेक के तेल में से कुछ हारून के सिर पर उँडेला और उसे पवित्र ठहराने के लिए उसका अभिषेक किया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיִּצֹק
  choice: उँडेला
  rationale: यह क्रिया किसी द्रव को उँडेलने को दर्शाती है; आधुनिक हिन्दी में यह सहज और सटीक है।
- source_word: מִשֶּׁמֶן הַמִּשְׁחָה
  choice: अभिषेक के तेल में से कुछ
  rationale: מִן का अंशसूचक भाव स्पष्ट करता है कि अभिषेक के तेल का कुछ भाग लिया गया था।
- source_word: עַל רֹאשׁ אַהֲרֹן
  choice: हारून के सिर पर
  rationale: मूल के स्थानसूचक वाक्यांश का सीधा और स्वाभाविक अनुवाद।
- source_word: וַיִּמְשַׁח אֹתוֹ
  choice: उसका अभिषेक करके
  rationale: משׁח के याजकीय अनुष्ठान-संबंधी अर्थ को ‘अभिषेक’ सुरक्षित रखता है; कृदन्त-रचना दोनों निकटवर्ती क्रियाओं का प्रवाह स्वाभाविक बनाती है।
- source_word: לְקַדְּשׁוֹ
  choice: उसे पवित्र सेवा के लिए समर्पित किया
  rationale: याजकीय प्रतिष्ठापन के प्रसंग में קדשׁ का आशय किसी व्यक्ति को पवित्र कार्य के लिए अलग और समर्पित करना है; यह हिन्दी में केवल ‘पवित्र किया’ की संभावित नैतिक अस्पष्टता से बचते हुए अनुष्ठानिक-वोकेशनल अर्थ व्यक्त करता है।
- source_word: וַ
  choice: तब
  rationale: वाव-क्रमागत कथा को आगे बढ़ाता है; ‘तब’ अनुष्ठान की क्रियाओं का क्रम स्वाभाविक ढंग से बताता है।
theological_decisions:
- issue: याजकीय प्रतिष्ठापन के प्रसंग में קדשׁ का अनुवाद
  choice: पवित्र सेवा के लिए समर्पित किया
  alternative: पवित्र किया; प्रतिष्ठित किया
  rationale: यहाँ हारून को याजकीय सेवा के लिए अलग किए जाने का भाव है। चुना हुआ रूप पवित्रता और सेवा हेतु समर्पण—दोनों को व्यक्त करता है, बिना बाद की किसी सम्प्रदायगत धारणा को आरोपित किए।
translation_notes:
  register: आधुनिक मानक हिन्दी; गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज। ‘अभिषेक’ आवश्यक अनुष्ठानिक शब्द के रूप में रखा गया है, जबकि ‘पवित्र सेवा के लिए समर्पित’ קדשׁ का प्रसंगगत अर्थ स्पष्ट करता है।
