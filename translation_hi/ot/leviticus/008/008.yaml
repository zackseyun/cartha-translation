id: LEV.8.8
reference: Leviticus 8:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יָּ֥שֶׂם עָלָ֖י/ו אֶת הַ/חֹ֑שֶׁן וַ/יִּתֵּן֙ אֶל הַ/חֹ֔שֶׁן אֶת הָ/אוּרִ֖ים וְ/אֶת הַ/תֻּמִּֽים־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/008.yaml
  text: And he placed the breastpiece on him[b][a], and he put the Urim and the Thummim into the breastpiece.
translation:
  language: hi
  text: फिर उसने हारून को वक्षपट[a] पहनाया और वक्षपट में ऊरीम और तुम्मीम[b] रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: ‘वक्षपट’ महायाजक की छाती पर पहनी जाने वाली विशेष वस्तु थी; इसे ‘सीनाबन्द’ भी कहा जाता है। यह युद्ध का कवच नहीं था।
    reason: lexical_alternative
  - marker: b
    text: ‘ऊरीम’ और ‘तुम्मीम’ इब्रानी अनुष्ठानिक नाम हैं। उनका ठीक स्वरूप और उनके उपयोग की विधि निश्चित नहीं है।
    reason: cultural_note
lexical_decisions:
- source_word: וַיָּשֶׂם עָלָיו
  choice: उसने हारून को ... पहनाया
  rationale: शाब्दिक अर्थ ‘उस पर रखा’ है, पर याजकीय वस्त्र पहनाने के इस प्रसंग में ‘पहनाया’ स्वाभाविक हिन्दी है। सर्वनाम के संकेत को स्पष्ट करने के लिए ‘हारून’ कहा गया है।
- source_word: הַחֹשֶׁן
  choice: वक्षपट
  rationale: यह महायाजक की छाती पर पहनी जाने वाली विशिष्ट वस्तु है। ‘वक्षपट’ संक्षिप्त और गरिमापूर्ण है तथा कवच होने का भ्रामक संकेत नहीं देता। दोनों occurrences में एक ही शब्द रखा गया है।
- source_word: וַיִּתֵּן אֶל
  choice: में ... रखे
  rationale: נָתַן का स्थानीय अर्थ ‘रखना’ और אֶל का प्रसंगगत अर्थ वस्तु के भीतर रखना है; हिन्दी में ‘में ... रखे’ स्वाभाविक है।
- source_word: הָאוּרִים וְאֶת הַתֻּמִּים
  choice: ऊरीम और तुम्मीम
  rationale: ये अनिश्चित स्वरूप और उपयोग वाले पारिभाषिक अनुष्ठानिक नाम हैं; अर्थानुवाद करने के बजाय हिन्दी लिपि में लिप्यंतरण मूल की विशिष्टता और अस्पष्टता बचाता है।
theological_decisions:
- issue: אוּרִים וְתֻּמִּים का स्वरूप और अर्थ
  choice: ‘ऊरीम और तुम्मीम’ के रूप में लिप्यंतरण
  alternative: ‘ज्योतियाँ और सिद्धताएँ’ अथवा ‘पवित्र चिट्ठियाँ’ जैसे अर्थानुवाद
  rationale: इन वस्तुओं का ठीक स्वरूप और इनके उपयोग की विधि निश्चित नहीं है। लिप्यंतरण किसी विवादित व्याख्या को पाठ में नहीं थोपता।
translation_notes:
  register: आधुनिक मानक हिन्दी का सहज, गरिमापूर्ण कथात्मक रूप। ‘हारून’ से सर्वनाम का संदर्भ स्पष्ट किया गया है। ‘वक्षपट’ को सामान्य पाठक के लिए पाद-टिप्पणी में समझाया गया है; अनिश्चित अनुष्ठानिक पदों का अर्थ थोपने के बजाय लिप्यंतरण किया गया है।
