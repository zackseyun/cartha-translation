  text: וַ/יַּקְרֵ֣ב מֹשֶׁ֔ה אֶֽת אַהֲרֹ֖ן וְ/אֶת בָּנָ֑י/ו וַ/יִּרְחַ֥ץ אֹתָ֖/ם בַּ/מָּֽיִם־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/006.yaml
  text: Then Moses brought Aaron and his sons near and washed them with water.
translation:
  language: hi
  text: तब मूसा हारून और उसके पुत्रों को पास ले आया और उन्हें पानी से धोया।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וַיַּקְרֵב
  choice: पास ले आया
  rationale: हिफ़ील रूप का अर्थ ‘निकट लाना’ है। अभिषेक-संस्कार के प्रसंग में ‘पास ले आया’ वास्तविक निकट आने की क्रिया को स्वाभाविक हिन्दी में बनाए रखता है।
- source_word: מֹשֶׁה
  choice: मूसा
  rationale: इस व्यक्तिगत नाम का प्रचलित मानक हिन्दी रूप।
- source_word: אַהֲרֹן
  choice: हारून
  rationale: इस व्यक्तिगत नाम का प्रचलित मानक हिन्दी रूप।
- source_word: בָּנָיו
  choice: उसके पुत्रों
  rationale: यहाँ בנים हारून के उन पुरुष वंशजों को सूचित करता है जिन्हें याजकीय सेवा के लिए नियुक्त किया जा रहा है; इसलिए ‘पुत्रों’ सटीक है।
- source_word: וַיִּרְחַץ
  choice: धोया
  rationale: רחץ का अर्थ धोना या स्नान कराना हो सकता है। ‘उन्हें पानी से धोया’ स्वाभाविक है और पाठ में दिए गए कर्मकाण्डीय कार्य को बिना अनावश्यक विस्तार के व्यक्त करता है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम हारून और उसके पुत्रों, दोनों को एक साथ संदर्भित करता है।
- source_word: בַּמָּיִם
  choice: पानी से
  rationale: בְּ साधन अथवा माध्यम बता सकता है; आधुनिक हिन्दी में धोने के साधन के लिए ‘पानी से’ सबसे स्वाभाविक है।
- source_word: וַ
  choice: तब
  rationale: वाव-परिणामी कथा को आगे बढ़ाता है; ‘तब’ घटनाक्रम की क्रमिकता को सहज हिन्दी में व्यक्त करता है।
theological_decisions: []
translation_notes:
  register: आधुनिक, सरल और गरिमापूर्ण मानक हिन्दी। ‘पास ले आया’ मूल की ठोस गति को सुरक्षित रखता है, जबकि ‘पानी से धोया’ कर्मकाण्डीय क्रिया को न तो सीमित करता है, न विस्तार देता है।
