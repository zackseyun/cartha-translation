source:
  edition: WLC
  text: וַ/יִּקַּ֤ח מֹשֶׁה֙ אֶת הֶ֣/חָזֶ֔ה וַ/יְנִיפֵ֥/הוּ תְנוּפָ֖ה לִ/פְנֵ֣י יְהוָ֑ה מֵ/אֵ֣יל הַ/מִּלֻּאִ֗ים לְ/מֹשֶׁ֤ה הָיָה֙ לְ/מָנָ֔ה כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/008/029.yaml
  text: Then Moses took the breast and waved it as a wave offering before Yahweh. It was Moses' portion from the ram of ordination[a], just as Yahweh had commanded Moses.
translation:
  language: hi
  text: फिर मूसा ने छाती का भाग लिया और उसे यहोवा के सामने लहराने की भेंट के रूप में लहराया। प्रतिष्ठा-संस्कार के मेढ़े में से यह मूसा का भाग था[a], जैसा यहोवा ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अभिषेक-संस्कार के मेढ़े में से।”
    reason: मִלֻּאִים याजकीय प्रतिष्ठापन/समर्पण की विधि का तकनीकी शब्द है; ‘अभिषेक-संस्कार’ संदर्भानुकूल, किंतु अपेक्षाकृत संकरा वैकल्पिक अनुवाद है।
lexical_decisions:
- source_word: וַיִּקַּח
  choice: फिर मूसा ने ... लिया
  rationale: वय्यिक्तोल कथानक को आगे बढ़ाता है; ‘फिर’ स्वाभाविक क्रम दिखाता है और मूल क्रिया ‘लेना’ को बनाए रखता है।
- source_word: הֶחָזֶה
  choice: छाती का भाग
  rationale: बलिदान-संबंधी संदर्भ में यह पशु की छाती के नियत हिस्से को दर्शाता है; ‘छाती का भाग’ आधुनिक हिन्दी में स्पष्ट है।
- source_word: וַיְנִיפֵהוּ תְנוּפָה
  choice: उसे हिलाई जानेवाली भेंट के रूप में हिलाया
  rationale: सजातीय क्रिया और संज्ञा दोनों को व्यक्त करके इब्रानी की विधिगत क्रिया और बलाघात सुरक्षित रखा गया है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह उपासना-संबंधी प्रस्तुति को परमेश्वर की उपस्थिति में किए जाने का संकेत देता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम יהוה को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं।
- source_word: מֵאֵיל הַמִּלֻּאִים
  choice: अभिषेक-संस्कार के मेढ़े में से
  rationale: מִלֻּאִים यहाँ याजकों की पदस्थापना और समर्पण की विधि है; ‘अभिषेक-संस्कार’ हिन्दी में इस पुरोहितीय संदर्भ को स्वाभाविक रूप से व्यक्त करता है।
- source_word: לְמֹשֶׁה הָיָה לְמָנָה
  choice: यह मूसा का भाग था
  rationale: מָנָה किसी को नियत किए गए हिस्से को दर्शाता है; यह संक्षिप्त और सटीक हिन्दी है।
- source_word: כַּאֲשֶׁר צִוָּה יְהוָה אֶת מֹשֶׁה
  choice: ठीक वैसे ही जैसे यहोवा ने मूसा को आज्ञा दी थी
  rationale: यह पूर्व में दी गई आज्ञा के ठीक अनुरूप कार्य किए जाने का सूत्रबद्ध कथन है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम है। हिन्दी पाठकों के लिए सुस्थापित लिप्यंतरण ‘यहोवा’ नाम को उपाधि में बदले बिना सुरक्षित रखता है।
- issue: पुरोहितीय संदर्भ में מִלֻּאִים
  choice: अभिषेक-संस्कार
  alternative: प्रतिष्ठा-संस्कार
  rationale: शब्द का शाब्दिक संबंध ‘हाथ भरने’ से है, पर लैव्यव्यवस्था 8 में यह याजकीय पदस्थापना/समर्पण की विधि दर्शाता है। मुख्य पाठ में स्वाभाविक पद रखा गया है और वास्तविक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। बलिदान-विधि के तकनीकी भाव को बचाने के लिए ‘हिलाई जानेवाली भेंट’ और क्रिया ‘हिलाया’ दोनों रखे गए हैं।
