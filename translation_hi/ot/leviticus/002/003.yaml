id: LEV.2.3
reference: Leviticus 2:3
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/003.yaml
  text: And what is left of the grain offering shall be for Aaron and for his sons[a], a most holy portion from the food offerings of Yahweh.
translation:
  language: hi
  text: और अन्नबलि में से जो बच जाए, वह हारून और उसके पुत्रों का होगा। वह याहवे को आग में चढ़ाई जानेवाली भेंटों में से परमपवित्र अंश है।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे की भोजन-भेंटों में से।”
    reason: אִשֶּׁה के लिए ‘आग में चढ़ाई जानेवाली भेंट’ और पारिभाषिक ‘भोजन-भेंट’ दोनों अर्थ प्रस्तावित हैं।
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת מִן הַמִּנְחָה
  choice: और अन्नबलि में से जो बच जाए
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत बची हुई सामग्री को दर्शाता है। लैव्यव्यवस्था 2 में מִנְחָה विशेष रूप से अन्न से चढ़ाई जानेवाली बलि है; इसलिए ‘अन्नबलि’ संक्षिप्त और प्रसंगानुकूल है।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों का होगा
  rationale: यहाँ לְ स्वामित्व अथवा नियत किए जाने का भाव देता है। यह रूप याजकों को मिलनेवाले भाग को स्वाभाविक हिन्दी में स्पष्ट करता है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र अंश
  rationale: यह इब्रानी महत्तम श्रेणी की पवित्रता को सूचित करता है। ‘अंश’ जोड़ने से स्पष्ट होता है कि कथन अन्नबलि के बचे हुए भाग के विषय में है, न कि पवित्रस्थान के किसी कक्ष के विषय में।
- source_word: מֵאִשֵּׁי יְהוָה
  choice: याहवे को आग में चढ़ाई जानेवाली भेंटों में से
  rationale: אִשֶּׁה एक पारिभाषिक बलिदानी शब्द है जिसका अग्नि से चढ़ाई गई भेंटों से निकट संबंध है। मुख्य पाठ में अग्नि-संबंधी अर्थ को स्पष्ट रखा गया है; ‘भोजन-भेंट’ की मान्य वैकल्पिक समझ पादटिप्पणी में दी गई है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को उपाधि से बदलने के बजाय आधुनिक हिन्दी लिप्यंतरण में रखा गया है।
theological_decisions:
- issue: קֹדֶשׁ קָדָשִׁים की बलिदानी पवित्रता-श्रेणी
  choice: परमपवित्र अंश
  alternative: पवित्रों में परमपवित्र
  rationale: चुना हुआ रूप उच्चतम पवित्रता-श्रेणी को बनाए रखता है और इसे अनजाने में ‘परमपवित्र स्थान’ नामक कक्ष का संकेत बनने से रोकता है।
- issue: אִשֵּׁי יְהוָה का अर्थ
  choice: याहवे को आग में चढ़ाई जानेवाली भेंटें
  alternative: याहवे की भोजन-भेंटें
  rationale: शब्द अग्नि द्वारा चढ़ाई जानेवाली बलिदानी भेंटों का पारिभाषिक पद है, पर कुछ प्रसंगों में इसे परमेश्वर के लिए प्रस्तुत ‘भोजन’ की श्रेणी के रूप में समझा जाता है। मुख्य पाठ अग्नि-संबंधी रूप रखता है और दूसरी मान्य व्याख्या पादटिप्पणी में सुरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी; सरल किंतु गरिमापूर्ण बलिदानी शब्दावली। वाक्य को दो भागों में बाँटकर याजकीय आवंटन और पवित्रता-श्रेणी दोनों स्पष्ट रखे गए हैं।
