source:
  edition: WLC
  text: וְ/נֶ֗פֶשׁ כִּֽי תַקְרִ֞יב קָרְבַּ֤ן מִנְחָה֙ לַֽ/יהוָ֔ה סֹ֖לֶת יִהְיֶ֣ה קָרְבָּנ֑/וֹ וְ/יָצַ֤ק עָלֶ֨י/הָ֙ שֶׁ֔מֶן וְ/נָתַ֥ן עָלֶ֖י/הָ לְבֹנָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/001.yaml
  text: When a person presents a grain offering to Yahweh[a], his offering shall be of fine flour[b], and he shall pour oil on it and put frankincense on it.
translation:
  language: hi
  text: जब कोई व्यक्ति याहवे[a] के लिए अन्नबलि चढ़ाए, तो उसकी भेंट मैदे[b] की हो। वह उस पर तेल उँडेले और उस पर लोबान रखे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में परमेश्वर का व्यक्तिगत नाम יהוה (YHWH) है; यहाँ उसे ‘याहवे’ लिखा गया है।
    reason: divine_name
  - marker: b
    text: ‘अन्नबलि’ अनाज से बनी भेंट थी; यहाँ वह बारीक पिसे हुए आटे, अर्थात मैदे, की होनी थी।
    reason: cultural_note
lexical_decisions:
- source_word: נֶפֶשׁ
  choice: कोई व्यक्ति
  rationale: विधिक और उपासना-संबंधी गद्य में यह शब्द यहाँ किसी व्यक्तिगत मनुष्य को सूचित करता है; ‘प्राण’ कहना अनावश्यक रूप से आध्यात्मिक अर्थ पैदा करता।
- source_word: תַקְרִיב
  choice: चढ़ाए
  rationale: हिफ़ील रूप किसी भेंट को निकट लाकर प्रस्तुत करने की उपासना-संबंधी क्रिया बताता है; हिन्दी में ‘चढ़ाए’ स्वाभाविक और सटीक है।
- source_word: קָרְבַּן מִנְחָה
  choice: अन्नबलि
  rationale: यहाँ מִנְחָה सामान्य उपहार नहीं, अनाज से बनी विशेष भेंट है; ‘अन्नबलि’ संक्षिप्त और प्रचलित हिन्दी पद है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ का लाभार्थी/दिशात्मक भाव रखा गया है और वाचा के व्यक्तिगत नाम יהוה को ‘यहोवा’ के रूप में लिप्यंतरित किया गया है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह बारीक पिसे हुए उत्तम आटे को दर्शाता है; आधुनिक हिन्दी में ‘मैदा’ इसका सबसे सहज समतुल्य है।
- source_word: וְיָצַק עָלֶיהָ שֶׁמֶן
  choice: वह उस पर तेल उँडेले
  rationale: निर्देशात्मक बल तथा स्त्रीलिंग प्रत्यय का अन्नबलि की ओर संकेत दोनों बनाए रखे गए हैं।
- source_word: וְנָתַן עָלֶיהָ לְבֹנָה
  choice: और लोबान रखे
  rationale: לְבֹנָה सुगंधित राल frankincense है, जिसका मानक हिन्दी नाम ‘लोबान’ है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम सीधे आया है। इसे केवल उपाधि ‘प्रभु’ से बदलने के बजाय हिन्दी में परिचित नामरूप ‘यहोवा’ रखा गया है; उच्चारण की ऐतिहासिक अनिश्चितता पादटिप्पणी में बताई गई है।
- issue: प्रतिनिधिक एकवचन और पुल्लिंग क्रियारूप
  choice: कोई व्यक्ति ... उसकी ... वह
  alternative: जो कोई ... उनकी ... वे
  rationale: इब्रानी में व्यक्ति एकवचन है और आगे 3 पुल्लिंग एकवचन प्रत्यय तथा क्रियाएँ हैं। हिन्दी में इसे प्रतिनिधिक एकवचन के रूप में स्वाभाविक ढंग से रखा गया है, बिना यह दावा किए कि नियम केवल पुरुषों पर लागू है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सहज हिन्दी। विधिक निर्देश के लिए संभावनार्थक/आज्ञार्थक ‘चढ़ाए, उँडेले, रखे’ प्रयोग किए गए हैं। ‘भेंट’ द्वारा קָרְבָּנוֹ की पुनरुक्ति भी सुरक्षित रखी गई है।
