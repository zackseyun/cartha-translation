source:
  edition: WLC
  text: קָרְבַּ֥ן רֵאשִׁ֛ית תַּקְרִ֥יבוּ אֹתָ֖/ם לַ/יהוָ֑ה וְ/אֶל הַ/מִּזְבֵּ֥חַ לֹא יַעֲל֖וּ לְ/רֵ֥יחַ נִיחֹֽחַ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/012.yaml
  text: As an offering of firstfruits you may present them to Yahweh[b][a], but they must not go up on the altar as a pleasing aroma.
translation:
  language: hi
  text: पहली उपज के चढ़ावे के रूप में तुम उन्हें याहवे के लिए प्रस्तुत कर सकते हो[a], लेकिन सुखद सुगंध के लिए वे वेदी पर न चढ़ाए जाएँ[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पहली उपज का चढ़ावा।”
    reason: कָרְבַּן רֵאשִׁית का वैकल्पिक, अधिक संक्षिप्त अनुवाद।
  - marker: b
    text: शाब्दिक रूप से, “वे सुखद सुगंध के लिए वेदी तक न चढ़ें”; यह वेदी पर चढ़ाकर, सामान्यतः जलाकर, अर्पित किए जाने का बलि-संबंधी प्रयोग है।
    reason: עלה के मूल ‘चढ़ने’ के बिंब और उसके संदर्भगत बलि-अर्थ को स्पष्ट करना।
lexical_decisions:
- source_word: קָרְבַּן רֵאשִׁית
  choice: पहली उपज के चढ़ावे
  rationale: यह पदबंध पहली उपज से दिए जाने वाले चढ़ावे को दर्शाता है। यह अनुवाद इब्रानी संबंध को बनाए रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: תַּקְרִיבוּ
  choice: तुम ... चढ़ा सकते हो
  rationale: हिफ़ील रूप बलि-संबंधी संदर्भ में किसी वस्तु को अर्पण के लिए प्रस्तुत करने का अर्थ देता है। पिछले पद के निषेध के विपरीत यहाँ प्रसंगानुसार अनुमति का भाव है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: पुल्लिंग बहुवचन सर्वनाम पिछले पद में उल्लिखित खमीर और मधु वाली वस्तुओं की ओर संकेत करता है।
- source_word: לַיהוָה
  choice: यहोवा के सामने
  rationale: ל समर्पण अथवा प्रस्तुति का संबंध बताता है। हिन्दी में 'यहोवा के सामने चढ़ाना' धार्मिक प्रस्तुति का स्वाभाविक भाव देता है।
- source_word: וְאֶל הַמִּזְבֵּחַ לֹא יַעֲלוּ
  choice: लेकिन ... वेदी पर न चढ़ाए जाएँ
  rationale: עלה का मूल बिंब 'ऊपर चढ़ना' है; बलि-संदर्भ में यह वेदी पर चढ़ाए जाने को दर्शाता है। कर्मवाच्य हिन्दी मूल के बहुवचन कर्ता और धार्मिक क्रिया दोनों को स्पष्ट रखती है।
- source_word: לְרֵיחַ נִיחֹחַ
  choice: सुखदायक सुगंध के लिए
  rationale: यह स्थापित बलि-संबंधी पदबंध है। अनुवाद सुगंध के रूपक को बनाए रखता है और उसे केवल 'स्वीकार्य' कहकर व्याख्यायित नहीं करता।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में वाचा का व्यक्तिगत नाम יהוה है। हिन्दी पाठकों में प्रचलित प्रत्यक्ष नाम 'यहोवा' उसे उपाधि 'प्रभु' से अलग रखता है; 'याहवे' संभावित उच्चारण-आधारित विकल्प है।
- issue: पहली उपज के चढ़ावे को वेदी पर न चढ़ाने का भाव
  choice: प्रस्तुत करने की अनुमति, पर सुखदायक सुगंध के लिए वेदी पर चढ़ाने का निषेध
  alternative: सामान्य रूप से अर्पण करने का पूर्ण निषेध
  rationale: 'दोनों उपवाक्यों का तनाव सुरक्षित रखा गया है: ऐसी वस्तुएँ पहली उपज के चढ़ावे के रूप में प्रस्तुत की जा सकती हैं, किंतु वेदी पर सुगंधयुक्त अग्नि-भेंट के रूप में नहीं।'
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य हिन्दी। ‘चढ़ावा/चढ़ाना’ की पुनरावृत्ति जानबूझकर रखी गई है, क्योंकि यह प्रस्तुति और वेदी पर अर्पण के बीच मूल पाठ के संबंध तथा अंतर को सहज रूप से दिखाती है।
