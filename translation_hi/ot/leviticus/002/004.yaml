  naturalness: The Hindi is generally clear, but “अन्नबलि के रूप में तंदूर में पकी हुई भेंट” is syntactically cumbersome and redundantly expresses the offering category. “तेल चुपड़ी हुई” is less idiomatic than “तेल से चुपड़ी हुई.”
  terminology: “अन्नबलि” is an appropriate consistent rendering of מִנְחָה in this cultic setting. “बारीक आटा” better represents סֹלֶת without narrowing it to commercial refined flour; “पतली अख़मीरी रोटियाँ” avoids the misleading cultural specificity of “पापड़ियाँ.”
