  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִ֥י תַקְרִ֛ב קָרְבַּ֥ן מִנְחָ֖ה מַאֲפֵ֣ה תַנּ֑וּר סֹ֣לֶת חַלּ֤וֹת מַצֹּת֙ בְּלוּלֹ֣ת בַּ/שֶּׁ֔מֶן וּ/רְקִיקֵ֥י מַצּ֖וֹת מְשֻׁחִ֥ים בַּ/שָּֽׁמֶן׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/004.yaml
  text: 'And if you bring near an offering of a grain offering baked in an oven[a], it shall be of fine flour: unleavened cakes mixed with oil, or unleavened wafers anointed with oil.'
translation:
  language: hi
  text: 'और यदि तुम भट्ठी में पकी हुई अन्नबलि चढ़ाओ, तो वह बारीक आटे की हो: तेल से गूँधी हुई अख़मीरी रोटियाँ, या[a] तेल से चुपड़ी हुई पतली अख़मीरी रोटियाँ।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “और तेल से चुपड़ी हुई पतली अख़मीरी रोटियाँ।” इब्रानी में संयोजक शब्द “और” है, पर यहाँ संभवतः भट्ठी में पकी अन्नबलि का दूसरा वैकल्पिक रूप बताया गया है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִי
  choice: और यदि
  rationale: विधिक निर्देशों की अगली सशर्त स्थिति को जोड़ते हुए वाव और כִּי दोनों की भूमिका व्यक्त करता है।
- source_word: תַקְרִב קָרְבַּן מִנְחָה
  choice: अन्नबलि के रूप में ... भेंट चढ़ाओ
  rationale: קרב के हिफ़ील रूप में प्रस्तुति का भाव और קָרְבָּן की भेंट-संज्ञा रखते हुए हिन्दी की स्वाभाविक बलिदानी अभिव्यक्ति अपनाई गई है; מִנְחָה को इस प्रसंग में विशिष्ट अन्नबलि माना गया है।
- source_word: מַאֲפֵה תַנּוּר
  choice: तंदूर में पकी हुई
  rationale: तंदूर प्राचीन मिट्टी के oven के निकट और आधुनिक हिन्दी में सहज शब्द है।
- source_word: סֹלֶת
  choice: मैदा
  rationale: अर्पण में प्रयुक्त बारीक, उत्तम आटे का संक्षिप्त और सामान्य हिन्दी समतुल्य।
- source_word: חַלּוֹת מַצּוֹת
  choice: अख़मीरी रोटियाँ
  rationale: खमीर रहित रोटी-सदृश तैयार वस्तुओं को सामान्य पाठक के लिए स्वाभाविक ढंग से व्यक्त करता है।
- source_word: בְּלוּלֹת בַּשֶּׁמֶן
  choice: तेल में गूँधी हुई
  rationale: בלל यहाँ तेल को आटे अथवा लोई में मिलाने का संकेत देता है; 'गूँधी हुई' खाद्य-तैयारी के प्रसंग में सटीक और सहज है।
- source_word: וּרְקִיקֵי מַצּוֹת
  choice: या ... अख़मीरी पापड़ियाँ
  rationale: רְקִיקִים पतली रोटी/वेफ़र जैसी वस्तुएँ हैं। हिन्दी में 'पापड़ियाँ' पतलेपन को स्पष्ट करती है; वाव को सूची के वैकल्पिक रूप के रूप में मुख्य पाठ में 'या' किया गया है और पादटिप्पणी में शाब्दिक विकल्प सुरक्षित है।
- source_word: מְשֻׁחִים בַּשָּׁמֶן
  choice: तेल चुपड़ी हुई
  rationale: משׁח का मूल भाव सतह पर तेल लगाने का है; खाद्य प्रसंग में 'चुपड़ी हुई' धार्मिक अभिषेक का अनावश्यक अर्थ आरोपित किए बिना ठोस क्रिया बताता है।
theological_decisions:
- issue: लैव्यव्यवस्था के बलिदानी प्रसंग में מִנְחָה
  choice: अन्नबलि
  alternative: भेंट / उपहार-भेंट
  rationale: यहाँ अध्याय आटे और तेल से बनी एक विशिष्ट बलिदानी श्रेणी का वर्णन करता है; 'अन्नबलि' उस अनुष्ठानिक विशिष्टता को स्पष्ट रखता है।
- issue: וּרְקִיקֵי में संयोजक वाव का संबंध
  choice: या
  alternative: और
  rationale: दो प्रकार—तेल में गूँधी रोटियाँ और तेल चुपड़ी पापड़ियाँ—संभवतः वैकल्पिक रूप हैं। फिर भी इब्रानी का शाब्दिक संयोजक 'और' है, इसलिए वास्तविक अस्पष्टता पादटिप्पणी में रखी गई है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए स्पष्ट रखी गई है। 'तंदूर', 'मैदा', 'गूँधी' और 'चुपड़ी' ठोस पाक-प्रक्रिया बताते हैं। 'अख़मीरी' बाइबलीय संदर्भ में प्रचलित होते हुए भी समझने योग्य है। मुख्य पाठ में वैकल्पिक संबंध स्वाभाविक किया गया है, जबकि इब्रानी की संयोजकीय अस्पष्टता पादटिप्पणी में सुरक्षित है।
