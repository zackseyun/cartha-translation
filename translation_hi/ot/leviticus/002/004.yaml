  - severity: medium
    issue: “तंदूर” over-specifies the Hebrew oven
    rationale: תַּנּוּר denotes an oven generally. “तंदूर” names a particular oven type in modern Hindi.
  - severity: medium
    issue: “पापड़ियाँ” is not a suitable rendering of wafers
    rationale: It naturally suggests papad, a culturally distinct crisp food. The Hebrew denotes thin unleavened cakes/wafers.
  - severity: low
