source:
  edition: WLC
  text: וֶֽ/הֱבִיאָ֗/הּ אֶל בְּנֵ֣י אַהֲרֹן֮ הַ/כֹּהֲנִים֒ וְ/קָמַ֨ץ מִ/שָּׁ֜ם מְלֹ֣א קֻמְצ֗/וֹ מִ/סָּלְתָּ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ/הּ֙ הַ/מִּזְבֵּ֔חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/002.yaml
  text: He shall bring it to Aaron’s sons[a], the priests, and he shall take from there a handful of its fine flour and some of its oil, with all of its frankincense. Then the priest shall burn its memorial portion on the altar, a food offering, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: वह उसे हारून के पुत्रों, अर्थात याजकों, के पास लाए। याजक वहाँ से उसके मैदे में से अपनी मुट्ठी भर और उसके तेल में से कुछ, उसके सारे लोबान समेत, ले। फिर याजक उसके स्मरण-भाग को वेदी पर जलाए—याहवे के लिए अग्नि-भेंट, सुखद सुगंध।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וֶהֱבִיאָהּ
  choice: वह उसे ... लाए
  rationale: हिफ़ील क्रिया और स्त्रीलिंग कर्म-प्रत्यय को विधिक निर्देश की स्वाभाविक हिन्दी में व्यक्त करता है; ‘उसे’ अन्न-भेंट की ओर संकेत करता है।
- source_word: בְּנֵי אַהֲרֹן הַכֹּהֲנִים
  choice: हारून के पुत्रों, अर्थात याजकों
  rationale: पारिवारिक पहचान और समानाधिकरण में दी गई याजकीय भूमिका दोनों स्पष्ट रखी गई हैं।
- source_word: וְקָמַץ ... מְלֹא קֻמְצוֹ
  choice: अपनी मुट्ठी भर ले
  rationale: क्रिया में हाथ से मुट्ठी भर लेने का भाव और पदबंध में पूरी मुट्ठी की मात्रा है; यह हिन्दी में संक्षिप्त और स्वाभाविक है।
- source_word: מִשָּׁם
  choice: वहाँ से
  rationale: मूल के स्थानवाचक संकेत को ‘उसमें से’ बनाकर अस्पष्ट नहीं किया गया।
- source_word: מִסָּלְתָּהּ
  choice: उसके मैदे में से
  rationale: סֹלֶת भेंट में प्रयुक्त महीन/उत्तम मैदा है; आधुनिक हिन्दी में ‘मैदा’ स्वयं महीन आटे को स्पष्ट करता है।
- source_word: וּמִשַּׁמְנָהּ
  choice: और तेल में से
  rationale: מִן अंश लिए जाने का संकेत देता है; इसे मैदे के साथ समान रचना में रखा गया है और तेल की पूरी मात्रा लेने का अर्थ नहीं निकाला गया।
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: और उसका सारा लोबान भी
  rationale: मैदे और तेल के अंश के विपरीत लोबान की पूरी मात्रा सम्मिलित होने को ‘सारा’ स्पष्ट करता है।
- source_word: אַזְכָּרָתָהּ
  choice: उसके स्मरण-भाग
  rationale: यह वेदी पर जलाए जाने वाले प्रतिनिधि भाग का याजकीय तकनीकी शब्द है; ‘स्मरण-भाग’ उसके स्मरणार्थक भाव और अंश दोनों को बचाता है।
- source_word: וְהִקְטִיר ... הַמִּזְבֵּחָה
  choice: वेदी पर जलाए
  rationale: बलिदानी प्रसंग में קטר का अर्थ वेदी पर धुएँ में चढ़ाना/जलाना है; सरल हिन्दी में ‘जलाए’ और स्थानसूचक ‘वेदी पर’ पर्याप्त हैं।
- source_word: אִשֵּׁה
  choice: अग्नि-भेंट
  rationale: इस विवादित याजकीय पद का अग्नि से संबंध स्पष्ट रखा गया है; भोजन-संबंधी व्युत्पत्ति/अर्थ को मुख्य पाठ में निश्चित नहीं किया गया।
- source_word: רֵיחַ נִיחֹחַ
  choice: जिसकी सुगंध सुखदायक है
  rationale: मूल बलिदानी मुहावरे में स्वीकार्य और प्रसन्न करने वाली सुगंध का भाव है; यह हिन्दी में गरिमापूर्ण रहते हुए अनावश्यक रूप से यह नहीं जोड़ता कि सुगंध किसे सुख देती है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का रूप
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल में वाचा का विशिष्ट नाम יהוה है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे उपाधि ‘प्रभु’ से नहीं बदलता।
- issue: אִשֵּׁה का अर्थ
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट; आग में चढ़ाई गई भेंट
  rationale: शब्द की व्युत्पत्ति और सटीक अर्थ पर मतभेद है। प्रसंग में भेंट का वेदी पर जलाया जाना स्पष्ट है, इसलिए ‘अग्नि-भेंट’ सुरक्षित है; भोजन-संबंधी विकल्प पादटिप्पणी में रखा गया है।
- issue: רֵיחַ נִיחֹחַ में ईश्वर को स्पष्ट कर्म बनाना
  choice: जिसकी सुगंध सुखदायक है
  alternative: जिसकी सुगंध याहवे को प्रसन्न करती है
  rationale: इब्रानी में ‘याहवे के लिए’ पूरे अग्नि-भेंट पदबंध से जुड़ा है और सुखदायक सुगंध का मुहावरा ईश्वरीय स्वीकृति सूचित करता है, पर ‘उसे प्रसन्न करती है’ जैसा स्पष्ट कर्म मूल में अलग से नहीं है।
translation_notes:
  register: आधुनिक मानक हिन्दी का निर्देशात्मक, गरिमापूर्ण गद्य रखा गया है। ‘अर्थात याजकों’ समानाधिकरण को स्पष्ट करता है। पहले वाक्य के बाद ‘उनमें से एक याजक’ मूल में निहित बदलते कर्ता को हिन्दी में स्पष्ट करता है, जबकि अगले वाक्य का ‘याजक’ इब्रानी में व्यक्त संज्ञा के अनुरूप है।
