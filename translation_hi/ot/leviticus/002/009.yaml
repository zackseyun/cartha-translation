id: LEV.2.9
reference: Leviticus 2:9
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הֵרִ֨ים הַ/כֹּהֵ֤ן מִן הַ/מִּנְחָה֙ אֶת אַזְכָּ֣רָתָ֔/הּ וְ/הִקְטִ֖יר הַ/מִּזְבֵּ֑חָ/ה אִשֵּׁ֛ה רֵ֥יחַ נִיחֹ֖חַ לַ/יהוָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/009.yaml
  text: Then the priest shall lift up from the grain offering its memorial portion and burn it on the altar[a], a food offering, a pleasing aroma to Yahweh.
translation:
  language: hi
  text: तब याजक अन्नबलि में से उसका स्मरण-भाग उठाए और उसे वेदी पर जलाए। यह यहोवा के लिए अग्नि से चढ़ाई गई भेंट, मनभावनी सुगंध है।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵרִים
  choice: उठाकर
  rationale: हिफ़ील रूप यहाँ भेंट में से एक भाग उठाने अथवा अलग करने की ठोस अनुष्ठानिक क्रिया बताता है; ‘उठाकर’ उस क्रिया को स्वाभाविक हिंदी में बनाए रखता है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था के उपासना-संबंधी संदर्भ में כֹּהֵן का मानक और सुबोध हिंदी पर्याय।
- source_word: מִן הַמִּנְחָה
  choice: अन्नबलि में से
  rationale: लैव्यव्यवस्था 2 में מִנְחָה अनाज से तैयार की गई भेंट को दर्शाता है; ‘अन्नबलि’ प्रचलित, संक्षिप्त और संदर्भानुकूल है।
- source_word: אֶת אַזְכָּרָתָהּ
  choice: उसका स्मरण-भाग
  rationale: यह पूरी भेंट नहीं, बल्कि वेदी पर जलाया जाने वाला प्रतिनिधि भाग है; ‘स्मरण-भाग’ मूल शब्द की स्मरणार्थकता और अंश होने का भाव दोनों रखता है।
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: קטר का हिफ़ील बलि को वेदी पर जलाकर धुआँ उठाने को दर्शाता है; हिंदी में ‘जलाए’ सहज और अनुष्ठानिक संदर्भ में पर्याप्त स्पष्ट है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक रूप इस मुहावरे में वेदी पर की जाने वाली क्रिया को व्यक्त करता है।
- source_word: אִשֵּׁה
  choice: अग्नि में चढ़ाई गई भेंट
  rationale: यह दुर्लभ पुरोहितीय पद अग्नि के द्वारा चढ़ाई गई भेंट को दर्शाता है। ‘अग्नि में चढ़ाई गई भेंट’ स्रोत के अग्नि-संबंध को बनाए रखता है और ‘भोजन-भेंट’ जैसी विवादित व्युत्पत्तिगत व्याख्या को मुख्य पाठ में नहीं थोपता।
- source_word: רֵיחַ נִיחֹחַ
  choice: एक मनभावनी सुगंध
  rationale: स्थिर बलिदानी पद सुगंध की बिंबात्मक भाषा के द्वारा ईश्वरीय प्रसन्नता अथवा स्वीकृति व्यक्त करता है; ‘मनभावनी सुगंध’ स्वाभाविक और गरिमापूर्ण है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: व्यक्तिगत ईश्वरीय नाम יהוה को ‘यहोवा’ के रूप में व्यक्त करना मूल पाठ में नाम की उपस्थिति को स्पष्ट रखता है; לְ यहाँ प्राप्तकर्ता अथवा जिसके लिए भेंट है, उसे दर्शाता है।
theological_decisions:
- issue: אִשֵּׁה רֵיחַ נִיחֹחַ का बलिदानी सूत्र
  choice: अग्नि में चढ़ाई गई भेंट, एक मनभावनी सुगंध
  alternative: भोजन-भेंट, यहोवा को प्रिय सुगंध
  rationale: मुख्य पाठ अग्नि-संबंधी पारंपरिक अर्थ और सुगंध की मानवरूपी छवि को बनाए रखता है, पर यह नहीं समझाता कि परमेश्वर को भौतिक भोजन की आवश्यकता है। इस प्रकार स्वीकृति का भाव सुरक्षित रहता है और बाद की धर्मवैज्ञानिक व्याख्या आरोपित नहीं होती।
- issue: יהוה का रूपांतरण
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल में प्रयुक्त व्यक्तिगत नाम को हिंदी पाठ में नाम के रूप में दिखाया गया है। ‘प्रभु’ श्रद्धापूर्ण परंपरागत विकल्प है, पर वह नाम और उपाधि के भेद को कम स्पष्ट करता है।
translation_notes:
  register: आधुनिक मानक हिंदी; वाक्य गरिमापूर्ण किंतु सामान्य पाठक के लिए सहज रखा गया है। ‘अन्नबलि’, ‘याजक’ और ‘वेदी’ स्थापित बाइबिलीय शब्द हैं। हिब्रू वाक्य की बलिदानी सूत्रात्मकता को डैश और समानाधिकरण के द्वारा स्पष्ट किया गया है।
