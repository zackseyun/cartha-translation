id: LEV.2.10
reference: Leviticus 2:10
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הַ/נּוֹתֶ֨רֶת֙ מִן הַ/מִּנְחָ֔ה לְ/אַהֲרֹ֖ן וּ/לְ/בָנָ֑י/ו קֹ֥דֶשׁ קָֽדָשִׁ֖ים מֵ/אִשֵּׁ֥י יְהוָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/010.yaml
  text: And what remains of the grain offering shall be for Aaron and for his sons[a], most holy from the food offerings of Yahweh.
translation:
  language: hi
  text: और अनाज की भेंट में से जो बच जाए, वह हारून और उसके पुत्रों के लिए होगा। यह याहवे को आग में चढ़ाए गए अर्पणों[a] में से परमपवित्र अंश है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “याहवे के भोज्य-अर्पणों में से।”
    reason: אִשֶּׁה के लिए ‘आग में चढ़ाया गया अर्पण’ और याजकीय ‘भोज्य-अर्पण’—दोनों अर्थगत संभावनाएँ मिलती हैं।
lexical_decisions:
- source_word: וְהַנּוֹתֶרֶת
  choice: और ... जो बच जाए
  rationale: संज्ञा के रूप में प्रयुक्त कृदंत बचा हुआ भाग बताता है; यह हिंदी में स्वाभाविक और अर्थनिष्ठ अभिव्यक्ति है।
- source_word: מִן הַמִּנְחָה
  choice: अनाज की भेंट में से
  rationale: लैव्यव्यवस्था 2 में מִנְחָה विशेष रूप से अनाज से चढ़ाई जानेवाली भेंट है; ‘में से’ स्रोत के מִן को स्पष्ट रखता है।
- source_word: לְאַהֲרֹן וּלְבָנָיו
  choice: हारून और उसके पुत्रों के लिए होगा
  rationale: לְ यहाँ आवंटन या अधिकार प्रकट करता है; हिंदी में भविष्यसूचक विधान के रूप में ‘के लिए होगा’ स्वाभाविक है।
- source_word: קֹדֶשׁ קָדָשִׁים
  choice: परमपवित्र अंश
  rationale: यह इब्रानी अतिशयोक्तिपरक पद सर्वोच्च स्तर की पवित्रता बताता है। ‘अंश’ संदर्भ में बची हुई भेंट की ओर संकेत करता है और हिंदी वाक्य को स्पष्ट बनाता है।
- source_word: מֵאִשֵּׁי
  choice: आग में चढ़ाए गए अर्पणों में से
  rationale: אִשֶּׁה वे अर्पण दर्शाता है जो वेदी की आग के द्वारा परमेश्वर को प्रस्तुत किए जाते हैं। यह अनुवाद अग्नि-संबंध बनाए रखते हुए सामान्य पाठक के लिए स्पष्ट है।
- source_word: יְהוָה
  choice: याहवे
  rationale: चार अक्षरों वाले परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय हिंदी में लिप्यंतरित किया गया है।
theological_decisions:
- issue: אִשֵּׁי יְהוָה का अनुवाद
  choice: याहवे को आग में चढ़ाए गए अर्पणों में से
  alternative: याहवे के भोज्य-अर्पणों में से
  rationale: मुख्य पाठ अग्नि से संबंधित पारंपरिक और शब्द-सापेक्ष अर्थ को स्पष्ट करता है, जबकि पादटिप्पणी याजकीय संदर्भ में संभव ‘भोज्य-अर्पण’ अर्थ को सुरक्षित रखती है।
- issue: קֹדֶשׁ קָדָשִׁים की संरचना
  choice: परमपवित्र अंश
  alternative: परमपवित्र
  rationale: ‘अंश’ संदर्भगत रूप से निहित है और बची हुई भेंट को विशेषित करता है; इससे किसी अलग ‘परमपवित्र स्थान’ का भ्रम नहीं होता।
translation_notes:
  register: आधुनिक मानक हिंदी में सरल, गरिमापूर्ण और विधिक-धार्मिक लहजा रखा गया है। लंबे इब्रानी वाक्य को स्पष्टता के लिए दो हिंदी वाक्यों में बाँटा गया है।
