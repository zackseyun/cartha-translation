  text: And you shall put oil on it[a], and place frankincense on it; it is a grain offering.
translation:
  language: hi
  text: और उस पर तेल डालना[a] और उस पर लोबान रखना; यह अन्नबलि है।
  philosophy: optimal-equivalence
