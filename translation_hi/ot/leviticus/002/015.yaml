    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַתָּ
  choice: और ... डालना
  rationale: נתן का अर्थ व्यापक रूप से ‘देना, रखना, लगाना’ है। तेल के संदर्भ में स्वाभाविक आधुनिक हिन्दी ‘डालना’ है; विधिक निर्देश की शैली बनाए रखने के लिए आस-पास के पदों के अनुरूप क्रियार्थक रूप रखा गया है।
- source_word: עָלֶיהָ
  choice: उस पर
  rationale: על के साथ स्त्रीलिंग एकवचन प्रत्यय उस अन्नबलि की ओर संकेत करता है जिस पर सामग्री रखी जाती है।
- source_word: שֶׁמֶן
  choice: तेल
  rationale: इब्रानी में सामान्य शब्द ‘तेल’ है। बलिदान-संदर्भ में जैतून का तेल अभिप्रेत हो सकता है, पर मूल पाठ ‘जैतून’ स्पष्ट नहीं करता।
- source_word: וְשַׂמְתָּ
  choice: और ... रखना
  rationale: שׂים का सामान्य अर्थ ‘रखना/स्थापित करना’ है। ‘रखना’ लोबान को चढ़ावे पर रखे जाने की क्रिया को सहज और सटीक रूप से व्यक्त करता है।
- source_word: לְבֹנָה
  choice: लोबान
  rationale: לבנה किसी सामान्य धूप के बजाय विशेष रूप से frankincense को दर्शाता है; हिन्दी में इसका प्रचलित सटीक नाम ‘लोबान’ है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था के अनुष्ठानिक संदर्भ में מנחה सामान्य भेंट नहीं, अनाज से तैयार की जाने वाली भेंट है। ‘अन्नबलि’ संक्षिप्त और स्थापित हिन्दी पद है।
- source_word: הִוא
  choice: यह ... है
  rationale: स्त्रीलिंग सर्वनाम अभी वर्णित भेंट की पहचान कराता है। हिन्दी में ‘यह अन्नबलि है’ सरल और स्वाभाविक है।
