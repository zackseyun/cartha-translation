source:
  edition: WLC
  text: כָּל הַ/מִּנְחָ֗ה אֲשֶׁ֤ר תַּקְרִ֨יבוּ֙ לַ/יהוָ֔ה לֹ֥א תֵעָשֶׂ֖ה חָמֵ֑ץ כִּ֤י כָל שְׂאֹר֙ וְ/כָל דְּבַ֔שׁ לֹֽא תַקְטִ֧ירוּ מִמֶּ֛/נּוּ אִשֶּׁ֖ה לַֽ/יהוָֽה־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/011.yaml
  text: Every grain offering that you present to Yahweh shall not be made with leaven[b][a], for you shall not burn any leaven or any honey from it as a food offering to Yahweh.
translation:
  language: hi
  text: अनाज की कोई भी भेंट, जिसे तुम याहवे के लिए चढ़ाओ, खमीर डालकर न बनाई जाए; क्योंकि तुम कोई भी खमीर या मधु[a] याहवे के लिए अग्नि-भेंट[b] के रूप में न जलाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: प्राचीन प्रयोग में “मधु” केवल मधुमक्खियों का शहद ही नहीं, बल्कि फलों का गाढ़ा मीठा रस भी हो सकता था।
    reason: cultural_note
  - marker: b
    text: अर्थात वेदी पर आग में जलाकर चढ़ाई जानेवाली भेंट।
    reason: lexical_alternative
lexical_decisions:
- source_word: הַמִּנְחָה
  choice: अनाज की भेंट
  rationale: लैव्यव्यवस्था 2 में यह शब्द विशेष रूप से आटे या अनाज से तैयार की जानेवाली भेंट को सूचित करता है, इसलिए सामान्य ‘भेंट’ की अपेक्षा ‘अनाज की भेंट’ अधिक स्पष्ट है।
- source_word: תַּקְרִיבוּ
  choice: जिसे तुम ... सामने चढ़ाओ
  rationale: हिफ़ील रूप बलिदानी संदर्भ में किसी भेंट को परमेश्वर के निकट लाकर प्रस्तुत करने का अर्थ देता है; यह हिन्दी प्रयोग उस दिशा और अर्पण, दोनों को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: לַיהוָה
  choice: याहवे के सामने / याहवे के लिए
  rationale: पहले प्रयोग में उपसर्ग भेंट प्रस्तुत करने की दिशा और दूसरे में उसके समर्पण को दर्शाता है; परमेश्वर का व्यक्तिवाचक वाचा-नाम ‘याहवे’ रखा गया है।
- source_word: תֵעָשֶׂה חָמֵץ
  choice: खमीर डालकर न बनाई जाए
  rationale: यह निषेध भेंट को खमीरयुक्त रूप में तैयार करने से रोकता है। यह हिन्दी में स्पष्ट है और आधुनिक व्यावसायिक यीस्ट तक अर्थ को सीमित नहीं करता।
- source_word: שְׂאֹר
  choice: खमीर
  rationale: यह खमीरीकरण करनेवाले पदार्थ को सूचित करता है; ‘खमीर’ आधुनिक हिन्दी में इसका व्यापक और सहज समतुल्य है।
- source_word: דְּבַשׁ
  choice: मधु
  rationale: मूल शब्द का सामान्य अर्थ शहद है, पर प्राचीन प्रयोग में फलों का गाढ़ा मीठा रस भी सम्मिलित हो सकता है। ‘मधु’ गरिमापूर्ण और पर्याप्त व्यापक है; सांस्कृतिक विस्तार पादटिप्पणी में दिया गया है।
- source_word: לֹא תַקְטִירוּ
  choice: न जलाना
  rationale: बलिदानी संदर्भ में क्रिया वेदी पर किसी वस्तु को जलाकर उसका धुआँ ऊपर उठाने को बताती है। ‘न जलाना’ क्रिया को सीधे और स्वाभाविक रूप में रखता है।
- source_word: מִמֶּנּוּ
  choice: में से कुछ भी
  rationale: एकवचन सर्वनाम का सटीक पूर्वपद कुछ हद तक अस्पष्ट है। यह रचना बिना किसी खमीर या मधु के अंश को जलाने के व्यापक निषेध को व्यक्त करती है और कृत्रिम रूप से केवल पूरी अनाज-भेंट को उसका पूर्वपद नहीं बनाती।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह वेदी पर जलाकर चढ़ाई जानेवाली भेंट के लिए तकनीकी बलिदानी पद है। ‘अग्नि-भेंट’ हिन्दी में संक्षिप्त और पारदर्शी है; पादटिप्पणी इसकी क्रिया स्पष्ट करती है।
theological_decisions:
- issue: परमेश्वर के नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में वाचा का व्यक्तिवाचक नाम सीधे प्रयुक्त हुआ है। उसका लिप्यंतरण नाम को सामान्य उपाधि में बदलने से बचाता है।
- issue: אִשֶּׁה की बलिदानी संज्ञा
  choice: अग्नि-भेंट
  alternative: भोजन-भेंट / आग में चढ़ाई जानेवाली भेंट
  rationale: यह चयन मूल की वेदी पर जलाने की धारणा को स्पष्ट रखता है। ‘भोजन-भेंट’ संभव है, किंतु हिन्दी में वह भ्रामक रूप से सामान्य भोजन की भेंट समझी जा सकती है।
- issue: מִמֶּנּוּ का संदर्भ
  choice: किसी भी खमीर या मधु में से कुछ भी
  alternative: उस भेंट में से कुछ भी
  rationale: सर्वनाम एकवचन है, पर उसके संदर्भ को पूरी तरह स्पष्ट करना कठिन है। मुख्य पाठ निषेध का स्वाभाविक व्यापक अर्थ देता है और संदर्भ को अनावश्यक रूप से केवल अनाज-भेंट तक सीमित नहीं करता।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में सरल, निर्देशात्मक और गरिमापूर्ण रखी गई है। ‘न बनाई जाए’ विधिक निषेध को और ‘न जलाना’ समुदाय को दिए गए प्रत्यक्ष बहुवचन आदेश को स्वाभाविक हिन्दी में व्यक्त करता है।
