lexical_decisions:
- source_word: פָּת֤וֹת אֹתָ/הּ֙ פִּתִּ֔ים
  choice: उसे टुकड़े-टुकड़े कर देना
  rationale: क्रिया और उससे संबंधित बहुवचन संज्ञा मिलकर बलि को छोटे टुकड़ों में तोड़ने का निर्देश देती हैं। यह हिंदी में स्वाभाविक ढंग से परिणाम और क्रिया दोनों व्यक्त करता है।
- source_word: וְ/יָצַקְתָּ֥
  choice: और ... उँडेलना
  rationale: निर्देशात्मक क्रम में प्रयुक्त रूप को हिंदी के विधिसूचक क्रियारूप से व्यक्त किया गया है; इससे प्रक्रिया का क्रम बना रहता है।
- source_word: עָלֶ֖י/הָ
  choice: उस पर
  rationale: स्त्रीलिंग प्रत्यय पहले उल्लिखित अर्पित वस्तु की ओर संकेत करता है; हिंदी में निर्जीव वस्तु के लिए स्वाभाविक रूप 'उस पर' है।
- source_word: שָׁ֑מֶן
  choice: तेल
  rationale: मूल पाठ केवल 'तेल' कहता है; 'जैतून का तेल' जोड़ना पाठ से अधिक विशिष्ट होगा।
- source_word: מִנְחָ֖ה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था 2 के अनुष्ठानिक संदर्भ में यह अनाज से चढ़ाई जाने वाली भेंट का पारिभाषिक नाम है। 'अन्नबलि' संक्षिप्त, प्रचलित और संदर्भानुकूल है।
- source_word: הִֽוא
  choice: वह ... है
  rationale: स्वतंत्र सर्वनाम अभी वर्णित वस्तु की पहचान अन्नबलि के रूप में कराता है; हिंदी में इसका सीधा प्रतिपादन सुरक्षित रखा गया है।
