source:
  edition: WLC
  text: וְ/הִקְטִ֨יר הַ/כֹּהֵ֜ן אֶת אַזְכָּרָתָ֗/הּ מִ/גִּרְשָׂ/הּ֙ וּ/מִ/שַּׁמְנָ֔/הּ עַ֖ל כָּל לְבֹנָתָ֑/הּ אִשֶּׁ֖ה לַ/יהוָֽה־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/016.yaml
  text: And the priest shall burn its memorial portion from its crushed grain and from its oil[a], with all its frankincense—an offering made by fire to Yahweh.
translation:
  language: hi
  text: और याजक उसके कूटे हुए अनाज[a] और उसके तेल में से उसका स्मरण-भाग, उसके सारे लोबान के साथ, यहोवा के लिए अग्नि-भेंट के रूप में जलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘मोटे कुटे हुए दानों’; इब्रानी शब्द अन्नबलि के लिए तैयार किए गए कूटे अथवा मोटे तौर पर तोड़े गए दानों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְטִיר
  choice: जलाए
  rationale: बलिदान-संबंधी प्रसंग में קטר का हिफ़ील रूप वेदी पर भेंट को जलाने, अर्थात उसका धुआँ ऊपर उठाने, को दर्शाता है। ‘जलाए’ सहज और स्पष्ट हिन्दी है।
- source_word: הַכֹּהֵן
  choice: याजक
  rationale: लैव्यव्यवस्था की उपासना-संबंधी विधियों में כֹּהֵן के लिए प्रचलित और गरिमापूर्ण हिन्दी शब्द।
- source_word: אַזְכָּרָתָהּ
  choice: उसका स्मरण-भाग
  rationale: यह अन्नबलि के उस प्रतिनिधि भाग का पारिभाषिक नाम है जिसे वेदी पर जलाया जाता था। ‘स्मरण-भाग’ मूल शब्द की स्मरण-संबंधी धारणा और उसके भाग होने—दोनों को बनाए रखता है।
- source_word: מִגִּרְשָׂהּ
  choice: उसके कूटे हुए अनाज में से
  rationale: גֶּרֶשׂ कूटे या मोटे तौर पर तोड़े गए दानों को सूचित करता है। यह रूप सामान्य पाठक के लिए स्पष्ट है और पहले फल की अन्नबलि की तैयारी के अनुकूल है।
- source_word: וּמִשַּׁמְנָהּ
  choice: और उसके तेल में से
  rationale: מן बताता है कि स्मरण-भाग अनाज और तेल में से लिया जाता है; हिन्दी में ‘में से’ इस संबंध को स्पष्ट रखता है।
- source_word: עַל כָּל לְבֹנָתָהּ
  choice: उसके सारे लोबान के साथ
  rationale: इस बलिदान-विधि में עַל साथ जलाए जाने का भाव देता है। यह अनुवाद सहज रूप से बताता है कि सारा लोबान स्मरण-भाग के साथ चढ़ाया जाता है।
- source_word: אִשֶּׁה
  choice: अग्नि-भेंट
  rationale: यह आग द्वारा वेदी पर चढ़ाई जाने वाली भेंट का बलिदान-संबंधी पारिभाषिक शब्द है। ‘अग्नि-भेंट’ संक्षिप्त, स्पष्ट और मूल की विधिक शैली के अनुरूप है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: लामेद भेंट के समर्पण को व्यक्त करता है; ‘के लिए’ स्वाभाविक हिन्दी है। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम सीधे आया है। ‘यहोवा’ हिन्दी में पहचाना जाने वाला नाम-रूप है और इसे सामान्य उपाधि ‘प्रभु’ में बदलने के बजाय नाम के रूप में सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक और उपासना-संबंधी गरिमा बनाए रखी गई है। वाक्य को मूल इब्रानी की संरचना के निकट रखते हुए ‘में से’ और ‘के साथ’ द्वारा संबंध स्पष्ट किए गए हैं। ‘स्मरण-भाग’ और ‘अग्नि-भेंट’ पारिभाषिक पद हैं, पर सामान्य पाठक के लिए भी अर्थगम्य हैं।
