source:
  edition: WLC
  text: וְ/כָל קָרְבַּ֣ן מִנְחָתְ/ךָ֮ בַּ/מֶּ֣לַח תִּמְלָח֒ וְ/לֹ֣א תַשְׁבִּ֗ית מֶ֚לַח בְּרִ֣ית אֱלֹהֶ֔י/ךָ מֵ/עַ֖ל מִנְחָתֶ֑/ךָ עַ֥ל כָּל קָרְבָּנְ/ךָ֖ תַּקְרִ֥יב מֶֽלַח־־׃ס
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/013.yaml
  text: And every offering of your grain offering you shall season with salt[a]. You shall not let the salt of the covenant of your God be lacking from your grain offering[c][b]; with all your offerings you shall offer salt.
translation:
  language: hi
  text: अपनी हर अन्नबलि में नमक डालना[a]। अपनी अन्नबलि में अपने परमेश्वर की वाचा के नमक की कमी न होने देना[b]। अपने हर चढ़ावे के साथ नमक भी चढ़ाना[c]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “नमक से नमकीन करना।” इब्रानी में ‘नमक’ संज्ञा और उसी मूल की क्रिया साथ प्रयुक्त हुई हैं।
    reason: lexical_alternative
  - marker: b
    text: “अपने परमेश्वर की वाचा का नमक” मूल का शाब्दिक वाचा-संबंधी पदबंध है। पद स्वयं इसके प्रतीकात्मक अर्थ की व्याख्या नहीं करता।
    reason: cultural_note
  - marker: c
    text: या, “अपने हर चढ़ावे पर नमक चढ़ाना।”
    reason: lexical_alternative
lexical_decisions:
- source_word: קָרְבַּן
  choice: चढ़ावा
  rationale: यह बलिदान-संबंधी व्यापक शब्द है। आधुनिक हिन्दी में ‘चढ़ावा’ स्वाभाविक है और इस पद में अर्पित वस्तु का अर्थ स्पष्ट करता है।
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था 2 के प्रसंग में यह अनाज से तैयार की जाने वाली भेंट है; ‘अन्नबलि’ सामान्य ‘भेंट’ की अपेक्षा इसकी विधिक और बलिदानी विशिष्टता सुरक्षित रखता है।
- source_word: בַּמֶּלַח תִּמְלָח
  choice: नमक डालना
  rationale: इब्रानी में ‘नमक’ संज्ञा के साथ ‘नमक लगाना’ क्रिया की पुनरुक्ति है। ‘नमक डालना’ साधारण आधुनिक हिन्दी में स्वाभाविक है और विधि की माँग स्पष्ट रखता है; अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: תַשְׁבִּית
  choice: कमी न होने देना
  rationale: यहाँ हिफ़ील रूप हटाने, समाप्त करने या अनुपस्थित होने देने का निषेध व्यक्त करता है। चुना हुआ रूप हिन्दी में स्पष्ट और प्रसंगानुकूल है।
- source_word: מֶלַח בְּרִית אֱלֹהֶיךָ
  choice: अपने परमेश्वर की वाचा का नमक
  rationale: यह इब्रानी संबंध-वाचक पदबंध और उसकी वाचा-संबंधी उपमा को बिना व्याख्यात्मक विस्तार के सुरक्षित रखता है।
- source_word: עַל כָּל קָרְבָּנְךָ
  choice: अपने हर चढ़ावे के साथ
  rationale: עַל का अधिक शाब्दिक अर्थ ‘पर’ है, पर यहाँ नमक को हर चढ़ावे के साथ चढ़ाने की अपेक्षा हिन्दी में ‘के साथ’ से स्वाभाविक रूप से व्यक्त होती है। शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: תַּקְרִיב
  choice: चढ़ाना
  rationale: קרב का हिफ़ील बलिदानी प्रसंग में पास लाने अथवा अर्पित करने का अर्थ देता है। ‘चढ़ाना’ आधुनिक हिन्दी में इस धार्मिक क्रिया का सहज समतुल्य है।
theological_decisions:
- issue: वाचा के नमक वाले पदबंध को शाब्दिक रखा जाए या उसके प्रतीकात्मक अर्थ की व्याख्या की जाए
  choice: मुख्य पाठ में ‘अपने परमेश्वर की वाचा का नमक’ बनाए रखना
  alternative: वह नमक जो तुम्हारे परमेश्वर की वाचा का चिह्न है
  rationale: मूल पद स्वयं इस प्रतीक की व्याख्या नहीं करता। शाब्दिक पदबंध वाचा, बलिदान और नमक के संबंध की वास्तविक धार्मिक गहनता और संभावित अर्थ-विस्तार को खुला रखता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में विधिक निर्देश का संक्षिप्त और गरिमापूर्ण शैली-रूप रखा गया है। ‘करना/देना/चढ़ाना’ वाले आज्ञार्थक रूप सामान्य पाठकों के लिए सहज हैं; ‘वाचा’ और ‘अन्नबलि’ जैसे स्थापित बाइबलीय शब्द प्रसंग की धार्मिक विशिष्टता बनाए रखते हैं।
