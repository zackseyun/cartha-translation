source:
  edition: WLC
  text: וְ/אִם תַּקְרִ֛יב מִנְחַ֥ת בִּכּוּרִ֖ים לַ/יהוָ֑ה אָבִ֞יב קָל֤וּי בָּ/אֵשׁ֙ גֶּ֣רֶשׂ כַּרְמֶ֔ל תַּקְרִ֕יב אֵ֖ת מִנְחַ֥ת בִּכּוּרֶֽי/ךָ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/014.yaml
  text: And if you present to Yahweh an offering of firstfruits, you shall present your offering of firstfruits as fresh heads of grain roasted in the fire, crushed kernels from the fresh grain.
translation:
  language: hi
  text: और यदि तुम याहवे को पहली उपज की अन्नबलि चढ़ाओ, तो आग में भुनी हुई हरी बालें—नई उपज के कूटे हुए दाने[a]—अपनी पहली उपज की अन्नबलि के रूप में चढ़ाना।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या: “आग में भुनी हुई हरी बालें, नई फसल का मोटा कूटा हुआ अनाज।”'
    reason: גֶּרֶשׂ כַּרְמֶל का सटीक संबंध और बारीकी अनिश्चित है; इसे ‘नई उपज के कूटे हुए दाने’ या अधिक स्वतंत्र रूप से ‘नई फसल का मोटा कूटा हुआ अनाज’ समझा जा सकता है।
lexical_decisions:
- source_word: מִנְחַת
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था 2 में מִנְחָה अनाज से चढ़ाई जाने वाली भेंट का पारिभाषिक शब्द है; ‘अन्नबलि’ सामग्री और अनुष्ठानिक अर्थ दोनों स्पष्ट करता है।
- source_word: בִּכּוּרִים / בִּכּוּרֶיךָ
  choice: पहली उपज
  rationale: यह सबसे पहले तैयार होने वाली कृषि-उपज को दर्शाता है जिसे परमेश्वर को अर्पित किया जाता था; आधुनिक हिन्दी में ‘पहली उपज’ सहज और स्पष्ट है।
- source_word: לַיהוָה
  choice: याहवे को
  rationale: इब्रानी पाठ में वाचा का व्यक्तिगत नाम יהוה है; उसे उपाधि से बदलने के बजाय ‘याहवे’ रूप में रखा गया है।
- source_word: אָבִיב
  choice: हरी बालें
  rationale: यह अनाज की ताज़ी, आरम्भिक अवस्था की बालों को सूचित करता है। ‘हरी बालें’ कृषि-बिंब बनाए रखता है, यद्यपि इसका आशय केवल रंग नहीं बल्कि नई या ताज़ी अवस्था है।
- source_word: קָלוּי בָּאֵשׁ
  choice: आग में भुनी हुई
  rationale: यह आग से भूनने की तैयारी-विधि को सीधे और स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: גֶּרֶשׂ
  choice: कूटे हुए दाने
  rationale: शब्द टूटे या मोटे कूटे हुए अनाज को दर्शाता है; ‘कूटे हुए दाने’ ठोस और सामान्य पाठक के लिए सुबोध है।
- source_word: כַּרְמֶל
  choice: नई उपज के
  rationale: इस प्रसंग में यह किसी स्थान का नाम नहीं, बल्कि ताज़े या नए अनाज को सूचित करता है।
- source_word: תַּקְרִיב ... תַּקְרִיב
  choice: चढ़ाओ ... चढ़ाना
  rationale: קרב का हिफ़ील रूप वेदीय भेंट को परमेश्वर के सामने लाने या चढ़ाने की क्रिया है। हिन्दी में स्वाभाविकता रखते हुए मूल की पुनरावृत्ति को यथासम्भव बनाए रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: याहवे
  alternative: यहोवा / प्रभु
  rationale: मूल पाठ में व्यक्तिगत वाचा-नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और उसे किसी उपाधि में बदलकर मूल की विशिष्टता नहीं मिटाता।
- issue: מִנְחָה को सामान्य भेंट या विशिष्ट अन्नबलि मानना
  choice: अन्नबलि
  alternative: भेंट
  rationale: पूरे अध्याय का प्रसंग अनाज से बनी भेंट का है; इसलिए विशिष्ट अनुष्ठानिक अर्थ स्पष्ट करना यहाँ उचित है, जबकि ‘भेंट’ अकेला अधिक व्यापक होता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण किन्तु सहज अनुष्ठानिक गद्य। ‘हरी बालें’ और ‘कूटे हुए दाने’ कृषि-बिंब को ठोस रखते हैं; डैश मूल के निकट रखे गए वर्णनात्मक पदों को बिना अत्यधिक व्याख्या के जोड़ता है।
