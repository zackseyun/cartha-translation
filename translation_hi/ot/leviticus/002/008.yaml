  text: וְ/הֵבֵאתָ֣ אֶת הַ/מִּנְחָ֗ה אֲשֶׁ֧ר יֵעָשֶׂ֛ה מֵ/אֵ֖לֶּה לַ/יהוָ֑ה וְ/הִקְרִיבָ/הּ֙ אֶל הַ/כֹּהֵ֔ן וְ/הִגִּישָׁ֖/הּ אֶל הַ/מִּזְבֵּֽחַ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/008.yaml
  text: And you shall bring the grain offering that is made from these things to Yahweh[a], and he shall present it to the priest, and he shall bring it near to the altar.
translation:
  language: hi
  text: इन चीज़ों से बनाई गई अन्नबलि यहोवा के लिए लाना। वह उसे याजक के पास प्रस्तुत करे, और याजक उसे वेदी के निकट ले जाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהֵבֵאתָ
  choice: तुम ... लाना
  rationale: हिफ़ील पूर्ण 2 पुं. एक. यहाँ विधिक निर्देश का भाव देता है। हिंदी में ‘तुम ... लाना’ स्वाभाविक और स्पष्ट आज्ञार्थक शैली है।
- source_word: הַמִּנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था 2 में מִנְחָה विशेष रूप से अनाज से तैयार भेंट को दर्शाता है; ‘अन्नबलि’ संक्षिप्त, प्रचलित और प्रसंगानुकूल है।
- source_word: אֲשֶׁר יֵעָשֶׂה מֵאֵלֶּה
  choice: इनमें से तैयार किया गया
  rationale: निफ़अल रूप का कर्मवाच्य भाव और מֵאֵלֶּה का स्रोतार्थ दोनों सुरक्षित रहते हैं, बिना सामग्री या विधि को अनावश्यक रूप से निश्चित किए।
- source_word: לַיהוָה
  choice: यहोवा के पास
  rationale: ל दिशा और समर्पण दोनों व्यक्त कर सकता है। मुख्य पाठ में गति-संबंधी संदर्भ के कारण ‘के पास’ रखा गया है; समर्पण का संभव अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְהִקְרִיבָהּ אֶל הַכֹּהֵן
  choice: उसे याजक के पास प्रस्तुत करना
  rationale: קרב के हिफ़ील का अर्थ निकट लाना अथवा प्रस्तुत करना है। यहाँ उपासक द्वारा याजक को सौंपने की क्रिया को ‘प्रस्तुत करना’ स्वाभाविक रूप से व्यक्त करता है और अगली क्रिया से भेद बनाए रखता है।
- source_word: וְהִגִּישָׁהּ אֶל הַמִּזְבֵּחַ
  choice: वह उसे वेदी के निकट ले जाए
  rationale: निहित कर्ता का स्वाभाविक संदर्भ याजक है। נגשׁ के हिफ़ील का ‘निकट ले जाना’ अर्थ स्पष्ट रूप से सुरक्षित रखा गया है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ के व्यक्तिवाचक वाचा-नाम को उपाधि ‘प्रभु’ से प्रतिस्थापित नहीं किया गया। आधुनिक हिंदी बाइबल-पाठकों में अधिक पहचाने जाने वाले रूप ‘यहोवा’ को चुना गया, जबकि स्वरांकन के पुनर्निर्माण को लेकर विद्यमान प्रश्न स्वीकार्य हैं।
- issue: לַיהוָה में दिशा अथवा समर्पण
  choice: यहोवा के पास
  alternative: यहोवा के लिए
  rationale: निकट लाने की क्रमिक क्रियाओं के बीच दिशार्थ उपयुक्त है, पर ל का समर्पणार्थ भी वास्तविक है; इसलिए वैकल्पिक अर्थ पादटिप्पणी में सुरक्षित रखा गया है।
- issue: וְהִקְרִיבָהּ का कर्ता
  choice: 'उपासक: ‘उसे ... प्रस्तुत करना’'
  alternative: 'याजक: ‘वह उसे ... प्रस्तुत करे’'
  rationale: द्वितीय पुरुष ‘तुम’ से निकटतम और व्याकरणतः सहज निरंतरता यही है कि उपासक भेंट याजक के पास लाता है; अगली क्रिया में याजक उसे वेदी के निकट ले जाता है। अंग्रेज़ी परामर्श-पाठ का पहले ही क्रिया में कर्ता-परिवर्तन इब्रानी रूप से आवश्यक नहीं है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिक निर्देश के अनुरूप रखी गई है। ‘अन्नबलि’, ‘याजक’ और ‘वेदी’ जैसे परिचित धार्मिक शब्द बनाए गए हैं। क्रियाओं קרב और נגשׁ के क्रम तथा भेद को क्रमशः ‘प्रस्तुत करना’ और ‘निकट ले जाना’ से व्यक्त किया गया है।
