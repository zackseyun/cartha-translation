base_translation:
  language: en
  yaml_path: translation/ot/leviticus/002/005.yaml
  text: And if your offering is a grain offering on the griddle[a], it shall be of fine flour mixed with oil, unleavened.
translation:
  language: hi
  text: यदि तवे पर तैयार की हुई अन्नबलि तुम्हारा चढ़ावा हो, तो वह तेल से मिला हुआ, खमीररहित मैदा हो।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: מִנְחָה
  choice: अन्नबलि
  rationale: लैव्यव्यवस्था 2 में यह शब्द विशेष रूप से अनाज या आटे से चढ़ाई जाने वाली भेंट को दर्शाता है; ‘अन्नबलि’ संक्षिप्त, प्रचलित और संदर्भानुकूल है।
- source_word: עַל הַמַּחֲבַת
  choice: तवे पर
  rationale: यह पद एक चपटी पकाने की सतह या पात्र की ओर संकेत करता है; आधुनिक हिन्दी में ‘तवा’ सबसे सहज समतुल्य है।
- source_word: קָרְבָּנְךָ
  choice: तुम्हारा ... चढ़ावा
  rationale: यह מִנְחָה के साथ संबद्ध होकर उपासक के प्रस्तुत किए हुए चढ़ावे को दर्शाता है; इस रूप में प्रत्यक्ष संबोधन और अर्पण का भाव दोनों बने रहते हैं।
- source_word: סֹלֶת
  choice: मैदा
  rationale: यह उच्च गुणवत्ता वाले बारीक पिसे आटे का पारिभाषिक सामग्री-शब्द है; ‘मैदा’ आम आधुनिक हिन्दी में स्पष्ट और स्वाभाविक है।
- source_word: בְּלוּלָה בַשֶּׁמֶן
  choice: तेल में मिला हुआ
  rationale: मूल पद आटे के तेल के साथ मिलाए जाने को व्यक्त करता है, लेकिन गूँधने जैसी किसी विशिष्ट विधि को अनिवार्य नहीं बनाता।
- source_word: מַצָּה
  choice: खमीररहित
  rationale: यहाँ शब्द चढ़ावे की अपेक्षित दशा बताता है; ‘खमीररहित’ अर्थ को संक्षेप और स्पष्टता से व्यक्त करता है।
- source_word: תִהְיֶה
  choice: हो
  rationale: इस विधिक संदर्भ में क्रिया अपेक्षित दशा निर्धारित करती है; ‘हो’ हिन्दी में स्वाभाविक निर्देशात्मक बल रखता है।
