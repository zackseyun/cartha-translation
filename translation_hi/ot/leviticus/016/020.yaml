id: LEV.16.20
reference: Leviticus 16:20
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִלָּה֙ מִ/כַּפֵּ֣ר אֶת הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֥הֶל מוֹעֵ֖ד וְ/אֶת הַ/מִּזְבֵּ֑חַ וְ/הִקְרִ֖יב אֶת הַ/שָּׂעִ֥יר הֶ/חָֽי־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/020.yaml
  text: When he has finished making atonement for the sanctuary[a], the tent of meeting, and the altar[c][b], he shall present the live goat.
translation:
  language: hi
  text: जब वह पवित्र स्थान[a], मिलाप के तंबू और वेदी के लिए प्रायश्चित[c] कर चुका हो, तब वह जीवित बकरे को प्रस्तुत करे[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “पवित्र स्थान।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “निकट लाए”; अर्थात अगले अनुष्ठानिक कार्य के लिए प्रस्तुत करे।
    reason: lexical_alternative
  - marker: c
    text: इस प्रसंग में “प्रायश्चित करना” का अर्थ अनुष्ठानिक शुद्धिकरण करना भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִלָּה מִכַּפֵּר
  choice: जब वह ... प्रायश्चित करना पूरा कर ले
  rationale: क्रिया כלה और מן־युक्त धातुरूप समाप्त की गई क्रिया के बाद अगले अनुष्ठान की ओर बढ़ने का क्रम दिखाते हैं; हिन्दी में कालवाचक उपवाक्य स्वाभाविक है।
- source_word: מִכַּפֵּר
  choice: प्रायश्चित करना
  rationale: כפר लैव्यव्यवस्था का प्रमुख अनुष्ठानिक शब्द है। ‘प्रायश्चित करना’ उसके व्यापक धार्मिक-अनुष्ठानिक अर्थ को बनाए रखता है; शुद्धिकरण का संदर्भगत अर्थ पादटिप्पणी में दिया गया है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: यहाँ शब्द अमूर्त पवित्रता नहीं, पवित्र उपासना-स्थल को सूचित करता है। ‘पवित्रस्थान’ संक्षिप्त और प्रचलित हिन्दी समतुल्य है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह पद मिलने अथवा भेंट करने के नियत तंबू का पारंपरिक और समझने योग्य हिन्दी नाम प्रस्तुत करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलि-संबंधी इस सामान्य इब्रानी संज्ञा का स्वाभाविक हिन्दी समतुल्य ‘वेदी’ है।
- source_word: וְהִקְרִיב
  choice: सामने प्रस्तुत करे
  rationale: हिफ़ील הקריב का मूल भाव ‘निकट लाना’ है और यहाँ अगले अनुष्ठानिक कार्य हेतु बकरे को पेश करना अभिप्रेत है। ‘सामने प्रस्तुत करे’ इस भाव को सहज हिन्दी में व्यक्त करता है।
- source_word: הַשָּׂעִיר הֶחָי
  choice: जीवित बकरा
  rationale: विशेषण חי इस बकरे को पहले वध किए गए बकरे से अलग पहचानता है; ‘जीवित बकरा’ स्पष्ट रूप से यह विरोध बनाए रखता है।
theological_decisions:
- issue: बलिदान-संबंधी प्रसंग में כפר का अनुवाद
  choice: प्रायश्चित करना
  alternative: अनुष्ठानिक शुद्धिकरण करना
  rationale: यह धातु यहाँ पवित्र वस्तुओं अथवा स्थानों से जुड़ी शुद्धि का भाव रख सकती है, फिर भी ‘प्रायश्चित करना’ इसके व्यापक उपासना-संबंधी अर्थ को सुरक्षित रखता है और किसी एक प्रायश्चित-सिद्धांत को आरोपित नहीं करता। संदर्भगत विकल्प पादटिप्पणी में सुरक्षित है।
- issue: הַקֹּדֶשׁ की पहचान
  choice: पवित्रस्थान
  alternative: पवित्र स्थान
  rationale: संदर्भ इसे पवित्र उपासना-क्षेत्र के रूप में प्रस्तुत करता है। संयुक्त रूप ‘पवित्रस्थान’ स्पष्ट है, जबकि अधिक शाब्दिक विकल्प को पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण, सहज अनुष्ठानिक शैली अपनाई गई है। मुख्य पाठ में पारंपरिक धार्मिक पद ‘प्रायश्चित’ रखा गया है, जबकि वास्तविक शाब्दिक और संदर्भगत विकल्प पादटिप्पणियों में सुरक्षित हैं।
