id: LEV.16.14
reference: Leviticus 16:14
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַח֙ מִ/דַּ֣ם הַ/פָּ֔ר וְ/הִזָּ֧ה בְ/אֶצְבָּע֛/וֹ עַל פְּנֵ֥י הַ/כַּפֹּ֖רֶת קֵ֑דְמָ/ה וְ/לִ/פְנֵ֣י הַ/כַּפֹּ֗רֶת יַזֶּ֧ה שֶֽׁבַע פְּעָמִ֛ים מִן הַ/דָּ֖ם בְּ/אֶצְבָּעֽ/וֹ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/014.yaml
  text: And he shall take some of the bull's blood and sprinkle it with his finger on the front of the mercy seat[a], eastward; and before the mercy seat he shall sprinkle some of the blood with his finger seven times.
translation:
  language: hi
  text: फिर वह बैल के लहू में से कुछ लेकर अपनी उँगली से प्रायश्चित के ढक्कन[a] के सामने वाले भाग पर, पूर्व की ओर, छिड़के; और प्रायश्चित के ढक्कन के सामने वह अपनी उँगली से उस लहू में से कुछ सात बार छिड़के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इसे “दया-आसन” भी कहा जाता है। इब्रानी शब्द वाचा के संदूक के उस ढक्कन को दर्शाता है जो प्रायश्चित से जुड़ा था।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर वह ... लेकर
  rationale: अनुष्ठान संबंधी क्रमिक निर्देश में संयुक्त पूर्ण क्रिया का भाव साधारण भूतकाल नहीं, बल्कि आगे की निर्धारित क्रिया है; हिंदी में ‘फिर वह ... लेकर’ इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: מִדַּם הַפָּר
  choice: बैल के लहू में से कुछ
  rationale: מִן यहाँ अंशसूचक है और הַפָּר बलि के बैल को सूचित करता है। ‘में से कुछ’ प्रयुक्त मात्रा को स्पष्ट रखता है।
- source_word: וְהִזָּה / יַזֶּה
  choice: छिड़के
  rationale: पुरोहितीय अनुष्ठान में נזה लहू को नियत रीति से छिड़कने की क्रिया है। विधिसूचक ‘छिड़के’ आधुनिक हिंदी में उपयुक्त है।
- source_word: בְאֶצְבָּעוֹ
  choice: अपनी उँगली से
  rationale: בְ उपकरण सूचित करता है; ‘अपनी उँगली से’ स्वाभाविक हिंदी है और अनुष्ठान का साधन सुरक्षित रखता है।
- source_word: עַל פְּנֵי הַכַּפֹּרֶת
  choice: प्रायश्चित के ढक्कन के सामने वाले भाग पर
  rationale: עַל स्थान को और פְּנֵי यहाँ वस्तु के मुख/सामने वाले भाग को सूचित करता है। ‘भाग पर’ रक्त के ढक्कन पर पड़ने का अर्थ बनाए रखता है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित का ढक्कन
  rationale: כַּפֹּרֶת वाचा के संदूक के विशिष्ट ऊपरी आवरण का नाम है और प्रायश्चित से जुड़ा है। यह चयन वस्तु के भौतिक स्वरूप और धार्मिक संबंध दोनों को स्पष्ट करता है; पारंपरिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: קֵדְמָה
  choice: पूर्व की ओर
  rationale: दिशासूचक रूप पूर्वाभिमुखता बताता है; अनावश्यक रूप से इसे केवल ‘पूर्वी किनारा’ नहीं बनाया गया।
- source_word: וְלִפְנֵי הַכַּפֹּרֶת
  choice: और प्रायश्चित के ढक्कन के सामने
  rationale: לִפְנֵי ढक्कन के सामने की स्थिति बताता है और पहली क्रिया—ढक्कन पर छिड़कने—से दूसरी क्रिया को अलग रखता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: अनुष्ठान में संख्या स्पष्ट और महत्त्वपूर्ण है, इसलिए उसे यथावत रखा गया है।
theological_decisions:
- issue: הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित का ढक्कन
  alternative: दया-आसन
  rationale: मूल शब्द संदूक के ढक्कन को दर्शाता है, जो प्रायश्चित के अनुष्ठान से विशेष रूप से जुड़ा है। ‘प्रायश्चित का ढक्कन’ भौतिक वस्तु को स्पष्ट करता है और धार्मिक संबंध को बनाए रखता है; ‘दया-आसन’ पारंपरिक किंतु कम प्रत्यक्ष विकल्प है, इसलिए उसे पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधिसूचक रखी गई है। ‘लहू’ धार्मिक-अनुष्ठानिक संदर्भ में स्वाभाविक है, जबकि वाक्य-रचना ऐसी रखी गई है कि दोनों अलग स्थानों—ढक्कन पर और उसके सामने—लहू छिड़कने का भेद स्पष्ट रहे।
