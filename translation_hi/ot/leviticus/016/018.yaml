source:
  edition: WLC
  text: וְ/יָצָ֗א אֶל הַ/מִּזְבֵּ֛חַ אֲשֶׁ֥ר לִ/פְנֵֽי יְהוָ֖ה וְ/כִפֶּ֣ר עָלָ֑י/ו וְ/לָקַ֞ח מִ/דַּ֤ם הַ/פָּר֙ וּ/מִ/דַּ֣ם הַ/שָּׂעִ֔יר וְ/נָתַ֛ן עַל קַרְנ֥וֹת הַ/מִּזְבֵּ֖חַ סָבִֽיב־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/018.yaml
  text: Then he shall go out to the altar that is before Yahweh and make atonement for it[a], and he shall take some of the bull's blood and some of the goat's blood and put it on the horns of the altar all around.
translation:
  language: hi
  text: तब वह बाहर निकलकर उस वेदी के पास जाए जो यहोवा के सामने है, और उसके लिए प्रायश्चित्त करे[a]। वह बैल के लहू में से और बकरे के लहू में से कुछ लेकर वेदी के सींगों पर चारों ओर लगाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “उसे शुद्ध करे”; याजकीय अनुष्ठानों में इब्रानी क्रिया शुद्ध करने का भाव भी रख सकती है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְיָצָא
  choice: तब वह बाहर ... जाए
  rationale: अनुष्ठानिक निर्देशों के क्रम को स्वाभाविक हिन्दी में व्यक्त करता है और भीतरी पवित्र स्थान से बाहर जाने की गति बनाए रखता है।
- source_word: הַמִּזְבֵּחַ אֲשֶׁר לִפְנֵי יְהוָה
  choice: उस वेदी के पास ... जो यहोवा के सामने है
  rationale: מִזְבֵּחַ के लिए ‘वेदी’ और לִפְנֵי के स्थान-सूचक अर्थ के लिए ‘सामने’ सटीक और सहज हैं। हिन्दी वाक्य-विन्यास में ‘के पास जाए’ गन्तव्य को स्पष्ट करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी व्यक्तिगत नाम को हिन्दी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, न कि उपाधि से बदला गया है।
- source_word: וְכִפֶּר עָלָיו
  choice: और उसके लिए प्रायश्चित करे
  rationale: याजकीय अनुष्ठान में כפר के व्यापक प्रायश्चितकारी अर्थ को बनाए रखता है; वेदी का शुद्धीकरण इसमें निहित हो सकता है, इसलिए वैकल्पिक अर्थ पादटिप्पणी में दिया गया है।
- source_word: וְלָקַח מִדַּם הַפָּר וּמִדַּם הַשָּׂעִיר
  choice: वह बैल के लहू में से और बकरे के लहू में से कुछ लेकर
  rationale: दोनों बार प्रयुक्त מִן का अंशवाचक भाव ‘में से कुछ’ द्वारा स्पष्ट होता है। ‘लहू’ बलिदानी प्रसंग में स्वाभाविक, गरिमापूर्ण हिन्दी है।
- source_word: הַפָּר
  choice: बैल
  rationale: פַּר का सीधा और पर्याप्त हिन्दी समतुल्य है; आयु के बारे में अतिरिक्त विवरण नहीं जोड़ा गया।
- source_word: הַשָּׂעִיר
  choice: बकरा
  rationale: שָׂעִיר यहाँ नर बकरे को सूचित करता है; ‘बकरा’ हिन्दी में लिंग को स्वाभाविक रूप से स्पष्ट करता है।
- source_word: וְנָתַן עַל קַרְנוֹת הַמִּזְבֵּחַ סָבִיב
  choice: वेदी के सींगों पर चारों ओर लगाए
  rationale: अनुष्ठानिक प्रसंग में נָתַן के लिए ‘लगाए’ सहज है और रक्त को सींगों पर रखने/लगाने की क्रिया बताता है; סָבִיב को ‘चारों ओर’ से व्यक्त किया गया है।
theological_decisions:
- issue: याजकीय बलिदानी प्रसंग में כפר का अनुवाद
  choice: उसके लिए प्रायश्चित करे
  alternative: उसे शुद्ध करे
  rationale: ‘प्रायश्चित करे’ शब्द के स्थापित और व्यापक अनुष्ठानिक-धर्मवैज्ञानिक अर्थ को सुरक्षित रखता है, बिना प्रायश्चित के किसी विशेष सिद्धान्त को आरोपित किए। वेदी की शुद्धि का वास्तविक भाव पादटिप्पणी में संरक्षित है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण किंतु सामान्य पाठकों के लिए सुबोध शैली। ‘वेदी’, ‘प्रायश्चित’ और ‘लहू’ जैसे परिचित बाइबलीय शब्द बनाए गए हैं; वाक्य को हिन्दी की स्वाभाविक प्रक्रियात्मक लय के अनुसार दो भागों में रखा गया है।
