  text: וְ/הָֽיְתָה זֹּ֨את לָ/כֶ֜ם לְ/חֻקַּ֣ת עוֹלָ֗ם לְ/כַפֵּ֞ר עַל בְּנֵ֤י יִשְׂרָאֵל֙ מִ/כָּל חַטֹּאתָ֔/ם אַחַ֖ת בַּ/שָּׁנָ֑ה וַ/יַּ֕עַשׂ כַּ/אֲשֶׁ֛ר צִוָּ֥ה יְהוָ֖ה אֶת מֹשֶֽׁה־־־־׃פ
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/034.yaml
  text: This shall be for you a permanent statute[a], to make atonement for the sons of Israel for all their sins once in the year[b]. And he did as Yahweh commanded Moses.
translation:
  language: hi
  text: “यह तुम्हारे लिए सदा की विधि होगी कि इस्राएल की संतानों के सभी पापों के लिए[a] वर्ष में एक बार प्रायश्चित किया जाए।” और उसने वैसा ही किया, जैसा याहवे ने मूसा को आज्ञा दी थी।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “उनके सभी पापों से”; यह रूप पापों से शुद्ध किए जाने की अर्थ-छाया पर बल देता है।
    reason: מִן के संभावित अलगाव अथवा शुद्धिकरण-संबंधी अर्थ को सुरक्षित रखना।
lexical_decisions:
- source_word: וְהָיְתָה זֹּאת לָכֶם לְחֻקַּת עוֹלָם
  choice: यह तुम्हारे लिए सदा की विधि होगी
  rationale: कानूनी निर्देश का भाव बनाए रखते हुए חֻקַּת עוֹלָם को स्वाभाविक और गरिमापूर्ण आधुनिक हिन्दी में व्यक्त करता है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित किया जाए
  rationale: लैव्यव्यवस्था के बलिदान-संबंधी प्रसंग में כפר के धार्मिक और अनुष्ठानिक अर्थ को सुरक्षित रखता है। कर्मवाच्य हिन्दी में विधान का आशय स्वाभाविक बनाता है, जबकि कर्ता को अनावश्यक रूप से निर्दिष्ट नहीं करता।
- source_word: עַל בְּנֵי יִשְׂרָאֵל
  choice: इस्राएल की सन्तान के
  rationale: मानक इब्रानी सामूहिक जातीय पद का रूप बनाए रखता है और आधुनिक हिन्दी में पूरे इस्राएली समुदाय को सूचित करता है। अधिक मुहावरेदार विकल्प पादटिप्पणी में दिया गया है।
- source_word: מִכָּל חַטֹּאתָם
  choice: सभी पापों के लिए
  rationale: प्रायश्चित के संदर्भ में מִן-युक्त पद को सहज हिन्दी में व्यक्त करता है। ‘पापों से’ वाला निकटतर रूप शुद्धिकरण की छाया सामने लाता है और पादटिप्पणी में सुरक्षित है।
- source_word: אַחַת בַּשָּׁנָה
  choice: वर्ष में एक बार
  rationale: वार्षिक पुनरावृत्ति को स्रोत के क्रम के निकट रहते हुए स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: וַיַּעַשׂ
  choice: और उसने वैसा ही किया
  rationale: इब्रानी में कर्ता व्यक्त नहीं है; ‘उसने’ निकटवर्ती प्रसंग के पुरुषवाचक संकेत को रखता है, पर उसका नाम जोड़कर अस्पष्टता समाप्त नहीं करता।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी पाठ में आए परमेश्वर के व्यक्तिगत वाचा-नाम को पदवी से बदलने के बजाय लिप्यंतरित करता है।
theological_decisions:
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ व्यक्तिगत दिव्य नाम का प्रयोग करता है; ‘याहवे’ उसका व्यापक रूप से मान्य आधुनिक लिप्यंतरण है और नाम तथा पदवी के भेद को बनाए रखता है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएल की सन्तान
  alternative: इस्राएली; इस्राएल के लोग
  rationale: यह पद वाचिक रूप से ‘इस्राएल की सन्तान’ है, पर पूरे वाचा-समुदाय को सूचित करता है। मुख्य पाठ स्रोत-रूप को रखता है और पादटिप्पणी मुहावरेदार सामूहिक अर्थ देती है।
- issue: מִכָּל חַטֹּאתָם में प्रायश्चित और शुद्धिकरण का संबंध
  choice: उनके सभी पापों के लिए
  alternative: उनके सभी पापों से
  rationale: मुख्य पाठ सहज हिन्दी में प्रायश्चित के विषय को बताता है; वैकल्पिक रूप इब्रानी מִן के कारण उपस्थित अलगाव अथवा शुद्धिकरण की छाया को सुरक्षित रखता है।
translation_notes:
  register: भाषा आधुनिक, स्पष्ट और गरिमापूर्ण रखी गई है। ‘सदा की विधि’ विधानात्मक स्वर बनाए रखती है; ‘उसने’ अंतर्निहित कर्ता की मूल अस्पष्टता को सुरक्षित रखता है।
