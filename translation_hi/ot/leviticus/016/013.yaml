base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/013.yaml
  text: And he shall put the incense on the fire before Yahweh[a], so that the cloud of the incense may cover the mercy seat that is over the testimony, so that he may not die.
translation:
  language: hi
  text: और वह धूप को यहोवा के सामने आग पर रखे, ताकि धूप का धुआँ उस प्रायश्चित-आवरण[a] को ढक ले जो साक्ष्य के ऊपर है, और वह मर न जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “दयासन।” इब्रानी शब्द संदूक के ढक्कन को, विशेषकर प्रायश्चित-विधि में उसकी भूमिका के संदर्भ में, दर्शाता है।'
    reason: lexical_alternative
lexical_decisions:
- source_word: וְנָתַן
  choice: वह ... रखे
  rationale: अनुष्ठान-विधि के संदर्भ में संयोजक सहित पूर्ण क्रिया निर्देशात्मक बल रखती है; हिंदी में संभावनार्थक रूप स्वाभाविक विधिक निर्देश देता है।
- source_word: הַקְּטֹרֶת
  choice: धूप
  rationale: पवित्रस्थान में जलाई जाने वाली सुगंधित सामग्री के लिए यह सहज और प्रचलित हिंदी पद है; ‘धूप-मिश्रण’ अनावश्यक रूप से व्याख्यात्मक होता।
- source_word: עַל הָאֵשׁ
  choice: आग पर
  rationale: यह धूप को जलते अंगारों अथवा आग पर रखने की क्रिया को सीधे व्यक्त करता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह उपासना-संबंधी निकटता और यहोवा की उपस्थिति में किए जाने वाले कार्य—दोनों को स्वाभाविक हिंदी में व्यक्त करता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी परमेश्वर-नाम को किसी उपाधि से बदलने के बजाय हिंदी में उसके स्थापित लिप्यंतरण द्वारा प्रस्तुत किया गया है।
- source_word: וְכִסָּה
  choice: ताकि ... ढक ले
  rationale: संदर्भ में अगला खंड अपेक्षित उद्देश्य अथवा परिणाम बताता है; ‘ताकि’ इस संबंध को स्पष्ट रखते हुए उसकी संभावित अर्थ-सीमा को बनाए रखता है।
- source_word: עֲנַן הַקְּטֹרֶת
  choice: धूप का बादल
  rationale: इब्रानी संबंध-वाचक रचना और उसके दृश्य बिंब को निकटता से बनाए रखता है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह संदूक के उस ढक्कन को दर्शाता है जिसकी प्रायश्चित-विधि में विशेष भूमिका है; यह चयन वस्तु और अनुष्ठानिक अर्थ दोनों को आधुनिक पाठक के लिए पारदर्शी बनाता है।
- source_word: אֲשֶׁר עַל הָעֵדוּת
  choice: जो साक्ष्य-पत्रों के ऊपर है
  rationale: संदर्भ में עֵדוּת संदूक के भीतर रखे covenant-witness, अर्थात् साक्ष्य की पट्टिकाओं, की ओर संकेत करता है। ‘साक्ष्य-पत्रों’ से आशय स्पष्ट होता है, बिना मुख्य पाठ में लंबी व्याख्या जोड़े।
- source_word: וְלֹא יָמוּת
  choice: और वह मर न जाए
  rationale: यह रूप इब्रानी संयोजन को बनाए रखते हुए चेतावनी अथवा निवारक परिणाम को सहज आधुनिक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: הַכַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-आवरण
  alternative: दयासन
  rationale: यह पद संदूक के आवरण और प्रायश्चित-अनुष्ठान से उसके संबंध दोनों को स्पष्ट करता है। ‘दयासन’ पारंपरिक है, पर आधुनिक पाठक को किसी आसन का भ्रामक बोध करा सकता है; इसलिए उसे पादटिप्पणी में रखा गया है।
- issue: परमेश्वर के नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे; प्रभु
  rationale: व्यक्तिगत इब्रानी नाम को उपाधि से प्रतिस्थापित न करके हिंदी में परिचित लिप्यंतरण अपनाया गया है। मूल उच्चारण पूर्णतः निश्चित नहीं है, इसलिए वैकल्पिक लिप्यंतरण संभव है।
- issue: अंतिम खंड וְלֹא יָמוּת का संबंध
  choice: और वह मर न जाए
  alternative: ताकि वह न मरे
  rationale: इब्रानी वाक्य उद्देश्य, चेतावनी और परिणाम के बीच संबंध को पूरी तरह विशिष्ट नहीं करता। ‘और ... न जाए’ इस तनाव को ‘ताकि’ की दूसरी स्पष्ट उद्देश्य-उपवाक्य में बदलने से बचाता है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और विधि-संबंधी है। ‘रखे’, ‘ढक ले’ और ‘मर न जाए’ जैसे रूप हिंदी में अनुष्ठानिक निर्देश को स्वाभाविक रखते हैं। तकनीकी पद ‘प्रायश्चित-आवरण’ को समझाने के लिए पादटिप्पणी दी गई है।
