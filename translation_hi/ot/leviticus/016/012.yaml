  text: וְ/לָקַ֣ח מְלֹֽא הַ֠/מַּחְתָּה גַּֽחֲלֵי אֵ֞שׁ מֵ/עַ֤ל הַ/מִּזְבֵּ֨חַ֙ מִ/לִּ/פְנֵ֣י יְהוָ֔ה וּ/מְלֹ֣א חָפְנָ֔י/ו קְטֹ֥רֶת סַמִּ֖ים דַּקָּ֑ה וְ/הֵבִ֖יא מִ/בֵּ֥ית לַ/פָּרֹֽכֶת־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/012.yaml
  text: And he shall take a full censer of coals of fire from upon the altar before Yahweh[a], and both the fullness of his hands of finely ground fragrant incense, and bring it inside the veil.
translation:
  language: hi
  text: वह याहवे के सामने की वेदी पर से आग के अंगारों से भरा हुआ धूपदान ले, और अपनी दोनों हथेलियाँ बारीक पीसी हुई सुगंधित धूप से भर ले, और इन्हें पर्दे के भीतर[a] ले जाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: अर्थात पर्दे के पीछे, भीतरी पवित्रस्थान में। इब्रानी पदबंध को ‘पर्दे के भीतर’ भी कहा जा सकता है।
    reason: संक्षिप्त इब्रानी स्थानिक पदबंध उस पर्दे के पीछे के स्थान में प्रवेश का संकेत देता है; वैकल्पिक स्वाभाविक हिंदी अभिव्यक्ति स्पष्ट की गई है।
lexical_decisions:
- source_word: וְלָקַח
  choice: वह … ले
  rationale: संयुक्त पूर्ण क्रिया यहाँ अनुष्ठान-संबंधी निर्देश को आगे बढ़ाती है; हिंदी में विधिसूचक अर्थ संदर्भ और ‘ले जाए’ से स्वाभाविक रूप से प्रकट होता है।
- source_word: מְלֹא הַמַּחְתָּה גַּחֲלֵי אֵשׁ
  choice: आग के अंगारों से भरा हुआ धूपदान
  rationale: ‘धूपदान की भरपूरी’ का स्वाभाविक हिंदी रूप है और पात्र तथा उसकी पूर्ण मात्रा दोनों को स्पष्ट रखता है।
- source_word: מֵעַל הַמִּזְבֵּחַ מִלִּפְנֵי יְהוָה
  choice: याहवे के सामने की वेदी पर से
  rationale: मֵעַל का स्थानिक भाव ‘पर से’ द्वारा सुरक्षित है और מִלִּפְנֵי יְהוָה वेदी की स्थिति बताता है।
- source_word: יְהוָה
  choice: याहवे
  rationale: इब्रानी व्यक्तिगत नाम का आधुनिक हिंदी लिप्यंतरण किया गया है; इसे किसी उपाधि से नहीं बदला गया।
- source_word: וּמְלֹא חָפְנָיו
  choice: अपनी दोनों हथेलियों में … भरकर
  rationale: द्विवचन रूप दोनों हथेलियों को सूचित करता है; यह हिंदी में मात्रा और क्रिया को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: קְטֹרֶת סַמִּים דַּקָּה
  choice: बारीक पीसा हुआ सुगंधित धूप
  rationale: सुगंधित पदार्थों से बने धूप और उसके बारीक कूटे या पीसे होने—दोनों बातों को व्यक्त करता है।
- source_word: וְהֵבִיא מִבֵּית לַפָּרֹכֶת
  choice: उन्हें पर्दे के भीतर ले जाए
  rationale: हिफ़ील क्रिया भीतर ले जाने की गति बताती है; बहुवचन ‘उन्हें’ धूपदान और धूप दोनों को ग्रहण करता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चार अक्षरों वाला व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसका प्रचलित विद्वत्तापूर्ण लिप्यंतरण है और नाम को उपाधि में नहीं बदलता।
- issue: पर्दे के सापेक्ष गति
  choice: पर्दे के भीतर ले जाए
  alternative: पर्दे के अंदरूनी भाग में ले जाए
  rationale: संदर्भ महापवित्र स्थान में प्रवेश का है, पर इब्रानी पदबंध संक्षिप्त और असामान्य है; मुख्य पाठ स्वाभाविक स्थानिक अर्थ देता है और पादटिप्पणी उसकी अभिव्यक्ति स्पष्ट करती है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और अनुष्ठान-संबंधी निर्देश के अनुरूप रखी गई है। ‘धूपदान’, ‘वेदी’ और ‘पर्दा’ जैसे परिचित धार्मिक शब्द बनाए गए हैं; वाक्य-विन्यास सामान्य हिंदी पाठक के लिए सहज रखा गया है।
