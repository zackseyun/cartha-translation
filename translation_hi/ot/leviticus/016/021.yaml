  text: וְ/סָמַ֨ךְ אַהֲרֹ֜ן אֶת שְׁתֵּ֣י יד/ו עַ֨ל רֹ֣אשׁ הַ/שָּׂעִיר֮ הַ/חַי֒ וְ/הִתְוַדָּ֣ה עָלָ֗י/ו אֶת כָּל עֲוֺנֹת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל וְ/אֶת כָּל פִּשְׁעֵי/הֶ֖ם לְ/כָל חַטֹּאתָ֑/ם וְ/נָתַ֤ן אֹתָ/ם֙ עַל רֹ֣אשׁ הַ/שָּׂעִ֔יר וְ/שִׁלַּ֛ח בְּ/יַד אִ֥ישׁ עִתִּ֖י הַ/מִּדְבָּֽרָ/ה־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/021.yaml
  text: And Aaron shall lay both his hands on the head of the live goat[a], and confess over it all the iniquities of the sons of Israel, and all their transgressions, all their sins, and put them on the head of the goat[b], and send it away into the wilderness by the hand of a man appointed for the task.
translation:
  language: hi
  text: और हारून अपने दोनों हाथ जीवित बकरे के सिर पर रखेगा और उसके ऊपर इस्राएलियों[a] के सारे अधर्म, उनके सारे अपराध और उनके सारे पाप अंगीकार करेगा। वह उन्हें बकरे के सिर पर रखेगा और उस बकरे को इस काम के लिए नियुक्त व्यक्ति[b] के हाथ से जंगल में भेज देगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'शाब्दिक अर्थ: “इस्राएल के पुत्र।” यह पद पूरे इस्राएली समुदाय के लिए प्रयुक्त हुआ है।'
    reason: lexical_alternative
  - marker: b
    text: या “इस काम के लिए तैयार व्यक्ति।” यहाँ प्रयुक्त इब्रानी शब्द कठिन है और तैयारी, नियुक्ति या अवसर के अनुकूल होने का भाव दे सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְסָמַךְ
  choice: रखेगा
  rationale: बलिदान-संबंधी संदर्भ में यह हाथ रखने की विधिवत क्रिया है; हिंदी में ‘हाथ ... पर रखना’ स्वाभाविक और स्पष्ट है।
- source_word: שְׁתֵּי יָדוֹ
  choice: अपने दोनों हाथ
  rationale: द्विवचन का स्वाभाविक आधुनिक हिंदी रूप है और दोनों हाथों के प्रयोग को स्पष्ट रखता है।
- source_word: הַשָּׂעִיר הַחַי
  choice: जीवित बकरा
  rationale: यह प्रायश्चित-दिवस की विधि में जीवित छोड़े गए बकरे को पहचानता है।
- source_word: וְהִתְוַדָּה עָלָיו
  choice: उसके ऊपर ... अंगीकार करेगा
  rationale: עַל के अनुष्ठानिक स्थान-संबंध को रखते हुए ‘अंगीकार’ स्वीकारोक्ति की क्रिया को व्यक्त करता है।
- source_word: עֲוֺנֹת
  choice: अधर्म
  rationale: यह नैतिक टेढ़ेपन और दोष का भार व्यक्त करता है तथा अन्य दो पाप-संज्ञाओं से अलग रहता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएली
  rationale: शाब्दिक रूप ‘इस्राएल की संतान’ है, पर सामूहिक संदर्भ में ‘इस्राएली’ आधुनिक हिंदी में अधिक स्वाभाविक है; शाब्दिक विकल्प पादटिप्पणी में दिया गया है।
- source_word: פִּשְׁעֵיהֶם
  choice: उनके सारे अपराध
  rationale: פֶּשַׁע सीमा-भंग, विद्रोह या अपराध का बोध देता है; ‘अपराध’ सुबोध है और त्रिपदी भेद बनाए रखता है।
- source_word: לְכָל חַטֹּאתָם
  choice: उनके सारे पाप
  rationale: यह सूची के तीसरे और समावेशी पद के रूप में स्वाभाविक हिंदी देता है; לְ की कठिनता को कृत्रिम ‘के अनुसार’ से नहीं बढ़ाया गया।
- source_word: וְנָתַן אֹתָם
  choice: वह उन्हें ... रखेगा
  rationale: बहुवचन सर्वनाम पहले गिनाए गए अधर्म, अपराध और पाप की ओर लौटता है और उनके अनुष्ठानिक आरोपण को मूर्त रूप में रखता है।
- source_word: וְשִׁלַּח
  choice: भेज देगा
  rationale: यह बकरे को दूर भेजने की क्रिया को व्यक्त करता है, केवल मुक्त कर देने को नहीं।
- source_word: בְּיַד אִישׁ עִתִּי
  choice: इस काम के लिए नियुक्त व्यक्ति के हाथ
  rationale: בְּיַד की ‘के हाथ’ एजेंसी को बनाए रखता है; कठिन עִתִּי को संदर्भानुसार नियुक्त व्यक्ति कहा गया है और विकल्प पादटिप्पणी में है।
- source_word: הַמִּדְבָּרָה
  choice: जंगल में
  rationale: दिशासूचक रूप उस निर्जन प्रदेश की ओर गति बताता है; बाइबलीय हिंदी में ‘जंगल’ व्यापक और सुबोध है।
theological_decisions:
- issue: तीन पाप-संबंधी इब्रानी शब्दों का अलग-अलग अनुवाद
  choice: अधर्म / अपराध / पाप
  alternative: दोष / विद्रोह / पाप
  rationale: तीनों निकटार्थी शब्द इस्राएल के दोष की पूर्णता पर बल देते हैं; अलग हिंदी शब्द इस संचयी प्रभाव और भेद को बनाए रखते हैं।
- issue: בְּנֵי יִשְׂרָאֵל का रूप
  choice: इस्राएली
  alternative: इस्राएल की संतान
  rationale: वाक्य में पूरा समुदाय अभिप्रेत है। मुख्य पाठ में स्वाभाविक सामूहिक पद चुना गया है, जबकि मूल की संतान-संबंधी अभिव्यक्ति पादटिप्पणी में सुरक्षित है।
- issue: पापों को बकरे के सिर पर रखने की भाषा
  choice: वह उन्हें बकरे के सिर पर रखेगा
  alternative: वह मानो उन्हें बकरे के सिर पर रखेगा
  rationale: मूल पाठ सीधी अनुष्ठानिक भाषा बोलता है; ‘मानो’ जोड़ना उसके कथन को अनावश्यक रूप से व्याख्यायित और कमजोर करता।
translation_notes:
  register: आधुनिक मानक हिंदी का गरिमापूर्ण, सार्वजनिक पाठ के योग्य रूप। अनुष्ठानिक क्रियाओं को ठोस रखा गया है, पर कठिन इब्रानी पदों पर अनावश्यक तकनीकी भाषा से बचा गया है।
