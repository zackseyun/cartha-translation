base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/028.yaml
  text: The one who burns them shall wash his clothes and bathe his body in water[b][a], and afterward he may come into the camp.
translation:
  language: hi
  text: उन्हें जलाने वाला व्यक्ति अपने कपड़े धोए और पानी से स्नान करे[a]; इसके बाद वह छावनी में आ सकता है[b]।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से, “अपने मांस को।” इस स्नान-संबंधी प्रयोग में आशय अपने शरीर को धोने से है।
    reason: lexical_alternative
  - marker: b
    text: या, “वह छावनी में आएगा।” इब्रानी क्रिया सामान्य भविष्य का अर्थ दे सकती है, पर यहाँ संभवतः शुद्धिकरण के बाद पुनः प्रवेश की अनुमति व्यक्त होती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וְהַשֹּׂרֵף
  choice: जो व्यक्ति ... जलाए
  rationale: निश्चित उपपद के साथ कृदंत यहाँ संज्ञा के रूप में उस व्यक्ति को सूचित करता है जो पिछले पद में बताए अवशेष जलाता है। यह हिंदी में स्वाभाविक है और विधिक भाव के अनुकूल है।
- source_word: אֹתָם
  choice: उन्हें
  rationale: यह कर्मवाचक सर्वनाम निकटवर्ती संदर्भ के बैल और बकरे, अथवा उनके अवशेषों, की ओर लौटता है।
- source_word: יְכַבֵּס בְּגָדָיו
  choice: अपने कपड़े धोए
  rationale: अपूर्ण क्रिया यहाँ अनुष्ठानिक विधान का निर्देश व्यक्त करती है; 'कपड़े' आधुनिक हिंदी में सहज है।
- source_word: וְרָחַץ אֶת־בְּשָׂרוֹ
  choice: अपने शरीर को ... नहाए
  rationale: शाब्दिक 'अपने मांस को धोए' के बजाय इस स्नान-संबंधी प्रयोग का आशय पूरा शरीर है। 'नहाए' कपड़े धोने और शरीर के स्नान में स्पष्ट भेद रखता है।
- source_word: בַּמָּיִם
  choice: पानी से
  rationale: हिंदी में शरीर नहाने के साधन के लिए 'पानी से' स्वाभाविक है; इब्रानी ב का अर्थ इस संदर्भ में माध्यम अथवा तत्व दोनों की छाया रख सकता है।
- source_word: וְאַחֲרֵי כֵן
  choice: इसके बाद
  rationale: यह शुद्धिकरण के कार्यों के बाद का क्रम स्पष्ट और सहज ढंग से व्यक्त करता है।
- source_word: יָבֹא אֶל־הַמַּחֲנֶה
  choice: वह छावनी में आ सकता है
  rationale: संदर्भ में धुलाई और स्नान के बाद पुनः प्रवेश की अनुमति का भाव संभावित है; 'छावनी में' אֶל के साथ गति और प्रवेश को व्यक्त करता है।
theological_decisions:
- issue: अंतिम उपवाक्य में अनुष्ठानिक शुद्धता और पुनः प्रवेश का भाव
  choice: वह छावनी में आ सकता है
  alternative: वह छावनी में आएगा
  rationale: प्रसंग अशुद्धता के बाद आवश्यक धुलाई और फिर पुनः प्रवेश से संबंधित है। अनुमतिसूचक अनुवाद इस अनुष्ठानिक क्रम को स्पष्ट करता है, जबकि इब्रानी अपूर्ण क्रिया का सामान्य भविष्यकालीन पाठ भी व्याकरणतः संभव है; उसे पादटिप्पणी में सुरक्षित रखा गया है।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और विधिक-अनुष्ठानिक स्वर रखा गया है। 'कपड़े' और 'शरीर' सामान्य पाठक के लिए स्पष्ट हैं; अंतिम क्रिया की वास्तविक अर्थगत अस्पष्टता पादटिप्पणी में सुरक्षित है।
