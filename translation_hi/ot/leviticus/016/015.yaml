id: LEV.16.15
reference: Leviticus 16:15
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/שָׁחַ֞ט אֶת שְׂעִ֤יר הַֽ/חַטָּאת֙ אֲשֶׁ֣ר לָ/עָ֔ם וְ/הֵבִיא֙ אֶת דָּמ֔/וֹ אֶל מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת וְ/עָשָׂ֣ה אֶת דָּמ֗/וֹ כַּ/אֲשֶׁ֤ר עָשָׂה֙ לְ/דַ֣ם הַ/פָּ֔ר וְ/הִזָּ֥ה אֹת֛/וֹ עַל הַ/כַּפֹּ֖רֶת וְ/לִ/פְנֵ֥י הַ/כַּפֹּֽרֶת־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/015.yaml
  text: Then he shall slaughter the goat of the sin offering that is for the people[a], and bring its blood inside the veil, and do with its blood as he did with the blood of the bull, and sprinkle it on the atonement cover and before the mercy seat.
translation:
  language: hi
  text: फिर वह लोगों के लिए पापबलि के उस बकरे का वध करे और उसका लहू परदे के भीतर ले जाए। वह उसके लहू के साथ वैसा ही करे जैसा उसने बैल के लहू के साथ किया था; वह उसे प्रायश्चित्त-आवरण[a] पर और प्रायश्चित्त-आवरण के सामने छिड़के।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, पारंपरिक रूप से, “दया का आसन।”
    reason: כַּפֹּרֶת के पारंपरिक अनुवाद को सुरक्षित रखने वाला शब्दार्थ-विकल्प।
lexical_decisions:
- source_word: וְשָׁחַט
  choice: फिर वह ... वध करे
  rationale: क्रिया अनुष्ठानिक रीति से पशु के वध को व्यक्त करती है। विधिक निर्देशों के क्रम में ‘फिर’ और आज्ञार्थक ‘करे’ स्वाभाविक हैं।
- source_word: שְׂעִיר הַחַטָּאת אֲשֶׁר לָעָם
  choice: लोगों के लिए पापबलि का वह बकरा
  rationale: यह बकरे को पापबलि के पशु के रूप में पहचानता है और स्पष्ट करता है कि यह बलि लोगों के लिए है, हारून के लिए चढ़ाए गए बैल से अलग।
- source_word: וְהֵבִיא אֶת־דָּמוֹ אֶל־מִבֵּית לַפָּרֹכֶת
  choice: उसका लहू परदे के भीतर ले जाए
  rationale: हिफ़ील रूप रक्त को भीतर ले जाने का भाव देता है; ‘परदे के भीतर’ भीतरी पवित्र स्थान की स्थानिक धारणा को सहज हिन्दी में बनाए रखता है।
- source_word: וְעָשָׂה אֶת־דָּמוֹ כַּאֲשֶׁר עָשָׂה לְדַם הַפָּר
  choice: उसके लहू के साथ वैसा ही करे जैसा उसने बैल के लहू के साथ किया था
  rationale: मूल का कथन कुछ संक्षिप्त है; अनुवाद उसी अनुष्ठानिक क्रिया को दोहराने का अर्थ स्पष्ट करता है, बिना क्रिया का अतिरिक्त विवरण जोड़े।
- source_word: וְהִזָּה אֹתוֹ
  choice: वह उसे ... छिड़के
  rationale: बलिदान-संबंधी प्रसंग में נזה के हिफ़ील का प्रचलित और स्पष्ट अनुवाद ‘छिड़कना’ है; सर्वनाम लहू की ओर संकेत करता है।
- source_word: עַל הַכַּפֹּרֶת וְלִפְנֵי הַכַּפֹּרֶת
  choice: प्रायश्चित्त-आवरण पर और प्रायश्चित्त-आवरण के सामने
  rationale: כַּפֹּרֶת वाचा के सन्दूक के स्वर्ण आवरण को दर्शाता है। ‘पर’ और ‘सामने’ मूल में दी गई दो अलग स्थानिक क्रियाओं को सुरक्षित रखते हैं।
theological_decisions:
- issue: כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित्त-आवरण
  alternative: दया का आसन
  rationale: ‘प्रायश्चित्त-आवरण’ वस्तु के आवरण होने और כפר मूल से उसके संबंध—दोनों को आधुनिक पाठक के लिए व्यक्त करता है। पारंपरिक ‘दया का आसन’ ऐतिहासिक रूप से महत्त्वपूर्ण है, पर मुख्य पाठ में वस्तु के स्वरूप को कम स्पष्ट करता है; इसलिए उसे पादटिप्पणी में रखा गया है।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘लहू’, ‘पापबलि’, ‘परदा’ और ‘प्रायश्चित्त’ जैसे बाइबलीय-अनुष्ठानिक शब्द प्रसंगानुकूल हैं; वाक्य को दो भागों में बाँटकर निर्देश का क्रम पठनीय बनाया गया है।
