source:
  edition: WLC
  text: וְ/נָשָׂ֨א הַ/שָּׂעִ֥יר עָלָ֛י/ו אֶת כָּל עֲוֺנֹתָ֖/ם אֶל אֶ֣רֶץ גְּזֵרָ֑ה וְ/שִׁלַּ֥ח אֶת הַ/שָּׂעִ֖יר בַּ/מִּדְבָּֽר־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/022.yaml
  text: The goat shall carry on itself all their iniquities to a cut-off land[a], and he shall send the goat away into the wilderness.
translation:
  language: hi
  text: वह बकरा उनके सारे अधर्म अपने ऊपर वहन करके अलग-थलग भूमि को जाएगा; और वह व्यक्ति उस बकरे को जंगल में छोड़ देगा।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְנָשָׂא
  choice: उठाए हुए ले जाएगा
  rationale: नָשָׂא का अर्थ उठाना, ढोना या वहन करना है। यह प्रयोग बकरे द्वारा अधर्म को अपने ऊपर लेकर दूर ले जाने की ठोस छवि बनाए रखता है और आधुनिक हिन्दी में स्वाभाविक है।
- source_word: הַשָּׂעִיר
  choice: बकरा
  rationale: שָׂעִיר यहाँ नर बकरे को दर्शाता है; हिन्दी में ‘बकरा’ लिंग और पशु दोनों को स्पष्ट रूप से व्यक्त करता है।
- source_word: עָלָיו
  choice: अपने ऊपर
  rationale: यह बकरे पर रखे गए अधर्म की छवि को स्पष्ट और स्वाभाविक हिन्दी में सुरक्षित रखता है।
- source_word: כָּל עֲוֺנֹתָם
  choice: उनके सारे अधर्म
  rationale: עָוֹן में नैतिक कुटिलता और दोष का भार है। ‘अधर्म’ इस गंभीरता को साधारण ‘पाप’ की अपेक्षा अधिक निकटता से व्यक्त करता है, जबकि प्रसंग में समुदाय के अपराधों का संकेत बना रहता है।
- source_word: אֶל אֶרֶץ גְּזֵרָה
  choice: एक अलग-थलग पड़े देश में
  rationale: גְּזֵרָה दुर्लभ और अर्थ की दृष्टि से अनिश्चित है, पर इसका मुख्य भाव कटा हुआ, पृथक या पहुँच से दूर स्थान प्रतीत होता है। ‘अलग-थलग पड़ा’ आधुनिक हिन्दी में इस पृथक्करण को स्वाभाविक ढंग से व्यक्त करता है; अन्य संभावनाएँ पादटिप्पणी में दी गई हैं।
- source_word: וְשִׁלַּח
  choice: छोड़ देगा
  rationale: שׁלח यहाँ बकरे को निर्जन प्रदेश में भेज देने या मुक्त छोड़ देने का भाव रखता है। ‘छोड़ देगा’ अनुष्ठानिक क्रिया को सहज हिन्दी में व्यक्त करता है।
- source_word: בַּמִּדְבָּר
  choice: निर्जन प्रदेश में
  rationale: מִדְבָּר बस्ती से बाहर के वन्य, उजाड़ या मरुस्थलीय क्षेत्र को दर्शाता है। ‘निर्जन प्रदेश’ हिन्दी में व्यापक भौगोलिक अर्थ बनाए रखता है और इसे केवल रेतीले रेगिस्तान तक सीमित नहीं करता।
theological_decisions:
- issue: बकरे द्वारा लोगों के अधर्म उठाने की अनुष्ठानिक छवि
  choice: यह ठोस भाषा रखी गई है कि बकरा उनके सारे अधर्म अपने ऊपर उठाए हुए ले जाता है।
  alternative: इसका व्याख्यात्मक रूप ‘उनके पाप दूर कर देगा’ किया जा सकता था।
  rationale: इब्रानी पाठ हस्तांतरण और निष्कासन की सजीव अनुष्ठानिक छवि देता है। ठोस भाषा बाद की किसी विशिष्ट प्रायश्चित-व्याख्या को आरोपित किए बिना पाठ के धर्मवैज्ञानिक तनाव को बनाए रखती है।
- issue: אֶרֶץ גְּזֵרָה का अनिश्चित अर्थ
  choice: मुख्य पाठ में ‘एक अलग-थलग पड़े देश’ रखा गया है।
  alternative: ‘कटे हुए देश,’ ‘दुर्गम देश,’ ‘एकांत देश,’ या ‘उजाड़ देश।’
  rationale: इस दुर्लभ पद का सटीक आशय निश्चित नहीं है। चुना हुआ रूप निवास और समुदाय से पृथक्करण का केंद्रीय भाव देता है, जबकि पादटिप्पणी वैध विकल्पों को सुरक्षित रखती है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘अपने ऊपर उठाए हुए ... ले जाएगा’ मूल की ठोस वहन-छवि को बचाता है। ‘देश’ אֶרֶץ के अनुरूप है, जबकि ‘अलग-थलग पड़ा’ दुर्लभ גְּזֵרָה का सुबोध किंतु अनिश्चितता-सचेत अनुवाद है।
