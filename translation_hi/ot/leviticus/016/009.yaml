source:
  edition: WLC
  text: וְ/הִקְרִ֤יב אַהֲרֹן֙ אֶת הַ/שָּׂעִ֔יר אֲשֶׁ֨ר עָלָ֥ה עָלָ֛י/ו הַ/גּוֹרָ֖ל לַ/יהוָ֑ה וְ/עָשָׂ֖/הוּ חַטָּֽאת־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/009.yaml
  text: Then Aaron shall present the goat on which the lot for Yahweh fell[a], and make it a sin offering.
translation:
  language: hi
  text: फिर हारून उस बकरे को, जिस पर यहोवा के लिए चिट्ठी पड़ी थी, प्रस्तुत करे और उसे पापबलि के रूप में चढ़ाए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: सामने लाए
  rationale: बलिदान-संबंधी प्रसंग में הקריב का अर्थ किसी पशु को विधिपूर्वक निकट लाना या प्रस्तुत करना है। ‘सामने लाए’ स्वाभाविक हिन्दी में यह भाव रखता है और अगले खंड से पहले ही बलि चढ़ाने की क्रिया को पूरा मान लेने से बचता है।
- source_word: הַשָּׂעִיר
  choice: उस बकरे को
  rationale: שׂעיר यहाँ नर बकरे को सूचित करता है; हिन्दी में ‘बकरा’ लिंग को स्पष्ट और सहज रूप से व्यक्त करता है।
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: जिस पर ... चिट्ठी निकली थी
  rationale: यह इब्रानी मुहावरा चिट्ठी द्वारा हुए निर्धारण को बताता है। ‘जिस पर चिट्ठी निकली’ हिन्दी में प्रचलित और प्रसंगानुकूल अभिव्यक्ति है; वैकल्पिक अधिक शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ designation दर्शाता है—यह बकरा यहोवा के लिए ठहराया गया। יהוה को उसके व्यक्तिगत वाचा-नाम ‘यहोवा’ से व्यक्त किया गया है।
- source_word: וְעָשָׂהוּ חַטָּאת
  choice: और उसे पापबलि के रूप में चढ़ाए
  rationale: बलिदान-विधि में חטאת पापबलि को दर्शाता है। עשהו के साथ यह वाक्यांश उस बकरे को पापबलि के रूप में विधिपूर्वक अर्पित करने का अर्थ देता है; ‘चढ़ाए’ हिन्दी में अनुष्ठानिक क्रिया को स्पष्ट करता है।
theological_decisions:
- issue: ईश्वरीय नाम יהוה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल पाठ में चार-अक्षरी व्यक्तिगत वाचा-नाम יהוה सीधे आया है। ‘यहोवा’ आधुनिक हिन्दी बाइबलीय प्रयोग में व्यापक रूप से पहचाना जाता है और इसे केवल उपाधि ‘प्रभु’ से बदलता नहीं; ‘याहवे’ संभावित उच्चारण का निकटतर लिप्यंतरण है।
translation_notes:
  register: भाषा आधुनिक, सहज और गरिमापूर्ण रखी गई है। ‘सामने लाए’ और ‘पापबलि के रूप में चढ़ाए’ के बीच मूल पाठ की प्रस्तुत करने और फिर बलिदान ठहराने की क्रमिकता बनाए रखी गई है।
