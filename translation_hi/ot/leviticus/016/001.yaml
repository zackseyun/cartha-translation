  text: וַ/יְדַבֵּ֤ר יְהוָה֙ אֶל מֹשֶׁ֔ה אַחֲרֵ֣י מ֔וֹת שְׁנֵ֖י בְּנֵ֣י אַהֲרֹ֑ן בְּ/קָרְבָתָ֥/ם לִ/פְנֵי יְהוָ֖ה וַ/יָּמֻֽתוּ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/001.yaml
  text: And Yahweh spoke to Moses after the death of Aaron’s two sons[a], when they came near before Yahweh and died.
translation:
  language: hi
  text: हारून के दो पुत्रों की मृत्यु के बाद[a]—जब वे याहवे के सामने आए और मर गए—याहवे ने मूसा से कहा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'या, अधिक शाब्दिक रूप से: “याहवे के सामने उनके निकट आने पर।”'
    reason: lexical_alternative
lexical_decisions:
- source_word: וַיְדַבֵּר
  choice: ने ... कहा
  rationale: इस प्रचलित ईश्वरीय वाणी-सूत्र के लिए आधुनिक हिंदी में ‘कहा’ स्वाभाविक है और बोलने की क्रिया को स्पष्ट रखता है।
- source_word: יְהוָה
  choice: यहोवा
  rationale: इब्रानी चतुरक्षरीय व्यक्तिगत नाम को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से प्रस्तुत किया गया है, किसी उपाधि से नहीं बदला गया।
- source_word: אַחֲרֵי מוֹת
  choice: की मृत्यु के बाद
  rationale: रचना का स्वाभाविक हिंदी अर्थ यही है; एकवचन ‘मृत्यु’ दोनों पुत्रों की मृत्यु की घटना को सामूहिक रूप से व्यक्त करता है।
- source_word: שְׁנֵי בְּנֵי אַהֲרֹן
  choice: हारून के दो पुत्रों
  rationale: यह संबंध और संख्या दोनों को सीधे तथा स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: בְּקָרְבָתָם
  choice: जब वे ... निकट आए
  rationale: בְּ के साथ infinitive construct यहाँ समयसूचक है; ‘जब’ उस संबंध को स्पष्ट करता है और ‘निकट आए’ קרב के स्थानिक तथा उपासना-संबंधी आयाम को खुला रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: यहोवा के सामने
  rationale: यह पदबंध स्थानिक और उपस्थिति-संबंधी दोनों अर्थों के लिए पारदर्शी है।
- source_word: וַיָּמֻתוּ
  choice: और मर गए
  rationale: यह कथात्मक क्रम और इब्रानी की संक्षिप्त, कठोर अभिव्यक्ति को बनाए रखता है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: यहोवा
  alternative: याहवे
  rationale: मूल में व्यक्तिगत वाचा-नाम सीधे आया है। हिंदी पाठकों के लिए स्थापित लिप्यंतरण ‘यहोवा’ रखा गया है; इसे ‘प्रभु’ जैसी उपाधि से प्रतिस्थापित नहीं किया गया।
- issue: पुत्रों की मृत्यु और निकट आने के बीच संबंध
  choice: ‘जब ... निकट आए और मर गए’
  alternative: ‘निकट आने के कारण मर गए’
  rationale: इब्रानी पाठ समय और घटनाक्रम बताता है, पर यहाँ कारणसूचक संयोजक स्पष्ट रूप से नहीं देता; इसलिए कारण को अनुवाद में जोड़ा नहीं गया।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। वाक्य के बीच डैश से लंबी कालसूचक सूचना अलग की गई है, जिससे मुख्य वाक्य ‘यहोवा ने मूसा से कहा’ सहज पढ़ा जाता है।
