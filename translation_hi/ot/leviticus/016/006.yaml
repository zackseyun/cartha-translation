id: LEV.16.6
reference: Leviticus 16:6
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/הִקְרִ֧יב אַהֲרֹ֛ן אֶת פַּ֥ר הַ/חַטָּ֖את אֲשֶׁר ל֑/וֹ וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד בֵּיתֽ/וֹ־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/006.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household.
translation:
  language: hi
  text: हारून अपने लिए ठहराए गए पापबलि के बैल को प्रस्तुत करे[a] और अपने तथा अपने घराने के लिए प्रायश्चित करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने लिए ठहराए गए शुद्धिकरण-बलि के बैल को प्रस्तुत करे।” इब्रानी शब्द חַטָּאת पापबलि को सूचित कर सकता है और कुछ प्रसंगों में अनुष्ठानिक शुद्धिकरण पर बल देता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: प्रस्तुत करे
  rationale: बलिदान-संबंधी प्रसंग में यह क्रिया किसी भेंट को निकट लाने या विधिवत सामने प्रस्तुत करने का अर्थ देती है। ‘प्रस्तुत करे’ स्वाभाविक है और अभी से बलिदान की पूरी क्रिया संपन्न मान लेने से बचता है।
- source_word: פַּר
  choice: बैल
  rationale: פַּר का सामान्य अर्थ बैल है; आधुनिक हिन्दी में यही स्पष्ट और सहज शब्द है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: इस बलिदान-विधान में חַטָּאת अमूर्त ‘पाप’ नहीं, बल्कि एक विशिष्ट बलि का नाम है। ‘पापबलि’ प्रचलित और संक्षिप्त है; शुद्धिकरण पर बल देने वाला वैकल्पिक अर्थ पादटिप्पणी में रखा गया है।
- source_word: אֲשֶׁר לוֹ
  choice: अपने लिए ठहराए गए
  rationale: यह वाक्यांश बैल को हारून की ओर से उसके अपने लिए निर्धारित बलि के रूप में पहचानता है, न कि केवल उसकी संपत्ति के रूप में।
- source_word: וְכִפֶּר
  choice: प्रायश्चित करे
  rationale: याजकीय बलिदान-विधान में כפר के धार्मिक और अनुष्ठानिक अर्थ को ‘प्रायश्चित करे’ स्पष्ट तथा गरिमापूर्ण ढंग से व्यक्त करता है।
- source_word: בַּעֲדוֹ
  choice: अपने लिए
  rationale: בְּעַד यहाँ किसी की ओर से अथवा उसके हित में किए गए कार्य को दर्शाता है; ‘अपने लिए’ सहज हिन्दी है।
- source_word: וּבְעַד בֵּיתוֹ
  choice: अपने घराने के लिए
  rationale: בַּיִת यहाँ भवन नहीं, परिवार या गृहस्थ समुदाय को सूचित करता है। ‘घराना’ इस सामूहिक अर्थ को स्वाभाविक हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: बलिदान-विधान में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: तात्कालिक प्रसंग एक विशिष्ट बलि की विधि है। ‘पापबलि’ परिचित पद है, परन्तु इस बलि के शुद्धिकरण-संबंधी पक्ष को मिटाया नहीं गया; उसे पादटिप्पणी में वैकल्पिक अनुवाद के रूप में सुरक्षित रखा गया है।
- issue: בֵּיתוֹ का दायरा
  choice: उसका घराना
  alternative: उसका घर
  rationale: यहाँ आशय भवन से अधिक हारून के परिवार या गृहस्थ समुदाय से है। ‘घराना’ उस प्रतिनिधिक सामूहिक अर्थ को बिना अतिरिक्त धर्मसिद्धान्त जोड़े व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, निर्देशात्मक और गरिमापूर्ण शैली रखी गई है। ‘पापबलि’, ‘प्रायश्चित’ और ‘घराना’ जैसे पद सामान्य पाठक के लिए बोधगम्य रहते हुए याजकीय प्रसंग की विशिष्टता बनाए रखते हैं।
