base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/027.yaml
  text: And the bull for the sin offering and the goat for the sin offering, whose blood was brought in to make atonement in the sanctuary, he shall bring out to outside the camp, and they shall burn their hides, their flesh, and their dung in the fire.
translation:
  language: hi
  text: और पापबलि के बैल और पापबलि के बकरे को, जिनका लहू पवित्रस्थान में प्रायश्चित करने के लिए भीतर लाया गया था, वह छावनी के बाहर ले जाए; और वे उनकी खालें, उनका मांस और उनका मल आग में जला दें।[a]
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: हिब्रू में यहाँ एकवचन ‘वह ... ले जाए’ से बहुवचन ‘वे ... जला दें’ में परिवर्तन होता है।
    reason: source_structure
lexical_decisions:
- source_word: פַּר הַחַטָּאת
  choice: पापबलि का बैल
  rationale: हिब्रू में बलिदान की श्रेणी और पशु का संबंध है; प्रचलित और संक्षिप्त हिन्दी धार्मिक शब्दावली में ‘पापबलि का बैल’ स्वाभाविक है।
- source_word: שְׂעִיר הַחַטָּאת
  choice: पापबलि का बकरा
  rationale: पूर्ववर्ती पदबंध के समानांतर बलिदान की श्रेणी को स्पष्ट रखता है।
- source_word: הוּבָא אֶת דָּמָם
  choice: जिनका लहू ... भीतर लाया गया था
  rationale: निष्क्रिय क्रिया और पवित्र क्षेत्र की ओर गति दोनों व्यक्त होती हैं; ‘भीतर’ प्रसंग में निहित दिशात्मक अर्थ स्पष्ट करता है।
- source_word: לְכַפֵּר
  choice: प्रायश्चित करने के लिए
  rationale: बलिदानी संदर्भ में כפר का स्थापित, व्यापक हिन्दी प्रतिशब्द है और क्रिया के धार्मिक प्रयोजन को बिना संकीर्ण व्याख्या के बनाए रखता है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: यहाँ शब्द अमूर्त पवित्रता नहीं, पवित्र परिसर/स्थान को सूचित करता है; संयुक्त रूप हिन्दी बाइबलीय प्रयोग में परिचित है।
- source_word: יוֹצִיא אֶל מִחוּץ לַמַּחֲנֶה
  choice: वह छावनी के बाहर ले जाए
  rationale: हिफ़ील का कारणार्थक और बाहर की ओर दिशात्मक भाव स्वाभाविक हिन्दी में व्यक्त होता है; दोनों पशुओं के लिए ‘को’ मुख्य वाक्य में रखा गया है।
- source_word: וְשָׂרְפוּ בָאֵשׁ
  choice: और वे ... आग में जला दें
  rationale: हिब्रू के बहुवचन कर्ता को बनाए रखता है और हिन्दी में पूर्ण दहन के आदेश को स्वाभाविक ढंग से व्यक्त करता है।
- source_word: עֹרֹתָם
  choice: उनकी खालें
  rationale: पशुओं के बाहरी आवरण के लिए आधुनिक हिन्दी का सटीक और सहज शब्द।
- source_word: בְּשָׂרָם
  choice: उनका मांस
  rationale: बलि-पशुओं के शारीरिक ऊतक के लिए स्पष्ट और सामान्य हिन्दी शब्द।
- source_word: פִּרְשָׁם
  choice: उनका गोबर
  rationale: शब्द मल/विष्ठा को सूचित करता है; पशुओं के संदर्भ में ‘गोबर’ सटीक और सामान्य हिन्दी है।
theological_decisions:
- issue: חטאת और כפר की बलिदानी शब्दावली
  choice: ‘पापबलि’ और ‘प्रायश्चित करना’
  alternative: ‘शुद्धिकरण-बलि’ और ‘शुद्ध करना’
  rationale: पारंपरिक अर्थ और अनुष्ठानिक कार्य दोनों को पहचानने योग्य भाषा में रखा गया है, पर पद में निहित अर्थ को किसी एक आधुनिक व्याख्यात्मक सिद्धांत तक सीमित नहीं किया गया।
- issue: एकवचन יוֹצִיא से बहुवचन וְשָׂרְפוּ में परिवर्तन
  choice: ‘वह ... ले जाए; और वे ... जला दें’
  alternative: ‘वे ... ले जाएँ और ... जला दें’ अथवा ‘वह ... ले जाए और जला दे’
  rationale: मूल पाठ के वचन-परिवर्तन को सुरक्षित रखा गया है; यह प्रधान अनुष्ठानकर्ता और सहायता करने वालों में भेद का संकेत हो सकता है, पर अनुवाद इसे निर्णायक रूप से नहीं समझाता।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज अनुष्ठानिक शैली। ‘पापबलि’, ‘पवित्रस्थान’ और ‘प्रायश्चित’ जैसे परिचित बाइबलीय शब्द रखे गए हैं। मूल के एकवचन से बहुवचन में परिवर्तन को जानबूझकर सुरक्षित रखा गया है।
