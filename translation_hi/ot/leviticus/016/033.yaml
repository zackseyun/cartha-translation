id: LEV.16.33
reference: Leviticus 16:33
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כִפֶּר֙ אֶת מִקְדַּ֣שׁ הַ/קֹּ֔דֶשׁ וְ/אֶת אֹ֧הֶל מוֹעֵ֛ד וְ/אֶת הַ/מִּזְבֵּ֖חַ יְכַפֵּ֑ר וְ/עַ֧ל הַ/כֹּהֲנִ֛ים וְ/עַל כָּל עַ֥ם הַ/קָּהָ֖ל יְכַפֵּֽר־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/033.yaml
  text: Thus he shall make atonement for the Holy Sanctuary[a], and for the Tent of Meeting, and for the altar[b]; and he shall make atonement for the priests and for all the people of the assembly.
translation:
  language: hi
  text: इस प्रकार वह पवित्रस्थान के लिए प्रायश्चित[a] करेगा, और मिलापवाले तंबू तथा वेदी के लिए भी प्रायश्चित करेगा। वह याजकों और सभा[b] के सभी लोगों के लिए भी प्रायश्चित करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इस बलिदान-विधि के संदर्भ में इब्रानी क्रिया का अर्थ ‘दोष या अशुद्धता दूर करना’ भी हो सकता है।
    reason: lexical_alternative
  - marker: b
    text: ‘सभा’ का अनुवाद ‘मंडली’ भी किया जा सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר / יְכַפֵּר
  choice: प्रायश्चित करेगा
  rationale: כפר का यहाँ बलिदान-विधि से जुड़ा तकनीकी अर्थ है। ‘प्रायश्चित करना’ पवित्र वस्तुओं और व्यक्तियों—दोनों के संबंध में प्रयुक्त मूल क्रिया की पुनरावृत्ति और उसके व्यापक धार्मिक अर्थ को बनाए रखता है।
- source_word: מִקְדַּשׁ הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: यह पवित्र धाम या पवित्रस्थान को सूचित करता है। संदर्भ से अधिक विशिष्ट ‘परमपवित्र स्थान’ कहने के बजाय ‘पवित्रस्थान’ मूल की अभिव्यक्ति को स्वाभाविक हिंदी में सुरक्षित रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह प्रचलित, बोधगम्य पद है जो उस तंबू के मिलन-स्थल होने के भाव को व्यक्त करता है।
- source_word: הַמִּזְבֵּחַ
  choice: वेदी
  rationale: बलिदान-संबंधी संदर्भ में यह स्वाभाविक और स्थापित हिंदी पद है।
- source_word: הַכֹּהֲנִים
  choice: याजक
  rationale: यह धार्मिक सेवा करनेवाले पुरोहितों के लिए स्थापित बाइबलीय हिंदी शब्द है।
- source_word: כָּל עַם הַקָּהָל
  choice: सभा के सभी लोग
  rationale: यह केवल ‘सब लोग’ कहने के बजाय मूल में व्यक्त संगठित समुदाय के सामूहिक भाव को बनाए रखता है।
theological_decisions:
- issue: पवित्र वस्तुओं और व्यक्तियों—दोनों के लिए כפר का प्रयोग
  choice: सभी के लिए एक ही अभिव्यक्ति ‘प्रायश्चित करेगा’ रखना
  alternative: पवित्रस्थान, तंबू और वेदी के लिए ‘शुद्ध करेगा’, पर व्यक्तियों के लिए ‘प्रायश्चित करेगा’ कहना
  rationale: इब्रानी पाठ एक ही क्रिया को दोहराकर पूरी विधि की एकता दिखाता है। समान हिंदी अभिव्यक्ति इस पुनरावृत्ति को बचाती है और शुद्धीकरण को प्रायश्चित से अलग क्रिया मानकर पाठ का अनावश्यक अर्थ-निर्धारण नहीं करती।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए बोधगम्य रखी गई है। ‘प्रायश्चित’ और ‘याजक’ जैसे स्थापित धार्मिक शब्द संदर्भ की तकनीकी प्रकृति के कारण बनाए गए हैं; वाक्य में मूल क्रिया की पुनरावृत्ति भी सुरक्षित है।
