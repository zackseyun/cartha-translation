  text: וְ/הִזָּ֨ה עָלָ֧י/ו מִן הַ/דָּ֛ם בְּ/אֶצְבָּע֖/וֹ שֶׁ֣בַע פְּעָמִ֑ים וְ/טִהֲר֣/וֹ וְ/קִדְּשׁ֔/וֹ מִ/טֻּמְאֹ֖ת בְּנֵ֥י יִשְׂרָאֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/019.yaml
  text: He shall sprinkle some of the blood on it with his finger seven times[c][b][a], and cleanse it and consecrate it from the uncleannesses of the sons of Israel.
translation:
  language: hi
  text: वह अपनी उँगली से उस पर लहू में से कुछ सात बार छिड़केगा और उसे इस्राएलियों की अशुद्धताओं से शुद्ध[a] करेगा और पवित्र[b] ठहराएगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या ‘अनुष्ठानिक रूप से शुद्ध करेगा’। हिब्रू क्रिया किसी व्यक्ति या वस्तु को याजकीय अर्थ में शुद्ध करने के लिए प्रयुक्त होती है।
    reason: lexical_alternative
  - marker: b
    text: या ‘पवित्र करेगा’ अथवा ‘पवित्र उपयोग के लिए अलग करेगा’।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִזָּה
  choice: छिड़केगा
  rationale: नזה का हिफ़ील रूप याजकीय अनुष्ठान में लहू छिड़कने की क्रिया बताता है; ‘छिड़केगा’ स्वाभाविक और स्पष्ट है।
- source_word: עָלָיו
  choice: उस पर
  rationale: यह पिछले पद में उल्लिखित वेदी की ओर संकेत करता है और हिब्रू सर्वनाम की संदर्भगत अस्पष्टता को नहीं बढ़ाता।
- source_word: מִן־הַדָּם
  choice: कुछ लहू
  rationale: מִן यहाँ अंशवाचक है—उपलब्ध लहू में से कुछ लेकर छिड़का जाता है।
- source_word: בְּאֶצְבָּעוֹ
  choice: अपनी उँगली से
  rationale: करणवाचक בְּ का स्वाभाविक हिन्दी रूप ‘से’ है; संबंधवाचक ‘अपनी’ कर्ता से उँगली का संबंध स्पष्ट करता है।
- source_word: שֶׁבַע פְּעָמִים
  choice: सात बार
  rationale: अनुष्ठान की निश्चित संख्या को सीधे और ठीक रूप में रखता है।
- source_word: וְטִהֲרוֹ
  choice: उसे ... शुद्ध करके
  rationale: טהר याजकीय संदर्भ में किसी वस्तु को अनुष्ठानिक रूप से शुद्ध करने का मानक शब्द है।
- source_word: וְקִדְּשׁוֹ
  choice: पवित्र ठहराएगा
  rationale: קדש का आशय उसे पवित्र स्थिति में रखना अथवा पवित्र उपयोग के लिए अलग करना है; यह हिन्दी में गरिमापूर्ण और बोधगम्य है।
- source_word: מִטֻּמְאֹת
  choice: अशुद्धताओं से
  rationale: बहुवचन को बनाए रखते हुए याजकीय, अनुष्ठानिक अशुद्धि का भाव व्यक्त करता है।
- source_word: בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों
  rationale: यह प्रतिनिधिक सामूहिक पद है; आधुनिक हिन्दी में ‘इस्राएलियों’ उसका स्वाभाविक, समावेशी अर्थ देता है और केवल पुरुषों तक अर्थ को अनावश्यक रूप से सीमित नहीं करता।
theological_decisions:
- issue: वेदी के लिए शुद्धि और पवित्रीकरण की भाषा
  choice: वेदी को इस्राएलियों की अनुष्ठानिक अशुद्धताओं से शुद्ध करके पवित्र ठहराया जाता है।
  alternative: ‘उसे निर्मल करके उसका पवित्रीकरण करेगा’
  rationale: यहाँ नैतिक परिवर्तन नहीं, पवित्रस्थान की वस्तु पर याजकीय अनुष्ठान का प्रभाव वर्णित है; इसलिए अनुष्ठानिक भाव सुरक्षित रखा गया है।
- issue: בְּנֵי יִשְׂרָאֵל का सामूहिक अर्थ
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: हिब्रू अभिव्यक्ति पूरे इस्राएली समुदाय के लिए रूढ़ सामूहिक पद है। स्वाभाविक हिन्दी में ‘इस्राएलियों’ वही अर्थ स्पष्ट करती है, जबकि शाब्दिक विकल्प आधुनिक पाठक को केवल पुरुषों का संकेत दे सकता है।
translation_notes:
  register: आधुनिक मानक हिन्दी; शैली गरिमापूर्ण किंतु सहज है। ‘लहू’ बाइबलीय-याजकीय संदर्भ में प्रचलित और समझने योग्य है। वाक्य में ‘इस प्रकार’ जोड़कर दो क्रमिक क्रियाओं—छिड़कने और उसके परिणामस्वरूप शुद्ध-पवित्र करने—का संबंध स्वाभाविक हिन्दी में व्यक्त किया गया है।
