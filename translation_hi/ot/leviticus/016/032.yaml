  text: וְ/כִפֶּ֨ר הַ/כֹּהֵ֜ן אֲשֶׁר יִמְשַׁ֣ח אֹת֗/וֹ וַ/אֲשֶׁ֤ר יְמַלֵּא֙ אֶת יָד֔/וֹ לְ/כַהֵ֖ן תַּ֣חַת אָבִ֑י/ו וְ/לָבַ֛שׁ אֶת בִּגְדֵ֥י הַ/בָּ֖ד בִּגְדֵ֥י הַ/קֹּֽדֶשׁ־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/032.yaml
  text: And the priest who is anointed and whose hand is filled to serve as priest in place of his father shall make atonement[a], and he shall put on the linen garments, the holy garments.
translation:
  language: hi
  text: और वह याजक प्रायश्चित करे, जिसका अभिषेक किया गया हो और जिसे अपने पिता के स्थान पर याजक के रूप में सेवा करने के लिए नियुक्त किया गया हो[a]। वह सन के वस्त्र, अर्थात् पवित्र वस्त्र, पहने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी में शाब्दिक रूप से “जिसका हाथ भर दिया गया हो”; यह याजकीय सेवा के लिए विधिवत नियुक्त या प्रतिष्ठित किए जाने का मुहावरा है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְכִפֶּר
  choice: प्रायश्चित करे
  rationale: याजकीय अनुष्ठान के संदर्भ में כפר निर्धारित विधि के द्वारा प्रायश्चित किए जाने को व्यक्त करता है; यह अनुवाद क्रिया को स्पष्ट रखते हुए उसके साधन के विषय में अनावश्यक विस्तार नहीं करता।
- source_word: הַכֹּהֵן
  choice: वह याजक
  rationale: इब्रानी में पदनाम केवल ‘याजक’ है। संदर्भ प्रधान याजक के उत्तराधिकारी का है, पर मूल पाठ में न दिए गए पदनाम को जोड़ा नहीं गया।
- source_word: אֲשֶׁר יִמְשַׁח אֹתוֹ
  choice: जिसका अभिषेक किया गया हो
  rationale: यह संबंधवाचक उपवाक्य विधिवत अभिषिक्त याजक की पहचान कराता है; हिंदी में कर्मवाच्य स्वाभाविक है और इब्रानी अपूर्ण काल के सामान्य/भावी आशय को बनाए रखता है।
- source_word: וַאֲשֶׁר יְמַלֵּא אֶת יָדוֹ
  choice: जिसे ... नियुक्त किया गया हो
  rationale: ‘उसका हाथ भरना’ याजकीय पद पर विधिवत नियुक्त या प्रतिष्ठित करने का इब्रानी मुहावरा है। मुख्य पाठ में अर्थ स्पष्ट किया गया है और शाब्दिक रूप पादटिप्पणी में सुरक्षित है।
- source_word: לְכַהֵן
  choice: याजक के रूप में सेवा करने के लिए
  rationale: यह क्रियारूप याजकीय पद और सेवा को व्यक्त करता है; चुना हुआ वाक्यांश आधुनिक हिंदी में सहज है।
- source_word: תַּחַת אָבִיו
  choice: अपने पिता के स्थान पर
  rationale: यहाँ תחת पद में उत्तराधिकार और स्थान ग्रहण करने का अर्थ देता है।
- source_word: וְלָבַשׁ
  choice: वह ... पहने
  rationale: क्रिया स्वयं वस्त्र धारण करने की अनुष्ठानिक क्रिया बताती है; ‘पहने’ संक्षिप्त और स्वाभाविक हिंदी है।
- source_word: בִּגְדֵי הַבָּד
  choice: सन के वस्त्र
  rationale: याजकीय परिधान के संदर्भ में בד सन के कपड़े को दर्शाता है; ‘सन के वस्त्र’ स्पष्ट और प्रचलित बाइबलीय हिंदी है।
- source_word: בִּגְדֵי הַקֹּדֶשׁ
  choice: पवित्र वस्त्र
  rationale: यह समानाधिकरण में उन्हीं सन के वस्त्रों को पवित्र उपयोग के लिए अलग किए गए वस्त्र बताता है और קדשׁ से जुड़ा ‘पवित्र’ शब्द बनाए रखता है।
theological_decisions:
- issue: הַכֹּהֵן का अनुवाद ‘याजक’ किया जाए या संदर्भानुसार ‘प्रधान याजक’
  choice: याजक
  alternative: प्रधान याजक
  rationale: संदर्भ में प्रधान याजकीय उत्तराधिकारी अभिप्रेत है, किंतु इब्रानी पाठ स्वयं ‘याजक’ कहकर अभिषेक, नियुक्ति और पिता के स्थान पर सेवा के द्वारा उसकी पहचान कराता है। इसलिए मूल अभिव्यक्ति को रखा गया है।
- issue: ‘हाथ भरने’ के अभिषेक-संबंधी मुहावरे का प्रस्तुतीकरण
  choice: नियुक्त किया गया हो
  alternative: जिसका हाथ भरा गया हो; प्रतिष्ठित किया गया हो; अभिषिक्त किया गया हो
  rationale: शाब्दिक हिंदी सामान्य पाठक के लिए अस्पष्ट होगी। ‘नियुक्त’ पद ग्रहण करने का संस्थागत आशय स्पष्ट करता है, जबकि मूल मुहावरा पादटिप्पणी में दिया गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट रखी गई है। ‘अर्थात्’ से समानाधिकरण स्पष्ट होता है कि पवित्र वस्त्र कोई दूसरा परिधान-समूह नहीं, बल्कि वही सन के वस्त्र हैं।
