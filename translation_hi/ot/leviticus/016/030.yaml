reference: Leviticus 16:30
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: כִּֽי בַ/יּ֥וֹם הַ/זֶּ֛ה יְכַפֵּ֥ר עֲלֵי/כֶ֖ם לְ/טַהֵ֣ר אֶתְ/כֶ֑ם מִ/כֹּל֙ חַטֹּ֣אתֵי/כֶ֔ם לִ/פְנֵ֥י יְהוָ֖ה תִּטְהָֽרוּ־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/030.yaml
  text: For on this day atonement shall be made for you to cleanse you[b][a]; from all your sins before Yahweh you shall be clean.
translation:
  language: hi
  text: क्योंकि इस दिन तुम्हारे लिए प्रायश्चित किया जाएगा[a], तुम्हें शुद्ध करने के लिए; याहवे[b] के सामने तुम अपने सब पापों से शुद्ध हो जाओगे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “वह तुम्हारे लिए प्रायश्चित करेगा।” इब्रानी क्रिया एकवचन है, पर इस उपवाक्य में उसका कर्ता स्पष्ट रूप से नहीं बताया गया है।
    reason: lexical_alternative
  - marker: b
    text: 'इब्रानी: YHWH; परंपरागत रूप से “प्रभु,” और कभी-कभी “यहोवा” अनूदित।'
    reason: alternative_reading
lexical_decisions:
- source_word: כִּי
  choice: क्योंकि
  rationale: यह पिछले विधान का कारण या आधार बताता है; आधुनिक हिन्दी में ‘क्योंकि’ इस व्याख्यात्मक संबंध को स्वाभाविक रूप से व्यक्त करता है।
- source_word: בַיּוֹם הַזֶּה
  choice: इस दिन
  rationale: इब्रानी संकेतवाचक पदबंध का सीधा और प्रसंगानुकूल अनुवाद है।
- source_word: יְכַפֵּר עֲלֵיכֶם
  choice: तुम्हारे लिए प्रायश्चित किया जाएगा
  rationale: כפר का पिएल रूप यहाँ पवित्रस्थान और बलिदान से जुड़े प्रायश्चित को दर्शाता है। भाववाच्य हिन्दी में उस कर्ता को अनावश्यक रूप से निश्चित करने से बचाता है जिसे इस उपवाक्य में स्पष्ट नहीं किया गया।
- source_word: לְטַהֵר אֶתְכֶם
  choice: ताकि तुम्हें शुद्ध किया जाए
  rationale: लामेद सहित क्रियार्थक रूप प्रायश्चित का उद्देश्य अथवा परिणाम बताता है। ‘शुद्ध’ धार्मिक शुद्धीकरण का अर्थ रखते हुए सामान्य पाठक के लिए सहज है।
- source_word: מִכֹּל חַטֹּאתֵיכֶם
  choice: अपने सब पापों से
  rationale: חטאת के ‘पाप’ और ‘पापबलि’ दोनों अर्थ हो सकते हैं, पर लोगों को शुद्ध करने के इस वाक्य में उनके पाप अभिप्रेत हैं।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי उपस्थिति के भाव में ‘के सामने’ है, और יהוה को उसके व्यक्तिगत वाचा-नाम के रूप में ‘याहवे’ लिखा गया है।
- source_word: תִּטְהָרוּ
  choice: शुद्ध हो जाओगे
  rationale: काल रूप यहाँ शुद्ध किए जाने के फलस्वरूप प्राप्त अवस्था बताता है। यह पहले आए सकर्मक ‘शुद्ध किया जाए’ और परिणामी ‘शुद्ध हो जाओगे’ के बीच का भेद बनाए रखता है।
theological_decisions:
- issue: יְהוָה परमेश्वर के नाम का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में चतुरक्षरीय व्यक्तिगत नाम सीधे आया है। ‘याहवे’ उसे पदवी में बदलने के बजाय नाम के रूप में रखता है; पारंपरिक विकल्प पादटिप्पणी में दिया गया है।
- issue: כפר का धार्मिक अर्थ
  choice: प्रायश्चित किया जाएगा
  alternative: वह प्रायश्चित करेगा
  rationale: यह अनुवाद बलिदान-संबंधी शब्द का व्यापक अर्थ सुरक्षित रखता है और प्रायश्चित की किसी बाद की विशिष्ट धर्मवैज्ञानिक व्याख्या को पाठ में नहीं जोड़ता। साथ ही, अस्पष्ट कर्ता को मुख्य पाठ में निश्चित नहीं करता।
- issue: प्रायश्चित करने वाले का अस्पष्ट कर्ता
  choice: हिन्दी भाववाच्य
  alternative: वह तुम्हारे लिए प्रायश्चित करेगा
  rationale: इब्रानी क्रिया एकवचन है, पर इस उपवाक्य में कर्ता व्यक्त नहीं है। प्रसंग महायाजक की ओर संकेत कर सकता है, फिर भी मुख्य पाठ में उसे खुलकर जोड़ना स्रोत की अपेक्षा अधिक निश्चित होगा।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य हिन्दी पाठक के लिए सहज रखी गई है। ‘प्रायश्चित’ और ‘शुद्ध’ जैसे स्थापित धार्मिक शब्द मूल के अनुष्ठानिक स्वर को बनाए रखते हैं। अर्धविराम पद की दो परस्पर संबंधित बातों—प्रायश्चित द्वारा शुद्ध किए जाने और याहवे के सामने शुद्ध अवस्था—को स्पष्ट करता है।
