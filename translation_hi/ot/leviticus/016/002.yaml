review_pass:
  verdict: revise
  source_fidelity: Draft accurately preserves the divine name, the command to Moses, Aaron's restricted access behind the curtain, the ark and its cover, the death warning, and divine appearance in the cloud. However, ‘जब चाहे तब’ makes Aaron's personal desire explicit, whereas בְּכָל־עֵת more directly prohibits entry at any/unrestricted time. ‘किसी भी समय’ better retains the Hebrew wording and contextual restriction without adding that nuance.
  naturalness: The Hindi is generally clear and appropriately formal. ‘पवित्र स्थान’ is more natural in standard modern Hindi when written as two words, and ‘जो संदूक के ऊपर है’ avoids the slightly cumbersome ‘संदूक पर रखे ...’ construction while preserving the relation of the cover to the ark.
  terminology: ‘याहवे,’ ‘हारून,’ ‘प्रायश्चित-आवरण,’ and the footnoted traditional alternative ‘दया-आसन’ are appropriate. The rendering ‘प्रायश्चित-आवरण’ clearly denotes the concrete cover and its ritual association.
  issues:
  - severity: medium
    issue: ‘जब चाहे तब’ for בְּכָל־עֵת
    rationale: This wording can imply that the prohibition concerns Aaron's subjective whim. The Hebrew says ‘at any time,’ with the context supplying that unrestricted access is forbidden. ‘किसी भी समय’ is closer and preserves the source's formulation.
  - severity: low
    issue: ‘पवित्रस्थान’ and ‘संदूक पर रखे’
    rationale: These are understandable, but ‘पवित्र स्थान’ is standard modern orthography and ‘जो संदूक के ऊपर है’ is smoother Hindi for the relative description in the Hebrew.
  revised_text: याहवे ने मूसा से कहा, “अपने भाई हारून से कहो कि वह किसी भी समय पवित्र स्थान में, परदे के भीतर, उस प्रायश्चित-आवरण[a] के सामने न आए जो संदूक के ऊपर है, ताकि वह न मरे; क्योंकि मैं प्रायश्चित-आवरण के ऊपर बादल में प्रकट होऊँगा।”
