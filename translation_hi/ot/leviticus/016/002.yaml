id: LEV.16.2
reference: Leviticus 16:2
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וַ/יֹּ֨אמֶר יְהוָ֜ה אֶל מֹשֶׁ֗ה דַּבֵּר֮ אֶל אַהֲרֹ֣ן אָחִי/ךָ֒ וְ/אַל יָבֹ֤א בְ/כָל עֵת֙ אֶל הַ/קֹּ֔דֶשׁ מִ/בֵּ֖ית לַ/פָּרֹ֑כֶת אֶל פְּנֵ֨י הַ/כַּפֹּ֜רֶת אֲשֶׁ֤ר עַל הָ/אָרֹן֙ וְ/לֹ֣א יָמ֔וּת כִּ֚י בֶּֽ/עָנָ֔ן אֵרָאֶ֖ה עַל הַ/כַּפֹּֽרֶת־־־־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/002.yaml
  text: And Yahweh said to Moses[a], “Tell Aaron your brother that he must not come at just any time into the Holy Place, inside the veil, before the atonement cover that is on the ark, so that he may not die. For I will appear in the cloud over the atonement cover.”
translation:
  language: hi
  text: याहवे ने मूसा से कहा, “अपने भाई हारून से कहो कि वह किसी भी समय पवित्र स्थान में, परदे के भीतर, उस प्रायश्चित-आवरण[a] के सामने न आए जो संदूक के ऊपर है, ताकि वह न मरे; क्योंकि मैं प्रायश्चित-आवरण के ऊपर बादल में प्रकट होऊँगा।”
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: 'परंपरागत अनुवाद: “दया-आसन।”'
    reason: כַּפֹּרֶת के ऐतिहासिक रूप से प्रचलित वैकल्पिक अनुवाद को सुरक्षित रखना।
lexical_decisions:
- source_word: יְהוָה
  choice: याहवे
  rationale: परमेश्वर के व्यक्तिगत नाम को उपाधि से बदलने के बजाय देवनागरी में लिप्यंतरित किया गया है।
- source_word: דַּבֵּר אֶל אַהֲרֹן אָחִיךָ
  choice: अपने भाई हारून से कहो
  rationale: आज्ञा का बल और संबंध दोनों स्वाभाविक आधुनिक हिन्दी में स्पष्ट रहते हैं।
- source_word: וְאַל יָבֹא בְכָל עֵת
  choice: वह जब चाहे तब ... न आए
  rationale: यह वाक्यांश निरंतर आने की नहीं, मनमाने अथवा अनधिकृत समय पर प्रवेश करने की मनाही व्यक्त करता है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: संदर्भ में यह परदे के भीतर के पवित्र क्षेत्र को सूचित करता है; संक्षिप्त धार्मिक पद स्रोत की व्यापकता बनाए रखता है।
- source_word: מִבֵּית לַפָּרֹכֶת
  choice: परदे के भीतर
  rationale: यह परदे की अंदरूनी ओर स्थित स्थान को स्पष्ट और स्वाभाविक ढंग से बताता है।
- source_word: הַכַּפֹּרֶת
  choice: प्रायश्चित-आवरण
  rationale: यह संदूक के ठोस ऊपरी आवरण और प्रायश्चित-विधि से उसके संबंध—दोनों को व्यक्त करता है।
- source_word: הָאָרֹן
  choice: संदूक
  rationale: मूल पाठ में केवल ‘संदूक’ है; ‘वाचा का संदूक’ जोड़ना अनावश्यक विस्तार होता।
- source_word: וְלֹא יָמוּת
  choice: नहीं तो वह मर जाएगा
  rationale: निषेध की अवहेलना का घातक परिणाम आधुनिक हिन्दी में सीधे और स्पष्ट रूप से व्यक्त होता है।
- source_word: כִּי בֶעָנָן אֵרָאֶה
  choice: क्योंकि मैं ... बादल में प्रकट होऊँगा
  rationale: כִּי कारण प्रस्तुत करता है, और निफ़अल रूप ईश्वरीय प्रकटता को दर्शाता है; ‘बादल में’ मूल पूर्वसर्ग को सुरक्षित रखता है।
theological_decisions:
- issue: כַּפֹּרֶת का अनुवाद
  choice: प्रायश्चित-आवरण
  alternative: दया-आसन
  rationale: चुना गया पद वस्तु के संदूक पर रखे आवरण होने और प्रायश्चित-विधि में उसकी भूमिका दोनों को स्पष्ट करता है; पारंपरिक विकल्प को पादटिप्पणी में सुरक्षित रखा गया है।
- issue: בְּכָל עֵת का आशय
  choice: मनमाने समय पर प्रवेश की मनाही—‘जब चाहे तब’
  alternative: हर समय
  rationale: संदर्भ पूर्ण या निरंतर प्रवेश की नहीं, निर्धारित अवसर के बाहर अनधिकृत प्रवेश की मनाही करता है।
- issue: ईश्वरीय प्रकटता का काल
  choice: मैं ... प्रकट होऊँगा
  alternative: मैं ... प्रकट होता हूँ
  rationale: अपूर्ण क्रिया भविष्य अथवा सामान्य रीति दोनों की छाया रख सकती है; इस चेतावनी और आगामी विधि के संदर्भ में भविष्यकाल स्वाभाविक है, जबकि कथन की आवर्ती धार्मिक सार्थकता को नकारा नहीं गया है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जब चाहे तब’ से अनधिकृत प्रवेश का आशय स्वाभाविक रूप से खुलता है। ‘प्रायश्चित-आवरण’ धार्मिक अर्थ और ठोस वस्तु दोनों को संतुलित करता है।
