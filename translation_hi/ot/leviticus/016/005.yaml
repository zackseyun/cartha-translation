id: LEV.16.5
reference: Leviticus 16:5
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וּ/מֵ/אֵ֗ת עֲדַת֙ בְּנֵ֣י יִשְׂרָאֵ֔ל יִקַּ֛ח שְׁנֵֽי שְׂעִירֵ֥י עִזִּ֖ים לְ/חַטָּ֑את וְ/אַ֥יִל אֶחָ֖ד לְ/עֹלָֽה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/005.yaml
  text: And from the congregation of the sons of Israel he shall take two male goats for a sin offering and one ram for a burnt offering[a][b].
translation:
  language: hi
  text: और इस्राएलियों की मंडली से वह पापबलि[a] के लिए दो बकरे और होमबलि के लिए एक मेढ़ा ले।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या “शुद्धिकरण-बलि।” लैव्यव्यवस्था में इब्रानी शब्द חַטָּאת उस बलि को दर्शा सकता है जो पाप और विधिक अशुद्धता से निपटती है।
    reason: alternative_reading
lexical_decisions:
- source_word: וּמֵאֵת
  choice: और ... से
  rationale: संयोजक और स्रोत—दोनों अर्थों को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: עֲדַת בְּנֵי יִשְׂרָאֵל
  choice: इस्राएलियों की मंडली
  rationale: इब्रानी पदबंध का आशय इस्राएल के पूरे समुदाय से है; यह रूप आधुनिक हिन्दी में स्पष्ट है और सामुदायिक भाव बनाए रखता है।
- source_word: יִקַּח
  choice: वह ... ले
  rationale: अनुष्ठान-संबंधी विधान में प्रयुक्त निर्देशात्मक अपूर्ण क्रिया को हिन्दी के स्वाभाविक विधिसूचक रूप में व्यक्त किया गया है।
- source_word: שְׁנֵי שְׂעִירֵי עִזִּים
  choice: दो बकरे
  rationale: संख्या और पशुओं के नर होने की विशिष्टता दोनों सुरक्षित रहती हैं।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: लैव्यव्यवस्था के बलिदानी संदर्भ में यह मान्य और सहज पद है; शुद्धिकरण-संबंधी अर्थ को पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַיִל אֶחָד
  choice: और ... एक मेढ़ा
  rationale: पशु का प्रकार और एक होने का संख्यात्मक बल दोनों स्पष्ट हैं।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: समूची वेदी पर जलाई जाने वाली עֹלָה के लिए प्रचलित, संक्षिप्त और संदर्भानुकूल हिन्दी पद।
theological_decisions:
- issue: בְּנֵי יִשְׂרָאֵל का सामुदायिक आशय
  choice: इस्राएलियों
  alternative: इस्राएल के पुत्रों
  rationale: शाब्दिक रूप 'इस्राएल के पुत्रों' है, पर इस विधिक संदर्भ में पदबंध पूरे इस्राएली समुदाय का बोध कराता है; 'इस्राएलियों' से आशय बिना अनावश्यक लैंगिक संकुचन के स्पष्ट होता है।
- issue: חַטָּאת का बलिदानी अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: यह पद पाप से निपटने वाली बलि का पारंपरिक और समझने योग्य नाम है, जबकि लैव्यव्यवस्था में उसके शुद्धिकरण-संबंधी कार्य को पादटिप्पणी में स्पष्ट किया गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में संक्षिप्त, गरिमापूर्ण विधिक-अनुष्ठानिक शैली। 'मंडली', 'पापबलि' और 'होमबलि' जैसे परिचित बाइबलीय पद रखे गए हैं; वाक्य-विन्यास को सहज हिन्दी बनाया गया है।
