  yaml_path: translation/ot/leviticus/016/025.yaml
  text: And he shall burn the fat of the sin offering on the altar[a].
translation:
  language: hi
  text: और वह पापबलि[a] की चर्बी वेदी पर जलाए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “शुद्धिकरण-बलि।” हिब्रू शब्द पाप या अशुद्धता से शुद्धिकरण के लिए चढ़ाई जाने वाली बलि को भी सूचित कर सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְאֵת
  choice: और
  rationale: וְ पिछले अनुष्ठानिक कार्य से इस क्रिया को जोड़ता है; אֵת कर्म-चिह्न है और हिंदी में अलग से व्यक्त नहीं होता।
- source_word: חֵלֶב
  choice: चर्बी
  rationale: यह बलि के लिए निर्धारित पशु-चर्बी को सूचित करता है। मूल पाठ में अलग-अलग भागों का स्पष्ट उल्लेख नहीं है, इसलिए केवल ‘चर्बी’ रखा गया है।
- source_word: הַחַטָּאת
  choice: पापबलि
  rationale: बलि-विधान में यह शब्द सामान्यतः पाप से संबंधित बलि का नाम है। ‘शुद्धिकरण-बलि’ इसकी अनुष्ठानिक भूमिका को उभारने वाला वास्तविक विकल्प है, जिसे पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: יַקְטִיר
  choice: जलाए
  rationale: קטר का हिफ़ील रूप यहाँ वेदी पर बलि की वस्तु जलाने, अर्थात धुएँ में चढ़ाने, की क्रिया बताता है। ‘जलाए’ आधुनिक हिंदी में स्वाभाविक और संदर्भानुकूल है।
- source_word: הַמִּזְבֵּחָה
  choice: वेदी पर
  rationale: दिशासूचक प्रत्यय का शाब्दिक अर्थ ‘वेदी की ओर’ हो सकता है, किंतु बलि जलाने के संदर्भ में हिंदी का स्वाभाविक स्थानवाचक प्रयोग ‘वेदी पर’ है।
theological_decisions:
- issue: बलि-विधान में חַטָּאת का अनुवाद
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: हिब्रू शब्द पाप तथा पाप या अशुद्धता से शुद्धिकरण के लिए प्रयुक्त बलि—दोनों से जुड़ा है। मुख्य पाठ में परिचित और संक्षिप्त ‘पापबलि’ रखा गया है, जबकि महत्वपूर्ण अनुष्ठानिक विकल्प पादटिप्पणी में दिया गया है।
translation_notes:
  register: आधुनिक मानक हिंदी; संक्षिप्त, गरिमापूर्ण और विधिक-अनुष्ठानिक शैली। ‘वह’ का संदर्भ पिछले पदों में उल्लिखित याजक से है।
