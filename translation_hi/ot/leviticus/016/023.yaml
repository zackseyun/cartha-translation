source:
  edition: WLC
  text: וּ/בָ֤א אַהֲרֹן֙ אֶל אֹ֣הֶל מוֹעֵ֔ד וּ/פָשַׁט֙ אֶת בִּגְדֵ֣י הַ/בָּ֔ד אֲשֶׁ֥ר לָבַ֖שׁ בְּ/בֹא֣/וֹ אֶל הַ/קֹּ֑דֶשׁ וְ/הִנִּיחָ֖/ם שָֽׁם־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/023.yaml
  text: Then Aaron shall come into the tent of meeting and take off the linen garments that he put on when he went into the holy place[a], and he shall leave them there.
translation:
  language: hi
  text: तब हारून मिलाप के तंबू में आए और उन सन के वस्त्रों को उतार दे, जिन्हें उसने पवित्र स्थान में प्रवेश करते समय पहने थे, और वह उन्हें वहीं छोड़ दे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וּבָא
  choice: तब ... आए
  rationale: अनुष्ठान-संबंधी निर्देशों के क्रम में वाव + पूर्ण क्रिया अगले चरण को व्यक्त करती है; हिंदी में आदरसूचक आज्ञार्थक/विध्यर्थक रूप ‘आए’ इस प्रक्रियात्मक भाव को स्वाभाविक रूप से रखता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: यह इस्राएली उपासना-स्थान का प्रचलित हिंदी पद है और सभा अथवा भेंट के लिए नियत तंबू का बोध कराता है।
- source_word: וּפָשַׁט
  choice: उतार दे
  rationale: कपड़े हटाने के लिए यह सहज आधुनिक हिंदी अभिव्यक्ति है और क्रिया के निर्देशात्मक क्रम को स्पष्ट रखती है।
- source_word: בִּגְדֵי הַבָּד
  choice: सन के वस्त्र
  rationale: בגד को ‘वस्त्र’ और בד को अनुष्ठानिक परिधान की सामग्री ‘सन’ के रूप में व्यक्त किया गया है।
- source_word: אֲשֶׁר לָבַשׁ
  choice: जिन्हें उसने ... पहना था
  rationale: संबंधवाचक उपवाक्य उन वस्त्रों की पहचान कराता है जिन्हें हारून ने प्रवेश के अवसर पर धारण किया था; हिंदी में पूर्वकालिक संबंध ‘पहना था’ से स्वाभाविक है।
- source_word: בְּבֹאוֹ
  choice: प्रवेश करते समय
  rationale: पूर्वसर्ग सहित क्रियार्थक संज्ञा कालगत परिस्थिति बताती है; संदर्भ में किसी पवित्र क्षेत्र के भीतर जाने के लिए ‘प्रवेश करते समय’ स्पष्ट और स्वाभाविक है।
- source_word: הַקֹּדֶשׁ
  choice: पवित्रस्थान
  rationale: हिब्रू में पद सामान्यतः ‘पवित्र [स्थान]’ है; यह अनुवाद उसकी व्यापकता बनाए रखता है और मुख्य पाठ में उसे स्वतः ‘परमपवित्र स्थान’ नहीं बनाता।
- source_word: וְהִנִּיחָם שָׁם
  choice: और वह उन्हें वहीं छोड़ दे
  rationale: הניח यहाँ वस्त्रों को किसी स्थान पर रख छोड़ने का भाव देता है; ‘वहीं छोड़ दे’ रीति या ढंग को अनावश्यक रूप से विशिष्ट किए बिना निर्देश स्पष्ट करता है।
theological_decisions:
- issue: הַקֹּדֶשׁ का स्थानगत संकेत
  choice: मुख्य पाठ में ‘पवित्रस्थान’
  alternative: ‘पवित्र धाम’ अथवा व्यापक प्रायश्चित-दिवस संदर्भ के आधार पर अधिक विशिष्ट ‘परमपवित्र स्थान’
  rationale: इस पद में हिब्रू केवल ‘पवित्र [स्थान]’ कहता है और भीतरी कक्ष का अधिक पूर्ण पद प्रयोग नहीं करता। इसलिए मुख्य पाठ स्रोत की अस्पष्टता बनाए रखता है, जबकि संभावित अधिक विशिष्ट समझ को पादटिप्पणी में बताया गया है।
translation_notes:
  register: आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध हिंदी। अनुष्ठानिक क्रम के लिए ‘तब’ तथा विध्यर्थक क्रियाएँ रखी गई हैं। ‘पवित्रस्थान’ को संयुक्त रूप में रखा गया है ताकि उपासना-स्थल के पारिभाषिक प्रयोग का संकेत मिले।
