  text: וְ/רָחַ֨ץ אֶת בְּשָׂר֤/וֹ בַ/מַּ֨יִם֙ בְּ/מָק֣וֹם קָד֔וֹשׁ וְ/לָבַ֖שׁ אֶת בְּגָדָ֑י/ו וְ/יָצָ֗א וְ/עָשָׂ֤ה אֶת עֹֽלָת/וֹ֙ וְ/אֶת עֹלַ֣ת הָ/עָ֔ם וְ/כִפֶּ֥ר בַּעֲד֖/וֹ וּ/בְעַ֥ד הָ/עָֽם־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/024.yaml
  text: He shall wash his body with water in a holy place[a], put on his garments, come out, and offer his burnt offering and the burnt offering of the people[c][b], and make atonement for himself and for the people.
translation:
  language: hi
  text: वह किसी पवित्र स्थान[b] में जल से अपने शरीर[a] को धोए, अपने वस्त्र पहने और बाहर आए। फिर वह अपनी होमबलि और लोगों की होमबलि चढ़ाए, और अपने लिए तथा लोगों के लिए प्रायश्चित[c] करे।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक रूप से “अपने मांस को।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में “किसी पवित्र स्थान में”; इसका अर्थ अनिवार्य रूप से भीतरी पवित्र कक्ष नहीं है।
    reason: lexical_alternative
  - marker: c
    text: इसका अनुवाद “पाप-निवारण करे” या कुछ अनुष्ठानिक संदर्भों में “शुद्ध करे” भी हो सकता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְרָחַץ
  choice: धोए
  rationale: विधिक निर्देशों की क्रमिक शृंखला में संयोजक सहित पूर्ण क्रिया का यहाँ आदेशात्मक/विध्यर्थक बल है; हिंदी में “धोए” इसे स्वाभाविक रूप से व्यक्त करता है।
- source_word: בְּשָׂרוֹ
  choice: अपने शरीर को
  rationale: शाब्दिक अर्थ “अपना मांस” है, पर अनुष्ठानिक स्नान के संदर्भ में आधुनिक हिंदी का स्वाभाविक और स्पष्ट पद “शरीर” है; शाब्दिक विकल्प पादटिप्पणी में रखा गया है।
- source_word: בַּמַּיִם
  choice: जल से
  rationale: רחץ के साथ यह साधन सूचित करता है; “जल से धोए” स्वाभाविक हिंदी है और गरिमापूर्ण शैली बनाए रखता है।
- source_word: בְּמָקוֹם קָדוֹשׁ
  choice: किसी पवित्र स्थान में
  rationale: מָקוֹם पर निश्चित उपपद नहीं है, इसलिए इसे तकनीकी अर्थ वाले किसी विशिष्ट “पवित्रस्थान” के रूप में निश्चित करना उचित नहीं। “किसी पवित्र स्थान में” इस अनिश्चितता को सुरक्षित रखता है।
- source_word: וְלָבַשׁ אֶת־בְּגָדָיו
  choice: अपने वस्त्र पहने
  rationale: “वस्त्र” अनुष्ठानिक और गरिमापूर्ण संदर्भ के अनुकूल है, जबकि वाक्य आधुनिक हिंदी में सहज रहता है।
- source_word: וְיָצָא
  choice: बाहर आए
  rationale: पवित्र स्थान से बाहर की ओर गति को संदर्भानुसार स्पष्ट और स्वाभाविक रूप में व्यक्त करता है।
- source_word: וְעָשָׂה
  choice: चढ़ाए
  rationale: होमबलि के साथ עשה का शाब्दिक “करे/बनाए” हिंदी में अस्वाभाविक होगा; बलि-संबंधी प्रचलित क्रिया “चढ़ाए” अभिप्रेत अनुष्ठानिक कार्य को स्पष्ट करती है।
- source_word: עֹלָתוֹ
  choice: अपना होमबलि
  rationale: עלה के लिए “होमबलि” हिंदी बाइबलीय और बलि-संबंधी संदर्भ में स्थापित, संक्षिप्त और सटीक पद है।
- source_word: עֹלַת הָעָם
  choice: लोगों का होमबलि
  rationale: यह मूल के संबंधवाचक निर्माण को स्पष्ट रखता है और पिछले पद “अपना होमबलि” के साथ समानांतरता बनाए रखता है।
- source_word: וְכִפֶּר
  choice: प्रायश्चित करे
  rationale: याजकीय बलि-विधान में כפר के व्यापक अनुष्ठानिक और धर्मवैचारिक अर्थ को यह मानक पद सुरक्षित रखता है, बिना उसे प्रायश्चित के किसी एक सिद्धांत तक सीमित किए।
- source_word: בַּעֲדוֹ וּבְעַד הָעָם
  choice: अपने लिए तथा लोगों के लिए
  rationale: בעד के प्रतिनिधिक/लाभार्थक भाव को संक्षिप्त और स्वाभाविक हिंदी में व्यक्त करता है।
theological_decisions:
- issue: लैव्यव्यवस्था के बलि-विधान में כפר का अनुवाद
  choice: प्रायश्चित करे
  alternative: पाप-निवारण करे; शुद्ध करे
  rationale: यहाँ महायाजक अपने और लोगों के लिए बलियाँ चढ़ाता है। “प्रायश्चित करे” मूल शब्द के स्थापित और व्यापक अर्थ को बनाए रखता है; “पाप-निवारण” उसके निष्प्रभावीकरण के पक्ष पर और “शुद्ध करे” कुछ अनुष्ठानिक संदर्भों में शोधन के पक्ष पर बल दे सकता है। मुख्य पाठ में किसी एक संकीर्ण व्याख्या को आरोपित नहीं किया गया।
translation_notes:
  register: आधुनिक मानक हिंदी में सहज, गरिमापूर्ण और विधिक-अनुष्ठानिक शैली रखी गई है। “जल,” “वस्त्र,” “होमबलि” और “प्रायश्चित” जैसे पद धार्मिक संदर्भ के अनुरूप हैं, पर वाक्यरचना सामान्य पाठक के लिए सरल रखी गई है।
