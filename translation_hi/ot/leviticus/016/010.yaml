  text: וְ/הַ/שָּׂעִ֗יר אֲשֶׁר֩ עָלָ֨ה עָלָ֤י/ו הַ/גּוֹרָל֙ לַ/עֲזָאזֵ֔ל יָֽעֳמַד חַ֛י לִ/פְנֵ֥י יְהוָ֖ה לְ/כַפֵּ֣ר עָלָ֑י/ו לְ/שַׁלַּ֥ח אֹת֛/וֹ לַ/עֲזָאזֵ֖ל הַ/מִּדְבָּֽרָ/ה־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/010.yaml
  text: But the goat on which the lot for Azazel fell shall be presented alive before Yahweh[a], to make atonement over it[b], to send it away into the wilderness to Azazel.
translation:
  language: hi
  text: पर जिस बकरे पर अज़ाज़ेल के लिए चिट्ठी निकले, उसे याहवे के सामने जीवित खड़ा किया जाए, उस पर प्रायश्चित करने के लिए और उसे अज़ाज़ेल के लिए वीराने में भेज देने के लिए।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְהַשָּׂעִיר
  choice: पर जिस बकरे
  rationale: שָׂעִיר यहाँ नर बकरे को सूचित करता है; हिंदी में अनुष्ठानिक संदर्भ के कारण ‘बकरा’ पर्याप्त और स्वाभाविक है। वְ को पिछले पद के दूसरे बकरे से विरोध दिखाने के लिए ‘पर’ कहा गया है।
- source_word: אֲשֶׁר עָלָה עָלָיו הַגּוֹרָל
  choice: जिस ... के लिए ... चिट्ठी निकले
  rationale: यह चिट्ठी डालकर चयन किए जाने का हिब्रू मुहावरा है। ‘चिट्ठी निकले’ आधुनिक हिंदी में स्वाभाविक है और अनुष्ठानिक चयन का भाव बनाए रखता है।
- source_word: לַעֲזָאזֵל
  choice: अज़ाज़ेल के लिए
  rationale: עֲזָאזֵל का अर्थ विवादित है। लिप्यंतरण मुख्य पाठ में संभावित नाम, स्थान/सत्ता अथवा हटाए जाने से जुड़े पद के बीच की अस्पष्टता को समय से पहले नहीं सुलझाता।
- source_word: יָעֳמַד חַי
  choice: जीवित खड़ा किया जाए
  rationale: 'होफाल रूप का कारक-कर्मवाच्य भाव सुरक्षित रखा गया है: बकरे को खड़ा किया जाता है। ‘जीवित’ दूसरे, बलि किए गए बकरे से स्पष्ट विरोध दिखाता है।'
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: ईश्वरीय नाम יהוה को ‘याहवे’ के रूप में लिप्यंतरित किया गया है; לִפְנֵי का अनुष्ठानिक अर्थ ‘के सामने’ स्वाभाविक और सटीक है।
- source_word: לְכַפֵּר עָלָיו
  choice: उस पर प्रायश्चित किया जाए
  rationale: כפר के अनुष्ठानिक अर्थ के लिए ‘प्रायश्चित’ और עַל के लिए ‘पर’ रखा गया है, ताकि यह अनिर्णीत रहे कि बकरा प्रायश्चित का लाभ पाने वाला है या वह वस्तु जिस पर अनुष्ठान किया जाता है।
- source_word: לְשַׁלַּח אֹתוֹ
  choice: उसे ... भेज दिया जाए
  rationale: उद्देश्यसूचक infinitive को ‘ताकि ... भेज दिया जाए’ से व्यक्त किया गया है; ‘भेज दिया जाए’ दूर हटाए जाने का भाव देता है।
- source_word: הַמִּדְבָּרָה
  choice: वीराने में
  rationale: दिशासूचक प्रत्यय गति को वीराने की ओर दर्शाता है; ‘वीराने में भेजना’ वर्तमान हिंदी में स्वाभाविक है और निर्जन प्रदेश का अर्थ देता है।
theological_decisions:
- issue: עֲזָאזֵל का अर्थ
  choice: अज़ाज़ेल (लिप्यंतरण)
  alternative: हटा दिया जाने वाला बकरा; पूर्ण हटाया जाना; वीराने से जुड़ा नाम/स्थान
  rationale: पद की व्युत्पत्ति और संकेत विवादित हैं। मुख्य पाठ में लिप्यंतरण वास्तविक अस्पष्टता और अनुष्ठानिक तनाव को सुरक्षित रखता है; व्याख्यात्मक संभावना पादटिप्पणी में दी गई है।
- issue: לְכַפֵּר עָלָיו का संबंध
  choice: उस पर प्रायश्चित किया जाए
  alternative: उसके लिए प्रायश्चित किया जाए
  rationale: हिब्रू עַל का अधिक प्रत्यक्ष रूप ‘पर’ है। यह अनुवाद यह निर्धारित नहीं करता कि बकरा प्रायश्चित का हितग्राही है या अनुष्ठान का माध्यम/विषय।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और सामान्य पाठक के लिए सुबोध रखी गई है। ‘जीवित खड़ा किया जाए’ मूल के कर्मवाच्य-कारक बल को बनाए रखता है, जबकि ‘अज़ाज़ेल’ और ‘उस पर’ पाठ की वास्तविक व्याख्यात्मक अस्पष्टताओं को सुरक्षित रखते हैं।
