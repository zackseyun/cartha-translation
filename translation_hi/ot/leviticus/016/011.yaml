source:
  edition: WLC
  text: וְ/הִקְרִ֨יב אַהֲרֹ֜ן אֶת פַּ֤ר הַֽ/חַטָּאת֙ אֲשֶׁר ל֔/וֹ וְ/כִפֶּ֥ר בַּֽעֲד֖/וֹ וּ/בְעַ֣ד בֵּית֑/וֹ וְ/שָׁחַ֛ט אֶת פַּ֥ר הַֽ/חַטָּ֖את אֲשֶׁר לֽ/וֹ־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/011.yaml
  text: Aaron shall present the bull of the sin offering that is for himself[a], and he shall make atonement for himself and for his household[b]; then he shall slaughter the bull of the sin offering that is for himself.
translation:
  language: hi
  text: हारून अपने लिए पापबलि का बैल[a] प्रस्तुत करेगा और अपने तथा अपने घराने[b] के लिए प्रायश्चित करेगा; फिर वह अपने लिए पापबलि के बैल का वध करेगा।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “पापबलि के लिए बैल।”
    reason: lexical_alternative
  - marker: b
    text: इब्रानी में, “अपने और अपने घर के लिए”; यहाँ “घराना” उसके घर के लोगों को दर्शाता है।
    reason: lexical_alternative
lexical_decisions:
- source_word: וְהִקְרִיב
  choice: सामने लाएगा
  rationale: हिफ़इल रूप का अर्थ बलिदान-संदर्भ में निकट लाना या प्रस्तुत करना है। ‘सामने लाएगा’ पशु को विधिपूर्वक प्रस्तुत करने का भाव देता है और आगे होने वाले वध को समय से पहले इसमें नहीं मिलाता।
- source_word: פַּר הַחַטָּאת
  choice: पापबलि के बैल
  rationale: यह पद बैल और पापबलि के बीच संबंध बताता है। यह चयन प्रचलित बलिदान-संबंधी शब्दावली रखते हुए स्वाभाविक हिन्दी देता है।
- source_word: אֲשֶׁר לוֹ
  choice: अपने लिए
  rationale: इस अनुष्ठानिक संदर्भ में पद केवल स्वामित्व नहीं, बल्कि हारून के अपने पक्ष में नियत पशु को दर्शाता है।
- source_word: וְכִפֶּר
  choice: प्रायश्चित करेगा
  rationale: याजकीय बलिदान-संदर्भ में כפר का स्थापित और व्यापक हिन्दी प्रतिरूप ‘प्रायश्चित करना’ है; यह किसी एक विशिष्ट प्रायश्चित-सिद्धांत को नहीं थोपता।
- source_word: בַּעֲדוֹ וּבְעַד בֵּיתוֹ
  choice: अपने तथा अपने घराने के लिए
  rationale: בְּעַד हित या पक्ष में किए गए कार्य को व्यक्त करता है, और בֵּיתוֹ यहाँ भवन नहीं बल्कि उसके घर के लोगों को सूचित करता है।
- source_word: וְשָׁחַט
  choice: फिर ... बलि करेगा
  rationale: यह बलिदान के लिए पशु-वध का मानक क्रियापद है। ‘फिर’ क्रम को स्वाभाविक हिन्दी में स्पष्ट करता है, और ‘बलि करेगा’ अनुष्ठानिक वध को सामान्य हत्या से अलग रखता है।
theological_decisions:
- issue: याजकीय כפר भाषा का अनुवाद
  choice: प्रायश्चित करेगा
  alternative: शुद्ध करेगा / प्रायश्चित संपन्न करेगा
  rationale: यह पारंपरिक याजकीय अर्थ को बनाए रखता है, पर पद में न बताए गए किसी संकीर्ण धार्मिक तंत्र को नहीं जोड़ता।
- issue: אֲשֶׁר לוֹ में स्वामित्व या हित
  choice: अपने लिए
  alternative: जो उसका है
  rationale: अनुष्ठान में बैल हारून की ओर से और उसके हित में नियत है; केवल संपत्ति-संबंध बताना संदर्भगत कार्य को कम स्पष्ट करता।
translation_notes:
  register: आधुनिक मानक हिन्दी का गरिमापूर्ण, सामान्य-पाठक-सुलभ रूप। अनुष्ठानिक पुनरावृत्ति को बनाए रखा गया है। ‘पापबलि’ और ‘प्रायश्चित’ जैसी स्थापित बाइबिलीय शब्दावली प्रयुक्त है, जबकि वाक्य-विन्यास को स्वाभाविक हिन्दी रखा गया है।
