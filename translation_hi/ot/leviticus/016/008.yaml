id: LEV.16.8
reference: Leviticus 16:8
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/נָתַ֧ן אַהֲרֹ֛ן עַל שְׁנֵ֥י הַ/שְּׂעִירִ֖ם גּוֹרָל֑וֹת גּוֹרָ֤ל אֶחָד֙ לַ/יהוָ֔ה וְ/גוֹרָ֥ל אֶחָ֖ד לַ/עֲזָאזֵֽל־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/008.yaml
  text: 'And Aaron shall cast lots over the two goats: one lot for Yahweh and one lot for Azazel[a].'
translation:
  language: hi
  text: और हारून उन दोनों बकरों पर चिट्ठियाँ डालेगा—एक चिट्ठी यहोवा के लिए और एक चिट्ठी अज़ाज़ेल[a] के लिए।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “बलि का बकरा।” इब्रानी शब्द “अज़ाज़ेल” का अर्थ विवादित है; इसे व्यक्तिवाचक नाम, बकरे के कार्य, या दूर हटाने से संबंधित शब्द समझा जा सकता है।
    reason: वैकल्पिक पाठ और विवादित शब्दार्थ को सुरक्षित रखना
lexical_decisions:
- source_word: וְנָתַן
  choice: डालेगा
  rationale: क्रिया का मूल अर्थ ‘देना/रखना’ है, पर ‘चिट्ठियाँ’ और ‘दोनों बकरों पर’ के साथ यह चिट्ठी डालकर निर्णय करने की विधि बताती है; हिंदी में ‘चिट्ठियाँ डालेगा’ स्वाभाविक है।
- source_word: עַל
  choice: पर
  rationale: यह मूल स्थानिक अर्थ ‘पर/ऊपर’ को बनाए रखता है और अनुष्ठान की ठोस छवि सुरक्षित रखता है।
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: उन दोनों बकरों
  rationale: संदर्भ में निश्चित दो बकरे हैं। שָׂעִיר नर बकरे को सूचित कर सकता है, पर हिंदी में ‘बकरा’ स्वयं पुल्लिंग पशु को स्पष्ट करता है।
- source_word: גּוֹרָלוֹת
  choice: चिट्ठियाँ
  rationale: पवित्र निर्णय के लिए डाली जाने वाली lots के लिए आधुनिक, सामान्य हिंदी में ‘चिट्ठियाँ’ सहज और स्पष्ट है।
- source_word: גּוֹרָל אֶחָד
  choice: एक चिट्ठी
  rationale: इब्रानी की दोहराई गई एकवचन अभिव्यक्ति को सीधे बनाए रखा गया है।
- source_word: לַיהוָה
  choice: यहोवा के लिए
  rationale: לְ का नियोजन-सूचक अर्थ ‘के लिए’ है; परमेश्वर के व्यक्तिगत नाम יהוה को हिंदी में प्रचलित लिप्यंतरण ‘यहोवा’ से दिया गया है।
- source_word: לַעֲזָאזֵל
  choice: अज़ाज़ेल के लिए
  rationale: विवादित इब्रानी पद को नाम के रूप में लिप्यंतरित करने से उसका अर्थ अनावश्यक रूप से तय नहीं होता; अन्य सम्भावना पादटिप्पणी में दी गई है।
theological_decisions:
- issue: प्रायश्चित्त-दिवस के अनुष्ठान में עֲזָאזֵל का अर्थ
  choice: मुख्य पाठ में लिप्यंतरित ‘अज़ाज़ेल’
  alternative: ‘बलि का बकरा’ अथवा हटाए जाने से संबंधित कोई पद
  rationale: पद स्वयं स्पष्ट नहीं करता कि यह किसी व्यक्तित्व या स्थान का नाम, बकरे का कार्य, अथवा दूर हटाने से संबंधित शब्द है। लिप्यंतरण इस वास्तविक अस्पष्टता और धर्मवैज्ञानिक तनाव को सुरक्षित रखता है।
translation_notes:
  register: आधुनिक मानक हिंदी, सरल किंतु गरिमापूर्ण अनुष्ठानिक शैली। ‘चिट्ठियाँ डालना’ सामान्य पाठक के लिए स्वाभाविक है। मुख्य पाठ में [a] चिह्न संबंधित विवादित पद के तुरंत बाद रखा गया है।
