language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/לָקַ֖ח אֶת שְׁנֵ֣י הַ/שְּׂעִירִ֑ם וְ/הֶעֱמִ֤יד אֹתָ/ם֙ לִ/פְנֵ֣י יְהוָ֔ה פֶּ֖תַח אֹ֥הֶל מוֹעֵֽד־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/007.yaml
  text: And he shall take the two goats and set them before Yahweh at the entrance of the tent of meeting[a].
translation:
  language: hi
  text: फिर वह दोनों बकरों को लेकर उन्हें याहवे के सामने, मिलाप के तंबू के प्रवेश-द्वार पर खड़ा करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: וְלָקַח
  choice: फिर वह ... लेकर
  rationale: अनुष्ठान संबंधी क्रमिक निर्देश में संयोजक सहित क्रिया अगले कार्य को व्यक्त करती है; ‘फिर’ क्रम को और ‘लेकर’ अगली क्रिया से उसके संबंध को स्वाभाविक हिन्दी में प्रकट करता है।
- source_word: שְׁנֵי הַשְּׂעִירִם
  choice: दोनों बकरों
  rationale: שָׂעִיר यहाँ नर बकरे को सूचित करता है; हिन्दी में ‘बकरा’ स्वयं नर पशु के लिए स्पष्ट और स्वाभाविक है। निश्चितता और जोड़ी का भाव ‘दोनों’ से व्यक्त होता है।
- source_word: וְהֶעֱמִיד אֹתָם
  choice: उन्हें ... खड़ा करे
  rationale: עמד के हिफ़ील रूप का ठोस अर्थ ‘खड़ा करना’ है। यह अनुष्ठानिक प्रस्तुति का संकेत देते हुए भी मूल की भौतिक क्रिया को बनाए रखता है।
- source_word: לִפְנֵי יְהוָה
  choice: याहवे के सामने
  rationale: לִפְנֵי का स्थानिक और संबंधपरक अर्थ ‘के सामने/उपस्थिति में’ है। יְהוָה को व्यक्तिगत वाचा-नाम के रूप में लिप्यंतरित किया गया है।
- source_word: פֶּתַח
  choice: प्रवेश-द्वार पर
  rationale: यह शब्द किसी स्थान के खुलने या प्रवेश की जगह को दर्शाता है; ‘प्रवेश-द्वार’ आधुनिक हिन्दी में स्थान को स्पष्ट करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलाप का तंबू
  rationale: यह पद उस तंबू का नाम है जहाँ निर्धारित भेंट/मिलन होता है। ‘मिलाप का तंबू’ प्रचलित, सुबोध और स्रोत के ‘तंबू’ रूपक के निकट है।
theological_decisions:
- issue: ईश्वरीय नाम יְהוָה का अनुवाद
  choice: याहवे
  alternative: यहोवा; प्रभु
  rationale: मूल पाठ में सामान्य उपाधि नहीं, चार अक्षरों वाला व्यक्तिगत ईश्वरीय नाम है। ‘याहवे’ उसे नाम के रूप में सुरक्षित रखता है; ‘प्रभु’ नाम को उपाधि में बदल देता, जबकि ‘यहोवा’ एक पारंपरिक परंतु भाषावैज्ञानिक दृष्टि से कम संभावित स्वरांकन है।
translation_notes:
  register: भाषा आधुनिक, गरिमापूर्ण और निर्देशात्मक रखी गई है। ‘खड़ा करे’ विधिक-अनुष्ठानिक आदेश का भाव देता है, और वाक्य-विन्यास हिन्दी में सहज रहते हुए मूल के स्थान-संबंध को सुरक्षित रखता है।
