  text: כְּתֹֽנֶת בַּ֨ד קֹ֜דֶשׁ יִלְבָּ֗שׁ וּ/מִֽכְנְסֵי בַד֮ יִהְי֣וּ עַל בְּשָׂר/וֹ֒ וּ/בְ/אַבְנֵ֥ט בַּד֙ יַחְגֹּ֔ר וּ/בְ/מִצְנֶ֥פֶת בַּ֖ד יִצְנֹ֑ף בִּגְדֵי קֹ֣דֶשׁ הֵ֔ם וְ/רָחַ֥ץ בַּ/מַּ֛יִם אֶת בְּשָׂר֖/וֹ וּ/לְבֵשָֽׁ/ם־־־־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/004.yaml
  text: He shall put on the holy linen tunic[a], and the linen undergarments shall be on his body; he shall tie the linen sash around himself and wrap the linen turban around himself. These are holy garments[b]. He shall wash his body with water then put them on.
translation:
  language: hi
  text: वह सन का पवित्र अंगरखा पहने, और सन के अधोवस्त्र उसके शरीर[a] पर हों। वह सन का कमरबंद अपनी कमर में बाँधे और सन की पगड़ी अपने सिर पर लपेटे। ये पवित्र वस्त्र हैं। वह अपने शरीर को पानी से धोए, फिर इन्हें पहने।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: शाब्दिक अर्थ “उसके मांस पर”; इसी प्रकार आगे “अपने शरीर को” का शाब्दिक अर्थ “अपने मांस को” है।
    reason: lexical_alternative
lexical_decisions:
- source_word: כְּתֹנֶת
  choice: अंगरखा
  rationale: यह शरीर पर पहने जाने वाले याजकीय वस्त्र को दर्शाता है। ‘अंगरखा’ आधुनिक हिन्दी में गरिमापूर्ण और समझने योग्य है तथा सामान्य ‘वस्त्र’ से अधिक विशिष्ट है।
- source_word: בַּד
  choice: सन
  rationale: याजकीय वस्त्रों के इस संदर्भ में यह सन के कपड़े को सूचित करता है। मूल पाठ में वस्त्र की गुणवत्ता के लिए अलग विशेषण न होने के कारण ‘उत्तम सन’ नहीं जोड़ा गया।
- source_word: קֹדֶשׁ
  choice: पवित्र
  rationale: यहाँ वस्त्रों का उपासना और याजकीय सेवा के लिए अलग किया जाना व्यक्त होता है। ‘पवित्र’ קדש का प्रचलित और प्रसंगानुकूल हिन्दी रूप है।
- source_word: מִכְנְסֵי בַד
  choice: सन के अधोवस्त्र
  rationale: यह शरीर के निचले भाग पर सीधे पहने जाने वाले याजकीय वस्त्र हैं। ‘अधोवस्त्र’ सटीक, वर्तमान और गरिमापूर्ण है।
- source_word: עַל בְּשָׂרוֹ
  choice: उसके शरीर पर
  rationale: בשר का शाब्दिक अर्थ ‘मांस’ है, पर वस्त्र पहनने के प्रसंग में ‘शरीर’ स्वाभाविक हिन्दी है और आशय को स्पष्ट रखता है।
- source_word: אַבְנֵט
  choice: कमरबंद
  rationale: यह कपड़े का बाँधा जाने वाला याजकीय पट्टा है। हिन्दी में ‘कमरबंद’ उसके रूप और उपयोग दोनों को स्पष्ट करता है।
- source_word: יַחְגֹּר
  choice: अपनी कमर में बाँधे
  rationale: क्रिया अपने चारों ओर कसकर बाँधने का भाव रखती है। लक्ष्य स्थान स्पष्ट करना हिन्दी में स्वाभाविक है।
- source_word: מִצְנֶפֶת
  choice: पगड़ी
  rationale: यह याजकीय सिर-वस्त्र का मानक और सर्वसुलभ हिन्दी नाम है।
- source_word: יִצְנֹף
  choice: अपने सिर पर लपेटे
  rationale: क्रिया सिर-वस्त्र को लपेटने या बाँधने का ठोस भाव देती है; ‘लपेटे’ उस विशेषता को सामान्य ‘पहने’ से बेहतर सुरक्षित रखता है।
- source_word: וְרָחַץ בַּמַּיִם אֶת בְּשָׂרוֹ
  choice: अपने शरीर को पानी से धोए
  rationale: यह मूल के अनुष्ठानिक शारीरिक धोने को सहज हिन्दी में व्यक्त करता है, बिना ‘स्नान’ जैसी अतिरिक्त विधि निर्दिष्ट किए।
- source_word: וּלְבֵשָׁם
  choice: फिर इन्हें पहने
  rationale: प्रसंग में धोने के बाद पवित्र वस्त्र पहनने का क्रम है। ‘इन्हें’ का बहुवचन प्रत्यय सभी बताए गए वस्त्रों की ओर लौटता है।
theological_decisions:
- issue: वस्त्रों की पवित्रता का स्वरूप
  choice: ‘ये पवित्र वस्त्र हैं’
  alternative: ‘ये धार्मिक प्रतीक वाले वस्त्र हैं’ अथवा ‘ये पावन वस्त्र हैं’
  rationale: मूल पाठ वस्त्रों को याजकीय सेवा के लिए पवित्र बताता है, पर उनके किसी अतिरिक्त प्रतीकात्मक या सिद्धान्तगत अर्थ की व्याख्या नहीं करता।
- issue: בשרו का अनुष्ठानिक संदर्भ में अर्थ
  choice: मुख्य पाठ में ‘शरीर’
  alternative: ‘मांस’
  rationale: यह शैलीगत और शब्दार्थगत चयन है। हिन्दी में वस्त्र शरीर पर होने और शरीर को पानी से धोने की बात स्वाभाविक है; ‘मांस’ यहाँ अनचाहे धर्मवैज्ञानिक अर्थ जगा सकता है। शाब्दिक रूप पादटिप्पणी में दिया गया है।
- issue: धोने और वस्त्र पहनने का क्रम
  choice: ‘धोए, फिर इन्हें पहने’
  alternative: ‘धोए और इन्हें पहने’
  rationale: अंतिम וְרָחַץ ... וּלְבֵשָׁם कथानक-निर्देश में क्रमिक क्रियाएँ प्रस्तुत करता है। ‘फिर’ उस स्वाभाविक अनुक्रम को व्यक्त करता है, बिना कोई अतिरिक्त अनुष्ठानिक अंतराल निर्धारित किए।
translation_notes:
  register: भाषा आधुनिक मानक हिन्दी में रखी गई है। ‘अंगरखा’, ‘अधोवस्त्र’, ‘कमरबंद’ और ‘पगड़ी’ याजकीय परिधान के लिए स्पष्ट तथा गरिमापूर्ण शब्द हैं। विधिसूचक क्रियाओं में ‘पहने’, ‘बाँधे’, ‘लपेटे’ और ‘धोए’ का समान निर्देशात्मक रूप रखा गया है।
