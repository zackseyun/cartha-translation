source:
  edition: WLC
  text: בְּ/זֹ֛את יָבֹ֥א אַהֲרֹ֖ן אֶל הַ/קֹּ֑דֶשׁ בְּ/פַ֧ר בֶּן בָּקָ֛ר לְ/חַטָּ֖את וְ/אַ֥יִל לְ/עֹלָֽה־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/003.yaml
  text: 'With this Aaron shall enter the Holy Place: with a bull from the herd for a sin offering[b][a], and a ram for a burnt offering.'
translation:
  language: hi
  text: 'हारून इस प्रकार पवित्रस्थान में प्रवेश करे: पापबलि[b] के लिए गाय-बैलों के झुंड में से एक बैल[a] और होमबलि के लिए एक मेढ़ा।'
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: इब्रानी का शाब्दिक अर्थ है, “एक बैल, गाय-बैलों का पुत्र”; यह गाय-बैलों में से एक नर पशु के लिए प्रयुक्त मुहावरा है।
    reason: lexical_alternative
  - marker: b
    text: या “शुद्धिकरण-बलि।” इब्रानी शब्द पाप से संबंध के साथ-साथ अनुष्ठानिक शुद्धि पर भी बल दे सकता है।
    reason: alternative_reading
lexical_decisions:
- source_word: בְּזֹאת
  choice: इसी प्रकार
  rationale: यह पदबंध साधन या रीति बता सकता है। यहाँ आगे बताई गई बलि-सामग्री के साथ प्रवेश करने की विधि दी गई है; इसलिए स्वाभाविक हिन्दी में ‘इसी प्रकार’ उपयुक्त है।
- source_word: יָבֹא
  choice: प्रवेश करे
  rationale: विधिक प्रसंग में अपूर्ण क्रिया निर्देशात्मक है। ‘प्रवेश करे’ उसके आदेशात्मक भाव को स्वाभाविक हिन्दी में व्यक्त करता है।
- source_word: אֶל־הַקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: प्रायश्चित्त-दिवस के प्रसंग में यह पवित्र तंबू के उस विशिष्ट पवित्र क्षेत्र को दर्शाता है जहाँ हारून प्रवेश करता है। ‘पवित्रस्थान’ पारंपरिक, संक्षिप्त और प्रसंगानुकूल है।
- source_word: בְּפַר בֶּן־בָּקָר
  choice: गाय-बैलों में से एक बछड़ा
  rationale: शाब्दिक रूप से ‘एक बैल, गाय-बैलों का पुत्र’ एक इब्रानी मुहावरा है। ‘गाय-बैलों में से एक बछड़ा’ पशु का वर्ग और अपेक्षाकृत युवा नर पशु—दोनों को सहज हिन्दी में व्यक्त करता है; शाब्दिक रूप पादटिप्पणी में दिया गया है।
- source_word: לְחַטָּאת
  choice: पापबलि के लिए
  rationale: बलिदानी व्यवस्था में חַטָּאת का प्रचलित अर्थ ‘पापबलि’ है। अनुष्ठानिक शुद्धि पर बल देने वाला विकल्प पादटिप्पणी में सुरक्षित रखा गया है।
- source_word: וְאַיִל
  choice: और ... एक मेढ़ा
  rationale: אַיִל का सीधा अर्थ ‘मेढ़ा’ है।
- source_word: לְעֹלָה
  choice: होमबलि के लिए
  rationale: עֹלָה उस बलि का मानक पद है जो वेदी पर पूर्णतः जलाई जाती थी; हिन्दी बाइबलीय प्रयोग में ‘होमबलि’ सुविदित और संक्षिप्त है।
theological_decisions:
- issue: बलिदानी विधान में חַטָּאת का अर्थ
  choice: पापबलि
  alternative: शुद्धिकरण-बलि
  rationale: ‘पापबलि’ स्थापित और व्यापक रूप से समझा जाने वाला अनुवाद है, जबकि यह बलि अनुष्ठानिक शुद्धि भी करती है। उस अर्थगत तनाव को मिटाने के बजाय वैकल्पिक अनुवाद पादटिप्पणी में रखा गया है।
translation_notes:
  register: आधुनिक मानक हिन्दी में गरिमापूर्ण और सहज विधिक शैली रखी गई है। ‘पवित्रस्थान’, ‘पापबलि’ और ‘होमबलि’ जैसे परिचित धार्मिक पद बनाए गए हैं, पर कठिन इब्रानी मुहावरे को मुख्य पाठ में स्वाभाविक किया गया है।
