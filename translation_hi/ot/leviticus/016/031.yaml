source:
  edition: WLC
  text: שַׁבַּ֨ת שַׁבָּת֥וֹן הִיא֙ לָ/כֶ֔ם וְ/עִנִּיתֶ֖ם אֶת נַפְשֹׁתֵי/כֶ֑ם חֻקַּ֖ת עוֹלָֽם־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/031.yaml
  text: It is a Sabbath of complete rest for you[a], and you shall humble yourselves; it is a permanent statute.
translation:
  language: hi
  text: यह तुम्हारे लिए पूर्ण विश्राम का सब्त होगा, और तुम अपने आप को दीन करोगे[a]; यह सदा की विधि है।
  philosophy: optimal-equivalence
  footnotes:
  - marker: a
    text: या, “अपने आप को दुःख देना”; परंपरागत रूप से इसमें उपवास और आत्म-संयम सम्मिलित समझे गए हैं।
    reason: lexical_alternative
lexical_decisions:
- source_word: שַׁבַּת
  choice: सब्त
  rationale: तोरा में यह एक निश्चित उपासना-संबंधी और धर्मवैधानिक पद है, इसलिए इसे केवल सामान्य ‘विश्राम-दिन’ नहीं बनाया गया।
- source_word: שַׁבָּתוֹן
  choice: पूर्ण विश्राम
  rationale: שַׁבַּת שַׁבָּתוֹן की बलवर्धक अभिव्यक्ति को स्वाभाविक आधुनिक हिन्दी में व्यक्त करता है।
- source_word: הִיא לָכֶם
  choice: यह तुम्हारे लिए ... होगा
  rationale: समुदाय को संबोधित विधिक कथन को हिन्दी में स्वाभाविक रूप से व्यक्त करता है; प्रसंग में इसका नियमात्मक भाव बना रहता है।
- source_word: וְעִנִּיתֶם
  choice: तुम अपने आप को दीन करना
  rationale: प्रायश्चित-दिवस के प्रसंग में आत्म-दमन और नम्रता के व्यापक भाव को रखता है, बिना मुख्य पाठ में इसे केवल उपवास तक सीमित किए।
- source_word: נַפְשֹׁתֵיכֶם
  choice: अपने आप को
  rationale: यहाँ נֶפֶשׁ बहुवचन प्रत्यय सहित प्रतिवर्ती मुहावरे का भाग है; शाब्दिक ‘अपने प्राणों को’ आधुनिक हिन्दी में भ्रामक हो सकता है।
- source_word: חֻקַּת עוֹלָם
  choice: सदा की विधि
  rationale: स्थायी और पीढ़ियों तक लागू रहने वाले धर्मवैधानिक आदेश को संक्षिप्त, प्रतिष्ठित और परिचित हिन्दी में व्यक्त करता है।
theological_decisions:
- issue: प्रायश्चित-दिवस पर आत्म-दमन की आज्ञा का अर्थ
  choice: मुख्य पाठ में व्यापक अभिव्यक्ति ‘अपने आप को दीन करना’ रखी गई।
  alternative: ‘अपने आप को दुःख देना’ या विशेष रूप से ‘उपवास करना’।
  rationale: इब्रानी ענה + נפשׁ व्यापक मुहावरा है। परंपरा में इसमें उपवास और आत्म-संयम सम्मिलित समझे गए हैं, पर मूल पाठ सीधे ‘उपवास’ क्रिया का प्रयोग नहीं करता; इसलिए संकीर्ण अर्थ को मुख्य पाठ में नहीं थोपा गया।
translation_notes:
  register: आधुनिक मानक हिन्दी का सरल, गरिमापूर्ण धर्मवैधानिक स्वर। ‘सब्त’ तकनीकी तोराई पद के रूप में रखा गया है और ‘पूर्ण विश्राम’ से द्विरुक्त इब्रानी अभिव्यक्ति का बल स्पष्ट किया गया है।
