id: LEV.16.17
reference: Leviticus 16:17
language:
  code: hi
  name: Hindi
  native_name: हिन्दी
  variant: modern standard Hindi in Devanagari
source:
  edition: WLC
  text: וְ/כָל אָדָ֞ם לֹא יִהְיֶ֣ה בְּ/אֹ֣הֶל מוֹעֵ֗ד בְּ/בֹא֛/וֹ לְ/כַפֵּ֥ר בַּ/קֹּ֖דֶשׁ עַד צֵאת֑/וֹ וְ/כִפֶּ֤ר בַּעֲד/וֹ֙ וּ/בְעַ֣ד בֵּית֔/וֹ וּ/בְעַ֖ד כָּל קְהַ֥ל יִשְׂרָאֵֽל־־׀־־׃
base_translation:
  language: en
  yaml_path: translation/ot/leviticus/016/017.yaml
  text: And no man shall be in the tent of meeting when he enters to make atonement in the holy place, until he comes out. And he shall make atonement for himself, and for his household, and for all the assembly of Israel.
translation:
  language: hi
  text: जब वह पवित्रस्थान में प्रायश्चित करने के लिए मिलापवाले तंबू में प्रवेश करे, तब उसके बाहर आने तक कोई भी व्यक्ति तंबू में न रहे। वह अपने लिए, अपने घराने के लिए और इस्राएल की सारी सभा के लिए प्रायश्चित करे।
  philosophy: optimal-equivalence
lexical_decisions:
- source_word: כָל־אָדָם
  choice: कोई भी व्यक्ति
  rationale: निषेध के साथ यह स्वाभाविक हिंदी में 'कोई भी व्यक्ति' है; אָדָם यहाँ सामान्यतः मनुष्य/व्यक्ति को सूचित करता है।
- source_word: אֹהֶל מוֹעֵד
  choice: मिलापवाला तंबू
  rationale: इस स्थिर पवित्रस्थान-संज्ञा का परिचित और अर्थपूर्ण हिंदी रूप।
- source_word: לְכַפֵּר
  choice: प्रायश्चित करने के लिए
  rationale: כפר के अनुष्ठानिक अर्थ को बनाए रखता है और प्रसंग में स्वाभाविक है।
- source_word: בַּקֹּדֶשׁ
  choice: पवित्रस्थान में
  rationale: स्थानवाचक पूर्वसर्ग और पवित्र क्षेत्र—दोनों को संक्षेप में व्यक्त करता है।
- source_word: בֵּיתוֹ
  choice: अपने घराने
  rationale: यहाँ בַּיִת केवल भवन नहीं, बल्कि याजक के परिवार/गृहस्थी को दर्शाता है।
- source_word: כָּל־קְהַל יִשְׂרָאֵל
  choice: इस्राएल की सारी सभा
  rationale: קהל के सामुदायिक और औपचारिक भाव को सुरक्षित रखता है।
theological_decisions:
- issue: כפר का अनुष्ठानिक-धर्मवैज्ञानिक अर्थ
  choice: प्रायश्चित करना
  alternative: शुद्ध करना / दोष ढाँपना
  rationale: पाठ स्वयं क्रिया की प्रक्रिया को और संकीर्ण रूप से परिभाषित नहीं करता; 'प्रायश्चित' प्रचलित व्यापक पद है और वैकल्पिक सिद्धान्तों में से किसी एक को आरोपित नहीं करता।
- issue: पवित्रस्थान में प्रवेश के समय पूर्ण एकांत
  choice: उसके बाहर आने तक कोई भी व्यक्ति तंबू में न रहे
  alternative: कोई पुरुष तंबू में न हो
  rationale: आज्ञा का सार्वत्रिक निषेध स्पष्ट रहता है; हिंदी में 'व्यक्ति' मूल אָדָם के सामान्य मानवीय संदर्भ को स्वाभाविक ढंग से व्यक्त करता है।
translation_notes:
  register: आधुनिक मानक हिंदी, गरिमापूर्ण और सामान्य पाठक के लिए स्पष्ट। मूल वाक्य के कालक्रम और तीन क्रमिक लाभार्थियों—स्वयं, घराना, इस्राएल की सभा—को बनाए रखा गया है।
